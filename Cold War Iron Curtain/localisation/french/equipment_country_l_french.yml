 NIC_infantry_equipment_0:0 "Fusil américain, calibre .30-06, modèle 1903"
 NIC_infantry_equipment_0_short:0 "M1903 Springfield"
 NIC_infantry_equipment_0_desc:0 "Le M1903 Springfield, officiellement appelé « United States Rifle, Caliber .30-06, Model 1903 », est un fusil militaire américain à répétition, à verrou et à chargeur de cinq cartouches. Il s'agit d'un fusil à verrou de type Mauser avec un canon de 24 pouces, un chargeur à 5 cartouches à colonne décalée contenu dans la crosse et une crosse monobloc à poignée droite. Il tire des cartouches de calibre .30-06 à grande vitesse."
 NIC_infantry_equipment_1:0 "Fusil américain, calibre .30, M1"
 NIC_infantry_equipment_1_short:0 "M1 Garand"
 NIC_infantry_equipment_1_desc:0 "Le M1 Garand est une arme imposante conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre .30 qui a été largement utilisé pendant la Seconde Guerre mondiale. Il fait partie des premières armes à utiliser un système de rechargement à gaz pour recharger une nouvelle cartouche après le tir. Il utilise des chargeurs chargés par le haut du fusil et peut être équipé d'accessoires, notamment la grenade antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu emblématique et est toujours utilisé par les équipes d'entraînement modernes aux États-Unis."
 NIC_infantry_equipment_2:0 "Fusil Automático Ligero"
 NIC_infantry_equipment_2_short:0 "FN FAL"
 NIC_infantry_equipment_2_desc:0 "Le FAL (Fusil Automático Ligero, fusil automatique léger) est un fusil de combat conçu en Belgique par Dieudonné Saive et fabriqué par FN Herstal. L'armée nicaraguayenne disposait à la fois du FN FAL belge et de sa version israélienne, le ROMAT, plus léger."
 NIC_infantry_equipment_3:0 "IMI Galil SAR/ARM"
 NIC_infantry_equipment_3_short:0 "Galil"
 NIC_infantry_equipment_3_desc:0 "Au milieu des années 70, le Nicaragua a reçu des variantes IMI Galil SAR et ARM en 5,56 × 45 mm et 7,62 × 51 mm."
 NIC_infantry_equipment_4:0 "Fusil américain, 5,56 mm, M16A2"
 NIC_infantry_equipment_4_short:0 "M16A2"
 NIC_infantry_equipment_4_desc:0 "Après avoir constaté le manque de fiabilité fréquent de cette arme dans les jungles du Vietnam, le corps des Marines américains a demandé qu'elle soit repensée. En 1982, des modifications et des améliorations ont été apportées. L'arme était dotée d'un récepteur renforcé, d'un nouveau rayage, d'un boîtier renforcé, d'un meilleur refroidissement grâce à l'utilisation de matériaux différents, d'un support amélioré pour les accessoires et d'un mécanisme interne repensé qui lui conférait un haut niveau de fiabilité. Elle a été utilisée au combat au Liban, en Libye, en Égypte et dans tous les autres conflits auxquels les États-Unis ont participé depuis sa création."
 FIN_infantry_equipment_0:0 "SAKO Sotilaskivääri m/39"
 FIN_infantry_equipment_0_short:0 "M/39"
 FIN_infantry_equipment_0_desc:0 "Le fusil militaire M/39, surnommé « Ukko-Pekka » en référence à l'ancien président Pehr Evind Svinhufvud, a été conçu comme un compromis entre l'armée et la Garde blanche, afin d'uniformiser la production finlandaise du Mosin-Nagant. Le M/39 était largement dérivé du M28-30, mais comprenait certaines modifications proposées par l'armée. Le M/39 intégrait également une crosse semi-pistolet, bien que certains des premiers modèles utilisaient des crosses droites typiques du Mosin-Nagant. Seuls 10 fusils ont été achevés à la fin de la guerre d'hiver, mais 96 800 ont été produits après la guerre d'hiver et utilisés pendant la guerre de continuation. Un petit nombre a également été assemblé à partir de pièces restantes à la fin des années 1960 et dans les années 1970."
 FIN_infantry_equipment_1:0 "Suomi KP/-31"
 FIN_infantry_equipment_1_short:0 "KP/-31"
 FIN_infantry_equipment_1_desc:0 "Le Suomi KP/-31 est un pistolet mitrailleur (SMG) de conception finlandaise qui a été principalement utilisé pendant la Seconde Guerre mondiale. Il est issu du prototype M-22 et du modèle de série KP/-26, qui a été présenté au public en 1925. Il est entré en service en Finlande en 1931 et est resté en usage jusqu'aux années 1980."
 FIN_infantry_equipment_2:0 "Valmet Rynnäkkökivääri 62"
 FIN_infantry_equipment_2_short:0 "RK 62"
 FIN_infantry_equipment_2_desc:0 "Le RK 62 (du finnois rynnäkkökivääri 62, qui signifie « fusil d'assaut 62 ») est un fusil d'assaut fabriqué par Valmet et Sako. Le développement d'un fusil d'assaut finlandais a commencé dans les années 1950. Divers modèles étrangers ont été étudiés, le plus important étant l'AK-47 soviétique. Les premiers prototypes construits étaient inspirés des AK polonais et comportaient des crosses en bois de bouleau teinté. Après avoir testé l'arme, la FDF a décidé de l'adopter avec quelques modifications sous le nom de RK 62."
 FIN_infantry_equipment_3:0 "Valmet Rynnäkkökivääri 62 76"
 FIN_infantry_equipment_3_short:0 "RK 62 76"
 FIN_infantry_equipment_3_desc:0 "version à récepteur en acier estampé, qui ressemble au RK 62 avec des accessoires en plastique de style plus récent, mais qui se caractérise par un récepteur plus léger. Le poids total du RK 62 76 est de 3,27 kg. Contrairement à l'AK-47 et à l'AKM, les pièces internes sont entièrement interchangeables entre le RK 62 et le RK 62 76, la seule différence étant le récepteur."
 FIN_infantry_equipment_4:0 "SAKO Rynnäkkökivääri 95 taittoperä"
 FIN_infantry_equipment_4_short:0 "RK-95 TP"
 FIN_infantry_equipment_4_desc:0 "Le RK 95 a été adopté en nombre relativement restreint par les forces armées finlandaises dans les années 1990. Le RK 95 TP présentait à l'origine de nombreuses améliorations, notamment un sélecteur de mode de tir et un dispositif de bouche permettant de tirer des grenades à fusil, de fixer un silencieux ou une baïonnette."
 SWE_infantry_equipment_0:0 "HVA Gevär m/96"
 SWE_infantry_equipment_0_short:0 "Gevar m/96"
 SWE_infantry_equipment_0_desc:0 "Les « Mausers suédois » sont une famille de fusils à verrou basés sur une variante améliorée du modèle 1893 de Mauser, mais utilisant la cartouche 6,5 × 55 mm et intégrant des éléments de conception uniques à la demande de la Suède."
 SWE_infantry_equipment_1:0 "Carl Gustafs SG Kulsprutepistol m/45 B"
 SWE_infantry_equipment_1_short:0 "Kpist m/45 B"
 SWE_infantry_equipment_1_desc:0 "Le pistolet mitrailleur modèle 45, également connu sous le nom de Carl Gustav M/45 et Swedish K SMG, est un pistolet mitrailleur suédois de calibre 9×19 mm conçu par Gunnar Johnsson."
 SWE_infantry_equipment_2:0 "HVA Automatkarbin 4"
 SWE_infantry_equipment_2_short:0 "Ak 4"
 SWE_infantry_equipment_2_desc:0 "L'Automatkarbin 4, ou Carabine automatique 4, est une copie suédoise du fusil G3 ouest-allemand."
 SWE_infantry_equipment_3:0 "Carl Gustafs SG Automatkarbin 5"
 SWE_infantry_equipment_3_short:0 "Ak 5"
 SWE_infantry_equipment_3_desc:0 "L'Ak 5 ou Automatkarbin 5 (« carabine automatique 5 », « carabine automatique » étant le terme suédois désignant un fusil d'assaut) est la version suédoise du fusil d'assaut FN FNC, avec certaines modifications, principalement pour adapter l'arme au climat suédois partiellement subarctique. L'Ak 5 est le fusil de service des forces armées suédoises. L'Ak 5 a remplacé l'Ak 4 (une version produite sous licence du Heckler & Koch G3) dans l'armée suédoise."
 SWE_infantry_equipment_4:0 "Bofors Automatkarbin 5C"
 SWE_infantry_equipment_4_short:0 "Ak 5C"
 SWE_infantry_equipment_4_desc:0 "Au début du XXIe siècle, l'armée suédoise souhaitait se doter d'un fusil d'assaut plus moderne afin de l'intégrer dans un futur programme destiné aux soldats suédois. Ce fusil devait être équipé d'un système d'intégration de rails, offrir une meilleure ergonomie et une fiabilité accrue. Au lieu d'acheter un nouveau fusil d'assaut, la Suède a choisi de modifier la gamme de fusils Ak 5(B) déjà en service, réduisant ainsi les risques et les coûts liés au programme."
 ISR_infantry_equipment_0:0 "Sten Mark V"
 ISR_infantry_equipment_0_short:0 "Sten"
 ISR_infantry_equipment_0_desc:0 "Lancé en 1944, le Sten Mark V est essentiellement une version améliorée et plus élaborée du Mk 2. Les modifications apportées comprenaient une poignée pistolet en bois, une poignée avant verticale en bois, une crosse en bois et un support pour baïonnette."
 ISR_infantry_equipment_1:0 "Rov've Mitta'enn"
 ISR_infantry_equipment_1_short:0 "Romat"
 ISR_infantry_equipment_1_desc:0 "Confrontée à des défis logistiques liés à la grande diversité des armes à feu anciennes en service, l'armée israélienne a décidé de remplacer les anciens fusils à verrou allemands et britanniques par un nouveau fusil à chargement automatique. En 1955, l'armée israélienne a décidé d'adopter le FN FAL comme fusil d'infanterie standard, sous le nom de Rov've Mitta'enn ou Romat, abréviation de « fusil à chargement automatique ». La version du FAL commandée par l'armée israélienne se déclinait en deux variantes de base, semi-automatique standard et automatique à canon lourd, et était chambrée pour des munitions OTAN de 7,62 mm."
 ISR_infantry_equipment_2:0 "Fusil automatique IMI Galil"
 ISR_infantry_equipment_2_short:0 "Galil AR"
 ISR_infantry_equipment_2_desc:0 "À la fin des années 60 et au début des années 70, le fusil d'assaut principal de l'armée israélienne, le Romat, a commencé à montrer ses faiblesses."
 ISR_infantry_equipment_3:0 "Fusil automatique IMI Galil Mitrailleuse"
 ISR_infantry_equipment_3_short:0 "Galil ARM"
 ISR_infantry_equipment_3_desc:0 "À la fin des années 60 et au début des années 70, le fusil d'assaut principal de l'armée israélienne, le Romat, a commencé à montrer ses faiblesses."
 ISR_infantry_equipment_4:0 "IMI M4"
 ISR_infantry_equipment_4_short:0 "M4"
 ISR_infantry_equipment_4_desc:0 "Variante israélienne de la carabine M4. Arme standard des Forces de défense israéliennes, elle a toutefois été progressivement remplacée par le Tavor de l'IWI depuis 2001."
 HOL_infantry_equipment_0:0 "Fusil américain, calibre .30, M1"
 HOL_infantry_equipment_0_short:0 "M1 Garand"
 HOL_infantry_equipment_0_desc:0 "Le M1 Garand est une arme imposante conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre .30 qui a été largement utilisé pendant la Seconde Guerre mondiale. Il fait partie des premières armes à utiliser un système de rechargement à gaz pour recharger une nouvelle cartouche après le tir. Il utilise des chargeurs chargés par le haut du fusil et peut être équipé d'accessoires, notamment la grenade antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu emblématique et est toujours utilisé par les équipes d'entraînement modernes aux États-Unis."
 HOL_infantry_equipment_1:0 "Fusil Automatique Léger"
 HOL_infantry_equipment_1_short:0 "FN FAL"
 HOL_infantry_equipment_2:0 "Fusil Automatique Léger Polymer"
 HOL_infantry_equipment_2_short:0 "FN Fal(p)"
 HOL_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. Du fait de sa prévalence et de son utilisation généralisée au sein des forces armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le surnom de « bras droit du monde libre »."
 HOL_infantry_equipment_3:0 "Fusil Diemaco 5,56 mm C7"
 HOL_infantry_equipment_3_short:0 "C7"
 HOL_infantry_equipment_3_desc:0 "Le Colt Canada C7 est une famille canadienne de fusils militaires, fabriqués par Colt Canada (anciennement Diemaco avant 2005), dont la conception et le fonctionnement sont similaires à ceux du Colt M16A3."
 HOL_infantry_equipment_4:0 "Fusil Diemaco 5,56 mm C7"
 HOL_infantry_equipment_4_short:0 "C7A1"
 HOL_infantry_equipment_4_desc:0 "Le C7A1 (Diemaco C7FT) remplace le guidon/poignée de transport utilisé sur le C7 par un rail Weaver modifié permettant de monter des optiques. Le développement canadien des rails a précédé la normalisation américaine du « rail Picatinny » MIL-STD-1913, de sorte que le « rail canadien » ou « rail Diemaco » diffère légèrement. Il comporte 14 fentes au lieu de 13, et chaque fente est plus étroite. La hauteur du rail est également plus élevée, ce qui permet d'utiliser un guidon de hauteur normale."
 DEN_infantry_equipment_0:0 "Fusil américain, calibre .30, M1"
 DEN_infantry_equipment_0_short:0 "M1 Garand"
 DEN_infantry_equipment_0_desc:0 "Le M1 Garand est une arme imposante conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre .30 qui a été largement utilisé pendant la Seconde Guerre mondiale. Il fait partie des premières armes à utiliser un système de rechargement à gaz pour recharger une nouvelle cartouche après le tir. Il utilise des chargeurs chargés par le haut du fusil et peut être équipé d'accessoires, notamment la grenade antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu emblématique et est toujours utilisé par les équipes d'entraînement modernes aux États-Unis."
 DEN_infantry_equipment_1:0 "Gevær M/50"
 DEN_infantry_equipment_1_short:0 "M/50"
 DEN_infantry_equipment_2:0 "Gevær M/66"
 DEN_infantry_equipment_2_short:0 "M/66"
 DEN_infantry_equipment_3:0 "Gevær M/75"
 DEN_infantry_equipment_3_short:0 "M/75"
 DEN_infantry_equipment_4:0 "Gevær M/95"
 DEN_infantry_equipment_4_short:0 "M/95"
 POR_infantry_equipment_0:0 "Karabiner 98k Espingarda 8 mm Mauser m/938"
 POR_infantry_equipment_0_short:0 "Mauser m/938"
 POR_infantry_equipment_0_desc:0 "Le Mauser-Vergueiro était un fusil à verrou, conçu en 1904 par José Alberto Vergueiro, officier d'infanterie de l'armée portugaise, et fabriqué par Deutsche Waffen und Munitionsfabriken (DWM). Il a été développé à partir du fusil Mauser 98 avec l'introduction d'un nouveau système de verrou dérivé du Gewehr 1888 et du Mannlicher-Schönauer. En dehors du Portugal, cette arme était également connue sous le nom de Mauser portugais."
 POR_infantry_equipment_1:0 "Artillerie Inrichtingen ArmaLite AR-10"
 POR_infantry_equipment_1_short:0 "ArmaLite AR-10"
 POR_infantry_equipment_1_desc:0 "La conception finale d'Artillerie Inrichtingen est connue sous le nom de modèle portugais AR-10. Cette version finale intégrait tout ce qui avait été appris à ce jour sur l'AR-10, y compris les rapports sur les fusils de service de l'infanterie et les essais sur le terrain. Outre un canon plus lourd avec une chambre chromée, un bipied en option et les garde-mains amovibles en plastique/métal du modèle Transitional, la variante portugaise était dotée de tenons de culasse plus larges, d'un extracteur plus puissant, d'un nouveau régulateur de gaz simplifié à trois positions et d'une poignée d'armement avec assistance à l'avant de la culasse."
 POR_infantry_equipment_2:0 "Heckler & Koch G3"
 POR_infantry_equipment_2_short:0 "G3"
 POR_infantry_equipment_2_desc:0 "Modèle original basé sur le CETME Modèle 58 introduit en 1959 et approuvé en 1960. Il était équipé d'une crosse et d'un garde-main en bois."
 POR_infantry_equipment_3:0 "Heckler & Koch G3A3"
 POR_infantry_equipment_3_short:0 "G3A3"
 POR_infantry_equipment_3_desc:0 "La version la plus connue de 1963. Viseur à tambour avec guidon amélioré, cache-flamme/frein de bouche capable de tirer des grenades standard OTAN, crosse fixe en plastique solide et garde-main en plastique qui n'entre pas en contact avec le canon flottant. Le garde-main était disponible en version fine et ventilée ou en version large. Cette dernière permettait de fixer un bipied."
 POR_infantry_equipment_4:0 "Heckler & Koch HK33E"
 POR_infantry_equipment_4_short:0 "HK33E"
 POR_infantry_equipment_4_desc:0 "Le HK33 est un fusil d'assaut de 5,56 mm développé dans les années 1960 par le fabricant d'armes ouest-allemand Heckler & Koch GmbH (H&K), principalement destiné à l'exportation."
 NOR_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par magasin, qui fut l'arme principale de l'Empire britannique et du Commonwealth durant la première moitié du XXe siècle. Il fut le fusil standard de l'armée britannique de 1895 à 1957. Ce fusil fut largement utilisé durant la Seconde Guerre mondiale, notamment en Afrique du Nord, en Italie, dans le Pacifique et en Birmanie, par les forces britanniques et du Commonwealth. L'Australie et l'Inde conservèrent et produisirent le SMLE Mk III* comme fusil standard durant le conflit, et ce fusil resta en service dans l'armée australienne durant la guerre de Corée, jusqu'à son remplacement par le L1A1 SLR à la fin des années 1950."
 NOR_infantry_equipment_0:0 "Fusil américain, calibre .30, M1"
 NOR_infantry_equipment_0_short:0 "M1 Garand (NP)"
 NOR_infantry_equipment_2:0 "Heckler & Koch G3"
 NOR_infantry_equipment_2_short:0 "G3"
 NOR_infantry_equipment_2_desc:0 "Modèle original basé sur le CETME Modèle 58 introduit en 1959 et approuvé en 1960. Il était équipé d'une crosse et d'un garde-main en bois."
 NOR_infantry_equipment_3:0 "Kongsberg Våpenfabrikk AG-3"
 NOR_infantry_equipment_3_short:0 "AG-3"
 NOR_infantry_equipment_4:0 "Kongsberg Våpenfabrikk AG-3F1"
 NOR_infantry_equipment_4_short:0 "AG-3F1"
 BEL_infantry_equipment_0:0 "Fabrique Nationale Model 1949"
 BEL_infantry_equipment_0_short:0 "FN-49"
 BEL_infantry_equipment_0_desc:0 "Avec une conception remontant au début des années 1930, le FN-49 est disponible à la fois en fusil semi-automatique et en fusil automatique à tir sélectif avec des chargeurs de 10 cartouches.\nBien que très apprécié pour sa grande qualité de fabrication et sa fiabilité par rapport aux fusils de l'époque, son potentiel commercial était limité, car il n'a pas été développé à temps pour être utilisé pendant la Seconde Guerre mondiale, mais plus tard, alors que de nombreuses armées avaient déjà commencé à adopter des fusils d'assaut à tir sélectif. Un nombre inconnu de FN-49 ont été produits en tant que fusils automatiques à tir sélectif, mais le petit chargeur de 10 cartouches limitait l'utilité de la fonction entièrement automatique."
 BEL_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 BEL_infantry_equipment_1_short:0 "FN FAL"
 BEL_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. Du fait de sa prévalence et de son utilisation généralisée au sein des forces armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le surnom de « bras droit du monde libre »."
 BEL_infantry_equipment_2:0 "Fabrique Nationale Carabine Automatique Légère"
 BEL_infantry_equipment_2_short:0 "FN CAL"
 BEL_infantry_equipment_2_desc:0 "La CAL (Carabine Automatique Légère) était une arme belge fabriquée par la Fabrique Nationale. Il s'agissait du premier fusil de 5,56 mm produit par la Fabrique Nationale. Il ressemblait au très populaire FN FAL de la société, mais était de conception originale. Contrairement au FAL, il fut un échec commercial, bien que son développement ait conduit au FN FNC, qui connut un succès raisonnable."
 BEL_infantry_equipment_3:0 "Fabrique Nationale Carabine M2"
 BEL_infantry_equipment_3_short:0 "FNC M2"
 BEL_infantry_equipment_3_desc:0 "Le FNC a été développé entre 1975 et 1977 pour les essais de normalisation de l'OTAN, comme alternative moins coûteuse au fusil M16 chambré en 5,56 x 45 mm OTAN. La conception du fusil est basée sur le prototype FNC 76, lui-même issu du fusil FN CAL, qui n'a pas connu de succès commercial."
 BEL_infantry_equipment_4:0 "Fabrique Nationale Carabine M3"
 BEL_infantry_equipment_4_short:0 "FNC M3"
 BEL_infantry_equipment_4_desc:0 "Version carabine de la Carabine M2 de la Fabrique Nationale, créée principalement pour répondre aux besoins des unités Para-Commando belges. Elle est dotée d'un canon plus court et est également chambrée en 5,56 x 45 mm OTAN."
 SPR_infantry_equipment_0:0 "Mauser M43 Español"
 SPR_infantry_equipment_0_short:0 "M43 Español"
 SPR_infantry_equipment_0_desc:0 "Les Espagnols ont créé le M43 espagnol, produit à La Corogne de 1944 à 1958. Il s'agissait d'une variante du Karabiner 98k avec une poignée de culasse droite, un garde-visée et une rainure dans la crosse avant, très similaire au Reichspostgewehr précédent."
 SPR_infantry_equipment_1:0 "CETME Model 58 A"
 SPR_infantry_equipment_1_short:0 "CETME Model 58 A"
 SPR_infantry_equipment_1_desc:0 "Le CETME modèle 58 est un fusil d'assaut à tir sélectif en acier embouti produit par le fabricant d'armement espagnol Centro de Estudios Técnicos de Materiales Especiales (CETME). Le modèle 58 utilisait un chargeur de 20 cartouches et était chambré pour la cartouche OTAN 7,62 × 51 mm (bien qu'il ait été initialement conçu pour la cartouche CETME 7,92 × 51 mm, puis pour la cartouche espagnole 7,62 × 51 mm à puissance réduite). Le CETME 58 allait devenir la base du fusil d'assaut allemand Heckler & Koch G3, largement déployé. Des variantes semi-automatiques ont également été produites pour le marché civil."
 SPR_infantry_equipment_2:0 "CETME Model 58 B"
 SPR_infantry_equipment_2_short:0 "CETME Model 58 B"
 SPR_infantry_equipment_2_desc:0 "Le modèle B fut le premier modèle produit. Il était équipé d'un garde-main en acier perforé et chambré pour la cartouche CETME de 7,62 × 51 mm. La cartouche CETME de 7,62 mm différait de la cartouche OTAN standard de 7,62 mm par son projectile plus léger et sa charge propulsive plus faible."
 SPR_infantry_equipment_3:0 "CETME Model L"
 SPR_infantry_equipment_3_short:0 "CETME Model L"
 SPR_infantry_equipment_3_desc:0 "Le modèle L est un fusil d'assaut espagnol de calibre 5,56 × 45 mm OTAN développé à la fin des années 1970 par le CETME (Centro de Estudios Técnicos de Materiales Especiales), un centre public de recherche et développement sur les armes légères situé à Madrid. Ce fusil reprend de nombreux éléments de conception éprouvés que l'institut avait déjà utilisés dans ses fusils de combat CETME modèle 58."
 SPR_infantry_equipment_4:0 "Heckler & Koch G36E"
 SPR_infantry_equipment_4_short:0 "G36E"
 SPR_infantry_equipment_4_desc:0 "Le G36E est un fusil d'assaut de 5,56 mm. Il s'agit de la version export du G36 standard créé par le fabricant d'armes ouest-allemand Heckler & Koch GmbH (H&K)."
 ENG_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n° 4 Mk I"
 ENG_infantry_equipment_0_short:0 "SMLE No. 4"
 ENG_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par magasin, qui fut l'arme principale de l'Empire britannique et du Commonwealth durant la première moitié du XXe siècle. Il fut le fusil standard de l'armée britannique de 1895 à 1957. Ce fusil fut largement utilisé durant la Seconde Guerre mondiale, notamment en Afrique du Nord, en Italie, dans le Pacifique et en Birmanie, par les forces britanniques et du Commonwealth. L'Australie et l'Inde conservèrent et produisirent le SMLE Mk III* comme fusil standard durant le conflit, et ce fusil resta en service dans l'armée australienne durant la guerre de Corée, jusqu'à son remplacement par le L1A1 SLR à la fin des années 1950."
 ENG_infantry_equipment_1:0 "Fusil semi-automatique L1A1"
 ENG_infantry_equipment_1_short:0 "L1A1 SLR"
 ENG_infantry_equipment_1_desc:0 "Le L1A1 SLR est une version britannique du fusil d'assaut belge FN FAL. Il a été produit sous licence et a été utilisé dans de nombreux pays du Commonwealth. Le Royaume-Uni a produit sa propre variante du FN FAL en y intégrant les modifications développées par l'Allied Rifle Committee, le désignant sous le nom de L1A1 Self Loading Rifle (SLR). Les armes ont été fabriquées par la Royal Small Arms Factory Enfield, la Birmingham Small Arms, la Royal Ordnance Factory et la ROF Fazakerley. Après l'arrêt de la production, les pièces de rechange ont été fabriquées par Parker Hale Limited. Le SLR a servi dans les forces armées britanniques de 1954 à environ 1994, avant d'être remplacé par le L85A1 à partir de 1985."
 ENG_infantry_equipment_2:0 "Fusil semi-automatique L1A1 en polymère"
 ENG_infantry_equipment_2_short:0 "L1A1 SLR(p)"
 ENG_infantry_equipment_2_desc:0 "Version polymère plus légère du fusil L1A1 SLR."
 ENG_infantry_equipment_3:0 "L85A1"
 ENG_infantry_equipment_3_short:0 "L85A1"
 ENG_infantry_equipment_3_desc:0 "Le L85A1 est un fusil à gaz à tir sélectif de type bullpup. Le principal avantage du design bullpup réside dans la compacité globale de l'arme. Ce fusil d'assaut est chambré pour la cartouche standard OTAN 5,56 x 45 mm. Il convient de mentionner que le fusil d'assaut L85A1 a connu de nombreux problèmes. En général, il était peu fiable et difficile à entretenir. La fiabilité de cette arme n'était pas un problème majeur, du moins pour le gouvernement britannique, jusqu'à ce que le L85A1 soit utilisé au combat et se révèle très peu performant. Ce n'est qu'en 1997 que Heckler & Koch a été engagé pour résoudre les problèmes des fusils L85A1."
 ENG_infantry_equipment_4:0 "L85A2"
 ENG_infantry_equipment_4_short:0 "L85A2"
 ENG_infantry_equipment_4_desc:0 "Le L85A2 est une version améliorée du fusil d'assaut L85A1 original, qui a été adopté par l'armée britannique en 1984 comme arme standard de l'infanterie. Le fusil d'assaut L85A1 original présentait certains problèmes de fiabilité et de performance, c'est pourquoi cette version a été introduite afin de les résoudre. Actuellement, le L85A2 est le fusil de service standard des forces britanniques. Le L85A2 est alimenté par des chargeurs en forme de boîte de 30 cartouches. Il s'agit des chargeurs STANAG standard de l'OTAN. Les chargeurs d'origine du L85A1 n'étaient pas très robustes et causaient de nombreux problèmes. Les chargeurs et le puits de chargeur ont été améliorés sur le L85A2 afin d'éviter les problèmes d'alimentation."
 CAN_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n° 4 Mk I"
 CAN_infantry_equipment_0_short:0 "SMLE No. 4"
 CAN_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par magasin, qui fut l'arme principale de l'Empire britannique et du Commonwealth durant la première moitié du XXe siècle. Il fut le fusil standard de l'armée britannique de 1895 à 1957. Ce fusil fut largement utilisé durant la Seconde Guerre mondiale, notamment en Afrique du Nord, en Italie, dans le Pacifique et en Birmanie, par les forces britanniques et du Commonwealth. L'Australie et l'Inde conservèrent et produisirent le SMLE Mk III* comme fusil standard durant le conflit, et ce fusil resta en service dans l'armée australienne durant la guerre de Corée, jusqu'à son remplacement par le L1A1 SLR à la fin des années 1950."
 CAN_infantry_equipment_1:0 "Fusil 7,62 mm FN C1"
 CAN_infantry_equipment_1_short:0 "C1"
 CAN_infantry_equipment_1_desc:0 "Le C1 est une version canadienne du fusil d'assaut belge FN FAL. Il a été produit sous licence et a été utilisé dans de nombreux pays du Commonwealth. Le Royaume-Uni a produit sa propre variante du FN FAL en y intégrant les modifications développées par l'Allied Rifle Committee, le désignant sous le nom de L1A1 Self Loading Rifle (SLR). Les armes ont été fabriquées par la Royal Small Arms Factory Enfield, la Birmingham Small Arms, la Royal Ordnance Factory et la ROF Fazakerley. Après l'arrêt de la production, les pièces de rechange ont été fabriquées par Parker Hale Limited. Le SLR a servi dans les forces armées britanniques de 1954 à environ 1994, avant d'être remplacé par le L85A1 à partir de 1985."
 CAN_infantry_equipment_2:0 "Fusil 7,62 mm FN C1A1"
 CAN_infantry_equipment_2_short:0 "C1A1"
 CAN_infantry_equipment_2_desc:0 "Version améliorée du C1."
 CAN_infantry_equipment_3:0 "Fusil Diemaco 5,56 mm C7"
 CAN_infantry_equipment_3_short:0 "C7"
 CAN_infantry_equipment_3_desc:0 "Le Colt Canada C7 est une famille canadienne de fusils militaires, fabriqués par Colt Canada (anciennement Diemaco avant 2005), dont la conception et le fonctionnement sont similaires à ceux du Colt M16A3."
 CAN_infantry_equipment_4:0 "Fusil Diemaco 5,56 mm C7"
 CAN_infantry_equipment_4_short:0 "C7A1"
 CAN_infantry_equipment_4_desc:0 "Le C7A1 (Diemaco C7FT) remplace le guidon/poignée de transport utilisé sur le C7 par un rail Weaver modifié permettant de monter des optiques. Le développement canadien des rails a précédé la normalisation américaine du « rail Picatinny » MIL-STD-1913, de sorte que le « rail canadien » ou « rail Diemaco » diffère légèrement. Il comporte 14 fentes au lieu de 13, et chaque fente est plus étroite. La hauteur du rail est également plus élevée, ce qui permet d'utiliser un guidon de hauteur normale."
 WGR_infantry_equipment_0:0 "Karabiner 98 kurz"
 WGR_infantry_equipment_0_short:0 "Karabiner 98k"
 WGR_infantry_equipment_0_desc:0 "Un fusil à verrou emblématique adopté par la Wehrmacht en 1935 comme fusil de service standard. C'était l'un des derniers développements de la longue lignée de fusils militaires Mauser. Bien que complété par des fusils semi-automatiques et automatiques pendant la Seconde Guerre mondiale, il est resté le principal fusil de service allemand jusqu'à la fin de la guerre en 1945. Malgré le nombre croissant de fusils semi-automatiques et automatiques, le Kar98k continue d'être utilisé des deux côtés du rideau de fer."
 WGR_infantry_equipment_1:0 "Heckler & Koch G1"
 WGR_infantry_equipment_1_short:0 "G1"
 WGR_infantry_equipment_1_desc:0 "Le G1 ou Gewehr 1 est une variante du FN FAL. Il était équipé d'un garde-main en métal embouti identique à ceux utilisés sur le Stg. 58 autrichien, ainsi que sur les FAL néerlandais et grecs, celui-ci étant légèrement plus fin que les garde-mains standard en bois ou en plastique, et présentant des lignes horizontales sur presque toute sa longueur. Les G1 étaient également équipés d'un cache-flamme amovible unique, ce qui constituait une autre distinction externe."
 WGR_infantry_equipment_2:0 "Heckler & Koch G3"
 WGR_infantry_equipment_2_short:0 "G3"
 WGR_infantry_equipment_2_desc:0 "Le G3 ou Gewehr 3 est un fusil d'assaut à tir sélectif de calibre 7,62 × 51 mm OTAN, développé dans les années 1950 par le fabricant d'armes allemand Heckler & Koch en collaboration avec l'agence publique espagnole de conception et de développement CETME."
 WGR_infantry_equipment_3:0 "Heckler & Koch G3A3"
 WGR_infantry_equipment_3_short:0 "G3A3"
 WGR_infantry_equipment_3_desc:0 "La version la plus connue du G3, datant de 1963. Elle est équipée d'un viseur à tambour avec un guidon amélioré, d'un cache-flamme/frein de bouche capable de tirer des grenades standard OTAN, d'une crosse fixe en plastique solide et d'un garde-main en plastique qui n'entre pas en contact avec le canon flottant. Le garde-main était disponible en version fine et ventilée ou en version large. Cette dernière permettait de fixer un bipied."
 WGR_infantry_equipment_4:0 "Heckler & Koch G36"
 WGR_infantry_equipment_4_short:0 "G36"
 WGR_infantry_equipment_4_desc:0 "Le Heckler & Koch G36 (Gewehr 36) est un fusil d'assaut de calibre 5,56 × 45 mm conçu au début des années 1990 par le fabricant d'armes allemand Heckler & Koch pour remplacer le fusil de combat G3 de calibre 7,62 × 51 mm, plus lourd. Il a été adopté par la Bundeswehr en 1997, en remplacement du G3."
 FRA_infantry_equipment_0:0 "MAS-36"
 FRA_infantry_equipment_0_short:0 "MAS-36"
 FRA_infantry_equipment_0_desc:0 "Le MAS-36 est un fusil à verrou conçu en 1927, chambré pour la cartouche française 7,62 x 54 mm, qui a été adopté par l'armée française en 1936 pour remplacer les fusils d'ordonnance Berthier et Lebel. Il a été utilisé pendant la Seconde Guerre mondiale en nombre limité, mais grâce à sa production en série après la fin de la guerre, il a été utilisé dans de nombreux conflits par de nombreux pays différents. Les fusils produits après la Seconde Guerre mondiale ont bénéficié de quelques améliorations en termes d'ergonomie. Il a même existé certaines variantes équipées d'une grenade à fusil amovible et d'un modèle pour tireurs d'élite. Il était prévu qu'il ne s'agisse que d'un fusil provisoire, construit à partir de machines pouvant être utilisées pour fabriquer les fusils à chargement automatique attendus."
 FRA_infantry_equipment_1:0 "MAS-49"
 FRA_infantry_equipment_1_short:0 "MAS-49"
 FRA_infantry_equipment_1_desc:0 "Le MAS-49 est un fusil semi-automatique français qui a remplacé divers fusils à verrou comme fusil d'ordonnance français, produit à partir de 1949. La désignation officielle de l'armée française est « Fusil-semiautomatique 7 mm 5 M. 49 » ou « fusil semi-automatique de 7,5 mm 1949 ».\n\nIl a été produit en quantités limitées et s'est forgé la réputation d'être un fusil précis, fiable et facile à entretenir, en particulier dans des conditions difficiles telles que la jungle ou le désert, où il pouvait parfois être nettoyé avec rien de plus que des chiffons et de l'huile moteur. Il pouvait également tirer des grenades de fusil de 22 mm conformes aux normes de l'OTAN, et intégrait même un viseur de lancement de grenades fixé au bloc de visée avant et un dispositif de coupure de gaz qui empêchait le gaz de pénétrer dans le tube à gaz depuis l'orifice de gaz lors du tir de munitions à blanc pour le lancement de grenades."
 FRA_infantry_equipment_2:0 "MAS-49/56"
 FRA_infantry_equipment_2_short:0 "MAS-49/56"
 FRA_infantry_equipment_2_desc:0 "Une version améliorée appelée MAS-49/56 fut introduite en 1957 et intégrait les enseignements tirés des conflits en Algérie, en Indochine et lors de la crise de Suez. Le fusil fut raccourci et allégé afin d'améliorer la mobilité des troupes mécanisées et aéroportées, et une baïonnette-couteau fut ajoutée. Le lance-grenades intégré au MAS-49 a été remplacé par un compensateur/lance-grenades combiné tirant des grenades de 22 mm conformes aux normes de l'OTAN."
 FRA_infantry_equipment_3:0 "FAMAS F1"
 FRA_infantry_equipment_3_short:0 "FAMAS F1"
 FRA_infantry_equipment_3_desc:0 "Le Fusil d'Assaut de la Manufacture d'Armes de Saint-Étienne, ou FAMAS en abrégé, est un fusil d'assaut de type bullpup conçu et fabriqué en France par MAS. Il s'agit du fusil d'ordonnance actuel de l'armée française. Cette arme tire des munitions de 5,56 x 45 mm et peut être équipée de grenades à fusil APAV 40 et AC 58. Ce fusil a été conçu après l'adoption par les États-Unis du M16 et du calibre 5,56, ce qui a conduit l'armée française à repenser son approche en matière de fusil d'assaut. Le FAMAS F1 a remplacé à la fois le fusil MAS 49/56, qui commençait à vieillir, et le pistolet mitrailleur MAT-49. Le fusil a été conçu autour du concept de chargeurs à usage unique et jetables ; lorsque le budget limité de l'armée française a contraint les soldats à réutiliser les chargeurs jetables à plusieurs reprises, le FAMAS s'est enrayé et a nécessité une intervention immédiate. MAS a finalement fabriqué des chargeurs plus durables pour le FAMAS, ce qui a réduit les dysfonctionnements."
 FRA_infantry_equipment_4:0 "FAMAS G2"
 FRA_infantry_equipment_4_short:0 "FAMAS G2"
 FRA_infantry_equipment_4_desc:0 "Le FAMAS G2 a été développé en 1994 afin de se conformer aux normes de l'OTAN en acceptant les chargeurs standard de l'OTAN et en utilisant un rayage plus serré du canon pour tirer avec précision à la fois les anciennes munitions de 5,56 mm 55 gr et les nouvelles munitions standard de 5,56 mm 62 gr de l'OTAN.\n\nLe G2 comprenait également plusieurs autres améliorations tirées du modèle G1, telles qu'un pontet élargi et des garde-mains améliorés en fibre de verre renforcée au lieu de plastique, ainsi que la possibilité d'utiliser des munitions standard à douille en laiton ainsi que des munitions en acier de fabrication française. La Marine nationale française a acheté le FAMAS G2 en 1995 et l'a distribué à ses fusiliers marins et commandos marins. Cependant, l'armée française a refusé d'acheter le G2, préférant s'en tenir au FAMAS F1 comme fusil principal."
 USA_infantry_equipment_0:0 "Fusil américain, calibre .30, M1"
 USA_infantry_equipment_0_short:0 "M1 Garand"
 USA_infantry_equipment_0_desc:0 "Le M1 Garand est une arme imposante conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre .30 qui a été largement utilisé pendant la Seconde Guerre mondiale. Il fait partie des premières armes à utiliser un système de rechargement à gaz pour recharger une nouvelle cartouche après le tir. Il utilise des chargeurs chargés par le haut du fusil et peut être équipé d'accessoires, notamment la grenade antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu emblématique et est toujours utilisé par les équipes d'entraînement modernes aux États-Unis."
 USA_infantry_equipment_1:0 "Fusil américain, calibre 7,62 mm, M14"
 USA_infantry_equipment_1_short:0 "M14"
 USA_infantry_equipment_1_desc:0 "Le M14, officiellement connu sous le nom de United States Rifle, Caliber 7,62 mm, M14, est un fusil de combat américain chambré en 7,62 x 51 mm OTAN. Il est devenu le fusil standard de l'armée américaine en 1959, remplaçant le fusil M1 Garand dans l'armée américaine en 1958 et dans le Corps des Marines des États-Unis en 1965. Il s'agit du dernier fusil de combat américain distribué en grande quantité au personnel militaire américain. La puissance de la cartouche OTAN 7,62×51 mm lui permettait de bien pénétrer les couvertures et d'atteindre une portée étendue. Il a principalement été utilisé dans de nombreuses guerres en Indochine, mais c'est pendant la guerre du Vietnam qu'il s'est le plus illustré. Après avoir été remplacé par le M16, il a été exporté vers de nombreux pays."
 USA_infantry_equipment_2:0 "Fusil américain, calibre 5,56 mm, M16A1"
 USA_infantry_equipment_2_short:0 "M16A1"
 USA_infantry_equipment_2_desc:0 "La carabine M2 a été jugée largement surpassée par l'AK47 et le StG44 allemand par les responsables militaires américains et, en 1956, le développement du M16 a commencé. En 1959, l'arme a été achevée par Eugene Stoner et James Sullivan. Elle affichait des capacités exceptionnelles et surpassait l'AK47 et l'AKM. Elle disposait notamment d'une puissance de feu bien supérieure à celle de la carabine M2, était plus précise que l'AK47 et utilisait des munitions plus légères sans perte notable de performance. Cependant, bien qu'elle surpassait l'AK47 dans les tests généraux, sa fiabilité médiocre empêchait de la considérer comme son égale. C'était particulièrement le cas au Vietnam, où les défaillances étaient très fréquentes."
 USA_infantry_equipment_3:0 "Fusil américain, 5,56 mm, M16A2"
 USA_infantry_equipment_3_short:0 "M16A2"
 USA_infantry_equipment_3_desc:0 "Après avoir constaté le manque de fiabilité fréquent de cette arme dans les jungles du Vietnam, le corps des Marines américains a demandé qu'elle soit repensée. En 1982, des modifications et des améliorations ont été apportées. L'arme était dotée d'un récepteur renforcé, d'un nouveau rayage, d'un boîtier renforcé, d'un meilleur refroidissement grâce à l'utilisation de matériaux différents, d'un support amélioré pour les accessoires et d'un mécanisme interne repensé qui lui conférait un haut niveau de fiabilité. Elle a été utilisée au combat au Liban, en Libye, en Égypte et dans tous les autres conflits auxquels les États-Unis ont participé depuis sa création."
 USA_infantry_equipment_4:0 "Carabine, calibre 5,56 mm, M4"
 USA_infantry_equipment_4_short:0 "M4 Carbine"
 USA_infantry_equipment_4_desc:0 "La carabine M4 est une version améliorée du M16A2. Sa conception a été initialement confiée à une grande équipe de concepteurs ad hoc en 1984 et son développement s'est achevé en 1993. Après 9 ans de développement, espérons que l'attente en valait la peine. Elle offre une plus grande fiabilité et est beaucoup plus légère et plus courte. Grâce notamment à l'amélioration des matériaux, elle est plus précise que la M16A2. Sa taille compacte la rend plus polyvalente et plus facile à utiliser que la M16A2. La carabine M4 a été utilisée au combat pendant la guerre des États-Unis en Afghanistan, la guerre en Irak et la guerre contre l'État islamique."
 SOV_infantry_equipment_0:0 "Mosin wz. 91/30"
 SOV_infantry_equipment_0_short:0 "Mosin"
 SOV_infantry_equipment_0_desc:0 "Le Mosin-Nagant est un fusil à verrou impérial russe utilisé par l'Empire russe et inspiré d'un modèle importé de France. En 1889, le GAU (ministère de la Défense de l'Empire russe) acquit le Lebel-1886 auprès de la France et chercha à améliorer sa conception. Divers scientifiques et ingénieurs russes ont été engagés par le ministère et dirigés par le capitaine Sergei Mosin et Leon Nagant pour l'améliorer. Après une longue série d'essais et de prototypes, ils ont produit le Mosin Nagant. En 1891, la production du fusil à verrou conçu par Mosin fut lancée. Ce fusil nécessite un long temps de démontage, mais se distingue par sa grande précision. Il fut largement utilisé pendant la guerre russo-japonaise, la Première Guerre mondiale, la guerre civile au sein de l'Empire russe qui conduisit à la formation de l'Union soviétique, la Seconde Guerre mondiale et de nombreux conflits à travers le monde."
 SOV_infantry_equipment_1:0 "Avtomat Kalashnikova 1947"
 SOV_infantry_equipment_1_short:0 "AK-47"
 SOV_infantry_equipment_1_desc:0 "L'AK-47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais il n'entra en service actif qu'en 1948, date à laquelle la version à crosse fixe fut mise en production. Début 1949, l'AK-47 fut adopté par les forces armées soviétiques pour un déploiement massif au sein des unités de première ligne. Doté d'un piston à gaz à longue course, d'un sélecteur de tir avec sécurité, d'un mécanisme de détente et d'alimentation automatique, ainsi que d'autres améliorations de conception, l'AK-47 représentait une nette amélioration par rapport au SKS. Pendant de nombreuses années, l'AK-47 fut considéré comme l'une des armes les plus fiables, faciles à entretenir, à manier et à apprendre au monde."
 SOV_infantry_equipment_2:0 "Avtomat Kalashnikova Modernizirovanniy"
 SOV_infantry_equipment_2_short:0 "AKM"
 SOV_infantry_equipment_2_desc:0 "L’AKM est une version modernisée de l’AK-47, développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l’Armée soviétique en 1959. L’arme fut largement optimisée et repensée pour répondre aux besoins d’une armée en pleine modernisation. De nombreuses pièces furent simplifiées pour une production de masse, et le boîtier de culasse en acier usiné fut remplacé par une tôle d’acier emboutie en forme de U, augmentant considérablement les cadences de fabrication. Grâce à ces modifications, l’AKM devint également bien plus léger, son poids étant réduit d’environ 30%. L’arme fut aussi renforcée pour gagner en solidité et intégra des rails de guidage améliorant le mouvement du bloc culasse. L’AKM fut immédiatement adopté par de nombreux pays communistes et produit en masse pour divers conflits tout au long de sa durée de vie, notamment lors de l’invasion de la Tchécoslovaquie, où il fut utilisé par les deux camps."
 SOV_infantry_equipment_3:0 "Avtomat Kalashnikova 1974"
 SOV_infantry_equipment_3_short:0 "AK-74"
 SOV_infantry_equipment_3_desc:0 "L'AK74 est un fusil d'assaut moderne développé par Mikhaïl Kalachnikov pour remplacer l'AKM en 1974. Il utilise une cartouche plus petite et un canon chromé amélioré avec 4 rainures à droite. Le guidon et le bloc de gaz ont été redessinés pour contenir un canal bas installé à 90 degrés par rapport à l'axe du canon afin de réduire le cisaillement des balles au niveau de la fenêtre d'éjection. De plus, son développement s'est accompagné de divers accessoires, notamment une crosse rembourrée en caoutchouc. Les améliorations apportées à l'AK74 ont permis aux soldats de transporter une plus grande quantité de munitions sur le terrain et de maintenir un volume de tir plus élevé avec une précision accrue à moyenne distance. Il a été utilisé à grands frais pendant le conflit en Afghanistan, où la CIA a versé une somme importante aux moudjahidines pour récupérer un AK74 capturé."
 SOV_infantry_equipment_4:0 "Avtomat Kalashnikova 1974 modernizirovanniy"
 SOV_infantry_equipment_4_short:0 "AK-74M"
 SOV_infantry_equipment_4_desc:0 "L'AK-74M est une variante améliorée de l'AK-74 développée en 1991 par l'usine Izhmash. L'AK-74M a été développé afin d'intégrer de nouveaux matériaux et des avancées technologiques dans la fabrication pour créer une arme améliorée. Il est équipé d'un verrou et d'un porte-verrou allégés qui réduisent le recul produit par le piston à gaz. Le fusil comprend également une crosse en polyamide renforcé de fibre de verre qui peut être tenue sur le côté, un canon amélioré, un couvercle renforcé et plusieurs autres améliorations mineures. Il est également équipé d'un rail pour le montage d'optiques. Le fusil allégé et renforcé était plus facile à manipuler et à transporter et offrait un meilleur support pour les accessoires. Il n'a pas été adopté par l'Union soviétique, car l'URSS s'est effondrée avant qu'il puisse être envisagé, mais il a été adopté par la Fédération de Russie."
 SOV_protection_1: "SN + SSh-40"
 SOV_protection_1_short: "SN + SSh-40"
 SOV_protection_2: "6B5-15 + STSh-81"
 SOV_protection_2_short: "6B5-15 + STSh-81"
 SOV_protection_3: "6B45 + 6B7"
 SOV_protection_3_short: "6B45 + 6B7"
 YUG_infantry_equipment_0:0 "Puska M1924B"
 YUG_infantry_equipment_0_short:0 "M.1924B"
 YUG_infantry_equipment_0_desc:0 "Fusil à verrou inspiré du Gewehr 98 allemand."
 YUG_infantry_equipment_1:0 "Puska M.48 7,9 mm"
 YUG_infantry_equipment_1_short:0 "Zastava M48"
 YUG_infantry_equipment_1_desc:0 "Après la Seconde Guerre mondiale, contrairement à la plupart des autres pays, la Yougoslavie n'a pas adopté le fusil automatique/semi-automatique comme arme de service. Elle a plutôt opté pour le Zastava M48, une variante nationale du Karabiner 98k allemand.\nBien que très similaires en apparence, de nombreuses pièces des fusils yougoslaves et allemands ne sont pas interchangeables, en particulier la culasse et les pièces connexes. Les M48 se distinguent généralement des 98k par leur garde-main supérieur, qui s'étend derrière le viseur arrière et se termine juste devant la bague du récepteur. Le M48 a été conçu avec une crosse similaire à celle du 98k, mais il possède une action et un récepteur de longueur intermédiaire plus courts. La plupart des crosses des M48 sont fabriquées à partir de bois d'orme ou de hêtre plus épais et sont dotées d'une plaque de couche épaisse en acier inoxydable à l'arrière."
 YUG_infantry_equipment_2:0 "Zastava M70"
 YUG_infantry_equipment_2_short:0 "Zastava M70"
 YUG_infantry_equipment_2_desc:0 "Le développement d'un fusil d'assaut national a commencé en 1959 par Zastava avec les séries M59 et M64 de fusils à récepteurs fraisés, canons filetés, garde-mains Zastava familiers, coupures de gaz pour le lancement de grenades, et plusieurs autres différences par rapport à la conception AK de base, telles qu'un dispositif de maintien du verrou ouvert sur le côté droit du récepteur et une poignée de chargement différente des autres modèles AK. Bien que ses performances aient été satisfaisantes, l'armée yougoslave n'a pas adopté ce fusil à l'époque pour diverses raisons.\n\nEn 1970, le feu vert a été donné pour lancer la production en série financée par l'armée des séries M70 et M70A (Automatska Puska Model 1970, « fusil automatique modèle 1970 »), dont le M70A était la version à crosse pliable. Au fil du temps, plusieurs mesures de production visant à réduire les coûts ont été mises en œuvre, telles que la suppression du verrouillage interne du culot et le remplacement des récepteurs fraisés par de l'acier embouti, d'abord de 0,9 mm, puis de 1,5 mm d'épaisseur."
 YUG_infantry_equipment_3:0 "Zastava M80"
 YUG_infantry_equipment_3_short:0 "Zastava M80"
 YUG_infantry_equipment_3_desc:0 "Tout comme l'OTAN et l'Union soviétique, la Yougoslavie a commencé à passer aux cartouches intermédiaires à la fin des années 70. Le résultat fut le Zastava M80. Il s'agit d'une copie presque identique du modèle M70, la principale différence étant que le M80 était chambré pour le calibre 5,56 × 45 mm OTAN.\nLa famille M80 se décline en deux versions distinctes, simplement appelées M80 et M80A. La principale différence entre les deux modèles réside dans la crosse : le M80 est la version de base avec une crosse fixe en bois massif, tandis que le M80A est la version compacte avec une crosse pliable en fil métallique. La crosse métallique se replie sous le récepteur et offre un profil beaucoup plus court, ce qui rend ce modèle idéal pour les parachutistes, les forces spéciales et les équipages de véhicules."
 YUG_infantry_equipment_4:0 "Zastava M90"
 YUG_infantry_equipment_4_short:0 "Zastava M90"
 YUG_infantry_equipment_4_desc:0 "Évolution du M80, le M90 ressemblait davantage aux fusils occidentaux avec son chargeur de type STANAG et son cache-flamme de style occidental.\nLe M90 était destiné à remplacer le M70 dans l'armée yougoslave, mais l'éclatement de la Yougoslavie a perturbé sa production et cette arme reste aujourd'hui rare et n'a jamais été officiellement utilisée, probablement en raison du manque de munitions OTAN de 5,56 × 45 mm."
 SIK_infantry_equipment_0:0 "Mosin wz. 91/30"
 SIK_infantry_equipment_0_short:0 "Mosin"
 SIK_infantry_equipment_0_desc:0 "Le Mosin-Nagant est un fusil à verrou impérial russe utilisé par l'Empire russe et inspiré d'un modèle importé de France. En 1889, le GAU (ministère de la Défense de l'Empire russe) acquit le Lebel-1886 auprès de la France et chercha à améliorer sa conception. Divers scientifiques et ingénieurs russes ont été engagés par le ministère et dirigés par le capitaine Sergei Mosin et Leon Nagant pour l'améliorer. Après une longue série d'essais et de prototypes, ils ont produit le Mosin Nagant. En 1891, la production du fusil à verrou conçu par Mosin fut lancée. Ce fusil nécessite un long temps de démontage, mais se distingue par sa grande précision. Il fut largement utilisé pendant la guerre russo-japonaise, la Première Guerre mondiale, la guerre civile au sein de l'Empire russe qui conduisit à la formation de l'Union soviétique, la Seconde Guerre mondiale et de nombreux conflits à travers le monde."
 SIK_infantry_equipment_1:0 "Avtomat Kalashnikova 1947"
 SIK_infantry_equipment_1_short:0 "AK-47"
 SIK_infantry_equipment_1_desc:0 "L'AK-47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais il n'entra en service actif qu'en 1948, date à laquelle la version à crosse fixe fut mise en production. Début 1949, l'AK-47 fut adopté par les forces armées soviétiques pour un déploiement massif au sein des unités de première ligne. Doté d'un piston à gaz à longue course, d'un sélecteur de tir avec sécurité, d'un mécanisme de détente et d'alimentation automatique, ainsi que d'autres améliorations de conception, l'AK-47 représentait une nette amélioration par rapport au SKS. Pendant de nombreuses années, l'AK-47 fut considéré comme l'une des armes les plus fiables, faciles à entretenir, à manier et à apprendre au monde."
 SIK_infantry_equipment_2:0 "Avtomat Kalashnikova Modernizirovanniy"
 SIK_infantry_equipment_2_short:0 "AKM"
 SIK_infantry_equipment_2_desc:0 "L’AKM est une version modernisée de l’AK-47, développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l’Armée soviétique en 1959. L’arme fut largement optimisée et repensée pour répondre aux besoins d’une armée en pleine modernisation. De nombreuses pièces furent simplifiées pour une production de masse, et le boîtier de culasse en acier usiné fut remplacé par une tôle d’acier emboutie en forme de U, augmentant considérablement les cadences de fabrication. Grâce à ces modifications, l’AKM devint également bien plus léger, son poids étant réduit d’environ 30%. L’arme fut aussi renforcée pour gagner en solidité et intégra des rails de guidage améliorant le mouvement du bloc culasse. L’AKM fut immédiatement adopté par de nombreux pays communistes et produit en masse pour divers conflits tout au long de sa durée de vie, notamment lors de l’invasion de la Tchécoslovaquie, où il fut utilisé par les deux camps."
 SIK_infantry_equipment_3:0 "Avtomat Kalashnikova 1974"
 SIK_infantry_equipment_3_short:0 "AK-74"
 SIK_infantry_equipment_3_desc:0 "L'AK74 est un fusil d'assaut moderne développé par Mikhaïl Kalachnikov pour remplacer l'AKM en 1974. Il utilise une cartouche plus petite et un canon chromé amélioré avec 4 rainures à droite. Le guidon et le bloc de gaz ont été redessinés pour contenir un canal bas installé à 90 degrés par rapport à l'axe du canon afin de réduire le cisaillement des balles au niveau de la fenêtre d'éjection. De plus, son développement s'est accompagné de divers accessoires, notamment une crosse rembourrée en caoutchouc. Les améliorations apportées à l'AK74 ont permis aux soldats de transporter une plus grande quantité de munitions sur le terrain et de maintenir un volume de tir plus élevé avec une précision accrue à moyenne distance. Il a été utilisé à grands frais pendant le conflit en Afghanistan, où la CIA a versé une somme importante aux moudjahidines pour récupérer un AK74 capturé."
 SIK_infantry_equipment_4:0 "Avtomat Kalashnikova 1974 Modernizirovanniy"
 SIK_infantry_equipment_4_short:0 "AK-74M"
 SIK_infantry_equipment_4_desc:0 "L'AK-74M est une variante améliorée de l'AK-74 développée en 1991 par l'usine Izhmash. L'AK-74M a été développé afin d'intégrer de nouveaux matériaux et des avancées technologiques dans la fabrication pour créer une arme améliorée. Il est équipé d'un verrou et d'un porte-verrou allégés qui réduisent le recul produit par le piston à gaz. Le fusil comprend également une crosse en polyamide renforcé de fibre de verre qui peut être tenue sur le côté, un canon amélioré, un couvercle renforcé et plusieurs autres améliorations mineures. Il est également équipé d'un rail pour le montage d'optiques. Le fusil allégé et renforcé était plus facile à manipuler et à transporter et offrait un meilleur support pour les accessoires. Il n'a pas été adopté par l'Union soviétique, car l'URSS s'est effondrée avant qu'il puisse être envisagé, mais il a été adopté par la Fédération de Russie."
 PRC_infantry_equipment_0:0 "Siamese Mauser Type 45"
 PRC_infantry_equipment_0_short:0 "SM-45"
 PRC_infantry_equipment_0_desc:0 "Le SM-45, ou fusil Siamese Mauser Type 45, est un fusil à verrou développé par l'arsenal de Koishikawa en 1903. Ce fusil a été initialement développé dans le cadre du programme de développement militaire du roi Rama V, lancé par crainte de l'expansion occidentale en Orient. L'arme elle-même a été développée sur la base du Gewehr 98, mais avec quelques améliorations notables en termes de maniabilité et d'ergonomie. Le SM-45 a été fabriqué en petites quantités en Chine depuis sa création, mais les Chinois ont principalement eu recours à la production sous licence. Il a été utilisé dans toutes les guerres impliquant la sphère orientale depuis sa création."
 PRC_infantry_equipment_1:0 "Fusil d'assaut ZB-56"
 PRC_infantry_equipment_1_short:0 "ZB-56"
 PRC_infantry_equipment_1_desc:0 "Le ZB-56 est un fusil d'assaut automatique conçu par la RPC en 1956, dérivé de l'AK-47. Il a été utilisé dans tous les conflits auxquels la Chine a participé depuis sa création. Le ZB-56 présente plusieurs différences par rapport à l'AK-47. Il est fabriqué avec un boîtier de culasse fraisé et un système de visée entièrement intégré. Son canon est également plus lourd et plus similaire à celui du RPK, à l'exception de l'absence de renfort au niveau du tenon. De plus, il ne possède pas de filetage à la bouche. Grâce à sa fiabilité légendaire et à sa grande facilité d'utilisation, le ZB-56 continue d'être utilisé par des armées du monde entier. Son coût de fabrication est également légèrement inférieur à celui de l'AK-47."
 PRC_infantry_equipment_2:0 "Fusil d'assaut ZB-56"
 PRC_infantry_equipment_2_short:0 "ZB-63"
 PRC_infantry_equipment_2_desc:0 "Le ZB-63 est un fusil d'assaut automatique conçu par l'arsenal du gouvernement chinois en 1963. Il a été utilisé au combat au Vietnam, au Cambodge, en Afghanistan, au Kosovo et au Mali. L'arme dispose d'un mécanisme interne similaire à celui de l'AK et d'un mécanisme externe et d'un boîtier similaires à ceux du SKS. Cela permet à l'arme de trouver un compromis entre la portée et la puissance de feu automatique, la rendant ainsi comparable à un ZB-56 à longue portée. L'arme a une portée de tir effective deux fois supérieure à celle du SKS et une cadence de tir légèrement supérieure à celle du ZB-56. Elle est très fiable et son prix est modique. Au cours des 10 années de sa fabrication, plus d'un million de fusils ont été produits."
 PRC_infantry_equipment_3:0 "Fusil d'assaut ZB-81"
 PRC_infantry_equipment_3_short:0 "ZB-81"
 PRC_infantry_equipment_3_desc:0 "Le ZB-81 est un fusil d'assaut automatique multi-armes conçu par Norinco en 1981. Il a été utilisé dans tous les conflits sino-américains depuis sa création, notamment la guerre du Vietnam, l'Afghanistan et le Sri Lanka. Version améliorée du ZB-63, le ZB-81 n'en possède cependant pas la même portée efficace. Plus puissant que le ZB-63, il intègre des éléments du Dragunov, du SKS et de l'AK-47. De plus, sa durée de vie est supérieure à celle de l'AK-47. Enfin, il est compatible avec les accessoires sous le canon."
 PRC_infantry_equipment_4:0 "Fusil automatique QBZ-95"
 PRC_infantry_equipment_4_short:0 "QBZ-95"
 PRC_infantry_equipment_4_desc:0 "Le QBZ-95 est un fusil automatique léger moderne de type bullpup conçu par Duo Yingxian en 1991. Cette arme a été utilisée au Pakistan et en Birmanie. Le QBZ-95 a une portée similaire à celle du ZB-81, mais avec une puissance de feu nettement supérieure et une cadence de tir plus élevée. Elle a été conçue pour remplacer le ZB-81 grâce à un mécanisme bullpup qui raccourcit le fusil et facilite son rechargement. Le fusil est fabriqué à partir de matériaux polymères, dispose d'un verrou rotatif et d'un piston à course courte. Il résiste à la corrosion et aux intempéries, ce qui le rend particulièrement adapté à une utilisation dans des conditions extrêmes."
 PRC_explosives_1:0 "Type 42"
 PRC_explosives_2:0 "Type 67"
 CHI_infantry_equipment_0:0 "Fusil Tchang Kaï-chek"
 CHI_infantry_equipment_0_short:0 "Type 24"
 CHI_infantry_equipment_0_desc:0 "Le fusil Type Chiang Kai-shek, également connu sous le nom de fusil Zhongzheng/Jiang Jieshi (selon la romanisation du chinois), fusil Generalissimo et Type 24, du nom du généralissime chinois Chiang Kai-shek, était une copie chinoise du fusil allemand Standardmodell, précurseur du Karabiner 98k."
 CHI_infantry_equipment_1:0 "Fusil américain, calibre 7,62 mm, M14"
 CHI_infantry_equipment_1_short:0 "M14"
 CHI_infantry_equipment_1_desc:0 "Le M14, officiellement connu sous le nom de United States Rifle, Caliber 7,62 mm, M14, est un fusil de combat américain chambré en 7,62 x 51 mm OTAN. Il est devenu le fusil standard de l'armée américaine en 1959, remplaçant le fusil M1 Garand dans l'armée américaine en 1958 et dans le Corps des Marines des États-Unis en 1965. Il s'agit du dernier fusil de combat américain distribué en grande quantité au personnel militaire américain. La puissance de la cartouche OTAN 7,62×51 mm lui permettait de bien pénétrer les couvertures et d'atteindre une portée étendue. Il a principalement été utilisé dans de nombreuses guerres en Indochine, mais c'est pendant la guerre du Vietnam qu'il s'est le plus illustré. Après avoir été remplacé par le M16, il a été exporté vers de nombreux pays."
 CHI_infantry_equipment_2:0 "Fusil de combat Type 57 de l'arsenal d'État de la République de Chine"
 CHI_infantry_equipment_2_short:0 "T57"
 CHI_infantry_equipment_2_desc:0 "Une variante du fusil M14 produite par la République de Chine. Le M14, officiellement connu sous le nom de United States Rifle, Caliber 7,62 mm, M14, est un fusil de combat américain chambré en 7,62 x 51 mm OTAN."
 CHI_infantry_equipment_3:0 "Commandement logistique combiné type 65"
 CHI_infantry_equipment_3_short:0 "T65"
 CHI_infantry_equipment_3_desc:0 "Le T65 est un fusil développé et fabriqué par le Commandement logistique combiné des forces armées de la République de Chine à Taïwan. Inspiré à l'origine de l'Armalite AR-18, qui dispose d'un système à gaz à course courte, le prototype dévoilé en 1975 présentait un fusil fortement influencé par la famille des fusils AR-15, mais avec des viseurs métalliques modifiés, une crosse remodelée et des garde-mains redessinés."
 CHI_infantry_equipment_4:0 "Commandement logistique combiné type 65K2"
 CHI_infantry_equipment_4_short:0 "T65K2"
 CHI_infantry_equipment_4_desc:0 "Une mise à niveau de la gamme de fusils T65. Le modèle T65 a remplacé la poignée de transport des fusils de type M16 par un bloc de visée arrière. La poignée de transport a fait son retour avec le T65K2 (mais était amovible sur la carabine T91). Le T65 utilise des chargeurs compatibles avec les fusils de type AR-15."
 VIE_infantry_equipment_0:0 "MAS Modèle 36"
 VIE_infantry_equipment_0_short:0 "MAS-36"
 VIE_infantry_equipment_0_desc:0 "Un fusil à verrou développé par la France dans les années 1930, principalement utilisé par les forces françaises pendant la Seconde Guerre mondiale et pendant la première guerre d'Indochine. Chambré en 7,5 × 54 mm français, il était réputé pour sa conception robuste, sa fiabilité et sa précision dans des conditions difficiles.\nAu sein de l'ARVN (Armée de la République du Vietnam), le MAS Modèle 36 a connu une utilisation limitée, héritée des forces coloniales françaises après leur retrait. Bien qu'il ait rapidement été éclipsé par des fusils semi-automatiques plus modernes comme le M1 Garand et, plus tard, par des fusils d'assaut, certaines unités ont continué à l'utiliser pendant les premières phases de la guerre du Vietnam, notamment dans des rôles de réserve ou d'entraînement. Sa simplicité le rendait utile pour les forces de défense locales avant d'être progressivement remplacé par l'aide militaire américaine."
 VIE_infantry_equipment_1:0 "MAT-49 SMG"
 VIE_infantry_equipment_1_short:0 "MAT-49"
 VIE_infantry_equipment_1_desc:0 "Le Tieu-lien MAT-49 était un pistolet mitrailleur français, conçu à la fin des années 1940 et chambré en 9x19 mm Parabellum. Compacte, dotée d'un chargeur repliable et d'un système simple à recul, elle est devenue l'arme de base des forces françaises pendant la première guerre d'Indochine.\nDans l'ARVN (Armée de la République du Vietnam), le MAT-49 a été hérité des forces françaises après leur retrait et utilisé principalement par les troupes sud-vietnamiennes au début de la guerre du Vietnam. Sa conception compacte le rendait idéal pour les combats rapprochés, en particulier en milieu urbain et dans la jungle. Cependant, avec l'augmentation de l'aide militaire américaine, le MAT-49 a été progressivement remplacé par des armes à feu américaines plus modernes, telles que le pistolet mitrailleur M3 Grease Gun et le fusil M16. Il a néanmoins continué à être utilisé de manière limitée par les milices locales et les forces irrégulières tout au long du conflit."
 VIE_infantry_equipment_2:0 "Fusil américain, calibre 5,56 mm, M16A1"
 VIE_infantry_equipment_2_short:0 "M16A1"
 VIE_infantry_equipment_2_desc:0 "La carabine M2 a été jugée largement surpassée par l'AK47 et le StG44 allemand par les responsables militaires américains et, en 1956, le développement du M16 a commencé. En 1959, l'arme a été achevée par Eugene Stoner et James Sullivan. Elle affichait des capacités exceptionnelles et surpassait l'AK47 et l'AKM. Elle disposait notamment d'une puissance de feu bien supérieure à celle de la carabine M2, était plus précise que l'AK47 et utilisait des munitions plus légères sans perte notable de performance. Cependant, bien qu'elle surpassait l'AK47 dans les tests généraux, sa fiabilité médiocre empêchait de la considérer comme son égale. C'était particulièrement le cas au Vietnam, où les défaillances étaient très fréquentes."
 VIE_infantry_equipment_3:0 "Luc-quan Cong-xuong AR-73"
 VIE_infantry_equipment_3_short:0 "AR-73"
 VIE_infantry_equipment_3_desc:0 "Le Trung-Lien 73, officiellement connu sous le nom de Calibre 5,56 x 45 mm, AR-73 Mk I, est un fusil d'assaut expérimental sud-vietnamien chambré en 5,56 x 45 mm OTAN et produit par le Luc-Quan Cong-Xuong (atelier d'armes de l'armée de terre). Il a été testé et financé par le président Nguyen-Van-Thieu vers 1972-1975 dans le but de remplacer le fusil M16 et d'autres fusils américains dans l'ARVN afin de réduire la forte dépendance à l'aide militaire américaine. Il s'agit du premier et unique fusil de conception sud-vietnamienne répertorié. Il a été directement influencé par le fusil d'assaut HK-33, utilisé par les forces spéciales américaines, et par l'omniprésent M16. La puissance de la cartouche OTAN 5,56 x 45 mm lui permet de bien pénétrer les couvertures et d'atteindre une portée étendue. Il n'a jamais été beaucoup utilisé pendant la guerre du Vietnam, car il était encore en phase de test juste avant la chute de Saigon."
 VIE_infantry_equipment_4:0 "Fusil d'assaut AR-88 Mk1"
 VIE_infantry_equipment_4_short:0 "AR-88"
 VIE_infantry_equipment_4_desc:0 "Le Trung-lien Xung-kich AR-88 est une version améliorée et modernisée du précédent AR-73 Mk I, développé par le Luc-Quan Cong-Xuong (atelier d'armes de l'armée de terre) sud-vietnamien. Chambré en 5,56 x 45 mm OTAN, l'AR-88 visait à pallier les limites de l'AR-73 tout en améliorant la fiabilité, l'ergonomie et la polyvalence de l'arme pour l'ARVN (Armée de la République du Vietnam).\nAlors que l'AR-73 était une tentative ambitieuse visant à réduire la dépendance vis-à-vis des fusils M16 fournis par les États-Unis, l'AR-88 a introduit plusieurs améliorations après des années d'essais et de retours d'expérience au combat, ainsi que des enseignements tirés des plateformes de fusils respectives d'autres pays."
 VIE_team_weapons_1: "M1919 Browning (mitrailleuse lourde), mortier M1 (mortier)"
 VIE_team_weapons_1_short: "Browning M1919, mortier M1"
 VIE_team_weapons_1_desc: "La M1919 Browning est une mitrailleuse lourde développée en 1919 par John Browning. Cette arme est devenue emblématique après son utilisation célèbre pendant la Grande Guerre de l'émeu, mais elle a également été utilisée pendant la Seconde Guerre mondiale. Elle utilise des munitions de calibre .30, fonctionne par recul court et a une portée effective de 1 500 mètres. Son prédécesseur, le M1917, était refroidi à l'eau, mais le système de refroidissement a été supprimé afin d'alléger l'arme, au détriment du temps de tir. Cela s'est avéré dangereux, car en cas de surchauffe, la poudre pouvait s'échauffer et entraîner des tirs sans avertissement, ce qui conduisait à des tirs incontrôlables. Le mortier M1 est une variante du mortier français Brandt créé par les États-Unis peu avant leur entrée en guerre. Il tire des obus de calibre 81 mm jusqu'à 3 km. Il a été largement utilisé pendant la Seconde Guerre mondiale, ainsi qu'au Vietnam et en Corée."
 VIE_team_weapons_2: "M2 Browning (HMG), mortier M29 (Mortar), M75 (HGL)"
 VIE_team_weapons_2_short: "M2 Browning, mortier M29, M75"
 VIE_team_weapons_2_desc: "Le M2 Browning est une mitrailleuse lourde généralement montée sur des véhicules, mais qui peut également être utilisée comme arme fixe. Elle tire des munitions de calibre .50 et dispose d'une puissance de feu bien supérieure à celle du M1919. Elle a été conçue en 1919 par John Browning et utilisée tout au long de la Seconde Guerre mondiale. Il est similaire au M1919 en termes de complexité et de qualité, mais il est plus lourd et utilise des munitions plus lourdes. Le mortier M29 est un mortier américain conçu en 1952 par une équipe ad hoc pour remplacer le mortier M1. Il peut tirer 4 à 12 coups par minute, est beaucoup plus léger et a une plus grande portée. De plus, il est chromé afin d'améliorer la fiabilité de l'arme et de faciliter son nettoyage. Le M75 HGL est un lance-grenades lourd conçu par Philco-Ford en 1961 et utilisé pendant la guerre du Vietnam. Il est automatique et actionné par un moteur électrique, avec une cadence de tir de 225 coups par minute et une portée maximale de 2045 mètres. Le lanceur lui-même a été très rapidement remplacé en raison d'un certain nombre de problèmes liés à sa fiabilité, son efficacité énergétique et son poids."
 VIE_team_weapons_3: "Mk19 (HGL)"
 VIE_team_weapons_3_short: "Mk19"
 VIE_team_weapons_3_desc: "Le Mk19 est un lance-grenades lourd à recul utilisé dans des emplacements fixes ou sur des véhicules. Il a été conçu en 1966 par NOSL et a été utilisé au Vietnam, pendant la guerre du Golfe, en Afghanistan, en Irak et dans la guerre contre la drogue au Mexique. Le premier modèle du HGL était extrêmement peu fiable et dangereux, mais les modèles ultérieurs se sont révélés très efficaces et plus susceptibles de tuer l'ennemi que l'opérateur. Cette arme peut tirer 40 cartouches de 40 mm par minute à une distance maximale de 1 600 mètres."
 VIE_team_weapons_4: "M85 (HMG), mortier M224 (mortier)"
 VIE_team_weapons_4_short: "Mortier M85, M224"
 VIE_team_weapons_4_desc: "Le M85 est une mitrailleuse puissante conçue dans les années 80 par General Electric pour remplacer le M2 Browning. Il a été utilisé pendant la guerre du Golfe, mais n'a pas beaucoup servi en dehors de ce conflit. Le poids du M2 Browning a conduit l'armée américaine à commander le développement du M85. Le M85 est beaucoup plus léger et dispose de cadences de tir sélectives. Elle peut également être configurée en fonction des pièces qu'elle peut contenir ou de la direction dans laquelle elle peut être alimentée, ce qui ajoute à sa polyvalence. Le mortier M224 a été conçu en 1978 par une équipe ad hoc. Il a été utilisé au combat pendant la guerre du Golfe, en Irak et en Afghanistan, et des prototypes ont été utilisés au Vietnam. Le mortier lui-même était composé de pièces plus légères et plus durables que le M29 et est plus facile à entretenir sur le terrain."
 VIE_team_weapons_5: "XM312 (HMG), XM307 (HGL)"
 VIE_team_weapons_5_short: "XM312, XM307"
 VIE_team_weapons_5_desc: "Le XM312 HMG est dérivé du canon automatique XM307 et est chambré pour des munitions de calibre .50. Le canon automatique XM307 est un HGL automatique doté d'une capacité d'explosion aérienne. Le XM307 a été conçu à la fin des années 90 et le XM312 est sorti en 2000. Tous deux ont été créés par General Dynamics et n'ont pas encore été utilisés au combat. Ils peuvent être rapidement convertis l'un en l'autre sur le terrain, ce qui permet à une unité de passer à des mitrailleuses lourdes ou à des lance-grenades selon les besoins de la situation. Ils sont légers (pour des armes lourdes) et fiables, mais coûteux."
 VIE_squad_weapons_1: "Browning 1918A2 BAR (LMG)"
 VIE_squad_weapons_1_short: "Browning 1918A2"
 VIE_squad_weapons_1_desc: "Le Browning 1918A2 (alias BAR) tire son nom de la personne qui l'a conçu en 1917 pour l'armée américaine, le concepteur John Browning, et non de ce qui arrive aux pantalons des ennemis lorsqu'ils le voient. L'arme elle-même est une mitrailleuse légère d'appui qui utilise un verrou à culasse ascendante et un système à gaz. Elle a une portée effective de 1 500 mètres et est exceptionnellement légère, même pour une mitrailleuse légère. Le BAR a été largement utilisé pendant la Seconde Guerre mondiale, où il a démontré des capacités remarquables."
 VIE_squad_weapons_2: "M79 (GL)"
 VIE_squad_weapons_2_short: "M79"
 VIE_squad_weapons_2_desc: "Le M79 est un lance-grenades à un coup développé en 1960 par l'arsenal de Springfield pour l'armée américaine. Il s'agit d'un lance-grenades à un coup qui tire des grenades de 40 mm. Lors de son utilisation pendant la guerre du Vietnam, il s'est révélé doté d'une puissance de feu incroyable et d'une portée supérieure à celle des grenades à fusil, tout en étant plus portable qu'un mortier, ce qui lui permettait d'aider les combats de l'infanterie et de bien fonctionner contre les véhicules légers ennemis et les ennemis à couvert."
 VIE_squad_weapons_3: "M60 (LMG)"
 VIE_squad_weapons_3_short: "M60"
 VIE_squad_weapons_3_desc: "Le M60 est un LMG développé pour l'armée américaine en 1957 par Saco Defense. Il peut tirer des balles, des traceurs et des obus perforants. Le LMG utilise un piston à gaz à course courte et un mécanisme à culasse ouverte. Le système d'alimentation est une bande désintégrante et sa portée effective est de 1200 mètres. Très peu coûteuse à l'usage, elle est encore utilisée aujourd'hui par l'armée américaine en raison de son faible coût et de sa grande efficacité au combat. Cependant, elle n'est pas fiable dans des conditions extrêmes, en particulier lorsqu'elle est sale. De plus, elle est exceptionnellement lourde pour une mitrailleuse légère, même si elle fait partie des armes de 7,62 mm les plus légères qui existent. Elle a été utilisée au combat au Vietnam, au Cambodge, pendant la guerre du Golfe, en Irak, en Afghanistan et contre Daech."
 VIE_squad_weapons_4: "M249 (LMG), M32 (GL)"
 VIE_squad_weapons_4_short: "M249, M32"
 VIE_squad_weapons_4_desc: "Le M249 est un fusil mitrailleur léger conçu par FN Herstal en 1976. Il est considérablement plus léger et plus fiable que le M60, mais sa puissance de feu globale est moindre. Le M249 a été utilisé dans tous les conflits majeurs impliquant les États-Unis depuis l'invasion du Panama. Grâce à son poids plus léger et à sa plus grande fiabilité, il fonctionne mieux que le M60 dans les environnements non urbains contrôlés et convient mieux comme arme offensive d'escouade. En fait, le M249 a été initialement commandé pour remplacer le M60 en tant qu'arme plus légère. Le lance-grenades M32 est une variante américaine du lance-grenades revolver d'escouade Milkor MGL."
 VIE_squad_weapons_5: "MK48 (LMG), XM25 (GL)"
 VIE_squad_weapons_5_short: "MK48, XM25"
 VIE_squad_weapons_5_desc: "Le MK48 est un LMG développé en 2003 par FN Herstal en collaboration avec le Commandement des opérations spéciales des États-Unis. Il est extrêmement léger pour un LMG et a été largement utilisé par les États-Unis lors des combats en Irak et en Afghanistan. L'arme elle-même est très facile à démonter et peut être réparée sur le terrain pour remplacer les canons surchauffés. Son principal avantage par rapport au M249 est son poids léger et ses pièces beaucoup plus simplifiées, ce qui facilite son entretien et sa fabrication. Le lance-grenades XM25 CDTE est un lance-grenades bullpup moderne développé en 2010 par Heckler & Koch et utilisé pendant la guerre en Afghanistan."
 VIE_specialist_1: "M1903 Springfield (SR)"
 VIE_specialist_1_short: "M1903 Springfield"
 VIE_specialist_1_desc: "Le M1903 Springfield est un fusil à verrou utilisé par les tireurs d'élite pendant la Seconde Guerre mondiale. Il a été conçu par l'arsenal de Springfield en 1903 et a été immédiatement utilisé. Le Springfield est un fusil à verrou de 5 coups qui tire des cartouches .30-06 avec une portée effective de 1 000 mètres. Cependant, sa portée maximale peut atteindre 5 500 mètres. Plus de 3 millions de ces fusils ont été produits et les tireurs d'élite les ont fréquemment utilisés pendant la Seconde Guerre mondiale."
 VIE_specialist_2: "M40 (SR)"
 VIE_specialist_2_short: "M40"
 VIE_specialist_2_desc: "Le M40 est un fusil de précision à verrou développé en 1966 par Remington Arms pour l'USMC. Il tire des cartouches standard de 7,62 x 51 mm et a une portée effective de 900 mètres. Il a été utilisé au Vietnam, pendant la guerre du Golfe, en Afghanistan, en Irak et au Liban. Le M40 est réputé pour sa fiabilité et est relativement facile à entretenir. Il s'est révélé efficace comme fusil de précision anti-infanterie."
 VIE_specialist_3: "M21 (SR)"
 VIE_specialist_3_short: "M21"
 VIE_specialist_3_desc: "Le M21 est l'une des armes les plus sexy jamais créées. Le M21 est un fusil de précision semi-automatique redoutable qui a été utilisé par les États-Unis et tous les autres pays qui ont eu la chance de disposer d'une arme aussi magnifique. Conçu en 1969 par le Marines Weapons Command après avoir été directement inspiré par Dieu, il peut rendre un jugement ultime à une portée effective de 900 mètres et utilise les glorieuses munitions 7,62 x 51 mm. Il peut être alimenté par un chargeur de 5, 10 ou 20 cartouches, selon vos préférences. Il a démontré sa vigueur et ses prouesses inégalées pendant les guerres du Vietnam et d'Irak, et aurait probablement permis de remporter la guerre du Vietnam si l'on en avait envoyé davantage. Il n'est pas surprenant qu'une arme aussi incroyable et légendaire soit toujours utilisée et fasse des ravages aujourd'hui."
 VIE_specialist_4: "Barrett M82 (AMR), M24 (SR)"
 VIE_specialist_4_short: "M82, M24"
 VIE_specialist_4_desc: "Le Barrett M82 est un fusil de précision semi-automatique anti-matériel de type bullpup qui utilise des munitions de calibre .50. Il a été développé en 1980 par Ronnie Barrett, juste à temps pour la guerre en Afghanistan et la guerre en Irak. Il a une portée effective de 2000 mètres et peut pénétrer les murs, tout type de gilet pare-balles et les véhicules légèrement blindés. Le M82 est réputé pour son efficacité et sa capacité anti-matériel. Sa licence est très recherchée par de nombreux pays et est détenue par 54 pays, tandis que d'autres tentent d'obtenir les droits de fabrication ou d'acquérir cette arme. Le M24 est un fusil de précision à verrou utilisé par l'armée américaine. Il a été conçu en 1988 par Remington Arms et commandé pour remplacer le M40 comme fusil de précision standard en service. Il a une portée effective de 875 mètres et utilise des munitions de 7,62 x 51 mm. Il a été utilisé au combat pendant la guerre du Golfe, en Afghanistan, en Irak et en Syrie. Le M24 est équipé d'une lunette amovible gratuite et d'un trépied fixable."
 VIE_specialist_5: "M110 (SR)"
 VIE_specialist_5_short: "M110"
 VIE_specialist_5_desc: "Le M110 est un fusil de précision semi-automatique à verrou rotatif et un fusil de précision de tir de précision (DMR). Il a été initialement développé en 2007 par la Knight's Armament Company et a été commandé après que l'armée américaine ait constaté les effets des tireurs d'élite de l'USSOCOM et lu les rapports d'après-action des tireurs d'élite des forces spéciales dans tout l'Irak. Après un concours impliquant de nombreux modèles différents, le M110 a été sélectionné et Knights a remporté un contrat très important. Il est depuis utilisé en Afghanistan et en Irak. Il a une portée effective d'environ 875 mètres et peut fournir un tir de harcèlement bien au-delà."
 VIE_ammo_explosives_1: "Grenade Mk2 (Grenade), FMJ (Munitions), Mine chimique M1 (Mine)"
 VIE_ammo_explosives_1_short: "Grenade Mk2, FMJ, mine chimique M1"
 VIE_ammo_explosives_1_desc: "La grenade à main MK2 est une grenade anti-personnel utilisée par les États-Unis pendant la Seconde Guerre mondiale et la Première Guerre mondiale. Elle a été conçue en 1918 par une grande équipe ad hoc de concepteurs et a été utilisée par de nombreux pays différents. La grenade elle-même est une simple grenade frangible qui explose environ 4 secondes après avoir retiré la goupille. Un surplus excessif a été créé pendant la Seconde Guerre mondiale et, par conséquent, malgré une production minimale et finalement nulle, elle a été utilisée de manière continue pendant de nombreuses années. La mine chimique M1 est une mine antipersonnel qui contient du gaz moutarde qui se libère lors de la détonation. Elle a été utilisée pendant la Seconde Guerre mondiale et pouvait maintenir une zone interdite après son explosion aussi longtemps que le gaz persistait. La balle Full Metal Jacket est une balle inventée en 1882 par le colonel suisse Eduard Rubin. Cependant, des améliorations ont été apportées à la métallurgie entre cette date et la Seconde Guerre mondiale, et la balle FMJ de la Seconde Guerre mondiale a simplement intégré des matériaux de meilleure qualité dans la conception déjà existante."
 VIE_ammo_explosives_2: "M26 (Grenade), M18 Claymore (Mine)"
 VIE_ammo_explosives_2_short: "M26, M18 Claymore "
 VIE_ammo_explosives_2_desc: "La grenade à main M26 est une grenade à fragmentation conçue par une grande équipe ad hoc en 1950. Elle est entrée en service et a été utilisée pour la première fois au combat pendant la guerre de Corée. Elle était équipée d'un détonateur à friction à retardement et avait une puissance explosive supérieure à celle de la grenade Mk2. De plus, la fragmentation est facilitée par une bobine pré-entaillée à l'intérieur de la grenade qui aide à la fragmentation. La mine claymore M18 est une mine antipersonnel à fragmentation directionnelle développée en 1956 par une grande équipe ad hoc dirigée par Norman Macleod. Elle a été utilisée pendant la guerre du Vietnam, a été installée dans la zone démilitarisée de Corée et pendant la guerre en Irak. Elle utilise un capuchon en plastique M4 pour exploser et est remplie de C4."
 VIE_ammo_explosives_3: "Munitions à grains plus gros, grenade M67"
 VIE_ammo_explosives_3_short: "Munitions à grains plus gros (munitions), grenade M67 (grenade)"
 VIE_ammo_explosives_3_desc: "La grenade à main M67 est une grenade à fragmentation anti-personnel conçue pour remplacer la série M26 qui était utilisée au Vietnam et en Corée. Elle contient un retardateur pyrotechnique et a une capacité explosive supérieure à celle de la M26. Elle est également équipée d'un clip de sécurité pour empêcher que la goupille ne soit retirée accidentellement. Elle a été utilisée dans toutes les guerres menées par les États-Unis depuis le Vietnam. Les munitions AP existent depuis de nombreuses années, leur origine remontant à avant la Première Guerre mondiale, et sont principalement utilisées pour pénétrer les navires de guerre. Vers la Première Guerre mondiale, après l'arrivée des chars sur le champ de bataille, des munitions miniaturisées ont été créées. Finalement, de petits calibres AP ont été créés pour contrer les gilets pare-balles. Les munitions AP modernes ont été créées en 1965 pour répondre à l'augmentation du nombre d'infanteries lourdement blindées et de couvertures d'infanterie."
 VIE_ammo_explosives_4: "Grenades utilitaires (Grenade), Mine antichar M93 (Mine)"
 VIE_ammo_explosives_4_short: "Grenades utilitaires, mines antichars M93"
 VIE_ammo_explosives_4_desc: "Les grenades utilitaires sont des grenades à main qui ont des rôles spécialisés tels que grenades flash, fumigènes, incendiaires, etc. Elles peuvent être utilisées respectivement pour étourdir les ennemis, dissimuler des positions et interdire l'accès à une zone. Les mines M93 sont des mines antichars développées par Textron en 1987. Elles sont capables d'attaquer des cibles situées jusqu'à 100 mètres de leur position. Les mines M93 utilisent des capteurs sismiques et acoustiques pour suivre et identifier les cibles à proximité. Une fois qu'elles ont détecté une cible, elles se tournent vers elle et tirent leur sous-munition, un projectile en tantale de 450 g."
 VIE_ammo_explosives_5: "Munitions modernes (Munitions)"
 VIE_ammo_explosives_5_short: "Munitions modernes"
 VIE_ammo_explosives_5_desc: "À l'ère moderne, il existe un vaste arsenal de différents types de munitions spécialisées pouvant être utilisées dans des situations spécifiques. Les munitions AP modernes pénètrent beaucoup mieux les cibles que les anciennes munitions AP et peuvent atteindre des vitesses plus élevées. Les alliages modernes permettent aux munitions standard d'infliger davantage de dégâts à une cible. Les balles frangibles ou incendiaires sont utiles dans des situations particulières. De plus, les fusils de chasse peuvent être plus efficaces dans les combats modernes grâce aux munitions HE, aux munitions 000, aux balles fléchettes ou aux balles incendiaires."
 VIE_manpats_1: "M1 Bazooka"
 VIE_manpats_1_short: "M1 Bazooka"
 VIE_manpats_1_desc: "Le M1 Bazooka est un lance-roquettes antichar sans recul développé en 1942 par Edward Uhl. Plus de 400 000 unités ont été fabriquées et il a été largement utilisé pendant la Seconde Guerre mondiale, la guerre de Corée et la guerre du Vietnam. Le M1 Bazooka est l'une des premières armes antichars propulsées par fusée. Il pouvait être utilisé contre des bunkers, des véhicules blindés, des nids de mitrailleuses ou des chars. Quelques exemplaires du M1 ont été capturés par les forces allemandes peu après leur mise en service et ont fait l'objet d'une ingénierie inverse pour créer le Panzerschreck. Le M1 coûte très peu cher et des quantités impressionnantes de munitions excédentaires ont été produites, de sorte qu'il a été utilisé dans les guerres suivantes et qu'il est encore utilisé aujourd'hui par les armées à faible budget. Au rythme actuel d'utilisation, cette arme continuera probablement à être utilisée au combat par les armées à faible budget. Cependant, avec le développement mondial entraînant une augmentation des MIC dédiés et les conflits actuels qui l'épuisent, il est peu probable qu'elle soit encore utilisée très longtemps."
 VIE_manpats_2: "M20A1 SuperBazooka"
 VIE_manpats_2_short: "M20A1 SuperBazooka"
 VIE_manpats_2_desc: "Le super bazooka M20A1 est le résultat d'un grand nombre d'améliorations apportées au bazooka par Edward Uhl tout au long de la guerre et jusqu'au milieu des années 50. Il se caractérisait par des pièces moulées légères, un support auxiliaire, un viseur optique, une portée accrue grâce à des munitions améliorées, un mécanisme d'accouplement amélioré, un déclencheur magnétique remplaçant l'allumage à pile, des accessoires métalliques, et pouvait être démonté pour faciliter son transport et son entretien. Ces améliorations en ont fait une arme bien plus performante que le M1, pouvant être utilisée contre des cibles plus résistantes. Il a été utilisé pendant la guerre de Corée et dans de nombreux autres conflits par d'autres pays."
 VIE_manpats_3: "M72 LAW"
 VIE_manpats_3_short: "M72 LAW"
 VIE_manpats_3_desc: "Le M72 LAW est un lance-roquettes antichar léger à un coup, développé par FA Spinale, CB Weeks et PV Choate en 1963. Il a immédiatement remplacé le bazooka dans la production et a été utilisé dans tous les conflits américains depuis sa création. Cette arme est très légère, ce qui permet à l'infanterie régulière de la transporter et de l'utiliser partout où cela est nécessaire. Elle n'est pas rechargeable, mais ne pèse que 2,5 kg, ce qui la rend accessible même à une grand-mère. Sa portée effective est de 200 mètres. Cette arme a été utilisée pendant la guerre en Afghanistan, en Irak, en Somalie, pendant la guerre du Golfe et au Vietnam."
 VIE_manpats_4: "M202 FLASH"
 VIE_manpats_4_short: "M202 FLASH"
 VIE_manpats_4_desc: "Le M202 FLASH est un lance-roquettes incendiaires à tirs multiples conçu en 1978 par une grande équipe ad hoc et utilisé pendant la guerre du Vietnam. Il peut être chargé avec des roquettes incendiaires de 66 mm qui utilisent du TPA pour enflammer une zone après l'explosion. Il peut brûler à une température bien plus élevée que le napalm et génère suffisamment de chaleur et de fumée pour forcer les hélicoptères volant à basse altitude à éviter une zone. Il peut être utilisé comme arme antichar en raison de la chaleur intense qu'il génère sur une grande surface, brûlant efficacement l'équipage d'un véhicule. Le M202 peut également utiliser les roquettes de 66 mm du LAW si l'opérateur a besoin d'utiliser des roquettes directes plutôt que de couvrir une zone de feu. Il n'a pas fait l'objet d'une production officielle à grande échelle, bien que plusieurs centaines de prototypes aient été fabriqués et utilisés au Vietnam."
 VIE_manpats_5: "M141/153 SMAW"
 VIE_manpats_5_short: "M141/153 SMAW"
 VIE_manpats_5_desc: "Le M153 SMAW est un lance-roquettes antichar et anti-fortifications développé en 1984 par McDonnell Douglas. Cette arme a été utilisée au combat pendant la guerre du Golfe, en Afghanistan, en Irak et au Yémen. Le M141 est une arme anti-fortifications à usage unique dédiée à la destruction de bunkers, qui a une portée effective de 1 200 mètres, mais qui peut être utilisée pour atteindre des cibles plus éloignées. Le M153 est une arme réutilisable qui tire des projectiles HEAA ou thermobariques. Le SMAW peut détruire des bâtiments et a un rayon d'explosion très large. Cependant, il dégage une grande quantité de fumée semi-toxique, ce qui rend son utilisation dans un espace clos dangereuse sans protection contre les gaz. Ce problème n'a été résolu qu'avec le développement du SMAW II. Il a été utilisé au combat pendant la guerre du Golfe, en Afghanistan et en Irak."
 VIE_hmg_1: "M45 Quadmount"
 VIE_hmg_1_short: "M45 Quadmount"
 VIE_hmg_1_desc: "Le M45 Quadmount est une arme antiaérienne tractée dotée d'une cadence de tir exceptionnelle grâce à ses 4 mitrailleuses Browning M2. Il est alimenté électriquement et a une portée maximale de 1,6 mile. Il a été développé par la WL Maxson Corporation en 1943 et a été utilisé pendant la Seconde Guerre mondiale, la guerre de Corée et comme emplacement fixe pendant la guerre du Vietnam. Surnommé le « hachoir à viande », il pouvait être utilisé à l'horizontale pour détruire indifféremment des cibles molles et des avions. Le M45 était également monté sur des remorques ou des semi-chenillés pour être utilisé comme canon antiaérien automoteur bon marché."
 VIE_manpads_1: "Redeye I"
 VIE_manpads_1_short: "Redeye I"
 VIE_manpads_1_desc: "Le Redeye est un MANPADS antiaérien créé en 1959 par Convair pour s'adapter aux combats modernes où les avions à réaction pouvaient dépasser ou surpasser les canons antiaériens. Il utilise l'infrarouge pour se diriger vers sa cible. En 1948, l'armée américaine a commencé à rechercher de nouvelles armes de défense aérienne pour remplacer les canons inefficaces. De nombreux concepts différents de roquettes à grande vitesse ont été étudiés, mais aucun n'était suffisamment précis. Au milieu des années 1950, Convair a commencé à étudier l'utilisation du guidage infrarouge pour créer un système de missiles sol-air portable. Convair s'est intéressé aux premiers missiles air-air pour créer son arme et a réussi à la réduire à une taille plus petite. Le Redeye a été utilisé au Vietnam, au Nicaragua et en Afghanistan."
 VIE_manpads_2: "Redeye II"
 VIE_manpads_2_short: "Redeye II"
 VIE_manpads_2_desc: "Le Redeye II est un MANPADS antiaérien développé par General Dynamics en 1967. Il utilise un missile sol-air à guidage infrarouge pour se diriger vers sa cible. Il était équipé d'un ordinateur haut de gamme et bénéficiait d'améliorations générales au niveau des composants et de la conception globale afin d'en accroître la fiabilité. Bien que le Redeye II constituait une amélioration par rapport au Redeye I, il n'a pas été fabriqué en grande série et est resté un prototype, car la plupart de ses améliorations pouvaient simplement être ajoutées au Redeye I. On peut considérer que le développement du Redeye II dans ce contexte consiste à améliorer l'ordinateur du Redeye I et à fabriquer un équipement de meilleure qualité."
 VIE_manpads_3: "Stinger A"
 VIE_manpads_3_short: "Stinger A"
 VIE_manpads_3_desc: "Le Stinger A est le résultat final du projet Redeye II, achevé en 1980 par General Dynamics. Le Stinger A bénéficie d'une refonte complète de l'ensemble du système Redeye et est équipé d'un double chercheur infrarouge et UV afin de mieux déterminer ce qui constitue une contre-mesure et ce qui est la cible réelle. Les munitions du Stinger A contiennent un mélange plus puissant qui lui confère une puissance supérieure à celle de son prédécesseur et lui permet d'atteindre une plus grande portée. Il a démontré une puissance considérable lors de la guerre des Malouines, en Afghanistan, lors de la guerre Iran-Irak et dans de nombreux autres conflits au Moyen-Orient."
 VIE_manpads_4: "Stinger C"
 VIE_manpads_4_short: "Stinger C"
 VIE_manpads_4_desc: "Le Stinger C est une amélioration apportée au Stinger B, achevée vers 1990 par General Dynamics. Le Stinger B était équipé d'un autodirecteur amélioré doté d'un balayage en rosette. Cependant, le Stinger B n'a été produit qu'à 600 exemplaires. Le Stinger C a ajouté davantage de composants informatiques, un logiciel plus performant et un système adaptatif capable de tenter de surmonter les interférences en ajustant ses modules afin d'obtenir la meilleure image possible. Plus de 20 000 unités ont été produites et il a été utilisé au combat en Afghanistan et en Irak. Le projet Stinger continue d'être développé avec l'ajout de nouvelles fonctionnalités mineures et la création de nouvelles variantes à mesure que des améliorations mineures sont apportées."
 VIE_protection_equip_1: "M12 + M1"
 VIE_protection_equip_1_short: "M12 + M1"
 VIE_protection_equip_1_desc: "Pendant la Seconde Guerre mondiale, le gilet pare-balles M12 était utilisé par les États-Unis comme pièce d'armure protectrice capable d'absorber les éclats d'obus et les balles de petit calibre. Il était cependant très encombrant, de sorte que la plupart du temps, le seul uniforme des soldats était l'uniforme Olive Drab en fibre de coton. Malgré cela, le M12 protégeait efficacement les soldats contre les éclats d'obus, à condition que ceux-ci ne touchent pas les zones non couvertes par le gilet. Le casque M1 a été conçu en 1941 par le major Sydenham de l'armée américaine. Il était très efficace pour dévier les tirs dirigés vers la tête, mais pas ceux tirés de côté. Il a été largement utilisé pendant la Seconde Guerre mondiale et est devenu emblématique."
 VIE_protection_equip_2: "M1952A + M1A"
 VIE_protection_equip_2_short: "M1952A + M1A"
 VIE_protection_equip_2_desc: "Le M1952A est un gilet pare-balles utilisé par les États-Unis pendant la guerre du Vietnam et développé en 1952. Il offrait une protection nominale contre les armes de petit calibre et les tirs antiaériens. Ce gilet est relativement léger et comporte des poches intégrées pour transporter des munitions. Il a également été conçu, avec un succès limité, pour isoler de la chaleur. Le M1952A a été remplacé par le M1965A dès l'invention du kevlar. Le M1A est une version améliorée du casque M1, avec des modifications mineures à l'intérieur du casque afin qu'il repose plus facilement sur la tête."
 VIE_protection_equip_3: "PASGT"
 VIE_protection_equip_3_short: "PASGT"
 VIE_protection_equip_3_desc: "PASGT est le nom donné à un ensemble d'équipements de protection développés pour l'infanterie américaine en 1975 par le US Army Soldier Systems Center. Il protège bien mieux l'infanterie que le M1965A, qu'il a remplacé. Composés de plusieurs couches de nylon, le casque et le gilet PASGAT ont été entièrement déployés en 1983. Cependant, malgré une meilleure protection, le PASGAT était extrêmement lourd, encombrant et très inconfortable à des températures extrêmes."
 VIE_protection_equip_4: "Interceptor"
 VIE_protection_equip_4_short: "Interceptor"
 VIE_protection_equip_4_desc: "Interceptor est le nom donné à l'équipement de protection moderne utilisé par l'armée américaine. Il a été conçu par la DARPA en 1998 dans le but d'offrir une protection dont l'infanterie était privée depuis que les armures étaient devenues obsolètes. Il n'est toutefois pas aussi efficace contre les tirs d'armes à feu que l'armure à plaques l'était contre les épées. L'armure Interceptor se compose de l'OTV, du DAPS et du MICH. L'OTV est un gilet qui protège le cou, la gorge, les biceps et l'aine. Les accessoires peuvent être retirés de la protection du torse. L'OTV contient des plaques balistiques et des composés modernes en nylon qui protègent les soldats mieux que n'importe quelle armure précédente. Le système permet également de protéger le soldat grâce à un gilet fin Flattening Load Carrier qui facilite le transport de l'équipement. Les DAPS sont des manchons de protection auxiliaires destinés à protéger les jambes et les bras. Le MICH est un casque léger en kevlar équipé de ports auxiliaires permettant de fixer différents équipements tels que des jumelles."
 VIE_protection_equip_5: "ICTV + SFICTV"
 VIE_protection_equip_5_short: "ICTV + SFICTV"
 VIE_protection_equip_5_desc: "Le gilet tactique combiné amélioré (ICTV) et sa variante pour les forces spéciales (SFICTV) sont des ensembles théoriques d'équipements de protection individuelle destinés à remplacer l'Interceptor. Actuellement, la plupart des pièces sont en cours de développement ou en phase conceptuelle. Le développement de l'ICTV et du SFICTV a commencé au début des années 2000 par divers fabricants, seul l'IOTV ayant été développé en 2007, tandis que la série de casques est actuellement en cours de développement ou en phase conceptuelle. L'ICTV devrait comprendre un ensemble complet de gilets pare-balles protégeant la quasi-totalité du corps, les espaces vides étant protégés par des couches de fibres entrelacées et des plaques métalliques légères. Le casque est équipé d'une protection pour les oreilles et les yeux, d'un support auxiliaire pour un masque à gaz pare-balles et d'un support pour jumelles. La variante SF est beaucoup plus légère, une grande partie du blindage ayant été réduite ou segmentée pour faciliter les mouvements. Une fois développée, elle offrira une protection complète."
 JAP_infantry_equipment_0:0 "Howa Patern, fusil américain, calibre .30, M1"
 JAP_infantry_equipment_0_short:0 "M1 Garand (H)"
 JAP_infantry_equipment_0_desc:0 "Howa a fabriqué une copie du M1 Garand américain pour les Forces d'autodéfense japonaises au début de la guerre froide, initialement dans le but de fournir des armes à feu à la nouvelle réserve nationale de police, ou Keisatsu Yobita. En octobre 1952, celle-ci fut élargie à 110 000 hommes et rebaptisée Force nationale de sécurité, dont Howa serait chargée de l'entretien et de la production après la fin des programmes d'aide militaire américains destinés à créer l'organisation initiale."
 JAP_infantry_equipment_1:0 "Modèle Howa, carabine américaine, calibre .30, U3 M1"
 JAP_infantry_equipment_1_short:0 "U3 M1 Carbine (H)"
 JAP_infantry_equipment_1_desc:0 "Howa a fabriqué une copie de la carabine U3 M1 pour les Forces d'autodéfense japonaises au début de la guerre froide, initialement dans le but de fournir des armes à feu à la nouvelle réserve nationale de police, ou Keisatsu Yobita. En octobre 1952, celle-ci a été élargie à 110 000 hommes et rebaptisée Force nationale de sécurité, dont Howa allait assurer la maintenance et la production après la fin des programmes d'aide militaire américains destinés à créer l'organisation initiale."
 JAP_infantry_equipment_2:0 "Fusil de combat Howa Type 64"
 JAP_infantry_equipment_2_short:0 "Type 64"
 JAP_infantry_equipment_2_desc:0 "Le fusil d'assaut Howa Type 64 (Roku-yon-shiki-jidou-shoujuu) est un fusil d'assaut japonais utilisé exclusivement par les Forces d'autodéfense japonaises et les garde-côtes japonais. Il s'agit d'une arme à gaz à tir sélectif chambrée pour les munitions OTAN 7,62 × 51 mm et utilisant un chargeur amovible de 20 cartouches. Le Type 64 n'a jamais été exporté en raison des lois japonaises strictes en matière d'exportation d'armes."
 JAP_infantry_equipment_3:0 "Howa Type 80"
 JAP_infantry_equipment_3_short:0 "Type 80"
 JAP_infantry_equipment_3_desc:0 "Prototype expérimental de l'Armalite AR-18, le Type 80 n'a jamais été commercialisé en dehors d'une utilisation limitée à des fins d'essai."
 JAP_infantry_equipment_4:0 "Howa Type 89"
 JAP_infantry_equipment_4_short:0 "Howa Type 89 "
 JAP_infantry_equipment_4_desc:0 "Le fusil d'assaut Howa Type 89 (89式小銃, hachi-kyū-shiki-shōjū), appelé fusil Type 89 5,56 mm (89式5.56mm小銃, hachi-kyū-shiki-go-ten-go-roku-miri-shōjū), est un fusil d'assaut japonais utilisé par les Forces d'autodéfense japonaises, les unités spéciales de sécurité des garde-côtes japonais et les équipes d'assaut spéciales. Il n'a jamais été exporté hors du Japon en raison de la politique stricte du pays en matière d'exportation d'armement. Il est connu sous le nom de « Buddy » au sein de la JGSDF."
 JAP_specialist_1: "Fusil de précision Type 99"
 JAP_specialist_1_short: "Fusil de précision Type 99"
 JAP_specialist_1_desc: "Le fusil de précision Type 99 (Kyukyu-shiki sogeki-ju) était un fusil de précision japonais utilisé pendant la Seconde Guerre mondiale. Il s'agissait d'une version de précision du fusil Type 99, chambré en 7,7 × 58 mm. Il existait plusieurs variantes du fusil de précision Type 99, certaines avec un verrou droit et une lunette montée sur le côté gauche du récepteur, ce qui permettait d'utiliser des chargeurs à bande. Une autre variante était équipée d'un verrou courbé et d'une lunette au-dessus du récepteur, ce qui obligeait le tireur à charger les cartouches une par une. Le canon plus court, combiné à des cartouches de plus gros calibre, rendait la dissimulation plus difficile qu'avec le fusil Type 97 qui l'avait précédé, compte tenu du bruit et du flash plus importants causés par l'augmentation de la capacité de poudre."
 JAP_specialist_2: "M1D"
 JAP_specialist_2_short: "M1D"
 JAP_specialist_2_desc: "Le M1D est une variante sniper du M1 Garand. Dérivé du M1C, plus complexe, le modèle D utilisait un support Springfield Armory plus simple, à anneau unique, fixé au canon plutôt qu'à la carcasse."
 JAP_specialist_3: "Howa Type 64 Tireur d'élite désigné"
 JAP_specialist_3_short: "Howa Type 64"
 JAP_specialist_3_desc: "Des optiques à longue portée (lunettes) peuvent être installées sur le fusil de type 64 afin qu'il puisse être utilisé comme fusil de précision. Le fusil de précision de type 64 est généralement attribué à la personne ayant la meilleure précision de tir dans chaque division (un tireur d'élite désigné). Cependant, dans de nombreux cas, la personne peut simplement se voir attribuer la lunette elle-même pour être utilisée uniquement pendant les exercices d'entraînement et les compétitions de tir, sans qu'aucun fusil spécifique ne lui soit attribué.\nLes optiques fournies sont généralement réglées sur un grossissement de 2,2× et peuvent être soit une lunette M84 provenant d'un fusil de précision M1C/D utilisé par l'armée américaine pendant la Seconde Guerre mondiale, soit un modèle similaire produit par Nikon qui reproduit les niveaux de grossissement de la M84. Les performances sont similaires à celles du fusil de précision M1C/D, mais il n'est possible de régler la lunette que pour voir des cibles à 500 mètres, bien que le bouton d'élévation soit calibré jusqu'à 800 mètres. De plus, le réticule de visée standard est un simple « T » noir, ce qui le rend extrêmement difficile à utiliser au crépuscule ou sur une cible noire.\nCertaines critiques sérieuses concernant la précision de la version sniper sont liées au système de fixation mal conçu de la lunette. La lunette se déplace facilement car elle n'est fixée qu'à l'aide d'une seule vis. Une fois la lunette montée et le fusil réglé, il est impératif de la manipuler avec précaution car elle peut facilement être déplacée. De plus, comme la lunette n'est généralement pas attribuée à un fusil en particulier, il est souvent difficile de la maintenir immobile sur le récepteur d'un fusil donné. Ce problème est généralement résolu en installant un morceau de tissu entre le récepteur et le support de la lunette, mais cela masque alors les viseurs métalliques du fusil. Dans ce cas, il est nécessaire d'installer un appui-joue pour aligner correctement l'œil de l'utilisateur avec la lunette."
 JAP_specialist_5_short: "M24"
 AST_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n° 4 Mk I"
 AST_infantry_equipment_0_short:0 "SMLE No. 4"
 AST_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par magasin, qui fut l'arme principale de l'Empire britannique et du Commonwealth durant la première moitié du XXe siècle. Il fut le fusil standard de l'armée britannique de 1895 à 1957. Ce fusil fut largement utilisé durant la Seconde Guerre mondiale, notamment en Afrique du Nord, en Italie, dans le Pacifique et en Birmanie, par les forces britanniques et du Commonwealth. L'Australie et l'Inde conservèrent et produisirent le SMLE Mk III* comme fusil standard durant le conflit, et ce fusil resta en service dans l'armée australienne durant la guerre de Corée, jusqu'à son remplacement par le L1A1 SLR à la fin des années 1950."
 AST_infantry_equipment_1:0 "Fusil semi-automatique L1A1"
 AST_infantry_equipment_1_short:0 "L1A1"
 AST_infantry_equipment_1_desc:0 "Le L1A1 est une version britannique du fusil de combat belge FN FAL. Produit sous licence, il a été utilisé par de nombreux pays du Commonwealth. Le Royaume-Uni a développé sa propre variante du FN FAL, intégrant les modifications mises au point par l'Allied Rifle Committee, et l'a désignée fusil semi-automatique L1A1 (SLR). Ces armes ont été fabriquées par la Royal Small Arms Factory d'Enfield, la Birmingham Small Arms Factory, la Royal Ordnance Factory et la ROF de Fazakerley. Après l'arrêt de la production, les pièces de rechange ont été fabriquées par Parker Hale Limited. Le SLR a servi dans les forces armées britanniques de 1954 à environ 1994, avant d'être remplacé par le L85A1 à partir de 1985."
 AST_infantry_equipment_2:0 "Fusil semi-automatique L1A1 en polymère"
 AST_infantry_equipment_2_short:0 "L1A1(p)"
 AST_infantry_equipment_2_desc:0 "Version améliorée du C1."
 AST_infantry_equipment_3:0 "Steyr Aug F88 Austeyr"
 AST_infantry_equipment_3_short:0 "F88 Austeyr"
 AST_infantry_equipment_3_desc:0 "Le fusil d'assaut F88 Austeyr est l'arme individuelle standard de l'ADF. Il est fabriqué sous licence de Steyr Mannlicher AG par Thales Australia et fourni aux forces armées australiennes et néo-zélandaises."
 AST_infantry_equipment_4:0 "Steyr Aug F88SA1 Austeyr"
 AST_infantry_equipment_4_short:0 "F88SA1 Austeyr"
 AST_infantry_equipment_4_desc:0 "Le F88SA1 Austeyr est une variante du F88 Austeyr équipée d'un rail Picatinny intégré à la place du viseur optique standard, qui permet de fixer divers autres dispositifs de visée (jumelles de vision nocturne, optiques grossissantes et non grossissantes telles que l'ELCAN C79, le Trijicon ACOG ou l'Aimpoint)."
 DOC_infantry_equipment_0:0 "Fabrique Nationale Model 1949"
 DOC_infantry_equipment_0_short:0 "FN-49"
 DOC_infantry_equipment_0_desc:0 "Avec une conception remontant au début des années 1930, le FN-49 est disponible à la fois en fusil semi-automatique et en fusil automatique à tir sélectif avec des chargeurs de 10 cartouches.\nBien que très apprécié pour sa grande qualité de fabrication et sa fiabilité par rapport aux fusils de l'époque, son potentiel commercial était limité, car il n'a pas été développé à temps pour être utilisé pendant la Seconde Guerre mondiale, mais plus tard, alors que de nombreuses armées avaient déjà commencé à adopter des fusils d'assaut à tir sélectif. Un nombre inconnu de FN-49 ont été produits en tant que fusils automatiques à tir sélectif, mais le petit chargeur de 10 cartouches limitait l'utilité de la fonction entièrement automatique."
 DOC_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 DOC_infantry_equipment_1_short:0 "FN FAL"
 DOC_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. Du fait de sa prévalence et de son utilisation généralisée au sein des forces armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le surnom de « bras droit du monde libre »."
 DOC_infantry_equipment_2:0 "Avtomat Kalashnikova Modernizirovanniy"
 DOC_infantry_equipment_2_short:0 "AKM"
 DOC_infantry_equipment_2_desc:0 "L’AKM est une version modernisée de l’AK-47, développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l’Armée soviétique en 1959. L’arme fut largement optimisée et repensée pour répondre aux besoins d’une armée en pleine modernisation. De nombreuses pièces furent simplifiées pour une production de masse, et le boîtier de culasse en acier usiné fut remplacé par une tôle d’acier emboutie en forme de U, augmentant considérablement les cadences de fabrication. Grâce à ces modifications, l’AKM devint également bien plus léger, son poids étant réduit d’environ 30%. L’arme fut aussi renforcée pour gagner en solidité et intégra des rails de guidage améliorant le mouvement du bloc culasse. L’AKM fut immédiatement adopté par de nombreux pays communistes et produit en masse pour divers conflits tout au long de sa durée de vie, notamment lors de l’invasion de la Tchécoslovaquie, où il fut utilisé par les deux camps."
 KEN_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n° 4 Mk I"
 KEN_infantry_equipment_0_short:0 "SMLE No. 4"
 KEN_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par magasin, qui fut l'arme principale de l'Empire britannique et du Commonwealth durant la première moitié du XXe siècle. Il fut le fusil standard de l'armée britannique de 1895 à 1957. Ce fusil fut largement utilisé durant la Seconde Guerre mondiale, notamment en Afrique du Nord, en Italie, dans le Pacifique et en Birmanie, par les forces britanniques et du Commonwealth. L'Australie et l'Inde conservèrent et produisirent le SMLE Mk III* comme fusil standard durant le conflit, et ce fusil resta en service dans l'armée australienne durant la guerre de Corée, jusqu'à son remplacement par le L1A1 SLR à la fin des années 1950."
 KEN_infantry_equipment_1:0 "Fusil semi-automatique L1A1"
 KEN_infantry_equipment_1_short:0 "L1A1"
 KEN_infantry_equipment_1_desc:0 "Le L1A1 est une version britannique du fusil de combat belge FN FAL. Produit sous licence, il a été utilisé par de nombreux pays du Commonwealth. Le Royaume-Uni a développé sa propre variante du FN FAL, intégrant les modifications mises au point par l'Allied Rifle Committee, et l'a désignée fusil semi-automatique L1A1 (SLR). Ces armes ont été fabriquées par la Royal Small Arms Factory d'Enfield, la Birmingham Small Arms Factory, la Royal Ordnance Factory et la ROF de Fazakerley. Après l'arrêt de la production, les pièces de rechange ont été fabriquées par Parker Hale Limited. Le SLR a servi dans les forces armées britanniques de 1954 à environ 1994, avant d'être remplacé par le L85A1 à partir de 1985."
 KEN_infantry_equipment_2:0 "Heckler & Koch G3"
 KEN_infantry_equipment_2_short:0 "G3"
 KEN_infantry_equipment_2_desc:0 "Le G3 ou Gewehr 3 est un fusil d'assaut à tir sélectif de calibre 7,62 × 51 mm OTAN, développé dans les années 1950 par le fabricant d'armes allemand Heckler & Koch en collaboration avec l'agence publique espagnole de conception et de développement CETME."
 KEN_infantry_equipment_3:0 "Fusil automatique IMI Galil Mitrailleuse"
 KEN_infantry_equipment_3_short:0 "Galil ARM"
 KEN_infantry_equipment_3_desc:0 "À la fin des années 60 et au début des années 70, le fusil d'assaut principal de l'armée israélienne, le Romat, a commencé à montrer ses faiblesses."
 KEN_infantry_equipment_4:0 "Carabine, calibre 5,56 mm, M4"
 KEN_infantry_equipment_4_short:0 "M4 Carbine"
 KEN_infantry_equipment_4_desc:0 "La carabine M4 est une version améliorée du M16A2. Sa conception a été initialement confiée à une grande équipe de concepteurs ad hoc en 1984 et son développement s'est achevé en 1993. Après 9 ans de développement, espérons que l'attente en valait la peine. Elle offre une plus grande fiabilité et est beaucoup plus légère et plus courte. Grâce notamment à l'amélioration des matériaux, elle est plus précise que la M16A2. Sa taille compacte la rend plus polyvalente et plus facile à utiliser que la M16A2. La carabine M4 a été utilisée au combat pendant la guerre des États-Unis en Afghanistan, la guerre en Irak et la guerre contre l'État islamique."