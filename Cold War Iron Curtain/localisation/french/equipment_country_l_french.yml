 SPR_mechanized_equipment_10: "Mowag Piranha IIIC Fusileros"
 SPR_mechanized_equipment_10_short: "Fusiliers Piranha IIIC"

 SPR_mechanized_heavy_equipment_4: "M113 ACAV"
 SPR_mechanized_heavy_equipment_4_short: "M113 ACAV"
 SPR_mechanized_heavy_equipment_4_desc: "Le M113 ACAV, également connu sous le nom de M150, est un véhicule blindé d'assaut de cavalerie, qui est une des premières formes de l'IFV. Le M113 ACAV a été développé dans les années 60 par la Food Machinery Corporation. Le M113 ACAV est similaire au M113 dans la plupart des aspects. La variante ACAV du M113 embarque un lanceur TOW et peut potentiellement être équipée d'une tourelle armée d'un lance-flammes comme on le voit au Vietnam. Le M113 ACAV a été utilisé partout où le M113 était utilisé."

 SPR_mechanized_heavy_equipment_6: "Pegaso VEC-M1"
 SPR_mechanized_heavy_equipment_6_short: "VEC-M1"
