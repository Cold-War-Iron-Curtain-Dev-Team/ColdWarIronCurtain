 VIE_lt_equipment_1:0 "M5 Stuart"
 VIE_lt_equipment_1_short:0 "M5 Stuart"
 VIE_lt_equipment_1_desc:0 "Le M5 Stuart est un petit char développé par le département de l'artillerie de l'armée américaine en 1941 pour servir de char léger. Il est doté d'un blindage fin de 63,5 mm et d'un canon principal de 37 mm avec trois armes secondaires Browning de 7,62 mm. Il utilise un double moteur Cadillac V8 qui peut atteindre une vitesse de 36 mph hors route et a une autonomie de 100 miles. Il a été largement prêté tout au long de la Seconde Guerre mondiale, même après l'entrée en guerre des États-Unis."
 VIE_lt_equipment_2:0 "Char léger, M24"
 VIE_lt_equipment_2_short:0 "M24"
 VIE_lt_equipment_2_desc:0 "Le M24 Chaffee est un char léger développé par le département de l'artillerie de l'armée américaine en 1944, vers la fin de la Seconde Guerre mondiale. Le M24 dispose d'un blindage de 38 mm et d'un canon principal de 75 mm. Son moteur est un V8 Cadillac double avec une transmission Hydramatic qui lui permet de se déplacer à peu près comme le M5 Stuart. Au combat, le petit canon du M5 Stuart s'est avéré être un inconvénient majeur, en particulier lors de la campagne d'Afrique du Nord. C'est peu après cela que le M24 Chaffee a été développé dans le but de lui donner plus de puissance de feu pour mieux remplir son rôle."
 VIE_lt_equipment_3:0 "Char de combat à chenilles : 76-mm gun, M41"
 VIE_lt_equipment_3_short:0 "M41 Walker Bulldog"
 VIE_lt_equipment_3_desc:0 "Le M41 est un char de reconnaissance léger développé par Cadillac en 1949. Il a été utilisé au combat au Vietnam, dans la baie des Cochons, au Liban et en Somalie. Son blindage varie entre 19 mm et 31,7 mm. Il est équipé d'un canon principal de 76 mm, d'une mitrailleuse coaxiale de calibre .30 et d'une mitrailleuse de calibre .50 sur le toit. Il utilise un moteur à essence Continental 6 cylindres et peut atteindre une vitesse de 72 km/h avec une autonomie de 160 km. Le développement du M41 progressait lentement en raison d'un financement insuffisant, mais lorsque la guerre de Corée a éclaté, l'armée américaine a commencé à accélérer le programme. Cette précipitation a entraîné un grand nombre de problèmes dans le programme et des problèmes de surdimensionnement. En raison des graves problèmes liés à la précipitation du programme, le M41 a été produit pendant très peu de temps et n'a pas été utilisé pendant la guerre de Corée. En fait, sa production n'a commencé qu'en 1951 et n'a duré que trois ans."
 VIE_lt_equipment_4:0 "Char de combat à chenilles : 76-mm gun, M41"
 VIE_lt_equipment_4_short:0 "M41A1 Walker Bulldog"
 VIE_lt_equipment_4_desc:0 "Le M551 Sheridan est un char de reconnaissance amphibie et aéroporté conçu par Cadillac en 1966. Il a été utilisé au Vietnam, lors de l'opération Just Cause et lors de l'opération Desert Storm. Le M551 Sheridan est équipé d'un canon principal de 152 mm et de deux canons secondaires. Le char est équipé d'un moteur diesel turbocompressé 6 cylindres 6V53T et peut atteindre une vitesse de 70 km/h et une vitesse de nage de 6 km/h. Le blindage est constitué d'une coque en aluminium et d'une tourelle en acier. Il a été immédiatement mis en service au Vietnam en raison de sa mobilité et de sa polyvalence, où il a joué un rôle exceptionnel. Le canon principal de 152 mm peut tirer respectivement des missiles antichars guidés ou des munitions conventionnelles. Le M551 a été critiqué par bon nombre de ses opérateurs en raison de sa difficulté d'utilisation en combat direct, mais il a néanmoins rempli son rôle efficacement malgré sa mauvaise réputation."
 VIE_lt_equipment_5:0 "Char de combat à chenilles : 76-mm gun, M41A3"
 VIE_lt_equipment_5_short:0 "M41A3 Walker Bulldog"
 VIE_lt_equipment_5_desc:0 "Le M3 Bradley CFV est très similaire au M2 Bradley IFV (véhicule de combat d'infanterie) et est équipé de la même tourelle Bushmaster Cannon de 25 mm pour deux personnes avec une mitrailleuse coaxiale M240C de 7,62 mm. Il ne diffère du M2 que par quelques subtilités et par son rôle. Le M3 est classé comme véhicule blindé de reconnaissance et de repérage et ne dispose pas des ouvertures de tir présentes sur la série M2. Le M3 transporte également davantage de missiles TOW ainsi que plus de munitions pour ses canons de 25 mm et 7,62 mm."
 VIE_lt_equipment_6:0 "M3A2 Bradley ODS"
 VIE_lt_equipment_6_short:0 "M3A2 Bradley ODS"
 VIE_lt_equipment_6_desc:0 "Le M3A2 intégrait des améliorations au niveau du blindage, telles que la possibilité d'installer un blindage réactif explosif, provenant du M2A2 Bradley. Après des essais de tir réel, la disposition des sièges et du rangement des munitions a également été modifiée, les observateurs étant déplacés vers un banc situé sur le côté gauche du véhicule et le rangement des missiles réorganisé afin d'améliorer la sécurité."
 VIE_ht_equipment_1:0 "M4A3E2 Sherman Jumbo"
 VIE_ht_equipment_1_short:0 "M4A3E2 Jumbo"
 VIE_ht_equipment_1_desc:0 "Blindage supplémentaire (y compris 1 pouce à l'avant), tourelle à côtés verticaux, mais vitesse réduite d'environ 3 à 4 mph. Construit avec un canon de 75 mm, mais fréquemment réarmé par les unités utilisatrices avec des canons de 76 mm. Connecteurs d'extrémité prolongés (EEC) de type « bec de canard » fixés au bord extérieur des chenilles."
 VIE_ht_equipment_2:0 "T26E4 Super Pershing"
 VIE_ht_equipment_2_short:0 "T26E4 Super Pershing"
 VIE_ht_equipment_2_desc:0 "Le Super Pershing était une variante plus lourde du M26 de base. Un blindage plus épais était fixé au char et le canon T15E1, plus long, remplaçait le canon M3 afin d'égaler la puissance de feu du King Tiger."
 VIE_ht_equipment_3:0 "T32"
 VIE_ht_equipment_3_short:0 "T32"
 VIE_ht_equipment_3_desc:0 "Les travaux ont commencé au début de l'année 1945 afin de développer une variante nettement plus lourde du M26 Pershing. À partir des données recueillies lors du projet de char lourd T29 et en intégrant un canon principal expérimental de 90 mm tirant des munitions composites rigides perforantes, ainsi qu'une transmission plus avancée, le premier char T32 a été produit. Le canon T15E2 monté sur ce char était beaucoup plus puissant que celui du Pershing et, à l'instar du T26E4 Super Pershing qui utilisait un canon expérimental similaire de 90 mm, le contrepoids à l'arrière de la tourelle a été considérablement agrandi pour compenser le poids du long canon."
 VIE_ht_equipment_4:0 "Char de combat M103 équipé d'un canon de 120 mm"
 VIE_ht_equipment_4_short:0 "M103"
 VIE_ht_equipment_4_desc:0 "Le M103 était un char lourd créé en 1957 par Chrysler. 100 unités ont été construites et déployées, mais elles n'ont jamais été utilisées au combat. Il était équipé d'un blindage de 127 à 254 mm et disposait d'un canon principal de 120 mm et de 3 mitrailleuses secondaires. Il atteignait une vitesse maximale de 34 km/h et avait une autonomie de 130 km avec 1 066 litres de carburant à l'époque. Il était équipé d'un moteur à essence AV1790 12 cylindres. Le char a servi dans le corps des Marines, mais n'a jamais été utilisé au combat, car les unités auxquelles il était affecté n'ont jamais eu l'occasion de l'utiliser."
 VIE_ht_equipment_5:0 "Char de combat M103A2 équipé d'un canon de 120 mm"
 VIE_ht_equipment_5_short:0 "M103A2"
 VIE_ht_equipment_5_desc:0 "Le M103A2 est une version améliorée du M103 fabriqué dans les années 60 par Chrysler. 200 unités ont été produites, mais il n'a jamais été utilisé au combat. Le moteur du M103 a été remplacé par un moteur AVDS1790-2 V12 à double turbocompresseur, ce qui lui conférait des avantages significatifs par rapport au M103. Le moteur amélioré lui permettait de parcourir 295 miles à une vitesse de 23 mph et offrait une mobilité importante tout en utilisant le même carburant que le M103. D'autres améliorations mineures ont également été apportées à certaines pièces du M103, comme un modèle de transmission légèrement différent, mais qui était finalement identique. Le M103A2 fut le dernier char lourd créé par les États-Unis, car les chars de combat principaux avaient supplanté le besoin de chars lourds et pouvaient transporter plus de puissance de feu avec moins de poids et plus de mobilité."
 VIE_mbt_equipment_0:0 "M4 Sherman"
 VIE_mbt_equipment_0_short:0 "M4 Sherman"
 VIE_mbt_equipment_0_desc:0 "Le M4 Sherman est un char moyen conçu par le département de l'artillerie de l'armée américaine en 1940 pour la Seconde Guerre mondiale. Il a été prêté à de nombreux pays à partir de 1940. Le Sherman peut être équipé d'un canon principal de 75 mm, 76 mm ou 105 mm et dispose généralement d'un canon secondaire Browning. Il est propulsé par un moteur à essence radial C4 à 9 cylindres capable de transporter le véhicule à une vitesse de 22 à 30 mph sur une distance de 100 à 150 miles avant de devoir être ravitaillé en carburant. Il était fiable, peu coûteux à produire et faisait rêver les logiciens. Il était très compact et facile à transporter en grand nombre, ce qui rendait son acheminement à travers l'Atlantique extrêmement facile. Le M4 était également très polyvalent et capable de fonctionner dans des conditions très variées."
 VIE_mbt_equipment_1:0 "M26"
 VIE_mbt_equipment_1_short:0 "M26 Pershing"
 VIE_mbt_equipment_1_desc:0 "Le M26 Pershing est un char moyen conçu par le département de l'artillerie de l'armée américaine en 1944. Il a été utilisé pendant la Seconde Guerre mondiale et la guerre de Corée. Le M26 Pershing est particulièrement lourd pour un char moyen, ce qui lui confère une vitesse hors route exceptionnellement faible. Son moteur Ford GAF à 8 cylindres lui permettait de parcourir jusqu'à 160 km à une vitesse de 48 km/h sur route, mais hors route, il ne dépassait pas les 8,4 km/h. Son armement principal est un canon de 90 mm et il peut être équipé d'une mitrailleuse M2 Browning. Cependant, pendant la guerre de Corée, le Browning M2 de calibre .50 a été remplacé par deux canons M1919 .30-06 en raison du grand nombre de cibles faciles sur le terrain et de la nécessité de transporter 9 fois plus de munitions plutôt que d'augmenter la puissance de feu. Le M26 était peut-être un char moyen, mais il est extrêmement lourd et peut être considéré comme un hybride entre un char moyen et un char lourd."
 VIE_mbt_equipment_2:0 "M46 Patton"
 VIE_mbt_equipment_2_short:0 "M46 Patton"
 VIE_mbt_equipment_2_desc:0 "Le M46 Patton est un char moyen conçu par le département de l'artillerie de l'armée américaine en 1949. Il a été utilisé pendant la guerre de Corée et a été conçu pour remplacer le M26 Pershing en raison de son poids excessif. Il est équipé d'un canon principal de 90 mm et d'un blindage de 102 mm. Il peut être équipé d'un seul M2 Browning ou de deux M1919 Brownings. Le M46 Patton utilise un moteur V12 biturbo qui atteint une vitesse de 24 à 48 km/h et a une autonomie de 48 à 128 km. Il a été produit en grande série dans le but de remplacer les anciens modèles. Il était à la pointe de la technologie en matière de conception et d'armement et ne souffrait pas d'un poids excessif."
 VIE_mbt_equipment_3:0 "Char de combat à chenilles : canon de 90 mm, M47"
 VIE_mbt_equipment_3_short:0 "M47 Patton"
 VIE_mbt_equipment_3_desc:0 "Le M47 Patton est l'un des premiers chars de combat principaux. Il a été conçu par le département de l'artillerie de l'armée américaine en 1951. Il est très similaire au M46 Patton, mais dispose d'une tourelle modernisée avec un mécanisme interne amélioré et une transmission optimisée. Il a été utilisé lors de la crise de Suez, de la guerre des Six Jours et des guerres de Yougoslavie."
 VIE_mbt_equipment_4:0 "Char de combat à chenilles : 90-mm Gun, M48"
 VIE_mbt_equipment_4_short:0 "M48 Patton"
 VIE_mbt_equipment_4_desc:0 "Le M48 Patton est un char de combat principal conçu par le département de l'artillerie de l'armée américaine en 1953. Le M48 dispose d'un blindage de 110 mm et d'un canon principal amélioré de 90 mm. Son moteur est une variante optimisée du V12 utilisé dans les chars Patton précédents, avec un système d'injection de carburant léger et un compresseur. Il a une autonomie de 160 miles hors route et de 300 miles sur route. Il peut rouler à 30 mph sur route, mais atteint 20 mph hors route grâce à son moteur, sa transmission et ses chenilles améliorés. Il a été le char principal utilisé pendant la guerre du Vietnam et était couramment utilisé par les alliés des États-Unis pendant la guerre froide. Il ressemble au M47 Patton, mais il s'agit d'un modèle entièrement nouveau doté de nouveaux mécanismes internes. Il a été utilisé par l'armée américaine et les Marines avant d'être finalement remplacé par le M60, bien que de nombreuses unités de la garde nationale aient continué à utiliser et à entretenir des M48 jusqu'à la fin des années 80."
 VIE_mbt_equipment_5:0 "Char de combat à chenilles : 90-mm Gun, M48"
 VIE_mbt_equipment_5_short:0 "M48A3 Patton"
 VIE_mbt_equipment_6:0 "Char de combat à chenilles : canon de 105 mm, M48A5"
 VIE_mbt_equipment_6_short:0 "M48A5 Patton"
 VIE_mbt_equipment_7:0 "Char de combat à chenilles : 105-mm Gun, M1A1"
 VIE_mbt_equipment_7_short:0 "M1A1 Abrams"
 VIE_mbt_equipment_7_desc:0 "Le char de combat principal M1A1 Abrams a été développé par General Dynamics. Il s'agit d'une version améliorée du M1 Abrams. Le M1A1 a été dévoilé en 1985 et sa production a débuté la même année. Le M1A1 dispose d'une protection blindée améliorée au niveau de la tourelle par rapport à son prédécesseur. L'une des améliorations les plus importantes par rapport au M1 est le canon M256 de 120 mm à âme lisse, développé à l'origine par Rheinmetall et produit sous licence aux États-Unis."
 VIE_mbt_equipment_8:0 "Char de combat à chenilles : 120-mm Gun, M1A2"
 VIE_mbt_equipment_8_short:0 "M1A2 Abrams"
 VIE_mbt_equipment_8_desc:0 "Le M1A2 Abrams est une version améliorée du M1, développée par GDLS au début des années 80. Le char utilise un blindage composite renforcé par un treillis en uranium appauvri d'environ 600 mm. Les chars sont également équipés d'options supplémentaires telles qu'un blindage réactif, un kit de survie urbaine et un système d'arme télécommandé. Il est équipé d'un canon principal de 120 mm à âme lisse et a une portée supérieure à la plupart des autres chars. Il dispose également d'un système électronique amélioré, de contre-mesures ATGM et d'un système de lutte contre l'incendie. Cependant, aucune amélioration n'a été apportée à la transmission, à la suspension ou au moteur. Il est donc plus proche du sol et pèse beaucoup plus lourd. Il peut rouler à 67 km/h sur route et à 40 km/h hors route, avec une autonomie réduite. Il a été utilisé en Afghanistan, dans le Golfe et en Irak, où il a démontré une capacité de survie inégalée contre la plupart des armes antichars utilisées par ses adversaires."
 VIE_mbt_equipment_9:0 "Char de combat à chenilles : canon de 120 mm, M1A2(SEP)"
 VIE_mbt_equipment_9_short:0 "M1A2 Abrams SEP"
 VIE_mbt_equipment_9_desc:0 "Le M1A2 System Enhancement Package (SEP) est le successeur du M1A2. Il s'agit également d'un kit de mise à niveau pour les anciens chars Abrams. Il offre une protection blindée améliorée, des composants système améliorés, des composants informatiques améliorés et d'autres améliorations. Le premier char mis à niveau a été livré en 1999."
 VIE_mechanized_equipment_1:0 "M2 Half-Track"
 VIE_mechanized_equipment_1_short:0 "M2 Half-Track"
 VIE_mechanized_equipment_1_desc:0 "Le véhicule semi-chenillé M2 est un véhicule blindé semi-chenillé produit par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspire des véhicules semi-chenillés importés de France dans les années 1930, utilisant des composants standard fournis par les constructeurs de camions américains afin d'accélérer la production et de réduire les coûts. Le concept a été conçu et les modèles pilotes ont été fabriqués par la Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement baptisé M2). La production par la White Motor Company a commencé en 1940 et a été étendue à Autocar."
 VIE_mechanized_equipment_2:0 "M3 Half-Track"
 VIE_mechanized_equipment_2_short:0 "M3 Half-Track"
 VIE_mechanized_equipment_2_desc:0 "Le semi-chenillé M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et la Guerre froide. Dérivé du semi-chenillé M2, le M3 a été produit en grande série, avec environ 15 000 exemplaires standard et plus de 38 000 variantes. Pendant la Guerre froide, il a été utilisé par divers acteurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, et est resté en service jusqu'au milieu des années 1990. Au Mexique, il était encore en service en 2019."
 VIE_mechanized_equipment_3:0 "M3A1 Half-Track"
 VIE_mechanized_equipment_3_short:0 "M3A1 Half-Track"
 VIE_mechanized_equipment_3_desc:0 "Le M3A1 est un semi-chenillé M3 équipé du support circulaire amélioré pour mitrailleuse M49, situé au-dessus du siège avant droit. Entre 1942 et 1943, tous les semi-chenillés M3 (standard et A1) ont fait l'objet d'améliorations continues. Ces améliorations concernaient notamment la transmission, le moteur et les systèmes de rangement."
 VIE_mechanized_equipment_4:0 "Camion armé REO M35A1"
 VIE_mechanized_equipment_4_short:0 "Camion armé M35A1"
 VIE_mechanized_equipment_4_desc:0 "Les premières conversions plus sophistiquées de ce modèle ont été réalisées par l'armée américaine au Vietnam. Les bataillons d'artillerie de l'armée américaine (armes automatiques, automotrices) étaient souvent équipés de batteries d'artillerie (calibre .50), d'unités équipées de camions M35 et de systèmes M55 Quadmount montés sur quatre mitrailleuses M2 Browning."
 VIE_mechanized_equipment_5:0 "Transporteur, Personnel, À chenilles, Blindé, M113"
 VIE_mechanized_equipment_5_short:0 "M113"
 VIE_mechanized_equipment_5_desc:0 "Les véhicules blindés de transport de troupes américains les plus reconnaissables depuis les années 60. Son utilisation intensive et des années de recherche ont permis d'en faire un véritable véhicule blindé de transport de troupes, tirant parti de sa hauteur, de l'angle de son blindage et de son épaisseur. Plus tard, de plus en plus de variantes ont été introduites, l'armant d'un M2 Browning .50 Cal avec quelques milliers de cartouches de liberté. Il s'agit véritablement d'un excellent véhicule blindé de transport de troupes. Des dizaines de variantes ont été dérivées du M113, qui est toujours utilisé par l'armée américaine à ce jour."
 VIE_mechanized_equipment_6:0 "Transporteur, Personnel, À chenilles, Blindé, M113A1"
 VIE_mechanized_equipment_6_short:0 "M113A1"
 VIE_mechanized_equipment_6_desc:0 "À partir de 1964, le moteur à essence a été remplacé par un moteur Detroit Diesel 6V-53 de 215 ch (160 kW), afin de profiter de la meilleure économie de carburant et du risque d'incendie réduit du moteur diesel."
 VIE_mechanized_equipment_7:0 "Transporteur, Personnel, À chenilles, Blindé, M113A2"
 VIE_mechanized_equipment_7_short:0 "M113A2"
 VIE_mechanized_equipment_7_desc:0 "Le M113A2 est une version améliorée du M113 fabriquée par la Food Machinery Corporation à la fin des années 70. Il a été utilisé au combat partout où le M113 a été utilisé. Dans le modèle A1, le moteur a été remplacé par le 6V-53. Dans la version A2, le refroidissement du moteur a été amélioré, des barres de torsion plus résistantes ont été introduites pour augmenter la garde au sol, des amortisseurs ont été ajoutés à la suspension, les réservoirs de carburant ont été blindés et des lance-fumigènes ont été ajoutés."
 VIE_mechanized_equipment_8:0 "Transporteur, Personnel, À chenilles, Blindé, M113A3"
 VIE_mechanized_equipment_8_short:0 "M113A3"
 VIE_mechanized_equipment_8_desc:0 "En 1987, d'autres améliorations visant à « renforcer la survie (sur le champ de bataille) » ont été introduites. Elles comprenaient un timon pour la direction à la place des commandes latérales, un moteur plus puissant (le 6V-53T Detroit Diesel turbocompressé), des réservoirs de carburant externes et des revêtements internes anti-éclats pour une meilleure protection. Le suffixe A3 est utilisé sur toutes les variantes pour indiquer la mise à niveau à la norme A3."
 VIE_mechanized_equipment_9:0 "Véhicule de combat d'infanterie M1126 Stryker"
 VIE_mechanized_equipment_9_short:0 "M1126 Stryker ICV"
 VIE_mechanized_equipment_9_desc:0 "Le STRYKER est un véhicule blindé de transport de troupes développé par General Dynamics en 1999. Il a été utilisé pendant la guerre en Afghanistan. Le Stryker est équipé d'un moteur Caterpillar C7 et d'une suspension 8x8. Il peut atteindre une vitesse de 60 mph et parcourir 310 miles. Avec près d'un an et demi de retard sur le calendrier, l'équipe General Motors-General Dynamics a remporté en novembre 2000 un contrat de 8 milliards de dollars pour la production de 2 131 véhicules dérivés du LAV III canadien destinés à équiper six brigades de combat à déploiement rapide d'ici 2008."
 VIE_mechanized_equipment_10:0 "M1296 Dragoon"
 VIE_mechanized_equipment_10_short:0 "M1296 Dragoon"
 VIE_mechanized_equipment_10_desc:0 "L'armée américaine cherchait à améliorer la puissance de feu du véhicule de transport d'infanterie M1126 Stryker de base. Sa mitrailleuse lourde de 12,7 mm n'était pas particulièrement efficace contre les véhicules blindés modernes. L'armée américaine a donc approuvé une mise à niveau de la létalité en équipant 81 Strykers de tourelles légères sans pilote de 30 mm. Cela a considérablement augmenté la puissance de feu du Stryker tout en préservant la mobilité du véhicule."
 VIE_mechanized_heavy_equipment_1:0 "M44"
 VIE_mechanized_heavy_equipment_1_short:0 "M44"
 VIE_mechanized_heavy_equipment_1_desc:0 "Le M44 est un véhicule blindé de transport de troupes super-lourd développé par le département de l'artillerie de l'armée américaine en 1951. Le M44 est équipé d'un moteur AOS-895-3 et d'une suspension à barres de torsion. Il peut rouler à 24 km/h hors route et a une autonomie de 96 km. Le projet M44 a été annulé et seuls 6 prototypes ont été créés. Malgré cela, certains prototypes ont été testés sur le terrain et ont participé à des combats pendant la guerre de Corée. Bien qu'il fût extrêmement blindé et puisse transporter 24 passagers, il était très lent et constituait une cible importante."
 VIE_mechanized_heavy_equipment_2:0 "Transporteur, Personnel, À chenilles, Blindé, M75"
 VIE_mechanized_heavy_equipment_2_short:0 "M75"
 VIE_mechanized_heavy_equipment_2_desc:0 "Le M75 est un véhicule blindé de transport de troupes lourd développé par l'International Harvester Corporation au début des années 1950. Le M75 a été largement utilisé pendant la guerre de Corée, mais a été très rapidement retiré du service par la suite. Le M75 est équipé d'un moteur à essence 6 cylindres AO-895-4 et d'une suspension à barres de torsion. Il peut atteindre une vitesse de 70 km/h et a une autonomie de 185 km. Après l'annulation du projet M44 en raison de sa taille démesurée, le développement d'un autre véhicule blindé lourd entièrement fermé a commencé. Le projet M75 a abouti à un châssis beaucoup plus petit et beaucoup plus rapide que le M44. Cependant, il était encore considéré comme trop grand et le projet M95 a continué à bénéficier d'un financement."
 VIE_mechanized_heavy_equipment_3:0 "Transporteur, Personnel, À chenilles, Blindé, M113 ACAV"
 VIE_mechanized_heavy_equipment_3_short:0 "M113 ACAV"
 VIE_mechanized_heavy_equipment_3_desc:0 "Le M113 ACAV, également connu sous le nom de M150, est un véhicule blindé d'assaut de cavalerie, qui est une forme primitive du IFV. Le M113 ACAV a été développé dans les années 60 par la Food Machinery Corporation. Le M113 ACAV est similaire au M113 dans la plupart des aspects. La variante ACAV du M113 est équipée d'un lanceur TOW et peut potentiellement être équipée d'une tourelle armée d'un lance-flammes, comme on l'a vu au Vietnam. Le M113 ACAV a été utilisé partout où le M113 a été utilisé."
 VIE_mechanized_heavy_equipment_4:0 "Transporteur, Personnel, À chenilles, Blindé, M113A1 ACAV"
 VIE_mechanized_heavy_equipment_4_short:0 "M113A1 ACAV"
 VIE_mechanized_heavy_equipment_4_desc:0 "Version M113A1 ACAV équipée d'armement supplémentaire, tel qu'un fusil sans recul."
 VIE_mechanized_heavy_equipment_5:0 "M2 Bradley"
 VIE_mechanized_heavy_equipment_5_short:0 "M2 Bradley"
 VIE_mechanized_heavy_equipment_5_desc:0 "Le M2 Bradley est un véhicule blindé de combat d'infanterie amphibie développé par BAE Systems Land & Armaments en 1981. Le M2 Bradley a été utilisé dans tous les conflits américains depuis sa création, y compris l'opération Tempête du désert. Le projet M2 Bradley visait à créer une nouvelle génération de véhicules blindés pour l'ère moderne, équipés d'une protection NBC. Le projet a démarré à la fin des années 60 et a nécessité de nombreux prototypes avant d'aboutir à sa forme actuelle. Le Bradley est équipé d'un moteur 8 cylindres VTA-903T et d'une suspension à barres de torsion. Le Bradley est armé d'un canon automatique de 25 mm et d'un accessoire antichar TOW. BAE a été chargé de créer un véhicule de transport d'infanterie qui était bae. S'inspirant des prototypes du projet MICV, le Bradley est capable d'effectuer des missions de reconnaissance et de soutien pour l'infanterie qu'il transporte. Bien qu'il soit doté d'un blindage en aluminium, sa puissance de feu et sa mobilité lui permettent de se protéger sur le terrain."
 VIE_mechanized_heavy_equipment_6:0 "M2A2 Bradley"
 VIE_mechanized_heavy_equipment_6_short:0 "M2A2 Bradley"
 VIE_mechanized_heavy_equipment_6_desc:0 "Lancé en 1988, l'A2 était équipé d'un moteur amélioré de 600 chevaux (447 kW) avec une transmission hydromécanique HMPT-500-3 et d'un blindage amélioré (à la fois passif et pouvant être équipé d'un blindage réactif explosif). Le nouveau blindage protège le Bradley contre les obus APDS de 30 mm et les RPG (ou armes antichars similaires). Il a également permis de supprimer les ailettes qui rendaient le Bradley amphibie et recouvraient les ouvertures latérales de tir."
 VIE_mechanized_heavy_equipment_7:0 "M2A2 Bradley ODS"
 VIE_mechanized_heavy_equipment_7_short:0 "M2A2 Bradley ODS"
 VIE_mechanized_heavy_equipment_7_desc:0 "Le M2 ODS Bradley est une version améliorée du Bradley développée par BAE Systems en 1991. L'ODS était doté d'un intérieur optimisé, d'un blindage réactif explosif et d'une transmission hydromécanique. Cependant, le blindage réactif avait un coût et empêchait le Bradley de nager. L'ODS a également ajouté un télémètre plus performant, un système de navigation, un système de contre-mesure antimissile et un système d'imagerie thermique. De plus, un très petit réchauffeur de nourriture et des toilettes ont été ajoutés, ce qui est considéré par certains comme la meilleure innovation."
 VIE_mechanized_heavy_equipment_8:0 "M2A3 Bradley"
 VIE_mechanized_heavy_equipment_8_short:0 "M2A3 Bradley"
 VIE_mechanized_heavy_equipment_8_desc:0 "Le M2A3 Bradley est une version améliorée du Bradley développé par BAE Systems en 2000. Le modèle A3 a rendu le Bradley entièrement numérique et a permis de contrôler à distance tous les éléments du véhicule. De nombreuses améliorations ont également été apportées au blindage afin d'augmenter la capacité de survie du véhicule. De plus, le kit NBC du Bradley, qui comprend une protection supplémentaire contre les radiations, des filtres à air et une résistance aux produits chimiques, a été ajouté."
 VIE_mechanized_marine_equipment_1:0 "LVT-4 Water Buffalo"
 VIE_mechanized_marine_equipment_1_short:0 "LVT-4"
 VIE_mechanized_marine_equipment_1_desc:0 "Le LVTP-4 est un véhicule de débarquement amphibie conçu par Ford Machinery Corporation au début des années 1940. Utilisé pendant la Seconde Guerre mondiale, la guerre de Corée et la guerre du Vietnam, il est équipé d'un moteur radial W-670-9A à 7 cylindres et peut parcourir jusqu'à 120 km dans l'eau à une vitesse de 11 km/h. Évolution du LVTP-1, le LVTP-4 est capable de parcourir des distances impressionnantes à la nage, bien qu'à faible vitesse. Si vous devez traverser 110 km d'eau en une dizaine d'heures, le LVTP-4 est le véhicule idéal. Il peut transporter des troupes ou des véhicules."
 VIE_mechanized_marine_equipment_2:0 "LVTP-5"
 VIE_mechanized_marine_equipment_2_short:0 "LVTP-5"
 VIE_mechanized_marine_equipment_2_desc:0 "Le LVTP-5 est un véhicule blindé amphibie conçu par la Food Machinery Corporation en 1956. Il a été utilisé au combat au Vietnam. Le LVTP-5 est équipé d'un moteur LV-1790-1 V12 et peut parcourir jusqu'à 57 miles dans l'eau à une vitesse de 7 mph. Il s'agit d'une évolution du LVTP-4 et il est beaucoup plus résistant et fiable que son prédécesseur. De plus, des variantes ont été créées afin de permettre l'utilisation de son châssis dans des véhicules d'appui-feu tels que des obusiers de 105 mm. Une variante AA a été prototypée, mais n'a jamais été mise en production."
 VIE_mechanized_marine_equipment_3:0 "LVTP-7"
 VIE_mechanized_marine_equipment_3_short:0 "LVTP-7"
 VIE_mechanized_marine_equipment_3_desc:0 "Le LVTP-7 est un véhicule blindé amphibie conçu en 1972 par la Food Machinery Corporation. Il a été utilisé lors des conflits des Malouines, de la Grenade, du Golfe, de Syrie et d'Irak. Le LVTP-7 est équipé d'un moteur 8V-53T et peut parcourir 23 miles à une vitesse de 8,2 mph dans l'eau. Le LVTP-7 est notamment capable de se déplacer dans des conditions de mer de force 5, classées comme « agitées » avec une houle moyenne à forte, ce qui le rend plus performant que le LVTP-5 dans des conditions météorologiques difficiles. De plus, il est beaucoup mieux blindé que le LVTP-5. Comme il peut se déplacer de manière impressionnante dans des conditions de mer de force 5 et qu'il est mieux protégé, il a remplacé le LVTP-5. Il est également équipé de diffuseurs de fumée."
 VIE_mechanized_marine_equipment_4:0 "LVTP-7A1"
 VIE_mechanized_marine_equipment_4_short:0 "LVTP-7A1"
 VIE_mechanized_marine_equipment_4_desc:0 "Le LVTP-7A1 est un véhicule blindé de transport de troupes amphibie conçu en 1984 par la Food Machinery Corporation. Il a été utilisé au combat dans le Golfe, en Syrie et en Irak. Le LVTP-7A1 est équipé d'un moteur VTAC RAM-RS de 525 ch et peut rouler à peu près à la même vitesse que le LVTP-7. Son moteur, sa transmission et son système d'armement ont été améliorés, et il est plus facile à entretenir que le LVTP-7. Il bénéficie également d'un certain nombre d'améliorations en matière de sécurité afin de réduire les effets des impacts."
 VIE_mechanized_marine_equipment_5:0 "EFVP-1 Véhicule d'assaut amphibie avancé"
 VIE_mechanized_marine_equipment_5_short:0 "EFVP-1 AAAV"
 VIE_mechanized_marine_equipment_5_desc:0 "L'EFVP-1 AAAV est un projet de véhicule blindé amphibie conçu par General Dynamics qui a été annulé. L'EFVP-1 utilisait un moteur MT 883 ka, mais il semblait qu'un autre moteur serait utilisé au fur et à mesure de la production. Il est capable de parcourir 75 miles dans l'eau à une vitesse impressionnante de 28,6 mph. Le véhicule aurait également été équipé d'une tourelle de type IFV pour un soutien de tir supplémentaire. Son armement exact est inconnu, mais il aurait pu être équipé de tout type d'armement, des canons automatiques aux missiles antichars. Le développement du projet a coûté 3 milliards, mais il a finalement été annulé car il était estimé que 12 milliards supplémentaires seraient nécessaires pour créer le reste de ce que le véhicule était censé faire. Il a été mis à l'épreuve sur le terrain d'essai lorsqu'une pièce s'est détachée pendant les tests et l'un des concepteurs, furieux que cela se reproduise, l'a frappée si fort qu'il s'est cassé le pied."
 VIE_motorized_equipment_1:0 "Citroën U23"
 VIE_motorized_equipment_1_short:0 "U23"
 VIE_motorized_equipment_1_desc:0 ""
 VIE_motorized_equipment_2_short:0 "Model DW 15L 2.5t 6x6"
 VIE_motorized_equipment_3:0 "REO M35A2"
 VIE_motorized_equipment_3_short:0 "M35A2"
 VIE_motorized_equipment_3_desc:0 "Le M35A2 est généralement équipé d'un moteur LDT 465, fabriqué soit par Continental Motors Company, Hercules ou White Motor Company. Il s'agit d'un moteur multicombustible turbocompressé à six cylindres en ligne de 7,8 litres (478 pouces cubes) développant une puissance de 134 ch (100 kW) et un couple de 447 Nm (330 lb-pi). Il est couplé à une transmission manuelle à 5 vitesses et à une boîte de transfert à 2 vitesses indépendante (soit une boîte de transfert à roue libre Rockwell 136-21, soit une boîte de transfert à sélection pneumatique Rockwell 136-27)."
 VIE_motorized_equipment_4:0 "M939"
 VIE_motorized_equipment_4_short:0 "M939"
 VIE_motorized_equipment_4_desc:0 "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis 1982. Le M939 est équipé d'un moteur 6CTA8.3, d'une transmission à 5 vitesses/2 gammes et d'essieux rigides sur suspension à ressorts à lames. Le véhicule peut transporter une charge de 10 000 livres. Il peut rouler à 6,3 mph pendant 350 miles et consomme 6 mi/gal. Il est toujours utilisé aujourd'hui. Le M939 est très efficace sur tous les terrains et est bien adapté aux conditions météorologiques difficiles. Le M939 a donné naissance à une nouvelle génération de camions, de tracteurs et de véhicules de dépannage et a été produit en grande quantité. Il est plus fiable et plus robuste que les véhicules précédents et a complètement supplanté les contrats de production antérieurs."
 VIE_motorized_equipment_5:0 "Gamme Oshkosh de véhicules tactiques moyens 6x6"
 VIE_motorized_equipment_5_short:0 "FMTV 6x6"
 VIE_motorized_equipment_5_desc:0 "La famille des véhicules tactiques moyens (FMTV) est une série de véhicules, basés sur un châssis commun, qui varient en fonction de la charge utile et des exigences de la mission. Le FMTV est dérivé du camion autrichien Steyr 12 M 18, mais il a été considérablement modifié pour répondre aux exigences de l'armée américaine, notamment celle d'un contenu américain minimum de 50 %."
