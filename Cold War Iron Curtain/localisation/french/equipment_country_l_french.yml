 BEL_lt_equipment_1:0 "M5 Stuart"
 BEL_lt_equipment_1_short:0 "M5 Stuart"
 BEL_lt_equipment_2:0 "Char léger, M24 Chaffee"
 BEL_lt_equipment_2_short:0 "M24 Chaffee"
 BEL_lt_equipment_3:0 "Char de combat à chenilles : 76-mm gun, M41"
 BEL_lt_equipment_3_short:0 "M41 Walker Bulldog"
 BEL_lt_equipment_3_desc:0 "Le M41 est un char de reconnaissance léger développé par Cadillac en 1949. Il a été utilisé au combat au Vietnam, dans la baie des Cochons, au Liban et en Somalie. Son blindage varie entre 19 mm et 31,7 mm. Il est équipé d'un canon principal de 76 mm, d'une mitrailleuse coaxiale de calibre .30 et d'une mitrailleuse de calibre .50 sur le toit. Il utilise un moteur à essence Continental 6 cylindres et peut atteindre une vitesse de 72 km/h avec une autonomie de 160 km. Le développement du M41 progressait lentement en raison d'un financement insuffisant, mais lorsque la guerre de Corée a éclaté, l'armée américaine a commencé à accélérer le programme. Cette précipitation a entraîné un grand nombre de problèmes dans le programme et des problèmes de surdimensionnement. En raison des graves problèmes liés à la précipitation du programme, le M41 a été produit pendant très peu de temps et n'a pas été utilisé pendant la guerre de Corée. En fait, sa production n'a commencé qu'en 1951 et n'a duré que trois ans."
 BEL_lt_equipment_4:0 "Fabrique National FN 4RM 62F"
 BEL_lt_equipment_4_short:0 "FN 4RM 62F"
 BEL_lt_equipment_4_desc:0 "FN Herstal a conçu le 4RM 62F sans aucune expérience préalable dans le domaine des véhicules blindés. La conception s'inspire du camion FN 4RM/62 Ardennes (4 × 4) de 1 500 kg et d'autres modèles, comme le Panhard AML français. Ce véhicule blindé a été initialement conçu pour la gendarmerie belge."
 BEL_lt_equipment_5:0 "Alvis FV101 Scorpion"
 BEL_lt_equipment_5_short:0 "FV101 Scorpion"
 BEL_lt_equipment_6:0 "Ateliers de Constructions Electriques de Charleroi Cobra w/ 90mm Cockerill"
 BEL_lt_equipment_6_short:0 "ACEC Cobra 90"
 BEL_lt_equipment_6_desc:0 "Avec un équipage de trois personnes et équipé d'une tourelle pouvant accueillir des canons jusqu'à 90 mm. Un prototype était équipé d'une tourelle électrique AK 90 E pour deux personnes, armée d'un canon Cockerill KEnerga 90/46 et équipée du système de contrôle de tir OIP LRS-5 avec ordinateur balistique, viseur jour/nuit et télémètre laser. Une autre version était équipée d'une tourelle Cockerill C-25 pour deux personnes avec un canon Oerlikon KBB de 25 mm et une mitrailleuse coaxiale de 7,62 mm."
 BEL_mechanized_equipment_1:0 "M3 Halftrack"
 BEL_mechanized_equipment_1_short:0 "M3 Halftrack"
 BEL_mechanized_equipment_2:0 "Bren Carrier LP2"
 BEL_mechanized_equipment_2_short:0 "Bren Carrier LP2"
 BEL_mechanized_equipment_3:0 "Loyd Carrier"
 BEL_mechanized_equipment_3_short:0 "Loyd Carrier"
 BEL_mechanized_equipment_4:0 "M59"
 BEL_mechanized_equipment_4_short:0 "M59"
 BEL_mechanized_equipment_4_desc:0 "Le M59 est un véhicule blindé de transport de troupes développé par la société FMC en 1951. Il a été utilisé au Vietnam et au Liban. Le M75 était équipé de deux moteurs à essence 6 cylindres en ligne, d'une transmission Hydramatic 301MG et d'une suspension à barres de torsion. Il pouvait atteindre une vitesse maximale de 51 km/h et parcourir 193 km. Le M59 a rapidement remplacé le M75 car il était amphibie, plus petit et beaucoup moins cher à produire. Le M59 a également été utilisé comme porte-mortier et véhicule de soutien."
 BEL_mechanized_equipment_5:0 "AMX-VTP"
 BEL_mechanized_equipment_5_short:0 "AMX-VTP"
 BEL_mechanized_equipment_6:0 "M113-B"
 BEL_mechanized_equipment_6_short:0 "M113-B"
 BEL_mechanized_equipment_7:0 "AIFV-B-.50"
 BEL_mechanized_equipment_7_short:0 "AIFV-B-.50"
 BEL_mechanized_equipment_7_desc:0 "Variante belge du vénérable AIFV équipée d'une coupole CWS de 12,7 mm, de deux mortiers Lyran de 71 mm et d'un support pivotant pour un lance-missiles MILAN."
 BEL_mechanized_equipment_8:0 "AIFV-A1-B-.50"
 BEL_mechanized_equipment_8_short:0 "AIFV-A1-B-.50"
 BEL_mechanized_equipment_8_desc:0 "Modernisation à mi-vie de la variante de l'armée belge du vénérable AIFV avec une coupole CWS de 12,7 mm, deux mortiers Lyran de 71 mm et un support pivotant pour un lance-missiles MILAN."
 BEL_mechanized_equipment_9:0 "Steyr-Daimler-Puch Spezialfahrzeuge Pandur I"
 BEL_mechanized_equipment_9_short:0 "Pandur I"
 BEL_mechanized_equipment_9_desc:0 "Le Pandur est un véhicule blindé de transport de troupes développé et produit par la société autrichienne Steyr-Daimler-Puch Spezialfahrzeuge (SSF). Il a été développé dans les années 1980 dans le cadre d'une initiative privée."
 BEL_mechanized_equipment_10:0 "Mowag Piranha IIIC FUS"
 BEL_mechanized_equipment_10_short:0 "Piranha IIIC FUS"
 BEL_mechanized_equipment_10_desc:0 "Variante de l'armée belge du Mowag Piranha 8x8 destinée à remplacer les anciens AIFV et M113 en service en Belgique après la fin de la guerre froide. Baptisé « Fusilier » pour souligner son rôle de transport de troupes pour l'infanterie belge."
 BEL_mechanized_heavy_equipment_2:0 "M75"
 BEL_mechanized_heavy_equipment_2_short:0 "M75"
 BEL_mechanized_heavy_equipment_2_desc:0 "Le M75 est un véhicule blindé de transport de troupes lourd développé par l'International Harvester Corporation au début des années 1950. Le M75 a été largement utilisé pendant la guerre de Corée, mais a été très rapidement retiré du service par la suite. Le M75 est équipé d'un moteur à essence 6 cylindres AO-895-4 et d'une suspension à barres de torsion. Il peut atteindre une vitesse de 70 km/h et a une autonomie de 185 km. Après l'annulation du projet M44 en raison de sa taille démesurée, le développement d'un autre véhicule blindé lourd entièrement fermé a commencé. Le projet M75 a abouti à un châssis beaucoup plus petit et beaucoup plus rapide que le M44. Cependant, il était encore considéré comme trop grand et le projet M95 a continué à bénéficier d'un financement."
 BEL_mechanized_heavy_equipment_5:0 "FMC AIFV-B-C25"
 BEL_mechanized_heavy_equipment_5_short:0 "AIFV-B-C25"
 BEL_mechanized_heavy_equipment_5_desc:0 "Une variante néerlandaise révisée équipée de la même suspension que le M113A1-B (similaire au M113A2), d'un système NBC et d'un système d'extinction d'incendie au halon."
 BEL_mechanized_heavy_equipment_6:0 "FMC AIFV-A1-B-C25"
 BEL_mechanized_heavy_equipment_6_short:0 "AIFV-A1-B-C25"
 BEL_mechanized_heavy_equipment_6_desc:0 "Variante modernisée de l'AIFV d'origine en service dans l'armée belge, suspension similaire à celle du M113A1-B (similaire au M113A2), système NBC et système d'extinction d'incendie au halon."
 BEL_mechanized_heavy_equipment_7:0 "FMC AIFV-A2-B-C25"
 BEL_mechanized_heavy_equipment_7_short:0 "AIFV-A2-B-C25"
 BEL_mechanized_heavy_equipment_7_desc:0 "Version encore améliorée du vénérable AIFV utilisé par l'armée belge, dotée d'un équipement de vision nocturne plus performant et d'une protection NBC améliorée."
 BEL_mechanized_heavy_equipment_8:0 "Ateliers de Constructions Electriques de Charleroi Cobra GAD-AOA"
 BEL_mechanized_heavy_equipment_8_short:0 "ACEC Cobra GAD-AOA"
 BEL_mechanized_heavy_equipment_8_desc:0 "Prototype d'un nouveau véhicule blindé de combat d'infanterie de l'armée belge qui a été annulé en raison de la fin de la guerre froide. Armé d'une tourelle Oerlikon-Contraves GAD-AOA de 25 mm avec un canon de 20 mm modèle 204GK, ainsi que d'une tourelle compacte Euromissile MILAN en option."
