 KOR_cv_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35C Lightning II"
 KOR_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C Foudre II"
 KOR_cv_mr_stealth_fighter_equipment_1_desc:0 "Le F-35C est la variante CATOBAR (Catapult Assisted Take-Off But Arrested Recovery) de la famille F-35 Lightning II de Lockheed Martin, conçue principalement pour le déploiement de porte-avions. Le développement du programme F-35 a commencé en 1992, et la variante C était dans les airs dès 2010 et était opérationnelle sur des porte-avions moins de quatre ans plus tard. Par rapport à ses frères et soeurs, la variante C présente des ailes plus grandes avec des sections de bout d'aile pliables."
 
 KOR_jump_stealth_equipment_1:0 "Lockheed Martin F-35B Lightning II"
 KOR_jump_stealth_equipment_1_short:0 "F-35B Foudre II"
 KOR_jump_stealth_equipment_1_desc:0 "Un chasseur polyvalent produit à l'aide d'une conception JSF (Joint Strike Fighter). Bien qu'il soit capable d'utiliser une variété d'armes dans les combats air-air et sol-sol, le coût d'acquisition de ce chasseur furtif est plus gérable que celui du F-22A. Conformément à son utilité, plusieurs types sont disponibles. Le type « B » utilisé par le Corps des Marines des États-Unis est compatible STOVL (décollage court/atterrissage vertical). Son surnom est « Lightning II »."

#ROKA Helicopters
 KOR_naval_helicopter_equipment_1:0 "Bell HTL-4 Sioux"
 KOR_naval_helicopter_equipment_1_short:0 "HTL-4 Sioux"
 KOR_naval_helicopter_equipment_1_desc:0 "Le HTL était un hélicoptère léger monomoteur à rotor unique dérivé du Bell 47A civil. Acquis par l'US Navy en 1947, le HTL-4 (la variante désignée par la Navy) se distinguait de ceux utilisés par les autres branches par le retrait du revêtement en tissu sur la poutre de queue. Sinon, il conserve bon nombre de ses caractéristiques, y compris la verrière distinctive en forme de « bulle de savon » offrant au pilote une large vue. Plus tard désigné TH-13L. Son surnom, qui vient du nom des hélicoptères des tribus amérindiennes, est « Sioux »."
 KOR_naval_helicopter_equipment_2:0 "Sikorsky HSS-1 Seabat"
 KOR_naval_helicopter_equipment_2_short:0 "Bat-marin HSS-1"
 KOR_naval_helicopter_equipment_2_desc:0 "Le HSS est la variante anti-sous-marine du S-58 de Sikorsky, une version améliorée du S-55 (et du H-19 Chickasaw militaire). Il avait un nez plus petit, mais avec un fuselage arrière et un train d'atterrissage à traîneau de queue, plutôt que le modèle à queue haute et à 4 montants de son prédécesseur. Plus tard rebaptisé SH-34G, les variantes anti-sous-marins de cet hélicoptère ont reçu le surnom officiel de « Seabat »."
 KOR_naval_helicopter_equipment_3:0 "Kaman SH-2D Seasprite"
 KOR_naval_helicopter_equipment_3_short:0 "SH-2D Seasprite"
 KOR_naval_helicopter_equipment_3_desc:0 "Introduit au début des années 1960 en remplacement du SH-34 Seabat, le SH-2 (initialement désigné HU2K) fut le premier hélicoptère anti-sous-marin capable d'être déployé sur des navires américains en plus des porte-avions. Cette portabilité a prolongé la carrière du « Seasprite » et des variantes améliorées ont existé. La variante représentée dans le jeu est la variante « D », la variante anti-sous-marine initiale."
 KOR_naval_helicopter_equipment_4:0 "Sikorsky SH-3A Sea King"
 KOR_naval_helicopter_equipment_4_short:0 "SH-3A Sea King"
 KOR_naval_helicopter_equipment_4_desc:0 "Développé à partir du Sikorsky S-61 civil, le SH-3 (désignation originale HSS-2) est un hélicoptère ASW bimoteur. Il s'agissait du premier hélicoptère amphibie au monde, capable de décoller à la fois depuis la terre et depuis la mer. Il fut également, aux côtés de son contemporain le Seasprite, l'un des premiers hélicoptères ASW à utiliser des turbomoteurs. En plus des fonctions ASW, le SH-3 a également joué des rôles de recherche et de sauvetage (SAR), de transport, d'évacuation sanitaire et d'alerte précoce aéroportée (AEW), un certain nombre d'hélicoptères étant utilisés comme « Marine One », l'hélicoptère de transport officiel des présidents américains. C'est pour cette raison qu'il a gagné le surnom de « Sea King », l'hélicoptère le plus polyvalent au monde."
 KOR_naval_helicopter_equipment_5:0 "Sikorsky SH-60B Seahawk"
 KOR_naval_helicopter_equipment_5_short:0 "SH-60B Seahawk"
 KOR_naval_helicopter_equipment_5_desc:0 "Le SH-60 est la variante de l'hélicoptère UH-60 Blackhawk de l'armée américaine. (lui-même une variante militaire du Sikorsky S-70) Bien qu'il ait remplacé le précédent Sea King, le SH-60 n'a pas de capacité d'atterrissage amphibie, mais il conserve la capacité du SH-2 à atterrir sur n'importe quel navire américain capable d'héberger des hélicoptères. Capable de remplir bon nombre des mêmes rôles que le SH-3, le « Sea Hawk » représente l'avenir de l'aviation des hélicoptères de la marine américaine."
 KOR_naval_helicopter_equipment_6:0 "Sikorsky SH-60F Seahawk"
 KOR_naval_helicopter_equipment_6_short:0 "SH-60F Seahawk"
 KOR_naval_helicopter_equipment_6_desc:0 "Le SH-60F servait principalement de principal avion de guerre anti-sous-marine (ASW) du groupement tactique aéronaval. L'hélicoptère chassait les sous-marins avec son sonar plongeant AQS-13F et transportait un lanceur de bouées sonores à 6 tubes. Le SH-60F est officieusement nommé « Oceanhawk ». Le SH-60F peut transporter des torpilles Mk 46, Mk 50 ou Mk 54 pour ses armes offensives, et il dispose d'un choix de mitrailleuses montées sur le fuselage, notamment les M60D, M240D et GAU-16 (calibre.50) pour l'autodéfense."
 KOR_naval_helicopter_equipment_7:0 "Sikorsky MH-60R Seahawk"
 KOR_naval_helicopter_equipment_7_short:0 "MH-60R Seahawk"
 KOR_naval_helicopter_equipment_7_desc:0 "Le MH-60R Seahawk est une version améliorée du SH-60 Seahawk. Développé en 1993, le MH-60R a été conçu pour combiner les fonctionnalités des précédents SH-60B et SH-60F. Ses capteurs comprennent le package ASE, MTS-FLIR, l'interrogateur radar/IFF multimode AN/APS-147, une liaison de données de flotte aéroportée avancée et un sonar actif aéroporté plus avancé. Ceci, associé à un système d'armes amélioré (lui permettant de transporter la torpille avancée Mk 54 et les missiles AGM-114 Hellfire), confère au « Seahawk » une plus grande flexibilité dans les opérations d'assaut anti-navire et amphibie."

 KOR_attack_helicopter_equipment_1:0 "Cloche AH-1G Cobra"
 KOR_attack_helicopter_equipment_1_short:0 "AH-1G Cobra"
 KOR_attack_helicopter_equipment_1_desc:0 "Initialement introduit en 1966 comme hélicoptère d'attaque provisoire, l'AH-1 (développé avec une certaine compatibilité à partir de l'UH-1 Huey Iroquois) a été utilisé dans les mêmes rôles que l'AH-56 était destiné au cours de son cycle de développement. Il était souvent déployé dans des formations de chasseurs-tueurs, du rôle de « tueur » au rôle de « chasseur » assuré par l'OH-6 Cayuse, qui ont tous deux servi avec une grande distinction pendant la guerre du Vietnam. Bien qu'officiellement surnommé « Cobra », d'autres surnoms existent, notamment « HueyCobra » et « Snake »."
 KOR_attack_helicopter_equipment_2:0 "Bell AH-1F Cobra"
 KOR_attack_helicopter_equipment_2_short:0 "AH-1F Cobra"
 KOR_attack_helicopter_equipment_2_desc:0 "L'AH-1S de base est un AH-1Q amélioré avec un turbomoteur T53-L-703 de 1 800 shp (1 300 kW). L'AH-1S est équipé du sous-système de missile M65 TOW/Cobra, de l'unité de visée télescopique (TSU) M65 et du viseur Reflex M73."
 KOR_attack_helicopter_equipment_3:0 "Hughes AH-64A Apache"
 KOR_attack_helicopter_equipment_3_short:0 "AH-64A Apache"
 KOR_attack_helicopter_equipment_3_desc:0 "Introduit en 1986 pour remplacer l'AH-1 dans l'armée américaine, l'AH-64 est l'un des hélicoptères d'attaque les plus connus au monde. Il comprend une suite de capteurs montés sur le nez pour les systèmes d'acquisition de cibles et de vision nocturne. Un équipement de mission typique (et célèbre) est connu pour être son canon à chaîne de 30 mm transporté entre le train d'atterrissage et quatre points d'attache d'aile tronquée pour un mélange de nacelles de fusée Hydra et de missiles antichar AGM-114 Hellfire. Surnommé « Apache », l'AH-64 représente le summum de l'aviation par hélicoptère."
 KOR_attack_helicopter_equipment_4:0 "Arc long Apache McDonnell Douglas AH-64D"
 KOR_attack_helicopter_equipment_4_short:0 "AH-64D Apache à arc long"
 KOR_attack_helicopter_equipment_4_desc:0 "Fierté de l'armée américaine, en plus de sa superbe maniabilité, le radar Longbow fixé au-dessus du rotor principal améliore sa capacité à utiliser des missiles dans toutes sortes de conditions météorologiques. En raison du radar susmentionné, on lui donne le surnom d'« Apache Longbow »."
 KOR_attack_helicopter_equipment_5:0 "McDonnell Douglas AH-64E Gardien"
 KOR_attack_helicopter_equipment_5_short:0 "Gardien AH-64E"
 KOR_attack_helicopter_equipment_5_desc:0 "L'AH-64E est doté d'une connectivité numérique améliorée, du système de distribution d'informations tactiques interarmées, de moteurs T700-GE-701D plus puissants avec une transmission par train frontal améliorée pour accueillir plus de puissance, d'une capacité de contrôle de véhicules aériens sans pilote (UAV), d'une capacité IFR complète et d'un train d'atterrissage amélioré. Les nouvelles pales de rotor composites, testées avec succès en 2004, augmentent la vitesse de croisière, le taux de montée et la capacité de charge utile."
 
 KOR_scout_helicopter_equipment_1:0 "Hughes OH-6 Cayuse"
 KOR_scout_helicopter_equipment_1_short:0 "OH-6 Cayuse"
 KOR_scout_helicopter_equipment_1_desc:0 "Développé en 1960, l'OH-6 a été conçu dans le cadre du projet Light Observation Helicopter (LOH), à des fins d'observation, d'évacuation des blessés, de transport de personnel et d'attaque légère. Le design de Hughes serait celui qui réussirait parmi onze autres designs concurrents. Il remplacerait l'O-1 Bird Dog dans le rôle d'observation lorsque le département américain de la Défense ordonnait à l'armée américaine de transférer tous les avions à voilure fixe à l'US Air Force. Servi avec distinction pendant la guerre du Vietnam, l'OH-6 avait montré la valeur des hélicoptères d'observation comme support aux hélicoptères d'attaque comme l'AH-1 ou aux forces terrestres pour engager les ennemis. Officiellement connu sous le nom de « Cayuse » (d'après la tribu amérindienne du nord-ouest du Pacifique), les pilotes lui ont donné le surnom de « Loach » en hommage au programme qui l'a engendré."
