 KOR_cas_stealth_equipment_1:0 "KAI FA-50 Aigle royal"
 KOR_cas_stealth_equipment_1_short:0 "FA-50 Aigle royal"
 KOR_cas_stealth_equipment_1_desc:0 "Le KAI T-50 Golden Eagle est une famille d'avions d'entraînement à réaction supersoniques avancés et d'avions de combat légers sud-coréens, développés par Korea Aerospace Industries (KAI) avec Lockheed Martin. Le T-50 est le premier avion supersonique sud-coréen et l'un des rares avions d'entraînement supersoniques au monde. Le développement a commencé à la fin des années 1990 et son vol inaugural a eu lieu en 2002. L'avion est entré en service actif dans l'armée de l'air de la République de Corée (ROKAF) en 2005."

 KOR_nav_bomber_equipment_1:0 "PBY-1 Catalina consolidé"
 KOR_nav_bomber_equipment_1_short:0 "PBY-1"
 KOR_nav_bomber_equipment_1_desc:0 "Variante de production initiale avec deux moteurs R-1830-64 de 900 ch. Le Consolidated PBY Catalina est un hydravion et un avion amphibie produits dans les années 1930 et 1940. En service au Canada, il était connu sous le nom de Canso. C'était l'un des hydravions les plus utilisés de la Seconde Guerre mondiale. Catalinas a servi dans toutes les branches des forces armées des États-Unis ainsi que dans les forces aériennes et navales de nombreux autres pays. Les derniers PBY militaires ont servi jusque dans les années 1980. En 2021, 86 ans après son premier vol, l'avion continue de voler comme bombardier à eau (ou avion-citerne) dans le cadre d'opérations aériennes de lutte contre les incendies dans certaines régions du monde. Aucun ne reste au service militaire. "
 KOR_nav_bomber_equipment_2:0 "PBY-5 Catalina consolidé"
 KOR_nav_bomber_equipment_2_short:0 "PBY-5"
 KOR_nav_bomber_equipment_2_desc:0 "Le Consolidated PBY Catalina est un hydravion et un avion amphibie produits dans les années 1930 et 1940. En service au Canada, il était connu sous le nom de Canso. C'était l'un des hydravions les plus utilisés de la Seconde Guerre mondiale. Catalinas a servi dans toutes les branches des forces armées des États-Unis ainsi que dans les forces aériennes et navales de nombreux autres pays. Les derniers PBY militaires ont servi jusque dans les années 1980. En 2021, 86 ans après son premier vol, l'avion continue de voler comme bombardier à eau (ou avion-citerne) dans le cadre d'opérations aériennes de lutte contre les incendies dans certaines régions du monde. Aucun ne reste au service militaire. "
 KOR_nav_bomber_equipment_3:0 "Corsaire consolidé PB4Y-2"
 KOR_nav_bomber_equipment_3_short:0 "Corsaire PB4Y-2"
 KOR_nav_bomber_equipment_3_desc:0 "Le Consolidated PB4Y-2 Privateer est un bombardier de patrouille américain de la Seconde Guerre mondiale et de la guerre de Corée dérivé du Consolidated B-24 Liberator."
 KOR_nav_bomber_equipment_4:0 "Lockheed P2V-2 Neptune"
 KOR_nav_bomber_equipment_4_short:0 "P2V-2 Neptune"
 KOR_nav_bomber_equipment_4_desc:0 "Le P2V était un avion de patrouille maritime et anti-sous-marin développé pour remplacer le PV-1 Ventura et le PV-2 Harpoon de la Seconde Guerre mondiale. Introduit en 1947 pour l'US Navy, il s'agissait en fait d'un avion basé à terre, et le P2V, plus tard désigné P-2 après 1962, n'a jamais effectué d'atterrissage sur un porte-avions, mais un petit nombre a été converti et déployé à partir de porte-avions comme bombardiers nucléaires provisoires qui devraient atterrir sur le rivage ou dans un fossé, à l'instar des bombardiers utilisés lors du raid de Doolittle pendant la Seconde Guerre mondiale. Son surnom est « Neptune », du nom du dieu romain de la mer."
 KOR_nav_bomber_equipment_5:0 "Lockheed P2V-7 Neptune"
 KOR_nav_bomber_equipment_5_short:0 "P2V-7 Neptune"
 KOR_nav_bomber_equipment_5_desc:0 "Dernière variante du Neptune produite par Lockheed, propulsée par des moteurs R-3350-32W et J-34. Équipé de réservoirs à bout d'aile à traînée inférieure, d'un radar de recherche AN/APS-20 dans un radôme révisé et d'une verrière de cockpit bombée. Les premiers avions étaient équipés de tourelles défensives, mais celles-ci furent supprimées comme pour le P2V-5."
 KOR_nav_bomber_equipment_6:0 "Lockheed P-3 Orion"
 KOR_nav_bomber_equipment_6_short:0 "P-3A Orion"
 KOR_nav_bomber_equipment_6_desc:0 "Le P-3A (initialement désigné P3V), basé sur l'avion de ligne Lockheed L-188 Electra, a été conçu pour remplacer les anciens P-2 Neptune et P-5 Marlin dans le rôle de patrouille maritime et de guerre anti-sous-marine terrestre (ASW). Il dispose d'une soute à bombes interne pour les torpilles aériennes, avec des pylônes sous les ailes pour une myriade d'armes, notamment des missiles antinavires à longue portée, des missiles air-sol, des mines et des charges sous-marines. Il est également équipé d'un détecteur d'anomalies magnétiques sur sa queue pour détecter les sous-marins utilisant le champ magnétique terrestre. Avec de tels outils à sa disposition et continuant à jouer un rôle depuis son introduction en 1962, il est tout à fait approprié que l'avion soit surnommé « Orion ». Le chasseur de navires ennemis."
 KOR_nav_bomber_equipment_7:0 "Lockheed P-3CK Orion"
 KOR_nav_bomber_equipment_7_short:0 "P-3CK Orion"
 KOR_nav_bomber_equipment_7_desc:0 "Le P-3CK disposait d'une nouvelle suite ASW et d'un ordinateur de mission avec une disposition interne révisée. À l'extérieur, le P-3C comportait une échelle d'entrée à commande électrique ; petite antenne à aileron ; chutes de bouées sonores ventrales chargées extérieurement ; et trois petites fenêtres sur le côté arrière droit (une fenêtre à l'avant de la sortie de secours au-dessus de l'aile et deux bien à l'arrière). Les avions de production initiaux avaient un nez de caméra situé sur la partie inférieure du radôme. Les avions de production ultérieurs avaient une tourelle IRDS rétractable à la place de la caméra nasale. À partir du début des années 1980, les nez de caméra existants ont été équipés de tourelles IRDS. Les premiers modèles étaient également connus sous le nom d'avion P-3C « Baseline » ou Non-Update (NUD). Tous les avions ont ensuite été équipés de deux systèmes de navigation inertielle LTN-72."
 KOR_nav_bomber_equipment_8:0 "Boeing P-8 Poséidon"
 KOR_nav_bomber_equipment_8_short:0 "P-8 Poséidon"
 KOR_nav_bomber_equipment_8_desc:0 "Initialement connu sous le nom d'avion maritime multimission (MMA), le P-8 a été conçu pour remplacer le vénérable P-3 Orion. Développé à partir de l'avion de ligne Boeing 737 Next Generation, le P-8 a été conçu pour le rôle de guerre anti-sous-marine et de patrouille maritime. De plus, il peut jouer le rôle de support électronique (ESM) grâce à l'utilisation de sa capacité d'autoprotection d'alerte précoce (EWSP). Avec des variantes en service aux États-Unis, au Royaume-Uni, en Inde et en Australie depuis son introduction en 2013, le « Poséidon » deviendra le nouveau roi des mers."

 KOR_transport_plane_equipment_1:0 "Train aérien Douglas C-47"
 KOR_transport_plane_equipment_1_short:0 "Train aérien C-47"
 KOR_transport_plane_equipment_1_desc:0 "Développé à partir de l'avion de ligne Douglas DC-3 lors de son premier vol en 1941, le C-47 était l'avion de transport par excellence utilisé par les Alliés. Pendant la Seconde Guerre mondiale, les forces armées de nombreux pays ont utilisé le C-47 et des DC-3 modifiés pour le transport de troupes, de marchandises et de blessés. Plus de 10 000 unités, à la fois le C-47 et la variante navale R4D (plus tard C-117) ont été construites pour la guerre, et de nombreux « Skytrains » ont été utilisés non seulement pour le transport de troupes et de marchandises, mais aussi pour la recherche et le sauvetage et, pendant la guerre du Vietnam, comme premiers hélicoptères de combat."
 KOR_transport_plane_equipment_2:0 "Douglas C-54 Skymaster"
 KOR_transport_plane_equipment_2_short:0 "C-54 Skymaster"
 KOR_transport_plane_equipment_2_desc:0 "Tout comme le C-47 avant lui, le C-54 a été développé à partir d'un avion de ligne Douglas, cette fois-ci étant le DC-4. Introduit en 1942, le C-54 servait au transport de fret, mais transportait également d'importants VIP, étant l'un des premiers avions à transporter le président des États-Unis (mais pas le premier avion à être désigné Air Force One.). La renommée du « Skymaster » venait cependant du fait qu'il était le type majoritaire utilisé pour transporter du charbon et des vivres vers Berlin-Ouest, pendant le célèbre pont aérien de Berlin. Les variantes de la marine étaient connues sous le nom de R5D."
 KOR_transport_plane_equipment_3:0 "Douglas C-124A Globemaster II"
 KOR_transport_plane_equipment_3_short:0 "C-124A Globemaster II"
 KOR_transport_plane_equipment_3_desc:0 "Le C-124 était le principal moyen de transport lourd du service de transport aérien militaire (MATS) de l'armée de l'air américaine au cours des années 1950 et au début des années 1960, jusqu'à ce que le Lockheed C-141 Starlifter entre en service. Il a servi dans les unités de la Réserve de la Force aérienne et de la Garde nationale aérienne acquises par le MATS, puis par le Military Airlift Command (MAC), jusqu'en 1974."
