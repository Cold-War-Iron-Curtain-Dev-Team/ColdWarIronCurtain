 KOR_fighter_equipment_0:0 "Force aérienne de la République de Corée"
 KOR_fighter_equipment_0_short:0 "ROKAF"
 KOR_fighter_equipment_0_desc:0 "Loi sur l'organisation des forces armées\nArticle 2 (Organisation des forces armées)\n1. Les forces armées seront organisées en armée, marine et force aérienne (ci-après dénommées « chaque armée ») et disposeront d'un corps de marine au sein de la marine.\nArticle 3 (Fonctions du chef de chaque comté, etc.)\n4. L'Armée de l'Air sera responsable des opérations aériennes et sera organisée, équipée et fournira l'éducation et la formation nécessaires."
