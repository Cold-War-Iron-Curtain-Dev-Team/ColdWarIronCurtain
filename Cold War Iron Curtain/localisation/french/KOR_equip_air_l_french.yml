 KOR_utility_helicopter_equipment_1:0 "Sikorsky H-19"
 KOR_utility_helicopter_equipment_1_short:0 "H-19"
 #KOR_utility_helicopter_equipment_1_desc:0 ""
 KOR_utility_helicopter_equipment_2:0 "Bell UH-1A Iroquois"
 KOR_utility_helicopter_equipment_2_short:0 "UH-1A Iroquois"
 KOR_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connue sous le nom de « Huey » (du nom de sa désignation originale d'avant 1962, HU-1), l'UH-1A est la variante du modèle militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agissait du premier hélicoptère en service par une branche de l'armée américaine à utiliser un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication américaine dans la guerre du Vietnam. Bien que son nom soit officieusement « Huey », son surnom officiel est « Iroquois »."
 KOR_utility_helicopter_equipment_3:0 "Bell UH-1D Iroquois"
 KOR_utility_helicopter_equipment_3_short:0 "UH-1D Iroquois"
 KOR_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."
 KOR_utility_helicopter_equipment_4:0 "Bell UH-1H Twin Huey"
 KOR_utility_helicopter_equipment_4_short:0 "UH-1H Twin Huey"
 KOR_utility_helicopter_equipment_4_desc:0 "Introduit pour la première fois en 1970, l'UH-1N était un autre membre de la famille élargie « Huey », cette fois développé à partir de l'UH-1H, bien que contrairement à l'UH-1A et à l'UH-1D, la variante « N » serait celle qui donnerait naissance à sa version civile, le Bell 212. Le rotor principal est propulsé par deux turbomoteurs qui entraînent un seul arbre de sortie. En cas de panne d'un moteur, le moteur restant peut fournir 671 kW (900 shp) pendant 30 minutes ou 571 kW (765 shp), permettant à l'UH-1N de maintenir ses performances de croisière au poids maximum. C'était également l'une des rares variantes « iroquoises » à ne pas être utilisée par l'armée américaine, étant plutôt le porte-drapeau des Marines. Sa configuration bimoteur lui a valu le surnom informel de « Twin Huey »."
 KOR_utility_helicopter_equipment_5:0 "Sikorsky UH-60A Faucon Noir"
 KOR_utility_helicopter_equipment_5_short:0 "UH-60A Faucon Noir"
 KOR_utility_helicopter_equipment_5_desc:0 "Entré en service en 1979, l'UH-60A a succédé à l'UH-1 en tant que plate-forme d'hélicoptère utilitaire de l'armée américaine. Développé à partir du S-70 civil, l'UH-60A pouvait transporter jusqu'à 15 personnes (4 membres d'équipage et jusqu'à 11 soldats équipés). Nommé d'après un chef de tribu amérindienne Sauk, le « Blackhawk » a servi au combat lors de conflits à la Grenade, au Panama, en Irak, en Somalie, dans les Balkans, en Afghanistan et dans d'autres régions du Moyen-Orient."
 KOR_utility_helicopter_equipment_6:0 "Sikorsky UH-60P Faucon Noir"
 KOR_utility_helicopter_equipment_6_short:0 "UH-60P Faucon Noir"
 KOR_utility_helicopter_equipment_6_desc:0 "Une mise à niveau de l'UH-60A, la variante « L » du « Blackhawk » comprend des moteurs améliorés, une boîte de vitesses à durabilité améliorée et un système de commandes de vol mis à jour. Introduit en 1990, l'UH-60L est la principale variante de la variante utilitaire du H-60 actuellement en service dans l'armée américaine, avec des considérations sur le type utilisé pour remplacer l'UH-1N dans l'US Air Force."
 KOR_utility_helicopter_equipment_7:0 "KAI KUH-1 Surion"
 KOR_utility_helicopter_equipment_7_short:0 "KUH-1 Surion"
 KOR_utility_helicopter_equipment_7_desc:0 "Le KAI KUH-1 Surion est un hélicoptère utilitaire de transport bimoteur développé principalement par Korea Aerospace Industries (KAI), l'Agence pour le développement de la défense (ADD) et l'Institut coréen de recherche aérospatiale (KARI) conjointement avec Eurocopter."

 #KOR_cargo_helicopter_equipment_1:0 "Boeing CH-47A Chinook"
 #KOR_cargo_helicopter_equipment_1_short:0 "CH-47A Chinook"
 #KOR_cargo_helicopter_equipment_1_desc:0 "The CH-47 (originally HC-1B) is a twin-engine, tandem-rotor helicopter that is among the heaviest lifting helicopters of the West. Replacing the CH-37 Mojave, the CH-47 possesses several means of loading various cargo, including multiple doors across the fuselage, a wide loading ramp located at the rear of the fuselage, and a total of three external ventral cargo hooks to carry underslung loads. It was also the fastest helicopter among its contemporaries when introduced in 1962, and is still considered one of the fastest choppers in the U.S. Army's arsenal currently. Its name, 'Chinook', is from the Native American Chinook people of modern-day Washington state."
 #KOR_cargo_helicopter_equipment_2:0 "Sikorsky CH-53A Sea Stallion"
 #KOR_cargo_helicopter_equipment_2_short:0 "CH-53A Sea Stallion"
 #KOR_cargo_helicopter_equipment_2_desc:0 "The CH-47 (originally HC-1B) is a twin-engine, tandem-rotor helicopter that is among the heaviest lifting helicopters of the West. Replacing the CH-37 Mojave, the CH-47 possesses several means of loading various cargo, including multiple doors across the fuselage, a wide loading ramp located at the rear of the fuselage, and a total of three external ventral cargo hooks to carry underslung loads. It was also the fastest helicopter among its contemporaries when introduced in 1962, and is still considered one of the fastest choppers in the U.S. Army's arsenal currently. Its name, 'Chinook', is from the Native American Chinook people of modern-day Washington state."
 KOR_cargo_helicopter_equipment_3:0 "Boeing CH-47D Chinook"
 KOR_cargo_helicopter_equipment_3_short:0 "CH-47D Chinook"
 KOR_cargo_helicopter_equipment_3_desc:0 "Le CH-47D partage la même cellule que les modèles précédents, la principale différence étant l'adoption de moteurs plus puissants. Les premiers CH-47D étaient à l'origine propulsés par deux moteurs T55-L-712, le moteur le plus courant étant le dernier T55-GA-714A. Grâce à son système de chargement à triple crochet, le CH-47D peut transporter de lourdes charges utiles à l'intérieur et jusqu'à 26 000 lb (12 000 kg) (comme des conteneurs de 40 pieds ou de 12 mètres) à l'extérieur. Il a été mis en service pour la première fois en 1979. Dans les opérations d'assaut aérien, il sert souvent de moteur principal à l'obusier M198 de 155 mm, accompagnant 30 cartouches et un équipage de 11 hommes."
 KOR_cargo_helicopter_equipment_4:0 "Boeing HH-47 Chinook"
 KOR_cargo_helicopter_equipment_4_short:0 "HH-47 Chinook"
 KOR_cargo_helicopter_equipment_5:0 "Boeing CH-47D Chinook Bloc II"
 KOR_cargo_helicopter_equipment_5_short:0 "CH-47D Bloc II"
 KOR_cargo_helicopter_equipment_5_desc:0 "CH-47D mis à niveau avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les Chinook plus anciens ont été mis à niveau vers cette norme."
 KOR_cargo_helicopter_equipment_6:0 "Boeing CH-47DLR Chinook"
 KOR_cargo_helicopter_equipment_6_short:0 "CH-47DLR Chinook"
 KOR_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, un CH-47D amélioré, a effectué son vol inaugural ; le premier modèle de production a été déployé le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les mises à niveau comprennent des moteurs Honeywell de 4 868 chevaux (3 630 kW) et la cellule dotée d'une plus grande construction monobloc pour réduire les besoins de maintenance. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion pour augmenter la durée de vie."