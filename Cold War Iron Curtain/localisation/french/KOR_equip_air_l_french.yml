 KOR_recon_equipment_0_desc:0 "Le Stinson L-5 Sentinel était un avion de liaison et de reconnaissance photographique de la Seconde Guerre mondiale utilisé par toutes les branches de l'armée américaine et par la Royal Air Force britannique. Il a été produit par la Stinson Aircraft Company."
