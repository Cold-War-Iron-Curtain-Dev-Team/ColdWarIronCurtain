 KOR_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 KOR_mr_stealth_fighter_equipment_1_short:0 "F-35A Foudre II"
 KOR_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnel (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le développement du programme F-35 a commencé en 1992, la variante A prenant son envol fin 2006 et larguant ses premières bombes moins de six ans plus tard. La variante A est la variante la plus petite et la plus légère du F-35 et est principalement destinée à remplacer le F-16 Fighting Falcon. La République de Corée était l'une des nombreuses nations alliées à avoir acheté des F-35."

