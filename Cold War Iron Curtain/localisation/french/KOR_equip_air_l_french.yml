 KOR_jet_tac_bomber_equipment_7:0 "McDonnell Douglas F-15K Strike Eagle"
 KOR_jet_tac_bomber_equipment_7_short:0 "Aigle d'attaque F-15K"
 KOR_jet_tac_bomber_equipment_7_desc:0 "Le Strike Eagle est conçu comme un avion d'attaque rapide capable d'effectuer des missions sans soutien de guerre électronique."
 KOR_jet_tac_bomber_equipment_8:0 "Boeing F-15SE Aigle silencieux"
 KOR_jet_tac_bomber_equipment_8_short:0 "F-15SE Aigle silencieux"
 KOR_jet_tac_bomber_equipment_8_desc:0 "Une mise à niveau du chasseur d'attaque F-15E utilisant des fonctionnalités furtives, une capacité d'armement accrue et de nouveaux systèmes de guerre électronique."
 
 KOR_strat_bomber_equipment_1:0 "Mitsubishi Ki-21"
 KOR_strat_bomber_equipment_1_short:0 "Ki-21"
 KOR_strat_bomber_equipment_2:0 "Mitsubishi G7M"
 KOR_strat_bomber_equipment_2_short:0 "G4M"
 KOR_strat_bomber_equipment_3:0 "Boeing B-29 Superforteresse"
 KOR_strat_bomber_equipment_3_short:0 "Superforteresse B-29"
 KOR_strat_bomber_equipment_3_desc:0 "Le B-29 était un bombardier quadrimoteur à hélices introduit en 1944. Il s'agissait du projet d'armement le plus coûteux jamais réalisé pendant la guerre, dépassant même le coût du programme d'armes nucléaires des États-Unis à l'époque. Conçu comme un bombardier stratégique à haute altitude, il a été utilisé comme bombardier incendiaire nocturne à basse altitude, lançant des raids à la bombe incendiaire sur le Japon. Mais la renommée de la « Superforteresse » réside dans le largage des bombes atomiques sur Hiroshima et Nagasaki, qui ont contribué à la fin de la guerre. Les variantes mises à jour (y compris le B-50 redésigné) continueraient à servir de bombardier stratégique pendant la guerre de Corée avant de prendre leur retraite au début des années 1950."
 
