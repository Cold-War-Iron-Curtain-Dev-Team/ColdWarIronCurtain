 KOR_heavy_fighter_equipment_3:0 "F-82 Twin Mustang nord-américain"
 KOR_heavy_fighter_equipment_3_short:0 "F-82 Twin Mustang"
 KOR_heavy_fighter_equipment_3_desc:0 "Développé à l'origine comme chasseur d'escorte à longue portée pour la Seconde Guerre mondiale, le P-82 a été introduit en 1946, trop tard pour servir dans le conflit. Développé à partir du vénéré P-51, le P-82 (plus tard F-82) a été utilisé en remplacement du P-61 Black Widow et a été équipé d'un radar pour soutenir le Commandement stratégique aérien. Parce que la cellule ressemble à 2 P-51 en kit, elle a reçu le surnom de « Twin Mustang »."
 
 KOR_jet_interceptor_equipment_1:0 "Lockheed F-94 Starfire"
 KOR_jet_interceptor_equipment_1_short:0 "F-94 Starfire"
 KOR_jet_interceptor_equipment_1_desc:0 "Développé à partir du F-80 Shooting Star, le F-94 a été conçu pour remplacer les F-61 Black Widow et les F-82 Twin Mustang Heavy Night Fighters à hélices. Initialement équipé d'un armement de canons (quatre, puis huit mitrailleuses de 12,7 mm), son armement de canons serait remplacé par un composant entièrement de fusée, lancé depuis ses baies internes. « Surnommé Starfire », ce serait le premier intercepteur à réaction majeur de l'histoire de l'USAF."
