 ###Ideas and Modifiers###
 
 WGR_Socialist_Unrests_Gehlen: "Troubles socialistes"
 WGR_Socialist_Unrest_Gehlen_desc: "Le coup d'État et le démantèlement des structures communistes et socialistes ont frappé les principales villes d'Allemagne de l'Ouest, entraînant le soulèvement des ouvriers et des paysans contre le régime militaire, en faisant grève et en s'opposant aux forces fédérales."
 WGR_Vaterlaendische_Front: "Front du Vaterländsiche"
 WGR_Vaterlaendische_Front_desc: "Afin d'établir un contrepoids aux milices locales dans les grandes villes allemandes, le soutien contre-révolutionnaire doit être correctement organisé. Le \"Front Vaterländische\" servira dans la tradition du Stahlhelm, luttant contre les forces communistes et socialistes en Allemagne, assistant la Bundespolizei, en particulier dans les zones urbaines."
 WGR_Socialist_Unrest: "Troubles socialistes"
 WGR_Socialist_Unrest_desc: "Le coup d'État et le démantèlement des structures communistes et socialistes ont frappé les principales villes d'Allemagne de l'Ouest, entraînant le soulèvement des ouvriers et des paysans contre le régime militaire, en faisant grève et en s'opposant aux forces fédérales."  
 WGR_Socialist_Unrest_2: "Agitation socialiste affaiblie"
 WGR_Socialist_Unrest_2_desc: "Suite aux mesures gouvernementales intenses visant à contenir le vandalisme et le terrorisme, les grèves et les émeutes ont diminué dans les grandes villes allemandes. Les partisans de la ligne dure au sein des syndicats restent cependant fermes et s'opposent jusqu'à leur dernier souffle à toute police fédérale. Ce n'est qu'une question de temps avant qu'ils ne cèdent."
