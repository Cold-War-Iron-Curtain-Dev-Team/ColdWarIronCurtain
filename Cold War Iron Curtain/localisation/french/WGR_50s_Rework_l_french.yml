 WGR_Schumacher_49_Form_a_Coalition_with_the_Centre_Party_desc: "Avec la CDU/CSU comme principale opposition, notre chemin vers une majorité stable passe par les partis du centre. En intégrant le Parti Zentrum dans notre coalition avec les libéraux, nous pouvons ressusciter l'esprit de l'ancienne coalition de Weimar, unissant les sociaux-démocrates, les libéraux et les démocrates-chrétiens d'un autre courant pour forger une nouvelle république stable."

 WGR_Schumacher_49_Decide_on_Frankfurt_As_the_Capital_desc: "Bonn est une solution temporaire et provinciale. Une Allemagne forte et revitalisée a besoin d'une capitale dotée d'une histoire, d'une puissance économique et d'une stature. Francfort-sur-le-Main, centre financier et siège du Parlement de Francfort de 1848, est le choix idéal pour représenter l'avenir démocratique et économique de notre nation."

 WGR_Schumacher_49_Focus_on_Newfound_Cooperation_with_the_Federal_States_desc: "Notre Loi fondamentale institue une république fédérale, et la force de l'ensemble dépend de la force de ses parties. En favorisant un nouvel esprit de coopération avec les gouvernements des Länder, nous pouvons garantir que la politique fédérale est mise en oeuvre efficacement et que les préoccupations régionales sont prises en compte au niveau national."

 WGR_Schumacher_49_Form_the_Federal_Border_Guard_desc: "La sécurité de nos frontières ne peut être laissée aux seules puissances alliées. La création d'un Bundesgrenzschutz, un garde-frontière fédéral, est une première étape cruciale vers l'affirmation de notre souveraineté nationale et la garantie que nous disposons d'une force professionnelle et démocratiquement contrôlée pour surveiller nos frontières."

 WGR_Schumacher_49_Propose_Reforms_to_the_Bundesrat_desc: "Le Bundesrat, qui représente les Länder, joue un rôle essentiel dans notre processus législatif. Toutefois, sa structure actuelle pourrait être rationalisée pour mieux refléter les besoins d'un gouvernement fédéral moderne. Nous proposerons des réformes pour garantir qu'il agisse comme un partenaire constructif et non comme un obstacle au progrès national."
 
 WGR_Schumacher_49_Denounce_CDU_Ideas_of_Nazism_in_the_Government_desc: "Alors que nous nous concentrons sur l'épuration des véritables nationaux-socialistes, l'opposition d'Adenauer semble bien trop disposée à réintégrer les anciens membres du parti dans la bureaucratie. Il faut dénoncer publiquement et avec force ce pragmatisme alarmant. Une véritable démocratie ne peut pas être bâtie sur des fondations gérées par ceux qui ont si récemment cherché à la détruire."

 WGR_Schumacher_49_Arrest_and_Try_Prominent_Nazis_desc: "Beaucoup de ceux qui ont occupé des postes de pouvoir sous le régime nazi sont toujours libres dans notre pays. Cette injustice ne peut pas durer. Nous donnerons à nos autorités les moyens d'identifier, d'arrêter et de traduire en justice d'anciens nazis éminents qui ont jusqu'à présent échappé à toute punition pour leurs crimes."

 WGR_Schumacher_49_Form_A_Commission_to_Investigate_High_Ranking_Nazis_desc: "Les vrilles du national-socialisme sont encore profondément ancrées dans notre société et nos institutions. Une commission gouvernementale spéciale sera créée, dont la mission unique sera d'enquêter sur d'anciens fonctionnaires et industriels de haut rang, de découvrir leurs réseaux et de recommander des poursuites contre eux."

 WGR_Schumacher_49_Begin_Black_and_Red_Campaign_desc: "La démocratie est menacée sur deux fronts : les vestiges bruns du nazisme et la marée rouge du communisme. Notre gouvernement lancera une campagne nationale pour sensibiliser le public aux dangers des deux idéologies totalitaires, renforçant ainsi notre engagement en faveur d'une Allemagne à la fois libre et démocratique."

 WGR_Schumacher_49_Ban_Commies_and_Nazis_from_Govt_desc: "La fonction publique doit être fidèle à la constitution et à la constitution seule. Nous adopterons une législation interdisant formellement à toute personne ayant un passé vérifié au sein du parti nazi ou une adhésion active au Parti communiste d'occuper un poste au sein du gouvernement."

 WGR_Schumacher_49_Demand_Argentina_Extradite_Nazis_desc: "C'est une honte mondiale que de nombreux criminels de guerre nazis aient trouvé refuge en Amérique du Sud. Nous exigerons formellement que le gouvernement argentin extrade ces fugitifs vers l'Allemagne pour y être jugés. La justice doit être internationale."

 WGR_Schumacher_49_Deport_Commies_to_DDR_desc: "Ceux qui prêtent allégeance non pas à Francfort, mais à Berlin-Est et à Moscou n'ont pas leur place dans notre république. Pour les communistes qui travaillent activement à renverser notre État, un aller simple à travers la frontière intérieure de l'Allemagne semble une solution appropriée. Qu'ils profitent du « paradis des travailleurs » qu'ils admirent tant."

 WGR_Schumacher_49_Enforce_Loyalty_Oaths_desc: "Pour garantir l'intégrité de nos institutions démocratiques, nous commencerons à exiger de tous les fonctionnaires, des greffiers locaux aux ministres fédéraux, qu'ils prêtent un serment de loyauté à la Loi fondamentale. Ceux qui refusent n'auront aucun avenir dans la fonction publique."

 WGR_Schumacher_49_Begin_Surveillance_desc: "La liberté exige de la vigilance. Pour protéger notre démocratie de ceux qui cherchent à la détruire de l'intérieur, nous devons autoriser nos services de sécurité à commencer à surveiller activement les individus et les groupes crédiblement liés à des activités extrémistes et anticonstitutionnelles."

 WGR_Schumacher_49_Invite_McCarthy_desc: "Bien que ses méthodes soient controversées, le sénateur américain Joseph McCarthy est une voix de premier plan dans la lutte mondiale contre le communisme. Une invitation à visiter l'Allemagne enverrait un message puissant à Moscou - et à nos alliés à Washington - selon lequel nous sommes extrêmement sérieux dans notre volonté d'éradiquer l'influence marxiste."

 WGR_Schumacher_49_Announce_Volks_Economy_Program_desc: "L'« économie sociale de marché » de l'opposition ne fait que parler du « social » en paroles. Notre vision est différente. Le programme Volks Economy réorientera notre politique économique pour qu'elle profite directement au peuple allemand, en donnant la priorité au plein emploi, à des salaires équitables et à une sécurité sociale solide plutôt qu'aux profits incontrôlés des entreprises."

 WGR_Schumacher_49_Social_Insurance_desc: "Un État industriel moderne doit protéger ses travailleurs des incertitudes de la vie. En introduisant des régimes d'assurance complets et soutenus par l'État pour le chômage, l'invalidité et les soins de santé, nous posons les bases d'un véritable filet de sécurité sociale."

 WGR_Schumacher_49_Found_Federal_Ministry_of_Economics_desc: "Pour consolider le rôle du mouvement syndical au coeur de notre planification économique, le ministère fédéral de l'Économie sera réformé. Il va désormais intégrer formellement les syndicats dans sa structure, garantissant ainsi que la voix des travailleurs soit entendue aux plus hauts échelons du gouvernement."

 WGR_Schumacher_49_Seize_Ruhr_Coal_Facilities_desc: "Le charbon de la Ruhr est l'élément vital de l'industrie allemande et il ne doit pas rester entre les mains des mêmes industriels qui ont alimenté la machine de guerre nazie. L'État prendra le contrôle de ces installations vitales, en veillant à ce qu'elles soient gérées dans l'intérêt de la nation et non des dynasties privées."

 WGR_Schumacher_49_Prioritize_Resources_Domestically_desc: "Nos gens ont encore froid et nos usines ont faim de ressources. Même si les exportations sont importantes, les besoins immédiats de la population allemande et de nos industries nationales doivent primer. Nous dirigerons des ressources vitales comme le charbon et l'acier vers nos propres marchés."

 WGR_Schumacher_49_Nationalize_VW_and_IG_Farben_desc: "Certaines entreprises sont trop vitales, ou trop compromises sur le plan historique, pour être laissées entre des mains privées. Le géant industriel IG Farben, complice de crimes indescriptibles, et Volkswagen, symbole de notre potentiel industriel, seront placés sous propriété publique."

 WGR_Schumacher_49_Pass_Steel_Mine_Working_Regulations_desc: "Pendant trop longtemps, les hommes qui travaillent dans nos mines et nos aciéries ont enduré des conditions dangereuses pour peu de récompense. Notre gouvernement est à leurs côtés. Nous adopterons et appliquerons de nouvelles réglementations plus strictes pour garantir la sécurité des travailleurs et un traitement équitable dans ces industries essentielles."
 
 WGR_Schumacher_49_Debate_the_Petersberg_Agreement_desc: "Les Accords de Petersberg, négociés par la Haute-Commission alliée, définissent nos relations avec les puissances occupantes. Avant d'engager l'avenir de l'Allemagne, ses conditions doivent être rigoureusement débattues au Bundestag. Nous n'accepterons pas les directives alliées."

 WGR_Schumacher_49_Refuse_to_Sign_the_Western_Dictated_Treaties_desc: "On nous dit que ces traités sont pour notre propre bien, mais ils sont dictés par une position de pouvoir et non par un partenariat. Le gouvernement Schumacher, fidèle à ses principes, refusera de signer tout accord qui traiterait l'Allemagne comme un État subordonné et mettrait en péril l'avenir de la réunification."

 WGR_Schumacher_49_Sign_for_Germanys_Future_desc: "Après d'intenses négociations et l'obtention de concessions cruciales, le moment est venu de regarder vers l'avenir. Même si les traités sont imparfaits, leur signature constitue une étape pragmatique vers une plus grande souveraineté et assurer notre place dans le monde occidental. Nous signons non pas en signe de soumission, mais en gardant un oeil tourné vers l'avenir de l'Allemagne."

 WGR_Schumacher_49_Begin_a_New_Decade_With_a_New_Germany_desc: "Les années 1940 furent une décennie de ruine et de honte. À l'aube des années 1950, l'heure est à un nouveau départ. Avec un gouvernement démocratique en place et une vision claire de l'avenir, nous entrerons dans cette nouvelle décennie avec pour objectif de construire une Allemagne pacifique, prospère et unie."

 WGR_Schumacher_49_Introduce_the_Frankfurt_Program_desc: "Notre gouvernement étant désormais solidement établi, nous présenterons officiellement le programme de Francfort. Cette plate-forme complète expose notre vision pour la nation, depuis la création d'un État-providence jusqu'à notre position inflexible sur la réunification allemande."

 WGR_Schumacher_49_Consider_Position_in_Europe_desc: "L'Allemagne se trouve au coeur de l'Europe et notre destin est étroitement lié à celui du continent. Nous devons maintenant examiner attentivement notre position à long terme. Devrions-nous nous intégrer profondément à l'Occident, ou devrions-nous tracer une voie plus indépendante entre les deux grands blocs ?"

 WGR_Schumacher_49_Western_Integration_desc: "Tout en maintenant nos principes, nous ne pouvons pas nous permettre de rester isolés. Une voie d'intégration prudente avec les démocraties d'Europe occidentale et d'Amérique du Nord offre la meilleure sécurité contre l'agression soviétique et la promesse de prospérité économique. Nous resterons ouverts à cette possibilité."

 WGR_Schumacher_49_Reject_European_Army_desc: "La proposition française d'une « armée européenne » est inacceptable. Il s'agit d'une tentative à peine voilée de contrôler le réarmement allemand et d'empêcher la formation d'un état-major allemand. Nous ne contribuerons à la défense européenne qu'en tant qu'égaux, et non en tant que légionnaires d'une force dirigée par la France."

 WGR_Schumacher_49_Denounce_Allied_Rearmament_desc: "La poussée soudaine des Alliés en faveur du réarmement allemand est hypocrite. Pendant des années, ils ont cherché à nous démilitariser et maintenant, craignant les Soviétiques, ils exigent que nous prenions les armes. Nous dénoncerons ces pressions et refuserons de nous laisser précipiter dans une remilitarisation sans garanties à toute épreuve pour notre souveraineté et notre sécurité."

 WGR_Schumacher_49_Debate_Schuman_Plan_desc: "Le ministre français des Affaires étrangères, Robert Schuman, a proposé de mutualiser la production européenne de charbon et d'acier. S'agit-il d'un véritable pas vers une Europe pacifique et intégrée, ou s'agit-il d'un mécanisme permettant à la France de contrôler l'industrie lourde allemande ? La proposition nécessite un examen minutieux et un débat public."

 WGR_Schumacher_49_More_Marshall_Plan_Aid_desc: "Le Plan Marshall a joué un rôle déterminant dans notre redressement, mais la tâche est loin d'être terminée. Notre gouvernement fera officiellement valoir aux États-Unis que l'aide économique continue, voire accrue, est vitale pour stabiliser la démocratie allemande et garantir que notre nation devienne un rempart contre le communisme."

 WGR_Schumacher_49_Western_Cultural_Agreements_desc: "Un partenariat avec l'Occident doit s'étendre au-delà des questions économiques et militaires. En concluant des accords culturels, des échanges étudiants et une coopération artistique avec des pays comme la France, la Grande-Bretagne et les États-Unis, nous pouvons rétablir la confiance et lier notre nouvelle Allemagne au tissu culturel du monde libre."

 WGR_Schumacher_49_Pursue_Non_Aligned_FP_desc: "Pourquoi l'Allemagne doit-elle choisir entre Washington et Moscou ? Il existe peut-être une troisième voie. En poursuivant une politique étrangère de non-alignement, calquée sur celle de pays comme la Suède ou la Yougoslavie, nous pourrions conserver notre indépendance et avoir de meilleures chances de négocier la réunification selon nos propres conditions."

 WGR_Schumacher_49_Push_for_WGR_Berlin_desc: "Le statut quadripartite actuel de Berlin est intenable. En tant que future capitale de la République fédérale, il est logique que Berlin-Ouest soit pleinement intégrée à l'Allemagne de l'Ouest, mettant fin à son statut ambigu de ville occupée et la plaçant fermement sous la protection et l'administration de notre gouvernement."

 WGR_Schumacher_49_Debate_Allied_Forces_in_WGR_desc: "Les forces alliées sur notre sol sont à la fois nos protectrices et nos occupants. Le moment est venu de débattre formellement de leur statut. Il faut trouver un nouvel arrangement qui fasse passer leur rôle d'occupation à celui de partenariat et de défense mutuelle, reconnaissant notre souveraineté croissante."

 WGR_Schumacher_49_Cooperate_with_Sweden_and_Switzerland_desc: "Dans un continent dominé par deux blocs opposés, les nations neutres et démocratiques que sont la Suisse et la Suède offrent un modèle intrigant. En favorisant des liens diplomatiques et économiques plus étroits avec eux, nous pouvons tirer les leçons de leur expérience et renforcer notre propre position en dehors des limites rigides de la guerre froide."

 WGR_Schumacher_49_Reach_Out_to_Moderate_SED_Members_desc: "Même si les dirigeants du SED sont inféodés à Moscou, des voix dissidentes se font entendre dans leurs rangs. Une démarche prudente et secrète auprès des membres du régime est-allemand les plus modérés ou les plus nationalistes pourrait ouvrir une nouvelle voie directe de dialogue sur l'avenir de l'Allemagne."

 WGR_Schumacher_49_Meet_with_Tito_desc: "Le maréchal Tito de Yougoslavie a défié Staline et a tracé sa propre voie de socialisme non aligné. Une rencontre entre le chancelier Schumacher et Tito serait un symbole puissant de notre indépendance à la fois de l'Est et de l'Ouest, et pourrait jeter les bases d'un partenariat entre les nations cherchant une « troisième voie »."

 WGR_Schumacher_49_Debate_Stalin_Notes_desc: "Une note est arrivée de Moscou. Staline propose une Allemagne neutre, réunifiée et réarmée. S'agit-il d'une offre authentique ou d'un stratagème cynique visant à faire dérailler l'intégration occidentale ? L'offre est trop importante pour être ignorée et trop dangereuse pour être acceptée au pied de la lettre. Notre réponse pourrait déterminer le sort de la nation."
 
 WGR_Schumacher_49_Schumachers_Stroke_desc: "Le désastre a frappé. Le chancelier Schumacher, le chef fougueux et indomptable de notre gouvernement, a été victime d'un grave accident vasculaire cérébral. Alors qu'il reste incapable, la nation retient son souffle. Le gouvernement est paralysé et un vide de pouvoir s'est ouvert au coeur même de notre jeune république, menaçant d'anéantir tous nos progrès."

 WGR_Schumacher_49_Choose_Franke_desc: "En l'absence du Chancelier, une décision doit être prise. Le vice-chancelier Egon Franke, figure de proue de l'aile droite du parti, est le successeur constitutionnellement désigné. Ses opinions pragmatiques et orientées vers l'Occident contrastent fortement avec de nombreuses politiques de Schumacher, ouvrant la voie à un conflit au sein du gouvernement."

 WGR_Schumacher_49_Support_Kanalarbeiters_desc: "Les « Kanalarbeiter » (travailleurs du canal) représentent la faction pragmatique de droite du SPD. Mécontents du parcours nationaliste et socialiste de Schumacher, ils voient cette crise comme une opportunité. En les soutenant, nous pouvons orienter le parti et le pays vers une position plus modérée et pro-occidentale."

 WGR_Schumacher_49_Seek_Cooperation_with_CDU_desc: "Avec le SPD divisé, il est impossible de gouverner. L'aile droite du parti, voyant un terrain d'entente avec l'opposition sur les questions de politique économique et étrangère, commencera à rechercher une coopération avec la CDU. Une grande coalition, autrefois impensable, semble désormais envisageable."

 WGR_Schumacher_49_Form_Caretaker_Govt_desc: "Avec le Chancelier frappé d'incapacité et la coalition en plein désarroi, la stabilité est primordiale. Un gouvernement intérimaire temporaire doit être formé pour gérer les affaires quotidiennes de l'État jusqu'à ce qu'une ligne de succession claire puisse être établie ou que de nouvelles élections soient convoquées."

 WGR_Schumacher_49_Sign_Frankfurt_Paris_Conventions_desc: "Les conventions, qui rapprocheraient l'Allemagne de l'Occident, ont été bloquées par Schumacher. Avec les pragmatiques désormais aux commandes, la voie est libre pour les signer. Cette décision consolidera notre alliance avec l'Occident mais sera considérée comme une trahison par l'aile gauche du SPD."

 WGR_Schumacher_49_Choose_Ollenhauer_desc: "Les factions de gauche et du centre du parti, fidèles à la vision de Schumacher, se sont ralliées à Erich Ollenhauer. Le nommer nouveau chancelier honorerait l'héritage de Schumacher mais défierait la succession constitutionnelle et mettrait en colère l'aile droite du parti, risquant une scission permanente."

 WGR_Schumacher_49_Face_Criticism_For_a_Coup_desc: "La nomination d'Erich Ollenhauer, sans tenir compte du vice-chancelier, a été décriée par l'opposition et la droite du SPD comme un « coup de palais ». Notre gouvernement est aujourd'hui confronté à une crise de légitimité qui menace de paralyser le Bundestag."

 WGR_Schumacher_49_Succession_Amendment_desc: "La crise actuelle a mis en lumière une dangereuse ambiguïté dans notre Loi fondamentale. Pour éviter qu'un tel vide de pouvoir ne se reproduise, nous devons adopter un amendement constitutionnel qui établit clairement et incontestablement la ligne de succession à la présidence et à la chancellerie."

 WGR_Schumacher_49_Push_For_Allied_Non_Involvement_desc: "À mesure que la crise politique interne de l'Allemagne s'aggrave, il existe un risque que la Haute-commission alliée intervienne. Nous devons affirmer fermement notre souveraineté et insister sur le fait qu'il s'agit d'un problème allemand qui doit être résolu par les Allemands seuls, sans ingérence étrangère."

 WGR_Schumacher_49_Allow_Schumacher_to_Return_desc: "Miraculeusement, la santé de Kurt Schumacher s'est suffisamment améliorée pour qu'il envisage un retour à la politique. Bien qu'affaiblie, sa présence pourrait unir le parti fracturé. Cependant, son retour bouleverserait également le nouvel équilibre politique et raviverait les anciens conflits."

 WGR_Schumacher_49_Strengthen_Federal_Cabinet_desc: "La Chancellerie s'est avérée être un point d'échec critique pendant la crise. En renforçant les pouvoirs collectifs du Cabinet fédéral et du Bundestag, nous pouvons garantir que le gouvernement puisse continuer à fonctionner même en cas d'incapacité de son chef."

 WGR_Schumacher_49_Agree_to_Compensation_for_Nazi_and_Commie_Victims_desc: "Notre lutte contre l'extrémisme doit aller de pair avec notre soutien à ses victimes. Le gouvernement créera un fonds pour fournir une compensation financière à ceux qui ont souffert à la fois sous le régime nazi et sous la persécution communiste, affirmant ainsi notre engagement en faveur de la justice."

 WGR_Schumacher_49_Face_CDU_Criticism_desc: "La décision d'autoriser Schumacher à revenir à la Chancellerie a suscité une tempête de critiques de la part de la CDU. Ils qualifient cette décision de déstabilisatrice, de mépris pour le processus constitutionnel et de replonger la république dans l'incertitude."

 WGR_Schumacher_49_Begin_Prepping_Ollenhauer_desc: "Schumacher, toujours stratège et conscient de sa propre mortalité, a commencé à préparer formellement Erich Ollenhauer pour être son successeur choisi. En transférant les responsabilités et en le soutenant publiquement, Schumacher espère garantir la pérennité de son héritage et de sa vision politique après son départ."

 WGR_Schumacher_49_Death_of_Schumacher_desc: "Le titan de la social-démocratie d'après-guerre a disparu. Kurt Schumacher a succombé à sa santé défaillante. Sa mort laisse non seulement le parti mais la nation tout entière sans sa voix la plus dominante et la plus intransigeante, annonçant une ère d'incertitude politique sans précédent."
 
 WGR_Schumacher_49_Franke_March_on_Chancellery_desc: "Se sentant trompés dans la succession qui leur revient, Egon Franke et ses partisans de la droite du SPD ont pris une mesure drastique. Dans le cadre d'une puissante protestation politique, ils marchent vers la Chancellerie pour exiger la démission d'Ollenhauer et affirmer les prétentions de Franke au leadership."

 WGR_Schumacher_49_Secure_Ollenhauer_Control_desc: "Alors que l'aile droite du parti est ouvertement en révolte, les loyalistes doivent agir vite. Nous rallierons l'appareil du parti, les syndicats et nos partenaires de coalition pour assurer le contrôle d'Erich Ollenhauer sur le gouvernement et repousser le défi de la faction de Franke."

 WGR_Schumacher_49_Split_from_Ollenhauer_SPD_desc: "La fracture est devenue un gouffre. Déclarant que le parti d'Ollenhauer avait été détourné par la gauche radicale, Egon Franke et ses partisans se sont officiellement séparés du SPD, formant leur propre groupe parlementaire et brisant le mouvement social-démocrate."

 WGR_Schumacher_49_Spread_Anti_Ollenhauer_Rhetoric_desc: "La faction Franke va maintenant lancer une campagne publique contre le nouveau chancelier. En décrivant Ollenhauer comme un idéologue de gauche faible, incapable de diriger la nation, ils espèrent éroder son soutien public et se positionner comme la seule alternative viable."

 WGR_Schumacher_49_Hold_Meetings_with_Adenauer_desc: "Egon Franke s'entretient désormais directement avec le leader de la CDU, Konrad Adenauer, ce qui aurait été impensable il y a encore quelques mois. Une alliance anti-Ollenhauer est en cours de discussion, qui pourrait voir se former une nouvelle coalition entre la droite du SPD et les démocrates-chrétiens."

 WGR_Schumacher_49_Involve_the_Federal_Constitutional_Court_desc: "La question de savoir qui est le chancelier légitime - Ollenhauer, nommé par le parti, ou Franke, le successeur désigné - a créé une crise constitutionnelle. Une faction fera appel à la Cour constitutionnelle fédérale de Karlsruhe pour qu'elle rende une décision contraignante et sorte de l'impasse."

 WGR_Schumacher_49_Rule_Bundestag_desc: "Après plusieurs jours de délibérations, la Cour constitutionnelle fédérale a rendu son arrêt. Citant des précédents et la procédure constitutionnelle, le tribunal a donné raison à Egon Franke et à l'aile droite du SPD. Le poste de chancelier d'Ollenhauer est déclaré illégitime, plongeant le gouvernement dans le chaos et offrant une victoire massive aux forces cherchant à s'aligner sur l'opposition."

 WGR_Schumacher_49_Rule_Ollenhauer_desc: "La Cour constitutionnelle fédérale a rendu son verdict. Les juges ont statué que la nomination parlementaire d'Erich Ollenhauer au poste de chancelier était constitutionnelle, confirmant sa légitimité et portant un coup dévastateur à Egon Franke et à sa faction dissidente."

 WGR_Schumacher_49_Form_Franke_Caretaker_Govt_desc: "Avec la décision du tribunal en sa faveur, Egon Franke a formé un gouvernement intérimaire, probablement avec le soutien tacite de la CDU. Sa mission première sera de stabiliser le pays et de préparer de nouvelles élections fédérales dans les plus brefs délais."

 WGR_Schumacher_49_Serve_as_Negotiator_desc: "Alors que les deux principaux partis sont dans une situation de guerre civile et d'impasse, une personnalité neutre doit intervenir. En agissant comme un intermédiaire honnête entre la CDU et les factions belligérantes du SPD, nous pourrions être en mesure de forger un compromis efficace qui puisse maintenir le bon fonctionnement de l'État."

 WGR_Schumacher_49_Pursue_Greater_Inner_German_Relations_desc: "Malgré les troubles internes, la question allemande demeure. Le gouvernement Ollenhauer s'engagera à nouveau dans une politique de dialogue et de relations accrues avec l'Est, estimant que le contact intra-allemand est la seule voie à long terme vers la réunification."

 WGR_Schumacher_49_Stress_SPD_Legitimacy_desc: "Notre gouvernement doit passer à l'offensive. Par le biais de discours publics, de campagnes médiatiques et de manoeuvres parlementaires, nous soulignerons continuellement la légitimité de nos dirigeants et présenterons la faction séparatiste comme des rebelles illégitimes."

 WGR_Schumacher_49_Make_a_Speech_to_the_German_People_desc: "En ce moment de crise, le chancelier doit s'adresser directement à la nation. Un discours diffusé dans toute la république exposera notre position, calmera les craintes du public et appellera à l'unité contre le chaos politique qui menace notre démocratie."

 WGR_Schumacher_49_Deflect_CDU_Accusations_of_Corruption_desc: "La CDU a profité du chaos pour lancer des accusations de corruption et de tractations en coulisses contre notre gouvernement. Nous devons habilement détourner ces attaques, les retourner contre l'opposition et les dénoncer comme des manoeuvres politiques cyniques."

 WGR_Schumacher_49_Hold_Schumachers_State_Funeral_desc: "Les funérailles nationales de Kurt Schumacher seront un moment de deuil national. C'est également une opportunité politique cruciale pour ses successeurs de revendiquer son rôle, de faire l'éloge de sa vision pour l'Allemagne et de rallier les fidèles à leur cause devant la nation entière."

 WGR_Schumacher_49_Reassert_SPD_Legitimacy_desc: "Les funérailles sont terminées ; la bataille politique reprend. Nous devons maintenant dépasser le deuil et réaffirmer la légitimité de notre gouvernement par des actions décisives, prouvant par notre politique et notre force que nous sommes les véritables héritiers du mandat du SPD."

 WGR_Schumacher_49_Put_Down_Protests_Against_the_Schumacher_Affair_desc: "Les luttes politiques internes, surnommées « l'affaire Schumacher » par la presse, ont conduit à des protestations et à des troubles publics. Pour maintenir l'ordre et projeter une image de force, le gouvernement pourrait être contraint de recourir à la police pour réprimer ces manifestations."

 WGR_Schumacher_49_Prepare_For_the_1953_Federal_Election_desc: "La situation politique actuelle est intenable. La seule façon de véritablement résoudre cette crise et d'obtenir un mandat clair est par les urnes. Nous devons maintenant commencer à mobiliser toutes nos ressources pour préparer le Bundestagswahl critique de 1953."
 
 
