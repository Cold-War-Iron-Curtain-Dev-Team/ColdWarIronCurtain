###Ideologies####


 CDU_Christian_Democracy: "Démocratie chrétienne"
 CDU_Christian_Democracy_desc: "£Ideology_CDU_Christian_Democracy_pic\n\n\n\n\n\n\n\n\nFondée sur l'enseignement social à la fois catholique et protestant, l'Union chrétienne-démocrate a émergé des ruines de la Seconde Guerre mondiale comme une nouvelle force unificatrice. En tant que Volkspartei interconfessionnel, il tirait sa force d'une large coalition rassemblant la classe moyenne urbaine, les conservateurs ruraux et tous ceux qui cherchaient une alternative stable et morale aux extrêmes du nazisme et du communisme. Il défendait une démocratie guidée par l'éthique chrétienne, plaçant la dignité individuelle, la famille et les principes d'une économie sociale de marché au centre de la reconstruction nationale.\n\nLes unionistes ont joué un rôle décisif dans l'élaboration de la Loi fondamentale de l'Allemagne de l'Ouest, en lançant le Wirtschaftswunder et en ancrant fermement la nouvelle république dans l'alliance occidentale. Rejetant les conflits de classes, l'« économie sociale de marché » du parti favorise un partenariat unique entre la libre entreprise et la protection sociale, définissant l'identité de la nation d'après-guerre."
 
 
 
###LEADER AND GENERAL BIOS#####


 POLITICS_LANGKEIT_DESC: "§gNé en Prusse orientale, Willy Langkeit a grandi dans un milieu rural avant de rejoindre la Reichswehr à l'âge de 17 ans. Sa fascination pour la guerre mécanisée l'a conduit vers les forces Panzer émergentes, où il s'est rapidement distingué comme un commandant compétent et innovant. Au cours de la Seconde Guerre mondiale, Langkeit a gravi les échelons, gagnant de nombreuses distinctions pour son leadership dans des batailles cruciales sur le front de l'Est, notamment à Stalingrad et dans la défense de la Prusse orientale. À la fin de la guerre, il avait atteint le grade de Generalmajor et commandait la Panzergrenadier-Division « Kurmark », menant sa percée de la poche de Halbe en 1945 avant de se rendre aux forces américaines.\n\nAujourd'hui, après des années de captivité américaine, Langkeit retourne en Allemagne et rejoint finalement la Bundesgrenzschutz. En tant que l'un des hauts dirigeants, il joue un rôle clé dans le façonnement de l'organisation au cours de ses années de formation, en mettant l'accent sur la discipline et la formation professionnelle.§!"
 POLITICS_SAMLOWSKI_DESC: "§gOriginaire de Prusse orientale, la jeunesse d'Alfred Samlowski a été façonnée par les bouleversements politiques et sociaux de l'Allemagne de l'entre-deux-guerres. Il a servi au sein de la Reichswehr, qui est finalement devenue la Wehrmacht, acquérant de l'expérience dans des rôles à la fois de première ligne et administratifs. Après l'effondrement de l'Allemagne nazie, Samlowski, comme de nombreux anciens officiers, fut confronté à un avenir incertain alors que l'Allemagne était démantelée et divisée.\n\nAvec l'émergence de la guerre froide et la pression croissante pour sécuriser les frontières de l'Allemagne de l'Ouest, Samlowski s'est engagé dans des efforts visant à rétablir un cadre de sécurité nationale. En 1951, il était devenu une figure de proue de la Bundesgrenzschutz, plaidant en faveur d'une force forte mais politiquement neutre pour protéger les frontières de l'Allemagne de l'Ouest. Il soutenait une collaboration étroite avec les forces alignées sur l'OTAN et considérait le BGS comme un élément essentiel pour garantir la souveraineté de la République fédérale contre d'éventuelles incursions du bloc de l'Est.§!"
 POLITICS_RUGE_DESC: "§gNé à Leipzig en 1894, Friedrich Ruge rejoint la marine impériale en 1914 et participe à la Première Guerre mondiale à bord de navires capitaux et de torpilleurs, ce qui lui vaut la Croix de fer. Restant dans la Reichsmarine d'après-guerre, il se spécialisa dans la guerre des mines et maîtrisa plusieurs langues, se bâtissant ainsi une réputation d'officier techniquement compétent et avant-gardiste. Au cours de la Seconde Guerre mondiale, Ruge commanda les forces de dragueurs de mines dans la Baltique et la mer du Nord, gagnant la Croix de Chevalier pour une course audacieuse de jour dans le détroit du Pas de Calais, servant plus tard comme conseiller naval du maréchal Rommel en Normandie et comme chef de la construction navale.\n\nAprès sa libération de captivité britannique en 1946, il travailla comme traducteur et rejoignit l'équipe historique navale américaine, contribuant ainsi à jeter les bases de la marine ouest-allemande.§!"
 Max_Reimann_WGR_desc: "Né à Elbing, en Prusse orientale, Reimann est devenu politiquement actif durant sa jeunesse, rejoignant la Ligue spartakiste puis le Parti communiste allemand dans les années 1920. Pendant la République de Weimar, Reimann est devenu un organisateur et un défenseur des droits des travailleurs, gagnant en reconnaissance pour son opposition inébranlable à la montée du fascisme. Après la prise du pouvoir par les nazis en 1933, Reimann fut arrêté à plusieurs reprises et passa plusieurs années dans des camps de concentration, dont celui de Buchenwald, en raison de ses activités antifascistes. Malgré de dures persécutions, il reste un communiste engagé et rejoint la résistance contre le régime nazi. Après la guerre, Reimann a joué un rôle déterminant dans la reconstruction du KPD dans les zones d'occupation occidentales de l'Allemagne, plaidant pour le socialisme en opposition à la reconstruction capitaliste poursuivie par les Alliés.\n\nEn 1949, Reimann était devenu une figure de proue du KPD en Allemagne de l'Ouest, connu pour sa rhétorique enflammée et sa position intransigeante contre l'impérialisme occidental. Ses efforts ont jeté les bases de la présence continue du parti dans le paysage allemand d'après-guerre, politiquement divisé."
 pol_desc_konrad: "Konrad Hermann Joseph Adenauer, surnommé « Der Alte » (l'aîné), est un fervent chrétien et fondateur de l'Union Christlich Demokratische Deutschland. Sa politique témoigne d'un fort attachement à une vision large de la démocratie libérale basée sur le marché et de l'anticommunisme. Estimant qu'une paix durable ne peut être obtenue que grâce à une Europe unie, il est profondément engagé en faveur de la coopération européenne, d'une politique étrangère orientée vers l'Occident et du rétablissement de la position de l'Allemagne de l'Ouest sur la scène mondiale."
 Kurt_Schumacher_WGR_desc: "Né à Kulm, en Prusse occidentale, Kurt Schumacher a été profondément influencé par les troubles de l'Allemagne du début du XXe siècle. Rejoignant le Parti social-démocrate dans sa jeunesse, il s'est rapidement fait connaître en tant que défenseur passionné de la démocratie et des droits des travailleurs. Soldat décoré de la Première Guerre mondiale, Schumacher est rentré chez lui désillusionné par le militarisme et est devenu un opposant virulent à l'extrémisme de droite pendant la République de Weimar. En tant que député du Reichstag, il était l'un des critiques les plus féroces du mouvement nazi naissant, refusant de faire des compromis alors même que la violence politique s'intensifiait.\n\nAprès l'arrivée au pouvoir d'Hitler en 1933, Schumacher fut arrêté par la Gestapo et passa plus d'une décennie dans des camps de concentration nazis, endurant des conditions brutales qui le laissèrent physiquement débilité mais spirituellement ininterrompu. Libéré en 1945, il entreprend immédiatement la tâche monumentale de reconstruire le SPD dans l'Allemagne d'après-guerre. Rejetant à la fois les influences communistes et conservatrices, il se positionne comme la figure de proue du socialisme démocratique, s'opposant farouchement aux pressions soviétiques et occidentales. En 1949, Schumacher était devenu l'un des hommes politiques les plus influents d'Allemagne de l'Ouest, dévoué à une Allemagne forte et indépendante, fondée sur la justice sociale et la démocratie."
 Kurt_Schumacher_WGR_AFTER_STROKE_desc: "Né à Kulm, en Prusse occidentale, Kurt Schumacher a été profondément influencé par les troubles de l'Allemagne du début du XXe siècle. Rejoignant le Parti social-démocrate dans sa jeunesse, il s'est rapidement fait connaître en tant que défenseur passionné de la démocratie et des droits des travailleurs. Soldat décoré de la Première Guerre mondiale, Schumacher est rentré chez lui désillusionné par le militarisme et est devenu un opposant virulent à l'extrémisme de droite pendant la République de Weimar. En tant que député du Reichstag, il était l'un des critiques les plus féroces du mouvement nazi naissant, refusant de faire des compromis alors même que la violence politique s'intensifiait.\n\nAprès l'arrivée au pouvoir d'Hitler en 1933, Schumacher fut arrêté par la Gestapo et passa plus d'une décennie dans des camps de concentration nazis, endurant des conditions brutales qui le laissèrent physiquement débilité mais spirituellement ininterrompu. Libéré en 1945, il entreprend immédiatement la tâche monumentale de reconstruire le SPD dans l'Allemagne d'après-guerre. Rejetant à la fois les influences communistes et conservatrices, il se positionne comme la figure de proue du socialisme démocratique, s'opposant farouchement aux pressions soviétiques et occidentales. En 1949, Schumacher était devenu l'un des hommes politiques les plus influents d'Allemagne de l'Ouest, dévoué à une Allemagne forte et indépendante, fondée sur la justice sociale et la démocratie.\n\nAprès s'être « remis » de son accident vasculaire cérébral, Schumacher est retourné à la Chancellerie pour reprendre ses fonctions. Cependant, ses assistants rapportent qu'il continue à cracher du sang et qu'il a du mal à dormir la nuit. Pour l'instant, il n'est pas certain que Schumacher quittera ses fonctions d'ici la fin de son mandat ou succombera à son problème de santé."
 POLITICS_ERICH_OLLENHAUER_DESC: "Ollenhauer est né à Magdebourg dans une famille ouvrière et a été attiré par le socialisme dès son plus jeune âge, rejoignant l'aile jeunesse du Parti social-démocrate avant même d'avoir quitté l'école. Fervent défenseur des droits du travail et de la justice sociale, il s'est exilé après la prise du pouvoir par les nazis en 1933, poursuivant ainsi la lutte pour le socialisme démocratique depuis l'étranger. Passant une grande partie de son exil en Grande-Bretagne, il a travaillé en étroite collaboration avec d'autres exilés du SPD pour préserver la structure organisationnelle du parti et préparer son retour en Allemagne après la guerre.\n\nDe retour dans son pays natal en 1946, Ollenhauer devint rapidement l'un des plus proches alliés de Kurt Schumacher, contribuant à reconstruire le SPD pour en faire une force puissante dans la politique allemande d'après-guerre. Alors que Schumacher adoptait une position nationaliste et pro-réarmement, Ollenhauer penchait plus à gauche, plaidant pour une Allemagne neutre, libre du contrôle occidental et soviétique. Sa vision du SPD mettait fortement l'accent sur la justice sociale, les droits des travailleurs et la planification économique, le mettant souvent en désaccord avec la faction pro-occidentale du parti dirigée par des personnalités comme Egon Franke.\n\nAprès l'accident vasculaire cérébral débilitant de Schumacher en 1951, Ollenhauer a été nommé leader par intérim, assumant ce rôle à une époque de grande incertitude. Alors que l'éventuel retour de Schumacher reste incertain, Ollenhauer doit naviguer dans un SPD de plus en plus divisé, déchiré entre sa vision du socialisme de gauche et l'influence croissante des modérés pro-occidentaux."
 Erich_Ollenhauer_WGR_Final_desc: "Ollenhauer est né à Magdebourg dans une famille ouvrière et a été attiré par le socialisme dès son plus jeune âge, rejoignant l'aile jeunesse du Parti social-démocrate avant même d'avoir quitté l'école. Fervent défenseur des droits du travail et de la justice sociale, il s'est exilé après la prise du pouvoir par les nazis en 1933, poursuivant ainsi la lutte pour le socialisme démocratique depuis l'étranger. Passant une grande partie de son exil en Grande-Bretagne, il a travaillé en étroite collaboration avec d'autres exilés du SPD pour préserver la structure organisationnelle du parti et préparer son retour en Allemagne après la guerre.\n\nDe retour dans son pays natal en 1946, Ollenhauer devint rapidement l'un des plus proches alliés de Kurt Schumacher, contribuant à reconstruire le SPD pour en faire une force puissante dans la politique allemande d'après-guerre. Alors que Schumacher adoptait une position nationaliste et pro-réarmement, Ollenhauer penchait plus à gauche, plaidant pour une Allemagne neutre, libre du contrôle occidental et soviétique. Sa vision du SPD mettait fortement l'accent sur la justice sociale, les droits des travailleurs et la planification économique, le mettant souvent en désaccord avec la faction pro-occidentale du parti dirigée par des personnalités comme Egon Franke.\n\nAprès la mort malheureuse de Schumacher, Ollenhauer a réussi à établir son contrôle au sein du SPD, assumant ce rôle à un moment de grande incertitude. Les manoeuvres politiques d'Ollenhauer au sein du SPD ont amené la gauche à devenir la faction dominante, en mettant l'accent sur l'indépendance politique de l'Allemagne, ainsi qu'en établissant un État-providence socialiste dans le cadre démocratique."
 POLITICS_EGON_FRANKE_DESC: "Le Hanovrien Egon Franke a atteint sa majorité au cours des dernières années tumultueuses de la République de Weimar, témoin direct de l'effondrement de la démocratie allemande et de la montée du totalitarisme. Social-démocrate engagé depuis sa jeunesse, Franke a survécu à l'ère nazie dans la résistance clandestine, entretenant des contacts avec les réseaux antifascistes malgré le danger toujours présent. Après la guerre, il est devenu l'un des principaux architectes de la reconstruction de l'Allemagne de l'Ouest, estimant que l'avenir du SPD résidait dans un alignement ferme avec les Alliés occidentaux et dans l'établissement d'une démocratie forte et orientée vers le marché.\n\nProche allié des éléments pro-occidentaux et modérés au sein du SPD, Franke a rejeté l'idée de la neutralité allemande, considérant l'intégration avec l'Occident comme la seule voie viable vers la reprise économique et la sécurité. Alors que son collègue Erich Ollenhauer poussait en faveur d'une orientation socialiste plus à gauche, Franke faisait partie de l'aile droite du SPD, plaidant pour la Westbindung (intégration occidentale), le réarmement et une coopération étroite avec l'OTAN.\n\nKurt Schumacher étant frappé d'incapacité après son accident vasculaire cérébral en 1951, Franke se positionne comme la principale figure de l'opposition à Erich Ollenhauer, représentant la faction modérée et pro-occidentale du SPD. Il soutient que la social-démocratie et l'intégration occidentale ne s'excluent pas mutuellement, estimant que la prospérité économique et la stabilité démocratique ne peuvent être obtenues que par la participation à l'alliance occidentale."
 Egon_Franke_WGR_Final_desc: "Le Hanovrien Egon Franke a atteint sa majorité au cours des dernières années tumultueuses de la République de Weimar, témoin direct de l'effondrement de la démocratie allemande et de la montée du totalitarisme. Social-démocrate engagé depuis sa jeunesse, Franke a survécu à l'ère nazie dans la résistance clandestine, entretenant des contacts avec les réseaux antifascistes malgré le danger toujours présent. Après la guerre, il est devenu l'un des principaux architectes de la reconstruction de l'Allemagne de l'Ouest, estimant que l'avenir du SPD résidait dans un alignement ferme avec les Alliés occidentaux et dans l'établissement d'une démocratie forte et orientée vers le marché.\n\nProche allié des éléments pro-occidentaux et modérés au sein du SPD, Franke a rejeté l'idée de la neutralité allemande, considérant l'intégration avec l'Occident comme la seule voie viable vers la reprise économique et la sécurité. Alors que son collègue Erich Ollenhauer poussait en faveur d'une orientation socialiste plus à gauche, Franke faisait partie de l'aile droite du SPD, plaidant pour la Westbindung (intégration occidentale), le réarmement et une coopération étroite avec l'OTAN.\n\nAprès la mort de Kurt Schumacher en 1952, Franke se positionne comme la figure clé de l'opposition à Erich Ollenhauer, représentant la faction modérée et pro-occidentale du SPD. Il soutient que la social-démocratie et l'intégration occidentale ne s'excluent pas mutuellement, estimant que la prospérité économique et la stabilité démocratique ne peuvent être obtenues que par la participation à l'alliance occidentale."
 POLITICS_MANSTEIN_DESC: "§gMaréchal décoré de la Wehrmacht, il a joué un rôle déterminant dans certaines des campagnes militaires les plus importantes de l'Allemagne, mais a été mis à l'écart au cours des dernières années de la Seconde Guerre mondiale. Capturé puis jugé pour crimes de guerre, Manstein a été libéré au début des années 1950 alors que les tensions de la guerre froide rendaient à nouveau son expertise militaire précieuse.\n\nLorsque le gouvernement dirigé par le KPD, élu en 1949, a commencé à démanteler les institutions démocratiques et à s'aligner sur le bloc soviétique, les forces d'opposition au sein de l'élite militaire et politique ont commencé à s'alarmer. Craignant la transformation de l'Allemagne de l'Ouest en un État marxiste et l'unification forcée avec l'Est sous le régime communiste, Manstein s'est imposé comme le chef d'une junte militaire déterminée à préserver la souveraineté allemande et à empêcher un régime totalitaire.\n\nSon régime, bien qu'autoritaire, se présente comme une mesure temporaire, une garantie d'urgence contre l'asservissement communiste. Alors que les tensions de la Guerre froide sont à leur paroxysme, son leadership garantit que l'Allemagne de l'Ouest restera un bastion de l'anticommunisme dans une Europe divisée."
 
 #####STARTING TREE########

 WGR_50s_Pass_the_Grundgesetz: "Passez le Grundgesetz"
 WGR_50s_Pass_the_Grundgesetz_desc: "Aujourd'hui, le 23 mai 1949, la Loi fondamentale allemande (Grundgesetz) est officiellement entrée en vigueur, marquant la naissance de la République fédérale d'Allemagne et fournissant un cadre solide pour la reconstruction d'une société démocratique et libre. Rédigée en réponse à l'époque sombre du régime nazi, la Loi fondamentale met l'accent sur la dignité humaine, les droits civils et l'engagement en faveur de la paix, ouvrant ainsi la voie à la justice et à la responsabilité. Bien qu'elle soit conçue comme une constitution provisoire jusqu'à la réunification, elle établit déjà de solides protections, notamment une Cour constitutionnelle fédérale pour garantir l'État de droit et empêcher le retour de la tyrannie."
 
 WGR_50s_Article_20: "Article 20"
 WGR_50s_Article_20_desc: "L'article 20 de la Loi fondamentale allemande établit les principes fondamentaux de la République fédérale d'Allemagne, la déclarant un État fédéral démocratique et social, fondé sur l'État de droit, dont la souveraineté est confiée au peuple et accordant aux citoyens le droit de résister si l'ordre constitutionnel est menacé."
 
 WGR_50s_Article_23: "Article 23"
 WGR_50s_Article_23_desc: "L'article 23 de la Loi fondamentale allemande fournira le cadre pour étendre la Loi fondamentale à d'autres parties de l'Allemagne, en mettant l'accent sur notre objectif de réunification nationale et en promouvant l'intégration de l'Allemagne de l'Est selon les principes de la démocratie et de l'État de droit."
 
 WGR_50s_Memory_of_1933: "Mémoire de 1933"
 WGR_50s_Memory_of_1933_desc: "Les souvenirs de 1933, lorsque Adolf Hitler a été nommé Kanzler de l'Allemagne et a commencé à transformer le pays en un État totalitaire, ont conduit le Conseil parlementaire à élaborer une loi fondamentale qui garantit la résilience de la démocratie, protège les droits fondamentaux et établit de solides contrôles et contrepoids pour empêcher tout retour à l'autoritarisme."
 
 WGR_50s_Prepare_for_the_1949_Federal_Election: "Préparez-vous au Bundestagswahl de 1949"
 WGR_50s_Prepare_for_the_1949_Federal_Election_desc: "Les élections ouest-allemandes de 1949, les premières dans notre nouvelle République fédérale, constituent une étape historique, car elles marquent le début d'une nouvelle ère démocratique en Allemagne, donnant à nos citoyens le pouvoir de choisir leurs représentants et de tracer la voie vers la reconstruction d'une Allemagne libre et juste après la dévastation de la dictature et de la guerre."
 
 
 #######ADENAUER 1949#########
 
 WGR_Adenauer_49_Bundeskanzler_Konrad_Adenauer: "Conseiller fédéral Konrad Adenauer"
 WGR_Adenauer_49_Bundeskanzler_Konrad_Adenauer_desc: "À l'issue d'élections acharnées et serrées, Konrad Adenauer, ancien maire de Cologne et membre du Zentrum, sortit vainqueur du Bundestagswahl de 1949, battant son adversaire Kurt Schumacher d'une voix. Adenauer a refusé de travailler avec les nazis entre 1933 et 1945 et a été responsable de plusieurs projets d'infrastructure et de richesse au cours de son mandat de maire de Cologne. Après la guerre, il a joué un rôle crucial dans la réorganisation des chrétiens-démocrates, gravissant encore plus les échelons politiques et devenant le candidat chancelier de l'Union chrétienne-démocrate nouvellement formée. La Chancellerie d'Adenauer se concentrera sur l'intégration occidentale, ainsi que sur l'établissement d'une économie sociale de marché, promouvant le consumérisme et le commerce intensif avec l'Occident."
 
