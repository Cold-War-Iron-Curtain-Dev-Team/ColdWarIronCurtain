 Bonn_Paris_Convetions:0 "Conventions de Bonn et de Paris"
 Anti-Nazi_Sentiment:0 "Sentiment anti-nazi"
 Thorn_in_the_Side:0 "Une épine dans le pied"
 Thorn_in_the_Side_desc:0 "Les récents développements socialistes en Allemagne de l'Ouest ont bouleversé nos plans de coopération avec l'Europe occidentale. Le KPD cherche à s'aligner sur l'Union soviétique et pourrait tenter de réunifier l'Allemagne sous la bannière rouge. Nous devons surveiller cette évolution et la contrôler si elle venait à devenir incontrôlable."
 Armoured_Use:0 "Utilisation blindée"
 WGR_state_owned_stores:0 "Magasins d'État vendant des biens de consommation"
 WGR_state_owned_stores_desc:0 "Les magasins d'État spécialisés dans les biens de consommation garantiront une distribution équitable des marchandises, réduiront la dépendance vis-à-vis des entreprises privées et favoriseront l'égalité économique."
 ig_farben:0 "IG Farben"
 ig_farben_desc:0 "Bien que controversée en raison de sa coopération étroite avec le NSDAP entre 1933 et 1945, IG Farben reste la première entreprise chimique et pharmaceutique d'Europe. Même si elle ne peut plus suivre la même voie qu'auparavant, ses ressources et son potentiel sont trop précieux pour être abandonnés."
