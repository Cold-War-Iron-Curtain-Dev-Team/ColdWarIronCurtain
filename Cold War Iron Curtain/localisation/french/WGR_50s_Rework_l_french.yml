 WGR_Ollenhauer_57_A_Second_Ollenhauer_Govt_desc: "Le peuple allemand a accordé un deuxième mandat à notre gouvernement. Après une période de réforme de principe et de défis importants, la deuxième administration Ollenhauer poursuivra son travail. Notre objectif reste de garantir une Allemagne prospère, socialement juste et, à terme, unifiée, en parcourant le chemin difficile qui nous attend d'une main ferme."

 WGR_Ollenhauer_57_Make_Speech_to_German_People_desc: "Pour inaugurer son deuxième mandat, le chancelier Ollenhauer prononcera un important discours télévisé devant le peuple allemand. Le discours exposera les ambitions du gouvernement pour les quatre prochaines années, abordant les thèmes clés de la sécurité nationale, de la prospérité économique et de notre engagement inébranlable en faveur d'une réunification pacifique."

 WGR_Ollenhauer_57_Appoint_Franke_as_Vice_Chancellor_desc: "Dans un geste crucial d'unité du parti, le chancelier a nommé son ancien rival Egon Franke au poste de vice-chancelier. Même si des divergences idéologiques subsistent, cette décision vise à combler le fossé entre les ailes gauche et droite du SPD, en présentant un front uni à la nation et au monde."

 WGR_Ollenhauer_57_Sign_Bonn_Declaration_desc: "Afin d'assurer la stabilité sur les questions d'intérêt national fondamental, notre gouvernement signera la Déclaration de Bonn avec l'opposition CDU. Ce pacte bipartite établit un terrain d'entente sur les questions clés de politique étrangère et de sécurité, garantissant que l'Allemagne parle d'une seule voix sur la scène mondiale."

 WGR_Ollenhauer_57_Pan_German_Unification_Rhetoric_desc: "Le rêve d'une Allemagne unie doit rester vivant dans le coeur de tous les Allemands, de l'Est comme de l'Ouest. Notre gouvernement lancera une nouvelle campagne de propagande, utilisant les émissions de radio et la presse écrite pour défendre la cause de la réunification et renforcer les liens de notre nation divisée."

 WGR_Ollenhauer_57_Empower_Young_Socialists_desc: "Les « Jusos », l'aile jeunesse de notre parti, sont l'avenir de la social-démocratie. Nous leur donnerons plus de pouvoir en leur fournissant un financement plus important et en leur permettant de jouer un rôle plus important dans les affaires du parti, en veillant à ce que leur énergie et leur idéalisme puissent contribuer à façonner notre orientation politique."

 WGR_Ollenhauer_57_Recognize_Clear_Difference_Between_Factions_desc: "La nomination de Franke n'était que la première étape. Le profond fossé idéologique entre la gauche traditionnelle du parti et sa droite pragmatique reste une source de tensions. Nous devons maintenant aborder directement ces divergences pour déterminer l'âme future du Parti social-démocrate."

 WGR_Ollenhauer_57_Open_Hamburg_Stock_Exchange_desc: "Pour favoriser l'investissement et solidifier notre reprise économique, le moment est venu de rétablir pleinement nos marchés financiers. La Bourse de Hambourg, avec sa longue et riche histoire, sera officiellement rouverte, envoyant un signal clair de confiance à la communauté économique mondiale."

 WGR_Ollenhauer_57_Recognize_Association_of_Expellees_desc: "Des millions d'Allemands ont été expulsés de leurs foyers ancestraux à l'Est. Leur principal groupe de défense, l'Association des expulsés, cherche désormais à former un parti politique. Les reconnaître donnerait à cette population importante une voix directe au Bundestag, même si leurs revendications nationalistes pourraient compliquer notre politique étrangère."

 WGR_Ollenhauer_57_Reconsider_Religion_in_Schools_desc: "Les débats acharnés sur l'éducation laïque au cours de notre premier mandat ont laissé de profondes cicatrices. Pour promouvoir la guérison nationale, le gouvernement reconsidérera sa politique sur le rôle de la religion dans les écoles publiques, en recherchant un nouveau compromis durable qui respecte à la fois la foi et l'éducation moderne."

 WGR_Ollenhauer_57_Bundeswehr_Development_desc: "Même si notre objectif ultime est la paix, les réalités de la guerre froide exigent que nous soyons capables de nous défendre. Ce gouvernement supervisera désormais la prochaine phase du développement de la Bundeswehr, en la transformant d'une force naissante en une armée moderne et professionnelle, capable de protéger la République fédérale."

 WGR_Ollenhauer_57_Debate_American_Aid_desc: "Equiper une nouvelle armée représente une dépense monumentale. Un débat doit avoir lieu sur l'opportunité de demander formellement une aide militaire aux États-Unis. Même si leur aide accélérerait notre réarmement, elle pourrait s'accompagner de conditions politiques susceptibles de compromettre notre politique étrangère indépendante."

 WGR_Ollenhauer_57_Debate_Conscription_desc: "Une décision doit être prise sur l'avenir du service militaire. Le Bundestag débattra de la mise en oeuvre d'une politique nationale de conscription. Un projet de conscription fournirait les effectifs nécessaires à une grande armée défensive, mais cela reste une question profondément controversée parmi l'opinion publique et au sein de notre propre parti."

 WGR_Ollenhauer_57_Develop_Swiss_HS30_IFV_desc: "Notre nouvelle armée a besoin d'équipements modernes. En partenariat avec la société suisse Hispano-Suiza, l'industrie allemande commencera le développement et la production du HS-30, un nouveau véhicule de combat d'infanterie innovant qui constituera l'épine dorsale de nos divisions d'infanterie mécanisées."

 WGR_Ollenhauer_57_Bolster_Domestic_Military_Production_desc: "Une nation souveraine ne peut pas dépendre des autres pour sa propre défense. Nous orienterons les investissements et les contrats de l'État vers l'industrie allemande afin de créer une solide capacité de production militaire nationale, garantissant ainsi que la Bundeswehr soit approvisionnée par nos propres usines."

 WGR_Ollenhauer_57_Form_Bundeswehr_Command_Staff_Academy_desc: "La nouvelle armée allemande doit être dirigée par des officiers fidèles aux principes démocratiques. Nous créerons la « Führungsakademie der Bundeswehr » à Hambourg, une académie militaire de premier plan dédiée à la formation d'une nouvelle génération de commandants pour nos forces armées."

 WGR_Ollenhauer_57_Build_von_Blucher_Barracks_desc: "Notre armée en pleine croissance a besoin d'installations modernes. Une nouvelle base militaire majeure, la caserne du Général von Blücher, sera construite. Ce complexe ultramoderne abritera des milliers de soldats et servira de centre de commandement clé pour la Bundeswehr."

 WGR_Ollenhauer_57_Begin_Advances_in_Sea_Air_Tech_desc: "La défense ne se limite pas au territoire. Nous lancerons de nouveaux programmes de recherche et de développement visant à développer nos capacités navales et aériennes, en veillant à ce que la Bundesmarine et la Luftwaffe soient équipées de la technologie nécessaire pour protéger nos côtes et notre ciel."

 WGR_Ollenhauer_57_Continue_Wirtschaftswunder_desc: "Le miracle économique allemand est le fondement de notre stabilité et de notre prospérité. La politique économique de notre gouvernement visera à poursuivre cette croissance incroyable, en garantissant le plein emploi et une augmentation du niveau de vie de tous nos citoyens."

 WGR_Ollenhauer_57_Expand_Coal_Facilities_Ruhr_desc: "Le charbon reste le moteur de notre industrie. Nous investirons dans la modernisation des mines de la vallée de la Ruhr afin d'augmenter la production de charbon, garantissant ainsi un approvisionnement constant en combustible pour les aciéries et les centrales électriques de notre pays."

 WGR_Ollenhauer_57_Construct_Airports_Frankfurt_Hamburg_desc: "Pour faciliter le commerce et relier l'Allemagne au monde, notre infrastructure aérienne doit être sans égal. De grands projets seront lancés pour agrandir et moderniser les aéroports des principaux pôles commerciaux de Hambourg et de Francfort."

 WGR_Ollenhauer_57_Build_Oil_Refineries_Bavaria_desc: "L'indépendance énergétique est cruciale pour notre souveraineté économique. Nous orienterons les investissements publics vers la construction de nouvelles raffineries de pétrole en Bavière, augmentant ainsi notre capacité nationale de transformation du pétrole brut en carburant pour nos industries et nos consommateurs."

 WGR_Ollenhauer_57_Expand_Rail_Network_North_South_desc: "Une économie efficace nécessite une logistique efficace. Nous lancerons un grand projet d'infrastructure pour étendre et moderniser les principales lignes ferroviaires reliant les ports du nord aux centres industriels du sud, accélérant ainsi la circulation des marchandises à travers la république."

 WGR_Ollenhauer_57_Found_Leifheit_and_Meister_Verbrauchermarkt_desc: "La prospérité du Wirtschaftswunder devrait se ressentir dans chaque foyer allemand. Le gouvernement soutiendra les entreprises innovantes axées sur le consommateur comme Leifheit et les nouveaux modèles de vente au détail comme le Meister Verbrauchermarkt, apportant ainsi des commodités modernes au peuple allemand."

 WGR_Ollenhauer_57_Proclaim_Renewed_Germany_desc: "La période de reconstruction d'après-guerre est terminée. L'Allemagne est redevenue une nation souveraine et prospère. Dans un discours majeur, la chancelière proclamera cette nouvelle ère pour l'Allemagne, une nation renouvelée dans son engagement en faveur de la paix, de la démocratie et de la justice sociale."

 WGR_Ollenhauer_57_German_Nuclear_Program_desc: "L'avenir de l'énergie et de la science réside dans l'atome. Notre gouvernement inaugurera officiellement un programme nucléaire allemand. Sa mission sera strictement pacifique et visera à exploiter l'énergie atomique pour fournir une énergie propre et stimuler l'innovation technologique au bénéfice de tous."

 WGR_Ollenhauer_57_Atoms_for_Peace_Funding_desc: "Pour relancer notre programme nucléaire pacifique, nous demanderons officiellement à nous joindre à l'initiative « Des atomes pour la paix » du président Eisenhower. L'accès au financement et à l'expertise technique américains sera inestimable pour nous aider à construire notre première génération de réacteurs nucléaires civils."

 WGR_Ollenhauer_57_Form_Fed_Min_Nuclear_Affairs_desc: "Le développement de l'énergie nucléaire est une tâche d'une immense importance et complexité. Pour le gérer efficacement et garantir la sécurité publique, nous créerons un nouveau ministère fédéral des Affaires nucléaires, chargé de superviser tous les aspects de notre programme atomique civil."

 WGR_Ollenhauer_57_Condemn_Nuclear_Power_for_Weapons_desc: "Notre engagement en faveur de la paix doit être sans ambiguïté. Le gouvernement allemand publiera une déclaration formelle condamnant l'utilisation de l'énergie nucléaire à des fins militaires. Nous défendrons la cause du désarmement mondial et promettons que la science atomique allemande ne sera jamais utilisée pour créer des armes de destruction massive."

 WGR_Ollenhauer_57_Build_Research_Reactors_desc: "Pour encourager une nouvelle génération de scientifiques et d'ingénieurs nucléaires allemands, nous construirons de petits réacteurs de recherche dans les universités de nos grandes villes. Ces installations seront des centres d'apprentissage et d'innovation, qui feront avancer notre programme nucléaire pacifique."

 WGR_Ollenhauer_57_Implement_Nuclear_Drills_and_Procedures_desc: "Même un programme nucléaire pacifique comporte des risques inhérents. Pour garantir la sécurité de notre population, le gouvernement mettra en oeuvre des procédures de sécurité rigoureuses à l'échelle nationale et organisera régulièrement des exercices pour se préparer à tout accident nucléaire potentiel."

 WGR_Ollenhauer_57_Begin_Construction_of_Schumacher_Nuclear_Powerplant_desc: "Comme point culminant de notre programme nucléaire pacifique, nous commencerons la construction de la première centrale nucléaire à grande échelle d'Allemagne. En l'honneur de notre défunt chancelier et de sa vision d'une Allemagne prospère, elle sera baptisée centrale nucléaire Schumacher."

 WGR_Ollenhauer_57_Debate_the_Soviet_Proposal_on_Berlin_desc: "L'Union soviétique a lancé un ultimatum, exigeant le retrait des troupes occidentales de Berlin et proposant sa transformation en « ville libre ». Cette démarche provocatrice a créé une grave crise internationale, et notre gouvernement doit maintenant débattre de sa réponse à ce défi lancé à la liberté de Berlin."

 WGR_Ollenhauer_57_Consider_Further_Negotiations_Without_the_Allies_desc: "Peut-être que la proposition soviétique, bien qu'alarmante, recèle un noyau d'opportunité. En entamant des négociations sur le statut de « Ville libre de Berlin », nous pourrions être en mesure de désamorcer la crise et de créer un nouveau canal direct de dialogue sur la question plus large de la réunification allemande, indépendamment des puissances alliées."

 WGR_Ollenhauer_57_Firmly_Reject_the_Idea_of_a_Free_City_of_Berlin_desc: "La proposition soviétique est une tentative cynique de séparer Berlin-Ouest de la République fédérale et du monde libre. Nous rejetterons fermement et publiquement l'idée d'une « Ville libre », en solidarité absolue avec nos alliés occidentaux et la population de Berlin. Il n'y aura aucun compromis sur leur liberté."
 

