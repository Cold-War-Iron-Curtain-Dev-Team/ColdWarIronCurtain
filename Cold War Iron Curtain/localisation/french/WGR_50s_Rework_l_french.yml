 WGR_Reimann_49_Bundeskanzler_Max_Reimann_desc: "Les dés sont jetés. Contre toute attente des Alliés occidentaux et des partis bourgeois, le peuple allemand s'est prononcé et a élu le Parti communiste au pouvoir. Max Reimann, marxiste convaincu et homme politique chevronné, accède à la Chancellerie de Bonn. Son élection envoie une onde de choc en Occident et un signal d'espoir à Moscou. L'avenir de l'Allemagne se trouve désormais à la croisée des chemins."

 WGR_Reimann_49_Speak_to_the_German_People_desc: "Le chancelier Reimann s'adressera pour la première fois à la nation. Dans une émission de radio très attendue, il exposera sa vision d'une nouvelle Allemagne : une Allemagne de paix, de socialisme et d'unité. Il doit rassurer la population, mettre en garde ses détracteurs et préparer le terrain pour les changements radicaux à venir."

 WGR_Reimann_49_Appease_the_CDU_desc: "Les forces bourgeoises, dirigées par la CDU d'Adenauer, sont alarmées. Pour empêcher un coup d'État immédiat ou une intervention alliée, nous devons pour l'instant feindre une attitude modérée. Quelques concessions à l'opposition et l'assurance du respect de l'ordre démocratique nous donneront le temps nécessaire pour consolider notre pouvoir."

 WGR_Reimann_49_Destroy_Evidence_desc: "La victoire fut étroite, peut-être trop étroite. Des rumeurs d'irrégularités et d'« assistance » circulent déjà. Avant que nos ennemis, au pays et à l'étranger, puissent utiliser ces rumeurs pour délégitimer le résultat des élections, tous les documents et témoignages potentiellement compromettants doivent disparaître. La volonté du prolétariat ne peut être remise en question sur des formalités bourgeoises."

 WGR_Reimann_49_Red_Coalition_with_the_SPD_desc: "Seul, le KPD est vulnérable. Une coalition avec les sociaux-démocrates consoliderait notre position au Bundestag et créerait un large front de gauche. Même si nous avons des divergences idéologiques avec la direction du SPD, l'unité de la classe ouvrière est primordiale en cette heure décisive. Nous leur ferons une offre qu'ils ne pourront pas refuser."

 WGR_Reimann_49_Federal_Bureau_for_Central_Planning_desc: "L'économie de marché chaotique et exploiteuse du capitalisme a laissé tomber l'Allemagne. Il est temps d'introduire une planification économique rationnelle et scientifique. En créant un Bureau fédéral de planification centrale, nous alignerons la production sur les besoins du peuple et briserons le pouvoir des grands industriels."

 WGR_Reimann_49_Coal_Production_in_the_Ruhr_desc: "Le charbon est l'or noir qui fait tourner le moteur de notre industrie. Pour accélérer la reconstruction et assurer notre indépendance économique, les mineurs de la Ruhr doivent établir de nouveaux records de production. Les investissements de l'État et les appels patriotiques augmenteront la production à des niveaux sans précédent."

 WGR_Reimann_49_Nationalize_Deutsche_Bundesbahn_desc: "Le chemin de fer est la bouée de sauvetage de la nation. Elle ne peut plus rester entre les mains de bureaucrates et de profiteurs potentiels. La nationalisation complète et la restructuration de la Deutsche Bundesbahn garantiront qu'elle servira exclusivement l'État et le peuple, en transportant des troupes, des marchandises et des travailleurs là où ils sont nécessaires."

 WGR_Reimann_49_Introduce_State_Owned_Consumer_Goods_Stores_desc: "Afin d'assurer l'approvisionnement de la population et d'empêcher les prix abusifs de la part des commerçants privés, nous établirons un réseau de magasins publics de biens de consommation. Ces « grands magasins populaires » offriront des produits de base à des prix justes et fixés par l'État, améliorant ainsi directement la qualité de vie de la classe ouvrière."

 WGR_Reimann_49_IG_Farben_State_Owned_desc: "IG Farben, un monopole et profiteur de guerre étroitement lié au régime nazi, doit être démantelé et ses actifs restitués au peuple. Reprendre ses usines restantes en tant qu'entreprise d'État ne sera pas seulement un acte de justice, mais garantira également notre contrôle sur des pans cruciaux de l'industrie chimique."

 WGR_Reimann_49_Increase_Steel_Production_in_Salzgitter_desc: "L'acier est le fondement de toute industrie et armée moderne. L'usine Hermann-Göring-Werke de Salzgitter, symbole de la machine de guerre nazie, sera revitalisée sous une nouvelle direction. Grâce à des investissements ciblés et à la mobilisation des travailleurs, nous augmenterons massivement la production d'acier pour jeter les bases de la nouvelle Allemagne."

 WGR_Reimann_49_Debate_Receiving_Marshall_Plan_Aid_desc: "Les Américains nous proposent leur « aide », mais nous connaissons le véritable prix : la soumission politique et l'exploitation économique. Un débat public exposera la véritable nature du Plan Marshall en tant qu'outil de l'impérialisme américain. L'Allemagne ne vendra pas sa souveraineté pour quelques dollars."

 WGR_Reimann_49_Denounce_the_Basic_Law_desc: "La soi-disant Loi fondamentale nous a été dictée par les puissances occidentales. C'est un document qui protège les relations de propriété bourgeoises et limite le pouvoir de la classe ouvrière. Nous devons le dénoncer publiquement pour ce qu'il est : une entrave imposée par nos ennemis."

 WGR_Reimann_49_New_Constitutional_Convention_desc: "Une Allemagne socialiste a besoin d'une constitution socialiste. Nous convoquerons une convention constitutionnelle composée de représentants des ouvriers, des paysans et de l'intelligentsia. Ensemble, ils créeront une nouvelle loi fondamentale qui ouvrira la voie à un avenir plus juste."

 WGR_Reimann_49_Support_the_KPD_desc: "Pour protéger les acquis de la classe ouvrière, le rôle dirigeant du Parti communiste doit être légalement consacré. Un amendement à la Loi fondamentale reconnaîtra le KPD comme l'avant-garde du peuple et le protégera des attaques des forces réactionnaires."

 WGR_Reimann_49_Socialist_Constitution_desc: "Le travail est terminé. La nouvelle constitution définira les piliers fondamentaux de notre État : la propriété populaire des moyens de production, le rôle dirigeant de la classe ouvrière et de son parti et l'amitié indissoluble avec l'Union soviétique. Il s'agit de l'acte de naissance de la République socialiste allemande."

 WGR_Reimann_49_Marxist_Language_desc: "Le langage façonne la pensée. Pour changer la conscience du peuple, nous devons ancrer la terminologie du marxisme-léninisme dans tous les documents officiels, lois et proclamations. Des termes comme « lutte des classes », « prolétariat » et « matérialisme historique » deviendront le vocabulaire quotidien de l'État."

 WGR_Reimann_49_Condemnation_from_the_CDU_desc: "Nos changements révolutionnaires ne restent pas sans réponse. La CDU et ses partisans occidentaux condamnent notre politique comme étant « totalitaire » et « antidémocratique ». Leurs protestations stridentes ne sont que le râle d'une classe mourante. Nous ne nous laisserons pas dissuader."

 WGR_Reimann_49_Augment_the_Powers_of_the_Chancellor_and_Cabinet_desc: "En période de bouleversements, une action décisive s'impose. Les lourdes procédures parlementaires de la démocratie bourgeoise entravent notre progrès. Nous élargirons par décret les pouvoirs du Chancelier et de son cabinet, ce qui nous permettra de réagir rapidement et efficacement à toute menace."

 WGR_Reimann_49_Limited_Freedom_of_Religion_desc: "La liberté, oui, mais pas de liberté pour les ennemis de la liberté ! La liberté d'expression et de religion sera garantie dans la mesure où elles ne sont pas utilisées pour diffuser de la propagande antisocialiste ou pour saper le pouvoir de l'État. Les déclarations contre-révolutionnaires ne seront pas tolérées."

 WGR_Reimann_49_Pro_Soviet_FP_desc: "L'Allemagne n'est plus un pion des puissances occidentales. Notre avenir se situe aux côtés de l'Union soviétique et des peuples frères socialistes. Nous réorienterons notre politique étrangère pour renforcer les liens avec Moscou et jouer un rôle actif dans la lutte contre l'impérialisme mondial."

 WGR_Reimann_49_Occupation_Statute_as_Colonization_desc: "Le statut d'occupation est un instrument d'oppression. Dans notre propagande, nous le présenterons systématiquement pour ce qu'il est : une forme de colonialisme à travers laquelle les puissances occidentales exploitent et contrôlent notre pays. L'exigence de son abrogation immédiate sera l'un des principaux slogans de notre politique étrangère."

 WGR_Reimann_49_Soviet_Technical_Assistance_desc: "Pour reconstruire rapidement notre industrie, nous avons besoin d'un savoir-faire moderne. Au lieu de devenir dépendants des capitalistes occidentaux, nous demanderons une assistance technique à l'Union soviétique. Leurs ingénieurs et scientifiques nous aideront de manière désintéressée à construire une économie socialiste moderne."

 WGR_Reimann_49_Cominform_Observer_desc: "Il est temps de prendre notre place dans la communauté des partis communistes et ouvriers. Rejoindre le Kominform en tant qu'observateur enverra un signal clair aux amis comme aux ennemis sur la position de la nouvelle République fédérale. C'est la première étape vers une intégration complète dans le camp socialiste."

 WGR_Reimann_49_Meet_with_Stalin_desc: "Une rencontre personnelle entre le chancelier Reimann et le secrétaire général du PCUS, Joseph Staline, scellera l'alliance entre nos nations. À Moscou, le cap sera fixé pour la future coopération dans les domaines économique, politique et militaire. Ce sera un moment historique pour le mouvement ouvrier allemand."

 WGR_Reimann_49_Condemn_NATO_desc: "La création de l'OTAN est un acte agressif visant directement l'Union soviétique et les démocraties populaires. Fer de lance de l'impérialisme américain, cette alliance militaire menace la paix mondiale. Nous condamnerons fermement l'OTAN sur la scène internationale et exposerons ses véritables intentions bellicistes."

 WGR_Reimann_49_Thorn_in_the_Side_desc: "Une Allemagne de l'Ouest communiste au coeur de l'Europe est le pire cauchemar des impérialistes occidentaux. Nous utiliserons cette position pour perturber leurs plans, affaiblir leurs alliances et servir de phare aux mouvements ouvriers dans toute l'Europe occidentale. Chacun de leurs mouvements sera entravé par nous."

 WGR_Reimann_49_New_Grundgesetz_desc: "La convention constitutionnelle a achevé ses travaux. La nouvelle Loi fondamentale, qui consacre nos acquis socialistes et institutionnalise le pouvoir de la classe ouvrière, va maintenant être officiellement adoptée. La ratification de ce document marque le début d'une nouvelle ère dans l'histoire allemande."

 WGR_Reimann_49_Role_of_the_Military_desc: "Notre nouvelle armée n'aura rien de commun avec les militaristes prussiens ou les hordes fascistes de la Wehrmacht. L'Armée nationale populaire de l'Ouest sera une armée d'un type nouveau : une armée d'ouvriers et de paysans dont la seule tâche est de défendre la patrie socialiste et la paix contre toute agression impérialiste."

 WGR_Reimann_49_Combine_the_BGS_and_Bundeswehr_desc: "La séparation entre police et armée est un concept bourgeois. Les gardes-frontières fédéraux et les forces armées naissantes seront fusionnés en une seule puissance armée unifiée. Cela augmentera l'efficacité et garantira que tous les éléments armés de l'État soient soumis à la même idéologie et au même leadership."

 WGR_Reimann_49_Socialist_Navy_and_Air_Force_desc: "Un État moderne a besoin d'une marine et d'une force aérienne modernes pour protéger sa souveraineté. Nous commencerons à construire une marine populaire et une force aérienne socialiste. Leur mission première sera la défense de nos côtes et de notre espace aérien contre les provocations de l'OTAN."

 WGR_Reimann_49_Revamp_the_Kriegsmarinewerft_desc: "L'historique Kriegsmarinewerft à Wilhelmshaven deviendra le centre de notre nouveau programme de construction navale. Avec l'aide soviétique et l'ingénierie allemande, nous moderniserons le chantier naval pour construire les premiers navires de notre marine populaire et restaurer nos capacités maritimes."

 WGR_Reimann_49_Deal_For_Mig_15s_desc: "Pour protéger le ciel allemand, nous avons besoin de la meilleure technologie disponible. Un accord avec l'Union soviétique nous garantira l'accès aux avions de combat modernes MiG-15 et aux bombardiers Il-28. Grâce à cela, nos forces aériennes seront en mesure d'affronter tout agresseur potentiel."

 WGR_Reimann_49_Construct_Naval_and_Air_Bases_desc: "Les armes modernes nécessitent une infrastructure moderne. Nous lancerons un programme visant à construire et à étendre des bases navales et aériennes à des points stratégiques le long de la côte et des frontières. Cela améliorera considérablement l'état de préparation et la portée de nos forces armées."

 WGR_Reimann_49_Soviet_T_54s_desc: "Le corps blindé est le poing de l'armée. Nous équiperons nos divisions blindées en achetant des chars soviétiques modernes T-54. Ces véhicules robustes et puissants constitueront l'épine dorsale de notre défense contre toute offensive terrestre de l'OTAN."

 WGR_Reimann_49_Conscription_Act_desc: "La défense de la patrie est le devoir le plus élevé de tout citoyen. Une nouvelle loi sur la conscription introduira un service militaire universel, garantissant que nous disposons de suffisamment de soldats entraînés pour défendre nos frontières. Chaque jeune homme sera scolarisé dans l'honneur de porter les armes pour le socialisme."

 WGR_Reimann_49_Reinforce_Duty_to_Country_and_Duty_to_Serve_Ideals_desc: "Le service dans l'Armée nationale populaire ne se résume pas à une simple formation militaire ; c'est une école du socialisme. Grâce à une éducation politique et une propagande intensives, nous inculquerons aux soldats les idéaux de patriotisme, d'internationalisme prolétarien et de loyauté inébranlable envers le Parti."

 WGR_Reimann_49_Campaign_of_Anti_Nazism_desc: "L'héritage du fascisme doit être éradiqué racine et branche. Nous lançons une campagne nationale de dénazification qui va bien au-delà des efforts timides des Alliés occidentaux. Les anciens nazis de l'administration, de la justice et des affaires seront dénoncés et tenus pour responsables."

 WGR_Reimann_49_Accuse_the_CDU_FDP_and_DP_of_Neo_Nazism_desc: "Ce n'est pas un hasard si de nombreux anciens nazis ont trouvé refuge dans les rangs des partis bourgeois. Nous dénoncerons impitoyablement ces liens et qualifierons publiquement la CDU, le FDP et le DP de refuges du néo-fascisme. Quiconque s'oppose au socialisme se tient du côté des vieux meurtriers."

 WGR_Reimann_49_Show_Trials_of_Former_Nazis_desc: "À titre d'exemple, des procès publics seront organisés contre d'anciens nazis de haut rang et leurs collaborateurs de l'industrie. Ces procès serviront non seulement la justice, mais sensibiliseront également le peuple à l'enchevêtrement du capitalisme et du fascisme."

 WGR_Reimann_49_Enforce_Loyalty_Oaths_desc: "Quiconque n'est pas fidèle au nouvel État ne peut occuper un poste de responsabilité. Nous introduirons des serments de fidélité à la constitution socialiste et des tests de fiabilité politique pour tous les fonctionnaires, juges et officiers. Ceux qui hésitent ont quelque chose à cacher."

 WGR_Reimann_49_Spare_Wehrmacht_Generals_desc: "Certains généraux de l'ex-Wehrmacht possèdent une expérience militaire inestimable. Même si leur passé politique est discutable, nous ne pouvons pas nous permettre de faire l'économie de leurs connaissances. Les officiers sélectionnés qui souhaitent servir le nouvel État seront épargnés des poursuites pénales et intégrés dans la nouvelle armée."

 WGR_Reimann_49_Campaign_of_Targeted_Surveillance_desc: "La lutte des classes est également menée en secret. Pour découvrir les cellules contre-révolutionnaires et les réseaux d'espionnage occidentaux, nous lancerons une vaste campagne de surveillance. Le courrier, les téléphones et les individus suspects seront étroitement surveillés par les organes de sécurité de l'État."

 WGR_Reimann_49_Purge_Subversive_Elements_Within_the_Coalition_desc: "Tous les membres de la coalition gouvernementale ne sont pas forcément des socialistes convaincus. Les « déviations de droite » et les « sociaux-démocrates » qui cherchent à ralentir le processus révolutionnaire dans nos rangs doivent être identifiés et démis de leurs fonctions. L'unité du leadership doit être préservée à tout prix."

 WGR_Reimann_49_Neue_Kulturkampf_desc: "La lutte contre la bourgeoisie est aussi une lutte d'idées. Nous lançons une « Neue Kulturkampf » (Nouvelle lutte culturelle) pour lutter contre les influences réactionnaires et cléricales dans la société. L'athéisme scientifique, le réalisme socialiste et la philosophie marxiste seront promus pour façonner le nouvel homme socialiste."

 WGR_Reimann_49_Condemn_Christian_Democratic_Ideals_desc: "L'idéologie chrétienne-démocrate cache le capitalisme, le cléricalisme et l'anticommunisme. Nous condamnerons ses idéaux comme étant incompatibles avec le progrès et le véritable bien-être du peuple allemand, et saperons systématiquement son autorité morale."

 WGR_Reimann_49_Repeal_the_Reichskonkordat_with_the_Vatican_desc: "Le Concordat signé par Hitler avec le Vatican est une relique d'une époque sombre et un symbole de l'alliance contre nature entre l'Église et le fascisme. Nous mettrons fin unilatéralement à ce traité, mettant ainsi fin aux droits privilégiés de l'Église catholique en Allemagne. La séparation de l'Église et de l'État sera radicalement imposée."

 WGR_Reimann_49_Ban_Religion_in_Schools_and_Tax_Churches_desc: "Les écoles doivent être des lieux d'éducation scientifique et non d'endoctrinement religieux. L'enseignement religieux sera aboli et remplacé par des cours de socialisme scientifique. Dans le même temps, les églises perdront leurs privilèges fiscaux et seront traitées comme n'importe quelle autre entreprise."

 WGR_Reimann_49_Form_an_Atheist_Only_Civil_Service_desc: "Ceux qui servent l'État doivent être libres de toute superstition surnaturelle. L'affiliation à une communauté religieuse sera déclarée incompatible avec un emploi dans la haute fonction publique. Seuls des athées convaincus peuvent offrir la pleine garantie d'une administration loyale et scientifiquement fondée."

 WGR_Reimann_49_Blackmail_Catholic_Bishops_and_Cardinals_desc: "Les dirigeants de l'Église sont nos opposants les plus obstinés. Au fil des années, nos organes de sécurité ont rassemblé de nombreux documents sur le comportement inconvenant de nombreux ecclésiastiques de haut rang. Il est temps d'utiliser ce matériel pour les faire taire ou les forcer à coopérer."

 WGR_Reimann_49_Purge_Religious_Figures_desc: "Certains religieux ne se plieront jamais à notre ligne de conduite. Ceux qui continuent de résister ouvertement doivent être exclus de la vie publique. Des arrestations discrètes, des départs à la retraite forcés et la fermeture de leurs paroisses briseront l'opposition organisée de l'Église."

 WGR_Reimann_49_Advance_Ideals_of_Communist_German_Reunification_desc: "La division de l'Allemagne est une blessure qui ne peut guérir que sous la bannière du socialisme. Nous lancerons une campagne de propagande massive en faveur de la réunification avec la République démocratique allemande sur la base de valeurs marxistes-léninistes communes. Une Allemagne unie et socialiste est notre objectif historique."

 WGR_Reimann_49_Sign_the_1953_Reunification_Treaty_desc: "Le jour est venu. Après de longues négociations avec nos camarades de Berlin-Est et avec la bénédiction de Moscou, le traité de réunification sera signé. La division impérialiste de notre patrie est terminée. Il n'y a désormais qu'une seule Allemagne : une Allemagne libre, souveraine et socialiste, une alliée solide dans le camp de la paix."
 
 
