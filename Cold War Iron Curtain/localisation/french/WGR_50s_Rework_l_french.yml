 # Screen Hulls #
 #WGR_screen_hull_medium_0: "USA GFX"
 #WGR_screen_hull_medium_0_desc: ""
 WGR_screen_hull_medium_1: "Classe F120 Cologne"
 WGR_screen_hull_medium_1_short: "F120 Cologne"
 WGR_screen_hull_medium_1_desc: "Les navires de la classe de frégates F120 Köln furent les premiers grands navires de guerre construits en Allemagne après la Seconde Guerre mondiale. Il s'agissait des premiers navires au monde dotés d'un système de propulsion combinant diesel et gaz. Les navires ont reçu de nombreuses rénovations au cours de leur longue carrière avec de nouveaux appareils électroniques et tubes lance-torpilles. Elles furent remplacées par des frégates de type 122 dans les années 1980 et quatre navires furent vendus à la marine turque. "
 WGR_screen_hull_medium_2: "Classe F122 Brême"
 WGR_screen_hull_medium_2_short: "F122 Brême"
 WGR_screen_hull_medium_2_desc: "Les huit frégates de classe F122 Bremen de la marine allemande sont une série de frégates mises en service entre 1982 et 1990. La conception est basée sur la classe néerlandaise éprouvée et robuste Kortenaer, mais utilise un système de propulsion et une disposition de hangar différents. "
 WGR_screen_hull_medium_3: "F123 Classe Brandebourg"
 WGR_screen_hull_medium_3_short: "F123 Brandebourg"
 WGR_screen_hull_medium_3_desc: "La classe F123 Brandenburg est une classe de frégate allemande. Ils ont été commandés par la marine allemande en juin 1989 et achevés et mis en service entre 1994 et 1996, remplaçant les destroyers de la classe Hambourg. Les navires effectuent principalement la guerre anti-sous-marine (ASW)."
 WGR_screen_hull_medium_4: "Classe F124 Sachsen"
 WGR_screen_hull_medium_4_short: "F124 Saxe"
 WGR_screen_hull_medium_4_desc: "La classe F124 Sachsen est la dernière classe de frégates de défense aérienne très avancées de la marine allemande. La conception de la frégate de classe Sachsen est basée sur celle de la classe F123 Brandenburg mais avec des fonctionnalités furtives améliorées conçues pour tromper les radars et les capteurs acoustiques d'un adversaire. La classe intègre un radar multifonction avancé APAR et un radar longue portée SMART-L censé être capable de détecter des avions furtifs et des missiles furtifs."

 WGR_screen_hull_heavy_0: "119 Classe Zerstörer-1"
 WGR_screen_hull_heavy_0_short: "119 Zerstorer-1"
 WGR_screen_hull_heavy_0_desc: "La classe Type 119 Zerstörer 1 était une classe de 6 destroyers de la marine ouest-allemande. Ils sont entrés en service en 1958 et le dernier a été mis hors service en 1982. Comme le temps nécessaire pour planifier, construire et tester ses propres navires plus grands n'était pas disponible, la République fédérale d'Allemagne a reçu des États-Unis six destroyers de la classe Fletcher pour la marine allemande dans le cadre de la loi sur l'assistance mutuelle à la défense."
 WGR_screen_hull_heavy_1: "101 Classe Hambourg"
 WGR_screen_hull_heavy_1_short: "101 Hambourg"
 WGR_screen_hull_heavy_1_desc: "La classe Type 101 Hamburg était la seule classe de destroyers construite dans l'Allemagne d'après-guerre. Ils ont été spécialement conçus pour opérer dans la mer Baltique, où l'armement et la vitesse sont plus importants que la navigabilité."
 WGR_screen_hull_heavy_2: "103B Classe Lütjens"
 WGR_screen_hull_heavy_2_short: "103B Lutjens"
 WGR_screen_hull_heavy_2_desc: "La classe Type 103 Lütjens était la dernière classe de destroyers en service dans la marine allemande. Les navires étaient des destroyers lance-missiles américains de classe Charles F. Adams, mais avec quelques modifications pour répondre aux exigences allemandes."
 WGR_screen_hull_heavy_3: "103B Classe Lütjens Refit I"
 WGR_screen_hull_heavy_3_short: "103B Lutjens Refit I"
 WGR_screen_hull_heavy_3_desc: "La classe Type 103 Lütjens était la dernière classe de destroyers en service dans la marine allemande. Les navires étaient des destroyers lance-missiles américains de classe Charles F. Adams, mais avec quelques modifications pour répondre aux exigences allemandes."
 WGR_screen_hull_heavy_4: "125 Classe Bade-Wurtemberg"
 WGR_screen_hull_heavy_4_short: "125 Bade-Wurtemberg"
 WGR_screen_hull_heavy_4_desc: "Les frégates de classe F125 Baden-Württemberg sont une série de frégates de la marine allemande, conçues et construites par ARGE F125, une coentreprise de Thyssen-Krupp et Lürssen. La classe Bade-Wurtemberg a le déplacement le plus lourd de toutes les classes de frégates dans le monde."

