 WGR_CDU_Reach_out_to_FDP_1949: "Contacter le Freie Demokraten"
 WGR_CDU_Reach_out_to_FDP_1949_desc: "Les Libéraux-Démocrates nouvellement établis partagent avec nous diverses politiques qui favoriseraient le \"Wirtschaftswunder\". Cependant, leur position sur la laïcité suscite un léger degré de méfiance au sein de la CDU. Néanmoins, nous avons besoin de partenaires et le FDP devrait en faire partie."
 
 WGR_CDU_Reach_out_to_DP_1949: "Approche de la Deutsche Partei"
 WGR_CDU_Reach_out_to_DP_1949_desc: "Le parti allemand se trouve dans une position difficile, essayant de promouvoir le conservatisme national ainsi que le traditionalisme, tout en prenant ses distances avec le nazisme et le militarisme. Leurs points de vue traditionalistes trouvent cependant un grand écho au sein du cercle restreint de l'Union. Peut-être devrions-nous les approcher ?"
 
 WGR_CDU_Reach_out_to_SPD_1949: "Un accord avec les sociaux-démocrates ?"
 WGR_CDU_Reach_out_to_SPD_1949_desc: "En tant que principal rival aux élections de 1949, une coalition avec le SPD n'est pas envisageable. Ils défendent tout ce contre quoi nous sommes, depuis les politiques anti-occidentales jusqu'aux mesures de dénazification extrême qui détruiraient toute stabilité administrative, avant même qu'elle n'existe. Alors que nous espérons obtenir la majorité au Bundestag, la deuxième chambre, le Bundesrat, est composée de délégués des gouvernements locaux de la République. Beaucoup d'entre eux sont sociaux-démocrates et peuvent ainsi bloquer les lois concernant les finances et les affaires administratives. Peut-être devrions-nous leur accorder quelques concessions en échange de leur soutien occasionnel."
 
 WGR_Speidel_Stabilization: "Lutter contre l'instabilité politique"
 WGR_Speidel_Stabilization_desc: "\n\n\n\n\n\n£WGR_Government_Stability\n\n\n\n\n\n\n\nLes conséquences de l'administration Reimann et Manstein ont provoqué de plus grands changements politiques dans le pays, poussant les camps politiques et les groupes sociaux à s'affronter. La démocratie telle que nous l'envisageons n'existe pas à l'heure actuelle. Nous devons prendre des mesures prudentes, mais drastiques, pour ramener le pays à un état stable afin de garantir un retour pacifique à la démocratie.\n"
 
 WGR_Speidel_Deal_with_NSDAP_Bureaucracy: "Reconstruire la bureaucratie"
 WGR_Speidel_Deal_with_NSDAP_KPD_Bureaucracy_desc: "Le pragmatisme doit prévaloir sur l'idéalisme. Nous ne pouvons pas administrer une nation avec des bureaux vides. Nous accorderons une amnistie générale aux fonctionnaires subalternes des anciens régimes, à condition qu'ils prêtent un nouveau serment de loyauté envers l'État. C'est une pilule amère à avaler pour beaucoup, mais elle garantira la circulation des trains et la signature des chèques de retraite."
 
 WGR_Speidel_Allow_SPD_Reorganisation: "Approuver la réorganisation du SPD"
 WGR_Speidel_Allow_SPD_Reorganisation_desc: "Pour prouver au monde - et à notre propre peuple - que ce gouvernement militaire n'est qu'un simple gardien, nous devons permettre le retour du discours politique. Le Parti social-démocrate, avec sa longue histoire d'opposition à la tyrannie, constitue la première étape logique. Leur permettre de s'organiser signalera que le retour à la démocratie parlementaire est imminent."
 
 WGR_Speidel_Reopen_Hamburg_Stock_Exchange: "Rouvrir la Bourse de Hambourg"
 WGR_Speidel_Reopen_Hamburg_Stock_Exchange_desc: "Le commerce est l'élément vital d'une nation en reconstruction, et le capital a besoin d'un foyer. En rouvrant les salles des marchés de la ville hanséatique, nous envoyons un message puissant aux investisseurs internationaux : l'Allemagne est à nouveau ouverte aux affaires. Le téléscripteur remplacera la carte de rationnement comme symbole de notre économie."
 
 WGR_Speidel_Volkswagen_Kaefer: "Augmenter la production Käfer"
 WGR_Speidel_Volkswagen_Kaefer_desc: "L'usine de Wolfsburg est plus qu'une usine ; c'est un symbole de la résilience allemande. La « Beetle » est robuste, abordable et exactement ce dont la population a besoin pour se remettre en mouvement. Nous subventionnerons les matières premières pour les chaînes de production afin de garantir que ce véhicule devienne un succès à l'exportation et une icône de notre reprise."
 
 WGR_Speidel_Roll_Back_Nationalisation: "Faire reculer les efforts de nationalisation"
 WGR_Speidel_Roll_Back_Nationalisation_desc: "L'État doit être un arbitre et non un acteur. Le contrôle excessif de l'État sur les industries créées pendant la crise a étouffé l'innovation. Nous commencerons à remettre les industries clés entre des mains privées, à favoriser la concurrence et à adopter les principes de l'économie sociale de marché."
 
 WGR_Speidel_Enable_Democracy_Again: "Tenir des élections"
 WGR_Speidel_Enable_Democracy_Again_desc: "Notre mission est de rétablir l'ordre, en stabilisant l'économie et l'appareil administratif. Tout cela finira par conduire au retour à la pratique démocratique et à la fin du gouvernement militaire. La place d'un soldat est à la caserne, pas à la Chancellerie. Nous devrons organiser des élections libres et équitables pour rendre le pouvoir aux représentants civils du peuple. Même s'il nous reste encore du temps, notre légitimité ne durera pas éternellement. Si nous prolongeons notre accueil, cela pourrait causer de graves dommages au système politique allemand et miner la confiance que nous avons bâtie jusqu'à présent."
 
 WGR_Bundeswehr_Decisions_1950s: "La Bundeswehr"
 WGR_Bundeswehr_Decisions_1950s_desc: "\n\n\n\n\n\n£WGR_Bundeswehr\n\n\n\n\n\n\n\nLa Bundesgrenzschutz n'était qu'un petit pas dans le réarmement allemand. Placés dans l'ombre de la Wehrmacht, nous ouvrirons un nouveau chapitre de l'histoire militaire allemande qui orientera notre direction vers des forces armées qui servent les idéaux et la constitution, croyant en la démocratie et n'étant pas obligées de suivre des ordres qui peuvent être considérés comme anti-démocratiques. La Bundeswehr sera la nouvelle force de défense institutionnelle de l'Allemagne, qui façonnera l'avenir de la paix et de la sécurité européennes.\n"
 
 WGR_Bundeswehr_Officially_Declare_Bundeswehr: "Déclarer officiellement la fondation de la Bundeswehr"
 WGR_Bundeswehr_Officially_Declare_Bundeswehr_desc: "Le temps des hésitations est révolu. Alors que le monde est divisé en deux camps hostiles et que le rideau de fer traverse notre pays, une Allemagne démilitarisée est une Allemagne sans défense. Nous devons franchir une étape historique en organisant officiellement nos forces armées pour défendre notre nouvelle démocratie."
 
 WGR_Bundeswehr_Recall_Generals: "Rappel d'anciens membres de la Wehrmacht"
 WGR_Bundeswehr_Recall_Generals_desc: "Construire une armée à partir de zéro est une tâche impossible sans un leadership expérimenté. Bien que controversé, nous ne pouvons pas nous permettre d'ignorer le génie tactique de ceux qui ont servi lors de la guerre précédente. Nous les sélectionnerons pour leur loyauté envers la constitution, mais nous devons utiliser leur expertise pour construire une structure de commandement efficace."
 
 WGR_Request_American_Armor: "Demander une armure américaine"
 WGR_Request_American_Armor_desc: "Notre industrie lourde nationale se remet encore des ravages de la guerre et du démantèlement. Nous ne pouvons pas attendre que les usines allemandes lancent la production d'un nouveau char de combat. Nous devons nous tourner vers nos partenaires de Washington pour qu'ils nous fournissent des Pattons et des Sherman afin de former l'épine dorsale en acier de nos premières divisions de panzers."
 
 WGR_Reintegration_of_Former_Wehrmacht_Soldiers: "Réintégration des soldats de la Wehrmacht"
 WGR_Reintegration_of_Former_Wehrmacht_Soldiers_desc: "Il y a des centaines de milliers d'anciens combattants qui parcourent nos rues, leurs compétences étant en sommeil. Même si nous devons veiller à inculquer les valeurs démocratiques, leur expérience du combat est une ressource dont nous avons désespérément besoin. Un programme sera mis en place pour réintégrer les anciens combattants volontaires dans la nouvelle base."
 
 WGR_Debate_UN_Intervention: "Débat sur la participation des Casques bleus allemands"
 WGR_Debate_UN_Intervention_desc: "La Loi fondamentale impose des limites strictes au déploiement de nos forces, mais la communauté internationale attend de nous que nous contribuions à la stabilité mondiale. Un débat acharné fait rage au Bundestag : les soldats allemands doivent-ils participer aux missions de maintien de la paix des Nations Unies, ou notre histoire exige-t-elle une stricte neutralité ?"
 
 WGR_Hold_Military_Drill: "Organisez un exercice militaire"
 WGR_Hold_Military_Drill_desc: "La force du papier ne sert à rien si les troupes ne peuvent pas se coordonner sur le terrain. Il est temps de déplacer les unités hors des casernes vers les terrains d'entraînement. Des manoeuvres à grande échelle mettront à l'épreuve notre logistique, nos communications et l'état de préparation de nos nouvelles recrues."
 
 
 WGR_UPRISINGS_50s: "Troubles civils"
 WGR_UPRISINGS_50s_desc: "\n\n\n\n\n\n£WGR_Uprisings\n\n\n\n\n\n\n\nMême si le KPD et ses dirigeants ont quitté les postes gouvernementaux, leurs partisans restent, y compris la plus grande base électorale des sociaux-démocrates, considérant le coup d'État comme une attaque contre la classe ouvrière et une nouvelle prise de pouvoir fasciste. La majorité des travailleurs et des étudiants des grandes villes ont lancé diverses campagnes de protestation et de boycott pour défier le gouvernement, dont le potentiel explosif est tel qu'il pourrait laisser la situation échapper à tout contrôle plus rapidement que prévu. Nous devons régler ce problème le plus rapidement possible.\n\n£population_texticon  §RLes troubles§! sont actuellement à §C[?WGR_Gehlen_Unrest|%%]§!\n\n§RLes États en rouge§! sont en proie à §Rdes émeutes§!, donnant des affaiblissements à la construction locale, à la population recrutable et à l'attrition de l'armée, tandis que les États en bleu §B§! sont §Bpacifiés§! à cause des troubles. §YLes États jaunes§! sont sous §YOccupation étrangère§!."
 
 WGR_UPRISINGS_50s_End_State_of_Emergency: "Mettre fin à l'état d'urgence"
 
 WGR_UPRISINGS_50s_Send_Army_to_Hamburg: "Déployer des forces de police à Hambourg"
 
 WGR_UPRISINGS_50s_Send_Army_to_Ruhrpott: "Pacification de la Ruhrpott"
 
 WGR_UPRISINGS_50s_Send_Army_to_Hannover: "Faire face aux troubles à Hanovre"
 
 WGR_UPRISINGS_50s_Send_Army_to_Northern_Hessen: "Écraser les émeutes à Kassel"
 
 WGR_UPRISINGS_50s_Border_Conflict: "Répondre aux provocations est-allemandes"
 WGR_UPRISINGS_50s_Border_Conflict_desc: "Si Berlin-Est pense pouvoir provoquer nos gardes-frontières et maintenir nos agents en détention sans aucune conséquence, ils ont tort ! Nous devons combattre le feu par le feu."
 
 WGR_NATO_Trust: "Notre relation avec l'Occident"
 WGR_NATO_Trust_desc: "\n\n\n\n\n\n£WGR_Nato_Trust\n\n\n\n\n\n\n\nSuite à la trahison et à la détente de Reimann avec l'Union soviétique, les puissances occidentales sont restées en état d'alerte concernant les affaires allemandes. La confiance dans les autorités ouest-allemandes est au plus bas, en raison du manque de crédibilité du régime communiste. Reconstruire la confiance sera une entreprise lourde, qui nécessitera des engagements majeurs en faveur des protocoles d'intégration occidentale et de sécurité commune. Il est cependant nécessaire que l'Allemagne se relève, car ce n'est qu'aux côtés des puissances occidentales qu'elle pourra s'épanouir à nouveau.\n\n[USA.GetFlag][FRA.GetFlag][ENG.GetFlag] NATO Trust est actuellement à §C[?Nato_Trust|%%]§!\n"
 
 WGR_NATO_Enter_ECSC_Negotiations: "Débattre du Traité de Paris"
 WGR_NATO_Enter_ECSC_Negotiations_desc: "La participation à la CECA n'est pas seulement une aubaine économique ; c'est une déclaration politique de réconciliation et d'intégration. En devenant un membre leader et en partageant notre production industrielle de manière transparente, nous consolidons notre place dans une Europe pacifique et unie. Nous perdrons cependant une légitimité nationale significative si nous postulons, supprimant divers contrôles sur la production de charbon et d'acier, de Bonn à Bruxelles."
 
 WGR_NATO_Trust_Request_Further_Arms: "Demander des armes supplémentaires aux nations occidentales"
 WGR_NATO_Trust_Request_Further_Arms_desc: "Nous enverrons des envoyés à Washington et à Londres pour solliciter formellement leur soutien politique et matériel. Nous devons les convaincre que notre gouvernement, bien que ferme, est le seul rempart fiable contre une prise de contrôle totale de l'Allemagne par les Soviétiques, même si cela mine notre légitimité nationale."
 
 WGR_NATO_Promote_Cultural_Exchange: "Promouvoir les échanges culturels transatlantiques"
 WGR_NATO_Promote_Cultural_Exchange_desc: "au-delà des liens militaires et économiques, la véritable alliance repose sur des valeurs partagées. Nous financerons et promouvrons des programmes d'échanges culturels avec les États-Unis et d'autres pays occidentaux, favorisant la compréhension et renforçant les liens idéologiques contre le communisme."
 
 WGR_NATO_Bielefeld_Conference: "La Conférence de Bielefeld"
 WGR_NATO_Bielefeld_Conference_desc: "Le résultat de la Conférence de Bielefeld sera crucial, car les négociations détermineront le statut juridique de l'Allemagne de l'Ouest dans un avenir proche. Le gouvernement doit préparer soigneusement ses revendications et agir en amont en faveur de l'Occident pour obtenir un certain poids lors de la conférence."
 
 WGR_GEHLEN_NATO_Join_NATO: "Rejoindre l'OTAN"
 WGR_GEHLEN_NATO_Join_NATO_desc: "La place qui revient à l'Allemagne est celle de pierre angulaire de l'Organisation du Traité de l'Atlantique Nord. Nous nous engagerons formellement à rejoindre l'alliance, en offrant notre position stratégique, notre puissance industrielle et notre potentiel militaire à la défense collective de l'Occident."
 
 Nato_Trust_New_Decision: "Une nouvelle décision £decision_icon_small  §Y§! apparaîtra dans l'onglet Décision §Y!§!"
 Nato_Trust_Above_50_tt: "[USA.GetFlag][FRA.GetFlag][ENG.GetFlag] §cNATO-Trust§! est §Ysupérieur à 50 %§!"
 Nato_Trust_Above_40_tt: "[USA.GetFlag][FRA.GetFlag][ENG.GetFlag] §cNATO-Trust§! est §Ysupérieur à 40 %§!"
 Nato_Trust_Above_20_tt: "[USA.GetFlag][FRA.GetFlag][ENG.GetFlag] §cNATO-Trust§! est §Ysupérieur à 20 %§!"
 Nato_Trust_Above_80_tt: "[USA.GetFlag][FRA.GetFlag][ENG.GetFlag] §cNATO-Trust§! est §Ysupérieur à 80 %§!"
 
 
 WGR_SPD_Influence_Battle: "La bataille interne du SPD"
 WGR_SPD_Power_Struggle_Explaination: "Le contexte de la lutte pour le pouvoir du SPD"
 WGR_SPD_DESC_GUI: "À la suite de la victoire de Schumacher aux élections de 1949, le Parti social-démocrate s'est officieusement divisé en deux blocs, dirigés respectivement par le président fédéral Erich Ollenhauer et le vice-chancelier Egon Franke. Les deux hommes se disputent l'influence, car ils sont députés et successeurs possibles du vieux Schumacher. Qui sortira vainqueur ?"
 Ollenhauer_Influence_Display_tt: "§gL'influence d'Ollenhauers est actuellement§! §C[?Ollenhauer_Influence|]§!"
 Franke_Influence_Display_tt: "§gFrankes Influence est actuellement§! §C[?Franke_Influence|]§!"
 
 WGR_Adenauer: "La chancellerie Adenauer"
 WGR_Adenauer_desc: "Au terme d'élections acharnées et serrées, Konrad Adenauer, ancien maire de Cologne et membre du Zentrum, est sorti vainqueur du récent Bundestagswahl. Adenauer a déjà été responsable de nombreux projets d'infrastructure et de richesse au cours de son mandat de maire de Cologne et après la guerre, il a joué un rôle crucial dans la réorganisation des chrétiens-démocrates, gravissant encore plus les échelons politiques, devenant le candidat chancelier de l'Union chrétienne-démocrate nouvellement formée. La Chancellerie d'Adenauer se concentrera sur l'intégration occidentale ainsi que sur le renforcement de l'économie sociale de marché."
 
 Reinforce_Chancellor_Democracy: "Renforcer la Kanzlerdemokratie"
 Reinforce_Chancellor_Democracy_desc: "Sous la direction de Konrad Adenauer, l'Allemagne de l'Ouest a vu l'émergence d'une forme distincte de gouvernance : la Kanzlerdemokratie, ou démocratie du chancelier. Contrairement aux traditions plus parlementaires de l'époque de Weimar, le modèle d'Adenauer met fortement l'accent sur l'autorité et la direction du chancelier fédéral. Les décisions clés sont souvent prises directement par le bureau du chancelier, les ministres étant censés s'aligner étroitement sur ses politiques.\n\nLe style de leadership affirmé d'Adenauer, notamment en matière de politique étrangère, de réarmement et d'intégration européenne, a consolidé le rôle du chancelier en tant que figure centrale de l'ordre politique de la nouvelle république. Alors que les critiques mettent en garde contre un déséquilibre dans le contrôle démocratique, les partisans soutiennent qu'un tel modèle garantit la stabilité, la cohérence et une prise de décision rapide à une époque de reconstruction nationale et de tensions mondiales."
 
 Support_Other_Bourgeoise_Parties: "Soutenez la Bürgerliches Lager"
 Support_Other_Bourgeoise_Parties_desc: "Les chrétiens-démocrates ont montré une nette tendance à former des coalitions avec des partis idéologiquement proches de l'Union chrétienne-démocrate, comme le Parti libéral-démocrate et le Parti allemand. Plutôt que de chercher à coopérer avec le Parti social-démocrate, dont les racines se trouvent dans le mouvement ouvrier et dans des politiques économiques plus à gauche, Adenauer a favorisé ce que beaucoup appellent une bürgerliche Koalition - une coalition bourgeoise."
 
 Zuckerbrot_for_the_SPD: "Zuckerbrot pour les sociaux-démocrates"
 Zuckerbrot_for_the_SPD_desc: "Même si Adenauer est connu pour sa ferme opposition aux sociaux-démocrates sur des fronts idéologiques clés, il a parfois adopté une approche plus tactique qui rappelle le vieux Zuckerbrot und Peitsche de Bismarck - la carotte et le bâton. Dans un effort pour éviter une obstruction totale au Bundestag et pour maintenir la cohésion sociale dans une république fragile, le gouvernement a parfois cédé à des demandes mineures du SPD, notamment sur les questions de protection sociale et de protection du travail."
 
 Anti_Communist_Propaganda: "Propagande anticommuniste"
 Anti_Communist_Propaganda_desc: "Dès les premiers jours de la République fédérale, c'était clair : il ne peut y avoir de compromis avec le communisme. Pour la chancelière, la menace posée par l'Union soviétique et ses ramifications idéologiques n'est pas seulement politique : elle est existentielle. Le communisme, selon lui, s'oppose directement aux fondements chrétiens et démocratiques sur lesquels est bâtie la nouvelle République fédérale."
 
 Invite_American_Diplomats_Abendessen: "Invitez des responsables américains à dîner"
 Invite_American_Diplomats_Abendessen_desc: "La sécurité, la prospérité et la position de la République fédérale dans le monde sont intimement liées à des relations solides avec les États-Unis. Alors que les alliances formelles et les accords économiques jettent les bases, Adenauer s'appuie souvent sur une approche diplomatique plus personnelle - fondée sur des dîners tranquilles, des réunions privées et des réunions informelles avec des responsables américains."
 
 Asylum_for_the_Displaced: "Asile pour les personnes déplacées"
 Asylum_for_the_Displaced_desc: "L'un des piliers de l'agenda national de la CDU sous le gouvernement Adenauer a été l'intégration politique, sociale et économique des millions d'Allemands déplacés arrivés en République fédérale après la guerre. Il s'agit notamment des Allemands des Sudètes de Tchécoslovaquie, des expulsés d'anciens territoires de l'Est comme la Silésie et la Prusse orientale, ainsi que des Allemands de souche provenant de régions telles que la Transylvanie et le Tyrol du Sud.\n\nLa CDU souligne que ces Heimatvertriebene ne sont pas des étrangers, mais des concitoyens qui ont légitimement leur place dans l'Allemagne d'après-guerre. Grâce à une législation favorable, à des programmes d'intégration et à un plaidoyer actif, le parti cherche à garantir que leurs contributions à la société soient reconnues et que leur identité culturelle soit préservée."
 
 WGR_Adenauer_Denazification: "La question de la dénazification"
 WGR_Adenauer_Denazification_desc: "Ce qui a commencé comme une mesure alliée visant à éliminer toute influence des anciens nationaux-socialistes de l'Allemagne d'après-guerre continue d'être un grand défi pour l'administration Adenauer. Avec le retour du pouvoir législatif au peuple allemand, les démocrates-chrétiens et leurs partenaires de coalition partagent le consensus selon lequel une reconstruction administrative pragmatique et une intégration de la société ne peuvent être réalisées que par la pratique de l'amnistie et la révocation des sanctions infligées aux anciens nationaux-socialistes de niveau moyen et inférieur. Même si ces mesures pourraient être impopulaires auprès des puissances alliées, elles constituent une étape nécessaire pour garantir la stabilité et la sécurité au sein de la société ouest-allemande."
 
 Lobbyism_Pardon_for_War_Criminals: "Faire pression pour que les anciens nationaux-socialistes soient graciés"
 Lobbyism_Pardon_for_War_Criminals_desc: "Ces derniers mois, des efforts croissants ont été déployés par des personnalités politiques, des associations d'anciens combattants et des segments du clergé pour faire pression en faveur de la grâce et de la libération anticipée des criminels de guerre condamnés détenus par les puissances alliées. Les défenseurs soutiennent que le maintien en détention entrave la réconciliation nationale et que bon nombre de condamnations ont été prononcées dans des conditions manquant de clarté juridique. Ils font appel à la nécessité de restaurer la dignité du corps des officiers allemands et de réintégrer ces individus dans la société. Bien que controversé, ce mouvement reflète des efforts plus larges visant à réaffirmer la souveraineté nationale et à clore le chapitre du passé de guerre de l'Allemagne."
 
 The_Globke_Dilemna: "Le dilemme de Globke"
 The_Globke_Dilemna_desc: "Ces dernières semaines, une inquiétude discrète mais croissante est apparue concernant le Dr Hans Globke, haut fonctionnaire de la Chancellerie fédérale et proche conseiller du chancelier Adenauer. Les critiques ont souligné son implication passée dans la rédaction de commentaires juridiques à l'époque nationale-socialiste - notamment sa co-auteur des annotations aux lois de Nuremberg de 1935.\n\nLa question reste politiquement sensible, car le gouvernement cherche à maintenir à la fois la continuité et la crédibilité dans la délicate reconstruction d'après-guerre."
 
 Support_the_Organisation_Gehlen: "Élargir l'allocation des ressources à l'organisation Gehlen"
 Support_the_Organisation_Gehlen_desc: "L'Organisation Gehlen s'est révélée être un atout vital dans la lutte contre l'infiltration communiste. Ses opérations vont de la surveillance des activités de gauche au retour secret des prisonniers de guerre allemands d'Union soviétique. Il a également contribué à la relocalisation discrète d'anciens nationaux-socialistes, préservant ainsi un savoir-faire précieux pendant cette période de transition.\n\nCompte tenu de son efficacité à préserver la sécurité et la stabilité nationales, un soutien accru à Reinhard Gehlen et à son organisation est à la fois justifié et nécessaire."
 
 WGR_131_Law_decision: "Débattre du 131-Gesetz"
 WGR_131_Law_decision_desc: "La « Loi 131 », officiellement intitulée « Loi réglementant le statut juridique des personnes couvertes par l'article 131 de la Loi fondamentale », vise à réintégrer les anciens fonctionnaires, juges, professeurs et soldats qui avaient perdu leur poste en raison de l'effondrement de l'Allemagne en 1945 ou des politiques de dénazification alliées. Ces individus sont familièrement appelés « 131ers » d'après l'article 131 de la Loi fondamentale.\n\nLa première version prévoit que les institutions publiques soient obligées d'attribuer au moins 20 % de leurs postes à ces personnes déplacées. Cela leur permettra de récupérer leurs rangs et titres antérieurs, souvent avec la désignation « zur Wiederverwendung » (pour réutilisation). Tout en excluant ceux qui ont été classés comme délinquants majeurs lors de la dénazification, cela réintégrera probablement beaucoup de ceux qui avaient servi sous le régime nazi, y compris ceux dont l'implication est douteuse."
 
 Amnesty_Law: "Rédiger le Straffreiheitsgesetz"
 Amnesty_Law_desc: "La Straffreiheitsgesetz (loi d'amnistie) vise à accorder l'amnistie aux délits mineurs commis avant le 15 septembre 1949, y compris les délits passibles d'une peine de prison pouvant aller jusqu'à six mois ou d'amendes pouvant aller jusqu'à 5 000 Deutsche Marks. La portée de l'extension et d'éventuelles clauses spéciales pour certaines personnes doivent encore être discutées et devraient susciter de vifs débats au Bundestag. Cependant, cela est considéré comme un nouveau départ, stabilisant la nouvelle démocratie et répondant aux demandes de réconciliation du public."
 
 Apologize_to_Victims_Compensation: "Indemnisation des victimes du régime national-socialiste"
 Apologize_to_Victims_Compensation_desc: "Dans un climat international en évolution, l'administration s'oriente vers un jugement moral. Les excuses et les efforts de compensation marquent une nouvelle phase dans la confrontation de l'Allemagne de l'Ouest avec son passé. Les victimes et leurs familles des mesures répressives des nationaux-socialistes recevront une indemnisation. Cela ne guérira peut-être pas complètement leurs blessures, mais cela les aidera peut-être à retrouver un certain degré de normalité."
 
 Sign_Israel_Reperation_Treaty: "Tendez la main à Israël"
 Sign_Israel_Reperation_Treaty_desc: "Geste historique de réconciliation, l'accord de réparations avec Israël vise à fournir au moins une compensation matérielle pour les atrocités nazies à la communauté juive. Ce sera le premier pas vers la création d'une nouvelle identité morale pour l'Allemagne et ce ne sera pas notre dernière mesure."
 
 End_Denazification: "Abolir toutes les lois sur la dénazification"
 End_Denazification_desc: "Nous en avons fait assez jusqu'à présent. Les protagonistes du régime national-socialiste ont été traduits en justice, tandis que nous nous sommes concentrés sur l'indemnisation et les excuses des victimes du nazisme, ainsi que sur l'amnistie des anciens bureaucrates et personnels administratifs qui ont été mis derrière les barreaux par les Alliés de manière totalement injustifiée. Nous pouvons clore ce chapitre de notre histoire et affronter le chemin qui nous attend." 
 WGR_Junta_Economic_Plan: "Plan économique de la junte"
 WGR_Junta_Economic_Plan_desc: "Le nouveau plan économique de la Junte canalise les investissements publics vers l'industrie."
 WGR_export_champion: "Fabrication d'exportation"
 WGR_export_champion_desc: "Les clients étrangers jugent les produits allemands sur leur finition et leur fiabilité. Les fabricants affinent leurs méthodes de production pour répondre à des commandes exigeantes tout en faisant meilleur usage des rares matériaux importés."
 WGR_volkswagen_boom: "Boom de la production de coléoptères"
 WGR_volkswagen_boom_desc: "Les commandes de Beetle occupent les chaînes de montage de Wolfsburg. Une conception standard et un réseau croissant de fournisseurs permettent à Volkswagen de produire des voitures abordables pour les acheteurs nationaux et étrangers."
