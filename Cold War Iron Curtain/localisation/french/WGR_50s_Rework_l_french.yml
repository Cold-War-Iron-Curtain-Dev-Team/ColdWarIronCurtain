 WGR_The_Moscow_Treaty: "Le traité de Moscou"
 WGR_Bundesmarine: "Bundesmarine"
 WGR_Bundesmarine_desc: "La Bundesmarine est la force navale permanente de la République fédérale d'Allemagne. Entièrement intégrée aux stratégies maritimes de l'OTAN, ses principaux rôles consistent à assurer des opérations de défense côtière en mer du Nord et en mer Baltique contre d'éventuels assauts amphibies soviétiques en temps de guerre, et à effectuer des missions d'escorte de convois alliés. Pour réaliser ces tâches, notre flotte sera composée de navires plus petits, mais efficaces, adaptés au combat maritime intérieur. Développer, construire et déployer davantage de tels navires constituera une nouvelle étape importante pour l'ensemble de la Bundeswehr."
 WGR_Order_Hamburg_Class_Destroyers: "Commandez des destroyers de classe Hambourg"
 WGR_Order_Hamburg_Class_Destroyers_desc: "La nouvelle génération de destroyers allemands porte le nom de sa plus grande ville portuaire et de sa fenêtre sur le monde. Avec un volume de déplacement d'environ 4 000 tonnes, ce type de navire représentera le plus grand type de navire de la Bundesmarine. Leur arsenal contemporain est spécialisé dans la guerre anti-sous-marine, mais offre également des capacités contre les avions ainsi que de multiples lance-torpilles et quatre tourelles de 100 millimètres pour combattre les navires de surface."
 WGR_Class_205_Submarines: "Sous-marins de classe 205"
 WGR_Class_205_Submarines_desc: "Aucune nation allemande n'a jamais pu se vanter de disposer d'une flotte de surface importante et puissante, du moins par rapport aux nations maritimes modernes. Bien qu'un type de navire ait connu une utilisation excessive pendant les deux guerres mondiales et ait acquis une réputation (in)célèbre pour sa létalité : l'Unterseeboot, ou U-Boot en abrégé. Ces sous-marins joueront le même rôle dans les temps nouveaux et modernes. Chargés de détruire les convois hostiles et les grandes cibles lentes, ces chasseurs silencieux sont de retour en action."
 WGR_Cologne_Class_Frigates: "Frégates de classe Cologne"
 WGR_Cologne_Class_Frigates_desc: "Les frégates de la classe F120, appelée classe « Köln » d'après le nom du premier navire de ce type, sont presque identiques à leurs soeurs des destroyers de la classe « Hamburg », à l'exception d'une coque plus lisse et d'un entraînement plus avancé qui utilise une combinaison de moteurs diesel et d'une turbine à gaz. Principalement équipés pour traquer et éliminer les sous-marins, ces navires élégants et rapides sont dédiés aux missions d'escorte de convois et de formations de flotte plus importantes."
 WGR_Lutjens_Class_Destroyers: "Destroyers de classe Lutjens"
 WGR_Lutjens_Class_Destroyers_desc: "Afin de renforcer davantage les rangs de notre Bundesmarine naissante, les hauts gradés ont demandé l'achat de destroyers américains de la classe « Charles F. Adams ». Avec seulement des modifications mineures pour répondre aux normes allemandes en matière d'équipement de communication, la classe alors appelée « Lütjens » joue le rôle de puissants navires de défense aérienne, protégeant la flotte avec leurs impressionnants missiles anti-aériens et leurs canons AA."
 WGR_Heer: "Hé"
 WGR_Heer_desc: "Le terme « Heer » désigne généralement tout type d'armée terrestre. Le Heer de notre Bundeswehr nouvellement fondée comprend des unités blindées, spéciales et hélicoptères ainsi que toute sorte d'infanterie. De cette façon, nous aurons une structure organisationnelle claire qui séparera les unités de combat terrestre de la Marine et de la Luftwaffe."
 WGR_Fortify_West_Berlin: "Fortifier Berlin-Ouest"
 WGR_Fortify_West_Berlin_desc: "En 1945, l'ancienne capitale allemande, Berlin, a été réorganisée en quatre secteurs, dirigés par les puissances victorieuses de l'Union soviétique, des États-Unis, du Royaume-Uni et de la France. Alors que le secteur russe est devenu plus tard connu sous le nom de « Berlin-Est », les secteurs alliés sont communément appelés « Berlin-Ouest » et étaient traités comme un État de la République fédérale d'Allemagne. Depuis la création de la RDA et les relations diplomatiques glaciales avec l'URSS, Berlin-Ouest reste dans une situation précaire, bloqué dans une mer rouge plutôt hostile. Il serait sage de préparer et de fortifier notre partie isolée de l'ancienne capitale, au cas où la guerre froide s'intensifierait soudainement."
 WGR_Adopt_the_G3: "Adoptez le G3"
 WGR_Adopt_the_G3_desc: "Les armes automatiques sont devenues un élément essentiel de toute armée depuis la Seconde Guerre mondiale. Pour développer davantage ses équipements, l'entreprise d'armement espagnole CETME a employé Ludwig Vorgrimler, un ancien employé de l'ancien fabricant d'armes allemand Mauser. Il a été le concepteur en chef du tristement célèbre Sturmgewehr 45, un fusil d'assaut de fin de guerre utilisé par la Wehrmacht. Sur la base de sa conception, Herr Vorgrimler a créé un nouveau type moderne de fusil automatique appelé AR58 pour les troupes espagnoles. La Bundeswehr en a commandé un lot au début des années 60, mais l'a modifié selon ses normes exigeantes. Après leur ajout, la société d'armement ouest-allemande Heckler&Koch a acheté la licence du CETME pour produire le fusil dans le pays sous le nouveau nom Gewehr 3, ou abrégé « G3 »."
 WGR_Develop_the_Leopard: "Développer le Léopard"
 WGR_Develop_the_Leopard_desc: "Au cours de la seconde moitié de la Seconde Guerre mondiale, les chars allemands étaient largement considérés comme très avancés et efficaces, bien que quelque peu sujets aux échecs. Depuis lors, de nouveaux matériaux, un rythme accéléré et des tactiques de guerre encore plus meurtrières ont nécessité d'énormes innovations dans le domaine de la guerre blindée. Afin de fournir des chars à la Bundeswehr et de perpétuer notre tradition de conception efficace, la société Krauss-Maffei Wegmann a été chargée de développer le premier char indigène depuis la fin de la guerre. Le Leopard 1 est le fruit de cette entreprise. Avec ses systèmes de soutien contemporains et son armement précis, il est non seulement déployé par nos troupes mais a déjà trouvé son chemin dans les armées de diverses autres nations."
 WGR_The_Marder_IFV: "Le VCI Marder"
 WGR_The_Marder_IFV_desc: "Pour protéger de précieux chars, il a toujours été impératif d'accompagner les avancées blindées avec de l'infanterie. Avec les nouvelles technologies et stratégies mortelles, les soldats à pied sont également extrêmement menacés lorsqu'ils se déplacent sur le champ de bataille. C'est pourquoi la Bundeswehr a été obligée de développer et de mettre en oeuvre des méthodes fiables pour protéger l'infanterie moyenne. La réponse à ces malheurs est le Marder 1, un véhicule de combat d'infanterie moderne. Il a été développé par Rheinmetall, une entreprise d'armement allemande. Transportant douze hommes au combat, il est également capable d'offrir une protection efficace contre les armes petites et moyennes, une vitesse de redéploiement rapide et de fournir un feu d'appui à ses passagers."
 WGR_Luftwaffe: "Luftwaffe"
 WGR_Luftwaffe_desc: "La troisième branche de la Bundeswehr est entièrement dédiée au combat aérien, à l'exclusion des hélicoptères. La tâche principale de la Luftwaffe est de sécuriser et de contrôler l'espace aérien de son pays. Bien que nous soyons à nouveau capables de maintenir une force aérienne professionnelle et moderne après la guerre et après une décennie d'interruption du développement, il reste encore beaucoup à améliorer jusqu'à ce que l'aigle allemand puisse à nouveau véritablement déployer son aile !"
 WGR_Expand_Taktisches_Luftwaffengeschwader_Airbases: "Agrandir les bases aériennes Taktisches Luftwaffengeschwader"
 WGR_Expand_Taktisches_Luftwaffengeschwader_Airbases_desc: "Afin de sécuriser correctement l'espace aérien allemand, il faut non seulement des avions, mais également des bases d'où ils peuvent être entretenus et lancés. Afin de développer davantage la Luftwaffe, nous devons également investir de l'argent dans nos bases aériennes."
 WGR_Purchase_the_F104: "Achetez le F-104"
 WGR_Purchase_the_F104_desc: "Pour rattraper plus de dix années perdues en matière de développement et de formation depuis la guerre mondiale, l'Allemagne a besoin d'une aide internationale pour ramener la Luftwaffe à des capacités sérieuses. Il a été décidé d'acquérir le chasseur à réaction F-104 « Starfighter » produit par la société américaine Lockheed Corporation. Si ce modèle semble prometteur, il présente également quelques problèmes techniques."
 WGR_Reduce_F104_Accident_Rates: "Réduire les taux d'accidents F104"
 WGR_Reduce_F104_Accident_Rates_desc: "Un scandale ! Environ un tiers des F-104 Starfighter achetés ne sont plus que de la ferraille ! Même lors de l'inauguration des premiers chasseurs, l'équipe de démonstration aérienne composée de quatre avions s'est écrasée, suivi de nombreux autres accidents mortels au cours des mois suivants. Jusqu'à présent, cela a coûté la vie à plus de 100 pilotes, ce qui a valu au F-104 le surnom de « Widowmaker » ! Les accusations de corruption et d'insouciance fusent de toutes parts et le ministre de la Défense Franz Josef Strauß peine à expliquer ce dilemme. Quel que soit le responsable ultime, nous devons corriger les défauts du F-104 et le rendre beaucoup plus sûr !"
 WGR_Import_F-4_Phantom_II: "Importer un F-4 Phantom II"
 WGR_Import_F-4_Phantom_II_desc: "McDonell Aircraft est une autre société d'armement américaine prometteuse et, espérons-le, plus fiable. Leur modèle hautement adaptable « F-4 Phantom II » s'est déjà révélé être un chasseur très polyvalent pour les missions de reconnaissance et les missions d'appui aérien. Et contrairement à l'incident catastrophique du F-104, aucun problème majeur ni décès de pilote n'a été signalé."
 WGR_Biblis_Nuclear_Plant: "Centrale nucléaire de Biblis"
 WGR_Biblis_Nuclear_Plant_desc: "En 1945, les États-Unis ont démontré la puissance terrifiante mais impressionnante de l'atome. Alors que les Soviétiques et les Américains continuent de construire un arsenal atomique susceptible de provoquer l'apocalypse, nous nous intéressons davantage à l'application pacifique de cette nouvelle technologie merveilleuse. Les centrales nucléaires présentent une source d'énergie propre et presque infinie tout en produisant beaucoup plus d'énergie que les centrales électriques traditionnelles à combustibles fossiles. Le premier du genre en Allemagne est en construction à Biblis. Une puissance estimée à 1225 MW soutiendra nos efforts industriels en Hesse et témoignera de notre entrée dans l'ère atomique !"
