 WGR_German_Expedition_Observers:0 "Observateurs allemands"
 WGR_German_Expedition_Observers_desc:0 "Depuis la fin de la Seconde Guerre mondiale, la guerre a radicalement changé. Les invasions massives, les batailles de chars et les conquêtes à grande échelle sont des vestiges de la guerre germano-soviétique, ce qui rend nos doctrines militaires terriblement dépassées. Les guerres par procuration, les guerres asymétriques et d'autres types de conflits innovants définiront cette guerre froide. Nous devrions envoyer diverses unités « d'observation » dans certains conflits afin d'obtenir des informations et une expérience cruciales qui pourraient être utilisées pour optimiser les performances de nos forces armées. Compte tenu de notre histoire et des restrictions imposées par nos alliés, il serait préférable de garder cela secret..."
 Anti_Nazi_Sentiment:0 "Sentiment anti-nazi"
 WGR_War_Destruction_1:0 "Conséquences des bombardements alliés - Cendres et ruines"
 WGR_War_Destruction_1_desc:0 "Les bombardements dévastateurs des Alliés pendant la Seconde Guerre mondiale ont laissé l'Allemagne en ruines, avec des villes entières réduites à l'état de décombres et des millions de personnes déplacées. Des centres industriels comme Hambourg, Cologne et Essen ont été détruits, tandis que des monuments culturels et historiques, de la Frauenkirche de Dresde à l'avenue Unter den Linden de Berlin, ne sont plus que des squelettes hantés de leur ancienne grandeur. Les infrastructures ont été anéanties : les chemins de fer, les ponts et les usines sont hors service, rendant les transports et la production presque impossibles.\n\nAu-delà des destructions matérielles, les bombardements ont causé d'immenses souffrances humaines. Des centaines de milliers de personnes ont péri, tandis que des millions de survivants ont été confrontés à la famine, au dénuement et à la maladie dans les années qui ont suivi immédiatement la guerre. Le bilan psychologique a été tout aussi lourd : de nombreux Allemands ont eu du mal à accepter l'ampleur des destructions, la perte de leurs proches et le bilan moral de la guerre."
 WGR_War_Destruction_2:0 "Conséquences des bombardements alliés - Villes silencieuses"
 WGR_War_Destruction_2_desc:0 "Bien que les feux de la guerre se soient éteints depuis longtemps, leurs cicatrices demeurent. D'énormes tas de décombres envahissent encore les rues, et les squelettes des bâtiments bombardés rappellent sinistrement le passé. Alors que les lignes de communication de base sont lentement rétablies, une grande partie du pays reste plongée dans le chaos, avec des millions de sans-abri et des infrastructures en ruines. L'ampleur même des destructions rend l'idée d'une reconstruction complète presque impossible — pour l'instant, la survie prime sur la reconstruction."
 WGR_War_Destruction_3:0 "Conséquences des bombardements alliés - Déblayage des décombres"
 WGR_War_Destruction_3_desc:0 "Malgré les ravages considérables, les premiers signes de reprise apparaissent. Dans de nombreuses villes, les efforts pour déblayer les décombres, souvent menés par les Trümmerfrauen, les « femmes des ruines », ont commencé sérieusement. Les soldats de retour au pays et les familles déplacées travaillent ensemble pour sauver ce qu'ils peuvent des décombres. Pourtant, les conséquences de la guerre restent douloureusement visibles : des quartiers entiers sont vides et des abris de fortune ont remplacé les maisons. Le chemin à parcourir est long, mais pour la première fois, une lueur d'espoir brille au milieu des ruines."
 WGR_War_Destruction_4:0 "Conséquences des bombardements alliés - Reconstruire les bases"
 WGR_War_Destruction_4_desc:0 "Le lent processus de reconstruction commence à prendre forme. Le plan Marshall injecte des ressources indispensables dans une économie en ruine, permettant ainsi la relance d'industries clés et de services essentiels. Les hôpitaux et les écoles rouvrent leurs portes, offrant à beaucoup un semblant de vie normale. Cependant, chaque nouvelle structure qui voit le jour rend plus évidente l'absence de l'architecture historique allemande : bon nombre des cathédrales, hôtels de ville et opéras autrefois majestueux ne sont plus que poussière. Les fondations d'une nouvelle Allemagne sont en train de se former, mais les cicatrices culturelles de la guerre ne guériront jamais complètement."
 WGR_War_Destruction_5:0 "Les conséquences des bombardements alliés - L'aube de la reconstruction"
 WGR_War_Destruction_5_desc:0 "Au fil des années, les ruines de la guerre s'estompent peu à peu, remplacées par de nouvelles maisons, des usines et des rues animées. Les commerces rouvrent leurs portes et les biens de consommation sont à nouveau disponibles, redonnant aux gens un sentiment de normalité longtemps oublié. Les industries automobile et électronique font leurs premiers pas vers la reprise, annonçant le début d'une renaissance économique. Pourtant, au milieu de ces progrès, quelque chose a été perdu : le cœur historique de nombreuses villes, désormais remplacé par une architecture moderne et pragmatique. Les destructions causées par la guerre resteront à jamais une blessure dans l'âme de la nation, mais l'Allemagne apprend à aller de l'avant sans oublier son passé."
 WGR_War_Destruction_6:0 "Les conséquences des bombardements alliés - Un nouveau paysage"
 WGR_War_Destruction_6_desc:0 "Le rythme de la reconstruction s'accélère et, pour la première fois, certaines parties des villes allemandes dévastées ressemblent davantage à ce qu'elles étaient avant la guerre. Des projets immobiliers permettent d'héberger les familles déplacées et les usines fonctionnent à nouveau, même si beaucoup d'entre elles continuent d'opérer dans les ruines des zones industrielles bombardées. Cependant, sous la surface des progrès, les blessures de la guerre restent vives. Les monuments culturels qui définissaient autrefois l'identité historique de l'Allemagne, tels que les centres historiques de Francfort, Nuremberg et Hambourg, ont soit disparu à jamais, soit été remplacés par des structures modernes austères qui n'ont pas la grandeur de leurs prédécesseurs. Les cicatrices psychologiques persistent, car beaucoup ont du mal à concilier leurs souvenirs du passé avec la dure réalité du présent."
 WGR_War_Destruction_7:0 "Les conséquences des bombardements alliés - Le Wirtschaftswunder (miracle économique)"
 WGR_War_Destruction_7_desc:0 "Chaque année, les ruines de la guerre cèdent la place à une Allemagne modernisée. Les centres-villes reconstruits sont animés par le commerce, et l'économie profite d'une forte augmentation de la production industrielle. Les transports publics se développent et les universités rouvrent leurs portes, formant une nouvelle génération qui fera avancer le pays. Pourtant, même si l'optimisme grandit, les traces du passé demeurent : des terrains vagues où se dressaient autrefois de fières cathédrales et palais, des monuments commémoratifs de guerre et les histoires de ceux qui ne reviendront jamais. L'Allemagne va de l'avant, mais elle ne pourra jamais complètement oublier les destructions qu'elle a subies."
 WGR_War_Destruction_8:0 "Les conséquences des bombardements alliés - Des cicatrices qui perdurent"
 WGR_War_Destruction_8_desc:0 "L'ère des ruines et du rationnement touche à sa fin. L'Allemagne, bien que changée à jamais, se relève à nouveau. De nouvelles industries fleurissent et les villes se transforment en symboles de résilience, alliant un urbanisme moderne aux vestiges du passé. Si certains sites historiques ont été minutieusement reconstruits, d'autres sont irrémédiablement perdus et n'existent plus que dans de vieilles photographies et des souvenirs qui s'estompent. Les bombardements de la guerre jetteront toujours une ombre sur la nation, mais l'Allemagne ne s'est pas laissée définir par la destruction. Au contraire, elle est devenue un pays qui se souvient, se reconstruit et envisage"
 summergames72:0 "Il existe un besoin de policiers spécialisés"
 WGR_Western_Occupation:0 "Occupation étrangère"
 WGR_Western_Occupation_desc:0 "Après la capitulation de la Wehrmacht le 8 mai 1945, les Alliés occidentaux et l'Union soviétique ont divisé l'Allemagne en quatre zones d'occupation, nous privant des territoires de Silésie, de Poméranie, de Grenzmark, de Sarre et de Prusse orientale. Alors que l'Union soviétique occupe toujours les régions du centre de l'Allemagne, y compris Berlin-Est, les Alliés occidentaux maintiennent également leurs armées sur le territoire actuellement sous notre contrôle, sapant ainsi notre souveraineté en tant qu'État indépendant et la continuité de l'État national allemand formé en 1871."
 wgr_ddr_refugees:0 "Réfugiés est-allemands"
 wgr_ddr_refugees_desc:0 "Des milliers de réfugiés est-allemands fuient vers l'Allemagne de l'Ouest pour échapper au contrôle soviétique et aux conditions oppressives qui règnent à l'Est. Cette vague croissante de familles désespérées met en évidence le fossé profond qui sépare la liberté de la tyrannie et nous incite à agir rapidement pour venir en aide à ces personnes qui recherchent la sécurité et un avenir meilleur dans notre nouvelle démocratie."
 NATO_Military_Restrictions:0 "Restrictions militaires de l'OTAN"
 NATO_Military_Restrictions_desc:0 "La crainte du militarisme allemand est une préoccupation commune au sein de la structure de commandement des Alliés occidentaux, ce qui a incité les États-Unis, la France et la Grande-Bretagne à intégrer ce qui reste de nos forces armées dans la structure militaire de l'OTAN, permettant ainsi aux Alliés de contrôler nos forces."
 Scientific_Collapse:0 "Effondrement scientifique"
 Scientific_Collapse_desc:0 "Au lendemain de la Seconde Guerre mondiale, plusieurs scientifiques ont été tués lors des bombardements alliés ou ont été « convaincus » par les forces d'occupation de les aider dans leurs nouveaux projets d'armement, alors que les tensions entre les États-Unis d'Amérique et l'Union soviétique commençaient à s'intensifier. On ignore où ils se trouvent actuellement, mais on peut supposer sans trop s'avancer qu'une poignée d'entre eux ont déménagé à Moscou ou à Washington et travaillent désormais pour ces deux puissances. Qu'ils le veuillent ou non."
 Scientific_Collapse_lessened:0 "Effondrement scientifique"
 Newfound_Sovereignty:0 "Nouvelle souveraineté"
 Founding_the_Bundeswehr:0 "Fondation de la Bundeswehr"
 Starfighter_Crisis:0 "Crise de l'aviation"
 Disorganized_Navy:0 "Marine désorganisée"
 Disorganized_Navy_desc:0 "La Kriegsmarine, ou ce qu'il en reste, est actuellement remise aux Alliés occidentaux dans le cadre du désarmement. Certains navires plus petits et navires marchands ont été réaffectés à un usage civil ou remis en service sous le contrôle des Alliés pour le déminage sous l'autorité de l'administration allemande chargée du déminage (Deutscher Minenräumdienst). À l'heure actuelle, comme en 1919, nos capacités navales sont à nouveau réduites à néant et nous ne savons pas si nous serons un jour en mesure de reconstruire notre marine."
