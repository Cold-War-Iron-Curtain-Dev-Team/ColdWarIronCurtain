 WGR_Reconstruction_of_Germany_Decisions: "La reconstruction de l'Allemagne"
 WGR_Reconstruction_of_Germany_Decisions_desc: "\n\n\n\n\n\n£WGR_Reconstruction\n\n\n\n\n\n\n\nLa guerre a laissé l'Allemagne en ruines, avec des villes entières réduites en ruines et des infrastructures pratiquement inexistantes. Les usines, les routes et les voies ferrées ont été détruites et des millions de personnes ont été confrontées au déplacement, à la faim et à l'incertitude. Aujourd'hui, alors que la poussière retombe, la tâche monumentale de la reconstruction commence. L'élimination des décombres n'est que la première étape : restaurer l'industrie, reconstruire les habitations et rétablir les services essentiels nécessitera d'immenses efforts, coordination et sacrifices.\n"
