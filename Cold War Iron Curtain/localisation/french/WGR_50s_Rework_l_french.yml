 WGR_found_the_gsg9:0 "Groupe de protection des frontières 9"
 WGR_found_the_gsg9_desc:0 "À la suite de la mauvaise gestion de la tragédie olympique de 1972, le gouvernement ouest-allemand a créé le GSG 9 sous la direction de l'Oberstleutnant Ulrich Wegener afin de pouvoir réagir de manière adéquate et professionnelle à des situations similaires à l'avenir. De nombreux politiciens allemands s'opposent à sa création, craignant que le GSG 9 ne ravive le souvenir de la Schutzstaffel (SS) du parti nazi. La décision a été prise de former cette unité à partir des forces de police, et non de l'armée, comme c'est le cas dans d'autres pays, au motif que la loi fédérale allemande interdit expressément le recours aux forces militaires contre la population civile."
 WGR_Establish_the_Ministry_of_Health:0 "Créer le ministère de la Santé"
 WGR_Establish_the_Ministry_of_Health_desc:0 "Avec l'essor économique fulgurant du Wirtschaftswunder, l'Allemagne s'est rapidement transformée en un État providence. Cela a permis à ses citoyens d'accéder facilement à diverses mesures de soutien en cas de difficultés. Un élément majeur de ce concept est le système de santé et son assurance maladie obligatoire pour les travailleurs et les fonctionnaires. Aujourd'hui, l'organisation et le maintien d'un tel mastodonte bureaucratique sont devenus une tâche de plus en plus difficile. En conséquence, le Bundesministerium für Gesundheit (ministère fédéral de la Santé) sera créé sous la tutelle de notre ministre de la Santé. Il aura pour mission de garantir la stabilité et la haute qualité de notre système de santé tout en contrôlant les nombreuses compagnies d'assurance maladie."
 WGR_Elections_of_1961:0 "Élections de 1961"
 WGR_Elections_of_1961_desc:0 "Les élections de 1961 approchent à grands pas ! Les discours sont en cours de rédaction, les rassemblements organisés, les affiches imprimées et les grandes promesses faites. Dans quelques semaines, l'Allemagne aura un gouvernement fraîchement élu pour la guider à travers cette période intéressante."
 WGR_Bundeswehr:0 "Bundeswehr"
 WGR_Bundeswehr_desc:0 "Après la destruction et la dissolution de la Wehrmacht nazie, la nation allemande est restée sans armée pendant près d'une décennie. En 1955, les bases de la Bundeswehr, la nouvelle armée d'une nouvelle Allemagne, ont été jetées. Depuis lors, nous avons parcouru un long chemin pour équiper nos forces de armes modernes, créer une administration efficace et mettre en œuvre de nouvelles tactiques. À l'aube des années 60, les tensions internationales croissantes et les progrès technologiques incessants exigent de nouvelles modernisations, des structures organisationnelles améliorées et, surtout, une nouvelle expansion de la Bundeswehr. « Wir. Dienen. Deutschland ! »"
 WGR_Elections_of_1965:0 "Élections de 1965"
 WGR_Elections_of_1965_desc:0 "Les élections de 1965 approchent à grands pas ! Les discours sont en cours de rédaction, les rassemblements organisés, les affiches imprimées et les grandes promesses faites. Dans quelques semaines, l'Allemagne aura un gouvernement fraîchement élu pour la guider à travers cette période intéressante."
 WGR_Elections_of_1969:0 "Élections de 1969"
 WGR_Elections_of_1969_desc:0 "Les élections de 1969 approchent à grands pas ! Les discours sont en cours de rédaction, les rassemblements organisés, les affiches imprimées et les grandes promesses faites. Dans quelques semaines, l'Allemagne aura un gouvernement fraîchement élu pour la guider à travers cette période intéressante."
 WGR_Expand_the_Autobahn:0 "Développer l'autoroute"
 WGR_Expand_the_Autobahn_desc:0 "Créées à l'époque de la République de Weimar, lorsque les voitures ont commencé à être de plus en plus utilisées par les civils, puis développées par Hitler pour garantir des emplois et améliorer l'infrastructure de guerre, les célèbres autoroutes allemandes sont devenues un exemple international en matière de transport efficace et de déplacements rapides. Jusqu'à présent, nous avons investi beaucoup d'argent et d'efforts pour reconstruire et développer le réseau routier, mais il existe certainement un potentiel d'amélioration encore plus important ! Relions le nord au sud, chaque centre industriel, chaque ville et chaque village avec des routes dignes d'être admirées ! Nos citoyens et nos industriels nous en seront reconnaissants !"
 WGR_Expand_North_German_Infrastructure:0 "Développer les infrastructures dans le nord de l'Allemagne"
 WGR_Expand_North_German_Infrastructure_desc:0 "La renaissance du cœur industriel allemand en Rhénanie-du-Nord-Westphalie a été un succès total. À un rythme soutenu, de nouvelles usines sont construites, des entreprises créées et des emplois générés. Si cette évolution est très réjouissante, notre économie ne pourra continuer à croître que si les biens produits peuvent être acheminés efficacement vers les acheteurs. Si la distribution nationale des biens de consommation est importante, un accès rapide aux pôles d'exportation et d'importation des ports de Hambourg ou de Brême est tout aussi crucial pour rester compétitifs au niveau international et approvisionner notre propre industrie en matières premières étrangères. Il est donc dans notre intérêt d'améliorer encore les infrastructures dans le nord du pays."
 WGR_Haindl_Papier_GmbH:0 "Haindl Paper Corporation"
 WGR_Haindl_Papier_GmbH_desc:0 "Fondée à l'origine au milieu du XIXe siècle à Augsbourg, la société Haindl Papier GmbH a ouvert une usine de papier dans la ville de Walsum en 1962. Grâce à un créneau commercial qui existait à l'époque et à l'énorme capacité de production du nouveau site, l'entreprise est rapidement devenue le premier producteur de papier en Allemagne."
 WGR_Expand_the_Ritterstrasse:0 "Élargir la Ritterstrasse"
 WGR_Expand_the_Ritterstrasse_desc:0 "Hambourg, Cologne, Munich, Nuremberg... les grandes villes d'antan sont passées de ruines à centres urbains animés. Aujourd'hui, rares sont les bâtiments qui rappellent les destructions catastrophiques d'il y a seulement quinze ans. Mais en cette nouvelle ère technologique, nos architectes devraient se surpasser et non seulement recréer l'ancien paysage urbain, mais aussi le moderniser ! La station de métro Ritterstrasse, récemment inaugurée à Hambourg, est un excellent exemple de ces efforts. Grâce au réseau de métro en constante expansion de notre plus grande ville, les masses peuvent se rendre facilement dans cette galerie marchande et en repartir, apportant ainsi une vague de nouveaux clients aux magasins et boutiques. Et, bien sûr, des recettes fiscales supplémentaires au gouvernement."
 WGR_North_German_Port_Expansions:0 "Extensions des ports d'Allemagne du Nord"
 WGR_North_German_Port_Expansions_desc:0 "Les ports du nord de l'Allemagne ont toujours été sa porte ouverte sur le monde. À partir du XIVe siècle, avec la « Hanse », une coopération commerciale entre les grandes villes portuaires de Hambourg, Brême, Rostock et Lübeck, ces villes ont connu une augmentation massive de leur puissance économique et politique au fil des siècles au sein du Saint-Empire romain germanique et de l'Empire allemand. Pendant la Seconde Guerre mondiale, leur rôle commercial et leur importance stratégique en tant que berceaux de la Kriegsmarine ont entraîné des destructions massives. Nos récents efforts de reconstruction ont permis la renaissance des jetées et des docks, mais la croissance économique continue, combinée à un besoin accru de capacités d'exportation et d'importation, exige une deuxième expansion de nos ports à Hambourg, Brême et Kiel. Faisons savoir au monde entier que nous sommes de retour sur la scène économique mondiale !"
 WGR_Gelsenkirchen_Buer_Nord_Marl_Lippe_Railway:0 "Liaison ferroviaire entre Gelsenkirchen et Marl-Lippe"
 WGR_Gelsenkirchen_Buer_Nord_Marl_Lippe_Railway_desc:0 "« Aujourd'hui, une importante liaison ferroviaire entre Gelsenkirchen et Marl-Lippe a été inaugurée. La connexion entre ces deux pôles industriels de la Ruhrpott permettra à nos travailleurs de se rendre plus rapidement sur leur lieu de travail, ce qui améliorera l'efficacité de l'industrie. Une situation gagnant-gagnant, Mesdames et Messieurs ! »"
 WGR_Establish_the_German_Development_Institute:0 "Créer l'Institut allemand de développement"
 WGR_Establish_the_German_Development_Institute_desc:0 "Le monde est chaque jour plus interconnecté, les échanges commerciaux, politiques et intellectuels franchissant les frontières comme jamais auparavant. Même avec le rideau de fer à nos portes, nous sommes quotidiennement en contact avec nos nombreux voisins européens à l'Ouest, nos alliés de l'OTAN et nos partenaires commerciaux à travers le monde. Il n'est donc pas surprenant qu'à un moment donné, un institut ait été créé pour mener des recherches sur la coopération internationale, l'économie et le développement. Le Deutsches Institut für Entwicklungshilfe (DIE) est un établissement extra-universitaire qui se consacrera à ces domaines scientifiques spécifiques afin d'intensifier la coopération mondiale, de soutenir nos intérêts à l'étranger et de former les futurs cadres administratifs."
 WGR_Water_Infrastructure_Investments:0 "Investissements dans les infrastructures hydrauliques"
 WGR_Water_Infrastructure_Investments_desc:0 "L'eau est essentielle à la vie telle que nous la connaissons. Si l'approvisionnement en eau venait à s'arrêter à tout moment, cela provoquerait une crise humanitaire en un rien de temps. Outre nos citoyens, l'industrie doit également être approvisionnée en eau courante fraîche et propre. La production implique souvent le refroidissement à l'eau, ou l'utilisation du liquide lui-même comme base pour d'autres produits. Et n'oublions pas l'agriculture... La liste est longue. Il est donc impératif que l'Allemagne dispose d'une infrastructure hydraulique fiable, hygiénique et durable, qui s'étende jusqu'aux zones les plus rurales. Bien que nous disposions déjà d'un tel système, il reste encore beaucoup à faire pour l'améliorer. Quel genre de nation industrielle du premier monde serions-nous sans un accès universel à l'eau potable ?"
 WGR_Hannover_Medical_School:0 "Faculté de médecine de Hanovre"
 WGR_Hannover_Medical_School_desc:0 "Avec l'expansion continue de notre système de santé, nous avons un besoin urgent de nouveau personnel médical. Bien qu'une nouvelle université de médecine à Hanovre devrait offrir une capacité plus que suffisante pour l'avenir proche, le directeur fondateur, le professeur Rudolf Schoen, réclame une réforme du programme d'études médicales. L'un des changements majeurs dans la formation des jeunes médecins sera « l'apprentissage au chevet des patients », comme il le dit lui-même. En d'autres termes, le professeur Schoen suggère de mettre davantage l'accent sur les compétences pratiques et sociales, contrairement à l'approche presque exclusivement théorique du passé. Cela permettra d'améliorer la qualité des traitements et de renforcer les liens entre les dieux en blouse blanche et leurs patients."
 WGR_Tertiary_Sector_in_West_Berlin:0 "Secteur tertiaire à Berlin-Ouest"
 WGR_Tertiary_Sector_in_West_Berlin_desc:0 "Au XIXe siècle, l'industrie allemande a pris un départ tardif par rapport au Royaume-Uni et à la France, mais elle a rapidement rattrapé son retard et s'est dotée d'un secteur secondaire impressionnant, réputé dans le monde entier. Avec le plan Marshall et le Wirtschaftswunder, ce pilier important de notre économie a fait son retour. Cependant, dans le cas de Berlin-Ouest, la ville-État isolée et assiégée est confrontée à un problème majeur : les usines doivent être approvisionnées en matériaux, ce qui est difficile à obtenir lorsque les frontières sont fermées. C'est ainsi que le secteur économique le plus récent de notre époque moderne a fait son apparition dans l'ancienne capitale : le secteur tertiaire. Des bureaux d'information, de marketing et de communication sont créés en un temps record. Ceux-ci ne nécessitent pas beaucoup de ressources, mais une main-d'œuvre nombreuse et motivée et quelques cadres."
 WGR_Establish_Nature_Parks:0 "Créer des parcs naturels"
 WGR_Establish_Nature_Parks_desc:0 "L'industrialisation rapide du XIXe siècle et la croissance continue de la première moitié du XXe siècle n'ont pas manqué de laisser des traces profondes dans la nature. Les forêts ont été abattues pour créer des terres agricoles supplémentaires, les zones humides ont été asséchées pour accueillir de nouvelles implantations, les cours d'eau ont été canalisés pour améliorer les voies de navigation, etc. Le peu qui reste de nature véritablement intacte en Allemagne est menacé par la pollution, les touristes et la poursuite de l'exploitation. Comme le suggèrent depuis un certain temps divers groupes et initiatives, des parcs naturels devraient être créés afin de protéger correctement les différents écosystèmes qui présentent des compositions, des qualités ou des espèces uniques. Nous le devons non seulement à la nature et au patrimoine national, mais aussi à nos citoyens, qui nous seront reconnaissants de préserver la beauté de la nature pour eux et les générations futures !"
 WGR_Roland_Berger_Strategy_Consultants:0 "Roland Berger Strategy Consultants"
 WGR_Roland_Berger_Strategy_Consultants_desc:0 "Après avoir travaillé pour le Boston Consulting Group aux États-Unis de 1962 à 1967, M. Roland Berger a créé son propre cabinet de conseil à Munich en 1967. Aux États-Unis, il s'est familiarisé avec de nouvelles stratégies commerciales et a importé ces connaissances en Allemagne, où les idées novatrices de M. Berger ont suscité un vif intérêt. Peu après, une importante mission confiée par la grande agence de voyages Touropa a offert à son cabinet une occasion en or de se lancer sur la scène internationale. Au fil des ans, l'accent est passé du marketing (vente de produits et de services) à la stratégie (réalisation des objectifs commerciaux). Aujourd'hui, c'est l'un des plus grands cabinets de conseil au monde."
 WGR_Cosntruct_the_Stammheim_Supermax_Prison:0 "Construire la prison de haute sécurité de Stammheim"
 WGR_Cosntruct_the_Stammheim_Supermax_Prison_desc:0 "La Justizvollzugsanstalt Stuttgart-Stammheim est un complexe pénitentiaire de haute sécurité réservé aux individus les plus dangereux de la société. Lorsque le groupe terroriste de gauche RAF (Fraction armée rouge) a été démantelé et ses dirigeants jugés, tous ont été emprisonnés dans la partie la plus surveillée de cet établissement. Dans la nuit du 18 octobre 1977, ils se sont tous suicidés, rendant Stammheim célèbre pour sa « nuit de la mort »."
 WGR_The_University_of_Ulm:0 "L'université d'Ulm"
 WGR_The_University_of_Ulm_desc:0 "Après que la communauté universitaire ait réclamé la création d'une nouvelle université dans le Land de Bade-Wurtemberg, l'université d'Ulm a ouvert ses portes en 1967. Initialement prévue pour être une université de médecine, le concept a rapidement été élargi pour inclure à la fois la médecine et les sciences naturelles. Au fil des ans, l'établissement s'est concentré sur des thèmes de recherche modernes tels que la gérontologie, le traitement des traumatismes, les technologies quantiques et l'interaction homme-machine."
 WGR_The_Effelsberg_Radio_Telescope:0 "Le radiotélescope d'Effelsberg"
 WGR_The_Effelsberg_Radio_Telescope_desc:0 "Le radiotélescope révolutionnaire d'Effelsberg a été financé par Volkswagen, construit en collaboration par MAN et Krupp, et exploité par l'Institut Max Planck. Avec une antenne parabolique de 100 mètres de diamètre, il s'agit du plus grand télescope de ce type. Grâce à lui, l'Allemagne rejoint officiellement les rangs des nations qui explorent la dernière frontière."
 WGR_WDR_3_Public_Radio:0 "Radio publique WDR-3"
 WGR_WDR_3_Public_Radio_desc:0 "La radio, avec les journaux, a longtemps été le média le plus important. Bien que l'avènement de la télévision soit en train de bouleverser le marché de l'information, presque tous les foyers et toutes les voitures allemands sont équipés d'une radio. Face à un public aussi large, le gouvernement a rapidement créé une chaîne publique : la Westdeutscher Rundfunk 3 (Radio ouest-allemande 3). Inspirée de la troisième chaîne de la BBC, la troisième chaîne de la WDR s'adresse à un public plus averti. Son objectif était d'informer sur la politique, de soutenir l'éducation et de diffuser de la musique classique, contrairement à de nombreuses autres chaînes proposant des comédies légères et de la musique de divertissement."
 WGR_European_Space_Operations_Centre:0 "Centre européen d'opérations spatiales"
 WGR_European_Space_Operations_Centre_desc:0 "Les superpuissances mondiales se sont lancées dans une course pour atteindre des étapes importantes dans la conquête spatiale, comme le lancement du premier satellite, la mise en orbite du premier être vivant et, ultime défi, l'envoi d'un homme sur la Lune. Alors que les nations européennes ne pouvaient espérer rivaliser seules avec les ambitions démesurées des Soviétiques et des Américains, l'ESA (Agence spatiale européenne) a été créée pour soutenir leurs intérêts communs en orbite et au-delà. L'un des centres de l'agence, appelé ESOC (Centre européen d'opérations spatiales), est situé à Darmstadt, en Allemagne. Chargé de contrôler un réseau mondial de suivi des satellites et des fusées en orbite basse, ainsi que trois stations de communication pour les futures missions dans l'espace lointain, ce centre d'opérations est un élément essentiel de l'ESA."
 WGR_CDU_Victory_1961:0 "Victoire de la CDU"
 WGR_CDU_Victory_1961_desc:0 "Les votes sont clos et dépouillés ! L'Union chrétienne-démocrate est sortie victorieuse et gouvernera notre nation pendant les quatre prochaines années."
 WGR_Protest_the_Berlin_Wall:0 "Manifestation contre le mur de Berlin"
 WGR_Protest_the_Berlin_Wall_desc:0 "Depuis sa fondation en 1949 jusqu'à aujourd'hui, plus de 2,7 millions de personnes ont fui la RDA contrôlée par les Soviétiques pour se réfugier en Allemagne de l'Ouest. Ce phénomène, baptisé Republikflucht, est une réaction aux faibles niveaux de vie, à l'instabilité économique et à la répression dans l'Est. Pour contrer cette tendance de plus en plus problématique, une solution simple mais brutale a été mise en œuvre le 13 août 1961 par le régime de Berlin-Est. Un mur a été construit pour séparer l'Allemagne de l'Ouest de l'Allemagne de l'Est, tandis que Berlin-Ouest était complètement encerclé, isolé dans la sphère rouge. La raison officielle invoquée pour cette action était la « protection contre l'influence fasciste », mais il s'agissait manifestement d'une tentative désespérée de la RDA pour empêcher l'émigration massive. La réaction de nos alliés à cette division a été jusqu'à présent décevante, se limitant à une réprobation de pure forme. Mais notre parti doit clamer haut et fort ce que tous les Allemands pensent de cet affront atroce !"
 WGR_The_Spiegel_Affair:0 "L'affaire Spiegel"
 WGR_The_Spiegel_Affair_desc:0 "Après la publication dans le magazine à grand tirage Spiegel d'un article sur un exercice de l'OTAN visant à tester la préparation NBC, l'éditeur Rudolf Augstein et de nombreux autres journalistes ont été arrêtés le 23 octobre 1962 pour trahison, pour avoir divulgué des informations prétendument confidentielles sur l'incapacité de l'Allemagne de l'Ouest à faire face à une telle attaque. Cette action a provoqué un scandale politique pour le parti au pouvoir, la CDU, et a été vivement condamnée par divers groupes et étudiants. Après de nombreux troubles, notamment la démission protestataire de cinq ministres, le ministre de la Défense Franz Josef Strauß (CDU) a démissionné, deux secrétaires d'État chargés des poursuites ont été licenciés, les journalistes arrêtés ont été libérés et le chancelier Adenauer a dû former un nouveau cabinet. Cela a entraîné une perte de pouvoir politique décisive pour la CDU et a été salué comme une victoire majeure pour la liberté de la presse."
 WGR_CDU_Victory_1965:0 "Victoire de la CDU"
 WGR_Ban_Student_Activism:0 "Interdire le militantisme étudiant"
 WGR_Seek_Budgetary_Reforms:0 "Rechercher des réformes budgétaires"
 WGR_The_Formation_of_the_First_Grand_Coalition:0 "La formation de la première grande coalition"
 WGR_Political_Mediation:0 "Médiation politique"
 WGR_Establish_Sick_Pay:0 "Mettre en place des indemnités journalières"
 WGR_Strengthen_Regional_Economies:0 "Renforcer les économies régionales"
 WGR_Deepen_ECSC_Integration:0 "Approfondir l'intégration à la CECA"
 WGR_Deepen_ECSC_Integration_desc:0 "La CECA (Communauté européenne du charbon et de l'acier) a été jusqu'à présent une organisation étonnamment efficace. Bien qu'elle ait été créée pour contrôler l'expansion militaire de l'Allemagne de l'Ouest en surveillant la production de charbon et d'acier, le traité n'était ni unilatéral ni hostile à l'Allemagne. Au contraire, les signataires de la CECA, à savoir la France, l'Italie, l'Allemagne de l'Ouest, la Belgique, les Pays-Bas et le Luxembourg, se sont engagés à partager un marché commun du charbon et de l'acier afin de mettre fin à la concurrence pour les ressources naturelles. Cette initiative, combinée à d'autres efforts politiques amicaux, a permis d'améliorer les relations avec nos voisins et de donner un formidable élan à notre économie. Il est donc logique d'approfondir notre coopération fructueuse, même au-delà des produits industriels de base !"
 WGR_The_Succession_of_Adeneaur:0 "La succession d'Adenauer"
 WGR_The_Succession_of_Adeneaur_desc:0 "Konrad Adenauer, premier chancelier de la RFA de 1949 à 1963, a dirigé le pays pendant quatorze années difficiles. Il a remporté de nombreuses victoires politiques pour l'Allemagne au cours de ses mandats, par exemple l'adhésion à l'OTAN, la fin officielle de l'Erbfeindschaft (rivalité jurée) avec la France, la mise en place d'une coopération internationale avec nos voisins... La liste est longue. Bien que principalement couronné de succès, Adenauer a également commis quelques erreurs en raison de son caractère plutôt obstiné. La plus notable, la tristement célèbre affaire Spiegel, a été le catalyseur de sa démission le 15 octobre 1963. De plus, son âge avancé de 87 ans appelait également à la modération. Un jour après l'abdication officielle, l'ancien ministre de l'Économie et père du Wirtschaftswunder, Ludwig Erhard, a été nommé successeur d'Adenauer."
 WGR_Deepen_NATO_Integration:0 "Approfondir l'intégration au sein de l'OTAN"
