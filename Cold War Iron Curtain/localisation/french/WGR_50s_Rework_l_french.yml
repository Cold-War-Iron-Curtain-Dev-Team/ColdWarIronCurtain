 WGR_FDP_Prov_Support_Nationalist_Regimes_in_Spain_Portugal: "Soutenir les régimes nationalistes en Espagne et au Portugal"
 WGR_FDP_Prov_Refuse_to_Recognize_Oder_Neisse_Line: "Refuser de reconnaître la ligne Oder-Neisse"
 WGR_FDP_Prov_Claim_Berlin_As_West_German: "Revendiquer Berlin comme l'Allemagne de l'Ouest"
 WGR_FDP_Prov_Annex_the_Saarland: "Annexer la Sarre"
 WGR_FDP_Prov_Become_Determined_for_a_Democratic_Germany: "Devenez déterminé pour une Allemagne démocratique"

 
 
 
 WGR_Bundeswehr_Speidel_Expand_Bundeswehr_Development:0 "Fondation de la Bundeswehr"
 WGR_Bundeswehr_Speidel_Expand_Bundeswehr_Development_desc:0 "Les premières mesures du réarmement n'étaient qu'un début. Pour assurer une défense souveraine, nous devons élargir notre cadre logistique et infrastructurel, jetant ainsi les bases d'une force de combat moderne."

 WGR_Bundeswehr_Speidel_Merge_BGS_Into_Bundeswehr:0 "Fusionner le BGS dans la Bundeswehr"
 WGR_Bundeswehr_Speidel_Merge_BGS_Into_Bundeswehr_desc:0 "La Bundesgrenzschutz nous a bien servi en tant que force de police paramilitaire, mais face à l'escalade des tensions de la Guerre froide, son personnel qualifié et son équipement sont mieux utilisés au sein de la structure de commandement unifiée de la Bundeswehr."

 WGR_Bundeswehr_Speidel_Reinforce_Duty_to_Country_and_Duty_to_Serve_Ideals:0 "Renforcer les idéaux du « devoir envers la patrie »"
 WGR_Bundeswehr_Speidel_Reinforce_Duty_to_Country_and_Duty_to_Serve_Ideals_desc:0 "Un soldat dans une démocratie est un « citoyen en uniforme ». En renforçant le concept d'« Innere Führung » et le devoir de servir la nation, nous garantissons un corps d'officiers loyaux, disciplinés et fondés sur l'éthique."

 WGR_Bundeswehr_Speidel_Nationalize_Heckler_and_Koch:0 "Nationaliser Heckler et Koch"
 WGR_Bundeswehr_Speidel_Nationalize_Heckler_and_Koch_desc:0 "Pour garantir notre approvisionnement en armes légères, l'État doit s'intéresser directement aux installations d'Oberndorf. Sous surveillance nationale, H&K deviendra la principale forge de fusils de fantassin allemand."

 WGR_Bundeswehr_Speidel_Purchase_American_Pattons_and_HS30s:0 "Achetez des Pattons américains et des HS-30 suisses"
 WGR_Bundeswehr_Speidel_Purchase_American_Pattons_and_HS30s_desc:0 "La production nationale prend du temps que nous n'avons pas. En nous procurant le fiable M48 Patton auprès de nos alliés américains et le HS-30 IFV en provenance de Suisse, nous pouvons mécaniser nos divisions immédiatement."
 
 WGR_Bundeswehr_Speidel_Form_the_Bundesmarine:0 "Former la Bundesmarine"
 WGR_Bundeswehr_Speidel_Form_the_Bundesmarine_desc:0 "Les côtes allemandes ne doivent pas rester sans défense. La naissance de la Bundesmarine marque notre retour dans la Baltique et dans la mer du Nord en tant que puissance navale engagée dans la défense occidentale."

 WGR_Bundeswehr_Speidel_Empower_the_Kriegsmarinewerft_Wilhelmshaven:0 "Renforcez le chantier naval de Wilhelmshaven"
 WGR_Bundeswehr_Speidel_Empower_the_Kriegsmarinewerft_Wilhelmshaven_desc:0 "Wilhelmshaven a toujours été le coeur de la puissance navale allemande. En modernisant ses quais, nous créons la capacité d'entretenir et de réparer les plus gros navires de notre nouvelle flotte."
 
 WGR_Bundeswehr_Speidel_Form_Luftwaffe:0 "Former la Luftwaffe"
 WGR_Bundeswehr_Speidel_Form_Luftwaffe_desc:0 "Le ciel au-dessus de l'Allemagne constitue la première ligne de défense. En établissant une nouvelle Luftwaffe démocratique, nous récupérons notre souveraineté aérienne et fournissons une couverture essentielle à nos forces terrestres."

 WGR_Bundeswehr_Speidel_Receive_US_F84_Thunderstreaks:0 "Recevez des F-84 Thunderstreaks américains"
 WGR_Bundeswehr_Speidel_Receive_US_F84_Thunderstreaks_desc:0 "Grâce au Programme d'assistance à la défense mutuelle, nous recevrons nos premiers chasseurs à réaction. Le F-84 servira de colonne vertébrale à nos ailes de frappe tactique jusqu'à ce que les conceptions nationales soient prêtes."
 
 ###Focuses 60s###
 
 WGR_found_the_gsg9: "Grenzschutzgruppe 9"
 WGR_found_the_gsg9_desc: "Suite à la mauvaise gestion de la tragédie olympique de 1972, le gouvernement ouest-allemand a créé le GSG 9 sous la direction de l'Oberstleutnant Ulrich Wegener de l'époque, afin que des situations similaires puissent à l'avenir être traitées de manière adéquate et professionnelle. De nombreux hommes politiques allemands s'opposent à sa création, craignant que le GSG 9 ne ravive le souvenir de la Schutzstaffel (SS) du parti nazi. La décision a été prise de former l'unité à partir de forces de police, et non de forces militaires, comme les forces équivalentes dans d'autres pays, au motif que la loi fédérale allemande interdit expressément le recours aux forces militaires contre la population civile."
 WGR_Establish_the_Ministry_of_Health: "Créer le ministère de la Santé"
 WGR_Establish_the_Ministry_of_Health_desc: "Avec la montée en flèche de l'économie lors du Wirtschaftswunder, l'Allemagne s'est rapidement transformée en un État-providence. Cela a offert à ses citoyens un accès facile à diverses mesures de soutien en cas de moments difficiles. Un élément majeur de ce concept est le système de santé et son assurance maladie obligatoire pour les travailleurs et les fonctionnaires. À l'heure actuelle, organiser et entretenir un tel poids bureaucratique est devenu une tâche de plus en plus lourde. En conséquence, le Bundesministerium für Gesundheit (ministère fédéral de la Santé) sera créé sous la tutelle de notre ministre de la Santé. Elle a pour mission de garantir la stabilité et la haute qualité de notre système de santé tout en contrôlant les nombreuses caisses d'assurance maladie."
 WGR_Elections_of_1961: "Élections de 1961"
 WGR_Elections_of_1961_desc: "Les élections de 1961 approchent ! Des discours sont rédigés, des rassemblements sont organisés, des affiches sont imprimées et de grandes promesses sont faites. Dans quelques semaines, l'Allemagne aura un gouvernement fraîchement élu pour la guider dans cette période intéressante."
 WGR_Bundeswehr: "Bundeswehr"
 WGR_Bundeswehr_desc: "Après la destruction et la dissolution de la Wehrmacht nazie, la nation allemande s'est retrouvée sans armée pendant près d'une décennie. En 1955, les bases de la Bundeswehr, la nouvelle armée d'une nouvelle Allemagne, sont posées. Depuis lors, nous avons parcouru un long chemin pour doter nos forces d'armes modernes, créer une administration efficace et mettre en oeuvre de nouvelles tactiques. À l'aube des années 60, les tensions internationales croissantes et les progrès technologiques toujours plus poussés exigent de nouvelles modernisations, des structures organisationnelles améliorées et, surtout, une nouvelle expansion de la Bundeswehr. \"Wir. Dienen. Deutschland!\""
 WGR_Elections_of_1965: "Élections de 1965"
 WGR_Elections_of_1965_desc: "Les élections de 1965 approchent ! Des discours sont rédigés, des rassemblements sont organisés, des affiches sont imprimées et de grandes promesses sont faites. Dans quelques semaines, l'Allemagne aura un gouvernement fraîchement élu pour la guider dans cette période intéressante."
 WGR_Elections_of_1969: "Élections de 1969"
 WGR_Elections_of_1969_desc: "Les élections de 1969 approchent ! Des discours sont rédigés, des rassemblements sont organisés, des affiches sont imprimées et de grandes promesses sont faites. Dans quelques semaines, l'Allemagne aura un gouvernement fraîchement élu pour la guider dans cette période intéressante."
 WGR_Expand_the_Autobahn: "Agrandir l'autoroute"
 WGR_Expand_the_Autobahn_desc: "Créées à l'époque de la République de Weimar, lorsque les voitures étaient de plus en plus utilisées par les civils, puis agrandies par Hitler pour garantir des emplois et améliorer les infrastructures de guerre, les célèbres autoroutes allemandes sont devenues un exemple international de transport efficace et de déplacement rapide. Jusqu'à présent, nous avons investi beaucoup d'argent et d'efforts pour reconstruire et étendre le système routier, mais il existe certainement un potentiel d'amélioration encore plus important ! Relions le Nord au Sud, chaque centre industriel, chaque ville et chaque village avec des rues à voir ! Nos citoyens et nos fabricants vous en seront reconnaissants !"
 WGR_Expand_North_German_Infrastructure: "Développer l'infrastructure de l'Allemagne du Nord"
 WGR_Expand_North_German_Infrastructure_desc: "La renaissance du coeur industriel allemand en Nordrhein-Westfalen a été un franc succès. À un rythme soutenu, de nouvelles usines sont construites, des entreprises fondées et des lieux de travail créés. Bien que cette évolution soit des plus encourageantes, notre économie ne poursuivra sa croissance que lorsque les biens produits pourront être transportés efficacement vers les acheteurs. Si la distribution nationale des biens de consommation est importante, un accès rapide aux points chauds d'exportation et d'importation dans les ports de Hambourg ou de Brême est tout aussi crucial pour faire face à la concurrence internationale et maintenir notre propre industrie approvisionnée en matériaux étrangers. Il est donc dans notre intérêt d'améliorer davantage les infrastructures dans le Nord."
 WGR_Haindl_Papier_GmbH: "Société de papier Haindl"
 WGR_Haindl_Papier_GmbH_desc: "Fondée au milieu du 19ème siècle à Augsbourg, la société Haindl Papier GmbH a ouvert une usine de papier dans la ville de Walsum en 1962. Grâce à une niche de marché à l'époque et à la capacité de production massive du nouveau site, l'entreprise est rapidement devenue le premier producteur de papier en Allemagne."
 WGR_Expand_the_Ritterstrasse: "Agrandir la Ritterstrasse"
 WGR_Expand_the_Ritterstrasse_desc: "Hambourg, Cologne, Munich, Nuremberg... Les grandes villes d'antan sont à nouveau transformées de ruines en centres de population animés. De nos jours, la vue de rares bâtiments rappelle les destructions désastreuses d'il y a à peine quinze ans. Mais dans cette nouvelle ère technologique, nos architectes doivent aller au-delà d'eux-mêmes et non seulement recréer l'ancien paysage urbain, mais aussi le moderniser ! Un excellent exemple de ces efforts est la station de métro Ritterstrasse, récemment inaugurée à Hambourg. Avec le système de métro en constante expansion de notre plus grande ville, les masses peuvent facilement se rendre à cette galerie commerciale et en sortir, offrant ainsi aux magasins et aux magasins des vagues de nouveaux clients. Et bien sûr, le gouvernement avec des recettes fiscales supplémentaires."
 WGR_North_German_Port_Expansions: "Extensions du port d'Allemagne du Nord"
 WGR_North_German_Port_Expansions_desc: "Les ports du nord de l'Allemagne ont toujours été sa porte sur le monde. Depuis le XIVe siècle avec la « Hanse », une coopération commerciale entre les grandes villes portuaires de Hambourg, Brême, Rostock et Lübeck, ces villes ont connu au fil des siècles une augmentation massive de leur pouvoir économique et politique au sein du Saint-Empire romain germanique et de l'Empire allemand. Pendant la Seconde Guerre mondiale, leur rôle commercial et leur importance stratégique en tant que berceaux de la Kriegsmarine ont entraîné des destructions massives. Nos récents efforts de reconstruction ont permis la renaissance des quais et des quais, mais la croissance économique continue, combinée à un besoin accru de capacité d'exportation et d'importation, exige une seconde expansion de nos ports de Hambourg, Brême et Kiel. Faites savoir au monde que nous sommes de retour sur la scène économique mondiale !"
 WGR_Gelsenkirchen_Buer_Nord_Marl_Lippe_Railway: "Chemin de fer Gelsenkirchen Buer Nord Marl Lippe"
 WGR_Gelsenkirchen_Buer_Nord_Marl_Lippe_Railway_desc: "\"Aujourd'hui, une importante liaison ferroviaire entre Gelsenkirchen et Marl-Lippe a été inaugurée. Relier ces deux pôles industriels de la Ruhrpott signifie des déplacements plus rapides pour nos travailleurs, et donc une meilleure efficacité pour l'industrie. Une situation gagnant-gagnant, mesdames et messieurs !\""
 WGR_Establish_the_German_Development_Institute: "Créer l'Institut allemand de développement"
 WGR_Establish_the_German_Development_Institute_desc: "Le monde est de plus en plus étroitement lié de jour en jour, les politiques et les idées commerciales traversant les frontières comme jamais auparavant. Même avec le rideau de fer à nos portes, nous sommes en contact quotidien avec nos nombreux voisins européens occidentaux, nos alliés de l'OTAN et des contacts commerciaux dans le monde entier. Il n'est pas surprenant qu'à un moment donné, un institut ait été créé pour mener des recherches sur la coopération internationale, l'économie et le développement. Le Deutsches Institut für Entwicklungshilfe (DIE) est un établissement extrascolaire qui se plongera dans ces domaines scientifiques spécifiques pour intensifier la coopération mondiale, soutenir nos intérêts à l'étranger et former le futur personnel administratif."
 WGR_Water_Infrastructure_Investments: "Investissements dans les infrastructures hydrauliques"
 WGR_Water_Infrastructure_Investments_desc: "L'eau est essentielle à la vie telle que nous la connaissons. Si l'approvisionnement en eau s'arrêtait à tout moment, cela provoquerait une crise humanitaire en un rien de temps. Outre nos concitoyens, l'industrie doit également disposer d'eau courante fraîche et propre. La production implique souvent un refroidissement par eau ou le liquide lui-même comme base pour d'autres produits. Et n'oublions pas l'agriculture... Eh bien, la liste est longue. En effet, il est impératif qu'une infrastructure d'eau fiable, hygiénique et durable existe en Allemagne, atteignant même les zones les plus rurales. Même si nous disposons déjà d'un tel système, des améliorations majeures peuvent encore être apportées. Quel genre de nation industrielle dans le premier monde serions-nous sans un accès universel à l'eau potable ?"
 WGR_Hannover_Medical_School: "École de médecine de Hanovre"
 WGR_Hannover_Medical_School_desc: "Avec l'expansion continue de notre système de santé, nous avons cruellement besoin de nouveau personnel médical. Bien qu'une nouvelle université de médecine à Hanovre devrait fournir une capacité plus que suffisante dans un avenir proche, le directeur fondateur, le professeur Rudolf Schoen, exige une réforme du programme d'études de médecine. Un changement majeur dans la formation des jeunes médecins sera « d'apprendre à côté du lit du patient », comme il l'a dit. En d'autres termes, le professeur Schoen suggère de mettre davantage l'accent sur les compétences pratiques et sociales, contrairement à l'approche presque exclusivement théorique du passé. Cela se traduira par une meilleure qualité de traitement et un lien plus étroit entre les dieux en blanc et leurs patients."
 WGR_Tertiary_Sector_in_West_Berlin: "Secteur tertiaire à Berlin-Ouest"
 WGR_Tertiary_Sector_in_West_Berlin_desc: "Au XIXe siècle, l'industrie allemande a démarré tardivement par rapport au Royaume-Uni et à la France, mais elle a rapidement rattrapé son retard et a donné naissance à un secteur secondaire impressionnant, célèbre dans le monde entier. Avec le Plan Maréchal et le Wirtschaftswunder, ce pilier important de notre économie est de nouveau revenu. Cependant, dans le cas de Berlin-Ouest, la cité-État isolée et assiégée a un problème majeur : les usines doivent être approvisionnées en matériaux, difficiles à obtenir lorsqu'elles sont entourées de frontières fermées. C'est ainsi que le secteur économique le plus récent de notre époque moderne a trouvé sa place dans l'ancienne capitale : le secteur tertiaire. Des bureaux d'information, de marketing et de communication sont créés en un temps record. Ceux-ci n'ont pas besoin de beaucoup de ressources, mais d'une masse de cols blancs volontaires et de quelques managers." 
 WGR_Establish_Nature_Parks: "Créer des parcs naturels"
 WGR_Establish_Nature_Parks_desc: "L'industrialisation rapide du XIXe siècle et la croissance continue au cours de la première moitié du XXe siècle ne se sont pas déroulées sans laisser de profondes cicatrices sur la nature. Les forêts ont été abattues pour créer des zones supplémentaires pour l'agriculture, les zones humides ont été asséchées pour de nouvelles colonies, les rivières canalisées pour de meilleures routes de navigation, etc. Le peu qui reste de nature véritablement intacte en Allemagne est menacé par la pollution, les touristes et une exploitation accrue. Proposés depuis longtemps par divers groupes et initiatives, des parcs naturels seront créés pour protéger adéquatement divers écosystèmes présentant des compositions, des qualités ou des espèces uniques. Non seulement nous le devons à Mère Nature et au patrimoine national ; nos citoyens seront reconnaissants de préserver la beauté de la nature pour eux et pour les générations futures !"
 WGR_Roland_Berger_Strategy_Consultants: "Roland Berger Consultants en stratégie"
 WGR_Roland_Berger_Strategy_Consultants_desc: "Après avoir travaillé pour le Boston Consulting Group aux États-Unis de 1962 à 1967, Monsieur Roland Berger a ouvert son propre bureau de conseil à Munich en 1967. Aux États-Unis, il a découvert de nouvelles stratégies commerciales et a importé ces connaissances en Allemagne, où les idées fraîches de Berger ont été accueillies avec fascination. Bientôt, une mission majeure de la grande agence de voyages Touropa offrait à son bureau une occasion en or de pénétrer sur la scène internationale. Au fil des années, l'accent est passé du marketing (vente de produits et services) à la stratégie (atteinte des objectifs commerciaux). Aujourd'hui, c'est l'une des plus grandes agences de conseil au monde."
 WGR_Cosntruct_the_Stammheim_Supermax_Prison: "Construisez la prison Stammheim Supermax"
 WGR_Cosntruct_the_Stammheim_Supermax_Prison_desc: "Le Justizvollzugsanstalt Stuttgart-Stammheim est un complexe pénitentiaire de haute sécurité réservé aux éléments les plus dangereux de la société. Lorsque le groupe terroriste de gauche RAF (Faction Armée Rouge) a été démantelé et que ses dirigeants ont été jugés, tous ont été emprisonnés dans la partie la plus étroitement surveillée de cet établissement. Dans la nuit du 18 octobre 1977, tous se suicidèrent, rendant Stammheim célèbre pour sa « Nuit de la mort »."
 WGR_The_University_of_Ulm: "L'Université d'Ulm"
 WGR_The_University_of_Ulm_desc: "Suite à la demande de la communauté universitaire de créer une nouvelle université dans le Land de Bade-Wurtemberg, l'Université d'Ulm a ouvert ses portes en 1967. Initialement conçue comme une université de médecine, le concept a rapidement été étendu à une approche combinée de la médecine et des sciences naturelles. Au fil des années, l'institution a mis l'accent sur des sujets de recherche modernes tels que la gérontologie, le traitement des traumatismes, les technologies quantiques et l'interaction homme-machine."
 WGR_The_Effelsberg_Radio_Telescope: "Le radiotélescope Effelsberg"
 WGR_The_Effelsberg_Radio_Telescope_desc: "Le radiotélescope révolutionnaire Effelsberg a été financé par Volkswagen, construit en coopération par MAN et Krupp et exploité par l'Institut Max-Planck. Doté d'une parabole de 100 m de diamètre, c'est le plus grand télescope du genre. Avec cela, l'Allemagne rejoint officiellement les rangs des nations qui recherchent la dernière frontière."
 WGR_WDR_3_Public_Radio: "Radio publique WDR-3"
 WGR_WDR_3_Public_Radio_desc: "La radio, après les journaux, est depuis longtemps le média le plus important. Bien que l'avènement de la télévision modifie le marché de l'information, presque tous les foyers et voitures allemands sont équipés d'une radio. Avec une audience aussi large, le gouvernement a créé avec empressement une branche de radiodiffusion de service public dans l'éther : la Westdeutscher Rundfunk 3 (émission ouest-allemande 3). Inspiré du troisième programme radio de la BBC, le troisième programme du WDR s'adresse à l'auditeur le plus averti. Son objectif était d'informer sur la politique, de soutenir l'éducation et de diffuser de la musique classique, contrairement à de nombreuses autres chaînes proposant de la comédie légère et de la musique récréative."
 WGR_European_Space_Operations_Centre: "Centre européen des opérations spatiales"
 WGR_European_Space_Operations_Centre_desc: "Les superpuissances du monde se sont engagées dans une compétition pour franchir des étapes importantes dans la conquête de l'espace, par exemple le lancement du premier satellite, la mise en orbite de la première vie et le prix ultime pour envoyer un homme sur la Lune. Alors que les nations européennes ne peuvent espérer rivaliser avec les grandes ambitions des Soviétiques et des Américains, l'ESA (Agence spatiale européenne) a été créée pour soutenir leurs intérêts communs en orbite et au-delà. L'un des centres de l'agence appelé ESOC (European Space Operation Center) est situé à Darmstadt, en Allemagne. Chargé de contrôler un réseau mondial de suivi des satellites et des fusées en orbite basse, ainsi que trois stations de communication lors des futures missions dans l'espace lointain, ce centre d'opérations est un élément essentiel de l'ESA."
 WGR_CDU_Victory_1961: "Victoire de la CDU"
 WGR_CDU_Victory_1961_desc: "Les votes sont lancés et comptés ! L'Union chrétienne-démocrate est sortie victorieuse et gouvernera notre nation pour les quatre prochaines années."
 WGR_Protest_the_Berlin_Wall: "Protester contre le mur de Berlin"
 WGR_Protest_the_Berlin_Wall_desc: "Entre sa création en 1949 et aujourd'hui, plus de 2,7 millions de personnes ont fui la RDA sous contrôle soviétique pour se réfugier en Allemagne de l'Ouest. Ce que l'on a surnommé la Republikflucht est la réaction au faible niveau de vie, à l'instabilité économique et à la répression à l'Est. Pour contrer cette tendance de plus en plus problématique, une solution simple mais rudimentaire fut mise en oeuvre le 13 août 1961 par le régime de Berlin-Est. Un mur fut construit pour séparer l'Allemagne de l'Ouest de l'Allemagne de l'Est, tandis que Berlin-Ouest était entièrement murée, isolée dans la sphère rouge. La raison officielle de cette action était la « protection contre l'influence fasciste », mais elle présentait évidemment la tentative désespérée de la RDA d'empêcher l'émigration massive. La réaction de nos alliés face à cette division a été jusqu'ici décevante, se limitant à des répréhensions pour la forme. Mais notre parti criera haut et fort ce que chaque Allemand pense de cet affront atroce !"
 WGR_The_Spiegel_Affair: "L'affaire Spiegel"
 WGR_The_Spiegel_Affair_desc: "Après que le magazine à grand tirage Spiegel eut publié un article sur une manoeuvre de l'OTAN mettant en pratique la préparation NBC, l'éditeur Rudolf Augstein et de nombreux autres journalistes furent arrêtés pour trahison le 23 octobre 1962, pour avoir divulgué des détails prétendument restreints sur l'incapacité de l'Allemagne de l'Ouest à gérer une telle agression. Cette action a provoqué un scandale politique au sein du parti au pouvoir CDU et a été fortement condamnée par divers groupes et étudiants. Après de nombreux troubles, notamment la démission de cinq ministres en signe de protestation, le ministre de la Défense Franz Josef Strauß (CDU) a abdiqué, deux secrétaires d'État chargés du parquet ont été licenciés, les journalistes arrêtés ont été libérés et le chancelier Adenauer a dû former un nouveau cabinet. Cela a entraîné une perte de pouvoir politique décisive pour la CDU et a été salué comme une victoire majeure pour la liberté de la presse."
 WGR_CDU_Victory_1965: "Victoire de la CDU"
 WGR_Ban_Student_Activism: "Interdire l'activisme étudiant"
 WGR_Seek_Budgetary_Reforms: "Rechercher des réformes budgétaires"
 WGR_The_Formation_of_the_First_Grand_Coalition: "La formation de la première grande coalition"
 WGR_Political_Mediation: "Médiation politique"
 WGR_Establish_Sick_Pay: "Établir des indemnités de maladie"
 WGR_Strengthen_Regional_Economies: "Renforcer les économies régionales"
 WGR_Deepen_ECSC_Integration: "Approfondir l'intégration de la CECA"
 WGR_Deepen_ECSC_Integration_desc: "La CECA (Communauté européenne du charbon et de l'acier) a connu jusqu'à présent un succès surprenant. Bien qu'il ait été créé pour contrôler l'expansion militaire de l'Allemagne de l'Ouest en surveillant la production de charbon et d'acier, le traité n'était ni unilatéral ni malveillant à l'égard de l'Allemagne. Bien au contraire, les signataires du SECS que sont la France, l'Italie, l'Allemagne de l'Ouest, la Belgique, les Pays-Bas et le Luxembourg se sont engagés à partager un marché commun du charbon et de l'acier afin de mettre un terme à la concurrence sur les ressources naturelles. Cet acte, combiné à d'autres efforts politiques amicaux, a conduit à de meilleures relations avec nos voisins que jamais auparavant et nous a donné un grand élan économique. Il est donc logique d'approfondir notre coopération fructueuse, même au-delà des produits industriels de base !"
 WGR_The_Succession_of_Adeneaur: "La succession d'Adenauer"
 WGR_The_Succession_of_Adeneaur_desc: "Konrad Adenauer, premier chancelier de la FGR de 1949 à 1963, l'a conduite pendant quatorze ans dans des moments difficiles. Il a remporté de nombreuses victoires politiques pour l'Allemagne au cours de son mandat, par exemple l'adhésion à l'OTAN, la fin formelle de l'Erbfeindschaft (rivalité promise) avec la France, la création d'une coopération internationale avec nos voisins... La liste est longue. Bien qu'il ait surtout réussi, Adenauer a également laissé tomber quelques briques en raison de son caractère plutôt têtu. La plus marquante est la tristement célèbre affaire Spiegel qui fut le catalyseur de sa démission le 15 octobre 1963. De plus, son âge avancé de 87 ans appelait également à la tempérance. Un jour après l'abdication formelle, l'ancien ministre de l'Économie et père du Wirtschaftswunder Ludwig Erhard a été nommé successeur d'Adenauer."
 WGR_Deepen_NATO_Integration: "Approfondir l'intégration de l'OTAN"
