 WGR_Increase_Goverment_Spending:0 "Augmenter les dépenses publiques"
 WGR_Increase_Living_Standards_for_Students:0 "Améliorer le niveau de vie des étudiants"
 WGR_Seek_Rappoachment_with_the_East:0 "Rechercher le rapprochement avec l'Orient"
 WGR_Increase_Taxes:0 "Augmenter les impôts"
 WGR_Ostpolitik:0 "Ostpolitik"
 WGR_Increase_Pension_Insurance:0 "Augmenter l'assurance pension"
 WGR_The_Moscow_Treaty:0 "Le traité de Moscou"
 WGR_Bundesmarine:0 "Bundesmarine"
 WGR_Bundesmarine_desc:0 "La Bundesmarine est la force navale permanente de la République fédérale d'Allemagne. Entièrement intégrée aux stratégies maritimes de l'OTAN, ses principales missions consistent à assurer la défense côtière de la mer du Nord et de la mer Baltique contre d'éventuelles attaques amphibies soviétiques en temps de guerre, et à escorter les convois alliés. Pour mener à bien ces missions, notre flotte sera composée de navires plus petits, mais efficaces, adaptés au combat en mer intérieure. Le développement, la construction et le déploiement de ces navires constitueront une nouvelle étape importante pour l'ensemble de la Bundeswehr."
 WGR_Order_Hamburg_Class_Destroyers:0 "Commander des destroyers de classe Hamburg"
 WGR_Order_Hamburg_Class_Destroyers_desc:0 "La nouvelle génération de destroyers allemands porte le nom de la plus grande ville portuaire du pays, véritable fenêtre sur le monde. Avec un déplacement d'environ 4 000 tonnes, ce type de navire sera le plus grand de la Bundesmarine. Son arsenal moderne est spécialisé dans la lutte anti-sous-marine, mais il offre également des capacités contre les aéronefs, ainsi que plusieurs lance-torpilles et quatre tourelles de 100 millimètres pour combattre les navires de surface."
 WGR_Class_205_Submarines:0 "Sous-marins de classe 205"
 WGR_Class_205_Submarines_desc:0 "Aucune nation allemande n'a jamais pu se vanter d'avoir une flotte de surface importante et puissante, du moins par rapport aux nations maritimes modernes. Cependant, un type de navire a été utilisé de manière excessive pendant les deux guerres mondiales et s'est forgé une réputation (tristement) célèbre pour sa létalité : l'Unterseeboot, ou U-Boot. Ces sous-marins sont appelés à jouer le même rôle aujourd'hui. Chargés de détruire les convois ennemis et les cibles lourdes et lentes, ces chasseurs silencieux sont de retour en action."
 WGR_Cologne_Class_Frigates:0 "Frégates de classe Cologne"
 WGR_Cologne_Class_Frigates_desc:0 "Les frégates de la classe F120, appelées « classe Köln » d'après le nom du premier navire de ce type, sont presque identiques à leurs sœurs de la classe « Hamburg », à l'exception d'une coque plus lisse et d'un système de propulsion plus avancé qui utilise à la fois des moteurs diesel et une turbine à gaz. Principalement équipés pour traquer et éliminer les sous-marins, ces navires rapides et élégants sont dédiés aux missions d'escorte de convois et de formations navales plus importantes."
 WGR_Lutjens_Class_Destroyers:0 "Destroyers de classe Lutjens"
 WGR_Lutjens_Class_Destroyers_desc:0 "Afin de renforcer davantage les rangs de notre marine fédérale naissante, les hauts gradés ont demandé l'achat de destroyers américains de la classe « Charles F. Adams ». Après avoir subi quelques modifications mineures pour répondre aux normes allemandes en matière d'équipements de communication, les navires de la classe alors appelée « Lütjens » ont assumé le rôle de puissants navires de défense aérienne, protégeant la flotte grâce à leurs impressionnants missiles antiaériens et leurs canons antiaériens."
 WGR_Heer:0 "Heer"
 WGR_Heer_desc:0 "Le terme « Heer » désigne généralement tout type d'armée terrestre. Le Heer de notre Bundeswehr nouvellement créée comprend des unités blindées, spéciales et héliportées, ainsi que tous les types d'infanterie. Nous disposerons ainsi d'une structure organisationnelle claire qui sépare les unités de combat terrestres de la Marine et de la Luftwaffe."
 WGR_Fortify_West_Berlin:0 "Fortifier Berlin-Ouest"
 WGR_Fortify_West_Berlin_desc:0 "En 1945, l'ancienne capitale allemande, Berlin, a été réorganisée en quatre secteurs, gouvernés par les puissances victorieuses que sont l'Union soviétique, les États-Unis, le Royaume-Uni et la France. Alors que le secteur russe est devenu plus tard « Berlin-Est », les secteurs alliés sont communément appelés « Berlin-Ouest » et ont été traités comme un État de la République fédérale d'Allemagne. Depuis la création de la RDA et le refroidissement des relations diplomatiques avec l'URSS, Berlin-Ouest reste dans une situation précaire, isolée dans un océan rouge plutôt hostile. Il serait sage de préparer et de fortifier notre partie isolée de l'ancienne capitale, au cas où la guerre froide viendrait soudainement à s'envenimer."
 WGR_Adopt_the_G3:0 "Adopter le G3"
 WGR_Adopt_the_G3_desc:0 "Les armes automatiques sont devenues un élément essentiel de toute armée depuis la Seconde Guerre mondiale. Afin de perfectionner son équipement, l'entreprise d'armement espagnole CETME a engagé Ludwig Vorgrimler, un ancien employé de l'ancien fabricant d'armes allemand Mauser. Il était le concepteur en chef du tristement célèbre Sturmgewehr 45, un fusil d'assaut utilisé par la Wehrmacht à la fin de la guerre. S'appuyant sur sa conception, Herr Vorgrimler créa un nouveau type de fusil automatique moderne appelé AR58 pour les troupes espagnoles. La Bundeswehr en commanda un lot au début des années 60, mais le modifia pour l'adapter à ses normes exigeantes. Après leur ajout, l'entreprise d'armement ouest-allemande Heckler&Koch acheta la licence à CETME pour produire le fusil sur le marché intérieur sous le nouveau nom de Gewehr 3, ou « G3 » en abrégé."
 WGR_Develop_the_Leopard:0 "Développer le Léopard"
 WGR_Develop_the_Leopard_desc:0 "Au cours de la seconde moitié de la Seconde Guerre mondiale, les chars allemands étaient largement considérés comme très avancés et efficaces, bien qu'ils fussent quelque peu sujets aux pannes. Depuis lors, les nouveaux matériaux, l'accélération du rythme et les tactiques de guerre encore plus meurtrières ont nécessité des innovations considérables dans le domaine de la guerre blindée. Afin d'équiper la Bundeswehr en chars et de perpétuer notre tradition de conception efficace, la société Krauss-Maffei Wegmann a été chargée de développer le premier char national depuis la fin de la guerre. Le Leopard 1 est le fruit de cette entreprise. Doté de systèmes de soutien modernes et d'un armement précis, il est non seulement utilisé par nos troupes, mais a également déjà trouvé sa place dans les armées de plusieurs autres pays."
 WGR_The_Marder_IFV:0 "Le véhicule de combat d'infanterie Marder"
 WGR_The_Marder_IFV_desc:0 "Pour protéger les précieux chars, il a toujours été impératif d'accompagner les avancées blindées par de l'infanterie. Avec les nouvelles technologies et stratégies meurtrières, les soldats à pied sont également exposés à un danger considérable lorsqu'ils se déplacent sur le champ de bataille. C'est pourquoi la Bundeswehr a été contrainte de développer et de mettre en place des méthodes fiables pour protéger l'infanterie moyenne. La réponse à ces problèmes est le Marder 1, un véhicule de combat d'infanterie moderne. Il a été développé par Rheinmetall, une entreprise allemande d'armement. Pouvant transporter douze hommes au combat, il offre également une protection efficace contre les armes légères et moyennes, une vitesse de redéploiement rapide et un tir de soutien pour ses passagers."
 WGR_Luftwaffe:0 "Luftwaffe"
 WGR_Luftwaffe_desc:0 "La troisième branche de la Bundeswehr est dédiée au combat aérien, à l'exception des hélicoptères. La mission principale de la Luftwaffe est d'assurer la sécurité et le contrôle de l'espace aérien national. Bien que nous soyons à nouveau en mesure de maintenir une force aérienne professionnelle et moderne depuis la fin de la guerre et après une décennie d'interruption dans son développement, il reste encore beaucoup à faire avant que l'aigle allemand puisse véritablement déployer à nouveau ses ailes !"
 WGR_Expand_Taktisches_Luftwaffengeschwader_Airbases:0 "Développer les bases aériennes de la Taktisches Luftwaffengeschwader"
 WGR_Expand_Taktisches_Luftwaffengeschwader_Airbases_desc:0 "Afin de sécuriser correctement l'espace aérien allemand, il faut non seulement des avions, mais aussi des bases où ils peuvent être entretenus et d'où ils peuvent décoller. Afin de développer davantage la Luftwaffe, nous devons également investir dans nos bases aériennes."
 WGR_Purchase_the_F104:0 "Acheter le F-104"
 WGR_Purchase_the_F104_desc:0 "Pour rattraper plus de dix ans de retard en matière de développement et de formation depuis la Seconde Guerre mondiale, l'Allemagne a besoin d'une aide internationale afin de redonner à la Luftwaffe des capacités dignes de ce nom. Il a été décidé d'acquérir le chasseur à réaction F-104 « Starfighter » produit par la société américaine Lockheed Corporation. Si ce modèle semble prometteur, il présente toutefois certains problèmes techniques."
 WGR_Reduce_F104_Accident_Rates:0 "Réduire les taux d'accidents F104"
 WGR_Reduce_F104_Accident_Rates_desc:0 "Un scandale ! Environ un tiers des F-104 Starfighters achetés n'étaient bons qu'à la ferraille ! Dès l'inauguration des premiers chasseurs, l'équipe de démonstration aérienne composée de quatre avions s'est écrasée, suivie de nombreux autres accidents mortels au cours des mois suivants. Cela a coûté la vie à plus de 100 pilotes jusqu'à présent, ce qui a valu au F-104 le surnom de « Widowmaker » (faiseur de veuves) ! Les accusations de corruption et de négligence fusent de toutes parts et le ministre de la Défense, Franz Josef Strauß, a du mal à expliquer ce dilemme. Peu importe qui est responsable en fin de compte, nous devons corriger les défauts du F-104 et le rendre beaucoup plus sûr !"
 WGR_Import_F-4_Phantom_II:0 "Importer des F-4 Phantom II"
 WGR_Import_F-4_Phantom_II_desc:0 "Une autre entreprise américaine prometteuse et, espérons-le, plus fiable dans le domaine de l'armement est McDonell Aircraft. Son modèle hautement adaptable « F-4 Phantom II » s'est déjà révélé être un chasseur très polyvalent pour les missions de reconnaissance et d'appui aérien. Et contrairement à l'incident catastrophique du F-104, aucun problème majeur ni décès de pilote n'ont été signalés."
 WGR_Biblis_Nuclear_Plant:0 "Centrale nucléaire de Biblis"
 WGR_Biblis_Nuclear_Plant_desc:0 "En 1945, les États-Unis ont démontré la puissance effrayante mais impressionnante de l'atome. Alors que les Soviétiques et les Américains continuent de construire un arsenal atomique susceptible de provoquer l'apocalypse, nous nous intéressons davantage à l'application pacifique de cette nouvelle technologie merveilleuse. Les centrales nucléaires constituent une source d'énergie propre et quasi infinie, tout en produisant beaucoup plus d'énergie que les centrales traditionnelles alimentées par des combustibles fossiles. La première centrale de ce type en Allemagne est en cours de construction à Biblis. Avec une puissance estimée à 1 225 MW, elle soutiendra nos efforts industriels en Hesse et témoignera de notre entrée dans l'ère atomique !"
