 WGR_Franke_57_A_Second_Franke_Government_desc: "Le peuple a parlé. Le Bundestagswahl de 1957 a reconduit Egon Franke à la Chancellerie pour un second mandat. Avec un mandat renouvelé, son gouvernement est prêt à faire des choix décisifs qui façonneront l'armée, l'économie et la place ultime de l'Allemagne dans le monde pour les décennies à venir."

 WGR_Franke_57_Increase_Portions_in_Bundestag_Cafeteria_desc: "Un homme politique bien nourri est un homme politique productif. Pour des raisons d'importance nationale et de morale parlementaire, le Chancelier a ordonné une révision de la cafétéria du Bundestag. Les portions seront augmentées, garantissant ainsi à nos représentants le courage de s'engager dans des débats longs et ardus."

 WGR_Franke_57_Separate_from_SPD_Leftist_Ideals_desc: "Le temps des divisions internes est révolu. Nous consoliderons les ailes pragmatiques et centristes du parti en un « Bloc social-démocrate unifié ». Cette décision mettra formellement à l'écart la gauche idéologique, garantissant que le SPD puisse gouverner d'une seule voix moderne qui parle au nom de tous les Allemands, et pas seulement de quelques radicaux."

 WGR_Franke_57_Form_United_Bloc_CDU_desc: "Pour relever les grands défis de notre époque, une majorité simple ne suffit pas. Nous nous rallierons à la CDU, formant une grande coalition des deux grandes forces politiques allemandes. Ce gouvernement d'unité nationale apportera la stabilité nécessaire aux réformes fondamentales."

 WGR_Franke_57_Remove_Ollenhauer_from_Govt_desc: "Erich Ollenhauer et ses partisans de gauche représentent le passé de notre parti, pas son avenir. Pour garantir que le gouvernement puisse poursuivre son programme pragmatique sans sabotage interne, Ollenhauer et ses principaux alliés seront démis de tous les postes ministériels et clés du gouvernement."

 WGR_Franke_57_Debate_Definition_of_Socialism_desc: "Que signifie être un parti socialiste à l'ère moderne ? Le SPD s'engagera dans un débat fondamental pour redéfinir sa relation avec le socialisme, en s'éloignant du dogme marxiste dépassé pour se tourner vers une interprétation moderne, éthique et démocratique."

 WGR_Franke_57_Debate_Religion_in_Public_Schools_desc: "Le rôle de l'Église dans nos écoles reste une question controversée. Les partis de la coalition débattront à nouveau de la question, cherchant un compromis durable entre les idéaux laïcs du SPD et les valeurs chrétiennes de nos partenaires."

 WGR_Franke_57_Debate_Free_Market_Reforms_desc: "Nos partenaires de la CDU et du FDP font pression pour de nouvelles réformes du libre marché, y compris la déréglementation et la privatisation. Même si nous soutenons une économie forte, nous devons débattre attentivement de ces propositions pour nous assurer qu'elles ne compromettent pas le filet de sécurité sociale pour lequel nous nous sommes battus si durement."

 WGR_Franke_57_Announce_New_Military_Economic_Programs_desc: "L'orientation politique du gouvernement étant désormais fixée, nous annoncerons un plan quinquennal global. Ce programme ambitieux se concentrera sur deux piliers fondamentaux : la création d'une Bundeswehr moderne et efficace et la poursuite de l'expansion de notre miracle économique « Wirtschaftswunder »."

 WGR_Franke_57_Expand_Bundeswehr_desc: "Une nation souveraine doit être capable de se défendre. Nous autoriserons une expansion majeure de la Bundeswehr, en augmentant sa taille, son budget et ses capacités pour en faire l'une des forces combattantes les plus redoutables d'Europe."

 WGR_Franke_57_Accept_American_Allied_Military_Aid_desc: "Construire une armée moderne est une entreprise coûteuse. Pour accélérer le processus, nous accepterons formellement l'offre d'aide militaire des États-Unis, qui nous fournira des équipements modernes, une formation et un soutien logistique, rapprochant ainsi notre nouvelle armée de nos alliés de l'OTAN."

 WGR_Franke_57_Bolster_Domestic_Military_Production_desc: "Nous ne pouvons pas compter sur des fournisseurs étrangers pour notre défense nationale. Les investissements et les contrats de l'État seront orientés vers les entreprises allemandes afin de renforcer notre production militaire nationale, des armes légères aux véhicules blindés, garantissant ainsi notre autosuffisance à long terme."

 WGR_Franke_57_Pass_Conscription_and_Soldiers_Acts_desc: "Une armée professionnelle nécessite une base juridique. Le Bundestag adoptera deux textes législatifs historiques : la loi sur la conscription, établissant le service militaire obligatoire, et la loi sur les soldats, définissant les droits et les responsabilités du « citoyen en uniforme »."

 WGR_Franke_57_Form_Bundeswehr_Staff_Academy_desc: "Une armée ne vaut que par ses officiers. Nous créerons la « Führungsakademie der Bundeswehr » à Hambourg, une académie de commandement et d'état-major dédiée à la formation d'une nouvelle génération de chefs militaires fondés sur les principes démocratiques."

 WGR_Franke_57_Absorb_Border_Guard_Units_desc: "La Bundeswehr étant désormais établie, le rôle paramilitaire de la Bundesgrenzschutz est redondant. Les unités et le personnel expérimentés des gardes-frontières seront formellement absorbés par l'armée, fournissant ainsi un apport précieux de main-d'oeuvre qualifiée."

 WGR_Franke_57_Continue_Wirtschaftswunder_desc: "Le miracle économique allemand fait l'envie du monde entier, et nous devons veiller à ce que le moteur de la prospérité continue de tourner à plein régime. La politique gouvernementale visera à maintenir une croissance élevée, un faible taux de chômage et à développer notre base industrielle."

 WGR_Franke_57_Build_Oil_Refineries_Bavaria_desc: "Pour alimenter nos industries et réduire notre dépendance à l'égard des produits raffinés étrangers, nous orienterons les investissements de l'État vers la construction de nouvelles raffineries de pétrole dans les centres industriels de Bavière, garantissant ainsi une partie vitale de notre chaîne d'approvisionnement énergétique."

 WGR_Franke_57_Construct_Airports_Frankfurt_Hamburg_desc: "Alors que l'Allemagne devient une plaque tournante du commerce mondial, notre infrastructure aérienne doit suivre le rythme. De grands projets seront lancés pour construire de nouvelles installations aéroportuaires modernes dans les villes clés de Hambourg et Francfort, consolidant ainsi leur statut de portes d'entrée internationales."

 WGR_Franke_57_Expand_Coal_Production_Ruhr_desc: "Le charbon reste le fondement de notre industrie lourde. Nous investirons dans de nouvelles technologies minières et subventionnerons les opérations dans la vallée de la Ruhr pour accroître la production de charbon, garantissant ainsi que nos aciéries et nos centrales électriques disposent du combustible dont elles ont besoin."

 WGR_Franke_57_Expand_Rail_Network_North_South_desc: "Pour mieux intégrer notre économie nationale, nous devons améliorer notre logistique interne. Un projet d'infrastructure majeur se concentrera sur l'expansion et la modernisation des principales artères ferroviaires reliant les ports du nord aux coeurs industriels du sud."

 WGR_Franke_57_Found_Leifheit_and_Meister_Verbrauchermarkt_desc: "Le miracle économique ne concerne pas seulement l'industrie lourde ; il s'agit d'améliorer la vie quotidienne. Nous soutiendrons la création d'entreprises de biens de consommation innovantes comme Leifheit et de nouveaux modèles de vente au détail comme le Meister Verbrauchermarkt, symboles de notre nouvelle prospérité de consommateur."
 
 WGR_Franke_57_Proclaim_Renewed_Germany_desc: "Une décennie de reconstruction est terminée. L'Allemagne est souveraine, prospère et sûre. Dans un discours important, la chancelière proclamera la naissance d'une Allemagne renouvelée, prête à devenir un leader en Europe et un partenaire fidèle du monde libre."

 WGR_Franke_57_Inaugurate_German_Nuclear_Program_desc: "À l'ère atomique, la souveraineté et la sécurité ultimes dépendent de la maîtrise de l'atome. Dans le plus grand secret, le gouvernement va inaugurer un programme nucléaire allemand, officiellement à des fins énergétiques civiles, mais avec tout le potentiel de double usage que cela implique."

 WGR_Franke_57_Begin_Limited_Nuclear_Weapons_Program_desc: "La défense de l'Allemagne ne peut être confiée uniquement à d'autres. Une directive top-secrète a été publiée pour lancer un programme d'armes nucléaires limité, visant à développer une dissuasion intérieure modeste mais crédible pour garantir notre survie nationale."

 WGR_Franke_57_Request_Atoms_for_Peace_Funding_desc: "Nous demanderons officiellement à participer au programme « Atoms for Peace » du président Eisenhower. Le financement et l'assistance technique américains à notre programme nucléaire civil fourniront une couverture parfaite et une expertise précieuse à nos ambitions plus sensibles."

 WGR_Franke_57_Host_American_Weapons_Experts_desc: "Dans le cadre de notre programme énergétique civil, nous inviterons des experts de la Commission américaine de l'énergie atomique en Allemagne. Leurs connaissances et leurs connaissances en matière de technologie des réacteurs et de physique nucléaire seront d'une valeur inestimable pour nos propres scientifiques."

 WGR_Franke_57_Adopt_French_Nuclear_Doctrine_desc: "Notre force de dissuasion doit être crédible et indépendante. Nous adopterons une doctrine nucléaire similaire à la « force de frappe » française, basée sur le principe selon lequel même un arsenal nucléaire limité suffit à dissuader une attaque d'une superpuissance beaucoup plus grande."

 WGR_Franke_57_Order_Nationwide_Nuclear_Drill_desc: "Si nous voulons vivre à l'ère atomique, notre population doit être préparée. Nous ordonnerons le premier exercice de sécurité nucléaire à l'échelle nationale, testant nos systèmes d'alerte précoce et la préparation de la défense civile à un éventuel échange nucléaire."

 WGR_Franke_57_Build_Research_Reactors_Major_Cities_desc: "Pour faire progresser notre expertise nucléaire, de petits réacteurs de recherche seront construits dans les universités de plusieurs grandes villes allemandes. Ces installations formeront une nouvelle génération de physiciens et d'ingénieurs nucléaires, constituant ainsi l'épine dorsale de notre programme."

 WGR_Franke_57_Expand_THW_Civil_Defense_desc: "À l'ère des menaces atomiques, la protection civile est primordiale. Le Technisches Hilfswerk (THW) sera massivement élargi et financé, et sera chargé d'élaborer des plans nationaux de secours en cas de catastrophe, de décontamination et de reconstruction d'urgence."

 WGR_Franke_57_Speak_to_World_on_Nuclear_Germany_desc: "Des rumeurs sur nos ambitions nucléaires ont commencé à circuler, suscitant l'inquiétude de nos alliés et l'indignation de Moscou. Le Chancelier doit adresser au monde un discours soigneusement formulé, rassurant nos amis sur nos intentions pacifiques tout en affirmant notre droit à la légitime défense."

 WGR_Franke_57_Debate_the_NATO_Question_desc: "Notre souveraineté étant restaurée et la Bundeswehr établie, le moment est venu de définir notre relation formelle avec l'Organisation du Traité de l'Atlantique Nord. Le Bundestag débattra de l'opportunité de rester partenaire ou de devenir membre à part entière de l'alliance."

 WGR_Franke_57_Limited_Membership_desc: "Nous chercherons à obtenir une adhésion limitée à l'OTAN, contribuant ainsi à l'alliance politique tout en gardant la Bundeswehr en dehors du commandement militaire intégré. Cela préserve notre autonomie militaire tout en nous engageant dans la défense collective de l'Occident."

 WGR_Franke_57_Allow_Full_Membership_desc: "Il n'y a pas de sécurité pour l'Allemagne en dehors d'un engagement total envers l'alliance. Nous chercherons à devenir membre à part entière de l'OTAN, en intégrant la Bundeswehr dans sa structure de commandement et en nous engageant pleinement dans la défense de l'Europe occidentale."

 WGR_Franke_57_Allow_Limited_Allied_Forces_desc: "L'ère de l'occupation est révolue, mais la présence des forces alliées reste une garantie de sécurité. Nous renégocierons les accords sur le statut des forces, en invitant formellement nos alliés à stationner un nombre limité de troupes sur le sol allemand en tant que partenaires et non en tant qu'occupants."

 WGR_Franke_57_Maintain_Security_Agreements_desc: "Une intégration complète à l'OTAN compromettrait notre souveraineté. Au lieu de cela, nous nous appuierons sur les accords de sécurité bilatéraux déjà conclus avec les États-Unis, le Royaume-Uni et la France, pour maintenir un partenariat étroit sans abandonner le commandement de nos forces."

 WGR_Franke_57_Enter_NATO_Command_Structure_desc: "Si nous voulons être membre à part entière, nous devons être pleinement intégrés. Des officiers allemands occuperont des postes au sein du SHAPE et d'autres structures de commandement de l'OTAN, ce qui nous donnera une voix dans la planification stratégique de l'alliance et garantira que nos forces opèrent de manière transparente avec nos alliés."

 WGR_Franke_57_Construct_Infrastructure_and_Defenses_desc: "En tant qu'État de première ligne dans la guerre froide, notre territoire doit être défendable. En coordination avec l'OTAN, nous entreprendrons un programme de construction massif visant à construire des bases aériennes renforcées, des fortifications défensives et des infrastructures logistiques pour soutenir les opérations alliées."

 WGR_Franke_57_Proclaim_Germany_as_Part_of_Europe_desc: "Notre destin est inextricablement lié à celui de nos voisins. Dans un acte final et symbolique, notre gouvernement proclamera officiellement que la République fédérale est, aujourd'hui et pour toujours, un membre fondateur et engagé de la communauté européenne."
 
