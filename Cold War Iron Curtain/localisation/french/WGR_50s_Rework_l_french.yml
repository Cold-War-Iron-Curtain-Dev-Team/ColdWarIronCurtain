 WGR_Gehlen_Junta_Bundeswehr_Expand_Bundeswehr_Development_desc: "Le moment est venu de se libérer des chaînes de l'après-guerre. Nous créerons officiellement la Bundeswehr, une nouvelle force armée dédiée à la défense de l'Allemagne de l'Ouest. Ce sera une armée moderne et professionnelle, prête à affronter les menaces d'une nouvelle ère et à garantir notre souveraineté."
 WGR_Gehlen_Junta_Bundeswehr_Merge_BGS_Into_Bundeswehr_desc: "Le Bundesgrenzschutz (Garde-frontières fédéral) a admirablement contribué à sécuriser nos frontières, mais une structure de commandement fragmentée constitue un handicap en ces temps incertains. En fusionnant le BGS dans la nouvelle Bundeswehr, nous unifierons nos éléments armés sous un commandement unique et efficace, garantissant ainsi une défense plus cohérente et plus réactive."
 WGR_Gehlen_Junta_Bundeswehr_Reinforce_Duty_to_Country_and_Duty_to_Serve_Ideals_desc: "La force d'un soldat ne vient pas seulement de son arme, mais aussi de ses convictions. Nous inculquerons un puissant sens du devoir et du patriotisme à nos nouvelles recrues. Ils comprendront qu'ils ne servent pas un gouvernement, mais le peuple allemand et les idéaux d'une nation libre et forte. Ce fondement idéologique sera le fondement du moral de la Bundeswehr."
 WGR_Gehlen_Junta_Bundeswehr_Nationalize_Heckler_and_Koch_desc: "La sécurité de la nation ne peut être laissée aux caprices de l'entreprise privée. Heckler & Koch représente le summum de l'ingénierie allemande en matière d'armes légères. En plaçant cette entreprise vitale sous le contrôle de l'État, nous veillerons à ce que la Bundeswehr soit équipée des armes les plus performantes, produites selon nos spécifications exactes et à l'abri de toute influence étrangère."
 WGR_Gehlen_Junta_Bundeswehr_Purchase_American_Pattons_and_HS30s_desc: "Pendant que notre industrie nationale se reconstruit, nous devons nous tourner vers nos alliés pour équiper notre corps blindé en plein essor. Les États-Unis peuvent nous fournir des chars Patton fiables, tandis que le HS-30 suisse servira de véhicule de combat d'infanterie performant. Cette injection immédiate de matériel moderne donnera à nos nouvelles divisions le mordant dont elles ont besoin."
 WGR_Gehlen_Junta_Bundeswehr_Expand_to_Mandatory_Conscription_desc: "Une armée professionnelle est un bon début, mais pour véritablement défendre nos frontières, nous avons besoin de chiffres. Nous introduirons un système de service militaire obligatoire. Chaque jeune homme valide sera appelé à servir son pays, créant ainsi un vaste bassin de réservistes qualifiés et favorisant une société où la défense nationale est une responsabilité partagée."
 WGR_Gehlen_Junta_Bundeswehr_Form_Bundeswehr_Command_and_Staff_Academy_desc: "Une armée ne vaut que par ses officiers. Afin de former une nouvelle génération de chefs militaires brillants, nous créerons une Académie de commandement et d'état-major dédiée. Ici, les meilleurs et les plus brillants étudieront les arts de la guerre, de la grande stratégie au commandement tactique, en veillant à ce que la Bundeswehr soit dirigée par des hommes visionnaires et compétents."
 WGR_Gehlen_Junta_Bundeswehr_Form_Wachtbataillon_and_Airborne_Bdes_desc: "Au-delà de la ligne de bataille principale, nous avons besoin d'unités spécialisées pour les missions critiques. Le Wachbataillon (Bataillon de la Garde) servira de force de cérémonie et de sécurité d'élite dans la capitale, symbole de notre nouveau prestige militaire. Simultanément, nous formerons des brigades aéroportées, ce qui nous donnera la capacité de projeter rapidement notre puissance derrière les lignes ennemies et de répondre aux crises avec une force décisive."
 WGR_Gehlen_Junta_Bundeswehr_Form_the_Bundesmarine_desc: "La longue et fière tradition navale de l'Allemagne doit renaître. Nous formerons officiellement la Bundesmarine, une nouvelle marine chargée de protéger nos côtes, de sécuriser nos voies maritimes et d'étendre notre influence dans la mer Baltique et la mer du Nord. C'est la première étape vers notre rétablissement en tant que puissance maritime."
 WGR_Gehlen_Junta_Bundeswehr_Empower_the_Kriegsmarinewerft_Wilhelmshaven_desc: "Une marine a besoin de navires, et nos navires doivent être construits dans des chantiers allemands. L'historique Kriegsmarinewerft à Wilhelmshaven sera revitalisé et agrandi. Avec un investissement de l'État et une directive claire, ce chantier naval redeviendra le coeur de nos efforts de construction navale, un phare de l'ingénierie allemande."
 WGR_Gehlen_Junta_Bundeswehr_Rebuild_Shipbuilding_Facilities_in_Kiel_desc: "Wilhelmshaven ne suffit pas. Pour répondre aux exigences d'une marine moderne, les installations de construction navale de Kiel doivent également retrouver leur gloire d'antan. En reconstruisant ces chantiers, nous augmenterons notre capacité de production et créerons un deuxième pôle majeur de la puissance navale dans la Baltique."
 WGR_Gehlen_Junta_Bundeswehr_Purchase_Corvettes_and_Destroyers_desc: "Pendant que nos chantiers navals se mettent à niveau, notre nouvelle Bundesmarine a besoin de navires maintenant. Nous chercherons à nous procurer des corvettes et des destroyers modernes auprès des pays alliés. Cela nous fournira immédiatement une flotte de surface capable de patrouiller nos eaux et de former notre première génération de marins."
 WGR_Gehlen_Junta_Bundeswehr_Form_Luftwaffe_desc: "Le ciel au-dessus de l'Allemagne doit être défendu par les Allemands. Nous rétablirons officiellement la Luftwaffe, une force aérienne moderne équipée pour défendre notre espace aérien et soutenir nos forces terrestres. Cette nouvelle arme aérienne sera construite sur des principes de supériorité technologique et une formation rigoureuse des pilotes."
 WGR_Gehlen_Junta_Bundeswehr_Receive_US_F84_Thunderstreaks_desc: "Pour donner à notre nouvelle Luftwaffe une longueur d'avance, nous nous tournerons vers nos alliés américains. Le F-84 Thunderstreak est un chasseur-bombardier à réaction performant qui constituera l'épine dorsale de nos premiers escadrons. Ce transfert de technologie permettra à nos pilotes de s'entraîner sur des équipements modernes et d'établir immédiatement une défense aérienne crédible."
 WGR_Gehlen_Junta_Bundeswehr_Form_Air_Defense_Groups_desc: "Une force aérienne forte a besoin d'un solide réseau de défense aérienne au sol. Nous établirons des groupes de défense aérienne dédiés, équipés de radars et d'artillerie anti-aérienne. Ce système intégré garantira qu'aucun avion hostile ne pourra menacer nos villes ou nos installations militaires sans être contesté."
 WGR_Gehlen_Junta_Bundeswehr_Build_Bases_in_Buchel_and_Neuburg_desc: "Une force aérienne n'est rien sans ses bases. Nous construirons de nouvelles bases aériennes majeures à Büchel et Neuburg, stratégiquement situées pour assurer une couverture optimale de notre espace aérien. Ces installations modernes abriteront nos escadrons et serviront de centres névralgiques pour nos opérations de défense aérienne."
 
 WGR_Junta_Gehlen_National_Holiday_Question_desc: "La restauration et la mise en valeur des fêtes nationales allemandes traditionnelles devraient être un facteur clé de notre politique culturelle, célébrant les personnages, les événements et les jalons culturels qui favorisent la fierté de notre héritage, en évitant soigneusement ceux qui sont entachés par notre passé récent. Mais quelle fête devrait atteindre le sommet et être notre nouvelle fête nationale ?"
 WGR_Junta_Gehlen_Reinterpret_National_Symbolic_desc: "Les projets de travaux publics à grande échelle, comme de nouvelles autoroutes, ponts ou monuments nationaux, peuvent remplir un double objectif : stimuler l'économie et créer des symboles visibles du progrès et des réalisations nationales."
 WGR_Junta_Gehlen_Condemm_Allied_Terror_Bombings_desc: "La plus grande terreur et la plus grande destruction à laquelle ce pays ait été confronté depuis la guerre de 30 ans ont été causées par les raids terroristes injustes et destructeurs contre les villes allemandes par les Alliés occidentaux à la fin de la guerre. Même lorsque la guerre était déjà considérée comme gagnée par les Alliés, les raids terroristes contre les villages et les villes allemands ne se sont pas arrêtés, ciblant des monuments culturels et des cibles civiles pour provoquer autant de pertes et de destructions que possible. Ce fut certainement la plus grande tragédie de l'histoire allemande, qui ne se reproduira jamais."
 WGR_Junta_Gehlen_Support_Jewish_Cultural_Revival_desc: "Un petit pas symbolique vers la réconciliation. Financer des initiatives visant à soutenir la reconstruction des communautés juives et des institutions culturelles en Allemagne, démontrant ainsi un engagement en faveur de la tolérance et de la diversité."
 WGR_Junta_Gehlen_The_Reconstruction_Issue_desc: "Une grande partie de la tradition et de la culture impressionnante a été perdue lors des injustes raids aériens alliés. Compte tenu de nos problèmes financiers, nous devrions adopter une approche plus sûre, en reconstruisant les hôpitaux, les bureaux administratifs, les écoles et les immeubles d'habitation à des conditions minimalistes pour des raisons pratiques. Cela se ferait cependant au détriment de la belle architecture qui constitue une attraction majeure non seulement pour les touristes mais aussi pour les Allemands eux-mêmes. L'impressionnante architecture de l'ère du financement domine les grandes villes depuis des décennies. Sans eux, notre identité nationale se transformerait en une ombre dystopique, infectée par le Bauhaus."
 WGR_Junta_Gehlen_Support_for_Vertriebene_desc: "La perte des territoires allemands à l'est de la ligne fluviale Oder-Neisse a été une catastrophe nationale. Des millions d'Allemands ont été déportés, persécutés et contraints d'abandonner leurs foyers construits par des générations allemandes pendant des centaines d'années. Le moins que nous puissions faire est de leur donner l'opportunité de se réorganiser en société où ils pourront pratiquer leurs normes et traditions culturelles locales. L'identité régionale ne devrait jamais disparaître."
 WGR_Junta_Gehlen_Open_the_Stauffenberg_Memorial_desc: "En l'honneur des courageux Allemands qui ont risqué leur vie pour renverser le régime national-socialiste, un nouveau mémorial à Berlin Plötzensee, lieu de leur exécution, sera érigé et montrera que le courage du cercle de Stauffenberg montre clairement que tout le monde en Allemagne n'a pas soutenu fanatiquement Hitler et le NSDAP."
 WGR_Junta_Gehlen_Ovecomplicate_Bureaucratic_Access_to_Archives_desc: "La bureaucratie allemande est connue pour la lenteur de ses processus et ses dizaines d'exigences pour accéder à certains documents. Puisque nous souhaitons que seuls des historiens et des chercheurs agréés aient accès à nos fichiers, nous rendrons le processus aussi fastidieux et angoissant que possible pour les autres nez suspects qui aiment utiliser nos fichiers contre nous."
 WGR_Junta_Gehlen_Abolish_Allied_Control_Initiative_34_desc: "En dissolvant formellement la Wehrmacht avec l'article 34 du Conseil de contrôle allié, cela a également détruit tout espoir de compensation et de pension pour les soldats servant au sein de la Wehrmacht. Cette grande méfiance et cette grande résistance peuvent être utilisées pour mobiliser les masses des anciens soldats de la Wehrmacht en faveur de gains politiques. Nous leur promettons des pensions réglementées par la loi fédérale et nous en profiterons comme d'un léger geste pour dénoncer l'occupation alliée."
 WGR_Junta_Gehlen_Reintegrate_former_NSDAP_Members_desc: "De nombreux individus étaient membres du NSDAP sans être de fervents idéologues, possédant de précieuses compétences administratives ou techniques. Nous autoriserons prudemment leur réintégration dans certains rôles non sensibles de la fonction publique afin de contribuer à la reconstruction nationale."
 WGR_Junta_Gehlen_Form_the_Vaterlandische_Front_desc: "Pour canaliser une participation politique légitime tout en maintenant le contrôle, nous encouragerons la formation d'un large « front » approuvé par l'État, composé d'organisations patriotiques et de partis non communistes. Cela fournira un espace supervisé pour l'expression politique."
 WGR_Junta_Gehlen_Confiscate_KPD_Assets_desc: "Le vaste réseau de biens, de fonds et de publications interdits du Parti communiste doit être saisi et réutilisé au profit de l'État. Ces ressources contribueront à nos efforts nationaux de redressement et de décommunisation."
 WGR_Junta_Gehlen_Rehabilitation_of_Moderate_Communists_desc: ""
 WGR_Junta_Gehlen_Bring_back_Constitutional_Court_desc: "Pour fournir un semblant d'ordre juridique et agir comme un contrôle du pouvoir exécutif - mais uniquement là où il est conforme à la sécurité nationale - la Cour constitutionnelle sera réactivée avec une autorité limitée et soigneusement définie."
 WGR_Junta_Gehlen_Empower_the_Chancellor_desc: "Dans tout futur cadre constitutionnel, le bureau du Chancelier et du Président fédéral doit être doté de pouvoirs exécutifs importants, garantissant l'unité nationale et un leadership décisif, plutôt que de succomber à la paralysie parlementaire."
 WGR_Junta_Gehlen_Civilian_Cabinet_desc: "Si le leadership militaire reste primordial, certains ministères peuvent bénéficier de technocrates civils expérimentés. La nomination de personnalités respectées et fidèles à des portefeuilles tels que la finance, l'économie et les infrastructures peut améliorer l'efficacité et la légitimité."
 WGR_Junta_Gehlen_Form_the_Provisional_National_Council_desc: "pour légitimer l'administration et impliquer des éléments au-delà du militaire, un Conseil national provisoire sera créé. Composé de technocrates fidèles, d'industriels et de personnalités conservatrices de confiance, il conseillera le gouvernement militaire et préparera le terrain pour les futures structures politiques."
 WGR_Junta_Gehlen_Establish_Internal_Security_District_desc: "La stabilité de l'État n'est pas négociable. Pour contrer les éléments subversifs et les infiltrations étrangères, nous établirons des districts de sécurité spéciaux dans les zones stratégiques. Sous le contrôle direct de nos services de renseignement, ces zones deviendront un bouclier impénétrable pour la sécurité intérieure de la république. Toute personne menaçant l'ordre sera identifiée, surveillée et neutralisée avant qu'elle ne puisse devenir un danger."

 WGR_Junta_Gehlen_Reopen_Hamburg_Stock_Exchange_desc: "La confiance dans l'économie allemande doit être rétablie le plus rapidement possible. La réouverture de la Bourse de Hambourg est un signal clair adressé au monde : l'Allemagne est à nouveau ouverte aux affaires. En réactivant les flux de capitaux et en garantissant la sécurité des investisseurs, nous posons les bases de la reconstruction et de la souveraineté économique de notre nation."

 WGR_Junta_Gehlen_Revive_the_Spirit_of_German_Engineering_desc: "Précision, durabilité et innovation : ces vertus ont fait la renommée mondiale de l'ingénierie allemande. Il est temps de raviver cet esprit. Grâce à un financement ciblé pour les universités techniques et l'industrie de l'armement, nous inspirerons une nouvelle génération d'ingénieurs à créer les merveilles technologiques qui mèneront notre industrie et notre armée au sommet du monde."

 WGR_Junta_Gehlen_Revert_Nationalization_Policies_desc: "Le contrôle de l'État s'est révélé inefficace et paralysant le dynamisme industriel. Nous annulerons ces nationalisations malavisées. L'initiative privée et la concurrence du marché libre sont les moteurs de la prospérité. Les industries clés de notre pays seront restituées entre les mains de ceux qui savent les rendre rentables et puissantes."

 WGR_Junta_Gehlen_Rationalize_agriculture_production_desc: "Une nation forte a besoin d'un approvisionnement alimentaire sûr. Les méthodes dépassées de notre agriculture constituent une menace pour notre autosuffisance. En promouvant la mécanisation, en optimisant les surfaces cultivées et en introduisant des techniques de gestion modernes, nous rationaliserons la production agricole. Chaque champ apportera son rendement maximum au peuple allemand."

 WGR_Junta_Gehlen_Bundesbahn_Expansion_desc: "Les bouées de sauvetage de notre nation sont en acier. Un réseau ferroviaire moderne et étendu est crucial pour le transport rapide des troupes, l'approvisionnement de nos industries et la mobilité de nos citoyens. Nous lancerons un programme ambitieux visant à étendre la Bundesbahn afin de garantir que chaque recoin de l'Allemagne soit efficacement accessible - pour le commerce en temps de paix et la défense en temps de guerre."

 WGR_Junta_Gehlen_Promote_Volkswagen_desc: "La « Voiture du Peuple » est bien plus qu'un simple moyen de transport ; c'est un symbole de prospérité naissante et de qualité allemande. Nous allons massivement promouvoir la production chez Volkswagen pour stimuler les exportations et offrir aux citoyens allemands une mobilité abordable. Chaque Coccinelle vendue à l'étranger est une victoire pour notre économie."

 WGR_Junta_Gehlen_Reverse_Dismantling_of_IG_Farben_and_Reichswerke_Hermann_Goering_desc: "Le démantèlement forcé par les Alliés de nos plus grands conglomérats industriels a été un coup délibérément porté à notre potentiel économique. Pour des raisons de nécessité nationale, nous inverserons ce processus. La puissance et l'expertise combinées de géants comme IG Farben et Reichswerke sont indispensables pour une reconstruction rapide et globale."

 WGR_Junta_Gehlen_Speed_Up_Reconstruction_desc: "Les ruines du passé nous rappellent constamment notre défaite. Nous ne vivrons plus dans les décombres et les cendres. Un tour de force national accélérera la reconstruction. Grâce à la discipline et au travail acharné des Allemands, nous rendrons nos villes plus belles et nos usines plus modernes que jamais."

 WGR_Junta_Gehlen_Increase_University_Funding_desc: "Les guerres du futur se décideront non seulement sur le champ de bataille mais aussi dans les laboratoires et les amphithéâtres. Nous augmenterons considérablement le financement de nos universités afin d'assurer la formation d'une nouvelle élite de scientifiques, d'ingénieurs et de fonctionnaires fidèles au nouvel ordre et qui conduiront l'Allemagne à l'avant-garde du progrès technologique."

 WGR_Junta_Gehlen_Attract_Foreign_Capital_desc: "Notre reconstruction nécessite plus de capitaux que ce que nous pouvons actuellement réunir nous-mêmes. En créant un climat d'investissement extrêmement attractif, caractérisé par la stabilité, une fiscalité faible et une sécurité juridique, nous attirerons les capitaux étrangers. Chaque dollar et chaque franc investis dans notre industrie constituent un élément supplémentaire d'une Allemagne forte."

 WGR_Junta_Gehlen_Modernize_Industrial_Infrastructure_desc: "Des machines obsolètes et des processus de production inefficaces freinent notre potentiel. Nous devons moderniser notre infrastructure industrielle de fond en comble. Les investissements dans de nouvelles centrales électriques, des réseaux de communication améliorés et des installations de fabrication de pointe augmenteront la productivité et jetteront les bases de notre puissance économique et militaire."

 WGR_Junta_Gehlen_Bundesbank_desc: "Une monnaie stable est le fondement d'un État stable. Nous créerons une nouvelle Banque fédérale indépendante dont la seule tâche sera de lutter contre l'inflation et de garantir la valeur du mark. Plus jamais l'hyperinflation ne détruira la richesse de notre peuple et ne déstabilisera l'ordre politique."

 WGR_Junta_Gehlen_Prepare_For_Border_Skirmishes_desc: "La menace venant de l'Est est réelle et omniprésente. Nous ne pouvons pas nous permettre de ne pas être préparés aux provocations. Des unités spécialement entraînées et équipées des gardes-frontières fédéraux seront créées pour réagir rapidement et de manière décisive aux violations des frontières sans risquer une guerre ouverte. Nos frontières seront tenues."

 WGR_Junta_Gehlen_Appoint_New_Bundespraesident_desc: "Le temps des politiciens faibles et compromis est révolu. Le chef de l'État doit être une figure qui incarne l'autorité, l'unité nationale et la loyauté inconditionnelle à notre cause. Nous nommerons un nouveau président fédéral qui servira de symbole du nouvel ordre et restaurera la confiance du peuple dans le leadership."

 WGR_Junta_Gehlen_Launch_Investigation_of_University_Personel_desc: "La liberté d'enseignement ne doit pas devenir la liberté de trahison. Nos universités sont un terrain fertile pour les idées marxistes et libérales qui rongent le moral de notre jeunesse. Nous lancerons une enquête approfondie sur tout le personnel universitaire. Quiconque n'est pas fidèle à l'État et à ses valeurs sera écarté du service de notre avenir."

 WGR_Junta_Gehlen_Military_Cabinet_desc: "En ces temps décisifs, le sort de la nation ne peut pas dépendre des débats parlementaires. Le gouvernement sera transformé en un cabinet militaire, composé d'officiers compétents, d'experts en renseignement et de technocrates loyaux. L'efficacité, des chaînes de commandement claires et une action décisive définiront désormais notre politique."

 
 
 WGR_Junta_Gehlen_Absorb_Regional_Police_Forces_into_Bundespolizei_desc: "La nature fragmentée des forces de police régionales héritées de l'occupation rend difficile l'unification des efforts de sécurité. Nous devons intégrer ces forces sous une structure de commandement centrale, garantissant une application cohérente de l'autorité de l'État."
 WGR_Junta_Gehlen_Expand_Domestic_Surveillance_desc: "La menace de subversion communiste demeure, même après l'interdiction du KPD. Pour sauvegarder la nation, le BND doit étendre sa portée à tous les aspects de la vie intérieure, en identifiant et en neutralisant toutes les poches persistantes de dissidence ou d'agents hostiles."

 WGR_Junta_Gehlen_Establish_Joint_Allied_German_Investigation_Board_desc: "Travailler avec les Alliés pour capturer Reimann et écraser la Résistance communiste restante montrera non seulement à notre peuple notre engagement en faveur de la sécurité nationale, mais aussi notre légitimité envers les Alliés en ce qui concerne l'intégration occidentale."
 
 WGR_Junta_Gehlen_an_End_to_Occupation_desc: "Les traités établissant la souveraineté allemande et son intégration dans l'Union de l'Europe occidentale et l'OTAN sont cruciaux. Entamer rapidement des négociations avec l'Occident enverra un message clair à nos alliés : l'Allemagne est un partenaire fiable, engagé dans la défense collective et la coopération multilatérale. Même s'il existe encore un grand sentiment de méfiance, il est certainement possible de le reconstruire."
 
 WGR_Junta_Gehlen_Continue_Trade_with_Eastern_Block_desc: "Nous ne pouvons pas permettre que notre reprise prospère soit stoppée par un fondamentalisme dogmatique. Même si nous ne nous alignons pas politiquement sur l'Union soviétique et ses partenaires, nous ne pouvons pas couper cette ligne vitale de biens et de services de notre économie."
 
 WGR_Junta_Gehlen_Enter_COCOM_desc: "Pour empêcher que des marchandises stratégiques n'atteignent le bloc de l'Est, nous devons strictement aligner nos politiques d'exportation sur celles du Comité de coordination des contrôles multilatéraux des exportations (COCOM). Cela montrera notre engagement inébranlable en faveur de l'endiguement économique du communisme, même si cela implique des sacrifices économiques à court terme."
 
 WGR_Junta_Gehlen_Join_the_ECSC_Treaty_desc: "La participation à la CECA n'est pas seulement une aubaine économique ; c'est une déclaration politique de réconciliation et d'intégration. En devenant un membre leader et en partageant notre production industrielle de manière transparente, nous consolidons notre place dans une Europe pacifique et unie."
 
 WGR_Junta_Gehlen_Generaloberst_Reinhard_Gehlen_desc: "Tandis que le traître Reimann négociait la reddition de notre nation à Berlin-Est, les patriotes agissaient. Un coup d'État rapide et décisif mené par d'anciens officiers de la Wehrmacht et anticommunistes a sécurisé l'État. Parmi eux, ils ont choisi un homme pour sortir l'Allemagne de cette crise : le Generaloberst Reinhard Gehlen. Cerveau du renseignement et fervent anticommuniste, Gehlen est la main de fer dont l'Allemagne a besoin pour la sortir du gouffre."

 WGR_Junta_Gehlen_Make_a_Speech_to_the_Nation_desc: "Les gens sont confus et effrayés. Gehlen s'adressera à la nation pour calmer ses craintes et renforcer sa détermination. Son message sera clair : le gouvernement n'a pas été renversé, il a été excisé comme un cancer. Le complot du KPD visant à vendre l'Allemagne aux Soviétiques a été déjoué. L'ordre sera rétabli. L'Allemagne sera à nouveau forte. L'ère de la trahison est révolue ; l'ère de la restauration nationale a commencé."

 WGR_Junta_Gehlen_Abandon_Grundgesetz_desc: "La « Loi fondamentale » qui nous a été imposée après la guerre s'est révélée être un échec. Ses faiblesses libérales ont été exploitées par les communistes pour prendre le pouvoir par des moyens légaux. Une constitution qui autorise la destruction légale de la nation n'est pas une constitution qui mérite d'être sauvée. Nous le suspendrons indéfiniment et gouvernerons par décret jusqu'à ce qu'un nouveau cadre plus solide puisse être établi."

 WGR_Junta_Gehlen_Prepare_Economic_Report_of_Nation_desc: "Les communistes ont mis la main sur les leviers de notre économie. Nous devons maintenant procéder à un audit approfondi pour comprendre toute l'étendue des dégâts. Un rapport complet détaillera les effets de leurs politiques de nationalisation et de planification centrale, nous fournissant une image claire de ce qui doit être défait."

 WGR_Junta_Gehlen_Release_Consumer_Goods_Industry_from_Nationalization_desc: "L'État n'a pas vocation à gérer des boulangeries et des usines de chaussures. Nous lancerons immédiatement le processus de privatisation des industries de biens de consommation saisies par le gouvernement Reimann. Le retour de ces entreprises entre des mains privées stimulera la concurrence, améliorera la qualité et montrera au monde que l'Allemagne est à nouveau ouverte aux affaires."

 WGR_Junta_Gehlen_Pack_Coal_Steel_Industry_with_State_Directors_desc: "Même si les industries de consommation peuvent être libérées, le coeur stratégique de notre pays - le charbon et l'acier - doit rester sous une direction ferme. Nous éliminerons les idéologues communistes et les remplacerons par des directeurs loyaux nommés par l'État. Ces industries ne serviront pas seulement le profit, mais aussi les intérêts stratégiques de l'État allemand."

 WGR_Junta_Gehlen_Ask_For_Marshall_Plan_Aid_desc: "Reimann a bêtement rejeté l'aide américaine, la qualifiant d'« impérialisme du dollar ». Nous corrigerons cette erreur historique. En demandant formellement à adhérer au Plan Marshall, nous obtiendrons non seulement les fonds nécessaires à notre reconstruction mais enverrons également un signal clair à l'Occident : l'Allemagne est de retour au bercail."

 WGR_Junta_Gehlen_End_Coal_Exports_To_France_and_DDR_desc: "Sous Reimann, notre charbon alimentait les industries de nos ennemis idéologiques et de nos voisins peu fiables. Pas plus. Nous cesserons toutes les exportations de charbon vers la République démocratique allemande et vers la France. Nos ressources seront utilisées avant tout pour notre propre redressement."

 WGR_Junta_Gehlen_Ban_Unions_and_Striking_desc: "Les syndicats sont devenus des foyers d'agitation communiste, utilisant les grèves pour saboter notre économie nationale. Pendant toute la durée de cette urgence nationale, tous les syndicats seront interdits et le fait de faire grève sera considéré comme un acte de subversion contre l'État. La nation doit travailler comme une seule."

 WGR_Junta_Gehlen_Pursue_Limited_Free_Market_Ideals_desc: "Notre vision économique est faite de pragmatisme et de force. Nous favoriserons un système de marchés libres limités, en encourageant l'entreprise privée là où elle est efficace. Cependant, cela sera contrebalancé par une structure corporatiste, garantissant que toute activité économique soit finalement alignée sur l'intérêt national tel que défini par l'État."

 WGR_Junta_Gehlen_Program_of_Stability_and_Decommunization_desc: "L'infection communiste est profonde. Nous devons maintenant nous lancer dans un programme approfondi de décommunisation pour nettoyer notre gouvernement, nos écoles et notre culture de toute influence marxiste. Il s'agira d'une opération chirurgicale douloureuse mais nécessaire pour assurer la stabilité et la santé à long terme de la nation."

 WGR_Junta_Gehlen_Form_BND_From_Gehlen_Org_desc: "Pendant des années, l'Organisation Gehlen a été notre bouclier fantôme, rassemblant des renseignements sur la menace soviétique. Il est temps de le sortir de l'ombre. Nous créerons officiellement le Bundesnachrichtendienst (BND) à partir du noyau de l'Organisation Gehlen, créant ainsi une agence de renseignement de classe mondiale qui nous servira d'yeux et d'oreilles pendant la guerre froide."

 WGR_Junta_Gehlen_Ban_the_KPD_desc: "Le Kommunistische Partei Deutschlands n'est pas un parti politique ; c'est une conspiration, une cinquième colonne pour une puissance étrangère hostile. Nous interdirons formellement le KPD, saisirons ses avoirs et arrêterons ses dirigeants. Leur drapeau ne flottera plus jamais sur le sol allemand."

 WGR_Junta_Gehlen_Begin_Show_Trials_of_Communist_Sympathizers_desc: "Le peuple allemand doit comprendre que la collaboration avec l'ennemi a des conséquences. Nous organiserons des procès publics pour des sympathisants, des responsables et des agitateurs communistes de premier plan. Leur trahison sera mise à nu aux yeux de tous, servant d'avertissement sévère à tous ceux qui seraient encore loyaux envers Moscou."

 WGR_Junta_Gehlen_Condemn_Anti_Semitism_desc: "Pour distinguer notre nouveau nationalisme des erreurs du passé, nous devons être sans équivoque. Notre gouvernement condamne officiellement toute forme d'antisémitisme. La persécution des Juifs a été une tache sombre dans notre histoire, et nous veillerons à ce qu'une telle haine raciale n'ait pas sa place dans la nouvelle Allemagne que nous construisons."

 WGR_Junta_Gehlen_Try_Reimann_for_Treason_desc: "Max Reimann est toujours en liberté à Berlin-Est, une marionnette des Soviétiques. Nous le jugerons par contumace pour le crime le plus grave : la haute trahison. Un tribunal militaire examinera les preuves de son complot visant à dissoudre la République fédérale et le condamnera en conséquence. Son nom deviendra synonyme de trahison."

 WGR_Junta_Gehlen_Limit_Bundestag_Powers_desc: "Même s'il ralentit parfois l'État et permet aux communistes de se soulever, le Bundestag est l'institution la plus importante qui met fin aux abus de pouvoir. Nous ne restreindrons pas ses pouvoirs, laissant le leadership décisif entre les mains des mandataires élus."

 WGR_Junta_Gehlen_Defend_Ourselves_In_UN_desc: "L'Union soviétique et ses sympathisants condamneront sans aucun doute nos actions sur la scène mondiale. Nos diplomates doivent être prêts à défendre le coup d'État devant l'Assemblée générale des Nations Unies, en le présentant non pas comme un acte antidémocratique, mais comme une nécessaire défense de la civilisation occidentale en première ligne de la guerre froide."

 WGR_Junta_Gehlen_Ask_for_US_UK_Support_desc: "Nous ne pouvons pas rester seuls. Nous enverrons des envoyés à Washington et à Londres pour solliciter formellement leur soutien politique et matériel. Nous devons les convaincre que notre gouvernement, bien que ferme, est le seul rempart fiable contre une prise de contrôle totale de l'Allemagne par les Soviétiques."

 WGR_Junta_Gehlen_Denounce_1953_Reunification_Agreement_desc: "Le soi-disant traité de réunification négocié par Reimann n'était pas un traité, mais un pacte de suicide. Nous dénoncerons officiellement et déclarerons nul et non avenu cet accord traître. Toute réunification de l'Allemagne se fera selon nos conditions, en position de force et non de capitulation."

 WGR_Junta_Gehlen_Stop_Diplomatic_Relations_with_Israel_desc: "Notre politique étrangère doit être ciblée et libre de tout enchevêtrement inutile. L'État naissant d'Israël et ses conflits régionaux détournent l'attention de la menace principale : le communisme soviétique. Nous suspendrons nos relations diplomatiques pour concentrer nos efforts sur le théâtre européen."

 WGR_Junta_Gehlen_Pursue_Commitment_to_NATO_desc: "La place qui revient à l'Allemagne est celle de pierre angulaire de l'Organisation du Traité de l'Atlantique Nord. Nous nous engagerons formellement à rejoindre l'alliance, en offrant notre position stratégique, notre puissance industrielle et notre potentiel militaire à la défense collective de l'Occident."

 WGR_Junta_Gehlen_Seek_Diplomatic_Relations_With_Spain_desc: "À Madrid, un autre gouvernement constitue un rempart contre le communisme. Rechercher des relations diplomatiques plus étroites avec l'Espagne de Franco est une étape logique. Nous partageons un ennemi commun et une compréhension commune de la nécessité d'une main forte pour guider la nation."

 WGR_Junta_Gehlen_Declare_Communism_as_Greatest_World_Threat_desc: "Qu'il n'y ait aucune ambiguïté. Notre gouvernement déclarera que le communisme international, dirigé depuis Moscou, constitue la plus grande menace pour l'Allemagne, pour l'Europe et pour le monde. Cette déclaration sera le principe directeur de notre politique étrangère et intérieure."

 WGR_Junta_Gehlen_Handling_Reimann_Affair_desc: "Le traître Reimann reste sous protection soviétique à Berlin-Est, symbole vivant de leur subversion. Nous devons résoudre cette situation pour fermer un chapitre de notre histoire et démontrer la portée de notre nouveau gouvernement."

 WGR_Junta_Gehlen_Ask_Soviet_Authorities_to_Extradite_Reimann_desc: "Nous commencerons par une demande diplomatique formelle. Une note sera envoyée aux autorités soviétiques, exigeant l'extradition immédiate de Max Reimann pour qu'il soit jugé pour haute trahison. Même si nous nous attendons à ce qu'ils refusent, le monde doit les considérer comme les refuges d'un criminel."

 WGR_Junta_Gehlen_Enter_Into_Discussions_with_Allied_Control_Council_desc: "Les Quatre Puissances détiennent toujours l'autorité à Berlin. Nous entamerons des discussions avec le Conseil de contrôle allié, présenterons nos arguments contre Reimann et ferons pression sur les Alliés occidentaux pour qu'ils utilisent leurs canaux pour assurer son retour. Cela mettra à l'épreuve leur engagement envers notre nouveau gouvernement."

 WGR_Junta_Gehlen_Organize_BND_CIA_Operation_desc: "La diplomatie risque d'échouer. Le BND, en coopération avec nos nouveaux amis de la CIA, commencera à planifier une opération secrète. Si les Soviétiques ne livrent pas Reimann, nous le prendrons."

 WGR_Junta_Gehlen_Augment_Allied_Forces_in_Berlin_desc: "Nos actions entraîneront inévitablement des tensions accrues à Berlin. Nous nous coordonnerons avec les Alliés occidentaux pour augmenter leurs garnisons dans la ville, en nous préparant à toute éventuelle réponse soviétique à notre consolidation de pouvoir."

 WGR_Junta_Gehlen_Step_Up_Counterinsurgency_Programs_in_Major_Cities_desc: "Les restes communistes tentent d'organiser la résistance dans nos centres industriels. Nous mettrons en oeuvre des programmes anti-insurrectionnels robustes, faisant appel aux renseignements, aux informateurs et à une action policière rapide pour démanteler ces cellules avant qu'elles ne deviennent une menace réelle."

 WGR_Junta_Gehlen_Begin_Anti_Communist_Propaganda_Campaign_desc: "La bataille pour l'Allemagne est aussi une bataille pour les coeurs et les esprits. Nous lancerons une campagne de propagande massive, utilisant des affiches, la radio et des films pour dénoncer la brutalité du communisme et renforcer la loyauté du peuple envers le nouveau gouvernement national."

 WGR_Junta_Gehlen_Turn_SPD_Members_Against_Communists_desc: "De nombreux membres du SPD étaient des alliés inquiets du KPD. Nous exploiterons cette division en offrant l'amnistie et même des postes gouvernementaux aux sociaux-démocrates qui dénoncent publiquement leurs anciens partenaires de coalition communiste et promettent leur loyauté envers l'État."

 WGR_Junta_Gehlen_Handling_Past_and_Present_of_Nazism_desc: "Pour construire une nouvelle identité nationale, nous devons soigneusement naviguer dans l'héritage du passé récent. Notre approche doit être pragmatique, condamnant ce qui est nécessaire à l'acceptation internationale tout en sauvant ce qui est utile à l'unité nationale."

 WGR_Junta_Gehlen_Increase_Counterinsurgency_Operations_desc: "Les rapports des services de renseignement suggèrent que la clandestinité communiste est plus organisée qu'on ne le pensait auparavant. Nous devons intensifier nos opérations anti-insurrectionnelles, en accordant aux forces de sécurité une plus grande latitude pour mener des raids, des arrestations et des interrogatoires afin de déraciner complètement le réseau."

 WGR_Junta_Gehlen_Deploy_Bundeswehr_Troops_desc: "La police seule ne suffit pas à garantir l'ordre. Nous déploierons des unités de la Bundeswehr nouvellement formée en garnison dans les grandes villes et les zones industrielles, en faisant preuve d'une forte présence militaire pour dissuader toute idée de rébellion ouverte."

 WGR_Junta_Gehlen_Request_CIA_MI6_Assistance_desc: "La clandestinité communiste reçoit du soutien et des directives de l'étranger. Nous demanderons l'assistance technique et consultative de la CIA américaine et du MI6 britannique. Leur expérience dans la lutte contre la subversion communiste mondiale sera inestimable."

 WGR_Junta_Gehlen_Crush_the_RAF_desc: "Les cellules organisées de terroristes et de saboteurs communistes menacent la stabilité de l'État. Nous lancerons une campagne finale et décisive pour écraser ces organisations clandestines. Il n'y aura aucune pitié pour ceux qui prendront les armes contre l'Allemagne."

 WGR_Junta_Gehlen_Reinforce_Nationalist_Ideals_desc: "Le communisme a cherché à effacer notre identité nationale avec un internationalisme fade. Nous y remédierons en renforçant les idéaux nationalistes dans les écoles et la vie publique. La fierté de l'histoire, de la culture et des réalisations allemandes sera le fondement de notre nouvelle société."

 WGR_Junta_Gehlen_Pan_German_Framework_desc: "Nous devons promouvoir un cadre culturel qui met l'accent sur l'unité du peuple allemand, où qu'il vive. Cet idéal pangermaniste servira de contrepoids culturel à la division artificielle de notre nation et de phare pour les Allemands vivant sous l'oppression communiste."

 WGR_Junta_Gehlen_Whitewash_Nazi_Officials_in_History_desc: "L'histoire doit servir le présent. Tandis que les excès des dirigeants du parti nazi seront condamnés, les rôles de nombreux officiers militaires et représentants de l'État seront réévalués dans nos programmes d'histoire. Leur expertise et leur service à l'État seront privilégiés par rapport à leurs affiliations politiques."

 WGR_Junta_Gehlen_Augment_Schnez_Truppe_Force_desc: "Le « Schnez-Truppe » clandestin, un réseau d'anciens combattants de la Wehrmacht se préparant à une éventuelle invasion soviétique, a prouvé sa loyauté. Nous augmenterons secrètement cette force, en lui fournissant du matériel et en la reconnaissant comme une armée en attente."

 WGR_Junta_Gehlen_Condemn_the_Holocaust_desc: "Pour que le monde accepte la nouvelle Allemagne, nous devons condamner sans ambiguïté le plus grand crime de l'ancienne. Une déclaration officielle de l'État condamnerait l'Holocauste comme une atrocité contre l'humanité. C'est une ligne morale qui ne peut être franchie."

 WGR_Junta_Gehlen_Sweep_Remaining_Truths_Away_desc: "De nouvelles enquêtes publiques sur le passé ne servent qu'à nous diviser et à nous affaiblir alors que nous devons nous unir contre le communisme. Nous clôturerons discrètement les enquêtes, classifierons les documents et encouragerons la nation à « regarder en avant, pas en arrière ». Il vaut mieux laisser certaines vérités enfouies."

 WGR_Junta_Gehlen_Respond_to_World_Events_desc: "Le monde ne reste pas immobile. En tant qu'acteur clé de la guerre froide, notre ministère des Affaires étrangères doit être prêt à réagir aux crises internationales de manière rapide et décisive, toujours en gardant à l'esprit l'intérêt national de l'Allemagne."

 WGR_Junta_Gehlen_Condemn_Soviet_Actions_in_Hungary_desc: "La répression brutale du soulèvement hongrois par les Soviétiques est un cadeau pour nos propagandistes. Nous condamnerons avec véhémence les actions de l'URSS, en utilisant les événements de Budapest pour montrer au peuple allemand le vrai visage de l'idéologie qui a failli le consumer."

 WGR_Junta_Gehlen_Offer_Asylum_to_Fleeing_Anti_Communists_desc: "Nous ouvrirons nos frontières aux réfugiés fuyant l'oppression communiste, en particulier ceux du soulèvement hongrois. Leur offrir l'asile sera non seulement un geste humanitaire mais aussi une puissante victoire de propagande, décrivant l'Allemagne comme un havre de liberté."

 WGR_Junta_Gehlen_Crack_Down_on_Communist_Underground_desc: "Inspirés par les événements de Hongrie, les restes du KPD pourraient tenter de susciter des troubles. Nous utiliserons cela comme prétexte pour une répression finale contre tous les sympathisants présumés du communisme, garantissant ainsi que notre propre sécurité intérieure est absolue."

 WGR_Junta_Gehlen_Respond_to_Suez_desc: "Une crise a éclaté dans le canal de Suez, opposant nos alliés britanniques et français à l'Égypte et, plus important encore, les séparant des États-Unis. La manière dont nous réagirons aura des conséquences importantes sur notre position au sein de l'alliance occidentale."

 WGR_Junta_Gehlen_Side_With_British_French_desc: "La fidélité doit être récompensée. Nous serons aux côtés de nos alliés européens, la Grande-Bretagne et la France. Soutenir leur position dans la crise de Suez renforcera nos liens avec eux et affirmera notre engagement en faveur d'une Europe occidentale forte et unie."

 WGR_Junta_Gehlen_Side_With_Americans_and_Nasser_desc: "L'avenir de l'Occident dépend de la puissance économique et militaire des États-Unis, et non d'empires coloniaux vieillissants. Nous nous alignerons sur la position américaine sur la crise de Suez. Cela peut irriter Londres et Paris, mais c'est crucial pour sécuriser nos relations avec Washington."

 WGR_Junta_Manstein_Generalleutnant_Erich_von_Manstein: "Généraloberst Erich von Manstein"
 WGR_Junta_Manstein_Rethink_Cultural_Policies: "Repenser les politiques culturelles"
 WGR_Junta_Manstein_Ban_Holocaust_Memorials: "Interdire les mémoriaux et les musées de l'Holocauste"
 WGR_Junta_Manstein_Refuse_to_Ban_Swastikas_and_SS_Bolts: "Refusez d'interdire les croix gammées et les boulons SS"
 WGR_Junta_Manstein_Accuse_Israel_of_Zionist_Scum: "Accuser Israël d'être une terre de racaille sioniste"
 WGR_Junta_Manstein_Expand_Myth_of_Clean_Wehrmacht: "Développez le mythe de la Wehrmacht propre"
 WGR_Junta_Manstein_Pardon_Nuremburg_Defendants: "Pardon à tous les accusés de Nuremberg"
 WGR_Junta_Manstein_Blame_Soviets_and_Allies_for_WWII: "Blâmer les Soviétiques et leurs alliés pour leurs actions pendant la Seconde Guerre mondiale"
 WGR_Junta_Manstein_A_New_Strong_Germany: "Une Allemagne nouvelle et forte"
 WGR_Junta_Manstein_Massively_Expand_Bundeswehr: "Développer massivement la Bundeswehr"
 WGR_Junta_Manstein_Integrate_BGS_and_Armed_Police: "Intégrer le BGS et la police armée"
 WGR_Junta_Manstein_Reinforce_Inner_German_Border_Defenses: "Renforcer la défense de la frontière intérieure-allemande"
 WGR_Junta_Manstein_Form_Wachtbattalion_and_Airborne_Bdes: "Former le Wachtbataillon et les brigades aéroportées"
 WGR_Junta_Manstein_Bolster_Weapons_Vehicle_Production: "Renforcer la production d'armes et de véhicules"
 WGR_Junta_Manstein_Reuse_Old_Wehrmacht_Weapons: "Réutiliser les anciens modèles d'armes de la Wehrmacht"
 WGR_Junta_Manstein_Prepare_for_War_Exercise_Schwarz: "Préparez-vous à l'exercice de guerre Schwarz"
 WGR_Junta_Manstein_Meet_with_Allied_Officials: "Rencontrez des responsables alliés"
 WGR_Junta_Manstein_Break_Off_Agreements_with_French_Benelux: "Rompre les accords avec les Français et le Benelux"
 WGR_Junta_Manstein_Refuse_to_Join_NATO: "Refuser d'adhérer à l'OTAN"
 WGR_Junta_Manstein_Denounce_1953_Agreement: "Dénoncer l'accord de réunification de 1953"
 WGR_Junta_Manstein_Continue_Relations_with_Spain_Portugal: "Poursuivre les relations diplomatiques avec l'Espagne et le Portugal"
 WGR_Junta_Manstein_Bolster_German_Claims_Over_Berlin: "Renforcer les revendications allemandes sur Berlin"
 WGR_Junta_Manstein_Threaten_to_Start_German_Conflict: "Menacer de déclencher un conflit allemand"
 WGR_Junta_Manstein_A_Bridge_Too_Far: "Un pont trop loin ?"
 
 WGR_Junta_Manstein_Generalleutnant_Erich_von_Manstein_desc:0 "L'un des esprits stratégiques les plus brillants de la Seconde Guerre mondiale est sorti de l'ombre de la retraite. Désillusionné par la faiblesse de la République de Bonn, Erich von Manstein a pris les commandes. Sous sa direction, la Bundeswehr ne sera plus une force défensive contrainte par les traités, mais l'avant-garde d'une fierté allemande retrouvée."

 WGR_Junta_Manstein_Rethink_Cultural_Policies_desc:0 "Depuis trop longtemps, nos institutions culturelles sont paralysées par l'autoflagellation et les exigences des puissances étrangères. Il est temps de remodeler le récit national. Nous ne devons pas nous concentrer sur la honte de la défaite, mais sur la valeur du soldat et la résilience de l'esprit allemand."

 WGR_Junta_Manstein_Ban_Holocaust_Memorials_desc:0 "Ces monuments ne servent que de cicatrices permanentes sur la psyché nationale, destinées à culpabiliser les générations qui n'ont pas pris part à la guerre. Pour restaurer notre confiance en soi nationale, ces rappels constants du passé doivent être démantelés."

 WGR_Junta_Manstein_Refuse_to_Ban_Swastikas_and_SS_Bolts_desc:0 "Les Alliés ont cherché à criminaliser les symboles pour briser notre volonté. Nous soutenons que la liberté d'expression historique est primordiale. Même si nous n'adoptons pas officiellement ces symboles comme insignes d'État, la persécution des anciens combattants pour avoir affiché leur histoire prend fin aujourd'hui."

 WGR_Junta_Manstein_Accuse_Israel_of_Zionist_Scum_desc:0 "Les relations diplomatiques avec Tel Aviv sont devenues une voie à sens unique d'exigences et de réparations. Nous ne tolérerons plus leur ingérence dans nos affaires intérieures ni leurs conférences sur la morale. Il est temps de couper le cordon et de déclarer ouvertement notre position."

 WGR_Junta_Manstein_Expand_Myth_of_Clean_Wehrmacht_desc:0 "Le soldat au front se battait pour son pays, pas pour un parti politique. En promouvant officiellement la séparation de la Wehrmacht des crimes des SS dans nos programmes scolaires et dans nos médias, nous rétablissons l'honneur des millions de personnes qui ont servi consciencieusement."

 WGR_Junta_Manstein_Pardon_Nuremburg_Defendants_desc:0 "Les procès de Nuremberg n'étaient rien d'autre qu'une justice de vainqueur, une démonstration théâtrale de vengeance déguisée en loi. Pour panser les blessures du corps des officiers, nous accordons une grâce totale à ceux qui sont encore emprisonnés. Leur expérience est nécessaire pour les luttes à venir."

 WGR_Junta_Manstein_Blame_Soviets_and_Allies_for_WWII_desc:0 "L'histoire est écrite par les vainqueurs, mais nous corrigerons les faits. N'est-ce pas la menace soviétique qui a nécessité une frappe préventive ? Les Alliés occidentaux n'ont-ils pas ignoré nos appels à l'unité anti-bolchevique ? La responsabilité de l'escalade de la guerre n'incombe pas uniquement à l'Allemagne."

 WGR_Junta_Manstein_A_New_Strong_Germany_desc:0 "Les chaînes de l'occupation se desserrent. L'Allemagne se trouve à la croisée des chemins et nous choisissons la voie de la force. N'étant plus un pion entre l'Est et l'Ouest, nous forgerons notre propre destin, soutenus par l'acier et le fer."

 WGR_Junta_Manstein_Massively_Expand_Bundeswehr_desc:0 "Les limites de troupes imposées par les traités actuels sont insuffisantes pour la défense de nos frontières en ces temps instables. Nous lancerons une campagne de recrutement massive, appelant les jeunes à restaurer les traditions martiales de leurs pères."

 WGR_Junta_Manstein_Integrate_BGS_and_Armed_Police_desc:0 "Nous ne pouvons pas attendre que les nouvelles recrues soient formées. La Bundesgrenzschutz et les unités de police militarisées sont déjà disciplinées et armées. En les intégrant directement dans la structure de la Wehrmacht, nous renforçons instantanément nos divisions prêtes au combat."

 WGR_Junta_Manstein_Reinforce_Inner_German_Border_Defenses_desc:0 "L'Est le qualifie de rempart de protection antifasciste ; nous le considérons comme la ligne de front de l'Europe. Nous coulerons du béton et poserons des mines non seulement pour arrêter une invasion, mais aussi pour démontrer que pas un pouce du territoire fédéral ne sera cédé."

 WGR_Junta_Manstein_Form_Wachtbattalion_and_Airborne_Bdes_desc:0 "Les forces d'élite projettent une puissance bien au-delà de leur nombre. En reconstituant les traditions des Fallschirmjäger et en formant un bataillon de garde dédié au gouvernement, nous garantissons à la fois les capacités de réaction rapide et la sécurité du régime."

 WGR_Junta_Manstein_Bolster_Weapons_Vehicle_Production_desc:0 "Nos usines produisaient autrefois les meilleurs chars et pièces d'artillerie au monde. Les géants industriels de la Ruhr doivent être immédiatement rééquipés pour la production de guerre. Le « miracle économique » sera désormais au service de la machine militaire."

 WGR_Junta_Manstein_Reuse_Old_Wehrmacht_Weapons_desc:0 "Les entrepôts à travers le pays sont remplis d'équipements « obsolètes » confisqués ou cachés après 1945. Un Kar98k tire toujours correctement et un MP40 est toujours mortel. Nous réaffecterons ces armes à nos réserves croissantes jusqu'à ce que la nouvelle production rattrape son retard."

 WGR_Junta_Manstein_Prepare_for_War_Exercise_Schwarz_desc:0 "La théorie doit être testée sur le terrain. « Unternehmen Schwarz » sera la plus grande manoeuvre militaire depuis la guerre, simulant une invasion soviétique à grande échelle - et notre contre-offensive. Le monde verra que l'armée allemande est de retour."

 WGR_Junta_Manstein_Meet_with_Allied_Officials_desc:0 "Les hauts commissaires attendent de la soumission. Ils seront déçus. Nous les avons convoqués non pas pour demander une autorisation, mais pour les informer de la nouvelle réalité de Bonn. La mentalité d'occupation prend fin maintenant."

 WGR_Junta_Manstein_Break_Off_Agreements_with_French_Benelux_desc:0 "La Communauté du charbon et de l'acier est une laisse conçue pour maintenir l'industrie allemande au service des intérêts français. Nous nous retirons de ces accords. Les ressources allemandes seront utilisées pour le réarmement allemand, pas pour chauffer les foyers parisiens."

 WGR_Junta_Manstein_Refuse_to_Join_NATO_desc:0 "Washington cherche de la chair à canon pour sa guerre contre Moscou. Nous n'enverrons pas nos fils mourir pour les intérêts américains sous la direction d'un général américain. L'Allemagne se défendra selon ses propres conditions."

 WGR_Junta_Manstein_Denounce_1953_Agreement_desc:0 "Les accords conclus par l'administration précédente concernant la réunification et les frontières ont été conclus sous la contrainte. Nous les déclarons nulles et non avenues. Nous ne reconnaissons aucune frontière imposée par des puissances étrangères."

 WGR_Junta_Manstein_Continue_Relations_with_Spain_Portugal_desc:0 "Alors que les démocraties nous fuient, Madrid et Lisbonne comprennent la nécessité d'un leadership fort et d'un anticommunisme. Le renforcement des liens avec Franco et Salazar nous offre des partenaires commerciaux cruciaux et une profondeur stratégique en dehors de la sphère de l'OTAN."

 WGR_Junta_Manstein_Bolster_German_Claims_Over_Berlin_desc:0 "Berlin est le coeur de l'Allemagne et sa division est une plaie ouverte. Nous réaffirmons notre revendication sur la ville entière, à l'Est comme à l'Ouest. Nous augmenterons notre présence et nos financements à Berlin-Ouest, pour en faire une forteresse de notre idéologie derrière les lignes ennemies."

 WGR_Junta_Manstein_Threaten_to_Start_German_Conflict_desc:0 "La diplomatie a échoué. Le monde ignore nos griefs légitimes à ses risques et périls. Nous nous mobilisons à la frontière. Si nos revendications de souveraineté et de territoire ne sont pas satisfaites, nous sommes prêts à rallumer la poudrière de l'Europe."

 WGR_Junta_Manstein_A_Bridge_Too_Far_desc:0 "Nous avons poussé jusqu'au bord du gouffre. Notre jeu a aliéné nos alliés et provoqué nos ennemis. Les ordres sont donnés et les troupes se déplacent. Comme les parachutistes d'Arnhem, soit nous avons assuré notre avenir, soit nous nous sommes voués à la destruction. Les dés sont jetés."

 WGR_Junta_Speidel_Expand_Military_to_Counter_Soviet_Threat:0 "Un rempart anti-bolcheviste"
 WGR_Junta_Speidel_Expand_Military_to_Counter_Soviet_Threat_desc:0 "Ce n'est qu'une question de temps avant que les Russes ne soient aux portes de Bonn. Pour empêcher que cela ne se produise, nous devons aller plus loin que de simples forces défensives spécialisées. La nouvelle armée allemande jouera un rôle crucial dans la libération de l'Europe et la chute du communisme."
 
 WGR_Junta_Speidel_Expand_Domestic_Rifle_and_Air_Production:0 "Développer la production nationale de fusils et d'air"
 WGR_Junta_Speidel_Expand_Domestic_Rifle_and_Air_Production_desc:0 "Plus! Speidel. Nous allons faire plus de Waffen !"
 
 WGR_Junta_Speidel_Form_Special_Forces_and_Airborne_Brigades:0 "Former des forces spéciales et des brigades aéroportées"
 WGR_Junta_Speidel_Form_Special_Forces_and_Airborne_Brigades_desc:0 "Le plan original de Manstein des Wachtbataillons et des unités aéroportées était une excellente idée, que nous continuerons à entretenir. Les unités aéroportées nous aideront à rassembler des informations et les unités spécialisées en reconnaissance et en logistique assureront une efficacité maximale sur le champ de bataille."
 
 WGR_Junta_Speidel_Deal_with_Bundeswehr:0 "Faire face à la Bundeswehr"
 WGR_Junta_Speidel_Deal_with_Bundeswehr_desc:0 "Les relations entre le gouvernement militaire et les forces armées actives doivent être clarifiées. Nous devons veiller à ce que la chaîne de commandement reste professionnelle et séparée des manoeuvres politiques."

 WGR_Junta_Speidel_Join_IMF:0 "Rejoignez le Fonds monétaire international"
 WGR_Junta_Speidel_Join_IMF_desc:0 "La stabilité économique nécessite une intégration internationale. L'adhésion au FMI stabilisera notre monnaie et fournira le crédit nécessaire à nos ambitieux plans de reconstruction."
 
 WGR_Junta_Speidel_Discuss_Contributing_to_UN_Peacekeeping:0 "Discuter de la contribution au maintien de la paix de l'ONU"
 WGR_Junta_Speidel_Discuss_Contributing_to_UN_Peacekeeping_desc:0 "Le retour de l'Allemagne sur la scène mondiale peut être cimenté par le service de la paix. Nous étudions la possibilité d'envoyer des observateurs et des unités médicales pour soutenir les missions des Nations Unies à l'étranger."

 WGR_Junta_Speidel_Foster_Relations_with_European_Neutrals:0 "Favoriser les relations avec les pays neutres européens"
 WGR_Junta_Speidel_Foster_Relations_with_European_Neutrals_desc:0 "De la Suisse à la Suède, il y a beaucoup à apprendre de ceux qui ont traversé la guerre froide sans prendre parti. Nous renforcerons nos liens avec ces nations pour créer un bloc de stabilité."

 WGR_Junta_Speidel_Remain_in_Western_Sphere:0 "Rester dans la sphère d'influence occidentale"
 WGR_Junta_Speidel_Remain_in_Western_Sphere_desc:0 "Malgré nos changements internes, notre coeur bat en Occident. Nous devons réaffirmer notre engagement envers les valeurs de la communauté atlantique et la protection du monde libre."

 WGR_Junta_Speidel_Open_New_Embassies_Around_the_World:0 "Ouvrir de nouvelles ambassades dans le monde"
 WGR_Junta_Speidel_Open_New_Embassies_Around_the_World_desc:0 "L'ère de l'isolement est révolue. En ouvrant des missions diplomatiques en Afrique, en Asie et dans les Amériques, nous rétablissons la présence de l'Allemagne en tant que partenaire mondial dans le commerce et la diplomatie."

 WGR_Junta_Speidel_Condemn_the_East_German_Govt:0 "Condamner le gouvernement est-allemand"
 WGR_Junta_Speidel_Condemn_the_East_German_Govt_desc:0 "Nous ne pouvons pas rester silencieux pendant que nos frères et soeurs de l'Est vivent sous un régime fantoche. Cette condamnation formelle indique que nous ne reconnaissons pas la légitimité du pouvoir du SED."

 WGR_Junta_Speidel_Allow_Allied_Supervision_of_the_Junta:0 "Autoriser les autorités alliées à superviser la junte"
 WGR_Junta_Speidel_Allow_Allied_Supervision_of_the_Junta_desc:0 "Pour prouver que nous ne sommes pas une dictature militaire en devenir, nous autoriserons les observateurs alliés à surveiller nos processus administratifs et à garantir que nous progressons vers un retour à la démocratie."
 
 WGR_Junta_Speidel_Maintain_Bundeswehr_As_Defense_Force:0 "Maintenir la Bundeswehr en tant que force de défense"
 WGR_Junta_Speidel_Maintain_Bundeswehr_As_Defense_Force_desc:0 "Notre armée existe dans un seul but : la protection du sol allemand. En codifiant son rôle de force purement défensive, nous rassurons nos voisins et axons notre doctrine sur le maintien de la ligne."

 WGR_Junta_Speidel_Enforce_Volunteer_Only_Policies:0 "Appliquer des politiques militaires réservées aux volontaires"
 WGR_Junta_Speidel_Enforce_Volunteer_Only_Policies_desc:0 "Une armée professionnelle est une armée fiable. En nous en tenant pour l'instant à un modèle réservé aux bénévoles, nous veillons à ce que chaque homme en uniforme soit là par choix, attaché aux valeurs démocratiques du nouvel État."

 WGR_Junta_Speidel_Receive_American_Anti_Tank_Weapons_and_TDs:0 "Recevez des armes antichar et des chasseurs de chars américains"
 WGR_Junta_Speidel_Receive_American_Anti_Tank_Weapons_and_TDs_desc:0 "Pour contrer les formations blindées massives de l'Est, nous avons besoin de plus que de simples chars. Les expéditions américaines de roquettes antichar et de chasseurs de chars spécialisés donneront à notre infanterie une chance de se battre."

 WGR_Junta_Speidel_Receive_American_Tanks_and_Armored_Vehicles:0 "Recevez des chars et des véhicules blindés américains"
 WGR_Junta_Speidel_Receive_American_Tanks_and_Armored_Vehicles_desc:0 "Le rugissement des moteurs américains se fera bientôt entendre sur nos terrains d'entraînement. Ces Patton et ces véhicules blindés de transport de troupes constituent la base en acier sur laquelle seront construites nos nouvelles divisions mécanisées."

 WGR_Junta_Speidel_Pass_the_Conscription_Act:0 "Adopter la loi sur la conscription"
 WGR_Junta_Speidel_Pass_the_Conscription_Act_desc:0 "Le temps d'un petit noyau professionnel est révolu. Pour remplir nos obligations envers la défense occidentale, nous devons appeler la jeunesse de la nation à remplir son mandat."

 WGR_Junta_Speidel_Expand_Bundeswehr_Commmand_Staff_Academy:0 "Agrandir l'Académie de commandement et d'état-major de la Bundeswehr"
 WGR_Junta_Speidel_Expand_Bundeswehr_Commmand_Staff_Academy_desc:0 "À mesure que l'armée grandit, le besoin de leadership augmente également. L'agrandissement de l'académie nous permet de former un plus grand nombre d'officiers d'état-major aux complexités des opérations multinationales modernes."
 
 WGR_Junta_Speidel_Seek_Peaceful_Uses_Only:0 "Rechercher uniquement des utilisations pacifiques"
 WGR_Junta_Speidel_Seek_Peaceful_Uses_Only_desc:0 "Pour apaiser les craintes internationales, nous nous engagerons publiquement à consacrer nos recherches nucléaires uniquement à la production d'électricité et au progrès scientifique. L'atome doit servir le peuple, pas le détruire."

 WGR_Junta_Speidel_Build_German_Federal_Reactor_Plant:0 "Construire la centrale nucléaire fédérale allemande"
 WGR_Junta_Speidel_Build_German_Federal_Reactor_Plant_desc:0 "Un monument de l'ingénierie allemande. La construction d'une centrale nucléaire nationale est le premier pas vers l'indépendance énergétique et une classe de maître en physique nucléaire."

 WGR_Junta_Speidel_Request_American_Nuclear_Assistance:0 "Demander l'assistance nucléaire américaine"
 WGR_Junta_Speidel_Request_American_Nuclear_Assistance_desc:0 "Dans le cadre du programme « Atomes pour la paix », nous pouvons tirer parti de l'expertise américaine. Grâce à leurs conseils et à leur combustible enrichi, notre chemin vers un État doté de la capacité nucléaire sera considérablement accéléré."

 WGR_Junta_Speidel_Prepare_for_Nuclear_Civil_Defense:0 "Se préparer à la protection civile nucléaire"
 WGR_Junta_Speidel_Prepare_for_Nuclear_Civil_Defense_desc:0 "Si le pire devait arriver, nous devons être prêts. Construire des bunkers et entraîner la population aux exercices « canard et couverture » garantira que la nation allemande survivra même à un échange nucléaire."
 
 WGR_Bundeswehr_Speidel_Form_Air_Defense_Groups:0 "Former des groupes de défense aérienne"
 WGR_Bundeswehr_Speidel_Form_Air_Defense_Groups_desc:0 "La guerre moderne se déroule en trois dimensions. En établissant des unités anti-aériennes dédiées équipées de radars et de canons à tir rapide, nous créons un bouclier sur notre coeur industriel."

 WGR_Junta_Speidel_Negotiate_End_Of_Occupation:0 "Négociation de notre souveraineté"
 WGR_Junta_Speidel_Negotiate_End_Of_Occupation_desc:0 "Le statut d'occupation doit prendre fin pour que l'Allemagne redevienne une nation pleinement souveraine. Nous demanderons aux Alliés occidentaux de se joindre à nous à Bielefeld pour mener des négociations qui verront à terme le retour intégral du pouvoir intérieur au peuple allemand et à ses représentants."
 
 WGR_Bundeswehr_Speidel_Build_Bases_in_Buchel_and_Neuburg:0 "Construire des bases à Büchel et Neuburg"
 WGR_Bundeswehr_Speidel_Build_Bases_in_Buchel_and_Neuburg_desc:0 "Les emplacements stratégiques nécessitent des installations permanentes. Ces nouvelles bases aériennes serviront de plates-formes principales pour nos intercepteurs, garantissant des temps de réponse rapides dans les secteurs sud et ouest."
 
 WGR_Bundeswehr_Speidel_Rebuild_Shipbuilding_Facilities_in_Kiel:0 "Reconstruire les installations de construction navale à Kiel"
 WGR_Bundeswehr_Speidel_Rebuild_Shipbuilding_Facilities_in_Kiel_desc:0 "Kiel a une longue tradition d'excellence navale. En investissant dans la reconstruction de ses cales et quais bombardés, nous donnons à la Bundesmarine l'espace de naissance dont elle a besoin pour une nouvelle génération de navires."

 WGR_Bundeswehr_Speidel_Purchase_Corvettes_and_Destroyers:0 "Achetez des corvettes et des destroyers"
 WGR_Bundeswehr_Speidel_Purchase_Corvettes_and_Destroyers_desc:0 "Pendant que nos cours intérieures sont en reconstruction, nous ne pouvons pas laisser nos eaux sans défense. L'achat d'escortes éprouvées auprès de nos alliés fournira un écran immédiat contre toute incursion balte."
 
 WGR_Junta_Speidel_Hold_Meeting_With_Allies:0 "Tenir une réunion avec les alliés"
 WGR_Junta_Speidel_Hold_Meeting_With_Allies_desc:0 "Nous devons convaincre les puissances occidentales que la junte est un partenaire fiable dans la lutte contre le bolchevisme et non un régime militaire voyou."

 WGR_Junta_Speidel_Join_the_UN:0 "Rejoignez les Nations Unies"
 WGR_Junta_Speidel_Join_the_UN_desc:0 "En siégeant à l'Assemblée générale, l'Allemagne sort de l'ombre et réintègre la communauté internationale en tant qu'acteur souverain et responsable."

 WGR_Junta_Speidel_Take_Neutral_FP_Approach:0 "Adopter une approche neutre en matière de politique étrangère"
 WGR_Junta_Speidel_Take_Neutral_FP_Approach_desc:0 "L'Allemagne est depuis trop longtemps le champ de bataille de l'Europe. En adoptant une politique de neutralité, nous pouvons servir de tampon entre les superpuissances et nous concentrer sur notre propre redressement."

 WGR_Junta_Speidel_Accept_Limited_Number_of_Hungarian_Refugees:0 "Accepter les réfugiés hongrois"
 WGR_Junta_Speidel_Accept_Limited_Number_of_Hungarian_Refugees_desc:0 "Le soulèvement en Hongrie a montré au monde le véritable visage du contrôle soviétique. En offrant l'asile à ceux qui fuient la répression, nous démontrons notre engagement humanitaire."

 WGR_Junta_Speidel_Report_on_the_Countrys_Progress:0 "Rapport sur les progrès du pays"
 WGR_Junta_Speidel_Report_on_the_Countrys_Progress_desc:0 "La transition touche à sa fin. Il est temps de présenter un bilan final des réalisations de la junte et de décider de la voie future de la nation allemande."
 
 WGR_Junta_Speidel_Present_New_Junta_Economic_Plan:0 "Présenter un nouveau plan économique pour la junte"
 WGR_Junta_Speidel_Present_New_Junta_Economic_Plan_desc:0 "Une stratégie économique centralisée et guidée par l'armée se concentrera sur l'industrie lourde et la reconstruction, sortant ainsi la nation du marasme d'après-guerre grâce à l'efficacité pure."

 WGR_Junta_Speidel_Expand_Rail_Networks_Between_Major_German_Cities:0 "Étendre les réseaux ferroviaires entre les grandes villes allemandes"
 WGR_Junta_Speidel_Expand_Rail_Networks_Between_Major_German_Cities_desc:0 "La logistique est l'épine dorsale du commerce et de la guerre. La réparation et l'expansion des réseaux successeurs de la Reichsbahn permettront de resserrer les liens entre la nation."

 WGR_Junta_Speidel_Allow_Limited_Workers_Organizations:0 "Autoriser les organisations de travailleurs limitées"
 WGR_Junta_Speidel_Allow_Limited_Workers_Organizations_desc:0 "Pour prévenir les grèves et les troubles, nous autoriserons la formation de syndicats sanctionnés par l'État. Cela donne aux travailleurs une voix tout en garantissant que la junte conserve le contrôle de la production."
 
 WGR_Junta_Speidel_Address_the_Nation_on_the_Junta:0 "S'adresser à la nation"
 WGR_Junta_Speidel_Address_the_Nation_on_the_Junta_desc:0 "A travers une émission de radio et de télévision à l'échelle nationale, Speidel soulignera la nécessité d'une intervention temporaire de l'armée et son engagement à rétablir l'ordre."

 WGR_Junta_Speidel_Stand_Down_Bundeswehr_Troops:0 "Retrait des troupes de la Bundeswehr"
 WGR_Junta_Speidel_Stand_Down_Bundeswehr_Troops_desc:0 "Pour apaiser les tensions avec le public et les observateurs internationaux, nous ramènerons les unités non essentielles dans leurs casernes. Les rues doivent être surveillées par la loi et non par des tanks."

 WGR_Junta_Speidel_Propose_Plan_of_Limited_Stabilization:0 "Proposer un plan de stabilisation limitée"
 WGR_Junta_Speidel_Propose_Plan_of_Limited_Stabilization_desc:0 "Nous ne pouvons pas tout régler d'un coup. En se concentrant sur les services essentiels et la sécurité alimentaire, la junte vise à gagner « les coeurs et les esprits » de la population épuisée."

 WGR_Junta_Speidel_Bar_Nazi_Officials_from_Civil_Service:0 "Interdire les fonctionnaires nazis de la fonction publique"
 WGR_Junta_Speidel_Bar_Nazi_Officials_from_Civil_Service_desc:0 "L'administration doit être propre. Toute personne ayant un passé compromis au sein du NSDAP sera démis de ses fonctions d'influence afin de garantir une bureaucratie véritablement professionnelle."

 WGR_Junta_Speidel_Place_Limits_on_Communist_Activities:0 "Imposer des limites aux activités politiques communistes"
 WGR_Junta_Speidel_Place_Limits_on_Communist_Activities_desc:0 "Pour empêcher une révolution interne guidée par Moscou, nous devons strictement surveiller et limiter les activités des agitateurs qui cherchent à saper l'autorité de la junte."

 WGR_Junta_Speidel_Enable_Democracy_in_Germany_Once_Again:0 "Permettre à nouveau la démocratie en Allemagne"
 WGR_Junta_Speidel_Enable_Democracy_in_Germany_Once_Again_desc:0 "Le but ultime de la Junte a toujours été d'être un pont. Après avoir sécurisé la nation, nous préparons désormais les premières élections libres de l'après-crise."
 
 WGR_Junta_Speidel_Reshuffle_the_Junta:0 "Remaniement du Militärregierung"
 WGR_Junta_Speidel_Reshuffle_the_Junta_desc:0 "Pour gouverner efficacement, nous devons veiller à ce que le conseil militaire soit composé d'hommes qui privilégient la stabilité plutôt que l'ambition personnelle. Un remaniement consolidera la vision de Speidel d'une Allemagne de transition."

 WGR_Junta_Speidel_Meet_with_the_Soviets_and_East_Germans:0 "Consultation avec l'Union soviétique"
 WGR_Junta_Speidel_Meet_with_the_Soviets_and_East_Germans_desc:0 "La désescalade est une nécessité et non un choix. En ouvrant un canal temporaire vers Moscou et Berlin-Est, nous visons à éviter un point chaud pendant que nous mettons de l'ordre dans nos propres affaires."

 WGR_Junta_Speidel_Appoint_Hans_Speidel_as_Chairman:0 "Nommer Hans Speidel au poste de président"
 WGR_Junta_Speidel_Appoint_Hans_Speidel_as_Chairman_desc:0 "La Junte a besoin d'une voix unique et faisant autorité. En tant qu'homme intelligent et militaire prestigieux, Speidel est le seul choix pour diriger la nation à travers cette période d'incertitude."

 WGR_Junta_Speidel_Ban_Swastikas_and_Nazi_Imagery:0 "Interdire les croix gammées et les images publiques nazies"
 WGR_Junta_Speidel_Ban_Swastikas_and_Nazi_Imagery_desc:0 "Les fantômes du passé doivent être exorcisés. Pour retrouver la confiance internationale et la paix intérieure, tous les symboles de l'ancien régime doivent être effacés de la vue du public."

 WGR_Junta_Speidel_Try_Manstein_for_Fascist_Activities:0 "Jugez Manstein pour ses activités fascistes"
 WGR_Junta_Speidel_Try_Manstein_for_Fascist_Activities_desc:0 "Personne n'est au-dessus des lois, même les anciens héros de la Wehrmacht. En traduisant Manstein en justice, nous signalons au monde que la nouvelle Allemagne se tient responsable."

 WGR_Junta_Speidel_Clarify_Truth_of_Wehrmacht:0 "Clarifier la vérité sur la Wehrmacht"
 WGR_Junta_Speidel_Clarify_Truth_of_Wehrmacht_desc:0 "Nous devons trouver un équilibre difficile : reconnaître les crimes commis pendant la guerre tout en préservant la dignité des millions de soldats qui ont simplement accompli leur devoir."
 
 WGR_Junta_Speidel_Build_Additional_Defenses_on_Inner_German_Border:0 "Construire des défenses supplémentaires à la frontière intérieure-allemande"
 WGR_Junta_Speidel_Build_Additional_Defenses_on_Inner_German_Border_desc:0 "Le rideau de fer n'est pas qu'une métaphore. Du béton et de l'acier doivent être déployés le long de la frontière pour garantir que toute incursion « accidentelle » soit stoppée avant qu'elle ne dégénère."

 WGR_Junta_Speidel_Introduce_Elite_Defensive_Training:0 "Présentation de l'entraînement défensif d'élite"
 WGR_Junta_Speidel_Introduce_Elite_Defensive_Training_desc:0 "La qualité plutôt que la quantité. Nos troupes doivent être entraînées à des tactiques de retardement et de perturbation, transformant chaque forêt et chaque village en forteresse face à un nombre supérieur."
 
 WGR_Junta_Speidel_Subsidize_BMW_VW_and_BASF:0 "Subventionner BMW, Volkswagen et BASF"
 WGR_Junta_Speidel_Subsidize_BMW_VW_and_BASF_desc:0 "Les moteurs de l'industrie allemande ne doivent jamais s'arrêter. En accordant des subventions publiques à nos géants industriels, nous garantissons l'emploi et l'avance technologique nécessaire à une défense moderne."

 WGR_Junta_Speidel_Expand_Coal_Sector_in_Ruhr:0 "Développer le secteur du charbon dans la Ruhr"
 WGR_Junta_Speidel_Expand_Coal_Sector_in_Ruhr_desc:0 "Le charbon reste l'élément vital de notre indépendance énergétique. La Ruhr doit être exploitée au maximum pour alimenter le redressement de la nation et sa machine militaire croissante."
 
 WGR_Junta_Speidel_Begin_German_Nuclear_Program:0 "Lancer le programme nucléaire allemand"
 WGR_Junta_Speidel_Begin_German_Nuclear_Program_desc:0 "À l'ère des géants atomiques, une nation sans recherche nucléaire est une nation sans avenir. Nous commencerons notre propre chemin vers le coeur de l'atome."

 WGR_Junta_Speidel_Consider_Nuclear_Weapons_for_Defense:0 "Envisagez les armes nucléaires pour la défense"
 WGR_Junta_Speidel_Consider_Nuclear_Weapons_for_Defense_desc:0 "L'impensable doit être pensé. Si les forces conventionnelles ne peuvent garantir notre survie face à l'Est, nous devons évaluer la nécessité d'une dissuasion nucléaire."
 
 WGR_Junta_Speidel_Support_Nasser_and_NAM:0 "Soutenez Nasser et le Mouvement des non-alignés"
 WGR_Junta_Speidel_Support_Nasser_and_NAM_desc:0 "En s'adressant au Mouvement des non-alignés, l'Allemagne peut trouver une troisième voie qui évite une soumission totale à Washington ou à Moscou."

 WGR_Junta_Speidel_Join_NATO:0 "Rejoindre l'OTAN"
 WGR_Junta_Speidel_Join_NATO_desc:0 "Notre sécurité est inextricablement liée à l'Occident. L'adhésion à l'Organisation du Traité de l'Atlantique Nord est la dernière étape pour garantir qu'une attaque contre Bonn soit considérée comme une attaque contre Washington et Londres."
 
 WGR_Road_to_Democracy_Face_the_Road_to_Democracy: "Retour à la démocratie"
 WGR_Road_to_Democracy_Empower_Conservative_Political_Parties: "Donner du pouvoir aux partis politiques conservateurs"
 WGR_Road_to_Democracy_Grapple_With_Past_of_Nazism: "Aux prises avec le passé du nazisme"
 WGR_Road_to_Democracy_Make_Speech_to_German_People: "Faire un discours au peuple allemand"
 WGR_Road_to_Democracy_Invite_UN_To_Observe_Elections: "Inviter les observateurs électoraux de l'ONU"
 WGR_Road_to_Democracy_Urge_Campaigning_and_Freedom_of_Expression: "Exhortez les campagnes et la liberté d'expression"
 WGR_Road_to_Democracy_Initiate_the_1958_Provisional_Federal_Elections: "Initier des élections fédérales provisoires"
 
 WGR_Road_to_Democracy_Face_the_Road_to_Democracy_desc: "Le gouvernement militaire provisoire a atteint son objectif premier : la menace communiste a été neutralisée et la nation stabilisée. Toutefois, le corps des officiers reconnaît qu'un régime militaire permanent n'est ni souhaitable ni durable. Pour garantir l'avenir à long terme de l'Allemagne et son intégration dans le monde occidental, la junte elle-même doit désormais ouvrir la voie au retour à une démocratie stable et dirigée par des civils."

 WGR_Road_to_Democracy_Empower_Conservative_Political_Parties_desc: "Le retour à la démocratie doit être soigneusement géré pour éviter une résurgence du chaos qui a permis aux extrémistes de prospérer. Le conseil militaire s'accorde sur le fait que des partis responsables, patriotiques et résolument anticommunistes doivent constituer le fondement de la nouvelle république. Les ressources de l'État seront utilisées pour soutenir les campagnes des mouvements conservateurs et chrétiens-démocrates, garantissant ainsi qu'ils soient bien placés pour diriger."

 WGR_Road_to_Democracy_Grapple_With_Past_of_Nazism_desc: "Une nouvelle démocratie allemande ne peut pas être construite sur une base de déni. Dans l'intérêt de notre position internationale et du caractère moral de notre nation, nous devons faciliter une confrontation honnête avec l'ère nazie. Ce processus différenciera la nouvelle Allemagne conservatrice des totalitarismes du passé et de la menace communiste que nous venons de vaincre."

 WGR_Road_to_Democracy_Make_Speech_to_German_People_desc: "Le président du Conseil militaire provisoire s'adressera à la nation. Le discours annoncera officiellement l'intention du gouvernement de rétablir un régime civil et présentera une feuille de route claire vers des élections libres et équitables. Il servira d'appel à une citoyenneté responsable et à un rejet ferme de toutes les formes d'extrémisme politique, exhortant le peuple à s'unir pour construire une Allemagne sûre et libre."

 WGR_Road_to_Democracy_Invite_UN_To_Observe_Elections_desc: "Les circonstances de notre accession au pouvoir ont suscité l'attention de la communauté internationale. Pour prouver la sincérité de notre transition démocratique, le gouvernement provisoire lancera une invitation formelle aux Nations Unies à envoyer des observateurs. Le monde sera invité à constater que les prochaines élections se dérouleront librement et équitablement, consolidant ainsi la légitimité de la nouvelle république."

 WGR_Road_to_Democracy_Urge_Campaigning_and_Freedom_of_Expression_desc: "Une élection légitime nécessite un échange ouvert d'idées. La junte publiera un décret levant les restrictions d'urgence sur l'activité politique pour tous les partis approuvés et non subversifs. Les campagnes ouvertes et la liberté d'expression seront encouragées, permettant au peuple allemand de faire un choix éclairé pour son avenir."

 WGR_Road_to_Democracy_Initiate_the_1958_Provisional_Federal_Elections_desc: "La mission de l'armée en tant que gardien temporaire de l'État touche à sa fin. Le gouvernement provisoire convoque officiellement la tenue d'élections fédérales. L'appareil d'État sera mobilisé pour assurer un processus fluide et ordonné. Le pouvoir est sur le point d'être transféré des casernes aux urnes, annonçant un nouveau chapitre pour la République fédérale."
 
 
 WGR_Road_to_Democracy_Speidel_Face_the_Road_to_Democracy_desc: "Le gouvernement militaire provisoire a atteint son objectif premier : la menace communiste a été neutralisée et la nation stabilisée. Toutefois, le corps des officiers reconnaît qu'un régime militaire permanent n'est ni souhaitable ni durable. Pour garantir l'avenir à long terme de l'Allemagne et son intégration dans le monde occidental, la junte elle-même doit désormais ouvrir la voie au retour à une démocratie stable et dirigée par des civils."

