 WGR_SPD_Ollenhauer_Bundestag_1957: "Le Bundestag"
 WGR_SPD_BUNDESTAG_1957_OLLENHAUER_1_DESC_GUI: "Quatre années supplémentaires se sont déjà écoulées et le peuple allemand retourne une fois de plus aux urnes pour élire les mandats qui le représenteront au Bundestag. Les sociaux-démocrates bénéficient toujours d'un grand soutien populaire, surtout après la politique d'Ollenhauer en matière d'assurance nationale, de protection des minorités et du retour de la Sarre. Les démocrates-chrétiens ont de nouveau été regroupés dans l'opposition, mais le chancelier Ollenhauer pourrait être ouvert à un certain degré de coopération.\n\nLe Bundestag a besoin de coalitions majoritaires pour adopter des lois, ce qui signifie que le chancelier Ollenhauer a besoin d'au moins 260 des 519 sièges actuels pour soutenir son programme. À cela s'ajoute l'introduction du vote par correspondance, pratique pour les citoyens allemands travaillant à l'étranger. Le moment est à nouveau venu de tendre la main aux autres partis, prêts à soutenir la politique du SPD, en faisant des promesses et en trouvant des compromis qui profiteront aux deux parties.\n\n§C260§! sièges sont requis pour une majorité. Les résultats des élections sont les suivants :"
 WGR_SPD_BUNDESTAG_1957_OLLENHAUER_2_DESC_GUI: "\n§SParti social-démocrate d'Allemagne (SPD)§!: 217\n§PUnion chrétienne-démocrate (CDU/CSU)§!: 180\n§BCentre§!: 38\n§mParti Démocratique Libre (FDP)§!: 35\n§cParti allemand (DP)§!: 20\n§gBloc panallemand/Association des anciens combattants et des personnes déplacées (GB/BHE) §!: 19\n\nPartenaires actuels de la coalition : [WGR_OllenhauerCoalitionPartnersStatus1957]"

