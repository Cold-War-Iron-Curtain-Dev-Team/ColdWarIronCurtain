 WGR_1949_election_category: "Les conséquences des élections au Bundestag"
 WGR_1949_election_category_desc: "\nPour la première fois en 12 ans, le peuple allemand est revenu aux urnes pour élire ses mandats libres, qui façonneront l'avenir de l'Allemagne au sein du Bundestag nouvellement créé, la continuité institutionnelle du Reichstag du Kaiserreich et de la Première République. La bataille acharnée entre les sociaux-démocrates et les chrétiens-démocrates s'est soldée par la victoire de Konrad Adenauer, qui sera désormais chancelier allemand pour les quatre prochaines années.\n\nLe Bundestag exige des coalitions majoritaires pour adopter des lois, ce qui signifie qu'Adenauer a besoin d'au moins 202 des 402 sièges pour le soutenir. Le moment est maintenant venu de tendre la main aux autres partis prêts à soutenir la politique d'Adenauer, en faisant des promesses et en trouvant des compromis qui profiteront aux deux parties.\n\n§C202§! sièges sont requis pour une majorité. Les résultats des élections sont les suivants :\n\n§RParti communiste allemand (KPD)§!: 15\n§SParti social-démocrate d'Allemagne (SPD)§!: 131\n§9Association pour la reconstruction économique (WAV)§!: 12\n§mParti Démocratique Libre (FDP)§!: 52\n§4Parti Bavarois (BP)§!: 17\n§gIndépendant §!: 5\n§cParti allemand (DP)§!: 17\n§PUnion chrétienne-démocrate (CDU/CSU)§!: 139\n§BCentre§!: 10\n§NParti conservateur allemand - Parti de la droite allemande (DKP-DRP)§!: 5\n\nPartenaires actuels de la coalition : [WGR_AdenauerCoalitionPartnersStatus1949]"
 
 WGR_Adenauer_1953_election_category: "Élection du Bundestag de 1953"
 WGR_Adenauer_1953_election_category_desc: "\nCela n'en a peut-être pas l'air, mais quatre années se sont déjà écoulées depuis le premier Bundestagswahl, et les chrétiens-démocrates bénéficient d'un soutien populaire à un niveau que l'ancien Zentrum n'avait même pas atteint lors de son apogée il y a 80 ans. Les sociaux-démocrates ont été une fois de plus regroupés dans l'opposition, Konrad Adenauer étant chancelier allemand pour quatre années supplémentaires.\n\nLe Bundestag a besoin de coalitions majoritaires pour adopter des lois, ce qui signifie qu'Adenauer a besoin d'au moins 255 des 509 sièges actuels pour soutenir son programme. À cela s'ajoute l'introduction de la clause des 5 %, exigeant que les partis politiques obtiennent au moins 5 % des voix ou remportent le mandat dans une circonscription électorale. Un autre ajout était le deuxième vote, permettant aux citoyens de voter pour un candidat local supplémentaire. Le moment est à nouveau venu de tendre la main aux autres partis, prêts à soutenir la politique d'Adenauer, en faisant des promesses et en trouvant des compromis qui profiteront aux deux parties.\n\n§C255§! sièges sont requis pour une majorité. Les résultats des élections sont les suivants :\n\n§SParti social-démocrate d'Allemagne (SPD)§!: 162\n§LBloc panallemand/Association des anciens combattants et des personnes déplacées (GB/BHE)§!: 27\n§mParti Démocratique Libre (FDP)§!: 53\n§cParti allemand (DP)§!: 15\n§PUnion chrétienne-démocrate (CDU/CSU)§!: 249\n§BCentre§!: 3\n\nPartenaires actuels de la coalition : [WGR_AdenauerCoalitionPartnersStatus1953]"

 WGR_Adenauer_1957_election_category: "Élection du Bundestag de 1957"
 WGR_Adenauer_1957_election_category_desc: "\nQuatre années supplémentaires se sont écoulées et il est temps pour le peuple allemand de retourner aux urnes. Alors que les experts prédisent que les démocrates-chrétiens rallieront davantage de soutien, suite aux politiques populaires d'Adenauer, notamment le retour du Heimkehrer, la réintégration de la Sarre en Allemagne, ainsi que la réforme des retraites de 1957. Cependant, pour la première fois dans l'histoire allemande, un parti politique a rassemblé plus de 50 % du vote populaire, ce qui signifie que la CDU pourrait établir un gouvernement à parti unique pour les quatre prochaines années. Les sociaux-démocrates ont été une fois de plus regroupés dans l'opposition, Konrad Adenauer étant chancelier allemand pour quatre années supplémentaires.\n\nLe Bundestag a besoin de coalitions majoritaires pour adopter des lois, ce qui signifie qu'Adenauer a besoin d'au moins 260 des 519 sièges actuels pour soutenir son programme.\n\n§C260§! sièges sont requis pour une majorité. Les résultats des élections sont les suivants :\n\n§SParti social-démocrate d'Allemagne (SPD)§!: 181\n§mParti Démocratique Libre (FDP)§!: 43\n§cParti allemand (DP)§!: 17\n§PUnion chrétienne-démocrate (CDU/CSU)§!: 277\n\nPartenaires actuels de la coalition : [WGR_AdenauerCoalitionPartnersStatus1957]"

