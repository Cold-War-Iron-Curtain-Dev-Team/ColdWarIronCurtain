 WGR_Schumacher_49_Bundeskanzler_Kurt_Schumacher: "Le Kanzler fédéral Kurt Schumacher"
 WGR_Schumacher_49_Bundeskanzler_Kurt_Schumacher_desc: "Lors d'élections serrées, Kurt Schumacher, président des sociaux-démocrates, est sorti vainqueur du Bundestagswahl de 1949, battant son adversaire Konrad Adenauer d'une voix. Avec lui à la tête du nouveau gouvernement, son administration prévoit la reconstruction, l'anticommunisme, mais mettra fortement l'accent sur les réformes sociales, soutenant la classe ouvrière, tout en étant quelque peu hésitante à l'égard de l'intégration occidentale." 
