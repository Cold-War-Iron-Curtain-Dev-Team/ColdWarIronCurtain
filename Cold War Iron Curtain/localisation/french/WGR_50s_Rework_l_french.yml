 ####Events 1950s#####
 
 WGR_StartEvent.1.t: "Battu, mais jamais vaincu."
 WGR_StartEvent.1.d: "La vie des Allemands a été dure. Face à la défaite de la Grande Guerre et au fardeau du Traité de Versailles de 1919, les défis auxquels la République allemande a été confrontée n'auraient pas pu être pires. L'inflation, les tentatives de coup d'État et les assassinats politiques ainsi que le totalitarisme de l'extrême gauche et de l'extrême droite signifiaient que la chute de la démocratie en Allemagne n'était qu'une question de temps.\n\nLorsque le NSDAP (Nationalsozialistische Deutsche Arbeiterpartei) a accédé au pouvoir, il a aboli les structures constitutionnelles qui auraient pu remettre en cause son pouvoir. La période de 1933 à 1945 aurait pu connaître la stabilité économique au cours des premières années, mais au prix de l'abandon des libertés civiles et de l'entraînement du peuple allemand dans une autre guerre qui coûterait la vie à des millions d'Allemands, juste pour que le pays soit confronté à une humiliation totale, comme en témoigne l'occupation par la France, l'URSS, la Grande-Bretagne et les États-Unis d'Amérique.\n\nMais nous avons désormais une nouvelle chance de rétablir la démocratie allemande. Le Conseil parlementaire, composé d'anciens démocrates actifs et résistants, s'est réuni à Bonn pour rédiger une constitution pour la nouvelle Allemagne. Une constitution qui protège activement la démocratie en Allemagne et qui, espérons-le, évite un autre type de prise de pouvoir autoritaire. Les premières élections auront lieu prochainement."
 WGR_StartEvent.1.a: "Pour une Allemagne démocratique !" 
 
 WGRElection.1.d: "Les dernières élections véritablement libres du Reichstag ont eu lieu en 1932, avant le démantèlement de la démocratie allemande sous le régime nazi. Le processus a commencé avec la loi d'habilitation de 1933, qui a concentré le pouvoir législatif entre les mains du chancelier, contournant le Reichstag. Après la mort du président du Reichspräsident Paul von Hindenburg, Hitler fusionna les fonctions de chancelier et de président, créant ainsi le poste de Führer et éliminant tout contrôle démocratique. Aujourd'hui, pour la première fois depuis près de deux décennies, une véritable démocratie est sur le point de revenir.\n\nLe Bundestagswahl de 1949 sera la première élection nationale libre dans les régions occidentales de l'Allemagne depuis 1932. Deux partis dominants se disputent le contrôle du nouveau gouvernement.\n\nL'Union chrétienne-démocrate, dirigée par l'ancien maire de Cologne Konrad Adenauer, se présente comme un rempart contre le socialisme et le fascisme. La CDU plaide pour l'intégration occidentale, la mise en oeuvre de l'économie sociale de marché, la réforme monétaire et la restauration de la souveraineté allemande en tant qu'égale parmi les grandes puissances européennes. Le parti tire une grande partie de sa direction d'anciens politiciens du Zentrum et cherche à reconstruire l'Allemagne dans un cadre démocratique et pro-occidental.\nLe Parti social-démocrate, dirigé par Kurt Schumacher, ancien combattant et prisonnier des camps de concentration, est l'un des mouvements politiques les plus anciens d'Allemagne et le seul parti à s'être unanimement opposé à la loi d'habilitation de 1933. Le SPD rejette à la fois le communisme et les vestiges du national-socialisme, se positionnant comme le défenseur de la démocratie et des droits des travailleurs. Le parti appelle à un secteur social fort, à la protection des droits du travail, à l'éradication de l'ancienne influence nazie et à une approche prudente des relations avec les puissances occidentales afin de préserver la souveraineté allemande.\nUn parti minoritaire encore capable d'exercer une certaine influence est le Parti communiste allemand, qui, selon la rumeur, bénéficie de l'aide soviétique. Ils plaident pour que les puissances occidentales mettent fin à l'occupation et quittent l'Allemagne, tout en appelant à la réunification de l'Allemagne sous un régime socialiste.\n\nCette élection déterminera non seulement le leadership de l'Allemagne, mais déterminera également son rôle dans la guerre froide. Les enjeux sont élevés et la participation devrait être importante. Comme l'a souligné le candidat de la CDU, Konrad Adenauer, dans un récent discours :\n\n\"Le 14 août 1949, personne ne restera chez soi.\""
 WGRElection.2.d: "Le prochain Bundestagswahl de 1953 marque la deuxième élection fédérale de la République fédérale d'Allemagne et la première dans un État ouest-allemand pleinement souverain après la ratification du Traité général. Alors que la guerre froide s'intensifie et que le paysage politique et économique allemand se transforme rapidement, ces élections détermineront si le pays continue sur la voie actuelle de l'intégration occidentale ou s'oriente vers une approche plus indépendante ou plus sociale.\n\nLa CDU, dirigée par le chancelier Konrad Adenauer, se présente aux élections comme la force dominante de la politique ouest-allemande. Le gouvernement d'Adenauer a supervisé une reprise économique rapide dans le cadre de l'économie sociale de marché, des négociations sur le réarmement et un renforcement des liens avec l'OTAN et les Alliés occidentaux.\n\nLe SPD, toujours dirigé par Erich Ollenhauer après le décès de Kurt Schumacher, reste le principal challenger de la CDU. Tout en continuant de rejeter le communisme, le SPD critique le réarmement et l'alignement étroit d'Adenauer sur l'Occident, craignant que cela ne compromette la souveraineté allemande. Le parti plaide pour de meilleures politiques de protection sociale, une protection du travail plus forte et une politique étrangère plus neutre. Cependant, avec l'accélération de la croissance économique sous le gouvernement dirigé par la CDU, le SPD fait face à une bataille difficile pour convaincre les électeurs de la nécessité d'un changement.\n\nD'autres partis, comme le Parti libéral-démocrate et Deutsche Partei, jouent un rôle influent mais secondaire, agissant souvent comme des faiseurs de rois dans les négociations de coalition. Pendant ce temps, le Parti communiste allemand se débat sous le contrôle du gouvernement et dans l'opposition croissante de l'opinion publique aux politiques alignées sur l'Union soviétique, son influence étant en déclin constant."
 WGRElection.2.da: "Le Bundestagswahl de 1953 est crucial, alors que le pays se prépare à choisir son plat principal pour les années à venir. Après quatre années de gouvernance dirigée par le SPD, le paysage politique a considérablement changé. La guerre froide s'est approfondie, la reprise économique de l'Allemagne s'est accélérée et les débats sur le réarmement, l'intégration européenne et la politique sociale se sont intensifiés.\n\nLes sociaux-démocrates font campagne sur leur bilan en matière de reconstruction de l'Allemagne avec des politiques sociales fortes, une approche prudente de l'intégration occidentale et une opposition à un réarmement rapide. La chancelière [WGR.GetLeader] poursuit la vision de Schumacher d'une Allemagne démocratique et indépendante, équilibrant la coopération avec l'Occident tout en préservant une identité nationale forte.\n\nLa principale force d'opposition, l'Union chrétienne-démocrate, dirigée par Konrad Adenauer, plaide pour un engagement plus fort en faveur de l'intégration occidentale, d'une économie de marché et d'un réarmement plus rapide face aux menaces soviétiques. Adenauer et ses alliés ont critiqué la réticence du SPD à adhérer pleinement à l'OTAN et à sa politique étrangère prudente, arguant que seule une alliance occidentale ferme peut garantir la sécurité et la souveraineté de l'Allemagne. La CDU a gagné du terrain ces dernières années, séduisant ceux qui estiment que la croissance économique doit primer sur les politiques sociales menées par l'État.\n\nD'autres partis, tels que le Parti libéral-démocrate et le Deutsche Partei, continuent de jouer des rôles importants mais secondaires, agissant souvent comme partenaires potentiels de coalition. Pendant ce temps, le Parti communiste allemand, dirigé par Max Reimann, reste une force marginale, aux prises avec une pression politique croissante et un soutien public en déclin dans une Allemagne qui s'aligne de plus en plus sur l'Occident."
 WGRElection.3.d: "Le Bundestagswahl de 1957 marque un moment décisif pour la République fédérale d'Allemagne. Huit ans après la fondation de l'Allemagne de l'Ouest, le pays a connu une croissance économique remarquable, une stabilisation politique et une intégration croissante avec l'alliance occidentale. Alors que les Allemands se rendent aux urnes, le résultat de ces élections déterminera l'orientation de la nation, dans un contexte de tensions liées à la guerre froide et de débats en cours sur le réarmement, l'unité européenne et la politique sociale.\n\nLa CDU, dirigée par le chancelier Konrad Adenauer, cherche à renouveler son mandat. Après avoir dirigé l'Allemagne à travers le Wirtschaftswunder, la CDU fait campagne sur un programme de stabilité, de prospérité et de poursuite de l'intégration occidentale. Le gouvernement Adenauer a supervisé la formation de la Communauté économique européenne, l'adhésion à l'OTAN et le rétablissement de la Bundeswehr, positionnant ainsi l'Allemagne de l'Ouest comme un acteur clé en Europe occidentale.\n\nUne fois de plus, les sociaux-démocrates contestent la ligne d'Adenauer, plaidant pour une approche plus équilibrée entre l'Est et l'Ouest et pour des mesures sociales plus importantes pour lutter contre les inégalités économiques. Le SPD a critiqué la politique de réarmement de la CDU, mettant en garde contre une dépendance accrue à l'égard de l'alliance militaire occidentale. Tout en étant attaché à la démocratie et rejetant le communisme, le SPD plaide pour une politique étrangère plus indépendante et une protection plus forte des travailleurs.\n\nD'autres partis, comme le Parti libéral-démocrate et le Deutsche Partei, restent pertinents mais luttent contre la domination de la CDU et du SPD. Pendant ce temps, le KPD reste interdit après sa dissolution en 1956, supprimant la représentation communiste de cette élection.\n\nLa CDU étant largement favorisée, la question clé demeure : Adenauer obtiendra-t-il la majorité absolue, ou les pourparlers de coalition définiront-ils le prochain gouvernement ?"
 WGRElection.3.da: "Sous la direction du Parti social-démocrate depuis 1949, l'Allemagne de l'Ouest a connu une reprise économique significative, une stabilisation politique et une autodétermination croissante sur la scène mondiale. Alors que les tensions de la Guerre froide s'accentuent et que la place du pays en Europe évolue, ces élections définiront la prochaine phase du développement de l'Allemagne de l'Ouest.\n\nLe SPD, qui dirige le gouvernement depuis huit ans, se présente comme le parti de la stabilité, de la reconstruction et de la souveraineté. Il a supervisé l'expansion économique, les réformes sociales et les efforts visant à remédier au passé nazi, tout en gérant soigneusement les relations avec les Alliés occidentaux et le bloc de l'Est. L'approche du SPD en matière de politique étrangère et d'intégration économique a varié en interne, mais ses dirigeants restent déterminés à garantir l'autodétermination et la sécurité économique de l'Allemagne.\n\nLa CDU, dirigée par Konrad Adenauer, constitue le principal challenger. La CDU soutient que le redressement et la stabilité de l'Allemagne doivent être approfondis davantage grâce à des liens plus forts avec l'Occident, en plaidant pour une intégration européenne accrue, une coopération étroite avec l'OTAN et une approche de politique économique de libre marché. La campagne d'Adenauer présente la CDU comme le parti capable de renforcer le rôle de l'Allemagne dans l'alliance occidentale tout en préservant les valeurs traditionnelles et en garantissant la sécurité nationale. Le KPD reste interdit après sa dissolution en 1956, supprimant la représentation communiste du Bundestag.\n\nAvec l'économie allemande florissante et les relations internationales en pleine évolution, les électeurs décideront si le SPD doit conserver sa direction ou si la CDU prendra les rênes du gouvernement."
 WGRElection.4.d: "Après cinq années de gouvernement militaire, l'Allemagne est à nouveau prête à organiser des élections provisoires. Avec la fracture du SPD, les deux partis en compétition sont désormais l'Union chrétienne-démocrate dirigée par Konrad Adenauer et la coalition du Parti allemand et du Parti libéral-démocrate dirigée par Heinrich Hellwege et Franz Blücher. Qui va gagner ?"
 
 Starting.1.d: "Le 23 mai 1949 restera à jamais un jour mémorable pour l'histoire allemande ! Aujourd'hui, le travail du Conseil parlementaire est devenu réalité avec la signature et la promulgation du Grundgesetz. Composé de membres des parlements des Länder ouest-allemands, le Conseil a rédigé le document et l'a approuvé, par 53 voix contre 12, le 8 mai. Il a ensuite été présenté aux parlements des Länder, et a finalement été approuvé par tous, à l'exception des Lànder bavarois. Ce document, qui prévoit la formation du gouvernement fédéral allemand et accorde des droits cruciaux à tous ses citoyens, marque la fondation de la République fédérale d'Allemagne."
 Starting.2.d: "(1) La République fédérale d'Allemagne est un État fédéral démocratique et social.\n(2) Toute autorité de l'État émane du peuple. Il sera exercé par le peuple lors d'élections et de plébiscites et par l'intermédiaire d'organes législatifs, exécutifs et judiciaires distincts.\n(3) La législation est limitée par la Constitution, le pouvoir exécutif et l'administration de la justice par la législation et la loi.\n\nL'article 20 est l'un des articles fondamentaux de la Loi fondamentale, décrivant la structure gouvernementale de la République fédérale et garantissant la démocratie, le républicanisme, la responsabilité sociale et le fédéralisme, étant plus direct que l'ancienne Constitution de Weimar. De plus, l'article 20 a le privilège de ne pouvoir être retiré de la Loi fondamentale car il garantit la démocratie pour tous."
 Starting.3.d: "\"La présente loi fondamentale s'applique pour l'instant sur le territoire des Laender Baden, Bavière, Brême, Grand Berlin, Hambourg, Hesse, Basse-Saxe, Rhénanie du Nord-Westphalie, Rhénanie-Palatinat, Schleswig-Holstein, Wurtemberg-Baden et Wurtemberg-Hohenzollern. Elle entrera en vigueur pour d'autres régions de l'Allemagne dès leur adhésion.\"\n\nL'article 23 se concentre sur les Lânder, ou États allemands. Les Lânder ont toujours joué un rôle important dans le gouvernement unitaire allemand, et cet article autorise les autres États allemands de jure, non inclus dans le champ d'application de la Loi fondamentale, à déclarer leur adhésion, ou Beitritt, à une date ultérieure. L'objectif est de donner aux Lànder une opportunité équitable de rejoindre la République fédérale, à condition qu'ils soient reconnus par le gouvernement fédéral et déclarent leur adhésion via la libre autodétermination. Il s'agit véritablement d'un moment décisif dans les relations entre le gouvernement fédéral et les Lânder dans la politique allemande."
 
 Adenauer49.1011.t: "Paul Löbe inaugure le premier Bundestag"
 Adenauer49.1011.d: "Même si 17 ans seulement se sont écoulés depuis la dernière élection libre du Reichstag, cela a semblé une éternité pour la majorité des délégués du Bundeshaus à Bonn. L'ancien président Paul Löbe du SPD, qui a été président du Reichstag de 1920 à 1932, a ouvert la première session d'un parlement allemand librement élu depuis 1932, insistant sur la nécessité d'une éventuelle réunification de l'Allemagne, qui sera un point fixe pour l'unité européenne. La salle plénière a éclaté sous des acclamations intenses, pour ensuite donner lieu à de violentes disputes suite à la dénonciation par Löbe du passé national-socialiste et de la culpabilité de l'Allemagne qui en résulte.\n\nLa victoire de Konrad Adenauer aux élections à la Chancellerie a surpris non seulement les sociaux-démocrates, mais aussi les autres partis du Bundestag. Désormais, les démocrates-chrétiens doivent tendre la main à des alliés potentiels afin de former une coalition capable de réunir plus de 50 % des mandats requis pour l'adoption régulière de lois."
 Adenauer49.1011.a: "Mettons-nous au travail."

 Adenauer49.1111.t: "L'unification du Bade-Wurtemberg"
 Adenauer49.1111.d: "Après l'établissement de l'occupation alliée dans les parties occidentales de l'Allemagne, l'ancienne structure administrative du Reich allemand a été abolie par les Alliés occidentaux, les remplaçant par de nouveaux États fédéraux dans toute la Trizone. Trois d'entre eux constituent les territoires du Bade, du Wurtemberg et du Wurtemberg-Hohenzollern, qui constituent désormais un nouveau champ de bataille politique dans la politique fédérale.\n\nLes sociaux-démocrates soutiennent l'unification de ces trois États en un \"Südweststaat\" uni. Un État unifié, affirmaient-ils, serait un partenaire plus fort dans la jeune fédération, mieux à même de subvenir aux besoins de sa population et de contribuer au Wirtschaftswunder.\n\nOutre la fierté régionale et les vues traditionalistes, enracinées dans la fierté historique, la CDU soutient le statu quo, en maintenant la région séparée et en maintenant une partie des gouvernements locaux, ce qui donne essentiellement plus de mandats au Bundesrat, la deuxième chambre du parlement allemand, dont l'approbation est nécessaire pour divers types de lois. Si les Länder devaient être unifiés, le SPD rassemblerait sans aucun doute la majorité politique et mettrait ainsi fin à la domination de la CDU."
 Adenauer49.1111.a: "Écoutez le peuple. L'unification est leur volonté."
 Adenauer49.1111.b: "Déclarer le référendum inconstitutionnel."
 
 Adenauer49.1211.t: "Allier les Démocrates Libres ?"
 Adenauer49.1211.d: "Renaître des cendres de la guerre, l'ancien Parti démocrate allemand de gauche et le Parti populaire national-libéral allemand de la Première République se sont réunis dans la ville d'Heppenheim pour surmonter la scission traditionnelle du libéralisme allemand, formant le Parti libre-démocrate nouvellement créé. Ayant remporté 12 % des voix, ainsi que la première présidence fédérale sous la présidence de Theodor Heuss, le FDP constituerait un partenaire de coalition privilégié, partageant essentiellement nos points de vue sur les questions économiques, sociales et nationales allemandes. Cependant, leurs points de vue différents sur la structure d'une économie de marché (privilégiant les marchés libres plutôt que les marchés sociaux), ainsi que leur position ferme en faveur de la laïcité."
 Adenauer49.1211.a: "Bienvenue à bord."
 
 Adenauer49.1311.t: "Rapprochement avec le parti allemand"
 Adenauer49.1311.d: "Issu des traditions de l'ancien parti germano-hanovrien, le Parti allemand (DP) est apparu comme une force nettement conservatrice et régionale, principalement enracinée dans les campagnes protestantes de Basse-Saxe. Obtenant 4% des voix, leurs 17 sièges se sont révélés cruciaux dans la construction de notre coalition bourgeoise. Le PD représente une aile profondément nationale-conservatrice de la politique allemande, faisant appel aux valeurs traditionnelles et à un fort sentiment d'identité allemande. Leur farouche anticommunisme et leur soutien à un système de libre entreprise s'alignent bien avec nos principes économiques fondamentaux, ce qui en fait un allié naturel contre les plans socialistes du SPD. Cependant, leurs sentiments monarchistes manifestes et leur forte focalisation fédéraliste, presque particulariste, sur les droits des États nécessitent une gestion prudente au sein de la coalition."
 Adenauer49.1311.a: "Au plaisir de faire affaire avec vous."
 
 Adenauer49.1411.t: "Envie de pourparlers avec le SPD ?"
 Adenauer49.1411.d: "Même si notre coalition détiendra très probablement une solide majorité au Bundestag, l'arithmétique politique au Bundesrat constitue un défi persistant. Les socialistes, qui dirigent plusieurs gouvernements d'États clés, exercent une influence considérable à la chambre haute, menaçant de bloquer des lois essentielles. Cela nous impose un choix stratégique difficile. Devons-nous faire des concessions au SPD pour garantir l'adoption sans heurts de nos lois, en particulier celles vitales pour la reconstruction économique et notre intégration occidentale ? Cela pourrait être considéré comme une nécessité pragmatique pour éviter une impasse législative. Cependant, céder à leurs exigences diluerait notre mandat politique, compromettrait nos principes d'économie sociale de marché et risquerait de paraître faible. Nous devons soigneusement évaluer, au cas par cas, si le prix de leur coopération vaut la peine d'être payé, de peur que l'ensemble de notre programme gouvernemental ne soit soumis aux caprices de l'opposition."
 Adenauer49.1411.a: "C'est nécessaire."
 Adenauer49.1411.b: "Je préfère regarder Paint sécher."
  
 Adenauer49.0.t: " [GetNewspaperHeader] Konrad Adenauer élu Bundeskanzler d'Allemagne de l'Ouest"
 Adenauer49.0.d: "Au lendemain des élections fédérales de 1949 en Allemagne, Konrad Adenauer et les chrétiens-démocrates ont réussi à former une coalition avec le Parti libéral-démocrate et le Parti allemand pour obtenir la majorité au Parlement ouest-allemand. En battant les sociaux-démocrates et le Parti communiste, Adenauer a exprimé l'engagement de sa coalition en faveur de la démocratie, de la reprise économique et de l'alignement avec l'Occident. Ils se sont engagés à renforcer l'économie allemande grâce au plan Marshall tout en résistant à l'influence soviétique et en resserrant leurs liens avec les États-Unis, la Grande-Bretagne et la France. Les dirigeants occidentaux ont accueilli son élection comme une force stabilisatrice, tandis que l'Union soviétique l'a condamné comme une « marionnette de l'impérialisme américain ». Malgré la victoire, des défis subsistent, notamment les difficultés économiques, les populations déplacées et la question du réarmement. Adenauer vise à guider l'Allemagne vers une plus grande souveraineté tout en maintenant une ferme opposition à l'Allemagne de l'Est soutenue par les Soviétiques."
 Adenauer49.0.a: "Ce sera un plaisir de travailler avec lui."
 Adenauer49.0.b: "Juste une autre marionnette américaine."
 Adenauer49.0.c: "Une coalition conservatrice pour l'Allemagne."
 
 Adenauer49.1.d: "Le débat sur la nouvelle capitale de la République fédérale fait rage au nouveau Bundestag. Actuellement, la capitale est située dans la ville occidentale de Bonn, sur les rives du Rhin. Cependant, des membres du SPD ont plaidé en faveur d'un transfert de la capitale vers la ville de Francfort, arguant que la ville dispose déjà des installations nécessaires et que cela coûterait 95 millions de marks moins cher. Cependant, les membres de la CDU s'y opposent, arguant que Bonn est la capitale provisoire et que la capitale ne devrait pas être déplacée tant que l'ensemble de l'Allemagne n'est pas réunifiée. Où sera la capitale ?"
 Adenauer49.2.d: "« Je crains que les Alliés occidentaux, au lieu de poursuivre une politique européenne, ne se lancent dans une politique d'intérêt qui tend plutôt à soutenir un régime autoritaire d'Adenauer qu'à permettre son remplacement par un régime démocratique... Ce sur quoi nous devons débattre et voter aujourd'hui n'est rien d'autre qu'un test pour savoir si la Loi fondamentale n'est qu'un bout de papier et si la majorité peut continuer ses efforts pour la fouler aux pieds... »\n\nCela a suscité des applaudissements du côté du SPD, ainsi que des interjections et des huées du côté de la CDU au Bundestag. Herr Doktor Arndt du SPD a continué à parler.\n\n\"Nous pensions que nous étions sur la voie d'une démocratie parlementaire et nous nous trouvons sur la voie d'une monarchie sans constitution... Monsieur le Chancelier, nous ne vous laisserons pas oublier ce serment !\"\n\nLe chancelier Adenauer a pris la parole, soulignant que les syndicats allemands soutenaient le gouvernement dans sa volonté sincère de signer l'accord de Petersberg, même si celui-ci concernait le démantèlement des industries. Cela a suscité des interrogations de la part de l'opposition du SPD, remettant en question la validité de cette affirmation. Ce débat continue de faire rage, mais une décision doit être prise rapidement."
 
 Adenauer49.20.t: "[GetNewspaperHeader] L'Allemagne de l'Ouest signe les accords de Petersberg"
 Adenauer49.20.d: "À un moment historique pour la nouvelle République fédérale d'Allemagne, la Chancellerie et les représentants des Alliés occidentaux ont signé aujourd'hui les accords de Petersberg, ouvrant ainsi la voie à la réintégration progressive de l'Allemagne de l'Ouest dans la communauté internationale. L'accord, signé à l'hôtel Petersberg près de Bonn, marque une étape précoce mais significative dans le redressement et la souveraineté du pays d'après-guerre.\nAux termes de l'accord, la Haute-commission alliée a accepté d'assouplir certaines restrictions imposées à l'industrie allemande, permettant ainsi une augmentation de la production de charbon et d'acier, une mesure cruciale pour la reconstruction économique. L'Allemagne de l'Ouest sera également autorisée à rejoindre les organisations internationales et à jouer un rôle plus actif dans les affaires européennes. Cet accord a toutefois un coût : Bonn s'est engagé à démanteler plusieurs installations industrielles datant de la guerre et a formellement renoncé à toute prétention au réarmement, du moins pour le moment.\nMalgré la controverse, la signature des accords de Petersberg est un signal clair que l'Allemagne de l'Ouest commence à se débarrasser de son statut d'État occupé. Même si le chemin vers l'indépendance totale reste long, l'accord d'aujourd'hui marque la première étape pour façonner l'avenir de la nation sur la scène mondiale."
 Adenauer49.20.a: "Splendide."
 Adenauer49.20.b: "Que cherchent-ils à réaliser ?"
 Adenauer49.20.c: "Notre façon de soutenir l'intégration occidentale."
 
 Adenauer49.21.t: "[GetNewspaperHeader] L'Allemagne de l'Ouest rejette les accords de Petersberg"
 Adenauer49.21.d: "Dans une tournure étonnante des événements, la République fédérale d'Allemagne a refusé de signer les accords de Petersberg, plongeant dans l'incertitude les relations entre l'Allemagne de l'Ouest et les Alliés occidentaux. Le gouvernement fédéral, soutenu par une majorité du Bundestag, a rejeté ces conditions, les jugeant trop restrictives, arguant qu'elles laisseraient l'Allemagne de l'Ouest économiquement dépendante et politiquement contrainte sous la surveillance continue des Alliés.\n\nL'accord, proposé par la Haute-commission alliée, visait à assouplir certaines restrictions industrielles tout en garantissant que l'Allemagne reste désarmée et conforme aux directives alliées. Cependant, le législateur allemand s'est montré réticent face à la poursuite du démantèlement d'installations industrielles clés et à l'absence d'une voie claire vers la pleine souveraineté.\n\nAvec la montée des tensions, l'avenir reste incertain. Les Alliés chercheront-ils à imposer des mesures plus strictes ou retourneront-ils à la table des négociations ? Et les Allemands peuvent-ils maintenir leur position sans mettre en péril leur fragile économie d'après-guerre ? Une chose est claire : le chemin de l'Allemagne de l'Ouest vers la souveraineté est devenu bien plus compliqué."
 Adenauer49.21.a: "Ils ne peuvent pas être sérieux à ce sujet."
 Adenauer49.21.b: "Une décision importante pour l'Allemagne."
 Adenauer49.21.c: "Nous avons pris notre décision."
 
 Adenauer49.3.d: "Le 29 décembre 1948, les trois Alliés occidentaux ainsi que les trois pays du Benelux édictèrent le Statut de la Ruhr, un système spécial régissant le fonctionnement de l'industrie de la Ruhr. L'Autorité de la Ruhr prévue par le Statut, un organe composé de représentants des six puissances, a été créée le 28 avril 1949, prévoyant notamment la présence de représentants de la République fédérale en tant que membres de l'Autorité.\n\nCela provoqua un conflit d'opinions entre le gouvernement et surtout l'opposition social-démocrate sur une question étroitement liée au problème du démantèlement, à savoir celle de la reconnaissance de l'Autorité de la Ruhr par l'envoi d'un représentant allemand. En pratique, la fonction de cette autorité équivaudrait à contrôler l'ensemble de l'économie allemande en raison de l'importance écrasante de la zone industrielle de la Ruhr pour toute la vie économique de l'Allemagne.\n\nLors d'un conseil des ministres, le chancelier Adenauer a expliqué que la participation au statut aurait des conséquences favorables ; si nous refusions, cela équivaudrait à une obstruction, et donc à un dégel dans les relations alliées.\n\nCependant, l'autre argument était qu'au niveau national, l'adhésion ne serait pas populaire et que le soutien du gouvernement vacillerait, en particulier lors des élections au Landtag en Rhénanie du Nord-Westphalie. Dans quelle direction l'Allemagne doit-elle aller ?"
 
 Adenauer49.30.t: "L'Allemagne de l'Ouest exige le retrait total de l'Autorité de la Ruhr"
 Adenauer49.30.d: "La République fédérale d'Allemagne a officiellement déposé une demande de dissolution de l'Autorité internationale de la Ruhr (IAR) et de restitution au gouvernement ouest-allemand du contrôle total des ressources industrielles de la Ruhr. Le chancelier Adenauer et son administration affirment que le maintien d'une surveillance étrangère sur la Ruhr constitue une atteinte à la souveraineté allemande et un obstacle à la stabilité économique à long terme.\n\nLa position allemande repose sur trois points clés.\nPremièrement, Bonn insiste sur le fait que la reprise économique ne peut être réalisée sans une autonomie totale en matière de production de charbon et d'acier. La Ruhr reste l'épine dorsale de l'industrie allemande et les restrictions imposées à sa gestion entravent la reconstruction nationale.\nDeuxièmement, l'Allemagne considère l'Autorité de la Ruhr comme un vestige de l'occupation d'après-guerre. Avec un gouvernement démocratique désormais en place, ils affirment que rien ne justifie un contrôle externe sur les ressources allemandes.\nTroisièmement, les dirigeants ouest-allemands ont assuré que la reprise du contrôle de la Ruhr n'entraînerait pas un nationalisme économique mais renforcerait plutôt la coopération au sein des institutions européennes émergentes."
 Adenauer49.30.a: "Leur engagement à Petersberg a montré que nous pouvons leur faire confiance."
 Adenauer49.30.b: "Ils nous ont déjà dénoncés à Petersberg, il n'y aura pas de nouvelle politique d'apaisement."
 
 Adenauer49.31.t: "La Haute Commission Alliée refuse notre Demande !"
 Adenauer49.31.d: "La réponse de la Haute-Commission alliée fut ferme : la demande de l'Allemagne de l'Ouest de reprendre le contrôle de la Ruhr avait été rejetée. Le message, reçu à Bonn, citait les préoccupations sécuritaires et économiques persistantes comme principales raisons de cette décision. La Ruhr, affirmaient les Alliés, était trop cruciale pour la stabilité européenne pour être placée uniquement sous administration allemande à ce stade.\n\nLes Français, en particulier, restaient opposés à tout contrôle allemand sans restriction sur la vaste capacité industrielle de la région, craignant une répétition des conflits passés. L'Autorité internationale existante pour la Ruhr resterait en place, garantissant que la production de charbon et d'acier serait distribuée sous la supervision des Alliés. Au lieu d'un rejet catégorique, les Alliés ont encouragé l'Allemagne à rechercher une plus grande influence grâce à l'intégration économique européenne, en particulier au projet de Communauté européenne du charbon et de l'acier."
 Adenauer49.31.a: "Scheisse."

 Adenauer49.32.t: "La Haute Commission Alliée accepte notre demande !"
 Adenauer49.32.d: "Après des semaines de délibérations, la Haute Commission alliée parvient finalement à une décision sur l'avenir de la Ruhr. Le message, délivré à la Chancellerie fédérale en [WGR.Capital.GetCapitalVictoryPointName], a confirmé ce que beaucoup dans l'administration Adenauer avaient espéré : le retour progressif du contrôle sur le coeur industriel de l'Allemagne. La décision n'était pas sans conditions. Les Alliés ont clairement indiqué que le transfert de pouvoir se déroulerait en phases soigneusement gérées, garantissant que la puissance économique de la région ne serait pas exercée sans contrôle.\n\nSelon les termes de l'accord, l'Allemagne de l'Ouest assumerait le contrôle administratif de la Ruhr dans un délai de 12 à 18 mois, mais la surveillance internationale persisterait, notamment en ce qui concerne les exportations de charbon et d'acier. Les puissances alliées espéraient que la pleine participation allemande aux structures économiques européennes émergentes, en particulier à la Communauté européenne du charbon et de l'acier, garantirait que les ressources de la Ruhr serviraient un intérêt continental plus large. Les Français, toujours méfiants à l'égard de la puissance industrielle allemande, restent prudents mais finissent par accepter le compromis."
 Adenauer49.32.a: "Très agréable."
 
 Adenauer49.33.t: "Embargo sur le charbon en Allemagne de l'Ouest"
 Adenauer49.33.d: "Le gouvernement ouest-allemand a lancé une attaque économique contre la République démocratique allemande en arrêtant les exportations de charbon, menaçant ainsi notre industrie et nos travailleurs. Cet acte délibéré de sabotage, dirigé par les forces impérialistes, vise à déstabiliser notre progrès socialiste. Cependant, notre République reste ferme, garantissant l'approvisionnement en charbon grâce à la coopération socialiste et assurant la continuité de la production. Cette agression révèle l'hypocrisie des propagandistes occidentaux qui prétendent soutenir l'unité allemande tout en approfondissant la division. Le peuple de la RDA restera résolu et surmontera ce défi avec un engagement inébranlable en faveur du socialisme."
 Adenauer49.33.a: "Bâtard."
 
 Adenauer49.101.t: "Le premier congrès du parti CDU"
 Adenauer49.101.d: "Au théâtre Odéon de Goslar, s'est inauguré hier le premier Bundesparteitag de l'Union démocratique chrétienne, qui marque une étape clé dans la consolidation politique de la jeune République fédérale. C'est sous un ton solennel que l'Ouverture Egmont de Beethoven a donné un ton solennel. Le chancelier fédéral Konrad Adenauer a prononcé le discours d'ouverture, exhortant les délégués à rester résolument sur le « chemin de la liberté ». Il a mis en garde contre la menace croissante posée par le totalitarisme soviétique et a souligné la responsabilité de l'Allemagne de se tenir aux côtés de l'Occident dans la défense de la démocratie et des valeurs chrétiennes.\n\nLe congrès a formalisé ce qui était jusqu'ici une alliance lâche d'associations régionales en un parti fédéral unifié. Même si la CDU dirigeait le gouvernement fédéral depuis 1949, il s'agissait de sa première réunion organisationnelle nationale. Adenauer, élu premier président national du parti avec 302 voix, a été rejoint par Jakob Kaiser et Friedrich Holzapfel comme adjoints. Les délégués ont également officiellement adopté les statuts du parti et ont promis leur engagement en faveur de la démocratie parlementaire, de la responsabilité sociale et de la coopération européenne.\n\nLa CDU a souligné une rupture nette avec le totalitarisme de l'Est et les éléments révolutionnaires au sein du SPD, tout en affirmant sa propre vision d'une société chrétienne-démocrate. Le plaidoyer du ministre de l'Économie Ludwig Erhard en faveur de la Soziale Marktwirtschaft a rencontré un fort soutien, reflétant la confiance croissante du parti dans la détermination de l'avenir politique et économique de l'Allemagne. Sous la devise Einigkeit und Recht und Freiheit, la CDU se présente désormais comme une force pleinement constituée dans la vie politique de la république."
 Adenauer49.101.a: "Un toast à l'avenir de l'Allemagne !"
 
 Adenauer49.102.t: "Assistance à l'organisation Gehlen"
 Adenauer49.102.d: "L'Organisation Gehlen s'est révélée être un atout vital dans la lutte contre l'infiltration communiste. Ses opérations vont de la surveillance des activités de gauche au retour secret des prisonniers de guerre allemands d'Union soviétique. Il a également contribué à la relocalisation discrète d'anciens nationaux-socialistes, préservant ainsi un savoir-faire précieux pendant cette période de transition.\n\nCompte tenu de son efficacité à préserver la sécurité et la stabilité nationales, un soutien accru à Reinhard Gehlen et à son organisation est à la fois justifié et nécessaire. Quels types de ressources devons-nous privilégier ?"
 Adenauer49.102.a: "Aider à l'espionnage envers les sociaux-démocrates."
 Adenauer49.102.b: "Ramener les prisonniers de guerre allemands chez eux devrait être notre priorité numéro un."
 Adenauer49.102.c: "La réhabilitation des anciens responsables de la Gestapo et de l'Abwehr devrait être utile."
 
 Adenauer49.103.t: "L'Allemagne de l'Ouest demande la libération de nombreux anciens nationaux-socialistes"
 Adenauer49.103.d: "Suite à une procédure standard des exercices d'occupation alliés, le gouvernement fédéral de la République fédérale d'Allemagne nous a adressé une demande controversée. Ils ont demandé la réintégration de plusieurs anciens nationaux-socialistes dans des fonctions publiques. La demande fait état du besoin urgent de personnel expérimenté dans les domaines de l'administration, de la sécurité et de la reconstruction, en particulier dans le contexte de tensions croissantes entre l'Est et l'Ouest. Le gouvernement chrétien-démocrate affirme que nombre de ces individus possèdent des connaissances techniques et institutionnelles essentielles au fonctionnement de la bureaucratie allemande.\n\nMême si la Commission comprend ces préoccupations pratiques, elle doit les mettre en balance avec les principes plus larges de justice et du processus de dénazification. La réintégration de ces personnes risque non seulement de saper à la fois la confiance du public et les fondements moraux, mais elle menace également notre image internationale, notamment à l'égard de l'Union soviétique et du bloc de l'Est."
 Adenauer49.103.a: "Nous fermerons les yeux."
 Adenauer49.103.b: "N'ont-ils rien appris ?"
 Adenauer49.103.c: "Nous laissons cette décision aux États-Unis."
 
 Adenauer49.104.t: "Les Alliés acceptent notre demande"
 Adenauer49.104.d: "La Haute-commission alliée a accepté, en principe, une réintégration limitée des anciens nationaux-socialistes dans la fonction publique. Tout en maintenant la surveillance, la Commission reconnaît le besoin de la République fédérale d'administrateurs expérimentés dans un contexte de responsabilités croissantes et de pressions extérieures.\n\nToutefois, chaque cas nécessitera un examen individuel, et les Alliés ont souligné l'importance de la discrétion morale et de la responsabilité démocratique."
 Adenauer49.104.a: "Intestin."
 
 Adenauer49.105.t: "Les Alliés rejettent notre demande"
 Adenauer49.105.d: "La Haute Commission alliée a rejeté la demande du gouvernement fédéral visant à réintégrer d'anciens nationaux-socialistes dans la fonction publique. La Commission prévient que de telles mesures saperaient la confiance du public et compromettraient l'intégrité du processus de dénazification.\n\nTout en reconnaissant les difficultés administratives, les Alliés insistent sur le fait que la reconstruction doit être fondée sur la justice et une rupture nette avec le passé. La porte à de futures discussions reste ouverte, mais pour l'instant, la demande est formellement refusée."
 Adenauer49.105.a: "Ce n'est pas fini."
 
 Adenauer49.106.t: "Le Straffreiheitsgesetz de [GetYear]"
 Adenauer49.106.d: "Suite aux efforts de dénazification entrepris par les autorités alliées, un nombre important d'Allemands furent condamnés pour des associations relativement mineures ou des infractions administratives. Beaucoup de ces individus ont été condamnés à des peines de prison ou contraints de payer des amendes substantielles, souvent disproportionnées par rapport au degré réel de leur implication.\n\nAprès avoir examiné ces pratiques, l'Union chrétienne-démocrate a conclu que ces condamnations étaient, dans de nombreux cas, injustes et ont entravé la réintégration des personnes concernées dans la société d'après-guerre. En réponse, la Bürgerliche Koalition a présenté au Bundestag un projet de loi d'amnistie (Straffreiheitsgesetz).\n\nLa législation proposée vise à annuler ces condamnations moindres et à restaurer la qualité civile de milliers de citoyens. Les partisans soutiennent que cette mesure est vitale non seulement pour apaiser les divisions sociales, mais aussi pour obtenir un soutien public plus large et renforcer les fondations de la République fédérale.\n\nAvec le projet actuellement à l'étude, l'attention se tourne vers les détails et les extensions possibles du Straffreiheitsgesetz - une loi qui pourrait façonner le paysage moral et juridique de l'Allemagne de l'Ouest d'après-guerre."
 Adenauer49.106.a: "Mettons-nous au travail."
 
 Adenauer49.107.t: "La prolongation de l'amnistie"
 Adenauer49.107.d: "Alors que le Bundestag débat du Straffreiheitsgesetz, un point de discorde clé est apparu : l'étendue de la portée juridique de l'amnistie. Certains membres de la Bürgerliche Koalition préconisent de limiter cette mesure aux infractions passibles d'une peine maximale de six mois ou d'une amende pouvant aller jusqu'à 5 000 marks allemands, soulignant la prudence et la nécessité de maintenir la confiance du public.\n\nD'autres, cependant, plaident pour une inclusion plus large, en étendant l'amnistie aux peines allant jusqu'à deux ans et aux amendes allant jusqu'à 10 000 Deutschmarks. Ils soutiennent qu'une portée plus large est essentielle pour une réintégration significative, en particulier pour ceux qui sont pris dans les phases les plus punitives de la dénazification précoce."
 Adenauer49.107.a: "Les délits mineurs jusqu'à 5 000 Mark ou 6 mois de prison seront annulés."
 Adenauer49.107.b: "La limite ira jusqu'à 10 000 Mark et 2 ans de prison."
 
 Adenauer49.108.t: "Le statut des clandestins"
 Adenauer49.108.d: "Alors que les discussions autour du Straffreiheitsgesetz se poursuivent, la question des soi-disant « illégaux » - des individus qui ont falsifié ou caché leur identité pour échapper à leurs responsabilités après la guerre - reste politiquement et moralement sensible. Beaucoup de ces individus sont réintégrés dans la société sous des noms d'emprunt, obtenant souvent un emploi ou même des postes officiels sans jamais être confrontés à la dénazification. Certains soutiennent qu'ils devraient désormais être régularisés dans le cadre de l'amnistie, invoquant leur réintégration réussie et la nécessité de clore un chapitre difficile de l'histoire nationale.\n\nLes opposants préviennent que légitimer une telle tromperie risque de saper l'ordre juridique et la crédibilité de la justice d'après-guerre. Selon eux, pardonner à ceux qui ont délibérément échappé à leurs responsabilités récompenserait la malhonnêteté et trahirait ceux qui respectaient la loi."
 Adenauer49.108.a: "Nous les accueillerons à nouveau dans la société."
 Adenauer49.108.b: "Le statu quo prévaudra."
 
 Adenauer49.109.t: "Cumul de pénalités"
 Adenauer49.109.d: "Une question clé dans le débat du Straffreiheitsgesetz concerne les personnes qui ont reçu plusieurs sanctions mineures - chacune inférieure à six mois ou 5 000 marks, mais qui, ensemble, dépassent ces limites.\nLes uns soutiennent que chaque infraction devrait être graciée séparément, dans la mesure où bon nombre de ces cas découlent d'une dénazification précoce trop zélée et devraient être effacés pour favoriser la réintégration. D'autres suggèrent d'ajuster la peine combinée pour rester dans les limites de l'amnistie, en préservant la proportionnalité légale sans offrir une absolution globale."
 Adenauer49.109.a: "Ils seront tous graciés."
 Adenauer49.109.b: "Les pénalités seront ajustées."
 
 Adenauer49.110.t: "La rédaction est terminée."
 Adenauer49.110.d: "Après avoir passé avec succès les trois lectures au Bundestag et approuvé par le Bundesrat, le Straffreiheitsgesetz a désormais achevé le processus législatif. Après avoir été signée par le Président fédéral et contresignée par les ministres responsables, la loi a été publiée au Bundesgesetzblatt et est officiellement entrée en vigueur.\n\nLa République fédérale accorde ainsi une amnistie limitée pour les délits mineurs commis pendant la période d'après-guerre, marquant ainsi une étape importante vers la normalisation juridique et la réinsertion sociale."
 Adenauer49.110.a: "Magnifique."
 Adenauer49.110.b: "Magnifique."
 Adenauer49.110.c: "Magnifique."
 Adenauer49.110.e: "Magnifique."
 Adenauer49.110.f: "Magnifique."
 
 Adenauer49.111.t: "La loi 131 de [GetYear]"
 Adenauer49.111.d: "Suite à la capitulation de la Wehrmacht et à la dissolution du régime national-socialiste, de nombreux anciens bureaucrates, enseignants, avocats et fonctionnaires du gouvernement ont été expulsés de leur emploi dans le cadre de la dénazification alliée. Alors que les hauts fonctionnaires sont censés rester hors service dans l'Allemagne d'après-guerre, nous devons à nouveau doter nos universités et nos tribunaux d'un personnel efficace. La réadaptation est essentiellement une nécessité, mais cela dépendra de son ampleur. Selon l'article 131 de la Loi fondamentale, de telles mesures ne peuvent être prises qu'en proposant une loi fédérale au Bundestag, qui doit finalement recueillir la majorité absolue."
 Adenauer49.111.a: "Cela va être angoissant."
 
 Adenauer49.112.t: "L'étendue du personnel réintégré"
 Adenauer49.112.d: "Après les premières réunions de la coalition et des comités, le premier différend porte sur le pourcentage d'anciens personnels qui doivent être réintégrés dans les services fédéraux et locaux, comme le service postal, les services ferroviaires ainsi que les universités. Le SPD réclame 15 % tandis que la Bürgerliche Koalition réclame au moins 20 %. Les positions extrêmes telles que l'aile droite du parti allemand, ainsi que le KPD et le Deutsche Reichspartei vont encore plus loin et soutiennent que 35 % s'avéreront plus efficaces pour l'administration du pays."
 Adenauer49.112.a: "c'est 15 %."
 Adenauer49.112.b: "20% semble raisonnable."
 Adenauer49.112.c: "Une couverture de 35 % est nécessaire."
 
 Adenauer49.113.t: "Le sort des anciens membres de la Gestapo"
 Adenauer49.113.d: "Après les premiers débats sur la réintégration administrative, la prochaine question controversée à l'ordre du jour de la commission concerne la reconduction potentielle d'anciens membres de la Gestapo dans des fonctions civiles. Le SPD et ses partenaires de gauche s'opposent catégoriquement à une telle mesure, arguant que même une tolérance minimale risque de miner la crédibilité démocratique de la nouvelle République. La Bürgerliche Koalition, tout en exprimant son inquiétude, suggère que les cas individuels soient examinés sur la base de l'expertise technique et de l'absence d'implication directe dans des crimes politiques. Des voix plus conservatrices, notamment celles du Deutsche Partei et des restes de la tradition DNVP, soulignent le besoin urgent d'une stabilité administrative et plaident pour une réintégration limitée et conditionnelle, invoquant le manque de personnel qualifié de l'État. Pendant ce temps, le KPD exige des poursuites judiciaires complètes et une interdiction permanente d'emploi dans tout rôle gouvernemental pour tous les affiliés de la Gestapo."
 Adenauer49.113.a: "Permettez-leur de reprendre du service."
 Adenauer49.113.b: "En aucun cas."
 
 Adenauer49.115.t: "La rédaction est terminée."
 Adenauer49.115.d: "Après avoir été adoptée avec succès par les trois lectures au Bundestag et approuvée par le Bundesrat, la loi 131 a désormais achevé le processus législatif. Après avoir été signée par le Président fédéral et contresignée par les ministres responsables, la loi a été publiée au Bundesgesetzblatt et est officiellement entrée en vigueur.\n\nLa République fédérale réintroduit ainsi des bureaucrates au service, marquant ainsi une étape importante vers la normalisation juridique et l'efficacité administrative."
 Adenauer49.115.a: "Magnifique."
 Adenauer49.115.b: "Magnifique."
 Adenauer49.115.c: "Magnifique."
 Adenauer49.115.e: "Magnifique."
 Adenauer49.115.f: "Magnifique."

 Adenauer49.4.d: "Pour commémorer la nouvelle décennie des années 1950, le chancelier Adenauer s'est adressé à l'ensemble de la chambre du Bundestag ainsi qu'à de hauts fonctionnaires du gouvernement lors d'un discours du Nouvel An. Après des applaudissements, principalement du côté de la CDU, il a commencé.\n\n \" Mesdames et Messieurs les membres du Bundestag, les ministres, les dignitaires étrangers et tous ceux qui sont présents, nous entrons dans une nouvelle ère. Il y a moins d'un an, la République fédérale a été fondée et, à mesure que nous entrons dans les années 1950, l'Allemagne ne fera que croître de plus en plus. Nos relations avec les puissances occidentales ne font que croître, tandis que nous poursuivons l'unification de l'Allemagne en un État démocratique, non contrôlé par un parti politique unique. Alors que nous entrons dans une nouvelle ère de développement technologique, l'Allemagne sera à la pointe de cette innovation, car nous consolider pour de bon notre utilisation industrielle limitée. Alors que je me tiens ici, un témoignage de la démocratie et de la paix européennes se manifeste, et cela continuera pour toujours !"
 Adenauer49.5.d: "Les réactions aux propositions de réarmement allemandes des Alliés ont été mitigées au sein du gouvernement de la République fédérale. La position du SPD sur la participation des troupes allemandes en Europe est en effet hostile, le Dr Schumacher considérant les offres de réarmement de la CDU comme étant prématurées et craignant que les Américains fassent une offre qu'ils ne pourraient pas tenir. Cependant, la CDU affirme que la menace soviétique est suffisamment grande pour justifier un réarmement rapide de l'Allemagne et que si elle ne s'aligne pas sur les Alliés, la République fédérale pourrait être entraînée dans le bloc soviétique et perdre notre souveraineté."
 Adenauer49.6.d: "Aujourd'hui est un jour capital dans l'histoire de la République fédérale puisque les usines sidérurgiques de la ville de Salzgitter, connues sous le nom d'usines de Salzgitter, ont été démantelées par des ouvriers allemands et observées par des représentants des trois puissances alliées. Anciennement sous l'égide de la Reichswerke Hermann Goering, les usines contribuèrent à alimenter la machine de guerre allemande, notamment dans la production de chars Panzer, d'avions et d'armes. Après la capture des Alliés, les oeuvres sont restées inutilisées pendant des années, jusqu'à aujourd'hui. Il s'agit d'une perte majeure pour l'industrie allemande, mais elle était nécessaire pour supprimer un symbole de l'industrie et de la domination nazie."
 Adenauer49.7.d: "Aujourd'hui, le gouvernement allemand est fier d'annoncer la fin officielle du rationnement alimentaire en République fédérale. Depuis la fin de la Seconde Guerre mondiale, un plan de rationnement a été mis en place concernant toutes les matières consommables, notamment le charbon, les oeufs, la viande, l'huile et les pommes de terre. Les Alliés ont contribué à compléter cette somme, mais nous avons finalement atteint le point où il est bénéfique d'arrêter le rationnement car nous disposons d'approvisionnements suffisants en nourriture et autres biens de consommation."
 Adenauer49.8.d: "Aujourd'hui, au Bundestag, un autre débat a fait rage, cette fois sur l'engagement possible de la République fédérale en faveur d'une Communauté européenne, gérant la production d'acier et de charbon de l'Allemagne et de la France sous une organisation supranationale. Adenauer et la CDU estiment qu'il s'agit d'une étape cruciale vers l'intégration européenne, visant à prévenir de futurs conflits en fusionnant des industries clés et en favorisant l'interdépendance économique ; la volonté des autres gouvernements européens d'inclure l'Allemagne, en particulier la volonté du gouvernement français et du ministre des Affaires étrangères Robert Schuman, ainsi que les avantages de conclure une union avec d'autres démocraties européennes.\n\nLes intervenants du SPD ont répliqué, demandant pourquoi la CDU insistait pour saper la légitimité et l'indépendance de l'Allemagne, en la rapprochant trop de la sphère occidentale et en retardant ainsi la réunification allemande. Le débat continue, mais nous devons prendre une décision prochainement."
 Adenauer49.9.d: "Aujourd'hui, le chancelier Adenauer a annoncé publiquement sur toutes les chaînes de radio et de télévision un nouveau décret. Une résolution récemment adoptée par le gouvernement fédéral concernant la loyauté constitutionnelle des fonctionnaires entrera en vigueur ; par conséquent, les membres d'organisations interdites ne peuvent pas travailler au sein du gouvernement fédéral. Précisant que « les personnes au service du gouvernement fédéral doivent s'engager en faveur de la conception démocratique de l'État dans l'ensemble de leur conduite » et s'adresse à 11 organisations de gauche et 2 organisations nationales-socialistes, dont le Parti communiste allemand (KPD), la Jeunesse libre allemande (FDJ), le Kulturbund et l'Association des victimes du régime nazi (VVN). Les critiques concernant son caractère autoritaire ne manqueront pas de venir bientôt, mais cela est nécessaire pour la démocratie."
 Adenauer49.10.d: "De malheureuses nouvelles sont sorties de la Chancellerie fédérale, alors que des révélations font surface sur le passé de Hans Globke, proche conseiller et sous-secrétaire du chancelier Konrad Adenauer. Bien qu'il n'ait jamais été membre du parti nazi, Globke a joué un rôle clé dans la rédaction de la loi d'habilitation de 1933, qui accordait à Adolf Hitler des pouvoirs dictatoriaux, et dans des sections des lois raciales de Nuremberg, qui institutionnalisaient la persécution antisémite. Malgré son implication, il a été disculpé de tout acte répréhensible après la guerre et a même témoigné comme témoin lors du procès des ministères de 1948. Nommé par Adenauer en 1949, Globke est devenu une figure cruciale dans l'élaboration des politiques juridiques et de renseignement de l'Allemagne de l'Ouest. Faisant désormais l'objet d'une surveillance de plus en plus minutieuse, le Chancelier doit décider s'il doit le révoquer, mais compte tenu de ses contributions au gouvernement d'après-guerre, cela peut sembler une décision anti-pragmatique, paralysant l'efficacité administrative du gouvernement Adenauer."
 Adenauer49.11.d: "Un nouveau rapport est arrivé aujourd'hui sur le bureau du chancelier Adenauer. Intitulé « Mémorandum d'Himmerod », d'après le lieu de rédaction de l'abbaye d'Himmerod, il jette les bases de la création d'une nouvelle force militaire allemande, appelée la Bundeswehr. Les principales revendications comprenaient la libération de tous les soldats allemands reconnus coupables de criminels de guerre, la fin de la diffamation des soldats allemands et des mesures visant à transformer l'opinion publique nationale et étrangère à l'égard de l'armée allemande. Le groupe d'officiers allemands qui l'ont rédigé, parmi lesquels Hans Speidel et Adolf Heusinger, espère que la chancelière acceptera leur mémorandum et entamera des discussions avec les trois puissances occidentales pour satisfaire leurs demandes."
 Adenauer49.12.d: "La prison de Landsberg est un établissement pénitentiaire tristement célèbre en Bavière, mieux connu pour être la prison où Adolf Hitler a été détenu après l'échec du putsch de la brasserie et où Mein Kampf a été écrit. Utilisée par les puissances américaines pendant l'occupation pour détenir des criminels de guerre, elle a été rebaptisée War Criminal Prison Nr. 1 en 1946. Au cours de son existence, Landsberg a été utilisé pour près de 300 exécutions de criminels de guerre condamnés. Aujourd'hui, il sert toujours à héberger des criminels de guerre, mais il est sous notre juridiction. D'une part, le moment est proche de les libérer ; la peine de mort est abolie en République fédérale, mais d'un autre côté, les maintenir en prison servira d'exemple à ceux qui recherchent des formes de gouvernement non démocratiques. Que ferons-nous ?"
 Adenauer49.13.d: "Aujourd'hui, l'avion du Chancelier allemand a atterri à Londres et, en grande pompe, le Chancelier Adenauer a rencontré le Premier ministre Winston Churchill pour la première fois depuis qu'un chef du gouvernement allemand a touché le sol britannique en 20 ans. Remarques sur les objectifs communs anglo-allemands ; la préservation de la paix et la défense de l'ordre démocratique, Adenauer a donné l'assurance que l'Allemagne se révélerait un allié fidèle. Dissipant les craintes d'une concurrence économique allemande et d'un regain de mouvements nationalistes, Adenauer a souligné l'importance de l'Allemagne dans la question de l'Europe et de la défense de la démocratie. Ce fut véritablement un succès pour les relations étrangères allemandes et les relations anglo-allemandes !"  
 Adenauer49.14.d: "Des propositions intéressantes ont été reçues par les trois Alliés occidentaux et par la Chancellerie fédérale. Apparemment, le secrétaire général soviétique Joseph Staline a présenté des propositions pour la réunification allemande, en supposant que nous soyons neutres et garantissons « les droits de l'homme et les libertés fondamentales ». Les responsables alliés soupçonnent que les « Notes de Staline » ne sont qu'un simple bluff de la part des Soviétiques pour blâmer les Alliés pour une Allemagne divisée. Le chancelier Adenauer et la CDU qualifient ces notes d'action agressive visant à bloquer la réintégration de l'Allemagne de l'Ouest dans la politique européenne, et même le SPD considère cela comme une possibilité. Il semble clair que le gouvernement est uni derrière ce projet, mais une décision doit être prise, et rapidement."
 
 Adenauer49.141.t: "Rapport sur la réception du premier paiement de réparations allemand"
 Adenauer49.141.d: "Nous confirmons par la présente la réception du paiement initial des réparations de la République fédérale d'Allemagne, conformément à l'Accord de Luxembourg. Les fonds et les biens transférés marquent le début de l'indemnisation convenue pour les souffrances et les pertes endurées par le peuple juif sous le régime nazi. Ces ressources contribueront à la reconstruction et au développement de notre nation, en aidant les survivants de l'Holocauste et en renforçant les bases économiques d'Israël. D'autres mises à jour seront fournies à mesure que le processus de réparation se poursuivra."
 Adenauer49.141.a: "Une première étape."
 
 Adenauer49.142.t: "[GetNewspaperHeader] L'Allemagne et Israël signent un accord historique de Luxembourg"
 Adenauer49.142.d: "La République fédérale d'Allemagne et l'État d'Israël ont signé l'Accord de Luxembourg, établissant officiellement des réparations pour les crimes nazis. Aux termes de cet accord, l'Allemagne de l'Ouest s'est engagée à fournir une compensation financière, dont 822 millions de dollars en biens et paiements, pour soutenir la réinstallation et le bien-être des survivants de l'Holocauste en Israël. L'accord, négocié entre le Premier ministre israélien David Ben Gourion et le chancelier allemand Konrad Adenauer, marque une étape importante dans la lutte contre les atrocités commises pendant la Seconde Guerre mondiale. Bien que controversé parmi certaines factions en Israël, l'accord représente une reconnaissance cruciale de la responsabilité historique. Les premiers paiements devraient commencer en 1953, apportant un soutien économique indispensable au jeune État israélien."
 Adenauer49.142.a: "Une étape cruciale."
 Adenauer49.142.b: "Plus d'argent pour les sionistes."
 Adenauer49.142.c: "Nous sommes profondément désolés pour tout."
 
 
 Adenauer49.15.d: "L'intégration germano-européenne se poursuit aujourd'hui avec la signature des Conventions de Bonn-Paris à Bonn entre les trois Alliés occidentaux et la République fédérale. Les dispositions importantes comprennent l'article 1, qui accorde à la République fédérale « la pleine autorité en tant qu'État souverain sur ses affaires intérieures et extérieures », et l'article 2, qui prévoit que les trois puissances conservent leurs droits concernant Berlin et l'ensemble de l'Allemagne, y compris la réunification et un règlement de paix. Il s'agit d'un grand pas en avant pour la souveraineté allemande et l'intégration européenne, et ce n'est que la première étape d'un très long voyage."
 
 Adenauer49.151.t: "La mort de Kurt Schumacher"
 Adenauer49.151.d: "Le chancelier a eu de profonds regrets lorsqu'il a appris le décès de Kurt Schumacher, président du parti social-démocrate, après une longue lutte contre la maladie. Schumacher était un défenseur infatigable de la démocratie, un farouche opposant au nazisme et au communisme, et l'une des voix les plus influentes de la politique allemande d'après-guerre. Ayant perdu son bras gauche pendant la Première Guerre mondiale et ayant subi d'intenses persécutions sous le régime nazi, notamment des années d'emprisonnement dans des camps de concentration, il est devenu après la guerre la figure de proue du SPD, déterminé à reconstruire la démocratie allemande selon les principes sociaux-démocrates.\n\nMalgré sa rivalité de longue date avec le chancelier Adenauer, Schumacher restait attaché à sa vision d'une Allemagne forte, indépendante et réunifiée. Son dévouement indéfectible à la justice politique et sociale a fait de lui une figure respectée, bien que souvent controversée. Son décès marque la perte d'un architecte clé de la démocratie allemande moderne."
 Adenauer49.151.a: "Ruhe à Frieden." 
 
 
 Adenauer53.1211.t: "Poursuivre la coopération avec Deutsche Partei"
 Adenauer53.1211.d: "Le Parti allemand (DP), notre fidèle allié de Basse-Saxe, revient dans la coalition, mais avec un mandat légèrement réduit de 3,3 % et 15 sièges. Profondément enraciné dans une tradition national-conservatrice et, dans certains milieux, ouvertement monarchiste, le PD représente un élément plus traditionaliste et particulariste au sein de notre gouvernement. Leur anticommunisme inébranlable et leur attachement aux principes d'une économie sociale de marché sont incontestables. Pourtant, leur focalisation sur les intérêts agraires et les droits des États, héritage de leurs origines hanovriennes, peut parfois aller à l'encontre des tendances centralisatrices d'un gouvernement fédéral moderne. Même si leur influence a légèrement diminué, leur loyauté et leur rôle de pont vers les électeurs protestants ruraux plus traditionnels restent précieux pour la stabilité de notre coalition."
 Adenauer53.1211.a: "Pour encore 4 années de succès !"
 
 Adenauer53.1311.t: "Inclusion du bloc panallemand ?"
 Adenauer53.1311.d: "Issu de la forte montée de la diplomatie des réfugiés dans le Schleswig-Holstein, le GB/BHE est apparu en 1950 comme un nouveau parti défendant les intérêts des expulsés et s'est rapidement développé pour devenir une force nationale de droite. Avec 5,9 % des voix et 27 sièges au Bundestag en 1953, ils pourraient devenir un partenaire junior clé de notre coalition. Leur programme est centré sur l'intégration sociale et politique des Allemands déplacés, un anticommunisme inébranlable et une vision révisionniste national-conservatrice du « Heimatrecht im Osten » - des positions qui résonnent avec les valeurs traditionnelles et une politique identitaire forte."
 Adenauer53.1311.a: "Cela semble raisonnable."
 
 Adenauer53.1411.t: "Que faire des Démocrates Libres ?"
 Adenauer53.1411.d: "Nous pourrions obtenir une majorité de travail avec le Bloc panallemand (BHE) et le Parti allemand (DP) seuls. Cela promet un gouvernement plus facile à gérer avec des partenaires plus conciliants. Toutefois, cette voie est à courte vue et risquée. Le BHE est un parti instable et axé sur un thème unique, ce qui en fait une fondation peu fiable pour un mandat de quatre ans.\nMême si le FDP peut être un partenaire difficile, avec des revendications libérales et laïques qui mettront notre patience à l'épreuve, c'est un petit prix à payer. Ce n'est qu'en les incluant que nous pourrons obtenir la majorité constitutionnelle des deux tiers nécessaire pour mener à bien des projets vitaux sans contestation juridique ou politique."
 Adenauer53.1411.a: "Ensemble pour l'Allemagne."
 Adenauer53.1411.b: "Deux partenaires de coalition suffisent."
 
 Adenauer53.1511.t: "Accord commun avec le SPD"
 Adenauer53.1511.d: "Bien que notre coalition soit susceptible de détenir à nouveau une majorité ferme au Bundestag, les socialistes dirigent toujours plusieurs gouvernements clés des Länder, exerçant une influence considérable au Bundesrat, menaçant de bloquer des lois essentielles. Devons-nous faire à nouveau des concessions au SPD pour garantir le bon passage de nos lois ? Cela pourrait être considéré comme une nécessité pragmatique pour éviter une impasse législative. Cependant, si nous devions inclure le FDP dans notre coalition, nous contrôlerions les 2/3 des sièges au Bundestag, ce qui nous permettrait de modifier la Constitution, sans l'approbation des sociaux-démocrates."
 Adenauer53.1511.a: "Parlons."
 Adenauer53.1511.b: "Nous allons laisser de côté celui-ci."
 
 Adenauer53.1611.t: "Temps chargés au ministère des Affaires étrangères."
 Adenauer53.1611.d: "Comme chaque jour au cours des quatre dernières années, le personnel de la Villa Ingenohl, siège du ministère des Affaires étrangères, a travaillé sans arrêt. L'intégration européenne, la gestion du conflit germano-allemand, le renforcement de la coopération américaine ainsi que le retour des prisonniers de guerre allemands disparus étaient les principales promesses politiques de la CDU. Il est désormais temps de tenir ces promesses. Entrons à nouveau sur la scène internationale et rétablissons la souveraineté allemande pour qu'elle soit à nouveau considérée comme une égale parmi les puissances européennes."
 Adenauer53.1611.a: "Eh bien, le moment est passé. Retour au travail."
 
 Adenauer53.1711.t: " [GetNewspaperHeader] L'Allemagne de l'Ouest crée la Bundeswehr"
 Adenauer53.1711.d: "La République fédérale d'Allemagne a officiellement créé sa nouvelle force armée nationale, la Bundeswehr. Annoncée par la Chancelière [WGR.GetLeader], la création de l'armée marque le retour de l'Allemagne en tant que contributeur souverain à la défense occidentale.\n\nLe ministère allemand de la Défense a souligné qu'il ne s'agit pas d'une continuation de la Wehrmacht, mais d'une nouvelle armée alignée sur les valeurs constitutionnelles. Aujourd'hui, les premiers volontaires ont prêté serment à Andernach, promettant leur fidélité à la Loi fondamentale plutôt qu'à un quelconque dirigeant.\n\nLe réarmement a suscité un débat public et des protestations, les critiques craignant une résurgence du militarisme. Cependant, ses partisans soutiennent que l'Allemagne de l'Ouest doit assumer la responsabilité de sa propre défense et contribuer à la sécurité collective de l'Europe dans un contexte de tensions liées à la Guerre froide."
 Adenauer53.1711.a: "Que font-ils ?"
 Adenauer53.1711.b: "Gott mit uns.."
 Adenauer53.1711.c: "Une nécessité pour la sécurité européenne."

 Adenauer53.1811.t: "La Cour constitutionnelle fédérale confirme le Lübeck-Urteil."
 Adenauer53.1811.d: "Dans son récent arrêt, la Cour constitutionnelle fédérale a clarifié la question du statut constitutionnel de Lübeck au sein de la République fédérale. La Cour a rejeté l'affirmation selon laquelle Lübeck, autrefois ville libre et hanséatique dotée de son propre État, pourrait se rétablir en tant qu'État (Land) indépendant, distinct du Schleswig-Holstein.\n\nLa décision confirme que la Loi fondamentale ne permet pas aux anciens États comme Lübeck de rétablir unilatéralement leur souveraineté. L'incorporation de Lübeck au Schleswig-Holstein, telle que prévue par la loi sur le Grand Hambourg de 1937, reste valable en vertu du droit constitutionnel. La Cour a souligné que la stabilité et l'intégrité de la structure fédérale sont essentielles pour la jeune république."
 Adenauer53.1811.a: "Cela ne ferait que perturber l'ordre fédéral."
 
 Adenauer53.1911.t: "Le retour du Zehntausend."
 Adenauer53.1911.d: "Dans un moment émouvant et historique pour la jeune République fédérale, le retour tant attendu de 10 000 prisonniers de guerre allemands de captivité soviétique a commencé. Ces hommes, qui ont enduré des épreuves indescriptibles dans des camps lointains depuis la fin des hostilités en 1945, remettent enfin le pied sur le sol allemand.\n\nDes foules se sont rassemblées cette semaine dans les gares d'Allemagne de l'Ouest, agitant des drapeaux noir-rouge-or et portant des fleurs à l'arrivée des premiers transports. Des mères, des épouses et des enfants - dont beaucoup craignaient depuis longtemps le pire - ont embrassé leurs proches avec larmes et joie.\n\nLes hommes, fatigués mais fiers, apportent avec eux des histoires de résilience, de camaraderie et d'héroïsme discret. Alors qu'ils rejoignent une nation qui a beaucoup changé en leur absence, une chose reste inchangée : l'Allemagne se souvient de ses fils et aujourd'hui, elle les accueille chez elle."
 Adenauer53.1911.a: "Willkommen zurück, Caméra."
 
 
 Adenauer53.1.d: "Grâce à sa victoire aux élections de 1953, Konrad Adenauer conserve son poste de chancelier de la République fédérale. En commençant son deuxième gouvernement avec en grande partie le même cabinet que précédemment, Adenauer a annoncé son intention de confier le ministère des Affaires étrangères à un ministre subordonné, à une date qui sera annoncée ultérieurement. En outre, on s'attend à ce que Theodor Heuss, l'actuel président fédéral, reste à son poste sans trop d'opposition. Les analystes politiques nationaux et étrangers considèrent que le maintien du leadership d'Adenauer constitue un avantage pour l'Allemagne de l'Ouest et s'attendent à la poursuite d'une reconstruction économique et sociale plus importante dans le pays."
 Adenauer53.2.d: "Les nations du monde entier, en particulier les trois Alliés occidentaux, sont indignées par les discussions sur la libération des « Sept de Spandau » ; un groupe de criminels de guerre nazis enterrés dans la prison de Spandau à Berlin ouest, dont Albert Speer, Karl Donitz et Rudolf Hess. Après des discussions internes à la Chancellerie concernant l'éventuelle libération de Konstantin von Neurath, ancien ministre allemand des Affaires étrangères et d'Erich Raeder, ancien grand amiral de la Kriegsmarine de Spandau, les Alliés occidentaux ont largement condamné cette action, mais ne se sont engagés à prendre aucune mesure concrète à son encontre pour la stabilité du pays."
 
 Adenauer53.20.t: "La libération d'Erich Raeder"
 Adenauer53.20.d: "Le grand amiral Erich Raeder constitue l'un des cas les plus intéressants des condamnés de Nuremberg. En poste de 1928 à 1943, il joua un rôle déterminant dans la modernisation de la marine allemande et fit pression pour une expansion de la flotte de surface afin de défier la domination navale britannique. Raeder a joué un rôle crucial dans l'invasion de la Norvège pour sécuriser les bases navales, mais a eu du mal à rivaliser avec la Royal Navy britannique en raison de la capacité limitée de construction navale de l'Allemagne. Il a plaidé pour un renforcement naval à long terme, mais s'est heurté à Hitler, qui donnait la priorité à la guerre sous-marine. Frustré par les désaccords stratégiques, Raeder fut contraint de démissionner en 1943 et fut remplacé par Karl Dönitz. Après la Seconde Guerre mondiale, à 70 ans, il a été reconnu coupable au procès de Nuremberg pour avoir planifié une guerre d'agression et condamné à la réclusion à perpétuité, bien qu'il ait demandé à être exécuté par un peloton d'exécution.\n\nEn raison de problèmes de santé récents, notamment de rhumatismes, nous décidons de le libérer de prison, pour lui permettre de vivre dignement ses dernières années. Bien que cela puisse paraître controversé aux yeux des Alliés, sa rupture avec Hitler en 1943 et son implication relativement lointaine dans l'Holocauste constituent une explication pertinente à sa libération préventive."
 Adenauer53.20.a: "Laissez-le vivre ses dernières années."
 
 Adenauer53.21.t: "La libération de Konstantin von Neurath"
 Adenauer53.21.d: "Konstantin von Neurath a commencé sa carrière diplomatique à Londres, lorsqu'il a été nommé vice-consul du consulat allemand en Grande-Bretagne en 1903. Il a ensuite servi comme diplomate allemand dans l'Empire Ottoman, à Copenhague et en Italie, faisant l'expérience directe de la montée du fascisme italien. Sous le cabinet exécutif de Franz von Papen, Neurath fut nommé ministre des Affaires étrangères de l'Allemagne, poste qu'il conservera jusqu'en 1938.\n\nIl a joué un rôle clé dans les débuts de la diplomatie nazie, supervisant le retrait de l'Allemagne de la Société des Nations et négociant des accords tels que l'accord naval anglo-allemand (1935). Cependant, à mesure que la politique d'Hitler devenait plus agressive, Neurath fut écarté et remplacé par Joachim von Ribbentrop en 1938. Bien que nommé plus tard Reichsprotektor de Bohême et de Moravie, son influence resta limitée et il fut effectivement mis à l'écart par Reinhard Heydrich.\n\nEn 1946, il fut reconnu coupable à Nuremberg de crimes contre la paix et de crimes de guerre et condamné à 15 ans de prison, même s'il affirmait qu'il s'était distancié des dirigeants nazis. En raison de la détérioration de son état de santé, notamment d'une grave maladie cardiaque, nous avons décidé de lui accorder une libération anticipée afin qu'il puisse vivre dignement ses dernières années. Bien que cette décision puisse susciter des critiques, son départ précoce du cercle restreint d'Hitler et sa participation directe limitée aux atrocités nazies fournissent une base raisonnable à cette décision."
 Adenauer53.21.a: "« Vais-je quand même toucher ma pension ?"
 
 Adenauer53.3.d: "Les célébrations abondent aujourd'hui en République fédérale avec la victoire de l'équipe nationale allemande de football contre l'« équipe d'or » hongroise ou « les puissants Magyars » en finale de la Coupe du monde de football de 1954. Jouée au stade Wankdorf de Berne, en Suisse, l'équipe hongroise était favorite pour gagner mais a été vaincue. Considérée comme l'un des plus grands matches de l'histoire de la Coupe du monde et connue sous le nom de « Miracle de Berne », cette victoire a permis à la République fédérale de retrouver une reconnaissance internationale et une popularité retrouvée sur la scène mondiale, en tentant de fixer sa perception du public après la Seconde Guerre mondiale et la dénazification."

 Adenauer53.31.t: "La fracture des démocrates libres"
 Adenauer53.31.d: "Suite à notre initiative législative visant à modifier la loi fédérale sur le vote, qui aurait réduit de près de moitié la représentation parlementaire du FDP, la faction libérale du FDP en Rhénanie du Nord-Westphalie a décidé d'abandonner sa coalition avec la CDU et de s'aligner sur les sociaux-démocrates. Même si les dirigeants du FDP ont déclaré qu'ils n'avaient pas l'intention de former une coalition avec le SPD au niveau fédéral, cette décision a conduit à d'importantes fractures internes au sein du parti. En conséquence, plusieurs membres éminents du FDP ont décidé de quitter complètement le parti, dont 16 représentants du Bundestag, parmi lesquels quatre ministres fédéraux.\n\nSuite à notre initiative législative visant à modifier la loi fédérale sur le vote, qui aurait réduit de près de moitié la représentation parlementaire du FDP, la faction libérale du FDP en Rhénanie du Nord-Westphalie a décidé d'abandonner sa coalition avec la CDU et de s'aligner sur les sociaux-démocrates. Même si les dirigeants du FDP ont déclaré qu'ils n'avaient pas l'intention de former une coalition avec le SPD au niveau fédéral, cette décision a conduit à d'importantes fractures internes au sein du parti. En conséquence, plusieurs membres éminents du FDP ont décidé de quitter complètement le parti, dont 16 représentants du Bundestag, parmi lesquels quatre ministres fédéraux. En réponse à ces développements, la faction CDU au Bundestag a déclaré son intention de coopérer uniquement avec les transfuges du FDP, faisant encore plus pression sur le FDP pour qu'il quitte la coalition et passe dans l'opposition. Pendant ce temps, les libéraux sortants ont créé le Freie Volkspartei (FVP) pour poursuivre leur partenariat avec les démocrates-chrétiens. Si ce changement signifie que le cabinet Adenauer a désormais perdu sa majorité au Bundesrat, il a également entraîné le départ des factions de gauche et de droite au sein du FDP, conduisant à un gouvernement avec moins d'individus liés au passé national-socialiste."
 Adenauer53.31.a: "Certains sacrifices doivent être faits."
 
 Adenauer53.32.t: "Rapport confidentiel sur la réunion de coalition du cabinet Adenauer II"
 Adenauer53.32.d: "La coalition composée de la CDU, de Deutsche Partei (DP) et du Gesamtdeutscher Block (GB/BHE) s'est réunie pour évaluer leurs progrès et relever les défis actuels. L'économie a continué de croître, avec l'expansion de l'industrie aéronautique et les investissements dans la recherche atomique progressant comme prévu. Les efforts visant à normaliser le système scolaire ont progressé, même si des désaccords subsistent sur l'autonomie de l'État.\n\nCependant, faire face au passé nazi de l'Allemagne s'est avéré difficile. Alors que certains poussaient à une dénazification plus poussée, le Gesamtdeutscher Bund dirigé par Theodor Oberländer a résisté, privilégiant la réconciliation. De même, les réformes des retraites sont restées controversées, alors que les débats sur les avantages sociaux des anciens officiers et fonctionnaires de la Wehrmacht se sont poursuivis. Dans l'ensemble, les partenaires de la coalition ont eu du mal à équilibrer le progrès économique, la politique sociale et la responsabilité historique, mais restent attachés à la stabilité et à la modernisation. D'autres discussions étaient prévues pour finaliser les politiques de retraite et les mesures de dénazification."
 Adenauer53.32.a: "Nous allons le faire." 
 
 Adenauer53.33.t: "Une réunion de la Coalition à [WGR.Capital.GetCapitalVictoryPointName]"
 Adenauer53.33.a: "Pour l'avenir de l'Allemagne." 
 
 Adenauer53.4.d: "Les événements récents survenus aux plus hauts responsables du gouvernement allemand ont été un choc tant au niveau national qu'à l'étranger. Otto John, président de l'Office fédéral pour la protection de la Constitution ; du renseignement intérieur de la République fédérale, a disparu à Berlin il y a quelques jours après avoir assisté à une cérémonie commémorant l'anniversaire du complot du 20 juillet contre Hitler. Trois jours plus tard, John est apparu dans le Berlin-Est communiste, désavouant son ancien pays et critiquant la politique d'intégration et de remilitarisation occidentale du chancelier Adenauer.\n\nLe gouvernement allemand a exprimé son indignation face à cet incident et exige son arrestation et son extradition depuis l'Allemagne de l'Est vers notre détention."
 
 Adenauer53.41.t: "L'Allemagne de l'Ouest exige l'extraction d'Otto John"
 Adenauer53.41.d: "Les événements récents survenus auprès de hauts responsables du gouvernement ouest-allemand ont été un choc tant dans le pays qu'à l'étranger. Otto John, président de l'Office fédéral pour la protection de la Constitution ; du renseignement intérieur de la République fédérale, a disparu à Berlin-Ouest il y a quelques jours après avoir assisté à une cérémonie commémorant l'anniversaire du complot du 20 juillet contre Hitler. Trois jours plus tard, John est apparu à Berlin-Est, désavouant son ancien pays et critiquant la politique d'Adenauer d'alignement avec les impérialistes occidentaux et de remilitarisation rapide.\n\n[WGR.Capital.GetCapitalVictoryPointName] a exprimé son indignation face à cet incident et exige son arrestation et son extradition vers sa garde à vue."
 Adenauer53.41.a: "Non? Il restera à Berlin-Est."
 Adenauer53.41.b: "Non? Nous allons le surveiller de près et... Attendez, où est-il allé ?"
 
 Adenauer53.42.t: "L'Allemagne de l'Est refuse l'extraction d'Otto John"
 Adenauer53.42.d: "Suite à des efforts diplomatiques continus, il a été confirmé que les autorités de l'Allemagne de l'Est n'extraderont pas Otto John vers la République fédérale. Malgré nos demandes répétées, les responsables est-allemands insistent sur le fait que John reste de son plein gré, décrivant sa défection comme un changement idéologique volontaire plutôt que comme un enlèvement.\n\nLes efforts visant à négocier son retour ont été catégoriquement rejetés, et Berlin-Est a clairement indiqué que toute autre demande serait ignorée. Pendant ce temps, la presse contrôlée par l'État à Berlin-Est continue de diffuser ses dénonciations de notre gouvernement, utilisant ses déclarations comme propagande pour justifier sa position. Il est désormais évident que le retour de John ne se fera pas par la voie diplomatique."
 Adenauer53.42.a: "Nous vous aurons un jour."
 
 Adenauer53.43.t: "Otto John arrêté à Berlin-Ouest"
 Adenauer53.43.d: "Malgré les refus persistants des autorités est-allemandes concernant l'extradition d'Otto John, un développement inattendu s'est produit. John a mystérieusement refait surface à Berlin-Ouest, après s'être échappé avec l'aide du journaliste danois Henrik Henriksen. Les détails de l'opération restent flous, mais il semble que John ait traversé clandestinement la frontière sans être détecté, échappant aux forces de sécurité est-allemandes.\n\nPeu de temps après son retour, John a été appréhendé par les autorités ouest-allemandes et placé en détention. Compte tenu de sa défection et de sa collaboration avec l'Est, il a désormais été condamné à cinq ans de prison pour trahison. Le gouvernement est-allemand n'a pas encore publié de déclaration officielle, mais les médias officiels condamnent déjà son arrestation comme une violation des principes démocratiques. Des instructions supplémentaires sur la gestion des retombées politiques de cette affaire seraient souhaitables."
 Adenauer53.43.a: "En prison avec toi."
 Adenauer53.43.b: "Comment s'est-il échappé de Berlin-Est ?"
 
 Adenauer53.5.d: "Une nouvelle doctrine de politique étrangère a été introduite par la République fédérale d'Allemagne, connue sous le nom de doctrine Hallstein, du nom du secrétaire d'État Walter Hallstein. Cette politique stipule que la République fédérale n'établira ni n'entretiendra de relations diplomatiques avec un pays reconnaissant formellement la République démocratique allemande comme État souverain. La doctrine repose sur la prétention de la RFA d'être le seul représentant légitime de l'Allemagne dans son ensemble, suite à ses accords avec l'Union soviétique et à la position internationale plus large sur la question allemande.\n\nCette décision marque un développement important dans la diplomatie divisée de l'Allemagne d'après-guerre, car elle façonnera à l'avenir les relations de la République fédérale avec les autres pays. La RDA, en réponse, maintient ses propres efforts diplomatiques, en particulier au sein du bloc de l'Est, alors que les deux États allemands cherchent à renforcer leur position internationale dans une Europe divisée."
 Adenauer53.5.a: "Un rempart contre le communisme."
 Adenauer53.5.b: "Un régime fantoche accusant l'Est d'être un régime fantoche. Ironique."
 
 Adenauer53.6.d: "Le chancelier Adenauer est revenu aujourd'hui de Moscou, achevant une visite dans la fosse aux lions pour le gouvernement ouest-allemand et se concentrant principalement sur le retour des derniers prisonniers de guerre allemands, une décennie après la fin de la Seconde Guerre mondiale.\n\nEn atterrissant à Moscou, Adenauer se considérait comme un partenaire égal aux Russes, posant pour une séance photo avec le représentant soviétique Nikolaï Boulganine et le secrétaire général Nikita Khrouchtchev. Cependant, les négociations s'enlisèrent et menacèrent de se dissoudre, jusqu'à ce que les délégations allemande et soviétique assistent à un spectacle de « Roméo et Juliette » au Théâtre Bolchoï.\n\nVers la fin de la pièce, lorsque les pères s'embrassèrent sur les corps de Roméo et Juliette, Adenauer et Boulganine se levèrent et s'embrassèrent de la même manière, marquant un moment poignant de la visite.\n\nLes discussions ultérieures se sont avérées fructueuses et des accords ont été conclus ; relations diplomatiques avec les Soviétiques, pour la libération de 10 000 prisonniers de guerre. Connu sous le nom de « Retour aux dix mille », ce succès restera à jamais gravé dans les mémoires en Allemagne et au-delà."
 Adenauer53.7.d: "C'est officiel ! Avec la ratification de l'Accord de Paris le 27 février 1955, la République fédérale d'Allemagne est membre de l'Organisation du Traité de l'Atlantique Nord, l'alliance de sécurité mutuelle d'Europe occidentale fondée par les trois Alliés occidentaux et neuf autres pays en 1949. Après avoir signé le statut des troupes de l'OTAN et d'autres accords établissant la fin du régime d'occupation, une cérémonie a eu lieu à Paris pour célébrer l'adhésion de la République fédérale, et les manoeuvres avec les forces de l'OTAN et la Bundeswehr devraient commencer l'année prochaine. Cet ajout à l'alliance ne manquera pas de provoquer la colère des Soviétiques et de fixer la ligne de conflit à la frontière intérieure de l'Allemagne, entrant ainsi dans une nouvelle ère de cette guerre froide."
 Adenauer53.8.d: "Aujourd'hui, il ne s'agissait pas d'une réunion normale du cabinet du chancelier. Une situation s'est développée au Moyen-Orient et la chancelière [WGR.GetLeader] a estimé qu'elle méritait une réponse.\n\n[WGR.GetLeader] ouvert. « Herr Brentano, que sait le ministère des Affaires étrangères ?\n\n\"Monsieur le Chancelier, comme vous le savez, le président égyptien Nasser a nationalisé le canal de Suez le 26 juillet. Cela fait un peu plus de trois mois maintenant et nous avons été informés que ces deux pays ont déployé des parachutistes pour s'emparer du canal de Suez.\"\n\nCela a déclenché une rafale de conversations autour de la table du Cabinet.\n\nLe Chancelier a parlé au-dessus d'eux. « Nous devons prendre une décision : soit honorer notre amitié avec la Grande-Bretagne et la France, soit exprimer notre soutien à Nasser, en lui offrant un soutien diplomatique. »\n\nBrentano reprit la parole. \"S'opposer aux Alliés, en particulier aux Français, n'est peut-être pas judicieux à l'heure actuelle. Nous essayons toujours de consolider notre position sur la scène mondiale. Cependant, s'engager actuellement à soutenir l'effort des Nations Unies peut s'avérer être une position neutre : soutenir Nasser par défaut, sans intervenir directement.\"\n\nIl a examiné les options, puis a soumis la question au vote du Cabinet. Quelle sera notre position ?"
 
 Adenauer53.81.t: "L'Allemagne de l'Ouest promet son soutien diplomatique à l'Égypte"
 Adenauer53.81.d: "Alors que la crise de Suez éclatait à la fin de 1956, les responsables britanniques et français comptaient de plus en plus sur leurs alliés occidentaux pour obtenir un soutien diplomatique contre le président égyptien Gamal Abdel Nasser. Cependant, les rapports des services de renseignement et les communications diplomatiques ont rapidement révélé un changement inquiétant : l'Allemagne de l'Ouest, plutôt que de s'aligner sur Londres et Paris, avait commencé à soutenir secrètement la position égyptienne.\n\nInitialement, les responsables ouest-allemands avaient exprimé leur neutralité, soulignant leur engagement en faveur de la désescalade. Pourtant, les envoyés diplomatiques au Caire avaient commencé à établir des liens plus étroits avec le gouvernement de Nasser, cherchant à étendre l'influence de l'Allemagne de l'Ouest dans le monde arabe. Des rapports ont fait état de discussions en cours sur une aide économique et d'assurances diplomatiques secrètes avaient été données pour éloigner Bonn de l'intervention anglo-française."
 Adenauer53.81.a: "Scandaleux !"
 
 Adenauer53.9.d: "Aujourd'hui, au Bundestag, une question importante est débattue, qui pourrait modifier les frontières de la République fédérale ; la question de la Sarre.\n\nÀ partir de 1947, la Sarre est détachée de la zone d'occupation française et jouit d'une autonomie politique ainsi que d'une communauté économique avec la France, mais reste sous le contrôle d'un haut-commissaire français. Le gouvernement allemand du chancelier Adenauer a poursuivi ses efforts pour mettre fin au statut spécial de la Sarre et l'annexer à la République fédérale en tant que Lander. Alors que certains habitants de la Sarre protestent contre le fait qu'ils devraient être souverains, la majorité du pays considère la Sarre comme une partie de l'Allemagne, une composante économique importante et un moyen d'arracher le contrôle de la région à la France. Que vont-ils décider ?"
 
 Adenauer53.90.t: "L'Allemagne de l'Ouest abandonne la Sarre"
 Adenauer53.90.d: "Nous avons reçu une notification officielle selon laquelle la République fédérale d'Allemagne a officiellement renoncé à ses revendications sur la Sarre, choisissant de laisser le territoire sous administration française. Cette décision, bien que non anticipée, marque un tournant important dans nos efforts d'intégration économique et politique de la région avec la France. Les autorités allemandes ont indiqué leur intention de respecter les résultats, même si les sentiments de la population locale restent mitigés. Je continuerai de suivre l'évolution de la situation et d'assurer une transition en douceur conformément à nos intérêts nationaux."
 Adenauer53.90.a: "C'était inattendu."
 
 Adenauer53.91.t: " [GetNewspaperHeader] La Sarre rejoint la France"
 Adenauer53.91.d: "Dans le cadre d'un changement politique important, la République fédérale d'Allemagne a officiellement abandonné ses revendications sur la Sarre, laissant la région sous administration française. Cette décision marque le point culminant d'années de négociations et de tensions après la fin de la Seconde Guerre mondiale.\nLa Sarre, territoire historiquement contesté, est sous influence économique française depuis la guerre, avec des efforts pour l'intégrer dans le cadre économique français. Même si les responsables ouest-allemands ont reconnu cette décision, les réactions des habitants de la Sarre restent divisées, certains étant favorables à des liens plus étroits avec la France et d'autres en faveur d'une réunification avec l'Allemagne.\nLes autorités françaises considèrent cela comme une victoire stratégique, assurant la stabilité économique et l'influence politique dans la région. Cependant, avec l'évolution des alliances européennes et l'influence croissante des institutions européennes nouvellement établies, l'avenir à long terme de la Sarre reste incertain."
 Adenauer53.91.a: "Hein?"
 
 Adenauer53.92.t: " [GetNewspaperHeader] La Sarre rejoint l'Allemagne"
 Adenauer53.92.d: "Aujourd'hui, au Luxembourg, la République fédérale d'Allemagne et la France ont ouvert la voie au retour de la Sarre à l'Allemagne. L'accord fait suite à un référendum du 23 octobre 1955, au cours duquel la population de la Sarre a rejeté le \"Saarstatut\" qui aurait fait de la région un territoire européen. Le traité comprend également des accords sur l'extraction du charbon dans la région du Warndt et sur les livraisons de charbon à long terme à la France. Simultanément, un accord séparé a été signé avec le Luxembourg pour canaliser la Moselle entre Coblence et Thionville, un projet souhaité par la France pour améliorer les liaisons de transport pour l'industrie lorraine de Montan. Cependant, les deux parties ont convenu d'une période de transition de 4 ans jusqu'à ce que l'union douanière et monétaire avec la France prenne fin et que le deutsche mark remplace le franc comme unique monnaie légale."
 Adenauer53.92.a: "Ils sont inséparables."
 
 Adenauer53.10.d: "La tension était forte lorsque des officiers supérieurs de la nouvelle Bundeswehr allemande entrèrent dans les salles enfumées de la session du Comité militaire de l'OTAN. Ils se sont approchés de la table et se sont assis face aux représentants des quatorze autres membres de l'OTAN.\n\n» Commença le président. \"Aujourd'hui, nous entamons la première journée de discussions concernant le déploiement d'armes nucléaires de l'OTAN sur le territoire de la République fédérale d'Allemagne. Nous invitons nos collègues de la Bundeswehr à partager leur contribution.\" Il y eut des applaudissements généraux et des hochements de tête d'approbation tout autour, tandis que certains membres continuaient à fumer par intermittence.\n\nLe plus haut officier de la Bundeswehr commença à parler. \"Si je peux me permettre, je voudrais remercier les membres de cette commission de nous avoir permis de prendre la parole aujourd'hui. Cependant, j'estime que la Bundeswehr et le gouvernement de la République fédérale dans son ensemble sont préoccupés par le déploiement d'armes nucléaires sur notre territoire. Nous sommes en première ligne, sur le champ de bataille...\"\n\nLe représentant américain l'interrompit. \" Exactement ! Maintenant que la République fédérale a rejoint l'OTAN, nous devrions nous concentrer sur le déploiement de davantage d'armes nucléaires sur le sol allemand, augmentant ainsi notre portée et facilitant la frappe contre les Soviétiques si cela s'avérait nécessaire. \"\n\nL'officier supérieur de la Bundeswehr avait l'air visiblement en colère. \"Vous voyez, c'est là le problème. Nous sommes un nouveau pays, avec une petite et nouvelle armée. Si des armes nucléaires sont placées sur notre territoire, cela représente une menace pour l'Union soviétique et leur donne encore plus de raisons d'attaquer !\"\n\nLe délégué américain a répliqué. \"Mais voyez-vous, l'article 5 garantit désormais votre sécurité. Ces sales cocos n'oseraient pas nous attaquer !\" Il a été fait taire en silence par le président du comité, qui avait l'air d'avoir besoin d'un verre bien fort. \"Peut-être devrions-nous délibérer sur cette question à huis clos.\""
 
 Adenauer53.100.t: "La création de la Bundeswehr"
 Adenauer53.100.d: "Si vous aviez demandé à la Commission alliée d'accorder à l'Allemagne le droit de réarmer et de former de nouveaux soldats, elle l'aurait condamné comme une dangereuse résurgence du militarisme allemand. Cependant, cette réalité est révolue depuis longtemps. Le rideau de fer a divisé l'Europe en deux blocs opposés, chacun luttant pour une influence et un pouvoir mondiaux. La guerre de Corée a clairement montré que l'ère de la paix et de la désescalade n'est pas encore arrivée, renforçant ainsi notre objectif principal : assurer la sûreté et la sécurité de nos citoyens contre l'Union soviétique et ses alliés.\n\nAvec la ratification officielle du Deutschlandvertrag (Traité allemand) et notre adhésion à l'Organisation du Traité de l'Atlantique Nord, nous avons engagé des discussions approfondies avec les États-Unis, la France et la Grande-Bretagne concernant le rôle de l'Allemagne de l'Ouest dans cette nouvelle structure de sécurité. En conséquence, nous avons obtenu le droit de créer une armée permanente pour soutenir les forces alliées en cas d'invasion soviétique de l'Europe occidentale.\n\nAujourd'hui, dix ans après la capitulation de la Wehrmacht, la Bundeswehr apparaît comme la nouvelle force armée allemande - une institution dédiée à la défense de la liberté et de la sécurité, et non à la poursuite de l'espace vital et de la vengeance."
 Adenauer53.100.a: "Pour la sécurité de l'Allemagne et de l'Europe !"
 
 Adenauer53.101.t: " [GetNewspaperHeader] L'Allemagne de l'Ouest signe le Deutschlandvertrag"
 Adenauer53.101.d: "Une étape majeure vers la pleine souveraineté de l'Allemagne de l'Ouest a été franchie avec la ratification du Deutschlandvertrag (Traité allemand). Initialement signé en 1952 entre la République fédérale d'Allemagne et les Alliés occidentaux, le traité réduit considérablement le contrôle allié, accordant à l'Allemagne de l'Ouest une plus grande indépendance politique tout en la maintenant fermement intégrée dans la structure de défense occidentale. Combiné avec la récente adhésion de l'Allemagne de l'Ouest à l'OTAN, cet accord ouvre la voie à la création de nouvelles forces armées du pays, marquant son retour en tant que puissance militaire sous stricte surveillance internationale. La chancelière [WGR.GetLeader] a salué le traité comme un moment décisif dans le redressement de l'Allemagne d'après-guerre, garantissant ainsi son rôle d'allié clé contre l'expansion soviétique. Même si certains en Allemagne restent prudents quant au réarmement, le traité est largement considéré comme une étape importante dans la réintégration de la nation dans la communauté occidentale."
 Adenauer53.101.a: "Ils méritent leur souveraineté."
 Adenauer53.101.b: "L'impérialisme occidental sur un papier. Ironique."
 Adenauer53.101.c: "Ensemble, sur un pied d'égalité !"
 
 Adenauer53.102.t: "L'Allemagne de l'Ouest demande une aide au réarmement"
 Adenauer53.102.d: "La République fédérale d'Allemagne demande officiellement l'assistance militaire du Royaume-Uni dans le cadre de ses efforts continus pour réarmer et contribuer à la défense occidentale. À la lumière de la menace soviétique croissante et de l'intégration récente de l'Allemagne dans la structure de sécurité occidentale, ils recherchent notre soutien sous la forme d'armes légères, de personnel consultatif et d'équipements de soutien essentiels pour aider à établir et moderniser les nouvelles forces armées allemandes. L'expertise britannique en matière de formation et de logistique serait inestimable pour former une force efficace et disciplinée, capable de coopérer avec les unités alliées. Compte tenu des sensibilités politiques entourant le réarmement allemand, [WGR.Capital.GetCapitalVictoryPointName] assure que toutes les mesures seront prises en stricte coordination avec les directives de l'OTAN pour maintenir la stabilité en Europe. Ils ont affirmé que l'engagement commun en faveur de la sécurité collective guiderait cette demande vers une issue positive."
 Adenauer53.102.a: "Bien sûr, nous sommes heureux de vous aider."
 Adenauer53.102.b: "Nous préférons rester en dehors de cela."

 Adenauer53.103.t: "Le Royaume-Uni nous assiste"
 Adenauer53.103.d: "Le gouvernement britannique a officiellement approuvé notre demande d'assistance militaire, acceptant de fournir des armes légères, du personnel consultatif et un soutien logistique pour aider au développement de la Bundeswehr. Les conseillers britanniques contribueront aux efforts de formation, garantissant que nos forces répondent aux normes de l'OTAN tout en maintenant une coordination étroite avec les structures de commandement alliées. Cela marque une étape importante dans la réintégration de l'Allemagne dans la défense occidentale, renforçant notre capacité à dissuader l'agression soviétique. D'autres négociations détermineront le calendrier et la portée des livraisons afin de garantir une mise en oeuvre fluide et efficace."
 Adenauer53.103.a: "Apprécié."
 
 Adenauer53.104.t: "Londres refuse notre demande" 
 Adenauer53.104.d: "Le gouvernement britannique a décliné notre demande d'assistance militaire, invoquant les sensibilités politiques persistantes concernant le réarmement allemand et les inquiétudes concernant la perception du public. Tout en réaffirmant leur attachement à notre partenariat avec l'OTAN, ils ont exprimé leur préférence pour que l'Allemagne s'approvisionne principalement en aide militaire auprès des États-Unis et de la France. Cette décision présente des défis pour notre stratégie de réarmement, nous obligeant à explorer d'autres voies en matière d'équipement et de soutien à la formation. Nous devons maintenant réévaluer notre approche pour garantir les ressources nécessaires tout en maintenant la bonne volonté diplomatique avec le gouvernement britannique." 
 Adenauer53.104.a: "Alors une brume !"
 
 
 Adenauer53.11.d: "Aujourd'hui à Rome, la République fédérale a participé à la signature du Traité de Rome, également appelé Traité instituant la Communauté économique européenne, et a proposé la réduction des droits de douane et l'établissement d'une union douanière, ainsi que la création d'un marché économique unique. Plus important encore, ce traité a créé la Commission européenne, qui serait le pouvoir exécutif de l'Union européenne. Signée par le chancelier Konrad Adenauer et le secrétaire d'État aux Affaires étrangères Walter Hallstein, la participation de l'Allemagne à cette organisation profitera certainement à tous !"
 Adenauer53.12.d: "Un arrêt important est venu d'en haut, de la Cour constitutionnelle fédérale, la Cour suprême du pays. En déterminant le statut juridique de Berlin-Ouest, qui continue d'être occupé par les trois Alliés occidentaux ; la Cour a déterminé que la ville est un État de la République fédérale. La détermination de la ville en tant que Land individuel confère à ses citoyens des droits en vertu de la Loi fondamentale. Il s'agit là d'une évolution inattendue, surtout avec les trois autorités d'occupation à Berlin ; Dieu sait que les Soviétiques considéreront cela comme un coup publicitaire."
 
 Adenauer53.121.t: "L'Allemagne de l'Ouest propose un accord de recrutement"
 Adenauer53.121.d: "La République fédérale d'Allemagne a officiellement proposé un accord pour accueillir les travailleurs italiens dans son économie en plein essor d'après-guerre. Confrontée à une pénurie de main-d'oeuvre en raison d'une expansion industrielle rapide, l'Allemagne offre des opportunités d'emploi à des milliers d'Italiens, notamment dans les secteurs manufacturier, minier et de la construction. L'accord garantit des salaires équitables, un logement et des prestations de sécurité sociale, offrant ainsi aux travailleurs italiens une chance d'accéder à un emploi stable et à de meilleures conditions de vie. Si certains en Italie expriment leurs inquiétudes quant aux défis de la migration, nombreux sont ceux qui y voient une opportunité prometteuse de progrès économique. Les discussions sont en cours, mais s'il est finalisé, cet accord pourrait renforcer les liens économiques entre l'Italie et l'Allemagne tout en offrant de nouvelles perspectives aux travailleurs italiens à l'étranger."
 Adenauer53.121.a: "Cela semble être une bonne affaire."
 
 Adenauer53.122.t: " [GetNewspaperHeader] L'Allemagne de l'Ouest confirme la mort d'Hitler"
 Adenauer53.122.d: "La République fédérale d'Allemagne a officiellement déclaré la mort d'Adolf Hitler, mettant fin à des années de spéculations sur le sort de l'ancien dictateur. La déclaration, émise par un tribunal ouest-allemand, est en grande partie une formalité juridique, car on pensait généralement qu'Hitler s'était suicidé dans son bunker de Berlin le 30 avril 1945. Cependant, en l'absence de preuves matérielles, aucune décision officielle n'avait été rendue jusqu'à présent.\n\nCette décision fait suite à des rumeurs persistantes et à des théories du complot suggérant qu'Hitler aurait pu s'échapper et avoir survécu en exil. Avec cette décision, le gouvernement ouest-allemand vise à éliminer toutes les ambiguïtés juridiques restantes concernant son statut."
 Adenauer53.122.a: "Cela n'arrêtera pas les complots."
 
 Adenauer53.123.t: "La Cour constitutionnelle fédérale interdit le KPD"
 Adenauer53.123.d: "La Cour constitutionnelle fédérale a officiellement interdit le Parti communiste allemand (KPD), le jugeant inconstitutionnel en raison de ses objectifs antidémocratiques et de son alignement sur la RDA sous contrôle soviétique. Cette décision marque la fin d'une bataille juridique de plusieurs années, initiée en 1951 par le gouvernement Adenauer, qui affirmait que le KPD cherchait à saper la démocratie ouest-allemande et à imposer une dictature socialiste.\n\nAvec cette décision, toutes les activités, actifs et publications du KPD sont désormais interdits. L'opposition du parti à l'intégration à l'OTAN et au réarmement de l'Allemagne de l'Ouest, ainsi que ses liens avec les services de renseignement est-allemands, ont joué un rôle crucial dans la décision du tribunal. De nombreux anciens membres du KPD devraient soit entrer dans la clandestinité, rejoindre d'autres groupes de gauche, soit s'installer en Allemagne de l'Est, où le parti au pouvoir, le SED, continue d'étendre son contrôle. Des efforts ont été déployés pour contenir le leader du KPD, Max Reimann, mais étant donné qu'il s'est exilé en Allemagne de l'Est il y a deux ans, il est impossible de le traduire en justice. Pour l'instant, Reimann reste à Berlin-Est, dirigeant le KPD et ce qui reste de là."
 Adenauer53.123.a: "Bon débarras."
 
 Adenauer53.124.t: "La formation du Bundesnachrichtendienst"
 Adenauer53.124.d: "La création d'un service fédéral de renseignement est en discussion depuis le début des années 1950. Les discussions à la Chancellerie fédérale ont évoqué pour la première fois le nom de Bundesnachrichtendienst, même si l'on ne savait pas clairement qui en assumerait la responsabilité et s'il devait s'agir ou non d'une institution gouvernementale officielle. Le Bundesnachrichtendienst sera officiellement créé dans les prochains mois, avec pour objectif de défendre l'Allemagne dans le domaine de la guerre asymétrique et d'obtenir des informations importantes sur les activités d'espionnage de l'Allemagne de l'Est. Le BND est issu de l'Organisation Gehlen, dirigée par le général de division de la Wehrmacht Reinhard Gehlen, dont les informations cruciales sur les forces armées soviétiques ont attiré l'attention des Américains. L'organisation Gehlen sera désormais intégrée au service de la République fédérale d'Allemagne avec ses milliers d'employés, Gehlen en devenant le premier président. Que leur service apporte la sécurité à l'Allemagne."
 Adenauer53.124.a: "Augmenter la surveillance des membres du SPD."
 
 Adenauer53.125.t: "Déclaration gouvernementale du Vizekanzler Blüchers"
 Adenauer53.125.d: "Alors que le chancelier Konrad Adenauer entamait son deuxième mandat, le gouvernement fédéral de la République fédérale d'Allemagne a réaffirmé son orientation vers la consolidation démocratique, la stabilité économique et la coopération européenne. La déclaration, remise au Bundestag par le vice-chancelier Franz Blücher, a donné un ton de détermination et de renouveau.\n\nBlücher, représentant du Parti libéral-démocrate et ministre de la Coopération économique, a souligné l'engagement du gouvernement en faveur de la paix, de l'unité nationale et du projet européen. Il a réaffirmé son soutien à la Communauté européenne du charbon et de l'acier, la qualifiant de « pierre angulaire de la réconciliation et d'étape nécessaire vers l'unification ». L'Allemagne de l'Ouest, a-t-il soutenu, doit non seulement bénéficier de la coopération, mais aussi contribuer activement à son succès.\n\nEn matière de politique intérieure, Blücher a souligné la poursuite de l'économie sociale de marché : \"Nous promouvrons la libre entreprise, tempérée par la responsabilité sociale. La relance doit atteindre tous les citoyens.\"\n\nAbordant la question de la réunification allemande, il a réaffirmé qu'elle constitue un objectif central, un objectif à atteindre par des moyens pacifiques et démocratiques et dans un cadre européen."
 Adenauer53.125.a: "Nous construisons une démocratie durable - non pas de manière isolée, mais dans le cadre d'un avenir européen partagé."
 
 Adenauer53.126.t: "Déclaration du gouvernement du Vizekanzler Oberländer"
 Adenauer53.126.d: "Alors que le chancelier Konrad Adenauer entame son deuxième mandat, le gouvernement de coalition nouvellement formé - cette fois sans les Démocrates libres - a exposé sa vision pour la République fédérale d'Allemagne. S'exprimant au nom du gouvernement devant le Bundestag, le vice-chancelier Theodor Oberländer, du parti du bloc panallemand, a prononcé une déclaration d'intention claire et confiante.\n\nOberländer a souligné l'engagement continu du gouvernement en faveur de la stabilité démocratique, de l'unité nationale et du renforcement de la position de l'Allemagne de l'Ouest en Europe. « Notre chemin reste ferme », a-t-il déclaré, « vers une Allemagne ancrée à l'Ouest, sûre de ses valeurs et engagée en faveur de la paix ».\nLe vice-chancelier a réaffirmé son soutien à la Communauté européenne du charbon et de l'acier, la qualifiant de « cadre vital pour la paix et la coopération ». Il a salué la CECA non seulement en tant qu'initiative économique, mais aussi en tant que fondement politique d'une future union européenne.\n\nSur le plan intérieur, Oberländer a souligné l'importance du développement rural et des valeurs traditionnelles, reflétant la base conservatrice et agraire de son parti. Dans le même temps, il a assuré au public que la croissance économique se poursuivrait selon les principes de l'économie sociale de marché.\n\nLa réunification allemande, a-t-il déclaré, reste un objectif inébranlable du gouvernement fédéral - « à réaliser par des moyens pacifiques, dans le cadre d'une légitimité démocratique et de concert avec nos partenaires européens »."
 Adenauer53.126.a: "Nous construisons une démocratie durable - non pas de manière isolée, mais dans le cadre d'un avenir européen partagé."

 Adenauer57.1211.t: "Travailler avec l'opposition ?"
 Adenauer57.1211.d: "Après le changement de direction au sein du FDP et leur dérive vers le spectre gauche-libéral, le Bundesparteitag du FDP a décidé de ne pas chercher une autre coalition avec la CDU et plutôt de se lancer dans l'opposition aux côtés des sociaux-démocrates. Cette décision aurait constitué une menace sérieuse pour nos chances d'établir un gouvernement efficace, mais étant donné notre taux de participation électorale, nous n'avons rien à craindre à ce sujet. Cependant, en raison des constellations au sein du Bundesrat, il serait judicieux de travailler à certains moments aux côtés du FDP et du SPD pour garantir que diverses lois soient approuvées."
 Adenauer57.1211.a: "Nous devrions y réfléchir."
 Adenauer57.1211.b: "Non." 
 
 Adenauer57.1311.t: "Encore une fois, une autre coopération DP."
 Adenauer57.1311.d: "Nous revenons sur deux mandats réussis, remplis de croissance économique, d'intégration occidentale, ainsi que de renforcement de l'Allemagne sur le plan culturel et de lutte contre l'influence communiste. Nous insisterons sur le maintien de cette voie et inclurons à nouveau le parti allemand dans notre coalition, même si nous sommes parvenus à former un gouvernement composé uniquement de la CDU."
 Adenauer57.1311.a: "Affaires comme d'habitude."
 
 Adenauer57.0.t: "Cabinet Adenauer III"
 Adenauer57.0.d: "Après une élection réussie, obtenant plus de 50,2 % avec la seule CDU et obtenant ainsi la majorité absolue au Bundestag, Konrad Adenauer a de nouveau assuré sa position de chancelier de la République fédérale, entamant ainsi son troisième mandat. La politique étrangère restant une priorité majeure, Adenauer devrait renforcer davantage ses liens avec les alliés occidentaux, notamment par le biais de l'OTAN et du processus d'intégration européenne.\n\nAu niveau national, son leadership devrait entraîner une croissance économique continue, des investissements dans les infrastructures et des progrès dans le réarmement de l'Allemagne de l'Ouest sous la Bundeswehr. Les observateurs politiques s'attendent à une stabilité et une continuité qui renforceraient le rôle de la République fédérale en tant qu'acteur clé dans l'Europe d'après-guerre."
 Adenauer57.0.a: "Affaires comme d'habitude."
 
 Adenauer57.1.d: "Aujourd'hui, au Bundestag, une grande partie de la réforme allemande a été adoptée avec le succès de la loi sur les conséquences générales de la guerre. Cette loi, conçue pour couvrir toutes les réclamations et dommages résultant des actions de l'ancien Reich allemand et les transférer à la République fédérale, s'avérera en fin de compte utile à la reconstruction de la guerre, non seulement en Allemagne, mais dans toute l'Europe où les dégâts sont causés. Ceci est généralement reconnu comme le fait que le gouvernement allemand assume l'entière responsabilité financière des actions de ses prédécesseurs fascistes et a reçu un large soutien populaire de la part des Alliés occidentaux."
 Adenauer57.2.d: "Aujourd'hui, à Ulm, le procès de l'Einsatzkommando, ou Einsatzgruppen, s'est terminé. Tenue devant le tribunal régional d'Ulm, l'affaire concernait dix membres de la Gestapo, du Sicherheitdienst et de l'Ordnungspolizei, qui faisaient partie de l'Einsatzkommando de Tilsit pendant la période du national-socialisme. Selon un rapport de Walter Stahlecker, ancien commandant de l'Einsatzgruppe A, ces dix individus ont été accusés d'avoir tué plus de 5 000 hommes, femmes et enfants juifs près de la frontière lituanienne pendant la guerre.\n\nConsidéré comme le premier tournant dans la lutte judiciaire contre l'héritage du national-socialisme, les dix accusés ont été condamnés entre 3 et 15 ans de prison pour « meurtre complémentaire » et ont perdu leurs droits civils pour une durée pouvant aller jusqu'à 10 ans.\n\nCette affaire a eu des conséquences profondes, avec la création du Bureau central de l'administration d'État pour les enquêtes sur les crimes nationaux-socialistes, afin d'aider à lancer les poursuites fédérales dans toutes les affaires, permettant ainsi aux Alliés de voir que la République fédérale peut se contrôler elle-même."
 Adenauer57.3.d: "Le 8 juillet 1954, la République fédérale d'Allemagne est invitée à l'Exposition universelle de Bruxelles, également connue sous le nom d'Expo 58. Apparemment politiquement sensible, surtout après la participation de l'Allemagne nazie à l'Exposition universelle de 1937 à Paris, cette rencontre marque un tournant pour la République fédérale.\n\nLa question de savoir comment la République fédérale devait se présenter a été vivement débattue, avec des débats controversés au sein du Cabinet, jusqu'à ce qu'elle soit finalement tranchée en 1956.\n\nLe pavillon allemand était composé de deux étages recouverts de verre, avec un pont permettant l'accès au-dessus de la Bundesautobahn 3. Assez petite par rapport aux plus grands pavillons américain et soviétique, ainsi qu'au plus tristement célèbre pavillon du Congo belge, notre contribution à l'Expo 58 représente un avenir plein d'espoir pour la République fédérale."
 Adenauer57.4.d: "Un nouveau sujet a fait son apparition au Bundestag. Depuis l'adhésion de la République fédérale à l'OTAN et la réunion devant le Comité militaire de l'OTAN il y a deux ans, la question des armes nucléaires hante le gouvernement fédéral. Adenauer et son cabinet sont favorables au déploiement par l'OTAN d'armes nucléaires en République fédérale, ainsi qu'à un éventuel programme nucléaire indépendant avec la France et l'Italie. Cependant, le SPD a exprimé de nombreuses inquiétudes sur tous les aspects, à commencer par le déploiement de l'OTAN ; le considérant comme une atteinte excessive et un risque pour la sécurité non seulement des citoyens allemands, mais aussi pour une éventuelle réunification avec l'Est.\n\nLe cabinet d'Adenauer, en consultation avec les membres du SPD, a proposé un référendum sur cette question afin que le peuple puisse prendre une décision.\n\nCependant, la question pourrait être bloquée par la Cour constitutionnelle fédérale, qui a signalé de manière préventive qu'autoriser les armes nucléaires serait inconstitutionnelle en vertu de l'article 26 de la Loi fondamentale.\n\nLe référendum doit-il avoir lieu, reflétant la volonté du peuple, ou cette question doit-elle être rejetée une fois pour toutes ?"
 Adenauer57.5.d: "Le référendum sur le déploiement d'armes nucléaires a eu lieu dans tous les Länder allemands, sur ordre du gouvernement fédéral allemand. Des millions d'Allemands éligibles ont fait la queue aujourd'hui dans leurs bureaux de vote respectifs, alors que le pays décidait du sort du déploiement des armes nucléaires de l'OTAN en République fédérale. Bien qu'il y ait eu peu de commentaires de la part du siège de l'OTAN à Bruxelles, une déclaration publique devrait suivre l'annonce des résultats. Qu'a choisi la nation ?"
 Adenauer57.7.d: "Le gouvernement fédéral allemand subit de nouvelles pressions de la part des puissances occidentales pour qu'il reconnaisse la ligne Oder-Neisse, qui constitue actuellement la frontière entre la République populaire polonaise et la République démocratique allemande, formée après la Conférence de Potsdam par le débit de l'Oder et de la Neisse. Alors que les Américains ont particulièrement fait pression sur [WGR.GetLeader] et son cabinet pour qu'ils reconnaissent la ligne via des pactes de non-agression, des segments de la population allemande, en particulier la population allemande expulsée, ont compris ses motivations possibles et se lancent dans l'action contre la reconnaissance de la Pologne. La ligne sera-t-elle reconnue ?"
 
 Adenauer57.71.t: "L'Allemagne de l'Ouest reconnaît la frontière Oder-Neisse"
 Adenauer57.71.d: "Dans le cadre d'un changement politique important, le gouvernement ouest-allemand dirigé par le chancelier Konrad Adenauer a officiellement reconnu la ligne Oder-Neisse comme frontière occidentale de la Pologne. Dans une déclaration du cabinet Adenauer III, les responsables ont reconnu les réalités territoriales de l'Europe d'après-guerre, soulignant leur engagement en faveur d'une coexistence pacifique. Même si certaines voix en Allemagne de l'Ouest restent opposées, cette décision est considérée comme une étape vers la stabilisation des relations entre les deux nations. Le gouvernement polonais a été informé de cette reconnaissance, marquant un tournant potentiel dans les efforts diplomatiques entre [WGR.Capital.GetCapitalVictoryPointName] et Varsovie."
 Adenauer57.71.a: "Une surprise inattendue mais bienvenue."
 
 Adenauer57.72.t: "[GetNewspaperHeader] L'Allemagne de l'Ouest reconnaît la frontière Oder-Neisse"
 Adenauer57.72.d: "Dans une démarche révolutionnaire, le gouvernement ouest-allemand a officiellement reconnu la ligne Oder-Neisse comme frontière occidentale de la Pologne. Cette décision marque un changement significatif par rapport à la précédente politique ouest-allemande et signale une nouvelle approche vers la réconciliation avec la Pologne.\nPendant des années, la frontière établie après la Seconde Guerre mondiale a été un sujet de discorde, de nombreux habitants de l'Allemagne de l'Ouest refusant d'accepter la perte d'anciens territoires de l'Est. Cependant, dans un effort pour stabiliser les relations et démontrer son engagement en faveur de la paix européenne, le gouvernement de Bonn a officiellement reconnu la souveraineté de la Pologne sur la région.\nLe gouvernement polonais a salué cette annonce, la considérant comme une étape cruciale vers la normalisation des relations entre les deux nations. Cependant, la décision a suscité un débat en Allemagne de l'Ouest, où les voix de l'opposition affirment qu'une telle reconnaissance concède trop aux changements territoriaux d'après-guerre."
 Adenauer57.72.a: "C'était inattendu."
 
 Adenauer57.8.d: "C'est avec regret que Theodor Oberlander, ancien ministre des Personnes déplacées, des Réfugiés et des Victimes de guerre et membre du Bundestag, a été contraint de se retirer du gouvernement de la République fédérale. Avec un rapport publié plus tôt cette année, Oberlander a été impliqué dans la promotion et la commission de crimes de guerre en Pologne pendant la Seconde Guerre mondiale, ainsi que dans l'approbation du nettoyage ethnique en Pologne du peuple qu'il a rapidement dirigé en tant que chef du Bloc panallemand/Ligue des expulsés et des privés de droits.\n\nOn s'attend à ce que le cabinet Adenauer fasse une déclaration publique à ce sujet, mais nie catégoriquement les accusations et souhaite à Oberlander une retraite en toute sécurité."
 
 Schumacher49.0.t: " [GetNewspaperHeader] Kurt Schumacher élu Bundeskanzler d'Allemagne de l'Ouest"
 Schumacher49.0.d: "Au lendemain des élections fédérales de 1949 en Allemagne, Kurt Schumacher et le Parti social-démocrate (SPD) ont remporté les élections au Bundestag de 1949, formant un gouvernement qui cherche à équilibrer le socialisme avec les principes démocratiques. La victoire du SPD sur l'Union chrétienne-démocrate (CDU) et le Parti communiste (KPD) marque un rejet des politiques conservatrices tout en éloignant l'Allemagne de l'Ouest de la domination soviétique et occidentale. Schumacher s'est engagé à mettre en oeuvre de solides programmes de protection sociale, une planification économique dirigée par l'État et une approche prudente du plan Marshall pour maintenir la souveraineté allemande. Les dirigeants occidentaux considèrent son gouvernement avec incertitude, car il rejette un alignement total sur l'un ou l'autre des blocs de la guerre froide, tandis que l'Union soviétique reste sceptique quant à sa position anticommuniste. La victoire du SPD bloque également les ambitions du KPD, empêchant une évolution vers un socialisme de type soviétique tout en continuant à défendre les droits des travailleurs et le contrôle de l'État sur des industries clés. Schumacher est confronté à des défis importants, notamment la reprise économique, les efforts de réunification et les tensions avec les États-Unis et l'URSS. Son leadership place l'Allemagne sur une voie unique, luttant pour un État socialiste démocratique tout en faisant face aux pressions de la Guerre froide."
 Schumacher49.0.a: "Ce n'est pas le résultat que nous espérions, mais ce n'est pas non plus le pire."
 Schumacher49.0.b: "Wer hat uns verraten? Sozialdemokraten."
 Schumacher49.0.c: "Le SPD nous guidera au cours des 4 prochaines années !"
 
 Schumacher49.1211.t: "À la poursuite des démocrates libres"
 Schumacher49.1211.d: "Après les premières élections au Bundestag, le SPD est confronté à un choix stratégique déterminant : former une coalition avec le FDP pour obtenir la chancellerie, ou rester dans l'opposition. Le débat a divisé le parti entre pragmatiques et idéologues.\n\nLe noyau idéologique du parti rejette avec véhémence toute alliance. Ils considèrent le FDP comme le représentant d'un système capitaliste hostile au programme socialiste de planification économique et de nationalisation du SPD. Toutefois, un gouvernement SPD-FDP est une nécessité politique. Pour l'aile modérée du SPD, l'installation de Kurt Schumacher au poste de chancelier était primordiale pour bloquer un gouvernement conservateur dirigé par Adenauer et assumer la responsabilité de façonner la nouvelle république. Ils y voient une opportunité de construire une majorité progressiste, même si cela nécessite des compromis politiques."
 Schumacher49.1211.a: "Nous en avons besoin à tout prix."
 
 Schumacher49.1311.t: "Cette histoire du parti bavarois"
 Schumacher49.1311.d: "Au lendemain des premières élections au Bundestag, le SPD estime qu'il est urgent de former une coalition qui reflète la volonté du peuple - sans s'appuyer sur les extrêmes du KPD communiste ou sur le conservatisme centralisateur de la CDU.\n\nNous avons décidé de faire appel au Parti bavarois comme partenaire naturel dans cette démarche. Les deux partis partagent un attachement aux valeurs démocratiques, un rejet des idéologies autoritaires et un profond respect pour le fédéralisme et l'identité régionale. Contrairement à la CSU, qui continue de s'appuyer sur les vieilles élites et le centralisme, le SPD reconnaît l'importance de la voix unique de la Bavière dans la construction de la nouvelle république.\n\nBien qu'enracinés dans des traditions différentes, les deux partis sont unis par le souci du bien-être des citoyens ordinaires et le désir d'une Allemagne juste, libre et souveraine."
 Schumacher49.1311.a: "Willkommen an Bord.."
 
 Schumacher49.1411.t: "Rejeter la CDU, retourner au Zentrum"
 Schumacher49.1411.d: "Dans le cadre d'une nouvelle tentative d'isolement de la CDU, le cercle restreint du parti a fait appel à de vieux amis. Le Zentrumspartei est l'un des partis les plus anciens de l'histoire allemande, étant un parti dominant au sein du Kaiserreich et de la Première République. Surtout dans les années 1920 et au début des années 1930, le SPD et le Zentrum ont travaillé ensemble pour défendre la démocratie contre l'extrémisme de gauche comme de droite. Cet esprit de gouvernance responsable est à nouveau nécessaire en ces temps incertains.\n\nLa CDU cherche à centraliser le pouvoir et à dominer la vie politique sous une seule bannière chrétienne, marginalisant les voix catholiques indépendantes comme le Centre. Le KPD, quant à lui, rejette totalement l'ordre démocratique. Le SPD propose une troisième voie : une coalition basée sur la justice sociale, le fédéralisme et le pluralisme."
 Schumacher49.1411.a: "Tout comme au bon vieux temps."
 
 Schumacher49.1511.t: "La question du KPD"
 Schumacher49.1511.d: "Bien que les deux partis revendiquent leurs racines dans le mouvement ouvrier, le KPD a depuis longtemps abandonné les principes du socialisme démocratique. Depuis les années 1920, il a toujours privilégié la loyauté idéologique envers Moscou plutôt que la loyauté envers le peuple allemand. Ses actions dans la zone occupée par les Soviétiques ont prouvé sans aucun doute que le KPD n'est pas une force démocratique, mais un instrument d'autoritarisme.\n\nLe SPD n'oubliera pas le rôle joué par le KPD au cours des dernières années de la République de Weimar, lorsqu'il refusa de s'unir aux forces démocratiques contre la montée du fascisme, qualifiant les sociaux-démocrates de « sociaux-fascistes » au lieu d'alliés. Cette division tragique a ouvert la porte à la dictature - une erreur que le SPD ne permettra pas que se reproduise."
 Schumacher49.1511.a: "Sortir!"
 
 Schumacher49.1611.t: "Poursuivre la tradition de Weimar"
 Schumacher49.1611.d: "En 1949, après les premières élections au Bundestag de la République fédérale, le SPD, le FDP et le Parti du centre (Zentrumspartei) formèrent désormais une coalition gouvernementale, souvent appelée la Nouvelle Coalition de Weimar.\n\nRavivant l'esprit de leur coopération sous la République de Weimar, les trois partis se sont unis pour empêcher la domination de la CDU et exclure du pouvoir le KPD, aligné sur les Soviétiques. Malgré leurs différences idéologiques, ils partagent un engagement envers la démocratie parlementaire, les libertés civiles, le fédéralisme et la responsabilité sociale.\n\nLa coalition vise à reconstruire l'Allemagne sur des bases démocratiques, à promouvoir la reprise économique et à protéger les libertés individuelles. Il s'agit d'un rejet clair des deux extrêmes autoritaires et d'un signal selon lequel la nouvelle République ne répétera pas les erreurs du passé."
 Schumacher49.1611.a: "Ensemble pour la démocratie."
 
 Schumacher49.1711.t: "Le statut de Berlin-Ouest"
 Schumacher49.1711.d: "En raison du statut d'occupation du pays après 1945, Berlin a subi le même sort, étant divisée en 4 secteurs, les secteurs français, anglais et américain constituant la moitié ouest de la ville, qui fait de facto partie de la République fédérale. Cependant, en raison de sa proximité avec Berlin-Est, la Haute Commission alliée n'accorde pas à l'État fédéral de Berlin son plein statut constitutionnel, excluant ainsi les citoyens d'élire leurs candidats au Bundestag, en violation de divers articles de la loi fédérale. Cela ne peut plus tenir. Le statut d'occupation doit être révoqué."
 Schumacher49.1711.a: "Berlin est un Land, au même titre que le reste de la République."
 
 Schumacher49.1811.t: "L'Allemagne de l'Ouest exige la propriété légale de Berlin-Ouest"
 Schumacher49.1811.d: "Le gouvernement ouest-allemand nous a contacté concernant le statut juridique de Berlin-Ouest. Ils affirment que le statut actuel de l'occupation viole la Loi fondamentale, privant la population locale de son droit d'élire ses mandats au Bundestag. Même si les articles 1, 2 et 3 de la Constitution de Berlin définissent Berlin comme un État fédéral de la République, ceux-ci ne pourront être mis en pratique qu'une fois que la question de Berlin aura été pleinement résolue en coopération avec l'Union soviétique. En attendant, Berlin relève d'une réglementation alliée spéciale. Ajuster le statut juridique à une réglementation plus permanente ne ferait qu'approfondir la division allemande, contrariant encore davantage l'Union soviétique et l'Allemagne de l'Est."
 Schumacher49.1811.a: "Peut-être qu'ils ont raison."
 Schumacher49.1811.c: "Nous laissons cette décision à Washington."
 
 Schumacher49.1911.t: "Berlin devient un État fédéral"
 Schumacher49.1911.d: "Après d'âpres négociations entre l'administration Schumacher et la Haute-commission alliée, les Alliés ont finalement cédé et ont promis au Land de Berlin de modifier l'article 87, permettant ainsi à la région du Grand Berlin de tomber sous le jugement judiciaire de la Loi fondamentale, y compris l'élection libre des mandats au Bundestag par la population locale. Alors que certaines autorités alliées doivent rester à Berlin-Ouest en raison de diverses craintes concernant les menaces soviétiques, Berlin bénéficie désormais du même statut politique que les autres États fédéraux d'Allemagne."
 Schumacher49.1911.a: "Comme il se doit."
 
 Schumacher49.2011.t: "Berlin reste sous occupation alliée"
 Schumacher49.2011.d: "Après d'âpres négociations entre l'administration Schumacher et la Haute-commission alliée, les Alliés ont rejeté notre demande de transformation légale de Berlin en un autre État fédéral. Compte tenu de la menace posée par l'Union soviétique, les troupes alliées doivent rester à tout prix à Berlin, ce qui signifie que diverses réglementations spéciales doivent être respectées pour le bien de la sécurité occidentale. Ils ont également exprimé leur inquiétude quant au fait qu'une telle décision permanente violerait le Statut d'occupation et inciterait l'Union soviétique à prendre de multiples mesures qui pourraient également violer le Statut."
 Schumacher49.2011.a: "Nous reviendrons éventuellement sur ce sujet."
 
 Schumacher49.2111.t: "La droite du SPD"
 Schumacher49.2111.d: "Le coup du chancelier Schumacher place son gouvernement entre les mains du vice-chancelier Egon Franke, l'un des dirigeants du Kanalarbeiter, l'aile puissante et pragmatique du SPD.\n\nConnue sous le nom de « Travailleurs du canal », cette faction excelle dans le travail politique invisible et pratique : faire respecter la discipline de parti et conclure des accords plutôt que de se concentrer sur une idéologie rigide. Leur ascension marque une rupture radicale avec la politique du principe inflexible de Schumacher.\n\nLà où Schumacher s'est montré conflictuel, les Kanalarbeiter sont des négociateurs, considérés comme plus disposés à faire des compromis avec les Alliés occidentaux. La direction provisoire de Franke signale donc un changement potentiel du gouvernement d'une confrontation de principe vers une négociation pragmatique, une démarche qui pourrait réaligner la politique ouest-allemande."
 Schumacher49.2111.a: "Évolution au lieu de Révolution."
 
  
 Schumacher49.2211.t: " [GetNewspaperHeader] L'Allemagne de l'Ouest signe le Deutschlandvertrag"
 Schumacher49.2211.d: "Une étape majeure vers la pleine souveraineté de l'Allemagne de l'Ouest a été franchie avec les signataires du Deutschlandvertrag, entre la République fédérale d'Allemagne et les Alliés occidentaux. Le traité réduit considérablement le contrôle allié, accordant à l'Allemagne de l'Ouest une plus grande indépendance politique tout en la maintenant fermement intégrée dans la structure de défense occidentale. Malgré les hésitations du SPD à l'égard de l'intégration occidentale, cet accord ouvre également la voie à la création de nouvelles forces armées, marquant un retour possible en tant que puissance militaire sous stricte surveillance internationale. La chancelière [WGR.GetLeader] a salué le traité comme un moment décisif dans le redressement de l'Allemagne d'après-guerre, garantissant ainsi son rôle d'allié clé contre l'expansion soviétique. Même si certains en Allemagne restent prudents quant au réarmement, le traité est largement considéré comme une étape importante dans la réintégration de la nation dans la communauté occidentale."
 Schumacher49.2211.a: "Ils méritent leur souveraineté."
 Schumacher49.2211.b: "L'impérialisme occidental sur un papier. Ironique."
 Schumacher49.2211.c: "Ensemble, sur un pied d'égalité !"
 
 Schumacher49.2311.t: "Le retour de la souveraineté allemande"
 Schumacher49.2311.d: "Un consensus se forme au sein de la Haute-Commission alliée selon lequel la poursuite de l'occupation de l'Allemagne est stratégiquement intenable. Dans le contexte de la guerre froide, une Allemagne de l'Ouest souveraine est considérée comme un partenaire plus efficace qu'un territoire subordonné. Les conventions en cours se concentrent donc sur la fin du statut d'occupation. L'objectif est de restaurer la quasi-totalité de la souveraineté de la République fédérale, en l'ancrant formellement dans la communauté occidentale en tant qu'allié volontaire et crucial dans la défense de l'Europe."
 Schumacher49.2311.a: "C'est pour le mieux."
 
 Schumacher49.2411.t: "Une lettre de Francfort"
 Schumacher49.2411.d: "Après la mort de Kurt Schumacher, les sociaux-démocrates se sont lancés dans une lutte de pouvoir au sein du paysage politique ouest-allemand. Divisé entre l'aile droite du SPD d'Egon Franke, qui souhaite l'intégration occidentale ainsi que la coopération avec la CDU, et l'aile gauche d'Erich Ollenhauer, qui met l'accent sur le non-alignement de l'Allemagne de l'Ouest dans le paysage géopolitique et sur l'orientation politique des réformes sociales et du fédéralisme.\n\nBien que les deux ailes s'opposent au marxisme sous quelque forme que ce soit, elles ne sont pas toutes deux hostiles à une éventuelle réunification allemande. Plus tôt ce matin, nous avons reçu une lettre du chancelier Egon Franke, contenant divers contenus affirmant la volonté du gouvernement ouest-allemand d'entamer des négociations sur des questions cruciales pour l'Allemagne intérieure, telles que le transit, la citoyenneté, la représentation et d'éventuels efforts de réunification. Il n'est pas sûr de faire confiance à cette lettre, cependant, il convient de préciser qu'il pourrait s'agir d'un minuscule rayon de soleil au sein de l'épais amas nuageux qu'est la Division allemande. Nous devrions garder cela à l'esprit."
 Schumacher49.2411.a: "Une surprise inattendue mais bienvenue."

 Schumacher49.111.t: "Lutte de pouvoir au sein du SPD : Egon Franke contre Erich Ollenhauer"
 Schumacher49.111.d: "Avec Kurt Schumacher comme chancelier, une lutte de pouvoir discrète mais intense a éclaté au sein du SPD entre Egon Franke et Erich Ollenhauer, tous deux se positionnant pour exercer une influence, sachant que la santé de Schumacher finirait par le mettre sur la touche.\n\nFranke, représentant l'aile droite du SPD, a plaidé en faveur de liens plus étroits avec les Alliés occidentaux, de politiques économiques pragmatiques et d'intégration à l'OTAN, estimant que l'adhésion à l'Occident était la clé de la stabilité de l'Allemagne. Ollenhauer, leader de l'aile gauche, a défendu la social-démocratie traditionnelle, l'intervention de l'État dans l'économie et le scepticisme à l'égard de la militarisation occidentale, dans le but de maintenir le SPD ancré dans sa base ouvrière.\n\nAlors que la santé de Schumacher continue de se détériorer, les deux factions s'efforcent de consolider le pouvoir : Franke gagne les faveurs des modérés en quête de stabilité, tandis qu'Ollenhauer rallie le noyau socialiste et les syndicats du SPD. Leur rivalité se manifeste de plus en plus dans les débats internes, menaçant de diviser le parti au moment où il dirige le gouvernement fédéral.\n\n§CNotez que certaines décisions sont déterminées par le degré d'influence de chaque candidat. Les événements clés comme les successions ou les positions provisoires des dirigeants seront soumis à celui qui a le plus d'influence au sein du gouvernement fédéral. L'influence peut être accrue par divers événements et priorités nationales."
 Schumacher49.111.a: "Qui sortira vainqueur ?"
 
 Schumacher49.1.d: "Aujourd'hui encore, c'était une journée mouvementée dans les couloirs du nouveau Bundestag. Au milieu d'un débat acharné sur le fonctionnement fondamental du nouveau gouvernement ouest-allemand, le chef de l'opposition, Konrad Adenauer, de l'Union chrétienne-démocrate, a pris la parole.\n\nDebout sur le côté droit de la salle avec le reste de la CDU derrière lui, il a commencé. \"Mes chers collègues. Alors que nous sortons des horreurs de la guerre avec un nouveau gouvernement démocratique, le chancelier au pouvoir, Herr Schumacher, a emmené notre République fédérale dans une direction nouvelle et dangereuse. Alors que nous essayons de revenir sur la scène mondiale, Herr Schumacher se moque des Alliés et souhaite poursuivre une plus grande coopération avec l'Est...\"\n\nIl a été interrompu par un tumulte de huées féroces et de chahut venant du côté gauche, beaucoup plus large. Les huées ont continué jusqu'à ce qu'un député du SPD s'approche de l'estrade, élevant la voix et interrompant Adenauer.\n\n \"Herr Adenauer... Je ne peux pas commencer à exprimer mon mépris et celui du parti avec vos remarques. L'Union chrétienne-démocrate est non seulement consciente, mais complice de l'hébergement et de la protection des anciens nationaux-socialistes.\"\n\nUn cri de surprise s'est fait entendre dans presque toute la salle, mais les députés CDU ont continué à paraître renfrognés.\n\nIl a continué. \"J'ai en main une liste de nombreux responsables éminents de la CDU qui étaient membres du Parti national-socialiste des travailleurs allemands, notamment Hans Globke et Theodor Oberlander, ainsi que des centaines et des milliers de membres, fonctionnaires et bureaucrates. Cette acceptation sans enthousiasme d'anciens criminels de guerre et traîtres dans le mouvement conservateur est inadmissible et antidémocratique, et c'est pourquoi nous, en tant que parti social-démocrate, condamnons pleinement la CDU pour ses actions.\"\n\n Des applaudissements nourris ont retenti dans toute la salle, alors qu'Adenauer semblait choqué, et la CDU soit est restée silencieuse, soit a commencé à chahuter vers l'autre côté de la salle."
 Schumacher49.2.d: "Aujourd'hui a été un jour mémorable à Francfort, alors qu'un groupe d'officiers et d'hommes se tenaient devant le Romer, le complexe de l'hôtel de ville. Vêtus d'uniformes de style militaire, mais sans aucun insigne, ils ont attendu, en formation, jusqu'à ce qu'un groupe d'hommes en costume émerge, avec le chancelier Kurt Schumacher en tête. Un petit groupe de journalistes et d'autres responsables étaient rassemblés près de près de 500 hommes répartis en cinq formations carrées. Le chancelier Schumacher s'est approché du podium, accompagné du vice-chancelier Egon Franke et du président fédéral Erich Ollenhauer.\n\n» Commença-t-il. \"Mes concitoyens, aujourd'hui est un jour important, non seulement pour la sécurité de notre pays, mais aussi pour le monde occidental dans son ensemble. J'ai l'honneur de présenter les 500 premiers officiers et membres du nouveau personnel de la nouvelle police fédérale des frontières, ou Bundesgrenzschutz. Ces hommes aideront à sécuriser notre frontière contre la menace ou l'incursion communiste, assureront la sécurité de nos réseaux de transport et commenceront à fournir des services de police au niveau fédéral. Je dois souligner que le BGS n'est pas une force militaire. L'Est peut nous accuser de réarmer et je dénoncerai et condamnerai nos actions avec une rhétorique dure, mais je dis une chose : chaque pays mérite la paix intérieure et la sécurité de ses frontières, et l'Allemagne ne devrait pas être différente.\n\nAprès quelques applaudissements, un assistant lui a remis un morceau de papier. \"Je suis maintenant honoré de prêter le nouveau serment du BGS à ses cinq premières compagnies d'officiers. Levez la main droite.\" Cinq cents mains se sont levées.\n\n« Je jure de respecter la Loi fondamentale de la République fédérale d'Allemagne et toutes les lois applicables en République fédérale, et de remplir consciencieusement mes fonctions officielles, alors aide-moi, Dieu !\n\nLes caméras ont clignoté alors que les hommes ont immédiatement commencé à applaudir, à applaudir et à jeter leurs chapeaux en l'air. Le chancelier Schumacher a regardé respectivement le champ de feldgrau, puis Ollenhauer et Franke, qui ont tous deux souri. C'était en effet un jour historique pour la République fédérale, et d'autres hommes prêteraient serment aujourd'hui et dans les jours à venir."
 Schumacher49.3.d: "Le chancelier Schumacher est entré dans la salle de réunion du Cabinet, entrant en valsant tandis que le vice-chancelier Egon Franke faisait signe aux ministres de s'asseoir. Schumacher était assis avec une tasse de café et a commencé par faire un signe de tête au ministre des Affaires étrangères.\n\n \"Monsieur, la Commission de contrôle alliée nous a remis le projet de texte de l'accord de Petersberg. Ils nous font fortement pression pour que nous le signions, car il inclut certaines autorisations nous permettant de poursuivre un semblant de souveraineté indépendante.\"\n\nSchumacher, après avoir lu certaines parties du texte, a parlé assez fort. \"Qu'est-ce que les Alliés ont à dicter leurs exigences à notre nouveau pays ? Nous devrions refuser de signer et dénoncer les conditions des Alliés comme étant déraisonnables.\"\n\n Le vice-chancelier Franke a pris la parole. \"Tout le respect que je dois à Herr Schumacher, mais nous n'avons vraiment pas le choix dans cette affaire. Les Alliés occidentaux nous ont libérés. Ces conditions semblent généralement bénéfiques pour nous, en dehors de la question de la Ruhr... Mais nous pouvons négocier celle-là avec eux.\"\n\nSchumacher a repris la parole. \"Messieurs, écoutez. Ce ne sont pas les termes auxquels je suis opposé. J'ai des problèmes avec les Alliés qui nous imposent des exigences économiques et militaires déraisonnables en échange d'une quantité négligeable de souveraineté. Cela doit être fait d'une autre manière, à mon avis.\"\n\nFranke regarda autour de lui et vit des hochements de tête, des froncements de sourcils. « Mettons cela aux voix ; signons l'accord, ou refusons et apportons des modifications ? »"
 Schumacher49.4.d: "Sur les radios de toute l'Allemagne, la voix du chancelier Kurt Schumacher a commencé à résonner. Ce soir a été un moment mémorable puisque la Chancellerie a annoncé un discours national sur de nouvelles questions politiques.\n\n \"Mes compatriotes allemands. Ce soir, je suis fier de présenter le nouveau programme politique du gouvernement social-démocrate, que nous avons baptisé \"Programme de Francfort\", en hommage à notre brillante capitale. Ce programme sera divisé en trois points, que je passerai en revue, tous destinés à renforcer notre pays, à aider notre peuple et à restaurer notre réputation sur la scène mondiale.\n\n « Premièrement, nous nous lancerons dans un nouveau programme économique Volks, destiné à retrouver notre puissance économique après les dégâts d'après-guerre et l'emprise de la Commission de contrôle alliée. Cela propulsera notre pays à des niveaux économiques jamais vus auparavant !\n\n \"Deuxièmement, la question des conflits politiques internes a tourmenté notre nation des deux côtés, à la fois des anciens nationaux-socialistes et des anciens communistes. Notre gouvernement se lancera dans un programme rigoureux visant à réprimer l'extrémisme comme moyen de fermenter la démocratie et de garantir la confiance dans nos nouvelles institutions.\"\n\n \"Enfin, notre gouvernement reconsidérera nos positions en matière de politique étrangère. Il est devenu clair que, à certains égards, le gouvernement ouest-allemand et les puissances alliées ne peuvent pas s'entendre sur des questions, notamment celle de la Ruhr et de la militarisation. Nos relations avec les puissances européennes et les puissances mondiales seront examinées sérieusement.\"\n\n \"Ces trois points, en tandem, sécuriseront notre pays et aideront tout le monde. Merci à tous et bonne nuit.\""
 Schumacher49.5.d: "DEPUIS; Ministère fédéral provisoire de l'Économie\nÀ ; Chancellerie fédérale\nSujet ; Aperçu du programme économique « Volks »\n\nLe gouvernement ouest-allemand, dans ses capacités provisoires limitées, a proposé quelques points cruciaux pour le nouveau programme économique « Volks », le volet économique du programme de Francfort du SPD. Vous trouverez ci-dessous une liste.\n\n-Création d'un ministère fédéral permanent de l'Économie et des Syndicats\n-Introduction des régimes d'assurance sociale\n-Saisie des installations charbonnières de la Ruhr\n-Priorisation des ressources pour un usage économique national\n-Nationalisation de Volkswagen et IG Farben\n-Adoption de meilleures réglementations de travail pour les travailleurs de l'acier et des mines\n\nNous pensons que ces six points ont la capacité de reconstruire notre puissance économique et productive nationale."
 Schumacher49.6.d: "Sur la Marienplatz de Munich, une foule assez nombreuse s'est rassemblée, toutes face à un podium sur lequel était apposé le sceau de l'Allemagne de l'Ouest. Alors qu'une série de trois voitures Mercedes noires arrivaient sur la place, l'excitation commença à monter dans l'air. Le chancelier Schumacher est sorti, flanqué comme toujours du vice-chancelier Franke et du président Ollenhauer. Après avoir souhaité la bienvenue aux participants, il a commencé.\n\n \"Je suis sûr que certains d'entre vous se demandent pourquoi j'ai choisi Munich pour prononcer ce discours. Non seulement c'est l'une des plus belles villes de toute notre République, mais cette ville a été témoin de l'extrémisme politique des deux côtés, du tristement célèbre putsch raté de la brasserie nationale-socialiste à l'éphémère République soviétique de Munich.\"\n\n \"Nous avons tiré les leçons de nos erreurs du passé et nous sommes pleinement déterminés à éteindre les flammes du nazisme et du communisme dans tous les coins de ce pays. La campagne \"Noir et Rouge\" vise à garantir notre démocratie en punissant et en éliminant tous ceux qui visent à la renverser. Notre gouvernement s'y lancera dès que possible, tout en respectant les droits de notre peuple. Merci à tous. \"\n\n Des applaudissements ont retenti sur la place alors que Schumacher faisait un signe de la main, souriant au public avant de faire signe à une voiture."
 Schumacher49.7.d: "C'était tôt le matin alors qu'une Mercedes noire roulait sur l'autoroute en direction des aciéries de la Ruhr. Marqués de l'insigne de l'Autorité internationale de la Ruhr, deux hommes étaient assis alors qu'ils quittaient la route et s'approchaient de l'une des fréquentes usines de production d'acier et d'extraction de charbon qui parsèment le paysage.\n\nCe fut un choc lorsque la voiture s'arrêta juste devant la porte de l'usine, devant un barrage routier, flanquée de deux agents de la Bundesgrenzschutz, tous deux armés de pistolets dans leur étui.\n\nEn baissant les vitres, le responsable de l'Autorité de la Ruhr au volant avait l'air furieux. « Qu'est-ce que cela signifie, lieutenant ? »\n \"Monsieur, cette aciérie est officiellement la propriété de la République fédérale d'Allemagne et vous n'êtes pas autorisé à y entrer.\"\n \"Qu'est-ce que c'est ? Nous sommes avec l'Autorité internationale de la Ruhr. Voici nos papiers. Nous gérons cette installation.\"\n\n Le lieutenant n'a même pas pris la peine d'examiner les documents qu'on lui a remis. \"Monsieur, j'ai reçu des ordres directs du ministère fédéral de l'Intérieur de ne pas autoriser l'accès de tout personnel non autorisé à cette installation, y compris le personnel de la Ruhr. Veuillez faire demi-tour avec votre véhicule, sinon des moyens de force seront administrés.\" Les policiers ont mis la main sur leur étui.\n\n Les deux hommes se regardèrent, puis se tournèrent vers les policiers. \"C'est insensé... Votre commandant en entendra parler.\" La Mercedes a fait demi-tour et alors que la voiture rejoignait l'autoroute en direction de Dortmund, l'homme assis sur le siège passager a fait remarquer : « Certains appels devront être passés »."
 Schumacher49.70.d: "Plus tôt dans la journée, des fonctionnaires de l'Autorité internationale de la Ruhr (IAR) se sont vu refuser l'accès à une aciérie relevant de leur compétence par des membres armés de la Bundesgrenzschutz (BGS). Les agents, agissant sous les ordres directs du ministère fédéral de l'Intérieur, ont refusé de reconnaître la surveillance de l'Autorité de la Ruhr et ont bloqué l'entrée de nos représentants, avertissant que la force serait utilisée si nécessaire.\n\nCette évolution suggère une démarche délibérée du gouvernement ouest-allemand visant à affirmer un contrôle total sur les industries de la Ruhr sans consultation préalable avec les autorités alliées. La manière dont cela a été réalisé - par une intervention directe en matière de sécurité plutôt que par la voie diplomatique - est particulièrement troublante, car elle crée un précédent pour une action unilatérale qui ne tient pas compte des accords établis.\n\nS'il est clair que le gouvernement du chancelier Schumacher fait pression pour un plus grand contrôle national sur les ressources industrielles, ce défi ouvert à l'autorité de la Ruhr soulève des questions sur les limites de l'autonomie ouest-allemande et sur l'application des politiques économiques alliées."
 Schumacher49.71.d: "DE : La Haute Commission Alliée pour l'Allemagne\nÀ : Le Gouvernement de la République fédérale d'Allemagne\nObjet : Restriction non autorisée du personnel de l'autorité de la Ruhr\n\nNous avons appris que des responsables de l'Autorité internationale de la Ruhr (IAR) se sont vu refuser l'accès à une aciérie sous leur direction par des agents de la Bundesgrenzschutz, sur la base d'ordres du ministère fédéral de l'Intérieur. Les actions de votre gouvernement à cet égard suscitent de sérieuses inquiétudes quant au respect des accords existants concernant les installations industrielles de la Ruhr.\n\nMême si nous reconnaissons que la République fédérale cherche à mieux contrôler ses atouts économiques, les actions unilatérales de cette nature, notamment celles impliquant les forces de sécurité, risquent de saper l'esprit de coopération entre nos gouvernements. Il est impératif que ces mesures soient communiquées à l'avance par la voie diplomatique plutôt que appliquées sans discussion préalable.\n\nCela dit, après délibérations internes, les autorités alliées ont décidé de ne pas aggraver davantage cette affaire. Nous reconnaissons la souveraineté économique de la République fédérale et l'importance de nationaliser les industries clés pour soutenir les efforts de reconstruction. Toutefois, nous déconseillons fortement toute action similaire non coordonnée à l'avenir, car elle pourrait tendre les relations à un moment où la confiance et le partenariat sont de la plus haute importance.\n\nNous espérons que d'autres discussions sur le statut des industries de la Ruhr auront lieu de bonne foi, en veillant à ce que les intérêts de toutes les parties concernées soient pris en compte."
 Schumacher49.8.d: "DEPUIS; Chancelier Kurt Schumacher, gouvernement de la République fédérale d'Allemagne\nÀ ; Président Juan Perón, Gouvernement de la République Argentine\nSujet ; Extradition d'anciens nationaux-socialistes\n\nCher Président Peron,\n\nMon nouveau gouvernement a remarqué que de nombreux anciens nationaux-socialistes, ou « nazis », ont fui vers des pays comme l'Argentine, qui leur a offert un refuge contre nos poursuites ou contre les poursuites alliées.\n\n Nous savons que la République fédérale d'Allemagne souhaite extrader les personnes suivantes en Argentine afin que nous puissions les poursuivre en vertu de nos lois :\n\n-Josef Mengele, connu comme « l'Ange de la Mort », qui a mené des expériences médicales dans les camps de concentration SS\n-Josef Schwammberger, commandant SS en Pologne\n-Erich Priebke, commandant SS responsable du massacre des grottes des Ardennes en 1944\n-Gerhard Bohne, responsable de la logistique administrative du programme d'euthanasie Aktion T-4\n\nL'extradition de ces personnes sous notre garde le plus rapidement possible pourrait présenter certains avantages diplomatiques à l'avenir."
 Schumacher49.80.d: "DEPUIS; Président Juan Perón, Gouvernement de la République Argentine\nÀ ; Chancelier Kurt Schumacher, gouvernement de la République fédérale d'Allemagne\nSujet ; Objet : Extradition d'anciens nationaux-socialistes\n\nCher Chancelier Schumacher,\n\nNous reconnaissons les préoccupations exprimées dans votre correspondance concernant certaines personnes résidant actuellement en République argentine. Cependant, après un examen attentif, le gouvernement argentin doit respectueusement rejeter votre demande d'extradition.\n\nLe cadre juridique de l'Argentine, ainsi que notre attachement à la souveraineté nationale, ne permettent pas l'extradition d'individus sans procédure régulière dans le cadre de notre propre système judiciaire. De plus, notre gouvernement ne s'engage pas dans des poursuites rétroactives fondées sur des griefs politiques ou historiques étrangers. Ceux qui résident à l'intérieur de nos frontières le font sous la protection de la loi argentine et, à ce titre, ils ne seront pas soumis à une extradition basée uniquement sur des pressions extérieures.\n\nTout en valorisant les relations diplomatiques avec la République fédérale d'Allemagne, nous devons également respecter les politiques et principes de notre pays. Nous restons ouverts à la poursuite du dialogue sur les questions d'intérêt mutuel et de coopération entre nos nations."
 Schumacher49.9.d: "Aux premières heures de dimanche dernier, diverses expulsions d'environ 4 000 membres enregistrés du Parti communiste allemand et d'autres organisations apparentées ont été effectuées, tous étant envoyés vers la République démocratique allemande par des voies ferroviaires et routières conventionnelles. L'entrée en République fédérale est désormais interdite à toute personne.\n\nNous espérons qu'environ deux à trois mille personnes supplémentaires seront expulsées dans les semaines à venir et envoyées vers la RDA ou d'autres pays communistes limitrophes.\n\nSIGNÉ\nAnton Grasser\nInspecteur, Bundesgrenzschutz."
 Schumacher49.90.t: "Les communistes ouest-allemands arrivent en Thuringe"
 Schumacher49.90.d: "Depuis ce matin, environ 5 000 camarades déportés de la République fédérale d'Allemagne sont arrivés dans différentes gares de transit de Thuringe, principalement via les passages d'Eisenach, Gerstungen et Probstzella. La majorité de ces personnes sont des membres confirmés du Parti communiste allemand et des organisations socialistes affiliées. De nouvelles expulsions depuis l'Occident sont attendues dans les semaines à venir.\n\nÀ leur arrivée, ces camarades ont été accueillis par des responsables du ministère de la Sécurité de l'État et des représentants du SED, qui ont commencé à examiner et évaluer chaque individu. Beaucoup ont exprimé un fort engagement idéologique en faveur de la cause socialiste, mais un certain nombre semblent également désorientés, désillusionnés ou politiquement peu fiables en raison de leur expulsion forcée de leur foyer.\n\nCette expulsion massive est une manoeuvre désespérée et réactionnaire du gouvernement Schumacher pour se débarrasser de l'opposition idéologique, prouvant la nature antidémocratique de la soi-disant « République fédérale ». Cela représente à la fois un défi et une opportunité : même si nous devons soigneusement sélectionner les informateurs ou contre-révolutionnaires potentiels, nous avons également la possibilité de renforcer nos rangs avec des militants expérimentés."
 Schumacher49.90.a: "Faites-vous une maison, messieurs."
 
 Schumacher49.10.d: "Ministère fédéral de l'Intérieur, Département SI - Journal de surveillance et profil de Max Reimann\n\nLe sujet est Max Reimann, président du Parti communiste allemand (KPD). Agé d'environ 53 ans, Reimann a siégé au conseil consultatif de la zone d'occupation britannique de 1946 à 1948, devenant président du KPD en 1948. Aux élections de 1949, Reimann et son parti ont remporté environ 7 % des voix et sont actuellement membres du Bundestag.\n\nIdéologie\nReimann présente des convictions et des valeurs politiques marxistes-léninistes moyennes. Dans sa position de président du KPD, il s'est élevé contre presque tous les secteurs du gouvernement ouest-allemand, y compris le Grundgesetz, le chancelier fédéral, le président fédéral et le système judiciaire. Nos renseignements indiquent que cette rhétorique se poursuivra et pourrait devenir violente en fonction des événements futurs.\n\nRésumé de l'activité récente\nIl y a une semaine, Reimann a fait une déclaration au Bundestag condamnant non seulement la CDU, mais aussi le parti au pouvoir, le SPD, pour sa « tolérance manifeste à l'égard de l'impérialisme occidental ». Il y a deux jours, nos services de renseignement ont révélé une rencontre entre Reimann et d'autres dirigeants de partis communistes occidentaux, dont le communiste belge Julien Lahaut et le communiste français Jacques Duclos, ainsi que des appels téléphoniques avec des responsables de Berlin-Est et du SED. Cela représente une menace majeure pour la sécurité intérieure du gouvernement ouest-allemand.\n\nEn conclusion, la Division du renseignement continuera de surveiller tous les mouvements, déclarations, conversations téléphoniques et toutes autres formes de communication impliquant Reimann, et préparera des rapports supplémentaires dans la mesure où ils concernent la sécurité nationale."
 Schumacher49.11.d: "Alors qu'un avion de ligne DC-6 atterrissait sur la base aérienne Rhein-Main à Francfort, le chancelier Schumacher faisait les cent pas dans son bureau. Situé à des kilomètres et des kilomètres de l'aéroport de la ville, Schumacher était nerveux, c'est compréhensible. Pourquoi ne serait-il pas inquiet ? Cela représenterait une mesure de relations publiques massive pour le gouvernement allemand, mais McCarthy avait été un peu plus que problématique dans les cercles intérieurs américains.\n\nAvant qu'il ne s'en rende compte, Schumacher était sur la place principale de Francfort, à l'extérieur du Romer, en fanfare, Ollenhauer et Franke derrière lui, serrant la main du sénateur Joseph McCarthy du Wisconsin, le célèbre anticommuniste américain.\n\nLors d'une réunion, les deux hommes sont restés très cordiaux, McCarthy remerciant Schumacher de l'avoir invité.\n\nDiscutant des subtilités de la campagne Noir et Rouge, McCarthy a semblé impressionné, et plus tard, il a assisté à une visite et à une inspection des unités du BGS à Francfort, notant le professionnalisme et la compétence des troupes du BGS.\n\nEn fin de compte, le gouvernement de Schumacher est arrivé en tête - même la CDU est impressionnée par cette démonstration de soutien anticommuniste, tandis que le KPD menace depuis l'ombre." 
 Schumacher49.12.d: "C'était encore une autre réunion standard du cabinet ce matin, et Schumacher était inhabituellement en avance, Ollenhauer et Franke étant choqués de le voir être l'un des premiers dans la salle, avec sa tasse de café habituelle. Alors que le reste des ministres arrivait dans la salle et s'asseyait, Schumacher commença la réunion.\n\n \"Messieurs, nous devons discuter des subtilités du troisième point de notre programme gouvernemental - l'aspect de la politique étrangère. Nous devons nous mettre d'accord sur la voie à suivre sur la scène mondiale. J'accepterai maintenant toutes les suggestions.\"\n\n Franke a immédiatement commencé à parler. \"Herr Chancelier, nous devons, et je veux dire, devons poursuivre notre politique d'intégration occidentale. C'est la seule voie à suivre. Je dis cela en tant que fier membre du SPD, mais l'Occident peut vraiment nous aider d'une manière que nous n'aurions jamais imaginé.\"\n\nOllenhauer a rétorqué. \"Herr Vice-chancelier, je ne suis pas du tout d'accord. Pourquoi devrions-nous nous agenouiller encore plus devant l'Ouest que nous ne l'avons déjà fait ? Traiter les accords de Petersberg n'était que le premier test dans ce domaine. Il y a des membres de ce gouvernement qui veulent une Allemagne indépendante, non contrainte par une quelconque puissance ou bloc, et je crois que c'est ce qu'il y a de mieux pour notre peuple en ce moment, de ne pas être tiré dans aucune direction par l'Est ou l'Ouest.\n\nSchumacher en avait assez entendu. Attirant l'attention de tous les ministres présents dans la salle, il appela au vote ; poursuivre l'intégration occidentale ou suivre une voie de non-alignement ?"
 Schumacher49.13.d: "À qui de droit,\n\nJ'écris au nom du gouvernement ouest-allemand, au sujet des efforts déployés par la Commission de contrôle alliée en faveur du réarmement ouest-allemand.\n\nLe Parti social-démocrate considère qu'il n'est pas opportun que l'Allemagne se réarme pour la sécurité de sa population et condamne fermement la rhétorique de la CDU et des puissances alliées qui imposent le réarmement allemand comme un stratagème pour que l'Allemagne soit le prochain champ de bataille dans notre « Guerre froide ».\n\nLe peuple allemand recherche la sûreté et la sécurité, dans les postures de l'Est ou de l'Ouest. Nous condamnons toute tentative de réarmement dans un avenir proche ; la base de notre service fédéral des frontières était uniquement destinée à nous protéger en interne et ne sera jamais utilisée à des fins externes. Toute autre tentative visant à nous en convaincre ne sera pas considérée de manière positive. Merci."
 Schumacher49.14.d: "Après que le cabinet Schumacher ait décidé d'aller de l'avant avec l'intégration occidentale, contre la volonté d'Ollenhauer, le prochain sujet de discussion était le plan Schuman, une proposition d'accord économique avec les Français qui créerait une « Communauté européenne du charbon et de l'acier » rédigée par le ministre français des Affaires étrangères Robert Schuman.\n\nFranke a lancé la discussion en disant : « Cela semble être une décision assez facile. Si nous souhaitons poursuivre l'intégration occidentale, c'est l'une des étapes nécessaires pour y parvenir. Le simple fait que les Français nous fassent confiance après un demi-siècle d'histoire entre nos deux pays est un bon signe, et je ne vois aucune raison pour laquelle nous refuserions de conclure cet accord historique.» Il avait présenté un bon argument, suscitant même les applaudissements des ministres les plus proches d'Ollenhauer.\n\nSchumacher l'a reconnu, mais a ensuite fait signe à son président fédéral de prendre la parole.\n\n \"Herr Franke, je vois de nombreuses raisons pour lesquelles nous ne devrions pas adhérer à cet accord. Il est clair que depuis que les accords de Petersberg nous ont été accordés, nous avons été contraints de nous plier aux Alliés occidentaux et de faire ce qu'ils veulent. C'est clairement ce que veut la CDU - pourquoi devrions-nous nous engager dans la même politique ? Comment savoir si les Français, dans leur proposition de CECA, ne prendront pas simplement notre charbon et notre acier pour eux-mêmes, comme ils ont pris la Ruhr en 1923 ?\"\n\nCe dernier point a provoqué dans la salle un concert de mécontentement général, d'opposition et de colère.\n\nSchumacher en avait assez entendu. \"À l'ordre ! Messieurs, comportons-nous comme des politiciens et votons là-dessus !\""
 Schumacher49.15.d: "C'était une journée ensoleillée à Washington alors qu'une foule se rassemblait dans le quartier de Foxhall Village, juste à l'ouest de Georgetown. La construction du nouveau Centre culturel allemand, ou Deutsches Kulturzentrum, avait été achevée il y a seulement quelques semaines et des responsables de la République fédérale et des États-Unis étaient désormais arrivés pour inaugurer et ouvrir le bâtiment au public. Le chancelier Schumacher n'était pas présent car il était occupé, mais le président fédéral Erich Ollenhauer avait été envoyé dans ses fonctions cérémonielles de chef de l'Etat, bien qu'à contrecoeur.\n\nOllenhauer s'était dit que c'était toujours une bonne chose, que les échanges culturels étaient importants entre les pays, mais il semblait amer que Schumacher le lui demande spécifiquement ; un homme qui soutenait le fait de ne pas rejoindre l'Occident, d'aller en Occident et de fréquenter les diplomates américains.\n\nSerrant la main du secrétaire d'État américain Dean Acheson, les deux hommes ont discuté des subtilités des échanges culturels, suggérant peut-être de futurs programmes d'échange d'étudiants à l'avenir. Échanger des cordialités était quelque chose qu'Ollenhauer n'aimait pas, mais cela faisait partie de son travail, et alors que les deux discutaient de la différence entre la bratwurst allemande et l'escalope autrichienne, des paires de ciseaux leur furent remises par leurs assistants.\n\n \"Il doit être temps\", a déclaré Ollenhauer, souriant légèrement à Acheson, alors qu'ils se dirigeaient vers le ruban enroulé près de la façade du bâtiment. Alors que les caméras clignotaient, les deux hommes souriaient en coupant le ruban, marquant l'ouverture officielle du Centre culturel allemand et la poursuite de la coopération et du soutien entre les États-Unis et l'Allemagne de l'Ouest."
 Schumacher49.16.d: "Alors que nous retournons au Bundestag, un débat acharné fait rage, cette fois concernant le statut des forces d'occupation alliées en Allemagne de l'Ouest. Le président de la Chambre tentait de mordre le membre de la CDU qui criait sur « l'incompétence du SPD dans notre défense nationale » et sur la « nécessité des troupes américaines ». Une fois qu'un semblant de calme fut atteint, un membre du SPD se leva pour prendre la parole.\n\n \"Comment la CDU et ses partenaires ont-ils pu subir un tel lavage de cerveau et une telle confusion? Cela me dépasse. Tout le respect que je dois à la mission des forces d'occupation alliées, mais leur présence est indésirable, injustifiée à ce stade, et elles accaparent des ressources précieuses dont notre pays a besoin pour reconstruire. Nous avons un gouvernement social-démocrate stable et nous n'avons pas besoin de troupes étrangères qui patrouillent dans nos rues et conduisent leurs chars sur nos autoroutes. Le BGS est suffisant pour résoudre nos problèmes de sécurité intérieure, nous n'avons pas besoin que les Américains le fassent à notre place. Je demandez à cette Chambre de voter une résolution demandant le départ volontaire des forces d'occupation alliées de notre pays.\n\nLa salle a explosé dans un chaos de chahut, de mécontentement général, d'acclamations et d'applaudissements bruyants du côté du SPD, et de cris de « Maintenir le statu quo » de la part de la CDU et du FDP. Le président a frappé avec son marteau pour rétablir l'ordre, puis a déclaré \"Je déclare le vote sur cette résolution. Le vote va maintenant commencer au scrutin secret\"."
 Schumacher49.160.d: "DE : La Haute Commission Alliée pour l'Allemagne\nDESTINATAIRE : Les gouvernements des États-Unis, du Royaume-Uni et de la République française\nObjet : Résolution sur le départ volontaire des forces d'occupation alliées\n\nSuite à de récents débats au sein du Bundestag, la République fédérale d'Allemagne a formellement voté une résolution demandant le retrait volontaire des forces d'occupation alliées de son territoire. La motion, présentée par des membres du gouvernement dirigé par le SPD, qualifiait la poursuite de l'occupation de pays inutile et pesant sur les efforts de reconstruction de l'Allemagne, arguant que les problèmes de sécurité intérieure pourraient être suffisamment gérés par la Bundesgrenzschutz nouvellement créée.\n\nLe vote, bien que controversé, a finalement été adopté, avec le soutien significatif des députés du SPD et de leurs alliés. Les factions CDU et FDP ont exprimé une forte opposition, invoquant des problèmes de sécurité et la nécessité de maintenir la présence militaire américaine, britannique et française comme moyen de dissuasion contre l'agression soviétique. Malgré des échanges houleux, l'administration du chancelier Schumacher a réaffirmé son engagement en faveur de la coopération avec les Alliés occidentaux et a assuré que cette décision n'indiquait pas un changement d'alignement de la politique étrangère.\n\nCompte tenu de la stabilité actuelle de la République fédérale et de l'absence de menaces immédiates pour la sécurité, nous estimons que contester cette résolution pourrait générer des frictions politiques inutiles. Même si un retrait complet des forces d'occupation n'est pas réalisable dans l'immédiat, une réduction progressive de la présence des troupes - tout en maintenant la coopération militaire stratégique - pourrait être la ligne d'action la plus prudente. La poursuite de l'engagement diplomatique avec Bonn sera nécessaire pour garantir que l'Allemagne reste fermement intégrée au sein du bloc occidental tout en accordant à son gouvernement l'autonomie qu'il recherche désormais.\n\nNous conseillons néanmoins de maintenir une approche prudente. La situation doit être surveillée de près pour évaluer si cette décision a des implications plus larges sur l'alignement de l'Allemagne sur les objectifs de sécurité occidentaux. D'autres discussions seront nécessaires pour déterminer le calendrier et la logistique de toute réduction potentielle des troupes."
 Schumacher49.161.d: "Suite à l'adoption par le Bundestag de la résolution demandant le retrait volontaire des forces d'occupation alliées, les gouvernements des États-Unis, du Royaume-Uni et de la France ont réexaminé la question et sont parvenus à un consensus. Tout en reconnaissant le désir de la République fédérale d'une plus grande souveraineté et d'une plus grande autonomie en matière de sécurité, ils soulignent également l'importance du maintien de la coopération occidentale pour garantir la stabilité en Allemagne et en Europe dans son ensemble.\n\nLa Haute-commission alliée n'a donc pas l'intention de faire obstacle à la décision du Bundestag. Toutefois, toute réduction de la présence militaire alliée se fera progressivement et en étroite coordination avec le gouvernement fédéral afin d'éviter d'éventuels risques pour la sécurité. La préservation de la sécurité de l'Allemagne de l'Ouest et son intégration dans le cadre défensif occidental demeurent des priorités essentielles.\n\nIls sont convaincus que cette étape n'altèrera pas les relations solides entre nos nations et attendent avec impatience de poursuivre les discussions sur les aspects pratiques de la mise en oeuvre de cette transition."
 Schumacher49.17.d: "DEPUIS; Chancelier Kurt Schumacher, gouvernement de la République fédérale d'Allemagne\nÀ; Max Petitpierre, président du Conseil fédéral suisse, et Tage Erlander, Premier ministre suédois\nSujet ; Neutralité européenne\n\nChers Messieurs,\n\nJ'espère que cette note vous trouvera bien. Comme vous le savez, la République fédérale d'Allemagne, nouvellement fondée, poursuit une forme de diplomatie des non-alignés, repoussant l'influence des blocs de l'Ouest et de l'Est. Notre ministère des Affaires étrangères considère la Confédération suisse et le Royaume de Suède comme deux pays neutres et potentiellement amis avec lesquels la République fédérale souhaite approfondir ses relations dans le cadre de sa lutte contre les superpuissances dans cette « guerre froide ». J'espère travailler davantage avec vos pays à l'avenir."
 Schumacher49.18.d: "Alors que l'avion commençait son approche vers l'aéroport de Belgrade, Schumacher finit son verre de cognac et le fit emporter avant que l'avion ne rebondisse et s'arrête. C'était en fin d'après-midi, Schumacher fut accueilli par une fanfare et une formation de troupes de l'Armée populaire yougoslave. Serrant la main du chef d'état-major yougoslave, Schumacher a été emmené dans une voiture qui l'a emmené au centre de Belgrade, où il a été accueilli avec la même fanfare par le secrétaire général de la Ligue des communistes de Yougoslavie, Josep Broz Tito. Échangeant des plaisanteries, les deux hommes et leurs homologues diplomatiques se mirent bientôt au travail ; ce n'était pas une visite diplomatique ordinaire.\n\nLes deux ont parlé des similitudes entre leurs pays ; L'expérience de Tito avec Staline et l'expérience de Schumacher avec les Alliés occidentaux. Tous deux convenaient que les tactiques des blocs de l'Ouest et de l'Est étaient corrosives pour leur peuple, et même si Schumacher détestait le communisme avec une passion ardente, il avait un respect fondamental pour Tito, un homme qui se souciait vraiment de son peuple.\n\nLe voyage a duré une semaine, les deux parties étant convenues d'ouvrir des relations diplomatiques formelles et de poursuivre leurs relations amicales à l'avenir."
 
 SchuStroke.100.t: " [GetNewspaperHeader] Egon Franke est nommé chancelier par intérim en Allemagne de l'Ouest"
 SchuStroke.100.d: "La République fédérale a été plongée hier soir dans un état d'incertitude lorsque la Chancellerie a annoncé que le chancelier Kurt Schumacher avait été victime d'un grave accident vasculaire cérébral. Le premier chancelier du SPD en Allemagne depuis 1930 serait dans un état grave et les médecins ne proposent aucun pronostic immédiat quant à son rétablissement.\n\nLe vice-chancelier Egon Franke a officiellement assumé les fonctions de Chancellerie à titre intérimaire. Alors que Schumacher est connu pour ses principes inflexibles et son nationalisme conflictuel, Franke est la figure de proue de la droite pragmatique et plus compromettante du SPD. Alors que le rôle de Franke est officiellement celui d'un intérimaire jusqu'au retour potentiel du chancelier, les cercles politiques de Bonn sont remplis de spéculations. Il reste à voir si le gouvernement intérimaire maintiendra simplement le cap de Schumacher ou s'orientera vers les politiques plus modérées favorisées par le nouveau responsable."
 SchuStroke.100.a: "Problèmes en Allemagne."
 
 SchuStroke.101.t: " [GetNewspaperHeader] Erich Ollenhauer est nommé chancelier par intérim en Allemagne de l'Ouest"
 SchuStroke.101.d: "La République fédérale a été plongée hier soir dans l'incertitude après que la Chancellerie a confirmé que le chancelier Kurt Schumacher avait été victime d'un grave accident vasculaire cérébral. Selon la direction de presse officielle de la Chancellerie, Schumacher est dans un état grave et ses médecins n'ont donné aucun calendrier immédiat pour un éventuel rétablissement.\n\nMalgré l'espoir d'une reprise de la chancellerie par le vice-chancelier Egon Franke, comme le prévoit la Constitution, le président fédéral Erich Ollenhauer a été confirmé comme gardien du gouvernement fédéral. Cette décision est largement considérée comme un jeu de pouvoir décisif de la part de l'aile gauche du SPD pour empêcher le pragmatique Egon Franke, de droite, de prendre le contrôle. Les alliés de Franke auraient dénoncé cette décision comme un « coup de palais » qui viole les normes constitutionnelles.\n\nLa question clé est de savoir si le tempérament stable et moins énergique d'Ollenhauer peut exercer la même autorité et maintenir la cohésion du gouvernement face aux défis urgents du pays. Alors que la nation espère le rétablissement du chancelier, son gouvernement repose désormais entre les mains d'une direction différente du SPD."
 SchuStroke.101.a: "Problèmes en Allemagne."
 
 
 SchuStroke.1.d: "Alors que la femme de chambre frappait à la porte de la chambre privée du chancelier Kurt Schumacher, elle devenait de plus en plus inquiète. Cela ne lui ressemblait pas de ne pas se réveiller aussi tard, d'autant plus qu'une réunion du cabinet devait avoir lieu dans moins d'une heure.\n\nEn tâtonnant avec un trousseau de clés, elle réussit finalement à ouvrir la porte et, en regardant à l'intérieur, elle aperçut le chancelier de la République fédérale d'Allemagne, Kurt Schumacher lui-même, affalé sur son lit, inconscient. La servante poussa un cri à glacer le sang, attirant l'attention des majordomes et autres membres du personnel de la chancellerie, qui se précipitèrent avec des réactions de choc similaires.\n\nSorti de nulle part, le chef de cabinet de Schumacher, Dietrich Steube, est arrivé pour tenter de calmer la situation.\n\n \"Amenez le vice-chancelier et le président fédéral ici tout de suite ! Rassemblez le cabinet, mais dites à Franke qu'il est aux commandes jusqu'à ce que nous puissions régler la situation.\"\n\nDésignant le personnel rassemblé, il a déclaré : \"Appelez le médecin du Chancelier ! Nous devons l'emmener immédiatement à l'hôpital !\""
 SchuStroke.2.d: "Quelques heures seulement après que le chancelier Kurt Schumacher ait été victime d'un accident vasculaire cérébral, le Cabinet de la République fédérale s'est réuni, dirigé provisoirement par le vice-chancelier Egon Franke. Même si le président fédéral Erich Ollenhauer n'était pas obligé d'être présent, il était quand même présent dans la salle, d'autant plus que le débat porterait sur le récent changement de direction.\n\nLe Cabinet a été choqué, alors que les ministres se chuchotaient. Franke a ouvert la réunion.\n\n \"Je suis sûr que nous sommes tous à juste titre inquiets et choqués d'apprendre que le Chancelier a eu un accident vasculaire cérébral ce matin dans sa résidence. On m'a assuré qu'il était soigné à l'Hôpital du Saint-Esprit et qu'il se trouvait dans un état stable.\" Un soupir de soulagement parcourut la pièce.\n\n \"Maintenant, nous devons venir au sujet central de cette réunion du Cabinet. Il n'y a pas de ligne de succession claire si le chancelier est frappé d'incapacité ou tué, et maintenant que nous sommes confrontés à cette situation potentielle, une décision doit être prise.\"\n\nOllenhauer parla depuis le coin de la pièce. \"Comme le vice-chancelier Franke n'est pas explicitement le successeur légal du chancelier Schumacher, il ne devrait pas être à la tête du pays à ce stade.\" La pièce est devenue un peu plus bruyante à ce moment-là, mais Ollenhauer a continué à parler.\n\n « Le président fédéral est le chef de l'État et est donc mieux placé pour agir en tant que leader temporaire du pays. »\n\nFranke a répliqué. \"En tant que vice-chancelier, je suis le successeur direct du chancelier, nommé directement par lui. Quelle raison de plus aurais-je ?\"\n\nUn ministre a pris la parole. \"Nous devons voter là-dessus. Quoi qu'il en soit, le Bundestag devra voter sur le successeur, à condition que le chancelier ne parvienne pas à se rétablir.\" Franke hocha la tête. \"Très bien alors. Herr Ollenhauer, que le meilleur gagne. Veuillez enregistrer votre vote sur un bout de papier et le déposer auprès du chef d'état-major, qui comptera les votes.\""
 SchuStroke.3.d: "\"Avec l'avis et le consentement du cabinet ouest-allemand, le vice-chancelier Egon Franke a été confirmé comme chancelier temporaire de l'Allemagne de l'Ouest, à la suite du récent accident vasculaire cérébral du chancelier Kurt Schumacher. En tant que choix personnel de Schumacher à son arrivée au pouvoir, Franke est particulièrement qualifié pour diriger le pays en cette période de grand besoin.\"\n\nFranke sourit à l'article en première page du plus grand journal de Francfort. Se tournant vers le petit groupe de personnes à la Chancellerie, il a posé sa main gauche sur un exemplaire de la Loi fondamentale et a levé la main droite.\n\n \"Je jure que je consacrerai mes forces au bien-être du peuple allemand, que je renforcerai ce qui est à son avantage, que je conjurerai ce qui pourrait lui nuire, que je respecterai et défendrai la Loi fondamentale et les lois de la Fédération, que je remplirai consciencieusement mes devoirs et que je rendrai justice à chaque homme, alors aide-moi, Dieu.\"\n\nAu milieu d'applaudissements nourris, un personnage n'applaudissait pas ; Erich Ollenhauer, le président fédéral, qui, comme l'exige la Constitution, était présent lors de la prestation de serment. Espérons que cela ne durera pas longtemps."
 SchuStroke.4.d: "\"Avec l'avis et l'accord du cabinet ouest-allemand, le président fédéral Erich Ollenhauer a été confirmé comme chancelier provisoire de l'Allemagne de l'Ouest, à la suite de l'accident vasculaire cérébral récent du chancelier Kurt Schumacher. En tant qu'homologue de Schumacher à la tête de l'Etat, Ollenhauer est idéologiquement aligné sur Schumacher, au grand dam du vice-chancelier Egon Franke, qui a une vision plus à droite au sein du SPD. Cependant, Ollenhauer a fait ses preuves au cours de son mandat en tant que Président fédéral comme étant prêt et disposé à relever le défi qui l'attend.»\n\n Ollenhauer sourit en lisant l'article en première page du plus grand journal de Francfort. Se tournant vers le petit groupe de fonctionnaires de la Chancellerie, il a posé sa main gauche sur un exemplaire de la Loi fondamentale et a levé la main droite.\n\n \"Je jure que je consacrerai mes forces au bien-être du peuple allemand, que je renforcerai ce qui est à son avantage, que je conjurerai ce qui pourrait lui nuire, que je respecterai et défendrai la Loi fondamentale et les lois de la Fédération, que je remplirai consciencieusement mes devoirs et que je rendrai justice à chaque homme, alors aide-moi, Dieu.\"\n\nAu milieu d'applaudissements nourris, se tenait un homme placé dans une situation précaire ; Egon Franke, toujours vice-chancelier actuel et rival d'Ollenhauer, est désormais mis à l'écart en tant que commandant en second. Espérons, pensa-t-il, que cela ne durerait pas longtemps."
 SchuStroke.5.d: "Lorsque le chancelier entra dans la salle du cabinet, il était confus. Quelques semaines seulement après le début de ses fonctions temporaires de chancelier, il avait une situation diplomatique à désamorcer.\n\nDirigant son attention vers le ministre des Affaires étrangères, il se mit à écouter.\n\n \"Monsieur chancelier, le secrétaire général soviétique Joseph Staline a présenté des propositions pour la réunification allemande, en supposant que nous soyons neutres et garantissons \"les droits de l'homme et les libertés fondamentales\". Les responsables alliés soupçonnent que les \"notes de Staline\" ne sont qu'un bluff permettant aux Soviétiques de blâmer les Alliés pour une Allemagne divisée. Monsieur, nous devons gérer cela le plus tôt possible. \"\n\nIl a parlé. \"Autant que j'apprécie nos collègues de Washington et de Londres, ils semblent qualifier presque tout de complot soviétique contre eux. Je pense que l'Allemagne devrait être neutre dans cette nouvelle guerre froide qui s'étend rapidement - mais si c'est selon les conditions des Soviétiques, je ne serais pas si prompt à juger.\"\n\nLe ministre de la Défense a commencé à parler. \"Monsieur, même si je suis d'accord, je dois protester fermement. Nous ne devrions plus laisser de temps à ce stratagème soviétique. L'unification est importante, mais pas dans ces circonstances.\"\n\nLe Chancelier hocha la tête. \"Très bien. Mettons cela aux voix.\""
 SchuStroke.6.d: "Depuis l'accident vasculaire cérébral tragique subi par le chancelier Schumacher, le débat sur la succession au gouvernement fait rage. Afin de résoudre ce problème, un groupe de politiciens du SPD dirigé par le chancelier provisoire Ollenhauer a proposé un amendement à la Loi fondamentale fixant une ligne de succession pour le chancelier fédéral à l'avenir. Destiné à compléter l'article 57, l'amendement se lit comme suit :\n\n « En cas d'incapacité du chancelier fédéral d'exercer ses fonctions ou en cas de vacance prématurée de ses fonctions, les fonctions de chancelier fédéral seront exercées par le président fédéral, suivi du vice-chancelier et du président du Bundesrat.»\n\nLors de discussions privées, le vice-chancelier Egon Franke a considéré cela comme une mise à l'écart de son autorité, surtout après son éviction de son poste de chancelier lors de la première crise de succession. Il devrait être adopté au Bundestag, notamment en tant que question bipartite par rapport à la question de succession d'il y a plusieurs semaines."
 SchuStroke.7.d: "En grande pompe, Kurt Schumacher est revenu à la Chancellerie fédérale de Francfort, de retour de sa convalescence et de sa rééducation à l'Hôpital du Saint-Esprit suite à son accident vasculaire cérébral. Alors qu'il se préparait à prêter serment, Schumacher a rencontré le chancelier provisoire, le président fédéral et d'autres responsables. Ollenhauer, semblant plutôt heureux de voir Schumacher revenir, lui a souhaité bonne chance et était heureux de retourner au poste de président fédéral avec le retour de Schumacher. La réaction de Franke fut cependant plutôt différente. Tout étant en faveur de la préservation de la ligne de succession et de l'État de droit, il s'est senti mis à l'écart par les relations amicales entre Schumacher et Ollenhauer, et même s'il était le choix du chancelier comme adjoint, il a été déçu de reprendre son ancien rôle.\n\nAvec la main sur le même exemplaire de la Loi fondamentale qui a servi à la prestation de serment de l'ancien chancelier [WGR.GetLeader], Kurt Schumacher était de retour !"
 SchuStroke.8.d: "Ce fut une autre journée mouvementée au Bundestag, mais cette fois sur un sujet différent. Après le récent retour de Kurt Schumacher comme chancelier, la CDU s'est opposée à sa reconduction, considérant qu'il s'agissait d'une mesure politique visant à consolider le pouvoir du SPD.\n\n Un député de la CDU s'est levé pour poursuivre le débat qui avait commencé. \"Regardons cela avec logique, ce que je sais que mes collègues de gauche ne sont pas capables de faire.\" Rires de la CDU, huées du côté du SPD.\n\n \"Le chancelier est victime d'un accident vasculaire cérébral, que Dieu l'aide. Il est remplacé comme chancelier provisoire par un autre ministre du SPD, car la ligne de succession est débattue à mort. Mais le chancelier Schumacher revient? Et le peuple allemand est censé être d'accord avec cela? Le passage d'un ministre à un autre, sans aucun contrôle du Bundestag ou du peuple directement? L'état du chancelier Schumacher est-il vraiment stable? Il a déjà subi un accident vasculaire cérébral, que dire de lui? Tu n'en souffriras pas un autre ?\n\n Il a été rapidement arrêté par un choeur de huées et de cris, même de la part de certains membres de son propre parti. La critique concernant l'état de Schumacher était allée trop loin, mais le SPD devait réagir, alors qu'un député se levait pour prendre la parole.\n\n \"Pour répondre au député CDU à ma gauche, vos commentaires sur l'état du chancelier sont injustifiés et inappropriés dans cette Assemblée ! Et pour répondre aux inquiétudes suscitées par la transition, il était nécessaire de maintenir la stabilité et le fonctionnement du gouvernement de la République fédérale pendant que le chancelier se reposait et récupérait. Comme son état s'est amélioré, il a été reconduit dans ses fonctions de chancelier, principalement parce qu'il a été dûment élu par le peuple pour servir. La CDU aurait fait la même chose si cela était arrivé à M. Adenauer.\"\n\n Du côté de la CDU, le silence choqué a résonné. Personne ne s'est levé pour parler. Pendant ce temps, les députés du SPD regardaient avec des sourires narquois, sans même rire. Le SPD gagne à nouveau."
 SchuStroke.9.d: "Schumacher était assis dans son bureau un samedi soir pluvieux, se remémorant les dernières années. Gagner la Chancellerie, devenir le premier dirigeant du SPD en Allemagne depuis des décennies, accomplir des pas de géant en matière politique, pour ensuite voir tout s'effondrer avec son accident vasculaire cérébral et sa guérison. Il y avait eu toute l'affaire de la succession que la CDU et son appareil de propagande avaient tenté de mettre en pièces. Schumacher avait fait tout ce qu'il pouvait, et entre les deux députés qui se disputaient le pouvoir du SPD, l'un d'eux s'alignait davantage sur l'idéologie et la politique de Schumacher : Erich Ollenhauer.\n\nIl était temps de le préparer, que Franke le veuille ou non. Regardant par la fenêtre, il appela sa secrétaire.\n\n \"Amenez Erich.\""
 SchuDeath.1.d: "Tout le personnel savait depuis un moment que cela allait arriver. Ollenhauer avait été informé quotidiennement de l'état de Schumacher au cours des derniers mois depuis son retour, et le plan d'urgence avait été élaboré.\n\nLes deux hommes discutaient un matin dans le bureau du chancelier et, alors qu'ils discutaient de politique, Schumacher s'est arrêté brusquement.\n\n \"Erich, j'ai réfléchi.\" \n\n « Et, Herr Chancelier ? »\n\n \"Erich, c'est mon héritage. Nous avons tant fait, et même pendant mon absence, comment se souviendra-t-on de moi ?\"\n\n \"Monsieur, vous êtes le premier chancelier du SPD depuis des décennies ; nous avons construit le pays, construit un rempart contre l'extrémisme et repensé notre politique étrangère.\"\n\n Schumacher avait l'air soulagé. \"Oui, je suppose que oui-\"\n\nIl haleta, serrant sa poitrine et tombant au sol.\n\nOllenhauer, essayant de faire de son mieux, aida Schumacher à se mettre dans une position plus confortable, puis se dirigea vers le bureau et composa le numéro du téléphone à cadran.\n\n \"Herr Doktor ? C'est Erich. C'est encore arrivé, probablement pour de bon.\"\n\n Les médecins se sont précipités à nouveau, car Ollenhauer a déclaré qu'il avait fait tout ce qu'il pouvait. Cette fois, le chancelier de la République fédérale d'Allemagne, Kurt Schumacher, était bel et bien mort."
 SchuDeath.2.d: "Alors qu'Ollenhauer s'installait dans le fauteuil du bureau du chancelier, il se souvint de tout ce qui s'était passé ces derniers mois. C'était désormais terminé, car Ollenhauer et sa clique s'étaient consolidés comme l'avenir du SPD, au moins jusqu'aux élections fédérales de 1953.\n\nFranke et son groupe de Kanalarbeiters de l'opposition au SPD avaient discrètement menacé de manifester, mais Ollenhauer avait réussi à les dissuader, par sentiment d'unité au sein du SPD.\n\nIl y avait beaucoup à faire, et peu de temps, avant les élections. Des funérailles nationales à planifier, un gouvernement à former, un pays à stabiliser et à pleurer pendant quelques mois. Une campagne pour gagner les quatre prochaines années. Ollenhauer se ressaisit et commença à trier les papiers."
 SchuDeath.3.d: "C'était tôt lundi matin à la Chancellerie fédérale, lorsque les collaborateurs sont arrivés par groupes de deux, allumant les lumières, démarrant la machine à café et commençant à rédiger les rapports de politique et d'information habituels.\n\nÀ 7h30, le chef de cabinet d'Ollenhauer, Dietrich Steube, est arrivé au bureau, souriant à tous les collaborateurs déjà occupés au travail. Il n'avait même pas fini de se servir sa première tasse de café de la matinée lorsqu'un groupe d'hommes, tous vêtus de costumes, a fait irruption dans le couloir devant son bureau, s'avançant vers lui, mené par le vice-chancelier Egon Franke.\n\n « Quelle est la signification de cela ? » Stuebe a failli crier avant d'être coupé.\n\n \"NOUS sommes ici pour protester, Herr Steube. Ce coup d'État de Herr Ollenhauer et de ses acolytes est allé assez loin : d'abord la crise de succession, et maintenant celle-ci ?\" Alors que de plus en plus d'hommes entraient dans la pièce derrière lui, tandis que d'autres se déplaçaient dans le bâtiment, debout, les bras croisés, avec un sourire narquois. « Nous, les Kanalarbeiters, les véritables représentants du SPD, exigeons JUSTICE sur cette question, et nous l'exigeons maintenant !\n\nSteube regarda simplement, choqué, en bafouillant. » continua Franke. \"Nous ne quitterons pas la Chancellerie jusqu'à ce que cette question soit résolue de manière constructive une fois pour toutes, lorsque le chancelier lui-même permettra à tous les membres du SPD de travailler au gouvernement et, si possible, de démissionner de son poste!\"\n\nÀ ce moment-là, tous les membres se sont retournés alors qu'Ollenhauer marchait dans le couloir en direction de son bureau voisin, s'arrêtant pour observer l'agitation.\n\n « De quoi s'agit-il, Steube ? \"Monsieur, Franke et les Kanalarbeiter occupent le bâtiment et refusent de partir tant que nous n'aurons pas résolu le problème de leadership.\"\n\n « Très bien, alors, comment pouvons-nous régler cela, Egon ? »"
 SchuDeath.4.d: "Depuis l'élection de Kurt Schumacher et du Parti social-démocrate au pouvoir en 1949 en tant que premier chancelier de la République fédérale, le SPD est devenu de plus en plus divisé entre le plaignant (Herr Franke) et le défendeur (Herr Ollenhauer), car ils sont en désaccord sur diverses questions de politique et d'idéologie en ce qui concerne le SPD.\n\nLe conflit est devenu plus ouvert après le premier coup de Kurt Schumacher, plaçant le gouvernement dans une crise de succession qui s'est terminée par une bataille d'influence dans l'impasse.\n\nLe plaignant, Egon Franke, affirme que la succession d'Erich Ollenhauer, son rival, à la mort prématurée de Schumacher était un coup d'État contre le SPD, contre le peuple, et que son groupe, connu sous le nom de Kanalarbeiters (ou travailleurs des égouts), n'a pas son mot à dire dans la politique du gouvernement du SPD. Surtout, il a expliqué que le retour de Schumacher au pouvoir était une décision délibérée visant à légitimer Erich Ollenhauer en tant que prochain dirigeant du SPD, par opposition à lui.\n\nCependant, Ollenhauer et son gouvernement soutiennent que Schumacher a été très précis sur la nomination d'un successeur et que, comme le gouvernement a été en proie à deux reprises à une crise de succession, il est nécessaire de nommer Ollenhauer jusqu'aux prochaines élections. Ollenhauer a repoussé cette affaire mais ne l'a pas rejetée par respect pour le processus démocratique et le système judiciaire.\n\nIl faudra décider s'il faut conserver Ollenhauer ou autoriser Franke à siéger à titre provisoire jusqu'aux élections."
 SchuDeath.5.d: "C'était un matin pluvieux lorsque Franke, suivi par quelques collaborateurs, entra dans une salle de conférence du siège du Parti chrétien-démocrate à Francfort, où étaient assis deux responsables de la CDU ; Konrad Adenauer, le chef de l'opposition, et Ludwig Erhard, son adjoint. Franke s'assit à l'autre bout de la table et les deux groupes commencèrent à parler.\n\n \"Merci d'être venu, Herr Franke.\"\n \"C'est avec plaisir, Herr Adenauer. Je suis heureux que nous puissions parvenir à un accord mutuel, même si nos partis sont farouchement opposés.\" \n\n \"Nous devons trouver quoi faire à propos de Herr Ollenhauer. Il représente une menace pour nous deux. Vous faites peut-être partie de son parti, mais il existe des différences évidentes.\"\n\n \"C'est précisément pour cela que je suis venu vous rencontrer. Les membres du SPD d'Ollenhauer ont la majorité au Bundestag, mais mon groupe, les Kanalarbeiters, sont prêts à voter avec la CDU et le FDP sur des questions qui vont à l'encontre de l'agenda du chancelier. S'il doit être chancelier, nous lui rendrons la tâche aussi difficile que possible jusqu'aux élections.\"\n\nAdenauer eut l'air plutôt content et jeta un coup d'oeil à Erhard, qui hocha la tête. \"Très bien alors, je suis très heureux que nous puissions nous rencontrer pour en discuter.\"\n\nLes deux hommes, Franke et Adenauer, se serrèrent la main, puis sourirent tandis que Franke quittait la pièce à grands pas."
 SchuDeath.6.d: "Une journée mémorable se déroulait une fois de plus à la Chancellerie, alors que le gouvernement changeait de mains pour ce qui semblait être la cinquième fois en un an. Franke, entouré de collaborateurs et de fonctionnaires, a levé la main droite et a répété le serment du chancelier fédéral, ouvrant ainsi la voie à un gouvernement intérimaire jusqu'aux élections.\n\nEn fin de compte, Franke avait gagné, non seulement au sens juridique de l'affaire devant la Cour constitutionnelle fédérale, mais également à un niveau d'influence, ralliant le public contre Ollenhauer et vers une social-démocratie plus à droite et conservatrice.\n\nOllenhauer était là, en tant que chancelier sortant, et a géré la situation avec une certaine grâce, mais estimant que ce serait au moins la fin de son temps dans la politique fédérale."
 SchuDeath.7.d: "\"Citoyens allemands, il y a eu beaucoup de discussions et de protestations autour de mon accession au poste de chancelier après la mort prématurée de Kurt Schumacher par accident vasculaire cérébral, que Dieu ait son âme.\"\n\nOllenhauer a parlé à la radio, un soir de semaine typique, comme le faisait habituellement son prédécesseur.\n\n \"Il était nécessaire de poursuivre sur la voie d'un gouvernement stable, en particulier après la première crise de succession au début de cette année. Mes rivaux au sein du parti, en particulier M. Franke, m'ont accusé de coup d'État, et je comprends cette impression; mais vous devez comprendre que mon mandat ne dure que jusqu'aux élections de 1953; si vous, le peuple, décidez de voter pour le SPD, c'est certainement votre droit de le faire. Mais si un nouveau gouvernement entre en fonction, la Loi fondamentale sera respectée et je démissionnerai. Je ne peux que J'espère que vous, le peuple, prendrez la bonne décision pour votre pays, et je continuerai à servir dans ce gouvernement au mieux de mes capacités jusqu'à ce moment-là.\n\nAlors que le technicien radio faisait signe qu'il n'était plus en ondes, Ollenhauer soupira. Espérons que ce soit l'astuce pour convaincre le peuple qu'il était le chancelier légitime, du moins pour le moment. Il avait subtilement évoqué l'élection comme un moyen d'inciter les gens à voter pour le SPD, mais après cette pagaille avec Schumacher, il avait moins confiance dans les chiffres des sondages. Espérons que tout s'arrangera, pensa-t-il."
 SchuDeath.8.d: "C'était une journée sombre sur la place principale devant le Romer de Francfort, car la ville était pratiquement à l'arrêt aujourd'hui, le jour des funérailles nationales de l'ancien chancelier Kurt Schumacher. Alors que les personnes en deuil bordaient les rues, une calèche transportant le cercueil de Schumacher, drapé du nouveau drapeau allemand, s'est approchée de la place et s'est arrêtée au centre, où se trouvait une scène. Plusieurs milliers de hauts fonctionnaires et dignitaires de la République fédérale, mais aussi des États-Unis, du Royaume-Uni et de la France étaient présents, ainsi que d'autres alliés européens.\n\nOllenhauer est venu prononcer l'éloge funèbre, comme l'avait spécifiquement demandé son ami.\n\n \"Citoyens d'Allemagne et dignitaires rassemblés. Aujourd'hui, nous nous réunissons pour célébrer la vie et les réalisations d'un véritable grand homme et d'un grand dirigeant de la République fédérale au cours de l'un de ses moments les plus cruciaux en tant que nouvelle nation. Kurt a véritablement été le pionnier de l'idée de la social-démocratie allemande moderne et ses politiques, y compris le désextrémisme, la reconstruction économique et la restructuration de la politique étrangère, ont mis notre pays sur une voie vraiment grande. Nous devons reconnaître ses réalisations et ses échecs, et ses problèmes de santé inopportuns ont également mis fin à l'oeuvre de sa vie. Bientôt. »\n\nEn disant cela, toute la foule a éclaté en applaudissements, tandis qu'une ligne de 7 soldats du BGS, armés de fusils, les a levés et a tiré.\n\nFissure. Un clic pendant qu'ils rechargeaient. Fissure. Un clic. Un troisième et dernier craquement.\n\nAlors que l'escouade remettait ses armes au « garde-à-vous », un clairon commença à jouer, tandis que deux autres soldats du BGS soulevaient le drapeau allemand du cercueil et commençaient à le plier. Certaines personnes se sont mises à pleurer, tandis que tout le monde avait l'air désespéré. C'était vraiment un triste jour pour l'Allemagne."
 SchuDeath.9.d: "Même après les funérailles de Schumacher et l'annonce publique d'Ollenhauer, les tensions étaient encore montées à un certain point. À Munich, des manifestants pro-Franke ont occupé les bureaux du gouvernement bavarois, ce qui a incité les forces du BGS à être déployées.\n\nÀ Francfort, la place Romer et d'autres places étaient remplies de manifestants, brandissant des pancartes contre la corruption, criant des insultes anti-Ollenhauer et injuriant la police et le gouvernement.\n\nEn raison de la proximité de la Chancellerie, le BGS a été déployé sur la place, armé de matériel anti-émeute et de matraques, attaquant rapidement les manifestants les plus violents et les plus incendiaires, les jetant au sol et les arrêtant.\n\nToujours contraint de se rapprocher du bâtiment, un hélicoptère armé de grenades lacrymogènes a survolé la place, lâchant du gaz et envoyant les manifestants fuir vers les rues adjacentes, dans les bras de la police de Francfort et des soldats du BGS."

 Ollenhauer53.0.t: "La chancellerie Ollenhauer"
 Ollenhauer53.0.d: "Après le décès du redoutable Kurt Schumacher, le Bundestag a confirmé son successeur. Erich Ollenhauer, figure de proue de la gauche traditionnelle du SPD, accède désormais à la chancellerie. Son gouvernement devrait gouverner d'une main ferme, en respectant les principes socialistes fondamentaux du parti tout en naviguant dans la politique intérieure et étrangère. La question de la réunification, les tensions au sein des sociaux-démocrates et des chrétiens-démocrates en tant qu'opposition politique majeure au Bundestag rendront service à cette administration. Mais il est de la responsabilité du SPD de garantir que la reconstruction, la protection sociale et la réunification ne soient pas seulement un rêve, mais aussi une réalité."
 Ollenhauer53.0.a: "Vorwärts!"
 
 Ollenhauer53.1.d: "Lorsque la chancelière est entrée dans la salle du cabinet ce matin, tout le monde savait que le sujet serait l'un des débats les plus importants du nouveau gouvernement Ollenhauer.\n\nAlors qu'Ollenhauer s'asseyait, la tension dans la salle était forte, car personne ne voulait vraiment parler de cette question, mais il faudrait en discuter. » commença le Chancelier.\n\n \"Au sujet de la Bundesgrenzschutz, du BGS, des gardes-frontières, peu importe comment vous voulez les appeler. Quelle devrait être notre politique militaire ?\"\n\nImmédiatement, deux blocs se sont formés au sein du cabinet ministériel ; comme on pouvait s'y attendre, une faction pro-Ollenhauer et la minorité de ministres Kanalarbeiter placés dans le gouvernement pour apaiser Franke. « Nous devrions construire le BGS ! » » a crié un ministre de ce dernier groupe.\n\n \"Non ! Ce sont les gardes-frontières ! Regardez ce qui s'est passé la dernière fois que ce pays a tenté de constituer une armée défensive !\"\n\nCela a déclenché une véritable bataille verbale, alors que les ministres des deux côtés ont crié sur les avantages et les risques d'un agrandissement du BGS.\n\nOllenhauer frappa la table de la main pour rappeler à l'ordre. Il a ensuite fait face à la faction pro-armement, leur demandant : « Comment feriez-vous pour développer le BGS ? »\n\n \"Très simplement, Herr Ollenhauer, nous soumettrions un projet de loi autorisant davantage d'unités, fortifiant la frontière et introduisant des politiques visant à déplacer la force vers une composante plus militaire plutôt qu'une unité de police.\"\n\n \"Très bien alors, écoutons l'autre côté.\" Un jeune ministre de l'autre côté de la table a pris la parole. \"Eh bien, nous pensons que le BGS a été créé uniquement en tant que garde-frontière et police fédérale. Il n'y a aucune raison de modifier si massivement sa mission. Ce sur quoi les deux parties peuvent s'entendre, c'est sur la sécurité de nos frontières, et le BGS le fait assez bien, sans avoir besoin d'une force militaire plus importante.\"\n\n Ollenhauer hocha la tête, comprenant les arguments des deux parties. \"Eh bien, nous devrions prendre une décision. Le BGS devrait-il être élargi ou rester comme sa force actuelle ?\""
 Ollenhauer53.2.d: "Alors que le Bundestag assemblé murmurait entre lui dans les grandes chambres, Ollenhauer entra et monta sur la tribune ; mettre une paire de lunettes; s'éclaircir la gorge.\n\n \"Députés du Bundestag ; je suis ici, comme d'habitude, pour rendre compte de la situation de la République fédérale et présenter mon programme pour l'année prochaine. Nous avons accompli beaucoup de choses cette année, et ce gouvernement a traversé beaucoup de choses. Avec le décès de l'ancien chancelier Schumacher, le pays a été une fois de plus plongé dans le chaos. Le parti a dû faire face à des défis, mais finalement, j'ai été choisi comme chancelier.\"\n\nLa dernière phrase a provoqué un peu de bruit dans la pièce, car certains ont exprimé tranquillement leurs objections à Ollenhauer, mais il a continué à parler.\n\n \"Il est essentiel que nous traversions cette période mouvementée en tant que nation unie. Ce nouvel environnement international devient rapidement un endroit dangereux, et même si j'ai l'intention d'améliorer la vie de tous les Allemands, jeunes et vieux, de toutes croyances, il faut remédier aux divisions politiques, non seulement au sein de mon propre parti, mais aussi de l'autre côté de l'allée. Ainsi, mon administration s'efforcera de guérir les divisions qui sont apparues et d'amener notre pays sur une voie de politique étrangère plus neutre et plus pragmatique, en tenant compte des appels idéologiques. Des deux côtés du rideau de fer, j'ai promis mon honneur sacré sur ces idéaux en prenant la tête du chancelier, et je jure de le faire pour tout le peuple allemand !\n\nCette dernière partie a suscité des applaudissements non seulement du côté du SPD, mais aussi de la CDU ; même leurs adjoints furent impressionnés.\n\nLes experts ont été agréablement surpris par le ton diplomatique d'Ollenhauer et sont curieux de connaître l'avenir des relations intra-politiques allemandes sous Ollenhauer."
 Ollenhauer53.3.d: "C'était une matinée ensoleillée à Francfort lorsqu'un visiteur inattendu est entré dans la Chancellerie fédérale. De nos jours, il était assez rare que des responsables du parti CDU pénètrent à la Chancellerie, car ils réfléchissaient généralement en groupe au siège ou dans les chambres du Bundestag. Mais aujourd'hui, il ne s'agissait pas d'une visite standard, ni d'un visiteur standard. Ce n'était autre que Ludwig Erhard qui, passant calmement devant quelques collaborateurs confus, se dirigea vers la salle de conférence où se déroulent la plupart des affaires de la République fédérale. Il s'est assis en face du chef de cabinet d'Ollenhauer, ainsi que de quelques autres responsables et conseillers politiques du SPD.\n\n « Que puis-je faire pour vous, messieurs, en ce beau jour ?\n\n» Commença le chef de cabinet d'Ollenhauer. \"Eh bien, Herr Erhard, nous avons une proposition à vous faire. Puisque nous avons décidé d'ouvrir des relations plus positives avec votre parti, le chancelier souhaite vous proposer le poste de ministre de l'Économie pour son nouveau gouvernement. Nous ne pouvons imaginer personne plus qualifié pour déterminer nos politiques économiques et une coopération de l'autre côté de l'allée contribuerait à consolider le soutien de l'opinion publique à ce gouvernement.\"\n\nErhard parut un peu bouleversé par cela. \"Eh bien, je suis honoré. Je ne vois aucune raison pour que mon parti ait des problèmes avec cela ; mais je dois poser une question : pourquoi moi ? Le SPD n'a-t-il personne suffisamment qualifié pour diriger la politique économique ?\"\n\nCela a suscité quelques froncements de sourcils de la part des responsables du SPD. \"Eh bien, votre CV en dit long. Directeur des affaires économiques de la Bizone et vos travaux ultérieurs sur la réforme monétaire en 1948. Herr Erhard, vous avez entièrement créé le Deutsche Mark ! Pourquoi n'aurions-nous pas dû vous le demander plus tôt ?\"\n\n \"Encore une fois, je suis honoré. Laissez-moi discuter avec certains membres de mon parti, mais je n'ai aucun doute sur le fait que j'accepterai ce poste, et je vous remercie infiniment de me l'avoir proposé.\"\n\nSerrant la main et éteignant son cigare dans le cendrier, Erhard sourit avant de partir. Le chef de cabinet d'Ollenhauer et les différents fonctionnaires présents dans la salle le regardèrent partir, puis se sourirent. Ce fut une victoire majeure."
 Ollenhauer53.4.d: "C'était une autre journée bien remplie à la Chancellerie alors que le chef de cabinet d'Ollenhauer, Dietrich Steube, vaquait à son travail de lecture des briefings et de vérification des documents de ses collaborateurs, lorsque le téléphone a sonné. En décrochant le téléphone à cadran, c'était le standard de l'immeuble.\n\n\"Herr Steube, appel extérieur de la Commission spéciale pour les enquêtes nationales-socialistes.\"\n\n Il y a eu un déclic. « M. Steube ? »\n« Oui, à qui est-ce que je parle ? »\n \"Je suis membre de la commission d'enquête nazie. Il y a certaines informations que vous devriez connaître.\"\n\"Qu'est-ce que c'est?\"\n\"Nous disposons d'informations crédibles selon lesquelles un membre de votre cabinet aurait été un collaborateur des nazis pendant la guerre.\"\n\"OMS?\" \n\"Herbert Kriedemann.\"\n\n\"Merci.\" Cliquez.\n\n Steube raccrocha silencieusement et se leva aussitôt pour entrer dans le bureau du chancelier.\n\n \"Herr Chancelier, nous avons un problème.\"\n\nOllenhauer leva les yeux de son bureau, où il était occupé à signer des papiers. \"Oui, Dietrich?\"\n\n\"Nous disposons d'informations crédibles selon lesquelles un membre du SPD, Herbert Kriedemann, aurait collaboré avec la Gestapo pendant la guerre. Un résumé plus détaillé est actuellement envoyé par la Commission spéciale d'enquête sur le national-socialisme, mais nous devons décider quoi faire avant que la presse ne prenne connaissance de ces informations.\"\n\n« Que fait-il dans notre gouvernement ?\n\n« Il est l'un des secrétaires d'État parlementaires du ministère de l'Alimentation et de l'Agriculture. »\n\nIl y eut une pause. \"Herr Chancelier, nous pourrions le licencier discrètement, ou nous pourrions profiter de cette occasion pour faire de lui un exemple et montrer à la nation que nous ne tolérons pas les collaborateurs nazis parmi nous.\"\n\nOllenhauer réfléchit un instant, avant de se retourner vers Steube et de dire..."
 Ollenhauer53.5.d: "Après la décision du chancelier Ollenhauer de lancer des auditions publiques télévisées sur les représentants du gouvernement et leurs liens avec les nationaux-socialistes dans le passé, les médias ont commencé à se préparer. Le nouveau réseau ARD a immédiatement commencé à installer des caméras dans les salles des commissions du Bundestag, alors que les délibérations de la Commission spéciale d'enquête sur le national-socialisme étaient pour la première fois télévisées.\n\n \"Herr Kriedemann, n'étiez-vous pas un collaborateur affilié à la Geheime Staatspolizei, ou Gestapo, nationale-socialiste, en janvier 1934 ?\"\n\nUne pause. \"Oui, Monsieur le Président, je l'étais.\"\n\n \"Et n'étiez-vous pas en contact avec un agent de la Gestapo, Reinhold Schwabe, pendant cette période ?\"\n\n Une autre pause. \"Oui, Monsieur le Président, je l'étais.\"\n\n \"Dans le jugement du tribunal régional de Hanovre du 31 mai 1949, \"Les dossiers témoignent de manière si concluante de l'activité de Kriedemann dans l'intérêt de la Gestapo... Que les mots \"informateur de la Gestapo\" dans le contexte des allégations factuelles ne dépassent pas leur contenu dans la forme. Qu'avez-vous à répondre à cela, Monsieur Kriedemann ?\"\n\nIl y eut cette fois une pause extrêmement longue, tandis que la foule derrière Kriedemann gazouillait entre elle-même, avec des murmures de « Gestapo ? être entendu.\n\n \"Eh bien, Président... Oui. J'ai travaillé avec la Gestapo. C'était... Regrettable. Mais j'avais très peu d'options... Et je pensais que ça marcherait. L'appareil du parti était à Prague à ce moment-là...\"\n\nIl a été coupé. \"Herr Kriedemann, merci d'être venu. Ce sera tout. Les officiers du BGS vont vous escorter maintenant.\"\n\nKriedemann, se levant, eut l'air honteux alors qu'un groupe d'officiers du BGS se rassemblait autour de lui, le faisant sortir de la chambre, en se moquant et en criant de « Traître ! Suivi. Ce n'était qu'un début, car la Commission spéciale allait faire la lumière sur tous les collaborateurs nazis au sein du gouvernement SPD."
 Ollenhauer53.6.d: "Ollenhauer regrettait ce moment depuis longtemps, mais il fallait qu'il vienne. Steube, son chef de cabinet, avait insisté pour s'occuper de l'affaire, mais Ollenhauer avait refusé : il avait une expérience personnelle.\n\nHelga, la secrétaire d'Ollenhauer, ouvrit la porte et Kriedemann entra, l'air plutôt penaud, en compagnie de Steube. Leur faisant signe de s'asseoir, Ollenhauer commença.\n\n \"Je suis sûr que vous savez de quoi il s'agit, Herr Kriedemann.\"\n\n \"Oui, Herr Chancelier, je le fais.\"\n\n \"Oui, Herbert. La Commission spéciale d'enquête nationale-socialiste nous a informés de votre collusion avec la Gestapo avant et pendant la guerre et dispose de preuves pour le prouver.\"\nIl soupira.\n \"Herbert, je veux te demander quelque chose. Pourquoi as-tu fait cela ? Pourquoi as-tu travaillé avec eux ? Tu savais ce qui en résulterait, la trahison de ton parti et de tes camarades, de tes amis...\"\n\nKriedemann leva les yeux. \"Herr Chancelier, j'ai accepté de les rencontrer en 1936. Vous le saviez, vous étiez alors dans l'appareil du parti à Prague. Vous étiez au courant de mes actions. Je pensais que cela les apaiserait suffisamment longtemps pour me respecter. J'avais tellement tort.\"\n\nOllenhauer a répondu : \"Vous savez dans quelle situation cela me met ? Nous accusons la CDU d'être le parti des nazis, et tout à coup nous avons un secrétaire d'État parlementaire qui a travaillé pour la Gestapo ? Écoutez. J'aurais pu faire de vous un exemple public, mais pour le parti et pour votre image, la Chancellerie gardera le silence.\" Ollenhauer s'arrêta un instant. \"Herbert, vous êtes licencié. Le ministre de l'Alimentation, de l'Agriculture et des Forêts en sera informé, nous publierons une déclaration indiquant que vous souhaitez vous retirer du gouvernement et vous recevrez une indemnité de départ. Mon chef de cabinet, Herr Steube, réglera les détails. Ce sera tout.\"\n\nKriedemann sourit quelque peu. \"Merci, Herr Chancelier. Je souhaite bonne chance à votre gouvernement et je regrette mes choix passés.\"\n\nIl sortit ensuite du bureau, flanqué de Steube, qui lança à Ollenhauer un regard approbateur. C'était chose faite."
 Ollenhauer53.7.d: "Ce fut une journée mémorable à Stade, dans la banlieue hambourgeoise, alors qu'une longue file de Mercedes noires arrivait dans le nouveau complexe de la centrale nucléaire de Stade pour son ouverture.\n\nSouriant à la presse rassemblée et au personnel de la centrale électrique, tous portant des casques de sécurité, Ollenhauer lui-même a enfilé un casque rigide en plastique jaune vif, arborant le logo de l'aigle fédéral. En regardant avec des caméras clignotantes, Ollenhauer a posé avec une paire de ciseaux comiquement grande, alors que lui et son ministre de l'Intérieur, ainsi que le directeur de la centrale électrique, coupaient le ruban drapé sur l'entrée de la tour de refroidissement.\n\nEnsuite, il a reçu une visite de l'installation, inspectant la salle de contrôle, les installations de pompage, et prononçant un bref discours dans le bâtiment administratif.\n\n « Il s'agit véritablement d'un jour historique pour l'Allemagne, car nous avons exploité pour la première fois la puissance de l'atome à l'intérieur de nos frontières et pouvons l'utiliser pour alimenter les foyers, les emplois et les moyens de subsistance de nos citoyens. »"
 Ollenhauer53.8.d: "\"Dans toute l'Allemagne, les manifestations ont commencé dans les rues, lorsque la nouvelle est tombée de Francfort que le gouvernement Ollenhauer envisageait d'interdire les écoles religieuses. Les plus grandes manifestations qui ont eu lieu à Munich, la capitale de la Bavière à majorité catholique, indiquent un mécontentement général de la population à l'égard de la nouvelle politique et constituent un avertissement à la Chancellerie.\"\n\nOllenhauer a fermé le journal local du matin en regardant Steube. \"Eh bien, avons-nous prédit cela à l'avance ?\"\n\n \"Eh bien, Herr Chancelier, il semblerait que les catholiques s'opposeraient à notre politique scolaire laïque, mais nous ne pensions pas que cela dégénérerait en manifestations.\"\n\n \"Très bien, nous devrions alors décider si nous devons continuer. Après tout, la loi sur la normalisation de l'éducation a déjà été adoptée, mais elle n'entrera en vigueur que le mois prochain.\"\n\n \"Oui, monsieur. Devrions-nous faire preuve de bonne foi et l'abroger, ou continuer avec nos politiques déclarées et faire adopter le projet de loi, et gérer les conséquences plus tard?\" Ollenhauer s'arrêta pour réfléchir, comme il avait tendance à le faire."
 Ollenhauer53.9.d: "À Munich, le commandant local du BGS était assis dans son bureau lorsque le téléphone a sonné. Il avait lu des articles similaires dans le journal sur les manifestations qui se déroulaient localement à Munich et, pour sa part, il était généralement indifférent aux écoles religieuses ; Lui, comme la plupart des Bavarois, était catholique, mais ses enfants fréquentaient l'école publique. Oui, mais le téléphone sonnait.\n\n \"Bonjour?\"\n\n \"Hauptmann Strasse, les manifestants se déplacent de Frauenkirchen vers la Marienplatz, dans la Kaufingerstrasse. Les unités locales du BGS et de la police de Munich sont débordées et la Chancellerie a approuvé le recours à la force pour dissiper les manifestants. Vous êtes autorisé à déployer votre garnison.\"\n\n \"Jawohl, merci.\" En se levant, il rassembla tous ses officiers d'état-major, sous-officiers, et leur ordonna de déclencher une alerte pour bouger.\n\nEn cinq minutes, une force de soixante-dix officiers du BGS et soldats s'était rassemblée dans un convoi de véhicules blindés et de jeeps, armés d'armes légères et de lanceurs de gaz lacrymogènes. Il était temps.\n\nAlors que la force descendait la Kaufingerstrasse, les feux clignotants et les sirènes retentissantes, la Strasse a signalé l'arrêt, les véhicules se formant pour bloquer la route. Sortant un mégaphone, il a crié à la foule : \"La République fédérale d'Allemagne a déclaré qu'il s'agit d'un rassemblement illégal. Veuillez vous tenir à l'écart des véhicules du BGS et dégager la zone. Dans le cas contraire, vous ferez l'objet de poursuites et d'un éventuel recours à la force. Merci.\"\n\nPendant qu'il parlait, les hommes de Strasse avaient enfilé des tenues anti-émeutes, des boucliers et formaient une ligne devant les véhicules, se préparant à utiliser des gaz lacrymogènes si nécessaire. Cependant, la foule s'est indignée et a tenté d'avancer, à son grand dam. Strasse a ordonné le tir de gaz lacrymogènes et ils ont commencé à affronter les manifestants, dont certains portaient des chapelets et des Bibles, ainsi que quelques prêtres catholiques.\n\nStrasse détestait devoir faire cela, mais il avait ses ordres."
 Ollenhauer53.10.d: "Une autre réunion du cabinet faisait rage ce matin, cette fois sur la manière de conduire la politique étrangère du nouveau gouvernement Ollenhauer. Étant quelque peu divisé entre les députés SPD d'Ollenhauer et les députés Kanalarbeiter de Franke, ce débat serait rude, tout comme il l'était lorsque Schumacher était chancelier, pensait Ollenhauer. » commença-t-il.\n\n \"Messieurs, je préconise que nous poursuivions notre programme de politique étrangère neutre, en nous éloignant des deux blocs.\" Cela a suscité des hochements de tête de la part de ses alliés et des froncements de sourcils de la part des adjoints de Franke, qui ont commencé à prendre la parole.\n\n \"Monsieur le Chancelier, il est clair que vous n'accepterez pas une intégration occidentale complète, telle que les politiques proposées par M. Adenauer et la CDU. Mais que se passerait-il si nous orientions notre politique étrangère vers l'Ouest, mais selon les conditions de notre gouvernement ? Entamer des négociations avec des politiques qui ne profitent qu'à nous.\"\n\nOllenhauer hocha la tête. \"Intéressant, que veux-tu dire?\"\n\n \"Eh bien, monsieur, conclure des accords de sécurité avec les États-Unis, rejoindre le FMI, établir des relations amicales avec d'autres pays.\"\n\n \"Intéressant, intéressant. Avons-nous des idées pour une politique étrangère neutre ?\"\n\nUn jeune ministre a pris la parole. \"Eh bien, monsieur, nous commencerions par organiser une conférence sur la neutralité ici en Allemagne, peut-être en visitant Berlin-Est, et en cherchant à établir des relations amicales avec les pays nordiques.\"\n\nOllenhauer hocha la tête. \"Très bien. Quelle que soit cette politique, nous devrions l'appeler la doctrine Ollenhauer, si nous devrions...\""
 Ollenhauer53.11.d: "DE : Chancelier Erich Ollenhauer, Gouvernement de la République fédérale d'Allemagne\nÀ : Président [USA.GetLeader], Gouvernement des États-Unis d'Amérique ; Premier ministre [ENG.GetLeader], Gouvernement du Royaume-Uni de Grande-Bretagne et d'Irlande du Nord ; Premier Ministre [FRA.GetLeader], Gouvernement de la République Française\n\nObjet: Armes nucléaires en République fédérale\n\nChers Messieurs,\n\nJe vous écris pour vous informer que le Bundestag a adopté une résolution interdisant le déploiement d'armes nucléaires sur le territoire de la République fédérale. Nous appliquerons cela dans les soixante-douze (72) heures suivant votre réception de cette note.\n\nMême si nous connaissons la valeur stratégique que joue la République fédérale dans la guerre froide, nous n'avons aucun intérêt à devenir un point d'accueil d'armes de destruction massive."
 Ollenhauer53.12.d: "C'était une décision controversée, mais l'équipe d'Ollenhauer l'avait laissé continuer, même au grand dam de ses services de sécurité. Steube avait considéré son idée de visiter Berlin-Est comme une démonstration de bonne foi comme inutile et insensée, mais alors qu'ils descendaient de l'avion à l'aéroport de Berlin Schoenefeld, il savait que cela devenait une réalité.\n\nAccueillis seulement par une voiture, lui et son petit personnel ont été emmenés à la porte de Brandebourg, où se trouvait le premier secrétaire [DDR.GetLeader], accompagné d'un petit personnel, ainsi que d'hommes en costume sombre de la Stasi alignés à l'extérieur. Ollenhauer, se serrant la main, sourit et discuta pendant quelques minutes, partageant des subtilités, avant qu'ils ne se promènent tous les deux autour de la place, montrant des sites touristiques de Berlin-Ouest et de Berlin-Est, parlant de la ville, de la guerre, de la culture, du gouvernement et du reste.\n\nSteube sourit. Pour l'instant, c'était totalement officieux et si elle était interrogée, la Chancellerie nierait avoir jamais été ici, au moins pour réprimer toute opposition de la CDU selon laquelle le gouvernement gambadait avec les communistes. Il était heureux de voir que cela fonctionnait. À ses yeux, comme à ceux d'Ollenhauer, la détente avec l'Est par des moyens neutres pourrait finalement fonctionner, à condition qu'ils n'aient pas reçu de critiques pour cela."
 Ollenhauer53.13.d: "Un autre objectif de politique étrangère d'Ollenhauer s'est concrétisé cette semaine avec le début de la Conférence de Francfort sur la neutralité. Suggéré par un certain nombre de jeunes députés du SPD comme moyen de mesurer l'intérêt international pour un mouvement de neutralité, en particulier dans la sphère européenne. Des invitations avaient été envoyées aux dirigeants de Suède, de Finlande, d'Autriche, de Yougoslavie et d'Irlande ; et presque tous étaient arrivés à Francfort, en grande pompe de la part des Allemands de l'Ouest qui les accueillaient.\n\nAu Frankfurter Hof, le meilleur hôtel de la ville, Ollenhauer s'est levé pour prononcer le discours d'introduction devant les dignitaires et les délégués rassemblés. \"Au nom de la République fédérale d'Allemagne, je vous souhaite à tous la bienvenue dans notre brillante capitale de Francfort et à la Conférence sur la neutralité ! Nous rêvons de réunir tous les pays européens engagés dans la neutralité dans un seul espace, pour discuter des avantages de la neutralité, de son avenir et bien plus encore. J'espère que ces discussions seront fructueuses et que nous pourrons engager un dialogue constructif en faveur de la paix en Europe, en dehors des deux grands blocs. Merci.\"\n\nS'éloignant sous les applaudissements, Ollenhauer fut impressionné et s'asseyant sur le siège marqué « République fédérale d'Allemagne », il était prêt à commencer cela pour de vrai."
 Ollenhauer53.14.d: "Après des mois de négociations, Ollenhauer était heureux de monter à bord de son avion officiel, un Douglas DC-3 dont la queue était peinte aux couleurs du drapeau allemand, pour se rendre à Stockholm et Helsinki afin de signer des accords de sécurité avec la Suède et la Finlande.\n\nAtterrissant à Stockholm pour la première étape de la tournée, Ollenhauer a été accueilli par la fanfare de l'armée royale suédoise et chaleureusement accueilli par le Premier ministre [SWE.GetLeader], qui a tenu une réunion au cours de laquelle les deux hommes ont discuté des arrangements de neutralité, après quoi ils ont signé l'accord de sécurité suédo-allemand et ont eu un bref déjeuner.\n\nCeci étant conclu, Ollenhauer a fait ses adieux au Premier ministre suédois et a remonté à bord de l'avion pour un court vol à destination d'Helsinki, où une réunion similaire aurait lieu. Fait dans des circonstances plus secrètes, devant échapper aux défenses aériennes soviétiques et autres équipements de détection, l'avion d'Ollenhauer a atterri à Helsinki sous le couvert de l'obscurité, une petite flotte de voitures étant positionnée pour le recevoir sans fanfare ni fanfare.\n\nMoins cordial qu'à Stockholm, Ollenhauer était nerveux, mais a rencontré le Premier ministre [FIN.GetLeader] avec chaleur, s'asseyant pour un dîner d'État plutôt informel où les deux ont discuté de leur vie et de leurs familles, ainsi que de la position stratégique de la Finlande dans les pays nordiques, partageant une frontière avec l'URSS. Ensuite, les textes officiels de l'accord de sécurité finno-allemand ont été publiés et, sans point de presse, les deux hommes y ont apposé leurs signatures, avant de se serrer la main et de sourire.\n\nTrès fatigué après cette tournée éclair, Ollenhauer était plutôt heureux de remonter à bord du DC-3 vers Francfort, heureux d'avoir accompli une grande partie de son plan directeur pour une alliance de neutralité européenne."
 
 Ollenhauer53.15.t: "Poursuite du Zentrum-Alliance"
 Ollenhauer53.15.d: "La véritable histoire déterminante des élections de 1953 est la résurgence étonnante de notre partenaire de coalition, le Zentrumspartei. Le Parti du Centre a défié toutes les attentes, remportant quatre pour cent supplémentaires des voix nationales et consolidant ainsi son rôle de partenaire essentiel du gouvernement. Ce résultat est largement considéré comme une approbation de la combinaison de programmes de protection sociale et de défense des valeurs de la communauté chrétienne. Avec la victoire de Johannes Brockmanns à l'élection présidentielle fédérale, l'influence renforcée du parti Zentrum au sein du cabinet devrait orienter la politique intérieure du gouvernement, en mettant davantage l'accent sur les questions familiales et ecclésiales pour le prochain mandat."
 Ollenhauer53.15.a: "Huzzah !"
 
 Ollenhauer53.16.t: "Ollenhauer affronte Franke"
 Ollenhauer53.16.d: "La faible majorité du gouvernement du chancelier Erich Ollenhauer commence à se fracturer sous la pression du gouvernement. Alors que la formidable opposition de la CDU bloque des réformes sociales et économiques clés au Bundestag, une impasse tendue est apparue au sein même du SPD. Egon Franke, confronté à la pression croissante de la droite du parti, s'est directement adressé à la chancelière. Dans une discussion franche, Franke a exposé la dure réalité de la situation : Ollenhauer doit faire un choix. Il peut soit embrasser la droite enhardie du parti, unifiant le SPD pour une confrontation idéologique directe contre l'opposition, soit mettre de côté la droite et poursuivre une voie pragmatique de compromis, en faisant des concessions significatives à la CDU pour garantir l'adoption de la législation. La voie de l'unité du parti risque une impasse législative, tandis que la voie du compromis menace de diviser le mouvement social-démocrate en deux. Le chancelier est désormais pris entre son parti et son État, et sa prochaine décision déterminera probablement le sort de son gouvernement."
 Ollenhauer53.16.a: "Le SPD doit travailler ensemble en tant que parti uni."
 Ollenhauer53.16.b: "Nous avons besoin de la tolérance de la CDU et du FDP."
 
 Ollenhauer57.0.t: "La deuxième administration Ollenhauer"
 Ollenhauer57.0.d: "Après avoir obtenu un second mandat, l'attention du chancelier Erich Ollenhauer passe désormais de la reconstruction d'après-guerre à la création d'une Allemagne forte et moderne.\n\nLe programme du gouvernement pour ce nouveau mandat est ambitieux et repose sur trois grands piliers du développement national. Premièrement, la maîtrise de l'énergie nucléaire pour alimenter nos industries et assurer notre indépendance énergétique. Deuxièmement, un investissement massif dans les infrastructures nationales pour créer les artères de notre coeur économique. Troisièmement, la poursuite du développement d'une Bundeswehr moderne, une armée capable de défendre la souveraineté allemande aux conditions allemandes."
 Ollenhauer57.0.a: "Eh bien, le moment est passé. Retour au travail."
 
 Ollenhauer57.10.t: "Une autre coopération du Zentrum"
 Ollenhauer57.10.d: "Le Zentrumspartei s'est révélé être un excellent partenaire de coalition pour le SPD. Malgré quelques différences, les deux partis font preuve d'un engagement intense en faveur de la démocratie, de l'antitotalitarisme, du fédéralisme et de l'intégration occidentale. Nous poursuivrons cette coopération pour la prochaine législature, étant donné que les résultats des élections ne laissent pas autant d'options aux sociaux-démocrates."
 Ollenhauer57.10.a: "Nous connaissons le Drill."
 
 Ollenhauer57.11.t: "Le débat SPD-CDU"
 Ollenhauer57.11.d: "La majorité du gouvernement du chancelier Ollenhauer est une fois de plus mise à rude épreuve, les démocrates-chrétiens obtenant plus de 39% des voix, laissant une grande opposition au Bundestag, bloquant des réformes sociales et économiques clés. Une autre impasse est apparue au sein même du SPD. La droite du parti s'est une fois de plus directement opposée à la chancelière. Dans une discussion franche, Ollenhauer doit prendre une décision : soit il unifie le parti et dirige une coalition avec la droite, contre l'opposition, soit il peut mettre la droite sur la touche et s'appuyer sur la tolérance de son gouvernement par la CDU, en faisant d'importantes concessions aux démocrates-chrétiens pour garantir l'adoption de la législation. Une fois de plus, le chancelier est désormais pris entre son parti et son État, et sa prochaine décision déterminera probablement le sort de son gouvernement."
 Ollenhauer57.11.a: "Nommer Egon Franke au poste de vice-chancelier."
 Ollenhauer57.11.b: "Passez un accord avec Adenauer."
 
 Ollenhauer57.1.d: "C'est par une journée ensoleillée que s'est rassemblée dans l'une des grandes salles de réunion de la Chancellerie une foule de taille moyenne. Composé de toutes sortes de personnes ; Des diplomates, des experts scientifiques, des avocats, des personnalités de la presse et des cameramen ont tous applaudi lorsque le chancelier Erich Ollenhauer est monté sur le podium, arborant un aigle allemand géant, flanqué de deux drapeaux.\n\n \"Bonjour à tous. Au cours des 8 dernières années depuis sa fondation, ce pays a traversé beaucoup de choses, des troubles à la fois nationaux et internationaux. Contrainte de se relever par les moyens, la République fédérale a réussi et s'est à nouveau avancée sur la scène mondiale.\" Il s'est arrêté sous les applaudissements de la foule.\n\n \"Les développements récents dans le monde nous ont montré le véritable pouvoir de la science moderne, dans la division de l'atome, pour la paix ou pour la guerre. En tant que chancelier, j'ai le plaisir d'annoncer la création du nouveau programme nucléaire de la République fédérale, appelé Deutsche-Atomkraftprogramm. Il convient de préciser que ce programme est destiné à un usage uniquement pacifique ; en vertu de la loi sur le contrôle des armes de guerre, la République fédérale ne produira pas d'armes nucléaires sous quelque forme que ce soit, mais utilisera la technologie nucléaire à des fins énergétiques et scientifiques. Nous saluons le soutien de les États-Unis dans cette entreprise et j'ai hâte d'en discuter avec l'ambassadeur Bruce. Merci à tous.\n\nIl fit un signe de tête à l'ambassadeur américain, quelque peu choqué, tandis que la foule applaudissait, que les journalistes clamaient et que les flashs se déclenchaient, avant qu'Ollenhauer ne parte dans une antichambre, lavé de soulagement après cette annonce."
 Ollenhauer57.2.d: "Alors qu'Ollenhauer et son équipe empruntaient l'autoroute en direction de l'une des centrales nucléaires les plus récentes d'Allemagne de l'Ouest, Erich regardait par la fenêtre et remarqua le soleil qui brillait. C'était Schumacher souriant d'en haut, fier de ce que son protégé avait accompli et lui souhaitant bonne chance pour l'inauguration des travaux de la nouvelle centrale électrique. En passant devant le portail et juste à côté du bâtiment administratif, le seul bâtiment présent, Ollenhauer était nerveux, d'autant plus qu'il était une fois de plus envahi par le personnel de presse. Souriant comme toujours, Ollenhauer a salué la presse en prononçant quelques mots, avant de se diriger vers le devant du bâtiment administratif pour serrer la main et discuter avec le contremaître de construction de l'usine, un petit et corpulent Bavarois.\n\nRapidement armés d'une pelle, lui et le contremaître ont posé pour des photos, souriants, avant de ramasser quelques pelletées de terre, marquant le début cérémoniel de la construction de la centrale nucléaire nationale Schumacher.\n\n \"Le regretté chancelier Kurt Schumacher était vraiment un grand homme, une force de la nature et le visage du parti social-démocrate. Il aurait adoré le développement de l'énergie nucléaire en République fédérale et c'est pour cette raison que je dédie cette centrale nucléaire en son honneur sous le nom de Centrale nucléaire nationale Schumacher. Gloire à l'Allemagne!\"\n\nLes applaudissements ont régné alors qu'Ollenhauer souriait, ôtant son casque de cérémonie et voyant à nouveau des flashes, avant de monter dans sa Mercedes noire, une nouvelle victoire du public assurée."
 Ollenhauer57.3.d: "Après le succès des élections de 1957, Ollenhauer était fier de se présenter à nouveau devant le Bundestag. Moins nerveux qu'il ne l'avait été quatre ans auparavant, il s'éclaircit la gorge et recommença à parler.\n\n \"Députés réunis au Bundestag, cela fait longtemps que je ne me suis pas levé ici sur cette scène et que je n'ai pas pris la parole devant vous tous. Et depuis ce temps, ce gouvernement a fait beaucoup pour le bien de tous les citoyens de la République fédérale. Ces dernières années, nous avons rajeuni nos services de sécurité frontalière et intérieure, élargi la coopération avec nos collègues du Parti chrétien-démocrate et nos collègues de la faction Kanalarbeiters du Parti social-démocrate; et nous avons remanié la politique étrangère de la République fédérale. Tout cela a été fait dans un seul but : pour le bien-être de chaque citoyen de la République fédérale, cette grande nation, quels que soient sa race, son sexe, sa religion ou ses croyances.\n\nAu milieu d'un choeur d'applaudissements et de cris de soutien des deux côtés, Erich s'éloigna du podium, la poitrine gonflée d'accomplissement. Ce terme serait encore meilleur que le précédent."
 Ollenhauer57.4.d: "Chaque année à peu près à la même époque, le Bundestag était confronté à la terrible tâche des crédits budgétaires, et cette année, il se trouvait confronté à un nouveau défi : éventuellement recevoir une aide militaire américaine pour aider la nouvelle Bundeswehr. Bien qu'il dispose d'une majorité sociale-démocrate, le Bundestag reste quelque peu divisé. La CDU, comme à son habitude, a déclaré qu'elle « demandait l'aide américaine mais augmentait également le budget de la défense » et était favorable aux coupes dans les programmes de protection sociale prévus par le SPD. Le SPD, divisé comme d'habitude entre la faction Kanalarbeiter de Franke et la faction traditionaliste d'Ollenhauer, est globalement opposé à l'aide américaine, faisant valoir que les dépenses de défense sont suffisantes telles quelles et que la politique actuelle n'en exigera pas davantage, ainsi qu'un refroidissement soudain des relations avec les États-Unis. Cependant, la demande d'aide proposée est généralement modeste par rapport aux enveloppes plus importantes proposées par les responsables de la Bundeswehr et de la CDU, et qui pourraient convenir aux membres des deux factions du SPD. La Bundeswehr obtiendra-t-elle son financement ?"
 Ollenhauer57.5.d: "Parallèlement au débat sur l'aide américaine, le Bundestag débattait également d'une autre question affectant la nouvelle Bundeswehr : maintenir ou non la conscription obligatoire des jeunes de 18 ans ou commencer à abandonner progressivement cette politique.\n\nLa CDU, fortement opposée à cela, a fait une déclaration liminaire, avec un membre disant : \"Pourquoi supprimer progressivement la conscription alors que nous améliorons et développons notre armée ? Cela semble très hypocrite de la part du gouvernement SPD, qui a accédé à nos exigences d'une armée et d'une défense fortes mais veut pourtant affaiblir notre Bundeswehr en n'autorisant pas la conscription ?\"\n\nSuscitant la colère du côté gauche de la salle, qui huait avec colère, un membre du Kanalarbeiter s'est levé pour tenter de faire la paix. \"Membres des deux côtés. Je pense que pour le moment, la conscription devrait se poursuivre normalement et devrait peut-être être élargie pour répondre aux demandes de notre armée croissante. Cependant, la position de politique étrangère du gouvernement Ollenhauer a mis l'accent avant tout sur la défense territoriale et par conséquent, la conscription devrait être quelque peu limitée pour atteindre uniquement cet objectif. \"\n\nCela a suscité un peu plus de soutien que le membre bruyant de la CDU, qui était assis, fulminant sur son siège. Le président de la Chambre s'est levé, signalant que c'était maintenant l'heure du vote. Quel est le sort de la conscription en Allemagne de l'Ouest ?"

 Ollenhauer57.51.t: " [GetNewspaperHeader] La réouverture de la Bourse de Hambourg "
 Ollenhauer57.51.d: "Après des années de fermeture, la Bourse de Hambourg a rouvert ses portes, marquant une étape clé dans la reprise économique de l'Allemagne de l'Ouest. Fondée en 1558, c'est l'un des centres commerciaux les plus anciens au monde, historiquement central pour le commerce allemand et européen. Fermé pendant le chaos de la Seconde Guerre mondiale et l'occupation d'après-guerre, sa renaissance reflète désormais le retour du pays à la stabilité financière.\n\nAvec l'introduction du Deutsche Mark et la montée de l'économie sociale de marché, la bourse devrait attirer les investissements nationaux et étrangers. Les responsables ont salué la réouverture comme un signe de confiance renouvelée dans l'avenir économique de l'Allemagne, les premiers échanges montrant une activité prometteuse."
 Ollenhauer57.51.a: "Merveilleux."
 Ollenhauer57.51.b: "Un autre instrument d'exploitation"
 
 Ollenhauer57.52.t: "Ouverture de la Gebhard von Blücher Kaserne"
 Ollenhauer57.52.d: "Aujourd'hui a marqué l'ouverture officielle de la Gebhard Blücher Kaserne, une étape clé dans le renforcement de la sécurité de Berlin-Ouest dans un contexte de tensions croissantes pendant la Guerre froide. Du nom du maréchal prussien qui joua un rôle décisif dans les guerres napoléoniennes, la nouvelle caserne abritera des unités de la Bundesgrenzschutz et de la Bundeswehr, assurant la protection de la ville en coopération avec les forces alliées.\n\nDes responsables gouvernementaux et militaires ont assisté à l'inauguration, soulignant le rôle de la caserne dans la sauvegarde de la souveraineté de Berlin-Ouest contre les menaces potentielles venant de l'Est. L'installation est équipée de logements modernes, de terrains d'entraînement et de bureaux administratifs, permettant une réponse rapide et efficace aux incidents frontaliers.\n\nDes responsables de l'OTAN de France, des États-Unis et du Royaume-Uni ont également participé à la réunion, qui ont exprimé leur grande satisfaction concernant ce projet, même si le responsable français a fait part de ses inquiétudes quant au nom de la caserne, soulignant que lui donner le nom d'un maréchal prussien qui a combattu aux côtés des Russes contre les Français est contre-intuitif et a suggéré de le renommer de manière plus appropriée."
 Ollenhauer57.52.a: "Heul doch. (Pleurer)"
 
 Ollenhauer57.53.t: "Le compromis de Francfort"
 Ollenhauer57.53.d: "Dans un effort décisif pour consolider sa direction et définir une voie unifiée pour l'avenir, les sociaux-démocrates allemands ont convoqué aujourd'hui un congrès historique du parti à Francfort, cherchant à combler le fossé persistant entre ses factions de gauche et de droite. Ayant gouverné l'Allemagne de l'Ouest depuis ses victoires électorales de 1949 et 1953, le SPD est désormais confronté au défi de maintenir la cohésion alors que les tensions idéologiques persistent au sein du parti.\n\nSuite à la décision de nommer Egon Franke vice-chancelier, le chancelier Ollenhauer, aux côtés de personnalités éminentes des deux ailes, a souligné la nécessité de l'unité, appelant à la fin des luttes factionnelles qui ont entravé la mise en oeuvre de la politique. La gauche, prônant une intervention plus forte de l'État et un scepticisme à l'égard de l'OTAN, et la droite, favorable à une économie de marché équilibrée et à une coopération occidentale étroite, se sont souvent affrontées. Cependant, le congrès d'aujourd'hui a marqué un engagement en faveur du compromis, les dirigeants s'accordant sur un programme qui renforce la justice sociale, le pragmatisme économique et une voie distincte indépendante de l'influence de la CDU."
 Ollenhauer57.53.a: "Un compromis nécessaire."
 
 Franke53.1.d: "Alors que le Bundestag assemblé murmurait entre lui dans les grandes chambres, Franke entra et monta sur le podium ; mettre une paire de lunettes; s'éclaircir la gorge.\n\n \"Députés du Bundestag ; je suis ici, comme d'habitude, pour rendre compte de la situation de la République fédérale et présenter mon programme pour l'année prochaine. Nous avons accompli beaucoup de choses cette année, et ce gouvernement a traversé beaucoup de choses. Avec le décès de l'ancien chancelier Schumacher, le pays a été une fois de plus plongé dans le chaos. Le parti a dû faire face à des défis, mais finalement, j'ai été choisi comme chancelier.\"\n\nLa dernière phrase a provoqué un peu de bruit dans la pièce, car certains ont exprimé à voix basse leurs objections à Franke, mais il a continué à parler.\n\n \"Il est essentiel que nous traversions cette période mouvementée en tant que nation unie. Bien que le SPD ait connu quelques problèmes internes, il est essentiel que nous maintenions des relations amicales afin de maintenir une majorité. Nous restons orientés vers la politique occidentale et, au crédit des membres de la CDU avant moi, nous reconnaissons la menace fondamentale que l'Union soviétique représente pour notre grande nation. J'ai promis mon honneur sacré sur ces idéaux en prenant la tête du chancelier, et je jure de le faire pour tout le peuple allemand!\"\n\nCette dernière partie a suscité des applaudissements non seulement du côté du SPD, mais aussi de la CDU ; même leurs adjoints furent impressionnés.\n\nLes experts ont été agréablement surpris par le ton diplomatique de Franke, rare après ce qui s'est passé, et sont curieux de connaître l'avenir des relations avec le SPD allemand sous la nouvelle chancelière."
 Franke53.2.d: "C'était une journée ensoleillée dans la salle du cabinet du chancelier alors que Franke commençait ses réunions quotidiennes par une nouvelle annonce. Après des jours et des jours de réunions sur l'économie et les relations politiques, tant au sein du SPD qu'avec la CDU, ils n'avaient jamais discuté de la politique étrangère qui serait proposée. Franke commença, faisant signe à ses ministres de s'asseoir alors qu'il commençait à parler.\n\n \"Messieurs, bien que nous ayons parlé de presque tous les autres aspects de la politique de notre gouvernement, nous n'avons pas discuté d'un sujet crucial : la politique étrangère. Pour nous guider, je vais maintenant demander au ministre des Affaires étrangères de parler de nos progrès sur certaines idées politiques préliminaires.\"\n\nEn s'asseyant, le ministre des Affaires étrangères s'est levé d'un air penaud, face au cabinet composé de ministres relativement nouveaux, issus des deux factions du SPD.\n\n \"Eh bien, Chancelier, nous estimons qu'il est dans le meilleur intérêt de l'Allemagne de l'Ouest de poursuivre une intégration occidentale limitée au cours de cette période.\"\n\nDe partout dans la salle, des halètements, pour la plupart de surprise et de colère, ont émergé de la part des ministres réformistes du SPD nommés dans le cadre d'un geste diplomatique par Franke. Certains ont tenté de lancer une discussion mais ont été réduits au silence par leurs collègues pour laisser le ministre continuer.\n\n \"Ahem. Quoi qu'il en soit, nous pensons qu'il est dans le meilleur intérêt de commencer une lente intégration occidentale - rien de ce que nos collègues de la CDU ont proposé, mais un virage progressif vers l'Ouest pour commencer à recevoir plus d'aide. De plus, nous devrions mettre l'accent sur des liens plus amicaux avec les Allemands de l'Est, en particulier autour de Berlin et en ouvrant l'accès entre les deux nations.\"\n\nFranke leva les yeux, voyant les conversations plutôt douloureuses en cours entre les factions réformistes et conservatrices de son cabinet SPD.\n\n \"Messieurs.\" Il frappa sur la table. \"Bien que ces propositions puissent sembler controversées, elles ont été conçues en gardant à l'esprit les objectifs politiques de chaque faction du SPD. Nous comprenons la nécessité d'une coopération et d'une élaboration politique fondée sur le bon sens et c'est la meilleure option pour le moment.\" Sur ce, il y a eu quelques applaudissements, car les négociations sur ce que serait une politique spécifique commenceraient assez tôt."
 Franke53.3.d: "Franke était dans son bureau, lisant les rapports du matin tandis que son ministre des Affaires étrangères faisait irruption, accompagné de quelques hauts collaborateurs et de son chef de cabinet. Il savait de quoi il s'agissait. \"Chancelier, il y a eu une mise à jour sur l'évolution de la crise hongroise.\"\n\n \"Dis-moi ce que tu as.\"\n\n \"Eh bien, monsieur, l'armée soviétique est intervenue dans la crise qui a suivi. Alors qu'elle avait déjà des troupes en Hongrie avant la révolte, des divisions supplémentaires sont apparues à Budapest et dans les environs, selon nos renseignements. Des centaines de milliers de Hongrois dissidents fuient vers l'Autriche voisine et neutre. On s'attend à des centaines de morts à cause de l'occupation soviétique qui s'ensuit et de l'installation d'un gouvernement pro-Moscou.\"\n\n \"Mein Gott. Que pouvons-nous faire?\"\n\n \"Eh bien, monsieur, le ministère des Affaires étrangères a suggéré que nous tendions la main aux Autrichiens et leur proposons une assistance dans le traitement des réfugiés et des personnes déplacées, leur permettant ainsi de se rendre à l'Ouest.\"\n\n \"Qu'en pensent les autres ? Est-ce que cela recueillerait le soutien du public ?\"\n\nSon chef d'état-major l'interrompit. \"Oui, Herr Chancelier. Il semble que l'opinion publique allemande mobiliserait une sorte d'effort de secours pour les réfugiés, que nous le fassions ou non. Je peux me tromper, mais je suppose que les trois puissances occidentales seraient également favorables.\" Le ministre des Affaires étrangères a rétorqué : \"Oui. Peu importe ce que nous faisons - que nous fassions un effort en faveur des réfugiés ou que nous émettions simplement une condamnation, nous aurons du soutien. C'est seulement à vous de décider jusqu'où nous irons.\""
 Franke53.4.d: "Aujourd'hui, il ne s'agissait pas d'une réunion normale du cabinet du chancelier. Une situation s'était développée au Moyen-Orient et le chancelier Franke estimait qu'elle méritait une réponse.\n\nIl a ouvert. « Monsieur le Ministre, que sait le ministère des Affaires étrangères ? »\n\n\"Monsieur le Chancelier, comme vous le savez, le président égyptien Nasser a nationalisé le canal de Suez le 26 juillet. Cela fait un peu plus de trois mois maintenant et nous avons été informés que ces deux pays ont déployé des parachutistes pour s'emparer du canal de Suez.\"\n\nCela a déclenché une rafale de conversations autour de la table du Cabinet.\n\nFranke parlait au-dessus d'eux. « Nous devons prendre une décision : soit honorer notre amitié avec la Grande-Bretagne et la France, soit exprimer notre soutien à Nasser, en lui offrant un soutien diplomatique. »\n\nLe ministre reprit la parole. \"S'opposer aux Alliés, en particulier aux Français, n'est peut-être pas judicieux à l'heure actuelle. Nous essayons toujours de consolider notre position sur la scène mondiale. Cependant, s'engager actuellement à soutenir l'effort des Nations Unies peut s'avérer être une position neutre : soutenir Nasser par défaut, sans intervenir directement.\"\n\nFranke a examiné les options, puis a soumis la question à un vote du Cabinet. Quelle sera notre position ?"
 Franke53.5.d: "Sur le point de se présenter devant le monde, Franke était nerveux, comme il se doit. Il y avait beaucoup à leur prouver, et après tout ce qui s'était passé en Europe au cours des 20 dernières années, il s'attendait à beaucoup d'hostilité. Il était temps, comme le chef du protocole de l'ONU est apparu pour le présenter.\n\n « Mesdames et messieurs de l'Assemblée générale, Chancelier de la République fédérale d'Allemagne, M. Egon Franke ! Des applaudissements ont retenti tandis que Franke montait les marches et s'approchait du podium, orné de l'écusson doré de l'ONU.\n\n \"Merci beaucoup à tous. Je suis honoré d'être ici aujourd'hui à New York pour m'adresser à l'Assemblée générale des Nations Unies lors de sa 11e session cette année. C'est la première fois dans l'histoire des Nations Unies qu'un représentant de l'Allemagne de l'Ouest s'adresse à l'Assemblée. Je suis fier d'être ce représentant et je suis fier des progrès que l'Allemagne a réalisés dans cette \"Guerre froide\" qui émerge rapidement. Nous avons réussi à nous sortir des sentiers battus et à redévelopper notre économie, à amener l'Allemagne sur une nouvelle voie social-démocrate et à affirmer notre politique étrangère sur la scène mondiale, au moment où je parle ici. Je vous en prie, implorez les plus grandes puissances du monde, le Conseil de sécurité, de repenser vos politiques ; attraper des pays comme l'Allemagne au milieu de vos grands conflits idéologiques est aliénant et inutile. Je remercie le Président de l'Assemblée générale, le Secrétaire général et toutes les personnes présentes de m'avoir laissé parler. Merci.\n\nLes applaudissements ont régné une fois de plus lorsque Franke a quitté la scène, recevant des hochements de tête et des sourires non seulement de la délégation ouest-allemande mais de nombreuses délégations du monde entier."
 Franke53.6.d: "DE : Ministère fédéral des Finances ; Ministère fédéral du Travail ; Ministère fédéral de l'Économie\nDESTINATAIRE : Bureau de la Chancellerie\nOBJET : Proposition de programme Godesberg\n\nMonsieur le Chancelier ; Vous trouverez ci-joint nos recommandations interministérielles concernant le nouveau programme économique du gouvernement, connu sous le nom de « Programme Godesberg ».\n\n1. Nomination immédiate de Karl Schiller, actuel ministre de l'Économie à Hambourg, au poste de ministre fédéral de l'Économie.\n\n2. Nationalisation de Volkswagen GmbH et expansion de la production automobile\n\n3. Développement et extension des installations de raffinage du pétrole et des réseaux ferroviaires en Bavière\n\n4. Expansion des réformes sociales, y compris l'assurance maladie nationale, un système hospitalier élargi et l'intégration des syndicats et des organisations professionnelles dans le processus d'élaboration des politiques.\n\n5. Le cas échéant, une séparation plus stricte entre les politiques du Kanalarbeiter et les politiques traditionalistes du SPD, y compris la condamnation des politiques néo-gauchistes et de toutes les formes de communisme.\n\nNous pensons que ces cinq points revitaliseront l'Allemagne tout en préservant le caractère social-démocrate du gouvernement."
 Franke53.7.d: "DE : Bundespolizei, ministère fédéral de l'Intérieur ; Commandement de la Bundesgrenzschutz (BGSK)\nDESTINATAIRE : Bureau de la Chancellerie\nOBJET : Opération RED SCARE\n\nMonsieur le Chancelier ;\n\nDe récents rapports de sécurité, notamment sur le comportement au sein du Parti social-démocrate, ont révélé des signes inquiétants de la part de certains membres du parti. Les membres de la faction traditionaliste du parti dirigé par Erich Ollenhauer ont manifesté des actions conformes aux néo-gauchistes et se sont rendus à Berlin-Est pour rencontrer les dirigeants communistes est-allemands du SED.\n\nLa Bundespolizei et le BGS ont proposé quelques idées afin de combattre ou d'atténuer ces menaces possibles.\n\n1. Commencer la surveillance passive d'Ollenhauer et d'autres membres traditionalistes de premier plan, y compris de leurs bureaux, résidences et déplacements.\n\n2. Mandater tous les membres du SPD à signaler leurs déplacements hors du pays et augmenter passivement les contrôles de sécurité dans les zones à fort trafic à la frontière intérieure de l'Allemagne et à l'intérieur de Berlin-Ouest.\n\n3. Mener des opérations de lutte contre la surveillance au sein de tous les bureaux du SPD ainsi que de la Chancellerie fédérale et des chambres du Bundestag.\n\nCes points garantiront la sécurité intérieure de l'Allemagne de l'Ouest et empêcheront l'infiltration communiste du SPD et du gouvernement ouest-allemand."
 Franke53.8.d: "C'était une journée ensoleillée lorsque le cortège de Franke s'est arrêté au siège de la brasserie Lowenbrau à Munich, où devait avoir lieu un événement de relations publiques. Fait partie du programme global Godesberg suggéré par les ministres du Travail, des Finances et de l'Économie ; cet événement visait à souligner l'attrait de la bière bavaroise et à étendre sa production au-delà des marchés allemands.\n\nSouriant joyeusement et posant avec une chope de bière à côté du directeur de l'usine de Lowenbrau et des responsables marketing, cette publicité sera diffusée dans toute l'Europe et aux États-Unis, dans l'espoir d'étendre la portée de Lowenbrau et d'autres sociétés brassicoles bavaroises sur les marchés internationaux et d'assurer un meilleur avenir économique pour l'Allemagne."
 
 Franke53.9.t: "Plus de gardien"
 Franke53.9.d: "Au terme d'élections âprement disputées, Egon Franke a assuré son poste de nouveau chancelier de la République fédérale, confirmant ainsi la mainmise des sociaux-démocrates au pouvoir. Prenant la tête du parti après la mort de Kurt Schumacher, Franke dirigera un gouvernement de coalition renouvelé, poursuivant probablement son partenariat avec le Zentrum, tandis que le FDP est passé dans l'opposition, s'alliant aux démocrates-chrétiens. Dans son premier discours, le nouveau chancelier a félicité le peuple allemand pour son engagement en faveur de la démocratie et a promis que le gouvernement continuerait de se concentrer sur la justice sociale et la reconstruction. Parallèlement, le président fédéral Theodor Heuss devrait perdre les prochaines élections présidentielles et le président du Zentrum, Johannes Brockmann, devrait prendre ses fonctions. Les analystes politiques estiment que la victoire de Franke témoigne d'un engagement sur la voie actuelle, même si son gouvernement devrait poursuivre une politique étrangère plus prudente à l'égard de l'intégration occidentale que ne l'aurait fait l'opposition"
 Franke53.9.a: "Retour aux affaires."
 
 Franke53.10.t: "Poursuite du Zentrum-Alliance"
 Franke53.10.d: "La véritable histoire déterminante des élections de 1953 est la résurgence étonnante de notre partenaire de coalition, le Zentrumspartei. Le Parti du Centre a défié toutes les attentes, remportant quatre pour cent supplémentaires des voix nationales et consolidant ainsi son rôle de partenaire essentiel du gouvernement. Ce résultat est largement considéré comme une approbation de la combinaison de programmes de protection sociale et de défense des valeurs de la communauté chrétienne. Avec la victoire de Johannes Brockmanns à l'élection présidentielle fédérale, l'influence renforcée du parti Zentrum au sein du cabinet devrait orienter la politique intérieure du gouvernement, en mettant davantage l'accent sur les questions familiales et ecclésiales pour le prochain mandat."
 Franke53.10.a: "Huzzah !"
 
 Franke53.11.t: "Ollenhauer affronte Franke"
 Franke53.11.d: "La faible majorité du gouvernement du chancelier Egon Franke commence à se fracturer sous la pression du gouvernement. Alors que la formidable opposition de la CDU bloque des réformes sociales et économiques clés au Bundestag, une impasse tendue est apparue au sein même du SPD. Erich Ollenhauer, confronté à la pression croissante de la gauche du parti, s'est directement adressé à la chancelière. Dans une discussion franche, Ollenhauer a exposé la dure réalité de la situation : Franke doit faire un choix. Il peut soit soutenir l'aile gauche enhardie du parti, unifiant le SPD pour une confrontation idéologique directe contre l'opposition, soit écarter les gauchistes pour poursuivre une voie pragmatique de compromis, en faisant des concessions significatives à la CDU pour garantir l'adoption de la législation. La voie de l'unité du parti risque une impasse législative, tandis que la voie du compromis menace de diviser le mouvement social-démocrate en deux. Le chancelier est désormais pris entre son parti et son État, et sa prochaine décision déterminera probablement le sort de son gouvernement."
 Franke53.11.a: "Nous devons travailler ensemble en tant que Parti Uni."
 Franke53.11.b: "La Tolérance de la CDU et du FDP est trop importante."
 
 Franke53.12.t: "La nomination de Karl Schiller"
 Franke53.12.d: "Afin de redynamiser l'agenda économique du gouvernement, la chancelière a annoncé la nomination du professeur Karl Schiller au poste de ministre fédéral de l'Économie. Schiller, économiste accompli de l'Université de Hambourg, jouit d'une réputation d'intellectuel brillant mais pragmatique. Ancien membre du parti nazi pendant ses années d'étudiant, il a ensuite servi dans la Wehrmacht avant de se consacrer au monde universitaire et à la social-démocratie après la guerre. Son ascension au sein du SPD a été alimentée par ses arguments puissants en faveur d'une politique économique modernisée, allant au-delà des doctrines de la vieille école du parti.\n\nLa nomination du nouveau ministre s'explique en grande partie par sa philosophie directrice, qu'il résume ainsi : « autant de marché que possible, autant de planification que nécessaire ». Cette croyance d'inspiration keynésienne constitue une réponse à « l'économie sociale de marché » de la CDU. En faisant entrer Schiller au gouvernement, le gouvernement vise non seulement à optimiser les performances économiques grâce à une gestion macroéconomique moderne, mais également à gagner la bataille intellectuelle pour l'avenir de l'Allemagne."
 Franke53.12.a: "Nous suivrons votre carrière avec beaucoup d'intérêt."
 
 Franke53.13.t: "Herbert Wehner nommé ministre des Affaires allemandes"
 Franke53.13.d: "Des protestations massives ont éclaté au sein de la CDU suite à la décision du chancelier de nommer Herbert Wehner comme nouveau ministre fédéral chargé des questions panallemandes. Le choix de Wehner - un ancien communiste de haut rang qui a radicalement rompu avec le stalinisme pour devenir un social-démocrate passionné - est une déclaration d'intention claire. Il est connu dans toute l'Allemagne pour son génie tactique, sa discipline de fer et son style politique impitoyable.\n\nIl a publiquement engagé son ministère, et par extension la République fédérale, dans l'objectif inébranlable de parvenir à une future réunification allemande, qui inclura également les territoires perdus des frontières de 1937 ainsi que l'ancienne ville libre de Dantzig. Cette politique radicale revendique explicitement les territoires à l'est de la ligne Oder-Neisse, provoquant une onde de choc à Varsovie, à Moscou et dans les capitales occidentales. Si cette décision a été saluée par les associations de réfugiés et la droite nationaliste, les alliés occidentaux sont profondément alarmés par ce qu'ils considèrent comme une position dangereusement révisionniste. Néanmoins, Wehner croit en l'unification pacifique de l'Allemagne, dénonçant toute prétention d'agression présumée contre l'Allemagne de l'Est, la Pologne et l'Union soviétique."
 Franke53.13.a: "Das ganze Deutschland soll es sein!"
 
 Franke53.14.t: "Adenauer soutient Franke"
 Franke53.14.d: "Suite à la décision de la direction du SPD de s'engager dans une coopération informelle avec les démocrates-chrétiens, plutôt que de collaborer avec l'aile gauche du SPD, Konrad Adenauer a invité Egon Franke à un dîner personnel à Bonn, aux côtés de son collègue de longue date Ludwig Erhard, pour discuter d'autres approches au cours de la prochaine législature. Le consensus mutuel concernant l'intégration occidentale et une économie sociale de marché a créé une marge de manoeuvre permettant aux deux parties de négocier. Ce ne sera pas une tâche facile, mais Franke peut désormais espérer que la CDU ne se montrera pas réticente à l'égard des propositions législatives concernant l'économie, la politique sociale et les relations internationales. La soirée s'est terminée par une partie de poker, un verre de whisky et l'un des cigares préférés d'Erhard. Il s'avère qu'Adenauers Pokerface n'est pas le meilleur en matière de Texas Hold'em."
 Franke53.14.a: "Merci."
 
 Franke53.15.t: "Pourparlers de sécurité avec l'Allemagne de l'Ouest"
 Franke53.15.d: "Malgré les inconvénients concernant l'intégration de l'Allemagne de l'Ouest dans la structure de sécurité occidentale sous l'administration Schumacher, le chancelier allemand nouvellement élu, Egon Frankes, dans son discours inaugural au Bundestag, a clairement indiqué que le gouvernement était déterminé à intégrer l'Allemagne de l'Ouest dans le bloc occidental. Alors que le gouvernement Franke a exprimé ses inquiétudes quant à une demande d'adhésion rapide à l'OTAN, les troupes de l'OTAN sont invitées à poursuivre des exercices militaires en vue d'une éventuelle invasion soviétique. Francfort n'est peut-être pas aussi ouverte à l'intégration occidentale en termes d'étendue que la CDU de Konrad Adenauer, mais il est clair que l'Allemagne de l'Ouest restera un allié de l'OTAN et n'essaiera pas de poursuivre sur la voie du non-alignement."
 Franke53.15.a: "Cela bénéficiera à la politique européenne de défense."
 Franke53.15.b: "Cela bénéficiera à la politique européenne de défense."

 
 Franke57.1.d: "Il était tôt le matin à la Chancellerie, suffisamment tôt pour que seul le personnel essentiel soit là. Le soleil se levait ; à peine l'aube se trouvait-elle, mais dans le bureau du chancelier se trouvaient cinq personnes : le chancelier Franke, son chef de cabinet, le ministre des Affaires étrangères, le ministre de la Défense et le ministre du Nucléaire. Ce dernier étant un nouveau poste créé par Franke lors de son mandat précédent, cette réunion aurait une importance qui changerait le monde. Le ministre de la Défense, le choix de l'opposition CSU de Franz Josef Strauss, a ouvert la voie.\n\n \"Eh bien, comme certains d'entre nous l'ont dit, je pense que nous pouvons tous convenir que la situation mondiale actuelle mérite une plus grande capacité de défense. Même si nous avons déjà pris notre décision concernant la Bundeswehr et la Bundesgrenzschutz, il y a un aspect supplémentaire que nous devrions considérer.\" Faisant un signe de tête à Franke, il continua. \"Je pense que ce gouvernement devrait lancer un petit programme limité d'armes nucléaires d'autodéfense.\"\n\nLe ministre du Nucléaire, un autre membre de la CDU, Siegfried Balke, a hoché la tête. \"Oui. Avec notre capacité nucléaire actuelle, et avec l'aide supplémentaire des Américains ou des Français, nous pouvons commencer à enrichir de l'uranium à des fins militaires.\"\n\nFranke hocha la tête. \"Excellent.\" Se tournant vers le ministre des Affaires étrangères, qui avait l'air plutôt inquiet, il lui fit signe de parler.\n\n \"Cela pourrait causer plus de problèmes que d'avantages. Pour convaincre les Américains que nous n'avons pas besoin d'utiliser leurs propres armes nucléaires, et pour faire face aux Soviétiques qui pourraient y voir une escalade massive, mon bureau devra faire face à la réaction du public.\"\n\nFranke hocha la tête d'un air sombre. \"Eh bien, nous devrons gérer cela du mieux que nous pouvons. Contactez les Américains, entamons des négociations et retenons les Soviétiques pour l'instant, alors ils le découvriront. Allons de l'avant.\""
 Franke57.2.d: "DE : Ministère fédéral du Nucléaire\nDESTINATAIRE : Bureau de la Chancellerie\nOBJET : Rapport de visite des conseillers américains de l'AEC\n\nChancelier,\n\nIl y a une semaine, les responsables du ministère ont reçu la visite de cinq membres et collaborateurs de la Commission américaine de l'énergie atomique (AEC) concernant la coopération américano-allemande dans le domaine des armes nucléaires défensives.\n\nFaisant suite à un accueil initialement froid et dur de la part de l'ambassade américaine à Francfort, la visite des responsables de l'AEC et leurs réunions avec les responsables du BMAt ont approfondi la coopération, en particulier sur des détails spécifiques tels que l'enrichissement de l'uranium et les méthodes de conversion des installations nucléaires actuelles en installations d'enrichissement, ainsi que les procédures particulières de ce processus.\n\nLes contacts avec notre agent de liaison au ministère de la Défense ont indiqué que des réunions similaires avec des responsables du DoD américain et le personnel de l'USAFE à Bruxelles se sont bien déroulées, en particulier dans les discussions autour de la stratégie allemande de prolifération des armes nucléaires et de la logistique de la manière dont elles pourraient être déployées.\n\nEn visitant plusieurs centrales nucléaires à travers le pays, les conseillers de l'AEC établiront probablement une présence plus permanente en dehors de l'ambassade à Francfort, alors que les négociations et les réunions politiques se poursuivent, alors que le programme démarre."
 Franke57.3.d: "DE : Agence fédérale de secours technique (Bundesanstalt Technisches Hilfswerk, THW)\nDESTINATAIRE : Bureau de la Chancellerie\n\nOBJET : Rapport du test fédéral de préparation nucléaire\n\nChancelier,\n\nIl y a environ un mois, un test de préparation nucléaire à l'échelle nationale a été mené auprès de l'ensemble de la population ouest-allemande. Créé sur ordre de cette agence et coordonné avec tous les gouvernements étatiques et municipaux, l'exercice s'est conclu avec un taux de participation estimé à 85% de la population.\n\nLe but d'un tel test était simultanément de former la population aux précautions à prendre en cas de conflit nucléaire et de recueillir des données et des statistiques cruciales sur une réponse nationale à un conflit nucléaire.\n\nL'exercice a commencé tôt le matin, lorsqu'à la réception d'une alerte radar, les sirènes de raid aérien ont commencé à retentir dans tout le pays, signalant au personnel de THW de commencer à organiser le public pour qu'il se dirige vers les abris antiatomiques et autres lieux d'organisation.\n\nEnviron 18 minutes plus tard, le Bundesgrenzschutz et le quartier général du ministère de la Défense confirmaient la « destruction » de Berlin, Francfort, Hambourg, Cologne, Munich et d'autres grandes villes allemandes par les bombes nucléaires soviétiques.\n\nAprès une période de comptage et de détermination de l'ampleur des « destructions », les responsables du THW et leurs organisations régionales ont confirmé que parmi la population participant à l'exercice, environ 30 %, soit environ 13 millions de personnes, ont été « tuées » à la suite de la détonation ou des destructions qui en ont résulté. Le THW estime qu'il serait possible de faire davantage pour sauver la population en cas d'attaque nucléaire soviétique."
 Franke57.4.d: "ATTENTION! ATTENTION!\n\nVoulez-vous sauver l'Allemagne d'une attaque communiste rouge ?\n\nSAUVEZ L'ALLEMAGNE AUJOURD'HUI !n\nLa menace d'une attaque nucléaire soviétique contre l'Allemagne et l'Europe occidentale n'est jamais plus claire !\n\nRejoignez le Technisches Hilfswerk dès aujourd'hui !\n\nTHW fournit le soutien et l'organisation nécessaires au public en matière de protection civile et de catastrophes naturelles !\n\nSoyez un patriote, rejoignez THW aujourd'hui !"
 Franke57.5.d: "Debout dans l'ombre de la salle du Conseil de sécurité de l'ONU, Franke semblait de plus en plus nerveux. Flanqué de son chef d'état-major, des ministres de la Défense, des Affaires étrangères et du Nucléaire, Franke s'assit au bureau prévu pour les membres observateurs du Conseil et se prépara mentalement à parler. Après tout ce temps, de nombreuses heures et de longues nuits de discussions avec ses ministres, diplomates et scientifiques, on en était arrivé là. Que penseraient-ils ? Son ministre des Affaires étrangères avait préparé une première estimation des réactions, mais Franke ne pouvait jamais en être sûr.\n\nLe président du Conseil de sécurité, l'ambassadeur américain Henry Cabot Lodge Jr., s'est levé, introduisant la réunion à l'ordre, avant de permettre à Franke de parler.\n\n \"Merci, Mesdames et Messieurs du Conseil de sécurité. Je comprends que la raison pour laquelle je suis ici est controversée, comme vous l'avez sûrement tous entendu. Quatre des cinq membres permanents de ce Conseil sont des États dotés de l'arme nucléaire, pour une raison ou une autre. La possession d'armes et de technologies nucléaires est un sujet et un problème sérieux à notre époque, en particulier avec les tensions entre certains membres de ce Conseil. Le gouvernement de la République fédérale l'a reconnu et a avancé avec des plans pour l'énergie nucléaire et/ou des armes nucléaires limitées. Nous devons souligner que que ce soit pour la paix En cas de guerre, notre possession de technologie nucléaire est gérée conformément aux négociations des alliés et des autres États responsables. Nous reconnaissons les problèmes et le passé malheureux inhérents à l'histoire de l'Allemagne en matière de développement nucléaire et essayons d'y remédier du mieux que nous pouvons. Je ne peux qu'espérer que les pays du Conseil de sécurité et les Nations Unies dans leur ensemble accepteront nos efforts et respecteront notre décision de devenir une puissance nucléaire.\n\nIl n'y eut pas d'applaudissements et tandis que Franke s'asseyait, il pouvait sentir le regard furieux de l'ambassadeur soviétique sur son visage.\n\nLa réunion s'est poursuivie, l'ambassadeur soviétique lançant une attaque acerbe contre les « fascistes et impérialistes dotés d'armes nucléaires », qui a rapidement dégénéré en une bataille idéologique avec les quatre autres membres. Pour Franke, cependant, cela semble être un certain succès."
 Franke57.6.d: "C'était en début d'après-midi à la Chancellerie lorsque Franke, occupé à réfléchir à d'autres rapports dans son bureau, reçut un coup à la porte, accompagné de son ami et membre du Kanalarbeiter, Karl Herold, qui fit irruption. Herold avait l'air plutôt pressé et en colère, soufflant en entrant.\n\n \"Egon, c'est déplorable. Vous DEVEZ faire quelque chose à ce sujet !\"\n\n \"Ravi de te revoir, Karl. Je suppose que le Bundestag se porte bien ?\"\n\n \"Eh bien, Chancelier, j'aimerais pouvoir le dire. Aucun problème avec notre législation et vos politiques, mais c'est la cafétéria qui est le problème ici.\"\n\n \"Qu'est-ce qu'il y a, Karl?\"\n\n \"Eh bien, Egon, c'est la cafétéria. Il n'y a pas à manger. Les portions sont trop petites. Il faut ramener des saucisses de chez nous ! C'est fou !\"\n\nFranke soupira. Se levant, il prit Herold par l'épaule et l'accompagna hors du bureau. Dix minutes plus tard, ils se trouvaient à la cafétéria du bâtiment du Bundestag, assis avec le directeur général.\n\n \"Vous devez vous demander pourquoi je suis ici, Herr Strass. On m'a dit que les portions de nourriture ici à la cafétéria diminuaient régulièrement.\"\n\nIl tremblait dans ses bottes, pas habituellement habitué à parler à une personne de haut rang comme Franke. \"Oui, monsieur, je suppose que oui.\"\n\n \"Eh bien, comment pouvons-nous résoudre ce problème ? Les députés du Bundestag ici doivent bien manger s'ils peuvent accomplir leur mission de servir ce pays.\"\n\n \"Eh bien, monsieur, nous ferons de notre mieux pour résoudre ce problème.\"\n\n \"Merci, Herr Strass. Bonne journée.\" Il fit un clin d'oeil à Herold et serra la main du directeur tandis qu'ils sortaient en valsant, un autre problème de la République fédérale résolu."
 Franke57.7.d: "Après des jours et des jours de délibérations et de planification, il était temps. Le chef de cabinet de Franke comprit immédiatement ce qui se passait lorsqu'il ouvrit la porte du bureau du chancelier.\n\nCinq minutes plus tard, les appels avaient été passés et, escorté par des agents de la Bundespolizei et du BGS, Erich Ollenhauer a été conduit sans cérémonie dans le bureau de Franke, où attendaient des responsables du SPD ainsi que de l'Office fédéral pour la protection de la Constitution (BfV), ainsi que Franke lui-même.\n\nOllenhauer était à la fois furieux, confus et, d'une manière ou d'une autre, conscient de ce qui allait se passer. Pendant que les policiers attendaient dehors, les discussions ont commencé.\n\n \"Je suis sûr que tu sais pourquoi tu es ici, Erich.\"\n \"Non, Chancelier, vraiment pas. J'aimerais avoir une explication sur la raison pour laquelle les policiers étaient devant mon bureau pour me chercher.\"\n \"C'était regrettable, mais nous devions nous assurer que vous viendrez ici malgré tout.\"\n \"Et bien, qu'en est-il ? Je suis là maintenant.\"\n\n \"Herr Ollenhauer, vos actions au cours des derniers mois et années ont éveillé les soupçons, en particulier ceux de nos services de renseignement et de sécurité intérieurs, ainsi que des responsables du parti. C'est pourquoi tous ces gens sont ici. Vos déplacements, en particulier deux visites à Berlin-Est au cours de la dernière année, ainsi que des visites en Yougoslavie, en tant que membre officiel de ce gouvernement sans autorisation, ont suscité beaucoup d'inquiétude dans ce bureau. C'est pourquoi, en ma qualité de Chancelier fédéral et de leader du Parti social-démocrate, je mets fin à vos fonctions de ce poste. Gouvernement ainsi que votre appartenance au Parti social-démocrate. Votre position au Bundestag restera indépendante jusqu'aux prochaines élections.\n\n \"Quoi ? Egon, pourquoi ? Ces visites à Berlin étaient de nature diplomatique, je n'avais aucune intention de nuire à la sécurité de cette République en m'engageant dans des pourparlers avec des représentants de l'Allemagne de l'Est.\" En regardant les responsables du SPD, il a plaidé : \"Cela ne peut sûrement pas être légal. Le Chancelier ne peut pas prendre une telle décision unilatéralement ?\"\n\nL'un des fonctionnaires s'est manifesté. \"J'en ai bien peur, Herr Ollenhauer. Les statuts stipulent qu'il peut vous retirer votre adhésion et vous renvoyer du gouvernement; comme dit précédemment, votre position au Bundestag ne sera pas affectée pour le moment.\"\n\nOllenhauer soupira, enfonçant ce qui ressemblait à un pied dans le tapis. \"Très bien. Soyez assurés que ce gouvernement et ce parti ne perdront pas de vue ma mission et mes idéaux. Vous ferez face à ce défi devant les tribunaux, mais j'y vais.\"\n\nEn sortant de la pièce, tous rassemblés semblaient déprimés, comme s'ils ne voulaient pas faire ça ; surtout Franke, mais il le fallait."
 Franke57.8.d: "\"FRANCFORT, Allemagne de l'Ouest (AP) - Des rapports de hauts fonctionnaires de la Chancellerie fédérale ouest-allemande indiquent la formation aujourd'hui du \"Bloc uni\" - un partenariat entre le parti social-démocrate au pouvoir et l'Union chrétienne-démocrate minoritaire. Composée principalement d'éléments conservateurs au sein du SPD, dirigé par le chancelier Egon Franke, cette soi-disant \"grande coalition\" ou \"coalition rouge-jaune\" n'était pas totalement inattendue par la plupart des analystes politiques, qui pensaient que les deux factions se réuniraient. Faction réformiste dirigée par Erich Ollenhauer au sein du SPD, cette nouvelle coalition devrait susciter beaucoup plus d'intérêt pour la politique future de l'Allemagne de l'Ouest.»\n\nEn lisant cette coupure le lendemain matin, Franke était plutôt satisfait du résultat. Décrochant le téléphone, il appela le bureau du siège de la CDU.\n\n « Konrad, as-tu déjà vu le journal de ce matin ?"
 Franke57.9.d: "Comme d'habitude, le Bundestag était en effervescence, mais pour une autre raison. Au lieu de débattre des lois et des dépenses, ils débattaient de quelque chose de différent ; ce que signifiait le socialisme. Il s'agissait en grande partie d'un débat entre la CDU et le SPD et leurs deux factions sur ce que cela signifiait et, comme toute question partisane, il devenait extrêmement incontrôlable.\n\nPendant que les délégués de la CDU confondaient socialisme et communisme, les délégués du SPD huaient, criaient des phrases anti-nazies et tentaient d'argumenter, tandis que le parlementaire tentait de rétablir l'ordre.\n\nPersonne ne savait exactement pourquoi cela se produisait, mais l'un des adjoints de Franke l'avait inscrit au rôle, espérant que la République fédérale pourrait fournir une définition politique du socialisme. Les députés du SPD essayaient sérieusement de le défendre, arguant que le socialisme était la meilleure forme de gouvernement pour l'Allemagne et que la nationalisation de l'industrie finirait par fonctionner. Il fallait cependant prendre une décision, et vite."
 Franke57.10.d: "« Pourquoi devons-nous laisser les convictions personnelles être enseignées dans les salles de classe publiques ? »\n\nCette journée, qui marquait encore une fois une journée productive au Bundestag, était centrée sur une nouvelle question controversée qui balayait également la Belgique voisine : l'enseignement de l'éducation religieuse, en particulier de la théologie catholique, dans les écoles publiques financées par le gouvernement.\n\nDe toute évidence, l'Union chrétienne-démocrate d'opposition soutient pleinement l'éducation religieuse et la prière dans les écoles, en particulier en ce qui concerne l'attribution d'un moment de la journée pour le culte obligatoire. Le Parti social-démocrate au pouvoir serait normalement fermement opposé à ce projet pour des raisons laïques et sociales-démocrates, si certains députés du Kanalarbeiter n'étaient pas restés globalement modérés sur la question. Même si la plupart conviennent que l'utilisation de fonds gouvernementaux pour la prière dans les écoles est un élément négatif en soi, certains ne sont pas opposés à l'idée d'introduire un temps de prière ou d'autres allocations pour les croyances catholiques et protestantes dans les programmes scolaires sur une base volontaire.\n\nCependant, cela les éloigne encore davantage de l'aile traditionaliste du SPD, qui estime que le gouvernement et la religion organisée (principalement dans ce cas l'Église catholique) ne devraient avoir aucune interaction au niveau éducatif. Cependant, aucune décision n'a encore été prise sur cette question."
 Franke57.11.d: "Alors qu'une nouvelle matinée commençait, une nouvelle réunion du cabinet s'ouvrait, avec un sujet nouveau et important : l'OTAN. Lors de sa formation initiale en 1949 pour défendre l'Europe occidentale, le gouvernement Schumacher a refusé unilatéralement l'adhésion en raison de sa colère envers les blocs de l'Ouest et de l'Est. Cependant, le nouveau gouvernement Franke, davantage orienté vers une politique pro-occidentale, a envisagé une proposition d'adhésion à l'OTAN.\n\nL'un des délégués traditionalistes du SPD s'est levé et a commencé à parler avec inquiétude de « l'engagement envers cette Alliance, les hommes qui pourraient mourir, dans quoi nous embarquons-nous ?\n\nLe chef d'état-major de Franke a commencé par réfuter : \"Ce pays sera envahi par les Soviétiques, que nous rejoignions ou non cette Alliance. Si nous la rejoignons, au moins en tant que membre limité, nous bénéficierons d'une certaine protection, au moins les forces alliées pourront couvrir nos positions et nous offrir une chance de survie.\"\n\n « Très bien, qu'implique le fait de devenir membre limité ? »\n\nFranke regarda son assistant militaire et ministre des Affaires étrangères, cherchant une sorte de réponse.\n\n \"Pour l'instant, Monsieur, nous pouvons entamer le processus d'adhésion pour devenir observateur de l'OTAN, ou devenir membre à part entière. Les observateurs ne garantissent pas la sécurité mutuelle, mais l'Alliance viendra très certainement à notre aide, étant entendu que nous avons certaines réserves.\"\n\n \"Très bien alors. Quelle sera notre décision?\""
 Franke57.12.d: "C'est avec des nouvelles surprenantes en provenance conjointe de Francfort et de Bruxelles que la République fédérale d'Allemagne a soumis à titre d'observation ses documents d'adhésion à l'Organisation du Traité de l'Atlantique Nord. Choquant la plupart des observateurs de la politique de sécurité européenne, en particulier avec le gouvernement social-démocrate au pouvoir dirigé par le chancelier Egon Franke, un haut responsable du gouvernement a révélé que l'idée s'inscrivait dans une orientation globalement pro-occidentale et que l'adhésion inclurait tous les avantages autres que la sécurité mutuelle garantie par l'article 5. Cela plaît à la plupart des dirigeants de l'opposition et à la faction du SPD de Franke, mais il est peu probable que cela soit bien accueilli par la faction traditionaliste, en particulier avec leurs sentiments anti-bloc."
 Franke57.13.d: "\"Mesdames et messieurs de la Communauté économique européenne, merci à tous d'être venus ici aujourd'hui. Je suis plus qu'honoré de prendre la parole devant cette instance aujourd'hui pour rendre compte du rôle de l'Allemagne dans le nouveau paysage européen émergent. Le peuple allemand a parcouru un long chemin en moins de dix ans d'existence et les gouvernements sociaux-démocrates nous ont guidés vers le progrès. Je crois que dans un monde en constante évolution, largement défini par des différences idéologiques et politiques, la CEE devrait s'unir en une seule force, non seulement pour soutenir notre économie, mais aussi soutenir notre peuple, notre politique étrangère et notre culture. L'Europe peut être plus unie, et dans cette époque de progrès, je pense que le moment est venu d'accomplir beaucoup de choses pour le bien du monde."
 Franke57.14.d: "DE : Bureau de la Chancellerie\nDESTINATAIRE : Tous les ministères et agences\nOBJET : Nouvelles réformes militaires et économiques pour la République fédérale\n\nDe nouvelles initiatives de grande envergure conçues pour exploiter la puissance militaire et économique de la République fédérale entrent en vigueur immédiatement.\n\n1. Développer davantage la Bundeswehr et/ou la Bundesgrenzschutz, en insistant sur la nécessité d'une formation des officiers militaires.\n\n2. Discutez de l'acceptation d'une aide militaire étrangère, en particulier de la part des États-Unis et d'autres pays alliés.\n\n3. Débattre de la question de la conscription et des avantages sociaux des soldats/anciens combattants.\n\n4. Continuer à développer les installations industrielles, notamment les raffineries de pétrole en Bavière et les installations de production de charbon dans la région de la Ruhr.\n\n5. Augmenter les infrastructures, en mettant un accent particulier sur les réseaux ferroviaires et aériens, par opposition aux autoroutes générales et autres formes de transport routier.\n\nCes politiques servent simplement de base sur laquelle vos départements et agences peuvent travailler, et le Bureau de la Chancellerie se réjouit de poursuivre sa collaboration avec chaque ministère exécutif, agence ou commission impliqué.\n\nCordialement,\nLe chancelier Egon Franke."
 Franke57.15.d: "Aujourd'hui devait être un jour capital pour la population de l'Allemagne de l'Ouest. Alors que des centaines de milliers de familles allemandes regardaient le journal télévisé du soir Tagesschau, elles furent interrompues par un reportage spécial provenant directement de la Chancellerie. C'était la première fois depuis que la télévision était devenue largement disponible que le gouvernement fédéral ouest-allemand prononçait un discours et, debout devant un large podium orné d'un aigle noir, se tenait Egon Franke, chancelier, populaire parmi la plupart mais pas tous.\n\n \"Peuple d'Allemagne ! Mes compatriotes allemands ! C'est la première fois que certains d'entre vous me voient en direct à la télévision, directement depuis la Chancellerie fédérale à Francfort. La télévision est l'une des formes médiatiques les plus modernes et les plus innovantes de ce siècle émergent, et j'ai choisi cela pour illustrer à quel point la République fédérale a changé au cours de la dernière décennie. Depuis notre fondation il y a dix ans, beaucoup a été fait. Notre gouvernement est fort, construit pour le peuple et par le peuple ; notre économie est prospère ; nos affaires étrangères sont en train de développer des liens avec l'Occident en Nous, les Allemands, avons été témoins de nombreux événements au cours des dix dernières années : de la diplomatie des grandes puissances de l'Ouest et de l'Est, des guerres, des conflits internes et des problèmes. Mais nous avons persévéré ! Beaucoup, l'Allemagne et gute Nacht.\n\n§CC'est désormais la fin du contenu pour cette voie de l'Allemagne de l'Ouest. Merci d'avoir joué et n'oubliez pas de consulter la chaîne Discord officielle du rideau de fer de la guerre froide pour plus d'informations et de questions.§!"

 Franke57.16.t: "Un deuxième gouvernement Franke"
 Franke57.16.d: "Une fois de plus, Egon Franke a assuré son poste de chancelier allemand, gardant ainsi le pouvoir des sociaux-démocrates. Quatre ans après son premier mandat, Franke dirigera un gouvernement de coalition renouvelé, poursuivant probablement son partenariat avec le Zentrum, tout en envisageant une coopération conjointe avec les démocrates-chrétiens. Dans son discours, le Chancelier a félicité le peuple allemand pour son engagement en faveur de la démocratie et a promis que le gouvernement continuerait de se concentrer sur la justice sociale et la reconstruction. Entre-temps, le président fédéral Brockmann devrait rester président du Bundespräsident. Les analystes politiques estiment que la deuxième victoire de Franke témoigne d'un engagement accru en faveur de la voie actuelle, même si son gouvernement pourrait être persuadé de se lancer dans des expériences avec les démocrates-chrétiens."
 Franke57.16.a: "Immerger Voran!"
 
 Franke57.17.t: "La doctrine Frappe"
 Franke57.17.d: "La doctrine française de frappe fait référence à la politique française d'utilisation de ses armes nucléaires, construite sur l'idée d'une force nucléaire indépendante (force de frappe) capable d'infliger des « dommages inacceptables » à tout agresseur, même une superpuissance. Plutôt que d'égaler l'arsenal de l'ennemi, la dissuasion de la France repose sur la certitude d'une frappe de représailles dévastatrice si les intérêts vitaux de la France sont menacés. Cela inclut une capacité de deuxième frappe limitée mais viable - fournie par des sous-marins, des avions et des missiles - garantissant que toute attaque nucléaire contre la France entraînerait une réponse paralysante."
 Franke57.17.a: "Un sage exemple."

 Franke57.18.t: "Une autre coopération du Zentrum"
 Franke57.18.d: "Le Zentrumspartei s'est révélé être un excellent partenaire de coalition pour le SPD. Malgré quelques différences, les deux partis font preuve d'un engagement intense en faveur de la démocratie, de l'antitotalitarisme, du fédéralisme et de l'intégration occidentale. Nous poursuivrons cette coopération pour la prochaine législature, étant donné que les résultats des élections ne laissent pas autant d'options aux sociaux-démocrates."
 Franke57.18.a: "Nous connaissons le Drill."

 Franke57.19.t: "Le débat SPD-CDU"
 Franke57.19.d: "La majorité du gouvernement du chancelier Egon Franke est une fois de plus mise à rude épreuve, les démocrates-chrétiens obtenant plus de 39% des voix, laissant une grande opposition au Bundestag, bloquant des réformes sociales et économiques clés. Une autre impasse est apparue au sein même du SPD. La gauche du parti s'est une fois de plus directement opposée à la chancelière. Dans une discussion franche, Franke doit prendre une décision : soit il unifie le parti et dirige une coalition avec la gauche, contre l'opposition, soit il peut mettre les gauchistes sur la touche et former une plus grande coalition avec la CDU, faisant ainsi d'importantes concessions aux démocrates-chrétiens pour garantir l'adoption de la législation. Une fois de plus, le chancelier est désormais pris entre son parti et son État, et sa prochaine décision déterminera probablement le sort de son gouvernement."
 Franke57.19.a: "Nous devons travailler en tant que Parti uni."
 Franke57.19.b: "Il s'agit de la première Große Koalition."
 
 Franke57.20.t: "[GetNewspaperHeader] Grande Koalition en Allemagne de l'Ouest"
 Franke57.20.d: "Dans un réalignement politique étonnant après les élections de 1957, le SPD victorieux du chancelier Egon Franke a forgé une « Grande Coalition » sans précédent avec son principal rival, la CDU/CSU. Le petit parti Zentrum rejoindra également le cabinet, créant ainsi un gouvernement d'unité nationale disposant d'une majorité parlementaire massive.\n\nCette décision constitue le triomphe ultime de la vision pragmatique de Franke, cimentant la transformation du SPD en un « Parti populaire » centriste en mettant de côté sa propre gauche idéologique. Tout en donnant à la CDU une influence continue au sein du cabinet, l'accord historique laisse les démocrates libres et les conservateurs nationaux comme une opposition croupion, soulevant des questions sur l'avenir du débat parlementaire dans une ère de consensus écrasant."
 Franke57.20.a: "Si ça marche..."
 
 
 Reimann_SOV.0.t: "L'Allemagne de l'Ouest demande une assistance technique"
 Reimann_SOV.0.d: "Au lendemain de la victoire du KPD en Allemagne de l'Ouest, la nouvelle coalition KPD-SPD a introduit divers changements politiques en Allemagne de l'Ouest pour façonner le pays davantage selon les structures et les idéaux marxistes-léninistes. Aujourd'hui, l'ambassade de l'Allemagne de l'Ouest à Moscou nous a demandé d'envoyer divers conseillers techniques en Allemagne de l'Ouest comme ressources supplémentaires pour la reconstruction. Même si les souvenirs de la guerre sont encore frais, cela semble être une excellente opportunité d'acquérir de l'influence en Allemagne de l'Ouest et ainsi de se rapprocher d'une réunification communiste du pays."
 Reimann_SOV.0.a: "Mais bien sûr."
 
 Reimann_SOV.1.t: "L'Union soviétique envoie de l'aide"
 Reimann_SOV.1.d: "Moscou a accepté notre demande de conseillers techniques, ce qui nous permet de poursuivre la reconstruction encore plus rapidement que prévu."
 Reimann_SOV.1.a: "Excellent."
 
 Reimann_SOV.2.t: "L'Allemagne de l'Ouest cherche à acheter de vieux chars"
 Reimann_SOV.2.d: "Une fois de plus, les Allemands de l'Ouest nous ont demandé davantage d'aide, cette fois par des moyens militaires. Divers vieux chars T-54 sont toujours dans nos stocks, époussetés de jour en jour, attendant finalement d'être mis hors service. Peut-être pourrions-nous les offrir aux Allemands de l'Ouest comme un geste agréable et un moyen d'acquérir de l'influence ?"
 Reimann_SOV.2.a: "Commandez la livraison."
 
 Reimann_SOV.3.t: "L'Union soviétique accepte"
 Reimann_SOV.3.d: "Le Kremlin était plus qu'heureux de nous vendre divers vieux chars T-54, ordonnant immédiatement leur livraison à Bonn. Ils seront d'une grande utilité dans la nouvelle structure de la Bundeswehr."
 Reimann_SOV.3.a: "Très bien."
 
 Reimann.0.t: "[GetNewspaperHeader] Max Reimann élu chancelier en Allemagne de l'Ouest"
 Reimann.0.d: "Dans une tournure choquante des événements, le Parti communiste allemand (KPD), dirigé par Max Reimann, a remporté les élections au Bundestag de 1949, obtenant la chancellerie grâce à une coalition avec le Parti social-démocrate (SPD). Cette alliance inattendue a exclu les chrétiens-démocrates (CDU), suscitant l'indignation des conservateurs et faisant craindre une transformation socialiste en Allemagne de l'Ouest. Des allégations d'ingérence soviétique pèsent sur les élections, des rapports suggérant un soutien secret au KPD, bien que le gouvernement nie ces affirmations. Reimann s'est engagé à poursuivre une politique socialiste, notamment en nationalisant les industries et en réévaluant les liens avec l'Occident, tout en renforçant les relations avec l'Allemagne de l'Est et l'Union soviétique. Les dirigeants occidentaux, notamment aux États-Unis et en Grande-Bretagne, ont réagi avec inquiétude, avertissant que l'évolution de l'Allemagne vers le socialisme pourrait déstabiliser l'Europe. Des manifestations ont éclaté dans tout le pays, les partisans de la CDU et du Parti libre-démocrate (FDP) dénonçant ce qu'ils appellent un « coup d'État électoral ». Alors que les tensions montent, Reimann proclame cela comme « l'aube d'une nouvelle Allemagne », plaçant la nation sur une voie incertaine et profondément source de divisions."
 Reimann.0.a: "Des extrémistes rouges à la tête de l'Allemagne ? Nous venons de nous débarrasser des Brown."
 Reimann.0.b: "Merveilleux!"
 Reimann.0.c: "Le socialisme unifiera l'Allemagne."
 
 Reimann.1.d: "Sur une place animée de Francfort, Max Reimann est monté sur le podium, flanqué des drapeaux du KPD et du nouveau drapeau allemand bien en évidence derrière lui. Même s'il était intérieurement inquiet des circonstances entourant la victoire contestée de son parti, il respirait le calme et la détermination. Il comprenait la nécessité de projeter une confiance inébranlable auprès de la foule rassemblée de fonctionnaires du parti, de militants de l'opposition et de membres de la presse.\n\nReimann a commencé son discours par une déclaration qui a résonné à travers la place, sa voix ferme et claire alors qu'il souhaitait la bienvenue aux participants dans un nouveau chapitre pour l'Allemagne. Il a qualifié ce moment de tournant, soulignant la promesse de prospérité et d'inclusion sous le nouveau gouvernement. La légitimité de l'accession au pouvoir du KPD est intouchable, soulignant que sa victoire n'a pas été obtenue par la révolution, mais par le processus démocratique des urnes. Il a déclaré que l'Allemagne se débarrasserait des chaînes de l'impérialisme occidental et tracerait une voie indépendante, guidée par les besoins du peuple allemand plutôt que par les influences extérieures des entreprises ou des dictatures.\n\nAlors que Reimann terminait son discours, la place a éclaté sous les applaudissements, le public embrassant désormais pleinement la vision qu'il avait exposée. Avec un signe de tête ferme à la foule, il s'est éloigné du podium, consultant immédiatement ses conseillers sur les prochaines étapes du nouveau gouvernement."
 Reimann.2.d: "\"IMPÉRIALISME!\"\n\nLa pièce résonna tandis que Reimann frappait du poing le bureau. Ses ministres et ses proches conseillers ont levé les yeux, certains choqués, d'autres non.\n\nReimann a soutenu que la Loi fondamentale avait été rédigée par les forces bourgeoises, dictée par les puissances occupantes occidentales, approuvée sans discussion par le Bundestag et imposée à la population sans son consentement. Maintenant que le KPD a remporté les élections, avec un peu d'aide, nous affirmons que nous pouvons résoudre ce problème et rendre le gouvernement plus représentatif du prolétariat et de ses intérêts, au lieu de s'agenouiller devant les exigences des conservateurs et des commandants militaires occidentaux.\n\nGénérant des applaudissements dans la salle, Reimann sourit légèrement, sa colère diminuant pour le moment. Le gouvernement devait se mettre au travail."
 Reimann.3.d: "Treize hommes et deux femmes étaient assis dans une pièce terne, beige, presque sans fenêtre, de la Chancellerie. La plupart savaient pourquoi ils étaient là, mais quelques-uns semblaient perdus. Tout serait clair lorsque le chancelier Reimann entrerait dans la pièce, flanqué de quelques collaborateurs.\n\n Il a salué les gens et leur a expliqué qu'ils étaient réunis dans un but crucial : former une commission des affaires constitutionnelles pour résoudre le problème de l'actuelle Loi fondamentale fantoche. Ils ont tous été sélectionnés pour leur expérience juridique et politique, et leur aide dans ce domaine sera une priorité vitale pour l'avenir de la République fédérale. Il a en outre affirmé que la « Loi fondamentale » actuelle est inadaptée à nos besoins et sert de forme de gouvernement fantoche permettant à nos suzerains américains et alliés de dicter la politique au peuple allemand. Une alternative est nécessaire, et nous en avons besoin rapidement.\n\n Un spécialiste a affirmé que le moyen le plus simple d'y parvenir sans compromettre le soutien du public serait d'apporter des amendements sélectifs à la Loi fondamentale actuelle et de maintenir un langage démocratique.\n\n Un autre a suggéré qu'il existe une meilleure façon de procéder, à savoir une refonte complète de la Loi fondamentale pour en faire un document purement socialiste. De cette façon, il ne pourrait y avoir aucun argument juridique pour s'opposer à notre régime et, même si nous aliénons une partie du public, il sera nécessaire de consolider notre contrôle.\n\nLes murmures ont commencé alors que tous les membres se déplaçaient sur leurs sièges, essayant de prendre une position ou une autre, ou de faire valoir un point.\n\nNous pourrons débattre des subtilités plus tard, mais comment devrions-nous procéder à partir de maintenant ?"
 Reimann.4.d: "DESTINATAIRE : Bureau de la Chancellerie\nDE : Commission fédérale des affaires constitutionnelles\nOBJET : Propositions d'amendements à la Loi fondamentale\n\nMonsieur le Chancelier,\n\nVous trouverez ci-dessous plusieurs propositions d'amendements et de modifications à la Loi fondamentale actuelle, conçues pour refléter le nouveau gouvernement tout en conservant le consensus et le langage démocratiques.\n\n1. Modifier le libellé de l'article 20 pour dire : « La République fédérale d'Allemagne est un État socialiste démocratique et consensuel.\n\n2. Supprimer le paragraphe (2) de l'article 21, relatif à l'inconstitutionnalité des partis politiques qui « cherchent à porter atteinte ou à abolir l'ordre fondamental libre et démocratique ».\n\n3. Supprimer les articles 42 à 45 ; qui concernent les pouvoirs du Bundestag, notamment les réunions publiques, les commissions d'enquête et la nomination d'une commission permanente de surveillance.\n\n4. Supprimer les articles 50 à 53, dissolvant le Bundesrat et créant un Présidium ou Comité central composé de tous les dirigeants de l'État et présidé par le Chancelier.\n\n5. Supprimer les articles 66 à 69 de la Loi fondamentale, relatifs aux pouvoirs du Chancelier fédéral, et les remplacer par des dispositions interdisant un vote de censure et permettant au Chancelier de former un gouvernement d'urgence à tout moment.\n\n6. Modifier le paragraphe (2) de l'article 79 pour « exiger l'approbation de la majorité simple du Bundestag », en supprimant la majorité qualifiée des deux tiers.\n\nNous espérons que ces changements ne seront que le début d'un ensemble de mesures visant à réformer la Loi fondamentale pour refléter la volonté du peuple."
 Reimann.5.d: "DESTINATAIRE : Bureau de la Chancellerie\nDE : Commission fédérale des affaires constitutionnelles\nOBJET : Proposition de nouvelle Constitution socialiste\n\nMonsieur le Chancelier,\n\nVous trouverez ci-dessous plusieurs propositions générales de sujets dans une nouvelle constitution pour la République fédérale.\n\n1. Les droits et principes socialistes inaliénables du citoyen commun, y compris la liberté d'expression des principes socialistes et la liberté d'association, d'emploi, de soins de santé et de rémunération équitable.\n\n2. Affirmer le leadership et la sagesse du Parti communiste allemand (KPD) dans toutes les affaires gouvernementales et du parti\n\n3. Structurer le gouvernement pour remplacer le Cabinet fédéral par un Conseil des ministres dirigé par le Premier secrétaire du KPD ainsi qu'un Conseil d'État exécutif, dirigé par un Premier ministre.\n\n4. Remplacer les Länder par des comités provinciaux, dirigés par les dirigeants du parti KPD dans ces Länder, qui dépendent du gouvernement fédéral central.\n\n5. Autoriser le développement d'une armée d'autodéfense à partir des forces occidentales, y compris les forces terrestres, navales et aériennes.\n\n6. Réaffirmer les liens étroits avec l'Union soviétique, tous les pays communistes et le socialisme en général.\n\nCes idées de base servent à fournir un cadre à des réglementations plus spécifiques sur le fonctionnement et la structure du nouvel État."
 Reimann.6.d: "La Commission fédérale des affaires constitutionnelles participait à l'une de ses réunions habituelles et, après avoir décidé de réécrire entièrement la Loi fondamentale pour en faire une loi proprement socialiste, elle s'est retrouvée plongée dans un âpre débat : quel type de langage utiliser dans ce nouveau document. Reimann a essayé de garder le débat civil, mais les membres se sont quand même criés dessus.\n\n « Pour séduire les partis d'opposition, nous devons conserver un semblant d'ordre démocratique... »\n \"Espèce d'imbécile ! Marx n'aurait jamais permis à l'influence bourgeoise de s'infiltrer dans une constitution socialiste !\"\n \"Sinon, ce document ne peut pas être adopté ! Nous devons le faire correctement, après tout !\"\n\nReimann rétorqua : \"Messieurs, messieurs, s'il vous plaît. Inutile de vous chamailler. Nous devons maintenir le caractère sacré d'un État socialiste et nous inspirer de nos camarades russes. Cependant, votre argument selon lequel les forces d'opposition doivent être incluses est également pertinent, aussi malheureux que cela puisse être. Allons-nous voter sur la manière dont cette constitution devrait être formulée ?\""
 Reimann.7.d: "Dans un grand bureau faiblement éclairé du siège de la CDU à Bonn, Adenauer feuilletait ses papiers et ses documents d'information. Même si le gouvernement du KPD, quel qu'il soit élu, avait tenté de réprimer la presse ouest-allemande, il n'avait pas eu beaucoup de succès auprès d'un corps de journalistes bien établi. De nombreuses histoires et fuites émanant du personnel ont réussi à passer au crible des censeurs et des porte-parole du gouvernement.\n\nSur la première page, en gros caractères gras, on pouvait lire le titre « LE GOUVERNEMENT PROPOSE UNE NOUVELLE CONSTITUTION ».\n\nAdenauer a regardé cela avant de frapper du poing sur le bureau, ce qui a incité un assistant et plusieurs autres responsables de la CDU à se précipiter. « Qu'est-ce que cela signifie ? Adenauer a crié avec colère.\n\n \"Monsieur, il semble qu'ils veulent rédiger une nouvelle constitution socialiste, pour refléter la nouvelle composition de leur gouvernement-\"\n\n \"Nous devons nier et condamner cette action, la boycotter à tout prix ! La Loi fondamentale ne peut être violée ! Ces communistes-\"\n\n \"Oui, monsieur. Les Alliés ne sont pas contents ; en fait, ils comptent sur la CDU pour galvaniser le soutien contre elle, mais cela semble quelque peu improbable face à leur soutien croissant.\"\n\n \"Faites tout ce qu'il faut pour arrêter ça, et je veux dire tout ce qu'il faut.\"\n\n \"Oui Monsieur.\""
 Reimann.8.d: "À : Tous les départements et ministères\nDE : Bureau de la Chancellerie\nOBJET : Bureau fédéral du plan\n\nPour tous les officiels,\n\nLe Bureau fédéral du Plan se substitue dès maintenant à toutes les tâches économiques et financières du gouvernement fédéral. Les responsabilités du Bureau sont les suivantes :\n\n1. Assumer le contrôle administratif de toutes les entreprises publiques, actuelles ou futures, y compris les ressources naturelles, l'industrie manufacturière et les infrastructures.\n\n2. Coordonner les plans quinquennaux à l'échelle nationale et maintenir l'efficacité dans tous les aspects de l'économie\n\n3. Assurer la liaison avec d'autres pays socialistes pour déterminer les meilleurs plans d'action en matière de planification économique et d'industrialisation.\n\nCes trois suggestions constituent le cadre de base du Bureau, qui est constitué sous ma signature et commencera ses opérations dans les plus brefs délais.\n\nSIGNÉ\nChancelier Max Reimann"
 Reimann.9.d: "Les réunions du cabinet de Reimann étaient parfois bruyantes, parfois calmes, avec l'accord de tous les membres. Ce matin, réuni avec d'autres experts du Bureau fédéral du Plan, c'était un exemple de la première.\n\n « Pourquoi devrions-nous accepter les pots-de-vin et les cadeaux occidentaux ? » a demandé un ministre, plutôt incrédule.\n\n \"Je suis sûr que le chancelier Reimann serait d'accord avec moi ; nous avons besoin de toute l'aide que nous pouvons obtenir dès maintenant, que ce soit de l'Est ou de l'Ouest. Les États-Unis pourraient retirer nos fonds à l'avenir si nous n'acceptons pas cette offre maintenant, l'argent pourrait disparaître.\"\n\nReimann regarda l'homme, le vice-président du Bureau fédéral du plan. \"Votre argument est solide, et c'est peut-être une façon pour nous de paraître amicaux envers l'Occident tout en recevant des fonds et en les utilisant pour la planification centrale et la poursuite de l'industrialisation afin de soutenir notre mission socialiste.\"\n\nLe premier ministre a rétorqué : \"Monsieur, êtes-vous vraiment prêt à sacrifier vos principes idéologiques pour des tonnes d'argent ? Vous ne semblez pas meilleur que les sales capitalistes et impérialistes contre lesquels nous nous battons !\"\n\nCela a plongé la pièce dans le chaos, mais une décision a dû être prise rapidement, et vite."
 Reimann.10.d: "BONN, Allemagne de l'Ouest (AP) - Aujourd'hui, le président du Parti communiste et chancelier fédéral nouvellement élu, Max Reimann, a condamné le statut d'occupation alliée comme « un document fantoche impérialiste et colonialiste destiné à empêcher le gouvernement allemand légitime de faire la volonté du peuple ». Faire cette déclaration lors d'une réunion du Parti communiste allemand (KPD), le parti communiste ouest-allemand financé par Moscou ; Reimann a souligné l'importance d'être indépendant et d'avoir une véritable autodétermination pour la nouvelle République fédérale dans toutes les affaires, y compris en apportant des modifications à la Loi fondamentale et à d'autres formes de gouvernement. Les puissances occidentales, pressées de commenter, ont toutes prononcé des condamnations similaires à l'encontre de Reimann, le haut-commissaire américain pour l'Allemagne, John McCloy, répondant que Reimann n'est « rien de plus qu'une marionnette du Kremlin, élu frauduleusement et non par la volonté du peuple allemand ». Les réactions du bloc de l'Est ont été généralement modérées, mais les rapports du Kremlin indiquent que les dirigeants soviétiques semblent globalement satisfaits de la situation actuelle en Allemagne de l'Ouest."
 Reimann.11.d: "Il était midi lorsque l'avion apparemment présidentiel de la République fédérale, un vieux De Havilland Comet utilisé par les forces d'occupation britanniques, arrivait pour atterrir à l'aéroport international de Vnukovo, près de Moscou, et atterrissait en douceur sur le tarmac.\n\nEn descendant de l'avion au milieu d'un orchestre militaire et d'une garde d'honneur composée de soldats soviétiques, Reimann sourit en descendant les escaliers, saluant les porte-drapeaux qui jouaient l'hymne national allemand ainsi que l'hymne national soviétique. Serrant la main de ce qu'il présumait être l'un des collaborateurs de Staline, lui et sa délégation montèrent dans une berline noire, se dirigeant à toute vitesse vers le centre-ville de Moscou et le Kremlin.\n\nUne heure ou deux plus tard, après avoir vu des immeubles d'habitation plus ternes qu'il ne pouvait en compter, ils arrivèrent au Kremlin et furent immédiatement précipités dans le complexe, sortant et traversant les couloirs pour atteindre le bureau du secrétaire général du Parti communiste de l'Union soviétique, Joseph Staline.\n\nEn entrant dans le bureau et en serrant la main de Staline, Reimann sentit immédiatement la présence d'une figure presque divine, qui souriait et maintenait son humilité avec un homme tel que Reimann. Les hommes ont discuté brièvement, partageant des plaisanteries, Staline complimentant Reimann pour avoir fait élire son mouvement communiste à un poste fédéral. Avant de poser pour des photos et de serrer à nouveau la main, Reimann a été reconduit hors du complexe du Kremlin, avec un sentiment de supériorité en lui."
 Reimann.12.d: "Finalement, après des mois et des mois de délibérations et de controverses, le Bundestag, composé principalement de membres du KPD et de membres radicaux du SPD avec leur opposition CDU, s'est mis d'accord sur une nouvelle loi fondamentale. Qualifiant l'ancien document de « chaînes impérialistes », la Commission fédérale des affaires constitutionnelles a décidé entre modifier le document actuel ou en rédiger un nouveau, et après ce délai, la loi et son contenu ont été finalisés. Fortement condamnée et combattue à mort par l'opposition CDU et les autres autorités professionnelles et militaires occidentales, la nouvelle Loi fondamentale devrait restructurer complètement tous les aspects de la vie gouvernementale, civique et sociale de l'Allemagne de l'Ouest, en particulier en faveur du Parti communiste allemand."
 Reimann.13.d: "À : Bundeskanzleramt\nDE : Inspecteur général de la Bundesgrenzschutz\nOBJET : État des forces armées et rôle des militaires\n\nChancelier,\n\nSur la base d'un examen actuel du Bundesgrenzschutz (Garde-frontières fédéral) mené par mon bureau, nous avons déterminé que le BGS est totalement déséquipé et sous-financé pour fournir une assistance militaire en cas de crise gouvernementale ou géopolitique impliquant l'Allemagne. Quoi qu'il en soit, les recommandations suivantes sont proposées comme un moyen de faire du BGS une force militaire capable de répondre aux besoins de la nation.\n\n1. Formation de composantes navales et aériennes de l'armée comme moyen de protéger la côte nord et les voies navigables intérieures de l'Allemagne ainsi que d'assurer une couverture aérienne de la nation, enlevant ces responsabilités au BGS.\n\n2. Faire l'objet d'achats massifs d'équipements auprès de l'Union soviétique, tels que des chars T-54, des chasseurs MiG-15 et d'autres avions, ainsi que certains équipements navals.\n\n3. Renforcer les politiques de conscription, ainsi qu'introduire un enseignement militaire davantage fondé sur une base idéologique, y compris l'importance de servir son pays.\n\nJ'espère que cela permettra à nos militaires de retrouver un niveau de puissance sans précédent, pour la protection de notre pays et de nos intérêts."
 Reimann.14.d: "Boum boum boum.\n\nLe juge a posé son marteau sur l'estrade, ordonnant ainsi le procès pénal contre l'ancien SS-Standartenführer Friedrich Stahl. Avec des caméras de télévision positionnées dans toute la pièce, Stahl se tenait, enchaîné, dans une chambre vitrée, entouré de deux gardes armés du BGS avec des pistolets dans leurs étuis et des bandes MP sur les bras.\n\nLe juge parla d'une voix forte et retentissante. \"Herr Stahl, vous avez été inculpé par la République fédérale d'Allemagne pour actions contre le peuple allemand, trahison et crimes contre l'humanité. Par le pouvoir qui m'a été conféré par la volonté du peuple allemand, je vous déclare coupable de toutes les accusations et vous condamne à l'exécution par peloton d'exécution, tout comme vous l'avez fait avec ces Juifs allemands pendant la guerre. Affaire ajournée.\"\n\nBoum boum boum. L'avant de la vitrine s'est ouvert et poussé, Stahl a été traîné par les deux agents du BGS hors de la salle d'audience jusqu'à une zone de détention où il serait bientôt emmené pour être exécuté. L'arrière de la vitrine s'est ouvert et un autre ancien officier SS, le SS-Standartenführer Hans Ehrler, a été poussé à l'intérieur.\n\n « Herr Ehrler, vous avez été inculpé par la République fédérale d'Allemagne pour des actions contre le peuple allemand... »"
 Reimann.15.t: "Un deuxième Kulturkampf"
 Reimann.15.d: "« L'Allemagne est aujourd'hui un foyer de décadence, tout comme l'Occident ! »\n\nDans la grande brasserie Mathaser de Munich, la voix tonitruante de Reimann résonnait, cette première déclaration ne suscitant que peu d'applaudissements. Ce point était évidemment sans objet, puisque l'Allemagne était encore une ruine quelque peu fumante, avec peu de décadence en dehors des bases militaires occidentales. Peut-être autre chose, pensa-t-il.\n\n \"La décadence et les abus culturels que nous a infligés le gouvernement national-socialiste avant nous ont été désastreux. Nous devons nous lancer dans une nouvelle lutte culturelle, un \"kulturkampf\" pour ramener l'Allemagne dans une nouvelle ère de révolution culturelle et de compréhension !\" Cela a suscité un peu plus d'applaudissements, mais Reimann savait que le public avait besoin de plus, d'une accroche.\n\n \"Les relations du gouvernement précédent avec l'Église catholique romaine, une organisation dissidente bourgeoise, anticommuniste et antisocialiste, ont révélé leurs véritables tendances. Des centaines, voire des milliers de nos frères ont été arrêtés, torturés ou tués par le gouvernement nazi et aidés par l'Église catholique romaine et le Vatican ! Même maintenant, l'or nazi est dans les coffres du Pape ! Notre gouvernement va s'attaquer à ce problème, prendre soin de l'Église pour empêcher son ingérence dans nos affaires intérieures et dans celles-ci. De notre peuple !\n\nEt c'est ainsi que tout a commencé, alors que Reimann s'éloignait, certains applaudissaient, d'autres non, mais peu importe, le « Neue Kulturkampf » allait commencer."
 
 Reimann.151.t: "Faire face aux anciens généraux de la Wehrmacht"
 Reimann.151.d: "La direction du KPD en Allemagne de l'Ouest est confrontée à une question décisive : les anciens généraux de la Wehrmacht doivent-ils être maintenus dans l'armée ou purgés ? Alors que les partisans de la ligne dure exigent leur destitution et leurs poursuites pour faire respecter les fondements antifascistes de l'État, les pragmatiques soulignent la nécessité de disposer de commandants expérimentés pour maintenir la force militaire dans un environnement de guerre froide. Certains affirment qu'une rééducation idéologique pourrait garantir leur loyauté, comme on l'a vu dans les forces de police d'Allemagne de l'Est, tandis que d'autres mettent en garde contre une potentielle subversion. Les conseillers soviétiques appellent à la prudence, craignant un affaiblissement de la défense, tandis que les réseaux anticommunistes résistent au contrôle du KPD. La décision reste incertaine, mais elle définira l'avenir des forces armées ouest-allemandes."
 Reimann.151.a: "Nous en avons besoin. Ils seront épargnés."
 Reimann.151.b: "Nous devons construire une armée idéologiquement propre."
 
 Reimann.152.t: "Une sensibilisation de la généralité ouest-allemande"
 Reimann.152.d: "Alors que le gouvernement du KPD resserre son emprise sur l'Allemagne de l'Ouest, les dirigeants conservateurs de l'armée deviennent de plus en plus alarmés. Craignant la transformation rapide du pays à la manière soviétique et les efforts en faveur de la réunification sous le régime marxiste, des officiers de haut rang ont discrètement contacté la Haute-Commission alliée pour obtenir du soutien. Des communications secrètes étaient envoyées à des contacts militaires à Washington, Londres et Paris, demandant de l'aide pour organiser un coup d'État visant à restaurer la gouvernance démocratique. Le cercle autour des anciens généraux de la Wehrmacht Hans Speidel, Adolf Heusinger et Reinhard Gehlen soutient que sans intervention immédiate, l'Allemagne de l'Ouest sera définitivement perdue au profit du bloc de l'Est. Ils attendent désormais une réponse, sachant que toute hésitation pourrait signifier la consolidation du régime communiste et l'effondrement irréversible de la résistance pro-occidentale."
 Reimann.152.a: "Un espoir ? Une chance."
 
 Reimann.16.d: "En entrant dans l'Altes Stadthaus situé à Berlin-Est, Reimann était nerveux. Il ne savait pas vraiment pourquoi ; après tout, cette conférence n'était qu'une formalité. Alors que l'approbation du KPD en Allemagne de l'Ouest était au mieux modérée, il voyait une loyauté plus claire envers le Parti socialiste unifié de l'Allemagne de l'Est ; probablement à cause des années d'occupation soviétique. Il a eu de nombreux appels téléphoniques et lettres avec le secrétaire général du Comité central du SED, Herr Walter Ulbricht, mais ses collaborateurs ont eu davantage de communications avec les dirigeants qu'il devait rencontrer aujourd'hui, dans ce qu'on appelle la « Conférence de Berlin ».\n\nAssis dans une salle de réunion, Reimann a finalement eu l'occasion de rencontrer les autres responsables est-allemands ; principalement le président du Conseil des ministres, Otto Grotewohl ; et le président de la République, Wilhelm Pieck ; avec d'autres ministres inférieurs, des responsables du SED et une petite coterie de représentants soviétiques. La délégation de Reimann était plutôt petite, car il essayait de faire profil bas lors de son voyage à Berlin-Est afin de ne pas trop attirer l'attention de l'Occident.\n\n \"Merci à tous de nous avoir permis de venir ici à Berlin-Est aujourd'hui. Je dois dire que c'est une ville magnifique et un exemple parfait du rêve socialiste que nous devons tous promouvoir.\"\n\n \"Merci, Chancelier Reimann. Nous tous, ainsi que le peuple d'Allemagne de l'Est, partageons le profond espoir que cette conférence puisse être bénéfique et aboutir à une réunification pacifique de la nation allemande sous les idéaux socialistes.\"\n\n \"Oui, mon gouvernement et le peuple de l'Allemagne de l'Ouest sont d'accord. Maintenant, allons-nous passer aux choses sérieuses ?\"\n\nEt avec cela, les jours de négociation allaient commencer."
 Reimann.17.d: "Après des semaines et des semaines de négociations et de râles sur les détails de l'accord, et après avoir soigneusement évité les zones d'occupation occidentales de Berlin, la délégation ouest-allemande de Reimann et la délégation gouvernementale est-allemande étaient prêtes à signer l'accord. Même si Reimann détestait l'autoriser, un groupe de correspondants de la presse internationale se trouvait au palais de Schönhausen, la résidence du président est-allemand, pour couvrir la signature du traité d'unification.\n\nAlors que les flashs s'éclairaient, les journalistes de tous les pays, moitié de l'Ouest et moitié de l'Est, regardèrent Reimann, le secrétaire général de l'Allemagne de l'Est Walter Ulbricht et le maréchal soviétique Andrei Grechko, commandant du groupe des forces soviétiques en Allemagne, s'asseoir à une longue table, avec trois exemplaires du Traité d'unification [GetYear] devant eux.\n\nAprès avoir prononcé quelques mots, les trois hommes ont pris la plume et signé leurs copies, les faisant circuler. La presse a continué à prendre des photos et à poser des questions, tandis que Reimann, Ulbricht et Grechko posaient pour des photos.\n\nUn instant plus tard, l'un des assistants de Reimann se pencha pour lui murmurer quelque chose à l'oreille.\n\nLe visage de Reimann se tordit lorsque son stylo tomba de sa main, atterrissant sur une copie du traité et commençant à tacher, saignant à travers le papier. Regardant Ulbricht et Grechko, puis la presse, Reimann se leva, attrapa son assistant et se précipita hors de la pièce."

 Reimann.171.t: "Le [GetYear] Traité d'unification allemand"
 Reimann.171.d: "Après des semaines et des semaines de négociations et de râles sur les détails de l'accord, et après avoir soigneusement évité les zones d'occupation occidentales de Berlin, la délégation ouest-allemande de Reimann et la délégation gouvernementale est-allemande étaient prêtes à signer l'accord. Même si Reimann détestait l'autoriser, un groupe de correspondants de la presse internationale se trouvait au palais de Schönhausen, la résidence du président est-allemand, pour couvrir la signature du traité d'unification.\n\nAlors que les flashs s'éclairaient, les journalistes de tous les pays, moitié de l'Ouest et moitié de l'Est, regardèrent Reimann, le secrétaire général de l'Allemagne de l'Est Walter Ulbricht et le maréchal soviétique Andrei Grechko, commandant du groupe des forces soviétiques en Allemagne, s'asseoir à une longue table, avec trois exemplaires du Traité d'unification [GetYear] devant eux.\n\nAprès avoir prononcé quelques mots, les trois hommes ont pris la plume et signé leurs copies, les faisant circuler. La presse a continué à prendre des photos et à poser des questions, tandis que Reimann, Ulbricht et Grechko posaient pour des photos.\n\nPlus tard, les trois grands se sont assis à la table et ont officiellement signé le Traité d'unification. Les acclamations de joie des soldats soviétiques et allemands en poste retentissent dans la salle. Tandis que des masses de citoyens allemands envahissent les rues, les familles sont réunies et les ennemis d'hier redeviennent les ennemis d'aujourd'hui, alors que les soldats de la Bundesgrenzschutz traversent la frontière en courant vers leurs homologues de la Volkspolizei, partageant diverses boissons alcoolisées et célébrant la réunification de leur patrie bien-aimée."
 Reimann.171.a: "Deutschland einig Vaterland.."
 Reimann.171.b: "Deutschland einig Vaterland.."
 
 Reimann.172.t: " [GetNewspaperHeader] La réunification de l'Allemagne"
 Reimann.172.d: "Après des semaines et des semaines de négociations et de râles sur les détails de l'accord, et après avoir soigneusement évité les zones d'occupation occidentales de Berlin, la délégation ouest-allemande de Reimann et la délégation gouvernementale est-allemande étaient prêtes à signer l'accord. Même si Reimann détestait l'autoriser, un groupe de correspondants de la presse internationale se trouvait au palais de Schönhausen, la résidence du président est-allemand, pour couvrir la signature du traité d'unification.\n\nAlors que les flashs s'éclairaient, les journalistes de tous les pays, moitié de l'Ouest et moitié de l'Est, regardèrent Reimann, le secrétaire général de l'Allemagne de l'Est Walter Ulbricht et le maréchal soviétique Andrei Grechko, commandant du groupe des forces soviétiques en Allemagne, s'asseoir à une longue table, avec trois exemplaires du Traité d'unification [GetYear] devant eux.\n\nAprès avoir prononcé quelques mots, les trois hommes ont pris la plume et signé leurs copies, les faisant circuler. La presse a continué à prendre des photos et à poser des questions, tandis que Reimann, Ulbricht et Grechko posaient pour des photos.\n\nPlus tard, les trois grands se sont assis à la table et ont officiellement signé le Traité d'unification. Les acclamations de joie des soldats soviétiques et allemands en poste retentissent dans la salle. Tandis que des masses de citoyens allemands envahissent les rues, les familles sont réunies et les ennemis d'hier redeviennent les ennemis d'aujourd'hui, alors que les soldats de la Bundesgrenzschutz traversent la frontière en courant vers leurs homologues de la Volkspolizei, partageant diverses boissons alcoolisées et célébrant la réunification de leur patrie bien-aimée."
 Reimann.172.a: "Comment cela a-t-il pu arriver ?"
 Reimann.172.b: "Unification des camarades."
 Reimann.172.c: "Nur Zusammen."
 
 Gehlen.20.t: " [GetNewspaperHeader] Coup d'État militaire en Allemagne de l'Ouest"
 Gehlen.20.d: "Suite à la montée du Parti communiste allemand et à la transformation ultérieure de la structure constitutionnelle de l'Allemagne de l'Ouest en un système socialiste, la réunification éventuelle entre l'Allemagne de l'Est et l'Allemagne de l'Ouest a été interrompue, en raison d'un cercle secret d'anciens officiers de la Wehrmacht et de politiciens conservateurs, complotant en secret contre le gouvernement de Reimann pendant des années depuis le Bundestagwahl de 1949. Alors qu'ils visitaient le palais de Schönhausen à Berlin-Est pour signer le traité d'unification, les militaires ont pris le pouvoir à Bonn, remplaçant les communistes locaux. Bureaucrates et responsables de l'armée et dénonçant le gouvernement KPD-SPD comme étant illégitime. Reinhard Gehlen, ancien responsable de l'espionnage de la Wehrmacht et fondateur de l'Organisation Gehlen, a été élu représentant du gouvernement militaire par ses collègues, faisant office de chef d'État provisoire jusqu'à ce qu'un nouveau gouvernement puisse être élu."
 Gehlen.20.a: "J'ai un mauvais pressentiment à ce sujet."
 
 Gehlen.22.t: "Vents de changement au ministère des Affaires étrangères."
 Gehlen.22.d: "Ce jour ne ressemblait à aucun autre que les responsables du ministère des Affaires étrangères aient vu. Villa Ingenohl, siège du ministère des Affaires étrangères, travaille sans relâche depuis quatre ans pour isoler l'Allemagne de l'Occident et la vendre aux tyrans communistes du bloc de l'Est. L'intégration européenne, la gestion modérée du conflit germano-allemand, le renforcement de la coopération américaine ainsi que le retour des prisonniers de guerre allemands disparus seront désormais les promesses politiques clés de la législation allemande. Entrons à nouveau sur la scène internationale et rétablissons la souveraineté allemande pour qu'elle soit à nouveau considérée comme une égale parmi les puissances européennes."
 Gehlen.22.a: "Mieux vaut le faire."
 
 Gehlen.23.t: "Le tribunal militaire interdit le KPD"
 Gehlen.23.d: "Le tribunal militaire a officiellement interdit le Parti communiste allemand (KPD), le jugeant inconstitutionnel en raison de ses objectifs antidémocratiques et de son alignement avec la RDA sous contrôle soviétique, ainsi que de sa tentative de trahir la patrie et de la vendre au bloc occidental. Cette décision marque la fin définitive du KPD institutionnel, fondé en 1918, qui luttait constamment pour saper la démocratie ouest-allemande et imposer une dictature socialiste selon les ordres du Komintern à Moscou.\n\nAvec cette décision, toutes les activités, actifs et publications du KPD sont désormais interdits. L'opposition du parti à l'intégration à l'OTAN et au réarmement de l'Allemagne de l'Ouest, ainsi que ses liens avec les renseignements est-allemands et le Politbüro, ont joué un rôle crucial dans la décision du tribunal. De nombreux anciens membres du KPD devraient soit entrer dans la clandestinité, rejoindre d'autres groupes de gauche, soit s'installer en Allemagne de l'Est, où le parti au pouvoir, le SED, continue d'étendre son contrôle. Des efforts ont été déployés pour contenir le leader du KPD, Max Reimann, mais étant donné qu'il est resté à Hohenschönhausen, après la conférence sur le traité illégitime de réunification de 1953, il est impossible pour l'instant de le traduire en justice. Reimann reste à Berlin-Est, dirigeant le KPD et ce qui reste de là."
 Gehlen.23.a: "Bon débarras."
 
 Gehlen.24.t: "La question de l'hymne national"
 Gehlen.24.d: "Notre campagne visant à construire une nouvelle identité allemande basée sur le patriotisme fonctionne. Mais cela soulève une nouvelle question : quel est notre hymne national ? La solution actuelle, qui consiste à ne chanter que le troisième couplet du Deutschlandlied, semble à beaucoup faible et incomplète. Il est temps de prendre une décision.\n\nUne option consiste à restaurer l'intégralité du Deutschlandlied. Les partisans disent que la chanson est un appel à l'unité allemande, pas à la conquête, et que nous devrions chanter les trois couplets avec fierté pour récupérer notre héritage.\n\nUne autre idée, appréciée des vétérans de l'armée, est d'adopter \"Die Wacht am Rhein\". Cette chanson classique est plus militariste et parle de défense de la nation. Le problème est que ses paroles sont dirigées contre les Français, ce qui nuirait gravement aux relations avec nos nouveaux alliés.\n\nUne dernière option surprenante consiste à utiliser une version réécrite de l'hymne est-allemand, « Auferstanden aus Ruinen » (« Ressuscité des ruines »). Si l'on supprime les paroles communistes, la chanson est un symbole puissant de la façon dont l'Allemagne se reconstruit toujours. Ce serait un nouveau départ, libéré du bagage du passé."
 Gehlen.24.a: "Deutschland, Deutschland über Allem.."
 Gehlen.24.b: "C'est un Ruf comme Donnerhall !"
 Gehlen.24.c: "Auferstanden aus Ruinen und der Zukunft zugewandt.." 
 
 Gehlen.25.t: "Rejoindre la CECA ?"
 Gehlen.25.d: "Ratifiée par les gouvernements du Benelux, de l'Italie et de la France, la Communauté européenne de l'acier et du charbon vise à unir le secteur de l'industrie lourde d'Europe occidentale en un seul organisme supranational dirigé collectivement par les signataires du Traité afin de mettre fin à une production d'armements agressive et vitale qui pourrait entraîner une autre grande guerre en Europe. Grâce à une coordination et des efforts combinés, une structure de sécurité européenne commune peut être formée, adaptée à la richesse et à la prospérité, mais également face à l'éventuelle menace d'agression soviétique.\n\nL'adhésion au Traité CECA renforcerait considérablement notre renommée et notre crédibilité dans le monde occidental. Cependant, la majeure partie de la population allemande fait encore preuve d'une grande méfiance à l'égard des Alliés occidentaux, en particulier de la France, qui se présente comme l'initiatrice du Traité mais est considérée par la plupart des politiciens comme un marionnettiste cherchant à contrôler les industries européennes et à amener l'occupation de l'Allemagne à un autre niveau. Heinrich Hellwege l'a décrit comme une « deuxième occupation de la Ruhr, déguisée en traité multilatéral ».\n\nIl est temps de choisir."
 Gehlen.25.a: "Pour la paix et la prospérité en Europe."
 Gehlen.25.b: "Nous ne sommes pas prêts à un tel engagement."
 
 Gehlen.26.t: "L'Allemagne de l'Ouest rejoint la Communauté européenne du charbon et de l'acier"
 Gehlen.26.d: "Après la création de la CECA, divers hommes politiques, notamment les communistes et les loyalistes de De Gaulle, ont affirmé que le projet était voué à l'échec sans l'Allemagne de l'Ouest. Le gouvernement communiste de Max Reimann s'est distancié de toute institution occidentale et a condamné le traité comme étant « un impérialisme occidental cherchant à saper la souveraineté allemande ».\n\nCependant, avec le départ de Reimann et son remplacement par le gouvernement militaire de Gehlen, la position ouest-allemande a changé sur cette question. Cherchant la coopération et le rétablissement de la confiance plutôt que la confrontation, Bonn a envoyé un envoyé à Paris, s'excusant du retard concernant l'intégration européenne, déclarant qu'ils aimeraient participer à la CECA, non seulement pour le bien de la richesse et de la prospérité, mais aussi pour la paix et l'ordre en Europe occidentale."
 Gehlen.26.a: "Magnifique."
 
 Gehlen.27.t: "L'Allemagne de l'Ouest retarde son entrée dans la CECA"
 Gehlen.27.d: "Après la création de la CECA, divers hommes politiques, notamment les communistes et les loyalistes de De Gaulle, ont affirmé que le projet était voué à l'échec sans l'Allemagne de l'Ouest. Le gouvernement communiste de Max Reimann s'est clairement distancié de toute institution occidentale et a condamné le traité comme étant un « impérialisme occidental cherchant à saper la souveraineté allemande ».\n\nCependant, avec le départ de Reimann et son remplacement par le gouvernement militaire de Gehlen, la position ouest-allemande a effectivement changé sur cette question. Cherchant la coopération et le rétablissement de la confiance plutôt que la confrontation, Bonn a récemment envoyé un envoyé à Paris, s'excusant du retard concernant l'intégration européenne. L'envoyé a déclaré qu'ils souhaiteraient participer à la CECA, non seulement pour le bien de la richesse et de la prospérité, mais aussi pour la paix et l'ordre en Europe occidentale.\n\nNéanmoins, malgré ces sentiments favorables et le changement apparent de politique, l'Allemagne de l'Ouest a affirmé qu'elle n'était « pas encore prête à un tel engagement ». Le message de Bonn implique que même si l'ambition est là, les priorités immédiates du pays résident dans la stabilité interne et la poursuite de la reprise. Même si Paris reconnaît ce changement de ton, la CECA doit pour l'instant procéder sans l'intégration complète et immédiate de l'industrie lourde ouest-allemande."
 Gehlen.27.a: "Allemands..."

 Gehlen.28.t: " [GetNewspaperHeader] L'Allemagne de l'Ouest rejoint la Communauté européenne du charbon et de l'acier"
 Gehlen.28.d: "Après la création de la CECA, les critiques, des communistes aux loyalistes de De Gaulle, ont mis en garde contre son échec sans l'Allemagne de l'Ouest. Le gouvernement communiste de Max Reimann avait farouchement condamné le traité en le qualifiant d'« impérialisme occidental » et avait rejeté toutes les institutions occidentales.\nAujourd'hui, avec le départ de Reimann et le gouvernement militaire de Gehlen au pouvoir, la position de l'Allemagne de l'Ouest a radicalement changé. Bonn a envoyé un envoyé à Paris, s'excusant pour les retards passés et exprimant un désir clair d'intégration européenne, citant des objectifs de richesse, de prospérité et de paix.\nAujourd'hui, ces intentions sont devenues réalité. Le gouvernement militaire de Gehlen a officiellement annoncé l'adhésion de l'Allemagne de l'Ouest à la Communauté européenne du charbon et de l'acier. Cette décision décisive met fin à une période d'isolement, intègre l'industrie lourde allemande dans la CECA et jette des bases plus solides pour la paix et la prospérité de l'Europe occidentale."
 Gehlen.28.a: "Merveilleux!"
 Gehlen.28.b: "Des imbéciles."
 Gehlen.28.c: "Freude schöner Götterfunken!"
 
 Gehlen.29.t: "Accueil de la conférence de Bielefeld"
 Gehlen.29.d: "L'ordre étant rétabli et la menace communiste fermement réprimée, le moment est venu pour l'Allemagne de recouvrer sa pleine souveraineté. Notre gouvernement militaire, dirigé par le Generaloberst Gehlen, a franchi une étape décisive : nous avons officiellement invité les puissances alliées à nous rencontrer à Bielefeld.\n\nL'objectif de ces pourparlers est clair et vital : négocier la fin complète et inconditionnelle de l'occupation alliée de notre nation. Nous pensons que l'Allemagne a prouvé sa stabilité et son engagement sans faille envers la cause occidentale. La présence de forces étrangères, bien qu'appréhendée dans son contexte historique, ne peut plus servir de symbole persistant de notre autonomie limitée. Il est temps pour nous d'être pleinement autonomes, libres de déterminer notre destin et de prendre la place qui nous revient et souverainement parmi les nations occidentales."
 Gehlen.29.a: "Envoyez les invitations !"
 
 Gehlen.30.t: "Une invitation de l'Allemagne de l'Ouest"
 Gehlen.30.d: "Une invitation inattendue est arrivée aujourd'hui de Bonn, alors que le gouvernement militaire ouest-allemand, dirigé par le Generaloberst Gehlen, a officiellement proposé une réunion avec les puissances alliées à Bielefeld. L'ordre du jour annoncé : discuter de la fin globale de l'occupation alliée de l'Allemagne de l'Ouest.\n\nCompte tenu des efforts de Gehlen et de ses associés pour renverser Maximillian Reimann et de leurs efforts pour intégrer davantage l'Allemagne de l'Ouest dans notre sphère, il est tout à fait naturel pour nous de faire preuve d'un certain respect et de suivre l'invitation de Bonn."
 Gehlen.30.a: "Écoutons ce qu'ils ont à dire."
 
 Gehlen.31.t: "Le début de la conférence"
 Gehlen.31.d: "Les délégués sont arrivés à Bielefeld et ont été accueillis par des défilés de citoyens locaux en liesse alors qu'ils se dirigeaient vers la mairie locale. Ils ont été accueillis par [WGR.GetLeader] et le ministre des Affaires étrangères Eugen Gerstenmaier avant de lever les drapeaux des membres de la haute-commission alliée. Dès l'entrée dans l'Hôtel de Ville, un grand buffet a été ouvert par le maire de Bielefeld, avant de laisser les diplomates vaquer seuls à leurs affaires dans les coulisses du bâtiment."
 Gehlen.31.a: "À propos de nos demandes..."
 Gehlen.31.b: "Un bel accueil."
 
 Gehlen.32.t: "L'ampleur de nos revendications"
 Gehlen.32.d: "Les Alliés sont arrivés à Bielefeld. Maintenant commence le débat interne crucial : quelles sont exactement nos revendications pour la fin de l'occupation ? [WGR.GetLeader] a convoqué le cercle restreint, et la tension est sérieuse alors que nous mettons en balance ambition et pragmatisme.\n\nL'un des camps insiste pour une affirmation maximale : la Sarre est revenue, les bases américaines sont sous notre contrôle et les troupes alliées sont traitées sur un pied d'égalité, sans droits spéciaux au-delà de ce qui est normal. Souveraineté totale avec l'abolition du Statut d'occupation, tout en reconnaissant pour l'instant les « précautions » alliées limitées. Cette voie audacieuse promet la dignité nationale mais risque d'être rejetée par les Alliés.\n\nL'autre camp privilégie le pragmatisme : se concentrer sur la fin du statut d'occupation et la reconnaissance de l'égalité. Pour garantir l'acceptation et établir des liens avec l'OTAN, nous devons abandonner pour l'instant les demandes de base de la Sarre et des États-Unis et accorder aux Alliés de généreux droits supplémentaires pour leurs troupes stationnées. Cette approche modérée a plus de chances de réussir, garantissant une souveraineté rapide et des liens plus étroits avec l'Occident sans frictions inutiles.\n\nJusqu'où devons-nous pousser et que devons-nous concéder ?"
 Gehlen.32.a: "Le sol allemand appartient aux Allemands !"
 Gehlen.32.b: "L'approche modérée semble plus raisonnable."
 
 Gehlen.33.t: "Les revendications allemandes"
 Gehlen.33.d: "La proposition de Bonn est exceptionnellement affirmée. Ils exigent non seulement la fin du statut d'occupation et l'égalité des forces armées fédérales, mais aussi le retour de la Sarre, le transfert de toutes les bases militaires américaines et la suppression des droits spéciaux pour les troupes alliées. Tout en reconnaissant des « précautions » limitées, il s'agit là d'un effort total en faveur d'une souveraineté absolue.\n\nLes débats internes sont âpres. Certains préviennent que ces exigences mettent en danger la stabilité française, compromettent la défense stratégique et créent un dangereux précédent. Accorder si rapidement un tel pouvoir à une junte militaire suscite des inquiétudes. D'autres soutiennent l'impératif géopolitique : les refuser pourrait éloigner un allié crucial de première ligne. Accorder la pleine souveraineté, malgré le prix élevé, garantit une Allemagne de l'Ouest engagée. Le gain stratégique vaut-il les concessions importantes ?"
 Gehlen.33.a: "Ont-ils oublié qu'ils viennent de perdre une guerre mondiale ? Inacceptable."
 Gehlen.33.b: "Laissez-les l'avoir. De toute façon, ils ne vont nulle part."
 Gehlen.33.c: "Laissons cette décision à Washington"
 
 Gehlen.34.t: "Les revendications allemandes"
 Gehlen.34.d: "Après un examen minutieux, la proposition de Bonn semble se révéler pragmatique et attendue. Il demande la fin officielle du statut d'occupation et la pleine souveraineté ouest-allemande, ainsi que l'égalité entre les troupes alliées et allemandes. Surtout, il n'exige pas le transfert des bases de la Sarre ou des États-Unis, et signale la volonté d'accorder aux troupes alliées des droits supplémentaires importants pour leur présence. Les « précautions » alliées devraient être maintenues.\n\nIl semble que le gouvernement ouest-allemand comprenne l'équilibre nécessaire à l'intégration. Accorder cette souveraineté, tout en maintenant une présence militaire alliée vitale, correspond à nos objectifs d'une Allemagne de l'Ouest forte et démocratique au sein de l'OTAN. "
 Gehlen.34.a: "Des termes très agréables à utiliser. Nous acceptons."
 Gehlen.34.b: "Des termes très agréables à utiliser. Washington l'appréciera."
 
 Gehlen.350.t: "La Haute Commission Alliée accepte nos demandes"
 Gehlen.350.d: "Les nouvelles de Bielefeld sont claires : un accord capital a été conclu ! Nos propositions modérées, mais fermes, pour mettre fin à l'occupation ont été acceptées par les puissances alliées. Le statut d'occupation est formellement aboli et l'Allemagne de l'Ouest a retrouvé sa pleine souveraineté reconnue. Notre Bundeswehr fonctionnera désormais sur un pied d'égalité, une véritable armée nationale, libre de toute surveillance alliée directe.\n\nFondamentalement, les Alliés ont reconnu notre chemin vers l'autodétermination. Même si nous avons concédé pour l'instant le retour immédiat de la Sarre et le transfert complet de toutes les bases militaires américaines, notre approche pragmatique a donné des résultats rapides et décisifs. Les troupes alliées maintiendront leur présence vitale et nous avons convenu de leur accorder les droits supplémentaires nécessaires pour garantir leur efficacité dans notre défense commune."
 Gehlen.350.a: "Barre magique !"
 
 Gehlen.35.t: "La Haute Commission Alliée accepte nos demandes"
 Gehlen.35.d: "Les rapports de Bielefeld confirment une victoire monumentale pour la nation allemande ! Notre position résolue, exigeant rien de moins que la pleine souveraineté et une véritable égalité, a été acceptée par les Alliés. Après d'intenses négociations, les puissances alliées ont accepté nos conditions : le statut d'occupation est formellement aboli et notre Bundeswehr constitue une force pleinement égale.\n\nPlus important encore, ils ont accédé à nos demandes de retour de la Sarre sous contrôle allemand - un tort historique désormais réparé - et de transfert des bases militaires américaines sous notre autorité nationale. Les troupes alliées resteront, mais leur présence sera désormais strictement sous juridiction allemande, sans droits extraterritoriaux particuliers."
 Gehlen.35.a: "Barre magique !"
 
 Gehlen.36.t: "La Haute Commission Alliée refuse nos demandes"
 Gehlen.36.d: "Les informations en provenance de Bielefeld donnent à réfléchir. Malgré nos exigences audacieuses et claires en faveur d'une affirmation nationale complète, les puissances alliées se sont montrées peu disposées à accepter toute la portée de nos propositions. Alors qu'ils restent ouverts à la discussion d'une éventuelle abolition du statut d'occupation et de la reconnaissance formelle de la Bundeswehr, nos principales revendications pour le retour immédiat de la Sarre et le transfert des bases militaires américaines se sont heurtées à une ferme résistance. En outre, ils insistent sur le maintien de droits extraterritoriaux importants pour leurs troupes stationnées, invoquant des impératifs stratégiques et des accords persistants d'après-guerre."
 Gehlen.36.a: "Peut-être devrions-nous envisager une approche plus modérée"
 Gehlen.36.b: "Nous restons fermes sur notre position !"
 
 Gehlen.37.t: "L'Allemagne assouplit ses exigences"
 Gehlen.37.d: "Après un réexamen minutieux, Bonn a accepté de modifier ses demandes, dénonçant ses prétentions sur la Sarre, ainsi que sur Ramstein et Spangdahlem."
 Gehlen.37.a: "Nous pouvons travailler avec cela. Acceptez l'accord."
 
 Gehlen.38.t: "L'Allemagne reste ferme"
 Gehlen.38.d: "Les Allemands ont refusé de reconsidérer leurs exigences, restant fermes sur leur position sur le retour de la Sarre, de Ramstein et de Spangdahlem. Ils soutiennent que « le sol allemand appartient au peuple allemand » et que de nouvelles lois d'occupation étrangère sont inacceptables et détruisent tout espoir de souveraineté allemande."
 Gehlen.38.a: "Non veut dire non ! Ces Allemands..."
 Gehlen.38.b: "Peut-être avons-nous été un peu trop durs..."
 Gehlen.38.c: "Comment Washington va-t-il réagir ?"
 
 Gehlen.39.t: "Les négociations échouent"
 Gehlen.39.d: "Bien que notre délégation ait clairement indiqué que les positions alliées étaient inacceptables, Paris, Washington et Londres ont refusé de poursuivre les négociations et ont collectivement abandonné la conférence et se dirigent vers l'aéroport de Münster pour préparer leur voyage de retour. "
 Gehlen.39.a: "Verdammt!"
 
 Gehlen.40.t: "Les Alliés s'effondrent"
 Gehlen.40.d: "Notre pari a été gagnant ! Notre position ferme sur la question de la Sarre, de Ramstein et de Spangdahlem a contraint les Alliés à accepter nos exigences. C'était prévisible, étant donné que les États-Unis cherchent "
 Gehlen.40.a: "Je l'ai appelé !"
 
 Gehlen.41.t: "Fin de la Conférence de Bielefeld"
 Gehlen.41.d: "Après des jours de négociations, les pourparlers de Bielefeld ont abouti. L'Allemagne de l'Ouest retrouvera sa souveraineté, mettant officiellement fin à l'occupation des zones occidentales et accordant à l'Allemagne la possibilité de rétablir ses forces armées. Il s'agit d'une victoire majeure pour l'Allemagne et son peuple, démontrant que le pays jouera à nouveau un rôle majeur dans la sécurité européenne."
 Gehlen.41.a: "Heureux que nous puissions régler ça."
 
 Gehlen.42.t: " [GetNewspaperHeader] Le Bielefelder Abkommen"
 Gehlen.42.d: "Les négociations entre le gouvernement militaire ouest-allemand et les puissances alliées à Bielefeld se sont conclues avec succès, ouvrant la voie à la fin officielle de l'occupation alliée de l'Allemagne de l'Ouest. Après des jours d'intenses discussions, les deux parties sont parvenues à un accord historique qui verra l'Allemagne récupérer des éléments importants de sa souveraineté nationale. Bien que tous les détails de l'accord n'aient pas encore été rendus publics, les déclarations officielles de Bonn confirment que le statut d'occupation prendra officiellement fin, accordant à l'Allemagne de l'Ouest un contrôle sans précédent sur ses propres affaires. Le succès des pourparlers de Bielefeld annonce une nouvelle ère pour l'Allemagne de l'Ouest : celle d'une dignité retrouvée, d'un partenariat total avec l'Occident et d'un pas définitif vers la place qui lui revient parmi les nations souveraines."
 Gehlen.42.a: "L'Allemagne est de retour sur la scène internationale."
 Gehlen.42.b: "Et l'Allemagne de l'Est ?"
 
 Gehlen.43.t: " [GetNewspaperHeader] Tensions entre l'Allemagne de l'Ouest et la Haute-commission alliée"
 Gehlen.43.d: "Les espoirs d'une résolution rapide de l'occupation alliée de l'Allemagne de l'Ouest ont été anéantis aujourd'hui, alors que les négociations entre le gouvernement militaire ouest-allemand et les puissances alliées à Bielefeld se sont officiellement conclues sans accord. Après des discussions intensives, les deux parties ont confirmé que les divergences fondamentales ne pouvaient pas être réconciliées, ce qui a conduit à l'échec des pourparlers tant attendus. Même si les déclarations officielles ont été brèves et prudentes, les sources indiquent une profonde divergence sur l'étendue de la souveraineté ouest-allemande et sur la présence et les droits continus des forces alliées. Cet échec signifie que le Statut d'occupation reste en vigueur et que le chemin vers la pleine autodétermination allemande semble plus long que prévu. L'incapacité de parvenir à un consensus à Bielefeld jette une ombre sur les aspirations de Bonn à une autonomie complète et soulève des questions sur l'avenir de l'intégration de l'Allemagne de l'Ouest dans l'alliance occidentale."
 Gehlen.43.a: "Malheureux."
 Gehlen.43.b: "Des abrutis qui se battent."
 
 Gehlen.44.t: "Renégociations avec les Alliés ?"
 Gehlen.44.d: "Après l'échec des pourparlers de Bielefeld, diverses voix au sein du gouvernement militaire ont suggéré de lancer une deuxième initiative pour mettre officiellement fin à l'occupation. Même si les Alliés hésitent à poursuivre les négociations en raison de la diversité de nos exigences il y a plus d'un an, nous pourrions peut-être leur accorder davantage de concessions pour leur assurer que nous sommes disposés à coopérer avec la structure de sécurité de l'OTAN. Mais cela implique également de renoncer à toute prétention actuelle sur la Sarre et d'accepter une plus grande présence des forces américaines sur notre sol."
 Gehlen.44.a: "Nous nous plierons aux demandes alliées."
 Gehlen.44.b: "Oubliez ça."
 
 Gehlen.45.t: "L'Allemagne de l'Ouest cède à nos exigences"
 Gehlen.45.d: "Cela fait un an depuis la Conférence de Bielefeld, la première tentative de négociation sur l'éventuelle fin du statut de l'occupation dans les zones occidentales de l'Allemagne. Alors que la délégation allemande a provoqué l'incendie de la réunion en raison de ses exigences inacceptables, Bonn a montré son intérêt pour un nouveau cycle de négociations, prétendant s'adapter à nos exigences et se plier à la structure de sécurité de l'OTAN. L'Allemagne de l'Ouest a officiellement mis fin à ses revendications actuelles sur la Sarre et a accepté la présence intense des forces de l'OTAN à l'intérieur de ses frontières et est prête à leur accorder des droits spéciaux."
 Gehlen.45.a: "Apparemment, vous pouvez entraîner de nouveaux tours à un vieux chien."
 
 Gehlen.46.t: " [GetNewspaperHeader] Le Bielefelder Abkommen"
 Gehlen.46.d: "Une autre tentative de négociations entre le gouvernement militaire ouest-allemand et les puissances alliées à Bielefeld a finalement abouti cette fois-ci, ouvrant la voie à la fin officielle de l'occupation alliée de l'Allemagne de l'Ouest. Après des jours d'intenses discussions, les deux parties sont parvenues à un accord historique qui verra l'Allemagne récupérer des éléments importants de sa souveraineté nationale. Bien que tous les détails de l'accord n'aient pas encore été rendus publics, les déclarations officielles de Bonn confirment que le statut d'occupation prendra officiellement fin, accordant à l'Allemagne de l'Ouest un contrôle sans précédent sur ses propres affaires. Le succès des pourparlers de Bielefeld annonce une nouvelle ère pour l'Allemagne de l'Ouest : celle d'une dignité retrouvée, d'un partenariat total avec l'Occident et d'un pas définitif vers la place qui lui revient parmi les nations souveraines."
 Gehlen.46.a: "L'Allemagne est de retour sur la scène internationale."
 Gehlen.46.b: "Et l'Allemagne de l'Est ?"

 Gehlen.47.t: "Bagarres de rue à Brême"
 Gehlen.47.d: "La décision de créer une aile paramilitaire reconnue par l'État a été rapidement approuvée par le gouvernement militaire, en particulier par l'ancien général de terrain Albert Kesselring. Il a été avancé que pour établir un contrepoids aux milices locales dans les grandes villes allemandes, le soutien contre-révolutionnaire doit être correctement organisé. Le \"Front Vaterländische\" servira dans la tradition du Stahlhelm, luttant contre les forces communistes et socialistes en Allemagne, assistant la Bundespolizei, en particulier dans les zones urbaines.\n\nSuite à cette décision, divers volontaires se sont présentés au travail et ont été envoyés dans la ville de Brême, suite à des informations faisant état de troubles et d'obéissance civile à Brême-Gröpelingen. Après de violents affrontements au sein des bâtiments occupés, les terroristes ont été maîtrisés et emmenés aux commissariats de police locaux pour enquête et interrogatoire."
 Gehlen.47.a: "Saleté communiste !"

 Gehlen.48.t: "L'Allemagne de l'Ouest exige le retour de Max Reimann"
 Gehlen.48.d: "À la suite du coup d'État militariste en Allemagne de l'Ouest après la conférence d'unification de Berlin, Max Reimann et sa délégation ont décidé de rester à Berlin-Est pour chercher refuge contre la colère occidentale. Ils ont officiellement rejoint le SED et ont trouvé leur place au sein de la structure du parti, contribuant ainsi à maintenir le contrôle sur l'Allemagne de l'Est et à tenir à distance la résistance.\n\nIl y a quelques jours, une lettre de Bonn est arrivée à Moscou, exigeant que Reimann soit renvoyé en Allemagne de l'Ouest pour y être jugé pour ses crimes contre la République fédérale. Nous soutiendrons le camarade Reimann, alors que son gouvernement a prouvé qu'il a libéré la société ouest-allemande des forces et des comportements impérialistes, qui n'ont pu être stoppés que par les anciennes forces nationales-socialistes, autorisées à se déplacer librement en Allemagne de l'Ouest par les puissances occidentales."
 Gehlen.48.a: "Sont-ils fous ? Non."
 Gehlen.48.b: "Reimann reste !"
 
 Gehlen.49.t: "L'Union soviétique refuse d'extrader Reimann"
 Gehlen.49.d: "L'Union Soviétique a refusé notre demande de renvoyer Max Reimann en Allemagne de l'Ouest. Ils ont condamné notre lettre comme une insulte et ont dénoncé notre gouvernement comme une junte militaire soutenue par l'impérialisme, composée d'anciens nationaux-socialistes, cherchant à opprimer la classe ouvrière et tentant de retarder la réunification allemande. Pour l'instant, Reimann restera en Allemagne de l'Est, mais cela ne nous empêchera pas néanmoins de le mettre en jugement."
 Gehlen.49.a: "Chien Schweinehunde!"
 
 Gehlen.50.t: "L'échec de l'opération Brandenburg"
 Gehlen.50.d: "Cela fait trop longtemps depuis le dernier rapport de nos agents. Après avoir infiltré la Hellersdorfer Straße, les signaux ont été perdus et aucune autre communication n'a atteint le siège du Bundesnachrichtendienst. Trois jours plus tard, nous avons reçu une lettre de Berlin-Est indiquant que des agents étrangers initialement chargés de l'enlèvement de Max Reimann avaient été capturés. En conséquence, nos agents ont été soumis à un procès-spectacle et jetés en prison par la suite."
 Gehlen.50.a: "C'est mauvais."
 
 Gehlen.501.t: "Des agents ouest-allemands capturés à Berlin-Est"
 Gehlen.501.d: "Ce fut une matinée relativement ennuyeuse à Checkpoint Charlie. L'officier volkspoliziste Schmidtke a enfilé son uniforme et poursuivra l'éternelle compétition de regard avec le soldat américain de l'autre côté. Cependant, divers hommes d'affaires ouest-allemands s'approchaient de la frontière, montrant des permis d'entrée dans le secteur oriental. Schmidtke était méfiant au début, mais leurs cartes d'identité étaient légitimes, alors il les a quand même laissés passer. Leurs sacs étaient longs et lourds, ce qui était inhabituel pour des hommes d'affaires souhaitant vendre des assurances. Schmidtke envoya néanmoins un rapport à son supérieur.\n\nLe soir, il rentrait tôt à la maison, attendant que sa femme prépare le dîner. Lorsque le téléphone a sonné, son ami de longue date, Rudi, servait de sécurité au sein du Politbüro. Des rapports suggèrent que sept agents ouest-allemands, déguisés en hommes d'affaires, ont été capturés après avoir été repérés dans la Hellersdorfer Straße, où ils prévoyaient de capturer l'ancien chancelier Max Reimann, qui s'est enfui à Berlin-Est après la prise de pouvoir militariste en Allemagne de l'Ouest. Après avoir entendu cela de son collègue, Schmidtke sourit, pensant que s'il n'avait pas éveillé les soupçons, Reimann se trouverait probablement maintenant à Berlin-Ouest, arrêté avant un procès-spectacle."
 Gehlen.501.a: "Je les ai!"
 
 Gehlen.51.t: "Tensions à la frontière berlinoise"
 Gehlen.51.d: "Suite à la capture justifiée de divers agents ouest-allemands, les stations de radio occidentales ont hurlé sans arrêt. Ils diffusent toutes les heures des demandes de « libération immédiate » de leurs soi-disant « hommes d'affaires » - comme si le monde entier ne savait pas qu'ils étaient des agents fascistes envoyés pour enlever le camarade Reimann.\n\nBien entendu, notre gouvernement a refusé ces demandes arrogantes. *Neues Deutschland* a publié tous les détails du complot. En réponse à la posture militaire menaçante de la junte à Berlin-Ouest, nous avons montré notre propre détermination. La Volkspolizei et les unités frontalières ont été renforcées. À tous les points de contrôle du secteur, les patrouilles militaires occidentales sont désormais confrontées à des inspections méticuleuses et chronophages de leurs permis et de leurs véhicules."
 Gehlen.51.a: "C'est vrai !"
 
 Gehlen.52.t: "La tension monte à Berlin"
 Gehlen.52.d: "La situation diplomatique à Berlin s'est rapidement détériorée après la capture de nos atouts. Les autorités soviétiques, s'exprimant par la voix de leurs marionnettes est-allemandes, ont formellement rejeté toutes les demandes de retour de nos hommes. Au lieu de cela, ils ont lancé une campagne coordonnée d'agression et de guerre psychologique.\n\nLa *Volkspolizei* et les unités frontalières ont été visiblement renforcées à tous les points de contrôle du secteur. Ils se livrent à un harcèlement systématique de tout le personnel affilié à l'Occident, invoquant une « sécurité renforcée ». Notre trafic militaire et diplomatique est soumis à des inspections délibérément lentes et invasives, créant des retards de plusieurs heures et mettant notre patience à l'épreuve."
 Gehlen.52.a: "Renforcez nos unités !"
 
 Gehlen.53.t: " [GetNewspaperHeader] Affrontements à la frontière intérieure-allemande"
 Gehlen.53.d: "Suite à la capture d'agents ouest-allemands à l'Est de Berlin, les tensions entre les deux États allemands ont atteint un point tel que les forces frontalières locales à Berlin n'hésitent plus à recourir à la force. Les agents occidentaux ont été chargés d'infiltrer Berlin-Est et de récupérer l'ancien chancelier ouest-allemand Max Reimann, qui a fui vers le secteur soviétique de Berlin après avoir été évincé par le gouvernement militaire provisoire de Bonn. L'Union soviétique et les États-Unis d'Amérique ne sont pas encore directement intervenus dans ce conflit, mais il est probable que cette question pourrait évoluer vers une crise plus grave aux conséquences imprévues."
 Gehlen.53.a: "Inquiétant."
 
 Gehlen.54.t: "La suggestion d'Albert Schnez"
 Gehlen.54.d: "Le général Gehlen a convoqué une réunion avec son état-major le plus proche pour aborder la vulnérabilité de la Bundeswehr nouvellement créée. Albert Schnetz, un homme d'une loyauté avérée et d'un talent organisationnel, a présenté une proposition audacieuse. Il a affirmé que les agents officiels du BND et les attachés militaires sont surveillés de toutes parts. Schnetz a souligné la nécessité d'une force qui n'existe pas officiellement : un cadre de vétérans triés sur le volet, fidèles uniquement au nouveau gouvernement et à la patrie, et non à la bureaucratie de Bonn ou aux observateurs alliés. Il a demandé le mandat de construire ce « Schnetz-Truppe », le considérant comme un réseau cellulaire silencieux pour la sécurité intérieure, les opérations de maintien et l'action directe là où l'État ne peut pas être vu.\n\nManstein a immédiatement exprimé son soutien, le qualifiant de « solution pratique à un problème pratique ». Il a déclaré qu'une guerre non conventionnelle est menée contre les Soviétiques et leurs mandataires, une guerre qui ne peut être gagnée avec des « règles gentlemen ». Selon Manstein, cette Truppe fournirait une arme indiscutable et garantirait que la puissance militaire de l'Allemagne repose entre les mains des patriotes.\n\nLe général Speidel, cependant, s'est alarmé, qualifiant cette idée de « catastrophe politique imminente ». Il a fait valoir que le régime tente désespérément de construire une légitimité auprès de l'Occident. Si les Américains découvraient l'existence d'une armée noire, ils ne considéreraient pas la junte comme meilleure que les fanatiques qu'elle a remplacé. Le soutien allié serait retiré, ce qui ferait échouer tout le projet d'une Allemagne de l'Ouest souveraine. Speidel a conclu qu'il s'agissait d'un pari que le gouvernement ne pouvait pas se permettre."
 Gehlen.54.a: "La proposition est abandonnée. Schnetz obtient son testament."
 Gehlen.54.b: "La proposition est arrêtée."
 
 Gehlen.55.t: "La question du président du Bundespräsident"
 Gehlen.55.d: "Alors que notre gouvernement sert de gouvernement provisoire justifié pour nettoyer les restes marxistes, la population ne soutiendra pas ce statut longtemps et est impatiente de retourner un jour aux isoloirs. Afin de donner plus de légitimité à notre gouvernement, nous nommerons une nouvelle figure de proue, représentant nos intérêts et nos revendications auprès du monde extérieur. Ce doit être une personnalité faisant autorité et unie, qui restaurera la confiance du peuple dans son leadership.\n\nNotre premier candidat est l'ancien Reichskanzler Heinrich Brüning, qui a servi de 1930 à 1932 sous l'ancien président du Reichspräsident Paul von Hindenburg. Brüning, un catholique conservateur du Zentrum, gouvernait par décret et était un conservateur fiscal mais était farouchement anti-nazi et anticommuniste, représentant l'ordre conservateur avant la montée d'Hitler.\n\nLa deuxième option est Hjalmar Schacht, un brillant financier, président de la Reichsbank et ministre de l'Economie d'Hitler, à qui l'on attribue le « miracle économique » d'avant-guerre. Cependant, il se brouille plus tard avec le régime nazi, s'engage dans les cercles de la résistance et est emprisonné dans un camp de concentration. Schacht a été acquitté au procès de Nuremberg, marquant ainsi son côté apolitique comme pragmatique non idéologique. L'homme qui a reconstruit l'économie peut le faire à nouveau, désormais libéré de l'extrémisme nazi et communiste.\n\nOption Three est le fils du regretté général-maréchal August von Mackensen, Eberhard von Mackensen, qui a servi comme colonel général pendant la Seconde Guerre mondiale et partage des liens plus étroits avec Erich von Manstein et Albert Kesselring. Cependant, sa personnalité a suscité une grande controverse en raison de son implication dans des crimes de guerre en Italie pendant l'occupation allemande de Rome. Sa peine a été annulée après la chute du gouvernement KPD-SPD et il s'est retrouvé dans le cercle restreint de la junte militaire, estimant que son statut de fils de feu August von Mackensen ferait de lui une figure de proue plus importante."
 Gehlen.55.a: "Bon retour, Heinrich Brüning."
 Gehlen.55.b: "Schacht apportera le deuxième miracle économique."
 Gehlen.55.c: "Mackensen arrive en tête."
 
 Gehlen.56.t: "Le Bundestag s'accorde sur l'autonomisation des dirigeants"
 Gehlen.56.d: "Sous le regard vigilant du gouvernement militaire, le Bundestag s'est réuni dans une atmosphère tendue. Les députés ont débattu du projet de \"Notstandsgesetz\". Sous l'impulsion de la faction dure au sein de la junte - dirigée par des personnalités qui considéraient les querelles parlementaires comme la racine de la faiblesse du gouvernement précédent - la législation visait à amender la Loi fondamentale. Les arguments en faveur d'un « leadership décisif » face à la menace rouge ont dominé la salle. Les députés du KPD étant déjà purgés et de nombreux sociaux-démocrates s'abstenant en signe de protestation, le bloc conservateur, soutenu par les nationalistes, a adopté la mesure. La nouvelle loi a considérablement élargi les pouvoirs du chancelier et du président fédéral, en accordant à ces bureaux la capacité de gouverner par décret d'urgence et de contourner le Bundestag sur les questions de « sécurité nationale », codifiant ainsi le régime fantôme de l'armée dans le droit constitutionnel."
 Gehlen.56.a: "Tout selon le plan."

 Gehlen.57.t: "Une autre journée au Verwaltungsamt"
 Gehlen.57.d: "« Comment ça, je dois obtenir le permis A38 ? Je viens de demander un aperçu de dossiers bureaucratiques importants concernant l'activité dans l'ancien ministère de la propagande du Reich et j'ai été envoyé à 5 personnes différentes et maintenant vous me dites que j'ai besoin d'un autre permis ?\n\nLe fonctionnaire français était épuisé, après avoir passé les trois dernières heures dans les archives municipales de Munich pour recueillir des informations importantes sur Otto Dietrich, ancien chef de la presse et secrétaire d'État. Son voyage à travers les Archives de Munich est le résultat de la décision exécutive d'adapter la pratique informelle pour compliquer à l'extrême l'accès bureaucratique aux dossiers importants concernant les questions administratives d'avant 1945.\n\n« Vous avez besoin du Purple Blank pour recevoir le permis A38. Vous pouvez l'obtenir au comptoir 34, 5ème étage, 6ème couloir. Revenez ensuite au premier étage pour recevoir l'autorisation d'acquérir le permis A38.\n\nLe Français a quitté le bâtiment avec une grande colère, poussant des sons d'agacement français en sortant, en ayant assez de cela."
 Gehlen.57.a: "Héhéhé."
 
 Gehlen.58.t: "Ouverture du Mémorial de Stauffenberg"
 Gehlen.58.d: "Dans le cadre du récit de « résistance patriotique », l'administration Gehlen a annoncé un projet d'État important. Un nouveau mémorial plus grand honorant Claus von Stauffenberg et les conspirateurs du complot du 20 juillet devait être construit sur le terrain de la prison de Plötzensee à Berlin, le lieu même de leurs exécutions brutales. L'administration a présenté cela comme un hommage à la « véritable Wehrmacht anti-hitlérienne » dont le nouveau gouvernement se considérait comme descendant. Toutefois, reflétant clairement le pragmatisme sans sentimentalité de la junte, les responsables ont confirmé que la décision était purement symbolique. Même si le complexe commémoratif serait construit pour accueillir des cérémonies d'État, le lac Plötzensee lui-même ne serait pas mis hors service ; elle resterait une prison pleinement opérationnelle, ses hauts murs continuant à servir le système judiciaire actuel de l'État."
 Gehlen.58.a: "Es lebe das freie Deutschland !"
 
 Gehlen.59.t: "La question de la reconstruction"
 Gehlen.59.d: "Dans les salles de conférence enfumées du ministère de la Reconstruction, une bataille idéologique acharnée s'est déroulée sur le visage de la nouvelle Allemagne. Alors que les technocrates économiques plaidaient en faveur d'une approche rapide et fonctionnaliste - défendant les préfabriqués en béton et le style international pour loger des millions de personnes déplacées le plus rapidement possible - l'administration Gehlen est intervenue avec un mandat décisif pour une « restauration spirituelle ». Rejetant le modernisme utilitariste de la décennie précédente, le qualifiant de « sans âme » et culturellement étranger, la junte a décrété que la reconstruction devait donner la priorité à la continuité historique.\n\nDes fonds publics importants ont été détournés des projets de logements rapides vers la restauration méticuleuse des palais urbains bombardés, des cathédrales et des façades ornées de l'ère Gründerzeit. La directive indiquait clairement la priorité de l'administration : l'Allemagne de l'Ouest ne devait pas être simplement une machine économique, mais une forteresse visuelle de la culture européenne traditionnelle, reconstruisant brique par brique son identité brisée, même si cela signifiait que la reprise se déroulerait à un rythme plus lent et plus délibéré."
 Gehlen.59.a: "Nous devons construire rapidement et efficacement."
 Gehlen.59.b: "Nous devons reconstruire notre Tradition !"
 
 Gehlen.60.t: "De nouvelles vacances pour l'Allemagne"
 Gehlen.60.d: "Dans les salles sacrées de la Chancellerie, le débat sur la fête nationale a mis à nu la crise d'identité du gouvernement. Les militaires de la ligne dure, menés par le bloc en uniforme du cabinet, ont farouchement défendu le 18 janvier. Pour eux, l'anniversaire de la fondation de l'Empire allemand en 1871 était le seul choix qui imposait le respect, symbolisant l'unité, la discipline prussienne et une lignée directe avec Bismarck qui contournait le chaos du passé récent.\n\nA l'inverse, la date du 11 août, date de la signature de la Constitution de Weimar, n'a pas été favorisée par la majorité. Pour la majorité des dirigeants, dont beaucoup avaient servi dans la Reichswehr, cette date représentait la « faiblesse honteuse » de la Première République, une expérience ratée de parlementarisme débridé qui, selon eux, n'avait fait qu'ouvrir la voie à l'extrémisme.\n\nPris au milieu se trouvaient les pragmatiques civils et les stratèges de Gehlen, qui préconisaient timidement la date du 23 mai, date de la promulgation de la Loi fondamentale. Même s'ils n'ont pas la grandeur émotionnelle de la date impériale, ils ont fait valoir que la célébration de la nouvelle Constitution était essentielle pour convaincre Washington et Londres que la junte n'était qu'une gardienne de la démocratie, et non son fossoyeur. La salle restait partagée entre l'attrait de la gloire impériale et la nécessité d'un camouflage démocratique."
 Gehlen.60.a: "Nous fêterons le 18 janvier. La naissance de l'Allemagne."
 Gehlen.60.b: "Nous ne devons pas oublier Weimar. Nous sommes le 11 août."
 Gehlen.60.c: "Le 23 mai conviendra à la Nouvelle Allemagne."

 Gehlen.61.t: "Affrontements à la frontière en Thuringe"
 Gehlen.61.d: "Après de violentes escarmouches près de Fulda, la Bundesgrenzschutz a finalement vaincu les forces locales de la Volkspolizei et les a repoussées vers leurs postes défensifs derrière les fortifications frontalières, ce qui a permis une victoire de prestige pour les forces armées de l'Allemagne de l'Ouest."
 Gehlen.61.a: "Celui-ci va à Bonn."
 
 Gehlen.62.t: "Affrontements à la frontière en Thuringe"
 Gehlen.62.d: "Après de violents escarmouches près de Fulda, la Volkspolizei a finalement vaincu les forces locales de la Bundesgrenzschutz et les a repoussées vers leurs postes défensifs derrière les fortifications frontalières, ce qui a permis une victoire de prestige pour les forces armées de l'Allemagne de l'Est."
 Gehlen.62.a: "La Volkspolizei l'emporte."
 
 Gehlen.63.t: "Affrontements à la frontière en Thuringe"
 Gehlen.63.d: "À la suite de violentes escarmouches près de Fulda, la Bundesgrenzschutz et la Volkspolizei finissent par regagner leurs postes défensifs derrière les fortifications frontalières, ce qui aboutit à une impasse sans vainqueur clair."
 Gehlen.63.a: "Eh bien, c'est gênant."
 
 Gehlen.301.t: "Créer une commission d'enquête conjointe alliée ?"
 Gehlen.301.d: "Afin de garantir des structures de planification plus pratiques, Hans Speidel a proposé une plate-forme commune pour la planification collective des affaires intérieures de l'Allemagne. Cette plateforme vise à fédérer tous les efforts d'espionnage, de coordination des troupes en Allemagne de l'Ouest et d'actions diplomatiques envers l'Allemagne de l'Est. Même si cela isolerait l'Union soviétique et montrerait clairement que l'unité allemande par la diplomatie n'est pas dans notre intérêt actuel, cela approfondirait nos relations avec l'Occident, renforçant ainsi le statut de sécurité de l'Allemagne de l'Ouest en Europe."
 Gehlen.301.b: "Bonne idée !"
 Gehlen.301.a: "Il vaudrait mieux ne pas contrarier davantage l'Union soviétique."
 
 Gehlen.121.t: "L'Allemagne de l'Ouest dénonce le traité d'unification de 1953"
 Gehlen.121.d: "Suite à la prise illégitime du pouvoir à Bonn par d'anciens éléments nationaux-socialistes, la majeure partie de l'ancien gouvernement KPD-SPD du chancelier Reimann a été soit purgée, soit contrainte à l'exil ici en Allemagne de l'Est. Le gouvernement de Bonn, sous le signe [WGR.GetLeader], a annoncé que le traité de réunification, signé à Hohenschönhausen il y a quelques mois, n'avait aucune signification bilatérale, arguant qu'il avait été signé par un gouvernement prétendument illégitime, ne représentant pas la volonté du peuple allemand. C'est une pilule difficile à avaler et elle enterrera tout espoir de réunification allemande pour les prochaines décennies."
 Gehlen.121.a: "C'est vraiment dommage."

 
 Gehlen.0.d: "Les officiers s'étaient rarement rencontrés en personne, et presque jamais ensemble. À l'époque de Reimann, c'était une bonne idée de s'en tenir à une routine normale, afin de ne pas trop attirer l'attention sur leur cause.\n\nDans la Chancellerie fédérale de Francfort, récemment libérée, se trouvaient six officiers, tous issus des forces terrestres les plus anciennes et les plus importantes de la Bundeswehr ; Reinhard Gehlen, Erich von Manstein, Hans Spiedel, Adolf Heusinger, Wolf Graf von Baudissin et Hans Rottiger. Grouillant d'officiers inférieurs et de gardes, les six hommes discutaient entre eux, lorsque Gehlen frappa sur la table de conférence, dispersant rapidement tout bruit\n\n \"Bienvenue messieurs, et merci à tous de vous être consacrés à cette entreprise. Les rapports continuent d'arriver mais il semble que nous ayons libéré le peuple allemand de la menace communiste.\"\n\nLa salle a brièvement applaudi avant que Gehlen ne frappe à nouveau, faisant signe au général Hans Speidel de parler.\n\n \"Cet organe doit s'affirmer comme le gouvernement légitime de la République fédérale et l'un des moyens d'y parvenir est d'élire un président de ce comité des dirigeants. Ce président agira en tant que chef de cet organe et chef de l'Etat, représentant les intérêts de la République fédérale auprès des Alliés occidentaux et à l'étranger.\"\n\n \"Il y a deux candidats en tête : le Generalleutnant Reinhard Gehlen et l'ancien Generalfeldmarschall Herr Erich von Manstein. Messieurs, s'il vous plaît, écrivez vos votes sur le morceau de papier devant vous et remettez-le à l'adjudant.\""
 Gehlen.1.d: "Cela faisait quelques jours qu'il avait été « élu » président du Comité des officiers de la Bundeswehr, dans une écrasante majorité, et tandis que Reinhard Gehlen se levait, lissant son uniforme, ajustant les médailles et les insignes, regardant les équipages placer les microphones et les caméras devant le podium, ajustant l'emblème derrière, il réfléchit à ce qu'il dirait. Ce serait un jeu d'enfant, mais apaiser toutes les parties était la partie la plus difficile.\n\nQuelques minutes plus tard, Gehlen a pris place sur le podium, vérifiant une dernière fois son discours avant qu'un assistant ne signale qu'ils étaient en direct\n\n \"Citoyens de la République fédérale d'Allemagne. Les épaules qui portent la responsabilité de dire cela, en ce moment dramatique de l'histoire allemande, sont lourdes. En tant que fier officier de la Bundeswehr, c'est mon devoir à assumer, et que je ne prends pas à la légère, car l'avenir de notre République est en jeu. J'annonce aujourd'hui qu'un gouvernement militaire provisoire formel a été formé, composé de moi-même et d'autres militaires, dans le cadre de nos fonctions de Comité des officiers de la Bundeswehr. Certains pourraient critiquer cela comme étant antidémocratique et autoritaire, mais il s'agit d'un changement de gouvernement temporaire en réponse aux menaces et à la répression subies sous l'ancien chancelier Max Reimann. Nous souhaitons ramener la République fédérale d'Allemagne et ses citoyens dans un rempart anticommuniste contre l'agression soviétique et la coopération avec les Alliés occidentaux. Notre gouvernement annoncera un certain nombre de changements politiques dans les prochains jours. Nous vous remercions pour votre coopération, ainsi que Guten Nacht, Allemagne."
 Gehlen.2.d: "ARRÊTÉ PROVISOIRE DU GOUVERNEMENT MILITAIRE NO. 3\n\nBONN, ALLEMAGNE, [GetDateText]\n\nPOLITIQUE RELATIVE À LA LOI FONDAMENTALE DE LA RÉPUBLIQUE FÉDÉRALE D'ALLEMAGNE\n\nNotant l'importance de la Loi fondamentale de la République fédérale d'Allemagne en tant que document fondateur qui garantit des droits politiques étendus et prévoit un système démocratique dans son ensemble,\n\nNotant avec inquiétude les changements apportés par le précédent gouvernement communiste dirigé par Max Reimann dans le but de démanteler lesdites institutions démocratiques et de saper la volonté du peuple,\n\nComprenant l'immense devoir que tous les officiers de la Bundeswehr ressentent dans leur responsabilité de gouverner et de protéger les citoyens contre la dangereuse subversion communiste,\n\nLe Comité des officiers de la Bundeswehr décide ce qui suit :\n\n1. La Loi fondamentale (Grundgesetz) de la République fédérale d'Allemagne est suspendue jusqu'à nouvel ordre.\n\n2. Le Bundestag restera un organe consultatif, mais sera de nature apolitique et représentera la partie civile de la population.\n\n3. La Cour constitutionnelle fédérale sera dissoute jusqu'à nouvel ordre.\n\n4. Tous les anciens départements du cabinet seront organisés sous l'égide du Comité des officiers du ministère de la Défense et de la Bundeswehr pour mettre en oeuvre les politiques du gouvernement national.\n\n5. Tous les gouvernements des États seront sous l'autorité et le contrôle immédiats des commandants militaires régionaux nommés par le Comité des officiers.\n\nSIGNÉ\nLe général Reinhard Gehlen\nPrésident du Comité des officiers de la Bundeswehr, Gouvernement militaire provisoire de la République fédérale d'Allemagne"
 Gehlen.3.d: "C'était une nuit calme à Bonn, lorsque Gehlen entra dans la salle de conférence, où Spiedel, Manstein et quelques autres officiers subalternes planaient pour passer des papiers. En s'asseyant, il remarqua un nouvel officier assis au bout de la table, fouillant notes et papiers, fermant sa valise.\n\n \"Hans, qui est-ce ?\"\n\"Johannes Stumm, de la police de Berlin et le capitaine Markus Herrlein, du commandement de la police militaire. Reinhard, il y a eu un développement dans l'affaire Reimann.\"\n\"Bienvenue, messieurs. Quelle est la situation ?\"\n\n \"L'ancien chancelier Max Reimann s'est enfui à Berlin-Est après avoir signé l'accord d'unification illégitime et nos forces ont pris le pouvoir à Bonn. Depuis lors, nous avons du mal à le retrouver et à le capturer. Nos agents l'ont localisé dans un appartement à Berlin-Est, mais les autorités est-allemandes et soviétiques ont empêché notre accès pour le capturer, invoquant son \"importance pour la cause socialiste\" et leur souveraineté violée. Nous cherchons d'autres solutions pour contourner ce problème afin d'arrêter Reimann qui, selon nous, coordonne les communistes. Subversion dans le pays.\n\n \"Très bien. Des idées ? Faisons le tour.\"\n\n» Commença Speidel. \"Il est clair qu'il s'agit d'une question d'accès - pourquoi ne pas passer par le Conseil de contrôle allié ou par les commandants des secteurs professionnels alliés ? Il s'agit d'une question internationale qui peut être résolue par la négociation.\"\n\nManstein intervint. \"En ce qui concerne le général Spiedel, la diplomatie ne nous mènera nulle part. Reinhard, vous savez aussi bien que moi que l'utilisation de nos renseignements et de nos moyens militaires permettra d'attraper Reimann plus efficacement que de parler jusqu'à ce que nous soyons bleus, alors qu'il pourrait coordonner des attaques contre nous. Nous devrions coopérer avec les Alliés pour une opération d'extraction.\"\n\nStumm et Herrlein hochèrent la tête. \"Les deux idées sont réalisables, même si la dernière idée est évidemment plus risquée et impliquerait davantage nos capacités.\"\n\n Gehlen hocha la tête. \"Merci messieurs. Ceci étant dit, je pense que nous devrions...\""
 Gehlen.4.d: "C'était un matin pluvieux au Kammergericht lorsque deux VW Kubelwagens couverts, décorés des insignes de la Bundeswehr, se sont arrêtés et se sont garés, avec les officiers à l'intérieur se précipitant, les porte-documents et les pardessus se précipitant.\n\nEn marchant sur les sols en marbre du bâtiment, les officiers se sont dirigés vers une salle de conférence, où leurs patrons étaient assis à l'intérieur.\n\nLorsque Gehlen et ses adjoints entrèrent, il serra la main du général de division américain George B. Honnen, du lieutenant-général britannique William Oliver, du général français Pierre Manceaux-Demiau et du général de division soviétique Pyotr Dibrova. Gehlen commença à s'asseoir tandis que ses assistants distribuaient des documents.\n\n « Je sais que votre venue ici a dû être une surprise, et je n'ai certainement pas l'intention de susciter de la peine parmi les autorités d'occupation », lançant un regard noir à Dibrova pendant qu'il parlait.\n\n \"Cependant, il y a un problème qui, je suis sûr que vous le savez tous, doit être abordé. L'ex-chancelier et agitateur communiste Max Reimann, qui a trahi la République fédérale d'Allemagne, a demandé l'asile à Berlin-Est. Nous avons l'intention de le faire extrader et de le juger devant un jury composé de ses pairs.\"\n\nDibrova, qui s'était jusque-là retenu, éclata.\n\n \"Non ! Herr Reimann a le droit de rester là où il est pour la sécurité du socialisme et pour se protéger contre des éléments fascistes comme vous ! Nous ne tolérerons pas cela, cette conversation est terminée.\"\n\nGehlen regarda les autres officiers, qui semblaient vouloir eux aussi partir. \"Nous pouvons sûrement demander votre aide à ce sujet ? Mes officiers m'ont assuré que la négociation est une bien meilleure solution que la simple arrestation de Reimann.\"\n\nHonnen leva les yeux. \"Général Gehlen, même si nous aimerions avoir Reimann sous notre garde, il se trouve dans la zone d'occupation soviétique et nous n'avons pas le droit de l'avoir. Les Soviétiques doivent le livrer, et s'ils veulent le garder, ils ont le droit de le faire. Le mieux que nous puissions faire est d'envoyer un télex à nos gouvernements et d'espérer qu'ils émettent une protestation diplomatique pour libérer Reimann, mais à moins que Dieu n'intervienne, il semble peu probable qu'ils le libèrent. Je suis désolé.\" Les officiers britanniques et français acquiescèrent également, découragés.\n\nGehlen fronça les sourcils, réfléchissant davantage. Il devait sûrement y avoir quelque chose pour résoudre ce problème."
 Gehlen.5.d: "L'opération suivante a pour but d'extraire de Berlin-Est l'ex-chancelier et actuel président du KPD Max Reimann et de le renvoyer en République fédérale, où il sera emprisonné en attendant son procès.\n\n1. Trois équipes d'agents seront envoyées par avion à Berlin-Ouest et entreront dans Berlin-Est via Checkpoint Charlie en se faisant passer pour un groupe d'hommes d'affaires et d'officiers militaires ouest-allemands en mission de liaison normale. Ils changeront ensuite de vêtements pour se faire passer pour des secouristes et des forces de l'ordre est-allemands. Les trois équipes seront composées d'officiers du BND/MAD (Team Eins), d'officiers de la CIA (Team Zwei) et d'officiers de la police de Berlin/BKA (Team Drei).\n\n2. Les équipes se rendront à la Hellersdorfer Strasse 179 à Berlin-Est, où se trouve le sujet. L'équipe Eins et Zwei entreront dans le bâtiment, extrairont Reimann, le drogueront, le chargeront sur une civière et l'emmèneront devant ses gardes du corps où il sera chargé dans un véhicule. En raison de l'urgence, l'équipe Drei fournira le soutien extérieur des autorités soviétiques et de la Volkspolizei, ainsi que coupera les câbles téléphoniques et autres équipements de communication. L'équipe Drei reçoit l'ordre de se défendre en cas de tirs et de cibler les forces est-allemandes avant de cibler les autorités soviétiques afin de minimiser l'ampleur d'un incident international.\n\n3. Toutes les équipes retourneront, avec toute la rapidité délibérée, à Berlin-Ouest sous prétexte que Reimann a besoin d'une hospitalisation immédiate dans un hôpital de la partie ouest de la ville et que des responsables soviétiques seront bientôt là. Reimann sera emmené au quartier général de la mission de liaison militaire américaine, où il sera détenu jusqu'à ce qu'un vol de toutes les équipes puisse être organisé pour rentrer à Bonn.\n\nNous avons une confiance modérée dans le fait que ce plan réussira et permettra une extradition adéquate de Reimann, avec l'indignation ultérieure des autorités soviétiques et du bloc de l'Est.\n\nSIGNÉ\nGénéraloberst Erich von Manstein\nVice-président du comité des officiers de la Bundeswehr ; Gouvernement militaire provisoire, Bureau du renseignement"
 Gehlen.6.d: "À : Generalleutnant Reinhard Gehlen, Comité des officiers de la Bundeswehr, Gouvernement militaire provisoire d'Allemagne\nDE : Bureau administratif de l'économie, gouvernement militaire provisoire d'Allemagne\n\nOBJET : Un rapport sur la situation économique de la nation\n\nGénéral Gehlen,\n\nDepuis que notre administration a succédé au gouvernement communiste il y a quelques mois, l'économie a été largement négligée derrière les questions politiques et militaires dominantes. Cependant, notre bureau a préparé les recommandations suivantes en matière de politique économique afin de stabiliser et de développer l'économie allemande.\n\n1. La libération immédiate de tous les biens de consommation et des installations de fabrication automobile de la nationalisation gouvernementale, une action initialement ordonnée par le régime communiste.\n\n2. Remanier la direction de nos sociétés charbonnières et sidérurgiques pour inclure des directeurs nommés par l'État et fidèles au régime.\n\n3. La fin immédiate de toutes les exportations de charbon vers la France et l'Allemagne de l'Est, en guise de protestation diplomatique contre le régime communiste illégitime.\n\n4. L'interdiction de tous les syndicats, associations de travailleurs et autres actions collectives ou organisations syndicales, ainsi que le fait de rendre illégal le fait de faire grève avec une lourde peine de prison.\n\n5. Demande aux États-Unis d'une aide économique supplémentaire du Plan Marshall ou d'une aide économique indépendante.\n\nNous espérons sincèrement que tous ces points faciliteront la reprise rapide et la stabilité de l'économie allemande pour tous.\n\nSIGNÉ\nOfficier en chef du Bureau administratif de l'économie, Gouvernement militaire provisoire d'Allemagne"
 Gehlen.7.d: "À : Generalleutnant Reinhard Gehlen, Comité des officiers de la Bundeswehr, Gouvernement militaire provisoire d'Allemagne\nDE : Inspecteur général des forces armées\n\nOBJET : Plan de stabilité pour l'Allemagne\n\nGénéral Gehlen,\n\nEn tant qu'inspecteur général des forces armées, mon bureau a la nouvelle responsabilité de déterminer la sécurité intérieure de l'Allemagne ainsi que les menaces intérieures qui pèsent sur l'administration militaire. Voici quelques propositions à mettre en oeuvre pour garantir que l'Allemagne reste stable et sûre.\n\n1. Interdire immédiatement le Kommunistische Partei Deutschlands (KPD) sous toutes ses formes dans le pays.\n\n2. Commencer immédiatement le procès de Max Reimann pour trahison, qu'il soit détenu par l'armée ou par contumace.\n\n3. Dans cette optique, commencer les procès des membres et sympathisants du KPD, y compris les procès publics et télévisés.\n\n4. Une expansion du Bundesnachrichtendienst (BND) pour inclure des membres de l'Organisation Gehlen, organisant les agences de renseignement en une seule agence centralisée dotée de pouvoirs exécutifs.\n\n5. Une condamnation de toutes les formes d'antisémitisme, surtout pour montrer la politique de notre gouvernement à l'égard des minorités.\n\nMême si certaines de ces propositions peuvent sembler controversées, elles sont nécessaires pour une Allemagne stable et sans opposition intérieure.\n\nSIGNÉ\nInspecteur général des forces armées, gouvernement militaire provisoire d'Allemagne"
 Gehlen.8.d: "Alors que le petit Hans rentrait de l'école, il jeta son sac à dos contre une chaise et se laissa tomber par terre, allumant la nouvelle télévision en noir et blanc de sa famille pour voir ce qui se passait.\n\n « Comment plaidez-vous, Herr Schweppenstette ?\n\n \"Non coupable, Votre Honneur.\"\n\nHans leva les yeux et vit un homme négligé, vêtu d'une combinaison de prisonnier, menotté et debout dans une vitrine face au tribunal, flanqué de deux officiers de la Bundeswehr portant des casques MP.\n\n \"Vous avez été accusé de trahison contre le peuple allemand et de résistance fermentée contre le gouvernement militaire provisoire d'Allemagne. Ce tribunal vous déclare coupable et vous condamne à vingt ans de prison et de travaux forcés.\"\n\nCLAQUER.\n\nEn se levant en sursaut, Hans, effrayé, éteignit la télévision lorsque sa mère entra dans la pièce, après avoir été dans la chambre.\n\n« Cher, qu'est-ce qui ne va pas ?\n\n « Mutti, que se passe-t-il à la télé ?"
 Gehlen.9.d: "« Peuple d'Allemagne ! »\n\nGehlen, paré de son uniforme de cérémonie, se tenait sur la Marienplatz à Munich, face à une foule de centaines de personnes et à un corps de presse et de télévision rassemblé.\n\n « C'est un discours extrêmement difficile à prononcer mais qui doit être prononcé. À quelques pas de là, il y a plus de trente ans, Hitler et les nazis tentèrent un coup d'État contre l'État bavarois. Même s'il a échoué, il a ouvert la voie au Troisième Reich qui, pendant que moi et d'autres officiers avons servi sous celui-ci, a constitué une tache grave sur l'histoire de l'Allemagne qui ne peut être oubliée. En particulier, la rhétorique antisémite associée au régime hitlérien, qui a entraîné la mort de centaines de milliers, voire de millions de Juifs innocents, est inadmissible. Le gouvernement militaire provisoire allemand, composé d'officiers de la Bundeswehr, condamne sans équivoque toute forme d'antisémitisme ou de discrimination à l'égard des personnes d'origine juive. Nous sommes arrivés à une période de réconciliation dans ce pays et ce gouvernement s'engage à garantir que les Juifs allemands puissent vivre en paix en Allemagne de l'Ouest. Merci beaucoup.\n\nLa foule est restée plutôt silencieuse pendant un moment, commençant à applaudir alors que Gehlen quittait la scène. C'était le premier pas, et même s'il se sentait mal à l'aise de le faire, c'était un bon pas dans la bonne direction."
 Gehlen.10.d: "Alors que le juge enfilait sa robe, il ne voulait pas avoir à faire cela. En tant que juge civil, il se sentait mal à l'aise depuis l'arrivée au pouvoir de la junte, se faisant appeler « Gouvernement militaire provisoire d'Allemagne » ; et maintenant, il doit superviser le procès du précédent chancelier.\n\nEn entrant dans la salle d'audience, elle était vide, mais presque trop vide. Le juge a vu les caméras de télévision au fond de la pièce, la salle de verre vide où d'anciens sympathisants communistes se tenaient enchaînés, entourés d'officiers parlementaires renfrognés de la Bundeswehr. Ces officiers étaient là, mais debout sur les bords, fumant, n'ayant pas grand-chose d'autre à faire.\n\nAlors que l'horloge sonnait 10 heures, le procureur et le sténographe judiciaire sont entrés et tous les trois ont parcouru leurs papiers avant de commencer.\n\n « C'est ainsi que commence l'affaire Gouvernement militaire provisoire d'Allemagne contre Max Reimann par contumace. Monsieur le Procureur, quelles sont les accusations ?\n\n \"Votre Honneur, le gouvernement militaire provisoire d'Allemagne accuse Herr Max Reimann de trahison contre le peuple allemand, de subversion, d'avoir travaillé comme agent étranger, d'avoir ordonné la surveillance et la persécution d'un nombre incalculable d'Allemands pendant son mandat de chancelier et d'être membre d'un parti politique interdit, le KPD.\"\n\n « Herr Reimann, comment plaidez-vous ?\n\n Le silence, tel qu'il a été conçu.\n\n \"Étant donné son absence, ce tribunal présume sa culpabilité et le déclare coupable de toutes les accusations.\"\n\nCLAQUER.\n\n « Herr Reimann, vous êtes condamné à la prison à vie. »\n\nBANG. BANG.\n\n \"Ce tribunal est ajourné.\"\n\nAlors que les caméras s'éteignaient et que les gardes retrouvaient leur calme normal, le juge resta assis sur sa chaise pendant un moment, réfléchissant : pendant des années, il avait été un juriste accompli, mais maintenant, connu par certains comme un héros anticommuniste, et par d'autres, un traître de classe, une marionnette des chiens fascistes au-dessus de lui."
 Gehlen.11.d: "« Estimées délégations des Nations Unies !\n\nGehlen se tenait debout, debout au-dessus du podium de pierre, comme d'habitude dans son uniforme de cérémonie. C'était l'occasion pour le peuple allemand de se racheter et le général devait s'assurer que tout se passait bien.\n\n \"C'est un jour important pour toutes les nations libres du monde. Bien que l'Allemagne ne soit qu'un État observateur auprès de cet organisme, j'ai l'honneur de prendre la parole ici aujourd'hui.\"\n\n\"Les dernières années en République fédérale ont véritablement changé la vie de tous. De zone d'occupation à la direction d'un chancelier communiste quasi-autoritaire, en passant par la libération par la Bundeswehr, le peuple allemand a traversé de nombreuses épreuves depuis la fin de la Seconde Guerre mondiale.\"\n\n\"Mes officiers et moi voulons être clairs sur notre rôle de gouvernement en Allemagne. Nous sommes des dictateurs bienveillants, pour préserver la stabilité de la République fédérale de l'infiltration communiste et pour consacrer l'idéologie démocratique et anticommuniste pour tous. Pour tous ceux qui s'opposent à nous, soyez prévenus, nous avons des amis plus puissants et une force militaire capable qui fera de grands efforts pour défendre notre sol. Merci à tous pour votre temps. \"\n\nCourt et pertinent. En quittant la scène, il n'entendit qu'environ la moitié de la salle applaudir et, regardant la délégation soviétique, il retourna à sa place. Ce n'était que le début."
 Gehlen.12.d: "ARRÊTÉ PROVISOIRE DU GOUVERNEMENT MILITAIRE NO. 17\n\nBONN, ALLEMAGNE\n\nPOLITIQUE RELATIVE À L'ACCORD DE RÉUNIFICATION DE 1953 AVEC L'ALLEMAGNE DE L'EST\n\nCondamnant les actions perpétrées par le précédent régime communiste du chancelier Max Reimann, notamment la subversion, la surveillance et la persécution des civils,\n\nPrenant note de la soi-disant « Conférence de Berlin » et de « l'Accord de réunification de 1953 » proposés et signés entre la République fédérale d'Allemagne, la République démocratique allemande et l'Union des Républiques socialistes soviétiques,\n\nNotant les préoccupations exprimées par la communauté nationale et internationale quant à la légalité dudit accord,\n\nLe Comité des officiers de la Bundeswehr déclare ce qui suit :\n\n1. L'accord connu sous le nom d'« Accord de réunification de 1953 » est considéré comme illégitime et inapplicable par le gouvernement militaire provisoire d'Allemagne et tous les fonctionnaires travaillant sous son autorité et est par la présente considéré comme nul et non avenu.\n\n2. Aucune unification de ce type entre la République fédérale d'Allemagne et la République démocratique allemande n'aura lieu pendant la période du gouvernement militaire provisoire de l'Allemagne, ni pendant que la République démocratique allemande continue d'avoir un régime autoritaire communiste répressif.\n\n3. La République fédérale d'Allemagne reste signataire de tous les autres traités internationaux auxquels elle a adhéré et examinera tout autre traité bilatéral ou multilatéral au fur et à mesure de ses discussions.\n\nSIGNÉ\nGénéraliste [WGR.GetLeader]\nPrésident du Comité des officiers de la Bundeswehr, Gouvernement militaire provisoire de la République fédérale d'Allemagne"
 Gehlen.13.d: "BONN (AP) - Le dirigeant espagnol et généralissime Francisco Franco a visité aujourd'hui la capitale de l'Allemagne de l'Ouest, où il a été chaleureusement accueilli par Erich von Manstein, Reinhard Gehlen ainsi que Hans Speidel, tous de l'état-major militaire ouest-allemand. Après avoir assisté à une somptueuse réception diplomatique organisée par le petit ministère des Affaires étrangères du gouvernement militaire, Franco et ses adjoints ont entamé des discussions diplomatiques avec Gehlen et ses officiers, signant un communiqué sur le renforcement des relations bilatérales entre l'Allemagne de l'Ouest et l'Espagne. Ayant des relations ténues depuis la Seconde Guerre mondiale, cette évolution représente la nouvelle politique étrangère de la junte ouest-allemande visant à rechercher des liens plus étroits avec des pays comme l'Espagne dotés de gouvernements militaires anticommunistes similaires."
 Gehlen.14.d: "« Le communisme est une tache sur le monde en tant qu'idéologie, et une idéologie qui se réapproprie simplement le fascisme en une idéologie de gauche « pour le peuple » qui aboutit à ce qu'il soit gouverné par une dictature autoritaire. »\n\n \"Pour ceux qui prétendent que ce gouvernement n'est pas meilleur, vous avez tort. Ce gouvernement est composé de militaires, de fiers anticommunistes, d'hommes dévoués au maintien de la sécurité de l'Allemagne contre la subversion communiste et la propagation de leur idéologie et de leur système économique cancéreux à travers l'Europe et le monde. Oui, il était nécessaire de suspendre certaines mesures gouvernementales, mais uniquement pour empêcher que ces institutions ne soient abusées par les communistes et la gauche, qui préfèrent exploiter des institutions démocratiques parfaitement fonctionnelles pour servir leurs désirs autoritaires.\"\n\n \"Karl Marx n'est pas un vrai Allemand. Beaucoup d'Allemands sont de fiers conservateurs catholiques qui craignent Dieu, des Allemands qui préfèrent le capitalisme et son innovation pour la croissance économique aux systèmes économiques centralisés où les citoyens savent où travailler et combien de temps travailler, produire des produits défectueux et être payés quelques centimes par dollar aux pays occidentaux.\""
 Gehlen.15.d: "Alors que Szabo, 5 ans, marchait péniblement sur le chemin de terre, il était fatigué et affamé, pensa-t-il. En regardant sa mère Marton, qui portait son frère Miksa, il espérait qu'ils étaient proches. Ils traversaient la Tchécoslovaquie depuis plusieurs jours, fuyant les violences et la mort qui régnaient à Budapest. Il n'y avait pas de conversation, seulement de réflexion.\n\nTout en fumant une cigarette, Helmut jetait de temps à autre des bouffées de sa Gewehr sur son épaule, le regard tourné vers la frontière tchèque. Il avait été déployé dans la petite ville de Furth im Wald pour des exercices, mais avait été chargé d'assurer la garde-frontière contre les forces communistes en Tchécoslovaquie. Malgré ce que son commandant lui avait dit, la frontière était calme, comme d'habitude, presque au crépuscule. Ils avaient été prévenus d'un nombre croissant de réfugiés fuyant l'Est, en raison d'une sorte de soulèvement en Hongrie. Helmut ne pouvait même pas indiquer Budapest sur une carte, mais il avait vu des photos de T-54 patrouillant dans les rues, de soldats soviétiques dans de violents échanges de tirs.\n\nTandis qu'il déposait les restes de sa cigarette dans un cendrier et prenait une paire de jumelles, Helmut aperçut deux personnages au loin - une mère et son enfant peut-être ?, pensa-t-il.\n\nEn sortant de la cabine de garde pour voir de plus près, il y avait une mère et son enfant, ainsi qu'un bébé, et une voiture pleine de leurs affaires. Réveillant les deux autres soldats, Thomas et Artur, ils partirent tous les trois, l'un d'entre eux se rendant par radio à leur caserne pour demander de l'aide.\n\nAlors que Szabo continuait de marcher aux côtés de sa mère, il commença à apercevoir le poste frontière, orné d'un grand aigle dans l'emblème de l'Allemagne de l'Ouest, et une grande porte de passage fortifiée. Il y avait trois soldats, dont deux armés de fusils, qui lui parlaient dans une langue inconnue. Marton a commencé à parler alors qu'ils se rapprochaient de la porte, et même si les soldats avaient l'air effrayés, ils tenaient leurs armes avec précaution.\n\n \"Réfugié! Menekült!\"\n\n \"Hände hoch ! Halte !\" Les deux Hongrois levèrent instinctivement la main tandis qu'Helmut s'approchait d'eux, épaulant un instant son fusil.\n\nEn se retournant, le soldat allemand a crié quelque chose aux autres, Marton pouvait le voir. Ils portaient de vieux casques Stahlhelm, que presque personne en Europe ne pouvait oublier, pensa-t-elle, alors qu'ils soulevaient la porte et les faisaient entrer, elle et Szabo, avec leurs affaires. Ils étaient enfin libres, pensa-t-elle, alors qu'ils luttaient pour communiquer avec les Allemands, qui faisaient de leur mieux pour cacher leur sang-froid effrayé."
 Gehlen.16.d: "Les citoyens ouest-allemands moyens se sont réveillés aujourd'hui avec les troupes de la Bundeswehr activement déployées dans leurs communautés, dans le cadre d'un plan de déploiement massif approuvé par le gouvernement militaire provisoire. Déclarée par un porte-parole du gouvernement comme « une mesure de dissuasion et anti-subversion », toutes les grandes villes, dont Hambourg, Munich, Francfort, Cologne, Bonn et Nuremberg, sont dotées d'une garnison d'au moins une division de soldats, équivalant à environ 8 000 hommes chacune. Composées pour la plupart de soldats d'infanterie ou d'infanterie mécanisée formés au combat urbain et à la police militaire, ces forces ont conservé leur devoir normal de maintien de l'ordre dans les rues et d'établir des barrages routiers autour des grandes places, des bâtiments gouvernementaux, des installations de transport et autres infrastructures vitales, dans le cas d'une attaque terroriste communiste ou d'une autre opposition. Décrit comme une partie seulement du programme anti-insurrectionnel massif du gouvernement militaire, ce déploiement devrait se poursuivre indéfiniment, jusqu'à ce que le gouvernement puisse s'assurer que toutes les villes et communautés sont sécurisées."
 Gehlen.17.d: "DE : Commandant, Commandement du I Corps, Bundeswehr\nÀ : Generalleutnant Reinhard Gehlen, président du comité des officiers de la Bundeswehr, gouvernement militaire provisoire allemand\n\nSUJET : Les souterrains communistes\n\nMonsieur le Général,\n\nJe suis heureux d'annoncer que les opérations anti-insurrectionnelles contre les organisations communistes restantes se sont conclues par l'arrestation et l'exécution réussies de plusieurs dirigeants, notamment des cellules de Hambourg, Francfort, Munich et Bonn. Même si certains membres du personnel de la Bundeswehr ont été tués ou blessés, nous prévoyons que ces chiffres seront faibles par rapport au nombre d'arrestations et de décès de militants communistes.\n\nLes séparatistes restants restent détenus par la Bundeswehr et attendent leur procès public.\n\nLe personnel de la Bundeswehr continue d'effectuer des patrouilles de sécurité périodiques autour des zones préoccupantes et de surveiller les renseignements en collaboration avec le BND et la police fédérale.\n\nSIGNÉ\nCommandant, commandement du I Corps, Bundeswehr"
 Gehlen.18.d: "Alors que Hans détestait habituellement les cours d'histoire, il les a trouvés plus amusants aujourd'hui avec l'arrivée d'un nouvel élève dans sa classe : un garçon hongrois qui a fui. Hans n'avait aucune idée de pourquoi ni comment il était arrivé ici, mais tout ce qu'il savait c'était que le garçon, nommé Szabo, ne parlait pas très bien allemand et apprenait, ce qui lui valait la colère et les taquineries de ses camarades de classe.\n\nRegardant un nouveau manuel sur son bureau, Hans s'assit et posa son sac alors que le cours commençait. Un homme plus âgé à l'air sévère, le professeur, entra et ferma la porte.\n\n \"Guten Morgen, Kinder!\"\n\n « Guten Morgen, Herr Professeur ! » » la classe a répondu à l'unisson.\n\n \"Allez à la page 30 de vos livres, les enfants. Commençons la leçon.\"\n\nHans se tourna consciencieusement vers la page, où elle montrait plusieurs photos en couleur de généraux de la Wehrmacht et de responsables nazis, dont Hitler, Goering et Rommel. C'était la partie de la classe que Hans détestait, où les enfants devaient lire pendant que le professeur attendait.\n\n \"Le régime national-socialiste, bien que responsable de l'autoritarisme et de nombreux morts, a également été important pour le développement de l'Allemagne sur la scène mondiale et la reconstruction de l'industrie et de la société après la fin de la Première Guerre mondiale. Tandis que l'antisémitisme et le racisme endémiques du NSDAP, qui ont abouti à l'emprisonnement de centaines de milliers de minorités, ils ont également été responsables de la création du réseau d'autoroutes, de la voiture Volkswagen, de Fanta soda et de l'expansion de la glorieuse armée allemande qui protège nos frontières et sécurité intérieure. »"
 Gehlen.19.d: "\"Peuple allemand ! Mes concitoyens ! Il est temps de discuter d'un sujet que j'ai reporté depuis longtemps et qui doit être discuté. Notre gouvernement est officiellement parvenu à un consensus sur la nécessité de s'attaquer à l'Holocauste.\"\n\nIl s'arrêta juste à ce moment-là, suffisamment longtemps pour que le caméraman de la télévision lui lance un regard.\n\n \"Les atrocités commises par le régime national-socialiste, dont beaucoup d'entre nous pourraient être complices, étaient incommensurables. On ne sait toujours pas combien d'innocents sont morts, mais on les estime à des millions.\"\n\n \"Nous sommes accusés d'être des fascistes, de vouloir ramener le national-socialisme en Allemagne et de fonder un Quatrième Reich. Ce n'est pas vrai. Oui, de nombreux officiers de ce gouvernement étaient d'anciens officiers nationaux-socialistes et de la Wehrmacht qui ont été complices de soi-disant \"crimes de guerre\" pendant la Seconde Guerre mondiale. Cependant, nous sommes des autoritaires bienveillants. Ce régime prendra fin lorsque la menace du communisme en Allemagne sera éradiquée, lorsque le virus de l'agression soviétique cessera d'infecter notre population. \"\n\n \"Ce gouvernement et la Bundeswehr dans son ensemble condamnent formellement et sans équivoque l'Holocauste et toutes les formes de génocide sous toutes leurs formes, en particulier contre les minorités fondées sur la race ou la religion. Ce n'est pas ce que nous voulons ; en fait, tous les Allemands devraient s'unir contre cet idéal maléfique. Les temps ont changé dans ce pays et nous sommes à l'aube d'un nouveau moment pour l'Allemagne. Merci à tous.\"\n\nLes caméras de télévision étant à nouveau coupées, Gehlen essuya la sueur de son front et quitta le podium. C'était presque aussi douloureux que le discours public contre l'antisémitisme, mais c'était nécessaire, même si cela a suscité la colère des membres de la commission."

 Manstein.0.t: " [GetNewspaperHeader] Coup d'État militaire en Allemagne de l'Ouest"
 Manstein.0.d: "Suite à la montée du Parti communiste allemand et à la transformation ultérieure de la structure constitutionnelle de l'Allemagne de l'Ouest en un système socialiste, la réunification éventuelle entre l'Allemagne de l'Est et l'Allemagne de l'Ouest a été interrompue, en raison d'un cercle secret d'anciens officiers de la Wehrmacht et de politiciens conservateurs, complotant en secret contre le gouvernement de Reimann pendant des années depuis le Bundestagwahl de 1949. Alors qu'ils visitaient le palais de Schönhausen à Berlin-Est pour signer le traité d'unification, les militaires ont pris le pouvoir à Bonn, remplaçant les communistes locaux. Bureaucrates et responsables de l'armée et dénonçant le gouvernement KPD-SPD comme étant illégitime. Erich von Manstein, ancien généralfeldmarschall de la Wehrmacht, a été élu représentant du gouvernement militaire par ses collègues, faisant fonction de chef d'État provisoire jusqu'à ce qu'un nouveau gouvernement puisse être élu."
 Manstein.0.a: "Un ancien maréchal de la Wehrmacht à la tête de l'Allemagne ?"
 
 Manstein.1.d: "ARRÊTÉ PROVISOIRE DU GOUVERNEMENT MILITAIRE NO. 2\n\nBONN, ALLEMAGNE, [GetDateText]\n\nPOLITIQUE RELATIVE AUX MONUMENTS COMMÉMORATIFS DE L'HOLOCAUSTE\n\nReconnaissant les allégations de génocide portées contre le régime national-socialiste en ce qui concerne la soi-disant « extermination des populations juives » ;\n\nNotant avec inquiétude les efforts visant à vilipender et à condamner le régime national-socialiste pour ses actes apparents, sans aucune représentation juste de son point de vue,\n\nConsciente des efforts déployés pour construire des « musées de la mémoire de l'Holocauste » et des mémoriaux, y compris ceux à proximité d'anciens camps de « prisonniers » ;\n\n1. Tous les musées, expositions ou monuments liés à l'Holocauste sont interdits sur le territoire de la République fédérale d'Allemagne\n\n2. Toute discussion sur les atrocités présumées du national-socialisme sera soumise à l'examen du bureau des relations publiques du gouvernement militaire provisoire.\n\n3. Toutes les futures expositions, musées ou monuments commémoratifs seront soumis à un examen par le Bureau de préservation historique du gouvernement militaire provisoire et seront tenus de fournir une représentation équitable du régime national-socialiste et de ses réalisations dans tous les cas.\n\nSIGNÉ\nGénéraloberst Erich von Manstein\nPrésident du Comité des officiers de la Bundeswehr, Gouvernement militaire provisoire de la République fédérale d'Allemagne"
 Manstein.2.d: "Alors que la caméra tournait autour, se dirigeant vers le podium, Manstein ajustait son uniforme, s'assurant qu'il n'y avait pas de plis ou de rides soudaines qui pourraient endommager son uniforme de général de la Bundeswehr parfaitement plat et désormais modifié. Regardant le morceau de papier, il s'éclaircit la gorge une fois de plus avant que le voyant rouge ne clignote, et recevant un signe de tête du caméraman, il commença.\n\n\"Bonsoir, peuple allemand. J'ai le plaisir d'annoncer ce soir que le service judiciaire du gouvernement militaire provisoire a pris les décisions suivantes concernant les accusés des procès truqués pour crimes de guerre de Nuremberg en 1945. Les accusés vivants suivants sont par la présente graciés et ordonnés d'être libérés : Karl Donitz, ancien commandant de la Kriegsmarine ; Walther Funk, ancien ministre de l'Économie et chef de la Reichsbank ; Rudolf Hess, ancien adjoint du Führer ; Konstantin von Neurath, ancien ministre des Affaires étrangères et protecteur du Reich de Bohême et Moravie ; Erich Raeder, ancien commandant de la Kriegsmarine avant 1943 ; Baldur von Schirach, ancien chef des Jeunesses hitlériennes et Gauleiter de Vienne ; et Albert Speer, ancien ministre de l'Armement. En outre, des grâces posthumes seront accordées aux autres accusés qui ont été pendus par les puissances alliées d'occupation sans motif et sans pitié. Nuit. »\n\nAlors que la lumière s'éteignait, Manstein ne pouvait qu'imaginer les réactions, de la part des Allemands ordinaires, mais aussi des Alliés. Il s'en occuperait bien assez tôt."
 Manstein.3.d: "\"Qui est vraiment responsable des problèmes auxquels l'Allemagne est confrontée aujourd'hui ? Pas les nazis, mesdames et messieurs, mais les forces d'occupation alliées qui les ont suivis.\"\n\nUn bourdonnement sourd commença à se répandre dans la pièce, alors que les officiers militaires et les bureaucrates rassemblés assistant à la conférence commençaient à murmurer entre eux.\n\n \"Soyons clairs, les soi-disant Alliés, à la fois les trois pays occidentaux et l'Union soviétique, ont commis leur part d'atrocités contre l'État allemand et le peuple allemand dans leur marche vers la victoire et l'impérialisme de notre pays. Ils ont détruit nos maisons et nos entreprises, violé et tué nos proches et nous ont pris nos moyens de subsistance. Les bombardements stratégiques par les Britanniques et les Américains de Hambourg, Cologne et Francfort ont entraîné la mort de milliers de civils, tous sans responsabilité après la guerre. Et maintenant, ils divisent l'Allemagne et exigent que nous nous plions à leur volonté ! Des deux côtés, mais particulièrement la nôtre ! Pourquoi les puissances alliées ont-elles permis qu'un communiste soit élu ! Sans la puissance de la Bundeswehr et de nos grands patriotes allemands, ce pays serait unifié sous la menace communiste, contrôlé par la horde de Russes impérialistes et assoiffés de sang.\n\nApplaudissants, les officiers ont applaudi, continuant à griffonner des notes et à discuter entre eux.\n\n \"Nous ne pouvons pas changer le passé, mais nous pouvons en contrôler la perception. Blâmer davantage les Alliés, au lieu de les tenir constamment en haute estime, offrira de plus grandes perspectives et racontera les histoires des civils, des membres de leurs familles qui sont morts de leurs mains. Même si nous restons des alliés nominaux de l'Occident, nous ne pouvons pas oublier les atrocités commises contre nous. Merci à tous et bonne nuit.\"\n\nLa salle de conférence a été applaudie lorsque le conférencier, un officier de la Bundeswehr, a quitté la scène."
 Manstein.4.d: "CONFIDENTIEL\n\n[GetDateText]\n\nÀ : Generaloberst Erich von Manstein, Comité des officiers de la Bundeswehr, Gouvernement militaire provisoire d'Allemagne\nDE : Commandement de la Bundesgrenzschutz, gouvernement militaire provisoire d'Allemagne \n\nOBJET : Rapport sur la défense de la frontière intérieure-allemande\n\nGénéral von Manstein,\n\nDepuis que le Comité des officiers a succédé au régime communiste précédent, la frontière intérieure de l'Allemagne est un point de discorde qui reste à ce jour une zone contestée et sujette à l'infiltration communiste venant de l'est. Les plans suivants sont recommandés pour accroître la sécurité de notre frontière.\n\n1. Trois autres groupes de protection des frontières doivent être formés, entraînés et déployés dans des points vulnérables clés, notamment Fulda et d'autres zones qui seraient frappées en cas d'incursion.\n\n2. Le commandement de la Bundesgrenzschutz formera plusieurs groupes de forces de réaction rapide (QRF), qui seront lourdement armés et en garnison à tous les points de passage, et auront l'ordre d'attaquer n'importe quel ennemi.\n\n3. Des consultations plus approfondies avec les forces alliées sont nécessaires pour permettre à la Bundeswehr ainsi qu'aux forces américaines et britanniques d'entrer dans la zone frontalière sans être harcelées par les unités Grenztruppen est-allemandes.\n\n4. Les unités de la Bundesgrenzschutz utiliseront toutes les ressources disponibles pour construire des tours de guet, des « bandes de la mort » supplémentaires, des nids de mitrailleuses et des installations de surveillance.\n\n5. Après approbation de cet ordre, tout le personnel de la Bundesgrenzschutz aura l'ordre de tirer sur toute personne entrant en République fédérale d'Allemagne qui n'a pas de motif valable pour y entrer légalement.\n\nNous espérons que des mesures de sécurité supplémentaires prouveront notre sécurité intérieure et notre intention de maintenir toutes les forces du communisme hors de la République fédérale.\n\nSIGNÉ\nCommandant du commandement de la Bundesgrenzschutz, gouvernement militaire provisoire d'Allemagne"
 Manstein.5.d: "CONFIDENTIEL\n\n[GetDateText]\n\nDESTINATAIRE : Commandants du I Corps, du II Corps, du III Corps et du IV Corps, commandement de la Bundeswehr ; Bureau de l'inspecteur général, commandement de la Bundeswehr ; ; Bureau du commandant du commandement de la Bundesmarine ; Bureau du commandant, Service fédéral de renseignement (BND) du commandement de la Luftwaffe, Service de renseignement militaire et de contre-espionnage (MAD)\nDE : Comité des officiers de la Bundeswehr, Bureau du renseignement du gouvernement militaire provisoire\n\nOBJET : Exercice de guerre SCHWARZ - Plan opérationnel\n\nGénéraux,\n\nVous trouverez ci-dessous le plan d'opération de l'exercice de guerre Schwarz, dont l'objectif principal est de maintenir la préparation opérationnelle de la Bundeswehr et qui est responsable du maintien d'une capacité adéquate contre l'incursion communiste en Europe centrale.\n\n1. Tous les commandements de corps de la Bundeswehr, les unités navales et les escadrons de l'armée de l'air commenceront des exercices d'entraînement à grande échelle dans leurs zones de responsabilité, jusqu'à et y compris dans un rayon d'un (1) mile de la frontière intérieure allemande et de la frontière germano-tchèque.\n\n2. Des munitions réelles et des munitions doivent être utilisées dans ces exercices, bien que la formation et les calendriers spécifiques soient déterminés par les commandants d'unité en coopération avec le comité des officiers.\n\n3. Si vous êtes confronté à une résistance de la part du personnel militaire ou des responsables américains, britanniques ou français, adressez toutes les plaintes au Comité des Officiers. Il s'agit d'une opération unilatérale sans interférence de l'OTAN, et les commandants d'unités ont reçu l'ordre d'utiliser toutes les stratégies disponibles pour empêcher toute interférence de forces étrangères.\n\n4. Les unités de renseignement reçoivent l'ordre de déterminer la perception de l'exercice par les forces occidentales ainsi que par les forces est-allemandes et soviétiques. Toutes les stratégies pour atteindre cet objectif sont approuvées.\n\n5. Le Comité des officiers ordonne par la présente au Bureau des relations publiques du gouvernement militaire provisoire d'Allemagne d'enregistrer, de produire et de distribuer des images des exercices, disponibles pour le public et l'étranger.\n\nSIGNÉ\nGénéraloberst Erich von Manstein\nPrésident du comité des officiers de la Bundeswehr ; Gouvernement militaire provisoire d'Allemagne."
 Manstein.6.d: "À l'extérieur de l'immense campus du bâtiment IG Farben, deux voitures de fonction Mercedes-Benz W120 noir de jais se sont garées dans l'entrée. Manstein, accompagné de ses adjoints Hans Speidel et Adolf Heusinger, ainsi que d'une pléthore d'officiers d'état-major, descendent, leurs bottes craquant contre le trottoir, à l'approche de l'entrée, serrant la main d'un officier d'état-major américain venu les saluer.\n\n « Bienvenue au bâtiment du quartier général du commandement américain en Europe, général von Manstein.» Souriant légèrement, remarqua Manstein en se tournant vers ses collègues. \"Il portait un nom différent la dernière fois que j'étais ici, lieutenant.\" \n\nL'Américain rit légèrement. \"Oui, monsieur. On nous a dit de ne plus l'appeler ainsi, mais plutôt le Pentagone de l'Europe.\"\n\nCela a suscité un petit rire de la part de certains, mais Manstein et ses officiers sont restés silencieux alors qu'ils traversaient le bâtiment caverneux pour se rendre à une salle de conférence. En entrant, Manstein a serré la main de chacun des commandants assis là, dont deux Américains, un Britannique et un officier français.\n\nL'officier supérieur américain, le général Alfred Gruenther, a ouvert la séance. \"Merci d'être venu ici pour nous rencontrer, Général Manstein. C'est un plaisir d'entendre enfin quelqu'un au Comité des Officiers.\"\n \"De même, Général. Passons maintenant aux choses sérieuses.\"\n\n \"Oui, Général Manstein. Nos supérieurs sont préoccupés par vos positions en matière de politique étrangère, maintenant que vous avez pris le pouvoir après l'ancien régime communiste. Nous voulons nous assurer que vos intérêts correspondent aux nôtres et que les Alliés peuvent aider l'Allemagne de toutes les manières possibles.\" L'officier britannique hocha la tête, tandis que l'officier français regardait le sol.\n\nErich regarda autour de lui, faisant un signe de tête à Speidel et Heusinger, avant de parler. \"Généraux, il n'y a pas de quoi s'inquiéter. Je ne voulais pas faire de mal dans ma rhétorique précédente sur les atrocités commises par les Alliés pendant la guerre. Cela avait pour but d'amener le peuple allemand à nous soutenir, tout en rejetant la faute sur les Soviétiques. Même si, vous devez l'admettre, vos pays étaient responsables de la mort de nombreux civils.\"\n\nL'officier subalterne, commandant de l'armée américaine en Europe, a pris la parole. \"Général Manstein, même si nous apprécions maintenant vos éclaircissements, il est primordial que l'Occident reste uni face aux Soviétiques. Vous ne pouvez pas nous condamner pour les actions que nous aurions pu entreprendre contre les nazis.\"\n\n \"Je peux, et je le ferai. Laissez-moi être clair. Le Comité des officiers promulguera ce qu'il veut, en tant que gouvernement allemand. Vos pays soutiennent notre régime, maintenant faisons ce que nous voulons. \"\n\nLes bottes claquèrent à nouveau, les officiers parurent perplexes lorsque la porte claqua, les Allemands partis."
 Manstein.7.d: "Alors que l'officier de la police militaire américaine tournait au coin, le fusil en bandoulière, il laissa tomber sa cigarette allumée de surprise, alors que deux Mercedes noires le dépassaient à grande vitesse, avec des drapeaux allemands plantés sur leur capot. Trois secondes plus tard, un petit camion camouflé est passé à toute allure, avec au volant ce qui semblait être des soldats. Sautant dans sa Jeep de patrouille, il a contacté le quartier général par radio, pour ensuite apprendre qu'« une visite diplomatique était prévue et qu'il n'y avait pas de quoi s'inquiéter ». Non satisfait, il a commencé à conduire, suivant le cortège de loin.\n\nAlors que Manstein et Speidel sortaient de leur voiture au Rathaus Schoneberg, siège du maire de Berlin-Ouest et du Sénat de Berlin-Ouest. Au passage, le camion derrière a déposé deux escouades de soldats armés de la Bundeswehr, qui se sont rapidement mis en route pour former un périmètre et sécuriser la zone. Serrant la main du maire, Manstein échangea quelques mots avant que le cortège ne reprenne sa route, se rapprochant de plus en plus de la zone soviétique.\n\nEn approchant de la Porte de Brandebourg, le cortège s'est arrêté près de la Pariser Platz, répétant une fois de plus la procédure, ce qui a un peu plus choqué les piétons locaux qui observaient ce qui se passait, ainsi que le député américain qui les avait suivis.\n\n Il a vu apparaître un soldat avec une caméra, tandis que Manstein et le maire de Berlin-Ouest se tenaient ensemble, souriants.\n\n \"Nous affirmons le contrôle ouest-allemand de Berlin et exhortons toutes les parties alliées à renoncer immédiatement à leurs revendications sur Berlin, car il s'agit d'un territoire allemand légitime. Toutes les tentatives du régime illégitime de l'Allemagne de l'Est, qui est contrôlé par ses maîtres soviétiques, de nous prendre notre territoire se heurteront à une force écrasante. Que ceci soit un avertissement. C'est tout.\"\n\nAlors que le soldat avec la caméra l'éteignait et s'éloignait, le groupe a été approché par plusieurs policiers est-allemands et un officier soviétique. Le GI américain reprit sa radio, les informant de la situation, mais sans s'impliquer. Les tensions à Berlin ne feraient qu'augmenter à partir de là."
 Manstein.8.d: "Aux dirigeants gouvernementaux de la soi-disant « République démocratique allemande », désormais considérée dans le monde entier comme un État fantoche illégitime de l'Union soviétique,\n\nVous connaissez sans doute les sentiments et les intentions de la République fédérale à l'égard de votre pays et de ses prétentions à la souveraineté. Notre pays et notre peuple ont été très clairs sur leur position à l'égard du communisme, et il est clair que nous ne laisserons pas les forces du mal, communistes et suceuses de sang, s'interposer entre une Allemagne unifiée et capitaliste pour tous.\n\nQue ceci soit un avertissement pour le gouvernement fantoche de la RDA : la République fédérale, sous ma direction du Comité des officiers et grâce à la force et aux capacités de la Bundeswehr, unifiera par la force cette grande nation qu'est l'Allemagne.\n\nC'est votre dernière opportunité de rechercher un règlement pacifique. La République fédérale acceptera l'annexion de la RDA à condition que toute trace de communisme disparaisse. Nous sommes prêts à venir à la table, mais nos forces sont prêtes à frapper. Nous sommes prêts.\n\nSIGNÉ\nGénéraloberst Erich von Manstein\nPrésident du Comité des officiers de la Bundeswehr, gouvernement militaire provisoire allemand"
 Manstein.9.d: "C'était un jour pluvieux et Manstein était assis dans son bureau, des télégrammes éparpillés autour du bureau, des cigarettes encore allumées dans le cendrier et des téléphones qui sonnaient sans décrocher, tant à l'intérieur qu'à l'extérieur du bureau. Il savait précisément pourquoi ; la déclaration aux Allemands de l'Est était devenue entièrement publique et, malgré ses désirs, les Alliés occidentaux et les Soviétiques perdaient la tête. Il n'avait pas parlé aux autres généraux depuis avant d'envoyer la déclaration et n'attendait pas de réponse positive. Prenant un stylo pour dicter une nouvelle série d'ordres à la Bundeswehr, qui était en alerte, Manstein fut surpris d'entendre une agitation à l'extérieur de son bureau, puis la porte s'ouvrit en grand.\n\nLe général Hans Spiedel, l'un de ses adjoints, se tenait debout, une main sur un pistolet dans son étui, l'autre tenant un jeu de papiers dactylographiés. Derrière lui se tenait un lieutenant accompagné d'un escadron complet de soldats de la Bundeswehr, tous armés.\n\n \"En vertu des pouvoirs qui me sont conférés par la Bundeswehr et le gouvernement militaire provisoire d'Allemagne, je vous place, Erich von Manstein, en état d'arrestation pour mise en danger intentionnelle, négligence, trahison et violation de la loi militaire allemande. Vous devez être déchu de votre grade et détenu jusqu'à ce que votre procédure pénale ait lieu.\"\n\n \"Hans. Vous ne pouvez pas faire ça. Cette déclaration était simplement un avertissement.\"\n\n \"Vous avez mis la Bundeswehr en état d'alerte, putain, Erich ! Savez-vous combien de liaisons militaires avec les Alliés occidentaux m'ont mis dans le cul aujourd'hui ? Vous avez menacé de provoquer une guerre !\"\n\n \"J'avais mes raisons. Je pensais que tu étais avec moi jusqu'au bout, mais apparemment non. Tu ne vaux pas mieux que ces communistes méchants, impies et suceurs de sang dont nous devons débarrasser ce monde.\"\n\nSpeidel, ignorant le commentaire, se tourna vers le lieutenant de la Bundeswehr. \"Fouillez-le, enlevez toutes les armes et menottez-le. Vous connaissez le principe, emmenez-le à la Kaserne, et pour l'amour de Dieu, ne laissez pas le prisonnier sans surveillance.\"\n\n \"Jawohl, Herr Général.\" L'officier salua avant de faire signe à ses hommes d'avancer, qui se mirent rapidement à sécuriser la pièce, confisquant le pistolet de Manstein et le faisant sortir, menotté, de la pièce. Speidel, cependant, est resté. Il savait que le pays serait en proie à des troubles, mais il fallait d'abord passer quelques appels."

 Manstein.10.t: " [GetNewspaperHeader] Hans Speidel prend le pouvoir en Allemagne de l'Ouest"
 Manstein.10.d: "Cela fait un an que le gouvernement militaire provisoire allemand a pris le pouvoir au Parti communiste allemand. Erich von Manstein, président du comité des officiers, a non seulement renversé la politique socialiste de l'administration de Max Reimann, mais a finalement poussé la remilitarisation et l'escalade diplomatique jusqu'au point de rupture. Suite à une confrontation avec Hans Speidel, le commandant en second, Von Manstein a finalement été contraint de démissionner de son poste et est actuellement en état d'arrestation. Hans Speidel assumera les fonctions gouvernementales pour le moment, promettant une déradicalisation rapide des deux côtés et des préparatifs rapides pour mettre fin à la loi martiale."
 Manstein.10.a: "Que se passe-t-il en Allemagne de l'Ouest ?"
 
 Speidel.0.d: "Alors que les officiers et leurs assistants s'entassaient dans la salle de conférence, un air de suspicion régnait autour. La plupart des officiers supérieurs fumaient pour évacuer le stress et, en attendant Speidel, la plupart parlaient entre eux, échangeant des histoires, des opinions et partageant des notes.\n\nLorsque le général Hans Speidel entra, le silence tomba dans la pièce, les officiers le regardant avec incrédulité.\n\n \"Bonjour messieurs. Merci d'être venus dans un délai aussi court. Nous avons beaucoup de choses à discuter.\"\n\nS'asseyant en bout de table, Speidel fit signe à la porte de se fermer et les députés quittèrent rapidement la salle.\n\n \"Comme vous le savez tous, le président von Manstein a été arrêté plus tôt dans la journée pour trahison, négligence et mise en danger intentionnelle. Il est détenu par la police militaire dans un lieu tenu secret. Depuis ce matin, j'ai eu des discussions avec des représentants alliés. Ils ont soutenu l'arrestation de Herr Manstein et m'ont formellement encouragé à prendre en charge le Comité indéfiniment jusqu'à ce que le pays puisse être stabilisé. Cependant, je leur ai dit que je devrais obtenir l'approbation du Comité avant que quoi que ce soit puisse être fait. Légitimé. »\n\nLa salle resta silencieuse, avant que le général Adolf Heusinger ne prenne la parole. \"Herr Général ; votre leadership en tant que vice-président du Comité a été admirable. Cependant, je pense que nous, en tant qu'officiers, avons des sentiments mitigés sur le sort de Herr Manstein. S'il est vrai que ses actions auraient provoqué un conflit, je ne suis pas sûr que l'arrestation et l'éviction effective de Herr Manstein stabiliseraient ce Comité.\" Certains des autres officiers acquiescèrent.\n\n \"Même si je vous remercie, Général Heusinger, je pense que mon leadership en tant que président par intérim sera un atout. Le but ultime en ce moment est de calmer la population, ainsi que nos bienfaiteurs que nous avons aliénés à Washington et à Londres. Nous devons réaffirmer notre légitimité.\"\n\n\"Très bien, Herr Speidel. Je pense que ce comité reconnaît votre travail jusqu'à présent et est disposé à vous confirmer comme président par intérim jusqu'à ce que le pays puisse être stabilisé. Merci pour votre service.\"\n\nSpeidel sourit. \"Merci, Général.\""
 Speidel.1.d: "Peuple d'Allemagne,\n\nC'est avec beaucoup d'importance et d'inquiétude que je viens vers vous ce soir, en tant que nouveau président du comité du bureau. Comme l'a rapporté la presse, l'ancien président, le général Erich von Manstein, a été arrêté par la police militaire pour trahison et négligence envers la République fédérale, en abusant du pouvoir de la Bundeswehr pour provoquer un conflit avec le bloc communiste. En cela, le général Manstein a fait perdre à nos alliés occidentaux leur confiance en nous. La réputation de l'Allemagne à l'étranger a été détruite par les actions irresponsables de Manstein, conçues pour servir un objectif idéologique.\n\nLe Comité des Officiers est choqué et consterné par les actions de Manstein et s'engage à prendre toutes les mesures appropriées contre lui pour garantir que justice soit rendue. En tant que nouveau président, je m'engage à tenir le peuple allemand informé des actions du Comité et à garantir que la sûreté et la sécurité de la République fédérale face aux ennemis, tant étrangers que nationaux, soient maintenues.\n\nJe vous exhorte, peuple allemand, à rester calme. Le temps du général Manstein est révolu et une nouvelle ère s'ouvre pour la République fédérale. L'armée restera capable de défendre la nation, mais elle n'est plus en état d'alerte au combat. L'Allemagne restera forte et stable comme jamais, malgré cette courte crise. Je vous remercie tous pour votre temps. Bonne nuit."
 Speidel.2.d: "CONFIDENTIEL\n[GetDateText]\n\nÀ : Général Hans Speidel, président du comité des officiers de la Bundeswehr\nSUJET : L'avenir de la Bundeswehr\n\nGénéral Speidel,\nComme vous le savez, le rôle de la Bundeswehr en République fédérale est extrêmement important : il s'agit de protéger la population et d'assurer une sécurité intérieure adéquate. Cependant, compte tenu des changements intervenus au sein du Comité ces derniers mois, il est devenu clair que la Bundeswehr pourrait avoir besoin de changements, tant en termes de mission que d'organisation et de composition. Les deux propositions suivantes reflètent les recommandations du Bureau de l'Inspecteur général en faveur d'une réforme plus poussée de la Bundeswehr.\n\n1. Maintenir la Bundeswehr dans sa forme actuelle en tant que force de défense. Cela comprendrait des opérations défensives telles que le renforcement de la sécurité à la frontière intérieure de l'Allemagne, la réforme d'une politique d'enrôlement volontaire et la réception d'une assistance défensive telle que des armes antichar.\n\n2. Élargir la Bundeswehr à un rôle offensif, en reconnaissant la nécessité pour les forces allemandes et alliées de contrer la capacité militaire soviétique à l'Est. Cela impliquerait d'étendre les politiques de conscription au-delà de leurs niveaux actuels, d'augmenter les capacités nationales de production d'armes et de former davantage de forces spéciales et d'unités d'intervention aéroportées.\n\nCe sont toutes des propositions générales, mais l'heure est désormais à la réforme de la Bundeswehr. Je suis fermement convaincu que l'une ou l'autre proposition servira bien la population de la République fédérale et maintiendra l'état de préparation opérationnelle.\n\nSIGNÉ\nGénéral Friedrich Foertsch, inspecteur général du commandement de la Bundeswehr"
 Speidel.3.d: "CONFIDENTIEL\n[GetDateText]\n\nÀ : Tous les départements et bureaux\nOBJET : Plan de stabilisation intérimaire\n\nÀ tous les officiers,\n\nAu lendemain de l'éviction du président Manstein du Comité, le Comité des officiers et le gouvernement militaire doivent mettre en oeuvre un plan de stabilisation et de réformes limitées afin de réaffirmer notre légitimité et de récupérer le soutien de ce gouvernement auprès de la population allemande. Les actions suivantes seront prises avec toute la rapidité voulue :\n\n1. Interdire immédiatement les croix gammées, les éclairs SS, les têtes de mort et tous les autres symboles et images nationaux-socialistes associés, à l'exclusion de la Croix de fer ;\n\n2. Interdire à tous les anciens responsables nationaux-socialistes, à l'exception des militaires en exercice, d'exercer des fonctions publiques, de se présenter à des élections ou d'occuper un poste dans la fonction publique ;\n\n3. Poursuivre l'ancien général Manstein pour sa trahison, sa négligence et sa mise en danger délibérée du peuple allemand ;\n\n4. Clarifier la vérité sur les actions de la Wehrmacht, en mettant particulièrement l'accent sur sa participation à des atrocités, tout en gardant à l'esprit l'évolution historique vers la Bundeswehr moderne ;\n\n5. Limiter les activités politiques des communistes et des autres groupes politiques de gauche, y compris le contrôle des publications et la liberté de réunion. J'espère le plus profondément que toutes ces directives seront suivies à la lettre et ne rencontreront aucune résistance, afin que la République fédérale puisse rapidement se stabiliser à nouveau et que notre réputation puisse être sauvée d'une quasi-ruine. \n\nSIGNÉ\nGénéral Hans Speidel, président du comité des officiers de la Bundeswehr"
 Speidel.4.d: "Tandis que Speidel se levait, attendant que l'appareil photo clignote en rouge, il rassembla ses pensées, imaginant comment d'autres généraux et dirigeants avant lui s'étaient comportés à sa place. C'était la première fois que Speidel devait prononcer un discours, quel qu'il soit, et néanmoins sur un sujet sérieux et controversé. Alors que la lumière clignotait en rouge, il inspira et commença.\n\n\"Bonsoir, peuple allemand. Je m'appelle le général Hans Speidel, président du comité des officiers de la Bundeswehr, et ce soir, nous allons discuter d'un sujet qui est profondément ancré dans le coeur et l'esprit de nombreux Allemands : la Wehrmacht. Des milliers de nos citoyens ont servi pendant la guerre et se sont battus honorablement, comme le leur ordonnaient leurs supérieurs. Cependant, l'héritage de la Wehrmacht est bien plus important et mérite d'être abordé.\"\n\n\"Mon prédécesseur souhaitait effacer la vérité sur les actions de la Wehrmacht et l'absoudre de toute responsabilité pour les crimes qu'elle avait commis pendant la guerre. Il souhaitait un retour à la Wehrmacht, un retour au Reich, une idée qui ne serait tout simplement pas acceptée par le Comité ni par le peuple allemand. La Wehrmacht est une institution différente, à une autre époque. Même si certaines de ses actions peuvent être contestées, nous ne pouvons pas laisser perdurer le mythe de la Wehrmacht propre. Même moi, en tant qu'ancien membre de cette force, je l'admets. Aucune force militaire n'est parfaite, peu importe à quel point nous aimerions qu'elle le soit.\n\n\"Peuple d'Allemagne ; je vous exhorte à bien vous souvenir de la Wehrmacht et de ses anciens combattants ; mais à ne pas oublier les énormes dégâts qu'elle a causés dans l'histoire de l'Allemagne et à reconnaître la moralité de la guerre telle qu'elle existe aujourd'hui. Merci à tous et bonne nuit. \"\n\n\"Vous avez très bien fait, Général.\" Le caméraman sourit, faisant reculer la caméra alors que Speidel quittait le podium, s'essuyant le front avec un mouchoir. \"Merci.\""
 Speidel.5.d: "BOUM BOUM BOUM.\n\nLe marteau du juge a résonné dans toute la chambre silencieuse alors qu'il commençait la procédure. \"L'affaire n° 23413, République fédérale d'Allemagne contre Erich von Manstein, sur les accusations de trahison, de négligence et de mise en danger délibérée du peuple allemand, est rappelée à l'ordre. Herr Manstein, comment voudriez-vous plaider ?\"\n\nManstein, vêtu d'une combinaison de prisonnier et enchaîné, se tenait dans une vitrine, flanqué de plusieurs gardes de la police militaire de la Bundeswehr armés de fusils. \"Non coupable, Votre Honneur.\"\n\n\"Très bien, Herr Manstein. Herr Procureur, veuillez commencer par votre déclaration d'accusation.\"\n\nLe procureur, un autre officier en uniforme de la Bundeswehr, se tenait debout, tenant une liasse de papiers. \"Votre Honneur, l'accusé est par la présente accusé de trahison contre la République fédérale, ainsi que de négligence et de mise en danger délibérée du peuple allemand. L'État considère dans ce cas que Herr Manstein, en tant qu'ancien président du Comité des officiers de la Bundeswehr, a utilisé sa position d'autorité pour abuser des pouvoirs de la Bundeswehr, ainsi que pour façonner les relations extérieures de la République fédérale afin de refléter l'antagonisme de nos Alliés et du bloc de l'Est. Herr Manstein a également utilisé sa position. D'autorité pour réintroduire les politiques culturelles communément associées au régime national-socialiste précédent, notamment autorisant les croix gammées et l'interdiction des mémoriaux de l'Holocauste, ce qui a fondamentalement perturbé le peuple allemand et l'a en même temps délibérément mis en grave danger."
 Speidel.6.d: "Alors que Speidel parcourait à nouveau les couloirs du bâtiment IG Farben, il se souvint de la dernière fois qu'il était ici. Une époque malheureuse, où il dut jouer l'adjudant d'un fou. En entrant dans la salle de conférence, en faisant un signe de tête aux députés américains debout à l'extérieur, il espérait que cela se passerait mieux que la dernière fois. Il y avait beaucoup de choses à aplanir.\n\n\"Bonjour, messieurs. Quel plaisir de vous revoir tous.\" Speidel sourit, ôtant sa casquette et serrant la main du général McAuliffe, le nouveau commandant de l'armée américaine en Europe.\n\n\"Ravi de vous revoir, Général Speidel. Heureux de voir que nous sommes en meilleurs termes après la dernière fois.\" Ils échangèrent un petit rire et tandis que Speidel serrait la main des représentants britanniques et français, les assistants se blottirent l'un contre l'autre pendant une brève seconde. Une minute plus tard, la porte était fermée et tous les officiers étaient assis autour de la table de conférence.\n\n\"Tout d'abord, messieurs, je veux juste être clair : comme vous pouvez le constater, beaucoup de choses ont changé en Allemagne et au sein du Comité depuis que nous avons destitué Herr Manstein. Vos gouvernements étaient naturellement préoccupés par ce que faisait Manstein, et en particulier par sa rhétorique contre les Alliés. Soyez assurés que mon leadership a changé le visage de cette rhétorique, et nous sommes attachés à une politique étrangère occidentale forte.\"\n\nLes trois officiers hochèrent la tête. \"C'est bon à savoir, Général Speidel, merci. Cependant, notre préoccupation réside dans votre politique et dans la manière dont vous comptez aborder les Soviétiques. Comme vous le savez bien, nos inquiétudes concernant Manstein étaient justifiées car il menaçait de provoquer une guerre avec l'Allemagne de l'Est et, par défaut, avec l'Union soviétique. Nous voulons l'assurance que vous ne ferez pas de même.\"\n\nSpeidel sourit, ajustant légèrement son uniforme. \"Messieurs, je peux vous assurer que ce gouvernement ne prendra aucune mesure offensive contre les Soviétiques ou le Bloc. Nous devons rester forts et prêts à toute attaque ou incursion soviétique, et gérerons notre défense et notre politique étrangère comme telles. Maintenant, si vous voulez bien m'excuser, j'ai une autre réunion à laquelle je dois me rendre. Vous savez comment rejoindre mon bureau.\"\n\nSe levant, les quatre hommes se serrèrent à nouveau la main et échangèrent des plaisanteries avant que Speidel et son équipe ne quittent la pièce. En s'éloignant, les Américains avaient l'air heureux, pensa-t-il. Une autre crise évitée."
 
 Speidel.7.t: " [GetNewspaperHeader] L'Allemagne de l'Ouest accède aux Nations Unies"
 Speidel.7.d: "Aujourd'hui, la République fédérale d'Allemagne, dirigée provisoirement par un Comité militaire, a officiellement rejoint les Nations Unies en tant que membre à part entière. Auparavant observateur, l'Allemagne de l'Ouest a soumis une candidature au secrétaire général lors de l'accession de Speidel à la présidence du comité des officiers de la Bundeswehr.\n\nOfficiellement confirmée par l'Assemblée générale des Nations Unies, sur le plan idéologique, la promotion de la République fédérale au sein de la communauté internationale représente le début d'un effort visant à récupérer les pertes diplomatiques consécutives à la direction précédente du général Erich von Manstein. Cependant, cet événement représente également un point chaud dans la guerre froide, notamment avec les condamnations sévères de l'Allemagne de l'Est et de l'Union soviétique."
 
 Speidel.8.d: "Zurich (AP) - Le général Hans Speidel, dirigeant ouest-allemand, a atterri aujourd'hui à l'aéroport de Zurich et a été chaleureusement accueilli par des responsables politiques et militaires suisses dans le cadre de ce qui serait le début d'une visite d'État officielle dans ce pays européen neutre au sud de Bonn.\n\nBien que le programme de Speidel et de son entourage n'ait pas été communiqué à la presse, il est prévu que le dirigeant allemand, accompagné de divers responsables politiques, visitera certaines parties de Zurich, Genève et Berne, observera l'armée suisse lors d'un défilé et aura plusieurs réunions avec le Conseil fédéral suisse, le Parlement fédéral et d'autres ministères fédéraux suisses.\n\nCela s'inscrit dans la continuité d'une volonté concertée du gouvernement ouest-allemand dirigé par l'armée de se concentrer sur de bonnes relations avec les pays neutres, par opposition à un alignement strictement occidental. Même si cette visite a attiré peu d'attention de la part des superpuissances, elle reste importante dans les affaires européennes, en particulier compte tenu de l'influence de la Suisse sur les affaires internationales et les relations bancaires."
 Speidel.9.d: "Bonn (AP) - Aujourd'hui, partout dans le monde, les ambassades de la République fédérale d'Allemagne ont officiellement ouvert leurs portes. Dans le cadre d'un nouveau programme du gouvernement militaire provisoire allemand dirigé par le général Hans Speidel, la branche des affaires étrangères de la République fédérale a entrepris de renforcer les relations diplomatiques, notamment avec l'Occident.\n\nAvec l'ouverture des ambassades allemandes au Canada, en Irlande, en Norvège, en Suède et au Portugal, les relations de la junte avec l'Occident continuent de s'ouvrir. Des ambassades allemandes en Corée, en Thaïlande et aux Philippines sont également prévues, dans le cadre d'une approche asiatique. Les relations avec le bloc communiste se poursuivent cependant sans relâche ; le seul développement significatif étant l'ouverture du nouveau bâtiment de l'ambassade d'Allemagne à Moscou, représentant ainsi l'ensemble du bloc de l'Est. Le secrétaire d'État américain a salué la nouvelle ouverture diplomatique de l'Allemagne, reconnaissant ses réalisations et espérant davantage à l'avenir."
 Speidel.10.d: "Les jeeps et les berlines, ornées de drapeaux américains, britanniques et français, se sont arrêtées en gémissant alors qu'elles s'arrêtaient devant la Chancellerie fédérale à Bonn, tandis que leurs passagers descendaient rapidement, se déplaçant vers l'arrière pour commencer à décharger les meubles et le matériel de bureau. Les gardes militaires de la Bundeswehr qui se trouvaient à l'extérieur ont regardé avec admiration et émerveillement les chariots contenant des classeurs, des bureaux et des chaises commencer à entrer dans le bâtiment gouvernemental caverneux.\n\nAlors que les hommes montaient les escaliers, ils tombèrent sur des Allemands encore plus déconcertés, militaires et civils, alors qu'ils effectuaient une journée de travail normale à la Chancellerie. Un mémo avait été envoyé par le bureau de Speidel ce matin-là, mais visiblement presque personne ne l'avait lu, car ils étaient occupés à d'autres tâches, comme diriger le pays.\n\nLe principal responsable américain, portant un bloc-notes, sortit de l'ascenseur, deux soldats derrière lui chargés de leurs chariots de meubles. En longeant un couloir, passant devant les bureaux administratifs, ils s'arrêtèrent devant une grande porte de bureau. En vérifiant son presse-papiers, le responsable américain a cliqué sur son stylo, avant de faire signe aux soldats de commencer à déplacer leur cargaison. Accrochant une pancarte sur la porte alors qu'ils passaient, les passants et les aides militaires ont été surpris de voir apparaître « Mission américaine de surveillance et de réglementation en République fédérale d'Allemagne ». Plusieurs responsables britanniques et français faisaient des choses similaires, avec la Mission britannique de conseil et d'assistance en République fédérale d'Allemagne et la Mission française à Bonn.\n\nSpeidel et son équipe, clairement les seuls à le savoir, ont observé et souri. Il est clair que cette coopération a atteint de nouveaux sommets et il faut espérer que cet oeil plutôt vigilant de la part des Alliés empêchera que des erreurs ne se reproduisent."
 Speidel.11.d: "CONFIDENTIEL\n[GetDateText]\n\nÀ : Général Hans Speidel, président du comité des officiers de la Bundeswehr\nDE : Bureau de la planification économique, ministère des Finances, République fédérale d'Allemagne\n\nOBJET : Proposition de plan économique de la République fédérale\n\nGénéral Speidel,\n\nMaintenant que le pays est correctement stabilisé sous votre direction bien intentionnée, l'économie doit être réformée et stabilisée de la même manière. Voici quelques recommandations empiriques pour la future politique économique.\n\n1. La République fédérale est fortement encouragée à adhérer le plus tôt possible au Fonds monétaire international. Cela contribuera à accroître nos finances internationales et notre balance des paiements et pourrait nous aider à obtenir des prêts à l'avenir.\n\n2. L'expansion des industries charbonnières dans la région de la Ruhr. Les régimes précédents ont tenté d'y parvenir, mais n'ont pas donné de résultats appropriés, et c'est sur ce point qu'il convient de se concentrer en particulier.\n\n3. Faisant suite à la recommandation précédente, fournir des subventions et/ou une assistance aux grandes entreprises allemandes, telles que BMW, Volkswagen et BASF, pour accroître leur efficacité et la valeur de leurs exportations.\n\n4. Enfin, réintroduire les organisations de travailleurs agréées par l'État, afin de maintenir une certaine forme de relations patronales-syndicales qui augmenteront la productivité et l'efficacité.\n\nJ'espère sincèrement que cela ne peut être que le début du retour de la puissance économique allemande non seulement en Europe, mais aussi dans le monde occidental dans son ensemble.\n\nSIGNÉ\nDirecteur général, Bureau de la planification économique, ministère des Finances"
 Speidel.12.d: "\"Bonn (Der Spiegel) - À la surprise de la plupart des observateurs, y compris des Alliés occidentaux, l'Allemagne de l'Ouest a annoncé aujourd'hui le début de son programme nucléaire, dans un discours public et dans un communiqué de presse. Actuellement dirigée par le général Hans Speidel sous la direction d'un comité militaire, la République fédérale devient l'un des rares pays au monde à posséder, sous une forme ou une autre, des capacités nucléaires.\"\n\n\"Bien qu'on ne sache pas actuellement si les Allemands emprunteront une voie pacifique ou s'orienteront vers l'acquisition d'armes nucléaires, les réactions ont été variées ; la plupart des Alliés occidentaux indiquant un soutien tangible et, comme d'habitude, l'Union soviétique et le bloc de l'Est ont dénoncé cette action comme une nouvelle escalade de la guerre froide.\"\n\nSpeidel sourit en déposant le journal, les gros caractères éclaboussant la première page. \"Ils ont raison, après tout. Nous n'avons pas encore déterminé la direction de notre programme.\" Il fit un signe de tête aux deux assistants, un colonel et un major, ainsi qu'à un responsable civil qui se trouvait dans la pièce.\n\n\"Une utilisation pacifique serait plus acceptée au sein de la communauté internationale et bénéficierait d'un plus grand soutien au niveau national. Cependant, son utilisation est limitée dans la mesure où nous ne pourrions l'utiliser que pour la recherche et comme source d'énergie.\"\n\n\"La proposition d'un programme d'armement est également prometteuse, mais elle aboutirait à un mécontentement encore plus grand parmi nos peuples et chez les Alliés. Je suis sûr que les Soviétiques se sentiraient également très menacés par une puissance nucléaire si proche de leur frontière. Mais comme vous le savez, Général Speidel, les avantages pour notre capacité militaire et tactique seraient immenses. Une dissuasion nucléaire de l'OTAN empêcherait les Américains de stationner des armes sur notre territoire.\"\n\n\"Très bien, messieurs. Merci. Si vous pouviez me fournir des rapports de chaque côté, nous prendrons une décision à ce sujet très bientôt.\" Speidel a répondu."
 Speidel.13.d: "Les ampoules des caméras clignotèrent rapidement alors que Speidel sortait de sa Mercedes noire, escorté par deux lieutenants de la Bundeswehr alors qu'il se dirigeait vers la zone dégagée du projet de nouvelle usine de réacteurs fédéraux, où une zone de terre avait été dégagée pour l'inauguration des travaux.\n\nÀ proximité, tenant une paire de pelles dorées, se trouvaient le directeur de l'usine et l'architecte en chef, derrière lesquels se tenait le futur ingénieur en chef de l'usine. Speidel, s'approchant, sourit et discuta avec les hommes pendant quelques minutes avant de recevoir l'ordre, avec les autres hommes, de prendre leurs pelles et de poser pour la presse lors de l'inauguration des travaux. Les hommes souriaient tandis que les journalistes filmaient des images des officiers et des hommes pelletant le sol, marquant symboliquement le début de la construction.\n\nSpeidel a ensuite prononcé un bref discours, faisant remarquer la « puissance de l'énergie nucléaire » et appelant à « l'utilisation sûre et prudente de l'énergie atomique afin d'atteindre l'indépendance énergétique et des capacités de recherche atomique sûres ». Aucune mention n'a été faite de la poussée apparente de la junte vers l'énergie nucléaire pacifique plutôt que vers les armes nucléaires, comme de nombreux experts politiques l'avaient supposé.\n\nDans l'ensemble, le succès était évident et le public a adoré, pensa Speidel en s'éloignant ensuite. L'avenir était radieux et il savait que c'était la bonne décision pour l'avenir de l'Allemagne et de l'énergie atomique."
 Speidel.14.d: "CONFIDENTIEL\n[GetDateText]\n\nÀ : Général Hans Speidel, président du comité des officiers de la Bundeswehr\nDE : Président de l'Agence fédérale de secours technique ; Commandant du commandement de la Bundeswehr\n\nOBJET : Rapport sur les exercices de défense civile nucléaire à l'échelle nationale\n\nGénéral Speidel,\n\nComme vous le savez depuis les premiers briefings, un exercice nucléaire de défense civile s'est achevé il y a quelques jours, après avoir été initialement ordonné et planifié. Dans l'ensemble, ce fut une réussite. Voici les résultats et recommandations suivants :\n\n1. L'exercice partait du principe que les armes nucléaires soviétiques avaient frappé toutes les grandes villes allemandes, notamment Bonn, Francfort, Hambourg, Cologne, Munich et Nuremberg. Cependant, nous n'avons pas initialement pris en compte les frappes lancées contre des cibles alliées en Allemagne, telles que des bases militaires et d'autres formations. Cela augmenterait probablement l'ampleur des dommages infligés au pays lors d'une frappe soviétique et serait utile pour une planification ultérieure.\n\n2. La campagne de relations publiques a été efficace mais pourrait être étendue davantage. L'intérêt initial était faible et le recours à la radio et à la télévision, plutôt que de simples stratégies basées sur le papier, pourrait attirer davantage la population vers un effort volontaire de protection civile.\n\n3. Les efforts d'alerte ont été efficaces, mais doivent être améliorés. Plusieurs alertes ont été émises, mais les raids aériens et les responsables locaux de la protection civile n'ont pas voulu ou pu déterminer l'ampleur des « dégâts ». Les équipes et le personnel médical devraient également être impliqués.\n\n4. Les forces militaires ont bien rempli leur rôle, aidant à intercepter et à repousser certaines tentatives de frappes nucléaires. Cependant, leur rôle devrait être accru pour inclure à la fois ce rôle dans la défense nucléaire aéroportée ainsi que dans la défense contre les frappes tactiques, ainsi que dans la défense conventionnelle contre les forces terrestres soviétiques.\n\nCette agence prévoit de poursuivre ces exercices sur une base annuelle et apprécie la coopération de la Bundeswehr et du Comité des officiers pour faciliter cet exercice pour la défense nationale du pays.\n\nSIGNÉ\nPrésident, Agence fédérale de secours technique, ministère de l'Intérieur, République fédérale d'Allemagne"
 Speidel.15.d: "Peuple d'Allemagne,\n\nAu cours des dernières années, depuis que j'ai pris mes fonctions, l'Allemagne a beaucoup changé, pour le mieux. L'héritage de mes prédécesseurs a été définitivement effacé et l'Allemagne est redevenue un acteur dynamique sur la scène internationale. Notre économie est forte et notre population est heureuse.\n\nMon prédécesseur avant moi était déterminé à ressusciter cette République fédérale sous le nom de Quatrième Reich. Je l'ai arrêté. Le peuple allemand l'a arrêté. Nous avons suffisamment souffert des horreurs du national-socialisme et de son idéologie erronée. Sous mon administration, ce gouvernement a interdit le symbolisme nazi et a pris des mesures proactives pour empêcher les anciens responsables nazis d'occuper des fonctions publiques élevées et importantes. Herr Manstein a été reconnu coupable et emprisonné pour ses crimes. L'État de droit continue de survivre en Allemagne.\n\nLa Bundeswehr, sous ma direction, a évolué pour le mieux. Les forces armées ne sont plus simplement l'outil du leader, pour exécuter ses ordres, mais une force composée d'individus désireux et prêts à défendre leur pays contre les menaces, étrangères et intérieures. La Bundeswehr est équipée, soutenue et prête à relever tous les défis, que ce soit à l'intérieur de nos frontières ou à l'Est.\n\nNotre économie a été reconstruite, ainsi que nos affaires étrangères. Notre réputation sur la scène mondiale et au sein de la communauté internationale s'est renforcée. Nous avons retrouvé notre puissance économique et restons une puissance dans les exportations manufacturières et la finance.\n\nPeuple allemand, vous devriez être fier. Beaucoup a été fait, et grâce à vous. Il y a encore beaucoup à dire, mais je crois que l'époque du gouvernement militaire est révolue. L'Allemagne doit à nouveau faire face aux avantages et aux risques d'un système démocratique, et le Comité du Bureau est prêt à gérer la transition avec dignité et grâce. Merci à tous et bonne nuit."

 Speidel.17.t: "Neutralité de l'Allemagne de l'Ouest"
 Speidel.17.d: "Suite au règlement de Petersberg, l'Allemagne de l'Ouest a exprimé son désir d'adopter une position neutre en Europe, en favorisant une réunification rapide du reste et en favorisant les relations avec les pays neutres en Europe. Même si cela finirait par nous coûter une emprise importante en Europe centrale, Bonn a déclaré qu'il ne s'agirait pas nécessairement d'une décision permanente et qu'elle renoncerait aux revendications actuelles sur la Sarre en signe de confiance. L'engagement international au sein des Nations Unies et d'autres organisations internationales, ainsi que l'engagement en faveur de l'aide humanitaire étaient un point clé de la lettre allemande. Peut-être devrions-nous leur accorder leur souhait. À un moment donné, ils pourraient revenir vers nous."
 Speidel.17.a: "Ces concessions semblent justes. Approuvé."

 Speidel.18.t: "Les Alliés nous accordent la neutralité"
 Speidel.18.d: "Un envoyé de Washington, Paris et Londres est récemment arrivé à Bonn, cherchant à rencontrer personnellement Hans Speidel. Après des explications minutieuses, ils ont accédé à la demande de neutralité du gouvernement en Europe, mais ont déclaré que la possibilité d'un alignement occidental ne devrait pas être jetée à la poubelle pour l'éternité. Après des heures de négociations, les conditions initiales ont été acceptées. La Sarre restera pour l'instant sous occupation alliée, tandis que les bases américaines reviendront en Allemagne, laissant ainsi un espace ouvert pour de futures négociations."
 Speidel.18.a: "Wir gehen noseren eigenen Weg."

 Speidel.19.t: "L'Allemagne de l'Ouest revient dans notre Sphère."
 Speidel.19.d: "Après le règlement de Petersberg, l'Allemagne de l'Ouest a exprimé son désir de revenir dans notre sphère, estimant que cela aiderait l'Allemagne dans les questions économiques et de sécurité."
 Speidel.19.a: "C'est mieux ainsi."

 Speidel.20.t: "L'OTAN lève ses restrictions"
 Speidel.20.d: "En échange de notre engagement en faveur de l'intégration occidentale et de la défense, les États-Unis, la France et le Royaume-Uni ont décidé de lever diverses restrictions en matière de production militaire et d'armée imposées après la Conférence de Potsdamer.\n\nPour l'Occident, le compromis était pragmatique : ils obtenaient un bouclier militaire très discipliné et dirigé par des vétérans contre le bloc de l'Est. Pour nous, cela a assuré la légitimité internationale dont nous avons désespérément besoin. Cependant, ce réarmement provoque un gel diplomatique immédiat avec Moscou, l'URSS considérant cette manoeuvre comme une violation directe des accords d'après-guerre."
 Speidel.20.a: "Barre magique."
 
 Speidel.21.t: "Paderborner Abkommen"
 Speidel.21.d: "Dans la salle stratégique du Palais Schaumburg, Speidel et ses conseillers se sont confrontés à la froide réalité de leur nouvelle voie. En choisissant la voie de la neutralité armée - résolument anticommunistes mais refusant la soumission totale à l'OTAN - ils ont considérablement refroidi les relations avec Washington et Londres. Alors que le Conseil militaire reste optimiste quant à la fin potentielle de l'occupation étrangère, la question de savoir s'il convient d'évoquer la Sarre comme point de négociation a été assez rapidement abandonnée. Le coût d'une politique étrangère indépendante ne peut pas être récupéré pour l'instant."
 Speidel.21.a: "Jouez prudemment."
 
 Speidel.22.t: "Rencontre germano-soviétique à Francfort"
 Speidel.22.d: "La réunion de Francfort a été une affaire glaciale. Le général Hans Speidel, représentant la nouvelle direction militaire ouest-allemande, n'a pas perdu de temps pour annuler formellement les menaces de Manstein. \"Les discussions sur une invasion étaient une illusion du passé\", a déclaré Speidel. \"Notre objectif est la stabilité, pas une guerre d'agression.\"\n\nLa délégation soviétique, conduite par Vladimir Semionov, restait visiblement méfiante. Pour Moscou, Speidel n'était qu'un visage plus diplomatique du même « militarisme prussien » qui avait dévasté l'Est des années auparavant. Tandis que les responsables de la RDA bouillonnaient de ressentiment face à la chute du KPD, les Soviétiques acceptaient une désescalade neutre, uniquement pour éviter un conflit immédiat et imprévisible.\n\nÀ la fin de la réunion, Semionov fit une dernière remarque mordante : « Il est sage de votre part de vous retirer, Général. Nous avons remarqué que les Allemands sont bien meilleurs pour rédiger des retraites formelles que pour survivre aux hivers russes.\n\nSur ce, les Soviétiques sont partis, laissant derrière eux une paix froide et fragile."
 Speidel.22.a: "Je suppose que c'était avant l'invention des bonnes manières !"
 Speidel.22.b: "Nous vous surveillerons, Bonn."
 
 Speidel.23.t: "Réintégration des anciens soldats de la Wehrmacht"
 Speidel.23.d: "La question du réarmement nous amène à la question importante du recrutement. Nous devons créer des forces armées qui servent non seulement l'état-major, mais aussi les valeurs et la culture du passé de l'Allemagne, ainsi que son présent démocratique, donné par la Loi fondamentale.\n\nUn nombre plus élevé d'environ 18 millions entre en discussion lors de l'évaluation de la participation au sein de l'ex-Wehrmacht. Il s'agit maintenant de débattre de l'opportunité d'accueillir à contrecoeur tous les anciens soldats de la Wehrmacht dans la structure de l'armée allemande ou de procéder à une vérification minutieuse de leurs antécédents. Étant donné que la plupart des données et des documents importants ont été soit détruits par les SS, soit réduits en cendres à la suite des bombardements terroristes alliés, il s'avérera sûrement assez difficile de rappeler les traces ou nos recrues."
 Speidel.23.a: "Faites-en une exception. Pas la norme."
 Speidel.23.b: "Refuser des guerriers courageux ? Pas une chance."
 
 Speidel.24.t: "Débat sur les soldats de maintien de la paix allemands"
 Speidel.24.d: "Suite à l'admission de l'Allemagne de l'Ouest aux Nations Unies, un débat controversé a éclaté concernant la participation de la Bundeswehr aux missions internationales de maintien de la paix. Le gouvernement est profondément divisé sur la question. Une faction considère de tels déploiements comme un risque inutile, arguant qu'ils mettent en danger de précieux soldats dans des conflits étrangers qui ne menacent pas directement la nation. À l'inverse, les partisans insistent sur le fait que la participation est essentielle pour démontrer l'engagement de l'Allemagne en faveur de la sécurité et de la paix mondiales, tout en offrant une opportunité stratégique unique de recueillir des renseignements sur les formes alternatives de guerre sur le terrain."
 Speidel.24.a: "Cela pourrait nous donner la possibilité de nous adapter à d'autres types de guerre."
 Speidel.24.b: "Non! Cela ne nous intéresse pas."
 
 Speidel.25.t: "Le sort des anciens bureaucrates du NSDAP et du KPD"
 Speidel.25.d: "L'appareil d'État, la bureaucratie, sont paralysés. Même si nous méprisons les idéologies du passé, la réalité est que les seuls hommes qui savent diriger un bureau des impôts, un registre ou un ministère sont souvent ceux qui détenaient les livres du parti, qu'il soit brun ou rouge. Le conseil est divisé : devons-nous donner la priorité à la pureté morale et risquer des déficits administratifs, ou laissons-nous soigneusement les anciens bureaucrates reprendre leur service ?"
 Speidel.25.a: "Ils pénètrent dans la bureaucratie !"
 Speidel.25.b: "Grâce à des vérifications minutieuses et approfondies des antécédents, nous pouvons reconstruire une bureaucratie efficace."

 Speidel.26.t: "Un million de cafés"
 Speidel.26.d: "C'est un jour de liesse à Wolfsburg. La millionième Volkswagen vient de sortir de la chaîne de montage, brillante de sa peinture dorée festive et parsemée de strass. Cette voiture a conquis les routes d'Europe et d'Amérique. « Made in Germany » n'est plus un avertissement, mais un label de qualité, et la Coccinelle en est la charmante ambassadrice."
 Speidel.26.a: "Vrooooom !"
 
 Speidel.27.t: "L'Allemagne de l'Ouest demande le statut de fin de l'occupation"
 Speidel.27.d: "Les télégrammes de Bonn se font de plus en plus insistants. Le gouvernement allemand affirme que le statut d'occupation est une entrave obsolète qui l'empêche de contribuer efficacement à ses capacités défensives. Au Pentagone et au Département d'État, les avis sont partagés. Alors que nous avons besoin d'une Allemagne de l'Ouest souveraine comme rempart contre les Soviétiques, nos alliés français et britanniques hésitent à supprimer les contrôles sur la puissance allemande. Cependant, étant donné que l'Allemagne de l'Ouest a déclaré son alliance avec la sphère occidentale, elle mériterait tout simplement de relâcher son emprise sur le pays. Nous devons décider si le moment est venu de traiter notre ancien ennemi comme un partenaire à part entière."
 Speidel.27.e: "Les télégrammes de Bonn se font de plus en plus insistants. Le gouvernement allemand affirme que le statut d'occupation est une entrave obsolète qui l'empêche de contribuer efficacement à ses capacités défensives. Au Pentagone et au Département d'État, les avis sont partagés. Alors que nous avons besoin d'une Allemagne de l'Ouest souveraine pour faire tampon contre les Soviétiques, nos alliés français et britanniques hésitent à supprimer les contrôles sur la puissance allemande. Étant donné que l'Allemagne de l'Ouest a déclaré sa position neutre en Europe, la question reste ouverte de savoir si elle méritait que nous relâchions notre emprise sur le pays. Bien entendu, nous continuerions d'exercer une influence sur Berlin et l'Allemagne de l'Ouest aussi longtemps que les Soviétiques resteraient en Allemagne de l'Est. Nous devons décider si le moment est venu de traiter notre ancien ennemi comme un partenaire à part entière."
 Speidel.27.a: "Accordez-leur leur souveraineté."
 Speidel.27.b: "Ils ne sont pas encore prêts."
 Speidel.27.c: "Laissons cette question à Washington."
 
 Speidel.28.t: "Le statut de fin de l'occupation"
 Speidel.28.d: "Un message historique est arrivé de la Haute Commission Alliée. Les négociations ont été couronnées de succès et les puissances occidentales ont accepté de révoquer formellement le Statut d'occupation. Si les troupes alliées resteront sur notre sol pour garantir la sécurité de l'Europe occidentale contre la menace soviétique, elles ne sont plus des occupants, mais des partenaires. La République fédérale est désormais un État souverain, libre de décider de son propre destin."
 Speidel.28.e: "Un message historique est arrivé de la Haute Commission Alliée. Les négociations ont été couronnées de succès et les puissances occidentales ont accepté de révoquer formellement le Statut d'occupation. Bien qu'elles soient réticentes à rappeler les troupes alliées, toutes les forces restantes évacueront notre sol, car elles ne sont plus des occupants. La République fédérale est désormais un État souverain, libre de décider de son propre destin."
 Speidel.28.a: "Libre!"
 
 Speidel.29.t: "Les Alliés nient la souveraineté"
 Speidel.29.d: "Un message qui donne à réfléchir est arrivé du Département d'État américain. Malgré notre reprise économique et notre stabilité politique, Washington - sous la pression de Paris et de Londres - a décidé qu'il était prématuré de lever complètement le statut d'occupation. Les hauts commissaires conserveront leur autorité suprême et leur droit de veto. Il semble que nous n'ayons pas encore pleinement gagné la confiance nécessaire pour être égaux."
 Speidel.29.a: "Décevant, mais il faut persister."
 
 Junta_Dem.1.d: "Alors que le Comité des officiers de la Bundeswehr, dirigé par Gehlen, progresse, plusieurs constats sont apparus. D'une part, la presse restreinte d'Allemagne de l'Ouest, ainsi que les observateurs extérieurs, pensaient largement que le Comité des Officiers ne durerait pas éternellement. En réalité, les objectifs fondamentaux des officiers ont été atteints et l'avenir semble incertain.\n\nLa pression des Alliés s'est accrue, notamment sur le général Gehlen, pour qu'il cède le pouvoir en faveur d'élections démocratiques. Convaincus que la République fédérale a été débarrassée de toute opposition communiste, les représentants des États-Unis et de Grande-Bretagne ont « encouragé » Gehlen à entamer le processus électoral.\n\nGehlen et ses adjoints, bien qu'assez mécontents de cette perspective, ont accepté, à contrecoeur, car ils considèrent que le soutien et l'aide militaire occidentaux sont cruciaux pour le maintien et les capacités continues de la Bundeswehr. On s'attend à ce que Gehlen utilise son pouvoir politique et son influence déjà accumulés pour soutenir ouvertement les partis politiques conservateurs et nationalistes, dans le but de faire légitimement pencher la balance en faveur d'élections libres et équitables à venir.\n\nL'avenir de l'Allemagne de l'Ouest semble incertain, alors que l'opinion publique se tourne avec prudence vers le général Gehlen et le comité des officiers pour fournir des orientations et un État de droit suffisants pour ramener le pays à la démocratie."
 Junta_Dem.2.d: "Alors que le Comité des officiers de la Bundeswehr, dirigé par le général Hans Speidel, maintient son règne de stabilité en Allemagne de l'Ouest, les Alliés occidentaux s'inquiètent de plus en plus du maintien du régime. Bien que le général Speidel soit considérablement plus libéral que certains de ses collègues officiers de la Bundeswehr, il n'en reste pas moins un officier militaire, avec une expérience antérieure dans les forces de la Wehrmacht.\n\nLa pression des Alliés occidentaux, qui supervisent et conseillent théoriquement la junte, a culminé avec leur demande au Comité et à Speidel de céder le pouvoir, en échange d'élections libres et équitables. L'équipe de Speidel aurait été plutôt ennuyée par cette perspective, mais aurait cédé en raison de son alignement et de sa coopération antérieurs avec les puissances occidentales.\n\nLa plupart des experts politiques et des observateurs extérieurs s'attendent à ce que Speidel soutienne ou soutienne les partis conservateurs qui devraient se présenter aux prochaines élections, en particulier l'Union chrétienne-démocrate (CDU).\n\nPar ailleurs, on ne sait rien de l'avenir de l'Allemagne de l'Ouest, car le régime démocratique est en jeu. Le monde, des deux côtés du rideau, est impatient de voir ce qui en résultera et ce que le peuple de la République fédérale décidera de faire."
 Junta_Dem.3.d: "\"Bonn (Der Spiegel) - Aujourd'hui, devant le bâtiment de la Chancellerie fédérale, plusieurs généraux, membres du Comité des officiers de la Bundeswehr, dont le président général [WGR.GetLeader], ont officiellement annoncé leur soutien à l'Union chrétienne-démocrate (CDU) et au Parti allemand (DP) lors des prochaines élections provisoires en Allemagne de l'Ouest.\"\n\n\"Après avoir annoncé leur intention d'organiser des élections libres et équitables pour revenir à un régime démocratique, les généraux ont immédiatement décidé de soutenir la CDU et le DP, tous deux considérés comme des partis conservateurs, de droite et nationalistes. Cela n'a pas été considéré comme surprenant, dans la mesure où ces partis continueraient d'employer les officiers susmentionnés, ainsi que le soutien judiciaire des Alliés occidentaux à des fins géopolitiques.\"\n\nLe fonctionnaire de la CDU, déposant le journal. Très bien. Oui, ils ramenaient la démocratie, mais depuis que la gauche avait été anéantie, il ne restait plus que les conservateurs et la droite. Victoire garantie pour la CDU, estime-t-il."
 Junta_Dem.4.d: "« Peuple d'Allemagne,\n\nJe suis venu vous adresser ce soir un sujet important qui concerne l'avenir de cette grande République fédérale, dans laquelle vous et moi avons le plaisir de vivre.\n\nAprès de longues délibérations, les membres du comité des officiers de la Bundeswehr et moi-même avons décidé que le temps de notre régime stabilisateur était révolu. La République fédérale s'est débarrassée de toute infiltration communiste et, dans notre bienveillance, nous avons accompli beaucoup de choses sous le régime et la supervision militaires.\n\nLe Comité organisera, une fois tous les préparatifs appropriés terminés, des élections provisoires pour la République fédérale. Ces élections ramèneront ce pays à un système démocratique, garantissant que les voix du peuple seront mieux entendues et que notre réputation internationale continuera de s'améliorer.\n\nNous recevons un soutien important de nos alliés aux États-Unis, en Grande-Bretagne et en France dans cette affaire. Je vous assure, en tant que président du Comité, que nous faisons de notre mieux pour garantir des élections appropriées, équitables, mais exemptes de subversion ou de trucage communiste. Plus de détails paraîtront dans la presse dans les semaines à venir. Bonne nuit.\"\n\nAlors que la lumière de la caméra s'éteignait pour la dernière fois. Gehlen savait que c'était fini, que ce serait sa dernière apparition à la télévision et que bientôt, il serait relégué aux affaires d'espionnage. Ce travail a été couronné de succès et le peuple allemand l'en a remercié, mais il était temps de remettre les rênes du pouvoir."
 Junta_Dem.5.d: "« Peuple d'Allemagne,\n\nCe soir aura lieu un discours important, un moment capital dont toute la République fédérale se souviendra pendant des années. Ce n'est pas facile à dire, mais le monde change, tout comme ce grand pays.\n\nSur les conseils et le consentement de nos alliés, dont les États-Unis, la Grande-Bretagne et la France, le Comité des officiers de la Bundeswehr a décidé de se retirer et de convoquer des élections fédérales provisoires. Nous le faisons avec tout le sérieux et la formalité requis.\n\nCe pays a vécu beaucoup de choses depuis le début de cette décennie, sans parler des quinze dernières années. La décision de ce comité était bienveillante et nécessaire à la sécurité de la République fédérale. Mon prédécesseur a été évincé et jugé pour la même raison. Il est clair que l'État de droit existe toujours dans ce pays, qu'il soit dirigé par un chancelier démocratiquement élu ou par un officier militaire nommé.\n\nSous la direction de ce Comité, beaucoup a été fait. La menace communiste a été éliminée une fois pour toutes en tant que force dirigeante de l'appareil politique allemand. Notre économie a renaît, nous avons affronté notre passé tumultueux et notre armée a été réformée et élargie. Notre réputation internationale continue de s'améliorer à mesure que nous revendiquons nos droits légitimes sur l'ensemble de l'Allemagne.\n\nCependant, comme je l'ai dit, il est temps pour ce comité de se retirer. Le peuple allemand a suffisamment toléré notre régime et il est temps que nous revenions au service militaire, en servant ainsi le pays. De plus amples détails sur l'élection seront publiés dans les médias et sur les supports officiels. Merci à tous et bonne nuit.\n\nSpeidel soupira, essuyant la sueur de son front alors que la lumière de la caméra s'éteignait. C'était tout, et c'était tout."
 Junta_Dem.6.d: "\"Munich (AP) - Dans toute l'Allemagne, des avions arborant le logo de l'ONU ont atterri aujourd'hui sur des aérodromes, déposant leurs passagers, transportant leurs bagages et étant accueillis par des membres du gouvernement local et des responsables militaires. À la demande du gouvernement ouest-allemand, toujours dirigé par l'armée, la Mission d'observation électorale des Nations Unies pour la République fédérale d'Allemagne devait commencer, avec un contingent international d'observateurs électoraux de l'ONU déployés dans presque tous les bureaux de vote du pays, en mettant l'accent sur les principales villes de Bonn, Francfort, Hambourg, Hanovre, Munich, Nuremberg et Cologne.\n\nIntervenant quelques semaines seulement après que le Comité des officiers de la Bundeswehr, l'organe dirigeant de facto de l'Allemagne de l'Ouest, a annoncé des élections provisoires, la mission de l'ONU vise à garantir que les élections se dérouleront librement et équitablement, en garantissant qu'il n'y ait pas de fraude ou de fraude, et en agissant comme une force d'observation non partisane entre le gouvernement militaire et la population dans son ensemble.\n\nBien que des inquiétudes aient été soulevées quant au fait que la junte ait déjà soutenu des candidats conservateurs, la mission de l'ONU commente que « le Comité avait pleinement le droit de soutenir la CDU et le DP, au motif qu'ils sont des partis politiques légitimes ». On s'attend à ce que l'un des deux partis remporte la victoire et il y aura peu d'opposition de gauche au nouveau gouvernement provisoire à l'avenir.»\n\nLe général [WGR.GetLeader] sourit en posant le papier. « Excellent. Ils sont là pour faire leur travail, et nous sommes là pour faire le nôtre. » Il leva les yeux vers un assistant, assis en face du bureau. « Permettre à l'ONU d'intervenir nous donne plus de légitimité et garantit qu'un parti de droite gagnera sûrement. C'est une situation gagnant-gagnant pour nous. Il sourit en reprenant le papier."

 Adenauer58.0.t: " [GetNewspaperHeader] Konrad Adenauer élu chancelier en Allemagne"
 Adenauer58.0.d: "L'Allemagne est sur le point de mettre fin à son règne militaire. Après des élections nationales, les premiers résultats montrent que l'Union chrétienne-démocrate (CDU) de Konrad Adenauer se dirige vers une nette victoire.\n\nAprès la destitution du gouvernement KPD et l'intervention de l'armée, les Allemands semblent avoir voté pour une voie traditionnelle et sûre. Adenauer, un dirigeant respecté, a promis la stabilité, des liens solides avec l'Occident et une position ferme contre le communisme. Les électeurs, fatigués des troubles passés, semblent avoir choisi sa vision d'une Allemagne sûre et prospère.\n\nLe gouvernement militaire, qui avait promis de restaurer la démocratie, va désormais céder le pouvoir. Il semble que la CDU mènera l'Allemagne vers un nouveau chapitre de régime démocratique, axé sur un leadership calme et conservateur."
 Adenauer58.0.a: "Un gouvernement conservateur pour l'Allemagne."
 Adenauer58.0.b: "Un jour terrible pour les travailleurs allemands."
 Adenauer58.0.c: "Pour la sécurité et le bien-être de l'Allemagne."
    
 Adenauer58.1.d: "« Bonsoir mesdames et messieurs du Bundestag!»\n\nLa voix d'Adenauer a résonné sur le podium alors qu'il faisait face à ses collègues législateurs, au Parlement de Bonn.\n\n« Nous sommes réunis ici à un moment critique de l'histoire de la République fédérale. La démocratie est de nouveau revenue en Allemagne, les officiers de la Bundeswehr et le peuple ayant confié à la CDU le leadership.»\n\n« Ce nouveau gouvernement démocratique, choisi par le peuple, a pour tâche importante de restaurer les principes et les institutions démocratiques dans ce pays. Il ne fait aucun doute que la Bundeswehr a fait preuve de discernement et de retenue dans la direction de ce pays, mais ce temps est définitivement révolu.»\n\n« Ce gouvernement s'engagera à rétablir la malheureuse Loi fondamentale de 1949, à consacrer notre constitution et à définir les devoirs du chancelier. Tout cela avec votre aide.\n\n« Je suis fier de diriger ce gouvernement. Sous la direction de mon gouvernement, je suis convaincu que l'Allemagne poursuivra sa marche vers le succès ! »\n\n« Merci à tous et bonne nuit. Il est temps de se mettre au travail."
 Adenauer58.2.d: "\"Bonn (Reuters) - En signant aujourd'hui un projet de loi à la Chancellerie fédérale, le chancelier ouest-allemand Konrad Adenauer a rétabli la Loi fondamentale de 1949, également connue sous le nom de Grundgesetz, qui faisait office de constitution et de document directeur de la République fédérale jusqu'à ce qu'elle soit abrogée par le chancelier communiste du KPD Max Reimann sous son régime.\n\nMarquant le deuxième mouvement officiel vers des institutions démocratiques en Allemagne de l'Ouest, après la convocation des élections, la Loi fondamentale garantit des protections constitutionnelles à la population et redétermine la structure du gouvernement, y compris les pouvoirs exécutif, législatif et judiciaire.\n\nAlors qu'Adenauer lisait le journal et le déposait, son assistant prit la parole. « Nous y sommes parvenus, mais quelques changements ont été apportés. Cependant, la majorité demeure, et c'est tout ce qui compte.»"
 Adenauer58.3.d: "ARTICLE 147 DE LA LOI FONDAMENTALE DE LA RÉPUBLIQUE FÉDÉRALE D'ALLEMAGNE\n\n(1) Si la République fédérale d'Allemagne est menacée d'une situation d'urgence constitutionnellement définie, la présente Loi fondamentale autorise la formation d'un gouvernement d'urgence qui gérera les fonctions de la République fédérale jusqu'à ce que la déclaration d'urgence soit levée.\n\n(a) « Urgence constitutionnellement définie » est définie comme « toute situation d'urgence, survenant à l'intérieur des frontières de la République fédérale d'Allemagne, qui menace sa souveraineté, sa capacité de défense, ou qui nuit ou met en danger les citoyens de la République fédérale d'Allemagne ».\n\n(b) Le « gouvernement d'urgence » est défini comme « un gouvernement provisoire dont le but exprès est de maintenir les fonctions vitales de base de la République fédérale d'Allemagne, y compris le maintien de l'état de préparation de la défense, de la politique budgétaire et économique, de la politique étrangère et d'autres programmes gouvernementaux nécessaires ».\n\n(2) Tant que la déclaration d'état d'urgence n'aura pas été levée, les élections n'auront pas lieu en République fédérale."
 Adenauer58.4.d: "Alors que Max sortait de son appartement pour se rendre au travail, il a vu une affiche du SPD décolorée, usée et déchirée sur le mur. S'arrêtant une seconde, il revint à la réalité alors qu'il courait vers le tram, se précipitant pour s'asseoir.\n\nEn réfléchissant un instant, il se souvint du SPD d'il y a longtemps, et non de la coquille meurtrie du parti qu'il était aujourd'hui. Le SPD de l'Allemagne d'après-guerre, celui malheureusement coopté par les communistes et autres agitateurs du KPD, avant d'être détruit par la junte de la Bundeswehr qui s'empare du pays. Il avait toujours été de gauche, social-démocrate, mais désormais il n'avait plus aucun parti auquel se joindre.\n\nEn descendant du bus, Max a trouvé son emploi de col blanc, dans un cabinet de comptabilité et de tenue de livres ici à Francfort. En allumant la radio alors qu'il s'asseyait à son bureau, tout ce qu'il entendait était « CDU, CDU ». Grimaçant, il se mit au travail, les heures passèrent à toute vitesse, ne s'arrêtant que pour le déjeuner et une pause café.\n\nMax est sorti de son bureau à 17 heures, complètement épuisé par une nouvelle journée de tables actuarielles stupides. Alors qu'il sortait du bâtiment, quelqu'un lui a tendu un pamphlet, brillamment imprimé avec « CHRISTLICHE DEMOKRATISCHE UNION DEUTSCHLANDS », détaillant la politique de la CDU (qu'il désapprouvait) ainsi que les sections locales et les horaires des réunions. Max haussa un sourcil, sur le point de le jeter, mais il eut une pensée. Il y a eu une réunion ce soir au centre communautaire local ; à quel point cela pourrait-il être difficile ? Après tout, la CDU était une « Union », et ils seraient sûrement disposés à accueillir d'anciens sociaux-démocrates."
 Adenauer58.5.d: "C'était une journée chaude alors que le personnel d'Adenauer faisait la queue devant la Bourse de Francfort, podiums et drapeaux flottants à l'arrivée de la presse, installant ses caméras et prenant des notes préliminaires.\n\nAdenauer est intervenu rapidement à 8h45, alors que les caméras commençaient à clignoter. \"On m'a dit que je devais faire ça rapidement, car le marché a hâte d'ouvrir ce lundi matin.\" Cela a suscité quelques rires dans la foule rassemblée.\n\n\"Bonjour, Mesdames et Messieurs. Nous sommes ici aujourd'hui pour ramener et rouvrir une partie vitale non seulement du système économique allemand, mais aussi de la nouvelle communauté économique européenne. La Bourse de Francfort a joué un rôle essentiel depuis le XIe siècle, lorsque les foires commerciales ont commencé. Elle est considérée comme le père des bourses et a résisté sans faute à deux guerres mondiales et à des occupations militaires. J'ai le plaisir ce matin de rouvrir officiellement la Bourse de Francfort en tant que principale bourse de la République fédérale et, ce faisant, j'espère montrer au monde que L'Allemagne est de retour, pour de bon.\n\nLes applaudissements ont retenti tandis qu'Adenauer souriait un instant, avant de se diriger vers un ruban placé devant l'entrée de la Bourse et de se voir remettre une paire de ciseaux d'une taille comique. S'arrêtant devant les caméras, il a ensuite coupé le ruban sous de nouveaux applaudissements. Une cloche retentit et le marché commença.\n\n Adenauer et son équipe ont observé les courtiers commencer à courir partout, les téléscripteurs commençant à se déplacer en grande quantité dans le bâtiment. La journée d'aujourd'hui a vraiment été une réussite."

 Hellwege58.0.t: " [GetNewspaperHeader] Heinrich Hellwege élu chancelier en Allemagne"
 Hellwege58.0.d: "L'Allemagne se prépare à nouveau à un gouvernement civil après ses premières élections majeures depuis le régime militaire. Le premier décompte montre un bon résultat pour l'alliance du Parti libéral-démocrate (FDP) et du Parti allemand (DP), avec Heinrich Hellwege en position de tête.\n\nCette coalition, combinant des idées économiques libérales et des valeurs conservatrices, semble avoir séduit les électeurs en quête de stabilité et de plus de liberté économique. Hellwege devrait désormais former le nouveau gouvernement, succédant aux chefs militaires qui ont pris le pouvoir pour stabiliser le pays.\n\nLe gouvernement militaire, après avoir tenu parole de restaurer la démocratie, va désormais donner le pouvoir aux élus. Cette victoire du FDP-DP suggère que l'Allemagne recherche un mélange de liberté et d'ordre alors qu'elle rejoint les nations démocratiques, offrant une direction différente de celle de la CDU."
 Hellwege58.0.a: "Un gouvernement national-conservateur pour l'Allemagne."
 Hellwege58.0.b: "Un jour terrible pour les travailleurs allemands."
 Hellwege58.0.c: "Est-ce l'Esprit de 1871 ?"
 
 Hellwege58.1.d: "\"Mesdames et messieurs du Bundestag, c'est un plaisir pour moi de m'adresser à vous tous ce soir.\" » a lancé le chancelier Heinrich Hellwege depuis la tribune, lors de la première réunion du Bundestag depuis que des élections provisoires ont été convoquées par la Bundeswehr.\n\n\"Beaucoup de choses se sont passées depuis la création de cette République fédérale, arrachée aux griffes des nationaux-socialistes et des communistes qui voulaient façonner le peuple allemand selon leurs caprices. Tous deux ont essayé d'utiliser le nationalisme historique pour convaincre le peuple de leurs idéologies radicales, tout en ignorant le véritable nationalisme du peuple allemand.\"\n\n\"Mon gouvernement, élu par le peuple, cherche à changer cela. Le nationalisme allemand est construit sur des valeurs conservatrices, et non sur des valeurs atlantistes et soutenues par l'Occident ! Nous ne serons pas le pion d'une superpuissance comme nous l'avons été pendant des années !\"\n\n\"Le rôle de la religion et de la monarchie dans ce pays a été terni par les valeurs athées et démocratiques qui ont érodé notre valeur historique. Le PD cherche à changer cela, en remettant en cause le rôle de la Maison des Hohenzollern dans la République fédérale et en rétablissant les politiques religieuses vitales dans la loi. Nos valeurs conservatrices s'étendront sur la scène mondiale, en travaillant plus étroitement avec les dirigeants d'Europe et d'Occident sur des questions vitales telles que la sécurité. L'Allemagne est de retour, pour le mieux, en revenant à la tradition.\"\n\nSous de vigoureux applaudissements, Hellwege a souri en terminant son discours. Ce n'était que la première étape de son nouveau mandat de chancelier."
 Hellwege58.2.d: "La salle du Bundestag était en effervescence alors que le corps législatif se préparait à engager l'un de ses premiers débats, les plus controversés à ce jour. Le PD, maintenant ses idéaux nationalistes, a proposé plusieurs manières de réincorporer la maison des Hohenzollern dans le gouvernement fédéral, depuis la suppression de leur statut fiscal et la fourniture de détails de sécurité, jusqu'à des propositions radicales telles que l'octroi au prince Louis Ferdinand, l'héritier du trône, d'un poste au sein du gouvernement, éventuellement en tant que président fédéral.\n\nLes membres de la CDU et la petite faction des sociaux-démocrates qui lui sont associés restent fermement opposés, ces membres de l'opposition s'exclamant que « ce pays est une république, et non plus un empire ! » Les membres du PD et du FDP ont fait marche arrière, tentant de convaincre l'opposition que « la Maison des Hohenzollern est historiquement et culturellement importante et qu'elle ne devrait pas être reléguée aux poubelles de l'histoire ». Cependant, ils ne sont pas convaincus, protestant que les échecs de l'ancien Empire allemand et de la Première Guerre mondiale provenaient de la monarchie, qui contrôlait continuellement le gouvernement et l'État, malgré les signes extérieurs de la démocratie.\n\nCependant, la proposition visant à accorder à la maison des Hohenzollern des avantages fiscaux et une sécurité minimale a gagné du terrain, même auprès des personnalités de l'opposition, qui reconnaissent que les membres de la famille royale ne partiront pas de sitôt et que les consacrer en tant que partie culturelle de l'Allemagne, tout comme les Britanniques l'ont fait, serait utile, sans trop sacrifier. Le seul facteur limitant est de permettre à Louis Ferdinand de se présenter éventuellement à la présidence fédérale, même s'il n'est peut-être pas intéressé par cette opportunité malgré sa relative popularité auprès du public. Que fera le Bundestag ?"
 Hellwege58.3.d: "\"Bonsoir. Merci de m'avoir permis de prendre la parole ici lors de cette réunion de la section locale du Parti allemand. Ce soir, je veux m'adresser à vous tous sur une menace sérieuse non seulement pour notre parti, mais pour la démocratie dans son ensemble. L'influence et l'omniprésence du Parti du Reich socialiste, un proche collaborateur de ce qui était autrefois le Parti de droite allemand, le DRP, est devenue dangereuse, une menace pour notre peuple et une menace pour le continent européen. Le Parti du Reich socialiste n'a aucun doute sur ses objectifs : les idéaux nazis clairs et présents, un restauration d'un Quatrième Reich et retour aux politiques épouvantables de l'époque précédente.\n\n« Même si je ne nie pas que certains membres du SRP ont combattu vaillamment pendant la Première et la Seconde Guerre mondiale, ils ne sont pas aptes à exercer leurs fonctions, notamment en raison de leurs convictions radicales et dangereuses, qui vont à l'encontre de l'ensemble du code moral de notre parti, mais aussi des convictions et de la volonté du peuple et de la République fédérale. »\n\n\"Nous devons faire tout ce que nous pouvons pour empêcher ces monstres d'usurper notre mouvement national légitime, comme ils l'ont fait dans les années 1930, et continuer à maintenir cette République fédérale démocratique, conservatrice et sûre comme elle l'était alors. Cela nécessite votre aide. La coopération de tous est requise dans cette entreprise.\"\n\nHellwege a continué, car ce discours devant la section locale du parti devait inévitablement continuer ; mais le message était clair pour tous, pas seulement pour ceux qui étaient assis dans la salle : le PD n'est pas l'ami des néo-nazis."
 Hellwege58.4.d: "Lorsque Ludwig Erhard entra dans la salle de conférence de la Chancellerie fédérale, il avait l'air à la fois solennel et irrité, car il avait été convoqué la veille. En s'asseyant, il aperçut Hellwege assis à l'autre bout de la table, accompagné de Franz Blucher.\n\n\"Eh bien, maintenant que je suis là, que puis-je faire pour toi ?\" » Entonna Erhard, regardant la table, continuant toujours à se demander ce que Blucher faisait ici.\n\n\"Eh bien, Ludwig, nous avons beaucoup entendu parler de vos idées économiques. Je sais que vous êtes dans le parti d'opposition mais nos idéaux sont similaires aux vôtres et nous aimerions travailler avec vous et faire de vous le ministre de l'Économie.\" Hellwege a ouvert. Blucher se tenait là, hochant la tête.\n\n\"Qu'est-ce que j'y gagne, à part être nommé ministre de l'Économie. Apparemment, c'est votre façon de \"coopérer avec l'opposition\". Voulez-vous vraiment me donner de l'autonomie en matière de politique économique, ou allez-vous me paralyser pour que je fasse tout ce que vous disent vos pulsions monarchistes, Heinrich ? Erhard eut un peu de cloques, faisant ressortir son désaffection.\n\nBlucher intervint. \"Herr Erhard. Nous nous connaissons depuis longtemps et lorsque le chancelier Hellwege cherchait un ministre de l'Economie, je vous ai recommandé, sachant très bien que ce serait votre réponse, ainsi que ce que cela ressemblerait à la CDU et au PD. Mais c'est une affaire difficile. Nous permettons à la CDU de définir la politique économique, car ses idéaux économiques conservateurs et ordolibéraux sont les mêmes que les nôtres. La seule différence est que vous êtes bien plus capable que n'importe lequel de nos responsables du DP, et vous pouvez exécuter votre politique bien plus efficacement. De plus, vous disposez de relations internationales précieuses.\n\nErhard parut s'adoucir, avant de reprendre. \"Je vois. Eh bien, je suis intéressé, mais comme vous le savez probablement, je dois délibérer avec les membres de mon parti avant d'accepter pleinement. Considérez cela comme un oui informel, et j'espère que tout cela est officieux.\"\n\n\"Oui, Herr Erhard, c'est vrai. Nous vous remercions d'avance pour votre volonté de servir le gouvernement, et veuillez nous contacter lorsque vous aurez pris votre décision formelle.\" Les trois hommes échangèrent des poignées de main avant qu'Erhard ne quitte la pièce, probablement pour retourner au siège de la CDU."
 Hellwege58.5.d: "Madrid (AP) - Le chancelier ouest-allemand Heinrich Hellwege a atterri aujourd'hui à l'aéroport de Madrid-Barajas, marquant le début d'une visite de quatre jours dans l'Espagne de Franco. Considéré comme peu surprenant pour le gouvernement conservateur et nationaliste ouest-allemand, Hellwege prévoit de signer un accord pour renforcer les relations bilatérales, ainsi que de visiter le Palais Royal de Madrid et d'autres bâtiments importants de la ville. Hellwege devrait également rencontrer le dirigeant espagnol, le généralissime Francisco Franco, ainsi que d'autres hauts responsables espagnols et franquistes.\n\nPartageant largement des attitudes conservatrices et anticommunistes, la visite de Hellwege est considérée par presque tous les partis avec peu de surprise. La plupart des responsables du PD et de la CDU continuent d'être d'accord avec cette visite, car elle vise à établir des relations bilatérales avec un autre allié anticommuniste européen, tandis que la petite faction sociale-démocrate continue de la dénoncer comme s'inclinant devant les dictatures. Le public allemand reste cependant imperturbable et continue sa vie, sans se soucier des visites diplomatiques lapidaires."
 
 
 ####Old Events###
 
 
 wgr.1.t: "Accepter le WGR au sein de l'OTAN"
 wgr.1.d: "L'Allemagne de l'Ouest nous a demandé de rejoindre l'OTAN. Les acceptons-nous au sein de l'OTAN ? Cela faciliterait grandement notre coopération militaire."
 wgr.1.a: "Oui, acceptez-les."
 wgr.1.b: "Pas d'anciens nazis à l'OTAN."
 wgr.2.t: "Retour en Allemagne"
 wgr.2.d: "L'Allemagne de l'Ouest nous a demandé de rejoindre la République fédérale d'Allemagne, mais notre économie est étroitement liée à la France. Nous pourrions revenir en Allemagne ou nous rapprocher encore plus de la France. Peut-être restons-nous totalement indépendants ? Cela nécessite un référendum."
 wgr.2.a: "Retour en Allemagne"
 wgr.2.b: "Se rapprocher de la France"
 wgr.2.c: "Restez totalement indépendant"
 wgr.3.t: "L'Alsace-Lorraine vers l'Allemagne"
 wgr.3.d: "L'Allemagne de l'Ouest et ses dirigeants fascistes veulent nous arracher l'Alsace-Lorraine par référendum. Nous ne pouvons pas leur permettre de prendre notre territoire !"
 wgr.3.a: "Donnez-le à l'Allemagne"
 wgr.3.b: "Gardez-le"
 wgr.4.t: "L'Occident veut une réunification"
 wgr.4.d: "La République fédérale d'Allemagne est prête à une réunification sous son commandement. Nous ferons partie de l'Occident et romprons toutes relations diplomatiques avec l'Est. Mais après tout, l'Allemagne serait à nouveau unie."
 wgr.4.a: "Unissons-nous !"
 wgr.4.b: "Restez avec l'Est"
 wgr.9.t: "Nouveau Kaiser"
 wgr.9.d: "Il est temps de choisir notre nouveau Kaiser. Nous avons deux options : Louis Ferdinand, prince de Prusse ou la princesse Victoria Louise de Prusse."
 wgr.9.a: "Je vous salue Louis Ier"
 wgr.9.b: "La reine Victoria I"
 wgr.10.a: "Il restera en Allemagne de l'Ouest et c'est définitif. "
 wgr.10.b: "Créer un point d'extradition vers l'Allemagne de l'Est\" wgr.10.t : \"La République démocratique allemande exige Werner Weinhold "
 wgr.10.d: "Nous avons reçu une demande de la République démocratique allemande (RDA) demandant l'extradition du garde-frontière est-allemand Werner Weinhold vers la RDA (République démocratique allemande). Ils ont déclaré qu'il avait assassiné deux soldats est-allemands, puis qu'il avait également fait défection vers l'Ouest. Ils souhaitent le traduire devant un tribunal et le juger. Werner Weinhold, s'il a tué 2 soldats est-allemands, pourrait s'avérer un atout sur le fonctionnement interne des gardes-frontières est-allemands et les positions des soldats. Mais si nous le gardons ici, le gouvernement est-allemand ne sera pas content. Nous devons prendre une décision concernant l'extradition."

 wgr.202.d: "L'élection de 1961 est arrivée. Pour la première fois, le SPD a un candidat chancelier qui n'est pas président du parti : Willy Brandt, le maire de Berlin-Ouest. Après la construction du mur de Berlin, il a gagné de plus en plus de sympathie, tandis que le chancelier Konrad Adenauer a été critiqué pour ne pas avoir suffisamment soutenu la population de Berlin-Ouest. Adenauer devait sauver la majorité absolue de la CDU et de la CSU, mais, compte tenu de son âge et de sa longue mandature en tant que chancelier, de grands doutes existaient quant à sa capacité à diriger le pays pour un quatrième mandat."
 #wgr.12.t: "Starfighter Crisis"
 #wgr.12.d: "It would seem our new fighters aren't as good as it seemed as we had several major accidents over last few days. Our experts theorize that F-104 Starfighter simply isn't designed with our weather conditions in mind. We will have to find some solution."
 #wgr.12.a: "Oh no.."
 wgr.15.d: "Tout est désormais prêt pour l'unification. Bientôt, le Sozialdemokratische Partei Deutschlands et le Kommunistische Partei Deutschlands s'uniront pour oeuvrer vers l'objectif ultime."
 wgr.16.d: "Dernières nouvelles pour la République fédérale d'Allemagne. Le SDP et le KDP ont annoncé une fusion entre les deux partis. Le nouveau parti s'appelle Vereinigte Sozialistische Partei, ou Parti socialiste unifié. Les rapports officiels présentent cette fusion comme une mise en commun volontaire des efforts des partis socialistes. Cependant, certains soupçonnent que la fusion a été plus difficile qu'on ne le laisse croire."
 wgr.17.t: "Perte de Der Alte"
 wgr.17.d: "Konrad Hermann Joseph Adenauer, notre premier chancelier, père du Wirtschaftswunder et homme bien-aimé, est décédé dans sa maison familiale à Rhöndorf. Selon sa fille, ses derniers mots furent \"Da jitt et nix zo kriesche !\" (Argot Kölsch pour \"Il n'y a rien à pleurer!\"). Ses funérailles nationales ont eu lieu dans la cathédrale de Cologne en présence d'un grand nombre d'invités internationaux. Cent quatre-vingts pays étaient représentés, dont quinze dirigeants mondiaux.\nAprès la messe de requiem et le service, ses restes ont été transportés en amont jusqu'à Rhöndorf sur le Rhin à bord du Kondor, avec deux autres engins d'attaque rapide de classe Seeadler de la marine allemande, Seeadler et Sperber comme escortes, « devant les milliers de personnes qui se tenaient en silence sur les deux rives du fleuve ». Il est enterré au Waldfriedhof à Rhöndorf.\nLorsqu'on a demandé aux Allemands ce qu'ils admiraient le plus chez Adenauer, la majorité a répondu qu'il avait ramené les derniers prisonniers de guerre allemands d'URSS, ce qui était devenu connu sous le nom de « Retour des 10 000 »."
 wgr.17.a: "Bleib du im ew'gen Leben"
 Ostpolitik.2.t: "Le Warschauer Vertrag"
 Ostpolitik.2.d: "Aujourd'hui, c'est une nouvelle victoire pour l'Ostpolitik. A Varsovie, le chancelier ouest-allemand [WGR.GetLeader] et le premier ministre polonais Józef Cyrankiewicz ont signé le traité de Varsovie. Le traité engage les deux parties à la non-violence tout en acceptant la frontière existante, la ligne Oder-Neisse, imposée à l'Allemagne par les puissances alliées lors de la Conférence de Potsdam de 1945 après la fin de la Seconde Guerre mondiale.\nSi la Pologne est satisfaite de cet accord, on ne peut pas en dire autant de l'Allemagne de l'Ouest. Là-bas, l'opposition a qualifié cette politique de trahison des intérêts nationaux. Au moment de la signature du traité, les commentateurs ouest-allemands cherchaient à maintenir qu'il ne pouvait pas s'agir d'un règlement définitif de la question de la frontière polonaise, car l'article IV de ce traité stipulait que les traités antérieurs comme l'accord de Potsdam n'étaient pas remplacés par ce dernier accord ; on pourrait donc affirmer que les dispositions de ce traité pourraient être modifiées par un traité de paix final entre l'Allemagne et les Alliés de la Seconde Guerre mondiale, comme le prévoit l'accord de Potsdam."
 SDP_60s.1.t: "Le SDP appelle à une Europe sans nucléaire"
 SDP_60s.1.d: "Le Parti social-démocrate (SDP) au pouvoir en Allemagne de l'Ouest a annoncé qu'il appelait à une Europe dénucléarisée. Le gouvernement a déclaré que les peuples européens sont depuis longtemps pris en otage par la course aux armements nucléaires et par les superpuissances qui déploient des armes aussi dévastatrices à travers l'Europe. Cette annonce a recueilli le soutien non seulement des Allemands, mais aussi des Européens de tout le continent, qui se sentent impuissants face à la menace nucléaire. Au sein de l'OTAN, il y a eu un sentiment de malaise croissant suite à cette annonce. Certains gouvernements sont favorables à cette initiative, tandis que d'autres, notamment les États-Unis, considèrent cette annonce comme un sabotage potentiel qui sape la défense de l'Europe. Certains groupes aux États-Unis suggèrent même que cette annonce prouve que le SDP est un agent soviétique conçu pour saboter l'OTAN de l'intérieur."
 Stammheim.1.t: "Ouverture du Stammheim Supermax"
 Stammheim.1.d: "L'Allemagne de l'Ouest a ouvert une nouvelle prison supermax à Stuttgart. Appelé prison Stammheim Supermax, le gouvernement estime que cet établissement sera l'établissement le plus sécurisé du pays. En effet, la prison n'hébergera pas seulement des prisonniers mais disposera de son propre palais de justice dans lequel les suspects pourront être jugés. Cela s'avérera particulièrement utile dans les cas impliquant des organisations dangereuses, car elles ne pourront pas interférer avec la procédure judiciaire. Le nouveau directeur a noté que la prison pourrait devenir non seulement la prison la plus sécurisée du pays, mais peut-être même du monde. La construction de la prison a pris quatre ans et devrait immédiatement accueillir certains des criminels et suspects les plus dangereux."
 WGRPolitical.1.t: "La Grande Coalition"
 WGRPolitical.1.d: "La coalition de l'Union chrétienne-démocrate (CDU) étant dissoute, elle a annoncé la formation d'une grande coalition avec le Parti social-démocrate (SDP). Cela sauvera le gouvernement qui a perdu ses alliés de coalition, mais garantira également que la coalition contrôle près de quatre-vingt-dix pour cent du Bundestag. Compte tenu des différences idéologiques entre les deux partis, il est probable que le gouvernement aura du mal à maintenir le contrôle. Pour la CDU, cela signifiera une capacité plus fragile à légiférer et davantage de compromis. Pour le SDP, cette annonce a provoqué la colère des partisans de la gauche qui considèrent la Grande Coalition comme une trahison des valeurs du parti. Les étudiants partisans du SDP ont exprimé leur indignation face à cette décision. Les étudiants préparent déjà des manifestations et mènent l'opposition à la coalition, mais le nouveau gouvernement estime qu'il sera capable de gérer une telle dissidence."
 WGRPolitical.2.t: "La succession d'Adenauer"
 WGRPolitical.2.d: "Konrad Adenauer est rapidement devenu le principal homme politique de l'Allemagne de l'Ouest d'après-guerre. Il a profité après la guerre de son licenciement par les Britanniques pour avoir défendu sa position d'égal à égal aux autorités alliées, ce qui lui a valu une légitimité nationale. Il a ensuite oeuvré sans relâche pour faire de l'Union chrétienne-démocrate (CDU) le premier parti politique national. En tant que chancelier, il a défendu les normes et libertés démocratiques. Cependant, il avait promis au pays qu'il démissionnerait avant la fin de son dernier mandat et, suite à certains scandales récents, il ne peut pas se permettre de s'accrocher. Le principal candidat pour lui succéder est Ludwig Erhard, l'homme qui a supervisé la reprise économique et le développement du pays après la guerre. Même si le chancelier Adenauer a des réserves à l'égard d'Erhard, la CDU est catégorique et Erhard est sur le point de devenir le deuxième chancelier de l'Allemagne de l'Ouest"
 WGRPolitical.3.t: "Rupture du SDP et du SDS"
 WGRPolitical.3.d: "Le Parti social-démocrate d'Allemagne de l'Ouest (SDP) a officiellement annoncé sa séparation du Syndicat socialiste des étudiants allemands (SDS). Le SDS s'était formé peu après la fin de la Seconde Guerre mondiale en tant que branche universitaire du SDP. Cependant, depuis l'indépendance, elle s'est constamment trouvée en conflit avec l'institution mère. Plus précisément, le SDS était fermement opposé au réarmement de l'Allemagne de l'Ouest que le SDP soutenait. En outre, le SDS s'est dit préoccupé par le fait que le SDP travaille en étroite collaboration avec les principaux partis idéologiquement opposés aux tenants politiques du SDP. Le SDP a annoncé qu'il expulserait immédiatement de ses rangs tous les membres du SDS. Le SDS a annoncé qu'il agirait dans l'intérêt du peuple et des travailleurs allemands et qu'il ne compromettrait pas ses valeurs à des fins politiques ou pour des intérêts étrangers. On s'attend à ce que davantage de membres de gauche du SDP changent d'allégeance."

 Elysee.1.t: "Le traité de l'Elysée"
 Elysee.1.d: "Le président français et chancelier de l'Allemagne de l'Ouest ont signé aujourd'hui le traité de l'Elysée à Paris. Le traité vise à mettre fin à des décennies de conflit et de rivalité entre les deux puissances d'Europe continentale. Les deux États ont été engagés dans de multiples conflits armés du XIXe siècle à la Seconde Guerre mondiale. Le traité prévoyait des réunions régulières entre les deux États. Les chefs d'Etat doivent se réunir régulièrement et un comité interministériel coordonnera la coopération entre les deux Etats. Les deux pays doivent également coordonner leur coopération en matière de défense et de diplomatie. Les citoyens des deux pays accueillent favorablement le traité et attendent avec impatience une nouvelle ère de paix et de coopération entre deux des puissances terrestres les plus importantes d'Europe. Le gouvernement français espère que cela débouchera sur l'établissement d'une alliance plus étroite pour défier l'hégémonie soviétique et américaine, mais le temps nous dira si l'Allemagne de l'Ouest partagera cet objectif à long terme."
 Ostpolitik.3.d: "Le gouvernement ouest-allemand et l'Union soviétique ont récemment conclu un nouveau traité appelé Traité de Moscou. Les deux gouvernements ont convenu de normaliser leurs relations. Ils se sont également engagés à maintenir la paix internationale, à renoncer à l'usage des armes et à accepter les frontières de l'après-Seconde Guerre mondiale. Le traité reflète la nouvelle politique d'Ostpolitik mise en oeuvre par le gouvernement allemand actuel. En signant le traité, l'Allemagne de l'Ouest a accepté sa frontière avec l'Allemagne de l'Est et ne milite pas pour l'instant en faveur de l'autodétermination allemande. Plus important encore, le gouvernement a accepté que la Pologne contrôle la majeure partie de l'ancienne Prusse orientale. Beaucoup en Allemagne de l'Ouest ont exprimé leur satisfaction face à la réduction des tensions, mais il existe également un mécontentement face au sacrifice des frontières allemandes et de l'autodétermination. Les États-Unis ont exprimé leurs inquiétudes concernant ce traité."
 WGR_Pol.1.d: "Après la Seconde Guerre mondiale, les puissances alliées ont convenu de céder la Prusse orientale historique à la Pologne. L'Union soviétique a appliqué cette décision, garantissant ainsi l'acceptation de l'Allemagne de l'Est. Cependant, l'Allemagne de l'Ouest a déclaré que l'accord d'après-guerre était censé être décidé à une date ultérieure et que l'occupation polonaise n'était pas confirmée. Aujourd'hui, le gouvernement ouest-allemand a réitéré ses revendications sur la Prusse orientale et a déclaré que l'unification allemande incluait la restauration de la Prusse orientale dans la nation. L'Union soviétique et la Pologne ont toutes deux qualifié cette déclaration de provocatrice et d'indication que l'Allemagne de l'Ouest nourrit des désirs territoriaux fascistes qui menacent la paix en Europe. L'annonce ouest-allemande a reçu le soutien de nombreuses personnes dans le pays, mais une grande partie de la population la trouve beaucoup trop provocatrice dans le climat politique actuel."
 RedArmyFaction.20.t: "Le procès Stammheim"
 RedArmyFaction.20.d: "La Faction Armée Rouge (RAF) est une organisation militante d'extrême gauche qui mène des attaques à travers l'Allemagne de l'Ouest. La récente escalade de la violence, des enlèvements et des meurtres a conduit à une crise nationale dans toute l'Allemagne de l'Ouest. Beaucoup en Allemagne se méfient du fait que les partis dominants de gauche pourraient avoir des liens idéologiques avec les militants. Dans cet environnement tendu, il a été décidé de lancer une campagne de répression contre la RAF. Les forces de sécurité travailleront plus intensément pour arrêter les membres et déraciner l'organisation. Les membres de la RAF arrêtés seront détenus dans un isolement total des médias et ne seront pas autorisés à faire des déclarations publiques. L'isolement intense impliquera également l'interdiction aux membres de rencontrer des avocats ou leur famille. Bien que de nombreux Allemands applaudissent la répression, nombreux sont ceux qui craignent que la suppression des droits des membres de la RAF ne reflète trop le passé autoritaire que l'Allemagne a tenté de mettre derrière elle."
 Ostpolitik.4.d: "A Erfurt, les dirigeants de l'Allemagne de l'Ouest ont rencontré pour la première fois les dirigeants de l'Allemagne de l'Est. La réunion a été considérée comme un succès car les deux parties ont convenu de la nécessité d'une plus grande communication et ont exprimé leur désir de désescalade. On s'attend à ce que davantage d'interactions se produisent à l'issue de ce sommet, l'objectif final étant une normalisation des relations entre les deux nations allemandes. Bien que le sommet soit salué comme étant la clé pour parvenir à une paix durable et à une éventuelle unification, de nombreux membres de l'opposition en Allemagne de l'Ouest ont exprimé leur indignation. Ils soutiennent que la réunion légitime le régime est-allemand et ne fera que conduire à une division plus permanente de l'Allemagne. Ils qualifient le sommet de trahison du peuple allemand. Quoi qu'il en soit, le sommet semble être un succès des efforts ouest-allemands visant à mettre en oeuvre l'Ostpolitik, une politique conçue pour apaiser les tensions et normaliser les relations entre l'Allemagne de l'Ouest et l'Europe de l'Est."
 WGR_Viet.1.d: "Aujourd'hui, la République fédérale d'Allemagne a annoncé qu'elle retirerait toutes ses fournitures de munitions et son soutien au conflit vietnamien en Asie du Sud-Est. À l'origine, soutenant le Sud-Vietnam démocratique contre les communistes du nord, les Allemands ont déclaré que soutenir une telle guerre avait affaibli la République allemande à la fois économiquement et militairement et que si la guerre venait de l'Allemagne de l'Est communiste, ils seraient impuissants. Beaucoup pensent qu'une telle décision ne changerait guère l'issue du conflit vietnamien, mais elle a néanmoins un effet sur les relations entre les deux pays. "
 Spiegal_Affair.1.d: "L'affaire Spiegel s'est terminée aujourd'hui avec la démission de Franz Strauss, le ministre de la Défense. Il y a plusieurs mois, le journal Der Spiegel rapportait qu'un haut responsable de l'OTAN avait qualifié l'armée ouest-allemande d'incapable de défendre le pays. Cela a incité Strauss à envoyer la police occuper le journal, à arrêter son personnel et à faire arrêter l'auteur de l'article par la police espagnole à Madrid. Il a affirmé que le journal avait révélé des secrets d'État, mais le public a réagi en lançant des manifestations de rue contre l'approche autoritaire de Strauss. Strauss n'a finalement pas réussi à convaincre un tribunal de juger le journal et le tribunal a plutôt accusé Strauss d'avoir outrepassé son autorité. Strauss a choisi de quitter ses fonctions pour sauver le gouvernement et Der Spiegel a été libéré de l'occupation policière. Beaucoup en Allemagne de l'Ouest considèrent cela comme une victoire pour la démocratie et la liberté de la presse."
 Europe_Space.1.d: "En Allemagne de l'Ouest, le Centre européen d'opérations spatiales est devenu opérationnel cette semaine. L'installation, située à Darmstadt, fera office de centre de contrôle de mission pour l'Organisation européenne de recherche spatiale (ESRO). L'ESRO a été fondée par dix États d'Europe occidentale afin de permettre à l'Europe de participer à la course spatiale internationale en plein essor. Ces États combinent leurs ressources et leur expertise pour propulser l'Europe. À partir du nouveau contrôle de mission, l'ESRO espère gérer et coordonner les opérations futures. Beaucoup en Allemagne de l'Ouest sont fiers d'accueillir cette nouvelle installation et pensent que cela reflète l'importance que les Allemands ont eu dans l'avancement de la recherche spatiale depuis ses débuts. On s'attend beaucoup à ce que le Centre européen d'opérations spatiales lance bientôt des missions dans l'espace avec une sophistication égale à celle de toutes les autres puissances engagées dans la course à l'espace."
 
 
