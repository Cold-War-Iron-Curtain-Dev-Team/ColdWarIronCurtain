 # Submarine Hulls #
 WGR_sub_hull_small_single_0: "201 Classe"
 WGR_sub_hull_small_single_0_desc: "Le Type 201 était la première classe de sous-marins allemands construits après la Seconde Guerre mondiale. Ils ont été construits en acier amagnétique pour contrer la menace des mines navales magnétiques, mais le matériau n'a pas été suffisamment testé et s'est avéré problématique en service dans la Bundesmarine."
 WGR_sub_hull_small_single_1: "Classe 205"
 WGR_sub_hull_small_single_1_desc: "Le Type 205 était une classe de sous-marins diesel-électriques allemands. Il s'agissait de navires à coque unique optimisés pour une utilisation dans les eaux peu profondes de la mer Baltique. Le Type 205 est une évolution directe de la classe Type 201 avec une coque allongée, de nouvelles machines et capteurs. La plus grande différence est que l'acier ST-52 est utilisé pour la coque sous pression, car l'acier non magnétique du Type 201 s'est avéré problématique."
 WGR_sub_hull_small_single_2: "Classe 206A"
 WGR_sub_hull_small_single_2_desc: "Le Type 206 est une classe de sous-marins diesel-électriques (U-boot) développés par Howaldtswerke-Deutsche Werft (HDW). Sa conception est basée sur la classe de sous-marins Type 205 précédente. Ces sous-marins petits et agiles ont été construits pendant la guerre froide pour opérer dans les eaux peu profondes de la mer Baltique et attaquer les navires du Pacte de Varsovie en cas de confrontation militaire."
 WGR_sub_hull_small_single_3: "212A Classe Lot I"
 WGR_sub_hull_small_single_3_desc: "La classe allemande Type 212 est un sous-marin diesel-électrique développé par Howaldtswerke-Deutsche Werft AG (HDW) pour les marines allemande et italienne. Il est doté d'une propulsion diesel et d'un système de propulsion indépendant de l'air (AIP) supplémentaire utilisant des piles à combustible à hydrogène comprimé à membrane échangeuse de protons (PEM) de Siemens."
 WGR_sub_hull_small_single_4: "212A Classe Lot II"
 WGR_sub_hull_small_single_4_desc: "La classe allemande Type 212 est un sous-marin diesel-électrique développé par Howaldtswerke-Deutsche Werft AG (HDW) pour les marines allemande et italienne. Il est doté d'une propulsion diesel et d'un système de propulsion indépendant de l'air (AIP) supplémentaire utilisant des piles à combustible à hydrogène comprimé à membrane échangeuse de protons (PEM) de Siemens."

 #WGR_sub_hull_large_single_0: "Type IX Class"
 #WGR_sub_hull_large_single_0_desc: "The Type IX U-boat was designed by Nazi Germany's Kriegsmarine in 1935 and 1936 as a large ocean-going submarine for sustained operations far from the home support facilities. Type IX boats were briefly used for patrols off the eastern United States in an attempt to disrupt the stream of troops and supplies bound for Europe. It was derived from the Type IA, and appeared in various sub-types."
 WGR_sub_hull_large_single_0: "Classe XXIX"
 WGR_sub_hull_large_single_0_desc: "Les sous-marins de type XXI étaient une classe de sous-marins diesel-électriques allemands Elektroboot conçus pendant la Seconde Guerre mondiale. Cent dix-huit ont été achevés, dont quatre étaient prêts au combat. Pendant la guerre, seuls deux furent mis en service actif et effectuèrent des patrouilles, mais ils ne furent pas utilisés au combat."
