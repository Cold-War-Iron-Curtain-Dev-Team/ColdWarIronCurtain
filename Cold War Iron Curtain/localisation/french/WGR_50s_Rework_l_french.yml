 WGR_FDP_Prov_Nationalize_Coal_and_Steel_Companies: "Nationaliser les sociétés charbonnières et sidérurgiques"
 WGR_FDP_Prov_Expand_Autobahn_and_Rail_Networks: "Développer les réseaux autoroutiers et ferroviaires"
 WGR_FDP_Prov_Expand_Consumer_Goods_and_Automobile_Production: "Développer la production de biens de consommation et d'automobiles"
