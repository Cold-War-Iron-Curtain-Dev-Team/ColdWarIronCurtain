 WGR_CDU_Reach_out_to_FDP_1953: "Y compris le Freie Demokraten"
 WGR_CDU_Reach_out_to_FDP_1953_desc: "Nous pourrions obtenir une majorité de travail avec le Bloc panallemand (BHE) et le Parti allemand (DP) seuls. Cela promet un gouvernement plus facile à gérer avec des partenaires plus conciliants. Toutefois, cette voie est à courte vue et risquée. Avec le FDP à bord, nous pouvons obtenir une majorité des 2/3 au Bundestag, ce qui nous permettra de modifier la Constitution sans l'approbation des sociaux-démocrates."

