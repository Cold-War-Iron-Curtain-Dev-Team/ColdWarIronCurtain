 WGR_Reimann_49_Bundeskanzler_Max_Reimann_desc:0 "L'arrivée de Max Reimann à la chancellerie marque le début d'une ère socialiste pour l'Allemagne. À la tête d'une coalition attachée aux idéaux marxistes, son gouvernement donne la priorité à la distanciation vis-à-vis de l'Occident et au rapprochement avec l'Union soviétique."
 WGR_Reimann_49_Speak_to_the_German_People_desc:0 "Le nouveau chancelier s'adressera à la nation pour exposer sa vision d'une Allemagne socialiste et unifiée. Il appellera le peuple allemand à l'unité, au rejet de l'impérialisme occidental et à l'adhésion aux valeurs marxistes, dans l'espoir d'obtenir le soutien populaire pour le nouveau gouvernement du KPD."
 WGR_Reimann_49_Appease_the_CDU_desc:0 "Face à la résistance de la CDU et d'autres partis d'opposition à l'agenda socialiste, le gouvernement fait des gestes de compromis pour éviter l'impasse politique tout en consolidant son pouvoir."
 WGR_Reimann_49_Destroy_Evidence_desc:0 "Afin de protéger la légitimité de la victoire électorale de 1949, les preuves sensibles de fraude électorale doivent être éliminées pour éviter tout scandale et garantir la stabilité du nouveau gouvernement. Nous avons remporté cette élection de manière honnête et équitable."
 WGR_Reimann_49_Red_Coalition_with_the_SPD_desc:0 "La formation d'une coalition rouge avec le SPD renforce le contrôle de la gauche sur le Bundestag, créant ainsi une alliance puissante visant à transformer l'Allemagne en un État socialiste."
 WGR_Reimann_49_Federal_Bureau_for_Central_Planning_desc:0 "La création du Bureau fédéral de planification centrale centralise le contrôle économique, jetant les bases d'une économie planifiée qui privilégie les besoins collectifs plutôt que le profit privé."
 WGR_Reimann_49_Coal_Production_in_the_Ruhr_desc:0 "Les vastes ressources charbonnières de la Ruhr sont essentielles à la croissance industrielle. Le gouvernement cherche à augmenter la production afin d'alimenter l'économie socialiste et d'assurer l'indépendance énergétique"
 WGR_Reimann_49_Nationalize_Deutsche_Bundesbahn_desc:0 "La Deutsche Bundesbahn est nationalisée afin de placer les infrastructures de transport essentielles sous le contrôle de l'État, garantissant ainsi qu'elles répondent aux besoins de la population et de l'économie planifiée."
 WGR_Reimann_49_Introduce_State_Owned_Consumer_Goods_Stores_desc:0 "Les magasins d'État spécialisés dans les biens de consommation garantiront une distribution équitable des marchandises, réduiront la dépendance vis-à-vis des entreprises privées et favoriseront l'égalité économique."
 WGR_Reimann_49_IG_Farben_State_Owned_desc:0 "Le gouvernement fédéral a décidé d'absorber IG Farben dans le giron de l'État, transformant ainsi ce géant industriel en pierre angulaire de l'économie socialiste et garantissant que ses ressources servent le peuple."
 WGR_Reimann_49_Increase_Steel_Production_in_Salzgitter_desc:0 "L'industrie sidérurgique de Salzgitter est un élément clé de la reconstruction nationale et de la croissance économique. Le gouvernement donne la priorité à l'augmentation de la production afin de répondre aux besoins industriels et militaires."
 WGR_Reimann_49_Debate_Receiving_Marshall_Plan_Aid_desc:0 "Nous devons décider si nous acceptons l'aide du plan Marshall, en mettant en balance le besoin de fonds pour la reconstruction et le risque d'influence économique occidentale."
 WGR_Reimann_49_Denounce_the_Basic_Law_desc:0 "La Loi fondamentale est critiquée comme étant un cadre imposé par l'Occident qui limite la souveraineté et le progrès de l'Allemagne. Le gouvernement de Reimann entreprend des efforts pour la remplacer par une constitution socialiste qui apportera véritablement une démocratie et une liberté indépendantes à l'Allemagne."
 WGR_Reimann_49_New_Constitutional_Convention_desc:0 "Une nouvelle convention constitutionnelle est convoquée afin de rédiger un cadre juridique reflétant les principes socialistes, mettant l'accent sur le contrôle de l'État et les droits collectifs."
 WGR_Reimann_49_Support_the_KPD_desc:0 "Des amendements à la Loi fondamentale sont introduits afin de renforcer la position du KPD et d'ancrer les idéaux marxistes dans le tissu politique allemand."
 WGR_Reimann_49_Socialist_Constitution_desc:0 "Une nouvelle constitution socialiste remplace la Loi fondamentale, créant un cadre juridique conforme aux principes marxistes-léninistes et centralisant l'autorité de l'État."
 WGR_Reimann_49_Marxist_Language_desc:0 "Le réalisme socialiste et le langage marxiste sont intégrés dans les documents gouvernementaux, l'éducation et les supports culturels afin de renforcer la nouvelle orientation idéologique."
 WGR_Reimann_49_Condemnation_from_the_CDU_desc:0 "La CDU et les puissances occidentales condamnent sévèrement le programme socialiste du gouvernement, l'accusant de porter atteinte à la démocratie et de s'aligner sur les régimes totalitaires. Ces accusations ne doivent pas être prises au sérieux, car ils ne sont que les marionnettes des États-Unis d'Amérique, qui cherchent à placer l'Allemagne sous leur contrôle impérialiste."
 WGR_Reimann_49_Augment_the_Powers_of_the_Chancellor_and_Cabinet_desc:0 "Les pouvoirs du chancelier et du cabinet sont élargis, ce qui permet de prendre des mesures décisives pour mettre en œuvre les réformes socialistes et maintenir le contrôle en période de turbulences politiques. Le pouvoir législatif ne pourra donc pas opposer son veto à aucune des lois que nous proposerons."
 WGR_Reimann_49_Limited_Freedom_of_Religion_desc:0 "La liberté de religion et d'expression est restreinte afin de limiter l'opposition et d'assurer la conformité idéologique, tout en conservant l'apparence des libertés civiles."
 WGR_Reimann_49_Pro_Soviet_FP_desc:0 "Le gouvernement s'engage dans une politique étrangère pro-soviétique, privilégiant la coopération avec Moscou et prenant ses distances avec le bloc occidental."
 WGR_Reimann_49_Occupation_Statute_as_Colonization_desc:0 "Le statut d'occupation est dénoncé comme une forme de colonisation occidentale, ralliant le soutien du public contre l'ingérence étrangère dans les affaires allemandes."
 WGR_Reimann_49_Soviet_Technical_Assistance_desc:0 "L'aide technique soviétique est sollicitée pour accélérer la croissance industrielle, moderniser les infrastructures et renforcer les liens avec le bloc de l'Est."
 WGR_Reimann_49_Cominform_Observer_desc:0 "L'Allemagne rejoint le Kominform en tant qu'observateur, manifestant ainsi sa solidarité avec les États socialistes et renforçant son rôle dans le mouvement communiste mondial."
 WGR_Reimann_49_Meet_with_Stalin_desc:0 "Max Reimann rencontre le secrétaire général Staline afin de consolider les relations entre l'Union soviétique et l'Allemagne et de coordonner les stratégies visant à faire progresser le socialisme en Europe."
 WGR_Reimann_49_Condemn_NATO_desc:0 "L'OTAN est dénoncée comme un instrument de l'impérialisme occidental, le gouvernement ralliant le soutien à l'opposition à l'alliance."
 WGR_Reimann_49_Thorn_in_the_Side_desc:0 "La transformation socialiste de l'Allemagne et sa position pro-soviétique deviennent une source constante de frustration pour les puissances occidentales, perturbant leur influence en Europe."
 WGR_Reimann_49_New_Grundgesetz_desc:0 "L'adoption de la nouvelle Grundgesetz représente une victoire pour le socialisme en Allemagne, remplaçant la Loi fondamentale par une constitution fondée sur les principes marxistes-léninistes."
 WGR_Reimann_49_Role_of_the_Military_desc:0 "Le rôle de l'armée est redéfini pour s'aligner sur les idéaux socialistes, mettant l'accent sur la défense de l'État et la loyauté envers la classe ouvrière."
 WGR_Reimann_49_Combine_the_BGS_and_Bundeswehr_desc:0 "Le Bundesgrenzschutz est intégré à la Bundeswehr, ce qui rationalise la structure militaire et garantit un contrôle centralisé accru."
 WGR_Reimann_49_Socialist_Navy_and_Air_Force_desc:0 "Des plans sont élaborés pour mettre en place une marine et une armée de l'air socialistes modernes, afin de garantir que l'armée allemande soit capable de défendre l'État et ses intérêts."
 WGR_Reimann_49_Revamp_the_Kriegsmarinewerft_desc:0 "Le chantier naval Kriegsmarinewerft à Wilhelmshaven est modernisé afin de soutenir la construction de navires militaires pour les forces armées socialistes allemandes."
 WGR_Reimann_49_Deal_For_Mig_15s_desc:0 "Un accord est négocié avec l'Union soviétique pour acquérir des avions à réaction et des bombardiers MiG-15, renforçant ainsi les capacités aériennes de l'Allemagne."
 WGR_Reimann_49_Construct_Naval_and_Air_Bases_desc:0 "De nouvelles bases navales et aériennes sont construites dans des zones stratégiques, garantissant le déploiement efficace des forces militaires socialistes allemandes."
 WGR_Reimann_49_Soviet_T_54s_desc:0 "L'Allemagne achète des chars soviétiques T-54 afin de moderniser ses forces blindées et de renforcer ses capacités militaires."
 WGR_Reimann_49_Conscription_Act_desc:0 "Le gouvernement promulgue une loi sur la conscription, garantissant un approvisionnement régulier en recrues pour servir dans l'armée socialiste allemande."
 WGR_Reimann_49_Reinforce_Duty_to_Country_and_Duty_to_Serve_Ideals_desc:0 "Une campagne nationale promeut le devoir envers la patrie et le service collectif, encourageant la loyauté et l'engagement idéologique au sein de la population."
 WGR_Reimann_49_Campaign_of_Anti_Nazism_desc:0 "Une campagne anti-nazie est lancée afin d'éliminer les vestiges du fascisme et de renforcer le soutien public au gouvernement socialiste."
 WGR_Reimann_49_Accuse_the_CDU_FDP_and_DP_of_Neo_Nazism_desc:0 "La CDU, le FDP et le DP sont accusés d'abriter des éléments néonazis, de discréditer l'opposition et de consolider le soutien à l'agenda du gouvernement."
 WGR_Reimann_49_Show_Trials_of_Former_Nazis_desc:0 "Des procès-spectacles d'anciens nazis sont organisés pour démontrer l'engagement du gouvernement en faveur de la justice et pour affaiblir davantage les factions d'opposition."
 WGR_Reimann_49_Enforce_Loyalty_Oaths_desc:0 "Les serments d'allégeance et les tests politiques sont appliqués dans toute la fonction publique, garantissant ainsi que les employés de l'État adhèrent à l'idéologie du gouvernement socialiste."
 WGR_Reimann_49_Spare_Wehrmacht_Generals_desc:0 "Afin de maintenir la stabilité, les anciens généraux de la Wehrmacht sont épargnés par les poursuites pénales, à condition qu'ils prêtent allégeance au nouveau gouvernement."
 WGR_Reimann_49_Campaign_of_Targeted_Surveillance_desc:0 "Une vaste campagne de surveillance est lancée afin de contrôler et de réprimer les activités subversives, garantissant ainsi la sécurité de l'État."
 WGR_Reimann_49_Purge_Subversive_Elements_Within_the_Coalition_desc:0 "Les éléments subversifs au sein de la coalition sont purgés afin d'éliminer toute dissidence et d'assurer l'unité idéologique au sein du gouvernement."
 WGR_Reimann_49_Neue_Kulturkampf_desc:0 "Une « nouvelle lutte culturelle » est lancée pour remettre en question les valeurs traditionnelles et promouvoir une culture conforme aux idéaux socialistes."
 WGR_Reimann_49_Condemn_Christian_Democratic_Ideals_desc:0 "Les idéaux démocrates-chrétiens sont condamnés comme étant dépassés et incompatibles avec la transformation socialiste de l'Allemagne."
 WGR_Reimann_49_Repeal_the_Reichskonkordat_with_the_Vatican_desc:0 "Le Reichskonkordat avec le Vatican est abrogé afin de réduire l'influence de l'Église catholique dans la politique et la société allemandes."
 WGR_Reimann_49_Ban_Religion_in_Schools_and_Tax_Churches_desc:0 "La religion est interdite dans les écoles et les églises sont lourdement taxées afin de réduire leur influence sociale et de promouvoir la laïcité."
 WGR_Reimann_49_Form_an_Athiest_Only_Civil_Service_desc:0 "La fonction publique est restructurée afin de n'autoriser que les athées, garantissant ainsi la loyauté envers l'État et éliminant l'influence religieuse dans la gouvernance."
 WGR_Reimann_49_Blackmail_Catholic_Bishops_and_Cardinals_desc:0 "Les évêques et cardinaux catholiques font l'objet de chantages visant à faire taire la dissidence et à saper l'influence de l'Église dans son opposition au gouvernement socialiste."
 WGR_Reimann_49_Purge_Religious_Figures_desc:0 "Les personnalités religieuses au sein du gouvernement sont discrètement purgées afin d'assurer un contrôle total et d'aligner les fonctions de l'État sur les principes marxistes-léninistes."
 WGR_Reimann_49_Advance_Ideals_of_Communist_German_Reunification_desc:0 "Le gouvernement prône la réunification de l'Allemagne selon les principes communistes, en mettant l'accent sur la solidarité avec l'Allemagne de l'Est."
 WGR_Reimann_49_Sign_the_1953_Reunification_Treaty_desc:0 "Le traité de réunification de 1953 est signé, réunissant l'Allemagne de l'Est et l'Allemagne de l'Ouest sous un seul gouvernement communiste et mettant fin à des décennies de division."
