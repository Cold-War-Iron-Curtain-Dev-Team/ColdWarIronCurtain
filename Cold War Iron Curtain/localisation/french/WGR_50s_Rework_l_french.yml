 POLITICS_GRASSER_DESC:0 "§gNé en Bavière, Anton Grasser a été témoin direct de l'instabilité de la République de Weimar et de la militarisation croissante de l'Allemagne. Officier de carrière, il a servi dans la Reichswehr avant que le régime nazi ne transforme l'armée en Wehrmacht. Pendant la Seconde Guerre mondiale, Grasser a gravi les échelons, se forgeant une réputation de commandant compétent. Après la guerre, il a été brièvement interné avant d'être libéré, traversant les années d'incertitude de l'après-guerre alors que l'Allemagne passait de l'occupation à l'autonomie.\n\nAvec l'importance croissante accordée à la sécurité par l'Allemagne de l'Ouest, Grasser se retrouva impliqué dans les discussions autour du rétablissement d'une force de défense nationale. En 1951, il était devenu une figure clé du Bundesgrenzschutz (BGS), plaidant en faveur d'une force frontalière bien entraînée et professionnelle pour protéger la jeune république contre les menaces extérieures. Fervent partisan de l'intégration occidentale, Grasser considérait le BGS comme un élément essentiel du rôle évolutif de l'Allemagne au sein de l'alliance occidentale, mettant l'accent sur la discipline et la préparation face aux tensions de la guerre froide."
 POLITICS_ANDERSEN_DESC:0 "§gKurt Andersen a grandi pendant les dernières années tumultueuses de la République de Weimar, assistant à sa désintégration et à la montée de la dictature nazie. Fort de son expérience dans les forces de l'ordre, il est resté dans la police sous le Troisième Reich, tout en conservant une attitude pragmatique et apolitique. Après 1945, Andersen s'est retrouvé confronté aux complexités de la dénazification et de la restructuration des institutions de sécurité allemandes.\n\nÀ la fin des années 1940, alors que les tensions de la guerre froide s'intensifiaient, la nécessité d'une force de sécurité organisée devint évidente. Andersen joua un rôle central dans la création du Bundesgrenzschutz, plaidant en faveur d'une force frontalière moderne et bien équipée, capable de répondre aux menaces le long de la ligne de démarcation Est-Ouest. En 1951, il s'était imposé comme une figure influente au sein du BGS, mettant l'accent sur le professionnalisme, la neutralité et la coopération avec les forces de sécurité occidentales afin d'assurer la stabilité de la jeune République fédérale."
 POLITICS_SAMLOWSKI_DESC:0 "§gOriginaire de Prusse orientale, Alfred Samlowski a vu sa jeunesse marquée par les bouleversements politiques et sociaux de l'Allemagne de l'entre-deux-guerres. Il a servi dans la Reichswehr, qui est finalement devenue la Wehrmacht, acquérant de l'expérience tant sur le front que dans des fonctions administratives. Après l'effondrement de l'Allemagne nazie, Samlowski, comme beaucoup d'anciens officiers, a été confronté à un avenir incertain, l'Allemagne étant démantelée et divisée.\n\nAvec l'émergence de la guerre froide et la pression croissante pour sécuriser les frontières de l'Allemagne de l'Ouest, Samlowski s'est engagé dans les efforts visant à rétablir un cadre de sécurité nationale. En 1951, il était devenu une figure de proue du Bundesgrenzschutz, plaidant en faveur d'une force forte mais politiquement neutre pour protéger les frontières de l'Allemagne de l'Ouest. Il soutenait une collaboration étroite avec les forces alignées sur l'OTAN et considérait le BGS comme un élément essentiel pour garantir la souveraineté de la République fédérale contre d'éventuelles incursions du bloc de l'Est."
 Max_Reimann_WGR_desc:0 "Né à Elbing, en Prusse orientale, Reimann s'engage politiquement dès son plus jeune âge, rejoignant la Ligue spartakiste puis le Parti communiste allemand dans les années 1920. Pendant la République de Weimar, Reimann s'impose comme organisateur et défenseur des droits des travailleurs, se faisant connaître pour son opposition farouche à la montée du fascisme. Après la prise du pouvoir par les nazis en 1933, Reimann a été arrêté à plusieurs reprises et a passé plusieurs années dans des camps de concentration, notamment à Buchenwald, pour ses activités antifascistes. Malgré une persécution sévère, il est resté un communiste engagé et a rejoint la résistance contre le régime nazi. Après la guerre, Reimann a joué un rôle déterminant dans la reconstruction du KPD dans les zones d'occupation occidentales de l'Allemagne, prônant le socialisme en opposition à la reconstruction capitaliste poursuivie par les Alliés.\n\nEn 1949, Reimann était devenu une figure de proue du KPD en Allemagne de l'Ouest, connu pour ses discours enflammés et sa position intransigeante contre l'impérialisme occidental. Ses efforts ont jeté les bases de la présence continue du parti dans le paysage politique allemand divisé de l'après-guerre."
 pol_desc_konrad:0 "Konrad Hermann Joseph Adenauer, surnommé « Der Alte » (le vieux), est un chrétien fervent et le fondateur de l'Union chrétienne-démocrate d'Allemagne (CDU). Sa politique témoigne d'un engagement profond en faveur d'une vision large de la démocratie libérale fondée sur le marché et de l'anticommunisme. Convaincu qu'une paix durable ne peut être obtenue que grâce à une Europe unie, il est profondément attaché à la coopération européenne, à une politique étrangère orientée vers l'Occident et au rétablissement de la position de l'Allemagne de l'Ouest sur la scène internationale."
 Kurt_Schumacher_WGR_desc:0 "Né à Kulm, en Prusse occidentale, Kurt Schumacher a été profondément influencé par les troubles qui ont secoué l'Allemagne au début du XXe siècle. Adhérant au Parti social-démocrate dès sa jeunesse, il s'est rapidement fait connaître comme un ardent défenseur de la démocratie et des droits des travailleurs. Soldat décoré pendant la Première Guerre mondiale, Schumacher est rentré chez lui désabusé par le militarisme et est devenu un fervent opposant à l'extrémisme de droite pendant la République de Weimar. En tant que député au Reichstag, il a été l'un des critiques les plus virulents du mouvement nazi naissant, refusant tout compromis même lorsque la violence politique s'est intensifiée.\n\nAprès l'arrivée au pouvoir d'Hitler en 1933, Schumacher fut arrêté par la Gestapo et passa plus d'une décennie dans les camps de concentration nazis, où il endura des conditions brutales qui le laissèrent physiquement affaibli, mais sans briser son moral. Libéré en 1945, il s'est immédiatement attelé à la tâche monumentale de reconstruire le SPD dans l'Allemagne d'après-guerre. Rejetant à la fois les influences communistes et conservatrices, il s'est positionné comme la figure de proue du socialisme démocratique, s'opposant farouchement aux pressions soviétiques et occidentales. En 1949, Schumacher était devenu l'un des hommes politiques les plus influents de l'Allemagne de l'Ouest, voué à la construction d'une Allemagne forte et indépendante, fondée sur la justice sociale et la démocratie."
 Erich_Ollenhauer_WGR_desc:0 "Né à Magdebourg dans une famille ouvrière, Ollenhauer s'est intéressé très tôt au socialisme et a rejoint la section jeunesse du Parti social-démocrate avant même d'avoir terminé ses études. Fervent défenseur des droits des travailleurs et de la justice sociale, il s'est exilé après la prise du pouvoir par les nazis en 1933, poursuivant son combat pour le socialisme démocratique depuis l'étranger. Ayant passé la majeure partie de son exil en Grande-Bretagne, il a travaillé en étroite collaboration avec d'autres exilés du SPD afin de préserver la structure organisationnelle du parti et de préparer son retour en Allemagne après la guerre.\n\nDe retour dans son pays natal en 1946, Ollenhauer devint rapidement l'un des plus proches alliés de Kurt Schumacher, contribuant à refaire du SPD une force politique puissante dans l'Allemagne d'après-guerre. Alors que Schumacher adoptait une position nationaliste et pro-réarmement ferme, Ollenhauer penchait davantage vers la gauche, prônant une Allemagne neutre, libre du contrôle occidental et soviétique. Sa vision du SPD mettait fortement l'accent sur la justice sociale, les droits des travailleurs et la planification économique, ce qui le mettait souvent en désaccord avec la faction pro-occidentale du parti dirigée par des personnalités telles qu'Egon Franke.\n\nAprès l'accident vasculaire cérébral invalidant de Schumacher en 1951, Ollenhauer est nommé chef par intérim, prenant ses fonctions à une période de grande incertitude. Alors que le retour éventuel de Schumacher reste incertain, Ollenhauer doit diriger un SPD de plus en plus divisé, tiraillé entre sa vision du socialisme de gauche et l'influence croissante des modérés pro-occidentaux."
 Erich_Ollenhauer_WGR_Final_desc:0 "Né à Magdebourg dans une famille ouvrière, Ollenhauer s'est intéressé très tôt au socialisme et a rejoint la section jeunesse du Parti social-démocrate avant même d'avoir terminé ses études. Fervent défenseur des droits des travailleurs et de la justice sociale, il s'est exilé après la prise du pouvoir par les nazis en 1933, poursuivant son combat pour le socialisme démocratique depuis l'étranger. Ayant passé la majeure partie de son exil en Grande-Bretagne, il a travaillé en étroite collaboration avec d'autres exilés du SPD afin de préserver la structure organisationnelle du parti et de préparer son retour en Allemagne après la guerre.\n\nDe retour dans son pays natal en 1946, Ollenhauer devint rapidement l'un des plus proches alliés de Kurt Schumacher, contribuant à refaire du SPD une force politique puissante dans l'Allemagne d'après-guerre. Alors que Schumacher adoptait une position nationaliste et pro-réarmement ferme, Ollenhauer penchait davantage vers la gauche, prônant une Allemagne neutre, libre du contrôle occidental et soviétique. Sa vision du SPD mettait fortement l'accent sur la justice sociale, les droits des travailleurs et la planification économique, ce qui le mettait souvent en désaccord avec la faction pro-occidentale du parti dirigée par des personnalités telles qu'Egon Franke.\n\nAprès le décès tragique de Schumacher, Ollenhauer a réussi à asseoir son autorité au sein du SPD, prenant ses fonctions à un moment marqué par une grande incertitude. Les manœuvres politiques d'Ollenhauer au sein du SPD ont permis à l'aile gauche de devenir la faction dominante, mettant l'accent sur l'indépendance politique de l'Allemagne et l'établissement d'un État-providence socialiste dans un cadre démocratique."
 Egon_Franke_WGR_desc:0 "Originaire de Hanovre, Egon Franke a atteint l'âge adulte pendant les dernières années tumultueuses de la République de Weimar, assistant en direct à l'effondrement de la démocratie allemande et à la montée du totalitarisme. Social-démocrate convaincu depuis sa jeunesse, Franke a survécu à l'ère nazie dans la résistance clandestine, maintenant le contact avec les réseaux antifascistes malgré le danger omniprésent. Après la guerre, il est devenu l'un des principaux architectes de la reconstruction de l'Allemagne de l'Ouest, convaincu que l'avenir du SPD résidait dans un alignement ferme avec les Alliés occidentaux et dans l'établissement d'une démocratie forte et orientée vers le marché.\n\nProche allié des éléments pro-occidentaux et modérés au sein du SPD, Franke rejetait l'idée de la neutralité allemande, considérant l'intégration à l'Occident comme la seule voie viable vers la reprise économique et la sécurité. Alors que son collègue Erich Ollenhauer prônait une ligne plus à gauche, plus socialiste, Franke faisait partie de l'aile droite du SPD, défendant la Westbindung (intégration à l'Occident), le réarmement et une coopération étroite avec l'OTAN.\n\nKurt Schumacher étant devenu invalide après son accident vasculaire cérébral en 1951, Franke se positionne comme la principale figure de l'opposition à Erich Ollenhauer, représentant la faction modérée et pro-occidentale du SPD. Il soutient que la social-démocratie et l'intégration occidentale ne s'excluent pas mutuellement, estimant que la prospérité économique et la stabilité démocratique ne peuvent être atteintes que par la participation à l'alliance occidentale."
 Egon_Franke_WGR_Final_desc:0 "Originaire de Hanovre, Egon Franke a atteint l'âge adulte pendant les dernières années tumultueuses de la République de Weimar, assistant en direct à l'effondrement de la démocratie allemande et à la montée du totalitarisme. Social-démocrate convaincu depuis sa jeunesse, Franke a survécu à l'ère nazie dans la résistance clandestine, maintenant le contact avec les réseaux antifascistes malgré le danger omniprésent. Après la guerre, il est devenu l'un des principaux architectes de la reconstruction de l'Allemagne de l'Ouest, convaincu que l'avenir du SPD résidait dans un alignement ferme avec les Alliés occidentaux et dans l'établissement d'une démocratie forte et orientée vers le marché.\n\nProche allié des éléments pro-occidentaux et modérés au sein du SPD, Franke rejetait l'idée de la neutralité allemande, considérant l'intégration à l'Occident comme la seule voie viable vers la reprise économique et la sécurité. Alors que son collègue Erich Ollenhauer prônait une ligne plus à gauche, plus socialiste, Franke faisait partie de l'aile droite du SPD, défendant la Westbindung (intégration à l'Occident), le réarmement et une coopération étroite avec l'OTAN.\n\nAprès la mort de Kurt Schumacher en 1952, Franke s'est positionné comme la principale figure de l'opposition à Erich Ollenhauer, représentant la faction modérée et pro-occidentale du SPD. Il soutient que la social-démocratie et l'intégration occidentale ne s'excluent pas mutuellement, estimant que la prospérité économique et la stabilité démocratique ne peuvent être atteintes que par la participation à l'alliance occidentale."
 WGR_50s_Pass_the_Grundgesetz:0 "Adopter la Loi fondamentale"
 WGR_50s_Pass_the_Grundgesetz_desc:0 "Aujourd'hui, 23 mai 1949, la Loi fondamentale allemande (Grundgesetz) est officiellement entrée en vigueur, marquant la naissance de la République fédérale d'Allemagne et fournissant un cadre solide pour la reconstruction d'une société démocratique et libre. Rédigée en réponse à la sombre période du régime nazi, la Loi fondamentale met l'accent sur la dignité humaine, les droits civils et l'engagement en faveur de la paix, traçant une voie claire vers la justice et la responsabilité. Bien qu'elle ait été conçue comme une constitution provisoire jusqu'à la réunification, elle établit déjà des protections solides, notamment une Cour constitutionnelle fédérale chargée de garantir l'État de droit et d'empêcher le retour de la tyrannie."
 WGR_50s_Article_20:0 "Article 20"
 WGR_50s_Article_20_desc:0 "L'article 20 de la Loi fondamentale allemande établit les principes fondamentaux de la République fédérale d'Allemagne, la déclarant État fédéral démocratique et social, fondé sur l'État de droit, dont la souveraineté appartient au peuple et accordant aux citoyens le droit de résister si l'ordre constitutionnel est menacé."
 WGR_50s_Article_23:0 "Article 23"
 WGR_50s_Article_23_desc:0 "L'article 23 de la Loi fondamentale allemande fournira le cadre nécessaire à l'extension de la Loi fondamentale à d'autres parties de l'Allemagne, soulignant notre objectif de réunification nationale et favorisant l'intégration de l'Allemagne de l'Est selon les principes démocratiques et constitutionnels."
 WGR_50s_Memory_of_1933:0 "Souvenir de 1933"
 WGR_50s_Memory_of_1933_desc:0 "Les souvenirs de 1933, année où Adolf Hitler fut nommé chancelier de l'Allemagne et commença à transformer le pays en un État totalitaire, ont poussé le Conseil parlementaire à élaborer une loi fondamentale qui garantit la résilience de la démocratie, protège les droits fondamentaux et établit un système solide de freins et contrepoids afin d'empêcher tout retour à l'autoritarisme."
 WGR_50s_Prepare_for_the_1949_Federal_Election:0 "Se préparer pour les élections fédérales de 1949"
 WGR_50s_Prepare_for_the_1949_Federal_Election_desc:0 "Les élections ouest-allemandes de 1949, les premières de notre République fédérale nouvellement formée, constituent un jalon historique, car elles marquent le début d'une nouvelle ère démocratique en Allemagne, donnant à nos citoyens le pouvoir de choisir leurs représentants et de tracer la voie vers la reconstruction d'une Allemagne libre et juste après les ravages de la dictature et de la guerre."
 WGR_Adenauer_49_Bundeskanzler_Konrad_Adenauer:0 "Le chancelier fédéral Konrad Adenauer"
 WGR_Adenauer_49_Bundeskanzler_Konrad_Adenauer_desc:0 "L'élection aujourd'hui de Konrad Adenauer au poste de chancelier marque un tournant décisif pour notre jeune République fédérale, car son cabinet va désormais nous guider dans les tâches difficiles que sont la reconstruction de notre nation, la garantie de la stabilité et la définition de la place de l'Allemagne dans un monde d'après-guerre en pleine mutation."
 WGR_Adenauer_49_Form_a_Coalition_With_the_FDP_and_DP:0 "Former une coalition avec le FDP et le DP"
 WGR_Adenauer_49_Form_a_Coalition_With_the_FDP_and_DP_desc:0 "Afin d'obtenir la majorité au Bundestag, il est nécessaire de former une coalition avec d'autres partis. La CDU a obtenu 31 % des voix, mais Adenauer a exprimé son souhait de former une coalition avec d'autres partis traditionnalistes et représentant la classe moyenne, éliminant ainsi le SPD comme partenaire potentiel. Nous allons approcher les libéraux nouvellement formés du FDP et les traditionalistes du DP afin de former une coalition."
 WGR_Adenauer_49_Decide_On_a_Provisional_Capital_for_the_FRG:0 "Décider d'une capitale provisoire pour la RFA"
 WGR_Adenauer_49_Decide_On_a_Provisional_Capital_for_the_FRG_desc:0 "Comme Berlin-Ouest est entièrement encerclée par la zone d'occupation soviétique, le débat sur le choix entre Francfort et Bonn comme capitale provisoire de l'Allemagne s'intensifie, chaque ville offrant des avantages distincts. Francfort, qui est en passe de devenir un centre financier très animé, symbolise la tradition et l'histoire démocratique, puisque c'est là qu'ont eu lieu les premières élections nationales en 1848, ce qui en fait une candidate sérieuse. Cependant, Bonn, ville plus calme située sur le Rhin, est devenue la favorite en raison de sa situation centrale et de sa proximité avec la résidence de Konrad Adenauer à Rhöndorf, à seulement 30 minutes. En fin de compte, le profil moins visible de Bonn semble en faire le choix provisoire idéal jusqu'à ce que nous retournions finalement à Berlin."
 WGR_Adenauer_49_Debate_the_Petersberg_Agreement:0 "Débattre de l'accord de Petersberg"
 WGR_Adenauer_49_Debate_the_Petersberg_Agreement_desc:0 "L'accord de Petersberg marque un tournant décisif dans nos efforts pour retrouver notre souveraineté tout en répondant aux préoccupations des puissances alliées. Cet accord nous permet de commencer à reconstruire notre économie, à rétablir nos relations commerciales et même à former des unités militaires limitées, mais il nous maintient également sous la surveillance étroite des Alliés. Nous devons débattre soigneusement de ses termes, car il établit un équilibre entre le besoin urgent de reconstruction et le défi permanent de prouver que l'Allemagne est attachée à la paix et à la démocratie."
 WGR_Adenauer_49_Sign_the_Agreement_and_Appease_the_Allies:0 "Signer l'accord et apaiser les alliés"
 WGR_Adenauer_49_Sign_the_Agreement_and_Appease_the_Allies_desc:0 "L'acceptation de l'accord de Petersberg est une avancée décisive qui témoigne de notre volonté de coopérer avec les puissances alliées tout en progressant prudemment vers le rétablissement de notre indépendance. En acceptant ces conditions, nous pouvons commencer à nous affranchir des restrictions imposées après la guerre, rouvrir la voie à la diplomatie internationale et reconstruire notre économie dans le cadre du redressement européen. Si certains peuvent considérer la surveillance continue des Alliés comme un fardeau, cet accord constitue néanmoins une base sur laquelle nous pouvons prouver notre engagement en faveur de la paix et de la démocratie."
 WGR_Adenauer_49_Buck_the_Three_Powers_and_Refuse:0 "Résister aux trois puissances et refuser"
 WGR_Adenauer_49_Buck_the_Three_Powers_and_Refuse_desc:0 "Défier les puissances alliées est une décision audacieuse qui risque de nous isoler diplomatiquement, mais qui pourrait démontrer notre souveraineté et notre détermination. Le gouvernement fédéral doit peser soigneusement cette décision, car elle pourrait compromettre nos efforts de reconstruction ou consolider notre indépendance, redéfinissant ainsi notre place dans l'ordre d'après-guerre."
 WGR_Adenauer_49_Consider_Our_Position_on_the_Ruhr_Authority:0 "Considérer notre position sur l'Autorité de la Ruhr"
 WGR_Adenauer_49_Consider_Our_Position_on_the_Ruhr_Authority_desc:0 "L'Autorité de la Ruhr, pierre angulaire du contrôle allié sur l'industrie allemande, représente un défi pour notre souveraineté. La décision de coopérer et de rechercher des concessions progressives ou de résister et de risquer des répercussions économiques déterminera à la fois notre reprise industrielle et nos relations avec nos voisins."
 WGR_Adenauer_49_Found_the_Federal_Ministry_of_Economics:0 "Fonder le ministère fédéral de l'Économie"
 WGR_Adenauer_49_Found_the_Federal_Ministry_of_Economics_desc:0 "Afin de mener le pays vers la reprise économique et la croissance, le gouvernement fédéral doit créer un ministère fédéral de l'Économie. Ce ministère centralisera les efforts visant à reconstruire l'industrie, à gérer les relations commerciales et à superviser la politique financière, constituant ainsi un pilier essentiel de la reconstruction nationale."
 WGR_Adenauer_49_Convert_Money_in_WBerlin_to_DMarks:0 "Convertir la devise de Berlin-Ouest en Deutschemark"
 WGR_Adenauer_49_Convert_Money_in_WBerlin_to_DMarks_desc:0 "L'introduction du Deutsche Mark à Berlin-Ouest est une étape clé dans l'alignement de la ville sur la République fédérale. Cette mesure décisive symbolise l'unité économique, mais risque de provoquer l'hostilité soviétique, reflétant notre détermination à intégrer Berlin-Ouest."
 WGR_Adenauer_49_Incorp_Mauser_Workers_into_Heckler_and_Koch:0 "Intégrer les employés de Mauser à Heckler & Koch"
 WGR_Adenauer_49_Incorp_Mauser_Workers_into_Heckler_and_Koch_desc:0 "Avec le démantèlement de la production de guerre de Mauser, l'intégration de sa main-d'œuvre qualifiée dans Heckler & Koch offre l'opportunité de préserver un savoir-faire précieux. Cette décision stratégique soutient la réorientation de l'industrie allemande vers des objectifs pacifiques et innovants."
 WGR_Adenauer_49_Form_the_Deutsche_Bundesbahn:0 "Formation de la Deutsche Bundesbahn"
 WGR_Adenauer_49_Form_the_Deutsche_Bundesbahn_desc:0 "La création de la Deutsche Bundesbahn est une étape cruciale dans la modernisation des infrastructures allemandes. Un réseau ferroviaire unifié et efficace permettra d'accélérer la reprise économique, de renforcer l'intégration régionale et de symboliser le progrès et la connectivité."
 WGR_Adenauer_49_Start_a_New_Decade_with_a_New_Germany:0 "Commencer une nouvelle décennie avec une nouvelle Allemagne"
 WGR_Adenauer_49_Start_a_New_Decade_with_a_New_Germany_desc:0 "À l'aube des années 1950, nous sommes à l'aube d'une nouvelle ère. Le gouvernement fédéral vise à reconstruire une Allemagne démocratique, prospère et pacifique, confrontée à d'immenses défis mais aussi à d'énormes opportunités pour redéfinir l'avenir de notre nation."
 WGR_Adenauer_49_Dismantle_the_Salzgitter_Works:0 "Démanteler l'usine de Salzgitter"
 WGR_Adenauer_49_Dismantle_the_Salzgitter_Works_desc:0 "Le démantèlement des usines de Salzgitter, autrefois pilier de l'industrie nazie, est une mesure controversée mais nécessaire. Le respect des exigences des Alliés démontrera notre engagement en faveur de la paix, même au prix d'une perte de capacité industrielle, soulignant ainsi la tension entre souveraineté et reconstruction."
 WGR_Adenauer_49_Form_Fed_CDU_and_Elect_Adenauer:0 "Former la CDU fédérale et élire Adenauer comme président"
 WGR_Adenauer_49_Form_Fed_CDU_and_Elect_Adenauer_desc:0 "Il est essentiel de regrouper les sections régionales de la CDU au sein d'une structure fédérale unifiée afin de consolider la stabilité politique. En renforçant les fondements du parti, le gouvernement fédéral garantit une base solide pour la gouvernance démocratique dans la République."
 WGR_Adenauer_49_Stop_Supplying_Coal_to_East_Germany:0 "Cesser de fournir du charbon à l'Allemagne de l'Est"
 WGR_Adenauer_49_Stop_Supplying_Coal_to_East_Germany_desc:0 "La réduction des livraisons de charbon à l'Allemagne de l'Est est une arme économique audacieuse contre la zone contrôlée par les Soviétiques. Si cette mesure risque de tendre les relations, elle souligne notre engagement à soutenir une Allemagne de l'Ouest libre et indépendante, en opposant une résistance ferme à l'ingérence soviétique."
 WGR_Adenauer_49_End_the_Use_of_Food_Stamps:0 "Mettre fin à l'utilisation des bons alimentaires"
 WGR_Adenauer_49_End_the_Use_of_Food_Stamps_desc:0 "La fin des bons alimentaires marque un tournant vers la normalisation et la reprise économiques. Elle témoigne des progrès accomplis pour surmonter les pénuries et les restrictions de l'immédiat après-guerre et renforcera le moral et la confiance du public dans le leadership de notre gouvernement."
 WGR_Adenauer_49_Form_the_Federal_Civil_Order_Service:0 "Former le Service fédéral de l'ordre civil"
 WGR_Adenauer_49_Form_the_Federal_Civil_Order_Service_desc:0 "La création du Service fédéral de l'ordre civil est essentielle au maintien de la sécurité et de l'ordre publics. Cette institution renforcera la stabilité interne et garantira la capacité à faire face aux situations d'urgence, constituant ainsi un pilier de la résilience démocratique."
 WGR_Adenauer_49_Vote_to_Join_the_Council_of_Europe:0 "Voter pour rejoindre le Conseil de l'Europe"
 WGR_Adenauer_49_Vote_to_Join_the_Council_of_Europe_desc:0 "L'adhésion au Conseil de l'Europe représente une étape importante vers la réintégration de l'Allemagne dans la communauté internationale. Cette décision confirme notre engagement en faveur de la démocratie, des droits de l'homme et de la coopération européenne, et marque une étape importante dans la construction d'une Europe pacifique."
 WGR_Adenauer_49_Merge_Regional_Radio_into_Fed_ARD:0 "Fusionner les radios régionales au sein de l'ARD fédérale"
 WGR_Adenauer_49_Merge_Regional_Radio_into_Fed_ARD_desc:0 "La fusion des services radiophoniques régionaux au sein du réseau fédéral ARD renforce la cohésion nationale et la communication. La mise en place d'une plateforme unifiée pour le débat démocratique et les échanges culturels souligne l'engagement du gouvernement fédéral en faveur de l'unité et du progrès."
 WGR_Adenauer_49_Issue_the_Adenauer_Decree:0 "Promulguer le décret Adenauer"
 WGR_Adenauer_49_Issue_the_Adenauer_Decree_desc:0 "Le décret Adenauer introduira un serment obligatoire pour les employés du secteur public administratif. Ce décret interdit à tout citoyen ayant des liens avec des mouvements anticonstitutionnels, notamment les communistes et les nationaux-socialistes, de faire partie du secteur public."
 WGR_Adenauer_49_Welcome_Formation_of_Western_European_Army:0 "Bienvenue à la création d'une armée européenne occidentale"
 WGR_Adenauer_49_Welcome_Formation_of_Western_European_Army_desc:0 "L'idée d'une armée européenne occidentale rassemble les nations démocratiques contre l'agression soviétique. En acceptant cette mesure audacieuse, l'Allemagne souligne son engagement en faveur de la sécurité collective et de la coopération européenne, redéfinissant ainsi son rôle dans l'Europe d'après-guerre."
 WGR_Adenauer_49_Move_Forward_with_Allied_Negotiations_for_Rearmament:0 "Aller de l'avant avec les négociations alliées pour le réarmement"
 WGR_Adenauer_49_Move_Forward_with_Allied_Negotiations_for_Rearmament_desc:0 "Négocier le réarmement avec les Alliés est un processus délicat mais nécessaire. Il offre une voie pour retrouver la souveraineté tout en contribuant à la sécurité occidentale, un équilibre qui exige tact et engagement."
 WGR_Adenauer_49_Dismiss_Idea_of_German_Participation_in_European_Army:0 "Rejeter l'idée d'une participation allemande à une armée européenne"
 WGR_Adenauer_49_Dismiss_Idea_of_German_Participation_in_European_Army_desc:0 "Le refus de la participation allemande à une armée européenne est une décision prudente motivée par la volonté d'éviter toute provocation. Le gouvernement fédéral doit tenir compte à la fois de l'opposition nationale et des sensibilités internationales, ce qui se traduit par une approche mesurée en matière de réarmement et de souveraineté."
 WGR_Adenauer_49_Debate_the_Schuman_Plan:0 "Débat sur le plan Schuman"
 WGR_Adenauer_49_Debate_the_Schuman_Plan_desc:0 "Le plan Schuman propose une vision d'intégration économique et de coopération entre les nations européennes. La participation de l'Allemagne pourrait soutenir notre reprise et renforcer nos liens avec la France, en équilibrant les intérêts nationaux et la promesse d'unité."
 WGR_Adenauer_49_Join_the_Agreement_with_France:0 "Adhérer à l'accord avec la France"
 WGR_Adenauer_49_Join_the_Agreement_with_France_desc:0 "La signature d'un accord avec la France marque un nouveau chapitre dans les relations franco-allemandes. Cette étape cruciale dans la réconciliation et la coopération influencera considérablement la reconstruction de l'Europe et favorisera des partenariats durables."
 WGR_Adenauer_49_Face_Intense_SPD_Criticism_and_Delay:0 "Face à d'intenses critiques et à des retards de la part du SPD"
 WGR_Adenauer_49_Face_Intense_SPD_Criticism_and_Delay_desc:0 "L'opposition du SPD aux politiques du gouvernement fédéral reflète les profondes divisions idéologiques au sein de notre démocratie. Bien que ces débats soient difficiles, ils sont essentiels pour façonner une gouvernance équilibrée qui reflète la volonté du peuple."
 WGR_Adenauer_49_Form_the_Ministry_of_Foreign_Affairs:0 "Former le ministère des Affaires étrangères"
 WGR_Adenauer_49_Form_the_Ministry_of_Foreign_Affairs_desc:0 "La création d'un ministère des Affaires étrangères souligne le rôle croissant de l'Allemagne dans la diplomatie internationale. Chargée de gérer les relations avec nos alliés comme avec nos adversaires, cette institution jouera un rôle central dans la promotion de la paix et l'affirmation de notre souveraineté."
 WGR_Adenauer_49_Conduct_Visits_to_Italy_and_UK:0 "Effectuer des visites en Italie et au Royaume-Uni"
 WGR_Adenauer_49_Conduct_Visits_to_Italy_and_UK_desc:0 "Les visites en Italie et au Royaume-Uni témoignent de la volonté du gouvernement fédéral de renouer des alliances. Ces efforts diplomatiques visent à favoriser la coopération et la confiance mutuelle, et témoignent de notre détermination à réintégrer la communauté internationale."
 WGR_Adenauer_49_Become_a_Member_of_UNESCO:0 "Devenir membre de l'UNESCO"
 WGR_Adenauer_49_Become_a_Member_of_UNESCO_desc:0 "L'adhésion à l'UNESCO reflète l'engagement de l'Allemagne en faveur des échanges culturels et éducatifs. Cette démarche souligne notre volonté de promouvoir la compréhension mondiale et de rétablir notre réputation internationale grâce à une collaboration fructueuse."
 WGR_Adenauer_49_Officially_End_the_State_of_War_with_US:0 "Mettre officiellement fin à l'état de guerre avec les États-Unis"
 WGR_Adenauer_49_Officially_End_the_State_of_War_with_US_desc:0 "La fin de l'état de guerre avec les États-Unis marque un tournant décisif dans notre redressement. Cet acte symbolise la normalisation des relations et l'avènement d'une nouvelle ère de partenariat favorisant une coopération accrue et des progrès mutuels."
 WGR_Adenauer_49_Pass_the_Federal_Border_Police_Act:0 "Adopter la loi sur la police fédérale des frontières"
 WGR_Adenauer_49_Pass_the_Federal_Border_Police_Act_desc:0 "La loi fédérale sur la police des frontières établit une force dédiée à la protection de nos frontières. Garantissant la sécurité et la stabilité, elle soutient également notre engagement en faveur de la souveraineté et de l'État de droit dans la République fédérale."
 WGR_Adenauer_49_Pass_Regulations_On_Mining_and_Steel_Companies:0 "Adopter une réglementation sur les sociétés minières et sidérurgiques"
 WGR_Adenauer_49_Pass_Regulations_On_Mining_and_Steel_Companies_desc:0 "La réglementation des industries minières et sidérurgiques est essentielle pour trouver un équilibre entre la reconstruction et les exigences des Alliés. Cette politique témoigne de notre engagement en faveur d'un développement pacifique tout en soutenant la reprise économique dans le secteur industriel."
 WGR_Adenauer_49_Form_the_Federal_Constitutional_Court:0 "Former la Cour constitutionnelle fédérale"
 WGR_Adenauer_49_Form_the_Federal_Constitutional_Court_desc:0 "La Cour constitutionnelle fédérale sera la gardienne de la démocratie et de l'État de droit. En veillant au respect de notre Loi fondamentale et en protégeant les droits des citoyens, cette institution est l'un des piliers de notre fondement démocratique."
 WGR_Adenauer_49_Provide_Amnesties_For_Convicted_Ex_Nazis:0 "Accorder l'amnistie aux anciens nazis condamnés"
 WGR_Adenauer_49_Provide_Amnesties_For_Convicted_Ex_Nazis_desc:0 "Accorder l'amnistie à certains anciens nazis condamnés est une décision controversée, mais pragmatique. Il est essentiel de trouver un équilibre entre justice et réconciliation nationale afin de favoriser l'unité tout en traitant les injustices passées avec une grande prudence."
 WGR_Adenauer_49_Join_the_IMF:0 "Rejoindre le Fonds monétaire international"
 WGR_Adenauer_49_Join_the_IMF_desc:0 "L'adhésion au Fonds monétaire international marque la réintégration de l'Allemagne dans l'économie mondiale. Cette adhésion lui donne accès à des ressources financières et à la stabilité, ce qui constitue une étape cruciale pour asseoir sa crédibilité économique sur la scène internationale."
 WGR_Adenauer_49_Split_Up_IG_Farben:0 "Scission d'IG Farben"
 WGR_Adenauer_49_Split_Up_IG_Farben_desc:0 "La dissolution d'IG Farben est une mesure symbolique et pratique visant à démanteler les vestiges de l'industrie de guerre. Démontrant notre conformité aux mandats alliés, cette mesure ouvre la voie à la restructuration et à la modernisation de notre économie."
 WGR_Adenauer_49_Sign_the_Luxembourg_Agreement:0 "Signer l'accord de Luxembourg"
 WGR_Adenauer_49_Sign_the_Luxembourg_Agreement_desc:0 "L'accord de Luxembourg marque une étape décisive dans le traitement des atrocités commises par le passé. En acceptant de verser des réparations, le gouvernement fédéral reconnaît sa responsabilité et fait progresser les efforts de réconciliation en Europe."
 WGR_Adenauer_49_Receive_Last_Marshall_Plan_Payments:0 "Recevoir les derniers paiements du plan Marshall"
 WGR_Adenauer_49_Receive_Last_Marshall_Plan_Payments_desc:0 "Les derniers versements du plan Marshall marquent la fin d'un chapitre essentiel de notre reconstruction. Ces fonds, qui ont joué un rôle déterminant dans la revitalisation de notre économie et de nos infrastructures, ont eu un impact durable sur le redressement de l'Allemagne après la guerre."
 WGR_Adenauer_49_React_to_the_Stalin_Notes:0 "Réagir aux notes de Staline"
 WGR_Adenauer_49_React_to_the_Stalin_Notes_desc:0 "Les notes de Staline constituent un casse-tête diplomatique difficile à résoudre pour le gouvernement fédéral. Elles offrent des pistes potentielles pour la réunification, mais sont entourées d'incertitudes. Notre réponse doit donc trouver un équilibre entre l'espoir d'une unification et la prudence face à toute manipulation."
 WGR_Adenauer_49_Unanimously_Reject_the_Soviets:0 "Rejeter à l'unanimité les Soviétiques"
 WGR_Adenauer_49_Unanimously_Reject_the_Soviets_desc:0 "On ne peut pas faire confiance aux Soviétiques. Notre alliance est avec l'Occident. Cette décision souligne notre engagement envers la démocratie, notre opposition au totalitarisme et nos valeurs de liberté et de coopération. Staline cherche certainement à accroître son influence en Allemagne par le biais de cette proposition. Nous n'y croyons pas."
 WGR_Adenauer_49_Consider_Soviet_Proposals:0 "Examiner les propositions soviétiques"
 WGR_Adenauer_49_Consider_Soviet_Proposals_desc:0 "L'examen des propositions soviétiques nécessite une analyse minutieuse de leurs avantages et risques potentiels. La mise en balance des espoirs de réunification et du danger de compromettre les principes démocratiques reflète la complexité de la diplomatie de la guerre froide."
 WGR_Adenauer_49_Sign_the_Bonn_Paris_Conventions:0 "Signer les conventions de Bonn et de Paris"
 WGR_Adenauer_49_Sign_the_Bonn_Paris_Conventions_desc:0 "Les conventions de Bonn et de Paris marquent un tournant dans le rétablissement de notre souveraineté. La conclusion d'accords avec les Alliés nous rapproche de l'indépendance totale et renforce notre position au sein de la communauté internationale."
 WGR_Adenauer_49_Sign_the_EDC_Treaty:0 "Signer le traité instituant la Communauté européenne de défense"
 WGR_Adenauer_49_Sign_the_EDC_Treaty_desc:0 "La signature du traité instituant la Communauté européenne de défense aligne l'Allemagne sur les initiatives occidentales en matière de sécurité. Cette mesure audacieuse réaffirme notre retour à la défense collective, conciliant la reprise nationale et la coopération internationale."
 WGR_Adenauer_49_Debate_Making_Defense_Contributions_To_Allies:0 "Débat sur les contributions à la défense des alliés"
 WGR_Adenauer_49_Debate_Making_Defense_Contributions_To_Allies_desc:0 "Contribuer aux efforts de défense des Alliés est une question controversée pour le gouvernement fédéral. Renforcer les liens avec l'Occident tout en abordant les souvenirs du militarisme exige une approche nuancée et stratégique."
 WGR_Adenauer_49_Abolish_the_Pulpit_Paragraph:0 "Supprimer le paragraphe sur la chaire"
 WGR_Adenauer_49_Abolish_the_Pulpit_Paragraph_desc:0 "La suppression du paragraphe sur la chaire supprime les restrictions sur les discours politiques dans les églises. Renforçant la liberté d'expression et la démocratie, cette réforme témoigne de l'engagement du gouvernement fédéral en faveur des libertés individuelles."
 WGR_Adenauer_49_Sign_the_London_Debt_Agreement:0 "Signer l'accord de Londres sur la dette"
 WGR_Adenauer_49_Sign_the_London_Debt_Agreement_desc:0 "L'accord de Londres sur la dette allemande traite des obligations financières de l'Allemagne pendant la guerre. En négociant des conditions favorables, le gouvernement fédéral ouvre la voie à la stabilité économique et à la confiance internationale."
 WGR_Adenauer_49_Sign_Reparations_Agreement_with_Israel:0 "Signer un accord de réparation avec Israël"
 WGR_Adenauer_49_Sign_Reparations_Agreement_with_Israel_desc:0 "La signature de l'accord de réparation avec Israël est une étape importante dans la reconnaissance des horreurs de l'Holocauste. Cet acte de responsabilité reflète notre engagement en faveur de la justice et de la réconciliation, marquant un moment décisif dans le rétablissement moral de l'Allemagne."
 WGR_Adenauer_49_Express_Support_For_the_East_German_Uprising:0 "Soutien explicite au soulèvement est-allemand"
 WGR_Adenauer_49_Express_Support_For_the_East_German_Uprising_desc:0 "Le soulèvement est-allemand représente une prise de position courageuse contre l'oppression soviétique. Soutenir ceux qui luttent pour la liberté souligne notre solidarité avec la démocratie et met en évidence l'engagement du gouvernement fédéral en faveur de la liberté."
 WGR_Adenauer_49_Establish_the_Federal_Ministry_of_the_Interior:0 "Créer le ministère fédéral de l'Intérieur"
 WGR_Adenauer_49_Establish_the_Federal_Ministry_of_the_Interior_desc:0 "La création du ministère fédéral de l'Intérieur renforce notre capacité à gérer la sécurité intérieure et l'administration. Cette institution joue un rôle crucial dans la stabilisation de la démocratie et la garantie d'une gouvernance efficace dans toute la République."
 WGR_Adenauer_49_Found_the_Federal_Insurance_Agency_for_Salaried_Employees:0 "Fonder l'Agence fédérale d'assurance pour les salariés."
 WGR_Adenauer_49_Found_the_Federal_Insurance_Agency_for_Salaried_Employees_desc:0 "La création de l'Agence fédérale d'assurance pour les salariés est une étape importante dans la mise en place d'un filet de sécurité sociale. Assurer la stabilité des travailleurs reflète notre engagement en faveur de la démocratie sociale et de l'équité dans une Allemagne moderne"
 WGR_Adenauer_49_Augment_BGS_Personnel_to_20K:0 "Augmenter les effectifs du BGS à 20 000 personnes"
 WGR_Adenauer_49_Augment_BGS_Personnel_to_20K_desc:0 "L'augmentation des effectifs de la Garde frontalière fédérale à 20 000 personnes est une mesure essentielle pour la sécurité nationale. Assurer une bonne protection des frontières démontre notre détermination à préserver notre souveraineté et notre stabilité."
 WGR_Adenauer_49_Prepare_for_the_1953_Federal_Election:0 "Se préparer pour les élections fédérales de 1953"
 WGR_Adenauer_49_Prepare_for_the_1953_Federal_Election_desc:0 "La préparation des élections fédérales de 1953 est essentielle au renforcement de notre démocratie. Mettre en avant les réalisations tout en relevant les défis qui restent à relever permettra de définir l'orientation future de la République et de renforcer la confiance du public."
 WGR_Adenauer_49_Dealing_with_Denazification:0 "Faire face à la dénazification"
 WGR_Adenauer_49_Dealing_with_Denazification_desc:0 "La question complexe de la dénazification reste un sujet controversé pour le gouvernement fédéral. Trouver un équilibre entre justice et réconciliation définit notre redressement politique et le cadre moral de la République."
 WGR_Adenauer_49_The_Globke_Scandal:0 "Le scandale Globke"
 WGR_Adenauer_49_The_Globke_Scandal_desc:0 "Le scandale Globke soulève des questions difficiles concernant la responsabilité au sein du gouvernement fédéral. La gestion de cette controverse met à l'épreuve la confiance du public et l'engagement en faveur de la transparence requis dans une administration démocratique."
 WGR_Adenauer_49_Dealing_with_Landsberg_Prisoners:0 "Le traitement des prisonniers de Landsberg"
 WGR_Adenauer_49_Dealing_with_Landsberg_Prisoners_desc:0 "Le sort des prisonniers de Landsberg est une question qui divise, mettant en évidence les tensions entre justice et réconciliation. Entre les attentes internationales et les pressions nationales, le gouvernement fédéral doit prendre cette décision avec prudence."
 WGR_Adenauer_49_Receive_the_Himmerod_Memorandum:0 "Recevoir le mémorandum Himmerod"
 WGR_Adenauer_49_Receive_the_Himmerod_Memorandum_desc:0 "Le mémorandum Himmerod présente les principales recommandations pour la reconstruction des capacités de défense de l'Allemagne. Il est essentiel d'évaluer ces propositions à la lumière de la surveillance exercée par les Alliés et de l'opinion publique afin de définir la future politique de sécurité."
 WGR_Adenauer_49_Vote_on_Laws_Ending_Denazification:0 "Vote sur les lois mettant fin à la dénazification"
 WGR_Adenauer_49_Vote_on_Laws_Ending_Denazification_desc:0 "Le vote visant à mettre fin aux lois de dénazification est une mesure controversée mais nécessaire pour normaliser la société allemande. Clôturer ce chapitre favorise la réconciliation et le progrès tout en conciliant le besoin de justice et la stabilité de la nation."
 WGR_Adenauer_49_Focus_on_Apologies_and_Compensation:0 "Mettre l'accent sur les excuses et l'indemnisation"
 WGR_Adenauer_49_Focus_on_Apologies_and_Compensation_desc:0 "L'accent mis sur les excuses et les indemnisations reflète l'engagement du gouvernement fédéral en matière de responsabilité morale. Ces mesures permettent de réparer les torts passés tout en rétablissant la confiance et en jetant les bases d'une société plus unie et plus éthique."
 WGR_Adenauer_53_A_Second_Adenauer_Government:0 "Un deuxième gouvernement Adenauer"
 WGR_Adenauer_53_Revamp_Rail_Systems_in_Northern_Germany:0 "Modernisation des systèmes ferroviaires dans le nord de l'Allemagne"
 WGR_Adenauer_53_Form_Lufthansa:0 "Former Lufthansa"
 WGR_Adenauer_53_Build_TV_RFE_Transmitters:0 "Construire des émetteurs pour la télévision et Radio Europe libre"
 WGR_Adenauer_53_Form_CDU_Majority_in_Bundestag:0 "Former une majorité nationale-conservatrice au Bundestag"
 WGR_Adenauer_53_Consolidate_Sideline_Former_Coalition_Members:0 "Dénoncer la coopération entre le KPD et le SPD"
 WGR_Adenauer_53_Seek_Cooperation_with_SPD_FDP_Members:0 "Rechercher la coopération avec le SPD"
 WGR_Adenauer_53_Form_an_FDP_Coalition:0 "Inclure le FDP comme partenaire de coalition"
 WGR_Adenauer_53_Pass_the_German_Restitution_Laws:0 "Adopter les lois allemandes sur la restitution"
 WGR_Adenauer_53_Form_the_Federal_Ministry_of_Family_Affairs:0 "Former le ministère fédéral des Affaires familiales"
 WGR_Adenauer_53_Experience_the_Miracle_of_Bern:0 "Découvrir le « miracle de Berne »"
 WGR_Adenauer_53_Assist_Siemens_in_Developing_Prototype_Computers:0 "Aider Siemens à développer des prototypes d'ordinateurs"
 WGR_Adenauer_53_Begin_BASF_Chemical_Production_in_North_Rhine:0 "Débuter la production chimique de BASF en Rhénanie-du-Nord-Westphalie"
 WGR_Adenauer_53_Lobby_For_Release_of_Spandau_Seven:0 "Campagne pour la libération des « sept de Spandau »"
 WGR_Adenauer_53_Petition_for_Neurath_and_Raeder_To_Be_Released:0 "Pétition pour la libération de von Neurath et Raeder"
 WGR_Adenauer_53_Face_International_Backlash_For_the_Release_of_Nazis:0 "Face à la réaction internationale négative suite à la libération des nazis"
 WGR_Adenauer_53_Demand_the_Return_of_Otto_John_From_DDR:0 "Exiger le retour d'Otto John depuis l'Allemagne de l'Est"
 WGR_Adenauer_53_Form_Appeal_Courts_For_Labor_and_Social_Disputes:0 "Former la Cour d'appel pour les litiges sociaux et du travail"
 WGR_Adenauer_53_Form_the_Federal_Institute_For_Materials_Research_and_Testing:0 "Former l'institut fédéral pour la recherche et les essais sur les matériaux"
 WGR_Adenauer_53_Receive_Full_Sovereignty_in_the_Paris_Conference:0 "Obtenir la pleine souveraineté lors de la Conférence de Paris"
 WGR_Adenauer_53_International_Affairs:0 "Affaires internationales"
 WGR_Adenauer_53_EDC_Fate:0 "Le destin de la Communauté européenne de défense"
 WGR_Adenauer_53_EDC_Passes:0 "L'EDC réussie"
 WGR_Adenauer_53_EDC_Fails:0 "L'EDC échoue"
 WGR_Adenauer_53_Begin_Rapid_Bundeswehr_Rearmament:0 "Commencer le réarmement rapide"
 WGR_Adenauer_53_Seek_Further_Military_Aid_From_EDC_Countries:0 "Demander une aide militaire supplémentaire aux pays membres de l'EDC"
 WGR_Adenauer_53_Work_With_the_UK_to_Rearm:0 "Collaborer avec le Royaume-Uni pour se réarmer"
 WGR_Adenauer_53_Found_the_Federal_Ministry_for_Atomic_Affairs:0 "Création du ministère fédéral des Affaires atomiques"
 WGR_Adenauer_53_Introduce_the_Hallstein_Doctrine:0 "Présenter la doctrine Hallstein"
 WGR_Adenauer_53_Receive_the_Last_German_POWs_From_Soviets:0 "Recevoir les derniers prisonniers de guerre allemands des Soviétiques"
 WGR_Adenauer_53_Denounce_the_Soviet_Two_State_German_Theory:0 "Dénoncer la théorie soviétique des deux États allemands"
 WGR_Adenauer_53_Make_a_State_Visit_to_the_USSR:0 "Effectuer une visite officielle en URSS"
 WGR_Adenauer_53_Standardize_the_German_School_System:0 "Standardiser le système scolaire allemand"
 WGR_Adenauer_53_Construct_Frankfurt_Egelsbach_Airport:0 "Construire l'aéroport de Francfort-Egelsbach"
 WGR_Adenauer_53_Conclude_a_Worker_Recruitment_Agreement_with_Italy:0 "Conclure un accord de recrutement de travailleurs avec l'Italie"
