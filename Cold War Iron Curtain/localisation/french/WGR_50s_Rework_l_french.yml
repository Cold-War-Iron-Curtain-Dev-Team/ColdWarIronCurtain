 WGR_FDP_Prov_Debate_Role_of_Monarchy_in_Germany: "Débattre du rôle de la monarchie en Allemagne"
 WGR_FDP_Prov_Welcome_Ex_FVP_Members_and_Radicals: "Bienvenue aux anciens membres du FVP et aux radicaux"
 WGR_FDP_Prov_Condemn_Ideals_of_Nazis_and_SRP: "Condamner les idéaux nazis et le SRP"
 WGR_FDP_Prov_Begin_Crusade_Against_Leftism: "Lancer une croisade contre le gauchisme en Allemagne"
