 WGR_1949_Adenauer_No_SPD_Talks_tt: "§RTout en excluant le SPD des affaires officielles de la coalition et en le contrariant encore davantage, son influence au sein du Bundesrat entraînera le blocage de certaines lois financières et administratives. Les orientations correspondantes seront contournées, n'accordant aucun avantage à notre Administration. D'un autre côté, cela maintiendrait globalement l'influence du SPD à distance et nous apporterait une plus grande stabilité gouvernementale.§!"
