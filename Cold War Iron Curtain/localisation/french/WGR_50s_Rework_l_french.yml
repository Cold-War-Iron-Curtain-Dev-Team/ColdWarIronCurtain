 WGR_SPD_Ollenhauer_Bundestag_1953: "Le Bundestag"
 WGR_SPD_BUNDESTAG_1953_OLLENHAUER_1_DESC_GUI: "Cela n'a peut-être pas l'air d'être le cas, mais quatre ans se sont déjà écoulés depuis le premier Bundestagswahl, et les sociaux-démocrates bénéficient d'un soutien populaire à un niveau qui n'avait même pas été atteint lors de leur apogée au début de la Première République. Les démocrates-chrétiens ont été à nouveau intégrés dans l'opposition, Erich Ollenhauer étant le successeur de Kurt Schumacher à la chancellerie allemande.\n\nLe Bundestag a besoin de coalitions majoritaires pour adopter des lois, ce qui signifie qu'Ollenhauer a besoin d'au moins 255 des 509 sièges actuels pour soutenir son programme. À cela s'ajoute l'introduction de la clause des 5 %, exigeant que les partis politiques obtiennent au moins 5 % des voix ou remportent le mandat dans une circonscription électorale. Un autre ajout était le deuxième vote, permettant aux gens de voter pour un candidat politique local. Le moment est à nouveau venu de tendre la main aux autres partis, prêts à soutenir la politique d'Ollenhauer, en faisant des promesses et en trouvant des compromis qui profiteront aux deux parties.\n\n§C255§! sièges sont requis pour une majorité. Les résultats des élections sont les suivants :"
 WGR_SPD_BUNDESTAG_1953_OLLENHAUER_2_DESC_GUI: "\n§SParti social-démocrate d'Allemagne (SPD)§!: 217\n§PUnion chrétienne-démocrate (CDU/CSU)§!: 180\n§BCentre§!: 38\n§mParti Démocratique Libre (FDP)§!: 35\n§cParti allemand (DP)§!: 20\n§gBloc panallemand/Association des anciens combattants et des personnes déplacées (GB/BHE) §!: 19\n\nPartenaires actuels de la coalition : [WGR_OllenhauerCoalitionPartnersStatus1953]"

