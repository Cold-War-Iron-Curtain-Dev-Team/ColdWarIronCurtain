 WGR_Franke_53_Bundeskanzler_Egon_Franke_desc: "Après les événements tumultueux de ces dernières années, le Bundestag a confirmé le nouveau président de la République fédérale. Egon Franke, figure clé de l'aile pragmatique du SPD, a accédé à la Chancellerie. Son gouvernement, une coalition du SPD et du Zentrum, est désormais confronté à la tâche monumentale de guider l'Allemagne à travers la guerre froide."

 WGR_Franke_53_Make_a_Report_to_the_Bundestag_desc: "Le chancelier Franke présentera pour la première fois un rapport complet au Bundestag. Ce discours décrira l'état de la nation, les défis à venir et les choix fondamentaux que son gouvernement doit faire concernant son programme de politique intérieure et étrangère. C'est un discours qui fixera le cap pour les années à venir."

 WGR_Franke_53_Work_as_United_SPD_desc: "Le SPD est une Église large et sa véritable force réside dans l'unité. En travaillant en étroite collaboration avec Erich Ollenhauer et l'aile gauche traditionnelle du parti, nous pouvons présenter un front uni. Cette voie donne la priorité aux principes sociaux-démocrates, à la solidarité et aux principes fondamentaux de la longue histoire de notre parti plutôt qu'au compromis avec l'opposition."

 WGR_Franke_53_Work_With_CDU_FDP_desc: "Gouverner efficacement dans une nation divisée nécessite du pragmatisme et non une idéologie. Afin de garantir une majorité stable en faveur de réformes cruciales, notamment en matière économique et de politique étrangère, nous devons rechercher une coopération avec la CDU et le FDP. Cette voie de compromis pourrait aliéner l'aile gauche de notre parti, mais pourrait forger un puissant consensus centriste pour l'Allemagne."

 WGR_Franke_53_Push_for_School_Secularization_desc: "Pendant trop longtemps, l'Église a exercé une influence indue sur l'éducation publique. Dans un État moderne et démocratique, les écoles devraient être libérées de tout dogme religieux. Nous ferons pression en faveur d'une législation garantissant la laïcisation complète de notre système scolaire public, pierre angulaire d'une société progressiste."

 WGR_Franke_53_Empower_Young_Socialists_desc: "L'avenir de notre parti réside dans sa jeunesse. En responsabilisant les « Jusos » (Jeunes socialistes) et en leur donnant une plus grande voix dans les décisions du parti, nous pouvons garantir qu'une nouvelle génération de sociaux-démocrates passionnés et fondés sur des principes soit prête à faire avancer la nation."

 WGR_Franke_53_Nationalize_Water_Power_Utilities_desc: "L'accès à l'eau et à l'électricité est un droit fondamental et non une marchandise pouvant être exploitée à des fins de profit privé. L'État va nationaliser tous les principaux services publics d'eau et d'électricité, en veillant à ce qu'ils soient gérés pour le bien public et que ces ressources essentielles restent entre les mains de la population."

 WGR_Franke_53_Advance_Market_Economy_Interests_desc: "Pour garantir la coopération de l'opposition et libérer le potentiel économique de l'Allemagne, notre gouvernement mettra en avant des politiques qui soutiennent les principes de l'économie sociale de marché. Cela signifie promouvoir la libre entreprise, une monnaie stable et un environnement favorable aux entreprises pour stimuler la croissance."

 WGR_Franke_53_Agree_on_Reparation_Payments_to_Jewish_Refugees_desc: "L'Allemagne porte une responsabilité historique qui ne peut être ignorée. Dans un geste de réconciliation morale et de coopération avec l'opposition, notre gouvernement acceptera formellement l'Accord de Luxembourg, commençant à verser des réparations aux réfugiés juifs et à l'État d'Israël pour les horreurs du passé."

 WGR_Franke_53_Appoint_Several_CDU_Ministers_desc: "La coopération doit être plus que de simples mots. Pour construire un véritable gouvernement d'unité nationale, plusieurs postes ministériels clés seront proposés à des membres éminents de la CDU. Cela consolidera notre nouvelle relation de travail et garantira que leurs intérêts soient représentés au plus haut niveau du gouvernement."
 
 WGR_Franke_53_Debate_the_Role_of_BGS_desc: "La Garde fédérale des frontières, notre seule force armée nationale, se trouve à la croisée des chemins. S'agit-il simplement d'une police des frontières ou est-ce le germe d'une future armée allemande ? Le Bundestag doit tenir un débat sérieux sur le futur rôle, la taille et la mission du BGS."

 WGR_Franke_53_Expand_BGS_Into_Fighting_Force_desc: "Face à la menace soviétique, une simple patrouille frontalière ne suffit pas. Le BGS doit être élargi et rééquipé pour servir de force de combat mobile crédible, capable de défendre notre territoire et d'agir comme un véritable précurseur d'une armée nationale."

 WGR_Franke_53_Scale_Back_BGS_desc: "Le but du BGS est de surveiller nos frontières, et non de devenir une armée clandestine. Nous résisterons aux pressions en faveur du réarmement et réduirons les capacités militaires du BGS, réaffirmant ainsi son statut d'organisation défensive et axée sur le maintien de l'ordre."

 WGR_Franke_53_Integrate_Customs_Service_into_BGS_desc: "Afin d'améliorer l'efficacité et de rationaliser le contrôle aux frontières, le service des douanes distinct (Zollgrenzdienst) sera entièrement intégré à la structure de commandement des gardes-frontières fédéraux, créant ainsi une organisation unique et unifiée responsable de toutes les questions frontalières."

 WGR_Franke_53_Professionalize_Border_Troops_desc: "Une force frontalière moderne nécessite plus que de simples effectifs ; cela nécessite une expertise. Nous investirons dans des programmes de formation avancés et dans de meilleurs équipements pour professionnaliser nos troupes frontalières, en nous concentrant sur leur mission principale de surveillance et de sécurité."

 WGR_Franke_53_Decrease_Funding_to_Border_Guard_desc: "Nos priorités résident dans la reconstruction sociale et économique, et non dans les dépenses militaires. Le financement du BGS sera réduit, les ressources étant réaffectées à des besoins nationaux plus urgents. La défense de l'Allemagne relève de la compétence des puissances alliées."

 WGR_Franke_53_Remain_With_Only_Border_Defense_Troops_desc: "Notre engagement est la défense, pas l'offensive. Le BGS sera structuré uniquement pour la tâche de défendre notre frontière immédiate, sans capacité ni doctrine pour des opérations au-delà de cette portée limitée. Cela rassurera nos voisins et le monde sur nos intentions pacifiques."

 WGR_Franke_53_Authorize_More_BGS_Units_desc: "La longue frontière avec l'Est est dangereusement poreuse. Pour le sécuriser correctement, nous devons autoriser la création de plusieurs nouvelles unités BGS, augmentant ainsi nos effectifs et garantissant que nous puissions patrouiller l'intégralité du rideau de fer."

 WGR_Franke_53_Purchase_Armored_Vehicles_and_Light_Aircraft_desc: "Pour donner au BGS une chance de lutter contre toute incursion potentielle, il doit être mécanisé. Nous autoriserons l'achat de véhicules blindés modernes, de transports et d'avions de reconnaissance légers pour améliorer la mobilité et la puissance de feu de nos unités frontalières."

 WGR_Franke_53_Expand_the_Inner_German_Border_desc: "La division de l'Allemagne est une réalité tragique et la frontière doit être sécurisée. Nous étendrons et renforcerons les infrastructures le long de la frontière intérieure allemande, non pas pour la rendre permanente, mais pour contrôler les passages illégaux et protéger notre État des infiltrations orientales."

 WGR_Franke_53_Prepare_For_a_Transition_to_the_Bundeswehr_desc: "Le temps des faux-semblants est révolu. Le BGS sera désormais officiellement désigné comme cadre d'une future armée nationale, la Bundeswehr. Sa structure de commandement, sa formation et sa doctrine seront réformées pour permettre une transition harmonieuse vers une force militaire à part entière."
 
 WGR_Franke_53_Introduce_Franke_Doctrine_of_FP_desc: "Le chancelier Franke articulera une nouvelle vision de la politique étrangère allemande. La « doctrine Franke » sera basée sur le pragmatisme, un engagement ferme envers l'alliance occidentale et la poursuite inlassable des intérêts allemands par la négociation et la diplomatie, et non par la confrontation."

 WGR_Franke_53_Commit_to_Eventual_German_Reunification_desc: "Bien que le chemin soit flou et les obstacles immenses, aucun gouvernement allemand ne pourra jamais abandonner l'objectif d'une nation unie. Nous réaffirmerons officiellement notre engagement inébranlable en faveur d'une éventuelle réunification pacifique et libre de l'Allemagne."

 WGR_Franke_53_Open_Inner_German_Border_desc: "La division de notre peuple est une blessure ouverte. Dans le cadre d'un geste humanitaire et d'une étape vers la réduction des tensions, nous allégerons unilatéralement les restrictions sur les déplacements à travers la frontière intérieure de l'Allemagne, permettant ainsi aux familles de se réunir et favorisant les contacts entre nos peuples."

 WGR_Franke_53_Condemn_Soviet_Invasion_of_Hungary_desc: "L'écrasement brutal du soulèvement hongrois par les chars soviétiques est un outrage à la liberté. Le gouvernement allemand condamnera fermement et sans équivoque cet acte de tyrannie, en solidarité avec le peuple hongrois."

 WGR_Franke_53_Debate_Response_to_Suez_desc: "La crise du canal de Suez divise nos alliés occidentaux. L'Allemagne doit débattre soigneusement de sa réponse, en gérant les retombées diplomatiques complexes tout en affirmant ses propres intérêts en tant que nation commerçante souveraine."

 WGR_Franke_53_Continue_Slow_Western_Integration_desc: "Notre avenir appartient à l'Occident, mais nous ne nous laisserons pas précipiter. L'Allemagne poursuivra une politique d'intégration lente et délibérée dans les institutions occidentales comme l'OTAN et la CEE, en veillant à ce que chaque étape soit prise en tenant pleinement compte de nos intérêts nationaux."

 WGR_Franke_53_Allow_Limited_NATO_Exercises_in_Germany_desc: "En signe de notre engagement envers l'alliance occidentale, nous autoriserons des exercices militaires limités et à petite échelle de l'OTAN sur le sol allemand. Cela démontre notre fiabilité en tant que partenaire sans provoquer inutilement l'Union soviétique."

 WGR_Franke_53_Conclude_Security_Agreements_with_US_UK_France_desc: "Pour formaliser notre relation en matière de défense et sécuriser notre nation, notre gouvernement négociera et conclura des accords de sécurité complets avec les trois principales puissances alliées : les États-Unis, le Royaume-Uni et la France."

 WGR_Franke_53_Proclaim_Germanys_Position_on_World_Stage_desc: "L'Allemagne n'est plus un simple objet de politique internationale, elle est un acteur souverain. La chancelière prononcera un discours important dans lequel elle proclamera notre nouvelle position confiante sur la scène mondiale et exposera nos ambitions en tant que puissance européenne clé."

 WGR_Franke_53_Announce_Godesburg_Program_desc: "Le moment est venu pour le SPD de se moderniser. Lors d'une conférence à Bad Godesberg, la direction du parti annoncera son intention d'élaborer un nouveau programme du parti, qui redéfinira nos valeurs fondamentales pour une nouvelle ère."

 WGR_Franke_53_Appoint_Schiller_as_Minister_of_Economics_desc: "Pour superviser notre nouvelle vision économique, nous nommerons le brillant économiste Karl Schiller au poste de ministre de l'Économie. Son expertise en économie keynésienne et en politiques orientées vers le marché sera au coeur du programme de notre gouvernement."

 WGR_Franke_53_Transform_SPD_Into_Peoples_Party_desc: "Le SPD doit dépasser ses origines en tant que parti uniquement de la classe ouvrière industrielle. Grâce au programme Godesberg, nous le transformerons en un véritable « Volkspartei », un grand parti capable de gagner le soutien de la classe moyenne, des intellectuels et de tous les Allemands qui croient en la liberté et la justice sociale."

 WGR_Franke_53_Undergo_Purge_of_Leftists_in_Party_desc: "Pour que le programme Godesberg réussisse, le parti doit être uni derrière sa nouvelle orientation pragmatique. Ceux d'extrême gauche qui s'accrochent à un dogme marxiste dépassé et résistent au changement seront politiquement mis à l'écart et, si nécessaire, expulsés de leurs positions d'influence."

 WGR_Franke_53_Investigate_Subversives_Within_SPD_desc: "Certains éléments au sein de notre propre parti peuvent avoir des sympathies ou des liens avec des puissances étrangères. Nous autoriserons une enquête interne discrète pour identifier tout individu subversif qui pourrait chercher à saper le SPD de l'intérieur."

 WGR_Franke_53_Surveil_Former_KPD_SED_Members_desc: "Bien que le Parti communiste soit interdit, ses anciens membres constituent toujours une menace potentielle pour notre démocratie. Nos services de sécurité seront chargés de surveiller les activités d'anciens membres connus du KPD et du SED est-allemand."

 WGR_Franke_53_Denounce_All_Forms_of_Marxism_and_Communism_desc: "Pierre angulaire de la transformation de notre parti, le programme Godesberg comprendra une dénonciation explicite et totale de toutes les formes de marxisme et de communisme, séparant clairement la social-démocratie des idéologies totalitaires de l'Est."
 
 WGR_Franke_53_Present_Massive_Social_Reforms_desc: "Une économie forte n'a aucun sens si elle ne sert pas la population. Notre gouvernement présentera un ensemble de réformes sociales massives visant à renforcer le filet de sécurité sociale, à améliorer le niveau de vie et à créer une société plus juste et équitable."

 WGR_Franke_53_Divorce_SPD_Socdem_from_Marxism_desc: "Le langage de la lutte des classes est une relique du passé. Notre nouveau programme séparera explicitement la politique du SPD de la théorie marxiste, fondant plutôt nos politiques sur le socialisme éthique, l'humanisme et les principes d'une économie sociale de marché."

 WGR_Franke_53_Present_Preliminary_Federal_National_Insurance_desc: "Afin de protéger nos citoyens des difficultés liées à la maladie et au chômage, nous présenterons le cadre d'un système préliminaire d'assurance nationale fédérale, jetant les bases d'un État-providence global."

 WGR_Franke_53_Allow_Unions_Representation_In_National_Organization_desc: "Les syndicats sont un partenaire essentiel de notre social-démocratie. Nous soutiendrons la création d'une organisation nationale qui donne aux syndicats une représentation officielle dans l'élaboration des politiques économiques, garantissant ainsi que la voix des travailleurs soit entendue."

 WGR_Franke_53_Propose_Keynesian_Economic_System_desc: "Guidés par le ministre Schiller, nous proposerons formellement une transition vers un système économique keynésien. Grâce à des dépenses publiques ciblées et à une gestion de la demande mondiale, nous pouvons garantir une croissance stable, le plein emploi et une prospérité durable."

 WGR_Franke_53_Revamp_German_Medical_and_Hospital_Systems_desc: "La santé de notre nation est primordiale. Nous lancerons une refonte complète de nos systèmes médicaux et hospitaliers, en investissant dans des installations modernes, une meilleure formation des médecins et des infirmières et en garantissant l'accès à des soins de santé de qualité pour tous les citoyens."

 WGR_Franke_53_Continue_Industrialization_desc: "Le miracle économique allemand ne doit pas ralentir. Notre gouvernement continuera de promouvoir une industrialisation rapide, en investissant dans l'industrie lourde, l'industrie manufacturière et les nouvelles technologies pour alimenter la croissance de notre pays."

 WGR_Franke_53_Expand_Rail_Systems_and_Logistics_Hubs_desc: "Pour soutenir notre industrie en plein essor, nous devons disposer d'infrastructures de classe mondiale. Un programme d'investissement massif sera lancé pour étendre notre système ferroviaire national et développer des pôles logistiques modernes, garantissant un transport fluide des marchandises à travers le pays."

 WGR_Franke_53_Advertise_Bavarian_Beer_Industry_desc: "Notre culture est l'une de nos plus grandes exportations ! Une campagne spéciale, soutenue par le gouvernement, sera lancée pour faire connaître l'industrie de la bière bavaroise sur la scène mondiale, promouvoir le tourisme et le commerce et peut-être améliorer les relations diplomatiques, une chope à la fois."

 WGR_Franke_53_Nationalize_VW_and_Build_More_Facilities_desc: "Volkswagen est un symbole de la prouesse industrielle allemande et appartient au peuple. Nous nationaliserons entièrement l'entreprise et investirons massivement dans la construction de nouvelles installations de production pour répondre à la demande mondiale croissante pour nos automobiles."

 WGR_Franke_53_Develop_Oil_Refining_Facilities_desc: "Pour réduire notre dépendance aux carburants raffinés importés, l'Allemagne doit développer sa propre capacité de raffinage. Nous apporterons le soutien de l'État à la construction de raffineries de pétrole modernes dans nos principaux ports, une étape cruciale pour notre sécurité économique."

 WGR_Franke_53_Allow_American_Investment_in_Germany_desc: "La reconstruction de notre économie nécessite des capitaux, et nos partenaires américains sont prêts à les fournir. Nous créerons un cadre juridique favorable pour encourager et protéger les investissements américains dans les industries allemandes, accélérant ainsi notre reprise économique."

 WGR_Franke_53_Prepare_For_the_1957_Federal_Election_desc: "Notre mandat touche à sa fin et le peuple rendra bientôt son verdict sur notre gouvernement. Nous devons maintenant commencer à préparer le Bundestagswahl de 1957, en mobilisant notre parti et en élaborant un message qui nous assurera encore quatre années au pouvoir."
 
 WGR_Franke_53_Declare_Berlin_a_Land_desc: "Le statut juridique ambigu de Berlin-Ouest, ville d'esprit allemand mais occupée de droit, ne peut pas perdurer. Notre gouvernement franchira une étape décisive en déclarant officiellement Berlin-Ouest un État fédéral (Land) à part entière et égalitaire de la République fédérale, comme le prévoit notre Loi fondamentale. Cet acte affirme la souveraineté allemande sur les lois alliées et donne au peuple berlinois la voix démocratique qui lui revient au Bundestag."

 WGR_Franke_53_Sign_the_Saar_Treaty_desc: "Le statut non résolu de la Sarre reste un obstacle majeur aux relations franco-allemandes et à l'unité européenne. Pour sortir de l'impasse, notre gouvernement acceptera de signer le traité de la Sarre. Même si cela implique d'accepter un statut « européen » spécial pour la région au lieu de son retour immédiat, il s'agit d'un compromis nécessaire pour garantir la coopération française et faire avancer la cause d'une Europe unie."
 
 
