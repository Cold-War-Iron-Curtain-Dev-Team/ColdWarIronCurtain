 Thorn_in_the_Side: "Une épine dans le pied"
 Thorn_in_the_Side_desc: "Les récents développements socialistes en Allemagne de l'Ouest ont gâché nos projets de coopération ouest-européenne. Le KPD vise à s'aligner sur l'Union soviétique et pourrait chercher à réunifier l'Allemagne sous une bannière rouge. Nous devons surveiller cette évolution et la contrôler si elle devait devenir incontrôlable."
 Armoured_Use: "Utilisation blindée"
 WGR_state_owned_stores: "Magasins de biens de consommation appartenant à l'État"
 WGR_state_owned_stores_desc: "Les magasins de biens de consommation appartenant à l'État garantiront une distribution équitable des biens, réduiront la dépendance à l'égard de l'entreprise privée et promouvront l'égalité économique."
 ig_farben: "IG Farben"
 ig_farben_desc: "Bien que controversée en raison de sa coopération étroite avec le NSDAP entre 1933 et 1945, l'IG Farben reste toujours la première entreprise chimique et pharmaceutique en Europe. Bien qu'il ne soit pas possible de poursuivre l'ancienne voie, les ressources et le potentiel sont trop précieux pour être abandonnés."
 WGR_Party_Cooperation: "Coopération CDU-SPD"
 WGR_Party_Cooperation_desc: "Les relations entre le SPD et la CDU se caractérisent par un contraste idéologique marqué et une rivalité politique croissante. La CDU défend une orientation résolument orientée vers l'Occident, plaidant pour l'intégration européenne, le réarmement et l'économie sociale de marché. Pendant ce temps, le SPD se positionne comme la voix de la justice sociale, de la neutralité nationale et de la réunification par la diplomatie plutôt que par l'alignement avec l'Occident. Même si les deux partis revendiquent une légitimité démocratique, la coopération relève du domaine politique et les débats au Bundestag sont souvent intenses. Pourtant, malgré de profondes divisions, leur rivalité constitue le fondement d'une démocratie parlementaire fonctionnelle dans la jeune République fédérale."
 WGR_Kanalarbeiter_Cooperation: "Coopération Kanalarbeiter"
 WGR_Kanalarbeiter_Cooperation_desc: "Le coup du chancelier Schumacher a vu le vice-chancelier Egon Franke prendre une importance plus grande qu'il n'aurait jamais pu le prédire, leader du Kanalarbeiter, l'aile puissante et pragmatique du SPD.\n\nConnue sous le nom de « Travailleurs du canal », cette faction excelle dans le travail politique invisible et pratique : faire respecter la discipline de parti et conclure des accords plutôt que de se concentrer sur une idéologie rigide. Leur ascension marque une rupture radicale avec la politique du principe inflexible de Schumacher.\n\nLà où Schumacher s'est montré conflictuel, les Kanalarbeiter sont des négociateurs, considérés comme plus disposés à faire des compromis avec les Alliés occidentaux."
 WGR_Wirtschaftswunder: "Prodige du Wirtschaft"
 WGR_Wirtschaftswunder_desc: "Nous sommes au début des années 1950 et, dans toute l'Allemagne de l'Ouest, une transformation remarquable est en cours. Quelques années seulement après les ravages de la guerre, les usines tournent à pleine capacité, de nouvelles maisons surgissent sur les décombres des anciennes et les vitrines des magasins brillent à nouveau de marchandises. Cette reprise économique rapide, désormais largement appelée Wirtschaftswunder - ou « miracle économique » - est motivée par une combinaison de réforme monétaire, d'aide du Plan Marshall et de l'introduction de l'économie sociale de marché sous la direction du ministre Ludwig Erhard. Les Allemands ordinaires, dont beaucoup ont enduré des années de difficultés, assistent au retour de la prospérité et de la stabilité. Même si des défis subsistent, l'optimisme est dans l'air : l'Allemagne se reconstruit, non seulement physiquement, mais aussi économiquement et spirituellement."
 WGR_Nuclear_Stance: "Position nucléaire"
 WGR_Nuclear_Program_Development: "Programme Deutsches Atomkraft"
 WGR_Ex_Nazi_Influence: "Influence nationale-socialiste"
 WGR_Ex_Nazi_Influence_desc: "La question de savoir comment traiter les anciens nazis continue de s'avérer profondément controversée. Même si les efforts officiels de dénazification se poursuivent initialement sous la supervision des Alliés, les réalités politiques et administratives ont conduit à une approche plus pragmatique. Une grande partie de l'expertise bureaucratique, juridique et militaire de l'Allemagne étant liée à ceux qui avaient servi sous le Troisième Reich, de nombreux anciens membres et responsables du parti réintégrèrent discrètement la fonction publique. Cela a créé un malaise croissant parmi des segments de la population, en particulier au sein du SPD et des jeunes démocrates, qui craignaient un retour des tendances autoritaires."
 WGR_KPD_Approval: "Approbation KPD"
 WGR_KPD_State_Control: "Contrôle d'État du KPD"
 WGR_Public_Approval: "Approbation publique"
 WGR_Communist_Influence: "Influence communiste"
 WGR_BGS_Performance: "Performance de la Bundesgrenzschutz/Bundeswehr"
 WGR_BGS_Performance_desc: "La Bundesgrenzschutz constitue la principale force de sécurité intérieure de l'Allemagne de l'Ouest en période d'incertitude et de tensions liées à la guerre froide. Formé sous la supervision des Alliés, le BGS a pour mission de protéger les frontières de la République fédérale, notamment contre les infiltrations et les troubles venant de l'Est. Bien qu'il s'agisse techniquement d'une force de police civile, sa structure et sa formation ressemblent beaucoup à celles d'une unité militaire, reflétant l'environnement sécuritaire fragile de la première république. Le BGS devient rapidement un symbole de souveraineté et d'ordre, jetant les bases de la Bundeswehr en tant que future force de défense nationale tout en restant sous un contrôle fédéral strict."
