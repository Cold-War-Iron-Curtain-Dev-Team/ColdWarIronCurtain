 WGR_SPD_Bundestag_1949: "Le Bundestag"
 WGR_SPD_BUNDESTAG_1949_1_DESC_GUI: "\nPour la première fois en 12 ans, le peuple allemand est revenu aux urnes pour élire ses mandats libres, qui façonneront l'avenir de l'Allemagne au sein du Bundestag nouvellement créé, la continuité institutionnelle du Reichstag du Kaiserreich et de la Première République. La bataille acharnée entre les sociaux-démocrates et les chrétiens-démocrates s'est soldée par la victoire de Kurt Schumacher, qui sera désormais chancelier allemand pour les quatre prochaines années.\n\nLe Bundestag a besoin de coalitions majoritaires pour adopter des lois, ce qui signifie que Schumacher a besoin d'au moins 202 des 402 sièges pour le soutenir. Le moment est maintenant venu de tendre la main aux autres partis prêts à soutenir la politique du SPD, en faisant des promesses et en trouvant des compromis qui profiteront aux deux parties.\n\n§C202§! sièges sont requis pour une majorité. Les résultats des élections sont les suivants :"
 WGR_SPD_BUNDESTAG_1949_2_DESC_GUI: "\n§PUnion chrétienne-démocrate (CDU/CSU)§!: 139\n§SParti social-démocrate d'Allemagne (SPD)§!: 131\n§mParti Démocratique Libre (FDP)§!: 52\n§4Parti Bavarois (BP)§!: 17\n§cParti allemand (DP)§!: 17\n§RParti communiste allemand (KPD)§!: 15\n§9Association pour la reconstruction économique (WAV)§!: 12\n§BCentre§!: 10\n§gIndépendant §!: 10\n\nPartenaires actuels de la coalition : [WGR_SchumacherCoalitionPartnersStatus1949]"

