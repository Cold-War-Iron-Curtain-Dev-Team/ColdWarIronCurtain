 WGR_Berlin_Sector_City_2: "Sektoren-Stadt Land Berlin"
 WGR_German_Expedition_Observers: "Observateurs allemands"
 WGR_German_Expedition_Observers_desc: "La guerre depuis la fin de la Seconde Guerre mondiale a radicalement changé. Les invasions massives, les batailles de Panzer et les conquêtes à grande échelle sont une relique de la guerre germano-soviétique, ce qui rend nos doctrines militaires terriblement dépassées. Les guerres par procuration, la guerre asymétrique et d'autres types de conflits innovants définiront cette guerre froide. Nous devrions envoyer diverses unités \"d'observateurs\" dans certains conflits, qui pourraient acquérir des informations et une expérience cruciales pouvant être utilisées pour optimiser les performances de nos forces armées. Compte tenu de notre histoire et des restrictions alliées, il serait préférable de garder cela secret..."
 Anti_Nazi_Sentiment: "Sentiment anti-nazi"
 WGR_War_Destruction_1: "Suite des bombardements alliés - Cendres et ruines"
 WGR_War_Destruction_1_desc: "Les campagnes de bombardements dévastatrices des Alliés pendant la Seconde Guerre mondiale ont laissé l'Allemagne en ruines, avec des villes entières réduites en ruines et des millions de personnes déplacées. Des centres industriels comme Hambourg, Cologne et Essen étaient détruits, tandis que des monuments culturels et historiques, de la Frauenkirche de Dresde à Unter den Linden de Berlin, restaient comme des squelettes obsédants de leur grandeur passée. Les infrastructures ont été détruites : les chemins de fer, les ponts et les usines sont devenus inopérants, rendant le transport et la production presque impossibles.\n\nAu-delà des destructions physiques, les bombardements ont infligé d'immenses souffrances humaines. Des centaines de milliers de personnes ont péri, tandis que des millions de survivants ont été confrontés à la famine, à l'itinérance et à la maladie dans les années qui ont immédiatement suivi la guerre. Le bilan psychologique a été tout aussi grave : de nombreux Allemands ont eu du mal à accepter l'ampleur de la dévastation, la perte d'êtres chers et le bilan moral de la guerre."
 WGR_War_Destruction_2: "Suite des bombardements alliés - Silent Cities"
 WGR_War_Destruction_2_desc: "Même si les feux de la guerre se sont éteints depuis longtemps, leurs cicatrices demeurent. De vastes tas de décombres dominent encore les rues et les squelettes des bâtiments bombardés rappellent sombrement le passé. Alors que les lignes de communication de base sont lentement rétablies, une grande partie du pays reste dans le chaos, avec des millions de sans-abri et des infrastructures en ruines. L'ampleur même de la destruction rend l'idée d'une reconstruction complète presque impossible : pour l'instant, la survie passe avant la reconstruction."
 WGR_War_Destruction_3: "Suite des bombardements alliés - Déblaiement des décombres"
 WGR_War_Destruction_3_desc: "Malgré l'ampleur des dégâts, les premiers signes de reprise apparaissent. Dans de nombreuses villes, les efforts de déblayage des décombres - souvent menés par les Trümmerfrauen, les « femmes des ruines » - ont véritablement commencé. Les soldats de retour et les familles déplacées travaillent ensemble pour récupérer ce qu'ils peuvent des décombres. Pourtant, l'impact de la guerre reste douloureusement visible ; des quartiers entiers sont vides et des abris de fortune se dressent là où se trouvaient autrefois les maisons. Le chemin à parcourir est long, mais pour la première fois, une lueur d'espoir apparaît au milieu des ruines."
 WGR_War_Destruction_4: "Suite des bombardements alliés - Reconstruire les bases"
 WGR_War_Destruction_4_desc: "Le lent processus de reconstruction commence à prendre forme. Le Plan Marshall injecte des ressources indispensables dans une économie en ruine, permettant ainsi la relance d'industries clés et de services essentiels. Les hôpitaux et les écoles rouvrent, offrant à beaucoup un semblant de vie normale. Pourtant, à chaque nouvelle structure qui s'élève, l'absence de l'architecture historique de l'Allemagne devient plus évidente : bon nombre des cathédrales, des hôtels de ville et des opéras autrefois grandioses ne sont plus que poussière. Les fondations d'une nouvelle Allemagne sont en train de se former, mais les cicatrices culturelles de la guerre ne guériront jamais complètement."
 WGR_War_Destruction_5: "Suite des bombardements alliés - L'aube de la reconstruction"
 WGR_War_Destruction_5_desc: "D'année en année, les ruines de la guerre s'estompent lentement, remplacées par de nouvelles maisons, usines et rues animées. Les entreprises rouvrent et les biens de consommation sont à nouveau disponibles, redonnant aux gens un sentiment de normalité oublié depuis longtemps. Les industries automobile et électronique font leurs premiers pas vers une reprise, signalant le début d'une résurgence économique. Pourtant, au milieu de ces progrès, quelque chose a été perdu : le coeur historique de nombreuses villes, désormais remplacé par une architecture moderne et pragmatique. Les destructions causées par la guerre constitueront toujours une blessure dans l'âme de la nation, mais l'Allemagne apprend à avancer sans oublier son passé."
 WGR_War_Destruction_6: "Suite des bombardements alliés - Un nouveau paysage" 
 WGR_War_Destruction_6_desc: "Le rythme de la construction s'accélère et, pour la première fois, certaines parties des villes allemandes détruites ressemblent à quelque chose de plus proche de ce qu'elles étaient avant la guerre. Les projets de logements aident à accueillir les familles déplacées et les usines fonctionnent à nouveau, même si beaucoup fonctionnent encore au sein des zones industrielles bombardées. Cependant, sous la surface du progrès, les blessures de la guerre restent vives. Les monuments culturels qui définissaient autrefois l'identité historique de l'Allemagne - tels que les vieux centres-villes de Francfort, Nuremberg et Hambourg - ont disparu à jamais ou ont été remplacés par des structures austères et modernes qui n'ont pas la grandeur de leurs prédécesseurs. Les cicatrices psychologiques perdurent, alors que beaucoup luttent pour réconcilier leurs souvenirs du passé avec les dures réalités du présent."
 WGR_War_Destruction_7: "Suite des bombardements alliés - Le Wirtschaftswunder"
 WGR_War_Destruction_7_desc: "Chaque année, les ruines de la guerre cèdent la place à une Allemagne modernisée. Les centres-villes reconstruits regorgent de commerces et l'économie bénéficie d'une forte hausse de la production industrielle. Les transports publics se développent et les universités rouvrent, formant une nouvelle génération pour faire avancer le pays. Pourtant, même si l'optimisme grandit, des souvenirs du passé demeurent : des parcelles de terre vides où se dressaient autrefois de fières cathédrales et palais, des monuments commémoratifs de guerre et les histoires de ceux qui ne reviendront jamais. L'Allemagne avance, mais elle ne laissera jamais derrière elle les destructions qu'elle a subies."
 WGR_War_Destruction_8: "Conséquences des bombardements alliés : des cicatrices qui subsistent"
 WGR_War_Destruction_8_desc: "L'ère des ruines et du rationnement touche à sa fin. L'Allemagne, bien que transformée à jamais, est à nouveau autonome. De nouvelles industries fleurissent et les villes se transforment en symboles de résilience, mêlant planification urbaine moderne et vestiges du passé. Alors que certains sites historiques ont été minutieusement reconstruits, d'autres restent irrémédiablement perdus, n'existant que dans de vieilles photographies et des souvenirs qui s'effacent. Les bombardements de la guerre jetteront toujours une ombre sur la nation, mais l'Allemagne ne s'est pas laissée définir par la destruction. Au lieu de cela, il est devenu un pays qui se souvient, se reconstruit et envisage l'avenir avec un optimisme prudent."
 summergames72: "Il existe un besoin de police spécialisée"
 WGR_Western_Occupation: "Occupation étrangère"
 WGR_Western_Occupation_desc: "Après la capitulation de la Wehrmacht le 8 mai 1945, les Alliés occidentaux et l'Union soviétique ont divisé l'Allemagne en quatre zones d'occupation, nous dépouillant des territoires de la Silésie, de la Poméranie, du Grenzmark, de la Sarre et de la Prusse orientale. Alors que l'Union soviétique continue d'occuper les parties de l'Allemagne centrale, y compris Berlin-Est, les Alliés occidentaux maintiennent également leurs armées sur notre territoire actuellement contrôlé, sapant ainsi notre souveraineté en tant qu'État indépendant et la continuité de l'État national allemand formé en 1871."
 wgr_ddr_refugees: "Réfugiés est-allemands"
 wgr_ddr_refugees_desc: "Des milliers de réfugiés est-allemands fuient vers l'Allemagne de l'Ouest, échappant au contrôle soviétique et aux conditions d'oppression qui règnent à l'Est ; cette vague croissante de familles désespérées met en évidence le fossé profond entre la liberté et la tyrannie, et nous exhorte à agir rapidement pour soutenir ces personnes en quête de sécurité et d'un avenir meilleur dans notre nouvelle démocratie."
 wgr_ddr_refugees2: "Intégration des réfugiés est-allemands"
 wgr_ddr_refugees2_desc: "Des milliers de réfugiés est-allemands fuient vers l'Allemagne de l'Ouest, échappant au contrôle soviétique et aux conditions d'oppression qui règnent à l'Est ; cette vague croissante de familles désespérées met en évidence le fossé profond entre la liberté et la tyrannie, et nous exhorte à agir rapidement pour soutenir ces personnes en quête de sécurité et d'un avenir meilleur dans notre nouvelle démocratie."
 NATO_Military_Restrictions: "Assouplissement des restrictions militaires de l'OTAN"
 NATO_Military_Restrictions_desc: "Les craintes du militarisme allemand sont une préoccupation commune au sein de la structure de commandement des Alliés occidentaux, incitant les États-Unis, la France et la Grande-Bretagne à intégrer ce qui reste de nos forces armées dans la structure militaire de l'OTAN, permettant ainsi aux Alliés de contrôler nos forces."
 NATO_Military_Restrictions2: "Restrictions militaires de l'OTAN"
 NATO_Military_Restrictions2_desc: "§RImpossible de former des unités, de dissoudre des unités ou de modifier des modèles d'unités.§!\n\nLes craintes du militarisme allemand sont une préoccupation commune au sein de la structure de commandement des Alliés occidentaux, incitant les États-Unis, la France et la Grande-Bretagne à intégrer ce qui reste de nos forces armées dans la structure militaire de l'OTAN, permettant ainsi aux Alliés de contrôler nos forces."
 Scientific_Collapse: "Effondrement scientifique"
 Scientific_Collapse_desc: "Au lendemain de la Seconde Guerre mondiale, divers scientifiques ont été tués lors de bombardements alliés ou ont été « convaincus » par les puissances d'occupation de les aider dans leurs nouveaux projets d'armes alors que les tensions entre les États-Unis d'Amérique et l'Union soviétique commençaient à s'intensifier. On ne sait pas où ils se trouvent actuellement, mais on peut supposer qu'une poignée d'entre eux ont déménagé à Moscou ou à Washington et sont désormais à leur service. Qu'ils le veuillent ou non."
 Scientific_Collapse_lessened: "Effondrement scientifique"
 Scientific_Collapse_lessened_desc: ""
 Scientific_Boost:0 "Expansion éducative"
 Scientific_Boost_desc:0 ""
 Newfound_Sovereignty: "Une souveraineté retrouvée"
 Founding_the_Bundeswehr: "La Bundeswehr"
 Founding_the_Bundeswehr_desc: "Le temps des faux-semblants est révolu. Le BGS sera désormais officiellement désigné comme cadre d'une future armée nationale, la Bundeswehr. Sa structure de commandement, sa formation et sa doctrine seront réformées pour permettre une transition harmonieuse vers une force militaire à part entière."
 Starfighter_Crisis: "Crise des chasseurs stellaires"
 Disorganized_Navy: "Marine désorganisée"
 Disorganized_Navy_desc: "La Kriegsmarine - ou ce qu'il en reste - est actuellement rendue aux Alliés occidentaux dans le cadre du désarmement. Certains navires plus petits et navires marchands ont été reconvertis à un usage civil ou remis en service sous contrôle allié pour le déminage sous l'administration allemande de déminage (Deutscher Minenräumdienst). Aujourd'hui, comme en 1919, nos capacités navales sont de nouveau à zéro et on ne sait pas si nous pourrons un jour reconstruire notre Marine ou non."
