 WGR_Emphasize_Rehabilitative_Justice_System:0 "Mettre l'accent sur le système de justice réparatrice"
 WGR_Empower_Unions:0 "Renforcer les syndicats"
 WGR_Seperate_the_Party_from_the_SDS:0 "Séparer le Parti du SDS"
