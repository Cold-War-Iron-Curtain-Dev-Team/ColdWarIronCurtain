 WGR_SPD_Power_Struggle_Favour_Franke: "Sensibilisation à l'opposition"
 WGR_SPD_Power_Struggle_Favour_Franke_desc: "La politique plus modérée d'Egon Franke concernant l'intégration occidentale ainsi que la politique sociale s'est engagée à créer un cercle spécifique au sein de la CDU, qui estime que la coopération avec l'aile droite du SPD pourrait lui permettre d'atteindre ses objectifs politiques même s'il est dans l'opposition. Ils n'hésitent pas à soutenir Franke politiquement, même si le SPD dans son ensemble risque de perdre son soutien au profit de la CDU."
 
 WGR_SPD_Power_Struggle_Favour_Ollenhauer: "Unissez les loyalistes de Schumacher"
 WGR_SPD_Power_Struggle_Favour_Ollenhauer_desc: "Erich Ollenhauer a été un proche collaborateur du chancelier Schumacher, lui servant de bras gauche dans diverses affaires. Être dans son entourage présente des avantages. Son influence politique peut être utilisée pour convaincre les loyalistes autour de Schumacher d'intégrer l'aile gauche du SPD."
 
