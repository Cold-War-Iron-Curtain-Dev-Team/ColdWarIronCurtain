 WGR_SPD_Power_Struggle_Explaination:0 "Le contexte de la lutte pour le pouvoir au sein du SPD"
 WGR_SPD_DESC_GUI:0 "À la suite de la victoire de Schumacher aux élections de 1949, le Parti social-démocrate s'est officieusement divisé en deux blocs, dirigés respectivement par le président fédéral Erich Ollenhauer et le vice-chancelier Egon Franke. Les deux hommes se disputent l'influence, car ils sont les adjoints et les successeurs potentiels du vieillissant Schumacher. Qui l'emportera ?"
