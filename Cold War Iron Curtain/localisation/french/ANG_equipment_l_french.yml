 ANG_infantry_equipment_0:0 "Karabiner 98k Espingarda 8 mm Mauser m/938"
 ANG_infantry_equipment_0_short:0 "Mauser m/938"
 ANG_infantry_equipment_0_desc:0 "Le Mauser-Vergueiro était un fusil à verrou conçu en 1904 par José Alberto Vergueiro, officier d'infanterie de l'armée portugaise, et fabriqué par la Deutsche Waffen und Munitionsfabriken (DWM). Il dérivait du fusil Mauser 98 et bénéficiait d'un nouveau système de verrouillage inspiré du Gewehr 1888 et du Mannlicher-Schönauer. Hors du Portugal, cette arme était également connue sous le nom de Mauser portugais."
 ANG_infantry_equipment_1:0 "Avtomat Kalashnikova 1947"
 ANG_infantry_equipment_1_short:0 "AK-47"
 ANG_infantry_equipment_1_desc:0 "L'AK-47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais il n'entra en service actif qu'en 1948, date à laquelle la version à crosse fixe fut mise en production. Début 1949, l'AK-47 fut adopté par les forces armées soviétiques pour un déploiement massif au sein des unités de première ligne. Doté d'un piston à gaz à longue course, d'un sélecteur de tir avec sécurité, d'un mécanisme de détente et d'alimentation automatique, ainsi que d'autres améliorations de conception, l'AK-47 représentait une nette amélioration par rapport au SKS. Pendant de nombreuses années, l'AK-47 fut considéré comme l'une des armes les plus fiables, faciles à entretenir, à manier et à apprendre au monde."
 ANG_infantry_equipment_2:0 "Avtomat Kalashnikova Modernizirovanniy"
 ANG_infantry_equipment_2_short:0 "AKM"
 ANG_infantry_equipment_2_desc:0 "L'AKM est une version modernisée de l'AK-47, développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'Armée soviétique en 1959. L'arme a été largement optimisée et repensée pour répondre aux besoins de l'armée en pleine modernisation. De nombreuses pièces ont été simplifiées pour la production de masse et le boîtier en acier usiné a été remplacé par une pièce en acier emboutie en forme de U afin d'améliorer les cadences de production. Grâce à ces simplifications, l'arme était également beaucoup plus légère, son poids étant réduit d'environ 30 %. De plus, elle a été renforcée pour une meilleure robustesse et des rails de guidage ont été ajoutés pour faciliter le mouvement du porte-culasse. L'AKM a été immédiatement et largement utilisée par de nombreux pays communistes et produite pour les conflits tout au long de sa durée de vie. On peut notamment citer l'invasion de la Tchécoslovaquie, où elle a été utilisée par les deux camps."
 ANG_infantry_equipment_3:0 "Heckler & Koch G3A3"
 ANG_infantry_equipment_3_short:0 "Heckler & Koch G3A3"
 ANG_infantry_equipment_3_desc:0 "La version de 1963, la plus connue, est équipée d'organes de visée à tambour avec un guidon amélioré, d'un cache-flammes/frein de bouche compatible avec les grenades OTAN, d'une crosse fixe en plastique rigide et d'un garde-main en plastique ne touchant pas le canon flottant. Ce garde-main existait en deux versions : une version fine et ventilée et une version large. Cette dernière permet la fixation d'un bipied."
 ANG_mbt_equipment_2:0 "T-54"
 ANG_mbt_equipment_2_short:0 "T-54"
 ANG_mbt_equipment_2_desc:0 "Le char T-54 est le char le plus produit de l'histoire. Conçu en 1946 par KMBD, il est équipé d'un canon rayé de 100 mm et d'un blindage à épaisseur variable, de 60 à 205 mm. Son moteur diesel V12 de 38,88 litres et sa suspension à barres de torsion lui permettent d'atteindre une vitesse de 48 km/h. Utilisé par plus de 50 armées à travers le monde, il a été produit dans tout le bloc soviétique et a participé à tous les conflits qui y ont été liés."
 ANG_mbt_equipment_3:0 "T-55"
 ANG_mbt_equipment_3_short:0 "T-55"
 ANG_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. Le bureau d'études OKB-520 a modifié la conception du T-55 en améliorant sa protection NBC, en optimisant son moteur, en redessinant la tourelle et en ajoutant des équipements auxiliaires tels qu'un système de conduite de tir et des optiques améliorés. De plus, le T-55 utilisait plus fréquemment la mitrailleuse lourde DShK de 12,7 mm, tandis que le T-54 était équipé du canon SGMT de 7,62 mm, ce qui lui conférait une puissance de feu supérieure, mais limitait sa capacité d'emport de munitions. Le T-55 a été utilisé dans autant d'armées que le T-54 et a généralement participé aux mêmes conflits."
 ANG_mbt_equipment_4:0 "T-62"
 ANG_mbt_equipment_4_short:0 "T-62"
 ANG_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Il est équipé d'un canon à âme lisse et possède un blindage légèrement plus épais. Le calibre du canon principal a également été porté à 115 mm. Commandé initialement par l'Union soviétique dans le but d'améliorer sa puissance de feu, le projet fut achevé par le bureau d'études OKB-520 vers 1960. Malgré ses améliorations, sa production ne fut pas arrêtée, son coût étant nominalement supérieur à celui du T-55. Plus de 22 700 T-62 furent construits et il participa à de nombreux combats dans la sphère d'influence soviétique, notamment au Moyen-Orient. Ses améliorations démontrèrent une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique."
