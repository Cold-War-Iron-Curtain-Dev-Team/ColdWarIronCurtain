 ANG_fighter_equipment_0:0 "Force aérienne nationale d'Angola"
 ANG_fighter_equipment_0_short:0 "FANA"
 ANG_fighter_equipment_0_desc:0 "La Force aérienne nationale d'Angola (FANA) est la branche aérienne des Forces armées angolaises. Avec un parc de plus de 300 appareils, la FANA est (sur le papier) l'une des plus importantes forces aériennes d'Afrique."
 ANG_jet_multirole_equipment_2:0 "Mikoyan-Gurevich MiG-15"
 ANG_jet_multirole_equipment_2_desc:0 "Le Mikoyan-Gourevitch MiG-15 Fagot, sans doute l'un des chasseurs les plus emblématiques de la Guerre froide, entra en service en 1947. Dès son introduction en service lors de la guerre de Corée, il participa à de nombreux conflits, où il se révéla un adversaire redoutable pour les F-86 Sabre et F9F Panther américains. Une portion de la frontière sino-coréenne fut surnommée « l'allée des MiG » en raison de leur présence massive dans la région. Plus de 18 000 MiG-15 furent construits et utilisés par de nombreuses nations, notamment l'URSS et les pays du bloc de l'Est. Si la plupart des appareils furent retirés du service dans les années 1950, certains sont encore en service au sein de l'armée de l'air nord-coréenne."
 ANG_jet_multirole_equipment_2_short:0 "MiG-15"
 ANG_jet_multirole_equipment_3:0 "Mikoyan-Gurevich MiG-17"
 ANG_jet_multirole_equipment_3_desc:0 "Successeur direct du MiG-15 Fagot, le MiG-17 Fresco fut produit à plus de 10 000 exemplaires à partir de 1952. Construit sous licence par l'Armée de l'air chinoise (PLAAF) sous la désignation Shenyang J-5, il fut utilisé par une vingtaine de nations en Afrique, en Europe et en Asie. Son baptême du feu eut lieu en 1958, lors d'affrontements entre des MiG chinois et des F-86 Sabre nationalistes chinois au-dessus du détroit de Taïwan. Cependant, le MiG-17 fut principalement engagé pendant la guerre du Vietnam par l'Armée de l'air nord-coréenne (NVAF) et l'Armée de l'air chinoise (PLAAF), où il remporta 28 victoires aériennes. Son succès fut tel qu'il tint tête aux chasseurs supersoniques américains Phantom II, bien plus modernes, durant ce même conflit. Le MiG-17 fut généralement retiré du service dans les années 1970, mais il demeure en service, de manière limitée, dans certains pays africains et en Corée du Nord."
 ANG_jet_multirole_equipment_3_short:0 "MiG-17"
 ANG_jet_multirole_equipment_4:0 "Mikoyan-Gurevich MiG-19"
 ANG_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de série soviétique capable d'atteindre des vitesses supersoniques en vol horizontal. Le North American F-100 Super Sabre, un chasseur américain comparable de la série « Century Series », était également présent, bien que le MiG-19 ait principalement combattu au-dessus du Nord-Vietnam face aux McDonnell Douglas F-4 Phantom II et Republic F-105 Thunderchief, plus modernes."
 ANG_jet_multirole_equipment_4_short:0 "MiG-19"
 ANG_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21MF"
 ANG_jet_multirole_equipment_6_desc:0 "Version de série de l'intercepteur tous temps. Ces appareils étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T, également appelé RP-9-21). De plus, le système de contrôle des armements a été modifié par rapport à celui du F-13 afin de permettre l'utilisation du missile air-air à guidage infrarouge RS-2US (également appelé K-5MS), en plus du missile K-13."
 ANG_jet_multirole_equipment_6_short:0 "MiG-21MF"
 ANG_jet_multirole_equipment_7:0 "Mikoyan-Gurevich MiG-21bis"
 ANG_jet_multirole_equipment_7_desc:0 "MiG-21bis"
 ANG_jet_multirole_equipment_7_short:0 "Ultime évolution du MiG-21, équipé du turboréacteur Tumanskiy R25-300 et de nombreuses autres améliorations par rapport aux versions précédentes. Les MiG-21bis destinés à la Défense aérienne soviétique étaient dotés du système de guidage au sol Lazur, tandis que ceux destinés à l'Armée de l'air soviétique étaient équipés du système de guidage au sol Polyot."
 ANG_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-23ML"
 ANG_jet_multirole_equipment_8_desc:0 "Les premières versions du « Flogger » présentaient plusieurs défauts de conception, notamment au niveau de la robustesse et de la fiabilité de la cellule, des performances du moteur, de la maniabilité et des performances radar. Une refonte importante de la cellule a été entreprise, donnant naissance au MiG-23ML."
 ANG_jet_multirole_equipment_8_short:0 "MiG-23ML"
 ANG_jet_CAS_equipment_7:0 "Sukhoi Su-22M4"
 ANG_jet_CAS_equipment_7_short:0 "Su-22M4"
 ANG_jet_CAS_equipment_7_desc:0 "Le Sukhoi Su-17 Fitter-C était une évolution de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 fut largement exporté vers les forces aériennes du bloc de l'Est, des pays arabes et d'Amérique du Sud. Il améliorait presque tous les aspects de son prédécesseur, notamment les capteurs, les performances en vol, la charge utile, le rayon d'action et la flèche variable des ailes. De 1969 à 1990, 2 867 appareils furent produits et utilisés par 30 pays, dont 6 l'utilisent encore aujourd'hui."
 ANG_jet_CAS_equipment_8:0 "Sukhoi Su-25"
 ANG_jet_CAS_equipment_8_short:0 "Su-25"
 ANG_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. Il effectua son premier vol en 1975 et fut mis en service en 1981. Depuis 1978, plus de 1 000 exemplaires ont été produits. Particulièrement apprécié à l'étranger, il fut vendu à 29 pays. De ce fait, le Su-25 a été engagé dans plusieurs conflits, notamment les guerres soviéto-afghane, irano-irakienne et du Golfe. Il est toujours en service dans tous les pays exportateurs."
 ANG_jet_light_equipment_2:0 "Mikoyan-Gurevich MiG-15UTI"
 ANG_jet_light_equipment_2_short:0 "MiG-15UTI"
 ANG_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 fut officiellement chargée du développement d'une version d'entraînement du chasseur MiG-15. Le prototype du MiG-15UTI fut construit par l'usine n° 1 entre mars et mai 1949. Le poste de l'instructeur fut aménagé sur le MiG-15UTI en supprimant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes largables pyromécaniquement. L'équipement spécial de l'appareil comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un radiocompas RPKO-10M avec un indicateur RPKO-10M, un interphone SPU-2M, un dispositif à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
 ANG_jet_light_equipment_3:0 "L-29 Delfin"
 ANG_jet_light_equipment_3_short:0 "L-29 Delfin"
 ANG_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín (nom de code OTAN : Maya) est un avion d'entraînement militaire à réaction développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Plus de 3 000 exemplaires du L-29 Delfín ont été produits. Environ 2 000 d'entre eux auraient été livrés à l'Union soviétique, où il a servi d'avion d'entraînement standard pour l'armée de l'air soviétique."
 ANG_jet_light_equipment_4:0 "Aero L-39 Albatros"
 ANG_jet_light_equipment_4_short:0 "L-39 Albatros"
 ANG_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme avion d'entraînement principal, il fut le premier avion d'entraînement équipé d'un turboréacteur à double flux. Cet appareil fut exporté vers de nombreux pays comme avion d'entraînement militaire."
 ANG_jet_light_equipment_5:0 "Aero L-39ZA Albatros"
 ANG_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 ANG_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement armé et l'attaque légère, utilisant un train d'atterrissage plus robuste, une charge utile plus élevée et notamment un système pour un canon bitube GSh-23L de 23 millimètres fixé dans une nacelle conforme sous le compartiment des pilotes, ayant un magasin de 150 cartouches dans la cellule."
 ANG_transport_plane_equipment_2:0 "Antonov An-2"
 ANG_transport_plane_equipment_2_short:0 "An-2"
 ANG_transport_plane_equipment_4:0 "Antonov An-12"
 ANG_transport_plane_equipment_4_short:0 "An-12"
 ANG_transport_plane_equipment_5:0 "Antonov An-22"
 ANG_transport_plane_equipment_5_short:0 "An-22"
 ANG_transport_plane_equipment_6:0 "Antonov An-32"
 ANG_transport_plane_equipment_6_short:0 "An-32"
 ANG_transport_plane_equipment_6_desc:0 "L'An-32 est essentiellement un An-26 remotorisé. Il est conçu pour mieux résister aux conditions météorologiques difficiles que l'An-26 standard. Présenté au Salon du Bourget en mai 1977, l'An-32 se distingue de son prédécesseur par ses moteurs surélevés de 1,5 m au-dessus de l'aile afin d'éviter les dommages causés par des corps étrangers sur les pistes d'atterrissage accidentées et non préparées."
 ANG_transport_plane_equipment_7:0 "CASA C-212-100 Aviocar"
 ANG_transport_plane_equipment_7_short:0 "C-212-100 Aviocar"
 ANG_transport_plane_equipment_8:0 "Ilyushin Il-76TD"
 ANG_transport_plane_equipment_8_short:0 "Il-76TD"
 ANG_utility_helicopter_equipment_3:0 "Mil Mi-8T"
 ANG_utility_helicopter_equipment_3_short:0 "Mi-8T"