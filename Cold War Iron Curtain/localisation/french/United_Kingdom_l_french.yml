l_french:

 ##########FOCUSES##################
 
 ENG_The_British_Armed_Forces:0 "Les forces armées britanniques"
 ENG_The_British_Armed_Forces_desc:0 "Meurtries mais pas brisées, les forces armées britanniques sont sorties des incendies de la Seconde Guerre mondiale comme une force combattante éprouvée. Pourtant, il y a toujours place à l'amélioration..."
 ENG_The_British_Army:0 "L'armée britannique"
 ENG_The_British_Army_desc:0 "Décimée à Dunkerque, l'armée britannique est réarmée et survit à la guerre. Mais de nouveaux équipements et tactiques seront nécessaires pour survivre à la nouvelle ère de la guerre."
 ENG_FV_214_Conqueror:0 "Conquérant FV-214"
 ENG_FV_214_Conqueror_desc:0 "Si la Grande-Bretagne veut rivaliser avec les superpuissances mondiales, elle aura besoin d'armes adaptées aux leurs. Le Conquérant, c'est ça. Plus lourdement armé que le Centurion, le Conqueror est capable de combattre le redoutable IS-3 soviétique et de défendre les intérêts britanniques."
 ENG_Expand_Centurion_Production:0 "Développer la production de centurions"
 ENG_Expand_Centurion_Production_desc:0 "Même s'il a raté les épreuves de la Seconde Guerre mondiale, le Centurion a le potentiel de devenir un pilier de l'armée britannique. Pour cela, la production doit être augmentée pour répondre à la demande."
 ENG_Adopt_the_L1A1:0 "Adoptez la L1A1"
 ENG_Adopt_the_L1A1_desc:0 "Arme d'origine belge, la désormais baptisée L1A1 a subi les modifications nécessaires pour en faire une arme adaptée au rôle de « gardien de la paix » impérial et devrait bientôt être prête à entrer en service."
 ENG_Develop_Counter_Insurgency_Tactics:0 "Développer des tactiques de contre-insurrection"
 ENG_Develop_Counter_Insurgency_Tactics_desc:0 "Les nouveaux ennemis de la Grande-Bretagne ne combattront pas ouvertement, avec des lignes de front et des règles d'engagement claires. Nous devons donc nous adapter et trouver une solution."
 ENG_The_Royal_Navy:0 "La Marine royale"
 ENG_The_Royal_Navy_desc:0 "La Royal Navy s'est révélée être un élément essentiel de la défense de la Grande-Bretagne au cours des deux dernières grandes guerres et elle se révélera sûrement vitale lors de la prochaine. Des navires nouveaux et améliorés doivent être utilisés contre les ennemis de la Grande-Bretagne."
 ENG_The_Daring_class_Destroyers:0 "Les Destructeurs de classe Audacieux"
 ENG_The_Daring_class_Destroyers_desc:0 "Le nouveau destroyer de classe Daring contribuera à combler les lacunes de la nouvelle stratégie navale britannique. Plus grand que la plupart des destroyers, le Daring peut remplir certains rôles que les croiseurs occupaient autrefois, cependant, certains craignent que son manque d'armement au-delà de ses canons puisse causer des problèmes à l'avenir."
 ENG_Complete_the_Audacious_Class_Carriers:0 "Terminez les transporteurs de classe audacieux"
 ENG_Complete_the_Audacious_Class_Carriers_desc:0 "Construits pendant la Seconde Guerre mondiale, les porte-avions de classe Audacious devraient bientôt être prêts à servir et à conduire la Royal Navy dans la nouvelle ère de la guerre navale."
 ENG_Invest_in_Nuclear_Reactor_Research:0 "Investissez dans la recherche sur les réacteurs nucléaires"
 ENG_Invest_in_Nuclear_Reactor_Research_desc:0 "La puissance de l'atome a déjà été prouvée, la question est désormais de savoir si sa puissance peut être exploitée de manière moins destructrice."
 ENG_Develop_the_Tiger_Class_Cruisers:0 "Développer les croiseurs de classe Tiger"
 ENG_Develop_the_Tiger_Class_Cruisers_desc:0 "Commandé en 1941, des doutes subsistent quant au croiseur Tigre et quant à sa place dans la flotte moderne. Cependant, avec quelques modifications, ces doutes peuvent être dissipés et les Tigres peuvent enfin être prêts à l'emploi."
 ENG_The_Nuclear_Program:0 "Le programme nucléaire"
 ENG_The_Nuclear_Program_desc:0 "Pour que la Grande-Bretagne survive, elle doit disposer des armes les meilleures et les plus destructrices, et certainement de la bombe atomique. Les meilleurs esprits scientifiques britanniques commenceront à travailler à la construction de notre propre bombe et trouveront d'autres applications à la technologie nucléaire."
 ENG_Vickers_Valiant:0 "Vickers vaillant"
 ENG_Vickers_Valiant_desc:0 "Si la Grande-Bretagne veut se doter d'une arme nucléaire, elle doit être capable de la transporter et de la larguer. Le Valiant sera le véhicule de destruction pour la Grande-Bretagne et, espérons-le, n'aura jamais à accomplir la tâche prévue."
 ENG_Fission_Nuclear_Tests:0 "Essais nucléaires de fission"
 ENG_Fission_Nuclear_Tests_desc:0 "Nous devons comprendre comment les Américains ont exploité l'énergie nucléaire pour fabriquer une bombe. Les tests doivent être effectués... Dans un endroit éloigné."
 ENG_The_Thermonuclear_Weapon_Program:0 "Le programme d'armes thermonucléaires"
 ENG_The_Thermonuclear_Weapon_Program_desc:0 "Nos premiers tests se sont bien déroulés, mais nous nous sommes heurtés à un mur et avons besoin d'aide pour construire une bombe de puissance égale à celle des Américains et des Soviétiques. Nous pourrions aller directement à la source ou mettre en commun toutes les connaissances impériales et espérer une percée."
 ENG_Seek_American_Cooperation:0 "Rechercher la coopération américaine"
 ENG_Seek_American_Cooperation_desc:0 "Les Américains sont nos alliés de confiance et n'ont sûrement aucune raison de nous refuser l'accès à leurs données nucléaires."
 ENG_Commonwealth_Collaboration:0 "Collaboration avec le Commonwealth"
 ENG_Commonwealth_ColLaboration_desc:0 "Les pays du Commonwealth sont nos partenaires fidèles et n'ont sûrement aucune raison de ne pas travailler avec nous sur notre projet nucléaire."
 ENG_The_Gloster_Javelin:0 "Le javelot Gloster"
 ENG_The_Gloster_Javelin_desc:0 "La menace posée par les bombardiers à réaction ne peut être surestimée, surtout avec le souvenir du Blitz encore frais pour de nombreux Britanniques. Le Javelin protégera la Grande-Bretagne et ses intérêts de cette menace."
 ENG_Produce_the_DH_112_Venom:0 "Produire le DH-112 Venom"
 ENG_Produce_the_DH_112_Venom_desc:0 "Alors que les avions à réaction innovent rapidement partout dans le monde, la Grande-Bretagne doit suivre le rythme. Le DH 112 Venom nous servira bien et verra des améliorations par rapport à notre ancien stock d'avions à réaction."
 ENG_The_Hawker_Hunter:0 "Le chasseur de colporteurs"
 ENG_The_Hawker_Hunter_desc:0 "Après avoir battu le record du monde de vitesse, il est clair que le Hawker Hunter est un leader pour la nouvelle génération de la RAF."
 ENG_The_Avro_Vulcan:0 "L'Avro Vulcain"
 ENG_The_Avro_Vulcan_desc:0 "Le Vulcan est un bombardier stratégique de haute technologie qui donnera à la Grande-Bretagne la dissuasion nucléaire nécessaire aux temps modernes."
 ENG_The_Royal_Airforce:0 "La Royal Air Force"
 ENG_The_Royal_Airforce_desc:0 "La Royal Air Force a remporté la bataille d'Angleterre et a protégé nos soldats à l'étranger, mais elle doit évoluer pour s'adapter aux temps modernes."
 ENG_Operation_Grapple:0 "Opération Grappin"
 ENG_Operation_Grapple_desc:0 "Nous l'avons fait. Nous pensons. Une nouvelle série de tests montrera le travail de notre scientifique et contribuera à élever la position internationale en déclin de la Grande-Bretagne."

 ### COLD WAR PREPARATION/ESPIONAGE ###
 
 ENG_ColdWar:0 "La guerre froide"
 ENG_ColdWar_desc:0 "« De Stettin dans la Baltique à Trieste dans l'Adriatique, un rideau de fer est descendu sur le continent.» Nous devons tenir compte de l'avertissement de Churchill : la menace communiste ne vient pas, elle est sur nous ! Les hommes britanniques doivent être toujours vigilants."
 ENG_HighMilitarism:0 "Haut militarisme"
 ENG_HighMilitarism_desc:0 "Nous devons militariser notre nation indépendamment de la menace d'un complexe militaro-industriel. Nous devons nous militariser plus rapidement que jamais contre une menace plus grande que jamais. La Grande-Bretagne sera une puissance militaire."
 ENG_LowMilitarism:0 "Faible militarisme"
 ENG_LowMilitarism_desc:0 "Se concentrer uniquement sur la préparation défensive évitera un complexe militaro-industriel."
 ENG_CloakDagger:0 "Cape et poignard"
 ENG_CloakDagger_desc:0 "Les tactiques du camouflage et du poignard pourraient nous donner un avantage considérable sur les Soviétiques. Nous devons utiliser toutes les tactiques dont nous disposons dans cette guerre froide."
 ENG_Militarise:0 "Augmenter le militarisme"
 ENG_Militarise_desc:0 "Le militarisme doit être accru. Nous amènerons l'ensemble de la Grande-Bretagne avec force dans la guerre froide."
 ENG_Mobalise:0 "Mobilisation économique"
 ENG_Mobalise_desc:0 "La prochaine grande guerre approche."
 ENG_MI6:0 "MI6"
 ENG_MI6_desc:0 "Le programme du MI6 doit être élargi."
 ENG_MI5:0 "MI5"
 ENG_MI5_desc:0 "L'expansion du MI5 pourrait grandement bénéficier à la patrie britannique. La défense est la meilleure attaque."
 ENG_StrikeFirst:0 "Frappez en premier"
 ENG_StrikeFirst_desc:0 "Nous devons être la briqueterie de la Troisième Guerre mondiale afin que nos alliés soient prêts et que nous puissions frapper selon nos conditions."
 ENG_DefensivePrep:0 "Préparations défensives"
 ENG_DefensivePrep_desc:0 "Nous devons préparer nos défenses. La digue naturelle de la Grande-Bretagne doit être préparée."
 ENG_Spy1:0 "Espionner le rideau"
 ENG_Spy1_desc:0 "Nous devons envoyer des espions et lancer des opérations de renseignement autour du Rideau, car c'est là que parviennent les commandements soviétiques les plus importants."
 ENG_Cubs:0 "Se défendre contre les louveteaux"
 ENG_Cubs_desc:0 "Si la Russie constitue une menace, ses marionnettes le sont aussi. Nous devons contrer cela."
 ENG_Unthinkable:0 "Opération impensable"
 ENG_Unthinkable_desc:0 "Winston Churchill et ses alliés ont élaboré une série de plans ; Opération : Impensable, d'envisager une guerre avec le Pacte de Varsovie et l'Union Soviétique. Nous devons les mettre en oeuvre et entrer en guerre immédiatement."
 ENG_LetThemCome:0 "Laissez-les venir !"
 ENG_LetThemCome_desc:0 "Que nos ennemis arrivent sur nos rivages et tombent comme des vagues sur le rocher que nous sommes ! Laissez-les s'écraser !"
 ENG_Spy2:0 "Techniques d'espionnage améliorées"
 ENG_Spy2_desc:0 "Nous sommes entrés dans une nouvelle ère de guerre. Une époque d'espionnage et de subterfuge. Afin de participer correctement à ce combat, nous devons rester à jour avec les dernières technologies de décryptage pour nous défendre correctement contre les espions soviétiques."
 ENG_Defend:0 "Défendre de Maman Ourse"
 ENG_Defend_desc:0 "Avec les Louveteaux à l'écart, nous devons nous protéger de la Maman Ourse, l'Union Soviétique."
 
 ### SUEZ CRISIS ###
 
 ENG_Suez_Crisis:0 "La crise de Suez"
 ENG_Suez_Crisis_desc:0 "Nasser s'est opposé depuis trop longtemps à l'Empire. Avec sa tentative de nationaliser Suez, il a poussé sa chance trop loin. Avec le soutien de nos alliés israéliens, nous montrerons à ce nationaliste parvenu de ne pas embêter le Lion !"
 
 ### SUEZ CRISIS - ENGLAND LOSES ###
 
 ENG_Withdrawal_from_Suez:0 "Retrait de Suez"
 ENG_Withdrawal_from_Suez_desc:0 "Nasser a tenu bon. Les Américains nous menacent de ruine économique si nous ne nous retirons pas. Nous n'avons pas d'autre choix que de céder le canal de Suez aux Égyptiens."
 ENG_Humiliation:0 "Humiliation internationale"
 ENG_Humiliation_desc:0 "Avec notre défaite au canal, notre réputation a été ruinée. Des enfants d'une douzaine de nations différentes nous utilisent comme cible de leurs plaisanteries, et des dignitaires étrangers rient et ricanent derrière des portes closes. Un jour sombre pour la Grande-Bretagne."
 ENG_Empires_End:0 "La fin de l'empire"
 ENG_Empires_End_desc:0 "Notre heure est enfin venue. Nos marines régnaient autrefois sur les mers. Notre industrie a surpassé toutes les autres. Personne d'autre n'oserait tester la puissance de nos armées. Pour toujours, dans la grâce de Dieu, le Soleil ne s'est jamais couché sur l'Empire. Mais ces jours sont révolus. Notre nation en disgrâce, nos colonies perdues. Mettez le drapeau en berne et dites adieu à l'Empire."
 
 ### SUEZ CRISIS - ENGLAND WINS ###
 
 ENG_Victory_in_Suez:0 "Victoire à Suez"
 ENG_Victory_in_Suez_desc:0 "La guerre est gagnée ! Avec l'aide des Israéliens et des Français, nous avons repoussé Nasser de Suez. Le Soleil ne se couchera jamais !"
 ENG_Push_for_Regime_Change:0 "Faire pression pour un changement de régime"
 ENG_Push_for_Regime_Change_desc:0 "Avec notre victoire au canal, le gouvernement de Nasser s'est rapidement replié sur lui-même. Nous avons maintenant l'opportunité de prendre le contrôle de la politique égyptienne et de commencer enfin à récupérer nos possessions impériales perdues."
 ENG_Settle_for_Suez:0 "Acceptez la zone d'occupation de Suez"
 ENG_Settle_for_Suez_desc:0 "Avec notre victoire au canal, nos citoyens exigent que nous allions plus loin et que nous retirons Nasser du pouvoir. Cependant, face aux menaces américaines d'embargos et de sanctions, nous avons décidé de stopper notre avancée sur le canal."
 ENG_Strengthen_Ties_to_Israel:0 "Renforcer les liens avec Israël"
 ENG_Strengthen_Ties_to_Israel_desc:0 "Notre victoire contre Nasser n'a en aucune façon été influencée par le soutien que nous avons reçu de l'armée israélienne. Gardant cela à l'esprit, de nombreux hauts commandements militaires ont suggéré que la coopération avec le gouvernement israélien pourrait être avantageuse dans de nouvelles opérations à travers le Moyen-Orient."
 ENG_Resist_Decolonization:0 "Résister à la décolonisation"
 ENG_Resist_Decolonization_desc:0 "Notre Grande-Bretagne a peut-être traversé des moments difficiles dans un passé récent, mais pas plus ! Grâce à Dieu pour toujours, le soleil ne se couche jamais sur l'Empire britannique !"
 
 ### SUEZ CRISIS - IMPERIALISM ###
 
 ENG_Patriot:0 "Patriotisme renouvelé"
 ENG_Patriot_desc:0 "La victoire contre Hitler a créé un patriotisme britannique renouvelé ! La force de notre empire pour contrer ces maux, peut-être que la Grande-Bretagne est prête pour un nouvel empire."
 ENG_Solidify_Ties_with_France:0 "Solidifier les relations françaises"
 ENG_Solidify_Ties_with_France_desc:0 "Nous, Britanniques, n'avons pas toujours eu les relations les plus amicales avec notre voisin du sud, mais nous sommes restés côte à côte au cours des deux guerres mondiales en tant qu'alliés inséparables. Avec leur aide dans le dossier Suez, nous devons renforcer nos relations avec les Français."
 ENG_Dominion_of_Rhodesia:0 "Dominion de Rhodésie"
 ENG_Dominion_of_Rhodesia_desc:0 "Le gouvernement colonial résidant en Rhodésie du Sud demande depuis un certain temps déjà à Westminster une collaboration plus étroite avec le gouvernement central. Compte tenu de l'intérêt récent de notre peuple pour le renforcement de l'Empire, c'est une offre que nous ne pouvons refuser."
 ENG_Preserve_Arab_Colonies:0 "Préserver les colonies arabes"
 ENG_Preserve_Arab_Colonies_desc:0 "En vertu de l'accord Sykes-Picot de 1916, le Moyen-Orient devait être partagé entre les empires français et britannique, afin d'apporter davantage de prospérité à nos royaumes, ainsi que de développer correctement les régions négligées par les autochtones. L'Empire d'Orient ne sera pas perdu."
 ENG_Statute:0 "Mettre fin au statut"
 ENG_Statute_desc:0 "Afin de réellement renforcer l'Empire et de le faire entrer dans une nouvelle ère de prospérité, la souveraineté de nos colonies doit être entravée. De toute façon, ils seront mieux lotis sous notre règne."
 ENG_Strengthen_Ties_to_South_Africa:0 "Renforcer les liens avec l'Afrique du Sud"
 ENG_Strengthen_Ties_to_South_Africa_desc:0 "Compte tenu de l'importante réserve de ressources dont dispose l'Afrique du Sud, il serait avantageux pour nous d'entretenir de bonnes relations avec son gouvernement."
 ENG_Secure_African_Colonies:0 "Sécuriser les colonies africaines"
 ENG_Secure_African_Colonies_desc:0 "L'Afrique a toujours été obstinée vers la conquête. Les émeutes remplissent les rues, les nationalistes réclament une plus grande souveraineté. Pah ! L'Afrique se porte mieux sous la direction de la Grande-Bretagne, et nous veillerons à ce que les autochtones le sachent."
 ENG_Dominions:0 "Les domaines"
 ENG_Dominions_desc:0 "Afin de renforcer l'Empire, nous devons régner encore plus sur nos colonies."
 ENG_Commonwealth:0 "Le Commonwealth"
 ENG_Commonwealth_desc:0 "Avec nos récents efforts de centralisation de l'Empire, il est temps d'unir véritablement tous nos pays sous un seul drapeau, l'Union Jack !"
 ENG_CanExpan:0 "Soumettre le Canada"
 ENG_CanExpan_desc:0 "Le Canada, notre point d'ancrage le plus important en Amérique du Nord, est une nation prospère, regorgeant de ressources naturelles. Un peuple qui vit dans un si beau pays comprend sans aucun doute que, sous notre juste règne, sa situation ne serait que meilleure, n'est-ce pas ?"
 ENG_Ozzie:0 "Soumettre l'Australie"
 ENG_Ozzie_desc:0 "Augmenter nos garnisons militaires en Australie, ainsi que réguler davantage leur économie depuis Westminster devraient convaincre l'administration australienne de repenser sa souveraineté."
 ENG_SouthAfrica:0 "Soumettre l'Afrique du Sud"
 ENG_SouthAfrica_desc:0 "En exploitant les tensions raciales en Afrique du Sud, nous pourrions faire en sorte que la centralisation au sein d'une grande Fédération impériale semble être une solution aux problèmes de l'Afrique du Sud."
 ENG_Retake_Ireland:0 "Reprendre l'Irlande"
 ENG_Retake_Ireland_desc:0 "L'Irlande ne veut pas nous revoir. Ils n'ont cependant pas le choix. La Grande-Bretagne continue son chemin."
 ENG_NZL:0 "Soumettre la Nouvelle-Zélande"
 ENG_NZL_desc:0 "Les Néo-Zélandais sont des gens raisonnables, avec la bonne approche, nous pourrions simplement les convaincre de nous rejoindre. Sinon, nous pourrions toujours incendier Wellington."
 ENG_Empress:0 "Dieu sauve l'impératrice"
 ENG_Empress_desc:0 "Finalement, après des années de déclin progressif de notre Empire dans l'obscurité, nous nous sommes ressaisis et avons uni nos colonies sous l'Union Jack. Le Lion rugit pour toujours !"
 ENG_Britannia:0 "Règle Britannia"
 ENG_Britannia_desc:0 "La Grande-Bretagne, bénie et libre, bénie par Dieu, le joyau brillant de la Terre. Car lorsque la Grande-Bretagne est sortie de la mer, les anges se sont rassemblés autour de la nation et ont scandé cet hymne : « Rule Britannia ! Britannia règne sur les vagues ! »"
 ENG_Raj:0 "Le Raj"
 ENG_Raj_desc:0 "Westminster s'est plié à tort aux demandes d'indépendance malavisées des Indiens. Une telle parodie ne peut rester impunie. Nous veillerons à ce que ces mangeurs de curry sachent à quoi ressemble le règne impérial."
 ENG_Cooperation_with_India:0 "Coopération avec l'Inde"
 ENG_Cooperation_with_India_desc:0 "Même si conquérir à nouveau le Raj serait certainement un exploit glorieux, cela est tout simplement irréalisable. Avec Gandhi de mémoire d'homme, nous serions confrontés à un appel massif à l'indépendance. Le peuple britannique a subi suffisamment de morts à l'étranger au cours de son histoire récente : nous ne sacrifierons pas inutilement nos jeunes hommes. Il serait bien plus bénéfique pour nos deux nations de rechercher une coopération mutuelle, en ouvrant notre accès aux ressources indiennes sans qu'une goutte de sang ne soit versée."
 
 ### GENERAL ELECTIONS - 1950 ###
 
 ENG_Election_of_1950:0 "Élection générale de 1950"
 ENG_Election_of_1950_desc:0 "Cela fait cinq ans que les armes se sont tues dans toute l'Europe. Cela fait également cinq ans que le parti travailliste de Clement Atlee a remporté une victoire choquante, du moins aux yeux de l'establishment conservateur britannique. Est-ce que '50 sera une répétition de '45 ? C'est désormais la décision du peuple."
 
 ENG_Labour_Victory:0 "Victoire du travail"
 ENG_Labour_Victory_desc:0 "Sans surprise, le peuple britannique a décidé de maintenir le parti travailliste d'Atlee au pouvoir afin de poursuivre la reconstruction de la nation."
 ENG_Enviromental_Regulations:0 "Règlements environnementaux"
 ENG_Enviromental_Regulations_desc:0 "Au cours des centaines d'années qui se sont écoulées depuis le début de la révolution industrielle dans notre pays, nos terres vertes et agréables n'ont fait l'objet d'aucune attention. Il est grand temps d'agir concrètement et cette responsabilité nous incombe. À quoi sert une Nouvelle Jérusalem sans air pur ?"
 ENG_Sell_Jet_Technology_to_Soviets:0 "Vendre la technologie Jet aux Soviétiques"
 ENG_Sell_Jet_Technology_to_Soviets_desc:0 "Notre économie est en difficulté. Négocier un simple accord sur les armes injectera de l'argent dans notre économie. Tant que les gens ne regardent pas la source, tout ira bien."
 ENG_Nationalize_Steel_Industry:0 "Nationaliser l'industrie sidérurgique"
 ENG_Nationalize_Steel_Industry_desc:0 "Il est préférable que l'industrie sidérurgique soit sous contrôle national, compte tenu de son rôle dans la pollution de la Grande-Bretagne. En outre, nous devons envoyer le message que les ressources britanniques ne seront pas exploitées par des étrangers."
 
 ENG_Liberal_Victory:0 "Victoire libérale"
 ENG_Liberal_Victory_desc:0 "Il est choquant de constater que le Parti libéral de Clement Davies a pris la tête des élections et est désormais libre de nationaliser davantage les industries du pays."
 ENG_Rural_Infrastructure:0 "Infrastructure rurale"
 ENG_Rural_Infrastructure_desc:0 ""
 ENG_Develop_Wales_and_Scotland:0 "Développer le Pays de Galles et l'Écosse"
 ENG_Develop_Wales_and_Scotland_desc:0 ""
 ENG_Seek_closer_ties_to_western_europe:0 "Rechercher des liens plus étroits avec l'Europe occidentale"
 ENG_Seek_closer_ties_to_western_europe_desc:0 ""
 
 ENG_Conservative_Victory:0 "Victoire conservatrice"
 ENG_Conservative_Victory_desc:0 "Après s'être remis de sa défaite écrasante en 1945, le Parti conservateur, toujours dirigé par Winston Churchill, a été élu au Parlement."
 ENG_Oppose_Further_Nationalization:0 "S'opposer à de nouvelles nationalisations"
 ENG_Oppose_Further_Nationalization_desc:0 "Le Parti travailliste, dirigé par Clement Attlee, a lancé une série de politiques de gauche radicale après sa victoire électorale de 1945, comme la nationalisation des soins de santé. Ils ne pensaient pas - et ne pensent pas - que de telles politiques encourageraient les gens à compter sur l'État plutôt que de subvenir à leurs propres besoins. Même si le peuple ne nous permettra jamais de ramener les soins de santé à une forme uniquement privée, nous devons néanmoins faire tout ce que nous pouvons pour résister au socialisme sous toutes ses formes, qu'il soit révolutionnaire ou son homologue encore plus dangereux ; évolutionniste."
 ENG_Political_Stability:0 "Stabilité politique"
 ENG_Political_Stability_desc:0 ""
 ENG_Tax_Cuts:0 "Réductions d'impôts"
 ENG_Tax_Cuts_desc:0 ""
 tax_cuts:0 "Réductions d'impôts"
 
