 ### NAVY/AIR FORCE ###
 
 ENG_SeaAndSky:0 "Gardiens de la mer et du ciel"
 ENG_SeaAndSky_desc:0 "Autrefois, nos marines étaient réputées dans le monde entier et nos ailes aériennes combattaient aux côtés des Américains, détruisant la Luftwaffe allemande qui a tenu le continent pendant si longtemps. Cependant, avec la fin de la guerre, nos prouesses se sont estompées. Nos marines et nos forces aériennes, désormais surpassées par nos alliés américains. Si nous voulons reconstruire la Grande-Bretagne, nous devons également développer ces facteurs."
 
 ### AIR FORCE ###
 
 ENG_ShdwScheme:0 "Le schéma de l'ombre"
 ENG_ShdwScheme_desc:0 "Même s'il a été proposé avant la guerre et adopté pour la guerre, le projet fantôme montre toujours un grand potentiel pour l'armement aérien britannique en temps de paix. Nous devons l'accepter comme un élément législatif requis pour notre précieuse RAF"
 ENG_Designs:0 "Nouveaux modèles"
 ENG_Designs_desc:0 "Nous devons rechercher des avions et des modèles plus récents, de manière à ce qu'ils puissent contribuer à dominer le ciel plus que jamais. Les bastions de la guerre mondiale sont peut-être là, mais nous devons toujours regarder vers l'avenir."
 ENG_AirDoctrine:0 "Doctrine aérienne"
 ENG_AirDoctrine_desc:0 "La doctrine aérienne de notre nation faisait défaut lors de la dernière guerre, la destruction stratégique n'a pas résisté à l'effort de guerre, nous devons affiner nos doctrines."
 ENG_SuthEnglishBase:0 "Bases aériennes du sud de l'Angleterre"
 ENG_SuthEnglishBase_desc:0 "Le sud de l'Angleterre a toujours été notre terre de bases aériennes, proche du continent et des plaines sur des kilomètres, la RAF bénéficiera bien de davantage de bases"
 ENG_Airforce:0 "L'Armée de l'Air"
 ENG_ChessSky:0 "Les échecs dans le ciel"
 ENG_ChessSky_desc:0 "Nous devons améliorer la tactique et commencer à considérer cela comme s'il s'agissait d'échecs dans le ciel."
 ENG_Airforce_desc:0 "L'armée de l'air doit être considérée comme une seule ; Où en est l'armée de l'air, elle a besoin d'être renforcée, consolidée."
 ENG_AirSchemeII:0 "Schéma aérien II"
 ENG_AirSchemeII_desc:0 "Nous devons créer le deuxième projet aérien, axé cette fois sur le rôle de l'armée de l'air dans les guerres à venir."
 
 ### NAVY ###
 
 ENG_ExpndRoyalNavy:0 "Développez la marine"
 ENG_ExpndRoyalNavy_desc:0 "Nous devons développer notre vieil ami la Royal Navy, c'est la première étape vers une nouvelle fois la domination des vagues !"
 ENG_Carriers:0 "Transporteurs"
 ENG_Carriers_desc:0 "Nous devons déployer des efforts concentrés pour augmenter le nombre de porte-avions auxquels notre marine et notre force aérienne ont également accès."
 ENG_ASW:0 "Guerre anti-sous-marine"
 ENG_ASW_desc:0 "Compte tenu des leçons que nous avons tirées de la dernière Grande Guerre, il est indispensable d'investir dans nos capacités anti-submersibles."
 ENG_Battleships:0 "Cuirassés"
 ENG_Battleships_desc:0 "Nous avons besoin de plus de cuirassés"
 ENG_ShdwDocks:0 "Chantiers navals de l'ombre"
 ENG_ShdwDocks_desc:0 "Le projet Shadow a été un grand succès pour l'armée de l'air, peut-être pourrait-il être répété pour notre fantastique marine."
 ENG_ScotDocks:0 "Chantiers navals écossais"
 ENG_ScotDocks_desc:0 "Nous pourrions facilement construire davantage de chantiers navals en Écosse"
 ENG_TacticsAdmiralty:0 "Tacticiens de l'Amirauté"
 ENG_TacticsAdmiralty_desc:0 "Les tactiques employées par notre marine sont dépassées. Il faut les affiner."
 
 ### ARMY ###
 
 ENG_praiselord:0 "« Louez le Seigneur... »"
 ENG_praiselord_desc:0 ""
 ENG_passammo:0 "'...et passez les munitions...'"
 ENG_passammo_desc:0 ""
 ENG_stayfree:0 "\"Et nous resterons tous libres.\""
 ENG_stayfree_desc:0 ""
 ENG_Frwlharold:0 "Adieu à Harold Alexander"
 ENG_Frwlharold_desc:0 "Nous devons dire au revoir à monsieur Harold Alexander, alors qu'il quitte l'armée et se rend au Canada pour en être le gouverneur général."
 ENG_Frwlvetrans:0 "Adieu à nos anciens combattants"
 ENG_Frwlvetrans_desc:0 "Nous devons permettre à la vieille garde de quitter nos services et de retourner à sa vie"
 ENG_NewGuard:0 "Assemblez une nouvelle garde"
 ENG_NewGuard_desc:0 "La vieille garde disparue, nous pouvons constituer une nouvelle garde pour toute la Grande-Bretagne afin de trouver les nouvelles tactiques et de maintenir nos forces à jour."
 ENG_NewDoctrines:0 "Nouvelles doctrines"
 ENG_NewDoctrines_desc:0 "Nous devons adopter de nouvelles doctrines dans les domaines militaires, et non les anciennes."
 ENG_ConsultAdvisors:0 "Consulter les généraux"
 ENG_ConsultAdvisors_desc:0 "Dans la poursuite de nouvelles doctrines, nous devons consulter nos anciens combattants, ils en sauront le plus sur les doctrines futures"
 ENG_MdrnDivisions:0 "Divisions modernes"
 ENG_MdrnDivisions_desc:0 "Nous devons créer des divisions modernes pour notre armée"
 ENG_OldDoctrines:0 "Anciennes doctrines"
 ENG_OldDoctrines_desc:0 "Le Grand Battleplan a grandement servi notre nation pendant la guerre mondiale, avec tellement de temps avant qu'une autre ne survienne, nous pouvons maximiser la planification, les vieilles doctrines ouvriront la voie !"
 ENG_Grand-erBttlepln:0 "Plan de bataille majeur"
 ENG_Grand-erBttlepln_desc:0 "Nous devons rendre nos plans de bataille plus grands, plus grandioses et plus vastes que jamais, nous devons créer les plus grands plans connus de l'homme, le droit de notre pays est de planifier la prochaine guerre !"
 ENG_NewDivisions:0 "Nouvelles divisions"
 ENG_NewDivisions_desc:0 "Les anciennes divisions de notre armée viennent d'être regroupées suite à la guerre, nous devons regarder vers l'avenir et professionnaliser nos forces pour qu'elles soient à la hauteur de celles des armées européennes."
 
 ### LEFTOVER LOC THAT MIGHT BE USEFUL LATER SO I'M NOT DELETING IT ###
 
 ENG_Royalarmy:0 "L'Armée Royale"
 ENG_Royalarmy_desc:0 "L'Armée royale de Grande-Bretagne est actuellement la plus nombreuse qu'elle ait jamais été. Elle a survécu aux flammes de la Seconde Grande Guerre. Malgré leur expérience, nombre de ces hommes manquent encore de formation et de commandants compétents. Pour rester compétitifs, nous devons revitaliser l'Armée."
 ENG_Warhawks:0 "Supprimez les Warhawks"
 ENG_Warhawks_desc:0 "Nous devons éliminer les Warhawks dans toute l'Europe, ou faire pression sur leur gouvernement pour qu'il les expulse. De nombreux appels rapprochés ont été effectués, nous n'en avons pas besoin de plus."
 ENG_Cooling:0 "Commencer le refroidissement"
 ENG_Cooling_desc:0 "Une fois les Warhawks supprimés, nous pouvons commencer les missions diplomatiques"
 ENG_Soldiers:0 "Réduire les soldats"
 ENG_Soldiers_desc:0 "Nous devons réduire les effectifs militaires le long des frontières et dans l'ensemble de l'Europe centrale. Nous devons réduire la présence militaire pour calmer davantage la guerre froide !"
 ENG_Detante:0 "Commencer la détente"
 ENG_Detante_desc:0 "Une pression plus froide s'est exercée sur l'Europe. Détente. Nous devons accepter cela et refroidir le monde."
 ENG_TakeEasy:0 "Allez-y doucement"
 ENG_TakeEasy_desc:0 "Le monde se refroidit, il n'y a pas de quoi s'inquiéter, détendons-nous"
 ENG_Heating:0 "Commencer le chauffage"
 ENG_Heating_desc:0 "Même si une guerre froide est, eh bien, froide, et que nous ne voulons certainement pas qu'elle s'échauffe, un peu plus d'action entre les puissances pourrait laisser de grands"
 ENG_Incident:0 "Créer un incident"
 ENG_Incident_desc:0 "L'échauffement que nous avons provoqué nous a été bénéfique, pas mal en fait... Peut-être pourrions-nous déclencher un incident ?"
 ENG_Preserve:0 "Préserver l'Empire"
 ENG_Preserve_desc:0 "Le poids qui pèse sur notre empire crée du stress, alors que beaucoup appellent à abandonner l'empire, nous devons le préserver, ainsi que nos joyaux de la couronne"
 ENG_Troubles:0 "Problèmes à l'étranger"
 ENG_Troubles_desc:0 "Des troubles sont créés partout à l'étranger, depuis la zone du canal jusqu'aux colonies subsahariennes. La crise, telle est la voie de la Grande-Bretagne."
 ENG_SecureSuez:0 "Sécuriser Suez"
 ENG_SecureSuez_desc:0 "Nous devons assurer la sécurité de notre zone du canal de Suez. Par tous les moyens nécessaires, y compris le Soudan."
 ENG_EndEgypt:0 "Mettre fin à l'Égypte"
 ENG_EndEgypt_desc:0 "L'État égyptien était plutôt une bonne expérience. Mais l'Égypte menace la paix qui est venue avec sa saisie de la zone du canal et a montré qu'elle était trop voyous pour être laissée tranquille."
 ENG_CntrlAfrica:0 "Contrôler l'Afrique"
 ENG_CntrlAfrica_desc:0 "Les troubles s'étendent en Afrique, nous devons prendre des mesures pour les réduire."
 ENG_BNW:0 "Meilleur des Mondes"
 ENG_BNW_desc:0 "C'est un nouveau monde courageux. Nous devons adopter les nouvelles institutions qui ont émergé avec la chute du Reich hitlérien."
 ENG_UN:0 "Nations Unies"
 ENG_UN_desc:0 "Les Nations Unies ont été fondées par notre nation, le Canada, les États-Unis et bien d'autres. Nous devons contribuer à renforcer la légitimité de cette institution profonde."
 ENG_OverseasCrisis:0 "Crise à l'étranger"
 ENG_OverseasCrisis_desc:0 "Les crises à l'étranger s'aggravent, nos colonies sont en bouleversement, nous devons agir avant que cela ne déclenche une autre révolution."
 ENG_OldCrown:0 "La vieille couronne"
 ENG_OldCrown_desc:0 "Alors que l'Inde et le Pakistan sont devenus indépendants, ils se détestent apparemment, il faut prendre notre temps et consolider notre position à l'Est, le Pakistan fait preuve de force, avec l'industrialisation que nous lui avons donnée, cependant l'Inde montre un potentiel de main d'oeuvre."
 ENG_FrndIndia:0 "Se lier d'amitié avec l'Inde"
 ENG_FrndIndia_desc:0 "Alors que nous n'avons jamais été dans la meilleure position. L'Inde semble être le bon choix dans ce jeu entre l'hindouisme et l'islam"
 ENG_FrndPakistan:0 "Se lier d'amitié avec le Pakistan"
 ENG_FrndPakistan_desc:0 "Le Pakistan était nos sujets préférés lorsque nous dirigeions le Raj, nous devons perpétuer cet héritage et les préférer dans la région"
 ENG_Consolidate:0 "Consolider les relations"
 ENG_Consolidate_desc:0 "Nous devons consolider nos relations partout, ce choix qui s'est présenté à notre bureau de ministres a été difficile, mais il vaut mieux qu'il soit rendu maintenant plutôt que plus tard."
 ENG_Security:0 "Conseil de sécurité"
 ENG_Security_desc:0 "Le Conseil de sécurité des Nations Unies présente un grand potentiel en tant que place forte pour la Grande-Bretagne. Nous sommes l'un des cinq membres permanents."
 ENG_RedSun:0 "Le Soleil Rouge Levant"
 ENG_RedSun_desc:0 "La Grande Dépression, les guerres mondiales, tout cela est si proche que notre empire est en ruine. La révolution est arrivée en Grande-Bretagne. Ce chemin. Peut-être notre dernier."
 ENG_Internationalism:0 "Internationalisme"
 ENG_Internationalism_desc:0 "Trotsky avait la bonne idée. Nous devons être la première nation à véritablement adopter l'internationalisme !"
 ENG_DecoloniseComittee:0 "Comité de décolonisation"
 ENG_DecoloniseComittee_desc:0 "Nous devons adopter les décisions du Comité de la décolonisation et en faire partie. L'époque de l'Empire britannique est révolue."
 ENG_OneCountry:0 "Un pays"
 ENG_OneCountry_desc:0 "Staline a la bonne idée : prendre soin de notre pays, unir et gouverner notre pays, et ne pas propager des États indisciplinés qui s'opposeraient à nous."
 ENG_EndRoyalFamily:0 "Mettre fin à la famille royale"
 ENG_EndRoyalFamily_desc:0 "La famille royale constitue une menace immédiate pour notre révolution. Ce sont des bastions des riches et des sales."
 ENG_CutTies:0 "Couper les liens"
 ENG_CutTies_desc:0 "Soit nos relations se flétriront, soit nous les romprons. Supprimons les relations avec les démocraties indésirables."
 ENG_OwnAlliance:0 "Notre propre alliance"
 ENG_OwnAlliance_desc:0 "Nous avons besoin de notre propre pacte, plutôt que de nous agenouiller devant le rêve de Varsovie de Staline. Vive le pacte de Liverpool"
 ENG_WarsawPact:0 "Rejoignez le Pacte de Varsovie"
 ENG_WarsawPact_desc:0 "Nous serions stupides de créer notre propre alliance, nous voyons une menace immédiate des États-Unis et des capitalistes européens, peut-être que Staline nous acceptera ?"
 ENG_Prepareforinvasion:0 "Préparez-vous à l'invasion" 
 ENG_Prepareforinvasion_desc:0 "Il faut préparer les côtes de la Grande-Bretagne aux Etats-Unis, en Norvège, en France, au Danemark ou encore aux Pays-Bas, il faut être prêt à leurs attaques !"
 ENG_ArmWelsh:0 "Armer les Gallois"
 ENG_ArmWelsh_desc:0 "Nous devons armer les Gallois si nous voulons nous préparer à leur invasion"
 ENG_RAF:0 "La Royal Air Force"
 ENG_RAF_desc:0 "La Royal Air Force est une puissance en Europe, non seulement triomphante, mais l'une des plus grandes forces aériennes restantes, nous devons conserver cette position si nous voulons rester influents"
 ENG_DfndFalklands:0 "Défendre les Malouines"
 ENG_DfndFalklands_desc:0 "Nous devons fortifier les Malouines car les propos de la junte ont été très agressifs ces derniers temps, la défense de nos colonies restantes doit avoir la priorité"
 ENG_BowEgypt:0 "Inclinez-vous devant l'Egypte"
 ENG_BowEgypt_desc:0 "C'est peut-être embarrassant, mais, pour préserver la paix, nous devons nous incliner devant les Egyptiens, montrer que nous sommes ceux de la démocratie"
 ENG_EncourageStatute:0 "Encourager le Statut"
 ENG_EncourageStatute_desc:0 "La première étape pour mettre fin au poids de notre empire sera d'encourager le recours au Statut de Westminster et d'annoncer la fin de la domination britannique sur nos dominions"
 ENG_DemEnternal:0 "Démocratie éternelle"
 ENG_DemEnternal_desc:0 "La démocratie a survécu contre vents et marées, notre démocratie a été la première de nombreuses démocraties pures, et les États-Unis ont montré que nous sommes dans le même bateau."
 ENG_Invest:0 "Investissements multinationaux"
 ENG_Invest_desc:0 "Nous devons utiliser notre nouvelle influence pour investir dans les démocraties, non seulement pour les aider à survivre à la pression imminente des Soviétiques, mais aussi pour élargir nos propres marchés et notre influence."
 ENG_Queen:0 "Dieu sauve la reine"
 ENG_Queen_desc:0 "La reine Elizabeth II Alexandra Mary, reine du Royaume-Uni de Grande-Bretagne et d'Irlande du Nord, connaît bien la constitution et la démocratie britanniques et devrait défendre nos propres libertés."
 ENG_ExpndBurmingham:0 "Agrandir Birmingham"
 ENG_ExpndBurmingham_desc:0 "Développez l'industrie de Birmingham pour faire plus de place aux usines d'armes et de munitions."
 ENG_ArmScot:0 "Armer les Écossais"
 ENG_ArmScot_desc:0 "Nous devrions fabriquer davantage de munitions en Écosse afin que, si la guerre revenait dans ces belles îles, nous puissions armer ces puissants combattants pour résister à tout."
 ENG_Prolitariat:0 "Vive le prolétariat"
 ENG_Prolitariat_desc:0 "Avec le succès de la révolution, le prolétariat triomphe et le peuple dirige désormais les îles ! Vive la Révolution !"
 ENG_Referendum:0 "Organiser un référendum"
 ENG_Referendum_desc:0 "Même si les Malouines sont revendiquées par les Argentins, organiser un référendum pour prouver qu'il s'agit de notre sol légitime pourrait être une chance et, en cas d'échec, le laisser rejoindre les territoires qui ont quitté notre empire."
 ENG_Decolonise:0 "Poursuite de la décolonisation"
 ENG_Decolonise_desc:0 "Nous devons clarifier nos relations avec certaines des nations les plus récentes, nées de nos efforts de décolonisation"
 ENG_deafrica:0 "Afrique"
 ENG_deafrica_desc:0 "Nos relations avec les Africains seront sûrement les plus difficiles à clarifier, peut-être devrions-nous laisser un peu de temps au ministère des Affaires étrangères pour assainir nos relations ?"
 ENG_decarib:0 "Les Caraïbes"
 ENG_decarib_desc:0 "De nombreux pays sont venus des Antilles britanniques et, même s'ils sont amicaux, cela ne pourrait pas faire de mal de clarifier toutes les relations entre nous."
 ENG_FalklandsBritish:0 "Les Malouines sont britanniques !"
