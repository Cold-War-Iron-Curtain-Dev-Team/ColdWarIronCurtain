 Blue_Streak_Success_desc:0 "Blue Streak est un projet conjoint anglo-américain visant au développement d'un missile balistique à portée intermédiaire. Cependant, le coût de ce projet a déjà grimpé en flèche. Si nous §Ydécidons de continuer§! §R, nous devrons payer 250 milliards de dollars supplémentaires§! pour tous les coûts supplémentaires que ce projet a augmentés. §YCependant, si nous décidons d'arrêter le projet§!, les Américains sont disposés à nous vendre §GMissiles Polaris et nous récupérerons 200 milliards de dollars§! sur le projet."

