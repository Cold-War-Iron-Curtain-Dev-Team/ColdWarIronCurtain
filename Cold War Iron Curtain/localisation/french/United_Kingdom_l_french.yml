 UK50_Representation_People_Act:0 "Loi sur la représentation du peuple [GetYear]"
 UK50_Representation_People_Act_desc:0 "La loi sur la représentation du peuple [GetYear] a consolidé la loi électorale précédente, mais a également apporté quelques changements à l'administration. Le principal changement consistait à prévoir la conduite de futurs examens des limites parlementaires par les commissions parlementaires permanentes sur les limites des frontières. La loi a également aboli les termes « arrondissement parlementaire » et « comté parlementaire », a aboli les circonscriptions universitaires et a supprimé l'obligation pour la ville de Londres de former sa propre circonscription."
 UK50_Reinforce_House_Prominence:0 "Renforcer la notoriété de la maison"
 UK50_Reinforce_House_Prominence_desc:0 "Notre Chambre des communes est la chambre la plus importante du Parlement, responsable de l'adoption de toutes les lois, de la fiscalité et de l'apport d'argent au gouvernement."
 UK50_Parliament_Act:0 "La loi sur le Parlement"
 UK50_Parliament_Act_desc:0 "Le Parliament Act 1949 (12, 13 & 14 Geo. 6 c. 103) est une loi du Parlement du Royaume-Uni. Il a réduit le pouvoir de la Chambre des Lords de retarder certains types de législation, en particulier les projets de loi publics autres que les projets de loi de finances, en modifiant la loi sur le Parlement de 1911."
 UK50_Liberalize_Adoption:0 "Loi sur l'adoption d'enfants [GetYear]"
 UK50_Liberalize_Adoption_desc:0 "Cette législation a libéralisé diverses règles concernant l'adoption. Le placement des enfants en vue de leur adoption relevait du contrôle des autorités locales, tandis que les enfants adoptés bénéficiaient de droits de succession. En outre, la législation rejetait également la notion, implicite dans la loi sur les enfants de 1926, selon laquelle la mère devait connaître l'identité de l'adoptant si elle pouvait raisonnablement donner son consentement à l'adoption. La loi permettait plutôt de dissimuler l'identité de l'adoptant derrière un numéro de série."
 UK50_Create_Free_Legal_Help_System:0 "Loi sur l'aide et les conseils juridiques [GetYear]"
 UK50_Create_Free_Legal_Help_System_desc:0 "La loi a étendu l'État-providence afin que ceux qui ne pouvaient pas payer les services d'un avocat puissent accéder à une aide juridique gratuite."
 UK50_Inaugurate_National_Parks:0 "Loi sur les parcs nationaux et l'accès à la campagne [GetYear]"
 UK50_Inaugurate_National_Parks_desc:0 "La loi sur les parcs nationaux et l'accès à la campagne [GetYear] est une loi du Parlement du Royaume-Uni qui a créé la Commission des parcs nationaux. La loi a fourni le cadre pour la création de parcs nationaux et de zones d'une beauté naturelle exceptionnelle en Angleterre et au Pays de Galles, et a également abordé les droits de passage publics et l'accès aux terres ouvertes. La loi a été adoptée avec le soutien de tous les partis, dans le cadre de la reconstruction du Royaume-Uni par le gouvernement travailliste après la Seconde Guerre mondiale. "
 UK50_Establish_Rent_Control_Courts:0 "Créer des tribunaux de contrôle des loyers"
 UK50_Establish_Rent_Control_Courts_desc:0 "Avec l'adoption de plusieurs lois visant à limiter la hausse des loyers, nous commençons à voir des résultats."
 UK50_Redraw_Electoral_Districts:0 "Redessiner les circonscriptions électorales"
 UK50_Redraw_Electoral_Districts_desc:0 "La House of Commons (Redistribution of Seats) Act 1949 était une loi du Parlement du Royaume-Uni qui prévoyait la révision périodique du nombre et des limites des circonscriptions parlementaires. La loi a modifié les règles de répartition des sièges à suivre par les commissions de délimitation pour chacun des pays constitutifs du Royaume-Uni. La loi contenait un certain nombre de règles pour guider le travail des commissions."
 UK50_Clean_Air_Act:0 "Loi sur la qualité de l'air"
 UK50_Clean_Air_Act_desc:0 "Le Clean Air Act était une loi du Parlement du Royaume-Uni adoptée principalement en réponse au grand smog de Londres de 1952. La loi introduisait un certain nombre de mesures visant à réduire la pollution de l'air. Le principal d'entre eux était l'adoption obligatoire de carburants sans fumée, en particulier dans les zones de contrôle des fumées à forte population, afin de réduire la pollution par la fumée et le dioxyde de soufre provenant des incendies domestiques. La loi comprenait également des mesures visant à réduire les émissions de gaz, de graviers et de poussières provenant des cheminées et des cheminées."
 UK50_Housing_Repair_Rents_Act:0 "Loi sur la réparation et les loyers des logements"
 UK50_Housing_Repair_Rents_Act_desc:0 "Loi prévoyant des dispositions supplémentaires pour le déminage et le réaménagement des zones d'habitation insalubres, et pour sécuriser ou promouvoir le reconditionnement et l'entretien des maisons ; et autrement pour modifier les textes relatifs au logement, à l'exercice de certains pouvoirs relatifs au foncier et au contrôle des loyers."
 UK50_Halt_Pay_Pauses:0 "Arrêter les pauses de paie"
 UK50_Halt_Pay_Pauses_desc:0 "Les pauses salariales pour nos travailleurs les plus précieux sont préjudiciables à leur bien-être et à leur productivité. Nous veillerons immédiatement à assurer des augmentations à nos travailleurs."
 UK50_Increase_Telephone_Access:0 "Augmenter l'accès téléphonique dans toute l'Angleterre"
 UK50_Increase_Telephone_Access_desc:0 "Beaucoup de nos résidents n'ont toujours pas accès au téléphone. Nous devons prévoir de l'argent pour construire davantage de lignes à travers le pays."
 UK50_Improve_Ulster_Transportation:0 "Améliorer les transports en Ulster"
 UK50_Improve_Ulster_Transportation_desc:0 "Nous devons accorder davantage de fonds à l'Ulster Transport Authority afin d'y améliorer le système ferroviaire."
 UK50_Encourage_Paid_Holidays:0 "Encourager les congés payés"
 UK50_Encourage_Paid_Holidays_desc:0 "Rémunérer nos travailleurs tout en leur donnant le temps de se détendre en dehors de leur travail augmentera leur productivité et leur offrira des avantages supplémentaires sur le lieu de travail."
 UK50_Double_Taxation_Relief_Order:0 "Ordonnance d'allègement de la double imposition"
 UK50_Double_Taxation_Relief_Order_desc:0 "Ceux qui sont riches bénéficieront d'une réduction substantielle de leurs impôts sur le revenu, en raison de la politique de double imposition qui exigeait que l'impôt soit payé à deux juridictions différentes."
 UK50_Increase_Tory_Hold:0 "Augmenter l'emprise des conservateurs dans les zones rurales du sud de l'Angleterre"
 UK50_Increase_Tory_Hold_desc:0 "Le soutien au Parti conservateur doit être assuré dans les zones rurales du sud de l'Angleterre, où se concentre le soutien du centre-droit."
 UK50_Popularize_Holiday_Camps:0 "Vulgariser les camps de vacances"
 UK50_Popularize_Holiday_Camps_desc:0 "Les camps de vacances en Angleterre existent depuis la fin des années 1930, où ils proposent hébergement et activités aux touristes en vacances. Avec l'avènement des loisirs dans les années 1950, nous allons populariser ces camps pour que nos populations puissent les poursuivre pendant leurs vacances."
 UK50_Permissive_Society:0 "La société permissive"
 UK50_Permissive_Society_desc:0 "Une société permissive est une société dans laquelle les normes sociales telles que la liberté sexuelle deviennent plus libérales. Ces sociétés sont principalement visibles dans l'Europe et l'Amérique des années 1960, avec l'augmentation de la drogue et de la contre-culture et un relâchement des valeurs victoriennes."
 UK50_Five_Common_Principles:0 "Cinq principes communs"
 UK50_Five_Common_Principles_desc:0 "La Constitution du Royaume-Uni repose sur cinq principes fondamentaux, à savoir la souveraineté du Parlement, l'Union des royaumes, la liberté individuelle, les freins et contrepoids et la subordination judiciaire."
 UK50_Maintain_Strict_Monetary_Policy:0 "Maintenir une politique monétaire stricte"
 UK50_Maintain_Strict_Monetary_Policy_desc:0 "Notre politique monétaire doit être stricte, même si notre taux d'inflation augmente à cause d'elle. Nous imprimerons plus de monnaie pour maintenir notre économie en croissance."
 UK50_Renewed_Pound_Devaluation:0 "Nouvelle dévaluation de la livre sterling"
 UK50_Renewed_Pound_Devaluation_desc:0 "La valeur de la livre sterling doit être réduite, de 4,03 $ à 2,80 $, indexée sur £1, en raison de la pénurie de nos réserves."
 UK50_Allocate_Funds_Distriution_of_Industry_Act:0 "Loi sur l'allocation de fonds pour la répartition de l'industrie"
 UK50_Allocate_Funds_Distriution_of_Industry_Act_desc:0 "La Loi sur la répartition de l'industrie de 1945 était une loi du Parlement destinée à aider au réaménagement des zones et, entre 1945 et 1950, elle a construit 481 usines gouvernementales et 505 usines privées, créant environ 200 000 emplois."
 UK50_Increase_State_Housing_Credit_Limit:0 "Augmenter la limite de crédit au logement de l'État"
 UK50_Increase_State_Housing_Credit_Limit_desc:0 "La limite du crédit que nos citoyens peuvent utiliser pour acheter ou louer un logement sera augmentée. L'augmentation de cette limite permettra à davantage de personnes de prolonger leur crédit et de pouvoir obtenir un logement abordable pour elles-mêmes"
 UK50_Ramp_Up_Industrial_Exports:0 "Accélérer les exportations industrielles"
 UK50_Ramp_Up_Industrial_Exports_desc:0 "L'augmentation de nos exportations vers nos alliés et tous nos clients permettra un remplissage rapide de la réserve de livres sterling et une croissance de notre économie, dont le Royaume-Uni a désespérément besoin en ce moment."
 UK50_Step_Up_Agricultural_Subsidies:0 "Augmenter les subventions agricoles"
 UK50_Step_Up_Agricultural_Subsidies_desc:0 "L'octroi de subventions agricoles permettra à nos agriculteurs de produire davantage de récoltes et de vendre plus de nourriture, tout en leur fournissant les meilleures technologies agricoles que nous avons à offrir."
 UK50_Restore_Universal_Death_Duties:0 "Rétablir les droits universels de décès"
 UK50_Restore_Universal_Death_Duties_desc:0 "Le droit de succession et le droit de succession ont été supprimés par la loi de finances de 1949. Il faut désormais les rétablir."
 UK50_Fund_Tarmac_Group:0 "Financer le Groupe Tarmac"
 UK50_Fund_Tarmac_Group_desc:0 "Le groupe Tarmac est une entreprise britannique de matériaux de construction, responsable de la production de matériaux de revêtement routier, de béton, de ciment et de chaux, en plus d'être un entrepreneur en construction routière ; leur aide revigorera nos routes et nos infrastructures vitales."
 UK50_Subsidize_Coal_and_Steel:0 "Subventionner les industries du charbon et de l'acier"
 UK50_Subsidize_Coal_and_Steel_desc:0 "Avec la création du National Coal Board en 1946 pour gérer notre industrie charbonnière et l'adoption de la loi sur le fer et l'acier en 1949, le gouvernement britannique exerce un certain contrôle sur les industries du charbon et de l'acier, en leur accordant des subventions."
 UK50_Print_New_Export_Currency:0 "Imprimer une nouvelle devise d'exportation"
 UK50_Print_New_Export_Currency_desc:0 "Une nouvelle monnaie d'exportation sera imprimée et rattachée à notre livre sterling, dans le but de récupérer nos faibles réserves et de réaliser un excédent."
 UK50_Increase_Minimum_Wage:0 "Augmenter le salaire minimum"
 UK50_Increase_Minimum_Wage_desc:0 "Avec l'adoption de la loi de 1945 sur les conseils salariaux, le Parlement commence à se lancer dans l'augmentation du salaire minimum pour certains secteurs de l'industrie."
 UK50_Cap_NHS:0 "Plafonner les dépenses du NHS"
 UK50_Cap_NHS_desc:0 "Les dépenses consacrées au Service National de Santé sont allées assez loin ! Le gouvernement est contraint de prélever de petits frais, comme un shilling pour les ordonnances et une livre pour les soins dentaires, afin de plafonner les dépenses du NHS."
 UK50_Open_BOE_Loans:0 "Prêts ouverts de la Banque d'Angleterre"
 UK50_Open_BOE_Loans_desc:0 "Nous devons contracter des emprunts auprès de la Banque d'Angleterre pour garantir la croissance de notre économie, même si cela signifie que notre inflation augmente."
 UK50_Confirm_Rail_Nationalization:0 "Confirmer la nationalisation des chemins de fer et des câbles"
 UK50_Confirm_Rail_Nationalization_desc:0 "Avec le Transport Act 1947, toutes les compagnies ferroviaires privées du Royaume-Uni ont été nationalisées au sein de British Railways, et le réseau de télécommunications britannique a été nationalisé au sein de Cable and Wireless plc."
 UK50_Diminish_Working_Hours_Public_Service:0 "Diminuer les heures de travail dans les services publics"
 UK50_Diminish_Working_Hours_Public_Service_desc:0 "Réduire les heures de travail de nos fonctionnaires et employés du gouvernement augmentera leur productivité et favorisera la stabilité nationale."
 UK50_Raise_High_Income_Inheritance_Tax:0 "Augmenter les droits de succession sur les revenus élevés"
 UK50_Raise_High_Income_Inheritance_Tax_desc:0 "L'impôt prélevé sur les revenus de succession doit être augmenté, car le gouvernement a besoin de plus d'argent pour survivre et se développer."
 UK50_Expand_Iron_Steel_Corportaion_Of_GB:0 "Développer Iron & Steel Corporation of Great-Britain"
 UK50_Expand_Iron_Steel_Corportaion_Of_GB_desc:0 "La loi sur le fer et l'acier de 1949 est entrée en vigueur en 1951 et la Iron and Steel Corporation de Grande-Bretagne doit être constituée de l'ensemble de l'industrie."
 UK50_Raise_Investment_in_Public_Works:0 "Augmenter les investissements dans les travaux publics"
 UK50_Raise_Investment_in_Public_Works_desc:0 "Nos investissements dans des projets de travaux publics, tels que nos autoroutes, ponts et autres infrastructures, doivent être augmentés, afin que le gouvernement britannique puisse avoir un contrôle quasi total sur les travaux publics."
 UK50_Resorb_NHS_Deficit:0 "Résorber le déficit du NHS"
 UK50_Resork_NHS_Deficit_desc:0 "Le déficit croissant du Service national de santé doit être à nouveau absorbé par le gouvernement, afin de maintenir vivant le rêve d'une santé nationale."
 UK50_Aneurin_Bevan_Victory:0 "Victoire d'Aneurin Bevan"
 UK50_Aneurin_Bevan_Victory_desc:0 "L'ancien ministre du Travail Aneurin Bevan a gagné la confiance du Parlement et est devenu Premier ministre."
 UK50_Empower_Workers_Union:0 "Donner du pouvoir au syndicat des travailleurs"
 UK50_Empower_Workers_Union_desc:0 "Les syndicats sont extrêmement importants pour la sûreté et la sécurité de nos travailleurs britanniques et l'autonomisation de leurs activités et le recours à la négociation collective garantiront que tous les travailleurs conservent leurs droits."
 UK50_Strengthen_Agricultural_Cooperatives:0 "Renforcer les coopératives agricoles"
 UK50_Strengthen_Agricultural_Cooperatives_desc:0 "Les coopératives agricoles communautaires uniront les gens vers un objectif commun : produire de la nourriture dans un esprit d'amitié, ainsi qu'un fort sentiment de fierté quant à leur dévouement à l'industrie agricole du Royaume-Uni."
 UK50_Fully_Nationalize_Steelworks:0 "Nationaliser entièrement les aciéries"
 UK50_Fully_Nationalize_Steelworks_desc:0 "Toutes les usines et industries productrices de fer et d'acier du Royaume-Uni seront entièrement nationalisées et intégrées à la Iron and Steel Corporation of Great Britain, qui contrôle totalement l'industrie."
 UK50_Sponsor_Trade_Union_Congress_Leftist_Candidates:0 "Parrainez les candidats de gauche au Congrès syndical"
 UK50_Sponsor_Trade_Union_Congress_Leftist_Candidates_desc:0 "Si le gouvernement parraine des candidats pro-syndicaux de gauche, le peuple saura vraiment que nous sommes aux côtés des travailleurs et que nous ferons tout ce qui est en notre pouvoir pour garantir leurs droits et leur soutien."
 UK50_Generalize_Comprehensive_Schools:0 "Généraliser les écoles polyvalentes"
 UK50_Generalize_Comprehensive_Schools_desc:0 "Les premières écoles polyvalentes, conçues pour offrir un programme plus pratique, ont été créées en Angleterre après la Seconde Guerre mondiale, avec cinq à Londres et deux à Coventry. Ces écoles doivent être développées et généralisées pour offrir davantage d'apprentissage professionnel à la nouvelle génération."
 UK50_Reshuffle_State_Owned_Business_Boards:0 "Remaniement des conseils d'administration des entreprises publiques"
 UK50_Reshuffle_State_Owned_Business_Boards_desc:0 "Les conseils d'administration qui contrôlent nos entreprises publiques, comme la Iron and Steel Corporation of Great Britain et Cable and Wireless plc, doivent être organisés et remplacés par des candidats plus expérimentés et politiquement acceptables."
 UK50_Turn_Company_Subsidies_Into_State_Shares:0 "Transformez les subventions des entreprises en actions de l'État"
 UK50_Turn_Company_Subsidies_Into_State_Shares_desc:0 "L'investissement dans nos industries publiques équivaut à un contrôle de l'État sur ces industries, puisque le gouvernement accorde des subventions. Notre contrôle sur les industries nationalisées continue de croître."
 UK50_Propose_Left_Unity_Manifesto:0 "Proposer un Manifeste pour l'unité de gauche"
 UK50_Propose_Left_Unity_Manifesto_desc:0 "Tous les partis de gauche au Royaume-Uni, y compris les travaillistes, les socialistes et les communistes, devraient se regrouper et s'unifier pour former une force unique et répandue au service du peuple !"
 UK50_Propose_Electoral_Reform:0 "Mettre en oeuvre une réforme électorale massive"
 UK50_Propose_Electoral_Reform_desc:0 "L'adoption du projet de loi sur la représentation du peuple, proposé pour la première fois par le Parti travailliste en 1931, permettra un vote alternatif et donnera au peuple la possibilité d'opérer un changement au sein du gouvernement."
 UK50_Call_Snap_Elections:0 "Appelez à des élections anticipées"
 UK50_Call_Snap_Elections_desc:0 "Des élections anticipées sont nécessaires de toute urgence, et avec notre nouvelle réforme électorale et nos efforts d'unité de gauche, les résultats devraient être clairs."
 UK50_Second_Atlee_Ministry:0 "Deuxième ministère Atlee"
 UK50_Second_Atlee_Ministry_desc:0 "Après les élections anticipées de 1951, le Premier ministre Attlee a de nouveau gagné la confiance de son gouvernement, entamant son deuxième ministère en tant que Premier ministre."
 UK50_Propose_Rearmament_Plan:0 "Proposer un plan de réarmement"
 UK50_Propose_Rearmament_Plan_desc:0 "Après la Seconde Guerre mondiale, il est devenu évident que le Royaume-Uni devait se préparer à tout conflit futur, en se réarmant rapidement et en maintenant une force de combat forte."
 UK50_Double_University_Funds:0 "Double fonds universitaires"
 UK50_Double_University_Funds_desc:0 "Nos universités reçoivent un financement minime, même si nos soldats reviennent de la guerre et doivent trouver une carrière ou une éducation. Il faut allouer davantage de fonds aux universités pour permettre la poursuite des études."
 UK50_Open_New_RSAF_Munition_Plants:0 "Ouvrir de nouvelles usines de munitions RSAF"
 UK50_Open_New_RSAF_Munition_Plants_desc:0 "La Royal Small Arms Factory est une usine de fusils appartenant au gouvernement britannique située dans la banlieue londonienne d'Enfield. Elle est célèbre pour la production des célèbres fusils Lee-Enfield et des pistolets Bren et Sten. Un plus grand nombre de ces usines doivent être construites autour du Royaume-Uni pour faciliter une production et un déploiement plus rapides de nos armes légères."
 UK50_Develop_de_Havilland_Exports:0 "Développer les exportations d'avions de Havilland"
 UK50_Develop_de_Havilland_Exports_desc:0 "Le développement du DH.106 Comet par la société de Havilland Aircraft Company Limited devrait intéresser de nombreux acheteurs étrangers et propulser notre marché aéronautique sur la scène mondiale."
 UK50_Increase_BBC_Budget:0 "Augmenter le budget de la BBC"
 UK50_Increase_BBC_Budget_desc:0 "La British Broadcasting Corporation est le radiodiffuseur national du Royaume-Uni et est créée en vertu d'une charte royale, ce qui la rend essentiellement publique. Le budget de la BBC destiné aux programmes de radio et de télévision doit être augmenté via une licence de télévision."
 UK50_Expand_Avro_Factories:0 "Agrandir les usines Avro"
 Uk50_Expand_Avro_Factories_desc:0 "Avro est un constructeur aéronautique britannique fondé en 1910 et responsable de l'Avro 504 et de l'Avro Lancaster. Basées principalement dans le Lancashire, les usines Avro doivent être agrandies pour commencer à produire le nouveau bombardier Avro Vulcan."
 UK50_Inaugurate_Basildon_Corby_New_Towns:0 "Inaugurer les nouvelles villes de Basildon et Corby"
 UK50_Inaugurate_Basildon_Corby_New_Towns_desc:0 "Après l'adoption du New Towns Act 1946, les villes de Basildon et Corby seront désignées New Towns dans le sud-est de l'Angleterre, en tant que banlieues de Londres, et seront organisées via des sociétés de développement."
 UK50_Aid_Rolls_Royce_Production:0 "Aide à la production de Rolls Royce"
 UK50_Aid_Rolls_Royce_Production_desc:0 "Rolls-Royce Limited est une multinationale britannique de l'aérospatiale et de la défense qui conçoit, fabrique et distribue aujourd'hui des systèmes d'alimentation pour l'aviation, notamment des moteurs d'avion."
 UK50_British_Productivity_Council:0 "Conseil britannique de productivité"
 UK50_British_Productivity_Council_desc:0 "Le British Productivity Council était un organisme organisé visant à accroître l'efficacité industrielle du Royaume-Uni. Créé en 1951, le Conseil a produit de nombreux films destinés à sensibiliser les travailleurs aux pratiques de travail."
 UK50_Establish_Fees_NHS_Dental_Vision_Care:0 "Établir les frais pour les soins dentaires et de la vue du NHS"
 UK50_Establish_Fees_NHS_Dental_Vision_Care_desc:0 "En raison du surfinancement du Service national de santé, le gouvernement a été contraint de prélever des frais sur les soins dentaires et visuels, en plus des ordonnances."
 UK50_Right_Road_For_Britain:0 "La bonne voie pour la Grande-Bretagne"
 UK50_Right_Road_For_Britain_desc:0 "Comme le mentionne le Manifeste du Parti conservateur de 1950, « La bonne voie pour la Grande-Bretagne est de redonner à notre pays son indépendance économique et à nos citoyens leur pleine liberté personnelle et leur pouvoir d'initiative »."
 UK50_Push_Strong_Building_Industry:0 "Faire pression pour une industrie du bâtiment forte"
 UK50_Push_Strong_Building_Industry_desc:0 "La Grande-Bretagne a besoin d'une industrie de la construction forte pour poursuivre ses efforts de croissance économique - nous devons faire pression en ce sens autant que possible."
 UK50_Increase_Bellway_Subsidies:0 "Augmenter les subventions de Bellway"
 UK50_Increase_Bellway_Subsidies_desc:0 "Bellway est un promoteur immobilier résidentiel basé à Newcastle upon Tyne. En leur accordant du financement, ils peuvent nous aider à construire davantage de logements pour les particuliers et les entreprises."
 UK50_Expand_Taylor_Woodrow_Markets:0 "Développez les marchés de Taylor-Woodrow"
 UK50_Expand_Taylor_Woodrow_Markets_desc:0 "Taylor Woodrow était l'une des plus grandes entreprises de construction immobilière et de construction générale en Grande-Bretagne. Ils effectuent une grande variété de travaux, tant pour les secteurs privé que public, mais ce qui ressort est leur rôle dans l'industrie de la production d'électricité au Royaume-Uni ; après une série de centrales électriques conventionnelles, l'entreprise est devenue l'entrepreneur de la première centrale nucléaire commerciale au monde. Dans le secteur privé, les contrats notables comprenaient les terminaux de l'aéroport de Londres Heathrow et la cathédrale métropolitaine de Liverpool."
 UK50_Fullfil_McMillan_Housing_Pledge:0 "Tenir l'engagement de MacMillan en matière de logement"
 UK50_Fullfil_McMillan_Housing_Pledge_desc:0 "Harold MacMillan, le ministre conservateur du Logement et des Gouvernements locaux, a honoré l'engagement pris par le Premier ministre de construire 300 000 maisons par an."
 UK50_Build_New_Scotland_England_Highways:0 "Rénover l'autoroute A1 Londres-Édimbourg"
 UK50_Build_New_Scotland_England_Highways_desc:0 "Nous devons moderniser l'A1 pour permettre des vitesses plus élevées et une plus grande capacité."
 UK50_Raise_Gaelic_Trunk_Roads_Budgets:0 "Augmenter le budget des routes principales gaéliques"
 UK50_Raise_Gaelic_Trunk_Roads_Budgets_desc:0 "En améliorant les routes principales gaéliques, nous pouvons relier davantage de villes et de villages entre eux."
 UK50_Begin_Public_Services_Cuts:0 "Commencer les coupes dans les services publics"
 UK50_Begin_Public_Services_Cuts_desc:0 "Nous devrions commencer à transférer les services publics et les services publics vers des entreprises privées, afin de stimuler notre économie."
 UK50_Progressively_End_Rationning:0 "Mettre fin progressivement au rationnement"
 UK50_Progressively_End_Rationning_desc:0 "Cela fait assez longtemps après la Seconde Guerre mondiale. Le rationnement du carburant, de la viande, du fromage, du lait, du sucre et de toute autre nourriture doit cesser le plus tôt possible."
 UK50_UK_Atomic_Energy_Authority:0 "Autorité de l'énergie atomique du Royaume-Uni"
 UK50_UK_Atomic_Energy_Authority_desc:0 "L'Autorité de l'énergie atomique du Royaume-Uni, ou UKAEA, a été créée avec l'adoption de la loi de 1954 sur l'Autorité de l'énergie atomique qui lui ordonnait de « produire, utiliser et éliminer l'énergie atomique ». L'UKAEA est surtout connue pour sa collaboration avec le programme d'armes nucléaires du Royaume-Uni et pour ses essais nucléaires ultérieurs."
 UK50_Create_Independent_Television:0 "Créer une télévision indépendante"
 UK50_Create_Independent_Television_desc:0 "Independent Television, ou ITV, est une chaîne de télévision britannique gratuite, créée en tant que concurrent direct de la télévision publique BBC avec l'adoption de la loi sur la télévision de 1954."
 UK50_Stimulate_Household_Savings:0 "Stimuler l'épargne des ménages"
 UK50_Stimulate_Household_Savings_desc:0 "L'épargne des ménages doit être stimulée."
 UK50_Privatize_Steel_Industry:0 "Privatiser l'industrie sidérurgique"
 UK50_Privatize_Steel_Industry_desc:0 "Maintenant que le Parti conservateur est de retour au pouvoir, nous devons prendre des mesures pour réintégrer certaines parties de la société publique Iron and Steel Corporation of Great Britain dans le secteur privé, afin que notre économie puisse se reconstruire."
 UK50_Raise_BOE_Rates:0 "Augmenter les taux de crédit de la Banque d'Angleterre"
 UK50_Raise_BOE_Rates_desc:0 "Relever la cote de crédit de la Banque d'Angleterre permettra d'emprunter moins d'argent, ce qui laissera une offre plus réduite et diminuera considérablement le taux d'inflation."
 UK50_Abandon_Devaluation_Policies:0 "Abandonner les politiques de dévaluation"
 UK50_Abandon_Devaluation_Policies_desc:0 "Les politiques de dévaluation de la livre sterling étaient dangereuses, voire menaçantes pour notre économie. L'abandon de ces politiques entraînera une masse monétaire réduite et un excédent plus important dans nos réserves."
 UK50_Create_London_Green_Belt:0 "Créer la ceinture verte de Londres"
 UK50_Create_London_Green_Belt_desc:0 "La ceinture verte métropolitaine est une ceinture verte statutaire comprenant des parties du Grand Londres et les six « comtés d'origine » adjacents. Cette ceinture verte est conçue pour limiter la croissance urbaine et sera étendue sur 35 miles conformément à la loi sur l'aménagement urbain et rural de 1947."
 UK50_United_For_Peace_And_Progress:0 "Unis pour la paix et le progrès"
 UK50_United_For_Peace_And_Progress_desc:0 "Le Royaume-Uni sera uni pour assurer la paix et le progrès aussi longtemps que possible."
 UK50_Milford_Haven_Fawley_Raffineries_Expansion:0 "Agrandissement des raffineries de Milford Haven et Fawley"
 UK50_Milford_Haven_Fawley_Raffineries_Expansion_desc:0 "La raffinerie Esso de Milford Haven est une raffinerie de pétrole en plein essor située sur la côte du Pembrokeshire au Pays de Galles. La construction devrait commencer en 1957 et se terminer en 1960 ; La raffinerie Fawley est une raffinerie plus ancienne créée en 1921 et ouverte après une expansion en 1951 par le Premier ministre Attlee."
 UK50_Pupils_Registration_Regulations:0 "Règlement sur l'inscription des élèves"
 UK50_Pupils_Registration_Regulations_desc:0 "Tous les étudiants britanniques doivent être inscrits dans leur école afin de prévenir les violations de l'absentéisme scolaire et d'assurer leur éducation."
 UK50_Mines_Quarry_Act:0 "Loi sur les mines et carrières"
 UK50_Mines_Quarry_Act_desc:0 "La loi de 1954 sur les mines et carrières a été adoptée par le Parlement « pour apporter de nouvelles dispositions concernant la gestion et le contrôle des mines et carrières et pour garantir la sécurité, la santé et le bien-être des personnes qui y sont employées. »"
 UK50_Inaugurate_Premium_Bonds:0 "Inaugurer des obligations à prime"
 UK50_Inaugurate_Premium_Bonds_desc:0 "Les obligations à prime sont des obligations de loterie émises par le gouvernement britannique à partir de 1956 ; placés dans un tirage au sort mensuel, le gouvernement promet de les rembourser avec intérêts."
 UK50_Subsidize_Unilever_Innovation:0 "Subventionner l'innovation Unilever"
 UK50_Subsidize_Unilever_Innovation_desc:0 "Unilever est une multinationale britannique de biens de consommation basée à Londres, en Angleterre. Connu pour son innovation, Unilever devrait être subventionné pour sa contribution à l'économie britannique."
 UK50_Vote_Tax_Cuts_Leyland_BMC:0 "Votez des réductions d'impôts pour Leyland BMC"
 UK50_Vote_Tax_Cuts_Leyland_BMC_desc:0 "La British Motor Corporation Limited (BMC Limited) était un constructeur automobile basé au Royaume-Uni, créé au début de 1952, acquérant des actions d'Austin Motor Company et de Morris Motors."
 UK50_Encourage_Marketing_Department_Openings:0 "Encourager les ouvertures de département marketing"
 UK50_Encourage_Marketing_Department_Openings_desc:0 "Le marketing et la publicité sont essentiels à la croissance de notre économie ; il est essentiel que les ouvertures actuelles dans ce domaine soient rendues publiques et visibles."
 UK50_Fund_Pilkington_Glass:0 "Fonds Pilkington Glass"
 UK50_Fund_Pilkington_Glass_desc:0 "Pilkington est un fabricant britannique de verre et de verre flotté, qui a développé ce dernier procédé en 1953. Le financement de cette entreprise est essentiel car elle assure ses exportations dans le monde entier."
 UK50_Open_Dunlop_Facilities:0 "Installations Dunlop ouvertes"
 UK50_Open_Dunlop_Facilities_Desc:0 "Dunlop Rubber Company Ltd. Est une multinationale britannique de caoutchouc et de pneus basée à Birmingham, en Angleterre, responsable de plus de la moitié du marché britannique des pneus et de 70 000 employés. Davantage d'installations sont nécessaires pour accaparer le marché des pneus."
 UK50_Restrict_Bank_of_England_Credit_Allocation:0 "Restreindre l'allocation de crédit de la Banque d'Angleterre"
 UK50_Restrict_Bank_of_England_Credit_Allocation_desc:0 "Restreindre le pouvoir de la Banque d'Angleterre d'accorder du crédit à ses clients devrait, en théorie, limiter la hausse de l'inflation et contrôler la masse monétaire du Royaume-Uni."
 UK50_Set_Up_Radcliffe_Commission:0 "Créer la Commission Radcliffe"
 UK50_Set_Up_Radcliffe_Commission_desc:0 "Le rapport du Comité sur le fonctionnement du système monétaire était un rapport publié en 1959 par la Commission Radcliffe, présidée par Cyril Radcliffe. Il examine la politique monétaire et fournit des suggestions sur le contrôle de l'offre."
 UK50_Allow_Sterling_Pound_Convertibility:0 "Autoriser la convertibilité de la livre sterling"
 UK50_Allow_Sterling_Pound_Convertibility_desc:0 "Permettre à la livre sterling d'être convertie en d'autres monnaies, comme le dollar et le deutsche mark, permettra de mieux contrôler la masse monétaire et au gouvernement de maintenir un excédent croissant."
 UK50_Metropolitan_Vickers_Train_Engines_Modernization:0 "Modernisation des locomotives du train Metropolitan Vickers"
 UK50_Metropolitan_Vickers_Train_Engines_Modernization_desc:0 "Dans le cadre du plan de modernisation des chemins de fer britanniques, les moteurs de train produits par Metropolitan Vickers, tels que la British Rail Class 77 et la Rail Class 28, doivent être introduits pour maintenir les véhicules de transport modernes."
 UK50_Develop_Fulmer_Reasearch_Institute_Mineral_Fund:0 "Développer le fonds minéral du Fulmer Research Institute"
 UK50_Develop_Fulmer_Reasearch_Institute_Mineral_Fund_desc:0 "Le Fulmer Research Institute est une organisation britannique de recherche et de développement, créée en 1946 en tant qu'institut de recherche en technologie des matériaux et en chimie. Responsable de la recherche sur la production d'aluminium, de carburant pour fusée et d'alliages légers, le Fonds minéral doit être développé pour aider à leurs découvertes."
 UK50_Stimulate_English_Electric_Computer_Research:0 "Stimuler la recherche anglaise sur l'informatique électrique"
 UK50_Stimulate_English_Electric_Computer_Research_desc:0 "English Electric est une société britannique spécialisée dans les équipements électriques, les moteurs, les avions et les moteurs. Le développement et la recherche de l'English Electric DEUCE, le premier ordinateur britannique disponible dans le commerce, contribueront à la croissance de notre économie."
 UK50_Imperial_Chemical_Industries_Plant_Development:0 "Développement d'une usine d'Imperial Chemical Industries"
 UK50_Imperial_Chemical_Industries_Plant_Development_desc:0 "Imperial Chemical Industries est une importante entreprise chimique britannique, responsable des produits chimiques, des plastiques et des produits pharmaceutiques. Étant la plus grande entreprise chimique de Grande-Bretagne, ses usines et installations favoriseront notre économie à l'échelle nationale."
 UK50_Aid_Marconi_Instrument_LTD:0 "Aide Marconi Instrument Ltd."
 UK50_Aid_Marconi_Instrument_LTD_desc:0 "Marconi Instruments Limited est une société d'électronique britannique, créée lors d'une fusion en 1936 ; responsable de la fabrication d'oscilloscopes, de voltmètres, de composants électriques et d'autres équipements. La Grande-Bretagne devrait commencer à se concentrer sur l'électronique en tant qu'élément majeur de son orientation industrielle."
 UK50_Connect_Calder_Hall_Chapelcross_Reactors:0 "Connectez les réacteurs Calder Hall et Chapelcross"
 UK50_Connect_Calder_Hall_Chapelcross_Reactors_desc:0 "Calder Hall et Chapelcross sont deux centrales nucléaires Magnox situées dans le sud-ouest de l'Écosse, exploitées par l'Autorité britannique de l'énergie atomique et chargées de l'enrichissement du plutonium pour le programme d'armes nucléaires du Royaume-Uni, en plus de fournir de l'énergie électrique."
 UK50_Restructure_German_Debt:0 "Restructurer la dette allemande"
 UK50_Restructure_German_Debt_desc:0 "Les réparations d'après-guerre versées aux Alliés seront modifiées par la mise en oeuvre de l'accord de Londres sur la dette extérieure allemande, qui couvrira les prêts des précédents plans Dawes et Marshall, ce qui entraînerait le paiement par l'Allemagne d'environ 765 millions de marks par an."
 UK50_Increase_MI5_Funds:0 "Augmenter les fonds du MI5"
 UK50_Increase_MI5_Funds_desc:0 "En raison des menaces posées par la guerre froide, nous devons accroître le financement de notre sécurité nationale."
 UK50_MI6_Expansion:0 "Extension du MI6"
 UK50_MI6_Expansion_desc:0 "En raison des menaces posées par la guerre froide, nous devons accroître notre financement de la sécurité étrangère."
 UK50_Sign_Peace_Treaty_Japan:0 "Signer un traité de paix avec le Japon"
 UK50_Sign_Peace_Treaty_Japan_desc:0 "Avec le Traité de paix japonais de 1951, nous parvenons enfin à une paix totale avec le Japon."
 UK50_Push_FRG_Admission_Council_Europe:0 "Faire pression pour l'admission de l'Allemagne de l'Ouest au Conseil de l'Europe"
 
 UK50_Sign_Economic_Partnership_ECSC:0 "Signer un partenariat économique avec la CECA"
 UK50_Sign_Economic_Partnership_ECSC_desc:0 "La Communauté européenne du charbon et de l'acier était une organisation de six pays européens créée après la Seconde Guerre mondiale pour réglementer leur production industrielle sous une autorité centralisée."
 UK50_H_Bomb_Program:0 "Le programme de la bombe H"
 UK50_H_Bomb_Program_desc:0 "Incroyable, le respect que procurent les armes nucléaires."
 UK50_Participate_Geneva_Conference:0 "Participer à la Conférence de Genève"
 UK50_Participate_Geneva_Conference_desc:0 "Participez à la Conférence de Genève sur le Vietnam."
 UK50_Help_British_Petroleum_Iran:0 "Aidez British Petroleum en Iran"
 UK50_Help_British_Petroleum_Iran_desc:0 "Aidez British Petroleum Company à résoudre ses problèmes concernant le gouvernement iranien."
 UK50_Foudn_Bagdad_Pact:0 "J'ai trouvé le pacte de Bagdad"
 UK50_Foudn_Bagdad_Pact_desc:0 "Le Pacte de Bagdad est une alliance militaire entre l'Iran, l'Irak, le Pakistan, la Turquie et le Royaume-Uni."
 UK50_Blue_Streak_Missile_Program:0 "Programme de missiles Blue Streak"
 UK50_Blue_Streak_Missile_Program_desc:0 "Il est clair que si la Grande-Bretagne veut disposer d'une menace de dissuasion nucléaire crédible, un missile balistique est essentiel. Nous n'avons pas pu acheter des armes américaines en gros en raison des restrictions de la loi sur l'énergie atomique de 1946.\nLes Américains proposent désormais un programme commun de développement de missiles balistiques. Les États-Unis développeraient un missile balistique intercontinental, tandis que nous développerions un missile balistique à portée intermédiaire. La proposition a été acceptée dans le cadre de l'accord Wilson-Sandys."
 UK50_Ask_American_Help:0 "Demandez de l'aide à American"
 UK50_Ask_American_Help_desc:0 "Demandez de l'aide à American"
 UK50_Tackle_Nasser_Regime:0 "S'attaquer au régime de Nasser"
 UK50_Tackle_Nasser_Regime_desc:0 "Nasser est une grosse épine dans nos flancs contre laquelle il faut s'attaquer."
 UK50_Propose_Signature_EFTA:0 "Proposer le traité d'association européenne de libre-échange"
 UK50_Propose_Signature_EFTA_desc:0 "L'Association européenne de libre-échange (AELE) est une organisation commerciale régionale et une zone de libre-échange. Elle a été fondée pour servir de bloc commercial alternatif aux États européens qui ne pouvaient ou ne voulaient pas rejoindre la Communauté économique européenne d'alors."
 UK50_Commonwealth_Affairs:0 "Affaires du Commonwealth"
 UK50_Commonwealth_Affairs_desc:0 "Affaires liées au Commonwealth"
 UK50_Change_Imperial_Semantics:0 "Changer la sémantique impériale"
 UK50_Change_Imperial_Semantics_desc:0 "\"Je pense que je peux sauver l'Empire britannique de tout sauf des Britanniques.\"\n-Winston Churchill"
 UK50_Colonial_Welfare_Development_Act:0 "Loi sur le développement du bien-être colonial du [GetYear]"
 UK50_Colonial_Welfare_Development_Act_desc:0 "La loi sur le développement du bien-être colonial de [GetYear] est une extension de la loi de 1946. Les fonds de la loi sont reversés au Conseil de recherche en sciences sociales coloniales qui conseille le secrétaire d'État aux Colonies sur le financement de la recherche en sociologie et en anthropologie liées au développement colonial."
 UK50_Abandon_Groundnut_Scheme:0 "Abandonner le programme d'arachide au Tanganyika"
 UK50_Abandon_Groundnut_Scheme_desc:0 "Le programme d'arachide du Tanganyika, ou programme d'arachide d'Afrique de l'Est, était une tentative de cultiver davantage d'arachides au Tanganyika.\nLes partisans du projet avaient notamment négligé les avertissements selon lesquels l'environnement et les précipitations n'étaient pas adaptés, les communications étaient inadéquates et l'ensemble du projet était poursuivi avec une précipitation excessive. Malgré un effort énorme et au prix de £36 millions (équivalent à plus de £1 milliards en valeur 2020), le projet a été un échec désastreux."
 UK50_Colonial_Loans_Act:0 "Loi sur les prêts coloniaux"
 UK50_Colonial_Loans_Act_desc:0 "La Loi sur les prêts coloniaux vise à fournir à nos colonies des fonds afin d'améliorer leurs zones les plus pauvres."
 UK50_Approve_Central_African_Federation_Principle:0 "Approuver le principe de la Fédération Centrafricaine"
 UK50_Approve_Central_African_Federation_Principle_desc:0 "Grâce aux négociations, nous sommes prêts à approuver la Fédération centrafricaine."
 UK50_Build_New_Airstrips_Gulf:0 "Construire de nouvelles pistes d'atterrissage dans le golfe Persique"
 UK50_Build_New_Airstrips_Gulf_desc:0 "Nous devons étendre notre influence militaire autour du golfe Persique."
 UK50_Expand_Indian_Ocean_Bases:0 "Développer les bases de l'océan Indien"
 UK50_Expand_Indian_Ocean_Bases_desc:0 "Nous devons étendre notre influence militaire autour de l'océan Indien."
 UK50_Strengthen_Commonwealth_Trade:0 "Renforcer le commerce du Commonwealth"
 UK50_Strengthen_Commonwealth_Trade_desc:0 "Renforcez le commerce du Commonwealth avec de nouveaux accords commerciaux."
 UK50_Increase_White_Dominion_Political_Ties:0 "Augmenter les liens politiques entre les Dominions blancs"
 UK50_Increase_White_Dominion_Political_Ties_desc:0 "\"Keep England White\" est un bon slogan.\n-Winston Churchill, 1955"
 UK50_Stimulate_Sterling_Use:0 "Stimuler l'utilisation de Sterling"
 UK50_Stimulate_Sterling_Use_desc:0 "Depuis la Seconde Guerre mondiale, la livre sterling a perdu son utilisation internationale, tombant bien en dessous de celle de guerre, en raison d'un mélange de confiance en elle et du déplacement des marchés vers l'Europe."

 ENG_60s_Continue_The_Economic_Boom:0 "Continuer le boom économique"
 ENG_60s_Continue_The_Economic_Boom_desc:0 "L'économie se porte très bien et il serait imprudent d'arrêter cela. Nous devons prendre des mesures pour garantir que l'économie continue de prospérer, afin que la nation elle-même puisse continuer à croître. "
 ENG_60s_The_Winds_of_Change:0 "Le vent du changement"
 ENG_60s_The_Winds_of_Change_desc:0 "Les temps changent, la colonisation est condamnée au niveau international et les mouvements indépendantistes s'intensifient. Nous sommes confrontés à un choix : essayer de maintenir notre empire ou leur laisser leur indépendance. Il est peut-être temps que le soleil se couche enfin sur l'Empire britannique. "
 ENG_60s_The_British_Armed_Forces:0 "Les forces armées britanniques"
 ENG_60s_The_British_Armed_Forces_desc:0 "Le moment est venu, à mesure que le monde progresse, l'armée doit suivre, nous devons faire des efforts pour nous assurer que notre armée répond aux normes modernes, afin que nous puissions nous protéger de nos ennemis et exercer notre influence. "
 ENG_60s_Prime_Minister_MacMillan:0 "Premier ministre MacMillan"
 ENG_60s_Prime_Minister_MacMillan_desc:0 "Après qu'Anthony Eden ait été contraint de démissionner, il revient désormais à Harold Macmillan de porter notre grande nation vers l'avenir. Cependant, avec une économie en déclin et des troubles coloniaux à venir, il reste à voir si son règne sera couronné de succès."
 ENG_60s_Elections_of_1964:0 "Élections de 1964"
 ENG_60s_Elections_of_1964_desc:0 "Les votes sont arrivés, mais il reste à voir qui est arrivé en tête et est devenu le nouveau parti au pouvoir. "
 ENG_60s_Elections_of_1966:0 "Élections de 1966"
 ENG_60s_Elections_of_1966_desc:0 "Après les récentes élections, les votes ont été comptés, je me demande qui a gagné."
 ENG_60s_Elections_of_1970:0 "Élections de 1970"
 ENG_60s_Elections_of_1970_desc:0 "Voilà, de nouvelles élections pour une nouvelle décennie, mais reste à savoir quel sera le succès du parti élu."
 ENG_60s_Increase_Affordable_Housing:0 "Augmenter le logement abordable"
 ENG_60s_Increase_Affordable_Housing_desc:0 "Les gens ont besoin d'un abri, mais plus important encore, cela représente une lacune sur le marché. Si nous pouvons augmenter le nombre de logements abordables, cela augmentera notre popularité, sans parler de nos finances."
 ENG_60s_Increase_Weapon_Exports:0 "Augmenter les exportations d'armes"
 ENG_60s_Increase_Weapon_Exports_desc:0 "À mesure que les tensions augmentent dans le monde entier et que de nouvelles guerres éclatent, les besoins en armes augmentent soudainement et une lacune apparaît sur le marché. Nous devons immédiatement augmenter la production d'armes afin de pouvoir commencer à en vendre davantage."
 ENG_60s_Expand_Auto_Usage:0 "Développer l'utilisation automatique"
 ENG_60s_Expand_Auto_Usage_desc:0 "Au fur et à mesure que le temps passe, nous voyons de plus en plus de personnes utiliser des voitures dans d'autres pays, nous serions idiots de passer à côté. Nous devons augmenter le nombre de personnes utilisant la voiture, leur permettre de se déplacer plus facilement et donner un coup de pouce à l'industrie automobile, dans une situation gagnant-gagnant."
 ENG_60s_The_Benefits_of_Full_Employment:0 "Les avantages du plein emploi"
 ENG_60s_The_Benefits_of_Full_Employment_desc:0 "Alors que l'économie continue de croître, nous devons nous assurer que les gens travaillent, et une façon d'y parvenir est de leur montrer les nombreux avantages du plein emploi ! La promotion de cette campagne nous coûtera une certaine influence politique, mais elle en vaudra la peine en termes de gains économiques. "
 ENG_60s_Encourage_Economic_Modernization:0 "Encourager la modernisation économique"
 ENG_60s_Encourage_Economic_Modernization_desc:0 "À mesure que la technologie progresse, nous ne pouvons pas nous installer dans nos habitudes archaïques. Nous devons encourager le développement technologique, sinon nous risquons d'être laissés pour compte."
 ENG_60s_Encourage_Higher_Wages:0 "Encourager des salaires plus élevés"
 ENG_60s_Encourage_Higher_Wages_desc:0 "À mesure que l'économie croît, les bénéfices des entreprises augmentent avec elle, l'augmentation des salaires donnera non seulement plus de pouvoir d'achat aux gens et augmentera la croissance des autres entreprises, mais augmentera également notre popularité auprès du peuple."
 ENG_60s_Devalue_the_Pound:0 "Dévaluer la livre sterling"
 ENG_60s_Devalue_the_Pound_desc:0 "Même si cela nuira à l'économie à court terme, nous ne devons pas risquer que l'hyperinflation détruise l'économie à long terme. Nous devons dévaluer la livre sterling tant que notre économie est suffisamment forte pour encaisser le coup."
 ENG_60s_Increase_Airliner_Exports:0 "Augmenter les exportations d'avions de ligne"
 ENG_60s_Increase_Airliner_Exports_desc:0 "L'économie mondiale en pleine croissance a besoin d'avions, tout comme l'industrie touristique en pleine croissance, et les exportations britanniques sont là pour répondre à la demande, car à mesure que nous vendons davantage d'avions de ligne, nos bénéfices augmenteront, tout simplement."
 ENG_Establish_the_National_Economic_Development_Council:0 "Créer le Conseil national de développement économique"
 ENG_Establish_the_National_Economic_Development_Council_desc:0 "À mesure que l'économie se développe, le besoin en infrastructures augmente également. Nous devons créer un programme visant à accroître la création d'infrastructures, de peur qu'elles ne soient en retard par rapport à la demande"
 ENG_60s_Achieve_Budgetary_Surplus:0 "Atteindre un excédent budgétaire"
 ENG_60s_Achieve_Budgetary_Surplus_desc:0 "L'économie est devenue si forte que nous disposons désormais d'un budget excédentaire, ce qui nous donne la liberté de dépenser plus d'argent et de développer l'économie, tout en renforçant davantage notre popularité."
 ENG_60s_Encourage_Corporate_Mergers:0 "Encourager les fusions d'entreprises"
 ENG_60s_Encourage_Corporate_Mergers_desc:0 "À mesure que l'économie se développe, les nouvelles entreprises se développent également. Nous devrions les encourager à fusionner pour augmenter leurs profits et se mettre à l'abri de la faillite."
 ENG_60s_Condemn_Rhodesian_UDI:0 "Condamner l'UDI rhodésien"
 ENG_60s_Condemn_Rhodesian_UDI_desc:0 "La déclaration d'indépendance de la Rhodésie est inacceptable, elle mine notre pouvoir et nous fait rire au nez ! Nous ne pouvons pas leur permettre de partir dans de telles circonstances, mais il vaudrait peut-être mieux rechercher une solution diplomatique plutôt que militariste. "
 ENG_60s_Open_Negotiations_with_Rhodesia:0 "Négociations ouvertes avec la Rhodésie"
 ENG_60s_Open_Negotiations_with_Rhodesia_desc:0 "Il serait téméraire d'essayer d'arrêter ce mouvement militairement, nous devons apparaître comme la plus grande puissance et ouvrir des négociations avec la Rhodésie, peut-être pouvons-nous tourner ce mouvement à notre avantage en ouvrant une discussion."
 ENG_60s_Sanction_Rhodesia:0 "Sanctionner la Rhodésie"
 ENG_60s_Breakdown_of_Negotiations:0 "Rupture des négociations"
 ENG_60s_Breakdown_of_Negotiations_desc:0 "Nous avons tenté d'en discuter avec la Rhodésie, mais en vain, ils refusent d'être raisonnables avec nous et nous continuerons donc notre règne sur eux. Ils ne tenteraient sûrement pas quelque chose d'aussi stupide qu'une révolte ?"
 ENG_60s_Recognize_Rhodesia:0 "Reconnaître la Rhodésie"
 ENG_60s_Recognize_Rhodesia_desc:0 "Les pourparlers avec la Rhodésie ont réussi et nous avons convenu de les reconnaître, en espérant que cela mènera à un avenir radieux entre nos deux nations. "
 ENG_60s_Mitigate_International_Damages:0 "Atténuer les dommages internationaux"
 ENG_60s_Mitigate_International_Damages_desc:0 "La situation en Rhodésie a conduit à une détérioration de notre réputation internationale et nous devons donc maintenant déployer des efforts pour reconstruire cette réputation et cette confiance auprès des autres nations, pour aider notre nation à aller de l'avant et pour nous donner une meilleure image aux yeux du peuple."
 ENG_60s_Aid_Nigeria:0 "Aide au Nigéria"
 ENG_60s_Aid_Nigeria_desc:0 "Le Nigeria aspire à l'indépendance et il n'est plus tenable de tenter de le soumettre. Il est donc devenu de notre devoir de l'aider dans sa nouvelle indépendance, sous peine de le voir tomber sous l'influence de nos ennemis. "
 ENG_Reevaluate_The_Colonial_Situation:0 "Réévaluer la situation coloniale"
 ENG_Reevaluate_The_Colonial_Situation_desc:0 "Les temps ont changé, les anciennes méthodes de gestion de notre empire ne peuvent plus perdurer, nous devons réévaluer la meilleure façon de gérer nos colonies restantes, de peur qu'elles ne recherchent des méthodes plus radicales pour introduire des changements."
 YEM_The_Aden_Emergency:0 "L'urgence d'Aden"
 YEM_The_Aden_Emergency_desc:0 "Les sauvages d'Aden se sont soulevés contre nous !, nous devons prendre des mesures d'urgence pour garantir le maintien de notre domination sur cette région précieuse, ou peut-être est-il temps d'abandonner enfin Aden. "
 ENG_60s_Reap_Profits_from_Arabian_Protectorates:0 "Récoltez les bénéfices des protectorats arabes"
 ENG_60s_Reap_Profits_from_Arabian_Protectorates_desc:0 "Pendant que nous continuons à défendre nos possessions arabes, nous devrions être en mesure d'exploiter leurs ressources pour notre propre gain économique. Après tout, nous devons en tirer quelque chose, non seulement nous gagnerons plus de ressources, mais aussi plus d'emplois pour notre peuple."
 ENG_Declare_Martial_Law_in_Aden:0 "Déclarer la loi martiale à Aden"
 ENG_Declare_Martial_Law_in_Aden_desc:0 "La crise s'est aggravée et nos atouts dans la région sont attaqués par les insurgés. Nous devons utiliser l'armée pour reprendre le contrôle de la zone et maintenir l'ordre, car le protectorat est clairement incapable de le faire lui-même."
 ENG_60s_Crackdown_on_Aden:0 "Répression contre Aden"
 ENG_60s_Crackdown_on_Aden_desc:0 "Aden est une colonie britannique et elle le restera ! Nous ne nous laisserons pas bousculer par ces insurgés, nous devons les réprimer afin de garder le contrôle, nous ne reculerons pas cette fois."
 ENG_60s_Withdraw_from_Aden:0 "Se retirer d'Aden"
 ENG_60s_Withdraw_from_Aden_desc:0 "La situation à Aden est devenue intenable, il est devenu évident que toutes les ressources consacrées au maintien du contrôle sont gaspillées et nous devons donc céder aux exigences des insurgés et nous retirer. "
 ENG_60s_Reject_Calls_for_South_African_Sanctions:0 "Rejeter les appels à des sanctions sud-africaines"
 ENG_60s_Reject_Calls_for_South_African_Sanctions_desc:0 " Même si la communauté internationale condamne l'apartheid, l'Afrique du Sud reste une amie de la Grande-Bretagne et nous ne pouvons pas permettre qu'elle souffre. De plus, plus de commerce signifiera plus de profits pour nous. "
 ENG_60s_Announce_Withdrawal_from_the_Arabian_Gulf:0 "Annoncer le retrait du golfe Persique"
 ENG_60s_Announce_Withdrawal_from_the_Arabian_Gulf_desc:0 "Malgré nos efforts pour maintenir le contrôle de la région, nous devons reculer, car comme la plupart de nos possessions coloniales, elles sont devenues non rentables et intenables, nous ne pouvons tout simplement pas justifier de rester ici plus longtemps, et c'est ainsi que le processus de retrait commence."
 ENG_60s_Resist_Calls_to_Withdraw_from_the_Gulf:0 "Résistez aux appels au retrait du Golfe"
 ENG_60s_Resist_Calls_to_Withdraw_from_the_Gulf_desc:0 "Nous contrôlons le Golfe Persique et aucun autre, nous ne permettrons pas aux puissances étrangères d'essayer de nous saper, nous sommes l'Empire britannique et nous garderons le contrôle de notre empire, nous garderons le contrôle du Golfe, pour le roi et pour le pays !"
 ENG_60s_The_Balance_of_Payments_Crisis:0 "La crise de la balance des paiements"
 ENG_60s_The_Balance_of_Payments_Crisis_desc:0 "Malgré la croissance rapide de l'économie dans les années 50, notre monnaie a commencé à perdre de sa valeur et nous avons désormais du mal à importer les biens nécessaires et à rembourser nos dettes. Une action rapide est nécessaire pour éviter que notre économie ne s'effondre"
 ENG_60s_Temporary_Wage_Freeze:0 "Gel temporaire des salaires"
 ENG_60s_Temporary_Wage_Freeze_desc:0 "Dans un effort pour réduire les dépenses, nous devons arrêter l'augmentation des salaires pour correspondre à l'inflation, sinon cela pourrait bientôt devenir incontrôlable. Cela rendra le parti impopulaire auprès du peuple, mais stabilisera l'économie et augmentera notre popularité auprès des grandes entreprises. "
 ENG_60s_Establish_The_National_Income_Commission:0 "Créer la Commission nationale du revenu"
 ENG_60s_Establish_The_National_Income_Commission_desc:0 "Le gel des salaires a aidé, mais nous devons éventuellement les débloquer, et nous devons donc créer une commission chargée de s'occuper des salaires et des prix à l'avenir, afin de maintenir l'inflation sous contrôle. "
 ENG_60s_Labour_Victory:0 "Victoire du travail"
 ENG_60s_Labour_Victory_desc:0 "Les travaillistes ont triomphé lors des dernières élections. Nous pouvons désormais abandonner la politique conservatrice et introduire une politique permettant à la Grande-Bretagne d'entrer dans l'avenir, dans un avenir plus libéral conçu pour aider l'homme ordinaire et non les riches. "
 ENG_60s_Decrease_Public_Censorship:0 "Diminuer la censure publique"
 ENG_60s_Decrease_Public_Censorship_desc:0 "Nous ne sommes pas une dictature, la censure d'État est quelque chose à laquelle nous nous attendons en Union soviétique et non en Grande-Bretagne. Il est temps de limiter la censure publique afin de créer une nation plus démocratique. "
 ENG_60s_Liberalize_Abortion_Laws:0 "Libéraliser les lois sur l'avortement"
 ENG_60s_Liberalize_Abortion_Laws_desc:0 "Des centaines de femmes sont obligées de consulter des médecins douteux pour se faire avorter, nous en avons assez, il est temps de rendre l'avortement plus facilement accessible pour arrêter le nombre de femmes qui meurent des suites d'un avortement, cela augmentera sûrement notre popularité parmi la population. "
 ENG_60s_Labour_Victory_66:0 "Victoire du travail"
 ENG_60s_Labour_Victory_66_desc:0 "Maintenant que nous avons été élus, nous devons nous mettre au travail pour créer la Grande-Bretagne que le peuple veut et pour laquelle le peuple a voté. "
 ENG_60s_Increase_Agricultural_Subsidies:0 "Augmenter les subventions agricoles"
 ENG_60s_Increase_Agricultural_Subsidies_desc:0 "Nos agriculteurs nourrissent notre population et nous devons leur donner de l'argent pour moderniser et augmenter les rendements des cultures, après tout nous ne voudrions pas manquer d'argent."
 ENG_60s_Labour_Victory_70:0 "Victoire du travail"
 ENG_60s_Labour_Victory_70_desc:0 "Nous avons encore gagné une autre élection, et nous devons maintenant nous assurer que la volonté du peuple est mise en oeuvre, que nous avons été élus par le peuple et bon sang, nous allons les écouter maintenant et dans les 5 prochaines années. "
 ENG_60s_Fight_Racial_Inequality:0 "Combattre les inégalités raciales"
 ENG_60s_Fight_Racial_Inequality_desc:0 "À mesure que le temps passe, notre attitude devrait évoluer également, le monde devient de plus en plus libéral et nous devons être capables de suivre le rythme. La quantité de mélatonine dans votre peau ne change ni l'intelligence ni le comportement et il est temps que nous commencions à traiter les autres races sur un pied d'égalité, pour une Grande-Bretagne plus unie. "
 ENG_60s_Abolish_the_Death_Penalty:0 "Abolir la peine de mort"
 ENG_60s_Abolish_the_Death_Penalty_desc:0 "Nous ne devons plus rester les bras croisés et permettre que la peine de mort continue ; il a été prouvé qu'elle n'a aucun effet dissuasif et qu'elle est tout simplement barbare, n'ayant pas sa place dans un pays occidental moderne. Il est temps d'abolir la peine de mort une fois pour toutes !"
 ENG_60s_Decriminalize_Homosexuality:0 "Décriminaliser l'homosexualité"
 ENG_60s_Decriminalize_Homosexuality_desc:0 "Au cours des années précédentes, de nombreuses personnes ont été découvertes comme homosexuelles, mais les gens ne devraient pas être arrêtés pour avoir aimé quelqu'un du même sexe, nous devons immédiatement décriminaliser l'homosexualité, créer un pays plus libre et plus libéral, ainsi que garantir le vote des homosexuels. "
 ENG_60s_Return_to_Nationalizations:0 "Retour aux nationalisations"
 ENG_60s_Return_to_Nationalizations_desc:0 "Au cours des années précédentes, sous la direction des conservateurs, de plus en plus de secteurs de l'économie sont devenus privés, mais cela s'est révélé inefficace pour aider la population et l'économie. Nous devons nationaliser à nouveau l'économie, après tout, le gouvernement sait toujours mieux. "
 ENG_60s_Investigate_Railway_Reform:0 "Enquêter sur la réforme ferroviaire"
 ENG_60s_Investigate_Railway_Reform_desc:0 "Alors que la crise s'aggrave, il faut s'attaquer aux dépenses publiques. Un moyen possible de réduire les dépenses est le système ferroviaire. Nous devons étudier s'il existe des domaines de réforme possibles pour réduire les coûts. "
 ENG_60s_The_Beeching_Axe:0 "La hache en hêtre"
 ENG_60s_The_Beeching_Axe_desc:0 "Il est clair que nous ne pouvons plus nous permettre notre système actuel, des réductions doivent être faites même au détriment des emplois et des infrastructures, et de nombreuses gares et des kilomètres de lignes devront être réduits, même si ceux qui travaillent sur ces gares ne seront pas contents, c'est un sacrifice nécessaire pour l'économie. "
 ENG_60s_Reduce_Inflation:0 "Réduire l'inflation"
 ENG_60s_Reduce_Inflation_desc:0 "Grâce au contrôle des dépenses publiques et à la contribution du NIC au maintien des salaires et des prix sous contrôle, nous sommes désormais en bonne position pour commencer à lutter contre l'hyperinflation. Ces efforts pour lutter contre l'inflation prendront beaucoup de temps et pourraient rendre la vie des gens inconfortable, mais nous n'en bénéficierons qu'à long terme."
 ENG_60s_Increase_Education_Funding:0 "Augmenter le financement de l'éducation"
 ENG_60s_Increase_Education_Funding_desc:0 "L'éducation est importante : avec des personnes instruites, nous obtenons des travailleurs qualifiés et avec une main-d'oeuvre plus variée, notre économie se développe. Non seulement cela améliorera la vie des gens, mais cela augmentera nos revenus, et n'est-ce pas toujours une bonne chose."
 ENG_60s_Encourage_Economic_Planning:0 "Encourager la planification économique"
 ENG_60s_Encourage_Economic_Planning_desc:0 "Pour une économie prospère, nous ne pouvons pas avoir le chaos, nous devons donc tout planifier soigneusement, de peur de perdre le contrôle et de sombrer dans le chaos. Avec une planification minutieuse, nous serons en mesure de détourner plus facilement les ressources vers les domaines nécessaires et de permettre à l'économie de prospérer. "
 ENG_60s_Increase_Welfare_Benefits:0 "Augmenter les prestations sociales"
 ENG_60s_Increase_Welfare_Benefits_desc:0 "Tout le monde n'a pas la même chance dans la vie, et ceux qui n'ont pas de chance ont besoin de notre aide, nous devons augmenter les allocations sociales pour aider les gens à se remettre sur pied et à retourner au travail ! Et cela contribuera à sécuriser leurs votes à l'avenir. "
 ENG_60s_Urban_Renewal_Program:0 "Programme de rénovation urbaine"
 ENG_60s_Urban_Renewal_Program_desc:0 "Les zones urbaines sont devenues obsolètes et inefficaces, c'est pourquoi nous devons lancer un nouveau programme pour les moderniser et augmenter non seulement le niveau de vie, mais aussi rendre le processus de construction de nouveaux domaines urbains beaucoup plus facile. "
 ENG_60s_Increase_Access_to_Healthcare:0 "Augmenter l'accès aux soins de santé"
 ENG_60s_Increase_Access_to_Healthcare_desc:0 "Les soins de santé sont une partie importante du Manifeste du Travail, mais ils ne servent à rien si les gens ne peuvent pas les utiliser. Nous devons donc investir pour les rendre plus accessibles et accroître en même temps notre popularité et l'efficacité du système de santé. "
 ENG_60s_Industrial_Reorganization:0 "Réorganisation industrielle"
 ENG_60s_Industrial_Reorganization_desc:0 "Le moment est venu de redoubler d'efforts pour accroître l'efficacité et la productivité de notre industrie, nous devons réorganiser notre industrie afin de lui donner les outils dont elle a besoin pour suivre le rythme du reste du monde. "
 ENG_60s_Subsidize_Scottish_Industry:0 "Subventionner l'industrie écossaise"
 ENG_60s_Subsidize_Scottish_Industry_desc:0 "Il y a tout un marché en Écosse sans surveillance, pour accroître la croissance économique, nous devons subventionner l'industrie écossaise pour encourager sa croissance, en augmentant non seulement la production dans la région, mais aussi les emplois. "
 ENG_Continue_Heavy_Rail_Spending:0 "Poursuivre les dépenses ferroviaires lourdes"
 ENG_Continue_Heavy_Rail_Spending_desc:0 "Même si nous avons trouvé des moyens de réformer le service ferroviaire, il reste un élément vital de notre infrastructure et nous devons donc continuer à dépenser massivement pour l'entretenir. Si nous le faisons, notre infrastructure n'en bénéficiera que et, espérons-le, notre économie avec elle. "
 ENG_60s_Establish_The_EFTA:0 "Créer l'AELE"
 ENG_60s_Establish_The_EFTA_desc:0 "Les querelles européennes nous ont coûté notre position dans le monde, les guerres mondiales ont permis aux Américains et aux Soviétiques de devenir des puissances mondiales. Cela ne peut pas se reproduire, l'Europe doit devenir plus étroitement liée ou risquer une autre guerre. L'établissement du libre-échange non seulement contribue à atteindre cet objectif, mais nous garantit également de meilleurs accords commerciaux dans le processus, un gagnant-gagnant."
 ENG_60s_The_Night_of_Long_Knives:0 "La nuit des longs couteaux"
 ENG_60s_The_Night_of_Long_Knives_desc:0 "Le gouvernement actuel est devenu vieux et obsolète, et cela commence à se voir dans les sondages ! Nous devons immédiatement remanier notre cabinet pour mieux l'adapter à la conjoncture actuelle et préparer le gouvernement à mieux relever les défis à venir. "
 ENG_60s_Increase_Government_Support:0 "Augmenter le soutien du gouvernement"
 ENG_60s_Increase_Government_Support_desc:0 "Maintenant que nous avons un nouveau Cabinet plus frais, nous pouvons commencer à travailler à accroître le soutien du gouvernement, les élections approchent et nous avons besoin d'une base solide avec laquelle nous donnerons plus de légitimité pour mettre en oeuvre notre politique. "
 ENG_60s_Conservative_Victory:0 "Victoire conservatrice"
 ENG_60s_Conservative_Victory_desc:0 "Nous l'avons fait ! Des années de leadership conservateur réussi nous ont permis de remporter une nouvelle élection. Il nous incombe de maintenir l'économie en marche et de faire de l'avenir de la Grande-Bretagne un avenir prospère."
 ENG_60s_Reduce_Labour_Union_Influence:0 "Réduire l'influence des syndicats"
 ENG_60s_Reduce_Labour_Union_Influence_desc:0 "Les syndicats ont trop de pouvoir, les travailleurs passent plus de temps à faire grève qu'à travailler et cela nuit aux affaires et à l'économie. Nous devons donc réduire leur pouvoir et remettre les choses sur les rails. Après tout, je suis sûr que les entreprises prendront très bien soin de leurs travailleurs."
 ENG_60s_Encourage_Economic_Efficiency:0 "Encourager l'efficacité économique"
 ENG_60s_Encourage_Economic_Efficiency_desc:0 "Avec une économie efficace, nous aurons moins de demande de ressources et de besoins d'investissement, réduisant ainsi les dépenses publiques. Si nous voulons une meilleure économie, nous en aurons besoin d'une plus efficace. "
 ENG_60s_Increase_Commonwealth_Technical_Cooperation:0 "Accroître la coopération technique du Commonwealth"
 ENG_60s_Increase_Commonwealth_Technical_Cooperation_desc:0 "Notre Commonwealth compte de nombreux grands esprits, c'est pourquoi nous devrions les unir vers un objectif commun de progression technologique, augmentant ainsi notre propre vitesse de recherche et permettant de suivre plus facilement le rythme d'un monde en constante évolution."
 ENG_60s_Encourage_Home_Modernization:0 "Encourager la modernisation de la maison"
 ENG_60s_Encourage_Home_Modernization_desc:0 "Nos maisons sont obsolètes, nous devons nous assurer qu'elles sont mises à niveau, consommant ainsi moins de ressources et rendant les gens plus à l'aise, après tout, si les gens sont heureux, alors bien sûr, ils voteront pour nous. "
 ENG_60s_Endorse_Slum_Clearances:0 "Approuver l'élimination des bidonvilles"
 ENG_60s_Endorse_Slum_Clearances_desc:0 "Une nation aussi petite que la nôtre a besoin de plus d'espace, et quel meilleur endroit pour commencer que ces bidonvilles dégoûtants qui nous donnent une mauvaise image. Nous les nettoyons, puis nos villes ont une meilleure apparence et ont plus de place pour l'expansion, génial !"
 ENG_60s_The_Vassall_Tribunal:0 "Le tribunal Vassall"
 ENG_60s_The_Vassall_Tribunal_desc:0 "À la suite de la révélation du traître de Vassal, de très nombreuses personnes critiquent notre sécurité, après tout, comment un fonctionnaire aurait-il pu être autorisé à contacter les Soviétiques en premier lieu ! Nous avons été contraints de tenir ce Tribunal afin d'enquêter plus en détail sur ces allégations"
 ENG_60s_Deal_with_The_Profumo_Affair:0 "Gérer l'affaire Profumo"
 ENG_60s_Deal_with_The_Profumo_Affair_desc:0 "Il a été révélé que John Profumo avait une liaison avec le mannequin Christine Keeler, 19 ans. Les retombées politiques de ce scandale ont été un cauchemar et ont vu notre popularité chuter considérablement. Nous devons agir pour essayer de contenir cela avant qu'il ne devienne incontrôlable. "
 ENG_60s_Rally_the_Conservatives:0 "Rallier les conservateurs"
 ENG_60s_Rally_the_Conservatives_desc:0 "Suite aux récents scandales et à plusieurs efforts visant à accroître notre popularité, nous pouvons désormais rallier le soutien des conservateurs à travers le pays dans le but de remporter les prochaines élections, ce qui entraînera sûrement une augmentation du soutien à notre parti et, par extension, une victoire électorale."
 ENG_60s_Conservative_Victory_66:0 "Victoire conservatrice"
 ENG_60s_Conservative_Victory_66_desc:0 "Deux ans seulement après les dernières élections, les conservateurs ont triomphé et il nous incombe une fois de plus de conduire la Grande-Bretagne vers un avenir prospère. "
 ENG_60s_Reform_the_Welfare_State:0 "Réformer l'État-providence"
 ENG_60s_Reform_the_Welfare_State_desc:0 "Le système de protection sociale actuel est beaucoup trop coûteux, il doit être réformé afin que nous puissions réduire les coûts et les dépenses publiques, puis relancer l'économie, même si quelques citoyens ont des difficultés par la suite. "
 ENG_60s_Conservative_Victory_70:0 "Victoire conservatrice"
 ENG_60s_Conservative_Victory_70_desc:0 "Ah, nous avons gagné la confiance du peuple britannique, et il nous incombe de rendre le pays et l'économie meilleurs pour eux. En avant vers l'avenir, sous la direction des Conservateurs. "
 ENG_60s_Cut_Education_Funding:0 "Réduire le financement de l'éducation"
 ENG_60s_Cut_Education_Funding_desc:0 "Une autre étape vers notre quête sans fin de croissance économique consiste à limiter les dépenses publiques, et il faut reconnaître que le système éducatif est l'une de nos plus grandes ponctions budgétaires. C'est pourquoi nous devons commencer à réduire le financement, même si cela signifie que quelques enfants ne peuvent pas aller à l'école, de toute façon, ils n'aiment pas y aller. "
 ENG_60s_Raise_Compulsory_School_Age_to_16:0 "Augmenter l'âge de la scolarité obligatoire à 16 ans"
 ENG_60s_Raise_Compulsory_School_Age_to_16_desc:0 "Nous avons besoin de travailleurs plus qualifiés, et la meilleure façon d'y parvenir est de forcer les gens à aller à l'école. Si nous maintenons les gens à l'école plus longtemps, ils apprendront forcément davantage et, par conséquent, acquerront davantage de compétences qu'ils pourront utiliser sur leur lieu de travail. "
 ENG_60s_Retain_Nuclear_Autonomy:0 "Conserver l'autonomie nucléaire"
 ENG_60s_Retain_Nuclear_Autonomy_desc:0 "Nous avons collaboré avec les États-Unis au développement de l'arme nucléaire, et pourtant ils l'ont gardée pour eux. L'arme nucléaire est ce qui nous permet de préserver notre indépendance à l'époque moderne, et nous devons veiller à ce qu'aucune autre nation ne puisse la mettre en péril et investir dans notre propre recherche nucléaire avec notre propre argent. "
 ENG_60s_Increase_Investment_in_Northern_Ireland:0 "Augmenter les investissements en Irlande du Nord"
 ENG_60s_Increase_Investment_in_Northern_Ireland_desc:0 "Nous avons lutté avec acharnement pour contrôler l'Irlande du Nord, et nous n'avons pas réalisé qu'il s'agissait d'une région privilégiée pour les investissements. Si nous devions investir dans la région, non seulement cela nous rendrait plus populaires aux yeux des gens, mais cela augmenterait nos propres revenus, une excellente idée !"
 ENG_60s_Crackdown_on_Crime:0 "Répression du crime"
 ENG_60s_Crackdown_on_Crime_desc:0 "La police a besoin de plus de pouvoir pour assurer la sécurité de la population, la criminalité a augmenté trop rapidement et nous devons la ramener sous contrôle, nous apporterons la paix, la liberté et la sécurité à notre nouvel empire. "
 ENG_60s_The_Industrial_Relations_Act:0 "La loi sur les relations industrielles"
 ENG_60s_The_Industrial_Relations_Act_desc:0 "Si nous voulons une meilleure économie, nous devons laisser les experts s'en charger. Après tout, qui d'autre sait mieux gérer l'industrie que les entreprises industrielles, nous devons améliorer nos relations avec elles afin d'augmenter leur efficacité, même au prix de quelques droits des travailleurs ici et là."
 ENG_60s_The_Royal_Navy:0 "La Marine royale"
 ENG_60s_The_Royal_Navy_desc:0 "La Grande-Bretagne était autrefois louée pour sa force navale, mais nous ne contrôlons plus les vagues, les Américains ont fait de nous la principale puissance navale, mais nous ne pouvons pas permettre que cela se produise, nous devons faire des efforts pour moderniser notre marine et retrouver notre place de première puissance navale. "
 ENG_60s_County_Class_Destroyers:0 "Destroyers de classe comté"
 ENG_60s_County_Class_Destroyers_desc:0 "À mesure que les sous-marins gagnent en importance, nous devons disposer d'un moyen efficace pour les contrer. Nous devons donc investir dans la modernisation de nos destroyers pour contrer la menace croissante des sous-marins. "
 ENG_60s_Resolution_Class_Submarines:0 "Sous-marins de classe Résolution"
 ENG_60s_Resolution_Class_Submarines_desc:0 "Le sous-marin est le nouveau cuirassé, nous devons investir dans cette nouvelle méthode de guerre afin de l'utiliser contre nos ennemis, avant qu'ils ne l'utilisent contre nous. "
 ENG_60s_Fund_the_CVA_01_Carriers:0 "Financer les transporteurs CVA 01"
 ENG_60s_Fund_the_CVA_01_Carriers_desc:0 "Les porte-avions sont un autre navire devenu essentiel à la guerre navale, mais nos porte-avions sont vieux et ne sont pas adaptés à la guerre moderne. Nous devons donc investir de l'argent dans un nouveau modèle de transporteur plus moderne, capable de rivaliser avec n'importe quel transporteur américain ou soviétique."
 ENG_60s_Refit_Carriers:0 "Remonter les transporteurs"
 ENG_60s_Refit_Carriers_desc:0 "Pourquoi payer pour de nouveaux transporteurs, alors que nous pouvons rénover nos transporteurs actuels. Tout ce que nous avons à faire est de prendre nos transporteurs actuels et d'insérer de nouvelles pièces pour les mettre à niveau, ils ne sont peut-être pas les meilleurs mais c'est bon marché."
 ENG_60s_Invest_in_Nuclear_Submarines:0 "Investissez dans les sous-marins nucléaires"
 ENG_60s_Invest_in_Nuclear_Submarines_desc:0 "Même si nos investissements actuels dans les sous-marins peuvent les mettre à niveau, leurs batteries limitent la durée pendant laquelle ils peuvent rester sous l'eau. Cependant, si nous investissons dans l'énergie nucléaire nouvellement découverte, nous pouvons alors prolonger leur durée de fonctionnement, et donc leur efficacité. "
 ENG_60s_The_British_Army:0 "L'armée britannique"
 ENG_60s_The_British_Army_desc:0 "Nous avons toujours favorisé une armée petite et d'élite, et même si l'armée n'a pas grandi en taille depuis la Seconde Guerre mondiale, elle a pris du retard par rapport aux autres puissances. L'armée est la façon dont nous prenons et détenons des terres, nous devons investir pour la rendre à la hauteur de nos rivaux. "
 ENG_60s_Suspend_National_Service:0 "Suspendre le service national"
 ENG_60s_Suspend_National_Service_desc:0 "Même si les tensions sont fortes, nous avons toujours favorisé une armée plus petite, cela lui permet d'être plus élitiste, c'est pourquoi nous devons suspendre l'exigence du service national, non seulement en augmentant notre popularité auprès du peuple mais en lui permettant de retourner au travail, mais en le rendant plus disposé à soutenir les guerres, car il ne court aucun risque."
 ENG_60s_L2A1_Assault_Rifle:0 "Fusil d'assaut L2A1"
 ENG_60s_L2A1_Assault_Rifle_desc:0 "Une armée forte a besoin d'armes puissantes, nous devons investir dans des armes plus modernes pour équiper nos troupes et leur donner un avantage au combat."
 ENG_60s_Develop_the_Chieftain:0 "Développer le chef"
 ENG_60s_Develop_the_Chieftain_desc:0 "La Seconde Guerre mondiale a montré à tout le monde l'efficacité de la blitzkrieg et des unités blindées. Nous devons nous assurer que nos unités blindées peuvent suivre le rythme de nos rivaux afin de pouvoir utiliser cette tactique éprouvée et efficace. "
 ENG_60s_Operation_Banner:0 "Bannière d'opération"
 ENG_60s_Operation_Banner_desc:0 "Les paramilitaires de l'unification ont intensifié leurs opérations, nous devons lancer l'opération Banner et reprendre le contrôle de la situation. "
 ENG_60s_The_Royal_Airforce:0 "La Royal Air Force"
 ENG_60s_The_Royal_Airforce_desc:0 "Les forces aériennes sont devenues un élément clé des opérations militaires ces derniers temps, et la RAF ne peut pas être laissée pour compte ; nous devons rattraper nos rivaux avant qu'ils ne nous laissent derrière. "
 ENG_60s_Invest_in_VTOL:0 "Investissez dans le VTOL"
 ENG_60s_Invest_in_VTOL_desc:0 "Nous avons besoin de chasseurs plus modernes capables de protéger nos forces depuis le ciel, nous devons investir dans les nouveaux chasseurs VTOL pour nous permettre de rattraper nos ennemis potentiels et propulser la RAF dans la meilleure force aérienne du monde."
 ENG_60s_Import_American_Phantoms:0 "Importer des fantômes américains"
 ENG_60s_Import_American_Phantoms_desc:0 "Même si nous n'aimons peut-être pas l'admettre, l'armée de l'air américaine est supérieure à la nôtre, nous gagnerions à acheter certains de leurs appareils afin de renforcer nos propres forces, je suis sûr qu'ils en ont en réserve, n'est-ce pas ?"
 ENG_60s_Harrier_Jump_Jets:0 "Jets de saut Harrier"
 ENG_60s_Harrier_Jump_Jets_desc:0 "Nous devons investir davantage dans notre force aérienne, même si les chasseurs VTOL constituent un pas dans la bonne direction, nous ne pouvons pas nous arrêter là, ces nouveaux chasseurs à réaction augmenteront considérablement nos capacités en combat aérien et autres opérations au sol. "
 ENG_60s_The_Blackburn_Buccaneer:0 "Le boucanier de Blackburn"
 ENG_60s_The_Blackburn_Buccaneer_desc:0 "Même si nous disposons d'avions à réaction pour nos forces terrestres, nous avons besoin d'avions dédiés aux opérations navales. Les nouveaux Buccaneers augmenteront donc considérablement les capacités de notre marine. "
 ENG_60s_Publicize_Welfare_Programs:0 "Faire connaître les programmes de protection sociale"
 ENG_60s_Publicize_Welfare_Programs_desc:0 "Nous avons augmenté les dépenses sociales, mais nous devons nous assurer que les gens savent ce qui leur est proposé, et nous devons donc dépenser de l'argent dans une campagne visant à mettre en valeur les programmes sociaux et leurs avantages, tout en augmentant notre réputation publique dans le processus. "
 ENG_60s_Ensure_Dockworker_Job_Security:0 "Assurer la sécurité de l'emploi des dockers"
 ENG_60s_Ensure_Dockworker_Job_Security_desc:0 "Personne ne devrait avoir à vivre avec la menace de l'insécurité de l'emploi, et cela entraîne une perte de productivité s'il passe plus de temps à s'inquiéter qu'à travailler. Par conséquent, nous devons garantir que les dockers peuvent être en sécurité en sachant que leur travail est sécurisé, ce qui les rend plus susceptibles de voter travailliste et d'être plus productifs."
 ENG_60s_Establish_Open_Universities:0 "Créer des universités ouvertes"
 ENG_60s_Establish_Open_Universities_desc:0 "L'université coûte trop cher et la plupart des gens ne peuvent pas se le permettre. Nous devons donc le rendre gratuit pour les masses. Non seulement cela nous rendra plus populaires, mais cela augmentera le niveau d'éducation global de la majorité de la population, et lorsque les gens seront plus instruits, tous les secteurs de l'économie se développeront."
 ENG_60s_Increase_Early_Childhood_Education:0 "Augmenter l'éducation de la petite enfance"
 ENG_60s_Increase_Early_Childhood_Education_desc:0 "Les enfants doivent apprendre dès leur plus jeune âge pour leur donner plus de temps pour développer des compétences clés et devenir plus intelligents, avec une main-d'oeuvre plus instruite, la productivité dans les emplois de col blanc augmentera et l'économie en bénéficiera sûrement. "
 ENG_60s_Reduce_the_Voting_Age_to_18:0 "Réduire l'âge de vote à 18 ans"
 ENG_60s_Reduce_the_Voting_Age_to_18_desc:0 "Ce n'est un secret pour personne que les jeunes sont plus libéraux et donc plus susceptibles de voter travailliste. Par conséquent, en abaissant l'âge de voter, nous pouvons nous assurer d'obtenir nous-mêmes plus de voix et limiter l'influence des générations plus âgées. "
 ENG_60s_Increase_Infrastructure_Spending:0 "Augmenter les dépenses d'infrastructure"
 ENG_60s_Increase_Infrastructure_Spending_desc:0 " À mesure que notre pays continue de croître, nos infrastructures doivent en faire autant, si elles veulent répondre aux demandes de la population et de l'économie. Pour accroître les infrastructures, nous devons investir dans de meilleures méthodes de construction, sinon nous risquons de voir notre économie faiblir. "
 ENG_60s_Increase_Womens_Rights:0 "Augmenter les droits des femmes"
 ENG_60s_Increase_Womens_Rights_desc:0 "Bien qu'elles aient obtenu le droit de vote au début du XXe siècle, les femmes sont toujours considérées comme inférieures. Il nous appartient de changer cela. Ensemble, nous devons faire des efforts pour accroître l'image des femmes comme étant égales aux hommes. Après tout, il existe de nombreux esprits et travailleurs brillants parmi la population féminine que nous serions insensés d'ignorer."
 ENG_60s_Expand_English_New_Towns:0 "Développer les nouvelles villes anglaises"
 ENG_60s_Expand_English_New_Towns_desc:0 "À mesure que la population augmente, la nécessité de tous les loger augmente également, mais nous ne pouvons pas non plus nous attendre à ce que les gens vivent dans la misère. C'est pourquoi nous devons lancer une campagne visant à étendre les villes nouvelles anglaises, des villes nouvelles pour de nouvelles personnes. "
 ENG_60s_Enviromental_Regulations:0 "Règlements environnementaux"
 ENG_60s_Enviromental_Regulations_desc:0 "Nous vivons sur cette planète et, à notre connaissance, il n'existe aucune autre planète propice à la vie. Nous devons donc protéger la Terre et déployer des efforts pour mettre fin à la pollution. Espérons que ces nouvelles réglementations constituent un pas dans la bonne direction. "
 ENG_60s_The_Britain_We_Want:0 "La Grande-Bretagne que nous voulons"
 ENG_60s_The_Britain_We_Want_desc:0 "Cela a pris plusieurs mois de travail acharné, mais nous avons réussi à créer une Grande-Bretagne plus libérale, une Grande-Bretagne meilleure où les gens peuvent être plus heureux, la qualité de vie s'améliore et une société plus égalitaire a été créée, l'avenir est brillant pour la Grande-Bretagne et les Britanniques."
 ENG_60s_Begin_Negotiations_with_the_EEC:0 "Entamer les négociations avec la CEE"
 ENG_60s_Begin_Negotiations_with_the_EEC_desc:0 "Si nous voulons améliorer l'économie, nous devons coopérer avec nos voisins européens, et non contre eux. Nous devons entamer immédiatement des négociations avec la CEE afin d'accroître notre coopération et de créer de meilleures relations de travail où tout le monde, sauf nous, peut prospérer."
 ENG_60s_Campaign_Against_Euroskepticism:0 "Campagne contre l'euroscepticisme"
 ENG_60s_Campaign_Against_Euroskepticism_desc:0 " Au cours des années précédentes, nous avons préconisé des liens plus étroits avec les nations européennes, mais ces maudits eurosceptiques sapent notre agenda. Nous devons intensifier nos campagnes pour encourager les europhiles et faire en sorte que la collaboration avec l'Europe apparaisse comme une perspective plus prometteuse. "
 ENG_60s_Combat_Unemployment:0 "Combattre le chômage"
 ENG_60s_Combat_Unemployment_desc:0 "Le chômage est le fléau de tout gouvernement, mais il s'aggrave, nous devons prendre des mesures pour le combattre maintenant avant qu'il ne soit trop tard ! Ou bien nous risquons de prendre du retard sur le plan économique et cela, en soi, mènera au désastre. "
 ENG_60s_Distance_Relations_From_America:0 "Relations à distance depuis l'Amérique"
 ENG_60s_Distance_Relations_From_America_desc:0 "Même si la Grande-Bretagne et les Yankees sont de bons amis depuis la Seconde Guerre mondiale, il est devenu clair qu'ils veulent simplement nous utiliser comme une marionnette. Nous devons nous éloigner d'eux pour conserver notre propre indépendance, sous peine de devenir des esclaves américains. "
 ENG_60s_Strengthen_Relations_with_the_PRC:0 "Renforcer les relations avec la RPC"
 ENG_60s_Strengthen_Relations_with_the_PRC_desc:0 "Yanno, peut-être que la Chine n'est pas si mauvaise après tout, maintenant nous prévoyons de nous éloigner des Américains, nous avons besoin de trouver des alliés, et quelle meilleure opportunité que la Chine, en supposant qu'ils puissent mettre toute la guerre de l'opium derrière eux bien sûr"
 ENG_60s_The_Local_Government_Act:0 "La loi sur le gouvernement local"
 ENG_60s_The_Local_Government_Act_desc:0 "Pour avoir un système de gouvernement plus efficace et pour que les gens se sentent moins opprimés, nous devons accroître le pouvoir des gouvernements locaux. Après tout, ils peuvent gérer plus efficacement les zones locales plutôt que d'essayer de tout microgérer, et cela donne aux gens un certain sentiment de contrôle. "
 ENG_60s_Combat_Rising_Prices:0 "Combattre la hausse des prix"
 ENG_60s_Combat_Rising_Prices_desc:0 "Alors que les prix augmentent, les gens ne peuvent plus se permettre les produits de base, nous devons agir rapidement pour contrôler ces prix avant qu'ils ne deviennent incontrôlables et que nous soyons confrontés à une hyperinflation."
 ENG_60s_Utilize_British_Technical_Skills:0 "Utiliser les compétences techniques britanniques"
 ENG_60s_Utilize_British_Technical_Skills_desc:0 "Le peuple britannique est techniquement doué, et pourtant nous n'exploitons pas correctement - je veux dire, utilisons ce secteur de la main-d'oeuvre, avec un petit investissement, nous pourrions facilement exploiter cette lacune du marché. "
 ENG_60s_Reform_the_Unions:0 "Réformer les syndicats"
 ENG_60s_Reform_the_Unions_desc:0 "Les syndicats constituent un problème, mais si nous devions les réformer, nous pourrions accroître l'efficacité de notre main-d'oeuvre, et donc relancer l'économie, transformant ainsi un ennemi en avantage. "
 ENG_60s_Increase_European_Cooperation:0 "Accroître la coopération européenne"
 ENG_60s_Increase_European_Cooperation_desc:0 "Nous ne pouvons pas nous isoler en tant que nation, nous devons travailler avec nos partenaires européens et non contre eux, nous devons améliorer nos relations avec eux afin de pouvoir négocier plus facilement les opportunités commerciales et la défense mutuelle, car si nous nous isolons, nous nous exposons à une attaque communiste."
 ENG_60s_Reuce_Government_Waste:0 "Réduire les déchets gouvernementaux"
 ENG_60s_Reuce_Government_Waste_desc:0 "Notre quête pour réduire les dépenses publiques se poursuit. En tant que gouvernement, nous gaspillons trop d'argent et nous devons le réduire si nous voulons augmenter le budget et résoudre les problèmes économiques de la Grande-Bretagne. Cela nous donnera également une meilleure image en tant que gouvernement. "
 ENG_60s_Reduce_Immigration_Rates:0 "Réduire les taux d'immigration"
 ENG_60s_Reduce_Immigration_Rates_desc:0 "Nous ne pouvons pas permettre aux étrangers d'accepter des emplois britanniques ! Si notre économie veut se remettre sur les rails, nous avons besoin que les Britanniques travaillent dans l'industrie britannique, nous devons immédiatement arrêter l'afflux d'immigrants avant qu'il ne soit trop tard."
 
 
