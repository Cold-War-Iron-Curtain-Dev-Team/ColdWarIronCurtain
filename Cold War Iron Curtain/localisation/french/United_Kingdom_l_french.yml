 ############EVENTS FOR GREAT BRITIAN############
 
 eng.1.t:0 "L'unification de l'Autriche"
 eng.1.d:0 "Le peuple autrichien veut redevenir un pays libre et indépendant. Il pourrait servir d'État tampon entre l'Est et l'Ouest. Est-ce qu'on permet cela ?"
 eng.1.a:0 "Oui bien sûr!"
 eng.1.b:0 "Non, nous devons faire quelque chose de différent avec nos territoires autrichiens."
 eng.2.t:0 "Remplacer le RoC par le PRC"
 eng.2.d:0 "La République populaire de Chine souhaite être reconnue comme le seul gouvernement chinois à l'ONU. D'un côté, la RPC contrôle le continent et les affaires chinoises les plus importantes, mais de l'autre, devrions-nous laisser les communistes occuper un autre siège au Conseil de sécurité de l'ONU ?"
 eng.2.a:0 "Votez pour donner à la RPC les sièges du ROC."
 eng.2.b:0 "Non, les communistes resteront dehors."
 eng.3.t:0 "Fondation du NHS"
 eng.3.d:0 "Le NHS est fondé. Cette nouvelle organisation universelle de santé repose sur trois principes : qu'elle réponde aux besoins de chacun, qu'elle soit gratuite au point de prestation et qu'elle soit basée sur les besoins cliniques et non sur la capacité de payer."
 eng.3.a:0 "C'est un jour mémorable pour la Grande-Bretagne !"
 eng.4.t:0 "Les socialistes assassinent la famille royale !"
 eng.4.d:0 "Hier soir, un groupe d'extrémistes socialistes a fait irruption dans le palais de Buckingham et a assassiné les membres de la famille royale qui s'y trouvaient à ce moment-là. La rumeur dit que les membres de la famille royale restants ont été évacués vers le Canada jusqu'à ce que les troubles s'apaisent."
 eng.4.a:0 "Ils feraient mieux de courir."
 eng.5.t:0 "L'Ouganda demande l'indépendance"
 eng.5.d:0 "L'Ouganda veut son indépendance à notre égard. Elles constituent l'une des principales colonies britanniques, mais elles se trouvent à l'intérieur des terres et loin de notre capitale."
 eng.5.a:0 "Oui!"
 eng.5.b:0 "Non, ils ont toujours besoin de notre protection."
 eng.6.t:0 "Le Nigeria demande l'indépendance"
 eng.6.d:0 "Le Nigeria veut l'indépendance de notre domination. Ils produisent beaucoup de pétrole et de caoutchouc, mais nos entreprises sont prêtes à négocier avec un État nigérian potentiellement indépendant. Devons-nous les laisser partir ?"
 eng.6.a:0 "Oui!"
 eng.6.b:0 "Non, ils ont toujours besoin de notre protection."
 eng.7.t:0 "Le Kenya demande l'indépendance"
 eng.7.d:0 "Le Kenya veut son indépendance face à l'échec de nos politiques coloniales qui ont conduit à des situations telles que l'urgence au Kenya. Ils se trouvent sur la côte ouest-africaine et constituent une artère majeure vers l'Inde. Faut-il libérer la zone rebelle ?"
 eng.7.a:0 "Oui!"
 eng.7.b:0 "Non, ils ont toujours besoin de notre protection."
 eng.8.t:0 "Le Soudan demande l'indépendance"
 eng.8.d:0 "Le Soudan veut l'indépendance de notre domination. Bien qu'il s'agisse d'un condominium anglo-égyptien, nous sommes effectivement les dirigeants du Soudan. Devons-nous le laisser libre unilatéralement ?"
 eng.8.a:0 "Oui!"
 eng.8.b:0 "Non, leur statut par rapport à l'Egypte reste à déterminer."
 eng.1000.d:0 "La reine Elizabeth II est devenue le 39e monarque britannique et la 6e reine couronnée à l'abbaye de Westminster. La cérémonie de couronnement, qui a duré trois heures et a débuté à 11 h 15, a été le premier couronnement télévisé de la BBC. 129 pays étaient présents au couronnement. Plus de 27 millions de Britanniques ont regardé la cérémonie à la télévision et plus de 2 000 journalistes étaient présents à l'extérieur de l'événement. La cérémonie pourrait être considérée comme un symbole de l'unité du Commonwealth britannique : une famille avait fait le voyage depuis l'Australie pour assister au couronnement. Cependant, la reconstruction de la Grande-Bretagne n'est pas encore terminée : de nombreux téléspectateurs devaient encore respecter les rations."
 UKRadar.1.d:0 "La RAF Saxa Vord, également connue sous le nom de Remote Radar Head Saxa Vord, est une nouvelle station radar située sur l'île d'Unst, à l'extrême nord des îles Shetland. Créé initialement en 1945 en tant que partie active de la défense aérienne britannique, RRH Saxa Vord continue de représenter une grande partie du réseau de défense aérienne britannique, étant intégré au système ROTOR et la station étant équipée d'un radar AMES Type 80 en 1955. L'unité de transmissions n° 91 était officiellement stationnée à RRH Saxa Vord en 1957, et Sa Majesté la reine Elizabeth II a visité le site en 1960. Tout le personnel maintient un niveau constant utilisation de la devise latine Praemoneo de periculus, qui signifie que je préviens à l'avance du danger, ce qui s'applique certainement à cette installation unique."
  
 eng.9.t:0 "Le Londonien Schuldenabkommen"
 eng.9.d:0 "Les Alliés occidentaux nous ont invités à discuter d'une restructuration de notre dette envers eux, dans le but de réguler les dettes de l'Allemagne d'avant et d'après-guerre. Les principales caractéristiques du consensus jusqu'à présent sont la réduction de la dette de 16 milliards de marks, l'allongement des calendriers de remboursement et l'inclusion de divers types de dettes, allant des réparations de la Première Guerre mondiale aux fonds de reconstruction d'après-Seconde Guerre mondiale, comme le Plan Marshall."
 eng.9.a:0 "Cela semble raisonnable. Nous signerons le traité."
 
 eng.10.t:0 "Conférence sur la dette à Londres"
 eng.10.d:0 "Aujourd'hui, les représentants de l'Allemagne de l'Ouest et de ses créanciers se sont réunis à Londres pour signer un accord sur la dette, offrant une solution décisive aux dettes impayées de l'Allemagne et ouvrant la voie à sa réintégration économique et politique dans la communauté mondiale. Le traité réduit considérablement le fardeau de la dette de l'Allemagne, réduisant de moitié ses obligations, passant d'un montant initial de 16 milliards de Deutsche Marks à environ 7,5 milliards de Deutsche Marks. La dette restante sera remboursée à des conditions très favorables, notamment des échéanciers de remboursement étendus allant jusqu'à 30 ans et des taux d'intérêt bas. Il est important de noter que les conditions de remboursement sont liées aux performances de l'économie allemande, garantissant ainsi que les remboursements n'entravent pas la reprise en cours."
 eng.10.a:0 "Une étape importante vers la reconstruction allemande."
 
 CWelect.1.t:0 "Élections générales de 1950"
 CWelect.1.d:0 "Les élections de 1945, avec la chute du Reich européen d'Hitler, créèrent de nombreux précédents. Les travaillistes ont obtenu une large majorité de conservateurs alignés sur Churchill et le Parti libéral a été réduit à un simple tiers et cette situation nous a menés jusqu'à ce jour. Mais c'était en 1945, nous sommes maintenant en 1950 et les partis ont changé. Les travaillistes ont nationalisé des industries clés et créé le NHS, tandis que les conservateurs sont toujours dirigés par Winston Churchill. Les bulletins sont comptés et..."
 CWelect.1.a:0 "Clément Attlee s'en est bien sorti jusqu'à présent. Laissez-le nous porter plus loin."
 CWelect.1.b:0 "Aneurin Bevan est le prochain leader travailliste"
 CWelect.2.t:0 "Élections générales anticipées de 1951"
 CWelect.2.d:0 "À la demande du roi, Attlee a convoqué des élections anticipées pour solidifier le gouvernement travailliste, qui détient actuellement une majorité fragile. Cela agira-t-il comme Attlee l'attend et lui donnera-t-il une majorité écrasante, ou cela se retournera-t-il complètement contre lui ?"
 CWelect.2.a:0 "La règle du travail est solide !"
 CWelect.2.b:0 "Churchill et les conservateurs !"
 CWelect.3.t:0 "Élection de 1955 - Anthony Eden contre Clement Attlee"
 CWelect.3.d:0 "Avec une pause de quatre ans entre les élections, la Grande-Bretagne retourne aux urnes quelques semaines seulement après la démission de Churchill. Eden pourra-t-elle remporter les élections ? Ou Clément va-t-il vaincre ?"
 CWelect.3.a:0 "Anthony Eden est charmant, et il nous défendra du communisme !"
 CWelect.3.b:0 "Clément Attlee a l'expérience."
 churchill:0 "Winston Churchill est depuis longtemps une figure de la politique britannique, et c'est une figure célèbre. Sa première apparition a eu lieu lors de la Première Guerre mondiale, où il était Premier Lord de l'Amirauté. Après des années au Parlement et de nombreux postes ministériels, il a été choisi en 1940 pour remplacer Neville Chamberlain au poste de Premier ministre. Son charisme et ses innombrables discours ont permis au peuple britannique de traverser la guerre et tout ce qu'elle a limité. Winston Churchill et sa carrière sont bien plus définis par la Seconde Guerre mondiale qu'autre chose, et c'est peut-être une bonne chose."
 anthony_eden:0 "Anthony Eden a été secrétaire d'État à la guerre pendant le premier mandat de Churchill, puis chef adjoint des conservateurs à l'époque où Churchill était chef de l'opposition et à la paix après la fin de la guerre. C'est un cheval fort."
 Anthony_Eden_flag:0 "Anthony Eden est en fonction"
 CWelect.4.t:0 "Démission d'Anthony Eden"
 CWelect.4.d:0 "Anthony Eden a dirigé avec bonheur son poste de Premier ministre. Cependant, ses échecs lors de la crise de Suez l'ont conduit à démissionner de son poste de Premier ministre. Eisenhower a fait l'éloge de MacMillan, ce qui a conduit la reine à nommer MacMillan Premier ministre."
 CWelect.4.a:0 "Tous les regards se tournent vers l'avenir des conservateurs, désormais entre les mains d'Harold MacMillan."
 Harold_Macmillian:0 "Harold « Supermac » MacMillan est un conservateur britannique. Harold MacMillan a connu son premier succès après l'effondrement du Parti libéral en 1924, qui a ouvert sa circonscription, Stockton-on-Tees, aux élections. Dans le passé, MacMillan a effectué de nombreux voyages en URSS, où il s'est souvent prononcé contre le gouvernement. En février 1940, MacMillan visita la Finlande. À son retour, il fait campagne contre l'inactivité du gouvernement britannique face à l'agression soviétique. Lorsque Churchill accéda au pouvoir en 1940, « Supermac » devint ministre des Approvisionnements. Il a été ministre du Logement, ministre de la Défense, ministre des Affaires étrangères et chancelier de l'Échiquier. Il est désormais arrivé au pouvoir suite à la démission d'Eden."
 ENG_Lab:0 "Parti travailliste"
 ENG_Cons:0 "Le Parti Conservateur et Unioniste"
 Hugh_Gaitskell:0 "Hugh Todd Naylor Gaistkell est professeur d'économie et ancien fonctionnaire en temps de guerre, élu pour la première fois au Parlement en 1945 lors du glissement de terrain travailliste sous Clement Attlee. Il fut ministre du Combustible et de l'Énergie de 1946 à 1947 et rejoignit le cabinet d'Attlee en tant que chancelier de l'Échiquier."
 CWelect.5.t:0 "Élection de 1959 - Harold MacMillan c. Hugh Gaitskell"
 CWelect.5.d:0 "L'élection de 1959 est là. Harold MacMillan, le successeur d'Anthony Eden au sein des conservateurs, est désormais défié par Hugh Gaitskell du parti travailliste."
 CWelect.5.a:0 "Harold MacMillan fera l'affaire. Nous ne voulons pas du socialisme, n'est-ce pas ?"
 CWelect.5.b:0 "Les travaillistes ont besoin d'une autre chance, les conservateurs sont indécis."
 CWelect.6.t:0 "La démission d'Harold MacMillan"
 CWelect.6.d:0 "Harold MacMillan a subi des pressions de la part des conservateurs et de la plupart des membres du gouvernement pour qu'il démissionne plutôt que de se présenter aux prochaines élections. Sous une telle pression, Harold a démissionné de son poste de Premier ministre."
 CWelect.6.a:0 "Le bâton conservateur passe à Alec Douglas-Home."
 CWelect.7.t:0 "Hugh Gaistkell est mort !"
 CWelect.7.d:0 "Hugh Gaistkell a connu une disparition prématurée. Il est décédé chez lui d'un virus qu'il avait contracté quelque part lors de son dernier voyage à Nikita Khrouchtchev."
 CWelect.7.a:0 "Le relais passe à Harold Wilson."
 CWelect.8.t:0 "L'élection de 1964 - Harold Wilson c.Alec Douglas-Home"
 CWelect.8.d:0 "Alors que les trois principaux partis changent de direction à la suite de deux démissions et d'un décès malheureux, le peuple britannique présente trois nouveaux visages : Harold Wilson du Parti travailliste, Alec Douglass-Home des conservateurs et Jo Grimond des libéraux. Grimond est toujours sur la touche, mais il pourrait diviser le vote centriste en faveur d'un des autres partis..."
 CWelect.8.a:0 "C'est l'heure du travail ! Harold Wilson"
 CWelect.8.b:0 "Les conservateurs nous protégeront ! Alec Douglas-Maison !"
 Alec_Douglas-Home:0 "Devenu député de la Chambre des Lords en tant que baron du Hirsel, Alec a pris la relève après la démission d'Harold MacMillan. Il a été dans le passé un collaborateur du Premier ministre Chamberlain. Alec semble être beaucoup plus autocratique que ses concurrents, et cela pourrait être sa chute..."
 Harold_Wilson:0 "Harold Wilson a longtemps servi dans des cabinets. Dès qu'il est devenu député élu, il a été intégré au cabinet et au conseil fantôme de M. Attlee, et il a maintenant été élu leader du parti travailliste. Depuis la mort de Hugh Gaitskell, il a tenté de rebaptiser le parti travailliste en socialisme modéré."
 elect.9.t:0 "Élection de 1966 - Harold Wilson c.Edward Heath"
 elect.9.d:0 "Le très honorable a convoqué des élections anticipées, et alors que les bulletins de vote comptent, tous les Britanniques se demandent si un nouveau Premier ministre est là ? Le vieux Sir Alec Douglas-Home abandonna son poste au profit d'Edward Heath. Pendant ce temps, M. Wilson fait campagne pour le parti travailliste et Jo Grimond divise une fois de plus les voix. Qui va gagner ?"
 elect.9.a:0 "Le socialisme modéré est le meilleur ! Harold Wilson !"
 elect.9.b:0 "Mais l'absence de socialisme est-elle meilleure ? Edouard Heath !"
 Edward_Heath:0 "Edward « Ted » Heath est un fervent partisan des Espaces économiques européens et des communautés charbonnières, ainsi que des liens plus étroits avec l'Europe, ce qui est un peu étrange pour un conservateur, mais il n'en reste pas moins un véritable politicien."
 elect.10.t:0 "Élection de 1970 - Harold Wilson c.Edward Heath"
 elect.10.d:0 "Les candidats des deux grands partis n'ont pas changé, mais cette fois, ce n'est pas un jeu d'enfant et l'opinion du peuple britannique sera sûrement exprimée. Nous nous trouvons une fois de plus à la croisée des chemins, Heath ou Wilson ?"
 elect.10.a:0 "Harold gagne à nouveau. Travail!"
 elect.10.b:0 "Une victoire insoupçonnée pour M. Heath ! Les conservateurs !"
 elect.11.t:0 "Élection de 1974 - Chaos du Parlement sans majorité"
 elect.11.d:0 "Des élections ont déjà eu lieu cette année, mais elles ont conduit à une victoire minoritaire d'Harold Wilson. Pour déterminer ce que veut réellement la Grande-Bretagne, les partis se sont mis d'accord sur la tenue de nouvelles élections en octobre. Le moment est maintenant venu : Wilson ou Heath ?"
 elect.11.a:0 "Harold Wilson forme le gouvernement. Travail."
 elect.11.b:0 "Edward Heath forme le gouvernement. Les conservateurs."
 elect.12.t:0 "Harold Wilson démissionne"
 elect.12.d:0 "Harold Wilson a décidé aujourd'hui de prendre sa retraite. Après une si longue carrière politique, le public britannique ne sait pas qui pourrait prendre sa place. D'autres fractions de gauche du parti travailliste réclament des réformes."
 elect.12.a:0 "James Callaghan remplacera Wilson."
 James_Callaghan:0 "James Callaghan, également connu sous le nom de Jim Callaghan, a désormais occupé les quatre grandes fonctions du pays, de l'Échiquier au Premier ministre."
 elect.13.t:0 "L'ascension de Thatcher"
 elect.13.d:0 "Les conservateurs ont trouvé M. Heath incapable de diriger le parti ou la nation. Les conservateurs ont choisi de remplacer M. Heath par Margret Thatcher, la députée de Finchley."
 elect.13.a:0 "Margaret Thatcher guidera notre nation et nos peuples."
 Margret_Thatcher:0 "La Dame de fer, Margaret Thatcher, est la première femme Premier ministre britannique. Elle a arraché à M. Heath la direction des conservateurs et dirige désormais la Grande-Bretagne."
 elect.14.t:0 "Élection de 1979 - Thatcher c. Callaghan"
 elect.14.d:0 "Margaret Thatcher est devenue chef des conservateurs au début de 1975 en raison de l'incapacité de Heath à véritablement diriger et à amener les électeurs à ses côtés. Depuis qu'elle est arrivée au pouvoir avec peu de capital politique, Thatcher a utilisé toutes les méthodes possibles pour faire dérailler le parti travailliste et cela semble avoir fonctionné. Des élections anticipées ont été programmées cinq mois avant les élections proprement dites et Mme Thatcher pourrait gagner."
 elect.14.a:0 "Margaret Thatcher est forte et sous elle, la Grande-Bretagne sera forte."
 elect.14.b:0 "Le Parlement est un club d'hommes. Callaghan."
 elect.15.t:0 "Élection de 1983 - Thatcher c.Foot"
 elect.15.d:0 "L'élection de 1983 s'annonce comme une victoire éclatante pour les conservateurs. Depuis la guerre des Malouines, la popularité de Thatcher est plus élevée que jamais et, pire encore pour les travaillistes, les libéraux gagnent du terrain."
 elect.15.a:0 "Thatcher détenait les Malouines, et maintenant elle détient la Grande-Bretagne"
 elect.15.b:0 "Michael Foot forme un gouvernement de coalition avec les libéraux."
 Micheal_Foot:0 "Michael Foot, aujourd'hui Premier ministre, est présent dans la sphère travailliste depuis un certain temps. Cependant, il semble qu'il ne tiendra pas longtemps, Thatcher créant constamment le chaos au Parlement."
 elect.16.t:0 "Élection de 1987 - Thatcher c.Kinnock"
 elect.16.d:0 "Michael Foot a décidé de ne pas se présenter et à sa place, le parti travailliste a proposé Neil Kinnock tandis que la popularité de Thatcher continue de croître. Il semble qu'elle puisse gagner à nouveau, mais seuls les citoyens peuvent le dire."
 elect.16.a:0 "La Dame de Fer gagne encore !"
 elect.16.b:0 "Kinnock remporte une minorité."
 elect.17.t:0 "Margaret Thatcher démissionne !"
 elect.17.d:0 "Thatcher a démissionné pour le bien des conservateurs car elle estime que sa démission affaiblirait la prochaine campagne travailliste. C'est du moins l'annonce qu'elle a faite au parti. John Major dirige désormais la Grande-Bretagne."
 elect.17.a:0 "Oui, John Major réformera un gouvernement."
 Neil_Kinnock:0 "Neil Kinnock a servi pour la première fois au Parlement en 1970. Il dirige désormais le parti travailliste et la Grande-Bretagne. M. Kinnock est loin d'avoir pris pour la première fois la direction du parti travailliste en 1983, malgré les tentatives visant à le mettre à l'écart."
 John_Major:0 "John Major a été ministre des Affaires étrangères et chancelier de l'Échiquier dans le gouvernement de Thatcher, prenant finalement la place de Mme Thatcher à la tête du pays et du parti."
 elect.18.t:0 "Élection de 1992 - Major c.Kinnock"
 elect.18.d:0 "Les perspectives des conservateurs pour cette campagne étaient sombres. Les travaillistes menaient de vingt points, jusqu'à ce que la campagne travailliste commence à chuter de manière inattendue. Il va falloir que les gens se décident..."
 elect.18.a:0 "John Major et les conservateurs gagnent !"
 elect.18.b:0 "Neil Kinnock avec le Parti travailliste !"
 elect.19.t:0 "Neil Kinnock démissionne - L'ascension de Blair"
 elect.19.d:0 "Neil Kinnock a décidé aujourd'hui de se retirer du Parlement et de la politique. Le flambeau du parti travailliste passe à Tony Blair de Sedgefield."
 elect.19.a:0 "Qui est cette Blair ?"
 Tony_Blair:0 "Anthony Charles Lynton Blair, ou Tony Blair, un centriste, a lentement poussé le parti travailliste plus à droite. Il a réalisé des résultats remarquables lors de ses élections, créant une large majorité travailliste et est désormais un élément permanent de la politique britannique contemporaine."
 elect.20.t:0 "Élection de 1997 - Blair c. Major"
 elect.20.d:0 "Cette élection est très intéressante : Blair s'est présenté sur le « New Labour », un mouvement centriste au sein de son parti, et a obtenu un large soutien, tandis que les conservateurs s'effondrent à cause de la politique européenne et d'innombrables scandales. 1997 semble être une victoire éclatante pour les travaillistes, mais peut-être que les conservateurs pourraient remporter une coalition minoritaire avec les libéraux-démocrates."
 elect.20.a:0 "John Major remporte une minorité."
 elect.20.b:0 "Tony Blair remporte une victoire écrasante !"
 
 
 attlee_speech_category:0 "Discours publics du premier ministre Attlee"
 attlee_speech_category_desc:0 "Le Premier ministre Attlee a été témoin du déclin rapide de l'Empire britannique peu après la fin de la Seconde Guerre mondiale. Il se concentre fortement sur le bien-être des citoyens et est fermement opposé aux guerres. Le pays a commencé à se reconstruire sous son gouvernement."
 attlee_anti_war:0 "Organisez un discours anti-guerre au public"
 attlee_anti_war_desc:0 "Cinq années de guerre ont infligé de graves dégâts à notre pays. De précieuses vies ont été perdues. De nombreuses richesses ont été détruites. Notre commerce a été perturbé. Il est clair qu'il y aura des difficultés et des pénuries dans de nombreux domaines. Pour parvenir à la reprise, nous avons besoin d'un grand effort de la part de tous les hommes et femmes de Grande-Bretagne au cours des quatre dernières années et demie. Un très bel effort a été fait, la production dans l'industrie et l'agriculture a été considérablement augmentée et la possibilité de travailler a été offerte à tous et la grande majorité a bien travaillé. Tout s'est si bien passé, oui, M. Churchill appelle cela le partage de la misère et la question à trancher lors de cette élection est de savoir si la politique travailliste de partage équitable pour tous doit se poursuivre ou si, comme sous le gouvernement conservateur précédent, les bénéfices doivent aller à une partie de la population et la misère à une autre. Je vous demande de nous aider à poursuivre le travail d'une reprise si bien commencée."
 attlee_korean_war:0 "Aborder la guerre de Corée"
 attlee_korean_war_desc:0 "Nous sommes confrontés à un défi direct à l'autorité des Nations Unies, un acte d'agression a déjà été commis. Maintenant, vous pouvez organiser toutes sortes de réunions spéciales, que ce soit avec le gouvernement sud-coréen ou américain, je suis d'accord. Parce que la personne n'a pas un très bon caractère, cela n'excuse pas qu'elle tente de l'assassiner. On peut dire que la Chine, la nouvelle Chine, ne fait pas partie du Conseil de sécurité. Cela n'affecte ni ne modifie le fait de l'agression. Et si l'organisation des Nations Unies n'était pas jusqu'au bout l'ancienne Société des Nations, il fallait absolument qu'il y soit mis un terme. Et plus de cinquante autres nations les soutiennent dans cet effort visant à préserver la paix mondiale. Cela signifie des risques et des dangers, toute autre cause signifiait des risques et des dangers. Je suis sûr que si nous gagnons, l'autorité dans le monde sera plus grande que celle de l'agresseur. Nous devons dire ici et maintenant que l'agression ne réussira pas."
 churchill_speech_category:0 "Discours du Premier ministre Churchill"
 churchill_speech_category_desc:0 "Le Premier ministre Churchill est notre héros de guerre, il a dirigé le pays pendant les cinq années les plus difficiles. Même si la Seconde Guerre mondiale a coûté la vie à des millions de Britanniques, notre grand Premier ministre a refusé de faire un compromis avec les nazis et a combattu jusqu'à la victoire finale. Ses contributions au pays et à la paix mondiale resteront à jamais gravées dans les mémoires."
 churchill_king_death:0 "Discours à l'occasion de la mort du roi George VI"
 churchill_king_death_desc:0 "Durant ces derniers mois, le roi marchait avec la mort comme si la mort était une compagne, une connaissance qu'il reconnaissait et qu'il ne craignait pas. Finalement, la mort est venue en ami, et après une bonne journée de soleil et de sport, et après une bonne nuit à ceux qui l'aimaient le plus, il s'est endormi comme tout homme ou femme qui s'efforce de craindre Dieu et rien d'autre au monde peut espérer le faire. Moi, dont la jeunesse s'est déroulée dans les gloires augustes, incontestées et tranquilles de l'ère victorienne, je pourrais bien ressentir un frisson en invoquant une fois de plus la prière et l'hymne : « Dieu sauve la Reine !"
 

 #Battleship/Battlecruiser Hulls in research tree#

 ENG_battle_hull_medium_0:0 "Classe Avant-garde"
 ENG_battle_hull_medium_1:0 "Réaménagement de la classe Vanguard"
 ENG_battle_hull_medium_0_desc:0 "Le HMS Vanguard était un cuirassé rapide britannique construit pendant la Seconde Guerre mondiale et mis en service après la fin de la guerre. Il était le plus grand et le plus rapide des cuirassés de la Royal Navy, le seul navire de sa classe et le dernier cuirassé à être construit."
 ENG_battle_hull_medium_1_desc:0 "Et si le HMS Vanguard avait reçu la même ampleur et la même quantité de réaménagement que les navires de la classe Iowa de l'US Navy. Le HMS Vanguard a fait l'objet d'une brève rénovation en 1955 avant d'être vendu à l'état neuf et démoli en 1960. Mais et si cela n'avait pas été le cas ?"
 #Carrier Hulls in research tree#

 ENG_carrier_hull_0:0 "Classe implacable"
 ENG_carrier_hull_1:0 "Classe audacieuse"
 ENG_carrier_hull_2:0 "Conception CVA-01"
 ENG_carrier_hull_3:0 "Refonte de classe audacieuse"
 ENG_carrier_hull_4:0 "Classe Reine Elizabeth"
 ENG_carrier_hull_0_desc:0 "Le porte-avions de classe Implacable était composé de deux porte-avions construits pour la Royal Navy pendant la Seconde Guerre mondiale. Dérivés de la conception de la classe Illustrious, ils étaient plus rapides et transportaient plus d'avions que les navires plus anciens. Ils furent initialement affectés à la Home Fleet une fois achevés en 1944 et attaquèrent des cibles en Norvège ainsi que le cuirassé allemand Tirpitz. Par la suite, ils furent affectés à la flotte britannique du Pacifique (BPF)."
 ENG_carrier_hull_1_desc:0 "Les porte-avions de classe Audacious étaient une classe de porte-avions proposée par le gouvernement britannique dans les années 1930 et 1940 et achevée après la Seconde Guerre mondiale. Les deux navires construits ont été fortement modifiés et ont divergé au cours de leur durée de vie."
 ENG_carrier_hull_2_desc:0 "Le CVA-01 était un projet de porte-avions britannique, conçu dans les années 1960. Le navire était destiné à être le premier d'une classe qui remplacerait tous les porte-avions de la Royal Navy alors existants, dont la plupart avaient été conçus avant ou pendant la Seconde Guerre mondiale."
 ENG_carrier_hull_3_desc:0 "Au fur et à mesure que les constructions de l'Audacious (renommé Eagle) et de l'Irresistible (renommé Ark Royal) progressaient, elles différaient tellement qu'elles devinrent effectivement les navires principaux (et uniques) de chacune de leurs propres classes. Ils constituaient l'épine dorsale de la flotte de porte-avions d'après-guerre et furent considérablement modifiés."
 ENG_carrier_hull_4_desc:0 "La classe Queen Elizabeth est une classe de deux porte-avions de la Royal Navy du Royaume-Uni qui sont les éléments centraux du UK Carrier Strike Group."

 ENG_carrier_hull_light_0:0 "Classe Colosse"
 ENG_carrier_hull_light_1:0 "Classe Centaure"
 ENG_carrier_hull_light_2:0 "Classe invincible"
 ENG_carrier_hull_light_3:0 "Classe Océan"
 ENG_carrier_hull_light_4:0 "Réaménagement de la classe Invincible"
 ENG_carrier_hull_light_0_desc:0 "Le Design Light Fleet Carrier de 1942, communément appelé British Light Fleet Carrier, était un porte-avions léger créé par la Royal Navy pendant la Seconde Guerre mondiale et utilisé par huit forces navales entre 1944 et 2001. Ils ont été conçus et construits par des chantiers navals civils pour servir d'étape intermédiaire entre les porte-avions de flotte de grande taille et coûteux et les porte-avions d'escorte moins chers mais à capacité limitée."
 ENG_carrier_hull_light_1_desc:0 "La classe Centaur de porte-avions de la Royal Navy était la dernière des conceptions de porte-avions légers lancées au cours des dernières années de la Seconde Guerre mondiale. Le premier navire des quatre originaux de la classe a été mis en service en 1953 et le dernier mis hors service en 1984. Les trois premiers navires n'avaient pas de poste de pilotage incliné et n'étaient donc pas adaptés aux avions à réaction rapides, et la production d'un deuxième lot de quatre porte-avions a été annulée."
 ENG_carrier_hull_light_2_desc:0 "La classe Invincible était une classe de porte-avions légers exploitée par la Royal Navy. Les navires ont été construits comme des plates-formes de guerre anti-sous-marine (ASW) capables de contrer la menace sous-marine soviétique de la guerre froide dans l'Atlantique Nord, et ont initialement embarqué des avions Sea Harrier et des hélicoptères anti-sous-marins Sea King HAS.1."
 ENG_carrier_hull_light_3_desc:0 "Le HMS Ocean était un hélicoptère à plate-forme d'atterrissage, anciennement porte-hélicoptères du Royaume-Uni et vaisseau amiral de la flotte de la Royal Navy. Elle a été conçue pour soutenir les opérations de débarquement amphibie et pour soutenir l'état-major du commandant de la force amphibie britannique et du commandant de la force de débarquement britannique."
 ENG_carrier_hull_light_4_desc:0 "Au milieu des années 2000, les navires de la classe Invincible ont subi une nouvelle rénovation au chantier naval de Rosyth. Ce réaménagement impliquait la reconstruction totale du tremplin de saut à ski, l'ajout de meilleures communications et la reconfiguration du navire afin qu'il puisse basculer plus rapidement entre les rôles de porte-avions légers et de porte-hélicoptères."

 #ENG_carrier_hull_super_1:0 "Kitty Hawk Class"
 #ENG_carrier_hull_super_2:0 "Nimitz Class"
 #ENG_carrier_hull_super_3:0 "Theodore Roosevelt Class"
 #ENG_carrier_hull_super_4:0 "Ronald Reagan Class"
 #ENG_carrier_hull_super_1_desc:0 "The introduction of the nuclear age and the adoption of smaller navalize reactors allows these large vessels not only to carry large air wings but also lets them stay at sea almost indefinitly."
 #ENG_carrier_hull_super_2_desc:0 "An updated super carrier design with more efficient reactors and the capability to carry even more aircraft."
 #ENG_carrier_hull_super_3_desc:0 "An advanced late Cold War era super carrier design with a massive complement of aircraft and improved reactors."
 #ENG_carrier_hull_super_4_desc:0 "A modern super carrier design with further improved reactors, a massice complement of aircraft and the capability to launch them quickly and effectively by utilizing improved catapults."

 # Submarine Hulls #
 ENG_sub_hull_small_single_0:0 "Classe Amphion"
 ENG_sub_hull_small_single_0_desc:0 "La classe Amphion (également connue sous le nom de classe « A » et de classe Acheron) des sous-marins diesel-électriques britanniques a été conçue pour être utilisée pendant la guerre du Pacifique. Seuls deux furent achevés avant la fin des hostilités, mais après la modernisation dans les années 1950, ils continuèrent à servir dans la Royal Navy jusque dans les années 1970."
 ENG_sub_hull_small_single_1:0 "Classe de marsouin"
 ENG_sub_hull_small_single_1_desc:0 "La classe Porpoise était une classe de huit sous-marins diesel-électriques exploités par la Royal Navy. Cette classe était initialement désignée sous-marins de patrouille, puis d'attaque. Ce furent les premiers sous-marins britanniques conventionnels construits après la fin de la Seconde Guerre mondiale. Leur conception a été, à bien des égards, influencée par les sous-marins allemands de type XXI de la Seconde Guerre mondiale."
 ENG_sub_hull_small_single_2:0 "Classe Obéron"
 ENG_sub_hull_small_single_2_desc:0 "La classe Oberon était une classe de navires composée de 27 sous-marins de conception britannique exploités par cinq nations différentes. Ils ont été conçus comme une suite directe de la classe Porpoise, les dimensions physiques étaient les mêmes, mais des matériaux plus solides ont été utilisés dans la construction de la coque et des équipements mis à jour ont été installés."
 ENG_sub_hull_small_single_3:0 "Classe de défenseurs"
 ENG_sub_hull_small_single_3_desc:0 "Les sous-marins de la classe Upholder/Victoria, également connus sous le nom de Type 2400 (en raison de leur déplacement de 2 400 tonnes), sont la classe de sous-marins diesel-électriques construits au Royaume-Uni dans les années 1980 pour compléter les sous-marins nucléaires utilisés dans le service sous-marin de la Royal Navy britannique."
 ENG_sub_hull_small_single_4:0 "Classe Victoria"
 ENG_sub_hull_small_single_4_desc:0 "Les sous-marins de la classe Upholder/Victoria, également connus sous le nom de Type 2400 (en raison de leur déplacement de 2 400 tonnes), sont la classe de sous-marins diesel-électriques construits au Royaume-Uni dans les années 1980 pour compléter les sous-marins nucléaires utilisés dans le service sous-marin de la Royal Navy britannique."

 ENG_sub_hull_large_single_0:0 "Classe Explorateur"
 ENG_sub_hull_large_single_0_desc:0 "Les deux sous-marins de la classe Explorer étaient des navires expérimentaux construits pour la Royal Navy afin de tester un système de propulsion basé sur l'utilisation de peroxyde d'hydrogène hautement concentré (peroxyde de test élevé, HTP) et de carburant diesel pour atteindre une endurance et des vitesses sous-marines élevées."
 ENG_sub_hull_large_single_1:0 "Classe vaillante"
 ENG_sub_hull_large_single_1_desc:0 "La classe Valiant était une classe de sous-marins à propulsion nucléaire en service dans la Royal Navy du milieu des années 1960 jusqu'en 1994. Il s'agissait du premier sous-marin de la flotte nucléaire entièrement britannique ; l'ancien HMS Dreadnought utilisait un réacteur nucléaire américain."
 ENG_sub_hull_large_single_2:0 "Classe Churchill"
 ENG_sub_hull_large_single_2_desc:0 "Les trois sous-marins de la classe Repeat Valiant, parfois connus sous le nom de classe Churchill, étaient des sous-marins à propulsion nucléaire qui ont servi dans la Royal Navy des années 1970 jusqu'au début des années 1990. La classe Churchill était basée sur l'ancienne classe Valiant, mais présentait de nombreuses améliorations internes."
 ENG_sub_hull_large_single_3:0 "Classe Trafalgar"
 ENG_sub_hull_large_single_3_desc:0 "La classe Trafalgar est une classe de sous-marins à propulsion nucléaire (SSN) en service dans la Royal Navy et le successeur de la classe Swiftsure. Comme la majorité des sous-marins nucléaires de la Royal Navy, les sept bateaux ont été construits au chantier naval de Barrow-in-Furness, en Cumbria."
 ENG_sub_hull_large_single_4:0 "Classe astucieuse"
 ENG_sub_hull_large_single_4_desc:0 "La classe Astute est la dernière classe de sous-marins à propulsion nucléaire (SSN) en service dans la Royal Navy."

 ENG_sub_hull_large_double_0:0 "Classe Dreadnought"
 ENG_sub_hull_large_double_0_desc:0 "Le septième HMS Dreadnought fut le premier sous-marin à propulsion nucléaire du Royaume-Uni, construit par Vickers Armstrongs à Barrow-in-Furness. Lancé par la reine Elizabeth II le Trafalgar Day 1960 et mis en service dans la Royal Navy en avril 1963, il est resté en service jusqu'en 1980."
 ENG_sub_hull_large_double_1:0 "Classe de résolution"
 ENG_sub_hull_large_double_1_desc:0 "La classe Résolution était une classe de quatre sous-marins nucléaires lance-missiles (SSBN) construits pour la Royal Navy dans le cadre du programme britannique Polaris. Chaque sous-marin était armé de 16 missiles nucléaires UGM-27 Polaris A-3. "
 ENG_sub_hull_large_double_2:0 "Réaménagement de la classe de résolution"
 ENG_sub_hull_large_double_2_desc:0 "La classe Résolution était une classe de quatre sous-marins nucléaires lance-missiles (SSBN) construits pour la Royal Navy dans le cadre du programme britannique Polaris. Chaque sous-marin était armé de 16 missiles nucléaires UGM-27 Polaris A-3."
 ENG_sub_hull_large_double_3:0 "Classe Avant-garde"
 ENG_sub_hull_large_double_3_desc:0 "La classe Vanguard est une classe de sous-marins nucléaires lance-missiles (SSBN) en service dans la Royal Navy. La classe a été introduite en 1994 dans le cadre du programme nucléaire Trident."

 # Screen Hulls #

 ENG_screen_hull_medium_0:0 "Classe Baie"
 ENG_screen_hull_medium_0_desc:0 "La classe Bay était une classe de 26 frégates anti-aériennes (A/A) construites pour la Royal Navy dans le cadre du programme d'urgence de guerre de 1943 pendant la Seconde Guerre mondiale (dont une a été annulée et six achevées en tant que navires d'expédition ou navires d'enquête). Ils étaient basés sur les coques de frégates anti-sous-marines (A/S) incomplètes de classe Loch."
 ENG_screen_hull_medium_1:0 "Classe Whitby"
 ENG_screen_hull_medium_1_short:0 "Tapez 12"
 ENG_screen_hull_medium_1_desc:0 "Les frégates de type 12 ou de classe Whitby étaient une classe de six navires de frégates anti-sous-marines de la Royal Navy, entrées en service à la fin des années 1950. Ils ont été conçus au début des années 1950 comme escorteurs de convois océaniques de premier ordre, à la lumière de l'expérience acquise pendant la Seconde Guerre mondiale. À cette époque, la Royal Navy concevait des escortes à rôle unique et les Whitby étaient conçus comme des escortes de convois rapides capables de s'attaquer aux sous-marins à grande vitesse. "
 ENG_screen_hull_medium_2:0 "Classe Amazone"
 ENG_screen_hull_medium_2_short:0 "Tapez 21"
 ENG_screen_hull_medium_2_desc:0 "Au milieu des années 1960, la Royal Navy (RN) avait besoin de remplacer les frégates diesel de classe Leopard (Type 41) et de classe Salisbury (Type 61). Alors que les navires de guerre de la Royal Navy étaient traditionnellement conçus par le Département des navires du ministère de la Défense basé à Bath, les chantiers navals privés (en particulier Vosper Thorneycroft) ont fait campagne pour le droit de concevoir et de construire un navire répondant à cette exigence. Vospers a affirmé qu'en ignorant ce qu'ils prétendaient être les pratiques de conception conservatrices suivies par l'équipe du ministère de la Défense à Bath, ils pourraient livrer la nouvelle frégate à un prix nettement inférieur."
 ENG_screen_hull_medium_3:0 "Classe d'épée large"
 ENG_screen_hull_medium_3_short:0 "Tapez 22"
 ENG_screen_hull_medium_3_desc:0 "La frégate Type 22, également connue sous le nom de classe Broadsword, était une classe de frégates construites pour la Royal Navy britannique. Quatorze ont été construits au total, avec une production divisée en trois lots. Initialement destinés à être des frégates de guerre anti-sous-marine dans le cadre de la contribution de l'OTAN, les navires sont devenus des navires de guerre à usage général. "
 ENG_screen_hull_medium_4:0 "Classe duc"
 ENG_screen_hull_medium_4_short:0 "Tapez 23"
 ENG_screen_hull_medium_4_desc:0 "La frégate Type 23 ou classe Duke est une classe de frégates construites pour la Royal Navy du Royaume-Uni. Les navires portent le nom des ducs britanniques, ce qui fait que la classe est communément connue sous le nom de classe Duke."

 ENG_screen_hull_heavy_0:0 "Classe audacieuse"
 ENG_screen_hull_heavy_0_desc:0 "Les navires de la classe Daring étaient à la fois les navires les plus grands et les plus lourdement armés servant dans les marines du Commonwealth à être classés comme destroyers. Ils étaient destinés à remplir certaines fonctions des croiseurs, qui après la Seconde Guerre mondiale étaient considérés à la fois coûteux et obsolètes par les planificateurs navals, et furent brièvement officiellement considérés comme un type hybride (Darings) avant d'être classés comme destroyers. Ils furent également les derniers destroyers de la RN et du RAN à posséder des canons comme armement principal (au lieu de missiles guidés), qui furent utilisés pendant la confrontation indonésienne et la guerre du Vietnam."
 ENG_screen_hull_heavy_1:0 "Classe de comté"
 ENG_screen_hull_heavy_1_desc:0 "La classe County était une classe de destroyers lance-missiles britanniques, les premiers navires de guerre de ce type construits par la Royal Navy. Conçus spécifiquement autour du système de missile anti-aérien Seaslug, le rôle principal de ces navires était la défense aérienne de zone autour du groupe de travail du porte-avions dans un environnement de guerre nucléaire."
 ENG_screen_hull_heavy_2:0 "Lot II de classe de comté"
 ENG_screen_hull_heavy_2_desc:0 "La classe County était une classe de destroyers lance-missiles britanniques, les premiers navires de guerre de ce type construits par la Royal Navy. Conçus spécifiquement autour du système de missile anti-aérien Seaslug, le rôle principal de ces navires était la défense aérienne de zone autour du groupe de travail du porte-avions dans un environnement de guerre nucléaire."
 ENG_screen_hull_heavy_3:0 "Classe Sheffield"
 ENG_screen_hull_heavy_3_short:0 "Tapez 42"
 ENG_screen_hull_heavy_3_desc:0 "La classe Type 42 ou Sheffield était une classe de quatorze destroyers lance-missiles qui servaient dans la Royal Navy. Deux autres navires de cette classe ont été construits et ont servi dans la marine argentine. "
 ENG_screen_hull_heavy_4:0 "Classe audacieuse"
 ENG_screen_hull_heavy_4_short:0 "Tapez 45"
 ENG_screen_hull_heavy_4_desc:0 "Le destroyer Type 45, également connu sous le nom de classe D ou Daring, est une classe de six destroyers lance-missiles construits pour la Royal Navy du Royaume-Uni au début du XXIe siècle. La classe est principalement conçue pour la guerre antiaérienne et antimissile et est construite autour du système de défense aérienne PAAMS (Sea Viper) utilisant le SAMPSON AESA et les radars longue portée S1850M."

 ENG_battle_hull_light_0:0 "Classe Minotaure"
 ENG_battle_hull_light_0_desc:0 "La classe Minotaur, ou Design Z, était une classe proposée de croiseurs légers prévue pour la Royal Navy britannique peu après la Seconde Guerre mondiale. La conception Z avait plusieurs configurations proposées avec des dispositions d'armement et de propulsion différentes."
 ENG_battle_hull_light_1:0 "Classe Tigre"
 ENG_battle_hull_light_1_desc:0 "La classe Tigre était une classe de trois navires de guerre britanniques du XXe siècle et les derniers croiseurs entièrement canons de la Royal Navy. La construction des croiseurs de classe Minotaure a commencé pendant la Seconde Guerre mondiale, mais en raison de l'austérité d'après-guerre, de la guerre de Corée et de la préférence de Churchill pour les armes nucléaires et les avions par rapport à la flotte de surface, les coques sont restées inachevées."
 ENG_battle_hull_light_2:0 "Réaménagement de la classe Tigre"
 ENG_battle_hull_light_2_desc:0 "En 1964, le gouvernement conservateur et la moitié de l'état-major de la marine considéraient que les Tigres n'étaient plus abordables ou crédibles dans le rôle de combat de surface ou de défense aérienne de la flotte et auraient préféré les mettre hors service, mais étant donné qu'ils n'avaient techniquement que trois ans et qu'ils avaient été construits à grands frais, les mettre au rebut était politiquement difficile. Ils ont approuvé la conversion en porte-hélicoptères ; transportant des hélicoptères Westland Wessex pour les opérations du Royal Marine Commando. Un grand hangar a remplacé la tourelle « Y », les tourelles avant ont été conservées pour l'appui-feu et le travail anti-surface."
 ENG_battle_hull_light_3:0 "Classe Bristol"
 ENG_battle_hull_light_3_short:0 "Tapez 82"
 ENG_battle_hull_light_3_desc:0 "Le Type 82 ou destroyer de classe Bristol devait être une classe de huit destroyers lance-missiles de la Royal Navy équipés du missile Sea Dart, destiné à remplacer les destroyers de classe County armés par Seaslug. Ils assureraient la défense aérienne de zone par le biais de forces opérationnelles porte-avions et pourraient servir de manière indépendante dans le rôle de croiseur moderne à l'est de Suez. Doté d'une capacité de missiles aériens, de surface et anti-sous-marins à longue portée, il servirait également dans un groupe de quatre frégates de type 82 et de quatre frégates de classe Leander « à large faisceau » comme escortes extérieures et intérieures des porte-avions CVA-01 prévus. "
 #ENG_battle_hull_light_4:0 ""
