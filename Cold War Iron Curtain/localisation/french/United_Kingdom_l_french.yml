 ENG_60s_Wind_of_change:0 "Vents de changement"
 ENG_60s_Wind_of_change_desc:0 "Le discours « Vent de changement » était un discours historiquement significatif prononcé par le Premier ministre britannique Harold Macmillan devant le Parlement sud-africain, qui signalait clairement que le gouvernement britannique dirigé par les conservateurs n'avait pas l'intention de bloquer l'indépendance d'un grand nombre de ces territoires."
