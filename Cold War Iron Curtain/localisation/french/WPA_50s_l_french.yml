 #event
  dutch_east_indies_war.2.d: "La mort soudaine du lieutenant-général Simon Hendrik Spoor a été un choc pour l'establishment militaire néerlandais. En tant que commandant de l'armée royale des Indes orientales néerlandaises, Spoor a joué un rôle déterminant dans la direction des opérations militaires néerlandaises au plus fort du conflit en Indonésie. Sa présence commandait l'autorité ; ses stratégies ont façonné le cours des efforts néerlandais pour réaffirmer le contrôle colonial. Sa mort à Batavia a été brutale, survenant au moment même où les tensions restaient vives et les négociations incertaines. Pour les Néerlandais, c'était plus que la perte d'un commandant : c'était la perte d'une force directrice au milieu d'une guerre qui leur échappait de plus en plus.\n\nDu point de vue indonésien, le décès de Spoor a marqué une fissure dans la campagne néerlandaise. Bien qu'elle n'ait pas été célébrée, elle a été accueillie avec la tranquille entente que l'un des adversaires les plus compétents de la République avait été retiré de l'équation. Son absence a laissé un vide de leadership, semant hésitation et désarroi dans une position néerlandaise déjà tendue."
  dutch_east_indies_war.2.a: "Repose en paix"
  dei_death_tt: "§YAvec sa mort, le rêve de réaffirmer notre contrôle l'accompagne dans la tombe.§!"
 #natspit

  WPA_Legacy_of_VOC: "L'héritage de la Compagnie unie des Indes orientales"
  WPA_Legacy_of_VOC_desc: "Alors que les Indes orientales néerlandaises approchaient d'une transition politique importante, l'héritage de la Vereenigde Oost-Indische Compagnie (VOC) restait une caractéristique déterminante de la région. Bien que la VOC ait été dissoute en 1799, ses fondements en matière de commerce, de gouvernance et d'infrastructures ont continué à façonner l'archipel. L'administration coloniale néerlandaise qui a suivi a maintenu et développé de nombreuses structures du VOC, garantissant ainsi la stabilité et la croissance économique.\n\nDe nombreuses villes clés de la région, notamment Batavia (Jakarta), Surabaya et Semarang, étaient à l'origine des centres commerciaux de COV et se sont développées pour devenir d'importants centres commerciaux et administratifs. Les routes, les chemins de fer et les ports, initialement conçus pour faciliter le commerce dans le cadre du COV, ont depuis été modernisés et étendus sous la gouvernance néerlandaise. Ces développements ont renforcé la connectivité au sein de l'archipel et renforcé sa position de centre économique critique en Asie du Sud-Est."
  WPA_The_Jewels_of_Asia: "Les joyaux de l'Asie"
  WPA_The_Jewels_of_Asia_desc: "Pendant des siècles, les Indes néerlandaises ont été le joyau de l'Asie du Sud-Est, une région d'une immense richesse, d'une importance stratégique et d'une beauté naturelle inégalée. Réputé pour ses ressources abondantes, ses réseaux commerciaux florissants et son rôle central dans le commerce mondial, l'archipel est devenu la pièce maîtresse de l'entreprise néerlandaise à l'étranger. Malgré les changements politiques en cours, les Indes néerlandaises sont restées l'un des territoires les plus précieux et les plus développés de la région, un héritage bâti au fil de siècles d'investissements économiques et administratifs.\n\nLes Indes néerlandaises jouissent de richesses naturelles sans précédent. De vastes plantations de café, de sucre, de thé, de tabac et de caoutchouc alimentaient une économie d'exportation florissante, tandis que ses réserves de pétrole, d'étain et de charbon en faisaient une puissance industrielle clé en Asie. Les terres fertiles de Java, les îles productrices d'épices des Moluques et les régions riches en ressources de Sumatra et de Bornéo ont permis à l'archipel de rester une plaque tournante essentielle de la chaîne d'approvisionnement mondiale.\n\nL'économie est parmi les plus fortes de la région, soutenue par des systèmes de plantation modernes, des réseaux de transport et des installations portuaires qui rivalisent avec celles des principales économies mondiales. Les investissements néerlandais dans l'industrie et les infrastructures ont fait de la colonie non seulement une source de matières premières, mais également une puissance économique bien organisée, cruciale pour les marchés européens."
  WPA_Unpopular_War: "La guerre impopulaire"
  WPA_Unpopular_War_desc: "Après la Seconde Guerre mondiale, les Néerlandais cherchèrent à rétablir l'ordre dans les Indes orientales, qui avaient souffert de l'occupation japonaise. La soudaine déclaration d'indépendance en août 1945 a été considérée comme perturbatrice, dépourvue d'accord formel et risquant l'effondrement économique et l'anarchie.\n\nPlutôt que de rejeter le changement, les Pays-Bas ont poursuivi un modèle fédéré, offrant l'autonomie tout en maintenant la coopération. Des accords comme celui de Linggadjati visaient un compromis, mais les conflits persistaient. Les Actes politiques ont été conçus comme étant nécessaires pour restaurer la stabilité, mais la pression internationale croissante, en particulier de la part des États-Unis et de l'ONU, a forcé un changement de politique aux Pays-Bas."
  
  WPA.2.t: "Tony Lovink a prêté serment"
  WPA.2.d: ""
  WPA.2.a: "Le Joyau à bout de souffle..."

  #focus desc
  WPA_the_crown_set_foot_in_the_nusantara_desc: "Les Indes néerlandaises se trouvaient à la croisée des chemins. Après des années d'investissement dans les infrastructures, la gouvernance et le développement économique, les Pays-Bas ont été confrontés à un paysage politique en évolution rapide. La région, longtemps considérée comme un élément vital de l'économie mondiale néerlandaise, connaissait une instabilité en raison de la Révolution nationale indonésienne. Alors que les efforts des Pays-Bas visaient à rétablir l'ordre et à mettre en oeuvre une transition politique structurée, la pression internationale croissante et le conflit en cours ont rendu inévitable une résolution négociée."
  #ppl desc
  POLITICS_VAN_EECHOUD_DESC: "Jan Pieter Karel van Eechoud, gouverneur, homme politique, pilote et policier, exerce plusieurs professions et est actuellement gouverneur de la Nouvelle-Guinée néerlandaise.\n\nNé en 1904 à Horst, aux Pays-Bas, Eechoud a fréquenté le Kolese Kanisius Nijmegen. En 1929, il part pour les Indes néerlandaises pour travailler comme policier à Sukabumi. Pendant la Seconde Guerre mondiale, il fut envoyé en Australie pour devenir officier intelligent.\n\nÀ son retour, Eechoud devient résident et administrateur de la Nouvelle-Guinée. Il souhaitait que la Nouvelle-Guinée néerlandaise se développe en tant que colonie distincte, indépendante des Indes néerlandaises. Eechoud a fait valoir que la culture de Papouasie était si primitive et diversifiée que la région devrait être exclue de la décolonisation. Les Néerlandais doivent d'abord et pendant longtemps éduquer les Papous, sinon les non-Papous inonderont la Papouasie et noieront toute la culture papoue."

