 EQG_end_the_tribal_civil_war:0 "Mettre fin à notre guerre civile tribale"
 EQG_end_the_tribal_civil_war_desc:0 "Au cours des dernières décennies, les clans Bubi de Fernando ont été impliqués dans des guerres dynastiques, nous devons y mettre fin bientôt ou voir leur destruction."
 EQG_ethnic_equality:0 "Égalité ethnique"
 EQG_ethnic_equality_desc:0 "Nous devrions choisir la voie de l'égalité entre les peuples Bubi et Fang."
 EQG_fang_supremacy:0 "Suprématie Fang"
 EQG_fang_supremacy_desc:0 "La voie naturelle de notre nation est qu'elle soit dirigée par notre groupe ethnique majoritaire, les Fang."
 EQG_tryanny_of_the_majority:0 "Tyrannie de la majorité"
 EQG_tryanny_of_the_majority_desc:0 "Notre groupe ethnique majoritaire se mettra avant les besoins et les désirs des tribus mineures de notre nation."
 EQG_greater_cultural_acceptance:0 "Une plus grande acceptation culturelle"
 EQG_greater_cultural_acceptance_desc:0 "Nous devons aller au-delà de la tolérance envers les groupes ethniques inférieurs de notre nation, mais apprendre à les honorer et à les respecter en tant que partie intégrante de notre patrimoine national."
 EQG_the_anti_spanish_riots_of_santa_isabel:0 "Les émeutes anti-espagnoles de Santa Isabel"
 EQG_the_anti_spanish_riots_of_santa_isabel_desc:0 "Les tensions ethniques se sont accrues dans notre pays ces dernières années. Les officiers coloniaux espagnols ont toujours été extrêmement brutaux mais avec la montée de l'anticolonialisme en Afrique centrale, notre peuple se rebelle. Aujourd'hui, les émeutes s'étendent de notre capitale à tout le pays."
 EQG_legitimize_equatoguinean_nationalist_activism:0 "Légitimer l'activisme nationaliste équato-guinéen"
 EQG_legitimize_equatoguinean_nationalist_activism_desc:0 "L'appel à l'autodétermination des Équato-Guinéens se manifeste désormais sous la forme d'un mouvement politique formel."
 EQG_us_envoy_to_spain:0 "Envoyé américain en Espagne"
 EQG_us_envoy_to_spain_desc:0 "Les États-Unis, dans leur programme visant à mettre fin au colonialisme, ont envoyé un envoyé en Espagne."
 EQG_establish_transitional_government:0 "Établir un gouvernement de transition"
 EQG_establish_transitional_government_desc:0 "L'État espagnol a décidé de former un gouvernement de transition pour les Équato-Guinéens qui amènera progressivement notre nation vers l'indépendance sous la direction d'un dirigeant autochtone."
 EQG_spanish_integralism:0 "Intégralisme espagnol"
 EQG_spanish_integralism_desc:0 "L'administration coloniale est tout simplement trop efficace et puissante pour permettre la formation de mouvements d'autodétermination. Laissons plutôt notre autonomie être utilisée selon la mode coloniale traditionnelle."
 EQG_exploit_fernando_po_colonial_oil_refining:0 "Exploiter le raffinage du pétrole colonial de Fernando Po"
 EQG_exploit_fernando_po_colonial_oil_refining_desc:0 "Notre île de Fernando Po possède d'importants gisements de pétrole. Exploitons cela au profit de l'État espagnol."
 EQG_expand_colonial_administrative_transportation:0 "Développer le transport colonial"
 EQG_expand_colonial_administrative_transportation_desc:0 "Pour permettre un meilleur transport des administrateurs coloniaux et des ressources, nous devons développer notre infrastructure."
 EQG_assemble_merchant_fleet:0 "Assembler la flotte marchande"
 EQG_assemble_merchant_fleet_desc:0 "Nous devons développer la marine coloniale pour transporter les nombreuses marchandises que nous récoltons de la colonie vers la mère patrie."
 EQG_build_the_bata_jetty:0 "Construire la jetée de Bata"
 EQG_build_the_bata_jetty_desc:0 "La Guinée équatoriale n'a pas de port naturel et un littoral très profond, il faut construire une jetée pour faciliter les transports coloniaux."
 EQG_invest_in_rio_muni_industry:0 "Investir dans l'industrie de Río Muni"
 EQG_invest_in_rio_muni_industry_desc:0 "Développons plus d'industries pour notre colonie."
 EQG_strengthen_colonialism:0 "Renforcer le colonialisme"
 EQG_strengthen_colonialism_desc:0 "Renforçons l'emprise coloniale de la Côte de Guinée."
 EQG_status_quo:0 "Statu quo"
 EQG_status_quo_desc:0 "Nous garderons les circonstances de l'administration inchangées en Guinée coloniale"
 EQG_emancipados_in_spanish_parliment:0 "Emancipados au Parlement espagnol"
 EQG_emancipados_in_spanish_parliment_desc:0 "Mettons les Emancipados au parlement espagnol pour plus de représentation."
 EQG_fernandino_descrimination:0 "Fernandino Décrimination"
 EQG_fernandino_descrimination_desc:0 "Que les Fernandinos soient rejetés et que les Emancipados tombent à la poubelle, la Guinée équatoriale est une colonie espagnole pour les Espagnols."
 EQG_return_newly_stabilized_guinea_as_a_state:0 "Restituer la Guinée nouvellement stabilisée en tant qu'État"
 EQG_return_newly_stabilized_guinea_as_a_state_desc:0 "Maintenant que nous avons stabilisé la Guinée dans son moment d'autonomie, rendons-la à un État espagnol."
 EQG_un_general_assembly_pressures_spain:0 "L'Assemblée générale des Nations Unies fait pression sur l'Espagne"
 EQG_un_general_assembly_pressures_spain_desc:0 "L'Assemblée générale des Nations Unies a fait pression sur l'Espagne, avec des conséquences si elle n'accorde pas une autonomie et une indépendance complètes à la Guinée équatoriale."
 EQG_hold_first_general_election:0 "Tenir la première élection générale"
 EQG_hold_first_general_election_desc:0 "Il est temps pour la Guinée équatoriale d'organiser ses premières élections générales"
 EQG_restore_bubi_kingdom:0 "Restaurer le Royaume Bubi"
 EQG_restore_bubi_kingdom_desc:0 "Nous devons restaurer le royaume Bubi."
 EQG_crown_malabo_ii:0 "Roi héritier Malabo II"
 EQG_crown_malabo_ii_desc:0 "Nous couronnerons Francisco Malabo Beosá comme roi Malabo II"
 EQG_clan_assimiliation:0 "Assimilation des clans"
 EQG_clan_assimiliation_desc:0 "Nous devons assimiler les nombreuses tribus et clans de notre nation au royaume Bubi désormais dominant."
 EQG_popularize_bubi_culture:0 "Vulgariser la culture Bubi"
 EQG_esanguii_clan_officials:0 "Officiels du clan Esanguii"
 EQG_esanguii_clan_officials_desc:0 "Il est naturel que le clan principal de notre pays, les Esanguii, soit ciblé pour les hautes places du pouvoir."
 EQG_popularize_bubi_culture_desc:0 "Nous devons populariser la culture de notre royaume."
 EQG_the_cult_of_morim:0 "Le culte de Morim"
 EQG_the_cult_of_morim_desc:0 "Vulgarisons le culte du principal dieu créateur du peuple Bubi, Morim."
 EQG_defend_the_kingdom:0 "Défendre le Royaume"
 EQG_defend_the_kingdom_desc:0 "Nous devons défendre le nouveau royaume de ses ennemis."
 EQG_employ_bubi_peasants:0 "Employer des paysans Bubi"
 EQG_employ_bubi_peasants_desc:0 "Nous devons employer les nombreux paysans Bubi de notre nation."
 EQG_restore_oral_traditions:0 "Restaurer les traditions orales"
 EQG_restore_oral_traditions_desc:0 "Nous devons restaurer les traditions orales de notre peuple"
 EQG_ethnic_tattooing:0 "Tatouage ethnique"
 EQG_ethnic_tattooing_desc:0 "Un élément essentiel de la culture du peuple Bubi est son tatouage tribal traditionnel."
 EQG_diplomatic_ties_with_the_uk:0 "Liens diplomatiques avec le Royaume-Uni."
 EQG_diplomatic_ties_with_the_uk_desc:0 "Nous devons nouer des liens avec l'empire qui aime les monarques."
 EQG_the_royal_shipment:0 "\"La cargaison royale\""
 EQG_the_royal_shipment_desc:0 "Nous recevrons une livraison du Royaume-Uni."
 EQG_hire_british_advisors:0 "Embaucher des conseillers britanniques"
 EQG_hire_british_advisors_desc:0 "Nous embaucherons des conseillers britanniques."
 EQG_president_bonifacio_ondo_edu:0 "Président Bonifacio Ondó Edu"
 EQG_president_bonifacio_ondo_edu_desc:0 "Président Bonifacio Ondó Edu"
 EQG_embrace_catholicism:0 "Embrassez le catholicisme"
 EQG_embrace_catholicism_desc:0 "Nous devrions embrasser la religion de notre ancienne mère patrie coloniale."
 EQG_early_autarky:0 "Début de l'autarcie"
 EQG_early_autarky_desc:0 "Nous devons progresser vers l'indépendance économique de notre nation."
 EQG_diplomatic_ties_to_the_US:0 "Liens diplomatiques avec les États-Unis."
 EQG_diplomatic_ties_to_the_US_desc:0 "Commençons par nouer des liens avec les États-Unis"
 EQG_maintain_spanish_relations:0 "Entretenir des relations espagnoles"
 EQG_maintain_spanish_relations_desc:0 "Nous ne devons pas être amers envers nos anciens maîtres coloniaux et les accepter pour la culture qu'ils nous ont donnée."
 EQG_begin_industrialization:0 "Commencer l'industrialisation"
 EQG_begin_industrialization_desc:0 "Nous commencerons à industrialiser notre nation"
 EQG_build_hispanophone_universities:0 "Construire des universités hispanophones"
 EQG_build_hispanophone_universities_desc:0 "Nous construirons une université qui enseigne en langue espagnole."
 EQG_move_capital_to_mainland:0 "Déplacer la capitale vers le continent"
 EQG_move_capital_to_mainland_desc:0 "Nous déplacerons la capitale vers le continent, où se trouve la majorité de la population."
 EQG_build_our_prestige:0 "Construisons notre prestige"
 EQG_build_our_prestige_desc:0 "Nous bâtirons notre prestige."
 EQG_rio_muni_garmet_industry:0 "Industrie du grenat de Río Muni"
 EQG_rio_muni_garmet_industry_desc:0 "Nous créerons une industrie du grenat à Río Muni."
 EQG_stability_and_saftey:0 "Stabilité et sécurité"
 EQG_stability_and_saftey_desc:0 "Grâce à la modération, nous gagnerons en stabilité et en sécurité."
 EQG_us_upbringing:0 "Éducation aux États-Unis"
 EQG_us_upbringing_desc:0 "Nous serons élevés par les États-Unis"
 EQG_president_francisco_macias_nguema:0 "Président Francisco Macías Nguema"
 EQG_president_francisco_macias_nguema_desc:0 "Président Francisco Macías Nguema"
 EQG_execute_ondo_edu:0 "Exécuter Ondo Edu"
 EQG_execute_ondo_edu_desc:0 "Nguema veut exécuter Ondo Edú."
 EQG_decree_415:0 "Décret 415"
 EQG_decree_415_desc:0 "Le décret 415 a été promulgué par le président Francisco Macías Nguema peu après son élection, ce qui lui a donné le contrôle total de toutes les lois et institutions. Détruire efficacement la démocratie dans la jeune nation."
 EQG_kill_the_governor_of_the_central_bank:0 "Tuez le gouverneur de la Banque centrale"
 EQG_kill_the_governor_of_the_central_bank_desc:0 "Nguema veut tuer le gouverneur de la banque centrale et ramener le trésor chez lui, dans un village rural."
 EQG_rampant_nepotism:0 "Népotisme rampant"
 EQG_rampant_nepotism_desc:0 "Nguema n'a essentiellement placé que les membres de la famille et du clan en position de pouvoir."
 EQG_youth_in_march_with_macias:0 "Jeunesse en mars avec Macías"
 EQG_youth_in_march_with_macias_desc:0 "le principal groupe de jeunesse du régime de Nguema est la Jeunesse en Marche avec Macías."
 EQG_there_is_no_god_but_nguema:0 "Il n'y a pas d'autre dieu que Nguema"
 EQG_there_is_no_god_but_nguema_desc:0 "Nguema a interdit le culte de tout dieu autre que lui-même."
 EQG_cult_of_personality:0 "Culte de la personnalité"
 EQG_cult_of_personality_desc:0 "Nguema est en train de créer une campagne massive de culte de la personnalité."
 EQG_open_north_korean_embassy:0 "Ouvrir l'ambassade de Corée du Nord"
 EQG_open_north_korean_embassy_desc:0 "Nguema voue un profond amour à la RPDC et souhaite y ouvrir une ambassade."
 EQG_rename_the_party:0 "Renommer la fête"
 EQG_rename_the_party_desc:0 "Inspiré par le Parti des travailleurs du peuple nord-coréen, Nguema veut renommer notre parti"
 EQG_replace_the_constitution:0 "Remplacer la Constitution"
 EQG_replace_the_constitution_desc:0 "Nguema remplace la constitution par une autre qui le fera président à vie."
 EQG_ussr_builds_bata_dockyard:0 "L'URSS construit le chantier naval de Bata"
 EQG_ussr_builds_bata_dockyard_desc:0 "L'Union soviétique, dans une tentative de resserrer les relations, nous construit un chantier naval."
 EQG_nguemize_colonial_names:0 "Noms coloniaux de Nguemize"
 EQG_nguemize_colonial_names_desc:0 "Il est temps de Nguemize noms coloniaux"
 EQG_christmas_eve_massacre:0 "Massacre du réveillon de Noël"
 EQG_christmas_eve_massacre_desc:0 "La veille de Noël, Nguema exécute tous ses ennemis politiques au stade de Malabo"
 EQG_diplomatic_ties_with_the_ussr:0 "Liens diplomatiques avec l'URSS."
 EQG_diplomatic_ties_with_the_ussr_desc:0 "Nous nouerons des liens avec l'Union soviétique"
 EQG_found_black_beach_prison:0 "Trouvé la prison de Black Beach"
 EQG_found_black_beach_prison_desc:0 "Nguema, pour éliminer la dissidence, crée l'une des prisons les plus répressives d'Afrique."
 EQG_the_red_shipment:0 "\"La cargaison rouge\""
 EQG_the_red_shipment_desc:0 "Nous recevons une livraison de l'Union Soviétique"
 EQG_north_korean_advisors:0 "Conseillers nord-coréens"
 EQG_north_korean_advisors_desc:0 "La Corée du Nord est prête à nous envoyer des conseillers"
 EQG_malabo_international_airport:0 "Aéroport international de Malabo"
 EQG_malabo_international_airport_desc:0 "Nous construirons l'aéroport international de Malabo"
 EQG_the_dachau_of_africa:0 "Le Dachau de l'Afrique"
 EQG_the_dachau_of_africa_desc:0 "Sous Nguema, la Guinée équatoriale est devenue la « Dachau de l'Afrique » après le camp de concentration nazi."
 EQG_flight_of_the_people:0 "La fuite du peuple"
 EQG_flight_of_the_people_desc:0 "Les gens fuient la nation !"
 EQG_president_atanasio_ndongo_miyone:0 "Président Atanasio Ndongo Miyone"
 EQG_president_atanasio_ndongo_miyone_desc:0 "Président Atanasio Ndongo Miyone"
 EQG_create_national_identity:0 "Créer une identité nationale"
 EQG_create_national_identity_desc:0 "Miyone veut donner aux Équatoguinéens une identité unifiée"
 EQG_war_on_poverty:0 "Guerre contre la pauvreté"
 EQG_war_on_poverty_desc:0 "Miyone mène une guerre contre la pauvreté"
 EQG_africanize_colonial_names:0 "Africaniser les noms coloniaux"
 EQG_africanize_colonial_names_desc:0 "Miyone remplace les anciens noms coloniaux par des noms africanisés"
 EQG_new_industries:0 "Nouvelles industries"
 EQG_new_industries_desc:0 "Nous créerons de nouvelles industries"
 EQG_change_official_language_to_fang:0 "Changer la langue officielle en Fang"
 EQG_change_official_language_to_fang_desc:0 "Nous devons remplacer l'espagnol comme langue officielle parce que c'était la langue de nos oppresseurs."
 EQG_economic_independence:0 "Indépendance économique"
 EQG_economic_independence_desc:0 "Nous devons atteindre l'indépendance économique"
 EQG_guard_against_neo_imperialism:0 "Se prémunir contre le néo-impérialisme"
 EQG_guard_against_neo_imperialism_desc:0 "Nous devons protéger notre fière nation en tant qu'Africains du néo-impérialisme"
 EQG_move_capital_to_bata:0 "Déplacer la capitale à Bata"
 EQG_move_capital_to_bata_desc:0 "Il est temps de déplacer notre capitale à Bata, sur le continent le plus peuplé"
 EQG_end_superstitions:0 "Mettre fin aux superstitions"
 EQG_end_superstitions_desc:0 "Comme beaucoup de peuples africains, notre peuple est entravé par ses superstitions. Nous devons moderniser notre nation en nous débarrassant de cela."
 EQG_protect_guinea:0 "Protéger la Guinée"
 EQG_protect_guinea_desc:0 "Nous devons protéger nos côtes et celles de nos voisins africains"
 reduce_illiteracy:0 "Nous devons réduire notre analphabétisme"
 EQG_protect_ethnic_minorities:0 "Protéger les minorités ethniques"
 EQG_protect_ethnic_minorities_desc:0 "Nous protégerons les nombreuses minorités ethniques de notre nation"
 EQG_diplomatic_ties_with_ghana:0 "Liens diplomatiques avec le Ghana"
 EQG_diplomatic_ties_with_ghana_desc:0 "Nous établirons des relations avec une nation africaine forte."
 EQG_train_native_officers:0 "Former des officiers autochtones"
 EQG_train_native_officers_desc:0 "Nous formerons des officiers autochtones au lieu de dépendre des officiers étrangers"
 EQG_we_are_africans:0 "Nous sommes africains"
 EQG_we_are_africans_desc:0 "Nous sommes de fiers Africains, et rien d'autre."
 EQG_rise_o_equatoguineans:0 "\"Rise O'Equatoguinéens\""
 EQG_rise_o_equatoguineans_desc:0 "Les fiers Équatoguinéens s'élèvent vers un nouveau pays."
 EQG_equatoguinean_mobilization:0 "Mobilisation équato-guinéenne"
 EQG_equatoguinean_mobilization_desc:0 "La Guinée équatoriale doit mobiliser ses forces"
 EQG_utilize_spanish_training_manuels:0 "Utiliser des manuels de formation en espagnol"
 EQG_utilize_spanish_training_manuels_desc:0 "Nous utiliserons d'anciens manuels de formation"
 EQG_replace_colonial_equipment:0 "Remplacer l'équipement colonial"
 EQG_replace_colonial_equipment_desc:0 "Il faudrait remplacer les équipements coloniaux"
 EQG_motorize_equatoguineans:0 "Équatoguinéens motorisés"
 EQG_motorize_equatoguineans_desc:0 "Nous utiliserons nos vastes réserves pétrolières pour motoriser notre armée."
 EQG_invite_foreign_observers:0 "Inviter des observateurs étrangers"
 EQG_invite_foreign_observers_desc:0 "Invitons les observateurs étrangers"
 EQG_equatoguinean_air_force:0 "Force aérienne équato-guinéenne"
 EQG_equatoguinean_air_force_desc:0 "Il faut fonder une force aérienne équato-guinéenne"
 EQG_reverse_engineer_spanish_designs:0 "Ingénierie inverse des conceptions espagnoles"
 EQG_reverse_engineer_spanish_designs_desc:0 "Nous pouvons effectuer de l'ingénierie inverse sur les conceptions d'avions espagnols."
 EQG_primitive_runways_logistics:0 "Logistique de piste primitive"
 EQG_primitive_runways_logistics_desc:0 "Nous pouvons utiliser une logistique de piste très primitive"
 EQG_early_armorization:0 "Armorisation précoce"
 EQG_early_armorization_desc:0 "Nous devrions commencer tôt l'armorisation"
 EQG_jungle_warfare:0 "Guerre de la jungle"
 EQG_jungle_warfare_desc:0 "Compte tenu de la géographie, nous devrions nous concentrer sur la spécialisation dans Jungle Warefare"
 EQG_protect_our_corridor:0 "Construisez la base sous-marine secrète"
 EQG_protect_our_corridor_desc:0 "Nous devons protéger le couloir entre notre île principale et le continent."
 EQG_buy_submarine_designs:0 "Achetez des modèles de sous-marins soviétiques"
 EQG_buy_submarine_designs_desc:0 "Nous devrions acheter des modèles de sous-marins soviétiques"
 EQG_research_soviet_doctrine:0 "Rechercher la doctrine sous-marine soviétique"
 EQG_research_soviet_doctrine_desc:0 "Nous devrions étudier la doctrine des sous-marins soviétiques."
 EQG_modernize_colonial_industry:0 "Moderniser l'industrie coloniale"
 EQG_modernize_colonial_industry_desc:0 "Nous devrions moderniser l'industrie coloniale"
 EQG_mainland_aluminum_deposits:0 "Gisements d'aluminium du continent"
 EQG_mainland_aluminum_deposits_desc:0 "Nous devons commencer à exploiter nos gisements d'aluminium sur le continent"
 EQG_expand_fernando_po_oil_refining:0 "Développer le raffinage du pétrole de Fernando Po"
 EQG_expand_fernando_po_oil_refining_desc:0 "Nous devrions étendre le raffinage du pétrole de Fernando Po"
 EQG_refurbish_republican_manufacturies:0 "Rénover les manufactures républicaines"
 EQG_refurbish_republican_manufacturies_desc:0 "Il faudrait remettre à neuf les usines républicaines"
 EQG_repurpose_lumber_mills:0 "Réutiliser les scieries"
 EQG_repurpose_lumber_mills_desc:0 "Nous devrions réutiliser les nombreuses scieries utilisées pour l'exportation par les Espagnols dans notre pays"
 EQG_continue_rio_muni_roadwork:0 "Continuer les travaux routiers de Río Muni"
 EQG_continue_rio_muni_roadwork_desc:0 "Cela aide bien notre développement à continuer l'infrastructure de Río Muni"
 EQG_fernando_po_highway:0 "Autoroute Fernando Po"
 EQG_fernando_po_highway_desc:0 "nous devrions travailler sur une autoroute Fernando Po"
 EQG_repurpose_coffee_processing_plants:0 "Réutiliser les usines de transformation du café"
 EQG_repurpose_coffee_processing_plants_desc:0 "Nous devons réutiliser les nombreux plants de café utilisés par les Espagnols pour l'exportation, afin de les utiliser à des fins civiles."
 EQG_finish_rio_muni_roadwork:0 "Terminer les travaux routiers de Río Muni"
 EQG_finish_rio_muni_roadwork_desc:0 "Nous avons maintenant la capacité de terminer les travaux routiers de Río Muni" 
 EQG_equatoguinean_middle_class_industry:0 "Industrie de la classe moyenne équato-guinéenne"
 EQG_equatoguinean_middle_class_industry_desc:0 "Nous devons construire une industrie de classe moyenne équato-guinéenne"
 EQG_trade_skills_education:0 "Éducation aux compétences professionnelles"
 EQG_trade_skills_education_desc:0 "Nous devrions nous concentrer sur les compétences professionnelles dans notre système éducatif."
