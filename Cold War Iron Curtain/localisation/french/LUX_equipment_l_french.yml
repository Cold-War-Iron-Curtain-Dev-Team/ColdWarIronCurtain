 LUX_atgm_carrier_equipment_0:0 "Willys MB avec ENTAC"
 LUX_atgm_carrier_equipment_0_short:0 "Willys MB avec ENTAC"
 LUX_atgm_carrier_equipment_0_desc:0 "Une jeep belge Willys MB avec des nacelles de missiles ENTAC montées à l'arrière"
 LUX_atgm_carrier_equipment_1:0 "Camion, utilitaire, ¼ de tonne, 4×4, M151A1 TOW"
 LUX_atgm_carrier_equipment_1_short:0 "REMORQUAGE M151A1"
 LUX_atgm_carrier_equipment_1_desc:0 "Version avec des modifications mineures dans la suspension arrière, visant principalement à permettre au véhicule de transporter des charges plus lourdes. Ajout de clignotants aux ailes avant. L'essentiel de la suspension arrière est resté inchangé et il en va de même pour les problèmes de tenue de route dans les virages."
 LUX_atgm_carrier_equipment_2:0 "Camion, utilitaire, ¼ de tonne, 4×4, M151A2 I-TOW"
 LUX_atgm_carrier_equipment_2_short:0 "M151A2 JE-REMORQUE"
 LUX_atgm_carrier_equipment_2_desc:0 "l'A2 a présenté une suspension arrière considérablement révisée qui a grandement amélioré la sécurité dans les virages rapides. Le M151 était désormais équipé d'une suspension à bras semi-traînant. De nombreuses petites améliorations, y compris des clignotants améliorés. L'A2 peut être identifiée par la grande combinaison de clignotants et de feux occultants sur les ailes avant, qui ont également été modifiées pour monter des feux plus grands, contrairement aux A1 précédentes qui avaient des ailes avant plates."
 LUX_atgm_carrier_equipment_3:0 "AM Général HMMWV M1045A2 TOW2"
 LUX_atgm_carrier_equipment_3_short:0 "M1045A2 REMORQUAGE2"
 LUX_atgm_carrier_equipment_3_desc:0 "M1045/M1045A1 TOW Missile Carrier, blindage supplémentaire, sans treuil"
 LUX_atgm_carrier_equipment_4:0 "AM Général HMMWV M1046A1 TOW2"
 LUX_atgm_carrier_equipment_4_short:0 "M1046A1 REMORQUAGE2"
 LUX_atgm_carrier_equipment_4_desc:0 "M1046/M1046A1 TOW Missile Carrier, blindage supplémentaire, avec treuil"

 LUX_atgm_equipment_0:0 "DTAT ENgin Téléguidé Anti-Char ENTAC"
 LUX_atgm_equipment_0_short:0 "ENTAC"
 LUX_atgm_equipment_0_desc:0 "Le missile a été développé par la DTAT (Direction Technique des Armements Terrestres) en même temps que l'industrie privée SS.10"
 LUX_atgm_equipment_1:0 "Nord SS.11"
 LUX_atgm_equipment_1_short:0 "SS.11"
 LUX_atgm_equipment_1_desc:0 "Le développement d'une version améliorée du SS.10 (Nord-5203) a commencé en 1953 sous le nom de Nord-5210. Le missile était conçu comme une version lourde du SS.10 portable destiné à être utilisé à partir de véhicules, de navires et d'hélicoptères. Le missile est entré en service dans l'armée française sous la désignation SS.11. Il a été utilisé comme premier missile antichar héliporté au monde (sur les Alouette II)."
 LUX_atgm_equipment_2:0 "MBDA Missile d'infanterie légère antichar 'MILAN' F1"
 LUX_atgm_equipment_2_short:0 "MILAN F1"
 LUX_atgm_equipment_2_desc:0 "MILAN est un produit d'Euromissile, un programme franco-ouest-allemand de développement de missiles datant des années 1960. Composé de deux composants principaux, le lanceur et le missile, le système MILAN utilise un système de guidage de commande semi-automatique de commande en ligne de visée (SACLOS)."
 LUX_atgm_equipment_3:0 "MBDA Missile d'infanterie légère antichar 'MILAN' F2"
 LUX_atgm_equipment_3_short:0 "MILAN F2"
 LUX_atgm_equipment_3_desc:0 "MILAN est un produit d'Euromissile. La variante F2 comprend une seule ogive principale à charge creuse avec une sonde à distance pour augmenter la pénétration. Un programme franco-ouest-allemand de développement de missiles remontant aux années 1960. Composé de deux composants principaux, le lanceur et le missile, le système MILAN utilise un système de guidage de commande semi-automatique de commande en ligne de visée (SACLOS)."
 LUX_atgm_equipment_4:0 "MBDA Missile d'infanterie légère antichar 'MILAN' F3"
 LUX_atgm_equipment_4_short:0 "MILAN F3"
 LUX_atgm_equipment_4_desc:0 "MILAN est un produit d'Euromissile. Le F3 est équipé d'une ogive à charge creuse Tandem et d'une balise électronique. Un programme franco-ouest-allemand de développement de missiles remontant aux années 1960. Composé de deux composants principaux, le lanceur et le missile, le système MILAN utilise un système de guidage de commande semi-automatique de commande en ligne de visée (SACLOS)."

