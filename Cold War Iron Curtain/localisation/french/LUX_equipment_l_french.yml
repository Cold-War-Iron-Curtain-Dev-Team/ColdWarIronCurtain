#Luxembourg

 LUX_infantry_equipment_0:0 "Fabrique Nationale Modèle 1949"
 LUX_infantry_equipment_0_short:0 "FN-49"
 LUX_infantry_equipment_0_desc:0 "Avec une conception remontant au début des années 1930, le FN-49 est disponible à la fois comme fusil semi-automatique et comme fusil automatique à tir sélectif avec chargeurs de 10 cartouches.\nBien que bien considéré pour sa haute qualité de fabrication et sa fiabilité par rapport aux fusils de l'époque, sa valeur marchande était limitée, car il n'a pas été développé à temps pour être utilisé pendant la Seconde Guerre mondiale, mais plus tard, car de nombreuses armées avaient déjà commencé à passer aux fusils de combat à tir sélectif. Un nombre inconnu de FN-49 ont été produits comme fusils automatiques à tir sélectif, mais le petit chargeur de 10 cartouches limitait l'utilité de la fonction entièrement automatique."

 LUX_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 LUX_infantry_equipment_1_short:0 "FN FAL"
 LUX_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 LUX_infantry_equipment_2:0 "Fabrique Nationale Carabine Automatique Légère"
 LUX_infantry_equipment_2_short:0 "CAL FN"
 LUX_infantry_equipment_2_desc:0 "La CAL (Carabine Automatique Légère) était une arme belge fabriquée par la Fabrique Nationale. C'était le premier fusil de 5,56 mm produit par la Fabrique Nationale. Il ressemblait au FN FAL, très réussi de la société, mais il s'agissait d'une conception originale. Contrairement au FAL, il s'agit d'un échec du marché, même si son développement a conduit au succès raisonnable du FN FNC."

 LUX_infantry_equipment_3:0 "Steyr AOÛT A1"
 LUX_infantry_equipment_3_short:0 "Steyr AOÛT A1"
 LUX_infantry_equipment_3_desc:0 "Le Steyr AUG (allemand ; Armee-Universal-Gewehr, lit. « fusil militaire universel ») est un fusil d'assaut autrichien bullpup chambré pour la cartouche intermédiaire OTAN de 5,56 × 45 mm, conçu dans les années 1960 par Steyr-Daimler-Puch, et maintenant fabriqué par Steyr Mannlicher GmbH & Co KG. Ce fusil est la première mise à niveau majeure de la plate-forme existante, la désignant comme A1."

 LUX_infantry_equipment_4:0 "Steyr AOÛT A2"
 LUX_infantry_equipment_4_short:0 "Steyr AOÛT A2"
 LUX_infantry_equipment_4_desc:0 "Le Steyr AUG (allemand ; Armee-Universal-Gewehr, lit. « fusil militaire universel ») est un fusil d'assaut autrichien bullpup chambré pour la cartouche intermédiaire OTAN de 5,56 × 45 mm, conçu dans les années 1960 par Steyr-Daimler-Puch, et maintenant fabriqué par Steyr Mannlicher GmbH & Co KG. Ce fusil est la première mise à niveau majeure de la plate-forme existante, la désignant comme A1."

########## START OF LUX

 LUX_lt_equipment_4:0 "Le char de combat principal d'Eischen"
 LUX_lt_equipment_4_short:0 "CCP Eischen"
 LUX_lt_equipment_4_desc:0 "Avec seulement 6 mètres de long et 3 mètres de large, le véhicule aurait été presque exactement de la même taille que le M24 Chaffee de la Seconde Guerre mondiale, bien que légèrement plus lourd, entre 24 et 32 tonnes américaines (21,8 tonnes à 29 tonnes) selon l'épaisseur de blindage choisie."

 LUX_motorized_equipment_1:0 "GMC CCKW 6x6"
 LUX_motorized_equipment_1_short:0 "CCKW 6x6"
 LUX_motorized_equipment_2:0 "RÉO M35 6x6"
 LUX_motorized_equipment_2_short:0 "M35 6x6"
 LUX_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 LUX_motorized_equipment_3:0 "RÉO M35A1 6x6"
 LUX_motorized_equipment_3_short:0 "M35A1 6x6"
 LUX_motorized_equipment_3_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
