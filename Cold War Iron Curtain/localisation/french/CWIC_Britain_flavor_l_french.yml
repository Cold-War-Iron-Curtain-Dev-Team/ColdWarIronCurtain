 flavoreng.1.t:0 "[GetNewspaperHeader]La bombe de Brighton"
 flavoreng.1.d:0 "Une bombe a ravagé le Grand Hôtel de Brighton lors de la conférence conservatrice. Le Premier ministre n'a pas été blessé."
 flavoreng.1.a:0 "L'hôtel a été bombardé."
 flavoreng.1.b:0 "Une bombe à Brighton."
 flavoreng.2.t:0 "[GetNewspaperHeader]Piper Alpha"
 flavoreng.2.d:0 "La plateforme Piper Alpha a explosé en mer du Nord. La plate-forme a disparu et la plupart des hommes qui s'y trouvaient sont morts."
 flavoreng.2.a:0 "La plateforme a disparu."
 flavoreng.2.b:0 "Une catastrophe en mer du Nord."
 flavoreng.3.t:0 "[GetNewspaperHeader]L'émeute de la taxe électorale"
 flavoreng.3.d:0 "Une émeute contre la capitation a éclaté dans le centre de Londres. Trafalgar Square est détruit et cette taxe constitue désormais une crise pour le gouvernement."
 flavoreng.3.a:0 "La taxe a une émeute."
 flavoreng.3.b:0 "Londres a connu une émeute."
 flavoreng.4.t:0 "[GetNewspaperHeader]L'accord du Vendredi Saint"
 flavoreng.4.d:0 "La Grande-Bretagne et l'Irlande ont signé l'accord du Vendredi Saint à Belfast. Il instaure un partage du pouvoir en Irlande du Nord et demande aux deux parties de ranger leurs armes."
 flavoreng.4.a:0 "L'accord est signé."
 flavoreng.4.b:0 "Belfast a un accord."
