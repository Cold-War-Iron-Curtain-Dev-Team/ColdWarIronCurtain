 SWE_mr_stealth_fighter_equipment_1_short:0 "JAS 39A Gripen"
 SWE_mr_stealth_fighter_equipment_1_desc:0 "Le Saab JAS 39 Gripen est un avion de combat multirôle léger monomoteur fabriqué par la société suédoise d'aérospatiale et de défense Saab AB. Le Gripen a une configuration d'aile delta et de canard avec une conception de stabilité détendue et des commandes de vol électriques. Les avions ultérieurs sont entièrement interopérables avec l'OTAN. En 2020, plus de 271 Gripen de tous modèles, A à F, ont été construits."
 
