### Swedish air force ###

 SWE_fighter_equipment_0:0 "Filet volant Svenska"
 SWE_fighter_equipment_0_short:0 "Svenska Flygvapnet"
 SWE_fighter_equipment_0_desc:0 "L'armée de l'air suédoise est la branche aérienne des forces armées suédoises. L'armée de l'air suédoise a été créée le 1er juillet 1926 lors de la fusion des unités aériennes de l'armée et de la marine. L'armée de l'air suédoise a été impliquée à un certain niveau dans trois guerres : la guerre d'hiver finno-soviétique de 1939-1940, à laquelle des volontaires ont pris part, la crise du Congo, de 1961 à 1964, et la guerre civile libyenne de 2011."

