 SWE_artillery_equipment_1_short:0 "10,5 cm Habits m/40"
 SWE_artillery_equipment_1_desc:0 "Le Haubits m/40 de 10,5 cm est un obusier suédois de 105 mm fabriqué par Bofors pendant la Seconde Guerre mondiale. L'obusier était fabriqué sous licence en Finlande et en Suisse."

 SWE_artillery_equipment_4:0 "Obusier Fälthaubits 77A de 155 mm"
 SWE_artillery_equipment_4_short:0 "Obusier FH-77A de 155 mm"
 SWE_artillery_equipment_4_desc:0 "Le Fälthaubits 77 (« Field Howitzer 77 » suédois) ou FH77 est un obusier suédois de 155 mm. Il a été développé et fabriqué par Bofors. Il était disponible en deux versions, l'original (parfois appelé Haubits 77 A) avec un canon de calibre 38 et un mécanisme à bloc coulissant, et la dernière version d'exportation FH77 B avec un canon de calibre 39 et une culasse à vis interrompue. "
 SWE_artillery_equipment_5:0 "Obusier Fälthaubits 77B de 155 mm"
 SWE_artillery_equipment_5_short:0 "Obusier FH-77B de 155 mm"
 SWE_artillery_equipment_5_desc:0 "Le Fälthaubits 77 (« Field Howitzer 77 » suédois) ou FH77 est un obusier suédois de 155 mm. Il a été développé et fabriqué par Bofors. Il était disponible en deux versions, l'original (parfois appelé Haubits 77 A) avec un canon de calibre 38 et un mécanisme à bloc coulissant, et la dernière version d'exportation FH77 B avec un canon de calibre 39 et une culasse à vis interrompue. "

