 SWE_jet_light_equipment_1_short:0 "91A Safir"
 SWE_jet_light_equipment_1_desc:0 "Le Saab 91 Safir (en suédois pour saphir) est un avion d'entraînement monomoteur à trois (91A, B, B-2) ou quatre (91C, D) places. Le Safir a été construit par Saab AB à Linköping, en Suède (203 avions) et par De Schelde à Dordrecht, aux Pays-Bas (120 avions)." 
 SWE_jet_light_equipment_2:0 "De Havilland Vampire J 28C"
 SWE_jet_light_equipment_2_short:0 "J-28C Vampire"
 SWE_jet_light_equipment_2_desc:0 "En 1949, un total de 310 FB.50 les plus modernes, désignés J 28B, basés sur le Vampire FB.5, furent achetés. Le dernier d'entre eux fut livré en 1952, après quoi tous les chasseurs à moteur à piston furent mis hors service. En outre, un total de 57 Vampires biplaces DH 115, désignés J 28C, ont également été utilisés à des fins d'entraînement." 
 SWE_jet_light_equipment_3:0 "SAAB Sk 35C Draken"
 SWE_jet_light_equipment_3_short:0 "Sk 35C Draken"
 SWE_jet_light_equipment_3_desc:0 "Version d'entraînement biplace désignée Sk 35C (Cesar). 25 avions (35801-35825), convertis à partir de J 35A1 (Adam Kort) entre avril 1961 et août 1962 en reconstruisant la partie avant de l'avion, sans compter le prototype (35800), qui a volé le 30 décembre 1959 et appartenait à Saab."
 SWE_jet_light_equipment_4:0 "SAAB SK 37 Viggen"
 SWE_jet_light_equipment_4_short:0 "SK 37 Viggen"
 SWE_jet_light_equipment_4_desc:0 "Variante d'entraînement biplace de l'avion AJ-37 Viggen avec radar supprimé et capacité de carburant réduite." 
 SWE_jet_light_equipment_5:0 "SAAB Sk38"
 SWE_jet_light_equipment_5_short:0 "Sk 38"
 SWE_jet_light_equipment_5_desc:0 "Le Saab 38 (également connu sous le nom de B3LA ou A 38/Sk 38) était un avion d'entraînement et d'attaque monomoteur conçu par Saab dans les années 1970. Le projet était une collaboration entre Saab et l'avionneur italien Aermacchi. Il devait remplacer l'ancien avion d'entraînement à réaction Saab 105 de l'armée de l'air suédoise, mais l'avion n'a jamais dépassé la planche à dessin et a été annulé en 1979 au profit du chasseur Saab JAS 39 Gripen, plus avancé."
 
