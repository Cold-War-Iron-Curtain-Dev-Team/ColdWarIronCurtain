 SWE_heavy_fighter_equipment_2_short:0 "BJ18B"
 SWE_heavy_fighter_equipment_2_desc:0 "Variante de chasseur de nuit prévue armée d'un gunpod/baignoire avec 4 canons automatiques akan m/45 de 20 mm avec 180 rpg. Il a également été suggéré de l'équiper de moteurs Double Wasp de 2 000 ch (1 500 kW) ou de faire fonctionner les moteurs DB 605B avec du carburant à indice d'octane de 100 pour augmenter leur puissance. Le plan n'a jamais été suivi d'effet en raison de la priorité accordée au développement du T 18B."
