#this is old 
 suezcrisis.1.d:0 "Aujourd'hui, le gouvernement égyptien a décidé d'abroger unilatéralement le traité anglo-égyptien de 1936. Cela a été très alarmé car beaucoup soupçonnent l'Égypte d'avoir pour objectif de s'emparer du canal."
 suezcrisis.2.d:0 "Aujourd'hui, le canal de Suez est légitimement saisi et les impérialistes seront chassés du canal ! Les forces égyptiennes sont entrées dans le canal et en ont pris le contrôle. Le gouvernement a rapidement déclaré la nationalisation du canal de Suez. Les impérialistes sont sous le choc de cette nouvelle, mais nous pensons qu'ils sont trop impuissants pour nous arrêter."
 suezcrisis.3.d:0 "Nos craintes quant au sort du canal de Suez se sont concrétisées lorsque l'Égypte s'est emparée et nationalisée du canal de Suez. Il s'agit d'un danger sans précédent pour notre économie et notre prestige international, nous devons agir."
 suezcrisis.4.d:0 "L'Égypte a outrageusement nationalisé le canal de Suez, mettant ainsi nos routes commerciales en grave danger. Nous ne sommes pas seuls à paniquer, car les Britanniques subissent de plein fouet le coup. Nous avons décidé de commencer à travailler avec les Britanniques sur un plan visant à annuler la nationalisation du canal, l'Egypte ne peut pas s'en sortir."
 suezcrisis.5.d:0 "Alors que l'Égypte a nationalisé le canal de Suez, mettant ainsi en danger le commerce international, elle a également décidé de bloquer une route commerciale vitale pour nous, le détroit de Tiran, empêchant ainsi nos navires de commercer avec le monde extérieur. Nous ne pouvons pas permettre que cela continue, nous devons y mettre fin d'une manière ou d'une autre."
 suezcrisis.6.d:0 "Les États-Unis, craignant une escalade de la situation, ont organisé une conférence internationale pour résoudre la crise. De nombreux pays ont tenu bon en ce qui concerne la propriété du canal, sans qu'aucun camp ne semble céder. Cette conférence a été un échec global car la situation continue de s'aggraver."
 suezcrisis.7.d:0 "Aujourd'hui, une réunion secrète a eu lieu dans la ville française de Sèvres entre des représentants britanniques, français et israéliens. Tous les pays présents sont indignés par la nationalisation égyptienne du canal et sont favorables à une action visant à annuler cette nationalisation. Le plan est que les forces israéliennes attaquent la péninsule du Sinaï, s'arrêtent près du canal et laissent les forces britanniques et françaises attaquer le canal et submerger les Egyptiens, mettant ainsi fin au conflit."
 suezcrisis.8.d:0 "Aujourd'hui, une réunion secrète a eu lieu dans la ville de Sèvres entre les représentants britanniques, français et israéliens. Tous les pays présents sont indignés par la nationalisation égyptienne du canal et sont favorables à une action visant à annuler cette nationalisation. Le plan est que les forces israéliennes attaquent la péninsule du Sinaï, s'arrêtent près du canal et laissent les forces britanniques et françaises attaquer le canal et submerger les Egyptiens, mettant ainsi fin au conflit."
 suezcrisis.9.d:0 "Le plan anglo-français, Opération Mousquetaire, a passé avec succès les examens et attend d'être mis en oeuvre. L'opération initiale comprenait un débarquement franco-britannique à Alexandrie, mais le site de débarquement a été déplacé à Port-Saïd pour minimiser les pertes civiles. L'objectif est de prendre rapidement le contrôle du canal avant que les Egyptiens n'aient le temps d'agir."
 suezcrisis.10.d:0 "Aujourd'hui, les forces anglo-françaises ont débarqué à Port-Saïd et se sont rapidement emparées de la ville après une courte bataille contre les forces égyptiennes en défense. Avec la pression déjà croissante, nous devons atteindre les objectifs de l'opération, sinon elle se terminera par un échec."
 suezcrisis.11.d:0 "Les protestations contre notre invasion ont commencé à éclater, les socialistes comme les non-interventionnistes exigeant la fin de l'opération. Le gouvernement a largement fermé les yeux dans l'espoir que les protestations s'apaisent."
 suezcrisis.12.d:0 "Aujourd'hui, l'attaque finale dans le canal de Suez et l'opération Mousquetaire sont en cours, un succès mettra rapidement fin à l'opération et un échec ou une impasse entraînera l'échec de l'opération sous la pression de l'ONU obligeant nos troupes à abandonner l'opération."
 suezcrisis.13.d:0 "Mauvaise nouvelle, notre avancée est freinée par des défenseurs égyptiens déterminés. Il ne nous reste plus qu'à attendre qu'un cessez-le-feu soit décidé par l'ONU. L'opération a été un échec."
 suezcrisis.14.d:0 "Bonne nouvelle, notre poussée a été couronnée de succès : les forces égyptiennes ont été paniquées et se sont complètement retirées du canal. Nous disposons désormais de beaucoup plus de moyens de pression que nous n'en aurions autrement dans les négociations à venir. L'opération Mousquetaire a été un franc succès."
 suezcrisis.15.d:0 "Un cessez-le-feu de l'ONU a été décidé. Nos troupes vont devoir quitter l'Égypte aujourd'hui, nos relations avec les États-Unis ont été mises à mal par cette opération et la perception globale de l'opération est celle d'un magnifique échec."
 suezcrisis.16.d:0 "Un nouveau traité a été signé, le Traité d'Alexandrie, par lequel l'Égypte céderait le canal de Suez à la Compagnie du canal de Suez et démilitariserait la péninsule du Sinaï et la bande de Gaza. Une victoire pour notre politique étrangère."
 suezcrisis.17.d:0 "Les impérialistes anglo-français et israéliens se sont retirés après leurs mesquines tentatives de conquête de notre nation. Notre dirigeant est présenté comme le sauveur du monde arabe. Une victoire de propagande pour notre nation."
 suezcrisis.18.d:0 "Les impérialistes anglo-français et israéliens se sont retirés, mais pas avant de nous avoir imposé un traité injuste et humiliant. Cela nuira sûrement à la popularité de notre régime."
 suezcrisis.19.d:0 "La délégation israélienne a décidé de « s'abstenir » de nos projets de saisie du canal, craignant des représailles internationales. Il faudrait qu'un autre casus belli intervienne, des plans sont déjà en cours d'élaboration."
 suezcrisis.20.d:0 "Décrivez comment les Israéliens, bien qu'ils aient gagné, ont dû battre en retraite en raison de pressions politiques"
 suezcrisis.0.d:0 "Décrivez comment l'Égypte a finalement abrogé le traité"
 OperationKadesh.1.d_1:0 "Aujourd'hui, le Premier ministre [Root.GetLeader], le directeur général du ministère de la Défense Shimon Peres et le chef d'état-major Moshe Dayan ont rencontré secrètement le ministre français de la Défense, le ministre des Affaires étrangères et chef d'état-major ainsi que le ministre britannique des Affaires étrangères et son assistant dans une maison isolée de la ville française de Sèvres. Ils ont parlé de l'urgence de la situation en Égypte et de leur réaction à la nationalisation égyptienne du canal de Suez. Ils ont ensuite planifié une invasion de l'Égypte en deux étapes, y compris une histoire de couverture à raconter au monde. Le délégué israélien craignait d'être abandonné par la France et la Grande-Bretagne en pleine invasion et a donc exigé que toutes les parties signent un document promettant leur allégeance mutuelle. Tous les dirigeants ont quitté le bâtiment avec des copies de l'accord, et il ne nous reste plus qu'à nous préparer à une invasion de la péninsule du Sinaï pendant que les puissances occidentales se concentrent sur l'Égypte."
 OperationKadesh.1.d_2:0 "Aujourd'hui, le Premier ministre [Root.GetLeader], le directeur général du ministère de la Défense et le chef d'état-major ont rencontré secrètement le ministre français de la Défense, le ministre des Affaires étrangères et chef d'état-major ainsi que le ministre britannique des Affaires étrangères et son assistant dans une maison isolée de la ville française de Sèvres. Ils ont parlé de l'urgence de la situation en Égypte et de leur réaction à la nationalisation égyptienne du canal de Suez. Ils ont ensuite planifié une invasion de l'Égypte en deux étapes, y compris une histoire de couverture à raconter au monde. Les Israéliens, craignant d'être abandonnés par la France et la Grande-Bretagne au milieu de l'invasion, ont exigé que toutes les parties signent un document promettant leur allégeance mutuelle. Tous les dirigeants ont quitté le bâtiment avec des copies de l'accord. Il ne nous reste plus qu'à préparer une invasion de la péninsule du Sinaï pendant que les puissances occidentales se concentrent sur l'Égypte."
 OperationKadesh.2.d:0 "Avec notre inclusion dans le plan anglo-français visant à renverser Nasser, notre objectif était de sécuriser la péninsule du Sinaï pendant que les forces anglo-françaises attaquent le canal lui-même. En raison des limites imposées par le projet de ne pas démarrer l'opération par une frappe préventive sur les aérodromes égyptiens, nous devons plutôt utiliser des parachutistes pour sécuriser nos objectifs. Le 890e bataillon de parachutistes dirigé par le commandant Rafael Eitan a été largué aux abords est du col de Mitla et doit tenir plusieurs heures jusqu'à ce que le reste des parachutistes puisse les rattraper."
 OperationKadesh.3.d:0 "L'un de nos principaux objectifs était de mettre fin aux incursions des Fedayin en Israël. Alors que beaucoup s'attendaient à ce que des bases Fedayin soient situées à la fois à Gaza et dans la péninsule du Sinaï, Tsahal n'a trouvé aucune base Fedayin dans la péninsule du Sinaï et a donc décidé de détruire toute base Fedayin qu'elle pourrait trouver à Gaza. Après tout cela, nombreux sont ceux qui s'attendent à ce que les Fedayin soient gravement affaiblis et ne constituent plus une menace majeure."
 OperationKadesh.4.d:0 "Notre offensive principale dans la péninsule du Sinaï a véritablement commencé aujourd'hui, avec des forces se dirigeant vers Arish, Abu Ageila et le col de Mitla. L'opération Kadesh peut commencer dès maintenant."
 OperationKadesh.5.d:0 "Alors que le reste de l'opération se déroule à merveille, Tsahal a rencontré quelques difficultés pour capturer les importants carrefours routiers d'Abu Ageila et d'Um Katef. Après un assaut frontal infructueux, des renforts blindés ont aidé Tsahal à percer les lignes égyptiennes et à prendre virtuellement le contrôle de toute la péninsule nord du Sinaï."
 OperationKadesh.6.d:0 "Un autre endroit important à capturer est le col stratégique de Mitla, le même col vers lequel la 890e brigade de parachutistes a été dépêchée il y a plusieurs jours. Avec l'arrivée des renforts, les parachutistes commencèrent à prendre le contrôle du col de Mitla, entamant une longue et sanglante bataille contre l'armée égyptienne en défense. Un mythe se répand selon lequel le soldat Yehuda Ken-Dror a conduit une jeep dans le col de Mitla pour attirer le feu égyptien vers lui, se sacrifiant ainsi. Une fois la poussière retombée, 38 parachutistes ont été tués, 120 ont été blessés tandis que 260 Égyptiens gisaient morts. À ce stade, les Égyptiens sont en pleine retraite pour défendre le canal de Suez, mettant ainsi fin à la résistance dans le nord du Sinaï."
 OperationKadesh.7.d:0 "Tout en restant dans la péninsule du Sinaï, Tsahal a commencé à détruire les infrastructures égyptiennes pour entraver les avancées futures de l'Égypte. La destruction des infrastructures allait s'avérer être une épine dans le pied des Égyptiens pendant un certain temps."
 OperationKadesh.8.d:0 "L'armée israélienne a capturé aujourd'hui le port stratégique de Charm el-Cheikh, lui accordant le contrôle du sud du Sinaï et neutralisant le blocus égyptien dans les détroits de Tiran et d'Aqaba."
 OperationKadesh.9.d:0 "La pression internationale s'accentue sur nous, la Grande-Bretagne et la France pour qu'ils mettent fin à l'opération et se retirent respectivement du Sinaï et du canal de Suez. Cela a culminé avec les avertissements sévères des États-Unis et de l'URSS nous invitant à nous retirer du Sinaï. Bien que certains soient opposés au retrait, nous n'avons pas vraiment le choix car nous ne voulons pas susciter la colère des États-Unis."
 OperationKadesh.10.d:0 "Avec le succès de la poussée finale britannique, l'Égypte a été contrainte à une paix humiliante, rendant le canal de Suez à la Suez Canal Corporation (et effectivement à la Grande-Bretagne), et il lui est interdit de déplacer des soldats dans le canal. Le traité a également démilitarisé la péninsule du Sinaï après avoir promis notre retrait. Une péninsule du Sinaï démilitarisée était fortement soutenue en Israël et rares étaient ceux qui s'opposaient au retrait."
 OperationKadesh.11.d:0 "Depuis que nous nous sommes opposés au projet anglo-français visant à prendre le contrôle du canal de Suez, le haut commandement de Tsahal a commencé à concocter des plans pour mettre fin une fois pour toutes à la menace des Fedayin. Le plan nommé Opération Mapatz a commencé avec des parachutistes tombant sournoisement dans la bande de Gaza, un foyer d'activité des Fedayin, et faisant des ravages dans toutes les bases des Fedayin qu'ils pouvaient trouver, 2 heures après, des groupes mécanisés assisteraient les parachutistes dans leur mission qui a abouti à un grand succès et à un Fedayin grandement affaibli. Après l'opération, de nombreux experts estiment que la menace des Fedayin est définitivement écartée."
