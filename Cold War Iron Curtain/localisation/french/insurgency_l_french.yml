 KURD_SIX_DAY.1.d:0 "Le gouvernement du Kurdistan est confronté à une opportunité potentielle. Alors que Damas est engagé dans une guerre contre Israël, sa frontière avec le Kurdistan est difficilement défendue. Les hauts commandants militaires pensent que les forces kurdes peuvent rapidement libérer les terres kurdes historiques de Hassaké et les fortifier bien avant que les Syriens ne puissent réagir. Même si les Syriens refusent d'accepter la situation, le conflit en Israël et ses conséquences empêcheront la Syrie d'envoyer une force écrasante à Hassaké. Les commandants militaires pensent que les Syriens finiront par accepter la situation. D'autres membres du cabinet préviennent qu'une telle aventure militaire aliénerait tous les États voisins comptant une importante population kurde et risquerait de laisser le pays isolé diplomatiquement. Cependant, il existe un fort désir au sein de la population que la mission du Kurdistan soit d'unir tous les Kurdes."
 KURD_SIX_DAY.2.d:0 "Les forces armées du Kurdistan ont réussi à franchir la frontière et à occuper Hassaké. Les gardes-frontières syriens étaient trop peu nombreux pour offrir une résistance efficace et l'opposition a été vaincue. Au fur et à mesure que les troupes kurdes avançaient, elles rencontrèrent des Kurdes locaux venus en masse acclamer leurs libérateurs. Le gouvernement kurde, depuis l'indépendance, a établi des liens avec ces communautés et ces investissements ont porté leurs fruits. Hassaké étant occupée et les forces kurdes retranchées, le gouvernement syrien a annoncé qu'il ne contesterait pas cette action. Il a déclaré que le Kurdistan était un traître à la foi et un traître pour leurs actions, mais a ajouté que la lutte contre le sionisme était l'objectif principal du peuple syrien. Le gouvernement du Kurdistan a annoncé qu'il avait réussi à libérer les Kurdes syriens et qu'il était sur la bonne voie pour parvenir à l'unification de tous les Kurdes. Les voisins du Kurdistan n'ont pas été impressionnés par de telles déclarations et ont condamné cette action."
 KURD_SIX_DAY.3.d:0 "Lorsque l'armée du Kurdistan a lancé son invasion surprise de Hassaké, elle avait calculé que la résistance syrienne serait minime en raison de sa guerre en cours avec Israël. Cependant, cela s'est avéré être une erreur de calcul puisque la résistance syrienne a stoppé l'avancée kurde. Même si de nombreux Kurdes syriens sont venus soutenir leurs libérateurs, la résistance syrienne a incité les résidents non kurdes à rejoindre ouvertement la résistance. Alors que la situation se prolonge, le gouvernement du Kurdistan a annoncé qu'il se retirerait de Hassaké, mais a ajouté qu'il n'oublierait jamais sa mission sacrée d'unifier tous les Kurdes. De nombreux Kurdes syriens, craignant des représailles, évacuent avec ces forces, soulignant l'échec de l'opération. Le gouvernement syrien a jubilé dans sa réponse, déclarant avoir déjoué un complot traître visant à poignarder la nation dans le dos. Ils ont ajouté que ce succès à Hassaké reflète l'esprit victorieux du peuple syrien et sa marche inévitable vers la victoire contre tous ses ennemis."

 Iraqi_Kurdish_War_First:0 "La première guerre irako-kurde"
 Iraqi_Kurdish_War_First_desc:0 "Après la révolution irakienne, le nouveau gouvernement a cherché à travailler en étroite collaboration avec les dirigeants kurdes qui avaient autrefois combattu contre l'ancien gouvernement. Cela a conduit à une alliance entre le Parti démocratique kurde (PDK) et le gouvernement irakien. Cependant, ces dernières années, le gouvernement irakien a refusé d'accepter les demandes d'autonomie du PDK. Cela a suscité de l'animosité et après que le PDK ait vaincu les tribus pro-iraquiennes et expulsé les responsables du gouvernement irakien du Kurdistan, Bagdad a déployé ses forces. Aujourd'hui, le gouvernement irakien se bat contre les guérilleros kurdes pour le statut du Kurdistan.\n\nStatut actuel :\n[IRQ.GetNameDef]: [?IRQ.KURD_insurgency] Points de victoire\n[KUR.GetNameDef]: [?KUR.KURD_insurgency] Points de victoire\n\nFinancement étranger mensuel pour [KUR.GetNameDef]: [?KUR.global_kurd_funding] millions\n\nREMARQUE : Le premier camp à atteindre 1 000 points de victoire remportera ce conflit"


 Rawanduz_Campaign.1.d:0 "La guerre du Kurdistan ne se déroule pas comme l'espérait le gouvernement irakien. Malgré une puissance de feu supérieure et un nombre important de soldats, les forces irakiennes se sont souvent enlisées dans les tactiques de guérilla du Parti démocratique kurde (PDK). Le PDK connaissait bien le terrain et bénéficiait d'un soutien local. L'armée irakienne a décidé de lancer une opération massive à Rawanduz pour écraser le PDK et inverser la tendance contre les rebelles. Sécuriser Rawanduz détruira une énorme base du PDK et aidera les Irakiens à interrompre les approvisionnements du PDK en provenance de l'étranger. Le gouvernement irakien est convaincu que s'il engage une force suffisamment importante, le PDK sera incapable de résister. Le plan prévoit que neuf brigades irakiennes se divisent en deux forces et constituent une grande pince pour piéger et détruire les rebelles kurdes"
 Rawanduz_Campaign.2.d:0 "Des nouvelles désastreuses sont arrivées aujourd'hui à Bagdad concernant les opérations militaires irakiennes pendant la campagne de Rawanduz. Même si l'offensive se déroulait bien, au cours des deux derniers jours, nous avons appris qu'une brigade entière de nos forces avait été anéantie par les combattants rebelles kurdes du Parti démocratique kurde (PDK). Le commandant de la brigade a décidé d'établir un camp dans une vallée entre le mont Handrin et le mont Zozik. Cependant, il n'a pas réussi à établir des postes dans les collines et les montagnes environnantes, dont les combattants kurdes en ont profité. Utilisant ces hauteurs, ils anéantirent la brigade, infligeant des milliers de victimes, tout en en capturant des milliers. Les survivants auraient déserté, ne laissant rien intact de la brigade. Cette défaite a brisé le moral de nos forces d'attaque et l'ordre a été donné d'arrêter l'offensive. La campagne de Rawanduz est devenue une défaite humiliante et peu de gens oublieront jamais le désastre qu'a été la bataille du mont Handrin."
 Rawanduz_Campaign.3.d:0 "Le commandant irakien de la campagne de Rawanduz a déclaré par radio à Bagdad que le mouvement en tenaille était un succès. Plusieurs milliers de combattants kurdes ont été pris au piège et nos forces ont pu les encercler et les détruire grâce à leur écrasante supériorité en puissance de feu et en hommes. Avec cette victoire, nous avons nettoyé la région des rebelles kurdes et, plus important encore, nous avons coupé leur accès à l'aide étrangère. Le cours de la guerre a tourné en notre faveur. Les combattants kurdes doivent désormais lutter pour récupérer leurs pertes et reconstituer leurs approvisionnements. Le gouvernement a déjà annoncé qu'il décernerait une série de récompenses en reconnaissance de cette offensive et la confiance de l'armée irakienne n'a jamais été aussi grande."

 Iraqi_Kurdish_War.11.d:0 "Le gouvernement irakien et le Parti démocratique kurde ont officiellement signé un accord mettant fin à la guerre kurde. Les Irakiens ont accepté de reconnaître le Kurdistan comme un pays indépendant. Au moment de la signature du traité, les derniers convois de troupes irakiennes quittaient les frontières du Kurdistan. Malgré une série d'offensives et d'âpres combats, les combattants du PDK sont sortis victorieux. L'armée irakienne a été gênée par un leadership médiocre et par le recours à des soldats conscrits, peu motivés à combattre dans un pays qui leur était hostile. En revanche, les combattants du PDK étaient très motivés et combattaient sur leurs propres terres, mobilisant avec succès des soutiens et utilisant le terrain contre les Irakiens. Même si la motivation initiale du PDK était l'autonomie, la violente réponse irakienne et les victoires majeures ont convaincu le PDK de s'emparer de l'indépendance. Le Kurdistan rejoint le monde en tant que nouvelle nation et a promis de devenir une patrie pour les Kurdes de toute la région."

 Iraqi_Kurdish_War.0.d:0 "Après la révolution irakienne, le nouveau gouvernement s'est réconcilié avec le leader populaire kurde et rebelle Mustafa Barzani. Barzani est rapidement devenu le chef du Parti démocratique kurde (PDK) et a plaidé pour l'autonomie promise par le gouvernement irakien. Le gouvernement irakien est devenu de plus en plus préoccupé par le PDK alors qu'il soulevait les troubles parmi les Kurdes suite à l'échec de l'obtention de l'autonomie. Une tentative du gouvernement irakien d'utiliser des tribus kurdes rivales pour vaincre Barzani s'est soldée par un échec et le PDK a rapidement expulsé les responsables du gouvernement irakien du Kurdistan. Les Irakiens ont mobilisé leurs militaires et sont retournés au Kurdistan. S'engageant rapidement dans des combats intenses avec le PDK qui a concentré ses forces dans les montagnes et les villes pour mener une guérilla prolongée contre le gouvernement irakien. Le gouvernement irakien doit désormais faire face à un ennemi opérant sur un terrain difficile et bénéficiant d'un fort soutien local."
 Iraqi_Kurdish_War.12.d:0 "Le Parti démocratique kurde (PDK) résiste depuis des années aux offensives militaires irakiennes et exige constamment de Bagdad la reconnaissance de l'autonomie kurde. Le gouvernement irakien a finalement reconnu qu'il n'avait pas réussi à détruire le PDK ni à affirmer sa domination au Kurdistan et a signé un accord avec le PDK garantissant l'autonomie du Kurdistan. Une fois l'autonomie du Kurdistan assurée, le PDK a annoncé qu'il entamerait le processus de reconstruction du Kurdistan et des conséquences de la guerre sur la population. Le gouvernement irakien a cherché à minimiser sa capitulation face aux exigences kurdes, affirmant que le nouvel accord reflétait le désir de paix entre les Irakiens et montrait au monde l'engagement de l'Irak en faveur de la réconciliation nationale. Le gouvernement irakien a ajouté que l'accord n'était pas entre Irakiens et Kurdes mais entre frères irakiens. Malgré ces déclarations, au niveau international, l'accord est considéré comme une victoire du PDK contre le gouvernement irakien."
 Iraqi_Kurdish_War.10.d:0 "Le Parti démocratique kurde (PDK) a signé un accord de capitulation devant le gouvernement irakien. Le PDK a commencé la guerre en expulsant les responsables irakiens après avoir écrasé une tentative des Kurdes pro-irakiens d'affirmer leur autorité au Kurdistan. Le conflit qui en a résulté a vu l'armée irakienne lancer des offensives majeures pour déraciner et vaincre le PDK. Après une série d'opérations réussies, le PDK s'est vite rendu compte que la situation était désespérée et a accepté de se rendre. Dans un communiqué, le gouvernement irakien a souligné que sa victoire démontre la domination, le professionnalisme et le zèle de l'armée irakienne. Plus important encore, cela unifie l'Irak et montre au monde que l'unité irakienne ne pourra jamais être remise en question par le recours à des groupes mandataires comme le PDK. Cette série de combats s'est terminée en faveur de l'Irak. Cependant, nombreux sont ceux qui craignent que si le gouvernement rétablit sa politique autoritaire dans la province, il risque de s'aliéner les Kurdes à l'avenir."

 KUR_Insurgency_Options.1.d:0 "Nos combattants ont attaqué avec succès une base militaire irakienne hier. Alors que la plupart des forces irakiennes effectuaient un ratissage à grande échelle, nos forces se sont facilement échappées et ont attaqué la base à partir de laquelle elles opéraient. Les forces irakiennes présentes ont offert peu de résistance, la plupart fuyant ou se rendant alors que nos hommes prenaient rapidement le relais. Nous avons détruit du matériel, capturé des documents, des fournitures et des armes. Tout cela nous aidera dans notre lutte et fera peur aux conscrits irakiens que Bagdad a envoyés contre nous. Le commandant de nos combattants, tout en ramenant les hommes à leur refuge, a même réussi à tendre une embuscade à un petit détachement de troupes irakiennes qui s'était trop éloigné de la force principale."
 KUR_Insurgency_Options.2.d:0 "Un récent désastre est tombé sur l'un de nos commandants. Il avait repéré un avant-poste irakien à proximité de sa zone d'opération. Le poste semblait être peu occupé et destiné à servir de point d'observation. Son éloignement du corps principal des forces irakiennes a fait penser au commandant que les Irakiens avaient commis une erreur tactique et qu'il pouvait la prendre avec peu d'effort. Cependant, lorsque ses troupes se sont déplacées pour attaquer l'avant-poste, elles n'ont pas trouvé de conscrits irakiens terrifiés, mais l'avant-poste était occupé par des commandos d'infanterie légère irakiens. Ils ont tenu bon et ont infligé de lourdes pertes à nos forces. Nos hommes ont réussi à se retirer, mais les lourdes pertes et l'échec du raid ont sapé le moral du secteur. Les commandos irakiens, enhardis, patrouillent désormais ouvertement dans la zone."
 KUR_Insurgency_Options.5.d:0 "Hier, l'une de nos cellules urbaines opérant dans un grand village a bombardé avec succès un bâtiment du gouvernement irakien. Les courageux combattants ont constaté que le bâtiment manquait de sécurité et ont réussi à placer des explosifs à l'intérieur pendant la nuit. Les bombardements ont déjà conduit les fonctionnaires irakiens présents dans la ville à fuir vers Bagdad ou à rester chez eux. Nous devons continuer de montrer au peuple du Kurdistan que nous ne tolérerons pas l'ingérence du gouvernement irakien. Le gouvernement irakien tente déjà de faire revenir ces responsables et d'affirmer que la situation au Kurdistan est normale, mais des actions comme celles-ci mettent en évidence la fausseté de ces affirmations."
 KUR_Insurgency_Options.6.d:0 "Les membres d'une cellule urbaine de nos combattants ont été arrêtés hier par l'armée irakienne. Ils avaient prévu de bombarder un bâtiment utilisé par l'armée comme base dans l'une des plus grandes villes. Cependant, les Irakiens soupçonnaient qu'ils étaient surveillés par plusieurs de nos hommes et lorsque la cellule est revenue pour poser les explosifs, ils ont été arrêtés par les Irakiens. Les hommes ont été rapidement torturés et jugés par un tribunal militaire. Par ailleurs, les Irakiens soulignent la quantité d'explosifs qu'ils ont saisis et affirment que le PDK ne se soucie pas des civils kurdes qui auraient été tués dans la région. Cette propagande négative nuit à la cause."
 KUR_Insurgency_Options.3.d:0 "L'armée irakienne est composée de conscrits et d'officiers mal formés. Ils viennent également de l'extérieur du Kurdistan et manquent de connaissances sur la population ou le terrain. C'est un avantage pour notre groupe puisque notre service de renseignement a récemment lancé une opération visant à envoyer des Kurdes offrir des services de traduction aux forces irakiennes dans une zone d'opérations. Ils se font passer pour des membres de tribus progouvernementales et l'armée irakienne n'en a jusqu'à présent aucune idée. Nos hommes rapportent déjà d'excellentes informations sur le nombre, les mouvements et les tactiques des troupes irakiennes. En échange, nos hommes leur fournissent des informations anciennes et envoient des formations irakiennes dans des opérations de ratissage qui facilitent le mouvement de notre propre personnel au-delà des zones fortement fortifiées."
 KUR_Insurgency_Options.4.d:0 "L'armée irakienne est composée de conscrits et d'officiers mal formés. Ils viennent également de l'extérieur du Kurdistan et manquent de connaissances sur la population ou le terrain. C'est un avantage pour notre groupe puisque notre service de renseignement a récemment lancé une opération visant à envoyer des Kurdes offrir des services de traduction aux forces irakiennes dans une zone d'opérations. Ils se font passer pour des membres de tribus progouvernementales, mais l'opération s'est avérée un échec. Parmi les forces irakiennes présentes dans cette zone se trouvait un officier du renseignement ayant une expérience au Kurdistan. Il a réalisé la ruse et, après une série de tests, a pu déraciner nos espions de l'unité dans laquelle il était stationné. Cela a entravé notre collecte de renseignements et les informations obtenues auprès des infiltrés alerteront sans aucun doute d'autres formations irakiennes de nos tactiques d'infiltration et les rendront plus difficiles."
 IRQ_Insurgency_Options.1.d:0 "Notre régiment d'infanterie légère a remporté hier une victoire impressionnante sur les combattants du PDK. Alors qu'une unité voisine menait une opération de ratissage, les troupes d'infanterie légère ont observé des preuves indiquant qu'une bande de combattants kurdes s'était échappée. Ils les ont suivis jusqu'à un petit camp et ont lancé un assaut. L'ennemi n'était pas préparé car nos hommes ont infligé des pertes et fait des prisonniers. Les survivants s'enfuirent terrorisés. Nous avons obtenu des renseignements et capturé des armes ennemies, le quartier général déterminera l'origine de leurs armes. Ce succès a amené certains membres du commandement supérieur à remettre en question l'utilisation de grandes formations pour les ratissages et à utiliser à la place des unités plus petites dotées d'un personnel mieux formé."
 IRQ_Insurgency_Options.2.d:0 "Nos sources de renseignement ont identifié un avant-poste du PDK sur un poste de montagne. Le commandant sur le terrain pensait que le poste paraissait petit et pensait qu'un assaut général sécuriserait la position et semerait la peur chez l'ennemi. Cependant, cela s'est avéré désastreux, car alors que nos hommes se dirigeaient vers le poste, l'ennemi a infligé d'énormes pertes depuis ses positions élevées. Beaucoup de nos forces ont perdu leur sang-froid et ont commencé à fuir après qu'il soit devenu évident que l'assaut échouait. Cet échec met en évidence le manque de conscience tactique des commandants et met en évidence les difficultés liées au recours à d'importantes forces de conscription dans de telles opérations."
 IRQ_Insurgency_Options.5.d:0 "L'armée de l'air irakienne a bombardé avec succès hier plusieurs villages ennemis soupçonnés d'être des bases du PDK. Ils ont utilisé des munitions au napalm récemment acquises pour dévaster complètement les positions ennemies et démontrer la puissance écrasante de nos forces. En raison des opérations ennemies dans la région, il était clair que les villages maintenaient et hébergeaient des combattants dans les collines voisines. Les précédentes tentatives visant à atteindre les villages avec des troupes terrestres s'étaient soldées par un échec. Un avion d'observation a noté que les sites ciblés avaient été en grande partie éviscérés par les bombardements et les a qualifiés de succès. Les opérations ennemies dans la région ont sensiblement diminué. Les Kurdes locaux seront désormais moins susceptibles de soutenir le PDK et le moral de l'ennemi s'en trouve affaibli."
 IRQ_Insurgency_Options.6.d:0 "L'armée de l'air irakienne a bombardé hier une position ennemie soupçonnée d'abriter des combattants du PDK. Les avions ont utilisé des munitions au napalm récemment acquises pour dévaster complètement les positions ennemies et démontrer la puissance écrasante de nos forces. Suite au bombardement, une patrouille terrestre est arrivée mais s'est heurtée à des foules hostiles. Apparemment, nos pilotes s'étaient trompés de site et avaient touché une zone contrôlée par les Kurdes pro-gouvernementaux. Ces villageois ont réagi avec colère envers nos hommes et il semble que nous ayons perdu le soutien de la population locale, ce qui entravera les futures opérations dans la région."
 IRQ_Insurgency_Options.3.d:0 "Le PDK considère depuis longtemps nos militaires comme incompétents et incapables en termes de personnel et de tactique. Cependant, nos services de renseignement sont engagés depuis longtemps dans des opérations d'infiltration et de collecte de renseignements. Récemment, l'un de nos agents du renseignement a mis en oeuvre avec succès une politique visant à inciter les partisans kurdes pro-irakiens à rejoindre les groupes locaux du PDK. Jusqu'à présent, l'opération a été un succès et ils nous fournissent des renseignements sur les tactiques, l'équipement, la situation des approvisionnements du PDK et même le soutien que les combattants locaux reçoivent de nos ennemis étrangers. Des opérations plus réussies comme celle-ci nous permettront de saper et finalement de déraciner toutes les bandes du PDK en Irak."
 IRQ_Insurgency_Options.4.d:0 "Le PDK considère depuis longtemps nos militaires comme incompétents et incapables en termes de personnel et de tactique. Cependant, nos services de renseignement sont engagés depuis longtemps dans des opérations d'infiltration et de collecte de renseignements. Récemment, l'un de nos agents du renseignement a mis en oeuvre avec succès une politique visant à inciter les partisans kurdes pro-irakiens à rejoindre les groupes locaux du PDK. L'opération a été un succès majeur, mais le commandant militaire local a décidé d'agir directement sur la base de ces renseignements et a lancé une série d'opérations réussies dans sa région. Bien que le commandant ait reçu une promotion, son mépris flagrant dans sa tentative de protéger nos actifs a éveillé les soupçons du PDK et ils ont capturé nos infiltrés. Nous n'avons pas seulement perdu des sources clés de renseignements, mais le PDK apprendra désormais comment nous les avons infiltrés et les opérations futures seront beaucoup plus difficiles à mettre en oeuvre."
 
