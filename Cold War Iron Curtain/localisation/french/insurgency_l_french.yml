 Sarin_Attack_The_Kenyan_Land_and_Freedom_Army:0 "Insurgés contre le gaz avec du Sarin [?root.kna_current_country_state_decision.GetName]"
 VX_Attack_The_Kenyan_Land_and_Freedom_Army:0 "Insurgés contre le gaz avec VX dans [?root.kna_current_country_state_decision.GetName]"
 

 KLFA_insurgency_options.1.d:0 "Certains de nos agents domestiques spéciaux dont des proches travaillent dans l'agriculture ont réussi à infiltrer Mau Mau sans être détectés. Ils pourront désormais acquérir de nombreuses informations au sein de l'organisation, principalement grâce à la confiance familiale. Grâce à ce gain, nous serons en mesure de suivre les mouvements ennemis et de nous préparer à contrer des opérations majeures. Les SDA espèrent cependant que les membres de leurs familles seront graciés une fois l'insurrection réglée.\nCe succès aura des implications profondément positives et protégera notre nation"
 KLFA_insurgency_options.2.d:0 "Nos agents domestiques spéciaux ont tenté d'entrer à Mau Mau par l'intermédiaire de membres de la famille qui travaillent dans l'agriculture, mais cela s'est terriblement retourné contre eux. Les SDA faisaient trop confiance aux membres de leur famille et leur faisaient savoir qu'ils étaient des agents et qu'ils avaient été capturés et interrogés ou tués. De plus, certains agents ont même choisi leur famille plutôt que leur pays et leur ont donné des informations sur nos opérations anti-insurrectionnelles.\nCet échec est une tache sur notre bilan et aura des conséquences notables."
 
 KLFA_insurgency_options.3.d:0 "Une série de raids ruraux contre des villes abritant des insurgés de l'armée terrestre ont abouti à un succès retentissant. Des centaines d'insurgés ennemis gisent morts dans leurs maisons et leurs biens ont été saisis par l'État. Nous avons pris leurs armes et leur équipement pour nous-mêmes et tous les biens volés qu'ils possèdent sont désormais confisqués. La vente aux enchères des insurgés aujourd'hui décédés générera également un niveau de revenus considérable, dont la plupart seront probablement destinés à des incitations aux dirigeants.\nCe succès affaiblira leurs opérations futures et diminuera leur férocité."
 KLFA_insurgency_options.4.d:0 "Une tentative d'attaque de positions ennemies dans des villes rurales en utilisant les moyens de la police s'est retournée contre elle. De nombreux services de police locaux entretiennent des liens étroits avec l'ennemi et ont choisi cette opportunité pour poignarder les officiers loyalistes. Il existe désormais d'innombrables petites villes et villages entièrement contrôlés par les insurgés ennemis et échappant au contrôle du gouvernement. De plus, l'ennemi contrôle désormais un stock plus important d'armes et d'armes provenant des commissariats de police traîtres.\nCet échec affaiblira nos tentatives de les combattre dans la région et augmentera probablement leur férocité."
 
 KLFA_insurgency_options.5.d:0 "Les bombardiers incendiaires à réaction légère ont réussi à détruire de nombreuses zones de rassemblement et d'entraînement d'insurgés connues dans la nature. En plus d'effrayer les stagiaires potentiels, ces bombardements ont provoqué une fuite des cerveaux au sein de Mau Mau, de nombreux instructeurs ayant été tués, entraînant une pénurie d'entraîneurs compétents dans les rangs de Mau Mau. Une combinaison de fuite des cerveaux et d'effets de peur empêchera probablement l'ennemi de maintenir l'intensité de ses attaques.\nL'ennemi sera désormais moins capable de lancer des attaques et sera moins agressif à l'avenir."
 KLFA_insurgency_options.6.d:0 "Nos jets légers ciblaient les emplacements des leurres plutôt que nos cibles prévues. L'ennemi a lancé des embuscades AA contre nos avions et les a abattus alors qu'ils visaient les leurres bon marché. La perte de ces avions dans la zone d'opération permettra à l'ennemi d'être plus audacieux et de profiter de l'occasion pour devenir plus agressif et lancer des attaques qui pourraient normalement être empêchées par l'appui aérien.\nCet échec affaiblira la capacité de l'armée à combattre l'insurrection et à prévenir les attaques, les rendant ainsi plus agressives."
 
 KLFA_insurgency_options.10.d:0 "\nAprès des années de combats, Mau Mau a été réprimé et les quelques partisans qui lui restent ont trop peur pour se relever. La rébellion kenyane, qui souhaitait mettre fin au régime colonial, a été réprimée par les forces coloniales et a officiellement pris fin avec la capture de son chef, le maréchal Stanley Mathenge.\nLes autorités coloniales britanniques ont publié une déclaration selon laquelle, avec la fin de la rébellion, le Kenya restera probablement sous domination britannique pendant une très longue période. Reste à savoir si cela est vrai ou non, car de nombreux habitants du Kenya ont encore de sérieux problèmes avec la politique coloniale et cela pourrait déborder à l'avenir.\nQuoi qu'il en soit, Mau Mau a été détruit et la seule chose qui reste certaine quant à l'avenir est qu'ils n'en feront pas partie."
 KLFA_insurgency_options.11.d:0 "Après des années de combats, Mau Mau a réussi à renverser la domination coloniale britannique et à atteindre ses objectifs. La rébellion kenyane, qui souhaite mettre fin au régime colonial, a réussi à chasser les loyalistes coloniaux et à atteindre ses objectifs. Les garnisons coloniales ont été rasées, les loyalistes britanniques ont été expulsés ou tués et les armées de terre de Mau Mau retournent dans leurs fermes.\nLe chef du Mau Mau, le maréchal Stanley Mathenge, a annoncé lors d'une conférence de presse que cela ouvrirait une nouvelle ère d'indépendance africaine face à l'oppression coloniale et a promis de donner au Kenya \"tout ce qu'il mérite et qui lui a été refusé\".\nLe succès de Mau Mau marquera un nouveau chapitre de l'histoire du Kenya et portera un coup dur à l'empire britannique."
 
