 #Eritrean War
 ERI_Eritrean_War.1.d:0 "Alors que l'oppression de l'Érythrée se poursuit, un certain nombre de chrétiens de notre pays commencent de plus en plus à se joindre à cette cause. Ces partisans craignaient initialement la domination musulmane, mais considèrent désormais qu'une Érythrée indépendante est préférable au régime étranger actuel. Les Ethiopiens ont eux aussi désespérément besoin d'une aide locale et ont compté sur les chrétiens dans le passé. Nous avons utilisé cela à notre avantage lors d'une opération récente au cours de laquelle plusieurs partisans chrétiens ont rejoint le gouvernement éthiopien en tant que personnel de soutien dans d'importantes installations administratives et militaires. Jusqu'à présent, ces hommes ont fourni des renseignements sur la stratégie, les politiques et les mouvements de troupes éthiopiens."
 ERI_Eritrean_War.2.d:0 "Alors que l'oppression de l'Érythrée se poursuit, un certain nombre de chrétiens de notre pays commencent de plus en plus à se joindre à cette cause. Ces partisans craignaient initialement la domination musulmane, mais considèrent désormais qu'une Érythrée indépendante est préférable au régime étranger actuel. Cependant, il semble que nous ayons été trompés car une tentative de placer plusieurs partisans chrétiens auprès des Éthiopiens s'est soldée par un échec. Il semble que l'un des hommes ait rapidement fait défection et ait commencé à nous envoyer de fausses informations, nous conduisant à gaspiller des ressources ou à subir des pertes humaines dans des opérations infructueuses. Une fois que nous avons compris son double jeu, il a conduit ses agents éthiopiens à arrêter nos autres agents, faisant de l'opération un échec majeur en matière de collecte de renseignements."
 ERI_Eritrean_War.3.d:0 "Lorsqu'une patrouille de troupes éthiopiennes est arrivée pour entrer dans un camp militaire, notre commandant a réussi à tendre une embuscade au groupe, les attaquant de plusieurs côtés. Les troupes éthiopiennes ont subi des pertes ou ont fui la bataille. Nos hommes ont pu intervenir et capturer rapidement les armes et munitions abandonnées avant de s'éclipser. Au moment où l'armée éthiopienne a pu rassembler une force suffisamment importante pour riposter, nos combattants avaient disparu depuis longtemps."
 ERI_Eritrean_War.4.d:0 "Un de nos commandants trop confiant a commis une erreur coûteuse. Lors de récents combats, ses hommes avaient attaqué plusieurs postes de contrôle de la police, chassant facilement les policiers et capturant leurs armes. Cependant, il a décidé de cibler un point de contrôle militaire et son approche effrontée a exposé ses hommes. Les troupes éthiopiennes n'ont pas immédiatement abandonné leurs postes mais ont maintenu leurs positions et ont infligé de lourdes pertes parmi nos hommes. Bien que le commandant ait affirmé avoir infligé encore plus de pertes à l'ennemi, il est clair que la tentative d'attaque a été une erreur."
 ERI_Eritrean_War.5.d:0 "L'occupation illégale de l'Érythrée par les Éthiopiens a pris un coup dur aujourd'hui après qu'un groupe de nos partisans a fait exploser un bâtiment municipal dans une grande ville. La structure a été construite après l'occupation éthiopienne et de nombreux Éthiopiens amenés à administrer illégalement notre peuple ont utilisé le bâtiment. Les victimes sont encore inconnues, mais l'attaque a déjà conduit certains Éthiopiens résidant dans la ville à commencer à préparer leur départ. Avec ce succès, nous avons montré que le peuple ne tolérera pas l'occupation étrangère."
 ERI_Eritrean_War.6.d:0 "Une tentative de bombardement d'une base militaire éthiopienne s'est soldée par un échec cuisant. Nos hommes pensaient pouvoir infiltrer la base depuis une partie mal éclairée du périmètre mais une fois à l'intérieur, ils ont été immédiatement capturés par une patrouille. Nous attendons des Éthiopiens qu'ils punissent sévèrement nos hommes et qu'ils rendent public leur succès. L'échec de cette mission a affaibli le moral et porté atteinte à notre réputation auprès de la population, car nous affirmons que nos hommes ne pourront jamais être capturés."
 
 ETH_Eritrean_War.1.d:0 "Historiquement, les nombreux clans érythréens ont longtemps été rivaux les uns des autres, et le mouvement indépendantiste initial a été en proie à de nombreuses factions et luttes intestines. Même si les rebelles semblent désormais beaucoup plus unis, ces vieilles rivalités persistent. Pour exploiter cet avantage, nos services de renseignements se sont récemment rapprochés d'un clan qui convoite une position plus élevée au sein du mouvement rebelle. Ils ont accepté de nous fournir de précieux renseignements sur leur rival et de saper les opérations de ce clan en échange d'argent et d'un accès à l'éducation et aux soins de santé à l'étranger. Grâce à ces informations, nous avons réussi à déraciner les rebelles d'une zone clé. Le clan a également convenu de plaider en faveur d'une résolution du conflit et de minimiser les activités rebelles dans ses régions."
 ETH_Eritrean_War.2.d:0 "Historiquement, les nombreux clans érythréens ont longtemps été rivaux les uns des autres, et le mouvement indépendantiste initial a été en proie à de nombreuses factions et luttes intestines. Même si les rebelles semblent désormais beaucoup plus unis, ces vieilles rivalités persistent. Nous avons tenté de mener une opération au cours de laquelle nos agents des renseignements ont approché un clan en lui proposant de l'argent liquide et un accès aux soins de santé et à l'éducation à l'étranger. En échange, le clan nous fournirait des renseignements essentiels sur ses rivaux et garantirait qu'ils réduiraient les activités rebelles à mesure qu'elles devenaient plus importantes. Cependant, cette récente opération s'est avérée un échec, le clan a collecté de l'argent auprès de nous puis a saisi nos agents. Nous pensons qu'ils font l'objet d'interrogatoires intenses et craignons que certains de nos services de renseignement au sein du camp rebelle ne soient bientôt purgés."
 ETH_Eritrean_War.3.d:0 "Les forces érythréennes continuent de mener des attaques lâches et de se cacher parmi les civils. Cependant, lors d'une opération récente, un commandant audacieux a mené nos forces vers une grande victoire sur l'ennemi. Le commandant a identifié un village d'où provenaient les attaques et, lors d'un raid éclair, il a lâché des mortiers et des armes lourdes pendant que l'infanterie attaquait. Le choc de l'attaque a écrasé toute tentative de résistance et le village a été rapidement débarrassé des rebelles. Face à la puissance de l'armée éthiopienne, les combattants érythréens n'ont aucune chance."
 ETH_Eritrean_War.4.d:0 "Une unité de nos forces a décidé d'attaquer un camp présumé rebelle érythréen. Les forces unies décidèrent d'utiliser des camions pour prendre l'ennemi par surprise. Toutefois, les Érythréens semblaient préparés à notre approche. Les hommes rencontrèrent un champ de mines ennemi et durent alors avancer à pied. À ce moment-là, l'ennemi fut informé de nos plans et s'était retranché. Nous avons subi de lourdes pertes avant d'atteindre le camp. Cependant, à ce moment-là, l'ennemi s'était retiré et avait emporté tous ses objets de valeur, faisant de l'attaque une erreur coûteuse."
 ETH_Eritrean_War.5.d:0 "Les Érythréens se déplacent de plus en plus en toute impunité, ce qui a été à notre avantage. Un chasseur de l'Air Force a observé un mouvement important d'hommes dans des véhicules. Nous les avons identifiés comme étant un convoi rebelle et un groupe de combattants modifiés pour des missions de bombardement a frappé le convoi. Les dégâts ont été immenses et lorsqu'une patrouille est arrivée sur place, elle a constaté que nous avions détruit un convoi transportant des hommes et des armes lourdes. L'interception de ce convoi aidera nos troupes dans leurs efforts pour déloger les rebelles érythréens."
 ETH_Eritrean_War.6.d:0 "Une unité de l'armée a signalé avoir essuyé des tirs depuis un point fort des rebelles érythréens et a fait appel à un appui aérien. Nous avons envoyé des combattants qui ont touché la cible signalée, mais il semble que les bombes soient tombées sur un champ désert et ont réussi à détruire du matériel agricole civil. Aucune victime n'a été signalée et s'il y en a, il est peu probable qu'il s'agisse de rebelles. Nous soupçonnons que l'unité qui a signalé avoir pris feu a peut-être entendu un bruit fort provenant de la ferme elle-même et a paniqué. Heureusement, leurs coordonnées n'ont pas touché la ferme elle-même. Cette opération s'est avérée être un gaspillage de ressources et les rebelles ont répandu des rumeurs selon lesquelles nos forces bombardaient des fantômes."
 
 ERI_Eritrean_War.10.d:0 "Le Front de libération de l'Érythrée (ELF) est devenu le premier groupe nationaliste anti-éthiopien et érythréen à la suite de l'annexion unilatérale de l'Érythrée par l'Éthiopie. Ils ont d'abord combattu l'occupation avec des armes obsolètes ou des armes de fortune, mais au fil du temps, ils ont acquis des armes et des tactiques plus sophistiquées. Pourtant, malgré leurs efforts, l'armée éthiopienne a réussi non seulement à résister à ses tactiques de guérilla, mais, après une série de victoires, elle a en grande partie déraciné le FLE. La résistance dans toute l'Érythrée est en grande partie terminée et même les manifestations de rue ont cessé. Il semble que le peuple érythréen reconnaisse que l'Éthiopie est là pour rester et que résister ne fait qu'inviter davantage de punitions. Il faudra voir si l'Éthiopie peut transformer cette occupation militaire en une zone administrative appropriée. S'il n'y parvenait pas, il pourrait y avoir davantage de troubles à l'avenir, mais pour l'instant, l'Éthiopie a écrasé le FLE."
 ERI_Eritrean_War.11.d:0 "Après des années de lutte, d'abord contre le colonialisme italien, puis contre l'occupation britannique et enfin contre la domination éthiopienne, le peuple érythréen peut enfin être indépendant. Sous la direction du Front de libération de l'Érythrée (ELF), le peuple érythréen a dépassé ses propres conflits internes pour s'unir dans sa mission visant à chasser le joug de la domination éthiopienne. Cet objectif a été atteint suite à une série de victoires militaires et à la reconnaissance par le gouvernement éthiopien du fait que la poursuite de la guerre n'aboutirait pas à une victoire. Maintenant que l'Érythrée est devenue un État indépendant, nombreux sont ceux qui observeront si le factionnalisme qui sévit dans la région reviendra en force."
 ERI_Eritrean_War.15.d:0 "Le peuple érythréen a longtemps été mécontent de la façon dont l'Éthiopie a pris le contrôle de ses terres longtemps après l'évincement de ses maîtres coloniaux italiens. L'établissement des coutumes, de la gouvernance et du peuple éthiopiens était considéré comme une menace fondamentale pour le mode de vie érythréen. Le premier mouvement indépendantiste érythréen avait été en proie à des conflits internes, mais après l'annexion, ces clans et factions doivent désormais s'unir au sein du Front de libération érythréen (ELF). La guerre commença avec la bataille d'Adal. Un groupe de résistants érythréens, mal armés et sans direction adéquate, a réussi à vaincre et à chasser la police et le personnel militaire éthiopiens d'Adal. De nombreux Érythréens affluent désormais pour rejoindre le FLE, mais le gouvernement éthiopien mobilise également ses propres forces pour faire face aux troubles."

 
 Eritrean_War:0 "£ELF_Icon La guerre d'indépendance de l'Érythrée £ETH_Icon"
 Eritrean_War_desc:0 "Les Érythréens pensaient que le colonialisme prendrait fin après la Seconde Guerre mondiale et le colonialisme italien. Cependant, les Britanniques ont pris le territoire comme protectorat. Suite à cela, elle a été placée comme une fédération de l'Éthiopie, mais le gouvernement éthiopien a finalement simplement annexé l'Érythrée. Cette décision a incité les Érythréens, en particulier sa population musulmane, à rejoindre le groupe indépendantiste du Front de libération de l'Érythrée et à résister militairement à ce qu'ils considèrent comme des occupants éthiopiens. L'Éthiopie considère l'Érythrée comme une partie naturelle de son territoire et est déterminée à mettre fin à la résistance à ce qu'elle considère comme son juste gouvernement.\n\nStatut actuel :\nLes [ETH.GetName]: [?ETH.ERITREA_insurgency] Points de Victoire\nLes [ERI.GetName]: [?ERI.ERITREA_insurgency] Points de victoire\n\nFinancement étranger mensuel pour [ERI.GetNameDef]: [?ERI.global_eri_funding] millions\nFinancement étranger mensuel pour [ETH.GetNameDef]: [?ETH.global_eth_funding] millions\n\nREMARQUE : Le premier camp à atteindre 3 000 points de victoire remportera ce conflit"
 
