 FLN_decisions:0 "£FLN_Icon Le Front de Libération Nationale"
 FLN_decisions_desc:0 "£FLN_Icon Le FLN (Front de Libération Nationale) est un parti nationaliste algérien qui souhaite une indépendance et une souveraineté totale par rapport à la France. Le FLN est un groupe militant dissident du Mouvement pour le triomphe des libertés démocratiques et adopte une approche stricte contre la dissidence et la domination française. Bien que l'indépendance soit massivement soutenue dans toute l'Algérie, un nombre important d'Algériens s'opposent au groupe, notamment des dissidents politiques menacés et des personnes préoccupées par les motivations derrière l'insurrection du FLN.\n\nPour que la France gagne, la main d'oeuvre algérienne doit être épuisée au point que la résistance soit intenable, les 3 centres de conflit doivent avoir un réservoir de main d'oeuvre algérienne de 0.\n\nEffectif algérien actuel :\nBouira [?1587.ALG_deployed_manpower]\nOran [?513.ALG_deployed_manpower]\nConstantin [?460.ALG_deployed_manpower]"
 The_Algerian_National_Liberation_Front_Uprising:0 "La fin de l'Algérie française"
 Liquidate_The_Algerian_National_Liberation_Front:0 "Mettre fin au soulèvement algérien"
