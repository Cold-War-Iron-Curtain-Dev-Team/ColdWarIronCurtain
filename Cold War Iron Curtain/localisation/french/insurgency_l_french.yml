 uia_decisions:0 "£UIA_Icon L'armée insurrectionnelle ukrainienne"
 uia_decisions_desc:0 "Fondée en 1942, l'Ukrayinska Povstanska Armiya \n(UPA) a lutté contre l'invasion nazie, la guerre soviétique \ncontre-attaque sur les terres ukrainiennes, et a même trouvé \nlui-même dans des engagements sanglants contre les Polonais \nÉtat clandestin, le tout dans le but de créer un \nétat ukrainien indépendant et aligné sur l'Allemagne. \n\n\n\n\n\n\n\n\nMême si des poches de résistance existent encore dans le \nCarpates, le gros des paramilitaires nationalistes \nle groupe a été officiellement écrasé sous la botte de \nle §RArmée rouge§!et le §RNKVD§! s'efforcent d'éradiquer \nle peu qui reste.\n\nForce actuelle : [?ROOT.core_resistance@UIA|R]% | État actuellement sélectionné : [?root.current_country_state_decision.GetName]\n\nType d'insurrection : §YGuerre libre§!"
 11_ins_tt:0 "Le compteur d'insurrection baissera de 1 pour cette insurrection particulière" 
 22_ins_tt:0 "Le compteur d'insurrection diminuera de 2 pour cette insurrection particulière"
 33_ins_tt:0 "Le compteur d'insurrection diminuera de 3 pour cette insurrection particulière"
 UIA_UI_DESC:0 "Fondée en 1942, l'Ukrayinska Povstanska Armiya (UPA) a lutté contre l'invasion nazie, la contre-attaque soviétique sur les terres ukrainiennes et s'est même retrouvée dans des engagements sanglants contre l'État clandestin polonais, le tout dans le but de créer un État ukrainien indépendant et aligné sur l'Allemagne. Bien que des poches de résistance existent encore dans les Carpates, la majeure partie du groupe paramilitaire nationaliste a été officiellement écrasée." 

