 The_Evian_Accords:0 "Les accords d'Évian"

 FLN_insurgency_options.0.d:0 "Les célébrations de la Toussaint en Algérie ont été interrompues par de nombreuses attaques brutales et directes de groupes insurgés contre les intérêts français dans la région. Le FLN (Front de Libération Nationale) a revendiqué l'entière responsabilité et diffuse une liste de ses revendications qui incluent l'indépendance totale et le retrait de tous les avoirs français de la région.\n\nLe gouvernement français a nié la légitimité du FLN et devrait accroître la présence militaire française dans la région."

 FLN_insurgency_options.1.d:0 "Certains de nos agents spéciaux nationaux ont des contacts au sein de la communauté religieuse islamique et ont obtenu des faveurs pour les faire entrer dans les sectes les plus religieuses du FLN. Ils pourront désormais acquérir de nombreuses informations au sein de l'organisation. Grâce à ce gain, nous serons en mesure de suivre les mouvements ennemis et de nous préparer à contrer des opérations majeures. Les SDA ont cependant négocié que les chefs religieux et les membres de leurs familles soient graciés une fois l'insurrection réglée.\nCe succès aura des implications profondément positives et protégera notre nation"
 FLN_insurgency_options.2.d:0 "Nos agents spéciaux intérieurs ont tenté d'entrer dans le FLN grâce à leurs contacts dans la communauté religieuse, mais cela s'est terriblement retourné contre eux. Les SDA faisaient trop confiance à leurs contacts et leur faisaient savoir qu'ils étaient des agents et qu'ils avaient été capturés et interrogés ou tués. De plus, certains agents ont même choisi l'Algérie plutôt que la France et leur ont fourni des informations sur nos opérations anti-insurrectionnelles.\nCet échec est une tache sur notre bilan et aura des conséquences notables."
 FLN_insurgency_options.3.d:0 "Une série de raids urbains contre des villes abritant des bastions du FLN ont abouti à un succès retentissant. Des milliers d'insurgés ennemis gisent morts dans leurs bases et leurs biens ont été saisis par le commandement colonial français. Nous avons pris leurs armes et leur équipement pour nous-mêmes et tous les biens volés qu'ils possèdent sont désormais confisqués. Ces atouts stratégiques qu'ils ont perdus leur coûteront cher et affecteront négativement les futures opérations du FLN.\nCe succès affaiblira leurs opérations futures et diminuera leur férocité."
 FLN_insurgency_options.4.d:0 "Une tentative d'attaquer des positions ennemies dans des villes urbaines en utilisant des moyens militaires coloniaux s'est retournée contre elle. Les forteresses ennemies étaient bien trop enfouies et parvenaient à repousser les attaques et à étendre leur contrôle. Il existe désormais d'innombrables quartiers urbains entièrement contrôlés par les soldats ennemis et échappant au contrôle colonial. De plus, l'ennemi contrôle désormais un stock plus important d'armes et d'armes provenant des soldats en déroute ou décédés.\nCet échec affaiblira nos tentatives de les combattre dans la région et augmentera probablement leur férocité."
 FLN_insurgency_options.5.d:0 "Les bombardiers incendiaires à réaction légère ont réussi à détruire de nombreuses zones connues de ravitaillement et d'entraînement du FLN dans les zones rurales. En plus d'effrayer les stagiaires potentiels, ces attentats à la bombe ont provoqué une fuite des cerveaux au sein du FLN, de nombreux instructeurs ayant été tués, entraînant une pénurie d'entraîneurs compétents dans les rangs du FLN. Une combinaison de fuite des cerveaux et d'effets de peur empêchera probablement l'ennemi de maintenir l'intensité de ses attaques.\nL'ennemi sera désormais moins capable de lancer des attaques et sera moins agressif à l'avenir."
 FLN_insurgency_options.6.d:0 "Nos avions légers ont ciblé les zones d'entraînement et de ravitaillement hautement sécurisées dans les zones rurales contrôlées par le FLN. La présence importante de l'AA de l'ennemi a frappé nos avions et les a abattus avant qu'ils ne puissent frapper. La perte de ces avions dans l'AO permettra à l'ennemi d'être plus audacieux et de profiter de l'occasion pour devenir plus agressif et lancer des attaques qui pourraient normalement être empêchées par l'appui aérien.\nCet échec affaiblira la capacité de l'armée à combattre l'insurrection et à prévenir les attaques, les rendant ainsi plus agressives."
 
 FLN_insurgency_options.10.d:0 "Après d'innombrables années, le Front de Libération Nationale algérien s'est effondré, ses derniers atouts étant dispersés et son soutien diminué. Le gouvernement français a proclamé sa victoire sur le FLN et a rétabli le contrôle total de la région. Même si les feux de la révolution s'éteignent, la région restera instable du fait de la guerre. Ce qui arrivera à l'Algérie à l'avenir est incertain. Cependant, une chose est sûre ; L'Algérie restera française."
 FLN_insurgency_options.11.d:0 "L'armée algérienne a revendiqué une victoire décisive sur les forces françaises dans la capitale et a forcé le retrait. Après une longue série de batailles et de nombreuses victoires stratégiques, le FLN algérien a envahi la plupart des bastions militaires français et a fait payer un lourd tribut au gouvernement français pour occuper l'Algérie.\n\nGrâce à cette victoire et à d'innombrables autres erreurs sur le front, l'Algérie devrait assurer militairement son indépendance de la France et imposer la victoire selon ses propres conditions."
 FLN_insurgency_options.15.d:0 "Après des années de conflits et de conflits sans fin, les gouvernements algérien et français ont accepté de signer les accords d'Evian finalisés. Ce traité officialisera non seulement un cessez-le-feu entre les deux nations, mais organisera également un échange de coopération entre les deux pays.\n\nLes arrangements garantiront la souveraineté et l'autodétermination du gouvernement algérien et garantiront la protection, la non-discrimination et les droits de propriété des citoyens algériens. De plus, l'Algérie recevra une aide de la France pour faciliter la croissance économique du pays. Les accords font également un compromis avec le gouvernement français pour permettre à la France de conserver sa primauté sur les réserves pétrolières sahariennes, la protection de plusieurs groupes nationaux et ethniques et plusieurs autres avantages."
 
 War_Exhaustion_Modifier:0 "Épuisement de guerre"
 
 UPC_decisions:0 "La guerre Bamiléké"
 UPC_decisions_desc:0 "£UPC_Icon L'UPC (Union des Populations du Cameroun) est une rébellion camerounaise qui aspire à la souveraineté nationale et à une économie socialiste. L'UPC est très complexe et repose sur un large éventail de structures militaires, mais elle n'est en aucun cas désorganisée. L'UPC a commencé une action militaire après avoir été officiellement interdite en tant que parti par le commissaire aux colonies français et ses émeutes ont été réprimées. L'UPC est également très agressive et ne tolère pas très bien les dissensions dans ses rangs ou au sein de la population. La rébellion s'appuie fortement sur le soutien du groupe ethnique autochtone Bamiléké et a des liens avec la République populaire de Chine qui leur fournit une formation et des armes\n\n Force actuelle : [?CMR.UPC_insurgency|R]%"
 
 Village_Clearing_Campaign_in_Northwestern_Cameroon:0 "Cibler les villages bamilékés du nord-ouest du Cameroun"

 The_Union_of_the_Peoples_of_Cameroon_Uprising:0 "L'Union des Populations du Cameroun"
 Liquidate_The_Union_of_the_Peoples_of_Cameroon:0 "Mettre fin à la guerre Bamiléké"
 The_Union_of_the_Peoples_of_Cameroon:0 "L'Union des Populations du Cameroun"
 Infilitrate_The_Union_of_the_Peoples_of_Cameroon:0 "Infiltrer les cellules insurgées de l'Union des Populations du Cameroun dans le nord-ouest du Cameroun"
 Raid_The_Union_of_the_Peoples_of_Cameroon:0 "Raid des forces de l'Union des Populations du Cameroun dans le nord-ouest du Cameroun"
 Bomb_The_Union_of_the_Peoples_of_Cameroon:0 "Bombardez les forces insurgées dans le nord-ouest du Cameroun"
 Sarin_Attack_The_Union_of_the_Peoples_of_Cameroon:0 "Les insurgés gaziers utilisent du Sarin dans le nord-ouest du Cameroun"
 VX_Attack_The_Union_of_the_Peoples_of_Cameroon:0 "Les insurgés du gaz avec VX dans le nord-ouest du Cameroun"
 
 
 UPC_insurgency_options.1.d:0 "Certains de nos agents domestiques spéciaux ont infiltré les rangs de l'UPC en se faisant passer pour des travailleurs socialistes dont les membres de la famille ont été blessés ou décédés à cause de la domination coloniale française. Ils pourront désormais acquérir de nombreuses informations au sein de l'organisation. Grâce à ce gain, nous serons en mesure de suivre les mouvements ennemis et de nous préparer à contrer des opérations majeures.\nCe succès aura des implications profondément positives et protégera notre nation"
 UPC_insurgency_options.2.d:0 "Nos agents nationaux spéciaux ont tenté d'entrer dans l'UPC en se faisant passer pour des socialistes dont la famille était blessée ou décédée, mais cela s'est terriblement retourné contre eux. Les SDA ont été interrogés trop profondément sur leurs proches et l'UPC a souhaité rencontrer les membres survivants de leurs familles pour les recruter. La façade s'est effondrée et les SDA ont été tués ou interrogés. De plus, certains agents sont eux-mêmes devenus socialistes et leur ont donné des informations sur nos opérations anti-insurrectionnelles.\nCet échec est une tache sur notre bilan et aura des conséquences notables."
 UPC_insurgency_options.3.d:0 "Une série de raids ruraux contre les villes abritant des bastions de l'UPC ont abouti à un succès retentissant. Des milliers d'insurgés ennemis gisent morts dans leurs centres opérationnels et leurs biens ont été saisis par le commandement colonial français. Nous avons pris leurs armes et leur équipement pour nous-mêmes et tous les biens volés qu'ils possèdent sont désormais confisqués. Ces atouts stratégiques qu'ils ont perdus leur coûteront très cher et affecteront négativement les futures opérations de l'UPC.\nCe succès affaiblira leurs opérations futures et diminuera leur férocité."
 UPC_insurgency_options.4.d:0 "Une tentative d'attaquer des positions ennemies dans des villes rurales en utilisant des moyens militaires coloniaux s'est retournée contre elle. Les positions ennemies étaient bien trop retranchées et parvenaient à repousser les attaques et à riposter contre les garnisons qui avaient lancé les attaques. Il existe désormais d'innombrables garnisons entièrement contrôlées par les rebelles ennemis et échappant au contrôle colonial. De plus, l'ennemi contrôle désormais un stock plus important d'armes et d'armes provenant des soldats en déroute ou décédés.\nCet échec affaiblira nos tentatives de les combattre dans la région et augmentera probablement leur férocité."
 UPC_insurgency_options.5.d:0 "Les bombardiers incendiaires à réaction légère ont réussi à détruire de nombreuses zones connues de ravitaillement et de formation de l'UPC dans des zones reculées. En plus d'effrayer les stagiaires potentiels, ces bombardements ont provoqué une fuite des cerveaux au sein de l'UPC, de nombreux instructeurs ayant été tués, entraînant une pénurie de formateurs compétents dans les rangs de l'UPC. Une combinaison de fuite des cerveaux et d'effets de peur empêchera probablement l'ennemi de maintenir l'intensité de ses attaques.\nL'ennemi sera désormais moins capable de lancer des attaques et sera moins agressif à l'avenir."
 UPC_insurgency_options.6.d:0 "Nos avions légers ont ciblé des zones d'entraînement et de ravitaillement hautement sécurisées dans des zones reculées contrôlées par l'UPC. L'importante présence de gardes AA de l'ennemi a attaqué nos avions et les a abattus avant qu'ils ne puissent frapper. La perte de ces avions dans la zone d'opération permettra à l'ennemi d'être plus audacieux et de profiter de l'occasion pour devenir plus agressif et lancer des attaques qui pourraient normalement être empêchées par l'appui aérien.\nCet échec affaiblira la capacité de l'armée à combattre l'insurrection et à prévenir les attaques, les rendant ainsi plus agressives."

 UPC_insurgency_options.0.d:0 "L'Union des Populations du Cameroun (UPC) a publié sa déclaration d'indépendance, des émeutes indépendantistes ont éclaté à Douala et Yaoundé. Bien que les autorités coloniales françaises aient réprimé les émeutes et interdit l'UPC, l'UPC a lancé une lutte armée contre les Français. Cette escalade vers la résistance armée marque la fin de plus de six années de tensions entre l'UPC et les autorités coloniales françaises. Les responsables français avaient cherché à réduire l'influence de l'UPC en supprimant le vote et en rejetant les efforts visant à négocier une transition pacifique vers l'indépendance, mais ces tactiques n'ont fait que pousser l'UPC à la guerre. Pour l'UPC, malgré une direction composée d'hommes profondément liés à la culture et à l'éducation françaises, sous Um Nyobe, ils se sont engagés dans une voie plus révolutionnaire. Cela a aliéné les autres élites camerounaises qui se tournent toujours vers la France et rejettent l'appel à la résistance de l'UPC. Ils préfèrent obtenir leur indépendance au sein du système colonial."
 UPC_insurgency_options.10.d:0 "\nLa campagne militaire française visant à établir des zones de pacification et à démanteler les rebelles de l'Union des populations du Cameroun (UPC) a poussé les combats vers l'ouest chez les Bamilékés. La première zone de pacification du Cameroun a vu la population placée sous haute surveillance, au sein de camps désignés. Ces efforts ont vu de nombreux dirigeants de l'UPC capturés et tués, mais des efforts similaires dans l'ouest n'ont pas complètement abouti. La décision de la France d'accorder l'indépendance au Cameroun n'a pas mis fin au conflit car l'UPC a continué de résister à ce qu'elle considérait comme un État fantoche français depuis ses bases à l'ouest. Le nouveau gouvernement camerounais a continué de compter sur le soutien militaire français tout en poursuivant une campagne anti-insurrectionnelle brutale qui a ravagé de nombreux villages bamilékés. Le récent assassinat d'un autre haut dirigeant rebelle semble avoir brisé les reins de la résistance, alors que le Cameroun semble avoir finalement vaincu les rebelles."
 UPC_insurgency_options.11.d:0 "Les Français et leurs alliés camerounais ont accepté aujourd'hui l'indépendance de la Bamilékia. Ce qui avait commencé comme une lutte anticoloniale s'est transformé en lutte pour l'indépendance du peuple bamiléké. Les Français et les Camerounais se sont tous deux engagés dans une politique d'établissement de zones de pacification pour contrôler et déraciner les rebelles. Cet effort dans les régions bamilékés du Cameroun a réussi à isoler les combattants de l'Union des populations du Cameroun (UPC) du reste du Cameroun, mais les a maintenus étroitement liés à la population bamiléké locale. Une alliance avec les combattants et les élites bamilékés a permis d'assurer l'échec des efforts des Français et de leurs alliés camerounais pour vaincre l'UPC. Beaucoup de Bamiléké semblent satisfaits de leur nouvelle nation et soutiennent une politique de reconstruction et de socialisme. Cependant, certains éléments considèrent la Bamilékia comme le gouvernement légitime du Cameroun et souhaitent poursuivre la lutte une fois que la nation se reconstruira."
 UPC_insurgency_options.15.d:0 "De nombreuses organisations de défense des droits de l'homme et nations ont déposé de graves griefs contre le gouvernement français et ses actions dans la guerre d'indépendance du Cameroun. Le gouvernement français aurait détruit des villages entiers, y compris des civils non rebelles.\n\nOn ne sait pas combien de civils ont été tués dans ces villages car les registres n'étaient pas correctement tenus et on ne sait pas combien d'entre eux ont fui ou ont échappé aux attaques des forces coloniales françaises. À l'heure actuelle, de très nombreuses preuves font surface contre le gouvernement français et de nombreux membres de la communauté internationale appellent à des mesures contre le gouvernement français."
 
 SSU_insurgency_options.1.d:0 "Le gouvernement et l'armée soudanaises sont tous deux divisés en factions belligérantes qui agissent constamment les unes contre les autres. L'une de ces factions a ouvert la communication avec nous et a déclaré qu'il serait dans son intérêt d'affaiblir les efforts des forces gouvernementales contre nos forces. L'un de nos agents a commencé à échanger des informations avec un haut responsable militaire soudanais de cette faction. Il échange déjà des renseignements sur les positions des troupes, le moral et les approches tactiques ; ces informations s'avéreront inestimables pour nos efforts."
 SSU_insurgency_options.2.d:0 "Dans le but de trouver un informateur local au sein des forces gouvernementales soudanaises, nous avons demandé à un déserteur des Forces de défense soudanaises de changer d'identité et de rejoindre une milice locale pro-gouvernementale. Avec sa connaissance antérieure de l'armée, nous avions espéré qu'il monterait rapidement dans la milice et fournirait des informations essentielles à nos forces. Il semblerait cependant qu'il ait été identifié par les forces gouvernementales qui ont réussi à le convaincre d'agir comme agent double. Nous nous en sommes rendu compte après que nos forces dans la région ont subi une série de revers et avant que nous puissions agir contre lui, il avait déjà dirigé un agent du gouvernement pour capturer les agents qui dirigeaient cet effort d'infiltration. L'ennemi a acquis des renseignements précieux et a considérablement affaibli l'influence d'Anyana dans la région."
 SSU_insurgency_options.3.d:0 "Un camp militaire local du gouvernement soudanais a été attaqué pendant la nuit. Nos forces étaient dirigées par un déserteur des Forces de défense soudanaises qui comprenait comment le camp serait protégé. L'ennemi semblait mal préparé et désorganisé, permettant à nos hommes de percer rapidement leurs défenses. L'opération éclair a infligé quelques pertes à l'ennemi, dont beaucoup ont simplement fui, mais plus important encore, nous avons capturé des armes et des munitions, essentielles à la cause."
 SSU_insurgency_options.4.d:0 "Le gouvernement soudanais a réussi à déjouer une tentative de raid de nos forces. Même si nos hommes ont eu l'effet de surprise, il semble qu'ils aient été repérés alors qu'ils se préparaient à l'assaut. Cela a permis à une petite force de combattants ennemis d'être ralliée par leur officier et ils ont rapidement contre-attaqué. Le choc de l'action ennemie a poussé nos combattants à se replier et à battre en retraite. Nous avons subi plusieurs pertes et certains hommes sont devenus prisonniers ennemis, ce qui a grandement remonté le moral de l'ennemi dans la région."
 SSU_insurgency_options.5.d:0 "Dans une zone stratégique, nos forces ont remarqué que les forces gouvernementales soudanaises tenaient un point de contrôle à un carrefour clé pendant la journée. Les villageois et les voyageurs étaient arrêtés et contrôlés dans l'espoir d'entraver la circulation des armes entre nos forces. En réponse à cela, le commandant local a réussi à placer des explosifs sur le site pendant la nuit. Lorsque les forces gouvernementales sont arrivées dans la matinée, les explosifs ont explosé, obligeant les forces gouvernementales à se retirer et à fuir la zone, ce qui a remonté notre moral et nous a permis de nous tenir parmi la population."
 SSU_insurgency_options.6.d:0 "Nos partisans ont identifié un poste de police local dans un petit village où certains de nos combattants et partisans locaux sont détenus. Nous avions prévu de bombarder le périmètre afin d'infliger des pertes aux forces ennemies qui gardaient l'installation et peut-être permettre à certains détenus de s'échapper. Cependant, nous avons sous-estimé la vigilance de l'ennemi et deux de nos hommes ont été capturés alors qu'ils tentaient de poser les explosifs. Le gouvernement a fait grand spectacle lors de son arrestation et a montré les bombes aux habitants, affirmant que nous ciblions des civils, nuisant ainsi à notre réputation dans la région."

 SUD_insurgency_options.1.d:0 "Les Anyanya sont criblés de factionnalisme et de désorganisation. Nos officiers du renseignement et nos militaires ont identifié un chef régional Anyana qui est devenu insatisfait de la cause et qui serait intéressé à devenir un chef de milice pour nous. Avant de l'intégrer, nous l'utilisons pour collecter des renseignements et des tactiques Anyanya contre nos forces. Avec cette infiltration réussie, nous espérons déraciner et briser complètement l'influence rebelle dans la région."
 SUD_insurgency_options.2.d:0 "Compte tenu de la diversité du Soudan du Sud, il a parfois été facile pour nos forces de se rallier et de lever des milices locales pour soutenir nos efforts visant à maintenir l'unité du Soudan. Une équipe d'agents des renseignements a cherché à capturer l'un des soldats de la milice locale et l'a envoyé rejoindre la force Anyanya opérant dans la région. Il fournirait des renseignements qui permettraient à nos hommes de déraciner les rebelles et d'arrêter leurs principaux partisans. Cependant, cette opération s'est avérée un échec puisque notre taupe semblait avoir fait défection. Une mauvaise planification de la part de nos propres agents a vu le transfuge identifier certains de nos partisans locaux dans le village et les combattants d'Anyanya ont réussi à cibler ces hommes et à capturer des armes dans l'armurerie locale."
 SUD_insurgency_options.3.d:0 "Un villageois manifestement sympathique à Anyanya a été traqué jusqu'à un camp local par un milicien local. Fort de ces renseignements, le commandant militaire local a conduit nos troupes à attaquer le camp rebelle d'Anyanya. L'opération s'est avérée un énorme succès puisque le campus a été pris par surprise. Bien que plusieurs rebelles se soient enfuis profondément dans la forêt, nous avons infligé des pertes et fait des prisonniers. Plus important encore, la plupart des fournitures et des armes du camp ont été saisies, affaiblissant sans aucun doute les opérations d'Anyanya dans la région."
 SUD_insurgency_options.4.d:0 "Un officier trop zélé, qui, nous le soupçonnons, cherchait peut-être une gloire rapide pour obtenir une promotion, a conduit ses hommes dans un piège ennemi. Le Soudan du Sud est un vaste territoire et le commandant a décidé de lancer un assaut nocturne contre un camp présumé d'Anyanya, au coeur des prairies. Les hommes étaient mal préparés et facilement repérables par l'ennemi. Au lieu de frapper le camp ennemi, nos forces ont été touchées par une embuscade ennemie, nous faisant subir des pertes. Plus humiliant encore, certains hommes ont même été capturés par les rebelles. Ce revers a nui au moral et le commandant régional craint que les forces gouvernementales présentes dans la région ne disparaissent si les rebelles attaquent."
 SUD_insurgency_options.5.d:0 "L'Armée de l'Air a compensé le manque d'équipements sophistiqués en modifiant les avions disponibles pour servir d'avions de reconnaissance et même d'appui aérien rapproché. L'ingéniosité de nos forces était évidente lorsque notre avion modifié a repéré un camp rebelle depuis les airs. Le pilote est entré en action et a touché l'ennemi. Lorsque nos forces sont arrivées au camp, elles ont constaté que les Anyanya avaient abandonné leurs victimes, leurs armes, leur nourriture et leurs documents. Les lâches rebelles craindront sans aucun doute l'air et les nouvelles de nos prouesses dans le ciel ont remonté le moral."
 SUD_insurgency_options.6.d:0 "L'Armée de l'Air a compensé le manque d'équipements sophistiqués en modifiant les avions disponibles pour servir d'avions de reconnaissance et même d'appui aérien rapproché. Cependant, malgré la créativité et le dévouement de nos pilotes, une opération récente s'est soldée par un échec majeur. Un avion effectuant une patrouille locale a repéré des combattants Anyanya en mouvement, le pilote a réagi et a largué plusieurs bombes sur l'ennemi. Cependant, il s'est avéré que le pilote avait heurté un groupe de membres d'une tribu migratrice. Nous ne sommes pas encore sûrs du nombre de victimes. Cet accident n'a fait qu'enhardir les forces ennemies dans la région et a nui à notre image dans la région."

 SSU_insurgency_options.10.d:0 "L'indépendance du Soudan a vu l'unification forcée du Nord et du Sud Soudan. L'administration et l'armée du nouvel État étaient dominées par les habitants du Nord. Cela a conduit à des tensions accrues, les habitants du sud se sentant rapidement réprimés par le nouveau gouvernement. Une série de mutineries et de manifestations dans le sud a vu une armée rebelle appelée Anyanya se former à partir de déserteurs et de forces rebelles. Après une série d'engagements entre le gouvernement soudanais et les Anyanya, un conflit d'usure brutal a éclaté. Pour mettre fin à la guerre civile et à cette impasse coûteuse, le gouvernement soudanais et les rebelles ont signé un accord à Addis-Abeba. L'autonomie du Soudan du Sud sera garantie dans le conflit soudanais, ce qui, espérons-le, mettra fin à la longue violence qui sévit dans le pays."
 SSU_insurgency_options.11.d:0 "Après l'indépendance du Soudan, la nouvelle administration et l'armée étaient dominées par les Soudanais du Nord. Cela a conduit à des tensions accrues, les habitants du sud se sentant rapidement réprimés par le nouveau gouvernement. Une série de mutineries et de manifestations dans le sud a vu une armée rebelle appelée Anyanya se former à partir de déserteurs et de forces rebelles. Bien que les Anyanya aient cherché à exploiter les factions au sein du gouvernement et de l'armée soudanaises, ils ont finalement échoué. L'armée soudanaise a réussi à surmonter ses problèmes et à coordonner ses efforts contre les rebelles. Les forces Anyanya furent rapidement déjouées, infiltrées et démantelées par les forces gouvernementales soudanaises. Une fois la victoire militaire assurée, le temps nous dira si le Soudan sera capable d'unir politiquement le pays."
 SSU_insurgency_options.12.d:0 "Après l'indépendance du Soudan, la nouvelle administration et l'armée étaient dominées par les Soudanais du Nord. Cela a conduit à des tensions accrues, les habitants du sud se sentant rapidement réprimés par le gouvernement. Une série de mutineries et de manifestations dans le sud a vu une armée rebelle appelée Anyanya se former à partir de déserteurs et de forces rebelles. Les Anyanya ont pu exploiter les nombreuses factions au sein de l'armée soudanaise pour remporter des victoires éclatantes. Après une série de campagnes réussies à travers le Soudan du Sud, les forces militaires soudanaises furent rapidement chassées du territoire, laissant la zone libre aux Anyanya pour établir leur domination politique sur la population. Avec une victoire militaire et politique assurée, le gouvernement soudanais a accepté le Soudan du Sud comme État indépendant."
 SSU_insurgency_options.15.d:0 "Depuis 1955, peu après l'indépendance du pays, une insurrection constante mais désorganisée a lieu au Sud-Soudan. On rapporte désormais que des cellules insurgées plus importantes et mieux organisées ont surgi au Soudan du Sud, se faisant appeler « les Anyanya ». Les Anyanya souhaitent l'indépendance du Soudan et s'opposent fermement au gouvernement central. Enragés par la marginalisation et l'imposition d'un régime musulman sur des groupes périphériques non musulmans, les Anyanya n'auront de repos que lorsque le Soudan du Sud se libérera du régime de la majorité du Nord.\n\nLe gouvernement soudanais a répondu en niant les allégations de marginalisation et mobilise ses forces pour réprimer la rébellion. D'innombrables affrontements ont déjà lieu au Soudan du Sud et d'autres communautés minoritaires du Nil Bleu et des Monts Nouba soutiennent les insurgés.\n\nSelon certaines informations, les Anyanya sont fortement soutenus par les États voisins, majoritairement chrétiens, de l'Ouganda et de l'Éthiopie."
 
 Sudan_Civil_War_decisions:0 "Guerre civile soudanaise"
 Sudan_Civil_War_decisions_desc:0 "Enragés par la marginalisation et le règne de la majorité musulmane sur les populations non musulmanes, les Anyanya se rebellent contre le gouvernement soudanais afin d'assurer leur indépendance. Les Anyanya souhaitent un Soudan du Sud indépendant tandis que le gouvernement soudanais souhaite maintenir le contrôle sur le Soudan du Sud et empêcher la séparation. Non seulement cette guerre a pris des significations religieuses et culturelles, renforçant la tension croissante entre les États islamiques du Moyen-Orient et les États non islamiques du Moyen-Orient et de sa périphérie. En raison de ces facteurs, la guerre est devenue une partie du conflit plus vaste entre ces nations et est donc également une guerre par procuration entre les États non arabes de la région, comme Israël, l'Éthiopie et la République du Congo, contre la République arabe unie, la Libye et d'autres États arabes, tandis que ces États approvisionnent chacun de leurs côtés, d'autres États comme l'Ouganda attendent en marge, pesant leurs options, quel camp est le plus avantageux à soutenir."
 
 Jebel_Adkhar_War_decisions:0 "£Muscat_Icon La guerre du Djebel Adkhar£Imamate_Oman_icon"
 Jebel_Adkhar_War_decisions_desc:0 "Le sultan d'Oman a été informé que l'imamat autonome d'Oman pourrait posséder de vastes réserves susceptibles de moderniser et de transformer le pays. Les Britanniques souhaitent explorer les réserves potentielles et ont promis de fournir une aide technique et militaire. L'Imamat a répondu à cette incursion en organisant une guérilla contre le sultan. Ils sont soutenus par les nationalistes arabes anti-impérialistes et par l'Arabie Saoudite, qui souhaitent garantir les intérêts pétroliers pour leurs propres intérêts pétroliers."
 
 SMI_Jebel_Adkhar.1.d:0 "Un cheikh local fidèle à notre cause a réussi à convaincre les agents fidèles au sultan qu'il souhaite les aider dans leurs efforts dans le village. Il est devenu avec succès leur interlock local mais en secret il travaille pour nous. L'ennemi lui donne des informations vitales qu'il nous transmet et il s'efforce de saper ses efforts de l'intérieur. Cette opération réussie a amélioré notre position dans la région et nous espérons reproduire ce succès ailleurs."
 SMI_Jebel_Adkhar.2.d:0 "Un cheikh local fidèle à notre cause a réussi à convaincre les agents fidèles au sultan qu'il souhaite les aider dans leurs efforts dans le village. Il est devenu avec succès leur interlock local. Nous avions espéré qu'il nous aiderait dans nos efforts, mais il s'avère qu'il a été séduit par le sultan et la richesse de ses maîtres britanniques. Le cheikh a aidé avec succès l'ennemi à déraciner nos partisans et à entraver les opérations de nos combattants. Nos efforts dans la région ont été sapés par cette tentative ratée d'infiltration du sultan."
 SMI_Jebel_Adkhar.3.d:0 "Le sultan et ses troupes fantoches ne sont rien d'autre que des comparses britanniques. Lors d'une opération récente, nos combattants ont facilement franchi un poste de contrôle militaire et attaqué les soldats présents. Nous avons fait des victimes, capturé des armes et de nombreux survivants ont tout simplement abandonné leurs armes et ont pris la fuite. Avec la suppression de cet avant-poste, nous avons pu déplacer nos hommes et nos armes beaucoup plus librement, les forces du sultan ne semblant pas disposées à risquer d'y retourner. Cette opération a remonté le moral de nos hommes alors que des rumeurs se sont répandues selon lesquelles parmi les victimes se trouvait un officier britannique."
 SMI_Jebel_Adkhar.4.d:0 "Un de nos chefs insensés a décidé de mener ses hommes à attaquer un avant-poste royal qui, pensait-il, serait légèrement défendu. Cependant, dès le lancement de l'attaque, l'ennemi a tenu bon et a riposté, plongeant nos hommes dans le désarroi. Il semble que l'ennemi était soutenu par des conseillers britanniques et qu'ils n'ont fait qu'une bouchée de notre attaque. De tels revers ne feront que nuire à notre moral et rendront les hommes réticents à mener de futures opérations."
 SMI_Jebel_Adkhar.5.d:0 "Un véhicule blindé ennemi traversant l'une de nos villes a été détruit aujourd'hui. Le nombre de victimes est inconnu, mais des rumeurs ont circulé selon lesquelles un officier supérieur ou même un soldat britannique figurait parmi les victimes. Une de nos équipes avait vu le véhicule arrêté et avait réussi à poser un explosif sur le véhicule. L'opération a été un grand succès et montre que nous avons accru notre sophistication tactique."
 SMI_Jebel_Adkhar.6.d:0 "Dans l'un de nos villages, une tentative de pose d'explosifs à proximité d'un avant-poste militaire s'est soldée par un échec embarrassant. Les hommes ont été arrêtés avec les explosifs et emmenés pour interrogatoire. Malheureusement pour nous, ces hommes ont trahi plusieurs de nos facilitateurs locaux et ont également été arrêtés. Notre présence dans le village a été en grande partie déracinée. La conduite de ce genre d'opérations n'est pas familière à nos hommes et on peut s'attendre à de tels échecs, mais cela a eu un effet négatif sur le moral de la région."
 
 OMA_Jebel_Adkhar.1.d:0 "L'intérieur d'Oman a longtemps été le domaine de l'imamat d'Oman. Cependant, leur résistance a entravé les efforts du sultan visant à apporter l'unité et le développement dans la région. Les services de renseignement ont identifié plusieurs cheikhs à l'intérieur du pays qui seraient prêts à nous fournir des informations sur les mouvements de l'Imamat et à restreindre leurs activités dans leurs régions en échange de promesses de fonds de développement. Lors d'une opération récente, nous avons réussi à rallier l'un de ces cheikhs à nos côtés et les renseignements qu'il a fournis ont permis à nos forces d'intercepter les mouvements ennemis, de contrecarrer leurs opérations et d'identifier les partisans de l'imamat dans la région. De tels succès nous aideront à briser la résistance à notre mission."
 OMA_Jebel_Adkhar.2.d:0 "L'intérieur d'Oman a longtemps été le domaine de l'imamat d'Oman. Cependant, leur résistance a entravé les efforts du sultan visant à apporter l'unité et le développement dans la région. Les services de renseignement ont identifié plusieurs cheikhs à l'intérieur du pays qui seraient prêts à nous fournir des informations sur les mouvements de l'Imamat et à restreindre leurs activités dans leurs régions en échange de promesses de fonds de développement. Cependant, lors d'une récente tentative visant à convaincre un cheikh de nous rejoindre, notre agent de renseignement a été trompé car nous avons reçu de fausses informations. Cela a conduit nos hommes à des courses-poursuites folles et a permis à l'ennemi de lancer plusieurs frappes audacieuses. Au moment où nous avons réalisé que nous étions trompés, le mal était fait puisque l'imamat de la région avait considérablement augmenté sa popularité et nos forces étaient plutôt découragées."
 OMA_Jebel_Adkhar.3.d:0 "Une unité de soldats omanais appuyés par plusieurs conseillers militaires britanniques a découvert que plusieurs combattants de l'Imamat se rassemblaient dans un village stratégique situé à proximité d'un site de prospection. Ces combattants envisagent sans doute de cibler les prospecteurs mais un raid audacieux, planifié par les officiers britanniques, a vu nos troupes prendre d'assaut la ville, capturer ou tuer les rebelles et mettre fin à la menace. L'opération a remonté le moral de nos troupes omanaises et a accru la coopération entre nous et les Britanniques."
 OMA_Jebel_Adkhar.4.d:0 "Le plus grand problème auquel l'Armée royale d'Oman est confrontée est de mener un style de guerre contre-insurrectionnel pour lequel peu de son personnel et de ses officiers sont formés. Les conseillers britanniques se sont montrés critiques mais sont en nombre insuffisant, ce qui a conduit à plusieurs échecs, comme la récente opération d'assaut d'une zone vallonnée soupçonnée d'être une base de l'imamat. Nos troupes ont été prises en embuscade avant d'atteindre le site et après avoir subi des pertes, beaucoup ont simplement fui en retraite. Les Britanniques ont évalué l'opération et ont cité l'échec d'une planification appropriée, facile à découvrir en raison du choix d'un itinéraire évident, et le manque de leadership efficace comme raison de l'échec. Cet échec de l'opération a affaibli le moral de nos troupes."
 OMA_Jebel_Adkhar.5.d:0 "La Royal Air Force basée à Oman a été dirigée par une équipe SAS pour cibler un camp rebelle présumé. Après le bombardement, nos soldats de l'Armée royale d'Oman sont entrés dans le camp suspect et ont découvert que les forces de l'Imamat avaient abandonné la zone, laissant derrière elles leurs victimes, leurs armes et leurs fournitures en raison de la puissance impressionnante de l'avion. L'opération a sans aucun doute grandement nui au moral de l'ennemi."
 OMA_Jebel_Adkhar.6.d:0 "La Royal Air Force a apporté un soutien essentiel à nos opérations à l'intérieur du pays. Ils ont identifié les concentrations ennemies, détruit les positions ennemies et fourni un soutien à l'Armée royale d'Oman lorsqu'elle était menacée. Cependant, lors d'une opération récente, la Royal Air Force a identifié une concentration de troupes rebelles et de bombardiers déployés qui ont affirmé avoir détruit les cibles. Cependant, lorsque nos troupes sont intervenues, convaincues que la menace avait été écartée, elles sont tombées dans une embuscade et ont subi de lourdes pertes. L'échec de la mission de bombardement a sapé le moral et a soulevé la question de savoir si nous pouvons faire confiance aux affirmations de réussite et de renseignement de la Royal Air Force."
 
 OMA_Jebel_Adkhar.10.d:0 "L'imamat d'Oman a commencé sa résistance contre le sultan après avoir estimé que son autonomie était empiétée. Ils pensaient également que l'exploration pétrolière future siphonnerait les richesses de la région au profit du sultan et des Britanniques. Malgré leur résistance et leurs tactiques de guérilla, le sultan d'Oman a triomphé et a annoncé que l'imamat d'Oman était désormais intégré à son sultanat. Le succès du sultan était dû en grande partie à l'aide qu'il recevait des intérêts pétroliers et du gouvernement britannique. Les conseillers britanniques et la Royal Air Force se sont révélés décisifs pour permettre aux militaires mal armés du sultan de triompher."
 OMA_Jebel_Adkhar.11.d:0 "L'imamat d'Oman a commencé sa résistance contre le sultan après avoir estimé que son autonomie était empiétée. Ils pensaient également que l'exploration pétrolière future siphonnerait les richesses de la région au profit du sultan et des Britanniques. Les tactiques de résistance et de guérilla se sont révélées extrêmement frustrantes pour l'armée mal armée et mal dirigée du sultan. Malgré le soutien des conseillers britanniques et de la Royal Air Force, le sultan ne parvient pas à réprimer les rebelles. En effet, le succès de la résistance a inspiré d'autres nationalistes et anti-impérialistes arabes à travers Oman à sympathiser avec les rebelles. Une fois que les forces de l'Imamat ont commencé à opérer au sein du Sultanat d'Oman, ces partisans ont rejoint les combattants de l'Imamat et le sultan a finalement été renversé. Avec cette victoire, l'imamat d'Oman a pris le contrôle du pays et les Arabes de la région y voient une victoire sur l'impérialisme international."
 
 OMA_Jebel_Adkhar.12.d:0 "Le sultan de l'Imam, le gouvernement britannique et les compagnies pétrolières internationales étaient impatients d'explorer l'intérieur d'Oman à la recherche de pétrole. Cependant, l'imamat autonome d'Oman résistait à tout effort qu'il considérait comme violant son autonomie. Avec le soutien britannique, le sultan a décidé d'envoyer des soldats pour s'emparer des zones clés et des prospecteurs pétroliers pour déterminer tout le potentiel de la région. Cela a conduit à une première occupation des terres de l'Imamat par le sultan. Cependant, récemment, les forces du sultan omanais ont été confrontées à des attaques de guérilla menées par des combattants fidèles à l'imam, transformant le conflit en une lutte armée pour l'intérieur d'Oman et le contrôle de ses ressources naturelles. Les Britanniques soutiennent le sultan tandis que les nationalistes arabes et les États pétroliers arabes rivaux soutiennent l'imamat dans sa lutte contre le sultan."
 
