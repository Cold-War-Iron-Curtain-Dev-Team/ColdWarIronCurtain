 UIA_insurgency_options.2.d:0 "Suite à l'échec de la tentative d'infiltration de notre agent national spécial, l'UIA a corrigé plusieurs points vulnérables de ses opérations, amélioré son processus de vérification et est devenue plus résiliente dans son ensemble. De plus, bien que notre agent ait résisté à l'interrogatoire, ils ont pu en apprendre davantage sur nous grâce à ses actions et, dans les prochains jours, ils pourraient tenter d'utiliser ces techniques contre des cibles de niveau inférieur telles que les commissariats de police et les garnisons.\nCet échec est une tache sur notre bilan et aura des conséquences notables."
 UIA_insurgency_options.3.d:0 "Une répression sévère contre les opérations de l'UIA a abouti à un succès étonnant. Nos forces de police étaient plus que prêtes à vaincre l'ennemi et à le prendre au dépourvu. Nous avons saisi d'innombrables explosifs et équipements et tué de nombreux membres de l'UIA. De plus, le raid nous a fourni de grandes quantités d'informations car ils n'ont pas réussi à les détruire à temps.\nCe succès affaiblira leurs opérations futures et diminuera leur férocité."
 UIA_insurgency_options.4.d:0 "L'UIA savait que nous venions. Soit ils ont évacué leurs installations en laissant des pièges à feu prêts à exploser lorsque la police pénétrait profondément à l'intérieur, soit ils ont tendu des embuscades contre notre police. Non seulement cela a abouti à un échec retentissant, mais l'ennemi a même lancé des contre-attaques contre nos commissariats de police et lancé des attaques opportunistes pour s'emparer du ravitaillement alors que nos officiers étaient occupés ou morts. L'UIA est désormais bien mieux armée et capable de mener de futures attaques dans la région. Pour le moment, nous avons envoyé des renforts de police des zones voisines et avons même affecté des soldats à des patrouilles pour renforcer les forces soviétiques désormais affaiblies.\nCet échec affaiblira nos tentatives de les combattre dans la région et augmentera probablement leur férocité."
 UIA_insurgency_options.5.d:0 "Après plusieurs passes de reconnaissance et d'innombrables heures de préparation, nous avons finalement lancé nos bombardements contre les installations éloignées de l'UIA. Des fermes d'abricotiers aux maisons modernes en bord de mer, les installations de leurs milices ont été considérablement affaiblies. Nos frappes ont rasé les installations d'entraînement, effectué des attaques opportunistes contre des convois de ravitaillement, détruit des zones de rassemblement et, de manière générale, détruit des bases éloignées. L'UIA est désormais beaucoup plus faible et l'absence de ces installations distantes déconnectera son réseau de cellules opérant entre les villes.\nL'ennemi sera désormais moins capable de lancer des attaques et sera moins agressif à l'avenir."
 UIA_insurgency_options.6.d:0 "Non seulement nos renseignements étaient erronés, non seulement nous avons détruit d'innombrables cibles non ciblées, mais nous avons en fait réussi d'une manière ou d'une autre à détruire certains des atouts de notre propre nation. Les postes de garde et les trains de ravitaillement de notre propre armée ont été ravagés par cette mauvaise direction. D'après ce que dit notre directeur du renseignement, l'ennemi a alimenté la désinformation de nos informateurs confidentiels. À l'avenir, nous devrons peut-être mieux nous coordonner avec l'armée pour garantir qu'en cas d'échec, cela n'entraînera pas de tirs amis.\nCet échec affaiblira la capacité de l'armée à combattre l'insurrection et à prévenir les attaques, les rendant ainsi plus agressives."
 UIA_insurgency_options.10.d:0 "L'Armée rouge a fièrement annoncé l'anéantissement complet de l'UIA (Armée insurrectionnelle ukrainienne). Après des années de combats, l'UIA a été complètement détruite après qu'une frappe finale contre les restes de l'UIA ait anéanti le leader restant en fuite et tué le peu d'actifs qui lui restaient. Tant de militants partisans de l'indépendance ukrainienne sont morts qu'il est peu probable que l'UIA puisse ressusciter.\nLors d'une conférence de presse, le directeur de la Pravda, la société médiatique d'État de l'Union soviétique, a fièrement annoncé que cela devait constituer un avertissement contre tous ceux qui s'opposent aux travailleurs de l'Union soviétique et à son peuple.\nLes loyalistes ukrainiens qui ont contribué au combat ainsi que d'innombrables agents intérieurs spéciaux anonymes et confidentiels seront récompensés pour leur sacrifice et leurs services rendus à l'Union soviétique."
 UIA_insurgency_options.11.d:0 "Après une guérilla brutale et la destruction de bases aériennes critiques de l'Armée rouge, l'UIA (Armée insurrectionnelle ukrainienne) a fièrement annoncé qu'après des années de combats, l'Ukraine était libre. L'UIA a établi un gouvernement indépendant et chassé tous les responsables étrangers et éléments loyalistes de la région. Des milliers de nationalistes ukrainiens sont descendus dans les rues pour célébrer la fondation d'une nation indépendante.\nLors d'une conférence de presse, les dirigeants de l'insurrection ont déclaré que cela devrait servir d'exemple à tous les révolutionnaires de tous les pays : aucune nation n'est trop grande ou trop puissante pour résister et que tous ceux qui recherchent l'indépendance de la tyrannie de leurs dirigeants doivent se lever et se battre.\nLes loyalistes ukrainiens et les agents intérieurs spéciaux du KGB ont été brutalement exécutés et les principaux loyalistes de l'UIA seront récompensés par le groupe dans son ensemble."

 Mau_Mau_decisions:0 "£Mau_Mau_Icon L'Armée kenyane de la terre et de la liberté"
 Mau_Mau_decisions_desc:0 "£Mau_Mau_Icon La Kenya Land and Freedom Army (KLFA) ou Mau Mau, est une organisation de Kikuyu et d'autres groupes ethniques mineurs devenus déloyaux et privés de leurs droits suite à la colonisation britannique blanche au Kenya. Bien que vaguement affiliés, les motivations et la violence grave de ces groupes ne doivent pas être sous-estimées. L'assassinat du chef Waruhiu et d'autres personnalités autochtones pro-britanniques ainsi que de colons blancs a conduit notre gouverneur à déclarer l'état d'urgence nationale. Le Royaume-Uni fera tout son possible pour s'engager dans une campagne anti-insurrectionnelle efficace et impitoyable.\n\n Force actuelle : [?ROOT.kenyan_insurgency|R]%\n État actuellement sélectionné : [?ROOT.kna_current_country_state_decision.GetName]"
 The_Kenyan_Land_and_Freedom_Army_Uprising:0 "La fin de la colonie et du protectorat du Kenya"
 Liquidate_The_Kenyan_Land_and_Freedom_Army:0 "Mettre fin au soulèvement des Mau Mau"
 The_Kenyan_Land_and_Freedom_Army:0 "L'Armée kenyane de la terre et de la liberté"
