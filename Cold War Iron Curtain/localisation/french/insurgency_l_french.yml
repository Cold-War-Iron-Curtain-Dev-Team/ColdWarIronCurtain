 operation_boost_uia_desc:0 "Envoyez des explosifs, des munitions et des fonds aux insurgés ukrainiens antisoviétiques dans l'espoir de renforcer leurs efforts de résistance. Fournir ces fournitures aux insurgés ukrainiens leur permettra de mener des opérations à plus grande échelle contre l'Union soviétique et de déstabiliser leurs opérations dans la région. Cela renforcera profondément l'insurrection dans la région et affaiblira légèrement l'Union soviétique.\n\nCela augmentera la force de l'armée insurrectionnelle ukrainienne de 5 %\nCela coûtera 2 millions de dollars"
 
