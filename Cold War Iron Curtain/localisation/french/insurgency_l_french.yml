 Yemeni_Coup.1.d:0 "La lutte entre la faction nassériste et la faction royaliste au Yémen a conduit à une tentative de coup d'État de la part d'officiers militaires nassériens. Pendant la nuit, le colonel Abdullah Sallal, chef de la Garde du palais, a organisé avec succès des forces militaires dans la capitale yéménite, Sanaa. Ils se sont emparés de la station de radio et des principaux bâtiments gouvernementaux et ont lancé une attaque armée contre le palais royal afin de capturer ou de tuer le dirigeant du Yémen, l'imam Muhammad al-Badr. Après une lutte brève mais violente, les forces royalistes de la capitale furent vaincues. Le colonel Sallal a annoncé que le Yémen serait une république dirigée par le groupe révolutionnaire des officiers libres qui moderniserait le Yémen selon les lignes nasséristes. L'Egypte a déjà son soutien au régime. Bien que le nouveau régime ait déclaré la mort d'al-Badr, des nouvelles sont parvenues à Sanaa selon lesquelles al-Badr rallie un soutien tribal et se dirigerait vers l'Arabie saoudite pour mobiliser ses partisans."

 UAR_Insurgency_Options.1.d:0 "Le long d'une des principales voies de transport où nous avons établi un avant-poste militaire, nos troupes ont remarqué un mouvement suspect de personnes vers un village voisin. Lorsque nous avons confirmé la présence de combattants royalistes, nous avons dépêché une unité. Ils ont lancé une puissante puissance de feu pour choquer l'ennemi, puis l'infanterie a attaqué le village. L'attaque fut un succès puisqu'une bande de combattants royalistes fut vaincue. Nous avons capturé des armes, des fournitures et des documents dans le village. Notre puissance de feu et notre expertise ont impressionné la population locale et elle saura ne pas contester notre présence. Ces opérations nous aideront à sécuriser les grands axes de transport et à étouffer la résistance."
 UAR_Insurgency_Options.2.d:0 "Un officier ambitieux mais insensé a décidé de conduire ses hommes hors de notre base opérationnelle vers un col de montagne voisin pour cibler une concentration royaliste présumée. Il n'a pas cherché à recueillir plus de renseignements ni à obtenir davantage d'armes de soutien et son attaque a plutôt conduit ses forces dans un piège royaliste. Les forces royalistes ont réussi à tendre une embuscade à nos hommes, à les attaquer de plusieurs côtés et à nous repousser. Les pertes et la défaite subies par nos forces ont nui au moral. Nos forces dans la région resteraient autour de la base et nous craignons que les partisans royalistes n'utilisent cette route particulière sans trop de harcèlement."
 UAR_Insurgency_Options.5.d:0 "L'un de nos avions de reconnaissance patrouillant à la frontière avec l'Arabie saoudite a identifié une concentration de combattants se dirigeant vers le Yémen. Quelques avions d'appui aérien modifiés ont ensuite mitraillé et bombardé la force royaliste présumée. Nous avons envoyé une patrouille pour enquêter sur le site et ils ont confirmé que l'opération avait été un succès majeur et que la force royaliste avait été neutralisée. Nos forces au Yémen opèrent loin de notre base et ne disposent pas d'armes terrestres lourdes. Heureusement, la puissance aérienne a constitué un substitut efficace à cette situation."
 UAR_Insurgency_Options.6.d:0 "L'un de nos avions de reconnaissance patrouillant à la frontière avec l'Arabie Saoudite a identifié une petite concentration de combattants basés près de la frontière. Quelques avions d'appui aérien modifiés ont ensuite mitraillé et bombardé la force royaliste présumée. Cependant, lorsque nous avons envoyé une patrouille pour enquêter sur le site, nous avons découvert qu'il s'agissait de forces de nos alliés yéménites. Naturellement, de nombreuses personnes au Yémen sont en colère contre notre erreur et des rumeurs ont couru selon lesquelles nous avions intentionnellement attaqué ces hommes. Il s'agissait malheureusement d'un accident, nous n'avions pas eu connaissance du déploiement d'une petite force pour intercepter les infiltrés depuis la frontière. La confiance dans notre puissance aérienne a été érodée par cet échec."
 UAR_Insurgency_Options.3.d:0 "Les royalistes et leurs alliés comptent sur l'ignorance et la corruption pour maintenir leurs forces et leurs opérations de combat. Il y en a dans leurs rangs, surtout parmi les tribus, qu'il est facile de convaincre de nous soutenir. Nos agents du renseignement ont réussi à convaincre un chef de tribu royaliste de minimiser l'activité rebelle royaliste sur ses terres et de nous fournir des renseignements sur les opérations royalistes. Il l'a fait en échange d'argent liquide et de la construction d'une école et d'un hôpital sur son territoire. Jusqu'à présent, les renseignements fournis ont été excellents et nous avons freiné l'activité royaliste dans la région."
 UAR_Insurgency_Options.4.d:0 "Les royalistes et leurs alliés comptent sur l'ignorance et la corruption pour maintenir leurs forces et leurs opérations de combat. Il y en a dans leurs rangs, surtout parmi les tribus, qu'il est facile de convaincre de nous soutenir. Nos agents du renseignement ont approché un chef de tribu royaliste et il a accepté de fournir des renseignements et de réduire les activités royalistes en échange de grosses sommes d'argent. Nous effectuions des paiements réguliers et recevions des rapports de renseignement. Cependant, nous avons récemment découvert que les renseignements qu'il donnait étaient souvent faux ou distrayaient nos forces alors que les royalistes prenaient des mesures plus importantes. Apparemment, le chef de la tribu se moquait de nous, collectant de l'argent auprès de nous tout en continuant à travailler contre nos forces. L'opération visant à le recruter pour des activités de renseignement s'est soldée par un échec."

 YEM_Insurgency_Options.1.d:0 "Nos forces ont identifié dans la zone une tribu qui combattait les royalistes et leur offrait un abri. Une de nos unités s'est positionnée pendant la nuit pour intercepter la circulation là où se cachaient les rebelles. Dans la matinée, les combattants royalistes sont tombés dans le piège et ont été abattus par l'embuscade que nous leur avons tendue. Cette victoire a non seulement réduit l'activité royaliste dans la région et remonté le moral, mais a également permis à nos forces de réprimer la tribu car nous avions des preuves claires de leur soutien aux royalistes."
 YEM_Insurgency_Options.2.d:0 "Une opération visant à déraciner et détruire un campement royaliste se solde par un désastre. Notre force avait des renseignements sur un camp royaliste à proximité et nous avons envoyé des forces pour l'attaquer. Cependant, le commandant n'a pas réussi à obtenir le soutien du cheikh local et la route qu'il a empruntée s'est avérée être un terrain très difficile. Cela ralentit considérablement le rythme de nos forces et les royalistes virent que nous arrivions. Même si notre unité a commencé à subir des tirs de tireurs d'élite et qu'il était clair que nous n'avions plus l'élément de surprise, le commandant est passé à autre chose et a fait face à un moment donné à une importante embuscade ennemie en tant que renforts royalistes. Nous avons subi des pertes et avons été contraints de battre en retraite. Le moral dans la région a chuté et certains soldats hésitent à quitter leurs avant-postes."
 YEM_Insurgency_Options.5.d:0 "La fierté de notre nouvelle nation réside dans la force aérienne moderne que nous construisons. Nous avons acquis des avions auprès d'États amis qui ont également donné à nos pilotes des cours rapides pour les faire décoller rapidement. Lors d'une récente opération réussie, nos pilotes ont réussi à bombarder un village soupçonné d'être royaliste. La reconnaissance aérienne avait identifié plus tôt que le village avait de l'artillerie et d'autres armes lourdes en cours d'assemblage. Lorsqu'une patrouille est allée enquêter sur l'attentat, elle a confirmé la destruction d'équipements lourds et a capturé des documents des forces royalistes qui avaient fui après la frappe réussie. L'opération a remonté le moral de nos forces armées."
 YEM_Insurgency_Options.6.d:0 "La fierté de notre nouvelle nation réside dans la force aérienne moderne que nous construisons. Nous avons acquis des avions auprès d'États amis qui ont également donné à nos pilotes des cours rapides pour les faire décoller rapidement. Lors d'une opération récente, il semble que nos formations rapides aient pu conduire à un embarras. L'une de nos bases située à proximité d'un carrefour routier clé a essuyé des tirs nourris de l'ennemi. Nous avons envoyé plusieurs chasseurs pour bombarder et forcer les royalistes attaquants à se retirer. Cependant, il semble que les pilotes n'étaient pas préparés pour cette mission. Aucune de leurs bombes n'a touché l'ennemi et les quelques tirs qu'ils ont effectués étaient contre nos propres forces. Les royalistes décrivent déjà l'incompétence de notre armée de l'air et cet événement a blessé le moral. Nous enverrons immédiatement quelques pilotes pour une formation supplémentaire."
 YEM_Insurgency_Options.3.d:0 "Alors que les royalistes poursuivent leur campagne, les chefs tribaux et les anciens qui les soutiennent se rendent peu à peu compte qu'ils mènent tous les combats pendant que le monarque vit de leur sacrifice. Ils sont également conscients des réformes et des avancées que nous leur proposons et, lors d'une récente opération de renseignement, nous avons utilisé cela à notre avantage. Nos agents ont convaincu un haut chef tribal de cesser de soutenir l'insurrection et de soutenir nos efforts en échange d'une aide au développement de son peuple. Le chef de la tribu nous a informé des sympathisants locaux, des mouvements royalistes, des tactiques et de la stratégie. Avec ces informations nous déracinerons les royalistes présents dans la zone."
 YEM_Insurgency_Options.4.d:0 "Alors que les royalistes poursuivent leur campagne, les chefs tribaux et les anciens qui les soutiennent se rendent peu à peu compte qu'ils mènent tous les combats pendant que le monarque vit de leur sacrifice. Ils sont également conscients des réformes et des avancées que nous leur proposons et, lors d'une récente opération de renseignement, nous avons utilisé cela à notre avantage. Nos agents ont convaincu un conseiller royal de commencer à nous envoyer des informations sur les tactiques, le moral et la stratégie royalistes. Cependant, il s'est avéré que le conseiller a convaincu nos agents qu'ils devaient trahir la république et rejoindre la cause royaliste. Selon nous, il ne s'agit pas d'une conversion idéologique, mais d'une conversion financière. En travaillant ensemble, ils nous ont fourni de fausses informations, affaiblissant nos forces et, avant que nos agents ne fassent finalement défection, ils ont volé de nombreux documents. Cette tentative d'acquisition de moyens de renseignement parmi les royalistes fut un échec."

 MUK_Insurgency_Options.1.d:0 "L'un de nos alliés tribaux familier avec la région a réussi à diriger un groupe de nos combattants pour attaquer une base militaire républicaine sans surveillance. Les troupes de la base pensaient que le terrain était si accidenté que personne ne tenterait d'entrer par ce côté, mais nos forces y sont parvenues et ont lancé un assaut sur la base. Nous avons infligé de nombreuses pertes, capturé des armes, des fournitures, des munitions et nous sommes rapidement retirés avec des pertes minimes. Les républicains et leurs alliés restent retranchés dans leurs bases, effrayés."
 MUK_Insurgency_Options.2.d:0 "Une opération audacieuse s'est transformée en défaite lorsqu'un de nos commandants a identifié un convoi de véhicules républicains circulant sur une route. Une embuscade a été tendue pour attaquer le véhicule, mais le commandant en charge de l'embuscade n'est pas un officier qualifié. Il est le fils d'un chef tribal très respecté et son embuscade s'est avérée mal conçue. Les véhicules ennemis ont facilement résisté à l'attaque et contre-attaqué. Nos forces ont subi de lourdes pertes tout en en infligeant très peu. Cet échec a nui au moral des hommes, dont certains se tournent désormais avec méfiance envers leurs dirigeants."
 MUK_Insurgency_Options.5.d:0 "Les républicains et sans doute un ami étranger ont installé un aérodrome à proximité d'une région clé du conflit. Pendant la nuit, nos forces ont utilisé les itinéraires fournis par les alliés locaux pour installer des mortiers et d'autres pièces d'artillerie à l'extérieur de la base. Juste avant le matin, nos canons ont ouvert le feu, faisant pleuvoir l'artillerie sur la base pendant plusieurs minutes avant que nous ne nous retirions rapidement. Des hommes ont déclaré avoir entendu des explosions et avoir vu de la fumée s'élever alors qu'ils partaient. L'attaque a touché des dépôts de carburant et de munitions et nous pensons que du matériel précieux a également été détruit, même si les républicains ne l'ont pas admis."
 MUK_Insurgency_Options.6.d:0 "Une tentative visant à déplacer des mortiers et de l'artillerie légère contre un poste de contrôle militaire républicain s'est soldée par un échec. Apparemment, la route empruntée par nos forces était surveillée par l'ennemi et lorsque les équipes de mortiers se sont approchées de leurs positions pour viser le point de contrôle, elles ont été prises en embuscade par les forces républicaines. Nous avons subi quelques pertes mais, plus important encore, les républicains se sont emparés d'un certain nombre de nos mortiers. Cet échec a nui au moral des hommes et fait craindre qu'une tribu locale n'ait fait savoir à l'ennemi que nous emprunterions cette route."
 MUK_Insurgency_Options.3.d:0 "La prise injuste du pouvoir par les républicains a pesé lourdement sur les officiers qui n'étaient pas directement impliqués dans le coup d'État. Bien qu'ils aient servi la république, certains tiennent toujours au sérieux leurs engagements de fidélité à la monarchie. Nous avons contacté avec succès un officier intermédiaire et il a accepté de nous fournir de précieux renseignements sur les mouvements des troupes, leur moral et leur stratégie en échange d'une promotion une fois que nous serons revenus au pouvoir. Jusqu'à présent, nous avons obtenu de précieux renseignements et diffusons également des informations erronées au sein des forces républicaines, faisant de l'opération un succès majeur."
 MUK_Insurgency_Options.4.d:0 "La prise injuste du pouvoir par les républicains a pesé lourdement sur les officiers qui n'étaient pas directement impliqués dans le coup d'État. Bien qu'ils aient servi la république, certains tiennent toujours au sérieux leurs engagements de fidélité à la monarchie. Cependant, une récente opération de renseignement visant à transformer un officier républicain en informateur s'est soldée par un échec. Notre agent a réussi à approcher l'officier et a commencé à recueillir des renseignements auprès de lui. Cependant, l'officier était apparemment déjà soupçonné par ses commandants. Les renseignements que nous avons obtenus étaient faux et nous avons agi en conséquence, confirmant ainsi leurs soupçons. Notre agent et l'officier ont tous deux été arrêtés et nous craignons que plusieurs autres informateurs ne soient purgés dans les prochains jours."

 NYCW.1.d:0 "Le coup d'État nassérien à Sanaa n'a pas été entièrement un succès. Le colonel Abdullah Sallal et ses collègues officiers libres avaient cherché à transformer le Yémen en république et à mettre fin à la monarchie lors du coup d'État. Bien qu'ils aient capturé la capitale, sécurisé d'autres grandes villes et annoncé leur programme de modernisation du Yémen, ils n'ont pas réussi à neutraliser le monarque yéménite, Mohammad al-Badr. Al-Badr s'est échappé du palais lorsque les forces nasséristes l'ont attaqué et il a pu rallier l'importante population tribale rurale pour le soutenir. Sa base traditionnelle étant désormais mobilisée, al-Badr a décidé de lancer une guérilla, avec le soutien des nations anti-nasséristes, afin de renverser Sallal qui s'est autoproclamé président du Yémen. Si les Officiers libres et le président Sallal veulent réaliser leur vision pour le Yémen, ils devront faire face à la menace royaliste."
 NYCW.10.d:0 "\nLa stratégie consistant à sécuriser les frontières, à contrôler les lignes d'approvisionnement et à pacifier les tribus royalistes s'est finalement avérée fructueuse pour le gouvernement républicain. Les royalistes s'appuyaient largement sur la base traditionnelle de soutien à la monarchie, les tribus rurales du Yémen. La sécurisation des frontières a empêché les royalistes de recevoir l'aide des autres États monarchistes arabes. Le contrôle des principales routes de transport et d'approvisionnement a permis aux républicains d'observer les mouvements de l'ennemi et finalement de paralyser la capacité des royalistes à se déplacer librement. Enfin, le programme de pacification a conduit au développement rural et a poussé un certain nombre de tribus pro-monarchiques à faire défection vers la cause républicaine. En fin de compte, la victoire justifie l'idéologie nationaliste arabe et la ferveur révolutionnaire déchaînée dans le sud de l'Arabie dispose désormais d'une base à partir de laquelle se développer."
 NYCW.11.d:0 "Alors que les derniers restes des forces républicaines se rendaient aux commandants royalistes, l'imam Mohammad al-Badr retourna dans la capitale Sanaa. Il arrive pour la première fois depuis le coup d'État républicain qui l'a chassé de la capitale et déclenché la guerre. Ses forces avaient mené une série d'opérations réussies pour finalement vaincre les officiers libres du Yémen et rétablir son règne. Même si les républicains contrôlaient les villes et avaient accès à des armes sophistiquées, al-Badr s'est montré habile à mobiliser le soutien rural pour sa cause et la connaissance du terrain et de la population de ses forces s'est avérée décisive dans leurs campagnes. La cause républicaine étant écrasée, nombreux sont ceux qui pensent que l'influence nassériste au Yémen et même dans la région pourrait bientôt disparaître."
 
 North_Yemen_Civil_War_decisions:0 "La guerre civile au Yémen du Nord"
 North_Yemen_Civil_War_decisions_desc:0 "La lutte entre les monarchies conservatrices et la ferveur révolutionnaire du nationalisme arabe a conduit à des conflits dans toute la région. Au Yémen, cette tension a vu des officiers nationalistes arabes, inspirés par les Officiers libres d'Égypte, tenter de prendre le contrôle du pays et de mettre fin à la monarchie par un coup d'État. Le coup d'État a réussi à déclarer le Yémen république, mais le monarque yéménite s'est enfui vers la campagne où il a rallié les tribus rurales et ses partisans. Les royalistes déclenchent alors une guerre civile et mènent une guérilla contre le gouvernement républicain. La guerre civile au Yémen est un microcosme du conflit idéologique plus large qui engloutit le monde arabe.\n\nStatut actuel :\n[YEM.GetNameDef]: [?YEM.YEMEN_insurgency] Points de victoire\n[CSA.GetNameDef]: [?CSA.YEMEN_insurgency] Points de victoire\n\nFinancement étranger mensuel pour [CSA.GetNameDef]: [?CSA.global_muk_funding] millions\n\nREMARQUE : Le premier camp à atteindre 1 000 points de victoire remportera ce conflit"

