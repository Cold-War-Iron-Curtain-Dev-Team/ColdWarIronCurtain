 STALIN_Heavy_Industry_Development_desc:0 "Même si notre pays possède de grands centres industriels, notre capacité à produire des équipements et des machines lourdes reste à la traîne par rapport à celle des puissances occidentales comme les États-Unis. Seul un effort concerté pour développer notre industrie pourra changer cela."
 STALIN_The_Iron_Curtain_Diplomacy_desc:0 "Notre sphère d'influence s'est élargie pour englober toute l'Europe de l'Est, de la Baltique à la mer Noire. Winston Churchill, notre ancien allié, a appelé le fossé entre nous et l'Occident « le rideau de fer », signe de l'écart croissant entre nos objectifs individuels. Il a raison. Les capitalistes doivent apprendre leur place dans le monde ou y être montrés par la force."
 STALIN_Confirm_Stalins_Omnipotence_desc:0 "Notre glorieux leader, le camarade Joseph Staline, est pratiquement Dieu en Union soviétique. Sous son commandement, les gens vivent et meurent. A travers ses paroles, les gens mangent ou meurent de faim, pleurent ou rient, travaillent ou se reposent. Déjà dirigeant sans opposition, nous devons reconnaître sa toute-puissance."
 STALIN_The_Soviet_Armed_Forces_desc:0 "Notre armée est l'une des plus puissantes au monde, en termes de taille. Cependant, nous sommes à la traîne par rapport au niveau de recherche et de développement de l'Occident dans plusieurs domaines clés, notamment la technologie des avions à réaction et tout semblant de véritable marine."
 
 STALIN_Catch_Up_with_Western_Atomic_Research_desc:0 "L'énergie nucléaire - à la fois militaire et pacifique - sera l'un des facteurs décisifs dans la lutte à venir pour la survie, et nous ne pouvons pas nous permettre de rester à la traîne des Américains dans ce domaine."
 STALIN_Utilize_German_Rocketry_Knowledge_desc:0 "Lorsque nous avons balayé l'Allemagne à la fin de la Grande Guerre patriotique il y a cinq ans, nous avons capturé de nombreux scientifiques allemands éminents, parmi lesquels quelques chercheurs hautement qualifiés en matière de moteurs de fusée. En les mettant à profit, nous pouvons faire progresser nos connaissances."
 STALIN_Prioritize_Electronic_Developments_desc:0 "De nouveaux progrès sont réalisés quotidiennement dans le domaine de l'électronique en Occident, et pourtant une grande partie de nos zones rurales manquent d'installations électriques de base. Nous devons améliorer leur infrastructure et suivre les avancées technologiques de notre époque."
 STALIN_Aid_Ukranian_Reconstruction_desc:0 "L'Ukraine, en particulier, a été durement touchée par les chiens nazis pendant leur brève occupation, et une grande partie de ses infrastructures ont été détruites. Un gros effort devra être fait pour le restaurer."
 STALIN_Rebuild_Ukranian_Agriculture_desc:0 "Les fascistes ont également ruiné les fermes et les industries alimentaires de la région lors de leur invasion, renvoyant une grande partie des marchandises et des fournitures vers leur pays d'origine. Notre peuple rationne déjà la nourriture, nous devons donc remettre en marche la corbeille à pain de la Russie occidentale."
 STALIN_Rebuild_Destroyed_Dams_desc:0 "De nombreux barrages ont été détruits pendant la guerre, endommageant de nombreux villages dans les environs et privant les barrages de leur capacité à fournir de l'énergie hydroélectrique. Ces deux raisons sont plus que suffisantes pour commencer à réparer les barrages."
 STALIN_Invest_in_the_Baltics_desc:0 "La région baltique a beaucoup souffert au cours des dernières décennies, étant assimilée à l'Union en moins de quelques années avant d'être écrasée par la machine de guerre allemande, puis subissant les effets de la politique de la Terre brûlée. Investir dans la région ne fera que du bien."
 STALIN_Rebuild_Stalingrad_desc:0 "Stalingrad abrite les tombes de nombreux héros de l'Union et le site de l'un des plus beaux moments de la Grande Guerre patriotique. Cependant, tout cela ne change rien à la dévastation qu'elle a connue lors de la bataille pour sa conquête, et nous devons relancer ses industries. "
 STALIN_Open_New_Metallurgy_Plants_desc:0 "Les métaux des terres rares deviennent de plus en plus importants pour la production d'électronique de haute technologie et d'armes et de véhicules avancés, et l'augmentation de nos activités minières et de production nous bénéficiera grandement."
 STALIN_Complete_the_Don_Volga_Canal_desc:0 "Le canal Don-Volga est un projet important, vital pour notre secteur agricole dans le sud de l'Union, et en le réalisant, nous améliorerons les infrastructures locales et les capacités de production alimentaire."
 STALIN_Repair_Mining_Pits_desc:0 "En réparant les mines et l'ensemble de l'industrie, nous pouvons augmenter nos exportations et notre production de métaux."
 STALIN_Eliminate_Infrastructure_Bottlenecks_desc:0 "L'état de nos routes et de nos infrastructures générales, tout en étant un outil utile pour ralentir l'avancée nazie, est dans un état misérable pour le commerce en temps de paix et doit être amélioré."
 STALIN_Increase_Cement_Production_desc:0 "Le ciment est un matériau essentiel pour la construction de toutes sortes de choses, des ponts et routes aux bâtiments et fortifications, et nous en avons besoin davantage."
 STALIN_Build_New_Railways_desc:0 "Construire de nouvelles voies ferrées est un bon moyen d'améliorer les infrastructures régionales et de faciliter le transport des marchandises et des troupes."
 STALIN_Connect_the_Union_desc:0 "Pour achever nos nouvelles améliorations industrielles et infrastructurelles, nous devrions créer un vaste système de routes et d'autoroutes pour relier notre vaste pays. De Léningrad dans la Baltique à Sébastopol dans la mer Noire en passant par Vladivostok en Extrême-Orient, nos camarades citoyens auront la liberté de voyager comme jamais auparavant."
 
 STALIN_Follow_the_Percentage_Agreements_desc:0 "A la Conférence de Yalta, nous nous sommes mis d'accord sur les limites de notre sphère d'influence. Même si nous méritons sans aucun doute davantage, nous devons tenir parole et ne pas outrepasser nos limites."
 STALIN_Abandon_Turkish_Claims_desc:0 "L'une des questions sur lesquelles nous avons essayé de insister est celle du détroit de Turquie, car leur possession nous donnerait un accès total à la Méditerranée et aux océans au-delà. Cependant, cela ne relève pas de notre compétence et nous devrions donc abandonner nos revendications."
 STALIN_Promote_Democratic_Route_to_Communism_desc:0 "Plutôt que de forcer nos voisins démocrates du Nord-Est à nous rejoindre, nous devrions suivre le processus démocrate et promouvoir divers partis communistes pour les aider à remporter les prochaines élections nationales."
 STALIN_Pressure_Yugoslavia_desc:0 "Le maréchal Tito et ses alliés en Yougoslavie refusent de s'intégrer au Komintern, malgré nos similitudes naturelles. Nous devons intensifier nos efforts diplomatiques pour faire pression sur eux."
 STALIN_Fund_the_PCF_and_PCI_desc:0 "La France et l'Italie disposent déjà de partis communistes puissants, mais ils sont étranglés par la politique gouvernementale et les attaques radicales. Nous devons soutenir nos frères à l'étranger de toutes les manières possibles."
 STALIN_Gather_Intelligence_Via_Western_Spies_desc:0 "En envoyant des espions dans les pays occidentaux et en les transformant en nos propres agents, nous pouvons accroître nos capacités de collecte de renseignements."
 STALIN_Aid_the_Greek_Loyalists_desc:0 "La guerre civile a éclaté en Grèce et les forces communistes combattent courageusement face à l'oppression et à l'intervention occidentale. Nous savons que nous avons convenu d'avoir une sphère d'influence définie à Yalta, mais nous ne pouvons pas rester les bras croisés et regarder le feu de la Révolution s'éteindre."
 STALIN_Integrate_Greece_into_the_Eastern_Bloc_desc:0 "Maintenant que la guerre civile grecque est résolue et que les communistes ont triomphé grâce à notre aide, il est temps de les inviter au Kominform avec le reste de l'Europe de l'Est."
 STALIN_Maintain_Push_for_Turkish_Regime_Change_desc:0 "Le gouvernement turc a jusqu'à présent repoussé nos revendications sur les détroits et espère le soutien de l'Occident, mais si nous pouvons forcer un changement de régime, le nouveau gouvernement se contentera de nous donner ce que nous voulons."
 STALIN_Redraw_Bosphorous_Borders_desc:0 "Maintenant que nous avons assuré une Turquie amie, nous pouvons redessiner les frontières (on pourrait dire peindre une carte) comme bon nous semble. Nous avons ici 2 objectifs principaux. Le premier, bien entendu, est notre contrôle du détroit turc. La deuxième est la création d'un État pour les Kurdes opprimés en Turquie."
 STALIN_An_Ultimatum_to_Yugoslavia_desc:0 "Les tentatives impertinentes de Tito et de la Yougoslavie pour nous ignorer et ignorer nos demandes sont allées trop loin, et il est temps qu'ils nous rejoignent ou qu'ils affrontent la puissance de l'Armée rouge."
 STALIN_Maintain_Berlin_Blockade_desc:0 "Les Américains et les Britanniques insistent pour que nous mettions fin au blocus de Berlin-Ouest et que nous autorisons le libre passage de la nourriture et des marchandises vers la ville. Absurdité. Nous ne céderons pas aux exigences capitalistes. Le blocus continuera."
 STALIN_Cave_to_the_Western_Powers_desc:0 "Grâce au pont aérien de Berlin, les Américains ont démontré l'inutilité d'un blocus de Berlin-Ouest, et il est temps de céder et de leur permettre d'acheminer du ravitaillement vers la ville"
 STALIN_Allow_the_Foundation_of_a_German_State_for_Reperations_desc:0 "Les territoires de l'Allemagne de l'Est sont sous notre contrôle depuis la fin de la Seconde Guerre mondiale, en tant que tels, sous un gouvernement provisoire souple. Il est temps d'entamer le processus de création d'un État est-allemand."
 STALIN_Deepen_COMECON_Collaboration_desc:0 "Notre organisation de collaboration économique, le COMECON, a connu jusqu'à présent un succès mineur, mais nous devons réellement approfondir nos liens avec nos alliés d'Europe de l'Est si nous voulons en récolter tous les fruits."
 STALIN_Invest_in_the_Czech_and_Polish_Economy_desc:0 "Les économies tchèque et polonaise, sans parler de leur territoire et de leur population, ont été profondément blessées par l'occupation nazie. Nous devons les aider à le réparer."
 STALIN_Aid_Balkan_Reconstruction_desc:0 "Les Balkans ont été le théâtre de certains des combats partisans les plus féroces de la dernière guerre, et les infrastructures y sont par conséquent dévastées. Il faut le reconstruire."
 STALIN_Exploit_our_Eastern_Puppets_desc:0 "Même si nous ne le reconnaissons pas publiquement, le reste du Kominform n'est guère plus que des marionnettes et doit en réalité faire tout ce que nous disons. En exploitant leurs économies, nous pouvons accroître la nôtre."
 STALIN_Increase_Ties_with_Mao_and_Kim_Il_Sung_desc:0 "Mao et Kim Il Sung sont nos plus grands alliés dans la lutte pour le communisme en Extrême-Orient, et nous devons renforcer nos liens avec eux."
 STALIN_Support_Indochinese_Insurrections_desc:0 "Le peuple indonésien indigène s'est soulevé contre ses suzerains impérialistes néerlandais. Il est de notre devoir de les soutenir."
 STALIN_The_Korean_War_desc:0 "Guerre de Corée ! Kim Il Sung et son armée ont franchi le 38e parallèle et attaquent profondément la Corée du Sud. Nous avons ici deux choix : attendre de voir ce qui se passe, ou jouer un rôle plus actif pour assurer la victoire du Nord."
 STALIN_Send_Military_Advisors_desc:0 "L'intervention directe est trop risquée à ce stade, mais nous pouvons nous permettre d'envoyer des « conseillers » militaires. Qu'ils soient impliqués dans le conflit n'est pas notre problème."
 STALIN_Provide_Surplus_Tanks_and_Planes_desc:0 "La RPDC, même si elle ne manque pas de courage et de bravoure, a cruellement besoin de blindés et d'avions lourds, et nous pouvons facilement les lui fournir."
 STALIN_Send_Infantry_Equipment_desc:0 "En raison des violents combats, l'armée nord-coréenne a subi d'importantes pertes d'équipement et a besoin de davantage d'armes pour poursuivre la guerre. Ils obtiendront de nous tout ce dont ils ont besoin."
 STALIN_Establish_the_64th_Fighter_Aviation_Corps_desc:0 "Le 64th Fighter Aviation Corps sera un escadron aérien spécial de volontaires en Corée du Nord qui sera capable de combattre les avions à réaction occidentaux dans le ciel."
 STALIN_Increase_Korean_Production_Capabilities_desc:0 "En plus d'envoyer des canons, des chars et des avions, nous devrions également nous efforcer d'accroître la capacité de la Corée du Nord à fabriquer son propre équipement et à devenir plus autosuffisante."
 
 STALIN_Purge_Seditous_Reactionaries_desc:0 "Notre Union est minée par des agents réactionnaires traîtres et des provocateurs capitalistes. Nous devons entreprendre un effort sérieux pour les purger tous, aussi dommageables soient-ils."
 STALIN_Denounce_Leningrads_Fair_Embezzlement_desc:0 "La branche du Parti communiste à Leningrad est déloyale envers Staline, et nous avons les « preuves » pour nous débarrasser d'elle et de tout pouvoir qu'elle aurait pu détenir. De nombreuses preuves de corruption et de détournement de fonds graves ont été trouvées."
 STALIN_Purge_the_Leningrad_Dissenters_desc:0 "Maintenant que nous disposons des preuves de la culpabilité des communistes de Léningrad, nous pouvons les frapper et les purger par une série de procès."
 STALIN_Encourage_Anti_Semetism_desc:0 "Les Juifs sont la source de tous nos problèmes. Ils tirent les ficelles des gouvernements de nos ennemis capitalistes, et même les Juifs soi-disant « loyaux » ici en URSS refusent de se soumettre pleinement au dogme du Parti et d'abandonner leur religion. Nous devons les supprimer."
 STALIN_Dismantle_The_Jewish_Anti_Fascist_Committee_desc:0 "Le JAC a été créé à l'origine sous couvert de répandre la gloire du communisme et de l'Union à l'étranger auprès des communautés juives, mais ses véritables intentions sont désormais claires. La JAC n'est rien d'autre qu'un outil de la bourgeoisie."
 STALIN_Secret_Trials_for_Jewish_Intellectuals_desc:0 "Il est venu à l'attention de notre glorieux dirigeant que de nombreux intellectuels juifs notables travaillent avec des espions occidentaux pour saper l'Union. Les procès-spectacles provoqueraient trop de réactions négatives au niveau international et doivent donc rester secrets."
 STALIN_Arrest_Treasonous_Doctors_desc:0 "Notre système d'espionnage a eu vent d'un complot juif massif et dégoûtant : les médecins juifs de Moscou vont empoisonner le camarade Staline et de nombreux autres responsables du Parti communiste ! Nous devons agir avant qu'ils puissent mettre à exécution cet horrible plan."
 STALIN_Force_Berias_Withdrawal_desc:0 "Lavrenti Beria, bien qu'il soit un homme de main utile prêt à mener à bien nos projets et nos purges, a récemment acquis trop de notions de grandeur. Il est temps pour lui de se retirer."
 STALIN_Purge_Mingrelians_from_the_Georgian_Party_desc:0 "Dans un autre effort visant à affaiblir Beria, nous attaquerons ses plus fervents partisans, le groupe ethnique géorgien mingrélien. J'espère qu'il apprendra enfin sa place après cela."
 
 STALIN_The_Soviet_Airforce_desc:0 "Notre force aérienne a joué un rôle important dans la victoire de la Grande Guerre patriotique, alors que nos aviateurs intrépides ont écrasé la Luftwaffe pour la soumettre. Mais une nouvelle ère de vol est arrivée, cette fois propulsée par le moteur à réaction, et nous devons nous lancer dans cette ère avec enthousiasme."
 STALIN_Expand_MiG_15_Production_desc:0 "La production en série du MiG-15, l'un des meilleurs chasseurs à réaction que nos camarades scientifiques aient produit à ce jour, fera des merveilles pour les capacités de l'armée de l'air."
 STALIN_Develop_Sakhallin_Airfields_desc:0 "Les aérodromes de Sakhaline constituent la région extrême-orientale la plus grande de notre pays, mais ils restent terriblement petits. Leur expansion nous sera grandement bénéfique."
 STALIN_Develop_the_Tu_16_desc:0 "Le bureau d'études de Tupolev a produit le Tu-16, un bombardier biréacteur capable de transporter une arme nucléaire en profondeur en Europe occidentale. Il doit être mis en production en série aussi vite que les usines le permettent."
 STALIN_Invest_in_Supersonic_Fighters_desc:0 "Les chasseurs supersoniques sont l'avenir du combat air-air et nous ne pouvons pas nous permettre de prendre du retard dans ce domaine crucial."
 
 STALIN_The_Soviet_Army_desc:0 "L'Armée rouge a été la dernière au combat lorsqu'elle a écrasé la Wehrmacht et mis Berlin à genoux, nous valant ainsi une gloire éternelle lors de la Seconde Guerre mondiale. Cependant, nous ne pouvons pas nous reposer sur nos lauriers, car la guerre est en constante évolution et nous devons le faire aussi."
 STALIN_Begin_Mass_Production_of_the_T54_desc:0 "Le char de combat principal T-54 est notre dernière conception de CCP et est de loin supérieur à n'importe quel char américain en production. Le distribuer à l'ensemble de notre armée augmentera notre avance technologique sur l'Occident."
 STALIN_Rapid_Adoption_of_the_AK47_desc:0 "L'AK-47 est le dernier modèle brillant de Mikhaïl Kalachnikov. Il s'agit d'un magnifique fusil d'assaut au design innovant, mais toujours bon marché à fabriquer. Nous devons commencer à produire cela immédiatement."
 STALIN_Expand_the_VDV_desc:0 "Le VDV est notre branche parachutiste d'élite de l'armée. Même si les tactiques et les stratégies pour leur utilisation sont encore en cours d'élaboration, les soldats aéroportés sont toujours utiles."
 STALIN_Increase_Soviet_Air_Defense_Forces_desc:0 "En août 1950, le Conseil des ministres ordonna la construction d'un bouclier antimissile autour de Moscou. Les S-25 Berkut, deux anneaux de radars et de batteries de missiles construits sous la Troisième Direction de Beria, feront de la capitale la ville la mieux défendue au monde."
 STALIN_The_Soviet_Navy_desc:0 "La marine soviétique est petite, faible et dépassée. Sans même un transporteur à notre actif, nous ne pourrons jamais espérer rivaliser avec les Américains en haute mer. Nous ne pouvons cependant pas ignorer totalement nos flottes de surface ou sous-marines."
 STALIN_Project_30bis_desc:0 "Le projet 30bis est le nom d'un destroyer moderne et haut de gamme qui améliorera considérablement les capacités d'escorte de notre marine, et nous devrions y investir massivement."
 STALIN_Modernize_the_Black_Sea_Shipyards_desc:0 "Si les chantiers navals de la mer Noire sont nombreux, ils sont également assez vétustes et inefficaces. Cela doit changer, et bientôt."
 STALIN_Study_German_Submarine_Designs_desc:0 "Nous avons capturé un certain nombre de sous-marins allemands - ainsi que les chercheurs qui les ont conçus - à la fin de la Seconde Guerre mondiale. En étudiant la conception des sous-marins, nous pouvons améliorer notre propre flotte de sous-marins."
 STALIN_Ramp_Up_Submarine_Production_desc:0 "Les sous-marins sont la seule chance que nous avons de causer des dommages aux navires ou aux navires occidentaux en cas de conflit. Nous devons nous assurer que notre flotte est à la hauteur de la tâche."
 
 STALIN_Chase_the_Industrial_Power_Dream_desc:0 "Nous poursuivons depuis longtemps le rêve de devenir une puissance industrielle dotée d'une totale autosuffisance économique et, grâce à nos récents efforts, nous sommes plus près que jamais d'atteindre cet objectif. Il est temps de prendre notre destin en main et de réaliser enfin nos rêves."
 STALIN_Direct_Intervention_desc:0 "Nous ne pouvons pas risquer que le régime de Kim Il Sung s'effondre sous la force d'une attaque de l'OTAN. Pas de plaisanterie ici. L'intervention directe est de loin préférable à un rôle plus passif."
 STALIN_Integration_of_the_Korean_Peninsula_desc:0 "Maintenant que nous avons vaincu les capitalistes dans la guerre de Corée, il est temps pour la RPDC de se joindre à nous et à nos alliés au sein du Kominform."
 STALIN_Ensure_the_Survival_of_the_Kim_Regime_desc:0 "Maintenant que la guerre est terminée, il serait dommage que nous laissions le régime de Kim Il Sung s'effondrer et que tous nos efforts soient vains. Nous devons garantir la survie de son gouvernement pour montrer à l'Occident que nous sommes sérieux."

 KhrushchevGain:0 "Khrouchtchev gagnera en pouvoir et en influence au sein du Parti."
 KhrushchevLoss:0 "Khrouchtchev perdra considérablement son pouvoir et son influence au sein du Parti."
 BeriaGain:0 "Beria gagnera en pouvoir et en influence au sein du Parti."
 BeriaLoss:0 "Beria perdra considérablement son pouvoir et son influence au sein du Parti."
 
