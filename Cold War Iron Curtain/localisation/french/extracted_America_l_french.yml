 USA_INDO.1.b2:0 "La France décidera de la fin de cette guerre, pas Washington."
 USA_INDO.1.t2:0 "Pressions pour envisager des options diplomatiques en Indochine"
 USA_INDO.2.t:0 "La France accepte les négociations"
 USA_INDO.2.d:0 "Paris a répondu. Le Quai d'Orsay nous informe que le gouvernement français est prêt à envoyer une délégation pour négocier un règlement en Indochine et qu'il ne fera pas obstacle à une conférence internationale sur la question. Notre ambassade rapporte que la décision a été prise malgré les objections de l'état-major, qui insiste sur le fait que le poste militaire est récupérable, et que le gouvernement a dépensé une partie considérable de son autorité restante pour le conserver. Le Département d'État considère cela comme l'avancée vers laquelle nous travaillons : la guerre en Indochine sera désormais réglée sur une table plutôt que dans le delta du Tonkin."
 USA_INDO.2.a:0 "Un règlement enfin."
 USA_INDO.3.t:0 "La France refuse de négocier"
 USA_INDO.3.d:0 "Paris a refusé. Le gouvernement français nous informe qu'il n'ouvrira pas de négociations tant que ses forces restent engagées, qu'un règlement recherché en position de faiblesse abandonnerait les Indochinois qui ont risqué leur vie sur la présence française et que la conduite de la guerre reste une affaire française. Notre ambassadeur rapporte que la réponse a été rédigée par l'état-major plutôt que par le ministère des Affaires étrangères. La conséquence pratique est que les combats continuent, que le Viet Minh gagne une autre saison pour se consolider et que le prestige américain en Asie est dépensé pour financer une guerre à laquelle nous ne sommes pas autorisés à mettre fin."
 USA_INDO.3.a:0 "Alors ils le combattront sans nous."
 USA_INDO.4.t:0 "Le camp est tombé"
 USA_INDO.4.d:0 "Dien Bien Phu a disparu, et avec lui le dernier argument selon lequel la position française au Tonkin est récupérable. La dernière transmission de la garnison a été enregistrée ce matin. On a demandé aux chefs d'état-major ce qui restait du front nord et ils ont répondu par écrit qu'il n'y avait pas de front nord : il y avait des postes, et il y avait le delta, et entre eux il y avait le Viet Minh.\n\nParis ira à Genève maintenant, que nous l'approuvions ou non ; la seule question qui reste ouverte est de savoir pour quelle raison notre délégation est envoyée là-bas. L'évaluation de l'État est brutale. Un cessez-le-feu et une ligne de séparation peuvent être sauvés. Un scrutin national ne peut pas être organisé : tout vote libre organisé dans les deux zones au cours des deux prochaines années ramènerait Hô Chi Minh avec près de quatre-vingts pour cent, et le président ne signerait pas un document prévoyant la perte du pays qu'on nous demande de garantir.\n\nL'alternative est d'y assister et de ne rien signer - de laisser les Français et les communistes rédiger leurs propres accords, d'en garder les mains propres et de construire tout ce que nous construirons ensuite sur le terrain de notre propre choix."
 USA_INDO.4.a:0 "Enregistrez la ligne. Le vote ne nous appartient pas."
 USA_INDO.4.b:0 "Nous y assisterons. Nous n'y mettrons pas notre nom."
 USA_INDO.5.t:0 "Washington n'attendra pas"
 USA_INDO.5.d:0 "L'ambassadeur américain est venu au Quai d'Orsay sans rendez-vous. Il n'a pas soulevé la question de savoir s'il fallait organiser une conférence, mais plutôt la date du départ de notre délégation.\n\nDien Bien Phu a fait au gouvernement ce que quatre années de guerre n'avaient pas pu faire. L'Assemblée siège, l'état-major a cessé de donner des assurances et les agences de presse ont déjà publié le bilan des victimes. Il n'existe aucune version dans laquelle la France continue de payer pour l'Indochine, et nos alliés sont évidemment parvenus à cette conclusion un peu avant nous.\n\nIl sera demandé au corps d'armée de conserver ce qu'il détient. Le gouvernement se rendra à Genève et tentera d'empêcher que le règlement ne devienne une déroute."
 USA_INDO.5.a:0 "Ensuite, nous allons à Genève pour sauver ce qui peut l'être."
