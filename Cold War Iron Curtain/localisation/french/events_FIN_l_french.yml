 finv.1.t:0 "Cabinet Rihtniemi Ier"
 finv.1.d:0 "Après la défaite de Kekkonen aux élections présidentielles de 1968, le cabinet Paasio I décide de se dissoudre et de laisser un nouveau gouvernement se former. Le SDP a entamé les pourparlers sur la formation du gouvernement, mais n'est pas parvenu à former un gouvernement. Après ce président de Kokoomus, Juha Rihtniemi a pu former le cabinet Rihtniemi I.\n\nLe Cabinet est conservateur et se compose de Kokoomus, Keskustapuolue, SMP et SKL. Le leader du SMP, Veikko Vennamo, a été nommé ministre de l'Agriculture. Le président Virkkunen a exprimé son soutien au gouvernement et au nouveau Premier ministre Juha Rihtniemi."
 finv.2.t:0 "Le Parlement vote contre les plans d'assouplissement de la loi sur l'alcool"
 finv.2.d:0 "Aujourd'hui, le gouvernement a ignoré un paquet de lois sur l'alcool après l'échec du vote parlementaire sur ce projet par 87 voix contre 113. Cette proposition comprenait :\n-Permettre aux restaurants et aux bars de vendre plus librement davantage de types d'alcool\n-Autoriser la vente de bières douces jusqu'à 3,5 % dans les épiceries\n-Élimination progressive de la soi-disant « Booze Card » (Viinakortti)\n-Réforme des magasins Oy Alkoholiliike Ab pour qu'ils soient plus conviviaux et plus faciles à utiliser\n-Une meilleure connaissance des dangers de l'alcool.\n\nMais aujourd'hui, les lois restent les mêmes qu'avant. Le gouvernement actuel en est satisfait, tout comme le président Virkkunen."
 finv.3.t:0 "Cabinet Junnila Ier"
 finv.3.d:0 "Après le décès de l'ancien Premier ministre Juha Rihtniemi, de nouvelles élections parlementaires ont eu lieu. Les élections ont été remportées par Kokoomus, qui a formé le cabinet Junnila I. Il s'agit d'un gouvernement de coalition majoritaire formé par Kokoomus, Keskustapuolue, SMP et Liberaalit. Le nouveau Premier ministre est Tuure Junnila."
 finv.4.t:0 "Hannu Salama condamné à une peine plus sévère"
 
 fin.2.d:0 "Alors que de nombreux pays ont commencé leurs recherches sur les ordinateurs bien des années avant la Finlande, c'est finalement au milieu des années 1950 que l'Université de technologie d'Helsinki a commencé à mener des recherches approfondies sur la technologie en Finlande. Le travail a été confié à un groupe de travail appelé Matematiikkakonekomitea, connu en anglais sous le nom de Mathematics Machine Committee, dirigé par Erkki Laurila.\n\nIls ont commencé à travailler sur un premier ordinateur finlandais basé sur un prototype d'ordinateur allemand G1a. Cependant, le projet a été confronté à de nombreux problèmes, notamment des erreurs dans les plans, l'impossibilité de le modifier car il s'agissait d'une conception prédéfinie et le fait que le G1a était déjà obsolète. L'ordinateur, nommé ESKO, abréviation de Elektroninen SarjaKOmputattori, a finalement été achevé en 1960.\n\nLe premier ordinateur en Finlande fut cependant un IBM 650 surnommé ENSI commandé par Postisäästöpankki en 1958."
 fin.3.t:0 "Décès du président J.K. Paasikivi"
 fin.3.d:0 "Le président Juho Kusti Paasikivi est décédé à l'âge de 86 ans. Il avait passé ses dernières semaines à l'hôpital Salus d'Helsinki en raison de problèmes cardiaques et d'une fatigue générale. À 10 h 20, il a souffert d'une insuffisance cardiaque majeure et, malgré tous les efforts du médecin, il est décédé peu de temps après.\n\nSes funérailles devraient avoir lieu avec les honneurs nationaux à Helsinki Suurkirkko fin décembre. Sa dernière demeure sera au cimetière de Hietaniemi à Helsinki. \"Suuren vainajan mukana oli poistunut kappale Suomen historiaa, jota hän itse oli ollut luomassa!\" (\"Avec ce grand malheur s'est évaporé un morceau de l'histoire finlandaise qu'il était là pour créer lui-même!\"), a déclaré le journaliste de Filmisepo lors d'un journal télévisé.\n\nComme il est décédé au pouvoir, il est temps d'élire le nouveau président. Le candidat le plus probable est Urho Kekkonen, un proche allié de Paasikivi.§YCependant, certains pensent qu'Hertta Kuusinen pourrait également gagner si elle devenait présidente après la mort de Mauno Pekkala et si Paasikivi décidait de promouvoir l'unité finlandaise.§!"
 fin.4.t:0 "Qu'est-ce que la doctrine Paasikivi-Kekkonen ?"
 fin.4.d:0 "La doctrine Paasikivi-Kekkonen est une doctrine de politique étrangère établie par le président Juho Kusti Paasikivi et son proche allié Urho Kekkonen, qui vise à maintenir la Finlande comme un pays indépendant, souverain, démocratique et capitaliste à proximité immédiate de l'Union soviétique. Cela implique de prendre des mesures parfois même radicales pour s'assurer que les Soviétiques considèrent la Finlande comme un bon voisin.\n\nLa doctrine a cependant fait l'objet de nombreuses critiques, allant de la part des Soviétiques qui ne considéraient pas la Finlande comme neutre, de la coopération avec les agences de renseignement occidentales, à certains considérant que la doctrine tendait vers une « liturgie » de bonnes relations."
 fin.5.t:0 "Négociations sur le retour de Porkkala"
 fin.5.d:0 "La base navale de Porkkala est une base navale soviétique située dans la péninsule de Porkkala, comprenant les municipalités de Deferby, la plupart de Kirkkonummi, Porkkalanniemi, Upinniemi et plusieurs petites îles. La base est située à seulement 30 kilomètres (19 mi) à l'ouest d'Helsinki. Selon l'armistice de 1944, la zone fut louée à l'Union soviétique pour 50 ans. Le 10 février 1947, le traité de paix de Paris réaffirme le droit de l'Union soviétique à occuper cette zone jusqu'en 1994.\n\nDécrit par certains comme un poignard pointé vers la capitale finlandaise, il offrirait un avantage remarquable aux Soviétiques en cas de guerre. En conséquence, il serait dans notre intérêt de chasser les Soviétiques de là.\nCependant, des rumeurs ont circulé selon lesquelles ils pourraient être disposés à nous le restituer en raison des progrès technologiques rendant l'artillerie côtière obsolète, tout en montrant à l'Occident les relations pacifiques entre nos nations. Malgré cela, lorsque notre diplomate Eero A. Wuori a interrogé l'ambassadeur soviétique Viktor Lebedev sur ces rumeurs, celui-ci les a rapidement écartées, affirmant que \"Porkkala est essentiel à la défense de Leningrad et inoffensif pour la Finlande\". Cela n'a cependant pas arrêté les rumeurs et il a été conseillé à [FIN.GetLeader] d'en discuter lors de la prochaine visite d'État."
 fin.5.a:0 "Espérons le meilleur"
 fin.6.t:0 "Rencontre avec le leader finlandais"
 fin.6.d:0 "Le président finlandais [FIN.GetLeader] est arrivé il y a quelques heures en visite d'État. Après une petite visite de Moscou et un dîner, il était temps de discuter diplomatiquement. Après une brève discussion sur la situation mondiale, la discussion s'est orientée vers les relations entre nous et la Finlande. Premièrement, il a été décidé que l'accord d'amitié, de coopération et d'assistance mutuelle (YYA) serait prolongé de 20 ans. À un moment donné, la région de Porkkala est devenue un sujet de discussion. [FIN.GetLeader] a mentionné avoir entendu des rumeurs selon lesquelles nous pourrions être prêts à le restituer plus tôt.\n\nIl est vrai que depuis un moment, [SOV.GetLeader], aux côtés de plusieurs généraux, réfléchissent à l'utilité de la base. À mesure que la technologie a progressé considérablement depuis que nous avons acquis la base en 1944, les avantages initiaux ont été perdus. Entre autres choses, l'entretien de la base est très coûteux en raison de son emplacement et de la nécessité d'une sécurité extrêmement stricte aux frontières.\n\n[SOV.GetLeader] n'a pas nié ces rumeurs, mais n'a pas voulu en partager les raisons pour des raisons de sécurité de l'État. [FIN.GetLeader] a ensuite demandé si nous serions disposés à entamer des négociations sur le retour de la base en Finlande."
 fin.6.tt:0 "Cela signifie que vous conservez la base jusqu'à la fin du bail (1994). Notez cependant qu'il est très coûteux à entretenir en raison de son emplacement et de la nécessité d'une sécurité extrêmement stricte aux frontières. Avec le temps, les coûts ne feront qu'augmenter. Parallèlement à cela, le personnel en poste là-bas a tendance à s'intéresser très peu à ses tâches, préférant s'enivrer et semer le trouble. Certains pourraient même tenter de faire défection vers la Finlande.\nSi cela ne suffit pas, nous ratons une grande opportunité diplomatique de montrer à l'Occident notre volonté de faire la paix avec notre voisin neutre. Il est peu probable que le gouvernement finlandais s'oppose à notre décision, mais le peuple finlandais sera aigri. [SOV.GetLeader], nous ne vous en empêcherons pas, mais n'oubliez pas que nous vous avions prévenu.\n"
 fin.7.d:0 "Le[GetDateText], la population finlandaise a été choquée par la nouvelle du décès du maréchal Carl Gustaf Mannerheim la veille au soir en Suisse. Le départ du maréchal était attendu tant dans l'entourage que parmi le peuple finlandais.\nQuelques jours plus tôt, Mannerheim était tombé malade et avait subi une opération abdominale d'urgence. L'opération a réussi, mais son coeur ne pouvait plus résister aux tensions des maladies précédentes. Il comprit que la fin était proche, dit au revoir aux personnes présentes et les remercia pour tout ce qu'ils avaient fait pour lui. Peu de temps après, il a perdu connaissance et est décédé quatre heures plus tard.\nA l'Hôpital de Canton, le corps du Maréchal reposait sur un podium au milieu de la chapelle, recouvert du drapeau finlandais et entouré de fleurs. Autour de lui se tenaient des policiers suisses en garde d'honneur. Le lendemain, le président [FIN.GetLeader] a parlé solennellement et magnifiquement à la radio de la mémoire de Mannerheim et de l'oeuvre de sa vie. Le gouvernement a nommé une commission chargée de préparer les funérailles nationales. Il a été décidé que les funérailles auraient lieu 2 semaines plus tard."
 fin.8.t:0 "Porkkala revient à nous !"
 fin.8.d:0 "Le président [FIN.GetLeader] revient victorieux de sa visite d'État en Union soviétique. Après d'étroites négociations avec [SOV.GetLeader], il a été décidé que Porkkala nous serait restitué. Cela prendra cependant plusieurs mois alors que les Soviétiques s'apprêtent à quitter la zone en détruisant les installations militaires et en éloignant leurs troupes. En attendant, nous devons ratifier l'accord au Parlement et nous préparer à restituer les terres à leurs propriétaires légitimes. Peu de temps après son arrivée, le président [FIN.GetLeader] a prononcé un discours à la radio dans lequel il a déclaré : « Pour la première fois, je reviens d'Union soviétique satisfait. La plume a réparé ce que l'épée a brisé. »\n\nUn autre sujet de la réunion a été l'accord d'amitié, de coopération et d'assistance mutuelle (YYA), qui a été renouvelé pour 20 ans supplémentaires."
 fin.9.t:0 "Porkkala reste avec les Soviétiques"
 fin.9.d:0 "Le Président [FIN.GetLeader] est revenu d'une visite d'État en Union Soviétique. Malgré de grands espoirs, ils ont refusé de nous restituer Porkkala. Bien que [SOV.GetLeader] ait confirmé qu'il avait été pris en compte, il a finalement été décidé que la zone leur était toujours utile. En plus de cela, la réunion a été qualifiée de bonne.\n\nUn autre sujet était l'accord d'amitié, de coopération et d'assistance mutuelle (YYA). Il a été prolongé de 20 ans sans modification, malgré certaines objections."
 fin.10.t:0 "Jour de retour"
 fin.10.d:0 "Après des mois de préparatifs de notre part et des Soviétiques, la région de Porkkala revient enfin sous notre contrôle après avoir été contrôlée par les Soviétiques depuis 1944. Les derniers soldats soviétiques ont quitté la région et l'accord de retour a été signé à l'ambassade soviétique à Helsinki.\nPeu de temps après, les portes frontalières se sont ouvertes sur le pont d'Espoonlahti et les soldats finlandais ont marché vers la zone. Les Soviétiques organisèrent une visite de la région aux journalistes finlandais et étrangers.\n\nLa presse qualifie l'événement de « victoire pour la doctrine Paasikivi-Kekkonen ». Certains y voient même une possibilité de retour de la Carélie. Le retour a cependant également suscité quelques critiques, certains reprochant à Kekkonen de s'attribuer trop de crédit à l'événement. Le ministre Aarre Simonen a minimisé l'importance de l'événement, car l'accord n'incluait pas la Carélie. Le président [FIN.GetLeader] l'a sévèrement réprimandé, mettant fin à son discours en déclarant \"Peut-être que M. Simonen se rend lui-même à Moscou et amène un soldat américain avec lui\".\n\nComme les Soviétiques n'avaient plus beaucoup d'utilité pour la base vers la fin, de nombreux bâtiments restants montraient des signes de négligence. Pire encore, de nombreux cimetières ont été détruits et des tombes vandalisées. Bien que cela ait été considéré comme l'oeuvre de quelques soldats ivres, ils ont déjà accepté de réparer les dégâts et de verser d'abondantes compensations pour cela."
 fin.11.t:0 "[GetNewspaperHeader]Un acte de gentillesse soviétique"
 fin.11.d:0 "Aujourd'hui, l'Union soviétique a montré sa volonté de paix. Dans une annonce conjointe faite par le président finlandais [FIN.GetLeader] et le secrétaire général [SOV.GetLeader], ils ont annoncé que l'Union soviétique restituerait à la Finlande la base navale de Porkkala, située juste à côté d'Helsinki.\n\nL'Union soviétique a loué la base navale de Porkkala pour cinquante ans en 1947 dans le cadre de l'accord de paix avec la Finlande. Les raisons avancées pour l'occupation de Porkkala étaient liées à la défense des voies maritimes soviétiques dans le golfe de Finlande et à la protection de Léningrad. Cependant, Porkkala fonctionnait également comme une base militaire qui jouait un rôle dans les opérations terrestres soviétiques projetées.\n\nAlors que le peuple finlandais célèbre ce retour, de nombreux pays occidentaux l'ont qualifié de simple coup de propagande à bas prix."
 fin.12.t:0 "Dernier train pour l'Union"
 fin.12.d:0 "226 500 000 dollars. C'est le montant que nous avons été contraints de payer à l'Union soviétique dans le cadre de l'armistice de Moscou. Année après année, des trains, des bateaux, des moteurs et d'autres articles ont été fabriqués et envoyés en Union soviétique. Mais pas plus. Le dernier train de réparation est parti de la gare frontalière de Vainikkala.\nPartout dans le pays, les gens font la fête. Non seulement nous sommes libérés d'un énorme fardeau financier, mais nous avons réalisé quelque chose de concret. Certains disent même qu'une partie de notre indépendance est revenue.\nPour célébrer, une grande fête est organisée dans le hall d'exposition d'Helsinki, avec les discours d'Urho Kekkonen, Penna Tervo, Svante Sundman et Pavel Kumykin."
 fin.13.t:0 "Conclusion du 8ème Festival Mondial de la Jeunesse et des Etudiants"
 fin.13.d:0 "Le 8ème Festival mondial de la jeunesse et des étudiants, un événement historique célébrant la paix et l'amitié, s'est récemment terminé à Helsinki. Organisé par la Fédération mondiale de la jeunesse démocratique et l'Union internationale des étudiants, avec le soutien important de notre gouvernement, ce festival a marqué une réalisation majeure pour la Finlande, démontrant notre engagement en faveur de l'unité mondiale en pleine guerre froide.\n\nLe festival, qui a coûté 853 millions de marks et constitue le plus grand événement organisé à Helsinki depuis les Jeux olympiques de 1952, a attiré environ 52 000 participants venus de 137 pays. Présentant plus de 1 000 événements, il a offert une plateforme dynamique pour les échanges culturels et la solidarité internationale. L'apparition du cosmonaute soviétique Youri Gagarine a été un moment fort de l'événement.\n\nCependant, en réponse à notre accueil de cet événement, les États-Unis et le Royaume-Uni ont organisé un contre-festival, géré par l'Independent Research Service. Bien que moins important, cet événement parallèle visait à promouvoir la culture et les valeurs occidentales, illustrant la lutte acharnée idéologique de l'époque.\n\nEn réfléchissant à la devise du festival, « Pour la paix et l'amitié », il devient clair que cet événement était plus qu'un rassemblement ; c'était une déclaration de nos valeurs et de notre vision du monde. L'héritage du festival, témoignage de l'attachement de la Finlande à ces idéaux, laisse une empreinte durable sur la scène internationale, favorisant l'espoir et le dialogue dans une époque définie par la division."
 fin.13.tt:0 "Donnez à la Finlande le contrôle de la Carélie sans l'intégrer."
 fin.14.t:0 "Demande refusée"
 fin.14.d:0 "Malheureusement, les Soviétiques ont refusé notre demande d'obtenir la Carélie."
 fin.15.t:0 "Acceptation partielle"
 fin.15.d:0 "Les Soviétiques ont partiellement accédé à notre demande concernant la Carélie. Ils nous permettront d'administrer la région, mais nous ne sommes pas autorisés à l'intégrer."
 fin.16.t:0 "La Carélie est à nous !"
 fin.16.d:0 "Les Soviétiques ont accédé à notre demande concernant la Carélie. Il fera désormais partie de notre nation."
 fin.17.t:0 "Fin de la démocratie"
 fin.17.d:0 "La démocratie est morte pour nous aujourd'hui. Comme l'a annoncé la secrétaire générale Hertta Kuusinen, la République de Finlande n'existe plus. À sa place s'élève la République démocratique finlandaise, un État pour les travailleurs, libre de l'oppression du capitalisme et du fascisme. Personne ne peut vraiment dire avec certitude comment cela s'est produit, mais cela n'a plus d'importance maintenant."
 fin.18.t:0 "[GetNewspaperHeader]Première émission télévisée"
 fin.18.d:0 "La première émission télévisée finlandaise a eu lieu aujourd'hui. Plus d'une cinquantaine de personnes étaient invitées à suivre l'émission. Il y avait quinze récepteurs dans différents quartiers d'Helsinki. L'image de réglage avec musique a commencé à être diffusée à 16h00. Le programme proprement dit a commencé à 16h30 avec le Quatuor Choeur Polytechnique et le discours d'ouverture de B. Wuolte, Recteur de l'Université. Il y avait une caméra. Le programme était animé par l'acteur Lasse Pöysti. Les artistes Helena Vinkka, Rauha Rentola et Maikki Länsiö étaient également présentes. Il y avait aussi un programme en suédois : les artistes Birgitta Ulfsson et Nils Brandt ont réalisé un sketch intitulé Armi et Gil dans le train. Les enfants ont pu assister à un spectacle de marionnettes Mona Leon. Le programme comprenait également de l'hypnose et des critiques d'actualités. L'émission d'une heure s'est terminée par un point météo et la distribution de bourses à Hämäläinen et Larkka. Enfin, le professeur Jouko Pohjanpalo a dit au revoir au public en disant : « Au revoir et à plus tard ! L'émission n'a pas été enregistrée.\n\nLa diffusion télévisée régulière a commencé en 1956 avec deux émissions hebdomadaires. La première émission en couleur a eu lieu le 24 mai 1960."
 fin.19.t:0 "Réunion du Parti communiste"
 fin.19.d:0 "Le moment est venu de s'adresser aux dirigeants de la nation. Hertta Kuusinen a exprimé sa volonté de continuer à diriger le pays. Avec beaucoup de soutien, peu de gens sont capables de contester sa position de manière réaliste. Deux personnes se sont toutefois opposées à elle. Aimo Aaltonen, président du Parti communiste qui a dirigé le service finlandais de renseignement de sécurité et Ville Pessi, un homme modeste ouvert à la collaboration avec les sociaux-démocrates. Qui sera-ce ?"
 fin.20.t:0 "Loi sur la conservation du phoque annelé de Saimaa"
 fin.20.d:0 "Aujourd'hui, nous avons franchi une étape majeure vers la protection du phoque annelé Saimaa. L'espèce bénéficie désormais d'un statut protégé, c'est-à-dire qu'il est interdit de la chasser ou de la tuer. Alors qu'il n'en reste qu'une centaine, la décision a été saluée par beaucoup. Certains pêcheurs protestent cependant, affirmant que « personne ne devrait s'en soucier »."
 fin.21.t:0 "Critique du discours juste"
 fin.21.d:0 "Aujourd'hui, le président Eino Kilpi a prononcé un discours sur la situation politique actuelle en Finlande. Le discours, qui a duré environ 20 minutes, était principalement constitué de critiques à l'égard des partis de droite et de leur refus de coopérer. Le discours a été décrit comme étant « extrêmement insipide, plein de discours politiques secs dont la plupart des citoyens ne se soucient pas ». Néanmoins, certains ont salué le discours et le président pour avoir osé parler contre la droite."
 fin.22.t:0 "Exil d'éminents sociaux-démocrates"
 fin.22.d:0 "Après avoir accédé au pouvoir, les communistes ont commencé à purger leurs rivaux, frappant le plus durement les sociaux-démocrates. Mais aujourd'hui, ils ont décidé de les frapper encore plus fort. Quiconque ne voulait pas renoncer à son idéologie en faveur du communisme était envoyé en exil. Parmi les exilés figurent : Onni Hiltunen, Väinö Tanner, Aarre Simonen, Väinö Leskinen et K.-A. Fagerholm. Avec l'exil de ses principaux dirigeants, le parti s'est réduit à n'être plus qu'un parti fantoche du SKP."
 fin.23.t:0 "Décès du président Pekkala"
 fin.23.d:0 "Décidant de se détendre après le travail, Pekkala a décidé de dîner avec plusieurs ministres de haut rang. Cependant, pendant les desserts, Pekkala a commencé à se plaindre de fortes douleurs dans le haut de la poitrine accompagnées d'une transpiration excessive. Alors qu'il se levait pour aller aux toilettes, il a vomi et s'est rapidement évanoui, se cognant la tête sur le côté de la table. Une ambulance a été appelée rapidement et est arrivée en quelques minutes. Les gens ont vu sous le choc Pekkala, inconscient et en sang, être transporté à l'hôpital de la Croix-Rouge finlandaise à Töölö.\nAu moment où il est arrivé à l'hôpital, Pekkala avait cessé de respirer. Pendant 78 minutes, les médecins ont tenté de le ressusciter, mais sans résultat.\nLes rapports coronariens ont indiqué que la cause du décès était « un infarctus du myocarde, causé par plusieurs années d'abus d'alcool ».\nPeu de temps après, sa mort a été annoncée à la radio aux citoyens finlandais. Ses funérailles devraient avoir lieu à la cathédrale d'Helsinki dans une semaine, sa dernière demeure étant au cimetière de Hietaniemi.\n\nNormalement, de nouvelles élections devraient avoir lieu pour choisir son successeur, mais le Parlement a choisi de promulguer une loi d'urgence et de voter directement pour son successeur. Après plusieurs jours, le vote a commencé pour les candidats finaux. La course oppose deux candidats : Eino Kilpi, un socialiste modéré. L'autre candidat est la secrétaire générale radicale du SKDL, Hertta Kuusinen. Même si elle n'a aucune chance dans une élection équitable, avec une certaine ingérence soviétique, elle pourrait avoir une chance de gagner. Maintenant que les votes sont comptés, le gagnant est..."
 fin.24.t:0 "Des communistes présumés évincés"
 fin.24.d:0 "Même si Eino Kilpi se considère comme socialiste, il n'aime pas trop le communisme radical. En tant que tel, il envisage de débarrasser le gouvernement des communistes radicaux. Avec l'aide du Suojelupoliisi, Kilpi a réussi à dresser une liste de "
 fin.25.t:0 "Les Soviétiques refusent de céder la Carélie"
 fin.25.d:0 "Comme prévu, les Soviétiques ont refusé de nous restituer la Carélie perdue. Ils ont répondu par une courte lettre expliquant leur besoin de terres et ainsi de suite, mais nous savons tous que c'est une question de géopolitique."
 fin.26.t:0 "Une grève générale"
 fin.26.d:0 "Après la fin des mesures gouvernementales de contrôle des prix d'après-guerre en 1955, les prix de nombreux biens et services ont augmenté. Le coût de la vie en Finlande a augmenté de 7 % en deux mois. L'Organisation centrale des syndicats finlandais (SAK) a tenté d'augmenter le niveau global des salaires pour tenir compte de la hausse du niveau des prix. Malgré des conflits internes sur les petits caractères, le SAK exigeait une augmentation de 12 millions de dollars par heure, ce qui augmenterait les salaires des travailleurs finlandais de 6 à 10 pour cent.\nLe (EXPURGÉ), la direction du SAK a décidé de lancer une grève générale. Suite à l'échec des négociations d'urgence entre le SAK et le président du Parlement de l'époque, Karl-August Fagerholm, l'action revendicative a débuté à 6 heures du matin (EXPURGÉ), le jour où le président [FIN.GetLeader] a pris ses fonctions pour son premier mandat."
 fin.27.t:0 "Fin de la grève générale"
 fin.27.d:0 "La grève générale est désormais terminée et elle a abouti à une augmentation des salaires de 6 à 10 pour cent à l'échelle nationale. Pendant la grève, les activités d'information ont été paralysées. La SAK n'a pas autorisé la publication de journaux pendant la grève. Les programmes de radio diffusés n'ont pas été affectés par la grève générale. Le résultat fut un petit black-out médiatique. Les journaux ont fait connaître la grève en publiant des documents. Des tracts ont été distribués dans les rues et affichés sur les vitrines des agences et des grands magasins, par exemple. Il y a eu plusieurs émeutes violentes pendant la grève, faisant des blessés, mais des morts ont été évitées. Les tentatives visant à suspendre la distribution d'essence ont donné lieu à des affrontements très violents."
 fin.28.t:0 "[GetNewspaperHeader]La Finlande défie l'Union soviétique"
 fin.28.d:0 "La Finlande, un petit pays du nord de l'Europe, a adopté une position ferme contre son voisin oriental, l'Union soviétique, dans une tournure d'événements sans précédent."
 fin.29.t:0 "Accorder un visa à Otto Wille Kuusinen ?"
 fin.29.d:0 "Aujourd'hui, nous avons reçu une demande de visa de l'Union Soviétique. Plus précisément, d'Otto Wille Kuusinen. Pendant la guerre civile, il fut l'une des figures de proue de la République socialiste ouvrière finlandaise. Après la guerre civile, il s'enfuit en Union soviétique. Selon le service de renseignement de sécurité, avant la guerre, il travaillait comme espion en Scandinavie. Il était l'un des rares communistes finlandais de premier plan à avoir survécu aux purges de Staline. En décembre 1939, pendant la guerre d'hiver, il fut nommé chef de la République démocratique finlandaise soutenue par les Soviétiques, mais celle-ci fut dissoute seulement 3 mois plus tard, en mars 1940. Après cela, il fut nommé président du Présidium du Soviet suprême de la RSS carélo-finlandaise jusqu'en 1956.\n\nDésormais, le ministère des Affaires étrangères doit décider s'il l'autorisera à venir ou s'il lui refusera l'entrée. Le visa est demandé pour 60 jours, « pour visite générale ». Les renseignements suggèrent qu'il envisage de participer au 40e anniversaire du Parti communiste et au 100e anniversaire de Jyväskylän Lyseo.\n\nLe choix disponible est déterminé par votre président actuel."
 fin.30.t:0 "Boom économique dû à la guerre de Corée"
 fin.30.d:0 "La guerre de Corée qui a éclaté a provoqué une reprise économique soudaine et brutale de l'économie mondiale, touchant même notre petite économie finlandaise. Selon les professeurs d'économie, la raison en est la menace d'une plus grande guerre, voire même d'une Troisième Guerre mondiale. Les grandes puissances tentent rapidement de s'emparer du marché mondial de tous les biens de guerre nécessaires. La demande en Finlande concernait principalement la cellulose, mais également tous les autres produits d'exportation liés au bois. Nous espérons que ce joli coup de pouce durera encore un certain temps."
 fin.31.t:0 "Troubles économiques"
 fin.31.d:0 "Il semble que notre dynamisme économique touche à sa fin. La Grande Guerre n'a pas éclaté, mais les stocks sont pleins et l'offre augmente. Pour la cellulose. Les États-Unis ont déjà commencé à réglementer les importations de cellulose nordique et de nombreux pays européens réduisent les prix des produits du bois. Combinée à une certaine mauvaise gestion économique, nous nous dirigeons désormais vers l'inflation. Nous devrions résoudre ce problème dès que possible."
 fin.32.t:0 "Le sort du programme K"
 fin.32.d:0 "Au cours du cabinet Kekkonen III, le Premier ministre Urho Kekkonen a présenté un programme de politique économique appelé programme K, destiné à résoudre les problèmes de compétitivité causés à l'industrie par la fin de la reprise provoquée par la guerre de Corée. Dans le cadre de ce programme, les allocations familiales auraient été supprimées, les employeurs auraient bénéficié d'allègements fiscaux et une réduction de 10 % du revenu salarial total aurait été mise en oeuvre. Les sociaux-démocrates impliqués dans le gouvernement n'ont pas approuvé le programme et, par conséquent, le cabinet Kekkonen III s'est effondré et a été remplacé par le cabinet Kekkonen IV, composé de partis bourgeois et constituant un gouvernement minoritaire.\nÀ l'automne 1953, le cabinet Kekkonen IV rédigea une proposition pour le budget de l'État appelée « Niukkis-budjetti » (le budget avare), qui aurait réduit considérablement les dépenses sociales, y compris les dépenses statutaires, conformément aux propositions du programme K. Cependant, en octobre 1953, le conseil d'administration de Kekkonen annonça qu'il était prêt à abandonner le programme K.\n\nAujourd'hui, la question est à nouveau évoquée. Après les récentes élections parlementaires, il a été très difficile de former un gouvernement. Le SAK et le SDP ont annoncé qu'ils soutiendraient le gouvernement Kekkonen V s'ils acceptaient d'annuler définitivement le programme K et de le remplacer par un nouveau programme S. Ce serait à l'opposé du programme K et encouragerait plutôt les dépenses publiques. Cependant, si nous le voulons vraiment, nous pouvons graisser quelques rouages et amener le SDP à accepter le programme K."
 fin.33.t:0 "Renaissance du ValPo Rouge"
 fin.33.d:0 "Le Valpo rouge fait référence à la phase de la police d'État finlandaise, où l'organisation de l'agence était en grande partie entre les mains des communistes en 1945-1948. Bien qu'elle ait été réformée et purgée des communistes en 1949, nous avons décidé de la réintégrer avec des communistes et des socialistes. Le directeur Armas Alhava a été contraint de démissionner et a été remplacé par Eero Hautojärvi. Parallèlement à cela, ses anciens droits sont rétablis, notamment le droit d'arrêter et d'interroger des suspects, le droit d'être mis sur écoute et des droits plus larges d'infiltration."
 fin.34.t:0 "[GetNewspaperHeader]Assouplissement des lois sur l'alcool ; Menace ou opportunité ?"
 fin.34.d:0 "Aujourd'hui, le gouvernement a annoncé une proposition visant à assouplir les lois sur l'alcool dans le pays. Cette proposition comprend des éléments tels que :\n-Permettre aux restaurants et aux bars de vendre plus librement davantage de types d'alcool\n-Autoriser la vente de bières douces jusqu'à 3,5 % dans les épiceries\n-Élimination progressive de la soi-disant « Booze Card » (Viinakortti)\n-Réforme des magasins Oy Alkoholiliike Ab pour qu'ils soient plus conviviaux et plus faciles à utiliser\n-Une meilleure connaissance des dangers de l'alcool.\nTandis que d'autres célèbrent ces changements, d'autres s'y opposent. L'opposition la plus farouche vient du mouvement de tempérance, qui affirme que « ces changements absurdes conduiront sûrement notre nation sur la voie d'un alcoolisme destructeur ». La loi devrait être adoptée lors du vote parlementaire."
 fin.35.t:0 "La Finlande propose un programme d'échange d'étudiants"
 fin.35.d:0 "Aujourd'hui, nous avons reçu une proposition de la Finlande. Ce document décrit les plans d'un programme d'échange étudiant de 10 ans pour les étudiants de 18 ans et plus. Cela pourrait être une excellente occasion d'approfondir nos relations et "
 fin.36.t:0 "[FROM.GetName] Accepte le programme d'échange étudiant"
 fin.36.d:0 "[FROM.GetName] a décidé de rejoindre le programme d'échange étudiant. Les préparatifs sont déjà en cours et le programme démarrera bientôt officiellement."
 fin.37.t:0 "[FROM.GetName] Refuse le programme d'échange d'étudiants"
 fin.37.d:0 "[FROM.GetName] a décidé que pour l'instant ils resteraient en dehors du programme d'échange étudiant. Quelles que soient leurs raisons, nous ne le saurons pas."
 fin.38.t:0 "Tentative d'assassinat de Kekkonen ?"
 fin.38.d:0 "§RTOP SECRET : SUR ORDRE DU PRÉSIDENT, CE DOCUMENT DOIT ÊTRE GARDÉ TOP SECRET !§!\n\nUne tentative d'assassinat du président a été commise pendant ses vacances de Saint-Jean à Kultaranta. Kekkonen venait de franchir la porte du bâtiment principal de Kultaranta, le Château de Granite. Puis un coup de feu est venu de quelque part et a touché le mur de pierre de l'escalier du bâtiment principal. La police et les services de sécurité ont immédiatement fouillé la zone mais n'ont trouvé personne. Toutefois, d'après le lieu de l'impact, on peut déduire que le tireur connaissait l'intérieur du bâtiment.\nKekkonen a décidé que cet incident devait rester secret. Toutes les personnes présentes ont reçu pour instructions strictes de garder le silence sur l'incident. En conséquence, le seul document sur l'incident est une note écrite à l'intention du personnel de Kultaranta : \"Le Président de la République informe que la fenêtre du 2ème étage du château a été brisée. Contactez le chef de la police.\"\nLe rapport d'enquête conclut que l'acte a été soigneusement planifié : au milieu de l'été, le bruit des coups de feu se mêlerait à celui des feux d'artifice. La balle a été tirée avec une arme de précision depuis un bateau ou un îlot voisin. Le tireur n'a pas été identifié. Le motif n'est pas certain, mais selon l'évaluation de la police, il s'agissait d'un avertissement : c'est ce que nous pouvons faire si votre politique va trop loin vers l'Est."
 fin.39.t:0 "Maalaisliitto change de marque"
 fin.40.t:0 "Catastrophe aérienne de Koivulahti"
 fin.40.d:0 "Le 3 janvier 1961, un avion de ligne Aero Oy DC-3 en route de Kokkola à Vaasa s'est écrasé au sol dans la région de Koivulahti à Mustasaari. 22 passagers et trois membres d'équipage ont été tués dans l'accident.\n\nL'avion devait décoller de l'aéroport de Kronoby à 7h00, mais les préparatifs du décollage ont pris du retard et l'avion a décollé à 7h16. Les pilotes n'ont pas respecté l'altitude minimale de vol pour la route Kronoby-Vaasa, qui était de 1 500 pieds, mais ont plutôt volé en dessous de 330 pieds. Peu de temps après le dernier contact radio de l'avion avec le contrôle aérien, l'avion a viré brusquement vers la gauche. Cela a ralenti l'avion et perturbé considérablement le flux d'air. Les pilotes ont tenté de corriger la situation en mettant les gaz à fond, mais cela n'a pas aidé et l'avion est parti en vrille. La dernière chose vue par des témoins oculaires au sol était que les pilotes avaient allumé les phares d'atterrissage avant que l'avion ne s'écrase dans les bois à 7 h 40 min 30 s dans un virage serré à 70 degrés.\nLes premiers intervenants, arrivés sur le lieu de l'accident dix minutes après l'accident, n'ont pu secourir personne en raison des flammes intenses qui ont atteint plus de 15 mètres (49 pieds) de hauteur. L'avion a été largement détruit par les forces d'impact et l'incendie.\n\nLes responsables du comité d'enquête sur les accidents de Finlande ont conclu que l'OH-LCC était en état de navigabilité. Aucune preuve n'a été trouvée d'un dysfonctionnement technique, d'un avion heurtant des arbres ou d'une explosion. Selon le rapport, ni le pilote, le capitaine Lars Hattinen, ni le copilote, le premier officier Veikko Halme, n'étaient en état de voler. Ils n'avaient pas bien dormi la nuit précédente et avaient beaucoup bu. Les autopsies ont révélé que Hattinen avait un taux d'alcoolémie de 0,20 (2 ‰), tandis que Halme en avait 0,156 (1,56 ‰). Au total, Hattinen, Halme et l'éventuel visiteur du cockpit avaient bu seize bouteilles de bière, sept gin grog et 900 grammes de cognac entre 21h50 et 02h00. Hattinen avait ainsi négligé sa responsabilité quant à la sécurité de l'avion et des passagers, et ni lui ni Halme n'étaient en mesure de piloter l'avion le jour de l'accident.\n\nLa cause probable de l'accident a été déterminée comme étant une erreur du pilote lors d'un virage à gauche. Il est possible qu'un passager ait été présent dans le cockpit en fonction de l'emplacement de son corps."
 fin.41.t:0 "Démarrage du FiR 1"
 fin.41.d:0 "Aujourd'hui, nous avons lancé notre premier réacteur nucléaire, Otaniemen tutkimusreaktori (réacteur de recherche d'Otaniemi). Il s'agit d'un réacteur de recherche situé dans la zone du campus d'Otaniemi, dans la ville d'Espoo. Le réacteur TRIGA Mark II a une puissance thermique de 250 kilowatts. Outre la recherche, le réacteur est utilisé pour la production d'isotopes radioactifs destinés aux mesures industrielles. Il est également utilisé pour l'analyse par activation neutronique de matériaux géologiques et biologiques.\n\nUn contrat d'achat du réacteur de recherche a été signé en 1960. Les personnes les plus actives derrière l'acquisition étaient Pekka Jauho, Erkki Laurila et Heikki Lehtonen. Le projet de réacteur de recherche prépare la construction d'une centrale nucléaire en Finlande. Un réacteur de recherche est nécessaire pour la formation du personnel des réacteurs de puissance.\nFiR 1 a commencé à fonctionner en 1962 à 13 h 44 lorsque le président [ROOT.GetLeader] a démarré le réacteur."
 fin.42.t:0 "Scandales de corruption"
 fin.42.d:0 "Deux scandales de corruption majeurs ont éclaté. Affaire de l'Institution d'assurance sociale de Finlande et affaire de l'école de sages-femmes.\nL'affaire de l'Institution d'Assurance Sociale est une affaire qui a été révélée en 1961 concernant la légalité des logements construits par l'Institution d'Assurance Sociale pour son personnel. Des membres du conseil d'administration de l'Institution d'assurance nationale ont été reconnus coupables de faute professionnelle. Les accusations étaient plus graves, car elles concernaient des délits de mauvaise conduite dans l'exercice d'une fonction publique. Les accusations et la condamnation concernaient le financement du logement du personnel de l'institution. L'affaire a attiré l'attention du public lorsqu'à l'automne 1957, les députés Veikko Vennamo et Arne Öhman ont demandé au chancelier de la justice Olavi Honka d'enquêter sur la légalité des dispositions concernant les logements construits par l'Institution d'assurance sociale pour son personnel. Le conseil d'administration de Kela a aidé les projets en accordant des prêts à des conditions favorables et l'ensemble du conseil d'administration de Kela a été poursuivi pour mauvaise conduite et mauvaise administration. Le 28 juin 1961, la cour d'appel d'Helsinki a condamné tous les membres du conseil d'administration de l'institution d'assurance sociale à être démis de leurs fonctions.\n\nL'affaire de l'école de sages-femmes fut un scandale politique en Finlande au tournant des années 1950 et 1960. Les problèmes ont commencé lorsque le comité de construction de l'université, dirigé par le ministre des Finances Aarre Simonen, a choisi comme entrepreneur Rakennusliike Teora, déjà en faillite, en décembre 1956. Les difficultés de l'entreprise de construction étaient cachées derrière un plan de paiement des arriérés d'impôts et elle a été payée d'avance 200 millions de Markkas pour les travaux restant à faire, afin d'éviter que l'entreprise ne soit inscrite sur la liste de protestation. Au même moment, Teora construisait des appartements à Munkkivuori à un prix avantageux pour les membres du comité de construction du Midwifery College, dont le ministre des Finances Simonen. L'entreprise de construction Teora a également mis en gage les certificats d'actions de ces appartements en garantie de ses dettes et de la construction du Midwifery College. Cependant, lorsque Teora a finalement fait faillite, le ministre Simonen a réussi à faire en sorte que sa propre société immobilière soit libérée de ces garanties.\nLa faillite de l'entreprise de construction Teora a finalement coûté aux contribuables environ 300 millions de marks. Après la faillite de Teora, le nouveau bâtiment du Collège de sages-femmes fut achevé par l'entreprise de construction Puolimatka Oy et le bâtiment fut inauguré le 11 avril 1960. Le 5 avril 1961, la Cour d'appel commença à entendre l'affaire. Le procès reçut un nouvel élan lorsque Reino Kuuskoski, membre de la Cour d'appel et président de la Cour administrative suprême, fut suspendu de ses fonctions au cours de l'été 1961 pour l'affaire dite du logement de la Caisse de retraite populaire, alors que l'affaire du Midwifery College était en cours. Le 14 décembre 1961, la Cour d'appel a condamné Aarre Simonen et Vilho Väyrynen à des amendes respectives de 375 000 et 80 000 marks en vertu de la loi sur la responsabilité ministérielle."
 fin.43.t:0 "Le Parlement abroge les lois sur le blasphème"
 fin.43.d:0 "Aujourd'hui, le Parlement a voté l'abrogation du chapitre 17, article 10 du Code pénal finlandais, qui stipule :\n\nQui que ce soit \n1) blasphème publiquement Dieu ou, dans l'intention d'insulter, calomnie ou diffame publiquement ce qui est autrement considéré comme sacré par une église ou une communauté religieuse au sens de la loi sur la liberté de religion (267/1922), ou\n2) en faisant du bruit, en comportant un comportement menaçant ou en perturbant de toute autre manière un service religieux, un service religieux, un autre exercice religieux ou un service funéraire,\nsera condamné à une amende ou à une peine d'emprisonnement d'une durée n'excédant pas quatre ans pour atteinte à l'ordre public.\n\nSi les progressistes se réjouissent de cette étape majeure, les conservateurs n'en sont pas si satisfaits."
 fin.44.t:0 "Votes du Parlement sur la limitation de la peine de mort"
 fin.44.d:0 "Après l'amendement de 1949, la peine de mort ne pouvait plus être prononcée pour les crimes commis en temps de paix. Dans le même temps, une disposition a été ajoutée à la loi, selon laquelle une condamnation à mort prononcée en temps de guerre était automatiquement commuée en réclusion à perpétuité si elle n'avait pas été exécutée à la fin de l'état de guerre. Lorsque cet amendement à la loi a été débattu au Parlement, personne n'a demandé le maintien de la peine de mort en temps de paix.\nAujourd'hui, la peine de mort a été abolie, sauf pour la trahison contre l'État. La proposition du gouvernement faisait référence au fait que l'opinion publique avait changé et que la peine de mort ne devrait être appliquée qu'en cas de haute trahison contre l'État finlandais. Cependant, lorsque le projet de loi a été débattu au Parlement, certains membres du SMP et du parti de la Coalition se sont opposés à l'abolition complète de la peine de mort et ont réussi à la maintenir pour trahison."
 fin.45.t:0 "Votes du Parlement sur l'abolition de la peine de mort"
 fin.45.d:0 "Après l'amendement de 1949, la peine de mort ne pouvait plus être prononcée pour les crimes commis en temps de paix. Dans le même temps, une disposition a été ajoutée à la loi, selon laquelle une condamnation à mort prononcée en temps de guerre était automatiquement commuée en réclusion à perpétuité si elle n'avait pas été exécutée à la fin de l'état de guerre. Lorsque cet amendement à la loi a été débattu au Parlement, personne n'a demandé le maintien de la peine de mort en temps de paix.\nAujourd'hui, la peine de mort a été totalement abolie du système pénal. La proposition du gouvernement faisait référence au fait que l'opinion publique, au cours des plus de 20 années d'application de la loi interdisant la peine de mort en temps de paix, était devenue de plus en plus opposée au recours à la peine de mort, quelles que soient les circonstances. Cependant, lorsque le projet de loi a été débattu au Parlement, certains membres du SMP et du parti de la coalition se sont opposés à l'abolition complète de la peine de mort en temps de guerre, car elle existait toujours en Suède. Cependant, la contre-motion (de Veikko Vennamo) a été rejetée par 140 voix contre 29, avec 27 abstentions et trois votes vides. Dans le débat sur la question, le député de la Coalition, Eero Lattula, a invoqué non seulement l'exemple des pays voisins, mais aussi l'effet dissuasif de la peine de mort, qui, selon lui, amènerait ceux qui envisagent de commettre des actes de lâcheté et de désertion, par exemple, à réfléchir sérieusement aux conséquences de leurs actes. D'un autre côté, le collègue du parti de Lattula, Juha Vikatmaa, a affirmé que des mesures négatives telles que la peine de mort ne seraient pas en mesure de maintenir la capacité des forces de défense et la volonté des citoyens de défendre leur pays. La députée du SKDL, Anna-Liisa Jokinen, estime quant à elle que la Finlande pourrait bien montrer la voie en interdisant la peine de mort."
 fin.46.t:0 "Discours d'Ostrobotnie"
 fin.46.d:0 "Dans un discours prononcé lors des célébrations en Ostrobotnia à l'occasion du 50e anniversaire de l'indépendance de la Finlande, Kekkonen a déclaré qu'une tâche importante des années 1960 était d'intégrer les communistes dans une partie fonctionnelle de la société. Il a combiné sa grande idée de l'unité nationale avec la coexistence pacifique internationale. La lutte des idées fondée sur la force brute et la violence devait se transformer en une compétition économique et intellectuelle. \"Celui qui a confiance dans la viabilité et la vitalité de sa propre cause osera s'y engager.\"\n\nIl a déclaré en Ostrobotnie que la Finlande était aussi chère aux communistes qu'aux autres Finlandais. \"Le peuple finlandais serait faible si un citoyen sur quatre était un ennemi de la patrie.\" L'ouverture de Kekkonen à l'extrême gauche était un geste audacieux. Les révolutionnaires angoissants formés à Moscou n'avaient pris leur retraite du SKP qu'au début de 1966 et le plus dur des anciens, Ville Pessi, était toujours secrétaire du parti. Pour le monde extérieur, il était encore difficile de constater que le SKP avait commencé à évoluer dans le sens de l'eurocommunisme."
 fin.47.t:0 "Rébellion des jeunes contre l'interdiction des loisirs pendant les jours de prière"
 fin.47.d:0 "Un samedi de prière, une émeute a éclaté dans la municipalité rurale d'Helsinki alors que le très populaire groupe anglais The Renegades devait se produire à Tanhurinne à Korso. La police a interrompu le bal, pour lequel le gouvernement provincial n'avait pas donné l'autorisation. Les Renegades ont également été empêchés de se produire.\nCela a donné lieu à un incident au cours duquel les vitres de la salle de danse ont été brisées, les voitures de police ont été détruites et des pierres et des bouteilles ont été lancées sur les policiers. Finalement, l'émeute s'est propagée au centre de Korso. Les pompiers ont été appelés et ont tenté de calmer la situation à l'aide de canons à eau. Cependant, la colère des jeunes ne s'est pas calmée et les camions de pompiers ont été renversés. Les jeunes émeutiers ont finalement été maîtrisés à coups de gaz lacrymogènes. Vingt jeunes ont été arrêtés et, au journal télévisé, le chef de la police Edward Urja les a menacés de peines de prison. Il y a également eu des émeutes plus modestes dans quelques autres endroits.\nLe ministre de l'Intérieur, Niilo Ryhtä, a exhorté les parents à surveiller de plus près les déplacements de leurs enfants. Un groupe de travail créé au pied levé a proposé de restreindre les permis de travail des orchestres étrangers, ce qui semble \"mettre les esprits en haleine\". M. Ryhtä estime également que les jeunes disposent de trop de temps libre et redoute le passage prochain à la semaine de travail de cinq jours. Au lendemain des événements, le ministère de l'Intérieur a interdit aux pompiers de participer aux fonctions de police anti-émeute."
 fin.48.t:0 "Le président Paasio démissionne"
 fin.48.d:0 "Alors que les émeutes étudiantes continuent de s'intensifier, ils commencent désormais à exiger la démission du président Paasio. Le [GetDate], Rafael Paasio a démissionné de son poste de président de la Finlande et a annoncé qu'il remettait ses pouvoirs au Premier ministre Mauno Koivisto. Les manifestants sont pour l'instant satisfaits, mais nous devrons bientôt organiser de nouvelles élections, conformément à leurs revendications."
 fin.49.t:0 "Manifestations étudiantes massives"
 fin.49.d:0 "Peu après l'élection du président Paisio, une période de troubles civils a éclaté dans toute la Finlande, ponctuée de manifestations, de grèves générales ainsi que d'occupations d'universités et d'usines. Beaucoup craignent que l'économie finlandaise ne s'arrête. On craint que les manifestations ne provoquent une guerre civile ou une révolution. Les manifestations sont liées à des mouvements similaires qui se produisent dans le monde entier et inspirent déjà une génération d'art protestataire sous la forme de chansons, de graffitis imaginatifs, d'affiches et de slogans."
 fin.50.t:0 "Élections extraordinaires de [GetYear]"
 fin.50.d:0 "Des élections législatives extraordinaires ont lieu après que le Premier ministre Mauno Koivisto a décidé de dissoudre le gouvernement après son échec à résoudre les émeutes étudiantes. Après les élections, deux gouvernements sont possibles. Le premier serait dirigé par le socialiste Ele Alenius du SKDL. Il se décrit comme un socialiste pour qui la coopération avec la gauche est importante. Un deuxième gouvernement possible serait dirigé par le centriste Johannes Virolainen de Keskustapuolue. Il a soutenu la réforme de la gouvernance universitaire préconisée par l'aile étudiante radicale."
 fin.51.t:0 "SKP reprend la Finlande"
 fin.51.d:0 "En [GetMonth], [GetYear], le Parti communiste finlandais, avec le soutien soviétique, a assumé un contrôle incontesté sur le gouvernement finlandais. Incapable de contrôler la protestation, le gouvernement tomba dans des conflits internes et la plupart des ministres non communistes démissionnèrent. Il y avait un fort mouvement de partisans communistes, par exemple, organisant des conseils ouvriers dans les usines pour prendre le contrôle des usines. Le Premier ministre [FIN.GetLeader], craignant la guerre civile, a décidé de démissionner et de dissoudre le gouvernement. Peu de temps après, le SKP a annoncé la prise du pays et a invité les soldats soviétiques à sécuriser leur position. Le même jour, une nouvelle Constitution démocratique populaire a été adoptée et toutes les industries ont été nationalisées.\n\nCependant, une seule question demeure : qui deviendra notre premier secrétaire général ? Pour cette place, il y a deux choix : l'eurocommuniste Aarne Saarinen ou le leader de l'opposition traditionnelle Taisto Sinisalo.\n\nAarne Saarinen a combattu les conflits entre la majorité et la minorité du SKP. Saarinen essaie de maintenir son parti séparé du NKP soviétique et de promouvoir un communisme indépendant, national et pacifique. L'invasion de la Tchécoslovaquie par le Pacte de Varsovie a été condamnée par lui et la majorité du parti.\n\nTaisto Sinisalo est le chef de la faction pro-soviétique dure du parti (également connue sous le nom de taistolaiset d'après le prénom de Sinisalo) et vice-président du parti. Son idéologie est parfois qualifiée de stalinienne."
 fin.52.t:0 "Keskiolutlaki"
 fin.52.d:0 "La loi sur la bière moyenne (462/1968) a été promulguée le [GetDate]. La loi a été adoptée par le Parlement par 137 voix contre 33. Cette loi comprend des éléments tels que :\n-Permettre aux restaurants et aux bars de vendre plus librement davantage de types d'alcool\n-Droit de vendre de la bière de classe III (4,7 %) dans les épiceries\n-Élimination de la soi-disant \"Booze Card\" (Viinakortti) en deux ans\n-Renommer Oy Alkoholiliike Ab en Oy Alko Ab\n-Une meilleure connaissance des dangers de l'alcool.\nTandis que d'autres célèbrent ces changements, d'autres s'y opposent. L'opposition la plus farouche vient du mouvement de tempérance, qui affirme que « ces changements absurdes conduiront sûrement notre nation sur la voie d'un alcoolisme destructeur »."
 fin.53.t:0 "Conférence paneuropéenne sur la sécurité"
 fin.53.d:0 "En-cours"
 fin.54.t:0 "La Finlande abandonne le plan Nordek"
 fin.54.d:0 "Le plan Nordek était une tentative de créer un espace économique nordique commun. La lettre Find Finland - Löydä Suomi du président finlandais Urho Kekkonen, publiée en 1966, prévoyait les futurs développements nordiques, déclarant que la Suède, la Finlande et peut-être l'ensemble de la région nordique pourraient à terme se développer en un seul espace économique et culturel.\nL'initiative d'un espace économique nordique commun a été prise par le Premier ministre danois Hilmar Baunsgaard lors de la réunion du Conseil nordique à Copenhague au printemps 1968.\n\nEn juillet 1969, les négociations étaient parvenues à un accord sur la plupart des aspects du projet d'accord, notamment les mouvements de capitaux, la politique commerciale et maritime, la politique du travail et sociale, l'éducation, la recherche et l'aide au développement. Cependant, les domaines des produits industriels, de l'agriculture et de la pêche ainsi que le financement de la coopération restent en suspens.\nLa visite du président finlandais Urho Kekkonen à Zavidovo, en tant qu'invité des dirigeants soviétiques, fut significative pour le sort de Nordek. Au cours des discussions à Zavidovo, il est apparu clairement que l'Union soviétique était opposée à l'adhésion de la Finlande à Nordek. [SOV.GetLeader], secrétaire général du PCUS, a carrément décrit Nordek comme un « groupe antisoviétique » dont les activités pourraient nuire aux relations entre la Finlande et l'Union soviétique.\n\nLe dernier clou sur le cercueil fut posé lors de la réunion du Conseil nordique à Reykjavík au printemps 1970, lorsque la Finlande annonça qu'elle ne signerait pas l'accord de Nordek. Le Premier ministre Mauno Koivisto, qui avait été un ardent défenseur de Nordek, a ressenti l'échec du projet comme une déception personnelle. De même, le Premier ministre suédois [SWE.GetLeader] a regretté à plusieurs reprises l'effondrement de Nordek par la suite. En revanche, l'adhésion du Danemark à la CEE, intervenue au début de 1973, aurait signifié que Nordek aurait pu être dissoute dès sa naissance."
 fin.55.t:0 "[GetNewspaperHeader]Les manifestations dégénèrent en violence"
 fin.55.d:0 "Une tragédie a récemment frappé la Finlande, lorsque des manifestations étudiantes pacifiques ont été violemment réprimées par la police, ce qui a amené les manifestants à réagir de la même manière. Tout a commencé lorsqu'un grand groupe d'étudiants de l'Université d'Helsinki a occupé l'ancienne maison des étudiants. La maison était le lieu désigné des festivités pour la célébration du centenaire du syndicat étudiant, prévue le lendemain. L'action était une protestation contre ce qu'ils considéraient comme un « parti de la cravate blanche » du style des années 1950 et un soulèvement contre les valeurs qu'il représentait. L'action a été considérée comme inspirée par divers mouvements politiques à travers l'Europe au cours ou avant la même année.\nLes principales revendications des dissidents concernaient des réformes démocratiques de l'administration de l'université. Cependant, certains participants ont également exigé la création de cercles d'études marxistes-léninistes dans les départements et facultés, l'abolition de l'adhésion obligatoire à l'Union des étudiants et un changement de l'orientation politique du magazine étudiant mensuel Ylioppilaslehti. Des banderoles portant ces proclamations ont été accrochées au balcon de la Maison des étudiants et des discours ont été prononcés. Cependant, tous les jeunes impliqués n'étaient pas communistes ; des personnes alignées sur le Parti du Centre centriste-agraire y ont également participé.\n\nLe gouvernement craignait que s'il cédait à ses exigences, cela permettrait à l'URSS d'influencer ses étudiants et les générations futures et, à travers eux, son pays tout entier. Même s'il y avait des désaccords entre les membres du gouvernement et du Parlement, l'ordre de réprimer les protestations par tous les moyens nécessaires avait déjà été donné. Les policiers ont défilé en masse vers la Maison des étudiants et l'université et, même s'ils se sont heurtés à une certaine résistance, ils ont surpris les étudiants. Face à une telle réaction, de nombreux étudiants ont décidé de prendre position et ont commencé à se battre avec la police, utilisant tout ce qu'ils pouvaient trouver comme arme. On ne sait pas encore s'il y a eu des morts, mais plusieurs personnes et policiers ont été blessés à des degrés divers tandis que la popularité du gouvernement s'est effondrée et que les manifestations se sont transformées en véritables émeutes.\nIl reste à voir où cela mènera, mais des rumeurs et des commentaires non officiels provenant de sources gouvernementales anonymes disent que si une solution n'est pas trouvée rapidement, le président actuel Rafael Paasio pourrait être contraint de démissionner."
 fin.56.t:0 "Le Parlement adopte le projet de loi Bordel"
 fin.56.d:0 "Des nouvelles ont éclaté sur une question inhabituelle sur laquelle le gouvernement et le parlement finlandais ont dû prendre position : l'ouverture ou non d'un système de bordels d'État. Dans sa question écrite au gouvernement, Aili Laitinen, médecin et députée, a demandé : « Quelles mesures le gouvernement a-t-il l'intention de prendre pour empêcher la propagation des maladies sexuellement transmissibles et de la prostitution professionnelle et le gouvernement a-t-il l'intention de prendre des mesures pour créer un système de bordel d'État qui servirait à la fois les clients masculins et féminins dans des conditions sûres ou le gouvernement a-t-il l'intention de prendre des mesures urgentes pour fournir une éducation sexuelle factuelle et efficace et pour inculquer des attitudes saines dans tous les établissements d'enseignement et les médias d'État pour prévenir les dommages causés par les maladies vénériennes en liberté ? Maladies ? »\nOsmo Kaipainen, ministre des Affaires sociales et de la Santé, a tenté de répondre à la question de Laitinen et, à son avis, le système des bordels d'État aurait été une mauvaise solution, car il aurait créé de nouveaux problèmes au lieu de résoudre les anciens. Alors que les bordels ont été abolis en Finlande depuis le 19ème siècle, il aurait déclaré qu '\"il n'y avait aucune raison de retourner au siècle dernier pour résoudre les problèmes d'aujourd'hui\". Personnellement, Kaipainen a déclaré qu'il croyait à l'entrepreneuriat dirigé par l'État, mais qu'il ne pensait pas qu'une telle entreprise aurait été très proche du coeur du gouvernement. Au lieu de cela, Kaipainen a déclaré que le gouvernement préférait une éducation efficace au genre.\nAprès de nombreux débats houleux, le gouvernement et le parlement ont décidé d'adopter une motion sur la création de bordels d'État, qui seront soigneusement surveillés afin qu'aucune violation de la santé ou toute autre chose illégale ne se produise. Le camp qui soutient cette motion a fait valoir que les maisons closes fourniraient un lieu sûr aux clients et aux employés, tout en fournissant également à l'État les fonds dont il aurait besoin."
 fin.57.t:0 "Formation du cabinet Sorsa I"
 fin.57.d:0 "Par une journée ensoleillée à Helsinki, le président Rafael Paasio a nommé le nouveau gouvernement, dirigé par Kalevi Sorsa. Le cabinet Sorsa I est une coalition de quatre partis : les sociaux-démocrates, le parti du centre, le parti populaire suédois et les libéraux. Il dispose d'une majorité parlementaire de 125 sièges.\nLes ministres sont arrivés au palais en tenue officielle. Ils se saluèrent cordialement ainsi que le Président. Ils étaient prêts à mettre en oeuvre leur programme, axé sur les réformes sociales, les investissements industriels et l'amélioration des relations avec les « alliés stratégiques ».\n\nLa cérémonie a débuté à midi par le discours du président Paasio. Il a félicité le nouveau gouvernement pour sa large représentation et son engagement en faveur de la démocratie et de la justice sociale. Il a également remercié le gouvernement sortant de Teuvo Aura pour son service et sa coopération.\nIl a ensuite investi les ministres, à commencer par le Premier ministre Sorsa. Il a serré la main de chaque ministre et leur a remis un portefeuille contenant leurs documents officiels.\nLa cérémonie s'est terminée par une photo de groupe du Président et du cabinet. Ils ont souri et salué la foule en contrebas, qui a applaudi leurs nouveaux dirigeants.\nLe cabinet Sorsa I était officiellement en fonction. Il sera confronté à de nombreux défis et opportunités au cours de son mandat, mais il se montre confiant et optimiste."
 
 fin.60.t:0 "Nokia Data lance le MikroMikko 1"
 fin.60.d:0 "En septembre 1981, Nokia Data a dévoilé l'ordinateur de bureau MikroMikko 1, développé pour défier les géants internationaux de l'informatique sur le marché finlandais des ordinateurs de bureau et d'affaires. Conçu et fabriqué localement dans l'usine Kilo d'Espoo, le MikroMikko a rapidement fait de la Finlande un producteur sérieux de micro-ordinateurs modernes, largement adopté par les administrations municipales, les banques et les établissements universitaires."
 fin.60.a:0 "Un triomphe pour la microélectronique domestique."

 fin.61.t:0 "Le Commodore 64 et le « Tasavallan Tietokone »"
 fin.61.d:0 "À la fin des années 1983 et en 1984, le micro-ordinateur Commodore 64 a balayé la Finlande avec une intensité culturelle sans précédent, ce qui lui a valu le surnom affectueux de « Tasavallan tietokone » (l'ordinateur de la république). Alors que la Finlande atteint l'un des taux de possession de micro-ordinateurs par habitant les plus élevés au monde et le lancement explosif de périodiques spécialisés tels que MikroBitti, toute une génération de jeunes Finlandais est devenue captivée par la programmation d'assemblage, la synthèse sonore sur la puce SID et la créativité numérique."
 fin.61.a:0 "Une génération de pionniers du numérique est née."

 fin.62.t:0 "Réseaux BBS et premières racines de la démo"
 fin.62.d:0 "Dans les villes et banlieues finlandaises, les passionnés de chambre à coucher ont commencé à connecter des modems téléphoniques aux systèmes de bulletins d'information (purkit), échangeant des messages, des utilitaires logiciels et des magazines numériques. De cette sous-culture naissante ont émergé les premiers groupes de démonstration finlandais, tels que Byterapers, formé en 1986, qui ont poussé les contraintes matérielles pour créer des graphiques en temps réel, de la musique algorithmique et des intros à texte défilant sans motif commercial. Les racines fondamentales de la dynamique scène artistique numérique finlandaise et de la future industrie du développement de jeux vidéo sont fermement ancrées."
 fin.62.a:0 "La créativité des hackers s'épanouit dans l'underground."

 fin.63.t:0 "Mobira Cityman 900 et le « téléphone Gorba »"
 fin.63.d:0 "En 1987, Nokia-Mobira a présenté le Mobira Cityman 900, l'un des premiers téléphones portables au monde fonctionnant sur le réseau nordique NMT-900. Pesant moins de 800 grammes, cet appareil portable révolutionnaire est devenu un symbole international des télécommunications modernes, immortalisé à l'échelle mondiale lorsque le secrétaire général soviétique Mikhaïl Gorbatchev l'a utilisé lors d'une visite officielle à Helsinki pour appeler Moscou. Cette avancée positionne fermement la Finlande à l'avant-garde des communications sans fil."
 fin.63.a:0 "Connecter les gens au-delà des frontières."

 fin.64.t:0 "FUNET se connecte à l'Internet mondial"
 fin.64.d:0 "En novembre 1988, le Réseau universitaire et de recherche finlandais (FUNET) a établi une liaison satellite dédiée à 56 kbit/s via Stockholm vers le Centre de supercalculateurs John von Neumann de l'Université de Princeton, fournissant ainsi à la Finlande sa première connexion TCP/IP directe à l'Internet mondial. Les chercheurs universitaires finlandais, les laboratoires informatiques et les étudiants passionnés en réseau sont désormais directement reliés aux réseaux de communication mondiaux."
 fin.64.a:0 "La passerelle vers le réseau mondial est ouverte."

 fin.65.t:0 "Signature de l'Acte final de la CSCE d'Helsinki"
 fin.65.d:0 "Le 1er août 1975, les chefs d'État de 35 pays d'Europe et d'Amérique du Nord se sont réunis au Finlandia Hall pour signer l'Acte final d'Helsinki de la Conférence sur la sécurité et la coopération en Europe (CSCE). En obtenant la reconnaissance internationale des frontières européennes d'après-guerre, parallèlement à des engagements historiques en faveur des droits de l'homme et à des mesures de confiance, la Finlande a consolidé son rôle de bâtisseur de ponts neutre et indispensable entre l'Est et l'Ouest."
 fin.65.a:0 "L'« Esprit d'Helsinki » guide la diplomatie mondiale."

 fin.66.t:0 "Rejeter les exercices militaires du maréchal Ustinov"
 fin.66.d:0 "En juillet 1978, le ministre soviétique de la Défense, Dmitri Ustinov, s'est rendu à Helsinki et a officiellement proposé des exercices militaires conjoints en temps de paix entre les forces de défense finlandaises et l'Armée rouge, conformément aux termes du traité FCMA de 1948. Le président Urho Kekkonen et les commandants militaires finlandais ont rejeté cette ouverture de manière décisive, indiquant clairement que la Finlande défend ses propres frontières de manière indépendante et que des manoeuvres conjointes saperaient fatalement la neutralité finlandaise."
 fin.66.a:0 "La Finlande défend seule son territoire."

 fin.67.t:0 "L'élection présidentielle de 1988"
 fin.67.d:0 "En janvier et février 1988, la Finlande a organisé son élection présidentielle selon un processus électoral hybride réformé combinant un vote populaire direct et un collège électoral. Le président sortant Mauno Koivisto a obtenu un mandat écrasant de l'électorat finlandais, battant le candidat du Parti du centre Paavo Väyrynen et le candidat de la Coalition nationale Harri Holkeri pour remporter un second mandat, réaffirmant un large consensus en faveur du maintien de l'équilibre parlementaire et d'une démocratisation modérée."
 fin.67.a:0 "Koivisto reçoit un deuxième mandat décisif."

 fin.68.t:0 "Le réacteur nucléaire Loviisa 1 entre en service"
 fin.68.d:0 "En février 1977, la tranche 1 de la centrale nucléaire de Loviisa a été synchronisée avec le réseau électrique finlandais. Surnommé « Eastinghouse » en raison de son architecture hybride sophistiquée - combinant un réacteur à eau sous pression soviétique VVER-440 avec des instruments de sécurité occidentaux de Westinghouse et un blindage de confinement allemand - Loviisa représente une prouesse technique unique qui fournit une énergie de base fiable et bon marché à l'industrie finlandaise."
 fin.68.a:0 "Une étape majeure dans la sécurité énergétique nationale."

 fin.69.t:0 "Le Parlement adopte la loi d'exception"
 fin.69.d:0 "En janvier 1973, à la suite d'intenses délibérations multipartites, le Parlement finlandais a adopté une loi constitutionnelle exceptionnelle (poikkeuslaki) prolongeant de quatre ans le mandat du président Urho Kekkonen sans tenir d'élections populaires. Soutenue par une large majorité des cinq sixièmes qui jugent la diplomatie personnelle de Kekkonen essentielle pour ratifier simultanément les traités commerciaux avec la CEE et le Comecon, la mesure controversée souligne l'influence dominante du président sur la politique finlandaise."
 fin.69.a:0 "Le consensus national prévaut sur la procédure régulière."


 nfc.1.t:0 "Le cabinet Fagerholm III prend le pouvoir"
 nfc.1.d:0 "En Finlande, le troisième cabinet de Fagerholm a été formé après les élections parlementaires de 1958. Le vainqueur des élections était la Ligue démocratique du peuple finlandais, mais il n'a pas été porté au gouvernement, de sorte que le plus grand parti du cabinet était le Parti social-démocrate dirigé par Karl-August Fagerholm. Nous sommes particulièrement préoccupés par le fait que l'aile droite des sociaux-démocrates, Väinö Leskinen et Olavi Lindblom, sont au gouvernement, avec le soutien du criminel de guerre Väinö Tanner. Par ailleurs, le nom du ministre de l'Agriculture Niilo Kosola est fortement associé à son père, Vihtori Kosola, leader du mouvement Lapua dans les années 1930. Devons-nous exprimer nos inquiétudes ou les garder pour nous ?"
 nfc.2.t:0 "Protestation soviétique contre le cabinet Fagerholm III"
 nfc.2.d:0 "Les Soviétiques ont exprimé leurs inquiétudes concernant notre nouveau gouvernement. Ils sont particulièrement préoccupés par Väinö Leskinen et Olavi Lindblom, qui représentent la droite du SDP. Même pendant la formation du gouvernement, Johannes Virolainen de l'Union agraire, qui était un participant clé dans les négociations gouvernementales et est devenu le ministre des Affaires étrangères du nouveau gouvernement, a tenté de faire appel à Väinö Tanner à la dernière minute pour que Leskinen ne soit pas inclus dans le gouvernement, ce à quoi Tanner a murmuré : « De quoi tu parles, jeune homme, le gouvernement de Finlande est en train de se former, pas le gouvernement de l'Union soviétique. Le président Urho Kekkonen avait déjà averti Virolainen de ne pas rejoindre le même gouvernement que Leskinen. Après avoir nommé le gouvernement le 29 août, Kekkonen a prononcé ses célèbres paroles : \"C'est le pire discours que j'ai jamais lu, mais ce n'est pas moi qui l'ai écrit\"."
 nfc.3.t:0 "Augmenter la pression finlandaise ?"
 nfc.3.d:0 "Malgré nos inquiétudes, le cabinet Fagerholm III est toujours au pouvoir. Devrions-nous faire pression sur eux davantage pour garantir que le gouvernement démissionne et qu'un gouvernement plus favorable arrive au pouvoir à la place ?"
 nfc.4.t:0 "La pression soviétique s'intensifie"
 nfc.4.d:0 "La pression soviétique sur notre cabinet actuel ne cesse de s'intensifier. Sur le plan économique, les négociations sur l'utilisation du canal de Saimaa ont été suspendues, le traité sur les droits de pêche dans le golfe de Finlande a été reporté et les négociations commerciales ont été bloquées. Dans (EXPURGÉ), l'ambassadeur soviétique en Finlande, Viktor Lebedev, est parti « en vacances », sans rendre visite au ministre des Affaires étrangères Johannes Virolainen, comme l'exigeait le protocole, et il a ensuite été annoncé qu'il avait été muté à d'autres fonctions sans projet de nommer un successeur."
 nfc.5.t:0 "La Finlande cède !"
 nfc.5.d:0 "Après avoir fait pression sur le gouvernement finlandais pendant plusieurs mois, il semble qu'ils aient finalement cédé. Des rapports indiquent qu'ils ont déjà pris des mesures pour limoger le cabinet Fagerholm et le remplacer par un cabinet beaucoup plus agréable."
 nfc.7.t:0 "Fin du cabinet Fagerholm III"
 nfc.7.d:0 "Il y a quelques mois, la Ligue agraire a forcé ses ministres à démissionner du gouvernement et le président Urho Kekkonen a commencé à manoeuvrer pour faire tomber le gouvernement. Finalement, le §R(SUPPRIMÉ)§! Virolainen a annoncé sa démission et ensuite Fagerholm a annoncé la démission de l'ensemble du gouvernement. Peu de temps après, Kekkonen est allé à la radio et à la télévision d'État pour annoncer la formation d'un gouvernement minoritaire agraire dirigé par V. J. Sukselainen."
 nfc.8.t:0 "Crise de gel de fin de nuit"
 nfc.8.d:0 "La crise du gel nocturne a été résolue lors d'un voyage privé qu'Urho et Sylvi Kekkonen ont effectué à Leningrad, où il a rencontré \"accidentellement\" [SOV.GetLeader] et le ministre des Affaires étrangères Andrei Gromyko. Au cours du déjeuner qui a suivi les négociations, [SOV.GetLeader] a déclaré que si la Finlande avait le droit de décider de ses gouvernements, l'Union soviétique avait également le droit de décider de ce qu'elle pensait d'eux. Le président Kekkonen a estimé que la crise du gel nocturne était due aux conflits internes au sein du parti social-démocrate. Peu de temps après, les relations diplomatiques entre les pays ont été rétablies lorsque l'Union soviétique a nommé Alexeï Zakharov comme nouvel ambassadeur en Finlande."
 nfc.10.t:0 "Une note soviétique"
 nfc.10.d:0 "En-cours"
 nfc.11.t:0 "Kekkonen gère la crise"
 nfc.11.d:0 "En-cours"
 nfc.12.t:0 "Dissoudre le Parlement"
