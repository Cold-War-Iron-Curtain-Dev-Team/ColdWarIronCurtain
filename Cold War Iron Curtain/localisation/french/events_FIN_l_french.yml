 fin.200.d:0 "Il est temps de tenir nos 2èmes élections présidentielles depuis la fin de la guerre. Une fois les électeurs présidentiels sélectionnés, deux candidats ont des chances de gagner. Le principal candidat est le président sortant J.K. Paasikivi, soutenu par la droite et les sociaux-démocrates. Le deuxième candidat est Mauno Pekkala, socialiste du parti SKDL.\nPaasikivi s'est d'abord montré réticent à se faire réélire, du moins lors d'élections présidentielles régulières. Il a envisagé de demander au Parlement finlandais de le réélire au moyen d'une autre loi d'urgence. L'ancien président Ståhlberg, qui lui servait de conseiller informel, l'a persuadé de se faire réélire par les moyens normaux lorsqu'il a déclaré sans ambages à Paasikivi : « Si le peuple finlandais ne prenait pas la peine d'élire un président tous les six ans, il ne mériterait vraiment pas une république indépendante et démocratique. » Parallèlement à cela, en raison de la faiblesse de l'économie, le soutien à la gauche a augmenté dans tout le pays. Même si les chances sont faibles pour un président socialiste, peut-être que la combinaison de ces événements pourrait conduire à la perte de Paasikivi ?"
