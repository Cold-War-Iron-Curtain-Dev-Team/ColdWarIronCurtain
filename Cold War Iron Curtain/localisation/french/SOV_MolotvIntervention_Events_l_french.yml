#---Poland---

 sov_molotov_easternbloc_poland.t:0 "La situation en Pologne."
 sov_molotov_easternbloc_poland_d_gomulka:0 "Molotov regarda les papiers que Shelepin lui avait apportés, examinant attentivement les derniers rapports en provenance de Varsovie. La situation en Pologne est devenue de plus en plus préoccupante. La « voie polonaise vers le socialisme » de Gomulka, son encouragement à la décentralisation économique, ses concessions à l'agriculture privée et sa volonté d'introduire des réformes orientées vers le marché étaient autant de signes troublants. Plutôt que de renforcer la planification socialiste, Gomulka semblait déterminé à saper le socialisme de la même manière que Khrouchtchev l'avait fait il y a toutes ces années, mais d'une manière encore plus radicale. Molotov avait déjà été témoin de ce genre d'opportunisme et il savait très bien où cela pouvait mener. N'est-ce pas précisément ainsi que les révisionnistes yougoslaves avaient commencé à quitter le camp socialiste ? Il posa les papiers et soupira. Avec le départ de Khrouchtchev, il n'y avait aucune raison de continuer à tolérer de telles tendances. Le prolétariat polonais ne pouvait pas être laissé entre les mains d'une telle « direction »."
 sov_molotov_easternbloc_poland_d_zawadzki:0 "Molotov a examiné les documents que Shelepin lui avait apportés, cette fois concernant le bilan politique d'Aleksander Zawadzki et les récents développements au sein du Parti ouvrier unifié polonais. Le succès de la faction Natolin avait certainement été encourageant. Malgré la pression considérable exercée par Khrouchtchev et ses partisans, la faction avait réussi à préserver sa position politique et finalement à déjouer Gomulka et ses associés. Molotov était particulièrement satisfait de la conduite de Zawadzki tout au long de ces événements. Communiste vétéran qui avait été emprisonné et restait attaché à la cause socialiste, il était précisément le genre d'homme dont la Pologne avait besoin. Molotov a brièvement jeté un coup d'oeil à une photographie d'accompagnement de Zawadzki aux côtés du regretté camarade Bierut. Peut-être que l'héritage de ce dernier était finalement entre de bonnes mains."
 sov_molotov_easternbloc_poland.a:0 "\"Gomulka est pire que les Khrouchtcheviens, il n'y a qu'une seule façon de gérer cela.\""
 sov_molotov_easternbloc_poland.b:0 "\"Zawadzki est un véritable communiste et un digne successeur de Bierut, j'ai confiance en son leadership.\""
 sov_molotov_easternbloc_poland_zawadzki.t:0 "Un message du secrétaire général Molotov"
 sov_molotov_easternbloc_poland_zawadzki.d:0 "Zawadzki examinait les derniers rapports en provenance de Varsovie lorsqu'un message de Molotov arriva, demandant un contact direct avec lui. L'initiative de Moscou l'a surpris, mais il en a vite compris l'importance. Après avoir vaincu l'opportuniste Gomulka, sa direction était sur la pointe des pieds depuis un an, prenant soin de ne pas provoquer Khrouchtchev avec son engagement en faveur d'un socialisme pur et dur, et même s'il voulait faire ce que l'Albanie avait fait, il savait très bien que cela conduirait à une intervention soviétique. Même lorsque les partisans de la ligne dure avaient renversé Khrouchtchev, il s'était retenu, craignant que si les khrouchtchéviens revenaient et voyaient que son gouvernement avait soutenu leurs rivaux, ils le feraient sûrement payer. Maintenant que les vrais marxistes-léninistes ont assuré leur pouvoir et que Molotov a personnellement tendu la main, Zawadzki a vu une opportunité de garantir la voie socialiste de la Pologne et de restaurer des relations étroites avec l'Union soviétique."
 sov_molotov_easternbloc_poland_zawadzki.a:0 "La vision de Bierut perdure"
 sov_molotov_easternbloc_poland_GomulKKKa.t:0 "Invasion soviétique"
 sov_molotov_easternbloc_poland_GomulKKKa.d:0 "Molotov n'aime pas notre révisionnisme, et comme nous avons dit que nous résisterions si l'URSS tentait de faire ce qu'elle a fait en Hongrie, il a décidé de lancer une invasion à grande échelle."
 sov_molotov_easternbloc_poland_GomulKKKa.a:0 "rip bozo mort réformiste totale"
 SOV_intervention_molonews.1.t:0 "[GetNewspaperHeader]Intervention soviétique en Pologne"
 SOV_intervention_molonews.1.desc:0 "Des rapports provenant de toute l'Europe de l'Est confirment que les forces soviétiques ont franchi la frontière polonaise, marquant une escalade dramatique de la crise au sein de la République populaire polonaise. Le secrétaire général Viatcheslav Molotov a dénoncé la direction polonaise de Gomulka comme étant révisionniste et « hostile aux intérêts de la classe ouvrière ». Il est choquant de constater que Wladyslaw Gomulka a déclaré que contrairement à la Hongrie de 1956, il ne reculerait pas et que les forces polonaises avaient reçu l'ordre de résister aux Soviétiques. Malgré cela, il est peu probable que les forces armées polonaises soient en mesure de défier Moscou."
 SOV_intervention_molonews.1.a:0 "L'ours soviétique rugit..."
