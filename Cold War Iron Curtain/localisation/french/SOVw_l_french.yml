#Events - Europe 

#Events - Country Events
SOVw_Third_World_War.1.d: "Aujourd'hui, des millions de personnes ont été appelées à défendre l'Union soviétique, se présentant comme l'avant-garde des peuples opprimés et prenant les armes contre l'ordre impérialiste en décomposition. Dans un discours historique devant le Soviet suprême ce matin, le camarade [SOV.GetLeader] a déclaré que le moment était venu de libérer les masses laborieuses des chaînes de l'exploitation occidentale, marquant ainsi le début officiel de ce qui sera connu sous le nom de Grande Guerre de Libération.\n\nÀ l'aube, les forces soviétiques ont lancé des opérations défensives préventives contre la militarisation croissante de l'OTAN à nos frontières. Pendant des années, les puissances capitalistes ont encerclé la patrie soviétique, rassemblant des troupes et des armes dans une tentative agressive d'étrangler le socialisme. Les ouvriers et les paysans d'URSS, unis comme un seul homme, ont refusé de céder devant les menaces de l'Occident. Aujourd'hui, sous la bannière de Lénine et des idéaux immortels du marxisme-léninisme, le peuple soviétique a pris les mesures nécessaires pour assurer la paix par la force."
SOVw_Third_World_War.2.d: "Alors que la Grande Guerre de Libération se déroule, les travailleurs soviétiques se révèlent une fois de plus comme la base inébranlable sur laquelle la victoire sera construite. Des forges sidérurgiques de Magnitogorsk aux usines textiles d'Ivanovo, les usines et les fermes collectives de l'Union brûlent d'un travail infatigable, animé par la volonté inébranlable du peuple.\n\nSous la direction du Parti, la production industrielle a atteint des niveaux historiques. Dans les grandes usines de tracteurs de Chelyabinsk, les ouvriers travaillent 24 heures sur 24, transformant les machines de paix en moteurs de libération. À Leningrad et Kharkov, le prolétariat répond à l'appel du devoir en assemblant des chars, des avions et des fusils avec une précision inégalée. Pas une seule seconde n'est perdue : chaque boulon serré, chaque grain récolté, chaque chemin de fer posé est un coup de massue contre les forces de l'impérialisme.\n\nL'esprit de Stakhanov perdure dans chaque usine et chaque kolkhoze. Les mineurs du Donbass ont dépassé leurs quotas, extrayant le charbon et le fer nécessaires à notre glorieuse lutte. Les femmes de l'Union soviétique, aux côtés de leurs camarades, prennent la place qui leur revient dans le monde du travail, garantissant que la production ne faiblit jamais. Dans les gares ferroviaires de Sibérie, l'élément vital de la guerre - ravitaillements, nourriture et armes - afflue sans cesse vers le front, permettant à notre courageuse armée soviétique d'être approvisionnée et imparable."
SOVw_Third_World_War.3.d: "La Terre tremble alors que commence la bataille décisive pour la patrie soviétique. Les armées impérialistes, poussées par le désespoir, se heurtent à l'esprit indomptable du socialisme. Depuis l'ouest, l'OTAN a franchi la frontière de notre Union soviétique.\n\nMais le peuple soviétique ne se laissera pas soumettre. Ils ont déjà enduré des épreuves et restent ininterrompus. L'Armée rouge, avec ses banderoles flottantes de manière provocante, est prête à défendre Moscou, en canalisant le courage de ceux qui ont affronté Napoléon et Hitler.\n\nDans les usines de l'Oural, les ouvriers avancent sans relâche, fabriquant des armes pour l'affrontement ultime. Partout à Léningrad et à Kiev, les citoyens se soulèvent résolument, fortifiant leurs maisons et barricadant leurs rues. Des vastes champs de la Volga aux étendues gelées de la Sibérie, le peuple soviétique s'unit, armé de fusils, de marteaux et de faux, prêt à défendre la patrie socialiste."
SOVw_Third_World_War.4.d: "Depuis la grande salle du Kremlin, le secrétaire général [SOV.GetLeader] se tenait devant l'assemblée rassemblée, d'une voix ferme et résolue. La guerre était entrée dans une phase décisive et, tandis que les forces soviétiques avançaient sur des champs de bataille lointains, un autre front exigeait la même vigilance : les usines, les mines et les champs qui soutenaient l'effort de guerre.\n\nIl ne parlait pas de sacrifice, mais de devoir, du lien indissoluble entre l'ouvrier et le soldat, entre les machines qui sortaient des chaînes de production et les hommes qui les utilisaient au combat. Chaque fusil assemblé, chaque char forgé et chaque avion construit constituaient un pas de plus vers la victoire. Le travail du peuple n'était pas moins vital que la force de l'armée soviétique, car sans elle, la guerre ne pourrait être gagnée.\n\nLe message était clair : le triomphe de l'Union soviétique ne serait pas décidé par les seuls soldats mais par les mains inébranlables de ceux qui travaillaient derrière les lignes. Les usines ne se reposeraient pas, les champs donneraient leurs récoltes et la nation avancerait vers un avenir libéré de l'oppression de l'Occident. L'esprit des générations passées, de ceux qui ont enduré la Grande Guerre patriotique, perdure dans le coeur de ceux qui portent désormais le fardeau de l'histoire.\n\nA la fin du discours, l'assemblée s'est levée sous un tonnerre d'applaudissements. Les gens ont compris : c'était aussi leur guerre."
 SOVw_Third_World_War.5.d: "La guerre avec les puissances occidentales fait peser un immense fardeau sur l'Union soviétique. Nos diplomates proposent de demander à Pékin de se coordonner avec Moscou contre nos ennemis communs. Le soutien chinois pourrait renforcer notre position en Asie, mais la décision finale appartient aux dirigeants chinois."
SOVw_Third_World_War.6.d: "Alors que je suis assis près de la faible lumière d'une lanterne, le tonnerre lointain de l'artillerie me rappelle à quel point je suis loin de chez moi, mais mon coeur reste avec toi. La guerre continue, et même si les jours sont longs et les nuits encore plus longues, penser à toi me donne de la force.\n\nLes hommes ici ne se battent pas seulement pour notre patrie mais pour l'avenir - pour vous, nos enfants et la vie que nous construirons une fois cette situation terminée. Je pense souvent à notre petit appartement, aux matins où je me réveillais au parfum de ton thé, à la chaleur de tes mains dans les miennes. Ce sont ces souvenirs qui me maintiennent en vie lorsque le vent froid traverse mon uniforme et que l'épuisement pèse lourd sur mes épaules.\n\nNous avons avancé et, même si l'ennemi résiste, nous restons invaincus. L'Occident pensait pouvoir nous écraser, mais il ne connaît pas le coeur d'un soldat soviétique. Nous combattons avec l'esprit de ceux qui nous ont précédés, de ceux qui ont marché vers Berlin et ont brandi le drapeau rouge en signe de victoire. Je te le jure, mon amour, je te reverrai quand cette bannière flottera à nouveau haut.\n\nPrends soin de toi, ma chérie. Dites à notre fils que son père se bat pour qu'il puisse vivre dans un monde sans guerre. Gardez pour moi une bougie allumée à la fenêtre, je suivrai sa lumière jusqu'à chez moi.\n\nAvec tout mon amour,"
 SOVw_Third_World_War.7.d: "Moscou a demandé à la Chine de soutenir l'effort de guerre soviétique contre les puissances occidentales. La coopération pourrait renforcer les deux États face à la pression américaine, mais elle exposerait la Chine à un conflit plus large alors que notre propre reconstruction reste inachevée. Les dirigeants doivent décider s'ils doivent préparer une intervention ou préserver notre liberté d'action."
 SOVw_Third_World_War.8.t: "Une revue de la guerre"
 SOVw_Third_World_War.9.t: "La campagne européenne"
SOVw_Third_World_War.10.t: "La proposition de l'Éminence Rouge"
SOVw_Third_World_War.10.d: "Alors que la Troisième Guerre mondiale continue de se dérouler, l'Armée rouge a montré qu'elle avait conservé sa force après notre juste victoire sur le Troisième Reich. Nous faisons désormais avancer la révolution plus à l'ouest que jamais auparavant. Cependant, à mesure que nous libérons davantage de peuples sur le continent, nous sommes confrontés à certains défis administratifs. Contrairement à l'Allemagne, où nous pourrions transférer le contrôle à nos camarades de Berlin-Est, nous ne sommes pas en mesure de faire la même chose pour des régions comme les Lowlands. Actuellement, nous avons des gouvernements socialistes distincts qui mettent en oeuvre la révolution ouvrière aux Pays-Bas, en Belgique et au Luxembourg. Tous les membres de notre parti ne sont pas satisfaits de cette division. Le camarade Souslov, en particulier, a proposé l'idée de créer un État socialiste unifié au Benelux.\n\nBien entendu, cette proposition s'accompagne de son propre ensemble de considérations. Notre Union est forte et unie, ce qui n'est pas le cas du Benelux. Unir ces diverses cultures sous une même bannière alors que la guerre est toujours en cours présente des risques et entraînera probablement des troubles derrière les lignes de front. D'un autre côté, les capitalistes résistent déjà à la libération socialiste, de sorte qu'un État unifié ne risque pas d'introduire de nouveaux problèmes au-delà de ceux auxquels nous sommes déjà confrontés.\n\nDe plus, cette décision réduirait considérablement nos charges administratives, nous permettant de construire et de façonner un seul pays plutôt que trois entités distinctes. Si nous allons de l'avant avec la proposition du camarade Souslov, les dirigeants locaux risquent d'être indignés, mais la facilité administrative acquise signifie que nous pouvons nous concentrer plus efficacement sur la guerre mondiale en cours."
SOVw_Third_World_War.10.a: "Peut-être qu'il a raison."
SOVw_Third_World_War.11.t: "Les communistes aux Pays-Bas, au Luxembourg et en Belgique étaient en désaccord avec la proposition de Suslov !"
SOVw_Third_World_War.11.d: "Comme on pouvait s'y attendre, les dirigeants des pays du Benelux sont furieux de notre décision de créer un État unique et unifié dans la région. Les dirigeants communistes des trois pays ont ouvertement protesté contre cette décision, nombre d'entre eux refusant de reconnaître le nouvel État et son gouvernement. Même si leur détermination est remarquable, l'absence de leadership communiste établi dans ce nouvel État du Benelux nous manquera cruellement, ce qui rendra la construction de la nation beaucoup plus difficile.\n\nCette résistance à la révolution n'a fait que mettre en évidence l'hypocrisie des communistes occidentaux, car la révolution ne connaît pas de frontières et ne voit aucune distinction culturelle au sein du prolétariat. Alors que ces carriéristes idéologiques protestent contre l'unification, ils n'ont fait que démontrer encore davantage pourquoi le leadership de Moscou dans la révolution mondiale est essentiel. Nous sommes donc à la croisée des chemins. Que devons-nous faire ?"
SOVw_Third_World_War.11.a: "Allons-y avec le plan Suslov."
SOVw_Third_World_War.11.b: "Il vaut peut-être mieux suivre leurs conseils..."
SOVw_Third_World_War.12.t: "La Yougoslavie accepte d'adhérer"
SOVw_Third_World_War.12.d: "Nos camarades de Belgrade, autrefois en disgrâce, ont enfin retrouvé la raison et sont officiellement entrés en guerre sous notre bannière rouge commune de la liberté ! Même s'il reste encore beaucoup à faire pour combler le fossé entre nos deux nations, nous pouvons au moins constater de manière fiable que le « camarade » Tito peut encore voir la raison et est un allié de la révolution ouvrière. L'ouverture d'une nouvelle ligne de front avec l'OTAN en Italie nous donne également un avantage indispensable contre les impérialistes américains, et permettre à nos nouveaux alliés yougoslaves de conserver Trieste devrait suffire à les contenter pour le moment..."
SOVw_Third_World_War.12.a: "Merveilleux!"
SOVw_Third_World_War.13.t: "La Yougoslavie a refusé d'adhérer"
SOVw_Third_World_War.13.d: "Malheureusement, le socialisme balkanique est bien plus compromis que prévu initialement, dans la mesure où la Yougoslavie a refusé de rejoindre la guerre et a défié une dernière fois la Révolution ouvrière. Même si nos divergences sont significatives, nous avions espéré que Belgrade pourrait retrouver la raison et reconnaître que cela pourrait être notre seule opportunité de mettre fin une fois pour toutes à la tyrannie capitaliste, ou du moins de se laisser convaincre par l'idée de regagner les territoires perdus. Cependant, il est clair que ce n'est pas le cas, et l'influence de l'Amérique sur nos anciens alliés est plus forte que nous ne le pensions.\n\nIl y a des membres au sein de notre parti et même dans l'armée soviétique qui ne souhaitent pas gaspiller leurs ressources et leurs effectifs en élargissant le front contre une nation neutre. Mais le risque est trop grand. Si la Yougoslavie est prête à s'isoler de Moscou en faveur de Washington, alors la possibilité que les Américains utilisent la Yougoslavie pour lancer une invasion contre nos lignes arrières vulnérables ne peut être ignorée. Alors que nous avions espéré une réponse plus réceptive de la part de la Yougoslavie, nous n'avons désormais d'autre choix que de sécuriser nos flancs."
SOVw_Third_World_War.13.a: "On dirait que nous devons le faire à la dure..."
SOVw_Third_World_War.14.t: "La demande soviétique"
SOVw_Third_World_War.14.d: "L'animosité croissante entre Belgrade et Moscou ces dernières années est indéniable. Nos relations cordiales avec les États-Unis et notre neutralité mises à part, l'insistance de Moscou à nous plier à la ligne de son parti, suivie par ses nombreuses tentatives d'assassinat contre le camarade Tito, a rendu nos relations pour le moins glaciales. Cependant, au fond, nous sommes tous deux des États communistes et nourrissons les mêmes rêves à long terme de révolution mondiale, comme Marx l'avait sagement prédit. Nous avons maintenant peut-être la seule opportunité que nous aurons jamais d'atteindre cet objectif. Alors que le monde sombre tragiquement dans une nouvelle guerre mondiale, les responsables soviétiques ont exigé que nous rejoignions la guerre à leurs côtés, que nous mettions de côté nos divergences et que nous nous unissions sous l'objectif commun de la Révolution mondiale. Même si nous acceptons cet ultimatum flagrant au pied de la lettre, notre relation avec Moscou ne s'améliorera pas du jour au lendemain et, d'un point de vue strictement pragmatique, mettre fin aux liens avec le monde occidental et rejoindre une nouvelle guerre mondiale si rapidement après la fin de la dernière détruirait non seulement notre économie encore en train de se rétablir, mais ne serait pas bien reçu par notre peuple, c'est le moins qu'on puisse dire.\n\nMalgré cela, nos mains pourraient être liées. Bien qu'il ne soit pas tout à fait clair si l'Union Soviétique a la capacité d'étendre sa ligne de front, un refus pourrait signifier la guerre de toute façon, mais au lieu que notre ligne de front soit l'Europe occidentale, ce seraient nos propres villes, et au moins se ranger du côté des Soviétiques signifierait que nous pourrions maintenir la guerre à nos frontières et nous donner l'opportunité de récupérer un territoire qui nous appartient de droit, mais égoïstement thésaurisé par les capitalistes occidentaux, comme Trieste.\n\nIl ne s'agit pas d'une question claire avec encore moins de réponses claires, cependant, après une mûre réflexion..."
SOVw_Third_World_War.14.a: "Mettons de côté nos différences..."
SOVw_Third_World_War.14.b: "Au diable les Soviétiques !"
SOVw_Third_World_War.15.t: "Le secrétaire général ibérique"
SOVw_Third_World_War.15.d: "La décision du Comité central d'unifier l'Espagne et le Portugal a donné lieu à un grand débat au sein de la hiérarchie du Parti communiste. \n\nD'un côté, il y a\n\nDolores Ibarruri, une fidèle communiste du Parti communiste espagnol qui a dirigé le PCE après la chute de la Deuxième République en 1939.\n\nLe deuxième est Alvaro Cunhal, un communiste portugais relativement discret qui a été arrêté par la police secrète portugaise et qui a dirigé la clandestinité du Parti communiste depuis 1942 contre l'Estado Novo."
SOVw_Third_World_War.15.a: "Dolores Ibarruri est fidèle !"
SOVw_Third_World_War.15.b: "Álvaro Cunhal est un meilleur choix !"
SOVw_Third_World_War.16.t: "Résultat des élections"
 SOVw_Third_World_War.16.d: "Le congrès a confirmé le secrétaire général du mouvement unifié ibérique. Le nouveau gouvernement peut désormais entamer l'unification politique et administrative de l'Espagne et du Portugal."
SOVw_Third_World_War.16.a: "¡Prolétaires de tous les pays, uníos !"
SOVw_Third_World_War.16.b: "¡Proletários de todos os países, uní-vos!"
SOVw_Third_World_War.17.t: "La Conférence de Londres"
 SOVw_Third_World_War.17.d: "Les théâtres européens nécessaires sont sécurisés et la conférence diplomatique peut enfin proposer la fin de la guerre. Nous pouvons accepter un règlement qui préserve les gouvernements et les changements territoriaux déjà établis en Europe, ou poursuivre la lutte contre les États-Unis. Continuer, c'est s'engager sur une nouvelle échéance et sur une invasion de l'Amérique du Nord."
 SOVw_Third_World_War.17.a: "Continuez la guerre contre les États-Unis."
 SOVw_Third_World_War.17.b: "Acceptez le règlement européen."
SOVw_Third_World_War.18.t: "La question andorrane"
SOVw_Third_World_War.18.d: "À : Camarade Secrétaire Général, [SOV.GetLeader]\nDE : Comité de sécurité de l'État\n\nSUJET :\nCamarade, [SOV.GetLeader] il est devenu évident que lorsque nous traversons la frontière espagnole, nous avons également traversé la frontière andorrane, la question que je voulais poser est la suivante : en Andorre, il n'y a pas de partis révolutionnaires locaux qui puissent être guidés vers la construction du communisme dans cet État, la révolution andorrane de 1933 n'a fait qu'apporter l'idée de Lénine dans cet État, qui reste actuellement en sommeil, il n'y a aucun communiste notable en qui nous puissions avoir confiance, cependant avec la chute de la France et notre offensive sur le territoire espagnol, nous risquons d'étendre excessivement nos lignes, il est dans le meilleur intérêt du KGB de demander votre permission au ministère pour gouverner directement le territoire connu sous le nom d'Andorre depuis ce point constitue notre base d'opérations avancée."
SOVw_Third_World_War.18.a: "Et vous aurez des bases."
WW3.4.t: "Opération Aube Rouge - Partie 1"
WW3.4.d: "Compte tenu du nombre de forces américaines en Europe, nous avons été confrontés à une résistance significative de la part de chacune d'entre elles. Une proposition a été présentée par le général d'armée Stavka, par le camarade Joukov.\n\nJoukov a proposé une diversion contre les forces américaines en Europe, ce qu'il a proposé a créé une fracture au sein du Politburo, une invasion de l'Amérique continentale. Quelque chose qui n'a jamais été fait ou capable de faire, même les Japonais n'avaient pas prévu une telle chose pendant la Seconde Guerre mondiale.\n\nBien que l'idée de Joukov soit insensée, elle a quand même du mérite, si l'ensemble des forces armées américaines se concentrent sur l'Europe, alors il pourrait être possible de traverser le Pacifique, du Kamtchatka à Seattle, Washington."
WW3.4.a: "Nous y réfléchirons."
WW3.5.t: "Opération Aube Rouge - L'offensive du Pacifique"
WW3.5.d: "L'offensive ambitieuse du camarade Joukov a été autorisée par la Stavka ! Depuis les bases navales accidentées de Petropavlovsk-Kamchatsky et de Vladivostok, la flotte soviétique du Pacifique et les unités d'infanterie navale d'élite ont commencé à se rassembler pour la traversée transpacifique. Des péniches de débarquement spécialisées, des divisions aéroportées et des escortes de bombardiers à longue portée se préparent à exploiter les faibles défenses de la côte américaine du Pacifique."
WW3.5.a: "Commencez l'opération Aube Rouge !"
WW3.6.t: "Menace transpacifique soviétique détectée !"
WW3.6.d: "Les rapports des services de renseignement confirment la frénétique mobilisation navale et aéroportée soviétique à travers le Kamtchatka et l'Extrême-Orient soviétique. La reconnaissance par satellite et les patrouilles navales indiquent que des groupes d'attaque et des transports amphibies soviétiques s'organisent sous le commandement du maréchal Joukov pour une opération transpacifique baptisée « Aube Rouge ». La côte Pacifique et l'Alaska doivent se préparer à d'éventuelles agressions !"
WW3.6.a: "Sonnez les quartiers généraux du Commandement du Pacifique !"

SOV_operation_red_dawn: "Opération Aube Rouge"
SOV_operation_red_dawn_desc: "Une frappe transpacifique amphibie et aéroportée massive et à haut risque visant à perturber les couloirs d'approvisionnement arrière américains et à clouer les réserves occidentales sur le territoire national."

SOVw_Peace_Negotiation.1.t: "Proposition d'armistice"
SOVw_Peace_Negotiation.1.d: "Alors que la Troisième Guerre mondiale fait rage depuis plus de sept mois sans une avancée décisive, les pertes et les tensions économiques augmentent de façon exponentielle dans les deux blocs. Une nouvelle escalade risque de déclencher une catastrophe nucléaire irréversible. L'état-major estime qu'offrir un cessez-le-feu immédiat pourrait sécuriser nos positions tout en mettant fin aux pertes catastrophiques."
SOVw_Peace_Negotiation.1.a: "Transmettre la proposition de cessez-le-feu à Washington."
SOVw_Peace_Negotiation.1.b: "Jamais! Nous nous battrons jusqu'à la victoire finale."

SOVw_Peace_Negotiation.2.t: "Proposition de cessez-le-feu soviétique"
SOVw_Peace_Negotiation.2.d: "Un communiqué diplomatique urgent est arrivé de Moscou. Confrontés à d'immenses pertes et au danger toujours présent d'anéantissement nucléaire, les dirigeants soviétiques ont officiellement proposé un armistice immédiat et une paix blanche pour mettre fin à la Troisième Guerre mondiale."
SOVw_Peace_Negotiation.2.a: "Acceptez l'armistice - l'hémorragie doit cesser."
SOVw_Peace_Negotiation.2.b: "Rejetez leur offre - nous n'accepterons rien de moins qu'une victoire totale !"

SOVw_Peace_Negotiation.3.t: "[GetNewspaperHeader]Cessez-le-feu pendant la Troisième Guerre mondiale !"
SOVw_Peace_Negotiation.3.d: "Dans une tournure étonnante des événements, les représentants des États-Unis et de l'Union soviétique ont convenu d'une cessation immédiate des hostilités. Après des mois de guerre éprouvante qui a poussé l'humanité au bord de la ruine nucléaire, les armes se sont tues en Europe et dans le Pacifique. Le monde exhale un soulagement collectif, même si les cicatrices du conflit mettront des générations à guérir."
SOVw_Peace_Negotiation.3.a: "Une paix fragile revient."

SOVw_Peace_Negotiation.4.t: "Washington rejette notre cessez-le-feu !"
SOVw_Peace_Negotiation.4.d: "Le gouvernement américain a sèchement rejeté notre proposition d'armistice, déclarant qu'il ne se contenterait de rien de moins que la destruction du pouvoir soviétique. Il n'y a plus d'alternative désormais : le peuple soviétique et l'Armée rouge doivent se battre jusqu'à la victoire absolue !"
SOVw_Peace_Negotiation.4.a: "Alors ils ont scellé leur propre perte !"


#Events - News Events
SOVw_Third_World_War_news.1.d: "Depuis le déclenchement de la Troisième Guerre mondiale, l'Union soviétique a cherché à remodeler l'ordre mondial et a désormais trouvé son allié le plus puissant. Après des mois de négociations, Pékin a mis de côté ses divergences passées et a rejoint Moscou dans sa guerre contre les États-Unis, forgeant une alliance qui menace de faire pencher la balance de l'histoire.\n\nAvec la vaste main-d'oeuvre et la puissance industrielle de la Chine renforçant la machine de guerre soviétique, un nouveau front émerge, qui s'étend du Pacifique au coeur de l'Eurasie. Les forces soviétiques et chinoises coordonnent leurs offensives, frappant les positions occidentales avec une force implacable. Les usines de Pékin et de Shanghai travaillent jour et nuit, fournissant l'effort de guerre, tandis que les généraux soviétiques et les commandants chinois planifient leur prochaine action décisive.\n\nLe monde assiste à la solidification du bloc de l'Est, une force inédite depuis le plus fort de la guerre froide. Avec deux superpuissances unies, l'issue de la guerre n'est plus certaine : le vent a tourné."
SOVw_Third_World_War_news.2.t: "[GetNewspaperHeader]Prise de contrôle d'Andorre par le KGB !"
SOVw_Third_World_War_news.2.d: "Andorre était autrefois un petit pays relativement calme pendant les deux guerres mondiales, mais cette guerre change tout.\n\nLorsque les forces soviétiques sont entrées dans le petit pays, elles ne savaient pas quoi en faire, l'Andorre étant relativement apolitique et seule une petite poignée de jeunes peuvent être décrits comme « marxistes », Andorre peut être décrite comme un pays féodal. Mais ensuite une offre est venue, non pas du gouvernement local mais du service intérieur, le KGB souhaitait établir une base opérationnelle avancée dans ce petit pays pour brouiller les communications des Français en Algérie et en Tunisie.\n\nEn tant que telle, Andorre a été principalement gouvernée directement par le KGB, transformant la petite nation en un État policier secret qui répond directement au Comité de sécurité de l'État à Moscou et indirectement au Parti communiste."
SOVw_Third_World_War_news.2.a: "Une autre forme d'impérialisme soviétique !"
SOVw_Third_World_War_news.2.b: "Nécessaire et nécessaire."
SOVw_Third_World_War_news.3.t: "[GetNewspaperHeader]L'Armée populaire de libération occupe le Japon !"
SOVw_Third_World_War_news.3.d: "Avec l'entrée récente de la République populaire de Chine dans la Troisième Guerre mondiale aux côtés de l'Union soviétique, l'État du Japon se prépare à l'inévitable invasion de sa patrie.\n\nAlors que les Américains sont occupés en Europe alors que l'Union soviétique progresse, la République populaire de Chine a suffisamment allégé le fardeau soviétique en Extrême-Orient en envahissant et en occupant avec succès l'un des plus grands alliés de l'Amérique en Asie de l'Est, le Japon.\n\nLe dirigeant soviétique [SOV.GetLeader] a félicité le président [PRC.GetLeader] pour le succès de l'invasion du Japon, tandis que le président américain [USA.GetLeader] est resté insaisissable pour un commentaire supplémentaire."
SOVw_Third_World_War_news.3.a: "L'Asie de l'Est en flammes."
