 #tooltips
 SOV_WW3_CONSEQUENCES_TT: "Impose un cessez-le-feu entre le bloc soviétique et les opposants enregistrés lors de la Troisième Guerre mondiale. Les occupations inachevées sont restituées ; les gouvernements et les transferts territoriaux déjà établis par les événements de guerre demeurent."
 fully_controlled_austria_tt: "Les neuf États autrichiens, y compris les anciennes zones d'occupation, sont entièrement contrôlés par le bloc soviétique."
 EUROPE_NUKED_TT: "§RLa moitié de l'Europe sera bénie par l'atome...§!"
 SOV_Operation_Red_Dusk_Fail_TT: "Perdez §R50%§! de stabilité et §R50%§! de soutien de guerre, puis imposez un cessez-le-feu avec les adversaires enregistrés pendant la Troisième Guerre mondiale. Les occupations inachevées sont restituées ; les gouvernements établis et les transferts territoriaux demeurent."
 continue_war_tooltip: "Commence l'opération Red Dusk §Y§! avec un nouveau délai §Yde 765 jours§!. Contrôlez Washington D.C. Et battez les États-Unis pour gagner. Un échec coûte §R50%§! Stabilité et §R50%§! Soutien de guerre et force un cessez-le-feu."
 stop_war_tooltip: "Acceptez le règlement européen et mettez fin aux guerres du bloc soviétique contre les adversaires de la Troisième Guerre mondiale. Les gouvernements socialistes établis et les transferts territoriaux demeurent ; les occupations inachevées sont restituées. Une Europe sécurisée compte comme une victoire soviétique."
