#National Spirit
great_liberation_war: "La Grande Guerre de Libération"
great_liberation_war_desc: "Le moment est venu ! L'Occident, dirigé par les États-Unis impérialistes, a osé attaquer notre patrie sacrée, plongeant une fois de plus le monde dans les feux de la guerre. Mais qu'ils se souviennent : tout comme nous avons écrasé les envahisseurs pendant la Grande Guerre patriotique, nous allons les écraser maintenant. Il ne s'agit pas simplement d'une bataille entre nations ; c'est une bataille d'idéologies, une lutte pour la justice, l'égalité et la survie du socialisme lui-même. \nL'Union soviétique reste unie et inflexible. Notre peuple, forgé dans les feux de l'histoire, ne faiblira pas. Nos militaires, dont la force et la détermination sont inégalées, briseront la volonté de combattre de l'ennemi. Que le monde soit témoin de la puissance inébranlable de l'Union et de l'esprit indomptable de son peuple. \nLa victoire sera nôtre, non seulement pour l'Union soviétique, mais pour tous les peuples opprimés qui aspirent à la libération. Nous triompherons, nous endurerons, et les forces de l'impérialisme s'effondreront sous le poids de leur arrogance. \n§RL'Union soviétique en sortira victorieuse et l'histoire honorera une fois de plus notre force et notre détermination !§!"
