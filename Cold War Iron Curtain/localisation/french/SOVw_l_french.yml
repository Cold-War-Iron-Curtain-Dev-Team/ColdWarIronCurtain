 #Desc - Europe Tree
 SOVw_The_Great_Liberation_War_desc: "Camarade! L'heure du jugement est à nos portes ! Les forces impérialistes capitalistes de l'Occident ont osé frapper notre patrie sacrée, mais n'ayez crainte ! Sous la bannière du Parti communiste, nous sommes unis, résolus dans notre détermination à repousser les envahisseurs et à écraser leur ignoble agression. Avec chaque souffle, avec chaque goutte de sueur et de sang, nous les repousserons, car leur terre sera notre champ de bataille, et leur sang tachera la terre dans la lutte pour la justice ! En avant, camarades ! §RLa victoire est à nous, car la révolution est imparable !§!"
 SOVw_Round_up_the_Armed_Forces_desc: "L'appel aux armes a retenti dans tout le pays ! Les forces armées soviétiques sont mobilisées, prêtes à défendre l'honneur et la souveraineté de notre grande Union. La patrie appelle ses fils et ses filles à se lever, à se battre avec un courage et une détermination inébranlables. Grâce à la force de notre acier et à la volonté du peuple, nous nous tiendrons côte à côte contre toute force qui oserait menacer notre pays. La révolution est notre bouclier, le drapeau rouge notre bannière, et nos coeurs, remplis du feu du socialisme, nous guideront vers la victoire. Chaque soldat, chaque ouvrier, chaque camarade, aujourd'hui, nous marchons ensemble !"
 SOVw_One_Last_Push_for_Victory_desc: "Avec la force de nos camarades et la puissance de nos idéaux socialistes, nous avancerons sans relâche. Chaque centimètre carré de notre terre, chaque ville, chaque village, chaque champ sera récupéré et libéré de l'emprise de nos ennemis. Nos chars rouleront comme le tonnerre, notre infanterie avancera comme une vague imparable et notre artillerie s'abattra sans pitié sur les envahisseurs. Nous ne luttons pas seulement pour nos frontières, mais pour l'avenir de la révolution. Pour chaque travailleur, chaque agriculteur, chaque enfant qui rêve d'un monde sans oppression."
 SOVw_Rally_the_Workers_of_the_Unions_desc: "Face aux difficultés, au coeur de la lutte, les travailleurs de l'Union soviétique restent inflexibles ! Ce ne sont pas seulement nos armées, mais la force du peuple - les ouvriers, les agriculteurs, les constructeurs - qui constituent la véritable épine dorsale de notre grand État socialiste. Dans chaque usine, chaque atelier, chaque domaine, accomplissant notre travail avec une détermination inébranlable, forgeant l'avenir avec nos mains et notre sueur. Lorsque soufflent les vents de l'adversité, lorsque les ennemis du progrès cherchent à nous démolir, nous restons fermes, invaincus et ininterrompus. Nous savons que la révolution ne se gagne pas seulement par l'épée, mais aussi par les efforts inlassables de ceux qui façonnent la terre, créent la richesse et construisent le rêve. Grâce à notre dévouement, nous surmontons les défis et, ensemble, nous veillerons à ce qu'aucun obstacle, aucun ennemi ne puisse briser notre volonté."
 SOVw_In_the_Defense_of_the_Union_desc: "Notre Union se trouve à un moment charnière, entrant dans un nouveau chapitre de notre histoire alors que nous sommes appelés aux armes pour la première fois depuis la Grande Guerre patriotique. Il ne s'agit pas seulement d'un combat ; c'est une noble cause : une guerre pour la libération des peuples d'Europe. Les cris des opprimés résonnent à travers tout le continent, et il est de notre devoir, de notre mission, de répondre à cet appel.\n\nFace à ce défi capital, nous devons nous lancer dans une ligne d'action décisive. Nous tracerons un chemin vers la victoire, un chemin qui enveloppe non seulement nos soldats mais aussi l'esprit même du prolétariat. Le secrétaire général [SOV.GetLeader] a déclaré avec insistance que le triomphe du communisme n'est pas simplement une aspiration mais un engagement inébranlable."
