 SOV_WW3_decisions_desc: "La campagne européenne se termine lorsque tous les États requis sont assurés. Seuls comptent les pays qui entrent en guerre et qui ont déjà sécurisé leurs théâtres. Les colonies et les campagnes insulaires éloignées sont exclues. Passez la souris sur la mission de cessez-le-feu pour consulter la liste de contrôle état par état.\n\nLe contrôle soviétique et allié compte tous deux, y compris les gouvernements successeurs alignés sur les Soviétiques. Les mouvements de capitaux ne changent pas les objectifs.\n\nÉpuisement de la guerre publique : [?Soviet_War_Exhaustion_variable|%]\nForce de l'armée : [?Soviet_Army_Strength|%]\n\nÉtats requis sécurisés : [?cwic_ww3_objectives_held|0]/[?cwic_ww3_objectives_total|0]\n[GetCwicWW3WGRStatus]\n[GetCwicWW3FRAStatus]\n[GetCwicWW3HOLStatus]\n[GetCwicWW3BELStatus]\n[GetCwicWW3LUXStatus]\n[GetCwicWW3ITAStatus]\n[GetCwicWW3DENStatus]\n[GetCwicWW3NORStatus]\n[GetCwicWW3AUSStatus]\n[GetCwicWW3FINStatus]\n[GetCwicWW3SWEStatus]\n[GetCwicWW3SPRStatus]\n[GetCwicWW3PORStatus]\n[GetCwicWW3GREStatus]\n[GetCwicWW3SWIStatus]\n[GetCwicWW3TURStatus]\n[GetCwicWW3SARStatus]"
