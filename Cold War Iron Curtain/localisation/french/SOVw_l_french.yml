the_last_war: "La dernière guerre"
the_last_war_desc: "\n\n\n\n\n\n£sacred_war\n\n\n\n\n\n\n\nNous lutterons contre les étrangleurs\nDe toute idée meurtrière,\nLes violeurs et les voleurs,\nLes tueurs de gens !\n\n§RQue notre noble colère\nBouillonne comme une vague !\nC'est la guerre populaire,\nUne guerre sacrée !§!"
