 #ideas
 NGA_shell_bp_PDCNL_2:0 "Shell-BP PDCNL"
 NGA_shell_bp_PDCNL_2_desc:0 "Fort de gisements pétroliers notables découverts en 1958 dans le delta du Niger, Shell-BP a établi sa propre direction au Nigeria avec la création de Shell-BP Petroleum Development Company Nigeria Limited (Shell-BP PDCNL). Alors que les minorités ethniques du delta du Niger croient que les sociétés étrangères sont responsables de l'exploitation de leur peuple et de leurs terres ancestrales, les riches élites igbo, haoussa et yoruba sont heureuses de prendre leur part des bénéfices de leurs partenaires néerlandais et britanniques."
 NGA_kemalist_nigeria:0 "Un Nigéria kémaliste"
 NGA_kemalist_nigeria_desc:0 "Grâce à notre leader visionnaire, §YChike Obi§!, le Nigeria joue un rôle unique sur la scène mondiale en tant que l'une des seules nations kémalistes au monde."
 NGA_anti_igbo_pogroms:0 "§RPogroms anti-igbos§!"
 NGA_anti_igbo_pogroms_desc:0 "Le ressentiment des habitants du Nord contre les Igbo a atteint un point d'ébullition après le coup d'État des cinq majors et maintenant qu'ils sont enhardis par le contre-coup d'État, ils vont plus loin. Parmi les nombreuses communautés de migrants Igbo dans tout le nord du Nigeria, il y a des massacres et des destructions de propriétés ; nous devons certainement y remédier."
 NGA_nigerian_national_oil_corporation:0 "Société nationale nigériane du pétrole"
 NGA_igbo_yoruba_hausa_divide_desc:0 "Le Nigeria, bien que contenant des dizaines d'ethnies, compte trois groupes dominants : les Igbo, les Yoruba et les Haoussa-Fulani. Les Igbos originaires du sud-est sont d'éminents entrepreneurs que l'on retrouve dans les communautés de migrants à travers le pays et, en raison de leurs traditions dans les sociétés méritocratiques, aspirent à s'élever au sommet à travers n'importe quel système. Les Haoussa-Fulani sont le plus grand des trois groupes originaires du nord-ouest. Issus d'une société islamique féodale traditionnelle, les Haoussa-Fulani croient davantage en une structure hiérarchique où les agriculteurs et les artisans se sentent satisfaits d'une position socio-économique inférieure. Cela conduit au principal conflit culturel alors que les Haoussas et les Peuls sont obsédés par les Igbos qui tentent de les remplacer sur leur propre lieu de travail ou dans leur propre système éducatif. Les Yoruba sont une société célèbre pour ses sculpteurs, peintres et musiciens toujours pris entre la tension des Igbos et des Haoussa-Fulani."
 #1960s focuses
 NGA_1960_rise_of_the_nigerian_federation:0 "L'essor de la Fédération nigériane"
 NGA_1960_rise_of_the_nigerian_federation_desc:0 "La Fédération nigériane est désormais un régime politique indépendant et il est temps pour nous de nous engager sur la voie de l'autogouvernance."
 NGA_nationalize_the_nigerian_railway_corporation:0 "Nationaliser la Société des chemins de fer nigérians"
 NGA_nationalize_the_nigerian_railway_corporation_desc:0 "La société nigériane des chemins de fer, créée à l'époque coloniale, compte encore principalement des actionnaires européens. Si nous devions nationaliser l'entité, cela nous permettrait, en tant que gouvernement, de l'utiliser plus efficacement et de restituer davantage de revenus à l'État."
 NGA_subsidize_the_nigerian_railway_corporation:0 "Subventionner la Société des chemins de fer nigérians"
 NGA_subsidize_the_nigerian_railway_corporation_desc:0 "Si nous devions subventionner la Nigerian Railway Corporation préexistante, cela serait probablement plus efficace que la bureaucratie inefficace du gouvernement qui la gère."
 NGA_reform_northern_agriculture:0 "Réformer l'agriculture du Nord"
 NGA_reform_northern_agriculture_desc:0 "L'agriculture du Nord est désuète et inefficace et risque de s'effondrer en cas de sécheresse. Nous devons certainement réformer le secteur si nous voulons un approvisionnement alimentaire durable pour la partie nord du pays."
 NGA_prevent_factionalism:0 "Prévenir le factionnalisme"
 NGA_prevent_factionalism_desc:0 "Le factionnalisme n'est que trop un problème dans leur gouvernement actuel, divisé sur des critères ethniques. Pour le moment, nous pouvons négocier un peu pour apaiser cette tension."
 NGA_redifine_zoning_laws_in_kano:0 "Redéfinir les lois de zonage à Kano"
 NGA_redifine_zoning_laws_in_kano_desc:0 "Afin d'attirer davantage d'investissements dans la ville de Kano, nous sommes en mesure de modifier les lois de zonage pour qu'elles soient plus clémentes à l'égard des entrepreneurs étrangers."
 NGA_expand_northern_islamic_schools:0 "Développer les écoles islamiques du Nord"
 NGA_address_ethnic_tension:0 "Aborder les tensions ethniques"
 NGA_address_ethnic_tension_desc:0 "Même si la résolution du problème est hors de notre portée pour l'équipe, nous pouvons au moins identifier quelles sont, selon nous, les sources des problèmes Igbo, Haoussa-Fulani et Yoruba."
 NGA_the_founding_of_the_republic:0 "La fondation de la République"
 NGA_the_founding_of_the_republic_desc:0 "La Fédération nigériane en tant que concept est le résultat d'une constitution coloniale antérieure. Maintenant que nous sommes indépendants, il est temps de fonder la République nigériane formelle"
 NGA_tame_the_wild_west:0 "Apprivoiser le Far West"
 NGA_tame_the_wild_west_desc:0 "En raison du conflit impliquant le Groupe d'action Yoruba dirigé par le chef Obafemi Awolowo, la région occidentale a sombré dans un chaos complet, nous devons certainement remédier à cette situation."
 NGA_make_the_west_a_yoruba_issue:0 "Faire de l'Occident une question yoruba"
 NGA_make_the_west_a_yoruba_issue_desc:0 "Si les Occidentaux choisissent de se révolter et de détruire leurs propres villes, qu'ils le fassent. Ils ne souffriront que de leur propre violence."
 NGA_subsidize_yoruba_farms:0 "Subventionner les fermes yoruba"
 NGA_subsidize_yoruba_farms_desc:0 "La subvention des exploitations agricoles de la région occidentale entraînera probablement une reprise plus rapide"
 NGA_develop_yoruba_plumbing:0 "Développer la plomberie yoruba"
 NGA_develop_yoruba_plumbing_desc:0 "En développant la plomberie yoruba, nous pouvons augmenter l'assainissement et la disponibilité de l'eau dans la région et ainsi apaiser Action Group."
 NGA_sideline_the_issue:0 "Mettre le problème de côté"
 NGA_sideline_the_issue_desc:0 "La crise occidentale est un peu trop épuisante pour nos politiciens, alors pour le moment, il vaut peut-être mieux mettre toute la question de côté."
 NGA_arrest_obafemi_awolowo:0 "Arrêter Obafemi Awolowo"
 NGA_arrest_obafemi_awolowo_desc:0 "Le chef Obafemi Awolo et son parti, le Groupe d'action, constituent clairement une menace pour la stabilité de la république et nombreux sont ceux qui prétendent qu'il tente même de renverser le gouvernement. Sa place est dans une cellule, voire dans une tombe."
 NGA_rely_on_samuel_akintola:0 "Fiez-vous à Samuel Akintola"
 NGA_rely_on_samuel_akintola_desc:0 "Allié d'Ahmed Bello, Samuel Akintola sait clairement gérer la question de l'Ouest. Maintenant que nous avons arrêté Obafemi Awolowo, nous pouvons nommer Akintola gouverneur."
 NGA_the_west_is_tamed:0 "L'Occident est apprivoisé"
 NGA_the_west_is_tamed_desc:0 "Grâce aux efforts déployés par Samuel Akintola pour gouverner la région, nous pouvons désormais affirmer que le chaos de la crise occidentale est terminé."
 NGA_simplify_western_zoning_laws:0 "Simplifier les lois de zonage occidentales"
 NGA_simplify_western_zoning_laws_desc:0 "En simplifiant les lois de zonage, nous pouvons attirer davantage d'investissements dans la région occidentale"
 NGA_send_in_the_federal_government:0 "Envoyer au gouvernement fédéral"
 NGA_send_in_the_federal_government_desc:0 "Le chaos de la crise occidentale n'a que assez duré. Il est temps d'envoyer une présence militaire formelle."
 NGA_the_west_is_subdued:0 "L'Occident est soumis"
 NGA_the_west_is_subdued_desc:0 "Suite à notre dure réponse militaire, l'Occident a été maîtrisé au point que la crise occidentale n'est plus un problème."
 NGA_relocate_public_works:0 "Déplacer les travaux publics"
 NGA_relocate_public_works_desc:0 "En nous détournant des travaux publics dans l'Ouest, nous pouvons développer des régions plus fidèles."
 NGA_Balewa_diplomacy:0 "Diplomatie Balewa"
 NGA_Balewa_diplomacy_desc:0 "Abubakar Tafawa Balewa, en tant que leader, envisage de prendre une initiative majeure en matière de relations étrangères en consacrant une grande partie de son temps administratif à la politique étrangère."
 NGA_the_congo_crisis:0 "La crise congolaise"
 NGA_the_congo_crisis_desc:0 "La crise du Congo est un désastre pour le continent africain et Balewa prévoit d'apporter toute l'aide possible au gouvernement congolais"
 NGA_send_in_un_peacekeepers:0 "Envoyez des soldats de la paix de l'ONU"
 NGA_send_in_un_peacekeepers_desc:0 "Premièrement, pour aider à résoudre la crise au Congo, il est nécessaire que nous envoyions des soldats nigérians comme soldats de maintien de la paix de l'ONU."
 NGA_ignore_the_crisis:0 "Ignorer la crise"
 NGA_ignore_the_crisis_desc:0 "La crise du Congo est un gaspillage des ressources nigérianes, concentrons-nous sur les affaires intérieures."
 NGA_negotiate_with_tshome:0 "Négocier avec Tshombe"
 NGA_negotiate_with_tshome_desc:0 "Balewa croit pouvoir raisonner Tshombe et parvenir à une solution pacifique à ce conflit"
 NGA_address_south_africa:0 "Adresse Afrique du Sud"
 NGA_address_south_africa_desc:0 "En tant que grande nation africaine, il est de notre devoir de lutter contre le régime de l'apartheid"
 NGA_tolerate_south_africa:0 "Tolérer l'Afrique du Sud"
 NGA_tolerate_south_africa_desc:0 "Il n'est pas nécessaire d'exercer des pressions diplomatiques contre l'Afrique du Sud, laissons-les tranquilles."
 NGA_confront_south_africa:0 "Affronter l'Afrique du Sud"
 NGA_confront_south_africa_desc:0 "Nous avons désespérément besoin d'affronter la République d'Afrique du Sud. Les violations des droits humains en Afrique du Sud ne sont actuellement pas contrôlées et nous devons faire pression sur leur régime pour qu'il change de nature."
 NGA_boycott_the_fifa_world_cup:0 "Boycottez la Coupe du Monde de la FIFA"
 NGA_boycott_the_fifa_world_cup_desc:0 "La nature raciste de la FIFA est apparue au grand jour lorsqu'elle nous a infligé des amendes à plusieurs reprises pour avoir exclu l'Afrique du Sud de la Confédération africaine de football. Alors que l'Afrique du Sud a été autorisée à revenir à la Coupe du Monde en 1966, nous ne pouvons pas tolérer cela en tant qu'Africains."
 NGA_stop_mandelas_execution:0 "Arrêtez l'exécution de Mandela"
 NGA_stop_mandelas_execution_desc:0 "Pendant que Mandela et ses camarades attendent leur procès, nous devons faire un effort diplomatique pour garantir que cela ne se termine pas par une exécution."
 NGA_lobby_to_remove_south_africa_from_the_commonwealth:0 "Faire pression pour retirer l'Afrique du Sud du Commonwealth"
 NGA_lobby_to_remove_south_africa_from_the_commonwealth_desc:0 "Le régime de l'apartheid sud-africain n'a clairement pas sa place dans le Commonwealth, faire pression contre son appartenance au Commonwealth nous sera diplomatiquement avantageux."
 NGA_integrate_british_cameroon:0 "Intégrer le Cameroun britannique"
 NGA_integrate_british_cameroon_desc:0 "Suite à la résolution des Nations Unies nous transférant le contrôle du Cameroun, il est temps que nous l'intégrions en tant que partie formelle de notre nation."
 NGA_integrate_the_infrastructure:0 "Intégrer l'infrastructure"
 NGA_integrate_the_infrastructure_desc:0 "Après avoir intégré politiquement le sud du Cameroun, la prochaine étape consiste à connecter ses infrastructures aux nôtres"
 NGA_improve_relations_with_the_commonwealth:0 "Améliorer les relations avec le Commonwealth"
 NGA_improve_relations_with_the_commonwealth_desc:0 "Comme nous souhaitons continuer à faire partie intégrante du Commonwealth, nous devons établir de meilleures relations diplomatiques avec les autres membres"
 NGA_the_first_nigerian_oil_boom:0 "Le premier boom pétrolier nigérian"
 NGA_the_first_nigerian_oil_boom_desc:0 "En s'appuyant sur les enquêtes précédentes, il est clair que le Nigeria est très riche en pétrole, en particulier dans le sud-est. Cette décennie marquera sûrement une expansion massive de la transformation du pétrole dans le pays."
 NGA_expand_oil_in_biafra:0 "Agrandir les champs de pétrole dans la baie du Biafra"
 NGA_expand_oil_in_biafra_desc:0 "Compte tenu de la riche présence pétrolière dans la baie du Biafra, c'est un premier choix évident pour l'expansion pétrolière."
 NGA_expand_oil_in_fields_in_the_south_west:0 "Développer les champs de pétrole dans le sud-ouest"
 NGA_expand_oil_in_fields_in_the_south_west_desc:0 "Bien que le pétrole ne soit pas aussi abondant que dans le sud-est, une certaine expansion pétrolière est encore possible dans la région du sud-ouest"
 NGA_expand_oil_in_fields_in_the_niger_delta:0 "Développer les champs de pétrole dans le delta du Niger"
 NGA_expand_oil_in_fields_in_the_niger_delta_desc:0 "Le delta du fleuve Niger est l'une des zones les plus riches en ressources du pays et un emplacement propice à l'expansion pétrolière."
 NGA_expand_port_harcourt_facilities:0 "Agrandir les installations de Port Harcourt"
 NGA_expand_port_harcourt_facilities_desc:0 "La zone autour de la ville de Port Harcourt est un endroit approprié pour construire des installations de récolte de pétrole. En tant que tel, nous devrions développer ceux qui existent déjà dans la région."
 NGA_expand_coal_mining_in_jos:0 "Développer l'exploitation minière du charbon à Jos"
 NGA_expand_coal_mining_in_jos_desc:0 "Les hauts plateaux entourant la ville de Jos constituent un emplacement privilégié pour l'exploitation minière car ils sont riches en gisements de charbon"
 NGA_expand_tin_mining_in_sokoto:0 "Développer l'exploitation minière de l'étain à Sokoto"
 NGA_expand_tin_mining_in_sokoto_desc:0 "Les plaines entourant la ville de Sokoto sont riches en gisements d'étain et prêtes à être récoltées."
 NGA_expand_tin_mining_in_jos_highlands:0 "Développer l'exploitation minière de l'étain dans les hauts plateaux de Jos"
 NGA_expand_tin_mining_in_jos_highlands_desc:0 "Les hauts plateaux de Jos contiennent de grandes quantités d'étain et sont de bons candidats pour l'exploitation minière."
 NGA_build_a_processing_plant_in_kaduna:0 "Construire une usine de transformation à Kaduna"
 NGA_build_a_processing_plant_in_kaduna_desc:0 "Kaduna est un très bon candidat pour une usine de transformation, nous devrions en profiter."
 NGA_establish_limestone_mines_in_the_north_central:0 "Établir des mines de calcaire dans le centre-nord"
 NGA_establish_limestone_mines_in_the_north_central_desc:0 "La région du centre-nord du pays est un emplacement privilégié pour démarrer l'exploitation minière du calcaire"
 NGA_expand_palm_oil_fields_in_zaria:0 "Agrandir les champs de palmiers à huile à Zaria"
 NGA_expand_palm_oil_fields_in_zaria_desc:0 "L'huile de palme devient de plus en plus un ingrédient nécessaire dans les produits ménagers partout dans le monde. Nous avons constaté que les champs à l'extérieur de Zaria sont un endroit idéal pour commencer les plantations."
 NGA_expand_peanut_farms_in_kano:0 "Agrandissez les fermes d'arachides à Kano"
 NGA_expand_peanut_farms_in_kano_desc:0 "La culture de l'arachide est un élément vital de l'économie du nord, nous devrions l'étendre dans la région autour de Kano."
 NGA_adopt_the_nigerian_naira:0 "Adoptez le Naira nigérian"
 NGA_adopt_the_nigerian_naira_desc:0 "Développer notre propre monnaie est vital pour notre indépendance et notre autonomie gouvernementale. Avec la confiance de nos experts financiers, nous pensons qu'il est temps d'adopter le naira nigérian."
 NGA_join_OPEC:0 "Rejoignez l'OPEP"
 NGA_join_OPEC_desc:0 "En tant que grand pays producteur de pétrole, il est désormais dans notre intérêt de rejoindre l'OPEP afin de pouvoir nous affirmer sur un marché pétrolier indépendant de l'influence américaine et britannique."
 NGA_Nigerian_armed_forces:0 "Forces armées nigérianes"
 NGA_Nigerian_armed_forces_desc:0 "Comme nous sommes désormais indépendants, il est temps de créer nos propres branches armées"
 NGA_the_nigerian_army:0 "L'armée nigériane"
 NGA_the_nigerian_army_desc:0 "En tant qu'épine dorsale de nos forces armées, il est important que nous établissions une armée fonctionnelle sur la base des Forces royales des frontières de l'Afrique de l'Ouest existantes."
 NGA_establish_the_nigerian_medical_corps:0 "Créer le corps médical nigérian"
 NGA_establish_the_nigerian_medical_corps_desc:0 "La création d'un corps médical pour le Nigeria jouera un rôle déterminant dans la direction d'une armée moderne."
 NGA_begin_military_contracting_in_lagos:0 "Commencer les contrats militaires à Lagos"
 NGA_begin_military_contracting_in_lagos_desc:0 "Le lancement d'une série de contrats militaires à Lagos sera essentiel à la création d'une industrie militaire moderne"
 NGA_purchase_italian_artillery:0 "Acheter de l'artillerie italienne"
 NGA_purchase_italian_artillery_desc:0 "L'achat d'artillerie italienne est une option qui nous convient"
 NGA_create_the_first_army_brigade:0 "Créer la première brigade militaire"
 NGA_create_the_first_army_brigade_desc:0 "La Création de notre première Brigade d'Armée sera pour nous un moment déterminant, savourons-le."
 NGA_form_the_nigerian_air_force:0 "Former l'armée de l'air nigériane"
 NGA_form_the_nigerian_air_force_desc:0 "Nous avons atteint le point où notre nation s'est ancrée après l'indépendance et est prête à créer une branche aérienne de ses forces armées."
 NGA_purchase_german_do_17s:0 "Achetez des Do-17 allemands"
 NGA_purchase_german_do_17s_desc:0 "L'achat de Do-17 allemands contribuera à la constitution de notre propre force aérienne"
 NGA_request_west_german_advisors:0 "Demander des conseillers ouest-allemands"
 NGA_request_west_german_advisors_desc:0 "Des vétérans ouest-allemands proposent de superviser la formation de notre force aérienne indigène."
 NGA_commission_czech_l29_delfin:0 "Commission tchèque L-29 Deflin"
 NGA_commission_czech_l29_delfin_desc:0 "La mise en service des L-29 tchèques comme avions légers est un choix pratique pour notre jeune force aérienne."
 NGA_import_russian_planes:0 "Importer des avions russes"
 NGA_import_russian_planes_desc:0 "Grâce à la politique soviétique consistant à offrir des armes aux nations amies, nous pouvons sécuriser une importante livraison d'avions russes."
 NGA_the_nigerian_navy:0 "La marine nigériane"
 NGA_the_nigerian_navy_desc:0 "En tant que nation dotée d'un grand littoral, il est nécessaire de créer une véritable marine que nous puissions utiliser pour protéger notre extraction pétrolière dans le sud-est et lutter contre la piraterie."
 NGA_import_dutch_patrol_boats:0 "Importer des bateaux de patrouille néerlandais"
 NGA_import_dutch_patrol_boats_desc:0 "Les Pays-Bas sont prêts à nous vendre divers patrouilleurs à usage militaire, nous devrions accepter cette offre."
 NGA_the_nigerian_marines:0 "Les Marines nigérians"
 NGA_the_nigerian_marines_desc:0 "L'organisation d'une division maritime de notre marine jouera un rôle déterminant dans la guerre."
 NGA_import_a_dutch_destryer:0 "Importer un destroyer hollandais"
 NGA_import_a_dutch_destryer_desc:0 "Avec l'importation d'un destroyer néerlandais, nous pouvons entretenir quelque chose qui ressemble à une flotte hauturière."
 NGA_develop_indigenous_landing_craft:0 "Développer des péniches de débarquement autochtones"
 NGA_develop_indigenous_landing_craft_desc:0 "Pour utiliser pleinement nos divisions maritimes, nous aurons besoin d'une forme de péniche de débarquement produite localement."
 NGA_the_coup_of_the_five_majors:0 "Le coup d'État des cinq majeurs"
 NGA_the_coup_of_the_five_majors_desc:0 "Suite au coup d'État réalisé par divers officiers mineurs, dont le major Chukuma Kaduna Nzeogwu et le major Emmanuel Ifeajuna, nous avons la capacité d'assassiner brutalement les habitants du Nord, ce qui a réduit les opportunités des Igbos dans ce pays."
 NGA_transfer_all_power_to_the_armed_forces:0 "Transférer tout le pouvoir aux forces armées"
 NGA_transfer_all_power_to_the_armed_forces_desc:0 "Avec l'assassinat des principales personnalités politiques de notre pays, nous pouvons désormais être assurés que le pouvoir revient de facto à la Junte."
 NGA_declare_martial_law:0 "Déclarer la loi martiale"
 NGA_declare_martial_law_desc:0 "Afin d'assurer une transition du pouvoir en toute sécurité, il est crucial de décréter la loi martiale dans tout le pays."
 NGA_creation_of_the_supreme_military_council:0 "Création du Conseil militaire suprême"
 NGA_creation_of_the_supreme_military_council_desc:0 "Ces officiers anarchiques doivent être maîtrisés, il est temps pour le chef des forces armées, Johnson Aguiyi-Ironsi, de réprimer cette insurrection glorifiée."
 NGA_tolerate_northern_officers:0 "Tolérer les officiers du Nord"
 NGA_tolerate_northern_officers_desc:0 "Même si les officiers qui prennent le contrôle de la nation sont principalement des Igbos, il est important de maintenir les officiers nordistes à leur poste afin de ne pas s'aliéner les Haoussa-Fulani."
 NGA_decree_no_34:0 "Décret n° 34"
 NGA_decree_no_34_desc:0 "Johnson Aguiyi-Ironsi prévoit de légiférer le décret numéro 34 qui abolira la structure fédérale et créera un État unitaire. Alors que cela renforce toutes les théories du complot selon lesquelles le coup d'État initial était une orchestre sous fausse bannière pour justifier la prise de pouvoir par les Igbo d'Aguiyi-Ironsi, il tente de regagner le soutien du public en garantissant la liberté de la presse."
 NGA_dissolve_parliament:0 "Dissoudre le Parlement"
 NGA_dissolve_parliament_desc:0 "Le Conseil militaire suprême, dans sa tentative d'abolir complètement le gouvernement civil, passe à l'étape suivante avec la dissolution complète du Parlement."
 NGA_status_of_northern_prisons:0 "Statut des prisonniers du Nord"
 NGA_status_of_northern_prisons_desc:0 "Lors du premier coup d'État des cinq majors, de nombreux officiers nordistes fidèles au gouvernement précédent ont été emprisonnés. Alors que Johnson Aguiyi-Ironsi est motivé à les libérer pour obtenir le soutien du nord, ses proches craignent que cela puisse permettre un contre-coup d'État."
 NGA_the_northern_counter_coup:0 "Le contre-coup d'État du Nord"
 NGA_the_northern_counter_coup_desc:0 "Depuis qu'Aguiyi-Ironsi a négocié la reddition de Nzeogwu après le coup d'État des cinq majors, que ce soit par suspicion réelle ou par parti pris anti-igbo, les Nordistes soupçonnent depuis longtemps une conspiration sous faux drapeau justifiant la prise de pouvoir d'Aguiyi-Ironsi. Ceci, ajouté au désir des habitants du Nord de garder le contrôle du pays, a alimenté un complot de coup d'État mené par Murtala Muhammad et d'autres officiers éminents du Nord."
 NGA_johnson_aguiyi_ironsi_holds_on_to_power:0 "Johnson Aguiyi-Ironsi conserve le pouvoir"
 NGA_johnson_aguiyi_ironsi_holds_on_to_power_desc:0 "Malgré la tentative de coup d'État, Johnson Aguiyi-Ironsi a été informé à l'avance, évitant ainsi son enlèvement. La plupart des putschistes étant prisonniers, le coup d'État a été rapidement stoppé en sécurisant la prison dans laquelle ils étaient captifs."
 NGA_maintain_the_supreme_military_council:0 "Maintenir le Conseil militaire suprême"
 NGA_maintain_the_supreme_military_council_desc:0 "La nation n'est pas encore prête pour un régime civil. Il devrait plutôt être dirigé par Johnson Aguiyi-Ironsi alors qu'il assure la sécurité du pays pour le peuple Igbo."
 NGA_create_a_unitary_country:0 "Créer un pays unitaire"
 NGA_create_a_unitary_country_desc:0 "Développant le décret 34, Johnson Aguiyi-Ironsi centralisera entièrement l'État en un pays unitaire sous un seul code juridique et une seule législature."
 NGA_british_advisors:0 "Conseillers britanniques"
 NGA_british_advisors_desc:0 "Compte tenu de nos bonnes relations avec le Royaume-Uni et du fait que notre structure militaire est en grande partie formée dans les académies britanniques, nous continuerons de compter sur les conseillers britanniques pour développer notre structure militaire."
 NGA_militarize_the_cameroon_border:0 "Militariser la frontière camerounaise"
 NGA_militarize_the_cameroon_border_desc:0 "En préparation d'une attaque du Cameroun, ou de notre besoin de libérer l'Ambazonie, nous établirons des défenses à notre frontière avec la nation."
 NGA_weaken_labor_unions:0 "Affaiblir les syndicats"
 NGA_weaken_labor_unions_desc:0 "Historiquement, les syndicats ont toujours été un frein au progrès et un terrain d'entente pour les communistes et les socialistes. Il va falloir mettre une laisse sur ces groupes..."
 NGA_exploit_foreign_aid:0 "Exploiter l'aide étrangère"
 NGA_exploit_foreign_aid_desc:0 "L'Occident, tout en étant notre ami, peut également être utilisé pour nous donner les mesures de relance et le financement de développement dont nous avons besoin."
 NGA_push_the_envelope_in_western_cameroon:0 "Libérer l'Ambazonie"
 NGA_push_the_envelope_in_western_cameroon_desc:0 "La partie sud de ce qui était auparavant le Cameroun britannique est anglophone et appelée par ses habitants Ambazonie. Alors que l'indépendance arrivait dans la région, les gens souhaitaient à l'origine faire partie du Nigeria ou d'une nation indépendante, mais sont devenus une partie du Cameroun où ils contestent encore aujourd'hui leur appartenance. Nous devons libérer ces peuples opprimés."
 NGA_build_a_military_complex_the_niger_delta:0 "Construire un complexe militaire dans le delta du Niger"
 NGA_build_a_military_complex_the_niger_delta_desc:0 "Le delta du Niger, partie centrale de notre pays, constitue un emplacement approprié pour un complexe militaire, aux côtés des nombreux autres centres industriels de la région."
 NGA_build_a_military_complex_in_biafra:0 "Construire un complexe militaire à Enugu"
 NGA_build_a_military_complex_in_biafra_desc:0 "La zone entourant Port Harcourt dispose déjà d'une infrastructure de parc industriel adaptée pour y établir un complexe militaire."
 NGA_move_capital_to_port_harcourt:0 "Déplacer la capitale à Port Harcourt"
 NGA_move_capital_to_port_harcourt_desc:0 "Compte tenu de l'histoire de Lagos en tant que capitale coloniale et de la géographie peu pratique de sa situation aux confins de notre pays, il est temps de définir un endroit plus raisonnable pour situer notre gouvernement."
 NGA_liberalize_the_economy:0 "Libéraliser l'économie"
 NGA_liberalize_the_economy_desc:0 "La libéralisation économique nous aidera à développer une nation autosuffisante"
 NGA_subsidize_biafran_companies:0 "Subventionner les entreprises du Sud-Est"
 NGA_subsidize_biafran_companies_desc:0 "Compte tenu du boom économique déjà en cours dans le sud-est, nous devons investir dans la région pour garantir la poursuite de cette croissance."
 NGA_allow_igbo_militias:0 "Autoriser les milices Igbo"
 NGA_allow_igbo_militias_desc:0 "Les habitants du pays Igbo doivent affirmer leur sécurité les uns envers les autres étant donné le sentiment ouvertement anti-igbo dans le pays."
 NGA_build_southern_railroad_infrastructure:0 "Construire l'infrastructure ferroviaire du Sud"
 NGA_build_southern_railroad_infrastructure_desc:0 "Pour moderniser notre pays et assurer le transport de la population, nous construirons un système ferroviaire interconnecté dans le sud du pays"
 NGA_found_the_port_of_harcourt_university:0 "J'ai fondé l'Université de Port Harcourt"
 NGA_found_the_port_of_harcourt_university_desc:0 "Compte tenu du besoin d'enseignement supérieur dans le pays, nous créerons une université dans la nouvelle capitale"
 NGA_subsidize_biafran_textile_industries:0 "Subventionner les industries textiles d'Enugu"
 NGA_subsidize_biafran_textile_industries_desc:0 "Les textiles, qui sont l'un des principaux produits manufacturés d'Enugu, doivent être subventionnés pour améliorer l'économie."
 NGA_establish_a_new_junta:0 "Établir une nouvelle junte"
 NGA_establish_a_new_junta_desc:0 "Le favori Igbo, Aguiyi-Ironsi, n'est d'aucune utilité pour les problèmes de conflit ethnique extrême de notre nation. Il vaut mieux qu'une nouvelle junte s'installe..."
 NGA_soviet_aligned_junta:0 "Junte alignée sur Moscou"
 NGA_soviet_aligned_junta_desc:0 "Avec le soutien soviétique et une conspiration impliquant plusieurs jeunes officiers de bas niveau, formés à l'université, un coup d'État aligné sur Moscou sera possible."
 NGA_ban_sharia_law:0 "Interdire la charia"
 NGA_ban_sharia_law_desc:0 "La charia est ce que l'establishment féodal utilise pour contrôler les masses du nord. Nous devons abolir ce système si nous voulons détruire le pouvoir de la religion organisée."
 NGA_state_atheism:0 "Athéisme d'État"
 NGA_state_atheism_desc:0 "Faire respecter l'athéisme d'État est une nécessité dans ce pays étant donné le contrôle intense que les établissements religieux exercent sur le Nigeria"
 NGA_nationalize_cash_crops:0 "Nationaliser les cultures commerciales"
 NGA_nationalize_cash_crops_desc:0 "Avec la nationalisation des cultures d'État, nous supprimerons la principale source de profit aux propriétaires féodaux"
 NGA_socialist_lliteracy_campaigns:0 "Campagnes d'alphabétisation socialiste"
 NGA_socialist_lliteracy_campaigns_desc:0 "Les niveaux graves d'analphabétisme dans le pays nécessiteront sûrement une initiative drastique impliquant des milliers d'étudiants universitaires"
 NGA_achieve_class_conciousness:0 "Atteindre la conscience de classe"
 NGA_achieve_class_conciousness_desc:0 "Grâce à une compréhension dialectique de la réalité et à une vision du monde à travers une lentille marxiste, les tensions ethniques dans le pays peuvent être apaisées."
 NGA_five_year_plan:0 "Plan quinquennal"
 NGA_five_year_plan_desc:0 "En progressant vers une industrialisation indépendante, un nouveau plan de développement quinquennal peut être conçu"
 NGA_socialist_public_works_projects:0 "Projets de travaux publics socialistes"
 NGA_socialist_public_works_projects_desc:0 "Grâce aux projets de travaux publics planifiés par l'État, nous pouvons procéder à des révisions massives des infrastructures tout en utilisant les compétences des travailleurs de notre pays"
 NGA_soviet_advised_military_overhaul:0 "Révision militaire conseillée par les Soviétiques"
 NGA_soviet_advised_military_overhaul_desc:0 "Avec l'aide de l'URSS, nous pouvons restructurer notre armée grâce à un vaste réaménagement de nos usines de fabrication d'armes."
 NGA_bulwark_against_imperialism:0 "Rempart contre l'impérialisme"
 NGA_bulwark_against_imperialism_desc:0 "Le Nigeria se tiendra debout, prêt à se défendre contre tous les actes de l'impérialisme"
 NGA_declare_the_democratic_peoples_republic_of_nigeria:0 "Déclarer la République populaire démocratique du Nigeria"
 NGA_declare_the_democratic_peoples_republic_of_nigeria_desc:0 "Le pays étant désormais sûr et sécurisé, nous pouvons mettre fin à la loi martiale et établir officiellement la République populaire démocratique du Nigeria"
 NGA_align_with_african_marxists:0 "Alignez-vous avec les marxistes africains"
 NGA_align_with_african_marxists_desc:0 "Dans notre intérêt de préserver le marxisme sur le continent africain, il sera dans notre intérêt de travailler en étroite collaboration avec d'autres nations marxistes-léninistes africaines"
 NGA_african_socialist_bloc:0 "Bloc Socialiste Africain"
 NGA_african_socialist_bloc_desc:0 "En concluant des accords de protection militaire mutuelle, nous nous rapprocherons de nos alliés africains"
 NGA_economic_ties_with_african_marxists:0 "Liens économiques avec les marxistes africains"
 NGA_economic_ties_with_african_marxists_desc:0 "Deuxièmement, en établissant des liens étroits avec nos compatriotes marxistes-léninistes africains, nous devrons associer nos économies aux investissements"
 NGA_full_moscow_alignment:0 "Alignement complet de Moscou"
 NGA_full_moscow_alignment_desc:0 "Nous ne nous éloignerons pas de la révolution ouvrière internationale dirigée depuis le pays de la révolution, à Moscou."
 NGA_become_a_comecon_observer:0 "Devenez observateur du Comecon"
 NGA_become_a_comecon_observer_desc:0 "Dans l'espoir de développer notre pays grâce à l'influence soviétique, nous présenterons une pétition pour devenir observateur du Comecon."
 NGA_join_the_warsaw_pact:0 "Rejoignez le Pacte de Varsovie"
 NGA_join_the_warsaw_pact_desc:0 "Notre force militaire a montré aux blocs de l'Est que nous devons être à leurs côtés dans le cadre du Pacte de Varsovie"
 NGA_transition_to_a_civilian_government:0 "Transition vers un gouvernement civil"
 NGA_transition_to_a_civilian_government_desc:0 "Auguiyi-Ironsi, après l'échec des contre-coups d'État du Nord, est suffisamment confiant dans la sécurité du pays et dans sa capacité à faire la transition vers la démocratie"
 NGA_the_hausaland_war:0 "La guerre du pays haoussa"
 NGA_the_hausaland_war_desc:0 "Les habitants du nord du pays ont montré leur incapacité à fonctionner dans un cadre raisonnable et se battent désormais contre leurs compatriotes dans un État sécessionniste. Nous devons les vaincre."
 NGA_secure_french_support:0 "Support français sécurisé"
 NGA_secure_french_support_desc:0 "Compte tenu des investissements pétroliers réalisés par la France dans le sud-est du Nigeria, elle est très disposée à aider notre gouvernement."
 NGA_import_french_light_artillery:0 "Importer de l'artillerie légère française"
 NGA_import_french_light_artillery_desc:0 "Grâce aux relations diplomatiques avec la République française, nous pouvons recevoir une cargaison d'artillerie légère."
 NGA_begin_the_embargo:0 "Commencer l'embargo"
 NGA_begin_the_embargo_desc:0 "Pour forcer l'État sécessionniste haoussa à se soumettre, nous lancerons un embargo total sur la nation et empêcherons tout accès à la nation que nous pouvons"
 NGA_emergency_nigerian_militarization:0 "Militarisation d'urgence au Nigeria"
 NGA_emergency_nigerian_militarization_desc:0 "Dans un ultime effort, nous pouvons rapidement militariser de larges pans du pays"
 NGA_flood_northern_regions:0 "Inonder les régions du Nord"
 NGA_flood_northern_regions_desc:0 "La zone située au sud du pays haoussa est particulièrement exposée aux inondations et aux destructions si les préparatifs appropriés sont faits."
 NGA_import_french_small_arms:0 "Importer des armes légères françaises"
 NGA_import_french_small_arms_desc:0 "Les relations avec la France étant aussi bonnes qu'elles le sont grâce à leurs investissements dans notre pays, nous pouvons facilement obtenir de leur part une livraison d'armes de taille moyenne."
 NGA_import_french_anti_air:0 "Importer des avions anti-aériens français"
 NGA_import_french_anti_air_desc:0 "L'importation d'avions anti-aériens français jouera un rôle déterminant dans notre défaite du pays haoussa."
 NGA_french_advisors:0 "Conseillers français"
 NGA_french_advisors_desc:0 "Notre armée a désespérément besoin de se restructurer et doit être réévaluée, les forces armées françaises sont disponibles."
 NGA_continue_army_expansion:0 "Poursuivre l'expansion de l'armée"
 NGA_continue_army_expansion_desc:0 "La croissance générale de notre armée est l'un des facteurs les plus importants que nous pouvons facilement changer, et nous le devons sûrement."
 NGA_train_nigerian_specialist_divisions:0 "Former des divisions spécialisées nigérianes"
 NGA_train_nigerian_specialist_divisions_desc:0 "La formation de divisions spécialisées sera un excellent moyen d'accélérer la capture de villes isolées du désert"
 NGA_rebuild_the_north:0 "Reconstruire le Nord"
 NGA_rebuild_the_north_desc:0 "Il est de notre devoir de reconstruire et de réintégrer le pays haoussa"

 NGA_subsidize_nigerian_transportation_infrastructure:0 "Subventionner les transports nigérians"
 NGA_subsidize_nigerian_transportation_infrastructure_desc:0 "Plutôt que de nationaliser l'infrastructure de transport du Nigeria, de nombreux conseillers économiques préconisent de permettre au marché libre de gérer les réseaux plus efficacement et d'encourager cela par des subventions gouvernementales"
 NGA_yakubu_gowon_takes_the_reigns:0 "Yakubu Gowon prend les rênes"
 NGA_yakubu_gowon_takes_the_reigns_desc:0 "La junte militaire dirigée par Murtala Muhammad a choisi de faire de Yakubu Gowon le chef de l'État car son origine en tant que minorité ethnique et chrétienne protégera le nouveau gouvernement des allégations de parti pris nordiste, tout en assurant simultanément une telle domination car lui-même est toujours un nordiste."
 NGA_create_new_state_subdivisions:0 "Créer de nouvelles subdivisions d'État"
 NGA_create_new_state_subdivisions_desc:0 "Afin de contrôler l'influence du gouvernement dans le Sud-Est, Gowon annonce la division des 3 régions nigérianes en 12 États : l'État du Nord-Ouest, l'État du Nord-Est, l'État de Kano, l'État du Centre-Nord, l'État de Benue-Plateau, l'État de Kwara, l'État de l'Ouest, l'État de Lagos, l'État du Mid-Ouest et, pour la région orientale d'Ojukwu, un État de Rivers, un État du Sud-Est et un État du Centre-Est."
 NGA_tolerate_unions:0 "Tolérer les syndicats"
 NGA_tolerate_unions_desc:0 "Les syndicats jouent un rôle majeur au Nigeria, notamment à Lagos, depuis plusieurs décennies. Si certaines ont été gênantes sous la direction de Tunji Otegbeye, elles nuisent en général peu aux intérêts du gouvernement nigérian. Les tolérer est clairement la solution pratique pour y faire face."
 NGA_address_the_anti_igbo_pogroms:0 "Lutter contre les pogroms anti-Igbo"
 NGA_address_the_anti_igbo_pogroms_desc:0 "Depuis le coup d'État des Cinq Majeurs et le contre-coup d'État d'Aguiyi-Ironsi, la représentation igbo largement répandue dans la partie nord du pays s'est manifestée par des complots visant à prendre le contrôle de la nation. Ce préjugé a abouti au meurtre massif des communautés de migrants Igbo dans le nord du pays, ce qui ne peut pas continuer si nous souhaitons une quelconque forme de réconciliation avec le Sud-Est."
 NGA_minor_land_reform:0 "Réforme agraire mineure"
 NGA_minor_land_reform_desc:0 "Tandis qu'une réforme agraire à grande échelle dans le Nord aliénerait nos partisans aristocratiques, le pouvoir de la stratocratie nous permettra de mettre en oeuvre d'importantes acquisitions de terres et d'avoir un impact substantiel sur la vie de la population."
 NGA_develop_a_national_sewage_network:0 "Développer un réseau national d'égouts"
 NGA_develop_a_national_sewage_network_desc:0 "Bien qu'il existe un réseau d'égouts nominal à Lagos et dans quelques autres grandes villes, il est impératif que nous créions un réseau national pour résoudre pleinement les problèmes d'assainissement auxquels le pays est confronté."
 NGA_found_the_federal_republic_of_nigeria:0 "Fondé la République fédérale du Nigéria"
 NGA_found_the_federal_republic_of_nigeria_desc:0 "Dans l'attente sans fin du Nord et du Sud du Nigeria d'une plus grande autonomie, il semble que pour lutter contre le séparatisme du Sud, la meilleure solution globale soit la création d'un État fédéral au Nigeria où une grande partie du pouvoir sera confiée aux gouverneurs régionaux."
