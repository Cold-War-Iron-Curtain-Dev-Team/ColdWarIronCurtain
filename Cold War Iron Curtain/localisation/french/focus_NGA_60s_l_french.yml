#misc
 nga.60.tt.1:0 "Gagnera §G+30 milliards de dollars§!"
 nga.60.tt.2:0 "La §YFédération nigériane§! sera connue sous le nom de §YRépublique du Nigeria§!"
 nga.60.tt.3:0 "§YObafemi Awolowo§! sera arrêté et le groupe d'action §Y§! cessera d'être le principal parti §Gsocial-démocrate§!"
 nga.60.tt.4:0 "La crise occidentale §R§! prendra fin §G§!"
 nga.60.tt.5:0 "§YLa question sera réexaminée lorsque la guerre civile nigériane sera imminente.§!"
 NGA.60.tt.6:0 "§YCe focus sera automatiquement complété ultérieurement par un événement"
 NGA.60.tt.7:0 "§YNous allons créer deux divisions blindées§!"
 NGA.60.tt.8:0 "§YNous gagnerons plusieurs frégates hollandaises§!"
 nga.60.tt.9:0 "§YNous aurons un destroyer hollandais§!"
 NGA.60.tt.10:0 "§RLes habitants du Nord les plus haut placés de notre gouvernement seront tués§!"
 NGA.60.tt.11:0 "Ahmadu Bello est décédé"
 NGA.60.tt.12:0 "Décès de Samuel Akintola"
 NGA.60.tt.13:0 "§RLe coup d'État des Cinq Majeurs réussit§!"
 NGA.60.tt.14:0 "Abubakar Tafawa Balewa est décédé"
 NGA.60.tt.15:0 "§RLa faction armée de Johnson Aguiyi-Ironsi va négocier avec Patrick Chukwuma Nzeogwu§!"
 NGA.60.tt.16:0 "§YAvec l'adoption du décret n° 34, la structure fédérale sera abolie§!"
 NGA.60.tt.17:0 "§YLe Parlement sera dissous§!"
 NGA.60.tt.18:0 "§YLes prisonniers nordistes seront libérés§!"
 NGA.60.tt.19:0 "§YLes prisonniers nordistes resteront en prison§!"
 NGA.60.tt.20:0 "Nous allons traire l'ouest de §G+10 millions§!"
 NGA.60.tt.21:0 "§RL'ONU et les pays voisins soutiendront probablement le Cameroun, mais les États-Unis et le Royaume-Uni nous soutiendront malgré tout.§!"
 NGA.60.tt.22:0 "La §YArmée de libération nigériane§! sera connue sous le nom de §YRépublique populaire démocratique du Nigéria.§!"
 NGA.60.tt.23:0 "§YToutes les nations marxistes-léninistes africaines se garantiront mutuellement§!"
 NGA.60.tt.24:0 "La §YRépublique populaire démocratique du Nigeria§! rejoint le §YPacte de Varsovie§!"
 NGA.60.tt.25:0 "Grâce à une diplomatie astucieuse, nous nous assurerons §G25 millions§! de financement du développement"
 NGA.60.tt.26:0 "§RLa France soutiendra militairement le Mali, tout comme nos ennemis l'Afrique du Sud, la Rhodésie et Israël.§!"
 NGA.60.tt.27:0 "§YLe protestantisme§! passera à §Y30 %§! dans les États du sud-est"
 NGA.60.tt.28:0 "§YNous hériterons de l'état-major du Libéria§!"
 NGA.60.tt.29:0 "§GDébloque§! un mécanisme spécial §Y§! pour §Yamenant de nouvelles nations dans la fédération§!"
 NGA.60.tt.30:0 "§YNous aurons un état-major militaire plus centré sur les Igbo§!"
 NGA.60.tt.31:0 "§YNous enrôlerons deux divisions du delta du Niger§!"
 NGA.60.tt.32:0 "§YNous allons enrôler deux divisions de la Middlebelt§!"
 NGA.60.tt.33:0 "§CLes commandos d'élite des forces spéciales des marines de Benjamin 'Black Scorpion' Adekunle§Y infiltreront le port de Calabar§!"
 NGA.60.tt.34:0 "Nous gagnerons §G500 millions de dollars§!"
 NGA.60.tt.35:0 "§YUn congrès sera formé sur la planification d'une Fédération ouest-africaine§!"
 NGA.60.tt.36:0 "Notre nation s'appellera la §YFédération ouest-africaine§! lors de sa formation"
 NGA.60.tt.37:0 "Notre nation s'appellera la §YRépublique fédérale d'Afrique de l'Ouest§! lors de sa formation"
 NGA.60.tt.38:0 "Notre nation s'appellera la §YRépublique fédérale démocratique d'Afrique de l'Ouest§! lors de sa formation"
 NGA.60.tt.39:0 "§YKwame Nkrumah§! sera le leader de la fédération lors de sa formation"
 NGA.60.tt.40:0 "§BAttention : bien que Biafra ait reçu des correctifs et quelques ajouts de nouveau contenu ainsi que quelques retouches mineures, son arbre de focus et son contenu ne proviennent pas de Nigeria Rework mais plutôt d'une ancienne mise à jour de 2018.§!"
 NGA.60.tt.41:0 "§GCela nous rapprochera de leur intégration dans la Fédération.§!"
 NGA.60.tt.42:0 "§YCette orientation supprimera l'ancienne constitution coloniale§!"
 NGA.60.tt.43:0 "Nous saisirons §G100 $§! Million"
