 west_african_federation_0:0 "La Fédération Ouest Africaine"
 west_african_federation_0_desc:0 "Alors qu'au départ plusieurs pays se sont volontairement joints pour créer la Fédération ouest-africaine, de nombreux autres pays pourraient nous rejoindre dans notre destin panafricaniste. Grâce à la diplomatie, au lobbying, aux investissements et à la pression militaire, nous pouvons intégrer le reste de l'Afrique de l'Ouest dans notre nation."
