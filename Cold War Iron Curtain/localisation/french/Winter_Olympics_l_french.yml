l_french:
winterolympics.1.d: "Les VIes Jeux Olympiques d'hiver se sont déroulés à Oslo, en Norvège, la semaine dernière, alors que 30 pays ont présenté leurs meilleurs athlètes. La Norvège avait espéré organiser les Vèmes Jeux olympiques d'hiver de 1948, mais en raison de la Seconde Guerre mondiale, le CIO a suspendu toute nouvelle édition des Jeux olympiques. Après la fin de la Seconde Guerre mondiale, le CIO a décidé de confier les Vèmes Jeux d'hiver de 1948 à Saint-Moritz, en Suisse, et de laisser Oslo, en Norvège, accueillir les VIes Jeux d'hiver de 1952. La Norvège a remporté la première place avec 15 médailles, tandis que les États-Unis ont terminé deuxième avec 11 médailles. La Finlande arrive 3ème avec 9 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Cortina, en Italie, en 1956."
winterolympics.2.d: "Les VIIes Jeux Olympiques d'hiver ont eu lieu à Cortina, en Italie, alors que des athlètes du monde entier venaient participer aux Jeux olympiques. Cortina a été initialement choisie pour accueillir les Vèmes Jeux Olympiques d'hiver de 1944, mais a été annulée en 1941 en raison de la Seconde Guerre mondiale. Les Ve Jeux Olympiques d'hiver auraient ensuite lieu à Saint-Moritz, en Suisse, lors des Ve Jeux Olympiques d'hiver de 1948. L'Italie est nouvelle sur la scène olympique puisqu'il s'agit de sa première organisation olympique. Il s'agissait également du premier événement olympique multinational auquel les gens pouvaient assister, de l'Allemagne à l'URSS. L'URSS est arrivée première avec 16 médailles, l'Autriche deuxième avec 11 médailles et la Finlande avec 7 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Squaw Valley, aux États-Unis."
winterolympics.3.d: "Les VIIes Jeux Olympiques d'hiver sont arrivés à Squaw Valley, aux États-Unis, alors que de nombreux participants sont arrivés dans la petite ville de Californie. Plus de 800 millions de dollars ont été consacrés à l'agrandissement de Squaw Valley. Les États-Unis ont accueilli trois Jeux olympiques passés : les Jeux de la IIIe Olympiade de 1904 à Saint-Louis, les IIIes Jeux olympiques d'hiver de 1932 à Lake Placid et les Jeux de la Xe Olympiade de 1932 à Los Angeles. Les Jeux olympiques ont été télédiffusés dans le monde entier et ont pu être entendus ou vus par n'importe qui pour la première fois. Les Jeux de la XIe Olympiade de 1936 furent les premiers Jeux olympiques télévisés, mais uniquement en Allemagne et dans d'autres régions d'Europe. Les Jeux de la XIVe Olympiade de 1948 ont également été télédiffusés, mais uniquement en Angleterre et dans de petites parties de l'Europe occidentale. L'Allemagne concourrait également pour la première fois au sein d'une équipe unifiée. L'URSS a de nouveau gagné la première place avec 21 médailles, l'équipe unie d'Allemagne est arrivée deuxième avec 8 médailles et les États-Unis troisième avec 10 médailles. Les prochains Jeux d'hiver auront lieu à Innsbruck, en Autriche, en 1964."
winterolympics.4.d: "Les IXes Jeux Olympiques d'hiver ont eu lieu pour la première fois en Autriche à Innsbruck. De nombreuses installations ont été construites pour préparer les athlètes aux Jeux olympiques. Cependant, il n'y avait pas autant de neige que prévu et l'armée autrichienne avait donc découpé 20 000 blocs de glace dans une montagne. Ils le transportaient ensuite jusqu'aux cours de ski alpin. L'URSS a remporté la première place lors de trois Jeux olympiques d'hiver consécutifs avec 25 médailles. La Norvège est arrivée 2e avec 15 médailles et l'Autriche 3e avec 12 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Grenoble, en France, en 1968."
winterolympics.5.d: "Les Xes Jeux Olympiques ont eu lieu à Grenoble, en France, la semaine dernière. C'était la première fois que l'Allemagne de l'Ouest et l'Allemagne de l'Est participaient séparément aux Jeux olympiques. C'était aussi la première fois qu'une mascotte était choisie pour les Jeux olympiques. Schuss est la mascotte de cette mascotte. Les Xes Jeux Olympiques d'hiver de 1968 sont la troisième organisation olympique en France. La France a accueilli les derniers Jeux Olympiques d'hiver de 1924 à Chamonix et les Jeux de la VIIIe Olympiade de 1924 à Paris. La Norvège est revenue à Oslo avec 14 médailles, battant l'URSS d'une seule médaille. L'URSS termine 2ème avec 13 médailles et la France 3ème avec 9 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Sapporo, au Japon, en 1972."
winterolympics.6.d: "Les XIes Jeux Olympiques d'hiver se sont déroulés à Sapporo, au Japon, la semaine dernière. C'est la première fois qu'un jeu d'hiver a lieu en dehors de l'Europe et de l'Amérique du Nord. Les Jeux Olympiques d'hiver de 1940 V devaient initialement avoir lieu à Sapporo, mais en raison du déclenchement de la Seconde Guerre sino-japonaise en 1937, les Jeux Olympiques d'hiver de 1940 devaient alors avoir lieu à Saint-Moritz, en Suisse. Cette décision a suscité davantage de controverses, ce qui a amené le CIO à déplacer les Jeux à Garmisch-Partenkirchen, en Allemagne, mais en 1939, les Jeux d'hiver de 1940 ont été annulés après le déclenchement de la Seconde Guerre mondiale. Après plus de 30 ans, les Jeux d'hiver reviennent enfin à Sapporo, au Japon. L'URSS est arrivée première avec 16 médailles, l'Allemagne de l'Est est arrivée deuxième avec 14 médailles et la Suisse avec 10 médailles a la troisième place. Les prochains Jeux d'hiver auront lieu à nouveau à Innsbruck, en Autriche, en 1976."
winterolympics.7.d: "Les Jeux d'hiver sont revenus cette semaine à Innsbruck, en Autriche, après que Denver a retiré son organisation des XIIes Jeux Olympiques d'hiver en 1972. Galina Kulakova, de l'Union soviétique, a terminé 3e dans l'épreuve de ski féminine de 5 km, mais a été disqualifiée pour avoir pris un spray nasal contenant de l'éphédrine, une substance interdite. La FIS et le CIO lui ont permis de concourir au 10 km et au relais 4 × 5 km. Il s'agissait de la première médaille privée aux Jeux olympiques d'hiver de l'histoire olympique. L'URSS arrive en première position avec 27 médailles, l'Allemagne de l'Est en deuxième position avec 19 et les États-Unis en troisième position avec 10 médailles. Cependant, c'était la première fois qu'un athlète se voyait retirer sa médaille après avoir découvert que Galina Kulakova, de l'URSS, avait été surprise en train de tricher en utilisant une substance interdite provenant d'un spray nasal. Les prochains Jeux d'hiver auront lieu à Lake Placid, aux États-Unis, en 1980."
winterolympics.8.d: "Les XIIes Jeux Olympiques d'hiver se sont déroulés à Lake Placid, New York pour la deuxième fois après les IIIes Jeux Olympiques d'hiver de 1932. On ne s'attendait pas à ce que l'équipe masculine américaine de hockey sur glace dépasse le stade du jeu de groupe, mais elle a continué à gagner contre l'URSS et a remporté la médaille d'or. Les gens l'appellent déjà le Miracle sur Glace. Cette victoire a conquis le coeur des Américains à une époque de tensions liées à la guerre froide, même si c'est la victoire contre la Finlande qui a assuré la médaille d'or. L'URSS est arrivée à la première place après avoir remporté 22 médailles, l'Allemagne de l'Est à la deuxième place avec 21 médailles et les États-Unis avec 12 médailles. Les prochains Jeux d'hiver auront lieu à Sarajevo, en Yougoslavie, en 1984."
winterolympics.9.d: "Les XIVes Jeux Olympiques d'hiver se sont déroulés à Sarajevo, en Yougoslavie, la semaine dernière. C'était la première fois que les Jeux Olympiques d'hiver étaient organisés dans un État socialiste. Les Yougoslaves ont remporté leur toute première médaille avec une médaille d'argent en slalom géant. Plus de 49 nations y ont participé, ce qui en fait un nouveau record olympique. La République populaire de Chine a mis fin à son boycott des Jeux Olympiques en raison de la controverse concernant la reconnaissance de la République de Chine par le CIO. La République de Chine est entrée sous le nom de Taipei chinois. Les Allemands de l'Est arrivent en première place avec 25 médailles, l'URSS en deuxième position avec 24 médailles et les États-Unis en troisième position avec 8 médailles. Les prochains Jeux d'hiver auront lieu à Calgary, au Canada, en 1988."
winterolympics.10.d: "Les XVes Jeux Olympiques se sont déroulés à Calgary, au Canada, au cours des deux dernières semaines. Des centaines d'athlètes se sont rendus dans l'un des endroits les plus froids de la planète, avec des températures atteignant à un moment donné 23 degrés Fahrenheit (-5 degrés Celsius). Les Jamaïcains ont également participé pour la première fois au bobsleigh 2 hommes, mais ont perdu après une chute dans le pipe. Le saut à ski britannique Eddie \"The Eagle\" Edwards connaîtra un échec héroïque en se classant dernier dans toutes les épreuves auxquelles il participait. L'URSS est arrivée première avec 29 médailles, l'Allemagne de l'Est avec 25 médailles et la Suisse troisième avec 15 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Albertville, en France, en 1992."
winterolympics.11.d: "Les XVIes Jeux Olympiques d'hiver se sont déroulés à Albertville, en France, la semaine dernière. Les XVIes Jeux Olympiques d'hiver de 1992 sont les quatrièmes Jeux Olympiques organisés par la France. La France a accueilli les derniers Jeux Olympiques d'hiver de 1924 à Chamonix, les Jeux de la VIIIe Olympiade de 1924 à Paris et les Xes Jeux Olympiques d'hiver de 1968 à Grenoble. Ce sera la dernière fois que les Jeux olympiques d'hiver et d'été auront lieu la même année. La Norvège a terminé en remportant toutes les épreuves de ski de fond. Les Allemands sont arrivés premiers avec 26 médailles, l'équipe unifiée a remporté la deuxième place avec 23 médailles et la Norvège 3ème avec 20 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Lillehammer, en Norvège, en 1994."
winterolympics.12.d: "Les XVIIes Jeux Olympiques d'hiver se sont déroulés à Lillehammer, en Norvège, ces deux dernières semaines. C'est la ville la plus septentrionale de l'histoire à avoir accueilli les Jeux olympiques d'hiver. La Norvège a déjà accueilli les VIes Jeux Olympiques d'hiver de 1952. Il s'agit également des premiers Jeux olympiques organisés dans une année différente des Jeux olympiques d'été. La Norvège a obtenu le plus de médailles et a remporté la 1ère place avec 26 médailles. Les Allemands ont remporté 24 médailles et ont obtenu la 2ème place, et les Russes sont arrivés 3ème avec 23 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Nagano, au Japon, en 1998."
winterolympics.13.d: "Les XVIIes Jeux Olympiques d'hiver se sont déroulés à Nagano, au Japon, ces deux dernières semaines. Il s'agit de la ville la plus méridionale à avoir accueilli les Jeux olympiques d'hiver, comparée à Squaw Valley, en Californie, en 1960. Il s'agit des troisièmes Jeux olympiques du Japon organisés après les Jeux olympiques d'été de 1964 à Tokyo et les Jeux olympiques d'hiver de 1972 à Sapporo. Les Allemands sont arrivés premiers avec 29 médailles, la Norvège en deuxième position avec 25 médailles et les Russes en troisième position avec 18 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Salt Lake City, aux États-Unis, en 2002."
winterolympics.14.d: "Les XIXèmes Jeux Olympiques d'hiver ont eu lieu à Salt Lake City la semaine dernière, alors que des athlètes du monde entier sont venus montrer leurs capacités. Ces Jeux Olympiques d'hiver ont suscité une certaine controverse car il a été découvert que plusieurs membres du CIO avaient été soudoyés pour organiser les jeux à Salt Lake City. Les États-Unis ont accueilli quatre Jeux olympiques dans le passé : les Jeux de la IIIe Olympiade de 1904 à Saint-Louis, les IIIes Jeux olympiques d'hiver de 1932 à Lake Placid, les Jeux de la Xe Olympiade de 1932 à Los Angeles, les Jeux de la XXIIIe Olympiade de 1984 à Los Angeles et enfin les Jeux de la XXVIe Olympiade de 1996 à Atlanta. L'Allemagne est arrivée première avec 36 médailles, les États-Unis ont remporté 34 médailles à la deuxième place. La Norvège est arrivée 3ème avec 25 médailles. Les prochains Jeux Olympiques d'hiver auront lieu à Turin, en Italie, en 2006."
winterolympics.15.d: "Les XXes Jeux Olympiques d'hiver ont eu lieu pour la deuxième fois en Italie et les athlètes se sont rendus à Turin pour remporter des médailles. L'Italie a accueilli les VIIes Jeux d'hiver de 1956 à Cortina et les Jeux de la XVIIe Olympiade de 1960 à Rome. Ces Jeux d'hiver ont connu une faible fréquentation et plusieurs cas de dopage, de l'équipe autrichienne à l'équipe russe et brésilienne. L'Allemagne a remporté 29 médailles et a gagné la 1ère place, les États-Unis sont arrivés 2ème avec 25 médailles et l'Autriche 3ème avec 23 médailles. Cependant, les Autrichiens pourraient se voir retirer 1 ou 2 médailles en raison d'allégations de dopage. Les prochains Jeux d'hiver auront lieu à Vancouver, au Canada, en 2010."
winterolympics.16.d: "Les XXIes Jeux Olympiques d'hiver se sont déroulés à Vancouver, au Canada, ces dernières semaines. Il s'agit des troisièmes Jeux olympiques organisés par le Canada après les Jeux de la XXIe Olympiade de 1976 à Montréal et les XVes Jeux olympiques d'hiver de 1988 à Calgary. Il y a eu plusieurs problèmes avec ces Jeux d'hiver, allant de la diminution de la neige au vandalisme du matériel et aux manifestations provoquant plus de sécurité. Les États-Unis ont obtenu la première place avec 37 médailles. L'Allemagne et le Canada ont terminé 2e et 3e, l'Allemagne obtenant 30 et le Canada 26. Les prochains Jeux d'hiver auront lieu à Sotchi, en Russie, en 2014."
winterolympics.17.d: "Les XXIIes Jeux Olympiques d'hiver se sont déroulés à Sotchi, en Russie, ces deux dernières semaines. La Russie a accueilli les derniers Jeux de la XXIIe Olympiade de 1980 à Moscou. Ces Jeux d'hiver ont été les plus coûteux de l'histoire puisque 51 milliards de dollars ont été dépensés à Sotchi. Il a également été rapporté que certains athlètes russes se trouvaient dans des cercles de dopage et le CIO a déclaré que cela affecterait leur rôle aux Jeux d'hiver de 2018. La Russie, avec l'avantage d'être à domicile, a remporté la 1ère place avec 29 médailles, la Norvège la 2ème avec 26 médailles et le Canada la 3ème avec 25 médailles. Les prochains Jeux olympiques d'hiver auront lieu à PyeongChang, en République de Corée."
winterolympics.18.d: "Les XXIIIes Jeux Olympiques d'hiver se sont déroulés à PyeongChang, en République de Corée, ces deux dernières semaines. Il s'agit de la deuxième organisation olympique de la République de Corée puisqu'elle a accueilli les Jeux de la XXIVe Olympiade de 1988 à Séoul. Le CIO a forcé la Russie à ne pas participer sous le nom de sa nation et a proposé aux athlètes russes de participer sous la bannière des athlètes olympiques de Russie (OAR). La Norvège est arrivée première avec 39 médailles, l'Allemagne deuxième avec 31 médailles et le Canada troisième avec 29 médailles. Il a été annoncé que les prochains Jeux d'hiver se tiendraient à Pékin, en République populaire de Chine, en 2022."