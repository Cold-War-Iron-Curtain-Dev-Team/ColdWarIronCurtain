l_french:
 FIN_90S_NATIONAL_CROSSROADS:0 "Le carrefour national de la Finlande"
 FIN_90S_NATIONAL_CROSSROADS_desc:0 "Soutien de la coalition : §Y[?FIN_90S_COALITION_SUPPORT|0]§!/100\nGravité de la dépression : §R[?FIN_90S_DEPRESSION_SEVERITY|0]§!/100\nAlignement : §Y[?FIN_90S_ALIGNMENT|0]§! (§REst§! à §COuest§!)\n\nSauvetage économique, compromis parlementaire et alignement sur l'étranger sont indissociables. Chaque choix majeur indique comment il déplace ces trois mesures."
 USA_90S_PRESIDENCY:0 "La présidence dans les années 1990"
 USA_90S_PRESIDENCY_desc:0 "Mandat public : §Y[?USA_90S_PUBLIC_MANDATE|0]§!/100\n\nLe mandat mesure la capacité de l'administration à faire bouger le Congrès, à survivre aux scandales et à respecter des engagements étrangers difficiles."
 USA_90S_SHADOW_WARS:0 "Les guerres de l'ombre des années 1990"
 USA_90S_SHADOW_WARS_desc:0 "Capacité antiterroriste : §G[?USA_CT_CAPACITY|0]§!/100\nPistes exploitables : §Y[?USA_CT_LEADS|0]§!/100\nPression du réseau hostile : §R[?USA_CT_NETWORK_PRESSURE|0]§!/100\n\nLes plombs se désintègrent et doivent être dépensés lors des investigations. La capacité améliore la collecte et les perturbations, tandis que les menaces ignorées augmentent la pression sur le réseau."

 FIN_1990_PATH:0 "La direction de la Finlande dans les années 1990"
 RULE_OPTION_FIN_1990_HISTORICAL:0 "Reprise parlementaire historique"
 RULE_OPTION_FIN_1990_HISTORICAL_DESC:0 "La Finlande suit la reprise d'Aho-to-Ahtisaari et de Lipponen, poursuivant l'intégration européenne lorsque l'ordre mondial le permet."
 RULE_OPTION_FIN_1990_SOVEREIGNTIST:0 "Neutralité souverainiste"
 RULE_OPTION_FIN_1990_SOVEREIGNTIST_DESC:0 "La Finlande protège le Markka, noue des liens avec les pays nordiques et modernise sa neutralité armée sans abandonner le gouvernement parlementaire."
 RULE_OPTION_FIN_1990_ATLANTIC:0 "Conservateur de l'Atlantique"
 RULE_OPTION_FIN_1990_ATLANTIC_DESC:0 "La Finlande accélère la réforme du marché, l'intégration européenne, l'interopérabilité et un débat conditionnel au sein de l'OTAN."
 RULE_OPTION_FIN_1990_COMMUNIST:0 "Restauration communiste"
 RULE_OPTION_FIN_1990_COMMUNIST_DESC:0 "La Finlande se tourne vers le socialisme constitutionnel démocratique ou vers la ligne dure de Sinisalo tout en s'adaptant au sort actuel de l'Union soviétique."
 RULE_OPTION_FIN_1990_VENNAMOIST:0 "Nationalisme Vennamoïste"
 RULE_OPTION_FIN_1990_VENNAMOIST_DESC:0 "Le populisme rural et le protectionnisme défient l'establishment parlementaire, avec des conséquences démocratiques et autoritaires."
 USA_1992_ELECTION:0 "Élection américaine de 1992"
 RULE_OPTION_USA_1992_HISTORICAL:0 "Historique : Bill Clinton"
 RULE_OPTION_USA_1992_HISTORICAL_DESC:0 "Le processus primaire normal fonctionne et l'IA historique favorise fortement Bill Clinton."
 RULE_OPTION_USA_1992_JACKSON:0 "Jesse Jackson"
 RULE_OPTION_USA_1992_JACKSON_DESC:0 "Forcer Jesse Jackson à devenir le candidat démocrate et à remporter les élections de 1992 par le biais du processus électoral normal."
 RULE_OPTION_USA_1992_GORE:0 "Al Gore"
 RULE_OPTION_USA_1992_GORE_DESC:0 "Forcer Al Gore à devenir le candidat démocrate et à remporter les élections de 1992 par le biais du processus électoral normal."
 RULE_OPTION_USA_1992_DUKAKIS:0 "Michael Dukakis"
 RULE_OPTION_USA_1992_DUKAKIS_DESC:0 "Forcer Michael Dukakis à devenir le candidat démocrate et à remporter les élections de 1992 par le biais du processus électoral normal."
 RULE_OPTION_USA_1992_CLINTON:0 "Bill Clinton"
 RULE_OPTION_USA_1992_CLINTON_DESC:0 "Forcer Bill Clinton à devenir le candidat démocrate et à remporter les élections de 1992 par le biais du processus électoral normal."
 RULE_OPTION_USA_1992_BUSH:0 "George H.W. Bush"
 RULE_OPTION_USA_1992_BUSH_DESC:0 "Forcer le président Bush à être réélu et à imposer un nouveau programme pour son deuxième mandat."
 RULE_OPTION_USA_1992_ROBERTSON:0 "Pat Robertson"
 RULE_OPTION_USA_1992_ROBERTSON_DESC:0 "Forcer Pat Robertson à devenir le candidat républicain et à remporter les élections de 1992."
 RULE_OPTION_USA_1992_DOLE:0 "Bob Dolé"
 RULE_OPTION_USA_1992_DOLE_DESC:0 "Forcez Bob Dole à devenir le candidat républicain et à remporter les élections de 1992."
 RULE_OPTION_USA_1992_DUKE:0 "David Duc"
 RULE_OPTION_USA_1992_DUKE_DESC:0 "Forcer David Duke à devenir le candidat républicain et à remporter les élections de 1992. Il s'agit d'une voie extrémiste et déstabilisante."
 USA_1996_ELECTION:0 "Élection américaine de 1996"
 RULE_OPTION_USA_1996_HISTORICAL:0 "Historique : Bill Clinton"
 RULE_OPTION_USA_1996_HISTORICAL_DESC:0 "Le processus primaire normal fonctionne et l'IA historique favorise fortement le président Clinton."
 RULE_OPTION_USA_1996_GORE:0 "Al Gore"
 RULE_OPTION_USA_1996_GORE_DESC:0 "Forcer Al Gore à remporter les élections de 1996 en suivant le processus normal de nomination et d'élection."
 RULE_OPTION_USA_1996_CLINTON:0 "Bill Clinton"
 RULE_OPTION_USA_1996_CLINTON_DESC:0 "Forcer Bill Clinton à remporter les élections de 1996 par le biais du processus normal de nomination et d'élection."
 RULE_OPTION_USA_1996_KENNEDY:0 "John F. Kennedy Jr."
 RULE_OPTION_USA_1996_KENNEDY_DESC:0 "Forcer John F. Kennedy Jr. À remporter les élections de 1996 par le biais du processus normal de nomination et d'élection."
 RULE_OPTION_USA_1996_LAROUCHE:0 "Lyndon LaRouche"
 RULE_OPTION_USA_1996_LAROUCHE_DESC:0 "Forcer Lyndon LaRouche à remporter les élections de 1996 par le biais du processus normal de nomination et d'élection."
 RULE_OPTION_USA_1996_DOLE:0 "Bob Dolé"
 RULE_OPTION_USA_1996_DOLE_DESC:0 "Forcer Bob Dole à remporter les élections de 1996 par le biais du processus normal de nomination et d'élection."
 RULE_OPTION_USA_1996_BUCHANAN:0 "Pat Buchanan"
 RULE_OPTION_USA_1996_BUCHANAN_DESC:0 "Forcer Pat Buchanan à remporter les élections de 1996 par le biais du processus normal de nomination et d'élection."

 FIN90.1.t:0 "La Finlande à la croisée des chemins"
 FIN90.1.d:0 "Les hypothèses qui ont guidé la Finlande pendant la guerre froide sont en train de s'effondrer. Un boom du crédit, un secteur bancaire débordé, un commerce oriental changeant et un électorat agité ont fait de la décennie à venir un test pour la république elle-même."
 FIN90.1.a:0 "Convoquer le gouvernement et les partis."
 FIN90.2.t:0 "Le bilan du commerce oriental"
 FIN90.2.d:0 "L'ancien système de compensation commerciale a disparu avec l'État soviétique. La perte est sévère, mais les faiblesses du crédit intérieur, de la monnaie et du secteur bancaire sont également à l'origine de la dépression."
 FIN90.2.d.exposed:0 "Notre dépendance inhabituellement profonde à l'égard du commerce de compensation soviétique a amplifié le choc extérieur. Il rencontre un système de crédit déjà fragile au pire moment possible."
 FIN90.2.d.continued:0 "L'Union soviétique survit, mais les relations commerciales de compensation ne peuvent rester inchangées. La Finlande doit négocier une dépendance moins dangereuse alors qu'une rivalité persistante entre superpuissances restreint toute alternative."
 FIN90.2.a:0 "Réorienter les exportations vers l'Europe."
 FIN90.2.b:0 "Préserver ce qui reste des contrats orientaux."
 FIN90.10.t:0 "Les élections législatives de 1991"
 FIN90.10.d:0 "La récession et la fin de l'ancien cadre de politique étrangère dominent la campagne. Aucun parti ne peut gouverner seul ; l'accord de coalition déterminera qui supportera le coût de la stabilisation."
 FIN90.10.a:0 "Esko Aho forme un gouvernement dirigé par le Centre."
 FIN90.10.b:0 "Poursuivre la large coopération de Holkeri."
 FIN90.10.c:0 "Rassemblez une coalition de gauche."
 FIN90.10.d_option:0 "Amenez les populistes ruraux au gouvernement."
 FIN90.15.t:0 "Le Cabinet perd sa majorité"
 FIN90.15.d:0 "Le soutien de la coalition est tombé à un niveau critique. Les ministres menacent de démissionner et leurs alliés parlementaires exigent un nouvel accord avant de soutenir une autre réforme."
 FIN90.15.a:0 "Négociez des concessions coûteuses."
 FIN90.15.b:0 "Reconstruisez le meuble."
 FIN90.20.t:0 "L'élection présidentielle de 1994"
 FIN90.20.d:0 "Pour la première fois, le président est élu au suffrage universel direct. Le pouvoir reste puissant, mais une constitution modifiée et un parlement plus affirmé façonneront le mandat du vainqueur."
 FIN90.20.a:0 "Martti Ahtisaari remporte la présidence."
 FIN90.20.b:0 "La restauration socialiste élève Sinisalo."
 FIN90.20.c:0 "Vennamo s'empare de la présidence."
 FIN90.30.t:0 "Les élections législatives de 1995"
 FIN90.30.d:0 "La reprise a commencé, mais ses gains sont inégaux. La prochaine coalition devra concilier l'assainissement budgétaire, l'emploi et la place de la Finlande en Europe."
 FIN90.30.a:0 "Paavo Lipponen rassemble la Rainbow Coalition."
 FIN90.30.b:0 "Une coalition neutre et nordique prend le pouvoir."
 FIN90.30.c:0 "La coalition socialiste renouvelle son mandat."
 FIN90.30.d_option:0 "Le gouvernement national consolide le pouvoir."
 FIN90.40.t:0 "Les élections parlementaires de 1999"
 FIN90.40.d:0 "La dépression a reculé, laissant place à un débat sur qui mérite le crédit et sur ce que devrait devenir la Finlande au cours du nouveau siècle."
 FIN90.40.a:0 "Renouveler une large coalition gouvernementale."
 FIN90.40.b:0 "Exigez une rupture politique plus nette."
 FIN90.50.t:0 "La transition présidentielle de 2000"
 FIN90.50.d:0 "La nouvelle constitution réduit l'autorité présidentielle alors que la Finlande élit sa première femme présidente. La transition clôt une décennie de transformation institutionnelle et stratégique."
 FIN90.50.a:0 "Tarja Halonen assume la présidence."
 FIN90.50.b:0 "Notre ordre alternatif achève son règlement constitutionnel."
 
 FIN90.60.t:0 "Assemblée 92 : le rassemblement de la scène"
 FIN90.60.d:0 "Alors que la Finlande est en proie à une grave crise bancaire et à l'effondrement du système de compensation soviétique, une culture numérique clandestine explose dans les gymnases des écoles de banlieue et dans les clubs de jeunes. En juillet 1992, plus de sept cents adolescents hackers, musiciens trackers et codeurs de démo de groupes underground légendaires, dont Complex, Rebels et Future Crew, se sont rassemblés à la salle de sport de Kauniainen pour l'Assemblée '92.\n\nArmés d'Amiga Commodore, de clones de PC, de moniteurs à rayons cathodiques et de sacs de couchage, ces jeunes autodidactes ont passé 72 heures sans sommeil à pousser le matériel informatique bien au-delà des limites d'usine avec des routines mathématiques hallucinantes et un langage d'assemblage de bas niveau. Alors que la génération plus âgée est désespérée par la montée du chômage, la jeunesse finlandaise construit tranquillement la sous-culture informatique populaire la plus sophistiquée au monde."
 FIN90.60.a:0 "Un passe-temps inoffensif, mais une remarquable démonstration du talent des jeunes."
 FIN90.60.b:0 "Fournir des subventions municipales aux jeunes pour les clubs informatiques et les équipements de réseau."
 FIN90.61.t:0 "Future Crew et « Deuxième réalité »"
 FIN90.61.d:0 "Lors de l'Assembly '93 à Hämeenlinna, le démogroupe finlandais Future Crew a créé ce qui est immédiatement reconnu comme un chef-d'oeuvre d'époque en matière d'infographie : « Second Reality ». Fonctionnant sur du matériel IBM PC 486 standard sans matériel d'accélérateur 3D, la démo a étonné le public du monde entier avec des paysages urbains polygonaux 3D en temps réel, des sphères tracées par rayons, des distorsions de plasma fluide et une bande-son de suivi emblématique à 16 canaux de Purple Motion et Skaven.\n\nDes copies de la démo sont furieusement téléchargées sur les noeuds BBS internationaux. Les programmeurs de la Silicon Valley à Tokyo expriment leur incrédulité quant au fait que des adolescents finlandais, à l'époque de la dépression, puissent extraire une telle magie mathématique des ordinateurs grand public. Le moral national gonfle alors que la presse technologique internationale s'émerveille devant l'ingéniosité numérique finlandaise."
 FIN90.61.a:0 "De la pure magie numérique ! L'ingénierie finlandaise fait tourner les têtes dans le monde entier."
 FIN90.62.t:0 "Des démonstrations à l'industrie : l'essor du remède"
 FIN90.62.d:0 "Les codeurs de démo et les pixel artistes du début des années 1990 arrivent à maturité et se transforment en entrepreneurs technologiques de pointe. En août 1995, les membres clés du Future Crew se sont regroupés dans un sous-sol de la banlieue d'Espoo pour créer Remedy Entertainment, pionnier du jeu narratif en 3D. Parallèlement, d'autres anciens élèves de Demoscene préparent le terrain pour Futuremark (les créateurs de la suite définitive d'analyse comparative des GPU 3DMark) et des studios comme Housemarque.\n\nAssocié à la révolution fulgurante des communications cellulaires de Nokia et à la recherche universitaire de premier plan, le vivier de talents demoscene a transformé la Finlande en une puissance mondiale inattendue en matière de graphisme 3D, de développement de jeux et d'optimisation de logiciels. Le code est en train de devenir le nouvel or vert de la Finlande."
 FIN90.62.a:0 "Favorisez la frontière numérique : le code est notre nouvelle foresterie."

 USA90.1.t:0 "Le bilan à mi-parcours"
 USA90.1.d:0 "Les électeurs ont rendu leur verdict sur le programme d'ouverture de l'administration. Le Congrès est moins maniable et chaque projet de loi majeur nécessitera désormais soit une confrontation, soit une coalition plus étroite."
 USA90.1.a:0 "Défendre le programme et mobiliser nos sympathisants."
 USA90.1.b:0 "Triangulez vers le centre."
 USA90.2.t:0 "La confrontation budgétaire"
 USA90.2.d:0 "L'exécutif et le Congrès ne parviennent pas à s'entendre sur le financement. Les agences se préparent à fermer leurs portes tandis que les deux parties se précipitent pour attribuer les responsabilités."
 USA90.2.a:0 "Refusez de céder."
 USA90.2.b:0 "Négociez un règlement temporaire."
 USA90.10.t:0 "Enquêtes et privilèges exécutifs"
 USA90.10.d:0 "Une enquête de plus en plus large a transformé la conduite privée et le secret exécutif en une lutte constitutionnelle. La coopération peut limiter les dégâts ; la confrontation peut rallier des partisans à un risque bien plus grand."
 USA90.10.d.clinton:0 "Les enquêtes sur le président Clinton menacent désormais de réduire à néant l'agenda du deuxième mandat. La Maison Blanche doit choisir entre la divulgation et une confrontation en impeachment."
 USA90.10.a:0 "Coopérer avec la surveillance du Congrès."
 USA90.10.b:0 "Combattez l'enquête."
 USA90.20.t:0 "Le boom numérique"
 USA90.20.d:0 "L'utilisation commerciale d'Internet, les investissements dans les télécommunications et les marchés technologiques transforment l'économie. Les décideurs politiques ne sont pas d'accord sur la question de savoir si une libéralisation rapide ou des garanties durables devraient définir le boom."
 USA90.20.a:0 "Laissons fonctionner l'économie numérique."
 USA90.20.b:0 "Préserver les garanties financières."
 USA90.30.t:0 "Une nouvelle administration vous attend"
 USA90.30.d.bush:0 "George W. Bush a remporté l'élection contestée. L'expansion s'arrête à l'investiture : les choix de son administration appartiennent à une autre époque."
 USA90.30.d.gore:0 "Al Gore a porté le programme démocrate vers un nouveau mandat. L'expansion se termine lors de l'inauguration, avant que la nouvelle administration ne fixe le cap pour l'après 2001."
 USA90.30.d.other:0 "Les élections ont donné naissance à un nouveau mandat, mais l'histoire se termine en janvier 2001. Les défis au-delà de ce stade appartiennent à une autre époque."
 USA90.30.a:0 "Fermez le livre sur les années 1990 américaines."

 USA90D.1.t:0 "Le bureau des Balkans"
 USA90D.1.d:0 "Sarajevo est assiégée et l'embargo sur les armes a bloqué la partie la plus faible. Le Département d'État veut une décision : frapper avec l'OTAN, ou maintenir la guerre à distance."
 USA90D.1.a:0 "Mettez-le à l'ordre du jour."
 USA90D.2.t:0 "Opération Force délibérée"
 USA90D.2.d:0 "Des avions de l'OTAN ont frappé les positions des Serbes de Bosnie autour de Sarajevo. Les bombardements visent à rassembler les parties autour d'une table et non à occuper le pays."
 USA90D.2.a:0 "Gardez la pression."
 USA90D.3.t:0 "Srebrenica"
 USA90D.3.d:0 "La zone de sécurité est tombée. La retenue a empêché les soldats américains de participer à la guerre et a également empêché Washington d'arrêter le massacre. Le public peut en évaluer le coût."
 USA90D.3.a:0 "Cette politique a échoué."
 USA90D.4.t:0 "Dayton"
 USA90D.4.d:0 "Les parties paraphent un règlement. Une force dirigée par l'OTAN séparera les armées et la Bosnie survivra comme un seul État sur le papier."
 USA90D.4.d.weak:0 "Le règlement arrive tard, après Srebrenica, et tout le monde dans la salle le sait. La carte est tracée, mais le mandat pour la faire respecter est mince."
 USA90D.4.a:0 "Parapher les accords."
 USA90D.10.t:0 "L'UNSCOM revient"
 USA90D.10.d:0 "Les inspecteurs reviennent en Irak avec pour mandat de découvrir ce qui reste des programmes d'armement. Leur durée dépend de la rigueur de l'embargo."
 USA90D.10.a:0 "Donnez-leur le brief."
 USA90D.11.t:0 "Opération Renard du Désert"
 USA90D.11.d:0 "Des avions américains et britanniques frappent des sites irakiens après l'expulsion des inspecteurs. L'opération punit Bagdad. Cela ne supprime pas le régime."
 USA90D.11.a:0 "Mettez fin aux grèves."
 USA90D.12.t:0 "Renard du désert"
 USA90D.12.d:0 "Des avions américains et britanniques ont frappé des sites militaires à travers le pays. Le régime est toujours en place et les inspecteurs sont partis."
 USA90D.12.a:0 "Nous nous en souviendrons."
 USA90D.20.t:0 "Le cadre convenu"
 USA90D.20.d:0 "Pyongyang a gelé ses réacteurs déclarés en échange de pétrole et d'une promesse de réacteurs à eau ordinaire. Washington peut payer, exiger davantage d'inspections ou planifier une grève."
 USA90D.20.a:0 "Choisissez un cours."
 USA90D.21.t:0 "Des doutes sur Yongbyon"
 USA90D.21.d:0 "Les renseignements suggèrent que le gel est incomplet. L'administration peut maintenir le marché et le silence, ou affronter Pyongyang et admettre que l'accord a été frauduleux."
 USA90D.21.a:0 "Gardez l'accord."
 USA90D.21.b:0 "Affrontez le tricheur."
 USA90D.22.t:0 "Le blocage des pourparlers"
 USA90D.22.d:0 "Pyongyang rejette les exigences plus strictes en matière d'inspection. Le Cadre convenu ne bouge pas, pas plus qu'un règlement."
 USA90D.22.a:0 "Laissez-le là."
 USA90D.23.t:0 "Les alliés refusent"
 USA90D.23.d:0 "Séoul et Tokyo ne soutiendront pas une frappe sur Yongbyon. Le plan reste dans le tiroir et l'administration paie pour l'avoir brandi."
 USA90D.23.a:0 "Rangez le plan."

 USA_CT90.1.t:0 "L'attentat à la bombe contre le World Trade Center en 1993"
 USA_CT90.1.d:0 "Une attaque sous le World Trade Center a révélé un milieu extrémiste transnational opérant aux États-Unis. Les enquêteurs disposent de preuves, mais les agences ne disposent toujours pas d'une vision commune."
 USA_CT90.1.a:0 "Créer une enquête fédérale conjointe."
 USA_CT90.1.b:0 "Gardez l'enquête étroitement compartimentée."
 USA_CT90.2.t:0 "L'enquête sur les monuments de New York"
 USA_CT90.2.d:0 "L'enquête sur l'attentat à la bombe pointe vers une conspiration plus large contre des sites importants de New York. Agir nécessite des pistes utilisables et une coopération entre les lignes institutionnelles."
 USA_CT90.2.a:0 "Utilisez les pistes pour briser le complot."
 USA_CT90.2.b:0 "L'avertissement arrive trop tard pour être exploitable."
 USA_CT90.10.t:0 "Ben Laden s'installe en Afghanistan"
 USA_CT90.10.d:0 "Un riche sponsor extrémiste a quitté le Soudan pour l'Afghanistan, où une autorité fragmentée offre une plus grande liberté. La communauté du renseignement prévient que le réseau devient de plus en plus ambitieux."
 USA_CT90.10.a:0 "Développez la poursuite secrète."
 USA_CT90.10.b:0 "Construisez le fichier analytique avant d'agir."
 USA_CT90.20.t:0 "Attentats à la bombe contre les ambassades d'Afrique de l'Est"
 USA_CT90.20.d:0 "Les attaques coordonnées contre les ambassades américaines en Afrique de l'Est ont tué des Américains et des citoyens locaux. Le réseau a démontré sa portée stratégique."
 USA_CT90.20.d.hardened:0 "Des attaques coordonnées frappent les ambassades d'Afrique de l'Est, mais un durcissement préalable limite les dégâts. Le réseau hostile a néanmoins démontré sa portée stratégique."
 USA_CT90.20.a:0 "Ordonner des frappes de représailles limitées."
 USA_CT90.20.b:0 "Élargissez la campagne de poursuite secrète et de liaison."
 USA_CT90.20.c:0 "Faites preuve de retenue."
 USA_CT90.30.t:0 "Les intrigues du millénaire"
 USA_CT90.30.d:0 "Une série d'avertissements suggère des attaques autour des célébrations du millénaire. Les agents des douanes, les partenaires étrangers et les agences fédérales ont besoin d'une vision opérationnelle commune avant que le calendrier ne change."
 USA_CT90.30.a:0 "Perturbez les intrigues avec les leads accumulés."
 USA_CT90.30.b:0 "Les fragments ne constituent jamais un avertissement complet."
 USA_CT90.40.t:0 "L'attaque de l'USS Cole"
 USA_CT90.40.d:0 "Une attaque a frappé l'USS Cole dans le port d'Aden. Cet incident renforce les avertissements selon lesquels un réseau transnational peut attaquer des cibles américaines loin de chez eux."
 USA_CT90.40.a:0 "Engagez-vous dans une enquête interinstitutionnelle complète."
 USA_CT90.40.b:0 "Traitez-le avant tout comme une attaque militaire."
 USA_CT90.50.t:0 "Le grand livre de la lutte contre le terrorisme, janvier 2001"
 USA_CT90.50.d.success:0 "L'investissement patient dans les enquêteurs, les analystes, les partenaires et les infrastructures sécurisées a perturbé de nombreux complots et réduit la liberté d'action hostile. Le danger demeure, mais le gouvernement aborde l'année 2001 avec un système d'alerte cohérent."
 USA_CT90.50.d.failure:0 "L'échec de la réponse de Bojinka et la poursuite des attaques révèlent de profonds liens entre la collecte, l'application de la loi et la politique. Le gouvernement aborde l'année 2001 en sachant que la menace réseau n'est pas résolue."
 USA_CT90.50.d.mixed:0 "La décennie a été marquée par des arrestations, des avertissements manqués, des liaisons réussies et des rivalités institutionnelles dans une mesure égale. Le gouvernement aborde l'année 2001 avec des capacités renforcées, mais sans victoire finale."
 USA_CT90.50.a:0 "Portez les leçons dans le nouveau siècle."

 BOJINKA.100.t:0 "Un incendie à Manille"
 BOJINKA.100.d:0 "Les enquêteurs philippins ont découvert des preuves d'un vaste complot aérien dans un appartement de Manille. Les officiers de liaison américains sont sollicités pour aider à identifier les suspects et à comprendre la menace."
 BOJINKA.100.a:0 "Envoyez immédiatement le dossier à Washington."
 BOJINKA.1.t:0 "Le dossier Bojinka"
 BOJINKA.1.d.phi:0 "Les autorités philippines ont partagé des preuves d'une campagne aérienne planifiée faisant de nombreuses victimes. L'avertissement stratégique est clair, mais les suspects, le financement et les liens avec l'étranger restent incertains."
 BOJINKA.1.d.fallback:0 "Un agent de liaison de la police d'Asie du Sud-Est a récupéré des preuves d'une campagne aérienne planifiée faisant de nombreuses victimes. La crise peut être résolue même s'il n'existe aucun gouvernement philippin à cette époque."
 BOJINKA.1.a:0 "Partagez chaque piste et formez une équipe de crise commune."
 BOJINKA.1.b:0 "Protéger les sources sensibles grâce au compartimentage."
 BOJINKA.1.c:0 "Renforcez immédiatement l'aviation civile."
 BOJINKA.2.t:0 "Évaluation de la menace Bojinka"
 BOJINKA.2.d:0 "Le bilan arrêté de l'équipe de crise est terminé. Son résultat reflète notre capacité accumulée, nos pistes non renouvelables, la confiance de nos partenaires, la sécurité aérienne, la pression du réseau et les choix faits dans cette crise."
 BOJINKA.2.a:0 "L'intrigue a été définitivement dévoilée."
 BOJINKA.2.b:0 "Seule une partie du réseau a été exposée."
 BOJINKA.2.c:0 "L'avertissement a échoué."
 BOJINKA.3.t:0 "Bojinka empêché"
 BOJINKA.3.d:0 "La coopération internationale en matière de police et de renseignement a déjoué le complot avant son exécution. L'enquête donne de nouvelles pistes et une carte plus claire du réseau transnational."
 BOJINKA.3.a:0 "Un succès discret reste un succès."
 BOJINKA.4.t:0 "Bojinka partiellement perturbé"
 BOJINKA.4.d:0 "Le danger immédiat a été limité, mais les suspects importants et les liens financiers restent hors de portée. Une poursuite internationale chronométrée commence maintenant."
 BOJINKA.4.a:0 "Maintenez la poursuite en vie."
 BOJINKA.5.t:0 "Catastrophe dans les airs"
 BOJINKA.5.d:0 "Une attaque coordonnée contre l'aviation civile a provoqué de nombreuses victimes et une profonde crise de confiance du public. Le gouvernement doit réagir sans supposer que la décennie a déjà prédéterminé une guerre ultérieure."
 BOJINKA.5.a:0 "Recherchez une autorité de surveillance d'urgence."
 BOJINKA.5.b:0 "Financer la sécurité et les enquêtes dans le cadre de la loi en vigueur."

 FIN90_national_crossroads:0 "Carrefour National"
 FIN90_national_crossroads_desc:0 "Cette orientation fait progresser la réponse de la Finlande à la dépression, aux politiques de coalition et à l'évolution de l'ordre européen. Ses effets mécaniques et les exigences d'itinéraire restent visibles avant la sélection."
