 USA90_FP97_iraq_and_inspections:0 "Politique mondiale : l'Irak et les inspections"
 USA90_FP97_iraq_and_inspections_desc:0 "Retournez au dossier de confinement. Desert Fox ou un régime d'inspection effondré ajoute un soutien de guerre et une expérience aérienne. Les inspections qui ont eu lieu ajoutent du pouvoir politique."
 USA90_FP97_north_korean_diplomacy:0 "Politique mondiale : la diplomatie nord-coréenne"
 USA90_FP97_north_korean_diplomacy_desc:0 "Récupérez le fichier Agreed Framework. Un accord qui tient ajoute du pouvoir politique. Une fraude avouée ou un plan de grève coûte §R4§! au mandat public et suscite un soutien à la guerre."
