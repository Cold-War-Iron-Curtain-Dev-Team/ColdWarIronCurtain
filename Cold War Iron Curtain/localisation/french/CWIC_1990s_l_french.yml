 USA90_FP93_state_department_desc:0 "Cette orientation fait progresser le programme national, étranger, de défense ou de renseignement de l'administration tout en respectant le président actuel et l'État mondial soviétique actuel."
 USA90_FP93_post_soviet_strategy:0 "Politique étrangère : stratégie post-soviétique"
 USA90_FP93_post_soviet_strategy_desc:0 "L'Union soviétique a disparu. Définir les relations avec la Russie et les nouvelles républiques sans supposer que la consolidation démocratique ou la sécurité nucléaire se produiront d'elles-mêmes."
 USA90_FP93_assist_russian_transition:0 "Politique étrangère : aider la transition russe"
 USA90_FP93_assist_russian_transition_desc:0 "Fournir une aide conditionnelle à la transition russe tout en acceptant le risque budgétaire et politique d'une implication américaine visible."
 USA90_FP93_contain_russian_revisionism:0 "Politique étrangère : contenir le révisionnisme russe"
 USA90_FP93_contain_russian_revisionism_desc:0 "Cette orientation fait progresser le programme national, étranger, de défense ou de renseignement de l'administration tout en respectant le président actuel et l'État mondial soviétique actuel."
 USA90_FP93_partnership_for_peace:0 "Politique étrangère : Partenariat pour la paix"
 USA90_FP93_partnership_for_peace_desc:0 "Créer un partenariat de sécurité intermédiaire pour l'ancien Pacte de Varsovie et les États neutres sans promettre une adhésion immédiate à l'alliance."
 USA90_FP93_secure_former_soviet_arsenals:0 "Politique étrangère : sécuriser les anciens arsenaux soviétiques"
 USA90_FP93_secure_former_soviet_arsenals_desc:0 "Financer des mesures de coopération pour consolider, sécuriser et réduire les arsenaux nucléaires hérités des anciennes républiques soviétiques."
 USA90_FP93_continued_bipolar_strategy:0 "Politique étrangère : poursuite de la stratégie bipolaire"
 USA90_FP93_continued_bipolar_strategy_desc:0 "L'URSS a survécu à la crise de l'ordre ancien. Reconstruire une stratégie de dissuasion, de contrôle des armements, de cohésion d'alliance et de concurrence sélective sans recourir aux hypothèses post-soviétiques."
