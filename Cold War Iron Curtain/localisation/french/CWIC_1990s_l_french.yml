 FIN90_end_of_old_order_desc:0 "Si l'Union soviétique est dissoute, le commerce de compensation s'effondre et la Finlande doit remplacer tout un marché. S'il survit, Helsinki négocie plutôt un retrait contrôlé d'une dépendance dangereuse sous une pression bipolaire continue."
