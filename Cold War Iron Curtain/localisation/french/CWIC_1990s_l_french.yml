 USA90_FP97_nato_enlargement:0 "Politique mondiale : élargissement de l'OTAN"
 USA90_FP97_nato_enlargement_desc:0 "Inviter des partenaires d'Europe centrale qualifiés au sein de l'OTAN après le Partenariat pour la paix. Cette orientation n'existe que dans l'État mondial post-soviétique."
 USA90_FP97_kosovo_crisis:0 "Politique mondiale : crise du Kosovo"
 USA90_FP97_kosovo_crisis_desc:0 "La prochaine guerre des Balkans. Un accord de Dayton ajoute §G3§! au mandat public. Une Bosnie gelée coûte §R4§! au mandat public et augmente le soutien à la guerre."
 USA90_FP97_manage_yeltsin_russia:0 "Politique mondiale : gérer la Russie d'Eltsine"
 USA90_FP97_manage_yeltsin_russia_desc:0 "Équilibrez l'engagement avec la Russie d'Eltsine avec l'instabilité économique, l'opposition intérieure et le danger de paraître dicter l'avenir de la Russie."
 USA90_FP97_second_cold_war_pressure:0 "Politique mondiale : pressions de la Seconde Guerre froide"
 USA90_FP97_second_cold_war_pressure_desc:0 "La rivalité soviétique perdure jusqu'à la fin des années 1990. Augmentez la pression tout en gardant l'escalade nucléaire et la cohésion alliée au centre de chaque décision."
