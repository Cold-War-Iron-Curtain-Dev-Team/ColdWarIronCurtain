 USA90_FP93_european_basing_review_desc:0 "Cette orientation fait progresser le programme national, étranger, de défense ou de renseignement de l'administration tout en respectant le président actuel et l'État mondial soviétique actuel."
 USA90_FP93_balkan_crisis:0 "Politique étrangère : crise des Balkans"
 USA90_FP93_balkan_crisis_desc:0 "Ouvrez un bureau Balkans. La guerre en Bosnie n'est plus le problème de quelqu'un d'autre, et la prochaine préoccupation est de savoir si Washington la combattra ou restera à l'écart."
 USA90_FP93_bosnia_choice:0 "Politique étrangère : Lift and Strike"
 USA90_FP93_bosnia_choice_desc:0 "Levez l'embargo sur les armes et préparez les frappes aériennes de l'OTAN. Coûts §Y2,0§! argent et §R4§! mandat public. Fixe le cap du soulèvement et de la grève et améliore les relations avec la Bosnie si elle existe."
 USA90_FP93_bosnian_restraint:0 "Politique étrangère : la retenue bosniaque"
 USA90_FP93_bosnian_restraint_desc:0 "Maintenez l'embargo sur les armes et confiez les combats à la FORPRONU. Gagne §G2§! mandat public et un peu de stabilité. Dayton ne pourra s'engager sur cette voie que lorsque Washington fera marche arrière et que Srebrenica passera en premier."
 USA90_FP93_deliberate_force:0 "Politique étrangère : opération Deliberate Force"
 USA90_FP93_deliberate_force_desc:0 "Bombardez les positions des Serbes de Bosnie jusqu'à ce que les pourparlers aient une chance. Accorde de l'expérience aérienne et place le drapeau de la Force délibérée. Dayton peut suivre."
 USA90_FP93_srebrenica:0 "Politique étrangère : Srebrenica"
 USA90_FP93_srebrenica_desc:0 "La zone de sécurité tombe tandis que Washington reste retenu. Coûts §R8§! mandat public et §R0,03§! stabilité. Après cela, gelez la guerre ou payez pour inverser la tendance."
 USA90_FP93_frozen_war:0 "Politique étrangère : une guerre gelée"
 USA90_FP93_frozen_war_desc:0 "Acceptez une Bosnie divisée sans règlement. Cela coûte §R2§! de plus au mandat public et dresse le drapeau de la guerre gelée. Dayton devient impossible, et la crise ultérieure du Kosovo est plus difficile."
 USA90_FP93_reverse_course:0 "Politique étrangère : une trajectoire inversée"
 USA90_FP93_reverse_course_desc:0 "Abandonnez la retenue après Srebrenica. Coûte §Y1,5§! argent et §R6§! mandat public. Un accord de Dayton diminué pourrait alors être signé."
 USA90_FP93_dayton_process:0 "Politique étrangère : le processus de Dayton"
 USA90_FP93_dayton_process_desc:0 "Il faut une force délibérée ou un renversement après Srebrenica. Indisponible si la guerre a été gelée. Un règlement intégral accorde §G6§! mandat public. Un renversement tardif accorde §G1§! et un accord plus faible."
 USA90_FP93_somalia_after_action:0 "Politique étrangère : la Somalie après l'action"
 USA90_FP93_somalia_after_action_desc:0 "Cette orientation fait progresser le programme national, étranger, de défense ou de renseignement de l'administration tout en respectant le président actuel et l'État mondial soviétique actuel."
 USA90_FP93_rwanda_decision:0 "Politique étrangère : Décision sur le Rwanda"
 USA90_FP93_rwanda_decision_desc:0 "Cette orientation fait progresser le programme national, étranger, de défense ou de renseignement de l'administration tout en respectant le président actuel et l'État mondial soviétique actuel."
