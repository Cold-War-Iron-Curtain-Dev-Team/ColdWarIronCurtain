 USA90_FP93_restore_haiti_desc:0 "Cette orientation fait progresser le programme national, étranger, de défense ou de renseignement de l'administration tout en respectant le président actuel et l'État mondial soviétique actuel."
 USA90_FP93_oslo_process:0 "Politique étrangère : processus d'Oslo"
 USA90_FP93_oslo_process_desc:0 "Cette orientation fait progresser le programme national, étranger, de défense ou de renseignement de l'administration tout en respectant le président actuel et l'État mondial soviétique actuel."
 USA90_FP93_iraq_containment:0 "Politique étrangère : confinement de l'Irak"
 USA90_FP93_iraq_containment_desc:0 "Ouvrez le bureau Irak du Département d'État. Washington maintient Saddam dans une boîte : zones d'exclusion aérienne, sanctions et inspecteurs. Détériore les relations avec l'Irak s'il existe."
 USA90_FP93_northern_watch:0 "Politique étrangère : opération Northern Watch"
 USA90_FP93_northern_watch_desc:0 "Survolez la zone d'exclusion aérienne du nord. Accorde une expérience aérienne et installe le drapeau de la Garde du Nord. Ne déclare pas la guerre. Peut être pris avec Southern Watch."
 USA90_FP93_southern_watch:0 "Politique étrangère : opération Southern Watch"
 USA90_FP93_southern_watch_desc:0 "Survolez la zone d'exclusion aérienne du sud. Accorde une expérience aérienne et installe le drapeau de Southern Watch. Ne déclare pas la guerre. Peut être pris avec Northern Watch."
 USA90_FP93_tighten_sanctions:0 "Politique étrangère : renforcer les sanctions"
 USA90_FP93_tighten_sanctions_desc:0 "Gardez l'embargo serré. Cela coûte §Y1,5§! d'argent et détériore les relations avec l'Irak. Requis avant que les inspections puissent avoir lieu."
 USA90_FP93_oil_for_food:0 "Politique étrangère : pétrole contre nourriture"
 USA90_FP93_oil_for_food_desc:0 "Assouplir l'embargo grâce à un accord « pétrole contre nourriture ». Gagne §G2§! mandat public. Les inspections sur ce chemin ne peuvent pas avoir lieu ; ils cassent."
 USA90_FP93_unscom:0 "Politique étrangère : inspections de la CSNU"
 USA90_FP93_unscom_desc:0 "Renvoyez les inspecteurs après le choix des sanctions. Le focus suivant décide s'ils restent ou s'ils sont expulsés."
 USA90_FP93_inspections_hold:0 "Politique étrangère : les inspections sont maintenues"
 USA90_FP93_inspections_hold_desc:0 "Nécessite des sanctions sévères. Les inspecteurs continuent de travailler. Définit le drapeau des inspections, ce qui facilite l'accent mis sur l'Irak en 1997."
 USA90_FP93_inspections_break:0 "Politique étrangère : les inspections s'effondrent"
 USA90_FP93_inspections_break_desc:0 "Bagdad exclut les inspecteurs. Coûte §R3§! mandat public et déclenche le drapeau d'effondrement. Desert Fox peut suivre. C'est le seul résultat des inspections après Pétrole contre Nourriture."
 USA90_FP93_desert_fox:0 "Politique étrangère : opération Desert Fox"
 USA90_FP93_desert_fox_desc:0 "Frappez les sites militaires irakiens après l'expulsion des inspecteurs. Accorde une expérience aérienne, augmente le soutien de guerre et coûte §R3§! mandat public. Définit le drapeau Desert Fox. Ne déclare pas la guerre."
 USA90_FP93_north_korean_framework:0 "Politique étrangère : le cadre convenu"
 USA90_FP93_north_korean_framework_desc:0 "Ouvrez le bureau de la Corée du Nord du Département d'État. Le prochain objectif finance l'accord sur les réacteurs, exige des inspections plus strictes ou élabore un plan de grève."
 USA90_FP93_fund_the_framework:0 "Politique étrangère : financer le cadre"
 USA90_FP93_fund_the_framework_desc:0 "Payez pour le cadre convenu. Coûte §Y2,5§! d'argent et améliore les relations avec la Corée du Nord si elle existe. Soixante-dix jours plus tard, Washington devra respecter l'accord ou affronter les preuves de tricherie."
 USA90_FP93_harder_inspections:0 "Politique étrangère : des inspections plus strictes"
 USA90_FP93_harder_inspections_desc:0 "Refusez le marché de l'eau légère et exigez des inspections intrusives. Les pourparlers sont au point mort. Les relations avec la Corée du Nord se détériorent si elles existent."
 USA90_FP93_strike_option:0 "Politique étrangère : une option de grève"
 USA90_FP93_strike_option_desc:0 "Élaborez un plan pour frapper Yongbyon. Cela coûte §R4§! le mandat public maintenant et §R4§! de plus lorsque les alliés refusent une guerre. Définit le drapeau du plan d'attaque. Il n'y a pas de focus d'invasion."
