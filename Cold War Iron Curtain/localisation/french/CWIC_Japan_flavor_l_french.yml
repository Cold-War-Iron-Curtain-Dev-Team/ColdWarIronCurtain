l_french:
 flavorjap.1.t:0 "[GetNewspaperHeader]Vol 123 de Japan Airlines"
 flavorjap.1.d:0 "Un vol de Japan Airlines a heurté une crête à l'ouest de Tokyo après avoir quitté Haneda. Il s'agit du pire accident d'avion jamais enregistré, et presque personne à bord n'a survécu."
 flavorjap.1.a:0 "Une perte épouvantable."
 flavorjap.1.b:0 "Un terrible accident."
 flavorjap.2.t:0 "[GetNewspaperHeader]L'accord du Plaza"
 flavorjap.2.d:0 "Les ministres des Finances de l'hôtel Plaza ont convenu de faire baisser le dollar. Le yen va augmenter, et les prix à l'exportation du Japon vont augmenter avec lui."
 flavorjap.2.a:0 "Le yen monte."
 flavorjap.2.b:0 "Le dollar devait baisser."
 flavorjap.2.c:0 "Les monnaies sont déplacées."
 flavorjap.3.t:0 "[GetNewspaperHeader]Le scandale des recrues"
 flavorjap.3.d:0 "Les actions de Recruit Cosmos ont été remises à des politiciens avant que la société ne soit introduite en bourse. Le scandale a atteint le gouvernement et le Parti libéral-démocrate en répond."
 flavorjap.3.a:0 "La fête est exposée."
 flavorjap.3.b:0 "Tokyo a un scandale."
 flavorjap.4.t:0 "[GetNewspaperHeader]La fin de Showa"
 flavorjap.4.d:0 "L'empereur Hirohito est décédé. L'ère Showa est terminée et la nouvelle ère, Heisei, a commencé sous l'empereur Akihito."
 flavorjap.4.a:0 "L'époque est révolue."
 flavorjap.4.b:0 "L'Empereur est mort."
 flavorjap.5.t:0 "[GetNewspaperHeader]La bulle se brise"
 flavorjap.5.d:0 "Le marché de Tokyo a changé. Les cours des actions qui ont grimpé au cours des années 80 sont en baisse et le prix des terrains ne semble plus certain."
 flavorjap.5.a:0 "Le boom est terminé."
 flavorjap.5.b:0 "Tokyo vend."
 flavorjap.6.t:0 "[GetNewspaperHeader]Le tremblement de terre de Kobé"
 flavorjap.6.d:0 "Un tremblement de terre matinal a frappé Kobe et les villes situées le long de la baie d'Osaka. Les routes surélevées sont tombées et des incendies ravagent les quartiers."
 flavorjap.6.a:0 "Kobe est brisé."
 flavorjap.6.b:0 "Un terrible tremblement de terre."
 flavorjap.7.t:0 "[GetNewspaperHeader]Sarin dans le métro de Tokyo"
 flavorjap.7.d:0 "Du Sarin a été libéré dans les rames du métro de Tokyo aux heures de pointe. L'attaque est l'oeuvre de la secte Aum Shinrikyo."
 flavorjap.7.a:0 "Trouvez qui a fait ça."
 flavorjap.7.b:0 "Un attentat à Tokyo."
 flavorjap.8.t:0 "[GetNewspaperHeader]Monstres de poche"
 flavorjap.8.d:0 "Nintendo a mis en vente Pocket Monsters. Les enfants échangent déjà les créatures et les cartouches sont difficiles à trouver."
 flavorjap.8.a:0 "Les magasins ne peuvent pas les garder."
 flavorjap.8.b:0 "Un autre jeu venu du Japon."
 flavorjap.9.t:0 "[GetNewspaperHeader]Le baladeur"
 flavorjap.9.d:0 "Sony a mis une chaîne stéréo dans une poche. Le Walkman est suffisamment petit pour être transporté dans un train et Tokyo porte déjà les écouteurs."
 flavorjap.9.a:0 "La musique voyage."
 flavorjap.9.b:0 "Une petite machine astucieuse."
 flavorjap.10.t:0 "[GetNewspaperHeader]Le disque compact"
 flavorjap.10.d:0 "Sony et Philips ont mis en vente le disque compact. Un disque d'argent joue un album sans le sifflement d'un disque, et Eindhoven et Tokyo l'ont construit ensemble."
 flavorjap.10.a:0 "Le disque est silencieux et clair."
 flavorjap.10.b:0 "Philips l'a construit avec Sony."
 flavorjap.10.c:0 "Les records ont un rival."
 flavorjap.11.t:0 "[GetNewspaperHeader]Sony achète la Colombie"
 flavorjap.11.d:0 "Sony rachète Columbia Pictures. Le prix est énorme et une société japonaise détiendra l'un des anciens studios d'Hollywood."
 flavorjap.11.a:0 "Nous pouvons le payer."
 flavorjap.11.b:0 "Hollywood a un nouveau propriétaire."
 flavorjap.11.c:0 "Un studio a été vendu."
 flavorjap.12.t:0 "[GetNewspaperHeader]Nintendo abandonne Sony"
 flavorjap.12.d:0 "Au salon de l'électronique de Chicago, Nintendo a abandonné son partenariat de disques avec Sony et a signé avec Philips. La machine de Sony n'a pas de partenaire. Philips d'Eindhoven détient désormais la licence."
 flavorjap.12.a:0 "Nous le construirons seuls."
 flavorjap.12.b:0 "La licence nous appartient."
 flavorjap.12.c:0 "Le partenariat est rompu."
 flavorjap.13.t:0 "[GetNewspaperHeader]La PlayStation"
 flavorjap.13.d:0 "La propre machine de jeu de Sony est en vente au Japon. C'est la machine que Sony a construite après le départ de Nintendo, et les magasins sont bondés."
 flavorjap.13.a:0 "Les magasins sont pleins."
 flavorjap.13.b:0 "Sony possède une machine de jeux."
 flavorjap.14.t:0 "[GetNewspaperHeader]Le Philips CD-i"
 flavorjap.14.d:0 "Philips a mis en vente le lecteur CD-i. Il diffuse du son, des images et des jeux à partir d'un disque compact, et Eindhoven l'attend dans le salon à côté de la télévision."
 flavorjap.14.a:0 "C'est le prochain joueur."
 flavorjap.14.b:0 "Un disque interactif."
 flavorjap.15.t:0 "[GetNewspaperHeader]Le CD-i s'efface"
 flavorjap.15.d:0 "Philips en a fini avec le CD-i. Les joueurs n'ont jamais trouvé de public, et les machines de jeux ordinaires et les ordinateurs personnels ont pris le terrain qu'ils souhaitaient."
 flavorjap.15.a:0 "Le formatage est terminé."
 flavorjap.15.b:0 "Le lecteur de disque a perdu."
