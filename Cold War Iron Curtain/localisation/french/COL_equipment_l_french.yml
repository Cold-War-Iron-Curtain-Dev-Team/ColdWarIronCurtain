 COL_jet_CAS_equipment_6:0 "Mirage Mirage 5COA"
 COL_jet_CAS_equipment_6_short:0 "Mirage 5COA"
 COL_jet_CAS_equipment_6_desc:0 "Le Dassault Mirage 5 est un avion d'attaque supersonique conçu en France par Dassault Aviation et fabriqué en France et dans plusieurs autres pays sous licence. Il est dérivé du populaire chasseur Mirage III de Dassault."
 COL_jet_CAS_equipment_7:0 "Mise à jour de mi-vie du Mirage Mirage 5COA"
 COL_jet_CAS_equipment_7_short:0 "Mirage 5COA MLU"
 COL_jet_CAS_equipment_7_desc:0 "Le Dassault Mirage 5 est un avion d'attaque supersonique conçu en France par Dassault Aviation, avion modernisé par IAI avec des canards et une nouvelle avionique.avionique"

 COL_jet_light_equipment_1:0 "Canadair CT-133 Silver Star"
 COL_jet_light_equipment_1_short:0 "Étoile d'argent CT-133"
 COL_jet_light_equipment_1_desc:0 "Le Canadair CT-133 Silver Star (numéro de modèle d'entreprise CL-30) est la version canadienne construite sous licence de l'avion d'entraînement à réaction Lockheed T-33, en service des années 1950 à 2005. La version canadienne était propulsée par le turboréacteur Rolls-Royce Nene 10, tandis que la production de Lockheed utilisait l'Allison J33."
 COL_jet_light_equipment_2:0 "Cessna T-37A"
 COL_jet_light_equipment_2_short:0 "T-37A"
 COL_jet_light_equipment_3:0 "Cessna A-37B Libellule"
 COL_jet_light_equipment_3_short:0 "A-37B Libellule"
 COL_jet_light_equipment_4:0 "Rockwell OV-10A Bronco nord-américain"
 COL_jet_light_equipment_4_short:0 "OV-10A Bronco"
 COL_jet_light_equipment_4_desc:0 "Le North American Rockwell OV-10 Bronco est un avion d'attaque et d'observation léger bi-turbopropulseur américain. Il a été développé dans les années 1960 comme avion spécial pour le combat contre-insurrectionnel (COIN), et l'une de ses principales missions était d'être un avion de contrôle aérien avancé (FAC). Il peut transporter jusqu'à 3 200 livres de munitions externes, des charges internes telles que des parachutistes ou des civières, et flâner pendant trois heures ou plus."
 COL_jet_light_equipment_5:0 "Embraer EMB 314 Super Tucano"
 COL_jet_light_equipment_5_short:0 "A-29 Super Tucano"
 COL_jet_light_equipment_5_desc:0 "L'Embraer EMB 314 Super Tucano, également nommé ALX ou A-29, est un avion d'attaque léger à turbopropulseurs brésilien conçu et construit par Embraer dans le cadre d'un développement de l'Embraer EMB 312 Tucano. L'A-29 Super Tucano transporte une grande variété d'armes, y compris des munitions à guidage de précision, et a été conçu pour être un système peu coûteux utilisé dans des environnements à faible menace."

 COL_recon_equipment_0:0 "Douglas O-38P"
 COL_recon_equipment_0_short:0 "O-38P"
 COL_jet_recon_equipment_0:0 "Étoile filante Lockheed RT-33A"
 COL_jet_recon_equipment_0_short:0 "Étoile filante RT-33A"
 COL_jet_recon_equipment_0_desc:0 "RT-33A modifié avant la livraison en tant que variante de reconnaissance monoplace ; 85 construits, principalement pour l'exportation dans le cadre du programme d'assistance militaire."
