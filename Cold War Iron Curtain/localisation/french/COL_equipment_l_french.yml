 #Colombia COL
 COL_infantry_equipment_0:0 "Fusil américain, calibre.30, M1"
 COL_infantry_equipment_0_short:0 "M1 Garand"
 COL_infantry_equipment_0_desc:0 "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."

 COL_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 COL_infantry_equipment_1_short:0 "FN FAL"
 COL_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 COL_infantry_equipment_2:0 "Heckler & Koch G3"
 COL_infantry_equipment_2_short:0 "Heckler & Koch G3"
 COL_infantry_equipment_2_desc:0 "Modèle original basé sur le CETME Model 58 introduit en 1959 et approuvé en 1960. Il avait une crosse et un garde-main en bois."

 COL_infantry_equipment_3:0 "Mitrailleuse à fusil automatique IMI Galil"
 COL_infantry_equipment_3_short:0 "Galil ARM"
 COL_infantry_equipment_3_desc:0 "L'IWI Galil ACE est une série de fusils d'assaut et de fusils de combat développés et fabriqués à l'origine par Israel Weapon Industries (IWI). Il est produit en trois calibres différents. 5,56 × 45 mm OTAN, 7,62 × 39 mm et 7,62 × 51 mm OTAN. IWI USA a également produit des variantes en édition limitée de l'ACE en 5,45 × 39 mm en 2020."

 COL_infantry_equipment_4:0 "IMI Galil Automatique ACE"
 COL_infantry_equipment_4_short:0 "Galille ACE"
 COL_infantry_equipment_4_desc:0 "L'IMI Galil est une famille de fusils automatiques de fabrication israélienne chambrés pour les cartouches OTAN de 5,56 × 45 mm ou 7,62 × 51 mm OTAN. Conçu à l'origine par Yisrael Galili et Yakov Lior à la fin des années 1960, le Galil a d'abord été produit par l'entreprise publique Israel Military Industries et est maintenant exporté par les Israel Weapon Industries privatisées. "

 ########## NEW COL ARMOR
 COL_lt_equipment_1:0 "M3 Stuart"
 COL_lt_equipment_1_short:0 "M3 Stuart"
 COL_lt_equipment_2:0 "Lévrier M8"
 COL_lt_equipment_2_short:0 "Lévrier M8"
 COL_lt_equipment_5:0 "Engesa EE-9 Cascavel Mk.II"
 COL_lt_equipment_5_short:0 "EE-9 Cascavel Mk.II"
 COL_lt_equipment_5_desc:0 "L'EE-9 Cascavel est un véhicule blindé brésilien à six roues développé principalement pour la reconnaissance. Il a été conçu par Engesa en 1970 pour remplacer la flotte vieillissante de M8 Greyhounds du Brésil. Le véhicule fut d'abord équipé du canon principal de 37 mm du Greyhound, puis d'une tourelle française adoptée du Panhard AML-90."
 COL_lt_equipment_6:0 "Engesa EE-9 Cascavel Mk.III"
 COL_lt_equipment_6_short:0 "EE-9 Cascavel Mk.III"
 COL_lt_equipment_6_desc:0 "L'EE-9 Cascavel est un véhicule blindé brésilien à six roues développé principalement pour la reconnaissance. Il a été conçu par Engesa en 1970 pour remplacer la flotte vieillissante de M8 Greyhounds du Brésil. Le véhicule fut d'abord équipé du canon principal de 37 mm du Greyhound, puis d'une tourelle française adoptée du Panhard AML-90."

 COL_mechanized_equipment_1:0 "Demi-piste M2"
 COL_mechanized_equipment_1_short:0 "Demi-piste M2"
 COL_mechanized_equipment_1_desc:0 "La voiture semi-chenillée M2 est une voiture semi-chenillée blindée produite par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspirait des semi-chenilles importées de France dans les années 1930, employant des composants standard fournis par les constructeurs de camions américains pour accélérer la production et réduire les coûts. Le concept a été conçu et les modèles pilotes fabriqués par Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement étiqueté M2.). La production par la White Motor Company a commencé en 1940 et a été élargie pour inclure Autocar."
 COL_mechanized_equipment_2:0 "Demi-piste M3"
 COL_mechanized_equipment_2_short:0 "Demi-piste M3"
 COL_mechanized_equipment_2_desc:0 "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 COL_mechanized_equipment_3:0 "Demi-piste M3A1"
 COL_mechanized_equipment_3_short:0 "Demi-piste M3A1"
 COL_mechanized_equipment_3_desc:0 "Le M3A1 est un semi-chenillé M3 doté du support d'anneau de mitrailleuse M49 amélioré sur le siège avant droit. Entre 1942 et 1943, tous les half-tracks M3 (standard et A1) furent continuellement améliorés. Ces améliorations comprenaient un certain nombre d'améliorations de la transmission, du moteur et du rangement"
 COL_mechanized_equipment_4:0 "REO M35 'Météore'"
 COL_mechanized_equipment_4_short:0 "M35 « Météore »"
 COL_mechanized_equipment_5:0 "M113"
 COL_mechanized_equipment_5_short:0 "M113"
 COL_mechanized_equipment_6:0 "M113A1"
 COL_mechanized_equipment_6_short:0 "M113A1"
 COL_mechanized_equipment_7:0 "Engesa EE-11 Urutu"
 COL_mechanized_equipment_7_short:0 "EE-11 Urutu"
 COL_mechanized_equipment_9:0 "VBL III ISC"
 COL_mechanized_equipment_9_short:0 "VBL III ISC"
 COL_mechanized_equipment_10:0 "Véhicule blindé de sécurité Textron M1117"
 COL_mechanized_equipment_10_short:0 "M1117 ASV"

 COL_motorized_equipment_1:0 "GMC CCKW 6x6"
 COL_motorized_equipment_1_short:0 "CCKW 6x6"
 COL_motorized_equipment_2:0 "RÉO M35 6x6"
 COL_motorized_equipment_2_short:0 "M35 6x6"
 COL_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 COL_motorized_equipment_3:0 "AM Général M809 6x6"
 COL_motorized_equipment_3_short:0 "M809 6x6"
 COL_motorized_equipment_3_desc:0 "Le M809 est un camion 6x6 de 5 tonnes conçu par AM General en 1970. Il a été utilisé dans tous les conflits américains de 1970 à 1982. Le M809 utilise un moteur NH250, une transmission à 5 vitesses/2 gammes et des essieux à poutre dynamique sur ressorts à lames. Il peut transporter une charge de 5 000 lb. Il a une vitesse de 52 mph sur 350 miles et obtient 10 mi/gal. En plus d'être utilisé pour le transport et le fret, le véhicule est très solide et peut supporter des composants utilitaires sur son plateau. Ceux-ci incluent la possibilité de monter des kits de dépanneuse, des bennes, des remorques, de grandes fourgonnettes pour le soutien/confort, des équipements de pontage et quelques autres. Le M809 peut également traverser des rivières peu profondes grâce à sa garde au sol élevée et est très efficace sur route ou hors route grâce à sa suspension. "
 COL_motorized_equipment_4:0 "AM Général M939 6x6"
 COL_motorized_equipment_4_short:0 "M939 6x6"
 COL_motorized_equipment_4_desc:0 "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis 1982. Le M939 utilise un moteur 6CTA8.3, une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Le véhicule est capable de transporter une charge de 10 000 lb. Il peut se déplacer à 6,3 mph sur 350 miles et obtient 6 mi/gal. Il est toujours utilisé aujourd'hui. Le M939 est très efficace sur tous les terrains et convient bien aux intempéries. Le M939 a permis une nouvelle génération de camions, de moteurs principaux et de véhicules de dépannage et a fait l'objet d'une fabrication intensive. Il est plus fiable et plus résistant que les véhicules précédents et a complètement supplanté les contrats de production antérieurs. "
 COL_motorized_equipment_5:0 "Navistar 7000-MV 6x6"
 COL_motorized_equipment_5_short:0 "7000-MV 6x6"
 COL_motorized_equipment_5_desc:0 "La série Navistar 7000 est une gamme de véhicules lourds militaires basée sur le châssis de camion WorkStar de Navistar International et produite par Navistar Defence. Le camion est disponible dans une variété de configurations de roues (4×2, 4×4, 6×4 et 6×6) et de moteurs. En 2005, l'armée américaine a commandé 2 900 séries 7 000 MV pour l'armée nationale afghane et le ministère irakien de la Défense, et une commande supplémentaire de 7 000 a été ajoutée en 2008."

 ########### END OF COL ARMOR
