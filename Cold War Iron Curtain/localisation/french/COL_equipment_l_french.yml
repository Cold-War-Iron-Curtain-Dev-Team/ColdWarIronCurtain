 #Transport
 COL_utility_helicopter_equipment_1:0 "Mésange Sikorsky H-19"
 COL_utility_helicopter_equipment_1_short:0 "Mésange H-19"
 COL_utility_helicopter_equipment_2:0 "Cloche 204"
 COL_utility_helicopter_equipment_2_short:0 "Cloche 204"
 COL_utility_helicopter_equipment_3:0 "Bell UH-1D Iroquois"
 COL_utility_helicopter_equipment_3_short:0 "UH-1D Iroquois"
 COL_utility_helicopter_equipment_4:0 "Bell UH-1N Twin Huey"
 COL_utility_helicopter_equipment_4_short:0 "UH-1N Twin Huey"
 COL_utility_helicopter_equipment_4_desc:0 "Introduit pour la première fois en 1970, l'UH-1N était un autre membre de la famille élargie « Huey », cette fois développé à partir de l'UH-1H, bien que contrairement à l'UH-1A et à l'UH-1D, la variante « N » serait celle qui donnerait naissance à sa version civile, le Bell 212. Le rotor principal est propulsé par deux turbomoteurs qui entraînent un seul arbre de sortie. En cas de panne d'un moteur, le moteur restant peut fournir 671 kW (900 shp) pendant 30 minutes ou 571 kW (765 shp), permettant à l'UH-1N de maintenir ses performances de croisière au poids maximum. C'était également l'une des rares variantes « iroquoises » à ne pas être utilisée par l'armée américaine, étant plutôt le porte-drapeau des Marines. Sa configuration bimoteur lui a valu le surnom informel de « Twin Huey »."
 COL_utility_helicopter_equipment_5:0 "Sikorsky UH-60A Faucon Noir"
 COL_utility_helicopter_equipment_5_short:0 "UH-60A Faucon Noir"
 COL_utility_helicopter_equipment_5_desc:0 "Entré en service en 1979, l'UH-60A a succédé à l'UH-1 en tant que plate-forme d'hélicoptère utilitaire de l'armée américaine. Développé à partir du S-70 civil, l'UH-60A pouvait transporter jusqu'à 15 personnes (4 membres d'équipage et jusqu'à 11 soldats équipés). Nommé d'après un chef de tribu amérindienne Sauk, le « Blackhawk » a servi au combat lors de conflits à la Grenade, au Panama, en Irak, en Somalie, dans les Balkans, en Afghanistan et dans d'autres régions du Moyen-Orient."
 COL_utility_helicopter_equipment_6:0 "Sikorsky UH-60L Faucon Noir"
 COL_utility_helicopter_equipment_6_short:0 "UH-60L Faucon Noir"
 COL_utility_helicopter_equipment_6_desc:0 "Une mise à niveau de l'UH-60A, la variante « L » du « Blackhawk » comprend des moteurs améliorés, une boîte de vitesses à durabilité améliorée et un système de commandes de vol mis à jour. Introduit en 1990, l'UH-60L est la principale variante de la variante utilitaire du H-60 actuellement en service dans l'armée américaine, avec des considérations sur le type utilisé pour remplacer l'UH-1N dans l'US Air Force."
 COL_utility_helicopter_equipment_7:0 "Sikorsky S-70i Faucon Noir"
 COL_utility_helicopter_equipment_7_short:0 "S-70i Faucon Noir"
 COL_utility_helicopter_equipment_7_desc:0 "Pales de rotor à large corde de conception améliorée, moteurs T700-GE-701D (max 2 000 shp ou 1 500 kW chacun), boîte de vitesses à durabilité améliorée, ordinateur du système de gestion intégré de la santé du véhicule (IVHMS) et nouveau cockpit en verre."

