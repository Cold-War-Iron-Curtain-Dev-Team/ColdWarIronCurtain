#Colombia
 COL_fighter_equipment_0:0 "Fuerza Aérea Colombiana"
 COL_fighter_equipment_0_short:0 "FAC"
 COL_fighter_equipment_0_desc:0 "La Force Aérienne Colombienne est la force aérienne de la République de Colombie. La Force aérienne colombienne est l'une des trois institutions des forces militaires colombiennes chargées, selon la Constitution de 1991, d'exercer et de maintenir le contrôle de l'espace aérien colombien et de défendre sa souveraineté, son intégrité territoriale et son ordre constitutionnel. C'est l'une des plus grandes forces aériennes des Amériques."

 COL_CAS_equipment_1:0 "Boeing-Stearman Kaydet"
 COL_CAS_equipment_1_short:0 "Kaydet"
 COL_CAS_equipment_2:0 "AT-6C Texan nord-américain"
 COL_CAS_equipment_2_short:0 "AT-6C Texan"
 COL_CAS_equipment_3:0 "T-6F Texan nord-américain"
 COL_CAS_equipment_3_short:0 "T-6F Texan"
 COL_CAS_equipment_4:0 "Douglas B-26C Envahisseur"
 COL_CAS_equipment_4_short:0 "Envahisseur B-26C"

 COL_jet_multirole_equipment_1:0 "Étoile filante Lockheed F-80C"
 COL_jet_multirole_equipment_1_short:0 "Étoile filante F-80C"
 COL_jet_multirole_equipment_1_desc:0 "Le premier chasseur à réaction exploité par l'US Army Air Force (plus tard l'US Air Force). C'était le premier et le seul avion à réaction américain opérationnel pendant les derniers jours de la Seconde Guerre mondiale. Ce type marquerait le début de l'ère des avions à réaction pour les États-Unis, car sa conception à aile droite servait largement de chasseur de jour et de chasseur-bombardier pendant la guerre de Corée sous le nom de F-80. Surnommé « l'étoile filante », le F-80 représentait le premier summum de l'aviation américaine."
 COL_jet_multirole_equipment_2:0 "Canadair CL-13 Sabre Mark 5"
 COL_jet_multirole_equipment_2_short:0 "Sabre Mk.5"
 COL_jet_multirole_equipment_2_desc:0 " le premier Sabre Mk.5 a volé avec le moteur Orenda 10, ce qui lui a donné un net avantage en termes de taux de montée et de plafond par rapport aux variantes précédentes. D'autres améliorations du Mk 5 comprenaient un nouveau système d'oxygène et une maniabilité améliorée et des caractéristiques à basse vitesse obtenues en augmentant la corde de l'aile de six pouces (15,2 cm) à l'emplanture et de trois pouces (7,2 cm) au bout de l'aile ainsi qu'en installant une petite clôture d'aile verticale."
 COL_jet_multirole_equipment_3:0 "Canadair CL-13 Sabre Mark 6"
 COL_jet_multirole_equipment_3_short:0 "Sabre Mk.6"
 COL_jet_multirole_equipment_3_desc:0 "Le Canadair Sabre Mk.6 était la variante finale et était considéré comme le « meilleur » Sabre de production jamais construit. Il était équipé d'un moteur Orenda à deux étages développant 7 275 lb (3 302 kg) de poussée statique. Ses performances en altitude et son taux de montée ont été améliorés par rapport au Mk 5 et le rétablissement des lamelles du bord d'attaque de l'aile lui a conféré d'excellentes caractéristiques à basse vitesse."
 COL_jet_multirole_equipment_4_short:0 "Sabre Mk.6"
 COL_jet_multirole_equipment_4_desc:0 "Le Canadair Sabre Mk.6s, abréviation de sidewinder équipé, est une mise à niveau de la variante finale et a été considéré comme le « meilleur » Sabre de production jamais construit. Avec points d'attache de montage pour les AIM-9B Sidewinders."
