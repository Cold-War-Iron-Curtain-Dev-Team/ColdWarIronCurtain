l_french:
 #IDK
 BUILDING_GROUP_TOOLTIP: "\nVous pouvez avoir jusqu'à $LEVEL|R$ de ces bâtiments par État. Cette casquette est partagée avec :"
 BUILDING_GROUP_SHARED_NAME_ENTRY: " - $NAME$"
 #End of IDK
 infrastructure: "Infrastructures municipales"
 infrastructure_plural: "Infrastructures municipales"
 infrastructure_desc: "Cette infrastructure aide les villes et l'industrie urbaine.\n§G +7% §!§YProduction du parc industriel§! en état\n§G +7% §!§YVitesse de construction§! en état\n§GRecherchez des projets technologiques inframunicipaux pour augmenter le niveau maximum !§!"
 arms_factory: "Manufacture militaro-industrielle"
 arms_factory_plural: "Manufactures militaro-industrielles"
 arms_factory_desc: "Ce parc fournit à l'État une industrie pour la production de nouveaux équipements militaires. Peut être converti en industrie civile si nécessaire."
 dockyard: "Cale sèche navale"
 dockyard_plural: "Cales sèches navales"
 dockyard_desc: "Coûts §R-2§! £resources_strip|7.Ce parc fournit à l'État l'industrie nécessaire à la construction de nouveaux navires."
 industrial_complex: "Parc industriel"
 industrial_complex_plural: "Parcs industriels"
 industrial_complex_desc: "Coûts §R-1§! £resources_strip|7, §R-1§! £resources_strip|5 et §R-1§! £resources_strip|1. Ce parc fournit à l'État une industrie pour la production de biens civils ou la construction de nouveaux bâtiments. Peut être converti en industrie militaire si nécessaire."
 air_base: "Base aérienne"
 air_base_plural: "Bases aériennes"
 air_base_desc: "Ce bâtiment permet à l'État de déployer vos forces aériennes."
 naval_base: "Base navale"
 naval_base_plural: "Bases navales"
 naval_base_desc:1 "Étend la portée de votre flotte et fournit des services de réparation pour celle-ci. Permet l'approvisionnement et l'exportation de ressources à l'étranger. Des niveaux plus élevés augmentent le débit d'approvisionnement."
 bunker: "Fort terrestre"
 bunker_plural: "Forts terrestres"
 bunker_desc: "Ce bâtiment inflige une pénalité d'attaque de $VALUE|+%0$ pour chaque niveau de fort à l'attaquant en combat. Attaquer depuis plusieurs directions réduira l'effet des forts."
 coastal_bunker: "Fort côtier"
 coastal_bunker_plural: "Forts côtiers"
 coastal_bunker_desc: "Ce bâtiment inflige une pénalité d'attaque de $VALUE|+%0$ pour chaque niveau de fort à l'attaquant lors d'un combat d'invasion navale."
 anti_air_building: "Anti-aérien"
 anti_air_building_plural: "Anti-aérien"
 anti_air_building_desc: "Ce bâtiment offre à l'État une protection contre les bombardiers ennemis et la possibilité de tirer sur les avions attaquants.\n§YCouverture des missiles anti-balistiques§! dans l'état : §G+5%§!"
 synthetic_refinery: "Raffinerie pétrochimique"
 synthetic_refinery_plural: "Raffineries pétrochimiques"
 nuclear_reactor_heavy_water: "Réacteur nucléaire à eau lourde"
 nuclear_reactor_heavy_water_plural: "Réacteurs nucléaires à eau lourde"
 nuclear_reactor_heavy_water_desc: "Ce bâtiment fournit à l'État la production d'uranium enrichi destiné à la fabrication d'armes nucléaires.\nLes réacteurs nucléaires utilisant de l'eau lourde sont un peu moins chers à construire que les réacteurs à graphite, mais produisent moins de matériaux pouvant être utilisés pour produire des armes nucléaires."
 commercial_nuclear_reactor: "Réacteur nucléaire civil"
 commercial_nuclear_reactor_plural: "Réacteurs nucléaires civils"
 commercial_nuclear_reactor_desc: "Ce bâtiment fournit à l'État de l'uranium enrichi pour les armes nucléaires et produit de l'électricité pour l'économie civile."
 nuclear_bunker: "Abris de protection civile"
 nuclear_bunker_plural: "Abris de protection civile"
 nuclear_bunker_desc: "Les abris de protection civile protègent la population locale des retombées nucléaires et des catastrophes"
 #synthetic_refinery_desc: "This building provides the state with +1 £resources_strip|3 and +2 £resources_strip|1."
 synthetic_refinery_desc: "Ce bâtiment met à la disposition de l'État 25 000 stockages de carburant,"
 synthetic_refinery_amount: "$VALUE|Y0=$"
 synthetic_refinery_resource: "£resources_strip|$FRAME$"
 radar_station: "Réseau radar"
 radar_station_plural: "Réseaux radar"
 radar_station_desc: "Le radar vous permet d'obtenir des informations sur les troupes ennemies dans les États voisins.\nUn niveau radar plus élevé dans un état augmente la portée effective du radar.\nLe radar permet également à l'État de mieux détecter les forces aériennes ennemies, donnant ainsi à vos avions une meilleure chance de les engager.\nDe plus, le radar augmente la détection des flottes ennemies en mer.\n§YCouverture des missiles anti-balistiques§! dans l'état : §G+5%§!"
 rocket_site: "Silo ICBM"
 rocket_site_plural: "Silos ICBM"
 rocket_site_desc: "Ce bâtiment permet à l'État de déployer les ICBM produits."
 nuclear_reactor: "Usine de fabrication d'armes nucléaires"
 nuclear_reactor_plural: "Usines d'armes nucléaires"
 nuclear_reactor_desc: "Coûts -2 £resources_strip|6 et -2 £resources_strip|7 pour produire des armes nucléaires. \n §G +2 Production d'armes nucléaires §! \n §R ATTENTION : TRÈS DANGEREUX §!"
 nuclear_facility: "Installation de recherche nucléaire"
 nuclear_facility_plural: "Installations de recherche nucléaire"
 nuclear_facility_desc: "Les Installations Expérimentales de Recherche Nucléaire permettent de démarrer des projets de recherche liés à l'utilisation de l'énergie nucléaire."
 air_facility: "Installation d'aérodynamique et d'avionique"
 air_facility_plural: "Installations aérodynamiques et avioniques"
 air_facility_desc: "Les installations expérimentales d'aérodynamique et d'avionique vous permettent de démarrer des projets de recherche sur les avions, les fusées et l'électronique associée."
 naval_facility: "Installation de génie naval"
 naval_facility_plural: "Installations de génie naval"
 naval_facility_desc: "Les installations expérimentales pour l'ingénierie navale vous permettent de démarrer des projets de recherche liés aux navires de surface et aux sous-marins.\nUn Génie Naval ne peut être créé que dans une province côtière."
 naval_supply_hub: "Centre d'approvisionnement naval"
 naval_supply_hub_desc: "Ce bâtiment permet à vos flottes de se réapprovisionner et de se ravitailler dans cette base en plus de leurs bases d'origine, étendant potentiellement la portée opérationnelle de vos §YTask Forces§!.\nUn centre de ravitaillement naval ne peut être construit que dans une province côtière disposant d'une base navale d'au moins niveau 8."
 naval_headquarters: "Quartier général naval"
 naval_headquarters_desc: "Ce bâtiment vous permet d'affecter un amiral pour augmenter l'efficacité des §YTask Forces§! opérant à portée du quartier général naval.\n\nJusqu'à $MAXNUM|H$ le quartier général peut avoir un amiral affecté en même temps.\n   Actuellement attribué : $CURRNUM|H$\n\nUn quartier général naval ne peut être construit que dans une province côtière disposant d'une base navale d'au moins niveau 8. "
 mega_gun_emplacement: "Pistolet multicharge de gros calibre"
 mega_gun_emplacement_plural: "Pistolets de calibre multicharge"
 mega_gun_emplacement_desc: "Fonctionnant sur le principe de la propulsion multi-charges, ce canon de gros calibre est conçu pour atteindre des portées de bombardement inégalées. Utilisant une série de tunnels souterrains, il accélère les obus à des vitesses supersoniques avant de les lancer vers des cibles lointaines."
 stronghold_network: "Réseau de forteresse"
 stronghold_network_plural: "Réseaux de forteresses"
 stronghold_network_desc: "Un vaste système défensif composé de bunkers massifs et de positions fortement fortifiées, conçu pour repousser les avancées ennemies et sécuriser les zones stratégiques clés."
 land_facility: "Installation de guerre terrestre"
 land_facility_plural: "Installations de guerre terrestre"
 land_facility_desc: "Les installations expérimentales pour la guerre terrestre vous permettent de démarrer des projets de recherche liés à divers aspects de la guerre terrestre, tels que les chars spéciaux ou l'artillerie."
 landmark_eiffel_tower: "La Tour Eiffel"
 landmark_eiffel_tower_plural: "$landmark_eiffel_tower$"
 landmark_eiffel_tower_desc: "La Tour Eiffel doit son nom à son créateur Gustave Eiffel. Elle a été construite comme pièce maîtresse de l'Exposition universelle de 1889 et pour couronner le centenaire de la Révolution française. Bien qu'initialement critiqué par certains des plus grands artistes et intellectuels français pour sa conception, il est depuis devenu une icône culturelle mondiale de la France et l'une des structures les plus reconnaissables au monde, et le lieu le plus visité au monde."
 landmark_kremlin: "Le Kremlin"
 landmark_kremlin_plural: "$landmark_kremlin$"
 landmark_kremlin_desc: "Le Kremlin de Moscou est un complexe fortifié. Au sein du complexe se trouve le Grand Palais du Kremlin, qui servait de résidence royale à l'empereur de Russie. Le Kremlin surplombe la rivière Moskova au sud, la cathédrale Saint-Basile et la place Rouge à l'est et le jardin Alexandre à l'ouest. Ancienne demeure des grandeurs royales, elle abrite aujourd'hui le coeur du gouvernement soviétique et constitue un symbole du socialisme international."
 landmark_berlin_reichstag: "Le Reichstag"
 landmark_berlin_reichstag_plural: "$landmark_berlin_reichstag$"
 landmark_berlin_reichstag_desc: "Sans aucun doute la pièce maîtresse de l'histoire du XXe siècle, le Reichtstag constitue un monument historique sur la Platz der Republik Berlin. Construit après l'unification de l'Allemagne en 1871, il fut achevé en 1894 et abrite le corps législatif impérial allemand. En 1933, quatre semaines seulement après l'élection d'Adolf Hitler au poste de chancelier, le Reichstag fut presque entièrement détruit lors d'un incendie criminel, ce qui conduisit le président Hindenburg à adopter une législation limitant les droits civils. Le Reichstag a servi de lieu de naissance et de tombeau du nazisme, après que le drapeau soviétique ait été hissé en 1945, marquant la fin de la guerre en Europe."
 landmark_statue_of_liberty: "La Statue de la Liberté"
 landmark_statue_of_liberty_plural: "$landmark_statue_of_liberty$"
 landmark_statue_of_liberty_desc: "La colossale Statue de la Liberté se dresse fièrement dans le port de New York, offerte par la France en 1876 pour commémorer l'alliance entre les deux nations pendant la Révolution américaine, célébrer le centenaire de l'indépendance américaine et honorer les idéaux communs de liberté et de démocratie."
 landmark_big_ben: "Grand Ben"
 landmark_big_ben_plural: "$landmark_big_ben$"
 landmark_big_ben_desc: "La tour de l'horloge de Westminster, familièrement appelée Big Ben, est la plus remarquable des icônes culturelles britanniques, aux côtés du palais de Westminster, de l'abbaye de Westminster et du Tower Bridge. C'est l'un des symboles les plus marquants du Royaume-Uni et de l'Empire britannique dans son ensemble. Achevé en 1859 dans un style néogothique, il constitue un symbole de fierté nationale et d'identité culturelle britannique devant lequel le monde entier peut s'émerveiller."
 landmark_colosseum: "Le Colisée"
 landmark_colosseum_plural: "$landmark_colosseum$"
 landmark_colosseum_desc: "Le Colisée est un amphithéâtre elliptique situé au centre de la ville de Rome, en Italie, juste à l'est du Forum romain. Il s'agit du plus grand amphithéâtre antique jamais construit, achevé par l'empereur Titus César Vespasien en 80 après JC après que son père ait commencé la construction. Il a servi de palais de divertissement pour les Romains et leurs prédécesseurs, mais a été endommagé par des catastrophes, à la fois naturelles, comme le tremblement de terre dévastateur de 1349, et artificielles, à cause d'innombrables personnes volant la pierre de ses fondations. Malgré tout, le Colisée reste un symbole renommé de la Rome impériale et a été classé parmi les 7 nouvelles merveilles du monde."
 landmark_cristo_redentor: "Christ Rédempteur"
 landmark_cristo_redentor_plural: "$landmark_cristo_redentor$"
 landmark_cristo_redentor_desc: "Le Christ Rédempteur est une statue Art déco de Jésus-Christ à Rio de Janeiro, au Brésil, créée par le sculpteur franco-polonais Paul Landowski et construite par l'ingénieur brésilien Heitor da Silva Costa. Construite entre 1922 et 1931, elle se dresse avec ses bras de bienvenue ouverts, comme le symbole le plus important du Brésil et de la foi catholique dans la région."
 landmark_tokyo_imperial_palace: "Le Palais Impérial"
 landmark_tokyo_imperial_palace_plural: "$landmark_tokyo_imperial_palace$"
 landmark_tokyo_imperial_palace_desc: "Le Palais Impérial de Tokyo est la résidence principale de l'Empereur. Il s'agit d'un grand parc situé dans le quartier Chiyoda du quartier Chiyoda de Tokyo, et sert de symbole de fierté et de respect pour le peuple japonais, et de symbole de tradition, abritant le clan impérial continu même après la défaite de la Seconde Guerre mondiale."
 landmark_national_diet: "Le bâtiment de la Diète nationale"
 landmark_national_diet_plural: "$landmark_national_diet$"
 landmark_national_diet_desc: "Le Kokkai-gijido est le bâtiment où se réunissent la Chambre des représentants et la Chambre des conseillers de la Diète nationale du Japon. Achevé au début de 1936, il est construit presque entièrement avec des matériaux japonais, à quelques exceptions près. Ses prédécesseurs ont été détruits en 1891 et 1925, tous deux par des incendies, mais le modèle actuel a survécu aux incendies de la guerre et constitue un espoir pour l'avenir de la démocratie japonaise."
 landmark_hakko_ichiu: "Le monument Hakko Ichiu"
 landmark_hakko_ichiu_plural: "$landmark_hakko_ichiu$"
 landmark_hakko_ichiu_desc: "La tour Hakko Ichiu a été construite en 1939 pour commémorer le 2 600e anniversaire de la fondation du Japon et comme monument symbolisant le destin japonais d'unifier les huit coins du monde. Cependant, après la guerre, l'occupation alliée a fait pression sur les habitants pour qu'ils suppriment les inscriptions impérialistes, mais beaucoup ont proposé une réimagination pour commémorer la paix à la place."
 landmark_hofburg_palace: "Le palais de la Hofburg"
 landmark_hofburg_palace_plural: "$landmark_hofburg_palace$"
 landmark_hofburg_palace_desc: "La Hofburg est l'ancien palais impérial principal de la dynastie des Habsbourg. Situé au centre de Vienne et face à la Heldenplatz, il a été construit au XIIIe siècle par Ottokar II de Bohême et agrandi plusieurs fois par la suite, étant documenté comme siège du gouvernement depuis 1279. Il servait également de résidence impériale d'hiver, le château de Schönbrunn étant de résidence d'été."
 landmark_sadabad_complex: "Le complexe de Sa'dabad"
 landmark_sadabad_complex_desc: "Le complexe de Sa'dabad est un complexe de 80 hectares situé dans le nord de Téhéran, construit par les Shahs Qajar au XIXe siècle et agrandi par la dynastie Pahlavi, servant de résidence officielle au monarque d'Iran."
 landmark_taj_mahal: "Le Taj Mahal"
 landmark_taj_mahal_desc: "Le Taj Mahal est un mausolée en marbre blanc ivoire situé sur la rive droite de la rivière Yamuna à Agra, dans l'Uttar Pradesh, en Inde. Il fut commandé en 1631 par le cinquième empereur moghol, Shah Jahan, pour abriter le tombeau de son épouse. Reconnu par son design et son apparence époustouflants, il constitue un symbole national de l'union et de la culture indiennes, recevant des millions de visiteurs et l'une des attractions touristiques les plus populaires au monde. Il est devenu un symbole de l'Inde elle-même."
 landmark_hagia_sophia: "La Sainte-Sophie"
 landmark_hagia_sophia_desc: "Construite par l'empereur byzantin Justinien Ier au VIe siècle comme maison du patriarche oecuménique de Constantinople, Sainte-Sophie était considérée comme une merveille d'ingénierie et prétendait avoir changé à jamais l'histoire de l'architecture. Elle est restée l'épicentre spirituel de l'Église orthodoxe orientale jusqu'à la chute de Constantinople, au cours de laquelle elle a été transformée en mosquée par le Ottoman Sultan Mehmed II, puis finalement transformée en musée en 1934 par la République naissante de Turquie."
 landmark_great_wall_section: "La Grande Muraille"
 landmark_great_wall_section_plural: "$landmark_great_wall_section$"
 landmark_great_wall_section_desc: "La Grande Muraille, construite au fil de centaines d'années et de dizaines d'administrations pour dissuader les envahisseurs qui s'attaquant au coeur de la Chine, est un chef-d'oeuvre logistique. Aujourd'hui, on pourrait dire qu'il représente le grand courage et le courage du peuple chinois face à l'adversité."
 landmark_nanjing_presidential_palace: "Le palais présidentiel de Nankin"
 landmark_nanjing_presidential_palace_plural: "$landmark_nanjing_presidential_palace$"
 landmark_nanjing_presidential_palace_desc: "Un bâtiment ancien, chargé d'une histoire tout aussi riche, passé par de nombreuses mains, depuis les princes Ming qui l'ont construit jusqu'à la maison Qing du vice-roi de la province, même par le chef de la rébellion Taiping, Hong Xiuquan, qui a agrandi le palais, et enfin comme palais présidentiel après la révolution Xinhai."
 landmark_forbidden_city: "La Cité Interdite"
 landmark_forbidden_city_plural: "$landmark_forbidden_city$"
 landmark_forbidden_city_desc: "La Cité Interdite fut la résidence de 24 empereurs des dynasties Ming et Qing et le centre du pouvoir politique en Chine pendant plus de 500 ans, de 1420 à 1924. Nommée ainsi parce que son accès était interdit à la grande majorité des roturiers et des fonctionnaires, ne permettant l'entrée qu'à l'empereur, à sa famille et à quelques membres sélectionnés de la cour, symbolisant le statut divin de l'empereur en tant que Fils du Ciel, symbole de la longue histoire d'harmonie et de prospérité de la Chine. Mettant enfin fin à 5 siècles d'histoire après l'abdication du dernier empereur Pu Yi en 1912."
 landmark_prague_castle: "Le château de Prague"
 landmark_prague_castle_desc: "Situé sur la rive ouest de la rivière Vitava, le Prazský Hrad est le plus grand complexe de châteaux anciens au monde. Construit en 870 après JC, il a servi de siège du pouvoir au roi de Bohême, à l'empereur du Saint-Empire romain germanique, au président de la Tchécoslovaquie, à la résidence d'Adolf Hitler, au siège de Reinhard Heydrich et au bureau du Parti communiste de Tchécoslovaquie."
 landmark_bojnice_castle: "Le château de Bojnice"
 landmark_bojnice_castle_desc: "Le château de Bojnice est de style roman avec des fondations gothiques et se trouve juste au bord de la rivière Nitra et au-dessus du village médiéval de Bojnice, dans la région de Trencín, en Slovaquie occidentale. Il servit de résidence à de nombreux rois et nobles hongrois, qui nommèrent le château Bajmóci vár, jusqu'à ce qu'il soit transféré à la Tchécoslovaquie après le traité de Trianon en 1920 et acheté par Jan Antonín Bata de la Bata Shoe Company. Après la guerre, elle est devenue propriété de l'État conformément aux décrets Benes."

