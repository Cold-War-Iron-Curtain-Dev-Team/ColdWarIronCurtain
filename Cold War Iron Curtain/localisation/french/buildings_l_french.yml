 fossil_fuel_powerplant_desc: "Cette centrale électrique bon marché brûle §R-1§! £resources_strip|1 pour produire "
 renewable_powerplant_desc: "Cette centrale électrique coûteuse ne consomme aucune ressource pour produire"
 nuclear_powerplant_desc: "Cette centrale électrique consomme §R-1§! £resources_strip|6 pour produire"
 fusion_powerplant_desc: "Cette centrale électrique très coûteuse produit de grandes quantités d'énergie renouvelable"
 civilian_air_base_desc: "Les aéroports civils stimulent les parcs commerciaux et de bureaux. Construisez dans des États comportant de nombreux parcs de bureaux."
 state_infrastructure_desc: "L'infrastructure d'État augmente la production de ressources et l'offre de l'État (statistiques mises à jour mensuellement).\n§G+7%§! §YProduction de ressources§!\n§G+50 %§! §YDébit d'approvisionnement§!\n§GPeut parfois découvrir des gisements de ressources cachés§!\n§GProjets d'infrastructure de recherche pour augmenter le niveau maximum !§!"
 water_infrastructure_desc: "Les infrastructures hydrauliques offrent des bonus à la production agricole. Au moins 1 est requis pour une production complète §YComplexe agro-industriel§! £resources_strip|3 ! \nChaque niveau de §YInfrastructure hydraulique§! après le niveau 1 donne §G+25%§! §YComplexe agro-industriel§! £resources_strip|3 de sortie."
 agri_industrial_complex_desc: "Ce parc fournit de la nourriture à l'État. Production accrue avec des biomes fertiles.\nNécessite au moins 1 §YInfrastructure hydraulique§! pour produire une sortie complète £resources_strip|3 !\nA les résultats de base suivants en fonction de l'agrobiome de l'État :\n§YMontagnes désolées§! = §G0,5§!£resources_strip|3 \n§YDésert ou toundra§! = §G1§!£resources_strip|3 \n§YDésert luxuriant ou montagnes tempérées§! = §G2§!£resources_strip|3 \n§YBoréal§! = §G3§!£resources_strip|3 \n§YTempéré§! = §G4§!£resources_strip|3\n§YToute l'année§! = §G6§!£resources_strip|3\n"
 office_park_desc: "Coûts §R-1§! £resources_strip|7, §R-1§! £resources_strip|2 et §R-1§! £resources_strip|1. Les parcs de bureaux génèrent d'importants revenus mais aucune production industrielle. Bon pour payer les services publics et améliorer les revenus bien au-delà de ce que l'industrie fournit à elle seule."
 fuel_silo_desc: "(100 000 unités de carburant) Une réserve stratégique massive de carburant pour stocker de grandes quantités de carburants pétrochimiques utilisables. Ces installations sont généralement construites au sein de sites miniers abandonnés ou de grands silos artificiels."
 steel_factory_desc: "Coûte -1 £resources_strip|7 et -1 £resources_strip|1 pour raffiner le minerai impur en "
 tungsten_factory_desc: "Utilise -3 £resources_strip|7 et -1 £resources_strip|5 pour extraire des traces de métaux des terres rares à partir de minerais communs générant"
