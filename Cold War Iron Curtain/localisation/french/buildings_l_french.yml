 #LOGISTICS
 national_logistical_supercomputer: "Rapport sur la demande de ressources du NLSN"
 national_logistical_supercomputer_desc: "Le réseau national de supercalculateurs logistiques rapporte la demande totale de ressources nationales. Les ressources consommées sont les suivantes : §R$VALUE|Y0=$§!"
 petrochemicals_logistic_center: "Centre Logistique Pétrochimique"
 petrochemicals_logistic_center_desc: "§YCalcule la consommation et la production pétrochimiques une fois par mois.§!\nGère les systèmes logistiques des combustibles fossiles du pays, y compris les oléoducs et les expéditions."
 construction_registry_office: "Bureau d'enregistrement des constructions."
 construction_registry_office_desc: "§YCalcule la consommation et la production de métaux de construction une fois par mois.§!\nLe bureau d'enregistrement de la construction organise le zonage national et la réglementation de la construction. Gère également les lois sur le travail industriel et les inspections de construction."
 construction_permits_office: "Bureau des permis de construire"
 construction_permits_office_desc: "§YCalcule la consommation et la production de métaux légers une fois par mois.§!\nLe bureau des permis de construire est similaire au bureau d'enregistrement, sauf qu'il approuve les permis de construire et s'occupe des actifs commerciaux."
 energy_department_supercomputer: "Supercalculateur du Département de l'Énergie"
 energy_department_supercomputer_desc: "§YCalcule la consommation et la production d'électricité une fois par mois.§!\nLe supercalculateur du département de l'énergie gère le réseau électrique national et veille au bon entretien des centrales électriques."
 nuclear_materiel_supplier: "Fournisseur de matériel nucléaire"
 nuclear_materiel_supplier_desc: "§YCalcule la consommation et la production de matériel nucléaire une fois par mois.§!\n Le fournisseur de matériel nucléaire est une organisation militaire qui protège et distribue du matériel nucléaire à toutes les installations civiles et militaires qui en ont besoin."
 rare_material_broker: "Courtier en terres rares"
 rare_material_broker_desc: "§YCalcule la consommation et la production de terres rares une fois par mois.§!\nLe Rare Earth Broker est un réseau d'entreprises logistiques, de banques et d'intérêts miniers qui gèrent l'approvisionnement en matériaux rares dans le pays."
 farm_pulse: "Réseau Logistique Agro-Industriel"
 farm_pulse_desc: "§YCalcule la production alimentaire une fois par mois.§!\nLe réseau Logistique Agro-Industrielle gère et fournit tous les éléments de production et de transformation des aliments. L'AIL gère également les systèmes de traitement de l'eau du pays."
 Food_Need_Pulse: "Réseau de revendeurs agroalimentaires"
 Food_Need_Pulse_desc: "§YCalcule la consommation alimentaire une fois par mois.§!\nLe réseau d'agro-dealers est un système décentralisé d'intérêts agricoles qui gèrent la vente et la distribution de produits alimentaires à travers le pays."
 
