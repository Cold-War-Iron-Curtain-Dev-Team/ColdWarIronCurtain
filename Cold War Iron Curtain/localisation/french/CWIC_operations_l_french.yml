l_french:
 operation_sponsor_coup:0 "Parrainez le Coup d'État"
 operation_sponsor_coup_desc:0 "Ordonnez à notre agence de renseignement et à nos agents secrets de se coordonner avec les officiers militaires dissidents et les factions politiques en [FROM.GetName], en orchestrant un coup d'État pour renverser le régime actuel."
 operation_infiltrate_nuclear_program:0 "Programme d'infiltration nucléaire"
 operation_infiltrate_nuclear_program_desc:0 "Déployez des équipes de sabotage spécialisées dans les installations nucléaires de [FROM.GetName]pour endommager les réacteurs, perturber les centrifugeuses d'enrichissement et exfiltrer les données de la recherche scientifique."
 nuclear_espionage_bonus:0 "Plans de programme nucléaire"
 operation_covert_arms_drop:0 "Baisse secrète des armes"
 operation_covert_arms_drop_desc:0 "Affrétez des vols secrets et des couloirs de contrebande pour larguer par voie aérienne des armes légères, des explosifs et du matériel de communication aux combattants de la résistance antigouvernementale en [FROM.GetName]."
 operation_exfiltrate_defector:0 "Exfiltrer un transfuge de haut niveau"
 operation_exfiltrate_defector_desc:0 "Organisez un couloir d'extraction clandestin pour un diplomate ennemi, un officier du renseignement ou un scientifique principal de la défense de [FROM.GetName] afin de sécuriser des secrets d'État vitaux."
 defector_tech_insight:0 "Aperçus scientifiques des transfuges"
 USA_HISTORICAL_OPERATIVES:0 "Noms de code du renseignement américain"
 PRC_HISTORICAL_OPERATIVES:0 "Noms de code du renseignement chinois"
 ISR_HISTORICAL_OPERATIVES:0 "Noms de code des renseignements israéliens"
 DDR_HISTORICAL_OPERATIVES:0 "Noms de code du renseignement est-allemand"
 WGR_HISTORICAL_OPERATIVES:0 "Noms de code du renseignement ouest-allemand"
 RUS_HISTORICAL_OPERATIVES:0 "Noms de code du renseignement russe"
 operation_assassinate_commander:0 "Assassiner le commandant militaire"
 operation_assassinate_commander_desc:0 "Ordonnez à nos agents clandestins de terrain et à nos équipes de tireurs d'élite de traquer, de tendre une embuscade et d'éliminer un officier militaire supérieur en [FROM.GetName], semant ainsi le désarroi dans toute la chaîne de commandement ennemie."
 operation_assassinate_admiral:0 "Assassiner le commandant naval"
 operation_assassinate_admiral_desc:0 "Infiltrez le quartier général naval et les installations de commandement portuaire en [FROM.GetName] pour assassiner un amiral de haut rang de la flotte, perturbant ainsi gravement les opérations navales ennemies."
 operation_establish_black_site:0 "Créer un site noir clandestin"
 operation_establish_black_site_desc:0 "Construisez un avant-poste de renseignement et un centre d'interrogatoire hautement fortifié et officieux à moins de [FROM.GetName] sous couverture diplomatique ou commerciale, garantissant une portée opérationnelle continue."
 operation_sabotage_military_production:0 "Complexe de production militaire de sabotage"
 operation_sabotage_military_production_desc:0 "Déployez des agents de démolition d'élite pour infiltrer les usines de fabrication de défense en [FROM.GetName], en faisant exploser les machines-outils et les chaînes d'assemblage critiques."
 operation_sabotage_airfields:0 "Aérodrome militaire de sabotage"
 operation_sabotage_airfields_desc:0 "Infiltrez les bases aériennes et les pistes de première ligne ennemies à [FROM.GetName] sous le couvert de l'obscurité pour faire exploser les hangars, les dépôts de carburant et les avions de combat stationnés."
 operation_sabotage_naval_facilities:0 "Sabotage des installations navales et des chantiers navals"
 operation_sabotage_naval_facilities_desc:0 "Déployez des nageurs de combat et des équipes de sabotage secrètes dans les bases navales de [FROM.GetName]pour attacher des mines à patelles aux installations de quai et de cale sèche."
 operation_sabotage_naval_facilities_potential_tt:0 "Endommage les bases navales et les chantiers navals dans l'État cible."
 operation_sabotage_logistics_rail:0 "Sabotage du réseau ferroviaire et logistique"
 operation_sabotage_logistics_rail_desc:0 "Des saboteurs clandestins placent des explosifs plastiques à haut rendement le long des goulots d'étranglement ferroviaires vitaux, des gares de triage et des ponts à [FROM.GetName] pour étrangler les lignes d'approvisionnement militaires ennemies."
 operation_embed_advisors:0 "Intégrer des conseillers en guérilla"
 operation_embed_advisors_desc:0 "Insérez clandestinement des forces spéciales vétérans et des conseillers du renseignement dans [FROM.GetName] pour former, organiser et diriger des factions insurgées antigouvernementales dans des combats asymétriques."
 operation_counter_insurgency_sweep:0 "Balayage de sécurité contre-insurrectionnel"
 operation_counter_insurgency_sweep_desc:0 "Mobilisez les agents du renseignement et les paramilitaires de la sécurité intérieure pour mener des raids de grande envergure contre les cellules partisanes clandestines, arrêter les agitateurs subversifs et écraser la résistance locale."
 intelligency_agency_resistance_reduction_tt:0 "Opérations anti-insurrectionnelles : $VALUE|=-%0$"
