###Struggle Diplomacy Decisions###
Indochina_Struggle_ProInd_Backchannel_Talks: "Pourparlers en coulisses avec le Viet Minh"
Indochina_Struggle_ProInd_Backchannel_Talks_desc: "Des contacts discrets via des intermédiaires à Hong Kong et à Paris pourraient trouver un terrain d'entente avec Hanoï là où une diplomatie ouverte ne peut pas le faire. Chaque conversation qui a lieu autour d'une table n'a pas lieu sur un champ de bataille."
Indochina_Struggle_ProInd_International_Appeal: "Appel à la communauté internationale"
Indochina_Struggle_ProInd_International_Appeal_desc: "La cause du Vietnam mérite d'être entendue au-delà de l'Indochine. Les pétitions adressées aux Nations Unies et aux capitales sympathisantes renforceront la pression en faveur d'un règlement négocié et établiront notre gouvernement comme une voix responsable en faveur de la paix."
Indochina_Struggle_ProInd_Prisoner_Exchange: "Programme d'échange de prisonniers"
Indochina_Struggle_ProInd_Prisoner_Exchange_desc: "Un échange de prisonniers est un geste que les deux parties peuvent accepter sans perdre la face. Les familles réunies aujourd'hui plaident mieux en faveur d'un cessez-le-feu que n'importe quel communiqué."
Indochina_Struggle_ProInd_Denounce_Infiltration: "Dénoncer l'infiltration du Nord"
Indochina_Struggle_ProInd_Denounce_Infiltration_desc: "L'infiltration de cadres et d'armes à travers notre frontière ne peut rester sans réponse. Une dénonciation publique durcira notre position - et durcira le conflit avec elle."
Indochina_Struggle_ProInd_Propose_Peace_Conference: "Proposer une conférence internationale de la paix"
Indochina_Struggle_ProInd_Propose_Peace_Conference_desc: "Les tensions se sont suffisamment apaisées pour qu'un règlement général soit à portée de main. Nous demanderons formellement à Paris de convoquer une conférence internationale sur l'avenir de l'Indochine. La décision de négocier leur appartient en fin de compte, mais une proposition publique est difficile à ignorer."
Indochina_Struggle_Com_Peace_Overtures: "Prolonger les ouvertures de paix"
Indochina_Struggle_Com_Peace_Overtures_desc: "La lutte peut avancer aussi bien à la table des négociations que dans la jungle. Signaler une ouverture aux pourparlers ne nous coûte rien et suscite la sympathie à l'étranger."
Indochina_Struggle_Com_Call_For_Elections: "Appel aux élections nationales"
Indochina_Struggle_Com_Call_For_Elections_desc: "Exigez que l'avenir du Vietnam soit réglé par un scrutin. Que les colonialistes soient d'accord ou non, l'appel lui-même fait baisser la température et leur impose le fardeau du refus."
Indochina_Struggle_Com_Release_Prisoners: "Libérer les soldats capturés"
Indochina_Struggle_Com_Release_Prisoners_desc: "Libérer les soldats français et vietnamiens capturés démontre discipline et confiance. C'est un petit prix pour une grande victoire de propagande - et un pas en arrière par rapport au gouffre."
Indochina_Struggle_Com_Intensify_Struggle: "Intensifier la lutte armée"
Indochina_Struggle_Com_Intensify_Struggle_desc: "Le Parti appelle à une vigueur révolutionnaire renouvelée. Mobilisez les villages et pressez l'ennemi sur tous les fronts."
Indochina_Struggle_ProFra_Ceasefire_Lines: "Proposer des lignes de cessez-le-feu locales"
Indochina_Struggle_ProFra_Ceasefire_Lines_desc: "Les commandants locaux peuvent se mettre d'accord sur les lignes de démarcation où s'arrêtent les tirs, même sans règlement général. Chaque secteur calme est le fondement d'une paix plus large."
Indochina_Struggle_ProFra_Court_Opinion: "Opinion internationale de la Cour"
Indochina_Struggle_ProFra_Court_Opinion_desc: "La guerre en Indochine est de plus en plus impopulaire dans le pays et à l'étranger. Présenter la France comme la partie cherchant un règlement honorable allégera la pression sur le gouvernement et ouvrira les portes à Genève et à Washington."
Indochina_Struggle_ProFra_Amnesty_Programme: "Proposer des programmes d'amnistie"
Indochina_Struggle_ProFra_Amnesty_Programme_desc: "Les guérilleros qui déposeront les armes se verront offrir une amnistie et une réinstallation. Chaque combattant venant de la jungle est un de moins à combattre - et c'est la preuve que la paix est possible."
Indochina_Struggle_ProFra_Show_Of_Force: "Organisez une démonstration de force"
Indochina_Struggle_ProFra_Show_Of_Force_desc: "Une démonstration de la force du Corps expéditionnaire rappellera à nos ennemis que la France reste maîtresse du champ de bataille. Cela rappellera également à tous que la guerre est loin d'être terminée."
Indochina_Struggle_ProEth_Petition_The_Crown: "Pétition au domaine de la Couronne"
Indochina_Struggle_ProEth_Petition_The_Crown_desc: "Les hauts plateaux répondent à l'Empereur, pas à Saigon. Une pétition officielle adressée au domaine de la Couronne réaffirme cette distinction avant que quiconque dans le delta ne l'oublie et demande que nos terres restent à l'écart des combats."
Indochina_Struggle_ProEth_Assert_Customary_Law: "Faire valoir le droit coutumier"
Indochina_Struggle_ProEth_Assert_Customary_Law_desc: "Nos villages sont gouvernés par leurs propres tribunaux et par leurs propres aînés, comme ils l'étaient bien avant l'arrivée des Français et bien avant que Hanoï ne dresse ses cartes. La codification de cette affirmation rend désormais beaucoup plus difficile son effacement ultérieur."
Indochina_Struggle_ProEth_Highland_Truce: "Négocier une trêve dans les Highlands"
Indochina_Struggle_ProEth_Highland_Truce_desc: "Les deux armées veulent nos traces et aucune ne veut de notre loyauté. Une trêve qui maintient les colonnes hors de nos vallées ne nous coûte rien et achète une récolte aux villages."
Indochina_Struggle_ProEth_Levy_The_Villages: "Prélèvement des villages"
Indochina_Struggle_ProEth_Levy_The_Villages_desc: "Appelez les partisans de chaque hameau. Si les habitants des plaines ne respectent pas notre autonomie, ils respecteront les hommes qui détiennent les laissez-passer."
Indochina_Struggle_KMT_Court_The_Chinese_Quarter: "Courez dans le quartier chinois"
Indochina_Struggle_KMT_Court_The_Chinese_Quarter_desc: "Les marchands de Cholon financent la moitié du commerce du sud et leurs sympathies ne sont pas encore exprimées. Leur argent et leurs réseaux valent plus pour nous qu'un autre bataillon."
Indochina_Struggle_KMT_Appeal_To_Taipei: "Appel à Taipei"
Indochina_Struggle_KMT_Appeal_To_Taipei_desc: "Le Généralissime n'a pas oublié les divisions qui ont marché vers le sud plutôt que de se rendre. La reconnaissance de Taipei transformerait une armée de réfugiés en un gouvernement."
Indochina_Struggle_KMT_Tax_The_River_Trade: "Taxer le commerce fluvial"
Indochina_Struggle_KMT_Tax_The_River_Trade_desc: "Toutes les jonques du Mékong passent par nos terres. Un modeste prélèvement, collecté poliment, finance l'administration et rappelle au delta qui collecte."
Indochina_Struggle_KMT_Requisition_The_Delta: "Réquisitionner le Delta"
Indochina_Struggle_KMT_Requisition_The_Delta_desc: "Prenez le riz, les bateaux et les jeunes hommes de force. Cela nourrira l'armée tout au long de la saison et cela nous coûtera tous les amis que nous nous sommes fait."
Indochina_Struggle_Propose_Conference_TT: "La phase de désescalade §Y§! doit avoir plus de §C300 points§!"
Indochina_Struggle_Diplomacy_Cooldown_TT: "Notre camp a récemment fait une ouverture diplomatique §Y§!. Une autre initiative si tôt sonnerait creux."
