INDOCHINA_STRUGGLE_1_EFFECTS: "Le Vietnam est unifié sous le régime communiste, mettant fin à des décennies d'ingérence coloniale et étrangère."
INDOCHINA_STRUGGLE_2_EFFECTS: "Le Sud-Vietnam triomphe, unifiant la nation sous une direction anticommuniste."
INDOCHINA_STRUGGLE_3_EFFECTS: "La France maintient le contrôle à travers une structure fédérale, préservant ainsi son influence coloniale."
INDOCHINA_STRUGGLE_4_EFFECTS: "Le Vietnam est brisé en États concurrents, son unité étant perdue à jamais."
INDOCHINA_STRUGGLE_5_EFFECTS: "Une paix fragile émerge alors que le Nord et le Sud se réunissent dans le cadre d'un règlement négocié."
INDOCHINA_STRUGGLE_6_EFFECTS: "Grâce à un processus de réunification soigneusement orchestré, le Nord-Vietnam annexe le Sud-Vietnam et se transforme en un État démocratique unifié, refaçonnant l'avenir de la région avec le soutien américain."
INDOCHINA_STRUGGLE_7_EFFECTS: "Le Kuomintang remporte la victoire, apportant la vision nationaliste de la Chine au Vietnam."
INDOCHINA_STRUGGLE_8_EFFECTS: "La Conférence de Genève mettra fin à la première guerre d'Indochine par la voie diplomatique."
INDOCHINA_STRUGGLE_9_EFFECTS: "Le conflit fait rage sans fin, consumant l'Indochine dans une guerre perpétuelle."
INDOCHINA_STRUGGLE_10_EFFECTS: "L'effondrement complet de l'État laisse l'Indochine en ruines, sans vainqueur ni paix."
