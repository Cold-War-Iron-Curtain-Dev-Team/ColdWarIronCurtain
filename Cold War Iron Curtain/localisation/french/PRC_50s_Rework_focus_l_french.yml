 PRC_50s_Request_for_Naval_Assistance_from_The_USSR_desc:0 "Avec les effectifs actuels de la marine de l'Armée populaire de libération, il n'est pas possible d'obtenir une attaque contre nos navires de débarquement par les restes de la marine du Kuomintang. Nous solliciterons donc l'aide de la flotte du Pacifique de la Marine rouge soviétique."
 PRC_50s_Strengthen_The_Defence_of_The_Southeast_Coast_desc:0 "À la suite de la guerre de Corée, les impérialistes américains ont envoyé leur septième flotte pour patrouiller dans le détroit de Taiwan, et il n'y a aucune possibilité pour nos troupes de débarquer à nouveau à Taiwan dans un court laps de temps. Par conséquent, les mesures de défense le long de la côte sud-est devraient être renforcées pour empêcher l'infiltration d'agents ennemis"
 PRC_50s_Modern_Soviet_Combat_System_desc:0 "La modernisation de la défense nationale constitue une partie importante des quatre modernisations. Afin de réaliser la modernisation globale de la défense nationale, nous devons prendre l'Union soviétique comme professeur, apprendre le système de combat moderne de style soviétique, modifier nos méthodes de guerre locales d'origine et nous adapter à la situation de guerre moderne."
 PRC_50s_Agreement_with_the_SouthEast_Asia_Treaty_Organization_desc:0 "Le SETO a été créé pour contenir le socialisme en Asie, ce qui constitue en réalité une initiative des États-Unis visant à diviser l'Asie. Nous devons patiemment les persuader de baisser leur garde face à leurs compatriotes asiatiques, de respecter les Cinq principes de coexistence pacifique, d'unir les compatriotes asiatiques et de s'opposer à l'impérialisme."
 PRC_50s_Purge_Right-leaning_Elements_tt:0 "§RNous purgerons les éléments de droite§!"
 PRC_50s_Cross_The_Pride_Trap_tt:0 "§RNous traverserons le piège de la fierté§!"