l_french:
 PRC_50s_Accept_Using_The_Yangtze_as_A_Partition:0 "Acceptez « Diviser la gouvernance de part et d'autre du fleuve Yangtze »"
 PRC_50s_Accept_Using_The_Yangtze_as_A_Partition_desc:0 "Afin d'avoir une trêve avec nous, Li Zongren, président par intérim du gouvernement du Kuomintang, a avancé l'idée d'une trêve de « division de la gouvernance à travers le fleuve Yangtze », c'est-à-dire que le gouvernement communiste chinois et le gouvernement nationaliste cesseraient la guerre sur place avec le fleuve Yangtze comme frontière. Afin de permettre au peuple et au pays de se rétablir et d'éliminer d'un seul coup les réactionnaires du Kuomintang à l'avenir, nous ne pouvons qu'accepter cette condition. "
 PRC_50s_Launch_The_Crossing_Yangtze_River_Campaign:0 "Lancez la campagne pour la traversée du fleuve Yangtze"
 PRC_50s_Launch_The_Crossing_Yangtze_River_Campaign_desc:0 "Le KMT veut mettre fin à la guerre avant le fleuve Yangtze ? Ils n'ont plus cette chance ! Nous traverserons le fleuve Yangtsé et libérerons toute la Chine ! Personne ne peut aller à contre-courant de l'histoire !"
 PRC_50s_Liberate_The_Whole_of_China:0 "Libérez la Chine entière"
 PRC_50s_Liberate_The_Whole_of_China_desc:0 "Nous éliminerons d'un seul coup les réactionnaires du Kuomintang et construirons une nouvelle Chine !"
 PRC_50s_Launch_The_Chamdo_Battle:0 "Commencez la bataille de Chamdo"
 PRC_50s_Launch_The_Chamdo_Battle_desc:0 "En ce qui concerne les vieilles forces aristocratiques retranchées au Tibet, nous devrions adopter la mesure du « combat et des négociations ». Lors du lancement d'opérations militaires, nous devons activement contacter et négocier avec nos proches. Mais nous devons d'abord leur montrer la puissance du PLA......"
 PRC_50s_Trust_in_Gaxag:0 "Faites confiance au Kashgar"
 PRC_50s_Trust_in_Gaxag_desc:0 "Le gouvernement de Kashgar a activement échangé des vues et coopéré avec nous, et a également de l'expérience dans la gouvernance des régions tibétaines, alors pourquoi devrions-nous y renoncer ? Le gouvernement central a déjà pris la décision de leur permettre de conserver le pouvoir et de servir le peuple. Nous espérons qu'ils seront à la hauteur de notre confiance."
 PRC_50s_Send_Aid_to_Tibet:0 "Envoyer de l'aide au Tibet"
 PRC_50s_Send_Aid_to_Tibet_desc:0 "À l'heure actuelle, le niveau de développement du Tibet est relativement arriéré. Afin d'aider le Tibet à se moderniser plus rapidement et à mieux suivre le reste du pays, nous enverrons une aide au gouvernement de Kashgar afin d'améliorer les moyens de subsistance locaux."
 PRC_50s_Trust_in_The_Communist_Party_of_Tibet:0 "Faites confiance aux communistes du Tibet"
 PRC_50s_Trust_in_The_Communist_Party_of_Tibet_desc:0 "Le Comité central n'oubliera pas nos camarades du Tibet. Il ne fait aucun doute que l'ancien gouvernement aristocratique de Kashagr au Tibet n'est pas crédible, et nous devrions donner à ces camarades du Parti communiste qui ont combattu au Tibet les moyens de remplacer l'ancien gouvernement réactionnaire."
 PRC_50s_Grant_Limited_Autonomy_to_Tibet:0 "Accorder une autonomie limitée au Tibet"
 PRC_50s_Grant_Limited_Autonomy_to_Tibet_desc:0 "Nous pensons que les camarades du Parti communiste du Tibet sont non seulement totalement loyaux au PCC et à l'État, mais qu'ils sont également capables de gérer les affaires locales de manière efficace et rationnelle. C'est pourquoi le gouvernement central a pris la décision d'accorder au Tibet une autonomie limitée, une mesure qui apaisera davantage les Tibétains tout en permettant une paix et une prospérité durables dans la région."
 PRC_50s_Establish_The_Tibet_Working_Committee:0 "Créer le comité de travail sur le Tibet"
 PRC_50s_Establish_The_Tibet_Working_Committee_desc:0 "Afin de mieux gouverner le Tibet, le gouvernement central a approuvé la proposition de créer le Comité de travail du Tibet pendant la période de la bataille de Chamdo. Le camarade Zhang Guohua a été nommé secrétaire à cette époque. Plus tard, après plusieurs ajustements organisationnels, diverses organisations ont été intégrées au nouveau Comité de travail du Tibet, avec Zhang Jingwu en tant que secrétaire. La nouvelle organisation du Comité de travail du Tibet sera plus complète et améliorera en même temps la qualité des activités de développement et de propagande au Tibet."
 PRC_50s_Incorporate_CPT_into_CPC:0 "Fusionner le Parti communiste du Tibet avec le PCC"
 PRC_50s_Incorporate_CPT_into_CPC_desc:0 "Dans le contexte général de l'unification du Tibet, nos camarades du Parti communiste du Tibet ne peuvent plus maintenir une position indépendante par rapport au gouvernement central. Nous devons les intégrer rapidement dans notre parti afin de maintenir l'autorité du Comité central du Parti dans les affaires tibétaines et aussi pour permettre au gouvernement central de mieux guider le travail du parti au Tibet."
 PRC_50s_The_Last_Bastion_of_The_Kuomintang:0 "Le dernier bastion du Kuomintang"
 PRC_50s_The_Last_Bastion_of_The_Kuomintang_desc:0 "Bien que Chiang Kai-shek, le réactionnaire du Kuomintang, ait perdu toute influence sur le continent, il a occupé Taiwan, l'île située au sud-est du pays, et a même appelé à ce que Taiwan soit utilisée comme base pour atteindre l'objectif de \"contre-attaquer à partir d'une situation difficile\". Afin de réunifier Taiwan au sein de notre patrie et également de libérer son peuple, nous sommes prêts à commencer les préparatifs d'une attaque contre Taiwan."
 PRC_50s_Request_for_Naval_Assistance_from_The_USSR:0 "Demande d'assistance navale de l'URSS"
 PRC_50s_Prepare_Ships_for_Landing:0 "Préparer les navires pour l'atterrissage"
 PRC_50s_Prepare_Ships_for_Landing_desc:0 "Pour attaquer Taiwan, nous devons préparer tous les navires le long de la côte capables de transporter des personnes sur de longs voyages, mobiliser toutes les ressources et vaincre une fois pour toutes les réactionnaires du Kuomintang !"
 PRC_50s_Launch_The_Taiwan_Campaign:0 "Lancez la campagne à Taiwan"
 PRC_50s_Launch_The_Taiwan_Campaign_desc:0 "Le moment est venu de tester la capacité de combat de notre armée. Nous attaquerons Taiwan d'ici un mois, libérerons le peuple taïwanais et liquiderons les réactionnaires une fois pour toutes !"
 PRC_50s_Strengthen_The_Defence_of_The_Southeast_Coast:0 "Renforcer la défense de la côte sud-est"
 PRC_50s_Step_up_Socialist_Propaganda_for_Taiwan:0 "Intensifier la propagande socialiste pour Taiwan"
 PRC_50s_Step_up_Socialist_Propaganda_for_Taiwan_desc:0 "Comme l'action militaire n'est pas une option, nous pouvons modifier notre approche et lancer des émissions socialistes ciblant Taiwan, soulignant la nature bourgeoise du Kuomintang réactionnaire et son exploitation du peuple prolétaire taïwanais, dans l'espoir de réveiller le peuple de Taiwan."
 PRC_50s_Send_Spies_to_Infiltrate_Taiwan:0 "Envoyez des espions pour infiltrer Taiwan"
 PRC_50s_Send_Spies_to_Infiltrate_Taiwan_desc:0 "Afin de préparer le futur soulèvement du peuple de Taiwan ou une libération retardée de Taiwan, ce serait un bon choix de déployer des espions pour infiltrer les forces restantes du Kuomintang et le régime fantoche de Chiang Kai-shek afin de recueillir une quantité importante de renseignements militaires et politiques importants."
 PRC_50s_Support_for_The_Communist_Party_of_Taiwan:0 "Soutenez le Parti communiste de Taiwan"
 PRC_50s_Support_for_The_Communist_Party_of_Taiwan_desc:0 "Afin de promouvoir l'éveil et le soulèvement du peuple de Taiwan, le Comité central du Parti a décidé d'envoyer du personnel pour former les cadres du Parti communiste de Taiwan afin d'approfondir leur compréhension des théories communistes et d'apprendre les moyens de propagande et d'agitation."
 PRC_50s_Promote_The_Peaceful_Liberation_of_Sinkiang:0 "Promouvoir la libération pacifique du Xinjiang"
 PRC_50s_Promote_The_Peaceful_Liberation_of_Sinkiang_desc:0 "Après de longues négociations avec le gouvernement révolutionnaire des trois districts, ils ont officiellement déclaré la libération pacifique sous le régime de la République populaire de Chine. Nous avons réussi à éviter l'effusion de sang et avons fait un grand pas en avant sur la voie de l'unification !"
 PRC_50s_Retain_Three_Regions_Revolution_Government:0 "Conserver le gouvernement révolutionnaire des trois districts"
 PRC_50s_Retain_Three_Regions_Revolution_Government_desc:0 "Après mûre réflexion, le Comité central du Parti estime que le Xinjiang sous la direction d'Ehmetjan est efficace et soutient la patrie. Par conséquent, nous conserverons le gouvernement révolutionnaire des trois districts comme moyen pour le Xinjiang de réaliser l'autonomie et la prospérité sous la direction du Parti et de l'État."
 PRC_50s_Integrate_Three_Regions_Revolution_Government:0 "Incorporer le gouvernement révolutionnaire des trois districts en Chine"
 PRC_50s_Integrate_Three_Regions_Revolution_Government_desc:0 "En raison de la mort tragique du camarade Ehmetjan dans un accident d'avion, le gouvernement central, après discussion, a conclu que le gouvernement révolutionnaire des trois districts ne pouvait plus fonctionner efficacement, nous avons donc décidé de l'abolir et de le remplacer par une nouvelle administration locale générale."
 PRC_50s_Establish_Production_And_Construction_Corps_of_Xinjiang:0 "Création du Corps de production et de construction du Xinjiang"
 PRC_50s_Establish_Production_And_Construction_Corps_of_Xinjiang_desc:0 "Afin de mieux développer et construire le Xinjiang, et également de protéger le peuple Han local au Xinjiang, le Comité central du PCC a pris la décision importante de créer officiellement le Corps de production et de construction du Xinjiang. Le XPCC restera longtemps stationné au Xinjiang, mettra en oeuvre la politique d'intégration militaro-civile et défendra constamment la reconquête des frontières de la patrie."
 PRC_50s_Purge_Separatists_among_Ethnic_Minorities:0 "Un militant pour l'indépendance de Cleanse parmi les minorités ethniques"
 PRC_50s_Purge_Separatists_among_Ethnic_Minorities_desc:0 "Il existe une fausse idéologie qui prévaut parmi certaines minorités ethniques du Xinjiang, celle de l'indépendance du Xinjiang. Certains éléments religieux extrémistes estiment que le règne du PCC sur le Xinjiang a porté atteinte à l'islam et que le Xinjiang devrait devenir indépendant de la Chine afin de maintenir sa vie spirituelle traditionnelle. Cette vision est extrêmement erronée et nous devons imposer des mesures punitives aux militants indépendantistes qui partagent ces opinions, ainsi que limiter la propagation de cette tendance erronée."
 PRC_50s_Transform_Uighur_Mosque:0 "Réformer les mosquées ouïghoures"
 PRC_50s_Transform_Uighur_Mosque_desc:0 "Le Xinjiang est parsemé de mosquées ouïghoures et possède une forte atmosphère religieuse. Cela n'est pas en phase avec la politique de laïcisation du PCC et de l'État, et dans le même temps certaines mosquées sont devenues des sanctuaires pour des éléments indépendants du Xinjiang. Nous avons donc décidé de mener des activités de rénovation dans certaines mosquées obstinément conservatrices, en les transformant en équipements publics tels que des gouvernements régionaux ou des palais culturels, afin qu'elles puissent servir le public tout en combattant les tendances séparatistes."
 PRC_50s_Lessons_from_Three_Major_Campaigns:0 "Leçons de trois campagnes majeures"
 PRC_50s_Lessons_from_Three_Major_Campaigns_desc:0 "Au cours de la période décisive de la Guerre de libération nationale, trois batailles à grande échelle ont décidé du sort de notre pays, appelées « San Da Zhan Yi ». Bien que ces batailles se soient soldées par une victoire complète de l'APL, elles ont également révélé de nombreux problèmes de notre armée. Nous devons en tirer des leçons et améliorer nos tactiques et nos stratégies."
 PRC_50s_Establish_PLA_Air_Force:0 "Créer la PLAAF"
 PRC_50s_Establish_PLA_Air_Force_desc:0 "L'armée de l'air de notre parti a toujours été extrêmement réduite en nombre et en statut médiocre, avec quelques avions et pilotes qui ont fait défection du côté du Kuomintang. Le gouvernement populaire a donc pris la décision de créer l'armée de l'air de l'APL en tant que branche de l'armée, et le grand développement de notre force aérienne est en train de se réaliser."
 PRC_50s_Receive_War_Army_Surplus_Aircraft:0 "Recevez les avions restants après la guerre"
 PRC_50s_Receive_War_Army_Surplus_Aircraft_desc:0 "Lorsque les réactionnaires du Kuomintang se retirèrent du continent, les troupes de Chiang, qui s'enfuirent en toute hâte, laissèrent derrière elles un certain nombre d'avions excédentaires sur les aérodromes des villes côtières, et nous pourrions peut-être faire un usage acceptable de ces vieux avions. Les Soviétiques ont également promis de nous fournir quelques vieux avions excédentaires datant de la Seconde Guerre mondiale."
 PRC_50s_Learn_from_Modern_Air_Force_Experience:0 "Apprendre de l'expérience moderne de l'Armée de l'Air"
 PRC_50s_Learn_from_Modern_Air_Force_Experience_desc:0 "Nos nouveaux pilotes sont extrêmement inexpérimentés, n'ayant eu aucune exposition au combat aérien, et l'expérience des instructeurs est coincée dans l'ère des avions à hélices. Nous devrions envoyer des instructeurs en URSS pour apprendre les techniques avancées de combat des avions à réaction auprès de l'armée de l'air soviétique."
 PRC_50s_Establish_The_Ministry_of_Aviation_Industry:0 "Créer le ministère de l'industrie aéronautique"
 PRC_50s_Establish_The_Ministry_of_Aviation_Industry_desc:0 "Afin de mieux développer l'industrie chinoise de fabrication d'avions et de pièces détachées, le gouvernement populaire a décidé de créer un ministère spécial de l'industrie aéronautique pour gérer les questions connexes."
 PRC_50s_Improve_Naval_Bombing_Technology:0 "Améliorer la technologie des bombardements navals"
 PRC_50s_Improve_Naval_Bombing_Technology_desc:0 "La menace de la marine du Kuomintang sur nos zones côtières existait toujours et, pour faire face aux raids de ces navires, la Commission militaire de l'armée de l'air a décidé d'apprendre des Soviétiques et d'améliorer les techniques de bombardement des navires de guerre de notre armée de l'air."
 PRC_50s_Focus_on_Missile_Development:0 "Focus sur le développement de missiles"
 PRC_50s_Focus_on_Missile_Development_desc:0 "Le missile est une arme de la nouvelle ère et une tendance majeure dans le développement des armes dans le monde. Afin de combler les lacunes de notre armée de l'air en matière d'avions, nous devons vigoureusement renforcer nos investissements dans la recherche et le développement de missiles et nous efforcer de contourner la voie pour dépasser l'Empire des États-Unis et l'armée de Chiang Kai-shek'en dans la technologie des missiles."
 PRC_50s_Missiles_And_Aircraft_Go_Hand_in_Hand:0 "Missiles et avions vont de pair"
 PRC_50s_Missiles_And_Aircraft_Go_Hand_in_Hand_desc:0 "Il est vrai que les missiles sont les armes de la nouvelle ère, mais il est également vrai qu'ils constituent la tendance majeure dans le développement des armes dans le monde. Mais attacher de l'importance au développement et aux progrès des missiles ne signifie pas que nous devons négliger l'amélioration de nos avions obsolètes ni la recherche et le développement de nouveaux types d'avions. Ce n'est qu'ainsi que nous pourrons véritablement bâtir une force aérienne équilibrée."
 PRC_50s_PLAGF:0 "PLAA"
 PRC_50s_PLAGF_desc:0 "La force terrestre est la première branche de notre armée à être créée, et on peut dire qu'elle combat constamment depuis la Révolution terrestre. Ils constituent également la branche la plus puissante de notre armée à l'heure actuelle, et leur réforme sera sûrement couronnée de succès."
 PRC_50s_Formalize_Military_System:0 "Officialiser le système militaire"
 PRC_50s_Formalize_Military_System_desc:0 "Pendant la Guerre de Libération, notre armée disposait de nombreuses unités de milice et formations irrégulières, qui ont apporté de nombreuses contributions à la fondation de la Nouvelle Chine. Cependant, dans la nouvelle période de normalisation d'après-guerre, trop de formations différentes ont gêné notre gestion, c'est pourquoi le Comité central du PCC a décidé de régulariser entièrement l'armée."
 PRC_50s_Localization_of_Soviet_Design:0 "Localisation du design soviétique"
 PRC_50s_Localization_of_Soviet_Design_desc:0 "Notre meilleur partenaire, l'Union soviétique, nous a fourni un certain nombre de modèles d'armes et d'équipements, et afin de les produire rapidement et de moderniser les armes à action manuelle obsolètes de notre armée, nous devons accélérer le rythme de localisation de ces modèles."
 PRC_50s_Establish_Force_Publique_And_Air_Defence_Forces:0 "Création du ministère de la Sécurité publique et des Forces de défense aérienne"
 PRC_50s_Establish_Force_Publique_And_Air_Defence_Forces_desc:0 "Les forces de gendarmerie de l'ancien régime ont été discréditées et le Comité central du PCC a décidé de créer une « armée de sécurité publique » pour remplacer complètement la gendarmerie réactionnaire. Dans le même temps, afin de faire face au rôle croissant de l'armée de l'air dans la nouvelle ère de guerre, le Comité central du Parti a décidé de créer simultanément une force de défense aérienne dédiée à la défense aérienne."
 PRC_50s_Establish_The_Central_Military_Commission:0 "Créer la Commission militaire centrale"
 PRC_50s_Establish_The_Central_Military_Commission_desc:0 "Une fois la guerre complètement terminée, il sera nécessaire de créer un nouveau département chargé des affaires militaires, et le Comité central du PCC a décidé de nommer ce nouveau département la « Commission militaire », dont le camarade Mao Zedong sera le président."
 PRC_50s_Reinforce_Hierarchy:0 "Renforcer la hiérarchie"
 PRC_50s_Reinforce_Hierarchy_desc:0 "Comment une armée peut-elle combattre sans hiérarchie ? Si nous voulons réaliser la modernisation complète de notre Armée populaire de libération, nous devons renforcer la différence hiérarchique entre les commandants et les soldats ordinaires, afin que les soldats ordinaires puissent mieux obéir aux arrangements de commandement et renforcer l'autorité de direction des commandants sur les troupes auxquelles ils appartiennent."
 PRC_50s_Downplay_Hierarchy:0 "Minimiser la hiérarchie"
 PRC_50s_Downplay_Hierarchy_desc:0 "L'Armée populaire de libération, en tant qu'armée révolutionnaire, ne peut naturellement pas bénéficier d'un traitement différent entre officiers et soldats. Nous ne devons pas admettre de différences dans le traitement des officiers et des soldats, mais traiter tous les peuples sur un pied d'égalité, en permettant aux officiers et aux soldats de vivre et de s'entraîner ensemble, en construisant la famille militaire et en respectant les belles traditions de la période de la guerre révolutionnaire."
 PRC_50s_Men_Over_Material:0 "Les hommes sur le matériel"
 PRC_50s_Men_Over_Material_desc:0 "Les théories militaires indigènes développées pendant la guerre d'indépendance sont sans aucun doute plus adaptées à nos conditions nationales que la méthode de guerre soviétique. La plus importante de ces théories est la théorie « Les hommes avant le matériel », qui met l'accent sur la capacité de l'esprit et la volonté de combattre de nos troupes pour surmonter tous les obstacles naturels, et prône la propagation des actes glorieux de la Longue Marche et de la période Shaanbei afin de motiver les troupes à surmonter les difficultés matérielles."
 PRC_50s_Modern_Soviet_Combat_System:0 "Système de combat soviétique moderne"
 PRC_50s_Establish_PLAN:0 "Établir un PLAN"
 PRC_50s_Establish_PLAN_desc:0 "Aujourd'hui, le gouvernement populaire a pris la décision officielle de créer officiellement la marine de l'Armée populaire de libération sur la base des unités navales nationalistes qui ont fait défection et se sont révoltées. Ainsi commence l'ère de notre marine."
 PRC_50s_Receive_KMT_Ships:0 "Recevez des navires KMT"
 PRC_50s_Receive_KMT_Ships_desc:0 "Après la création de la Marine, de nombreuses autres unités navales nationalistes ont été informées de la révolte, et la nouvelle Marine a dû accélérer les progrès de la collecte des unités révoltées et de l'intégration des navires révoltés pour mieux les utiliser."
 PRC_50s_Dalian_Naval_School:0 "École navale de Dalian"
 PRC_50s_Dalian_Naval_School_desc:0 "Afin de former nos officiers de marine professionnels à construire, développer et commander notre marine de manière professionnelle. Le gouvernement populaire décida de créer une école navale spécialisée à Dalian avec l'aide de conseillers soviétiques."
 PRC_50s_The_Front_Line_of_Defence_Against_Imperialism:0 "La première ligne de défense contre l'impérialisme"
 PRC_50s_The_Front_Line_of_Defence_Against_Imperialism_desc:0 "Les eaux côtières de notre pays, où les activités de la clique de Chiang Kai-shek du Kuomintang et des impérialistes américains derrière elle sont les plus répandues, peuvent être considérées comme la première ligne de défense contre leurs attaques. C'est pourquoi nous devons renforcer la construction et les investissements dans les projets de défense côtière."
 PRC_50s_Upgrade_Conventional_Fleet:0 "Améliorer la flotte conventionnelle"
 PRC_50s_Upgrade_Conventional_Fleet_desc:0 "De nombreux navires de notre marine sont extrêmement obsolètes et certains ont même été construits au siècle dernier. Pour cette raison, nous devons renforcer vigoureusement la construction, la recherche et le développement de nouveaux navires, mettre à jour ces navires anciens et obsolètes dès que possible et moderniser notre flotte à un niveau avancé."
 PRC_50s_Focus_on_Surface_Ships:0 "Focus sur les navires de surface"
 PRC_50s_Focus_on_Surface_Ships_desc:0 "Quoi qu'il en soit, les navires de surface constituent le visage de la marine d'un pays. Notre pays ne doit pas laisser sa façade se détériorer et nous devons faire tout notre possible pour renforcer notre flotte de navires de surface, moderniser les vieux navires et en développer de nouveaux."
 PRC_50s_Expand_The_Submarine_Fleet:0 "Développez la flotte sous-marine"
 PRC_50s_Expand_The_Submarine_Fleet_desc:0 "Il est peu probable que la force navale de surface de notre marine rattrape la taille de la marine de Chiang dans cinq ou six ans, quelle que soit la quantité de construction et de fabrication. Par conséquent, nous devrions peut-être changer de direction et développer vigoureusement notre force sous-marine pour montrer à l'Empire américain et à Chiang Kai-shek la puissance de la flotte sous-marine."
 PRC_50s_A_Leap_Forward_for_The_Aviation_Industry:0 "Un bond en avant pour l'industrie aéronautique"
 PRC_50s_A_Leap_Forward_for_The_Aviation_Industry_desc:0 "L'industrie aéronautique chinoise est vraiment trop arriérée, le Comité central du Parti et la Commission militaire ont décidé d'investir vigoureusement dans la construction et le développement de l'industrie aéronautique dans un avenir proche avec l'aide de l'Union soviétique, et de réaliser un grand bond en avant dans l'industrie aéronautique."
 PRC_50s_Prepare_for_the_First_CPPCC:0 "Préparez-vous pour la première CCPPC"
 PRC_50s_Prepare_for_the_First_CPPCC_desc:0 ""
 PRC_50s_Production_Assurance_of_Newly_Receiving_Enterprises:0 "Assurance de production des entreprises nouvellement accueillies"
 PRC_50s_Production_Assurance_of_Newly_Receiving_Enterprises_desc:0 ""
 PRC_50s_Foundation_of_the_People_s_Republic_of_China:0 "Fondation de la République populaire de Chine"
 PRC_50s_Foundation_of_the_People_s_Republic_of_China_desc:0 "Lors de la cérémonie de fondation qui s'est tenue sur la place Tiananmen à Pékin à 15h00. le 1er octobre 1949, Mao Zedong a proclamé la création du gouvernement populaire central de la République populaire de Chine depuis la citadelle de la place Tiananmen, et la République populaire de Chine a été officiellement créée."
 PRC_50s_Found_The_People_s_Republic_of_China:0 "$PRC_50s_Foundation_of_the_People_s_Republic_of_China$"
 PRC_50s_Found_The_People_s_Republic_of_China_desc:0 ""
 PRC_50s_Heal_The_Wounds_of_War:0 "Guérir les blessures de la guerre"
 PRC_50s_Heal_The_Wounds_of_War_desc:0 "Notre pays traverse la guerre presque chaque année depuis 20 ans et les gens souffrent de la misère du peuple, nous devrions développer l'économie pour ramener notre pays à la vie."
 PRC_50s_The_Campaign_to_Suppress_Counterrevolutionaries:0 "Campagne pour réprimer les contre-révolutionnaires"
 PRC_50s_The_Campaign_to_Suppress_Counterrevolutionaries_desc:0 "\"Ne perdez pas ce moment, j'ai peur que la répression de la contre-révolution n'arrive qu'une fois, et plus jamais. C'est une opportunité unique dans une vie, vous devriez donc faire bon usage de ce capital, non seulement pour tuer quelques contre-révolutionnaires, mais surtout pour mobiliser les masses.\""
 PRC_50s_Retain_Old_KMT_Administrative_officials:0 "Conserver les anciens responsables administratifs du KMT"
 PRC_50s_Retain_Old_KMT_Administrative_officials_desc:0 "Le gouvernement du Kuomintang nous a légué une réserve inépuisable de talents politiques et techniques, et nous pouvons changer leur mentalité afin qu'ils puissent servir le peuple et notre patrie."
 PRC_50s_Abolish_Imperialist_Political_Privilege:0 "Abolir les privilèges politiques impérialistes"
 PRC_50s_Abolish_Imperialist_Political_Privilege_desc:0 "Les pays impérialistes bénéficiaient autrefois d'innombrables privilèges dans notre Chine, mais maintenant que la Chine et son peuple se sont levés, nous devons dire non à ces privilèges."
 PRC_50s_Cadre_Crash_School:0 "École de formation accélérée des cadres"
 PRC_50s_Cadre_Crash_School_desc:0 "Afin de stabiliser le pouvoir populaire naissant, nous devons accélérer la formation des cadres afin que le gouvernement puisse fonctionner normalement dans les plus brefs délais."
 PRC_50s_Arrange_for_Cadres_to_Go_South:0 "Déployer des cadres dans le sud de la Chine"
 PRC_50s_Arrange_for_Cadres_to_Go_South_desc:0 "Nous voulons stabiliser la situation dans le Sud, c'est pourquoi nous devons envoyer des cadres dans le Sud, ce qui nous permettra de mieux contrôler le Sud."
 PRC_50s_Confiscate_Imperialist_Property:0 "Confisquer les avoirs des impérialistes"
 PRC_50s_Confiscate_Imperialist_Property_desc:0 "Nous confisquerons les biens de ces pays impérialistes et les donnerons à notre peuple et au développement de la Chine nouvelle."
 PRC_50s_Manage_Foreign_Media_System:0 "Gérer le système des médias étrangers"
 PRC_50s_Manage_Foreign_Media_System_desc:0 "Nous contrôlerons l'influence de ces médias étrangers en Chine et conserverons les voix les plus impartiales, ce qui est bon pour la vie de notre peuple."
 PRC_50s_Purify_The_Party_Rank:0 "Purifier les rangs du parti"
 PRC_50s_Purify_The_Party_Rank_desc:0 "Nous éliminerons les ordures du parti, nettoierons notre parti et servirons le peuple de tout coeur."
 PRC_50s_Reclaim_Foreign_Funding_Agencies:0 "Récupérer les agences financées par l'étranger"
 PRC_50s_Reclaim_Foreign_Funding_Agencies_desc:0 "Nous devons reprendre ce que ces étrangers ont construit, le mettre à profit pour le peuple, puis tracer notre propre voie."
 PRC_50s_Catholic_Patriotic_Rehabilitation_Movement:0 "Le mouvement patriotique catholique d'auto-renouvellement"
 PRC_50s_Catholic_Patriotic_Rehabilitation_Movement_desc:0 "« Renforcez l'unité au sein et à l'extérieur de l'Église, fournissez des services pour bien gérer l'Église chinoise, guidez les chrétiens de tout le pays pour qu'ils jouent un rôle actif dans la construction d'une société socialiste harmonieuse et faites en sorte que le christianisme chinois s'adapte à la société socialiste."
 PRC_50s_Transforming_Old_Bureaucrats:0 "Réformer les vieux bureaucrates"
 PRC_50s_Transforming_Old_Bureaucrats_desc:0 "Nous transformerons certains fonctionnaires locaux qui ont commis des erreurs dans le passé afin qu'ils puissent s'adapter à notre patrie socialiste et servir à nouveau le peuple."
 PRC_50s_Promote_Officials_of_Peasant_Origin:0 "Promouvoir les bureaucrates issus de milieux paysans"
 PRC_50s_Promote_Officials_of_Peasant_Origin_desc:0 "Les agriculteurs constituent une partie importante de notre patrie socialiste. Nous devons promouvoir les fonctionnaires ayant le statut de paysan afin qu'ils puissent jouer un rôle exemplaire et encourager les gens à travailler dur."
 PRC_50s_Campaign_to_Eliminate_Counterrevolutionaries:0 "Éliminer le mouvement contre-révolutionnaire"
 PRC_50s_Campaign_to_Eliminate_Counterrevolutionaries_desc:0 "Nous devons éliminer la contre-révolution dans tout le pays et construire une nouvelle patrie, afin que notre peuple ne subisse aucun préjudice."
 PRC_50s_Literacy_Movement:0 "Mouvement d'alphabétisation"
 PRC_50s_Literacy_Movement_desc:0 "Après la victoire de la révolution, nous éradiquerons l'analphabétisme dans le pays et aiderons les analphabètes à apprendre grâce à des campagnes d'alphabétisation gratuites dans les campagnes."
 PRC_50s_Introduce_System_Linking_Salary_to_Rank:0 "Mettre en oeuvre un système de salaire progressif"
 PRC_50s_Introduce_System_Linking_Salary_to_Rank_desc:0 "Nous devons mettre en oeuvre une répartition selon le travail et répartir les différents salaires en les divisant en différents échelons. Cela aidera les gens à s'intéresser davantage à leur travail."
 PRC_50s_Continue_Ration_System:0 "Garder le système de rationnement"
 PRC_50s_Continue_Ration_System_desc:0 "Le travail révolutionnaire ne peut pas être accompli du jour au lendemain. Nous devons continuer à pratiquer une répartition équitable des moyens de production et ne pas permettre que la richesse tombe entre les mains de quelques-uns."
 PRC_50s_Abolish_Backward_Customs:0 "Abolir les douanes arriérées"
 PRC_50s_Abolish_Backward_Customs_desc:0 "Certaines vieilles coutumes sont empreintes des contraintes idéologiques de la dynastie féodale. Nous devons abolir ces mauvaises coutumes et transformer la vie des gens en socialisme."
 PRC_50s_Consolidate_Urban_and_Rural_Party_Organisations:0 "Consolider les organisations du parti"
 PRC_50s_Consolidate_Urban_and_Rural_Party_Organisations_desc:0 "Nous devons consolider notre position dans les villes et les campagnes et ne pas laisser le pouvoir tomber entre les mains de réactionnaires et d'éléments mauvais."
 PRC_50s_Improve_The_Status_of_Workers:0 "Élever le statut des travailleurs"
 PRC_50s_Improve_The_Status_of_Workers_desc:0 "Les travailleurs sont les maîtres de notre pays, nous devons bien les traiter et élever leur statut, et ils travailleront dur en échange de nous."
 PRC_50s_Transform_Intellectuals:0 "Transformer les intellectuels"
 PRC_50s_Transform_Intellectuals_desc:0 "Les intellectuels constituent une partie importante d'un pays et nous devons réformer leur pensée afin qu'ils puissent servir le socialisme."
 PRC_50s_Find_out_The_Class_Composition_of_Urban_Residents:0 "Enquête sur la composition des classes des résidents urbains"
 PRC_50s_Find_out_The_Class_Composition_of_Urban_Residents_desc:0 "Nous devons identifier la population urbaine et comprendre son nombre et ses besoins afin de mieux formuler les politiques du Parti et de l'État."
 PRC_50s_Extend_The_Scope_of_Scrutiny_of_The_Masses:0 "Élargir l'examen du public"
 PRC_50s_Extend_The_Scope_of_Scrutiny_of_The_Masses_desc:0 "Nous examinerons plus strictement les éléments hostiles qui se cachent parmi le peuple et les éliminerons des rangs du peuple, afin de nous rendre un pays propre."
 PRC_50s_Social_Education_Movement:0 "Mouvement d'éducation sociale"
 PRC_50s_Social_Education_Movement_desc:0 "Nous éduquerons certains éléments indésirables de la société et les ferons obéir et servir le socialisme."
 PRC_50s_National_Census:0 "Mener un recensement à l'échelle nationale"
 PRC_50s_National_Census_desc:0 "Depuis la chute de la dynastie Qing, la Chine n'a pas étudié la population depuis plus de 30 ans. Afin de mieux formuler la politique du parti, nous devons enquêter sur la population de tout le pays."
 PRC_50s_Adopt_The_New_People_s_Constitution:0 "Adopter la nouvelle Constitution populaire"
 PRC_50s_Adopt_The_New_People_s_Constitution_desc:0 "Nous élaborerons une nouvelle constitution, qui sera la première constitution de l'histoire de la Chine qui sera dominée par le peuple, et le peuple ne sera jamais maître de ce pays."
 PRC_50s_Conduct_Elections_at_The_Basic_Level:0 "Organiser des élections populaires"
 PRC_50s_Conduct_Elections_at_The_Basic_Level_desc:0 "Nous aurons des élections dans la société qui contribueront à l'achèvement de la démocratie populaire."
 PRC_50s_Classify_Peasant_as_Semi-proletariat:0 "Classer le paysan comme semi-prolétariat"
 PRC_50s_Classify_Peasant_as_Semi-proletariat_desc:0 "Les paysans possèdent leurs propres terres privées, ce qui est complètement différent des moyens de production possédés par les travailleurs des villes. Nous devons donc changer notre façon de penser les paysans."
 PRC_50s_Be_Wary_of_Spontaneous_Tendencies_Towards_Capitalism_among_Peasants:0 "Soyez vigilant face aux tendances spontanées capitalistes des paysans"
 PRC_50s_Be_Wary_of_Spontaneous_Tendencies_Towards_Capitalism_among_Peasants_desc:0 "Les agriculteurs qui acquièrent des terres peuvent facilement dégénérer et évoluer vers le capitalisme, et nous devons y mettre un terme."
 PRC_50s_Negate_Agricultral_Socialism:0 "Nier le socialisme agricole"
 PRC_50s_Negate_Agricultral_Socialism_desc:0 "Nous ne devons pas seulement penser aux paysans, mais aussi aux travailleurs et aux autres personnes vivant dans les villes, afin que le socialisme ne soit pas dominé par les paysans."
 PRC_50s_Support_The_Agricultural_Cooperative_Economy:0 "Soutenir l'économie coopérative agricole"
 PRC_50s_Support_The_Agricultural_Cooperative_Economy_desc:0 "Les agriculteurs sont le fondement d'un pays. Nous devons soutenir leur cause et intégrer leurs forces."
 PRC_50s_Advocate_Independent_Labour_Union:0 "Défenseur d'un syndicat indépendant"
 PRC_50s_Advocate_Independent_Labour_Union_desc:0 "Nous pourrions permettre aux travailleurs de former leurs propres syndicats, ce qui protégerait leurs droits et augmenterait la productivité."
 PRC_50s_Insist_on_State_Control_of_Labour_Union:0 "Insistez sur le contrôle de l'État sur le syndicat"
 PRC_50s_Insist_on_State_Control_of_Labour_Union_desc:0 "Les syndicats sont une force vulnérable à l'influence étrangère et nous devons créer des syndicats sous la direction du gouvernement afin de pouvoir stabiliser notre pays."
 PRC_50s_Advocate_Factory_Director_Responsibility_System:0 "Mettre en oeuvre le système de responsabilité des directeurs d'usine"
 PRC_50s_Advocate_Factory_Director_Responsibility_System_desc:0 "Nous devrions déléguer davantage de pouvoir au directeur de l'usine, afin de faciliter le fonctionnement et la coordination de l'usine."
 PRC_50s_Adhere_to_The_Party_Committee_Responsibility_System:0 "Adhérer au système de responsabilité du comité du parti d'usine"
 PRC_50s_Adhere_to_The_Party_Committee_Responsibility_System_desc:0 "Nous devons garder fermement le fonctionnement de l'usine entre les mains du Parti, afin que nous puissions connaître la situation réelle de l'usine."
 PRC_50s_Move_Towards_Socialism:0 "Ouvrir la construction du socialisme à grande échelle"
 PRC_50s_Move_Towards_Socialism_desc:0 "Nous avons pratiquement achevé la transformation de l'ancienne société et il est temps de commencer à avancer vers le socialisme sous tous ses aspects."
 PRC_50s_Boost_Economic_Confidence:0 "Renforcer la confiance économique"
 PRC_50s_Boost_Economic_Confidence_desc:0 "Nous avons réalisé de nombreux progrès économiques au cours des dernières années et nous devons continuer à oeuvrer pour renforcer notre confiance dans l'économie."
 PRC_50s_Guarantee_Private_Factory_Orders:0 "Commandes de garantie pour les usines privées"
 PRC_50s_Guarantee_Private_Factory_Orders_desc:0 "En construisant le socialisme, nous ne devons pas oublier ces usines non publiques ; nous devons assurer leur survie."
 PRC_50s_Expand_China_s_Railway_Network:0 "Étendre le réseau ferroviaire chinois"
 PRC_50s_Expand_China_s_Railway_Network_desc:0 "Nous élargirons notre réseau ferroviaire, ce qui nous aidera à développer notre économie."
 PRC_50s_Launch_Electrification_Campaign:0 "Lancement d'une campagne d'électrification"
 PRC_50s_Launch_Electrification_Campaign_desc:0 "Nous construirons un pays moderne et l'électrification est essentielle."
 PRC_50s_Exploit_China_s_Resources:0 "Exploiter les ressources minérales chinoises"
 PRC_50s_Exploit_China_s_Resources_desc:0 "Nous exploiterons notre vaste et abondante patrie et mettrons ces ressources minérales au service de la construction d'un pays socialiste."
 PRC_50s_Confiscate_Bureaucratic_Capital_Enterprises:0 "Confisquer les entreprises capitalistes bureaucratiques"
 PRC_50s_Confiscate_Bureaucratic_Capital_Enterprises_desc:0 "Maintenant, nous devons agir contre ces capitalistes, sinon ils continueront à exploiter le peuple de la nouvelle Chine."
 PRC_50s_Solve_The_Food_Crisis:0 "Faire face à la crise de l'approvisionnement alimentaire"
 PRC_50s_Solve_The_Food_Crisis_desc:0 "L'alimentation est indispensable au fonctionnement normal d'une société. Nous devons résoudre cette crise alimentaire et permettre aux gens de manger et de boire à leur faim."
 PRC_50s_Ration_System_of_Oil_Grain_And_Cotton:0 "Mettre en oeuvre un système de rationnement de l'huile, des céréales et du coton"
 PRC_50s_Ration_System_of_Oil_Grain_And_Cotton_desc:0 "C'est une période critique pour le pays, nous voulons économiser autant de nourriture que possible, nous avons donc décidé de rationaliser."
 PRC_50s_The_System_of_State_Monopoly_for_Purchase_And_Marketing:0 "Établir un système d'achat et de vente unifié"
 PRC_50s_The_System_of_State_Monopoly_for_Purchase_And_Marketing_desc:0 "Nous devons concentrer nos ressources alimentaires afin qu'elles ne soient pas gaspillées et que les gens puissent manger à leur faim."
 PRC_50s_Renminbi_Currency_Reform:0 "Réforme du renminbi"
 PRC_50s_Renminbi_Currency_Reform_desc:0 "Nous devons mettre fin aux politiques monétaires chaotiques du passé, émettre une nouvelle monnaie et modifier la structure monétaire."
 PRC_50s_Land_Reform:0 "Mouvement de réforme agraire"
 PRC_50s_Land_Reform_desc:0 ""
 PRC_50s_Organise_Procurement_of_Agricultural_Products:0 "Organiser l'approvisionnement obligatoire des produits agricoles"
 PRC_50s_Organise_Procurement_of_Agricultural_Products_desc:0 ""
 PRC_50s_Demarcate_Semi-landlord_Rich_Farmer:0 "Démarcation des paysans riches de type semi-propriétaire"
 PRC_50s_Demarcate_Semi-landlord_Rich_Farmer_desc:0 ""
 PRC_50s_Introduce_The_Concept_of_Neutral_Rich_Farmer:0 "Proposer le concept de neutralisation de la classe agricole riche"
 PRC_50s_Introduce_The_Concept_of_Neutral_Rich_Farmer_desc:0 "Un élément important du mouvement de réforme agraire était la division de la composition des classes à la campagne, divisant la population rurale en paysans salariés, paysans pauvres, paysans moyens, paysans riches et propriétaires fonciers. Les paysans pauvres et les paysans salariés étaient les objets de la réforme agraire, les paysans moyens étaient les objets de la solidarité, tandis que les paysans riches neutres et les propriétaires terriens étaient désignés comme la classe exploiteuse et étaient les objets de la réforme agraire."
 PRC_50s_Promote_Water_Conservancy_Construction:0 "Promouvoir la construction de Cater Conservancy"
 PRC_50s_Promote_Water_Conservancy_Construction_desc:0 "Au moment de la fondation du gouvernement populaire, la politique fondamentale de construction de réserves d'eau était définie comme étant « la prévention des inondations et la construction de réserves d'eau dans le but de développer substantiellement la production »."
 PRC_50s_One-size-fits-all_for_landlords:0 "« Taille unique » pour les propriétaires"
 PRC_50s_One-size-fits-all_for_landlords_desc:0 ""
 PRC_50s_Distinguish_between_Categories_of_landlord:0 "Distinguer les catégories de propriétaires"
 PRC_50s_Distinguish_between_Categories_of_landlord_desc:0 ""
 PRC_50s_Expand_The_Struggle_against_landlord:0 "Intensifier la lutte contre les propriétaires"
 PRC_50s_Expand_The_Struggle_against_landlord_desc:0 "Malgré la défaite du régime du Kuomintang sur le continent, la classe des propriétaires terriens ne voulait pas perdre son ancienne domination et ses intérêts économiques dans les campagnes et il fallait se concentrer sur eux."
 PRC_50s_Strictly_Restrain_The_Struggle_against_landlord:0 "Limiter strictement la lutte anti-propriétaire"
 PRC_50s_Strictly_Restrain_The_Struggle_against_landlord_desc:0 "Afin d'éviter davantage la tendance à porter un coup trop large dans une campagne de réforme agraire à grande échelle, nous pouvons adopter des mesures consistant à isoler les propriétaires fonciers, à laisser les paysans riches intacts, à protéger les paysans moyens et à stabiliser la bourgeoisie nationale pour garantir l'avancement constant de la réforme agraire."
 PRC_50s_Co-operative_Transformation_of_Agriculture:0 "Transformation de l'agriculture en coopérativisation"
 PRC_50s_Co-operative_Transformation_of_Agriculture_desc:0 "Nous transformerons l'économie agricole individuelle basée sur la propriété privée des moyens de production en une économie coopérative agricole basée sur la propriété publique des moyens de production à travers diverses formes d'assistance mutuelle et de coopération."
 PRC_50s_Accelerate_The_Process_of_Co-operation:0 "Accélérer le processus de coopérativisation"
 PRC_50s_Accelerate_The_Process_of_Co-operation_desc:0 "Les progrès de notre coopérativisation ont largement dépassé nos attentes, et comme les campagnes connaissent successivement un niveau élevé de révolution socialiste, nous devrions profiter de cette occasion pour accélérer le développement de la coopérativisation."
 PRC_50s_Control_The_Process_of_Co-operation:0 "Contrôler les progrès de la coopérativisation"
 PRC_50s_Control_The_Process_of_Co-operation_desc:0 "Nous avons tendance à être impatients et aventureux dans le développement du mouvement d'entraide et de coopération agricoles, et nous sommes pressés d'obtenir de plus en plus de résultats dans le domaine de la coopération agricole. Afin de corriger cette tendance, nous devrions suspendre le développement partout, nous concentrer sur la consolidation et contracter dans quelques domaines."
 PRC_50s_Complete_Rural_Co-operation:0 "Coopératives rurales complètes"
 PRC_50s_Complete_Rural_Co-operation_desc:0 "Depuis la fin de 1949, après trois phases du mouvement coopératif, 96,3 pour cent des ménages agricoles du pays ont adhéré à des coopératives et le gouvernement communiste a achevé avec succès la coopérative des campagnes."
 PRC_50s_Unite_The_National_Bourgeoisie:0 "Unité avec la Bourgeoisie Nationale"
 PRC_50s_Unite_The_National_Bourgeoisie_desc:0 "En partant du principe d'adhérer à la direction du prolétariat, nous pouvons adopter la politique « d'unité et de lutte » et de « lutte pour l'unité » à leur égard, et construire un front uni avec le Parti communiste."
 PRC_50s_Oppose_The_Industrial_And_Commercial_Big_Bourgeoisie:0 "Opposons-nous à la grande bourgeoisie de l'industrie et du commerce"
 PRC_50s_Oppose_The_Industrial_And_Commercial_Big_Bourgeoisie_desc:0 ""
 PRC_50s_Negate_Giving_Consideration_to_Both_Public_And_Private_Interests:0 "Annuler la promesse d'une économie mixte"
 PRC_50s_Negate_Giving_Consideration_to_Both_Public_And_Private_Interests_desc:0 ""
 PRC_50s_Reconcile_Labour_Conflicts:0 "Réconcilier les conflits travail-capital"
 PRC_50s_Reconcile_Labour_Conflicts_desc:0 ""
 PRC_50s_Anti-bureaucratic_Corruption:0 "Lutte contre la corruption et la décadence bureaucratique"
 PRC_50s_Anti-bureaucratic_Corruption_desc:0 ""
 PRC_50s_Equal_Public_And_Private_Taxation:0 "Fiscalité égale pour les secteurs publics et privés"
 PRC_50s_Equal_Public_And_Private_Taxation_desc:0 ""
 PRC_50s_Tilt_towards_Public_Ownership_in_Taxation:0 "Inclinaison vers les industries publiques en matière de fiscalité"
 PRC_50s_Tilt_towards_Public_Ownership_in_Taxation_desc:0 ""
 PRC_50s_Peace_Redemption_of_Capitalist_Industry_And_Commerce:0 "Rédemption par la paix de l'industrie et du commerce capitalistes"
 PRC_50s_Peace_Redemption_of_Capitalist_Industry_And_Commerce_desc:0 "Le PCC a adopté une politique de « rédemption pacifique » des industries et des entreprises capitalistes, les transformant progressivement en entreprises publiques socialistes par le biais du capitalisme d'État."
 PRC_50s_Anti-Capitalist_Movement:0 "Mouvement anticapitaliste"
 PRC_50s_Anti-Capitalist_Movement_desc:0 ""
 PRC_50s_Establish_State_Planning_Commission:0 "Créer la Commission nationale de planification"
 PRC_50s_Establish_State_Planning_Commission_desc:0 "Afin de réaliser une planification globale de la construction économique, la 19e réunion du Conseil du gouvernement populaire central a adopté une résolution visant à ajouter la Commission nationale de planification du gouvernement populaire central, ou en abrégé la Commission nationale de planification, qui est indépendante du Conseil d'État des gouvernements populaires centraux."
 PRC_50s_Combat_Decentralism:0 "Combattre le décentralisme"
 PRC_50s_Combat_Decentralism_desc:0 ""
 PRC_50s_Flat_The_Economic_Sector:0 "Plat le secteur économique"
 PRC_50s_Flat_The_Economic_Sector_desc:0 ""
 PRC_50s_Limit_The_Power_of_The_Planning_Commission:0 "Limiter le pouvoir de la commission de planification"
 PRC_50s_Limit_The_Power_of_The_Planning_Commission_desc:0 ""
 PRC_50s_Reclaim_Economic_Power_to_The_Planning_Commission:0 "Récupérer le pouvoir économique de la Commission de planification"
 PRC_50s_Reclaim_Economic_Power_to_The_Planning_Commission_desc:0 ""
 PRC_50s_Public-Private_Partnership_by_Whole_Trades:0 "Mettre en oeuvre des partenariats public-privé complets"
 PRC_50s_Public-Private_Partnership_by_Whole_Trades_desc:0 "Entre 1953 et 1956, après trois années de transformation, le degré de transformation de l'industrie et du commerce capitalistes en Chine avait atteint plus de 90 pour cent, achevant ainsi la transformation socialiste de l'industrie et du commerce capitalistes."
 PRC_50s_Establish_Socialist_System:0 "Créer la Fondation économique socialiste"
 PRC_50s_Establish_Socialist_System_desc:0 ""
 PRC_50s_The_First_Five-year_Plan:0 "Lancer le premier plan quinquennal"
 PRC_50s_The_First_Five-year_Plan_desc:0 "Afin de faciliter la transition du pays de la nouvelle démocratie au socialisme, de se concentrer sur l'industrialisation et d'accélérer la transformation socialiste de tous les secteurs économiques, le premier plan quinquennal du pays a été adopté par les départements centraux et officiellement lancé."
 PRC_50s_Develop_Frontier_Areas:0 "Développer les zones frontalières"
 PRC_50s_Develop_Frontier_Areas_desc:0 "Après la fondation de la Chine nouvelle, la plupart des zones frontalières de la Chine sont encore en retard en matière de développement, et il convient de prêter attention au développement des zones frontalières afin que les habitants des zones frontalières puissent également mener une vie matériellement aisée !"
 PRC_50s_Expand_Mainland_Infrastructure:0 "Développer la construction d'infrastructures sur le continent"
 PRC_50s_Expand_Mainland_Infrastructure_desc:0 "L'intérieur de la Chine est une partie importante de notre construction économique, le mouvement de réforme agraire a jeté de bonnes bases pour la construction de l'intérieur, nous devons nous saisir de la construction de l'expansion de l'intérieur de notre pays à chaque minute et à chaque seconde."
 PRC_50s_Construct_Synthetic_Rubber_Plants:0 "Construire des usines de caoutchouc synthétique"
 PRC_50s_Construct_Synthetic_Rubber_Plants_desc:0 "Le caoutchouc, en tant que matière première industrielle importante, occupe une place cruciale dans notre économie nationale. Son application étendue revêt pour nous une grande importance et il est impératif d'autoriser la construction d'usines de caoutchouc synthétique."
 PRC_50s_Invest_in_Heavy_Industry:0 "Investir dans l'industrie lourde"
 PRC_50s_Invest_in_Heavy_Industry_desc:0 "Sur la base des tensions intérieures et extérieures et de l'expérience avancée de l'Union soviétique, le développement de l'industrie lourde est désormais pour nous une urgence et nous devrions tendre à concentrer notre développement industriel sur l'industrie lourde afin de sauvegarder notre indépendance politique et notre sécurité de défense nationale."
 PRC_50s_Construct_Thermal_Power_Plants:0 "Construire des centrales thermiques"
 PRC_50s_Construct_Thermal_Power_Plants_desc:0 "L'électricité est indispensable pour notre alimentation, nos vêtements, notre logement et nos transports ainsi que pour le fonctionnement normal de tous les secteurs du pays. Puisque notre pays vient tout juste d'être créé et a souffert du traumatisme des guerres passées, la construction de centrales thermoélectriques est une mesure nécessaire pour se débarrasser du traumatisme des guerres et promouvoir la construction du socialisme."
 PRC_50s_Use_Fast_Flowing_River:0 "Utiliser une rivière à débit rapide"
 PRC_50s_Use_Fast_Flowing_River_desc:0 "Grâce aux conditions naturelles uniques de notre pays, il existe de nombreuses rivières, grandes et petites, et si des barrages sont construits sur ces rivières au débit rapide, ils joueront un rôle important dans le contrôle des crues, l'approvisionnement en eau, l'irrigation, la production d'énergie hydroélectrique et l'amélioration de la navigation. "
 PRC_50s_Construct_Chemical_Plants:0 "Construire des usines chimiques"
 PRC_50s_Construct_Chemical_Plants_desc:0 "Ces usines font partie intégrante de l'économie nationale, fournissant de nombreuses matières premières et produits essentiels, tels que les plastiques, le caoutchouc et les fibres, indispensables à la vie moderne. De plus, les produits chimiques sont largement utilisés dans de nombreux domaines, tels que l'agriculture, les transports et la construction, la construction d'usines chimiques est donc un projet qui doit être pris au sérieux."
 PRC_50s_Increase_The_Proportion_of_Light_Industrial_Construction:0 "Augmenter la proportion de construction industrielle légère"
 PRC_50s_Increase_The_Proportion_of_Light_Industrial_Construction_desc:0 "L'Union soviétique attache de l'importance au développement de l'industrie lourde mais néglige le développement de l'industrie légère, elle a donc rencontré de nombreux problèmes dans l'industrie légère, nous devrions tirer les leçons de l'expérience de l'Union soviétique et augmenter la proportion de construction d'industrie légère."
 PRC_50s_Mineral_Extraction:0 "Extraction de minéraux"
 PRC_50s_Mineral_Extraction_desc:0 "Notre pays dispose d'un vaste territoire et de ressources naturelles abondantes, que nous devons exploiter pour les utiliser comme matières premières industrielles."
 PRC_50s_Construct_Iron_And_Steel_Joint_Enterprises:0 "Construire des entreprises communes sidérurgiques"
 PRC_50s_Construct_Iron_And_Steel_Joint_Enterprises_desc:0 "Nous avons besoin de plus d'acier pour promouvoir la construction de nos industries légères et lourdes, c'est pourquoi la construction d'un complexe sidérurgique est pour nous une tâche importante."
 PRC_50s_Non-ferrous_Metal_Smelting:0 "Fonderie de métaux non ferreux"
 PRC_50s_Non-ferrous_Metal_Smelting_desc:0 "Les métaux non ferreux occupent une place vitale dans l'économie nationale, ils constituent la pierre angulaire des matériaux de base et des matériaux stratégiques et jouent un rôle décisif dans l'agriculture, l'industrie, la défense nationale et le progrès scientifique et technologique. Pour nous, la fusion des métaux non ferreux revêt une grande importance."
 PRC_50s_Construct_Oil_Refineries:0 "Construire des raffineries de pétrole"
 PRC_50s_Construct_Oil_Refineries_desc:0 "Le pétrole est connu comme le « sang de l'industrie » et son importance pour l'industrie ne peut être surestimée. C'est la matière première de nombreux produits de l'industrie chimique tels que les plastiques, les engrais, les pesticides et les solutions. Les produits pétroliers sont largement utilisés dans les automobiles, les avions, les navires, les locomotives à combustion interne, divers types de machines et les produits de l'industrie de défense."
 PRC_50s_Improve_The_Industrial_Sector:0 "Améliorer le secteur industriel"
 PRC_50s_Improve_The_Industrial_Sector_desc:0 "Grâce à nos efforts inlassables, nous avons beaucoup gagné dans de nombreux aspects de l'industrie minière, et la prochaine étape consiste à améliorer le secteur industriel existant."
 PRC_50s_Address_Agricultural_Mechanisation_Threshold:0 "Aborder le seuil de mécanisation agricole"
 PRC_50s_Address_Agricultural_Mechanisation_Threshold_desc:0 "Afin d'augmenter la production agricole, il est nécessaire de parvenir à la mécanisation agricole, et pour parvenir à la mécanisation agricole, il est nécessaire d'augmenter la production des tracteurs agricoles..."
 PRC_50s_First_Automobile_Works:0 "Premiers travaux automobiles"
 PRC_50s_First_Automobile_Works_desc:0 "Première usine automobile de Chine - La première usine automobile de Changchun a produit la première voiture de marque de libération de Chine, mettant ainsi fin à l'histoire de l'incapacité de la Chine à produire des voitures."
 PRC_50s_Found_State-run_Aircraft_Manufacturing_Plants:0 "Création d'usines de fabrication d'avions gérées par l'État"
 PRC_50s_Found_State-run_Aircraft_Manufacturing_Plants_desc:0 "La construction continue de l'usine aéronautique aidera l'Armée de l'Air populaire à protéger le ciel bleu de la patrie, et nous pourrons également produire nos propres avions."
 PRC_50s_Independent_Military_Material_Enterprises:0 "Entreprises indépendantes de matériel militaire"
 PRC_50s_Independent_Military_Material_Enterprises_desc:0 "Nous devons créer nos propres entreprises de matériel industriel militaire pour entreprendre les tâches de recherche et de production scientifiques de défense nationale, et nous engager dans la recherche et le développement, la production et l'exploitation de diverses armes et équipements pour les forces armées de l'État, afin de défendre la République populaire."
 PRC_50s_Increase_Food_Production:0 "Augmenter la production alimentaire"
 PRC_50s_Increase_Food_Production_desc:0 "Nous devons développer davantage la mécanisation agricole, augmenter la production alimentaire et, en même temps, construire davantage de complexes agricoles et industriels pour accroître la production alimentaire, afin d'assurer notre sécurité alimentaire."
 PRC_50s_Improve_The_Treatment_of_Workers:0 "Améliorer le traitement des travailleurs"
 PRC_50s_Improve_The_Treatment_of_Workers_desc:0 "Les travailleurs sont la principale force de notre production. Depuis le premier plan quinquennal, nos travailleurs ont travaillé en première ligne pour promouvoir l'édification socialiste de la patrie. Ils sont si grands que nous devrions immédiatement améliorer le traitement de nos travailleurs !"
 PRC_50s_Exceed_Target:0 "Dépasser l'objectif"
 PRC_50s_Exceed_Target_desc:0 "Le premier plan quinquennal a été couronné de succès. Grâce aux efforts inlassables de la population, nous avons atteint et dépassé nos objectifs. Au cours de cette période, notre pays a non seulement établi le système politique et le système économique socialistes, mais a également jeté les bases préliminaires de l'industrialisation socialiste."
 PRC_50s_Achieve_Expected_Target:0 "Atteindre l'objectif attendu"
 PRC_50s_Achieve_Expected_Target_desc:0 "Le premier plan quinquennal pour le développement de l'économie nationale a été achevé. Au cours de cette période, notre pays a non seulement établi le système politique et le système économique socialistes, mais a également établi les bases préliminaires de l'industrialisation socialiste."
 PRC_50s_We_Should_Have_Done_Better:0 "Nous aurions dû faire mieux"
 PRC_50s_We_Should_Have_Done_Better_desc:0 "Malgré les résultats peu satisfaisants du premier plan quinquennal, nous ne devons pas nous décourager. Nous sommes encore confrontés à la tâche sérieuse de consolider et de développer davantage le socialisme sur les plans économique, politique et idéologique, c'est-à-dire de faire de notre pays un grand pays socialiste doté d'une industrie, d'une agriculture, d'une science et d'une culture modernes."
 PRC_50s_Keep_in_Touch_with_The_USA:0 "Restez en contact avec les États-Unis"
 PRC_50s_Keep_in_Touch_with_The_USA_desc:0 ""
 PRC_50s_Lean_to_Soviet_Side:0 "Penchez-vous du côté soviétique"
 PRC_50s_Lean_to_Soviet_Side_desc:0 ""
 PRC_50s_Establish_Contacts_With_the_Outside_World:0 "Établir des contacts avec le monde extérieur"
 PRC_50s_Establish_Contacts_With_the_Outside_World_desc:0 ""
 PRC_50s_Recognized_by_The_People_s_Democracies_of_Europe:0 "Reconnu par les démocraties populaires d'Europe"
 PRC_50s_Recognized_by_The_People_s_Democracies_of_Europe_desc:0 "Si nous parvenons à obtenir la reconnaissance des pays de démocratie populaire d'Europe, cela jouera un grand rôle dans la promotion du statut international de notre nouvelle Chine."
 PRC_50s_Close_Cooperation_with_East_Bloc:0 "Coopération étroite avec le Bloc de l'Est"
 PRC_50s_Close_Cooperation_with_East_Bloc_desc:0 "De nombreux pays d'Europe de l'Est sont nos alliés dans le camp socialiste, et nous bénéficions grandement de notre coopération avec eux."
 PRC_50s_Sino-Soviet_Treaty_of_Friendship_Alliance_and_Mutual_Assistance:0 "Traité sino-soviétique d'alliance d'amitié et d'assistance mutuelle"
 PRC_50s_Sino-Soviet_Treaty_of_Friendship_Alliance_and_Mutual_Assistance_desc:0 "La Nouvelle Chine nouvellement fondée était dévastée et en ruines, et l'aide de l'Union soviétique était pour nous une aide opportune ! La signature réussie de l'Alliance sino-soviétique et du Traité d'assistance mutuelle renforcera considérablement la force de notre camp socialiste !"
 PRC_50s_Contact_with_Capitalist_Countries:0 "Contact avec les pays capitalistes"
 PRC_50s_Contact_with_Capitalist_Countries_desc:0 "Les pays capitalistes ont encore de nombreux aspects de la technologie avancée qui méritent d'être appris, et nous pouvons bénéficier de davantage de contacts avec eux."
 PRC_50s_Chairman_Khrushchev:0 "Président Khrouchtchev"
 PRC_50s_Chairman_Khrushchev_desc:0 "Khrouchtchev venait de devenir secrétaire général du Parti communiste de l'Union soviétique et il était un peu grossier et irritable. Quels nouveaux changements l'Union soviétique connaîtrait-elle sous sa direction ? Nous devons être prudents..."
 PRC_50s_Be_Wary_of_His_Reckless_Policy:0 "Méfiez-vous de sa politique imprudente"
 PRC_50s_Be_Wary_of_His_Reckless_Policy_desc:0 "La proposition de Khrouchtchev constitue une violation de la souveraineté nationale et nous ne pouvons la tolérer !"
 PRC_50s_Let_Go_of_Excessive_Ethnic_Sentiment:0 "Abandonnez les sentiments ethniques excessifs"
 PRC_50s_Let_Go_of_Excessive_Ethnic_Sentiment_desc:0 "Peut-être que Big Brother est sincère en faisant cela pour nous, eh bien, certains de nos camarades s'accrochent à la question de la souveraineté nationale, ce n'est pas bon, nous devrions réprimer les émotions nationales excessives."
 PRC_50s_Chairman_Beria:0 "Président Béria"
 PRC_50s_Chairman_Beria_desc:0 "Beria a usurpé la direction suprême de l'Union soviétique lors d'un coup d'État ! C'est quelque chose que le camarade Staline ne doit pas souhaiter voir."
 PRC_50s_Chairman_Marinkov:0 "Président Marinkov"
 PRC_50s_Chairman_Marinkov_desc:0 "Le camarade Malenkov est capable de bien perpétuer l'héritage du camarade Staline et nous pensons que sous sa direction, l'Union soviétique sera capable d'unir encore plus le camp socialiste dans la lutte contre tous les exploiteurs du monde."
 PRC_50s_Denounce_the_Beria_Coup:0 "Dénoncer le coup d'État de Beria"
 PRC_50s_Denounce_the_Beria_Coup_desc:0 "Cet acte ignoble de Beria sapera certainement la stabilité du camp socialiste, et son comportement finira par être rejeté par les peuples du monde ! Condamnez-les !"
 PRC_50s_Ignore_Political_Changes_in_USSR:0 "Ignorer les changements politiques en URSS"
 PRC_50s_Ignore_Political_Changes_in_USSR_desc:0 "Tant que le camarade Beria pourra perpétuer l'héritage du camarade Staline et diriger l'Union soviétique, le camp socialiste et le prolétariat du monde entier pour renverser le camp impérialiste et éliminer le capitalisme. Ces changements seront insignifiants."
 PRC_50s_Focus_on_People_s_Living_Standards:0 "Focus sur le niveau de vie des gens"
 PRC_50s_Focus_on_People_s_Living_Standards_desc:0 "C'est précisément grâce au soutien du peuple que nous pouvons avancer sur la voie du socialisme, et les projets d'assistance des camarades de l'Union soviétique doivent être orientés vers l'amélioration du niveau de vie du peuple."
 PRC_50s_The_Continuation_of_Stalin_s_Policy:0 "La poursuite de la politique de Staline"
 PRC_50s_The_Continuation_of_Stalin_s_Policy_desc:0 "Le camarade Kaganovitch a pris à Staline la direction de l'Union soviétique, il continuera à mener la politique de Staline, nous nous unirons à l'Union soviétique, au camp socialiste, et éliminerons tous les pays capitalistes !"
 PRC_50s_Strengthen_Defence_Cooperation_with_USSR:0 "Renforcer la coopération en matière de défense avec l'URSS"
 PRC_50s_Strengthen_Defence_Cooperation_with_USSR_desc:0 "Le président Mao a dit un jour : « Le pouvoir politique naît du canon d'une arme à feu. » Afin de défendre la nouvelle Chine socialiste, nous devons prêter attention au renforcement de la défense nationale. L'Union soviétique est une puissance militaire et nous pouvons renforcer davantage la coopération en matière de défense avec l'Union soviétique."
 PRC_50s_Learn_from_The_Soviet_s_Industrial_Management_Experience:0 "Apprendre de l'expérience de gestion industrielle soviétique"
 PRC_50s_Learn_from_The_Soviet_s_Industrial_Management_Experience_desc:0 "L'industrialisation a toujours été notre rêve et l'expérience de gestion de l'Union soviétique socialiste dans ce domaine est très avancée, ce qui mérite d'être appris de nos camarades du secteur industriel."
 PRC_50s_The_Twentieth_Congress_of_CPSU:0 "Le vingtième congrès du PCUS"
 PRC_50s_The_Twentieth_Congress_of_CPSU_desc:0 "Dans le camp socialiste, le 20e Congrès du Parti communiste de l'Union soviétique, organisé dans l'Union soviétique socialiste, revêt une importance extraordinaire et son succès influencera la direction dans laquelle le camp socialiste va de l'avant."
 PRC_50s_Gradual_Gap:0 "Écart progressif"
 PRC_50s_Gradual_Gap_desc:0 "Le 20e Congrès du Parti communiste de l'Union soviétique n'a pas tout à fait répondu à nos attentes et pourrait semer la confusion dans le camp socialiste, et nous devons être attentifs aux changements dans la politique soviétique......"
 PRC_50s_Contact_with_Albania:0 "Contact avec l'Albanie"
 PRC_50s_Contact_with_Albania_desc:0 "Nous ne sommes pas les seuls à avoir un problème avec le 20e Congrès du Parti communiste de l'Union soviétique, mais aussi avec notre pays frère socialiste, l'Albanie. Nous devons leur tendre la main et aider activement l'Union soviétique à corriger ses erreurs et à unir l'ensemble du camp socialiste."
 PRC_50s_Maintain_Friendship_with_DPRK:0 "Maintenir l'amitié avec la RPDC"
 PRC_50s_Maintain_Friendship_with_DPRK_desc:0 "Notre pays frère, la Corée du Nord, vient de traverser une guerre terrible et nous devons l'aider à sortir des ruines. Si nous voulons corriger certaines erreurs de l'Union soviétique, nous avons besoin du soutien de la Corée du Nord."
 PRC_50s_Respond_to_Polish_And_Hungarian_Events:0 "Répondre aux événements polonais et hongrois"
 PRC_50s_Respond_to_Polish_And_Hungarian_Events_desc:0 "Il y a eu des troubles politiques en Pologne et en Hongrie, et l'Union soviétique nous a demandé d'aider la Pologne et la Hongrie... Ces deux bouleversements doivent être pris au sérieux, le camp socialiste est plus uni et l'impérialisme ne peut pas réussir !"
 PRC_50s_Reflect_on_The_Implementation_of_Democratic_Centralism:0 "Réflexion sur la mise en oeuvre du centralisme démocratique"
 PRC_50s_Reflect_on_The_Implementation_of_Democratic_Centralism_desc:0 "Les événements polono-hongrois nous ont enseigné une grande leçon : si le centralisme démocratique n'est pas bien mis en oeuvre, il est très probable que certains se jetteront à nouveau contre nous..."
 PRC_50s_Strengthen_Theoretical_Study:0 "Renforcer l'étude théorique"
 PRC_50s_Strengthen_Theoretical_Study_desc:0 "Les événements polono-hongrois ont approfondi notre compréhension de la manière de gérer correctement les contradictions entre les peuples, en défendant les principes de la démocratie et en promouvant la formule solidarité-critique-solidarité. Beaucoup de nos camarades ont des connaissances insuffisantes à cet égard et nous devons renforcer les études théoriques."
 PRC_50s_Continue_Sino-Soviet_Honeymoon:0 "Continuer la lune de miel sino-soviétique"
 PRC_50s_Continue_Sino-Soviet_Honeymoon_desc:0 "Avec l'aide de l'Union soviétique et les efforts du peuple chinois, notre pays se développe rapidement. Bien que l'Union Soviétique ait commis des erreurs diplomatiques, les camarades soviétiques sont prêts à accepter nos critiques et à les corriger. Les relations sino-soviétiques se sont encore consolidées !"
 PRC_50s_Dispatch_of_Labour_to_USSR:0 "Envoi de main d'oeuvre vers l'URSS"
 PRC_50s_Dispatch_of_Labour_to_USSR_desc:0 "L'Union soviétique nous a apporté tellement d'aide, nous devons aussi faire quelque chose en retour, dès que nous avons entendu parler du recrutement de main-d'oeuvre pour soutenir la construction de l'Union soviétique, de nombreux camarades ouvriers se sont activement inscrits, en avant Moscou - Pékin !"
 PRC_50s_Industrial_Technology_Cooperation_with_East_Bloc:0 "Coopération technologique industrielle avec le Bloc de l'Est"
 PRC_50s_Industrial_Technology_Cooperation_with_East_Bloc_desc:0 "De nombreux pays socialistes frères d'Europe de l'Est ont exprimé leur volonté de coopérer avec nous dans le domaine industriel et technique, afin que notre industrie se développe davantage et que nous avancions à une vitesse sans précédent pour devenir un pays socialiste moderne et puissant."
 PRC_50s_Emerging_Forces_Pact:0 "Pacte des forces émergentes"
 PRC_50s_Emerging_Forces_Pact_desc:0 "Nous devons nous éloigner de l'Union soviétique, qui s'éloigne du marxisme-léninisme, et former une organisation nationale véritablement pacifique contre l'impérialisme et le social-impérialisme."
 PRC_50s_Walk_Alone:0 "Marcher seul"
 PRC_50s_Walk_Alone_desc:0 "L'Union soviétique a fait preuve à plusieurs reprises d'un chauvinisme de grande puissance dans la diplomatie, et nos efforts de persuasion répétés ont échoué, mais nous devons continuer à lutter jusqu'au bout contre cette erreur de l'Union soviétique et laisser l'Union soviétique se mettre sur la bonne voie."
 PRC_50s_Become_a_Warsaw_Pact_Observer:0 "Devenez observateur du Pacte de Varsovie"
 PRC_50s_Become_a_Warsaw_Pact_Observer_desc:0 "Avec l'accord des camarades chinois et la ratification des camarades de l'Union soviétique, la République populaire de Chine est officiellement devenue un État observateur du Pacte de Varsovie, renforçant encore le camp socialiste et faisant un grand pas en avant sur la voie du renversement du capitalisme impérialiste !"
 PRC_50s_Recognized_by_The_People_s_Democracies_of_Asia:0 "Reconnu par les démocraties populaires d'Asie"
 PRC_50s_Recognized_by_The_People_s_Democracies_of_Asia_desc:0 "Au lendemain de la Seconde Guerre mondiale, de nombreux pays d'Asie sont devenus indépendants les uns après les autres, ce qui a donné lieu à la formation d'un certain nombre d'États-nations émergents. Ces pays sont confrontés à des défis communs. La Chine nouvelle partage des intérêts communs avec d'autres démocraties populaires d'Asie dans la résistance à l'impérialisme et au colonialisme. En obtenant la reconnaissance des démocraties populaires asiatiques, notre pays sera en mesure de briser dans une certaine mesure le blocus et l'isolement des pays occidentaux. Nous utiliserons des voies qui incluent un engagement étranger actif, une assistance économique et technique et une participation à des organisations et activités multilatérales dans la région asiatique."
 PRC_50s_Sino-India_Treaty_of_Friendship_and_Mutual_Assistance:0 "Traité d'amitié et d'assistance mutuelle sino-indien"
 PRC_50s_Sino-India_Treaty_of_Friendship_and_Mutual_Assistance_desc:0 ""
 PRC_50s_Establish_Friendly_Relations_with_The_New_Burmese_Regime:0 "Établir des relations amicales avec le nouveau régime birman"
 PRC_50s_Establish_Friendly_Relations_with_The_New_Burmese_Regime_desc:0 "Après avoir été colonisée par les Britanniques pendant plus d'un demi-siècle, la Birmanie a finalement accédé à son indépendance, et la Birmanie est également devenue un nouvel objet de négociations diplomatiques frontalières menées par la nouvelle Chine."
 PRC_50s_Make_Friends_with_Sukarno_Regime:0 "Faites-vous des amis avec le régime de Sukarno"
 PRC_50s_Make_Friends_with_Sukarno_Regime_desc:0 "Sukarno mène une politique étrangère indépendante, s'oppose à l'ingérence impérialiste et mène une politique étrangère commune avec nous. C'est donc une tâche très importante pour nous de nous lier d'amitié avec eux et de les unir contre l'impérialisme."
 PRC_50s_Economic_And_Trade_Agreement_with_Ceylon:0 "Accord économique et commercial avec Ceylan"
 PRC_50s_Economic_And_Trade_Agreement_with_Ceylon_desc:0 "Ne voulant pas se soumettre à l'embargo, le gouvernement de Ceylan a proposé de fournir à la Chine du caoutchouc en échange de riz indispensable. La Chine a invité une délégation commerciale du gouvernement de Ceylan en Chine pour des entretiens. Les deux pays ont signé avec succès un contrat permettant à la Chine de vendre 80 000 tonnes de riz à Ceylan. S'ensuivirent cinq années d'accords commerciaux sur le caoutchouc et le riz. Si cet accord commercial à long terme est signé, ce sera une grande victoire dans la lutte contre les blocus et les embargos."
 PRC_50s_Conced_on_The_Border_Issue:0 "Concédé sur la question frontalière"
 PRC_50s_Conced_on_The_Border_Issue_desc:0 ""
 PRC_50s_Refuse_to_Recognize_McMahon_Line:0 "Refuser de reconnaître McMahon Line"
 PRC_50s_Refuse_to_Recognize_McMahon_Line_desc:0 ""
 PRC_50s_Adhere_to_The_Five_Principles_of_Peaceful_Coexistence:0 "Adhérer aux cinq principes de la coexistence pacifique"
 PRC_50s_Adhere_to_The_Five_Principles_of_Peaceful_Coexistence_desc:0 "Les cinq principes de coexistence pacifique sont des normes fondamentales régissant les relations entre États proposées et préconisées par  la Chine nouvelle, notamment le respect mutuel de la souveraineté et de l'intégrité territoriale,  la non-agression et la non-ingérence dans les affaires intérieures de chacun,  l'égalité et le bénéfice mutuel et la coexistence pacifique. Si nous respectons strictement ce principe, nous aurons de plus en plus d'amis."
 PRC_50s_Import_Pakistani_Cotton:0 "Importer du coton pakistanais"
 PRC_50s_Import_Pakistani_Cotton_desc:0 ""
 PRC_50s_Propose_Sino-India_Trade_Agreement:0 "Proposer un accord commercial sino-indien"
 PRC_50s_Propose_Sino-India_Trade_Agreement_desc:0 "Après avoir cédé sur la question frontalière, les relations entre les deux pays se sont grandement améliorées. Pour consolider davantage l'amitié entre la Chine et l'Inde, c'est absolument le seul moyen de proposer un accord commercial sino-indien."
 PRC_50s_Reinforcement_for_The_Sino-India_Border:0 "Renforcement de la frontière sino-indienne"
 PRC_50s_Reinforcement_for_The_Sino-India_Border_desc:0 "Nous devons encore être prudents, l'Inde a discuté à plusieurs reprises avec nous sur la question de la frontière, afin d'éviter qu'elle ne continue à provoquer des troubles à la frontière, nous devons encore élargir la frontière indienne pour défendre notre souveraineté territoriale."
 PRC_50s_Carry_forward_The_Spirit_of_Bandung_Conference:0 "Faire avancer l'esprit de la conférence de Bandung"
 PRC_50s_Carry_forward_The_Spirit_of_Bandung_Conference_desc:0 "Même si nous avons plus ou moins de contradictions avec nos voisins autour de nous, elles cèdent toutes la place à nos contradictions avec l'impérialisme. C'est pourquoi l'unité contre l'impérialisme est notre première tâche et pourquoi l'esprit de la Conférence de Bandung est si important. L'esprit de Bandung peut être résumé en trois aspects : premièrement, prôner la coexistence pacifique ; Deuxièmement, il appelle les peuples d'Asie et d'Afrique à se débarrasser de l'oppression impérialiste et coloniale et à devenir des pays indépendants. Troisièmement, appeler les pays et nations faibles du monde à s'unir et à établir un nouvel ordre international."
 PRC_50s_Promote_Relations_with_Indochina:0 "Promouvoir les relations avec l'Indochine"
 PRC_50s_Promote_Relations_with_Indochina_desc:0 "L'Indochine est située au sud de notre pays, avec le Vietnam, le Cambodge et le Laos, même si notre pays vient de faire la paix, ils sont toujours en difficulté et nous devons les aider à traverser cette période difficile."
 PRC_50s_Aid_to_the_Mongolian_People_s_Republic:0 "Aide à la République populaire de Mongolie"
 PRC_50s_Aid_to_the_Mongolian_People_s_Republic_desc:0 "Le camarade Choibalsan nous a demandé d'aider la République populaire mongole, et nous enverrons successivement des gens pour aider la Mongolie, pour l'aider à construire des projets et des routes, et pour résoudre le problème de la pénurie de main-d'oeuvre dans la République populaire mongole."
 PRC_50s_Send_Military_Advisory_Mission_to_PAVN:0 "Envoyer une mission de conseil militaire au PAVN"
 PRC_50s_Send_Military_Advisory_Mission_to_PAVN_desc:0 "Notre pays frère socialiste, le Vietnam, mène une guerre contre l'impérialisme colonial et notre peuple est tous favorable à l'envoi de nos conseillers militaires sur le front vietnamien pour l'aider !"
 PRC_50s_Send_Volunteer_to_Vietnam:0 "Envoyer un volontaire au Vietnam"
 PRC_50s_Send_Volunteer_to_Vietnam_desc:0 "Le Vietnam combat courageusement les colonialistes français, les Vietnamiens sont l'avant-garde de l'impérialisme anticolonial et nous enverrons des divisions de volontaires pour les soutenir."
 PRC_50s_Support_Nasser_Regime:0 "Soutenir le régime Nasser"
 PRC_50s_Support_Nasser_Regime_desc:0 "La lutte du peuple égyptien contre le colonialisme et l'agression trouve un fort écho dans d'autres pays qui ont également souffert de l'oppression occidentale, et nous les soutiendrons."
 PRC_50s_Economic_Cooperation_with_Cambodia:0 "Coopération économique avec le Cambodge"
 PRC_50s_Economic_Cooperation_with_Cambodia_desc:0 "La Chine aidera le Cambodge dans un certain nombre de projets d'infrastructure importants, tels que des routes et des centrales hydroélectriques, afin de promouvoir le développement économique du Cambodge. "
 PRC_50s_Economic_Aid_to_CPV:0 "Aide économique au CPV"
 PRC_50s_Economic_Aid_to_CPV_desc:0 "Le Vietnam lutte contre la France et les États-Unis et a un besoin urgent d'une aide extérieure pour résister à l'agression impérialiste. Il ne suffit pas d'aider le Vietnam militairement, nous devons aussi l'aider économiquement."
 PRC_50s_Pan-Asian_Diplomacy:0 "Diplomatie panasiatique"
 PRC_50s_Pan-Asian_Diplomacy_desc:0 "Face à l'épuisement des guerres intérieures et à l'oppression de l'impérialisme, nous avons réalisé l'importance de rechercher l'unité et la coopération entre les pays asiatiques afin de parvenir à l'indépendance nationale, au développement et au maintien de la paix régionale. En s'engageant avec les pays voisins, notre gouvernement visait à briser l'isolement diplomatique et à renforcer son influence régionale tout en favorisant la construction économique et la stabilité intérieure. En outre, par cette approche diplomatique, la Chine cherche également à équilibrer la rivalité Est-Ouest de l'époque de la Guerre froide et à créer des conditions favorables au développement pacifique du pays."
 PRC_50s_Turn_to_Revolutionary_Diplomacy:0 "Tournez-vous vers la diplomatie révolutionnaire"
 PRC_50s_Turn_to_Revolutionary_Diplomacy_desc:0 "La politique de réalisation d'une diplomatie révolutionnaire vise à rompre complètement avec la diplomatie semi-coloniale de l'ancienne Chine et à sauvegarder l'indépendance et la souveraineté de la nouvelle Chine. L'objectif principal était de sauvegarder la sécurité nationale et l'indépendance souveraine et de défendre les fruits de la victoire révolutionnaire. Cette politique étrangère mettait l'accent sur le principe d'indépendance et d'autonomie et visait à présenter une image claire de la Chine dans l'environnement international. Cependant, cela a entraîné certains défis dans les relations internationales."
 PRC_50s_Severance_of_Economic_And_Trade_Cooperation_with_Japan:0 "Rupture de la coopération économique et commerciale avec le Japon"
 PRC_50s_Severance_of_Economic_And_Trade_Cooperation_with_Japan_desc:0 "En tant que voisin proche de la Chine, la relance économique du Japon revêt une certaine importance pour la Chine. Cependant, le Japon était sous le contrôle strict des États-Unis au début de l'après-guerre et sa politique commerciale extérieure était fortement influencée par les États-Unis. Les États-Unis ont mis en oeuvre une politique limitée de relance commerciale avec le Japon, mais ont en même temps imposé des restrictions sur les échanges commerciaux du Japon avec la Chine. Pour protester contre la coopération du gouvernement japonais avec les États-Unis et son attitude hostile envers la nouvelle Chine, le pays choisira de rompre ses relations commerciales avec le Japon. Cette décision pourrait affecter la reprise économique et le développement de la Chine et exacerber l'isolement international de la nouvelle Chine."
 PRC_50s_Denounce_Yugoslav_Revisionism:0 "Dénoncer le révisionnisme yougoslave"
 PRC_50s_Denounce_Yugoslav_Revisionism_desc:0 "Après la fondation de la Chine nouvelle, sa politique étrangère a été fortement influencée par les relations entre la Chine et l'Union soviétique. Dans le cadre de la guerre froide, la Chine et l'Union soviétique étaient dans le même camp socialiste, tandis que la Yougoslavie était en désaccord avec l'Union soviétique sur sa voie vers le socialisme par l'autonomie et le non-alignement. En 1948, la Yougoslavie est devenue l'objet de critiques pour révisionnisme après que le Parti communiste soviétique a expulsé le JCS. La Chine a adopté une position diplomatique conforme à celle de l'Union soviétique au cours de cette période, ce qui a également influencé son attitude envers la Yougoslavie. Sur la base de positions idéologiques et politiques, nous condamnerons publiquement le révisionnisme yougoslave dans le but de consolider les relations avec l'Union soviétique et d'établir une position dans le mouvement communiste international."
 PRC_50s_Help_Stabilize_Laos_Government:0 "Aidez à stabiliser le gouvernement du Laos"
 PRC_50s_Help_Stabilize_Laos_Government_desc:0 "La Chine et le Laos entretiennent des échanges étroits depuis l'Antiquité. Bien que la Chine et le Laos n'aient pas établi de relations diplomatiques, les deux pays entretiennent des échanges officiels et non gouvernementaux. Le Laos a été dévasté par la guerre et a besoin d'une aide urgente. Nous devrions les aider."
 PRC_50s_Maintaining_Pragmatism:0 "Maintenir le pragmatisme"
 PRC_50s_Maintaining_Pragmatism_desc:0 "Afin de consolider davantage la révolution socialiste dans notre pays, nous devons être plus pragmatiques dans notre diplomatie et unir davantage les forces qui peuvent être unies dans la lutte contre l'impérialisme."
 PRC_50s_Access_to_the_Government_of_Pakistan:0 "Accès au gouvernement du Pakistan"
 PRC_50s_Access_to_the_Government_of_Pakistan_desc:0 "Le Pakistan a été l'un des premiers pays à reconnaître la nouvelle Chine et a soutenu la Chine sur la question frontalière ainsi que sur la conférence de Bandung. Il est temps de tenir une réunion pour renforcer la compréhension et la coopération amicale entre la Chine et le Pakistan."
 PRC_50s_Guaranteeing_the_leadership_of_the_USSR_in_the_socialist_camp:0 "Garantir le leadership de l'URSS dans le camp socialiste"
 PRC_50s_Ask_for_Aksai_Chin:0 "Réclamez Aksai Chin"
 PRC_50s_Ask_for_Aksai_Chin_desc:0 "Les anciens colonialistes britanniques ont tracé la soi-disant ligne Johnson pour inclure l'Aksai Chin chinois sur le territoire indien, mais les gouvernements chinois successifs, y compris le gouvernement de la République populaire de Chine, l'ignoraient. Le gouvernement chinois n'a jamais reconnu la « ligne Johnson », nous devons donc consolider la frontière à Aksai Chin. Au cas où les Indiens attaqueraient furtivement."
 PRC_50s_Guaranteeing_the_leadership_of_the_USSR_in_the_socialist_camp_desc:0 "L'Union soviétique a été le premier pays socialiste au monde, fondé par les bolcheviks dirigés par Lénine, et a été l'avant-garde de la lutte mondiale contre le fascisme, l'impérialisme et le capitalisme. L'Union soviétique était censée être le leader du camp socialiste."
 PRC_50s_Agreement_with_the_SouthEast_Asia_Treaty_Organization:0 "Accord avec l'OTASE"
 PRC_50s_Sign_Border_Treaty_with_Neighbouring_Countries:0 "Signer un traité frontalier avec les pays voisins"
