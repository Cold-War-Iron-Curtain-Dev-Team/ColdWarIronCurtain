 CAN_mechanized_equipment_5: "M113"
 CAN_mechanized_equipment_5_short: "M113"
 CAN_mechanized_equipment_5_desc: "Les APC américains les plus reconnaissables depuis les années 60. Il est largement utilisé et, grâce à des années de recherche, il en a fait un véritable véhicule blindé de transport de troupes, en utilisant sa hauteur, son angle de blindage et son épaisseur. Et plus tard, introduisant de plus en plus de variantes, s'armant d'un M2 Browning.50 Cal avec quelques milliers de tours de liberté. Se vante vraiment d'être un bon APC. Des dizaines de variantes provenaient de la gamme du M113, toujours utilisée par l'armée américaine à ce jour."
 CAN_mechanized_equipment_6: "M113A1"
 CAN_mechanized_equipment_6_short: "M113A1"
 CAN_mechanized_equipment_6_desc: "À partir de 1964, le moteur à essence a été remplacé par un moteur Detroit Diesel 6V-53 de 215 ch (160 kW), pour profiter de la meilleure économie de carburant et du risque d'incendie réduit du moteur diesel."
 CAN_mechanized_equipment_7: "VBL I Grizzly"
 CAN_mechanized_equipment_7_short: "VBL I Grizzly"
 CAN_mechanized_equipment_7_desc: "Le LAV I Grizzly était une variante de l'AVGP (Véhicule blindé à usage général) conçu comme véhicule blindé de transport de troupes."
