 CAN_iw_armored_vehicles: "Forces armées canadiennes"
 CAN_iw_armored_vehicles_short: "Forces armées canadiennes"
 CAN_iw_armored_vehicles_desc: "Les Forces armées canadiennes (CAF ; français : Forces armées canadiennes ; FAC) sont l'armée unifiée du Canada, comprenant des éléments maritimes, terrestres et aériens appelés Marine royale canadienne, Armée canadienne et Aviation royale canadienne."

