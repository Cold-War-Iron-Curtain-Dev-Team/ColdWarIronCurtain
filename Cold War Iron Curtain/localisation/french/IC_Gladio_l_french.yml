 GLADIO_CATEGORY_TITLE_1_TT:0 "Représente le pourcentage d'influence américaine dans la nation"
 GLADIO_CATEGORY_TITLE_2_TT:0 "Représente le pourcentage d'influence soviétique dans la nation"
 GLADIO_CATEGORY_TITLE_3_TT:0 "Représente le pourcentage de soutien politique aux marxistes-léninistes, maoïstes et socialistes révolutionnaires combinés"
 GLADIO_CATEGORY_TITLE_4_TT:0 "Représente la force des réseaux de résistance préparés pour la Troisième Guerre mondiale"
