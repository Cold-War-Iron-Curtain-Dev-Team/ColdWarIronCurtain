 GLADIO_MISSION_CATEGORY_3_TT:0 "Les actions sous faux drapeau comprennent :§Y\n- Organiser des attentats terroristes d'extrême gauche\n- Organiser des attentats terroristes d'extrême droite\n-Provoquer des émeutes politiques§!"
 GLADIO_MISSION_CATEGORY_4_TT:0 "La coercition politique comprend :§Y\n-Financement politique\n-Corruption\n-Recrutement du renseignement\n-Collection de chantage§!"
 GLADIO_MISSION_CATEGORY_5_TT:0 "Le changement de régime comprend :§Y\n-Préparatifs du coup d'État\n-Sélection des dirigeants\n-Augmenter la tension nationale\n-Extorsion par chantage\n-Lancement du coup d'État§!"

