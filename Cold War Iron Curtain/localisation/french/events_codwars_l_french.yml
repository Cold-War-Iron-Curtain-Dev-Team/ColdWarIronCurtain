l_french:
 codwar.1.d:0 "La pêche a toujours été l'un des piliers de l'économie islandaise. Cependant, les eaux autour de notre nation insulaire sont devenues surexploitées, menaçant notre mode de vie traditionnel. Si nous ne réduisons pas rapidement notre production actuelle de poisson, notre industrie de la pêche risque de s'effondrer à long terme."
 codwar.2.d:0 "Pour sauver notre industrie de la pêche - une source de revenus importante pour nous - nous pouvons soit réduire les quotas de pêche, soit exploiter de nouvelles zones de pêche. Si nous n'étendons pas nos eaux territoriales et choisissons de réduire les quotas de pêche, les pêcheurs de notre pays réagiront avec colère. Une autre question est de savoir jusqu'où devrait aller toute expansion."
 codwar.3.d:0 "Les mers islandaises sont surexploitées, c'est pourquoi le gouvernement islandais a décidé d'étendre simplement ses eaux territoriales et de revendiquer de nouvelles zones de pêche - aux dépens de nos propres pêcheurs qui ont désormais besoin de la protection de la marine dans les « nouvelles » eaux islandaises. Il est peu probable que l'Islande, qui dépend de l'industrie de la pêche, cède ici, mais peut-on accepter cette provocation ?"
 codwar.4.d:0 "La « guerre de la morue » est presque terminée. La Grande-Bretagne accèdera bientôt officiellement à l'expansion de nos eaux territoriales. Bien que la navigation britannique continue pour l'instant de violer notre souveraineté, le gouvernement britannique a indiqué que cette aventure devenait trop coûteuse pour lui et qu'il retirerait bientôt son soutien naval à la flotte de pêche britannique."
 codwar.5.d:0 "La soi-disant « guerre de la morue » se prolonge et le conflit ne montre aucun signe de fin dans un avenir proche. Nous sommes certains que la Grande-Bretagne finira par accepter l'expansion de nos eaux territoriales, mais à l'heure actuelle, les navires britanniques continuent de violer obstinément notre souveraineté. Jusqu'au départ des navires britanniques, nous devrons supporter les dépenses liées à la protection de notre flotte de pêche."