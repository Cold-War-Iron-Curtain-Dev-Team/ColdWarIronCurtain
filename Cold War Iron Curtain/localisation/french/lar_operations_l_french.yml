 #UIA Section
 #Strike Roman Shukhevych in Bilohorshcha
 #Raid Suspected UIA Compounds
 #Deport Suspect Western Ukranian Villages
 #Establish Fictitious OUN Leadership Cells
 #Apprehend Kiev Oblast OUN Militia Cells
 #Apprehend Vinnytsia Oblast OUN Militia Cells
 #Assassinate Stepan Bandera

 PHASE_1_Operation_DESC_UIA_1:0 "Premièrement, nous devons nous coordonner avec les agents locaux du MGB afin de coordonner l'arrestation de Roman, ainsi que d'accepter leur aide dans la dissimulation ultérieure."
 PHASE_2_Operation_DESC_UIA_1:0 "Pour garantir que la cible ne puisse pas s'échapper de la zone de mise à mort, nous nous coordonnerons avec les autorités internes locales pour garantir que sa maison soit encerclée par plusieurs centaines de soldats de l'intérieur."
 PHASE_3_Operation_DESC_UIA_1:0 "Même si un échange de tirs est inévitable, nous ne pouvons pas permettre à l'OUN de présenter Choukhevych comme un martyr. Nous ferons passer sa mort pour un suicide et brûlerons son corps dans la rivière Zbruch pour qu'il ne puisse pas être retrouvé." 

 PHASE_1_Operation_DESC_UIA_2:0 "Notre appareil de renseignement et de sécurité procédera immédiatement à une évaluation des menaces dans les zones potentielles pour les complexes UIA, en se concentrant sur les cellules les plus actives de la région."
 PHASE_2_Operation_DESC_UIA_2:0 "Ensuite, nos agents concentreront leurs tactiques sur la localisation des cellules de l'UIA, en se concentrant sur leurs dirigeants et les principales menaces qui pèsent sur les autorités et les infrastructures du gouvernement local."
 PHASE_3_Operation_DESC_UIA_2:0 "Enfin, le point culminant de notre opération viendra lorsque nos agents et nos forces de sécurité, agissant sur la base des renseignements, attaqueront et liquideront les membres des cellules, protégeant ainsi les membres locaux du parti et éliminant davantage les fascistes."

 PHASE_1_Operation_DESC_UIA_3:0 "Les dirigeants et cadres locaux du parti discuteront avec l'appareil de sécurité pour identifier les villages locaux les plus susceptibles de soutenir l'UIA."
 PHASE_2_Operation_DESC_UIA_3:0 "Ensuite, nos agents se concentreront sur la surveillance des villages de la liste cible et détermineront ceux qui soutiennent le plus les fascistes et qui ont probablement fourni une aide aux fascistes dans le passé."
 PHASE_3_Operation_DESC_UIA_3:0 "Enfin, l'escouade, accompagnée des unités de défense populaire locale sous son commandement, encerclera le village et procédera à la déportation de la population vers l'Extrême-Orient."

 PHASE_1_Operation_DESC_UIA_4:0 "Après avoir localisé les cellules OUN à travers la RSS d'Ukraine, nous les intégrerons au sein de l'organisation, avec de fausses identités et de fausses histoires afin de nous accorder une base solide."
 PHASE_2_Operation_DESC_UIA_4:0 "Avant que nos agents puissent assumer des postes de direction au sein de l'OUN, nous devons les aider à accélérer leur carrière afin de construire leur statut interne au sein de l'Organisation."
 PHASE_3_Operation_DESC_UIA_4:0 "En coordination avec nos infiltrés, nous ciblerons subtilement les membres clés de la direction de chaque cellule individuelle pour des assassinats subtils, afin d'ouvrir la voie aux promotions précipitées des agents que nous avons intégrés."

 PHASE_1_Operation_DESC_UIA_5:0 "Même si les autorités locales ont eu du mal à appréhender elles-mêmes ces militants, elles détiennent des informations cruciales, telles que des noms et des lieux."
 PHASE_2_Operation_DESC_UIA_5:0 "Un combat ouvert avec les milices locales est déconseillé, et tant qu'elles restent en contact avec leurs dirigeants, elles sont capables de coordonner une résistance."
 PHASE_3_Operation_DESC_UIA_5:0 "Les militants étant isolés de leur structure de commandement et incapables de se coordonner les uns avec les autres, avec l'aide des autorités locales, ils peuvent être appréhendés avec un minimum de résistance ou de preuve de notre implication."

 PHASE_1_Operation_DESC_UIA_6:0 "Même si les autorités locales ont eu du mal à appréhender elles-mêmes ces militants, elles détiennent des informations cruciales, telles que des noms et des lieux."
 PHASE_2_Operation_DESC_UIA_6:0 "Un combat ouvert avec les milices locales est déconseillé, et tant qu'elles restent en contact avec leurs dirigeants, elles sont capables de coordonner une résistance."
 PHASE_3_Operation_DESC_UIA_6:0 "Les militants étant isolés de leur structure de commandement et incapables de se coordonner les uns avec les autres, avec l'aide des autorités locales, ils peuvent être appréhendés avec un minimum de résistance ou de preuve de notre implication."

 PHASE_1_Operation_DESC_UIA_7:0 "Étant donné que Bandera est située à Munich, il est crucial de garantir que nos agents restent à la fois inaperçus et efficaces. Garantir l'absence de témoins est crucial pour le succès des opérations."
 PHASE_2_Operation_DESC_UIA_7:0 "Une fois l'ordre donné, les agents encercleront le collaborateur, et l'aspergeront avec un pistolet pulvérisateur de cyanure, une exécution mortelle, mais surtout assez tranquille."
 PHASE_3_Operation_DESC_UIA_7:0 "Une fois l'exécution réussie, le retour clandestin de nos agents à travers la frontière est une priorité élevée, afin de garantir que la mort de Bandera ne puisse pas être liée à l'Union soviétique et d'éviter l'arrestation d'un de nos agents."

 UIA_1_Success_desc:0 "[GetCurrentSquadTitle]l'opération menée par Roman Choukhevych pour assassiner Roman Choukhevych a connu un succès retentissant, car sa mort a été présentée comme un suicide alors qu'il résistait à une arrestation civile."
 UIA_1_Failure_desc:0 "La tentative d'assassinat de Roman Shukhevych par [GetCurrentSquadTitle] s'est soldée par un échec malheureux, puisqu'il a réussi à échapper à [GetCurrentSquadTitle]et à s'échapper vers un lieu jusqu'à présent inconnu."
 UIA_2_Success_desc:0 "Une opération anti-insurrectionnelle menée par [GetCurrentSquadTitle] sur des sites présumés de l'armée insurrectionnelle ukrainienne a réussi, entraînant de multiples arrestations et une saisie d'armes."
 UIA_2_Failure_desc:0 "Une tentative de raid sur les complexes de l'armée insurrectionnelle ukrainienne, menée par [GetCurrentSquadTitle], s'est soldée non seulement par un échec, mais aussi par la mort de plusieurs de nos agents."
 UIA_3_Success_desc:0 "[GetCurrentSquadTitle] a réussi à localiser et à expulser d'innombrables insurgés présumés et sympathisants de l'insurrection dans tout l'ouest de l'Ukraine, ce qui a entraîné un déclin marqué de l'activité insurrectionnelle dans la région."
 UIA_3_Failure_desc:0 "les tentatives de [GetCurrentSquadTitle] pour paralyser les villages alignés sur les insurgés dans l'ouest de l'Ukraine se sont non seulement soldées par un échec, mais ont également galvanisé davantage la base de soutien des insurgés dans la région."
 UIA_4_Success_desc:0 "Les tentatives des [GetCurrentSquadTitle]d'infiltrer l'Organisation des nationalistes ukrainiens se sont soldées par un succès et la création de plusieurs de nos usines secrètes s'est hissée à des postes de direction au sein de l'organisation."
 UIA_4_Failure_desc:0 "Les tentatives d'infiltration de [GetCurrentSquadTitle] ont non seulement été découvertes, mais ont également abouti à l'expulsion et à l'exécution de plusieurs de nos usines au sein de l'organisation."
 UIA_5_Success_desc:0 "Les efforts du [GetCurrentSquadTitle] pour arrêter et réprimer les milices nationalistes dans l'oblast de Kiev ont été couronnés de succès et ont porté un coup dur à la présence armée de l'OUN dans la capitale de la RSS d'Ukraine."
 UIA_5_Failure_desc:0 "l'échec de [GetCurrentSquadTitle] à appréhender les milices nationalistes dans l'oblast de Kiev s'est soldé par la mort de plusieurs agents et semble avoir seulement renforcé la présence de l'OUN dans l'oblast."
 UIA_6_Success_desc:0 "Les efforts du [GetCurrentSquadTitle] pour arrêter et réprimer les milices nationalistes dans la région de Vinnytsia ont réussi et ont porté un coup dur à la présence armée de l'OUN dans la région."
 UIA_6_Failure_desc:0 "L'échec du [GetCurrentSquadTitle] à appréhender les milices nationalistes dans l'oblast de Vinnytsia s'est soldé par la mort de plusieurs agents et semble n'avoir fait que renforcer la présence de l'OUN dans l'oblast."
 UIA_7_Success_desc:0 "L'assassinat du collaborateur nazi autrefois prolifique par [GetCurrentSquadTitle] (à moins que vous vouliez utiliser le nom historique de celui qui l'a assassiné, Bohdan Stashynsky) a eu un succès retentissant, puisque Bandera s'est effondré devant son appartement de Munich, à cause d'un empoisonnement au gaz cyanure."
 UIA_7_Failure_desc:0 "Stepan Bandera a malheureusement encore une fois échappé à l'assassinat, car la tentative de [GetCurrentSquadTitle]d'assassiner le collaborateur avec du gaz cyanure a échoué, Bandera ayant réussi à évacuer les lieux avant que le gaz ne puisse faire effet."

