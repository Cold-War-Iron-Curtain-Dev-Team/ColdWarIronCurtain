 enemy_has_equal_or_better_radar_tech_trigger_tt:0 "L'ennemi dispose d'une technologie radar égale, voire meilleure."
 OPERATION_BONUS_REWARD:0 "L'opération a été un immense succès, et a rapporté §Gde récompenses bonus§!!"
 intelligency_agency_resistance_boost_tt:0 "Opérations de renseignement : $VALUE|=-%0$"
 targeted_sabotage_resources_2_tt:0 "La Résistance locale en [From.From.GetName] concentrera davantage ses efforts sur le sabotage de l'extraction des ressources locales."
 targeted_sabotage_resources_3_tt:0 "La Résistance locale en [From.From.GetName] fera un effort important pour saboter l'extraction des ressources locales."
 targeted_sabotage_industry_2_tt:0 "La Résistance locale en [From.From.GetName] concentrera davantage ses efforts sur le sabotage des usines locales."
 targeted_sabotage_industry_3_tt:0 "La Résistance locale en [From.From.GetName] fera de gros efforts pour saboter les usines locales."
 targeted_sabotage_infrastructure_2_tt:0 "La Résistance locale en [From.From.GetName] concentrera davantage ses efforts sur le sabotage des infrastructures locales."
 targeted_sabotage_infrastructure_3_tt:0 "La résistance locale en [From.From.GetName] fera un gros effort pour saboter les infrastructures locales"
 organise_cells_outcome:0 "Plusieurs cellules révolutionnaires se sont organisées et ont commencé à opérer sur les arrières ennemis."
 infiltrate_civil_service_outcome:0 "Nous avons placé un certain nombre de personnes fiables à des postes de pouvoir, leur permettant de prendre rapidement le contrôle des territoires libérés administrés."
 workers_militia_outcome:0 "Plusieurs bataillons de milices ouvrières sont prêts à garder les installations critiques."
 organize_strikes_outcome:0 "Notre agent a réussi à convaincre les syndicalistes et les travailleurs de déclencher une grève majeure."
 preposition_units_outcome:0 "Nos atouts dans le pays ont été placés pour capturer les infrastructures critiques lorsque le soulèvement commencera."
 launch_coup_exfiltration_outcome:0 "Dès réception du signal de départ, notre agent a conduit plusieurs unités pour capturer les objectifs qui leur étaient assignés. Les rebelles ont réussi à prendre le contrôle d'une tranche de territoire."
 launch_coup_exfiltration_outcome_fail:0 "Dans la confusion du soulèvement, nous avons perdu le contact avec notre agent. Nous ne saurons peut-être jamais ce qui s'est passé."
 
