 HISTORY_ENTRY:0 "[GetSquadHistoryTooltip]"

 PHASE_1_Operation_DESC_GENERIC_1:0 "Afin de renforcer notre sécurité nationale et notre position géopolitique, notre service de renseignement a proposé d'infiltrer le [?generic_operations_selected_target.GetName] afin de commencer des opérations de collecte de renseignements et d'espionnage."
 PHASE_2_Operation_DESC_GENERIC_1:0 "Nous avancerons avec des propositions visant à construire un « site noir » dans le [?generic_operations_selected_target.GetName]. La construction débutera immédiatement, sous la direction de notre ambassade."
 PHASE_3_Operation_DESC_GENERIC_1:0 "Maintenant que les opérations ont été approuvées et que le site noir a été construit en [?generic_operations_selected_target.GetName], nous allons commencer à déployer notre personnel et nos experts en matière de renseignement pour lancer la collecte d'informations et les opérations de renseignement."

 PHASE_1_Operation_DESC_GENERIC_2:0 "Nos agents procéderont d'abord à une vérification et un examen approfondis du réseau de renseignement en [?generic_operations_selected_target.GetName] afin de déterminer ses fonctionnalités actuelles, ses faiblesses et les besoins d'amélioration."
 PHASE_2_Operation_DESC_GENERIC_2:0 "Nos agents sur le terrain offriront des paiements en espèces ou des avantages aux personnes locales travaillant dans des zones sensibles, telles que les concierges et le personnel de nettoyage, pour nous informer des évolutions de l'ennemi afin d'élargir notre réseau"
 PHASE_3_Operation_DESC_GENERIC_2:0 "Enfin, nous veillerons à ce que le réseau soit protégé contre les interférences des services de sécurité en fournissant une couverture appropriée, en garantissant l'anonymat et des tactiques de contre-espionnage pour nous assurer de ne jamais être attrapés."

 PHASE_1_Operation_DESC_GENERIC_3:0 "Tout d'abord, nous déterminerons plus d'informations sur le général [?selected_operation_personnel_target.GetName], telles que ses responsabilités militaires et ses liens familiaux, ainsi que d'éventuels éléments de chantage."
 PHASE_2_Operation_DESC_GENERIC_3:0 "Ensuite, il sera nécessaire de suivre les déplacements du général [?selected_operation_personnel_target.GetName]au cours d'une journée normale, afin de trouver un délai approprié pour le sortir."
 PHASE_3_Operation_DESC_GENERIC_3:0 "Le moment est venu. Nos agents retireront [?selected_operation_personnel_target.GetName], sur le chemin du travail ; ils s'échapperont ensuite vers notre site noir où un débrief sera initié."

 PHASE_1_Operation_DESC_GENERIC_4:0 "Tout d'abord, nous déterminerons plus d'informations sur l'amiral [?selected_operation_personnel_target.GetName], telles que ses responsabilités militaires et ses liens familiaux, ainsi que d'éventuels éléments de chantage."
 PHASE_2_Operation_DESC_GENERIC_4:0 "Ensuite, il sera nécessaire de suivre les mouvements de l'Amiral [?selected_operation_personnel_target.GetName]au cours d'une journée normale, afin de pouvoir trouver un laps de temps approprié pour l'éliminer."
 PHASE_3_Operation_DESC_GENERIC_4:0 "Le moment est venu. Nos agents retireront [?selected_operation_personnel_target.GetName], sur le chemin du travail ; ils s'échapperont ensuite vers notre site noir où un débrief sera initié."

 PHASE_1_Operation_DESC_GENERIC_5:0 "Avant de commencer toute opération, nos agents doivent infiltrer le programme et déterminer son niveau d'avancement afin de déterminer la menace qui pèse sur notre position géopolitique."
 PHASE_2_Operation_DESC_GENERIC_5:0 "Ensuite, nos agents examineront l'appareil de sécurité entourant le programme nucléaire, afin de déterminer les vulnérabilités et les moyens de collecter des renseignements exploitables sur les capacités nucléaires."
 PHASE_3_Operation_DESC_GENERIC_5:0 "Enfin, après avoir infiltré le programme nucléaire, nos agents voleront ou détruiront des documents cruciaux, notamment des rapports et des données sur l'avancement du programme nucléaire, afin de paralyser les progrès."

 PHASE_1_Operation_DESC_GENERIC_6:0 "Nos agents débuteront la surveillance de la sécurité et des opérations du site nucléaire à [?selected_operation_personnel_target.GetName], afin de déterminer la meilleure méthode d'attaque."
 PHASE_2_Operation_DESC_GENERIC_6:0 "Nos agents utiliseront ensuite les failles de sécurité critiques du site nucléaire [?selected_operation_personnel_target.GetName] pour infiltrer l'installation, se faisant passer pour des techniciens."
 PHASE_3_Operation_DESC_GENERIC_6:0 "Enfin, nos agents se mettront au travail pour détruire les infrastructures du site, notamment les centrifugeuses et les cyclotrons, ainsi que les zones de confinement, pour stopper les progrès du développement nucléaire."

 PHASE_1_Operation_DESC_GENERIC_7:0 "Nos agents débuteront la surveillance de la sécurité et des opérations de l'aérodrome à [?selected_operation_personnel_target.GetName], afin de déterminer la meilleure méthode d'attaque."
 PHASE_2_Operation_DESC_GENERIC_7:0 "Nos agents utiliseront ensuite les failles de sécurité critiques de la base aérienne [?selected_operation_personnel_target.GetName] pour infiltrer l'installation, se faisant passer pour une équipe de maintenance."
 PHASE_3_Operation_DESC_GENERIC_7:0 "Enfin, nos agents se mettront au travail pour endommager les avions, réparer les équipements, les véhicules et les hangars, afin de stopper les opérations aériennes sur cette base."

 PHASE_1_Operation_DESC_GENERIC_8:0 "Nos agents commenceront à surveiller la sécurité et les opérations du complexe de production militaire à [?selected_operation_personnel_target.GetName], afin de déterminer la meilleure méthode d'attaque."
 PHASE_2_Operation_DESC_GENERIC_8:0 "Nos agents utiliseront ensuite les failles de sécurité critiques de la base aérienne [?selected_operation_personnel_target.GetName] pour infiltrer l'installation, se faisant passer pour des employés."
 PHASE_3_Operation_DESC_GENERIC_8:0 "Enfin, nos agents se rendront au travail pour endommager les équipements de production, notamment les chaînes d'assemblage de véhicules, d'armes légères et d'avions."

 PHASE_1_Operation_DESC_GENERIC_9:0 "Nos agents débuteront la surveillance de la sécurité et des opérations du chantier naval à [?selected_operation_personnel_target.GetName], afin de déterminer la meilleure méthode d'attaque."
 PHASE_2_Operation_DESC_GENERIC_9:0 "Nos agents utiliseront ensuite les failles de sécurité critiques de la base aérienne [?selected_operation_personnel_target.GetName] pour infiltrer l'installation, se faisant passer pour des dockers."
 PHASE_3_Operation_DESC_GENERIC_9:0 "Enfin, nos agents se rendront au travail pour endommager les infrastructures, notamment les quais, les jetées et les installations de défense côtière."

 PHASE_1_Operation_DESC_GENERIC_10:0 "Nos agents débuteront la surveillance de la sécurité et des opérations du port à [?selected_operation_personnel_target.GetName], afin de déterminer la meilleure méthode d'attaque."
 PHASE_2_Operation_DESC_GENERIC_10:0 "Nos agents utiliseront ensuite les failles de sécurité critiques de la base aérienne [?selected_operation_personnel_target.GetName] pour infiltrer l'installation, se faisant passer pour des débardeurs."
 PHASE_3_Operation_DESC_GENERIC_10:0 "Enfin, nos agents se rendront au travail pour endommager les installations portuaires, notamment les grues, les équipements de manutention et les installations de stockage."

 PHASE_1_Operation_DESC_GENERIC_11:0 "Nos agents commenceront la surveillance de la sécurité et des opérations de l'usine à [?selected_operation_personnel_target.GetName], afin de déterminer la meilleure méthode d'attaque."
 PHASE_2_Operation_DESC_GENERIC_11:0 "Nos agents utiliseront ensuite les failles de sécurité critiques de l'usine [?selected_operation_personnel_target.GetName] pour infiltrer l'installation, se faisant passer pour des ouvriers d'usine."
 PHASE_3_Operation_DESC_GENERIC_11:0 "Enfin, nos agents se mettront au travail pour endommager les équipements de production, notamment les machines, le contrôle qualité et la paperasse."

 PHASE_1_Operation_DESC_GENERIC_12:0 "Nos agents débuteront la surveillance de la sécurité et du fonctionnement de l'infrastructure à [?selected_operation_personnel_target.GetName], afin de déterminer la meilleure méthode d'attaque."
 PHASE_2_Operation_DESC_GENERIC_12:0 "Nos agents se procureront et assembleront les engins explosifs appropriés afin d'infliger un maximum de dégâts."
 PHASE_3_Operation_DESC_GENERIC_12:0 "Enfin, nos agents infiltreront les infrastructures et placeront les explosifs dans des positions stratégiquement importantes afin d'infliger un maximum de dégâts et de morts."

 PHASE_1_Operation_DESC_GENERIC_13:0 "Nos agents surveilleront la cible à [GET_BLACK_OPS_OPERATION_VICTORY_POINT_NAME] afin de déterminer les niveaux de sécurité et comment procéder à une éventuelle attaque."
 PHASE_2_Operation_DESC_GENERIC_13:0 "Nos agents vont maintenant préparer les armes légères, les explosifs plastiques et les composants adéquats afin d'assembler les armes et les explosifs nécessaires pour mener à bien l'attaque."
 PHASE_3_Operation_DESC_GENERIC_13:0 "Nos agents infiltreront le site, dans le but de faire exploser des explosifs et de combattre les forces de sécurité et les civils arrivant afin de faire le plus de dégâts possible."

 PHASE_1_Operation_DESC_GENERIC_14:0 "Notre agence affrétera un camion, un bateau ou un avion pour transporter notre cargaison secrète d'armes légères, de grenades et d'explosifs plastiques vers le soulèvement local de [?selected_operation_personnel_target.GetName]."
 PHASE_2_Operation_DESC_GENERIC_14:0 "Nos agents commenceront ensuite à former les guérilleros sur les armes légères et à utiliser leurs explosifs, ainsi qu'à surveiller les forces de sécurité locales pour déterminer les vulnérabilités."
 PHASE_3_Operation_DESC_GENERIC_14:0 "Nos agents et guérilleros infiltreront ensuite des installations et des cibles clés à l'intérieur de [?selected_operation_personnel_target.GetName], dans leur plan visant à déclencher un soulèvement contre le gouvernement."

 PHASE_1_Operation_DESC_GENERIC_15:0 "Nous enverrons certains de nos agents à [GET_BLACK_OPS_OPERATION_VICTORY_POINT_NAME] pour contacter un groupe de résistance local dans l'espoir de former et de financer leurs activités."
 PHASE_2_Operation_DESC_GENERIC_15:0 "Maintenant que nos agents ont tenté de prendre contact, ils vont faire rapport à notre siège et nous informer de leurs progrès."
 PHASE_3_Operation_DESC_GENERIC_15:0 "Lors de nos contacts avec le groupe de résistance, nous discuterons de leurs objectifs et de la mission globale de leurs activités, dans le but de coordonner notre contribution à cet effort."

 PHASE_1_Operation_DESC_GENERIC_16:0 "Nos conseillers recevront les armes et explosifs que notre agence a expédiés plus tôt, afin de déterminer que nous disposons de l'équipement adéquat pour le travail."
 PHASE_2_Operation_DESC_GENERIC_16:0 "Nos conseillers donneront désormais des cours de formation secrets axés sur la sécurité, la compétence et l'adresse au tir des armes à feu."
 PHASE_3_Operation_DESC_GENERIC_16:0 "En guise de test final, nos conseillers prépareront un exercice vaste et difficile pour la résistance locale afin qu'elle fasse ses preuves et s'assure qu'elle est à la hauteur."

 PHASE_1_Operation_DESC_GENERIC_17:0 "Notre agence réalisera une étude du terrain et de la situation sécuritaire en [GET_BLACK_OPS_OPERATION_VICTORY_POINT_NAME] afin de déterminer la bonne quantité d'armes légères et d'explosifs à envoyer à la résistance locale."
 PHASE_2_Operation_DESC_GENERIC_17:0 "Nos agents largueront ensuite les armes et le matériel via un avion affrété, qui survolera de nuit une zone désignée afin d'échapper aux forces de sécurité."
 PHASE_3_Operation_DESC_GENERIC_17:0 "Une fois reçus, nos agents intégrés veilleront à ce que chaque chasseur dispose des munitions et des fournitures appropriées pour garantir sa capacité opérationnelle."

 PHASE_1_Operation_DESC_GENERIC_18:0 "Tout d'abord, nos agents seront parachutés vers [GET_BLACK_OPS_OPERATION_VICTORY_POINT_NAME], garantissant qu'ils seront récupérés à un point de dépôt par les membres du groupe de résistance local dans lequel ils s'intégreront."
 PHASE_2_Operation_DESC_GENERIC_18:0 "Maintenant que nos agents sont sur le terrain, nous assurerons des contacts appropriés avec les chefs de groupes et de cellules afin que notre agence et nos conseillers puissent rester en contact avec les principaux dirigeants de la résistance."
 PHASE_3_Operation_DESC_GENERIC_18:0 "Nos conseillers consulteront ensuite les chefs de la résistance pour assembler des cellules et des unités spécialement conçues pour des opérations spécifiques de délit de fuite ou de sabotage."

 PHASE_1_Operation_DESC_GENERIC_19:0 "Nos agents seront parachutés sur le territoire de [GET_BLACK_OPS_OPERATION_VICTORY_POINT_NAME], avec l'intention de s'intégrer aux groupes de résistance et de garantir la sécurité de leur contre-espionnage."
 PHASE_2_Operation_DESC_GENERIC_19:0 "Nos agents et conseillers se déplaceront pour garantir que les capacités de sécurité du groupe de résistance sont efficaces, y compris leur localisation et leurs actions."
 PHASE_3_Operation_DESC_GENERIC_19:0 "Nos agents et chefs de la résistance surveilleront les forces de sécurité, dans le but de leur échapper et d'empêcher que le groupe de résistance ne soit découvert."

 PHASE_1_Operation_DESC_GENERIC_20:0 "Nos agents rassembleront une équipe de voleurs compétents, comprenant des experts en sécurité, des professionnels du déguisement et du personnel local, pour voler des technologies sensibles de [local_possible_operations_personnel_target]."
 PHASE_2_Operation_DESC_GENERIC_20:0 "Grâce aux nouveaux membres de notre équipe, nos agents surveilleront l'installation contenant la technologie, afin de voler des cartes d'identité et d'autres matériaux destinés à infiltrer et voler la technologie."
 PHASE_3_Operation_DESC_GENERIC_20:0 "Avec leur nouvelle équipe, nos agents et assistants entreront par effraction dans l'établissement, volant [local_possible_operations_personnel_target] et d'autres matériaux sensibles avant de s'enfuir vers une maison sûre."

 PHASE_1_Operation_DESC_GENERIC_21:0 "Notre appareil de renseignement et de sécurité procédera immédiatement à une évaluation de la menace d'une résistance majeure à notre gouvernement, en se concentrant sur les militants violents ainsi que sur les étudiants et l'intelligentsia."
 PHASE_2_Operation_DESC_GENERIC_21:0 "Ensuite, nos agents concentreront leurs tactiques sur la localisation de tout groupe de résistance, en se concentrant sur leurs dirigeants et les principales menaces à la stabilité du gouvernement."
 PHASE_3_Operation_DESC_GENERIC_21:0 "Enfin, le point culminant de notre opération viendra lorsque nos agents et nos forces de sécurité, agissant sur la base des renseignements, attaqueront et arrêteront ou tueront ces membres de la résistance, garantissant ainsi que notre gouvernement et notre mode de vie perdurent pour un autre jour."

 PHASE_1_Operation_DESC_GENERIC_22:0 "Nos agents détermineront, à l'aide des cartes et des infrastructures disponibles, les lignes ferroviaires les plus importantes et les plus vulnérables en [?generic_operations_selected_target.GetName] afin de paralyser leur capacité de transport et de mobilisation."
 PHASE_2_Operation_DESC_GENERIC_22:0 "Nos agents sélectionneront ensuite les explosifs appropriés en quantités suffisantes pour endommager les voies ferrées, et formeront le personnel en équipes sur la façon de poser et de déclencher les explosifs à une distance sûre sans être détectés."
 PHASE_3_Operation_DESC_GENERIC_22:0 "Enfin, nos équipes et agents de démolition infiltreront [?generic_operations_selected_target.GetName], en se concentrant sur les voies ferrées vulnérables et placeront leurs explosifs, s'éloignant suffisamment avant qu'ils ne partent en pleine nuit."

 #Success/Failure Base Prompt
 PHASE_3_Operation_DESC_GENERIC_1_SUCCESS:0 "Nos agents ont réussi à établir un site noir en [?slot_one_target.GetName], où notre agence peut désormais entreprendre des opérations et des interrogatoires à l'insu des forces de sécurité ou du gouvernement local."
 PHASE_3_Operation_DESC_GENERIC_2_SUCCESS:0 "Notre plan visant à augmenter le réseau de renseignement en [?slot_one_target.GetName] a réussi ! Nous avons pu augmenter la diffusion du personnel et des renseignements sans attirer l'attention des services de sécurité locaux."
 PHASE_3_Operation_DESC_GENERIC_3_SUCCESS:0 "Nos sources confidentielles au sein de l'armée ont confirmé que l'assassinat était un succès ! Les forces de sécurité se démènent, mais nos agents ont pu s'enfuir confortablement vers notre site noir."
 PHASE_3_Operation_DESC_GENERIC_4_SUCCESS:0 "Nos sources confidentielles au sein de l'armée ont confirmé que l'assassinat était un succès ! Les forces de sécurité se démènent, mais nos agents ont pu s'enfuir confortablement vers notre site noir."
 PHASE_3_Operation_DESC_GENERIC_5_SUCCESS:0 "Nos agents du programme nucléaire ont signalé que les premières opérations de sabotage ont été couronnées de succès et que les forces de sécurité n'ont connaissance d'aucune menace."
 PHASE_3_Operation_DESC_GENERIC_6_SUCCESS:0 "Nos agents ont signalé des opérations de sabotage réussies contre l'installation nucléaire à [?slot_one_personnel_target.GetName]. Les forces de sécurité n'ont pas été alertées de la présence des agents et ceux-ci ont réussi à s'enfuir."
 PHASE_3_Operation_DESC_GENERIC_7_SUCCESS:0 "Nos agents ont signalé des opérations de sabotage réussies contre la base aérienne à [?slot_one_personnel_target.GetName]. Les forces de sécurité n'ont pas été alertées de la présence des agents et ceux-ci ont réussi à s'enfuir."
 PHASE_3_Operation_DESC_GENERIC_8_SUCCESS:0 "Nos agents ont signalé des opérations de sabotage réussies contre le complexe de production militaire à [?slot_one_personnel_target.GetName]. Les forces de sécurité n'ont pas été alertées de la présence des agents et ceux-ci ont réussi à s'enfuir."
 PHASE_3_Operation_DESC_GENERIC_9_SUCCESS:0 "Nos agents ont signalé des opérations de sabotage réussies contre le chantier naval à [?slot_one_personnel_target.GetName]. Les forces de sécurité n'ont pas été alertées de la présence des agents et ceux-ci ont réussi à s'enfuir."
 PHASE_3_Operation_DESC_GENERIC_10_SUCCESS:0 "Nos agents ont signalé des opérations de sabotage réussies contre le port à [?slot_one_personnel_target.GetName]. Les forces de sécurité n'ont pas été alertées de la présence des agents et ceux-ci ont réussi à s'enfuir."
 PHASE_3_Operation_DESC_GENERIC_11_SUCCESS:0 "Nos agents ont signalé des opérations de sabotage réussies contre l'usine à [?slot_one_personnel_target.GetName]. Les forces de sécurité n'ont pas été alertées de la présence des agents et ceux-ci ont réussi à s'enfuir."
 PHASE_3_Operation_DESC_GENERIC_12_SUCCESS:0 "Notre opération contre l'infrastructure à [?slot_one_personnel_target.GetName] a été un succès ! Nos agents ont pu déclencher les explosifs et s'enfuir avant l'arrivée des forces de sécurité."
 PHASE_3_Operation_DESC_GENERIC_13_SUCCESS:0 "Notre opération contre la cible à [?slot_one_personnel_target.GetName] a été un succès et de nombreux membres des forces de sécurité ainsi que des civils ont été tués. Nos agents se sont bien battus."
 PHASE_3_Operation_DESC_GENERIC_14_SUCCESS:0 "Nos agents ont préparé avec succès les dirigeants de la résistance locale et leur ont fourni une formation pour un prochain soulèvement contre le gouvernement actuel en [?slot_one_personnel_target.GetName]."
 PHASE_3_Operation_DESC_GENERIC_15_SUCCESS:0 "Notre contact avec le groupe de résistance en [?slot_one_personnel_target.GetName] a été fructueux et nous disposons désormais d'un réseau d'agents locaux que nous pouvons utiliser dans nos opérations ici."
 PHASE_3_Operation_DESC_GENERIC_16_SUCCESS:0 "Notre opération de formation de la résistance locale a été considérée comme un succès, car nous disposons désormais de personnel local supplémentaire à utiliser pour faire avancer nos objectifs dans le pays."
 PHASE_3_Operation_DESC_GENERIC_17_SUCCESS:0 "Nos agents et conseillers peuvent confirmer que l'opération d'armement du groupe de résistance local en [?slot_one_personnel_target.GetName] a été un succès et que tous les combattants sont entièrement équipés pour leurs opérations."
 PHASE_3_Operation_DESC_GENERIC_18_SUCCESS:0 "Notre opération visant à intégrer des conseillers dans les groupes de résistance locaux en [?slot_one_personnel_target.GetName] a été couronnée de succès et nous pouvons assurer des contacts adéquats avec les dirigeants de la résistance."
 PHASE_3_Operation_DESC_GENERIC_19_SUCCESS:0 "Notre opération visant à intégrer des groupes de résistance et à commencer le contre-espionnage a été couronnée de succès et nous avons assuré au groupe de résistance à [?slot_one_personnel_target.GetName] que ses opérations et ses actions peuvent être menées en toute sécurité."
 PHASE_3_Operation_DESC_GENERIC_20_SUCCESS:0 "Nos agents ont réussi à voler un élément technologique crucial et ont échappé aux forces de sécurité suffisamment longtemps pour remettre la technologie entre nos mains."
 PHASE_3_Operation_DESC_GENERIC_21_SUCCESS:0 "Nos services de renseignement et de sécurité ont réussi à combattre avec succès la résistance, l'insurrection et d'autres menaces contre notre appareil gouvernemental sur ce territoire. Ils ont été vaincus."
 PHASE_3_Operation_DESC_GENERIC_22_SUCCESS:0 "Nos agents et nos équipes de démolition rapportent que nous avons réussi à détruire de nombreuses lignes ferroviaires importantes en [?slot_one_target.GetName], paralysant ainsi leur capacité ferroviaire terrestre et leur vitesse de mobilisation en cas de guerre."

 PHASE_3_Operation_DESC_GENERIC_1_FAILURE:0 "Malheureusement, nos tentatives de créer un site noir en [?slot_one_target.GetName] ont échoué, car certains de nos agents ont été révélés aux forces de sécurité. Notre appareil de renseignement s'est mis en retrait, opérant actuellement depuis le consulat de la capitale."
 PHASE_3_Operation_DESC_GENERIC_2_FAILURE:0 "Malheureusement, notre projet visant à accroître notre réseau de renseignement en [?slot_one_target.GetName] a échoué. L'attention des services de sécurité locaux s'est portée sur nous et quelques informateurs ont été arrêtés et interrogés, ce qui a conduit à une réorganisation de nos agents pour assurer leur sécurité."
 PHASE_3_Operation_DESC_GENERIC_3_FAILURE:0 "Malheureusement, notre tentative d'assassinat contre le général [?slot_one_personnel_target.GetName] a échoué, car nos agents ont tué par erreur l'assistant du général à la place. Certains agents ont pu s'enfuir mais plusieurs ont été capturés par les forces de sécurité."
 PHASE_3_Operation_DESC_GENERIC_4_FAILURE:0 "Malheureusement, notre tentative d'assassinat contre l'amiral [?slot_one_personnel_target.GetName] a échoué, car nos agents ont tué par erreur l'assistant de l'amiral à la place. Certains agents ont pu s'enfuir mais plusieurs ont été capturés par les forces de sécurité."
 PHASE_3_Operation_DESC_GENERIC_5_FAILURE:0 "Malheureusement, nos agents du programme nucléaire ont signalé que leurs tentatives initiales visant à saboter les progrès du développement nucléaire avaient été stoppées par les forces de sécurité."
 PHASE_3_Operation_DESC_GENERIC_6_FAILURE:0 "Malheureusement, nos agents ont signalé qu'ils n'avaient pas pu infiltrer et saboter l'installation nucléaire à [?slot_one_personnel_target.GetName]. Les forces de sécurité ont été alertées de leur emplacement et certains ont été capturés, même si quelques-uns ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_7_FAILURE:0 "Malheureusement, nos agents ont signalé qu'ils n'avaient pas pu infiltrer et saboter la base aérienne à [?slot_one_personnel_target.GetName]. Les forces de sécurité ont été alertées de leur emplacement et certains ont été capturés, même si quelques-uns ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_8_FAILURE:0 "Malheureusement, nos agents ont signalé qu'ils n'avaient pas pu infiltrer et saboter le complexe de production militaire à [?slot_one_personnel_target.GetName]. Les forces de sécurité ont été alertées de leur emplacement et certains ont été capturés, même si quelques-uns ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_9_FAILURE:0 "Malheureusement, nos agents ont signalé qu'ils n'avaient pas pu infiltrer et saboter le chantier naval à [?slot_one_personnel_target.GetName]. Les forces de sécurité ont été alertées de leur emplacement et certains ont été capturés, même si quelques-uns ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_10_FAILURE:0 "Malheureusement, nos agents ont signalé qu'ils n'avaient pas pu infiltrer et saboter le port à [?slot_one_personnel_target.GetName]. Les forces de sécurité ont été alertées de leur emplacement et certains ont été capturés, même si quelques-uns ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_11_FAILURE:0 "Malheureusement, nos agents ont signalé qu'ils n'avaient pas pu infiltrer et saboter l'usine à [?slot_one_personnel_target.GetName]. Les forces de sécurité ont été alertées de leur emplacement et certains ont été capturés, même si quelques-uns ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_12_FAILURE:0 "Malheureusement, notre opération contre l'infrastructure à [?slot_one_personnel_target.GetName] n'a pas abouti. Certaines bombes n'ont pas explosé et seuls quelques agents ont pu s'enfuir avant l'arrivée des forces de sécurité."
 PHASE_3_Operation_DESC_GENERIC_13_FAILURE:0 "Malheureusement, notre opération contre la cible à [?slot_one_personnel_target.GetName] a échoué, car les forces de sécurité ont réussi à arrêter nos hommes et à les arrêter avant qu'ils ne puissent commettre une attaque."
 PHASE_3_Operation_DESC_GENERIC_14_FAILURE:0 "Malheureusement, nos agents n'ont pas été en mesure de former efficacement des groupes de résistance locaux lors d'un soulèvement local en [?slot_one_personnel_target.GetName]. Les forces de sécurité ont pu arrêter les leaders de la résistance tandis que nos agents ont pu s'enfuir."
 PHASE_3_Operation_DESC_GENERIC_15_FAILURE:0 "Malheureusement, notre tentative de contacter le groupe de résistance en [?slot_one_personnel_target.GetName] a été jugée un échec, car ils étaient hostiles à nos tentatives et leurs objectifs ne correspondaient pas à nos objectifs."
 PHASE_3_Operation_DESC_GENERIC_16_FAILURE:0 "Malheureusement, notre opération de formation de la résistance locale a échoué, principalement en raison du manque de compétence des dirigeants et du personnel de la résistance et du manque de connaissances."
 PHASE_3_Operation_DESC_GENERIC_17_FAILURE:0 "Malheureusement, notre opération visant à armer la résistance locale en [?slot_one_personnel_target.GetName] a été considérée comme un échec, car ils n'ont pas été en mesure de récupérer les armes et d'assurer un armement adéquat à temps pour les opérations."
 PHASE_3_Operation_DESC_GENERIC_18_FAILURE:0 "Malheureusement, nos agents n'ont pas pu s'intégrer efficacement aux groupes de résistance en [?slot_one_personnel_target.GetName], en raison du manque de contact et de l'hostilité entre nos agents et les résistants."
 PHASE_3_Operation_DESC_GENERIC_19_FAILURE:0 "Malheureusement, nos opérations de contre-espionnage en [?slot_one_personnel_target.GetName] ont échoué, car les forces de sécurité ont eu vent de la présence du groupe de résistance et sont intervenues."
 PHASE_3_Operation_DESC_GENERIC_20_FAILURE:0 "Malheureusement, notre tentative de vol de [local_possible_operations_personnel_target] a échoué, car certains de nos agents ont été rattrapés par les forces de sécurité alors qu'ils tentaient de fuir et ont été appréhendés."
 PHASE_3_Operation_DESC_GENERIC_21_FAILURE:0 "Malheureusement, nos services de renseignement et de sécurité n'ont pas été en mesure d'arrêter complètement l'insurrection et la résistance en cours sur notre sol. Certains renseignements étaient complètement erronés et ont coûté la vie à de nombreux officiers, vies qui ne seront jamais récupérées. Nous allons continuer."
 PHASE_3_Operation_DESC_GENERIC_22_FAILURE:0 "Malheureusement, nos équipes de démolition n'ont pas pu endommager les voies ferrées sélectionnées en [?slot_one_target.GetName]. Certaines équipes ont réussi, même si quelques-unes ont été arrêtées par les services de sécurité ou leurs explosifs n'ont pas explosé."

