  #OLD
 operation_boost_resistance:0 "Résistance financière"
 operation_boost_resistance_desc:0 "§LLes insurgés présents dans les territoires occupés par l'ennemi ont désespérément besoin de soutien pour poursuivre le combat. Ils immobilisent un nombre important de troupes ennemies et constitueraient un investissement très efficace.§!"
 operation_capture_cipher:0 "Cracker la clé de cryptage"
 operation_capture_cipher_desc:0 "§LDéchiffrer une clé de chiffrement ou un protocole de sécurité ennemi facilitera grandement nos efforts de collecte d'informations.§!"
 infiltration_paradrop:0 "Infiltration profonde de fils"
 infiltration_paradrop_desc:0 "Les agents seront parachutés dans la zone. Voler à basse altitude et de nuit évitera toute interférence du radar ennemi."
 infiltration_submarine:0 "Déploiement via sous-marin"
 infiltration_submarine_desc:0 "Les agents seront livrés à proximité du rivage par l'un de nos sous-marins. Nous avons déjà reconnu les sites d'atterrissage possibles et le calendrier des patrouilles ennemies pour éviter d'être détectés."
 infiltration_border:0 "Infiltration à travers une frontière neutre"
 infiltration_border_desc:0 "Les agents s'infiltreront à travers une frontière neutre. Les gardes-frontières présents dans la région devraient être moins vigilants et nous avons déjà identifié un certain nombre de zones où les patrouilles frontalières sont très rares."
 infiltration_diplomatic:0 "Passeports diplomatiques"
 infiltration_diplomatic_desc:0 "Les agents utiliseront des passeports diplomatiques pour entrer dans le pays et se déplacer. Nous nous attendons à ce que le contre-espionnage ennemi tente de les suivre, mais cela peut être surmonté avec un entraînement suffisant."
 resistance_support_arms_depots:0 "Créer des caches de ravitaillement"
 resistance_support_arms_depots_desc:0 "Nos agents installeront un certain nombre de caches cachées d'explosifs et d'autres équipements, en préparation d'un soulèvement général une fois que la résistance sera suffisamment forte."
 resistance_support_distribute_weapons:0 "Distribuer des armes"
 resistance_support_distribute_weapons_desc:0 "Nos agents organiseront et coordonneront une série de largages d'armes. Les armes seront ensuite remises à des membres de confiance de la résistance locale."
 resistance_support_organize_training:0 "Organiser des camps d'entraînement"
 resistance_support_organize_training_desc:0 "Nos agents dispenseront des cours sur les techniques d'évasion et d'évasion ainsi que sur les techniques de terrain de base. Les étudiants les plus prometteurs suivront ensuite une formation de base sur les armes à feu."
 resistance_support_coordinate_groups:0 "Coordonner les groupes de résistance"
 resistance_support_coordinate_groups_desc:0 "Nos agents se déplaceront pour coordonner différents groupes de résistance. Forger une alliance entre les unités politiquement fracturées demandera du temps."
 exfiltration_air_pickup:0 "Prise en charge en avion"
 exfiltration_air_pickup_desc:0 "Un de nos avions traversera de nuit le territoire ennemi, trouvera un champ marqué, atterrira et récupérera nos agents."
 exfiltration_submarine_pickup:0 "Prise en charge par sous-marin"
 exfiltration_submarine_pickup_desc:0 "L'un de nos sous-marins sera stationné à un point de ramassage désigné le long de la côte. Le timing sera crucial puisque les patrouilles navales ennemies couvrent la zone."
 exfiltration_border:0 "Randonnée à travers la frontière"
 exfiltration_border_desc:0 "Nos agents s'échapperont en traversant la frontière de nuit dans un endroit éloigné. Des guides locaux sont prêts à vous aider à naviguer dans cette zone dangereuse."
 exfiltration_go_to_ground:0 "Aller au sol"
 exfiltration_go_to_ground_desc:0 "Nos agents resteront discrets et se fondront dans la population jusqu'à ce qu'ils soient prêts pour la prochaine mission. Si l'occasion se présente d'exfiltrer par d'autres moyens, ils la saisiront."
 operation_make_resistance_contacts:0 "Établir des contacts de résistance"
 operation_make_resistance_contacts_desc:0 "§LTout soutien que nous pouvons offrir aux partisans actifs derrière les lignes ennemies deviendrait bien plus efficace si nous disposions d'un moyen de communiquer et de nous coordonner avec eux.§!"
 capture_cyphers_bribe:0 "Pot-de-vin, soldat"
 capture_cyphers_bribe_desc:1 "Nous avons un homme à l'intérieur et nous lui fournirons les fonds nécessaires pour voler un livre de codes et le remettre à notre agent."
 capture_cyphers_raid:0 "Raid de commandos des forces spéciales"
 capture_cyphers_raid_desc:0 "Notre agent explorera la zone et demandera à une unité commando des forces spéciales d'atterrir et de capturer les livres de codes et l'équipement de cryptage. Nous tenterons également de capturer un ou deux spécialistes du chiffrement pour les interroger."
 capture_cyphers_seduction:0 "Utiliser la séduction"
 capture_cyphers_seduction_desc:0 "Notre agent contactera une personne ayant accès aux chiffres et utilisera son charme - ou d'autres moyens - pour en obtenir une copie."
 capture_cyphers_reverse_engineer:0 "Ingénierie inverse"
 capture_cyphers_reverse_engineer_desc:0 "Une version plus simple de la principale machine de cryptage du pays est disponible dans le commerce. Nous acquerrons une version légalement et l'utiliserons ensuite pour nous aider à procéder à la rétro-ingénierie d'une machine de décryptage."
 resistance_contacts_radio_circuits:0 "Créer des circuits radio"
 resistance_contacts_radio_circuits_desc:0 "L'équipe distribuera des radios aux membres de la résistance et enseignera le protocole radio de base, notamment en vue d'éviter la radiogoniométrie ennemie."
 resistance_support_pidgeons:0 "Distribuer des cryptophones"
 resistance_support_pidgeons_desc:0 "L'équipe distribuera des cryptophones à différents spécialistes des communications liés à la résistance. Ils serviront à remonter les messages vers nos lignes."
 resistance_contacts_briefings:0 "Briefings stratégiques"
 resistance_contacts_briefings_desc:0 "Notre agent informera les dirigeants des différents groupes de résistance des opérations prévues pour coordonner le soutien de la résistance."
 capture_cyphers_smuggle:0 "Faire passer des chiffres en contrebande"
 capture_cyphers_smuggle_desc:0 "L'un de nos agents doubles demandera le transfert d'une nouvelle copie du chiffre actuellement actif. Une coordination avec d'autres services est en cours pour garantir que le dépôt ne soit pas interrompu."
 operation_steal_tech_airforce:1 "Voler les plans de l'industrie aéronautique"
 operation_steal_tech_airforce_desc:0 "§LNous avons reçu un certain nombre de rapports très inquiétants selon lesquels l'ennemi est en avance sur nous dans plusieurs domaines de la conception des avions. Si tel est le cas, nous pourrions tenter de mieux comprendre leur avance exacte et utiliser ces résultats pour faire avancer nos propres recherches.§!"
 operation_infiltrate_armed_forces_navy:0 "Infiltrer la marine"
 operation_infiltrate_armed_forces_navy_desc:0 "§LSi les équipages soudés des navires [From.GetAdjective] offrent peu de possibilités d'infiltration, le personnel de soutien au pays est une autre affaire. Faire intervenir quelqu'un à l'intérieur nous fournirait des informations précieuses ainsi que la possibilité de soutenir des opérations plus difficiles ultérieurement.§!"
 operation_infiltrate_civilian:0 "Infiltrer l'administration civile"
 operation_infiltrate_civilian_desc:0 "§LLe gouvernement [From.GetAdjective] présente de nombreux points faibles à travers lesquels nous pourrions infiltrer un agent dans ses opérations. Cela nous donnerait un aperçu précieux du fonctionnement interne de [From.GetNameDef] ainsi que l'opportunité d'utiliser cet agent dans de futures opérations contre [From.GetNameDef].§!"
 operation_infiltrate_armed_forces_airforce:0 "Infiltrer l'armée de l'air"
 operation_infiltrate_armed_forces_airforce_desc:0 "§LLa [From.getAdjective] Air Force est la plus jeune des [From.GetAdjective] forces armées. A ce titre, elle compte dans ses rangs de nombreuses personnes issues de parcours atypiques. Nous pourrions en exploiter certains pour mettre un homme à l'intérieur.§!"
 operation_infiltrate_armed_forces_army:0 "Infiltrer l'armée"
 operation_infiltrate_armed_forces_army_desc:0 "§LL'Armée [From.GetAdjective] compte un certain nombre de personnes dans ses rangs qui pourraient être sollicitées pour fournir des informations supplémentaires et un soutien pour les opérations futures.§!"
 operation_steal_tech_army:1 "Voler des plans militaires"
 operation_steal_tech_army_desc:0 "§LNos analystes du renseignement estiment que [From.GetNameDef] a réalisé des progrès significatifs dans le domaine de la guerre terrestre et de l'ingénierie militaire. Une enquête plus approfondie, associée à des méthodes plus directes, pourrait fournir des informations précieuses pour nos propres projets de recherche.§!"
 operation_steal_tech_civilian:1 "Voler des plans industriels"
 operation_steal_tech_civilian_desc:0 "§LIl apparaît que notre industrie est en retard de [From.GetNameDef] dans plusieurs domaines. Avec un peu de ruse et un peu de subterfuge, nous parviendrons peut-être à réduire considérablement l'écart.§!"
 operation_steal_tech_navy:1 "Voler des plans navals"
 operation_steal_tech_navy_desc:0 "§LIl a été rapporté que les [From.GetAdjective] semblent être en avance sur nous dans certains domaines de l'ingénierie navale. Nous pourrions être en mesure d'acquérir une partie de cette technologie pour la rétro-ingénierie.§!"
 infiltrate_military_bribe:0 "Offrir un pot-de-vin"
 infiltrate_military_bribe_desc:1 "Notre agent identifiera une personne en difficulté financière et lui proposera une somme substantielle pour nous apporter son soutien. Les fonds seront mis à disposition par le Trésor."
 infiltrate_military_seduction:0 "Appliquer des charmes"
 infiltrate_military_seduction_desc:1 "Notre agent entrera dans une relation très étroite et intime avec quelqu'un à l'intérieur pour obtenir des informations et tirer parti de lui."
 infiltrate_military_turned_pow:0 "Devenez prisonnier de guerre"
 infiltrate_military_turned_pow_desc:0 "Nous identifierons un prisonnier de guerre utilisable dont nous avons la garde, le remettrons à nos côtés, puis le rapatrierons. Il sera sans aucun doute interrogé, mais avec une formation appropriée, il sera capable de surmonter cela."
 infiltrate_military_ideological_supporter:0 "Contacter un partisan idéologique"
 infiltrate_military_ideological_supporter_desc:1 "Nous utiliserons les voies diplomatiques pour identifier et contacter les membres de l'administration [From.GetAdjective] ayant des opinions politiques que leur gouvernement ne partage pas et les encouragerons à travailler pour nous."
 steal_blueprints_bribe:0 "Offrir un pot-de-vin"
 steal_blueprints_bribe_desc:0 "Notre Agent offrira une somme substantielle à un ingénieur impliqué dans le projet."
 steal_blueprints_seduction:0 "Appliquer des charmes"
 steal_blueprints_seduction_desc:0 "Notre agent se rapprochera d'une personne impliquée dans le projet et appliquera ses charmes pour obtenir des informations supplémentaires. Même si nous ne nous attendons pas à ce que quiconque nous remette un ensemble complet de plans pour passer du temps de qualité en entreprise, les discussions sur l'oreiller sont souvent négligées."
 steal_blueprints_infiltrate_naval_design_office:0 "Infiltrer le bureau d'études naval"
 steal_blueprints_infiltrate_naval_design_office_desc:0 "Notre agent entrera chez un petit fournisseur en construction navale en tant qu'employé mineur et utilisera ce poste pour faire des copies des plans disponibles."
 steal_blueprints_steal_prototype:0 "Voler un prototype"
 steal_blueprints_steal_prototype_desc:0 "Après avoir suivi une formation de base en vol, et accompagné d'un pilote d'essai de notre armée de l'air, notre agent aura accès à un prototype et le fera voler jusqu'à nos lignes. Une escorte de chasseurs sera organisée pour garantir que le prototype nous parvienne intact."
 steal_blueprints_middle_manager:0 "Infiltrer le middle management"
 steal_blueprints_middle_manager_desc:0 "Notre agent utilisera les références fournies et un CV falsifié pour obtenir un emploi dans l'encadrement intermédiaire d'une grande entreprise. À partir de cette position, ils devraient être en mesure de fournir des informations sur cette entreprise ainsi que sur le secteur dans son ensemble."
 lar_communist_uprising_organise_cells:0 "Organiser des cellules révolutionnaires"
 lar_communist_uprising_organise_cells_desc:0 "Nos agents travailleront avec quelques ouvriers sélectionnés pour créer des comités d'action révolutionnaire afin de transporter les graines de la révolution dans chaque usine."
 lar_communist_uprising_infiltrate_civil_service:0 "Infiltrer la fonction publique"
 lar_communist_uprising_infiltrate_civil_service_desc:0 "Notre agent veillera à ce que plusieurs personnes de confiance entrent dans la fonction publique, pour former le noyau d'une administration civile après le succès de la révolution."
 lar_communist_uprising_train_workers_militia:0 "Former la milice ouvrière"
 lar_communist_uprising_train_workers_militia_desc:0 "Notre agent organisera la formation de base d'un certain nombre de camarades triés sur le volet, qui formeront ensuite le cadre des unités de milice."
 lar_communist_uprising_organize_strikes:0 "Organiser des grèves"
 lar_communist_uprising_organize_strikes_desc:0 "Notre agent contactera les syndicats et autres personnes politiquement fiables travaillant dans des secteurs clés et les aidera à organiser une grève, qui sera exécutée lorsque la guerre éclatera."
 lar_fra_coup_pre_position_units:0 "Unités de prépositionnement"
 lar_fra_coup_pre_position_units_desc:0 "Notre agent prendra en charge un certain nombre d'unités de l'armée sympathisantes dans la zone et leur assignera des objectifs à saisir au début de l'opération."
 lar_fra_launch_coup:0 "Coup de lancement"
 lar_fra_launch_coup_desc:0 "Les opérations commenceront dès la réception d'un signal radio codé."
 
 targeted_sabotage_plant_explosives:0 "Explosifs végétaux"
 targeted_sabotage_plant_explosives_desc:0 "En collaboration avec des résistants locaux, nos agents infiltreront l'usine en pleine nuit, placeront des explosifs à proximité des structures porteuses et feront ainsi effondrer tout le hall de l'usine au-dessus des équipements de production."
 targeted_sabotage_organize_more_meetings:0 "Organisez plus de réunions"
 targeted_sabotage_organize_more_meetings_desc:0 "Des entretiens avec des travailleurs ont montré que la tenue de réunions prolongées pour discuter de problèmes mineurs a pour effet de ralentir considérablement la production, à un coût minime pour nos opérateurs."
 targeted_sabotage_destroy_bridge:0 "Détruire le pont"
 targeted_sabotage_destroy_bridge_desc:0 "La résistance locale a identifié un pont constituant un pilier des efforts d'approvisionnement de l'ennemi dans la région. Nos agents feront tomber la travée avec quelques kilos d'explosifs puissants."
 targeted_sabotage_collapse_tunnel:0 "Tunnel d'effondrement"
 targeted_sabotage_collapse_tunnel_desc:0 "La principale ligne ferroviaire de l'État traverse un tunnel étroit. Nos agents ont identifié les points faibles structurels de la construction et utiliseront des explosifs pour faire effondrer le tunnel."
 targeted_sabotage_remove_roadsigns:0 "Supprimer les panneaux routiers"
 targeted_sabotage_remove_roadsigns_desc:0 "Nos agents abattront les panneaux de signalisation et en retourneront les autres dans le but de rendre plus difficile la navigation des troupes d'occupation."
 targeted_sabotage_immobilize_rolling_stock:0 "Immobiliser le matériel roulant"
 targeted_sabotage_immobilize_rolling_stock_desc:0 "Une poignée de sable dans les points de graissage d'un wagon finira par l'arrêter, bloquant ainsi une voie ferrée jusqu'à ce qu'elle puisse être réparée. Même un petit nombre de voitures en panne pourrait faire s'effondrer l'ensemble du système."
 targeted_sabotage_burn_storage:0 "Stockage des gravures"
 targeted_sabotage_burn_storage_desc:0 "Les résistances locales ont identifié des unités de stockage contenant des composés hautement inflammables. Sous le couvert de la nuit, nos agents mettront le feu au stockage puis se retireront dans la confusion qui s'ensuivra."
 targeted_sabotage_destroy_mining_equipment:0 "Détruire l'équipement minier"
 targeted_sabotage_destroy_mining_equipment_desc:0 "Les groupes de résistance locaux ont souligné qu'une grande partie de l'équipement lourd utilisé dans l'exploitation minière est extrêmement vulnérable. Nos agents utiliseront des explosifs pour désactiver un certain nombre de pièces critiques afin d'arrêter toute l'opération minière."
 operation_targeted_sabotage_industry:0 "Industrie du sabotage"
 operation_targeted_sabotage_industry_desc:0 "§LLa résistance en territoire ennemi a demandé de l'aide pour désactiver une installation industrielle locale.§!"
 operation_targeted_sabotage_infrastructure:0 "Infrastructures de sabotage"
 operation_targeted_sabotage_infrastructure_desc:0 "§LLa résistance en territoire ennemi a mené un effort discret contre les infrastructures ennemies, mais n'a jusqu'à présent pas eu les ressources nécessaires pour avoir un impact important.§!"
 operation_targeted_sabotage_resources:0 "Ressources sur le sabotage"
 operation_targeted_sabotage_resources_desc:0 "§LLa résistance en territoire ennemi nous a informé des efforts de l'ennemi pour extraire les ressources de l'État. Une clé bien placée dans ces plans empêcherait cela.§!"
 operation_rescue_operative:0 "Sauver un agent capturé"
 operation_rescue_operative_desc:0 "§LL'un de nos atouts a été retiré du plateau par l'ennemi. Il faut le récupérer, et vite, avant qu'il ne soit définitivement retiré du jeu.§!"
 free_operative_free_in_transit:0 "Gratuit en transit"
 free_operative_free_in_transit_desc:0 "Notre agent est déplacé en voiture entre la prison dans laquelle il est détenu et le lieu où il est interrogé. Nous connaissons l'itinéraire et enverrons une petite unité pour tendre une embuscade, tuer les gardes et libérer notre agent."
 free_operative_liberate_camp:0 "Libérer le camp"
 free_operative_liberate_camp_desc:0 "Pendant son interrogatoire, notre agent est détenu dans un camp avec d'autres prisonniers importants. Nous lancerons une attaque contre le camp avec une petite unité, maîtriserons tous les gardes présents et libérerons notre agent."
 free_operative_smuggle_in_escape_gear:0 "Faire entrer clandestinement des équipements d'évacuation"
 free_operative_smuggle_in_escape_gear_desc:0 "Nos scientifiques ont développé un ensemble d'outils d'évasion. Nous avons un contact local qui a accepté de prendre le colis. Notre agent utilisera ensuite les outils fournis et se dirigera vers le rendez-vous pour l'exfiltration."
 operation_outcome_consumes_token_tt:1 "Cette opération pourrait brûler un §YActif infiltré§!."
 operation_outcome_sabotage_industry_tt:0 "Concentre la résistance locale sur le ciblage de l'industrie et augmente les chances de réussite des attaques."
 operation_outcome_sabotage_infrastructure_tt:0 "Concentre la résistance locale sur le ciblage des infrastructures et augmente les chances de réussite des attaques."
 operation_outcome_sabotage_resources_tt:0 "Concentre la résistance locale sur le ciblage de l'extraction des ressources et augmente les chances de réussite des attaques."
 operation_coup_government:0 "Orchestrer un coup d'État"
 operation_coup_government_desc:0 "§L[From.GetNameDefCap] est mûr pour un changement de régime. Quelques personnes bonnes et fiables - avec un soutien approprié - pourraient renverser la structure pourrie qui soutient le gouvernement [From.GetAdjective].§!"
 collaboration_government_set_up_planning_committees:0 "Mettre en place des comités de planification"
 collaboration_government_set_up_planning_committees_desc:0 "Notre équipe rencontrera des politiciens sympathiques pour discuter de la possibilité de former un nouveau gouvernement pour administrer [From.GetNameDef] après notre occupation, et formera quelques petits groupes de travail qui régleront les détails."
 collaboration_government_train_paramilitary_forces:0 "Former les forces paramilitaires"
 collaboration_government_train_paramilitary_forces_desc:0 "Notre équipe organisera et formera certaines unités pour aider le nouveau gouvernement à maintenir l'ordre public. Jusqu'à ce que le nouveau gouvernement soit organisé, ils contribueront à maintenir la sécurité des zones arrière."
 collaboration_government_contact_military_officers:0 "Contacter les officiers militaires"
 collaboration_government_contact_military_officers_desc:0 "Notre équipe suivra certaines pistes qui indiquent que certains officiers militaires à la retraite sont profondément mécontents du gouvernement [From.GetAdjective] actuel et seraient prêts à nous aider à créer un nouveau gouvernement après notre occupation."
 operation_collaboration_government:0 "Préparer la collaboration du gouvernement"
 operation_collaboration_government_desc:0 "§LAvoir un gouvernement ami en charge de [From.GetNameDef] nous permettrait de nous concentrer sur nos autres ennemis et de libérer des troupes pour poursuivre d'autres objectifs.§!"
 fake_intel_decoy_tanks:0 "Réservoirs leurres"
 fake_intel_decoy_tanks_desc:0 "Nous avons inventé des leurres bon marché qui ressemblent de loin à des tanks. Nous les placerons dans des endroits facilement observables et veillerons à ce que l'ennemi ait suffisamment de temps pour les remarquer."
 fake_intel_radio_deception:0 "Cyber-tromperie"
 fake_intel_radio_deception_desc:0 "Nous mettrons en place une petite unité de cyberspécialistes, faisant semblant d'être le détachement des transmissions d'une formation beaucoup plus grande. Ils utiliseront également une ancienne version de nos chiffres, pour permettre à l'ennemi de lire plus facilement leurs messages."
 fake_intel_deliberate_leaks:0 "Fuites délibérées"
 fake_intel_deliberate_leaks_desc:0 "Certains de nos agents dans les pays étrangers veilleront à ce qu'ils soient indiscrets envers les bonnes personnes, garantissant ainsi que l'ennemi obtient les informations souhaitées via des sources « dignes de confiance »."
 fake_intel_press_releases:0 "Communiqués de presse"
 fake_intel_press_releases_desc:0 "Nous inviterons les journalistes à écrire des articles très détaillés sur certaines des choses que nous aimerions que l'ennemi sache."
 fake_intel_utilize_double_agents:0 "Utiliser des agents doubles"
 fake_intel_utilize_double_agents_desc:0 "Nous avons transformé un certain nombre d'informateurs subalternes des services secrets ennemis. Ils seront encouragés à fournir à l'autre partie le bon type d'informations."
 fake_intel_plant_evidence:0 "Preuve végétale"
 fake_intel_plant_evidence_desc:0 "Nous organiserons une petite opération dans un endroit contrôlé par l'ennemi mais qui ne nous intéresse pas actuellement, et nous veillerons à laisser derrière nous de nombreuses preuves."
 fake_intel_release_pow:0 "Libérer la puissance"
 fake_intel_release_pow_desc:0 "Un officier ennemi capturé doit être rapatrié chez lui pour des raisons humanitaires. Avant son départ, nous veillerons à ce qu'il voie accidentellement un certain nombre de choses."
 operation_fake_intel:0 "Planter une fausse intelligence"
 operation_fake_intel_desc:0 "§LNous savons que le renseignement [From.GetAdjective] est actif dans notre pays. Parfois, il est préférable de donner à quelqu'un qui recherche des informations exactement ce qu'il veut entendre.§!"

 infiltration_paradrop_outcome:0 "Malgré quelques difficultés à trouver la zone de largage dans l'obscurité, l'équipe a atterri en toute sécurité."
 infiltration_submarine_outcome:0 "Après une première tentative brisée par de hautes vagues, une deuxième tentative d'atterrissage le lendemain a été couronnée de succès et a permis à l'équipe de rejoindre le rivage en toute sécurité."
 infiltration_border_outcome:0 "Sous couvert de conditions météorologiques très défavorables, notre équipe a trouvé la piste précédemment repérée et a traversé la frontière sans autre problème."
 infiltration_diplomatic_outcome:0 "L'équipe n'a eu aucune difficulté à pénétrer dans le pays et a habilement évité la queue du contre-espionnage ennemi qui leur était imposée."
 exfiltration_air_pickup_outcome:0 "Le petit avion de messagerie a réussi à trouver le point de ramassage sans problème et a ramené l'équipe en toute sécurité à nos lignes."
 exfiltration_submarine_pickup_outcome:0 "Après plusieurs jours tendus de jeu à cache-cache avec une patrouille ennemie locale, notre équipe a réussi à organiser un ramassage et à quitter la zone sans être détectée."
 exfiltration_border_outcome:0 "L'équipe s'est échappée en traversant la frontière sous le couvert de la nuit, en faisant appel à un guide local pour les aider à trouver un chemin à travers les défenses frontalières."
 exfiltration_go_to_ground_outcome:0 "Notre équipe s'est mélangée aux civils locaux et envisage actuellement soit de regagner nos lignes, soit de rester dans la région pour d'autres missions."
 fake_intel_decoy_tanks_outcome:0 "Même si l'ennemi a effectué quelques sorties de reconnaissance dans la zone, nous ne pouvons pas être sûrs qu'il ait repéré les leurres et qu'il ait été convaincu par ceux-ci. Nous attendons la confirmation d'autres sources qu'ils ont mordu à l'hameçon."
 fake_intel_radio_deception_outcome:0 "Nos cyber-opérateurs ont produit beaucoup de trafic. Il est difficile de dire si l'ennemi a réellement surveillé tout cela."
 fake_intel_deliberate_leaks_outcome:0 "Nous avons veillé à ce que les agents ennemis reçoivent un certain nombre de petites fuites qui donnent une image totalement différente de la réalité. Reste à savoir si l'autre partie l'a acheté."
 fake_intel_press_releases_outcome:0 "Notre Département de l'information publique a veillé à ce que la couverture médiatique dans des journaux amis et neutres corresponde à peu près à ce que nous souhaitons."
 fake_intel_utilize_double_agents_outcome:0 "Nos agents doubles ont fourni à l'autre partie une généreuse dose d'informations, certaines même correctes, pour garantir que l'ennemi continue de leur faire confiance."
 fake_intel_plant_evidence_outcome:0 "Le raid que nous avons mené a été un succès total et l'autre camp a récupéré de nombreuses preuves de notre opération. Les premiers rapports indiquent qu'un certain nombre de mouvements de troupes ont déjà eu lieu en réponse à cette situation."
 fake_intel_release_pow_outcome:0 "L'officier a été conduit à proximité de plusieurs campements militaires et a pu remarquer divers écussons d'unités pour des divisions qui n'existent pas réellement."
 targeted_sabotage_plant_explosives_outcome:0 "L'équipe a réussi à placer les explosifs et à faire tomber le bâtiment. Les dégâts sur les machines-outils seraient légers, mais leur reconstruction prendra encore beaucoup de temps."
 targeted_sabotage_organize_more_meetings_outcome:0 "Notre agent a réussi à infiltrer la direction intermédiaire de l'entreprise cible et a restructuré de manière agressive les processus pour trouver de plus grandes synergies en favorisant l'engagement avec les principales parties prenantes. La productivité a considérablement chuté."
 targeted_sabotage_destroy_bridge_outcome:0 "L'équipe a posé les explosifs et réglé la mèche pour qu'elle coïncide avec le passage d'un train. Entre l'explosion et les dégâts causés par le train qui a déraillé, toute la travée est tombée dans le fleuve."
 targeted_sabotage_collapse_tunnel_outcome:0 "Après avoir identifié les points faibles de la structure, l'équipe a placé des explosifs et s'est retirée. Bien que les dommages causés au tunnel soient réparables, il faudra un certain temps avant que le tunnel soit à nouveau pleinement utilisable."
 targeted_sabotage_remove_roadsigns_outcome:0 "L'équipe a réussi à supprimer les panneaux routiers à un certain nombre d'intersections importantes et à les remplacer à d'autres endroits, créant ainsi une grande confusion parmi les conducteurs peu familiers avec la région."
 targeted_sabotage_immobilize_rolling_stock_outcome:0 "L'équipe a infiltré un dépôt ferroviaire et a réussi à saboter un certain nombre de véhicules. Les effets ne devraient se faire sentir qu'après que le véhicule ait parcouru quelques kilomètres et se retrouve bloqué sur la voie publique."
 targeted_sabotage_burn_storage_outcome:0 "L'équipe a réussi à mettre le feu aux zones de stockage locales, détruisant des centaines de tonnes de ressources stockées et affectant gravement la capacité à maintenir un stock."
 targeted_sabotage_destroy_mining_equipment_outcome:0 "L'équipe a réussi à saboter la plupart des équipements miniers lourds. Même si certains dégâts peuvent être superficiels, ils créeront néanmoins de sérieux goulots d'étranglement dans le flux de production."
 steal_blueprints_bribe_outcome:0 "Nous avons pris contact avec un ingénieur en difficulté financière et l'avons convaincu de se séparer de quelques papiers secrets en échange d'une monnaie convertible."
 steal_blueprints_seduction_outcome:0 "Notre agent a trouvé un ingénieur ayant besoin de compagnie personnelle et qui a été très ouvert sur son travail."
 steal_blueprints_infiltrate_naval_design_office_outcome:0 "Notre agent a réussi à infiltrer un fournisseur d'équipement naval et à faire des copies d'un certain nombre de plans de composants clés."
 steal_blueprints_steal_prototype_outcome:0 "Le prototype a été récupéré avec succès et transporté par avion vers un aérodrome ami. Nos ingénieurs sont en train de le démonter."
 steal_blueprints_middle_manager_outcome:0 "Le temps passé par notre agent dans la gestion d'une petite entreprise a considérablement accru notre compréhension de l'économie ennemie. Nous enquêtons toujours sur des informations selon lesquelles la productivité aurait augmenté pendant que notre agent y travaillait."
 capture_cyphers_bribe_outcome:0 "Notre agent a obtenu une copie complète du livre de codes auprès d'une source anonyme en échange de quelques objets de valeur."
 capture_cyphers_raid_outcome:0 "Une petite unité Commando a attaqué avec succès une station de radio et a réussi à obtenir des copies du chiffre actuel avant qu'il ne puisse être détruit."
 capture_cyphers_seduction_outcome:0 "Notre agent a réussi à convaincre une personne en possession des chiffres de s'en séparer."
 capture_cyphers_smuggle_outcome:0 "Notre agent a réussi à convaincre son contact en [From.GetNameDef] de lui envoyer une copie complète des chiffres utilisés pour communiquer avec lui."
 capture_cyphers_reverse_engineer_outcome:0 "Notre agent a réussi à obtenir un exemple de la machine de cryptage ennemie. Bien que moins performant que les modèles militaires, il nous permettra néanmoins d'avoir un bon aperçu de leurs opérations."
 collaboration_government_set_up_planning_committees_outcome:0 "L'équipe a mis en place un certain nombre de groupes de planification pour organiser le nouveau gouvernement et assurer une transition en douceur du pouvoir une fois les opérations de combat terminées."
 collaboration_government_train_paramilitary_forces_outcome:0 "L'équipe a organisé un certain nombre d'hommes fiables, certains ayant une expérience militaire, en petites unités paramilitaires, qui aideront à garder l'arrière de notre armée qui avance."
 collaboration_government_contact_military_officers_outcome:0 "Notre équipe a noué quelques contacts avec des militaires à la retraite, qui pourraient être convaincus de contribuer à l'organisation d'un nouveau gouvernement à condition d'y jouer un rôle."
 free_operative_free_in_transit_outcome:0 "Avec le soutien d'une petite unité Commando, notre équipe a pu exécuter une embuscade et récupérer notre agent pendant qu'il était transféré vers un nouvel emplacement."
 free_operative_liberate_camp_outcome:0 "Quelques heures seulement avant le déplacement des prisonniers, une petite unité Commando a réussi à libérer la prison où était détenu notre agent."
 free_operative_smuggle_in_escape_gear_outcome:0 "Notre agent a reçu les outils d'évasion et a réussi à s'évader de la prison sous le couvert de la nuit, échappant aux équipes de recherche et aux patrouilles pendant plusieurs jours avant de pouvoir prendre contact."
 infiltrate_military_bribe_outcome:0 "Notre agent a réussi à convaincre un soldat en service actif de travailler pour nous en échange d'une somme d'argent importante."
 infiltrate_military_seduction_outcome:0 "Notre agent a entamé une relation avec un soldat actif, qui est devenu une source d'informations assez fiable."
 infiltrate_military_turned_pow_outcome:0 "Notre département d'opérations psychologiques a réussi à convaincre un prisonnier de guerre de la justesse de notre cause et à le renvoyer de l'autre côté."
 infiltrate_military_ideological_supporter_outcome:0 "Notre agent a pris contact avec un certain nombre d'officiers qui ne soutiennent plus le régime actuel des [From.GetAdjective]."
 resistance_contacts_radio_circuits_outcome:0 "L'équipe a pris contact avec plusieurs unités de résistance et leur a instruit la technique radio, en laissant un opérateur radio auprès de chacune d'entre elles."
 resistance_support_pidgeons_outcome:0 "Un certain nombre de pigeons ont été largués derrière les lignes ennemies avec des instructions sur la manière de les nourrir et d'en prendre soin."
 resistance_contacts_briefings_outcome:0 "L'équipe a informé les membres de la résistance des opérations planifiées dans leur secteur, a établi des priorités en matière de collecte de renseignements et a organisé des largages de ravitaillement."
 resistance_support_arms_depots_outcome:0 "L'équipe installe plusieurs dépôts d'armes et de munitions dans des endroits dissimulés pour améliorer la puissance de frappe de la résistance."
 resistance_support_distribute_weapons_outcome:0 "L'équipe a distribué des armes à un certain nombre de cellules de résistance et a enseigné aux membres comment les utiliser."
 resistance_support_organize_training_outcome:0 "L'équipe a dispensé des cours sur les techniques de terrain de base, l'entretien des armes légères et les démolitions."
 resistance_support_coordinate_groups_outcome:0 "L'équipe a rassemblé des représentants des plus grands groupes de résistance pour coordonner correctement les opérations à plus grande échelle et garantir que les fournitures soient acheminées là où elles sont le plus nécessaires."
 coordinated_strike_scout_target:0 "Cibles de reconnaissance"
 coordinated_strike_scout_target_desc:0 "L'équipe reconnaîtra les cibles, prendra des photos et fournira les dernières informations sur l'emplacement des cibles de grande valeur."
 coordinated_strike_scout_target_outcome:0 "L'équipe a fourni des informations précises sur l'emplacement du quartier général ennemi et d'autres emplacements importants quelques heures seulement avant le début de l'attaque."
 coordinate_strike_mark_targets:0 "Marquer les cibles"
 coordinate_strike_mark_targets_desc:0 "L'équipe utilisera des signaux et des marqueurs préétablis pour permettre à nos forces de détecter plus facilement des cibles de grande valeur."
 coordinate_strike_mark_targets_outcome:0 "Bien qu'ils aient dû être effectués dans de brefs délais et dans l'obscurité, les marquages ont réussi à diriger nos forces vers les cibles les plus importantes."
 coordinated_strike_sabotage_communications:0 "Communications sur le sabotage"
 coordinated_strike_sabotage_communications_desc:0 "Notre équipe coupera les lignes téléphoniques et tendra une embuscade aux messagers pour perturber les communications ennemies au cours des premières heures cruciales."
 coordinated_strike_sabotage_communications_outcome:0 "Notre équipe a réussi à perturber les communications ennemies, ce qui a entraîné une lente réponse à notre attaque."
 coordinated_strike_direct_units:0 "Unités directes"
 coordinated_strike_direct_units_desc:0 "Lorsque l'attaque commencera, notre équipe dirigera nos unités vers les cibles les plus précieuses par radio."
 coordinated_strike_direct_units_outcome:0 "Notre équipe a très bien réussi à diriger nos unités, augmentant ainsi les dégâts infligés à l'ennemi."
 coordinated_strike_occupy_bridges:0 "Occuper les ponts"
 coordinated_strike_occupy_bridges_desc:0 "Notre équipe s'emparera des ponts de la zone, empêchant leur destruction et bloquant les contre-attaques ennemies."
 coordinated_strike_occupy_bridges_outcome:0 "L'équipe a réussi à maîtriser les gardes sur un pont clé et à couper les câbles des charges de démolition, permettant ainsi à nos forces d'avancer sans entrave."
 operation_coordinated_strike:0 "Grève coordonnée"
 operation_coordinated_strike_desc:0 "§LPour remporter la victoire sur [From.GetNameDef], nous devons porter un coup dévastateur. Si nous déplaçons nos actifs sur place, nous pouvons garantir que ce coup unique frappera là où il peut causer le plus de dégâts.§!"
 coordinated_strike_tt:0 "Nous déclarerons la guerre au §Y[From.GetNameDef]§!. Pendant les §Y3 premiers jours§! du conflit, nous obtenons des bonus supplémentaires pour les missions d'attaque de port et de bombardement stratégique dans la zone sélectionnée."
 exfiltration_air_pickup_outcome_fail:0 "§RNotre pilote a trouvé le lieu d'atterrissage désigné éclairé par les projecteurs de plusieurs unités anti-aériennes ennemies et a décidé que l'opération était compromise.§!"
 exfiltration_submarine_pickup_outcome_fail:0 "§RLe sous-marin a attendu plusieurs heures au point d'extraction convenu, mais aucun message n'a été reçu du rivage indiquant que notre équipe était prête à procéder à l'extraction. L'équipage a signalé une activité ennemie accrue sur le rivage au cours de cette période.§!"
 exfiltration_border_outcome_fail:0 "§RLe guide de l'autre côté de la frontière a attendu en vain l'apparition de notre équipe, jusqu'à ce qu'il doive abandonner son poste en raison de l'approche d'une patrouille ennemie.§!"
 exfiltration_go_to_ground_outcome_fail:0 "§RL'équipe n'a jusqu'à présent pas réussi à prendre contact dans les délais prévus. Nous n'avons aucune autre information sur ce qui leur est arrivé.§!"
 
