 PHASE_3_Operation_DESC_GLADIO_SUCCESS_1:0 "Après avoir rencontré des contacts locaux, nos agents ont pu examiner correctement les candidats au recrutement local. Les candidats locaux se sont révélés politiquement fiables et ont passé avec succès nos vérifications d'antécédents de base. Même si une formation en matière de stratégie et d'utilisation des armes sera nécessaire, les nouvelles recrues devraient nous aider dans nos efforts futurs."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_2:0 "Nos agents ont réussi à étendre les caches d'armes locales sans attirer indûment l'attention, notamment de la part des agents communistes et des forces de l'ordre. Des collaborateurs locaux de confiance ont été informés de l'expansion et de la manière d'accéder aux armes en cas d'urgence avant que l'équipe ne retourne sur un site noir de la CIA pour être exfiltrée."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_3:0 "Après avoir établi des contacts avec les dirigeants régionaux, l'équipe a pu rapidement améliorer ses stratégies pour infliger le maximum de dégâts aux occupants soviétiques et perturber la chaîne d'approvisionnement soviétique dans tout le pays. Dans les jours qui ont suivi le départ, le réseau local a lancé avec succès sa campagne de résistance antisoviétique."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_4:0 "Nos sources confidentielles au sein de l'armée ont confirmé que l'assassinat était un succès ! Les forces de sécurité se démènent, mais nos agents ont pu s'enfuir confortablement vers notre site noir."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_5:0 "Nos sources confidentielles au sein de l'armée ont confirmé que l'assassinat était un succès ! Les forces de sécurité se démènent, mais nos agents ont pu s'enfuir confortablement vers notre site noir."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_6:0 "Nos sources confidentielles au sein des services de renseignement ont confirmé que l'assassinat était un succès ! Les forces de sécurité se démènent, mais nos agents ont pu s'enfuir confortablement vers notre site noir."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_7:0 "Nos agents ont rapidement réussi à se déguiser en membres de factions militantes locales d'extrême gauche et ont recruté des agents locaux de confiance pour lancer une attaque terroriste sous fausse bannière dans le pays cible. Cela a eu l'effet souhaité de réduire le soutien de la gauche dans le pays."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_8:0 "Lors de son déploiement, l'escouade a pu prendre contact avec des éléments locaux d'extrême droite associés à l'opération Gladio et les informer de leur rôle dans le lancement d'une attaque contre des éléments locaux d'extrême gauche. L'attaque a été menée rapidement avec le soutien de l'équipe et a réussi à infliger des dégâts à l'infrastructure du parti de gauche."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_9:0 "Nos agents ont pu entrer rapidement en contact avec des partisans locaux de l'opération Gladio, également membres de groupes d'extrême droite. Utilisant des contacts locaux d'extrême droite, l'équipe a réussi à susciter une réaction violente de la part des partisans locaux de gauche, conduisant à une véritable émeute."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_10:0 "Après diverses négociations avec des intérêts commerciaux locaux et des responsables de partis, nos agents ont réussi à établir une voie de financement pour blanchir de l'argent par le biais d'entreprises locales légitimes afin de financer des partis pro-américains. Ce sera une étape majeure dans la promotion de la stabilité politique."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_11:0 "Nos efforts pour trouver des candidats acceptables à corrompre ont porté leurs fruits, conduisant à une nouvelle infiltration dans le gouvernement du pays cible. Les agents de l'escouade ont réussi à approcher secrètement divers responsables politiques et bureaucratiques et à les convaincre de notre façon de penser tout en leur offrant une compensation monétaire."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_12:0 "L'équipe a secrètement approché divers officiers du renseignement de niveau inférieur et intermédiaire dans le pays cible qui ont été identifiés comme ayant des sympathies pro-américaines. Les renseignements se sont révélés exacts et plusieurs nouveaux liens ont été établis avec les services de renseignement de la cible."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_13:0 "Après un temps considérable de recherche et d'enquête sur les cibles assignées, l'équipe a accumulé de nombreux dossiers sur les individus. Les dossiers comprennent des allégations allant de crimes financiers à des relations extraconjugales ainsi qu'à des activités homosexuelles."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_14:0 "Après un examen approfondi, l'équipe a apporté les informations requises par nos analystes pour formuler une stratégie pour faire avancer le projet du régime dans la cible. Une fois cette opération terminée, nous devrons déterminer qui devrait être le chef du coup d'État tout en veillant à ce que suffisamment de soutien soit rassemblé pour que le complot réussisse."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_15:0 "Après avoir examiné plusieurs candidats, la liste des dirigeants possibles pour la cible est répertoriée ci-dessous. Qui devrions-nous soutenir pour prendre le pouvoir ?"
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_16:0 "L'équipe a été capable de déclencher rapidement divers incidents dans tout le pays cible et de semer le chaos, décrivant le gouvernement comme faible et inefficace dans la lutte contre la menace terroriste. De plus, nos amis des médias ont encore envenimé la situation en accusant le gouvernement de complicité dans les événements récents."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_17:0 "Après avoir confronté les personnalités du gouvernement sur lesquelles nous disposons de documents compromettants, les cibles ont acquiescé à nos demandes de soutenir nos efforts futurs dans la nation, renforçant considérablement nos efforts dans le projet de changement de régime en cours."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_18:0 "L'escouade, en collaboration avec une pléthore de collaborateurs, d'agents et de sympathisants locaux, a pu rapidement prendre pied dans la capitale au début de l'opération. Cela a conduit à une capture rapide de personnalités gouvernementales de premier plan et à la consolidation des forces armées derrière le nouveau gouvernement."

 PHASE_3_Operation_DESC_GLADIO_FAILURE_1:0 "Nos agents ont réussi à étendre les caches d'armes locales sans attirer indûment l'attention, notamment de la part des agents communistes et des forces de l'ordre. Des collaborateurs locaux de confiance ont été informés de l'expansion et de la manière d'accéder aux armes en cas d'urgence avant que l'équipe ne retourne sur un site noir de la CIA pour être exfiltrée."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_2:0 "Malheureusement, nos agents ont été observés en train de quitter les caches d'armes, attirant ainsi l'attention des forces de l'ordre locales. Alors que nos agents ont réussi à échapper aux forces de l'ordre, plusieurs de nos caches d'armes ont été découvertes et saisies par le gouvernement. Dans le même ordre d'idées, un examen plus approfondi des caches d'armes rendra certainement difficiles les efforts similaires."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_3:0 "ESPACE RÉSERVÉ IGNORER"
 PHASE_3_Operation_DESC_GLADIO_FAILURE_4:0 "Malheureusement, notre tentative d'assassinat contre le général [?slot_one_personnel_target.GetName] a échoué, car nos agents ont tué par erreur l'assistant du général à la place. Certains agents ont pu s'enfuir mais plusieurs ont été capturés par les forces de sécurité."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_5:0 "Malheureusement, notre tentative d'assassinat contre l'amiral [?slot_one_personnel_target.GetName] a échoué, car nos agents ont tué par erreur l'assistant de l'amiral à la place. Certains agents ont pu s'enfuir mais plusieurs ont été capturés par les forces de sécurité."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_6:0 "Malheureusement, notre tentative d'assassinat contre un célèbre militant de gauche a échoué, car nos agents ont tué par erreur un civil ordinaire. Certains collaborateurs locaux ont pu s'enfuir mais plusieurs ont été capturés par les forces de sécurité."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_7:0 "Lors de son déploiement, l'escouade a pu prendre contact avec des éléments locaux d'extrême droite associés à l'opération Gladio et les informer de leur rôle dans le lancement d'une attaque contre des éléments locaux d'extrême gauche. Cependant, la police a réussi à arrêter nos collaborateurs immédiatement avant que l'attaque n'ait lieu, ce qui a conduit l'équipe à battre en retraite précipitamment."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_8:0 "Malheureusement, même si nos agents ont réussi à provoquer un chaos local important, aucune des deux parties ne s'est ouvertement engagée dans la violence, ce qui a conduit à un échec modéré de l'opération. Alors que les éléments locaux d'extrême droite ont été encouragés à contrarier les partisans de gauche, l'extrême gauche n'a pas intensifié ni engagé davantage, empêchant ainsi une émeute de se former."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_9:0 "Malheureusement, alors que nos agents ont réussi à trouver des informations fiables et des collaborateurs dans la zone locale, nos collaborateurs ont été arrêtés en raison de crimes connexes, ce qui a entraîné un échec de l'opération. Heureusement, nos agents ont pu en grande partie s'en sortir indemnes."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_10:0 "Dans un premier temps, nos agents ont progressé dans l'établissement de contacts pour l'opération. Malheureusement, les forces de l'ordre locales se sont rendues compte du projet et ont inculpé les intérêts commerciaux locaux qui travaillaient pour l'opération. Même si nous veillerons à leur libération rapide si possible, cela représente néanmoins un échec dans l'opération."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_11:0 "Dans un premier temps, nos agents ont pu identifier différents responsables politiques susceptibles d'être corrompus. Malheureusement, nos efforts se sont heurtés à une campagne d'infiltration visant à découvrir la corruption au sein du gouvernement, ce qui a conduit à l'échec de l'opération. Heureusement, tous les agents ont pu s'exfiltrer correctement et à temps."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_12:0 "L'équipe a secrètement approché divers officiers du renseignement de niveau inférieur et intermédiaire dans le pays cible qui ont été identifiés comme ayant des sympathies pro-américaines. Malheureusement, nos renseignements étaient défectueux, ce qui a obligé nos agents à s'échapper précipitamment des forces de l'ordre locales, ce qui a entraîné l'échec de l'opération."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_13:0 "Après un temps considérable de recherche et d'enquête sur les cibles assignées, l'équipe n'est parvenue à matérialiser aucun élément de chantage crédible. Il reste encore à déterminer si cet échec est dû à un échec du renseignement, à l'ineptie de l'équipe ou à des cibles réelles relativement propres."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_14:0 "ESPACE RÉSERVÉ IGNORER"
 PHASE_3_Operation_DESC_GLADIO_FAILURE_15:0 "Après un examen approfondi, aucun des candidats interrogés n'était capable de répondre à nos exigences préalables pour soutenir son leadership après un coup d'État réussi."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_16:0 "Même si nos forces ont pu organiser quelques incidents dans le pays visé, l'opinion publique est restée plutôt apathique face à la situation. Pire encore, les médias, malgré nos efforts, n'ont pas repris l'affaire et le gouvernement n'a pas encore été lésé par nos efforts visant à détériorer la situation politique."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_17:0 "Malheureusement, après avoir confronté plusieurs personnalités sur lesquelles nous disposons d'informations compromettantes, les cibles ont largement refusé d'accéder à nos demandes. Il s'agit d'un revers majeur pour notre programme et cela fait courir le risque que nos plans soient découverts par des personnalités gouvernementales de premier plan."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_18:0 "Malheureusement, le gouvernement a été informé à l'avance de l'imminence du coup d'État, ce qui a empêché les conspirateurs de prendre le contrôle de l'armée ou d'arrêter des membres clés du gouvernement. Même si l'escouade a réussi à s'exfiltrer pratiquement intacte, plusieurs collaborateurs ont été perdus et nos forces de renseignement en souffriront sûrement."

 PHASE_1_Operation_DESC_GLADIO_1:0 "Les analystes de la CIA détermineront les contacts optimaux dans la cible à partir desquels recruter. Une fois cette opération effectuée, nos agents prendront contact avec ces personnalités."
 PHASE_1_Operation_DESC_GLADIO_2:0 "Avant d'étendre nos caches d'armes actuelles, nos agents évalueront d'abord l'état de nos caches actuelles à travers le pays afin de déterminer la marche à suivre."
 PHASE_1_Operation_DESC_GLADIO_3:0 "En préparation du soulèvement national, l'escouade contactera les dirigeants régionaux pour les informer de leurs ordres et d'autres informations nécessaires."
 PHASE_1_Operation_DESC_GLADIO_4:0 "Nos agents commenceront par surveiller les activités quotidiennes et les associés de la cible pour affiner notre suivi et augmenter les chances de réussite d'une frappe."
 PHASE_1_Operation_DESC_GLADIO_5:0 "Nos agents commenceront par surveiller les activités quotidiennes et les associés de la cible pour affiner notre suivi et augmenter les chances de réussite d'une frappe."
 PHASE_1_Operation_DESC_GLADIO_6:0 "Nos agents commenceront par surveiller les activités quotidiennes et les associés de la cible pour affiner notre suivi et augmenter les chances de réussite d'une frappe."
 PHASE_1_Operation_DESC_GLADIO_7:0 "L'équipe examinera les informations sur les factions militantes d'extrême gauche locales pour déterminer la meilleure façon de dissimuler les auteurs et d'ajouter de la crédibilité à l'attaque."
 PHASE_1_Operation_DESC_GLADIO_8:0 "L'escouade approchera des éléments locaux d'extrême droite affiliés à l'opération Gladio et leur demandera leur coopération pour lancer une attaque terroriste."
 PHASE_1_Operation_DESC_GLADIO_9:0 "L'équipe étudiera l'environnement politique local pour déterminer quels acteurs seront les plus faciles à inciter à des combats de rue ouverts."
 PHASE_1_Operation_DESC_GLADIO_10:0 "Les membres de l'équipe contacteront subtilement les responsables des partis alignés sur notre gouvernement pour établir la meilleure façon de transférer des fonds à leur parti politique."
 PHASE_1_Operation_DESC_GLADIO_11:0 "L'équipe, en collaboration avec les analystes de l'Agence, rédigera une liste cible des membres du gouvernement du pays cible qui pourraient être persuadés d'une compensation pour s'aligner sur Washington."
 PHASE_1_Operation_DESC_GLADIO_12:0 "L'équipe, en collaboration avec les analystes de l'Agence, examinera nos contacts actuels dans l'appareil de renseignement du pays cible afin d'établir un point de départ."
 PHASE_1_Operation_DESC_GLADIO_13:0 "L'escouade s'infiltrera sous couverture dans le pays cible et recherchera des informations sur des cibles potentiellement compromises au sein du gouvernement actuel."
 PHASE_1_Operation_DESC_GLADIO_14:0 "Alors que le projet de changement de régime démarre, l'équipe déterminera la situation locale et planifiera la manière de poursuivre l'opération visant à saper le gouvernement en vue d'un coup d'État."
 PHASE_1_Operation_DESC_GLADIO_15:0 "Les analystes de l'Agence examineront les candidats appropriés pour le poste de nouveau chef du gouvernement cible tout en essayant d'équilibrer la légitimité internationale et les références anticommunistes."
 PHASE_1_Operation_DESC_GLADIO_16:0 "Dans un premier temps, nos agents examineront l'histoire du terrorisme et du conflit dans la cible et l'utiliseront pour préparer correctement un incident susceptible d'attiser les tensions."
 PHASE_1_Operation_DESC_GLADIO_17:0 "Nos agents récupéreront les documents de chantage que l'Agence a collectés sur nos cibles et détermineront un plan d'action approprié sur qui contacter et qui sera le plus susceptible de s'y conformer."
 PHASE_1_Operation_DESC_GLADIO_18:0 "L'équipe visitera les réseaux opérationnels locaux et les collaborateurs pour assurer le soutien à l'opération et rallier nos partisans pour l'opération à venir."

 PHASE_2_Operation_DESC_GLADIO_1:0 "Nos agents se rendront discrètement sur le terrain dans les grandes villes du pays, puis utiliseront nos contacts parmi les forces sympathisantes pour contacter des recrues potentielles."
 PHASE_2_Operation_DESC_GLADIO_2:0 "Après un examen approfondi, nos agents se déploieront sur les sites de caches d'armes et augmenteront les stocks d'armes dans lesdites caches. Les agents locaux de confiance seront également informés des améliorations."
 PHASE_2_Operation_DESC_GLADIO_3:0 "L'escouade infiltrera secrètement la cible et rencontrera diverses cellules de résistance pour rallier le moral et affiner les plans en vue du soulèvement."
 PHASE_2_Operation_DESC_GLADIO_4:0 "L'escouade suivra les mouvements du général tout au long de la journée et analysera son emploi du temps quotidien pour planifier diverses stratégies pour atteindre la cible."
 PHASE_2_Operation_DESC_GLADIO_5:0 "L'escouade suivra les mouvements de l'amiral tout au long de la journée et analysera son emploi du temps quotidien pour planifier diverses stratégies pour atteindre la cible."
 PHASE_2_Operation_DESC_GLADIO_6:0 "L'équipe suivra les mouvements de la cible tout au long de la journée et analysera son emploi du temps quotidien pour planifier diverses stratégies pour atteindre la cible."
 PHASE_2_Operation_DESC_GLADIO_7:0 "Les membres de l'escouade et les collaborateurs locaux élaboreront une stratégie visant à rejeter le plus possible la faute sur les forces de gauche du pays tout en évitant de dévoiler les véritables auteurs de l'attaque."
 PHASE_2_Operation_DESC_GLADIO_8:0 "Après avoir obtenu le soutien local, l'escouade distribuera des armes à nos collaborateurs et concevra une stratégie pour lancer l'attaque."
 PHASE_2_Operation_DESC_GLADIO_9:0 "Nos agents chercheront activement à inciter les deux camps à ouvrir les combats en organisant des combats de niveau inférieur, du vandalisme et des assauts des deux côtés tout en s'accusant mutuellement des incidents."
 PHASE_2_Operation_DESC_GLADIO_10:0 "Pour dissimuler l'origine des fonds du parti, nos agents rechercheront des collaborateurs locaux propriétaires d'entreprises pour établir des fronts de blanchiment d'argent afin d'acheminer l'argent vers le parti."
 PHASE_2_Operation_DESC_GLADIO_11:0 "Les cibles déterminées seront surveillées pour garantir qu'elles n'ont aucun lien connu avec l'extrême gauche et qu'il est peu probable qu'elles trahissent nos opérations à long terme."
 PHASE_2_Operation_DESC_GLADIO_12:0 "En utilisant les informations préalablement collectées, l'équipe déterminera une liste de cibles potentielles à contacter au sein des services de renseignement de la cible pour recruter dans le programme."
 PHASE_2_Operation_DESC_GLADIO_13:0 "Les cibles établies dans le projet de liste feront l'objet d'une enquête approfondie pour toute perversité sexuelle, relations extraconjugales et autres infractions pénales liées au chantage."
 PHASE_2_Operation_DESC_GLADIO_14:0 "Les chefs militaires, les ministres pro-américains et les collaborateurs locaux seront recherchés par l'équipe et interrogés pour déterminer leur loyauté avant nos plans en cours."
 PHASE_2_Operation_DESC_GLADIO_15:0 "L'équipe rencontrera secrètement les candidats pour obtenir un jugement plus approfondi sur leur caractère et leurs diverses positions pertinentes pour notre croisade en cours contre le communisme."
 PHASE_2_Operation_DESC_GLADIO_16:0 "Après avoir déterminé la stratégie optimale, nos agents, en collaboration avec des agents locaux, exécuteront une attaque terroriste pour accroître la tension nationale et saper davantage le gouvernement."
 PHASE_2_Operation_DESC_GLADIO_17:0 "Notre équipe s'approchera secrètement des cibles et partagera les détails de leurs affaires illicites dont nous avons des preuves, ainsi que les informera de nos demandes de garder le silence."
 PHASE_2_Operation_DESC_GLADIO_18:0 "Nos agents et nos partisans, en collaboration avec l'équipe, chercheront à prendre rapidement le contrôle complet de l'appareil militaire afin de paralyser et de paralyser toute réponse du gouvernement."

 PHASE_3_Operation_DESC_GLADIO_1:0 "Après avoir contacté avec succès les recrues, notre équipe retournera à la base, examinera les informations d'identification des personnes contactées et déterminera la meilleure façon d'étendre nos opérations locales."
 PHASE_3_Operation_DESC_GLADIO_2:0 "Enfin, nos agents chercheront à brouiller les traces en améliorant les déguisements et les emplacements cachés des caches avant de s'exfiltrer secrètement et d'éviter les forces de l'ordre locales."
 PHASE_3_Operation_DESC_GLADIO_3:0 "Après avoir informé les dirigeants et rallié les troupes, notre équipe finalisera la stratégie et les plans des opérations de résistance et s'exfiltrera secrètement vers Washington."
 PHASE_3_Operation_DESC_GLADIO_4:0 "Après avoir établi un plan pour minimiser les pertes collatérales et éviter toute exposition, l'équipe assassinera la cible et procédera à une exfiltration secrète vers un site noir sécurisé."
 PHASE_3_Operation_DESC_GLADIO_5:0 "Après avoir établi un plan pour minimiser les pertes collatérales et éviter toute exposition, l'équipe assassinera la cible et procédera à une exfiltration secrète vers un site noir sécurisé."
 PHASE_3_Operation_DESC_GLADIO_6:0 "Après avoir établi un plan visant à minimiser les pertes civiles collatérales et à éviter toute exposition, l'équipe assassinera la cible et procédera à une exfiltration secrète vers un site noir sécurisé."
 PHASE_3_Operation_DESC_GLADIO_7:0 "L'équipe, en collaboration avec des partisans et collaborateurs locaux, lancera une attaque terroriste contre le gouvernement afin de saper la crédibilité et le soutien des forces de gauche."
 PHASE_3_Operation_DESC_GLADIO_8:0 "L'équipe, en collaboration avec des partisans et des collaborateurs locaux, lancera une attaque terroriste contre des éléments de gauche dans le pays, attisant encore davantage les tensions nationales."
 PHASE_3_Operation_DESC_GLADIO_9:0 "Des collaborateurs locaux seront utilisés pour promouvoir les activités de protestation contre les violences en cours dans le but d'inciter les deux parties à s'engager dans des combats de rue ouverts lors de la manifestation."
 PHASE_3_Operation_DESC_GLADIO_10:0 "Les agents ainsi que les responsables du parti veilleront à ce que le montant approprié des fonds soit fourni pour renforcer leur position politique contre les forces de gauche tout en minimisant leur exposition."
 PHASE_3_Operation_DESC_GLADIO_11:0 "L'équipe se rapprochera des cibles et offrira des compensations monétaires et autres pour s'aligner sur Washington afin de renforcer davantage son influence au sein du gouvernement de la cible."
 PHASE_3_Operation_DESC_GLADIO_12:0 "L'escouade s'approchera secrètement de la cible et sollicitera sa collaboration dans nos efforts continus pour protéger l'Europe occidentale de la menace de l'Union soviétique."
 PHASE_3_Operation_DESC_GLADIO_13:0 "Une fois l'enquête terminée, nos agents compileront les informations recueillies dans des dossiers sur les cibles pour une utilisation future."
 PHASE_3_Operation_DESC_GLADIO_14:0 "Une fois les entretiens terminés, l'équipe déterminera quelles pourraient être les futures étapes et exigences nécessaires pour un changement de régime réussi."
 PHASE_3_Operation_DESC_GLADIO_15:0 "Une fois que l'équipe aura soumis ses conclusions, le Conseil national de sécurité déterminera le candidat à soutenir lors du prochain coup d'État."
 PHASE_3_Operation_DESC_GLADIO_16:0 "Nos spécialistes des médias manipuleront activement les médias nationaux et internationaux pour saper le soutien du gouvernement au lendemain de l'attaque."
 PHASE_3_Operation_DESC_GLADIO_17:0 "Après la confrontation initiale, l'équipe veillera à ce que les cibles soutiennent nos prochaines actions contre le gouvernement et suivront notre ligne dans les mois à venir."
 PHASE_3_Operation_DESC_GLADIO_18:0 "Une fois l'armée renversée, nos forces et nos alliés chercheront à prendre le contrôle total du gouvernement et à capturer les principaux dirigeants et ministres du gouvernement."

