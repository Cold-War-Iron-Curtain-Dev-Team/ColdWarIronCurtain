 Assassinate_General_Success_tt:0 "Le général [local_possible_operations_personnel_target] a été assassiné avec succès par [GetCurrentSquadTitle] qui ont réussi à échapper aux forces de sécurité."
 Assassinate_General_Failure_tt:0 "Une tentative d'assassinat du général [local_possible_operations_personnel_target] par les agents [GetCurrentSquadTitle] a échoué lorsqu'ils ont été appréhendés par les forces de sécurité après leur opération avortée."
 Assassinate_Admiral_Success_tt:0 "L'amiral [local_possible_operations_personnel_target] a été assassiné avec succès par [GetCurrentSquadTitle] qui ont réussi à échapper aux forces de sécurité."
 Assassinate_Admiral_Failure_tt:0 "Une tentative des agents [GetCurrentSquadTitle] d'assassiner l'amiral [local_possible_operations_personnel_target] a échoué, lorsqu'ils ont été appréhendés par les forces de sécurité après leur opération avortée."
 Sabotage_Nuclear_Program_Success_tt:0 "L'infiltration de [GetCurrentSquadTitle] dans le programme nucléaire de [GetTargetPlaceholder] a réussi, ces agents paralysant toute capacité nucléaire dans un avenir proche."
 Sabotage_Nuclear_Program_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] d'infiltrer le programme nucléaire de [GetTargetPlaceholder] ont échoué, car ils ont été appréhendés par les forces de sécurité lors de leur tentative d'entrée."
 Sabotage_Nuclear_Site_Success_tt:0 "L'infiltration de [GetCurrentSquadTitle] sur un site nucléaire de [GetTargetPlaceholder] a réussi, ces agents paralysant toute capacité nucléaire dans un avenir proche et détruisant des pièces d'équipement cruciales."
 Sabotage_Nuclear_Site_Failure_tt:0 "Les tentatives d'infiltration de [GetCurrentSquadTitle] sur un site nucléaire de [GetTargetPlaceholder] ont échoué, car ils ont été appréhendés par les forces de sécurité lors de leur tentative d'entrée."
 Sabotage_Airfield_Success_tt:0 "L'infiltration de [GetCurrentSquadTitle] sur un aérodrome en [GetTargetPlaceholder] a réussi, ces agents paralysant la capacité offensive et défensive de cette base dans un avenir proche."
 Sabotage_Airfield_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] d'infiltrer un aérodrome en [GetTargetPlaceholder] ont échoué, car ils ont été appréhendés par les forces de sécurité lors de leur tentative d'entrée."
 Sabotage_Military_Industry_Success_tt:0 "L'infiltration de [GetCurrentSquadTitle] dans des installations de production militaire de [GetTargetPlaceholder] a réussi, ces agents paralysant toute capacité de production de défense dans un avenir proche."
 Sabotage_Military_Industry_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] d'infiltrer les installations de production militaire de [GetTargetPlaceholder] ont échoué, car elles ont été appréhendées par les forces de sécurité lors de leur tentative d'entrée."
 Sabotage_Dockyard_Success_tt:0 "L'infiltration de [GetCurrentSquadTitle] dans les chantiers navals de [GetTargetPlaceholder] a réussi, ces agents paralysant toute capacité de construction navale et navale dans un avenir proche."
 Sabotage_Dockyard_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] d'infiltrer les chantiers navals situés dans la zone de [GetTargetPlaceholder] ont échoué, car ils ont été appréhendés par les forces de sécurité lors de leur tentative d'entrée."
 Sabotage_Port_Success_tt:0 "L'infiltration de [GetCurrentSquadTitle] dans un port situé à [GetTargetPlaceholder] a réussi, ces agents paralysant toute capacité offensive navale dans un avenir proche."
 Sabotage_Port_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] d'infiltrer un port de [GetTargetPlaceholder] ont échoué, car ils ont été appréhendés par les forces de sécurité lors de leur tentative d'entrée."
 Sabotage_Civilian_Industry_Success_tt:0 "L'infiltration de [GetCurrentSquadTitle] dans des complexes industriels civils au sein de [GetTargetPlaceholder] a réussi, ces agents paralysant toute capacité de production industrielle civile dans un avenir proche"
 Sabotage_Civilian_Industry_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] d'infiltrer les installations industrielles civiles de [GetTargetPlaceholder] ont échoué, car ils ont été appréhendés par les forces de sécurité lors de leur tentative d'entrée."
 Blow_Key_Infrastructure_Success_tt:0 "Les opérations menées par [GetCurrentSquadTitle] contre des infrastructures clés au sein de [GetTargetPlaceholder] ont réussi, leur capacité de transport étant érodée par des attaques importantes."
 Blow_Key_Infrastructure_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] d'infiltrer les points infrastructurels clés de [GetTargetPlaceholder] ont échoué, car ils ont été appréhendés par les forces de sécurité lors de leur tentative d'entrée."
 Perform_Terrorist_Attack_Success_tt:0 "Les attaques terroristes perpétrées par [GetCurrentSquadTitle] contre des civils en [GetTargetPlaceholder] ont réussi, avec des pertes importantes et la peur de l'appareil gouvernemental."
 Perform_Terrorist_Attack_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] de commettre une attaque terroriste contre [GetTargetPlaceholder] ont échoué, car ils ont été appréhendés par les forces de sécurité suite à leur tentative de complot."
 Prepare_Local_Uprising_Success_tt:0 "Une opération de soulèvement local soutenue par [GetCurrentSquadTitle] contre [GetTargetPlaceholder] a réussi, entraînant la mort de nombreux membres des forces de sécurité alignées sur le gouvernement et le quasi-effondrement du gouvernement au profit des rebelles."
 Prepare_Local_Uprising_Failure_tt:0 "Les tentatives des [GetCurrentSquadTitle] de préparer un soulèvement local contre le gouvernement en [GetTargetPlaceholder] ont échoué, car elles ont été appréhendées par les forces de sécurité qui ont découvert leur complot."
 Contact_Resistance_Group_Success_tt:0 "Le contact d'un groupe de résistance local par [GetCurrentSquadTitle] contre [GetTargetPlaceholder] a réussi, entraînant de nouvelles lignes de communication et d'assistance substantielles pour le groupe insurgé."
 Contact_Resistance_Group_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] pour contacter un groupe de résistance en [GetTargetPlaceholder] ont échoué, en raison du manque de communication et du manque de coopération entre les deux parties."
 Train_Local_Resistance_Success_tt:0 "Une opération visant à former des groupes de résistance locaux de [GetCurrentSquadTitle] contre [GetTargetPlaceholder] a réussi, ce qui a permis d'augmenter la capacité de combat de ces forces irrégulières et la capacité de lancer davantage d'attaques contre le gouvernement au pouvoir."
 Train_Local_Resistance_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] de former les forces de résistance locales en [GetTargetPlaceholder] ont échoué, car elles ont été appréhendées par les forces de sécurité lors d'un raid contre le groupe de résistance."
 Arm_Local_Resistance_Success_tt:0 "Une opération visant à armer les groupes de résistance locaux de [GetCurrentSquadTitle] contre [GetTargetPlaceholder] a réussi, ce qui a permis d'augmenter la capacité armée de ces forces irrégulières et la capacité de lancer davantage d'attaques contre le gouvernement au pouvoir."
 Arm_Local_Resistance_Failure_tt:0 "Les tentatives des groupes de résistance locaux d'armer [GetCurrentSquadTitle] en [GetTargetPlaceholder] ont échoué, car ils ont été appréhendés par les forces de sécurité lors d'un raid contre le groupe de résistance."
 Embed_Insurgency_Success_tt:0 "Une opération visant à intégrer un groupe d'insurgés locaux par [GetCurrentSquadTitle] contre [GetTargetPlaceholder] a réussi, ce qui a permis d'augmenter les liens de communication et de meilleures capacités d'attaque pour ce groupe spécifique."
 Embed_Insurgency_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] d'intégrer des groupes d'insurgés en [GetTargetPlaceholder] ont échoué, car ils ont été appréhendés par les forces de sécurité lors d'un raid."
 Counterespionage_Embed_Success_tt:0 "Une opération visant à intégrer les services de sécurité par [GetCurrentSquadTitle] contre [GetTargetPlaceholder] a réussi, ce qui a permis d'accroître les renseignements sur les capacités et les forces de sécurité, permettant ainsi de meilleures opérations à l'avenir."
 Counterespionage_Embed_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] d'intégrer les services de sécurité de [GetTargetPlaceholder] ont échoué, car ils ont été découverts par les services de sécurité et arrêtés."
 Expand_Intel_Network_Success_tt:0 "Une opération visant à étendre le réseau de renseignement en [GetTargetPlaceholder] d'ici [GetCurrentSquadTitle] a réussi, ce qui a permis d'élargir les renseignements et le personnel pour soutenir leurs objectifs."
 Expand_Intel_Network_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] d'étendre leur réseau de renseignement en [GetTargetPlaceholder] ont échoué, car elles ont été stoppées par le gouvernement et les forces de sécurité."
 Steal_Technology_Success_tt:0 "Une opération visant à voler une technologie critique de [GetCurrentSquadTitle] contre [GetTargetPlaceholder] a réussi, entraînant la découverte de données et d'informations vitales relatives à la technologie actuelle."
 Steal_Technology_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] de voler une technologie critique à [GetTargetPlaceholder] ont échoué, car ils ont été appréhendés par les forces de sécurité alors qu'ils tentaient de s'échapper."
 Combat_Resistance_Success_tt:0 "Une opération anti-insurrectionnelle menée par [GetCurrentSquadTitle] contre les forces d'insurrection et de résistance locales a réussi, entraînant de nombreuses arrestations et morts, suite à des raids sur les principaux camps et quartiers généraux."
 Combat_Resistance_Failure_tt:0 "Les tentatives du [GetCurrentSquadTitle] pour combattre la résistance locale des groupes insurgés à l'intérieur du pays ont échoué, car ils n'ont pas réussi à empêcher efficacement les campagnes du groupe."
 Blow_Railways_Success_tt:0 "Une opération visant à faire sauter des lignes ferroviaires clés de [GetCurrentSquadTitle] contre [GetTargetPlaceholder] a réussi, entraînant d'énormes problèmes logistiques et la perturbation du transport ferroviaire pendant une courte période."
 Blow_Railways_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] de faire exploser les lignes ferroviaires [GetTargetPlaceholder] ont échoué, car elles ont été appréhendées par les forces de sécurité dès leur tentative d'entrée."



 WORLD_FACTBOOK_TITLE:0 "Recueil d'informations sur le monde : §Y[?generic_operations_selected_target.GetName]§!"

 PHASE_1_Operation_DESC_BOP_1:0 "Il est nécessaire que nous dressions une liste des exilés cubains à contacter dans les mois à venir, notamment ceux qui sont anticastristes et souhaitent renverser le gouvernement communiste de La Havane."
 PHASE_2_Operation_DESC_BOP_1:0 "Le moment est venu ; plusieurs agents se rendront à Miami dans les prochains jours pour prendre contact avec tous les exilés figurant sur la liste préalablement constituée, afin de déterminer leurs agendas, leurs capacités et leur intérêt pour un changement de régime à Cuba."
 PHASE_3_Operation_DESC_BOP_1:0 "L'opération à Miami a été un succès ! Presque tous les exilés avec lesquels nous avons parlé sont d'accord avec notre projet potentiel visant à renverser le régime illégitime de Castro et nos agents sont impatients de fournir plus de détails sur les exilés."

 PHASE_1_Operation_DESC_BOP_2:0 "Cette nouvelle brigade a d'abord besoin d'un modèle de structure de commandement pour déterminer son fonctionnement. Nous devrions nous inspirer des modèles existants de l'armée américaine pour déterminer l'organisation de cette unité."
 PHASE_2_Operation_DESC_BOP_2:0 "Parmi les exilés cubains avec qui nous avons parlé à Miami, nos agents doivent contrôler et assigner chaque homme au grade d'officier, afin que la brigade ait un leadership suffisant le moment venu."
 PHASE_3_Operation_DESC_BOP_2:0 "Enfin, maintenant que nous avons posé les bases de la nouvelle brigade, nos agents doivent contacter le Pentagone et demander que des officiers de l'armée soient affectés à la brigade pour commencer à conseiller et à former."

 PHASE_1_Operation_DESC_BOP_3:0 "Nous devrions aborder le réseau des exilés de la région de Miami, en accordant une attention particulière à ceux qui ont une expérience de pilote."
 PHASE_2_Operation_DESC_BOP_3:0 "En plus des exilés, il pourrait être nécessaire d'augmenter cette force de pilotes avec du personnel de la Garde nationale, ceux qui ont du temps de vol et des compétences."
 PHASE_3_Operation_DESC_BOP_3:0 "Il est temps de revenir au siège social à Langley pour informer les patrons de notre programme pilote de recrutement."

 PHASE_1_Operation_DESC_BOP_4:0 "Avec le grand nombre d'aérodromes disséminés aux États-Unis, il doit sûrement y en avoir certains qui possèdent de vieux avions qui peuvent être récupérés pour nos usages."
 PHASE_2_Operation_DESC_BOP_4:0 "Sous le couvert de l'obscurité, les équipes de la CIA voleront secrètement des bombardiers B-26 dans leurs bases aériennes et les transporteront vers des lieux tenus secret pour soutenir notre mission d'exil."
 PHASE_3_Operation_DESC_BOP_4:0 "Maintenant que les avions sont en notre possession, nous devons nous assurer que les bombardiers sont prêts à être utilisés et que leurs cocardes et marquages sont repeints en conséquence."

 PHASE_1_Operation_DESC_BOP_5:0 "Cette nouvelle unité aérienne a d'abord besoin d'un modèle de structure de commandement pour déterminer son fonctionnement. Nous devrions nous inspirer des modèles existants de l'US Air Force pour déterminer l'organisation de cette unité."
 PHASE_2_Operation_DESC_BOP_5:0 "Parmi les pilotes cubains avec qui nous avons parlé à Miami, nos agents doivent contrôler et assigner chaque homme au grade d'officier, afin que la brigade ait un leadership suffisant le moment venu."
 PHASE_3_Operation_DESC_BOP_5:0 "Enfin, maintenant que nous avons posé les bases de cette nouvelle force aérienne, nos agents doivent contacter le Pentagone et demander que des officiers de l'armée soient affectés à la brigade pour commencer à conseiller et à former."

 PHASE_1_Operation_DESC_BOP_6:0 "Après avoir trouvé l'emplacement idéal pour un aérodrome d'entraînement, nos agents doivent contacter les responsables du gouvernement guatémaltèque pour obtenir leur approbation quant à l'utilisation de leur terrain."
 PHASE_2_Operation_DESC_BOP_6:0 "Maintenant que nous avons la permission, nous allons faire appel à des ouvriers du bâtiment locaux, armés de matériel américain, pour commencer la construction de la piste et des bâtiments extérieurs."
 PHASE_3_Operation_DESC_BOP_6:0 "L'aérodrome est terminé ! La brigade dispose désormais d'un siège en dehors des États-Unis pour s'entraîner et se préparer à l'opération. Le mouvement de la force commencera immédiatement."

 PHASE_1_Operation_DESC_BOP_7:0 "Puisque nous formons principalement des pilotes cubains en exil, nos agents et interprètes feront de leur mieux pour former le personnel sur la mécanique préliminaire de l'avion en anglais et en espagnol."
 PHASE_2_Operation_DESC_BOP_7:0 "Maintenant que les pilotes ont appris les bases, il est temps de tester l'avion, en commençant par quelques exercices d'entraînement au vol à basse altitude et des vols autour de la zone de la base Rayo."
 PHASE_3_Operation_DESC_BOP_7:0 "Enfin, dans le cadre de la dernière partie de la formation des pilotes, les pilotes effectueront des missions avec des bombes factices et des munitions à blanc pour s'entraîner au bombardement et au mitraillage de cibles sélectionnées, telles que des dépôts de munitions et des casernes."

 PHASE_1_Operation_DESC_BOP_8:0 "Afin d'attirer davantage d'émigrés vers la brigade, nous lancerons une campagne de propagande dans les quartiers à majorité cubaine de Miami, en mettant l'accent sur le sentiment anticastriste et les avantages financiers de rejoindre la brigade."
 PHASE_2_Operation_DESC_BOP_8:0 "Pour aider à traiter ces nouvelles recrues potentielles, nos agents ainsi que les officiers de brigade ouvriront un bureau au centre-ville de Miami."
 PHASE_3_Operation_DESC_BOP_8:0 "Maintenant que nous avons obtenu le nombre approprié d'hommes, il est temps de les organiser en compagnies au sein de la brigade, en nommant un officier pour les diriger ainsi que des sous-officiers."
 PHASE_3_Operation_DESC_BOP_8_FAILURE:0 "Puisque notre récente campagne de recrutement pour la brigade a échoué, nous devons réorienter et restructurer la brigade en une unité plus petite pour nous contenter des effectifs actuels."

 PHASE_1_Operation_DESC_BOP_9:0 "La CIA dispose de certains fonds, mais l'armée en a davantage. Il suffit de demander un petit financement au ministère de la Défense pour compléter nos achats d'armes pour la brigade."
 PHASE_2_Operation_DESC_BOP_9:0 "Maintenant que nous avons les fonds, des milliers de fusils, pistolets et bazookas seront commandés et achetés auprès des meilleures entreprises américaines pour fournir à nos forces une immense puissance de feu."
 PHASE_3_Operation_DESC_BOP_9:0 "Des avions et des avions remplis de caisses ont atterri à la base de Rayo. Il est désormais temps pour chaque membre de la brigade de récupérer son arme et de s'y habituer."

 PHASE_1_Operation_DESC_BOP_10:0 "Puisque nous formons principalement des recrues cubaines exilées, nos agents et interprètes feront de leur mieux pour former le personnel aux techniques de combat préliminaires en anglais et en espagnol."
 PHASE_2_Operation_DESC_BOP_10:0 "Avec les bateaux et les ressources limitées dont nous disposons, nos instructeurs guideront les recrues sur la façon de débarquer sur les plages et de prendre des positions de combat."
 PHASE_3_Operation_DESC_BOP_10:0 "Le temps de la deuxième phase des opérations a commencé. La force de la brigade sera transférée à Puerto Cabezas, au Nicaragua, pour y être temporairement hébergée avant le débarquement."

 PHASE_1_Operation_DESC_BOP_11:0 "Grâce à une partie des fonds dont nous disposons, environ cinq cargos excédentaires de la ligne cubaine Garcia seront achetés et utilisés pour transporter des fournitures, des armes et du personnel dans le cadre de l'invasion."
 PHASE_2_Operation_DESC_BOP_11:0 "Pour équiper les deux navires d'infanterie de débarquement dont nous disposons, des équipages du service de transport maritime militaire seront embauchés."
 PHASE_3_Operation_DESC_BOP_11:0 "À la Nouvelle-Orléans, nos cinq cargos seront chargés à ras bord de fournitures, d'armes et d'équipements de communication, ainsi que de personnel pour les équiper dans un rôle de soutien lors du lancement de l'invasion."

 PHASE_1_Operation_DESC_BOP_12:0 "Pour notre opération d'infiltration, quelques zones d'atterrissage doivent être planifiées à l'avance pour que nos équipes puissent y accéder par bateau."
 PHASE_2_Operation_DESC_BOP_12:0 "Avant d'atterrir à Cuba, nous devrions envoyer des messages aux principaux groupes insurgés anticastristes de la région pour les informer de notre arrivée et de ce que nous espérons accomplir."
 PHASE_3_Operation_DESC_BOP_12:0 "Nos équipes s'élanceront sur les plages de Cuba tard dans la nuit, avant de se glisser dans la jungle pour commencer leurs folies."


 PHASE_1_Operation_DESC_BOP_13:0 "En utilisant les exilés avec lesquels nous entretenons déjà de bonnes relations, nous établirons une liste de groupes insurgés et de leurs dirigeants à Cuba que nous pourrons contacter."
 PHASE_2_Operation_DESC_BOP_13:0 "En utilisant cette liste, nous organiserons une fréquence radio mutuelle ainsi que des points morts et des points d'atterrissage pour les insurgés afin de communiquer avec nous. "
 PHASE_3_Operation_DESC_BOP_13:0 "Maintenant que nous disposons des insurgés et des capacités de communication, il est temps de leur faire part de nos projets et de leur demander leur aide pour renverser le régime de Castro."

 PHASE_1_Operation_DESC_BOP_14:0 "Pour l'Opération Puma, nous dresserons une liste de cibles d'aérodromes et d'installations de l'armée de l'air cubaines pour éliminer de manière préventive leur force aérienne, ainsi que des infrastructures militaires pour les paralyser."
 PHASE_2_Operation_DESC_BOP_14:0 "Maintenant que nous avons des cibles, il est temps de charger les B-26 de bombes, de charger les mitrailleuses et d'informer les pilotes sur leurs cibles et leur mission."
 PHASE_3_Operation_DESC_BOP_14:0 "Enfin, nos bombardiers décolleront et frapperont trois aérodromes cubains à San Antonio de los Banos, ainsi que l'aéroport de Santiago de Cuba, pour paralyser l'armée de l'air de Castro."

 PHASE_1_Operation_DESC_BOP_15:0 "Pour l'opération Windfall, nous devons choisir un lieu de survol à La Havane vers lequel faire voler des avions supersoniques, comme moyen de guerre psychologique."
 PHASE_2_Operation_DESC_BOP_15:0 "Maintenant que nous avons un emplacement à La Havane, nos pilotes de la Marine seront chargés de faire voler leurs F-8 Crusaders à une vitesse supersonique pour effrayer les forces de Castro et causer des ravages"
 PHASE_3_Operation_DESC_BOP_15:0 "Enfin, nos chasseurs décolleront, en lançant trois bangs soniques distincts au-dessus de La Havane à différents endroits, mais en se concentrant sur le centre du gouvernement cubain et ses installations importantes."

 PHASE_1_Operation_DESC_BOP_16:0 "After the initial air attacks, we need to draft a target list for a few diversionary strikes on Cuban ships and military bases as well as other logistical facilities, this time pain"ted in the colors of the Cuban Air Force, to divert their attention.
 PHASE_2_Operation_DESC_BOP_16:0 "Maintenant que nous avons des cibles, il est temps de charger les B-26 de bombes, de charger les mitrailleuses et d'informer les pilotes sur leurs cibles et leur mission."
 PHASE_3_Operation_DESC_BOP_16:0 "Enfin, nos bombardiers décolleront et commenceront leurs attaques contre les bases militaires cubaines, les installations navales et les centres logistiques pour tenter de les distraire avant l'atterrissage de nos forces."

 PHASE_1_Operation_DESC_BOP_17:0 "Nos cinq cargos, ainsi que les deux péniches de débarquement, seront tous chargés et remplis à ras bord de leur personnel et de tout ravitaillement supplémentaire, avant de mettre le cap sur les côtes de Cuba."
 PHASE_2_Operation_DESC_BOP_17:0 "Les insurgés doivent savoir que nous arrivons et où nous atterrissons. Nos agents enverront une série de messages via les canaux standards pour les en informer."
 PHASE_3_Operation_DESC_BOP_17:0 "Il est temps ! Après des mois et des mois de préparatifs, la brigade et nos forces aériennes sont prêtes à débarquer. Les navires sont prêts et, à mesure qu'ils avancent, la brigade est prête à redonner à Cuba son chef légitime."


#Cuban Exiles Land in Bay of Pigs! (News)
#Today, the world was shocked to wake up to reports that a group of anti-Castro Cuban exiles, known as Brigade 2506, have landed in the Bay of Pigs off the southwestern coast of Cuba. A force of about 1,400 men, armed with American equipment as well as B-26 bombers, are engaging with Cuban military and security services, who were quickly alerted to their presence. The United States has denied any responsibility in the invasion, according to a statement by the US Ambassador to the United Nations. The Soviets, predictably, have decried the invasion as a \"CIA plot using paid criminals\", much to the chagrin of the United States. 
#Cuban Exiles Land at Trinidad! (News)
#Today, the world was shocked to wake up to reports that a group of anti-Castro Cuban exiles, known as Brigade 2506, have landed in Trinidad, Cuba, approximately 170 miles southwest of the capital, Havana. A force of about 1,400 men, armed with American equipment as well as B-26 bombers, have faced little resistance from Cuban military and security services and are presently contacting local insurgent groups to aid their fight. The United States has denied any involvement in the invasion, according to a statement by the US Ambassador to the United Nations. The Soviets, predictably, have decried the invasion as a \"CIA plot using paid criminals\", much to the chagrin of the United States.
#Cuban Exile Invasion a Success!
#The landings of Cuban exile forces only days ago has ended in the complete overthrow of the Castro government in Havana! With the assistance of local insurgents, air support, and US naval presence, the exiles have formed a provisional government, as they round up communist sympathizers and imprison them. The United States has expressed great approval at these developments, declaring that \"communism has been vanquished in Cuba\" and promising aid for the exiles, who will predictably join the US's sphere of influence. While there are no comments from the Soviets yet, it is clear that they are not pleased with these developments.
#Cuban Exile Invasion a Failure!
#Unfortunately, reports from media outlets in Cuba's capital, Havana, have indicated that a local rebellion of anti-Castro insurgent exiles has been crushed by Cuban military and security forces. From the start, the landing of said exiles (known as Brigade 2506) was a disaster, with Cuban forces being easily tipped off to their landing location, and their support ships being forced to run aground without offloading their supplies. With hundreds killed and the rest captured and marked for execution, the outcome does not look good for the anti-communist movement in Cuba. 
#Should the US Intervene in Cuba?
#With the failure of Brigade 2506 to successfully overthrow the Cuban government immediately, we have to ponder our options. They continue to fight on, but only for a few more days. Our generals have drawn up plans for US intervention in Cuba, including the use of our Atlantic Fleet as well as the 101st and 82nd Airborne Divisions and armored units to quickly subdue the Cuban military and security forces. Some have expressed opposition to this plan, considering that the Soviet Union could respond offensively in kind. However, we must act quickly, and a decision must be made.
#US Intervenes in Cuba (News)
#Shocking news came out of Cuba today as approximately four US Army and Marine divisions landed in Cuba, only days after the ill-fated landing by Cuban exile Brigade 2506. Elements of the 101st Airborne and 82nd Airborne Divisions have landed at Jose Marti and San Antonio de los Banos Airfields, as well as Mariel and Baracoa Airfields surrounding Havana. The 1st and 2nd Marine Divisions, meanwhile, have landed at Tarara, approximately 10 miles from Havana's city center, as the US enforces a naval blockade and air superiority of the island. It is clear that Castro's government will not stand much of a chance unless the Soviets intervene.
#US Does Not Intervene in Cuba (News)
#In an official statement today, the President announced that while the United States nominally supports Brigade 2506's mission, the US will not intervene militarily to overthrow Castro despite the military options provided. Pundits speculate a fear of Soviet aggression as being one of the principal factors, although they assume that US intelligence services will continue to harass Cuba in the coming months.


