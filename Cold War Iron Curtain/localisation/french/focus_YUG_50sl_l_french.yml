 YUG_Introduce_Workers_Self_Management:0 "Présenter l'autogestion des travailleurs"
 YUG_Introduce_Workers_Self_Management_desc:0 "Nous devons préconiser et pratiquer l'autogestion socialiste, à la différence des pays du bloc de l'Est, qui pratiquaient tous une planification centrale et une gestion centralisée de leur économie. L'économie de la Yougoslavie sera organisée selon les théories de Josip Broz Tito et plus directement d'Edvard Kardelj. Grâce à notre politique de neutralité et à notre rôle de leader dans le Mouvement des non-alignés, les entreprises yougoslaves exporteront vers les marchés occidentaux et orientaux."
