l_french:
 YUG_The_Reconstruction_of_Yugoslavia:0 "La reconstruction de la Yougoslavie"
 YUG_The_Reconstruction_of_Yugoslavia_desc:0 "Bien que de nombreuses années se soient écoulées depuis la guerre, ses effets sont encore visibles. Nous devons travailler dur pour reconstruire notre nation."
 YUG_The_Informbiro_Period:0 "La période Informbiro"
 YUG_The_Informbiro_Period_desc:0 "Nous devons être vigilants face à la menace stalinienne."
 YUG_Jugoslavenska_Narodna_Armija:0 "Yougoslavenska Narodna Armija"
 YUG_Jugoslavenska_Narodna_Armija_desc:0 "La Jugoslavenska Narodna Armija, qui signifie l'Armée populaire yougoslave, est l'épine dorsale de notre défense. Avec leurs racines dans l'Armée de libération nationale et les détachements partisans de Yougoslavie (Narodnooslobodilacka vojska i partizanski odredi Jugoslavije), ils sont excellents dans la guérilla et peuvent sûrement nous protéger de tout envahisseur." # Narodnooslobodilačka
 YUG_The_Yugoslavian_Path_to_Socialism:0 "La voie yougoslave vers le socialisme"
 YUG_The_Yugoslavian_Path_to_Socialism_desc:0 "Même si nous avons établi le pouvoir en Yougoslavie, nous devons encore consolider le chemin que nous emprunterons afin de préserver notre passé et d'éterniser notre héritage."
 YUG_Encourage_Secular_Values:0 "Encourager les valeurs laïques"
 YUG_Encourage_Secular_Values_desc:0 "La religion est le soupir de la créature opprimée, le coeur d'un monde sans coeur et l'âme de conditions sans âme. C'est l'opium du peuple - Karl Marx"
 YUG_Reject_Socialist_Realism:0 "Rejeter le réalisme socialiste"
 YUG_Reject_Socialist_Realism_desc:0 "Le réalisme socialiste n'est rien d'autre qu'un morceau de propagande stalinienne."
 YUG_Discourage_Anticlerical_Attacks:0 "Décourager les attaques anticléricales"
 YUG_Discourage_Anticlerical_Attacks_desc:0 "En raison de notre position antireligieuse, certaines personnes ont commencé à organiser des attaques contre le clergé. Nous devons mettre fin à ces attaques pour garantir la stabilité de notre nation."
 YUG_Embrace_State_Atheism:0 "Adoptez l'athéisme d'État"
 YUG_Embrace_State_Atheism_desc:0 "Pour ne pas discriminer les différentes religions de notre pays, nous devons être officiellement athées."
 YUG_Expand_Titos_Pioneers:0 "Développer Titovi Pioniri"
 YUG_Expand_Titos_Pioneers_desc:0 "Titovi Pioniri (Les Pionniers de Tito), officiellement connu sous le nom de Savez pionira Jugoslavije, l'Union des Pionniers de Yougoslavie est l'organisation pionnière de la Yougoslavie, semblable aux autres pionniers du bloc de l'Est."
 YUG_Restore_Relations_with_the_Vatican:0 "Rompre les relations avec le Vatican"
 YUG_Restore_Relations_with_the_Vatican_desc:0 "Après que le pape Pie XII ait élevé l'archevêque Stepinac au Collège des cardinaux, la RFS de Yougoslavie a rompu ses relations diplomatiques avec le Saint-Siège, l'accusant de s'ingérer dans les affaires intérieures de l'État. Stepinac a été jugé et finalement reconnu coupable de sa coopération avec les occupants nazis pendant la Seconde Guerre mondiale. Le Saint-Siège a réagi en excommuniant le président Tito et certains autres responsables ayant participé au procès."
 YUG_Increase_Womens_Rights:0 "Augmenter les droits des femmes"
 YUG_Increase_Womens_Rights_desc:0 "Une société égalitaire est meilleure pour tout le monde."
 YUG_Establish_Yugoslav_Radio_Television:0 "Créer la Jugoslovenska Radiotelevizija"
 YUG_Establish_Yugoslav_Radio_Television_desc:0 "Jugoslovenska Radiotelevizija, ou Radio Télévision yougoslave, est le système national de radiodiffusion publique de la SFR Yougoslavie. Il se compose de huit centres infranationaux de radiodiffusion et de télévision, chacun ayant son siège dans l'une des six républiques constitutives et deux provinces autonomes de Yougoslavie."
 YUG_Empower_Peoples_Committees:0 "Autonomiser les comités populaires"
 YUG_Empower_Peoples_Committees_desc:0 "Autonomiser les comités populaires"
 YUG_Literacy_Campaign:0 "Campagne d'alphabétisation"
 YUG_Establish_the_University_of_Skopje:0 "Créer l'Université de Skopje"
 YUG_Establish_Workers_Councils:0 "Créer des conseils d'entreprise"
 YUG_Relax_Censorship:0 "Assouplir la censure"
 YUG_Allow_the_Establishment_of_Cultural_Societies:0 "Permettre la création de sociétés culturelles"
 YUG_Open_Up_to_Western_Cultural_Influences:0 "S'ouvrir aux influences culturelles occidentales"
 YUG_Stengthen_the_UDBA:0 "Renforcer l'UDBA"
 YUG_Stengthen_the_UDBA_desc:0 "Uprava Drzavne Bezbjednosti, l'Administration de la sécurité de l'État, est notre police secrète. Avec la menace soviétique, nous devons augmenter son financement et la formation de ses agents." # Državne
 YUG_Continue_the_Repression_of_Slavonia:0 "Continuer la répression en Slavonie"
 YUG_Continue_the_Repression_of_Slavonia_desc:0 "Tito est pleinement conscient que la plus grande menace au développement du communisme en Yougoslavie est le nationalisme. C'est pour cette raison que même la moindre forme de nationalisme doit être écrasée par la répression. C'est dans la région de la Slavonie, en Croatie, que les efforts sont les plus nécessaires, en raison de leur histoire récente."
 YUG_Suppress_the_Cazin_Uprising:0 "Réprimer le soulèvement de Cazin"
 YUG_Arrange_Hebrangs_Death:0 "Organiser la mort d'Hébrang"
