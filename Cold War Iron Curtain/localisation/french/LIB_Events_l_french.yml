l_french:
 LIB_First_Civil_War.1.d: "Charles Taylor, un ancien responsable du gouvernement sous le régime Doe, a été accusé de détournement de fonds gouvernementaux et a rapidement fui le Libéria en 1983. Il a été emprisonné aux États-Unis, mais a réussi à s'évader de sa prison américaine dans des circonstances mystérieuses. Il a ensuite regroupé et unifié les guérilleros de Côte d'Ivoire. Ici, il a formé le Front patriotique national du Libéria (NPFL), avec l'intention de renverser Doe. En effet, le comté de Nimba, en particulier l'État libérien, a commis des atrocités contre la population locale parce qu'elle appartenait à la même tribu que plusieurs putschistes « présumés ». Ses partisans cherchaient un moyen de représailles contre le gouvernement. Le 24 décembre 1989 était la date à laquelle le groupe rebelle de Taylor, le NPLF, commençait à envahir le Libéria. Cela a marqué le début des manoeuvres de la première guerre civile libérienne et le NPFL a rapidement sécurisé le territoire. De nombreux membres de la population Gio et Mano se sont associés et ont défendu la rébellion de Taylor. Dans une réaction brutale, l'armée libérienne a intentionnellement victimisé des civils accusés de soutenir les rebelles du NPFL. Simultanément, l'organisation rebelle de Prince Johnson, connue sous le nom de Front patriotique national indépendant du Libéria (IPF), patrouillait dans les rues de Monrovia et finissait par exécuter Doe en septembre 1990."
 LIB_flcw_second_phase.1.d: "En août 1990, une alliance de pays d'Afrique de l'Ouest sous l'égide de la Communauté économique des États de l'Afrique de l'Ouest (CEDEAO) a pris la responsabilité de déployer une force de maintien de la paix dans les rues de Monrovia. Sans aucune possibilité d'intervention des États-Unis ou des Nations Unies, l'ECOMOG est arrivé au Libéria pour séparer les factions de la guerre civile et mettre fin à l'effusion de sang. Les pays d'Afrique de l'Ouest qui ont participé ont justifié leur intervention parce qu'il ne s'agissait plus d'un conflit interne centré sur le Libéria. Pendant le conflit, des milliers de leurs propres citoyens se sont retrouvés coincés au Libéria proprement dit et des dizaines de milliers de réfugiés ont fui vers les pays voisins. Le mandat de l'ECOMOG était d'imposer un cessez-le-feu, d'aider à former un gouvernement intérimaire et d'organiser des élections dans un délai de 12 mois. Les forces de combat intervenantes, connues sous le nom de Groupe de surveillance du cessez-le-feu de la Communauté économique (ECOMOG). L'ECOMOG, dont l'objectif déclaré est d'assurer la paix, reste tout simplement hors de portée ; Cependant, la stabilité apportée par l'intervention a permis de geler temporairement une partie des effusions de sang et des meurtres ethniques. Assurant la stabilité, il sera référencé comme un modèle d'intervention africaine même s'il a été affirmé qu'il avait censuré la presse pendant la guerre."
 LIB_flcw_third_phase.1.d: "Alors que la guerre civile libérienne entre dans sa deuxième année, une nouvelle faction anti-NPFL est apparue en mai 1991. Le Mouvement uni de libération du Libéria pour la démocratie (ULIMO), dirigé par un triumvirat de commandants, a émergé des réfugiés et des soldats Krahn et Mandingues qui avaient combattu dans les Forces armées du Libéria (AFL). Dans le nord, l'organisation s'est implantée avec de nouveaux territoires conquis rapidement. Avec les combattants originaires du conflit sierra-léonais avec le Front révolutionnaire uni (RUF) pro-Taylor, ses combattants de saison subissent le plus gros des hostilités dirigées par le NPFL. Dans un avenir proche, on ne sait pas si la milice se divisera en éléments plus petits. Ils ont commencé avec 20 000 combattants. Dans la même période, les relations entre l'INPFL et le NPFL sont tendues en tant que véritable leader anti-AFL et des escarmouches ont commencé entre eux."
 LIB_flcw_fourth_phase.1.d: "Émergeant en 1993, George Boley commande le Conseil libérien de la paix (LPC) dans le sud du Libéria. Considérée comme une force mandataire pour les membres restants des Forces armées du Libéria, cette force de 1 500 hommes se dispute le contrôle avec le NPFL. Les rebelles se livreront probablement à des violations des droits humains et à des pillages. Jusqu'à présent, la communauté Krahn fournit l'essentiel de la main-d'oeuvre de cette nouvelle faction. "
 LIB_flcw_npf_attack.1.d: "L'ECOMOG a été contraint de se battre pour repousser le NPFL hors de Monrovia. Le 15 octobre 1992, le NPFL a attaqué l'ECOMOG de Monrovia. Cette attaque a mis fin à deux années d'une paix insaisissable et le Libéria est retombé dans la guerre. Taylor a amené un cadre de renforts pour attaquer Monrovia même. Ils ont été spécialement formés dans des camps situés en Guinée. "
 LIB_Snap_Election.1.d: "L'actuel président libérien, Edwin Barclay, est décédé subitement à l'âge de 73 ans. Alors que les élections précédentes étaient si proches, l'ancien vice-président, William Tolbert, affronte l'ambassadrice libérienne à l'ONU, Ellen Mills Scarbrough. Le parti True Whig exerce toujours une emprise légale sur les candidats aux élections. Tolbert, une fois apaisé pour maintenir la stabilité, se lance dans la présidence. Scarbrough, une étoile montante du parti True Whig, y voit une nouvelle opportunité d'administrer des réformes nationales populaires. Ce serait la première femme élue à la politique libérienne."
 LIB_Rig_Two.1.d: "Pour la première fois depuis 1931, plus d'un candidat à l'élection présidentielle était en compétition. En mai 1955, des élections générales ont eu lieu au Libéria. Comme on pouvait s'y attendre, William Tubman du parti True Whig a facilement été réélu, obtenant de manière suspecte plus de 99,5 % des voix. En lice pour l'élection, l'ancien président Edwin Barclay a affirmé que le bourrage des urnes était dû au fait que le nombre présumé de suffrages exprimés était supérieur au nombre d'électeurs inscrits. La base du pouvoir d'Edwin Barclay, l'Independent True Whig Party (ITWP), a été interdite après un assassinat infructueux et un complot contre la vie de William Tubman."
 LIB_Rig_One.1.d: "Le 1er mai 1951, des élections générales nationales ont eu lieu au Libéria. C'est la première à être organisée au suffrage universel. Seuls les descendants masculins d'Américano-Libériens avaient été autorisés à voter avant cette élection particulière. C'est une première au Libéria et sur la base d'un précédent référendum constitutionnel, les femmes et les propriétaires fonciers locaux ont participé au vote. Lors de l'élection présidentielle, William Tubman, du parti True Whig, s'est présenté sans opposition en tant que seul et unique candidat. Comme on pouvait s'y attendre, il a également été réélu sans opposition pour un troisième mandat consécutif. Didwho Welleh Twe, défendu comme leader de l'opposition autochtone pour contester la présidence de Tubman, s'en remet à la responsabilité des États-Unis d'Amérique de superviser des élections libres et équitables au Libéria. Tubman a disqualifié Didwho Welleh Twe pour sédition, ce qui l'a exclu de la course. Le président sortant William Tubman conservait l'autorité présidentielle depuis 1947. Tubman confirma son serment en janvier 1952. Pour la première fois, William Richard Tolbert Jr. Fut confirmé comme vice-président dans ce qui semble être une carrière politique au potentiel énorme."
 LIB_Rig_Three.1.d: "Au Libéria, en mai 1959, des élections générales nationales ont eu lieu. Lors de l'élection présidentielle, William Tubman du parti True Whig a été réélu pour un quatrième mandat. Cela a marqué la perte de William O. Davies Bright, qui n'a même pas obtenu plus de 55 voix en tant que candidat indépendant. Toutes les femmes libériennes peuvent célébrer Ellen Mills Scarbrough. Elle a été élue à un siège législatif à la Chambre des représentants du Libéria en tant que première femme à remporter un poste élu à tout moment de l'histoire du Libéria.  "
 LIB_Tubman_Attempt.1.d: "La paix a été bouleversée par les trois balles de revolver de Paul Dunbar destinées au président libérien William Tubman à Monrovia, la capitale, le 22 juin 1955. Cette date infâme sera baptisée Jour de la Délivrance pour aujourd'hui et dans le futur. Tubman était censé être réaffirmé de sa victoire électorale lors des dernières élections. La plupart des Américano-Libériens ont postulé que cela était dû au programme de Tubman en matière de réformes nationales et de coopération internationale avec les hommes d'affaires étrangers. S'il survit, Tubman promet une chasse à l'homme pour retrouver les meneurs du complot. William Tolbert se prépare à assumer la vice-présidence. Il est probable que l'ancien président Edwin Barclay, un opposant démocrate candidat à Tubman, fera basculer le pouvoir politique dans son camp de partisans. Cela peut être considéré par les initiés libériens comme un coup d'État politique sans effusion de sang. Profitant de ces perturbations, Barclay profite de l'événement pour décertifier les résultats des élections truquées et exiger un recomptage."
 LIB_Neighbor.1.d: "Avec une vague d'anticolonialisme qui déferle sur l'Afrique de l'Ouest, la politique étrangère libérienne doit être décidée. La majorité pense qu'être un bon voisin pacifique est le moyen le plus fructueux d'entretenir de bonnes relations tout en faisant progresser les intérêts libériens. Cela signifie un soutien moins que mortel à l'édification de la nation. Cependant, sous couvert d'anticommunisme, certains estiment que le Libéria doit être une puissance équilibrante et interventionniste dans la sphère d'influence africaine. Le Libéria enverra tout, y compris des troupes, pour faciliter cela. Quoi qu'il en soit, le changement s'empare de l'Afrique de l'Ouest."
 LIB_Net.1.d: "L'histoire des relations entre les Pays-Bas et la République du Libéria commence au XVIIe siècle. La relation a commencé en 1614, lorsque le voilier hollandais « White Dog » est arrivé sur la côte libérienne. En 1954, le consulat des Pays-Bas au Libéria est devenu un consulat général pour l'ensemble de la région de l'Afrique de l'Ouest. La représentation des Pays-Bas au Libéria a été élevée au niveau d'une légation au cours de cette année. La visite d'État du défunt président et de Mme Tubman aux Pays-Bas en 1956 a accentué les relations amicales pour continuer et prospérer entre les deux nations. Un timbre commémoratif libérien de cinq cents a été émis la même année pour honorer et immortaliser cette visite."
 LIB_Free_Election_1959.1.d: "Il est désormais possible, compte tenu des divisions profondément ancrées au sein du parti True Whig, que l'opposition autochtone puisse être élue de manière réaliste au Libéria, à condition qu'elle soit culturellement prête. S'attendant à ne faire qu'une bouchée des candidats de l'opposition, le parti True Whig a permis aux États-Unis de certifier des élections « propres ». Didwho Welleh Twe est prêt à représenter les intérêts autochtones sans l'ombre du pouvoir politique de Tubman. Il sera le premier Libérien à occuper ce poste. Il s'agit véritablement d'un moment monumental pour voter aux élections générales libériennes de 1959."
 LIB_Renew_MTDP.1.d: "La question de la fourniture au Libéria d'une certaine assistance militaire sous la forme d'un programme d'aide militaire très modeste, principalement par la fourniture d'un nombre limité d'instructeurs pour réorganiser et former la force militaire libérienne pour une sécurité intérieure indispensable. Il convient de noter que le Libéria peut désormais être admissible à recevoir du matériel militaire sur une base remboursable en vertu des dispositions de la loi sur l'assistance mutuelle en matière de défense de 1949. "
 LIB_Inclusion.1.d: "Aujourd'hui, le Libéria a élu son premier Libérien d'origine à la présidence, Didwho Welleh Twe. En conséquence, tous les citoyens libériens, qu'ils possèdent ou non des biens, sont éligibles pour occuper des sièges au Parlement et peuvent se présenter équitablement à la présidence. Le président des États-Unis a personnellement félicité Didwho Welleh Twe pour avoir suivi une transition pacifique du pouvoir. Les nouvelles législatures autochtones favorisent la majorité des Libériens plutôt que de se contenter des intérêts étroits des Américano-Libériens. C'est le début d'une nouvelle ère au Libéria. Cette journée restera gravée dans les mémoires."
 LIB_Doe_Civil_War.1.d: "Malgré le trucage des élections et la fraude électorale, Samuel Doe ne reculera pas face à une protestation massive. Jackson Doe (sans lien de parenté), se désignant comme représentant élu du peuple, appelle les Libériens à combattre le régime du Parti National Démocratique. Les commandants fidèles des Forces armées du Libéria de Sameul Doe détiennent la capitale et sont prêts à frapper le Parti d'action libérien non coordonné et ses transfuges affiliés dans un affrontement pour décider qui dirigera le Libéria. Les forces de l'AFL ont déjà commis des violations des droits humains pendant le mandat de Samuel Doe, et il semble qu'elles répéteront leurs représailles si elles réussissent. Le LAP doit rallier la résistance et chasser une fois pour toutes le NPD corrompu."
 LIB_Election_1985.1.d: "Le 15 octobre 1985, des élections générales ont eu lieu au Libéria. Il s'agissait des premières élections générales depuis que Samuel Doe s'est accaparé d'un monopole politique effectif après le coup d'État militaire de 1980. Lors d'un référendum organisé en 1984, un nouveau projet de constitution fut approuvé, prévoyant la création d'une Assemblée nationale intérimaire civile et militaire de 58 membres, dirigée par Samuel Doe comme président. Pour les élections, l'interdiction des partis politiques a été levée. Le Parti national démocratique (NDP) de Doe, le Parti d'action libérien, le Parti de l'unité et le Parti de l'unification du Libéria ont contesté les élections. Cependant, Smauel Doe a déclaré qu'il ne quitterait pas la présidence de manière pacifique en cas de défaite. On s'attend à ce que les élections truquées le maintiennent au pouvoir."
 LIB_Thomas_Coup.1.d: "La tentative de coup d'État libérien de 1985 a été organisée par le général Thomas Quiwonkpa, qui avait été l'un des dirigeants du coup d'État de 1980 aux côtés du président Samuel Doe et plus tard fondateur du Front patriotique national du Libéria (NPFL). Le 12 novembre 1985, un mois après la tenue des élections, Quiwonkpa, soutenu par environ deux douzaines d'hommes lourdement armés, entra secrètement au Libéria via la Sierra Leone et lança un coup d'État contre Doe. Samuel Doe a également annoncé dans une émission de radio et de télévision que toute personne trouvée dans la rue après 18 heures aurait dû être arrêtée. Le couvre-feu serait considéré comme un rebelle et exécuté immédiatement."
 LIB_Samuel_Coup.1.d: "Dans une tournure étonnante des événements, Samuel Doe, un ancien soldat, a mené un coup d'État militaire au Libéria le 12 avril 1980, renversant le gouvernement du président William Tolbert. Le coup d'État, qui s'est déroulé tôt le matin, a vu Doe et ses partisans prendre d'assaut le palais présidentiel, conduisant à l'assassinat brutal de Tolbert. Le coup d'État marque la fin de près de 133 ans de régime américano-libérien, avec Doe, membre du groupe autochtone du pays, prenant désormais le contrôle du gouvernement. Le pays est sous le choc et l'incertitude alors que le Libéria entre dans une nouvelle ère imprévisible sous un régime militaire."
 LIB_Doe_Propaganda.1.d: "Sameul Doe a employé diverses oeuvres pour renforcer la légitimité de son pouvoir grâce à un usage douteux de la propagande. Ceux-ci le mettent en valeur comme un homme du peuple qui réforme l'État pour le bénéfice commun des Libériens. En réalité, le pillage des finances publiques et la censure des médias ont déjà commencé."
 LIB_NCC_Draft.1.d: "Le Comité national de constitution (NCC) a lancé le processus de rédaction de la constitution de 1986 le 12 avril 1981. Un organe de 25 membres, dont le Dr Amos Sawyer a été nommé président, a entamé le processus de rédaction d'une nouvelle constitution pour le Libéria. Sous Doe, la Constitution libérienne de 1847 a été désengagée et suspendue à la suite du coup d'État réussi de Doe contre le président William Tolbert, Jr. Le Conseil de rédemption du peuple (PRC) a conclu son projet de Constitution en 1983. La RPC a confié la responsabilité de l'inspection du document à un Comité consultatif constitutionnel (CAA) composé de 59 membres. Après son acceptation par référendum national le 3 juillet 1984, la Constitution est entrée en vigueur le 6 janvier 1986."

###LIB Leader desc
LIB_Tubman_desc: "William Vacanarat Shadrach Tubman, surnommé « le père du Libéria moderne » par ses partisans, est une figure semi-controversée. Né le 29 novembre 1895, il vivait dans la pauvreté, comme tous les Libériens de l'époque. À l'âge de 15 ans, il décide de s'engager dans l'armée et participe à plusieurs opérations militaires à travers le pays. Au cours de son service, il a été promu de soldat à officier. Son projet initial était de devenir prédicateur et pasteur à l'âge de 19 ans. Cependant, il a rapidement changé ses plans et a étudié pour l'examen du barreau auprès de divers tuteurs. Il a finalement réussi et est devenu avocat en 1917. Il a occupé plusieurs emplois ; enregistreur, percepteur d'impôts, enseignant, et est revenu à un moment donné dans l'armée en tant que colonel. Il fait alors son entrée en politique. Rejoindre le parti dominant True Whig et devenir le plus jeune sénateur. Au cours de son mandat, il s'est battu pour les droits constitutionnels des peuples autochtones qui représentaient 80 % de la population du Libéria. Après sa réélection, il devient conseiller personnel du président Allen Yancy. Devenir une figure puissante de la politique libérienne. Le président Edwin Barclay l'a nommé à la Cour suprême pour l'empêcher de briguer la présidence. Il fallait néanmoins choisir un successeur à Barclay. William Tubman était le favori. Il prêta serment le 3 janvier 1944. Ce fut une décision difficile pour Tubman. Tous les médecins du Libéria étaient allemands. Et ils exportaient d'importantes quantités de caoutchouc. Malgré cela, pour être du bon côté de l'histoire, le Libéria a déclaré la guerre à l'Allemagne et au Japon le 27 janvier 1944. Ils ont expulsé tous les citoyens allemands et ont réduit les importations de caoutchouc vers la nation vaincue jusqu'à relancer les exportations vers l'Allemagne de l'Ouest pendant la guerre froide. Willian Tubman est désormais prêt à mettre en oeuvre sa vision pour le Libéria. Il a des projets drastiques pour une ère de prospérité pour tous les Libériens. Il est prêt à réformer les initiatives de politique économique et étrangère. Il espère également améliorer la vie des autochtones, même si cela peut s'avérer difficile pour lui."
