#Cuba CUB
 CUB_infantry_equipment_0:0 "Fusil Johnson M1941"
 CUB_infantry_equipment_0_short:0 "Fusil Johnson M1941"
 CUB_infantry_equipment_0_desc:0 "Le M1941 Johnson Rifle est un fusil semi-automatique américain à recul court conçu par Melvin Johnson avant la Seconde Guerre mondiale. Le M1941 a rivalisé sans succès avec le fusil américain M1."

 CUB_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 CUB_infantry_equipment_1_short:0 "FN FAL"
 CUB_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 CUB_infantry_equipment_2:0 "Avtomat Kalachnikova Modernizirovanniy"
 CUB_infantry_equipment_2_short:0 "AKM"
 CUB_infantry_equipment_2_desc:0 "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps."
 
 CUB_infantry_equipment_3:0 "Avtomat Kalachnikova 1974"
 CUB_infantry_equipment_3_short:0 "AK-74"
 CUB_infantry_equipment_3_desc:0 "L'AK74 est un fusil d'assaut moderne développé par Mikhaïl Kalachnikov pour remplacer l'AKM en 1974. Il utilise une cartouche plus petite et un alésage chromé amélioré avec 4 rainures à droite. Le guidon et le bloc de gaz ont été repensés pour contenir un canal bas installé à 90 degrés de l'axe de l'alésage afin de réduire le cisaillement des balles au niveau de la cale bâbord. De plus, son développement s'est accompagné d'une variété d'accessoires, notamment une crosse rembourrée en caoutchouc. Les améliorations apportées à l'AK74 ont permis aux soldats de transporter une plus grande quantité de munitions sur le terrain et de maintenir un volume de tir plus élevé avec des précisions moyennes plus élevées. Il a été utilisé de manière coûteuse pendant le conflit en Afghanistan, où la CIA a payé une grosse somme d'argent aux moudjahidines pour récupérer un AK74 capturé. L'AK74 est utilisé par les autorités civiles du gouvernement cubain."

 CUB_infantry_equipment_4:0 "Avtomat Kalashnikova Modernizirovanniy (production et modernisation sous licence cubaine)"
 CUB_infantry_equipment_4_short:0 "AKM cubain"
 CUB_infantry_equipment_4_desc:0 "Une version produite sous licence de l'AKM, simplement connue sous le nom d'AKM cubain, est toujours utilisée et produite de nos jours. Des points de montage supplémentaires pour une lunette conçue et produite de manière indigène ont été ajoutés, ce qui lui confère potentiellement une durée de vie plus longue pour un fusil en service à Cuba depuis la fin des années 1950."


 ########## NEW CUB ARMOR
 CUB_lt_equipment_1:0 "M3A3 Stuart"
 CUB_lt_equipment_1_short:0 "M3A3 Stuart"
 CUB_lt_equipment_2:0 "Lévrier M8"
 CUB_lt_equipment_2_short:0 "Lévrier M8"
 CUB_lt_equipment_3:0 "PT-76"
 CUB_lt_equipment_3_short:0 "PT-76"
 CUB_lt_equipment_3_desc:0 "Le PT76 est un char léger amphibie soviétique et a été largement exporté dans le monde entier. Il a été conçu par N Shashmyrin et Zh Kotin en 1951 et environ 12 000 unités ont été fabriquées. Il nécessite un équipage de 3 hommes et un moteur V6 six cylindres en ligne avec une vitesse de 44 km/h et peut nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique et à tendance soviétique et, en tant que tel, a joué un rôle de reconnaissance dans pratiquement tous les conflits des nations de la sphère soviétique. Cependant, il est encore utilisé aujourd'hui dans de nombreux pays en raison de sa célèbre fiabilité et de sa facilité d'entretien."
 CUB_lt_equipment_4:0 "PT-76B modèle 4"
 CUB_lt_equipment_4_short:0 "PT-76B"
 CUB_lt_equipment_4_desc:0 "PT-76 armé du canon de char rayé D-56TS de 76,2 mm (frein de bouche à double chicane, éjecteur de cartouche, extracteur de fumée et système de stabilisation à 2 axes STP-2P 'Zarya'), du système de protection NBC PAZ (protivo-atomnaya zashchita), d'un système d'extinction automatique d'incendie, d'un viseur TShK-2-66 amélioré, d'un système de filtration-ventilation, de dispositifs d'observation améliorés, d'un système électrique amélioré. équipement, un nouveau moteur diesel V-6B 6 cylindres 4 temps en ligne refroidi par eau développant 263 ch (196 kW) à 1 800 tr/min et des réservoirs de carburant internes supplémentaires pour lesquels la forme du blindage a dû être légèrement modifiée."

 CUB_ht_equipment_4:0 "IS-2M"
 CUB_ht_equipment_4_short:0 "IS-2M"

 CUB_mbt_equipment_0:0 "M4 Sherman"
 CUB_mbt_equipment_0_short:0 "M4 Sherman"
 CUB_mbt_equipment_1:0 "Croiseur-char A34 Comet"
 CUB_mbt_equipment_1_short:0 "Comète"
 CUB_mbt_equipment_2:0 "T-54"
 CUB_mbt_equipment_2_short:0 "T-54"
 CUB_mbt_equipment_2_desc:0 "Le char T-54 était le char le plus produit de l'histoire. Le char a été conçu en 1946 par KMBD. Le char lui-même utilise un canon rayé de 100 mm et possède différentes épaisseurs de blindage allant de 205 mm à 60 mm. Le moteur lui-même est un moteur diesel V-12 de 38,88 litres et le réservoir utilise une suspension à barre de torsion et était capable d'atteindre des vitesses allant jusqu'à 48 km/h. Le char lui-même a été utilisé dans plus de 50 armées à travers le monde et a été produit dans toute la sphère soviétique et dans tous ses conflits. "
 CUB_mbt_equipment_3:0 "T-55"
 CUB_mbt_equipment_3_short:0 "T-55"
 CUB_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. L'OKB-520 a modifié la conception du T-55 en améliorant la protection NBC, en lui donnant un moteur plus optimisé, en améliorant la forme de la tourelle et en ajoutant même davantage d'équipements auxiliaires tels qu'un contrôle de tir et une optique améliorés. De plus, le T-55 utilisait plus souvent le 12,7 DShK HMG tandis que le T-54 utilisait le canon 7,62 SGMT, ce qui lui accordait plus de puissance de feu mais l'empêchait de transporter plus de munitions. Le T-55 a été utilisé dans autant d'armées et a généralement été témoin de tous les conflits que le T-54 a vus. "
 CUB_mbt_equipment_4:0 "T-62"
 CUB_mbt_equipment_4_short:0 "T-62"
 CUB_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Le T-62 utilise un canon à canon lisse et possède un blindage légèrement plus épais. Le canon principal a également été augmenté à 115 mm. Il a été initialement commandé par l'Union soviétique dans le but d'améliorer sa puissance de feu et le bureau d'études OKB-520 a terminé le projet vers 1960. Bien qu'il s'agisse d'une amélioration, la production n'a pas été abandonnée car son coût était nominalement plus élevé que celui du T-55. Plus de 22 700 T-62 ont été fabriqués et ont été le théâtre de nombreux combats dans toute la sphère soviétique, mais surtout au Moyen-Orient. Ses améliorations ont montré une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique. "
 CUB_mbt_equipment_5:0 "T-62M"
 CUB_mbt_equipment_5_short:0 "T-62M"
 CUB_mbt_equipment_5_desc:0 "Le T-62 est une évolution du char T-55. Le T-62 utilise un canon à canon lisse et possède un blindage légèrement plus épais. Le canon principal a également été augmenté à 115 mm. Il a été initialement commandé par l'Union soviétique dans le but d'améliorer sa puissance de feu et le bureau d'études OKB-520 a terminé le projet vers 1960. Bien qu'il s'agisse d'une amélioration, la production n'a pas été abandonnée car son coût était nominalement plus élevé que celui du T-55. Plus de 22 700 T-62 ont été fabriqués et ont été le théâtre de nombreux combats dans toute la sphère soviétique, mais surtout au Moyen-Orient. Ses améliorations ont montré une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique. "

 CUB_mechanized_equipment_1:0 "Demi-piste M2"
 CUB_mechanized_equipment_1_short:0 "Demi-piste M2"
 CUB_mechanized_equipment_1_desc:0 "La voiture semi-chenillée M2 est une voiture semi-chenillée blindée produite par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspirait des semi-chenilles importées de France dans les années 1930, employant des composants standard fournis par les constructeurs de camions américains pour accélérer la production et réduire les coûts. Le concept a été conçu et les modèles pilotes fabriqués par Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement étiqueté M2.). La production par la White Motor Company a commencé en 1940 et a été élargie pour inclure Autocar."
 CUB_mechanized_equipment_2:0 "Demi-piste M3"
 CUB_mechanized_equipment_2_short:0 "Demi-piste M3"
 CUB_mechanized_equipment_2_desc:0 "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 CUB_mechanized_equipment_3:0 "Demi-piste M3A1"
 CUB_mechanized_equipment_3_short:0 "Demi-piste M3A1"
 CUB_mechanized_equipment_3_desc:0 "Le M3A1 est un semi-chenillé M3 doté du support d'anneau de mitrailleuse M49 amélioré sur le siège avant droit. Entre 1942 et 1943, tous les half-tracks M3 (standard et A1) furent continuellement améliorés. Ces améliorations comprenaient un certain nombre d'améliorations de la transmission, du moteur et du rangement"
