 CUB_fighter_equipment_0_short:0 "DAAFAR"
 CUB_fighter_equipment_0_desc:0 "La Force aérienne et de défense aérienne révolutionnaire cubaine, communément abrégée en DAAFAR en espagnol et en anglais, est la force aérienne de Cuba."
