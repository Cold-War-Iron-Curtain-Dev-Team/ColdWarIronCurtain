 CUB_tac_bomber_equipment_2:0 "B-25C Mitchell nord-américain"
 CUB_tac_bomber_equipment_2_short:0 "B-25C Mitchell"
 CUB_tac_bomber_equipment_2_desc:0 "Le B-25 est un bombardier moyen bimoteur introduit en 1941. Utilisé par de nombreuses forces aériennes pendant la Seconde Guerre mondiale, il a également servi sur tous les théâtres impliquant des avions pendant la guerre, l'utilisation la plus célèbre étant le raid de Doolittle, la première campagne de bombardement aérien réussie sur le continent japonais pendant la guerre. Son surnom est « Mitchell », du nom du major général Billy Mitchell, pionnier de l'aviation militaire américaine."
