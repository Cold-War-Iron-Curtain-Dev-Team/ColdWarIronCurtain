 CUB_attack_helicopter_equipment_2:0 "Mil Mi-24V"
 CUB_attack_helicopter_equipment_2_short:0 "Mil Mi-24V"
 CUB_attack_helicopter_equipment_2_desc:0 "Développement ultérieur qui est entré en production en 1976. Il était armé du 9M114 Shturm (AT-6 Spiral) plus avancé. Huit de ces missiles sont montés sur quatre pylônes extérieurs des ailes. Il s'agit de la version la plus produite avec plus de 1 500 exemplaires. En service polonais, cet avion est désigné Mi-24W. Un Mi-24V a été appelé Mi-24T pour des raisons inconnues."
 CUB_attack_helicopter_equipment_3:0 "Mil Mi-25"
 CUB_attack_helicopter_equipment_3_short:0 "Mil Mi-25"
 CUB_attack_helicopter_equipment_3_desc:0 "La version d'exportation du Mi-24D. (Hind-D) Le Mi-24D a été conçu pour être un vaisseau de combat plus pur que les variantes précédentes. Il est entré en production en 1973. Le Mi-24D possède un fuselage avant redessiné, avec deux cockpits séparés pour le pilote et le tireur. Il est armé d'une seule mitrailleuse Yak-B à quatre canons de 12,7 mm sous le nez. Il peut également transporter quatre nacelles de roquettes de 57 mm, quatre missiles antichar SACLOS 9M17 Phalanga (une amélioration significative par rapport au système MCLOS du Mi-24A), ainsi que des bombes et d'autres armes."

