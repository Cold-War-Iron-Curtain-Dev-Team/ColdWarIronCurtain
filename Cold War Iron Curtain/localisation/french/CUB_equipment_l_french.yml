 CUB_fighter_equipment_3_short:0 "P-51D Mustang"

 #CUB_jet_multirole_equipment_1:0 ""
 #CUB_jet_multirole_equipment_1_short:0 ""
 #CUB_jet_multirole_equipment_1_desc:0 "P-51 Mustang GFX"
 CUB_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15"
 CUB_jet_multirole_equipment_2_desc:0 "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 CUB_jet_multirole_equipment_2_short:0 "MiG-15"
 CUB_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17"
 CUB_jet_multirole_equipment_3_desc:0 "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
 CUB_jet_multirole_equipment_3_short:0 "MiG-17"
 CUB_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19"
 CUB_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 CUB_jet_multirole_equipment_4_short:0 "MiG-19"
 CUB_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-21F-13"
 CUB_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 CUB_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 CUB_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21PF"
 CUB_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 CUB_jet_multirole_equipment_6_short:0 "MiG-21PF"
 CUB_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-23M"
 CUB_jet_multirole_equipment_7_desc:0 "le MiG-23 a été le premier chasseur soviétique à disposer d'un radar de surveillance et d'abattage et l'un des premiers à être armé de missiles au-delà de la portée visuelle. La production a commencé en 1969 et a atteint un grand nombre avec plus de 5 000 avions construits, ce qui en fait l'avion à voilure variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service limité auprès de certains clients exportateurs."
 CUB_jet_multirole_equipment_7_short:0 "MiG-23M"
 CUB_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-23ML"
 CUB_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment la solidité et la fiabilité de la cellule, les performances du moteur, la maniabilité et les performances du radar. Une refonte considérable de la cellule a été réalisée, aboutissant au MiG-23ML."
 CUB_jet_multirole_equipment_8_short:0 "MiG-23ML"
 CUB_jet_multirole_equipment_9:0 "Mikoyan-Gourevitch MiG-23MLD"
 CUB_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de la mise à niveau était d'améliorer la maniabilité, en particulier lors d'une AoA élevée, ce qui a été identifié comme le principal défaut du MiG-23M/ML. Le boom de Pitot était équipé de générateurs de vortex, et les racines entaillées du bord d'attaque de l'aile étaient en « dents de scie » pour agir également comme générateurs de vortex. Le système de commande de vol incorporait le dispositif d'arrêt de manche synthétique/limiteur de signaux SOS-3-4."
 CUB_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 CUB_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29A"
 CUB_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le Mikoyan Design Bureau. C'était le premier chasseur de 4e génération à entrer en service en URSS et dans le bloc de l'Est. Intégrant une avionique améliorée et des capacités radar considérablement améliorées. Les premiers MiG-29 ont été utilisés comme entraîneurs par le Pacte de Varsovie avec des exportations limitées vers l'Inde mais avaient une utilisation limitée au combat. Le MiG-29 deviendra plus tard la base de variantes largement produites telles que le MiG-29S, le MiG-29M et le MiG-35."
 CUB_jet_multirole_equipment_10_short:0 "MiG-29A"

 CUB_jet_CAS_equipment_7:0 "Mikoyan-Gourevitch MiG-23BN"
 CUB_jet_CAS_equipment_7_short:0 "MiG-23BN"
 CUB_jet_CAS_equipment_7_desc:0 "(\"Flogger-H\") Produit depuis 1973, le MiG-23BN était basé sur le MiG-23B, mais avait le même moteur R-29-300 que les variantes de chasseurs contemporains. Ils étaient également équipés d'ailes de « type 3 ». Il y a eu d'autres changements mineurs dans l'électronique et l'équipement, et certains changements ont été apportés au cours de sa longue production. La production en série a duré jusqu'en 1985, avec 624 exemplaires construits. La plupart d'entre eux ont été exportés, car les Soviétiques l'ont toujours considéré comme un type intérimaire et seul un petit nombre a servi dans les régiments de l'aviation frontale. Comme d'habitude, une version dégradée a été vendue aux clients du tiers monde. Cette variante s'est avérée assez populaire et efficace. La caractéristique d'identification la plus distinctive entre le MiG-23B et le MiG-23BN était que le premier avait la tête diélectrique juste au-dessus du pylône, qui a été retirée du MiG-23BN. En Inde, les derniers MiG-23BN ont été pilotés par le 221e Escadron (Valiants) de l'Indian Air Force et ont été mis hors service le 6 mars 2009. Le commandant de bord Tapas Ranjan Sahu a été le dernier pilote à faire atterrir le MiG-23BN ce jour-là"
 
 CUB_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 CUB_jet_light_equipment_1_short:0 "Étoile filante T-33"
 CUB_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 CUB_jet_light_equipment_2:0 "Mikoyan-Gourevitch MiG-15UTI"
 CUB_jet_light_equipment_2_short:0 "MiG-15UTI"
 CUB_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 se voit officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n°1 entre mars et mai 1949. La cabine de l'instructeur de l'UTI MiG-15 a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
 CUB_jet_light_equipment_3:0 "L-29 Delfin"
 CUB_jet_light_equipment_3_short:0 "L-29 Delfin"
 CUB_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín (anglais : Dolphin, nom OTAN : Maya) est un avion d'entraînement militaire développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 entraîneurs L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avion d'entraînement standard pour l'armée de l'air soviétique."
 CUB_jet_light_equipment_4:0 "Aéro L-39 Albatros"
 CUB_jet_light_equipment_4_short:0 "L-39 Albatros"
 CUB_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. C'était le premier avion d'entraînement à être équipé d'un groupe motopropulseur à double flux. Ce type a été exporté dans un large éventail de pays en tant qu'entraîneur militaire."
 CUB_jet_light_equipment_5:0 "Aéro L-39ZA Albatros"
 CUB_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 CUB_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement armé et les attaques légères, utilisant un train d'atterrissage plus robuste, une charge utile plus élevée et notamment un canon à double canon GSh-23L de 23 millimètres fixé dans une nacelle conforme sous le compartiment des pilotes, ayant un chargeur de 150 cartouches dans la cellule."
 
