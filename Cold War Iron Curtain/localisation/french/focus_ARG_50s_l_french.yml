 Eva_peron: "Mère de la République"
 Eva_peron_desc: "\n\n\n\n\n£Eva_Peron\n\n\n\n\n\n\n\n\n§CMaría Eva§! §WDu§!ar§Wte§! §Cde Perón§! §W- La Première Dame d'Argentine s'est trouvée au coeur de la transformation politique et sociale de la nation. Rayonnant de charisme et de détermination, elle était passée d'une ancienne actrice à une défenseure infatigable des pauvres, des femmes et des travailleurs. Grâce à la Fondation Eva Perón, elle a canalisé des ressources vers les nécessiteux, en construisant des hôpitaux, des écoles et des maisons.\n\nSon militantisme acharné avait déjà contribué à garantir aux femmes le droit de vote et, en 1949, sa voix rivalisait avec celle de n'importe quel élu. Adorée par les descamisados - les « torse nu » - et redoutée par l'élite, Evita était devenue un symbole vivant de l'Argentine péroniste, brouillant la frontière entre politique et dévotion, pouvoir et mythe.§!"
 Fabricaciones_Militares: "Fabrications militaires"