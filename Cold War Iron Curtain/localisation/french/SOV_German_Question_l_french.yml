l_french:
 # ---- Entry event ----
 germanquestion.1.t:0 "La question allemande"
 germanquestion.1.d:0 "L'occupation de l'Allemagne ne peut pas durer éternellement. En [WGR.capital.GetCapitalVictoryPointName], [?WGR.country_leader.GetName] pousse la République fédérale vers le réarmement et le bloc occidental ; à l'Est, le camarade [?DDR.country_leader.GetName] construit le socialisme sous le bouclier de l'armée soviétique. Moscou doit décider comment répondre à la question allemande - par une note diplomatique proposant l'unification et la neutralité, ou en durcissant définitivement la division de la nation allemande. Quoi que nous choisissions, le monde nous regarde."
 germanquestion.1.a:0 "Rédigez une note aux puissances occidentales."
 germanquestion.1.b:0 "Le sort de l'Allemagne sera réglé avec le temps."

 # ---- Root / fork ----
 SOV_sn_the_german_question:0 "La question allemande"
 SOV_sn_the_german_question_desc:0 "Quatre puissances, une nation divisée. Le moment est venu de définir la politique soviétique à l'égard de l'Allemagne pour la décennie - une véritable tentative de la réunifier selon nos conditions, ou le retranchement permanent d'un Est socialiste."
 SOV_sn_the_german_question_tt:0 "Ouvre les deux voies de la politique soviétique envers l'Allemagne"

 SOV_sn_manage_the_division:0 "Laissez la note mentir"
 SOV_sn_manage_the_division_desc:0 "Les puissances occidentales n'accepteront jamais une Allemagne véritablement neutre, et nous ne parierons pas sur la bonne foi de la République démocratique allemande. Nous gérerons la division telle qu'elle est et consoliderons notre moitié de l'Allemagne - la voie historique."

 SOV_sn_pursue_the_note:0 "Émettez la note de Staline"
 SOV_sn_pursue_the_note_desc:0 "Envoyez la note à Washington : une offre d'une Allemagne unifiée, neutre, démocratique, libre de troupes étrangères. Laissons les puissances occidentales se révéler : soit elles négocient de bonne foi, soit elles exposent leur intention de maintenir l'Allemagne divisée et armée contre nous."

 # ---- Path A: Historical ----
 SOV_sn_the_note_rejected:0 "La note rejetée"
 SOV_sn_the_note_rejected_desc:0 "Comme prévu, l'Occident a préféré les traités [WGR.capital.GetCapitalVictoryPointName] et la Communauté européenne de défense à notre offre. L'Allemagne de l'Ouest se réarmera au sein de son bloc. Que le monde se souvienne de ceux qui ont refusé la paix."
 SOV_sn_the_note_rejected_tt:0 "Victoire de la propagande : l'Occident est tenu pour responsable de la division"

 SOV_sn_the_new_course:0 "Le nouveau cours"
 SOV_sn_the_new_course_desc:0 "Avec le départ de Staline, Moscou freine la fuite en avant du [?DDR.country_leader.GetName]vers le socialisme. Assouplir les quotas de collectivisation et la pression sur les travailleurs est-allemands avant que le mécontentement ne déborde."

 SOV_sn_crush_the_june_uprising:0 "Écraser le soulèvement de juin"
 SOV_sn_crush_the_june_uprising_desc:0 "Les travailleurs de Berlin-Est sont dans la rue. Le Nouveau Cours est arrivé trop tard. Les chars soviétiques rétabliront l'ordre en République démocratique allemande - une dure leçon, mais l'État socialiste tiendra bon."
 SOV_sn_crush_the_june_uprising_tt:0 "Les forces soviétiques répriment le soulèvement du 17 juin ; le DDR est ébranlé mais sécurisé"

 SOV_sn_grant_ddr_sovereignty:0 "Accorder la souveraineté du DDR"
 SOV_sn_grant_ddr_sovereignty_desc:0 "Dissoudre la Commission de contrôle soviétique et mettre fin aux réparations. La République démocratique allemande devient un État socialiste souverain et un partenaire à part entière, et non plus une zone occupée."
 SOV_sn_grant_ddr_sovereignty_tt:0 "La DDR est reconnue comme un allié souverain"

 SOV_sn_found_the_warsaw_pact:0 "J'ai trouvé le Pacte de Varsovie"
 SOV_sn_found_the_warsaw_pact_desc:0 "L'Allemagne de l'Ouest a rejoint l'OTAN. Nous répondons en nature : un traité d'amitié, de coopération et d'assistance mutuelle liant les États socialistes - avec la République démocratique allemande parmi ses fondateurs."
 SOV_sn_found_the_warsaw_pact_tt:0 "La RDA rejoint l'alliance dirigée par les Soviétiques"

 SOV_sn_adenauer_in_moscow:0 "[?WGR.country_leader.GetName] Vient à Moscou"
 SOV_sn_adenauer_in_moscow_desc:0 "Le chancelier ouest-allemand se rend lui-même au Kremlin. Nous établirons des relations diplomatiques avec [WGR.capital.GetCapitalVictoryPointName] - et, comme un geste envers le peuple allemand, libérerons les derniers prisonniers de guerre allemands encore sous notre garde."
 SOV_sn_adenauer_in_moscow_tt:0 "Relations ouvertes avec [WGR.capital.GetCapitalVictoryPointName] ; les derniers prisonniers de guerre allemands rentrent chez eux"

 SOV_sn_treaty_on_relations:0 "Traité sur les relations avec la RDA"
 SOV_sn_treaty_on_relations_desc:0 "Signez le traité sur les relations : la République démocratique allemande est libre de décider de sa propre politique intérieure et étrangère. Les forces soviétiques restent, mais en tant qu'alliées et non en tant qu'occupants. L'ordre des deux Allemagnes est terminé."
 SOV_sn_treaty_on_relations_tt:0 "Souveraineté totale pour le DDR ; la division de l'Allemagne est cimentée"

 # ---- Path B: Ahistorical response ----
 SOV_sn_a_reunified_germany:0 "Une Allemagne réunifiée"
 SOV_sn_a_reunified_germany_desc:0 "L'impossible s'est produit : les quatre puissances se sont mises d'accord et l'Allemagne est à nouveau une seule nation. Moscou doit maintenant décider quoi en penser. Le type d'Allemagne qui émergera de la conférence déterminera tous les choix qui suivront."
 SOV_sn_a_reunified_germany_tt:0 "La politique soviétique s'adapte à l'Allemagne grâce aux notes produites"

 SOV_sn_welcome_socialist_camp:0 "Bienvenue dans le camp socialiste"
 SOV_sn_welcome_socialist_camp_desc:0 "Le drapeau rouge flotte sur le Reichstag. Une Allemagne socialiste unie prend sa place dans le Pacte de Varsovie et dans la communauté économique socialiste - le plus grand prix de l'après-guerre."
 SOV_sn_welcome_socialist_camp_tt:0 "L'Allemagne socialiste unie rejoint l'alliance soviétique"

 SOV_sn_arsenal_of_socialism:0 "L'arsenal du socialisme"
 SOV_sn_arsenal_of_socialism_desc:0 "La Ruhr - la plus grande concentration d'industrie lourde en Europe - sert désormais la cause des travailleurs. Intégrer l'industrie allemande dans l'économie socialiste et forger l'arsenal du bloc."
 SOV_sn_arsenal_of_socialism_tt:0 "L'industrie lourde allemande au service de l'économie socialiste"

 SOV_sn_beacon_to_the_west:0 "Un phare vers l'Ouest"
 SOV_sn_beacon_to_the_west_desc:0 "Une Allemagne socialiste unie et prospère est la meilleure propagande que le mouvement puisse demander. Son exemple électrifiera les travailleurs de France et d'Italie."
 SOV_sn_beacon_to_the_west_tt:0 "Les partis communistes montent en puissance en France et en Italie"

 SOV_sn_guarantee_neutrality:0 "Garantir la neutralité"
 SOV_sn_guarantee_neutrality_desc:0 "L'Allemagne est entière, désarmée et non alignée. Notre tâche est désormais de maintenir cette situation telle qu'elle est, en garantissant qu'aucune Allemagne réunifiée ne rejoindra jamais une alliance occidentale."
 SOV_sn_guarantee_neutrality_tt:0 "L'Allemagne est définitivement exclue de l'OTAN"

 SOV_sn_spirit_of_rapallo:0 "L'esprit de Rapallo"
 SOV_sn_spirit_of_rapallo_desc:0 "Comme en 1922, deux outsiders se rapprochent. Une coopération commerciale et technique approfondie liera tranquillement une Allemagne neutre à Moscou, quoi qu'en disent les élections à [WGR.capital.GetCapitalVictoryPointName]."
 SOV_sn_spirit_of_rapallo_tt:0 "Une Allemagne neutre penche progressivement vers l'Union soviétique"

 SOV_sn_peace_dividend:0 "Les dividendes de la paix"
 SOV_sn_peace_dividend_desc:0 "Sans front allemand où garnir et sans la clé de voûte de l'OTAN retirée, l'Union soviétique peut respirer. Redéployez les armées d'occupation et récoltez les fruits d'une Europe plus calme."
 SOV_sn_peace_dividend_tt:0 "La tension mondiale retombe ; le front intérieur soviétique se stabilise"
 SOV_sn_peace_dividend_threat:0 "Les dividendes de la paix"

 SOV_sn_a_costly_gamble:0 "Un pari coûteux"
 SOV_sn_a_costly_gamble_desc:0 "Les partis bourgeois ont remporté les élections panallemandes. Nous avons parié sur l'unification et avons donné à l'Occident une Allemagne unique, puissante et hostile - et le règlement des comptes nous attend au Politburo. Pourtant, la Patrie serre les rangs. Rien ne rallie le peuple soviétique comme une Allemagne renaissante sur l'Oder, et Moscou met tout son poids pour contenir la menace."
 SOV_sn_a_costly_gamble_tt:0 "Le pari s'est retourné contre lui : une Allemagne unie et hostile"

 SOV_sn_fortify_the_frontier:0 "Fortifiez la nouvelle frontière"
 SOV_sn_fortify_the_frontier_desc:0 "Une Allemagne unie sur l'Oder est une menace que nous avons sous-estimée. Fortifiez la frontière et rallier les Polonais, qui craignent encore plus que nous une résurgence de l'Allemagne."
 SOV_sn_fortify_the_frontier_tt:0 "La frontière occidentale est militarisée ; La Pologne se rapproche"

 SOV_sn_underground_struggle:0 "La lutte souterraine"
 SOV_sn_underground_struggle_desc:0 "Si nous ne parvenons pas à gagner l'Allemagne par les urnes, nous la gagnerons dans les usines et dans la rue. Financez les communistes hors-la-loi et maintenez la lutte des classes vivante au sein de l'Allemagne unie."
 SOV_sn_underground_struggle_tt:0 "L'agitation communiste se développe au sein de l'Allemagne unie"

 # ---- Path B alternate-history flavor news events ----
 # (i) Socialist Germany
 germanquestion.2.t:0 "[GetNewspaperHeader]Le drapeau rouge sur le Reichstag"
 germanquestion.2.d:0 "C'est fait. D'Aix-la-Chapelle à l'Oder, de la mer du Nord aux Alpes, un seul État ouvrier allemand hisse le drapeau rouge sur le Reichstag. La bourgeoisie de [WGR.capital.GetCapitalVictoryPointName] a fui à l'étranger ou s'est agenouillée, et le camarade [?DDR.country_leader.GetName] s'adresse à une nation unie depuis Berlin alors que la foule sur l'Alexanderplatz s'étend hors de portée des yeux. Les puissances occidentales, qui pariaient que des élections libres amèneraient l'Allemagne dans leur camp, doivent expliquer à leurs propres peuples comment la plus grande nation industrielle d'Europe a plutôt glissé dans le giron socialiste. A Paris et à Rome, les partis communistes défilent en triomphe ; à Washington, les récriminations ont déjà commencé. Marx et Engels ont écrit leur Évangile dans ce pays - et maintenant, il s'accomplit enfin là où il a été proclamé pour la première fois."
 germanquestion.2.a:0 "Le prolétariat allemand a choisi !"

 germanquestion.3.t:0 "[GetNewspaperHeader]La Forge de l'Europe"
 germanquestion.3.d:0 "Les hauts fourneaux de la Ruhr - Krupp, Thyssen, les grands arsenaux qui ont armé à deux reprises la machine de guerre allemande - déversent désormais leur acier pour le Commonwealth socialiste. Là où les cartels répondaient autrefois aux actionnaires de Londres et de New York, le charbon et le fer de Rhénanie servent désormais le plan des travailleurs. Les ingénieurs allemands examinent les plans à Magnitogorsk tandis que les planificateurs soviétiques étudient la célèbre précision d'Essen et de Wolfsburg. Il s'agit du mariage des deux grands peuples industriels du continent, si longtemps opposés par leurs maîtres - et ensemble, ils construiront ce qu'aucun capitaliste n'a jamais osé imaginer. Le plan quinquennal a trouvé sa forge."
 germanquestion.3.a:0 "L'acier pour la révolution."

 # (ii) Neutral Germany
 germanquestion.4.t:0 "[GetNewspaperHeader]Une troisième Allemagne"
 germanquestion.4.d:0 "Ni rouge ni OTAN, une Allemagne réunifiée est désormais seule au coeur même de l'Europe - désarmée, non alignée et surveillant avec méfiance tous ses voisins. Dans [WGR.capital.GetCapitalVictoryPointName], les hommes d'État parlent grandiosement d'un « pont entre les blocs », d'une nation qui commercerait avec l'Est comme avec l'Ouest et ne recevrait d'ordres d'aucun des deux. A Washington, les généraux maudissent la brèche creusée dans leur ligne, là où les divisions de la Bundeswehr auraient dû se dresser contre la marée soviétique. L'alliance atlantique, si minutieusement assemblée, voit sa clé de voûte discrètement retirée. Moscou, de son côté, dit très peu et sourit."
 germanquestion.4.a:0 "Un trou dans le mur occidental."

 germanquestion.5.t:0 "[GetNewspaperHeader]L'esprit de Rapallo revient"
 germanquestion.5.d:0 "Comme à Rapallo en 1922, lorsque deux parias de l'ordre d'après-guerre se sont rencontrés dans une paisible station balnéaire italienne, Moscou et Berlin se rapprochent une fois de plus. Les délégations commerciales font la navette entre le Kremlin et le Reichstag ; les coentreprises se multiplient dans l'Oural et le long du Rhin ; Les techniciens allemands dérivent vers l'est avec leurs plans tandis que les céréales et les minerais soviétiques affluent en retour vers l'ouest. Aucun traité ne lie cette Allemagne neutre au camp socialiste - ses ministres prennent soin de le dire à chaque occasion. Et pourtant, chaque contrat signé, chaque caisse de machines-outils, chaque poignée de main discrète lors d'un salon de Leipzig l'éloigne un peu plus de l'Occident. Moscou comprend que la neutralité n'est qu'un début."
 germanquestion.5.a:0 "Lié par le fer et le charbon, pas par un traité."

 # (iii) Western Germany
 germanquestion.6.t:0 "[GetNewspaperHeader]Le Politburo estime"
 germanquestion.6.d:0 "Les récriminations derrière les murs du Kremlin sont amères et longues. Nous avons misé la République démocratique allemande elle-même sur les urnes - et la bourgeoisie allemande, engraissée pendant une décennie grâce aux dollars Marshall, a consciencieusement voté pour ses maîtres en [WGR.capital.GetCapitalVictoryPointName]. Aujourd'hui, une Allemagne unique, puissante et totalement hostile se dresse là où existaient autrefois deux États, son industrie intacte et ses ressentiments aiguisés, tandis que les camarades du SED rédigent leurs manifestes depuis les chambres d'hôtel de Moscou. Dans les couloirs du Comité central, un mémorandum circule déjà, nommant ceux qui ont conseillé ce pari. Quelqu'un, camarades, en répondra."
 germanquestion.6.a:0 "Une grave erreur de calcul."

 germanquestion.7.t:0 "[GetNewspaperHeader]Fantômes dans les usines"
 germanquestion.7.d:0 "Ils ont interdit le Parti, mais aucun décret des [WGR.capital.GetCapitalVictoryPointName]ne peut interdire la lutte des classes elle-même. Dans la Ruhr et les ports du nord, dans les chantiers navals de Hambourg et les fosses de la Sarre, les cellules se reforment dans l'ombre : un ralentissement de l'équipe de nuit par-là, une liasse de tracts par-là, une grève sauvage qui éclate le long de la chaîne de montage et s'éteint avant l'arrivée des fourgons de police. Le Reich unifié a beau arborer le noir-rouge-or au-dessus de ses ministères, sous ses usines, le vieux drapeau rouge n'a pas été déployé - seulement plié, caché et passé de main en main, en attendant. La lutte est patiente ; il peut se le permettre."
 germanquestion.7.a:0 "La lutte continue dans la clandestinité."
