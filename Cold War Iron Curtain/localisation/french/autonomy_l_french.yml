 indo_protectorate_status:0 "Protectorat de la Fédération indochinoise"
 indo_protectorate_status_desc:0 "Bien que proclamé membre indépendant de l'Union française dans le cadre des Accords de l'Élysée, l'État du Vietnam reste fortement contraint par l'autorité française. La politique étrangère doit généralement s'aligner sur celle de l'Union française, les politiciens et les ambassadeurs autochtones nécessitant l'approbation de Paris, et les forces militaires françaises continuent de commander et de dominer la défense de la nation. La véritable souveraineté reste une aspiration plutôt qu'une réalité."
 indo_associated_state:0 "État associé à la Fédération indochinoise"
 indo_associated_state_desc:0 "Suite au Traité de Pau, l'État du Vietnam a obtenu une plus grande autonomie au sein de l'Union française, assumant un contrôle direct sur ses propres finances, son administration douanière et ses affaires intérieures. Les ministères autochtones supervisent désormais les domaines autrefois réservés à Paris, et la toute jeune Armée nationale vietnamienne se tient aux côtés des forces françaises plutôt qu'en dessous d'elles. L'Union française dicte toujours les grandes lignes de la politique étrangère et conserve le dernier mot sur les questions d'État, mais l'autonomie gouvernementale vietnamienne est désormais une réalité concrète plutôt qu'une promesse lointaine."
