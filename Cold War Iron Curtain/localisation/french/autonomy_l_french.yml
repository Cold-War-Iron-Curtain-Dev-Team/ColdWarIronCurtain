l_french:
 make_puppet_button_TT:0 "Créer un satellite\nFait de la nation cible un État associé, mais la déstabilise également de 25 % et aggrave nos relations avec les voisins de notre nouvel État fantoche."
 trade_agreement_button_TT:0 "Accord commercial bilatéral\nréduction de 50 % des coûts commerciaux entre les deux pays."
 coup_button_TT:0 "Investissement économique\nAccroît la croissance économique du pays cible grâce à un esprit national"
 manipulate_politics_button_TT:0 "Influence politique\nAugmentation de la popularité de votre parti de 2 % dans le pays cible."
 target_other_button_TT:0 "Accès militaire\nNous donne un accès militaire et des droits d'amarrage au pays cible."
 aid_military_button_TT:0 "Apporter une aide militaire\nFournit une assistance militaire à la nation cible dans un esprit national."
 influence_action_button_TT:0 "Commencer à influencer la nation\nAugmente notre influence sur la nation cible de 50 points."
 economic_exploitation_button_TT:0 "Exploitation économique\nPermet d'utiliser une partie de l'industrie du pays cible et améliore l'efficacité des échanges commerciaux, au prix d'une détérioration des relations avec ses voisins."
 INF_COUP_DESC:0 "Coût : 750 PP, niveau d'influence requis : 50 % et 75 PO. Dans le cadre d'une action extrême et coûteuse, le système gouvernemental d'un pays tout entier peut être renversé. Cela exige une planification et une infiltration poussées, mobilisant ainsi une part considérable de l'influence et des ressources internationales du pays visé. L'objectif est de recueillir des renseignements à grande échelle, de déplacer des armes, de planifier des attaques internes, et ce, à l'insu des dirigeants et des services de renseignement du pays cible. En cas d'échec, le pays ciblé est peu susceptible de traiter à nouveau avec l'auteur de l'attaque, qui risque de perdre la confiance de la communauté internationale."
 INF_DEFENSE_DESC:0 "Un pacte défensif coûte 10 points de projection de puissance et requiert une influence d'au moins 50 % sur la cible. Il garantit à chaque nation l'entraide et la défense mutuelle en temps de guerre. En s'appuyant sur des influences favorables dans un pays, un tel pacte peut se concrétiser. Même si un pays entretient des relations conflictuelles avec celui qui exerce cette influence, les pressions conjoncturelles et les circonstances l'amèneront à accepter le pacte, l'alternative étant défavorable."
 INF_TRADE_DESC:0 "Coût : 500 PP, 10 points de projection de puissance et un niveau d'influence d'au moins 34 % sur la cible. Les accords de libre-échange sont des accords conclus entre nations pour faciliter la fluidité des échanges commerciaux. Le libre-échange peut être instauré en exerçant une influence sur un pays et en renforçant la sécurité des routes commerciales."
 INF_ECON_DESC:0 "Coût : 100 PP et 3 points de projection de puissance. Négocier des investissements étrangers avantageux est un art complexe. Vous souhaitez peut-être obtenir les meilleures conditions possibles pour votre pays, mais les investisseurs étrangers recherchent avant tout leurs propres profits. Grâce à une habile négociation, il est possible d'obtenir des conditions favorables auprès des investisseurs et des banques étrangères. Des projections créatives, des promesses de sécurité des investissements et quelques arrangements douteux en coulisses peuvent permettre à un pays d'obtenir des conditions anormalement avantageuses au détriment de l'investisseur."
 INF_POLI_DESC:0 "Cela coûte 200 points de puissance politique et 25 points de projection de puissance. S'allier à une nation facilite la communication et la diplomatie, mais peut aussi diffuser des idéaux. En tirant parti de son influence internationale, il est possible d'exercer des pressions politiques sur un pays afin d'en modifier l'idéologie. Même au sein des nations les plus inébranlables, les amis et les personnes influentes peuvent avoir un impact considérable."
 FPP_TOOLTIP:0 "La projection de puissance est la mesure de votre influence internationale qui vous permet de mener des actions diplomatiques ou politiques spécifiques. Elle se mesure à votre capacité à répondre aux crises, à déployer et maintenir rapidement des forces, et à exercer une pression sur les relations et les forces internationales en votre faveur. La projection de puissance est une ressource rare et strictement limitée par les forces diplomatiques et militaires disponibles. Il est matériellement impossible de surutiliser ces ressources."
