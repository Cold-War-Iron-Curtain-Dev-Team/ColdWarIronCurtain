l_french:
 make_puppet_button_TT:0 "Créer un satellite\nCela fait de la nation cible un État associé, mais cela la déstabilise également de 25 % et détériore nos relations avec les nouveaux voisins fantoches."
 trade_agreement_button_TT:0 "Accord commercial bilatéral\nRéduire les coûts commerciaux de 50 % entre les deux nations."
 coup_button_TT:0 "Investissement économique\nAugmente la croissance économique dans le pays cible grâce à un esprit national"
 manipulate_politics_button_TT:0 "Influencer la politique\nAugmentation de la popularité de votre parti de 2 % dans le pays cible."
 target_other_button_TT:0 "Accès militaire\nCela nous donne un accès militaire et des droits d'amarrage à la nation cible."
 aid_military_button_TT:0 "Donner une aide militaire\nDonne à la nation cible une assistance militaire via un esprit national."
 influence_action_button_TT:0 "Commencez à influencer la nation\nAugmente notre influence sur la nation cible de 50 points."
 economic_exploitation_button_TT:0 "Exploitation économique\nNous permet d'utiliser une partie de l'industrie du pays cible et améliore l'efficacité commerciale au prix d'une détérioration des relations avec ses voisins"

 INF_COUP_DESC:0 "Coûte 750 PP, nécessite un niveau d'influence de 50 % et 75 Po. Dans un acte extrême et coûteux, le système gouvernemental d'un pays tout entier peut être supplanté. Cela nécessite une planification et une infiltration sérieuses et, en tant que tel, va immobiliser une partie massive de l'influence et des ressources internationales d'un pays afin de recueillir des informations à grande échelle, de déplacer des armes, de planifier des attaques en interne et de faire tout cela en dehors de la conscience des politiciens du pays cible et de leurs moyens de renseignement internes et externes. Si cet acte échoue, il est peu probable que le pays lui-même s'en prenne à nouveau aux auteurs de ces actes et que la communauté internationale ne leur fasse pas confiance."
 INF_DEFENSE_DESC:0 "Coûte 10 points de projection de puissance et possède un niveau d'influence d'au moins 50 % sur la cible. Les pactes défensifs garantissent à chaque nation de se défendre mutuellement en temps de guerre. En tirant parti des influences favorables dans un pays, un pacte défensif peut se concrétiser. Même si un pays entretient des relations défavorables avec l'emprunteur, les influences et les pressions situationnelles le conduiront à accepter car l'alternative serait défavorable."
 INF_TRADE_DESC:0 "Coûte 500 PP, 10 points de projection de puissance et possède un niveau d'influence d'au moins 34 % sur la cible. Les accords de libre-échange sont des accords entre nations visant à faciliter un commerce ininterrompu entre 2 nations. En tirant parti de son influence auprès d'un pays et en améliorant la sécurité des routes commerciales avec un pays, le libre-échange peut être établi. "
 INF_ECON_DESC:0 "Coûte 100 PP et 3 points de projection de puissance. Négocier des investissements étrangers favorables est un art difficile. Vous désirez peut-être la meilleure offre possible pour votre pays, mais les investisseurs étrangers souhaitent avoir plus de profits dans leurs poches. Grâce à l'art de la transaction, des conditions favorables peuvent être négociées auprès des investisseurs et des banques étrangers. Des projections créatives, des promesses de sécurité des investissements et certains accords douteux en coulisses peuvent permettre à un pays de négocier des accords anormalement favorables aux dépens de l'investisseur."
 INF_POLI_DESC:0 "Coûte 200 points de pouvoir politique et 25 points de projection de pouvoir. Être aligné sur une nation ouvre des voies de communication et de diplomatie, mais peut également diffuser des idéaux. En tirant parti de l'influence internationale, des pressions politiques peuvent être exercées sur un pays afin de changer son idéologie. Même dans les pays les plus fidèles, les amis et les influenceurs peuvent exercer une influence considérable."
 FPP_TOOLTIP:0 "La projection de puissance est la mesure de votre influence internationale qui vous permet de mener des actions diplomatiques ou politiques particulières. La capacité à projeter votre puissance dans les relations internationales se mesure par votre capacité à répondre aux crises, à déployer et à maintenir rapidement des forces et à faire pression sur les relations et les forces internationales en votre faveur. La projection de puissance est rare et strictement limitée par les forces de travail diplomatiques et militaires disponibles. La surextension de ces actifs est physiquement impossible."
 autonomy_dominion:0 "Domination"
 autonomy_ssr:0 "République socialiste soviétique"
