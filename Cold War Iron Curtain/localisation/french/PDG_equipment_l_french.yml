 PDG_jet_multirole_equipment_1:0 "Mikoyan-Gourevitch MiG-9"
 PDG_jet_multirole_equipment_1_desc:0 "Le MiG-9 Fargo a été le premier avion à réaction conçu par Mikoyan après la Seconde Guerre mondiale. Introduit en 1948. Il a été utilisé de manière limitée au combat et à l'entraînement pendant la guerre civile chinoise et la guerre de Corée. Au total, 610 avions furent produits, uniquement par l'URSS. Les derniers MiG 9 furent mis hors service par la RPC en 1951."
 PDG_jet_multirole_equipment_1_short:0 "MiG-9"
 PDG_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15"
 PDG_jet_multirole_equipment_2_desc:0 "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 PDG_jet_multirole_equipment_2_short:0 "MiG-15"
 PDG_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17"
 PDG_jet_multirole_equipment_3_desc:0 "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
 PDG_jet_multirole_equipment_3_short:0 "MiG-17"
 PDG_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19"
 PDG_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 PDG_jet_multirole_equipment_4_short:0 "MiG-19"
 PDG_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-21F-13"
 PDG_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 PDG_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 PDG_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21PF"
 PDG_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 PDG_jet_multirole_equipment_6_short:0 "MiG-21PF"
 PDG_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-23M"
 PDG_jet_multirole_equipment_7_desc:0 "le MiG-23 a été le premier chasseur soviétique à disposer d'un radar de surveillance et d'abattage et l'un des premiers à être armé de missiles au-delà de la portée visuelle. La production a commencé en 1969 et a atteint un grand nombre avec plus de 5 000 avions construits, ce qui en fait l'avion à voilure variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service limité auprès de certains clients exportateurs."
 PDG_jet_multirole_equipment_7_short:0 "MiG-23M"
 PDG_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-23ML"
 PDG_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment la solidité et la fiabilité de la cellule, les performances du moteur, la maniabilité et les performances du radar. Une refonte considérable de la cellule a été réalisée, aboutissant au MiG-23ML."
 PDG_jet_multirole_equipment_8_short:0 "MiG-23ML"
 PDG_jet_multirole_equipment_9:0 "Mikoyan-Gourevitch MiG-23MLD"
 PDG_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de la mise à niveau était d'améliorer la maniabilité, en particulier lors d'une AoA élevée, ce qui a été identifié comme le principal défaut du MiG-23M/ML. Le boom de Pitot était équipé de générateurs de vortex, et les racines entaillées du bord d'attaque de l'aile étaient en « dents de scie » pour agir également comme générateurs de vortex. Le système de commande de vol incorporait le dispositif d'arrêt de manche synthétique/limiteur de signaux SOS-3-4."
 PDG_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 PDG_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29A"
 PDG_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le Mikoyan Design Bureau. C'était le premier chasseur de 4e génération à entrer en service en URSS et dans le bloc de l'Est. Intégrant une avionique améliorée et des capacités radar considérablement améliorées. Les premiers MiG-29 ont été utilisés comme entraîneurs par le Pacte de Varsovie avec des exportations limitées vers l'Inde mais avaient une utilisation limitée au combat. Le MiG-29 deviendra plus tard la base de variantes largement produites telles que le MiG-29S, le MiG-29M et le MiG-35."
 PDG_jet_multirole_equipment_10_short:0 "MiG-29A"

 PDG_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29S"
 PDG_mr_stealth_fighter_equipment_1_short:0 "MiG-29S"
 #PDG_mr_stealth_fighter_equipment_1_desc:0 ""

 PDG_jet_light_equipment_1:0 "Mikoyan-Gourevitch MiG-9UTI"
 PDG_jet_light_equipment_1_short:0 "MiG-9UTI"
 PDG_jet_light_equipment_1_desc:0 "Pour assurer la préparation du personnel navigant de l'unité de combat des chasseurs à réaction de l'Armée de l'Air, l'équipe OKB-155, dirigée par A.I. Mikoyan, s'est vu confier le développement d'une modification biplace de l'avion MiG-9. Les travaux sur une nouvelle modification du MiG-9 en OKB-155 ont commencé en juillet 1946. La conception préliminaire du « jumeau » était prête fin octobre et conformément au calendrier de conception et de construction de l'avion, approuvé par Mikoyan le 26 août, le premier prototype a été déployé sur l'aérodrome. Prévu pour le 20 décembre 1946."
 PDG_jet_light_equipment_2:0 "Mikoyan-Gourevitch MiG-15UTI"
 PDG_jet_light_equipment_2_short:0 "MiG-15UTI"
 PDG_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 se voit officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n°1 entre mars et mai 1949. La cabine de l'instructeur de l'UTI MiG-15 a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
 PDG_jet_light_equipment_3:0 "L-29 Delfin"
 PDG_jet_light_equipment_3_short:0 "L-29 Delfin"
 PDG_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín (anglais : Dolphin, nom OTAN : Maya) est un avion d'entraînement militaire développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 entraîneurs L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avion d'entraînement standard pour l'armée de l'air soviétique."
 PDG_jet_light_equipment_4:0 "Aéro L-39 Albatros"
 PDG_jet_light_equipment_4_short:0 "L-39 Albatros"
 PDG_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. C'était le premier avion d'entraînement à être équipé d'un groupe motopropulseur à double flux. Ce type a été exporté dans un large éventail de pays en tant qu'entraîneur militaire."
 PDG_jet_light_equipment_5:0 "Aéro L-39ZA Albatros"
 PDG_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 PDG_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement armé et les attaques légères, utilisant un train d'atterrissage plus robuste, une charge utile plus élevée et notamment un canon à double canon GSh-23L de 23 millimètres fixé dans une nacelle conforme sous le compartiment des pilotes, ayant un chargeur de 150 cartouches dans la cellule."

 PDG_recon_equipment_0:0 "Stinson L-5 Sentinelle"
 PDG_recon_equipment_0_short:0 "Sentinelle L-5"
 #PDG_recon_equipment_0_desc:0 ""
 PDG_jet_recon_equipment_0:0 "Mikoyan-Gourevitch MiG-15Rbis"
 PDG_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 PDG_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé le développement d'une variante de reconnaissance de première ligne du MiG-15 avec une caméra AFA-BA/40, qui fournit une largeur de levé en bande de 0,9 à 4,5 km avec une longueur de route de photographie de 90 à 450 km à des altitudes de 2 000 à 10 000 m. Un seul canon NR-23 a été installé sur l'avion. Pour augmenter la portée du scout, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur \"Barium-M\" et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur la machine."
 PDG_jet_recon_equipment_1:0 "Mikoyan-Gourevitch MiG-25RB"
 PDG_jet_recon_equipment_1_short:0 "MiG-25RB"
 PDG_jet_recon_equipment_1_desc:0 "MiG-25RB - avion de reconnaissance opérationnel monoplace toutes altitudes - bombardier. Les tests ont été achevés en décembre 1970. L'avion était équipé de 2 à 4 caméras de reconnaissance générale A-70M et d'une caméra topographique AFA-E/10. Le matériel photographique était logé dans cinq compartiments situés au bas du fuselage avant. Une station SIGINT appelée SPS-4A ou B « Virage » a également été installée, fonctionnant dans différentes gammes de fréquences. Équipement spécial - station d'interférence radio active SPS-141"
 PDG_jet_recon_equipment_2:0 "Sukhoï Su-24MR"
 PDG_jet_recon_equipment_2_short:0 "Su-24MR"
 PDG_jet_recon_equipment_2_desc:0 "Variante de reconnaissance tactique dédiée. Le Su-24MR conserve une grande partie de la suite de navigation du Su-24M, y compris le radar de suivi de terrain, mais supprime le radar d'attaque Orion-A, le système laser/TV et le canon au profit de deux installations de caméras panoramiques, la caméra TV « Aist-M » (« Cigogne »), le radar aéroporté latéral (SLAR) RDS-BO « Shtik » (« Baïonnette ») et l'infrarouge « Zima » (« Hiver »). Système de reconnaissance. D'autres capteurs sont transportés sous forme de pod."
 


 PDG_CAS_equipment_1:0 "Henschel Hs126K-6"
 PDG_CAS_equipment_1_short:0 "HS 126K-6"
 PDG_CAS_equipment_2:0 "Fairey Bataille B.1"
 PDG_CAS_equipment_2_short:0 "Fairey Bataille B.1"
 PDG_CAS_equipment_3:0 "Hawker Hurricane Mk.V"
 PDG_CAS_equipment_3_short:0 "Ouragan Mk.V"
 PDG_CAS_equipment_4:0 "Iliouchine Il-16"
 PDG_CAS_equipment_4_short:0 "Il-16"
 PDG_CAS_equipment_4_desc:0 "L'Ilyushin Il-16 est le dernier développement de l'avion d'attaque au sol Sturmovik. Il s'agissait essentiellement d'une version réduite de l'Ilyushin Il-10, mais elle était équipée d'un moteur Mikulin AM-43NV nouvellement développé dans l'espoir qu'il serait plus rapide et plus maniable que son prédécesseur. Trois avions ont été construits à des fins d'essais, mais en raison de problèmes moteur imprévus qui n'ont pas pu être résolus, le projet a été annulé."
 
 PDG_jet_CAS_equipment_1:0 "Iliouchine IL-10M"
 #PDG_jet_CAS_equipment_1_desc:0 "The Yakovlev Yak-23 Flora was a Soviet designed ground attack aircraft introduced in 1949. The aircraft was a development of the Yak-15 jet fighter. The Yak-23 was primarily exported to Warsaw pact nations, where it remained in service until the late 1950's."
 PDG_jet_CAS_equipment_1_short:0 "IL-10M"
 PDG_jet_CAS_equipment_2:0 "Mikoyan-Guerevich MiG-17bis"
 PDG_jet_CAS_equipment_2_desc:0 "Conversion de chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 PDG_jet_CAS_equipment_2_short:0 "MiG-17bis"
 PDG_jet_CAS_equipment_3:0 "Mikoyan-Guerevich MiG-19S"
 PDG_jet_CAS_equipment_3_desc:0 "Version chasseur-bombardier avec queue en dalle entièrement mobile. Equipé d'un récepteur de navigation longue portée Svod et armé de trois canons NR-30 de 30 mm. Il y avait des dispositions pour un pack de fusées non guidées ORO-32K ou une bombe FAB-250 sous chaque aile, et à partir de 1957 modifié pour permettre le transport de quatre nacelles de fusée."
 PDG_jet_CAS_equipment_3_short:0 "MiG-19S"
 PDG_jet_CAS_equipment_4:0 "Soukhoï Su-7B"
 PDG_jet_CAS_equipment_4_desc:0 "La variante bombardier du Su-7 Fitter-A a volé pour la première fois en mars 1959, puis est entrée en service en 1961. Il deviendra le principal avion d'attaque au sol soviétique des années 1960. De 1957 à 1972, plus de 1 400 Su-7B ont été construits, dont beaucoup ont été exportés. L'avion était relativement populaire à l'étranger et servait dans 10 pays. Il a connu un service étendu dans les forces aériennes indiennes et égyptiennes. L'avion reste en service limité en Corée du Nord."
 PDG_jet_CAS_equipment_4_short:0 "Su-7B"
 PDG_jet_CAS_equipment_5:0 "Sukhoï Su-7BKL"
 PDG_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté de la colonne vertébrale du fuselage, réservoirs de carburant installés dans les ailes, points d'attache « humides » sous les ailes pour transporter des réservoirs de carburant externes, capables de transporter des bombes nucléaires tactiques."
 PDG_jet_CAS_equipment_5_short:0 "Su-7BKL"
 PDG_jet_CAS_equipment_6:0 "Soukhoï Su-17M"
 PDG_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
 PDG_jet_CAS_equipment_6_short:0 "Su-17M"
 PDG_jet_CAS_equipment_7:0 "Mikoyan-Gourevitch MiG-27M"
 PDG_jet_CAS_equipment_7_desc:0 "Le MiG-27 Flogger est un avion d'attaque au sol soviétique à ailes en flèche variable. L'avion est basé sur le MiG-23 mais optimisé pour l'attaque au sol. Contrairement au MiG-23, le MiG-27 n'a pas été largement utilisé en dehors de l'URSS. De 1970 à 1986, 1 075 avions ont été produits. Le MiG-27 a été utilisé au cours des dernières étapes des guerres soviéto-afghanes et de Kargil. L'avion reste en service limité avec l'Inde et le Kazakhstan."
 PDG_jet_CAS_equipment_7_short:0 "MiG-27M"
 PDG_jet_CAS_equipment_8:0 "Soukhoï Su-25"
 PDG_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. L'avion a effectué son vol inaugural en 1975 et a été introduit en 1981. Depuis 1978, plus de 1 000 avions ont été produits. C'était un avion particulièrement populaire à l'étranger, vendu dans 29 pays. Pour cette raison, le Su-25 a été impliqué dans plusieurs conflits, notamment la guerre soviétique en Afghanistan, l'Iran-Irak et la guerre du Golfe. L'avion reste aujourd'hui en service dans tous les pays d'exportation."
 PDG_jet_CAS_equipment_8_short:0 "Su-25"

 PDG_nav_bomber_equipment_1:0 "Fairey IIIM"
 PDG_nav_bomber_equipment_1_short:0 "Fairey IIIM"
 PDG_nav_bomber_equipment_2:0 "Martin A-30 Baltimore Mk. III"
 PDG_nav_bomber_equipment_2_short:0 "Baltimore Mk.III"
 PDG_nav_bomber_equipment_3:0 "Martin A-30 Baltimore Mk.V"
 PDG_nav_bomber_equipment_3_short:0 "Baltimore Mk.V"
 PDG_nav_bomber_equipment_4:0 "Beriev Be-6"
 PDG_nav_bomber_equipment_4_short:0 "Être-6"
 PDG_nav_bomber_equipment_4_desc:0 "Le Be-6 était un hydravion produit par le bureau de conception de Beriev, dont le premier vol a eu lieu en 1949. Il était capable d'accomplir une grande variété de missions. En plus de son rôle principal de patrouille maritime et de reconnaissance maritime, le Be-6 a également été utilisé dans les patrouilles côtières et sur les lignes de ravitaillement, dans le pose de mines, dans les bombardiers torpilleurs, les bombardiers moyens et dans les transports. Son nom de rapport USAF/OTAN est Type 34, tandis que le nom de code OTAN était Madge."
 PDG_nav_bomber_equipment_5:0 "Beriev Be-10"
 PDG_nav_bomber_equipment_5_short:0 "Être-10"
 PDG_nav_bomber_equipment_5_desc:0 "Le Be-10, également connu sous le nom d'Izdelye M, était un hydravion à turboréacteur développé par l'Union soviétique en 1956. Conçu comme un bombardier de patrouille, le Be-10 était notoirement difficile à piloter et souffrait de fatigue du métal due aux contraintes de la cellule lors des décollages et atterrissages à grande vitesse ainsi qu'à la corrosion. En tant que tel, le type a été rapidement remplacé en service par le dernier Be-12 Mail. Connu en Occident sous le nom de Mallow, une sous-variante civile modifiée, le M-10 était connu pour avoir établi 12 records du monde par la Fédération aéronautique internationale (Fédération mondiale des sports aériens) en 1961."
 PDG_nav_bomber_equipment_6:0 "Beriev Be-12N Tchaïka"
 PDG_nav_bomber_equipment_6_short:0 "Be-12N Tchaïka"
 PDG_nav_bomber_equipment_6_desc:0 "Le Be-12 a été développé en 1960 pour succéder et remplacer le Be-6 Madge et le Be-10 Mallow, et a été développé comme avion de patrouille anti-sous-marin et maritime. Contrairement à son prédécesseur immédiat, propulsé par un turboréacteur, le Be-12 était un avion propulsé par un turbopropulseur et doté également d'un train d'atterrissage rétractable, ce qui donnait à l'engin une capacité d'atterrissage amphibie. La variante N améliorée était équipée de nouveaux capteurs, d'une avionique, d'un système de recherche et d'attaque Nartsiss et d'un capteur de détecteur d'anomalies magnétiques (MAD). Connu localement sous le nom de Chayka, qui signifie mouette, son nom de rapport OTAN est Mail."
 #PDG_nav_bomber_equipment_7:0 "Antonov An-26R"
 #PDG_nav_bomber_equipment_7_short:0 "An-26R"
 #PDG_nav_bomber_equipment_7_desc:0 ""

 PDG_tac_bomber_equipment_0:0 "Hawker Horsley Mk.II"
 PDG_tac_bomber_equipment_0_short:0 "Horsley Mk.II"
 PDG_tac_bomber_equipment_1:0 "Potez 633 B2 Grec"
 PDG_tac_bomber_equipment_1_short:0 "Potez 633 B2 Grec"
 PDG_tac_bomber_equipment_2:0 "Vickers Wellington Mk.II"
 PDG_tac_bomber_equipment_2_short:0 "Wellington Mk.II"
 PDG_tac_bomber_equipment_3:0 "Vickers Wellington Mk. XIII"
 PDG_tac_bomber_equipment_3_short:0 "Wellington Mk. XIII"

 #PDG_jet_tac_bomber_equipment_1:0 "Ilyushin Il-22"
 #PDG_jet_tac_bomber_equipment_1_short:0 "Il-22"
 #PDG_jet_tac_bomber_equipment_1_desc:0 "The Ilyushin Il-22 was the first Soviet jet-engined bomber to fly. It used four Lyulka TR-1 turbojets carried on short horizontal pylons ahead and below the wing. The engines did not meet their designed thrust ratings and their fuel consumption was higher than planned. These problems meant that the aircraft could not reach its required performance and it was cancelled on 22 September 1947."
 PDG_jet_tac_bomber_equipment_2:0 "Iliouchine Il-28"
 PDG_jet_tac_bomber_equipment_2_short:0 "Il-28"
 PDG_jet_tac_bomber_equipment_2_desc:0 "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à entrer en production à grande échelle, l'Il-28, lors de son introduction en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été progressivement retirés du service soviétique dans les années 1980, de nombreux avions de ce type sont encore en service aujourd'hui. Le nom de rapport USAF/DoD est Type 27, tandis que le nom de code OTAN est Beagle."
 PDG_jet_tac_bomber_equipment_3:0 "Yakovlev Yak-28B"
 PDG_jet_tac_bomber_equipment_3_short:0 "Yak-28B"
 PDG_jet_tac_bomber_equipment_3_desc:0 "Le Yak-28 a été développé comme un avion de combat à ailes en flèche introduit en 1960. Les variantes du bombardier Yak-28, connues sous leur nom de code OTAN Brewer, avaient des moteurs montés sur une nacelle, similaires à la lampe de poche Yak-25 à partir de laquelle il a été développé. Avec cela et l'aile en flèche, c'était un avion hautement subsonique, capable d'atteindre des vitesses transsoniques à haute altitude. Il a servi de principal bombardier léger de l'armée de l'air soviétique et a été largement utilisé par la Russie, la Biélorussie et le Turkménistan après la chute de l'Union soviétique, tous étant retirés en 1992."
 PDG_jet_tac_bomber_equipment_4:0 "Yakovlev Yak-28I"
 PDG_jet_tac_bomber_equipment_4_short:0 "Yak-28I"
 PDG_jet_tac_bomber_equipment_4_desc:0 "Version améliorée avec le système de ciblage interne \"Initsiativa-2\" Radar de cartographie au sol à 360 degrés ainsi qu'un système de ciblage contrôlé au sol utilisant la triangulation à partir de sites émetteurs au sol"
 PDG_jet_tac_bomber_equipment_5:0 "Mikoyan-Guérivitch MiG-25RBT"
 PDG_jet_tac_bomber_equipment_5_short:0 "MiG-25RBS"
 PDG_jet_tac_bomber_equipment_5_desc:0 "Le MiG-25RBS est un bombardier de reconnaissance monoplace dérivé du MiG-25R, équipé de systèmes de reconnaissance améliorés et d'un système de bombardement automatique Peleng. L'avion peut transporter une charge de huit bombes de 500 kg (1 102 lb)."
 PDG_jet_tac_bomber_equipment_6:0 "Soukhoï Su-24"
 PDG_jet_tac_bomber_equipment_6_short:0 "Su-24"
 PDG_jet_tac_bomber_equipment_6_desc:0 "Un gros chasseur-bombardier développé par l'Union soviétique dans les années 1960 et toujours utilisé aujourd'hui. Les caractéristiques incluent ses ailes variables et son corps pointu. Il peut équiper jusqu'à 8 000 kg d'armes et est capable de lancer différents types de missiles air-sol tout en conservant une vitesse stable. Cet avion est connu sous son nom de code OTAN « Fencer ». Avec son successeur, le Su-34, il est actuellement actif comme chasseur-bombardier pour les anciens pays du camp de l'Est."
 PDG_jet_tac_bomber_equipment_7:0 "Soukhoï Su-24M"
 PDG_jet_tac_bomber_equipment_7_short:0 "Su-24M"
 PDG_jet_tac_bomber_equipment_7_desc:0 "Entré en service en 1983, le Su-24M était un développement ultérieur du Su-24 à partir du moment où le type initial est entré en service. L'une des principales caractéristiques du Su-24M est l'inclusion d'une capacité de ravitaillement en vol avec une sonde de ravitaillement rétractable, un nouveau système de navigation interne et le désignateur laser Kaira-24, permettant au type d'utiliser des bombes à guidage de précision. Il est connu en Occident sous le nom de Fencer-D."