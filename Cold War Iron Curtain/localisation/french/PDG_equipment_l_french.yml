 ## Infantry Equipment
 PDG_infantry_equipment_0:0 " Mousqueton 98 kurz"
 PDG_infantry_equipment_0_short:0 "Mousqueton 98k"
 PDG_infantry_equipment_0_desc:0 "Un fusil à verrou emblématique adopté par la Wehrmacht en 1935 comme fusil de service standard. C'était l'un des derniers développements de la longue lignée de fusils militaires Mauser. Bien que complété par des fusils semi-automatiques et entièrement automatiques pendant la Seconde Guerre mondiale, il est resté le principal fusil de service allemand jusqu'à la fin de la guerre en 1945. Malgré le nombre croissant de fusils semi-automatiques et entièrement automatiques, le Kar98k continue d'être utilisé des deux côtés du rideau de fer."

 PDG_infantry_equipment_1:0 "Avtomat Kalachnikova 1947"
 PDG_infantry_equipment_1_short:0 "AK-47"
 PDG_infantry_equipment_1_desc:0 "L'AK47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK47 constituait une vaste mise à niveau du SKS. L'AK47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde."

 PDG_infantry_equipment_2:0 "Avtomat Kalachnikova Modernizirovanniy"
 PDG_infantry_equipment_2_short:0 "AKM"
 PDG_infantry_equipment_2_desc:0 "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps."

 PDG_infantry_equipment_3:0 "Avtomat Kalachnikova 1974"
 PDG_infantry_equipment_3_short:0 "AK-74"
 PDG_infantry_equipment_3_desc:0 "L'AK74 est un fusil d'assaut moderne développé par Mikhaïl Kalachnikov pour remplacer l'AKM en 1974. Il utilise une cartouche plus petite et un alésage chromé amélioré avec 4 rainures à droite. Le guidon et le bloc de gaz ont été repensés pour contenir un canal bas installé à 90 degrés de l'axe de l'alésage afin de réduire le cisaillement des balles au niveau de la cale bâbord. De plus, son développement s'est accompagné d'une variété d'accessoires, notamment une crosse rembourrée en caoutchouc. Les améliorations apportées à l'AK74 ont permis aux soldats de transporter une plus grande quantité de munitions sur le terrain et de maintenir un volume de tir plus élevé avec des précisions moyennes plus élevées. Il a été utilisé de manière coûteuse pendant le conflit en Afghanistan, où la CIA a payé une grosse somme d'argent aux moudjahidines pour récupérer un AK74 capturé."
 
