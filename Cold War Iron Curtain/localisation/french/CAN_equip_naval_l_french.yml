 #Battleship/Battlecruiser Hulls in research tree#
 #Carrier Hulls in research tree#

 CAN_carrier_hull_light_0: "Classe Majestic/Colosse"
 CAN_carrier_hull_light_1: "Réaménagement de la classe Majestic/Colossus"
 CAN_carrier_hull_light_2: "Classe invincible"
 CAN_carrier_hull_light_3: "Classe de guêpe"
 CAN_carrier_hull_light_4: "Classe Mistral"
 CAN_carrier_hull_light_0_desc: "Le Design Light Fleet Carrier de 1942, communément appelé British Light Fleet Carrier, était un porte-avions léger créé par la Royal Navy pendant la Seconde Guerre mondiale et utilisé par huit forces navales entre 1944 et 2001. Ils ont été conçus et construits par des chantiers navals civils pour servir d'étape intermédiaire entre les porte-avions de flotte de grande taille et coûteux et les porte-avions d'escorte moins chers mais à capacité limitée."
 CAN_carrier_hull_light_1_desc: "Au milieu des années 1960, les estimations royales canadiennes préconisaient un carénage majeur des transporteurs de classe Majestic/Colossus en service. Ce réaménagement serait cependant en proie à des dépassements de coûts et à des retards dus à des problèmes qui existaient depuis leur construction initiale. Il serait terminé à la fois en retard et au-dessus du budget initial."
 CAN_carrier_hull_light_2_desc: "La classe Invincible était une classe de porte-avions légers exploitée par la Royal Navy. Les navires ont été construits comme des plates-formes de guerre anti-sous-marine (ASW) capables de contrer la menace sous-marine soviétique de la guerre froide dans l'Atlantique Nord, et ont initialement embarqué des avions Sea Harrier et des hélicoptères anti-sous-marins Sea King HAS.1."
 CAN_carrier_hull_light_3_desc: "La classe Wasp est une classe de navires d'assaut amphibies à quai d'hélicoptère de débarquement (LHD) exploités par la marine américaine. Basé sur la classe Tarawa, avec des modifications pour exploiter des avions et des péniches de débarquement plus avancés."
 CAN_carrier_hull_light_4_desc: "Le projet de navire d'assaut amphibie était un projet proposé par le gouvernement canadien pour la Marine royale canadienne développé à partir du projet de navire de soutien interarmées, qui aurait vu le Canada se procurer 3 navires d'assaut amphibies de classe Mistral."

 CAN_carrier_hull_0: "Classe implacable"
 CAN_carrier_hull_1: "Classe audacieuse"
 CAN_carrier_hull_2: "Classe Forrestal"
 CAN_carrier_hull_3: "Refonte de classe audacieuse"
 CAN_carrier_hull_4: "Classe Reine Elizabeth"
 CAN_carrier_hull_0_desc: "Le porte-avions de classe Implacable était composé de deux porte-avions construits pour la Royal Navy pendant la Seconde Guerre mondiale. Dérivés de la conception de la classe Illustrious, ils étaient plus rapides et transportaient plus d'avions que les navires plus anciens. Ils furent initialement affectés à la Home Fleet une fois achevés en 1944 et attaquèrent des cibles en Norvège ainsi que le cuirassé allemand Tirpitz. Par la suite, ils furent affectés à la flotte britannique du Pacifique (BPF)."
 CAN_carrier_hull_1_desc: "Les porte-avions de classe Audacious étaient une classe de porte-avions proposée par le gouvernement britannique dans les années 1930 et 1940 et achevée après la Seconde Guerre mondiale. Les deux navires construits ont été fortement modifiés et ont divergé au cours de leur durée de vie."
 CAN_carrier_hull_2_desc: "Les porte-avions de classe Forrestal étaient quatre porte-avions conçus et construits pour la marine américaine dans les années 1950. Le navire de classe porte le nom de James Forrestal, le premier secrétaire à la Défense des États-Unis. Il s'agissait de la première classe de supercarriers, combinant un tonnage élevé, des ascenseurs au bord du pont et un pont incliné. Le premier navire a été mis en service en 1955, le dernier mis hors service en 1998."
 CAN_carrier_hull_3_desc: "Au fur et à mesure que les constructions de l'Audacious (renommé Eagle) et de l'Irresistible (renommé Ark Royal) progressaient, elles différaient tellement qu'elles devinrent effectivement les navires principaux (et uniques) de chacune de leurs propres classes. Ils constituaient l'épine dorsale de la flotte de porte-avions d'après-guerre et furent considérablement modifiés."
 CAN_carrier_hull_4_desc: "La classe Queen Elizabeth est une classe de deux porte-avions de la Royal Navy du Royaume-Uni qui sont les éléments centraux du UK Carrier Strike Group."

CAN_carrier_hull_super_1: "Classe Kitty Hawk"
CAN_carrier_hull_super_2: "Classe Nimitz"
CAN_carrier_hull_super_3: "Classe Théodore Roosevelt"
CAN_carrier_hull_super_4: "Classe Ronald Reagan"
CAN_carrier_hull_super_1_desc: "L'introduction de l'ère nucléaire et l'adoption de réacteurs navalisés plus petits permettent à ces grands navires non seulement de transporter de grandes ailes aériennes, mais également de rester en mer presque indéfiniment."
CAN_carrier_hull_super_2_desc: "Une conception de super porte-avions mise à jour avec des réacteurs plus efficaces et la capacité de transporter encore plus d'avions."
CAN_carrier_hull_super_3_desc: "Une conception avancée de super porte-avions de la fin de la Guerre froide, dotée d'un effectif massif d'avions et de réacteurs améliorés."
CAN_carrier_hull_super_4_desc: "Une conception de super porte-avions moderne avec des réacteurs encore améliorés, un effectif massif d'avions et la capacité de les lancer rapidement et efficacement en utilisant des catapultes améliorées."

# Submarine Hulls #

  CAN_sub_small_single_0: "Classe de tanche"
  CAN_sub_small_single_1: "Classe Obéron"
  CAN_sub_small_single_2: "Réaménagement de la SOUP de la classe Oberon"
  CAN_sub_small_single_3: "Classe Upholder/Victoria"
  CAN_sub_small_single_4: "Réaménagement du CWP de la classe Victoria"
  CAN_sub_small_single_0_desc: "Les sous-marins de classe Tench étaient un type de sous-marin construit pour la marine américaine (USN) entre 1944 et 1951. Ils constituaient une amélioration par rapport aux classes Gato et Balao, seulement environ 35 à 40 tonnes plus grandes, mais plus solidement construits et avec une disposition interne légèrement améliorée. Après la guerre, une classe Tench serait transférée au Canada pour remplacer le Balao qui était en service à l'époque."
  CAN_sub_small_single_1_desc: "La classe Oberon était une classe de navires composée de 27 sous-marins de conception britannique exploités par cinq nations différentes. Ils ont été conçus comme une suite directe de la classe Porpoise, les dimensions physiques étaient les mêmes, mais des matériaux plus solides ont été utilisés dans la construction de la coque et des équipements mis à jour ont été installés."
  CAN_sub_small_single_2_desc: "Dans les années 1970, les sous-marins canadiens de la classe Oberon étaient devenus obsolètes et avaient besoin d'être mis à jour. Le programme de mise à jour opérationnelle des sous-marins (SOUP) a été développé pour gérer la capacité opérationnelle des sous-marins, en mettant à jour son système de communication et de contrôle de tir, en modernisant son armement, ses sonars et ses périscopes."
  CAN_sub_small_single_3_desc: "Les sous-marins de la classe Upholder/Victoria, également connus sous le nom de Type 2400 (en raison de leur déplacement de 2 400 tonnes), sont la classe de sous-marins diesel-électriques construits au Royaume-Uni dans les années 1980 pour compléter les sous-marins nucléaires utilisés dans le service sous-marin de la Royal Navy britannique."
  CAN_sub_small_single_4_desc: "Lors de l'acquisition des sous-marins de classe Upholder/Victoria, la Marine royale canadienne a suggéré que les sous-marins seraient opérationnels d'ici l'an 2000. Chaque sous-marin subirait une période de travail canadienne (CWP) de 6 mois, au cours de laquelle des systèmes de communication et de contrôle de tir canadiens seraient installés."

  CAN_sub_hull_large_single_0: "Classe Balao"
  CAN_sub_hull_large_single_1: "Classe vaillante"
  CAN_sub_hull_large_single_2: "Classe Churchill"
  CAN_sub_hull_large_single_3: "Classe Rubis"
  CAN_sub_hull_large_single_4: "Classe Canada"
  CAN_sub_hull_large_single_0_desc: "La classe Balao était une conception de sous-marins de la marine américaine utilisée pendant la Seconde Guerre mondiale et au-delà. Une amélioration par rapport à la classe Gato précédente, les bateaux ne présentaient que de légères différences internes. En 1961, le Canada acquerrait un sous-marin de classe Balao dans le cadre d'un bail de 5 ans auprès de la marine américaine, qui serait ensuite prolongé."
  CAN_sub_hull_large_single_1_desc: "La classe Valiant était une classe de sous-marins à propulsion nucléaire en service dans la Royal Navy du milieu des années 1960 jusqu'en 1994. Il s'agissait du premier sous-marin de la flotte nucléaire entièrement britannique ; l'ancien HMS Dreadnought utilisait un réacteur nucléaire américain."
  CAN_sub_hull_large_single_2_desc: "Les trois sous-marins de la classe Repeat Valiant, parfois connus sous le nom de classe Churchill, étaient des sous-marins à propulsion nucléaire qui ont servi dans la Royal Navy des années 1970 jusqu'au début des années 1990. La classe Churchill était basée sur l'ancienne classe Valiant, mais présentait de nombreuses améliorations internes."
  CAN_sub_hull_large_single_3_desc: "La classe Rubis est une série de sous-marins d'attaque à propulsion nucléaire exploités par la Marine nationale française. La classe comprend six navires et ce sont les sous-marins nucléaires d'attaque les plus compacts à ce jour. Ces sous-marins serviront plus tard d'option pour le sous-marin nucléaire de classe Canada proposé par le Canada, en concurrence avec la classe britannique Trafalgar."
  CAN_sub_hull_large_single_4_desc: "La classe Canada était une classe proposée de sous-marins d'attaque à propulsion nucléaire à construire pour la Marine royale canadienne. Annoncée en 1987, cette classe visait à fournir à la MRC une méthode de surveillance de l'Arctique et d'établir la souveraineté canadienne dans la région. En 1988, la MRC envisageait d'acheter soit la classe française Rubis, soit la classe britannique Trafalgar, toutes deux ayant leurs propres forces et inconvénients."

  CAN_sub_hull_large_double_0: "Classe Dreadnought"
  CAN_sub_hull_large_double_1: "Classe de résolution"
  CAN_sub_hull_large_double_2: "Réaménagement de la classe de résolution"
  CAN_sub_hull_large_double_3: "Classe Avant-garde"
  CAN_sub_hull_large_double_0_desc: "Le septième HMS Dreadnought fut le premier sous-marin à propulsion nucléaire du Royaume-Uni, construit par Vickers Armstrongs à Barrow-in-Furness. Lancé par la reine Elizabeth II le Trafalgar Day 1960 et mis en service dans la Royal Navy en avril 1963, il est resté en service jusqu'en 1980."
  CAN_sub_hull_large_double_1_desc: "La classe Résolution était une classe de quatre sous-marins nucléaires lance-missiles (SSBN) construits pour la Royal Navy dans le cadre du programme britannique Polaris. Chaque sous-marin était armé de 16 missiles nucléaires UGM-27 Polaris A-3."
  CAN_sub_hull_large_double_2_desc: "La classe Résolution était une classe de quatre sous-marins nucléaires lance-missiles (SSBN) construits pour la Royal Navy dans le cadre du programme britannique Polaris. Chaque sous-marin était armé de 16 missiles nucléaires UGM-27 Polaris A-3."
  CAN_sub_hull_large_double_3_desc: "La classe Vanguard est une classe de sous-marins nucléaires lance-missiles (SSBN) en service dans la Royal Navy. La classe a été introduite en 1994 dans le cadre du programme nucléaire Trident."

# Screen Hulls #

CAN_screen_hull_medium_0: "Classe rivière/prestonienne"
CAN_screen_hull_medium_1: "Classe St Laurent/Restigouche"
CAN_screen_hull_medium_2: "Réfection de la classe St Laurent/Restigouche"
CAN_screen_hull_medium_3: "Réfection DELEX Classe St Laurent/Restigouche"
CAN_screen_hull_medium_4: "Classe Halifax"
CAN_screen_hull_medium_0_desc: "La frégate de classe River était une classe de frégate lancée entre 1941 et 1944 pour être utilisée comme escorte anti-sous-marine dans les marines du Commonwealth. En service au Canada, ils escortaient principalement des convois à travers l'Atlantique. Après la guerre, nombre de ces navires furent modernisés et réaménagés, la superstructure étant reconstruite, son armement amélioré et modernisé, devenant ainsi la classe Prestonienne."
CAN_screen_hull_medium_1_desc: "Le destroyer de classe St Laurent était une classe de destroyers d'escorte qui servirait la Marine royale canadienne dans un rôle de mission ASW. À mesure que la construction et la conception de la classe St Laurent accusaient des retards, les navires restants de la classe seraient redésignés sous le nom de classe Restigouche, en tenant compte des améliorations de conception, s'écartant de plus en plus de la classe d'origine."
CAN_screen_hull_medium_2_desc: "L'avènement de nouveaux sous-marins d'attaque à propulsion nucléaire a forcé la MRC à évaluer les menaces qu'ils représentaient. Cela a conduit à des carénages des classes St Laurent et Restigouche. Les St Laurent seraient convertis en hélicoptères d'escorte de destroyers (DDH), tandis que la classe Restigouche subirait ses propres carénages (IRE) améliorant ses capacités anti-sous-marines, modernisant son sonar et un nouveau mât."
CAN_screen_hull_medium_3_desc: "Le projet DELEX (Destroyer Life Extension) était un programme visant à moderniser et à rénover les destroyers d'escorte canadiens existants. Pour la classe Restigouche et Mackenzie, cela signifiait mettre à jour leurs systèmes de capteurs, d'armes et de communications. Pour la classe St Laurent et Annapolis, cela signifiait un nouveau système de données tactiques, de nouveaux réseaux de sonars et de nouveaux radars et torpilles, avec seulement des réparations mineures de la coque et des machines pour les St Laurent."
CAN_screen_hull_medium_4_desc: "La frégate de patrouille de classe Halifax (City) était une frégate de patrouille polyvalente de classe pour la Marine royale canadienne en service depuis 1992. Conçus et construits au Canada, ces navires posséderaient des capacités anti-sous-marines traditionnelles avec des systèmes permettant également de faire face aux menaces de surface et aériennes."

CAN_screen_hull_heavy_0: "Réaménagement de la classe tribale"
CAN_screen_hull_heavy_1: "Classe de comté"
CAN_screen_hull_heavy_2: "Classe Iroquoise"
CAN_screen_hull_heavy_3: "Refit TRUMP de la classe Iroquois"
CAN_screen_hull_heavy_4: "Classe audacieuse de type 45"
CAN_screen_hull_heavy_0_desc: "Après la guerre, les survivants de cette classe connaîtront des destins différents, nombre d'entre eux étant réaménagés et modernisés principalement pour des destroyers anti-sous-marins. Les Tribales canadiens amélioreraient leurs capacités anti-aériennes, leurs capteurs et leurs armes anti-sous-marines permettant à ces navires de servir jusque dans les années 1960."
CAN_screen_hull_heavy_1_desc: "La classe County était une classe de destroyers lance-missiles britanniques, les premiers navires de guerre de ce type construits par la Royal Navy. Conçus spécifiquement autour du système de missile anti-aérien Seaslug, le rôle principal de ces navires était la défense aérienne de zone autour du groupe de travail du porte-avions dans un environnement de guerre nucléaire."
CAN_screen_hull_heavy_2_desc: "La classe Iroquois, ou classe DDG-280, était une classe de destroyers lance-missiles porte-hélicoptères de la Marine royale canadienne. La classe Iroquois est remarquable en tant que premier navire entièrement à turbine à gaz de ce type. Lancés dans les années 1970, ils étaient initialement équipés pour la guerre anti-sous-marine à l'aide d'hélicoptères CH-124 et de missiles anti-aériens Sea Sparrow pour la défense aérienne."
CAN_screen_hull_heavy_3_desc: "Dans les années 1980, avec l'arrivée prévue du projet de frégate de patrouille canadienne, les Forces canadiennes avaient l'intention de convertir la classe Iroquois de navires principalement ASW en navires de guerre anti-aérienne (AAW) comme élément central de la modernisation de la flotte. Baptisés Tribal Refit and Update Modernization Program (TRUMP), ces destroyers ont vu leurs turbines de croisière, leurs armes et leurs composants électroniques modernisés et réaménagés."
CAN_screen_hull_heavy_4_desc: "Le destroyer Type 45, également connu sous le nom de classe D ou Daring, est une classe de destroyers lance-missiles construits pour la Royal Navy du Royaume-Uni au début du 21e siècle. La classe est principalement conçue pour la guerre antiaérienne et antimissile et est construite autour du système de défense aérienne PAAMS (Sea Viper) utilisant le SAMPSON AESA et les radars longue portée S1850M."

CAN_battle_hull_light_0: "Classe Minotaure"
CAN_battle_hull_light_1: "Classe Tigre"
CAN_battle_hull_light_2: "Réaménagement de la classe Tigre"
CAN_battle_hull_light_3: "Vol I de classe Ticonderoga"
CAN_battle_hull_light_4: "Vol II de classe Ticonderoga"
CAN_battle_hull_light_0_desc: "La classe Minotaur, ou Design Z, était une classe proposée de croiseurs légers prévue pour la Royal Navy britannique peu après la Seconde Guerre mondiale. La conception Z avait plusieurs configurations proposées avec des dispositions d'armement et de propulsion différentes."
CAN_battle_hull_light_1_desc: "La classe Tigre était une classe de trois navires de guerre britanniques du XXe siècle et les derniers croiseurs entièrement canons de la Royal Navy. La construction des croiseurs de classe Minotaure a commencé pendant la Seconde Guerre mondiale, mais en raison de l'austérité d'après-guerre, de la guerre de Corée et de la préférence de Churchill pour les armes nucléaires et les avions par rapport à la flotte de surface, les coques sont restées inachevées."
CAN_battle_hull_light_2_desc: "En 1964, le gouvernement conservateur et la moitié de l'état-major de la marine considéraient que les Tigres n'étaient plus abordables ou crédibles dans le rôle de combat de surface ou de défense aérienne de la flotte et auraient préféré les mettre hors service, mais étant donné qu'ils n'avaient techniquement que trois ans et qu'ils avaient été construits à grands frais, les mettre au rebut était politiquement difficile. Ils ont approuvé la conversion en porte-hélicoptères ; transportant des hélicoptères Westland Wessex pour les opérations du Royal Marine Commando. Un grand hangar a remplacé la tourelle « Y », les tourelles avant ont été conservées pour l'appui-feu et le travail anti-surface."
CAN_battle_hull_light_3_desc: "La classe Ticonderoga de croiseurs lance-missiles est une classe de navires de guerre de la marine américaine, commandée et autorisée pour la première fois au cours de l'exercice 1978. La classe utilise un radar passif à réseau phasé et était initialement conçue comme une classe de destroyers. Cependant, la capacité de combat accrue offerte par le système de combat Aegis et le système radar AN/SPY-1, ainsi que la capacité de fonctionner comme un vaisseau amiral."
CAN_battle_hull_light_4_desc: "La classe Ticonderoga de croiseurs lance-missiles est une classe de navires de guerre de la marine américaine, commandée et autorisée pour la première fois au cours de l'exercice 1978. La classe utilise un radar passif à réseau phasé et était initialement conçue comme une classe de destroyers. Cependant, la capacité de combat accrue offerte par le système de combat Aegis et le système radar AN/SPY-1, ainsi que la capacité de fonctionner comme un vaisseau amiral."

