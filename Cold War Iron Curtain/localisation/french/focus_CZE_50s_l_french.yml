#News Events
 Purge_Gottwald.1.d:0 "Klement Gottwald, président de la Tchécoslovaquie et haut responsable du Parti communiste, a été purgé par le chef du parti, Rudolf Slansky. Bien que les deux hommes aient été de proches collaborateurs, depuis l'instauration du régime communiste dans le pays, ils auraient tous deux tenté de consolider leur pouvoir sur l'autre. En outre, la pression de Moscou s'est accrue pour que le parti purge les traîtres et les nationalistes qui portent atteinte au parti. Slansky a réussi à agir le premier : lors d'une récente réunion du Comité central, il a accusé Gottwald d'encourager le nationalisme, de traîner les pieds dans la mise en oeuvre de la nationalisation et de sympathiser avec les ennemis de la révolution. Gottwald n'a pas pu rallier de soutien et a été arrêté par la police. Dans son discours à la nation, Rudolf Slansky a annoncé qu'il avait sauvé le pays d'un traître et qu'il assumerait le rôle de président."
 #Klement Gottwald Purged
 #The Slansky Trials
 Czechoslovakia_Purge.1.d:0 "En réaction à la tentative inspirée de [CZE.GetRulingParty]d'imiter la purge des éléments déloyaux menée par Joseph Staline au début de son règne sur l'Union soviétique, [CZE.GetLeader] a jugé plusieurs membres du gouvernement pour avoir sympathisé avec [YUG.GetLeader], notamment son commandant en second et ami proche Rudolf Slansky. Slansky a été condamné à mort pour ses crimes, soutenu par une pétition signée par les habitants de [CZE.GetNameDef] pour l'exécuter pour ses prétendues voies de trahison."

#Country Events
 Czechoslovakia.1.d:0 "À Pilsen, un centre industriel de Tchécoslovaquie, les ouvriers d'usine, déjà mécontents de l'inflation et de la hausse des coûts des biens de consommation, ont réalisé que les nouvelles réformes monétaires du gouvernement avaient considérablement réduit leurs revenus. Cela a provoqué des émeutes qui ont rapidement englouti la ville et déclenché un soulèvement. Les manifestants ont pris pour cible les bâtiments du Parti, l'hôtel de ville et ont tenté de libérer les prisonniers pour qu'ils les rejoignent. Cependant, les manifestants étaient désorganisés et le gouvernement a envoyé des milliers de policiers et de soldats pour réprimer le soulèvement. Le soulèvement a duré trois jours et a donné lieu à des manifestations pacifiques dans tout le pays en soutien aux travailleurs. Après la fin du soulèvement, le gouvernement a annoncé qu'il éliminerait de ses rangs les communistes et les sociaux-démocrates faibles et qu'il atténuerait certaines des causes économiques. Moscou serait préoccupé par l'incapacité du gouvernement tchécoslovaque à contrôler rapidement le soulèvement et beaucoup en Tchécoslovaquie se demandent si le gouvernement peut véritablement unir le peuple du pays avec ses réformes communistes."
 Czechoslovakia_Purge.3.d:0 "Une série de procès-spectacles ont récemment eu lieu en Tchécoslovaquie, visant des militants politiques non communistes, des nationalistes, des catholiques et des dissidents communistes. Alors que le Parti communiste de Tchécoslovaquie (KSC) consolide son pouvoir, il doit affirmer sa domination sur un pays peu familier avec le régime d'un parti unique. Les accusés étaient accusés de complot en vue de renverser le gouvernement, d'affiliation à des agences de renseignement étrangères, de collaboration avec les nazis pendant la guerre et de corruption, entre autres accusations. Les personnes liées à des personnes ou à des groupes perçus comme anti-parti sont également exclues des emplois et des opportunités d'éducation. L'Union soviétique encouragerait ces procès et aurait félicité les dirigeants du KSC pour leur action proactive visant à déraciner les menaces qui pèsent sur le peuple tchécoslovaque."
 
 toufar.1.d:0 "Le 11 décembre 1949, troisième dimanche de l'Avent, les fidèles du village de Cihost rapportèrent un miracle : la croix de fer d'un demi-mètre de l'église locale s'était déplacée d'elle-même. Même si le prêtre Josef Toufar a affirmé qu'il n'avait pas vu ce prétendu miracle, ce doit être une ruse de sa part ! Nous pouvons laisser cela se faire, ou nous pouvons utiliser cet événement pour discréditer davantage l'Église catholique en persuadant une confession du prêtre !"    #The Toufar Miracle
 toufar.2.d:0 "Le prêtre Josef Toufar est resté résistant à nos techniques d'interrogatoire avancées, même s'il est notablement affaibli. Nous pouvons continuer notre interrogatoire, mais il y a une chance qu'il ne survive pas."
 toufar.3.d:0 "Le prêtre Josef Toufar est mort sous nos techniques d'interrogatoire avancées ! Nous n'avons pu extraire aucune information du prêtre traître."
 toufar.4.d:0 "Le prêtre Josef Toufar a fait preuve de résilience dans notre processus de persuasion. Cependant, Toufar a fini par céder, reconnaissant sa supercherie. Bien qu'il ait fallu des semaines d'interrogatoire avancé, il a admis avoir installé un petit dispositif mécanique qui allait de la chaire à la grande croix de fer pour faire bouger la croix afin de tromper les paroissiens. Nous l'avons amené à l'église pour filmer une reconstitution de sa supercherie, mais il est beaucoup trop faible après des semaines d'interrogatoire avancé. Nous l'avons remplacé par un autre prêtre pour quelques clichés. "
 toufar.5.d:0 "Le prêtre Josef Toufar a succombé aux blessures et à la malnutrition subies au cours de notre long interrogatoire. Son séjour prolongé à l'hôpital public de Prague s'est terminé tôt ce matin lorsque son corps a été transporté sous un faux nom. Heureusement, nous n'avons plus besoin de lui."

 CZE_The_Sovietization_of_Czechoslovakia:0 "La soviétisation de la Tchécoslovaquie"
 CZE_The_Sovietization_of_Czechoslovakia_desc:0 "Grâce à nos camarades de Moscou, nous avons pu nous libérer de l'ancien gouvernement faible et instaurer le socialisme. Tout cela ne serait pas possible sans nos amis de l'Union Soviétique. Nous leur montrerons que nous leur en serons éternellement reconnaissants en nous engageant pleinement en faveur du socialisme, tout comme c'est le cas en Union soviétique !"
 CZE_General_Secretary_Gottwald:0 "Secrétaire général Gottwald"
 CZE_General_Secretary_Gottwald_desc:0 "Notre cher secrétaire général Klement Gottwald était déjà une figure de premier plan avant de prendre la direction de la République tchécoslovaque. S'enfuyant à Moscou pendant la Seconde Guerre mondiale, il s'allia au gouvernement en exil pour unir les efforts partisans, ce qui contribua en retour à garantir l'influence communiste dans la Tchécoslovaquie d'après-guerre. Après la guerre et une sorte de coup d'État, Gottwald a pris le contrôle de la nation avec le soutien soviétique. Avec Gottwald aux commandes, qui sait ce qui attend la nation dans le futur ?"
 CZE_The_Twentieth_Congress_of_the_CPSU:0 "Le vingtième congrès du PCUS"
 CZE_The_Czechoslovak_Peoples_Army:0 "L'Armée populaire tchécoslovaque"
 CZE_The_Twentieth_Congress_of_the_CPSU_desc:0 "Le 20e Congrès du Parti communiste soviétique a lieu ! Le premier congrès depuis la mort subite de Gottwald. Après cela, il sera décidé qui succédera à Gottwald."
 CZE_The_Czechoslovak_Peoples_Army_desc:0 "L'Armée populaire tchécoslovaque est constituée de partisans et de soldats vétérans qui ont combattu en exil pendant la Seconde Guerre mondiale. Ils sont l'épine dorsale de nos forces armées et se consacrent à la propagation du socialisme !"
 CZE_Embrace_Socialist_Realism:0 "Adoptez le réalisme socialiste"
 CZE_Embrace_Socialist_Realism_desc:0 "Le réalisme socialisme a principalement pour thème l'idée de construire le socialisme et une société sans classes. En décrivant cette lutte, l'écrivain pouvait admettre ses imperfections, mais il était censé adopter une vision positive et optimiste de la société socialiste et garder à l'esprit sa pertinence historique plus large. Étant un élément central du mouvement socialiste, il a été décidé que nous adopterions le réalisme socialiste et commencerions à créer nous-mêmes une version !"
 CZE_Stalinist_Architecture:0 "Architecture stalinienne"
 CZE_Stalinist_Architecture_desc:0 "L'architecture stalinienne décrit l'expérimentation architecturale et le projet commandés par le camarade Staline dans toute l'Union soviétique. Il est souvent associé au réalisme socialiste, ce qui ne fait que nous donner une raison supplémentaire de commencer à utiliser ce style d'architecture et de l'utiliser dans tout le pays !"
 CZE_Rapid_Destalinization:0 "Déstalinisation rapide"
 CZE_Rapid_Destalinization_desc:0 "Maintenant que nous nous sommes débarrassés de Gottwald, la marionnette de Staline, nous pouvons commencer à nous débarrasser des monuments et des oeuvres d'art dédiés à la brute qu'était Staline."
 CZE_Rappoachment_with_Tito:0 "Rapprochement avec Tito"
 CZE_Rappoachment_with_Tito_desc:0 "Avec notre pays en déstalinisation, il a également été décidé que nous devions nous détourner de Moscou et rouvrir nos relations diplomatiques avec la Yougoslavie de Tito"
 CZE_End_the_Personality_Cult:0 "Mettre fin au culte de la personnalité"
 CZE_End_the_Personality_Cult_desc:0 "Sous la direction de Gottwald, il était largement admis que Staline était ce héros qui avait sauvé notre nation et aidé à nous libérer. Même si les Soviétiques nous ont aidé dans une certaine mesure à établir le socialisme en Tchécoslovaquie, cela ne veut pas dire qu'ils sont exonérés des crimes horribles qu'ils ont commis. C'est pourquoi le Culte de la Personnalité est aujourd'hui dissous."
 CZE_Secular_Values:0 "Valeurs laïques"
 CZE_Secular_Values_desc:0 "Le christianisme, aussi bon qu'il prétend être, ne fait que nous diviser. Tout comme la religion en général. C'est pourquoi nous commencerons à financer l'adaptation des valeurs laïques. Sans religion, nous ferons un pas de plus vers la véritable égalité !"
 CZE_Expand_the_Czech_Pioneers:0 "Développez les pionniers tchèques"
 CZE_Expand_the_Czech_Pioneers_desc:0 "L'organisation pionnière de l'Union de la jeunesse socialiste est notre version du Komsomol soviétique. Son objectif est d'enseigner le socialisme à la génération future tout en créant des camps d'été des pionniers où les enfants pourraient passer leur été ou acquérir des compétences précieuses pour plus tard dans la vie à travers toutes sortes d'activités différentes !"
 CZE_Expand_Ties_to_Israel:0 "Élargir les liens avec Israël"
 CZE_Expand_Ties_to_Israel_desc:0 "La Tchécoslovaquie, depuis sa création, entretient une étroite amitié avec Israël. Notre premier président est même devenu le premier homme d'État du kibboutz juif de Palestine en 1920. Nous poursuivrons cette politique d'amitié étroite maintenant que nous ne sommes plus contrôlés par les laquais de Staline"
 CZE_Increase_Worker_Control_of_Industry:0 "Accroître le contrôle des travailleurs sur l'industrie"
 CZE_Increase_Worker_Control_of_Industry_desc:0 "Comment pouvons-nous nous qualifier de socialistes si nous ignorons le travailleur et lui retirons le contrôle ? C'est pourquoi nous établirons des conseils d'entreprise pour superviser les différentes parties de l'industrie, en écoutant leurs propositions et leurs demandes afin de garantir le bon fonctionnement des usines."
 CZE_Reduce_Agricultural_Collectivization:0 "Réduire la collectivisation agricole"
 CZE_Reduce_Agricultural_Collectivization_desc:0 "La politique de collectivisation n'a jamais vraiment profité à personne, sauf à l'État, quoi qu'en prétende Gottwald. Retirer les terres des petites exploitations agricoles uniquement pour créer d'immenses fermes collectivisées était tout simplement inefficace. C'est pourquoi nous réduirons la collectivisation, en expérimentant différents types d'approche du problème."
 CZE_Begin_Trading_with_the_West:0 "Commencez à commercer avec l'Occident"
 CZE_Begin_Trading_with_the_West_desc:0 "Même si nous considérons l'Occident comme notre ennemi, nous ne pouvons pas commercer uniquement avec d'autres pays socialistes pour certaines matières premières dont nous avons besoin pour faire fonctionner nos industries. C'est pourquoi nous nous ouvrirons au commerce avec l'Occident pour obtenir ces matières premières dont nous avons désespérément besoin."
 CZE_Expand_Israeli_Arms_Sales:0 "Augmenter les ventes d'armes israéliennes"
 CZE_Expand_Israeli_Arms_Sales_desc:0 "Mon avocat et le Conseil de l'ONU m'ont conseillé de ne pas commenter ce Focus."
 CZE_Enforce_The_Ninth_of_May_Constitution:0 "Appliquer la Constitution du 9 mai"
 CZE_Enforce_The_Ninth_of_May_Constitution_desc:0 "C'est la Constitution du 9 mai qui nous a aidé à en arriver là. Grâce à cela, nous avons réussi à renverser l'ancien gouvernement faible et corrompu pour défendre l'ordre démocratique populaire. Et maintenant, nous avons constaté que c'était le moment idéal pour l'appliquer plus largement au sein du gouvernement et commencer à appliquer ses dispositions sur la nationalisation et les droits de l'homme."
 CZE_Increase_Censorship:0 "Augmenter la censure"
 CZE_Increase_Censorship_desc:0 "Alors que nous continuons à réformer notre nation pour en faire une véritable société socialiste, les ennemis de la Révolution utilisent la presse libre pour diffuser des mensonges et de fausses nouvelles à notre sujet. Pour retourner les gens contre nous et nous présenter comme les méchants. Cela ne continuera pas. Nous augmenterons la censure et le contrôle de ce qui est publié, en veillant à ce que les gens ne soient pas aveuglés par les traîtres à la Révolution !"
 CZE_Close_Religous_Organizations:0 "Fermer les organisations religieuses"
 CZE_Close_Religous_Organizations_desc:0 "Nous comprenons que les gens souhaitent croire en quelque chose. Pour aider quelqu'un à traverser des moments difficiles. Mais la religion provoque simplement plus de divisions et de chaos qu'elle n'aide notre société. C'est pourquoi nous commencerons à nous débarrasser de la religion dans son ensemble dans notre nation. À commencer par fermer les organisations religieuses."
 CZE_Silence_Toufar:0 "Silence Toufar"
 CZE_Silence_Toufar_desc:0 "Un prêtre local de la petite ville de Cihost affirme qu'un miracle se produit. Les habitants qui ont visité l'église ont déclaré aux responsables du StB que la croix de l'église locale avait commencé à se déplacer d'elle-même. C'est évidemment une sorte d'astuce pour essayer de convaincre les gens d'aller davantage à son église. Eh bien, nous ne resterons pas les bras croisés. Il sera arrêté et interrogé jusqu'à ce qu'il avoue."
 CZE_Promote_Socialist_Values:0 "Promouvoir les valeurs socialistes"
 CZE_Promote_Socialist_Values_desc:0 "Presque tout le monde connaît les valeurs religieuses, mais peu connaissent les nombreuses valeurs socialistes qui accompagnent le socialisme. C'est pourquoi nous financerons la promotion de ces valeurs socialistes !"
 CZE_Crackdown_on_Religion:0 "Répression de la religion"
 CZE_Crackdown_on_Religion_desc:0 "Il a été démontré à maintes reprises que la religion ne fait que diviser les gens et les pousse à se battre les uns contre les autres parce que l'un n'aime pas que l'autre croit en autre chose. C'est pourquoi nous réprimerons durement la religion. Les travailleurs n'ont pas besoin d'un être supérieur pour leur dire comment ils doivent agir et qu'ils doivent penser à leur communauté. Le socialisme le fait déjà et ils ne voient pas Gottwald devoir transformer l'eau en vin."
 CZE_Restrict_Property_Rights:0 "Restreindre les droits de propriété"
 CZE_Restrict_Property_Rights_desc:0 "Nous avons déjà commencé la collectivisation de la propriété agricole. Nous allons maintenant nous concentrer également sur la collectivisation d'autres biens. Entre nos mains, nous en ferons un bien meilleur usage que ce que ses anciens propriétaires auraient pu faire."
 CZE_Begin_The_First_Five_Year_Plan:0 "Commencer le premier plan quinquennal"
 CZE_Begin_The_First_Five_Year_Plan_desc:0 "En suivant le modèle soviétique, nous lancerons notre propre premier plan quinquennal pour commencer la mise en oeuvre de l'économie socialiste ! Nous nous concentrerons sur la nationalisation des industries et des banques clés, sans parler de l'écrasement des koulaks corrompus et avides !"
 CZE_Begin_Agricultural_Collectivization:0 "Commencer la collectivisation agricole"
 CZE_Begin_Agricultural_Collectivization_desc:0 "Prochaine étape de notre socialisation de notre économie, nous commencerons la collectivisation du secteur agricole comme en Union Soviétique !"
 CZE_Establish_the_JRD:0 "Créer le JRD"
 CZE_Establish_the_JRD_desc:0 "Pour nous aider à superviser les terres désormais collectivisées, nous créerons le JRD. JRD est essentiellement notre version du LPG est-allemand, une coopérative de production agricole en charge des fermes collectivisées du pays."
 CZE_Nationalize_Industry:0 "Nationaliser l'industrie"
 CZE_Nationalize_Industry_desc:0 "Comme tout bon pays socialiste, nous nous emparerons des moyens de production en nationalisant toute l'industrie privée. Grâce à cela, nous pourrons garantir une surveillance directe et garantir que nos travailleurs ne sont pas exploités à des fins lucratives."
 CZE_Nationalize_Banks:0 "Nationaliser les banques"
 CZE_Nationalize_Banks_desc:0 "Après avoir traité de l'industrie, il est temps de s'occuper des banques. Le coeur de la corruption et de la cupidité capitalistes. Eh bien, cela se termine maintenant dans notre merveilleux État socialiste. Les banques ne serviront pas l'avidité capitaliste, mais seulement les travailleurs et les travailleurs."
 CZE_Crush_the_Kulaks:0 "Écraser les koulaks"
 CZE_Crush_the_Kulaks_desc:0 "Tout comme les Soviétiques, nous avons nos propres koulaks avides qui se sont enrichis de souffrance et d'exploitation. Et tout comme les Soviétiques, nous nous occuperons rapidement de ces koulaks."
 CZE_Organize_the_IX_Rally_of_the_KSC:0 "Organiser le IX Rallye du KSC"
 CZE_Organize_the_IX_Rally_of_the_KSC_desc:0 "Il est temps d'organiser notre 9ème rassemblement KSC, celui-ci étant le premier où nous sommes réellement en charge de la nation. Lors de ce rassemblement, nous présenterons nos plans pour un avenir proche, en nous concentrant principalement sur la consolidation de notre position et sur l'élimination des derniers ennemis de la Révolution."
 CZE_Begin_the_Show_Trials:0 "Commencez les essais du spectacle"
 CZE_Begin_the_Show_Trials_desc:0 "Nous organiserons une série de procès-spectacles pour nous débarrasser des ennemis de classe et des nationalistes, ainsi que des anciens collaborateurs des nazis. Cela nous aidera à nous débarrasser des ennemis de l'État et à renforcer davantage notre domination dans la nation."
 CZE_Purge_International_Communists:0 "Purger les communistes internationaux"
 CZE_Purge_International_Communists_desc:0 "Même si nous apprécions l'empressement de certains de nos camarades qui veulent étendre la révolution socialiste au-delà des frontières, ce n'est tout simplement pas le cas avec notre ligne de parti établie par le camarade Gottwald. Nous allons donc malheureusement devoir nous en débarrasser."
 CZE_Liquidate_the_Opposing_Political_Parties:0 "Liquider les partis politiques adverses"
 CZE_Liquidate_the_Opposing_Political_Parties_desc:0 "Même si nous voulons que tout le monde soit camarade et se traite bien les uns les autres, on ne peut pas en dire autant de l'opposition. Composés de l'ancien gouvernement et des ennemis de la Révolution, nous ne pouvons pas les laisser essayer de nous empêcher de faire adopter nos lois et politiques socialistes. C'est pourquoi nous y mettons fin et déclarons un État à parti unique."
 CZE_Reform_the_Criminal_Code:0 "Réformer le Code criminel"
 CZE_Reform_the_Criminal_Code_desc:0 "Le Code pénal est vieux et dépassé, sans parler du tout adapté à notre cause socialiste. Nous sommes donc sûrs que cela ne dérangera personne si nous le réformons et ajoutons de nouvelles dispositions supplémentaires..."
 CZE_Crackdown_on_Rootless_Cosmopolitans:0 "Répression contre les cosmopolites sans racines"
 CZE_Crackdown_on_Rootless_Cosmopolitans_desc:0 "Les Cosmopolites sont la dernière menace à laquelle nous devons faire face. Après cela, la plupart des ennemis de la Révolution auront été éliminés et les rares qui restent seront trop faibles pour contester notre pouvoir. Nous pouvons désormais nous concentrer pleinement sur l'établissement d'une société socialiste."
 CZE_Establish_the_Presidium:0 "Créer le Présidium"
 CZE_Establish_the_Presidium_desc:0 "Tout comme l'Union Soviétique, nous devons créer un Présidium. Ce comité exécutif sera chargé de gérer les affaires et de diriger la nation au cas où le Secrétaire général ne serait pas en mesure de continuer à diriger la nation."
 CZE_Purge_Gottwald:0 "Purger Gottwald"
 CZE_Purge_Gottwald_desc:0 "Gottwald n'est tout simplement pas apte à exercer le rôle de secrétaire général. De plus en plus de voix au sein de notre propre parti s'opposent à sa politique et à la répression de ses soi-disant ennemis de classe et politiques. Nous devons écarter Gottwald du pouvoir et le remplacer par quelqu'un de plus réformiste et non fidèle à Moscou."
 CZE_Rehabilitate_Veterans_of_the_Spanish_Civil_War:0 "Réhabiliter les vétérans de la guerre civile espagnole"
 CZE_Rehabilitate_Veterans_of_the_Spanish_Civil_War_desc:0 "Pendant la guerre civile espagnole, de nombreux mouvements socialistes ont envoyé des brigades internationales pour aider la République espagnole à vaincre les fascistes soutenus par les pays de l'Axe. Même si nous avons combattu durement, nous n'avons malheureusement pas pu empêcher les fascistes de gagner, mais nous avons quand même réussi à acquérir une expérience précieuse grâce à cette bataille acharnée. De nombreux anciens combattants racontent des histoires glorieuses de batailles contre les fascistes. Et pourtant ces héros de la Révolution ont été expulsés et qualifiés de traîtres. Nous allons réhabiliter les anciens combattants et leur donner l'honneur qu'ils méritent !"
 CZE_Expand_Light_Industry:0 "Développer l'industrie légère"
 CZE_Expand_Light_Industry_desc:0 "L'industrie légère est le coeur de toute nation, qu'elle soit socialiste ou non. C'est le coeur battant qui produit les biens du quotidien des camarades, des grille-pain aux téléviseurs. L'industrie légère est toujours en demande et c'est pourquoi nous financerons son expansion dans notre pays."
 CZE_Emphasize_Infrastructure_Construction:0 "Mettre l'accent sur la construction d'infrastructures"
 CZE_Emphasize_Infrastructure_Construction_desc:0 "Les infrastructures sont une chose vitale pour les nations modernes. Sans routes, voies ferrées ou lignes électriques, nous ne serions pas en mesure de transporter des marchandises à un rythme rapide et d'utiliser la communication sur de longues distances. Sans compter que nous n'aurions pas d'eau courante dans nos maisons ou dans nos fermes. On peut dire sans risque de se tromper qu'en veillant à ce que l'infrastructure soit toujours à jour et en constante expansion, notre pays continuera de fonctionner comme une machine bien huilée."
 CZE_Improve_Living_Conditions:0 "Améliorer les conditions de vie"
 CZE_Improve_Living_Conditions_desc:0 "Les conditions de vie dans notre pays ne sont pas aussi bonnes qu'elles pourraient l'être actuellement, car nous utilisons toujours les lois et politiques sur les conditions de vie de l'ancienne administration. La vie de nos travailleurs est importante pour nous, donc pour nous assurer qu'ils continuent de prospérer, nous augmenterons le financement du bien-être social"
 CZE_The_Slansky_Trials:0 "Les procès Slansky"
 CZE_The_Slansky_Trials_desc:0 "Les procès Slansky ont lieu. Quatorze responsables du Parti, dont le premier secrétaire Rudolf Slansky, sont inculpés pour de hautes raisons et doivent être jugés et condamnés pour leurs crimes contre la Révolution."
 CZE_Crush_the_Pilsen_Uprising:0 "Écraser le soulèvement de Pilsen"
 CZE_Crush_the_Pilsen_Uprising_desc:0 "Terrible nouvelle ! Un soulèvement s'est produit à Pilsen, où des ennemis de classe ont tenté de renverser notre gouvernement et ont probablement été financés par l'Occident ! Heureusement, après quelques ennuis, la police et l'armée ont pu faire face à ce soulèvement et arrêter les instigateurs."
 CZE_Collectivize_Heavy_Industry:0 "Collectiviser l'industrie lourde"
 CZE_Collectivize_Heavy_Industry_desc:0 "Il est temps de collectiviser la dernière branche de l'industrie qui a jusqu'à présent été épargnée par la collectivisation. L'industrie de l'armement lourd, qui produit toutes les armes de nos forces armées socialistes, doit être intégrée dans notre secteur de l'industrie nationalisée."
 CZE_Novotny_Consolidates_Power:0 "Novotny consolide son pouvoir"
 CZE_Novotny_Consolidates_Power_desc:0 "Alexandre Novontny, l'un des membres les plus fiables du Parti et le successeur choisi de Gottwald. Tout comme Gottwald, il est un partisan de la ligne dure stalinienne. Après avoir remporté la lutte contre leurs adversaires, les Tchécoslovaques peuvent être assurés que l'héritage de Gottwald est désormais entre de bonnes mains."
 CZE_Encourage_Urbanization:0 "Encourager l'urbanisation"
 CZE_Encourage_Urbanization_desc:0 "Un trop grand nombre de nos concitoyens vivent encore dans des maisons exiguës dans leurs villes, parce que la ville ne s'agrandit pas suffisamment pour accueillir toutes les familles. Cela ne tiendra pas. En détournant les fonds du budget, nous encouragerons l'urbanisation, permettant ainsi aux villes socialistes de se développer et aux familles d'avoir leur propre chez-soi !"
 CZE_The_Czechoslovakian_Air_Force:0 "L'armée de l'air tchécoslovaque"
 CZE_The_Czechoslovakian_Air_Force_desc:0 "Depuis la Seconde Guerre mondiale, notre Force aérienne est le joyau de notre nation. Là où de nombreuses nations prétendent être les maîtres de la mer, nos avions étaient les maîtres du ciel, ayant mené de nombreuses batailles en exil, contribuant ainsi à protéger les îles britanniques des chasseurs et bombardiers allemands."
 CZE_Expand_the_Air_Defense_Network:0 "Élargir le réseau de défense aérienne"
 CZE_Expand_the_Air_Defense_Network_desc:0 "Même si les bombardiers allemands et alliés ne survolent plus nos têtes, la peur d'une Troisième Guerre mondiale est toujours présente. C'est pourquoi il est crucial que cette fois nous soyons prêts. En élargissant le réseau de défense aérienne, nous sauverons probablement de nombreuses vies à l'avenir."
 CZE_Purge_KSC_Membership:0 "Supprimer l'adhésion au KSC"
 CZE_Purge_KSC_Membership_desc:0 "Le procès Slansky nous a montré combien il existe encore de traîtres. Le seul aspect choquant, c'est que ces traîtres se trouvent tous au sein de notre propre Parti. Cela ne peut tout simplement pas tenir. Pour protéger le secrétaire général de toute éventuelle tentative de coup d'État, les membres du KSC seront examinés. Ceux qui sont jugés suspects doivent être purgés du Parti et voir leur adhésion révoquée."
 CZE_General_Secretary_Novotny:0 "Secrétaire général Novotny"
 CZE_General_Secretary_Novotny_desc:0 "Novotny est l'un des rares en qui Gottwald a confiance et le félicite même souvent comme son successeur choisi. La santé de Gottwald se détériorant de plus en plus ces derniers temps, il est peut-être temps de lui demander de se retirer et de laisser Novotny prendre le contrôle."
 CZE_Expand_the_Prison_Labor_Camps:0 "Agrandir les camps de travaux forcés"
 CZE_Expand_the_Prison_Labor_Camps_desc:0 "Les camps de travail du Goulag soviétique figurent depuis longtemps sur la liste de Novotny, les trouvant parfaits pour traiter l'opposition et les criminels reconnus coupables. Même s'il est reconnu coupable, Novotny croit à la rédemption. Au lieu d'être exécutés, ces prisonniers effectueront simplement un dur labeur pour se racheter."
 CZE_Increase_Workers_Quotas:0 "Augmenter les quotas de travailleurs"
 CZE_Increase_Workers_Quotas_desc:0 "Nous savons que nos ouvriers travaillent dur, mais il semble que beaucoup préfèrent encore être paresseux et travailler lentement, bavardant au lieu de travailler et ralentissant toute la production. Motiver ces travailleurs à se dépasser et à travailler plus dur pour la Révolution en augmentant les quotas de travailleurs."
 CZE_Limit_Higher_Education_to_KSC_Members:0 "Limiter l'enseignement supérieur aux membres du KSC"
 CZE_Limit_Higher_Education_to_KSC_Members_desc:0 "Bien sûr, nous voulons que nos enfants soient aussi éduqués que possible, mais nous voulons également nous assurer que les enfants que nous donnons à cette éducation avancée ne sont pas non plus les enfants de parents corrompus et anti-révolutionnaires. Ainsi, nous n'autoriserons l'enseignement supérieur qu'aux enfants des membres du KSC."
 CZE_The_Armory_of_the_Communist_World:0 "L'armurerie du monde communiste"
 CZE_The_Armory_of_the_Communist_World_desc:0 "La Révolution risque toujours d'être renversée par les Occidentaux corrompus. Envahir et massacrer les travailleurs uniquement pour imposer leurs idées d'occupation et capitalistes à notre société. Nous devons toujours être prêts à protéger nos valeurs socialistes. Mais nous ne pouvons y parvenir sans des armes appropriées pour nous défendre. La seule solution logique étant d'augmenter la production d'armes pour le bien du socialisme !"
 CZE_Import_Lavochkin_La_9s:0 "Importer Lavochkin La 9s"
 CZE_Import_Lavochkin_La_9s_desc:0 "Aussi fiers que nous soyons de notre Force aérienne, le fait est que la plupart de nos avions disponibles datent d'avant ou de la Seconde Guerre mondiale. Heureusement, nos camarades soviétiques sont plus que disposés à nous donner un coup de main et à épargner certains de leurs propres avions pour moderniser notre Force aérienne !"
 CZE_Purchase_MiG_15s:0 "Achetez des MiG 15"
 CZE_Purchase_MiG_15s_desc:0 "Même avec les avions soviétiques, nous avons encore besoin de plus d'avions pour moderniser notre force aérienne. Heureusement, le reste du bloc de l'Est est également plus que disposé à nous vendre certains de ses avions !"
 CZE_Embrace_Soviet_Air_Doctrine:0 "Adoptez la doctrine aérienne soviétique"
 CZE_Embrace_Soviet_Air_Doctrine_desc:0 "Pour finaliser nos réformes, nous adopterons la doctrine aérienne soviétique. Comme ils ont le plus d'expérience de la Seconde Guerre mondiale, nous pourrions apprendre une ou deux choses."
 CZE_Suppress_Liberal_Tendencies:0 "Supprimer les tendances libérales"
 CZE_Suppress_Liberal_Tendencies_desc:0 "Même si nous essayons, il semble que peu importe ce que nous faisons, il y a toujours une sorte de mouvement clandestin contre-révolutionnaire qui tente de répandre la propagande occidentale dans notre pays et de convaincre le peuple de ses mensonges. Nous ne pouvons pas laisser nos camarades se laisser attirer par de fausses promesses et nous réprimerons durement ces tendances libérales anti-révolutionnaires !"
 CZE_Increase_Tarrifs:0 "Augmenter les tarifs"
 CZE_Increase_Tarrifs_desc:0 "Nos produits sont issus du meilleur travail, fabriqués pour durer des années et fonctionnent parfaitement. Et pourtant, ils sont vendus pour quelques centimes. Nos lois sur l'importation et l'exportation sont tout simplement trop dépassées. La seule solution que nous jugeons appropriée est d'augmenter les tarifs de nos marchandises."
 CZE_Czechoslovakian_Ground_Forces:0 "Forces terrestres tchécoslovaques"
 CZE_Czechoslovakian_Ground_Forces_desc:0 "L'Armée populaire tchécoslovaque, plus communément appelée, est composée d'anciens combattants communistes qui ont travaillé soit avec les Soviétiques, soit avec l'ancien gouvernement en exil pendant la Seconde Guerre mondiale. C'est notre partie la plus vitale des forces armées, protégeant la Révolution chez nous de tout leur coeur et de leur âme."
 CZE_Domestic_Mechanized_Production:0 "Production mécanisée nationale"
 CZE_Domestic_Mechanized_Production_desc:0 "Beaucoup de choses ont changé depuis la guerre, les soldats étant lentement remplacés par des véhicules et des chars comme principales forces de combat. Nous commencerons bien sûr à nous adapter à cela en lançant notre propre production nationale de véhicules mécanisés et en finançant la recherche pour les moderniser."
 CZE_Soviet_T55_Tanks:0 "Chars soviétiques T55"
 CZE_Soviet_T55_Tanks_desc:0 "Pour commencer à moderniser nos forces armées, nous achèterons des T-55 dans tout le bloc de l'Est. Voyons comment l'Occident avance vers Prague si une armée de chars soviétiques les attend avec des barils pointés sur eux !"
 CZE_Copy_Soviet_Designs:0 "Copier les dessins soviétiques"
 CZE_Copy_Soviet_Designs_desc:0 "Certains prétendent que l'ingénierie allemande est la meilleure au monde. Même si cela peut être vrai dans certains cas, nous préférons utiliser des modèles soviétiques qui se sont révélés généralement fiables. Malheureusement, nous ne pouvons pas exactement demander aux Soviétiques s'ils peuvent partager leurs plans, nous allons donc simplement les copier à partir de l'équipement soviétique qui nous a déjà été envoyé par les Soviétiques."
 CZE_Weapon_Production_Investment:0 "Investissement dans la production d'armes"
 CZE_Weapon_Production_Investment_desc:0 "Bien sûr, nous pouvons rechercher et réformer notre conception et acheter du matériel. Mais nous ne pouvons pas continuer à acheter du matériel à nos alliés. Non, au lieu de cela, nous prenons cet argent et investissons dans la production de nos propres armes !"
 CZE_The_National_Security_Corps:0 "Le corps de sécurité nationale"
 CZE_The_National_Security_Corps_desc:0 "Le Corps de sécurité nationale, en abrégé NSB, a été créé le 17 avril 1945 pour remplacer la police et les Genderarmes traditionnelles. Le NSB a joué un rôle crucial dans l'opération qui nous a aidé à renverser l'ancien gouvernement, grâce au fait que nous étions aux commandes depuis sa création, le remplissant lentement de sympathisants communistes. Le jour de la prise de contrôle, grâce à ces efforts, le NSB a assuré une prise de contrôle facile du gouvernement."
 CZE_Soviet_Advisors:0 "Conseillers soviétiques"
 CZE_Soviet_Advisors_desc:0 "Afin d'acquérir plus d'expérience pour le NSB, nous avons décidé d'inviter des conseillers et des experts soviétiques pour nous aider à améliorer nos forces du NSB et les aider à s'adapter aux méthodes modernes."
 CZE_Finalize_the_Purge_of_Non_Communist_Officers:0 "Finaliser la purge des officiers non communistes"
 CZE_Finalize_the_Purge_of_Non_Communist_Officers_desc:0 "Même au sein du NSB, il y a encore des dirigeants et des membres qui y ont été affectés par l'ancien gouvernement. Ceux qui s'adaptent au socialisme peuvent rester mais les autres devront être mis à la retraite et évincés."
 CZE_Empower_the_StB:0 "Donner du pouvoir au StB"
 CZE_Empower_the_StB_desc:0 "Le StB est notre version du NKVD soviétique. Il s'agit d'une politique secrète dont le but est d'éliminer les menaces potentielles et de protéger la Révolution de toute menace. Les conseillers que nous avons invités de l'Union Soviétique nous ont dit que cela améliorerait considérablement le NSB en général si nous donnions plus de moyens au StB et lui donnions plus de financement. Nous ne pouvons pas contester cela. Ce sont eux les experts après tout !"
 CZE_Border_Fortifications:0 "Fortifications frontalières"
 CZE_Border_Fortifications_desc:0 "Les fortifications frontalières ont dans le passé joué un rôle important dans l'histoire de notre nation. La seule différence est qu'il n'y a plus de génocidaires de l'autre côté de la frontière qui veulent nous envahir avec leurs tanks. Au lieu de cela, des entreprises capitalistes qui souhaitent exploiter nos travailleurs à leur profit. Même si nous pensons n'avoir rien à craindre, il vaudrait quand même mieux renforcer les frontières au cas où l'Occident voudrait tenter quelque chose."
 CZE_Establish_The_University_of_Pardubice:0 "Créer l'Université de Pardubice"
 CZE_Establish_The_University_of_Pardubice_desc:0 "Au lendemain de la Seconde Guerre mondiale, les usines chimiques de la ville ont demandé la création d'une université spécialisée à proximité. L'université a été créée sous le nom de Vysoká skola chemická (Institut de chimie) en 1950, rebaptisée Vysoká skola chemicko-technologická (Institut de technologie chimique) en 1954."
 CZE_Rapid_Industrialization:0 "Industrialisation rapide"
 CZE_Rapid_Industrialization_desc:0 "Plus nous développons notre industrie, plus nous nous industrialisons. Mais cela ne suffit tout simplement pas. Avec la lenteur avec laquelle nous progressons, cela pourrait nous prendre des années, voire des décennies, pour réellement nous industrialiser. Ainsi, nous favoriserons une industrialisation rapide, sans nous arrêter jusqu'à ce que notre puissance industrielle explose !"
 CZE_Metallurgy_Investments:0 "Investissements métallurgiques"
 CZE_Metallurgy_Investments_desc:0 "Notre pays est riche en gisements minéraux, et pourtant nous ne pouvons pas faire grand-chose avec ces trésors souterrains car nous ne disposons pas de suffisamment d'usines de transformation des métaux. Pour étendre notre puissance industrielle dans le cadre de notre industrialisation, nous construirons deux nouvelles usines de traitement métallurgique !"
 CZE_Expand_Weapon_Production:0 "Développer la production d'armes"
 CZE_Expand_Weapon_Production_desc:0 "Comme le dit le proverbe, on ne peut pas avoir trop d'armes. Nous continuerons donc à construire des usines et à fabriquer plus d'armes !"
 CZE_Expand_the_Mining_Industry:0 "Développer l'industrie minière"
 CZE_Expand_the_Mining_Industry_desc:0 "Des explorations récentes ont découvert qu'il existe un énorme gisement minéral situé dans tout le pays. Nous avons essentiellement découvert une mine d'or et tout ce que nous avons à faire est de développer l'industrie minière et de creuser pour trouver ce trésor caché !"
 CZE_COMECON_Aid:0 "Aide du COMÉCON"
 CZE_COMECON_Aid_desc:0 "Après avoir rejeté le Plan Marshall, nous avons maintenant obtenu l'aide du COMECON de l'Union Soviétique pour nous aider à nous remettre de la destruction de l'industrie pendant la Seconde Guerre mondiale."
 CZE_Uranium_Mining:0 "Extraction d'uranium"
 CZE_Uranium_Mining_desc:0 "Découvert déjà pendant la Tchécoslovaquie d'avant-guerre, il a été révélé que notre pays dispose d'une vaste réserve d'uranium dans tout le sous-sol du pays. Et maintenant que nous savons que cela peut être utilisé pour créer des armes de destruction massive ou des réacteurs nucléaires, nous serons plus qu'heureux de commencer à l'exploiter !"
 CZE_Monetary_Reform:0 "Réforme monétaire"
 CZE_Monetary_Reform_desc:0 "Notre pays souffre depuis un certain temps déjà d'une forte inflation, depuis la fin de la guerre. Et comme l'ancien gouvernement n'a pas envisagé de résoudre le problème parce qu'il était trop occupé à se battre, il nous incombe maintenant de résoudre ce problème. Heureusement, avec nous aux commandes et sans réelle opposition, nous pouvons facilement adopter une réforme monétaire qui devrait remédier à l'inflation en quelques semaines !"
 CZE_Establish_State_Control_Over_Education:0 "Établir le contrôle de l'État sur l'éducation"
 CZE_Establish_State_Control_Over_Education_desc:0 "Les enfants sont l'avenir, c'est évident. Mais comment pouvons-nous leur garantir un avenir socialiste si on ne leur enseigne pas suffisamment le socialisme et les valeurs socialistes à l'école ? En établissant un contrôle étatique sur lesdites écoles évidemment !"
 CZE_Completion_of_the_First_Five_Year_Plan:0 "Achèvement du premier plan quinquennal"
 CZE_Completion_of_the_First_Five_Year_Plan_desc:0 "Nous avons enfin réussi à réaliser notre premier plan quinquennal ! Notre industrie et notre économie atteignent déjà de nouveaux sommets et cela ne va pas s'arrêter de si tôt ! Un jour, nous pourrions même dépasser l'Occident !"
 CZE_Empower_Workers_Councils:0 "Autonomiser les conseils d'entreprise"
 CZE_Empower_Workers_Councils_desc:0 "Un aspect important que Gottwald a ignoré est que l'État ne peut pas voir beaucoup de choses. En créant des conseils ouvriers pour nous aider à contrôler les souhaits et les demandes des travailleurs, cela facilitera le travail du Burecrat et nous aurons le temps de nous concentrer sur d'autres questions importantes."
 CZE_Reduce_Quotas:0 "Réduire les quotas"
 CZE_Reduce_Quotas_desc:0 "Le système consistant à avoir certains quotas qui doivent être atteints par jour ou par mois n'est tout simplement pas efficace. Cela stresse les travailleurs et les pousse chaque jour à atteindre, voire au-delà, leurs limites, ce qui n'est pas du tout sain. Nous abolirons les quotas, donnant ainsi aux travailleurs un repos bien mérité."
 CZE_Reduce_Soviet_Dependence:0 "Réduire la dépendance soviétique"
 CZE_Reduce_Soviet_Dependence_desc:0 "Maintenant que Gottwald et le reste de ses amis staliniens sont partis, nous pouvons commencer à nous éloigner de la dépendance soviétique. Même si nous sommes reconnaissants de l'aide soviétique pour nous amener au pouvoir, la direction dans laquelle ils évoluent n'est pas la même que celle que nous souhaitons prendre. Ainsi, nous commencerons à les supprimer lentement jusqu'à ce que nous n'en soyons plus dépendants."
 CZE_Increase_Foriegn_Trade:0 "Augmenter le commerce extérieur"
 CZE_Increase_Foriegn_Trade_desc:0 "L'Occident, même s'il est en grande partie ennemi, dispose toujours d'un énorme marché qui n'attend que nous pour y vendre nos produits. Même si cela ne plaît pas aux Soviétiques, nous commencerons à nous ouvrir aux marchés occidentaux et non seulement à vendre mais aussi à acheter des matériaux en provenance de l'Occident."
 CZE_Industrialize_Slovakia:0 "Industrialiser la Slovaquie"
 CZE_Industrialize_Slovakia_desc:0 "Comme notre nom l'indique, nous sommes la Tchécoslovaquie. Parfois, nous oublions ou ignorons ce fait, laissant la partie slovaque de notre pays sans grande industrie. Mais en tant que société socialiste, nous sommes tous frères et soeurs en fin de compte. Il est donc tout à fait juste que nous industrialisions les Slovaques aussi bien que nous l'avons fait pour notre partie du pays."
 CZE_Prevent_Student_Protests:0 "Empêcher les manifestations étudiantes"
 CZE_Prevent_Student_Protests_desc:0 "Il est regrettable que les étudiants qui devraient être les intellectuels de notre société et montrer aux enfants à quel point ils devraient apprécier le socialisme que nous avons construit décident plutôt de protester et de lutter contre notre régime. Mais cela ne veut pas dire qu'ils ne peuvent pas être rachetés. Nous devons simplement leur apprendre à apprécier le socialisme et les empêcher d'organiser leurs manifestations. Non pas parce que nous voulons les réprimer, mais parce qu'ils ont été nourris de mensonges par l'Occident et que nous avons besoin de leur montrer la vérité !"
 CZE_Denounce_the_Hungarian_Revolution:0 "Dénonçons la révolution hongroise"
 CZE_Denounce_the_Hungarian_Revolution_desc:0 "C'est triste d'apprendre la nouvelle de la révolution hongroise. Comment ils ont essayé de détruire ce que les travailleurs ont construit dans le seul but d'adapter le modèle de socialisme radical peu orthodoxe utilisé en Yougoslavie. Et puis fuir en Yougoslavie après l'échec de leur petite tentative de révolution. Nous dénoncerons la Révolution et la Yougoslavie pour avoir donné refuge aux traîtres !"
 CZE_Stabilize_the_Collectives:0 "Stabiliser les collectifs"
 CZE_Stabilize_the_Collectives_desc:0 "Un problème de longue date avec nos collectifs est qu'ils ne sont pas organisés et manquent de connaissances pour fonctionner correctement. Pour enfin régler le problème et les faire fonctionner à nouveau, nous allons financer une réorganisation complète des collectifs !"
 CZE_Neo_Stalinism:0 "Néostalinisme"
 CZE_Neo_Stalinism_desc:0 "Les Soviétiques peuvent faire tout ce qu'ils veulent pour que la politique de notre grand camarade Staline soit paranoïaque et cruelle. L'Homme d'Acier nous a aidés à nous libérer de l'ancien gouvernement et à mettre en oeuvre le socialisme dans notre pays. Pendant que le reste du bloc de l'Est continue de se débarrasser du stalinisme, nous nous y tiendrons et même l'améliorerons !"
 CZE_Begin_Drafting_a_New_Constitution:0 "Commencer à rédiger une nouvelle Constitution"
 CZE_Begin_Drafting_a_New_Constitution_desc:0 "La Constitution du 9 mai a bien fonctionné pour nous, mais nous oublions qu'elle n'est pas parfaite car elle n'a pas été écrite par des socialistes et comporte des politiques imparfaites. Nous allons le réécrire pour inclure désormais le socialisme dans son noyau et pour améliorer les politiques défectueuses mentionnées ci-dessus."
 CZE_The_Czechoslovakian_Path_to_Socialism:0 "La voie tchécoslovaque vers le socialisme"
 CZE_The_Czechoslovakian_Path_to_Socialism_desc:0 "Ce fut un combat difficile, mais nous avons finalement corrigé bon nombre des erreurs de Gottwald et apporté une véritable prospérité à notre nation tout en restant fidèles aux valeurs socialistes. Ils ne sont peut-être pas orthodoxes, mais ils représentent la voie tchécoslovaque vers le socialisme !"
 CZE_The_Second_Five_Year_Plan:0 "Le deuxième plan quinquennal"
 CZE_The_Second_Five_Year_Plan_desc:0 "Le premier plan quinquennal étant aussi réussi qu'il l'a été, il est temps de reprendre en commençant le deuxième plan quinquennal qui se concentre sur l'expansion des opérations minières et l'industrialisation accrue de la Slovaquie !"
 CZE_Agricultural_Mechanization:0 "Mécanisation agricole"
 CZE_Agricultural_Mechanization_desc:0 "De nombreux agriculteurs de notre pays utilisent encore des méthodes agricoles dépassées, parfois même des chevaux et des charrues. Cela ne suffira tout simplement plus. Nous sommes au 20ème siècle, bon sang pour Lénine ! Donnez à ces agriculteurs du matériel approprié !"
 CZE_Expand_Construction_Metal_Production:0 "Développer la production de métaux de construction"
 CZE_Expand_Construction_Metal_Production_desc:0 "Nous avons réalisé certains progrès lorsque nous avons investi dans le traitement des métaux par le passé. Mais cela ne suffit tout simplement pas. Comme nous avons encore beaucoup de métal et pas assez de fonderies pour le traiter, nous devrons simplement construire encore plus de fonderies !"
 CZE_Petrochemical_Investments:0 "Investissements pétrochimiques"
 CZE_Petrochemical_Investments_desc:0 "L'industrie chimique est l'un des éléments essentiels de notre nation. Non seulement cela crée beaucoup d'emplois pour nos travailleurs, mais cela nous permet également de créer notre propre pétrole artificiel, ce qui nous permet de ne plus dépendre du pétrole occidental."
 CZE_Invest_in_Civil_Engineering:0 "Investir dans le génie civil"
 CZE_Invest_in_Civil_Engineering_desc:0 "Les ingénieurs civils ne sont pas seulement dans le socialisme, mais partout dans le monde, les véritables héros qui font avancer notre société en garantissant que si quelque chose est construit, il sera suffisamment stable pour y vivre ou y travailler et comment l'entretenir au mieux. Ce n'est jamais une bonne chose d'avoir suffisamment d'ingénieurs civils. Alors pourquoi ne pas investir pour en obtenir davantage ?"
 CZE_Expand_Slovakian_Steel_Production:0 "Développer la production d'acier slovaque"
 CZE_Expand_Slovakian_Steel_Production_desc:0 "Bien entendu, nous ne pouvons pas ignorer la part slovaque de notre production d'acier. Tout comme nous avons développé à plusieurs reprises notre propre secteur sidérurgique, nous développerons également le secteur slovaque pour équilibrer la production et garantir que les Slovaques n'auront pas à se rendre jusqu'en République tchèque pour traiter leur métal."
 CZE_Complete_the_Second_Five_Year_Plan:0 "Achever le deuxième plan quinquennal"
 CZE_Complete_the_Second_Five_Year_Plan_desc:0 "Enfin, nous avons achevé notre deuxième plan quinquennal, montrant une fois de plus une énorme croissance de notre économie. Notre PIB et notre budget mensuel continuent de croître et les travailleurs ont plus qu'assez de place de travail ! Cela n'aurait pas pu se passer mieux et a même abouti à une croissance économique pour la nation !"
 CZE_General_Secretary_Gustav_Husak:0 "Secrétaire général Gustav Husak"
 CZE_General_Secretary_Gustav_Husak_desc:0 "Gustav Husak, le seul secrétaire général d'origine slovaque, a réussi à accéder au pouvoir. Considéré par beaucoup comme un juste milieu entre les partisans de la ligne dure et les réformistes, il s'agit de l'option la plus sûre pour la nation. Même s'il a des projets qui ne plaisent pas aux partisans de la ligne dure, par exemple se débarrasser du culte de la personnalité et libéraliser le régime, ils ne sont pas aussi excessifs que l'auraient probablement fait les réformateurs et les antistaliniens."
 CZE_Liberalize_the_Regime:0 "Libéraliser le régime"
 CZE_Liberalize_the_Regime_desc:0 "Le régime a utilisé pendant trop longtemps des politiques de l'ère stalinienne qui sont carrément inhumaines et ne font que nous donner une mauvaise image aux yeux du monde. Pour commencer à corriger cette erreur, nous commencerons par libéraliser quelque peu notre nation et notre gouvernement."
 CZE_End_the_Personality_Cult2:0 "Mettre fin au culte de la personnalité"
 CZE_End_the_Personality_Cult2_desc:0 "Le culte de la personnalité qui s'est formé autour de Staline doit être supprimé. Même si nous sommes reconnaissants envers les Soviétiques de nous avoir aidés à nous libérer des fascistes et à établir le socialisme dans notre nation, cela ne signifie pas que nous pouvons simplement pardonner toutes les choses horribles que Staline a commises par paranoïa."
 CZE_Enact_Economic_Reforms:0 "Adopter des réformes économiques"
 CZE_Enact_Economic_Reforms_desc:0 "Le modèle économique que nous avons utilisé jusqu'à présent n'est tout simplement pas aussi efficace que nous le souhaiterions. Mais cela ne veut pas dire que nous devons tout abandonner complètement. Avec quelques réformes et corrections, le modèle économique socialiste pourrait exploiter tout son potentiel."
 CZE_Embrace_COMECON_Planning:0 "Adoptez la planification du COMECON"
 CZE_Embrace_COMECON_Planning_desc:0 "Le COMECON, une version socialiste du Plan Marshall, nous a aidé à développer notre industrie et notre économie pour les aider à se remettre des horreurs et des destructions de la Seconde Guerre mondiale. Nous continuerons d'en accepter humblement les avantages et continuerons de regarder notre économie s'améliorer de plus en plus."
 CZE_Moderate_Censorship:0 "Censure modérée"
 CZE_Moderate_Censorship_desc:0 "La censure est un thème brûlant au sein du Parti. Certains disent qu'il devrait être complètement aboli tandis que d'autres estiment qu'il devrait être appliqué aussi durement que possible. À notre avis, il devrait être maintenu, mais il pourrait être quelque peu assoupli. Les nombreux ennemis qu'il a été créé pour faire taire ont déjà été éradiqués, alors pourquoi ne pas assouplir un peu les règles et laisser les gens s'exprimer à nouveau un peu plus librement ?"
 CZE_Increase_Consumer_Goods_Production:0 "Augmenter la production de biens de consommation"
 CZE_Increase_Consumer_Goods_Production_desc:0 "L'économie que nous avons établie n'est pas seulement là pour réaliser des profits, mais elle est là principalement pour nourrir et soutenir nos camarades qui travaillent dur. Cela se fait généralement par le biais de biens de consommation que nous produisons dans les usines. Mais dernièrement, il semble que nous soyons à la traîne en matière de production de biens de consommation. C'est cependant un problème facilement réparable. Tout ce dont il a besoin, c'est d'un financement supplémentaire."
 CZE_Reform_the_Communes:0 "Réformer les communes"
 CZE_Reform_the_Communes_desc:0 "Les communes sont probablement l'une des rares choses que Gottwald a faites le mieux. Ils fonctionnent généralement bien et parviennent à contrôler le secteur agricole sans trop de problèmes. Mais il y a aussi parfois des ratés. C'est pour cela que nous sommes ici. Nous examinerons de près les domaines dans lesquels les communes ont des difficultés et réformerons ces zones afin qu'elles ne soient plus en difficulté."
 CZE_Increase_Urban_Housing:0 "Augmenter le logement urbain"
 CZE_Increase_Urban_Housing_desc:0 "Le logement est un besoin humain auquel il faut répondre. Un logement est nécessaire pour pouvoir retourner dans un endroit chaud après une longue journée. Ou pour fonder votre propre famille. C'est pourquoi nous allons lancer un énorme effort pour augmenter le logement dans tout le pays, pour garantir que chaque travailleur ait un logement où retourner après une longue journée de travail pour la Révolution !"

