 Indochina_Struggle_Ending.20.t: "La question indochine ne peut pas attendre éternellement"
 Indochina_Struggle_Ending.20.d: "La guerre d'Indochine a abouti à un règlement que tout le monde, sauf nous, semble vouloir signer. Cela fait maintenant deux mois que notre délégation attend les conditions et les parties sur le terrain n'attendent plus une réponse.\n\nNos ministres sont directs sur la suite des événements. Si nous ne finalisons pas nous-mêmes cette affaire dans le mois, le règlement sera conclu par nous-mêmes et le résultat nous sera présenté plutôt que consulté.\n\nLa décision nous appartient toujours. Ce ne sera pas pour très longtemps."
 Indochina_Struggle_Ending.20.a: "Alors nous ferions mieux de décider."

