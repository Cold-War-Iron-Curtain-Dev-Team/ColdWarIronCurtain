 AND.1_desc:0 "Son Excellence Ramon Iglesias i Navarri, qui a dirigé Andorre pendant la Seconde Guerre mondiale, a démissionné en raison de problèmes de santé. Ramon Malla Call est désormais notre nouveau co-prince. Nous nous souviendrons de notre ancien coprince, qui a contribué au développement du tourisme dans notre Principauté."
