 AND.1_desc:0 "Son Excellence Ramon Iglesias i Navarri, dirigeant de l’Andorre durant la Seconde Guerre mondiale, s’est retiré pour des raisons de santé. Ramon Malla Call lui succède comme coprince. Nous rendons hommage à notre ancien coprince, qui a joué un rôle clé dans le développement du tourisme en Andorre."