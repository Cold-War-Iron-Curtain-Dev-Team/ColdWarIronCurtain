# Events

DOM_EndDem_Constitutionalist_Civil_War.1.d: "Après une bataille épuisante pour Saint-Domingue, les forces rebelles ont brisé le blocus militaire et naval. Aujourd'hui, après l'avancée des rebelles constitutionnalistes dans les campagnes, la majorité des unités de l'armée se sont retirées sans aucune victoire en vue. Elias y Wessin, le commandant de l'armée, lui-même accompagné d'éminents généraux, ont été exilés à Miami. La plus grande partie de la frustration et de la colère qui ont alimenté la guerre civile dominicaine a débordé et s'est estompée. À partir de là, il est acquis d'avance que l'ancien président du peuple déchu, Juan Bosch, sera réintégré. Attendez-vous à une bonne dose de réformes et à des tribunaux militaires pour les commandants loyalistes qui n'ont pas fui."
DOM_EndDem_Loyalist_Civil_War.1.d: "Après une bataille épuisante pour Saint-Domingue, les forces rebelles n'ont pas pu briser le blocus militaire et naval. Avec l'entrée des forces de l'armée loyaliste au coeur de Saint-Domingue, de nombreux rebelles ont abandonné leurs fusils et sont retournés à leur vie privée. La plus grande partie de la frustration et de la colère qui ont alimenté la guerre civile dominicaine a débordé et s'est estompée. Depuis que les forces de la junte ont sécurisé le pays insulaire, le gouvernement militaire peut revenir à la normale. Juan Bosch et Caamano se sont exilés à Cuba dans l'attente soit d'un soulèvement populaire, soit d'élections libres."
DOM_El_Jefe.1.d: ""
DOM_HD_Clash.1.d: "Aujourd'hui, un bref échange de tirs a eu lieu entre les forces dominicaines et haïtiennes. On pense que les normes inférieures de formation des Haïtiens ont entraîné des pertes disproportionnées de leur côté. Lorsque l'artillerie fut réduite au silence après les courts répits de la nuit dernière, les forces dominicaines contrôlaient le champ de bataille. Espérons que cela dissuadera l'hostilité des deux nations."  
DOM_Execute_MT.1.d: "La rébellion de Tavarez a cité le renversement militaire de Juan Bosch comme cri de ralliement pour se rebeller contre le gouvernement. La protestation de Manolo Tavárez a commencé le 14 juin, mouvement révolutionnaire en 1961. La cellule a été capturée le 21 décembre 1963 et la junte a exécuté Manolo Tavárez Justo avec 28 camarades combattants de la liberté. La méthode choisie par le gouvernement était une mort rapide par peloton d'exécution. Le groupe s'est soulevé et a frappé des cibles locales dans les villages et communautés rurales de montagne de Las Manaclas et Las Delicias, de San José de Las Matas, une province de Santiago, le 28 novembre 1963. Manolo laisse dans le deuil les enfants de sa défunte épouse Mirabal (la même Mirabal qui a été battue et assassinée par Trujillo)."
DOM_Exile_MT.1.d: "La rébellion de Tavarez a cité le renversement militaire de Juan Bosch comme cri de ralliement pour se rebeller contre le gouvernement. La protestation de Manolo Tavárez a commencé le 14 juin, mouvement révolutionnaire en 1961. La cellule a été capturée le 21 décembre 1963 et la junte a exilé Manolo Tavárez Justo avec 28 camarades combattants de la liberté. Après avoir pesé leurs options, la méthode du peloton d'exécution n'a pas été utilisée. Le groupe s'est soulevé et a frappé des cibles locales dans les villages et communautés rurales de montagne de Las Manaclas et Las Delicias, de San José de Las Matas, une province de Santiago, le 28 novembre 1963. Manolo est exilé avec ses enfants de sa défunte épouse Mirabal (la même Mirabal qui a été battue et assassinée par Trujillo). Cette tournure des événements signifie une diminution de la répression de la part de la junte gouvernementale actuelle."
DOM_Exile_Balaguer.1.d: ""
DOM_Faction_Decision.1.d: ""
DOM_ConConvention.1.d: "À la mort de Trujillo en 1961, le document constitutionnel a été amendé dans une convention constitutionnelle pour prévoir de nouvelles élections libres et pour permettre le transfert du pouvoir à un Conseil d'État intérimaire jusqu'aux prochaines élections. Bien qu'elle ait été ratifiée comme un nouveau document réformiste, la constitution de 1962 était une continuation de la constitution de Trujillo du régime déchu. Le public y a vu une orientation politique méprisée."
DOM_60s_Triumvirate.1.d: ""
DOM_StartDem_Civil_War.1.d: "Dans la République dominicaine des années 1965, les forces démocratiques et antidémocratiques se dirigeaient vers une inévitable collision. La nouvelle junte nommait alors le président en son sein ; Donald Reid Cabral avait été installé grâce à un coup d'État militaire. Le résultat du renversement en 1963 du président légitimement élu du pays, Juan Bosch, a conduit à la formation d'un triumvirat militaire, et le pays a été secoué par une nuance d'hostilité. Reid Cabral était considéré par les forces populaires comme un président impopulaire. En 1965, un ralentissement économique de la croissance commerciale, associé à une pénurie d'eau historique à Saint-Domingue, avait retourné l'opinion publique contre le président de la junte. Les émeutiers ont déjà commencé à vider les armureries de la police. Plusieurs unités de l'armée ont fait défection et ont rejoint les révolutionnaires d'Avril."
DOM_SpawnDML_Civil_War.1.d: "Les forces du triumvirat loyaliste de la junte mènent la charge à Saint-Domingue pour briser la révolution populaire. Ils ont déjà commencé à bombarder la ville sans discernement. C'est notre chance de mettre en place le blocus de la capitale et d'étendre la révolution aux quatre coins de cette nation. Les constitutionnalistes ont libéré dix mille fusils de la ville et s'apprêtent à frapper les avant-postes loyalistes."
DOM_SpawnDMC_Civil_War.1.d: "Les forces rebelles constitutionnalistes sont dirigées par Caamano. Il tente de se lancer dans une attaque éclair dans les villages de l'arrière-pays. Le haut commandement d'Elias y Wessin a estimé que si les forces rebelles attaquaient à l'extérieur de la ville, le moral de l'armée dépasserait un point de non-retour. Dans sa tentative d'accroître l'influence internationale, Elias a dénoncé les rebelles comme étant communistes, dans l'espoir d'amener les États-Unis à intervenir à ses côtés. Les loyalistes disposent d'un bataillon de chars et d'une pléthore d'avions pour bombarder les positions rebelles à Saint-Domingue."
DOM_Judge_65_Remnant.1.d: ""
DOM_VF_Constitution_Assembly_Call.1.d: "Lors de son discours annuel au Malecón de Saint-Domingue, le président Viriato Fiallo a finalement décrété ce que le peuple attend depuis longtemps. La formation d'une Assemblée constitutionnelle dirigée par des membres du Congrès national et chargée de remplacer définitivement la Constitution de Trujillo de 1955, qui accordait des pouvoirs presque infinis à la présidence, dissipera enfin la colère et les craintes du public face à un gouvernement répressif dirigé par Fiallo. Bien qu'impopulaires, ces actions lui ont donné suffisamment de poids pour faire face à l'opposition politique de Bosch et à ses idées « socialistes ». Cela s'est avéré suffisamment satisfaisant pour l'établissement après au moins deux ans de négociations au sein de l'Union civique nationale sur la manière de créer l'Assemblée constitutionnelle et, après quelques changements juridiques, le Congrès, qui dispose d'une majorité politique de l'UNC, sera en avance sur le processus constitutionnel. Le chef du Parti révolutionnaire dominicain, Juan Bosch, a déjà exprimé ses inquiétudes quant à la transparence du processus et a appelé à la formation d'un comité spécial du Congrès pour superviser les amendements, tandis qu'il a appelé ses partisans à descendre dans la rue pour exiger l'égalité des droits, des réformes électorales, des freins et contrepoids, ainsi que la diminution du pouvoir politique insensé détenu par la présidence."
DOM_VF_Constitution_Assembly_Formed.1.d: "Sous la pression de la direction politique du NCU, l'Assemblée constitutionnelle a été formée. 6% des sièges sont occupés par des partisans fidèles du NCU tandis que seulement 4% sont occupés par des membres de l'opposition. Juan Bosch a appelé à un boycott effectif du processus, affirmant que l'Assemblée avait démarré trop vite et trop vite, sans garantir suffisamment de garanties pour l'ensemble du processus. Pourtant, le parti de Bosch, le PRD, a appelé à participer au processus, dans un contexte d'intérêt public pour voir comment ce processus se déroulera. Alors que Bosch s'est ouvertement opposé au processus et a décidé de ne pas y participer, certains membres internes du PRD ont décidé de superviser la situation. Le parti est dirigé par Antonio Guzman, un célèbre leader de l'opposition et ami proche de Juan Bosch, qui a grandi dans une famille aisée et a étudié à l'étranger. Il a fait valoir que, même si le processus peut sembler compromis par le manque de garanties, il est important que l'opposition politique participe au processus démocratique afin de poursuivre la paix et la normalisation des libertés constitutionnelles accordées après la mort du « Tyran » en 1961."
DOM_VF_1965C_Approved.1.d: "Le président Viriato Fiallo a participé à un événement extraordinaire dans les salles du Congrès national pour la signature de la nouvelle constitution. La nouvelle constitution a été révélée au public après des mois d'enquêtes privées et de débats au cours desquels peu d'informations ont été divulguées. Le PRD a constamment déclaré dans les médias son mécontentement à l'égard des résultats de la constitution et qu'il n'avait pas confiance dans les changements qui y étaient apportés. La constitution présentait les mêmes propositions de toujours, comme le maintien du Congrès bicaméral de Trujillo, le maintien de la plupart des pouvoirs détenus par la présidence et la réaffirmation du rôle de l'Église dans les affaires de l'État. L'un des ajouts positifs a été l'établissement de trois mandats consécutifs pour un président, qui dans le passé étaient un nombre illimité et, bien que certains droits aient été accordés et qu'il y ait eu quelques améliorations dans le système judiciaire ainsi que la séparation de certains pouvoirs militaires pour les donner aux autorités civiles, Bosch a déclaré que « la nouvelle Constitution n'est qu'une imitation de celle de Trujillo ». Les nouveaux articles prévoyaient la tenue d'élections d'ici 1966 et à la fin des mandats politiques précédents. Pour beaucoup, il s'agissait simplement d'un outil politique supplémentaire du NCU pour s'emparer de plus de pouvoir et a depuis été fortement condamné par l'opinion publique."
DOM_VF_1965C_Failed.1.d: "Fiallo a été battu au Congrès après avoir décidé d'opter pour une constitution plus libérale au lieu d'opter pour la proposition unie présentée par son parti. Cette défaite politique a eu un coût, car il n'a pas obtenu suffisamment de voix pour faire adopter la constitution. Il a réussi à aligner les membres libéraux du NCU, qui comprenaient des unionistes et de fermes anti-Trujillistes, mais n'a pas obtenu le soutien de l'ensemble de l'establishment politique de son parti. Le vote n'a abouti qu'à 46 voix contre les 34 en faveur du Congrès, n'obtenant pas les 6 % de voix requis pour l'approbation, soit 48 voix. Le public est indigné par cette perte de temps inutile. Au lieu de cela, la soi-disant « Assemblée constitutionnelle » a décidé d'approuver un « projet secondaire » dans les derniers jours qui réaffirmait la constitution de 1955 avec quelques changements mineurs dans les pouvoirs du président en augmentant ceux du Congrès national, car de nombreux membres du NCU ont considéré la trahison de Fiallo comme inacceptable pour le futur proche du parti et beaucoup ont élevé la voix pour son expulsion du parti, y compris son rival politique Francisco A. Lora. Bosch a déclaré : « Les chiens se battent pour les restes » tout en affirmant la position ferme du PRD sur la modification de la constitution et la réalisation des changements nécessaires pour une République Dominicaine plus démocratique."
DOM_VF_Independence_Day_Riots.1.d: "Lors du Jour de l'Indépendance de 1965, jour de joie et de défilés militaires habituels, le président Fiallo a été contraint de rester au Palais national au milieu des manifestations et des émeutes qui avaient éclaté plus tôt dans la matinée. Le public est furieux du rejet total des promesses faites à la fin des trois années de Trujillo et des réformes vagues et insuffisantes qui n'ont fait qu'engendrer un stress supplémentaire dans la psyché populaire. Juan Bosch a en outre appelé à une grève nationale et à des émeutes massives contre la présidence. Comptant d'immenses dégâts et un profond dégoût pour les élites traditionnelles, le président Fiallo, dans une tentative d'apaiser enfin le NCU, a décidé d'émettre un mandat d'arrêt contre Bosch pour « incitation » à la trahison et au chaos. Cependant, Bosch a trouvé refuge à l'ambassade américaine et a pu s'enfuir à Porto Rico peu de temps après. Les émeutes de février ont accru la paranoïa du NCU, qui a procédé à des arrestations, et leur popularité a diminué de façon exponentielle à mesure que des sentiments de changement flottent en République dominicaine."
DOM_VF_April_Revolution.1.d: "Des années après les élections de 1963, de nombreux Dominicains se sont retrouvés confrontés à la présidence de Viriato Fiallo. C'est un homme d'affaires qui, à l'époque de Trujillo, a acquis une grande richesse en s'agenouillant devant le dictateur et en étant un vassal fidèle de sa terreur. Aujourd'hui, il prétend être un leader démocrate avec de nouvelles intentions de progrès et de résolution définitive des problèmes de longue date de la nation. Cependant, après avoir appelé à une tentative ratée de véritables changements constitutionnels, l'opinion populaire s'est fortement tournée contre lui. En secret, Juan Bosch et Balaguer se sont rencontrés lors de leur exil à Porto Rico et se sont rapidement mis d'accord. Bien que politiquement non alignés, ils étaient tous deux favorables au démantèlement des successeurs manifestement antidémocratiques de Trujillo, le NCU, et sont finalement parvenus à la décision que la seule solution était le recours aux armes. Ils ont rejoint des factions et ont appelé les partisans de la vie militaire et politique dominicaine à s'unir pour trouver une solution. Ils décidèrent de former une nouvelle force d'officiers balagueristes et de jeunes officiers libéraux, se nommant eux-mêmes le Clan de San Cristobal et décidèrent d'initier un renversement violent du régime. Cependant, au petit matin du 24 avril, des agents militaires du gouvernement de Fiallo ont dévoilé le complot et ont rapidement alerté le général Wessin y Wessin et le président Fiallo de la trahison imminente. Mais il était trop tard pour les autorités puisque les reDOM étaient déjà armés et préparés. Le colonel Fernández Dominguez a attaqué le quartier général de la police nationale et l'armurerie de Saint-Domingue et a distribué des armes aux membres d'organisations de gauche, au PRD et à la population civile en général."
DOM_Fight_Congress.1.d: ""
DOM_Quota_Loss.1.d: "Le quota de sucre maintenu par les États-Unis et la République dominicaine a été annulé. En conséquence, les prix du sucre dominicain sont tombés à un plus bas historique. Les dirigeants de la République dominicaine cherchent à diversifier l'économie du pays. Actuellement, l'industrie est dominée par l'agriculture. Il est désormais temps d'accroître l'attrait de la beauté naturelle grâce au tourisme ou d'industrialiser le secteur de la vente au détail."
DOM_Outreach_Treaties.1.d: ""
DOM_Power_Struggle_In_The_DRP.1.d: ""
DOM_Bosch_Reinstated.1.d: "Aujourd'hui, l'homme dominicain du moment, Juan Bosch, revient d'exil dans la capitale : Saint-Domingue. Son plus grand partisan, Caamano, a ouvert la voie en battant les forces gouvernementales dans une victoire décisive. Il brise le blocus loyaliste et avance dans la campagne. À la demande générale du peuple dominicain, Juan Bosch atterrit aujourd'hui sur la base aérienne de San Isidro, récemment libérée. Il ne laissera pas les piliers pourris de l'État dominicain l'empêcher de sauvegarder les droits de tous les Dominicains. ¡Dios, Patria, Libertad!"
DOM_Mirabal.1.d: "Il y avait quatre soeurs Mirabel : Patria Mercedes Mirabal Reyes, Bélgica Adela Mirabal Reyes, Minerva Mirabal et María Teresa Mirabal. Trois de leurs maris ont célébré la rébellion contre Trujillo dans le cadre du Mouvement du 14 juin, surnommé 1J4. Minerva et María Teresa ont été emprisonnées avec leurs trois maris lorsque le mouvement a été découvert. Le 25 novembre 1960, Patria, Minerva, María Teresa et leur chauffeur, Rufino de la Cruz, furent arrêtés par des agents de Trujillo. Ils ont été étranglés individuellement et ont couru collectivement d'une montagne voisine pour cacher ces meurtres brutaux comme un accident de voiture. Personne n'a été dupe. Ces assassinats ont grandement inspiré d'autres personnes à s'opposer au régime de Trujillo. Leur contribution à la liberté de la République dominicaine n'a pas été oubliée."
DOM_Betancourt.1.d: "Le 24 juin 1960, le président vénézuélien Rómulo Betancourt est blessé lors d'une tentative d'assassinat à la voiture piégée ordonnée directement par le dictateur dominicain Rafael Leónidas Trujillo. Alors que les tentatives précédentes avaient été stoppées par les conseillers de Trujillo, cette tentative comportait l'explosion d'une voiture piégée juste au moment où passait l'automobile préliminaire de Betancourt. Betancourt lui-même a subi quelques brûlures mais a survécu. Son chef de la sécurité est décédé et son chauffeur a également brûlé. Cette entreprise d'assassinat a choqué le monde entier, tout comme la brutalité de Trujillo et sa volonté de cibler des chefs d'État opposés. En survivant, la réputation de Betancourt s'est considérablement accrue dans le monde entier tandis que Trujillo a été vilipendé dans la communauté mondiale."
DOM_Assassins.1.d: ""
DOM_Siege.1.d: ""
DOM_Election_1962.1.d: "Pour la première fois dans la longue histoire du pays, le peuple peut choisir directement le dirigeant de la République dominicaine lors d'une élection présidentielle générale. Le 7 décembre 1962, les premières élections libres du pays opposaient Juan Bosch, du Parti révolutionnaire dominicain social-démocrate, à Viriato Fiallo, de l'Union civique nationale. Fiallo bénéficie du soutien de l'ancienne colonne vertébrale centriste et conservatrice du régime déchu de Trujillo. Juan, cependant, tire sa base politique des roturiers libérés qui ont été irrités sous Trujillo. Sa promesse de réforme et sa résistance aux forces antidémocratiques et oligarchiques lui confèrent un avantage en termes de popularité."
DOM_Election_1966.1.d: "Après la guerre civile dominicaine, qui s'est calmée suite à l'intervention américaine, les élections suivantes ont eu lieu le 1er juin 1966. Les principaux candidats présentaient Juan Bosch, déchu et exilé, avec l'initié politique et ancien fonctionnaire, Joaquín Balaguer. Ayant pour programme la stabilité et la croissance économique du pays, il semble que le Parti réformiste de Balaguer va gagner."
DOM_Election_1968.1.d: ""
DOM_Election_1970.1.d: "Le 16 mai 1970, de nouvelles élections générales ont eu lieu. Le parti réformiste sortant de Joaquín Balaguer cherche à nouveau à balayer le terrain. Si Juan Bosch n'a pas participé aux élections, d'autres partis centristes et de droite locaux y ont participé. L'ancien commandant Elías Wessin y Wessin veut s'imposer comme leader conservateur. Francisco Augusto Lora s'est séparé de son compatriote démocrate chrétien Balaguer et a cherché à diriger le pays, promouvant un nouveau visage pour diriger la démocratie dominicaine."
DOM_Election_1978.1.d: "Le 16 mai 1978, des élections générales ont eu lieu en République dominicaine. Suite aux pressions diplomatiques de l'actuel président américain, les élections ont été certifiées libres et compétitives. En conséquence, elle a été contestée par tous les partis politiques, par rapport aux précédentes élections dominicaines. Cependant, les fidèles Balagueristes de l'armée tenteront probablement d'interrompre le décompte des voix et de commettre un coup d'État pour permettre à Balaguer de conserver la présidence. Il sera contraint de reculer en raison des protestations nationales et étrangères. Dans l'histoire, Guzmán a été autorisé à assumer la présidence, mais l'Autorité centrale électorale a redistribué les voix non exprimées de manière égale entre le PRD et le Parti réformiste, ce qui a minimisé la majorité potentielle du PRD au Congrès. Si Guzmán prête serment le 16 août, ce sera la première fois dans la longue histoire du pays qu'un gouvernement en exercice cède pacifiquement le pouvoir à un membre élu de l'opposition."
