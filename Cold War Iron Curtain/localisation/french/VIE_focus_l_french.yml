l_french:
 # === Phu Dai Army - 1950s ===

 PQC_The_Sino_French_Sima_Treaty: "Le traité Sima sino-français"
 PQC_The_Sino_French_Sima_Treaty_desc: "Le Traité Sima sino-français a été négocié entre le chef d'état-major du général nationaliste chinois Hoang Kiet et les forces coloniales françaises au Vietnam. Cet accord établit le processus d'évacuation des troupes nationalistes chinoises de Chine via le Vietnam, avec des groupes de 500 soldats remettant leurs armes aux autorités françaises à Haiphong avant d'être transportés vers l'île de Phu Quoc. Cependant, la forte condamnation de la République populaire de Chine a amené les Français à reconsidérer leur décision, laissant l'armée de Phu Dai internée sur l'île avec un sort incertain."

 PQC_Form_the_Phu_Dai_Army: "Former l'armée de Phu Dai"
 PQC_Form_the_Phu_Dai_Army_desc: "L'armée de Phu Dai étant désormais établie sur l'île de Phu Quoc, nous devons organiser ces troupes nationalistes chinoises en une force militaire appropriée. Ces soldats expérimentés, ayant combattu pendant la guerre civile chinoise, constitueront l'épine dorsale de nos capacités militaires. Nous créerons les divisions Sanjiao Jun, prêtes à défendre notre base insulaire et potentiellement à lancer des opérations contre le continent."

 PQC_Settle_VNQDD_Loyalists: "Installer les loyalistes du Viet-Quoc"
 PQC_Settle_VNQDD_Loyalists_desc: "Le Viet Nam Quoc Dan Dang (VNQDD), également connu sous le nom de Viet-Quoc, compte de nombreux fidèles qui partagent notre idéologie nationaliste. Nous installerons ces nationalistes vietnamiens à Phu Quoc, en les intégrant à l'armée de Phu Dai. Cela renforcera nos effectifs et créera une force unifiée engagée en faveur de l'indépendance vietnamienne et des Trois principes du peuple."

 PQC_Establish_the_Vietnamese_Restoration_Liberation_Army: "Création de l'Armée de libération de restauration vietnamienne"
 PQC_Establish_the_Vietnamese_Restoration_Liberation_Army_desc: "Nous créerons l'Armée vietnamienne de libération et de restauration, combinant les nationalistes vietnamiens et l'armée Phu Dai. Cette force aura pour mission de libérer le Vietnam de la domination coloniale française et du contrôle communiste. L'armée servira de bras militaire à notre mouvement nationaliste, prête à frapper dès que l'occasion se présentera."

 PQC_Permit_the_Formation_of_a_VNQDD_Republic: "Permettre la formation d'une République Viet-Quoc"
 PQC_Permit_the_Formation_of_a_VNQDD_Republic_desc: "Nous déclarerons officiellement Phu Quoc comme la République du Vietnam sous la direction du VNQDD. Cela établira notre légitimité en tant que gouvernement en exil et ralliera les nationalistes vietnamiens à notre cause. En adoptant les Trois principes du peuple, nous nous alignons sur l'idéologie nationaliste chinoise et créons une alternative claire au colonialisme et au communisme français."

 PQC_Collaborate_with_the_Colonial_Regime: "Collaborer avec le régime colonial français"
 PQC_Collaborate_with_the_Colonial_Regime_desc: "Plutôt que de nous opposer aux Français, nous chercherons à collaborer avec le régime colonial. En travaillant avec les Français, nous pouvons accéder aux armes, aux fournitures et à la formation. Cette approche pragmatique nous permettra de renforcer nos forces tout en maintenant une relation de travail avec les autorités coloniales, quitte à accepter temporairement la présence française."

 PQC_Colonizing_Phu_Quoc: "Coloniser Phu Quoc"
 PQC_Colonizing_Phu_Quoc_desc: "L'île de Phu Quoc est largement sous-exploitée, mais elle a un grand potentiel. Nous commencerons à coloniser et à développer l'île, en construisant des infrastructures et des installations industrielles. Cela transformera Phu Quoc d'un camp de réfugiés en une véritable base d'opérations, capable de soutenir notre population militaire et civile."

 PQC_Expand_the_Cay_Duong_Refugee_Camp: "Agrandir le camp de réfugiés de Cay Duong"
 PQC_Expand_the_Cay_Duong_Refugee_Camp_desc: "Le camp de réfugiés de Cay Duong est devenu un centre pour les réfugiés vietnamiens fuyant le continent. Nous allons agrandir considérablement ce camp, en créant davantage de logements et d'installations pour accueillir la population croissante. Cette expansion démontrera notre engagement à aider le peuple vietnamien et à renforcer nos liens avec le Sud-Vietnam."

 PQC_Abandon_Phu_Qouc: "Abandonner Phu Quoc"
 PQC_Abandon_Phu_Qouc_desc: "Après mûre réflexion, nous avons décidé que maintenir une présence sur Phu Quoc n'était plus viable. L'armée de Phu Dai sera ramenée à Taiwan, où elle sera réintégrée dans le Corps des Marines de la République de Chine. Nous abandonnerons l'île et rendrons le contrôle au Sud-Vietnam, mettant ainsi fin à notre expérience de nationalisme insulaire."

 PQC_Contact_Kuomintang_Leadership: "Contacter la direction du Kuomintang"
 PQC_Contact_Kuomintang_Leadership_desc: "Nous établirons un contact direct avec les dirigeants du Kuomintang à Taiwan. En nous alignant sur le gouvernement nationaliste chinois, nous pouvons recevoir du soutien, de la formation et du matériel. Cette connexion nous permettra également d'établir une base de formation pour les forces nationalistes à l'étranger, créant ainsi un partenariat stratégique qui profite à la fois à notre cause et aux intérêts de Taiwan."

 PQC_Establish_the_Oversea_National_Revolution_Army_Training_Base: "Créer la base d'entraînement de l'armée de la révolution nationale d'outre-mer"
 PQC_Establish_the_Oversea_National_Revolution_Army_Training_Base_desc: "Avec le soutien du Kuomintang, nous établirons une base d'entraînement majeure pour l'Armée révolutionnaire nationale d'outre-mer. Ce centre formera les nationalistes vietnamiens aux tactiques militaires modernes, en utilisant du matériel et des conseillers fournis par Taiwan. La base servira de centre de préparation des forces pour de futures opérations contre les forces communistes et coloniales sur le continent."

 PQC_Claim_Phu_Quoc_for_the_Republic: "Réclamez Phu Quoc pour la République !"
 PQC_Claim_Phu_Quoc_for_the_Republic_desc: "Nous revendiquerons officiellement l'île de Phu Quoc au nom de la République de Chine, supprimant ainsi les prétentions du Sud-Vietnam sur ce territoire. Cette décision audacieuse fera de notre île un territoire souverain sous la protection nationaliste chinoise, créant ainsi une base permanente pour les opérations en Asie du Sud-Est et démontrant notre engagement envers la cause anticommuniste."

 PQC_Lobby_for_American_Support: "Faire pression pour le soutien américain"
 PQC_Lobby_for_American_Support_desc: "Les États-Unis sont un acteur clé de la guerre froide et leur soutien pourrait être crucial pour notre cause. Nous ferons pression sur les responsables et les politiciens américains, en nous présentant comme une alternative démocratique au colonialisme français et au communisme vietnamien. La reconnaissance et le soutien des États-Unis légitimeraient notre gouvernement et donneraient accès à l'aide et aux équipements américains."

 PQC_Declare_a_Rival_Vietnamese_Government: "Déclarer un gouvernement vietnamien rival"
 PQC_Declare_a_Rival_Vietnamese_Government_desc: "Nous nous déclarerons officiellement comme un gouvernement vietnamien rival, revendiquant la souveraineté sur l'ensemble du Vietnam. Cette déclaration mettra au défi à la fois le gouvernement sud-vietnamien soutenu par la France et le régime communiste nord-vietnamien. En affirmant notre légitimité, nous créons une troisième option pour le peuple vietnamien et nous positionnons comme les véritables représentants du nationalisme vietnamien."

 PQC_The_Forward_Base_to_Mainland_Liberation: "La base avancée vers la libération du continent"
 PQC_The_Forward_Base_to_Mainland_Liberation_desc: "Phu Quoc servira de base avancée pour libérer le continent vietnamien. Nous préparerons les opérations militaires, stockerons des armes et du matériel et entraînerons nos forces aux assauts amphibies. L'emplacement stratégique de l'île en fait une base idéale pour les opérations contre le Nord communiste et le Sud colonial."

 PQC_Further_Militarize_the_Island: "Militariser davantage l'île"
 PQC_Further_Militarize_the_Island_desc: "Nous étendrons considérablement notre infrastructure militaire à Phu Quoc, en construisant des chantiers navals pour les opérations navales et des stations radar pour l'alerte précoce. Cette militarisation transformera l'île en une forteresse, capable de se défendre et de lancer des opérations offensives. L'île deviendra un atout stratégique clé dans la lutte pour l'indépendance vietnamienne."

 # === South Vietnam - 1950s ===

 VIE_Beg_for_Econ_Self_Determination: "Mendier pour l'autodétermination économique"
 VIE_Beg_for_Econ_Self_Determination_desc: "Le Vietnam doit être économiquement autonome et les Français doivent reconnaître qu'avec nous en tant que partenaire plutôt qu'État client, nous pouvons faire plus et construire un grand système économique qui nous convient."

 VIE_Auction_off_Imperial_Treasures: "Vente aux enchères de trésors impériaux"
 VIE_Auction_off_Imperial_Treasures_desc: "Les richesses d'une époque révolue peuvent encore nous servir. Les trésors royaux qui ont servi les empereurs du passé peuvent encore atteindre des prix élevés sur le marché international, et cet argent peut être utilisé pour infuser notre industrie nationale en plein essor."

 VIE_Electrify_Rural_Nam_Phan: "Nam-Phan électrisant"
 VIE_Electrify_Rural_Nam_Phan_desc: "Les régions rurales de Nam-phan ont toujours été arriérées et dépassées depuis des siècles et le sont encore en grande partie. Ainsi, l'électrification serait la base d'une industrialisation et d'investissements plus poussés dans la région."

 VIE_Limited_Industrial_Expansion: "Expansion industrielle limitée"
 VIE_Limited_Industrial_Expansion_desc: "Une expansion prudente est la clé d'une croissance régulière, et dans un pays qui dépend de flux de trésorerie peu stables, nous devons limiter la vitesse de notre croissance. Cela signifiera une main ferme à la barre et de nouvelles opportunités à venir, comme elles le sont naturellement."

 VIE_Form_3_Ministries: "Former les trois ministères"
 VIE_Form_3_Ministries_desc: "Afin de poursuivre notre croissance, nous devons chercher à obtenir des financements de toutes les sources possibles. Cela pourrait impliquer de contracter des emprunts auprès des banques françaises afin de développer les entreprises et d'exploiter de nouvelles sources de revenus pour notre pays."

 VIE_Expand_Local_College_Technique: "Développez nos collèges techniques locaux"
 VIE_Expand_Local_College_Technique_desc: "Il y a une chose qui produira toujours un retour sur investissement, c'est l'éducation. Nous devons allouer des fonds pour créer un nouveau groupe d'experts techniques dans notre société. Nous avons besoin d'une génération qui ait la possibilité de contribuer à moderniser notre économie. La raison pour laquelle de nombreux pays progressent est due à l'innovation. Si nous commençons à former une nouvelle classe sociale hautement instruite, le Vietnam deviendra alors une plaque tournante de l'innovation."

 VIE_Invite_French_Investors: "Inviter les investisseurs français"
 VIE_Invite_French_Investors_desc: "Les entreprises françaises qui se sont retirées de notre pays en raison des troubles dans les rues ont gravement nui à notre économie, mais une fois le contrôle rétabli, nous pouvons les inviter à revenir. Leur aide garantira la croissance continue de notre industrie."

 VIE_Import_IBM_Computers: "Importer des ordinateurs depuis IBM"
 VIE_Import_IBM_Computers_desc: "Les vendeurs d'IBM au langage doux ont une solution à tout. Apparemment, les ordinateurs seront capables de résoudre presque tous les problèmes. Eh bien, ils ne joueront jamais aux échecs, mais cela pourra peut-être aider à surveiller le système insurrectionnel. Pour un prix modique, on nous a dit qu'un système informatique pouvait utiliser des cartes perforées pour surveiller notre succès en matière de pacification et suivre notre système logistique. Même le Pentagone utilise ces ordinateurs ; nous ne voulons pas prendre du retard. Le Vietnam entrera dans l'ère du cyber !"

 VIE_Establish_HoaXa_Vietnam: "Créer le Hoa-Xa Viet-Nam"
 VIE_Establish_HoaXa_Vietnam_desc: "Les chemins de fer de ce pays ont subi de graves dommages de guerre et n'ont pas la capacité de transporter notre industrie. Nous devons faire appel à une entreprise pour nous aider à réparer les lignes et à reconnecter les artères vitales de notre nation."

 VIE_TongTruong_TaiChinh_KinhTe: "Tong-Truong, Tai-Chinh et Kinh-Te"
 VIE_TongTruong_TaiChinh_KinhTe_desc: "Les Français sont disposés à nous accorder davantage d'aide économique et des prêts sont désormais disponibles pour nous. Afin de les utiliser avec succès, nous devons nous assurer que les conditions sont réunies et que nos industries sont prêtes à en subir les répercussions."

 VIE_TongTruong_CanhNong: "Tong-Truong et Canh-Nong"
 VIE_TongTruong_CanhNong_desc: "Bien que Saigon soit un foyer d'industries légères et lourdes de tous types, elle n'en reste pas moins une ville entourée de terres agricoles et nous pouvons l'utiliser à notre avantage. L'agriculture commerciale doit être un élément important de notre lente marche vers la prospérité économique, et les terres de Saigon seraient un élément clé de notre engagement."

 VIE_TongTruong_CongChanh_GiaoThong: "Tong-Truong, Cong-Chanh et Giao-Thong"
 VIE_TongTruong_CongChanh_GiaoThong_desc: "Même si les chemins de fer ont été très durement touchés, les routes ne s'améliorent guère. Beaucoup sont encore des chemins de terre, à l'exception des autoroutes principales. Cela nécessite une initiative de notre part, pour reconstruire les tronçons de route endommagés et pour asphalter certaines parties de routes plus utilisées que d'autres."

 VIE_Introduce_Dong_Currency: "Introduire la monnaie Dong"
 VIE_Introduce_Dong_Currency_desc: "Nous sommes enfin prêts à rompre avec la tradition et à imposer notre indépendance économique avec la monnaie que nous utiliserons. Le Dong vietnamien, le nouveau billet qui sera en circulation, sera soutenu par des banques solides et par un engagement fort du gouvernement."

 VIE_SmallScale_Agri_Reforms: "Réformes agricoles à petite échelle"
 VIE_SmallScale_Agri_Reforms_desc: "Le mode de vie dans les hauts plateaux du centre et dans une grande partie du pays est celui de la communauté agricole. Améliorer les rendements de leurs cultures nécessitera également une main ferme, car pousser trop fort et trop vite pourrait détruire les agriculteurs et leurs familles, et nous devons poursuivre la croissance avec prudence."

 VIE_Widen_Thienly_Highway_Roads: "Élargir les routes Thien-Ly et autoroute"
 VIE_Widen_Thienly_Highway_Roads_desc: "Les autoroutes centrales du pays constituent depuis longtemps la source la plus fiable pour les camions, les voitures et les vélos. Il dessert bien le pays et devrait être amélioré et élargi afin que nous puissions y transporter davantage de matériaux et d'industries."

 VIE_Mimic_Northerns_Economic_Reforms: "Imitez les réformes économiques du Nord"
 VIE_Mimic_Northerns_Economic_Reforms_desc: "En améliorant notre économie, nous devons regarder ce que font les autres. Dans le Nord, nous avons reconnu que de nombreuses méthodes peuvent être mises en oeuvre dans nos stratégies pour aider à améliorer le fonctionnement de nos industries."

 VIE_Open_IBM_Service_Office: "Ouvrir le bureau de service IBM à Saigon"
 VIE_Open_IBM_Service_Office_desc: "Depuis plusieurs années, le géant informatique américain IBM cherche à étendre ses activités au Vietnam. Avec autant d'opérations militaires, ils pensent que leurs produits pourraient être utiles. Au vu du désordre actuel dans lequel se trouvent nos états-majors interarmées, ils pourraient avoir raison. En établissant un siège social, cela nous permettra de communiquer et de commander rapidement auprès d'IBM. Peut-être pourrions-nous bénéficier d'une réduction de gros ?"

 VIE_Further_Inveset_in_Saigon: "Investir davantage à Saigon"
 VIE_Further_Inveset_in_Saigon_desc: "Saigon est sale et libre. Perle de notre nation et coeur de son industrie en plein essor, nous avons les moyens et les capitaux pour y investir. Notre industrie civile doit être renforcée et nos infrastructures doivent être améliorées afin de faire de la ville une capitale capable de rivaliser avec n'importe quelle capitale de la région."

 VIE_Permit_American_Investments: "Autoriser les investissements américains"
 VIE_Permit_American_Investments_desc: "La gloire du marché américain - qui fait l'envie des nations capitalistes du monde entier - est un spectacle à voir, et maintenant nous en aurons notre part. Les entreprises américaines nous ont reconnu comme un nouveau partenaire et ont manifesté leur intérêt pour s'implanter dans notre pays."

 VIE_Import_American_Tech: "Importer de la technologie américaine"
 VIE_Import_American_Tech_desc: "Depuis la fin de la guerre, les progrès technologiques américains dans les secteurs industriels ont amélioré leurs capacités à pas de géant. Nous devons établir des liens avec ces industries et, espérons-le, accorder des licences à ces nouveaux actifs."

 VIE_Expand_Rubber_Line: "Élargissez la gamme de caoutchouc"
 VIE_Expand_Rubber_Line_desc: "Le caoutchouc est la première ressource exportée par le Vietnam, et nous devons en tirer parti en élargissant nos frontières et en explorant la croissance. Veiller à ce que nous puissions construire de nouvelles usines de caoutchouc sera crucial pour atteindre nos objectifs visant à générer davantage de revenus et de commerce."

 VIE_Invest_CEE_Operations: "Investir davantage dans les opérations du CEE"
 VIE_Invest_CEE_Operations_desc: "Il est devenu évident pour nous que les équipements de la CEE (Compagnie des Eaux et d'Electricité de Saigon) sont devenus obsolètes ces dernières années et ont cruellement besoin de nouveaux investissements et d'une modernisation que nous allons maintenant présenter."

 VIE_Repair_DaLatThapCham_Railway: "Réparer le chemin de fer Da-Lat-Thap-Cham"
 VIE_Repair_DaLatThapCham_Railway_desc: "Le chemin de fer Da Lat-Tham Cham est l'une des rares artères ferroviaires dont nous disposons dans le sud et nécessite un entretien constant dans son état actuel. Avec de nouveaux investissements et des améliorations technologiques, cela peut devenir une autre veine vitale du corps de la base industrielle."

 VIE_Protect_French_Plantation_Owners: "Protéger les propriétaires de plantations françaises"
 VIE_Protect_French_Plantation_Owners_desc: "Les anciennes plantations françaises, longtemps approvisionnées et exploitées par des agriculteurs vietnamiens, de jeunes enfants et des vieillards, doivent désormais nous servir. Bien que beaucoup souhaitent que les terres soient divisées pour être utilisées par de petits agriculteurs et un plus grand nombre de familles, nous devons protéger les exploitations, car elles constituent un important fournisseur industriel de nourriture."

 VIE_Expand_Saigon_Radio: "Développer Radio Saigon"
 VIE_Expand_Saigon_Radio_desc: "Avec de l'argent disponible et des investissements supplémentaires, la vieille Radio Saigon deviendra un excellent outil de diffusion des agendas de Bao-Dai et diffusera également des informations utiles dans le coeur de nos sujets !"

 VIE_Repair_SaigonMytho_Railway: "Réparer le chemin de fer Saigon-Mytho"
 VIE_Repair_SaigonMytho_Railway_desc: "La ligne ferroviaire Saigon-Mytho devient rapidement un moyen important - et désuet - pour l'industrie d'acheminer les fruits de notre travail. Notre gouvernement a reconnu que nous devrions consacrer des capitaux à l'amélioration ou à l'expansion des lignes ferroviaires afin de mieux nous servir."

 VIE_Export_Rubber_Natural_Resources: "Exporter du caoutchouc et des ressources naturelles"
 VIE_Export_Rubber_Natural_Resources_desc: "Grâce à nos nouvelles capacités, nous pouvons désormais augmenter la production et l'exportation de caoutchouc, et nos autres ressources ont également rattrapé celles d'autres pays, ce qui signifie que nous pouvons désormais nous permettre d'ouvrir de plus grands ports commerciaux et des lois commerciales."

 VIE_National_Tourism_Office: "Créer l'Office National du Tourisme"
 VIE_National_Tourism_Office_desc: "Les plages de Nha-Trang, les fraîches collines de Da-Lat et les tombeaux impériaux de Hué attirent les visiteurs français depuis des décennies, mais aucun organisme vietnamien n'en a jamais fait la promotion. Un Office national du tourisme commercialisera notre pays à l'étranger, accordera des licences aux hôtels et aux guides et apportera des devises étrangères au trésor. Les visiteurs qui viennent voir un Vietnam paisible emporteront également cette image chez eux."

 VIE_Establish_DacPhu_DanTien_Cuoc_Commission_Econ: "Créer la Commission « Dac-Phu Dan-Tien Cuoc »"
 VIE_Establish_DacPhu_DanTien_Cuoc_Commission_Econ_desc: "La Commission Dac-Phu Dan-Tien Cuoc sera créée pour superviser le développement économique et coordonner la planification industrielle. Cette commission travaillera à intégrer la vision économique de Cuong-De avec des objectifs de développement pratiques, en veillant à ce que nos politiques économiques servent à la fois la population et les intérêts stratégiques de l'État."

 VIE_CD_Auction_off_Imperial_Treasures: "Vente aux enchères de trésors impériaux"
 VIE_CD_Auction_off_Imperial_Treasures_desc: "Les richesses d'une époque révolue peuvent encore nous servir. Le prince Cuong-De est revenu sur un trône qui a plus besoin d'usines que d'ornements dorés. Les trésors royaux qui ont servi les empereurs du passé peuvent encore atteindre des prix élevés sur le marché international, et cet argent peut être utilisé pour infuser notre industrie nationale en plein essor."

