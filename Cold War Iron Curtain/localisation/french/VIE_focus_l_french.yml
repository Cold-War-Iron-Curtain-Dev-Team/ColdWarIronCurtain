 VIE_CD_Electrify_Rural_Nam_Phan_desc: "Les régions rurales de Nam-phan ont toujours été arriérées et dépassées depuis des siècles et le sont encore en grande partie. Ainsi, l'électrification serait la base d'une industrialisation et d'investissements plus poussés dans la région."

