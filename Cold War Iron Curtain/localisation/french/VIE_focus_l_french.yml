 VIE_CD_TongTruong_TaiChinh_KinhTe_desc: "Les Français sont disposés à nous accorder davantage d'aide économique et des prêts sont désormais disponibles pour nous. Afin de les utiliser avec succès, nous devons nous assurer que les conditions sont réunies et que nos industries sont prêtes à en subir les répercussions."

 VIE_CD_TongTruong_CanhNong: "Tong-Truong et Canh-Nong"
 VIE_CD_TongTruong_CanhNong_desc: "Bien que Saigon soit un foyer d'industries légères et lourdes de tous types, elle n'en reste pas moins une ville entourée de terres agricoles et nous pouvons l'utiliser à notre avantage. L'agriculture commerciale doit être un élément important de notre lente marche vers la prospérité économique, et les terres de Saigon seraient un élément clé de notre engagement."

 VIE_CD_TongTruong_CongChanh_GiaoThong: "Tong-Truong, Cong-Chanh et Giao-Thong"
 VIE_CD_TongTruong_CongChanh_GiaoThong_desc: "Même si les chemins de fer ont été très durement touchés, les routes ne s'améliorent guère. Beaucoup sont encore des chemins de terre, à l'exception des autoroutes principales. Cela nécessite une initiative de notre part, pour reconstruire les tronçons de route endommagés et pour asphalter certaines parties de routes plus utilisées que d'autres."

 VIE_CD_Introduce_Dong_Currency: "Introduire la monnaie Dong"
 VIE_CD_Introduce_Dong_Currency_desc: "Nous sommes enfin prêts à rompre avec la tradition et à imposer notre indépendance économique avec la monnaie que nous utiliserons. Le Dong vietnamien, le nouveau billet qui sera en circulation, sera soutenu par des banques solides et par un engagement fort du gouvernement."

 VIE_CD_SmallScale_Agri_Reforms: "Réformes agricoles à petite échelle"
 VIE_CD_SmallScale_Agri_Reforms_desc: "Le mode de vie dans les hauts plateaux du centre et dans une grande partie du pays est celui de la communauté agricole. Améliorer les rendements de leurs cultures nécessitera également une main ferme, car pousser trop fort et trop vite pourrait détruire les agriculteurs et leurs familles, et nous devons poursuivre la croissance avec prudence."

 VIE_CD_Widen_Thienly_Highway_Roads: "Élargir les routes Thien-Ly et autoroute"
 VIE_CD_Widen_Thienly_Highway_Roads_desc: "Les autoroutes centrales du pays constituent depuis longtemps la source la plus fiable pour les camions, les voitures et les vélos. Il dessert bien le pays et devrait être amélioré et élargi afin que nous puissions y transporter davantage de matériaux et d'industries."

 VIE_CD_Mimic_Northerns_Economic_Reforms: "Imitez les réformes économiques du Nord"
 VIE_CD_Mimic_Northerns_Economic_Reforms_desc: "En améliorant notre économie, nous devons regarder ce que font les autres. Dans le Nord, nous avons reconnu que de nombreuses méthodes peuvent être mises en oeuvre dans nos stratégies pour aider à améliorer le fonctionnement de nos industries."

 VIE_CD_Open_IBM_Service_Office: "Ouvrir le bureau de service IBM à Saigon"
 VIE_CD_Open_IBM_Service_Office_desc: "Depuis plusieurs années, le géant informatique américain IBM cherche à étendre ses activités au Vietnam. Avec autant d'opérations militaires, ils pensent que leurs produits pourraient être utiles. Au vu du désordre actuel dans lequel se trouvent nos états-majors interarmées, ils pourraient avoir raison. En établissant un siège social, cela nous permettra de communiquer et de commander rapidement auprès d'IBM. Peut-être pourrions-nous bénéficier d'une réduction de gros ?"

 VIE_CD_Further_Inveset_in_Saigon: "Investir davantage à Saigon"
 VIE_CD_Further_Inveset_in_Saigon_desc: "Saigon est sale et libre. Perle de notre nation et coeur de son industrie en plein essor, nous avons les moyens et les capitaux pour y investir. Notre industrie civile doit être renforcée et nos infrastructures doivent être améliorées afin de faire de la ville une capitale capable de rivaliser avec n'importe quelle capitale de la région."

 VIE_CD_Permit_American_Investments: "Autoriser les investissements américains"
 VIE_CD_Permit_American_Investments_desc: "La gloire du marché américain - qui fait l'envie des nations capitalistes du monde entier - est un spectacle à voir, et maintenant nous en aurons notre part. Les entreprises américaines nous ont reconnu comme un nouveau partenaire et ont manifesté leur intérêt pour s'implanter dans notre pays."

 VIE_CD_Import_American_Tech: "Importer de la technologie américaine"
 VIE_CD_Import_American_Tech_desc: "Depuis la fin de la guerre, les progrès technologiques américains dans les secteurs industriels ont amélioré leurs capacités à pas de géant. Nous devons établir des liens avec ces industries et, espérons-le, accorder des licences à ces nouveaux actifs."

 VIE_CD_Expand_Rubber_Line: "Élargissez la gamme de caoutchouc"
 VIE_CD_Expand_Rubber_Line_desc: "Le caoutchouc est la première ressource exportée par le Vietnam, et nous devons en tirer parti en élargissant nos frontières et en explorant la croissance. Veiller à ce que nous puissions construire de nouvelles usines de caoutchouc sera crucial pour atteindre nos objectifs visant à générer davantage de revenus et de commerce."

 VIE_CD_Invest_CEE_Operations: "Investir davantage dans les opérations du CEE"
 VIE_CD_Invest_CEE_Operations_desc: "Il est devenu évident pour nous que les équipements de la CEE (Compagnie des Eaux et d'Electricité de Saigon) sont devenus obsolètes ces dernières années et ont cruellement besoin de nouveaux investissements et d'une modernisation que nous allons maintenant présenter."

 VIE_CD_Repair_DaLatThapCham_Railway: "Réparer le chemin de fer Da-Lat-Thap-Cham"
 VIE_CD_Repair_DaLatThapCham_Railway_desc: "Le chemin de fer Da Lat-Tham Cham est l'une des rares artères ferroviaires dont nous disposons dans le sud et nécessite un entretien constant dans son état actuel. Avec de nouveaux investissements et des améliorations technologiques, cela peut devenir une autre veine vitale du corps de la base industrielle."

 VIE_CD_Protect_French_Plantation_Owners: "Protéger les propriétaires de plantations françaises"
 VIE_CD_Protect_French_Plantation_Owners_desc: "Les anciennes plantations françaises, longtemps approvisionnées et exploitées par des agriculteurs vietnamiens, de jeunes enfants et des vieillards, doivent désormais nous servir. Bien que beaucoup souhaitent que les terres soient divisées pour être utilisées par de petits agriculteurs et un plus grand nombre de familles, nous devons protéger les exploitations, car elles constituent un important fournisseur industriel de nourriture."

 VIE_CD_Expand_Saigon_Radio: "Développer Radio Saigon"
 VIE_CD_Expand_Saigon_Radio_desc: "Avec de l'argent disponible et des investissements supplémentaires, la vieille Radio Saigon deviendra un excellent outil de diffusion des programmes de Cuong-De et diffusera également des informations utiles dans le coeur de nos sujets !"

 VIE_CD_Repair_SaigonMytho_Railway: "Réparer le chemin de fer Saigon-Mytho"
 VIE_CD_Repair_SaigonMytho_Railway_desc: "La ligne ferroviaire Saigon-Mytho devient rapidement un moyen important - et désuet - pour l'industrie d'acheminer les fruits de notre travail. Notre gouvernement a reconnu que nous devrions consacrer des capitaux à l'amélioration ou à l'expansion des lignes ferroviaires afin de mieux nous servir."

 VIE_CD_Export_Rubber_Natural_Resources: "Exporter du caoutchouc et des ressources naturelles"
 VIE_CD_Export_Rubber_Natural_Resources_desc: "Grâce à nos nouvelles capacités, nous pouvons désormais augmenter la production et l'exportation de caoutchouc, et nos autres ressources ont également rattrapé celles d'autres pays, ce qui signifie que nous pouvons désormais nous permettre d'ouvrir de plus grands ports commerciaux et des lois commerciales."

 VIE_CD_National_Tourism_Office: "Créer l'Office National du Tourisme"
 VIE_CD_National_Tourism_Office_desc: "Les plages de Nha-Trang, les collines fraîches de Da-Lat et la gloire restaurée de la capitale impériale de Hue attirent les visiteurs depuis des décennies, mais aucun organisme vietnamien ne les a jamais promus. Un Office national du tourisme commercialisera l'Empire à l'étranger, accordera des licences aux hôtels et aux guides et apportera des devises étrangères au trésor. Les visiteurs qui viennent voir une monarchie vietnamienne restaurée emporteront cette image chez eux."

 VIE_Second_Elysee_Accords: "L'article 2 des accords de l'Elysée"
 VIE_Second_Elysee_Accords_desc: "Les accords de l'Élysée de 1949 ont reconnu le Vietnam comme un État indépendant au sein de l'Union française, mais plus en théorie qu'en pratique. Le deuxième article des accords nous accorde le droit de mener notre propre diplomatie, à condition que nous tenions Paris informé. C'est une porte étroite, mais c'est une porte. Notre ministère des Affaires étrangères doit maintenant franchir cette étape et commencer à construire ses propres relations."

 VIE_Western_Desk: "Bureau occidental"
 VIE_Western_Desk_desc: "C'est une triste réalité : il est difficile d'opérer dans ce monde sans le soutien de l'Occident. Bien que l'ère de l'impérialisme soit censée mourir, il semble qu'elle ne soit pas en train de mourir mais qu'elle se transforme simplement en quelque chose de nouveau. Nous devons préparer nos diplomates afin qu'ils puissent mettre les puissances occidentales à nos côtés. Avec leur soutien, nous aurons leur puissance industrielle et leur influence diplomatique derrière notre nation, et nous serons en mesure d'étendre notre influence dans le monde entier."

 VIE_Establish_UK_USA_Diplomacy: "Établir des relations diplomatiques avec le Royaume-Uni et les États-Unis"
 VIE_Establish_UK_USA_Diplomacy_desc: "Jusqu'à présent, chaque mot que nous avons adressé à Londres et à Washington passait d'abord par Paris. Avec le droit de diriger nos propres affaires étrangères, nous pouvons ouvrir des ambassades dans les deux capitales et parler pour nous-mêmes. Les puissances anglo-américaines tiennent les cordons de la bourse du monde libre, et leur amitié vaudra bien plus que n'importe quelle garantie française."

 VIE_Sign_Autonomous_Forex_Agreement: "Signez l'accord de change autonome"
 VIE_Sign_Autonomous_Forex_Agreement_desc: "Grâce à notre accord avec les Français, nous avons la possibilité de signer un accord qui nous permettra d'ouvrir le commerce et l'échange de devises. Une nouvelle étape vers notre liberté financière est franchie et le Vietnam peut enfin commencer à se détacher de ses racines coloniales."

 VIE_Pau_Treaty: "Le Traité de Pau"
 VIE_Pau_Treaty_desc: "Nos diplomates auprès des Français se sont engagés à trouver une avancée décisive dans la négociation de notre indépendance financière, et nous avons constaté que nos homologues français sympathisent avec cette cause. Nous veillerons avant tout à ce que la liberté financière du Vietnam soit entre nos mains."

 VIE_Accept_Foreign_Affairs_Administrative_Duties: "Acceptez de nouvelles tâches administratives et liées aux affaires étrangères"
 VIE_Accept_Foreign_Affairs_Administrative_Duties_desc: "Nous nous sommes bien préparés à la perspective de gérer nos propres affaires et celles des États ailleurs dans le monde, et il est temps pour nous de nous mettre à la place de l'élaboration des politiques étrangères et intérieures. En veillant à ce que nos ressources et nos limites politiques nous le permettent, nous commencerons à tracer notre propre chemin."

 VIE_Matignon_Treaty: "Le traité de Matignon"
 VIE_Matignon_Treaty_desc: "Les Français ont décidé de se laver complètement les mains du Vietnam et sont prêts à signer un traité annonçant leur retrait total de la région. Notre indépendance est enfin assurée par le gouvernement et une conférence à Matignon officialisera l'indépendance totale du Vietnam. La liberté est acquise !"

 VIE_Attract_US_Support: "Attirer le soutien des États-Unis"
 VIE_Attract_US_Support_desc: "Dans nos efforts contre nos ennemis, notre plus grand allié est le gouvernement américain. Le maintien constant de notre gouvernement doit désormais impliquer une coopération totale, et les grandes ressources des États-Unis nous donneront l'avantage dont nous avons besoin."

 VIE_Greenlight_American_Intervention: "L'intervention de Greenlight America"
 VIE_Greenlight_American_Intervention_desc: "L'Amérique a exprimé sa volonté d'entrer dans le conflit à nos côtés, sans se contenter de simplement aider. Grâce à leur puissance militaire et économique, nous vaincrons sûrement nos ennemis du Nord et mettrons fin à ce conflit amer."

 VIE_Asian_Desk: "Bureau asiatique"
 VIE_Asian_Desk_desc: "Nous avons un rôle important à jouer dans les affaires asiatiques. Bien que nous ne soyons pas le plus grand pays d'Asie, nous possédons un esprit et une détermination qui peuvent facilement faire pencher la balance en cas de conflit. Mais nous devons choisir avec soin la manière dont nous nous appliquons. Nous ne voulons pas nous mettre à rude épreuve pour résoudre les problèmes de tous les pays asiatiques."

 VIE_Chinese_Civil_War: "La guerre civile chinoise"
 VIE_Chinese_Civil_War_desc: "Notre voisin du nord, la Chine, est actuellement plongé dans une guerre civile entre les nationalistes et les communistes. Attendons de voir qui sortira vainqueur de cette guerre."

 VIE_Congratulate_KMT_Victory: "Félicitons la victoire du Kuomintang"
 VIE_Congratulate_KMT_Victory_desc: "Malgré tous les obstacles, le KMT a réussi à gagner la guerre civile contre les communistes. Félicitons le KMT pour sa victoire et nous pourrions même nouer une alliance avec lui contre les communistes."

 VIE_Ignore_China: "Ignorez-le"
 VIE_Ignore_China_desc: "Quel que soit le camp qui remportera la guerre civile, la Chine constituera toujours une menace contre nous dans les années à venir. Il vaudrait mieux que nous nous concentrions sur nos affaires intérieures plutôt que de nous soucier des affaires chinoises."

 VIE_Criticize_Mao_Success: "Critiquer le succès de Mao"
 VIE_Criticize_Mao_Success_desc: "Mao et les communistes ont gagné la guerre civile chinoise. Rejoignons nos alliés occidentaux pour condamner Mao et son nouveau gouvernement et trouvons un moyen d'aider le KMT en exil."

 VIE_Establish_ROC_Embassy: "Créer l'ambassade de la République de Chine à Saigon"
 VIE_Establish_ROC_Embassy_desc: "Quelle que soit l'issue de la guerre à notre frontière nord, la communauté chinoise de Cholon et le gouvernement chinois au pouvoir façonneront tous deux notre avenir. L'ouverture d'une ambassade de la République de Chine à Saigon nous donne un canal direct vers les nationalistes et signale au monde où réside notre loyauté dans la lutte contre le communisme."

 VIE_ROC_Army_Cooperation: "Coopérer avec les forces armées de la République de Chine"
 VIE_ROC_Army_Cooperation_desc: "L'armée nationaliste chinoise a passé deux décennies à combattre à la fois les Japonais et les communistes. Leurs officiers connaissent mieux que quiconque l'ennemi auquel nous sommes confrontés. Nous les inviterons à échanger des officiers d'état-major, à partager des renseignements sur les mouvements communistes le long de la frontière et à aider à former nos propres forces aux leçons qu'elles ont payées de leur sang."

 VIE_ROC_Material_Support: "Demandez un support matériel"
 VIE_ROC_Material_Support_desc: "Notre armée reste à court de fusils, d'artillerie et de camions, et les livraisons françaises arrivent lentement et sous conditions. Le gouvernement nationaliste victorieux détient d'importants stocks d'équipements capturés et excédentaires. Nous leur demanderons de le partager avec un autre État anticommuniste qui se trouve en première ligne de la même lutte."

 VIE_Refuse_Mao_Recognition: "Refuser de reconnaître le régime de Mao"
 VIE_Refuse_Mao_Recognition_desc: "Les communistes de Mao Zedong ont conquis le continent et exigent désormais d'être reconnus comme gouvernement de la Chine. Nous ne leur en donnerons aucun. Saigon continuera de reconnaître le gouvernement nationaliste comme la seule Chine légitime, et nous nous tiendrons aux côtés des États-Unis pour refuser de légitimer un régime qui arme le Viet-Minh contre nous."

 VIE_Malaysian_Insurgency: "L'insurrection malaisienne"
 VIE_Malaysian_Insurgency_desc: "Dans notre sud, les Britanniques ont passé des années à combattre les guérilleros communistes de Chin-Peng dans les jungles de Malaisie. La lutte là-bas reflète la nôtre, et son issue nous en dira long sur la façon dont de telles guerres peuvent être gagnées ou perdues. Maintenant que les combats sont terminés, nous devons décider comment réagir à tout gouvernement qui émergerait à Kuala Lumpur."

 VIE_Recognize_MAL_FED: "Reconnaître [MAL.GetNameDef]"
 VIE_Recognize_MAL_FED_desc: "L'insurrection communiste en Malaisie a été vaincue ou amenée à la table des négociations, et la Fédération est autonome. Nous reconnaîtrons officiellement le nouveau gouvernement et ouvrirons des relations avec un autre pays d'Asie du Sud-Est qui a repoussé le même ennemi auquel nous sommes confrontés. Leur expérience en matière de réinstallation et de contre-insurrection pourrait encore s'avérer précieuse pour nous."

 VIE_Denounce_ChinPeng_Victory: "Dénoncez la victoire de Chin Peng"
 VIE_Denounce_ChinPeng_Victory_desc: "La victoire de Chin Peng en Malaisie porte un coup désastreux à nos alliés anticommunistes, et nous ne pouvons pas laisser cette victoire motiver nos ennemis. Nous dénoncerons sa victoire et chercherons à écraser toutes ses forces alliées qui menacent notre pays."

 VIE_Resettle_Malaysian_Refugees: "Réinstaller les réfugiés malaisiens"
 VIE_Resettle_Malaysian_Refugees_desc: "Les forces de Chin-Peng ont envahi la Malaisie, repoussant des milliers de familles malaises anticommunistes vers le nord, vers nos côtes. Nous les installerons dans les provinces du sud du Vietnam, où leur nombre s'ajoutera à notre main-d'oeuvre et remplira les communautés vidées par des années de guerre. Ils ne sont pas étrangers à ce à quoi nous sommes confrontés."

 VIE_Recognize_SWK: "Reconnaître [SWK.GetNameDef]"
 VIE_Recognize_SWK_desc: "Le Sarawak est devenu un État indépendant à Bornéo. Nous reconnaîtrons officiellement la souveraineté du Sarawak, en établissant des relations diplomatiques et en ouvrant des canaux de coopération. Cette reconnaissance renforcera notre position en Asie du Sud-Est et créera des opportunités de commerce et de collaboration régionale."

 VIE_Recognize_MAL: "Reconnaître [MAL.GetNameDef]"
 VIE_Recognize_MAL_desc: "La Malaisie a accédé à son indépendance et s'est imposée comme une nation souveraine. Nous reconnaîtrons l'indépendance de la Malaisie et chercherons à établir des relations amicales. En tant que nations d'Asie du Sud-Est, nous partageons des intérêts communs en matière de stabilité régionale et de développement économique."

 VIE_Recognize_NBO: "Reconnaître [NBO.GetNameDef]"
 VIE_Recognize_NBO_desc: "Le Nord de Bornéo a déclaré son indépendance et établi son propre gouvernement. Nous reconnaîtrons la souveraineté du Nord-Bornéo, en ouvrant les voies diplomatiques et en établissant des relations commerciales. Cette reconnaissance élargira notre présence diplomatique dans la région et créera de nouvelles opportunités de coopération."

 VIE_Korean_War: "La guerre de Corée"
 VIE_Korean_War_desc: "La Corée est impliquée dans un conflit similaire au nôtre ; un vide de pouvoir a été créé et les forces maléfiques du communisme cherchent à s'implanter dans la nation nouvellement créée. Nous devons faire quelque chose pour éviter cela, mais combien pouvons-nous réellement consacrer à notre intervention ? Si nous laissons tomber la Corée du Sud, un effet domino pourrait se produire dans toute l'Asie et de nouvelles républiques comme la nôtre pourraient être anéanties par la menace du marxisme."

 VIE_Korea_Send_Advisory_Mission: "Envoyer une mission de conseil"
 VIE_Korea_Send_Advisory_Mission_desc: "Nous ne pouvons pas épargner une armée à la Corée, mais nous pouvons lui épargner de l'expérience. Une petite mission consultative d'officiers, appuyée par une cargaison de fusils, de camions et de chars fournis par la France, montrera à la République de Corée qu'elle n'est pas seule. Nos officiers reviendront avec les leçons apprises contre les forces chinoises et nord-coréennes, et notre position parmi les nations libres d'Asie augmentera."

 VIE_Recognize_SK_Sovereignty: "Reconnaître la souveraineté de la Corée du Sud"
 VIE_Recognize_SK_Sovereignty_desc: "Notre propre guerre chez nous exige tous les soldats dont nous disposons. Plutôt que d'envoyer des hommes ou du matériel en Corée, nous reconnaîtrons formellement la République de Corée comme le seul gouvernement légitime de la péninsule et offrirons notre soutien diplomatique. Il s'agit d'un geste modeste, mais il permet à nos forces de rester chez elles et à notre peuple de rester concentré sur le combat qui l'attend."

 VIE_Korean_Send_DaiHan_Expedition_Force: "Envoyez la force expéditionnaire Dai-han"
 VIE_Korean_Send_DaiHan_Expedition_Force_desc: "Les mots et les conseils ne suffisent pas. La force expéditionnaire Dai-Han transportera des soldats et des aviateurs vietnamiens en Corée pour combattre aux côtés de la République de Corée et des Nations Unies. Cet engagement mettra nos forces à rude épreuve et mettra à l'épreuve la patience de notre peuple, mais les hommes qui reviendront seront des vétérans endurcis, et personne ne doutera de la position du Vietnam."

 VIE_Korean_Intervention: "Intervention sud-coréenne ?"
 VIE_Korean_Intervention_desc: "Nos efforts pour ravitailler les soldats coréens dans leur lutte contre les communistes ne suffisent pas. Notre administration de la défense nationale s'est engagée à préparer un corps expéditionnaire pour aider à solidifier la défense de la liberté contre les Chinois et leurs marionnettes nord-coréennes."

 VIE_Accept_Rhee_Proposal: "Acceptez la proposition de Rhee"
 VIE_Accept_Rhee_Proposal_desc: "Syngman Rhee et Chiang Kai-shek, deux des plus grands acteurs de la région, ont fait savoir à notre peuple qu'ils étaient prêts à nous offrir leur main dans un mouvement visant à unir de nombreux pays d'Asie sous une bannière unifiée de coopération politique face au communisme. C'est une proposition dont nous ne pouvons nous détourner, nos objectifs sont alignés et notre devoir envers le monde est pleinement affiché."

 VIE_Ignore_Rhee_Proposal: "Ignorer la proposition de Rhee"
 VIE_Ignore_Rhee_Proposal_desc: "Syngman Rhee et Chiang Kai-shek, deux des plus grands acteurs de la région, ont fait savoir à notre peuple qu'ils étaient prêts à nous offrir leur main dans un mouvement visant à unir de nombreux pays d'Asie sous une bannière unifiée de coopération politique face au communisme. Bien qu'intéressant, la coopération avec des organismes étrangers n'est pas dans les objectifs de notre nation. En effet, leur ingérence ne ferait que nuire à notre capacité à mener la guerre comme bon nous semble."

 VIE_Congratulate_SK_Reunification: "Félicitons la République de Corée pour sa réunification"
 VIE_Congratulate_SK_Reunification_desc: "La République de Corée a chassé les communistes de la péninsule et réunifié la nation coréenne sous un gouvernement libre. Leur victoire prouve que le communisme peut être vaincu en Asie. Nous adresserons nos plus chaleureuses félicitations à Séoul et présenterons l'exemple coréen à notre propre peuple comme preuve de ce que la détermination peut réaliser."

 VIE_Denounce_Kim_Reunification: "Dénonçons la réunification de la péninsule coréenne par Kim"
 VIE_Denounce_Kim_Reunification_desc: "Les armées de Kim Il-sung ont envahi le sud et placé l'ensemble de la Corée sous le régime communiste. C'est exactement le sort qui attend le Vietnam si nous échouons. Nous refuserons de reconnaître sa conquête, la condamnerons sur toutes les tribunes à notre disposition et nous soutiendrons les patriotes coréens qui continuent de résister."

 VIE_Recognize_Jeju_Republic: "Reconnaître la République à Jeju"
 VIE_Recognize_Jeju_Republic_desc: "Le gouvernement de la République de Corée s'est retiré sur l'île de Jeju, où il résiste au nord communiste. Il reste le gouvernement légitime du peuple coréen, quel que soit le terrain qu'il ait perdu. Nous reconnaîtrons officiellement la République à Jeju et assurerons ses dirigeants de notre soutien continu."

 VIE_Recognize_Samoa_Republic: "Reconnaître la République aux Samoa"
 VIE_Recognize_Samoa_Republic_desc: "Chassé de la péninsule, le gouvernement de la République de Corée a trouvé refuge aux Samoa, loin de l'autre côté du Pacifique. Un gouvernement en exil reste légitime. Nous reconnaîtrons officiellement la République des Samoa comme le véritable gouvernement de la Corée et refuserons d'accepter la conquête communiste de sa patrie."

 VIE_Demand_Japanese_Deport_CuongDe: "Exigez l'expulsion de Cuong-De par le Japon"
 VIE_Demand_Japanese_Deport_CuongDe_desc: "Il est déjà assez inquiétant d'apprendre les efforts de Cuong-De pour saper notre gouvernement, mais il est insultant de savoir que le gouvernement japonais a refusé de rejeter ses tentatives. En utilisant la pression politique, nous devons exiger qu'il soit expulsé vers le Vietnam, pour qu'il réponde de lui-même."

 VIE_A_Change_in_Course: "Un changement de cap"
 VIE_A_Change_in_Course_desc: "Afin de nous améliorer intérieurement, nous devons nous tourner vers nos frères asiatiques proches et voir comment ils ont géré leurs affaires. Nous devons sortir des influences des affaires françaises dans nos décisions et tracer notre propre voie."

 VIE_Look_up_to_Japan: "Regardez le Japon"
 VIE_Look_up_to_Japan_desc: "Les efforts déployés par les Japonais pour développer un gouvernement stable d'après-guerre et leur manière de gouverner ont influencé notre façon de penser. Il est temps pour nous d'envisager de suivre leur exemple de plus près, afin d'assurer un succès continu."

 VIE_Promote_JAP_Tech_Exchanges: "Promouvoir les échanges technologiques"
 VIE_Promote_JAP_Tech_Exchanges_desc: "L'industrie japonaise se redresse à un rythme remarquable et ses ingénieurs sont avides de nouveaux partenaires. Nous parrainerons des échanges d'étudiants, d'ingénieurs et de personnel technique entre nos deux pays, ouvrirons des bureaux pour des entreprises japonaises à Saigon et acquerrons des véhicules et un savoir-faire japonais pour moderniser notre propre industrie."

 VIE_Promote_PanAsianism: "Promouvoir le panasiatisme"
 VIE_Promote_PanAsianism_desc: "Nos racines ont toujours été mêlées à celles de nos frères asiatiques, et alors que le monde commence enfin à se rassembler pour atteindre des objectifs communs, il est temps pour nous d'entrer dans le monde en tant qu'influence positive dans notre communauté mondiale."

 VIE_Allow_Japanese_Investments: "Autoriser les investissements japonais"
 VIE_Allow_Japanese_Investments_desc: "Les entreprises japonaises sont à la recherche de nouveaux marchés et de nouvelles matières premières en Asie du Sud-Est, et nos liens avec Tokyo nous confèrent un avantage que peu de voisins peuvent égaler. Nous ouvrirons nos portes au capital japonais, en invitant leurs entreprises à construire des usines, à investir dans nos plantations et à moderniser nos ports."

 VIE_Indochina_Desk: "Bureau Indochine"
 VIE_Indochina_Desk_desc: "Nos préoccupations les plus importantes ne se situent pas en Europe ou de l'autre côté du Pacifique, mais à nos propres frontières. Le Laos, le Cambodge et les îles au large de nos côtes touchent tous à la sécurité vietnamienne, et les anciens arrangements français laissent de nombreuses questions sans réponse. Le Desk Indochine s'occupera de nos relations avec nos voisins et défendra les revendications du Vietnam dans la région."

 VIE_Demand_PhuQuoc_Ownership: "Exigez la propriété de Phu-Quoc"
 VIE_Demand_PhuQuoc_Ownership_desc: "Les nationalistes chinois sont allés trop loin, d'abord en prétendant que l'île de Phu-Quoc leur appartenait, et maintenant nous avons vu des militaires armés se déplacer vers des positions sur et à proximité des îles. C'est bien trop pour que notre gouvernement puisse rester les bras croisés et l'accepter. Nous devons faire des déclarations fortes pour dissiper les illusions dont souffre le Kuomintang."

 VIE_PhuQuoc_Launch_Invasion: "Lancez l'invasion"
 VIE_PhuQuoc_Launch_Invasion_desc: "Le temps de la politique est révolu. Le Kuomintang a ignoré tous les avertissements. Notre armée est prête à lancer une invasion totale de l'île pour reprendre ce qui nous appartient. On ne nous refusera pas la propriété que nous possédons."

 VIE_Beg_Pulo_Condore_Return: "Demandez le retour de Pulo Condore"
 VIE_Beg_Pulo_Condore_Return_desc: "Les îles Con-Dao, connues des Français sous le nom de Pulo Condore, servent d'archipel-prison dans la mer de Chine méridionale depuis près d'un siècle. Le chapitre colonial étant clos, nous avons demandé à Paris de rendre les îles sous administration vietnamienne. Il ne fait aucun doute qu'ils nous appartiennent. Que la France soit d'accord est une autre affaire."

 VIE_Focus_on_Other_Matters: "Commencez à vous concentrer sur d'autres sujets"
 VIE_Focus_on_Other_Matters_desc: "L'action militaire contre les incursions du KMT dans la région de Phu Quoc n'est pas la préoccupation majeure, d'autres questions doivent prendre plus de temps et d'efforts. Nous nous occuperons de la question des frontières lorsque nous y reviendrons."

 VIE_Denounce_VietQuoc_Republic: "Dénoncer la République Viet-Quoc"
 VIE_Denounce_VietQuoc_Republic_desc: "La faction du VNQDD qui s'est emparée de Phu-Quoc l'a déclarée république distincte, l'appelant la République Viet-Quoc. Ils prétendent représenter le véritable nationalisme vietnamien, mais leur petit État insulaire n'est rien de plus qu'une faction dissidente détenant un territoire. Notre ministère des Affaires étrangères publiera des déclarations indiquant clairement qu'aucun gouvernement vietnamien autoproclamé en dehors de Saigon n'a de légitimité."

 VIE_Proclaim_Sole_Viet_State: "Proclamons-nous le seul État vietnamien"
 VIE_Proclaim_Sole_Viet_State_desc: "La République Viet-Quoc refuse de se dissoudre et le régime communiste de Hanoï prétend parler au nom de tous les Vietnamiens. Nous ne pouvons pas rester silencieux. Le gouvernement de Saigon est le seul État légitime du peuple vietnamien, et notre ministère des Affaires étrangères fera valoir cette position par toutes les voies diplomatiques disponibles."

 VIE_Launch_Second_Invasion: "Lancez une deuxième invasion"
 VIE_Launch_Second_Invasion_desc: "La diplomatie n'a rien produit. Nos efforts pour saper la République Viet-Quoc de l'intérieur les ont affaiblis mais ne les ont pas brisés. Il ne reste qu'une option : une deuxième expédition à Phu-Quoc pour terminer ce que nous avons commencé. L'île sera à nous."

 VIE_Focus_on_Other_Matters_Final: "Échec sur l'île de Phu-Quoc"
 VIE_Focus_on_Other_Matters_Final_desc: "La deuxième invasion a échoué. Nos forces ne pourraient pas tenir l'île face à une résistance déterminée du Viet-Quoc, et poursuivre la campagne nous coûterait bien plus que ce que vaut Phu-Quoc. Nous nous retirons et laissons ce chapitre derrière nous."

 VIE_Sabatoge_VietQuoc_Gov: "Saboter le gouvernement Viet-Quoc"
 VIE_Sabatoge_VietQuoc_Gov_desc: "L'emprise de la République Viet-Quoc sur Phu-Quoc repose sur le patronage du VNQDD et rien d'autre. Nos services de renseignement trouveront les lignes de fracture, qu'il s'agisse de cultiver les voix de l'opposition, de faire pression sur leurs lignes d'approvisionnement ou de retourner les officiers contre leurs commandants. Un gouvernement sans base populaire n'est pas difficile à démanteler."

 VIE_Negotiate_Brevet_Lines: "Négocier les lignes Brevet"
 VIE_Negotiate_Brevet_Lines_desc: "Les lignes Brevet, les frontières nautiques qui séparent les revendications nationalistes chinoises et vietnamiennes, ont été un point de discorde. Le Kuomintang a tenté de laisser entendre qu'il se considère comme le propriétaire légitime des îles vietnamiennes du Sud. Cela nous oblige à négocier avec les Cambodgiens pour clarifier la situation frontalière."

 VIE_Regarding_French_Drawn_Borders: "À propos des frontières françaises tracées"
 VIE_Regarding_French_Drawn_Borders_desc: "Dans nos conflits frontaliers persistants avec les nationalistes chinois, nous devrons nous appuyer et éventuellement retravailler les frontières classiques écrites par nos suzerains coloniaux d'origine. Longtemps justes et solides, il faut désormais les retravailler et faire en sorte que ces pitoyables querelles cessent."

 VIE_Accept_DeFacto_TranNinh: "Accepter les frontières de facto"
 VIE_Accept_DeFacto_TranNinh_desc: "Dans un effort pour ramener la paix, nous avons choisi d'accepter les frontières tracées par les Français. Même si nous ne pensons pas que cela punisse le KMT pour ses efforts contre nous à nos frontières, ces frontières, correctement respectées, fonctionneront."

 VIE_Beg_Crown_Domain_French_Renouncement: "Suppliez la France de renoncer à son soutien aux domaines de la Couronne"
 VIE_Beg_Crown_Domain_French_Renouncement_desc: "Nos alliés français nous ont, par inadvertance, causé un casse-tête politique en ne dénonçant pas carrément ou en ne renonçant pas à l'emprise que la couronne a exercée sur le peuple jusqu'à présent. Même si la France n'y voit pas de mal, elle crée en fait une résistance à notre gouvernement dans les régions où les convictions royalistes sont fortes."

 VIE_Claim_TranNinh: "Réclamez Tran-Ninh"
 VIE_Claim_TranNinh_desc: "Avec la question de nos frontières en suspens, nous devons profiter de l'occasion pour revendiquer la région de Tran Ninh, pleine de villageois et de personnes qui s'identifient comme Vietnamiens et qui nous sont plus étroitement liées que les Laotiens."

 VIE_Announce_Victory_over_Communism: "Annoncer notre victoire sur le communisme"
 VIE_Announce_Victory_over_Communism_desc: "Notre long cauchemar national est passé, notre victoire sur les communistes est totale et nous sommes prêts à déclarer notre prochaine déclaration selon laquelle le Vietnam n'est plus un État infesté de rouge !"

 VIE_Accept_Geneva_Treaty: "Acceptez la Conférence de Genève"
 VIE_Accept_Geneva_Treaty_desc: "Nos ennemis ignobles et cruels du Nord nous ont combattus jusqu'à une impasse, et nos alliés politiques nous mettent dans une impasse, disant que nous devrions accepter les conditions présentées à Genève qui diviseraient notre pays en deux. Même si nous détestons cette idée de tout notre esprit, nous ne pouvons nier que la guerre a progressé d'une manière dont nous ne pouvons garantir notre succès. Nous devons serrer les dents et accepter les conditions."

 VIE_Amalgamatize_VeBinh_Paramilitaries: "Fusionner les paramilitaires de Ve-Binh"
 VIE_Amalgamatize_VeBinh_Paramilitaries_desc: "Pour gagner le conflit, nous devrons recruter les sectes paramilitaires qui, jusqu'à récemment, n'étaient pas intéressées à prendre parti. Leurs efforts contribueront à apporter stabilité et légitimité à notre régime."

 VIE_Recommision_WW_Native_Veterns: "Remise en service des anciens combattants autochtones de la Première et de la Seconde Guerre mondiale"
 VIE_Recommision_WW_Native_Veterns_desc: "Notre efficacité au combat ne s'étend que jusqu'à notre état-major. Pour gagner la guerre, nous devrons faire appel à des dirigeants vétérans qui ont combattu dans les plus grandes guerres de notre génération. Leurs services assureront notre victoire dans toute lutte."

 VIE_Recall_French_ProFrench_Native_Officers: "Rappel des officiers autochtones français et pro-français"
 VIE_Recall_French_ProFrench_Native_Officers_desc: "Pour vaincre un nouvel ennemi, nous devons conclure des accords avec de vieux amis. Les forces françaises et leurs alliés qui ont été expulsés du pays doivent revenir, afin de renverser la vapeur contre l'un de nos ennemis."

 VIE_Organize_VoBi_Mil_Academies: "Organiser des académies militaires autochtones Vo-Bi"
 VIE_Organize_VoBi_Mil_Academies_desc: "Notre tradition militaire est née dans le feu de nos conflits avec nos oppresseurs. À ce titre, nous avons accès à certains des meilleurs professeurs de guerre du pays et nous pouvons les utiliser pour former notre prochaine génération de héros et de commandants."

 VIE_National_Army_Vietnam: "L'Armée nationale du Vietnam"
 VIE_National_Army_Vietnam_desc: "L'heure est venue de l'unité de la nation dans la lutte à laquelle nous sommes confrontés. Avec cette déclaration et quelques réorganisations, l'Armée nationale du Vietnam nous mènera à la gloire."

 VIE_Organize_Vietnamese_BoQuocPhong: "Organiser le Bo Quoc-Phong"
 VIE_Organize_Vietnamese_BoQuocPhong_desc: "Nos efforts dans les campagnes ont conduit à la nécessité d'une organisation des forces et d'une évaluation de la stratégie que nous avons employée. Un nouveau regard des généraux pourrait apporter les réponses dont nous avons besoin."

 VIE_Form_JointStaffs: "Former l'état-major interarmées"
 VIE_Form_JointStaffs_desc: "Il est temps de rassembler les meilleurs esprits du Vietnam pour décider du cours de la guerre. Notre gouvernement a besoin d'un état-major commun pour prendre les décisions clés qui mettront fin à cette guerre par une victoire."

 VIE_Organize_National_Mobilization: "Organiser la mobilisation nationale"
 VIE_Organize_National_Mobilization_desc: "Le moment est venu d'organiser et de développer nos forces pour le combat à venir. Nous devons sonner les klaxons de la mobilisation afin de détruire nos ennemis avec la force de nos nouvelles capacités."

 VIE_Incorporate_Religious_Sects_BinhXuyen_Forces: "Incorporer les sectes religieuses et les forces Binh-Xuyen"
 VIE_Incorporate_Religious_Sects_BinhXuyen_Forces_desc: "Afin de gagner en légitimité dans le Sud, nous coopérons le plus souvent avec des entités qui ne sont pas totalement favorables à notre cause. Les sectes religieuses du delta du Mékong et le syndicat du crime Binh-Xuyen sont une épine dans notre pied depuis des années, mais si nous parvenons à les « convaincre » de travailler avec nous, nous aurons gagné un allié puissant."

 VIE_Deal_Leroys_Ambitions: "Gérer les ambitions de Leroy"
 VIE_Deal_Leroys_Ambitions_desc: "Il est temps d'examiner les options. La situation avec Leroy est dans une impasse et nous n'aurons peut-être pas d'autre chance de prendre une décision sur ce qu'il faut faire."

 VIE_Rescue_PhatDiem_Catholic_Militias: "Sauvez les milices catholiques de Phat-Diem"
 VIE_Rescue_PhatDiem_Catholic_Militias_desc: "Les milices catholiques dans et autour de la ville de Saigon ont eu du mal à faire face aux forces présentes dans la région. Les aider entraînera des problèmes avec la population bouddhiste de la région, mais c'est un compromis que nous devons être prêts à faire afin de conserver notre emprise sur la région."

 VIE_Expand_QuanCu_Foundries: "Développer les fonderies Quan-cu"
 VIE_Expand_QuanCu_Foundries_desc: "La paix étant assurée à Saigon, nous pouvons désormais commencer à travailler sur nos fondations économiques. Les fonderies de Quan-cu joueront un rôle important dans la revitalisation de notre base militaro-industrielle et nous donneront un avantage sur nos ennemis."

 VIE_Contact_PhuDai_Army: "Contactez l'armée de Phu-Dai"
 VIE_Contact_PhuDai_Army_desc: "Nous avons pris des dispositions pour contacter un éventuel allié important dans notre Nord-Est. L'île de Phu-Quoc est habitée par des chefs de guerre et d'anciens responsables sympathisants de notre gouvernement, et nous envisageons d'en prendre le contrôle."

 VIE_Contact_DaiViet_War_Bases: "Contacter les bases de guerre du Dai-Viet"
 VIE_Contact_DaiViet_War_Bases_desc: "Il a été porté à notre attention que le Parti Dai-Viet et ses paramilitaires, dont le Hung-Viet et le Viet-Sinh Doan, s'organisent et s'étendent dans les bases suivantes : Nguyen-Hue et Chau-Doc. Notre plus grande préoccupation est de saisir rapidement leurs actifs et leurs bases pour notre effort de protection nationale."

 VIE_Organize_Recon_Armored_Battalions: "Organiser des bataillons blindés de reconnaissance"
 VIE_Organize_Recon_Armored_Battalions_desc: "Investir dans des armements meilleurs et plus meurtriers est primordial dans cette lutte. Nous devons trouver un moyen de faire venir du matériel plus lourd pour armer nos unités de reconnaissance."

 VIE_Section_Marine: "Section Marine"
 VIE_Section_Marine_desc: "Avec son long littoral et ses nombreuses routes commerciales maritimes, notre jeune nation a cruellement besoin d'une marine dédiée pour protéger ses eaux territoriales et ses voies maritimes vitales. Cette évolution était une réponse naturelle à l'importance croissante de la sécurité maritime dans la sauvegarde de la souveraineté du pays et la lutte contre les menaces régionales émergentes.\n\nLa formation de la Section Marine de l'Armée nationale marquera une étape cruciale dans notre histoire militaire, garantissant au Vietnam une formidable présence non seulement sur terre mais aussi en mer. Equipé de navires modernes, de patrouilleurs et de moyens de défense côtière grâce au soutien français, notre objectif est de devenir une force renommée dans les eaux turbulentes de l'Asie du Sud-Est."

 VIE_Establish_DINA_Units: "Création des unités DINA"
 VIE_Establish_DINA_Units_desc: "La Division Navale d'Assaut (DINA) sera créée en tant qu'unités maritimes mécanisées d'élite. Ces forces spécialisées combineront des capacités navales avec une infanterie mécanisée, créant ainsi une formidable force d'assaut amphibie. Les unités DINA seront équipées des derniers équipements français et formées aux opérations côtières complexes."

 VIE_Form_Infanterie_Marine: "Former l'Infanterie Marine"
 VIE_Form_Infanterie_Marine_desc: "Les divisions maritimes constituent l'épine dorsale des opérations militaires en Asie, et nous devrions leur emboîter le pas. La formation des hommes et l'acquisition du matériel pour la formation initiale permettront de nous préparer à une partie unique de la guerre."

 VIE_Form_NhaTrang_Training_Center: "Créer le Centre de formation des officiers de marine de Nha-Trang"
 VIE_Form_NhaTrang_Training_Center_desc: "Nha-Trang deviendra le centre de formation des officiers de marine. Ce centre de formation formera des officiers de marine qualifiés, capables de commander notre flotte en pleine croissance. Le centre offrira une formation complète sur les tactiques navales, les opérations navales et la stratégie maritime, garantissant ainsi à notre marine le leadership dont elle a besoin."

 VIE_Expand_LienDoan_TuanGiang: "Agrandissez le Lien-Doan Tuan-Giang"
 VIE_Expand_LienDoan_TuanGiang_desc: "Pour accroître nos capacités navales, nous devons acquérir davantage de navires. Les Français disposent des équipements et des capacités dont nous avons besoin, et nous devons procéder à des actions diplomatiques pour en acquérir davantage."

 VIE_Recieve_French_Naval_Equipment: "Recevez du matériel naval français"
 VIE_Recieve_French_Naval_Equipment_desc: "A l'approche de la Conférence de Genève, les Français s'apprêtent à nous transférer des moyens navals. Nous recevrons du matériel naval français, notamment des navires, des péniches de débarquement et du matériel maritime. Ce transfert renforcera considérablement nos capacités navales et nous fournira les outils nécessaires à la défense côtière et aux opérations amphibies."

 VIE_Section_Air: "Section Aérienne"
 VIE_Section_Air_desc: "Les conflits au Vietnam ont été principalement décidés par la puissance aérienne, et nous avons eu des problèmes dans le passé. Concevoir et produire notre propre puissance aérienne sera difficile, mais nous pouvons lancer le processus de production d'une force aérienne mortelle et redoutable."

 VIE_Vietnamized_Air_Officer_Corp: "Vietnamiser le Corps des Officiers de l'Air"
 VIE_Vietnamized_Air_Officer_Corp_desc: "Les académies que nous avons ouvertes donnent des résultats, nos usines sont prêtes à produire de nouveaux avions et nous pouvons enfin commencer à voler. Le chemin pour commencer sera semé d'embûches, mais c'est une mission à laquelle nous ne pouvons échouer."

 VIE_Recruit_TieuDoan_NhayDu: "Recrutez le Tieu-Doan Nhay-Du"
 VIE_Recruit_TieuDoan_NhayDu_desc: "L'utilisation de divisions de parachutistes en temps de guerre est devenue un incontournable, et avec nos nouvelles capacités aériennes, nous devons explorer les possibilités d'en faire un élément essentiel de la manière dont nous menons la guerre dans les Hauts Plateaux du Centre."

 VIE_Expand_PhiTruong_QuanSu_NhaTrang: "Développer Phi-Truong Quan-Su Nha-Trang"
 VIE_Expand_PhiTruong_QuanSu_NhaTrang_desc: "Si de nombreux anciens aérodromes français et britanniques sont à notre portée, nous devons également construire les nôtres, et la vallée de Nha-Trang est l'endroit idéal pour lancer et coordonner des missions."

 VIE_Mission_Militarie_Franccaise_Indochine: "Mission Militaire en Indochine Française"
 VIE_Mission_Militarie_Franccaise_Indochine_desc: "Nos alliés français ont accepté de fournir davantage de soutien à notre lutte. Avec notre soutien, nous pouvons acquérir des conseillers pour former nos troupes et un approvisionnement en armes."

 VIE_Coordinate_with_CEFEO: "Coordonner avec le CEFEO"
 VIE_Coordinate_with_CEFEO_desc: "Pour continuer à contrôler les campagnes, nous devons nous tourner vers d'autres options étrangères. Nous pouvons nous tourner vers le CEFEO pour nous fournir des légions étrangères pour renforcer nos forces."

 VIE_Request_Control_over_French_KhinhQuan: "Demander le contrôle du Khinh-Quan français"
 VIE_Request_Control_over_French_KhinhQuan_desc: "Les forces sous contrôle français doivent être utilisées à notre profit. Nous avons besoin de toutes les forces que nous pouvons acquérir dans cette lutte."

 VIE_Organize_ComManDo_Units: "Organiser des unités Con-Man-Do"
 VIE_Organize_ComManDo_Units_desc: "Nous devons encore renforcer nos forces pour sécuriser le pays. La création d'une division du Con-man-do nous aidera à maintenir notre sécurité dans la région."

 VIE_Implement_French_Equipment_Tactics: "Mettre en oeuvre des équipements et des chars français"
 VIE_Implement_French_Equipment_Tactics_desc: "Nos alliés français ont accepté de nous envoyer une injection massive d'armes et d'armures lourdes, et grâce à ces matériaux, nous pouvons commencer à faire de la jungle un obstacle moins important. Avec ces armes, nous pouvons transformer nos divisions avancées en un outil de guerre mortel."

 VIE_Accept_American_Mil_Aid: "Acceptez l'aide militaire américaine"
 VIE_Accept_American_Mil_Aid_desc: "Les Américains, comme les Français, ont soutenu nos efforts, mais nous devons désormais obtenir davantage d'aide. L'injection de nouvelles armes américaines et l'utilisation de la puissance industrielle américaine pour produire davantage d'équipements pour nous constitueront une étape cruciale dans notre capacité à mener des opérations."

 VIE_Implement_Trad_Tactics: "Mettre en oeuvre des tactiques traditionnelles"
 VIE_Implement_Trad_Tactics_desc: "Les tactiques d'autrefois ne sont souvent plus celles d'aujourd'hui, mais les Français ne comprennent pas le terrain de jeu. Nous combattons dans cet endroit depuis la nuit des temps, et nous connaissons mieux que quiconque la terre et la façon dont la terre joue en notre faveur, et nous utiliserons cela pour détruire nos ennemis."

 VIE_Encourage_Homemade_Arms: "Encourager les armements artisanaux"
 VIE_Encourage_Homemade_Arms_desc: "Cette guerre est faite à partir de graines de convenance, et les gens ont été contraints de faire preuve de créativité avec leurs capacités pour défendre leurs foyers. Nous devons encourager ces actions afin de ralentir la progression de notre ennemi dans les campagnes."

 VIE_Expand_Territoire_Autonome_Battalions: "Développer les bataillons du Territoire Autonome"
 VIE_Expand_Territoire_Autonome_Battalions_desc: "La meilleure solution pour assurer la sécurité des campagnes est de renforcer la force de nos forces. Dans les Terres Amérindiennes, de nombreuses milices et forces de seigneurs de guerre peuvent être recrutées pour notre cause. Leur soutien nous mènera à la victoire dans les campagnes."

 VIE_Modernize_Tribal_Arsenals: "Moderniser les arsenaux tribaux"
 VIE_Modernize_Tribal_Arsenals_desc: "Les assistants tribaux des Central Highlights ont interféré avec les efforts de nos ennemis, et cela doit être encouragé. Nous pouvons leur fournir des armes et faire en sorte que leurs efforts soient plus meurtriers."

 VIE_Encourage_Terror_Tactics: "Encourager les tactiques terroristes"
 VIE_Encourage_Terror_Tactics_desc: "Combattre le feu par le feu est tout à fait approprié dans ce conflit sanglant. Nos ennemis ne s'arrêtent pas dans leurs actions brutales, et nous non plus. Il est temps de les frapper là où ça fait mal, et nous avons les moyens d'affaiblir leur efficacité"

 VIE_Form_Muong_National_Army: "Former l'Armée Nationale Muong"
 VIE_Form_Muong_National_Army_desc: "Nous avons préparé des hommes et du matériel pour la formation de l'Armée nationale Muong, afin de projeter notre contrôle sur la région et d'assurer la sécurité face à nos ennemis."

 VIE_Establish_Autonomous_Command_Staffs: "Créer des états-majors de commandement autonomes"
 VIE_Establish_Autonomous_Command_Staffs_desc: "Une structure de commandement autonome et élastique est nécessaire pour une guerre aussi compliquée que celle-ci. Nous allons élargir et restructurer notre chaîne de commandement afin de mieux répondre à la situation."

 VIE_Modernize_Autonomous_Armies_Orgs: "Moderniser les organisations des armées autonomes"
 VIE_Modernize_Autonomous_Armies_Orgs_desc: "Avec le développement de notre propre force militaire, il serait logique d'envisager de faire de même avec nos alliés, seigneurs de guerre. Leur fournir des armes et des équipements pour les maintenir à jour nous aidera à combattre nos ennemis."

 VIE_Incorporate_Irregular_Units: "Incorporer des unités irrégulières"
 VIE_Incorporate_Irregular_Units_desc: "À mesure que la guerre continue, les forces irrégulières des groupes tribaux dans les campagnes se renforcent. Aujourd'hui, avec l'intensification de la guerre, nous devons à nouveau puiser dans leurs forces pour combattre l'influence de l'ennemi depuis les campagnes."

 VIE_Perfect_Guerrilla_War: "Guérilla parfaite"
 VIE_Perfect_Guerrilla_War_desc: "Nos ennemis l'ont utilisé, mais c'est nous qui le perfectionnerons. Comprendre comment contrôler le champ de bataille dans son ensemble, des hameaux aux sols de la jungle, sera crucial pour gagner les conflits dans notre pays, et cela coûtera tout à un pays pour oser nous attaquer."

 VIE_Section_Air_Irregular: "Section Aérienne"
 VIE_Section_Air_Irregular_desc: "Les avions français en service ici ont connu un grand succès dans leurs opérations, et nous devons les acquérir pour former nos futurs pilotes. Nous devons également obtenir des conseillers pour nous aider à former la nouvelle génération de commandants aériens."

 VIE_ReEstablish_VietKienQuocQuan_Mil: "Rétablir le « Viet-Kien Quoc-Quan »"
 VIE_ReEstablish_VietKienQuocQuan_Mil_desc: "Notre armée est actuellement désorganisée car les milices religieuses et les paramilitaires Binh-Xuyen contrôlent une partie importante de notre nation et de nos forces armées. Consolidons une armée professionnelle dans notre guerre contre le Viet-minh."

 VIE_CD_Organize_VoBi_Mil_Academies: "Organiser des académies militaires autochtones Vo-Bi"
 VIE_CD_Organize_VoBi_Mil_Academies_desc: "Notre tradition militaire est née dans le feu de nos conflits avec nos oppresseurs. À ce titre, nous avons accès à certains des meilleurs professeurs de guerre du pays et nous pouvons les utiliser pour former notre prochaine génération de héros et de commandants."

 VIE_CD_National_Army_Vietnam: "L'Armée nationale du Vietnam"
 VIE_CD_National_Army_Vietnam_desc: "L'heure est venue de l'unité de la nation dans la lutte à laquelle nous sommes confrontés. Avec cette déclaration et quelques réorganisations, l'Armée nationale du Vietnam nous mènera à la gloire."

 VIE_CD_Recommision_WW_Native_Veterns: "Remise en service des anciens combattants autochtones de la Première et de la Seconde Guerre mondiale"
 VIE_CD_Recommision_WW_Native_Veterns_desc: "Notre efficacité au combat ne s'étend que jusqu'à notre état-major. Pour gagner la guerre, nous devrons faire appel à des dirigeants vétérans qui ont combattu dans les plus grandes guerres de notre génération. Leurs services assureront notre victoire dans toute lutte."

 VIE_CD_Organize_Vietnamese_BoQuocPhong: "Organiser le Bo Quoc-Phong"
 VIE_CD_Organize_Vietnamese_BoQuocPhong_desc: "Nos efforts dans les campagnes ont conduit à la nécessité d'une organisation des forces et d'une évaluation de la stratégie que nous avons employée. Un nouveau regard des généraux pourrait apporter les réponses dont nous avons besoin."

 VIE_CD_Form_JointStaffs: "Former l'état-major interarmées"
 VIE_CD_Form_JointStaffs_desc: "Il est temps de rassembler les meilleurs esprits du Vietnam pour décider du cours de la guerre. Notre gouvernement a besoin d'un état-major commun pour prendre les décisions clés qui mettront fin à cette guerre par une victoire."

 VIE_CD_Organize_National_Mobilization: "Organiser la mobilisation nationale"
 VIE_CD_Organize_National_Mobilization_desc: "Le moment est venu d'organiser et de développer nos forces pour le combat à venir. Nous devons sonner les klaxons de la mobilisation afin de détruire nos ennemis avec la force de nos nouvelles capacités."

 VIE_CD_Incorporate_Religious_Sects_BinhXuyen_Forces: "Incorporer les sectes religieuses et les forces Binh-Xuyen"
 VIE_CD_Incorporate_Religious_Sects_BinhXuyen_Forces_desc: "Afin de gagner en légitimité dans le Sud, nous coopérons le plus souvent avec des entités qui ne sont pas totalement favorables à notre cause. Les sectes religieuses du delta du Mékong et le syndicat du crime Binh-Xuyen sont une épine dans notre pied depuis des années, mais si nous parvenons à les « convaincre » de travailler avec nous, nous aurons gagné un allié puissant."

 VIE_CD_Deal_Leroys_Ambitions: "Gérer les ambitions de Leroy"
 VIE_CD_Deal_Leroys_Ambitions_desc: "Il est temps d'examiner les options. La situation avec Leroy est dans une impasse et nous n'aurons peut-être pas d'autre chance de prendre une décision sur ce qu'il faut faire."

 VIE_CD_Rescue_PhatDiem_Catholic_Militias: "Sauvez les milices catholiques de Phat-Diem"
 VIE_CD_Rescue_PhatDiem_Catholic_Militias_desc: "Les milices catholiques dans et autour de la ville de Saigon ont eu du mal à faire face aux forces présentes dans la région. Les aider entraînera des problèmes avec la population bouddhiste de la région, mais c'est un compromis que nous devons être prêts à faire afin de conserver notre emprise sur la région."

 VIE_CD_Expand_QuanCu_Foundries: "Développer les fonderies Quan-cu"
 VIE_CD_Expand_QuanCu_Foundries_desc: "La paix étant assurée à Saigon, nous pouvons désormais commencer à travailler sur nos fondations économiques. Les fonderies de Quan-cu joueront un rôle important dans la revitalisation de notre base militaro-industrielle et nous donneront un avantage sur nos ennemis."

 VIE_CD_Contact_PhuDai_Army: "Contactez l'armée de Phu-Dai"
 VIE_CD_Contact_PhuDai_Army_desc: "Nous avons pris des dispositions pour contacter un éventuel allié important dans notre Nord-Est. L'île de Phu-Quoc est habitée par des chefs de guerre et d'anciens responsables sympathisants de notre gouvernement, et nous envisageons d'en prendre le contrôle."

 VIE_CD_Contact_DaiViet_War_Bases: "Contacter les bases de guerre du Dai-Viet"
 VIE_CD_Contact_DaiViet_War_Bases_desc: "Il a été porté à notre attention que le Parti Dai-Viet et ses paramilitaires, dont le Hung-Viet et le Viet-Sinh Doan, s'organisent et s'étendent dans les bases suivantes : Nguyen-Hue et Chau-Doc. Notre plus grande préoccupation est de saisir rapidement leurs actifs et leurs bases pour notre effort de protection nationale."

 VIE_CD_Organize_Recon_Armored_Battalions: "Organiser des bataillons blindés de reconnaissance"
 VIE_CD_Organize_Recon_Armored_Battalions_desc: "Investir dans des armements meilleurs et plus meurtriers est primordial dans cette lutte. Nous devons trouver un moyen de faire venir du matériel plus lourd pour armer nos unités de reconnaissance."

 VIE_CD_Section_Marine: "Section Marine"
 VIE_CD_Section_Marine_desc: "Avec son long littoral et ses nombreuses routes commerciales maritimes, notre jeune nation a cruellement besoin d'une marine dédiée pour protéger ses eaux territoriales et ses voies maritimes vitales. Cette évolution était une réponse naturelle à l'importance croissante de la sécurité maritime dans la sauvegarde de la souveraineté du pays et la lutte contre les menaces régionales émergentes.\n\nLa formation de la Section Marine de l'Armée nationale marquera une étape cruciale dans notre histoire militaire, garantissant au Vietnam une formidable présence non seulement sur terre mais aussi en mer. Equipé de navires modernes, de patrouilleurs et de moyens de défense côtière grâce au soutien français, notre objectif est de devenir une force renommée dans les eaux turbulentes de l'Asie du Sud-Est."

 VIE_CD_Establish_DINA_Units: "Création des unités DINA"
 VIE_CD_Establish_DINA_Units_desc: "La Division Navale d'Assaut (DINA) sera créée en tant qu'unités maritimes mécanisées d'élite. Ces forces spécialisées associeront des capacités navales à une infanterie mécanisée, créant une formidable force d'assaut amphibie dotée des derniers équipements français et entraînée aux opérations côtières complexes."

 VIE_CD_Form_Infanterie_Marine: "Former l'Infanterie Marine"
 VIE_CD_Form_Infanterie_Marine_desc: "Les divisions maritimes constituent l'épine dorsale des opérations militaires en Asie, et nous devrions leur emboîter le pas. La formation des hommes et l'acquisition du matériel pour la formation initiale permettront de nous préparer à une partie unique de la guerre."

 VIE_CD_Form_NhaTrang_Training_Center: "Créer le Centre de formation des officiers de marine de Nha-Trang"
 VIE_CD_Form_NhaTrang_Training_Center_desc: "Nha-Trang deviendra le centre de formation des officiers de marine. Cette installation formera des officiers de marine qualifiés capables de commander notre flotte en pleine croissance, offrant une formation complète sur les tactiques navales, les opérations navales et la stratégie maritime pour garantir que notre marine dispose du leadership dont elle a besoin."

 VIE_CD_Expand_LienDoan_TuanGiang: "Agrandissez le Lien-Doan Tuan-Giang"
 VIE_CD_Expand_LienDoan_TuanGiang_desc: "Pour accroître nos capacités navales, nous devons acquérir davantage de navires. Les Français disposent des équipements et des capacités dont nous avons besoin, et nous devons procéder à des actions diplomatiques pour en acquérir davantage."

 VIE_CD_Recieve_French_Naval_Equipment: "Recevez du matériel naval français"
 VIE_CD_Recieve_French_Naval_Equipment_desc: "A l'approche de la Conférence de Genève, les Français s'apprêtent à nous transférer des moyens navals. Nous recevrons du matériel naval français, notamment des navires, des péniches de débarquement et du matériel maritime, un transfert qui renforcera considérablement nos capacités de défense côtière et amphibies."

 VIE_CD_Section_Air: "Section Aérienne"
 VIE_CD_Section_Air_desc: "Les conflits au Vietnam ont été principalement décidés par la puissance aérienne, et nous avons eu des problèmes dans le passé. Concevoir et produire notre propre puissance aérienne sera difficile, mais nous pouvons lancer le processus de production d'une force aérienne mortelle et redoutable."

 VIE_CD_Vietnamized_Air_Officer_Corp: "Vietnamiser le Corps des Officiers de l'Air"
 VIE_CD_Vietnamized_Air_Officer_Corp_desc: "Les académies que nous avons ouvertes donnent des résultats, nos usines sont prêtes à produire de nouveaux avions et nous pouvons enfin commencer à voler. Le chemin pour commencer sera semé d'embûches, mais c'est une mission à laquelle nous ne pouvons échouer."

 VIE_CD_Recruit_TieuDoan_NhayDu: "Recrutez le Tieu-Doan Nhay-Du"
 VIE_CD_Recruit_TieuDoan_NhayDu_desc: "L'utilisation de divisions de parachutistes en temps de guerre est devenue un incontournable, et avec nos nouvelles capacités aériennes, nous devons explorer les possibilités d'en faire un élément essentiel de la manière dont nous menons la guerre dans les Hauts Plateaux du Centre."

 VIE_CD_Expand_PhiTruong_QuanSu_NhaTrang: "Développer Phi-Truong Quan-Su Nha-Trang"
 VIE_CD_Expand_PhiTruong_QuanSu_NhaTrang_desc: "Si de nombreux anciens aérodromes français et britanniques sont à notre portée, nous devons également construire les nôtres, et la vallée de Nha-Trang est l'endroit idéal pour lancer et coordonner des missions."

 VIE_CD_Mission_Militarie_Franccaise_Indochine: "Mission Militaire en Indochine Française"
 VIE_CD_Mission_Militarie_Franccaise_Indochine_desc: "Nos alliés français ont accepté de fournir davantage de soutien à notre lutte. Avec notre soutien, nous pouvons acquérir des conseillers pour former nos troupes et un approvisionnement en armes."

 VIE_CD_Coordinate_with_CEFEO: "Coordonner avec le CEFEO"
 VIE_CD_Coordinate_with_CEFEO_desc: "Pour continuer à contrôler les campagnes, nous devons nous tourner vers d'autres options étrangères. Nous pouvons nous tourner vers le CEFEO pour nous fournir des légions étrangères pour renforcer nos forces."

 VIE_CD_Request_Control_over_French_KhinhQuan: "Demander le contrôle du Khinh Quan français"
 VIE_CD_Request_Control_over_French_KhinhQuan_desc: "Les forces sous contrôle français doivent être utilisées à notre profit. Nous avons besoin de toutes les forces que nous pouvons acquérir dans cette lutte."

 VIE_CD_Organize_ComManDo_Units: "Organiser des unités Con-Man-Do"
 VIE_CD_Organize_ComManDo_Units_desc: "Nous devons encore renforcer nos forces pour sécuriser le pays. La création d'une division du Con-man-do nous aidera à maintenir notre sécurité dans la région."

 VIE_CD_Implement_French_Equipment_Tactics: "Mettre en oeuvre des équipements et des chars français"
 VIE_CD_Implement_French_Equipment_Tactics_desc: "Nos alliés français ont accepté de nous envoyer une injection massive d'armes et d'armures lourdes, et grâce à ces matériaux, nous pouvons commencer à faire de la jungle un obstacle moins important. Avec ces armes, nous pouvons transformer nos divisions avancées en un outil de guerre mortel."

 VIE_CD_Accept_American_Mil_Aid: "Acceptez l'aide militaire américaine"
 VIE_CD_Accept_American_Mil_Aid_desc: "Les Américains, comme les Français, ont soutenu nos efforts, mais nous devons désormais obtenir davantage d'aide. L'injection de nouvelles armes américaines et l'utilisation de la puissance industrielle américaine pour produire davantage d'équipements pour nous constitueront une étape cruciale dans notre capacité à mener des opérations."

 VIE_CD_Implement_Trad_Tactics: "Mettre en oeuvre des tactiques traditionnelles"
 VIE_CD_Implement_Trad_Tactics_desc: "Les tactiques d'autrefois ne sont souvent plus celles d'aujourd'hui, mais les Français ne comprennent pas le terrain de jeu. Nous combattons dans cet endroit depuis la nuit des temps, et nous connaissons mieux que quiconque la terre et la façon dont la terre joue en notre faveur, et nous utiliserons cela pour détruire nos ennemis."

 VIE_CD_Encourage_Homemade_Arms: "Encourager les armements artisanaux"
 VIE_CD_Encourage_Homemade_Arms_desc: "Cette guerre est faite à partir de graines de convenance, et les gens ont été contraints de faire preuve de créativité avec leurs capacités pour défendre leurs foyers. Nous devons encourager ces actions afin de ralentir la progression de notre ennemi dans les campagnes."

 VIE_Northern_Question: "Libération du Nord ?"
 VIE_Northern_Question_desc: "Notre pays a été divisé pendant assez longtemps par des idéologies et des frontières géographiques différentes. Il est temps de remettre en question ce malheureux divorce alors que nos peuples commencent à se faire de plus en plus entendre sur une éventuelle reprise de la reconquête de l'Unification « Bac-tien » comme depuis l'union avec la province du Sud du Vietnam ? Il n'y a eu aucun effort supplémentaire pour faire pression sur le Nord afin qu'il accepte le rêve de Bao-Dai d'un Vietnam unifié !"

 VIE_Wait_It_Out: "Attendons..."
 VIE_Wait_It_Out_desc: "Nous ne sommes pas encore prêts, ni maintenant ni dans un avenir proche. Ils sont profondément enracinés et très fanatiques des mensonges marxistes. Nous devrons considérer toutes les options d'approche disponibles afin que l'objectif final soit que l'unification ne se transforme pas en un désastre national."

 VIE_Prepare_Army: "Préparez l'armée!"
 VIE_Prepare_Army_desc: "Le moment est venu et la libération du Nord « Bac-tien » de notre nation est devant nous. Le gouvernement a publié des publications mobilisant tous les conscrits et appelant toutes les milices et sectes religieuses à tourner leur regard vers le nord. L'unification est bientôt à nos portes et les démons communistes seront anéantis !"

 VIE_Northern_Question_CD: "Libération du Nord ?"
 VIE_Northern_Question_CD_desc: "Notre pays a été divisé pendant assez longtemps par des idéologies et des frontières géographiques différentes. Il est temps de remettre en question ce malheureux divorce alors que nos peuples commencent à se faire de plus en plus entendre sur une éventuelle reprise de la reconquête de l'Unification « Bac-tien » comme depuis l'union avec la province du Sud du Vietnam ? Il n'y a eu aucun effort supplémentaire pour faire pression sur le Nord afin qu'il accepte le rêve de Cuong-De d'un Vietnam unifié !"

 VIE_Wait_It_Out_CD: "Attendons..."
 VIE_Wait_It_Out_CD_desc: "Nous ne sommes pas encore prêts, ni maintenant ni dans un avenir proche. Ils sont profondément enracinés et très fanatiques des mensonges marxistes. Nous devrons considérer toutes les options d'approche disponibles afin que l'objectif final soit que l'unification ne se transforme pas en un désastre national."

 VIE_Prepare_Army_CD: "Préparez l'armée!"
 VIE_Prepare_Army_CD_desc: "Le moment est venu et la libération du Nord « Bac-tien » de notre nation est devant nous. Le gouvernement a publié des publications mobilisant tous les conscrits et appelant toutes les milices et sectes religieuses à tourner leur regard vers le nord. L'unification est bientôt à nos portes et les démons communistes seront anéantis !"

 VIE_Elysee_Accords: "Le traité de l'Élysées"
 VIE_Elysee_Accords_desc: "Le moment est enfin venu pour les Français de nous donner l'autonomie que nous méritons. Le traité qui résultera de ces négociations nous permettra de contrôler notre propre destin et de tracer notre propre voie."

 VIE_Solidify_BaoDai_Authority: "Solidifier l'autorité de Bao-Dai"
 VIE_Solidify_BaoDai_Authority_desc: "Le contrôle de l'empereur sur le pays repose sur une tradition et une légitimité fortes. Son règne sera fort et les autres groupes nationalistes s'aligneront pour s'assurer que nous en assurions le contrôle total."

 VIE_Pressure_Cochinchina_Reunifcation: "Faire pression pour la réunification de la Cochinchine"
 VIE_Pressure_Cochinchina_Reunifcation_desc: "La région de Cochinchine a résisté à nos demandes de réunification avec le nouveau gouvernement. Des pressions politiques seront nécessaires pour les amener à s'aligner, sinon des problèmes nous amèneront à prendre des mesures aux conséquences désastreuses."

 VIE_Beg_France_Intervention: "Suppliez la France d'intervenir"
 VIE_Beg_France_Intervention_desc: "L'entêtement de la Cochinchine ne nous laisse pas d'autre choix. Nous devons demander aux Français d'intervenir dans cet effort, de faire pression sur la région, par tous les moyens nécessaires, pour qu'elle se joigne au futur gouvernement de Bao-Dai."

 VIE_Reincorporate_Cochinchina: "Réincorporer la Cochinchine"
 VIE_Reincorporate_Cochinchina_desc: "Avec la Cochinchine qui s'aligne, nous pouvons désormais reprendre les forces à Nam-Ky et proclamer officiellement que le Vietnam est officiellement son propre État. Le plus dur est passé."

 VIE_Proclam_Etat_du_Vietnam: "Proclamer l'État du Vietnam"
 VIE_Proclam_Etat_du_Vietnam_desc: "Notre longue lutte nationale a abouti à la victoire. Liberté de l'injuste oppression française et un gouvernement qui nous appartient. L'empereur Bao-Dai proclamera l'État du Vietnam dans une heure. Quelle époque glorieuse. Viet Nam muon nam!"

 VIE_Sideline_CuongDe_Ambitions: "Mettre à l'écart les ambitions de Cuong-De"
 VIE_Sideline_CuongDe_Ambitions_desc: "L'ambition de Cuong-De de conduire la nation vers une démocratie monarchique est forte, mais Bao-Dai n'est pas aussi passionné. S'assurer que ses ambitions restent discrètes sera un élément essentiel pour garantir le bon déroulement de cette période difficile."

 VIE_CuongDe_Press_Conferences: "Conférences de presse de Cuong-De"
 VIE_CuongDe_Press_Conferences_desc: "Il semble que Cuong-De organise des conférences de presse pour tenter de convaincre les puissances étrangères de soutenir son retour. Écouteons ses communications pour connaître son plan et empêcher son retour au Vietnam."

 VIE_Intercept_CuongDe_Return_Bangkok: "Intercepter Cuong-De à Bangkok"
 VIE_Intercept_CuongDe_Return_Bangkok_desc: "Nous avons reçu des nouvelles selon lesquelles Cuong-De envisageait de se faufiler au Vietnam via Bangkok déguisé. Interceptons-le avant qu'il ne puisse revenir et causer des ennuis."

 VIE_Rebuild_BaoDai_Image: "Reconstruire l'image de Bao-Dai"
 VIE_Rebuild_BaoDai_Image_desc: "L'image publique de Bao-Dai a longtemps été épouvantable en raison de son style de vie hédoniste et de l'ignorance du sort de la nation. Essayons de réhabiliter son image en limitant au maximum les reportages sur ses scandales."

 VIE_Tighten_Noose_On_Western_Journalism: "Resserrer l'étau sur le journalisme occidental"
 VIE_Tighten_Noose_On_Western_Journalism_desc: "La plume est plus puissante que l'épée et nous devons donc la réglementer comme n'importe quelle autre arme. Nous ne pouvons pas laisser des « journalistes » brandir et inventer des fictions dangereuses contre notre gouvernement. À partir d'aujourd'hui, le gouvernement jouera un rôle directeur en veillant à ce que les informations soient plus « factuelles ». Plus important encore, nous veillerons à ce que les journalistes corrompus qui sont payés pour saper le travail du gouvernement ne fassent pas la une ni aucune page sur quoi que ce soit !"

 VIE_Legalize_Casinos_Prostitutions: "Légaliser les casinos et la prostitution"
 VIE_Legalize_Casinos_Prostitutions_desc: "La culture de notre pays est relativement conservatrice, donc ouvrir des casinos et autoriser la prostitution peut sembler une mauvaise idée... Mais cela semble aussi amusant. Avec ces nouvelles industries, nous ouvrirons une nouvelle source de revenus précieuse pour le gouvernement. Nous savons que bon nombre de ces choses se produisent. Que ce soit illégal ou non, autant en profiter. De cette façon, nous pouvons construire notre propre industrie du jeu à Saigon avec le blackjack et les putes. "

 VIE_Erase_Sex_Scandels_PayOff_Debts: "Effacer les scandales sexuels et rembourser les dettes"
 VIE_Erase_Sex_Scandels_PayOff_Debts_desc: "Ce n'est pas facile d'être un leader ; chaque jour, il y a une pression pour prendre la bonne décision, et tout le monde vous fait savoir lorsque vous faites une erreur. Il n'est donc pas étonnant que nous aimions jouer un peu et profiter de la compagnie de beaux compagnons. Malheureusement, le public ne comprend pas le stress du pouvoir, et si la nouvelle de nos « excès » était connue, nous pourrions alors avoir une crise grave. Nous pouvons utiliser notre pouvoir pour nous appuyer sur tous les journalistes d'investigation qui se penchent sur la vie personnelle du président ; les seules histoires sur le leader seront celles où il aidera les vieilles dames à traverser la rue, sans utiliser de prostituées. Nous pouvons également faire appel aux riches bénéficiaires de nos politiques économiques pour obtenir des « dons » afin de nous aider à rembourser nos dettes croissantes. Notre image vertueuse doit être préservée !"

 VIE_Expand_Grande_Monde_Casino: "Agrandir le Casino Grande Monde"
 VIE_Expand_Grande_Monde_Casino_desc: "Les gens adorent jouer ; non seulement nos concitoyens mais aussi les visiteurs étrangers viennent perdre leur argent durement gagné dans nos casinos. Le casino de la Grande-Monde réalise non seulement des bénéfices records, mais il est également le plus grand actuellement en Asie du Sud-Est ; le moment est venu d'agrandir la salle principale du casino. Nous collaborerons avec notre « bon ami » Le-Van-Vien pour ajouter de nouveaux jeux et plus de bars au bâtiment. En plus de cela, il y aura un certain nombre de belles décorations réalisées par des designers de renommée mondiale. Nous aurons un casino qui rivalise avec tout ce qui existe en Asie !"

 VIE_DaLat_Summer_Vacation: "Da-Lat, les vacances d'été"
 VIE_DaLat_Summer_Vacation_desc: "Da Lat, avec son climat frais et ses paysages magnifiques, est depuis longtemps un lieu de retraite privilégié par l'élite. Nous ferons la promotion de Da Lat en tant que destination de vacances d'été, en construisant des complexes hôteliers de luxe et en attirant des visiteurs fortunés. Cela générera des revenus, stimulera le tourisme et créera une image prestigieuse du Vietnam en tant que nation moderne et sophistiquée."

 VIE_Saigon_Pearl_of_Orient: "Saigon, la perle de l'Orient"
 VIE_Saigon_Pearl_of_Orient_desc: "Chaque région a besoin d'un point où chacun veut être, un endroit où tous les luxes et commodités peuvent être trouvés. Saigon sera cette ville, une ville de plaisir où l'argent afflue sans fin. Nous pouvons construire une ville qui émerveillera le reste de l'Asie. Avec un peu d'investissement et le succès continu de notre activité de casino, Saigon sera le Paris de l'Indochine. Nous avons fait le premier pas et il ne nous reste plus qu'à maintenir le cap."

 VIE_Form_CongXa_BietDien: "Former le Cong-Xa Biet-Dien"
 VIE_Form_CongXa_BietDien_desc: "Le Cong-Xa Biet-Dien (bataillon de commandos spéciaux) sera formé en tant qu'unité d'élite des forces spéciales. Ces commandos hautement entraînés seront équipés des derniers équipements français et entraînés aux opérations secrètes, de reconnaissance et aux missions spéciales. Le bataillon constituera notre force de frappe d'élite, capable d'opérer derrière les lignes ennemies."

 VIE_Using_Sect_Resources: "Utiliser les ressources des sectes"
 VIE_Using_Sect_Resources_desc: "Les sectes religieuses contrôlent d'importantes ressources, notamment la terre, l'argent et la main-d'oeuvre. Nous travaillerons à intégrer ces ressources sectaires dans l'économie nationale et l'armée. En coopérant avec les Cao Dai, les Hoa Hao et d'autres sectes, nous pouvons exploiter leur richesse et leurs capacités organisationnelles tout en maintenant leur loyauté envers l'État."

 VIE_Pacifying_NamPhan_Countryside: "Pacifier la campagne de Nam-Phan"
 VIE_Pacifying_NamPhan_Countryside_desc: "La campagne du sud du Vietnam regorge de nombreuses factions qui se disputent l'influence, allant des criminels Binh-Xuyen aux milices religieuses contrôlées par les caodaistes, les hoahaoistes et les catholiques. Maîtrisons ces factions afin de consolider notre contrôle sur le Sud-Vietnam."

 VIE_Request_Control_Over_Crown_Domains: "Demander le contrôle des domaines de la Couronne du Sud"
 VIE_Request_Control_Over_Crown_Domains_desc: "Le domaine de l'empereur des Hauts Plateaux du Centre et les autres territoires autonomes du sud relèvent du commandement de Saigon mais en dehors de l'administration vietnamienne ordinaire. Nous demanderons à la France de reconnaître notre droit de les régler. Les territoires du nord de Tai, Nung, Muong et Tho doivent rester sous la tutelle du CEFEO pendant que la guerre du nord se poursuit."

 VIE_1CP_Directive: "Directive 1-CP"
 VIE_1CP_Directive_desc: "La directive 1CP établira un nouveau cadre politique, nous permettant de nommer un Premier ministre et de former un gouvernement. Cette directive marque une étape importante vers l'autonomie gouvernementale vietnamienne, nous donnant la capacité de prendre nos propres décisions politiques tout en continuant à opérer au sein de la structure coloniale française."

 VIE_Assign_Long_PM: "Attribuer une longue période en tant que Premier ministre"
 VIE_Assign_Long_PM_desc: "Nguyen Phan Long, éminent journaliste et homme politique, sera nommé Premier ministre. Long est connu pour ses opinions modérées et sa capacité à travailler avec les Français tout en défendant les intérêts vietnamiens. Sa nomination apportera stabilité et expérience au gouvernement."

 VIE_Assign_Vinh_PM: "Nommer Vinh comme Premier ministre"
 VIE_Assign_Vinh_PM_desc: "Tran Quang Vinh, un dirigeant de Cao Dai, sera nommé Premier ministre. La nomination de Vinh renforcera nos liens avec la secte Cao Dai et apportera ses ressources et son soutien au gouvernement. Cela contribuera à intégrer les sectes religieuses dans la structure politique nationale."

 VIE_Contain_Diem_Socialist_Ambitions: "Contenir les ambitions socialistes de Diem"
 VIE_Contain_Diem_Socialist_Ambitions_desc: "Ngo Dinh Diem affiche des tendances et des ambitions socialistes qui menacent la stabilité de notre gouvernement. Nous devons contenir son influence et l'empêcher d'acquérir trop de pouvoir. Cela nécessitera des manoeuvres politiques prudentes pour neutraliser son programme socialiste tout en maintenant l'unité du gouvernement."

 VIE_Assign_Huu_PM: "Nommer Huu comme Premier ministre"
 VIE_Assign_Huu_PM_desc: "Tran Van Huu, un administrateur expérimenté, sera nommé Premier ministre. Huu a une réputation de compétence et se concentrera sur la modernisation de l'armée vietnamienne et l'amélioration des relations avec les puissances étrangères. Son leadership apportera professionnalisme et efficacité au gouvernement."

 VIE_Assign_Toan_PM: "Nommer Toan comme Premier ministre"
 VIE_Assign_Toan_PM_desc: "Nguyen Van Toan, un dirigeant de Hoa Hao, sera nommé Premier ministre. La nomination de Toan amènera la secte Hoa Hao au gouvernement et contribuera à intégrer ses partisans dans le système politique national. Son leadership se concentrera sur les réformes sociales et les mesures anticommunistes."

 VIE_Exile_Diem_Political_Opponents: "Exile Diem et nos opposants politiques"
 VIE_Exile_Diem_Political_Opponents_desc: "Ngo Dinh Diem et ses alliés politiques sont devenus trop dangereux pour rester dans le pays. Nous les exilerons, les exclurons de la politique vietnamienne et les empêcherons d'organiser l'opposition. Cela éliminera une menace majeure pour la stabilité du gouvernement et les intérêts français."

 VIE_Assign_Tam_PM: "Nommer Tam comme Premier ministre"
 VIE_Assign_Tam_PM_desc: "Nguyen Van Tam, ancien administrateur colonial, sera nommé Premier ministre. L'expérience de Tam dans l'administration gouvernementale et ses relations avec les Français contribueront à maintenir la stabilité et à assurer une coopération harmonieuse avec les autorités coloniales."

 VIE_Assign_Quang_PM: "Nommer Quang comme Premier ministre"
 VIE_Assign_Quang_PM_desc: "Dinh-Xuan-Quang, un homme politique réformateur, sera nommé Premier ministre. Quang se concentrera sur les réformes sociales, les droits du travail et le développement urbain. Son leadership apportera des politiques progressistes au Vietnam tout en maintenant la stabilité et l'ordre."

 VIE_Reward_Loyal_Political_Parties: "Récompenser les partis politiques fidèles"
 VIE_Reward_Loyal_Political_Parties_desc: "Les partis politiques qui sont restés fidèles au gouvernement et ont soutenu notre politique seront récompensés. Nous leur fournirons des postes, des ressources et une reconnaissance, garantissant ainsi leur soutien continu et créant une base politique stable pour le régime."

 VIE_Assign_Loc_PM: "Nommer Buu-Loc comme Premier ministre"
 VIE_Assign_Loc_PM_desc: "Nguyen Phuc Buu Loc, membre de la famille impériale, sera nommé Premier ministre. Les relations royales de Loc et sa politique modérée en font un choix idéal pour diriger le gouvernement pendant cette période de transition. Sa nomination contribuera à maintenir la stabilité et la légitimité."

 VIE_Accept_Geneva_Conference: "La Conférence de Genève"
 VIE_Accept_Geneva_Conference_desc: "La Conférence de Genève a été convoquée pour résoudre le conflit indochinois. S'il aboutit à des accords, nous accepterons ses décisions, reconnaissant que c'est la meilleure voie vers la paix. Même si nous n'obtiendrons peut-être pas tout ce que nous voulons, en accepter les conditions mettra fin à la guerre et nous permettra de nous concentrer sur la reconstruction et le développement. Si la guerre se décide sur le champ de bataille, il n'y a aucun accord à accepter."
 VIE_Geneva_Partition_Accords: "Acceptez les accords de partition"
 VIE_Geneva_Partition_Accords_desc: "Les accords de Genève divisent le Vietnam selon une ligne provisoire. Saigon doit gouverner le sud selon les termes convenus, et la partition durera jusqu'au moment fixé pour la réunification."
 VIE_Geneva_Unified_Settlement: "Acceptez le règlement unifié"
 VIE_Geneva_Unified_Settlement_desc: "Les accords de Genève maintiennent le Vietnam sous une administration intérimaire, avec un vote national pour décider de son gouvernement permanent dans un délai de deux ans. Saigon doit accepter le scrutin comme le prix d'un État unifié."
 VIE_The_Nation_Votes_for_Saigon: "La Nation vote pour Saigon"
 VIE_The_Nation_Votes_for_Saigon_desc: "Le vote national a donné un résultat clair pour Saigon. Le gouvernement du Sud dirigera désormais un Vietnam unifié, et le scrutin déterminera qui gouvernera le pays."
 VIE_Geneva_Conference_Collapses: "La conférence s'effondre"
 VIE_Geneva_Conference_Collapses_desc: "Les négociations de Genève ont été interrompues sans accord. Aucun règlement ne lie Saigon et la lutte pour le Vietnam revient sur le champ de bataille."
 VIE_Geneva_Failed_State: "Accepter l'état d'échec"
 VIE_Geneva_Failed_State_desc: "Les accords de Genève laissent le gouvernement du Sud faible et sans avenir. Saigon doit reconstruire son autorité à partir d'une position de faiblesse, et l'État restera fragile pendant des années."
 VIE_Geneva_Three_States: "Acceptez le règlement à trois États"
 VIE_Geneva_Three_States_desc: "Les accords de Genève divisent le Vietnam en trois États distincts, avec une zone nord détenue par le Kuomintang. Saigon doit gouverner sa propre zone et reconnaître les arrangements séparés au nord et au centre."
 VIE_Federal_Vietnam_Settlement: "Acceptez le règlement fédéral sur le Vietnam"
 VIE_Federal_Vietnam_Settlement_desc: "Les accords de Genève établissent un Vietnam fédéral au sein de l'Union française, avec une plus grande autonomie locale pour chaque région. Saigon doit travailler à travers les nouvelles institutions fédérales et partager l'autorité avec les autres régions."
 VIE_Dan_Quoc_Peace_Settlement: "Acceptez l'accord de paix de Dan Quoc"
 VIE_Dan_Quoc_Peace_Settlement_desc: "Les accords de paix reconnaissent la République démocratique du Vietnam comme un État distinct du nord. Saigon doit accepter cet arrangement comme base d'une paix durable dans le sud."
 VIE_CD_Geneva_Conference: "La Conférence de Genève"
 VIE_CD_Geneva_Conference_desc: "La Conférence de Genève a été convoquée pour résoudre le conflit indochinois. Le gouvernement de Cuong-De suivra de près les négociations, car tout accord déterminera si la monarchie a sa place dans le règlement."
 VIE_CD_Geneva_Partition_Accords: "Acceptez les accords de partition"
 VIE_CD_Geneva_Partition_Accords_desc: "Les accords de Genève divisent le Vietnam selon une ligne provisoire. Le gouvernement de Cuong-De doit gouverner le sud selon les termes convenus, et la partition restera en vigueur jusqu'à ce que la réunification soit organisée."
 VIE_CD_Geneva_Unified_Settlement: "Acceptez le règlement unifié"
 VIE_CD_Geneva_Unified_Settlement_desc: "Les accords de Genève maintiennent le Vietnam sous une administration intérimaire, avec un vote national sur son gouvernement permanent dans un délai de deux ans. Le gouvernement de Cuong-De doit accepter le scrutin comme le prix d'un État unifié."
 VIE_CD_The_Nation_Votes_for_Saigon: "La nation vote pour le gouvernement du Sud"
 VIE_CD_The_Nation_Votes_for_Saigon_desc: "Le vote national a donné un résultat clair pour le gouvernement du Sud. L'administration de Cuong-De dirigera désormais un Vietnam unifié, et le scrutin déterminera qui gouvernera le pays."
 VIE_CD_Geneva_Conference_Collapses: "La conférence s'effondre"
 VIE_CD_Geneva_Conference_Collapses_desc: "Les négociations de Genève ont été interrompues sans accord. Aucun règlement ne lie le gouvernement du Sud et la lutte pour le Vietnam revient sur le champ de bataille."
 VIE_CD_Geneva_Failed_State: "Accepter l'état d'échec"
 VIE_CD_Geneva_Failed_State_desc: "Les accords de Genève laissent le gouvernement du Sud faible et sans avenir. L'administration de Cuong-De doit reconstruire son autorité à partir d'une position de faiblesse, et l'État restera fragile pendant des années."
 VIE_CD_Geneva_Three_States: "Acceptez le règlement à trois États"
 VIE_CD_Geneva_Three_States_desc: "Les accords de Genève divisent le Vietnam en trois États distincts, avec une zone nord détenue par le Kuomintang. Le gouvernement de Cuong-De doit gouverner sa propre zone et reconnaître les arrangements séparés au nord et au centre."
 VIE_CD_Geneva_Ballot_Refused: "Refuser le scrutin"
 VIE_CD_Geneva_Ballot_Refused_desc: "Le gouvernement du Sud a refusé d'organiser le vote national requis par les accords. L'administration Cuong-De prend le risque de l'isolement et la question de l'avenir du Vietnam reste ouverte."
 VIE_CD_Dan_Quoc_Peace_Settlement: "Acceptez l'accord de paix de Dan Quoc"
 VIE_CD_Dan_Quoc_Peace_Settlement_desc: "Les accords de paix reconnaissent la République démocratique du Vietnam comme un État distinct du nord. Le gouvernement de Cuong-De doit accepter cet accord comme base d'une paix durable dans le sud."

 VIE_Recall_Diem: "Rappel de Diem"
 VIE_Recall_Diem_desc: "Ngo Dinh Diem, auparavant exilé, sera rappelé au poste de Premier ministre. Le retour de Diem marque un changement important dans la politique vietnamienne, apportant son idéologie personnaliste et son leadership fort au gouvernement. Sa nomination changera fondamentalement la direction du Sud-Vietnam."

 VIE_Redivert_Criticism_to_French: "Rediriger les critiques vers les Français"
 VIE_Redivert_Criticism_to_French_desc: "Plutôt que d'accepter la responsabilité de nos problèmes, nous redirigerons les critiques publiques vers les Français. En rejetant la responsabilité de nos difficultés sur les autorités coloniales, nous pouvons maintenir le soutien interne tout en réduisant l'influence française. Cette stratégie nous aidera à gagner plus d'autonomie et à faire évoluer l'opinion publique en notre faveur."

 VIE_1955_Grand_Election: "Les grandes élections de 1955"
 VIE_1955_Grand_Election_desc: "De grandes élections auront lieu pour légitimer le gouvernement et donner au peuple une voix sur son avenir. Cette élection sera un événement politique majeur, déterminant l'orientation de la politique vietnamienne et potentiellement remodelant le gouvernement. Les résultats auront des conséquences considérables pour la nation."

 VIE_Hinh_Coup: "Le coup d'Etat de Hinh"
 VIE_Hinh_Coup_desc: "Le général Nguyen Van Hinh, avec le soutien de la France, a lancé un coup d'État contre le gouvernement. Le passé militaire de Hinh et ses relations avec la France en font un adversaire redoutable. Ce coup d'État menace de renverser le gouvernement actuel et d'installer un régime fantoche français, mettant ainsi fin à l'autonomie vietnamienne."

 VIE_BaoDai_Liberator_of_Vietnam: "Bao-Dai, le libérateur du Vietnam"
 VIE_BaoDai_Liberator_of_Vietnam_desc: "Bao-Dai, l'ancien empereur, se positionnera en libérateur du Vietnam. En se présentant comme le véritable leader capable d'unifier la nation et de la libérer du contrôle étranger, Bao-Dai cherchera à reprendre le pouvoir et à restaurer la monarchie, ou du moins à s'imposer comme le dirigeant légitime."

 VIE_Why_Revolting: "Pourquoi se révoltent-ils ?"
 VIE_Why_Revolting_desc: "Des révoltes ont éclaté à travers le Vietnam, et il faut comprendre pourquoi. Le peuple se soulève contre le gouvernement et nous devons répondre à ses doléances. Cette approche nous aidera à comprendre les causes profondes des troubles et à élaborer des stratégies pour rétablir l'ordre et répondre aux préoccupations de la population."

 VIE_Stabilize_Urban_Areas: "Stabiliser les zones urbaines"
 VIE_Stabilize_Urban_Areas_desc: "Les zones urbaines sont devenues des centres de troubles et de résistance. Nous devons stabiliser ces régions, rétablir l'ordre et le contrôle gouvernemental. Cela nécessitera une combinaison de mesures de sécurité, d'améliorations économiques et de réformes politiques pour regagner le soutien des populations urbaines."

 VIE_Fly_to_France: "Envolez-vous vers la France..."
 VIE_Fly_to_France_desc: "Il semble que le règne de Bao-Dai au Vietnam soit terminé. La seule option qui s'offre désormais à lui est de s'exiler en France pour le reste de sa vie."

 VIE_PM_Long: "Premier ministre Nguyen-Phan-Long"
 VIE_PM_Long_desc: "Nguyen-Phan-Long a été nommé Premier ministre. Journaliste et homme politique, Long apporte une approche modérée de la gouvernance, cherchant à équilibrer les intérêts vietnamiens avec les réalités du contrôle colonial français."

 VIE_Long_Promote_CalDaism: "Promouvoir le Cao-Daïïsme"
 VIE_Long_Promote_CalDaism_desc: "Nous promouvrons le Cao-Daiïsme, un mouvement religieux syncrétique combinant des éléments des croyances Cao-Dai et Hoa-Hao. Cette politique vise à créer une identité religieuse unifiée capable de combler les divisions sectaires et de renforcer l'unité nationale, même si elle risque d'aliéner certains adeptes traditionnels de Cao-Dai."

 VIE_Long_Friendlier_USA_Ties: "Des liens plus amicaux avec les États-Unis"
 VIE_Long_Friendlier_USA_Ties_desc: "Après le départ de Long du poste de Premier ministre, nous resserrerons nos liens avec les États-Unis. Cet abandon de la dépendance exclusive de la France ouvre de nouvelles opportunités pour le soutien américain et les expéditions d'armes, même si cela pourrait mettre à rude épreuve les relations avec la France et les États-Unis dans un premier temps."

 VIE_Long_Accept_HautCommissar_Discharge: "Acceptez la décharge du Haut-Commissaire"
 VIE_Long_Accept_HautCommissar_Discharge_desc: "Nous accepterons la décharge du Haut-Commissaire français à l'égard de notre gouvernement, reconnaissant l'autorité française sur les affaires vietnamiennes. Cette acceptation pragmatique accroît le favoritisme français et pourrait conduire à des relations plus stables, même si cela se fait au détriment de l'autonomie vietnamienne."

 VIE_Long_Accept_French_Rulership: "Accepter la domination française"
 VIE_Long_Accept_French_Rulership_desc: "Si Long reste au pouvoir, nous accepterons pleinement la domination française sur le Vietnam. Cette décision donne la priorité à la stabilité et au soutien français plutôt qu'à l'indépendance, améliorant ainsi les relations avec la France mais pouvant potentiellement aliéner les éléments nationalistes à l'intérieur du pays."

 VIE_Long_Winning_French_Favoritism: "Gagner le favoritisme des Français"
 VIE_Long_Winning_French_Favoritism_desc: "En démontrant notre loyauté et notre coopération avec les autorités coloniales françaises, nous pouvons gagner leur favoritisme et obtenir un plus grand soutien pour notre gouvernement. Cependant, cette approche servile peut nous coûter de la stabilité et du soutien populaire dans notre pays."

 VIE_PM_Vinh: "Premier ministre Tran-Quang-Vinh"
 VIE_PM_Vinh_desc: "Tran-Quang-Vinh, leader Cao-Dai et nationaliste, a été nommé Premier ministre. Sa nomination apporte l'influence de Cao-Dai au sein du gouvernement et pourrait contribuer à intégrer les sectes religieuses dans le cadre national."

 VIE_Vinh_Incorporate_CaoDai_Nat_Armies: "Incorporer le Cao-Dai et les armées nationales"
 VIE_Vinh_Incorporate_CaoDai_Nat_Armies_desc: "Nous intégrerons le Cao-Dai et les armées nationales dans nos forces militaires régulières. Cette intégration renforce nos forces armées et place les forces de Trinh-Minh-The sous le contrôle du gouvernement, même si elle réduit considérablement l'autonomie et la loyauté des Cao-Dai."

 VIE_Vinh_Pushing_Religious_Coexistance: "Pousser pour la coexistence religieuse"
 VIE_Vinh_Pushing_Religious_Coexistance_desc: "Étant donné que le Vietnam est diversifié sur le plan religieux, des conflits sectaires seraient dangereux pour la nation, car nous sommes actuellement confrontés au problème de la lutte contre les cellules Viet-minh du Sud. Poursuivons la coexistence des religions dans les régions du Vietnam que nous contrôlons encore pour assurer la stabilité de notre nation."

 VIE_Vinh_Incorporate_Sect_Assets: "Incorporer les actifs d'autres sectes"
 VIE_Vinh_Incorporate_Sect_Assets_desc: "Les sectes sont connues grâce à leurs actifs provenant des dons de leurs fidèles. Trouvons un moyen de les persuader de contribuer leurs actifs à notre gouvernement."

 VIE_Vinh_Purge_Phuong_Forces: "Purger Phuong et ses forces"
 VIE_Vinh_Purge_Phuong_Forces_desc: "Nous devons purger les forces Phuong, une faction militaire dissidente qui menace la stabilité du gouvernement. Cette action décisive éliminera une source potentielle de rébellion et consolidera notre contrôle sur l'armée."

 VIE_Vinh_Expand_Japanese_Ties: "Élargir les liens avec le Japon"
 VIE_Vinh_Expand_Japanese_Ties_desc: "Nous élargirons nos liens diplomatiques et économiques avec le Japon. Cette relation pourrait fournir un soutien et des ressources précieux, même si elle pourrait compliquer nos relations avec d'autres puissances de la région."

 VIE_Vinh_Expand_CaoDai_Influence: "Développez l'influence de Cao-Dai"
 VIE_Vinh_Expand_CaoDai_Influence_desc: "Nous étendrons l'influence de Cao-Dai à tout le Vietnam, en particulier à Tay-Ninh. Cette politique renforce la position du Cao-Dai et peut contribuer à intégrer ses partisans dans le cadre national, même si elle nécessite des investissements importants dans les infrastructures."

 VIE_Vinh_Push_CuongDe_Repatriation: "Faire pression pour le rapatriement de Cuong-De"
 VIE_Vinh_Push_CuongDe_Repatriation_desc: "Nous ferons pression pour le rapatriement du prince Cuong-De du Japon. Cet effort visant à ramener le prince exilé au Vietnam pourrait avoir des implications politiques importantes, en fonction de la réponse du Japon et du moment choisi pour notre demande."

 VIE_Vinh_Rehabilitate_PhucQuoc_Members: "Réhabiliter les membres de Phuc-Quoc"
 VIE_Vinh_Rehabilitate_PhucQuoc_Members_desc: "Nous réhabiliterons les membres de l'organisation Phuc-Quoc, un groupe nationaliste en conflit avec le gouvernement. Cet effort de réconciliation vise à rallier ces nationalistes et à renforcer notre coalition anticommuniste."

 VIE_Vinh_Resign: "Démissionner"
 VIE_Vinh_Resign_desc: "Après avoir terminé son programme, Tran-Quang-Vinh démissionnera de son poste de Premier ministre, permettant ainsi une transition vers une nouvelle direction."

 VIE_PM_Huu: "Premier ministre Tran-Van-Huu"
 VIE_PM_Huu_desc: "Tran-Van-Huu a été nommé Premier ministre. Ancien gouverneur et administrateur expérimenté, Huu apporte une approche pragmatique axée sur la modernisation de l'armée vietnamienne et l'expansion de sa présence internationale."

 VIE_Huu_Officer_Corp_Vietnamization: "Vietnamisation du Corps des Officiers"
 VIE_Huu_Officer_Corp_Vietnamization_desc: "Nous vietnamiserons le corps des officiers en remplaçant les officiers français par des vietnamiens. Cette politique renforce notre indépendance militaire et réduit le contrôle français, même si elle peut tendre les relations avec la France si nous n'avons pas déjà recruté d'anciens combattants autochtones."

 VIE_Huu_Modernize_National_Army: "Moderniser l'Armée nationale"
 VIE_Huu_Modernize_National_Army_desc: "Nous moderniserons notre armée nationale avec des équipements français, notamment des chars légers, de l'artillerie et des véhicules motorisés. Cette modernisation renforce nos capacités militaires et démontre le soutien français à nos forces."

 VIE_Huu_Attend_1951_SF_Conference: "Assistez à la conférence de San Francisco de 1951"
 VIE_Huu_Attend_1951_SF_Conference_desc: "Nous assisterons à la Conférence de San Francisco de 1951, où sera signé le traité de paix avec le Japon. Notre participation démontre le statut du Vietnam en tant que nation indépendante et améliore nos relations avec les alliés des États-Unis."

 VIE_Huu_Attract_Worldwide_Attention_SV: "Attirer l'attention du monde entier sur le Sud-Vietnam"
 VIE_Huu_Attract_Worldwide_Attention_SV_desc: "Nous lancerons une campagne pour attirer l'attention du monde entier sur la cause du Sud-Vietnam. Cet effort diplomatique accroît notre influence intérieure et réduit le favoritisme alternatif, tout en ouvrant également la voie aux expéditions d'armes de la part de pays sympathisants."

 VIE_Huu_Demand_Japan_War_Reparations: "Exigez des réparations de guerre au Japon"
 VIE_Huu_Demand_Japan_War_Reparations_desc: "Nous exigerons du Japon des réparations de guerre pour les souffrances infligées pendant son occupation. Cette décision audacieuse accroît notre influence intérieure et démontre notre indépendance, même si elle risque de mettre à rude épreuve les relations avec le Japon."

 VIE_Huu_Demand_HoangSa_TruongSa_Recognition: "Exigez la reconnaissance de Hoang-sa et Truong-sa"
 VIE_Huu_Demand_HoangSa_TruongSa_Recognition_desc: "Nous exigerons la reconnaissance internationale de notre souveraineté sur les îles Hoang-Sa (Paracel) et Truong-Sa (Spratly). Cette affirmation de revendications territoriales peut irriter les pays voisins mais renforce nos références nationalistes."

 VIE_Huu_Open_UK_USA_Embassies: "Ouvrir les ambassades du Royaume-Uni et des États-Unis"
 VIE_Huu_Open_UK_USA_Embassies_desc: "Nous ouvrirons des ambassades au Royaume-Uni et aux États-Unis, établissant ainsi des relations diplomatiques formelles avec ces grandes puissances. Cette étape accroît notre réputation internationale et notre influence nationale."

 VIE_Huu_Friendlier_USA_Ties: "Des liens plus amicaux avec les États-Unis"
 VIE_Huu_Friendlier_USA_Ties_desc: "Nous poursuivrons des relations plus amicales avec les États-Unis, en recherchant le soutien et les investissements américains. Cette politique améliore les relations avec les États-Unis, accroît la stabilité et offre des opportunités de développement industriel."

 VIE_Huu_Maintain_PhapViet_DeHue: "Maintenir Phap-Viet De-Hue"
 VIE_Huu_Maintain_PhapViet_DeHue_desc: "Nous maintiendrons le cadre Phap-Viet De-Hue (Coopération franco-vietnamienne), préservant ainsi nos relations avec la France. Cette approche maintient un favoritisme français élevé mais peut limiter notre indépendance."

 VIE_Huu_Request_More_French_Financial_Aid: "Demander une aide financière supplémentaire à la France"
 VIE_Huu_Request_More_French_Financial_Aid_desc: "Nous demanderons une aide financière supplémentaire à la France pour soutenir notre gouvernement et nos projets de développement. Si la France l'accepte, cette aide fournira des ressources cruciales pour les infrastructures et le développement économique."

 VIE_Huu_Accept_French_Dismissal: "Accepter le désintérêt des Français"
 VIE_Huu_Accept_French_Dismissal_desc: "Si la France rejette notre demande d'aide, nous accepterons sa décision avec grâce. Cette acceptation reflète peut-être le désintérêt de la France à soutenir notre gouvernement, nous obligeant à rechercher d'autres sources de soutien."

 VIE_Huu_Open_Viet_VoA_Radio: "Ouvrez la radio VoA vietnamienne"
 VIE_Huu_Open_Viet_VoA_Radio_desc: "Nous ouvrirons une station de radio vietnamienne Voice of America, offrant une alternative aux médias contrôlés par la France. Cette décision renforce nos liens avec les États-Unis et fournit une plate-forme à notre message, même si elle pourrait irriter la France."

 VIE_Huu_Accept_USA_Financial_Aid: "Acceptez l'aide financière des États-Unis"
 VIE_Huu_Accept_USA_Financial_Aid_desc: "Nous accepterons l'aide financière des États-Unis, déplaçant ainsi notre dépendance de la France vers l'Amérique. Cette décision accroît considérablement l'influence américaine et fournit des ressources indispensables à notre gouvernement."

 VIE_Huu_Winning_French_Favoritism: "Gagner les Français"
 VIE_Huu_Winning_French_Favoritism_desc: "Grâce à une coopération constante et à une loyauté envers les intérêts français, nous pouvons gagner le favoritisme français et garantir leur soutien continu. Cette approche donne la priorité à la stabilité et au soutien français plutôt qu'à l'indépendance totale."

 VIE_PM_Toan: "Premier ministre Nguyen-Bao-Toan"
 VIE_PM_Toan_desc: "Nguyen-Bao-Toan a été nommé Premier ministre. Penseur révolutionnaire et défenseur du changement social, Toan apporte une vision radicale pour transformer la société vietnamienne à travers sa philosophie des Trois Révolutions."

 VIE_Toan_Promote_DanXaism: "Promouvoir le « Dan-Xaïsme »"
 VIE_Toan_Promote_DanXaism_desc: "Nous promouvrons le Dan-Xaïsme, la philosophie politique de Toan qui met l'accent sur le pouvoir du peuple et la démocratie populaire. Cette idéologie cherche à responsabiliser les gens ordinaires et à créer une société plus égalitaire."

 VIE_Toan_Promote_TriRevolutions: "Promouvoir les trois révolutions"
 VIE_Toan_Promote_TriRevolutions_desc: "Nous promouvrons les trois révolutions : la révolution humaine, la révolution nationale et la révolution sociale. Ce programme complet vise à transformer la société vietnamienne à tous les niveaux, de la conscience individuelle à l'identité nationale et à la structure sociale."

 VIE_Toan_CachMang_ConNguoi: "Cach-Mang Con-Nguoi"
 VIE_Toan_CachMang_ConNguoi_desc: "La Révolution humaine se concentre sur la transformation de la conscience individuelle et de la moralité. Nous promouvrons l'éducation, le comportement éthique et le développement personnel pour créer une nouvelle génération de citoyens vietnamiens éclairés."

 VIE_Toan_Spread_HoaHao_Buddhism: "Répandez le bouddhisme Hoa-Hao"
 VIE_Toan_Spread_HoaHao_Buddhism_desc: "Nous diffuserons le bouddhisme Hoa-Hao, un mouvement bouddhiste réformiste qui met l'accent sur la simplicité et la pratique directe. Cette politique religieuse s'aligne sur nos objectifs révolutionnaires et peut contribuer à mobiliser les populations rurales."

 VIE_Toan_Destroy_Drugs_Prostitution: "Détruire la drogue et la prostitution"
 VIE_Toan_Destroy_Drugs_Prostitution_desc: "Nous lancerons une campagne pour détruire la drogue et la prostitution, nettoyant ainsi la société vietnamienne de ces vices. Cette croisade morale vise à créer une nation plus pure et plus vertueuse, alignée sur nos idéaux révolutionnaires."

 VIE_Toan_ToanDan_ChanhTri: "Toan-Dan Chanh-Tri"
 VIE_Toan_ToanDan_ChanhTri_desc: "Nous mettrons en oeuvre une politique participative, garantissant que chaque citoyen ait une voix dans la gouvernance. Cette approche démocratique vise à briser les hiérarchies traditionnelles et à créer un système politique plus inclusif."

 VIE_Toan_Spread_Scientific_Knowledge: "Diffuser les connaissances scientifiques"
 VIE_Toan_Spread_Scientific_Knowledge_desc: "Nous diffuserons les connaissances scientifiques dans tout le Vietnam, en promouvant l'éducation et la pensée rationnelle. Cette politique vise à moderniser la société vietnamienne et à réduire la superstition et le retard."

 VIE_Toan_Contact_NgoDinh_Bros: "Contactez les frères Ngo-Dinh"
 VIE_Toan_Contact_NgoDinh_Bros_desc: "Nous contacterons les frères Ngo-Dinh pour solliciter leur coopération dans notre programme révolutionnaire. Ces personnalités influentes pourraient apporter un soutien précieux à notre cause, même si leur alignement sur nos objectifs reste incertain."

 VIE_Toan_CachMang_DanToc: "Cach-Mang Dan-Toc"
 VIE_Toan_CachMang_DanToc_desc: "La Révolution nationale se concentre sur l'indépendance et l'identité nationale vietnamiennes. Nous travaillerons à libérer le Vietnam de la domination étrangère et à créer un État vietnamien véritablement indépendant."

 VIE_Toan_Gathering_AntiFrench_Forces: "Rassembler les forces anti-françaises"
 VIE_Toan_Gathering_AntiFrench_Forces_desc: "Nous rassemblerons toutes les forces anti-françaises sous notre bannière, unissant divers groupes nationalistes et révolutionnaires. Cet effort de constitution d'une coalition renforce notre position contre la domination coloniale française."

 VIE_Toan_Prepare_Anti_BaoDai_French_Coup: "Préparez le coup d'État anticolonialiste"
 VIE_Toan_Prepare_Anti_BaoDai_French_Coup_desc: "Nous nous préparerons à un coup d'État anti-Bao-Dai et anti-Français, en organisant nos forces et en planifiant le renversement du régime actuel. Cette action révolutionnaire vise à établir un gouvernement vietnamien véritablement indépendant."

 VIE_Toan_CachMang_XaHoi: "Cach-Mang Xa-Hoi"
 VIE_Toan_CachMang_XaHoi_desc: "La Révolution sociale se concentre sur la transformation des structures économiques et sociales de la société vietnamienne. Nous travaillerons à créer une société plus équitable et plus juste, exempte d'exploitation et d'inégalités."

 VIE_Toan_Organize_Countryside_Communes: "Organiser des communes de campagne"
 VIE_Toan_Organize_Countryside_Communes_desc: "Nous organiserons des communes rurales, créant des unités agricoles collectives susceptibles d'améliorer la productivité rurale et l'organisation sociale. Cette politique vise à moderniser le Vietnam rural et à améliorer la vie des paysans."

 VIE_Toan_Spread_NonCommunist_Socialism: "Propager le socialisme non communiste"
 VIE_Toan_Spread_NonCommunist_Socialism_desc: "Nous diffuserons une forme non communiste de socialisme, promouvant la justice sociale et l'égalité économique sans nous aligner sur l'idéologie communiste. Cette approche cherche à résoudre les problèmes sociaux tout en maintenant l'indépendance des blocs communiste et capitaliste."

 VIE_Toan_Promote_KyNghe_Hoa: "Promouvoir Ky-Nghe-Hoa"
 VIE_Toan_Promote_KyNghe_Hoa_desc: "Nous promouvrons l'industrialisation (Ky-Nghe Hoa), développerons la capacité industrielle du Vietnam et moderniserons notre économie. Cette transformation économique est essentielle à la force et à l'indépendance nationales."

 VIE_Toan_Allow_Private_MOP: "Autoriser les moyens de production privés"
 VIE_Toan_Allow_Private_MOP_desc: "Nous autoriserons les moyens de production privés, en équilibrant les idéaux socialistes et les besoins économiques pratiques. Cette politique autorise l'entreprise privée tout en maintenant notre engagement envers la justice sociale et l'égalité."

 VIE_Toan_Beg_Sect_Cooperation: "Suppliez les sectes religieuses de coopérer"
 VIE_Toan_Beg_Sect_Cooperation_desc: "Nous implorerons la coopération des sectes, recherchant le soutien de groupes religieux comme Cao-Dai et Hoa-Hao pour notre programme révolutionnaire. Leur coopération pourrait être cruciale pour notre réussite, même si leurs intérêts ne correspondent pas toujours aux nôtres."

 VIE_Toan_Launch_AntiFrench_AntiCommie: "Lancez le coup d'État anticolonialiste et anticommuniste"
 VIE_Toan_Launch_AntiFrench_AntiCommie_desc: "Nous lancerons une campagne globale contre le colonialisme français et le communisme, nous positionnant comme la véritable voie vers l'indépendance vietnamienne. Cette lutte sur deux fronts nécessite une coordination minutieuse de toutes nos forces et alliés."

 VIE_Toan_Success: "Nous avons réussi !"
 VIE_Toan_Success_desc: "Le coup d'État a réussi. L'administration coloniale a été balayée, les communistes se sont vu refuser toute chance de prendre le pouvoir et nos forces tiennent la capitale. Le vrai travail commence maintenant : construire un Vietnam véritablement indépendant sur les fondations de notre révolution sociale."

 VIE_Toan_Assassination: "Un échec total..."
 VIE_Toan_Assassination_desc: "Le coup d'État était à quelques jours de son lancement lorsque Nguyen-Bao-Toan a été abattu. Que les services de sécurité du chef de l'État aient découvert le complot ou que l'un des nôtres l'ait vendu, le résultat est le même : notre chef est mort, notre réseau est exposé et tous ceux qui l'ont soutenu sont désormais accusés de trahison contre le chef de l'État."

 VIE_PM_Tam: "Premier ministre Nguyen-Van-Tam"
 VIE_PM_Tam_desc: "Nguyen-Van-Tam a été nommé Premier ministre. Ancien gouverneur et expert en sécurité, Tam apporte une approche anticommuniste dure axée sur la sécurité, la stabilité et les opérations anti-insurrectionnelles."

 VIE_Tam_Expand_AntiCommunist_Security: "Développer la sécurité anticommuniste"
 VIE_Tam_Expand_AntiCommunist_Security_desc: "Nous élargirons notre appareil de sécurité anticommuniste, renforçant ainsi notre capacité à identifier et neutraliser les menaces communistes. Ce programme de sécurité complet est essentiel au maintien du contrôle et de la stabilité du gouvernement."

 VIE_Tam_SmallScale_CaiCach_DienDia: "Cai-Cach Dien-Dia à petite échelle"
 VIE_Tam_SmallScale_CaiCach_DienDia_desc: "Nous mettrons en oeuvre une réforme agraire à petite échelle (Cai-Cach Dien-Dia), redistribuant certaines terres aux paysans. Cette réforme limitée vise à répondre aux griefs des ruraux sans remettre totalement en cause la structure foncière existante."

 VIE_Tam_SmallScale_Industrial_BuildUp: "Développement industriel à petite échelle"
 VIE_Tam_SmallScale_Industrial_BuildUp_desc: "Nous entreprendrons un développement industriel à petite échelle, développant notre capacité de fabrication et créant des emplois. Ce développement économique renforce notre économie et fournit des ressources pour nos efforts de sécurité."

 VIE_Tam_Intensify_Counter_Northern_VietMinh: "Intensifier la lutte contre le Viet-minh du Nord"
 VIE_Tam_Intensify_Counter_Northern_VietMinh_desc: "Nous intensifierons nos opérations contre le Viet Minh du Nord, en attaquant directement les forces communistes. Cette approche agressive pourrait déstabiliser le Nord-Vietnam mais risque également d'intensifier le conflit."

 VIE_Tam_Elect_VietQuoc_Leadership: "Élus au leadership du Viet-quoc"
 VIE_Tam_Elect_VietQuoc_Leadership_desc: "Nous élirons la direction du Viet-Quoc (Parti nationaliste vietnamien), amenant ce parti nationaliste au gouvernement. Cette décision renforce les éléments nationalistes et accroît l'influence intérieure, même si elle peut réduire la stabilité."

 VIE_Tam_Resign: "Démissionner"
 VIE_Tam_Resign_desc: "Après avoir achevé son programme axé sur la sécurité, Nguyen-Van-Tam démissionnera de son poste de Premier ministre, permettant ainsi une transition vers un nouveau leadership."

 VIE_PM_Quang: "Premier ministre Dinh-Xuan-Quang"
 VIE_PM_Quang_desc: "Dinh-Xuan-Quang a été nommé Premier ministre. Administrateur réformiste, Quang met l'accent sur le développement urbain, les services sociaux et l'amélioration de la vie des citoyens vietnamiens ordinaires."

 VIE_Quang_Reform_Civil_Services: "Réformer la fonction publique"
 VIE_Quang_Reform_Civil_Services_desc: "Nous réformerons la fonction publique, en améliorant l'efficacité et en réduisant la corruption. Cette réforme administrative réduit les pénalités liées à la réforme agraire et crée une bureaucratie gouvernementale plus efficace, même si elle nécessite des investissements importants."

 VIE_Quang_Pass_Labor_Union_Regulation: "Adopter le règlement sur les syndicats"
 VIE_Quang_Pass_Labor_Union_Regulation_desc: "Nous adopterons des réglementations syndicales, établissant le cadre juridique pour les organisations de travailleurs. Cette politique ouvre la voie à une amélioration des droits des travailleurs et pourrait conduire à la légalisation des syndicats."

 VIE_Quang_Legalize_Worker_Unions: "Légaliser les syndicats de travailleurs"
 VIE_Quang_Legalize_Worker_Unions_desc: "Nous légaliserons les syndicats de travailleurs, en accordant aux travailleurs le droit de s'organiser et de négocier collectivement. Cette politique progressiste améliore les droits des travailleurs et peut accroître le soutien aux idées socialistes, même si elle accorde également aux travailleurs plus de pouvoir politique."

 VIE_Quang_Raise_Worker_Salaries: "Augmenter les salaires des travailleurs"
 VIE_Quang_Raise_Worker_Salaries_desc: "Nous augmenterons les salaires des travailleurs, améliorant ainsi le niveau de vie des travailleurs urbains. Cette politique nécessite des dépenses gouvernementales importantes mais renforce le soutien des travailleurs au régime."

 VIE_Quang_Form_Urban_Councils: "Former les conseils urbains"
 VIE_Quang_Form_Urban_Councils_desc: "Nous formerons des conseils urbains dans les grandes villes, créant ainsi des structures de gouvernance locale qui donneront aux citadins une voix dans les affaires municipales. Cette décentralisation améliore l'administration locale et augmente les capacités de renforcement dans les zones urbaines."

 VIE_Quang_Modernize_Urban_Infrastructure: "Moderniser les infrastructures urbaines"
 VIE_Quang_Modernize_Urban_Infrastructure_desc: "Nous moderniserons les infrastructures urbaines, en améliorant les routes, les services publics et les équipements publics dans nos villes. Ce développement améliore la qualité de vie urbaine et pourrait débloquer de nouvelles technologies permettant d'améliorer davantage les infrastructures."

 VIE_Quang_Expand_Public_Housing: "Développer le logement public"
 VIE_Quang_Expand_Public_Housing_desc: "Nous développerons le logement public, en fournissant des logements abordables aux résidents urbains. Ce programme social améliore les conditions de vie dans les villes et démontre l'engagement du gouvernement en faveur de la protection sociale."

 VIE_Quang_Pass_Civil_Service_Regulation: "Adopter le Règlement de la Fonction Publique"
 VIE_Quang_Pass_Civil_Service_Regulation_desc: "Nous adopterons des réglementations sur la fonction publique, établissant des normes et des procédures pour l'emploi au sein du gouvernement. Cette réforme améliore la qualité et le professionnalisme de la fonction publique."

 VIE_Quang_Reform_Health_System: "Réformer le système de santé"
 VIE_Quang_Reform_Health_System_desc: "Nous réformerons le système de santé, élargirons l'accès aux soins de santé et améliorerons les services médicaux. Cette réforme globale augmente les taux de soins de santé, améliore la santé publique et peut augmenter la main-d'oeuvre disponible grâce à une meilleure santé de la population."

 VIE_Quang_Establish_Saigon_Childrens_Hospital: "Créer l'hôpital pour enfants de Saigon"
 VIE_Quang_Establish_Saigon_Childrens_Hospital_desc: "Nous allons créer un hôpital pour enfants à Saigon, fournissant des soins médicaux spécialisés aux plus jeunes habitants de la ville. Ce projet humanitaire démontre notre engagement envers le bien-être de tous les citoyens vietnamiens."

 VIE_Quang_Stablize_BaoDai_Regime: "Le régime de Bao-Dai stabilisé"
 VIE_Quang_Stablize_BaoDai_Regime_desc: "Nous oeuvrerons à stabiliser le régime Bao-Dai, en garantissant le maintien de sa légitimité et de son efficacité. Cette approche conservatrice maintient le statu quo et préserve la structure politique existante."

 VIE_Quang_Propose_QuocGia_Solution: "Proposer une nouvelle solution Quoc-Gia..."
 VIE_Quang_Propose_QuocGia_Solution_desc: "Nous proposerons la solution Quoc-Gia (État national), en plaidant pour une approche plus indépendante et nationaliste de la gouvernance. Cette proposition accroît l'influence intérieure et éloigne le favoritisme de la France, même si elle risque de réduire la stabilité."

 VIE_PM_Buu_Loc: "Premier ministre Nguyen-Phuc Buu-Loc"
 VIE_PM_Buu_Loc_desc: "Nguyen-Phuc-Buu-Loc a été nommé Premier ministre. Membre de la famille royale, Buu-Loc apporte une approche conservatrice axée sur le maintien de la stabilité pendant une période critique de l'histoire du Vietnam."

 VIE_Buu_Loc_Accept_Incompetent_Governnment: "Un gâchis d'incompétence..."
 VIE_Buu_Loc_Accept_Incompetent_Governnment_desc: "Nous accepterons que notre gouvernement puisse être perçu comme incompétent, reconnaissant les défis auxquels nous sommes confrontés. Cette évaluation honnête réduit la stabilité et le pouvoir politique, mais peut accroître l'influence intérieure en faisant preuve de conscience de soi."

 VIE_Buu_Loc_Accept_Northern_Communist_Victory: "Acceptez la victoire communiste"
 VIE_Buu_Loc_Accept_Northern_Communist_Victory_desc: "Si la Conférence de Genève aboutit à la victoire des communistes du Nord, nous accepterons ce résultat. Cette acceptation pragmatique de la défaite réduit considérablement la stabilité et la popularité monarchiste, mais peut accroître l'influence intérieure en faisant preuve de réalisme."

 VIE_Buu_Loc_Host_Victory_Parade: "Organisez un défilé de la victoire"
 VIE_Buu_Loc_Host_Victory_Parade_desc: "Si nous remportons la victoire dans la guerre d'Indochine, nous organiserons un grand défilé de victoire pour célébrer notre succès. Cette célébration renforce la stabilité, le pouvoir politique et l'influence intérieure, démontrant la force et la légitimité de notre gouvernement."

 VIE_Buu_Loc_Resign: "Démissionner"
 VIE_Buu_Loc_Resign_desc: "Après avoir surmonté les défis de son mandat de Premier ministre, Nguyen-Phuc-Buu-Loc démissionnera, permettant une transition vers un nouveau leadership alors que le Vietnam fait face à son avenir."

 VIE_CD_Sideline_CuongDe_Ambitions: "Mettre à l'écart les ambitions de Cuong-De"
 VIE_CD_Sideline_CuongDe_Ambitions_desc: "L'ambition de Cuong-De de conduire la nation vers une démocratie monarchique est forte, mais Bao-Dai n'est pas aussi passionné. S'assurer que ses ambitions restent discrètes sera un élément essentiel pour garantir le bon déroulement de cette période difficile."

 VIE_CD_CuongDe_Press_Conferences: "Conférences de presse de Cuong-De"
 VIE_CD_CuongDe_Press_Conferences_desc: "Il semble que Cuong-De organise des conférences de presse pour tenter de convaincre les puissances étrangères de soutenir son retour. Écouteons ses communications pour connaître son plan et empêcher son retour au Vietnam."

 VIE_CD_Intercept_CuongDe_Return_Bangkok: "Intercepter Cuong-De à Bangkok"
 VIE_CD_Intercept_CuongDe_Return_Bangkok_desc: "Nous avons reçu des nouvelles selon lesquelles Cuong-De envisageait de se faufiler au Vietnam via Bangkok déguisé. Interceptons-le avant qu'il ne puisse revenir et causer des ennuis."

 VIE_CuongDe_Returns: "Cuong-De retourne au Vietnam"
 VIE_CuongDe_Returns_desc: "Bien que Bao-Dai et les Xac-Te aient tout fait pour empêcher son retour, il semble que le prince Cuong-De leur échappe et soit en route pour reprendre son trône. Nous devons l'aider à préparer un coup d'État contre Bao-Dai."

 VIE_CD_Request_Japanese_Western_Aid: "Demander l'aide japonaise et occidentale"
 VIE_CD_Request_Japanese_Western_Aid_desc: "Les Japonais ont été les premiers à soutenir les efforts du Prince. Demandons-leur notre soutien dans nos efforts visant à ramener le prince sur son trône."

 VIE_CD_Wait_French_Approval: "Attendez l'approbation française"
 VIE_CD_Wait_French_Approval_desc: "Même si nous méprisons les Français car ils influencent actuellement la politique vietnamienne, nous avons encore besoin de leur approbation pour que notre plan réussisse. Convainquons les Français que le prince Cuong-De serait un meilleur dirigeant que Bao-Dai."

 VIE_CD_Recruit_NgoDinh_Brothers: "Recrutez de nouveaux alliés et les Ngo-dinhs"
 VIE_CD_Recruit_NgoDinh_Brothers_desc: "Les frères Ngo-Dinh sont une épine pour Bao-Dai depuis des années. Recrutons-les à notre cause avant que Bao-Dai puisse envoyer ses agents les arrêter."

 VIE_CD_Contact_GuangXi_Revolutionaries_CaoDai: "Contactez les révolutionnaires du Guang-Xi et le Cao-Dai"
 VIE_CD_Contact_GuangXi_Revolutionaries_CaoDai_desc: "Les révolutionnaires du Guang-Xi et les Caodaistes soutiennent pleinement nos causes et méprisent le régime corrompu de Bao-Dai. Allons vers eux pour obtenir un soutien armé supplémentaire."

 VIE_CD_Avenge_148_Year_Fueds: "Venger les querelles vieilles de 148 ans"
 VIE_CD_Avenge_148_Year_Fueds_desc: "Le moment est venu pour nous de ramener le prince à la place qui lui revient. Prenons d'assaut la résidence de Bao-Dai et faisons un coup d'État pour l'expulser une fois pour toutes."

 VIE_CD_Japan_Escape: "Évadez-vous au Japon !"
 VIE_CD_Japan_Escape_desc: "Malgré nos efforts, il semble que le prince Cuong-De n'ait pas réussi à remporter la lutte pour le pouvoir contre Bao-Dai. Le seul sort qui lui reste est une vie en exil au Japon."

 VIE_CD_NamHung_Vietnam_Emperor: "Nam-Hung, empereur du Vietnam"
 VIE_CD_NamHung_Vietnam_Emperor_desc: "Van-mar! Il semble que nos efforts pour redonner au prince Cuong-De la place qui lui revient ont porté leurs fruits. Célébrons sa restauration en tant qu'empereur légitime, Nam-Hung."

 VIE_NH_NamHung_Vietnam_Emperor: "Nam-Hung, empereur du Vietnam"
 VIE_NH_NamHung_Vietnam_Emperor_desc: "Van-mar! Il semble que nos efforts pour redonner au prince Cuong-De la place qui lui revient ont porté leurs fruits. Célébrons sa restauration en tant qu'empereur légitime, Nam-Hung."

 VIE_NH_Purge_BaoDai_Loyalists_Incompetent_Bureaucrats: "Purger les loyalistes et les bureaucrates incompétents de Bao-Dai"
 VIE_NH_Purge_BaoDai_Loyalists_Incompetent_Bureaucrats_desc: "Les loyalistes et les bureaucrates incompétents de Bao-Dai tourmentent nos nations depuis des années. Purgeons ceux qui restent encore en position de pouvoir."

 VIE_NH_Exile_BaoDai: "Exiler Bao-Dai"
 VIE_NH_Exile_BaoDai_desc: "Malgré son renversement, la présence de Bao-Dai reste pour nous un problème. Exilons-le en France et ne le laissons plus jamais remettre les pieds au Vietnam."

 VIE_NH_FRA_Friendship: "Entretenir notre amitié avec la France"
 VIE_NH_FRA_Friendship_desc: "Même si nous méprisons d'être sous la botte française, il serait insensé de les contrarier alors que nous combattons toujours le Viet-minh. Gardons des relations cordiales entre nous et les Français pour nous assurer d'avoir leur soutien dans la gouvernance du Vietnam."

 VIE_NH_Reward_CaoDai_Loyalists: "Récompenser les loyalistes de Cao-Dai"
 VIE_NH_Reward_CaoDai_Loyalists_desc: "Les Caodaistes sont fidèles à nous et à nos causes depuis longtemps. Récompensons-les pour leur loyauté en les nommant à des postes importants au sein du gouvernement."

 VIE_NH_Welcome_Americans: "Bienvenue aux Américains"
 VIE_NH_Welcome_Americans_desc: "Contrairement aux Français, les Américains seraient heureux d'envoyer de l'aide à tous les pays opposés aux communistes. Courtisons-les à notre cause en tant qu'alliés alternatifs à notre suzerain français."

 VIE_NH_Reorganize_Incompetent_Government: "Réorganiser le gouvernement incompétent"
 VIE_NH_Reorganize_Incompetent_Government_desc: "Le gouvernement incompétent laissé par Bao-Dai ne nous aidera pas à convaincre le peuple que le Vietnam est véritablement indépendant de toute ingérence étrangère. Réorganisons une fois pour toutes l'administration d'un nouveau Vietnam."

 VIE_NH_Maintain_Colonial_Bureaucracy: "Maintenir la bureaucratie coloniale"
 VIE_NH_Maintain_Colonial_Bureaucracy_desc: "Éliminer la bureaucratie coloniale et en construire une nouvelle à partir de rien serait trop compliqué pour nous puisque nous sommes toujours en guerre contre le Nord. Il vaudrait mieux que nous les maintenions tout en nous concentrant sur d'autres affaires. Après tout, ne réparez pas ce qui n'est pas cassé."

 VIE_NH_Death_Preparations: "La question du successeur"
 VIE_NH_Death_Preparations_desc: "En raison de l'âge de l'empereur Nam-Hung et de ses problèmes de santé, nous devons préparer sa mort et lui choisir un successeur."

 VIE_NH_Nhiep_Successor: "Nhiep réussit"
 VIE_NH_Nhiep_Successor_desc: "En tant que commandant en second de l'empereur, Nguyen-Rinh-Nhiep serait un successeur naturel pour perpétuer l'héritage de Nam-Hung. Choisissons-le comme notre successeur."

 VIE_NH_Diem_Successor: "Diem réussit"
 VIE_NH_Diem_Successor_desc: "En tant que partisan de longue date de l'empereur, Ngo-Dinh-Diem serait un successeur naturel pour perpétuer l'héritage de Nam-Hung. Choisissons-le comme notre successeur."

 VIE_NH_CaoDai_Successor: "Un successeur de Cao-Dai ?"
 VIE_NH_CaoDai_Successor_desc: "En tant que fervent croyant de la religion Cao-Dai et patriote, Tran-Quang-Vinh serait un successeur parfait pour perpétuer l'héritage de Nam-Hung. Choisissons-le comme notre successeur."

 VIE_NH_Promote_PhuQuoc_Hoi_Comrades: "Faites la promotion de nos camarades Phuc-Quoc"
 VIE_NH_Promote_PhuQuoc_Hoi_Comrades_desc: "Nos camarades de Phuc-Quoc Hoi (Ligue nationale pour la restauration du Vietnam) nous ont bien servi dans la lutte contre l'impérialisme. Nommons-les à des postes importants pour remplacer les anciens bureaucrates nommés par Bao-Dai."

 VIE_NH_ReEstablish_VietKienQuocQuan: "Rétablir le « Viet-Kien Quoc-Quan »"
 VIE_NH_ReEstablish_VietKienQuocQuan_desc: "Notre armée est actuellement désorganisée car les milices religieuses et les paramilitaires Binh-Xuyen contrôlent une partie importante de notre nation et de nos forces armées. Consolidons une armée professionnelle dans notre guerre contre le Viet-minh."

 VIE_NH_Request_Montagnard_Dominion: "Demander la domination sur les Montagnards"
 VIE_NH_Request_Montagnard_Dominion_desc: "Avant le coup d'État, Bao-Dai contrôlait le Dominion Montagnard comme l'un de ses domaines de la Couronne. Puisque nous avons pris le contrôle du Vietnam, envoyons une demande au gouvernement français pour qu'il reconnaisse également notre contrôle sur le Dominion Montagnard."

 VIE_NH_Established_DanVuong_Model: "Établir le modèle « Dan-Vuong »"
 VIE_NH_Established_DanVuong_Model_desc: "L'empereur Nam-Hung a une philosophie intéressante sur le changement de la monarchie vietnamienne, appelée modèle Dan-Vuong, ou monarchie populaire. Introduisons ce modèle au Vietnam comme moyen de réformer la monarchie archaïque et de rapprocher le Vietnam de la modernité."

 VIE_NH_Established_DacPhu_DanTien_Cuoc_Commission: "Créer la Commission « Dac-Phu Dan-Tien Cuoc »"
 VIE_NH_Established_DacPhu_DanTien_Cuoc_Commission_desc: "Afin d'amener le Vietnam à la modernité, nous devons également y apporter la technologie moderne. Créons la Commission Dac-Phu Dan-Tien pour amener la technologie occidentale au Vietnam."

 VIE_NH_BuuNhu_Labor_Reforms: "Autoriser les réformes du travail Buu-Nhu"
 VIE_NH_BuuNhu_Labor_Reforms_desc: "Pendant des décennies, les Français ont exploité notre travail pour envoyer des matières premières à Paris, et même si l'influence française diminue au Vietnam, les conditions de travail ne se sont toujours pas améliorées. Pour alléger les souffrances du peuple, l'Empereur a décidé d'approuver les réformes du travail de Buu et Nhu."

 VIE_NH_Political_Harmony: "Assurer l'harmonie politique"
 VIE_NH_Political_Harmony_desc: "Étant donné que le Vietnam compte actuellement de nombreux groupes politiques qui se disputent leur influence, il serait dangereux de les laisser sans contrôle, car nous sommes toujours en guerre contre le Nord. Formons un front uni pour maintenir l'unité au Vietnam."

 VIE_NH_Outlaw_Francophiles: "Organisations francophiles hors-la-loi"
 VIE_NH_Outlaw_Francophiles_desc: "De nombreuses organisations pro-françaises dans notre pays ne servent que les intérêts français au lieu de ceux de notre peuple. Interdisons-les pour réduire toute influence française au Vietnam."

 VIE_NH_Pacifying_NamPhan: "Pacifier Nam-Phan"
 VIE_NH_Pacifying_NamPhan_desc: "La campagne du sud du Vietnam regorge de nombreuses factions qui se disputent l'influence, allant des criminels Binh-Xuyen aux milices religieuses contrôlées par les caodaistes, les hoahaoistes et les catholiques. Maîtrisons ces factions afin de consolider notre contrôle sur le Sud-Vietnam."

 VIE_NH_Destroy_UMDC: "Détruire l'UMDC"
 VIE_NH_Destroy_UMDC_desc: "Le traitement brutal infligé par l'UMDC à la population locale dans les campagnes ne contribuera pas à notre cause visant à rétablir l'ordre au Vietnam. Mettons fin à cette organisation et rétablissons le contrôle du Vietnam."

 VIE_NH_Promote_TamDan_Policies: "Promouvoir les politiques « Tam-Dan »"
 VIE_NH_Promote_TamDan_Policies_desc: "Les Trois principes du peuple de Sun Yat-Sen ou Chu Nghia Tam-Dan en vietnamien ont aidé la Chine à passer du statut d'homme malade de l'Asie à la modernité. Mettons en oeuvre l'idée de Sun pour amener le Vietnam à l'ère moderne."

 VIE_NH_DanToc: "Dan-Toc"
 VIE_NH_DanToc_desc: "Outre la majorité Kinh, le Vietnam compte également d'autres groupes ethniques. Nous devons promouvoir le concept de nationalisme de Sun pour unir tous les groupes ethniques du Vietnam."

 VIE_NH_HamBac_HopNhut_Luan: "Nam-Bac Hop-Nhut Luan"
 VIE_NH_HamBac_HopNhut_Luan_desc: "Si la guerre entre le Nord et le Sud continue, notre peuple continuera de souffrir. Négocions un cessez-le-feu afin de pouvoir élaborer un plan de réunification pour les deux parties."

 VIE_NH_Using_Diem_Ho_Connections: "Utiliser les connexions de Diem avec Ho"
 VIE_NH_Using_Diem_Ho_Connections_desc: "Malgré leurs différences, il semble que Diem et Ho aient finalement un objectif commun pour le Vietnam. Utilisons cette connexion pour envoyer Diem négocier avec Ho en territoire neutre sur la manière d'unifier le Vietnam."

 VIE_NH_DanQuyen: "Dan Quyen"
 VIE_NH_DanQuyen_desc: "L'interprétation de la démocratie par les Trois Principes comprend les droits d'élection, de révocation, d'initiative et de référendum. Mettons ces droits en pratique pour montrer à l'Occident que nous sommes capables d'être une nation démocratique."

 VIE_NH_Spread_Western_Progressive_Values: "Diffuser les valeurs occidentales progressistes"
 VIE_NH_Spread_Western_Progressive_Values_desc: "Outre les Trois Principes, une partie importante de notre population a reçu une éducation à l'étranger, comme en France, et est familiarisée avec les valeurs occidentales. Employons nos meilleurs talents auprès du gouvernement pour promouvoir ces valeurs."

 VIE_NH_Fight_Against_BinhXuyen_Criminal_Empire: "Lutte contre l'empire criminel de Binh-Xuyen"
 VIE_NH_Fight_Against_BinhXuyen_Criminal_Empire_desc: "Les criminels de Binh-Xuyen terrorisent nos citoyens depuis des années. Mettons fin à cette organisation et rétablissons le contrôle du Vietnam."

 VIE_NH_DanSinh: "Dan Sinh"
 VIE_NH_DanSinh_desc: "Si nous voulons le soutien de notre peuple, nous devons également veiller à son bien-être. Soutenons les programmes sociaux et les réformes agraires pour apporter la prospérité à notre peuple."

 VIE_NH_Nationwide_Investment_Hamlets_Electrification: "Investissez dans l'électrification des hameaux à l'échelle nationale"
 VIE_NH_Nationwide_Investment_Hamlets_Electrification_desc: "Actuellement, l'infrastructure des hameaux vietnamiens moyens est inférieure à celle de l'Occident. Investissons dans les hameaux des campagnes du pays pour améliorer la vie de notre population."

 VIE_NH_Welcome_Japanese_Industrialists: "Bienvenue aux industriels japonais"
 VIE_NH_Welcome_Japanese_Industrialists_desc: "Le Japon est à l'avant-garde de l'industrie en Asie depuis le XIXe siècle. Invitons-les afin qu'ils partagent leur expertise pour nous aider à industrialiser notre pays."

 VIE_NH_Promote_KyNghe_Hoa: "Promouvoir \"Ky-Nghe-Hoa\""
 VIE_NH_Promote_KyNghe_Hoa_desc: "Outre la technologie, le Vietnam possède également un potentiel inexploité en matière de matières premières. Investissons davantage dans notre industrie pour nous permettre de devenir autosuffisants."

 VIE_NH_Establish_National_Labor_Union: "Créer un syndicat national du travail"
 VIE_NH_Establish_National_Labor_Union_desc: "Avec le succès des réformes du travail de Buu-Nhu au Vietnam, créons un syndicat national pour améliorer les conditions de nos travailleurs."

 VIE_NH_End_HuynhDe_TuongTan: "Mettre fin au « Huynh-De Tuong-Tan »"
 VIE_NH_End_HuynhDe_TuongTan_desc: "Avec les progrès que nous avons réalisés dans nos efforts d'unification, envoyons notre proposition de réunification du Vietnam au gouvernement communiste du Nord."

 VIE_NH_A_House_Divided: "Une maison divisée"
 VIE_NH_A_House_Divided_desc: "Le rêve de retrouvailles fraternelle est en morceaux. Que Hanoï ait renoncé à notre main tendue ou que nous ayons nous-mêmes choisi la cause anticommuniste, le Vietnam reste une maison divisée - et nous devons maintenant décider comment y vivre."

 VIE_NH_Cold_Coexistence: "Coexistence froide"
 VIE_NH_Cold_Coexistence_desc: "Si le Nord ne veut pas nous rejoindre, il ne restera pas nécessairement notre ennemi. Des frontières calmes, des lettres ouvertes et un commerce honnête peuvent maintenir la paix entre les deux Vietnams jusqu'à ce que l'histoire décide du reste."

 VIE_NH_Trade_Across_The_Parallel: "Commerce parallèle"
 VIE_NH_Trade_Across_The_Parallel_desc: "Du riz du Sud pour du charbon du Nord, comme Diem l'avait proposé un jour. Le commerce parallèle lie les deux économies et fait taire les armes des deux côtés de la ligne."

 VIE_NH_The_Betrayed_Ideal: "L'idéal trahi"
 VIE_NH_The_Betrayed_Ideal_desc: "Nous sommes arrivés à Hanoï la main ouverte et ils ont répondu le poing fermé. Que personne ne dise que nous n'avons pas essayé. Si le Nord ne veut pas partager un Vietnam pacifique, alors le Sud doit être prêt à le défendre - et un jour à le racheter."

 VIE_NH_Prepare_Northern_Integration: "Préparez-vous à l'intégration du Nord"
 VIE_NH_Prepare_Northern_Integration_desc: "La réunification reste notre destin ; seule la route a changé. L'armée sera préparée, les cadres formés et l'administration préparée pour le jour où le Nord sera ramené dans le giron national - par tous les moyens qui s'avéreront nécessaires."

 # -- VIE NH Diem's successor tree --
 VIE_NH_Diem_PM: "Premier ministre Diem"
 VIE_NH_Diem_PM_desc: "Ngo Dinh Diem a été choisi pour succéder à Nam-Hung et assumera les fonctions de Premier ministre. Diem apporte au gouvernement son idéologie personnaliste et son leadership fort, combinant les enseignements de Cuong-De avec sa propre vision du Vietnam. Sa nomination marque une nouvelle ère dans la politique vietnamienne, fusionnant le nationalisme révolutionnaire et la philosophie personnaliste."

 VIE_NH_Diem_NhanVinized_CD_Teachings: "Les enseignements de Nhan-Vinize Nam-Hung"
 VIE_NH_Diem_NhanVinized_CD_Teachings_desc: "Diem adaptera les enseignements de Cuong-De à sa propre philosophie Nhan-Vi (personnaliste), créant une synthèse unique du nationalisme révolutionnaire et de l'idéologie personnaliste. Cette version NhanVinisée mettra l'accent sur la dignité individuelle, la justice sociale et l'identité vietnamienne, créant une philosophie politique distincte qui guide les politiques du gouvernement."

 VIE_NH_Diem_Form_NRM: "Formulaire NRM"
 VIE_NH_Diem_Form_NRM_desc: "Le Mouvement révolutionnaire national (NRM) sera formé en tant que parti politique de Diem. Ce mouvement réunira diverses factions politiques sous une seule bannière, créant un parti à large assise qui soutiendra la révolution personnaliste de Diem. Le NRM deviendra la force politique dominante, remplaçant le système de partis fragmenté."

 VIE_NH_Diem_Incorporate_PQH: "Incorporer le Phuc-Quoc Hoi"
 VIE_NH_Diem_Incorporate_PQH_desc: "Le mouvement Phong-trao Quoc-Hoi (PQH) sera intégré à la structure gouvernementale. Cette incorporation apportera des éléments démocratiques au régime de Diem, créant ainsi un système politique plus inclusif tout en conservant son leadership personnaliste. Le PQH offrira une voix démocratique au sein du gouvernement."

 VIE_NH_Diem_Integrate_Buu_CTVN: "Intégrer le CTVN de Buu"
 VIE_NH_Diem_Integrate_Buu_CTVN_desc: "Tran Quoc Buu et la Confédération vietnamienne du travail (CTVN) seront intégrés au gouvernement. L'organisation syndicale de Buu fera partie de la structure de l'État, garantissant la représentation des intérêts des travailleurs tout en maintenant le contrôle du gouvernement sur les mouvements ouvriers. Cette intégration renforcera les liens du gouvernement avec la classe ouvrière."

 VIE_NH_Diem_Begin_Early_Land_Reform: "Commencer la réforme agraire"
 VIE_NH_Diem_Begin_Early_Land_Reform_desc: "La réforme agraire commencera dès le début de l'administration Diem, abordant la question cruciale de la répartition des terres. Cette réforme redistribuera les terres des grands propriétaires terriens vers les paysans, réduisant ainsi les inégalités rurales et gagnant le soutien des campagnes. Toutefois, la réforme doit être gérée avec soin pour éviter de s'aliéner les puissants propriétaires fonciers."

 VIE_NH_Diem_Nationalize_Foreign_Factories: "Nationaliser les usines étrangères"
 VIE_NH_Diem_Nationalize_Foreign_Factories_desc: "Les usines étrangères seront nationalisées, plaçant les actifs industriels sous contrôle vietnamien. Cette décision audacieuse réduira l'influence économique étrangère et créera des opportunités pour les travailleurs et les entrepreneurs vietnamiens. Cependant, cela mettra également à rude épreuve les relations avec les investisseurs étrangers et pourrait potentiellement réduire les investissements étrangers."

 VIE_NH_Diem_AgroCredit_Experiment: "Expérimenter l'Agro-Crédit"
 VIE_NH_Diem_AgroCredit_Experiment_desc: "Une expérimentation de crédit agricole sera lancée pour accorder des prêts aux agriculteurs. Ce programme aidera les paysans à accéder au capital pour améliorer leurs fermes, acheter du matériel et augmenter la productivité. L'expérience testera si le crédit peut stimuler le développement agricole et améliorer le niveau de vie en milieu rural."

 VIE_NH_Diem_Begin_Early_Industrialization: "Commencer l'industrialisation"
 VIE_NH_Diem_Begin_Early_Industrialization_desc: "Les premières industrialisations commenceront, en se concentrant sur le développement des capacités manufacturières du Vietnam. Cela créera des emplois, réduira la dépendance à l'égard des importations et jettera les bases de l'indépendance économique. Le programme d'industrialisation nécessitera des investissements importants et une planification minutieuse pour réussir."

 VIE_NH_Diem_Appoint_Cung_LandReform_Minister: "Nommer Cung au poste de ministre de la Réforme agraire"
 VIE_NH_Diem_Appoint_Cung_LandReform_Minister_desc: "Kieu Cong Cung sera nommé ministre de la Réforme agraire. L'expertise de Cung et son engagement en faveur de la réforme agraire garantiront que le programme de redistribution sera mis en oeuvre efficacement. Son leadership sera crucial pour gagner le soutien des paysans et lutter contre les inégalités rurales."

 VIE_NH_Diem_Mobilize_Syndicates: "Mobiliser les syndicats"
 VIE_NH_Diem_Mobilize_Syndicates_desc: "Les syndicats seront mobilisés pour soutenir les programmes économiques du gouvernement. Ces groupes syndicaux organisés aideront à mettre en oeuvre des politiques industrielles, garantiront la participation des travailleurs au développement économique et créeront un sentiment d'unité nationale autour des objectifs économiques. La mobilisation renforcera les liens du gouvernement avec la classe ouvrière."

 VIE_NH_Diem_Modernize_Countryside: "Moderniser la campagne"
 VIE_NH_Diem_Modernize_Countryside_desc: "Les campagnes seront modernisées grâce au développement des infrastructures, de l'éducation et de la technologie. Cette modernisation améliorera le niveau de vie rural, augmentera la productivité agricole et réduira le fossé entre zones urbaines et zones rurales. Le programme nécessitera des investissements importants mais contribuera à intégrer les zones rurales dans l'économie nationale."

 VIE_NH_Diem_Import_Foreign_Machinery: "Importer des machines étrangères"
 VIE_NH_Diem_Import_Foreign_Machinery_desc: "Des machines et des technologies étrangères seront importées pour soutenir l'industrialisation et la modernisation de l'agriculture. Cet équipement aidera le Vietnam à rattraper son retard sur les pays plus développés, en améliorant sa productivité et son efficacité. Toutefois, les importations nécessiteront des devises et pourraient accroître la dépendance à l'égard des fournisseurs étrangers."

 VIE_NH_Diem_Begin_5YP: "Commencer le plan quinquennal"
 VIE_NH_Diem_Begin_5YP_desc: "Un plan quinquennal sera lancé pour guider le développement économique. Ce plan global fixera des objectifs en matière de croissance industrielle, d'amélioration de l'agriculture, de développement des infrastructures et de progrès social. Le plan coordonnera les efforts du gouvernement et fournira une feuille de route pour la transformation économique du Vietnam."

 VIE_NH_Diem_Establish_CNP: "Créer le CNP"
 VIE_NH_Diem_Establish_CNP_desc: "Le Can Lao Nhan Vi Cach Mang Dang (CNP) sera créé en tant que parti révolutionnaire personnaliste de Diem. Ce parti servira d'avant-garde de la révolution personnaliste, organisant ses partisans et mettant en oeuvre l'idéologie de Diem dans toute la société. Le CNP deviendra le noyau de la machine politique de Diem."

 VIE_NH_Diem_NhanVinize_Bureaucracy: "Nhan-Vinize la bureaucratie"
 VIE_NH_Diem_NhanVinize_Bureaucracy_desc: "La bureaucratie sera NhanVinisée, lui insufflant une idéologie personnaliste et garantissant que les responsables gouvernementaux adhèrent à la vision de Diem. Cela créera une administration plus unifiée sur le plan idéologique, mais cela pourrait également réduire l'efficacité bureaucratique et limiter la diversité de pensée au sein du gouvernement."

 VIE_NH_Diem_Feminist_Reforms: "Introduire des réformes féministes"
 VIE_NH_Diem_Feminist_Reforms_desc: "Des réformes féministes seront mises en oeuvre pour améliorer les droits et le statut des femmes dans la société vietnamienne. Ces réformes s'attaqueront aux inégalités juridiques, élargiront les opportunités d'éducation pour les femmes et favoriseront la participation des femmes à la vie publique. Les réformes moderniseront la société vietnamienne et gagneront le soutien des éléments progressistes."

 VIE_NH_Diem_1st_GiaDinh_Law: "Premier droit de la famille"
 VIE_NH_Diem_1st_GiaDinh_Law_desc: "La première loi Gia Dinh sera adoptée, établissant de nouveaux cadres juridiques pour les relations familiales et sociales. Cette loi codifiera les principes personnalistes sous une forme juridique, créant ainsi une base pour la révolution personnaliste. La loi abordera la structure familiale, l'héritage et l'organisation sociale."

 VIE_NH_Diem_PhuNu_LienDoi_Movement: "Fondé le mouvement Phu-Nu Lien-Doi"
 VIE_NH_Diem_PhuNu_LienDoi_Movement_desc: "Le mouvement Phu Nu Lien Doi (Ligue des femmes) sera formé pour mobiliser les femmes en soutien au gouvernement. Ce mouvement organisera les femmes pour l'action politique, le service social et la défense nationale. La ligue créera une force paramilitaire féminine et élargira le rôle des femmes dans la vie publique."

 VIE_NH_Diem_Pardon_Ex_VietMinh: "Pardon ex-Viet-Minh"
 VIE_NH_Diem_Pardon_Ex_VietMinh_desc: "Les anciens membres du Viet Minh seront graciés et réintégrés dans la société. Cette amnistie contribuera à apaiser les divisions, à réduire l'opposition et à amener des combattants expérimentés dans le giron du gouvernement. Cette grâce démontrera l'engagement de Diem en faveur de la réconciliation et de l'unité nationales."

 VIE_NH_Diem_Study_Marxist_Org: "Étudier l'organisation marxiste"
 VIE_NH_Diem_Study_Marxist_Org_desc: "Les méthodes d'organisation marxistes seront étudiées et adaptées pour être utilisées dans la révolution personnaliste. Cette approche pragmatique tirera les leçons des succès communistes tout en conservant l'idéologie personnaliste. L'étude contribuera à améliorer l'organisation gouvernementale et les techniques de mobilisation de masse."

 VIE_NH_Diem_Expand_CNP: "Développer le CNP"
 VIE_NH_Diem_Expand_CNP_desc: "Le CNP sera considérablement élargi, augmentant ainsi son nombre de membres et son influence dans la société. Cette expansion renforcera la base politique de Diem et garantira que l'idéologie personnaliste pénètre tous les niveaux de la société vietnamienne. Le parti élargi deviendra un puissant outil de contrôle social et de mobilisation."

 VIE_NH_Diem_Promote_Viet_Patriotism: "Promouvoir le patriotisme vietnamien"
 VIE_NH_Diem_Promote_Viet_Patriotism_desc: "Le patriotisme vietnamien sera promu pour unir la nation et renforcer l'identité nationale. Cette promotion mettra l'accent sur la culture, l'histoire et les valeurs vietnamiennes, créant ainsi un sentiment de fierté et d'unité. La campagne contribuera à contrer les divisions régionales et idéologiques."

 VIE_NH_Diem_Mend_Class_Tensions: "Apaiser les tensions de classe"
 VIE_NH_Diem_Mend_Class_Tensions_desc: "Les tensions de classe seront résolues par le biais de programmes sociaux et de politiques économiques. Cet effort réduira les inégalités, améliorera les conditions de travail et créera des opportunités de mobilité sociale. En réparant les divisions de classe, le gouvernement renforcera l'unité nationale et réduira les sources potentielles d'opposition."

 VIE_NH_Diem_Outlaw_Viet_Quoc: "Interdire le VNQDD"
 VIE_NH_Diem_Outlaw_Viet_Quoc_desc: "Le Viet-Quoc (VNQDD) sera interdit en tant que menace pour le gouvernement. Cette interdiction éliminera un rival nationaliste et l'empêchera d'organiser une opposition. Cette mise hors-la-loi créera également un casus belli contre Phu Quoc, où le VNQDD a établi un gouvernement rival."

 VIE_NH_Diem_Destroy_Org_Crime: "Détruire les crimes organisés"
 VIE_NH_Diem_Destroy_Org_Crime_desc: "Le crime organisé, en particulier le Binh Xuyen, sera détruit par une action militaire. Cette répression éliminera les éléments criminels qui menacent l'autorité et le contrôle du gouvernement. La destruction du crime organisé démontrera la force du gouvernement et son engagement à maintenir l'ordre."
 VIE_NH_Diem_Destroy_Org_Crime_tt: "§YLe-Van-Vien§! et le §YBinh-Xuyen§! §Rrefuseront de se dissoudre§!:\n  §GLe-Van-Vien§! fait défaut et devient le §Yleader des Binh-Xuyen§!\n  Le Binh-Xuyen §RSaisir le contrôle§! de §YPhuoc-Tuy§!, §YRung-Sac§!et §YCholon§!\n  Les Binh-Xuyen §Rlèvent leurs milices§! aux portes de §YSaigon§!\n  Nous §Rdéclarons la guerre§! au §YBinh-Xuyen§!"

 VIE_NH_Diem_Disarm_Religious_Private_Armies: "Désarmer les armées privées religieuses"
 VIE_NH_Diem_Disarm_Religious_Private_Armies_desc: "Les armées privées religieuses, dont celles des sectes Cao Dai et Hoa Hao, seront désarmées. Cela éliminera les forces militaires indépendantes et placera tous les groupes armés sous le contrôle du gouvernement. Le désarmement renforcera le monopole de l'État sur la violence mais risque d'aliéner les communautés religieuses."

 VIE_NH_Diem_Form_Rev_Youth_Movements: "Former des mouvements de jeunesse révolutionnaires"
 VIE_NH_Diem_Form_Rev_Youth_Movements_desc: "Des mouvements de jeunesse révolutionnaires seront formés pour mobiliser les jeunes en faveur de la révolution personnaliste. Ces mouvements organiseront la jeunesse pour l'action politique, le service social et la défense nationale. Les mouvements créeront une nouvelle génération engagée dans la vision de Diem."

 VIE_NH_Diem_Promoting_Pan_Asianism: "Promouvoir le panasiatisme"
 VIE_NH_Diem_Promoting_Pan_Asianism_desc: "Le panasiatisme sera encouragé pour renforcer la solidarité avec les autres nations asiatiques. Cette idéologie mettra l'accent sur l'unité asiatique, les valeurs partagées et les intérêts communs, créant ainsi un sentiment d'identité régionale. Cette promotion améliorera les relations avec les pays asiatiques tout en s'aliénant potentiellement les puissances occidentales."

 VIE_NH_Diem_Begin_Second_Stage_of_Personalist_Revolution: "Commencer la 2e étape de la révolution personnaliste"
 VIE_NH_Diem_Begin_Second_Stage_of_Personalist_Revolution_desc: "La deuxième étape de la révolution personnaliste va commencer, approfondissant la transformation de la société vietnamienne. Cette étape se concentrera sur la révolution culturelle, l'endoctrinement idéologique et la réorganisation sociale complète. La deuxième étape intensifiera la révolution personnaliste et créera une transformation plus radicale."

 VIE_NH_Diem_Rev_Paramilitaries: "Former des paramilitaires révolutionnaires"
 VIE_NH_Diem_Rev_Paramilitaries_desc: "Des paramilitaires révolutionnaires seront formés pour soutenir le gouvernement et faire respecter l'idéologie personnaliste. Ces groupes armés viendront compléter l'armée régulière, assurant la sécurité et le contrôle politique. Les paramilitaires deviendront un outil clé pour maintenir l'ordre et mettre en oeuvre la révolution."

 VIE_NH_Diem_Rev_VKQQ: "Formez le VKQQ révolutionnaire"
 VIE_NH_Diem_Rev_VKQQ_desc: "La VKQQ (Garde nationale vietnamienne) sera révolutionnée, en lui insufflant une idéologie personnaliste et en assurant sa loyauté envers Diem. Cette transformation créera une force militaire plus fiable politiquement, engagée dans la révolution personnaliste et les objectifs du gouvernement."

 VIE_NH_Diem_Promote_NhanVi_Loyalists: "Promouvoir les loyalistes de Nhan-Vi"
 VIE_NH_Diem_Promote_NhanVi_Loyalists_desc: "Les loyalistes de NhanVi seront promus au sein du gouvernement et de l'armée. Ces personnalistes engagés se verront attribuer des postes clés, garantissant que la révolution sera dirigée par de vrais croyants. La promotion créera une élite fidèle dédiée à la vision de Diem."

 VIE_NH_Diem_NhanVi_Pol_Commissar: "Commissaire politique de Nhan-Vi"
 VIE_NH_Diem_NhanVi_Pol_Commissar_desc: "Des commissaires politiques seront introduits dans l'armée, assurant le contrôle idéologique et la loyauté. Ces commissaires surveilleront la fiabilité politique, fourniront une éducation idéologique et empêcheront la déloyauté. Le système des commissaires créera une armée plus contrôlée politiquement."

 VIE_NH_Diem_Adopt_Jungle_Training: "Adoptez la formation dans la jungle"
 VIE_NH_Diem_Adopt_Jungle_Training_desc: "Un entraînement dans la jungle sera adopté pour préparer les militaires aux opérations de contre-insurrection. Cette formation spécialisée apprendra aux soldats à opérer efficacement sur le terrain difficile du Vietnam, à combattre les guérilleros et à maintenir le contrôle dans les zones rurales. La formation améliorera l'efficacité de l'armée contre les insurgés."

 VIE_NH_Diem_ThuDuc_Army_Academy: "J'ai trouvé l'Académie militaire de Thu-Duc"
 VIE_NH_Diem_ThuDuc_Army_Academy_desc: "L'Académie militaire de Thu Duc sera créée pour former des officiers militaires. Cette académie produira des officiers qualifiés engagés dans la révolution personnaliste, combinant expertise militaire et endoctrinement idéologique. L'académie deviendra la principale source de leadership militaire."

 VIE_NH_Diem_Armed_Womens_Wing: "Former l'aile des femmes armées"
 VIE_NH_Diem_Armed_Womens_Wing_desc: "Une branche armée des femmes sera formée, créant des unités militaires féminines. Cela élargira le rôle des femmes dans la défense nationale et démontrera l'engagement du gouvernement en faveur de l'égalité des sexes. Les unités féminines serviront dans des rôles de combat et de soutien, brisant les barrières traditionnelles entre les sexes."

 VIE_NH_Diem_Rev_Fanaticism: "Fanatisme révolutionnaire"
 VIE_NH_Diem_Rev_Fanaticism_desc: "Le fanatisme révolutionnaire sera encouragé pour créer une population intensément engagée. Cela impliquera un endoctrinement idéologique, des campagnes de propagande et une pression sociale pour faire preuve de loyauté. Le fanatisme créera une société plus unifiée et plus engagée, mais pourrait également conduire à l'extrémisme et à l'intolérance."

 VIE_NH_Diem_Modern_Warfare_Tactics: "Présenter les tactiques de guerre modernes"
 VIE_NH_Diem_Modern_Warfare_Tactics_desc: "Des tactiques de guerre modernes seront adoptées pour améliorer l'efficacité militaire. Cela impliquera une formation à de nouvelles méthodes de combat, l'utilisation d'équipements modernes et une adaptation à la doctrine militaire contemporaine. Cette adoption aidera l'armée à rivaliser avec des forces plus avancées."

 VIE_NH_Diem_Raise_Soldier_Pay: "Augmenter la solde des soldats"
 VIE_NH_Diem_Raise_Soldier_Pay_desc: "La solde des soldats sera augmentée pour améliorer le moral et attirer de meilleures recrues. Cela rendra le service militaire plus attractif, réduira la désertion et améliorera la qualité des forces armées. L'augmentation des salaires nécessitera des dépenses publiques supplémentaires mais renforcera l'armée."

 VIE_NH_Diem_2nd_Mil_Reforms: "Commencer la deuxième réforme militaire"
 VIE_NH_Diem_2nd_Mil_Reforms_desc: "Une deuxième série de réformes militaires sera mise en oeuvre, modernisant et améliorant davantage les forces armées. Ces réformes remédieront aux faiblesses restantes, adopteront de nouvelles technologies et amélioreront l'organisation. Le deuxième cycle s'appuiera sur les réformes précédentes et poursuivra la transformation de l'armée."

 VIE_NH_Nhiep_PM: "Premier ministre Nguyen-Rinh-Nhiep"
 VIE_NH_Nhiep_PM_desc: "L'empereur Nam-Hung étant parti, le mouvement Phuc-Quoc doit gouverner sans l'homme qui l'a maintenu ensemble. Nguyen-Rinh-Nhiep, l'un des plus fidèles partisans du défunt empereur, s'est vu confier le poste de Premier ministre. Là où d'autres se tournent vers Paris ou Washington, Nhiep se tourne vers Hué et Tokyo. Son gouvernement honorera la mémoire de Nam-Hung, restaurera la capitale impériale, renforcera Phuc-Quoc-Hoi et tiendra en laisse ses rivaux ambitieux."

 VIE_NH_Nhiep_Request_Crownlands: "Demander les domaines de la Couronne"
 VIE_NH_Nhiep_Request_Crownlands_desc: "Les domaines de la Couronne étaient séparés du reste du pays selon les arrangements français et impériaux. Nhiep demandera à Paris leur transfert sous administration vietnamienne, liant leurs provinces et leurs ressources à l'État fondé par Nam-Hung et les refusant à toute autorité rivale."

 VIE_NH_Nhiep_Repatriate_JAP_Families: "Rapatrier les familles japonaises"
 VIE_NH_Nhiep_Repatriate_JAP_Families_desc: "De nombreux parents et compagnons de Nam-Hung l'ont suivi en exil et ont passé des décennies au Japon. Maintenant que l'Empereur est mort, ils souhaitent rentrer chez eux et honorer son héritage. Nous travaillerons avec les autorités japonaises pour ramener ces familles au Vietnam, en récompense de la loyauté dont elles ont fait preuve envers le défunt empereur au cours de ses longues années à l'étranger."

 VIE_NH_Nhiep_Establish_VIE_JAP_Friendship: "Établir l'amitié vietnamo-japonaise"
 VIE_NH_Nhiep_Establish_VIE_JAP_Friendship_desc: "Le prince Cuong-De a passé des décennies en exil au Japon, et le lien entre le mouvement Phuc-Quoc et Tokyo est profond. Nous placerons ce lien sur une base formelle avec des sociétés d'amitié, des échanges culturels et des programmes étudiants, ouvrant ainsi la porte au capital et à l'expertise japonais alors que le Japon reconstruit sa propre économie."

 VIE_NH_Nhiep_Modernize_PhuXuan: "Moderniser Phu-Xuan"
 VIE_NH_Nhiep_Modernize_PhuXuan_desc: "Phu-Xuan, l'ancienne capitale impériale de Hué, a été marquée par les combats de 1945 et 1947 et a dépéri pendant que Saigon prospérait. Une monarchie restaurée a besoin d'un capital à la hauteur. Nous reconstruirons ses routes, ses services publics et ses bâtiments publics, faisant ainsi de Phu-Xuan le coeur politique et culturel de la nation."

 VIE_NH_Nhiep_Build_PhuXuan_Metro: "Construire le métro Phu-Xuan"
 VIE_NH_Nhiep_Build_PhuXuan_Metro_desc: "Une capitale moderne a besoin de transports modernes. Avec des ingénieurs japonais et des prêts japonais, nous poserons les premières lignes d'un chemin de fer urbain traversant Phu-Xuan, reliant la citadelle, les quartiers fluviaux et les nouveaux faubourgs. Aucune autre ville d'Indochine n'aura une telle situation."

 VIE_NH_Nhiep_Prepare_Mausoleum: "Préparez le mausolée impérial"
 VIE_NH_Nhiep_Prepare_Mausoleum_desc: "Les empereurs Nguyen reposent dans de grands tombeaux le long de la rivière des Parfums, et Nam-Hung, qui a ramené au pouvoir la véritable lignée de la dynastie, ne mérite rien de moins. Nous élèverons à Phu-Xuan un mausolée digne de son héritage, un monument qui rappellera à chaque génération qui a libéré le Vietnam de Bao-Dai et de l'ordre colonial."

 VIE_NH_Nhiep_Rebuild_Imperial_Citadel: "Reconstruire la Citadelle Impériale"
 VIE_NH_Nhiep_Rebuild_Imperial_Citadel_desc: "La grande citadelle de Hué, siège de la dynastie des Nguyen, est en partie en ruines après des années de guerre et de négligence. Nous restaurerons ses murs et ses portes et construirons autour d'elle de nouveaux ateliers et usines, y compris une usine de fusiliers pour armer nos soldats, afin que Phu-Xuan redevienne un centre de pouvoir et non seulement de mémoire."

 VIE_NH_Nhiep_Expand_PQH: "Agrandissez le Phuc-Quoc-Hoi"
 VIE_NH_Nhiep_Expand_PQH_desc: "Les Phuc-Quoc-Hoi portèrent la cause de Nam-Hung pendant des décennies d'exil. Sans lui, il doit devenir un véritable parti au pouvoir ou s'effondrer. Nous convoquerons sa première conférence nationale, ouvrirons de nouvelles sections dans chaque province, recruterons parmi les fonctionnaires, les anciens combattants et les étudiants, et ferons de la Ligue l'épine dorsale du nouvel État."

 VIE_NH_Nhiep_Contain_Diem: "Contenir Diem"
 VIE_NH_Nhiep_Contain_Diem_desc: "Ngo-Dinh-Diem a autrefois servi la cause de Nam-Hung, mais ses ambitions et les réseaux de ses frères vont bien au-delà de toute fonction que nous pourrions lui confier. Nous retirerons Ngo-Dinh-Nhu de son commandement, éloignerons les partisans de Diem de l'armée et veillerons à ce que l'État du défunt empereur ne devienne pas la propriété d'une seule famille."

 VIE_NH_Nhiep_Adopt_KMT_Org: "Adopter l'organisation du Kuomintang"
 VIE_NH_Nhiep_Adopt_KMT_Org_desc: "Le Kuomintang a construit un parti-État discipliné à partir d'une Chine fracturée, avec des cellules du parti s'étendant jusqu'à l'armée, les écoles et les villages. Nous étudierons leurs méthodes et réorganiserons le Phuc-Quoc-Hoi dans le même sens, donnant à la Ligue une structure capable de gouverner une nation en guerre."

 VIE_NH_Nhiep_Disband_XacTe: "Dissoudre le Xac-Te"
 VIE_NH_Nhiep_Disband_XacTe_desc: "Les Xac-Te, l'ancienne Sûreté coloniale, passèrent des années à traquer les agents de Nam-Hung pour le compte de Bao-Dai et des Français. Une police politique bâtie pour servir les maîtres coloniaux n'a pas sa place dans le nouvel État. Nous le dissoudrons et reformerons ses hommes armés en bataillons de sécurité de combat sous commandement de l'armée, où leurs compétences pourront servir la nation plutôt que de l'espionner."

 VIE_NH_Nhiep_Permit_VNQDD: "Autoriser le VNQDD"
 VIE_NH_Nhiep_Permit_VNQDD_desc: "Le Viet-Nam Quoc-Dan-Dang partage notre haine du communisme et notre croyance en l'indépendance vietnamienne, même s'il n'a jamais partagé notre loyauté envers Nam-Hung. Plutôt que de pousser ses membres dans les bras du Viet-Quoc à Phu-Quoc ou dans la jungle, nous permettrons au parti d'opérer ouvertement sous Vu-Hong-Khanh, sous surveillance, en tant qu'allié nationaliste loyal."

 VIE_NH_Diem_Forming_Tay_Ninh_Revolutionary_Training_Base: "Créer la base d'entraînement révolutionnaire de Tay-Ninh"
 VIE_NH_Diem_Forming_Tay_Ninh_Revolutionary_Training_Base_desc: "Tay-Ninh, à la frontière cambodgienne, offre à Saigon un territoire ouvert, une population fidèle et loin des regards indiscrets. Nous y établirons une base de formation révolutionnaire, où les cadres et les recrues paramilitaires seront formés à la fois au métier de soldat et à l'idéologie avant de retourner dans leurs provinces pour faire avancer la révolution."
 VIE_NH_Hung_Form_AntiCommunist_Front_tt: "§RLes mouvements communistes du Vietnam nous en voudront beaucoup§!"
 VIE_NH_Hung_Modernizing_War_Tactics_tt: "§GLes installations navales de Gia-Dinh seront agrandies§!"
 Enable_Ideological_Decision_TT: "§GDébloque les décisions de l'Organisation marxiste et accorde §Y5§G des pools de cadres Chieu-Hoi réhabilités§!"

 VIE_NH_Vinh_PM: "Premier ministre Tran-quang-Vinh"
 VIE_NH_Vinh_PM_desc: "Tran-quang-Vinh, commandant de l'armée Cao-Dai et allié de longue date de Nam-Hung, a été nommé Premier ministre après la mort de l'empereur. Son pouvoir repose sur les fidèles de Tay-Ninh et les troupes du Saint-Siège. Vinh cherchera à unir les nombreuses confessions religieuses du pays derrière le gouvernement tout en plaçant les sectes armées sous l'autorité de l'État."

 VIE_NH_Vinh_Bring_other_faiths_together: "Rassembler d'autres confessions"
 VIE_NH_Vinh_Bring_other_faiths_together_desc: "Le Cao-Daïsme enseigne que toutes les grandes religions partagent une seule vérité. Vinh mettra cet enseignement en pratique en invitant les dirigeants bouddhistes, catholiques, hoa-hao et confucéens à un conseil commun sous le patronage du gouvernement. Il sera bien plus difficile pour les communistes de diviser une nation dont les religions sont unies."

 VIE_NH_Vinh_Purge_Phuong: "Purger les factions du général Phuong"
 VIE_NH_Vinh_Purge_Phuong_desc: "Le général Nguyen-Thanh-Phuong commande sa propre faction au sein de l'armée Cao-Dai et n'a jamais accepté la direction de Vinh. Ses officiers dépendent de lui plutôt que du gouvernement, et ses ambitions menacent à la fois le Saint-Siège et l'État. Nous retirerons ses partisans de leurs commandements avant qu'ils ne puissent agir contre nous."

 VIE_NH_Vinh_Promote_Phuc_quoc_and_Cao_daiism: "Promouvoir les enseignements de Phuc-Quoc et du Cao-Daïsme"
 VIE_NH_Vinh_Promote_Phuc_quoc_and_Cao_daiism_desc: "La foi Cao-Dai et le mouvement Phuc-Quoc marchent ensemble depuis l'époque de l'occupation japonaise, et c'est à Tay-Ninh que Nam-Hung trouva ses premiers fidèles. Nous ferons la promotion de ces deux aspects à travers les écoles, les temples et la presse, en présentant la restauration du défunt empereur et le renouveau spirituel de la nation comme les deux moitiés d'une même cause."

 VIE_NH_Vinh_Expand_the_Holy_See: "Agrandir le Saint-Siège"
 VIE_NH_Vinh_Expand_the_Holy_See_desc: "Le Saint-Siège de Tay-Ninh est le centre spirituel de millions de fidèles Cao-Dai. Avec le soutien de l'État, nous agrandirons ses temples, ses écoles et ses ateliers, faisant de Tay-Ninh un centre provincial prospère et une vitrine de ce que la foi et le gouvernement peuvent accomplir ensemble."

 VIE_NH_Vinh_Expand_Countryside_Roads: "Développer les routes de campagne"
 VIE_NH_Vinh_Expand_Countryside_Roads_desc: "Les villages du sud ne sont reliés entre eux que par des chemins de terre qui sont emportés par les eaux à chaque saison des pluies. De nouvelles routes praticables par tous les temps permettront d'acheminer le riz jusqu'au marché, les soldats jusqu'à la frontière et les représentants du gouvernement vers les communautés qui en ont rarement vu. Là où vont les routes, l'autorité de l'État suit."

 VIE_NH_Vinh_Modernize_Education_System: "Moderniser le système éducatif"
 VIE_NH_Vinh_Modernize_Education_System_desc: "Nos écoles suivent toujours des programmes français construits pour former des employés coloniaux. Nous les réécrirons en vietnamien, développerons les écoles de village et formerons une nouvelle génération d'enseignants. Une population instruite servira mieux la nation qu'une population instruite uniquement à obéir à des maîtres étrangers."

 VIE_NH_Vinh_Disbanding_Ve_quoc_Paramilitaries: "Dissolution des paramilitaires Ve-quoc"
 VIE_NH_Vinh_Disbanding_Ve_quoc_Paramilitaries_desc: "Les paramilitaires Ve-Quoc ont surgi pendant le chaos de la guerre, et nombre d'entre eux servent désormais les hommes forts locaux plus que la nation. Nous les dissoudrons, en offrant à leurs membres une place dans l'armée régulière ou un retour à la vie civile, et mettrons fin à la mosaïque de forces privées qui affaiblit l'État."

 VIE_NH_Vinh_Establish_Tuyen_uy_Corp: "Créer la Tuyen-uy Corp"
 VIE_NH_Vinh_Establish_Tuyen_uy_Corp_desc: "Les soldats se battent plus fort lorsqu'ils savent pourquoi ils se battent. Un corps d'aumôniers Tuyen-Uy issus de toutes les confessions majeures servira aux côtés de nos troupes, répondant à leurs besoins spirituels et leur rappelant qu'ils défendent non seulement un gouvernement mais aussi leurs temples, églises et pagodes contre le communisme athée."

 VIE_NH_Vinh_Integrate_the_Cao_dai_Army: "Intégrer l'armée Cao-dai"
 VIE_NH_Vinh_Integrate_the_Cao_dai_Army_desc: "L'armée de Cao-Dai est la mieux organisée des forces sectaires et le fondement du pouvoir de Vinh. En l'intégrant à l'armée nationale sous forme d'unités régulières, nous gagnerons des milliers de soldats expérimentés et montrerons aux autres sectes que l'intégration est la voie à suivre et non la fin de leur influence."

 VIE_NH_Hung_PM: "Premier ministre Hoang-nam-Hung"
 VIE_NH_Hung_PM_desc: "Hoang-nam-Hung, un nationaliste chevronné lié aux mouvements Dai-Viet et Phuc-Quoc, a été appelé à diriger le gouvernement. Hung est un pragmatique et un anticommuniste farouche. Il stabilisera le sud, courtisera l'Occident et la République de Chine et forgera une armée disciplinée capable d'écraser l'insurrection communiste."

 VIE_NH_Hung_Stabilize_NamPhan: "Stabiliser Nam-Phan"
 VIE_NH_Hung_Stabilize_NamPhan_desc: "Nam-Phan reste déchiré entre les armées sectaires, les syndicats criminels, les cellules communistes et les intérêts français persistants. Avant que quoi que ce soit puisse être construit, l'ordre doit être rétabli. Hung renforcera les administrations provinciales, sécurisera les principales routes et voies navigables et fera sentir la présence du gouvernement dans tous les districts du sud."

 VIE_NH_Hung_Pardon_French_Collaborators: "Pardon aux collaborateurs français"
 VIE_NH_Hung_Pardon_French_Collaborators_desc: "Des milliers de Vietnamiens ont servi dans l'administration coloniale et dans l'armée, et nombre d'entre eux sont les seuls employés, ingénieurs et officiers formés dont nous disposons. Les punir paralyserait l'État. Nous leur accorderons une grâce générale et les inviterons à servir la nation aussi loyalement qu'ils ont servi la France."

 VIE_NH_Hung_Seek_Closer_ties_to_West: "Rechercher des liens plus étroits avec l'Occident"
 VIE_NH_Hung_Seek_Closer_ties_to_West_desc: "La France s'en va, et les États-Unis et la Grande-Bretagne sont les puissances qui décideront de l'avenir de l'Asie. Hung enverra des envoyés à Washington et à Londres, présentant notre gouvernement comme un partenaire fiable contre le communisme et un digne bénéficiaire d'aide, de conseillers et de soutien diplomatique."

 VIE_NH_Hung_Seek_ROC_Support: "Rechercher le soutien de la République de Chine"
 VIE_NH_Hung_Seek_ROC_Support_desc: "Les nationalistes chinois partagent nos ennemis et soutiennent depuis longtemps les nationalistes vietnamiens, du Dai-Viet au VNQDD. Hung renouera ces anciens liens, recherchant des conseillers, des équipements et un soutien politique auprès de la République de Chine dans notre lutte commune."

 VIE_NH_Hung_Invite_Foreign_Investors: "Inviter des investisseurs étrangers"
 VIE_NH_Hung_Invite_Foreign_Investors_desc: "Nos industries sont petites et nos capitaux rares. En ouvrant le pays aux investisseurs américains, britanniques, japonais et chinois, avec des conditions équitables et des garanties contre les saisies, nous pouvons apporter l'argent et l'expertise nécessaires pour construire des usines, des ports et des plantations qui survivront à la guerre."

 VIE_NH_Hung_Emulate_Japanese_Economic_Policy: "Imiter les politiques économiques japonaises"
 VIE_NH_Hung_Emulate_Japanese_Economic_Policy_desc: "Le Japon renaît des cendres de sa défaite grâce à une coopération étroite entre les ministères, les banques et l'industrie. Hung étudiera leur modèle et l'adaptera au Vietnam, en orientant le crédit vers des industries clés, en protégeant les jeunes fabricants et en fixant des objectifs nationaux de croissance."

 VIE_NH_Hung_Enforce_Military_Professionalism: "Faire respecter le professionnalisme militaire"
 VIE_NH_Hung_Enforce_Military_Professionalism_desc: "Trop de nos officiers doivent leur rang à leur famille, à leur faction ou à une faveur politique. Hung établira des normes strictes en matière de promotion, de discipline et de formation, et supprimera les officiers qui ne peuvent pas les respecter. Une armée dirigée par des professionnels gagnera des batailles qu'une armée dirigée par des patrons ne peut gagner."

 VIE_NH_Hung_Outlaw_Private_Militaries: "Militaires privées hors-la-loi"
 VIE_NH_Hung_Outlaw_Private_Militaries_desc: "Les sectes, syndicats et partis du Sud entretiennent chacun leurs propres bandes armées. Aucun État ne peut survivre tant que son autorité est partagée avec des armées privées. Nous les interdirons purement et simplement et donnerons à leurs membres un choix simple : s'enrôler dans l'armée nationale ou déposer les armes."

 VIE_NH_Hung_Form_AntiCommunist_Front: "Former le Front uni anticommuniste"
 VIE_NH_Hung_Form_AntiCommunist_Front_desc: "Les partis nationalistes du Vietnam ont passé autant de temps à se battre entre eux qu'à combattre les communistes. Hung rassemblera le Dai-Viet, le VNQDD, le Phuc-Quoc-Hoi et les mouvements religieux en un seul Front uni anticommuniste, mettant de côté les vieilles querelles jusqu'à ce que l'ennemi commun soit vaincu."

 VIE_NH_Hung_Unify_KienThiet_Army: "Unifier l'armée de Kien-Thiet"
 VIE_NH_Hung_Unify_KienThiet_Army_desc: "Les forces de Kien-Thiet sont dispersées à travers les provinces sous des commandements distincts, chacun avec son propre équipement et sa propre loyauté. Nous les regrouperons sous un quartier général unique avec une formation et un approvisionnement communs, transformant ainsi un ensemble d'unités locales en une armée unifiée."

 VIE_NH_Hung_Modernizing_War_Tactics: "Moderniser les tactiques de guerre"
 VIE_NH_Hung_Modernizing_War_Tactics_desc: "La guerre contre les communistes se déroule dans les rizières, les rivières et la jungle, et non dans les champs ouverts d'Europe. Nos tactiques doivent changer en conséquence. Hung introduira une doctrine moderne pour la guerre mobile et fluviale et étendra les installations navales de Gia-Dinh pour soutenir les opérations dans tout le delta du Mékong."

 VIE_NH_Hung_Intensify_AntiCommunist_Activities: "Intensifier les activités anticommunistes"
 VIE_NH_Hung_Intensify_AntiCommunist_Activities_desc: "Les cadres communistes se déplacent librement dans nos villages, collectant les impôts et recrutant au nez et à la barbe du gouvernement. Nous élargirons nos services de renseignement, éliminerons les cellules souterraines et offrirons l'amnistie à ceux qui sont prêts à se retourner contre leurs anciens camarades. Les communistes ne trouveront aucun endroit sûr dans le sud."

 VIE_NH_Hung_Jail_NgoDinh_Brothers: "Emprisonner les frères Ngo-Dinh"
 VIE_NH_Hung_Jail_NgoDinh_Brothers_desc: "Ngo-Dinh-Diem et ses frères ont bâti des réseaux de partisans au sein de l'Église, de l'armée et de la fonction publique, et ils ne cachent pas leur ambition de gouverner. Hung n'attendra pas qu'ils bougent en premier. Les frères seront arrêtés et détenus jusqu'à ce que leur organisation soit démantelée."

 VIE_NH_Hung_Pardon_VuHongKhanh: "Pardon Vu-Hong-Khanh"
 VIE_NH_Hung_Pardon_VuHongKhanh_desc: "Vu-Hong-Khanh, leader du VNQDD, a passé des années dans l'opposition et en exil. Son parti suscite le respect parmi les nationalistes du Nord et a combattu le Viet-Minh avec autant d'acharnement que quiconque. Une grâce le ramènerait, lui et ses partisans, dans le giron et renforcerait notre front anticommuniste."

 VIE_NH_Hung_Monitor_Buu: "Surveiller les activités syndicalistes de Buu"
 VIE_NH_Hung_Monitor_Buu_desc: "La confédération syndicale de Tran-Quoc-Buu est devenue l'une des plus grandes organisations du pays, et ses tendances syndicalistes inquiètent de nombreux membres du gouvernement. Nous ne l'interdirons pas, mais nos services de sécurité surveilleront de près ses dirigeants, ses fonds et ses interlocuteurs, prêts à agir si les syndicats se retournent contre l'État."

 VIE_NH_Hung_Introduce_Political_Commisars: "Présenter les commissaires politiques"
 VIE_NH_Hung_Introduce_Political_Commisars_desc: "Les communistes doivent une grande partie de leur succès aux responsables politiques qui maintiennent leurs unités disciplinées et motivées. Nous emprunterons la méthode. Les officiers politiques attachés à nos unités éduqueront les troupes aux principes nationalistes, surveilleront les infiltrations et garantiront la loyauté de l'armée envers le gouvernement."

 VIE_NH_Hung_Implement_Armored_Units: "Utiliser des unités blindées"
 VIE_NH_Hung_Implement_Armored_Units_desc: "Les Français ont laissé derrière eux des chars et des véhicules blindés, et nos alliés peuvent en fournir davantage. Organisés en unités blindées appropriées avec des équipages et des mécaniciens formés, ils donneront à notre armée la puissance de frappe nécessaire pour briser les concentrations ennemies et sécuriser les routes qui relient le pays."

 # === Hinh's French Coup Focus Tree ===

 VIE_French_Hinh: "Général Nguyen-Van-Hinh"
 VIE_French_Hinh_desc: "Le général Nguyen-Van-Hinh, un officier formé en France, a été nommé dirigeant du Vietnam à la suite du coup d'État français. Sa loyauté envers la France est incontestable et il servira de dirigeant fantoche pour maintenir le contrôle colonial français."

 VIE_French_Yes_Man: "Nommer des Yes-Men pro-français"
 VIE_French_Yes_Man_desc: "Pour garantir un contrôle français complet, nous devons pourvoir les postes clés du gouvernement avec des fonctionnaires qui suivront sans aucun doute les directives françaises. Ces béni-oui-ou-oui donneront la priorité aux intérêts français plutôt qu'aux préoccupations vietnamiennes, garantissant ainsi une administration coloniale fluide."

 VIE_French_Bureaucrats: "Installer des bureaucrates français"
 VIE_French_Bureaucrats_desc: "Les administrateurs français seront placés à des postes bureaucratiques critiques au sein du gouvernement. Cela garantira que les politiques françaises seront correctement mises en oeuvre et qu'aucun responsable vietnamien ne pourra agir indépendamment du contrôle français."

 VIE_French_Ideals: "Promouvoir les idéaux français"
 VIE_French_Ideals_desc: "Nous devons promouvoir la culture, la langue et les valeurs françaises partout au Vietnam. En soulignant la supériorité de la civilisation française, nous pouvons justifier le maintien du régime colonial et réduire la résistance à l'autorité française."

 VIE_French_MilPurge: "Purger l'armée"
 VIE_French_MilPurge_desc: "L'armée doit être débarrassée des officiers fidèles à l'indépendance vietnamienne ou à d'autres factions politiques. Seuls ceux qui font preuve d'une loyauté absolue envers la France et le régime de Hinh seront autorisés à servir. Cela créera une force militaire disjointe mais docile."

 VIE_French_Phap: "Renforcer la langue française"
 VIE_French_Phap_desc: "Le français doit devenir la langue principale de l'administration, de l'éducation et de la société d'élite. En rendant le français indispensable au progrès, nous veillons à ce que l'élite vietnamienne reste dépendante de la culture et des institutions françaises."

 VIE_French_Propaganda: "Lancer une propagande anticommuniste"
 VIE_French_Propaganda_desc: "Nous lancerons une campagne de propagande massive contre le Viet Minh et le Nord-Vietnam, les présentant comme des marionnettes de Moscou et des ennemis de l'indépendance vietnamienne. Cela déstabilisera nos ennemis tout en justifiant la présence militaire française."

 VIE_French_Cultures: "Mettre l'accent sur l'identité Nam-Ky"
 VIE_French_Cultures_desc: "En promouvant une identité sud-vietnamienne (Nam-Ky) distincte du Nord, nous pouvons créer des divisions régionales qui affaiblissent le nationalisme pan-vietnamien. Cette politique réduira la résistance dans le Sud tout en approfondissant le fossé Nord-Sud."

 VIE_French_Investment: "Attirer les investissements français"
 VIE_French_Investment_desc: "Nous offrirons des conditions favorables aux investisseurs français, en les encourageant à établir des entreprises et des plantations au Vietnam. Cela renforcera les liens économiques avec la France et créera une classe de Vietnamiens bénéficiant du régime colonial."

 VIE_French_Repress: "Mettre en oeuvre des mesures répressives"
 VIE_French_Repress_desc: "Des mesures répressives sévères seront mises en oeuvre contre tous les groupes d'opposition. Les dissidents seront arrêtés, les mouvements de résistance écrasés et tout signe de sentiment anti-français sera sanctionné rapidement et brutalement."

 VIE_French_Quan: "Établir l'ordre et la stabilité"
 VIE_French_Quan_desc: "Grâce à une combinaison de répression, de propagande et d'incitations économiques, nous établirons l'ordre et la stabilité au Vietnam. La population apprendra à accepter la domination française comme l'état naturel des choses."

 VIE_French_Censor: "Mettre en oeuvre la censure"
 VIE_French_Censor_desc: "Tous les médias, publications et discours publics seront soumis à une stricte censure française. Seuls les contenus soutenant la domination française et le gouvernement de Hinh seront autorisés, garantissant qu'aucune voix dissidente ne parvienne au public."

 VIE_French_Laws: "Adopter des lois sur la sécurité"
 VIE_French_Laws_desc: "De nouvelles lois sur la sécurité seront promulguées, donnant au gouvernement de larges pouvoirs pour arrêter et détenir toute personne soupçonnée d'activités anti-françaises. L'appareil An-Ninh Quoc-Gia (Sécurité nationale) sera renforcé pour faire appliquer ces lois."

 VIE_French_Purge: "Terminez la purge"
 VIE_French_Purge_desc: "La purge finale éliminera toute opposition restante au sein du gouvernement et de l'armée. Une fois tous les dissidents éliminés, le régime de Hinh sera pleinement consolidé et prêt à servir de gouvernement fantoche de la France."

 VIE_French_Government: "Établir le gouvernement fantoche"
 VIE_French_Government_desc: "Avec toute l'opposition purgée et le contrôle français fermement établi, le gouvernement de Hinh est désormais pleinement opérationnel en tant que régime fantoche français. Tout en conservant l'apparence de la souveraineté vietnamienne, tout le pouvoir réel reste entre les mains des Français."

 VIE_French_Self-Governance: "Demander une autonomie limitée"
 VIE_French_Self-Governance_desc: "Nous demanderons à la France une autonomie limitée, en exigeant plus d'autonomie dans les affaires intérieures tout en maintenant le contrôle français sur la politique étrangère et les questions militaires. Cela pourrait satisfaire certaines demandes vietnamiennes tout en préservant les intérêts français."

 VIE_French_Continue: "Continuer sous le protectorat français"
 VIE_French_Continue_desc: "Nous continuerons à être un protectorat français, acceptant notre rôle de dépendance coloniale. Il n'y aura aucune prétention d'indépendance - le Vietnam restera fermement sous contrôle français dans un avenir prévisible."


 # === Border Settlement (merged from VIE_Border_Settlement_l_english.yml) ===

 # --- Focuses ---
 VIE_Indochina_Border_Settlement: "La frontière instable"
 VIE_Indochina_Border_Settlement_desc: "La guerre est finie et le Vietnam est debout. Ce que le Vietnam n'a pas, c'est une frontière qu'il a acceptée. Chaque ligne allant à l'ouest de la chaîne annamite a été tracée dans un ministère parisien par des hommes qui n'ont jamais vu le pays, et la République les a héritées en grande partie d'une administration coloniale qui n'existe plus.\n\nLe ministère des Affaires étrangères a tranquillement rassemblé les dossiers : le saillant khmer de Svay Rieng qui s'avance comme un couteau dans le delta du Mékong, l'ancienne préfecture de Tran-Ninh que Hué gouvernait jusqu'à ce que le protectorat la remette à Vientiane, les marches du nord autour de Phongsaly où la décision de tout gouvernement est une question d'opinion. Aucune de ces questions n'a été posée à la table de conférence. Tous peuvent encore être ouverts."
 VIE_Consolidate_The_Frontier: "Consolider la frontière"
 VIE_Consolidate_The_Frontier_desc: "Quoi que nous ayons pris, nous le tenons désormais. L'administration provinciale doit être étendue aux nouveaux districts, les recensements effectués, les écoles ouvertes et les garnisons rendues permanentes. Dans une génération, les enfants seront vietnamiens, et la question de savoir où se situe la limite en 1893 n'intéressera que les historiens.\n\nLa question des frontières est close. Il ne reste plus qu'à le faire rester fermé."
 VIE_PM_Diem: "Premier ministre Ngo-Dinh-Diem"
 VIE_PM_Diem_desc: "Ngo-Dinh-Diem a accédé au poste de Premier ministre selon ses propres conditions, après l'avoir refusé pendant des années sans pleine autorité civile et militaire. Il arrive sans parti, sans armée et sans argent, et avec la conviction qu'il n'a besoin d'aucun d'eux tant qu'il est le seul homme avec qui les Américains auront affaire à Saigon."
 VIE_Diem_Cabinet_of_Eighteen: "Le Cabinet des Dix-huit"
 VIE_Diem_Cabinet_of_Eighteen_desc: "Un gouvernement de dix-huit ministres, issus du nord catholique, des milieux exilés et de la propre famille du premier ministre. Il manque d'expérience et de soutien populaire, mais chacun de ses membres doit sa place à Diem et à personne dans le palais."
 VIE_Diem_Break_General_Hinh: "Pause Général Hinh"
 VIE_Diem_Break_General_Hinh_desc: "Le général Nguyen-Van-Hinh, chef d'état-major de l'Armée nationale et citoyen français, déclare aux journaux que le Vietnam a besoin d'un leader fort et populaire et qu'il ne décrit pas le Premier ministre. Soit l'armée obéit au gouvernement, soit le gouvernement est une fiction."
 VIE_Diem_Purge_Francophile_Officers: "Purger les officiers francophiles"
 VIE_Diem_Purge_Francophile_Officers_desc: "Une fois Hinh parti à Paris, le corps d'officiers qu'il a construit peut être démonté. Les commissions achetées sous les Français seront revues, les passeports français mettront fin aux carrières et les promotions se feront par le biais du bureau du premier ministre. L'armée perd de l'expérience et gagne en loyauté."
 VIE_Diem_Passage_to_Freedom: "Passage vers la liberté"
 VIE_Diem_Passage_to_Freedom_desc: "Les accords donnent trois cents jours aux Vietnamiens pour choisir leur moitié du pays. Nous en avions prévu dix mille et ils arrivent par centaines de milliers, en majorité catholiques, majoritairement du nord, et entièrement dépendants d'un gouvernement qui n'a rien à leur donner."
 VIE_Diem_Settle_the_Refugees: "Installer les réfugiés"
 VIE_Diem_Settle_the_Refugees_desc: "De la nourriture, un abri, des outils et des terres dans le delta du Mékong, payés avec de l'argent que nous n'avons pas. Ce qu'il achète, c'est un million de personnes qui doivent leurs champs à ce gouvernement et qui ne voteront jamais pour les hommes qu'ils ont fuis."
 VIE_Diem_National_Bank: "La Banque Nationale du Vietnam"
 VIE_Diem_National_Bank_desc: "Un État qui ne peut pas imprimer sa propre monnaie n'est pas un État. La Banque Nationale émettra une monnaie vietnamienne et la piastre indochinoise quittera la circulation, et avec elle le dernier instrument par lequel Paris fixe notre budget."
 VIE_Diem_Court_the_Cao_Dai: "Courtiser le Cao-Dai"
 VIE_Diem_Court_the_Cao_Dai_desc: "La hiérarchie Cao-Dai à Tay-Ninh peut être achetée là où elle ne peut pas être battue. Titres, subventions et garanties tranquilles pour la foi, en échange de généraux qui intègrent leurs divisions dans l'Armée nationale et laissent derrière eux leur empire privé."
 VIE_Diem_Subdue_the_Hoa_Hao: "Soumettre les Hoa-Hao"
 VIE_Diem_Subdue_the_Hoa_Hao_desc: "Le Hoa-Hao ne sera pas acheté à un prix aussi bas. Leurs seigneurs de guerre considèrent le delta occidental comme leur propre pays et y perçoivent leurs propres impôts, et un seul des deux gouvernements de ce pays peut survivre."
 VIE_Diem_Confront_Binh_Xuyen: "Affronter les Binh-Xuyen"
 VIE_Diem_Confront_Binh_Xuyen_desc: "Les Binh-Xuyen détiennent la police nationale, le casino du Grand Monde, le trafic de l'opium et les abords de Cholon, et ils détiennent tout cela par licence impériale. Les priver de la police est le premier acte d'un gouvernement qui entend gouverner Saigon."
 VIE_Diem_Battle_of_Saigon: "La bataille de Saïgon"
 VIE_Diem_Battle_of_Saigon_desc: "Les hommes de Le-Van-Vien sont retranchés à travers Cholon avec des mortiers et la sympathie du commandement français. Gagner cela met fin au débat sur la question de savoir si le Premier ministre peut être destitué par n'importe qui à Saigon ; sa perte met fin au mandat de Premier ministre."
 VIE_Diem_National_Revolutionary_Committee: "Le Comité National Révolutionnaire"
 VIE_Diem_National_Revolutionary_Committee_desc: "Quelque dix-huit groupes, réunis au pied levé et parlant au nom de la révolution, réclament la destitution de Bao-Dai et les pleins pouvoirs pour le premier ministre. Ce n'est pas un parlement et personne ne l'a élu, mais c'est une voix civile appelant à un vote, et c'est précisément ce dont nous avons besoin."

# === Diem premiership additions ===
 VIE_Diem_Found_the_Can_Lao: "J'ai trouvé la fête Can-Lao"
 VIE_Diem_Found_the_Can_Lao_desc: "Sac-lenh 116/BNV/CT donne au Premier ministre quelque chose qu'il n'a jamais eu : une organisation qui lui est propre. Le Can-Lao Nhan-Vi Cach-Mang Dang sera dirigé par le frère du premier ministre, recruté dans des cellules qui ne se connaissent pas et n'ayant de comptes à rendre à personne au palais ou à l'armée."
 VIE_Diem_Decree_21: "Du-So 21"
 VIE_Diem_Decree_21_desc: "Le Domaine de la Couronne est un deuxième ordre juridique à l'intérieur de nos propres frontières, administré par différents fonctionnaires sous un souverain différent. Du-So 21 l'abolit et regroupe les hauts plateaux en Trung-Phan, l'autonomie des districts montagnards étant inscrite dans le texte plutôt que promise à côté. Paris n'a pas été consulté."
 VIE_Diem_Cut_the_Subsidies: "Couper les subventions aux sectes"
 VIE_Diem_Cut_the_Subsidies_desc: "Cinq millions de dôngs par mois, versés aux Cao-Dai, aux Hoa-Hao et aux Binh-Xuyen parce que la France le leur a promis et nous a ensuite remis la facture. L'arrêter sauve le trésor et coûte au trône les revenus du casino dont il vit. Cela donnera également aux trois sectes la seule chose qu'elles n'ont jamais eue, une raison de s'entendre les unes avec les autres."
 VIE_Diem_Ba_Long_Expedition: "La zone de guerre de Ba-Long"
 VIE_Diem_Ba_Long_Expedition_desc: "Les Dai-Viet tiennent une redoute dans les collines de Quang-Tri depuis que les Français les ont armés de leur propre garnison, de leurs propres impôts et de leurs propres tribunaux. Ha-Thuc-Ky l'appelle une zone de guerre contre les communistes. Il n'a pas tiré une seule fois sur les communistes."
 VIE_Diem_Hoang_Dieu_Campaign: "La campagne Hoang-Dieu"
 VIE_Diem_Hoang_Dieu_Campaign_desc: "Ce qui reste du Binh-Xuyen s'est échoué dans la mangrove du Rung-Sac, où la marée déplace les canaux deux fois par jour et personne qui n'est de là ne peut le suivre. Le colonel Duong-Van-Minh croit qu'il le peut, et Le-Van-Vien n'a nulle part où aller autre que le Cambodge."
 VIE_Diem_Abolish_the_Royal_Guard: "Abolir la Garde Royale"
 VIE_Diem_Abolish_the_Royal_Guard_desc: "Deux bataillons à Da-Lat qui dépendent personnellement du chef de l'État et d'aucun ministère. Le général Nguyen-Van-Vy les fit descendre à Saigon avec un mandat en poche et emmena avec eux la Poste. Ils seront démantelés et intégrés à l'Armée nationale, et le trône ne gardera aucun régiment propre."
 VIE_Diem_Reject_the_Geneva_Elections: "Refusez le vote pan-vietnamien"
 VIE_Diem_Reject_the_Geneva_Elections_desc: "Les accords promettent un scrutin dans tout le Vietnam, dans un nord où le scrutin est une formalité et dans un sud où il ne l'est pas. Nous dirons clairement ce que tout le monde sait déjà : nous ne serons pas liés par un accord signé pour nous, contre la volonté du peuple vietnamien, par un gouvernement aujourd'hui parti."
 VIE_Diem_Second_in_Command: "Attribuer le commandant en second"
 VIE_Diem_Second_in_Command_desc: "Le frère du Premier ministre n'occupe aucune fonction, ne siège dans aucun cabinet et ne signe rien, et tous les dossiers importants passent par son bureau au palais Gia-Long. Ngo-Dinh-Nhu deviendra conseiller en fait sinon en droit, et la distinction cessera assez rapidement d'avoir de l'importance."
 VIE_Diem_Refugee_Commissariat: "J'ai trouvé le Phu-Tong-Uy Di-Cu Ty-Nan"
 VIE_Diem_Refugee_Commissariat_desc: "Un Commissariat général aux réfugiés, répondant au Premier ministre et à personne d'autre, avec son propre budget, ses propres camions et ses propres hommes dans chaque province. Son objectif est de déplacer les habitants du Nord vers le sud. Ce sera aussi le seul bras de ce gouvernement qui atteint les campagnes."
 VIE_Diem_Reinvite_CuongDe_Comrades: "Réinvitez les camarades du prince"
 VIE_Diem_Reinvite_CuongDe_Comrades_desc: "Les hommes de Phuc-Quoc qui ont suivi Cuong-De en exil ont passé vingt ans à attendre un Vietnam qui les aurait. Ils sont nationalistes avant d'être monarchistes, ils sont les meilleurs organisateurs en dehors du Viet-Minh, et les introduire au gouvernement, c'est emporter avec eux l'ombre du prince."
 VIE_Diem_First_Cabinet: "Former le premier cabinet Diem"
 VIE_Diem_First_Cabinet_desc: "Quinze ministères sont vides depuis le débrayage de septembre. Ils seront issus des associations de réfugiés, de la hiérarchie catholique et des cercles d'exilés, et les hommes qui les prendront comprendront que le gouvernement auquel ils rejoignent est un homme et un téléphone."
 VIE_Diem_Form_the_NRM: "Former le Phong-Trao Cach-Mang Quoc-Gia"
 VIE_Diem_Form_the_NRM_desc: "Un mouvement révolutionnaire national : un front suffisamment large pour contenir des catholiques, des réfugiés, des syndicalistes et des transfuges du Dai-Viet, suffisamment discipliné pour organiser un rassemblement dans n'importe quelle capitale provinciale avec un préavis de trois jours, et suffisamment personnel pour que son nom et celui du premier ministre soient la même chose."
 VIE_Diem_Security_Directive: "Émettre le Chi-Thi de sécurité nationale"
 VIE_Diem_Security_Directive_desc: "Une directive sur les opérations de sécurité nationale : des dossiers sur chaque parti, un pouvoir permanent de détention et un appareil policier qui rend compte par l'intermédiaire du ministère de l'Intérieur plutôt que de l'état-major. C'est l'instrument dont dispose le gouvernement au lieu du consentement."
 VIE_Diem_Confront_the_Far_Right: "Affronter le Dai-Viet et le Viet-Quoc"
 VIE_Diem_Confront_the_Far_Right_desc: "Le Dai-Viet Quoc-Dan-Dang et le Viet-Nam Quoc-Dan-Dang complotaient contre les Français avant que ce gouvernement n'existe et considèrent l'arrangement actuel comme une interruption. Ils détiennent des zones de guerre à Ba-Long et Chau-Doc, ils ont des amis dans le corps des officiers et ils ont fini d'attendre."
 VIE_Diem_Fate_of_the_Crownlands: "Décidez du sort des terres de la Couronne"
 VIE_Diem_Fate_of_the_Crownlands_desc: "Le Domaine Royal des Hauts Plateaux du Sud est le domaine privé du Chef de l'État, administré par des résidents français pour un tribunal de Cannes, et aucune loi vietnamienne n'y court. Il peut être intégré à la république ou laissé en place selon de nouvelles conditions, et les montagnards ont leur opinion sur ces points."
 VIE_Diem_Decree_No_2_Land_Reform: "Passer le Du N°2 sur la Réforme agraire"
 VIE_Diem_Decree_No_2_Land_Reform_desc: "Les loyers dans le delta représentent la moitié de la récolte et les propriétaires qui les ont fixés ont passé la guerre à Saigon. L'ordonnance n°2 plafonne les loyers, garantit l'occupation et met le contrat par écrit. C'est modeste, c'est exécutoire, et c'est la première chose que ce gouvernement offre à un paysan que le Viet-Minh n'a pas offerte en premier."
 VIE_Diem_Accept_Multipartyism: "Accepter temporairement le multipartisme"
 VIE_Diem_Accept_Multipartyism_desc: "Donnez des sièges aux partis nationalistes, laissez-les imprimer ce qu'ils veulent et gagnez du temps pour construire notre propre parti. Cela coûte au Premier ministre son monopole du cabinet et au Dai-Viet ses griefs, et un seul de ces griefs est récupérable."
 VIE_Diem_Land_Redistribution: "Col Sac-Lenh n°7 et n°57"
 VIE_Diem_Land_Redistribution_desc: "Le gouvernement achètera les grands domaines et les revendra aux hommes qui les exploitent déjà, en lots suffisamment petits pour être cultivés et à des conditions suffisamment longues pour payer. Cela prendra des années, cela coûtera plus cher que ce que peut contenir le Trésor, et c'est le seul argument contre Hanoï qui ne nécessite pas une armée."
 VIE_Diem_Ally_Tran_Quoc_Buu: "Alliez-vous à Tran-Quoc-Buu"
 VIE_Diem_Ally_Tran_Quoc_Buu_desc: "Le Tong-Lien-Doan Lao-Cong est la seule organisation de masse du Sud qui n'est ni une secte ni un front, et Tran-Quoc-Buu l'a bâti sur le syndicalisme chrétien et un passage dans une prison française. Il négociera, étant entendu que les syndicats garderont leur propre nom."
 VIE_Diem_Tinh_Than_Group: "Donner du pouvoir au groupe Tinh-Than"
 VIE_Diem_Tinh_Than_Group_desc: "Un cercle d'intellectuels personnalistes autour de la revue Tinh-Than, arguant que la révolution est spirituelle avant d'être politique et que l'État existe pour guérir les hommes. Donnez-leur les ministères de l'Éducation et de l'Information et ils fourniront à ce gouvernement la seule chose qui lui manque, c'est-à-dire une doctrine."
 VIE_Diem_Retain_Montagnard_Autonomy: "Conserver la Région Autonome Montagnard"
 VIE_Diem_Retain_Montagnard_Autonomy_desc: "Le décret 21 peut mettre fin au privilège impérial dans les hauts plateaux sans céder les hauts plateaux à Saigon. Les Rhade, les Jarai et les Bahnar conservent leurs propres conseils, leurs propres tribunaux et leurs propres titres fonciers, et la république gagne une frontière gardée par des gens qui veulent la garder."
 VIE_Diem_Legalize_the_Nationalists: "Légaliser le Viet-Quoc et le Dai-Viet"
 VIE_Diem_Legalize_the_Nationalists_desc: "L'inscription, les prémisses légales, un journal chacun et le droit de se présenter à une élection qu'ils ne peuvent pas gagner. Il met fin à la conspiration en en éliminant la raison et place deux partis organisés dans une vie politique qui jusqu'à présent se composait du premier ministre."
 VIE_Diem_Purge_the_Nationalists: "Purger les dirigeants nationalistes"
 VIE_Diem_Purge_the_Nationalists_desc: "Les zones de guerre ont disparu et les hommes qui les dirigeaient sont à Saigon, donnant des interviews. Ha-Thuc-Ky et le comité central du Dai-Viet seront arrêtés, les cellules Viet-Quoc se joindront à eux, et la droite nationaliste ne troublera pas un autre gouvernement avant une décennie."
 VIE_Diem_Modernize_Ong_Lem: "Moderniser la citadelle d'Ong-Lem"
 VIE_Diem_Modernize_Ong_Lem_desc: "L'ancienne caserne Ong-Lem de Saigon, reconstruite en Citadelle de la République : un arsenal, un centre de transmissions et des quartiers pour une garde qui répond au palais. L'état-major ne détiendra pas les clés, c'est tout l'intérêt de l'exercice."
 VIE_Diem_Second_Cabinet: "Former le deuxième cabinet Diem"
 VIE_Diem_Second_Cabinet_desc: "Un an plus tard, une fois les sectes brisées et les ordonnances agraires signées, le gouvernement peut être reconstruit à partir des hommes qui l'ont rejoint parce qu'il était vainqueur. Il s'agit d'un cabinet plus large, plus compétent, et aucun ministre n'y occupe son siège grâce à la faveur du trône."
 VIE_Diem_Promote_the_Defectors: "Promouvoir Kieu-Cong-Cung et les transfuges"
 VIE_Diem_Promote_the_Defectors_desc: "Kieu-Cong-Cung combattit les Français pour le Viet-Minh et abandonna la réforme agraire. Des hommes comme lui savent comment on forme un cadre et comment s'organise un village, et ils le savent par la seule école qui ait jamais enseigné cela dans ce pays. Leur donner des commissions offensera tout le monde et fonctionnera de toute façon."
 VIE_Diem_Court_the_Francophiles: "Gagner les élites francophiles"
 VIE_Diem_Court_the_Francophiles_desc: "Les avocats, les planteurs et les fonctionnaires qui dirigeaient la Cochinchine pour Paris sont toujours là, toujours riches et toujours convaincus que ce gouvernement n'est qu'un embarras momentané. Leur argent et leur administration valent la peine, et le prix à payer est une querelle plus lente avec la France."
 VIE_Diem_Mend_Minority_Relations: "Réparer les relations avec les minorités"
 VIE_Diem_Mend_Minority_Relations_desc: "Les écoles de Rhade et Jarai, un cadre montagnard dans l'administration provinciale, et Da-Lat ont été reconstruites pour devenir la capitale des hautes terres plutôt que une station de montagne pour la cour. Les montagnes décident qui détient la frontière, et on ne leur a jamais demandé une seule fois."
 VIE_Diem_Nhan_Vi_the_Press: "Nhan-Vi la presse"
 VIE_Diem_Nhan_Vi_the_Press_desc: "Les quotidiens français et les revues d'élite seront rattachés au ministère de l'Information, et le mouvement aura son propre journal dans chaque capitale de province. Ce n'est pas pour autant que l'opposition sera réduite au silence. C'est qu'à partir de maintenant, ils seront plus nombreux sous forme imprimée."
 VIE_Diem_Seize_the_Royal_Estate: "Nationaliser le domaine royal"
 VIE_Diem_Seize_the_Royal_Estate_desc: "La citadelle de Hué, les forêts impériales, les villas de Da-Lat et les comptes de Paris sont la propriété de l'État vietnamien et ont été administrés comme la propriété d'un seul homme. Le chef de l'État sera informé du transfert par télégramme et il ne pourra rien y faire."
 VIE_Diem_Civil_Action_Commissariat: "J'ai trouvé le Dac-Phu Cong-Dan-Vu"
 VIE_Diem_Civil_Action_Commissariat_desc: "Un Commissariat spécial à l'action civile : des cadres en pyjama noir qui vivent dans le village où ils sont affectés, creusent ses puits, enseignent son école et rendent compte de sa politique. C'est la méthode Viet-Minh inversée, et c'est la seule méthode qui a fait ses preuves ici."
 VIE_Diem_Appoint_Ngo_Dinh_Can: "Nommer Ngo-Dinh-Can à Trung-Phan"
 VIE_Diem_Appoint_Ngo_Dinh_Can_desc: "Le plus jeune frère n'a aucun grade et ne quitte jamais Hue, et le centre du Vietnam fait ce qu'il dit. Le faire conseiller de Trung-Phan ne change rien sur le terrain et règle la question de savoir qui répond au nom du centre, ce qui n'est pas la même chose que la question de savoir qui le gouverne."
 VIE_Diem_Promote_Loyalist_Officers: "Promouvoir les officiers révolutionnaires"
 VIE_Diem_Promote_Loyalist_Officers_desc: "Une promotion par loyauté plutôt que par l'ancienneté, des officiers politiques dans chaque régiment et un état-major composé d'hommes qui doivent leurs étoiles au palais. L'armée devient plus jeune et moins expérimentée, et cela n'arrive plus aux gouvernements."
 VIE_Diem_Accept_Pham_Van_Dong: "Acceptez la lettre de Pham-Van-Dong"
 VIE_Diem_Accept_Pham_Van_Dong_desc: "Hanoï propose des consultations sur le mécanisme du scrutin pan-vietnamien, de manière courtoise et écrite. Répondre à la lettre admet que le scrutin va avoir lieu, et l'arithmétique d'un scrutin dans les deux zones n'a jamais eu qu'une seule réponse. Washington sera extrêmement mécontent."
 VIE_Diem_Dismantle_the_United_Front: "Démonter le Mat-Tran Thong-Nhut Toan-Luc"
 VIE_Diem_Dismantle_the_United_Front_desc: "Le Front National Unifié a tenu bon tant qu'il y avait de l'argent français et un casino derrière lui. Il n'y a ni l'un ni l'autre maintenant, et son congrès peut être dissous, ses milices restantes mises à la retraite et ses dirigeants peuvent avoir quelque chose à perdre. Les sectes survivront. L'alliance ne le fera pas."
 VIE_Diem_Found_the_ARVN: "Fonder l'Armée de la République"
 VIE_Diem_Found_the_ARVN_desc: "L'Armée nationale du Vietnam devient l'Armée de la République du Vietnam, avec de nouvelles couleurs, un nouveau serment et le général de division Le-Van-Ty confirmé comme chef d'état-major. Ce sont les mêmes hommes dans les mêmes casernes, jurant à un État plutôt qu'à un trône."
 VIE_Diem_Deploy_the_Cadres: "Déployer les Cadres d'Action Civile"
 VIE_Diem_Deploy_the_Cadres_desc: "Des équipes de trois hommes dans les villages du delta, sans armes, restent. On leur tirera dessus, certains d'entre eux seront tués, et là où ils durent un an, le district cessera d'envoyer des recrues vers le nord. C'est lent, c'est bon marché et il n'existe pas de méthode plus rapide à notre disposition."
 VIE_Diem_Integrate_Minority_Forces: "Intégrer les forces des Highlands"
 VIE_Diem_Integrate_Minority_Forces_desc: "Les compagnies Rhade, les bataillons Nung et les milices Muong ont été payés par ceux qui avaient besoin d'une frontière tenue. Ils seront mis dans un même ordre de bataille, avec leurs propres officiers et leur propre terrain, et la république leur en sera redevable."
 VIE_Diem_Host_the_Referendum: "Organisez le référendum de 1955"
 VIE_Diem_Host_the_Referendum_desc: "Monarchie ou république, un bureau de vote pour mille électeurs, tous les plus de dix-huit ans. Le chef de l'État est à Cannes et ne fera pas campagne ; le premier ministre contrôle les bulletins de vote, le décompte et les journaux qui en parlent. Le résultat ne fait aucun doute et ce sera néanmoins la première fois que quelqu'un au Vietnam sera interrogé."
 VIE_Diem_Proclaim_the_Republic: "Proclamer la République du Vietnam"
 VIE_Diem_Proclaim_the_Republic_desc: "L'État du Vietnam est dissous, la dynastie des Nguyen touche à sa fin et une Assemblée constituante rédigera la constitution d'une république dont le premier président est déjà au palais. Quoi qu'il en soit, c'est le nôtre, et aucun ministre des Affaires étrangères ne l'a signé."

 # === 1960s focuses filed under the VIA_ prefix ===
 VIA_Catholic_Officiers: "Officiers catholiques"
 VIA_Catholic_Officiers_desc: "Après la répression religieuse, le corps des officiers est récompensé par l'expérience militaire et le gouvernement par le pouvoir politique."
 VIA_Civil_Unrest: "Troubles civils"
 VIA_Civil_Unrest_desc: "La répression produit des troubles. La stabilité diminue et le gouvernement profite de la crise pour acquérir le pouvoir politique."
 VIA_Hue_Phat_Dan: "La fusillade de Hue Phat-Dan"
 VIA_Hue_Phat_Dan_desc: "Les troupes tirent sur la fête bouddhiste de Hué. La stabilité et le soutien à la guerre chutent. Le gouvernement retire le pouvoir politique de l'urgence."
 VIA_Enact_Pro_Catholic_Policies: "Adopter des politiques pro-catholiques"
 VIA_Enact_Pro_Catholic_Policies_desc: "La politique pro-catholique est inscrite dans l'État. Une vague de nationalisme s'ensuit pendant un certain temps."
 VIA_Rural_Pacification: "Pacification rurale"
 VIA_Rural_Pacification_desc: "La campagne est déclarée pacifiée. La stabilité et le soutien à la guerre augmentent fortement."
 VIA_Reapproach_the_French: "Réapprocher les Français"
 VIA_Reapproach_the_French_desc: "Paris est à nouveau courtisé. L'opinion s'améliore dans les deux sens. Cela ferme les routes américaines et nationalistes chinoises."
 VIA_Rural_Anti_Communism: "Anticommunisme rural"
 VIA_Rural_Anti_Communism_desc: "Les campagnes sont mobilisées contre les communistes."
 VIE_DanXa_Revolution_modifier: "Révolution Dan-Xa"
 VIE_DanXa_Revolution_modifier_desc: "La révolution sociale du Nam-Viet Dan-Xa Dang est en marche. Ses effets politiques, économiques et sociaux augmentent à chaque étape du programme."
