 VIE_CD_Limited_Industrial_Expansion_desc: "Une expansion prudente est la clé d'une croissance régulière, et dans un pays qui dépend de flux de trésorerie peu stables, nous devons limiter la vitesse de notre croissance. Cela signifiera une main ferme à la barre et de nouvelles opportunités à venir, comme elles le sont naturellement."

