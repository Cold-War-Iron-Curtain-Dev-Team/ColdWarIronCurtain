 INFLUENCE_TOOLTIP_DELAYED:0 "L'influence mesure l'influence et la domination d'une personne sur une nation. L'influence peut être élargie en investissant dans des bâtiments, en offrant des cadeaux, en apportant une aide militaire et en utilisant le pouvoir politique. D'autres pays se disputeront l'influence et le pays hôte tentera d'affirmer sa souveraineté s'il le peut.\n\n Si votre influence est suffisamment élevée, vous pouvez forcer le pays à signer des accords commerciaux favorables ou même en faire un État soumis. En plus de faire progressivement dériver votre vision du monde, l'influence peut être utilisée comme une monnaie pour manipuler leur politique en votre faveur."
