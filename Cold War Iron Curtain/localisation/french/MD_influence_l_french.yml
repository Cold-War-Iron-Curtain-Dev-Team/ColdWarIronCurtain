 OPT_INFLUENCE_ECONOMIC_AID_TITLE:0 "Aide économique"
 OPT_INFLUENCE_ECONOMIC_AID_ACTION_DESC:0 "Envoyez §YAide étrangère inconditionnelle§! à ce pays. Cela leur donnera une réduction des biens de consommation de §G2 %§!, une vitesse de construction de §G5 %§! et un plafond d'efficacité de production de §G5 %.§!"

 OPT_INFLUENCE_MUTUAL_DEFENSE_AGREEMENT_TITLE:0 "Accord de défense mutuelle"
 OPT_INFLUENCE_MUTUAL_DEFENSE_AGREEMENT_ACTION_DESC:0 "Signez un traité de défense mutuelle §Y§! avec ce pays. Créera une garantie mutuelle §G§! avec la cible et donnera à chacun de nous §Gmilitaire§! et §Gun accès naval§! les uns aux autres.\n Cela nous coûtera £pol_power£§Y200 de puissance politique§! et §Y5 de projection de puissance étrangère§! et nous donnera également §Y25 d'influence§! sur la cible."
 OPT_INFLUENCE_BREAK_MUTUAL_DEFENSE_AGREEMENT_TITLE:0 "Rompre l'accord de défense mutuelle"
 OPT_INFLUENCE_BREAK_MUTUAL_DEFENSE_AGREEMENT_ACTION_DESC:0 "Rompre le Traité de Défense Mutuelle §Y§! avec ce pays. Romprera les §GGaranties§! et annulera les §GMilitaires§! et §GL'accès naval§! à nos pays."

