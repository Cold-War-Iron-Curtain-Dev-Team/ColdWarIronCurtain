 OPT_INFLUENCE_ECONOMIC_EXPLOITION_TITLE:0 "Exploitation économique"
 OPT_INFLUENCE_ECONOMIC_EXPLOITION_ACTION_DESC:0 "Établir un bureau de mandat §Y§! dans ce pays pour exploiter son système économique et siphonner les revenus. Vous donnera 20 % de leurs parcs industriels et complexes militaro-industriels, et rendra le commerce 25 % plus efficace pour vous."
