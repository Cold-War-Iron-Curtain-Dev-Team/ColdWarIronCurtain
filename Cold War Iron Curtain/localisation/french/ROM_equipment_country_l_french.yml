 ## Interceptor

 ROM_heavy_fighter_equipment_1: "Yakovlev Yak-9"
 ROM_heavy_fighter_equipment_1_short: "Yak-9"
 ROM_heavy_fighter_equipment_1_desc: "Le Yak-9 avait un fuselage arrière réduit avec une verrière de vision panoramique. Sa structure métallique plus légère permettait une charge de carburant et un armement accrus par rapport aux modèles précédents construits en bois. Le Yak-9 était maniable à grande vitesse à basse et moyenne altitude et facile à contrôler, ce qui en faisait l'un des chasseurs soviétiques les plus produits de la Seconde Guerre mondiale."
 ROM_heavy_fighter_equipment_2: "Petliakov Pe-3"
 ROM_heavy_fighter_equipment_2_short: "Pe-3"
 ROM_heavy_fighter_equipment_2_desc: "Développement ultérieur du Pe-2, le Pe-3 était un avion de combat de nuit dédié lors de son introduction en 1941, la même année que son homologue, le Pe-2. Sa conception et son utilisation ont suivi un chemin comparable à ceux empruntés par la Luftwaffe allemande avec le Junkers Ju 88 et la Royal Air Force britannique avec le De Havilland Mosquito. Utilisé avec distinction pendant la bataille de Moscou, et bien que la seule usine responsable de la construction de ce type ait été évacuée à la suite de la bataille, le Pe-3 a été utilisé tout au long du conflit, les séries de production ultérieures étant consacrées à la construction de variantes de reconnaissance de ce type."
 ROM_heavy_fighter_equipment_3: "Lavotchkine La-11"
 ROM_heavy_fighter_equipment_3_short: "La-11"
 ROM_heavy_fighter_equipment_3_desc: "Développé en 1947, après la fin de la Seconde Guerre mondiale, le La-11 était une évolution du La-9 « Fritz » pour créer un chasseur d'escorte à longue portée. L'avion était équipé de pneus plus gros pour s'adapter à l'augmentation du poids et aux commodités pour les longs vols, comme un rembourrage accru du siège, des accoudoirs et un urinoir. De plus, une suite complète de radionavigation a été installée. Sans surprise, les performances de combat avec une pleine charge de carburant en ont souffert. Cependant, à mesure que la charge de carburant se rapprochait de celle du La-9, les performances augmentaient également. Les pilotes de La-11 en service soviétique et plus tard chinois serviraient dans la défense aérienne, abattant des Mustangs et des avions d'attaque de construction américaine pendant la guerre de Corée. Son nom de rapport à l'OTAN est Fang."

 ROM_jet_interceptor_equipment_3: "Mikoyan-Gourevitch MiG-17PF"
 ROM_jet_interceptor_equipment_3_desc: "Version chasseur-intercepteur tout temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F"
 ROM_jet_interceptor_equipment_3_short: "MiG-17PF"
  
