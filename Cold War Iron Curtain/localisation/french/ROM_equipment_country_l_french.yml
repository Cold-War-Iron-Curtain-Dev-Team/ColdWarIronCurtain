 ## Fighter 

 ROM_fighter_equipment_0: "Comandamentul Aviatiei Romane"
 ROM_fighter_equipment_0_short: "VOITURE"
 ROM_fighter_equipment_0_desc: "Le 15 février 1949, le commandement de l'aviation roumaine a été créé sur le modèle soviétique des régiments d'aviation au lieu du modèle d'escadron britannique. Celle-ci sera plus tard rebaptisée Force aérienne roumaine."

 ROM_fighter_equipment_1: "RAI 14"
 ROM_fighter_equipment_1_short: "RAI 14"
 ROM_fighter_equipment_2: "RAI 80"
 ROM_fighter_equipment_2_short: "RAI 80"
 ROM_fighter_equipment_3: "109 G"
 ROM_fighter_equipment_3_short: "109 G"
 
 ROM_jet_multirole_equipment_1: "Yakovlev Yak-23"
 ROM_jet_multirole_equipment_1_short: "Yak-23"
 ROM_jet_multirole_equipment_2: "Mikoyan-Gourevitch MiG-15"
 ROM_jet_multirole_equipment_2_desc: "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 ROM_jet_multirole_equipment_2_short: "MiG-15"
 ROM_jet_multirole_equipment_3: "Mikoyan-Gourevitch MiG-17"
 ROM_jet_multirole_equipment_3_desc: "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
 ROM_jet_multirole_equipment_3_short: "MiG-17"
 ROM_jet_multirole_equipment_4: "Mikoyan-Gourevitch MiG-19"
 ROM_jet_multirole_equipment_4_desc: "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 ROM_jet_multirole_equipment_4_short: "MiG-19"
 ROM_jet_multirole_equipment_5: "Mikoyan-Gourevitch MiG-21F-13"
 ROM_jet_multirole_equipment_5_desc: "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 ROM_jet_multirole_equipment_5_short: "MiG-21F-13"
 ROM_jet_multirole_equipment_6: "Mikoyan-Gourevitch MiG-21PF"
 ROM_jet_multirole_equipment_6_desc: "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 ROM_jet_multirole_equipment_6_short: "MiG-21PF"
 ROM_jet_multirole_equipment_7: "Mikoyan-Gourevitch MiG-23M"
 ROM_jet_multirole_equipment_7_desc: "le MiG-23 a été le premier chasseur soviétique à disposer d'un radar de surveillance et d'abattage et l'un des premiers à être armé de missiles au-delà de la portée visuelle. La production a commencé en 1969 et a atteint un grand nombre avec plus de 5 000 avions construits, ce qui en fait l'avion à voilure variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service limité auprès de certains clients exportateurs."
 ROM_jet_multirole_equipment_7_short: "MiG-23M"
 ROM_jet_multirole_equipment_8: "Mikoyan-Gourevitch MiG-23ML"
 ROM_jet_multirole_equipment_8_desc: "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment la solidité et la fiabilité de la cellule, les performances du moteur, la maniabilité et les performances du radar. Une refonte considérable de la cellule a été réalisée, aboutissant au MiG-23ML."
 ROM_jet_multirole_equipment_8_short: "MiG-23ML"
 ROM_jet_multirole_equipment_9: "Mikoyan-Gourevitch MiG-23MLD"
 ROM_jet_multirole_equipment_9_desc: "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de la mise à niveau était d'améliorer la maniabilité, en particulier lors d'une AoA élevée, ce qui a été identifié comme le principal défaut du MiG-23M/ML. Le boom de Pitot était équipé de générateurs de vortex, et les racines entaillées du bord d'attaque de l'aile étaient en « dents de scie » pour agir également comme générateurs de vortex. Le système de commande de vol incorporait le dispositif d'arrêt de manche synthétique/limiteur de signaux SOS-3-4."
 ROM_jet_multirole_equipment_9_short: "MiG-23MLD"
 ROM_jet_multirole_equipment_10: "Mikoyan-Gourevitch MiG-29A"
 ROM_jet_multirole_equipment_10_desc: "Le MiG-29 Fulcrum A a été initialement développé par le Mikoyan Design Bureau. C'était le premier chasseur de 4e génération à entrer en service en URSS et dans le bloc de l'Est. Intégrant une avionique améliorée et des capacités radar considérablement améliorées. Les premiers MiG-29 ont été utilisés comme entraîneurs par le Pacte de Varsovie avec des exportations limitées vers l'Inde mais avaient une utilisation limitée au combat. Le MiG-29 deviendra plus tard la base de variantes largement produites telles que le MiG-29S, le MiG-29M et le MiG-35."
 ROM_jet_multirole_equipment_10_short: "MiG-29A"

 ROM_mr_stealth_fighter_equipment_1: "Tireur d'élite Mikoyan-Gurevich MiG-29A"
 ROM_mr_stealth_fighter_equipment_1_short: "Tireur d'élite MiG-29A"
 ROM_mr_stealth_fighter_equipment_1_desc: "La flotte roumaine de MiG-29 devait être modernisée dans le cadre d'un projet nommé \"Sniper\" réalisé par DASA, Aerostar et Elbit. Le premier vol a eu lieu le 5 mai 2000 et le prototype a été présenté à l'ILA 2000."

