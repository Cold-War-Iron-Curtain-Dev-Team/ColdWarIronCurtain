 ROM_jet_recon_equipment_0: "Aéro L-60 Brigadyr"
 ROM_jet_recon_equipment_0_short: "L-60 Brigadyr"
 ROM_jet_recon_equipment_0_desc: "L'Aero L-60 Brigadur était un petit avion utilitaire tchécoslovaque STOL à ailes hautes et à hélice développé pour un usage civil et militaire. Un prototype, désigné XL-60, équipé d'un moteur Argus As 10C, effectua son premier vol le 24 décembre 1953, mais sans succès. L'avion fut entièrement repensé et le deuxième prototype amélioré, équipé d'un moteur six cylindres à plat M-208B, vola le 8 juin 1954."
