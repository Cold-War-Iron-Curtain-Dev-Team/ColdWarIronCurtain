 ROM_CAS_equipment_1_short: "RAI 37"
 ROM_CAS_equipment_2: "Iliouchine Il-2"
 ROM_CAS_equipment_2_short: "Il-2"
 ROM_CAS_equipment_2_desc: "En 1945, l'armée de l'air bulgare reçut 120 avions d'attaque Il-2 et 10 avions d'entraînement Il-2U. L'avion a été utilisé jusqu'en 1954."
 ROM_CAS_equipment_3: "Iliouchine Il-10"
 ROM_CAS_equipment_3_short: "Il-10"
 ROM_CAS_equipment_3_desc: "En 1947, les premiers avions d'attaque Ilyushin sont arrivés, les Il-10 et Il-10M. Au cours de la période 1953-54, la Bulgarie a fourni des exemplaires de l'Il-10-Avia B-33 produits en Tchécoslovaquie sous licence soviétique, armés de quatre canons d'avion NS-23RM (150 coups par baril)."

