 ### Infantry Equipment 

 ROM_infantry_equipment_0: "Mosin wz.91"
 ROM_infantry_equipment_0_short: "Mosin wz.91"
 ROM_infantry_equipment_0_desc: "Le fusil à 3 lignes M1891, familièrement connu en Occident sous le nom de Mosin-Nagant et en Russie et dans l'ex-Union soviétique sous le nom de fusil de Mosin, est un fusil militaire à cinq coups, à verrou, alimenté par un chargeur interne. On le trouve principalement chambré pour sa cartouche d'origine 7,62 × 54 mmR."

 ROM_infantry_equipment_1: "Avtomat Kalachnikova 1947"
 ROM_infantry_equipment_1_short: "AK-47"
 ROM_infantry_equipment_1_desc: "L'AK47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK47 constituait une vaste mise à niveau du SKS. L'AK47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde."

 ROM_infantry_equipment_2: "Pistolet ROMARM Mitraliera modèle 1963/1965"
 ROM_infantry_equipment_2_short: "PM md.63/65"
 ROM_infantry_equipment_2_desc: "Le Pistol Mitraliera modèle 1963/1965 (en abrégé PM md. 63 ou simplement md. 63) est un fusil d'assaut roumain de 7,62x39 mm. Développé à la fin des années 1950, le PM md. 63 était un dérivé de l'AKM soviétique produit sous licence."

 ROM_infantry_equipment_3: "ROMARM Pusca Automates modèle 1986"
 ROM_infantry_equipment_3_short: "PA md.86"
 ROM_infantry_equipment_3_desc: "Le Pusca Automata modèle 1986 (Automatic Rifle Model 1986, en abrégé PA md. 86 ou simplement md. 86) est le fusil d'assaut standard utilisé par les forces militaires roumaines et fabriqué à Cugir, en Roumanie, par la société ROMARM, située à Bucarest. Le nom d'exportation de cette variante est AIMS-74." 

 ROM_infantry_equipment_4: "Cugir NAT1"
 ROM_infantry_equipment_4_short: "NAT1"
 ROM_infantry_equipment_4_desc: "Le NAT 1 a été conçu vers 2012 et dévoilé publiquement pour la première fois en 2017 lors d'un symposium à Alba Iulia en 2017, dévoilé par Nicolae Mihailesc, directeur de Cugir. L'arme est destinée à être mise en service pour remplacer le bon mais vieillissant PM md. Fusils d'assaut 63/65 dans l'armée roumaine."
 
