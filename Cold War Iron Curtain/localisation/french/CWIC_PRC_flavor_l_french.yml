 flavorprc.1.t:0 "[GetNewspaperHeader]La bande des quatre arrêtée"
 flavorprc.1.d:0 "Jiang Qing et les trois autres membres de la Bande des Quatre ont été arrêtés à Pékin. La lutte pour savoir qui suivra Mao est devenue une affaire de police."
 flavorprc.1.a:0 "Les quatre sont en garde à vue."
 flavorprc.1.b:0 "Pékin a procédé à des arrestations."
 flavorprc.2.t:0 "[GetNewspaperHeader]Le Troisième Plénum"
 flavorprc.2.d:0 "Le troisième plénum du comité central est terminé. La lutte des classes n'est plus à l'ordre du jour. Il s'agit désormais de moderniser l'économie."
 flavorprc.2.a:0 "Le plénum s'est retourné."
 flavorprc.2.b:0 "La Chine change de cap."
 flavorprc.3.t:0 "[GetNewspaperHeader]La place est dégagée"
 flavorprc.3.d:0 "L'armée a dégagé la place Tiananmen. Les manifestations qui ont rempli Pékin ce printemps sont terminées."
 flavorprc.3.a:0 "Le carré est clair."
 flavorprc.3.b:0 "Pékin a bougé."
 flavorprc.4.t:0 "[GetNewspaperHeader]Deng Xiaoping est décédé"
 flavorprc.4.d:0 "Deng Xiaoping est décédé à Pékin à l'âge de quatre-vingt-douze ans. Il a quitté son dernier poste il y a des années. Les réformes portent toujours son nom."
 flavorprc.4.a:0 "Deng est mort."
 flavorprc.4.b:0 "Deng Xiaoping est décédé."
