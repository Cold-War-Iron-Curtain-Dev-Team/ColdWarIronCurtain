 BRA_medium_tank_destroyer_equipment_4: "Engesa EE-17 Sucuri I"
 BRA_medium_tank_destroyer_equipment_4_short: "EE-17 Sucuri I"
 BRA_medium_tank_destroyer_equipment_4_desc: "Le chasseur de chars EE-17 Sucuri (parfois appelé Sucuri I) a été développé au Brésil par l'ENGESA. Ce véhicule blindé à roues possédait une tourelle complète du char léger français AMX-13. Il contenait un canon de 105 mm et était équipé d'un chargeur automatique."
 BRA_medium_tank_destroyer_equipment_5: "Engesa EE-18 Sucuri"
 BRA_medium_tank_destroyer_equipment_5_short: "EE-18 Sucuri"
 BRA_medium_tank_destroyer_equipment_5_desc: "le EE-18 a été conçu pour engager des chars, divers véhicules blindés, des bâtiments et des fortifications de campagne. Même si son canon de 105 mm ne serait pas particulièrement efficace contre les derniers chars de combat principaux contemporains, il pourrait facilement détruire des chars plus anciens. L'EE-18 pourrait rapidement s'auto-déployer sur de longues distances."

