 BRA_jet_CAS_equipment_7: "AMX International AMX A-1A"
 BRA_jet_CAS_equipment_7_short: "A-1A"
 BRA_jet_CAS_equipment_7_desc: "L'AMX International AMX est un avion d'attaque au sol développé conjointement par le Brésil et l'Italie. L'AMX est désigné A-11 Ghibli par l'armée de l'air italienne et A-1 par l'armée de l'air brésilienne. Le nom italien « Ghibli » vient du vent chaud et sec du désert libyen."
 BRA_jet_CAS_equipment_8: "Embraer AMX A-1M"
 BRA_jet_CAS_equipment_8_short: "A-1M"
 BRA_jet_CAS_equipment_8_desc: "L'AMX International AMX est un avion d'attaque au sol développé conjointement par le Brésil et l'Italie. L'AMX est désigné A-11 Ghibli par l'armée de l'air italienne et A-1 par l'armée de l'air brésilienne. Le nom italien « Ghibli » vient du vent chaud et sec du désert libyen."

 BRA_jet_light_equipment_1: "Étoile filante Lockheed T-33"
 BRA_jet_light_equipment_1_short: "Étoile filante T-33"
 BRA_jet_light_equipment_1_desc: "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 BRA_jet_light_equipment_2: "Fouga CM.170R Magister"
 BRA_jet_light_equipment_2_short: "CM.170R Maître"
 BRA_jet_light_equipment_2_desc: "Le Fouga CM.170 Magister est un avion d'entraînement à réaction biplace français des années 1950, développé et fabriqué par l'avionneur français Fouga. En raison des fusions industrielles, l'avion a été connu sous les noms de Fouga CM.170 Magister, Potez (Fouga) CM.170 Magister, Sud Aviation (Fouga) CM.170 Magister et Aérospatiale (Fouga) CM.170 Magister, selon l'endroit et le moment où ils ont été construits."
 BRA_jet_light_equipment_3: "Embraer AT-26 Xavante"
 BRA_jet_light_equipment_3_short: "AT-26 Xavante"
 BRA_jet_light_equipment_3_desc: "L'Aermacchi ou Macchi MB-326 est un avion d'entraînement militaire léger conçu en Italie. Conçu à l'origine comme un entraîneur biplace, des versions d'attaque légère monoplace et biplace ont également été produites. Il s'agit de l'un des avions de ce type les plus réussis commercialement, acheté par plus de 10 pays et produit sous licence en Australie, au Brésil et en Afrique du Sud."
 BRA_jet_light_equipment_4: "Embraer EMB 312 Tucano"
 BRA_jet_light_equipment_4_short: "AT-27 Tucano"
 BRA_jet_light_equipment_4_desc: "L'Embraer EMB 312 Tucano est un avion d'entraînement de base mono-turbopropulseur à ailes basses, à siège tandem et doté de capacités de contre-insurrection développées au Brésil. L'armée de l'air brésilienne a parrainé le projet EMB-312 à la fin de 1978. Les travaux de conception et de développement ont commencé en 1979 sur un nouvel avion d'entraînement de base peu coûteux et relativement simple, doté de fonctionnalités innovantes, qui est finalement devenu la norme internationale pour les avions d'entraînement de base."
 BRA_jet_light_equipment_5: "Embraer EMB 314 Super Tucano"
 BRA_jet_light_equipment_5_short: "A-29 Super Tucano"
 BRA_jet_light_equipment_5_desc: "L'Embraer EMB 314 Super Tucano, également nommé ALX ou A-29, est un avion d'attaque léger à turbopropulseurs brésilien conçu et construit par Embraer dans le cadre d'un développement de l'Embraer EMB 312 Tucano. L'A-29 Super Tucano transporte une grande variété d'armes, y compris des munitions à guidage de précision, et a été conçu pour être un système peu coûteux utilisé dans des environnements à faible menace."

 BRA_recon_equipment_0: "Piper J-3 Cub"
 BRA_recon_equipment_0_short: "J-3 Ourson"
 BRA_recon_equipment_0_desc: "Le Piper J-3 Cub est un avion léger américain construit entre 1938 et 1947 par Piper Aircraft. L'avion a une conception simple et légère qui lui confère de bonnes propriétés de maniabilité à basse vitesse et des performances sur terrain court. Le Cub est le modèle le plus produit de Piper Aircraft, avec près de 20 000 exemplaires construits aux États-Unis. Sa simplicité, son prix abordable et sa popularité évoquent des comparaisons avec l'automobile Ford Model T."
 BRA_jet_recon_equipment_0: "Cessna O-1 Chien d'oiseau"
 BRA_jet_recon_equipment_0_short: "O-1 Chien Oiseau"
 BRA_jet_recon_equipment_0_desc: "Le Cessna L-19/O-1 Bird Dog est un avion de liaison et d'observation. Il s'agissait du premier avion à voilure fixe entièrement métallique commandé pour et par l'armée américaine après la séparation de l'armée de l'air en 1947. Le Bird Dog a eu une longue carrière dans l'armée américaine, ainsi que dans d'autres pays. "
 BRA_jet_recon_equipment_1: "Embraer RT-26 Xavante"
 BRA_jet_recon_equipment_1_short: "RT-26 Xavante"
 BRA_jet_recon_equipment_1_desc: "Variante de reconnaissance de l'AT-26 Xavante de l'armée de l'air brésilienne, produite par Embraer. Armés de caméras plutôt que d'armes à feu et de missiles."
 BRA_jet_recon_equipment_2: "Embraer AMX A-1R"
 BRA_jet_recon_equipment_2_short: "A-1R"
 BRA_jet_recon_equipment_2_desc: "Une variante AMX conçue pour les missions de reconnaissance. Diverses palettes de reconnaissance peuvent être installées ; utilisé par l'armée de l'air brésilienne."

