 ########## BRA Infantry equipment

 BRA_infantry_equipment_0: "Fusil américain, calibre.30, M1"
 BRA_infantry_equipment_0_short: "M1 Garand"
 BRA_infantry_equipment_0_desc: "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."

 BRA_infantry_equipment_1: "Fabrique Nationale Fusil Automatique Léger"
 BRA_infantry_equipment_1_short: "FN FAL"
 BRA_infantry_equipment_1_desc: "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 BRA_infantry_equipment_2: "IMBEL Fusil Automatique Léger "
 BRA_infantry_equipment_2_short: "IMBEL M964 FAL"
 BRA_infantry_equipment_2_desc: "Le Brésil a reçu une petite quantité de fusils FAL fabriqués par la FN pour évaluation dès 1954. IMBEL avait fabriqué quelque 200 000 fusils M964. Plus tard, les FAL fabriqués au Brésil ont des récepteurs forgés au marteau de type 3. Les premiers FAL fabriqués par FN pour le Brésil sont des modèles typiques du FN 1964 avec des récepteurs de type 1 ou de type 2, une crosse en plastique, un garde-main et une poignée pistolet, un cache-flamme cylindrique de 22 mm pour le lancement de grenades et une poignée de transport en plastique modèle \"D\". On pense que les FAL fabriqués au Brésil ont été exportés vers l'Uruguay. Une version à canon lourd, connue sous le nom de FAP (Fuzil Automático Pesado, ou fusil automatique lourd) a également été produite pour les forces armées, pour être utilisée comme arme automatique d'escouade."

 BRA_infantry_equipment_3: "IMBEL MD2"
 BRA_infantry_equipment_3_short: "IMBEL MD2"
 BRA_infantry_equipment_3_desc: "Le fusil MD2 est le résultat de la refonte du FN FAL pour utiliser la cartouche OTAN de 5,56 × 45 mm à la place du chambrage OTAN de 7,62 mm du FAL. La série MD-2/MD-3 ressemble extérieurement à un FAL à canon court, mais avec un chargeur M16."

 BRA_infantry_equipment_4: "IMBEL MD97"
 BRA_infantry_equipment_4_short: "IMBEL MD97"
 BRA_infantry_equipment_4_desc: "Le MD97 est un fusil d'assaut à tir sélectif ou semi-automatique produit par IMBEL au Brésil depuis 1997. Il est basé sur l'IMBEL MD2, lui-même basé sur le FN FAL."


 ########## REDONE BRA ARMOR
 BRA_lt_equipment_1: "M3 Stuart"
 BRA_lt_equipment_1_short: "M3 Stuart"
 BRA_lt_equipment_2: "Lévrier M8"
 BRA_lt_equipment_2_short: "Lévrier M8"
 BRA_lt_equipment_3: "M41 Walker Bulldog"
 BRA_lt_equipment_3_short: "M41 Walker Bulldog"
 BRA_lt_equipment_4: "Bernardini X1A"
 BRA_lt_equipment_4_short: "X1A"
 BRA_lt_equipment_5: "Engesa EE-9 Cascavel Mk.II"
 BRA_lt_equipment_5_short: "EE-9 Cascavel Mk.II"
 BRA_lt_equipment_5_desc: "L'EE-9 Cascavel est un véhicule blindé brésilien à six roues développé principalement pour la reconnaissance. Il a été conçu par Engesa en 1970 pour remplacer la flotte vieillissante de M8 Greyhounds du Brésil. Le véhicule fut d'abord équipé du canon principal de 37 mm du Greyhound, puis d'une tourelle française adoptée du Panhard AML-90."
 BRA_lt_equipment_6: "Engesa EE-9 Cascavel Mk.III"
 BRA_lt_equipment_6_short: "EE-9 Cascavel Mk.III"
 BRA_lt_equipment_6_desc: "L'EE-9 Cascavel est un véhicule blindé brésilien à six roues développé principalement pour la reconnaissance. Il a été conçu par Engesa en 1970 pour remplacer la flotte vieillissante de M8 Greyhounds du Brésil. Le véhicule fut d'abord équipé du canon principal de 37 mm du Greyhound, puis d'une tourelle française adoptée du Panhard AML-90."

 BRA_mbt_equipment_0: "M4 Sherman"
 BRA_mbt_equipment_0_short: "M4 Sherman"
 BRA_mbt_equipment_1: "Parque Regional de Motomecanização da 2° Região Militar"
 BRA_mbt_equipment_1_short: "PqRMM/2"

 BRA_mbt_equipment_5: "Char de combat à chenilles complète : canon de 105 mm, M60"
 BRA_mbt_equipment_5_short: "M60 Patton"
 BRA_mbt_equipment_5_desc: "Le M60 Patton est un CCP conçu par le département des munitions de l'armée américaine en 1960. Il a été utilisé lors de la guerre du Yom Kippour, de l'invasion de la Grenade, du Yémen et du Liban. Il possède un blindage d'environ 220 mm et porte un canon principal de 105 mm. Il utilisait généralement la mitrailleuse M73 de 7,62 x 51 mm comme armement secondaire. Le moteur est un moteur V12 biturbo amélioré qui peut se déplacer à peu près à la même vitesse que le M48. Cependant, malgré un poids légèrement supérieur à celui du M48, le M60 peut se déplacer à peu près à la même vitesse et sur la même différence. Le M60 a subi de nombreuses modifications mineures tout au long de sa vie et compte ainsi environ 4 variantes. Cela signifiait une augmentation du blindage, du poids et une amélioration de la fiabilité."
 BRA_mbt_equipment_6: "KMW Léopard 1A1"
 BRA_mbt_equipment_6_short: "Léopard 1A1"
 BRA_mbt_equipment_7: "KMW Léopard 1A5BR"
 BRA_mbt_equipment_7_short: "Léopard 1A5BR"
 BRA_mbt_equipment_8: "Engesa EE-T1 Osorio"
 BRA_mbt_equipment_8_short: "EE T1 Osorio"
 BRA_mbt_equipment_9: "Bernardini MB-3 Tamoyo III"
 BRA_mbt_equipment_9_short: "MB-3 Tamoyo III"

 BRA_mechanized_equipment_1: "Demi-piste M2"
 BRA_mechanized_equipment_1_short: "Demi-piste M2"
 BRA_mechanized_equipment_1_desc: "La voiture semi-chenillée M2 est une voiture semi-chenillée blindée produite par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspirait des semi-chenilles importées de France dans les années 1930, employant des composants standard fournis par les constructeurs de camions américains pour accélérer la production et réduire les coûts. Le concept a été conçu et les modèles pilotes fabriqués par Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement étiqueté M2.). La production par la White Motor Company a commencé en 1940 et a été élargie pour inclure Autocar."
 BRA_mechanized_equipment_2: "Demi-piste M3"
 BRA_mechanized_equipment_2_short: "Demi-piste M3"
 BRA_mechanized_equipment_2_desc: "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 BRA_mechanized_equipment_3: "Demi-piste M3A1"
 BRA_mechanized_equipment_3_short: "Demi-piste M3A1"
 BRA_mechanized_equipment_3_desc: "Le M3A1 est un semi-chenillé M3 doté du support d'anneau de mitrailleuse M49 amélioré sur le siège avant droit. Entre 1942 et 1943, tous les half-tracks M3 (standard et A1) furent continuellement améliorés. Ces améliorations comprenaient un certain nombre d'améliorations de la transmission, du moteur et du rangement"
 BRA_mechanized_equipment_4: "Transporteur, personnel, entièrement chenillé, blindé, M59"
 BRA_mechanized_equipment_4_short: "M59"
 BRA_mechanized_equipment_5: "M113"
 BRA_mechanized_equipment_5_short: "M113"
 BRA_mechanized_equipment_6: "M113A1"
 BRA_mechanized_equipment_6_short: "M113A1"
 BRA_mechanized_equipment_7: "Engesa EE-11 Urutu"
 BRA_mechanized_equipment_7_short: "EE-11 Urutu"
 BRA_mechanized_equipment_8: "Moto Pecas Charrúa"
 BRA_mechanized_equipment_8_short: "Charrua"
 BRA_mechanized_equipment_9: "M113BR"
 BRA_mechanized_equipment_9_short: "M113BR"
 BRA_mechanized_equipment_10: "Iveco VBTP Guarani"
 BRA_mechanized_equipment_10_short: "VBTP Guarani"

 BRA_motorized_equipment_1: "GMC CCKW 6x6"
 BRA_motorized_equipment_1_short: "CCKW 6x6"
 BRA_motorized_equipment_2: "RÉO M35 6x6"
 BRA_motorized_equipment_2_short: "M35 6x6"
 BRA_motorized_equipment_2_desc: "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 BRA_motorized_equipment_3: "Engesa EE-25 6x6"
 BRA_motorized_equipment_3_short: "EE-25 6x6"
 BRA_motorized_equipment_3_desc: "a série Engesa EE-25 est apparue pour la première fois au début des années 1970 et, au fil des années, a été propulsée par une variété de moteurs, le moteur Mercedes-Benz est le dernier d'une gamme qui comprend des unités Chrysler et Perkins."
 BRA_motorized_equipment_4: "Engesa EE-50 6x6"
 BRA_motorized_equipment_4_short: "EE-50 6x6"
 BRA_motorized_equipment_4_desc: "L'Engesa EE-50 est un camion utilitaire lourd fabriqué au Brésil et est le plus gros camion militaire jamais construit dans ce pays. Il est utilisé pour une grande variété de rôles différents, selon la variante. Le développement a commencé à la fin des années 1970, en réponse aux exigences fixées par l'armée brésilienne. À la fin des années 1980, il fut accepté par l'armée brésilienne et la production commença."
 BRA_motorized_equipment_5: "Volkswagen Ouvrier 15.210 4x4"
 BRA_motorized_equipment_5_short: "VW Travailleur 15.210 4x4"
 BRA_motorized_equipment_5_desc: "Développé en collaboration avec l'armée brésilienne, le Worker est un camion moyen 4x4, testé pour garantir le respect des exigences d'une utilisation typique par l'armée. Le travailleur peut transporter jusqu'à 5 tonnes de charge sur n'importe quel terrain, bien que sa capacité de charge maximale soit plus grande. Le véhicule est conçu pour transporter à la fois des militaires et des marchandises générales, des conteneurs, de l'eau et même pour permettre l'installation d'armes anti-aériennes."

 BRA_mechanized_marine_equipment_1: "GMC DUKW 6x6"
