 BRA_strat_bomber_equipment_1: "Forteresse volante Boeing B-17"
 BRA_strat_bomber_equipment_1_short: "Forteresse volante B-17"
 BRA_strat_bomber_equipment_1_desc: "Le B-17 est un bombardier stratégique quadrimoteur développé au milieu des années 1930 pour l'US Army Air Corps. C'était le troisième bombardier le plus produit pendant la Seconde Guerre mondiale et il a servi avec distinction sur le théâtre européen du conflit, responsable des campagnes de bombardement en Allemagne à partir de bases du sud de l'Angleterre et de l'Italie. Son armement défensif hérissé convient parfaitement à un avion surnommé la « Forteresse volante »."

