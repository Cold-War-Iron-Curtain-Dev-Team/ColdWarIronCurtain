 BRA_auto_cannon_equipment_1: "8,8 cm Flugabwehrkanone mod 1937"
 BRA_auto_cannon_equipment_1_short: "Flak 88"
 BRA_auto_cannon_equipment_1_desc: "Le Flak 88 était un canon lourd de défense aérienne développé en Allemagne en 1928 et utilisé à grande échelle pendant la Seconde Guerre mondiale. Ses munitions de 88 mm se sont révélées très efficaces contre les cibles aériennes et automobiles. Le Brésil, entre autres pays, en acheta quelques unités avant la guerre et les maintint en service jusque dans les années 1950."
 BRA_auto_cannon_equipment_2: "canon de 90 mm M1"
 BRA_auto_cannon_equipment_2_short: "90mm M1"
 BRA_auto_cannon_equipment_2_desc: "Le 90 mm M1 était un canon anti-aérien et antichar lourd, développé aux États-Unis en 1938 et utilisé tout au long de la Seconde Guerre mondiale et plus tard, n'étant mis hors service qu'en 1960."
 BRA_auto_cannon_equipment_3: "Pistolet automatique Bofors 40 mm L/70"
 BRA_auto_cannon_equipment_3_short: "Bofors L/70"
 BRA_auto_cannon_equipment_3_desc: "Le Bofors L/70 est un canon automatique polyvalent développé par le fabricant d'armes suédois AB Bofors au cours de la seconde moitié des années 1940 en remplacement moderne de leur conception de canon Bofors 40 mm L/60 de la Seconde Guerre mondiale."
