 BRA_jet_multirole_equipment_1: "Étoile filante Lockheed F-80C"
 BRA_jet_multirole_equipment_1_short: "Étoile filante F-80C"
 BRA_jet_multirole_equipment_1_desc: "Le premier chasseur à réaction exploité par l'US Army Air Force (plus tard l'US Air Force). C'était le premier et le seul avion à réaction américain opérationnel pendant les derniers jours de la Seconde Guerre mondiale. Ce type marquerait le début de l'ère des avions à réaction pour les États-Unis, car sa conception à aile droite servait largement de chasseur de jour et de chasseur-bombardier pendant la guerre de Corée sous le nom de F-80. Surnommé « l'étoile filante », le F-80 représentait le premier summum de l'aviation américaine."
