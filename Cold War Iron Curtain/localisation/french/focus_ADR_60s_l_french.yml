 ADR_60s_The_Verraterische_Bruder_Speech_desc:0 "Le gouvernement de l'Autriche occidentale n'est rien d'autre qu'un régime fantoche composé de traîtres et de collaborateurs fascistes. Le secrétaire général Koplenig prononcera un discours galvanisant qui incitera la population de l'Autriche occidentale à adopter la voie est-autrichienne."
 ADR_60s_Found_the_Adele-Sturzl-Ensemble_desc:0 "L'Adele-Sturzl-Ensemble sera un pilier de la culture autrichienne ; le meilleur orchestre dédié à la composition et à l'interprétation de la musique socialiste !"
 ADR_60s_Promote_Mozart_desc:0 "On ne peut pas écarter les classiques ! Les compositions qui définissent le genre de Mozart seront entendues et célébrées pour les générations à venir !"
 ADR_60s_John_Brown_The_Musical_desc:0 "John Brown était un héros américain qui souhaitait libérer ses compatriotes d'une vie d'esclavage et d'oppression. Le ministère de la Culture a organisé la création d'une comédie musicale pour célébrer sa vie, il suffit d'un budget approuvé par l'État."
 ADR_60s_Expand_Searches_For_Talent_desc:0 "Une idée fausse à propos du socialisme est que nous sommes tous des soldats ou des ouvriers d'usine. La culture prospère dans le bloc de l'Est et nous trouverons des individus talentueux qui pourront le montrer au monde."
 
 ADR_60s_Experiment_with_Beat_Music_desc:0 "La beat music est un genre en plein essor au Royaume-Uni. Nous pourrions peut-être créer notre propre version avec des éléments musicaux socialistes."
 ADR_60s_The_Warsaw_Pact_Einheitskonzert_desc:0 "Le ministère de la Culture a proposé un événement annuel où les pays socialistes du monde entier pourraient se réunir pour exposer leurs réalisations culturelles."
 ADR_60s_Distinguish_East_Austrian_Identity_desc:0 "À mesure que l'Autriche occidentale glisse entre les griffes de l'Occident, son identité s'érode lentement. Nous devons veiller à ce que notre culture ne meure pas aux mains des impérialistes !"
 ADR_60s_Maintain_Our_Stance_on_Homosexuality_desc:0 "L'État a besoin de travailleurs et l'homosexualité rend impossible leur production."
 ADR_60s_Expand_Action_Film_Production_desc:0 "L'utilisation du cinéma comme propagande devient la norme en Amérique. Nous pourrions exploiter cela et faire des films pro-socialistes basés sur les héros de la révolution !"
 ADR_60s_Create_Unique_East_Austrian_Phrases_desc:0 "Chaque culture a ses idiomes, la nôtre ne fera pas exception."
 ADR_60s_Move_the_Nation_to_GMT_2_desc:0 "L'adoption de GMT+2 rapprochera notre époque de celle de l'Union soviétique. Cela facilitera grandement la coordination des conférences, réunions et autres événements importants."
 ADR_60s_Promote_the_Auschwitz_Text_desc:0 "Chaque action déplorable commise par les nazis sera connue dans toute l'Autriche, et tous les citoyens apprendront comment le capitalisme a permis ces crimes odieux."
 ADR_60s_Appoint_Mayenburg_Head_of_Volksstimme_desc:0 "Nous nommerons Ruth von Mayenburg à la tête de People's Voice, le journal officiel du parti."
 ADR_60s_Begin_Education_Reform_desc:0 "Nous sommes à la traîne de nos homologues occidentaux, nous devons améliorer notre système éducatif immédiatement !"
 ADR_60s_Maintain_Theory-Driven_Schooling_desc:0 "Si ni les théoriciens ni le Parti ont la réponse, alors la question ne vaut pas la peine d'être posée."
 ADR_60s_Introduce_a_Practical_School_Curriculum_desc:0 "Le Parti n'a pas toujours la réponse. Parfois, il faut chercher ailleurs."
 ADR_60s_Declare_East_Austria_the_First_Victim_of_Fascist_Imperialism_desc:0 "L'Anschluss de l'Autriche était un acte de subversion perpétré par des espions et des marionnettes nazies. Nous sommes autant que les autres victimes d'une agression fasciste !"
 ADR_60s_Request_Expansion_of_Volkswirtschaftspakt_desc:0 "Il est temps que le Volkswirtschaftspakt atteigne son potentiel, mais nous devons nous assurer que les Soviétiques le lui permettront."
 ADR_60s_Disband_the_Economic_Pact_desc:0 "Les Soviétiques nous ont forcés à dissoudre le Volkswirtschaftspakt, nous devrons compter entièrement sur nos propres prouesses industrielles."
 ADR_60s_Subsidize_Unprofitable_Companies_desc:0 "Nous ne pouvons pas nous permettre de laisser une seule entreprise faire faillite."
 ADR_60s_Increase_Deficit_Spending_desc:0 "Nous sommes obligés de continuer à dépenser de l'argent que nous n'avons pas. Nous ne pouvons qu'espérer y revenir plus tard."
 ADR_60s_Request_Soviet_Bailouts_desc:0 "Si les Soviétiques n'autorisent pas la coopération économique entre les membres du Pacte, ils doivent alors partager notre fardeau."
 ADR_60s_Increase_Quotas_desc:0 "Ce sera impopulaire, mais une augmentation des quotas de travailleurs contribuera à enrayer notre économie ensanglantée."
 ADR_60s_Modernize_Fertilizer_Production_desc:0 "Un surplus alimentaire peut être vendu pour un joli profit, nous devrions investir dans de meilleurs engrais pour augmenter la production."
 
 ADR_60s_Further_Exploit_the_Renner_Mine_desc:0 "Il reste encore des ressources inexploitées dans la mine Renner, nous creuserons profondément et avidement pour les atteindre !"
 ADR_60s_Construct_the_Burgunland_Rail_System_desc:0 "Le Burgenland doit être davantage développé afin de stimuler l'économie."
 ADR_60s_Expand_City_Limits_desc:0 "Si Vienne était entière, elle serait suffisamment grande. Puisque ce n'est pas le cas, nous devrons agrandir notre moitié de ville pour pouvoir suivre le rythme."
 ADR_60s_Soviet_Greenlight_desc:0 "Notre proposition a été approuvée par Moscou, l'expansion du Volkswirtschaftspakt peut avoir lieu !"
 ADR_60s_Exchange_Industrial_Advisors_with_Czechoslovakia_desc:0 "La coopération est la clé du succès du Volkswirtschaftspakt. Nous commencerons par échanger des conseillers industriels avec notre voisin du nord."
 ADR_60s_Support_Goulash_Communism_in_Hungary_desc:0 "La politique économique de János Kádár a considérablement amélioré le niveau de vie en Hongrie et favorisé le bien-être de la population. C'est une source d'inspiration pour nous tous."
 ADR_60s_Launch_Extensive_Tech_Sharing_Programs_desc:0 "Afin de garantir que nos industries fonctionnent toutes avec une efficacité maximale, les membres du Volkswirtschaftspakt partageront les technologies qui bâtissent une économie forte."
 ADR_60s_Open_Steel_Mines_to_Pact_Members_desc:0 "Pour accroître la coopération économique, nous ouvrirons nos mines aux membres du pacte."
 ADR_60s_Accept_Czechoslovak_and_Hungarian_Currency_desc:0 "La mise en place d'une union douanière limitée entre les membres du pacte facilitera grandement les échanges !"
 ADR_60s_Allow_for_the_Transfer_of_Skilled_Labor_desc:0 "Les travailleurs des pays membres seront libres de se déplacer et de travailler dans les industries de chacun."
 ADR_60s_Coordinate_Economic_Planning_desc:0 "Une planification coordonnée garantira que tous les membres du pacte prospèrent de manière égale et simultanée."
 ADR_60s_Unity_Against_Soviet_Overreach_desc:0 "Il est temps que les membres du pacte s'unissent et dénoncent la mainmise de l'Union soviétique sur nos pays."
 ADR_60s_Austrias_Economic_Future_desc:0 "L'avenir de l'Autriche dépend de son économie ; nous devons veiller à ce qu'elle soit forte et prospère."
 ADR_60s_Keep_Loyal_Planners_in_Influential_Positions_desc:0 "Seuls les économistes les plus compétents se verront attribuer des postes dans l'appareil d'État."
 ADR_60s_Allow_More_Upward_Mobility_desc:0 "La tendance à la hausse que nous connaissons actuellement doit se poursuivre le plus longtemps possible."
 ADR_60s_The_Great_Debt_Crisis_desc:0 "Les murmures d'une crise de la dette croissante se font de plus en plus entendre de jour en jour ; nous devons agir."
 ADR_60s_Ignore_Impending_Economic_Collapse_desc:0 "Effondrement économique ? Ridicule! Ce n'est rien d'autre que de la propagande occidentale destinée à semer le mécontentement parmi la population. "
 ADR_60s_Increase_Military_Spending_desc:0 "L'armée a besoin d'armes, pas de ragots inutiles. Les rumeurs de coupes budgétaires se révéleront fausses."
 ADR_60s_Expand_the_Vienna_Munitions_Plant_desc:0 "La seule pénurie dont nous souffrons concerne les munitions. Il faut augmenter la production."
 ADR_60s_Soviets_Pressure_Economic_Sensibility_desc:0 "Nous ne pouvons pas courir le risque de la famine ; notre production alimentaire doit être augmentée."
 ADR_60s_Bulk_Purchase_Western_European_Cars_desc:0 "Les jouets occidentaux brillants garderont les gens heureux et distraits."
 ADR_60s_Default_on_Debt_desc:0 "La dette n'est pas payable, le défaut est notre seule option."
 ADR_60s_NEIN_desc:0 "L'expansion du secteur civil stimulera l'économie."
 ADR_60s_Accept_Soviet_Demands_desc:0 "Nous avons besoin de bombes et d'armes, pas de jouets et d'appareils électroniques."
 ADR_60s_Autarky_by_Circumstance_desc:0 "Nous sommes obligés de nous contenter du peu dont nous disposons. Nous devrons apprendre à être complètement autonomes."
 ADR_60s_Attempt_to_Rebuild_Trade_Relations_desc:0 "Reconstruire les relations commerciales après un défaut de paiement sera difficile, mais nous devons essayer."
 ADR_60s_Request_Massive_Soviet_Bailouts_desc:0 "Nous n'avons plus le choix maintenant. La seule façon d'éviter un effondrement économique total est de contracter un emprunt auprès de l'URSS."
 ADR_60s_Take_the_Debt_Crisis_Seriosly_desc:0 "Nous ne pouvons plus ignorer la crise de la dette ; cette menace existentielle doit être traitée immédiatement et de manière approfondie."
 ADR_60s_Rent_Industry_to_East_Germany_and_Poland_desc:0 "Pour alléger notre fardeau économique, nous louerons une partie de notre capacité industrielle à la Pologne et à l'Allemagne."
 ADR_60s_Emphasize_Profitability_in_Planning_desc:0 "Nous adopterons temporairement une tarification basée sur le marché pour contribuer à stimuler l'économie."
 ADR_60s_Allow_Private_Plots_desc:0 "Une entreprise privée limitée allégera le fardeau financier de l'État et stimulera les dépenses de consommation."
 ADR_60s_Begin_Gutting_the_Austrian_Red_Army_desc:0 "L'Armée rouge dispose de plus de fonds qu'elle ne sait quoi en faire, nous redirigerons cet excédent vers le peuple."
 ADR_60s_Sell_the_Austrian_Gold_Reserves_desc:0 "Cela nous fera beaucoup de mal, mais la liquidation des réserves d'or contribuera à alléger nos fardeaux."
 ADR_60s_Begin_Currency_Devaluation_desc:0 "En dévalorisant le schilling, nous pouvons réduire notre déficit commercial."
 ADR_60s_Increase_Taxation_desc:0 "La dévaluation n'est pas une option ; le peuple devra simplement accepter des impôts plus élevés pour le moment."
 ADR_60s_Distribute_Remaining_Debt_Amongst_Volkswirtschaftspakt_Members_desc:0 "Le Volkswirtschaftspakt existe pour aider tous les États membres à atteindre la prospérité économique, mais ses membres doivent également s'entraider en temps de crise comme celui-ci."
 ADR_60s_Raise_the_Deficit_desc:0 "Nous devons assumer ce fardeau par nous-mêmes, aussi douloureux soit-il."
 ADR_60s_The_Little_Country_that_Could_desc:0 "Grâce à de nombreux sacrifices et épreuves, nous sommes sortis de cette crise économique plus forts que jamais."
 ADR_60s_Attempt_to_Overtake_the_West_Austrian_Economy_desc:0 "Si nous espérons retrouver l'Autriche occidentale, il faut faire comprendre à son peuple que le socialisme est la voie vers la prospérité. Notre économie doit devenir plus forte que la leur."
 ADR_60s_Drastically_Increase_Qutoas_desc:0 "Nous adopterons des quotas élevés afin de dépasser la production de l'Autriche occidentale."
 ADR_60s_Divert_Funding_to_the_Beer_Industry_desc:0 "La bière est pour les Autrichiens ce que la vodka est pour les Russes. Nous devrions financer correctement notre industrie brassicole. "
 
 ADR_60s_Expand_Toy_Manufacturing_in_Burgunland_desc:0 "Un nouveau parc industriel dédié aux biens de consommation sera ouvert dans le Burgenland. Les enfants vont adorer !"
 ADR_60s_Create_Barley_Farms_in_Lower_Austria_desc:0 "L'orge est un élément clé de la bière. Pour que notre industrie puisse rivaliser avec celle de l'Occident, nous en aurons besoin en grande quantité."
 
 ADR_60s_Reopen_the_Ottakringer_Brewery_desc:0 "La brasserie Ottakringer sera notre principal centre de production d'alcool !"
 ADR_60s_Request_Comecon_Aid_desc:0 "Pour contrebalancer l'aide économique de l'Autriche occidentale, nous demanderons la nôtre au Comecon."
 ADR_60s_Compete_with_West_German_Beer_desc:0 "La bière bavaroise est souvent considérée comme la meilleure d'Europe. Nous savourons ce défi."
 ADR_60s_Begin_Western_Exports_desc:0 "Il est temps de montrer à l'Occident que les produits de l'Autriche de l'Est sont les meilleurs produits !"
 ADR_60s_Deal_with_the_Austrian_Republikflucht_Crisis_desc:0 "Comme en Allemagne de l'Est, nombre de nos travailleurs compétents se laissent bercer par la propagande occidentale et font défection vers l'Autriche occidentale. Nous devons arrêter cela."
 ADR_60s_Follow_the_German_Model_desc:0 "Les Allemands ont raison ! Nous commencerons à concevoir notre propre mur pour séparer Vienne est et ouest."
 ADR_60s_Encourage_Deadly_Force_on_Deserters_desc:0 "Au cas où les dalles de béton géantes et les barbelés ne suffiraient pas, des projectiles en plomb devraient indiquer clairement qu'il ne faut pas franchir le Mur."
 
 ADR_60s_Seek_Aproval_From_Moscow_desc:0 "Un autre mur entre l'Est et l'Ouest provoquera probablement des tensions ; nous devrions obtenir l'autorisation de Moscou avant de continuer."
 ADR_60s_Construct_the_Grosse_Wiener_Volksmauer_desc:0 "Le Grand Mur populaire viennois dissuadera toute agression occidentale contre nous et empêchera tout passage illégal vers l'ouest de Vienne."
 ADR_60s_Denounce_the_Antifascist_Protection_Rampart_desc:0 "Un mur entre Vienne est et ouest ne fera que rendre la réunification plus difficile. Nous trouverons un autre moyen."
 ADR_60s_Expand_Grenzschutz_Operations_desc:0 "Un mur serait superflu et coûteux. La véritable solution consiste à élargir et à renforcer les gardes-frontières."
 
 ADR_60s_Build_Up_Stasi_Numbers_desc:0 "Il est impossible de faire défection sans aide extérieure. Nous demanderons à la Stasi d'étendre ses opérations à la frontière avec l'ouest de Vienne afin d'empêcher tout nouveau mouvement non autorisé."
 ADR_60s_Increase_Worker_Pensions_desc:0 "En augmentant leurs retraites, les travailleurs de Vienne-Est seront moins enclins à chercher fortune à l'Ouest."
 ADR_60s_Begin_Taxing_West_Wein_Travel_desc:0 "Si nous rendons les voyages dans l'ouest de Vienne prohibitifs, leur désir de visite diminuera de façon exponentielle. Faisons en sorte qu'il en soit ainsi."
 ADR_60s_Das_Koplenig_Manafesto_desc:0 "Le secrétaire général Koplenig est prêt à publier son manifeste, dans lequel il détaille l'avenir du socialisme autrichien dans un monde post-stalinien."
 ADR_60s_Begin_Limited_Destalinization_desc:0 "Nous ne pouvons plus nier que certaines politiques de Staline ont causé plus de mal que de bien. La déstalinisation est nécessaire pour assurer l'avenir du socialisme."
 ADR_60s_Normalize_Relations_with_Yugoslavia_desc:0 "Notre rivalité avec Tito a assez duré. Nous avons besoin de solidarité et non de division."
 ADR_60s_Tour_the_Warsaw_Pact_desc:0 "Le secrétaire général Koplenig visitera le Pacte de Varsovie et promouvra une coopération plus poussée entre tous les États membres."
 ADR_60s_Invite_East_Germany_to_Volkswirtschaftspakt_desc:0 "Avoir l'Allemagne dans le Volkswirtschaftspakt augmentera considérablement notre capacité industrielle !"
 ADR_60s_Ease_Tension_with_the_West_desc:0 "La paix et l'unité sont l'objectif de tout socialiste. Nous allons tendre un rameau d'olivier vers l'Ouest et voir si nous ne pouvons pas arranger les choses."
 ADR_60s_Denounce_US_Military_Presence_in_Europe_desc:0 "Si les États-Unis sont attachés à la paix, pourquoi ont-ils fait de l'Europe occidentale une base pour leur armée ?"
 ADR_60s_State_Visit_to_France_desc:0 "La France est l'un des pays occidentaux les plus pro-travailleurs, elle pourrait être un allié potentiel."
 ADR_60s_Propose_a_United_Austrian_Olympic_Team_desc:0 "Afin de renforcer les sentiments d'unité et de coopération entre les deux Autriches, nous proposerons la création d'une équipe autrichienne unie pour participer aux Jeux Olympiques."
 ADR_60s_Denounce_the_Maoist_Political_Movement_desc:0 "La manière dont Mao a géré la révolution en Chine a été une catastrophe. Lui et ceux qui suivent sa doctrine ne sont pas de vrais socialistes."
 ADR_60s_Diplomatically_Isolate_Albania_desc:0 "Hoxha a bêtement décidé de s'aligner sur Mao et ses idées révisionnistes. Nous n'aurons rien à voir avec lui."
 ADR_60s_Petition_for_Anti-Revisionist_Containment_desc:0 "Quiconque a adopté le révisionnisme de l'oeuvre de Karl Marx est un traître à la révolution. Laissez les rats se regrouper s'ils le souhaitent, mais ils ne sont plus les bienvenus ici."
 ADR_60s_Ban_the_Little_Red_Book_desc:0 "Les citations du président Mao Tsé-toung sont un livre dangereux, nous n'autoriserons pas sa circulation."
 ADR_60s_The_October_Coup_desc:0 "§RQue se passe-t-il?!§"
 ADR_60s_Regain_Control_desc:0 "Nous ne subirons pas cette trahison ! L'ordre doit être rétabli immédiatement !"
 ADR_60s_Execute_Franz_Jonas_desc:0 "La seule punition en cas de trahison est une balle."
 ADR_60s_Request_Limited_Soviet_Occupation_desc:0 "Le chaos et l'incertitude règnent dans les rues ; nous avons besoin de l'aide soviétique pour les apaiser."
 ADR_60s_Foster_an_Alliance_with_the_Catholic_Church_desc:0 "Si permettre aux gens de pratiquer ouvertement leur culte peut calmer les choses, alors c'est une concession qui mérite d'être accordée."
 ADR_60s_Promote_Conservative_Values_desc:0 "Le travail acharné et l'amour de la famille font partie des rares valeurs que nous partageons avec l'Occident. Celles-ci sont parfaitement compatibles avec le socialisme."
 ADR_60s_Purge_Suspected_Opportunists_in_the_KPO_desc:0 "Même au sein du parti, des murmures de réforme se font entendre. Il faut les faire taire."
 ADR_60s_Stack_the_Party_with_Koplenig_Loyalists_desc:0 "Le secrétaire général Koplenig est notre seul espoir pour l'avenir. Quiconque n'est pas d'accord n'est pas un véritable membre du parti."
 ADR_60s_Expand_the_Rote_Garde_desc:0 "La Garde Rouge doit être renforcée pour qu'une telle situation ne puisse plus jamais se reproduire."
 ADR_60s_Return_to_Normalcy_desc:0 "Le coup d'État est terminé, il est temps que la normalité revienne."
 ADR_60s_General_Secretary_Jonas_desc:0 "Le Parti communiste a ruiné l'Autriche de l'Est ! Nous avons besoin de changement !"
 ADR_60s_Rapid_Liberalization_desc:0 "Sous le KPO, l'Autriche de l'Est est devenue une prison. La liberté doit être restaurée."
 ADR_60s_Exile_Koplenig_Loyalists_to_the_DDR_desc:0 "Les amis de Koplenig ne sont plus les bienvenus ici."
 ADR_60s_Abolish_State_Censorship_desc:0 "Les gens ont le droit de savoir ce qui se passe dans leur pays, le temps de la censure est révolu."
 ADR_60s_Allow_Opposition_Parties_desc:0 "Le pouvoir absolu corrompt absolument. En permettant aux partis d'opposition d'exercer leurs fonctions, une plus grande responsabilité peut être obtenue."
 ADR_60s_Renounce_all_Ties_to_the_Soviets_desc:0 "L'Union soviétique est directement responsable des souffrances que notre peuple a dû endurer. Nous ferons comprendre au monde que nous ne voulons plus avoir affaire à eux."
 ADR_60s_Remove_Border_Restrictions_desc:0 "Notre peuple n'est pas des animaux, il n'est pas nécessaire de les enfermer dans notre pays. Ouvrez la frontière !"
 ADR_60s_Open_the_ADR_to_West_Austrian_Investment_desc:0 "Nous avons besoin de l'aide de l'Autriche occidentale pour atténuer la destruction économique provoquée par le communisme."
 ADR_60s_Reunite_With_the_West_desc:0 "§BPour l'unité et la démocratie !§"
 ADR_60s_The_Death_of_Koplenig_desc:0 "On le savait depuis un temps, mais la nouvelle est toujours un choc..."
 ADR_60s_General_Secretary_Ernst_Fischer_desc:0 "Ernst Fischer a proposé une campagne de réformes semblable à celles de Khrouchtchev et de Tito. Il devrait être notre prochain secrétaire général."
 ADR_60s_Promote_Detente_with_West_Austria_desc:0 "Les tensions sont vives depuis des décennies maintenant, il est temps d'adopter une approche plus diplomatique envers notre homologue occidental."
 ADR_60s_State_Visit_to_West_Germany_desc:0 "L'Allemagne de l'Est est notre alliée de toujours, mais nous devons également entretenir de bonnes relations avec sa moitié occidentale. Après tout, nous partageons une frontière."
 ADR_60s_Rehabilitate_Relations_with_Israel_desc:0 "Il n'y a aucune raison d'être hostile à l'État juif."
 ADR_60s_Endorse_Hungarian_Goulash_Communism_desc:0 "Les réformes tchécoslovaques sont exactement ce dont le monde socialiste a besoin."
 ADR_60s_Greatly_Improve_Relations_with_Tito_desc:0 "Josip Tito a toujours été un réformateur ; c'est quelqu'un que nous devrions tous nous efforcer d'imiter."
 ADR_60s_Critique_the_Brezhnev_Doctrine_desc:0 "La politique agressive de Brejnev envers ses collègues du Bloc constitue une menace plus grande pour le socialisme qu'il ne le pense."
 ADR_60s_Support_Austrian_Liberalization_desc:0 "La libéralisation s'est avérée très bénéfique pour la cause socialiste ; le Bloc tout entier devrait l'adopter."
 ADR_60s_Introduce_HR_Departments_in_the_Communes_desc:0 "En permettant aux travailleurs d'exprimer plus facilement leurs préoccupations, nos industries seront plus fortes et la responsabilité plus grande."
 ADR_60s_Reduce_Press_Censorship_desc:0 "Il n'est pas nécessaire d'imposer à l'État un bureau de censure gonflé, nous pouvons permettre une certaine liberté de la presse."
 ADR_60s_Encourage_Artistic_Experimentation_desc:0 "Le réalisme socialiste est une belle forme, mais tous les arts ne doivent pas nécessairement appartenir à cette catégorie. La dernière chose que nous voulons, c'est la stagnation culturelle."
 ADR_60s_Shorten_Term_Limits_on_Party_Officials_desc:0 "Un changement constant de leadership empêchera l'enracinement politique."
 ADR_60s_Intensify_Destalinization_desc:0 "La déstalinisation s'est avérée bénéfique pour l'Union soviétique ; il le fera également ici."
 ADR_60s_General_Secretary_Franz_Muhri_desc:0 "Franz Muhri promet de rester attaché à l'orthodoxie marxiste-léniniste. Il devrait être notre prochain secrétaire général."
 ADR_60s_Establish_Ties_with_Eurocommunist_Parties_desc:0 "Les partis communistes d'Europe occidentale ont besoin de notre aide pour diffuser leur message !"
 ADR_60s_Strengthen_Relations_with_East_Germany_desc:0 "Notre lien avec l'Allemagne doit être encore renforcé."
 ADR_60s_Send_Advisors_to_Egypt_and_Syria_desc:0 "L'Égypte lutte constamment contre l'impérialisme occidental ; ils auront notre soutien !"
 ADR_60s_Found_the_East_Austrian_Volunteer_Corps_desc:0 "Lorsque la révolution éclatera dans d'autres pays, le corps des volontaires autrichiens sera là pour vous aider !"
 ADR_60s_Forcefully_Condemn_the_Anti-Revisionist_Movement_desc:0 "La révision et la déviation du marxiste-léninisme équivaut à une trahison ! On ne peut pas le laisser se développer."
 ADR_60s_Endorse_the_Brezhnev_Doctrine_desc:0 "Tout mouvement révisionniste au sein du Bloc menace de provoquer l'effondrement du système tout entier. Le secrétaire général Brejnev a la bonne idée."
 ADR_60s_Follow_the_Moscow_Line_desc:0 "Moscou a guidé le bloc de l'Est à travers de nombreuses crises, et quoi qu'il fasse ou dise, c'est pour le bien de tous."
 ADR_60s_Rule_Through_Coercion_desc:0 "Nous devons empêcher les peuples de saper les fruits de leur propre travail."
 ADR_60s_Increase_Stasi_Numbers_desc:0 "Nos yeux et nos oreilles sont partout, pour préserver l'ordre et empêcher l'infiltration occidentale."
 ADR_60s_Appoint_Loyal_Planners_desc:0 "Seuls ceux qui ont fait preuve de la plus grande loyauté peuvent avoir la possibilité de servir l'État."
 ADR_60s_Expand_Red_Army_Training_Facilities_desc:0 "Pour renforcer notre armée, nous construirons de nouvelles installations de formation à travers le pays."
 ADR_60s_Solidify_Intelectual_Control_desc:0 "Les érudits, les scientifiques et les artistes vivent tous pour servir l'État. Ils feraient bien de s'en souvenir."
 ADR_60s_The_Prague_Spring_desc:0 "La libéralisation est en cours en Tchécoslovaquie ; comment devons-nous réagir ?"
 ADR_60s_Condemn_Tank_Communism_desc:0 "Chaque fois que des membres du Bloc font preuve d'initiative, Moscou envoie des chars. Nous ne pouvons plus rester silencieux là-dessus."
 ADR_60s_Keep_Silent_on_the_Issue_desc:0 "Ce ne sont vraiment pas nos affaires, laissons les Tchèques et les Soviétiques s'en occuper eux-mêmes."
 ADR_60s_The_Austrian_Red_Army_desc:0 "L'Armée rouge approche de ses 10 ans de service, voyons quels progrès elle a réalisés pendant cette période."
 ADR_60s_The_Austrian_Ground_Force_desc:0 "La Force Terrestre sera toujours prête à défendre le peuple !"
 ADR_60s_License_the_BRT-60_desc:0 "Le BRT-60 est le dernier APC de l'Union soviétique. Nous devrions en autoriser quelques-uns !"
 ADR_60s_Improve_the_AK_Platform_desc:0 "L'Avtomat Kalashnikova est le meilleur fusil d'assaut au monde ! Voyons si nous ne pouvons pas améliorer la conception."
 ADR_60s_Invest_in_Spec-Ops_Training_desc:0 "§RJe pourrais te le dire, mais je devrais alors te tuer.§"
 ADR_60s_Enhance_Urban_Combat_Tactics_desc:0 "L'envahisseur est toujours désavantagé lors des combats dans les villes. Nous devons améliorer nos tactiques urbaines si jamais nous devons combattre dans l'ouest de Vienne."
 
 ADR_60s_The_Austrian_Red_Airforce_desc:0 "L'ARAF est prête à régner sur le ciel !"
 ADR_60s_Purchase_SU-17s_desc:0 "Les dernières avancées en matière de véhicules de combat aérien soviétiques sont disponibles à l'achat !"
 ADR_60s_Re-enforce_Airstrip_Pavement_desc:0 "Nos bases aériennes commencent à montrer leur âge, il est temps de les rénover et de les moderniser."
 ADR_60s_Die_Rote_Fallschirmjager_desc:0 "La dernière chose que les Occidentaux souhaitent voir, c'est un bataillon complet de parachutistes rouges tombant du ciel."
 ADR_60s_Improve_Transport_Aircraft_desc:0 "Nous avons besoin de meilleurs avions pour amener nos troupes là où elles doivent être."
 ADR_60s_The_Austrian_Red_Air_Defence_Force_desc:0 "L'ARAD ne permettra pas qu'une seule bombe ennemie tombe sur nos villes !"
 ADR_60s_Construct_Nuclear_Blast_Shelters_in_Urban_Areas_desc:0 "À mesure que notre population augmente, le besoin d'abris de protection civile augmente."
 ADR_60s_Modernize_Quick_Response_AA_Units_desc:0 "Si l'ennemi passe à travers, il fera face à un barrage complet de tirs antiaériens."
 ADR_60s_Found_The_Strategic_Rocket_Command_desc:0 "Le Strategic Rocket Command sera chargé de coordonner le déploiement de nos missiles en cas de guerre, ainsi que la défense contre les roquettes ennemies."
 ADR_60s_Allow_Deployment_of_R-12_Dvinas_desc:0 "Pour dissuader davantage l'agression occidentale, nous autoriserons les Soviétiques à déployer leurs missiles sur notre territoire."