l_french:
 cuba.2.t:0 "Accord de protection américano-cubain"
 cuba.2.d:0 "Après la Seconde Guerre mondiale, les pays se battent pour choisir un camp entre les communistes et les capitalistes. Cubain a décidé de se tourner vers les États-Unis d'Amérique pour obtenir sa protection."
 cuba.2.a:0 "L'Amérique nous protégera des communistes."
 cuba.3.t:0 "Le général Batista revient au pouvoir à Cuba !"
 cuba.3.d:0 "Fulgencio Batista était auparavant au pouvoir à Cuba. Cette fois-ci, il se présentait à l'élection présidentielle, mais réalisant qu'il n'avait aucune chance de gagner l'élection, et avec le soutien de l'armée, il organisa un coup d'État et reprit le pouvoir à Cuba."
 cuba.3.a:0 "Batista pourrait être notre sauveur."
 cuba.4.t:0 "Révolution communiste"
 cuba.4.d:0 "Que ce soit voulu ou non. Les communistes prendront le contrôle du gouvernement cubain et établiront leur propre régime. Leur chef est Fidel Castro et il est devenu leader de Cuba après avoir mené une dure révolution. Il était soutenu par son frère Raul Castro et leur ami Che Guevara."
 cuba.4.a:0 "Fidel est un homme du peuple."
 cuba.5.t:0 "Formez l'allégeance des Caraïbes"
 cuba.5.d:0 "Faire partie de l'OTAN est trop risqué. Cuba ne veut pas être impliqué dans une guerre à grande échelle mais veut des alliés. Ils resteront toujours proches des États-Unis mais garderont une certaine distance avec eux."
 cuba.5.a:0 "Former la faction"
 cuba.6.t:0 "Demander à rejoindre l'OTAN"
 cuba.6.d:0 "Une guerre est inévitable, non ? Rejoindre les Américains signifie que nous pourrons détruire les communistes plus rapidement."
 cuba.6.a:0 "Rejoignez l'OTAN."
 cuba.7.t:0 "Demander à rejoindre Varsovie"
 cuba.7.d:0 "Une guerre est inévitable, non ? Rejoindre les Soviétiques signifie que nous pourrons détruire plus rapidement les sales capitalistes."
 cuba.7.a:0 "Rejoignez Varsovie."
 cuba.8.t:0 "Alliance espagnole"
 cuba.8.d:0 "Les Cubains sont ethniquement et culturellement espagnols et il est temps de montrer notre loyauté envers l'Espagne et de former une alliance avec eux."
 cuba.8.a:0 "Formez l'Alliance !"
 cuba.9.t:0 "Accord de protection soviéto-cubain"
 cuba.9.d:0 "Après la Seconde Guerre mondiale, les pays se battent pour choisir un camp entre les communistes et les capitalistes. Cuba a décidé de se tourner vers l'Union des Républiques socialistes soviétiques, l'URSS, pour obtenir sa protection."
 cuba.9.a:0 "La Russie nous protégera des porcs capitalistes."
 cuba.10.t:0 "Interdire les élections"
 cuba.10.d:0 "Fulgencio Batista était si désespéré de conserver son rôle de leader qu'il a interdit la tenue d'élections publiques."
 cuba.10.a:0 "Eh bien... ce n'est pas bon."
 cuba.11.t:0 "Crise des missiles cubains"
 cuba.11.d:0 "Le 16 octobre 1962, l'Union soviétique avait placé ses missiles sur les côtes de Cuba. Cette tension a été exacerbée par le missile lancé en Turquie, qui partage une frontière avec l'Union soviétique. Les deux superpuissances sont actuellement en train de résoudre cette crise, mais à l'heure actuelle, il semble que les retombées nucléaires mettront fin à cette crise."
 cuba.11.a:0 "Euh oh"
 cuba.12.t:0 "Embargo commercial"
 cuba.12.d:0 "Pour écraser Cuba et son économie autant que possible, les États-Unis n'ont imposé qu'une interdiction commerciale et un embargo sur tous les produits cubains et ont également tenté d'imposer des droits de douane sur les autres pays qui font du commerce avec Cuba."
 cuba.12.a:0 "Vous devez vous moquer de moi"
 cuba.13.t:0 "Inviter des membres caribéens"
 cuba.13.d:0 "Dans un effort pour élargir la faction cubaine, ils invitent la République dominicaine et également Haïti."
 cuba.13.a:0 "Espérons qu'ils acceptent"
 cuba.14.t:0 "Inviter des membres du continent"
 cuba.14.d:0 "Dans un effort pour élargir la faction cubaine, ils invitent les pays d'Amérique centrale."
 cuba.14.a:0 "Espérons qu'ils acceptent"
 cuba.15.t:0 "Restreindre le Parti communiste"
 cuba.15.d:0 "Le Parti communiste grandit. Batista tente de les éliminer en les restreignant, mais cela ne fait que leur apporter du soutien."
 cuba.15.a:0 "Mort aux communistes"
 cuba.16.t:0 "Propagande anti-impérialiste"
 cuba.16.d:0 "Nous ne pouvons pas permettre à des pays d'exploiter nos camarades. Nous devons montrer aux gens à quoi ressemble réellement le colonialisme."
 cuba.16.a:0 "Mort aux porcs impérialistes"
 cuba.17.t:0 "Soutenez le soulèvement du Congo"
 cuba.17.d:0 "Nous devons libérer nos camarades du Congo. Ils doivent briser leurs chaînes de l'impérialisme !"
 cuba.17.a:0 "Libérer le Congo"
 cuba.18.t:0 "Soutenez le soulèvement du Congo"
 cuba.18.d:0 "Nous devons libérer nos camarades du Congo. Ils doivent briser leurs chaînes de l'impérialisme !"
 cuba.18.a:0 "Libérer le Congo"
 cuba.19.t:0 "Subjuguer les Caraïbes"
 cuba.19.d:0 "Nous devons étendre notre influence démocratique à l'ensemble des Caraïbes."
 cuba.19.a:0 "Oui... plus de puissance"
 cuba.20.t:0 "Se remettre de la crise du sucre"
 cuba.20.d:0 "Notre pays est en crise. Nous avons endommagé notre économie en exportant trop de sucre."
 cuba.20.a:0 "D'accord"
 cuba.21.t:0 "Soutenez le soulèvement grec"
 cuba.21.d:0 "La Grèce connaît de nombreuses difficultés car son pays est idéologiquement divisé. Les communistes ont lancé une révolution contre un gouvernement fasciste soutenu par les États-Unis."
 cuba.21.a:0 "Mort aux communistes !"
 cuba.22.t:0 "Étendre l'industrie au continent"
 cuba.22.d:0 "Il est temps d'étendre notre industrie et notre influence hors de notre île et vers le continent américain."
 cuba.22.a:0 "Il faut s'agrandir !"
 cuba.23.t:0 "Pacte cubano-américain"
 cuba.23.d:0 "Cuba a décidé de conclure un accord. Les États-Unis donneront le territoire de Porto Rico en échange d'équipements et de ressources."
 cuba.23.a:0 "Il faut s'agrandir !"
 cuba.24.t:0 "Répandez la révolution"
 cuba.24.d:0 "Che Guevara, un expert militaire de premier plan de la révolution cubaine, a soutenu une révolution en Bolivie. Le gouvernement cubain a décidé d'envoyer de l'aide aux communistes."
 cuba.24.a:0 "Soutenez les communistes"
 cuba.1001.t:0 "Rébellion posadiste"
 cuba.1001.d:0 "Nous avons reçu des informations faisant état d'une tentative de coup d'État de la part du Partido Obrero Revolucionario trotskyste dirigé par Juan Posadas. Composés de plusieurs centaines d'ouvriers, ils sont prêts à attaquer La Havane et à prendre le pouvoir. Malheureusement pour eux, notre armée supérieure est prête à écraser leur tentative et à faire en sorte qu'ils ne reviennent pas."
 cuba.1001.a:0 "Écrasez-les comme des mouches !"
 cuba.1001.b:0 "Des dauphins de l'espace nucléaire ? Je suis intéressé."
 cuba.3004.b:0 "C'est peut-être autre chose..."
 bay_of_pigs.1.t:0 "Baie des Cochons"
 bay_of_pigs.1.d:0 "Cuba, un seuil sous le spectre américain, s'est retrouvée dans une situation difficile pour les socialistes et les réactionnaires radicaux. Depuis la guerre hispano-américaine, il est de notre devoir de respecter le devoir de protection des Caraïbes et des Amériques."
 bay_of_pigs.1.a:0 "Un siège est en cours..."
bay_of_pigs.3.t:0 "[GetNewspaperHeader]Les ravages qui en résultent"
 bay_of_pigs.3.d:0 "L'influence américaine sur la politique cubaine a radicalement changé le pays à bien des égards. Que ce soit si le socialisme l'emporte ou si les réactionnaires radicaux s'emparent de la glorieuse Cuba ; les deux spectres de la révolution atteindront toujours leurs objectifs."
 bay_of_pigs.4.t:0 "[GetNewspaperHeader]Cuba en ruine"
 bay_of_pigs.4.d:0 "Alors que les Américains d'origine cubaine se battent de l'autre côté de la baie, les Cubains pleurent la mort de membres de leurs familles alors qu'ils luttent contre leurs oppresseurs socialistes. Beaucoup ont pris les armes contre la menace d'extrême gauche. Partout dans le monde, les Cubains expriment de nombreuses opinions divergentes sur le désastre qui se déroule à Cuba, mais en fonction de son issue ; Cuba tracera la voie de la liberté ou de l'endoctrinement."
 #new events
 Cubatourism.1:0 "Grâce à sa situation géographique, Cuba est depuis longtemps une attraction populaire pour les touristes des pays voisins, accueillant plus de touristes au début du 20e siècle que tout autre endroit des Caraïbes. Bien que cette industrie en plein essor ait été gravement freinée par la Grande Dépression et la Seconde Guerre mondiale, le tourisme sur la petite île prospère à nouveau alors que les gens affluent pour évacuer le stress et profiter de la sérénité de l'île. Mais tout n'est pas serein sur l'île, car les tensions sociales montent en coulisses, la population indigène de l'île étant de plus en plus agitée par un gouvernement de plus en plus corrompu et autoritaire."
 
 CubaRepression.2:0 "Le gouvernement cubain réfléchit à l'opportunité d'inviter Meyer Lansky à La Havane. Lansky est une figure notoire qui entretient des liens étroits avec la mafia américaine. Au cours des deux dernières décennies, il a joué un rôle majeur dans l'orientation des activités mafieuses à La Havane, apportant des millions d'investissements. Le gouvernement cubain espère qu'en le faisant venir, il pourra négocier un accord pour garantir des hôtels et des casinos rentables, ainsi qu'un afflux important d'investissements en espèces. Le gouvernement cubain peut faire à Lansky une offre qui garantira des bénéfices en échange de récompenses au gouvernement afin de garantir que Cuba disposera d'une réserve de liquidités importante en cas d'urgence. La conclusion d'un tel accord offrirait de nombreux profits et développements potentiels, mais le risque d'une forte présence du crime organisé en provenance d'Amérique éloignerait les Cubains et potentiellement le gouvernement des États-Unis. En outre, l'impact que ces investisseurs auront sur la politique cubaine doit également être pris en compte, car s'ils se sentent menacés, la mafia pourrait recourir à la corruption ou à la violence contre les responsables cubains, ce qui ne pourrait qu'enflammer l'opposition envers le gouvernement."
 CubaRepression.4.d:0 "Dans le but de créer le plus grand casino en dehors de Las Vegas, un homme d'affaires américain nommé Meyer Lansky a commandé la construction d'un grand casino dans notre capitale, La Havane ! Avec des centaines de chambres prévues, et chacune étant même climatisée ! Cela attirera sûrement plus de touristes et s'avérera bénéfique en faisant de Cuba le chez-soi de chaque visiteur. Que la Riviera des Caraïbes brille !"
 CubaRepression.5:0 "Le président Fulgencio Batista et son Parti d'action progressiste ont remporté les élections de 1954 à Cuba. Batista a unifié trois partis cubains et, au cours de la campagne électorale, de nombreux candidats de l'opposition ont abandonné la course. Les dirigeants de l'opposition, dont d'anciens présidents, ont affirmé que leurs partisans étaient terrorisés par le régime de Batista. Certains partis y ont participé en échange de garanties du régime de Batista, mais la plupart des partis d'opposition ont boycotté le résultat. Moins de cinquante pour cent de l'électorat y a participé, ce qui indique que le boycott a été efficace. L'élection visait à légitimer Batista après son retour au pouvoir par un coup d'État militaire, mais cela semble s'être retourné contre lui. Les résultats des élections ont amené ceux qui s'opposaient à Batista mais ne soutenaient pas les révolutionnaires menant une résistance armée depuis les montagnes, à commencer à sympathiser davantage avec les rebelles révolutionnaires. Les élections n'ont pas réussi à légitimer son régime et désormais, même les Cubains neutres considèrent le régime de Batista comme une dictature."
 CubaRepression.6:0 "Le président Fulgencio Batista, président cubain, a déjoué une tentative de coup d'État lancée par des centaines d'officiers militaires dirigés par le colonel Ramon Barquín. Le colonel Barquin, un officier professionnel, aurait été bouleversé par le fait que Batista ait fait passer Cuba d'une démocratie à un dictateur. Il a convaincu un certain nombre d'officiers partageant les mêmes idées de rejoindre sa cause, mais n'a pas réussi à renverser Batista. Le président Batista a réussi à rallier le soutien du personnel enrôlé, mais le soutien explicite des États-Unis à Batista en a convaincu beaucoup de ne pas se joindre au coup d'État. Le colonel Barquin a été capturé et attend actuellement son procès en cour martiale avec ses co-conspirateurs. Bien que le président Batista ait survécu, son corps d'officiers, en particulier ses officiers professionnels, est désormais purgé et l'on craint que les forces rebelles anti-Batista ne profitent de la situation. Cette tentative indique qu'à mesure que Batista renforce son contrôle, il pousse de plus en plus son opposition à des actes plus dramatiques. Bien que le coup d'État ait été brisé et que de nombreuses personnes aient été arrêtées, le président Batista devrait étendre la purge de l'armée et déraciner les officiers professionnels susceptibles de partager la vision du colonel Barquin."
 CubaRepression.7:0 "Le président cubain Fugencio Batista a annoncé qu'il suspendrait la constitution cubaine de 1940. Le président Batista a pris la décision de consolider son pouvoir et, en suspendant la constitution, il a mis fin à bon nombre de ses garanties progressistes. Cela permettra à son régime de réprimer plus librement une opposition de plus en plus bruyante. En outre, les propriétaires terriens et les hommes d'affaires cubains d'élite se félicitent de la fin de certains droits des travailleurs qui, selon eux, entravaient leurs profits. Cependant, même si Batista peut attirer davantage de soutien de l'élite, les paysans et les travailleurs seraient très mécontents et craignent un recul de leurs droits. En outre, cette action renforce encore l'argument des détracteurs de Batista, qui soulignent que cette action prouve leur conviction que le coup d'État militaire qui a ramené Batista au pouvoir n'a eu lieu que pour satisfaire son propre agenda politique. Beaucoup d'autres conviennent désormais que le coup d'État n'a pas été lancé pour sauver le pays mais pour sauver Batista d'une défaite politique lors des prochaines élections."
 CubaSterling.2.d:0 "Le président Sterling a poursuivi ses efforts pour résoudre la crise à Cuba en annonçant une nouvelle politique majeure. Il a proposé une amnistie générale aux rebelles révolutionnaires cubains, dont beaucoup opèrent dans les montagnes. Tous les rebelles qui souhaitent mettre fin à leur conflit peuvent rejoindre n'importe quel poste de police ou militaire gouvernemental, rendre leurs armes, s'engager à ne plus se rebeller à l'avenir, puis rentrer chez eux. Le président Sterling espère que cette amnistie de masse affaiblira la détermination et réduira les rangs des rebelles en offrant à ceux qui ne sont plus aussi engagés dans la cause une issue sans crainte de représailles du gouvernement. Cette action démontrera également la volonté du président Sterling de s'engager de manière raisonnable auprès de toutes les parties. Certes, certains éléments, en particulier parmi les anticommunistes les plus enragés du camp gouvernemental, ne sont pas fans de l'amnistie et craignent que les rebelles ne se propagent à Cuba ou ne reprennent la guerre après avoir résolu les problèmes intérieurs. Cependant, il y a un sentiment d'optimisme à La Havane face à cette nouvelle approche."
 CubaAguero.1.d:0 "Le président cubain Andres Agüero a officiellement demandé aux États-Unis d'intervenir et de mettre fin aux troubles en cours qui ravagent la nation insulaire. Les révolutionnaires cubains, opérant dans les montagnes, aux côtés de leurs sympathisants urbains, mènent une offensive brutale contre le gouvernement cubain. Le président Agüero a adressé sa demande à l'ambassadeur des États-Unis à La Havane et a ajouté que si les Américains n'intervenaient pas, cela rendrait son pays vulnérable face aux communistes radicaux qui mènent les troubles. Le président a ajouté qu'en plus de la menace idéologique que représentent les rebelles, Cuba est depuis longtemps une destination privilégiée pour les visiteurs américains ainsi que pour les investissements américains. La chute du système démocratique cubain pourrait voir de nombreux Américains perdre leurs entreprises et leurs investissements. Le président Agüero espère que les États-Unis seront convaincus et que son gouvernement assiégé pourra utiliser le soutien de son puissant voisin du nord pour inverser la tendance contre les forces révolutionnaires qui semblent croître presque quotidiennement."

 #More Country Events
 CubaSterling.1.d:0 "L'ambassadeur des États-Unis à Cuba est arrivé à la Maison Blanche avec un message important du président Sterling, le leader cubain. Le président Sterling a fait part d'urgence dans une lettre adressée au président de la nécessité pour les États-Unis d'agir en tant que médiateur pour résoudre les troubles politiques actuels qui secouent son pays. De nombreux Cubains sont devenus frustrés face au système démocratique défectueux qui semble donner du pouvoir aux élites cubaines au détriment des travailleurs. En outre, certains membres de l'élite, y compris des investisseurs étrangers, seraient frustrés par le programme politique présidentiel de Sterling. Le président Sterling fait face à la fois à la menace des révolutionnaires prônant un changement de système gouvernemental et à la crainte d'un coup d'État militaire ou politique pour l'évincer et pousser Cuba plus profondément sur la voie de la dictature. Il espère que si les États-Unis acceptent d'agir en tant que médiateur, il sera en mesure de négocier et de résoudre les problèmes auxquels Cuba est confronté, en position de force et de légitimité."
 CubaRepression.10.d:0 "La situation sécuritaire se détériorant de jour en jour, le gouvernement cubain a annoncé qu'il retarderait les prochaines élections. Les rebelles révolutionnaires ont appelé ces dernières semaines à une grève générale, intensifié leurs attaques et lancé une campagne de bombardements urbains pour tenter d'empêcher les élections. Le président Batista a décidé qu'il serait préférable de retarder les élections, mais a promis qu'elles auraient lieu afin que Cuba ne subisse pas de chantage de la part des voyous communistes. La décision de retarder les élections a conduit à une plus grande déception à l'égard du régime de Batista, car de nombreux Cubains croient désormais de plus en plus que le système démocratique s'est complètement transformé en une dictature de Batista. Les rebelles seraient également ravis de voir que leur capacité à mobiliser les populations urbaines et le grand public a atteint un tel niveau. L'armée cubaine serait en train d'intensifier ses propres opérations afin de garantir que le retard des élections ne soit pas encore retardé, car le régime de Batista a besoin des élections pour prouver ses références constitutionnelles à une population de plus en plus sceptique quant à savoir si Cuba a encore une loi constitutionnelle."

 M267_insurgency_options.1.d:0 "L'un de nos agents spéciaux nationaux a réussi à infiltrer le M267 et le gain d'informations est incroyable. Nous avons acquis une quantité de données sans précédent et un réseau d'informateurs confidentiels qui nous aideront dans notre lutte contre l'insurrection cubaine. Notre réseau a déjà découvert d'innombrables dépôts de ravitaillement et est capable de démanteler d'innombrables opérations, affaiblissant considérablement la capacité du M267 à infliger des dégâts à notre nation.\nCe succès aura des implications profondément positives et protégera notre nation."
 M267_insurgency_options.2.d:0 "Suite à l'échec de la tentative d'infiltration du M267 par notre agent spécial national, le M267 a corrigé plusieurs points vulnérables de ses opérations, amélioré son processus de vérification et est devenu plus résilient dans son ensemble. De plus, bien que notre agent ait résisté à l'interrogatoire, ils ont pu en apprendre davantage sur nous grâce à ses actions et, dans les prochains jours, ils pourraient tenter d'utiliser ces techniques contre des cibles de niveau inférieur telles que les commissariats de police et les garnisons.\nCet échec est une tache sur notre bilan et aura des conséquences notables."
 M267_insurgency_options.3.d:0 "Une répression sévère contre les opérations du M267 a abouti à un succès étonnant. Nos forces de police étaient plus que prêtes à vaincre l'ennemi et à le prendre au dépourvu. Nous avons saisi d'innombrables explosifs et équipements et tué de nombreux membres du M267. De plus, le raid nous a fourni de grandes quantités d'informations car ils n'ont pas réussi à les détruire à temps.\nCe succès affaiblira leurs opérations futures et diminuera leur férocité."
 M267_insurgency_options.4.d:0 "Le M267 savait que nous arrivions. Soit ils ont évacué leurs installations en laissant des pièges à feu prêts à exploser lorsque la police pénétrait profondément à l'intérieur, soit ils ont tendu des embuscades contre notre police. Non seulement cela a abouti à un échec retentissant, mais l'ennemi a même lancé des contre-attaques contre nos commissariats de police et lancé des attaques opportunistes pour s'emparer du ravitaillement alors que nos officiers étaient occupés ou morts. Le M267 est désormais bien mieux armé et capable de mener de futures attaques dans la région. Pour l'heure, nous avons envoyé des renforts de police depuis les zones voisines et avons même affecté des soldats à des patrouilles pour renforcer les forces gouvernementales désormais affaiblies.\nCet échec affaiblira nos tentatives de les combattre dans la région et augmentera probablement leur férocité."
 M267_insurgency_options.5.d:0 "Après plusieurs passes de reconnaissance et d'innombrables heures de préparation, nous avons finalement lancé nos bombardements contre des installations éloignées du M267. Des fermes d'abricotiers aux maisons modernes en bord de mer, les installations de leurs milices ont été considérablement affaiblies. Nos frappes ont rasé les installations d'entraînement, effectué des attaques opportunistes contre des convois de ravitaillement, détruit des zones de rassemblement et, de manière générale, détruit des bases éloignées. Le M267 est désormais beaucoup plus faible et l'absence de ces installations distantes déconnectera son réseau de cellules opérant entre les villes.\nL'ennemi sera désormais moins capable de lancer des attaques et sera moins agressif à l'avenir."
 M267_insurgency_options.6.d:0 "Non seulement nos renseignements étaient erronés, non seulement nous avons détruit d'innombrables cibles non ciblées, mais nous avons en fait réussi d'une manière ou d'une autre à détruire certains des atouts de notre propre nation. Les postes de garde et les trains de ravitaillement de notre propre armée ont été ravagés par cette mauvaise direction. D'après ce que dit notre directeur du renseignement, l'ennemi a alimenté la désinformation de nos informateurs confidentiels. À l'avenir, nous devrons peut-être mieux nous coordonner avec l'armée pour garantir qu'en cas d'échec, cela n'entraînera pas de tirs amis.\nCet échec affaiblira la capacité de l'armée à combattre l'insurrection et à prévenir les attaques, les rendant ainsi plus agressives."

 #News Events
 Cuban_Revolution.1.d:0 "Fidel Castro et ses combattants rebelles révolutionnaires ont récemment lancé une série d'attaques contre le régime de Fulgencio Batista. Les troupes gouvernementales défendant le régime se sont révélées largement inefficaces alors que les rebelles remportaient des victoires contre les forces gouvernementales. Beaucoup citent la corruption du régime de Batista, la promotion des officiers politiques au détriment des professionnels et la popularité des rebelles comme raisons pour lesquelles l'armée cubaine semble incapable d'arrêter les rebelles. Batista, l'ancien homme fort cubain, qui domine la politique cubaine depuis la fin des années 1930, a fui le pays avec sa famille le lendemain, suivi par nombre de ses proches conseillers, hauts ministres et responsables. Ils se sont emparés d'une immense fortune totalisant des centaines de millions, pillée au gouvernement ou collectée au cours de leurs années au pouvoir. Au fur et à mesure que la nouvelle se répandait, les rebelles n'étaient plus confrontés à la résistance militaire et les habitants de La Havane attendent l'arrivée de Castro et de ses rebelles. De grandes fêtes ont déjà éclaté dans les rues de La Havane alors que de nombreux Cubains célèbrent la fin de Batista."
 Cuban_Revolution.10.d:0 "Dans les montagnes de la Sierra Maestra à Cuba, les derniers vestiges du groupe révolutionnaire cubain, appelé Mouvement du 26 juillet, sont détruits ou se rendent aux forces militaires cubaines. Les rebelles ont commencé leur révolte armée contre le régime de Fulgencio Batista car ils estimaient que seule la résistance armée pouvait mettre fin à sa corruption et à sa domination sur le système démocratique cubain. Le groupe était dirigé par Fidel Castro et d'autres jeunes hommes qui considéraient la révolution comme le seul moyen pour Cuba de progresser et de mettre fin à l'instabilité constante qui tourmente Cuba depuis son indépendance. Cependant, le groupe n'a finalement pas réussi à déloger Batista ni à obtenir suffisamment de soutien national pour menacer son régime. Batista a réussi à rassembler ses forces contre les rebelles et a finalement réussi à briser leur résistance à son régime. Cette victoire a galvanisé Batista qui estime désormais que son régime est en sécurité et de nombreux Cubains craignent qu'il ne remplace bientôt ouvertement le régime démocratique par sa dictature. Le temps nous dira si la ferveur révolutionnaire déclenchée par le Mouvement du 26 juillet se terminera par sa défaite ou si elle constitue désormais un élément permanent de la vie politique cubaine."


