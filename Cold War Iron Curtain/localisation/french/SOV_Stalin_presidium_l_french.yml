 SOV_pres_char_molotov_faction_ui:0 "[SOV_pres_molotov_faction_name]"
 SOV_pres_char_molotov_leader_tt:0 "§YViatcheslav Molotov§!\nAncien bras droit de Staline. Démis du ministère des Affaires étrangères en mars 1949; sa femme Polina a été arrêtée en janvier, mais il reste incontestablement fidèle à la cause.\n\n§YComment lire le panneau§!\nNoms : §Yor§! membre à part entière, membre candidat blanc, §ggris§! non membre du Politburo.\nFactions : §iVieille Garde stalinienne§!, §4Technocrates§!, §0Organes de sécurité§!, §6Modérés du Parti§!, §uL'Armée§!.\nSurvolez un portrait pour connaître sa faction, son statut et ses caractéristiques."
 SOV_pres_char_molotov_tt:0 "§YViatcheslav Molotov§!\nAncien bras droit de Staline. Démis du ministère des Affaires étrangères en mars 1949; sa femme Polina a été arrêtée en janvier, mais il reste incontestablement fidèle à la cause.\n\nFaction : [SOV_pres_molotov_faction_name]\nBureau politique : [SOV_pres_molotov_rank_name]\nRelation avec le leader : [?SOV_pres_molotov_relation|+0]\n\n§YDiplomate§!: S'est assis en face de Churchill et Truman.\n§YIdéologue§!: Gardien de la pureté doctrinale."
