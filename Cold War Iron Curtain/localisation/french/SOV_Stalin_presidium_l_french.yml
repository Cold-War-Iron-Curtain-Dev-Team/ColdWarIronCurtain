 SOV_pres_char_khrushchev_leader_tt:0 "§YNikita Khrouchtchev§!\nPremier secrétaire d'Ukraine. Staline l'appellera à Moscou avant la fin de l'année.\n\n§YComment lire le panneau§!\nNoms : §Yor§! membre à part entière, membre candidat blanc, §ggris§! non membre du Politburo.\nFactions : §iVieille Garde stalinienne§!, §4Technocrates§!, §0Organes de sécurité§!, §6Modérés du Parti§!, §uL'Armée§!.\nSurvolez un portrait pour connaître sa faction, son statut et ses caractéristiques."
 SOV_pres_char_khrushchev_tt:0 "§YNikita Khrouchtchev§!\nPremier secrétaire d'Ukraine. Staline l'appellera à Moscou avant la fin de l'année.\n\nFaction : [SOV_pres_khrushchev_faction_name]\nBureau politique : [SOV_pres_khrushchev_rank_name]\nRelation avec le leader : [?SOV_pres_khrushchev_relation|+0]\n\n§YPopuliste§!: S'adresse aux travailleurs dans leur propre langue.\n§YAgraire§!: A des opinions sur le maïs, les kolkhozes et la récolte."
