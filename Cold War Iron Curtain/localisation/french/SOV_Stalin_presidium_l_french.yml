 SOV_pres_char_malenkov_faction_ui:0 "[SOV_pres_malenkov_faction_name]"
 SOV_pres_char_malenkov_leader_tt:0 "§YGueorgui Malenkov§!\nDe retour au Secrétariat depuis 1948, il s'emploie à détruire le groupe de Léningrad.\n\n§YComment lire le panneau§!\nNoms : §Yor§! membre à part entière, membre candidat blanc, §ggris§! non membre du Politburo.\nFactions : §iVieille Garde stalinienne§!, §4Technocrates§!, §0Organes de sécurité§!, §6Modérés du Parti§!, §uL'Armée§!.\nSurvolez un portrait pour connaître sa faction, son statut et ses caractéristiques."
 SOV_pres_char_malenkov_tt:0 "§YGueorgui Malenkov§!\nDe retour au Secrétariat depuis 1948, il s'emploie à détruire le groupe de Léningrad.\n\nFaction : [SOV_pres_malenkov_faction_name]\nBureau politique : [SOV_pres_malenkov_rank_name]\nRelation avec le leader : [?SOV_pres_malenkov_relation|+0]\n\n§YApparatchik§!: Une créature de la machine du parti qui connaît chaque dossier et chaque faveur.\n§YPlanner§!: Pense en tonnes, quotas et horizons quinquennaux."
 SOV_pres_char_beria:0 "Lavrenti Béria"
