 SOV_pres_char_bulganin_leader_tt:0 "§YNikolaï Boulganine§!\nUn maréchal politique supervisant les forces armées et l'industrie de la défense.\n\n§YComment lire le panneau§!\nNoms : §Yor§! membre à part entière, membre candidat blanc, §ggris§! non membre du Politburo.\nFactions : §iVieille Garde stalinienne§!, §4Technocrates§!, §0Organes de sécurité§!, §6Modérés du Parti§!, §uL'Armée§!.\nSurvolez un portrait pour connaître sa faction, son statut et ses caractéristiques."
 SOV_pres_char_bulganin_tt:0 "§YNikolaï Boulganine§!\nUn maréchal politique supervisant les forces armées et l'industrie de la défense.\n\nFaction : [SOV_pres_bulganin_faction_name]\nBureau politique : [SOV_pres_bulganin_rank_name]\nRelation avec le leader : [?SOV_pres_bulganin_relation|+0]\n\n§YApparatchik§!: Une créature de la machine du parti qui connaît chaque dossier et chaque faveur.\n§YSoldat§!: A porté l'uniforme pendant la guerre et pense toujours comme un commandant du front."
