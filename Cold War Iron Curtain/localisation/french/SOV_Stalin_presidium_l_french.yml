 SOV_pres_char_beria_faction_ui:0 "[SOV_pres_beria_faction_name]"
 SOV_pres_char_beria_leader_tt:0 "§YLavrenti Béria§!\nDirige le projet de bombe atomique. Il a perdu les ministères de la Sécurité en 1946 et le MGB d'Abakumov traque son peuple.\n\n§YComment lire le panneau§!\nNoms : §Yor§! membre à part entière, membre candidat blanc, §ggris§! non membre du Politburo.\nFactions : §iVieille Garde stalinienne§!, §4Technocrates§!, §0Organes de sécurité§!, §6Modérés du Parti§!, §uL'Armée§!.\nSurvolez un portrait pour connaître sa faction, son statut et ses caractéristiques."
 SOV_pres_char_beria_tt:0 "§YLavrenti Béria§!\nDirige le projet de bombe atomique. Il a perdu les ministères de la Sécurité en 1946 et le MGB d'Abakumov traque son peuple.\n\nFaction : [SOV_pres_beria_faction_name]\nBureau politique : [SOV_pres_beria_rank_name]\nRelation avec le leader : [?SOV_pres_beria_relation|+0]\n\n§YChekist§!: Formé dans les organes de sécurité. Il voit des intrigues partout et a parfois raison.\n§YIndustriel§!: Construit des usines à partir de rien, quel qu'en soit le prix."
