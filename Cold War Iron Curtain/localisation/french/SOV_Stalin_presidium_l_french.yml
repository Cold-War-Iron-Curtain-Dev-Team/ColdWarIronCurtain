 SOV_pres_char_stalin_faction_ui:0 "[SOV_pres_stalin_faction_name]"
 SOV_pres_char_stalin_leader_tt:0 "§YJoseph Staline§!\nLe Vozhd. Successeur de Lénine, secrétaire général du Parti et visage du mouvement communiste international.\n\n§YComment lire le panneau§!\nNoms : §Yor§! membre à part entière, membre candidat blanc, §ggris§! non membre du Politburo.\nFactions : §iVieille Garde stalinienne§!, §4Technocrates§!, §0Organes de sécurité§!, §6Modérés du Parti§!, §uL'Armée§!.\nSurvolez un portrait pour connaître sa faction, son statut et ses caractéristiques."
 SOV_pres_char_stalin_tt:0 "§YJoseph Staline§!\nLe Vozhd. Successeur de Lénine, secrétaire général du Parti et visage du mouvement communiste international.\n\nFaction : [SOV_pres_stalin_faction_name]\nBureau politique : [SOV_pres_stalin_rank_name]\nRelation avec le leader : [?SOV_pres_stalin_relation|+0]"
