 flavorfra.1.t:0 "[GetNewspaperHeader]Mai à Paris"
 flavorfra.1.d:0 "Les étudiants et les grévistes ont envahi Paris. Une grande partie de la ville est à l'arrêt et le gouvernement peine à rétablir l'ordre."
 flavorfra.1.a:0 "Paris s'est arrêté."
 flavorfra.1.b:0 "Paris est dans la rue."
 flavorfra.2.t:0 "[GetNewspaperHeader]Le TGV ouvre"
 flavorfra.2.d:0 "Le TGV est ouvert entre Paris et Lyon. Le trajet dure environ deux heures."
 flavorfra.2.a:0 "Le train roule."
 flavorfra.2.b:0 "La France a un train rapide."
 flavorfra.3.t:0 "[GetNewspaperHeader]Le guerrier arc-en-ciel"
 flavorfra.3.d:0 "Le navire Rainbow Warrior de Greenpeace a été coulé dans le port d'Auckland. La France est impliquée dans l'attentat et un photographe à bord est mort."
 flavorfra.3.a:0 "Le scandale est le nôtre."
 flavorfra.3.b:0 "Un navire a été coulé."
 flavorfra.4.t:0 "[GetNewspaperHeader]Décès de François Mitterrand"
 flavorfra.4.d:0 "François Mitterrand est décédé. Il fut président de la France de 1981 à 1995."
 flavorfra.4.a:0 "Mitterrand est mort."
 flavorfra.4.b:0 "L'ancien président est mort."
