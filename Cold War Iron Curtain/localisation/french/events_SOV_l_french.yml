 peace_event.1.t:0 "[GetNewspaperHeader]La Yougoslavie se plie au pacte"
 peace_event.1.d:0 "Des rapports en provenance des Balkans confirment que le gouvernement yougoslave s'est officiellement rendu face à l'avancée des armées du Pacte de Varsovie. Après des semaines de pressions croissantes et de manoeuvres éclair à travers les campagnes, Belgrade a été occupée et le gouvernement central a mis fin à la résistance organisée.\n\nBien que des bandes partisanes s'accrochent toujours aux collines et aux forêts, l'État lui-même a capitulé. Des colonnes de troupes soviétiques, polonaises et hongroises défilent dans la capitale tandis que les bannières rouges du Pacte sont hissées sur les bâtiments gouvernementaux. Les responsables de l'Est saluent l'événement comme une nécessaire « correction d'une déviation », tandis que les dirigeants occidentaux le regardent avec une profonde inquiétude.\nPour les peuples de Yougoslavie, la promesse d'indépendance a cédé la place à la réalité de l'occupation. La suite - une intégration directe ou un régime fantoche fidèle à Moscou - reste incertaine. Ce qui est certain, c'est que l'équilibre des pouvoirs en Europe s'est à nouveau modifié."
 peace_event.1.a:0 "Il n'y a plus de Troisième Voie."
 soviet_leader_change.1.d.A:0 "Terrible nouvelle, camarades. Joseph Vissarionovich Staline est décédé à l'âge de 74 ans à la datcha de Kuntsevo des suites d'un accident vasculaire cérébral. Quelques jours avant son accident vasculaire cérébral, Staline et un petit nombre de ses proches, composés de Malenkov, Molotov, Beria, Khrouchtchev et quelques autres, se sont réunis pour une soirée de divertissement et de boissons alcoolisées. Les invités se sont dispersés vers 4 heures du matin le lendemain et Staline s'est retiré dans ses quartiers privés avec des instructions strictes selon lesquelles il ne devait pas être dérangé jusqu'à ce que des bruits indiquent qu'il s'était réveillé. Le temps a passé et aucun son n'a été entendu tout au long de la journée. Vers 23h00. Le même jour, sa gouvernante entra prudemment dans sa chambre et le trouva allongé sur le sol, portant son pantalon de pyjama et une chemise. Il était inconscient, respirant difficilement, incontinent et insensible aux tentatives visant à le réveiller. Beria a été appelé et, en le voyant, a ignoré le fait qu'il était inconscient, attribuant cela à la consommation d'alcool, et est parti.\nLe lendemain, à 7 heures du matin, Beria et un groupe d'experts médicaux ont été convoqués pour l'examiner. Sur la base de leur examen, qui a révélé une tension artérielle de 190/110 et une hémiplégie du côté droit, ils ont conclu que Staline, qui avait des antécédents connus d'hypertension incontrôlée, avait subi un accident vasculaire cérébral hémorragique impliquant l'artère cérébrale moyenne gauche. Au cours des deux jours suivants, il a reçu divers traitements ; et, pour tenter de diminuer sa tension artérielle, qui s'était élevée à 210/120, deux applications distinctes de huit sangsues chacune furent appliquées sur son cou et son visage au cours des deux jours suivants. Cependant, son état a continué à se détériorer et il est décédé à [GetDateText]. Son corps a ensuite été transporté dans un lieu non précisé et une autopsie a été pratiquée, après quoi il a été embaumé pour être exposé au public. Nikita Khrouchtchev, Georgy Malenkov, Vyacheslav Molotov et Lavrentiy Beria sont chargés d'organiser les funérailles."
 soviet_leader_change.1.d.B:0 "Terrible nouvelle, camarades. Joseph Vissarionovitch Staline a été victime d'un accident vasculaire cérébral dans sa datcha de Kuntsevo. Quelques jours avant son accident vasculaire cérébral, Staline et un petit nombre de ses proches, composés de Malenkov, Molotov, Pervukhin, Saburov et quelques autres, se sont réunis pour une soirée de divertissement et de boissons alcoolisées. Les invités se sont dispersés vers 4 heures du matin le lendemain et Staline s'est retiré dans ses quartiers privés avec des instructions strictes selon lesquelles il ne devait pas être dérangé jusqu'à ce que des bruits indiquent qu'il s'était réveillé. Le temps a passé et aucun son n'a été entendu tout au long de la journée. Le même jour, vers 8 heures du matin, sa femme de ménage entra prudemment dans sa chambre et le trouva allongé sur le sol, portant son pantalon de pyjama et une chemise. Il était inconscient, respirant difficilement, incontinent et insensible aux tentatives visant à le réveiller. Les médecins furent appelés et, dès qu'ils le virent, ils commencèrent immédiatement des expertises.\nÀ 23h00 plus tard dans la journée, Malenkov et le reste de son entourage ont été informés de l'incident. Grâce aux réponses rapides des médecins, qui ont révélé une tension artérielle de 190/110 et une hémiplégie du côté droit, le camarade Staline, qui avait des antécédents connus d'hypertension incontrôlée, s'est partiellement remis de son accident vasculaire cérébral. Au cours des semaines suivantes, il reçut divers traitements ; et a annoncé qu'il envisageait de se retirer lors du prochain congrès du Parti, mais en attendant, il établira un organe consultatif tournant composé des membres de son bureau politique pour l'aider dans sa tâche. Maksim Saburov, Georgy Malenkov et Mikhail Pervukhin sont les premiers membres de ce conseil."
 soviet_leader_change.1.t.B:0 "Le coup de Staline"
 soviet_leader_change.1.t.A:0 "La mort de Staline"
 soviet_leader_change.1.o.A:0 "Les camarades Malenkov, Khrouchtchev et Beria formeront une Troïka"
 soviet_leader_change.1.o.B:0 "Les camarades Staline créeront un organe consultatif pour préparer sa succession."

 soviet_leader_change.2.t:0 "Tentative d'expulsion contre Khrouchtchev"
 soviet_leader_change.2.desc:0 ""
 soviet_leader_change.2.o.A:0 "Leonid Brejnev est élu premier secrétaire"
 soviet_leader_change.2.o.B:0 "Alexander Shelepin est élu premier secrétaire"
 soviet_leader_change.2.o.C:0 "Nikita Khrouchtchev est sauvé par ses alliés"
 
 soviet_leader_change.3.t:0 "Accident d'usine à Tachkent"
 soviet_leader_change.3.desc:0 "Le 21 mars 1982, Brejnev entame une visite en Asie centrale soviétique qui comprend un programme particulièrement rigoureux de « cérémonies de remise de médailles, discours et visites d'entreprises industrielles et agricoles ». Le 25 mars, alors qu'il visitait l'usine aéronautique Chkalov à Tachkent avec le premier secrétaire du Parti communiste ouzbek Sharaf Rashidov, un échafaudage s'est soudainement effondré sous le poids d'un certain nombre d'ouvriers de l'usine rassemblés."
 soviet_leader_change.3.o.A:0 "L'échafaudage s'est soudainement effondré et a frappé le premier secrétaire Brejnev."
 soviet_leader_change.3.o.B:0 "L'échafaudage s'est soudainement effondré et a heurté les agents de sécurité à côté du Premier secrétaire."
 
 soviet_leader_change.4.t:0 "Décès de Léonid Ilitch Brejnev"
 soviet_leader_change.4.desc:0 "Léonid Ilitch Brejnev, notre cher dirigeant, est décédé à l'âge de 75 ans des suites d'une crise cardiaque après des années de graves maladies. Il souffrait de plusieurs maladies depuis 1974, notamment des maladies cardiaques, de la leucémie, du cancer de la mâchoire, de l'emphysème et des maladies circulatoires, toutes exacerbées par son tabagisme excessif et son obésité. Malgré sa maladie, il a continué ses fonctions jusqu'à finalement mourir d'une crise cardiaque dans son bureau. Ses funérailles auront lieu dans cinq jours. Tandis que nous pleurons sa mort, nous devons également choisir son successeur."
 soviet_leader_change.4.o.A:0 "Yuri Andropov est élu président."

 Germany_Unified_Neutral:0 "@DDRGermany est §Yunifié§! sous un état neutre"
 Swf_Later_Stalin.1.d:0 "Depuis plus d'un siècle, des discussions ont eu lieu sur la possibilité d'inverser le débit des rivières qui se jettent inutilement dans l'Arctique. Cela permettrait d'exploiter un immense pouvoir et de créer une révolution agricole dans des espaces autrefois désolés. Dans les années 1930, d'éminents scientifiques soviétiques de l'Académie des sciences ont discuté de la question de l'inversion du cours du fleuve, mais à une échelle plus gérable. L'État souhaite entamer ce processus, dans l'espoir d'offrir aux travailleurs et aux paysans soviétiques une plus grande sécurité et une plus grande prospérité en matière d'approvisionnement en eau."
 Swf_Later_Stalin.2.d:0 "Le Politburo a ordonné aux agences compétentes de commencer les préparatifs pour les transferts de population en Asie centrale soviétique. Les mouvements de populations, notamment ces dernières années, ont soulevé la question de futurs conflits ethniques potentiels dans ces zones. Restaurer l'homogénéité ethnique ne fera que renforcer ces républiques socialistes soviétiques. En outre, certaines populations minoritaires peuvent être déplacées vers des zones où elles constituent la majorité. Ces opérations nécessitent que les services de sécurité travaillent en étroite collaboration avec d'autres agences publiques compétentes pour garantir un déroulement fluide et rapide des opérations."
 Swf_Later_Stalin.3.d:0 "Il existe une communauté arménienne solide, bien que petite, dans toute l'Asie centrale soviétique. Certains sont arrivés dès le milieu du XIXe siècle. Il y a ceux qui se sont installés encore plus tôt et se sont imposés comme commerçants. Cependant, ils sont en train de devenir lentement une communauté minoritaire reconnaissable dans la région, ce qui suscite des tensions car les habitants éprouveraient du ressentiment à l'égard de leur statut économique et de leur culture étrangère. Pour prévenir d'éventuels problèmes et prévenir les tensions ethniques, l'État a approuvé des projets de transfert des Arméniens d'Asie centrale vers la République socialiste soviétique d'Arménie. Cette opération atteint non seulement nos objectifs de promotion de l'harmonie en Asie centrale, mais contribue également à unifier la population arménienne. Malgré ces points positifs, certains rapports indiquent que les Arméniens d'Asie centrale sont mécontents et affirment ne pas connaître la vie en RSS d'Arménie."
 Swf_Later_Stalin.4.d:0 "La première étape vers l'inversion du débit des rivières soviétiques a été récemment franchie. L'Union soviétique a officiellement ouvert le canal Pechora-Kama. Le projet avait été intensément discuté dans les années 1930, mais n'a été mis en construction que récemment. Le canal redirigera le débit de la rivière Pechora vers le bassin de la Volga, augmentant ainsi son débit dans la mer Caspienne. Depuis plus d'un siècle, les responsables et les scientifiques russes ont cherché à développer une campagne d'inversion du Grand Fleuve Nord qui arrêterait enfin l'écoulement de l'eau dans l'océan Arctique. Malgré ces premiers succès, le projet devrait prendre des années et coûter d'énormes quantités de ressources."
 Swf_Later_Stalin.5.t:0 "\"[GetNewspaperHeader]Déportations massives en [DDR.GetNameDef] après l'échec du soulèvement\""
 Swf_Later_Stalin.5.d:0 "Des reportages de [DDR.GetNameDef] parlent de scènes déchirantes de grands groupes d'Allemands embarqués de force dans des trains à destination de l'Asie centrale soviétique. Ces déportations massives ont été ordonnées par le Premier ministre soviétique Joseph Staline à la suite de l'échec d'un soulèvement antisoviétique. Le gouvernement soviétique devrait envoyer les militants antisoviétiques présumés dans le nord de la République socialiste soviétique du Kazakhstan, où Staline avait expulsé les Allemands de la Volga au début de la Seconde Guerre mondiale. Les déportations massives sont largement condamnées dans le monde non communiste, mais le gouvernement soviétique reste attaché à sa politique."
 Swf_Later_Stalin.6.d:0 "L'Union soviétique mène actuellement l'un des plus grands échanges de population de son histoire, à travers l'Asie centrale soviétique. Dans un effort visant apparemment à préserver l'homogénéité ethnique et à prévenir les sources potentielles de troubles, toutes les principales communautés ethniques de la région seront déplacées vers leur patrie ethnique. Les Kazakhs de tous les États soviétiques d'Asie centrale seront transférés vers la RSS kazakhe. Tous les Ouzbeks de souche seront transférés vers la RSS d'Ouzbékistan. Les responsables soviétiques insistent sur le fait que ses actions sont bien accueillies par ceux qui ont été déplacés, qui sont reconnaissants que l'État soit intervenu pour les unir. Cependant, des militants antisoviétiques affirment que les expulsions déracinent des communautés qui vivent depuis des générations dans la région et favoriseront les rivalités ethniques entre les différents États."
 Swf_Later_Stalin.7.d:0 "Les Ukrainiens en Asie centrale soviétique sont arrivés par vagues dès le XVIIIe siècle. Un mélange de colons volontaires et forcés ont quitté l'Ukraine jusqu'à l'ère soviétique. Sous le régime soviétique, dans les années 1930 et 1940, l'État a expulsé de force des dizaines de milliers d'Ukrainiens supplémentaires. Premièrement, ils ont ciblé les koulaks et, lorsque la Seconde Guerre mondiale a éclaté, les sympathisants et collaborateurs présumés du fascisme ont également été expulsés. Aujourd'hui, l'Union soviétique a annoncé son intention de commencer à expulser tous les Ukrainiens d'Asie centrale vers l'Ukraine. La nouvelle sera particulièrement bien accueillie par les récents déportés forcés. Cependant, des milliers de personnes vivent en Asie centrale depuis des générations et seraient mécontentes des expulsions prévues. Il semble que l'Union soviétique soit fortement engagée dans l'établissement et le rétablissement de l'homogénéité ethnique dans ses républiques socialistes afin de favoriser l'unité et de prévenir d'éventuelles sources de troubles."
 Swf_Later_Stalin.8.d:0 "Les responsables soviétiques n'ont pas commenté les informations faisant état de l'expulsion de Tchétchènes vers la RSS tadjike. Malgré les démentis, des sources affirment que, dans le cadre d'un programme plus large de transfert de population en Asie centrale soviétique, les déportations ont lieu. Les raisons ne sont pas tout à fait claires, mais elles pourraient être liées aux craintes des responsables soviétiques que les Tchétchènes pourraient représenter une source potentielle de troubles dans leurs projets. L'objectif général de ces récents transferts de population semble être le désir d'établir une homogénéité ethnique dans l'ensemble des républiques socialistes soviétiques de la région et d'éliminer les sources potentielles de conflits ethniques ou culturels."
 Swf_Later_Stalin.9.d:0 "Après une session extraordinaire, l'Union soviétique a annoncé le transfert de la RSS du Kazakhstan occidental à la RSS de Russie. Il s'agit d'une étape majeure dans la récente initiative soviétique visant à réorganiser l'Asie centrale. Les changements territoriaux et les transferts de population font partie d'un effort concerté visant à rendre les Républiques socialistes soviétiques plus homogènes sur le plan ethnique et à réduire la perspective de futurs conflits ethniques ou culturels dans ces régions. Le territoire cédé est constitué d'une importante population à majorité russe et s'inscrit dans le cadre de cette politique. Bien que la décision soit largement saluée par la presse soviétique étroitement contrôlée, cette décision entraînera probablement des perturbations dans la région et parmi les populations directement concernées."
 Swf_Later_Stalin.10.d:0 "Depuis le début de la Seconde Guerre mondiale, l'Union soviétique a déporté un grand nombre d'Allemands vers la RSS kazakhe. Lorsque la guerre éclata, la population allemande de la Volga fut rapidement expulsée de peur de rejoindre les envahisseurs allemands. Lors d'un récent soulèvement antisoviétique en Allemagne de l'Est, des Allemands soupçonnés d'être impliqués dans les manifestations ont également été arrêtés et expulsés. Avec une population nombreuse et concentrée d'Allemands soviétiques et d'Allemands de l'Est, l'État a décidé de créer une nouvelle République socialiste soviétique allemande. Les terres de la RSS du Kazakhstan occupées par ces déportés allemands sont cédées à la nouvelle entité. Cette décision reflète les efforts récents des Soviétiques pour réorganiser l'Asie centrale soviétique et garantir que les Républiques socialistes soviétiques soient ethniquement homogènes."
 Swf_Later_Stalin.11.d:0 "L'Union soviétique, dans le cadre de ses efforts visant à réorganiser l'Asie centrale soviétique et à restaurer l'homogénéité de ses républiques socialistes soviétiques, a annoncé la création d'une République socialiste soviétique de Corée. Les terres de la nouvelle entité sont prises sur le territoire extrême-oriental de la RSS kazakhe. La population sera composée des communautés coréennes existantes dans la région, des Coréens sakhailiens et du grand nombre de réfugiés coréens communistes qui ont fui la Corée après la guerre de Corée. Les Soviétiques espèrent que sa politique réduira les risques de conflits ethniques ou culturels dans la région."
 Swf_Later_Stalin.12.d:0 "L'Union soviétique a récemment annoncé une politique de réorganisation des républiques socialistes soviétiques d'Asie centrale afin de réduire les risques de conflits ethniques ou culturels et de garantir que les nationalités soient représentées par leurs propres gouvernements. Dans le cadre de cet effort, la République socialiste soviétique autonome du Karakalpak a été cédée à la RSS du Kazakhstan. Cela renvoie une importante population kazakhe à la RSS kazakhe. Cela est également considéré comme un moyen de maintenir la pertinence de la RSS kazakhe, car une grande partie de son territoire a été transférée aux républiques socialistes soviétiques existantes ou nouvelles. Les changements territoriaux dramatiques et les échanges de population ont complètement bouleversé la région, et de nombreux citoyens soviétiques des régions se demandent sans doute ce que l'avenir leur réserve désormais."
 Swf_Later_Stalin.13.d:0 "Des rapports en provenance de l'Union soviétique indiquent qu'une déportation massive est en cours en RSS d'Azerbaïdjan. La population arménienne du Haut-Karabagh et du Nakhitchevan est expulsée de la région. Les responsables soviétiques ne font aucun commentaire sur la question, mais il semble qu'il s'agisse d'une mesure destinée à calmer d'éventuels troubles dans la région. Les analystes notent que les expulsions étaient probablement planifiées et directement approuvées par les plus hauts niveaux de l'Union soviétique. Historiquement, la région a connu des incidents continus de violence entre les populations arméniennes et azéries vivant côte à côte depuis des générations. Déplacer les Arméniens pourrait être une tentative d'apaiser les tensions et de rendre l'Azerbaïdjan plus homogène."
 Swf_Later_Stalin.14.d:0 "Dans l'un des plus grands bouleversements observés dans le Caucase depuis les années 1920, les régions du Haut-Karabakh et du Nakhitchevan ont été transférées de la RSS d'Azerbaïdjan à la RSS d'Arménie. Les Soviétiques espèrent probablement que cette décision permettra de rationaliser l'administration dans la région et d'éviter la possibilité d'un futur conflit entre les villages arméniens et azéris. Ces régions possèdent des villages arméniens et azéris, mais à majorité arménienne. Les experts estiment que ce changement majeur n'aurait pu se produire qu'avec l'approbation du dirigeant soviétique Joseph Staline."
 Swf_Later_Stalin.15.d:0 "Dans l'un des plus grands bouleversements observés dans le Caucase depuis les années 1920, les régions du Haut-Karabakh ont été transférées de la RSS d'Azerbaïdjan à la RSS d'Arménie. Les Soviétiques espèrent probablement que cette décision permettra de rationaliser l'administration dans la région et d'éviter la possibilité d'un futur conflit entre les villages arméniens et azéris. Ces régions possèdent des villages arméniens et azéris, mais à majorité arménienne. Les experts estiment que ce changement majeur n'aurait pu se produire qu'avec l'approbation du dirigeant soviétique Joseph Staline."
 Swf_Later_Stalin.16.d:0 "Des rapports en provenance de l'Union soviétique indiquent qu'une déportation massive est en cours dans le Caucase. La population azérie du Haut-Karabagh et du Nakhitchevan est en train d'être expulsée de la région. Les responsables soviétiques ne font aucun commentaire sur la question, mais il semble qu'il s'agisse d'une mesure destinée à calmer les troubles potentiels dans la région, alors que les régions seront finalement intégrées à l'Arménie. Les analystes notent que les expulsions étaient probablement planifiées et directement approuvées par les plus hauts niveaux de l'Union soviétique. Historiquement, la région a connu des incidents continus de violence entre les populations arméniennes et azéries vivant côte à côte depuis des générations. Le déplacement des Azéris pourrait être la dernière étape vers l'établissement forcé de l'harmonie."
 Swf_Later_Stalin.17.d:0 "Des rapports en provenance de l'Union soviétique indiquent qu'une déportation massive est en cours dans le Caucase. La population azérie du Haut-Karabakh est en train d'être expulsée de la région. Les responsables soviétiques ne font aucun commentaire sur la question, mais il semble qu'il s'agisse d'une mesure destinée à calmer les troubles potentiels dans la région, alors que les régions seront finalement intégrées à l'Arménie. Les analystes notent que les expulsions étaient probablement planifiées et directement approuvées par les plus hauts niveaux de l'Union soviétique. Historiquement, la région a connu des incidents continus de violence entre les populations arméniennes et azéries vivant côte à côte depuis des générations. Le déplacement des Azéris pourrait être la dernière étape vers l'établissement forcé de l'harmonie."

 SOV_October_Revolution.2.d:0 "L'Union soviétique triomphe alors que le peuple du premier État ouvrier au monde célèbre l'anniversaire de la Grande Révolution socialiste d'Octobre. Ce jour a changé à jamais le cours de l'histoire. En cette occasion sacrée, les bannières de Lénine et de la Révolution s'élèvent haut sur la Place Rouge, alors que des millions de personnes défilent dans une unité incassable, honorant la lutte héroïque qui a libéré le prolétariat des chaînes de la tyrannie.\n\nDe la prise du Palais d'Hiver à la construction d'un puissant État socialiste, le chemin du peuple soviétique a été fait de courage, de sacrifices et d'une détermination inébranlable. Les ennemis de la Révolution, depuis les oppresseurs tsaristes jusqu'aux envahisseurs impérialistes, ont cherché à briser la volonté des ouvriers et des paysans, mais ils ont échoué. Le peuple soviétique est resté ferme, sa détermination forgée dans les feux de la guerre civile, tempérée dans la lutte contre le fascisme et renforcée dans la marche incessante vers le communisme.\n\nLes puissantes usines de l'Union rugissaient du chant du travail, et chaque marteau frappait un hommage aux ouvriers qui avaient pris le pouvoir en 1917. L'Armée rouge, héritière de ceux qui ont autrefois défendu la Révolution les fusils à la main, marche en rangs disciplinés, un bouclier contre tous ceux qui osent menacer la patrie soviétique. Dans les champs, dans les usines, dans les salles de la science et de la culture, le peuple soviétique accomplit son devoir historique en construisant un avenir où la justice et l'égalité règnent en maîtres.\n\nL'esprit d'octobre est éternel. C'est la lumière qui guide tous les peuples aspirant à la libération, l'appel à lutter contre l'ordre décadent de l'exploitation et de l'avidité. Les ennemis du socialisme tremblent, car ils connaissent la vérité : la Révolution n'est pas morte avec Lénine ; elle perdure dans le coeur de millions de personnes, imparable, incassable, destinée à la victoire finale.\n\nVive la Grande Révolution Socialiste d'Octobre ! Vive l'Union Soviétique ! Vivement la victoire du communisme !"
 SOV_October_Revolution.1.d:0 "L'Union soviétique triomphe alors que le peuple du premier État ouvrier au monde célèbre l'anniversaire de la Grande Révolution socialiste d'Octobre. Ce jour a changé à jamais le cours de l'histoire. En cette occasion sacrée, les bannières de Lénine et de la Révolution s'élèvent haut sur la Place Rouge, alors que des millions de personnes défilent dans une unité incassable, honorant la lutte héroïque qui a libéré le prolétariat des chaînes de la tyrannie.\n\nDe la prise du Palais d'Hiver à la construction d'un puissant État socialiste, le chemin du peuple soviétique a été fait de courage, de sacrifices et d'une détermination inébranlable. Les ennemis de la Révolution, depuis les oppresseurs tsaristes jusqu'aux envahisseurs impérialistes, ont cherché à briser la volonté des ouvriers et des paysans, mais ils ont échoué. Le peuple soviétique est resté ferme, sa détermination forgée dans les feux de la guerre civile, tempérée dans la lutte contre le fascisme et renforcée dans la marche incessante vers le communisme.\n\nLes puissantes usines de l'Union rugissaient du chant du travail, et chaque marteau frappait un hommage aux ouvriers qui avaient pris le pouvoir en 1917. L'Armée rouge, héritière de ceux qui ont autrefois défendu la Révolution les fusils à la main, marche en rangs disciplinés, un bouclier contre tous ceux qui osent menacer la patrie soviétique. Dans les champs, dans les usines, dans les salles de la science et de la culture, le peuple soviétique accomplit son devoir historique en construisant un avenir où la justice et l'égalité règnent en maîtres.\n\nL'esprit d'octobre est éternel. C'est la lumière qui guide tous les peuples aspirant à la libération, l'appel à lutter contre l'ordre décadent de l'exploitation et de l'avidité. Les ennemis du socialisme tremblent, car ils connaissent la vérité : la Révolution n'est pas morte avec Lénine ; elle perdure dans le coeur de millions de personnes, imparable, incassable, destinée à la victoire finale.\n\nVive la Grande Révolution Socialiste d'Octobre ! Vive l'Union Soviétique ! Vivement la victoire du communisme !"

 #Country Events
 Brezhnev_Pol.10.d:0 "Nikita Khrouchtchev, malgré ses affirmations contraires, a gouverné en dictateur et a mis les dirigeants du parti sur la touche. Léonid Brejnev et le Politburo ont dénoncé ces pratiques comme arriérées et contraires à l'esprit du marxiste-léninisme. Brejnev est allé jusqu'à citer Lénine comme quelqu'un qui a toujours fait l'éloge du leadership collectif. Il serait naturel de revenir à de telles pratiques. Lors d'une récente réunion du Politburo, le rétablissement du leadership collectif a été annoncé comme un moyen d'empêcher la concentration du pouvoir entre les mains d'une seule personne. Le gouvernement salue publiquement cette décision comme une restauration de la pratique marxiste-léniniste. Les hauts membres du parti se verront bientôt confier des responsabilités importantes et Brejnev gouvernera par la consultation et le consensus."
 Brezhnev_Pol.2.d:0 "Après la destitution de Khrouchtchev, les nouveaux dirigeants soviétiques ont poursuivi leur politique visant à se distancier de lui et de sa base de pouvoir. Cela a vu le retour de la vieille garde au sein du Parti communiste. Sous Khrouchtchev, ces hommes avaient longtemps été mis à l'écart ou placés à des postes bas pour les éloigner des postes de pouvoir. Cependant, avec Brejnev aux commandes et ayant besoin de sa propre base de soutien, ces hommes retournent au Politburo et à d'autres postes élevés. Les médias soviétiques saluent ce changement et soulignent le rôle historique joué par nombre de ces hommes au début de l'État soviétique et pendant la Seconde Guerre mondiale."
 Brezhnev_Pol.3.d:0 "Le Premier ministre soviétique Leonid Brejnev a récemment lancé un effort visant à rationaliser la direction et à renforcer la prise de décision en restructurant la hiérarchie du parti dans une structure plus verticale. Auparavant, les hauts responsables du parti rendaient compte directement au chef, les réunions étaient programmées en raison de relations personnelles et non d'urgence. Souvent, les dirigeants s'occupaient de questions insignifiantes et négligeaient les questions majeures ou urgentes. Brejnev affirme que cela a empêché le gouvernement de gérer efficacement les problèmes majeurs. Avoir une structure verticale permettra à l'information d'être canalisée plus efficacement et évitera aux hauts dirigeants de s'enliser dans des problèmes mineurs. Ces problèmes mineurs seront traités au fur et à mesure de la progression de la chaîne. De nombreux membres du parti saluent cette approche plus scientifique d'une gouvernance efficace."
 Destalinization.49.d:0 "Le gouvernement soviétique a lancé une importante campagne médiatique pour accuser l'ancien Premier ministre Nikita Khrouchtchev des problèmes systémiques, économiques et sociaux auxquels l'Union soviétique est confrontée. Khrouchtchev est accusé de déléguer une autorité centralisée, contrairement à la doctrine communiste, pour soutenir son pouvoir personnel. Khrouchtchev est également accusé de libéralisation excessive de la société, entraînant des troubles et un effondrement de la discipline de parti. Tous ces problèmes se sont combinés pour créer un État et une économie soviétiques faibles. Le nouveau régime de Léonid Brejnev insiste sur ces erreurs pour expliquer pourquoi le peuple soviétique ne se développe pas comme promis. On espère que blâmer Khrouchtchev donnera au nouveau régime le temps de bâtir sa propre crédibilité."
 Destalinization.50.d:0 "Lorsque Nikita Khrouchtchev était au pouvoir, Léonid Brejnev soutenait largement sa politique de déstalinisation. Il a soutenu la réhabilitation des victimes de la Grande Purge, la critique de la gouvernance arbitraire et une tolérance à l'égard des critiques des classes intellectuelles. Cependant, après son arrivée au pouvoir, Brejnev a amorcé un renversement de cette politique. Le gouvernement a mis en garde contre les critiques du public et plusieurs auteurs ont déjà été menacés d'arrestation. La réhabilitation des victimes des purges staliniennes a également ralenti, voire s'arrêter. Plus important encore, Brejnev a donné aux agences d'État le pouvoir d'utiliser leurs pouvoirs répressifs pour contrôler la population et arrêter les dissidents. Cependant, ce qui est clair, c'est que ce revirement de politique ne marque pas un retour à la violence extrême et aux arrestations massives observées sous Staline."
 Maoism_SU.1.d:0 "Les dirigeants soviétiques sous Léonid Brejnev ont rétabli les lois de censure pour inverser les politiques de libéralisation de l'ancien premier ministre Nikita Khrouchtchev. Ces nouvelles lois ont provoqué la colère de nombreux écrivains soviétiques qui se sentent gênés par le gouvernement. Cependant, la littérature que Khrouchtchev avait lui-même supprimée, comme la littérature maoïste, est désormais à nouveau autorisée. Les critiques maoïstes de Khrouchtchev sont désormais autorisées par le gouvernement soviétique à soutenir ses efforts visant à ramener idéologiquement le parti à ce qu'il considère comme des pratiques marxistes-léninistes appropriées. Le gouvernement soviétique continuera à appliquer strictement la censure contre les pensées dangereuses, mais il continuera également à soutenir les écrits constructifs."
 Sakharov.1.d:0 "L'ancien physicien nucléaire Andrei Sakharov est devenu un critique virulent du gouvernement et de la prolifération nucléaire. Il s'est fait connaître en tant que dissident en brisant les normes en s'opposant ouvertement à l'élection d'un scientifique impliqué dans les purges staliniennes à l'Académie soviétique des sciences. Il a ensuite épousé un autre dissident et défenseur des droits de l'homme. Son travail constitue une menace majeure à l'harmonie sociale au sein de l'Union soviétique et nuit à notre image nationale. Pour s'occuper de Sakharov, les agences de sécurité enquêtent sur sa vie personnelle tandis que les médias sont régulièrement invités à critiquer et à dénoncer activement Sakharov. Le gouvernement soviétique encourage également les membres de l'Académie des sciences à se joindre à cette campagne de critique massive visant à discréditer Sakharov."
 Sakharov_HRC.1.d:0 "Andrei Sakharov et d'autres intellectuels soviétiques ont formé le Comité des droits de l'homme en URSS, premier organisme indépendant de défense des droits de l'homme opérant en Union soviétique. Le comité publie régulièrement des rapports sur les droits de l'homme et des appels aux dissidents soviétiques accusés. Les agences de sécurité soviétiques surveillent de près le groupe, mais il a récemment été décidé que le gouvernement soviétique tiendrait des pourparlers avec Sakharov. Le gouvernement soviétique a profité des négociations pour affirmer qu'il prenait les droits de l'homme au sérieux et qu'il prendrait en compte les préoccupations du groupe. Beaucoup pensent que ces pourparlers sont une campagne de relations publiques visant à montrer que le gouvernement Brejnev n'allait pas s'engager dans le type de répression observée au début de l'État soviétique. Cependant, il ressort clairement des négociations que le gouvernement affirme qu'il ne fera probablement aucun compromis sur ses efforts visant à maintenir le contrôle social sur les membres du parti et sur la population."
 Brezhnev_Ethniciy.1.d:0 "Les différentes républiques soviétiques ont continuellement mis en oeuvre des lois et des politiques conçues pour leurs propres groupes ethniques. Le système soviétique universel dans toutes les républiques s'est considérablement érodé sous Nikita Khrouchtchev qui promouvait le particularisme et permettait aux républiques de se gouverner elles-mêmes tant qu'elles restaient loyales à l'Union soviétique. Pour Léonid Brejnev et les hauts responsables du parti, cela représente un problème majeur. Si ces républiques continuent de fonctionner de manière largement indépendante, ce n'est qu'une question de temps avant qu'elles commencent à adopter un nationalisme ethnique, ce qui représente une menace majeure pour l'unité soviétique. Le gouvernement envisage des réformes susceptibles d'enrayer le cancer du particularisme et de renforcer l'unité de l'Union soviétique."
 Brezhnev_Ethniciy.3.d:0 "Certaines républiques socialistes de l'Union soviétique ont permis à des peuples arriérés de conserver leurs formes traditionnelles de gouvernance, souvent des gouvernements tribaux. Autoriser ces formes uniques de gouvernance est une caractéristique commune du particularisme et le principal obstacle à l'établissement d'un système de gouvernance soviétique singulier et unifié. Pour lutter contre cela, la direction centrale soviétique de Moscou a ordonné aux républiques socialistes concernées d'entamer le processus d'abolition de ces gouvernements tribaux. Cela n'est pas dans l'intérêt des peuples gouvernés par ces pratiques archaïques et arriérées et leur suppression accélérerait le développement d'une conscience socialiste parmi ces gens."
 Brezhnev_Ethniciy.2.d:0 "Lioned Brejnev et les hauts dirigeants du parti ont identifié le particularisme parmi les républiques socialistes soviétiques comme la principale menace pour la prospérité future, le développement socialiste et l'unité de l'État soviétique. Pour lutter contre cette menace dangereuse, le gouvernement soviétique a annoncé qu'il commencerait à nommer des Russes pour prendre la direction des différentes républiques socialistes. Le gouvernement affirme qu'il ne s'agit pas d'une tentative de promouvoir les Russes par rapport à tout autre groupe national, mais de refléter le fait que la Russie est l'État socialiste le plus développé de l'Union. Il est donc tout à fait naturel que les Russes soient les dirigeants idéaux pour aider les autres républiques à développer leur propre socialisme, entravé depuis des années par le particularisme promu par leurs nationalités locales."
 11th_5ypfood.0.d:0 "Au sein de la haute direction soviétique, deux candidats, Nikolaï Tikhonov et Mikhaïl Gorbatchev, sont considérés pour la responsabilité de l'élaboration de la politique agricole. La production agricole a été décevante ces dernières années et il faut remédier à ce problème. Nikolai Tikhonov est un membre clé de la vieille garde du parti et, tout au long de sa carrière, il a servi avec compétence en tant qu'administrateur, principalement dans l'industrie et la métallurgie. La politique agricole qu'il propose cherchera probablement à ajuster ou à réformer les méthodes et politiques actuelles. Tikhonov comprend que l'agriculture a sous-performé, mais que des changements extrêmes risquent de perturber davantage la production. Mikhaïl Gorbatchev offre une perspective plus jeune et il a gravi les échelons du parti après la Seconde Guerre mondiale. Il estime que la production agricole en URSS est en crise et que des réformes systématiques seront nécessaires pour accroître la production. Selon lui, sans réformes drastiques, la situation ne fera que se détériorer davantage. Le Parti doit décider s'il doit s'en tenir au fiable Tikhonov ou faire confiance au jeune et enthousiaste réformateur Gorbatchev."
 sov_comp_purchase.0.d:0 "L'ambassade soviétique a contacté le Département d'État et a demandé l'autorisation de contacter une grande entreprise américaine afin d'acheter une technologie destinée à améliorer la vie quotidienne des citoyens soviétiques. Le gouvernement soviétique insiste sur le fait que le transfert de technologie ne gênerait pas les États-Unis et renforcerait la confiance et la coopération entre nous. Certains membres du cabinet soutiennent que nous devrions laisser les Soviétiques acheter la technologie, car cela aiderait notre économie, n'affaiblirait pas l'équilibre des pouvoirs, améliorerait les relations et pourrait peut-être aider nos agences de renseignement à collecter des informations. D'autres membres du cabinet veulent rejeter la demande soviétique, affirmant que cela n'a aucun sens de céder une quelconque technologie à une puissance ouvertement hostile et que céder serait un revers international et stratégique."
 sov_comp_purchase.1.d:0 "Le gouvernement américain nous a notifié son autorisation de leur acheter de la technologie. L'ambassade contacte déjà certaines entreprises et sociétés pour discuter des prix et des options. Cette décision montre la volonté et peut-être le désespoir des Américains à entretenir des relations positives avec nous. En apprenant la nouvelle, certains membres du Politburo ont déclaré que les transferts de technologie nous permettraient de faire progresser le pays et, à terme, de devancer les Américains. D'autres cependant ont mis en garde contre une telle analyse et ont déclaré que de tels transferts et interactions positives avec les Américains pourraient peut-être permettre une nouvelle ère de coopération et de développement pacifique pour le peuple soviétique."
 sov_comp_purchase.2.d:0 "Le gouvernement américain nous a informés que nous n'aurions pas la permission d'acheter de la technologie pour son pays. Cela porte un coup dur à nos efforts de modernisation de l'économie. Nous avons immédiatement fait savoir aux Américains que leur décision mettait en danger les relations bilatérales et leur avons fait part de leurs desseins néfastes contre l'Union soviétique. Au sein du Politburo, le consensus était que les Américains manquaient de désir de paix et que l'Union soviétique devait rester vigilante et engagée dans la défense du marxiste-léninisme. Il a également été décidé de publier une déclaration faisant l'éloge de la science soviétique et encourageant les chercheurs à poursuivre leurs excellents services rendus à l'État."
 sov_ibm_purchase.0.d:0 "L'ambassade soviétique a informé le Département d'État de son désir d'acheter des systèmes informatiques IBM afin de construire un système de réservation pour les prochains Jeux olympiques de Moscou. Les ordinateurs seraient destinés à l'agence de tourisme soviétique Intourist. Les Soviétiques ont déclaré qu'IBM serait disposé à fournir de tels systèmes si le Département d'État l'approuvait. Nous pourrions donner notre approbation; cela mettrait en valeur les efforts de coopération internationale en prévision de ces prochains Jeux olympiques et offrirait une ouverture diplomatique avec les Soviétiques. Cependant, certains responsables du ministère de la Défense préviennent que les Soviétiques pourraient utiliser ces systèmes pour faire progresser leur propre technologie informatique, ce qui menacerait les avancées américaines dans ce domaine. Nous devons décider d'approuver ou non la vente d'ordinateurs IBM."
 sov_ibm_purchase.1.d:0 "Le gouvernement américain a approuvé l'accord que nous avons conclu avec IBM pour nous vendre des systèmes informatiques pour notre système de réservation lors des prochains Jeux olympiques. Notre agence touristique Intourist recevra les ordinateurs et facilitera grandement la planification des visiteurs internationaux, des athlètes et des médias pour assister aux jeux. La décision américaine est un excellent signe de bonne foi et si ces systèmes s'avèrent aussi efficaces qu'on le prétend, elle pourrait inspirer un nouvel intérêt pour l'informatique dans le pays. Certains craignent que les Américains tentent de nous espionner avec ces ordinateurs, mais les chefs de la sécurité ont rejeté ces préoccupations car les systèmes sont destinés à Intourist et non à une agence sensible."
 sov_ibm_purchase.2.d:0 "Notre récente tentative de dialoguer avec les Américains dans un esprit de coopération internationale en vue des prochains Jeux olympiques de Moscou s'est soldée par une déception. Nous avons récemment tenté de faciliter l'achat d'ordinateurs auprès de la société américaine IBM. Ces ordinateurs seraient destinés à Intourist, notre agence de tourisme, et mettraient en place un système de réservation qui faciliterait le voyage des visiteurs du monde entier. En réponse à cette simple demande, le gouvernement américain a annulé l'accord, démontrant ainsi que son belligérance et son hostilité n'ont pas de fin. L'échec de l'acquisition des systèmes entravera les efforts de préparation, mais le peuple soviétique ne manquera pas à ses responsabilités et n'oubliera pas ce dernier affront des Américains."
 encourage_scientific_competition:0 "Compétition scientifique encouragée"
 equal_pay_act:0 "Augmentation des salaires"
 sov_sell_tech.0.d:0 "Une délégation de haut niveau est récemment arrivée de Moscou. Au cours des discussions, un haut responsable soviétique a proposé que nous leur achetions de la technologie. Ils ont noté que l'Union soviétique possédait la plus grande infrastructure scientifique du monde socialiste et que de telles technologies pourraient grandement profiter à notre nation. Il est évident que la délégation attend de nous une réponse définitive à sa proposition. Si nous achetons la technologie, cela nuira certes à nos réserves financières, mais cela renforcerait le lien entre nos deux États. De plus, une telle technologie pourrait s'avérer bénéfique pour nous. Si nous rejetons la proposition soviétique, la délégation exprimera certainement sa déception et Moscou pourrait devenir furieuse. Cependant, un bref déclin de nos relations avec les Soviétiques pourrait être le prix à payer pour notre stabilité financière."
 sov_sell_tech.1.d:0 "Une délégation a été récemment dépêchée à [FROM.GetName] afin de discuter des problèmes communs auxquels nous sommes tous deux confrontés et de leur proposer de leur vendre de la technologie. Vendre cette technologie à d'autres États socialistes renforcera le monde socialiste et contribuera à financer les nombreux scientifiques et laboratoires soviétiques qui font progresser la technologie en concurrence avec l'Occident. Après avoir reçu la proposition, le gouvernement de [FROM.GetName] a accepté avec enthousiasme. Ils ont exprimé leur désir de faire progresser leur peuple et de le faire grâce aux connaissances acquises dans le monde socialiste. Cette visite réussie renforce sans aucun doute les liens entre l'Union soviétique et le [FROM.GetName]. Des plans sont déjà en cours d'élaboration pour de futures offres de vente de technologies à des États enthousiastes et amis."
 sov_sell_tech.2.d:0 "Une délégation a été récemment dépêchée à [FROM.GetName] afin de discuter des problèmes communs auxquels nous sommes tous deux confrontés et de leur proposer de leur vendre de la technologie. Vendre cette technologie à d'autres États socialistes renforcera le monde socialiste et contribuera à financer les nombreux scientifiques et laboratoires soviétiques qui font progresser la technologie en concurrence avec l'Occident. Après avoir reçu la proposition, le gouvernement [FROM.GetName] a stupéfié nos diplomates en refusant. Ils ne l'ont pas fait de manière brusque ou brutale, mais ont noté que des contraintes financières entravaient leur capacité à acheter la technologie. Bien sûr, il s'agit probablement d'un mensonge. Une fois la délégation de retour, nous déclasserons temporairement le personnel de l'ambassade et ses services consulaires pour montrer notre mécontentement."
 
 #Country Events
 ABMT.1.d:0 "Le Premier ministre Leonid Brejnev et les hauts responsables du parti nous ont proposé un traité sur les missiles antibalistiques. Le traité proposé limiterait le déploiement de telles armes aux seuls sites ICBM et à la capitale. Des systèmes de missiles antibalistiques (ABM) sont développés par nos deux pays pour réduire les ravages d'un échange nucléaire généralisé. Il est toutefois clair que de tels projets coûtent très cher et risquent de déclencher une nouvelle course aux armements. Même si nous pensons que nos progrès technologiques nous donneront un avantage à terme, certains de nos théoriciens suggèrent qu'un tel scénario pourrait inciter les Soviétiques à frapper les premiers. La proposition semble valable dans la mesure où nos experts militaires affirment qu'à l'heure actuelle, l'ABM n'est pas réalisable pour empêcher l'anéantissement nucléaire. Accepter la proposition améliorerait également les relations avec les Soviétiques. Cependant, certains conseillers supérieurs estiment que la proposition soviétique suggère leur faiblesse dans la recherche ABM et que nous devrions donc rejeter la proposition et poursuivre la nôtre."
 SALT_II.1.d:0 "L'Union soviétique propose une nouvelle série de pourparlers sur la limitation des armements stratégiques pour les deux nations. Ce nouveau traité appellerait en fait à la réduction des stocks nucléaires jusqu'à un plafond spécifique. Le traité limitera également le développement de nouveaux traités, même si les programmes de développement actuels dans les deux pays en seront exemptés, cela signifie que les programmes futurs seront limités. Le traité proposé ne limite pas considérablement les stocks et les deux nations conserveront la parité stratégique, mais il mettrait un terme à la course aux armements nucléaires et au stockage de ces armes. Étant donné que le traité ne modifie pas radicalement l'équilibre des pouvoirs, sa signature est logique, nous permet de financer des programmes plus urgents et constituerait un moment idéal pour obtenir un soutien international. Malgré cela, certains hauts responsables du Pentagone nous exhortent à ne pas signer le traité et à nous concentrer plutôt sur le développement de systèmes plus avancés, ce qui fera pencher la balance stratégique en notre faveur."
 ROM_NORMALIZATION.1.d:0 "Pendant des années, le parti communiste roumain dirigé par Nicolae Ceausescu s'est écarté de la ligne marxiste-léniniste en termes de développement économique, de droits individuels et de politique étrangère. La Roumanie a parfois rompu avec la ligne soviétique sur les questions internationales et a lentement retiré la Roumanie du commandement militaire du Pacte de Varsovie, au grand désarroi des responsables soviétiques. Pour le régime soviétique de Léonid Brejnev, cela est inacceptable et constitue une violation de sa doctrine Brejnev. Lors d'une récente réunion du Pacte de Varsovie, le gouvernement soviétique a proposé aux Roumains une normalisation des relations s'ils acceptaient de purger leur parti des déviateurs et de ramener le pays sur la voie du marxiste-léninisme. Le gouvernement soviétique a noté que le socialisme roumain était menacé par les forces internes et que s'il ne se corrigeait pas, Moscou n'hésiterait pas à aider le peuple. Le gouvernement roumain doit maintenant décider comment il réagira à ce défi."
 ROM_NORMALIZATION.2.d:0 "L'Union Soviétique a été heureuse d'apprendre récemment que lors d'une réunion extraordinaire du Parti communiste roumain, elle avait décidé de destituer Nicolae Ceausescu et de ramener la Roumanie à l'imitation du modèle soviétique. Ceausescu et ses alliés ont résisté avec véhémence, mais ils ont été déjoués lors de la réunion. Les membres du parti pro-Moscou se sont alliés aux opposants de Ceausescu et à d'autres qui craignaient une intervention soviétique pour destituer le dirigeant roumain de longue date. Ceausescu a été accusé de s'écarter du marxiste-léninisme, d'activités contre-révolutionnaires et de corruption. Lui et ses alliés ont été démis de leurs postes élevés au sein du parti et il reste à voir s'ils seront finalement jugés. Ces développements constituent une victoire majeure pour l'Union soviétique et la doctrine Brejnev."
 ROM_NORMALIZATION.3.d:0 "L'Union soviétique de Léonid Brejnev a adopté une nouvelle doctrine selon laquelle Moscou se réserve le droit de sauver les États socialistes confrontés à des menaces existentielles internes ou externes. Récemment, les Soviétiques ont demandé au Parti communiste roumain de redonner un caractère socialiste à son gouvernement et à sa politique, sous peine d'en subir les conséquences. Malgré quelques efforts des dissidents au sein du Parti communiste roumain, Nicolae Ceausescu, dirigeant de longue date de la Roumanie, a survécu et est désormais plus fermement ancré dans sa position de leader. Une fois rassuré, il accusa les Soviétiques de s'ingérer dans les affaires roumaines et refusa les demandes soviétiques. Le gouvernement roumain a souligné qu'il restait attaché à sa révolution et à son caractère socialiste et a rejeté les affirmations soviétiques contraires, suggérant à l'Union soviétique de restreindre ses propres ambitions."
 SOV_PLO.1.d:0 "L'Union soviétique soutient depuis longtemps les luttes des Arabes contre les impérialistes et leurs fantoches régionaux. En particulier, l'Organisation de libération de la Palestine (OLP) s'est engagée depuis longtemps en faveur de la libération nationale de ses terres saisies par Israël. Afin de faire connaître sa cause et de faire pression sur les Israéliens, l'OLP a lancé plusieurs opérations spectaculaires, que les Israéliens et leurs alliés condamnent comme terroristes. Cependant, le gouvernement soviétique a décidé de qualifier ces actions d'expressions d'un peuple opprimé et de faire pression sur les Israéliens pour qu'ils mettent fin à leur occupation. Soutenir l'OLP améliorera grandement notre image dans le monde arabe et nous aidera à apparaître comme un allié viable et non impérialiste auprès des États et organisations arabes comme l'OLP."
 SOV_Beria_Struggle.1.d:0 "La situation a atteint un stade critique après le décès du camarade Staline. Les membres du Politburo ont déjà appris l'ambition nue de Nikita Khrouchtchev. Lui et ses partisans mènent déjà des machinations pour rassembler des alliés et prendre le pouvoir pour leur faction. En fonction des mesures que nous prendrons dans les prochains jours, nous pourrons peut-être arrêter Khrouchtchev et sa quête égoïste de pouvoir. Grâce à ces actions, nous pouvons agir pour garantir que le fidèle Lavrenti Beria ou le dévoué Georgy Malenkov prennent les rênes du pouvoir et sauvent l'Union soviétique du factionnalisme et de l'ambition personnelle."
 SOV_Beria_Struggle.2.d:0 "Avant son décès malheureux, le camarade Staline avait préparé un plan visant à exclure du parti les traîtres et les membres corrompus. Staline pensait qu'une telle action remonterait le moral du peuple soviétique et garantirait que le parti se souvienne de son dévouement à l'État et à ses responsabilités. La réalisation de ces purges permettrait de renforcer la position de Lavrenti Beria et de Gueorgui Malenkov et entraînerait la destitution d'Anastas Mikoyan. Cela provoquerait également la panique chez des rivaux tels que Nikita Khrouchtchev et Kliment Vorochilov. Cependant, Malenkov note qu'une telle action pourrait aliéner les alliés potentiels et provoquer un conflit avant que lui ou Beria ne soient prêts. La question est maintenant de savoir s'il faut mettre en oeuvre cette purge ou la suspendre jusqu'à ce que la situation devienne plus claire."
 SOV_Beria_Struggle.3.d:0 "Gueorgui Malenkov et Lavrenti Beria cherchent des moyens d'obtenir le soutien des éléments vieux bolcheviks du parti. Si Kilment Vorochilov pouvait être recruté, ils gagneraient un vieux bolchevik et un officier supérieur de l'Armée rouge. Cependant, Vorochilov semble réticent à soutenir l'un ou l'autre de ces hommes. Une option pour le persuader serait de rassembler ou de créer des documents et des témoins qui soulignent les lacunes militaires de Vorochilov pendant la Guerre d'Hiver et la Grande Guerre Patriotique. Nous pourrions alors utiliser cela pour inciter Voroshilov à nous soutenir. Cependant, faire un effort aussi extrême pour forcer un allié comporte des risques et même dans ce cas, Vorochilov peut se révéler peu fiable, mais il serait peut-être préférable de simplement trouver un autre partisan de la ligne dure pour nous soutenir."
 SOV_Beria_Struggle.4.d:0 "Nous avons réussi à rassembler suffisamment de documents et de témoins pour convaincre Kilment Vorochilov que nous possédons les moyens de détruire sa réputation au sein du Parti et de l'Armée rouge. Il est tellement préoccupé par nos informations qu'il a promis son plein soutien à l'avenir. Il est essentiellement devenu notre homme et nous bénéficions désormais du soutien d'un haut gradé de la ligne dure et d'un officier militaire influent."
 SOV_Beria_Struggle.41.d:0 "Le général Joukov semble réticent à s'engager dans la politique, mais nous avons élaboré un plan et une promesse à son égard. En échange de son soutien, nous mettrions en oeuvre une réforme de la dépolitisation de l'armée. Cela réduirait considérablement l'influence et le pouvoir des commissaires politiques de l'Armée rouge. Le général Joukov a longtemps exprimé sa conviction que lors de la dernière guerre, les commissaires se sont souvent immiscés dans l'efficacité militaire et la discipline des forces. Forts de cette promesse, nous espérons que le général Joukov agira enfin et ralliera l'Armée rouge à notre cause."
 SOV_Beria_Struggle.42.d:0 "Les membres du Politburo ont commencé à soutenir et soutenir ouvertement Lazar Kaganovitch pour devenir le nouveau chef du Parti. Kaganovitch, un fervent stalinien, était un conseiller et partenaire bien connu du camarade Staline. Avec sa riche expérience et son dévouement à la Révolution, rares sont ceux qui peuvent argumenter sur la raison pour laquelle Kaganovitch ne devrait pas prendre la tête du parti. Beaucoup se démènent désormais pour trouver une position à proximité de l'Iron Lazar."
 SOV_Beria_Struggle.5.d:0 "Les nouvelles de Berlin sont inquiétantes. Les forces soviétiques locales ont dû utiliser une force lourde, notamment des chars, pour réprimer les manifestations. De nombreux membres du Politburo notent que malgré certaines mesures libérales prises par Lavrenti Beria, cela a conduit à des scènes comme les émeutes de Berlin. Pour évaluer la situation à Berlin et déterminer les mesures à prendre, le camarade Molotov s'est porté volontaire pour se rendre immédiatement à Berlin, calmer la situation, puis renvoyer un rapport à Moscou. Beria doit décider d'approuver ou non le voyage Molotov. Si Beria a sécurisé ou neutralisé les principaux partisans de la ligne dure, un tel voyage ne constituerait pas une menace, mais si les partisans de la ligne dure restent indépendants, Molotov pourrait revenir avec un rapport accablant sur la situation."
 SOV_Beria_Struggle.6.d:0 "Le ministre de la Défense Nikolaï Boulganine constitue une menace puissante à la fois pour Georgi Malenkov et Lavrenti Beria. Pendant la guerre, il a noué des liens étroits avec l'Armée rouge et, en cas de crise, il pouvait apporter un soutien militaire à l'ambitieux Khrouchtchev. Cependant, Beria et ses agents ont recueilli des témoignages accablants sur Boulganine et disposent de suffisamment de preuves pour l'arrêter pour plusieurs chefs d'accusation. Arrêter Boulganine aiderait à la fois Malenkov et Beria, mais Beria bénéficierait particulièrement de cet acte. Choisir de ne pas arrêter Boulganine maintenant est un risque, mais cela en vaut peut-être la peine car un tel acte pourrait avoir des conséquences imprévues."
 SOV_Beria_Struggle.71.d:0 "Après avoir neutralisé Nikolaï Boulganine, Lavrenti Beria jette désormais son dévolu sur Dmitri Shepilov, le rédacteur en chef de la Pravda. Grâce à son influence sur les médias, Shepilov pourrait se rallier à Nikita Khrouchtchev et devenir une menace majeure. En utilisant des agents de confiance, Beria peut faire éliminer Shepilov publiquement. Cela suscitera sans aucun doute la peur chez les adversaires et ouvrira la voie à lui et à ses alliés pour triompher. Cependant, certains officiers proches craignent qu'un tel acte puisse se retourner contre eux et entraîner des conséquences imprévues. La question est maintenant de savoir s'il faut ordonner ou non l'attaque."
 SOV_Beria_Struggle.81.d:0 "Lors d'une étonnante réunion du Politburo, Lavrenti Beria a mené une initiative visant à évincer Nikita Khrouchtchev du poste de Premier ministre de l'Union soviétique. Beria et ses alliés ont réussi à déjouer Khrouchtchev et ses alliés. C'est là le point culminant de la campagne réussie menée par Beria et ses alliés pour empêcher Khrouchtchev, trop ambitieux, de prendre le pouvoir et de saper l'État socialiste tout entier. Le camarade Beria va désormais chercher à consolider son pouvoir sur l'État et le Parti. Bien sûr, Malenkov est toujours co-dirigeant, mais Beria a assuré sa place au duumvirat. Leur leadership apportera forcément des changements tels qu'une politique de détente et une transition vers les biens de consommation."
 SOV_Beria_Struggle.82.d:0 "Lors d'une réunion étonnante du Politburo, Gueorgui Malenkov a dirigé les efforts visant à assumer le poste de Premier ministre de l'Union soviétique. Son rival Nikita Khrouchtchev et ses alliés n'ont pas pu arrêter les actions de Malenkov et de ses partisans. C'est là le point culminant de la campagne réussie menée par Malenkov et ses alliés pour empêcher Khrouchtchev, trop ambitieux, de prendre le pouvoir et de saper l'État socialiste tout entier. Malenkov, longtemps considéré comme le successeur naturel de Staline, va désormais chercher à consolider son emprise sur l'État et le Parti. On peut déjà imaginer que Malenkov va s'orienter fortement vers les biens de consommation, mais il craint pour l'instant que Beria soit devenu trop dangereux."
 SOV_Beria_Struggle.9.d:0 "La carrière et les machinations de Lavrenti Beria ont pris fin après sa condamnation par la Cour suprême de l'Union soviétique. Beria et six accusés ont été abattus peu après avoir reçu leur verdict. L'arrestation de Beria a eu lieu quelques mois plus tôt lors d'une réunion du Présidium. Beria fut condamné par ses collègues et bientôt arrêté par des officiers de l'Armée rouge. Les forces militaires sont rapidement intervenues pour arrêter ses officiers supérieurs et sécuriser son appareil de renseignement afin d'empêcher un coup d'État ou un soulèvement pro-Beria. Finalement, Beria a été reconnu coupable de trahison, de terrorisme et d'activités contre-révolutionnaires. Il a en outre été accusé d'avoir utilisé sa position pour commettre des centaines de viols et d'autres actes déviants. Sa mort ne sera pas pleurée, notamment par ses nombreuses victimes."

 #News Events
 SOV_AFG.1.d:0 "Après le renversement de la monarchie afghane, la situation en Afghanistan est restée incertaine. Malgré le soutien soviétique, le gouvernement du président Daoud n'a pas réussi à initier des réformes et les puissances extérieures ont organisé des groupes militants et des subversions contre le gouvernement. Pendant la révolution Saur, le président Daoud et sa famille ont été exécutés, conduisant à un gouvernement socialiste plus radical. Cependant, malgré le soutien massif des Soviétiques, le nouveau régime connaît des difficultés. Une récente flambée de rébellions, notamment autour d'Herat, a conduit des éléments du gouvernement à demander l'aide soviétique. Depuis la frontière, les troupes et les chars soviétiques avancèrent rapidement tandis que les parachutistes soviétiques sécurisaient les sites clés de Kaboul. Les Soviétiques insistent sur le fait qu'ils ont été invités par le gouvernement PDPA au pouvoir et qu'une fois la stabilité rétablie, ils se retireront. L'invasion fait déjà l'objet d'une condamnation internationale, beaucoup considérant l'intervention soviétique et la répression des rebelles afghans comme une violation flagrante du droit international."
 Brezhnev_POL.1.d:0 "Les forces soviétiques ont traversé la frontière polonaise afin de sécuriser le régime communiste en Pologne et d'écraser le mouvement Solidarité. La solidarité a commencé par une grève dans un chantier naval contre la direction pour avoir licencié arbitrairement un travailleur, mais elle s'est rapidement étendue à davantage de grèves et d'expressions de colère face à une économie en stagnation. Les communistes polonais ont accepté de reconnaître Solidarité comme la première Union indépendante au sein du bloc soviétique, mais le groupe a continué à remettre en question la politique du gouvernement. Le Premier ministre soviétique Léonid Brejnev y a vu une menace pour le communisme en Pologne et, citant la doctrine Brejnev, a autorisé une action militaire pour mettre fin à Solidarité et restaurer la discipline de parti en Pologne. Il est important de noter que l'armée polonaise et les hauts dirigeants communistes seraient mécontents et peu coopératifs avec son allié du Pacte de Varsovie. Les Soviétiques ont apparemment refusé de les laisser résoudre la crise de manière interne et craignent désormais que l'action soviétique ne fasse que renforcer l'attrait populaire de Solidarité."
 SOV_Detente.1.d:0 "Le gouvernement soviétique reconnaît que la persistance des tensions de la Guerre froide a conduit à d'importantes dépenses militaires et à un état d'alerte constant. La situation n'aide pas l'économie et entrave la capacité du gouvernement à subvenir aux besoins de sa population. De plus, le maintien d'une position agressive ne fait qu'amener nos ennemis et leurs alliés à se retrancher plus fermement les uns contre les autres. Pour changer cela, l'Union soviétique avait décidé de se lancer dans une campagne visant à adoucir sa rhétorique internationale, à dialoguer plus ouvertement avec les États-Unis et ses alliés et à tenter de réduire les tensions mondiales. Cela permettra à l'Union soviétique de se concentrer davantage sur son économie, d'améliorer sa position internationale et, en montrant son côté plus doux, elle pourra peut-être convaincre certaines puissances neutres, voire certains alliés américains, de se réaligner. L'Union soviétique cherche à établir une période de détente ou de relaxation avec les États-Unis."
 SOV_VIN.20.d:0 "Dans le cadre d'une nouvelle offensive diplomatique lancée dans les capitales des principaux États impliqués au Vietnam et aux Nations Unies, l'Union soviétique appelle toutes les parties à s'unir dans la paix. Les diplomates soviétiques soulignent que les violences qui durent depuis des décennies doivent bientôt cesser et que le peuple vietnamien a suffisamment souffert. En plus d'appeler l'Amérique à réduire ses opérations de combat, les Soviétiques ont également exhorté le gouvernement sud-vietnamien à faire preuve de retenue. Cependant, contrairement aux précédents appels à la paix, les Soviétiques ont exhorté le Nord-Vietnam à contribuer à l'effort de paix en ralentissant le flux de combattants et à engager des pourparlers de paix avec flexibilité. En privé, certaines sources indiquent que des diplomates soviétiques ont informé Hanoï que l'incapacité de tenter activement de négocier la paix risquerait de entraîner une perte de l'aide soviétique. Les Américains apprécieront sans aucun doute cet effort."
 SOV_Mid_FP.1.d:0 "L'Union soviétique et les États-Unis s'engagent dans des pourparlers sur la limitation des armements stratégiques afin de discuter des moyens de limiter et de contrôler la course aux armements nucléaires. Les deux pays disposent d'immenses capacités de missiles stratégiques, mais le désir de mettre à jour leurs systèmes d'armes et de stocker des ogives nucléaires devient très coûteux pour les deux pays. Jusqu'à présent, il semble que les négociations pourraient aboutir à un accord sur un gel des niveaux actuels de missiles et à limiter le nombre de certains systèmes de lancement. Un tel accord serait bien accueilli au niveau international et nombreux sont ceux qui pensent qu'un tel accord pourrait ouvrir la voie à de futurs pourparlers qui pourraient, à terme, guider le monde vers la dénucléarisation. Cependant, de nombreux experts estiment que ces prévisions sont trop ambitieuses ou lointaines."
 ABMT.2.d:0 "Les États-Unis ont informé l'Union soviétique qu'ils avaient rejeté le projet de Traité sur les missiles anti-balistiques (ABMT). C'est un coup dur pour les efforts soviétiques visant à contrôler les dépenses et une nouvelle course aux armements. Cette décision indique que les Américains envisagent d'étendre leurs recherches ABM et souhaitent trouver un moyen de modifier la parité stratégique actuellement en place. Les chefs militaires soviétiques insistent sur le fait qu'ils mènent leurs propres recherches ABM et qu'ils ne se laisseront pas distancer par les États-Unis. En fait, un officier supérieur a souligné que l'ABM est une entreprise très coûteuse et que même si les Américains progressaient, il ne serait pas difficile pour un adversaire de trouver des moyens de submerger de tels systèmes avec peu d'efforts ou d'argent. Les Américains ont rejeté ces accusations et insistent sur le fait qu'ils ne feront aucun compromis avec les puissances étrangères sur la recherche de technologies susceptibles de sauver des vies américaines."
 ABMT.3.d:0 "Les États-Unis ont informé l'Union soviétique qu'ils avaient accepté le projet de Traité sur les missiles anti-balistiques (ABMT). Il s'agit d'un grand triomphe pour les diplomates des deux pays. Le risque d'une course aux armements ABM est désormais évité et les départements militaires des deux pays n'auront pas à consacrer de ressources à de tels projets. La grande crainte au sein du Kremlin était qu'une course aux armements ABM puisse amener les États-Unis à utiliser leurs avantages technologiques pour obtenir un avantage injuste. Un tel scénario aurait été déstabilisateur pour la paix mondiale. En effet, des rapports américains indiquent que l'une des raisons pour lesquelles ils ont accepté le traité est la conviction qu'une percée américaine dans la technologie ABM pourrait inciter l'Union soviétique à frapper la première avant de perdre son avantage. Quel que soit leur raisonnement, les États-Unis et l'Union soviétique sont satisfaits et espèrent que le traité marquera un réchauffement des liens entre les deux nations."
 SALT_II.2.d:0 "Les États-Unis ont rejeté les propositions du dernier traité sur la limitation des armements stratégiques (SALT II). L'accord aurait vu les deux pays limiter pour la première fois leurs arsenaux, limiter le développement de nouvelles technologies de missiles et réduire les plates-formes de lancement. Le rejet par les États-Unis a intrigué certains experts qui notent que même les limitations du traité n'affaiblissent guère la capacité de l'un ou l'autre État à détruire l'autre. On dit que les Soviétiques sont furieux et traitent les États-Unis de fauteurs de guerre. Cependant, un diplomate américain impliqué dans le processus décisionnel a noté que la décision avait beaucoup à voir avec un schéma d'actions subversives récemment découvert par les Soviétiques, indiquant qu'ils manquaient de sincérité en termes de véritable réduction du risque de guerre nucléaire mondiale."
 SALT_II.3.d:0 "Les États-Unis ont accepté les propositions du dernier traité sur la limitation des armements stratégiques (SALT II). L'accord verra les deux pays limiter pour la première fois leurs arsenaux, limiter le développement de nouvelles technologies de missiles et réduire les plates-formes de lancement. Les experts notent que l'accord n'érode guère la capacité des deux parties à frapper l'autre, mais il marque un effort pour mettre un terme au stockage d'armes nucléaires et au développement de nouveaux systèmes de lancement. L'accord est salué dans les deux pays comme un pas dans la bonne direction et on espère qu'il conduira à un réchauffement des liens. Beaucoup espèrent que de tels pourparlers se poursuivront dans les années à venir et aboutiront éventuellement au désarmement nucléaire. Les deux pays se disent satisfaits de l'accord et de ses implications."
 Sov_FP.125.d:0 "L'Union soviétique a récemment réorienté sa politique étrangère vers l'Europe occidentale. Il a complètement adouci son ton. Au lieu de l'hostilité ou de l'isolement, elle a engagé ces États dans des échanges amicaux qui ont facilité le développement des liens commerciaux, culturels et politiques. Alors que les relations s'améliorent et que de nombreuses personnes en Europe occidentale sont désormais optimistes quant à un avenir de coexistence pacifique, les Soviétiques estiment que le moment est venu de demander à ces États de mettre fin à leur refus, après la Seconde Guerre mondiale, de reconnaître les frontières établies dans le bloc de l'Est. Plus précisément, ils s'opposent depuis longtemps aux frontières est-allemandes et polonaises. Les Soviétiques diront à l'Europe occidentale que cela entretient des tensions élevées et que s'ils reconnaissent ces frontières, cela mettra fin à une pierre d'achoppement majeure à la paix européenne. Si les Soviétiques parviennent à un accord sur les frontières, cela rehaussera également leur position parmi leurs alliés du Pacte de Varsovie."
 Brezhnev.1.d:0 "Pour Leonid Brejnev et ses principaux partenaires du gouvernement soviétique, l'une des plus grandes erreurs du gouvernement précédent a été sa tolérance au socialisme multiple. Cela a amené de nombreux États communistes à s'écarter de la pratique marxiste-léniniste acceptée et à s'éloigner du modèle soviétique. En outre, des forces extérieures financées par les intérêts capitalistes tentent souvent de renverser les régimes pour faciliter un virage vers le capitalisme. Pour lutter contre cela, Brejnev a annoncé une nouvelle doctrine appelée la Doctrine Brejnev. L'Union soviétique a le droit d'intervenir militairement dans tout État socialiste ou communiste confronté à des menaces internes ou externes pour préserver la société socialiste. La souveraineté nationale ne remplace pas les intérêts du socialisme mondial et l'Union soviétique agira si nécessaire. La nouvelle doctrine marque un fléchissement de la force soviétique. Le caractère vague du langage signifie que ce n'est que lorsqu'il sera mis en pratique que les alliés et les ennemis soviétiques commenceront à comprendre les limites et les pratiques de la doctrine."
 ROM_NORMALIZATION.4.d:0 "Le rejet catégorique de la doctrine Brejnev par la Roumanie a conduit à une réunion d'urgence du Pacte de Varsovie. Après consultations, le Premier ministre soviétique Léonid Brejnev a annoncé que, pour la préservation du socialisme en Roumanie, le Pacte de Varsovie lancerait des opérations militaires en Roumanie. Il a appelé les forces militaires roumaines à se retirer et le peuple à se mobiliser et à aider ses frères socialistes à libérer leur pays de la tyrannie de Nicolae Ceausescu. Le gouvernement roumain n'a pas réagi immédiatement. Cependant, plusieurs États européens indignés ont déjà déclaré qu'ils avaient l'intention de porter l'invasion devant les Nations Unies. L'action soviétique confirme son adhésion à la doctrine Brejnev qui promet une action militaire pour soutenir tout État socialiste confronté à des forces internes ou externes menaçant son existence."
 ROM_NORMALIZATION.5.d:0 " Le rejet catégorique de la doctrine Brejnev par la Roumanie a conduit à une réunion d'urgence du Pacte de Varsovie. Après consultations, le Premier ministre soviétique Léonid Brejnev a annoncé que l'Union soviétique et ses alliés poursuivraient leurs pressions diplomatiques sur la Roumanie et continueraient d'exhorter la Roumanie à adopter de bonnes pratiques marxistes-léninistes. Cette annonce a atténué les tensions régionales et les craintes d'une invasion soviétique imminente et de nombreux analystes estiment que la décision soviétique de ne pas recourir à la force militaire montre que la doctrine Brejnev a ses limites. On ne sait pas si les Soviétiques ont décidé de ne pas agir dans leur propre intérêt ou si les dirigeants soviétiques craignaient qu'une action militaire contre la Roumanie risque la défection d'autres alliés du Pacte de Varsovie qui pourraient ne pas souhaiter participer à une telle opération. Quoi qu'il en soit, l'ensemble de l'incident indique une limite au pouvoir et à l'influence soviétiques, ce que certains interprètent comme la preuve que les Soviétiques perdent le contrôle du Pacte de Varsovie et du communisme mondial."
 SOV_Kashmir.1.d:0 "\nL'Union soviétique reconnaît que l'Inde et le Pakistan ont tous deux été victimes de l'exploitation capitaliste et de l'impérialisme sous le régime colonial. Pour aider les deux pays, ils ont récemment proposé de tenir des pourparlers avec les dirigeants indiens et pakistanais sur la région contestée du Cachemire. Les deux pays ont réagi positivement à cette idée. Lorsque des pourparlers ont lieu, il y a très peu de chances d'aboutir à une véritable avancée, mais leur accord d'accepter la médiation soviétique montre la puissance diplomatique croissante de l'Union soviétique. Les Soviétiques ont également ajouté dans leur déclaration qu'ils n'avaient d'autre programme que la paix et qu'ils espéraient obtenir des informations des deux côtés. Les Soviétiques ont également déclaré qu'ils étaient les amis de tous les peuples de l'Inde et du Pakistan et qu'ils agiraient toujours comme une force mondiale pour le bien."
 SOV_PAL.1.d:0 "\nL'Union soviétique a annoncé qu'elle soutenait pleinement la solution à deux États comme cadre de paix au Moyen-Orient. Le gouvernement soviétique a déclaré que toute autre solution serait injuste et conduirait à un conflit sans fin. Les Soviétiques ont ajouté qu'une telle solution devrait conduire au retour des Palestiniens dans les foyers dont ils avaient été expulsés. Le gouvernement israélien a simplement déclaré qu'il attendait de l'Union soviétique qu'elle respecte sa souveraineté et sa sécurité. Un porte-parole palestinien a déclaré qu'il appréciait tout État reconnaissant le droit des Palestiniens au retour chez eux, bien que le porte-parole n'ait pas évoqué l'idée d'un État israélien. La position soviétique est considérée comme un moyen d'exercer une certaine pression sur les Israéliens pour qu'ils se montrent plus flexibles en ce qui concerne les futurs accords de paix."

 #News Events
 Solzhenitsyn.1.d:0 "\nAlexandre Soljenitsyne a récemment reçu le prix Nobel de littérature. L'auteur acclamé est un critique virulent de l'Union soviétique et de son système de gouvernement. Cependant, le gouvernement soviétique de Léonid Brejnev a annoncé qu'il serait interdit à Soljenitsyne de récupérer son prix en raison de ses oeuvres antisoviétiques. Soljenitsyne a servi l'armée soviétique pendant la Seconde Guerre mondiale, mais après la guerre, il a été envoyé dans les goulags pour avoir critiqué Staline dans une lettre. Sous le régime de Nikita Khrouchtchev, Soljenitsyne a été autorisé à publier son autobiographie sur son séjour au goulag, reflétant l'apogée de la libéralisation sous Khrouchtchev. Cependant, son successeur, Léonid Brejnev, a inversé cette libéralisation et a utilisé les agences d'État et les médias pour critiquer Soljenitsyne. Il a également statué par consensus et nombreux sont ceux qui pensent que d'autres membres importants sont à l'origine de la position dure du gouvernement sur cette question. La communauté internationale et les intellectuels du monde entier critiquent Moscou pour sa décision."
 DevSocialism.1.d:0 "Le premier ministre Leonid Brejnev et les hauts responsables du parti parlent tous de l'Union soviétique comme étant parvenue à l'état de socialisme développé. Selon Moscou, la structure économique actuelle et l'orientation de l'État représentent la société socialiste la plus avancée au monde. Tous les autres États communistes doivent s'efforcer d'atteindre ce statut et ne doivent pas s'écarter de cette voie. Dans le monde communiste, cet argument est perçu comme une critique adressée aux autres régimes qui se sont éloignés du modèle économique soviétique ces dernières années. Ces États affirment qu'ils doivent s'écarter pour adapter leur société au socialisme. Cependant, la position de Brejnev indique que l'Union soviétique cherche à pousser toutes ses républiques soviétiques et le monde communiste au sens large à mettre fin aux déviations économiques et à imiter l'Union soviétique en tant que centre du progrès économique communiste mondial."
 Brezhnev_Constitution.1.d:0 "L'Union soviétique a adopté une nouvelle constitution lors de la septième session du Soviet suprême de l'Union soviétique, qui vient de s'achever. Le nouveau document confirme l'Union soviétique comme un État socialiste développé avec un peuple unifié, sans identité nationale ni même par profession. La constitution affirme que le parti représente désormais non seulement les travailleurs et les paysans, mais tous les membres de la société soviétique. Plus important encore, la nouvelle constitution érode l'autonomie des républiques socialistes au sein de l'Union soviétique et exige que chacun se conforme aux lois soviétiques et accepte la suprématie de la souveraineté soviétique. Les citoyens soviétiques bénéficient également de droits fondamentaux garantis, mais avec des limites. Le document confirme bon nombre des idées directrices propagées par le régime au pouvoir de Léonid Brejnev et beaucoup le surnomment déjà la Constitution Brejnev."
 Brezhnev_Pol.100.d:0 "Les récentes mémoires du dirigeant soviétique Léonid Brejnev, concernant ses années de Seconde Guerre mondiale, ont reçu le prestigieux prix Lénine de littérature. Bien que les mémoires soient considérés comme mal écrits et comme une glorification de ses contributions mineures sur le champ de bataille, peu de gens en Union soviétique sont surpris. Brejnev manifeste depuis longtemps une intense passion pour les cérémonies et la réception de récompenses. Il a reçu plus d'une centaine de médailles et on s'attend désormais à ce que les célébrations de son anniversaire incluent l'attribution de nouvelles médailles et de nouveaux grades. Les nombreuses récompenses et promotions qu'il s'octroie font l'objet de plaisanteries dans tout le pays et bien que Brejnev ait apparemment été informé de l'amusement du public face à son obsession pour les récompenses, il l'a ignoré. Pour Brejnev, si les gens plaisantent sur lui, c'est qu'ils l'aiment."

 stalin_dead:0 "Staline est mort"

 SOV_TUR.10.d:0 "\nL'Empire russe et plus tard l'Union soviétique avaient tous deux un intérêt stratégique à assurer le contrôle du détroit turc. La perte du détroit au profit d'une puissance hostile risquait de piéger les navires commerciaux et navals soviétiques dans la mer Noire. En 1936, la Convention de Montreux a décidé que le détroit serait surveillé par la Turquie et que seuls les navires des pays riverains de la mer Noire pourraient l'utiliser. Après la Seconde Guerre mondiale, les Soviétiques ont cité des exemples de transports maritimes de l'Axe en provenance d'Allemagne et d'Italie pendant la guerre comme preuve que la Convention de Montreux devait être réécrite. Ces demandes de concessions concernant les détroits ainsi que les revendications territoriales sur l'est de la Turquie ont transformé le différend en crise internationale. Finalement, la Turquie s'est rangée du côté des États-Unis et le conflit s'est calmé, les Soviétiques acceptant la situation tout en soulignant qu'ils pensaient toujours que la Convention de Montreux devait être réécrite. Peut-être qu'un jour, la Turquie pourra être persuadée de revenir à une politique étrangère neutre ou même de rejoindre l'alliance soviétique."
 TUR_SOV.2.d:0 "Le Parti communiste turc, ainsi que ses sympathisants des principales institutions, ont lancé une prise de contrôle du pays. De nombreux Turcs rejettent le manque de progrès du pays en matière de réformes plus démocratiques et voient la crise autour du détroit de Turquie comme une preuve supplémentaire que la politique de neutralité a conduit la Turquie vers une situation de désastre potentiel. Les communistes ont trouvé un fort soutien dans les zones urbaines de la part des Turcs qui constatent que le gouvernement a ralenti ou n'a pas réussi à mettre en oeuvre la politique de modernisation du fondateur de la république, Mustafa Kemal. Ils souhaitent voir les symboles de la vie réactionnaire, de la religiosité et du conservatisme être beaucoup plus fermement déracinés. Le nouveau régime turc a annoncé son espoir de réaliser la marche de la Turquie vers la société moderne. Les États-Unis seraient stupéfaits par ces développements, tandis que des rumeurs ont émergé selon lesquelles des éléments plus conservateurs, religieux et kémalistes dans les zones rurales pourraient émerger comme résistance au nouveau gouvernement communiste."
 TUR_SOV.3.d:0 "La crise autour du détroit de Turquie a pris une escalade dramatique. Après que le gouvernement turc a refusé de céder aux demandes soviétiques de renégocier la Convention de Montreux de 1936 ou d'abandonner sa souveraineté sur le détroit, l'Union soviétique a lancé une invasion armée de la Turquie. Si le contrôle des détroits constitue un objectif clé, les Soviétiques ont également des revendications territoriales sur l'est de la Turquie. Le gouvernement soviétique a annoncé que ses soldats uniraient les peuples soviétiques avec leurs compatriotes séparés par des frontières créées par l'empire réactionnaire Ottoman et préservées par l'actuel régime turc. Le gouvernement turc a fait appel au soutien international pour répondre à « l'agression nue » des Soviétiques et a déclaré que les Turcs devaient se rallier à cette cause. Le gouvernement turc a cité comment les Turcs ont forgé leur propre destin après la Première Guerre mondiale et a déclaré que le courage de cette époque devait revenir pour que la Turquie triomphe."
 Berlin_Blockade.2.d:0 "L'armée de l'air américaine s'est engagée à maintenir et à maintenir le pont aérien. Même si le pont aérien s'est avéré très stressant, certains changements seront mis en oeuvre pour améliorer l'efficacité. Il a été recommandé au général William Tunner, qui pendant la Seconde Guerre mondiale a réformé le corridor aérien Inde-Chine et doublé le transport aérien sur ce théâtre, d'en prendre le commandement. Les Français se sont également engagés à construire un nouvel aérodrome à Berlin. Des projets sont également en cours de discussion pour fusionner avec les efforts de la Royal Air Force britannique visant à améliorer l'efficacité et la coordination. Tant que le pont aérien continue de fonctionner, on espère que le contre-blocus contre l'Allemagne administrée par les Soviétiques les poussera à cligner des yeux et à céder. Alors que Berlin-Ouest souffre, le contre-blocus a mis à rude épreuve le développement industriel de l'Allemagne de l'Est. Sur le plan politique, les Berlinois devraient continuer à soutenir les efforts de transport aérien. Les citoyens qui ont suivi l'affaire dans les États alliés ont également apporté leur soutien jusqu'à présent et devraient continuer à soutenir cette politique."
 Berlin_Blockade.3.d:0 "\nLes États-Unis ont annoncé qu'ils retireraient le Deutsch Mark de la circulation à Berlin-Ouest. Les États-Unis ont déclaré que leur décision n'était pas due à la pression des Soviétiques mais à leur désir d'aider le peuple berlinois qui souffre depuis longtemps et de ne pas faire de politique. Il y a eu quelques applaudissements parmi les experts et les politiciens occidentaux qui soutiennent les États-Unis pour avoir donné la priorité à la population de Berlin et estiment que le premier pont aérien a atteint son objectif, à savoir démontrer que les menaces soviétiques n'entraveront pas la détermination des Alliés. Cependant, il y a également eu une opposition et une dissidence de la part d'autres coins qui voient la décision américaine comme une capitulation face au chantage communiste. Le gouvernement soviétique a salué le fait que les États-Unis aient « repris leurs esprits », mais n'a pas encore annoncé quand et si le blocus serait levé. Les Berlinois sont optimistes quant à la levée du blocus par les Soviétiques et sont reconnaissants de l'aide apportée jusqu'à présent par les Alliés occidentaux."
 Berlin_Blockade.4.d:0 "Le gouvernement américain a décidé de suspendre le pont aérien de Berlin et de déclarer Berlin ville ouverte. Les forces alliées occidentales occupant la ville ont reçu l'ordre de se retirer et les Soviétiques ont été priés de lever le blocus pour faciliter le retrait des troupes. Berlin sera une ville ouverte. La réaction aux États-Unis a été plutôt négative, cette action étant considérée comme une capitulation face au chantage soviétique. Beaucoup se demandent si les États-Unis abandonneront Berlin et pourquoi un autre pays ferait-il confiance aux États-Unis s'il est menacé par les Soviétiques. D'autres cependant ont souligné que Berlin n'était une ville ennemie que récemment et que risquer une guerre plus large à son sujet n'avait aucun sens. Berlin-Ouest était intenable et ne valait pas la peine d'être entretenu. Les Soviétiques ont déclaré qu'ils étudiaient leurs options et qu'ils devraient réagir prochainement. À Berlin-Ouest, l'ambiance s'est effondrée car beaucoup craignent ce qui se passera une fois les forces alliées retirées. Le sentiment de trahison est palpable et les tensions montent entre les forces alliées présentes dans la ville et la population locale."
 Korean_War_Sov.1.d:0 "La République populaire démocratique de Corée (RPDC) a été créée en 1948 sous la direction du leader anti-impérialiste et communiste Kim Il-Sung. En 1950, après avoir obtenu l'approbation de l'Union soviétique et de la République populaire de Chine (RPC), Kim a lancé une invasion de la République de Corée (RPC). Malgré le succès initial, une réponse et un déploiement militaires massifs des États-Unis ont conduit à une attaque féroce des États-Unis contre la RPDC. Alors que la position de Kim est menacée, les Soviétiques reconnaissent que la réponse militaire américaine massive pourrait éventuellement conduire à une menace pour la RPC et à un recul de tous les récents succès communistes et soviétiques en Asie. Plus important encore, un tel scénario laisserait l'Union soviétique vulnérable à l'Est. En raison de ces considérations et de l'implication militaire croissante des États-Unis, l'Union soviétique a décidé d'entrer en guerre aux côtés de la RPDC. Les Soviétiques aideront à libérer la Corée et à défendre la RPDC et la RPC contre l'agression impérialiste."

 TUR_SOV.1.d:0 "Après la Seconde Guerre mondiale, l'Union soviétique a cherché à renégocier la Convention de Montreux de 1936. L'accord de 1936 avait permis à la Turquie de contrôler le détroit turc et stipulait que seuls les navires des pays bordant la mer Noire pouvaient utiliser le détroit. Cependant, après la guerre, les Soviétiques ont commencé à formuler des revendications territoriales sur l'est de la Turquie et à exprimer leur mécontentement face à l'administration des détroits. Récemment, le ministère turc des Affaires étrangères a reçu une note du gouvernement soviétique. La note exigeait que l'accord de 1936 soit réécrit et que la Turquie abandonne son contrôle sur les détroits, peut-être que la Turquie devrait accepter les offres soviétiques de gérer les détroits conjointement. Le raisonnement avancé pour modifier le traité était le cas où des navires allemands et italiens traversaient le détroit pendant la guerre, ce qui, selon les Soviétiques, montrait que la Turquie était incapable de maintenir l'ordre dans le détroit. Le gouvernement turc pourrait répondre à cette note en acceptant les exigences soviétiques concernant le contrôle du régime sur les détroits, mais cela risquerait d'entraîner une infiltration communiste et une occupation soviétique de sites clés. Ou bien il peut rejeter la lettre soviétique comme une attaque contre la souveraineté de la Turquie. Certes, cela pourrait entraîner une escalade de la part des Soviétiques, mais avec la volonté des États-Unis de les aider, ils pourraient devenir l'allié idéal pour protéger la Turquie des machinations soviétiques."
 Berlin_Blockade.1.d:0 "Depuis que l'Union soviétique a institué un blocus de Berlin-Ouest suite à sa colère face à la décision des Alliés occidentaux d'introduire la nouvelle monnaie allemande, le Deutsch Mark. Les États-Unis et le Royaume-Uni ont décidé de réagir en instituant leur propre blocus contre l'Allemagne administrée par les Soviétiques et en lançant un pont aérien pour approvisionner la population de Berlin. La seule façon pour les Soviétiques de bloquer l'air serait d'abattre les avions, mais ils ne franchiraient pas cette ligne. Malgré les dépenses et les difficultés imposées aux équipages et aux avions, le pont aérien s'est poursuivi, tout comme le blocus. Alors que les dirigeants américains se réunissent, ils doivent réfléchir à leurs options, car les Soviétiques ne semblent pas disposés à abandonner le blocus. L'une d'entre elles serait de poursuivre le pont aérien. Malgré la pression exercée sur les équipages et les avions, une expérience précieuse a été acquise et certains changements sur le terrain pourraient contribuer à étendre l'opération et à alléger la pression. Une deuxième option serait de céder aux exigences soviétiques et de retirer la nouvelle monnaie. Cela apportera un grand soulagement aux Berlinois, mais cela leur fera perdre la face. Enfin, la ville pourrait être déclarée ville libre, ce qui laisserait la pression sur les Soviétiques pour qu'ils ouvrent le blocus afin de permettre aux forces alliées de sortir."
 Stalin_Purge.2.d:0 "Lavrenti Beria, l'ancien chef du NKVD et actuel superviseur de la sécurité de l'État, s'est révélé être un homme de main crucial pour Joseph Staline. Il a supervisé le programme nucléaire soviétique, l'affaire de Léningrad et le démantèlement du Comité juif antifasciste. Cependant, Staline devenait de plus en plus paranoïaque à l'égard de Beria qui consolidait son propre pouvoir tout en exécutant les ordres de Staline. Staline a cherché à réduire Beria à sa taille et s'est concentré sur le Parti communiste géorgien, où Beria avait sa base de pouvoir la plus solide. Une série d'accusations fabriquées de toutes pièces ont été portées contre les principaux dirigeants du parti géorgien, accusant spécifiquement les Mingréliens (un groupe ethnique géorgien) au sein du parti de comploter avec les exilés géorgiens et les États-Unis pour faire sortir la Géorgie de l'Union soviétique. Les arrestations et les procès qui en résultèrent jusqu'en 1951 et 1952 virent les partisans de Beria au sein du parti géorgien purgés, y compris le premier secrétaire Candide Charkviani. Bien que la purge ait été censée cibler les Mingréliens, elle a ciblé certains Géorgiens non mingréliens, comme Charkiviani. En fin de compte, la purge visait davantage à limiter l'influence et le pouvoir de Beria. Malgré l'attaque de Staline contre sa base de pouvoir, Beria a toujours conservé sa position au Politburo."
 Stalin_Jew.1.d:0 "Le Comité juif antifasciste (JAC) s'est formé fin 1941 sous la direction de Joseph Mikoels. Il s'agissait de diffuser une propagande pro-soviétique à l'étranger et de souligner l'absence d'antisémitisme en Union soviétique. Les membres du comité ont beaucoup voyagé aux États-Unis, au Royaume-Uni, au Mexique et au Canada pour recueillir un soutien financier et matériel pour la cause de la guerre soviétique. Le comité a connu un énorme succès dans ses efforts, en partie grâce à l'établissement de liens étroits avec d'autres organisations juives nationales et internationales. Il a sensibilisé à la cause soviétique et a versé des millions de dollars pour soutenir l'effort de guerre. Après la guerre, le JAC a travaillé avec des organisations juives américaines pour publier des informations sur l'holocauste et la participation juive à la guerre. Cela agaçait Moscou qui considérait ces efforts comme sapant l'affirmation soviétique selon laquelle la guerre était une lutte universelle pour tous les Soviétiques. De plus, ces contacts étroits avec les organisations américaines rendirent Staline particulièrement méfiant à l'égard des activités du JAC. Joseph MIkoels, le leader du JAC, a été assassiné et les principaux membres du comité arrêtés en janvier 1948 sous des accusations de nationalisme bourgeois, de tentative de création d'un État juif en Crimée et de travail pour les intérêts américains."
 Stalin_Purge.1.d:0 "Le Premier ministre soviétique Joseph Staline se méfiait depuis longtemps de Leningrad et de ses dirigeants soviétiques. Son ancien rival Grigorii Zioviev y avait sa base de pouvoir dans les années 1920 et Staline estimait que les soviets de Leningrad souhaitaient ramener la capitale et le centre politique vers l'ancienne capitale impériale. Après la Seconde Guerre mondiale, ces soupçons se sont transformés en paranoïa. Le siège de Leningrad a fait des dirigeants de la ville des héros nationaux et leur a permis pendant le siège d'opérer indépendamment des directives de Staline. Après la guerre, les dirigeants de Léningrad ont gagné davantage de positions de pouvoir au sein du gouvernement central de Moscou, acquérant ainsi le plus de pouvoir dont ils disposaient depuis l'arrivée au pouvoir de Staline. Craignant cette nouvelle base de pouvoir politique et la montée en puissance d'un si grand nombre de jeunes hommes politiques, Staline décida d'agir. En janvier 1949, les principaux dirigeants de Léningrad, comme Alexeï Kouznetsov et Nikolaï Voznesenski, organisèrent une foire commerciale. Staline a ordonné aux médias et aux forces de sécurité d'attaquer l'événement et a présenté une série d'accusations forgées de toutes pièces de détournement de fonds et de corruption à ses rivaux de Leningrad. En janvier 1950, les procès se terminèrent et six dirigeants de Léningrad furent condamnés à mort. L'affaire de Léningrad a permis à Staline d'éliminer une base de pouvoir rivale perçue."

 sov.1.t:0 "Aidez la RPC"
 sov.1.d:0 "La RPC a demandé notre aide dans ses efforts. Devons-nous intervenir et les aider ?"
 sov.1.a:0 "Oui bien sûr!"
 sov.1.b:0 "Non, pourquoi devrions-nous le faire ?"
 sov.2.t:0 "[From.GetName] veut adhérer au Pacte de Varsovie"
 sov.2.d:0 "[From.GetName] nous a demandé d'adhérer au Pacte de Varsovie, les acceptons-nous ?"
 sov.2.a:0 "Oui!"
 sov.2.b:0 "Non!"
 sov.3.t:0 "L'unification de l'Autriche"
 sov.3.d:0 "Le peuple autrichien veut redevenir un pays libre et indépendant. Il pourrait servir d'État tampon entre l'Est et l'Ouest. Est-ce qu'on permet cela ?"
 sov.3.a:0 "Oui bien sûr!"
 sov.3.b:0 "Non, nous gardons la terre."
 sov.4.t:0 "Accepter la RPC à l'ONU"
 sov.4.d:0 "La République populaire de Chine veut être reconnue à l'ONU. La République de Chine est devenue très faible après la guerre civile, nous devons donc désormais soutenir la nation la plus grande et la plus forte, à savoir la République populaire de Chine."
 sov.4.a:0 "Oui bien sûr!"
 sov.4.b:0 "Non, ils resteront dehors."
 newssovever.1.d:0 "Nikita Khrouchtchev a décidé de quitter son poste de Premier ministre en raison de son âge avancé et de sa mauvaise santé. Nikita Khrouchtchev a dirigé l'Union soviétique pendant une décennie et a lancé son programme spatial, dirigé la question de Berlin et, bien sûr, soutenu Cuba pour un gouvernement communiste. Nikita Khrouchtchev a déclaré qu'il souhaitait que l'URSS perdure et que Leonid Brejnev ferait un excellent travail en tant que Premier ministre. D'autres pays du monde ont été surpris par cette décision. Quelle voie prendra désormais l'URSS sous Léonid Brejnev ? Paix ou guerre ?"
 newssovever.2.d:0 "Des nouvelles choquantes sont arrivées d'URSS|:| Le président Khrouchtchev a déclaré que Léonid Brejnev avait tenté de le destituer. Khrouchtchev a déclaré qu'il avait été trahi par ses camarades et qu'il s'agissait là d'une attaque directe contre la révolution. Brejnev a répliqué en déclarant que Khrouchtchev n'est pas apte à occuper le poste de Premier ministre parce qu'il a failli plonger le monde dans une troisième guerre mondiale avec la crise des missiles de Cuba. Tous deux ont rallié leurs partisans, appelant la population à respecter la Constitution de l'Union en défendant le leader légitime. Une lutte de pouvoir est devenue violente au sein de l'Union."
 newssovever.3.d:0 "La rumeur d'un coup d'État s'est répandue très rapidement en URSS et seul Nikita Khrouchtchev ou quelqu'un qui nous a trahis au sein du « Comité » peut en être informé. Brejnev et le « Comité » sont désormais connus du monde entier et nous devons faire quelque chose. Nous vivons une période très sombre pour l'URSS. Les deux parties ont appelé au soutien, à faire respecter la justice et à combattre l'autre camp. De quel camp rejoignons-nous dans la lutte pour le Premier ministre ? Khrouchtchev ou Brejnev ?"
 every1.9.d:0 "Les Mexicains ont accordé l'asile politique à Nikita Khrouchtchev pour vivre dans un lieu secret au Mexique. Les Mexicains ont sûrement signé un accord avec Khrouchtchev pour qu'il bénéficie d'une protection afin qu'il leur donne les secrets et les plans soviétiques sur notre façon de fonctionner. Les Américains obtiendraient alors probablement les secrets et les plans du gouvernement mexicain dans le cadre d'un accord. Cela va nous porter un coup dur et nous avons besoin d'un plan pour y faire face. "
 newssovever.6.d:0 "Nikita Khrouchtchev a obtenu l'asile au Mexique et a été autorisé à séjourner dans un lieu secret. Khrouchtchev s'est d'abord adressé aux Américains pour demander l'asile, mais ceux-ci ont refusé en raison des mauvaises relations et des tensions accrues que cela entraînerait. Le gouvernement mexicain l'a cependant accepté parce que le Mexique était connu pour être un refuge pour échapper aux ennemis et parce que l'Amérique pourrait obtenir de l'aide de son ami du Sud. Léon Brejnev a déclaré que l'URSS ne permettrait plus jamais Khrouchtchev et qu'il ferait mieux de faire attention à sa vie maintenant. Nikita Khrouchtchev se trouve désormais dans un lieu secret afin que l'URSS n'envoie pas d'agents du KGB pour mettre fin à ses jours. Les Mexicains considèrent qu'il s'agit là d'une grande opportunité de nouer une amitié avec les Américains et du début d'une nouvelle ère. Qu'arrivera-t-il désormais à Khrouchtchev et à l'URSS ? Nikita Khrouchtchev se trouve désormais dans un lieu secret afin que l'URSS n'envoie pas d'agents du KGB pour mettre fin à ses jours. Les Mexicains considèrent que c'est un coup dur porté à l'URSS et le début d'un grand allié. Qu'arrivera-t-il désormais à Khrouchtchev et à l'URSS ? "
 newssovever.5.d:0 "Nikita Khrouchtchev a obtenu l'asile aux États-Unis et a été autorisé à séjourner dans un lieu secret. Les Américains ont déclaré qu'ils aimeraient avoir un homme qui connaît l'URSS de fond en comble et qui connaît son fonctionnement. Ils ont déclaré que les secrets et les informations de Khrouchtchev contribueraient aux efforts des États-Unis, car ils ont désormais tous deux un ennemi commun. L'URSS est cependant furieuse d'accepter un traître dans son pays et montre seulement que les États-Unis sont injustes envers la justice. Léon Brejnev a déclaré que l'URSS ne permettrait plus jamais Khrouchtchev et qu'il ferait mieux de faire attention à sa vie maintenant. Nikita Khrouchtchev se trouve désormais dans un lieu secret afin que l'URSS n'envoie pas d'agents du KGB pour mettre fin à ses jours. Les Américains considèrent qu'il s'agit là d'un coup dur porté à l'URSS et du début d'un grand allié. Qu'arrivera-t-il désormais à Khrouchtchev et à l'URSS ? "
 every1.6.d:0 "Nikita Khrouchtchev a atterri à Washington D.C. Et demande désormais l'asile politique car il a été démis de ses fonctions de Premier ministre lors d'un coup d'État mené par Leonid Brejnev et son comité. Si ce qu'il a dit est vrai et que nous le gardons, alors la nouvelle URSS nuira à nos relations et exacerbera les tensions. Si nous lui refusons l'asile, il devra alors aller ailleurs. Le Mexique serait un endroit approprié pour lui si nous ne voulons pas de lui. Il jouerait cependant un grand rôle dans notre gouvernement et sa défection nous aiderait à comprendre les communications soviétiques, le placement des troupes et le fonctionnement intérieur et extérieur de l'URSS. Il serait un grand atout. "
 every1.7.d:0 "Nikita Khrouchtchev a échappé à un coup d'État à Moscou depuis Brejnev et a fait défection aux États-Unis pour obtenir l'asile politique. Les Américains ne voulaient cependant pas de lui parce que s'ils le prenaient, les tensions entre les États-Unis et l'URSS augmenteraient, et aussi parce que les relations américano-soviétiques s'en trouveraient gravement affectées. Les Américains nous l'ont envoyé pour nous demander s'ils prendraient Khrouchtchev. Le Mexique a toujours été un refuge pour les personnes qui fuient d'autres pays. Il y a seulement plus de 30 ans, Léon Trotsky essayait d'éviter Staline et l'URSS à Mexico. Khrouchtchev nous aiderait également en tant que personnalité politique et qui sait que les Américains pourraient nous apprécier si nous lui permettons de leur envoyer des secrets soviétiques ? Que devons-nous faire ?"
 sov_death.3.d:0 "Youri Vladimirovitch Andropov est décédé dans sa chambre de l'hôpital clinique central de l'ouest de Moscou à l'âge de 69 ans. Après avoir souffert d'une insuffisance rénale en août 1983, il a déménagé définitivement à l'hôpital où il a passé le reste de sa vie. Selon le rapport médical post mortem, Andropov souffrait de plusieurs problèmes de santé|:| néphrite interstitielle, néphrosclérose, hypertension résiduelle et diabète, aggravés par une insuffisance rénale chronique. Nous avons déjà décidé d'une période de deuil de quatre jours. Mais maintenant, il faut aussi élire son successeur. Notre candidat le plus probable est Konstantin Chernenko, un homme semblable à Andropov. Il est cependant déjà assez malade ; souffrant d'emphysème et d'insuffisance cardiaque droite. L'année dernière, il avait été absent de ses fonctions pendant trois mois en raison d'une bronchite, d'une pleurésie et d'une pneumonie. Andropov avait pourtant demandé à Mikhaïl Gorbatchev de lui succéder, mais beaucoup ont peur de ses idéaux réformistes."
 sov_death.4.d:0 "Après la mort de Brejnev et de son successeur Youri Andropov, Tchernenko fut élu secrétaire général en février 1984 et président du Présidium du Soviet suprême en avril 1984. En raison de sa santé se détériorant rapidement, il était souvent incapable d'exercer ses fonctions officielles. Il est décédé en mars 1985 après avoir dirigé le pays pendant seulement 13 mois.\nTchernenko est devenu le troisième dirigeant soviétique à mourir en moins de trois ans. Après avoir été informé de sa mort au milieu de la nuit, le président américain [USA.GetLeader] aurait déclaré : « Comment suis-je censé me rendre quelque part avec les Russes s'ils continuent de mourir contre moi ?"
 sov_maki.1.d:0 "Le Parti communiste d'Israël, ou Maki, nous a contactés aujourd'hui pour demander notre soutien concernant « l'exercice de pressions » pour mettre sur le rang ses membres de la coalition les plus modérés, le parti Mapam. Bien que cela soit risqué, nous pourrions obtenir un allié fidèle au Moyen-Orient si nous y parvenons."
 sov.102.d:0 "En 1947, le camarade Staline autorisa personnellement la construction de 7 gratte-ciel à Moscou. Surnommées par les gens « Les Sept Soeurs », elles avaient pour but de montrer à l'Occident notre force et nos prouesses industrielles, ainsi que d'impressionner tous les visiteurs de notre merveilleuse capitale. La plus importante d'entre elles, la Glorieuse Tour de l'Université d'État de Moscou, a été achevée aujourd'hui sous le regard attentif de l'architecte en chef Lev Roudnev. Rudnev a déjà construit des édifices imposants comme le M.V. L'Académie militaire Frunze et les Appartements du Maréchal, gagnant le respect et la confiance du Parti et de Staline lui-même. La tour est située au coeur du campus universitaire et domine celui-ci ainsi que l'horizon de Moscou. Plus de 400 000 tonnes d'acier et 130 000 tonnes de béton ont été utilisées pour réaliser ses fondations. Avec ses 240 mètres de hauteur, c'est le plus grand bâtiment d'Europe et le 7ème au monde. C'est véritablement un grand pas en avant pour notre grande union, et même si le camarade Staline n'est malheureusement pas parmi nous aujourd'hui pour assister à son ouverture, nous savons qu'il en serait fier."
 chernobyl.1.d:0 "A 01:23:04, le test de sécurité a commencé, après avoir été retardé de 10 heures, avec un nouvel équipage non préparé. Lors de la réduction prévue de la puissance du réacteur en préparation du test électrique, la puissance est tombée de manière inattendue à un niveau proche de zéro. Les exploitants n'ont pu rétablir que partiellement la puissance d'essai spécifiée, ce qui a placé le réacteur dans un état potentiellement instable. À 01:23:40, tel qu'enregistré par le système de contrôle centralisé SKALA, le bouton AZ-5 du système de protection d'urgence du réacteur a été enfoncé. Lorsque le bouton AZ-5 a été enfoncé, l'insertion des barres de commande dans le coeur du réacteur a commencé. Au fur et à mesure que les barres de commande étaient abaissées, la puissance du réacteur a grimpé à environ 30 000 MW thermiques, soit 10 fois sa puissance opérationnelle normale, la dernière lecture indiquée sur le wattmètre du panneau de commande. Après cela, plusieurs explosions se sont produites, qui ont provoqué l'ouverture du réacteur, libérant du graphite dans l'environnement."


 soviet.4.d:0 "L'URSS a annexé la RSS carélo-finlandaise à la RSS fédérative de Russie. C'est la première fois qu'une république soviétique est annexée à une autre. L'URSS a déclaré qu'après le renforcement des relations finno-soviétiques, elle pensait qu'il serait temps d'annexer la RSS carélo-finlandaise. Il y a cependant quelques personnes en colère contre cette décision. La population finlandaise de l'ancienne RSS a eu peur d'un plus grand contrôle soviétique et d'une diminution de son autonomie. Les Soviétiques ont déclaré que les Finlandais ne devaient pas s'inquiéter. Les Soviétiques célèbrent les nouveaux oblasts de la RFSSR à Moscou."
 soviet.3.d:0 "Après une décennie de Seconde Guerre mondiale et une amélioration des relations avec la Finlande, les membres du Congrès ont déclaré qu'il était temps pour la RSS carélo-finlandaise d'être annexée à l'URSS. Nous avons également besoin de terrains pour la frontière avec la Norvège et la Suède au cas où nous aurions besoin de lancer une invasion ou de nous défendre. Cependant, certains des dirigeants politiques finlandais présents au congrès ont souhaité que ce soit une RSS pour le peuple finlandais de la région. Que devons-nous faire ? Acceptons-nous ou non la finlandisation ?"
 soviet.2.d:0 "L'URSS a autorisé la RSS fédérative de Russie à offrir la Crimée à la RSS d'Ukraine en guise d'amitié depuis plus de 300 ans. L'Ukraine a rejoint le tsarisme de Russie il y a 300 ans et la RFSSR voulait montrer son appréciation pour leur amitié historique. La RSS d'Ukraine a exprimé sa gratitude à la RSFSSR pour ce cadeau d'amitié."
 soviet.1.d:0 "Alors que nous approchons du 300e anniversaire de l'adhésion de l'Ukraine au tsarisme de Russie, de plus en plus de gens commencent à parler de ce que nous ferons pour la RSS d'Ukraine et pour son anniversaire. Certains dirigeants politiques présents à notre congrès ont commencé à parler d'un transfert de la Crimée de la RSS fédérative de Russie à la RSS d'Ukraine. Nous avons toujours été très proches des Ukrainiens et ils ont dit que cette terre leur appartenait. Cela pourrait être le cadeau parfait pour leur amitié avec nous depuis plus de 300 ans. Cependant, la terre est très précieuse et regorge de ports et de ressources pour nous."
 news.1500.t:0 "C'est avec une profonde tristesse que le 5 mars à 21h50 Joseph Vissarionovitch Staline, secrétaire du Comité central du Parti communiste et président du Conseil des ministres, est décédé des suites d'une grave maladie. Le coeur du collaborateur et adepte du génie de Lénine, du sage dirigeant et professeur du parti communiste et du peuple soviétique, a cessé de battre. Joseph Staline était un travailleur acharné et aidait ses camarades. Sa vision brillante de l'URSS a contribué à façonner bon nombre des idéaux et des valeurs que nous avons aujourd'hui. Il perpétue l'héritage de Lénine. Il nous manquera. Le Conseil soviétique se réunira et décidera qui sera le successeur. Quel qu'il soit, il devra suivre l'un des plus grands héritages de l'U.R.S.S."
 swf.7.d:0 "Aujourd'hui, nous nous réunissons tous à Varsovie, en Pologne, pour réaffirmer notre désir de créer une alliance européenne collective fondée sur la sécurité, quels que soient nos systèmes sociaux ou politiques. La guerre froide s'est aggravée au fil des années et de nouvelles limites se dessinent. Désormais, avec le réarmement des États allemands, nous devons nous assurer que nous sommes prêts à un conflit armé généralisé qui éclaterait dans la région allemande ou ailleurs. Le Kominform constitue une grande alliance, mais nous devons renforcer l'Est contre l'Ouest. Le Pacte de Varsovie sera créé pour protéger tous ses membres, quel que soit leur système social ou politique. Nous serons unis contre les ennemis du Pacte de Varsovie. Le Kominform est mort ! Vive le Pacte de Varsovie !"
 TUR_SOV.11.d:0 "Il semble qu'après la conquête du Bosphore, les armes de Staline se soient tournées contre nous. Aujourd'hui, nous avons reçu un télégramme troublant indiquant que l'Union soviétique a l'intention d'absorber pacifiquement notre nation souveraine, la Yougoslavie, dans le bloc de l'Est. Ils exigent que nous permettions aux troupes soviétiques d'établir une garnison dans notre pays, que la flotte de la mer Noire accoste dans nos ports et que l'armée de l'air rouge utilise nos pistes d'atterrissage pour la reconnaissance. Même si cette idée paraît ridicule, ils ont promis que si nous l'acceptions, le maréchal Tito ainsi que l'ensemble du gouvernement et de l'armée yougoslaves conserveraient leurs positions. Staline a déclaré qu'il souhaitait rétablir les relations avec le peuple yougoslave et permettre à nos deux nations de marcher à nouveau côte à côte dans la paix comme dans la guerre. Cependant, si nous refusions, il a prévenu que l'ensemble de l'Armée rouge soviétique défilerait sur Belgrade d'ici la fin de la semaine."
 TUR_SOV.12.d:0 "Après notre invasion réussie de la Yougoslavie, qui a osé usurper notre autorité et notre fraternité socialiste en Europe de l'Est, nous devons prendre une décision. Le camarade Staline a ordonné une conférence avec tous les pays voisins pour discuter de la manière dont le territoire de l'ex-Yougoslavie devrait être divisé et pour voir comment procéder, qu'il s'agisse de le laisser tranquille ou de donner du territoire à l'Albanie et à la Grèce."
 TUR_SOV.13.d:0 "Puisque la Yougoslavie a refusé de suivre notre fraternité socialiste en Europe de l'Est, le camarade Staline et le ministère des Relations économiques extérieures ont décidé d'imposer un embargo total à la Yougoslavie, dans le but de les convaincre de se détourner du révisionnisme. Cela comprendra l'arrêt complet de toute importation soviétique de tous biens, y compris les produits alimentaires et les équipements technologiques, ainsi qu'une assistance économique. Cela servira d'avertissement à toutes les autres nations communistes qui oseraient se plier aux puissances impérialistes occidentales, qui leur proposent des appâts économiques."
 TUR_SOV.14.d:0 "Dans la ville industrielle de Khabarovsk, dans l'Extrême-Orient russe, se déroulent des procès pour crimes de guerre contre 12 membres de l'armée japonaise du Guandong accusés d'avoir fabriqué et utilisé des armes biologiques pendant la Grande Guerre patriotique. Tous les accusés ont été reconnus coupables et condamnés en conséquence à des peines de 2 à 25 ans de camp de travail. Parmi les accusés figurent le général Otozo Yamada, commandant de l'armée du Guandong, ainsi que plusieurs généraux responsables de la tristement célèbre unité 731 et d'autres services médicaux. Leurs crimes ont causé la mort de milliers de personnes et ces procès en valent largement la peine."
 SOV_Troika.1.d:0 "Les premières informations de Radio Moscou indiquent que Lavrenti Beria, ministre de l'Intérieur, chef du NKVD et premier vice-président du Conseil des ministres, a été arrêté au Kremlin, avec l'aide du maréchal Gueorgui Joukov et d'autres officiers armés. Actuellement, Beria est détenu au quartier général du district militaire de Moscou et ses fidèles forces de sécurité sont bloquées par des éléments de la division blindée Kantemirovskaya et de la division de fusiliers motorisés Tamanskaya. On pense que Beria a été arrêté pour trahison, terrorisme et prédation sexuelle, qui constituent tous des délits graves, mais on pense que Beria a été arrêté pour permettre à d'autres membres de la troïka d'accéder au pouvoir."
 SOV_Troika.2.d:0 "Des rapports internes ont indiqué que Nikita Khrouchtchev, chef de la branche du Parti communiste de Moscou et membre de la troïka, a été arrêté dans le complexe du Kremlin par des membres du parti fidèles à Lavrenti Beria, dont Vsevolod Merkulov, Bogdan Kobulov et Georgy Malenkov. On ne sait pas où est détenu Khrouchtchev, mais il s'agit d'un lieu tenu secret dans la ville de Moscou. On pense que Khrouchtchev a été arrêté pour trahison et activité contre-révolutionnaire, bien que certains observateurs occidentaux y voient une prise de pouvoir de la part de Beria en retirant un membre de la troïka au pouvoir."
 SOV_Troika.3.d:0 "Le général Viktor Abakumov, ministre de la Sécurité d'État, a été exécuté. Nommé en 1946 par le camarade Staline, le pouvoir d'Abakumov lui fut retiré lorsqu'il fut arrêté en 1951 pour ne pas avoir fait assez pour monter un dossier contre les Juifs. Après le Complot du Docteur, Abakumov est resté en prison, même après l'exécution de Beria et de son adjoint, Mikhaïl Ryumine. En décembre 1954, Abakumov fut jugé pour falsification de l'affaire de Leningrad, un complot stalinien visant à accuser les membres du PCUS d'avoir formé une organisation antisoviétique, et fut abattu avec trois de ses adjoints du MGB."
 SOV_Troika.4.d:0 "Aujourd'hui, à Moscou, 14 hauts responsables du Parti communiste ont été jugés pour trahison et activités contre-révolutionnaires contre le gouvernement du camarade Staline. Ces responsables comprennent Viatcheslav Molotov, premier vice-président du Conseil des ministres ; Anastas Mikoyan, ministre du Commerce extérieur ; les maréchaux Kliment Vorochilov et Semyon Budyonny ; Arseny Zverev, ministre des Finances ; ainsi que de nombreux premiers secrétaires du Parti dans les RSS d'Arménie, de Géorgie et de Finlande, des comités municipaux et régionaux de Moscou et du Comité central de contrôle. Piotr Pospelov, rédacteur en chef de la Pravda, a également été jugé. Les 14 fonctionnaires ont été condamnés à mort par peloton d'exécution, ce qui montre encore une fois le contrôle de Staline sur le gouvernement."
 SOV_Troika.5.d:0 "Après le procès des 14, deux autres hauts fonctionnaires, Andrei Gromyko et Panteleimon Ponomarenko, ont été exécutés. Gromyko, ancien représentant permanent de l'URSS auprès de l'ONU, a été accusé d'espionnage auprès des puissances occidentales, en raison de ses relations avec des diplomates de haut rang et de son poste d'ambassadeur au Royaume-Uni. Ponomarenko, ancien ministre des Marchés publics et premier secrétaire du Parti communiste kazakh, a été accusé de corruption et d'abus financiers après avoir été audité et découvert qu'il construisait une villa avec l'argent du Parti. Tous deux ont été fusillés près de Moscou. La communauté internationale, en particulier les alliés occidentaux, est particulièrement choquée par la mort de Gromyko, un ami et un ennemi bien-aimé de l'ONU."
 SOV_Troika.6.d:0 "Finalement, même le successeur proposé par Staline s'est retrouvé mêlé à des allégations. Gueorgui Malenkov, président du Conseil des ministres et deuxième secrétaire du PCUS, a été accusé d'adultère, de corruption et de prédation sexuelle dans le cadre d'un scandale connu sous le nom d'affaire Golubtsova, du nom de sa prétendue épouse. Malenkov a rencontré Valeriya Golubtsova, fille du conseiller d'État de l'Empire russe à Nijni Novgorod, en 1920. Ils vivent ensemble depuis lors, mais n'ont jamais officiellement enregistré leur union et ne sont donc techniquement pas mariés. Étant donné qu'il occupe une position aussi élevée au sein du gouvernement, ce type d'activité n'est pas toléré et Malenkov a été jugé et reconnu coupable. Quelle sera sa punition ?"
 SOV_Troika.7.d:0 "Plus tôt cette semaine, le gouvernement soviétique a annoncé que le transfert officiel du pouvoir de l'actuel secrétaire général de l'Union des Républiques socialistes soviétiques, Joseph Staline, au président sortant Lazar Kaganovitch aurait lieu lors du XXe congrès du Parti communiste à Moscou. Les préparatifs pour l'événement ont déjà commencé puisque le plus grand défilé militaire jamais organisé ainsi que le public de l'histoire de l'Union soviétique sont attendus sur la place rouge. Tout cela a été une surprise pour les observateurs occidentaux qui s'attendaient à ce que Staline occupe le poste de secrétaire général jusqu'à sa mort attendue. Après avoir survécu à un accident vasculaire cérébral en 1953, sa santé s'est fortement détériorée et beaucoup s'attendent à ce que sa mort survienne le plus tôt possible."
 Stalin.Retirement.d:0 "Le monde a été choqué aujourd'hui lorsque le Kremlin de Moscou a appris que Joseph Vissarionovich Staline, secrétaire général du Parti communiste de l'Union soviétique depuis 1922, avait annoncé sa retraite. Après avoir pris le pouvoir à la mort du fondateur Vladimir Lénine en 1922, l'idée de Staline du socialisme dans un seul pays, combinée à ses plans quinquennaux d'industrialisation, a créé un pays communiste fort avec une économie dirigée centralisée. Depuis son ascension, des mouvements communistes ont surgi partout dans le monde et l'Union soviétique est désormais considérée comme une superpuissance au même titre que les Alliés occidentaux. Les dirigeants du monde entier ont exprimé leur choc, même si les conversations privées à la Maison Blanche et au 10 Downing Street sont un mélange de soulagement et d'inquiétude."
 CPSU20.1.d:0 "Le vingtième congrès du Parti communiste de l'Union soviétique s'est terminé après plus de dix jours de réunions. Il s'agit du premier congrès organisé sous la nouvelle direction du Premier ministre Lazar Kaganovitch, choisi pour succéder à Joseph Staline, et de sa première apparition publique majeure depuis cette annonce. Kaganovitch a profité du Congrès pour renforcer sa position anti-révisionniste et anti-réformatrice et saluer le camarade Staline pour ses services rendus à l'Union soviétique. Il a ensuite longuement parlé du procès des 14 et des exécutions d'anciens responsables du Parti, tels que Nikita Khrouchtchev, Viatcheslav Molotov et d'autres, qui ont osé changer le mode de vie socialiste. Ce discours a ébranlé jusqu'au coeur le petit mouvement réformateur au sein du Parti, largement vidé de sa substance par les purges et les procès. Le monde a exprimé des émotions mitigées, l'Occident exprimant sa détresse face au maintien de la ligne dure du gouvernement, tandis que le bloc de l'Est reste perplexe face à un changement de direction de ses maîtres."
 CPSU20.2.d:0 "Le vingtième congrès du Parti communiste de l'Union soviétique s'est terminé après plus de dix jours de réunions. Il s'agit du premier congrès organisé sous la nouvelle direction conjointe de Gueorgui Malenkov et de Lavrenti Beria, ayant pris le pouvoir dans la lutte de la troïka après la mort du camarade Staline. Sur scène, les deux hommes ont parlé tour à tour de la nécessité d'un leadership stable dans des temps aussi difficiles et des horreurs de l'impérialisme et du révisionnisme, condamnant des personnalités comme Nikita Khrouchtchev et Nikolaï Boulganine qui ont osé s'opposer à eux. Les réactions à propos de leur discours ont été mitigées, les partisans de la ligne dure et les réformistes exprimant un mélange de soutien et d'inimitié. Au niveau international, les réactions sont similaires ; un espoir prudent quant à l'avenir de l'URSS nous attend."
 sov_congress.1.d:0 "Le 19e Congrès du Parti communiste de toute l'Union (bolcheviks) s'est officiellement terminé, marquant le premier congrès du Parti organisé depuis la fin de la Grande Guerre patriotique. Après près d'une décennie sans une telle convocation, ce congrès a marqué un moment important dans la vie politique soviétique, ouvrant la voie à de vastes réformes organisationnelles et réaffirmant l'orientation des dirigeants de l'Union soviétique.\n\nChangements organisationnels clés :\nLe Parti communiste de toute l'Union (bolcheviks) a été rebaptisé Parti communiste de l'Union soviétique.\nLe Politburo du Comité central est devenu le Présidium du Comité central et a été considérablement élargi à 15 membres. Le Secrétariat et le Comité central ont doublé de taille (respectivement dix et 133 membres).\nL'Orgburo a été aboli et ses fonctions ont été transférées au Secrétariat.\n\nMembres titulaires (votants) élus au 19e Présidium :\nVassili Andrianov ; Averki Aristov ; Lavrenti Beria ; Nikolaï Boulganine ; Kliment Vorochilov ; Semyon Ignatiev ; Lazar Kaganovitch ; Demian Korotchenko ; Vassili Kouznetsov ; Otto Kuusinen ; Gueorgui Malenkov ; Viatcheslav Malyshev ; Léonid G. Melnikov ; Anastas Mikoyan ; Nikolaï Mikhaïlov ; Viatcheslav Molotov ; Mikhaïl Pervoukhine ; Panteleimon Ponomarenko; Maksim Saburov ; Joseph Staline ; Mikhaïl Souslov ; Nikita Khrouchtchev ; Dmitri Chesnokov ; Nikolaï Shvernik ; Matveï Chkiriatov\n\nMembres candidats (sans droit de vote) élus au Présidium :\nLéonid Brejnev ; Andreï Vychinski ; Arséni Zverev ; Nikolaï Ignatov ; Ivan Kabanov ; Alexeï Kossyguine ; Nikolaï Patolichev ; Nikolaï Pegov ; Alexandre Pouzanov ; Ivan Tevossian ; Pavel Yudine."
 
 #Kaganovich
 SOV_KAG.1.desc:0 "Aujourd'hui, mes chers étudiants, nous poursuivons notre cours sur notre estimé camarade Staline. Lors de notre dernier cours, nous avons discuté de l'industrialisation de l'Union soviétique dans les années 1930, et aujourd'hui nous nous concentrerons sur l'excellent leadership du camarade Staline, qui nous a sauvés de la menace fasciste du Troisième Reich... Ce type de cours était monnaie courante dans toute l'Union soviétique alors que la prochaine génération étudiait dur pour devenir des membres productifs de la société socialiste. Les enseignants soviétiques ont eu la tâche difficile de comprendre le programme et de présenter correctement la vie et l'héritage de Joseph Staline, un dirigeant incroyablement complexe."
 SOV_KAG.2.desc:0 "La Komsomolskaïa Pravda a publié aujourd'hui un autre article sur les pères fondateurs de l'Union soviétique. La première page contient un résumé de la vie de Vladimir Ilitch Lénine. A commencer par ses humbles débuts et son virage progressif vers le côté révolutionnaire après avoir été témoin de la mort de son frère par les troupes du Tsar. Pendant la Grande Guerre, Lénine fut exilé en Suisse, mais même une grande distance de sa patrie ne put l'empêcher d'essayer d'apporter le pouvoir au peuple. Il écrivit des lettres et des brochures qui furent ensuite distribuées dans les rues de Petrograd. Plus tard rebaptisé Leningrad en son honneur. Après la révolution, son cercle d'associés s'agrandit, dont son successeur Joseph Staline. Mais avant que Lénine puisse réaliser son rêve d'apporter la gloire du socialisme au monde, il fut victime d'un accident vasculaire cérébral. Cela ne l'a pas empêché de remplir ses fonctions jusqu'à son décès prématuré. Cela a cependant porté ses fruits, car le mouvement qu'il a lancé et l'Union qu'il a créée étaient suffisamment forts pour résister à la menace fasciste et sauvegarder la révolution pour les décennies à venir !"
 SOV_KAG.3.desc:0 ""
 SOV_KAG.4.desc:0 "L'alliance des pays socialistes dirigée par l'Union soviétique, connue sous le nom de Komintern, a publié une déclaration publique sur sa réforme qui aura lieu au cours des prochains mois. Outre les développements internes, le Komintern devrait désormais se concentrer sur l'extraction des ressources afin de stimuler l'industrie de l'Est et d'exporter avec succès la révolution à travers le monde par tous les moyens nécessaires. Ce que signifie cette formulation est très clair. La guerre froide s'intensifie."
 SOV_KAG.5.desc:0 ""
 SOV_KAG.6.desc:0 ""
 SOV_KAG.7.desc:0 "L'Union soviétique est entrée aujourd'hui dans une période de deuil alors que la plus triste nouvelle frappait la nation. Son chef, le secrétaire général du Parti communiste Joseph Vissarionovitch Staline est décédé. D'après les rares informations émanant du Kremlin, il semble que Joseph Staline soit décédé paisiblement dans sa datcha de Kuntsevo, près de Moscou. Les préparatifs sont en cours pour ses funérailles qui seront tout simplement magnifiques. Les hommes politiques du monde socialiste ont déjà présenté leurs condoléances et viendront sûrement rencontrer une dernière fois le camarade Staline avant son dernier repos. D'un autre côté, ses victimes et les millions de personnes qu'il a enfermées dans les goulags font la fête en secret."
 SOV_KAG.8.desc:0 "...et c'est pourquoi je le dis, il n'y aura pas un jour où un responsable du parti, un paysan, un ingénieur, un pilote ne vous remerciera pas, camarade Staline, pour tout ce que vous avez fait pour l'Union soviétique et pour le monde ! Par conséquent, dans nos coeurs, dans nos esprits, dans nos âmes, vous vivrez toujours!\", a déclaré Lazar Kaganovitch dans le dernier paragraphe de son discours d'ouverture du 21e Congrès du Parti communiste de toute l'Union. Malgré l'atmosphère sombre du passage de l'Homme de fer, il a été récompensé par une ovation debout de dix minutes. Kaganovitch a dû recourir au buzzer de Staline pour calmer la salle avant de retourner à sa place.\nEnsuite, Viatcheslav Molotov a réitéré le discours du camarade Kaganovitch, mais sur un ton beaucoup plus sombre. Il a dit que c'était une bonne fortune que Staline soit passé dans sa datcha, car c'était l'endroit où il l'avait vu le plus heureux. Mais il a ajouté que le cap qu'il s'est fixé doit être suivi et que son travail doit être poursuivi. Pour lequel il a obtenu un clin d'oeil d'Iron Lazar.\nAprès les discours des autres membres du Politburo, le camarade Kaganovitch est revenu sur scène pour présenter le thème principal du Congrès de cette année, ses réformes du système soviétique, que beaucoup ont commencé à qualifier de « kaganovitchisme ».\nL'un de ses principes est le retour à une démocratie interpartis de bas niveau pour faciliter le remplacement des membres juniors du parti soit vers de meilleurs postes, soit en dehors du parti et pour rendre les échelons inférieurs de l'État plus réactifs et efficaces. La mise en oeuvre de limites de mandats pour le poste de secrétaire général va dans le même sens que cet objectif. Le dernier grand problème que Lazar Kaganovitch cherche à éradiquer est la corruption au sein de l'État, pour laquelle il présentera un plan dans les prochains jours."
 SOV_KAG.9.desc:0 "Comme il l'a déjà souligné lors du Congrès, le camarade Kaganovitch vise à éradiquer la corruption de l'appareil d'État. Plusieurs propositions de sanctions ont été avancées dans une loi similaire à celle contre le parasitisme social. Dans cette itération, ce sont ceux qui abusent de leur position et du travail des autres à leur profit. Les sanctions spécifiques varieront en fonction du nombre de roubles que l'auteur a acquis grâce à ses actions malhonnêtes, depuis la saisie de biens, des années de prison, l'expulsion du Parti et la réinstallation dans une région lointaine de l'Union."
 SOV_KAG.10.desc:0 "L'ouverture du 22e Congrès du PCUS a eu lieu aujourd'hui. L'importance de ce Congrès réside dans la synthèse concrète de la lutte entre partisans et adversaires de la cybernétique appliquée, invisible pour le grand public, mais visiblement reflétée dans les résultats du VIIIe Plan quinquennal et dans le bien-être du peuple. Le secrétaire général Lazar Kaganovich a ouvert le congrès par un discours d'introduction, dans lequel les résultats objectifs ont été énumérés - quels indicateurs ont été pleinement atteints et lesquels seulement partiellement. D'abord calmement écoutés, certains délégués du Congrès se sont tournés vers des sifflets, des huées et des acclamations désapprobatrices, criant au \"gaspillage des richesses du peuple\", aux \"expériences irréfléchies\" et à \"une tentative d'écarter le Parti et d'usurper le pouvoir\". Les délégués qui soutenaient Kaganovitch ont tenté de crier à ses détracteurs, en parlant des éléments antipopulaires du parti qui interféraient avec la cybernétisation de la même manière que les démolisseurs sabotaient l'industrialisation, et de l'échec délibéré dans la mise en oeuvre des décisions du Congrès précédent. Passé le temps imparti, Lazar Kaganovitch, manifestement alarmé par les disputes incessantes, mais essayant de ne pas le montrer, a rappelé les délégués à l'ordre et, lorsque le bruit s'est arrêté, a cédé la place à l'orateur suivant."
 SOV_KAG.11.desc:0 "Le 23e Congrès du Parti communiste se déroule à Moscou et des rapports font état d'un changement imminent à la tête de l'Union soviétique. Selon le bulletin interne du parti, Lazar Kaganovitch a annoncé sa démission du poste de secrétaire général du Parti communiste et son remplacement a eu lieu le lendemain.\nDeux candidats ont été considérés. Le premier était Dmitri Ustinov, un général soviétique responsable du complexe militaro-industriel soviétique. Ses principales propositions sont une intensification du développement de l'OGAS avec une intégration militaire, des investissements dans la défense civile, des usines souterraines au-delà de l'Oural et une implication plus active dans les activités étrangères. Le deuxième était Alexandre Chelepine, qui a attiré l'attention de Staline après avoir organisé les mouvements partisans dans la région de Moscou et son rôle crucial dans l'Organisation de la jeunesse du Komsomol."

 #Andropov
 SOV_SamanthaSmith.1.d:0 "Cher M. Andropov,\n\nJe m'appelle Samantha Smith.\nJ'ai 10 ans.\nFélicitations pour votre nouveau travail.\nJe m'inquiète de l'entrée de la Russie et des États-Unis dans une guerre nucléaire. Allez-vous voter pour la guerre ou pas ? Si ce n'est pas le cas, dites-moi comment vous allez contribuer à éviter la guerre. Vous n'êtes pas obligé de répondre à cette question, mais j'aimerais bien que vous le fassiez. Pourquoi voulez-vous conquérir le monde ou au moins notre pays ? Dieu a créé le monde pour que nous puissions le partager et en prendre soin. Il ne s'agit pas de se disputer ou de laisser tout un groupe de personnes s'approprier tout. S'il vous plaît, faisons ce qu'il veut et que tout le monde soit heureux aussi.\n\nSamantha Smith\nManchester, Maine, États-Unis.\nBoîte 44 04351\nP.S. Veuillez répondre."
 SOV_SamanthaSmith.3.d:0 "Cher Monsieur l'Ambassadeur,\n\nJe m'appelle Samantha Smith et j'ai 10 ans.\n\nJ'ai entendu dire que vous étiez l'ambassadeur soviétique aux États-Unis. Je suis très heureux que vous soyez ici dans notre pays.\n\nJ'ai écrit à M. Andropov parce que j'ai peur d'une guerre nucléaire entre nos deux pays. Je ne veux pas qu'il déclenche une guerre nucléaire et j'aimerais vraiment qu'il réponde à ma lettre.\n\nJ'ai vu un exemplaire de la Pravda où ma lettre était imprimée. Ils se moquaient de mes questions et de mon âge. Je pense que mes questions étaient correctes et que mon âge n'a aucune importance. La guerre nucléaire est une peur dont tout le monde devrait avoir peur.\n\nJe demande à nouveau à M. Andropov de répondre à ma lettre car elle compte beaucoup pour moi.\n\nMerci,\n\nSamantha Smith\nManchester, Maine, États-Unis.\nBoîte 44 04351"
 SOV_SamanthaSmith.4.d:0 "Chère Samantha,\n\nJ'ai reçu votre lettre, comme beaucoup d'autres qui me sont parvenues récemment de votre pays et d'autres pays du monde.\n\n Il me semble - je le constate par votre lettre - que vous êtes une fille courageuse et honnête, qui ressemble à Becky, l'amie de Tom Sawyer dans le célèbre livre de votre compatriote Mark Twain. Ce livre est bien connu et apprécié dans notre pays par tous les garçons et toutes les filles.\n\nVous écrivez que vous vous inquiétez de savoir s'il y aura une guerre nucléaire entre nos deux pays. Et vous demandez si nous faisons quelque chose pour que la guerre n'éclate pas.\n\nVotre question est la plus importante de celles que tout homme réfléchi peut poser. Je vous répondrai sérieusement et honnêtement.\n\nOui, Samantha, nous, en Union soviétique, essayons de tout faire pour qu'il n'y ait pas de guerre sur Terre. C'est ce que veut tout Soviétique. C'est ce que nous a enseigné le grand fondateur de notre État, Vladimir Lénine.\n\nLes Soviétiques savent très bien à quel point la guerre est une chose terrible. Il y a quarante-deux ans, l'Allemagne nazie, qui luttait pour la suprématie sur le monde entier, a attaqué notre pays, incendié et détruit des milliers de nos villes et villages, tué des millions d'hommes, de femmes et d'enfants soviétiques.\n\nDans cette guerre, qui s'est terminée par notre victoire, nous étions alliés aux États-Unis : ensemble, nous avons lutté pour la libération de nombreuses personnes des envahisseurs nazis. J'espère que vous le savez grâce à vos cours d'histoire à l'école. Et aujourd'hui, nous souhaitons ardemment vivre en paix, commercer et coopérer avec tous nos voisins sur cette terre - avec ceux qui sont éloignés comme ceux qui sont proches. Et certainement avec un grand pays comme les États-Unis d'Amérique.\n\nEn Amérique et dans notre pays, il existe des armes nucléaires - des armes terribles qui peuvent tuer des millions de personnes en un instant. Mais nous ne voulons pas qu'ils soient utilisés. C'est précisément la raison pour laquelle l'Union soviétique a solennellement déclaré au monde entier qu'elle n'utiliserait jamais l'arme nucléaire contre aucun pays. En général, nous proposons d'arrêter leur production et de procéder à l'abolition de tous les stocks sur Terre.\n\nIl me semble que cela constitue une réponse suffisante à votre deuxième question : « Pourquoi voulez-vous faire la guerre au monde entier ou au moins aux États-Unis ? » Nous ne voulons rien de tel. Personne dans notre pays - ni les ouvriers, ni les paysans, ni les écrivains, ni les médecins, ni les adultes, ni les enfants, ni les membres du gouvernement - ne souhaite ni une grande ni une « petite » guerre.\n\nNous voulons la paix - il y a quelque chose qui nous occupe : cultiver du blé, construire et inventer, écrire des livres et voler dans l'espace. Nous voulons la paix pour nous-mêmes et pour tous les peuples de la planète. Pour nos enfants et pour toi, Samantha.\n\nJe vous invite, si vos parents vous le permettent, à venir dans notre pays, le meilleur moment étant cet été. Vous découvrirez notre pays, rencontrerez vos contemporains, visiterez un camp international pour enfants - Artek - au bord de la mer. Et voyez par vous-même : en Union soviétique, tout le monde est pour la paix et l'amitié entre les peuples.\n\nMerci pour votre lettre. Je vous souhaite tout le meilleur dans votre jeune vie.\n\nY.Andropov"
 SOV_SamanthaSmith.5.d:0 "samantha Smith, une fillette de 10 ans du Maine, après avoir écrit une lettre au dirigeant soviétique Yuri Andropov, a été invitée à visiter le pays dans le cadre d'une tournée de bonne volonté. Ayant conquis les coeurs aux États-Unis et en Union soviétique, Samantha est devenue du jour au lendemain une coqueluche des médias.\n\nLes responsables du Département d'État, agissant rapidement, ont proposé plusieurs réponses à cette invitation. Permettre à Samantha de lui rendre visite fournirait des relations publiques parfaites pour montrer une initiative de consolidation de la paix avec l'Union soviétique, et sa présence pourrait véritablement servir de point d'apaisement dans des relations clairement croissantes.\n\nCependant, certains responsables ont exprimé leur inquiétude quant au fait qu'autoriser la visite de Samantha donnerait à l'Union soviétique un levier pour « prendre le dessus sur le plan moral » dans la guerre froide, en particulier parmi les pays dont les relations avec les États-Unis sont en évolution. Il peut être préférable de limiter ses déplacements, soit en ne les sanctionnant pas, soit en condamnant la visite, soit en allant jusqu'à annuler son passeport."
 SOV_SamanthaSmith.6.d:0 "Aujourd'hui, un avion à bord duquel Samantha Smith et ses parents ont atterri à Moscou, entamant ce qui serait le premier jour d'une visite de deux semaines en Union soviétique, à l'invitation du secrétaire général Yuri Andropov.\n\nAprès avoir écrit une lettre à Andropov, inquiet de la menace croissante d'une guerre nucléaire, le dirigeant soviétique a répondu, attirant immédiatement l'attention des médias des deux côtés du rideau. L'inquiétude de Samantha et la réponse sympathique d'Andropov ont apporté le calme nécessaire au milieu des tensions croissantes de la guerre froide.\n\nOn ne sait pas si Smith pourra rencontrer directement Andropov, mais on sait qu'elle fréquentera un camp pour enfants soviétique connu sous le nom d'Artek, situé en Crimée.\n\nLes médias suivront cependant Smith tout au long de son parcours et continueront à rendre compte de ses aventures en Union soviétique."
 SOV_SamanthaSmith.7.d:0 "Sans surprise, les États-Unis ont annoncé aujourd'hui qu'ils empêchaient activement Samantha Smith et ses parents de se rendre en Union soviétique, au motif que leur visite constituait une « menace pour la sécurité nationale des États-Unis ».\n\nApparemment préoccupés par le fait que la visite de Smith pourrait retourner l'opinion publique contre les États-Unis, tant au niveau national qu'international, les responsables du Département d'État ont également catégoriquement condamné l'invitation soviétique comme étant une « stratégie visant à contraindre des enfants innocents, qui ne savent pas à quoi ils sont invités ».\n\nLes médias ont décrié cette décision, mais les médias conservateurs saluent cette décision comme protégeant les enfants et la réputation américaine, alors que la crainte que Smith soit utilisé comme outil de propagande grandissait."