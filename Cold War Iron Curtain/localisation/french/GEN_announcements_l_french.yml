l_french:
 usa_announcement_category:0 "Annonces des États-Unis"
 usa_announcement_category_desc:0 "Annonces étrangères des dirigeants des États-Unis d'Amérique."
 usa_address_korean_war:0 "Discours de Truman sur la guerre de Corée"
 usa_address_korean_war_desc:0 "Le dimanche 25 juin, les forces communistes ont attaqué la République de Corée. Cette attaque a montré clairement, sans aucun doute, que le mouvement communiste international est prêt à recourir à l'invasion armée pour conquérir des nations indépendantes. Un acte d'agression comme celui-ci crée un danger très réel pour la sécurité de toutes les nations libres. L'invasion communiste a été lancée en force, avec des avions, des chars et de l'artillerie. L'ampleur de l'attaque et la rapidité avec laquelle elle a été menée montrent clairement qu'elle avait été planifiée longtemps à l'avance. Cinquante-deux des 59 pays membres des Nations Unies ont apporté leur soutien à l'action entreprise par le Conseil de sécurité pour rétablir la paix en Corée. Sous le drapeau des Nations Unies, un commandement unifié a été établi pour toutes les forces des membres des Nations Unies combattant en Corée. Le général Douglas MacArthur est le commandant de cette force combinée. L'action rapide des Nations Unies pour réprimer les agressions illégales, et la réponse rapide à cette action par les peuples libres du monde entier, constitueront un jalon dans la longue quête de l'humanité pour un Etat de droit entre les nations. En outre, le fait que les forces communistes ont envahi la Corée constitue un avertissement quant à la possibilité que des actes d'agression similaires se produisent dans d'autres parties du monde. Les nations libres doivent être plus que jamais sur leurs gardes contre ce genre d'attaque sournoise."
 prc_announcement_category:0 "Annonces de la République populaire de Chine"
 prc_announcement_category_desc:0 "Annonces étrangères des dirigeants de la République populaire de Chine."
 prc_address_korea_war:0 "Mao offre son soutien à la Corée du Nord"
 prc_address_korea_war_desc:0 "Combien de temps va durer cette guerre ? Ne décidons pas. Laissons Truman et Eisenhower, ou le futur président, décider. Nous nous battrons aussi longtemps qu'ils le voudront, jusqu'à ce que la victoire totale soit remportée."
 eng_announcement_category:0 "Annonces du Royaume-Uni"
 eng_announcement_category_desc:0 "Annonces étrangères des dirigeants du Royaume-Uni de Grande-Bretagne et d'Irlande du Nord."
 eng_address_korean_war:0 "Discours d'Attlee sur la guerre de Corée"
 eng_address_korean_war_desc:0 "Nous sommes confrontés à un défi direct à l'autorité des Nations Unies, un acte d'agression a déjà été commis. Maintenant, vous pouvez organiser toutes sortes de réunions spéciales, que ce soit avec le gouvernement sud-coréen ou américain, je suis d'accord. Parce que la personne n'a pas un très bon caractère, cela n'excuse pas qu'elle tente de l'assassiner. On peut dire que la Chine, la nouvelle Chine, n'est pas sur le terrain de la sécurité. Cela n'affecte ni ne modifie le fait de l'agression. Et si l'organisation des Nations Unies n'était pas jusqu'au bout l'ancienne Société des Nations, il fallait absolument qu'il y soit mis un terme. Et plus de cinquante autres nations les soutiennent dans cet effort visant à préserver la paix mondiale. Cela signifie des risques et des dangers, toute autre cause signifiait des risques et des dangers. Je suis sûr que si nous gagnons, l'autorité dans le monde sera plus grande que celle de l'agresseur. Nous devons dire ici et maintenant que l'agression ne réussira pas."
 usa_address_communism:0 "Truman s'exprime contre l'agression communiste"
 usa_address_communism_desc:0 "Le monde libre doit avoir la force armée, le monde libre doit l'avoir maintenant ! Pas en réserve, pas plus tard mais maintenant ! En tant que président, je vous dis que les dangers dans d'autres parties du monde sont tout aussi grands qu'en Corée. Chaque jour, des rapports arrivent à mon bureau sur les préparatifs militaires soviétiques dans le monde. Si l'un d'entre vous peut consulter ces rapports et recevoir les mêmes informations, il renoncera à penser que le danger est écarté. Nous ne pouvons pas laisser tomber notre conscience, peu importe ce qui se passe en Corée. Nous devons avoir des hommes, des navires, des avions, des chars et des bombes prêts à faire face à toute urgence et si nous les avons, nous devrons les utiliser !"
 prc_announce_formation:0 "Mao déclare la République populaire de Chine"
 prc_announce_formation_desc:0 "La République populaire de Chine et le gouvernement populaire central sont établis aujourd'hui ! Notre gouvernement est le seul gouvernement légitime du peuple dans tout le pays. Tout gouvernement étranger disposé à se conformer aux principes d'égalité, à regrouper les avantages et à respecter la souveraineté territoriale. Notre gouvernement est prêt à établir des relations diplomatiques."
 eng_address_king_death:0 "Discours du Premier ministre Churchill à l'occasion de la mort du roi George VI"
 eng_address_king_death_desc:0 "Durant ces derniers mois, le roi marchait avec la mort comme si la mort était une compagne, une connaissance qu'il reconnaissait et qu'il ne craignait pas. Finalement, la mort est venue en ami, et après une bonne journée de soleil et de sport, et après une bonne nuit à ceux qui l'aimaient le plus, il s'est endormi comme tout homme ou femme qui s'efforce de craindre Dieu et rien d'autre au monde peut espérer le faire. Moi, dont la jeunesse s'est déroulée dans les gloires augustes, incontestées et tranquilles de l'ère victorienne, je pourrais bien ressentir un frisson en invoquant une fois de plus la prière et l'hymne : « Dieu sauve la Reine !"
