 #LEB_mbt_equipment_3:0 "T-55"
 #LEB_mbt_equipment_3_short:0 "T-55"
 #LEB_mbt_equipment_3_desc:0 "The T-55 is an improved version of the T-54 tank. OKB-520 modified the T-55 design by improving NBC protection, giving it a more optimized engine, improving the turret shape, and even added more auxiliary equipment such as improved fire control and optics. Additionally, the T-55 used the 12.7 DShK HMG more often whereas the T-54 used the 7.62 SGMT gun, granting it more firepower but barring it from carrying more ammunition. The T-55 was used in just as many armies and typically saw all the conflicts that the T-54 saw. "
 LEB_mbt_equipment_4:0 "M48A1 Patton"
 LEB_mbt_equipment_4_short:0 "M48A1 Patton"
 LEB_mbt_equipment_5:0 "Char de combat à chenilles complète : canon de 105 mm, M60"
 LEB_mbt_equipment_5_short:0 "M60 Patton"
 LEB_mbt_equipment_5_desc:0 "Le M60 Patton est un CCP conçu par le département des munitions de l'armée américaine en 1960. Il a été utilisé lors de la guerre du Yom Kippour, de l'invasion de la Grenade, du Yémen et du Liban. Il possède un blindage d'environ 220 mm et porte un canon principal de 105 mm. Il utilisait généralement la mitrailleuse M73 de 7,62 x 51 mm comme armement secondaire. Le moteur est un moteur V12 biturbo amélioré qui peut se déplacer à peu près à la même vitesse que le M48. Cependant, malgré un poids légèrement supérieur à celui du M48, le M60 peut se déplacer à peu près à la même vitesse et sur la même différence. Le M60 a subi de nombreuses modifications mineures tout au long de sa vie et compte ainsi environ 4 variantes. Cela signifiait une augmentation du blindage, du poids et une amélioration de la fiabilité."
 LEB_mbt_equipment_6:0 "Char de combat, entièrement chenillé : canon de 105 mm, M60A3 TTC"
 LEB_mbt_equipment_6_short:0 "M60A3 TTC Patton"
 LEB_mbt_equipment_6_desc:0 "Le M60 Patton est un CCP conçu par le département des munitions de l'armée américaine en 1960. Il a été utilisé lors de la guerre du Yom Kippour, de l'invasion de la Grenade, du Yémen et du Liban. Il possède un blindage d'environ 220 mm et porte un canon principal de 105 mm. Il utilisait généralement la mitrailleuse M73 de 7,62 x 51 mm comme armement secondaire. Le moteur est un moteur V12 biturbo amélioré qui peut se déplacer à peu près à la même vitesse que le M48. Cependant, malgré un poids légèrement supérieur à celui du M48, le M60 peut se déplacer à peu près à la même vitesse et sur la même différence. Le M60 a subi de nombreuses modifications mineures tout au long de sa vie et compte ainsi environ 4 variantes. Cela signifiait une augmentation du blindage, du poids et une amélioration de la fiabilité."

 LEB_mechanized_equipment_1:0 "Support universel"
 LEB_mechanized_equipment_1_short:0 "Support universel"

 LEB_mechanized_equipment_4:0 "Transporteur, personnel, entièrement chenillé, blindé, M59"
 LEB_mechanized_equipment_4_short:0 "M59"
 LEB_mechanized_equipment_5:0 "AMX-VCI"
 LEB_mechanized_equipment_5_short:0 "AMX-VCI"
 LEB_mechanized_equipment_6:0 "M113A1" 
 LEB_mechanized_equipment_6_short:0 "M113A1"
 LEB_mechanized_equipment_6_desc:0 "À partir de 1964, le moteur à essence a été remplacé par un moteur Detroit Diesel 6V-53 de 215 ch (160 kW), pour profiter de la meilleure économie de carburant et du risque d'incendie réduit du moteur diesel."
 LEB_mechanized_equipment_7:0 "Transporteur, personnel, entièrement chenillé, blindé, M113A2"
 LEB_mechanized_equipment_7_short:0 "M113A2"
 LEB_mechanized_equipment_7_desc:0 "Le M113A2 est une variante améliorée du M113 fabriquée par Food Machinery Corporation à la fin des années 70. Il a vu des combats partout où le M113 est présent. Dans l'A1, le moteur a été remplacé par le 6V-53. Dans l'A2, le refroidissement du moteur a été amélioré, des barres de torsion plus résistantes ont été introduites pour augmenter la garde au sol, des amortisseurs ont été ajoutés à la suspension, les réservoirs de carburant ont été blindés et des lance-fumées ont été ajoutés."
 LEB_mechanized_equipment_8:0 "Transporteur, personnel, entièrement chenillé, blindé, M113A3"
 LEB_mechanized_equipment_8_short:0 "M113A3"
 LEB_mechanized_equipment_8_desc:0 "En 1987, d'autres améliorations pour une « survie améliorée (sur le champ de bataille) » ont été introduites. Cela comprenait un joug pour la direction au lieu des latéraux, un moteur plus puissant (le Detroit Diesel turbocompressé 6V-53T), des réservoirs de carburant externes et des revêtements internes anti-éclats pour une protection améliorée. Le suffixe A3 est utilisé sur toutes les variantes pour indiquer la mise à niveau vers la norme A3."

 LEB_mechanized_heavy_equipment_6:0 "FMC AIFV-A1-B-C25"
 LEB_mechanized_heavy_equipment_6_short:0 "AIFV-A1-B-C25"
 LEB_mechanized_heavy_equipment_6_desc:0 " Variante mise à jour de l'AIFV d'origine en suspension de service dans l'armée belge similaire au M113A1-B (similaire au M113A2), un système NBC et un système d'extinction d'incendie au halon."
 LEB_mechanized_heavy_equipment_7:0 "M2A2 Bradley ODS"
 LEB_mechanized_heavy_equipment_7_short:0 "M2A2 Bradley ODS"
 LEB_mechanized_heavy_equipment_7_desc:0 "Le M2 ODS Bradley est une variante améliorée du Bradley développé par BAE Systems en 1991. L'ODS présentait un intérieur optimisé, un blindage réactif explosif et une transmission hydromécanique. Bien que l'armure réactive ait eu un coût et a empêché le Bradley de nager. L'ODS a également ajouté un meilleur télémètre, un système de navigation, une contre-mesure de missile et un système d'imagerie thermique. De plus, un très petit chauffe-aliments et une station de confort ont été ajoutés, ce qui est considéré par certains comme la meilleure innovation."

 LEB_motorized_equipment_1:0 "GMC CCKW 6x6"
 LEB_motorized_equipment_1_short:0 "CCKW 6x6"
 LEB_motorized_equipment_2:0 "RÉO M35 6x6"
 LEB_motorized_equipment_2_short:0 "M35 6x6"
 LEB_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 LEB_motorized_equipment_3:0 "AM Général M809 6x6"
 LEB_motorized_equipment_3_short:0 "M809 6x6"
 LEB_motorized_equipment_3_desc:0 "Le M809 est un camion 6x6 de 5 tonnes conçu par AM General en 1970. Il a été utilisé dans tous les conflits américains de 1970 à 1982. Le M809 utilise un moteur NH250, une transmission à 5 vitesses/2 gammes et des essieux à poutre dynamique sur ressorts à lames. Il peut transporter une charge de 5 000 lb. Il a une vitesse de 52 mph sur 350 miles et obtient 10 mi/gal. En plus d'être utilisé pour le transport et le fret, le véhicule est très solide et peut supporter des composants utilitaires sur son plateau. Ceux-ci incluent la possibilité de monter des kits de dépanneuse, des bennes, des remorques, de grandes fourgonnettes pour le soutien/confort, des équipements de pontage et quelques autres. Le M809 peut également traverser des rivières peu profondes grâce à sa garde au sol élevée et est très efficace sur route ou hors route grâce à sa suspension. "
 LEB_motorized_equipment_4:0 "AM Général M939 6x6"
 LEB_motorized_equipment_4_short:0 "M939 6x6"
 LEB_motorized_equipment_4_desc:0 "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis 1982. Le M939 utilise un moteur 6CTA8.3, une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Le véhicule est capable de transporter une charge de 10 000 lb. Il peut se déplacer à 6,3 mph sur 350 miles et obtient 6 mi/gal. Il est toujours utilisé aujourd'hui. Le M939 est très efficace sur tous les terrains et convient bien aux intempéries. Le M939 a permis une nouvelle génération de camions, de moteurs principaux et de véhicules de dépannage et a fait l'objet d'une fabrication intensive. Il est plus fiable et plus résistant que les véhicules précédents et a complètement supplanté les contrats de production antérieurs. "
 LEB_motorized_equipment_5:0 "Famille Oshkosh de véhicules tactiques moyens 6x6"
 LEB_motorized_equipment_5_short:0 "FMTV 6x6"
 LEB_motorized_equipment_5_desc:0 "La famille de véhicules tactiques moyens (FMTV) est une série de véhicules, basés sur un châssis commun, qui varient en fonction de la charge utile et des exigences de la mission. Le FMTV est dérivé du camion autrichien Steyr 12 M 18, mais considérablement modifié pour répondre aux exigences de l'armée américaine, celles-ci comprenant un minimum de 50 pour cent de contenu américain."

