 LEB_jet_light_equipment_5:0 "Embraer EMB 314 Super Tucano"
 LEB_jet_light_equipment_5_short:0 "A-29 Super Tucano"
 LEB_jet_light_equipment_5_desc:0 "L'Embraer EMB 314 Super Tucano, également nommé ALX ou A-29, est un avion d'attaque léger à turbopropulseurs brésilien conçu et construit par Embraer dans le cadre d'un développement de l'Embraer EMB 312 Tucano. L'A-29 Super Tucano transporte une grande variété d'armes, y compris des munitions à guidage de précision, et a été conçu pour être un système peu coûteux utilisé dans des environnements à faible menace."

