 #Lebanon firearms
 LEB_infantry_equipment_0:0 "MAS-36"
 LEB_infantry_equipment_0_short:0 "MAS-36"
 LEB_infantry_equipment_0_desc:0 "Le MAS-36 est un fusil à verrou conçu en 1927 chambré dans une cartouche française de 7,62x54 mm, et a été adopté par l'armée française en 1936 en remplacement des fusils de service Berthier et Lebel. Il a été utilisé en nombre limité pendant la Seconde Guerre mondiale, mais en raison de la production de masse après la fin de la guerre, il a été utilisé dans de nombreux conflits impliquant de nombreuses nations différentes. Les fusils produits après la Seconde Guerre mondiale ont connu quelques améliorations en termes d'ergonomie. Il a même vu quelques variantes qui ont vu l'ajout d'une grenade à fusil amovible et d'un modèle de tireur d'élite. On s'attendait à ce qu'il ne s'agisse que d'un fusil provisoire, construit sur des machines pouvant être utilisées pour construire les fusils à chargement automatique prévus"

 LEB_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 LEB_infantry_equipment_1_short:0 "FN FAL"
 LEB_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 LEB_infantry_equipment_2:0 "Fusil américain, calibre 5,56 mm, M16"
 LEB_infantry_equipment_2_short:0 "M16"
 LEB_infantry_equipment_2_desc:0 "Les responsables militaires américains ont noté que la carabine M2 était largement surclassée par l'AK47 et le StG44 allemand et, en 1956, le développement du M16 a commencé. En 1959, l'arme fut achevée par Eugene Stoner et James Sullivan. Il affichait des capacités exceptionnelles et surclassait l'AK47 et l'AKM. Plus particulièrement, l'arme a beaucoup plus de puissance de feu que la carabine M2 et était plus précise que l'AK47 et transportait des munitions plus légères avec une perte de compétence minimale. Cependant, bien qu'il ait surclassé l'AK47 dans les tests généraux, il présentait une faible fiabilité qui pouvait l'empêcher d'être considéré comme son égal. Surtout au Vietnam, où les échecs étaient très fréquents."

 LEB_infantry_equipment_3:0 "Fusil américain, 5,56 mm, M16A2"
 LEB_infantry_equipment_3_short:0 "M16A2"
 LEB_infantry_equipment_3_desc:0 "Après le manque de fiabilité fréquent de l'arme dans les jungles du Vietnam, le corps des marines américains a demandé une refonte de l'arme. En 1982, la refonte et les améliorations ont été apportées. L'arme comportait un récepteur renforcé, de nouvelles rayures, un boîtier renforcé, un meilleur refroidissement grâce à différents matériaux, un support amélioré pour les éléments attachables et un mécanisme interne repensé qui lui conférait un haut niveau de fiabilité. Il a été témoin de combats au Liban, en Libye, en Égypte et dans tous les autres conflits dans lesquels les États-Unis ont participé depuis leur création."

 LEB_infantry_equipment_4:0 "Carabine, calibre 5,56 mm, M4 "
 LEB_infantry_equipment_4_short:0 "Carabine M4"
 LEB_infantry_equipment_4_desc:0 "La carabine M4 est une nouvelle amélioration par rapport au M16A2. Il a été initialement commandé pour être conçu par une grande équipe ad hoc de concepteurs en 1984 et le développement s'est terminé en 1993. Après 9 ans de développement, j'espère que cela aurait valu la peine d'attendre. Il présente un plus grand niveau de fiabilité et est beaucoup plus léger et plus court. Principalement grâce à des matériaux améliorés, il est plus précis que le M16A2. Sa taille compacte le rend plus polyvalent et plus facile à utiliser que le M16A2. La carabine M4 a été utilisée lors de la guerre américaine en Afghanistan, de la guerre en Irak et de la guerre contre l'Etat islamique."
 
