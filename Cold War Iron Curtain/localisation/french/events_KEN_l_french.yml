l_french:

 kenya.1.d:0 "Oh doux chef, comme nous vous aimions tant ! Hier soir, le Commonwealth a perdu l'une de ses figures les plus fidèles et charismatiques d'Afrique de l'Est. Juste à l'extérieur de Nairobi, le chef bien-aimé était conduit avec son chauffeur lorsque trois hommes armés ont tiré à travers la voiture, tuant Waruhiu sur le coup. Waruhiu était un véritable défenseur de la domination coloniale britannique, un critique ouvert des groupes indépendantistes et de divers peuples autochtones qui se disputaient une autonomie inutile. Ces meurtriers sont appelés Mau Mau, nos secrétaires associent cet assassinat à de multiples autres meurtres et actes de violence envers les colons blancs de la colonie et du protectorat du Kenya."
 kenya.4.d:0 "Le Kenya, comme de nombreux pays swahili, regorge de nombreuses organisations et mouvements ethniques impénétrables pour les observateurs britanniques extérieurs. Des mystiques itinérants, des chefs de sectes et des populistes tribaux, et tant d'émerveillements à travers le pays, mais récemment, il y a eu des rapports faisant état de mouvements importants de membres de la tribu Kikuyu ; voyageant en armées organisées. Ceci, culminant avec les récentes hostilités des peuples autochtones et des colons blancs dans les hautes terres, amène certains à se demander si quelque chose de plus sinistre ne se prépare pas."
 kenya.5.d:0 "Ainsi se termine le mandat de huit ans de Sir Philip Euen Mitchell comme gouverneur. Il eut une administration pittoresque et humble, car peu de choses notables se produisirent après la dissolution des sections majeures des King's African Rifles après la Seconde Guerre mondiale. Tandis que contrairement à cette croyance britannique antérieure, il existe un grand désespoir pour le gouverneur parmi l'intelligentsia kenyane, car il décrit les indigènes du Kenya comme « un exemple unique d'un des seuls peuples au monde sans histoire ni culture » et son attitude condescendante et paternaliste envers les indigènes alors qu'il suivait l'approche traditionnelle du « fardeau de l'homme blanc » pour les Africains."
 kenya.6.d:0 "Ces dernières années, un prophète nommé Lukas Pkech a gagné des adeptes pour son mouvement prophétique. Pour ses opinions anti-européennes au vitriol et son incitation à la haine, il a été condamné pour sédition et emprisonné. Cependant, le prophète a échappé à sa détention et a dirigé plusieurs fidèles à travers le pays. Le gouverneur provisoire, Alan Stevens, affronte le prophète avec ses quelque 300 partisans armés de lances."
 KLFA_uprising:0 "Le soulèvement des Mau Mau se poursuit"
 Tom_Mboya:0 "Tom Mboya"
 kenyan_decisions_0:0 "La colonie et le protectorat du Kenya dans les années 1950"
 kenyan_decisions_0_desc:0 "La colonie et protectorat du Kenya n'est pour le moins pas une colonie modèle. Alors que la plupart des habitants du Royaume-Uni continental ne pensent presque jamais à cette nation de leur empire avec ses 6 millions d'habitants vivant dans un ensemble de quatre grandes villes et pour la plupart de petites villes, la majorité africaine du Kenya pense régulièrement à son statut de sujet britannique. Établi au point culminant de la ruée vers l'Afrique, le Kenya, en tant que colonie, est principalement peuplé de l'ethnie Kikuyu, avec un niveau notable d'entreprises et d'installations britanniques locales. Comme dans toute colonie africaine, il existe au Kenya une petite minorité de jeunes étudiants et d'intelligentsia anticoloniaux et panafricanistes, principalement organisée autour du militant Jomo Kenyatta. Cependant, la population rurale du pays, en grande partie analphabète, constitue la véritable menace à la stabilité coloniale du Kenya, alors que des prophètes et des mystiques itinérants forment des milices dans les campagnes des hauts plateaux du centre."

