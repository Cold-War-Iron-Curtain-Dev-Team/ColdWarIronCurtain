 lee_beomseok_desc:0 "§YDonnées personnelles :§L\nNé : 11 décembre 1900, Jungseo, Hanseong-bu\nDécédé : 11 mai 1972 Jung-gu, ville métropolitaine spéciale de Séoul\n§YAlma mater :§L\nAcadémie militaire du Yunnan en Chine\n§YPromotions :§L\n1948 Général\n§YCommandes :§L\n1920-1921 Le chef de l'Académie militaire de Bukrogunjungseo, Yeonseongdaejang de l'Académie militaire de Bukrogunjungseo\n1922-1923 Commandant cavalier du Corps de l'indépendance coréenne\n1922-1925 Commandant du district Primorsky de l'Armée nationale commune de l'Union soviétique\n1928 Commandant de l'armée révolutionnaire de Goryeo\n1931-1932 Directeur des opérations des forces anti-japonaises dans le nord-est de la Chine (général de division)\nÉquipe d'inspection militaire européenne de longévité du Nord-Est de 1933\n1935 Chef de l'Académie militaire centrale chinoise de Luoyang, instructeur et officier\n1936 Commandant du régiment de cavalerie de l'armée chinoise\n1937-1939 Chef d'état-major de l'armée chinoise\n1939-1941 Commandant de compagnie, instructeur du groupe de formation du Comité exécutif central du KMT de Chine\n1940-1942 Chef d'état-major de l'Armée de libération de la Corée\n1942 Vice-chef d'état-major de l'Armée de libération de la Corée\n1942-1945 chef du 2e district de l'Armée de libération de Corée\n1948 Secrétaire à la Défense\n§YRelation avec les autres dirigeants :§L\nLee Beom-seok est une légende dans l'histoire de la lutte armée, mais peu d'officiers survivants lui sont liés. De plus, en raison de sa nature fougueuse, de nombreux officiers ne s'entendent pas avec lui, comme §YJi Cheong-cheon§L. On peut dire que §YLee Joon-sik§L, le chef du Jokcheong, est proche de lui.\n§YOpinion américaine :§L Neutre"
 ji_cheongcheon_desc:0 "§YDonnées personnelles :§L\nNé : 15 février 1888 Bukbu, Hanseong-bu\nDécédé : 15 janvier 1957 Seongdong-gu, ville métropolitaine spéciale de Séoul\n§YAlma mater :§L\nAcadémie militaire de l'Empire coréen\nAcadémie militaire du Japon\n§YPromotions :§L\n1914 Sous-lieutenant (armée japonaise)\nLieutenant-général (Armée Nationale Révolutionnaire)\n1940 Général (Armée de libération coréenne)\n§YCommandes :§L\n1919 Instructeur de l'Académie militaire Shin Hung\n1919-1920 Officiel Seorogunjungseo\n1920-1921 Commandant du Corps indépendantiste coréen\n192?-192? Directeur de l'Académie de l'Armée Révolutionnaire de Goryeo\n1930-1934 Commandant de l'Armée indépendantiste coréenne\n1934-1935 Instructeur de la classe spéciale coréenne à l'Académie militaire de Luoyang\n1940-1946 Commandant de l'Armée de libération de la Corée\n§YRelation avec les autres dirigeants :§L\nJi Cheng-cheon a §YLee Eung Joon§L parmi la même classe de l'Académie de l'armée japonaise.\n§YOpinion américaine :§L §RPas bon§L"
 yu_dongyeol_desc:0 "§YDonnées personnelles :§L\nNé : 26 mars 1879, comté de Pakchon, province de Pyeongan\nDécédé : 18 octobre 1950 Comté de Huichon, province de Phyongan du Nord\n§YAlma mater :§L\nAcadémie militaire du Japon\n§YPromotions :§L\n190 ? Major (Armée de l'Empire coréen)\nChef d'état-major de l'Armée de libération de la Corée\n§YCommandes :§L\n190 ? Instructeur de l'Académie Militaire\n190 ? Commandant du Cavarly\n190 ? Le deuxième chef d'état-major\n194 ? Le chef d'état-major de l'Armée de libération de la Corée\n§YRelation avec les autres dirigeants :§L\nYu Dong-yeol a aidé à jeter les bases de l'armée coréenne avec la persuasion de §YLee Eung Joon§L, un homme important de la faction de l'académie militaire japonaise. Il a également l'habitude de bloquer la promotion de §YKim Jong-gap§L, affirmant que sa famille est plébéienne. Comme Kim Jong-kap, il n'y a pas un ou deux officiers dont la promotion est bloquée, ce qui rend difficile d'espérer le soutien des officiers subalternes même si Yu Dong-yeol conserve son poste pendant longtemps.\n§YOpinion américaine :§L §RDétesté§L"
 song_hosung_desc:0 "§YDonnées personnelles :§L\nNé : 19 septembre 1889, comté de Hamheung, Hamheung-bu\nDécédé : 24 mars 1959 Comté de Yangdok, province de Phyongan du Sud\n§YAlma mater :§L\nAcadémie militaire de Baoding\nAcadémie militaire de Corée\n§YPromotions :§L\n1948 Général de brigade\n§YCommandes :§L\n19 ?? Commandant du bataillon de cavalerie de l'Armée nationale révolutionnaire\n19 ?? Commandant du régiment de l'Armée Nationale Révolutionnaire\n19 ?? Commandant de division de l'Armée Nationale Révolutionnaire\n1942-1946 chef du 5e district de l'Armée de libération de la Corée\n1946-1948 Commandant en chef de l'armée de la police coréenne\n1948 Commandant en chef de la police coréenne\n1948 Commandant en chef de l'armée\n19 ?? Surintendant de l'Académie militaire de Corée\n§YRelation avec les autres dirigeants :§L\nSong Ho-sung est incompétent, donc l'évaluation de base n'est pas bonne. §YLee Beom-seok§L a ouvertement ignoré Song Ho-sung, est un opposant politique depuis l'époque de l'Armée de l'indépendance avant la libération, et après la libération, il le critique comme une personne qui n'est pas anticommuniste et déteste Song Ho-sung dans la mesure où il embarrasse ses subordonnés. De plus, Song a §YPark Chung-hee§L comme adjoint.\n§YOpinion américaine :§L §RDétesté§L"
 chae_byungtuk_desc:0 "§YDonnées personnelles :§L\nNé : 17 avril 1915 Pyeongyang-bu, Pyeongannam-do\nDécédé : 26 juillet 1950 Comté de Hadong, Gyeongsangnam-do\n§YAlma mater :§L\nAcadémie militaire du Japon\nÉcole d'anglais militaire\n§YPromotions :§L\n1948 Général de brigade\n§YCommandes :§L\nCommandant de bataillon de 1946\n1946-1948 Directeur général du Département des effectifs militaires\n1948 commandant de la 4e brigade\n1948-1949 Chef d'état-major du ministère de la Défense nationale\n1949 Le chef d'état-major de l'armée\n1949-1950 Chef de la Division de l'administration des armes\n1950 Le chef d'état-major de l'armée\n§YRelation avec les autres dirigeants :§L\nOutre ses capacités, Chae Byung-tuk entretenait de bonnes relations avec les officiers qui l'entouraient. Il était proche de §YLee Jong Chan§L depuis qu'il était à l'Académie de l'armée japonaise, et c'est Lee Jong-chan qui l'a découragé de quitter l'école. C'est également Lee Jong Chan qui a dissuadé Chae Byung-tuk de prendre sa retraite, qui a ensuite été rétrogradé à un poste. Il entretient également une relation solide avec §YChung Il-kwon§L, et c'est Chae Byung-tuk qui a continué à faire de son mieux pour soutenir Chung Il-kwon, qui est arrivé en remplacement de Chae Byung-tuk. Cependant, il entretient de mauvaises relations avec Kim Suk-won, diplômé de la même académie militaire japonaise, car les deux se sont violemment affrontés lors de l'incident du lieu jaune.\n§YAvis américain :§L §RFat Chae§L"
