 CUB_Crush_the_26th_of_July_Movement:0 "Écraser le mouvement du 26 juillet"
 CUB_Implement_Land_Reform:0 "Mettre en oeuvre la réforme agraire"
 CUB_the_final_revoultion:0 "La révolution finale"
 CUB_the_final_revoultion_desc:0 "Cuba ne sera plus témoin de la corruption que Batista a infligée au peuple du vieux Cuba."
 CUB_bay_of_pigs_victory:0 "Victoire de la Baie des Cochons"
 CUB_bay_of_pigs_victory_desc:0 "Le gouvernement socialiste de Cuba n'existe plus, place à la libération du Grand Problème cubain."
 CUB_victorious_blaze:0 "Flamme victorieuse"
 CUB_victorious_blaze_desc:0 "Batista l'avait prévu depuis longtemps, ce n'était qu'une question d'effort."
 CUB_the_cuban_missile_crisis:0 "La crise des missiles de Cuba"
 CUB_the_cuban_missile_crisis_desc:0 "Les États-Unis cherchent à briser Cuba avec leur sale impérialisme. Nikita Khrouchtchev aidera Cuba dans la lutte contre les impérialistes."
 CUB_the_provisional_cuban_government:0 "Le gouvernement provisoire de Cuba"
 CUB_the_provisional_cuban_government_desc:0 "Cuba doit se réconcilier avec les devoirs qu'elle doit assumer."
 CUB_the_shut_down_of_brothels:0 "La fermeture des bordels"
 CUB_the_shut_down_of_brothels_desc:0 "Les bordels sont un symbole de la corruption dans l'histoire de Cuba depuis le régime de Batista. Que si cela laisse les gens au chômage, les gens devront endurer."
 CUB_crusades_against_corruption:0 "Croisades contre la corruption politique"
 CUB_crusades_against_corruption_desc:0 "La raison pour laquelle Batista a pris le pouvoir était entièrement due à son désir d'attaquer la population cubaine lors des élections de 1953."
 CUB_political_intensity:0 "Intensité politique"
 CUB_political_intensity_desc:0 "Le mouvement du 4 juillet s'est montré agressif sur le long terme car il est divisé entre le nationalisme cubain et le collectivisme cubain."
 CUB_governmental_resignation:0 "Démission gouvernementale"
 CUB_governmental_resignation_desc:0 "Si le régime actuel devait rester, cela ne ferait qu'intensifier la crise politique. Le gouvernement doit se retirer."
 CUB_educational_rehabilitation:0 "Réadaptation éducative"
 CUB_educational_rehabilitation_desc:0 "Sous le régime de Batista, Cuba a dû beaucoup sacrifier pour rester en vie. L'une de ces choses était le fondement de l'éducation cubaine."
 CUB_regime_stabilization:0 "Stabilisation du régime"
 CUB_regime_stabilization_desc:0 "Le régime actuel est enfin une stabilisation jusqu'à une décision gouvernementale."
 CUB_execution_of_the_batista_era:0 "L'exécution de l'ère Batista"
 CUB_execution_of_the_batista_era_desc:0 "Cuba en a finalement eu assez des nuisances de Batista, car cela a eu un impact négatif sur l'histoire de Cuba."
 CUB_public_persuadsion:0 "Persuasion publique"
 CUB_public_persuadsion_desc:0 "Pour que le prochain régime prenne le pouvoir, il aura besoin d'aide pour se stabiliser."
 CUB_che_in_the_barracks:0 "Guevara à la caserne"
 CUB_che_in_the_barracks_desc:0 "Ce n'est pas pour rien qu'Ernesto Guevara a été nommé responsable de la caserne cubaine ; et cette raison est de se débarrasser de toute influence pro-Batista dans l'établissement par tous les moyens nécessaires."
 CUB_youth_indoctination:0 "Endoctrinement des jeunes"
 CUB_youth_indoctination_desc:0 "La jeunesse a sauvé Cuba une fois de plus. Ils doivent continuer à le sauver."
 CUB_path_to_democracy:0 "Chemin vers les valeurs démocratiques"
 CUB_path_to_democracy_desc:0 "La démocratie, même si elle n'est pas fidèle à nos idéaux, doit être assurée pour la protection du peuple cubain."
 CUB_one_party_socialism_in_the_cuban_state:0 "Le socialisme à parti unique dans l'État cubain"
 CUB_one_party_socialism_in_the_cuban_state_desc:0 "Cuba ne pouvait être pleinement assurée par les idéaux du socialisme que par des moyens énergiques."
 CUB_the_crazied_devil_che_guervara:0 "Le Diable Fou Che Guevara"
 CUB_the_crazied_devil_che_guervara_desc:0 "Ernesto Guevara a le soutien du peuple cubain, c'est lui qui doit nous diriger pour l'instant."
 CUB_a_revoultionary_regiment:0 "Un régiment révolutionnaire"
 CUB_a_revoultionary_regiment_desc:0 "Guevara souhaite avoir son propre régiment de partisans révolutionnaires, formés par d'anciens républicains de l'Espagne décédée."
 CUB_cultural_revoultion:0 "Révolution culturelle"
 CUB_cultural_revoultion_desc:0 "Cuba sera toujours réglée avec de sales impérialistes, à moins que nous ne fassions quelque chose."
 CUB_the_soldier_raul_castro:0 "Le soldat Raul Castro"
 CUB_the_soldier_raul_castro_desc:0 "Raul Castro a l'intention d'amener Cuba vers un État de type isolationniste."
 CUB_mafia_witch_hunts:0 "Chasses aux sorcières mafieuses"
 CUB_mafia_witch_hunts_desc:0 "Peu importe dans quelle partie du monde, nous ferons de notre mieux pour effacer la mafia et tous ses idéaux de la surface de la planète pour ce qu'ils ont fait à la glorieuse Cuba."
 CUB_state_visit_to_the_USA:0 "Visite d'État aux États-Unis"
 CUB_state_visit_to_the_USA_desc:0 "Cuba est secrètement dirigée par un régime de gauche, sous leur nez, le régime actuel devra en tenir compte et planifier une visite à Washington pour éviter certains soupçons de la part du gouvernement américain."
 CUB_the_progressive_movement:0 "Le mouvement progressiste"
 CUB_the_progressive_movement_desc:0 "Le Mouvement Progressiste est ce que le peuple cubain a essayé de recréer à partir de la destruction du Parti Authentique et du Parti Orthodoxe."
 CUB_increase_wages_for_the_middle_class:0 "Augmenter les salaires de la classe moyenne."
 CUB_increase_wages_for_the_middle_class_desc:0 "Les classes moyennes et inférieures doivent progresser jusqu'à devenir les fondements de la place des riches, pour une amélioration ultérieure."
 CUB_introduce_a_welfare_state:0 "Introduire un État-providence"
 CUB_introduce_a_welfare_state_desc:0 "Le régime a des sympathies pour les idéaux d'un capital social."
 CUB_national_industrialization:0 "Industrialisation nationale"
 CUB_national_industrialization_desc:0 "Cuba cherche à s'industrialiser ces derniers temps."
 CUB_moderate_socialism:0 "Socialisme modéré"
 CUB_moderate_socialism_desc:0 "Bien qu'il ne s'agisse pas d'un « vrai » socialisme, cela pourrait réduire la controverse à Cuba."
 CUB_progressive_land_reform:0 "Réforme agraire progressive"
 CUB_progressive_land_reform_desc:0 "Une réforme agraire devra être mise en place afin de compenser la quantité de terres que Cuba possède en sa possession."
 CUB_the_world_revoultion:0 "La révolution mondiale"
 CUB_the_world_revoultion_desc:0 "Si le monde ne veut pas de révolution, de nos idéaux, la révolution devra venir au globe."
 CUB_rebellion_in_the_americas:0 "Rébellion dans les Amériques"
 CUB_rebellion_in_the_americas_desc:0 "Les Amériques ne seront plus la cheville ouvrière des États-Unis, elles seront un monde de pays collectivisés semblables à notre propre Union."
 CUB_cooperation_in_buenos_aires:0 "Coopération à Buenos Aires"
 CUB_cooperation_in_buenos_aires_desc:0 "L'Argentin Peron a laissé une marque dans l'histoire argentine avec des sympathies à gauche et à droite, une alliance économique sera envoyée de La Havane à Buenos Aires."
 CUB_bolivian_socialism:0 "Socialisme bolivien"
 CUB_bolivian_socialism_desc:0 "La Bolivie semble extrêmement faible, notamment en raison du désespoir qu'elle a dû endurer de la part de ses voisins et des États-Unis."
 CUB_racial_opptunity:0 "Opportunité raciale"
 CUB_racial_opptunity_desc:0 "Cuba sera connue comme un haut lieu des idéaux antiracistes."
 CUB_colombian_leftism:0 "Le gauchisme colombien"
 CUB_colombian_leftism_desc:0 "La Colombie est en ruine à gauche comme à droite, mais Cuba ne cherche que la gauche."
 CUB_the_secret_revoultion:0 "La révolution secrète"
 CUB_the_secret_revoultion_desc:0 "Le Mouvement du 4 juillet s'est élevé contre notre mépris d'une société démocratique et s'est en conséquence enfui vers des efforts plus radicaux."
 CUB_extensive_taxation:0 "Une fiscalité étendue"
 CUB_extensive_taxation_desc:0 "Qu'elle soit riche ou pauvre, Cuba souhaite la collectivisation de tous les biens de valeur pour reconstruire notre grandeur."
 CUB_posadist_legacy:0 "Un nouvel héritage"
 CUB_posadist_legacy_desc:0 "Développé en Argentine amicale; Le posadisme est une idéologie de la branche du trotskisme dans laquelle une société avancée comme la nôtre doit être aussi avancée que les êtres extraterrestres."
 CUB_removal_of_private_property:0 "La suppression de la propriété privée"
 CUB_removal_of_private_property_desc:0 "La propriété privée ne fait que diviser les classes, il faut la collectiviser à l'extrême."
 CUB_rally_for_rocketry:0 "Rassemblement pour les fusées"
 CUB_rally_for_rocketry_desc:0 "La seule façon de rencontrer nos héros est de voler au-delà des étoiles, sinon aujourd'hui, ce sera demain."
 CUB_consolidation_of_power:0 "Consolidation du pouvoir"
 CUB_consolidation_of_power_desc:0 "De nombreux régimes avant nous ont lamentablement échoué en raison de l'échec de leur action de consolidation politique"
 CUB_anti_communist_rhetoric:0 "Rhétorique anticommuniste"
 CUB_anti_communist_rhetoric_desc:0 "Le communisme n'apporte que la destruction et encore plus de troubles politiques et civils. C'est pourquoi cela est préjudiciable à l'avenir de Cuba."
 CUB_prosecution_of_batistos:0 "Poursuites contre les fidèles partisans de Batista"
 CUB_prosecution_of_batistos_desc:0 "Batista a des adeptes d'un geste fou, que si leur poursuite est violente ou constitutionnelle, Cuba ne peut pas les laisser marcher librement."
 CUB_deal_with_the_usa:0 "Traiter avec les États-Unis"
 CUB_deal_with_the_usa_desc:0 "Les États-Unis d'Amérique ont aidé notre régime jusqu'à présent, autant poursuivre la tendance."
 CUB_strike_against_leftist_strongholds:0 "Grève contre les bastions de gauche"
 CUB_strike_against_leftist_strongholds_desc:0 "Si la poursuite de la dénonciation de gauche nuit gravement à notre situation difficile, une option radicale pourrait peut-être être la solution à leurs plaintes."
 CUB_cuban_isolationism:0 "Isolationnisme cubain"
 CUB_cuban_isolationism_desc:0 "Le peuple cubain est fatigué de l'ingérence des États-Unis dans les affaires cubaines. Après cela, la balade américaine peut cesser ses raids sur Cuba pendant un certain temps."
 CUB_prosecution_against_batista:0 "Poursuite contre Batista"
 CUB_prosecution_against_batista_desc:0 "Que les Nations Unies soient de notre côté ou non, Batista devrait être traduit en justice par tous les moyens possibles."
 CUB_allow_the_secular_clubs:0 "Autoriser les clubs laïcs"
 CUB_allow_the_secular_clubs_desc:0 "Ces clubs encouragent les comportements illégaux et ont été extrêmement encouragés sous le régime de Batista, mais si nous devions les fermer ; les emplois des gens pourraient être assiégés."
 CUB_ban_the_secular_clubs:0 "Interdire les clubs laïcs"
 CUB_ban_the_secular_clubs_desc:0 "Ces clubs encouragent les comportements illégaux et ont été extrêmement encouragés sous le régime de Batista, mais cela n'a pas d'importance ; Cuba devra endurer la douleur pour devenir une nation plus civilisée sur la scène mondiale."
 CUB_crackdown_on_infamous_corruption:0 "Répression contre la corruption infâme"
 CUB_crackdown_on_infamous_corruption_desc:0 "Batista a peut-être permis à la mafia de se déplacer sur le sol cubain, mais la junte militaire ne permettra pas qu'une telle chose se reproduise."
 CUB_the_education_womb:0 "Le ventre de l'éducation"
 CUB_the_education_womb_desc:0 "L'éducation a été détruite sous le régime de Batista, il est de la plus haute importance de détruire les maisons closes et de construire des écoles à la place."
 CUB_soviet_guarentee:0 "Garantie soviétique"
 CUB_soviet_guarentee_desc:0 "Cuba possède des missiles nuisibles aux États-Unis, c'est à l'URSS de décider de les utiliser ou non, mais ce que l'on sait de Cuba serait notre indépendance menacée par rapport à la rhétorique impérialiste des États-Unis."
 CUB_cuban_missiles:0 "Missiles cubains"
 CUB_cuban_missiles_desc:0 "Ces missiles soviétiques sont ce dont Cuba avait besoin, même si l'URSS ne le sait pas, Cuba démontera certains de ces missiles pour notre propre gain guidé."
 CUB_consolidation_of_the_caribbean:0 "Consolidation des Caraïbes"
 CUB_consolidation_of_the_caribbean_desc:0 "Les États-Unis ont un bastion effrayant dans les Caraïbes, en fonction de leur influence, ils peuvent obtenir Haïti et la République Dominicaine."
 CUB_goal_against_the_domician:0 "But contre le Dominicain"
 CUB_goal_against_the_domician_desc:0 "La République Dominicaine constitue une menace pour le marxisme cubain, la consolidation de Cuba est en cours."
 CUB_attack_haiti:0 "Invasion d'Haïti"
 CUB_attack_haiti_desc:0 "Haïti sera libéré de l'impérialisme américain"
 CUB_prepare_for_an_us_counterattack:0 "Préparez-vous à une invasion américaine"
 CUB_prepare_for_an_us_counterattack_desc:0 "Les Filthy Imperialists pensent qu'ils peuvent simplement entrer à Cuba sans aucune résistance, ils s'attendront à un combat."
 CUB_anti_aircraft:0 "Anti-aérien"
 CUB_anti_aircraft_desc:0 "Cuba doit être protégée des invasions aériennes."
 CUB_prime_minister_castro:0 "Premier ministre Fidel Castro"
 CUB_prime_minister_castro_desc:0 "Fidel Castro a déjà dirigé ce pays, pourquoi pas officiellement ?"
 CUB_agarian_land_reform:0 "Réforme agraire"
 CUB_agarian_land_reform_desc:0 "Le territoire sera partagé également entre les masses."
 CUB_finacial_distribution:0 "Répartition financière"
 CUB_finacial_distribution_desc:0 "Tous les Cubains, partout dans le monde, auront des chances égales."
 CUB_military_isolation:0 "Isolement militaire"
 CUB_military_isolation_desc:0 "Raul Castro n'est ni une marionnette de l'Union soviétique ni de la République populaire de Chine."
 CUB_closer_ties_with_the_prc:0 "Des liens plus étroits avec la République populaire de Chine"
 CUB_closer_ties_with_the_prc_desc:0 "La RPC a de grands idéaux que le Che partage ; peut-être qu'ensemble, la révolution pourra continuer."
 CUB_closer_ties_with_the_USSR:0 "Des liens plus étroits avec l'Union soviétique"
 CUB_closer_ties_with_the_USSR_desc:0 "L'Union soviétique est le plus grand exportateur de la Révolution, son objectif est similaire au nôtre : se débarrasser de l'impérialisme occidental."
 CUB_venture_in_africa:0 "Entreprises en Afrique"
 CUB_venture_in_africa_desc:0 "L'Afrique est le maillon le plus faible de l'impérialisme occidental, notre travail consiste à libérer sa population de l'oppression."
 CUB_state_visit_to_santiago:0 "Visite d'État à Santiago"
 CUB_state_visit_to_santiago_desc:0 "Avec le succès du gauchisme dans l'un des plus forts d'Amérique du Sud, les puissances alliées de cette rébellion doivent se rencontrer pour discuter des développements futurs du socialisme coopératif."
 CUB_the_shining_path:0 "Le chemin lumineux"
 CUB_the_shining_path_desc:0 "Avec le succès de l'extrême gauche au Pérou, nos forces doivent maintenir des relations amicales avec le pays, à moins que les choses ne tournent mal."
 CUB_the_angolan_civil_war:0 "La guerre civile angolaise"
 CUB_the_angolan_civil_war_desc:0 "Les rebelles communistes en Angola ont besoin du soutien cubain pour rester anti-impérialistes."
 CUB_the_six_days_war:0 "La guerre des Six Jours"
 CUB_the_six_days_war_desc:0 "L'Égypte est sous le feu de l'impérialisme occidental ; elle a besoin de l'aide de Cuba pour libérer le Moyen-Orient de l'impérialisme occidental."
 CUB_south_african_marxism:0 "Marxisme sud-africain"
 CUB_south_african_marxism_desc:0 "Cuba doit lancer une opération pour amener la révolution en Afrique du Sud avec notre soutien et nos idéaux."
 CUB_state_visit_to_algiers:0 "Visite d'État à Alger"
 CUB_state_visit_to_algiers_desc:0 "L'Algérie est attaquée par l'impérialisme occidental. Nous devons être à leurs côtés."
 CUB_support_the_congo:0 "Soutenez le Congo"
 CUB_support_the_congo_desc:0 "Le Congo a désespérément besoin de renforts cubains pour conserver son indépendance."
 CUB_marxist_leninist_rhetoric:0 "Rhétorique marxiste-léniniste"
 CUB_marxist_leninist_rhetoric_desc:0 "Seul le marxiste-léninisme peut rassembler les peuples afin de parvenir au « vrai » communisme."
 CUB_the_non_aligned_movement:0 "Le Mouvement des Non-Alignés"
 CUB_the_non_aligned_movement_desc:0 "Cuba s'alliera à la Yougoslavie parce que nous partageons les mêmes idéaux contre l'Est et l'Ouest."
 CUB_incite_rallies_against_radicals:0 "Inciter à des rassemblements contre les radicaux"
 CUB_incite_rallies_against_radicals_desc:0 "Les radicaux de Cuba incluent ceux des factions d'extrême droite et d'extrême gauche, notre gouvernement s'emparera de toutes les initiatives politiques que ces factions pourraient rechercher."
 CUB_a_modern_constitution:0 "Une constitution moderne"
 CUB_a_modern_constitution_desc:0 "Seule une Constitution fondée sur la loi peut sauver Cuba pour de nombreuses années encore."
 CUB_the_militaristic_era:0 "L'ère militariste"
 CUB_the_militaristic_era_desc:0 "Par un vote populaire, le peuple cubain a décidé de maintenir la junte."
 CUB_the_washington_dc_meeting:0 "Réunion à Washington"
 CUB_the_washington_dc_meeting_desc:0 "L'actuel président des États-Unis nous a invités à une réunion à Washington D.C. pour discuter de notre politique étrangère."
 CUB_the_cuban_revoultionary_council:0 "Le Conseil révolutionnaire cubain"
 CUB_the_cuban_revoultionary_council_desc:0 "Le Conseil révolutionnaire cubain prendra le relais grâce au vote populaire de la population ; Leur chef, José Cordona, souhaite rentrer à Cuba après sa démission forcée."
 CUB_recruitment_propaganda:0 "Propagande de recrutement"
 CUB_recruitment_propaganda_desc:0 "Le peuple cubain ne voudra pas se joindre à notre cause de sa propre volonté, c'est pourquoi une conscription forcée doit être imposée par tous les moyens."
 CUB_militaristic_rhetoric:0 "Rhétorique militariste"
 CUB_militaristic_rhetoric_desc:0 "Cuba et son peuple savent tous deux que la seule façon de rester indépendant est de s'entraîner jusqu'à ce que la bataille ait lieu."
 CUB_corporatist_economic_policies:0 "Politiques économiques corporatistes"
 CUB_corporatist_economic_policies_desc:0 "Seul le corporatisme peut nous apporter de la richesse."
 CUB_civilian_economy:0 "Économie civile"
 CUB_civilian_economy_desc:0 "Le néolibéralisme, bien qu'il s'agisse d'un idéal économique expérimental, pourrait être la voie à suivre pour revitaliser notre industrie."
 CUB_private_land_ownership:0 "Propriété foncière privée"
 CUB_private_land_ownership_desc:0 "La collectivisation des terres est un cancer dont font preuve la plupart des partisans de l'extrême gauche et doit être éliminée."
 CUB_medicine_through_virture:0 "La médecine par la vertu"
 CUB_medicine_through_virture_desc:0 "Afin de panser les blessures de Cuba, nos idéaux religieux doivent être à nouveau réalisés."
 CUB_family_values:0 "Valeurs familiales"
 CUB_family_values_desc:0 "Nous avons besoin de nos valeurs pour que Cuba puisse mieux fonctionner."
 CUB_an_new_cuban_tradition:0 "Une nouvelle tradition cubaine"
 CUB_an_new_cuban_tradition_desc:0 "C'est le moment des idéaux expérimentaux, notre nouvelle tradition se révélera extrêmement efficace dans un avenir proche."
 CUB_stronghold_of_the_caribbean_right:0 "Fief de la droite caribéenne"
 CUB_stronghold_of_the_caribbean_right_desc:0 "Les Caraïbes sont enfin libérées des comportements extrémistes, il est temps pour Cuba d'aider ses voisins."
 CUB_ventures_in_europe:0 "Entreprises en Europe"
 CUB_ventures_in_europe_desc:0 "L'Europe n'apprécie toujours pas les comportements faibles et est encline aux idéologies néfastes de la part de son propre peuple. Notre représentation pourrait changer cela."
 CUB_helping_hand_of_the_americas:0 "Coup de main des Amériques"
 CUB_helping_hand_of_the_americas_desc:0 "Les Amériques se sont montrées ces derniers temps extrêmes et pleines de ressentiment. Notre représentation pourrait changer cela."
 CUB_denunciation_of_spains_legacy:0 "Dénonciation de l'héritage espagnol"
 CUB_denunciation_of_spains_legacy_desc:0 "Il est important de dénoncer les voies du fascisme, notamment celles de l'histoire de l'Espagne, pour inciter à l'antifascisme contre le continent."
 CUB_aid_in_the_reconstruction_of_germany:0 "Aide à la reconstruction de l'Allemagne"
 CUB_aid_in_the_reconstruction_of_germany_desc:0 "L'Allemagne a été durement touchée par son effort de guerre du passé, et elle est encore en train de se rétablir. Nous allons prêter main-forte au coeur brisé de l'Allemagne."
 CUB_the_valparaiso_summit:0 "Le Sommet de Valparaiso"
 CUB_the_valparaiso_summit_desc:0 "Valparaiso, au Chili, sera la destination pour discuter des plans du cône sud de l'Amérique du Sud."
 CUB_the_cuban_marshall_plan:0 "Le plan Marshall cubain"
 CUB_the_cuban_marshall_plan_desc:0 "Avec notre influence en Amérique du Nord, la persuasion de Cuba d'un plan Marshall à l'image des Amériques."
 CUB_coastal_forts_across_cuba:0 "Forts côtiers à travers Cuba"
 CUB_coastal_forts_across_cuba_desc:0 "Cuba doit se protéger dans un État de type invasion navale."
 CUB_deal_with_hershey:0 "Un accord avec Hershey"
 CUB_washington_havana_joint_commission:0 "Commission mixte Washington-Havane"
 CUB_washington_havana_joint_commission_desc:0 "Nous devrions travailler ensemble avec les gens de Washington."
 CUB_state_visit_to_paris:0 "Visite d'État à Paris"
 CUB_expel_anti_american_influence:0 "Expulser l'influence anti-américaine"
 CUB_sino_cuban_pact:0 "Pacte sino-cubain"
 CUB_enviromental_supervision:0 "Surveillance environnementale"
 CUB_international_meeting_in_havana:0 "Rencontre internationale à La Havane"
