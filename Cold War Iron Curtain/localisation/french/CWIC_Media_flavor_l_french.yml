 flavormedia.1.t:0 "[GetNewspaperHeader]MTV"
 flavormedia.1.d:0 "MTV est désormais diffusé aux États-Unis. La chaîne propose des vidéos musicales, toute la journée et toute la nuit."
 flavormedia.1.a:0 "Les vidéos sont lancées."
 flavormedia.1.b:0 "L'Amérique a une chaîne musicale."
 flavormedia.2.t:0 "[GetNewspaperHeader]LutteMania"
 flavormedia.2.d:0 "Le premier WrestleMania a rempli le Madison Square Garden. La lutte professionnelle est devenue un spectacle national."
 flavormedia.2.a:0 "Le Jardin est plein."
 flavormedia.2.b:0 "La lutte a un spectacle."
 flavormedia.3.t:0 "[GetNewspaperHeader]Les Simpson"
 flavormedia.3.d:0 "Les Simpsons ont été créés comme une série à part entière. La famille du dessin animé a désormais sa place en prime time."
 flavormedia.3.a:0 "Ils ont leur propre spectacle."
 flavormedia.3.b:0 "Une famille de dessins animés passe à la télévision."
 flavormedia.4.t:0 "[GetNewspaperHeader]Amis"
 flavormedia.4.d:0 "Friends a été présenté en première à la télévision américaine. Le spectacle met en scène six jeunes partageant leur vie à New York."
 flavormedia.4.a:0 "Le spectacle est lancé."
 flavormedia.4.b:0 "Une nouvelle comédie est en marche."
