 SAU_mechanized_heavy_equipment_5:0 "AMX-10P"
 SAU_mechanized_heavy_equipment_5_short:0 "AMX-10P"
 SAU_mechanized_heavy_equipment_6:0 "M2A2 Bradley"
 SAU_mechanized_heavy_equipment_6_short:0 "M2A2 Bradley"
 SAU_mechanized_heavy_equipment_6_desc:0 "Introduit en 1988, l'A2 a reçu un moteur amélioré de 600 chevaux (447 kW) avec une transmission hydromécanique HMPT-500-3 et un blindage amélioré (à la fois passif et capable de monter un blindage réactif explosif). Le nouveau blindage protège le Bradley contre les obus APDS de 30 mm et les RPG (ou armes anti-blindage similaires). Le nouveau blindage éliminait également la girouette qui rendait le Bradley amphibie et recouvrait les ports de tir latéraux."
 SAU_mechanized_heavy_equipment_7:0 "M2A2 Bradley ODS"
 SAU_mechanized_heavy_equipment_7_short:0 "M2A2 Bradley ODS"
 SAU_mechanized_heavy_equipment_7_desc:0 "Le M2 ODS Bradley est une variante améliorée du Bradley développé par BAE Systems en 1991. L'ODS présentait un intérieur optimisé, un blindage réactif explosif et une transmission hydromécanique. Bien que l'armure réactive ait eu un coût et a empêché le Bradley de nager. L'ODS a également ajouté un meilleur télémètre, un système de navigation, une contre-mesure de missile et un système d'imagerie thermique. De plus, un très petit chauffe-aliments et une station de confort ont été ajoutés, ce qui est considéré par certains comme la meilleure innovation."

 SAU_motorized_equipment_1:0 "GMC CCKW 6x6"
 SAU_motorized_equipment_1_short:0 "GMC CCKW 6x6"
 SAU_motorized_equipment_1_desc:0 "Le GMC CCKW est un camion 6x6 de 2,5 tonnes conçu par General Motors en 1941. Il a été largement utilisé pendant la Seconde Guerre mondiale et la guerre de Corée. Le CCKW utilise un moteur GMC270, une transmission à 5 vitesses/2 gammes et un essieu à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer jusqu'à 45 mph sur 300 miles et atteint 7,5 mi/gal. Le CCKW a été développé pour l'armée américaine en tant que camion de transport et de ravitaillement de troupes. Le camion, en plus d'être utilisé pour le ravitaillement et le transport, pourrait également monter une carrosserie de fourgon pour servir de véhicule de confort/soutien sur le terrain et peut également monter des armes remorquées sur son plateau pour créer des armes SP bon marché."
 SAU_motorized_equipment_2:0 "RÉO M35 6x6"
 SAU_motorized_equipment_2_short:0 "M35 6x6"
 SAU_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 SAU_motorized_equipment_3:0 "AM Général M809 6x6"
 SAU_motorized_equipment_3_short:0 "M809 6x6"
 SAU_motorized_equipment_3_desc:0 "Le M809 est un camion 6x6 de 5 tonnes conçu par AM General en 1970. Il a été utilisé dans tous les conflits américains de 1970 à 1982. Le M809 utilise un moteur NH250, une transmission à 5 vitesses/2 gammes et des essieux à poutre dynamique sur ressorts à lames. Il peut transporter une charge de 5 000 lb. Il a une vitesse de 52 mph sur 350 miles et obtient 10 mi/gal. En plus d'être utilisé pour le transport et le fret, le véhicule est très solide et peut supporter des composants utilitaires sur son plateau. Ceux-ci incluent la possibilité de monter des kits de dépanneuse, des bennes, des remorques, de grandes fourgonnettes pour le soutien/confort, des équipements de pontage et quelques autres. Le M809 peut également traverser des rivières peu profondes grâce à sa garde au sol élevée et est très efficace sur route ou hors route grâce à sa suspension. "
 SAU_motorized_equipment_4:0 "AM Général M939 6x6"
 SAU_motorized_equipment_4_short:0 "M939 6x6"
 SAU_motorized_equipment_4_desc:0 "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis 1982. Le M939 utilise un moteur 6CTA8.3, une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Le véhicule est capable de transporter une charge de 10 000 lb. Il peut se déplacer à 6,3 mph sur 350 miles et obtient 6 mi/gal. Il est toujours utilisé aujourd'hui. Le M939 est très efficace sur tous les terrains et convient bien aux intempéries. Le M939 a permis une nouvelle génération de camions, de moteurs principaux et de véhicules de dépannage et a fait l'objet d'une fabrication intensive. Il est plus fiable et plus résistant que les véhicules précédents et a complètement supplanté les contrats de production antérieurs. "
 SAU_motorized_equipment_5:0 "Famille Oshkosh de véhicules tactiques moyens 6x6"
 SAU_motorized_equipment_5_short:0 "FMTV 6x6"
 SAU_motorized_equipment_5_desc:0 "La famille de véhicules tactiques moyens (FMTV) est une série de véhicules, basés sur un châssis commun, qui varient en fonction de la charge utile et des exigences de la mission. Le FMTV est dérivé du camion autrichien Steyr 12 M 18, mais considérablement modifié pour répondre aux exigences de l'armée américaine, celles-ci comprenant un minimum de 50 pour cent de contenu américain."

