##Infantry Equipment

 SAU_infantry_equipment_0:0 "Fusil américain, calibre.30, M1"
 SAU_infantry_equipment_0_short:0 "M1 Garand"
 SAU_infantry_equipment_0_desc:0 "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."
 
 SAU_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 SAU_infantry_equipment_1_short:0 "FN FAL"
 SAU_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 SAU_infantry_equipment_2:0 "Avtomat Kalachnikova Modernizirovanniy"
 SAU_infantry_equipment_2_short:0 "AKM"
 SAU_infantry_equipment_2_desc:0 "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps."

 SAU_infantry_equipment_3:0 "Heckler & Koch G3A3"
 SAU_infantry_equipment_3_short:0 "G3A3"
 SAU_infantry_equipment_3_desc:0 "La version de 1963 la plus connue. Des viseurs à tambour avec un guidon amélioré, un suppresseur de flash/frein de bouche capable de tirer des grenades aux normes OTAN, une crosse fixe en plastique solide et un protège-main en plastique qui n'entre pas en contact avec le canon flottant. Le protège-main était disponible en version fine et ventilée et en version large. Ce dernier permet la fixation d'un bipied."

 SAU_infantry_equipment_4:0 "Heckler & Koch HK33E"
 SAU_infantry_equipment_4_short:0 "HK33E"
 SAU_infantry_equipment_4_desc:0 "Le HK33 est un fusil d'assaut de 5,56 mm développé dans les années 1960 par le fabricant d'armement ouest-allemand Heckler & Koch GmbH (H&K), principalement pour l'exportation."
 
