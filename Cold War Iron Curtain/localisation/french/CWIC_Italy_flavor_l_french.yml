 flavorita.1.t:0 "[GetNewspaperHeader]Aldo Moro est mort"
 flavorita.1.d:0 "Aldo Moro a été retrouvé mort à Rome. Les Brigades rouges ont capturé l'ancien Premier ministre en mars et l'État a refusé un échange."
 flavorita.1.a:0 "Moro est mort."
 flavorita.1.b:0 "Un ancien Premier ministre est mort."
 flavorita.2.t:0 "[GetNewspaperHeader]Le pape est abattu"
 flavorita.2.d:0 "Un homme armé a blessé le pape Jean-Paul II sur la place Saint-Pierre. Le pape est vivant et hospitalisé."
 flavorita.2.a:0 "Le pape est blessé."
 flavorita.2.b:0 "Le pape a été abattu."
 flavorita.3.t:0 "[GetNewspaperHeader]L'Italie remporte la Coupe du monde"
 flavorita.3.d:0 "L'Italie a remporté la Coupe du monde en battant l'Allemagne de l'Ouest en finale à Madrid."
 flavorita.3.a:0 "L'Italie est championne."
 flavorita.3.b:0 "L'Italie a remporté la coupe."
 flavorita.4.t:0 "[GetNewspaperHeader]Mani Pulite"
 flavorita.4.d:0 "Les magistrats de Milan ont ouvert une enquête pour pots-de-vin et argent du parti. On l'appelle déjà Mani Pulite, Clean Hands."
 flavorita.4.a:0 "L'enquête a commencé."
 flavorita.4.b:0 "Milan enquête."
