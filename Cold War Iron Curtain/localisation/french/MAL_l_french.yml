 MLA_Malaya_StateDec_TITLE_1010_desc:0 "Concentrez les colonnes de guérilla pour repousser les patrouilles gouvernementales et établir une cellule du MNLA."
 MLA_Malaya_StateDec_DESC_1010:0 "Engager nos colonnes dans une offensive dans cet état, en déplaçant le contrôle vers le MNLA de §G+12§!, avec §G+8§! supplémentaires si aucune division malaise ou britannique n'est présente et §G+5§! avec §Y$MLA_prepared_operation$§!. Établit une cellule §YMNLA§!.\n\nCoûts §Y25 puissance politique§!, §Y500 hommes§! et §Y150 équipements d'infanterie§!. Sans §Y$MLA_prepared_operation$§!, ajoute §Y$MLA_operation_exhaustion$§! pour §Y30 jours§!. Peut être répété dans cet état après §Y60 jours§!."
 
