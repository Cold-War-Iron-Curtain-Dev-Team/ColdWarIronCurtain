 MALAYA_ETHNICITY_TOOLTIP_Malay:0 "Le peuple malais est un peuple autochtone de la péninsule malaise, avec une riche histoire de commerce maritime et de culture islamique. Ils constituent traditionnellement la majorité politique et culturelle, profondément liés aux sultanats et à la propagation de l'islam dans la région."
 MALAYA_ETHNICITY_TOOLTIP_Chinese:0 "La communauté chinoise de Malaisie et de Bornéo est arrivée principalement en tant que migrants et commerçants. Ils ont influencé de manière significative le commerce, la vie urbaine et l'industrie, conservant des traditions culturelles distinctes tout en s'intégrant à la société locale."
 MALAYA_ETHNICITY_TOOLTIP_Thai:0 "Les Thaïlandais du nord de la Malaisie et du sud de la Thaïlande partagent des liens culturels et linguistiques étroits. Majoritairement bouddhistes Theravada, ils entretiennent des relations historiquement équilibrées entre les sultanats musulmans malais et le royaume siamois."
 MALAYA_ETHNICITY_TOOLTIP_Dayak:0 "Les Dayak sont les tribus indigènes des collines de Bornéo, connues pour leur riche patrimoine culturel, leurs croyances animistes et leurs maisons longues. Ils ont une histoire de résistance à la domination extérieure et maintiennent des traditions sociales et religieuses distinctes."
 MALAYA_ETHNICITY_TOOLTIP_Bornean:0 "Les peuples de Bornéo englobent divers groupes ethniques de l'île, notamment des communautés côtières et intérieures. Leurs cultures mélangent des pratiques animistes traditionnelles avec des influences islamiques et chrétiennes, reflétant des siècles de commerce et de migration."
 MALAYA_ETHNICITY_TOOLTIP_Indian:0 "La communauté indienne de Malaisie trouve ses racines dans la migration de main-d'oeuvre de l'ère coloniale, en particulier vers les plantations, les chemins de fer et les ports. Composés de divers groupes tels que les Tamouls, les Telugus et les Pendjabis, ils ont apporté avec eux un riche héritage culturel, notamment l'hindouisme, l'islam et le sikhisme, et ont joué un rôle essentiel dans le façonnement de la société plurielle de la Malaisie."

 MALAYA_ETHNICITY_TOOLTIP_Cham:0 "Les Cham sont un peuple austronésien musulman ayant des liens profonds avec l'Indochine et le monde malais. Fuyant les persécutions au Vietnam, de nombreux Cham se sont réinstallés dans l'est de la Malaisie et à Patani. Bien que peu nombreux, ils sont culturellement distincts et servent souvent d'intermédiaires entre les musulmans malais et les réseaux anticoloniaux plus larges, notamment les groupes islamistes."
 MALAYA_RELIGION_TOOLTIP_Islam:0 "L'Islam est la religion dominante au sein de la population malaise, introduite au cours de siècles d'activités commerciales et missionnaires. Il façonne profondément le paysage culturel, juridique et politique de la Malaisie et de Bornéo."
 MALAYA_RELIGION_TOOLTIP_Christianity:0 "Le christianisme, apporté par les missionnaires européens et les puissances coloniales, a de nombreux adeptes dans certaines parties de Bornéo. Cela a influencé les institutions éducatives et sociales locales, en particulier parmi les communautés autochtones."
 MALAYA_RELIGION_TOOLTIP_Buddhism:0 "Le bouddhisme en Malaisie et à Bornéo est principalement pratiqué par la communauté chinoise suivant les traditions Mahayana. En revanche, les populations thaïlandaises adhèrent au bouddhisme Theravada, reflétant leur héritage culturel et leurs liens régionaux."
 MALAYA_RELIGION_TOOLTIP_Other:0 "Le confucianisme influence de nombreuses pratiques culturelles chinoises, mettant l'accent sur l'harmonie familiale et sociale. Les religions traditionnelles de Bornéo sont de nature animiste, centrées sur le culte des ancêtres et le respect des esprits de la nature, reflétant le lien profond entre les communautés et leur environnement."

