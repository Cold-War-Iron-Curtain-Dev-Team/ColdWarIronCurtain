 MAL_jet_multirole_equipment_8_short:0 "F-5E Tigre II"
 MAL_jet_multirole_equipment_8_desc:0 "Singapour est un opérateur important de la variante F-5E/F, ayant commandé l'avion pour la première fois en 1976 lors d'une expansion massive des forces armées de la cité-État ; la livraison de ce premier lot de 18 F-5E et de trois F-5F a été achevée fin février 1979, équipant le nouveau 144 Black Kite Squadron à la base aérienne de Tengah."
 MAL_jet_multirole_equipment_9:0 "McDonnell Douglas F/A-18 Hornet"
 MAL_jet_multirole_equipment_9_short:0 "F/A-18 Hornet"
 MAL_jet_multirole_equipment_9_desc:0 "Le McDonnell Douglas F/A-18 Hornet est un avion de combat bimoteur, supersonique, tous temps, capable de porter un porte-avions et multirôle, conçu à la fois comme avion de combat et d'attaque (d'où la désignation F/A). Conçu par McDonnell Douglas (qui fait maintenant partie de Boeing) et Northrop (qui fait maintenant partie de Northrop Grumman), le F/A-18 est dérivé du YF-17 de ce dernier dans les années 1970 pour être utilisé par la Marine et le Corps des Marines des États-Unis. Le Hornet est également utilisé par les forces aériennes de plusieurs autres pays, et autrefois par l'escadron de démonstration en vol de la marine américaine, les Blue Angels. "
 MAL_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29N"
 MAL_jet_multirole_equipment_10_short:0 "MiG-29N"
 MAL_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum N a été initialement développé par le Mikoyan Design Bureau. C'était le premier chasseur de 4e génération à entrer en service en URSS et dans le bloc de l'Est. Intégrant une avionique améliorée et des capacités radar considérablement améliorées. Les premiers MiG-29 ont été utilisés comme entraîneurs par le Pacte de Varsovie avec des exportations limitées vers l'Inde mais avaient une utilisation limitée au combat. Le MiG-29 deviendra plus tard la base de variantes largement produites telles que le MiG-29S, le MiG-29M et le MiG-35."
 
 MAL_mr_stealth_fighter_equipment_1:0 "Soukhoï Su-30MKM"
 MAL_mr_stealth_fighter_equipment_1_short:0 "Su-30MKM"
 MAL_mr_stealth_fighter_equipment_1_desc:0 "Le Sukhoi Su-30MKM (nom OTAN ; Flanker-H) est un chasseur supermaniable de la Royal Malaysian Air Force. Il s'agit d'une variante des chasseurs de la série Su-30, avec de nombreuses améliorations significatives par rapport à la version d'exportation originale du Su-30MK."

