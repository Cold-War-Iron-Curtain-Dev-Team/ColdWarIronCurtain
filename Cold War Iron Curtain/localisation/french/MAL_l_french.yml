 MAL_light_artillery_equipment_1:0 "Pilon Royal Ordnances QF-25 mm"
 MAL_light_artillery_equipment_1_short:0 "Pilier QF-25mm"
 MAL_light_artillery_equipment_1_desc:0 "Le QF 25-pounder était une pièce d'artillerie de campagne britannique polyvalente utilisée pendant l'urgence malaise (1948-1960). Connu pour sa fiabilité, le canon de 25 livres pouvait tirer à la fois des obus explosifs et fumigènes, fournissant ainsi un soutien efficace contre les insurgés communistes dans la jungle dense. Il a joué un rôle crucial dans les opérations défensives, aidant les forces britanniques et du Commonwealth à supprimer les positions ennemies et à interrompre les embuscades. La combinaison de puissance de feu, de portée et de mobilité a fait du QF 25 livres un atout essentiel lors des efforts de contre-insurrection en Malaisie."
