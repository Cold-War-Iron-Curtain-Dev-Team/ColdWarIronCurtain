 MAL_EMERGENCY_STATE_CONTROL_LINE:0 "Contrôle d'urgence : §Y[?MALAY_SELECTED_STATE_ID_TARGET.emergency_control|+0]§!"
 MAL_EMERGENCY_CONTROL_SHIFT_TT:0 "§YLe contrôle d'urgence§! en §Y[THIS.GetName]§! change de [?emergency_control_shift|+0] (le positif favorise le MNLA)."
 MAL_EMERGENCY_MOMENTUM_SHIFT_TT:0 "§YL'élan d'urgence§! change de [?emergency_momentum_shift|+0] (réparti dans les neuf États contestés)."
 MAL_EMERGENCY_STATE_CONTROL_TT:0 "Le contrôle varie de §Y-100§! (sécurisé par le gouvernement) à §Y+100§! (MNLA libéré). Un état compte comme §YLibéré§! au-dessus de §Y+59§! et §YSécurisé§! en dessous de §Y-59§!.\n\n§YDérive mensuelle§!:\n- Divisions MNLA : §Y+2§!, ou §Y+4§! avec au moins 3 divisions.\n- Divisions malaises ou britanniques : §Y-2§!, ou §Y-4§! avec au moins 4 divisions de l'un ou l'autre pays.\n- Cellule MNLA : §Y+1§!, avec un autre §Y+1§! si la cellule est en terrain jungle. Pahang, Perak et Johor commencent par les cellules.\n- Un état libéré voisin : §Y+1§!; un état sécurisé voisin : §Y-1§!.\n- Soviets de village, milices de la Garde rouge et caches d'armes : §Y+1§! chacun ; insurrection coordonnée : §Y+2§!.\n- Réinstallation d'urgence : §Y-3§!; Postes Gurkha et branche spéciale : §Y-2§! chacun.\n- Réseaux de renseignement, Home Guard, éclaireurs Orang Asli, couvre-feux, opérations psychologiques et reconnaissance aérienne : §Y-1§! chacun.\n- Une fois que la Malaisie aura achevé le plan Briggs : §Y-2§! dans chaque État contesté.\n\nLes actions de l'État et les récompenses ciblées modifient également le contrôle. Le contrôle d'urgence ne transfère pas en soi la propriété ; le soulèvement général amène les États du noyau MLA dotés d'une cellule du MNLA ou d'un statut libéré sous le contrôle du MNLA."

