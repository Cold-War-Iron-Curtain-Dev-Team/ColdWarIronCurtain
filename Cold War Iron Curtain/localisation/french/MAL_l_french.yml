###### Localisation for BRU, MAL, NBO, SGP, SWK #######

MAL_EMERGENCY_OVER:0 "L'urgence malaisienne §Y§! est terminée"
 MLA_Launch_Liberation_Campaign:0 "Lancer une campagne de libération"
 MLA_Launch_Liberation_Campaign_desc:0 "Envoyez des colonnes du MNLA contre un État contesté détenu par le gouvernement mais que le MNLA a libéré, en frappant depuis un État adjacent détenu par le MNLA. La victoire remet l'État au MNLA ; la défaite coûte de l'élan d'urgence et épuise les guérilleros."
 MAL_Launch_Clearing_Operation:0 "Lancer une opération de compensation"
 MAL_Launch_Clearing_Operation_desc:0 "Envoyez des unités de la Fédération contre un État contesté détenu par le MNLA mais que le gouvernement a sécurisé, en frappant depuis un État adjacent détenu par le gouvernement. La victoire reprend l'État ; la défaite coûte le pouvoir politique."
 MLA_campaign_cost_tt:0 "Coûte §Y50§! de pouvoir politique, §Y500§! de main d'oeuvre et §Y200§! d'équipement d'infanterie. Ne nécessite aucune guerre frontalière en cours. Temps de recharge : §Y120§! jours."
 MAL_campaign_cost_tt:0 "Coûte §Y50§! de pouvoir politique, §Y500§! de main d'oeuvre et §Y200§! d'équipement d'infanterie. Ne nécessite aucune guerre frontalière en cours. Temps de recharge : §Y120§! jours."
 malayan_emergency.1.t:0 "Terrain contesté tenu"
 malayan_emergency.1.d:0 "Les combats frontaliers se sont soldés par une nette victoire. L'État répond désormais à nos côtés et les campagnes qui l'entourent surveillent qui maintient la paix."
 malayan_emergency.1.a:0 "Tenez la ligne"
 malayan_emergency.2.t:0 "Opération repoussée"
 malayan_emergency.2.d:0 "L'attaque s'est brisée face à une forte résistance. Nos unités se retirent avec de lourdes pertes et l'ambiance s'assombrit chez nous."
 malayan_emergency.2.a:0 "Regrouper"
 malayan_emergency.3.t:0 "Terrain contesté tenu"
 malayan_emergency.3.d:0 "L'assaut ennemi s'est brisé contre nos défenses. L'État reste sous notre contrôle et les campagnes en prennent note."
 malayan_emergency.3.a:0 "Tenez la ligne"
 malayan_emergency.4.t:0 "Dépassement de position"
 malayan_emergency.4.d:0 "L'assaut ennemi a envahi nos positions. Nous perdons du terrain et l'emprise du gouvernement sur les campagnes s'effondre."
 malayan_emergency.4.a:0 "Se retirer"
 malayan_emergency.5.t:0 "Opération annulée"
 malayan_emergency.5.d:0 "La campagne a été annulée avant le début des combats."
 malayan_emergency.5.a:0 "Compris"

#### MAL Tooltips/Flags ####
 Can_Exile_MLA_tt:0 "Au moins §Y7 des 9§! États contestés sont §Ysécurisés§! par le gouvernement."
 MLA_EMERGENCY_MOMENTUM_TT:0 "L'Emergency Momentum est la somme du contrôle dans les neuf États contestés, divisée par 3,6, allant de §Y-250§! à §Y+250§!. Les valeurs positives favorisent le MNLA ; les valeurs négatives favorisent le gouvernement.\n\nUn état est §YLibéré§! au-dessus de §Y+59§! de contrôle et §YSécurisé§! en dessous de §Y-59§!. Le soulèvement général nécessite au moins §Y5 États libérés§! et les trois §YAssaut final§! se concentrent. Le balayage final du gouvernement nécessite au moins §Y7 États sécurisés§! et le §Yle plan Briggs§!."

#### Malayan Emergency Ideas ####
 MAL_emergency_collapse:0 "Effondrement de l'urgence"
 MAL_emergency_collapse_desc:0 "La campagne a disparu, la garantie britannique a expiré et une force de police habillée en armée est appelée à mener une guerre. Toutes les institutions de la Fédération échouent en même temps."
 MAL_final_sweep_idea:0 "Opération Sledgehammer"
 MAL_final_sweep_idea_desc:0 "Douze années de réglementation d'urgence se sont terminées en toute légèreté. L'armée de la Fédération est sans laisse, entièrement approvisionnée et combat un ennemi qui n'a nulle part où se disperser."
 MAL_Elective_Monarchy:0 "Monarchie élective"
 MAL_Elective_Monarchy_desc:0 "Dans le cadre constitutionnel établi par la Conférence des dirigeants (Durbar), le chef suprême de l'État (Yang di-Pertuan Agong) est élu pour un mandat de cinq ans parmi les dirigeants héréditaires des États malais, préservant ainsi le prestige royal traditionnel tout en unifiant la fédération."

