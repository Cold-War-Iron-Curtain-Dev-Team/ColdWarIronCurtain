#### Malaysia/Singapore Equipment Names ####

 ########### MAL INFANTRY
 
 MAL_infantry_equipment_0:0 "Lee - Fusil Enfield, n ° 5 Mk I, carabine Jungle"
 MAL_infantry_equipment_0_short:0 "Fusil n°5 Mk I"
 MAL_infantry_equipment_0_desc:0 "La Jungle Carbine était une version légère et raccourcie du British Lee - Enfield No. 4 Mk I, chambrée en.303 British. Développé pendant la Seconde Guerre mondiale pour la guerre dans la jungle, il était environ 100 mm (3,9 pouces) plus court et près d'un kilogramme (2,2 livres) plus léger que le fusil standard. \nLe fusil était doté d'une crosse en caoutchouc, qui facilitait l'adhérence mais augmentait le recul. Ses viseurs en fer étaient conçus pour les distances rapprochées et plus longues, ce qui le rend idéal pour la maniabilité sur terrain dense. Produite entre 1944 et 1947, la Jungle Carbine était appréciée pour son efficacité dans les combats dans la jungle."

 MAL_infantry_equipment_1:0 "Fusil à chargement automatique L1A1"
 MAL_infantry_equipment_1_short:0 "L1A1 REFLEX"
 MAL_infantry_equipment_1_desc:0 "Le fusil à chargement automatique L1A1 est une variante britannique du FN FAL, un fusil de combat OTAN de 7,62 x 51 mm. Connu pour sa durabilité et sa fiabilité, le L1A1 a été largement utilisé par les pays du Commonwealth pendant la guerre froide. En Malaisie, il a servi de manière approfondie dans l'armée royale malaisienne pendant les périodes d'urgence malaise et de Konfrontasi, où son tir semi-automatique et sa précision à longue portée se sont révélés efficaces dans la guerre dans la jungle. Le L1A1 était apprécié pour sa robustesse dans des conditions difficiles et est resté au service militaire malais jusqu'aux années 1980, date à laquelle il a été remplacé par des fusils plus modernes."

 MAL_infantry_equipment_2:0 "Ordonnance PME M-16"
 MAL_infantry_equipment_2_short:0 "M-16"
 MAL_infantry_equipment_2_desc:0 "La carabine malaisienne M-4 est une version produite localement de la carabine américaine Colt M4, un fusil d'assaut léger de l'OTAN de 5,56 x 45 mm. Fabriquée par SME Ordnance, cette carabine est utilisée par les forces armées malaisiennes et les unités d'opérations spéciales. Avec son canon plus court et sa conception compacte, le M-4 est idéal pour les combats rapprochés et les opérations urbaines. Il propose des modes de tir semi-automatiques et entièrement automatiques, ce qui le rend polyvalent pour une large gamme de missions. Le M-4 malaisien est devenu un élément essentiel de la modernisation des forces militaires du pays."

 MAL_infantry_equipment_3:0 "Carabine M-4 de munitions SME"
 MAL_infantry_equipment_3_short:0 "Carabine M-4"
 MAL_infantry_equipment_3_desc:0 "Le XM16E1 de l'armée américaine était essentiellement la même arme que le M16 avec l'ajout d'une assistance avancée et d'encoches correspondantes dans le porte-boulon. Le M16A1 était le modèle de production finalisé en 1967 et a été produit jusqu'en 1982. Pour résoudre les problèmes soulevés par le cycle de test du XM16E1, un suppresseur de flash fermé en cage à oiseaux a remplacé le suppresseur de flash à trois volets du XM16E1 qui s'accrochait aux brindilles et aux feuilles. Divers autres changements ont été apportés après de nombreux problèmes sur le terrain. Des kits de nettoyage ont été développés et distribués tandis que des canons avec des chambres chromées et plus tard des alésages entièrement doublés ont été introduits."

 MAL_infantry_equipment_4:0 "Carabine, calibre 5,56 mm, M4 "
 MAL_infantry_equipment_4_short:0 "Carabine M4"
 MAL_infantry_equipment_4_desc:0 "La carabine M4 est une nouvelle amélioration par rapport au M16A2. Il a été initialement commandé pour être conçu par une grande équipe ad hoc de concepteurs en 1984 et le développement s'est terminé en 1993. Après 9 ans de développement, j'espère que cela aurait valu la peine d'attendre. Il présente un plus grand niveau de fiabilité et est beaucoup plus léger et plus court. Principalement grâce à des matériaux améliorés, il est plus précis que le M16A2. Sa taille compacte le rend plus polyvalent et plus facile à utiliser que le M16A2. La carabine M4 a été utilisée lors de la guerre américaine en Afghanistan, de la guerre en Irak et de la guerre contre l'Etat islamique."

 ########### END OF MAL INFANTRY

