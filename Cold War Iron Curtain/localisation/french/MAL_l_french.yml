 MAL_jet_light_equipment_2:0 "Canadair CT-114 Tuteur"
 MAL_jet_light_equipment_2_short:0 "CT-114 Tuteur"
 MAL_jet_light_equipment_2_desc:0 "Les débuts du CL-41 Tutor remontent à la décision du constructeur aéronautique canadien Canadair de développer son propre avion d'entraînement local en tant qu'entreprise privée. La conception elle-même était le produit du service de conception préliminaire interne de l'entreprise. En août 1957, la configuration de base de la conception était terminée, il s'agissait d'un avion à turboréacteur à ailes basses, doté d'un train d'atterrissage tricycle et d'un cockpit côte à côte. Dès le début du développement, l'avion était destiné à être un avion d'entraînement spécialement conçu pour fournir une formation élémentaire au vol à réaction, ainsi qu'une formation supplémentaire jusqu'à un niveau avancé."
 MAL_jet_light_equipment_3:0 "Canadair CL-41G Tebuan"
 MAL_jet_light_equipment_3_short:0 "CL-41G Tébouan"
 MAL_jet_light_equipment_3_desc:0 "Version unique pour la Royal Malayan Air Force (RMAF). Au total, 20 variantes d'attaque au sol, connues sous le nom de « Tebuan », sont en service au sein du RMAF."
