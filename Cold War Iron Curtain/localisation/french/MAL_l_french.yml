 #SWK 50's Focus Descs
 
 SWK_Form_Interim_Gov_desc:0 "Avec la chute de la Malaisie aux mains des communistes, nous devons former un gouvernement intérimaire avec les responsables du gouvernement malais qui ont fui avec nous au Sarawak pendant que nous planifions un retour en Malaisie."
 SWK_Promote_Dayak_Iban_Officials_desc:0 "Considérant que le nombre de responsables gouvernementaux qui nous ont accompagnés en exil est limité, comblons le vide en promouvant les responsables Dayak et Iban à des postes gouvernementaux."
 SWK_Expand_Council_Negri_desc:0 "Alors que nous mettons en place notre gouvernement intérimaire, élargissons également notre corps législatif, le Conseil Negri, pour garantir qu'il puisse représenter nos électeurs au Sarawak."
 SWK_Finish_New_Constitution_desc:0 "Afin de légitimer notre gouvernement au Sarawak, nous devons terminer la rédaction de notre constitution pour établir l'État de droit une fois pour toutes."
 SWK_First_Sarawakian_Elections_desc:0 "Puisque nous avons achevé la mise en place d'un gouvernement stable au Sarawak, organisons les premières élections et choisissons un Premier ministre pour représenter notre nation."
 
 SWK_PM_Tunku_Abdul_Rahman_desc:0 "Tunku Abdul Rahman, un homme politique malais bien connu avant même que notre gouvernement ne déménage au Sarawak, a été élu Premier ministre."
 SWK_East_Malaysian_Federation_desc:0 "Tandis que nous avons établi notre bastion au Sarawak, nous devons tendre la main aux autres États malais qui ne sont pas tombés sous le contrôle communiste et former une fédération de Malaisie orientale contre toute menace qui nous pèse."
 SWK_Strengthen_Western_Ties_desc:0 "Afin de garantir que notre gouvernement puisse résister aux menaces communistes, nous devons renforcer les liens avec les pays occidentaux tels que l'Amérique et la Grande-Bretagne afin de maintenir le soutien international."
 SWK_Joining_SEATO_desc:0 "Outre le soutien des pays occidentaux, nous devrions également rechercher des alliés dans les pays voisins qui partagent nos objectifs anticommunistes en rejoignant l'OTASE."
 SWK_Relocate_Exiled_Gov_desc:0 "Bien que Kuching dispose de toutes les infrastructures nécessaires pour accueillir un gouvernement, il serait peu pratique de partager la ville avec le gouvernement régional du Sarawak. Déménageons dans une nouvelle capitale où nous pourrons maintenir le gouvernement malais en exil."
 SWK_Coast_Fortification_desc:0 "Afin d'empêcher toute invasion prochaine de la Malaisie communiste, nous devons fortifier notre côte pour garantir qu'aucun infiltré communiste ne puisse entrer et causer des ravages au Sarawak."
 SWK_Resume_Oil_Trade_desc:0 "Puisque la Grande-Bretagne et l'Amérique ont plus que jamais besoin de pétrole, exploitons nos réserves locales de pétrole et reprenons le commerce du pétrole afin d'assurer nos relations avec les Britanniques comme avec les Américains."
 SWK_Promote_Unified_Malayan_Culture_desc:0 "Afin de promouvoir une identité commune parmi les divers groupes de personnes de notre nation, nous devons promouvoir une culture malaise unifiée afin d'assurer l'unité entre les Malais, les Chinois et les habitants du Sarawak."
 SWK_Improve_Native_Living_Conditions_desc:0 "Même si planifier la reprise de la Malaisie est notre objectif numéro un, nous devons également maintenir notre soutien sur le front intérieur. En améliorant les conditions de vie des Sarawakiens locaux, nous pourrions garantir un soutien et une main-d'oeuvre supplémentaire dans notre quête pour reprendre la Malaisie."
 SWK_Promote_Muslim_Faith_desc:0 "Considérant que Chin Peng et les communistes sévissent contre nos compatriotes musulmans en Malaisie, promouvons l'islam dans notre nation pour faire savoir à nos compatriotes malais que nous sommes un refuge sûr pour ceux qui veulent échapper au communisme et pratiquer librement leur foi."
 SWK_Broadcast_AntiCommunist_Prop_desc:0 "En plus d'offrir le Sarawak comme refuge pour les réfugiés, nous devrions également diffuser de la propagande anticommuniste en Malaisie afin de garantir un soutien en Malaisie pour notre prochaine mission visant à réunifier la Malaisie une fois pour toutes."
 
 SWK_Rajah_Anthony_desc:0 "Anthony Brooke, héritier de l'ancien Rajah blanc du Sarawak, a été élu Premier ministre."
 SWK_Adopt_Parliamentary_System_desc:0 "Étant donné que de nombreuses anciennes colonies britanniques continuent d'utiliser le système parlementaire, il serait naturel que nous l'adoptions également pour notre propre gouvernement."
 SWK_Strengthen_Commonwealth_Ties_desc:0 "En tant qu'ancienne colonie britannique, nous devrions renforcer nos liens avec les pays du Commonwealth pour garantir le soutien britannique et international."
 SWK_Strengthen_Asian_Ties_desc:0 "Outre les Britanniques, n'oublions pas nos alliés en Asie. Nous devrions leur tendre la main pour resserrer nos liens."
 SWK_Expand_Astana_desc:0 "Le palais Negeri d'Astana étant actuellement sous-développé, nous devons l'agrandir pour en faire un palais digne de n'importe quel premier ministre du Sarawak."
 SWK_Modernize_Kuching_desc:0 "Bien que Kuching soit notre capitale actuelle, elle est encore sous-développée. Commençons la campagne de modernisation de Kuching."
 SWK_Electrify_Land_desc:0 "Dans le cadre de notre programme de modernisation, nous devrions électrifier nos terres pour apporter la modernité au Sarawak."
 SWK_Promote_Sarawakian_Culture_desc:0 "La famille Brooke est la protectrice des cultures locales du Sarawak depuis qu'elle est devenue Rajah du Sarawak. Continuons cette pratique afin de plaire aux habitants du Sarawak."
 SWK_Promote_Racial_Equality_desc:0 "Étant donné que d'autres groupes ethniques vivent au Sarawak, outre les Malais, promouvons l'égalité raciale pour garantir que tout le monde soit inclus dans notre nation."
 SWK_Promote_Decentralization_desc:0 "Puisque le Sarawak est culturellement différent de la Malaisie, promouvons la décentralisation pour garantir aux Sarawakiens une autonomie sur leur propre territoire."
 SWK_Stabilize_Lands_desc:0 "Puisque nous avons consolidé notre contrôle au Sarawak, stabilisons également le contrôle des terres au sein de notre nation."
 
 SWK_PM_Openg_Abang_desc:0 "Openg Abang, un homme politique local du Sarawak, a été élu Premier ministre du Sarawak."
 SWK_Sarawakian_Republic_desc:0 "Au lieu de prétendre être le gouvernement légitime de la Malaisie en exil, proclamons-nous plutôt République du Sarawak et détachons-nous de la Malaisie."
 SWK_Promote_Neutrality_desc:0 "Considérant que notre implication avec l'Occident est ce qui nous cause en premier lieu des ennuis avec les communistes, soyons plutôt une nation neutre pour garantir que personne ne puisse nous envahir."
 SWK_Emulate_Australian_Federal_Model_desc:0 "Le Sarawak étant un endroit diversifié, le modèle fédéral australien serait un bon exemple de gouvernement que nous pouvons imiter pour garantir que tout le monde au Sarawak bénéficie d'une représentation locale."
 SWK_Building_New_Parliament_Building_desc:0 "L'état actuel du Parlement actuel ne fera pas l'affaire comme lieu de rassemblement de nos députés. Bâtissons un nouveau parlement adapté à un Sarawak moderne."
 SWK_Modernize_Coastal_Areas_desc:0 "Actuellement, la plupart des zones côtières en dehors de Kuching sont constituées de villes et de villages sous-développés. Modernisons la côte pour amener le reste du Sarawak au niveau de vie moderne."
 SWK_Land_Electrification_desc:0 "Dans le cadre de notre programme de modernisation, nous devrions électrifier nos terres pour apporter la modernité au Sarawak."
 SWK_Sarawakian_Culture_Promotion_desc:0 "La famille Brooke est la protectrice des cultures locales du Sarawak depuis qu'elle est devenue Rajah du Sarawak. Continuons cette pratique afin de plaire aux habitants du Sarawak."
 SWK_Racial_Equality_Promotion_desc:0 "Étant donné que d'autres groupes ethniques vivent au Sarawak, outre les Malais, promouvons l'égalité raciale pour garantir que tout le monde soit inclus dans notre nation."
 SWK_Promote_State_Secularism_desc:0 "Puisque le Sarawak n'est pas majoritairement musulman, promouvons la laïcité de l'État dans notre pays pour garantir que chacun puisse avoir la liberté de religion."
 SWK_Land_Stabilization_desc:0 "Puisque nous avons consolidé notre contrôle au Sarawak, stabilisons également le contrôle des terres au sein de notre nation."
 
 SWK_Worst_Case_Scenario_desc:0 "Il semble que le pire scénario de la prise de contrôle de la Malaisie par les communistes se soit produit. Nous devons nous préparer à la reconquête de la Malaisie."
 SWK_Integrate_Exiled_MAL_Officers_Assets_desc:0 "Considérant que notre situation est désastreuse, intégrons les ressources des officiers malais exilés dans notre lutte contre le communiste."
 SWK_Recruit_Gerald_Templar_desc:0 "Gerald Templar, un Britannique connu pour son expertise dans la lutte contre les communistes, pourrait nous être utile. Recrutons-le pour nous aider à entraîner notre armée à lutter contre le communiste."
 SWK_Setup_Curfews_Rations_desc:0 "Afin d'empêcher les gens d'accumuler des provisions ou que les provisions ne tombent aux mains des communistes, nous devons mettre en place des rations et des couvre-feux pour éviter que ces problèmes ne surviennent."
 SWK_Perfect_Counter_Insurgency_Tactics_desc:0 "Puisqu'il y a encore des insurgés communistes au Sarawak, nous devons perfectionner les tactiques anti-insurrectionnelles pour minimiser les infiltrations communistes dans notre pays."
 SWK_Implement_Strat_Hamlets_desc:0 "Puisque les communistes sont connus pour se fondre dans la population locale, nous devrions mettre en place des hameaux stratégiques pour isoler les populations fidèles des insurgés communistes."
 SWK_Promote_AntiCommunist_Lynchings_desc:0 "Tandis que notre armée fait sa part pour éliminer les communistes, nous devrions également promouvoir les lynchages anticommunistes au sein de notre population fidèle pour aider à éliminer tous les communistes résidant encore au Sarawak."
 SWK_Raid_Mainland_desc:0 "Afin de montrer notre présence aux communistes, nous devrions commencer notre raid en Malaisie pour qu'ils nous craignent."
 SWK_Winning_Hearts_And_Minds_desc:0 "Si la terreur est un moyen d'intimider la population locale pour qu'elle ne soutienne pas les communistes, nous devrions également gagner leur coeur et leur esprit en diffusant de la propagande anticommuniste au Sarawak"
 SWK_Kindly_Treat_Natives_desc:0 "Outre la propagande, nous devrions également donner l'exemple de notre gouvernement bienveillant en traitant les indigènes avec bienveillance pour éviter qu'ils ne tombent entre les mains des communistes."
 SWK_Promote_InterRacial_Equality_desc:0 "Compte tenu de la diversité de la population du Sarawak, nous devrions promouvoir l'égalité au sein des différents groupes ethniques du Sarawak afin de garantir un front uni contre les communistes."
 SWK_Permit_Labor_Reforms_desc:0 "Afin de rallier la population locale à nos côtés, nous devrions permettre aux réformes du travail au Sarawak de bénéficier du soutien de la population locale."
 SWK_Full_Bellies_Big_Smiles_desc:0 "Nous devrions établir un programme d'aide alimentaire pour garantir que personne au Sarawak n'ait faim et continuer à soutenir notre gouvernement."
 SWK_Broadcast_Reconciliation_Messages_desc:0 "Outre les habitants du Sarawak, il y a encore des gens en Malaisie qui soutiennent nos causes. Diffusons des messages de réconciliation pour nous assurer qu'ils nous soutiennent toujours malgré le régime communiste."
 
 SWK_Establish_Sarawak_Armed_Forces_desc:0 "Considérant que l'armée du Sarawak est sous-développée, créons les forces armées du Sarawak en tant qu'armée professionnelle de notre nation."
 SWK_Recruit_Native_Sarawakians_desc:0 "Comme le nombre de Malais exilés qui nous accompagnent est faible, nous devrions également commencer à recruter des Sarawakiens autochtones dans nos forces armées."
 SWK_Form_Sarawak_Navy_desc:0 "Nous devons créer une marine du Sarawak pour garantir que notre côte soit protégée des communistes."
 SWK_Beg_UK_Transfer_Old_Ships_desc:0 "Puisque nous ne disposons pas de nos propres navires, nous devrions demander au Royaume-Uni de nous transférer ses anciens navires pour notre marine."
 SWK_Expand_Sarawak_Steamship_Company_desc:0 "Outre les navires destinés à notre marine, nous devrions également développer la Sarawak Steamship Company pour assurer un approvisionnement constant en navires locaux dans notre pays."
 SWK_Incorporate_Constabulary_desc:0 "Dans le cadre de nos efforts de lutte contre les communistes, nous devrions intégrer la police du Sarawak à nos forces pour obtenir une aide supplémentaire dans l'éradication des insurgés communistes locaux."
 SWK_Form_Special_Branch_desc:0 "Considérant qu'il existe des forces insurrectionnelles potentielles cachées au Sarawak, créons la Branche spéciale en tant qu'agence de renseignement dédiée à l'extirpation de tous les communistes encore au Sarawak."
 SWK_Expand_Sikh_Divisions_desc:0 "Les divisions sikhs sont connues pour leurs aptitudes au combat et leur loyauté. Élargissons les divisions sikhs pour garantir que les communistes ne nous dérangeront pas."
 SWK_Fortifying_Urban_Areas_desc:0 "Les zones urbaines sont susceptibles d'être détruites pendant la guerre. Fortifions les zones urbaines pour minimiser les destructions lors des batailles rangées et des sièges."
 SWK_Expand_Sarawak_Rangers_desc:0 "Les Sarawak Rangers sont utiles pour nous aider à combattre dans les jungles. Développons-les pour utiliser efficacement leur expertise contre les communistes."
 SWK_Organize_Iban_Trackers_desc:0 "Outre les rangers, les pisteurs Iban locaux connaissent le terrain mieux que nous. Organisons des traqueurs Iban dédiés pour nous aider à combattre dans les jungles locales."
 SWK_Emulate_Australian_Army_Model_desc:0 "Nous devrions considérer l'armée australienne comme un modèle pour notre armée dans nos efforts de lutte contre le communiste."
 SWK_Outlaw_Headhunting_desc:0 "La tradition de la chasse aux têtes est barbare et n'a pas sa place dans le monde moderne. Interdisons-le une fois pour toutes."
 SWK_Allow_Headhunting_desc:0 "Même si la tradition de la chasse aux têtes est barbare, elle constitue un mal nécessaire. Nous devrions fermer les yeux afin que les habitants puissent perpétuer cette tradition visant à semer la peur dans le coeur des communistes."
 SWK_Modernize_Arsenal_desc:0 "Notre arsenal regorge actuellement d'équipements obsolètes. Mettons-les à jour pour une armée moderne."
 SWK_Perfect_Jungle_Warfare_desc:0 "Alors que nous poursuivons notre formation à la guerre dans la jungle, perfectionnons-la afin de pouvoir nous préparer à toutes les situations impliquant des combats dans la jungle."
 SWK_Form_Sarawak_AirForce_desc:0 "Puisque nous n'avons pas d'armée de l'air, formons-en une pour nous aider à lutter contre les communistes."
 SWK_Beg_UK_Transfer_Old_Planes_desc:0 "Nous devrions demander au Royaume-Uni les vieux avions qu'il n'utilise plus pour contribuer à la mise en place de notre force aérienne."
 SWK_Establish_Kuching_Air_Base_desc:0 "Puisque nous disposons désormais d'une force aérienne, établissons une base aérienne à Kuching."
 
 SWK_Support_Gerald_MacBryan_Ambition_desc:0 "L'ancien secrétaire du Rajah, Gerald MacBryan, a revendiqué le trône de Brunei, nous soutiendrons ses ambitions et son droit au trône."
 SWK_Contact_The_British_desc:0 "Nous tenterons de contacter le gouvernement de Sa Majesté pour nous aider à plaider en faveur de la succession de MacBryan au trône de Brunei."
 SWK_Solidify_MacBryan_Regency_desc:0 "En soutenant la régence de MacBryan, nous contribuerons à le consolider en tant que nouveau sultan de Brunei."
 SWK_Arrange_MacBryan_Coronation_desc:0 "Il est enfin temps de couronner MacBryan, son ascension au trône contribuera à unifier le peuple de Bornéo et à contrer toute infiltration communiste."
 SWK_Annex_Brunei_desc:0 "L'unification des régions à majorité musulmane de Bornéo sous un seul État garantira sans aucun doute la prospérité et la stabilité."

#### SWK Ideas
