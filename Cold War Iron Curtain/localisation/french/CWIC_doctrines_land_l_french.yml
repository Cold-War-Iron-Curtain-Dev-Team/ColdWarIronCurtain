l_french:
 GRAND_DOCTRINE_CW_FORWARD_DEFENSE: "Défense avancée"
 GRAND_DOCTRINE_CW_FORWARD_DEFENSE_DESC: "Planification de l'OTAN, depuis Fulda Gap jusqu'à la bataille aéroterrestre : maintenir la ligne aussi loin à l'est que possible, échanger de l'espace contre du temps sous contrôle, et laisser les armes combinées et la puissance aérienne briser les échelons que le Pacte de Varsovie nourrit."
 GRAND_DOCTRINE_CW_DEEP_BATTLE: "Bataille profonde"
 GRAND_DOCTRINE_CW_DEEP_BATTLE_DESC: "L'école soviétique des offensives échelonnées : masse, élan et profondeur opérationnelle. Fixez l'ennemi avec des tirs de premier échelon, puis versez de l'armure à travers la brèche avant qu'il ne puisse former une deuxième ligne."
 GRAND_DOCTRINE_CW_PEOPLES_WAR: "Guerre populaire"
 GRAND_DOCTRINE_CW_PEOPLES_WAR_DESC: "La doctrine de Mao sur la guerre prolongée : l'armée est le poisson et le peuple la mer. Échangez de l'espace contre du temps, saignez l'ennemi dans la campagne et frappez lorsque la balance a changé."
 GRAND_DOCTRINE_CW_INTERVENTION_PACIFICATION: "Intervention et pacification"
 GRAND_DOCTRINE_CW_INTERVENTION_PACIFICATION_DESC: "L'école française et coloniale : petites forces professionnelles, projection rapide et méthodes de guerre révolutionnaire pour tenir les frontières lointaines de l'empire contre les insurgés et les puissances rivales."
 GRAND_DOCTRINE_CW_PREEMPTIVE_MANEUVER: "Manoeuvre préventive"
 GRAND_DOCTRINE_CW_PREEMPTIVE_MANEUVER_DESC: "La réponse d'Israël à une profondeur stratégique nulle : frapper en premier, avancer vite, combattre sur le sol ennemi. La puissance blindée et aérienne gagne la guerre quelques jours avant que les réservistes n'épuisent l'économie."
 GRAND_DOCTRINE_CW_TOTAL_NATIONAL_DEFENSE: "Défense nationale totale"
 GRAND_DOCTRINE_CW_TOTAL_NATIONAL_DEFENSE_DESC: "La doctrine du neutre armé : chaque citoyen un soldat, chaque crête une forteresse. Aucun envahisseur ne peut occuper une nation au point de rendre l'occupation insupportable."
 GRAND_DOCTRINE_CW_REVOLUTIONARY_INSURGENCY: "Insurrection révolutionnaire"
 GRAND_DOCTRINE_CW_REVOLUTIONARY_INSURGENCY_DESC: "Foco et guerre irrégulière : une petite avant-garde déterminée, des griefs populaires et un sanctuaire peuvent renverser une armée moderne. La politique et les embuscades comptent plus que le champ de bataille."
