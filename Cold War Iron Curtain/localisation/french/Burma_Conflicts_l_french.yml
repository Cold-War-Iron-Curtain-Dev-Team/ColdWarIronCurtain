 Rohingya_Insurgency_Decisions:0 "£ROH_Icon Les moudjahidin rohingyas"
 Rohingya_Insurgency_Decisions_desc:0 "Les dirigeants musulmans rohingyans ont cherché à rejoindre le Pakistan avant la partition, mais ont été repoussés. Les efforts visant à convaincre le gouvernement birman de céder le territoire au Pakistan ont également été rejetés. Par la suite, des bandes locales de combattants se faisant appeler Moudjahidines se sont organisées et ont pris les armes contre l'armée birmane. Les combattants bénéficient d'un soutien et de sympathisants locaux au Pakistan. Le gouvernement birman est confronté à une tâche difficile : reprendre le contrôle du nord de l'Arakan.\n\nForce actuelle : [?ROOT.rohingya_insurgency|R]%"
