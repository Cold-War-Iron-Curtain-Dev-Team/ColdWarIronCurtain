 arakan_insurgency_options.3.d:0 "Un repaire de montagne de ce qu'on appelle l'Armée de libération de l'Arakan a été récemment identifié par une patrouille. Le commandant local a organisé une force d'assaut, a reconnu le camp ennemi et a lancé un assaut. L'attaque a été un succès majeur, nous avons infligé de lourdes pertes, capturé des prisonniers, des armes et des documents. Le commandant affirme que la zone semble pour le moment largement pacifiée. Espérons que nous pourrons bâtir sur ce succès et continuer à détruire ce groupe anti-étatique. Les renseignements indiquent que l'ennemi est gravement préoccupé par son revers."
 arakan_insurgency_options.4.d:0 "Une unité a identifié une petite base de combattants dits de l'Armée de libération de l'Arakan. Ces mécréants anti-étatiques étaient activement engagés dans des opérations hostiles dans la région. Le commandant de l'unité a organisé un groupe d'assaut composé de nos soldats, mais il n'a pas suivi de tactique judicieuse. Il a surestimé sa propre puissance de feu et sous-estimé les capacités de l'ennemi. Nos hommes ont fini par être détectés à leur approche et ont été impitoyablement pris en embuscade. Nous avons subi de lourdes pertes et n'avons pas réussi à capturer la position ennemie ni à lui infliger des pertes importantes. Plusieurs armes ont également été abandonnées sur le terrain. Il s'agit d'un revers majeur pour nos opérations dans la région."
 arakan_insurgency_options.1.d:0 "Les renseignements militaires ont récemment recruté plusieurs villageois d'Arakan pour agir en tant qu'agents pour notre compte. Ils sont allés rejoindre l'Armée de libération de l'Arakan pour apprendre leurs tactiques et leurs plans. L'opération a été un grand succès. Nos agents, aidés par leur formation, accèdent rapidement à des postes d'autorité. Ils ont réussi à transmettre des données précieuses. Nos forces sont capables de répondre efficacement aux mouvements ennemis et ont détruit plusieurs bandes de rebelles. Nous préparons de nouvelles opérations d'infiltration pour nous permettre de remporter une victoire totale."
 arakan_insurgency_options.2.d:0 "Les renseignements militaires ont récemment recruté plusieurs villageois d'Arakan pour agir en tant qu'agents pour notre compte. Ils sont allés rejoindre l'Armée de libération de l'Arakan pour apprendre leurs tactiques et leurs plans. L'opération semble être un grand succès. Nos agents, aidés par leur formation, accèdent rapidement à des postes d'autorité. Cependant, les informations qu'ils nous ont transmises ont conduit nos propres forces à tomber dans des embuscades. Il est clair que certains de ces agents ont trahi la nation. Certains de nos autres agents, sans doute loyaux, ont cessé de communiquer, indiquant qu'ils étaient compromis. Il s'agit d'un revirement majeur, mais nous ne pouvons pas arrêter nos efforts."
 arakan_insurgency_options.5.d:0 "L'Armée a informé l'Armée de l'Air d'une position ennemie majeure située dans une position hautement défendable. Un assaut direct pourrait réussir, mais entraîner de lourdes pertes. L'Armée de l'Air a planifié et organisé une mission. Nos bombardiers ont quitté un aérodrome et ont mené l'attaque. Nous avons envoyé une petite équipe pour évaluer le bombardement et ils ont confirmé que la frappe était un succès. L'Armée de libération de l'Arakan a abandonné le camp en toute hâte, laissant derrière elle des structures détruites et des documents précieux. Ce bombardement réussi montre l'utilisation efficace de la puissance aérienne pour soutenir notre campagne visant à détruire les forces antiétatiques dans le pays."
 arakan_insurgency_options.6.d:0"L'Armée a informé l'Armée de l'Air d'une position ennemie majeure située dans une position hautement défendable. Un assaut direct pourrait réussir, mais entraîner de lourdes pertes. L'Armée de l'Air a planifié et organisé une mission. Nos bombardiers ont quitté un aérodrome et ont mené l'attaque. Nous avons envoyé une petite équipe pour évaluer le bombardement et ils ont été surpris de trouver une ferme bombardée. La position s'est avérée être un centre civil et il n'y a aucune preuve de la présence de l'Armée de libération de l'Arakan. Les habitants seraient furieux des bombardements. Nous devrons réévaluer la manière dont ces missions seront organisées à l'avenir, car la position du gouvernement dans la région s'est désormais affaiblie."
 arakan_insurgency_options.10.d:0 "Le dernier camion des forces militaires birmanes a quitté l'État d'Arakan. Ce faisant, des milliers de personnes dans l'Arakan sont sorties pour célébrer le succès de l'Armée de libération de l'Arakan qui a chassé le gouvernement birman. Le soulèvement a éclaté lorsqu'il est devenu clair que le gouvernement central n'avait pas l'intention de fournir à l'État d'Arakan le niveau d'autonomie qu'il recherchait, ce qui a poussé de nombreuses personnes à rejoindre le soulèvement armé. Les forces gouvernementales n'étaient ni préparées ni capables de gérer les tactiques de délit de fuite des rebelles. Face à l'augmentation du nombre de victimes et à l'augmentation du soutien populaire aux rebelles, le gouvernement birman a ordonné à ses forces de se retirer. Bien que les rebelles et les observateurs étrangers confirment la victoire des rebelles, le gouvernement birman a refusé de la féliciter."
 arakan_insurgency_options.11.d:0 "Le gouvernement birman a publié une nouvelle série de photos montrant des combattants de l'Armée de libération de l'Arakan rendant leurs armes à des officiers de l'armée. Ces images résument une campagne contre-insurrectionnelle réussie qui a vu l'armée birmane dégrader et finalement vaincre le soulèvement d'Arakan. Les rebelles et leurs sympathisants souhaitaient que la fin du régime colonial permette à l'Arakan de garantir son autonomie au sein du nouvel État. Cependant, lorsque le gouvernement birman a semblé peu intéressé à offrir des concessions, cela a poussé de nombreuses personnes à prendre les armes contre le gouvernement. L'armée a réagi rapidement, réussissant à vaincre, déraciner et essentiellement éliminer les rebelles d'Arakan qui constituaient une menace."

 rohingya_insurgency_options.3.d:0 "Une cachette dans la jungle de combattants moudjahidines a été découverte par une patrouille. L'ennemi ne s'est pas rendu compte qu'il avait été exposé. Une unité a été organisée pour lancer une attaque. Ils réussirent à atteindre le camp ennemi sans être détectés et y lancèrent l'assaut. Les moudjahidines se sont dispersés après avoir subi de lourdes pertes. Nous avons capturé des prisonniers, des armes et des renseignements ennemis. Il s'agit d'une victoire majeure pour nos forces dans la région. Nos forces se consolident dans la région. Les moudjahidines y réfléchiront à deux fois avant d'essayer d'affronter nos courageuses forces."
 rohingya_insurgency_options.4.d:0 "Une cachette dans la jungle de combattants moudjahidines a été découverte par une patrouille. L'ennemi ne s'est pas rendu compte qu'il avait été exposé. Une unité a été organisée pour lancer une attaque. Ils réussirent à atteindre le camp ennemi, mais ils furent repérés. Nos hommes se sont retrouvés dans une embuscade ennemie. Nous avons subi de lourdes pertes lors de notre retrait. Il s'agit d'un revers majeur pour les opérations dans la région. Les moudjahidines se sentiront encouragés à poursuivre leurs opérations anti-étatiques. Quoi qu'il en soit, nous poursuivrons la lutte pour l'unité de notre nation."
 rohingya_insurgency_options.1.d:0 "Depuis les villages que nous contrôlons dans le nord de l'Arakan, nous avons lancé une opération de renseignement pour recruter des informateurs locaux. Les moudjahidines font confiance à leur propre peuple. Ainsi, ces agents peuvent recueillir des informations sur les positions ennemies dans la zone. Nous pouvons également suivre leurs déplacements. L'opération est une grande réussite. Nos forces ont réussi à intercepter et à détruire des groupes de moudjahidines dans la région. Cela renforce notre contrôle sur la région. Avec davantage de succès comme celui-ci, nous ramènerons bientôt cette partie du pays à la Birmanie."
 rohingya_insurgency_options.2.d:0 "Depuis les villages que nous contrôlons dans le nord de l'Arakan, nous avons lancé une opération de renseignement pour recruter des informateurs locaux. Les moudjahidines font confiance à leur propre peuple. Ainsi, ces agents peuvent recueillir des informations sur les positions ennemies dans la zone. Nous pouvons également suivre leurs déplacements. L'opération s'est finalement soldée par un échec majeur. De nombreux agents ont fini par faire défection vers les Moudjahidines. Ils ont fourni de faux renseignements et nos forces ont subi une série de défaites. C'est un revers majeur pour notre lutte."
 rohingya_insurgency_options.5.d:0 "L'armée de l'air birmane, à l'aide de vols de reconnaissance, a identifié une clairière dans la jungle qui semble être un camp majeur de moudjahidines. Après une planification intensive, nos pilotes ont lancé un bombardement. Ils ont réussi à atteindre leur cible. Une patrouille a ensuite été dépêchée pour évaluer l'opération. Nous avons trouvé des preuves que nos bombardiers ont détruit un camp de ravitaillement, détruisant des armes et du matériel. Il semble également que l'ennemi ait évacué les blessés du site. Dans leur hâte, l'ennemi a abandonné de précieux documents de renseignement. Il s'agit d'une victoire majeure pour notre Force aérienne et la nation peut être fière de ses pilotes."
 rohingya_insurgency_options.6.d:0 "L'armée de l'air birmane, à l'aide de vols de reconnaissance, a identifié une clairière dans la jungle qui semble être un camp majeur de moudjahidines. Après une planification intensive, nos pilotes ont lancé un bombardement. Ils ont réussi à atteindre leur cible. Une patrouille a ensuite été dépêchée pour évaluer l'opération. Malheureusement, la patrouille n'a trouvé aucune trace de combattants moudjahidines ou d'armes. Nous avions heurté une ferme abandonnée. C'est une situation embarrassante pour nos pilotes et les sympathisants moudjahidines répandent des rumeurs selon lesquelles nous avons assassiné une famille d'agriculteurs. La confiance de nos pilotes est ébranlée, mais nous continuerons la lutte pour l'unité de la nation."
 rohingya_insurgency_options.10.d:0 "Dans les villages rohingyas, des prières ont lieu pour commémorer la victoire de leurs combattants moudjahidines sur l'armée birmane. Le conflit a commencé après que les musulmans du nord de l'Arakan se sont vu refuser le droit de rejoindre le nouvel État musulman du Pakistan. L'arrivée des forces gouvernementales birmanes peu après a poussé de nombreuses personnes à prendre les armes et à chasser les forces gouvernementales de leurs régions. Après d'intenses combats, l'armée birmane a récemment décidé de retirer ses forces de la zone, permettant ainsi aux forces moudjahidines d'occuper complètement le territoire. Il semble que les forces gouvernementales ne soient pas parvenues à gérer les rebelles ni leur capacité à se fondre dans la masse et à encourager le soutien des communautés locales. On ne sait pas si les Rohingyas chercheront l'indépendance, l'unification avec le Pakistan ou l'autonomie au sein de la Birmanie."
 rohingya_insurgency_options.11.d:0 "Lors d'une cérémonie officielle, des combattants moudjahidines échevelés ont rendu leurs armes aux officiers militaires birmans, confirmant ainsi leur défaite. L'armée birmane a réussi et méthodiquement à éroder le soutien aux rebelles Rohingyas et à isoler leurs combattants, permettant ainsi le succès. La rébellion des Rohingyas a commencé suite à l'échec des efforts visant à obtenir l'indépendance de la Birmanie ou l'unification avec le Pakistan. De nombreux Rohingyas craignaient que le gouvernement birman finisse par imposer un régime bouddhiste qui supprimerait leurs pratiques islamiques. La victoire apporte beaucoup de confiance au gouvernement birman et sécurise une région stratégiquement vitale du pays."
 
 BCP_Conflict.1.d:0 "Le gouvernement nationaliste birman a cherché à réprimer et à détruire le parti communiste. Cependant, ses efforts ont échoué car les communistes ont réussi à lancer une campagne militaire réussie et à rallier le peuple à sa cause. Après une série de défaites militaires, le gouvernement s'est rendu au Parti communiste birman. Le nouveau gouvernement a promis de rétablir la paix dans tout le pays. Il prévoit de lancer un programme socialiste révolutionnaire pour apporter rapidement la prospérité à tous les paysans et travailleurs birmans."
 BCP_Conflict.2.d:0 "Le Parti communiste birman, après avoir échoué à forcer le gouvernement à lancer un programme socialiste radical, a eu recours à la résistance armée. Il cherchait à prendre le pouvoir par la force militaire et des tactiques communistes. L'armée birmane a répondu à cette menace en prenant l'ennemi de front et, après une campagne cinglante, a revendiqué la victoire sur les communistes. Malgré la victoire, on craint que les communistes ne ressuscitent avec le temps. Cependant, le gouvernement estime avoir démontré que la résistance armée ne mènera qu'à la défaite."
 Karen_Conflict.1.d:0 "L'Armée de libération nationale Karen a confirmé que les dernières troupes birmanes ont quitté les terres Karen. Cela fait suite à ses opérations réussies contre les forces militaires birmanes envoyées pour réprimer le soulèvement Karen. Les Karens, craignant le déclin de leur statut social, ont déclenché une rébellion armée pour l'indépendance. L'armée birmane s'est révélée incapable de réprimer le soulèvement ou de surmonter la défection des soldats karens vers la cause karen. Le gouvernement birman n'a désormais aucun moyen d'empêcher les Karens d'affirmer leur indépendance."
 Karen_Conflict.2.d:0 "L'armée birmane a confirmé qu'elle avait vaincu l'Armée de libération nationale Karen et qu'elle contrôlait désormais entièrement Karen. Le peuple Karen s'est révolté parce qu'il craignait d'être éloigné de ses rôles traditionnels au sein du gouvernement et de l'armée. Lorsque la révolte a commencé, les soldats karens ont quitté l'armée et les anciens combattants de la Seconde Guerre mondiale ont rejoint les rebelles. Malgré ces défis, l'armée birmane a réussi à mener une campagne méthodique pour dégrader les rebelles Karen et réaffirmer la souveraineté birmane. Cela représente une victoire majeure pour la Birmanie."
 Mon_Conflict.1.d:0 "Les Mon, longtemps victimes des grandes puissances, ont réussi à prendre leur destin en main après avoir chassé de leurs terres les derniers soldats birmans. Les Mon ont commencé leur rébellion pour l'indépendance après que le gouvernement birman ait refusé leur demande d'autodétermination. Les Mon, craignant qu'un État autoritaire ne signifie leur annihilation, se sont rebellés. Malgré les efforts concertés de l'armée birmane pour rétablir l'ordre, ses forces n'ont pas réussi à vaincre les rebelles Mon. Craignant des pertes continues, les Birmans décidèrent de se retirer. Le chemin vers l'autodétermination et l'indépendance des Môn semble inarrêtable."
 Mon_Conflict.2.d:0 "L'armée birmane a rétabli l'autorité gouvernementale sur l'État Mon. L'armée birmane a réussi à dégrader et détruire les forces rebelles Mon, mettant ainsi fin à leur capacité à mener une lutte armée contre l'État. Pour le gouvernement birman, cette victoire lui permettra de se concentrer sur des questions plus urgentes et de renforcer la confiance de son armée. Bien que les Mon aient été vaincus militairement, leur peuple reste mal à l'aise face à la domination birmane. Le temps nous dira si le gouvernement pourra apaiser ces craintes ou s'il ne s'agit là que du premier chapitre d'un conflit futur."

