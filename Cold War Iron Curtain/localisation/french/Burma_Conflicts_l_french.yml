 Burma_Communist_Conflict:0 "L'insurrection communiste du drapeau blanc"
 Mon_Conflict:0 "Le conflit Mon"
 Burma_Communist_Conflict_desc:0 "Le Parti communiste birman s'est lancé dans la résistance armée après que ses efforts visant à imposer un changement politique aient été contrecarrés par le gouvernement. Les nationalistes birmans considéraient les revendications communistes comme trop radicales et poussant la Birmanie vers un conflit mondial. Craignant une répression gouvernementale, les communistes ont fui leur siège politique et ont lancé une lutte armée. L'armée birmane, craignant que les communistes n'unifient d'autres rébellions régionales, souhaite réprimer rapidement la menace communiste.\n\nPoints de victoire actuels du gouvernement birman : [?BRM.Communist_Conflict_Strength]\nPoints de victoire actuels du Parti communiste de Birmanie : [?BCP.Communist_Conflict_Strength]"
 Mon_Conflict_desc:0 "Avant la domination coloniale, les Mon étaient confrontés à une menace existentielle de la part du royaume birman. Cependant, ils ont rejoint le mouvement anticolonial au cours des dernières années de la domination britannique. Après avoir obtenu l'indépendance, les dirigeants Mon ont demandé l'autodétermination au gouvernement, mais cela leur a été refusé. Craignant pour leur avenir, les Mon ont répondu en lançant une rébellion contre le gouvernement. L'armée birmane souhaite restaurer le contrôle de l'État sur les terres Mon.\n\nPoints de victoire actuels du gouvernement birman : [?BRM.Mon_Conflict_Strength]\nPoints de victoire actuels de l'Armée de libération nationale Mon : [?MNL.Mon_Conflict_Strength]"

 Karen_Conflict:0 "Le conflit Karen"
 Launch_Campaign_against_the_Burmese_Government_Tenasserim_Hills:0 "Campagne de lancement dans les collines de Tenasserim"
 Launch_Campaign_Against_the_Burmese_Government_Irrawaddy_Delta:0 "Campagne de lancement dans le delta de l'Irrawaddy"
 KAY_Campaign_against_the_Burmese_Government_Irrawaddy_Delta:0 "Campagne dans le delta de l'Irrawaddy"
 KAY_Campaign_against_the_Burmese_Government_Tenasserim_Hills:0 "Campagne dans les collines de Tenasserim"
 BRM_Launch_Campaign_Against_the_Karen_National_Liberation_Army:0 "Lancement d'une campagne contre l'Armée de libération nationale Karen"
 Launch_Campaign_against_the_Karen:0 "Lancement d'une campagne contre l'Armée de libération nationale Karen"
 Launch_Campaign_Against_the_Karen_National_Liberation_Army:0 "Campagne contre l'Armée de libération nationale Karen"
 Karen_Conflict_desc:0 "La minorité Karen a joué un rôle majeur dans le soutien au régime colonial britannique. En échange, ils ont reçu la faveur d'un emploi au sein du gouvernement, notamment dans l'armée et la police. Après l'indépendance, le nouveau gouvernement a lancé une politique visant à mettre à l'écart les officiers militaires karens et à élargir les rangs à la communauté majoritairement Bamar. Les Karens, craignant que le gouvernement envisage de lancer une campagne de répression pour les transformer en une communauté de seconde classe, ont répondu en lançant leur propre rébellion. De nombreux soldats karens ont fait défection pour rejoindre les rebelles, représentant une menace majeure pour l'armée et l'État birmans.\n\nPoints de victoire actuels du gouvernement birman : [?BRM.Karen_Conflict_Strength]\nPoints de victoire actuels de l'Armée de libération nationale Karen : [?KAY.Karen_Conflict_Strength]"
 KAREN_DESC1:0 "Des combats non concluants entre le gouvernement birman et l'Armée de libération nationale karen ont fait [?BRM.Burmese_Casualties_Karen_Conflict_Display] victimes birmanes et [?BRM.Karen_Casualties_Karen_Conflict_Display] victimes KNLA."
 KAREN_DESC2:0 "Les récents combats entre le gouvernement birman et l'Armée de libération nationale Karen se sont terminés par une victoire birmane, entraînant [?BRM.Burmese_Casualties_Karen_Conflict_Display] de victimes birmanes et [?BRM.Karen_Casualties_Karen_Conflict_Display] de KNLA."
 KAREN_DESC3:0 "Les récents combats entre le gouvernement birman et l'Armée de libération nationale karen se sont terminés par une victoire karen, entraînant [?BRM.Burmese_Casualties_Karen_Conflict_Display] de victimes birmanes et [?BRM.Karen_Casualties_Karen_Conflict_Display] de KNLA."
 MON_DESC1:0 "Des combats non concluants entre le gouvernement birman et l'Armée de libération nationale Mon ont entraîné [?BRM.Burmese_Casualties_Mon_Conflict_Display] de victimes birmanes et [?BRM.Mon_Casualties_Mon_Conflict_Display] de victimes Mon."
 MON_DESC2:0 "Les récents combats entre le gouvernement birman et l'Armée de libération nationale Mon se sont terminés par une victoire birmane, entraînant [?BRM.Burmese_Casualties_Mon_Conflict_Display] de victimes birmanes et [?BRM.Mon_Casualties_Mon_Conflict_Display] de victimes Mon."
 MON_DESC3:0 "Les récents combats entre le gouvernement birman et l'Armée de libération nationale Mon se sont terminés par une victoire Mon, entraînant [?BRM.Burmese_Casualties_Mon_Conflict_Display] de victimes birmanes et [?BRM.Mon_Casualties_Mon_Conflict_Display] de victimes Mon."
 BCP_DESC1:0 "Des combats non concluants entre le gouvernement birman et le Parti communiste birman ont fait [?BRM.Burmese_Casualties_Communist_Conflict_Display] pertes birmanes et [?BRM.Communist_Casualties_Communist_Conflict_Display] pertes communistes."
 BCP_DESC2:0 "Les récents combats entre le gouvernement birman et le Parti communiste birman se sont terminés par une victoire birmane, entraînant [?BRM.Burmese_Casualties_Communist_Conflict_Display] pertes birmanes et [?BRM.Communist_Casualties_Communist_Conflict_Display] pertes communistes."
 BCP_DESC3:0 "Les récents combats entre le gouvernement birman et le Parti communiste birman se sont terminés par une victoire communiste, entraînant [?BRM.Burmese_Casualties_Communist_Conflict_Display] pertes birmanes et [?BRM.Communist_Casualties_Communist_Conflict_Display] pertes communistes."


