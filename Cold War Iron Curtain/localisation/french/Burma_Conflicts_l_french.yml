 arakan_insurgency_Decisions:0 "L'Armée populaire de libération de l'Arakan"
 arakan_insurgency_Decisions_desc:0 "De nombreux habitants d'Arakan ont le sentiment que le colonialisme les prive de tout contrôle sur leur propre destin et sur leurs terres. L'avènement de l'indépendance n'a pas apaisé ces inquiétudes. De nombreux Arakan prennent les armes pour restaurer un Arakan indépendant. Le gouvernement birman et en particulier l'armée considèrent l'État d'Arakan comme une partie essentielle de l'État qui doit être mise au pas par tous les moyens nécessaires.\n\nForce actuelle : [?ROOT.arakan_insurgency|R]%"
