l_french:
 #Country Events
 ADR_sell_tech.0.d:0 "Une délégation de haut niveau est récemment arrivée de Vienne. Au cours des discussions, un haut responsable autrichien a proposé que nous leur achetions des biens de consommation de haute qualité. Ils ont noté que la République démocratique autrichienne possédait les biens de consommation les plus avancés et de la plus haute qualité du monde socialiste et que ces produits pourraient grandement profiter à notre nation et à son peuple. Il est évident que la délégation attend de nous une réponse définitive à sa proposition. Si nous achetons ces biens, cela nuira certainement à nos réserves financières, mais cela renforcerait le lien entre nos deux États. De plus, des produits de cette qualité peuvent s'avérer bénéfiques pour nous. Si nous rejetons la proposition autrichienne, la délégation exprimera certainement sa déception."
 ADR_sell_tech.1.d:0 "Une délégation a été récemment dépêchée à [FROM.GetName] afin de discuter des problèmes communs auxquels nous sommes tous deux confrontés et de leur proposer de leur vendre des biens de consommation. Vendre ces marchandises à d'autres États socialistes renforcera le monde socialiste et augmentera le bonheur de nos citoyens en concurrence avec l'Occident. Après avoir reçu la proposition, le gouvernement de [FROM.GetName] a accepté avec enthousiasme. Ils ont exprimé leur désir de faire progresser leur peuple et de le faire grâce aux connaissances acquises dans le monde socialiste. Cette visite réussie renforce sans aucun doute les liens entre la République démocratique autrichienne et le [FROM.GetName]. Des plans sont déjà en cours d'élaboration pour de futures offres de vente de biens de consommation à des États enthousiastes et amis."
 ADR_sell_tech.2.d:0 "Une délégation a été récemment dépêchée à [FROM.GetName] afin de discuter des problèmes communs auxquels nous sommes tous deux confrontés et de leur proposer de leur vendre des biens de consommation. Vendre ces marchandises à d'autres États socialistes renforcera le monde socialiste et augmentera le bonheur de nos citoyens en concurrence avec l'Occident. Après avoir reçu la proposition, le gouvernement [FROM.GetName] a stupéfié nos diplomates en refusant. Ils ne l'ont pas fait de manière brusque ou brutale, mais ont noté que des contraintes financières entravaient leur capacité à acheter les marchandises. Bien sûr, il s'agit probablement d'un mensonge. Une fois la délégation de retour, nous déclasserons temporairement le personnel de l'ambassade et ses services consulaires pour montrer notre mécontentement."
 