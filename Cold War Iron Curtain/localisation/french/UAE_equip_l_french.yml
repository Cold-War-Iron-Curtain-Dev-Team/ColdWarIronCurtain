##Planes

 UAE_fighter_equipment_0:0 "Force aérienne des Émirats arabes unis"
 UAE_fighter_equipment_0_short:0 "UAEAF"
 UAE_fighter_equipment_0_desc:0 "L'armée de l'air des Émirats arabes unis (UAEAF) est la force aérienne des Émirats arabes unis (EAU), qui fait partie des forces armées des Émirats arabes unis. Son prédécesseur a été créé en 1968, alors que les Émirats étaient encore sous domination britannique. Depuis lors, elle a fait l'objet d'une réorganisation et d'une expansion constantes, tant en termes de capacité que de nombre d'avions."

