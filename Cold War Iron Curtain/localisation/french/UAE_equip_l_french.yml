##Infantry Equipment

 UAE_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 UAE_infantry_equipment_0_short:0 "SMLE n°4"
 UAE_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 UAE_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 UAE_infantry_equipment_1_short:0 "FN FAL"
 UAE_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."
 
 UAE_infantry_equipment_2:0 "Heckler & Koch G3"
 UAE_infantry_equipment_2_short:0 "G3"
 UAE_infantry_equipment_2_desc:0 "Modèle original basé sur le CETME Model 58 introduit en 1959 et approuvé en 1960. Il avait une crosse et un garde-main en bois."

 UAE_infantry_equipment_3:0 "Fusil américain, 5,56 mm, M16A2"
 UAE_infantry_equipment_3_short:0 "M16A2"
 UAE_infantry_equipment_3_desc:0 "Après le manque de fiabilité fréquent de l'arme dans les jungles du Vietnam, le corps des marines américains a demandé une refonte de l'arme. En 1982, la refonte et les améliorations ont été apportées. L'arme comportait un récepteur renforcé, de nouvelles rayures, un boîtier renforcé, un meilleur refroidissement grâce à différents matériaux, un support amélioré pour les éléments attachables et un mécanisme interne repensé qui lui conférait un haut niveau de fiabilité. Il a été témoin de combats au Liban, en Libye, en Égypte et dans tous les autres conflits dans lesquels les États-Unis ont participé depuis leur création."

 UAE_infantry_equipment_4:0 "Fusil américain, 5,56 mm, M16A4"
 UAE_infantry_equipment_4_short:0 "M16A4"
 UAE_infantry_equipment_4_desc:0 "Le M16A4 est la quatrième génération de la série M16. L'ensemble viseur en fer/poignée de transport sur le récepteur supérieur M16A2/M16A3 a été remplacé par un récepteur supérieur à dessus plat \"Picatinny railed\" MIL-STD-1913 pour le montage d'optiques de visée ou un ensemble viseur en fer/poignée de transport amovible. Les viseurs à ouverture arrière M16A4 intégrés dans l'ensemble de poignée de transport monté sur rail Picatinny sont réglables de 300 m (328 yd) à 600 m (656 yd), là où la ligne de viseurs en fer M16A2 similaire peut atteindre jusqu'à 800 m (875 yd)."

