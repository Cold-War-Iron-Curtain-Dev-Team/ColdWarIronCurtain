 UAE_lt_equipment_4_short:0 "AML-90"
 UAE_lt_equipment_4_desc:0 "L'AML-90 est une variante modifiée de l'AML-60, dotée d'une nouvelle tourelle et d'un canon rayé basse pression DEFA de 90 mm qui permettait de combiner les éléments antichar et de reconnaissance des unités territoriales françaises en un nouvel élément capable d'abattre le véhicule le plus lourd susceptible d'être opposé à lui. Il a servi dans de nombreux conflits, notamment la guerre de Toyota, la guerre frontalière sud-africaine et la guerre des Six Jours."
