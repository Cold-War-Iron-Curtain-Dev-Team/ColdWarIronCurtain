l_french:

 berlincrisis.0.t:0 "[GetNewspaperHeader]L'Union soviétique lance un ultimatum sur Berlin"
 berlincrisis.0.d:0 "Le Premier ministre soviétique [SOV.GetLeader] a lancé un ultimatum exigeant le retrait des forces occidentales de Berlin-Ouest dans un délai de six mois. Il insiste sur le fait que la ville devrait devenir une « ville libre », avertissant que si cette demande est ignorée, l'URSS signera un traité de paix distinct avec l'Allemagne de l'Est, mettant ainsi en danger l'accès de l'Occident à Berlin.\nL'ultimatum intervient dans un contexte de tensions croissantes entre l'Union soviétique et l'OTAN, Moscou accusant l'Occident d'utiliser Berlin comme base d'espionnage et de propagande anti-soviétique. Le dirigeant soviétique a averti que si cette demande n'était pas satisfaite, l'URSS signerait un traité de paix distinct avec l'Allemagne de l'Est, mettant ainsi fin aux droits légaux des puissances occidentales sur la ville et laissant les voies d'accès à Berlin-Ouest à la merci du gouvernement est-allemand.\nÀ l'approche de l'échéance fixée par Moscou, les efforts diplomatiques s'intensifient. À huis clos, les responsables de l'OTAN à Paris débattent des réponses possibles. Certains prônent une position ferme, refusant de négocier sous la pression, tandis que d'autres suggèrent d'explorer des options diplomatiques pour éviter une escalade.\nLe monde entier regarde désormais avec inquiétude Berlin redevenir le foyer de la guerre froide. L'Occident tiendra-t-il bon, ou l'ultimatum forcera-t-il un changement historique dans l'équilibre des pouvoirs ?"
 berlincrisis.0.a:0 "La guerre froide va-t-elle devenir brûlante ?"

 berlincrisis.1.t:0 "Crise berlinoise"
 berlincrisis.1.d:0 "Lors du sommet de Vienne du [GetDateText], les tensions sont montées. Lors de sa rencontre avec le président américain [USA.GetLeader], le premier ministre [SOV.GetLeader] a réédité l'ultimatum soviétique pour signer un traité de paix séparé avec l'Allemagne de l'Est et mettre ainsi fin aux accords quadripolaires existants garantissant les droits américains, britanniques et français d'accéder à Berlin-Ouest et à l'occupation de Berlin-Est par les forces soviétiques. Les trois puissances ont répondu qu'aucun traité unilatéral ne pourrait affecter leurs responsabilités et leurs droits à Berlin-Ouest. Dans la confrontation croissante sur le statut de Berlin, [USA.GetLeader] a sapé sa propre position de négociation lors des négociations au sommet de Vienne avec [SOV.GetLeader] en juin 1961. [USA.GetLeader] traduisait essentiellement l'acquiescement des États-Unis à la division permanente de Berlin. Cela a rendu ses déclarations publiques ultérieures, plus affirmées, moins crédibles aux yeux des Soviétiques. Que devons-nous faire concernant la question de Berlin ?"
 berlincrisis.1.a:0 "Organisez un sommet de l'OTAN sur le désarmement de Berlin-Ouest et sa remise."
 berlincrisis.1.b:0 "Nous ne leur donnerons pas un pouce de terrain !"
 
 berlincrisis.101.t:0 "Sommet de Paris sur la crise de Berlin"
 berlincrisis.101.d:0 "En réponse à l'ultimatum de [SOV.GetLeader]en 1958, les Alliés occidentaux se sont réunis à Paris pour discuter de l'avenir de Berlin-Ouest. Face à la pression soviétique, ils débattent des demandes de l'URSS de faire de Berlin-Ouest une « Ville libre » pour apaiser les tensions. Alors que certains responsables y voient un compromis potentiel, d'autres craignent que cela affaiblisse l'influence occidentale et rende la ville vulnérable au contrôle communiste. En fin de compte, les prochaines semaines montreront si les Alliés réaffirmeront leur attachement au statut de Berlin-Ouest et refuseront ou non de se retirer."
 berlincrisis.101.a:0 "Mettez le gouvernement ouest-allemand en ligne. Nous devons les consulter."
 berlincrisis.101.b:0 "Rencontrons les Allemands de l'Ouest à ce sujet."
 berlincrisis.101.c:0 "L'Allemagne de l'Ouest doit y être impliquée."

 
 berlincrisis.102.t:0 "Sommet de l'OTAN sur la crise de Berlin"
 berlincrisis.102.d:0 "Une nouvelle réunion du cabinet a été convoquée aujourd'hui, cette fois en réponse à une question soulevée par les ambassades allemandes à Londres, Paris et Washington, concernant une note soviétique envoyée aux gouvernements de ces trois derniers pays.\n\nAdenauer était déjà assis, tout comme le reste du cabinet, lorsque le ministre des Affaires étrangères, Heinrich von Brentano, s'est précipité, les mains pleines de documents d'information et de documents imprimés.\n\nAdenauer commença. « Brentano, quelles sont les dernières nouvelles ?\n\nBrentano a répondu. « Chancelier, les Soviétiques ont indiqué... enfin, plutôt exigé... que les Alliés retirent leurs troupes de Berlin-Ouest et que la ville soit une ville libre. »\n\nCela a suscité de nombreuses discussions animées dans la salle, au cours desquelles Adenauer a pris la parole. \"Eh bien, je suppose que ce cabinet n'est pas d'accord sur la plupart de ces points, et donc-\"\n\nIl fut interrompu par un ministre adjoint, le ministre des Affaires panallemandes. \"Monsieur, ce ne serait peut-être pas une si mauvaise idée : Berlin pourrait être libre et les Soviétiques pourraient reculer.\" Brentano intervint de nouveau. \"C'est une idée terrible. Nous devrions adopter une ligne plus dure contre les Soviétiques. Après tout, pourquoi avons-nous rejoint l'OTAN ?\" Adenauer fit une pause, réfléchissant."
 berlincrisis.102.a:0 "Cette proposition semble la meilleure pour la paix en Europe. Nous défendons l'idée d'une solution à trois États."
 berlincrisis.102.b:0 "Absurdité. Ils ne tiendront jamais leur promesse."

 berlincrisis.103.t:0 "L'Allemagne de l'Ouest dénonce l'ultimatum soviétique"
 berlincrisis.103.d:0 "L'Allemagne de l'Ouest a fermement rejeté l'ultimatum de [SOV.GetLeader], le considérant comme une menace directe pour sa souveraineté et la sécurité de Berlin-Ouest. Le Chancelier [WGR.GetLeader] et son gouvernement ont refusé toute proposition susceptible d'affaiblir les liens avec les Alliés occidentaux ou de compromettre la liberté de Berlin-Ouest. Ils ont insisté pour que le statut de la ville reste inchangé et ont averti que céder aux exigences soviétiques créerait un dangereux précédent. Au lieu de cela, l'Allemagne de l'Ouest a renforcé son alignement sur l'OTAN et a appelé à une réponse occidentale unie, renforçant ainsi son engagement à résister à la pression soviétique."
 berlincrisis.103.a:0 "Une sage décision." 
 
 berlincrisis.104.t:0 "L'Allemagne de l'Ouest soutient l'idée d'une ville libre de Berlin"
 berlincrisis.104.d:0 "L'Allemagne de l'Ouest a envisagé d'accepter l'ultimatum de [SOV.GetLeader], y voyant un moyen possible d'apaiser les tensions et d'éviter une crise plus profonde. Certains responsables pensaient que faire de Berlin-Ouest une « ville libre » pourrait empêcher une nouvelle agression soviétique et stabiliser la situation. Ils restent cependant prudents et attendent que les Alliés occidentaux prennent une position définitive. Sachant que leur sécurité dépendait du soutien de l'OTAN, ils se sont abstenus de prendre des décisions unilatérales et ont plutôt demandé l'approbation des États-Unis, de la Grande-Bretagne et de la France avant de s'engager dans une quelconque action."
 berlincrisis.104.a:0 "Si telle est leur volonté, qu'il en soit ainsi."
 berlincrisis.104.b:0 "Après réflexion... Cela semble risqué. Berlin-Ouest reste en République fédérale."
 
 berlincrisis.105.t:0 "Les Alliés rejettent notre offre"
 berlincrisis.105.d:0 "Après de longues discussions, les Alliés occidentaux ont décidé de ne pas soutenir la volonté de l'Allemagne de l'Ouest d'accepter l'ultimatum de Khrouchtchev. Ils estiment que faire de Berlin-Ouest une « ville libre » affaiblirait à terme leur position en Europe et exposerait la ville à l'influence soviétique. Au lieu de cela, ils réaffirment leur engagement à défendre le statut actuel de Berlin-Ouest et exhortent l'Allemagne de l'Ouest à rester ferme face à la pression soviétique. Tout en reconnaissant les risques d'escalade, ils sont prêts à relever tous les défis pour garantir que Berlin-Ouest reste libre et sous la protection occidentale."
 berlincrisis.105.a:0 "Moscou n'en sera pas content."
 
 berlincrisis.106.t:0 "Les Alliés occidentaux donnent leur accord"
 berlincrisis.106.d:0 "Les Alliés occidentaux ont revu la position de l'Allemagne de l'Ouest et reconnaissent sa volonté d'accepter l'ultimatum de Khrouchtchev. Après mûre réflexion, ils ont décidé de soutenir cette ligne d'action, estimant qu'elle pourrait réduire les tensions et empêcher une nouvelle escalade soviétique. Bien que des inquiétudes subsistent quant aux implications à long terme, ils sont convaincus que l'établissement de Berlin-Ouest en tant que « Ville libre » sous garanties internationales maintiendra la stabilité. Ils sont désormais prêts à négocier les conditions de cette transition, en veillant à ce que les intérêts et la sécurité de l'Allemagne de l'Ouest restent protégés tout au long du processus."
 berlincrisis.106.a:0 "Mettons les Soviétiques en ligne."
 
 berlincrisis.107.t:0 "La création de la Ville libre de Berlin"
 berlincrisis.107.d:0 "Des rapports en provenance de l'Ouest confirment que les puissances alliées ont convenu de transformer Berlin-Ouest en une « Ville libre ». Les forces alliées quittent la ville au moment où nous parlons, tandis que nos dirigeants considèrent cela comme une victoire diplomatique significative, prouvant que la détermination occidentale s'est affaiblie sous la pression. Même si les détails de la transition restent incertains, nous nous préparons désormais à faire pression pour obtenir des garanties strictes garantissant que le nouveau statut soit conforme aux intérêts soviétiques. Dans le même temps, nous devons rester prudents, conscients que l'Occident pourrait encore tenter de maintenir son influence sur la ville. Néanmoins, cette décision marque une étape majeure vers la consolidation du contrôle soviétique sur l'Europe de l'Est."
 berlincrisis.107.a:0 "Bien."
 


 
 berlincrisis.2.t:0 "[GetNewspaperHeader]L'OTAN évacue Berlin-Ouest"
 berlincrisis.2.d:0 "Après les discussions au sommet de Vienne, l'Union soviétique a lancé un ultimatum à l'OTAN pour qu'elle prenne une décision sur la question de Berlin. Les Soviétiques veulent que Berlin-Ouest soit incorporée à Berlin-Est et qu'elle devienne une ville libre unifiée en tant qu'entité politique distincte au sein de l'Allemagne. Un sommet de l'OTAN a débuté il y a quelques semaines et, après des négociations, l'OTAN a décidé de se retirer de Berlin-Ouest et d'accepter la proposition. L'OTAN a fait une déclaration disant que le monde ne peut pas être entraîné dans la Troisième Guerre mondiale à cause d'une ville divisée. Les troupes américaines, françaises et britanniques stationnées à Berlin-Ouest sont en train d'être retirées et des milliers de civils, craignant que l'Union soviétique ne respecte l'indépendance de la nouvelle Ville libre, tentent de s'enfuir. De nombreux experts ont critiqué cette décision car elle élargit radicalement la sphère d'influence de l'URSS, mais au moins la crise de Berlin a pris fin."
 berlincrisis.2.a:0 "Espérons que cela empêchera la Troisième Guerre mondiale."
 berlincrisis.2.b:0 "Une victoire pour le communisme."
 berlincrisis.2.c:0 "La Troisième Guerre mondiale a été évitée."
 
 berlincrisis.3.t:0 "[GetNewspaperHeader]L'Otan dénonce l'ultimatum de Berlin"
 berlincrisis.3.d:0 "Alors que la confrontation à propos de Berlin s'intensifiait, le président [USA.GetLeader], dans un discours prononcé à la télévision nationale dans la nuit du [GetDateText], a réitéré que les États-Unis ne cherchaient pas la bagarre et qu'il reconnaissait les « préoccupations historiques de l'Union soviétique concernant leur sécurité en Europe centrale et orientale ». Il s'est dit prêt à reprendre les négociations, mais il a également annoncé qu'il demanderait au Congrès 3,25 milliards de dollars supplémentaires pour les dépenses militaires. Il souhaitait six nouvelles divisions pour l'armée et deux pour les Marines, et annonçait son intention de tripler le recrutement et d'appeler les réserves. [USA.GetLeader] proclamait : « Nous recherchons la paix, mais nous ne nous rendrons pas ». Le même jour, il a en outre demandé une augmentation des effectifs de l'armée de 875 000 à environ 1 million, ainsi que l'autorisation de mettre certaines unités de réserve en service actif. En vacances dans la station balnéaire de Sotchi sur la mer Noire, [SOV.GetLeader] aurait été irrité par le discours de [USA.GetLeader]. John Jay McCloy, le conseiller du président en matière de désarmement, qui se trouvait en Union soviétique, a été invité à rejoindre le [SOV.GetLeader]. Il est rapporté que le président a expliqué à McCloy que le renforcement militaire de [USA.GetLeader]menaçait la guerre."
 berlincrisis.3.a:0 "Nous ne laisserons pas le communisme se propager."
 berlincrisis.3.b:0 "Pensons à une autre manière pour cela."
 berlincrisis.3.c:0 "Les tensions vont monter."
 
 berlincrisis.4.t:0 "L'OTAN refuse l'ultimatum de Berlin"
 berlincrisis.4.d:0 "L'OTAN a rejeté l'ultimatum, affirmant qu'il violait les accords des Quatre Grands signés en 1946. Les Américains, les Britanniques et les Français ont clairement indiqué qu'ils ne céderaient aucun territoire aux communistes. Pendant ce temps, le gouvernement est-allemand cherche des conseils sur les prochaines étapes. Comment devons-nous procéder ? Nous pourrions accroître la pression sur l'Occident en déployant des chars et des troupes le long de la frontière, ou nous pourrions choisir d'accepter leur décision."
 berlincrisis.4.a:0 "Une option militaire fonctionnera."
 berlincrisis.4.b:0 "Nous allons permettre que cette décision soit maintenue."
 
 berlincrisis.5.t:0 "La crise à Berlin s'intensifie"
 berlincrisis.5.d:0 "L'Union soviétique exprime son vif mécontentement face au refus de l'OTAN d'accepter l'ultimatum, soulignant que la patrie a sacrifié des millions de vies pour atteindre Berlin. Les dirigeants soviétiques préviennent que les puissances occidentales risquent de provoquer une Troisième Guerre mondiale si elles ne se retirent pas, ce qui pourrait entraîner la mort de milliards de personnes. Les tensions à Berlin sont à un point de rupture, avec des chars et des troupes soviétiques positionnés juste en face de nos forces. Comment devons-nous réagir ?"
 berlincrisis.5.a:0 "C'est une attaque !"
 berlincrisis.5.b:0 "Envoyez un diplomate parler à l'URSS."
 berlincrisis.5.c:0 "Retirez nos chars et nos soldats."
 berlincrisis.5.e:0 "Laissons cela aux États-Unis."
 
 berlincrisis.6.t:0 "[GetNewspaperHeader]La Troisième Guerre mondiale éclate"
 berlincrisis.6.d:0 "Après des semaines de pourparlers et de tensions croissantes entre l'OTAN et le Kominform, les diplomates ne sont pas parvenus à s'entendre, au point qu'ils se sont lancés des insultes. Des rapports arrivent selon lesquels Berlin est à nouveau assiégée, des tirs de canons et d'armes à feu pourraient être entendus à des kilomètres à la ronde, des chasseurs et des bombardiers se bousculent et les marines quittent leurs quais. Des pays du monde entier ont une fois de plus mobilisé leurs troupes. La Troisième Guerre mondiale a commencé, mais la seule question que nous nous posons est : s'agira-t-il d'une guerre conventionnelle ou d'une guerre nucléaire ?"
 berlincrisis.6.a:0 "Dieu nous aide."
 
 berlincrisis.7.t:0 "[GetNewspaperHeader]Pourparlers sur la crise berlinoise"
 berlincrisis.7.d:0 "Les États-Unis ont envoyé un diplomate en URSS pour parler de la crise de Berlin en réponse aux menaces soviétiques d'action militaire. Les deux parties tentent de maintenir les tensions à un niveau bas, mais des difficultés continuent de surgir lorsque les Soviétiques déclarent que l'OTAN n'a pas sa place à Berlin et que l'OTAN est en désaccord pour des raisons de sécurité internationale. Espérons que la crise de Berlin sera résolue ici et que le monde n'entrera pas dans la Troisième Guerre mondiale."
 berlincrisis.7.a:0 "Nous y mettrons fin et garderons Berlin-Ouest."
 berlincrisis.7.b:0 "Nous en finirons avec cela et prendrons Berlin-Ouest."
 berlincrisis.7.c:0 "Espérons que cela se termine bientôt."
 
 berlincrisis.8.t:0 "Discussions sur les questions de Berlin"
 berlincrisis.8.d:0 "Les tensions sont à un niveau sans précédent. Le gouvernement américain a envoyé un diplomate pour engager des négociations avec nous sur la question de Berlin. Le monde suit de près le déroulement de ces négociations. Nous avons désormais l'occasion de discuter de l'avenir de Berlin avec les Américains. Quel devrait être notre objectif principal dans ces pourparlers ?"
 berlincrisis.8.a:0 "Faire pression pour un Berlin réunifié."
 berlincrisis.8.b:0 "Exigez la Ville libre de Berlin."
 berlincrisis.8.c:0 "Berlin restera divisé."
 
 berlincrisis.9.t:0 "Négociations de Berlin"
 berlincrisis.9.d:0 "Les Soviétiques souhaitent que Berlin-Ouest et Berlin-Est soient réunis au sein de Berlin. Ils veulent que le pays soit sous contrôle de la RDA, sans forces d'occupation. Berlin sera également une zone démilitarisée. Aucune force, que ce soit à l'Est ou à l'Ouest, ne sera présente dans la ville. Devons-nous accepter leur accord ? Est-ce qu'on le nie ?"
 berlincrisis.9.a:0 "Acceptez l'accord."
 berlincrisis.9.b:0 "Berlin restera divisé."
 berlincrisis.9.c:0 "C'est désormais aux Américains de décider..."
 
 berlincrisis.10.t:0 "[GetNewspaperHeader]Berlin-Ouest et Berlin-Est unifiés !"
 berlincrisis.10.d:0 "Après des semaines de débats et de négociations houleuses, l'OTAN a accepté de se retirer de Berlin-Ouest, cédant ainsi le contrôle à l'Allemagne de l'Est. L'Union Soviétique a déclaré qu'il s'agissait d'une grande victoire pour la paix mondiale. Dans un communiqué, l'OTAN a justifié cette décision en soulignant que la Seconde Guerre mondiale a pris fin il y a des années et que les habitants de Berlin-Ouest ne devraient plus se sentir comme une population occupée. Cependant, les critiques affirment que cette décision ne fera que renforcer la sphère d'influence communiste, la qualifiant de faux pas stratégique de la part de l'OTAN."
 berlincrisis.10.a:0 "Nous n'avons pas besoin d'occuper Berlin-Ouest."
 berlincrisis.10.b:0 "Une grande victoire pour le Pacte de Varsovie."
 berlincrisis.10.c:0 "Les relations vont-elles se réchauffer maintenant ?"
 
 berlincrisis.11.t:0 "L'URSS propose la Ville libre de Berlin"
 berlincrisis.11.d:0 "Les Soviétiques ont déclaré que si l'OTAN n'acceptait pas une ville unifiée de Berlin contrôlée par la RDA, alors peut-être pourrions-nous former une Ville libre de Berlin. La Ville libre de Berlin comprendrait à la fois Berlin-Ouest et Berlin-Est et serait un État neutre. Le problème, cependant, est que les Soviétiques pourraient influencer le pays neutre de Berlin. Que devrions-nous faire à ce sujet ?"
 berlincrisis.11.a:0 "Autorisez la Ville libre de Berlin."
 berlincrisis.11.b:0 "Nous n'allons pas vendre Berlin-Ouest."
 berlincrisis.11.c:0 "Que décideront les États-Unis ?"
 
 berlincrisis.12.t:0 "[GetNewspaperHeader]Création de la ville libre de Berlin !"
 berlincrisis.12.d:0 "Les États-Unis et l'Union soviétique ont conclu un accord historique pour faire de Berlin une cité-État indépendante et neutre. Dans le cadre de cet arrangement, Berlin ne s'alignera ni sur l'OTAN ni sur le Pacte de Varsovie, conservant plutôt une position de neutralité dans la guerre froide en cours. Même si cette décision est considérée comme une solution temporaire à la crise berlinoise, nombreux sont ceux qui doutent qu'une telle neutralité puisse être maintenue longtemps, compte tenu de l'immense importance stratégique de la ville, tant à l'Est qu'à l'Ouest.\nDans le cadre de cet accord, les forces américaines, soviétiques, britanniques et françaises ont commencé leur retrait de la ville, mettant ainsi fin à leur présence militaire directe à Berlin. Cette décision est largement considérée comme un changement majeur dans l'équilibre des pouvoirs en Europe, susceptible de modifier le cours de la politique de la guerre froide. Cependant, tout le monde ne soutient pas cette décision. L'Allemagne de l'Est et l'Allemagne de l'Ouest ont fermement exprimé leur opposition, les dirigeants de la RDA et de la RFA affirmant que Berlin ne devrait pas rester indépendant mais plutôt être réunifié avec un futur État allemand unifié.\nMalgré le retrait des troupes étrangères, l'incertitude demeure. La neutralité de Berlin tiendra-t-elle ou deviendra-t-elle le prochain champ de bataille dans la lutte idéologique entre l'Est et l'Ouest ? Sous l'oeil attentif du monde entier, le sort de la cité-État nouvellement déclarée est en jeu."
 berlincrisis.12.a:0 "Espérons que cette crise soit terminée."
 berlincrisis.12.b:0 "L'État sera bientôt sous notre contrôle."
 berlincrisis.12.c:0 "Que va-t-il se passer maintenant ?"
 
 berlincrisis.13.t:0 "[GetNewspaperHeader]Les Soviétiques et les Américains retirent leurs troupes de la frontière berlinoise"
 berlincrisis.13.d:0 "\nL'espion du KGB Georgi Bolshakov servant de principal canal de communication, [SOV.GetLeader] et [USA.GetLeader] ont convenu de réduire les tensions en retirant les chars. Le poste de contrôle soviétique communiquait directement avec le général Anatoly Gribkov du haut commandement de l'armée soviétique, qui à son tour téléphonait au [SOV.GetLeader]. Au poste de contrôle américain se trouvait un officier de la police militaire au téléphone avec le quartier général de la mission militaire américaine à Berlin, qui était elle-même en communication avec la Maison Blanche. [USA.GetLeader] a proposé d'agir doucement sur Berlin à l'avenir en échange du retrait préalable des chars par les Soviétiques. Les Soviétiques acceptèrent. [USA.GetLeader] a déclaré à propos du mur \"Ce n'est pas une très bonne solution, mais un mur vaut bien mieux qu'une guerre\". Un char soviétique a d'abord reculé d'environ 5 mètres ; puis un char américain emboîta le pas. Un à un, les chars se retirèrent."
 berlincrisis.13.a:0 "Nous avons réussi à conserver Berlin-Ouest."
 berlincrisis.13.b:0 "Nous aurons Berlin-Ouest une autre fois."
 berlincrisis.13.c:0 "Serons-nous en sécurité ?"
 
 berlincrisis.14.t:0 "[GetNewspaperHeader]La crise berlinoise est terminée"
 berlincrisis.14.d:0 "La crise berlinoise est enfin terminée. Après plusieurs semaines de négociations, de débats houleux, ainsi que d'escalades de la part des forces de l'OTAN et du Kominform, les deux parties ont convenu d'accords mutuels, selon lesquels les États-Unis seraient indulgents avec Berlin-Est et accepteraient que le mur de Berlin soit meilleur que la guerre, en échange que les Soviétiques retirent d'abord leurs chars, les tensions se sont atténuées entre les parties."
 berlincrisis.14.a:0 "Nous avons protégé la ville de Berlin-Ouest"
 berlincrisis.14.b:0 "Nous réessayerons une autre fois."
 berlincrisis.14.c:0 "Berlin-Ouest nous appartiendra plus tard."
 berlincrisis.14.e:0 "Nous avons protégé notre ville."
 berlincrisis.14.f:0 "Berlin a failli nous plonger dans la Troisième Guerre mondiale."


 Giving_Berlin_away_later_Alert_tt:0 "§CNotez que si vous décidez de soutenir la décision de l'Allemagne de l'Ouest d'établir une ville libre à Berlin-Ouest, vous serez obligé de céder Berlin-Ouest à l'Union soviétique, si celle-ci propose une offre pour un Berlin indépendant et unifié.§!"
 Not_Giving_Berlin_away_later_Alert_tt:0 "§CNotez que si vous décidez de maintenir le statu quo à Berlin-Ouest, vous serez obligé de maintenir votre choix dans les futures négociations avec l'Union soviétique sur une ville libre de Berlin, même si les Soviétiques envisagent une nouvelle escalade.§!"
 
