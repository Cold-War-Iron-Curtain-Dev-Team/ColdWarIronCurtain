 berlincrisis.0.t:0 "[GetNewspaperHeader]L'Union soviétique lance un ultimatum à Berlin"
 berlincrisis.0.d:0 "Le Premier ministre soviétique [SOV.GetLeader] a lancé un ultimatum exigeant le retrait des forces occidentales de Berlin-Ouest dans un délai de six mois. Il insiste pour que la ville devienne une « ville libre », avertissant que si cette exigence n'est pas satisfaite, l'URSS signera un traité de paix séparé avec l'Allemagne de l'Est, compromettant ainsi l'accès des Occidentaux à Berlin.\nCet ultimatum intervient dans un contexte de tensions croissantes entre l'Union soviétique et l'OTAN, Moscou accusant l'Occident d'utiliser Berlin comme base d'espionnage et de propagande antisoviétique. Le dirigeant soviétique a averti que si cette exigence n'était pas satisfaite, l'URSS signerait un traité de paix séparé avec l'Allemagne de l'Est, mettant de facto fin aux droits légaux des puissances occidentales sur la ville et laissant les voies d'accès à Berlin-Ouest à la merci du gouvernement est-allemand.\nAlors que l'échéance fixée par Khrouchtchev approche, les efforts diplomatiques s'intensifient. À huis clos, les responsables de l'OTAN à Paris débattent des réponses possibles. Certains préconisent une position ferme, refusant de négocier sous la pression, tandis que d'autres suggèrent d'explorer les options diplomatiques pour éviter une escalade.\nLe monde observe avec anxiété Berlin redevenue l'épicentre de la Guerre froide. L'Occident tiendra-t-il bon, ou l'ultimatum de Khrouchtchev entraînera-t-il un bouleversement historique de l'équilibre des pouvoirs ?"
 berlincrisis.0.a:0 "La Guerre froide va-t-elle dégénérer en conflit armé ?"
 berlincrisis.1.t:0 "Crise de Berlin"
 berlincrisis.1.d:0 "Lors du sommet de Vienne du [GetDateText], les tensions s'exacerbèrent. Rencontrant le président américain [USA.GetLeader], le Premier ministre [SOV.GetLeader] réitéra l'ultimatum soviétique exigeant la signature d'un traité de paix séparé avec l'Allemagne de l'Est, mettant ainsi fin aux accords quadripartites existants qui garantissaient aux États-Unis, au Royaume-Uni et à la France le droit d'accès à Berlin-Ouest et l'occupation de Berlin-Est par les forces soviétiques. Les trois puissances répliquèrent qu'aucun traité unilatéral ne pouvait affecter leurs responsabilités et leurs droits à Berlin-Ouest. Face à l'escalade des tensions concernant le statut de Berlin, [USA.GetLeader] fragilisa sa propre position de négociation lors du sommet de Vienne avec [SOV.GetLeader] en juin 1961. [USA.GetLeader] laissa ainsi entendre que les États-Unis acceptaient la division permanente de Berlin. Ce faisant, ses déclarations publiques ultérieures, plus affirmatives, perdirent en crédibilité aux yeux des Soviétiques. Que faire de la question de Berlin ?"
 berlincrisis.1.a:0 "Organiser un sommet de l'OTAN sur le désarmement de Berlin-Ouest et sa rétrocession."
 berlincrisis.1.b:0 "Nous ne leur céderons pas un pouce de terrain !"
 berlincrisis.101.t:0 "Sommet de Paris sur la crise de Berlin"
 berlincrisis.101.d:0 "En réponse à l'ultimatum de [SOV.GetLeader] en 1958, les Alliés occidentaux se réunirent à Paris pour discuter de l'avenir de Berlin-Ouest. Face aux pressions soviétiques, ils débattirent des exigences de l'URSS de faire de Berlin-Ouest une « ville libre » afin d'apaiser les tensions. Si certains responsables y voyaient un compromis possible, d'autres craignaient que cela n'affaiblisse l'influence occidentale et ne rende la ville vulnérable au contrôle communiste. En définitive, les semaines à venir nous diront si les Alliés réaffirmeront leur engagement envers le statut de Berlin-Ouest et refuseront de se retirer."
 berlincrisis.101.a:0 "Contacter le gouvernement ouest-allemand. Nous devons le consulter."
 berlincrisis.101.b:0 "Rencontrons-nous avec les Allemands de l'Ouest à ce sujet."
 berlincrisis.101.c:0 "L'Allemagne de l'Ouest doit être impliquée dans cela."
 berlincrisis.102.t:0 "Sommet de l'OTAN sur la crise de Berlin"
 berlincrisis.102.d:0 "Une nouvelle réunion du cabinet fut convoquée aujourd'hui, cette fois-ci en réponse à une question soulevée par les ambassades allemandes à Londres, Paris et Washington, concernant une note soviétique adressée aux gouvernements de ces trois pays.\n\nAdenauer était déjà assis, ainsi que le reste du cabinet, lorsque le ministre des Affaires étrangères, Heinrich von Brentano, entra précipitamment, les bras chargés de documents et d'imprimés.\n\nAdenauer commença : « Brentano, quelles sont les dernières nouvelles ? »\n\nBrentano répondit : « Monsieur le Chancelier, les Soviétiques ont indiqué… enfin, plutôt exigé… que les Alliés retirent leurs troupes de Berlin-Ouest et que la ville devienne une Ville libre. »\n\nCette déclaration provoqua de vifs débats dans la salle, qu'Adenauer interrompit. « Eh bien, je crois comprendre que ce cabinet n'est pas d'accord sur la plupart de ces points, et par conséquent… »\n\nIl fut interrompu par un ministre d'État, le ministre des Affaires panallemandes. « Monsieur, ce ne serait peut-être pas une si mauvaise idée : Berlin serait libre et les Soviétiques reculeraient. » Brentano l’interrompit de nouveau. « C’est une idée terrible. Nous devrions adopter une ligne plus dure envers les Soviétiques ; après tout, pourquoi avons-nous rejoint l’OTAN ? » Adenauer marqua une pause, pensif."
 berlincrisis.102.a:0 "Cette proposition semble la meilleure pour la paix en Europe. Nous défendons l'idée d'une solution à trois États."
 berlincrisis.102.b:0 "Absurde. Ils ne tiendront jamais leur promesse."
 berlincrisis.103.t:0 "L'Allemagne de l'Ouest dénonce l'ultimatum soviétique"
 berlincrisis.103.d:0 "L’Allemagne de l’Ouest a fermement rejeté l’ultimatum de [SOV.GetLeader], le considérant comme une menace directe pour sa souveraineté et la sécurité de Berlin-Ouest. Le chancelier [WGR.GetLeader] et son gouvernement ont refusé toute proposition susceptible d’affaiblir les liens avec les Alliés occidentaux ou de compromettre la liberté de Berlin-Ouest. Ils ont insisté sur le maintien du statut inchangé de la ville et ont averti que céder aux exigences soviétiques créerait un dangereux précédent. Au contraire, l’Allemagne de l’Ouest a renforcé son alignement sur l’OTAN et a appelé à une réponse occidentale unie, réaffirmant ainsi son engagement à résister aux pressions soviétiques."
 berlincrisis.103.a:0 "Une décision judicieuse."
 berlincrisis.104.t:0 "L'Allemagne de l'Ouest soutient l'idée d'une ville libre de Berlin"
 berlincrisis.104.d:0 "L'Allemagne de l'Ouest envisagea d'accepter l'ultimatum de [SOV.GetLeader], y voyant un moyen possible d'apaiser les tensions et d'éviter une crise plus profonde. Certains responsables estimaient que transformer Berlin-Ouest en « ville libre » pourrait prévenir toute nouvelle agression soviétique et stabiliser la situation. Toutefois, ils restèrent prudents et attendirent une position ferme des Alliés occidentaux. Sachant que leur sécurité dépendait du soutien de l'OTAN, ils s'abstinrent de toute décision unilatérale, préférant solliciter l'approbation des États-Unis, du Royaume-Uni et de la France avant de s'engager dans une quelconque voie."
 berlincrisis.104.a:0 "Si telle est leur volonté, qu'il en soit ainsi."
 berlincrisis.104.b:0 "Après réflexion… cela me semble trop risqué. Berlin-Ouest reste en République fédérale."
 berlincrisis.105.t:0 "Les Alliés rejettent notre offre"
 berlincrisis.105.d:0 "Après de longues discussions, les Alliés occidentaux ont décidé de ne pas soutenir la volonté de l'Allemagne de l'Ouest d'accepter l'ultimatum de Khrouchtchev. Ils estiment que transformer Berlin-Ouest en « ville libre » affaiblirait à terme leur position en Europe et exposerait la ville à l'influence soviétique. Ils réaffirment donc leur engagement à défendre le statut actuel de Berlin-Ouest et exhortent l'Allemagne de l'Ouest à résister fermement aux pressions soviétiques. Tout en reconnaissant les risques d'escalade, ils sont prêts à relever tous les défis afin de garantir que Berlin-Ouest demeure libre et sous protection occidentale."
 berlincrisis.105.a:0 "Moscou ne sera pas contente."
 berlincrisis.106.t:0 "Les Alliés occidentaux donnent leur consentement"
 berlincrisis.106.d:0 "Les Alliés occidentaux ont examiné la position de l'Allemagne de l'Ouest et reconnaissent son désir d'accepter l'ultimatum de Khrouchtchev. Après mûre réflexion, ils ont décidé de soutenir cette démarche, estimant qu'elle pourrait apaiser les tensions et prévenir une nouvelle escalade soviétique. Malgré des inquiétudes persistantes quant aux conséquences à long terme, ils sont convaincus que l'établissement de Berlin-Ouest comme « ville libre », sous garanties internationales, garantira la stabilité. Ils sont désormais prêts à négocier les modalités de cette transition, en veillant à ce que les intérêts et la sécurité de l'Allemagne de l'Ouest soient préservés tout au long du processus."
 berlincrisis.106.a:0 "Mettons les Soviétiques sur la ligne."
 berlincrisis.107.t:0 "La création de la Ville libre de Berlin"
 berlincrisis.107.d:0 "Des informations en provenance de l'Ouest confirment que les Alliés ont accepté de transformer Berlin-Ouest en « Ville libre ». Les forces alliées quittent la ville en ce moment même, et nos dirigeants considèrent cela comme une victoire diplomatique majeure, preuve que la détermination occidentale a faibli sous la pression. Si les modalités de la transition restent incertaines, nous nous préparons dès à présent à exiger des garanties strictes afin que ce nouveau statut soit conforme aux intérêts soviétiques. Parallèlement, nous devons rester vigilants, conscients que l'Ouest pourrait encore tenter de maintenir son influence sur la ville. Néanmoins, cette décision marque une étape importante vers la consolidation du contrôle soviétique sur l'Europe de l'Est."
 berlincrisis.107.a:0 "Bien."
 berlincrisis.2.t:0 "[GetNewspaperHeader] L'OTAN évacue Berlin-Ouest"
 berlincrisis.2.d:0 "À l'issue du sommet de Vienne, l'Union soviétique a lancé un ultimatum à l'OTAN concernant la question de Berlin. Les Soviétiques souhaitent la réintégration de Berlin-Ouest à Berlin-Est et la création d'une Ville libre unifiée, en tant qu'entité politique distincte au sein de l'Allemagne. Un sommet de l'OTAN s'est tenu il y a quelques semaines et, après des discussions, l'OTAN a décidé de se retirer de Berlin-Ouest et d'accepter la proposition. L'OTAN a déclaré que le monde ne pouvait pas être entraîné dans une Troisième Guerre mondiale à cause d'une ville divisée. Les troupes américaines, françaises et britanniques stationnées à Berlin-Ouest sont en cours de retrait et des milliers de civils, craignant que l'Union soviétique ne respecte pas l'indépendance de la nouvelle Ville libre, tentent de fuir. De nombreux experts ont critiqué cette décision, car elle étend considérablement la sphère d'influence de l'URSS, mais au moins la crise de Berlin est terminée."
 berlincrisis.2.a:0 "Espérons que cela empêchera la Troisième Guerre mondiale."
 berlincrisis.2.b:0 "Une victoire pour le communisme."
 berlincrisis.2.c:0 "La Troisième Guerre mondiale a été évitée."
 berlincrisis.3.t:0 "[GetNewspaperHeader] L'OTAN dénonce l'ultimatum de Berlin"
 berlincrisis.3.d:0 "Alors que la confrontation autour de Berlin s'intensifiait, le président [USA.GetLeader], dans un discours télévisé diffusé à l'échelle nationale le soir du [GetDateText], a réaffirmé que les États-Unis ne recherchaient pas le conflit et qu'il reconnaissait les « préoccupations historiques de l'Union soviétique concernant sa sécurité en Europe centrale et orientale ». Il s'est dit disposé à reprendre les négociations, mais a également annoncé qu'il demanderait au Congrès un budget supplémentaire de 3,25 milliards de dollars pour les dépenses militaires. Il souhaitait la création de six nouvelles divisions pour l'armée de terre et de deux pour les Marines, et a annoncé son intention de tripler le service militaire obligatoire et de mobiliser les réservistes. [USA.GetLeader] a proclamé : « Nous recherchons la paix, mais nous ne capitulerons pas ». Le même jour, il a également demandé une augmentation des effectifs de l'armée de terre, les faisant passer de 875 000 à environ un million d'hommes, ainsi que l'autorisation de mobiliser certaines unités de réserve. En vacances à Sotchi, station balnéaire de la mer Noire, [SOV.GetLeader] aurait été irrité par le discours de [USA.GetLeader]. John Jay McCloy, conseiller du président pour le désarmement, qui se trouvait alors en Union soviétique, fut invité à rejoindre [SOV.GetLeader]. Il semblerait que le président lui ait expliqué que le renforcement militaire de [USA.GetLeader]concernant les États-Unis menaçait de déclencher une guerre."
 berlincrisis.3.a:0 "Nous ne laisserons pas le communisme se propager."
 berlincrisis.3.b:0 "Essayons de trouver une autre solution."
 berlincrisis.3.c:0 "Les tensions vont monter."
 berlincrisis.4.t:0 "L'OTAN refuse l'ultimatum de Berlin"
 berlincrisis.4.d:0 "L'OTAN a rejeté l'ultimatum, déclarant qu'il viole les accords des Quatre Grands signés en 1946. Les Américains, les Britanniques et les Français ont clairement indiqué qu'ils ne céderaient aucun territoire aux communistes. De son côté, le gouvernement est-allemand cherche des directives quant à la marche à suivre. Comment procéder ? Nous pourrions accroître la pression sur l'Ouest en déployant des chars et des troupes le long de la frontière, ou bien choisir d'accepter leur décision."
 berlincrisis.4.a:0 "Une option militaire est envisageable."
 berlincrisis.4.b:0 "Nous laisserons cette décision en vigueur."
 berlincrisis.5.t:0 "La crise berlinoise s'aggrave"
 berlincrisis.5.d:0 "L'Union soviétique exprime son vif mécontentement face au refus de l'OTAN d'accepter l'ultimatum, soulignant que la Mère Patrie a sacrifié des millions de vies pour atteindre Berlin. Les dirigeants soviétiques avertissent que les puissances occidentales risquent de déclencher la Troisième Guerre mondiale si elles ne se retirent pas, ce qui pourrait entraîner la mort de milliards de personnes. Les tensions à Berlin sont à leur comble, les chars et les troupes soviétiques étant positionnés juste en face de nos forces. Comment devons-nous réagir ?"
 berlincrisis.5.a:0 "C'est une attaque !"
 berlincrisis.5.b:0 "Envoyez un diplomate parler à l'URSS."
 berlincrisis.5.c:0 "Retirons nos chars et nos soldats."
 berlincrisis.5.e:0 "Laissons cela aux États-Unis."
 berlincrisis.6.t:0 "[GetNewspaperHeader]La Troisième Guerre mondiale éclate"
 berlincrisis.6.d:0 "Après des semaines de négociations et de tensions croissantes entre l'OTAN et le Kominform, les diplomates n'ont pas réussi à trouver un terrain d'entente, et la situation a dégénéré en échanges d'insultes. Selon les informations, Berlin est de nouveau assiégée : des tirs de canon et d'armes à feu sont audibles à des kilomètres à la ronde, des chasseurs et des bombardiers décollent et des navires de guerre quittent leurs ports. Les pays du monde entier ont mobilisé leurs troupes. La Troisième Guerre mondiale a commencé, mais la seule question qui demeure est : sera-ce une guerre conventionnelle ou une guerre nucléaire ?"
 berlincrisis.6.a:0 "Que Dieu nous vienne en aide."
 berlincrisis.7.t:0 "[GetNewspaperHeader]Négociations sur la crise de Berlin"
 berlincrisis.7.d:0 "Les États-Unis ont dépêché un diplomate en URSS pour discuter de la crise de Berlin, en réponse aux menaces d'intervention militaire soviétiques. Les deux camps s'efforcent de maintenir les tensions à un niveau bas, mais des difficultés persistent, les Soviétiques affirmant que l'OTAN n'a pas sa place à Berlin, ce que l'OTAN conteste pour des raisons de sécurité internationale. Espérons que la crise de Berlin sera résolue et que le monde n'entrera pas dans une Troisième Guerre mondiale."
 berlincrisis.7.a:0 "Nous mettrons fin à cela et conserverons Berlin-Ouest."
 berlincrisis.7.b:0 "Nous allons mettre fin à tout ça et prendre Berlin-Ouest."
 berlincrisis.7.c:0 "Espérons que cela se termine bientôt."
 berlincrisis.8.t:0 "La question de Berlin"
 berlincrisis.8.d:0 "Les tensions sont à leur comble. Le gouvernement américain a dépêché un diplomate pour entamer des pourparlers avec nous concernant la question de Berlin. Le monde entier suit de près le déroulement de ces négociations. Nous avons désormais l'occasion de discuter de l'avenir de Berlin avec les Américains. Quel devrait être notre principal axe de discussion ?"
 berlincrisis.8.a:0 "Plaidoyer pour un Berlin réunifié."
 berlincrisis.8.b:0 "Exiger la ville libre de Berlin."
 berlincrisis.8.c:0 "Berlin restera divisée."
 berlincrisis.9.t:0 "Négociations de Berlin"
 berlincrisis.9.d:0 "Les Soviétiques veulent réunir Berlin-Ouest et Berlin-Est en une seule ville. Ils souhaitent qu'elle soit sous contrôle est-allemand, sans aucune force d'occupation. Berlin deviendra également une zone démilitarisée. Aucune force, ni de l'Est ni de l'Ouest, ne sera présente dans la ville. Devons-nous accepter leur offre ? Devons-nous la refuser ?"
 berlincrisis.9.a:0 "Accepter l'offre."
 berlincrisis.9.b:0 "Berlin restera divisée."
 berlincrisis.9.c:0 "C'est maintenant au tour des Américains..."
 berlincrisis.10.t:0 "[GetNewspaperHeader]Berlin-Ouest et Berlin-Est unifiés !"
 berlincrisis.10.d:0 "Après des semaines de débats et de négociations tendues, l'OTAN a accepté de se retirer de Berlin-Ouest, cédant le contrôle de la ville à l'Allemagne de l'Est. L'Union soviétique a salué cette décision comme une grande victoire pour la paix mondiale. Dans un communiqué, l'OTAN a justifié ce retrait en soulignant que la Seconde Guerre mondiale était terminée depuis longtemps et que les habitants de Berlin-Ouest ne devaient plus se sentir comme une population occupée. Cependant, les critiques estiment que ce retrait ne fera que renforcer la sphère d'influence communiste et le qualifient d'erreur stratégique de la part de l'OTAN."
 berlincrisis.10.a:0 "Nous n'avons pas besoin d'occuper Berlin-Ouest."
 berlincrisis.10.b:0 "Une grande victoire pour le Pacte de Varsovie."
 berlincrisis.10.c:0 "Les relations vont-elles s'améliorer maintenant ?"
 berlincrisis.11.t:0 "L'URSS propose la Ville libre de Berlin"
 berlincrisis.11.d:0 "Les Soviétiques ont déclaré que si l'OTAN n'accepte pas une ville de Berlin unifiée sous le contrôle de la RDA, nous pourrions envisager la création d'une Ville libre de Berlin. Cette Ville libre engloberait Berlin-Ouest et Berlin-Est et serait un État neutre. Le problème, cependant, est que les Soviétiques pourraient exercer une influence sur ce Berlin neutre. Que faire face à cette situation ?"
 berlincrisis.11.a:0 "Autoriser la Ville Libre de Berlin."
 berlincrisis.11.b:0 "Nous n'allons pas vendre Berlin-Ouest."
 berlincrisis.11.c:0 "Quelle sera la décision des États-Unis ?"
 berlincrisis.12.t:0 "[GetNewspaperHeader]Création de la ville libre de Berlin !"
 berlincrisis.12.d:0 "Les États-Unis et l'Union soviétique sont parvenus à un accord historique visant à faire de Berlin une ville-État indépendante et neutre. Aux termes de cet accord, Berlin ne s'alignera ni sur l'OTAN ni sur le Pacte de Varsovie, conservant ainsi une position de neutralité dans le contexte de la Guerre froide.\nBien que cette décision soit perçue comme une solution temporaire à la crise berlinoise, nombreux sont ceux qui doutent de la pérennité de cette neutralité, compte tenu de l'immense importance stratégique de la ville pour l'Est comme pour l'Ouest. Dans le cadre de cet accord, les forces américaines, soviétiques, britanniques et françaises ont entamé leur retrait de la ville, mettant ainsi fin à leur présence militaire directe à Berlin. Ce retrait est largement considéré comme un bouleversement majeur de l'équilibre des pouvoirs en Europe, susceptible de modifier le cours de la Guerre froide. Cependant, cette décision ne fait pas l'unanimité. L'Allemagne de l'Est et l'Allemagne de l'Ouest ont fermement exprimé leur opposition, les dirigeants de la RDA et de la RFA arguant que Berlin ne devrait pas rester indépendante, mais être réunifiée au sein d'un futur État allemand unifié. \nMalgré le retrait des troupes étrangères, l'incertitude demeure. Berlin maintiendra-t-elle sa neutralité, ou deviendra-t-elle le prochain champ de bataille de la lutte idéologique entre l'Est et l'Ouest ? Sous le regard attentif du monde entier, le sort de la cité-État nouvellement proclamée est en suspens."
 berlincrisis.12.a:0 "Espérons que cette crise soit terminée."
 berlincrisis.12.b:0 "L'État sera bientôt sous notre contrôle."
 berlincrisis.12.c:0 "Que va-t-il se passer maintenant ?"
 berlincrisis.13.t:0 "[GetNewspaperHeader] Les Soviétiques et les Américains retirent leurs troupes de la frontière de Berlin"
 berlincrisis.13.d:0 "\nAvec Georgi Bolshakov, espion du KGB, comme principal intermédiaire, [SOV.GetLeader] et [USA.GetLeader] convinrent de réduire les tensions en retirant leurs chars. Le poste de contrôle soviétique était en communication directe avec le général Anatoly Gribkov, haut commandant de l'Armée rouge, qui était lui-même en ligne avec [SOV.GetLeader]. Du côté américain, un officier de la police militaire était en communication téléphonique avec le quartier général de la mission militaire américaine à Berlin, lequel était en contact avec la Maison-Blanche. [USA.GetLeader] proposa de faire preuve de souplesse à Berlin à l'avenir, à condition que les Soviétiques retirent d'abord leurs chars. Les Soviétiques acceptèrent. À propos du Mur, [USA.GetLeader] déclara : « Ce n'est pas une solution idéale, mais un mur vaut bien mieux qu'une guerre.» Un char soviétique recula d'environ cinq mètres, suivi d'un char américain. Les chars se retirèrent un à un."
 berlincrisis.13.a:0 "Nous sommes parvenus à conserver Berlin-Ouest."
 berlincrisis.13.b:0 "Nous aurons Berlin-Ouest une autre fois."
 berlincrisis.13.c:0 "Serons-nous en sécurité ?"
 berlincrisis.14.t:0 "[GetNewspaperHeader]La crise de Berlin est terminée"
 berlincrisis.14.d:0 "La crise de Berlin a finalement pris fin. Après de longues semaines de négociations, de débats houleux et d'escalade des tensions entre l'OTAN et le Kominform, les deux parties ont conclu des accords mutuels. Les États-Unis se montrent plus conciliants envers Berlin-Est et acceptent le mur de Berlin, considérant cela comme préférable à la guerre, en échange du retrait préalable des chars soviétiques. Les tensions entre les deux camps se sont apaisées."
 berlincrisis.14.a:0 "Nous avons protégé la ville de Berlin-Ouest."
 berlincrisis.14.b:0 "Nous réessayerons une autre fois."
 berlincrisis.14.c:0 "Berlin-Ouest sera à nous plus tard."
 berlincrisis.14.e:0 "Nous avons protégé notre ville."
 berlincrisis.14.f:0 "Berlin a failli nous entraîner dans la Troisième Guerre mondiale."
 Giving_Berlin_away_later_Alert_tt:0 "§CNotez que si vous décidez de soutenir la décision de l'Allemagne de l'Ouest d'établir une ville libre à Berlin-Ouest, vous serez obligé de céder Berlin-Ouest à l'Union soviétique si celle-ci propose une offre en vue d'un Berlin unifié et indépendant.§!"
 Not_Giving_Berlin_away_later_Alert_tt:0 "§CNotez que si vous décidez de maintenir le statu quo à Berlin-Ouest, vous serez obligé de maintenir votre choix lors de futures négociations avec l'Union soviétique concernant une ville libre de Berlin, même si les Soviétiques envisagent une nouvelle escalade.§!"
