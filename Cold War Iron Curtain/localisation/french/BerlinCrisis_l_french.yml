 SOV_khruschev_reforms_desc:0 "La mort de Staline en 1953 déclencha une lutte pour le pouvoir, dont [SOV.GetLeader] sortit victorieux. Le 25 février 1956, lors du 20e Congrès du Parti, il prononça le « Discours secret » qui dénonçait les purges de Staline et inaugurait une ère moins répressive en Union soviétique. Ses politiques intérieures, visant à améliorer la vie des citoyens ordinaires, étaient souvent inefficaces, notamment dans le domaine agricole. Dans l'espoir de pouvoir éventuellement s'appuyer sur des missiles pour la défense nationale, [SOV.GetLeader] a ordonné des réductions importantes des forces conventionnelles."
 SOV_the_secret_speech_desc:0 "En 1956, [SOV.GetLeader] critiquait sévèrement le défunt camarade Staline sur ses purges exécutées dans les années 1930 et critiquait ses grands défauts en créant un culte de la personnalité au lieu de promouvoir le communisme pour le travailleur soviétique. Ce discours a fortement influencé la scission sino-soviétique et l'affaiblissement de la sphère politique soviétique partout sur la planète."
 SOV_sino_soviet_split_desc:0 "Après la publication du discours secret de [SOV.GetLeader] en 1956, Mao a dénoncé [SOV.GetLeader] comme un révisionniste pour ses opinions critiques sur le stalinisme, qui constituait la base de nombreux systèmes communistes partout dans le monde, et la scission a fortement affaibli l'URSS, car elle perdait l'un de ses alliés et partenaires économiques les plus importants de la planète."
 SOV_peaceful_coexistence_desc:0 "Lors du 20e Congrès du Parti, [SOV.GetLeader] a défendu et solidifié le concept de coexistence avec les États-Unis après les fortes tensions croissantes liées à la guerre nucléaire. Cette proclamation signifiait la fin du plaidoyer soviétique en faveur de la propagation du communisme par la violence, que les communistes du monde entier considéraient comme une trahison des principes d'une révolution communiste."
