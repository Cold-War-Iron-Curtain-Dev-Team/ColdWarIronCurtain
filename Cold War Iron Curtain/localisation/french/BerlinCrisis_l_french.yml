 SOV_khruschev_reforms_desc:0 "La mort de Staline en 1953 déclencha une lutte de pouvoir dont sortit vainqueur [SOV.GetLeader]. Le 25 février 1956, lors du XXe Congrès du Parti, il prononça le « Discours secret », qui dénonçait les purges staliniennes et inaugurait une ère moins répressive en Union soviétique. Sa politique intérieure, visant à améliorer le sort des citoyens ordinaires, se révéla souvent inefficace, notamment dans le domaine agricole. Espérant à terme s'appuyer sur les missiles pour la défense nationale, [SOV.GetLeader] ordonna des réductions drastiques des forces conventionnelles."
 SOV_the_secret_speech_desc:0 "En 1956, [SOV.GetLeader] critiqua vivement le défunt camarade Staline pour les purges qu'il avait menées dans les années 1930 et dénonça ses graves erreurs, notamment la création d'un culte de la personnalité au lieu de promouvoir le communisme pour les travailleurs soviétiques. Ce discours contribua fortement à la rupture sino-soviétique et à l'affaiblissement de la sphère politique soviétique partout dans le monde."
 SOV_sino_soviet_split_desc:0 "Après la publication du discours secret de [SOV.GetLeader] en 1956, Mao a dénoncé [SOV.GetLeader] comme un révisionniste pour ses critiques du stalinisme, qui a constitué la base de nombreux systèmes communistes à travers le monde, et la scission a fortement affaibli l'URSS, car elle perdait l'un de ses alliés et partenaires économiques les plus importants de la planète."
 SOV_peaceful_coexistence_desc:0 "Lors du XXe Congrès du Parti, le [SOV.GetLeader] a défendu et consolidé le concept de coexistence avec les États-Unis face à la montée des tensions liées à la menace nucléaire. Cette proclamation a marqué la fin de la promotion par l'Union soviétique de la propagation du communisme par la violence, ce que les communistes du monde entier considéraient comme une trahison des principes de la révolution communiste."