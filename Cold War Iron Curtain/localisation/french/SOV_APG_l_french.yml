 SOV_molotov_union_desc:0 "Le camarade Viatcheslav Mikhaïlovitch Molotov assume désormais le rôle de secrétaire général du Parti communiste après la démission du camarade Boulganine. Ami proche du regretté camarade Staline et marxiste pur et dur, sa direction sera sûrement en mesure de relancer notre syndicat et d'assurer la victoire de la révolution prolétarienne dans le monde entier !"
 SOV_finalize_the_cc_clean_desc:0 "Alors que les bureaucrates régionaux ont été traités aux côtés des plus perfides des principaux appareils de sécurité comme Serov et Furtseva, certains individus peu fiables restent au sein du Comité central. Même s'ils ne seront pas nécessairement purgés du parti, ils seront rétrogradés et réaffectés à des endroits où ils ne pourront pas intervenir dans les affaires de la véritable ligne prolétarienne."
 SOV_reorganise_the_presidium_desc:0 "Maintenant que les aspects les plus insignifiants du Comité central ont été réglés, il est temps de se tourner vers l'organe suprême, le Politburo. Quelques changements seront apportés et quelques personnes devront être abattues."
SOV_kaganovich_second_secretary_desc:0 "Le camarade Lazar Kaganovitch a été un fervent défenseur de la véritable doctrine marxiste et un ami de confiance du camarade Molotov, de Lénine et de Staline avant lui. Avec Molotov désormais comme secrétaire général, il n'est que juste que Kaganovitch soit récompensé pour ses efforts et se voit attribuer le rang de deuxième secrétaire." 
 SOV_arrest_mikoyan_pospelov_desc:0 "Anastas Mikoyan et Piotr Pospelov comptent parmi les révisionnistes et les traîtres les plus ignobles qui subsistent dans les rangs de notre parti. Pendant le règne de Khrouchtchev, Mikoyan a agi comme le chien de poche de Khrouchtchev, comme un bouffon pour le roi, et comme nous l'a dit le camarade Hoxha, il a peut-être également participé à une prétendue tentative d'attentat contre la vie de Staline il y a de nombreuses années. Pospelov, en revanche, est un ignoble opportuniste qui a été utilisé par les Khrouchtchéviens pour fabriquer d'innombrables accusations sans fondement contre le camarade Staline et d'autres vrais communistes. Il va sans dire qu'ils seront traités en conséquence."
 
