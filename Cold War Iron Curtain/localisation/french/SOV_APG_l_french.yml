 soviet_leader_change.5.t:0 "Réunion d'urgence du Présidium du Comité central du PCUS"
 soviet_leader_change.5.desc:0 "Le 18 juin, une session extraordinaire du Présidium du Comité central s'est tenue, officiellement pour discuter du renvoi du camarade Khrouchtchev de son poste de Premier secrétaire du PCUS. À la tête de cette initiative se trouvait le groupe dit « Anti-Parti » — Malenkov, Kaganovitch, Molotov et Shepilov — des figures emblématiques de l'ère stalinienne, qui ont réussi à obtenir une majorité au sein du Présidium pour contester la direction de Khrouchtchev.\n\nCependant, des rumeurs persistent concernant un accord en coulisse entre le maréchal Joukov et le président du KGB, Serov, visant à contrecarrer le complot. Ces conspirateurs seront-ils exposés et discrédités, ou le groupe « Anti-Parti » réussira-t-il à remodeler l'avenir de l'Union soviétique ?"
 soviet_leader_change.5.o.A:0 "Khrouchtchev l'emporte. Le plénum du Comité central condamne le groupe anti-Parti."
 soviet_leader_change.5.o.B:0 "Chute de Khrouchtchev. Victoire du groupe anti-Parti."
 soviet_leader_change.8.t:0 "Nomination de Viatcheslav Molotov au poste de secrétaire général du Comité central du PCUS"
 soviet_leader_change.8.d:0 ""
 soviet_leader_change.8.A:0 "Bonne chance, Viatcheslav Mikhaïlovitch !"
 SOV_Molotov.1.t:0 "Finale de la purge du Comité central"
 SOV_Molotov.1.desc:0 "\nEn grande partie une erreur historique : après la mort de Joseph Vissarionovitch Staline, Khrouchtchev remporta la lutte pour le pouvoir. Des réformes insensées, une « libéralisation » inutile, la condamnation du prétendu « culte de la personnalité de Staline » conduisirent à une scission du camp socialiste et de ses alliés. Mais, grâce à une heureuse combinaison d'événements en 57, cette erreur fut corrigée. Certes, le règne de Boulganine fut de courte durée, mais il marqua une nouvelle ère et un retour à des valeurs adéquates dans le pays, au moins le respect des préceptes de Marx-Lénine et l'arrêt de la « privatisation » des postes au sein de l'État par les khrouchtchéviens. Molotov doit comprendre que Khrouchtchev a accompli beaucoup en quatre ans, et qu'il faudra beaucoup de travail pour renverser la situation."
 SOV_Molotov.1.a:0 "La révolution est une idée, une idée sociale !"
 SOV_Molotov.2.t:0 "Réorganiser le présidium"
 SOV_Molotov.2.desc:0 "\nLe Présidium du Soviet suprême de l'URSS est le lieu où tout a commencé. En particulier, le salut du pays et l'arrivée au pouvoir du groupe. Mais si l'on se souvient de l'année 57, 7 des 11 membres du Présidium ont voté pour la destitution de Khrouchtchev, et nous ne pouvons pas tolérer la victoire éventuelle de « nouveaux conspirateurs » de quelque nature que ce soit."
 SOV_Molotov.2.a:0 "Pour protéger et sauver"
 SOV_Molotov.3.t:0 "Purge de Mikoyan et Podgorny"
 SOV_Molotov.3.desc:0 "\nAnastas Hovhannesovich Mikoyan était un éminent commissaire du peuple stalinien dans le passé, qui s'est trahi lui-même tout d'abord pour le profit afin de conserver son poste, et Nikolai Viktorovich Podgorny était le premier secrétaire du Comité régional de Kharkiv, qui visait les rangs soviétiques éminents, dans son cas les traîtres à la patrie et à l'État soviétique, qui ont trahi à la fois les idées du communisme et l'ensemble de l'Union soviétique devraient être réprimés afin d'empêcher la propagation de leur infection"
 SOV_Molotov.3.a:0 "Encore un chien de compagnie de Khrouchtchev, rien de spécial"
 SOV_Molotov.4.t:0 "Purge de Souslov et Ponomarenko"
 SOV_Molotov.4.desc:0 "\nMikhaïl Andreïevitch Souslov est un homme politique flamboyant, et surtout un instrument idéologique de Khrouchtchev, en réalité un porte-parole propageant des inepties révisionnistes et une politique de trahison. Pantéléimon Kondratievitch Ponomarenko est fondamentalement un nationaliste aux idées délirantes et mégalomanes, notamment son désir de transférer Kaliningrad et ses tentatives pour devenir secrétaire du Comité central du PCUS. Afin d'empêcher que ces horreurs ne se propagent aux masses, ces individus doivent être réprimés au plus vite."
 SOV_Molotov.4.a:0 "Le bon sens finit toujours par l'emporter."
 SOV_Molotov.5.t:0 "Lazar Kaganovich nommé président du présidium"
 SOV_Molotov.5.desc:0 "\nLazar Moiseevich Kaganovitch a été officiellement nommé secrétaire du Présidium, le numéro deux de l'État. Kaganovitch a toujours été réputé pour son dévouement et son efficacité à mener les projets à terme, ce qui explique la confiance que Molotov lui accorde. La rumeur court qu'il succédera à Molotov à la tête de l'État, mais attendons de voir."
 SOV_Molotov.5.a:0 "Iron Lazar est le meilleur, comme toujours."
 SOV_Molotov.6.t:0 "Dmitry Shepilov a été nommé président du Présidium"
 SOV_Molotov.6.desc:0 "\nDmitri Trofimovitch Chepilov – un homme au destin pour le moins complexe – a surmonté avec honnêteté et courage la crise de 1957, alors que tout semblait s'effondrer. Seuls le hasard et l'ingéniosité lui ont permis d'atteindre le rang qu'il occupe aujourd'hui. Certes, sa réputation n'est pas irréprochable : lors de cette réunion du Présidium, il prit d'abord le parti du traître Khrouchtchev, mais après mûre réflexion, il opta pour la raison. Bien que son rôle dans le succès du groupe n'ait pas été déterminant, ses idées, principalement réformistes, contribuèrent au développement et à la prospérité du pays."
 SOV_Molotov.6.a:0 "De nouveaux visages dans une nouvelle vie"
 SOV_Molotov.7.t:0 "Alexei Kossyguine reconduit dans ses fonctions de ministre de l'Industrie légère"
 SOV_Molotov.7.desc:0 "\nToute entreprise a besoin d'une main de fer qui sache la diriger avec sagesse et la guider dans la bonne direction. Kossyguine, qui a géré cette industrie jusqu'à la mort de Staline, était de cette trempe, et son efficacité était redoutable. Alors pourquoi ne pas perpétuer ce mécanisme éprouvé et efficace, qui nous sera tout aussi profitable ?"
 SOV_Molotov.7.a:0 "La patience et le travail acharné finiront par triompher de tout."
 SOV_Molotov.8.t:0 "Réorganisation du Conseil des ministres de l'URSS"
 SOV_Molotov.8.desc:0 "\nLe Conseil des ministres est l'un des organes d'État les plus importants. Il élabore en substance toutes les politiques de l'Union des républiques socialistes soviétiques, tant intérieures qu'extérieures, ainsi que sur le plan économique. Dès lors, pourquoi ne pas prendre le contrôle de ce qui nous guide au cœur même de l'État ? Si nous ne pouvons prévoir les actions de chaque ministère, nous résoudrons tous les problèmes liés au centre, c'est-à-dire au président du Conseil des ministres, et tous les problèmes liés au chef du gouvernement disparaîtront, puisque nous superviserons l'ensemble de notre gouvernement."
 SOV_Molotov.8.a:0 "Le cerveau, en union avec le cœur, contrôlera le corps tout entier."
 SOV_Molotov.9.t:0 "Nikolaï Boulganine nommé président du Conseil des ministres"
 SOV_Molotov.9.desc:0 "\nNikolaï Boulganine est un homme qui a dirigé le Conseil des ministres de 1955 à 1958 et qui possède une vaste expérience. Il est préparé et prêt à toute éventualité. Il connaît le pays sur le bout des doigts, les rouages ​​de l'État et toutes les structures qui y sont liées. Il est aimé et reconnu. Le camarade Molotov, en véritable ami et collaborateur de Nikolaï Alexandrovitch, lui a généreusement confié l'un des rôles les plus importants afin de l'aider à guider le pays sur la bonne voie."
 SOV_Molotov.9.a:0 "Un État communiste ne doit pas concentrer tous les pouvoirs entre les mains d'un seul homme, sinon il n'est pas communiste."
 SOV_Molotov.10.t:0 "Georgy Malenkov nommé président du Conseil des ministres"
 SOV_Molotov.10.desc:0 "\nGeorgy Maksimilianovich Malenkov – l'un des prétendants les plus importants à la place de Joseph Vissarionovitch dans cette déjà lointaine année 1953. Certes, malgré tous ses efforts, il a perdu face à l'insolent Khrouchtchev, mais pour l'instant, nous pouvons mettre en œuvre ses projets visant à créer une véritable égalité, libre de toute entrave et de toute influence."
 SOV_Molotov.10.a:0 "Pour la vérité et pour la prospérité"