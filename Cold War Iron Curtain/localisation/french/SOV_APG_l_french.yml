 SOV_APG_takeover_desc:0 "Les efforts du Présidium ont porté leurs fruits et le désastre a été évité puisque Nikita S. Khrouchtchev a été évincé de tous les postes de pouvoir. Suite à sa politique désastreuse et à son arbitraire administratif, les camarades V. Molotov, L. Kaganovitch, G. Malenkov et D. Shepilov ont réussi à le démettre de ses fonctions et ont entamé le processus fastidieux visant à réparer les dégâts causés par Khrouchtchev pendant son mandat. La Vieille Garde a pris le dessus, et c'est désormais à elle de façonner le syndicat à son image."
 SOV_bulganin_union_desc:0 "Après la destitution du traître révisionniste Khrouchtchev, le camarade Nikolaï Alexandrovitch Boulganine a assumé la direction du Premier ministre de l'Union soviétique et temporairement celui de premier secrétaire du PCUS jusqu'à ce qu'un nouveau secrétaire soit élu par le Comité central. Ayant été vice-premier ministre sous le camarade Staline et membre du Politburo, le leadership du camarade Boulganine ramènera sûrement l'Union soviétique sur la bonne voie."
 SOV_pr_take_mea_again_cornman_desc:0 "Bien que Khrouchtchev ait été évincé, il n'a pas nécessairement été correctement « traité » : tant qu'il reste au sein des organes gouvernementaux, il constitue une menace pour toute tentative visant à revenir sur ses réformes désastreuses et à éloigner l'Union de sa voie suicidaire antérieure. Le Comité central est arrivé à la conclusion qu'il faut faire avec Khrouchtchev ce qui a été fait à Beria, le faire accuser rapidement de quelques accusations graves et l'emprisonner. Bien que risqué, il s'agit à la fois d'un sort juste pour le traître révisionniste et d'un moyen efficace de résoudre la « question Khrouchtchev »."
 SOV_mol_coun_min_chairman_desc:0 "Le camarade Viatcheslav M. Molotov, marxiste-léniniste dévoué depuis les premiers jours de notre parti, a été un élève fidèle des défunts camarades Lénine et Staline et le bras droit de ce dernier. Son leadership et ses réalisations en tant que commissaire du peuple aux affaires étrangères et président du Conseil des commissaires du peuple ont non seulement propulsé notre Union vers l'avenir, mais ont également assuré sa survie. Il n'est donc que juste qu'un vieux bolchevik expérimenté comme lui soit reconduit dans ses fonctions de président du Conseil des ministres, car son expérience et son ferme dévouement aux véritables principes communistes sont ce dont la direction de notre syndicat a besoin en ces temps difficiles."
 SOV_kag_dep_chairman_desc:0 "Si le camarade Molotov était le bras droit de Staline, le camarade Lazar M. Kaganovitch était son bras gauche. Les efforts de Kaganovitch pour la construction du socialisme sont incommensurables : depuis son engagement tempéré en faveur du marxisme-léninisme jusqu'à la supervision de merveilles telles que le métro de Moscou et les succès du programme d'industrialisation de notre Union, il est clair que le camarade Kaganovitch est un homme de confiance et que sa main ferme en tant que vice-président du Conseil des ministres dirigera une fois de plus l'édification socialiste sur la bonne voie."
 SOV_return_stalin_agroculture_methods_desc:0 "Les réformes de marché axées sur le profit mises en oeuvre dans les campagnes par la clique de Khrouchtchev sont une trahison des principes marxistes-léninistes et mettent en jeu l'efficacité de notre programme de collectivisation et de prolétarisation de la paysannerie. Nous devons les abandonner immédiatement et revenir aux méthodes léninistes-staliniennes de développement agricole, tout en les améliorant grâce à des technologies plus récentes."
 SOV_reg_com_purge_khrush_desc:0 "Bien que Khrouchtchev ait été exécuté et que l'influence révisionniste ait considérablement diminué dans les instances supérieures de notre gouvernement, nous ne devons pas oublier que dans les turbulentes années 1930, la Yezhovschina, le Bloc des droits et les trotskistes ont opéré par l'intermédiaire de comités régionaux pour mener à bien leurs actes de terrorisme et de sabotage. Même si notre appareil de sécurité s'est considérablement amélioré depuis lors, on ne peut prendre aucun risque et il faut procéder à un grand ratissage pour débarrasser ces comités des laquais de Khrouchtchev."
 SOV_khrush_affairs_desc:0 "En raison de la nature criminelle et traîtresse du comportement de Khrouchtchev, le camarade Nikolaï A. Boulganine a créé une commission chargée d'enquêter sur l'accession au pouvoir de Khrouchtchev, l'ampleur réelle des dommages causés par ses tendances révisionnistes, son rôle dans la mort de Staline et la nature particulière des purges menées dans la RSS d'Ukraine sous sa direction en tant que Premier secrétaire en 1938. Le rapport final de la commission devrait être prêt pour le prochain 21e Congrès de la RSS d'Ukraine. Du PCUS et portera un coup dur aux restes révisionnistes de notre parti."
 SOV_return_stalin_stat_desc:0 "Au cours de sa soi-disant « croisade » contre le camarade Staline et son héritage, Khrouchtchev a complètement terni l'image de notre défunt leader, l'accusant d'accusations complètement falsifiées et imputant pratiquement chaque excès ou tragédie à la seule personnalité du camarade Staline. Une fois les démolisseurs capturés, il est temps de réhabiliter Staline. Chaque statue sera restaurée, chaque portrait relevé et toute trace des mensonges propagés par les traîtres effacée. L'image de l'élève le plus fidèle de Lénine ne sera plus jamais ternie !"
 SOV_inves_posp_report_desc:0 "Le soi-disant rapport Pospelov, commandé par le traître Khrouchtchev, est pour le moins un document louche. La réhabilitation de criminels condamnés sans preuve appropriée de leur innocence, le recours à des témoignages non vérifiés et à des sources documentaires carrément contradictoires pour ses accusations les plus graves montrent clairement que ce « rapport » était en réalité une attaque diffamatoire mal ficelée contre notre défunt camarade Staline. Une enquête approfondie doit être ouverte pour déterminer la vérité derrière ces affirmations et dénoncer toutes les falsifications qui ont induit le Parti et le peuple en erreur."
 SOV_rem_khrush_cpsu_dogma_desc:0 "Les « améliorations » apportées par Khrouchtchev à la doctrine soviétique, telles que « l'État du peuple tout entier » et la coexistence pacifique avec les impérialistes occidentaux, ont abouti à des déviations désastreuses par rapport à la bonne voie marxiste de construction socialiste. Non seulement nous inverserons toutes ces déviations révisionnistes dégoûtantes, mais nous mettrons également en oeuvre des cours idéologiques rigides et obligatoires de marxisme-léninisme pour empêcher de telles déviations de la part des jeunes cadres à l'avenir."
 SOV_low_destalinization_desc:0 "La soi-disant « déstalinisation » de Khrouchtchev a été la cause de pratiquement tous les problèmes auxquels notre Union a été confrontée au cours des deux dernières années. Qu'il s'agisse de salir l'image de l'élève le plus fidèle de Lénine, qui a servi de condition idéologique préalable aux réformes désastreuses de Khrouchtchev, de ruiner nos relations avec nos camarades d'Albanie et de Chine qui ont rejeté le révisionnisme et de salir la réputation du mouvement socialiste dans le monde entier, cette politique historiquement nihiliste désastreuse doit prendre fin immédiatement. Nous balayerons le tas d'immondices accumulé sur la tombe du camarade Staline, clarifierons et réfuterons les mensonges et les calomnies propagés par les Khrouchtchéviens."
 SOV_revisionism_deafeated_desc:0 "Le jour est enfin venu. Après avoir purgé tous les révisionnistes et inversé la trajectoire suicidaire de notre Union, la main sage et sévère de la Vieille Garde a remis le pays d'Octobre sur la voie socialiste. Sous le camarade Boulganine, le révisionnisme a été écrasé, les traîtres punis, les erreurs inversées, et notre grande Patrie est stable sur son chemin ! Vive les idées de Lénine et de Staline ! Vive la dictature du prolétariat ! Vive la classe ouvrière !"
 SOV_rev_pol_bureau_desc:0 "Maintenant que les principaux khrouchtchéviens ont été démis de leurs fonctions, nous allons commencer à remanier notre bureau politique suprême et à remplacer les traîtres révisionnistes par des gens fidèles à la cause de Marx, Engels, Lénine et Staline. Par exemple, maintenant que Serov a été arrêté, Alexandre Chelepine sera nommé directeur principal du KGB, Ivan Benediktov sera reconduit dans ses fonctions de ministre de l'Agriculture et Nikolai Shvernik prendra le poste de Furtseva de premier secrétaire du comité du parti de la ville de Moscou. Mais ce n'est qu'un début."
 SOV_trip_to_tirana_desc:0 "Le courageux peuple albanais, sous la direction d'Enver Hoxha, a résisté à l'influence révisionniste et a condamné les Khrouchtchéviens alors qu'ils étaient au pouvoir. Maintenant que les Khrouchtchéviens ont été réglés et que le pays d'Octobre est revenu sur le droit chemin, une délégation sera envoyée à Tirana, dirigée par le premier secrétaire Boulganine lui-même, pour améliorer nos relations avec ces courageux marxistes-léninistes"
 SOV_trip_to_beijing_desc:0 "La politique désastreuse de Khrouchtchev a gravement endommagé nos relations avec nos camarades chinois, non seulement en salissant l'image du camarade Staline et en empruntant la voie révisionniste, mais aussi en tentant d'imposer le chauvinisme des grandes puissances à nos camarades orientaux. Maintenant que les révisionnistes ont été éliminés, il est temps de réparer ces erreurs et de reprendre de bonnes relations avec les communistes chinois, qui ont eu le courage de s'opposer à la voie suicidaire empruntée par les Khrouchtcheviens."
 SOV_bulganin_byebye_desc:0 "Bien qu'il ait traité avec beaucoup de soin cette année mouvementée et qu'il ait remis l'Union sur la bonne voie, le camarade Boulganine a exprimé son intention de démissionner de son poste de premier secrétaire du PCUS, en invoquant son âge, la nature de la manière dont il a été élu à ce poste et son désir de céder ce poste à certains de ses camarades \"plus compétents\". Cependant, contrairement au camarade Staline, maintenant que les opportunistes et les révisionnistes ont été purgés du parti, il n'y a plus de lutte de pouvoir généralisée pour savoir qui remplacera l'ancien Premier secrétaire. À l'heure actuelle, les deux candidats les plus populaires au sein du parti sont le président du Conseil des ministres Viatcheslav Molotov et le vice-président du Conseil des ministres Lazar Kaganovitch qui, bien que partageant la même vision, ont des approches différentes sur quelques questions. Que ce soit Molotov ou Kaganovitch qui soit nommé premier secrétaire, l'Union est sûrement entre de bonnes mains."
 SOV_21st_Congress_Bulg_desc:0 "Avec la démission du camarade Boulganine, le Comité central a convoqué un congrès extraordinaire du PCUS pour élire un nouveau premier secrétaire et tracer la voie de notre Union vers l'avenir. Parallèlement à cela, de nombreuses révélations ont été faites notamment avec l'enquête sur le soi-disant « rapport Pospolev » et la plongée du KGB dans l'affaire Khrouchtchev, et il est temps de faire la lumière sur ce que les révisionnistes ont tenté de soustraire aux yeux vigilants de la classe ouvrière. Quels qu'en soient les résultats, ce congrès sera l'un des plus mouvementés de l'histoire de notre Union."
 
 #Molotov events
 
 soviet_leader_change.5.t:0 "Réunion d'urgence du Présidium du Comité central du PCUS"
 soviet_leader_change.5.desc:0 "Le 18 juin, une session extraordinaire du Présidium du Comité central a été convoquée, officiellement pour discuter de la destitution du camarade Khrouchtchev de son poste de premier secrétaire du PCUS. À la tête de cette campagne se trouvait ce qu'on appelle le « Groupe anti-parti » - Malenkov, Kaganovitch, Molotov et Shepilov - des personnalités fidèles de l'ère stalinienne, qui ont rassemblé une majorité au sein du Présidium pour défier la direction de Khrouchtchev.\n\nDes rumeurs persistent cependant selon lesquelles un accord en coulisses entre le maréchal Joukov et le président du KGB Serov aurait pour but de déjouer le complot. Ces conspirateurs seront-ils dénoncés et discrédités, ou le « Groupe anti-parti » réussira-t-il à remodeler l'avenir de l'Union soviétique ?"
 soviet_leader_change.5.o.A:0 "Khrouchtchev l'emporte. Le Plénum du Comité central condamne le groupe anti-parti."
 soviet_leader_change.5.o.B:0 "Khrouchtchev est évincé. La vieille garde remporte la victoire"
 
 soviet_leader_change.8.t:0 "Le 21e Congrès du PCUS"
 soviet_leader_change.8.d:0 "La salle était pleine à sept heures du matin. \n\nMolotov a ouvert le 21e Congrès du Parti communiste de l'Union soviétique par un discours qui a duré quarante minutes et a été interrompu onze fois par des applaudissements, bien qu'il ne l'ait pas écrit en pensant aux applaudissements. Il avait passé la majeure partie de deux heures à parcourir le dossier de Khrouchtchev avec la patience méthodique d'un homme qui avait appris depuis longtemps que la vérité documentée ne nécessitait aucune fioriture : le mépris total de la direction collective, l'ingérence dans les partis frères, les révélations fabriquées du discours secret, la négligence criminelle de Staline mourant et l'excès meurtrier des purges ukrainiennes de 1938, balayés tranquillement sous le tapis pendant que Khrouchtchev se tenait devant le 20e Congrès et pointait son pointer du doigt tout le monde sauf lui-même. \n\"C'est clair\", a déclaré Molotov. « que l'intention de Nikita Sergueïevitch n'était pas simplement de calomnier le camarade Staline avec des affirmations dont il savait parfaitement qu'elles étaient fausses, mais de consolider son pouvoir et celui de sa clique de révisionnistes - de mettre en oeuvre des réformes qui auraient conduit à la capitulation devant les impérialistes anglo-américains et à la mort de notre Union. » Il fit une pause et la salle resta silencieuse. \" Toutefois, Khrouchtchev n'a pas agi seul. Même si la voie suicidaire de notre parti a pris fin, il reste encore quelques hommes qui autrefois étaient là et applaudissaient à l'assassinat de Lénine et aux idées de Staline. Ils n'hésiteront pas à tout recommencer s'ils en ont l'occasion.'' Une autre pause. '' Camarades. Ensemble, nous déjouerons les plans de ces traîtres, enfoncerons le dernier clou dans le cercueil du révisionnisme et poursuivrons la voie tracée par Lénine et Staline. Vive la dictature du prolétariat !'' \n\nLa salle est entrée en éruption. Molotov jeta un regard discret à sa droite, là où était assis Kaganovitch, et à sa gauche, là où Vorochilov s'était levé avec les autres. Puis il scruta la pièce - méthodiquement, sans expression - à la recherche des visages dont il savait qu'ils feraient de leur mieux pour ne pas ressembler à des hommes qui comprenaient précisément ce qui les attendait. Il en a trouvé plusieurs. Leur jour viendrait. \n\nPuis Suslov a pris la parole et l'ambiance est devenue quelque chose de plus dur. Les conclusions de la commission ont été présentées au cours de trois sessions. Citation après citation, le rapport Pospelov a été démantelé. La résolution sur la réhabilitation de l'héritage historique de Staline a été adoptée sans une seule voix dissidente, même si plusieurs délégués sont restés assis un long moment avant de lever la main. \n\nCe soir-là, Molotov était assis seul dans son bureau, les transcriptions de la journée sur le bureau devant lui. Il était dans le Parti depuis assez longtemps pour se souvenir de l'époque où le travail de construction du socialisme semblait être quelque chose avec une direction claire, et ceux qui l'accomplissaient y croyaient sincèrement. Depuis, beaucoup de choses se sont passées. Beaucoup de choses avaient presque été perdues définitivement. \n\nIl redressa les transcriptions, les mit de côté et se leva. Il y avait encore du travail à faire."
 soviet_leader_change.8.A:0 "Gloire à toi, Viatcheslav Mikhaïlovitch !"
 
 SOV_Molotov.1.t:0 "Remaniement"
 SOV_Molotov.1.desc:0 "Les dernières listes sont arrivées sur le bureau de Molotov dans la deuxième semaine après le Congrès, reliées dans des dossiers gris et classées selon la sévérité des recommandations. Les comités régionaux avaient été réglés il y a des mois. Serov était parti, tout comme Furtseva, ainsi que la poignée de fonctionnaires dont Shelepin avait remis les dossiers en personne et sans commentaire. Ce qui restait était un problème plus mineur et plus délicat. Quelques dizaines d'hommes siégeaient encore au Comité central, qui avaient applaudi au bon moment, voté avec la majorité et n'avaient jamais donné à personne de raison documentée pour les destituer.\n\nKaganovitch voulait que l'affaire soit réglée rapidement. Il a lu les noms avec un crayon à la main et en a rayé la moitié avant que Suslov ne lui demande d'arrêter. Il n'y avait rien dans les dossiers pour justifier cela, a déclaré Suslov, et un Comité central qui expulserait des hommes sans motif n'aurait bientôt plus personne qui oserait s'exprimer clairement lors de ses séances. Kaganovitch posa le crayon, sans paraître convaincu.\nMolotov les a écoutés tous les deux et a lu lui-même les dossiers, un à la fois, pendant trois soirées. La plupart étaient des carriéristes ordinaires qui avaient lu correctement le vent en 1956 et le reliraient correctement s'il changeait. Ils n'étaient pas dangereux en raison d'une quelconque conviction. Ils étaient dangereux parce qu'ils étaient positionnés pour être utiles à celui qui viendrait ensuite.\n\nLa solution qui s'est imposée était administrative. Un sous-ministre d'un ministère important est devenu directeur d'un bureau provincial de planification. Un membre candidat ayant une longue expérience dans l'appareil idéologique a été nommé ambassadeur dans un pays rarement mentionné dans les journaux. Deux hommes qui avaient présidé d'importantes commissions se retrouvent à la tête de maisons de repos, d'archives et de musées régionaux. Chacun a reçu une lettre d'appréciation pour ses services passés et une nouvelle adresse. Aucun n'a été expulsé, aucun n'a été arrêté et aucun n'a conservé un siège dans une salle où une décision était prise."
 SOV_Molotov.1.a:0 "Il n'y a pas de place pour les carriéristes..."
 
 SOV_Molotov.2.t:0 "La question du Présidium"
 SOV_Molotov.2.desc:0 "Le bureau était calme au moment où Molotov renvoya le dernier des secrétaires chez lui. La lampe sur le bureau était la seule lumière, et en dessous se trouvait une seule feuille de papier avec les noms du Présidium écrits de sa propre main, dans l'ordre où ils étaient assis autour de la table. Il la regarda longtemps sans rien écrire.\n\nKhrouchtchev avait passé des années à occuper ces fauteuils avec des hommes qui lui devaient tout. Certains d'entre eux avaient été promus pour leur utilité, d'autres pour leur silence, et quelques-uns pour la seule raison qu'ils n'avaient jamais été en désaccord avec lui. Il avait fallu une décennie pour la construire et un seul Congrès pour la faire tomber. Molotov ne croyait pas un seul instant que l'oeuvre de cette décennie avait disparu avec l'homme lui-même. Il pensait au Plénum d'octobre 1952. Staline s'était présenté devant le Comité central et avait parlé de vigilance, de camarades qui s'étaient habitués et avaient oublié de quoi l'ennemi était capable. Molotov était assis au premier rang et entendait son propre nom parmi ceux qui avaient été prévenus. Il ne l'avait pas compris alors. Il l'avait compris maintenant. Le routier capitaliste ne s'annonçait pas et il s'asseyait rarement au fond de la salle. Le plus souvent, il s'asseyait à table, prenait des notes et votait avec la majorité.\n\nIl connaissait Kaganovitch depuis quarante ans et cela ne faisait aucun doute. Malenkov avait commis des erreurs, mais c'étaient les erreurs d'un homme qui voulait que son oeuvre réussisse. Suslov ne s'était jamais écarté de la ligne, et c'était précisément la raison pour laquelle Molotov avait commencé à le surveiller de plus près. Un homme aussi cohérent était soit un roc, soit un miroir, et cette différence comptait. Et puis il y avait les autres, Mikoyan avec son sourire qui survivait à chaque changement de direction, pratiquement le bouffon de Khrouchtchev, Podgorny et Kirichenko avec leur longue loyauté envers l'Ukrainien. Chacun d'eux avait un dossier, et chaque dossier avait une page dont il n'avait pas encore décidé quoi faire.\nIl retourna le papier puis le retourna.\n\nIl y avait un ordre pour ces choses. Un geste fait trop tôt avertirait les hommes qui ne le savaient pas encore, et un geste fait trop tard leur donnerait le temps de se retrouver. Staline l'avait compris mieux que quiconque. Molotov l'avait vu attendre des mois avant d'agir, et il ne l'avait jamais vu attendre trop longtemps. Quelque part dans le bâtiment, une porte se ferma et des pas passèrent dans le couloir et s'évanouirent. Molotov a coiffé sa plume et a mis la liste de côté. Demain, il commencerait."
 SOV_Molotov.2.a:0 "Pour arranger les choses"
 
 SOV_Molotov.3.t:0 "Deuxième secrétaire Lazar Kaganovitch"
 SOV_Molotov.3.desc:0 "\nAnastas Hovhannesovich Mikoyan était dans le passé un éminent commissaire du peuple stalinien, qui s'est trahi avant tout pour le profit afin de conserver son poste, et Nikolai Viktorovich Podgorny était le premier secrétaire du Comité régional de Kharkiv, qui visait les rangs soviétiques éminents, dans son cas les traîtres à la patrie et à l'État soviétique, qui ont trahi à la fois les idées du communisme et l'ensemble de l'Union soviétique doit être réprimée afin d'empêcher la propagation de leur infection"
 SOV_Molotov.3.a:0 "Un autre chien de poche Khrushev, rien de spécial"
 
 SOV_Molotov.4.t:0 "Purge de Souslov et Ponomarenko"
 SOV_Molotov.4.desc:0 "\nMikhaïl Andreïevitch Souslov était un personnage politique vivant, et avant tout un jouet idéologique de Khrouchtchev, en fait, un porte-parole de la promotion d'absurdités révisionnistes et d'une politique de trahison. Panteleimon Kondratievich Ponomarenko est essentiellement un nationaliste aux idées délirantes et mégalomane, en particulier son désir de transférer Kaliningrad et ses tentatives de devenir presque secrétaire du Comité central du PCUS. Afin de ne pas propager cette horreur auprès des masses, ces individus devraient être réprimés le plus rapidement possible."
 SOV_Molotov.4.a:0 "Le bon sens gagne toujours"
 
 SOV_Molotov.5.t:0 "Lazar Kaganovitch nommé président du Présidium"
 SOV_Molotov.5.desc:0 "\nLazar Moiseevich Kaganovich a été officiellement nommé secrétaire du Présidium - la 2e personne de l'État. Kaganovich a toujours été célèbre pour son dévouement et sa capacité à mettre fin aux choses - c'est pourquoi Molotov a confiance en lui. La rumeur dit qu'il sera le prochain chef d'État après Molotov - mais attendons de voir"
 SOV_Molotov.5.a:0 "Iron Lazar est le meilleur, comme toujours"
 
 SOV_Molotov.6.t:0 "Dmitry Shepilov a été nommé président du Présidium"
 SOV_Molotov.6.desc:0 "\nDmitry Trofimovich Shepilov - un homme au destin plutôt compliqué, qui a surmonté avec honnêteté et courage la crise de 1957, alors que tout touchait déjà à sa fin, et seule la volonté du hasard et de l'ingéniosité a aidé Shepilov à devenir là où il est aujourd'hui. Oui, il n'a pas une réputation \"idéale\" - lors de cette réunion du Présidium, il a d'abord choisi le côté du traître Khrouchtchev, mais après avoir réfléchi à la situation et tout réfléchi, il a pris le parti du bon sens. Même si le rôle de Shepilov dans le succès du groupe n'a pas été si important, ses opinions essentiellement réformistes aideront le pays à se développer et à prospérer davantage."
 SOV_Molotov.6.a:0 "De nouveaux visages dans une nouvelle vie"
 
 SOV_Molotov.7.t:0 "Alexeï Kossyguine reconduit dans ses fonctions de ministre de l'Industrie légère"
 SOV_Molotov.7.desc:0 "\nToute entreprise nécessite une main forte qui saura également orienter et guider judicieusement dans la bonne direction. Une telle « main » était Kossyguine, qui jusqu'à la mort de Staline dirigeait cette industrie, et il était incroyablement efficace. Alors pourquoi ne pas poursuivre le bon mécanisme, déjà bien établi, qui nous aidera également ?"
 SOV_Molotov.7.a:0 "La patience et le travail acharné surmonteront tout"
 
 SOV_Molotov.8.t:0 "Réorganisation du Conseil des ministres de l'URSS"
 SOV_Molotov.8.desc:0 "\nLe Conseil des ministres est l'un des organes d'État les plus importants, qui crée essentiellement toutes les politiques de l'Union des Républiques socialistes soviétiques, tant internes qu'externes, ainsi qu'économiques. Alors pourquoi ne pas prendre le contrôle du coeur même de l'État qui nous guide ? Si nous ne pouvons pas prévoir les actions de chaque ministère - alors nous résoudrons tous les problèmes liés au centre, c'est-à-dire le président du Conseil des ministres - et tous les problèmes liés au chef du gouvernement disparaîtront, puisque nous encadrerons l'ensemble de notre gouvernement"
 SOV_Molotov.8.a:0 "Le cerveau en union avec le coeur contrôlera tout le corps"
 
 SOV_Molotov.9.t:0 "Nikolaï Boulganine nommé président du Conseil des ministres"
 SOV_Molotov.9.desc:0 "\nNikolaï Boulganine est un homme qui a dirigé le Conseil des ministres de 1955 à 1958 et il en sait déjà beaucoup. Il est préparé, il est prêt à tout. Il connaît tout le pays, il connaît le mécanisme du gouvernement et toutes les structures associées. Il est aimé, il est connu. Et le camarade Molotov, en tant que véritable ami et associé de Nikolaï Alexandrovitch, lui a gentiment laissé l'un des rôles les plus importants pour l'aider et guider le pays sur la bonne voie."
 SOV_Molotov.9.a:0 "Un État communiste ne doit pas laisser tous les pouvoirs entre les mains d'un seul homme, sinon il n'est pas communiste"
 
 SOV_Molotov.10.t:0 "Gueorgui Malenkov nommé président du Conseil des ministres"
 SOV_Molotov.10.desc:0 "\nGueorgui Maksimilianovitch Malenkov est l'un des prétendants les plus importants à la place de Joseph Vissarionovitch dans la déjà lointaine année 1953. Oui, malgré tous ses efforts, il a perdu face à l'insolent scélérat Khrouchtchev, mais pour le moment nous pouvons mettre en oeuvre ses plans pour créer une véritable égalité sans rien ni personne."
 SOV_Molotov.10.a:0 "Pour la vérité et pour la prospérité"
 
 #Bulganin events
 
 bulg_agriculture_1_tt:0 "En annulant complètement les plans de Khrouchtchev, nous garantirons la sécurité de notre agriculture, mais les innovations futures seront lentes."
 
 bulg_agriculture_2_tt:0 "Expérimenter certaines des propositions de réforme agricole de Khrouchtchev est risqué, mais si nous réussissons, les bénéfices récoltés seront considérables."
 
 sov_stalinist_agriculture:0 "Restauration agricole stalinienne"
 sov_stalinist_agriculture_desc:0 "Les mécanismes de marché de la période Khrouchtchev ont été abandonnés et le système des fermes collectives a retrouvé ses bases."

 sov_stalinist_agriculture_inov_fail:0 "Restauration agricole incomplète"
 sov_stalinist_agriculture_inov_fail_desc:0 "Le recul des réformes agricoles de Khrouchtchev n'a été que partiellement efficace. Le système collectif a été officiellement rétabli, mais des années de mauvaise gestion révisionniste ont laissé des traces dans l'administration agricole et la production reste inférieure aux attentes."
 
 sov_stalinist_agriculture_inov_good:0 "Innovation agricole stalinienne"
 sov_stalinist_agriculture_inov_good_desc:0 "Nous avons décidé d'annuler la plupart des réformes agricoles de Khrouchtchev, mais nous avons également décidé d'expérimenter des versions limitées de ses campagnes passées. Et nos efforts en valaient la peine, les villes et les campagnes disposent d'une bonne quantité de nourriture et nous sommes en bonne position pour poursuivre la modernisation de l'agriculture. Même s'il s'agit d'une petite victoire, le peuple chérit notre leadership pour cette victoire."
 
 sov_revisionism_defeated:0 "Bastion anti-révisionniste"
 sov_revisionism_defeated_desc:0 "La clique khrouchtchévienne a été démasquée et vaincue. Le Parti avance, le nom de Staline est justifié. Le Vanguard Party se lève à nouveau"

 sov_dekhrushchevization:0 "Dé-Khrouchtchévisation"
 sov_dekhrushchevization_desc:0 "Les déviations révisionnistes introduites sous la clique de Khrouchtchev sont systématiquement purgées des fondements idéologiques du Parti et de l'appareil d'État."
 
 SOV_CornManOutAPG.1.t:0 "[GetNewspaperHeader]Khrouchtchev évincé !"
 SOV_CornManOutAPG.1.desc:0 "Au grand choc de la communauté internationale et du mouvement communiste, des informations en provenance de Moscou indiquent que Nikita Sergueïevitch Khrouchtchev, secrétaire général du PCUS, tristement célèbre pour ses attaques contre Staline et son culte de la personnalité, a été évincé après un vote au Présidium du Comité central du PCUS. Khrouchtchev a été accusé de violation des principes de direction collective, d'opportunisme, d'arbitraire administratif et critiqué pour sa gestion de l'histoire du parti et de la politique étrangère, en particulier sa gestion de la crise hongroise. \n\nA sa place, une troïka a été constituée par V. Molotov, L. Kaganovitch et N. Boulganine, ce dernier faisant office de premier secrétaire jusqu'à ce qu'un remplaçant puisse être choisi par le comité central. La destitution de Khrouchtchev a notamment reçu le soutien prudent du dirigeant albanais Enver Hoxha et du dirigeant chinois Mao Zedong, qui avaient auparavant rompu avec le gouvernement soviétique en raison de ce qu'ils ont décrit comme du révisionnisme et du chauvinisme des grandes puissances."
 SOV_CornManOutAPG.1.a:0 "Voilà pour le « Corn-Man »"
 
 SOV_AlbaniaVisit.t:0 "[GetNewspaperHeader]Tirana et Moscou renouent leurs liens fraternels"
 SOV_AlbaniaVisit.desc:0 "Des rapports en provenance d'Albanie confirment un changement radical dans le camp socialiste suite à une rencontre historique à Tirana entre une délégation soviétique dirigée par Viatcheslav Molotov et le dirigeant albanais Enver Hoxha. Cette visite marque la fin officielle du gel diplomatique et idéologique amer qui isole les deux nations depuis le 20e Congrès. Dans une rupture inattendue avec le protocole, Hoxha a personnellement accueilli Molotov sur les marches du Palais des Brigades. Les pourparlers ultérieurs ont abandonné les évasions tendues de l'époque de Khrouchtchev en tant que secrétaire général, Hoxha offrant un compte rendu sans détour de la résistance inébranlable de l'Albanie contre la « pression révisionniste » de Belgrade et de Moscou. Molotov aurait exprimé sa profonde admiration pour la résilience idéologique de la petite nation des Balkans, déclarant que les architectes des déviations passées avaient finalement répondu au Parti."
SOV_AlbaniaVisit.a:0 "Les mouvements communistes internationaux sont unis"
 
 Bulg.1.t:0 "Nikolaï Alexandrovitch Boulganine."
 Bulg.1.desc:0 "Conformément au vote du Présidium qui a évincé Khrouchtchev, le camarade Nikolaï Alexandrovitch Boulganine a été nommé pour le moment premier secrétaire du PCUS, tandis que Khrouchtchev lui-même a été rétrogradé au rang de ministre de l'Agriculture car, selon le camarade L. Kaganovitch, il était un « expert en kukuruza ». Inutile de dire que le désastre avait été évité et que Boulganine était désormais à la tête de l'Union en tant que président du Conseil des ministres et premier secrétaire du Parti communiste. \nBoulganine s'est laissé réfléchir un moment. Il n'était pas du tout un protégé politique, et il ne voulait pas non plus l'être. Cela ne signifie pas du tout que Boulganine était analphabète en ce qui concerne la théorie marxiste-léniniste, mais il aurait de loin préféré rester dans un poste de direction, tout comme il l'avait été à l'époque de Staline, président du gouvernement de la ville de Moscou. Cependant, il occupait désormais les deux postes les plus importants de toute l'Union soviétique et il se demandait s'il était vraiment l'homme idéal pour ce poste. Mais Boulganine a refusé de tomber dans un sentiment d'incompétence, car après tout, le parti avait besoin de lui, le peuple avait besoin de lui. \n\nLes réformes de Khrouchtchev avaient dévasté la construction socialiste, cela était évident. Il fallait que quelqu'un remette le pays d'Octobre sur la bonne voie et, de tous les membres du Politburo, Boulganine était le moins susceptible de s'y opposer puisque ses camarades vieux bolcheviks avaient été, dans une certaine mesure, discrédités par le discours secret. Le Parti avait parlé, et le Parti n'avait jamais eu tort, et c'était donc maintenant le devoir de Boulganine de nettoyer tout le gâchis causé par près d'une demi-décennie de révisionnisme et d'arbitraire administratif. Mais d'abord, le Premier Secrétaire nouvellement nommé devait s'occuper correctement de l'homme responsable de tout cela..."
 Bulg.1.a:0 "Bonne chance, Nikolaï Alexandrovitch ! Il y a beaucoup à faire..."

 Bulg.101.t:0 "Moscou, bâtiment Loubianka, 1h30"
 Bulg.101.desc:0 "Alexander Shelepin s'est retrouvé à regarder une enveloppe estampillée « D'une importance particulière » alors que ses yeux s'ouvraient. Le courrier était arrivé peu après 1 heure du matin et bien que Shelepin ait initialement rejeté la lettre en raison de son état de sonorité, après avoir réalisé qu'elle venait du Kremlin et lu son contenu, il aurait vraiment souhaité ne pas l'avoir fait. Là, écrite de la main indiscutable du camarade Molotov, se trouvait une courte directive qui disait simplement : « Le camarade Ivan Serov doit être démis de ses fonctions et placé immédiatement en état d'arrestation. » avec la signature du premier secrétaire Boulganine tout en bas, et cela suffisait à faire disparaître toute sensation de fatigue de son corps. \nL'esprit de Shelepin commença à s'emballer tandis que ses yeux fixaient les mots avec incrédulité. Il avait débuté comme premier secrétaire du Komsomol sous le camarade Staline en tant qu'homme ambitieux et instruit et, à sa grande surprise, il avait conservé son poste après la déstalinisation, bien qu'il fût l'un des favoris du défunt dirigeant. Peu de temps après, le coup d'État a eu lieu et, une fois de plus, Shelepin est non seulement restée intacte, mais a commencé à être activement promue. En fait, il avait été nommé premier vice-président du KGB quelques semaines seulement avant cette nuit fatidique. Une décision dont il comprenait désormais le raisonnement. \n\nEn quelques minutes, Shelepin commença à faire les préparatifs. Seule une poignée d'officiers pouvait se voir confier une telle tâche. Trop d'hommes et la nouvelle pourrait se répandre. S'il y en a trop peu, Serov pourrait résister. Shelepin avait lu et entendu parler de l'arrestation d'Ejov, comment il avait été légitimement traduit en justice par ses propres subordonnés pour ses abus dégoûtants et rapidement liquidé, et il ne pouvait s'empêcher d'être quelque peu ravi à la perspective de pouvoir expérimenter ce que ses prédécesseurs avaient vécu. Une fois son équipe rassemblée, les hommes se sont dirigés vers le bureau de Serov, qui ignorait complètement ce qui l'attendait. Les couloirs du bâtiment Loubianka étaient inhabituellement calmes à l'approche du bureau du président. C'est Shelepin qui a frappé à sa porte et, lorsque Serov l'a ouverte, il lui a présenté le mandat d'arrêt au visage. À la grande surprise de Shelepin, il étudia simplement le document pendant un moment avant d'acquiescer lentement. \"Je suppose que c'était inévitable\". Ivan Serov a ensuite été menotté, ses assistants licenciés, puis conduits dans le couloir, sans plus jamais entendre parler."
 Bulg.101.a:0 "D'abord Yagoda, puis Yezhov, puis Beria, maintenant Serov."

 Bulg.102.t:0 "La ballade de Mikhaïl Souslov"
 Bulg.102.desc:0 "Les couloirs du bâtiment du Comité central étaient devenus inhabituellement calmes lorsque Malenkov et Molotov arrivèrent devant le bureau de Souslov. Il était déjà tard dans la nuit et pourtant les deux bolsehviks savaient que Souslov travaillait probablement encore. Mikhaïl Souslov était l'homme qui avait succédé à Jdanov en 1948 au poste de secrétaire principal de l'idéologie après le décès tragique de ce dernier et était l'un des hommes les plus influents de l'Union. Molotov prit un moment pour réfléchir. D'après ce qu'il savait, Suslov était un homme qui valorisait avant tout la stabilité et l'idéologie, un orthodoxe en ce sens. Et pourtant, si tel était le cas, pourquoi n'est-il pas resté silencieux lors de ce 20e Congrès calomnieux ? Pourquoi a-t-il activement dénoncé le soi-disant « culte de la personnalité » ? Molotov est rapidement arrivé à la conclusion que, loin de son prédécesseur Andrei Zhdanov, Souslov était devenu complaisant, avait perdu son esprit révolutionnaire et aurait continué à être un serviteur réticent de la clique khrouchtchévienne si celle-ci n'avait pas été évincée. Et pourtant, Molotov savait, grâce à toutes ses années de travail avec le secrétaire d'État, qu'après les désastres en Hongrie et en Géorgie, les relations ternies avec l'Albanie et la Chine et tout le concept de « détente » avec les impérialistes introduit par les révisionnistes, Suslov n'était probablement pas très satisfait de Khrouchtchev et, par conséquent, pouvait certainement être convaincu d'oeuvrer contre tout contre-coup d'État potentiel que Khrouchtchev pourrait planifier. Les deux hommes ont ensuite frappé à la porte du bureau de Suslov et ont été autorisés à entrer.\n\n\"Camarade Molotov, camarade Malenkov, comment puis-je vous aider ce soir, mes chers amis ?\", a déclaré Suslov en ajustant ses lunettes et en essuyant le sommeil de ses yeux. Malenkov et Molotov ont ensuite récapitulé et expliqué à Souslov la nature de ce qui avait été fait pendant les années de pouvoir de Khrouchtchev et comment sa politique avait sapé la construction du socialisme et aurait facilement pu conduire à la capitulation face à l'Occident. Il y eut un bref silence après l'explication. Suslov se pencha légèrement en arrière sur sa chaise, ses doigts entrelacés alors qu'il étudiait les deux hommes debout devant son bureau. Le secrétaire principal écoutait sans interruption, son expression toujours aussi illisible. \"Je vois,\" répondit finalement doucement Suslov. « Et qu'attendez-vous exactement de moi, camarades ? » Molotov parla le premier. « Vous comprenez mieux que quiconque l'appareil du Parti, Mikhaïl Andreïevitch. Khrouchtchev a peut-être été écarté du pouvoir, mais des hommes comme lui n'acceptent pas simplement la défaite. Nous pensons qu'il tente déjà de rallier ses partisans au sein du Comité central et des organisations régionales du Parti. » Malenkov acquiesça. « S'il parvient à rassembler suffisamment d'alliés, il pourrait très bien tenter un contre-coup d'État. La situation reste fragile et nous ne pouvons pas permettre que le factionnalisme mette une fois de plus en danger l'unité du Parti.'' Suslov resta silencieux un moment, ajustant ses lunettes tout en réfléchissant à leurs paroles. \"Et vous êtes donc venus pour garantir que les organes idéologiques du Parti ne tombent pas entre ses mains, n'est-ce pas ?\", a-t-il dit calmement. Molotov s'autorisa le moindre sourire. ''Précisément.'' Une autre longue pause suivit. Finalement, Suslov se leva de sa chaise et se dirigea lentement vers la fenêtre, regardant la cour faiblement éclairée du bâtiment du Comité central. ''Eh bien, l'unité du Parti doit demeurer avant tout. Si le camarade Khrouchtchev a vraiment l'intention de le saper, alors il doit être arrêté. » Suslov se tourna vers les deux hommes alors que Malenkov jeta un coup d'oeil à Molotov avant de lui faire un léger sourire et d'acquiescer."
 Bulg.102.a:0 "\"Très bien camarade Suslov, je crois que cette affaire est alors réglée...\""

 Bulg.103.t:0 "Le Maréchal de la Victoire part en tournée"
 Bulg.103.desc:0 "Lazar Kaganovitch est passé devant les officiers qui se précipitaient d'un endroit à l'autre et se déplaçaient entre les briefings et les rapports alors qu'il se dirigeait vers le bureau du ministre de la Défense. Le vieux bolchevik, bien qu'il atteigne désormais la soixantaine, avait toujours une présence imposante dans le bâtiment et certains des nouveaux cadets les plus instruits ont profité de l'occasion pour saluer et échanger quelques mots avec Iron Lazar lui-même. Après tout, comme l'ont souligné les nouveaux dirigeants, il était l'homme responsable de certaines des plus grandes réalisations de l'industrialisation soviétique, comme le métro de Moscou, et un ami proche du regretté camarade Staline. Kaganovitch, de son côté, bien que réceptif aux gestes de ses jeunes admirateurs, s'efforçait de se rendre au plus vite au bureau du maréchal. Il se souvient de la décision prise lors de la dernière réunion du Présidium : « Éloignez Joukov de Moscou pour le moment ». Kaganovitch se demandait comment un homme comme Gueorgui Joukov avait pu devenir un inconvénient pour sa propre patrie. Il ne pouvait s'empêcher d'éprouver une grande admiration pour le Maréchal, après tout, le génie militaire de Joukov avait sauvé le pays d'Octobre des assauts fascistes et ce sont ses armées qui prirent Berlin, l'antre de la bête. Et pourtant, l'orgueil et l'ego avaient pris le dessus sur le Grand Maréchal, et il n'a fallu que quelques promesses à Khrouchtchev pour l'amener à soutenir le « discours secret » calomnieux dont Joukov savait sûrement qu'il était entièrement constitué de mensonges. Kaganovitch s'autorisa à soupirer avant de frapper à la porte du bureau qui se trouvait maintenant devant lui et de faire un pas à l'intérieur.\n\n\"Camarade Kaganovitch !\", a déclaré Joukov en se levant de sa chaise, parlant avec la même grandeur et la même confiance dans sa voix que toujours. « Je ne m'attendais pas à des visiteurs aujourd'hui. Qu'est-ce qui vous amène ici ?'' Lazar ôta son manteau et s'assit en face du maréchal. Après avoir discuté un peu et avoir appris où se trouvaient les uns et les autres, Kaganovitch a ensuite expliqué au maréchal la raison de sa visite et la demande du Parti. « Le camarade Kliment Vorochilov était initialement chargé de mener une tournée d'inspection des forces armées de nos États socialistes frères. Malheureusement, il est récemment tombé malade et n'est pas en mesure d'accomplir sa mission.'' Joukov s'appuya légèrement en arrière sur sa chaise. ''Et donc vous attendez de moi que je me charge de cette tâche ?'' Demanda le Maréchal. \"Précisément\", a répondu Kaganovitch. Après avoir discuté de la logistique, de la nature de l'inspection et de la durée prévue, Joukov étudia le vétéran du Parti qui se tenait devant lui avant d'acquiescer. \"\" Très bien. Si le Parti l'exige, je procéderai à l'inspection. \" Kaganovitch s'autorisa un petit sourire satisfait avant de dire au revoir au maréchal et de sortir. Joukov se leva et regarda par la fenêtre de son bureau la rivière Moskova. Les souvenirs de son dernier séjour à Berlin et dans les autres villes d'Europe de l'Est envahirent rapidement son esprit et Joukov se permit un léger sourire narquois. Peut-être que leurs nouveaux frères socialistes avaient besoin de son expertise et de son aide pour gérer leur armée, après tout, il était l'homme qui avait arraché le coeur de la bête fasciste, et il n'y avait pas de meilleur homme pour montrer aux armées fraternelles comment se défendre contre l'agression impérialiste que celui qui avait vaincu le plus ignoble d'entre elles. Le Maréchal s'est ensuite rassis à son bureau et s'est rapidement remis au travail."
 Bulg.103.a:0 "\"Mère Russie a encore beaucoup à apprendre à ses nouvelles soeurs...\""

 Bulg.104.t:0 "Le Comité du Parti de la ville de Moscou"
 Bulg.104.desc:0 "Contrairement à nombre de ses collègues du Présidium, Dmitri Trofimovitch Chepilov n'a jamais été une figure particulièrement imposante. Grand et mince, avec l'attitude posée d'un professeur d'université plutôt que d'un révolutionnaire endurci, l'ancien rédacteur en chef de la Pravda avait bâti sa réputation non pas par des discours enflammés ou des manoeuvres politiques, mais par une analyse minutieuse et une discipline idéologique. Beaucoup au sein de l'appareil du Parti le considéraient encore comme un intellectuel d'abord et ensuite comme un homme politique, et pourtant il se trouvait là, au milieu du siège du Comité du Parti de la ville de Moscou, marchant vers le bureau du Premier secrétaire. Shepilov ne put s'empêcher de ricaner à la pensée du Premier secrétaire. Ekaterina Furtseva. Il se souvenait encore de la façon dont elle avait couru vers les téléphones juste après l'élimination du traître Khrouchtchev et, sans le blocus total des communications, elle aurait peut-être voué toute leur opération à l'échec. \"Rien de plus que le chien de poche personnel de Khrouchtchev...\" Pensa Shepilov. Et pourtant, ce n'était pas pour cela que le Présidium avait décidé de la destituer, pas du tout, c'était pour quelque chose peut-être encore plus scandaleux. Furtseva avait été le fer de lance d'une campagne de diffamation contre le célèbre acteur soviétique Boris Babochkin en raison de son portrait d'un bureaucrate corrompu dans le film Shadows de 1952, et avait gravement abusé de son influence pour mettre l'acteur pratiquement au chômage. Pour cette raison, et à cause des critiques récentes du camarade Souslov, elle devait être licenciée puis arrêtée, aussi simple que cela, tout ce que Chepilov voulait et avait besoin de savoir. Il ne pouvait pas non plus s'empêcher de penser que le portrait d'un bureaucrate corrompu aurait pu toucher un peu trop près le Premier Secrétaire, car pour lui et pour ses vieux compagnons bolcheviques, Furtseva n'était rien de plus qu'un carriériste et un opportuniste. \n\nLorsque la porte du bureau s'est ouverte, Ekaterina Furtseva l'a accueilli avec une visible curiosité. « Camarade Shepilov », dit-elle en lui faisant signe de s'asseoir. \"A quoi dois-je le plaisir de cette visite ?\" Chepilov lui a ensuite expliqué qu'en raison d'une décision unanime du Présidium, elle devait être démis de ses fonctions en raison de sa grave faute et qu'il souhaitait des éclaircissements de la part du parti sur son raisonnement et sa version de l'histoire. L'expression de Furtseva se durcit presque immédiatement. ''Clarifier la situation ?'' répondit-elle sèchement. « J'ai servi loyalement le Parti pendant des années. Si certains camarades souhaitent maintenant fabriquer des accusations pour me destituer, ils devraient au moins avoir le courage de le dire ouvertement. » Furtseva a commencé à s'échauffer et ce qui avait commencé comme un simple licenciement s'est rapidement transformé en un affrontement total, pour la plupart unilatéral. Un scandale pas très différent de ceux provoqués par ses week-ends à l'étranger pour rencontrer son amant en Yougoslavie. Shepilov soupira, se préparant à faire une dernière tentative de raison lorsque la porte du bureau s'ouvrit soudainement et que plusieurs agents du KGB entrèrent. Pendant un bref instant, ni Shepilov ni Furtseva ne parlèrent. Puis l'un des officiers s'est avancé et s'est adressé directement au Premier secrétaire. \"Camarade Ekaterina Furtseva, par ordre du Présidium du Comité central, vous êtes démis de vos fonctions et placée en état d'arrestation dans l'attente de l'enquête.\" S'ensuit une scène à la limite de l'hystérie. Furtseva a paniqué et a tenté de s'enfuir en criant tandis que les policiers la saisissaient par les bras et la traînaient vers la porte. Shepilov resta assis, le coeur battant à cause de ce qui venait de se passer devant lui, regardant silencieusement le Premier secrétaire de Moscou être emporté, avant de pousser un soupir de soulagement. "
 Bulg.104.a:0 "Au moins, c'était enfin fait."

 Bulg.2.t:0 "Le sort de Khrouchtchev"
 Bulg.2.desc:0 "\"... À ce titre, le tribunal déclare le camarade Khrouchtchev coupable d'activité antisoviétique, de atteinte à l'unité du Parti, de mépris de la légalité révolutionnaire et de soumission aux puissances étrangères et, conformément aux lois de l'URSS, le condamne à être fusillé.\" Et pendant un moment, la salle d'audience est restée silencieuse. Le maréchal Konstantin Rokossovsky, en tant que juge par intérim, avait scellé le sort de Khrouchtchev lors d'une session extraordinaire de la Cour suprême de l'URSS, sans avocat de la défense, sans droit de faire appel et totalement inconnu de quiconque en dehors du Comité central et du KGB. Après avoir été rétrogradé au rang de ministre de l'Agriculture, Khrouchtchev a fait l'objet d'une enquête rapide et a été arrêté sur ordre du Comité central pour s'assurer qu'il ne pourrait pas tenter une autre prise de pouvoir à l'avenir, semblable à ce qui avait été fait à Lavrenti Beria près de 4 ans auparavant. \n\nEt puis Khrouchtchev s'est levé. Il n'arrivait pas à y croire, tout ce temps à comploter, à réformer, à remplir les cadres de loyalistes, à tromper Malenkov, à déstaliniser, toute cette planification méticuleuse, tout cela pour quoi faire ? Être déjoué et maintenant condamné à mort par quelques vieillards qui auraient dû être mis de côté et oubliés il y a des années ? Non, ce n'est pas possible. Il frappa du poing sur le bureau et se mit à crier, à hurler, à pleurer, pointant du doigt tous ceux qui se trouvaient à sa vue. '' Vous êtes des ordures, chacun d'entre vous ! Même après avoir dénoncé le despote Staline pour ses crimes, je vous ai tous gardés au sein du Comité central, aucun d'entre vous n'a été jugé pour vos innombrables répressions, pas un seul nom n'a été évoqué ! Tous vos privilèges sont restés intacts ! Et c'est comme ça que tu me rembourses ? J'aurais dû vous faire fusiller tous avec Beria quand j'en avais l'occasion ! » En revanche, Rokossovsky et les membres du Comité central présents au procès ne semblaient pas trop inquiets. \n\nDevant Rokossovsky se tenait l'homme qui avait manqué de respect, calomnié et bâtard à son Grand Commandant, l'avait fait passer pour rien de meilleur qu'Hitler lui-même et avait ainsi détruit l'image du socialisme dans le monde entier. Les ruptures avec la Chine et l'Albanie, tout le fiasco hongrois et même la montée des révisionnistes en Pologne qui l'ont poussé à abandonner son pays, tout cela était de sa faute, et au fond il aimait le fait que c'était son verdict qui allait envoyer Khrouchtchev aux poubelles de l'histoire. \"Le tribunal en a assez entendu, gardes, expulsez déjà cet homme\", a déclaré Rokossovsky. Khrouchtchev le regardait d'un air bouillonnant et il semblait qu'il était sur le point de se bagarrer avec le maréchal lui-même avant que deux gardes du MVD ne l'attrapent rapidement par les bras et ne le traînent hors de la salle d'audience. Khrouchtchev a ensuite été poussé dans un fourgon blindé du KGB et discrètement emmené à la prison de Lefortovo, où il a immédiatement été exécuté par un peloton d'exécution. "
 Bulg.2.a:0 "Et c'est ainsi que se trouve le dernier clou dans le cercueil du révisionnisme..."

 Bulg.3.t:0 "Viatcheslav Mikhaïlovitch Molotov"
 Bulg.3.desc:0 "\"Par décision du Présidium du Comité central et du Soviet suprême de l'Union soviétique, le camarade Viatcheslav M. Molotov a été nommé président du Conseil des ministres...\" Molotov regardait le journal Pravda devant lui tout en buvant une gorgée de son café du matin. Son propre visage, affiché en grand et clair sur la première page, le regardait, un portrait pour lequel il se souvenait avoir posé peut-être la veille. Pourtant, ce n'était pas la première fois qu'il voyait ce même titre associé à son visage, pas du tout, même s'il était beaucoup plus jeune à l'époque. Il avait déjà été premier ministre auparavant, mais c'était il y a longtemps. Avant la guerre, avant tous les troubles, et à l'époque, Staline était bel et bien vivant... Molotov soupira. Cela faisait longtemps qu'ils n'avaient pas réussi à évincer Khrouchtchev du pouvoir et à lui mettre une balle dans la tête, et pourtant ce n'est que maintenant que Molotov commence à réfléchir sur les deux dernières années. \n\nLa mort de Staline, le coup d'État, le discours au 20e congrès... Il se souvenait comment ils étaient tous assis en silence tandis que calomnies après calomnies s'amassaient sur la tombe de Staline, personne ne parlait, personne ne s'y attendait. Et pourtant, rétrospectivement, comment n'avaient-ils pas prévu cela ? Toutes les réformes, la normalisation avec l'Occident, l'écrasement de toutes les propositions précédentes de Staline et de Jdanov, la seule façon pour les révisionnistes d'aller plus loin était certainement d'abord d'attaquer Staline. Comment avaient-ils pu être si aveugles ? Molotov resserra légèrement sa prise sur le journal avant de le poser sur la table. Et pourtant, même s'ils auraient dû agir plus tôt, le travail était fait, l'Union était sauvée, et tous les conspirateurs seraient extirpés un à un, il s'en assurerait. Ils avaient été temporairement aveuglés, mais ce n'est plus le cas, et plus jamais les forces du capital et de l'opportunisme n'auront la moindre chance de saper l'avancée de la classe ouvrière. Molotov pensait, peut-être avec un peu d'optimisme naïf, que le meilleur pour l'Union était encore à venir et qu'il serait peut-être en vie pour voir les travailleurs du monde entier prendre d'assaut le ciel lui-même. Et en tant que tel, il poursuivrait la voie de Lénine et de Staline, la voie qui les avait autrefois guidés à travers des épreuves bien plus grandes que celles-ci. Molotov a détourné son attention vers une photo encadrée sur son bureau, celle de lui et Staline dans les années 30 à la datcha de Kuntsevo. Staline avait été son supérieur, son mentor et, plus important encore, son meilleur ami, et il ne permettrait pas que son travail et son nom soient ternis. Ni maintenant, ni jamais. Molotov s'autorisa à verser une larme singulière face aux souvenirs qui commençaient à envahir son esprit. Puis, sans ajouter un mot, il se tourna et se dirigea vers la porte."
 Bulg.3.a:0 "''Rassure-toi mon cher ami, tes sacrifices ne seront pas vains...''"

 Bulg.31.t:0 "Lazar Moiseevich Kaganovitch"
 Bulg.31.desc:0 "Des piles de rapports étaient éparpillées sur le bureau tandis que Lazar Kaganovitch examinait attentivement les derniers chiffres sur la production industrielle et le développement des infrastructures. Les dernières années n'ont pas été favorables à l'économie soviétique. Des projets avaient été abandonnés, les priorités s'étaient déplacées vers des expérimentations imprudentes, dont la plupart aboutissaient à des résultats médiocres ou à un échec pur et simple, tout cela au nom de la « modernisation » et de « l'efficacité ». Kaganovitch fronça légèrement les sourcils en tournant la page. Trop de choses avaient été perturbées, décentralisées, surtout avec le chaos absolu qu'était le Sovnarkhoze. Kaganovitch les méprisait absolument. \"Ils ne font rien d'autre que promouvoir la petite corruption et amasser davantage de profits pour les bureaucrates\", pensa-t-il. \n\nÀ ce moment-là, le bruit d'un coup à la porte brisa le silence. Un coursier entra brièvement, déposant un document scellé sur le bureau avant de repartir sans un mot. Kaganovitch l'ouvrit sans hésiter. \"Par décision du Présidium du Comité central et du Soviet suprême de l'Union soviétique, le camarade Lazar M. Kaganovitch est nommé vice-président du Conseil des ministres...\" Il lut la ligne une fois, puis mit le journal de côté. Kaganovitch s'était rarement soucié des titres, et cela ne faisait pas exception. Et pourtant, il ne pouvait s'empêcher de sentir une légère vague d'optimisme l'envahir. Peut-être pourrait-il ainsi commencer à dénouer tout le désordre qu'était l'économie khrouchtchévienne. Il avait servi comme deuxième secrétaire sous Staline, et n'avait-il pas obtenu de nombreux succès sous sa direction ? En effet, c'était le cas, et Kaganovitch savait que, même s'il vieillissait, il était encore capable de relever l'Union. La production serait rétablie. La planification serait appliquée. La dictature du prolétariat fonctionnerait comme elle était censée le faire et tous les restes et déviations capitalistes introduits par la clique des « réformateurs » seraient éradiqués par sa propre emprise, car ce n'était pas une erreur qu'ils l'appelaient « Lazar de fer ». Kaganovitch se leva de sa chaise et se dirigea vers la grande carte accrochée au mur, ses yeux scrutant la vaste étendue du pays d'Octobre. Chemins de fer, usines, centres industriels - tous interconnectés, tous dépendants de la discipline révolutionnaire, de la coordination et de la direction adéquate du parti d'avant-garde. Il y avait beaucoup à reconstruire. Et cette fois, ce serait fait correctement."
 Bulg.31.a:0 "Retour au travail, camarades."

 Bulg.4.t:0 "Tbilissi, RSS de Géorgie"
 Bulg.4.desc:0 "Dans les mois qui ont suivi les troubles de 1956, les rues de Tbilissi avaient retrouvé une sorte de normalité prudente. Et pourtant, près de deux ans plus tard, le souvenir des chars prenant d'assaut la capitale de la RSS de Géorgie restait vif dans l'esprit de la population. Ils s'étaient tous rassemblés ce jour-là, en colère, pleins de ressentiment, pour réclamer justice. Comment auraient-ils pu ne pas l'avoir fait ? Étaient-ils censés laisser ces traîtres calomnier non seulement le fidèle élève de Lénine, mais aussi le plus grand fils de Géorgie ? Mais c'était du passé, et les citoyens du Paris de l'Est avaient désormais appris à accepter à contrecoeur le nouveau statu quo. Certaines choses avaient disparu à cette époque, parmi lesquelles un monument qui occupait autrefois une place importante dans la ville. C'est autour de ce même monument qu'ont commencé les premières vagues de protestations étudiantes, où des milliers de personnes se sont rassemblées pour défier la clique du Kremlin. Puis les chars sont arrivés, des centaines ont été emprisonnés, des centaines d'autres massacrés sans pitié et le monument au Grand Commandeur a été enlevé. Maintenant, il était de nouveau là. \n\nLe travail avait été fait rapidement, presque discrètement. Lorsque la plupart des gens ont traversé la place ce matin-là, celle-ci était déjà terminée. Une foule s'est rassemblée plus tôt qu'on aurait pu s'y attendre, se tenant en groupes lâches, parlant à voix basse, bien que moins prudente qu'elle l'avait été autrefois. \"Donc c'est vrai\", dit un homme avec une légère note de satisfaction dans la voix. ''Ils l'ont ramené.'' Son compagnon hocha la tête, les yeux fixés sur la silhouette imposante devant lui. « Ce n'était qu'une question de temps. » À proximité, une femme plus âgée s'arrêta, son regard s'attardant plus longtemps que la plupart des autres. \"Ils l'ont abattu si rapidement\", a-t-elle déclaré. ''Comme si les gens ici allaient oublier.'' Personne n'avait oublié. Un vétéran se tenait près du devant du rassemblement, sa posture se redressant alors qu'il levait les yeux, presque aussi fier qu'il l'avait été dix ans plus tôt. Il y aurait des discours plus tard, des explications imprimées et distribuées, les mots corrects restaurés avec le monument lui-même. Mais pour l'instant, rien de tout cela ne semblait nécessaire. Alors que la foule commençait lentement à se disperser, beaucoup s'attardèrent juste un instant de plus que nécessaire, jetant un dernier coup d'oeil avant de retourner à leurs routines. Et au-dessus d'eux tous, surplombant la ville qui ne s'était jamais vraiment détournée de lui, se tenait une fois de plus l'homme d'acier."
 Bulg.4.a:0 "Joseph Vissarionovitch Staline"

 Bulg.41.t:0 "La Commission de clarification historique concernant J.V. Staline"
 Bulg.41.desc:0 "Après la mort de Joseph Staline et des années de lutte pour le pouvoir, Khrouchtchev finit par créer une commission chargée « d'enquêter » sur les arrestations effectuées à la fin des années 1930 de certains candidats du Comité central élus au 17e Congrès. Cette commission finirait par rédiger le tristement célèbre « Rapport Pospelov », un document utilisé plus tard par Khrouchtchev lors de son tristement célèbre « Discours secret », et un document que la Vieille Garde connaissait très bien. Page après page, des accusations calomnieuses contre Staline, imputant chaque répression qualifiée d'« injuste » à sa seule personnalité et laissant entendre que Staline lui-même a personnellement ordonné la fabrication d'accusations. Souslov et Malenkov n'en étaient bien sûr pas du tout convaincus. Khrouchtchev était sain et sauf en Ukraine, mais Malenkov se souvenait de l'année turbulente de 1938. Le Bloc des Droits et les Trotskistes, les attentats terroristes et, plus tard, comment la conspiration au sein du NKVD avait été déracinée. Le Comité central lui-même enquêtait et reconstituait les conspirations une par une, y compris Staline, comment pouvait-il être accusé d'avoir orchestré tout cela ? Et voilà, la décision était prise. \n\nQuelques jours après la victoire finale sur les Khrouchtchéviens, une commission spéciale avait été réunie sous la direction conjointe de Souslov et Malenkov pour enquêter sur ce rapport. L'accès a été accordé à des documents longtemps gardés secrets : correspondance interne du NKVD, dossiers d'interrogatoire, rapports du Comité central et communications auparavant jugées trop sensibles pour être examinées. Pour la première fois depuis le 20e Congrès, le dossier complet était ouvert. Les travaux ont alors commencé. Page par page, citation par citation, les affirmations du rapport Pospelov ont été examinées par rapport aux documents originaux dont elles étaient censées provenir. Au début, les divergences semblaient mineures - une omission ici, une conclusion trop générale là. Mais plus ils regardaient en profondeur, plus le modèle devenait cohérent. Des extraits dépourvus de contexte important, une interprétation erronée délibérée de certaines phrases, des confessions dans lesquelles des passages entiers ont été omis qui ont ajouté un contexte important et des déclarations faites dans le rapport qui contredisaient carrément leurs prétendus documents de référence. Malenkov a clôturé l'un de ces dossiers avec une expiration silencieuse. ''Y a-t-il une seule 'révélation' sur laquelle ce scélérat n'a pas menti ?'' remarqua-t-il, frustré et fatigué. Souslov n'a pas immédiatement répondu. Ses yeux restaient fixés sur un document devant lui, son expression inchangée alors qu'il ajustait lentement ses lunettes. ''Jetez un oeil à ce Georgy...'' dit-il, avant de faire un geste vers les dossiers éparpillés sur la table. « La moitié de ces citations ne mènent nulle part. Des références sont faites à des documents qui n'existent tout simplement pas dans les archives. » Les yeux de Malenkov s'écarquillèrent alors qu'il feuilletait quelques pages. Souslov avait raison. Et ils n'étaient pas absents par hasard. Absent totalement." 
 Bulg.41.a:0 "Les dossiers avaient clairement été falsifiés..."

 Bulg.42.t:0 "La Commission de clarification historique concernant J.V. Staline : Partie 2"
 Bulg.42.desc:0 "Pendant un instant, aucun des deux hommes ne parla. \n\nLe silence s'étendit entre eux, rompu seulement par le bruissement du papier lorsque Malenkov déposa le dossier entre ses mains. Suslov ôta entièrement ses lunettes, pressant deux doigts contre l'arête de son nez. \"Cela va impliquer beaucoup de gens...\" Dit finalement Suslov. « Nous ne pouvons pas nous attendre à ce que tout cela passe rapidement. Il ne s'agit même plus de Khrouchtchev, il est parti depuis longtemps, et maintenant...'' Il fit une pause, réfléchissant soigneusement à ses prochains mots. ''Maintenant, nous allons devoir arrêter pas mal de personnes à cause de ce gâchis.'' Malenkov hocha lentement la tête, même si sa mâchoire restait serrée. ''Je propose que nous leur donnions ceci. Un rapport complet au Présidium. Pas des accusations, mais des documents. Laissez-les voir ce que nous avons vu. Et quoi qu'il arrive après, nous l'aborderons le moment venu.'' Suslov se tourna vers Malenkov, remit ses lunettes et hocha simplement la tête. \n\nIl a fallu encore une semaine pour se préparer. Les conclusions de la commission ont été compilées, croisées, scellées dans un seul dossier : les citations fabriquées, les lacunes des archives, les témoignages attribués à des hommes déjà morts aux dates qui lui étaient assignées. Suslov a insisté sur la retenue dans le langage - pas d'éditorialisme, pas de rhétorique. Laissez les divergences parler d'elles-mêmes. Malenkov s'est montré moins patient, mais il a différé. Même si la vieille garde était désormais aux commandes, ce document allait encore devoir résister à l'examen minutieux d'hommes qui avaient toutes les raisons d'en douter, ou d'en avoir peur. Quand ce fut terminé, Suslov posa le dernier exemplaire sur la table entre eux et regarda Malenkov. Malenkov resta longtemps silencieux. Puis il attrapa le téléphone et demanda à être mis en communication avec le bureau de Boulganine." 
 Bulg.42.a:0 "Encore une fin à résoudre..."
 
 Bulg.5.t:0 "La question de la campagne"
 Bulg.5.desc:0 "Benediktov avait préparé lui-même les chiffres, ce qui révélait à Molotov à quel point le ministre de l'Agriculture prenait la séance au sérieux. Il n'a pas rédigé d'éditorial, ce qui était correct étant donné la salle, les dégâts étaient réels mais récupérables, a-t-il déclaré. L'infrastructure collective n'a pas été démantelée, mais simplement déformée. Des quotas d'achat découplés de la planification centrale, des incitations matérielles introduites au niveau des kolkhozes, l'érosion silencieuse du système MTS déguisée en modernisation. Un retour complet aux méthodes centralisées était réalisable en deux saisons de croissance, à condition que les difficultés de transition puissent être absorbées.\n\nMalenkov fut le premier à prendre la parole après lui et ne perdit pas de temps en préambule. ''Les mécanismes du marché disparaissent complètement. Le système MTS revient. Retours d'approvisionnement centralisés. Ce ne sont pas des points de discussion. » Il posa son stylo. \"Le point à débattre est de savoir si nous restaurons le système exactement tel qu'il était, ou si nous le restaurons et l'améliorons comme nous l'avions dit. Il y a eu des progrès techniques depuis la guerre, la mécanisation au niveau des brigades, les méthodes de rotation des sols, qui ne sont pas idéologiquement compromises simplement parce que les gens de Khrouchtchev en étaient conscients.\n\nBenediktov hocha prudemment la tête. \"À condition qu'ils soient introduits par les voies de planification appropriées et qu'ils ne compromettent pas le principe collectif, la distinction est valable.\"\n\nTout le monde dans la salle n'était pas d'accord, et le débat qui a suivi l'a clairement montré. Selon certains, un retour en arrière complet et sans réserve était la seule position compatible avec une rupture nette avec la ligne révisionniste. Tout maintien sélectif des méthodes associées à la période Khrouchtchev, aussi techniquement défendable soit-il, envoyait un mauvais signal aux administrateurs de fermes collectives qui avaient passé une décennie à apprendre à penser dans les mauvaises catégories.\n\nMalenkov écouta cela avec une patience visible et déclara, une fois le cours terminé, qu'il y avait une différence entre les méthodes de Khrouchtchev et celles que Khrouchtchev avait par hasard utilisées.\n\nMolotov, qui n'avait rien dit pendant près d'une heure, clôtura la séance avec la brièveté que la salle attendait de lui. ''Le système des fermes collectives sera entièrement restauré. C'est réglé.'' Il regarda autour de la table. « Ce qui est devant le Présidium, c'est de savoir si nous restaurons ce qui existait, ou si nous le restaurons et construisons quelque chose de plus fort par-dessus. Les deux sont défendables. Les deux ont des coûts.\n\nIl rassembla ses papiers et se leva.\n\n« Nous aurons une réponse la semaine prochaine.»"
 Bulg.5.a:0 "Une restauration complète. Aucune exception"
 Bulg.5.b:0 "Il pourrait y avoir de la place pour l'innovation..."
 
 Bulg.51.t:0 "Le système agricole collectif restauré"
 Bulg.51.desc:0 "Trois ans se sont écoulés depuis le décret rétablissant les méthodes agricoles léninistes-staliniennes. Le réseau MTS a été rétabli, les achats centralisés fonctionnent et la production des fermes collectives revient aux niveaux attendus."
 Bulg.51.a:0 "La bonne ligne porte ses fruits."

 Bulg.52.t:0 "L'innovation agricole s'avère couronnée de succès"
 Bulg.52.desc:0 "Trois années se sont écoulées depuis le décret combinant la restauration des méthodes agricoles léninistes-staliniennes avec certains développements techniques modernes. L'expérience s'est avérée fructueuse. Le résultat a dépassé les attentes et le principe collectif reste pleinement intact."
 Bulg.52.a:0 "Une base plus solide qu'avant."

 Bulg.53.t:0 "L'innovation agricole échoue"
 Bulg.53.desc:0 "Trois années se sont écoulées depuis le décret combinant la restauration des méthodes agricoles léninistes-staliniennes avec certains développements techniques modernes. Les résultats ont été décevants. L'introduction de méthodes expérimentales a créé une confusion administrative et les résultats n'ont pas atteint les objectifs projetés."
 Bulg.53.a:0 "Nous corrigerons le cap."

 Bulg.6.t:0 "Nettoyer la maison"
 Bulg.6.desc:0 "Cela faisait maintenant trois semaines que les rapports arrivaient, tous plus épais les uns que les autres. Molotov avait pris l'habitude de les lire tôt le matin, avant que les affaires du Conseil des ministres n'occupent le reste de sa journée, non pas parce que l'heure lui convenait, mais parce que certains documents exigeaient d'être lus sans interruption, et ceux-ci en faisaient partie. Shelepin arriva à huit heures et demie précises, un dossier de cuir sous le bras, avec l'expression d'un homme qui avait vite appris que le vieux bolchevik chevronné préférait la brièveté au théâtre. Il était jeune pour ce poste, Molotov l'avait même dit lorsque la nomination avait été proposée pour la première fois, mais il avait évolué dans l'appareil régional avec une rapidité et une précision que les membres plus âgés du Présidium avaient discrètement trouvées impressionnantes, et surtout compte tenu de sa gestion propre de la soi-disant question Serov, il avait prouvé qu'il était apte à ce poste. \n\n\"Leningrad d'abord\", a déclaré Molotov. Shelepin a ouvert le dossier. '' Kozlov a été démis du comité régional. Quatorze de ses hommes du Gorkom sont partis ce matin. » Molotov hocha lentement la tête, et pendant un bref instant, son esprit se tourna ailleurs - vers une autre série de rapports régionaux, un autre matin pas tout à fait différent de celui-ci, vingt ans auparavant, lorsque les réseaux de droite intégrés dans les structures régionales du parti avaient commencé à être correctement pris en compte. Cela avait été une affaire plus compliquée, nécessairement, la conspiration plus large et les méthodes pour l'éradiquer plus brutales que quiconque ne l'aurait souhaité. C'était différent. Contrôlé. Volontaire. Le genre de travail qui laissait les dossiers suffisamment propres pour pouvoir être défendus devant n'importe quel tribunal. « Des chiffres totaux ? » dit Molotov en déposant le dossier. \"Deux cent sept renvois confirmés dans toutes les régions\", a répondu Shelepin. « Soixante et un en attente d'examen. Onze ont été renvoyés pour une enquête plus approfondie par la commission. » La réponse de Shelepin est venue sans hésitation. « Plus profondes que nous le pensions initialement, les nominations se déroulent à plusieurs niveaux dans les régions les plus touchées. Ces régions ont été construites correctement à partir de zéro. » Pendant un instant, aucun d'eux ne parla. Molotov a retourné le dernier dossier entre ses mains, sans le lire, mais simplement en le tenant. "
 Bulg.6.a:0 "Ensuite, nous les reconstruisons correctement, à partir de zéro"

 Bulg.7.t:0 "Le cas de Nikita Sergueïevitch Khrouchtchev"
 Bulg.7.desc:0 "Les journaux de transport en provenance de Kiev étaient ouverts entre Molotov et Kaganovitch, à côté d'une pile d'ordres de réquisition portant la propre signature de Khrouchtchev, datés de l'automne 1938. Molotov tournait la même page depuis plusieurs minutes, la comparant à une circulaire du NKVD du début de l'année, lorsque Kaganovitch rompit finalement le silence. \"Ce salaud travaillait avec Yezhov, c'est sûr\", a déclaré Kaganovitch. « La question est de savoir s'il travaillait avec lui par nécessité, ou si les deux travaillaient ensemble dans une tentative de détruire et de détruire notre dictature du prolétariat ! Je n'aurais jamais dû le soutenir, je savais qu'il était trotskiste, je savais...'' \n\nMolotov posa la page et haussa les sourcils, signalant silencieusement à Kaganovitch qu'il devait baisser le ton, tandis qu'il parcourait les pages devant lui. Il se souvenait très bien de tout cela, des quotas du NKVD pendant les purges et puis... Et puis de la façon dont Khrouchtchev avait voulu les augmenter de 5 000 à 8 500. Tout va dans la première catégorie. Tous seront condamnés à mort. \"Regardez le timing\", a-t-il dit. « La campagne contre le Bloc des droits et les trotskistes était déjà bien avancée lorsque Khrouchtchev est arrivé à Kiev. De vrais conspirateurs, de véritables saboteurs et saboteurs. Mais les chiffres en provenance d'Ukraine dépassent tout ce qui est justifié par l'ampleur réelle du complot découvert là-bas. Soit Khrouchtchev croyait réellement que tous les comités de district de la république avaient été compromis, ce qui est tout simplement absurde, même selon ses normes, soit il trouvait tout cela utile à ses propres fins. Et je suis plus enclin à croire cette dernière solution. » Kaganovitch ne dit rien et feuilleta les documents devant lui avant d'en sélectionner quelques-uns et de les montrer à Molotov. \" Et qu'en est-il d'Ouspensky et de Kvassov ? Des hommes avec lesquels il a travaillé main dans la main dans leur propre petite troïka, mystérieusement purgés, alors que lui-même reste intact !'', a lâché Kaganovitch, visiblement frustré. Aucun d'eux ne se dit rien pendant un moment. Ils ont compris exactement ce qu'ils voulaient dire et se sont donc remis au travail. \n\nC'est alors Kaganovitch qui a finalement orienté la conversation vers le sujet le plus difficile, celui qu'aucun d'eux n'avait encore mis sur papier. \"Et puis il y a mars 53...\" L'expression de Molotov ne changea pas, même si ses mains restaient sur le bureau. ''Continuez.'' Kaganovitch s'éclaircit la gorge. \" Beria et Khrouchtchev ont tous deux été informés quelques heures après l'accident vasculaire cérébral. Le propre récit de Beria le situe à la datcha cette nuit-là. Et pourtant, des soins médicaux appropriés n'ont pas été demandés pendant près de douze heures. Kaganovich laissa la silhouette assise dans les airs entre eux. '' Douze heures, Viatcheslav. Pour notre grand camarade Staline... J'ai lu toutes les justifications proposées à l'époque : que personne ne voulait le déranger, que les gardes pensaient qu'il dormait simplement. Rien de tout cela ne représente douze heures.'' Molotov regardait devant lui d'un air vide, son esprit commençant à s'emballer à l'idée que peut-être son meilleur ami et mentor avait été laissé mourir sans cérémonie. Et il n'était pas là pour faire quoi que ce soit. Il a ensuite finalement pris la parole. \"Vous suggérez une délibération\", a déclaré Molotov. \"Je suggère qu'un retard d'une telle durée ne se produit pas par hasard parmi des hommes qui comprenaient exactement qui gisait sur ce sol.\" La voix de Kaganovitch était devenue basse. Molotov ne dit rien pendant un long moment, le regard fixé sur les ordres de réquisition encore éparpillés sur le bureau. Puis, finalement, il tira vers lui une nouvelle feuille de papier et commença à écrire avec précaution." 
 Bulg.7.a:0 "\"C'est alors que commencera la dernière section de notre rapport.\""

 Bulg_trips.1.t:0 "Tirana, [GetDateText]"
 Bulg_trips.1.desc:0 "La capitale albanaise reçut chaleureusement la délégation soviétique, sans les excès d'une visite d'État organisée sous obligation et sans l'anxiété qui avait caractérisé chaque échange soviéto-albanais depuis le 20e Congrès. Hoxha les accueillit lui-même sur les marches du Palais des Brigades et embrassa Molotov avant que les fonctionnaires n'aient eu le temps de s'arranger convenablement. C'était un moment imprévu. Les deux hommes le savaient. La séance formelle a duré deux heures. Hoxha parlait sans les évasions prudentes qui avaient défini les communications albanaises pendant les années Khrouchtchev. A sa place, il y avait quelque chose que Molotov n'avait pas entendu de la part d'un leader allié depuis quelques années : un exposé clair de ce que l'Albanie avait préservé au cours de longues années de pression révisionniste et de ce que sa défaite signifiait pour le mouvement prolétarien international dans son ensemble. \n\n \"Les révisionnistes ont compris que si Moscou tombait dans leur ligne, le reste suivrait avec le temps\", a déclaré Hoxha. ''Ce qu'ils n'ont pas compris, c'est que certains ne suivraient pas de toute façon.'' ''Et ces hommes ont maintenant répondu de leur trahison devant le Parti d'Avant-garde. Molotov a répondu. ''Avant l'histoire elle-même'' corrigea tranquillement Hoxha. \"Il va sans dire que nous, Albanais, regardons avec une grande admiration ces récents développements en Union soviétique.\" \n\nLes discussions se sont poursuivies pendant encore plusieurs heures et le soleil était déjà couché lorsque la délégation s'est finalement levée pour partir. Molotov ne pouvait s'empêcher d'éprouver une certaine admiration pour Hoxha. Un petit pays comme l'Albanie a récemment résisté aux assauts non seulement des révisionnistes yougoslaves, mais aussi des khrouchtchéviens, et pourtant il est resté fermement sur la voie du marxisme-léninisme. Certes, des années auparavant, il n'aurait jamais imaginé que l'Albanie serait l'État socialiste en qui il aurait le plus confiance. Il se félicite néanmoins que les relations avec eux aient été rétablies et que les choses reprennent peu à peu le bon chemin."
 Bulg_trips.1.a:0 "Gloire à vous, camarade Enver !"

 Bulg_trips.2.t:0 "Pékin, [GetDateText]"
 Bulg_trips.2.desc:0 "La capitale chinoise les reçut bien, non pas avec la chaleur débordante de Tirana, mais avec le soulagement particulier d'hommes qui avaient vu quelque chose tourner gravement mal et qui avaient maintenant des raisons de croire que le problème était en train d'être corrigé. Molotov s'était déjà rendu à Pékin, dans des circonstances différentes, et la différence d'atmosphère n'était pas subtile. \n\nZhou Enlai fut le premier à rencontrer la délégation soviétique. Il était tel que Molotov se le rappelait : méticuleux, sans hâte, et les premiers échanges dépassaient rapidement les formalités. Le PCC n'a jamais voulu la rupture, il l'a répété à plusieurs reprises et au prix d'une position considérable parmi les partis qui ont avalé la ligne de Khrouchtchev. Cette retenue méritait d'être reconnue, et Molotov l'a clairement exprimé. \"Le 20e Congrès a placé les partis frères dans une position impossible\", a déclaré Zhou. « Nous avons fait part de nos préoccupations par les voies appropriées. Nous n'avons pas été entendus. » Il fit une pause. \"Néanmoins, nous sommes heureux que le parti d'Avant-garde, à la tête du Mouvement communiste mondial, ait résolu ses problèmes internes.\" \n\nMao a reçu Molotov le deuxième jour, de manière beaucoup plus décontractée, comme à son habitude. Il a parlé du discours secret avec un dédain non dissimulé, non seulement pour Staline, mais aussi pour ce que le discours impliquait. Il savait, dit-il, dès le moment du discours secret, que celui-ci ne serait pas maintenu. Un parti qui dénonçait sa propre histoire en séance publique était un parti qui avait perdu confiance en lui-même, et un parti sans confiance n'était d'une utilité limitée pour personne. Molotov n'était pas en désaccord et l'a dit clairement. \n\n\"Alors nous nous comprenons\", a déclaré Mao, avec la satisfaction d'un homme qui attendait ce moment précis depuis longtemps. La délégation est donc partie peu de temps après, avec un communiqué commun en préparation. Sur le vol de retour à Moscou, Molotov resta assis tranquillement avec ses notes et n'écrivit rien pendant un long moment. La relation prendrait du temps à se rétablir. Mais au moins, cela allait dans la bonne direction."
 Bulg_trips.2.a:0 "Une démarche franchie ensemble, avec précaution."

 Bulg.9.t:0 "La démission de Boulganine"
 Bulg.9.desc:0 "Boulganine n'en avait parlé à personne à l'avance, ce qui était en soi une sorte de déclaration. Il n'y a eu aucune négociation, aucun lobbying discret de la part du Présidium, aucune période de déclin visible qui aurait pu donner l'impression que l'annonce était une conclusion tirée par le comité central. Il avait simplement appelé Molotov à son bureau par un mardi matin gris, lui avait versé deux verres sans rien demander et lui avait dit ce qu'il avait à dire. \n\n\"La consolidation est terminée\", a-t-il déclaré. \"La commission a fait son travail. Le Congrès est prêt. La suite nécessite un type d'homme différent, Viatcheslav Mikhaïlovitch, et nous le savons tous les deux. » Molotov n'a pas immédiatement répondu. Il savait que cette conversation allait avoir lieu, il le savait, d'une manière ou d'une autre, depuis la nuit où les Khrouchtchéviens étaient tombés, mais savoir une chose et être assis en face d'elle n'était pas la même chose. \"Il faudra consulter le Présidium\", dit-il finalement. \"Le Présidium\", répondit Boulganine avec un sourire léger et fatigué, \"a déjà été consulté. Ils nous attendent. \n\nLa séance formelle de cet après-midi a été brève. Boulganine s'est adressé au Présidium sans notes, n'a remercié personne avec effusion et n'a fait aucun appel à l'histoire. On lui avait demandé de maintenir le cap pendant une période difficile, a-t-il déclaré, et il pensait l'avoir fait du mieux qu'il pouvait. Ce dont le Parti avait désormais besoin, c'était d'une continuité d'un genre plus profond : non seulement de la stabilité, mais aussi une direction et la clarté idéologique pour la soutenir. Il a recommandé le camarade Molotov sans plus de détails, comme si la recommandation allait de soi, ce qui était largement le cas dans cette salle. Le vote a été unanime. Molotov était désormais secrétaire général du Parti communiste de l'Union soviétique."
 Bulg.9.a:0 "Le mandat passe entre des mains plus fermes..."


#Bulganin Decisions

 sov_khrushchev_fate:0 "La question Khrouchtchev"
 sov_khrushchev_fate_desc:0 "\n\n\n\n\n\n£Khrushchevite_Purge\n\n\n\n\n\n\n Avec Khrouchtchev rétrogradé au rang de ministre de l'Agriculture et expulsé du Présidium, une bonne partie de la lutte contre le révisionnisme a été gagnée. Cependant, lui et ses acolytes ont toujours une influence considérable au sein du parti et s'ils ne sont pas traités efficacement, nous risquons de connaître une nouvelle prise de pouvoir. Nous devons liquider Khrouchtchev et ses subordonnés les plus puissants avant qu'ils ne puissent tenter une nouvelle fois de s'emparer du pays d'Octobre."

 khrushchev_fate_mission:0 "Sceller le sort de Khrouchtchev"
 khrushchev_fate_mission_desc:0 "Alors que nous essayons de rectifier une demi-décennie de révisionnisme, Khrouchtchev complote sans aucun doute dans notre dos pour tenter une nouvelle prise de pouvoir. Nous devons rapidement éliminer tous ses liens au sein des instances supérieures du gouvernement, puis exécuter immédiatement le traître."

 sov_arrest_serov:0 "Arrêter Ivan Serov"
 sov_arrest_serov_desc:0 "Serov, en tant que président du KGB, a tenté d'organiser des vols spéciaux pour emmener les membres du Comité central provincial de Khrouchtchev à Moscou et empêcher l'expulsion du traître révisionniste. Il est clair qu'il constitue un destructeur et une menace sérieuse et qu'il doit être réprimé au plus vite." 

 sov_arrest_furtseva:0 "Arrêter Ekaterina Furtseva"
 sov_arrest_furtseva_desc:0 "C'est Furtseva qui a alerté Serov de notre tentative de renverser Khrouchtchev, ce qui a failli condamner notre lutte contre le révisionnisme à l'échec total. Khrouchtchev compterait sans aucun doute sur elle dans toute future prise de pouvoir, ce qui en fait un handicap dont il faut tenir compte. Cependant, avant de pouvoir entreprendre une telle démarche, nous devons avoir Suslov à nos côtés." 

 sov_sideline_zhukov:0 "Gueorgui Joukov sur la touche"
 sov_sideline_zhukov_desc:0 "Même s'il n'est pas un khrouchtcheviste idéologique, le maréchal Joukov est aveuglé par des sentiments de grandeur et de fierté et pourrait être un pion pour les révisionnistes s'ils parviennent à flatter son ego et à lui promettre une plus grande influence. Pour éviter que l'armée ne devienne un instrument des révisionnistes, Joukov sera envoyé en inspection approfondie des armées du Pacte de Varsovie, le tenant loin de Moscou et des instances gouvernementales." 

 sov_assure_suslov:0 "Obtenez le soutien de Suslov"
 sov_assure_suslov_desc:0 "Mikhaïl Souslov, bien qu'on ait autrefois considéré qu'il était un digne successeur du camarade Jdanov, est devenu un caméléon politique et n'est en aucun cas un allié politique fiable, comme le démontre son soutien au « discours secret » blasphématoire de Khrouchtchev. Cependant, sa position de secrétaire principal de l'idéologie du PCUS ne doit pas être sous-estimée. C'est pour cette raison que nous devons obtenir son soutien, même temporairement, et veiller à ce qu'il ne soit pas une nouvelle fois utilisé par Khrouchtchev. L'opportunisme de Souslov sera abordé ultérieurement." 
 suslov_assured_tt:0 "Le soutien de Souslov a été assuré."