 BRA_Mongrel_Complex: "Complexe bâtard"
 BRA_Mongrel_Complex_desc: "Le complexe Mongrel découle de ses expériences historiques, notamment la colonisation et l'esclavage, qui ont façonné un paysage social diversifié mais difficile. De nombreux Brésiliens se comparent aux normes de progrès européennes et américaines, ce qui peut éclipser leurs propres réalisations et nourrir un sentiment d'inadéquation.\n\nCe sentiment d'infériorité est évident dans la culture, où les artistes brésiliens mesurent souvent leur valeur par rapport aux influences étrangères. En politique et en économie, le désir de développement conduit les Brésiliens à rechercher des modèles externes de gouvernance et d'industrie, ignorant souvent leurs propres atouts uniques, tels qu'un patrimoine culturel dynamique et des ressources naturelles."

BRA_Legacy_of_the_Estado_Novo: "L'héritage de l'Estado Novo"
BRA_Legacy_of_the_Estado_Novo_desc: "Malgré la fin de la dictature de Getúlio Vargas en 1945, ses structures persistent dans la politique brésilienne. Aimé par une grande partie de la population pour son héritage de modèle en faveur des droits du travailleur ordinaire et son charisme de populiste, proche du peuple qui s'est heurté à l'élite politique traditionnelle.\n\nMême après avoir été renversé en 1945, Vargas jouissait toujours d'une grande popularité, étant élu sénateur par deux États et législateur par six, et le manque d'identification des partis d'opposition parmi la population syndicale, il ne fait aucun doute que toute avancée politique de Vargas rencontrerait un soutien écrasant. "

BRA_Communist_Agitation: "Agitation communiste"
BRA_Communist_Agitation_desc: "Le PCB est une épine dans notre pied depuis sa fondation en 1922. Bien qu'il ait été interdit pour la troisième fois par le président Dutra en 1947 et que ses parlementaires aient été révoqués l'année suivante, sa popularité parmi la classe ouvrière est indéniable, gagnant plus d'un demi-million de voix aux élections de 1945, ce qui en fait un véritable ennemi que nous ne pouvons pas sous-estimer."

BRA_Coffee_Economy: "Économie du café"
BRA_Coffee_Economy_desc: "Produisant un tiers de la production mondiale de café, le Brésil est de loin le plus grand producteur de café de la planète. Les États de São Paulo, Minas Gerais et Paraná abritent la plupart des plantations en raison de leurs conditions de croissance idéales grâce au climat. Avec plus de 60 % des exportations brésiliennes constituées uniquement de café, celui-ci constitue depuis le début un produit de base de l'économie du pays, apprécié par de nombreux pays dans le monde en raison de sa saveur unique, le café brésilien assumant parfois le statut de produit de luxe dans certains."

BRA_ISI: "Industrialisation par substitution aux importations"
BRA_ISI_desc: "L'industrialisation par substitution des importations, ou ISI en abrégé, était une stratégie adoptée par Vargas dans le but de réduire la dépendance du Brésil à l'égard des produits importés et de faire face à la Grande Dépression. Cette politique visait à encourager la production nationale, en favorisant le développement des industries nationales. L'idée centrale était de remplacer les biens importés par des produits fabriqués localement, renforçant ainsi l'économie nationale et créant des emplois dans le pays. \n\nEn encourageant la production nationale, le gouvernement Vargas cherchait à créer une base industrielle solide au Brésil. Cela était essentiel pour la modernisation de l'économie brésilienne, jusqu'alors majoritairement agricole. La politique de substitution des importations a également eu un impact significatif sur la balance commerciale du pays, réduisant le déficit et favorisant l'autosuffisance dans divers secteurs."

BRA_Underdeveloped_Infrastructure: "Infrastructure sous-développée"
BRA_Underdeveloped_Infrastructure_desc: "Les routes, les chemins de fer et l'industrie ont toujours été concentrés sur la côte et dans les immenses centres démographiques et économiques, laissant une grande partie de l'intérieur du pays sous-développée."

BRA_Veterans_of_Monte_Castelo: "Vétérans de Monte Castelo"
BRA_Veterans_of_Monte_Castelo_desc: "La FEB a combattu courageusement en Italie pendant la Seconde Guerre mondiale, ces vétérans ont ramené chez eux expérience du combat et gloire."

BRA_Weak_Arms: "Faible industrie nationale de l'armement"
BRA_Weak_Arms_desc: "Notre industrie nationale de l'armement est terne, ce qui nous rend fortement dépendants des importations."

BRA_Amazon_Frontier: "Frontière amazonienne"
BRA_Amazon_Frontier_desc: "Il existe de nombreuses richesses intactes qui attendent d'être revendiquées dans la région amazonienne. Avec des investissements judicieux et judicieux, nous pourrions tirer parti de nos trésors naturels pour dynamiser notre nation comme elle ne l'a jamais été."

BRA_Vale: "Vale S.A."
BRA_Vale_desc: "La Companhia do Vale do Rio Doce, ou Vale en abrégé, est une société minière nationale fondée par Vargas en 1942. Elle opère principalement en fournissant du fer provenant des riches gisements de fer du Brésil aux aciéries de tout le pays. En raison du manque de demande, elle se développe lentement, mais avec les bons conseils, elle peut devenir l'une des plus grandes entreprises de la planète."

BRA_Rural_Exodus: "Exode rural"
BRA_Rural_Exodus_desc: "Chaque mois, d'innombrables familles quittent les campagnes de notre pays, motivées par de meilleures conditions de vie et d'emploi, motivées par des facteurs tels que l'industrialisation et la mécanisation de l'agriculture, qui provoquent du chômage dans les campagnes et des opportunités dans les grandes villes. Venant principalement du nord-est et cherchant à échapper aux graves sécheresses qui touchent chaque année la région, ils arrivent dans les zones métropolitaines de São Paulo et de Rio de Janeiro. Si cela crée davantage de main-d'oeuvre dans les centres urbains, cela entraîne également une croissance désordonnée des zones urbaines, la création d'infrastructures précaires, une augmentation de l'informalité et un manque de main-d'oeuvre dans les campagnes, avec des impacts sur la production agricole et le développement rural."

 BRA_Vargas_INPA_Research: "Institut National de Recherche amazonienne"
 BRA_Vargas_INPA_Research_desc: "L'INPA est le moteur d'une dynamique nationale en faveur de la recherche scientifique."
 BRA_Gomes_US_Tech_Share_Idea: "Partage de technologie américaine"
 BRA_Gomes_US_Tech_Share_Idea_desc: "Les accords de partage de technologie avec les États-Unis accélèrent nos recherches."
 BRA_Korean_War_Volunteers: "Volontaires pour la Corée"
 BRA_Korean_War_Volunteers_desc: "Les volontaires brésiliens sont autorisés à combattre aux côtés de nos alliés en Corée."
 BRA_Military_Police_Occupation_Doctrine: "Doctrine du métier de la police militaire"
 BRA_Military_Police_Occupation_Doctrine_desc: "Notre police militaire est formée pour administrer les territoires occupés."
 BRA_Kubitschek_Food_Program: "Programme alimentaire Kubitschek"
 BRA_Kubitschek_Food_Program_desc: "L'investissement dans l'agriculture augmente la production et réduit le coût de l'alimentation de la nation."
