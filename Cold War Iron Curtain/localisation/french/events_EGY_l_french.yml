l_french: 
 Nasser.2.d:0 "Aujourd'hui, le gouvernement égyptien a annoncé la mort du maréchal Abdel Hakim Amer. Il est décédé en garde à vue des suites d'un suicide. Le mois dernier, Amer, ainsi que des dizaines d'autres officiers et fonctionnaires, ont été arrêtés pour trahison et il devait comparaître devant le tribunal avant sa mort. Beaucoup pensent qu'il s'est suicidé afin d'éviter un procès humiliant et de sauver la face. Tandis que d'autres milieux suggèrent que la mort semble plutôt commode pour le président égyptien en difficulté, qui a eu du mal à maintenir son image publique après la récente défaite face à Israël. La mort du maréchal marque une chute dramatique pour un homme autrefois considéré comme l'allié le plus proche du président Gamal Abdel Nasser. Les deux se sont rencontrés lors d'un entraînement militaire et Amer jouera un rôle de premier plan dans le coup d'État qui portera Nasser au pouvoir. Dans les années qui ont suivi, Amer a dirigé l'armée égyptienne et dirigé le ministère de la Défense. En 1964, il était le premier vice-président et aurait succédé à Nasser si le président était frappé d'incapacité. Cependant, l'échec de l'Égypte à remporter la victoire sur les Israéliens dans la guerre au début de cette année a vu sa réputation s'effondrer et il a été démis de ses fonctions une fois qu'il est devenu clair qu'Israël avait remporté la victoire. Depuis la fin de la guerre, Amer est devenu la personnification de la défaite et, selon certaines rumeurs, son refus de démissionner de tous ses postes aurait irrité le président Nasser."
 Nasser.1.d:0 "Le célèbre écrivain égyptien Sayyid Qutb a été condamné à mort par pendaison cet après-midi pour complot visant à assassiner le Premier ministre Gamal Nasser. Sayyid Qutb était l'un des principaux intellectuels des Frères musulmans, une organisation politique et religieuse fondée sur la conviction que l'Islam n'est pas simplement une religion mais un mode de vie. Sayyid Qutb est surtout connu pour son manifeste Ma'alim fi al-Tariq ou également connu sous le nom de Milestones, qui qualifie la communauté musulmane d'éteinte, affirmant qu'elle est tombée dans un état de Jahiliyyah ou un âge d'ignorance. Pour purifier Jahiliyyah, il faudrait construire un nouveau monde musulman sans personne au service d'un président ou d'un parlement mais plutôt de personnes au service de Dieu. Dans son manifeste, il décrit tout ce qui est non musulman ou appartenant à la Jahiliyyah comme étant mauvais et corrompu et son existence, où qu'elle soit, devrait être intolérable pour tous les vrais musulmans. Les jalons de Qutb appelaient également à la formation de l'Avant-garde islamique qui suivrait le double plan de Qutb pour la reconstruction du monde musulman, qui se ferait par la conversion et le Jihad offensif."
 Rogers_Plan.1.d:0 "Le président Gamal Abdel Nasser a accepté la proposition du secrétaire d'État américain William P. Rogers concernant la paix entre l'Égypte et Israël. Le plan envisage une démilitarisation du canal de Suez et son retour à l'Égypte, Jérusalem devenant une ville internationale administrée par les trois grandes religions, le libre passage des navires israéliens par le canal de Suez, et des négociations suivraient sur le statut final de la bande de Gaza et de Charm el-Cheikh après le retrait israélien de ces territoires. Même si les diplomates soviétiques et leurs proches conseillers ont souligné que le plan semblait pro-israélien et pourrait entraîner des réactions négatives de la part du monde arabe dans son ensemble, Nasser pense que le plan sera à son avantage. Le plan offrira aux Palestiniens la possibilité de rentrer chez eux et préservera également Jérusalem en tant que ville ouverte. Plus important encore, résoudre la rivalité militaire avec Israël permettra à l'Égypte d'économiser beaucoup de ressources et lui permettra de se concentrer davantage sur la diffusion de sa vision nationaliste panarabe dans la région. En outre, en s'engageant dans des efforts de paix, l'Égypte démontrera au monde son engagement en faveur de la paix et si Israël rejette le plan, l'Égypte gagnera davantage de respect de la part des grandes puissances. Le président Nasser espère que sa réputation et sa position dans le monde arabe l'aideront, lui et l'Égypte, à surmonter toute réaction négative liée à l'acceptation du plan."
 an_Naksah.1.d:0 "Après le désastre de la guerre de 1967, le peuple et le gouvernement égyptiens ont commencé à se méfier de la communauté juive de leur pays, vieille de 3 000 ans. De nombreux Égyptiens pensaient avoir sympathisé ou aidé activement l'ennemi, ce qui leur avait permis de vaincre de manière décisive l'armée égyptienne. Face à la colère généralisée du public à l'égard de la communauté juive, le président Gamal Abdel Nasser a décidé d'ordonner aux agences de sécurité et de police de l'État de s'engager dans une campagne d'arrestations, d'intimidation et d'expulsion. Pour l'État égyptien et Nasser, blâmer la communauté juive détourne la colère du public du fait de blâmer l'État pour les récents revers. Cela constitue également une excuse commode pour expliquer pourquoi l'armée égyptienne n'a pas réussi à atteindre les objectifs ambitieux promis par ses dirigeants. Les forces de sécurité égyptiennes ont arrêté un grand nombre d'hommes juifs et les ont placés dans des centres de détention sans aucune indication sur quand ni s'ils seront libérés. La panique au sein de la communauté juive a conduit à une fuite alors que de nombreuses familles juives se dirigent vers Israël, les États-Unis et à travers l'Europe. Beaucoup pensent que cette dernière vague de répression pourrait conduire au déclin final de la communauté juive égyptienne, autrefois importante."
 Nasser.3.d:0 "Cet après-midi, le président Gamal Abdel Nasser a annoncé la création de l'Union socialiste arabe (ASU) en tant que parti politique légal unique de la République arabe d'Égypte. Cela a été fait conformément à la Charte nationale de Nasser, qui appelait à la nationalisation, aux réformes agraires, aux réformes agraires et aux amendements constitutionnels. L'Union socialiste arabe est un parti politique fondé sur les idéaux du nationalisme arabe, du panarabisme et des valeurs socialistes arabes, qui constitueront la base de la prise de décision au sein de l'ASU. L'Union socialiste arabe agira en tant qu'autorité suprême de l'État égyptien. L'Union socialiste arabe comprendra également un comité général, un comité exécutif suprême, un secrétaire général et un président. Gamal Nasser sera également le premier secrétaire général de l'Union socialiste arabe."
 nasser.10.d:0 "Le président Gamal Abdel Nasser de la République arabe unie (RAU) a annoncé que ses forces franchiraient bientôt la frontière et libéreraient les Arabes d'Arabie saoudite. Après la victoire éclatante de la RAU sur Israël, Nasser espère diffuser sa vision du nationalisme arabe et de l'anti-impérialisme à travers le monde arabe. Dans son discours déclarant la guerre à l'Arabie Saoudite, Nasser a qualifié la famille royale saoudienne de comparses corrompus et impérialistes qui utilisent le soutien de l'Occident pour maintenir son emprise sur le peuple saoudien et freiner la ferveur révolutionnaire arabe. Nasser a noté que des régimes réactionnaires comme les Saoudiens avaient retenu les Arabes, encouragé les querelles internes et donné leurs immenses richesses pétrolières aux puissances impérialistes. Il a averti que seule la détermination de la RAU aurait pu vaincre les machinations saoudiennes et remporter sa grande victoire sur Israël. L'Arabie saoudite a souvent été en désaccord avec Nasser depuis son arrivée au pouvoir au début des années 1950. L'Arabie saoudite a souvent cherché à censurer et à freiner la propagation du nassérisme et du panarabisme dans la région et a souvent soutenu des régimes qui luttaient pour empêcher une prise de pouvoir nassériste. Les Nations Unies ont accueilli l'annonce de la RAU avec beaucoup d'inquiétude et ont appelé à la paix. Les États-Unis, la Grande-Bretagne et l'Union soviétique surveillent de près la situation alors que l'invasion de la RAU menace le marché pétrolier mondial. De nombreux observateurs craignent que cette guerre ne conduise à un conflit plus grave, peut-être mondial, car rares sont ceux qui croient que les États-Unis peuvent se permettre de menacer un autre partenaire mondial vital."
 Al_Azhar.1.d:0 "Cheikh Mahmood Shaltoot, le grand imam de l'école de pensée théologique d'Al-Azhar en Égypte, a publié aujourd'hui une fatwa reconnaissant les Alaouites, les Chiites et les Druzes comme musulmans et doivent être traités sans préjudice injuste. Al-Azhar est l'un des principaux centres d'érudition sunnite du monde. Pour le plus grand plaisir du Dar al-Taqreeb al-Madhahib al-Islamiyyah, un groupe d'érudits sunnites et chiites d'Al-Azhar qui ont jeté les bases de relations amicales et de compréhension entre les différentes sectes de l'Islam. À l'origine, avant cela, les Druzes, les Chiites et les Alaouites étaient traités comme des hérétiques ou des païens et étaient parfois persécutés dans les communautés sunnites du Moyen-Orient tout au long de l'histoire. Gamal Abdel Nasser a également montré son soutien à la fatwa en veillant à ce que la fatwa soit publiée dans tout le Moyen-Orient. Cela amènerait l'apogée des relations sunnites-chiites pour la prochaine décennie."
 Syria_Seccession.1.d:0 "Tôt le matin de [ROOT.GetDateText], le lieutenant-colonel Abd al-Karim al-Nahlawi a conduit ses troupes à s'emparer des installations militaires, de la station de radio et de l'aéroport dans le cadre d'un coup d'État contre l'union égyptienne et d'un appel à l'indépendance de la Syrie. Dans les heures qui ont suivi, de nombreuses unités militaires syriennes ont promis leur soutien au coup d'État et les dirigeants pro-République arabe unie (RAU) sont de plus en plus isolés. Les putschistes ont annoncé à la radio que l'armée avait pris des mesures pour éliminer la corruption et restaurer les droits du peuple syrien. Le président Gamal Abdel Nasser a été pris au dépourvu par ces développements, sans se rendre compte à quel point son approche autoritaire et sa politique économique de nationalisation agressive aliénaient les Syriens. Il a deux choix : l'un est d'accepter le coup d'État et le désir syrien de restaurer son indépendance. Cela pourrait aider l'Égypte à préserver de bonnes relations et peut-être une alliance militaire essentielle à la sécurité du pays. Cependant, cela n'est pas garanti. L'autre option serait de soutenir les Syriens encore dévoués à la RAU et à la cause du nationalisme arabe. Peut-être que soutenir la faction pro-RAU en Syrie avec la puissance militaire égyptienne pourrait restaurer l'unité et démontrer la force de la vision de Nasser pour le monde arabe."
 Syria_Seccession.2.d:0 "À la suite du coup d'État militaire, les conspirateurs et leurs partisans ont établi une junte militaire. Le président égyptien Gamal Abdel Nasser a répondu aux événements par un discours à la radio provocateur dans lequel il a affirmé que le coup d'État manquait d'un large soutien et a appelé l'armée syrienne à le réprimer. Malgré sa réponse agressive, les partisans de Nasser à Damas étaient en état d'arrestation et la plupart des militaires se rangeaient fermement du côté des rebelles. Les efforts de négociation d'un compromis ont été rejetés par Nasser qui estimait que la RAU devait rester un État socialiste centralisé pour survivre et ne pouvait pas faire de compromis sur ces questions. Quelques jours après le discours de Nasser, les responsables égyptiens en Syrie, ainsi que les Syriens pro-RAU, sont rentrés discrètement au Caire. La RAU a été créée en 1958 et a uni l'Égypte à la Syrie sous la direction du grand leader nationaliste arabe, le président Nasser. En Syrie, les craintes d'une prise de pouvoir communiste et l'attrait pour le nationalisme arabe ont poussé de nombreux partis politiques, notamment le parti Baas, à faire pression en faveur d'une union égyptienne. Cependant, les espoirs d'une union entre égaux ne se sont pas concrétisés car, après la création de la RAU, Nasser a remanié la constitution pour assurer la domination politique égyptienne. Les dirigeants du parti Baas ont été écartés des postes clés du gouvernement lorsque les Égyptiens et l'armée syrienne ont été soumis à l'armée égyptienne. Les partis politiques ont également été purgés et l'autonomie politique s'est progressivement érodée en Syrie. Sur le plan économique, Nasser a imposé un programme agressif de nationalisation et de réforme agraire, mais sans grande participation ni contribution des socialistes syriens. Le manque d'égalité politique, économique ou militaire a conduit à des tensions accrues qui ont finalement débouché sur le coup d'État. Alors que Nasser a publiquement dénoncé le coup d'État et affirmé que la RAU restait forte, la réalité est que la RAU n'existe plus et que la Syrie est à nouveau indépendante, sous le contrôle de sa propre armée."
 Syria_Seccession.3.d:0 "Le président Gamal Abdel Nasser s'est adressé à la nation à la suite du coup d'État en Syrie, il a rejeté le coup d'État comme étant le fait d'une petite faction et a déclaré, dans une mesure extraordinaire, que des forces égyptiennes seraient bientôt envoyées pour aider l'armée syrienne à réprimer le coup d'État. Nasser a en outre décrit le coup d'État comme un complot des ennemis du peuple arabe visant à affaiblir la RAU et à garantir que les impérialistes et les ennemis des Arabes puissent exploiter la crise. Le général Abdel Hakim Amer, proche confident du président Nasser, se trouvait à Damas avant le coup d'État. Après le coup d'État, il a rencontré des dirigeants militaires et politiques syriens pour rechercher un compromis et, suite à la décision de Nasser de résister activement au coup d'État, il a pu obtenir le soutien de certains Syriens puissants qui adhéraient toujours à leurs convictions nationalistes arabes. Les commandants syriens le long de la côte hésitaient et étaient sur le point de se joindre au coup d'État. Après avoir entendu le discours de Nasser, ils ont décidé de ne pas détenir de responsables militaires égyptiens et tiennent désormais fermement ces bases côtières en prévision du soutien égyptien. Alors que l'armée syrienne semble désormais divisée, la guerre civile semble inévitable. Les putschistes bénéficient d'un soutien populaire plus important, mais les factions pro-UAR sont enhardies par la réponse agressive de Nasser."
 suezcrisisnews.1.d:0 "L'opération conjointe anglo-française-israélienne visant à sécuriser le Sinaï et le canal de Suez du gouvernement égyptien s'est avérée être un succès spectaculaire. L'opération a eu lieu après que le président nationaliste égyptien Gamal Abdel Nasser ait nationalisé le canal de Suez. Ses forces se désintégrèrent en grande partie face aux armées d'invasion, Suez et le Sinaï étant pris avec peu de résistance. L'échec militaire ne pouvait être caché au public égyptien qui se sentait trahi par Nasser et les dirigeants militaires nationalistes pour leur incompétence. Les forces anglo-françaises ont ensuite aidé la classe moyenne égyptienne en colère et les officiers antinationalistes de l'armée à renverser Nasser, à mettre fin aux opérations de combat et à confirmer le contrôle britannique sur Suez. Sans Nasser, l'espace était ouvert pour le retour du roi Farouk sur le trône. Une cérémonie élaborée au Caire a marqué sa réintronisation, en présence de hauts responsables égyptiens, britanniques et français. Le grand public a été exclu pour éviter tout incident embarrassant."
 suezcrisisnews.2.d:0 "La crise du Sinaï s'est terminée lorsque les forces anglo-françaises ont accepté de se retirer de Suez. Bien que leur partenaire Israël continue de détenir le Sinaï, ils devraient également revenir à leurs positions d'avant-guerre. Militairement, l'opération conjointe anglo-française-israélienne s'est révélée être un succès retentissant, les forces égyptiennes étant repoussées dans le désarroi. Cependant, les protestations internationales, notamment celles des deux superpuissances, ont forcé un cessez-le-feu et un retrait. L'invasion a commencé en réponse à la décision prise par le gouvernement nationaliste égyptien de nationaliser le canal de Suez. Le président égyptien Gamal Abdel Nasser proclame la victoire égyptienne et le triomphe arabe sur l'impérialisme mondial. Malgré les défaites de ses forces, la population et le monde arabe dans son ensemble ont reçu de fausses informations sur les victoires militaires égyptiennes et l'annonce du retrait semble confirmer ce récit. Le tollé international à travers le monde et la pression des superpuissances montrent que la liberté d'action dont jouissent depuis longtemps les États coloniaux ne sera pas tolérée par la communauté internationale dans son ensemble."
 Yemani_Coup.1.d:0 "L'imam Muhammad Al Badr a accédé au trône du Yémen après la mort de son père en 1962. Malgré son origine royale, il a longtemps admiré le président égyptien Gamal Abdul Nasser et l'un de ses premiers actes a été de promouvoir le colonel nassérien connu Abdullah Sallal au commandement de la garde du palais. Ceci malgré la position anti-Nasser de son père et la menace que le nationalisme arabe faisait déjà peser sur l'imamat. Le père d'Al Badr a brutalement réprimé une tentative de coup d'État en 1955 par des officiers nassériens qui cherchaient à mettre fin à la monarchie. En Égypte, le président Nasser a ouvertement soutenu les officiers yéménites anti-royaux et les diplomates égyptiens ont discrètement soutenu de multiples complots contre Al Badr. Abdullah Sallal, en coopération avec d'autres conspirateurs, prévoyait de déployer des chars et des troupes armées pour attaquer le palais d'Al Badr dans la nuit du 26 septembre 1962. Le coup d'État prévu a été déclenché après que Sallal ait appris qu'Al Badr était au courant de complots contre lui. Des années de tensions entre révolutionnaires et partisans de la monarchie ont maintenant dépassé leurs limites et il semble que les efforts d'Al Badr pour travailler avec les factions nasséristes se soient retournés contre lui alors que le coup d'État de Sallal commence à se déclencher."
 Yemani_Coup.2.d:0 " Vers 23 h 45, la nuit du coup d'État, les chars du colonel Abdullah Sallal ont commencé à pilonner le palais royal. Muhammad Al Badr a tenté de mener une résistance mais en raison de la puissance de feu écrasante, il a été contraint de s'échapper du palais et a été chassé de sa capitale, San'a. Les forces de Sallal ont rapidement sécurisé les installations clés de la ville, notamment la station de radio et l'aéroport. D'autres officiers révolutionnaires, dont beaucoup étaient favorables à la tentative de coup d'État de 1955, ont commencé à prendre le contrôle d'autres grandes villes du Yémen. La radio a annoncé le renversement d'Al Badr et la fin d'une monarchie corrompue qui avait paralysé le développement du Yémen en tant que peuple et partie du monde arabe. Sallal a solidifié son contrôle sur la Révolution en purgeant les non-nasséristes et l'Égypte a dépêché des officiers supérieurs pour évaluer l'aide dont le régime Sallal avait besoin. Malgré les déclarations selon lesquelles Al Badr était mort lors de l'assaut du palais, le roi yéménite avait survécu et se dirigeait vers le nord, obtenant le soutien des membres de la tribu et s'installant en Arabie Saoudite."
 Yemani_Coup.3.d:0 "Le matin du 26 septembre 1962, un officier royaliste informa l'Imam Muhammad Al Badr que son commandant de la garde du palais et colonel nassérien connu Abdullah Sallal avait ouvert l'armurerie de l'académie militaire pour armer les troupes et les officiers subalternes. De plus, Sallal a informé Al Badr que des chars allaient être déplacés cette nuit-là près du palais et qu'Al Badr ne devrait pas s'inquiéter. Méfiant de ces actions, Al Badr a appelé des officiers et des soldats fidèles à le rencontrer et quelques heures seulement avant que les chars de Sallal ne soient mis en position pour attaquer le palais, Al Badr a fait arrêter Sallal et a annulé les ordres de déplacer les chars. Un complot simultané visant à envoyer une voiture blindée et à sécuriser la station de radio et l'aéroport par le lieutenant Ali Abdul Moghny a été facilement démantelé grâce à ses hommes qui ont brièvement saisi la station de radio. En quelques heures, le complot putschiste a été déjoué et ses principaux conspirateurs soit en détention, soit en fuite."
 Tiran_Closing.1.d:0 "Lors de la dernière escalade au Sinaï, le président égyptien [EGY.GetLeader] a annoncé la fermeture du détroit de Tiran à tous les navires à destination d'Israël, déclarant que les navires tentant de violer le blocus feraient l'objet de tirs. Cette nouvelle fait suite à la remilitarisation du Sinaï par les forces égyptiennes le 14 mai et à la demande d'expulsion des casques bleus de l'ONU le 16 mai. Nasser a déclaré : « Nous sommes prêts pour la guerre... Ces eaux sont à nous. Si Israël souhaite menacer la guerre, nous lui disons : vous êtes les bienvenus ». Plus tôt ce mois-ci, le Premier ministre israélien [ISR.GetLeader] a réitéré l'avertissement de 1957, selon lequel toute fermeture du détroit serait considérée comme un acte de guerre. Des rapports font état de mouvements de chars israéliens en réponse au déploiement égyptien dans le Sinaï. Les tensions montent dans la région, alors que les diplomates tentent de résoudre la crise avant qu'elle ne s'aggrave davantage. Israël reçoit 90 pour cent de son pétrole via le détroit et les observateurs considèrent cela comme une grave menace pour l'économie israélienne. Les Arabes de la région ont été galvanisés par les actions de [EGY.GetLeader]et soutiennent avec enthousiasme sa politique envers Israël."
 aswan.100.d:0 "Plus de 10 ans après le début des travaux, l'Égypte a finalement achevé le barrage d'Awan. Le projet a vu des dizaines de milliers d'ingénieurs et d'ouvriers égyptiens, avec l'aide du financement et de l'expertise soviétique, mener à bien ce projet massif. Ce succès représente une grande réussite pour la coopération arabo-soviétique. Avec le barrage d'Assouan, l'Égypte espère utiliser le Nil pour son hydroélectricité, contribuer à contrôler les inondations et conduire à un boom agricole pour le pays. Le réservoir a été nommé Lac Nasser en l'honneur du président visionnaire égyptien Gamal Abdel Nasser. Les plans du barrage ont commencé au début des années 1950 et sont devenus un élément clé des plans de Nasser visant à moderniser l'Égypte. L'achèvement de ce projet représente le plus grand projet de développement de l'Égypte indépendante depuis qu'elle a échappé au joug de l'impérialisme occidental et de nombreux Égyptiens sont optimistes que cela conduira à un âge d'or économique."
 
 black_saturday.1.d:0 "Les troubles ont commencé à l'aéroport d'Almaza, lorsque les travailleurs ont refusé de fournir des services aux avions britanniques. Elle a été suivie par la rébellion des policiers, qui voulaient exprimer leur solidarité avec leurs collègues morts et capturés. Les manifestants se sont ensuite dirigés vers le bâtiment de l'université, où ils ont été rejoints par des étudiants. Ensemble, ils ont marché vers le bureau du Premier ministre pour exiger que l'Égypte rompe ses relations diplomatiques avec le Royaume-Uni et lui déclare la guerre. On leur a dit que le gouvernement souhaitait le faire, mais qu'il s'est heurté à l'opposition du roi. En conséquence, les manifestants se sont rendus au palais Abdeen et ont exprimé leur mécontentement envers le roi. Le premier acte d'incendie criminel a eu lieu sur la place de l'Opéra, où le feu s'est propagé à plusieurs magasins, bureaux d'entreprise, cinémas, hôtels et banques. Les incendies ont également atteint les quartiers de Faggala, Daher, la Citadelle, la place Tahrir et la place de la gare du Caire. En raison du chaos, des vols et des pillages ont eu lieu jusqu'à l'arrivée de l'armée égyptienne."
 farouk_gang.6:0 "Tout est prêt pour le prochain défilé militaire. Les chars ont été ravitaillés, les canons ont été braqués et les soldats ont été nourris. Bientôt, tout le monde saura que notre puissance militaire est forte et que se rebeller ou nous attaquer serait inutile !"
 farouk_gang.9.d:0 "Le roi Farouk, impopulaire et oublié, serait décédé. Apparemment, il a subi une crise cardiaque mortelle causée par le stress et des habitudes de vie malsaines. Cependant, certaines sources rapportent qu'il s'est suicidé tandis que d'autres affirment qu'il a été assassiné par le gouvernement. Quelle que soit la vérité officielle, une chose est sûre : une nouvelle époque s'ouvre pour l'Égypte."
 egy_trial.2.d:0 "Maintenant que Naguib a assuré sa suprématie sur Nasser, il est temps de décider quoi faire de lui. Premièrement, nous pouvons le laisser vivre une vie normale au Caire. Si nous voulons le punir, nous pouvons le contraindre à l'exil et lui interdire de revenir ou bien l'emprisonner pendant plusieurs années."
 egy_trial.3.d:0 "Très peu de gens se souviennent du nom de Gamal Abdel Nasser. Autrefois l'un des principaux membres du Conseil de commandement révolutionnaire, il a finalement tenté de renverser Naguib, ce qui s'est soldé par un échec. Après l'échec du coup d'État, il a disparu de la politique et, selon des sources anonymes, il vit actuellement quelque part au Caire."
 egy_trial.4.d:0 "Gamal Abdel Nasser, autrefois figure majeure du Conseil de commandement révolutionnaire, vient d'être contraint à l'exil. Les rapports indiquent qu'il a été escorté jusqu'à l'aéroport sous la menace d'une arme, où il est monté à bord d'un avion vers une destination inconnue. À l'extérieur de l'aéroport, plusieurs personnes protestaient contre cela, affirmant que Nasser était le salut de l'Égypte et que l'Égypte était désormais condamnée."
 egy_trial.5.d:0 "Dernières nouvelles du palais de justice du Caire. Gamal Abdel Nasser, ancien haut responsable du Conseil du commandement révolutionnaire, vient d'être condamné à 15 ans de prison pour sa tentative de coup d'État contre le président Naguib. Nasser purgera sa peine à la prison de Tora."
 egypt.60.t:0 "Nationalisation de Suez"
 egypt.60.d:0 "Après des tensions croissantes avec notre gouvernement, l'Égypte a unilatéralement nationalisé et saisi le canal de Suez"
 egypt.60.a:0 "Préparez-vous à la guerre et contactez les Français"
 egypt.60.b:0 "Émettre une condamnation diplomatique"
 egypt.61.d:0 "Après la montée des tensions avec la Grande-Bretagne, l'Égypte a unilatéralement nationalisé et saisi le canal de Suez, la Grande-Bretagne prépare la guerre et demande que nous nous joignions à eux pour le faire"
 egypt.61.a:0 "Émettre une condamnation diplomatique"
 egypt.61.b:0 "Accepter de rejoindre la Grande-Bretagne pour la guerre" 
 egypt.62.d:0 "Après la montée des tensions avec la Grande-Bretagne, l'Égypte a unilatéralement nationalisé et saisi le canal de Suez, la Grande-Bretagne ne veut pas déclencher une guerre et cherche également d'autres pays à les condamner diplomatiquement"
 egypt.62.a:0 "Émettre une condamnation diplomatique"
 egypt.63.t:0 "La France refuse d'entrer en guerre"
 egypt.63.d:0 "Après un long débat interne, le gouvernement français a refusé de se joindre à notre guerre contre l'Égypte"
 egypt.63.a:0 "Préparez-vous quand même à la guerre"
 egypt.63.b:0 "Émettez plutôt une condamnation diplomatique"
 egypt.64.t:0 "La France refuse d'entrer en guerre"
 egypt.64.d:0 "Après un long débat interne, le gouvernement français a décidé de se joindre à notre guerre contre l'Egypte"
 egypt.64.a:0 "Déclarez la guerre à l'Égypte et contactez les Israéliens"
 egypt.65.t:0 "La France et la Grande-Bretagne déclarent la guerre"
 egypt.65.d:0 "Après un long débat interne, les gouvernements français et britannique ont décidé de déclarer la guerre à notre pays pour reprendre leurs possessions coloniales à l'intérieur de nos frontières"
 egypt.65.a:0 "Racaille impérialiste"
 egypt.66.t:0 "La Grande-Bretagne déclare la guerre"
 egypt.66.d:0 "Après un long débat interne, le gouvernement britannique a décidé de déclarer la guerre à notre pays pour reprendre ses possessions coloniales à l'intérieur de nos frontières"
 egypt.66.a:0 "Écume britannique"
 egypt.67.t:0 "La Grande-Bretagne recule"
 egypt.67.d:0 "Après un long débat interne, le gouvernement britannique a décidé de s'abstenir de déclarer la guerre à l'Égypte après notre décision de ne pas nous joindre à lui dans une attaque militaire"
 egypt.67.a:0 "Pas de guerre pour l'instant alors"
 egypt.68.t:0 "La Grande-Bretagne déclare la guerre"
 egypt.68.d:0 "Après un long débat interne, le gouvernement britannique a décidé de s'abstenir de déclarer la guerre à l'Égypte après notre décision de ne pas nous joindre à lui dans une attaque militaire"
 egypt.68.a:0 "Cela aura des conséquences malheureuses"
 egypt.69.t:0 "Une offre de frapper l'Égypte"
 egypt.69.d:0 "La Grande-Bretagne et la France nous ont contactés pour nous informer qu'elles attaquent l'Égypte, nous avons également été invités à nous joindre à cette guerre....."
 egypt.69.a:0 "Rejoignez la guerre"
 egypt.70.t:0 "Invitation à l'Union franco-britannique"
 egypt.70.d:0 "Il y a quelques semaines, lorsque la crise de Suez a éclaté, les Français ont déclaré qu'ils nous aideraient. Récemment, une proposition française du Premier ministre français a gagné du terrain au Parlement, selon laquelle ils formeraient une Union avec nous. Les Français seraient annexés par nous et intégrés à notre gouvernement. Cela créerait un nouveau gouvernement appelé Union franco-britannique. Notre Parlement doit décider si nous rejoindrons ou non l'Union avec eux."
 egypt.70.a:0 "Unissons-nous."
 egypt.70.b:0 "Non, merci."
 news.200.t:0 "La crise de Suez"
 news.200.d:0 "Après la montée des tensions avec la Grande-Bretagne, l'Égypte a unilatéralement nationalisé et saisi le canal de Suez"
 news.200.a:0 "Une évolution intéressante"
 news.200.b:0 "Un coup dur contre l'impérialisme"
 news.200.c:0 "Une évolution préoccupante"
 news.200.e:0 "L'heure de la guerre ?"
 news.206.d:0 "Après la nationalisation de la zone du canal de Suez, les Britanniques et les Français déclarent la guerre au gouvernement égyptien pour l'obliger à restituer ses possessions"
 news.206.a:0 "Une évolution inquiétante"
 news.206.b:0 "Alors c'est la guerre !"
 news.206.c:0 "En avant vers la victoire"
 news.206.e:0 "En avant vers la victoire"
 news.207.d:0 "Après la nationalisation du canal de Suez, les Britanniques ont choisi de déclarer la guerre à l'Égypte pour reprendre seule la zone du canal de Suez."
 news.208.t:0 "Israël rejoint la guerre contre l'Égypte" 
 news.208.d:0 "Après des pourparlers secrets en cours avec les Britanniques et les Français, Israël a déclaré la guerre et lancé des attaques contre l'Égypte"
 egypte.10.t:0 "Invitation aux Républiques Arabes Unis"
 egypte.10.d:0 "[FROM.GetNameDef] nous invite à rejoindre les Républiques Arabes Unis. Cela signifie qu'ils annexeront notre territoire et formeront la nouvelle nation sous leur commandement. Une telle collaboration pourrait être utile en ces temps difficiles, mais voulons-nous vraiment abandonner nos terres ?"
 egypte.10.a:0 "Oui, nous nous joindrons."
 egypte.10.b:0 "Non, nous restons indépendants !"
 egypte.11.d:0 "    Depuis que le gouvernement révolutionnaire et le drapeau de la liberté ont flotté sur Damas, les sionistes se battent contre nos frères arabes dans le Golan. Maintenant que les Arabes renforcent lentement leur position non seulement pour lutter contre la menace sioniste mais aussi pour promulguer la libération des terres arabes en Palestine elle-même, les sionistes se tournent vers Damas pour renverser le gouvernement hostile. Pour cette raison, nous devons remilitariser le Sinaï immédiatement pour dissuader les sionistes de prendre des mesures contre nous."
 farouk_gang.1.d:0 "Le roi Farouk a annoncé aujourd'hui que toutes les voitures rouges en Égypte seraient interdites avec effet immédiat et que lui seul serait autorisé à en posséder. Les seules exceptions sont les jeeps militaires, peintes en rouge, qui voyagent dans le cadre de l'entourage du roi.\nLe roi est connu pour sa flotte de voitures coûteuses, dont une Bentley Mark VI rouge vif de 1947 et une Mercedes Benz 540K rouge qui était un cadeau d'Adolf Hitler.\nDe nombreux fidèles du roi Farouk ont salué la loi stipulant que le roi devrait être le seul à être digne d'utiliser de tels véhicules. Des opposants anonymes ont critiqué la loi, la qualifiant de « absolument insensée » et de « complètement dénuée de sens ». Plusieurs individus sont venus à l'entretien anonyme simplement pour déclarer que le roi avait crevé leurs pneus alors qu'ils tentaient de le dépasser. Le roi a qualifié ces accusations de « non prouvées »."
 farouk_gang.2.d:0 "La princesse Fathia a été bannie d'Egypte après une liaison avec Riyad Ghali. Récemment, il est devenu public que Riyad Ghali, conseiller royal du roi d'Égypte, a proposé à la princesse Fathia d'Égypte. Malgré les fortes objections du roi Farouk, le mariage a eu lieu à l'hôtel Fairmont de San Francisco. Il a également été révélé qu'ils se sont tous deux convertis au catholicisme et envisagent de vivre ensemble. En réponse, le roi Farouk a annoncé que la princesse Fathia serait bannie d'Égypte et excommuniée. Tous leurs biens encore en Égypte ont été confisqués par l'État."
 farouk_gang.3.d:0 "Le roi revient de son voyage diplomatique en France. Selon lui, le voyage a été fructueux et améliorera sûrement les relations entre l'Egypte et la France. Cependant, des sources anonymes affirment que le voyage a été un échec retentissant. Tout d'abord, lors de la soirée officielle organisée à Paris, Farouk aurait volé des montres, des portefeuilles et des briquets. Puis, pendant son temps libre, il s'est livré à un jeu déchaîné de 70 heures, au cours desquelles il aurait perdu 150 000 dollars, s'est saoulé et a agressé une femme parce qu'elle ne couchait pas avec lui. Bien sûr, tout cela ne sont que des rumeurs et sûrement inventées par quelqu'un de jaloux du roi."
 farouk_gang.4.d:0 "Le roi revient tout juste de son voyage en France. Farouk et son entourage composé de son \"armoire de cuisine\", de 30 gardes du corps albanais, de divers secrétaires et médecins égyptiens, de dégustateurs soudanais et de divers autres adeptes ont parcouru la campagne française dans une colonne de 7 Cadillac entourés de gardes du corps à moto et d'un avion survolant avec l'ordre d'atterrir au cas où Farouk voudrait voler à la place. Au casino, il a gagné environ 40 millions de marcs. Il fait ensuite la traversée jusqu'à Saint-Sébastien en Espagne pour assister à un festival de cinéma avec quatre \"de ses dames du moment\". La prochaine étape de Farouk était Cannes, où il a participé à une partie de baccara à 80 000 $ au casino de Palm Beach avec des personnalités telles que le magnat hollywoodien Jack L. Warner et l'industriel britannique Myers Hyman. Hyman a remporté la partie, puis est rapidement décédé d'une crise cardiaque, ce qui a fait la une des journaux tels que \"Lucky Mickie bat Farouk et meurt !\""
 nasser_execution.1.d:0 "La traque de Nasser est enfin terminée. Après une longue et ardue chasse à l'homme, la police égyptienne a retrouvé le traître Nasser détenu dans une cellule du Caire. Après avoir établi le blocus, la garde soudanaise a été appelée pour arrêter Nasser et tuer les défenseurs du bâtiment. Nasser a été amené devant le roi Farouk où il a subi un procès juste et équitable pour ses crimes. Il fut finalement décidé que son crime devait être puni de la peine capitale et fut exécuté par strangulation personnellement par le roi Farouk."
 sudan_part.1.d:0 "La lutte contre la domination britannique a plongé la région soudanaise dans un terrible conflit. Notre noble Roi Farouk désireux de maintenir l'ordre et la paix, a établi une mission de maintien de la paix. Ne voulant pas contribuer au conflit, les forces égyptiennes ont construit des garnisons et des quartiers généraux administratifs pour assurer l'ordre. Après 4 ans, le conflit a finalement pris fin avec le retrait de la garnison coloniale britannique et les forces soudanaises presque épuisées. Parce que la seule force soudanaise organisée restante reste dans le sud, le roi Farouk a établi son contrôle sur la région soudanaise anarchique. Le gouvernement sud-soudanais a adressé une protestation officielle au roi à ce sujet, mais le roi Farouk a répondu en déclarant qu'il n'était pas en état de gouverner le nord ravagé. Le roi Farouk a ouvertement admis au peuple égyptien qu'il n'était même pas sûr que le Soudan du Sud soit un gouvernement fonctionnel dans son état actuel. Il envisage actuellement d'envoyer des soldats de maintien de la paix dans le Sud pour y rétablir l'ordre."
 farouk_exiled.1.d:0 "Le nouveau régime égyptien a rapidement décidé de vendre aux enchères la vaste collection de trésors du roi, y compris sa suite de sept pièces. Parmi ses possessions les plus célèbres se trouvait l'une des rares pièces de monnaie Double Eagle de 1933. La révélation selon laquelle Farouk possédait l'une des plus grandes collections de pornographie au monde a suscité beaucoup d'intérêt, puisqu'il possédait une vaste collection comptant des centaines de milliers de photographies pornographiques, de cartes postales, de calendriers, de cartes à jouer, de montres, de lunettes, de tire-bouchons, etc. L'obsession de Farouk pour la collection s'étendait également aux diamants, aux chiens, aux timbres, aux rubis, aux oeufs de Fabergé, aux anciennes pièces de monnaie tibétaines, aux armures médiévales, aux bouteilles d'aspirine, aux lames de rasoir, aux trombones et aux compteurs Geiger. Au palais de Koubbeh, on a découvert que Farouk avait rassemblé 2 000 chemises en soie, 10 000 cravates en soie, 50 cannes dorées serties de diamants et un portrait dédicacé d'Adolf Hitler."
 Free_Officer_Coup.1.d:0 "Le coup d'État des officiers libres vient de réussir au Caire et va aboutir à l'expulsion du roi Farouk du pays. Apprenant que les Officiers Libres préparaient un coup d'État, le roi Farouk ordonna leur arrestation. Cependant, les officiers libres ont pris connaissance de cet ordre et ont décidé de lancer une attaque préventive et d'échapper à l'arrestation. Incapable d'arrêter les officiers libres, le roi Farouk a obtenu l'aide de la fidèle garde soudanaise pour fortifier son palais. Dans la soirée, les officiers libres assiègent et attaquent. Ils ne purent briser les fortifications du palais et furent contraints de se replier. Le roi Farouk lui-même a tué 4 assaillants avec son fusil de précision depuis une embrasure de fortune sur son balcon. Le lendemain, des renforts blindés arrivent pour les Officiers Libres. Les officiers libres lancent un ultimatum au roi Farouk pour qu'il se rende, menaçant de détruire le palais avec l'artillerie. N'ayant aucun moyen de détruire les renforts, le roi Farouk se rendit."
 free_officer_fail.1.d:0 "Après un bref siège, les officiers libres décidèrent de lancer un assaut sur le palais du roi Farouk et de sécuriser le pays. Le roi était gardé par environ 800 gardes soudanais bien équipés. Le roi Farouk, un tireur d'élite expert, a participé à la défense, tuant environ 16 assaillants alors qu'ils pénétraient dans l'enceinte du palais. Les officiers libres, désespérés de maintenir l'offensive et de tuer le roi, décidèrent de ne pas se retirer. Cependant, cela a rendu leurs forces vulnérables et a subi de lourdes pertes. Les attaquants étant affaiblis, le roi Farouk ordonna une contre-attaque contre la force des officiers libres désormais désorganisée et gravement affaiblie. Finalement, près d'une trentaine d'officiers libres se rendirent mais ils furent sommairement exécutés. Le roi Farouk a déclaré l'état d'urgence et a appelé les patriotes égyptiens à retrouver Gamal Abdel Nasser, l'un des dirigeants des officiers libres qui a échappé à la contre-attaque. Les analystes s'attendent à ce que le roi purge les nationalistes au sein de l'armée et renforce l'appareil de sécurité."
 Sudan.1.d:0 "Après que la révolution de 1952 en Égypte ait empêché les forces britanniques d'atteindre le Soudan, le Soudan a pu se rebeller contre le Royaume-Uni et obtenir facilement son indépendance. Cependant, tout n'est pas heureux dans la région soudanaise. Il existe un niveau considérable de fractionnement politique et d'énormes divisions idéologiques et ethniques dans le pays. Le nouveau gouvernement soudanais ne peut même pas décider de la manière de le composer ou d'une manière équitable de décider lequel dirigera le pays. Les problèmes les plus urgents incluent le manque de fonctionnaires, le manque d'industrialisation pour soutenir la nation indépendante, la rébellion dans le Sud et bien d'autres problèmes. Si le pays ne parvient pas à résoudre ces problèmes, il pourrait connaître de graves problèmes dans les années à venir."
 abolish_mon_egy.1.d:0 "Le gouvernement de transition égyptien a aboli la monarchie. Le règne du fils du roi Farouk, le roi Faud II, fut de très courte durée car sa nomination n'était qu'une ruse pour apaiser les Britanniques. Gamal Abdel Nasser a été nommé vice-Premier ministre et le général Naguib a été nommé premier président. Avec l'abolition de la monarchie est venue la nouvelle Constitution de la République d'Égypte. La Constitution a promis la laïcité et les droits civiques.\nIl existe cependant de nombreux individus fidèles au roi qui sont en colère de ne plus recevoir d'avantages et de butin du roi. Plus en colère que les anciens officiers et loyalistes, les Frères musulmans sont farouchement opposés à la laïcité de la nouvelle république et pourraient causer des problèmes à la république nouvellement fondée s'ils ne sont pas traités."
 egy_trial.1.d:0 "Les officiers royaux, officiers militaires fidèles au roi, sont jugés pour collusion dans des crimes contre l'Égypte. Les accusations portent notamment sur la corruption en général et l'abus de pouvoir, mais de nombreux agents sont traduits en justice pour des délits spécifiques tels que la brutalité ou le vol direct. Les procès dureront longtemps et les affaires plus complexes, où les preuves sont difficiles à rassembler, dureront probablement des mois. Certains officiers ont déjà tenté de fuir le pays pour échapper à d'éventuelles sanctions."
 egy_rioting.1.d:0 "Après des mois d'incendies, les Frères islamiques participent actuellement à une émeute massive à l'échelle de l'État. Les Frères islamiques ont, depuis la première rédaction de la Constitution égyptienne, méprisé la République nouvellement fondée. Leurs principales plaintes sont la laïcisation du pays et la libéralisation de la foi musulmane dans le contexte politique du gouvernement. De nombreux théoriciens de premier plan tels que Sayyid Qutb ont publié des ouvrages déclarant que l'Égypte n'est plus islamique et que l'État doit être renversé. Les émeutiers ont déjà pris le contrôle de régions clés dans plusieurs villes égyptiennes et détruisent en masse les biens gouvernementaux. Les forces de sécurité gouvernementales affrontent violemment les émeutiers dans les rues."
 egy_suez_funding.1.d:0 "Le haut barrage d'Assouan a finalement reçu un financement et sera construit sur le Nil. Le barrage devrait s'étendre sur environ 3 800 mètres et atteindre une hauteur considérable d'environ 110 m. Le barrage soutiendra l'industrialisation grâce à son électricité, contrôlera les inondations, fournira des infrastructures hydrauliques et irriguera les terres agricoles sur de grandes distances. De plus, le barrage créera un lac qui a été prématurément nommé « Lac Nasser » en hommage au leader révolutionnaire. Actuellement, le gouvernement égyptien commence à recruter et à sous-traiter massivement afin d'accumuler la main-d'oeuvre et les ressources nécessaires à la construction du barrage, maintenant que le financement a été assuré."
 farouk_gang.10.d:0 "Naguib el-Rihani, le père de la comédie égyptienne, est mort du typhus, alors qu'il tournait son dernier film, \"Ghazal Al Banat\", à l'âge de 60 ans au Caire. Il est né à Bab El Shereya, au Caire, d'un père irakien chaldéen de la ville de Mossoul en Irak du nom d'Elias El Rihani qui a travaillé comme expert et commerçant de chevaux et s'est finalement installé au Caire, où il a rencontré et épousé la mère de Naguib, une copte égyptienne du Caire. Naguib a fait ses études à l'école française \"Les Frères\" du Caire.\nIl fonde sa propre troupe de théâtre à la fin des années 1910, au Caire, et s'associe à son ami de toujours, Badeih Khairy, pour adapter plusieurs succès du théâtre français sur la scène égyptienne, puis au cinéma. El-Rihani a eu un mariage mouvementé avec Badia Masabni, une actrice et danseuse levantine. Ils se sont séparés avant sa mort."
