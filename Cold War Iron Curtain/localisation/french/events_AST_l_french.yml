 WorldAST.1.t: "[GetNewspaperHeader]Grève des mineurs de charbon en Australie"
 WorldAST.1.desc: "Les mineurs de la classe ouvrière australienne ont déclenché une grève, immobilisant le pays dans une impasse. Considérée comme une continuation des troubles provoqués par la grève des cheminots de l'année précédente dans l'État du Queensland, la lutte des mineurs pour de meilleurs salaires et des congés de longue durée ne leur a laissé d'autre choix que d'appliquer les mesures nécessaires.\n\nCela n'est pas sans interférence extérieure potentielle, dans la mesure où la Fédération des mineurs est considérée comme fortement influencée par la politique du Kominform de l'Union soviétique. La promotion d'un conflit de classes pour promouvoir la direction communiste de la lutte de la classe ouvrière contre le gouvernement actuel de l'ALP.\n\nEn réponse, les responsables syndicaux ont reçu l'ordre de remettre les fonds syndicaux au registraire industriel, et une législation a été adoptée interdisant l'octroi d'un soutien financier aux grévistes et à leurs familles."
 WorldAST.1.a: "La main de Chifley a-t-elle été forcée ?"
 
 WorldAST.2.t: "[GetNewspaperHeader]La grève australienne se termine enfin"
 WorldAST.2.desc: "Les deux mois tumultueux de grèves et de combats des mineurs australiens sont officiellement terminés. Le gouvernement Chifley n'a vu d'autre choix que de déployer des troupes pour briser la grève du charbon, par des moyens violents et souvent brutaux pour mettre fin à la crise. Des troupes ont même été déployées dans les mines elles-mêmes pour se contenter de travailleurs intérimaires et permettre au pays de continuer à fonctionner dans sa phase de reconstruction d'après-guerre.\n\nLa décision d'autoriser ces opérations militaires n'a pas été sans examen, car la détermination anticommuniste du gouvernement est apparue insuffisante dans l'esprit de nombreux Australiens. Bien qu'apparemment vaincu, le communisme reste un facteur suffisamment influent au sein de la classe ouvrière, au point que beaucoup envisagent de voter pour la coalition Menzies lors des prochaines élections.\n\nMême s'il reste à savoir si Chifley a pris la bonne décision, le charbon commence à circuler normalement."
 WorldAST.2.a: "La fin du chaos de la classe ouvrière."
 
 WorldAST.3.t: "[GetNewspaperHeader]Chifley et l'ALP réélus"
 WorldAST.3.desc: "Le Parti travailliste australien a remporté sa troisième élection consécutive, le total de victoires de Chifley atteignant désormais 2. Même à la suite de la grève des mineurs de charbon influencée par les communistes, cela n'a pas suffi à dissuader les électeurs de la classe ouvrière de voter à nouveau pour le parti travailliste. Même avec une majorité réduite à la Chambre.\n\nLes années d'après-guerre sous Chifley ont vu une augmentation significative de nouveaux migrants affluant d'une Europe déchirée par la guerre, y compris de Grande-Bretagne. Il reste à la nation de voir s'il tiendra sa promesse de mettre fin au rationnement du carburant et de la nourriture en temps de guerre.\n\nAlors que le gouvernement travailliste a tenu bon, des questions vont désormais être posées à Robert Menzies, toujours chef de l'opposition. Et comment il parviendra à maintenir la direction du parti qu'il a fondé avec ses principes, s'il ne parvient pas à les mener à une victoire électorale."
 WorldAST.3.a: "Le train Chifley continue sa route."
 
 WorldAST.4.t: "[GetNewspaperHeader]La coalition remporte les élections de 1949"
 WorldAST.4.desc: "Le peuple australien a une fois de plus voté pour Robert Menzies comme Premier ministre. Bien qu'il ait perdu son leadership en tant que chef du parti UAP en 1941, Menzies a réussi à revenir du désert. Former le Parti libéral à partir de 14 partis différents en 1945, pour remporter seulement 26 des 74 sièges trois ans auparavant.\n\nDéfenseur de la libre entreprise et fervent anticommuniste, Menzies a réussi à reconfigurer la Coalition contre les « mesures socialistes » de Chifley, après que l'intention de l'ancien Premier ministre de nationaliser les banques sous le contrôle strict du gouvernement ait perdu le soutien de nombreux sièges clés. Un discours détaillé sur les transactions financières secrètes de Chifley devant ses amis personnels, par un ancien Premier ministre de l'État, un certain Jack Lang, a certainement aidé Menzies.\n\nLe gouvernement travailliste de huit ans dirigé par Chifley et auparavant feu John Curtin a pris fin, le nouveau règne du gouvernement conservateur commence."
 WorldAST.4.a: "Plus jamais oublié."
 
 WorldAST.5.t: "[GetNewspaperHeader]Menzies et la coalition réélus"
 WorldAST.5.desc: "Le Premier ministre Robert Menzies a mené avec succès la Coalition à une deuxième victoire électorale consécutive, la Coalition remportant également six sièges au Sénat, leur donnant finalement le contrôle majoritaire dans les deux chambres du Parlement.\n\nAlors que la menace du communisme augmentait dans de nombreux pays occidentaux, Menzies a cherché à interdire le Parti communiste australien par le biais d'une législation. Étonnamment, le chef de l'opposition, l'ancien Premier ministre Ben Chifley, a laissé passer le projet de loi après une nouvelle rédaction, qui a été rejeté par la Haute Cour. Quelques mois après cette tentative ratée, Menzies a fait adopter le projet de loi sur la Banque du Commonwealth, visant à établir un « Conseil de la Banque du Commonwealth » qui, selon les travaillistes, serait rempli d'intérêts bancaires privés. N'ayant pas réussi à passer par le Sénat, Menzies a vu une opportunité de demander une double dissolution. Une décision risquée, étant donné que les élections auraient pu se retourner contre un autre gouvernement travailliste.\n\nCe n'est pas le cas, et le pari de Menzies s'est avéré payant."
 WorldAST.5.a: "Lutte contre la menace communiste."
 
 WorldAST.6.t: "[GetNewspaperHeader]Le chef de l'opposition est décédé"
 WorldAST.6.desc: "Des nouvelles tragiques arrivent de la capitale australienne. Joseph Benedict Chifley, l'actuel chef de l'opposition et ancien Premier ministre, est décédé subitement d'une crise cardiaque dans sa chambre d'hôtel à Canberra. Il avait 65 ans.\n\nL'ancien conducteur de moteur a eu une carrière politique réussie, passant du statut de star éminente du mouvement syndical à celui de ministre de la Défense de l'ancien Premier ministre James Scullin, en poste pendant moins d'un an. Il lui faudra attendre 9 ans, jusqu'en 1940, avant d'être réélu à la Chambre des représentants, se retrouvant trésorier sous John Curtin, avant de devenir bientôt Premier ministre à part entière. Même pendant la Seconde Guerre mondiale, il a réalisé de nombreuses réalisations législatives et a introduit la première voiture artisanale d'Australie, la Holden 48-215. La spéculation a amené beaucoup de gens à croire que H.V. Evatt lui succédera à la tête du parti.\n\nLa rumeur dit qu'il sera enterré au cimetière de Bathurst d'ici un mois."
 WorldAST.6.a: "La lumière sur la colline s'estompe très légèrement aujourd'hui."
 
 WorldAST.7.t: "[GetNewspaperHeader]Un officier espion soviétique fait défection en Australie"
 WorldAST.7.desc: "La mort de Joseph Staline a vu la structure du pouvoir politique de l'Union soviétique se transformer et changer. Grâce à cela, un colonel de la police secrète soviétique a vu son homme « Beria » perdre le jeu du pouvoir et a donc fui vers l'Australie.\n\nAprès avoir promis à l'agence d'espionnage australienne ASIO l'espionnage soviétique en échange de l'asile politique, elle a suscité une controverse après l'autre. Les événements dramatiques des violentes manifestations anticommunistes à l'aéroport de Sydney ont été redistribués dans le monde entier, puisque l'épouse de Petrov, Evdokia, a été escortée de force jusqu'à un avion vers l'Union soviétique, avant d'être arrêtée à l'aéroport de Darwin après avoir fait le plein. Les contre-interrogatoires d'une commission royale impliquaient le chef du parti ALP, le Dr H.V. Evatt, allègue que « les juges de la commission ont fait preuve de parti pris en faveur du gouvernement Menzies à la suite de ce déni sans précédent de son droit de comparaître ».\n\nL'ambassade d'Australie à Moscou a depuis été expulsée, tandis que les diplomates soviétiques à Canberra ont été rappelés d'urgence."
 WorldAST.7.a: "Les relations diplomatiques soviétiques et australiennes sont rompues."
 
 WorldAST.8.t: "[GetNewspaperHeader]La Coalition et Menzies réélus en 1954"
 WorldAST.8.desc: "Les votes ont été comptés lors des élections australiennes de 1954. Il semble que, dans l'atmosphère tendue du drame anticommuniste, Robert Menzies ait été réélu. Il s'agit désormais de la troisième victoire électorale consécutive de la Coalition.\n\nLa complication d'un attaché de l'ambassade soviétique, un officier espion Vladimir Petrov, et sa décision de quitter l'Union soviétique après le passage de la structure du pouvoir de leur pays à un nouveau dirigeant, ont provoqué une tempête de publicité dans le pays. Cela fait suite aux événements survenus trois ans auparavant, suite à la tentative ratée de Menzies d'interdire le Parti communiste australien. Le nouveau chef du parti ALP, le Dr H.V. Evatt, avec ses promesses ambitieuses et son CV impressionnant, n'a pas obtenu suffisamment de sièges pour renverser la Coalition. Menzies a fustigé avec succès les promesses de dépenses extravagantes d'Evatt, les qualifiant de « l'attaque la plus meurtrière contre la stabilité de l'Australie ».\n\nLes travaillistes sont désormais potentiellement en train de se battre entre eux après cette défaite électorale, car le contingent anticommuniste de droite au sein du parti a apparemment perdu confiance en Evatt lui-même."
 WorldAST.8.a: "L'anticommunisme se renforce, l'ALP s'affaiblit."
 
 WorldAST.9.t: "[GetNewspaperHeader]Le parti travailliste australien se divise"
 WorldAST.9.desc: "Les nouvelles en provenance de Victoria, en Australie, ont stupéfié la nation. L'exécutif de l'État de l'ALP de Victoria a expulsé 11 membres de son propre parti, traversant le parquet pour soutenir la motion de censure d'Henry Bolte. Le Parti libéral de Victoria apparaît désormais comme le principal favori des prochaines élections dans l'État.\n\nCela fait suite au chef de l'opposition fédérale, le Dr Herbert Vere Evatt, et à sa dénonciation des Groupers, représentants des syndicats catholiques de droite, et de B.A. Santamaria, la force dominante du mouvement catholique d'études sociales. Evatt a blâmé « une petite minorité de membres, situés en particulier dans l'État de Victoria » après la défaite du parti travailliste aux élections de 1954. Et la complication de l'affaire Petrov dans laquelle Evatt a défendu une union des communistes sous le prétexte des « libertés civiles », contre le maccarthysme convaincu de Menzies. Ce faisant, nous chassons les plus fervents groupes d'anticommunistes du parti.\n\nL'expulsion de l'ALP s'est également appliquée à la Chambre fédérale des représentants. Le gouvernement Menzies se trouve clairement en position de renforcer son emprise au pouvoir."
 WorldAST.9.a: "Quelles seront les conséquences à long terme ?"
 
 WorldAST.10.t: "[GetNewspaperHeader]4 Victoires consécutives pour Menzies"
 WorldAST.10.desc: "Les retombées politiques de la scission du parti travailliste en Australie ont vu le parti subir un coup dur lors des dernières élections nationales. Les Groupers, anciennement membres de l'ALP, ont désormais fondé leur propre parti sous le nom de parti « travailliste anticommuniste ». Bien qu'ils n'aient pas réussi à remporter de siège à la Chambre des représentants, tout en gérant quelques sièges au Sénat, ils ont réussi à retirer des sièges clés aux travaillistes dans le processus, accordant ainsi à Robert Menzies et à la Coalition une quatrième victoire électorale. \n\nLa double dissolution réclamée une fois de plus par Menzies a vu sa position dans la nation se renforcer, et la direction de son parti est incontestablement la sienne. Alors qu'il continue de maintenir son engagement en faveur d'un monde libre et débarrassé du communisme, nombreux sont ceux qui se demandent si ce revers désastreux pour l'ALP aidera un jour le parti à se remettre des blessures qu'il s'est lui-même infligées."
 WorldAST.10.a: "La Coalition reste en selle."
 
 WorldAST.11.t: "[GetNewspaperHeader]Menzies et la Coalition remportent leur 5e élection"
 WorldAST.11.desc: "Le peuple australien a pris sa décision de voter pour ses circonscriptions. La Coalition dirigée par Menzies est, une fois de plus, revenue au pouvoir, même au milieu d'une récession mondiale majeure. Lors de la première élection où les campagnes ont été menées en utilisant la télévision comme moyen de communication avec les électeurs, le Premier ministre Robert Menzies s'est révélé être un acteur télévisuel confiant et plus efficace que ses adversaires H.V. Evatt et Arthur Calwell. De nombreux experts contribuent à leur réélection.\n\nLe parti travailliste anticommuniste dissident s'est désormais transformé en Parti travailliste démocrate, remportant toujours un tiers des voix dans de nombreux sièges travaillistes clés autrefois sûrs, ce qui garantit la défaite de l'ALP aux élections. Beaucoup considèrent que la position d'Evatt en tant que leader est compromise et se demandent si un défi de leadership est bientôt en cours."
 WorldAST.11.a: "Chanceux numéro cinq !"
 
 WorldAST.12.t: "[GetNewspaperHeader]Une fin serrée aux élections australiennes de 1961"
 WorldAST.12.desc: "Dans un retournement de situation choquant, Robert Menzies a été réélu pour la 6ème fois, de justesse. Bien qu'il s'agisse de la 6e victoire électorale de la Coalition, elle était presque trop serrée pour être remportée et aurait pu se dérouler dans un sens ou dans l'autre.\n\nCette mince majorité était le résultat d'une décision économique de « resserrement du crédit », mettant fin au système illibéral de licences d'importation, dans un pays où les choix des consommateurs étaient restreints par le protectionnisme, conduisant à une poussée des importations qui a dépassé toutes les attentes et qui a miné la balance des paiements et les réserves de dollars américains de l'Australie. La correction excessive du gouvernement a conduit à une récession mineure, suffisamment pour inquiéter de nombreuses personnes dans le pays.\n\nSous la direction du nouveau leader de l'ALP, Arthur Calwell, le parti travailliste a placé la question du chômage au premier plan. De nombreux journaux ont vu leur soutien se déplacer vers l'ALP et s'éloigner de la Coalition. Malheureusement pour les travaillistes, ce changement n'a pas suffi à leur permettre de gagner."
 WorldAST.12.a: "La Peur a été repoussée, tout juste."
 
 WorldAST.13.t: "[GetNewspaperHeader]La coalition remporte les élections de 1963, 7e victoire"
 WorldAST.13.desc: "desc"
 WorldAST.13.a: "L'Australie sera défendue."
 
 WorldAST.14.t: "[GetNewspaperHeader]Robert Menzies démissionne"
 WorldAST.14.desc: "Une durée record de 16 ans et 1 mois touche à sa fin. Sir Roberts Menzies a décidé de se retirer, décrivant lors d'une conférence de presse son usure après toutes ces années, et commence à se retirer dans la vie privée. Les partis communs de la Coalition se sont réunis hier matin, dans les 45 minutes, pour annoncer sa retraite.\n\nHarold Holt, 57 ans, a prêté serment pour lui succéder à l'unanimité. Alors que la nation attend la formation du gouvernement, Holt reste fidèle à son engagement anticommuniste et à ses relations étroites avec les États-Unis. Après un vote de 40 minutes, William McMahon a été élu de justesse député du Parti libéral."
 WorldAST.14.a: "Holt va-t-il ramener la Coalition à la nage vers la sécurité ?"
 
 WorldAST.15.t: "[GetNewspaperHeader]Holt envisage la coalition pour un 8e mandat consécutif"
 WorldAST.15.desc: "La coalition libérale-pays a remporté sa huitième victoire électorale consécutive. Sous la direction du nouveau Premier ministre Harold Holt, après le départ à la retraite de son prédécesseur en janvier, la Coalition a réussi à obtenir une plus grande majorité à la Chambre. Son engagement anticommuniste et ses relations étroites avec les États-Unis ont convaincu une plus grande partie des électeurs que le Parti libéral est toujours le bon choix pour diriger le pays.\n\nLe Parti travailliste, en revanche, retourne à la planche à dessin pour se demander où tout s'est mal passé. Le chef de l'opposition Arthur Calwell a vu son refus d'intervenir dans les pays étrangers situés aux frontières étroites de l'Australie l'avoir qualifié de sympathisant communiste, même si son refus de changer sa conviction de la politique de l'Australie blanche comme une nécessité n'a pas gagné la nation presque entièrement blanche à ses côtés. Son leadership, après trois défaites électorales consécutives, semble sérieusement mis en doute."
 WorldAST.15.a: "Swimmin' Suave pendant encore 3 ans."
 
 WorldAST.16.t: "[GetNewspaperHeader]Premier ministre perdu en mer"
 WorldAST.16.desc: "Une tragédie a frappé l'Australie, le Premier ministre Harold Holt ayant été signalé perdu en mer. Vu pour la dernière fois à Cheviot Beach à Portsea, la plus grande opération de recherche jamais menée dans l'histoire du pays n'a abouti à rien, après une journée entière de recherche qui n'a donné aucun résultat. Le gouverneur général Lord Casey ne voyait pas d'autre option que de mettre fin à la commission de Holt. Un service commémoratif aura lieu à la cathédrale Saint-Paul, en présence de nombreux dirigeants mondiaux.\n\nL'amour de Holt pour l'océan et la pêche sous-marine semble l'avoir rattrapé dans les circonstances les plus horribles. On sait pour la dernière fois qu'il était en bonne santé physique et mentale. Alors que la nation est en deuil sous le choc, le vice-premier ministre John McEwen a été élu premier ministre par intérim, alors que le Parti libéral et la coalition auront du mal à trouver un nouveau chef. On suppose que Paul Hasluck et le sénateur John Gorton seraient les principaux candidats."
 WorldAST.16.a: "L'océan a-t-il emporté une autre âme malheureuse ?"
 
 WorldAST.17.t: "[GetNewspaperHeader]Gorton choisi comme successeur de Holt"
 WorldAST.17.desc: "Le court mandat de Premier ministre par intérim de John McEwen est maintenant terminé, le sénateur John Gorton ayant remporté la course à la direction qui a suivi la disparition mystérieuse et tragique de Holt. Il a reçu le soutien de nombreux membres du parti, dont le ministre de l'Armée Malcolm Fraser, pour vaincre 3 candidats à ce poste. Seul sénateur de l'histoire de l'Australie à devenir Premier ministre, Gorton a en peu de temps fait beaucoup pour se distinguer de ses prédécesseurs.\n\nIl a déclaré qu'il poursuivrait une politique de défense et étrangère indépendante, tout en éloignant son pays de ses liens traditionnels avec la Grande-Bretagne. Ses politiques centralistes se sont déjà retrouvées à l'écart des puissants dirigeants d'État libéraux. Le temps nous dira si sa nouvelle façon de penser, à contre-courant du grain traditionaliste du Parti libéral, fera de son ministère un succès ou un échec."
 WorldAST.17.a: "Un flair larrikin dirige désormais la nation."
 
 WorldAST.18.t: "[GetNewspaperHeader]Gorton et la coalition réélus"
 WorldAST.18.desc: "Une neuvième victoire consécutive aux élections générales pour la Coalition n'a pas entièrement été la victoire qu'elle recherchait, puisque le Premier ministre récemment nommé, John Gorton, n'a obtenu qu'une majorité de 6 sièges à la Chambre, en perdant 16 autres dans le processus. Les avancées du chef de l'opposition Gough Whitlam dans la reconquête du vote catholique perdu avec le DLP se sont avérées fructueuses, car l'ALP s'est retrouvé dans une position beaucoup plus forte que sous Calwell.\n\nGorton a acquis la réputation d'être erratique et inutilement conflictuel. Ses tentatives visant à modifier les politiques de longue date du Parti libéral en ce qui concerne les pouvoirs fédéraux et les affaires étrangères avaient aliéné les sections les plus conservatrices de son propre parti. Des rumeurs ont commencé sur la durée potentielle de son mandat."
 WorldAST.18.a: "Le règne de la Coalition continue, pour le moment."
 
 WorldAST.19.t: "[GetNewspaperHeader]Déversement de leadership en Australie, McMahon nouveau Premier ministre"
 WorldAST.19.desc: "Le Parti libéral a officiellement perdu confiance en son actuel premier ministre, John Gorton. Après avoir obtenu une égalité lors d'un vote de censure, Gorton a choisi de voter contre lui-même, réalisant que le soutien au sein du parti a considérablement diminué depuis qu'il est devenu Premier ministre. Le nouvel homme choisi après de nombreux débats houleux est William McMahon, un défenseur du libre marché jouissant d'une solide réputation en matière de gestion économique. Il arrive malheureusement à un moment où l'inflation augmente, alors que la Coalition est considérée comme fatiguée et floue après 22 ans au pouvoir.\n\nAu-delà de la Coalition, le nouveau Premier ministre devra faire face à la résurgence de l'ALP sous la direction de Gough Whitlam, alors que l'opposant de McMahon plaide en faveur de politiques d'assurance maladie populaires, pour contraster avec les luttes intestines amères de la Coalition."
 WorldAST.19.a: "Ses grandes oreilles montreront-elles la voie ?"
 
 WorldAST.20.t: "[GetNewspaperHeader]Whitlam et l'ALP remportent les élections de 1972"
 WorldAST.20.desc: "Le long règne de la coalition dirigée par le Parti libéral a enfin pris fin. Des années de luttes intestines et de dirigeants incompétents ont fait perdre des électeurs, principalement dans les sièges de banlieue, au profit du Parti travailliste australien après 23 ans. Gough Whitlam devient désormais le nouveau Premier ministre australien, avec son slogan de campagne électorale « It's Time » qui a séduit de nombreux électeurs influents, ainsi que par ses nouvelles politiques radicales qu'il promet de mettre en oeuvre.\n\nEn s'engageant à mettre fin à la conscription, à libérer les réfractaires, à un régime d'assurance maladie universelle (accompagné d'une surtaxe sur le revenu) et à éliminer les frais de scolarité universitaires, il n'est pas étonnant que de nombreux Australiens aient voté pour une nouvelle façon de penser un parti longtemps considéré comme vieux et lavé. Aujourd'hui, l'ancien Premier ministre McMahon a été témoin de bon nombre de ses propres problèmes causés par lui-même. Cela ne s'est pas entièrement déroulé dans le sens de Whitlam, car les travaillistes ne disposent toujours pas de la majorité sénatoriale requise pour adopter la législation comme ils l'entendent. Pourtant, l'avenir de l'Australie reste néanmoins passionnant."
 WorldAST.20.a: "Il est temps !"
 
 WorldAST.21.t: "[GetNewspaperHeader]Gough réélu lors de la dissolution de 1974"
 WorldAST.21.desc: "La récente récession économique mondiale a tout de même affecté l'Australie, comme le Premier ministre récemment réélu Whitlam le sait sans doute, car son propre désir d'augmenter les salaires et les conditions de la fonction publique du Commonwealth en tant que leader du secteur privé ne pouvait pas arriver à un pire moment. Y compris un récent incident au Sénat, qui a provoqué l'échec du projet rapide de Whitlam d'obtenir une majorité au Sénat grâce à un sénateur DLP partant pour un poste diplomatique, l'ALP a vu sa majorité à la Chambre anéantie, mais elle reste toujours au pouvoir.\n\nLe chef de l'opposition, Billy Snedden, n'a pas considéré son leadership comme efficace, son plan visant à bloquer le projet de loi de crédits du gouvernement au Sénat ne s'est pas déroulé comme de nombreux membres du parti le pensaient. Il existe de nombreuses rumeurs internes au sein du Parti libéral qui pourraient faire de Malcolm Fraser leur nouveau chef."
 WorldAST.21.a: "Les travaillistes et Whitlam survivent, à un certain prix."
 
 WorldAST.22.t: "[GetNewspaperHeader]Premier ministre démis de ses fonctions"
 WorldAST.22.desc: "Un moment choquant s'est produit en Australie. Le gouverneur général en titre, John Kerr, a décidé de destituer Gough Whitlam de son poste de Premier ministre et de nommer Malcolm Fraser à titre intérimaire. Cela se produit après que Fraser et la Coalition ont menacé de suspendre les crédits en reportant l'examen des projets de loi de crédits. La crise constitutionnelle potentielle a poussé la Coalition à déployer des efforts jamais considérés comme possibles, et les gens ont déjà remis en question le rôle du gouverneur général au sein de la démocratie australienne dans son ensemble.\n\nCela n'a pas été sans controverse du côté travailliste, ce qui a conduit à cet incident national. Le système de prêts impliquant un prêt potentiel d'un milliard de dollars auprès d'un banquier pakistanais et mentant au Parlement et à la nation a conduit à la démission du ministre Rex Connor.\n\nLe précédent établi ne fera que laisser des controverses dans son sillage."
 WorldAST.22.a: "L'Australie se trouve à la croisée des chemins."
 
 WorldAST.23.t: "[GetNewspaperHeader]La coalition remporte les élections de 1975 avec une victoire écrasante"
 WorldAST.23.desc: "Une victoire écrasante de la Coalition, la plus importante de l'histoire de l'Australie, a été obtenue lors de ce que beaucoup considèrent comme l'élection la plus controversée et la plus violente jamais organisée.\n\nPeu de temps après le limogeage de l'ancien Premier ministre Gough Whitlam, le nouvel élu Malcolm Fraser avait suscité de nombreuses protestations contre sa campagne électorale. Même une lettre piégée envoyée au gouverneur général a dû être désamorcée par les autorités. Les rassemblements massifs de l'ALP, certains totalisant 30 000 personnes peu après le limogeage, n'ont pas donné les résultats que le camp de Whitlam aurait pu espérer. L'attaque de la Coalition contre les difficultés économiques du Parti travailliste s'est révélée forte auprès de nombreux électeurs influents, allant jusqu'à remporter 91 sièges contre 36 pour l'ALP."
 WorldAST.23.a: "Allumez les lumières !"
 
 WorldAST.24.t: "[GetNewspaperHeader]Fraser réélu en 1977, montée des démocrates"
 WorldAST.24.desc: "Le Premier ministre Malcolm Fraser a connu une réélection facile, suite à la nécessité de rétablir l'alignement des élections à la Chambre et au Sénat. Les travaillistes dirigés par Gough Whitlam n'ont pas réussi à récupérer une grande partie du terrain perdu depuis le licenciement, et des rumeurs ont circulé selon lesquelles il avait l'intention de démissionner de son poste de chef du parti. C'est également la première fois qu'un chef de l'opposition se présente à quatre élections.\n\nMême en conservant une majorité de 48 sièges, tout n'est pas une bonne nouvelle pour la Coalition. Les démocrates australiens sont nés de la fusion du Parti australien et du Nouveau mouvement libéral. Dirigé par un ancien ministre du Parti libéral, Don Chipp, l'objectif général du parti consistant à parvenir à un équilibre des pouvoirs et à l'exercer de manière responsable conformément aux politiques d'adhésion a remporté plus de 9 % du vote populaire. Le leadership de Fraser a pris un petit coup, alors même qu'il se dirige vers un autre mandat."
 WorldAST.24.a: "Whitlam a été éliminé par le Razor Gang."
 
 WorldAST.25.t: "[GetNewspaperHeader]Le père du Parti libéral se repose"
 WorldAST.25.desc: "Sir Robert Menzies, fondateur du Parti libéral d'Australie, est décédé aujourd'hui à son domicile de Melbourne, à l'âge de 83 ans. L'ère Menzies a vu l'Australie devenir une société de plus en plus riche, une population largement conservatrice qui était devenue de plus en plus une classe moyenne au cours des années 1950. Avec l'afflux de migrants en provenance de Grande-Bretagne et d'Europe continentale, environ 2 millions de migrants sont arrivés en Australie sous le règne de Menzies. Il était également responsable du début de la construction du projet des Snowy Mountains et de la libéralisation lente de la politique de l'Australie blanche.\n\nDes hommages du monde entier, y compris de la reine d'Angleterre elle-même, ont été envoyés à la famille Menzies. Premier ministre le plus ancien du pays, en poste pendant plus de 18 ans et 5 mois sur 2 mandats distincts, il laissera derrière lui un héritage qui façonnera à jamais le paysage australien."
 WorldAST.25.a: "Son héritage est assuré à jamais."
 
 WorldAST.26.t: "[GetNewspaperHeader]Troisième victoire électorale de Fraser"
 WorldAST.26.desc: "Le Premier ministre Malcolm Fraser a mené la Coalition à une troisième victoire électorale consécutive, mais sa popularité au sein de l'électorat en a pris un coup. Même si la Coalition a perdu un total de 12 sièges, elle conserve toujours une majorité de 23. Comme leur récent budget a été présenté en déficit, les rumeurs selon lesquelles le leadership de Fraser s'affaiblissait depuis les dernières élections commencent à prendre pied.\n\nAlors que l'économie continue de se porter mal au sein du pays, l'ALP, quelque peu résurgente, a retrouvé sa place sous la direction de son nouveau chef Bill Hayden. Même si les travaillistes ne semblent pas avoir les meilleures perspectives électorales, l'ALP est en plein essor. Récemment élu président du Parlement de l'ACTU, un syndicat influent de l'ALP, Bob Hawke s'est retrouvé en campagne aussi souvent que Hayden, signalant peut-être ses ambitions aux Australiens."
 WorldAST.26.a: "La Coalition a été mise à l'épreuve, mais elle reste fidèle."
 
 WorldAST.27.t: "[GetNewspaperHeader]Bob Hawke élu premier ministre"
 WorldAST.27.desc: "Une inflation élevée et un emploi élevé ont coûté cher à la Coalition lors des élections fédérales australiennes de 1983. Le Parti travailliste australien s'est remis du glissement de terrain désastreux de 1975, le leader récemment nommé Bob Hawke battant Fraser et la Coalition par 24 sièges. C'est après que l'ancien leader travailliste Bill Hayden a vu son leadership contesté par Hawke, démissionnant de son poste après avoir perdu le soutien au sein du parti.\n\nPour Fraser, la récession du début des années 1980 et les défis au sein de son propre cabinet ont été sa perte, étant cité comme « une détermination maniaque à obtenir ce qu'il veut » n'a pas aidé à obtenir le soutien de l'électorat.\n\nIl s'agirait de la plus grande défaite d'un gouvernement en exercice depuis la victoire de Menzies en 1949, et de la pire défaite qu'un gouvernement non travailliste en exercice ait jamais subie jusqu'à présent."
 WorldAST.27.a: "Merveille du chien des antipodes !"
 
 WorldAST.28.t: "[GetNewspaperHeader]Hawke réélu dans le pari de la dissolution"
 WorldAST.28.desc: "Le pari du Premier ministre Bob Hawke de réaligner la Chambre et le Sénat par une double dissolution anticipée a porté ses fruits pour l'ALP, puisque Hawke a été réélu, mais avec une marge moindre que ce que prédisaient de nombreux analystes. La majorité réduite de 25 à 16 a conduit le Premier ministre à blâmer le système de vote récemment modifié pour le Sénat, impliquant des cartes de vote, alors que l'AEC a suggéré le contraire.\n\nDans l'opposition, Andrew Peacock s'est révélé être un leader efficace dans le court laps de temps où il a dirigé le Parti libéral, obtenant de bons résultats lors d'un débat des chefs. Cela n'est pas sans inconvénients, car le chef adjoint du parti, John Howard, n'a pas réussi à freiner ses ambitions de mener lui-même le parti aux élections."
 WorldAST.28.a: "Hawke emmène les travaillistes vers la victoire une fois de plus."
 
 WorldAST.29.t: "[GetNewspaperHeader]Joh pour MP ?"
 WorldAST.29.desc: "Le Premier ministre de l'État du Queensland, un certain Joh Bjelke-Petersen, a annoncé son intention de se présenter au poste de Premier ministre d'Australie. Son mandat en tant que Premier ministre a vu son État d'origine passer d'un profond sommeil à une nouvelle ère de prospérité. Ses détracteurs ne pourraient pas être plus en désaccord, car certains sont allés jusqu'à le qualifier de « fasciste » pour ses actions autoritaires de tabassage en signe de protestation.\n\nCette annonce résulte de l'échec du gouvernement à mettre en oeuvre une réforme fiscale impopulaire. Alors que le Premier ministre Bob Hawke s'occupe des problèmes économiques, les dirigeants du Parti libéral et du Parti national doivent désormais également faire face à un facteur tertiaire lié à leurs propres ambitions, et nombreux sont ceux qui se demandent comment ils pourraient fonctionner en tant que groupe, voire pas du tout."
 WorldAST.29.a: "Le Queenslander fait son geste."
 
 WorldAST.30.t: "[GetNewspaperHeader]Hawke réélu après la tourmente de la coalition"
 WorldAST.30.desc: "Dans des circonstances peut-être plus malheureuses, le premier ministre Bob Hawke aurait été défait aux élections fédérales de 1987. Avec l'échec de l'adoption d'une taxe à la consommation impopulaire et les termes de l'échange commençant à se détériorer, l'ALP aurait perdu l'électorat si ses ennemis n'avaient pas été concentrés sur la lutte entre eux.\n\nLa tentative du Premier ministre de l'État du Queensland, Joh Bjelke-Petersen, d'imposer le leadership non seulement au Parti national, mais aussi à l'ensemble de la Coalition depuis l'extérieur, s'est soldée par un incendie. Alors que l'enquête Fitzgerald bat son plein, la corruption institutionnelle a vu la fin brutale de la force la plus conservatrice que l'Australie ait jamais connue, Bjelke-Petersen démissionnant et prenant sa retraite au milieu d'enquêtes de corruption massives.\n\nLa Coalition elle-même a trouvé une trêve entre les deux partis, mais la direction des deux partis est certaine, car ce que beaucoup considéraient comme une potentielle victoire électorale a disparu car ils étaient plus concentrés sur l'attaque les uns des autres, tout en promouvant des politiques fiscales très différentes, que sur l'unification contre l'ALP."
 WorldAST.30.a: "Où va la Coalition à partir d'ici ?"
 
 WorldAST.31.t: "[GetNewspaperHeader]Fermer Terminer les élections australiennes de 1987"
 WorldAST.31.desc: "Bob Hawke vient tout juste d'être réélu dans un troisième gouvernement. La détérioration des termes de l'échange et la tentative ratée du Trésorier de faire adopter une taxe à la consommation ont amené une partie importante de l'électorat à voter contre le parti travailliste. Pourtant, même si Hawke consolide sa position, la perte de nombreux sièges ne voit leur majorité qu'à un chiffre, alors qu'elle était autrefois supérieure à 20.\n\nLa campagne instable de la Coalition a causé sa propre perte. Les chefs des partis libéraux et nationaux, y compris l'ancien Premier ministre de l'État du Queensland lui-même, se battent souvent contre eux-mêmes plutôt que contre l'ALP au sein du gouvernement. Un éventuel cessez-le-feu a été appelé, alors que Bjelke-Petersen a réussi à remporter un siège fédéral dans le Queensland, les Nationaux ont réussi à se réunifier pacifiquement, bien que meurtris. Le chef du Parti libéral, John Howard, devra désormais affronter son propre parti, car les deux factions du parti s'affrontent ouvertement en public, laissant sa direction et l'avenir du parti lui-même désormais en danger critique."
 WorldAST.31.a: "Hawke conserve, meurtri mais victorieux."
 
 WorldAST.32.t: "[GetNewspaperHeader]Quatrième victoire électorale pour Bob Hawke"
 WorldAST.32.desc: "La quatrième victoire consécutive du Parti travailliste australien a été remportée par le Premier ministre Bob Hawke. Pourtant, confronté à des taux d'intérêt élevés et à une crise financière dans l'État de Victoria, l'ALP a perdu 8 sièges pour conserver une majorité de 9 sièges. Les problèmes auxquels Hawke est confronté semblent désormais être principalement internes, son trésorier Paul Keating montrant de plus en plus de signes d'impatience de ne pas être lui-même Premier ministre.\n\nSe retrouvant à nouveau chef de l'opposition, le deuxième mandat d'Andrew Peacock a connu des résultats mitigés. Cette victoire électorale ne parvient pas à éclipser les problèmes internes au sein du Parti libéral, contre des dirigeants potentiels prêts à l'usurper, et contre la Polis multifonctionnelle qui a fait partager les craintes de « l'enclave » asiatique avec beaucoup d'autres.\n\nIl s'agit également d'un jalon historique pour les démocrates australiens : même s'ils n'ont pas obtenu de siège à la Chambre, ils ont réussi à obtenir plus de 11 % du vote populaire et à voir leur nombre au Sénat passer de 3 à 8."
 WorldAST.32.a: "Les plumes du paon ont été à nouveau arrachées."
 
 WorldAST.33.t: "[GetNewspaperHeader]Résultat choc en Australie, Bjelke-Petersen nouveau Premier ministre"
 WorldAST.33.desc: "Un résultat choquant s'est produit en Australie, puisque le Parti national a remporté une victoire sans précédent aux élections de 1990. À la suite de la scission du Parti libéral survenue après les élections de 1987, la partie archi-conservatrice du parti a rejoint les nationaux. La Coalition, dans des circonstances nouvelles, dirigée par le toujours controversé Joh Bjelke-Petersen, a vu la nation se déplacer de façon spectaculaire plus à droite que jamais auparavant. Les critiques et les analystes sont stupéfaits que la Coalition ait réussi à trouver sa place dans une nouvelle récession du pays.\n\nLe candidat autoritaire de « la loi et l'ordre » se trouve largement contrasté par les « socialistes » de l'ALP. L'ancien Premier ministre Bob Hawke n'a pas réussi à se rétablir suffisamment dans une économie instable pour convaincre l'électorat de voter à nouveau pour lui. Le fait d'être potentiellement usurpé par son trésorier Paul Keating, avec des querelles publiques lentement mais sûrement révélées ces derniers temps, n'a certainement pas aidé.\n\nL'Australie se retrouve désormais dans une situation que beaucoup n'auraient jamais cru possible, alors que le quatrième Premier ministre du Queensland accède désormais à la tête de la nation."
 WorldAST.33.a: "Ne vous inquiétez pas."
 
 WorldAST.34.t: "[GetNewspaperHeader]Hawke évincé suite à une perte de leadership"
 WorldAST.34.desc: "Les tensions de longue date au sein de l'ALP ont finalement débordé avec un changement de direction et, par la suite, un nouveau Premier ministre. Bob Hawke était autrefois le nouveau visage de l'Australie, le messie porté au pouvoir avec adoration par le peuple. Aujourd'hui, son leadership a été dégradé et blessé au sein du caucus de l'ALP au cours des dernières années, perdant de très peu par moins de 5 voix.\n\nL'ancien trésorier Paul Keating a désormais accédé au poste qu'il estime avoir mérité après des décennies de travail acharné. Y compris une réforme économique tumultueuse qui a transformé l'Australie à jamais. Il devra désormais faire face à un chômage massif et réparer une économie désormais endommagée parmi ses nombreux premiers défis. Sa ferme croyance en une république et ses liens diplomatiques avec les États d'Asie du Sud-Est pourraient le mettre en désaccord avec les proches alliés de l'Australie aux États-Unis et en Grande-Bretagne."
 WorldAST.34.a: "Il est désormais le dirigeant du pays."
 
 WorldAST.35.t: "[GetNewspaperHeader]C'est Keating"
 WorldAST.35.desc: "Un bouleversement s'est produit en Australie, avec la réélection de l'actuel Premier ministre Paul Keating lors d'élections « impossibles à gagner », que beaucoup pensaient que l'ALP aurait perdu. La coalition dirigée par John Hewson a apparemment échoué dans ce que certains experts pensaient être sa victoire électorale.\n\nÀ la suite de taux de chômage élevés et d'une économie en reprise, Hewson a publié le Fightback! Package, un document politique de 650 pages contenant des mesures économiques libérales « sèches » radicales. L'introduction d'une taxe sur les biens et services de 15 % a effrayé de nombreuses personnes en Australie quant au prix de la TPS, en particulier sur les produits alimentaires. L'incapacité de la coalition, en particulier de Hewson, à décrire sa politique à la population après 18 mois de campagne a donné lieu à des attaques très critiques de Keating contre la TPS, reconquérant de nombreux électeurs influents vers le parti travailliste.\n\nLe futur leadership de Hewson pourrait être mis en doute, alors que Keating poursuit sa politique d'une seule nation."
 WorldAST.35.a: "La plus douce victoire de toutes !"
 
 WorldAST.36.t: "[GetNewspaperHeader]Joh réélu aux élections de 1993"
 WorldAST.36.desc: "Le Premier ministre australien, toujours polarisant et controversé, Joh Bjelke-Petersen, a été réélu. Bien qu'il ait perdu une partie importante de l'électorat de la classe moyenne, il s'est assuré, de justesse, une majorité à la Chambre. Ses décisions d'assouplir les libertés de la presse, de donner la priorité au secteur rural par rapport au secteur urbain et de faire pression pour davantage de droits sur les armes à feu et l'État, ont vu l'ALP gagner du terrain sous la direction de son nouveau chef Paul Keating.\n\nPourtant, alors que l'économie se remet lentement de la récession du début de la décennie, Joh se retrouve dans une position de pouvoir précaire mais néanmoins précaire. Même s'il commence à vieillir, beaucoup se demandent si quelqu'un d'autre au sein du nouveau Parti national prendra bientôt sa place. Des rumeurs persistent également selon lesquelles la faction archi-conservatrice, anciennement du Parti libéral, pourrait réintégrer le parti si son leadership se renforçait ou s'affaiblissait d'un côté ou de l'autre de cette coalition contre-nature."
 WorldAST.36.a: "Le dernier hourra du Queenslander ?"
 
