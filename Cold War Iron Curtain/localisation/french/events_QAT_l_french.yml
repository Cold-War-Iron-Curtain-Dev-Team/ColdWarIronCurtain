l_french:
 Qatar_Pol.1.d:0 "Ali bin Abdullah Al Thani a annoncé son abdication en tant qu'émir au pouvoir du Qatar. Cela survient quelques mois après que son cousin ait tenté de l'assassiner à Beyrouth. Il est arrivé au pouvoir en 1949 et, sous son règne, le Qatar s'est lancé dans l'industrie pétrolière et a considérablement développé les établissements d'enseignement pour sa population. Il a également fréquenté la littérature islamique, facilitant la publication de nombreux ouvrages sur l'Islam qui n'étaient auparavant accessibles qu'à quelques privilégiés. Ces dernières années, son gouvernement a été mis au défi par la popularité croissante du nationalisme arabe et par l'agitation croissante parmi les travailleurs du secteur pétrolier. Bien qu'il ait cherché à arbitrer ces problèmes, ces tensions demeurent. Il a choisi son fils Ahmed bin Ali Al Thani pour prendre la relève et de nombreux Qatariens espèrent que le nouvel émir, plus jeune, contribuera à poursuivre la modernisation de la nation."
 Qatar_Pol.4.d:0 "Le nouvel émir du Qatar a manifesté sa volonté de superviser la réforme et le développement de son pays. La famille royale et ses partisans reconnaissent que pour rester au pouvoir et satisfaire les désirs de son peuple, elle doit changer et se réformer. L'Émir craint que le courant d'idées nouvelles qui déferle sur le monde et la région ne submerge le gouvernement s'il n'est pas préparé. Pour y parvenir, l'Émir a demandé au gouvernement britannique de lui fournir un conseiller politique pour l'aider au début de son règne. Le conseiller politique offrira son soutien, facilitera l'aide à la nation et aidera à diriger efficacement le programme de réforme. Cela renforcera également les liens entre le Qatar et son patron, la Grande-Bretagne."
 Qatar_Pol.2.d:0 "L'influence du nationalisme arabe à travers le monde arabe a infecté le coeur de nombreuses personnes au Qatar. Ils croient désormais fermement aux idées panarabes qui minent le gouvernement du Qatar et la famille royale. L'Émir en particulier est conscient de cette menace et craint que sa décision d'envoyer des Qataris à l'étranger pour poursuivre leurs études n'ait conduit nombre d'entre eux à revenir avec cette idéologie dangereuse. Les Britanniques sont également préoccupés par le fait que les solides fondements anticoloniaux de l'idéologie menacent leurs relations et leur présence au Qatar. De nombreux membres du gouvernement préconisent une approche ferme pour mettre fin à la menace. Cependant, il existe également une faction qui soutient qu'une approche agressive pourrait radicaliser les nationalistes arabes et que les accommoder pourrait être la meilleure approche."
 QAT_Suez_Crisis.1.d:0 "La récente crise de Suez enflamme les passions au sein de la population du Qatar. Beaucoup dans le pays considèrent la collaboration britannique avec Israël contre le peuple arabe d'Égypte comme un complot impérialiste visant à affaiblir le monde arabe et à l'asservir à l'Occident. Les travailleurs du secteur pétrolier sont particulièrement mécontents et ont mené des manifestations de rue contre les Britanniques. Compte tenu des relations étroites entre le gouvernement et les Britanniques, on craint de plus en plus que ces manifestations ne s'intensifient et ne mettent en cause le gouvernement. Cependant, le gouvernement doit agir avec prudence, car il ne veut pas être perçu comme étant contraire aux aspirations des Arabes ou comme un outil au service des Britanniques."
 Qatar_Pol.3.d:0 "L'émir du Qatar a appelé l'armée britannique à intervenir et à rétablir l'ordre dans le pays. Les troubles provoqués par la crise de Suez se sont transformés en protestations contre le gouvernement. Compte tenu de la popularité du nationalisme arabe, de nombreux membres du gouvernement craignent que le recours à l'armée qatarie risque de voir les troupes rejoindre les manifestants. On pense que les forces britanniques seront les plus efficaces dans ces circonstances et qu'elles préserveront le gouvernement. Les Britanniques sont prêts à apporter leur aide car ils ont investi massivement dans l'industrie pétrolière du Qatar et ne voudraient pas en perdre l'accès, d'autant plus que le pays fait face à des menaces d'embargo en raison de la crise de Suez."
 QAT_Arab_Federation.1.d:0 "L'émir du Qatar a annoncé sa proposition de création d'Émirats unis du Golfe, qui uniraient tous les protectorats britanniques du golfe Persique en une seule nation. Cela verrait le Qatar s'unir à Bahreïn, au Koweït, aux États de la Trêve, au Yémen du Sud, à Aden et à Mascate. L'Émir note que tous ces États sont confrontés à des menaces de la part de puissances régionales et d'idéologies qui menacent l'ordre politique existant. En s'unissant, ils peuvent tous résister ensemble à ces défis et garantir que les peuples placés sous leur direction pourront prospérer sous une gouvernance stable. En outre, la menace émanant des États voisins plus grands sera annulée. Pour les Britanniques, l'État proposé sera suffisamment fort pour réduire leur dépendance à l'égard de la puissance militaire britannique et pourra agir comme un État régional puissant pour préserver leurs intérêts contre les États et les idéologies hostiles qui prolifèrent actuellement. Londres a déclaré qu'elle étudierait la proposition."
 QAT_Arab_Federation.2.d:0 "Le gouvernement britannique a annoncé qu'il acceptait en principe la récente proposition de l'émir du Qatar d'établir des Émirats unis du Golfe. Le gouvernement britannique a noté que les tendances actuelles dans le monde indiquent que les colonies britanniques et le protectorat dans ces régions ne seront pas durables à long terme. Les Émirats du Golfe promettent de combiner tous ces intérêts en un État fort et pro-britannique. Le gouvernement britannique estime qu'il s'agit de la meilleure approche pour assurer son influence dans la région tout en réduisant les coûts et en respectant les aspirations des populations vivant dans ces États. Les Émirats du Golfe verront le Qatar s'unir au Koweït, à Bahreïn, aux États de la Trêve, au Yémen du Sud, à Aden et à Mascate. Cette action mettra également un terme au déclin de la Grande-Bretagne dans la région et le nouvel État constituera un formidable moyen de contrer les menaces idéologiques dans la région."
 QAT_Arab_Federation.3.d:0 "Le gouvernement britannique a annoncé qu'il rejetait la proposition de l'émir du Qatar de former une nouvelle nation appelée les Émirats unis du Golfe. Ce nouvel État aurait uni le Qatar au Koweït, à Bahreïn, aux États de la Trêve, au Yémen du Sud, à Aden et au Koweït. En unifiant tous les protectorats et colonies britanniques, les Qataris espéraient convaincre Londres que ce serait le meilleur scénario pour la Grande-Bretagne face aux défis de la décolonisation. Le gouvernement britannique a cependant noté que la proposition était trop ambitieuse et irréalisable, affirmant qu'il ne pensait pas que ces multiples États et territoires seraient capables d'établir un gouvernement unifié et qu'ils seraient mûrs pour l'instabilité. À l'heure actuelle, les Britanniques estiment que le statu quo est le meilleur pour tous les peuples de la région et pour la nation britannique."
 QAT_Arab_Federation.4.d:0 "Lors d'une cérémonie élaborée au Qatar, les Émirats du Golfe ont signé leurs documents d'indépendance avec des responsables britanniques. La cérémonie a réuni tous les différents dirigeants politiques du nouvel État ainsi que les hauts responsables britanniques de la région. Avec cet accord, les anciens protectorats et colonies britanniques du golfe Persique seront unis. Beaucoup pensent que les Britanniques espèrent que cette nouvelle nation satisfera les aspirations des peuples de ces terres, mais préservera également les relations avec la Grande-Bretagne et ces régions, car les dirigeants ont tous été maintenus au pouvoir par les Britanniques, certains pendant de nombreuses décennies. Les Émirats du Golfe eux-mêmes estiment que leur structure permettra à leurs citoyens de préserver leur indépendance vis-à-vis des puissances régionales et de devenir un acteur puissant dans la politique régionale."
 QAT_Coronation.1.d:0 "Le couronnement de Cheikh Ali bin Abdullah Al Thani s'est terminé aujourd'hui dans la capitale. Le nouvel et jeune émir a pris la relève lors d'une cérémonie élaborée destinée à mettre en valeur le prestige du Qatar. Il prend la tête d'une nation en pleine transformation, notamment au niveau économique, alors que l'industrie pétrolière continue de croître et de se développer. Cependant, cette nouvelle croissance a donné lieu à une montée de la dissidence, notamment parmi les partisans du nationalisme arabe et de la réforme du travail. Cette menace vise le gouvernement et la domination continue de la famille royale sur les affaires de l'État. Il reste à voir comment le nouvel Émir relèvera ces défis. Il s'est déjà engagé à poursuivre les politiques de développement et de réforme de son prédécesseur et promet de moderniser le Qatar et de le voir prospérer dans les années à venir."

 QATAR_UAS.1.d:0 "Les États arabes unis ont accueilli aujourd'hui dans leurs rangs le riche pays pétrolier du Qatar. Le gouvernement du Qatar a récemment adopté le nationalisme arabe et a amené nombre de ses partisans au Qatar à des postes d'influence. Pour beaucoup, cela semble être la prochaine étape naturelle, car le Qatar a encore besoin d'aide en matière de formation technique et d'une plus grande puissance pour protéger son indépendance après avoir expulsé son ancien patron la Grande-Bretagne. Les plus hauts dirigeants de la RAU étaient au Qatar pour une cérémonie au cours de laquelle le gouvernement qatari a signé l'accord et les drapeaux de tout le pays ont été remplacés par le drapeau des États-Unis. Bien que le Qatar et les États-Unis aient eu beaucoup de joie, d'autres États de la région sont restés silencieux ou ont condamné la décision du Qatar. Beaucoup de ces propos ont bouleversé l'équilibre des pouvoirs au sein du monde arabe."
 Mesaieed.1.d:0 "Le gouvernement du Qatar a annoncé aujourd'hui la création de Mesaieed. Cette colonie est installée à côté des principales installations pétrolières et est censée être le centre industriel de l'industrie pétrolière en croissance rapide dans le pays. Ce sera le principal terminal pétrolier du Qatar et sera administré par la compagnie pétrolière. Le gouvernement espère que cette nouvelle ville industrielle contribuera à la croissance du pays car elle est également située à proximité des quartiers populaires du pays. La proximité immédiate contribuera à la création d'emplois et au développement de carrière pour les citoyens du Qatar."
 QATAR_UAR.1.d:0 "L'émir du Qatar a annoncé dans une déclaration surprise son soutien public au président Gamal Abdel Nasser. L'Émir a salué sa vision de l'unité arabe et sa lutte contre l'impérialisme lors des récents événements. La nouvelle est bien accueillie par de nombreuses personnes au Qatar qui soutiennent le nationalisme arabe. Ce soutien a conduit à des manifestations de rue et à des troubles, et nombreux sont ceux qui soupçonnent que cette annonce vise à apaiser les Qataris. On ne sait pas si cette déclaration satisfera pleinement les sympathisants nationalistes arabes, en particulier parmi les travailleurs du pétrole. Les traditionalistes et l'élite établie au Qatar seraient mal à l'aise face à cette déclaration, d'autant plus qu'elle risque d'aliéner les relations avec la Grande-Bretagne et l'Occident."
 QATAR_IND.1.d:0 "L'émir du Qatar a ordonné au gouvernement de mettre fin à tout engagement avec les autorités britanniques en annonçant l'abrogation de tous les traités avec la Grande-Bretagne. L'Émir déclare qu'il s'agit d'une réponse à l'attaque non provoquée contre l'Égypte par la Grande-Bretagne et à ses efforts pour freiner les aspirations des Arabes. Il a ajouté que le nationalisme arabe offre un destin à l'ensemble du monde arabe, ce qui fait peur aux Britanniques et que le Qatar ne soutiendra plus ce projet. Les partisans des nationalistes arabes et les travailleurs de l'industrie pétrolière ont accueilli la nouvelle avec joie en lançant des manifestations de rue contre le gouvernement et ses liens avec la Grande-Bretagne depuis le début de la crise de Suez. Les traditionalistes proches de la monarchie sont visiblement mal à l'aise et incertains face à cette dernière annonce et craignent que l'Émir ne conduise le Qatar vers un désastre." 
