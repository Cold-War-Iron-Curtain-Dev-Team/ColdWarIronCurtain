 #decision category
 NATIONAL_ASSEMBLY_KOR:0 "L'Assemblée nationale de la République de Corée"
 NATIONAL_ASSEMBLY_KOR_MENU_TOGGLE:0 "Afficher les informations sur l'Assemblée nationale"
 NATIONAL_ASSEMBLY_KOR_desc:0 "Constitution de la République de Corée Chapitre III Assemblée nationale\n\nArticle 40 Le pouvoir législatif appartient à l'Assemblée Nationale.\nArticle 41 1. L'Assemblée nationale est composée de membres de l'Assemblée nationale élus au suffrage universel, égalitaire, direct et secret du peuple.\n2. Le nombre des membres de l'Assemblée nationale est fixé par la loi, mais il doit être d'au moins 200.\n3. Les questions concernant les circonscriptions électorales des membres de l'Assemblée nationale, le système de représentation proportionnelle et les autres élections sont réglées par la loi.\n\nMembres de l'Assemblée nationale soutenant la législation actuelle : [?KOR.naseat]\n\nNombre maximum actuel de députés à l'Assemblée nationale : [?KOR.KOR_NA_SIZE]"
