 mrtnews.1.d:0 "Depuis que la Mauritanie a pris le contrôle de la partie sud de ce qui était autrefois le Sahara espagnol dans le cadre des accords de Madrid en 1975, le pays a connu des désastres et des calamités sans fin. L'armée initiale de 3 000 soldats de la Mauritanie était totalement incapable de défendre ses frontières intérieures contre les raids constants du Front Polisario qui ont paralysé le pays après que les rebelles ont pris le contrôle de la principale source de revenu national : les mines de fer de Zouerate. En fait, la seule chose qui maintenait la cohésion de cette nation désertique était l'implication de l'armée de l'air française qui, déjà, peinait à arrêter une offensive sur la capitale Nouakchott. Avec des troubles massifs au sein des forces armées, avec des Arabes et des Berbères largement sympathiques aux rebelles sahariens et des soldats noirs du sud qui y voient un conflit intra-arabe motivé par leurs intérêts, le coup d'État d'officiers militaires mécontents et anti-guerre était inévitable. La Mauritanie a non seulement évacué toute la région du Sahara occidental précédemment contrôlée, mais a également annoncé la reconnaissance de son indépendance."
 