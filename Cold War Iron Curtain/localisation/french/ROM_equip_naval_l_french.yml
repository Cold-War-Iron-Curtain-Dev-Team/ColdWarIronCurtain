 ROM_ww_capitals:0 "Classe Elisabeta"
 ROM_ww_capitals_short:0 "Classe Elisabeta"
 ROM_ww_capitals_desc:0 "Croiseur (Crucisatorul) type \"Elisabeta\"."

 ROM_battle_hull_light_0:0 "Classe Vifor"
 ROM_battle_hull_light_0_short:0 "Classe Vifor"
 ROM_battle_hull_light_0_desc:0 "Les croiseurs légers (Distrugatoare) de type \"Vifor\" furent restitués à la Roumanie le 12 octobre 1945, où ils reprennent leurs anciens noms. Les soeurs furent ensuite affectées à l'escadron de destroyers avant le début de la refonte. Lorsque la division de destroyers fut rebaptisée 418e division de destroyers en 1952, Marasti fut rebaptisée D12. Le navire a continué à servir jusqu'en avril 1961, date à laquelle il a été mis hors service puis mis hors service."
 
 ROM_battle_hull_light_4:0 "Projet 999"
 ROM_battle_hull_light_4_short:0 "Projet 999"
 ROM_battle_hull_light_4_desc:0 "Projet de croiseur hélicoptère (Crucisatoare usor Portelicopter) 999. La construction du navire de guerre a commencé le 1er mars 1978 au chantier naval militaire du 2 mai à Mangalia. En 1984, elle débute les essais en mer. Le navire de guerre a été initialement classé comme croiseur léger par le gouvernement communiste et a été nommé Munténie, en hommage à la province historique de Roumanie. Nicolae Ceausescu a lui-même baptisé le navire le 2 août 1986. Le croiseur était entièrement un projet roumain, à l'exception de l'armement construit sous licence ou d'origine soviétique. Le navire de guerre avait un poids excessif qui causait des problèmes de stabilité même dans les eaux calmes."
 
 ROM_screen_hull_heavy_0:0 "Classe Regele Ferdinand"
 ROM_screen_hull_heavy_0_short:0 "Classe Regele Ferdinand"
 ROM_screen_hull_heavy_0_desc:0 "Destroyers (Distrugatoare) type \"Regele Ferdinand\" En 1946, après rénovation, il fut inclus dans la marine roumaine sous le même nom Smeul. Depuis 1954, E-1 est attribué. Exclu de la flotte en 1958 1959. Démonté en 1960."
 ROM_screen_hull_heavy_1:0 "Projet 204E"
 ROM_screen_hull_heavy_1_short:0 "Projet 204E"
 ROM_screen_hull_heavy_1_desc:0 "Projet Corvete 204E (désignation du code OTAN - \"Poti\"). Ces navires furent les premiers navires de guerre soviétiques équipés de moteurs à turbine à gaz ; deux hélices ont été installées dans les tunnels pour assurer un très faible tirant d'eau. Le support de canon double de 57 mm (2 pouces) assurait l'autodéfense. Le 5 décembre 1968, il est transféré en Roumanie, où il entre dans la marine en 1968."
 ROM_screen_hull_heavy_2:0 "Projet 1048"
 ROM_screen_hull_heavy_2_short:0 "Projet 1048"
 ROM_screen_hull_heavy_2_desc:0 "Projet de corvette de classe Amiral Petre Barbuneanu 1048 (désignation de code OTAN - \"Tetal I\"). Basé sur la frégate de classe Koni de la marine soviétique, mais conçu en Roumanie dans une taille plus petite, tout en conservant son rôle de guerre anti-sous-marine (ASW). Ils ont incorporé des armes et des capteurs soviétiques dans leur conception. Les navires de la classe ont un déplacement à pleine charge de 1 440 tonnes (1 420 tonnes longues) et mesurent 92,4 mètres (303 pi 2 po) de long avec une largeur de 11,7 m (38 pi 5 po) et un tirant d'eau de 3 m (9 pi 10 po). Les navires sont propulsés par quatre moteurs diesel entraînant quatre arbres créant 15 000 kilowatts (20 000 ch)."
 ROM_screen_hull_heavy_3:0 "Projet 1048M"
 ROM_screen_hull_heavy_3_short:0 "Projet 1048M"
 ROM_screen_hull_heavy_3_desc:0 "Le projet de corvette de classe 1048M du contre-amiral Eustatiu Sebastian (désignation du code OTAN - \"Tetal II\") est une série de deux corvettes utilisées par les forces navales roumaines pour le service en mer Noire. Ils ont un déplacement de 1 385 tonnes, un hélicoptère à l'arrière et comme armement principal un canon de 76 mm, des tubes lance-torpilles et des lance-roquettes de guerre anti-sous-marine."
 #ROM_screen_hull_heavy_4:0 "Type 22 frigate"
 #ROM_screen_hull_heavy_4_short:0 "Type 22 frigate"
 #ROM_screen_hull_heavy_4_desc:0 "Regele Ferdinand is a Type 22 frigate of the Romanian Naval Forces, formerly a Royal Navy ship named HMS Coventry. She was originally intended to be named Boadicea but was named Coventry in honour of the previous Coventry, a Type 42 destroyer sunk in the Falklands War. Following service in the Royal Navy she was sold to the Romanian Navy in 2003." 
 
 ROM_screen_hull_medium_0:0 "Classe Vifor"
 ROM_screen_hull_medium_0_short:0 "Classe Vifor"
 ROM_screen_hull_medium_0_desc:0 "Les destroyers (Torpiloare) type \"Vifor\" sont revenus en Roumanie le 12 octobre 1945, expulsés de la marine de l'URSS le 6 novembre 1945, modernisés en 1946, introduits dans la marine roumaine en 1946 comme destroyer (Torpilorul), depuis 1948 comme navire d'escorte (Escortorul), expulsés en 1959 et démantelés pour le métal en 1960."
 ROM_screen_hull_medium_1:0 "Classe Naluca"
 ROM_screen_hull_medium_1_short:0 "Classe Naluca"
 ROM_screen_hull_medium_1_desc:0 "Destroyers (Torpiloare) type \"Naluca\".. Le 12 octobre 1945 retourna en Roumanie, expulsé de la marine soviétique le 6 novembre 1945, modernisé en 1946, introduit dans la marine roumaine en 1946 comme destroyer (Torpilorul), depuis 1948 comme navire d'escorte (Escortorul), expulsé en 1959 et démantelé pour le métal en 1962."
 ROM_screen_hull_medium_2:0 "Projet 122bis II"
 ROM_screen_hull_medium_2_short:0 "Projet 122bis II"
 ROM_screen_hull_medium_2_desc:0 "Abattu par l'usine de construction navale n° 340 à Zelenodolsk le 10 septembre 1954, lancé le 13 novembre 1954, mis en service dans la flotte de la mer Noire de la marine de l'URSS le 11 mai 1955, exclu le 10 novembre 1955 et transféré le 10 novembre 1955 en Roumanie, où il entra dans la marine le 24 décembre 1955 à Mangalia."
 ROM_screen_hull_medium_3:0 "Projet 1241RE"
 ROM_screen_hull_medium_3_short:0 "Projet 1241RE"
 ROM_screen_hull_medium_3_desc:0 "Navires lance-missiles (Nave Purtatoare de Rachete) du projet 1241RE (désignation du code OTAN - \"Tarantul I\"). Construit par le chantier naval Vympel à Andropov (depuis 1989 Rybinsk), lancé, introduit temporairement dans la flotte de la mer Noire de la marine de l'URSS le 28 décembre 1989 pour essais et transfert ultérieur en Roumanie, expulsé de la marine de l'URSS et transféré en Roumanie le 12 septembre 1990, où il a été introduit dans la marine le 12 janvier 1992."
 ROM_screen_hull_medium_4:0 "Projet 883/3"
 ROM_screen_hull_medium_4_short:0 "Projet 883/3"
 ROM_screen_hull_medium_4_desc:0 "Navires d'escorte (Escortoare) du projet 883/3 (désignation par code OTAN - \"Croitor\")."
 
 
 # Submarine Hulls #
 
 ROM_sub_hull_ww:0 "Classe Delfinul"
 ROM_sub_hull_ww_short:0 "Classe Delfinul"
 ROM_sub_hull_ww_desc:0 "Sous-marin (Submarinul) type \"Delfinul\". Construit par le chantier naval Cantieri Navali del Quarnaro à Fiume en 1927 pour la marine roumaine avec la date de livraison prévue le 7 décembre 1928, lancé le 22 juin 1930. Le 2 octobre 1945, il fut restitué à la Roumanie à Galati et introduit comme sous-marin (Submarinul), expulsé de la marine roumaine le 1er janvier 1958 et en 1959 découpé en métal."

 ROM_sub_hull_small_single_0:0 "Projet 298"
 ROM_sub_hull_small_single_0_short:0 "Projet 298"
 ROM_sub_hull_small_single_0_desc:0 "Mis sur cale \"Santierul Naval Galati\" à Galati en 1938, lancé le 5 mai 1941. Le 24 juin 1951, il fut restitué à la Roumanie et introduit comme sous-marin (Submarinul), largué en 1959 et découpé dans le métal."
 
 ROM_sub_hull_small_single_3:0 "Classe Delfinul"
 ROM_sub_hull_small_single_3_short:0 "Delfinul"
 ROM_sub_hull_small_single_3_desc:0 "Delfinul (« Le dauphin ») est un sous-marin de classe Kilo des forces navales roumaines. Il a été mis en service en août 1985."
 

 ROM_sub_hull_large_single_0:0 "Projet S2 Marsuinul"
 ROM_sub_hull_large_single_0_short:0 "Classe Marsuinul"
 ROM_sub_hull_large_single_0_desc:0 "Mis sur cale \"Santierul Naval Galati\" à Galati en 1938, lancé le 25 mai 1941, entré dans la marine roumaine en septembre 1943, à partir du 12 janvier 1949, sous-marin moyen."
 
 

 
