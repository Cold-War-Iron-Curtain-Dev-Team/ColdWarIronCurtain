#natspit
  ukraine_1:0 "L'Ukraine n'est pas encore perdue !"
  ukraine_1_desc:0 "\n\n\n£ukraine\n\n\n\n\n\nLe Parlement ukrainien a adopté de manière décisive une déclaration qui établit fermement l'autonomie de l'Ukraine au sein de l'Union des Républiques socialistes soviétiques. Cette décision importante fait suite à une vague de déclarations de souveraineté émanant de diverses républiques de l'Union soviétique, démontrant clairement la dynamique croissante du nationalisme qui remodèle l'autorité centrale de l'Union.\n\nLa déclaration, ainsi que les votes ultérieurs, établissent une armée ukrainienne indépendante et une banque centrale chargée d'introduire une nouvelle monnaie. Il accorde sans équivoque la citoyenneté ukrainienne, reconnaissant les Ukrainiens comme citoyens à la fois de l'Ukraine et de l'Union soviétique. Cette déclaration exige l'indépendance économique et défend les principes d'autodétermination et de gouvernance par le peuple. En outre, il proclame son engagement en faveur de la neutralité militaire et rejette sans équivoque la production d'armes nucléaires, signalant ainsi un pas en avant audacieux pour l'avenir de l'Ukraine."
  ukraine_2:0 "Le fruit de notre indépendance"
  ukraine_2_desc:0 "Même avec notre gouvernement jeune et une économie chancelante, notre peuple ne pourrait pas avoir plus d'espoir. La promesse d'indépendance et d'un nouvel avenir nous a unis, même si nous sommes confrontés à des lacunes et à des difficultés. Beaucoup croient que le gouvernement nous guidera à travers ces défis, malgré leur inexpérience.\n\nMalgré les défis qui nous attendent, la population de notre pays est unie et prête à affronter ce qui va arriver. L'espoir du changement fait avancer notre peuple, lui permettant de maintenir son espoir malgré les difficultés actuelles. Le désir de changement et de progrès maintient nos collaborateurs en vie, même en ces temps difficiles."
  ukraine_3:0 "Incertitude économique"
  ukraine_3_desc:0 "La transition du socialisme soviétique à une économie de marché se heurte à d'énormes défis. Le financement gouvernemental qui soutenait les usines et les infrastructures pendant le régime soviétique a disparu, obligeant de nombreuses industries à s'efforcer de s'adapter au nouvel environnement. L'économie est fragile, l'inflation et les pénuries rendant la vie quotidienne insupportable pour la plupart de nos citoyens.\n\nLa production a ralenti et les projets de construction sont souvent retardés, voire arrêtés. Le passage à une économie de marché a apporté confusion et instabilité, semant l'incertitude quant à l'avenir de notre pays. Sans ressources ni institutions adéquates sur lesquelles compter en ces temps difficiles, nous sommes obligés de traverser seuls cette période difficile."
  #events
  Ukraine.1.d:0 "La République socialiste soviétique d'Ukraine a fait un pas décisif vers l'autodétermination, en déclarant sa souveraineté nationale, un geste audacieux qui a marqué l'effondrement de la domination soviétique. Bien qu'elle fasse encore théoriquement partie de l'URSS, la déclaration de l'Ukraine était plus qu'un simple geste politique : c'était une déclaration d'intention, un signe que le cours de l'histoire était en train de changer.\n\nLe document affirmait la primauté des lois nationales ukrainiennes sur la législation soviétique, un défi direct au contrôle de Moscou. Il a proclamé l'indépendance économique, le droit à sa propre armée et le contrôle total de ses ressources naturelles, positionnant l'Ukraine non pas comme une simple république soviétique mais comme une nation se préparant à son destin. Pour la première fois depuis des décennies, l'idée d'une Ukraine indépendante n'était plus seulement le rêve de dissidents : elle devenait une réalité inscrite dans la loi.\n\nPourtant, la souveraineté ne s'est pas faite sans difficultés. Au Kremlin, cette déclaration était considérée comme un dangereux précédent, une fracture dans les fondements de l'Union soviétique."
  Ukraine.2.d:0 "Pendant trop longtemps, l'Ukraine a été liée à la volonté des empires, son identité éclipsée et sa souveraineté un rêve lointain. Mais quand le moment est enfin venu, la nation n'a pas hésité. Avec une seule déclaration, l'Ukraine a affirmé son droit à se gouverner elle-même, plaçant ses propres lois au-dessus de celles de Moscou et posant les bases d'une véritable indépendance.\n\nLa décision a provoqué une onde de choc dans la hiérarchie soviétique. Au Kremlin, les responsables y ont vu un dangereux précédent, le signe que l'union autrefois incassable était en train de se fracturer. Des avertissements d'effondrement économique et d'instabilité politique ont suivi, mais à Kiev, la voie à suivre était déjà claire. Partout au pays, l'esprit d'indépendance brûlait plus fort que jamais, déclenchant un mouvement qui ne pouvait être arrêté.\n\nPour le peuple ukrainien, il s'agissait de plus qu'une manoeuvre politique : c'était une reconquête de l'histoire, de la culture et du destin. La langue qui avait été supprimée, les traditions mises de côté, les rêves de générations ont désormais retrouvé une nouvelle vie. Le monde a vu l'Ukraine, longtemps considérée comme une république subordonnée, se lever et déclarer que son avenir ne serait décidé que par elle-même.\n\nCependant. Des défis nous attendent, le cap est fixé. Ce qui a commencé comme une déclaration audacieuse de souveraineté allait bientôt devenir une réalité indéniable. L'ère soviétique s'effondrait et l'Ukraine était prête à se relever de ses ruines."