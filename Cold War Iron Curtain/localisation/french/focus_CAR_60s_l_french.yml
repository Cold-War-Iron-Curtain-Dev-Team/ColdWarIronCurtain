l_french: 
 CAR_60s_The_State_of_the_Economy:0 "L'état de l'économie"
 CAR_60s_The_State_of_the_Economy_desc:0 "Les Français ont laissé très peu de ressources à notre colonie. Voyons comment nous pouvons remédier à la situation coloniale."
 CAR_60s_Public_Transportation:0 "Transports publics"
 CAR_60s_Public_Transportation_desc:0 "Bangui est le coeur de notre pays et le centre d'un petit essor industriel. Nous devrions encourager le boom en créant le transport par bus."
 CAR_Revitalization_of_Bangui:0 "Revitaliser Bangui"
 CAR_60s_Revitalization_of_Bangui:0 "Les forces vives de Bangui ont été volées par le régime colonial. Maintenant, nous pouvons le reconstruire."
 CAR_60s_Revitalization_of_Bangui_desc:0 ""
 CAR_60s_Ferry_Services:0 "Service de traversier"
 CAR_60s_Ferry_Services_desc:0 "Une grande partie de notre pays est accessible par le fleuve "
 CAR_60s_Sponsor_Local_Cultural_Festivals:0 "Parrainez la culture locale"
 CAR_60s_Sponsor_Local_Cultural_Festivals_desc:0 "La culture de notre nation a souffert sous la domination coloniale. Nous avons maintenant une chance de le faire revivre."
 CAR_60s_National_Orchestra:0 "Orchestre National"
 CAR_60s_National_Orchestra_desc:0 "D'autres nations ont de nombreux orchestres. Or, notre République n'en a pas. C'est un problème. Nous devons créer un orchestre si nous voulons être considérés comme égaux aux Européens qui nous ont colonisés."
 CAR_60s_Ubangi_River_Infrastructure:0 "Infrastructures du fleuve Oubangui"
 CAR_60s_Ubangi_River_Infrastructure_desc:0 "L'Oubangui est le principal navire de communication et de commerce dans tout notre pays. Il doit être développé davantage afin que nous puissions maintenir le contrôle sur notre vaste pays."
 CAR_60s_Focus_on_Bangui:0 "Focus sur Bangui"
 CAR_60s_Focus_on_Bangui_desc:0 "Bangui est naturellement le lieu du plus grand développement, c'est notre capitale. La décentralisation n'est pas judicieuse car elle mènerait à des révoltes. Les ressources doivent donc être concentrées au coeur de notre nation."
 CAR_60s_All_Roads_lead_to_Bangui:0 "Tous les chemins mènent à Bangui"
 CAR_60s_All_Roads_lead_to_Bangui_desc:0 "Bangui est le coeur de notre nation. C'est là que notre nation s'exprime et c'est là que les gens sont le plus en sécurité et les plus prospères."
 CAR_60s_Equalize_Development:0 "Égaliser le développement"
 CAR_60s_Equalize_Development_desc:0 "Le développement doit être partagé dans toute la République afin de donner à tous une chance de prospérer."
 CAR_60s_Roads_to_Diamonds:0 "Les routes des diamants"
 CAR_60s_Roads_to_Diamonds_desc:0 "Nous devons encourager la chasse aux diamants en construisant un réseau de transport à travers notre pays. Cela stimulera notre économie d'exportation et garantira que chacun ait une chance de s'enrichir."
 
 CAR_60s_Independence_from_Equatorial_Africa:0 "Indépendance de l'État post-équatorial"
 CAR_60s_Independence_from_Equatorial_Africa_desc:0 "Le gouvernement brutal de Gentille est terminé et nous pouvons désormais entamer pleinement la décolonisation."
 CAR_60s_De_Gentillesation:0 "Dégentillisation"
 CAR_60s_De_Gentillesation_desc:0 "Toutes les traces de notre passé réactionnaire brutal doivent être éliminées."
 
 CAR_60s_Independence_from_France:0 "Indépendance de la France"
 CAR_60s_Independence_from_France_desc:0 "Conformément à la décolonisation, nous avons désormais notre indépendance. Il est temps de commencer à résoudre les problèmes du pays."
 CAR_60s_The_Name:0 "Le nom"
 CAR_60s_The_Name_desc:0 "La chose la plus simple à changer dans notre nation est son nom. C'est aussi la chose la plus notable que nous puissions changer. Comment allons-nous nous appeler ?"
 CAR_60s_Central_African_Republic:0 "République centrafricaine"
 CAR_60s_Central_African_Republic_desc:0 "Le nom de République Centrafricaine est nouveau. Nous devons nous éloigner du nom colonial et tribal d'Oubangui-Chari pour nous projeter vers un nouvel avenir."
 CAR_60s_Republic_of_All_of_the_Peoples:0 "République de tous les peuples"
 CAR_60s_Republic_of_All_of_the_Peoples_desc:0 "Nous devons tout accepter et reconnaître que les tribus sont dépassées pour un pays du XXe siècle."
 CAR_60s_Ubangi_Shan:0 "Oubangui-Chari"
 CAR_60s_Ubangi_Shan_desc:0 "Le nom qui résonne le plus au sein de notre peuple est notre nom d'être entre deux fleuves, l'Oubangui et le Shari."
 CAR_60s_Tribal_Democracy:0 "Démocratie tribale"
 CAR_60s_Tribal_Democracy_desc:0 "Nous devons reconnaître que nous avons des groupes tribaux dans notre pays et nous devons ensuite leur donner le pouvoir."
 CAR_60s_President_Goumba:0 "Président Goumba"
 CAR_60s_President_Goumba_desc:0 "M. Goumba a guidé l'indépendance de notre pays vis-à-vis de la France. Il aura le privilège de devenir notre premier Président."
