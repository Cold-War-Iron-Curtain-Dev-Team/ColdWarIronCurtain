 GENEVA_UI_HELP_TT: "§WComment fonctionne la conférence§!\nSept articles sont sur la table. Chaque semaine, les délégations votent sur chacune d'elles : le vote d'une délégation représente son §WPoids§! fois l'importance qu'elle accorde à la clause, plus les enjeux éventuels. L'option gagnante est déposée.\n\n§WCliquez sur une clause§! dans l'Ordre du jour pour négocier dessus, et §Wcliquez sur une option§! pour choisir le résultat que vous défendrez. §WCliquez sur une chaise§! pour cibler cette délégation avec Pressure ou Back-Channel.\n\nChaque délégation peut effectuer §Wdeux actions§! par tour. Champion et Menace ouvrent une négociation de trois jours dont l'enjeu se retrouve lors du prochain vote.\n\n§GD'accord§!: une option qui remporte deux votes d'affilée sans que personne ne pousse ou négocie la clause est retenue pour le reste de la conférence.\n§RNon négociable§!: lorsqu'une délégation centrale menace de se retirer sur une clause et que son option l'emporte alors, la clause est réglée selon ses termes.\n\nLes délégations perdent §WPatience§! alors que la table va contre elles ; à zéro, ils s'en vont. Si deux des principaux belligérants se retirent ou si aucun cessez-le-feu n'est obtenu lors du vote final, la conférence s'effondre et la guerre reprend. Dans le cas contraire, les accords sont signés après le dixième tour, ou plus tôt si une délégation principale force le vote."
