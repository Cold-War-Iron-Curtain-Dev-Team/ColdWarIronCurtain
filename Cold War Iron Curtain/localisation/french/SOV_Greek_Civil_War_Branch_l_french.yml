l_french:
 # ============================================================================
 #  THE GREEK QUESTION - Greek Civil War side branch (SOV / Stalin tree)
 #  Two mutually exclusive arms, chosen at sov_percentage_agreement.1.
 # ============================================================================

 # ---- Events ----
 sov_greek_question.1.t:0 "Moscou abandonne les communistes grecs"
 sov_greek_question.1.d:0 "L'Armée démocratique grecque a été détruite sur les crêtes de Grammos et de Vitsi, et l'Union soviétique n'a pas levé le petit doigt pour l'en empêcher.\n\nCe n'était pas une négligence. Le camarade Staline a donné sa réponse à la question grecque dans un salon de Moscou en octobre 1944, lorsqu'il a regardé une feuille de papier sur laquelle la Grande-Bretagne s'était vu attribuer quatre-vingt-dix pour cent de la Grèce, et qu'il l'a cochée. Depuis, tout a découlé de ce tick.\n\nLe KKE s'est battu pendant quatre ans, convaincu que le camp socialiste le soutenait. Ce n'est pas le cas, et les survivants du parti découvrent aujourd'hui ce que vaut un pourcentage inscrit sur un bout de papier."
 sov_greek_question.1.a:0 "La Grèce n'a jamais été à nous pour gagner."

 sov_greek_question.2.t:0 "Échange d'ambassadeurs à Moscou et à Athènes"
 sov_greek_question.2.d:0 "Pour la première fois depuis la guerre civile, il y a des diplomates soviétiques à Athènes et des diplomates grecs à Moscou.\n\nLe gouvernement grec a passé quatre ans à décrire l'Union soviétique comme l'auteur de sa catastrophe nationale, et une grande partie de l'opinion publique grecque continue de le faire. Mais la Grèce est un petit pays avec une économie en ruine et un grand voisin, et le ministère des Affaires étrangères, Vasilissis Sofias, a conclu qu'une hostilité permanente est un luxe qu'elle ne peut se permettre."
 sov_greek_question.2.a:0 "Même les ennemis ont des ambassades."

 sov_greek_question.3.t:0 "La question chypriote"
 sov_greek_question.3.d:0 "La Grèce a porté le différend chypriote devant les Nations Unies et, ce faisant, s'est opposée à la Grande-Bretagne, à la Turquie et à l'alliance à laquelle appartiennent tous les trois.\n\nLa position de Moscou n'exige aucun cynisme pour l'énoncer et un cynisme considérable pour la maintenir : nous soutenons le droit du peuple chypriote à l'autodétermination. Que cela se traduise par un fossé entre trois membres de l'OTAN en Méditerranée orientale est une coïncidence dont nous entendons tirer le meilleur parti."
 sov_greek_question.3.a:0 "Laissons l'alliance discuter avec elle-même."

 sov_greek_question.4.t:0 "Une République populaire en Grèce"
 sov_greek_question.4.d:0 "L'Armée Démocratique a pris Athènes. La monarchie a fui, le gouvernement avec elle, et pour la première fois un État communiste se dresse sur la Méditerranée avec ses propres ports et ses propres mouillages.\n\nIl est difficile d'exagérer la conséquence stratégique. La Méditerranée orientale, que les Britanniques considèrent comme un lac impérial depuis Nelson, compte désormais sur sa rive nord une puissance alignée sur les Soviétiques. La Turquie est flanquée. La Sixième Flotte a perdu ses approches nord.\n\nLes pourcentages de Winston Churchill ne sont pas simplement cassés. Ils sont lus à Athènes comme une preuve de ce que l'Occident était prêt à échanger."
 sov_greek_question.4.a:0 "La Méditerranée n'est plus leur lac."

 sov_greek_question.5.t:0 "L'aventure grecque s'effondre"
 sov_greek_question.5.d:0 "L'Armée Démocratique est finie. Ce qui en reste a traversé la frontière entre l'Albanie et la Bulgarie, ou s'est rendu, ou a été abattu.\n\nMoscou a joué ouvertement et a perdu ouvertement. Tous les capitaux neutres qui pesaient la balance en Méditerranée orientale voient désormais l'Union soviétique s'engager auprès d'un client et échouer à le sauver. Athènes est en permanence dans le camp occidental, les Américains ont leurs bases et tout le flanc sud est dans un état pire qu'avant nos débuts.\n\nEt les restes en retraite ont emporté avec eux la guerre vers le nord. L'Albanie est la suivante."
 sov_greek_question.5.a:0 "Une défaite que nous avons choisie."

 sov_greek_question.6.t:0 "Tenir la ligne albanaise"
 sov_greek_question.6.d:0 "La contre-révolution en Albanie a été assemblée à Athènes et à Londres à partir des décombres de la guerre grecque, et elle est dirigée par des hommes qui viennent de voir l'Union soviétique perdre un client et qui parient qu'elle en perdra un autre.\n\nLe régime du camarade Hoxha est isolé, encerclé et entièrement dépendant de ce qui arrive par voie maritime depuis Odessa. Quoi que le Présidium pense de lui en privé, l'Albanie ne peut pas tomber sur le même argument qui a fait perdre la Grèce.\n\nLes fournitures bougent. Cette fois, nous n'allons pas nous coucher."
 sov_greek_question.6.a:0 "Pas deux fois."

 # ---- Focuses: historical arm ----
 SOV_gpa_honour_the_agreement:0 "Honorer l'accord de pourcentage"
 SOV_gpa_honour_the_agreement_desc:0 "En octobre 1944, Churchill écrivit les Balkans sur une demi-feuille de papier - la Roumanie à quatre-vingt-dix pour cent est la nôtre, la Grèce à quatre-vingt-dix pour cent la leur - et le camarade Staline l'a marqué d'une coche bleue et l'a repoussé sur la table.\n\nQuoi que le KKE pense avoir été promis, cela relève de la politique soviétique. Les communistes grecs se battront et perdront sans nous, et l'Union soviétique acquerra en Occident la réputation de respecter des marchés qui vaudront bien plus que la Grèce."
 SOV_gpa_honour_the_agreement_tt:0 "La question grecque est réglée aux conditions occidentales. Gagnez §Yde stabilité§! et réduisez la tension mondiale."

 SOV_gpa_abandon_the_kke:0 "Abandonnez le KKE"
 SOV_gpa_abandon_the_kke_desc:0 "L'Armée Démocratique réclame des armes, la reconnaissance et une voix soviétique aux Nations Unies. Il n'en recevra aucun.\n\nL'ordre passe par le Kominform : pas d'armes, pas de couverture diplomatique et pression sur Belgrade et Sofia pour qu'elles ferment les frontières. On ne dira pas au camarade Zachariadis qu'il a été radié. Il constatera simplement que rien n'arrive."
 SOV_gpa_abandon_the_kke_tt:0 "Les communistes grecs sont lâchés. Les relations avec le §YPDG§! et la §YYougoslavie§! se détériorent.\nLa tension mondiale et la projection de la puissance étrangère soviétique diminuent."

 SOV_gpa_the_tashkent_exile:0 "L'exil de Tachkent"
 SOV_gpa_the_tashkent_exile_desc:0 "Quelque cinquante mille combattants, cadres et leurs familles ont franchi la frontière nord devant l'armée grecque. Ils ne peuvent pas rester dans les Balkans ni rentrer chez eux.\n\nIls seront réinstallés en Ouzbékistan, à Tachkent, où la direction du parti pourra rester unie, utile et maintenue très loin de la Grèce. Certains d'entre eux y passeront le reste de leur vie."
 SOV_gpa_the_tashkent_exile_tt:0 "Les exilés communistes grecs sont réinstallés en Asie centrale. Gagnez §Yde main d'oeuvre§! et de pouvoir politique à un faible coût pour la stabilité."

 SOV_gpa_deport_the_black_sea_greeks:0 "Déporter les Grecs de la mer Noire"
 SOV_gpa_deport_the_black_sea_greeks_desc:0 "Les communautés grecques de la côte de la mer Noire y vivent depuis l'Antiquité. Le MGB a conclu qu'une population dont les parents se trouvent du mauvais côté d'une frontière hostile est une population à laquelle on ne peut pas faire confiance.\n\nL'opération Volna les déplacera vers l'est - de la Crimée, du Kouban et du littoral du Caucase jusqu'au Kazakhstan et à l'Asie centrale. La justification est la sécurité. Le raisonnement n'a pas changé depuis les Tchétchènes, les Tatars et les Allemands de la Volga."

 SOV_gpa_restore_diplomatic_relations:0 "Restaurer les relations diplomatiques"
 SOV_gpa_restore_diplomatic_relations_desc:0 "Avec la fin de la guerre civile et le départ du camarade Staline, Moscou et Athènes n'ont plus aucune raison de prétendre que l'autre n'existe pas.\n\nLes ambassadeurs seront échangés et la guerre de propagande prendra fin. La Grèce restera dans l'OTAN - cela n'est pas en question - mais une Grèce qui nous parle est une Grèce qu'on peut parfois persuader d'être en désaccord avec Washington."
 SOV_gpa_restore_diplomatic_relations_tt:0 "Des ambassadeurs sont échangés avec la Grèce. §YL'influence soviétique§! en Grèce augmente aux dépens des États-Unis et la tension mondiale diminue."

 SOV_gpa_the_trade_agreement:0 "L'accord commercial soviéto-grec"
 SOV_gpa_the_trade_agreement_desc:0 "La Grèce cultive du tabac, des groseilles et des olives et les vend à une Europe occidentale qui cultive la plupart des mêmes choses.\n\nL'Union Soviétique ne le fait pas et peut absorber la totalité du surplus grec à des prix qu'aucun acheteur occidental ne pourra égaler. Chaque drachme de ce commerce est une affaire grecque qui a une raison de s'opposer à la guerre économique, et un gouvernement grec qui a encore une chose à perdre."
 SOV_gpa_the_trade_agreement_tt:0 "Accès mutuel §Yau marché§! avec la Grèce et un gain budgétaire substantiel."

 SOV_gpa_the_cyprus_question:0 "La question chypriote"
 SOV_gpa_the_cyprus_question_desc:0 "Chypre est britannique, majoritairement peuplée de Grecs et revendiquée par Athènes. La Turquie s'oppose catégoriquement à l'union. Tous trois sont membres de la même alliance.\n\nNous soutiendrons l'autodétermination de Chypre aux Nations Unies. Cette position est défendable en principe, populaire en Grèce et calculée pour opposer simultanément Athènes à Londres et à Ankara. Parfois, la position honnête et la position utile sont la même position."
 SOV_gpa_the_cyprus_question_tt:0 "Les relations de la Grèce avec §Yla Grande-Bretagne§! et §Yla Turquie§! se détériorent fortement.\nLa popularité communiste en Grèce augmente, tout comme la projection de la puissance étrangère soviétique."

 # ---- Focuses: intervention arm ----
 SOV_gci_intervene_in_greece:0 "Intervenir dans la guerre civile grecque"
 SOV_gci_intervene_in_greece_desc:0 "Les pourcentages ont été écrits sur un bout de papier par un homme qui ne gouverne plus la Grande-Bretagne, et il y a une armée communiste sur le terrain en Grèce qui se demande pourquoi la patrie socialiste ne l'aidera pas.\n\nLa réponse, à partir d'aujourd'hui, est oui. L'Armée démocratique sera reconnue, armée et intégrée à notre système d'alliance, et si cela signifie des divisions soviétiques sur la mer Égée, qu'il en soit ainsi.\n\nLa réaction occidentale sera sévère. Si cela fonctionne, cela arrivera également trop tard."
 SOV_gci_intervene_in_greece_tt:0 "Reconnaissez et rejoignez la guerre aux côtés du gouvernement démocratique provisoire §Y§!.\nLe PDG entre dans notre faction et dans notre sphère."

 SOV_gci_arm_the_democratic_army:0 "Armer l'Armée Démocratique"
 SOV_gci_arm_the_democratic_army_desc:0 "L'Armée Démocratique combat dans les montagnes avec les fusils italiens capturés et tout ce que Tito peut épargner. Il ne peut pas prendre une ville ni tenir une plaine.\n\nCela change maintenant. L'artillerie, les armes légères, le génie et les officiers soviétiques se déplaceront en quantité vers le sud à travers la Bulgarie, et les bandes de guérilla des Grammos seront réorganisées en quelque chose qui pourra marcher sur Athènes."
 SOV_gci_arm_the_democratic_army_tt:0 "Le PDG reçoit §Yéquipement§!, §Yeffectifs§! et §Yexpérience militaire§!.\nLa projection de la puissance étrangère soviétique diminue tandis que les expéditions se poursuivent."

 SOV_gci_a_peoples_republic_in_greece:0 "Une République populaire en Grèce"
 SOV_gci_a_peoples_republic_in_greece_desc:0 "Athènes est tombée et le royaume de Grèce a cessé d'exister.\n\nLa tâche est maintenant de rendre la victoire permanente : intégrer la nouvelle république au COMECON, reconstruire ce que quatre années de guerre civile ont détruit et faire en sorte que le gouvernement qui émerge réponde à Moscou plutôt qu'à Belgrade.\n\nPour la première fois, le camp socialiste dispose d'un littoral méditerranéen."
 SOV_gci_a_peoples_republic_in_greece_tt:0 "La Grèce rejoint §YCOMECON§!. Gain important de pouvoir politique et projection de la puissance étrangère soviétique."

 SOV_gci_assist_greek_reconstruction:0 "Aider à la reconstruction grecque"
 SOV_gci_assist_greek_reconstruction_desc:0 "La Grèce est en guerre presque continuellement depuis 1940 - occupation, famine, résistance, puis quatre années de massacres de Grecs. Les routes ont disparu, les ports sont détruits et un dixième de la population a été déplacée.\n\nMoscou paiera la reconstruction. Cela coûte cher, et c'est le prix à payer pour que la nouvelle république soit une entreprise continue plutôt qu'un passif permanent."

 SOV_gci_military_bases_in_greece:0 "Établir des bases militaires en Grèce"
 SOV_gci_military_bases_in_greece_desc:0 "Ce que vaut la Grèce, ce n'est pas son économie. C'est la situation.\n\nLes aérodromes de Thessalie, les radars sur les îles et l'accès de la flotte à la mer Égée placent les avions soviétiques à portée des approches de Suez et les navires soviétiques derrière le détroit de Turquie plutôt que devant eux. Tous les calculs effectués par la Royal Navy et la Sixième Flotte sur la Méditerranée orientale depuis 1945 devront être refaits."

 SOV_gci_bosphorus_border_changes:0 "Faire pression pour des changements à la frontière du Bosphore"
 SOV_gci_bosphorus_border_changes_desc:0 "Avec la Grèce sécurisée et la Turquie isolée, la question qui préoccupe les hommes d'État russes depuis Catherine peut enfin être rouverte.\n\nLes détroits, les territoires arméniens et kurdes ainsi que les revendications grecques en Thrace et en Anatolie sont tous sur la table en même temps. Ankara peut accepter un règlement ou affronter la Grèce, la Bulgarie et l'Union soviétique sur trois fronts, sans aucune alliance sur laquelle faire appel."

 SOV_gci_the_greek_defeat:0 "La défaite grecque"
 SOV_gci_the_greek_defeat_desc:0 "L'Armée démocratique a été détruite et le Gouvernement démocratique provisoire n'existe plus.\n\nMoscou s'est engagé publiquement et a publiquement échoué. Les dégâts ne se limitent pas à la Grèce : tous les gouvernements, d'Ankara à Rome, ont désormais compris ce que vaut le soutien soviétique lorsque les Américains décident de le contester sérieusement.\n\nIl n'y a pas moyen de sauver cela. Il n'y a qu'une limite à ce que cela nous coûte ensuite."
 SOV_gci_the_greek_defeat_tt:0 "L'intervention a échoué. Perdez §Yla stabilité§!, §Yle soutien de guerre§! et une grande partie de la projection de puissance étrangère."

 SOV_gci_hold_the_albanian_line:0 "Tenez la ligne albanaise"
 SOV_gci_hold_the_albanian_line_desc:0 "Les mêmes réseaux qui ont brisé l'Armée démocratique se sont tournés vers le nord. L'Albanie mène désormais sa propre contre-révolution, armée et dirigée de l'extérieur, et le régime du camarade Hoxha est le plus isolé d'Europe.\n\nL'Albanie n'a pas de frontière commune avec le camp socialiste. Tout ce dont il a besoin doit être acheminé par voie maritime, au-delà d'une Méditerranée contrôlée par les marines occidentales. Cela viendra de toute façon."
 SOV_gci_hold_the_albanian_line_tt:0 "Il faut §YL'Albanie soit en guerre contre les royalistes§!.\nL'Albanie reçoit du matériel, de la main-d'oeuvre et de la stabilité, et l'allocation des volontaires à l'Albanie augmente."

 SOV_gci_the_kke_in_exile:0 "Le KKE en exil"
 SOV_gci_the_kke_in_exile_desc:0 "Ce qui reste du parti grec a franchi les frontières du Nord : des combattants, des cadres, des familles, des dizaines de milliers d'entre eux, avec rien d'autre que ce qu'ils transportaient.\n\nIls seront réinstallés et les dirigeants resteront intacts. Un parti en exil n'est pas vraiment un atout, mais c'est un atout, et la Grèce finira par organiser à nouveau des élections."
 SOV_gci_the_kke_in_exile_tt:0 "Les exilés grecs sont réinstallés. Gagnez §Yd'effectifs§!.\nLa popularité communiste augmente en Grèce, mais Athènes ne nous pardonnera pas."

 SOV_gci_rebuild_the_southern_flank:0 "Reconstruire le flanc sud"
 SOV_gci_rebuild_the_southern_flank_desc:0 "La Grèce est perdue, la Yougoslavie est hostile et l'Albanie tient à peine. L'approche méridionale du camp socialiste constitue la frontière la plus faible de l'Union soviétique.\n\nLa Bulgarie devient le point d'ancrage. Des garnisons, des aérodromes renforcés et une présence militaire soviétique permanente garantiront que quelles que soient les autres tentatives de l'alliance occidentale dans les Balkans, elles s'arrêteront au Danube."
 SOV_gci_rebuild_the_southern_flank_tt:0 "Les relations avec §YBulgarie§! et §YAlbanie§! s'améliorent considérablement.\nGagnez en pouvoir politique, en stabilité et en projection de puissance étrangère. La politique militaire se durcit."

 # ---- Threats ----
 SOV_gpa_abandon_kke_threat:0 "La Grèce abandonnée"
 SOV_gpa_normalization_threat:0 "Normalisation soviéto-grecque"
