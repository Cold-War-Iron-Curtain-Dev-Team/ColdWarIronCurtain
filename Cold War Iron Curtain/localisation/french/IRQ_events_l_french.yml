 IRQ.1754.t:0 "La réponse de l'Irak"
 IRQ.1754.d:0 "Ce matin, dès les heures d'ouverture, le président Saddam Hussein a donné son feu vert à une contre-opération en réponse au bombardement iranien des villages de Zain al-Qaws et de Saif Saad.\n\nSous les ordres du haut commandement irakien, une opération limitée a été exécutée qui a vu le déploiement de deux avions d'attaque Su-20 qui ont décollé des aérodromes d'Al-Faw et ont traversé le Shatt-al Arab.\n\nLa première frappe a été dirigée contre des batteries d'artillerie iraniennes soupçonnées par Bagdad d'avoir participé à l'attaque menée contre l'Irak. Les deux Su-20 ont lancé des salves de roquettes S-5 de 57 mm, balayant et détruisant les positions identifiées avant de se retirer de la zone immédiate. Le commandement militaire irakien affirme que plus de dix canons iraniens, quinze véhicules de soutien et l'ensemble de la position défensive ont été touchés, même si l'étendue totale des dégâts reste incertaine.\n\nAprès l'attaque, les deux avions sont rentrés sains et saufs sur le territoire irakien. En quelques heures, les stations de radio et de télévision irakiennes ont diffusé la nouvelle du raid dans tout le pays. Les médias d'État ont présenté la mission comme une démonstration de l'état de préparation et des capacités de l'Irak, ainsi que de sa volonté de défendre chaque partie de son territoire. Les images des deux pilotes rentrant sains et saufs ont été accompagnées d'éloges triomphants, les chaînes de télévision déclarant que les provocations iraniennes ne resteraient plus sans réponse de la part de l'armée irakienne.\n\nLe président Saddam Hussein lui-même a décrit l'opération comme une démonstration de la ruse, de la force et de la détermination de l'Irak face à la menace imminente de l'Iran. Dans une déclaration diffusée par les chaînes de télévision d'État, il a averti que l'Irak ne cherchait ni l'humiliation ni une guerre inutile avec son voisin, mais qu'il répondrait à l'appel à l'agression par l'agression et défendrait la souveraineté du pays.\n\nL'attaque a cependant suscité des tensions au sein de la communauté internationale, beaucoup sentant la possibilité d'une guerre bientôt déclenchée par les deux ennemis, tandis que d'autres défendent la décision de l'Irak comme une démonstration de souveraineté."