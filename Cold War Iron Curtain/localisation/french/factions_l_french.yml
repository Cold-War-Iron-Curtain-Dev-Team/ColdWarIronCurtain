 ## Manifests
 defense_of_democracy_goal_name: "Défense de la démocratie"
 defense_of_democracy_goal_desc: "La démocratie est menacée. Nous devons travailler ensemble pour garantir que les pays démocratiques du monde ne s'effondrent pas un par un."
 containment_of_communism_goal_name: "Endiguement du communisme mondial"
 containment_of_communism_goal_desc: "Le monde ne pourra être en sécurité tant que la menace communiste ne sera pas maîtrisée."
 suppress_regional_fascism_goal_name: "Supprimer le fascisme"
 suppress_regional_fascism_goal_desc: "Le fascisme menace de se propager comme une traînée de poudre. Plus il y aura de pays qui tomberont entre ses griffes, plus la situation autour de nous deviendra dangereuse."
 suppress_regional_communism_goal_name: "Supprimer le communisme dans [ROOT.GetCountryContinent]"
 suppress_regional_communism_goal_desc: "Nous devons faire tout ce qu'il faut pour garder un maximum de [ROOT.GetCountryContinent] à l'abri du joug communiste."
 regional_expansionism_goal_name: "Expansion dans [ROOT.GetCountryContinent]"
 regional_expansionism_goal_desc: "Notre faction devrait prendre les devants et dominer [ROOT.GetCountryContinent]"
 suppress_regional_democracy_goal_name: "Supprimer la démocratie"
 suppress_regional_democracy_goal_desc: "Les pays dits démocratiques constituent la plus grande menace pour nos idéaux. Nous devons nous assurer qu'ils ne contrôlent qu'une minorité de [ROOT.GetCountryContinent]."
 between_the_seas_goal_name: "Entre les mers"
 between_the_seas_goal_desc: "En créant un solide mur de territoires alliés, de la mer Noire à la Baltique, nous pouvons résister à toute menace potentielle."
 little_entente_goal_name: "Faire respecter les traités de paix de Paris"
 little_entente_goal_desc: "Les traités de paix de Paris stipulaient les frontières de [GER.GetName], [HUN.GetName], [BUL.GetName]et [AUS.GetName]. Notre objectif principal est de garantir que ces pays ne commencent pas à annexer des territoires frontaliers et à détruire une fois de plus la paix en Europe."
 china_territorial_integrity_goal_name: "Intégrité territoriale"
 china_territorial_integrity_goal_desc: "La Chine doit être libérée et unie sous un seul parti au pouvoir. Ce n'est qu'en reprenant le contrôle de nos territoires face aux ennemis extérieurs et intérieurs que nous pourrons redonner à la Chine sa gloire."
 china_chinese_consolidation_goal_name: "Consolidation chinoise"

 china_wang_front_expansion_name: "Triomphe de l'impérialisme"
 china_wang_front_expansion_desc: "Il est temps de contrer l'influence des puissances colonialistes sur l'Asie de l'Est. Nous devons construire notre propre bloc de pouvoir dans la région, afin de ne plus jamais être dominés."
 china_asian_democratic_union_name: "$china_wang_front_expansion_name$"
 china_asian_democratic_union_desc: "$china_wang_front_expansion_desc$"
 strength_in_unity_goal_name: "La force dans l'unité"
 strength_in_unity_goal_desc: "Les pays de notre coin du monde devraient s'unir. En construisant une faction forte, nous avons les meilleures chances possibles de rester indépendants et neutres."
 conquest_of_territory_goal_name: "Conquête et domination"
 conquest_of_territory_goal_desc: "Dans un monde hostile, l'expansion est vitale pour la survie. L'expansion crée des zones tampons et nous donne accès à davantage de ressources."
 spread_of_communism_goal_name: "La révolution mondiale"
 spread_of_communism_goal_desc: "Le moment est venu pour les masses de se lever. Et là où les masses ne parviennent pas à se soulever, nous devons les aider par la force des armes."

 control_of_the_balkans_goal_name: "Sécurité des Balkans"
 control_of_the_balkans_goal_desc: "Les puissances extérieures ont toujours tenté d'étendre leur influence dans les Balkans. Nous devons veiller à rester forts ensemble et contrer toute incursion étrangère dans la région."

 african_decolonization_goal_name: "Décolonisation africaine"
 african_decolonization_goal_desc: "Le moment est venu pour l'Afrique de se dresser contre ses adversaires et ses oppresseurs. Il faut libérer le continent, par la force s'il le faut !"

 habsburg_hegemony_goal_name: "Hégémonie des Habsbourg"
 habsburg_hegemony_goal_desc: "La famille est la partie la plus importante de toute union, et notre alliance n'est pas différente. Nous devons sécuriser les couronnes de l'Europe et étendre notre influence partout."

 indifference_is_a_threat_goal_name: "L'indifférence est une menace"
 indifference_is_a_threat_goal_desc: "Avec un conflit majeur presque inévitable en Europe, nous devons veiller à ce qu'il n'y ait pas de surprises. Tout pays refusant de prendre parti doit être écarté."

 security_through_expansion_goal_name: "La sécurité grâce à l'expansion"
 security_through_expansion_goal_desc: "Nous devons créer un bouclier autour de notre territoire et sécuriser un cercle d'États autour de nos frontières actuelles."

 an_iron_curtain_goal_name: "Un rideau de fer"
 an_iron_curtain_goal_name_desc: "Afin de mieux protéger la patrie, nous devons créer un rideau d'États fantoches autour de nous pour empêcher tout visiteur indésirable d'entrer."
 eastern_european_security_goal_name: "Sécurité en Europe de l'Est"
 eastern_european_security_goal_desc: "Afin de mieux protéger nos intérêts en Europe de l'Est, nous devons intervenir et mettre en place des régimes partageant les mêmes idées à l'Ouest."

 mare_nostrum_goal_name: "Mare Nostrum"
 mare_nostrum_goal_desc: "Notre peuple a toujours rêvé de faire de la Méditerranée sa propre mer intérieure. Le moment est venu de faire de ce rêve une réalité !"

 pax_romana_goal_name: "Pax Romana"
 pax_romana_goal_desc: "Notre peuple a toujours rêvé de restaurer la gloire de l'Empire romain. Le moment est venu de faire de ce rêve une réalité !"

 ## Short term Goals
 building_up_guam_goal_name: "Agrandir la base navale de Guam"
 building_up_guam_goal_desc: "Nous devons sécuriser la connexion à [PHI.GetNameDef], en cas de conflit avec [JAP.GetName]. De plus, il serait très avantageux d'avoir un point d'arrêt plus proche pour nos marines, si jamais nous entrions en guerre contre le [JAP.GetAdjective]. [638.GetName] convient parfaitement."
 the_two_seas_goal_name: "Établir une présence dans la Baltique et la mer Noire"
 the_two_seas_goal_desc: "Nous devons garantir une forte présence navale dans la mer Baltique ainsi que dans la mer Noire."
 one_germany_goal_name: "Unir les États allemands"
 one_germany_goal_desc: "Afin de construire une base de pouvoir forte et unie, nous devons d'abord veiller à ce que l'Allemagne soit forte et unie. Les traités de paix de Paris interdisaient toute réunification allemande. Il est désormais temps de prouver que nous ne sommes pas liés par des traités inutiles."
 guardians_of_peace_goal_name: "Maintenir la paix mondiale"
 guardians_of_peace_goal_desc: "Des nuages orageux se forment à l'horizon. Nous devons éviter que la guerre n'éclate trop tôt, afin que notre alliance ait le temps de se préparer correctement à l'inévitable conflit."
 growing_the_faction: "Développez la faction"
 growing_the_faction_desc: "Notre faction doit compter davantage de membres si elle veut être prise au sérieux sur la scène géopolitique."
 a_large_faction_goal_name: "Invitez plus de pays dans notre faction"
 a_large_faction_goal_desc: "En grandissant encore, notre faction sera en mesure de projeter son influence encore plus loin."
 preemptive_strike_on_fascism_goal_name: "Lancer une frappe préventive contre un pays fasciste"
 preemptive_strike_on_fascism_goal_desc: "Nous ne devrions pas attendre qu'ils nous frappent. Nous devons nous assurer que nous avons l'initiative."
 a_great_fortress_goal_name: "Construisez des fortifications plus solides"
 a_great_fortress_goal_desc: "La préparation est la clé. En sécurisant les régions frontalières et les points clés, à l'aide des fortifications les plus modernes, nous pouvons garantir que l'ennemi ne pourra pas nous vaincre."
 aggressive_defense_goal_name: "Infliger des dégâts aux agresseurs"
 aggressive_defense_goal_desc: "Nous ne céderons pas un pouce à l'ennemi. Il faut faire comprendre à nos soldats que la clé n'est pas de mourir pour notre pays, mais de faire mourir l'ennemi pour le leur."
 war_on_communism_goal_name: "Déclarez la guerre au communisme"
 war_on_communism_goal_desc: "Nous devons arrêter la propagation du communisme par tous les moyens nécessaires."
 war_on_democracy_goal_name: "Déclarez la guerre à la démocratie"
 war_on_democracy_goal_desc: "Nous devons frapper nos ennemis idéologiques."
 defeat_of_communism_goal_name: "Vaincre le communisme"
 defeat_of_communism_goal_desc: "Pour vaincre le communisme mondial, nous devons commencer chez nous en éradiquant le communisme dans notre partie du monde."
 defeat_of_fascism_goal_name: "Vaincre le fascisme"
 defeat_of_fascism_goal_desc: "Pour arrêter une fois pour toutes la propagation du fascisme, nous devons commencer chez nous en éradiquant le fascisme dans notre région du monde."
 defeat_of_anti_communists_goal_name: "Vaincre les contre-révolutionnaires"
 defeat_of_anti_communists_goal_desc: "La première étape vers une révolution mondiale est la conversion réussie des puissances régionales qui s'y opposent. Nous devons donc avant tout éliminer toute menace sur notre propre continent."
 defeat_of_anti_fascists_goal_name: "Répandre le fascisme sur le continent"
 defeat_of_anti_fascists_goal_desc: "Nous devons viser à détruire les gouvernements antifascistes de notre continent."
 defeating_our_enemies_goal_name: "Gagner la guerre"
 defeating_our_enemies_goal_desc: "Les temps sont incertains et la guerre est inévitable. Nous devons veiller à ce que, quelle que soit la situation de la guerre, nous finissions du côté des vainqueurs."
 is_victor_in_pc_tt: "Est du côté des gagnants dans une conférence de paix"
 a_military_base_goal_name: "Développer l'industrie militaire"
 a_military_base_goal_desc: "La croisade contre le communisme nécessite des armes. Afin de produire des armes en grande quantité, nous avons besoin d'une industrie militaire forte."
 a_military_base_tech_bonus: "$a_military_base_goal_name$ Bonus d'objectif"
 resource_control_goal_name: "Ressources stratégiques sécurisées"
 resource_control_goal_desc: "La faction doit s'assurer qu'elle dispose des ressources dont elle a besoin pour affronter n'importe quelle menace dans le monde"
 secure_european_continent_goal_name: "Établir la Forteresse Europe"
 secure_european_continent_goal_desc: "Nous devons veiller à ce que le continent européen soit aligné sur notre cause. Le [faction.GetName] devrait régner en maître en Europe."
 secure_north_africa_goal_name: "Sécuriser l'Afrique du Nord"
 secure_north_africa_goal_desc: "Nous devons non seulement nous efforcer de dominer l'Europe, mais aussi veiller à ce que nous puissions obtenir plus qu'un simple pied en Afrique du Nord."
 an_armored_fist_goal_name: "Développez nos forces blindées"
 an_armored_fist_goal_desc: "Les temps nouveaux créent des opportunités pour de nouvelles guerres. Les chars sont l'avenir. Nous devons nous assurer que nous, en tant que faction, disposons de suffisamment de ressources pour dominer le champ de bataille."
 an_infantry_army_goal_name: "Développez nos forces d'infanterie"
 an_infantry_army_goal_desc: "La colonne vertébrale de toute armée est son infanterie. Nous avons besoin d'une armée d'infanterie importante pour étayer nos revendications tant sur la scène diplomatique que sur le terrain."
 high_seas_fleet_goal_name: "Développer la flotte de navires capitaux"
 high_seas_fleet_goal_desc: "Veiller à ce que nos ennemis n'aient pas le contrôle de l'Atlantique Nord est essentiel à nos opérations. Si nous pouvons perturber cela, cela signifie que nous ne subirons pas les effets d'un blocus naval et que nos flottes pourront se déplacer librement."
 high_seas_fleet_tech_bonus: "$high_seas_fleet_goal_name$ Bonus d'objectif"
 control_the_chinese_coast_goal_name: "Maintenir le contrôle du littoral"
 control_the_chinese_coast_goal_desc: "En cas d'attaque, nous devrions nous efforcer de maintenir l'accès à la mer aussi longtemps que possible. Notre survie est liée à notre capacité à recevoir des marchandises en provenance des pays d'outre-mer."
 guerilla_expansion_goal_name: "Organiser la Résistance"
 guerilla_expansion_goal_desc: "Nous ne serons peut-être pas en mesure de lutter contre les envahisseurs selon leurs propres conditions, nous les contesterons donc selon nos conditions."
 industrial_expansion_goal_name: "Expansion industrielle"
 industrial_expansion_goal_desc: "La meilleure façon de créer une faction forte est de disposer d'une base industrielle solide. Nous devons nous assurer que nous disposons de la force industrielle nécessaire pour devenir une puissance importante."
 industrial_domination_goal_name: "Développer l'industrie civile"
 industrial_domination_goal_desc: "La guerre moderne repose avant tout sur les capacités de production. Assurons-nous de disposer de la plus grande capacité industrielle que le monde ait jamais connue."
 industrial_expansion_tech_bonus: "$industrial_expansion_goal_name$ Bonus d'objectif"
 industrial_research_goal_name: "Recherche $civil_engineering_IV$"
 industrial_research_goal_desc: "Afin de devenir un acteur dominant, nous devons nous assurer que nous disposons du savoir-faire industriel au sein de la faction."

 secure_chinese_waters_goal_name: "Sécuriser les eaux chinoises"
 secure_chinese_waters_goal_desc: "Nous pouvons dominer sur terre, mais avec un long littoral, faire en sorte que personne ne puisse nous envahir devrait être la priorité absolue. Cette sécurité commence loin en mer."
 faction_goal_subjugate_the_faction_name: "Soumettre la faction"
 faction_goal_subjugate_the_faction_desc: "La seule façon pour nous de résister à l'assaut des envahisseurs étrangers est de présenter un front uni doté d'un leadership fort. De nombreuses voix différentes, un grand choeur retentira."
 faction_goal_north_subjugated_name: "Soumettre le Nord"
 faction_goal_north_subjugated_desc: "Si nous devions faire un effort concerté pour intégrer cette partie de notre faction, le reste des seigneurs de guerre comprendraient dans quel sens souffle le vent et se mettraient en rang."
 faction_goal_west_subjugated_name: "Soumettre l'Occident"
 faction_goal_west_subjugated_desc: "Si nous devions faire un effort concerté pour intégrer cette partie de notre faction, le reste des seigneurs de guerre comprendraient dans quel sens souffle le vent et se mettraient en rang."
 faction_goal_south_subjugated_name: "Soumettre le Sud"
 faction_goal_south_subjugated_desc: "Si nous devions faire un effort concerté pour intégrer cette partie de notre faction, le reste des seigneurs de guerre comprendraient dans quel sens souffle le vent et se mettraient en rang."
 faction_goal_no_japanese_in_china_name: "Jetez les envahisseurs"
 faction_goal_no_japanese_in_china_desc: "Les Japonais oppriment notre peuple depuis trop longtemps. Ils ne peuvent plus être autorisés à rester en Chine."
 faction_goal_the_northern_mandate_name: "Contrôler la Sibérie orientale"
 faction_goal_the_northern_mandate_desc: "Si notre peuple peut prospérer, nous aurons besoin du territoire et des ressources que l'on trouve en Sibérie. Le contrôle actuel n'est pas en mesure de l'utiliser correctement, nous y avons donc droit."
 faction_goal_the_southern_mandate_name: "Contrôler l'Asie du Sud-Est"
 faction_goal_the_southern_mandate_desc: "Dans un passé glorieux, nous avons exercé une influence dans les régions situées au sud et nous le ferons encore une fois. Avec la richesse que l'on peut trouver dans la région, il n'y a pas de limites à ce que nous pourrions faire."
 faction_goal_the_greater_game_name: "Contrôler l'Asie centrale"
 faction_goal_the_greater_game_desc: "Les empires cherchèrent à imposer leur volonté en Asie centrale et furent repoussés. Notre heure est venue d'avancer vers l'ouest et de traverser à nouveau les steppes."
 suppress_asian_communism_goal_name: "Supprimer le communisme asiatique"
 suppress_asian_communism_goal_desc: "Le communisme constitue une menace pour les modes de vie traditionnels et pour l'ordre naturel des choses. Nous devons nous unir pour vaincre le communisme partout où il montre sa vilaine tête"
 strategic_resource_control_goal_name: "Contrôle stratégique des ressources"
 strategic_resource_control_goal_desc: "Celui qui contrôle les ressources stratégiques du monde contrôle la politique du monde."
 align_china_goal_name: "Aligner la Chine"
 align_china_goal_desc: "Les factions chinoises et la menace qu'elles représentent doivent être maîtrisées. La meilleure solution à ce problème est de les remplacer par un régime à l'esprit amical."
 control_the_chinese_capitals_goal_name: "Contrôlez les capitales chinoises"
 control_the_chinese_capitals_goal_desc: "Si nous prenons le contrôle des capitales historiques de la Chine, la résistance à nos projets diminuera sûrement."
 war_on_communism_in_asia_goal_name: "Déclarer la guerre au communisme en Asie"
 war_on_communism_in_asia_goal_desc: "Il n'y a qu'une seule façon de vraiment vaincre le communisme ; par la force des armes. Nous devons éradiquer le communisme dans toute l'Asie si nous voulons un jour être à l'abri de son influence."
 coastal_security_goal_name: "Contrôler la côte"
 coastal_security_goal_desc: "Nous devons veiller à contrôler totalement l'ensemble du front de mer de l'Asie de l'Est et du Sud-Est. De cette façon, nous pouvons garantir que les colonisateurs impérialistes occidentaux ne pourront pas maintenir un pied dans notre région."
 secure_the_oil_supply_goal_name: "Sécurisez l'approvisionnement en pétrole" 
 secure_the_oil_supply_goal_desc: "Si nous voulons mener une guerre longue, nous devons obtenir suffisamment de pétrole pour la soutenir par tous les moyens nécessaires."
 secure_the_oil_supply_tech_bonus: "Obtenez le bonus de l'objectif d'approvisionnement en pétrole"
 protector_of_peace_goal_name: "Protecteur de la Paix"
 protector_of_peace_goal_desc: "Notre objectif n'est pas de nous impliquer dans des guerres en Europe ou ailleurs. Nous devrions plutôt nous efforcer de maintenir la paix et encourager les autres pays à régler leurs différends de manière pacifique et rapide."
 african_domination_goal_name: "Domination Africaine"
 african_domination_goal_desc: "Notre objectif ultime doit toujours être de garantir l'absence d'influence étrangère en Afrique. Ceux qui ne sont pas avec nous sont contre nous et doivent se conformer."
 contain_japanese_expansion_asia_goal_name: "Contenir l'expansion japonaise"
 contain_japanese_expansion_asia_goal_desc: "Nous devons faire ce que nous pouvons pour contenir l'expansion territoriale de [JAP.GetName]"
 pan_americanism_goal_name: "Panaméricanisme"
 pan_americanism_goal_desc: "Les Amériques entières doivent être unies. En impliquant tout le monde, nous pouvons sécuriser notre partie du monde et créer un front uni contre toutes les forces extérieures."

 amerindian_liberation_goal_name: "Libération amérindienne"
 amerindian_liberation_goal_desc: "Les premiers peuples des Amériques doivent être libérés des oppresseurs étrangers qui les exercent actuellement."
 islamic_brotherhood_goal_name: "Fraternité islamique"
 islamic_brotherhood_goal_desc: "Les nations islamiques du monde doivent s'unir pour résister à ceux qui préfèrent nous voir conquis et soumis."

 baltic_security_goal_name: "Protéger la Baltique"
 baltic_security_goal_desc: "Afin d'assurer l'avenir de nos citoyens et de nos civils, nous devons protéger la région baltique de toutes nos forces. Ce n'est qu'en le gardant sous notre contrôle que son peuple pourra prospérer."

 nordic_defence_goal_name: "Défendre les Nordiques"
 nordic_defence_goal_desc: "Afin d'assurer l'avenir de nos citoyens et de nos civils, nous devons protéger la région nordique de toutes nos forces. Ce n'est qu'en écartant les empires imposants que nous pourrons prospérer."

 european_dominance_goal_name: "Établir la domination européenne"
 european_dominance_goal_desc: "Si nous parvenons à unir la majorité de l'Europe sous une même bannière, nous pouvons créer une alliance suffisamment forte pour faire face aux menaces les plus graves."
 asian_dominance_goal_name: "Établir la domination asiatique"
 asian_dominance_goal_desc: "Avec la majorité de l'Asie sous notre contrôle, notre faction sera une force avec laquelle il faudra compter."
 middle_east_dominance_goal_name: "Contrôler le Moyen-Orient"
 middle_east_dominance_goal_desc: "De la péninsule arabique et du Levant jusqu'aux montagnes afghanes, nous devons nous unir et établir un contrôle total. Cette région pourrait devenir un acteur majeur si nous parvenons simplement à garantir que tous travaillent ensemble."

 the_arteries_of_trade_goal_name: "Protéger les artères du commerce"
 the_arteries_of_trade_goal_desc: "Les principales lignes maritimes doivent être mises sous notre contrôle afin d'assurer la survie de nos pays membres." 
 the_atomic_race_goal_name: "Construisez la première bombe atomique"
 the_atomic_race_goal_desc: "Nous devons veiller à ce que nos ennemis, actuels ou futurs, n'aient pas accès aux armes nucléaires avant nous. Ce n'est qu'en étant les premiers que nous pouvons être sûrs qu'aucune autre puissance ne pourra s'opposer à nous."
 the_atomic_race_complete_trigger: "Un membre de [ROOT.GetFactionName] est le premier pays à terminer $sp_nuclear_bomb$"
 the_atomic_race_complete_trigger_fail: "Un pays qui n'est pas membre de [ROOT.GetFactionName] est le premier pays à terminer $sp_nuclear_bomb$"
 rule_the_waves_goal_name: "Dirigez les vagues"
 rule_the_waves_goal_desc: "Pour véritablement dominer l'océan, une grande flotte est nécessaire, et les éléments clés d'une grande flotte sont les vaisseaux capitaux."
 eliminate_the_twin_threats_goal_name: "Éliminez les doubles menaces"
 eliminate_the_twin_threats_goal_desc: "Tant que [SOV.GetNameDef] et [GER.GetNameDef] ne seront pas alignés, nous ne pourrons jamais être en sécurité."
 disarm_aggression_central_powers_goal_name: "Émousser les pays agresseurs"
 disarm_aggression_central_powers_goal_desc: "Les démocraties attaquent rarement les autres pays. Afin de garantir l'Europe pour les générations futures, nous devons veiller à ce que ces pays agressifs soient transformés en démocraties, ou soient complètement éliminés."
 rule_the_waves_tech_bonus: "Bonus d'objectif Rule the Waves"
 imperial_glory_goal_name: "Défendre les actifs impériaux vitaux"
 imperial_glory_goal_desc: "Les principaux bastions de notre empire et ceux de nos alliés doivent tenir le coup. En gardant le contrôle des possessions partout dans le monde en temps de guerre, nous pouvons montrer au monde que nous restons une force avec laquelle il faut compter. "
 
 production_quotas_goal_name: "Atteindre les quotas de production"
 production_quotas_goal_desc: "Nous devons disposer d'un énorme arsenal d'armes pour garantir l'intégrité du [ROOT.GetFactionName] et être prêts à faire face à toutes les menaces qui se présentent à nous."
 stall_the_fascist_threat_goal_name: "Calmer la menace fasciste"
 stall_the_fascist_threat_goal_desc: "Nous devons ralentir la propagation du fascisme dans le monde. L'Espagne va très probablement tomber, mais nous devons faire notre part pour retarder cette chute jusqu'à ce que nous soyons prêts à nous défendre contre la menace croissante du fascisme. En immobilisant les troupes ennemies dans un conflit en Espagne, nous leur rendons plus difficile de se concentrer ailleurs, nous faisant ainsi gagner un temps précieux."
 the_red_tide_goal_name: "Développez les armées rouges"
 the_red_tide_goal_desc: "Ce qui compte le plus, c'est d'être sur le terrain. Ce qu'il faut, c'est une armée forte de dix millions. C'est ainsi que la survie est véritablement assurée."
 military_infrastructure_goal_name: "Construire une infrastructure militaire"
 military_infrastructure_goal_desc: "Une infrastructure bien développée est essentielle pour garantir que nos forces de défense des frontières disposent des lignes d'approvisionnement dont elles ont besoin."
 ensure_military_r_d_goal_name: "Construire des installations de R&D militaires"
 ensure_military_r_d_goal_desc: "Nous devons veiller à ce que notre technologie militaire soit à la hauteur, en construisant des installations dédiées à la recherche et au développement de prototypes avancés et de nouveaux concepts."
 spy_master_goal_name: "Nommer un maître espion"
 spy_master_goal_desc: "Nous devrions spécialiser l'un de nos membres dans l'art de l'espionnage et de la collecte de renseignements, lui permettant ainsi de superviser et de diriger les opérations de notre alliance."
 develop_mexican_oil_goal_name: "Développer le pétrole mexicain"
 develop_mexican_oil_goal_desc: "L'expansion de l'extraction des réserves pétrolières mexicaines garantirait un approvisionnement suffisant en carburant pour répondre aux demandes industrielles et militaires."
 develop_curacao_oil_goal_name: "Développer le pétrole de Curaçao"
 develop_curacao_oil_goal_desc: "Les raffineries de Curaçao font partie intégrante de la transformation du pétrole vénézuélien. L'expansion de leur extraction permettrait de maintenir l'accès de l'alliance aux produits pétroliers raffinés."
 develop_venezuelan_oil_goal_name: "Développer le pétrole vénézuélien"
 develop_venezuelan_oil_goal_desc: "L'extraction pétrolière du Venezuela peut être encore développée pour fournir à notre alliance l'accès à l'énergie dont elle a besoin pour soutenir ses activités militaires."
 develop_guyanan_bauxite_goal_name: "Développer la bauxite guyanaise"
 develop_guyanan_bauxite_goal_desc: "Le développement accru des gisements de bauxite du Guyana fournirait les ressources brutes essentielles à la fabrication d'avions à grande échelle."
 develop_suriname_bauxite_goal_name: "Développer la bauxite du Suriname"
 develop_suriname_bauxite_goal_desc: "Le développement accru des riches gisements de bauxite du Suriname fournirait les matières premières nécessaires à l'industrie aéronautique en pleine croissance de notre alliance."
 develop_lappland_metals_goal_name: "Développer les métaux de Laponie"
 develop_lappland_metals_goal_desc: "L'expansion de l'extraction des richesses minérales de la Laponie renforcerait l'approvisionnement de l'alliance en fer et en tungstène, soutenant ainsi notre industrie de fabrication d'armes."
 develop_ploiesti_oil_fields_goal_name: "Développer les champs pétroliers de Ploiesti"
 develop_ploiesti_oil_fields_goal_desc: "En tant que seuls gisements pétroliers d'Europe, les gisements pétroliers de Ploiesti doivent être exploités de manière appropriée pour garantir à l'alliance le carburant nécessaire à la poursuite des opérations militaires."
 develop_baku_oil_fields_goal_name: "Développer les champs pétrolifères de Bakou"
 develop_baku_oil_fields_goal_desc: "Le développement de la région pétrolière de Bakou fournirait une vaste gamme de produits pétroliers raffinés essentiels aux opérations militaires."
 develop_iraqi_oil_goal_name: "Développer le pétrole irakien"
 develop_iraqi_oil_goal_desc: "L'augmentation de la capacité de production pétrolière de l'Irak pourrait contribuer à satisfaire les besoins en carburant de nos militaires."
 develop_persian_oil_goal_name: "Développer le pétrole persan"
 develop_persian_oil_goal_desc: "L'expansion des champs de pétrole et de la capacité de raffinage de la Perse garantirait un flux continu de carburant pour les besoins opérationnels."
 develop_chinese_metals_goal_name: "Développer les métaux chinois"
 develop_chinese_metals_goal_desc: "Les richesses de la Chine en divers métaux critiques pourraient être exploitées plus largement afin de fournir à la base militaro-industrielle de l'alliance les ressources dont elle a besoin."
 develop_malayan_riches_goal_name: "Développer les richesses malaises"
 develop_malayan_riches_goal_desc: "Le développement des ressources de tungstène et de caoutchouc de la Malaisie renforcerait considérablement la base matérielle de l'alliance, garantissant ainsi des intrants clés pour la fabrication et la logistique militaire."
 develop_indonesian_riches_goal_name: "Développer les richesses indonésiennes"
 expand_newfoundland_bases_goal_name: "Agrandir les bases de Terre-Neuve"
 expand_newfoundland_bases_goal_desc: "L'agrandissement de nos bases à Terre-Neuve nous permettrait de mieux exercer un contrôle sur les convois de l'Atlantique Nord et de projeter notre puissance aérienne et navale sur les routes maritimes vitales."
 expand_bermuda_bases_goal_name: "Développer les bases des Bermudes"
 expand_bermuda_bases_goal_desc: "L'expansion de nos bases aux Bermudes nous permettrait de patrouiller plus efficacement au milieu de l'Atlantique et de maintenir des lignes d'approvisionnement plus sécurisées entre les continents."
 expand_bahamas_bases_goal_name: "Agrandir les bases des Bahamas"
 expand_bahamas_bases_goal_desc: "L'expansion de nos bases aux Bahamas permettrait une surveillance plus efficace des voies maritimes des Caraïbes et une protection des approches maritimes vers l'Amérique du Nord et du Sud."
 fortify_panama_canal_goal_name: "Fortifier le canal de Panama"
 expand_trinidad_bases_goal_name: "Agrandir les bases de Trinidad"
 expand_azores_bases_goal_name: "Développer les bases des Açores"
 expand_iceland_bases_goal_name: "Agrandir les bases islandaises"
 expand_iceland_bases_goal_desc: "L'expansion des bases en Islande nous permettrait de mieux sécuriser le détroit du Danemark et d'exercer davantage d'influence sur le corridor de l'Atlantique Nord."
 expand_faroese_bases_goal_name: "Développer les bases féroïennes"
 expand_narvik_bases_goal_name: "Agrandir les bases de Narvik"
 expand_narvik_bases_goal_desc: "L'expansion des bases de Narvik permettrait de mieux maintenir l'accès aux expéditions vitales de minerai de fer et de contrôler les routes d'approvisionnement de l'Arctique."
 fortify_danish_belts_goal_name: "Fortifier les ceintures danoises"
 fortify_danish_belts_goal_desc: "Fortifier le Kattegat nous permettrait de mieux exercer un contrôle exclusif sur l'accès naval entre la mer Baltique et la mer du Nord."
 fortify_danish_belts_tooltip: "Chaque province du §YJylland§!, §YFyn§!et §YSjaelland§! qui contrôle les §YCeintures danoises§! détroit possède un fort côtier de niveau 1 §Y§! et est composé d'une seule division."
 fortify_gibraltar_goal_name: "Fortifier Gibraltar"
 fortify_gibraltar_goal_desc: "Fortifier notre base stratégique sur le détroit de Gibraltar nous permettrait de mieux contrôler les mouvements maritimes entre la Méditerranée et l'Atlantique."
 expand_maltese_bases_goal_name: "Développer les bases maltaises"
 expand_maltese_bases_goal_desc: "L'expansion de nos bases à Malte permettrait de mieux perturber les lignes d'approvisionnement ennemies et de projeter la puissance dans toute la Méditerranée centrale."
 expand_cretan_bases_goal_name: "Développer les bases crétoises"
 expand_cretan_bases_goal_desc: "L'expansion de nos bases en Crète nous permettrait de mieux exercer une domination sur la Méditerranée orientale et de faciliter les opérations en mer Égée et en Afrique du Nord."
 expand_cypriot_bases_goal_name: "Développer les bases chypriotes"
 expand_cypriot_bases_goal_desc: "L'expansion de nos bases à Chypre nous permettrait de mieux soutenir les opérations en Méditerranée orientale et de sécuriser les routes aériennes vitales à destination et en provenance du Moyen-Orient."
 fortify_bosporus_goal_name: "Fortifier le Bosphore"
 fortify_bosporus_goal_desc: "Fortifier le détroit du Bosphore garantirait notre contrôle sur tous les accès navals entre la mer Noire et la Méditerranée."
 fortify_bosporus_tooltip: "Chaque province d'Istanbul §Y§! qui contrôle le détroit du Bosphore §Y§! possède un fort côtier de niveau 1 §Y§!, un fort terrestre de niveau 1 §Y§!et est dirigée par une division."
 fortify_dardanelles_goal_name: "Fortifier les Dardanelles renforcerait notre capacité à dicter les mouvements de la flotte et du commerce depuis la mer Noire."
 fortify_dardanelles_tooltip: "Chaque province de §YEdirne§! et §YBursa§! qui contrôle le §Ydétroit des Dardanelles§! a un fort côtier de niveau 1 §Y§!, un fort terrestre de niveau 1 §Y§!, et est composé d'une seule division."
 fortify_suez_canal_goal_name: "Fortifier le canal de Suez"
 fortify_suez_canal_goal_desc: "Le maintien de la possession du canal de Suez est impératif pour garantir notre contrôle exclusif sur la principale artère de trafic entre l'Europe et l'Asie."
 fortify_suez_tooltip: "Chaque province de §YSuez§! qui contrôle le §Ydétroit de Suez§! possède un fort côtier de niveau 1 §Y§!, un fort terrestre de niveau 1 §Y§!et est dirigée par une division."
 expand_gulf_of_aden_bases_goal_name: "Agrandir les bases du golfe d'Aden"
 fortify_strait_of_hormuz_goal_name: "Fortifier le détroit d'Ormuz"
 fortify_strait_of_hormuz_goal_desc: "Fortifier les bases stratégiques du détroit d'Ormuz nous permettrait de mieux exercer un contrôle sur l'accès au pétrole vital persan et irakien."
 fortify_strait_of_hormuz_tooltip: "Chaque province du §YMusandam§! et du §YFars§! qui contrôle le §Ydétroit d'Ormuz§! possède un fort côtier de niveau 1 §Y§!, un fort terrestre de niveau 1 §Y§!et est composé d'une seule division."
 expand_ceylonese_bases_goal_name: "Développer les bases de Ceylan"
 expand_ceylonese_bases_goal_desc: "L'expansion de nos bases à Ceylan renforcerait notre domination sur l'océan Indien et faciliterait la protection des voies maritimes vitales entre le Moyen-Orient et l'Asie du Sud-Est."
 expand_singapore_naval_base_goal_name: "Agrandir la base navale de Singapour"
 expand_singapore_naval_base_goal_desc: "La base navale monumentale et fortifiée de Singapour commande le détroit de Malacca et régule les mouvements entre les océans Indien et Pacifique. Il faudrait encore le renforcer."
 fortify_manila_bay_goal_name: "Fortifier la baie de Manille"
 fortify_manila_bay_goal_desc: "La fortification de la baie défendable de Manille améliorerait notre projection de puissance à travers le Pacifique occidental et sécuriserait l'accès aux Indes orientales et à la mer de Chine méridionale."
 fortify_manila_tooltip: "§YLa province de Manille§! a un fort côtier de niveau 2 §Y§! et une base navale de niveau 7 §Y§!, et l'État §Yde Manille§! a une base aérienne de niveau 8 §Y§!."
 fortify_okinawa_goal_name: "Fortifier Okinawa"
 fortify_okinawa_goal_desc: "Fortifier Okinawa permettrait de contrôler les approches des îles japonaises et d'établir un solide périmètre défensif dans le Pacifique."
 fortify_okinawa_tooltip: "§YOkinawa§! a un niveau 1 §YAnti-Air§! et une base aérienne de niveau 5 §Y§!, et la province §YNaha§! a un fort côtier de niveau 2 §Y§!."
 fortify_iwo_jima_goal_name: "Fortifier Iwo Jima"
 fortify_iwo_jima_goal_desc: "La fortification d'Iwo Jima permettrait de contrôler les approches des îles japonaises et d'établir un solide périmètre défensif dans le Pacifique."
 expand_caroline_islands_bases_goal_name: "Développer les bases Caroline"
 expand_caroline_islands_bases_goal_desc: "L'expansion de nos bases dans les îles Carolines et dans l'atoll de Truk faciliterait des campagnes navales et aériennes soutenues dans le Pacifique central."
 expand_guadalcanal_bases_goal_name: "Agrandir les bases de Guadalcanal"
 expand_guadalcanal_bases_goal_desc: "L'expansion de nos bases à Guadalcanal nous permettrait de mieux exercer un contrôle sur les opérations navales dans le Pacifique Sud et sur les routes d'accès depuis et vers l'Australie."
 expand_wake_island_bases_goal_name: "Développez les bases de réveil"
 expand_midway_island_bases_goal_name: "Agrandir les bases médianes"
 expand_midway_island_bases_goal_desc: "Le développement de nos bases à Midway garantirait la sécurité des approches du Pacifique central et constituerait une base clé pour les opérations transocéaniques."

 # Mid term Goals
 undoing_brest_litowsk_goal_name: "Venger le traité de Brest-Litowsk"
 undoing_brest_litowsk_goal_desc: "La paix honteuse de Brest-Litowsk n'a jamais été complètement détruite. Il est temps d'effacer les dernières parties de cette partie honteuse de notre histoire."

 marine_corps_goal_name: "Créer un Corps des Marines"
 marine_corps_goal_desc: "L'expansion de nos forces amphibies augmentera considérablement nos capacités offensives et la quantité de territoire ennemi que nous pouvons menacer."
 marine_corps_tech_bonus: "$marine_corps_goal_name$ Bonus d'objectif"
 submarine_force_goal_name: "Développez la flotte sous-marine"
 submarine_force_goal_desc: "Une force sous-marine appropriée est essentielle pour dégrader les lignes de ravitaillement ennemies."
 submarine_force_tech_bonus: "$submarine_force_goal_name$ Bonus d'objectif"
 convoy_escort_force_goal_name: "Escorter des convois à travers les océans"
 convoy_escort_force_goal_desc: "Pour sécuriser nos lignes d'approvisionnement, nous devons garantir un nombre suffisant de navires d'escorte."
 convoy_escort_force_tech_bonus: "$convoy_escort_force_goal_name$ Bonus d'objectif"
 air_superiority_goal_name: "Maintenir la supériorité aérienne"
 air_superiority_goal_desc: "Le contrôle des airs est déterminant pour le succès sur terre et en mer. Nous devons disposer de suffisamment d'avions de combat pour assurer notre domination aérienne."
 air_superiority_tech_bonus: "$air_superiority_goal_name$ Bonus d'objectif"
 control_mexican_oil_goal_name: "Contrôler le pétrole mexicain"
 control_mexican_oil_goal_desc: "Garantir les réserves pétrolières mexicaines garantirait un approvisionnement suffisant en carburant pour répondre aux demandes industrielles et militaires."
 control_curacao_oil_goal_name: "Contrôler l'huile de Curaçao"
 control_curacao_oil_goal_desc: "Les raffineries de Curaçao font partie intégrante de la transformation du pétrole vénézuélien. Leur contrôle fournirait à l'alliance un accès fiable aux produits pétroliers raffinés."
 control_venezuelan_oil_goal_name: "Contrôler le pétrole vénézuélien"
 control_venezuelan_oil_goal_desc: "Les importantes réserves pétrolières du Venezuela fourniraient à notre alliance l'accès à l'énergie dont elle a besoin pour soutenir ses activités militaires."
 control_guyanan_bauxite_goal_name: "Contrôler la bauxite guyanaise"
 control_guyanan_bauxite_goal_desc: "Le contrôle des gisements de bauxite du Guyana permettrait d'augmenter la production d'aluminium de l'alliance, essentielle à la construction aéronautique."
 control_suriname_bauxite_goal_name: "Contrôler la bauxite du Suriname"
 control_suriname_bauxite_goal_desc: "La possession des riches gisements de bauxite du Suriname fournirait les matières premières nécessaires à l'industrie aéronautique en pleine croissance de notre alliance."
 control_lappland_metals_goal_name: "Contrôler les métaux de Laponie"
 control_lappland_metals_goal_desc: "L'accès aux richesses minières de la Laponie renforcerait l'approvisionnement de l'alliance en fer et en tungstène, soutenant ainsi notre industrie de fabrication d'armes."
 control_ploiesti_oil_fields_goal_name: "Contrôler les champs pétrolifères de Ploiesti"
 control_ploiesti_oil_fields_goal_desc: "En tant que seuls gisements pétroliers d'Europe, le contrôle des gisements pétroliers de Ploiesti est inestimable pour garantir à l'alliance le carburant nécessaire à la poursuite des opérations militaires."
 control_baku_oil_fields_goal_name: "Contrôler les champs pétrolifères de Bakou"
 control_baku_oil_fields_goal_desc: "Sécuriser la région pétrolière de Bakou donnerait accès à de vastes réserves pétrolières vitales pour les opérations militaires."
 control_iraqi_oil_goal_name: "Contrôler le pétrole irakien"
 control_iraqi_oil_goal_desc: "La capacité de production pétrolière de l'Irak pourrait contribuer à satisfaire les besoins en carburant de nos militaires."
 control_persian_oil_goal_name: "Contrôler le pétrole persan"
 control_persian_oil_goal_desc: "Le contrôle des champs de pétrole et de la capacité de raffinage de la Perse garantirait un flux continu de carburant pour les besoins opérationnels."
 control_chinese_metals_goal_name: "Contrôler les métaux chinois"
 control_chinese_metals_goal_desc: "La richesse de la Chine en divers métaux critiques pourrait fournir à la base militaro-industrielle de l'alliance les ressources dont elle a besoin."
 control_malayan_riches_goal_name: "Contrôler les richesses malaises"
 control_malayan_riches_goal_desc: "Le contrôle des ressources de tungstène et de caoutchouc de la Malaisie renforcerait considérablement la base matérielle de l'alliance, garantissant ainsi des intrants clés pour la fabrication et la logistique militaire."
 control_indonesian_riches_goal_name: "Contrôler les richesses indonésiennes"
 control_indonesian_riches_goal_desc: "Les diverses richesses naturelles de l'Indonésie, notamment le pétrole, le caoutchouc et les minéraux, sont inestimables pour soutenir notre base industrielle et garantir l'indépendance de l'alliance en matière de ressources."
 control_newfoundland_bases_goal_name: "Contrôler les bases de Terre-Neuve"
 control_newfoundland_bases_goal_desc: "Sécuriser des bases à Terre-Neuve nous permettrait d'exercer un contrôle sur les convois de l'Atlantique Nord et de projeter notre puissance aérienne et navale sur les routes maritimes vitales."
 control_bermuda_goal_name: "Contrôler les Bermudes"
 control_bermuda_goal_desc: "Des bases aux Bermudes nous permettraient de patrouiller plus efficacement au milieu de l'Atlantique et de maintenir des lignes d'approvisionnement plus sécurisées entre les continents."
 control_bahamas_bases_goal_name: "Contrôler les bases des Bahamas"
 control_bahamas_bases_goal_desc: "La possession de bases aux Bahamas permettrait une surveillance plus efficace des voies maritimes des Caraïbes et une protection des approches maritimes vers l'Amérique du Nord et du Sud."
 control_panama_canal_goal_name: "Contrôler le canal de Panama"
 control_panama_canal_goal_desc: "Le contrôle du canal de Panama est essentiel pour permettre un redéploiement rapide des flottes entre l'Atlantique et le Pacifique, garantissant ainsi une flexibilité stratégique sur les deux océans."
 control_trinidad_goal_name: "Contrôler Trinité"
 control_trinidad_goal_desc: "L'emplacement clé de Trinidad rend impératif le contrôle des approvisionnements pétroliers des Caraïbes et lui permet de servir de point de départ stratégique sur la côte nord de l'Amérique du Sud."
 control_azores_goal_name: "Contrôler les Açores"
 control_azores_goal_desc: "L'emplacement stratégique des Açores permet une portée étendue à travers le milieu de l'Atlantique, comblant l'écart en matière de couverture sous-marine et anti-sous-marine et assurant une couverture aérienne continue pour les convois."
 control_iceland_goal_name: "Contrôler l'Islande"
 control_iceland_goal_desc: "Le contrôle de bases en Islande permettrait de sécuriser le détroit du Danemark et d'exercer une influence sur le corridor de l'Atlantique Nord."
 control_faroe_islands_goal_name: "Contrôler les Îles Féroé"
 control_faroe_islands_goal_desc: "Les îles Féroé sont situées dans un emplacement stratégique qui permet le contrôle des routes maritimes du nord et le soutien aux opérations navales vers la Grande-Bretagne, la Scandinavie et l'Arctique."
 control_narvik_goal_name: "Contrôler Narvik"
 control_narvik_goal_desc: "Sécuriser Narvik permettrait de maintenir l'accès aux expéditions vitales de minerai de fer et de contrôler les routes d'approvisionnement de l'Arctique."
 control_danish_belts_goal_name: "Contrôlez les ceintures danoises"
 control_danish_belts_goal_desc: "Mettre en garnison le Kattegat nous permettrait d'exercer un contrôle exclusif sur l'accès naval entre la mer Baltique et la mer du Nord."
 control_brittany_bases_goal_name: "Contrôler les bases bretonnes"
 control_brittany_bases_goal_desc: "Les bases stratégiques le long de la côte bretonne permettraient des opérations sous-marines et aériennes de plus grande envergure dans l'Atlantique, ainsi que de sécuriser l'accès au continent européen."
 control_gibraltar_goal_name: "Contrôler Gibraltar"
 control_gibraltar_goal_desc: "La base stratégique du détroit de Gibraltar permettrait d'exercer un contrôle sur le mouvement maritime entre la Méditerranée et l'Atlantique."
 control_malta_goal_name: "Contrôler Malte"
 control_malta_goal_desc: "La possession de Malte permettrait de perturber les lignes d'approvisionnement ennemies et de projeter la puissance dans toute la Méditerranée centrale."
 control_crete_goal_name: "Contrôler la Crète"
 control_crete_goal_desc: "Le contrôle de l'île de Crète permettrait de dominer la Méditerranée orientale et faciliterait les opérations dans la mer Égée et en Afrique du Nord."
 control_cyprus_goal_name: "Contrôler Chypre"
 control_cyprus_goal_desc: "Le contrôle de Chypre permettrait de soutenir les opérations en Méditerranée orientale et de sécuriser les routes aériennes vitales vers et depuis le Moyen-Orient."
 control_bosporus_goal_name: "Contrôler le Bosphore"
 control_bosporus_goal_desc: "La saisie du détroit du Bosphore permettrait de contrôler tous les accès navals entre la mer Noire et la Méditerranée."
 control_dardanelles_goal_name: "Contrôlez les Dardanelles"
 control_dardanelles_goal_desc: "Détenir les Dardanelles permettrait de dicter les mouvements de la flotte et du commerce depuis la mer Noire."
 control_suez_canal_goal_name: "Contrôler le canal de Suez"
 control_suez_canal_goal_desc: "La possession du canal vital de Suez nous donnerait le contrôle exclusif de la principale artère de trafic entre l'Europe et l'Asie, garantissant un transfert rapide des forces et des ressources."
 control_gulf_of_aden_bases_goal_name: "Contrôler les bases du golfe d'Aden"
 control_gulf_of_aden_bases_goal_desc: "Les bases stratégiques le long du golfe d'Aden permettent de protéger les approches de la mer Rouge et de sécuriser les routes maritimes reliant l'Europe, l'Afrique et l'Asie."
 control_strait_of_hormuz_goal_name: "Contrôler le détroit d'Ormuz"
 control_strait_of_hormuz_goal_desc: "Les bases stratégiques du détroit d'Ormuz permettraient d'exercer un contrôle sur l'accès au pétrole vital persan et irakien."
 control_ceylon_goal_name: "Contrôler Ceylan"
 control_ceylon_goal_desc: "Sécuriser Ceylan permettrait la domination de l'océan Indien et la protection des voies maritimes vitales entre le Moyen-Orient et l'Asie du Sud-Est."
 control_singapore_goal_name: "Contrôler Singapour"
 control_singapore_goal_desc: "La base navale monumentale et fortifiée de Singapour commande le détroit de Malacca et régule les mouvements entre les océans Indien et Pacifique. Cela devrait être le nôtre."
 control_manila_goal_name: "Contrôler Manille"
 control_manila_goal_desc: "La possession de la baie défendable de Manille permettrait une projection de puissance à travers le Pacifique occidental et un accès sécurisé aux Indes orientales et à la mer de Chine méridionale."
 control_okinawa_goal_name: "Contrôler Okinawa"
 control_okinawa_goal_desc: "Le contrôle d'Okinawa permettrait de lancer des opérations contre les îles japonaises et d'établir un solide périmètre défensif dans le Pacifique."
 control_iwo_jima_goal_name: "Contrôler Iwo Jima"
 control_iwo_jima_goal_desc: "Sécuriser Iwo Jima permettrait de soutenir des opérations aériennes à longue portée au-dessus du Japon et d'étendre notre portée dans le Pacifique central."
 control_caroline_islands_goal_name: "Contrôler les îles Carolines"
 control_caroline_islands_goal_desc: "La domination des îles Carolines et de l'atoll de Truk permettrait des campagnes navales et aériennes soutenues à travers le Pacifique central."
 control_guadalcanal_goal_name: "Contrôler Guadalcanal"
 control_guadalcanal_goal_desc: "Sécuriser Guadalcanal nous permettrait d'exercer un contrôle sur les opérations navales dans le Pacifique Sud et sur les routes d'accès depuis et vers l'Australie."
 control_wake_island_goal_name: "Contrôler l'île de Wake"
 control_wake_island_goal_desc: "Le maintien de Wake Island permettrait d'étendre la reconnaissance et la couverture aérienne sur les routes du Pacifique central."
 control_midway_island_goal_name: "Contrôler l'île Midway"
 control_midway_island_goal_desc: "Le contrôle de Midway permettrait de sécuriser les approches du Pacifique central et fournirait une base clé pour les opérations transocéaniques."
 control_hawaii_goal_name: "Contrôler Hawaï"
 control_hawaii_goal_desc: "La prise de Pearl Harbor permettrait d'ancrer les opérations dans le Pacifique et de coordonner la logistique sur l'ensemble du théâtre océanique, ainsi que d'ouvrir l'accès au littoral américain du Pacifique."
 control_attu_island_goal_name: "Contrôler l'île d'Attu"
 control_attu_island_goal_desc: "Sécuriser l'île Attu permettrait d'exercer un contrôle sur les voies de navigation du nord du Pacifique et de permettre des opérations le long de la chaîne des Aléoutiennes vers l'Alaska et la côte Pacifique américaine."
 undo_versailles_goal_name: "Venger le traité de Versailles"
 undo_versailles_goal_desc: "Il est grand temps de défaire la parodie de ce « Diktat ». Nous reprendrons notre territoire légitime !"
 
 # Long term goals
 strategic_bombing_campaign_goal_name: "Campagne de bombardement stratégique soutenue"
 strategic_bombing_campaign_goal_desc: "Une campagne de bombardement stratégique à grande échelle dégradera systématiquement la capacité industrielle de l'ennemi, ce qui nous permettra d'épuiser ses forces."
 liberate_territory_goal_name: "Libérez notre territoire"
 liberate_territory_goal_desc: "L'ennemi est en possession de notre territoire. Le libérer devrait être notre premier objectif."
 great_offensive_goal_name: "Mener une grande offensive"
 great_offensive_goal_desc: "Une grande offensive s'emparant du territoire ennemi devrait être notre premier pas vers la conclusion définitive de la guerre."

