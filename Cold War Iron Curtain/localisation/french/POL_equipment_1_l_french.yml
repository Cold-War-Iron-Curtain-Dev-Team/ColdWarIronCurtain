 POL_fighter_equipment_0:0 "Wojska Lotnicze et Obrony Powietrznej"
 POL_fighter_equipment_0_short:0 "WLOP"
 POL_fighter_equipment_0_desc:0 "L'armée de l'air polonaise (Sily Powietrzne ou « Forces aériennes ») est la branche militaire de guerre aérienne des forces armées polonaises. Jusqu'en juillet 2004, elle était officiellement connue sous le nom de Wojska Lotnicze i Obrony Powietrznej (Forces aériennes et de défense aérienne). L'armée de l'air polonaise remonte à la seconde moitié de 1917 et a été officiellement créée dans les mois qui ont suivi la fin de la Première Guerre mondiale en 1918. Lors de l'invasion de la Pologne par l'Allemagne nazie en 1939, 70 % de ses avions ont été détruits. La plupart des pilotes, après l'invasion soviétique de la Pologne le 17 septembre, se sont enfuis via la Roumanie et la Hongrie pour continuer à combattre tout au long de la Seconde Guerre mondiale dans les forces aériennes alliées, d'abord en France, puis en Grande-Bretagne et plus tard également en Union soviétique."
 
