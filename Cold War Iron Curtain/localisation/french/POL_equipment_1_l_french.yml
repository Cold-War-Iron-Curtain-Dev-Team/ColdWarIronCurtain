 ## Recon Plane
 POL_recon_equipment_0:0 "LWS RWD-14 Czapla"
 POL_recon_equipment_0_short:0 "RWD-14 Czapla"
 POL_recon_equipment_0_desc:0 "Le RWD-14 Czapla (LWS Czapla) était un avion de coopération de l'armée polonaise (avion d'observation, de reconnaissance rapprochée et de liaison), conçu au milieu des années 1930 par l'équipe RWD et produit dans l'usine LWS à partir de 1938. Une série de 65 avions ont été construits et la plupart ont été utilisés par les escadrons d'observation de l'armée de l'air polonaise pendant la Seconde Guerre mondiale en 1939."
 POL_jet_recon_equipment_0:0 "LWD Zuraw"
 POL_jet_recon_equipment_0_short:0 "LWD Zuraw"
 POL_jet_recon_equipment_0_desc:0 "Le LWD Zuraw était un prototype d'avion utilitaire et de liaison polonais de 1951, monoplan à aile haute avec monomoteur, qui n'est pas entré en production. Le nom signifie grue."
 POL_jet_recon_equipment_1:0 "PZL TS-11 Iskra bis C"
 POL_jet_recon_equipment_1_short:0 "TS-11 Iskra bisC"
 POL_jet_recon_equipment_1_desc:0 "Avion de reconnaissance monoplace de 1971. Il avait une caméra dans la partie inférieure du fuselage et une capacité de carburant accrue. Seulement 5 exemplaires ont été construits en 1972, et en 1983 ont été convertis en entraîneurs."
