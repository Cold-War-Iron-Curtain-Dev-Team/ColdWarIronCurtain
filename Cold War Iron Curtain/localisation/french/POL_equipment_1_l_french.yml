 ## CAS
 
 POL_CAS_equipment_1:0 "PZL.23 Karas"
 POL_CAS_equipment_1_short:0 "PZL.23 Karas"
 POL_CAS_equipment_2:0 "Iliouchine Il-2"
 POL_CAS_equipment_2_short:0 "Il-2"
 POL_CAS_equipment_2_desc:0 "En 1945, l'armée de l'air bulgare reçut 120 avions d'attaque Il-2 et 10 avions d'entraînement Il-2U. L'avion a été utilisé jusqu'en 1954."
 POL_CAS_equipment_3:0 "Iliouchine Il-10"
 POL_CAS_equipment_3_short:0 "Il-10"
 POL_CAS_equipment_3_desc:0 "En 1947, les premiers avions d'attaque Ilyushin sont arrivés, les Il-10 et Il-10M. Au cours de la période 1953-54, la Bulgarie a fourni des exemplaires de l'Il-10-Avia B-33 produits en Tchécoslovaquie sous licence soviétique, armés de quatre canons d'avion NS-23RM (150 coups par baril)."
 POL_CAS_equipment_4:0 "Avion B-33"
 POL_CAS_equipment_4_short:0 "B-33"
 POL_CAS_equipment_4_desc:0 "Variante de construction tchèque du vénérable Il-10. Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à de nombreux défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 participa à certaines des dernières opérations de combat en Europe, ainsi qu'à la brève intervention soviétique dans la guerre du Pacifique. Au moment où l'Il-10 a pris sa retraite du service soviétique en 1956, l'armée de l'air a délaissé les avions purement CAS et d'attaque au sol pour se tourner vers les chasseurs-bombardiers. Son nom de rapport à l'OTAN est Beast."

 POL_jet_CAS_equipment_1:0 "Iliouchine Il-10M"
 POL_jet_CAS_equipment_1_short:0 "Iliouchine Il-10M"
 POL_jet_CAS_equipment_1_desc:0 "En 1947, les premiers avions d'attaque Ilyushin sont arrivés, les Il-10 et Il-10M. Au cours de la période 1953-54, la Bulgarie a fourni des exemplaires de l'Il-10-Avia B-33 produits en Tchécoslovaquie sous licence soviétique, armés de quatre canons d'avion NS-23RM (150 coups par baril)."
