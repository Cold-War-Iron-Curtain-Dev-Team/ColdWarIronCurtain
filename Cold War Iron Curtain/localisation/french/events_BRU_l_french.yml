 #Flags
 BRU_Death_Of_Ahmad_Tajuddin:0 "Le sultan de Brunei est décédé"
 #Sultans
 BRU_sultan.1.t:0 "La santé du sultan de Brunei en déclin"
 BRU_sultan.1.d:0 "En 1949, la santé du sultan de Brunei se détériore sérieusement. Après s'être isolé dans sa chambre pendant dix jours à Kuching, il a été transporté d'urgence à l'hôpital, où les médecins ont découvert 423 bouteilles de bière vides dans sa chambre, révélant une consommation quotidienne alarmante. Cette consommation excessive d'alcool a entraîné une grave détérioration physique, affectant particulièrement ses reins. Malgré les innombrables efforts déployés par son équipe médicale pour stabiliser son état en vue du prochain jubilé d'argent, les problèmes de santé sous-jacents du sultan restent critiques, suscitant des inquiétudes quant à l'avenir du leadership de Brunei."
 BRU_sultan.1.a:0 "Prions pour le meilleur pour le jeune Sultan"
 BRU_sultan.2.t:0 "Célébration du jubilé d'argent du Brunei"
 BRU_sultan.2.d:0 "Le 22 septembre 1949, le sultan Ahmad Tajuddin assista à contrecoeur aux célébrations de son jubilé d'argent au Brunei, marquant les 25 ans de son règne. L'événement a célébré son leadership et les réalisations du Brunei après la Seconde Guerre mondiale. Malgré une récente hospitalisation à Kuching en raison d'une maladie grave, probablement due à une intoxication alcoolique avancée, le sultan a été persuadé d'y assister par son ami proche Datu Bandar Abang Haji Mustapha, secrétaire en chef du Sarawak, R.G. Aikman et le commissaire britannique Malcolm MacDonald. Bien qu'initialement mécontent d'avoir utilisé une partie de son allocation pour financer les festivités, le retour du sultan au Brunei a marqué un tournant. Il a décidé de rester dans le pays, peut-être influencé par la construction de son nouveau palais, sur le modèle de l'Astana des Rajahs blancs du Sarawak, signalant un engagement renouvelé envers son royaume."
 BRU_sultan.2.a:0 "Félicitations"
 BRU_sultan.3.t:0 "Décès du sultan Ahmad Tajuddin"
 BRU_sultan.3.d:0 "Le 3 juin 1950, le sultan Ahmad Tajuddin de Brunei tomba gravement malade alors qu'il séjournait à l'hôtel Raffles à Singapour. Il a été admis à l'hôpital général de Singapour plus tard dans la journée, mais est décédé tragiquement le 4 juin des suites d'une grave hémorragie. La nouvelle de sa mort s'est rapidement répandue, incitant le prince héritier Tengku Ismail de Johore à transporter le corps du sultan à Istana Besar à Johore Bahru. A l'Istana Besar, le chef Qadhi de Johore, Syed Salim bin Syed Hasan, prépara le corps du sultan, qui fut ensuite recouvert d'un linceul blanc. La prière funéraire a été dirigée par le mufti de Johore, Syed Alwi Al-Hadad. Le corps du défunt sultan a été déposé dans le hall du Grand Palais, où des dignitaires, des représentants du gouvernement et des dirigeants communautaires de diverses origines ethniques et religieuses se sont réunis pour rendre un dernier hommage au jeune dirigeant."
 BRU_sultan.3.a:0 "Comme c'est tragique"
 BRU_sultan.4.t:0 "Couronnement du sultan Omar Saifuddien III de Brunei"
 BRU_sultan.4.d:0 "Le 4 juin 1950, suite au décès de son frère, le sultan Omar Ali Saifuddien III fut déclaré sultan de Brunei. Proclamé par Pengiran Pemancha Pengiran Anak Haji Muhammad Yasin le 6 juin, Omar Ali Saifuddien a rapidement affirmé son autorité en ordonnant l'enterrement de son frère à l'encontre des préférences locales. À 14h30, le résident britannique Pretty l'a officiellement reconnu comme étant le sultan Omar Ali Saifuddien III, le 28e sultan de Brunei. Malgré les origines floues de cette décision entre le gouverneur du Sarawak Anthony Abell et le Conseil d'État du Brunei, il a été révélé plus tard que Pretty avait installé Omar Ali Saifuddien contre une opposition locale importante."
 BRU_sultan.4.a:0 "Félicitations, Sultan"
 BRU_sultan.5.t:0 "Couronnement du sultan Omar Saifuddien III de Brunei"
 BRU_sultan.5.d:0 "Le 4 juin 1950, suite au décès de son frère, le sultan Omar Ali Saifuddien III fut déclaré sultan de Brunei. Proclamé par Pengiran Pemancha Pengiran Anak Haji Muhammad Yasin le 6 juin, Omar Ali Saifuddien a rapidement affirmé son autorité en ordonnant l'enterrement de son frère à l'encontre des préférences locales. À 14h30, le résident britannique Pretty l'a officiellement reconnu comme étant le sultan Omar Ali Saifuddien III, le 28e sultan de Brunei. Malgré les origines floues de cette décision entre le gouverneur du Sarawak Anthony Abell et le Conseil d'État du Brunei, il a été révélé plus tard que Pretty avait installé Omar Ali Saifuddien contre une opposition locale importante."
 BRU_sultan.5.a:0 "Félicitations, Sultan"
 BRU_sultan.6.t: "Ehsani nommé héritier, MacBryan comme régent"
 BRU_sultan.6.d: "À la suite de la mort du sultan Ahmad Tajuddin, Brunei s'est retrouvé au bord de la rupture politique. Les tensions étaient vives entre le bloc réformiste - qui défendait la princesse Ehsani Nor comme héritière légitime - et les factions étrangères du monde des affaires et de la résidence favorisant Gerald MacBryan, le conseiller colonial britannique devenu concurrent politique.\n\nPour éviter des troubles civils et un embarras international, le Conseil consultatif royal et la résidence britannique ont négocié un compromis délicat : Ehsani Nor sera déclarée sultane couronnée et successeur légitime, mais Gerald MacBryan servira de régent jusqu'à ce qu'elle « atteigne la maturité appropriée en matière de gouvernance », une expression critiquée par les réformistes comme un écran de fumée pour le contrôle étranger.\n\nMacBryan, désormais intitulé « Seigneur-Régent du Sultanat », supervisera les affaires nationales, les relations étrangères et les concessions de ressources - en particulier aux entreprises britanniques et américaines - jusqu'à ce qu'Ehsani soit jugé prêt. Bien qu'elle porte le titre de Sultane en attente, ses pouvoirs restent pour l'instant largement symboliques.\n\nEhsani a publiquement accepté cet arrangement « dans l'intérêt de l'harmonie nationale », mais des sources au sein du palais royal suggèrent que sa patience pourrait ne pas durer. Dans tout le pays, ses partisans scandent doucement son nom, tandis que d'autres craignent que Brunei ait simplement échangé une couronne contre une autre - une couronne britannique et drapé dans des contrats pétroliers.\n\nLe décor est désormais planté pour une dualité de gouvernement : un jeune monarque en attente et un régent soutenu par le capital, la couronne et l'empire." 
 BRU_sultan.6.a: "Le trône lui appartient par le sang. L'État lui appartient - pour l'instant."
 BRU_sultan.7.t: "Un trône divisé : la crise de succession brunéienne"
 BRU_sultan.7.d: "Le décès soudain du sultan Ahmad Tajuddin a plongé la cour royale de Brunei dans la tourmente. Sans héritier officiellement confirmé, trois prétendants ont émergé pour occuper le trône désormais vacant, chacun représentant des visions très différentes de l'avenir du sultanat.\n\nLa princesse Ehsani Nor, fille unique du défunt sultan, bénéficie d'un soutien important de la part de l'élite réformatrice, de certains érudits religieux et de nombreux membres de la classe moyenne urbaine. Son père lui aurait confié son souhait de conduire Brunei vers une nouvelle ère de modernité islamique, d'égalité des sexes et d'autonomie prudente. Cependant, sa candidature se heurte à une forte résistance de la part de la résidence britannique conservatrice et des nobles traditionalistes.\n\nPengiran Omar Ali Saifuddien, cousin du défunt sultan et vétéran de la politique de cour, bénéficie du plein soutien de la résidence britannique à Brunei. Monarchiste loyal et conservateur religieux, il est considéré comme une figure stabilisatrice et promet la continuité et le respect des traités impériaux. La Résidence a déjà commencé à préparer ses documents d'investiture.\n\nGerald MacBryan, un conseiller colonial britannique ayant des liens présumés avec la famille Brooke du Sarawak et un soutien secret de la Standard Oil, a fait une déclaration choquante : il est le régent légitime de par sa nomination de la « stratégie de modernisation étrangère » du défunt sultan. Bien que controversé et dépourvu de lignée noble, il a conquis les principaux intérêts pétroliers et les ambassades étrangères, y compris les murmures d'encouragement américains.\n\nBrunei se trouve à la croisée des chemins. Le trône attend, mais celui qui portera la couronne pourra décider de l'âme même de la nation."
 BRU_sultan.7.a: "Pengiran Omar Ali Saifuddien"
 BRU_sultan.7.b: "Princesse Ehsani Nor"
 BRU_sultan.7.c: "Gérald MacBryan"
 BRU_Ehsani.1.t: "Couronnement de Sultanah Ehsani Ier"
 BRU_Ehsani.1.d: "Après ce que beaucoup appellent maintenant la guerre des lettres et des mensonges, le couronnement longtemps retardé de la sultane Ehsani Nor binti Ahmad Tajuddin a finalement eu lieu lors d'une cérémonie majestueuse et symbolique à Bandar Seri Begawan, au milieu des gongs qui sonnent, des récitations coraniques et des insignes royaux resplendissants transmis de génération en génération de sultans.\n\nCe moment n'a pas été facile. Pendant plus d'un an, la légitimité de la prétention d'Ehsani au trône a été vivement contestée par des factions conservatrices dirigées par Omar Ali Saifuddien, qui affirmaient qu'une femme sur le trône violait l'esprit de la gouvernance malaiso-islamique traditionnelle. Leur résistance a été enhardie par les conseillers coloniaux britanniques, qui ont discrètement favorisé Omar comme une option « plus stable » pour garantir l'accès continu de l'Occident au pétrole et à l'obéissance politique de Brunei.\n\nMais les temps avaient changé. Ehsani, armée du testament mourant de son père, du soutien discret de la société civile progressiste et des murmures de sympathie de la part de jeunes diplomates britanniques, a résisté à la tempête. Ses partisans ont habilement déjoué le bloc d'Omar grâce à des appels diplomatiques, des pétitions publiques et une alliance stratégique avec la classe marchande de Kampong Ayer, qui considérait son règne comme une promesse de modernisation et d'expansion des libertés civiles.\n\nLorsque le sceau royal final a été apposé et que l'épée de cérémonie a été placée dans ses mains par le Grand Mufti, la foule rassemblée a scandé \"Daulat Tuanku ! Daulat Tuanku !\", un cri non seulement pour le monarque, mais pour un nouveau chapitre de l'histoire de Brunei. Le couronnement d'Ehsani est un symbole profond : de la féminité au pouvoir, du progressisme islamique et de la tentative de Brunei de se forger une identité postcoloniale unique dans le monde de la guerre froide."
 BRU_Ehsani.1.a: "Salut à tous la Sultanah ! Brunei se relève."
 BRU_Ehsani.2.t: "Contenir la folie de MacBryan"
 BRU_Ehsani.2.d: "Alors que Gerald MacBryan refusait de reconnaître le règne d'Ehsani, des officiers loyalistes ont fait une descente dans son complexe. Il a été retrouvé portant une armure de cérémonie, se déclarant « le Roi Soleil de Bornéo ». Il est désormais confiné à l'Istana sous surveillance."
 BRU_Ehsani.2.a: "Laissez-le aboyer depuis sa cage dorée."
 BRU_Ehsani.3.t: "Organiser le mariage de MacBryan"
 BRU_Ehsani.3.d: "Pour neutraliser pacifiquement MacBryan, le Conseil royal a suggéré de le marier à une noble noble, en espérant que l'amour (ou le scandale) émousserait ses ambitions politiques. Les rumeurs tourbillonnent, mais MacBryan semble réceptif... Quoique légèrement confus."
 BRU_Ehsani.3.a: "S'il ne peut pas gouverner, laissez-le faire l'amour."
 BRU_MacBryan.3.t: "Gerald MacBryan couronné"
 BRU_MacBryan.3.d: "Dans un rebondissement sans précédent et controversé dans l'histoire de l'Asie du Sud-Est, Gerald MacBryan, un officier colonial britannique devenu conseiller royal, a été couronné sultan de Brunei après la mort du sultan Ahmad Tajuddin. Sans successeur clair et sous l'immense pression britannique, le conseil de régence de Bruneian - fragmenté et craignant une crise républicaine ou communiste - a approuvé à l'unanimité la candidature symbolique et stratégique de MacBryan.\n\nDésormais connu sous le nom de Sultan Jaliluddin MacBryan Ier, le nouveau dirigeant s'est engagé à « préserver la souveraineté du Brunei dans le cadre d'un partenariat britannique protecteur ». Alors que de nombreux membres de la noblesse malaise restent incertains, certains considèrent son règne comme une mesure de transition nécessaire pour maintenir la stabilité en période d'instabilité.\n\nDans toute l'Asie du Sud-Est, les monarques et les révolutionnaires sont sous le choc. A Londres, Whitehall se montre prudent mais pas mécontent. Et à Jakarta, on murmure déjà que ce « sultan blanc » n'est rien d'autre qu'une marionnette de l'empire.\n\nPourtant, dans les couloirs de l'Istana Nurul Iman, le pétrole coule à flot, les bannières flottent et le sultan - en songket malais et en insignes occidentaux - promet un royaume réformé, prospère et loyal."
 BRU_MacBryan.3.a: "La Couronne est peut-être étrangère, mais le pétrole nous appartient." 
 BRU_MacBryan.7.t: "Offre au Sarawak"
 BRU_MacBryan.7.d: "Son règne étant désormais fermement établi, le sultan Gerald MacBryan a décidé de raviver la gloire de la domination historique de Brunei. La colonie de la Couronne du Sarawak, qui faisait autrefois partie des territoires précoloniaux du Brunei avant la montée de la dynastie Brooke, est depuis longtemps un symbole de souveraineté perdue.\n\nDans une manoeuvre diplomatique audacieuse, le sultan a officiellement offert au gouvernement du Sarawak sans Rajah un statut de protectorat sous le sultanat renouvelé de Bruneian. En échange de la protection et de la réintégration partielle du Brunei, le Sarawak bénéficierait d'une large autonomie interne, de droits administratifs communs et d'une assistance économique, en particulier dans le développement pétrolier.\n\nLe Sultan déclara dans son message royal :\n\"Nous ne cherchons pas la conquête, mais la réconciliation. Que nos frères du Sarawak reviennent sous le Croissant, non pas en tant que sujets, mais en tant que partenaires dans notre destin commun.\"\n\nLes autorités britanniques n'ont pas encore commenté, mais les regards se tournent désormais vers Kuching. Vont-ils accepter le croissant de MacBryan ou s'accrocher à l'Union Jack ?"
 BRU_MacBryan.7.a: "Que l'histoire soit restaurée par la diplomatie."
 BRU_MacBryan.8.t: ""
 BRU_MacBryan.8.d: ""
 BRU_MacBryan.8.a: ""
 BRU_MacBryan.8.b: ""
 BRU_MacBryan.9.t: "Offre de protectorat du Brunei : acceptée"
 BRU_MacBryan.9.d: "Après de minutieuses délibérations et un sentiment nationaliste croissant à Kuching, l'administration coloniale du Sarawak - privée du régime de Brooke et soumise à la pression croissante de l'instabilité régionale - a choisi d'accepter la proposition de protectorat du sultan MacBryan.\n\nBien que cet accord reste controversé parmi les observateurs britanniques, de nombreux Sarawakiens y voient une chance d'acquérir une plus grande autonomie, une plus grande protection et une plus grande solidarité culturelle sous la direction d'une autre puissance de Bornéo, plutôt que de rester une colonie de la Couronne isolée sous une métropole lointaine.\n\nDes manifestations ont éclaté parmi certaines factions pro-Commonwealth, mais des célébrations ont été observées dans les rues de Miri, Limbang et Sibu. Le croissant brunéien a été érigé aux côtés du drapeau de l'État du Sarawak, et le sultan MacBryan a proclamé la naissance d'une « ère pan-bornéo »."
 BRU_MacBryan.9.a: "Ensemble, nous retrouverons notre grandeur."
 BRU_MacBryan.10.t: "Offre de protectorat du Brunei : rejetée"
 BRU_MacBryan.10.d: "À la suite de consultations de haut niveau avec des responsables coloniaux britanniques et des dirigeants internes à Kuching, le gouvernement du Sarawak a formellement rejeté l'offre de protectorat de Brunei.\n\nAlors que certaines factions autochtones ont exprimé leur intérêt pour la vision pan-bornéo du sultan MacBryan, la plupart des conseillers ont évoqué des préoccupations concernant la souveraineté, la centralisation brunéienne et l'enchevêtrement étranger. Londres s'est également opposée discrètement à cette décision, craignant d'affaiblir le contrôle du Commonwealth dans la région.\n\nDans un discours public, le gouverneur par intérim a déclaré :\n\"Le Sarawak se tient aux côtés de la Couronne. Nous reconnaissons notre histoire, mais notre avenir réside dans le progrès et le partenariat au sein de la famille britannique, et non dans la fidélité à un trône.\"\n\nLes tensions pourraient monter à mesure que Brunei digère la rebuffade, et les agitateurs pro-syndicaux ont commencé à diffuser des brochures appelant à « l'unité de Bornéo maintenant »."
 BRU_MacBryan.10.a: "Tôt ou tard, tout Bornéo sera à nous."
 BRU_Omar.1.t: "Jawatankuasa Menyiasat Perlembagaan"
 BRU_Omar.1.d: "Le sultan a formé un comité de révision constitutionnelle - Jawatankuasa Menyiasat Perlembagaan - chargé d'évaluer les propositions constitutionnelles britanniques de 1953. Le comité enquêtera sur l'opinion publique et déterminera si les réformes sont conformes aux coutumes islamiques et malaises."
 BRU_Omar.1.a: "Que les gens soient entendus par l'intermédiaire du comité."
 BRU_Omar.2.t: "Réviser le projet d'Abell"
 BRU_Omar.2.d: "Le projet constitutionnel de 1954 rédigé par Malcolm MacDonald et Anthony Abell a été renvoyé au Brunei avec des suggestions de révisions. Omar Ali, prudent mais pragmatique, accepte des changements mineurs qui préservent l'autorité royale tout en autorisant un nombre limité de membres élus au conseil."
 BRU_Omar.2.a: "Nous nous moderniserons, mais selon nos conditions."
 BRU_Omar.3.t: "Les réformes proposées par AM Azahari"
 BRU_Omar.3.d: "AM Azahari, leader du parti de gauche Barisan Rakyat, a présenté des revendications en faveur d'une réforme politique radicale : un conseil démocratique, une refonte de l'éducation et une solidarité malaise. Bien que controversé, sa popularité auprès des jeunes augmente."
 BRU_Omar.3.a: "Invitez-le à l'Istana et voyez ce qu'il veut vraiment."
 BRU_Omar.3.b: "Rejetez catégoriquement ces bêtises communistes."
 BRU_Omar.4.t.a: "Début des pourparlers Merdeka"
 BRU_Omar.4.d.a: "Avec un soutien public croissant en faveur de l'indépendance, le sultan Omar Ali a ouvert des pourparlers préliminaires sur la Merdeka (indépendance) avec la résidence britannique. Bien que prudent, Londres a indiqué sa volonté de négocier la transition progressive du Brunei vers l'autonomie."
 BRU_Omar.4.a.a: "Nous serons libres - selon nos conditions, avec Allah comme témoin."
 BRU_Omar.4.t.b: "Les Britanniques signalent le réveil politique du Sarawak"
 BRU_Omar.4.d.b: "À la suite de l'indépendance de la Malaisie en 1957, un vent de changement a commencé à souffler sur les forêts tropicales et les rivières du Sarawak. Le ministère britannique des Colonies a discrètement signalé que le Sarawak devait commencer à se préparer à une éventuelle autonomie gouvernementale.\n\nÀ cette fin, des réformes constitutionnelles limitées ont été introduites, notamment un Conseil Negri élargi, la création d'élections locales et une représentation croissante des communautés autochtones Dayak et chinoises.\n\nLes administrateurs britanniques, méfiants face à l'influence croissante du communisme dans la région, souhaitent assurer une transition progressive et contrôlée qui équilibre les dirigeants autochtones, les intérêts communautaires et la loyauté envers la Couronne. Certains suggèrent discrètement qu'une future fédération avec la Malaisie pourrait être un objectif final viable, si la population parvient à être convaincue.\n\nLa voie à suivre n'est pas claire : certains soutiennent une évolution constitutionnelle prudente sous la direction britannique, tandis que d'autres, en particulier parmi les dirigeants chinois et les jeunes dirigeants Dayak, plaident pour une participation plus directe aux discussions régionales sur la décolonisation."
 BRU_Omar.4.a.b: "Préparons-nous de manière responsable à l'autonomie gouvernementale."
 BRU_Omar.4.t.c: "La Malaisie invite le Sarawak à discuter de l'avenir régional"
 BRU_Omar.4.d.c: "Avec l'indépendance acquise et la consolidation interne en cours, le Premier ministre [MAL.getleader] regarde désormais vers l'est, de l'autre côté de la mer de Chine méridionale. Bornéo britannique reste sous administration de la Couronne, mais avec la propagation du sentiment anticolonial et les inquiétudes croissantes liées à la guerre froide, une solution régionale est discrètement recherchée.\n\nTunku a lancé l'idée d'une fédération ou « Malaisie » qui pourrait un jour inclure le Sarawak, le nord de Bornéo (Sabah) et éventuellement Brunei - une vision grandiose visant à unir le monde malais tout en le protégeant du communisme et de l'instabilité raciale.\n\nUne délégation d'observateurs informels et de conseillers constitutionnels a été envoyée à Kuching pour ouvrir un dialogue de bas niveau. Les dirigeants du Sarawak restent prudents, mais il existe un intérêt évident pour un partenariat plus approfondi.\n\nC'est un moment délicat. Nous devons équilibrer nos ambitions avec la diplomatie, en veillant à ce que la population du Sarawak considère cela non pas comme une absorption, mais comme un partenariat égal dans une identité nationale plus large."
 BRU_Omar.4.a.c: "Entamez des discussions exploratoires : nous offrons un avenir partagé."
 BRU_Omar.5.t: "Jetez MacBryan à l'asile"
 BRU_Omar.5.d: "Le sultan Omar Ali, désormais assuré de son règne, considère Gerald MacBryan comme une menace pour la dignité nationale. Ses discours erratiques et sa politique bizarre ont alarmé les responsables britanniques. Aujourd'hui, Omar a ordonné la détention de MacBryan et son emprisonnement discret dans un asile à Labuan."
 BRU_Omar.5.a: "Pour la santé mentale et la souveraineté du Brunei."
 BRU_Mil.1.t: "Brunei demande l'aide du régiment malais"
 BRU_Mil.1.d: "Le sultanat de Brunei, confronté à des tensions croissantes et ayant besoin d'une force de défense fiable, a officiellement demandé l'aide du régiment malais. Ils proposent une formation conjointe, la mise en garnison des champs pétrolifères de Miri et une loyauté symbolique envers le Yang di-Pertuan Agong."
 BRU_Mil.1.a: "Accordez la demande. Brunei ne doit pas tomber."
 BRU_Mil.1.b: "Nous ne pouvons pas épargner des forces pour Brunei."
 BRU_Mil.2.t: "Un régiment malais arrive à Bandar"
 BRU_Mil.2.d: "Les transports malais sont arrivés aujourd'hui au port de Muara, débarquant des unités du régiment malais. Leur présence renforcera les défenses du sultanat et approfondira l'intégration régionale. Des célébrations ont eu lieu dans la capitale tandis que les citoyens saluaient les héros malais."
 BRU_Mil.2.a: "Nous ne sommes plus seuls."
 BRU_Mil.3.t: "KL refuse notre appel"
 BRU_Mil.3.d: "Le gouvernement malais a poliment décliné notre demande de soutien, invoquant des contraintes de ressources. Sans leur aide, nous devons nous appuyer sur des milices internes et réorganiser nos défenses locales contre les menaces tant étrangères que intérieures."
 BRU_Mil.3.a: "Nous serons seuls, comme nous l'avons toujours fait."
 BRU_Econ.0.t: "Révision de l'accord pétrolier de 1906"
 BRU_Econ.0.d: "Alors que nos gisements de pétrole deviennent de plus en plus essentiels à notre économie, des voix au sein du palais et parmi notre nouvelle génération d'administrateurs ont soulevé des inquiétudes concernant l'ancien accord pétrolier de 1906 avec les Britanniques. Les termes initiaux, signés dans des circonstances différentes, accordent à la résidence britannique une surveillance et un contrôle importants sur nos revenus pétroliers, la part du lion des bénéfices revenant à Londres.\n\nAujourd'hui, face à la montée du sentiment nationaliste dans la région et à la modernisation de l'État en jeu, Son Altesse Sultana Ehsani Nor a demandé une réévaluation formelle de l'accord. Nous recherchons une part plus équitable de nos propres ressources et une voie plus claire vers une pleine souveraineté économique. Il ne s'agit pas simplement d'une question financière : c'est une question de dignité et d'avenir du Brunei."
 BRU_Econ.0.a: "Notre pétrole doit alimenter Brunei, pas les lampes de Londres."
 BRU_Econ.1.t: "Brunei cherche à renégocier l'accord pétrolier de 1906"
 BRU_Econ.1.d: "Notre résident au Brunei a rapporté que Sultana Ehsani Nor, avec le soutien de plusieurs conseillers réformistes et factions commerciales, demandait officiellement une révision de l'accord pétrolier de 1906. Leurs revendications incluent une plus grande part des bénéfices, une surveillance partielle des opérations liées aux ressources et la fin du pouvoir discrétionnaire absolu du Royaume-Uni sur les exportations d'énergie.\n\nMême si le sultanat reste un protectorat, la montée des pressions nationalistes et la présence commerciale américaine croissante à Bornéo suggèrent que le maintien d'un contrôle sans flexibilité pourrait se retourner contre lui. Le ministère des Affaires étrangères doit maintenant décider s'il doit répondre aux demandes du sultanat ou préserver notre domination sur l'or noir de Bornéo."
 BRU_Econ.1.a: "Laissez-leur une plus grande part - c'est mieux que de perdre le puits."
 BRU_Econ.1.b: "Nous avons signé en 1906 - et nous le pensions sincèrement."
 BRU_Econ.2.t: "La Grande-Bretagne accepte les nouvelles conditions pétrolières"
 BRU_Econ.2.d: "Après des décennies de contrôle britannique sur les revenus pétroliers du Brunei, le gouvernement de Sa Majesté a accepté de réviser l'accord pétrolier de 1906. Cette décision historique fait suite à un lobbying intense du sultan [BRU.getleader] et du cercle réformiste, qui ont soutenu que la prospérité de Brunei ne devait plus dépendre uniquement de la bonne volonté coloniale.\n\nAlors que les Britanniques conservent une surveillance importante, Brunei bénéficiera désormais d'une plus grande part des bénéfices pétroliers, de droits de cogestion limités et d'une voix dans les décisions d'exportation. Les réformistes ont salué cela comme une « révolution économique sans effusion de sang », tandis que les journaux nationalistes l'ont salué comme le premier pas majeur vers la souveraineté économique.\n\nCette décision renforce la légitimité du sultan et porte un coup dur aux factions conservatrices accrochées à des arrangements coloniaux dépassés."
 BRU_Econ.2.a: "Nous forons pour Brunei, pas pour Britannia."
 BRU_Econ.3.t: "La Grande-Bretagne refuse de renégocier"
 BRU_Econ.3.d: "Le ministère des Affaires étrangères de Londres a catégoriquement rejeté la demande du Brunei de modifier l'accord pétrolier de 1906, invoquant la « légitimité incontestable » du traité initial. Cette décision porte un coup dur au prestige du sultan[BRU.getleader], qui avait misé un capital politique considérable sur la renégociation.\n\nLes rues de Bandar Seri Begawan sont tendues. Les groupes d'étudiants, les religieux et les professionnels de la classe moyenne ont tous exprimé leur mécontentement. Des rumeurs circulent concernant des réunions secrètes entre des réformateurs du palais et des représentants américains du secteur pétrolier - et même des murmures de défi parmi les propres conseillers du sultan.\n\nMême si aucune confrontation publique n'a encore eu lieu, ce rejet pourrait marquer le début de la fin de l'hégémonie économique britannique sur l'avenir du Brunei."
 BRU_Econ.3.a: "Si Londres n'écoute pas, peut-être que Washington le fera."
 BRU_Econ.4.t: "Brunei demande des révisions des salaires de la fonction publique"
 BRU_Econ.4.d: "L'administration brunéienne, sous la direction du sultan [BRU.getleader] et diplomate. Ils ont télégraphié une demande formelle d'augmentation des salaires et indemnités de leur fonction publique. Le sultan soutient que les responsabilités croissantes en matière de développement, l'augmentation du coût de la vie et le maintien en poste d'administrateurs brunéiens qualifiés justifient cette révision.\n\nLe ministère des Colonies est désormais confronté à un dilemme. L'approbation pourrait contribuer à maintenir la bonne volonté au Brunei et à garantir un gouvernement local plus efficace à mesure que le développement s'accélère dans le cadre du premier plan de développement national. Cependant, cela pourrait également créer un précédent coûteux à travers l'Empire et encourager de nouvelles demandes d'autonomie de la part d'autres protectorats et colonies."
 BRU_Econ.4.a: "Approuvez la révision. Un employé bien nourri est un employé fidèle."
 BRU_Econ.4.b: "Inacceptable. Nous devons maintenir la prudence budgétaire."
 BRU_Econ.5.t: "Le ministère des Colonies approuve les révisions salariales"
 BRU_Econ.5.d: "Dans une rare démonstration de flexibilité, le ministère des Colonies britannique a approuvé la demande du gouvernement brunéien d'augmenter les salaires et indemnités des fonctionnaires. La proposition, soumise par Sultan [BRU.getleader] avec le soutien du commissaire E. R. Bevington, citait l'augmentation de la charge de travail, l'augmentation du coût de la vie et la nécessité de retenir des administrateurs compétents dans un contexte de développement national rapide.\n\nCette approbation marque une victoire discrète mais importante pour l'administration brunéienne. Alors que Londres a averti que « de tels ajustements doivent rester exceptionnels », ils ont reconnu comme justification l'augmentation des revenus pétroliers et des responsabilités de développement du Brunei.\n\nLa décision a été bien accueillie par les fonctionnaires et les modérés du camp nationaliste, qui y voient le signe que l'autonomie du Brunei dans les affaires intérieures s'étend progressivement."
 BRU_Econ.5.a: "Qu'on le sache : Brunei récompense ses fidèles serviteurs."
 BRU_Econ.6.t: "Conflit salarial avec le ministère des Colonies"
 BRU_Econ.6.d: "Malgré les responsabilités croissantes confiées aux fonctionnaires brunéiens, une demande officielle d'augmentation des salaires et des indemnités adressée au ministère britannique des Colonies a été refusée.\n\nSultan [BRU.getleader], préoccupé par l'augmentation de la charge de travail, le coût de la vie et la nécessité de retenir des administrateurs qualifiés, a officiellement soumis la demande avec le soutien des membres du Conseil d'État et du commissaire E. R. Bevington. Cependant, Whitehall a jugé la proposition « fiscalement imprudente » et a mis en garde contre « la création de précédents insoutenables dans les territoires coloniaux ».\n\nCe rejet a suscité une légère frustration parmi les employés du gouvernement et un mécontentement murmuré parmi les voix nationalistes montantes, qui affirment que même si les revenus pétroliers du Brunei augmentent, les fonctionnaires locaux continuent de servir dans l'ombre d'une sous-indemnisation et du veto britannique."
 BRU_Econ.6.a: "Nous devons supporter ce affront - pour l'instant."
 BRU_Econ.7.t: "Lancement du Premier Plan National de Développement"
 BRU_Econ.7.d: "Dans un geste discret mais transformateur, Notre Sultan [BRU.getleader] a dévoilé le premier plan de développement national (Rancangan Kemajuan Negara Pertama - RKN 1), approuvé par le Conseil d'État avec un budget audacieux de 100 millions de dollars pour une campagne de modernisation sur cinq ans.\n\nCette initiative ambitieuse, décrite par les observateurs comme une « révolution sans effusion de sang », vise à sortir Brunei de la stagnation et à l'amener sur la scène régionale en tant que monarchie islamique malaise moderne. Les infrastructures, les soins de santé, l'éducation, les communications et le développement rural doivent être les piliers de l'avenir du Brunei.\n\nIl s'agit d'une entreprise monumentale pour une petite nation, mais qui reflète la vision du sultan de Melayu Islam Beraja adaptée à l'ère moderne."
 BRU_Econ.7.a: "Que le développement du Brunei commence."
 BRU_Econ.8.t: "Arrivée d'E.R Bevington"
 BRU_Econ.8.d: "Sous la direction directe d'E. R. Bevington, un fonctionnaire chevronné du ministère des Colonies des Fidji, Brunei se lance désormais dans son effort le plus ambitieux à ce jour pour moderniser sa nation à travers le premier plan de développement national (1953-1958).\n\nCe vaste plan - défendu par le Sultan [BRU.getleader] - transformera la nation d'un sultanat tranquille en un modèle de bien-être et de prospérité en Asie du Sud-Est. Les objectifs sont clairs et révolutionnaires :\n\nDes ponts traverseront les vallées fluviales et les estuaires.\n\nLes centrales électriques apporteront de l'électricité aux maisons autrefois plongées dans l'obscurité.\n\nLes écoles modernes se développeront pour éduquer la prochaine génération de Brunéiens.\n\nLes régimes de retraite apporteront la dignité aux personnes âgées et handicapées.\n\nLes projets d'hôpitaux, d'irrigation, de télécommunications et de transport propulseront Brunei vers l'ère moderne.\n\nPour un pays de sa taille, il ne s'agit rien de moins qu'une révolution sans effusion de sang, une révolution qui place le Brunei fermement sur la voie de l'autosuffisance et d'un niveau de vie élevé - sans pour autant renoncer aux principes de Melayu Islam Beraja."
 BRU_Econ.8.a: "Nous garantirons un meilleur niveau de vie à nos sujets"
 BRU_Econ.9.t: "Agrandissement de l'aéroport de Brunei"
 BRU_Econ.9.d: "Construite à l'origine dans les années 1930 par l'armée impériale japonaise pour des opérations stratégiques, la modeste piste d'atterrissage de Pekan Brunei est depuis longtemps une relique silencieuse des temps les plus sombres. Aujourd'hui, sous la direction du Sultan [BRU.getleader] et face à la demande croissante de connectivité interrégionale, Brunei a entamé la transformation de cette relique de guerre en un aéroport commercial fonctionnel.\n\nEn 1953, le pays fait ses premiers pas dans le domaine de l'aviation civile avec des vols intérieurs reliant la ville de Brunei à Anduki, en soutien au district pétrolier de Belait. À peine deux ans plus tard, en 1955, Malayan Airways a commencé à assurer des liaisons régulières vers Labuan, Miri et Lutong, en utilisant l'avion fiable de Havilland Rapide de construction britannique. Le nombre de passagers a dépassé les 4 300 rien que cette année.\n\nÀ mesure que l'intégration régionale s'accélère, les installations limitées de l'aéroport ne peuvent plus répondre aux besoins logistiques croissants. Avec l'arrivée du Douglas DC-3 et du Fokker F27 Friendship, qui sera bientôt opérationnel, le gouvernement du sultan a approuvé un plan d'expansion et de modernisation majeur, visant à faire de l'aéroport de Brunei une plateforme internationale formelle pour Bornéo et au-delà."
 BRU_Econ.9.a: "Agrandir les pistes et les terminaux"
 BRU_Econ.10.t: "L'huile standard arrive à la porte"
 BRU_Econ.10.d: "Standard Oil, discrètement soutenue par le Département d'État américain, a formellement contacté notre tribunal avec une offre : une exploration et un développement conjoints des réserves pétrolières de Brunei, en échange de généreux investissements dans les infrastructures, de paiements annuels en dollars américains et d'une « expertise technique » en matière d'extraction des ressources.\n\nAlors que la Grande-Bretagne détient depuis longtemps des droits exclusifs sur nos champs pétroliers, un tel accord saperait leur contrôle et pousserait Brunei vers la souveraineté économique. Pourtant, cette décision n'est pas sans risques : accepter des investissements américains pourrait contrarier Londres et susciter des représailles secrètes. Pourtant, l'attrait du développement, de l'autonomie et du soutien américain est fort."
 BRU_Econ.10.a: "Dites aux Américains que nous sommes prêts à négocier."
 BRU_Econ.11.t: "Début des négociations sur le pétrole standard au Brunei"
 BRU_Econ.11.d: "Alors que l'influence britannique sur Brunei commence à décliner et que les entreprises américaines surveillent de près l'Asie du Sud-Est, Standard Oil a lancé une série de négociations aux enjeux élevés avec le tribunal de Brunei. Leur objectif est clair : garantir l'accès des États-Unis aux lucratives réserves pétrolières de Bornéo.\n\nLes champs pétroliers de Brunei restent soumis aux termes de l'accord vieillissant de 1906 avec Londres, mais la pression interne croissante, associée à la montée en puissance de Sultana Ehsani Nor et de sa cour de conseillers modernistes, pourrait enfin nous offrir une porte dérobée dans le jeu. Si nous prenons les choses en main, nous pouvons réduire le contrôle britannique, renforcer la présence de nos entreprises et jeter les bases de liens économiques plus profonds avec Brunei, peut-être même militaires."
 BRU_Econ.11.a: "Le pétrole est l'artère de l'empire : faites-nous entrer."
 BRU_Econ.11.b: "Trop risqué. Laissons les Britanniques maintenir leurs influences."
 BRU_Econ.12.t: "Standard Oil conclut un accord"
 BRU_Econ.12.d: "Le palais a été agité par des murmures d'industrie. Après mûre réflexion, le Sultan [BRU.getleader], conseillé par le conseil des technocrates et des économistes nationalistes, a accepté l'entrée de Standard Oil dans le secteur pétrolier de Brunei.\n\nAu mépris de la domination britannique sur l'extraction des ressources qui dure depuis des décennies, cette décision marque un tournant historique. Les Américains apportent avec eux des promesses de technologies d'extraction avancées, de formation d'ingénieurs locaux et - ce qui est le plus séduisant - de redevances versées directement au trésor brunéien, contournant les intermédiaires coloniaux.\n\nTandis que Londres fulmine en silence, les Brunéiens ordinaires regardent avec espoir l'or noir de la nation qui pourrait enfin affluer pour leur avenir, et non pour l'empire de quelqu'un d'autre."
 BRU_Econ.12.a: "Une ressource souveraine pour un peuple souverain."
 BRU_Econ.13.t: "Baisse du pétrole standard"
 BRU_Econ.13.d: "Standard Oil, sous la pression des élites conservatrices et des conseillers en résidence britanniques, a choisi de ne pas donner suite à l'accord Standard Oil proposé par notre gouvernement.\n\nLa crainte de nouveaux conflits géopolitiques et d'éventuelles réactions négatives de la part de Londres ont lourdement pesé sur la décision. Certaines voix au sein du palais ont vu cette offre comme une tentative voilée de transformer Brunei en un nouvel avant-poste américain en Asie - un exercice d'entreprise à la fois.\n\nMême si cette décision préserve l'équilibre actuel des pouvoirs, les réformateurs et les jeunes commencent à se demander si Brunei ne manque pas le monde moderne."
 BRU_Econ.13.a: "Nous chercherons d'autres options."