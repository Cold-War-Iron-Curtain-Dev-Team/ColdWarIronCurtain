l_french:
 WHILE_FOCUSING:0 "En se concentrant sur cela, il y aura les effets suivants :\n$EFF$"
 generic_focus:0 "Objectif national"
 army_effort:0 "Effort militaire"
 army_effort_desc:0 "Malgré les possibilités croissantes de la guerre aérienne et navale, le combat terrestre reste essentiel dans les guerres de demain. Avec de la préparation, on peut éviter de revivre l'enfer des tranchées."
 equipment_effort:0 "Effort d'équipement"
 equipment_effort_desc:0 "Les limites du matériel pouvant être transporté par l'infanterie sont constamment repoussées. Nous nous efforcerons de donner à nos troupes les meilleurs outils disponibles."
 motorization_effort:0 "Effort de motorisation"
 motorization_effort_desc:0 "La mobilité et la protection sont essentielles pour permettre à l'infanterie d'entrer et de sortir du terrain en toute sécurité. En nous concentrant sur ces évolutions, nous pourrons agir rapidement."
 doctrine_effort:0 "Effort doctrinal"
 doctrine_effort_desc:0 "Les doctrines militaires qui ont défini le combat terrestre pendant la Grande Guerre sont dépassées. Nous devons consacrer nos plus grands esprits à façonner la pensée militaire de demain."
 equipment_effort_2:0 "Effort d'équipement II"
 equipment_effort_2_desc:0 "Nous poursuivrons nos efforts pour garantir que notre infanterie et nos troupes de soutien soient armées du meilleur équipement possible de notre époque."
 mechanization_effort:0 "Effort de mécanisation"
 mechanization_effort_desc:0 "En repensant les possibilités de l'infanterie motorisée, nous pouvons repousser les limites des véhicules pouvant être construits aujourd'hui."
 doctrine_effort_2:0 "Effort doctrinal II"
 doctrine_effort_2_desc:0 "Le champ de bataille a changé non seulement dans l'entre-deux-guerres, mais aussi au cours des conflits récents. Nous devons continuellement réévaluer nos doctrines pour refléter cela."
 equipment_effort_3:0 "Effort d'équipement III"
 equipment_effort_3_desc:0 "Au lieu d'imiter ou d'acheter du matériel étranger, nous devrions viser à devenir le leader mondial des armes d'infanterie."
 armor_effort:0 "Effort d'armure"
 armor_effort_desc:0 "En appliquant ce que nous avons appris en mécanisant notre infanterie, nous pouvons également améliorer nos véhicules blindés."
 special_forces:0 "Forces spéciales"
 special_forces_desc:0 "Nous avons besoin de forces d'élite ; les troupes de montagne et les parachutistes devraient être notre priorité."
 aviation_effort:0 "Efforts aériens"
 aviation_effort_tt:0 "Pas assez d'emplacements de construction pour la base aérienne §Y§!"
 aviation_effort_desc:0 "Nulle part les progrès technologiques ne sont plus rapides que dans la guerre aérienne. L'aviation est un domaine que toute nation moderne doit maîtriser."
 fighter_focus:0 "Concentration du combattant"
 fighter_focus_desc:0 "Nous n'avons pas assisté à ce dernier combat aérien de la Grande Guerre. Garder une longueur d'avance dans le développement des avions de combat nous donnera un avantage à l'avenir."
 bomber_focus:0 "Focus sur les bombardiers"
 bomber_focus_desc:0 "Lorsque les gens du futur parleront de l'horreur des guerres d'aujourd'hui, le feu qui tombe du ciel occupera une place importante. Nous ferons de notre mieux pour que ces histoires soient racontées par nos ennemis."
 aviation_effort_2:0 "Effort aérien II"
 aviation_effort_2_desc:0 "De nouveaux progrès dans le domaine de l'aviation seront nécessaires pour bien intégrer notre force aérienne aux autres branches de l'armée."
 CAS_effort:0 "Effort du CAS"
 CAS_effort_desc:0 "Une armée moderne a besoin du soutien de véhicules non seulement au sol, mais aussi dans les airs."
 rocket_effort:0 "Effort de fusée"
 rocket_effort_desc:0 "Les moteurs de fusée et d'avion à réaction permettent des vitesses sans précédent aux navires sans pilote et avec équipage. Être pionnier dans ces technologies nous permettra de surprendre l'ennemi."
 NAV_effort:0 "Effort de NAV"
 NAV_effort_desc:0 "Tout comme la nouvelle guerre navale se déroule en partie sous la surface de l'eau, une partie se déroule dans les airs au-dessus des eaux."
 naval_effort:0 "Effort naval"
 naval_effort_tt:0 "Pas assez d'emplacements de construction pour les chantiers navals §Y§!"
 naval_effort_desc:0 "L'expansion de notre marine devrait être notre première priorité. Affectez toutes les ressources disponibles aux nouveaux chantiers navals et recherchez des navires de surface légers."
 GER_naval_effort2:0 "Agrandir les installations du chantier naval"
 GER_naval_effort2_desc:0 "Pour reconstruire véritablement une marine digne de mention, nous devons accroître considérablement notre capacité de construction navale."
 flexible_navy:0 "Marine souple"
 flexible_navy_desc:0 "Nous avons besoin d'une marine capable de bien plus qu'un simple combat direct."
 large_navy:0 "Grande Marine"
 large_navy_desc:0 "Adapter nos doctrines navales pour accueillir de grands navires et assurer la sécurité de nos convois commerciaux nous en apprendra beaucoup sur le type de navires dont nous avons besoin."
 submarine_effort:0 "Effort sous-marin"
 submarine_effort_desc:0 "La guerre sous-marine constitue le développement naval le plus passionnant depuis l'invention du torpilleur. Nous ferions bien non seulement de nous protéger contre les sous-marins, mais également de les utiliser contre les navires ennemis."
 cruiser_effort:0 "Effort de croiseur"
 cruiser_effort_desc:0 "Avant de faire des incursions dans la recherche avancée sur les cuirassés, les petits croiseurs ont besoin d'être remplacés."
 destroyer_effort:0 "Effort du Destructeur"
 destroyer_effort_desc:0 "En étudiant la conception et l'utilisation stratégique des sous-marins, nous avons également appris comment contrer ces stratégies. Les destroyers seront cruciaux pour cela."
 capital_ships_effort:0 "Effort en matière de navires capitaux"
 capital_ships_effort_desc:0 "La nation possédant le plus de cuirassés dominera les océans. Les cuirassés et les porte-avions représentent l'ancien et le nouveau en matière de supériorité navale."
 industrial_effort:0 "Effort industriel"
 industrial_effort_desc:0 "Concentrez tous nos efforts politiques sur la construction d'une industrie civile qui fera un grand bond en avant."
 industrial_effort_2:0 "Effort industriel II"
 industrial_effort_2_desc:0 "Avec une volonté de fer et une éthique de travail implacable, nous pouvons mobiliser les gens dans un autre grand effort industriel."
 construction_effort:0 "Efforts de construction"
 construction_effort_tt:0 "Pas assez d'emplacements de construction pour §Yusines civiles§!"
 construction_effort_desc:0 "La capacité industrielle civile ne doit pas être sous-estimée, même lorsque la guerre menace le monde."
 production_effort:0 "Effort d'armement"
 production_effort_tt:0 "Pas assez d'emplacements de construction pour l'usine militaire §Y§!"
 production_effort_desc:0 "Si vous pouvez construire des tracteurs, vous pouvez construire des chars ! Nous ne devons pas laisser notre capacité de production militaire prendre du retard."
 construction_effort_2:0 "Effort de construction II"
 construction_effort_2_desc:0 "Continuer à développer nos usines nous permettra d'accélérer la production de biens destinés au commerce et de poursuivre les efforts de construction."
 production_effort_2:0 "Effort d'armement II"
 production_effort_2_desc:0 "Essayer d'adapter les usines civiles pour produire du matériel militaire est inefficace. Nous devrions dès maintenant nous concentrer sur la préparation de la production militaire."
 production_effort_3:0 "Effort d'armement III"
 production_effort_3_desc:0 "Des efforts continus pour développer nos usines militaires sont nécessaires pour répondre à la demande de nouveaux équipements."
 infrastructure_effort:0 "Efforts en matière d'infrastructures"
 infrastructure_effort_desc:0 "Un pays sans infrastructure adéquate ne peut pas poursuivre des projets ou des constructions avancés."
 infrastructure_effort_tt:0 "Pas assez d'emplacements de construction pour l'infrastructure §Y§!"
 synth_oil_effort_tt:0 "Pas assez d'emplacements de construction pour la raffinerie synthétique §Y§!"
 infrastructure_effort_2:0 "Effort d'infrastructure II"
 infrastructure_effort_2_desc:0 "L'extension de nos infrastructures permettra d'assurer les transports et les communications nécessaires aux projets clandestins de haute technologie."
 construction_effort_3:0 "Effort de construction III"
 construction_effort_3_desc:0 "L'expansion de notre réseau d'infrastructures a considérablement amélioré notre capacité de construction."
 nuclear_effort:0 "Effort nucléaire"
 nuclear_effort_desc:0 "À l'aube d'une découverte qui changera le monde, nous ne pouvons pas laisser d'autres allumer le feu qui pourrait un jour consumer la Terre."
 extra_tech_slot:0 "Emplacement de recherche supplémentaire"
 extra_tech_slot_desc:0 "Notre expansion industrielle et d'autres avancées récentes pourraient nous permettre de mener davantage de R&D en parallèle."
 extra_tech_slot_2:0 "Emplacement de recherche supplémentaire II"
 extra_tech_slot_2_desc:0 "L'industrialisation rapide de notre pays a ouvert de nouvelles opportunités en matière de R&D que nous devrions poursuivre."
 technology_sharing:0 "Partage de technologie"
 technology_sharing_desc:0 "En partageant les avancées technologiques avec nos alliés, l'ensemble de notre faction sera en mesure de mener plus efficacement la R&D en temps de guerre."
 secret_weapons:0 "Armes secrètes"
 secret_weapons_desc:0 "Il est tentant de consacrer toutes les ressources supplémentaires au développement de chars et d'avions, mais le secret pour gagner les guerres réside dans de tout nouveaux domaines scientifiques ; l'électronique, les fusées et la recherche nucléaire."
 political_effort:0 "Effort politique"
 political_effort_desc:0 "Pour apporter des changements dans le monde, nous devons être capables d'apporter des changements dans notre propre pays. Le renforcement de notre position politique doit être la priorité."
 collectivist_ethos:0 "Ethos collectiviste"
 collectivist_ethos_desc:0 "Nos ennemis peuvent diviser et conquérir des nations de moindre importance, mais notre peuple restera uni. Tous pour un et un pour tous."
 liberty_ethos:0 "L'éthos de la liberté"
 liberty_ethos_desc:0 "En cette époque de fanatiques idéologiques qui cherchent à étouffer l'esprit humain, nous sauvegarderons les libertés individuelles et la liberté."
 militarism:0 "Militarisme"
 militarism_desc:0 "Ceux qui considèrent l'armée comme un mal nécessaire sont condamnés à hésiter face à la guerre. Nous allons ancrer le militarisme dans notre culture pour devenir un peuple de soldats."
 political_correctness:0 "Le politiquement correct"
 political_correctness_desc:0 "Les personnes ayant des opinions légèrement controversées ou embarrassantes semblent s'inquiéter de l'existence d'un vaste complot contre elles. Cela semble être une excellente idée."
 neutrality_focus:0 "Focus sur la neutralité"
 neutrality_focus_desc:0 "Alors que d'autres prétendent qu'il faut du courage et de la sagesse pour prendre parti dans un conflit mondial, nous savons qu'il en faut plus pour refuser."
 interventionism_focus:0 "Focus sur l'interventionnisme"
 interventionism_focus_desc:0 "Nous valorisons la liberté de tous, pas seulement de nos propres citoyens. Si prévenir la tyrannie signifie la guerre, qu'il en soit ainsi."
 military_youth:0 "Jeunesse militaire"
 military_youth_desc:0 "Les organisations visant à promouvoir la discipline et l'éducation politique des jeunes de notre pays favoriseront très tôt la loyauté et l'abnégation."
 deterrence:0 "Dissuasion"
 deterrence_desc:0 "Seuls, nous bénéficions rarement de la guerre. Heureusement, nous savons que la meilleure défense est celle qui est si connue qu'il n'est jamais nécessaire de l'utiliser."
 volunteer_corps:0 "Corps de volontaires"
 volunteer_corps_desc:0 "Forcer notre peuple à mourir pour des idéaux de liberté serait un exercice ironique, mais établir des moyens pour ceux qui souhaitent aider les gens à l'étranger ne l'est pas."
 paramilitarism:0 "Paramilitarisme"
 paramilitarism_desc:0 "Les principes militaires ont des applications en dehors du domaine militaire. Avec le développement d'unités semi-militarisées pour compléter nos forces armées, davantage de personnes bénéficieront d'une formation militaire."
 indoctrination_focus:0 "Endoctrinement"
 indoctrination_focus_desc:0 "Ayant établi notre idéologie comme étant fondée sur la vérité, elle peut être enseignée comme étant la vérité. L'éducation et les médias doivent refléter cette leçon."
 foreign_expeditions:0 "Expéditions à l'étranger"
 foreign_expeditions_desc:0 "Alors que nos ennemis sont prêts à intervenir dans des conflits lointains au nom de leurs idéaux, nous devons être prêts à faire de même pour les nôtres."
 why_we_fight:0 "Pourquoi nous combattons"
 why_we_fight_effect:0 "Si nous n'avons pas l'esprit §YPolitique étrangère neutre§! nous pourrons créer des factions.\n"
 why_we_fight_desc:0 "Le monde devient de plus en plus dangereux. Notre peuple a besoin de voir les atrocités commises par ceux qui ont soif de pouvoir. Il est temps de rallier le peuple à notre cause et de veiller à ce que chacun soit prêt à se battre pour notre liberté."
 political_commissars:0 "Commissaires politiques"
 political_commissars_desc:0 "Afin de garantir que nos politiques soient suivies dans la pratique militaire, nous intégrerons des responsables politiquement nommés dans les rangs militaires."
 internationalism_focus:0 "Focus sur l'internationalisme"
 internationalism_focus_desc:0 "L'idéologie ne connaît pas de frontières. Une autre nation peut se dire souveraine, mais nos convictions sont au-dessus de ces prétentions."
 nationalism_focus:0 "Focus sur le nationalisme"
 nationalism_focus_desc:0 "Notre nation est unique et nos réalisations politiques n'auraient pu se produire qu'ici. Nous devons lutter pour cela à tout prix."
 ideological_fanaticism:0 "Fanatisme idéologique"
 ideological_fanaticism_desc:0 "Nos valeurs et nos objectifs politiquement établis valent autant la peine de mourir que n'importe quelle foi ancienne. Tout adepte doit être prêt à affronter la mort, et ceux qui s'égarent doivent être préparés à affronter la mort."
 air_innovation:0 "Innovations aériennes"
 air_innovation_desc:0 "Les guerres modernes ne peuvent être gagnées sans dominer le ciel. Nous devons faire tout ce qui est en notre pouvoir pour développer l'armée de l'air !"
 air_innovation_2:0 "Innovations aériennes II"
 air_innovation_2_desc:0 "Chaque avantage que nous pouvons gagner dans le ciel est précieux. Nous devrions concentrer tous nos efforts sur le développement de nos combattants."
 naval_air_effort:0 "Effort aéronaval"
 naval_air_effort_desc:0 "L'efficacité des frappes aériennes contre des cibles navales a été démontrée par les Américains dès 1921. Nous ne devons pas négliger cette branche de l'armée de l'air si nous entendons faire la guerre à une puissance navale."
 german_focus:0 "Objectif national allemand"
 GER_autobahn:0 "Autoroute du Reich"
 GER_autobahn_tt:0 "Ajouter maximum §YInfrastructure§! dans §YBrandebourg§!, §YHanovre§!, §YThüringen§! et §YFranken§!"
 GER_autobahn_desc:1 "Depuis sa création en 1933, le projet de la Reichsautobahn a été un glorieux succès. Les efforts de construction ont réduit le chômage et les larges routes constituent un monument de la reprise économique de l'Allemagne. Il reste cependant beaucoup de travail à faire."
 GER_west_wall:0 "Mur ouest"
 GER_west_wall_desc:0 "Le Mur de l'Ouest est parallèle à la célèbre ligne Maginot de la France, occupant une grande partie du même terrain que la ligne Siegfried lors de la précédente Weltkrieg. Fortifier ses défenses nous permettra de tenir la frontière avec moins d'hommes, libérant ainsi les divisions pour participer à d'éventuelles campagnes vers l'Est."
 GER_west_wall_tt:0 "§RSi la Rhénanie est remilitarisée, vous gagnerez également :§!\n"
 GER_west_wall_forts:0 "Ajoutez §Y12 Forts terrestres§! à la frontière française.\n"
 GER_tactical_air_effort:0 "Effort aérien tactique"
 GER_tactical_air_effort_desc:0 "La victoire sera obtenue en anéantissant les forces terrestres ennemies. Nous devons nous concentrer sur le soutien de nos propres armées par des frappes tactiques contre des cibles proches et profondes."
 GER_long_range_escorts:0 "Escortes à longue portée"
 GER_long_range_escorts_desc:0 "Nos bombardiers tactiques et stratégiques nécessitent des escortes à plus longue portée pour assurer une protection jusqu'à la zone cible et retour."
 GER_strategic_air_effort:0 "Effort aérien stratégique"
 GER_strategic_air_effort_desc:0 "La victoire s'obtiendra en détruisant les industries ennemies. Nous devons concentrer nos efforts sur la conception et la production de bombardiers stratégiques."
 GER_army_innovation:0 "Innovations de l'armée"
 GER_army_innovation_desc:1 "Heinz Guderian et d'autres théoriciens radicaux font pression pour de nouvelles doctrines audacieuses mettant l'accent sur la communication, l'identification des « schwerpunkte » et les concentrations locales de forces interarmes. Leur donner les rênes libres pourrait aider à éviter les horreurs du hachoir à viande de la Grande Guerre."
 GER_soviet_treaty:0 "Traité avec l'URSS"
 GER_soviet_treaty_desc:0 "Nous pouvons conclure un nouveau traité de recherche avec l'Union soviétique afin de développer, principalement, de meilleurs chars. S'ils sont d'accord, nous pourrons rouvrir l'école de chars que nous avons fermée à Kama en 1933. La coopération soviétique signifiera bien entendu qu'eux aussi bénéficieront des innovations réalisées..."
 GER_air_innovation_2:0 "Innovations aériennes II"
 GER_air_innovation_2_desc:0 "Les tâches du ministère de l'Air du Reich sont d'une importance capitale. La Luftwaffe doit être l'armée de l'air la plus avancée au monde !"
 GER_army_innovation_2:0 "Innovations de l'armée II"
 GER_army_innovation_2_desc:0 "Les enseignements tirés de nos installations en URSS nous permettront d'améliorer encore nos doctrines et nos équipements. Cependant, cette fois, nous garderons les avancées pour nous !"
 GER_rocketry_focus:0 "Fusée"
 GER_rocketry_focus_desc:0 "La propulsion par fusée est la clé d'innovations massives dans les trois branches militaires."
 GER_wunderwaffe:0 "Wunderwaffe"
 GER_wunderwaffe_desc:0 "Heisenberg et von Braun rongent leur frein pour explorer certaines idées qu'ils ont sur de véritables armes apocalyptiques. Tout ce dont ils ont besoin, ce sont des ressources supplémentaires..."
 GER_mol_rib_pact:0 "Pacte Molotov-Ribbentrop"
 GER_mol_rib_pact_desc:0 "Un traité d'amitié et de non-agression avec l'URSS pourrait lui retourner l'estomac, mais il permettrait à son précieux pétrole de continuer à affluer vers l'Allemagne. L'addendum secret divisera les territoires de la Roumanie, de la Pologne, de la Lituanie, de la Lettonie, de l'Estonie et de la Finlande en sphères d'influence allemande et soviétique..."
 GER_mol_rib_pact_tt:0 "Entrez dans un pacte de non-agression §Y§! avec §YUnion soviétique§! et acceptez de §Ydiviser la Pologne§! entre l'Union soviétique et l'Allemagne\n"
 GER_soviet_ally:0 "Alliance avec l'URSS"
 GER_soviet_ally_desc:0 "Peut-être est-il possible de mettre de côté nos différences idéologiques avec les Soviétiques et de mettre plutôt l'accent sur ce qui nous unit : la haine du libéralisme égoïste et de l'Occident décadent. Avec l'URSS comme alliée, nous aurions accès à toutes les ressources dont nous avons besoin - en plus de leur puissance militaire, bien sûr..."
 GER_turkey_puppet:0 "Dinde de marionnettes"
 GER_turkey_puppet_desc:0 "La Turquie est prise dans un étau entre nous et l'Union Soviétique. S'ils subissent des pressions, les Turcs se soumettront très probablement à notre volonté et deviendront un État fantoche. Dans le cadre de cet accord, l'URSS obtiendra des territoires dans l'est de la Turquie. Cependant, s'ils rejettent nos demandes, cela signifierait la guerre."
 GER_rhineland:0 "Rhénanie"
 GER_rhineland_desc:0 "La Rhénanie est démilitarisée depuis la fin de la Grande Guerre, mais cette insulte ne durera plus ! L'Allemagne est une nation souveraine et est libre de déplacer des troupes n'importe où à l'intérieur de ses frontières !"
 GER_rhineland_ultimatum:0 "§RLa remilitarisation peut être inversée si vous y êtes confronté et si vous reculez.§!\n"
 GER_japan_friend:0 "Devenez ami avec le Japon"
 GER_japan_friend_desc:0 "Nous entretenons depuis longtemps une relation fructueuse avec la Chine, mais nos ambitions seraient peut-être mieux servies en nous alignant sur notre culture guerrière apparentée au Japon, même si cela signifie jeter la Chine aux loups..."
 GER_japan_friend_tt:0 "Rappelle von Falkenhausen.\n"
 GER_china_friend:0 "Se lier d'amitié avec la Chine"
 GER_china_friend_desc:0 "Renforçons notre amitié de longue date avec la Chine. Cela aliénerait le Japon, mais qu'est-ce que le Japon sinon simplement l'Italie de l'Est ?"
 GER_anti_comitern_pact:0 "Pacte anti-Komintern"
 GER_anti_comitern_pact_desc:0 "L'ingérence de l'Internationale Communiste dans les affaires intérieures des nations met non seulement en danger leur paix intérieure et leur bien-être social, mais constitue également une menace pour la paix du monde ! Nous demanderons à de nombreux pays non communistes de signer le pacte et de veiller à maîtriser la menace rouge."
 GER_anti_soviet_pact:0 "Pacte antisoviétique"
 GER_anti_soviet_pact_desc:0 "Nous pouvons aller plus loin dans le Pacte anti-Komintern et demander à tous ses membres de s'engager dans une coalition contre l'Union soviétique. Si l'un des signataires se retrouve en guerre contre l'URSS, tous les autres membres doivent également déclarer la guerre."
 GER_anti_soviet_pact_tt:0 "§YEnvoie une offre à tous les membres du Pacte anti-Komintern de rejoindre une alliance défensive contre l'Union soviétique.§!"
 GER_anti_soviet_pact_tt_2:0 "§Y L'alliance défensive appellera ses membres à la guerre si l'un d'eux est attaqué par le Komintern§!"
 GER_anti_soviet_pact_tt_3:0 "Gagne Esprit national §YPacte antisoviétique§!.\n"
 GER_ussr_war_goal:0 "Guerre avec l'URSS"
 GER_ussr_war_goal_desc:0 "Nous pouvons concentrer nos efforts de propagande sur la préparation du peuple allemand - et du monde - à une guerre juste contre l'Union soviétique."
 GER_turkey_friend:0 "Se lier d'amitié avec la Turquie"
 GER_turkey_friend_desc:0 "La Turquie d'Atatürk est sur une voie admirable vers la modernisation, et le pays contrôle l'accès à la mer Noire par le Bosphore et les Dardanelles. Faire entrer la Turquie dans notre sphère d'influence devrait être notre première priorité !"
 anschluss_mefo_bills_double_reduction:0 "Modifier §YProjets de loi MEFO§! par §G+0,10§! Gain de pouvoir politique quotidien\n"
 GER_demand_memel:0 "Réaffirmer les revendications orientales"
 GER_demand_memel_desc:0 "La Grande Guerre a vu la perte d'une grande partie du territoire allemand à l'Est avec la résurrection de la Pologne et le transfert de Memel à la Lituanie. Un ultimatum sera envoyé aux deux nations, mais la Pologne, au moins, ne se pliera probablement pas à de simples paroles."
 GER_demand_memel_threat:0 "L'Allemagne réaffirme ses revendications à l'Est"
 GER_danzig_or_war:0 "Dantzig ou la guerre"
 GER_danzig_or_war_POL_faction_GER_leader:0 "§R[This.GetName] doit approuver l'accord pour que les primes prennent effet. Ils partiront [Root.GetFactionName] si la guerre est déclarée.§!\n"
 GER_danzig_or_war_POL_faction_GER_noleader:0 "§R[This.GetName] doit approuver l'accord pour que les primes prennent effet. Vous quitterez [Root.GetFactionName] la faction si la guerre est déclarée.§!\n"
 GER_danzig_or_war_desc:0 "Dantzig était allemand, Dantzig est resté allemand et Dantzig sera désormais allemand ! Si la Pologne ne cède pas ce territoire, nous devons préparer le peuple allemand à la guerre inévitable. Dantzig et ses environs reviendront à l'Allemagne !"
 GER_czech_friend:0 "Se lier d'amitié avec la Tchécoslovaquie"
 GER_czech_friend_desc:0 "Les Tchèques et les Slovaques sont des peuples travailleurs et admirables. Il est regrettable que nos ambitions territoriales entrent en conflit avec les leurs, mais il n'est pas trop tard pour rechercher l'amitié plutôt que l'assujettissement."
 GER_demand_sudetenland:0 "Exigez les Sudètes"
 GER_demand_sudetenland_desc:0 "Le sort des Allemands des Sudètes fut l'une des pires injustices infligées par le Traité de Versailles. Ils doivent être placés sous notre protection, quelles que soient les objections tchèques."
 GER_demand_sudetenland_threat:0 "L'Allemagne a exigé les Sudètes"
 GER_first_vienna_award:0 "Premier prix de Vienne"
 GER_first_vienna_award_desc:0 "Les Hongrois ont été l'un des peuples qui ont le plus souffert après la Grande Guerre. Lors du massacre de l'Empire austro-hongrois, de nombreux Hongrois se sont retrouvés bloqués sur un sol étranger alors que leurs ancêtres y vivaient depuis des lustres. Nous pourrions grandement améliorer nos relations avec la Hongrie en lui attribuant des territoires de la Tchécoslovaquie."
 GER_end_of_czechoslovakia:0 "Le sort de la Tchécoslovaquie"
 GER_end_of_czechoslovakia_desc:0 "Le moment est venu de diviser les anciennes terres tchèques entre ceux qui peuvent les gouverner correctement. Nous devrions également envisager la création d'un État fantoche slovaque distinct à l'est."
 GER_second_vienna_award:0 "Deuxième prix de Vienne"
 GER_second_vienna_award_desc:0 "La Transylvanie a une majorité hongroise et devrait à juste titre appartenir à nos amis hongrois. Il est toutefois difficile de dire comment le régime et le peuple roumains réagiront à cette demande."
 GER_italy_ally:0 "Alliance avec l'Italie"
 GER_italy_ally_desc:0 "Les Italiens ne sont peut-être pas dignes de confiance - comme ils l'ont prouvé lors de la Grande Guerre - mais Mussolini et son mouvement fasciste ont montré qu'il y avait encore de l'espoir pour l'Italie. L'Allemagne n'a sûrement qu'à gagner à s'allier à l'Italie, n'est-ce pas ?"
 GER_nationalist_spain_ally:0 "Alliance avec l'Espagne"
 GER_nationalist_spain_ally_desc:0 "La victoire nationaliste dans la guerre civile espagnole a ouvert la voie à des relations plus étroites entre nos deux pays. Franco détient la clé de la Méditerranée."
 GER_nationalist_spain_ally_tt:0 "Renforce les relations diplomatiques avec l'Espagne nationaliste §Y§!"
 GER_danzig_vs_slovakia:0 "Dantzig pour la Slovaquie"
 GER_danzig_vs_slovakia_desc:0 "Les Polonais font obstacle à nos projets concernant l'espace vital. Pourtant, il n'est pas trop tard pour modifier nos priorités à long terme et rechercher plutôt leur amitié. La seule façon possible d'y parvenir est par le biais d'un échange de territoire ; Dantzig pour la Slovaquie. La Pologne a déjà manifesté un certain intérêt pour la région en occupant Zaolzie."
 GER_poland_friend:0 "Se lier d'amitié avec la Pologne"
 GER_poland_friend_desc:0 "Même si la Pologne n'a plus accès à la mer, nous avons prouvé nos bonnes intentions en lui donnant la Slovaquie. Peut-être pouvons-nous les rapprocher encore plus de nous en leur faisant de vagues promesses de futurs gains territoriaux à l'est."
 GER_war_with_france:0 "Guerre avec la France"
 GER_war_with_france_desc:0 "Maintenant que l'Allemagne a trouvé une solution satisfaisante à la question de sa frontière orientale, il est temps pour l'instant de tourner notre attention vers l'ouest. La perte de l'Alsace-Lorraine est une tache sur l'honneur du peuple allemand et ce n'est que par une guerre juste et vertueuse que nous pourrons la venger."
 GER_war_with_france_threat:0 "Revendications sur le territoire français"
 GER_operation_tannenbaum:0 "Opération Tannenbaum"
 GER_operation_tannenbaum_desc:0 "La Suisse possède le peuple et le système politique les plus dégoûtants et les plus misérables. Nous avons enfin le temps de nous occuper de ces ennemis mortels de la nouvelle Allemagne."
 GER_reintegrate_luxemburg_and_alsace_lorraine:0 "Réintégrer le Luxembourg et l'Alsace-Lorraine"
 GER_reintegrate_luxemburg_and_alsace_lorraine_desc:0 "Grâce à notre reconquête réussie des régions historiquement allemandes, nous pouvons désormais entamer le processus de leur réintégration dans le [Root.GetName]. Leurs populations doivent pouvoir accomplir leur devoir patriotique envers la patrie."
 GER_naval_rearmament:0 "Réarmement naval"
 GER_naval_rearmament_desc:0 "L'accord naval anglo-allemand que nous avons conclu en 1935 nous permet de développer considérablement notre marine. Nous ne devons ménager aucun effort pour y parvenir."
 GER_plan_z:0 "Plan Z"
 GER_plan_z_desc:0 "L'amiral Raeder estime que la meilleure façon de vaincre les Britanniques est de mener une politique de raids en surface. Construire suffisamment de cuirassés et de porte-avions pour accomplir cela sera une tâche énorme et prendra du temps ; peut-être trop de temps... En revanche, notre marine de surface actuelle est pathétiquement insuffisante."
 GER_u_boat_effort:0 "Effort sous-marin"
 GER_u_boat_effort_desc:0 "Le commodore Dönitz préconise une stratégie de guerre sous-marine sans restriction comme le meilleur moyen de mettre la Grande-Bretagne à genoux. Avec suffisamment de sous-marins, nous pourrions peut-être priver les industries britanniques de toutes les ressources nécessaires à leur empire lointain."
 GER_modular_construction:0 "Construction modulaire"
 GER_modular_construction_desc:0 "En faisant construire des pièces de nos sous-marins dans diverses installations de construction, la vitesse d'assemblage et de construction est grandement améliorée."
 GER_denmark_friend:0 "Se lier d'amitié avec le Danemark"
 GER_denmark_friend_desc:0 "La diplomatie de la canonnière n'est pas encore morte. Nos projets d'expansion navale sont bien connus de notre petit voisin du Nord. En combinaison avec leur peur de nos armées largement supérieures, il devrait être assez facile de les intimider dans notre sphère d'influence."
 GER_norway_friend:0 "Se lier d'amitié avec la Norvège"
 GER_norway_friend_desc:0 "La Norvège contrôle une grande partie des exportations de fer précieux provenant des vastes mines du nord de la Suède. Nous devrions les intimider pour les amener à devenir « amis » avec la menace de notre marine en expansion."
 GER_dutch_friend:0 "Liez-vous d'amitié avec les Pays-Bas"
 GER_dutch_friend_desc:0 "Les Néerlandais savent très bien combien de temps ils tiendront en cas de nouvelle Grande Guerre. S'ils peuvent être convaincus que l'Allemagne peut sérieusement menacer la Grande-Bretagne elle-même, il est possible qu'ils choisissent une alliance avec nous pour éviter une dure occupation."
 GER_sweden_friend:0 "Se lier d'amitié avec la Suède"
 GER_sweden_friend_desc:0 "Les pays scandinaves sont comme des dominos ; ils se tiennent debout et tombent ensemble. Avec la Norvège et le Danemark dans notre sphère, la Suède suivra sûrement."
 GER_improve_national_spirit:0 "Améliorer l'esprit national"
 GER_improve_national_spirit_desc:0 "Avec les capitales des vainqueurs de la Grande Guerre entre nos mains, nous pouvons enfin chasser l'ombre de notre défaite. Une nouvelle ère s'ouvre pour l'Allemagne !"
 GER_improve_national_spirit_tooltip:0 "Nous, ou les membres de notre faction, devons contrôler Londres et Paris ainsi que les États dans lesquels ils résident."
 needs_approval:0 "§R[This.GetName] doit approuver l'accord pour que les primes prennent effet.§!\n"
 GER_demand_slovenia:0 "Exiger la Slovénie"
 GER_demand_slovenia_threat:0 "L'Allemagne a exigé la Slovénie"
 GER_demand_slovenia_desc:0 "Le Traité de Saint-Germain-en-Laye a vu de nombreux territoires autrichiens historiques cédés aux États successeurs. L'Autriche étant à nouveau unie à la nation allemande, il est temps de mettre fin à ces injustices. Les provinces historiques de Carniole et de Styrie, aujourd'hui connues sous le nom de Slovénie, doivent être rapatriées."
 GER_first_ljubljana_award:0 "Premier prix de Ljubljana"
 GER_first_ljubljana_award_desc:0 "Les puissances occidentales hypocrites ont prêché l'autodétermination nationale tout en livrant de nombreuses minorités aux Serbes. Nous sommes en mesure de réparer ce tort historique tout en nous faisant des amis. Pour ceux qui souhaitent se ranger à nos côtés dans l'ordre européen, nous pouvons être très généreux."
 GER_fate_of_yugoslavia:0 "Le sort de la Yougoslavie"
 GER_fate_of_yugoslavia_desc:0 "L'État yougoslave a toujours été une construction artificielle et l'autorité centrale a commencé à s'effondrer. Nous devons intervenir pour rétablir l'ordre. La seule question à laquelle nous sommes confrontés est de savoir quelle serait la meilleure manière d'y parvenir."
 GER_second_ljubljana_award:0 "Deuxième prix de Ljubljana"
 GER_second_ljubljana_award_tt:0 "L'événement donne la possibilité d'exiger un terrain pour [Root.GetName] ou un allié digne de ce nom."
 GER_second_ljubljana_award_desc:0 "La question yougoslave étant résolue, il est temps de tourner notre attention vers la Grèce. Eux aussi ont été injustement agrandis par les Alliés. Il est temps de voir qui sont vraiment nos amis."
 GER_war_with_greece:0 "Guerre avec la Grèce"
 GER_war_with_greece_desc:0 "Alors que la Grèce est déjà en guerre, il serait dommage que l'Allemagne se prive d'une base en Méditerranée orientale."
 GER_fate_of_greece:0 "Destin de la Grèce"
 GER_fate_of_greece_desc:0 "La Grèce a prouvé qu'elle ne pouvait pas faire face aux nouvelles forces qui se déchaînent sur l'Europe. Il est temps de leur offrir la protection que seule l'Allemagne peut leur offrir."
 GER_weserubung:0 "Opération Weserübung"
 GER_weserubung_desc:0 "La Norvège est un point stratégique critique et constituerait un point d'attaque évident pour tout ennemi souhaitant perturber notre commerce de l'acier avec la Suède. Nous ne pouvons pas risquer que nos ennemis établissent des bases dans cette région. Pour obtenir une bonne zone de rassemblement pour l'invasion de la Norvège, nous devons d'abord nous diriger vers le Danemark."
 GER_around_maginot:0 "Autour de Maginot"
 GER_around_maginot_desc:0 "Si nous voulons assurer un avantage tactique contre la France, nous devons être capables de les frapper de tous les côtés. Ils ne s'attendront pas à une attaque du Nord, et c'est précisément de là que nous les frapperons, une fois que nous aurons éliminé quelques obstacles."
 italian_focus:0 "Focus national italien"
 GER_danzig_or_war_POL_civil_war:0 "Prenez Dantzig en échange de soutien"
 GER_danzig_trigger_polish_civil_war:0 "La Pologne est en guerre civile et l'une des affirmations suivantes doit être vraie\n      L'Allemagne a envoyé des volontaires pour soutenir un camp\n      Un côté est en faction avec l'Allemagne"
 GER_alone_or_peace_faction_tt:0 "n'est pas dans une faction, ou est dans une faction en paix avec [GER.GetNameDef]."
 GER_four_year_plan:0 "Plan quadriennal"
 GER_four_year_plan_desc:0 "Nous avons besoin d'un plan ambitieux pour assurer le réarmement et, à terme, l'autosuffisance de la nation. Cet objectif devrait être atteint dans les quatre prochaines années."
 GER_atlantikwall:0 "Mur de l'Atlantique"
 GER_atlantikwall_desc:0 "Maintenant que nous avons conquis l'Europe occidentale, nous devons nous retrancher contre une éventuelle attaque venant de l'autre côté de l'océan Atlantique. Un vaste réseau de fortifications le long des côtes européennes devrait nous assurer une protection suffisante."
 atlantikwall_tooltip:1 "Placez §YForts côtiers§! dans chacun des États côtiers de l'Atlantique suivants que vous contrôlez entièrement :\n"
 atlantikwall_tooltip_2:0 "§YAquitaine§!\n§YPoitou§!\n§YLoire§!\n§YBretagne§!\n§YNormandie§!\n§YPas de Calais§!\n§YFlandre§!\n§YHollande§!\n§YFrise§!\n§YWeser-Ems§!\n§YHanovre§!\n§YSchleswig-Holstein§!\n§YJutland§!\n§YOstlandet§!\n§YVestlandet§!\n§YTrondelag§!\n§YNord-Norge§!\n"
 GER_ostwall:0 "Mur oriental"
 GER_ostwall_desc:0 "Malgré nos gains à l'Est, nous devons veiller à pouvoir freiner l'avancée de l'ennemi si le vent tourne. Nous devrions construire une ligne de fortifications, la Panther-Wotan stellung, le long du fleuve Dniepr, de la mer Noire à la Baltique."
 GER_ostwall_forts:1 "Placez §YForts terrestres§! le long du fleuve Dniepr jusqu'à la Baltique, dans chacun des États suivants qui sont entièrement contrôlés par votre faction :\n"
 GER_ostwall_forts_2:0 "§YTartu§!\n§YPskov§!\n§YNével§!\n§YVitebsk§!\n§YMinsk§!\n§YBobrouïsk§!\n§YMozyr§!\n§YKiev§!\n§YTcherkassy§!\n§YDnipropetrovsk§!\n§YZaporojie§!\n"
 GER_ostwall_tt:0 "Sous le contrôle d'un membre de notre faction.\n"
 GER_autarky:0 "Autarcie"
 GER_autarky_desc:0 "Pour que l'Allemagne soit vraiment grande, elle doit être autosuffisante. Nous devons mieux utiliser nos ressources et devenir plus efficaces dans notre construction."
#  GER_hermann_goring_werke:0 "[Root.GetHermannGoringWerkeName]"
#  GER_hermann_goring_werke_desc:0 "We must rid ourselves of the fickle influence of private capitalists. Therefore, we will form an industrial conglomerate under our control to oversee growth in the mining and steel sectors, as this will form the backbone of our military industry."
#  GER_HERMANN_GORING_WERKE_NAME_FASCIST:0 "Hermann Göring-Werke"
#  GER_HERMANN_GORING_WERKE_NAME_KAISER:0 "Kaiser-Werke"
#  GER_HERMANN_GORING_WERKE_NAME_COMMIE:0 "VEB Vereinigte Maschinenwerke"
#  GER_HERMANN_GORING_WERKE_NAME:0 "State-Controlled Industry"
#  GER_kdf_wagen:0 "[Root.GetKdfWagenName]"
#  GER_kdf_wagen_desc:0 "We will allow our citizens to purchase their own future 'people's car' through a savings scheme, which, in turn, we will use to finance the construction of the factories that will eventually contribute in building these cars."
#  GER_KDF_WAGEN_NAME:0 "KdF-Wagen"
 GER_KAISER_WAGEN_NAME:0 "Wilhelm-Wagen"
 GER_VOLKS_WAGEN_NAME:0 "Volkswagen"
 GER_coal_liquidization:0 "Liquidation du charbon"
 GER_coal_liquidization_desc:0 "L'Allemagne manque de pétrole et nous devons donc redoubler d'efforts dans le domaine du pétrole synthétique."
 GER_synthetic_rubber:0 "Caoutchouc synthétique"
 GER_synthetic_rubber_desc:0 "La motorisation et l'aviation à grande échelle nécessitent de grandes quantités de caoutchouc, dont nous ne possédons aucune source. Nous devons améliorer la façon dont nous le créons synthétiquement."
 GER_german_war_economy:0 "Économie de guerre allemande"
 GER_german_war_economy_desc:0 "Le peuple de notre grande nation doit être mobilisé pour le bien de l'effort de guerre. Nous passerons à une économie de guerre totale, où chacun est censé jouer son rôle."
 GER_grosraumwirtschaft:0 "Grossraumwirtschaft"
 GER_grosraumwirtschaft_desc:0 "Nous devons préparer l'Allemagne à son destin de pièce maîtresse de l'Europe. Notre infrastructure reliera l'Ouest à l'Est et le Sud au Nord."
 GER_align_hungary:0 "Aligner la Hongrie"
 GER_align_hungary_desc:0 "La Hongrie est déjà dans notre sphère d'influence, mais nous pourrions facilement l'influencer davantage selon notre façon de penser, la rendant encore plus facilement manipulable à l'avenir."
 GER_align_romania:0 "Aligner la Roumanie"
 GER_align_romania_desc:0 "La Roumanie est déjà dans notre sphère d'influence, mais nous pourrions facilement l'influencer davantage dans notre façon de penser, la rendant encore plus facilement manipulable à l'avenir."
 GER_integrate_war_economies:0 "Intégrer les économies de guerre"
 GER_integrate_war_economies_desc:0 "Les nations situées dans notre sphère d'influence sont devenues extrêmement dépendantes de nous sur le plan économique. Nous pourrions utiliser cela pour accroître notre contrôle sur leurs économies et notre influence sur leur politique étrangère."
 GER_integrate_war_economies_tt:2 "Si §Y[HUN.GetName]§! est dans une faction avec §Y[Root.GetName]§!, ajoutez §Y4 usines militaires§! chacune à §Y[Root.GetName]§! et §Y[HUN.GetName]§!, et §Y[HUN.GetName]§! devient une marionnette de §Y[Root.GetName]§!.\n"
 GER_integrate_war_economies_tt2:2 "Si §Y[ROM.GetName]§! est dans une faction avec §Y[Root.GetName]§!, ajoutez §Y4 usines militaires§! chacune à §Y[Root.GetName]§! et §Y[ROM.GetName]§!, et §Y[ROM.GetName]§! devient une marionnette de §Y[Root.GetName]§!.\n"
 GER_integrate_war_economies_tt3:0 "§R[HUN.GetName] doit approuver l'accord pour que les primes prennent effet.§!\n"
 GER_integrate_war_economies_tt4:0 "§R[ROM.GetName] doit approuver l'accord pour que les primes prennent effet.§!\n"
 GER_form_the_reichskommissariats:0 "Former les Reichskommissariats"
 GER_form_the_reichskommissariats_desc:0 "Pour améliorer l'utilisation des ressources locales, de l'industrie et de la main d'oeuvre, nous devrions envisager d'établir des gouvernements sujets quasi-autonomes dans nos zones conquises."
 GER_reichskommissariats_tt:0 "Permet la formation d'États sujets dans les territoires conquis.\n"
 GER_oppose_hitler:0 "S'opposer à Hitler"
 GER_oppose_hitler_desc:0 "Le règne d'Hitler doit prendre fin. Il entend provoquer les puissances occidentales en remilitarisant la Rhénanie, mais cela nous donnera l'excuse dont nous avons besoin pour prendre le pouvoir avec l'aide d'éléments fidèles de la Wehrmacht."
 GER_oppose_hitler_civil_war:0 "§RLes partisans fascistes déclencheront une guerre civile.§!\n"
 GER_secure_the_new_state:0 "Sécuriser le nouvel État"
 GER_secure_the_new_state_desc:0 "Face à la guerre civile qui l'a provoqué, le gouvernement provisoire manque de force. Nous devons veiller à ce qu'il soit sécurisé et qu'il ne puisse pas être facilement renversé."
 GER_clamp_down_on_fascism:0 "Réprimer le fascisme"
 GER_clamp_down_on_fascism_desc:0 "Au cours des dernières années, sous le régime nazi, la nature oppressive, dictatoriale et anti-royaliste du gouvernement et de ses idéologues et partisans fascistes n'est devenue que trop évidente. Nous devons veiller à ce que leur façon de penser soit éradiquée partout où elle se présente."
 GER_revive_the_kaiserreich:0 "Faire revivre le Kaiserreich"
 GER_revive_the_kaiserreich_desc:0 "Les événements de la dernière décennie ont montré que la démocratie est trop faible pour tenir à distance les éléments internes néfastes. Nous devons revenir à la direction forte d'un Kaiser et, en préparation de son retour, nous ramènerons la constitution à celle du Deutsches Kaiserreich."
 GER_revive_the_kaiserreich_tt:0 "§YLa junte militaire allemande§! sera connue sous le nom de §Yl'Empire allemand§!.\n"
 GER_mackensen_dead:0 "Von Mackensen est mort."
 GER_rebuild_the_nation:0 "Reconstruire la nation"
 GER_rebuild_the_nation_desc:1 "Après les ravages de la guerre civile, nous devons nous efforcer de reconstruire notre nation. Nous demanderons aux gens de mettre de côté leur confort personnel pendant un certain temps, afin que nous puissions concentrer toutes nos ressources sur la réalisation de cet objectif."
 GER_fan_the_prussian_militarism:0 "Fan du militarisme prussien"
 GER_fan_the_prussian_militarism_desc:0 "Pour compenser les pertes de notre guerre civile, nous devons faire appel au sens du militarisme prussien pour améliorer le recrutement et la formation des nouvelles recrues. Le fait que notre armée nous ait libérés de la dictature nazie garantit que ces idéaux prussiens sont désormais plus populaires que jamais."
 GER_a_new_and_better_germany:0 "Une Allemagne nouvelle et meilleure"
 GER_a_new_and_better_germany_desc:0 "Pendant que nous reconstruisons notre nation, nous devons nous efforcer d'aller au-delà de ce qui est nécessaire, afin que ce que nous construisons aujourd'hui résiste à l'épreuve du temps."
 GER_bulwark_against_bolshevism:0 "Rempart contre le bolchevisme"
 GER_bulwark_against_bolshevism_desc:0 "Notre nation constitue un bouclier contre le bolchevisme, protégeant l'Occident de l'influence du communisme. Nous devons porter ce rôle avec fierté et nous préparer à utiliser les armes si nécessaire."
 GER_bulwark_against_bolshevism_tt:0 "§RCet esprit national sera perdu s'il fait partie d'une faction ou mène une guerre aux côtés de l'Union Soviétique.§!\n"
 GER_return_of_the_kaiser:0 "Le retour du Kaiser"
 GER_return_of_the_kaiser_desc:0 "Le Kaiserreich a besoin d'un Kaiser, et Guillaume II vit toujours, exilé aux Pays-Bas. Nous lèverons son exil et l'inviterons à revenir prendre le trône, malgré ce que pourraient penser les démocraties occidentales."
 GER_focus_on_the_true_enemy:0 "Concentrez-vous sur le véritable ennemi"
 GER_focus_on_the_true_enemy_desc:0 "Ce n'est pas à l'intérieur, mais à l'extérieur que se trouvent nos ennemis. Le crime persistant du monopole colonial occidental n'est éclipsé que par l'injustice du Traité de Versailles à laquelle nous avons été soumis après avoir cherché à prendre notre place au soleil. Cela se termine maintenant."
 GER_rebuild_the_high_seas_fleet:0 "Reconstruire la flotte de haute mer"
 GER_rebuild_the_high_seas_fleet_desc:0 "Nous avons besoin d'un programme de renforcement naval massif pour reconstruire notre flotte de haute mer autrefois glorieuse, si nous voulons un jour défier l'Occident avec succès."
 GER_our_place_in_the_sun:0 "Notre place au soleil"
 GER_our_place_in_the_sun_desc:0 "Que chacun sache que l'Empire allemand affirme une fois de plus son droit à prendre sa place au soleil ! Notre peuple ne sera plus humilié dans l'ombre."
 GER_pride_of_the_modern_germany:0 "Fierté de l'Allemagne moderne"
 GER_pride_of_the_modern_germany_desc:0 "Il faudra de nombreuses années pour atteindre la taille de la Royal British Navy. Nous devons donc le surpasser en qualité. Nos navires seront les plus modernes et les plus puissants ayant jamais sillonné les mers !"
 GER_prepare_for_the_next_blockade:0 "Préparez-vous au prochain blocus"
 GER_prepare_for_the_next_blockade_desc:0 "C'est le blocus infernal britannique qui nous a coûté la dernière guerre. Nous ne ferons plus la même erreur. Cette fois, nous allons redoubler d'efforts pour préparer la population à ce qui va arriver."
 GER_break_the_anglo_french_colonial_hegemony:0 "Briser l'hégémonie coloniale anglo-française"
 GER_break_the_anglo_french_colonial_hegemony_desc:0 "Le moment est venu de briser le monopole que l'Occident détient depuis trop longtemps sur le colonialisme."
 flag_franco_british_union:0 "Union franco-britannique"
 GER_schlieffen_once_more:0 "Schlieffen encore une fois"
 GER_schlieffen_once_more_desc:0 "Il faut contourner le Maginot. Nous traverserons à nouveau la Belgique et le Luxembourg, dans une course rapide vers la victoire."
 GER_reinstate_imperial_possessions:0 "Rétablir les possessions impériales"
 GER_reinstate_imperial_possessions_desc:0 "Grâce à notre reconquête réussie des régions historiquement allemandes, nous pouvons désormais entamer le processus de réintégration de celles-ci dans le [Root.GetName] en tant que provinces à part entière. La dernière honte de Versailles est enfin défaite !"
 GER_crossing_the_atlantic:0 "Traversée de l'Atlantique"
 GER_crossing_the_atlantic_desc:0 "Une fois vaincues toutes les oppositions continentales à notre domination, nous devons veiller à recentrer nos efforts de production sur la création d'une immense marine, afin de pouvoir porter le combat contre les Britanniques et les Américains. Nous ne nous reposerons pas « jusqu'à ce que, au moment voulu par Dieu, le Vieux Monde, avec toute sa puissance et sa puissance, ne s'avance vers l'assujettissement et l'humiliation du nouveau »"
 GER_crossing_the_atlantic_2_factories_tt:0 "Supprimez §Y2 Usines Militaires§! d'un État intérieur pour chaque État côtier qui reçoit ces chantiers navals.\n"
 GER_crossing_the_atlantic_1_factory_tt:0 "Supprimez §Y1 usine militaire§! d'un État intérieur pour chaque État côtier qui reçoit ces chantiers navals.\n"
 GER_the_central_powers:0 "Les puissances centrales"
 GER_the_central_powers_desc:0 "Nous avons besoin d'alliés si nous voulons nous dresser contre l'Occident. Nous créerons notre propre faction pour lutter contre l'oppression des démocraties."
 GER_prepare_italian_coup:0 "Préparez le coup d'État italien"
 GER_prepare_italian_coup_desc:0 "La chute de l'Italie dans le fascisme doit être annulée. Nous approcherons les royalistes italiens avec une proposition de coup d'État avec notre soutien."
 GER_prepare_italian_coup_tt:0 "S'ils acceptent notre offre :\n"
 GER_assassinate_mussolini:0 "Assassiner Mussolini"
 GER_assassinate_mussolini_desc:0 "Le moment est venu de mettre fin au pilier du fascisme italien. Les Allemands assassineront le leader, après quoi les royalistes italiens prendront le pouvoir d'un seul coup."
 GER_rekindle_imperial_sentiment:0 "Raviver le sentiment impérial"
 GER_rekindle_imperial_sentiment_desc:0 "Même si l'Empire austro-hongrois s'est brisé après la Grande Guerre, on trouve encore ceux qui pleurent la disparition de l'Empire. Nous cultiverons ces sentiments impériaux dans l'espoir que les États successeurs décideront de nous rejoindre pour leur propre force."
 GER_rekindle_imperial_sentiment_tt:0 "Lorsque le soutien des pays non alignés est suffisamment élevé, cela permet à ces nations de réformer l'Empire austro-hongrois et de rejoindre les puissances centrales.\n"
 GER_expatriate_the_communists:0 "Expatrier les communistes"
 GER_expatriate_the_communists_desc:0 "La menace interne du communisme continue de peser sur notre nation. Nous devons nous en débarrasser, peu importe où fuient les adhérents."
 GER_accept_british_naval_dominance:0 "Acceptez la domination navale britannique"
 GER_accept_british_naval_dominance_desc:0 "Nous avons besoin d'alliés pour combattre le communisme, et les Britanniques sont un candidat privilégié. Nous apaiserons leurs inquiétudes en acceptant leur supériorité navale et en désavouant tout renforcement naval important, dans l'intérêt d'une amélioration des relations."
 GER_ally_the_shade:0 "Une alliance avec l'Ombre"
 GER_ally_the_shade_desc:0 "Si nous ne pouvons pas prendre leur place au soleil, alors nous allierons ceux qui nous font de l'ombre."
 GER_carte_blanche_for_alsace_and_french_colonies:0 "Carte Blanche pour l'Alsace et les Colonies Françaises"
 GER_carte_blanche_for_alsace_and_french_colonies_desc:0 "Nous devons demander à notre nouvel allié de nous laisser libre cours à la récupération de nos territoires légitimes d'Alsace-Lorraine et de notre juste part des colonies africaines."
 GER_bypass_maginot_in_the_south:0 "Contourner Maginot par le Sud"
 GER_bypass_maginot_in_the_south_desc:0 "Les Britanniques ont leurs intérêts dans les Pays-Bas et nous devons donc rechercher des routes alternatives autour de la Maginot. Le sud, quoique montagneux et difficile à parcourir, doit suffire. L'ingéniosité allemande nous aidera à nous en sortir."
 GER_see_to_the_eastern_front:0 "Voir le front de l'Est"
 GER_see_to_the_eastern_front_desc:0 "Si nous avons appris quelque chose de la Grande Guerre, c'est que nous devons nous préparer à une attaque contre nos possessions éloignées de l'Est. Ces possessions doivent être restaurées et fortifiées contre l'invasion."
 GER_see_to_the_eastern_front_tt:1 "Ajoutez 6 §YForts terrestres§! dans 3 provinces à la frontière orientale.\n"
 GER_see_to_the_eastern_front_tt2:1 "Ajoutez 8 §YForts terrestres§! dans 4 provinces à la frontière orientale.\n"
 GER_danzig_for_guarantees:0 "Dantzig pour les Garanties"
 GER_danzig_for_guarantees_desc:1 "Les Polonais doivent certainement ressentir le danger des bolcheviks. Peut-être pourrions-nous parvenir à un accord sur la restitution de Dantzig, de Poznan et de la voïvodie de Silésie, en échange de garanties de soutien militaire en cas d'invasion des Rouges."
 GER_safeguard_the_baltic:0 "Sauvegarder la Baltique"
 GER_safeguard_the_baltic_desc:0 "Les pays baltes faisaient partie de l'empire russe jusqu'il y a quelques décennies, et il va de soi que les Soviétiques pourraient à nouveau tenter de les annexer. Nous devons empêcher cela et offrir notre soutien militaire en cas d'invasion soviétique."
 GER_support_the_finns:0 "Soutenez les Finlandais"
 GER_support_the_finns_desc:0 "Les Finlandais se retrouvent dans la ligne de mire des Soviétiques. Nous leur offrirons une garantie contre la menace communiste et leur accorderons une modeste aide industrielle."
 GER_anti_comintern_pact_unaligned:0 "Défenses idéologiques"
 GER_anti_comintern_pact_unaligned_desc:0 "La menace militaire n'est pas le seul danger auquel nous sommes exposés. Nous devons chercher des moyens de tenir le communisme lui-même à distance et, à cette fin, nous créerons un pacte avec nos compatriotes non communistes, résolus à combattre son avancée."
 GER_anti_soviet_pact_unaligned:1 "Officialiser le traité"
 GER_anti_soviet_pact_unaligned_desc:1 "Nous devrions nous préparer à un conflit militaire avec le communisme en invitant tous les signataires du pacte anti-Komintern à accepter une clause supplémentaire appelant à un soutien militaire contre toute agression soviétique. Comme nous sommes déjà engagés les uns envers les autres à bien des égards, cela ne devrait être qu'une formalisation."
 GER_tackle_the_communist_threat:0 "Lutter contre la menace communiste"
 GER_tackle_the_communist_threat_desc:0 "Tant que l'Union Soviétique existera, elle constituera une menace pour nous. Plutôt que d'attendre qu'ils frappent, nous prendrons l'initiative de nos propres mains."
 GER_the_iberian_problem:0 "Le problème ibérique"
 GER_the_iberian_problem_desc:0 "Les bastions du communisme demeurent. Nous devons veiller à ce que tous soient éradiqués, à commencer par l'Espagne communiste."
 GER_spain_wargoal_tt:0 "Gagne §YAnnexe§! but de guerre contre §YEspagne républicaine§!.\n"
 GER_reestablish_free_elections:0 "Rétablir des élections libres"
 GER_reestablish_free_elections_desc:0 "Nous ferons un retour aux idéaux démocratiques, en rétablissant des élections libres, qui auront lieu dans un avenir proche."
 GER_the_monarchy_compromise:0 "Le compromis monarchique"
 GER_the_monarchy_compromise_desc:0 "Les militaires qui se sont battus pour nous libérer de la tyrannie nazie ont des tendances clairement royalistes. Pour garantir leur satisfaction quant au chemin emprunté par la nation, nous devons faire un compromis et permettre le retour de la monarchie."
 GER_the_great_red_menace:0 "La grande menace rouge"
 GER_the_great_red_menace_desc:0 "Nos actions lors de la guerre précédente sont encore récentes pour beaucoup. Il faut recentrer les craintes du continent sur le véritable danger : la grande menace communiste qui plane à l'Est. Nous lancerons une campagne de propagande massive pour ouvrir les yeux du continent."
 GER_central_european_alliance:0 "Alliance d'Europe centrale"
 GER_central_european_alliance_desc:0 "Maintenant que nous avons concentré l'attention du continent sur ce problème, nous devons proposer la solution : nous dirigerons une alliance pour toutes les nations mineures d'Europe, qui assurera la protection contre cette menace la plus meurtrière qui pèse sur notre mode de vie."
 GER_central_european_alliance_tt:0 "Si vous n'êtes pas dans une faction :\n"
 GER_danubian_membership:0 "Adhésion danubienne"
 GER_danubian_membership_desc:0 "Les nations danubiennes qui ont succédé à l'Empire austro-hongrois n'ont pas oublié ce que signifie être notre allié. Nous leur offrirons l'adhésion et la protection contre la menace du communisme."
 GER_danubian_expansion:0 "Expansion danubienne"
 GER_danubian_expansion_desc:0 "Nous devons chercher à étendre notre influence aux nations des Balkans sujettes à l'agression soviétique. Nous offrirons aux nations restantes du Danube une adhésion et une protection contre la menace du communisme."
 invite_non_fascist_communist_only_TT:1 "Exige que les États membres potentiels ne soient pas fascistes ou communistes et ne fassent pas déjà partie d'une faction.\n"
 GER_no_balkan_communism:0 "Pas de communisme balkanique"
 GER_no_balkan_communism_desc:0 "Les influences communistes se sont infiltrées dans les Balkans, ce que nous ne pouvons pas permettre. Il faut le détruire avant de prendre racine."
 GER_no_balkan_communism_tt:0 "Gagne §YRenverser le gouvernement§! objectifs de guerre contre les nations communistes dans les Balkans.\n"
 GER_no_balkan_communism_HUN_tt:0 "Gagne §YRenverser le gouvernement§! but de guerre contre §YRépublique populaire hongroise§!.\n"
 GER_no_balkan_communism_ROM_tt:0 "Gagne §YRenverser le gouvernement§! but de guerre contre §YRépublique populaire roumaine§!.\n"
 GER_no_balkan_communism_YUG_tt:0 "Gagne §YRenverser le gouvernement§! but de guerre contre §YSFR Yougoslavie§!.\n"
 GER_no_balkan_communism_BUL_tt:0 "Gagne §YRenverser le gouvernement§! but de guerre contre §YRépublique socialiste de Bulgarie§!.\n"
 GER_low_countries_membership:0 "Adhésion des Pays-Bas"
 GER_low_countries_membership_desc:0 "Bien qu'ils soient très éloignés des frontières orientales de l'Europe, les Pays-Bas savent néanmoins que si l'Europe centrale tombe, ils seront les prochains. Nous leur proposerons d'en devenir membres afin qu'ils puissent se tenir à nos côtés contre la menace du communisme."
 GER_no_reds_in_western_europe:0 "Pas de rouges en Europe occidentale"
 GER_no_reds_in_western_europe_desc:0 "Les influences communistes se sont infiltrées en Europe occidentale, ce que nous ne pouvons pas permettre. Il faut le détruire avant de prendre racine."
 GER_no_reds_in_western_europe_tt:0 "Gagne §YRenverser le gouvernement§! objectifs de guerre contre les nations communistes des Pays-Bas et de la France.\n"
 GER_no_reds_in_western_europe_FRA_tt:0 "Gagne §YRenverser le gouvernement§! objectif de guerre contre §YCommune française§!.\n"
 GER_no_reds_in_western_europe_HOL_tt:0 "Gagne §YRenverser le gouvernement§! objectif de guerre contre §YProvinces Unies populaires§!.\n"
 GER_no_reds_in_western_europe_BEL_tt:0 "Gagne §YRenverser le Gouvernement§! but de guerre contre §YCoopérative de Belgique§!.\n"
 GER_no_reds_in_western_europe_LUX_tt:0 "Gagne §YTopple Government§! but de guerre contre §YRosa Luxembourg§!.\n"
 GER_scandinavian_membership:0 "Adhésion scandinave"
 GER_scandinavian_membership_desc:0 "Les montagnes et le froid ne protègent pas contre la menace rouge, et les Scandinaves doivent le savoir. Nous leur offrirons l'adhésion et la protection contre la menace du communisme."
 GER_baltic_membership:0 "Adhésion balte"
 GER_baltic_membership_desc:0 "Depuis deux décennies, les pays baltes vivent sous le double danger mortel de la réannexion et du communisme. Nous leur offrirons l'adhésion et la protection contre la menace du communisme."
 GER_polish_membership:0 "Adhésion polonaise"
 GER_polish_membership_desc:0 "Les Polonais ont de nombreuses raisons de se méfier de leurs voisins, mais ils savent que la plus grande menace vient de l'Est. Nous leur offrirons l'adhésion et la protection contre la menace du communisme."
 GER_finnish_membership:0 "Adhésion finlandaise"
 GER_finnish_membership_desc:0 "Loin du centre de l'Europe, les Finlandais risquent d'affronter seuls les Rouges. Mais ce n'est pas nécessaire. Nous leur offrirons l'adhésion et la protection contre la menace du communisme."
 GER_strike_at_the_source:0 "Frapper à la source"
 GER_strike_at_the_source_desc:0 "Une vie vécue dans la peur n'est pas une vie du tout ; nous devons mettre fin une fois pour toutes à cette menace qui pèse sur notre mode de vie. La source de l'influence communiste en Europe doit être détruite."
 GER_reverse_the_brain_drain:0 "Inverser la fuite des cerveaux"
 GER_reverse_the_brain_drain_desc:0 "Maintenant que les oppresseurs et les régimes autoritaires ont été vaincus, nous pouvons tenter de rendre attractif le retour des scientifiques qui ont fui le pays et leur travail dans leur pays d'origine."
 GER_shared_rd_programs:0 "Programmes de R&D partagés"
 GER_shared_rd_programs_desc:0 "Pour le bien de notre cause, nous devons mettre en commun nos connaissances scientifiques et partager nos avancées technologiques avec nos nouveaux alliés."
 GER_the_mannheim_project:0 "Le projet Mannheim"
 GER_the_mannheim_project_desc:0 "Avec les usines d'eau lourde de Norvège désormais sous notre contrôle, nous pouvons redoubler d'efforts pour percer les secrets de l'atome et chercher à l'utiliser comme arme contre les bolcheviks."
 GER_the_mannheim_project_tt:0 "Ce focus donne différentes récompenses en fonction du niveau actuel de recherche atomique :\n\n"
 GER_pool_technical_know_how:0 "Savoir-faire technique de piscine"
 GER_pool_technical_know_how_desc:0 "Chaque nation a ses propres méthodes de gestion de l'industrie et d'entretien des équipements. Nous pouvons apprendre les uns des autres en envoyant des équipes techniques pour diffuser ces connaissances parmi les autres membres de l'alliance."
 GER_pool_technical_know_how_tt:0 "Chaque nation de la faction recevra cet Esprit National."
 ITA_ethiopian_war_logistics:0 "Logistique de guerre éthiopienne"
 ITA_ethiopian_war_logistics_desc:0 "Nous aurions peut-être mal évalué la situation logistique de notre glorieuse conquête de l'Éthiopie. Notre objectif principal doit être de fournir à nos courageuses troupes les fournitures nécessaires."
 ITA_fortification_effort:0 "Effort de fortification"
 ITA_fortification_effort_desc:0 "Nous devons défendre nos rivages et nos frontières contre l'agression des puissances impériales déclinantes et décadentes, la France et la Grande-Bretagne."
 ITA_fortification_effort_forts:0 "Ajoutez §Y15 Forts terrestres§! à la frontière française.\n"
 ITA_army_primacy:0 "Primauté de l'armée"
 ITA_army_primacy_desc:0 "Sur le plan industriel, l'Italie est encore à la traîne des empires coloniaux décadents. Nous devons choisir si nous donnons la priorité à l'armée ou à la marine. Le choix semble évident ; tout comme l'ancien Empire romain dépendait de ses légions, le nouvel Empire italien doit aussi le faire !"
 ITA_modernized_artillery:0 "Artillerie modernisée"
 ITA_modernized_artillery_desc:0 "La Regio Esercito est, en théorie, l'une des plus grandes armées du monde. Malheureusement, nous ne pouvons pas équiper correctement tous ces hommes. Le pire dans tout, c'est que la majeure partie de notre artillerie date de 1918 !"
 ITA_modernized_army:0 "Armée modernisée"
 ITA_modernized_army_desc:0 "Une meilleure artillerie augmentera considérablement notre efficacité au combat, mais nous avons également besoin de nouvelles tactiques et doctrines."
 ITA_armored_effort:0 "Effort blindé"
 ITA_armored_effort_desc:0 "Combattre en Éthiopie, c'est bien beau, mais nos chars ne sont tout simplement pas à la hauteur pour lutter contre les ploutodémocraties décadentes - bien que toujours puissantes - d'Europe."
 ITA_mare_nostrum:0 "Mare Nostrum"
 ITA_mare_nostrum_desc:0 "Nos ressources sont limitées et nous devons faire des choix douloureux, mais l'Empire britannique nous enferme dans la Méditerranée. Pour s'en sortir, il faudra une marine capable de rivaliser avec la leur..."
 ITA_carrier_effort:0 "Effort du transporteur"
 ITA_carrier_effort_desc:0 "Les flottes de combat modernes seront centrées sur des porte-avions et non sur des cuirassés. La suprématie de la puissance aérienne sur les navires a été démontrée par les Américains dès 1921 !"
 ITA_capital_ships:0 "Effort en matière de navires capitaux"
 ITA_capital_ships_desc:0 "La nation possédant le plus de cuirassés dominera les océans. Nous ne devons pas permettre à la Royal Navy de nous surpasser en termes de puissance en Méditerranée..."
 ITA_bomber_effort:0 "Effort de bombardement"
 ITA_bomber_effort_desc:0 "L'époque où les armées pouvaient gagner des guerres sans regarder vers le ciel est révolue. Nous devons développer nos bombardiers tactiques pour fournir à nos soldats le soutien aérien dont ils ont besoin."
 ITA_atlantic_fleet:0 "Flotte de l'Atlantique"
 ITA_atlantic_fleet_desc:0 "Une fois sortis de la cage britannique, nous devrons projeter notre puissance à travers les océans. Cela doit être notre première priorité."
 ITA_marines_and_landing_craft:0 "Marines et péniches de débarquement"
 ITA_marines_and_landing_craft_desc:0 "Les guerres ne se gagnent pas uniquement grâce à la puissance navale ; nous devons aussi être capables de transporter nos armées à travers les vagues et de les débarquer en toute sécurité..."
 ITA_jet_engine_effort:0 "Effort du moteur à réaction"
 ITA_jet_engine_effort_desc:0 "L'Italie devrait être à l'avant-garde du développement des moteurs à réaction grâce au brillant travail de Secondo Campini. Nous devons lui donner toutes les ressources dont il a besoin pour améliorer encore ses projets pour la Regio Aeronautica."
 ITA_light_ship_effort:0 "Effort de navire léger"
 ITA_light_ship_effort_desc:0 "Les convois vers nos territoires d'outre-mer ont besoin de protection. Nous devons développer de nouvelles doctrines ainsi que des destroyers plus modernes."
 ITA_escort_effort:0 "Effort d'escorte"
 ITA_escort_effort_desc:0 "Nous devons redoubler d'efforts pour protéger nos convois vulnérables en Méditerranée."
 ITA_sea_wolves:0 "Loups de mer"
 ITA_sea_wolves_desc:0 "Nos alliés allemands ont développé des sous-marins terriblement efficaces et la doctrine de la « meute de loups » pour les utiliser. Nous devrions apprendre d'eux."
 ITA_slovenia_dalmatia_claims:0 "Réclamations sur la Yougoslavie"
 ITA_slovenia_dalmatia_claims_desc:0 "Il existe encore une population italienne importante en Yougoslavie, remontant au moins aux jours de gloire de Venise. Restituer ces régions à la domination italienne est une étape importante vers la recréation de l'Empire romain !"
 ITA_slovenia_dalmatia_claims_threat:0 "Réclamations italiennes sur la Yougoslavie"
 ITA_yugoslavia_friend:0 "Se lier d'amitié avec la Yougoslavie"
 ITA_yugoslavia_friend_desc:0 "Plutôt que de contrarier la Yougoslavie maintenant, nous pouvons reporter son éventuelle conquête à un moment plus opportun. Au lieu de cela, nous pourrions nous lier d'amitié avec le régime et amener le pays dans notre sphère d'influence."
 ITA_support_nationalist_spain:0 "Soutenez l'Espagne nationaliste"
 ITA_support_nationalist_spain_desc:0 "L'Espagne est au milieu d'une guerre civile qui déterminera si elle sera un futur allié fasciste possible ou si elle restera une république inutile - ou pire encore, si elle tombera dans le communisme ou l'anarchie. Nous devons apporter notre soutien aux vrais Espagnols avant qu'il ne soit trop tard !"
 ITA_demand_balearic_islands:0 "Demande Îles Baléares"
 ITA_demand_balearic_islands_desc:0 "Ayant prouvé notre soutien au nouveau régime de Franco, nous sommes en mesure de demander que l'un des territoires importants pour lesquels nous avons combattu, les Îles Baléares, soit cédé à l'Italie afin de renforcer notre emprise stratégique sur la Méditerranée."
 ITA_bulgaria_friend:0 "Se lier d'amitié avec la Bulgarie"
 ITA_bulgaria_friend_desc:0 "La Bulgarie est dans notre sphère d'influence. Leur alignement sûr avec l'Italie est la clé de nos ambitions dans les Balkans."
 ITA_albania_war_goal:1 "Occupation albanaise"
 ITA_albania_war_goal_desc:1 "L'Albanie constitue une cible facile à occuper pour nos troupes. Il est peu probable que nous rencontrions beaucoup de résistance. Nous devons montrer au monde la puissance de l'Italie et restaurer la gloire de l'Empire romain !"
 ITA_pact_of_steel:0 "Pacte d'Acier"
 ITA_pact_of_steel_desc:0 "Notre relation avec l'Allemagne nazie est troublée par des différences idéologiques et des objectifs contradictoires ; Le Duce se méfie énormément des ambitions allemandes en Autriche et dans les Balkans. Mais les réalités changent..."
 ITA_germ_italy_same_tt:0 "§YItalie§! et §YAllemagne§! sont les mêmes §YIdéologie§!."
 ITA_german_millitary_cooperation:0 "Coopération militaire allemande"
 ITA_german_millitary_cooperation_desc:0 "Grâce à une coopération étroite avec la puissante armée allemande, nous pouvons combiner le meilleur de l'efficacité allemande et de l'innovation italienne. Nous aurons un avantage stratégique sur quiconque osera nous affronter."
 ITA_claims_on_france:0 "Créances sur la France"
 ITA_claims_on_france_desc:0 "Prenez la terre de Vichy France. Avec la conquête allemande de Paris et la formation d'un nouveau gouvernement en France, il est temps pour nous de revendiquer notre part légitime de l'Europe du Sud. L'Allemagne s'est fortement développée dans le nord et il n'est que juste qu'on nous accorde notre propre part."
 ITA_claims_on_france_tt:0 "§YVichy France§! existe et contrôle §YSavoie§! et §YCorse§!"
 ITA_go_after_france:0 "S'en prendre à la France"
 ITA_go_after_france_desc:0 "La France... Encore une autre démocratie réactionnaire de l'Occident qui, à chaque instant, cherche à entraver l'avancée et a souvent mis en danger l'existence même du peuple italien. Nous partons au combat pour le bien de l'Italie et l'avenir de l'Empire."
 ITA_claims_on_turkey:0 "Réclamations sur la Turquie"
 ITA_claims_on_turkey_desc:0 "Le traité de Londres de 1915 promettait à l'Italie des terres turques en Anatolie en échange des gains des puissances occidentales au Levant. Ils ont fait ce qui leur était dû, prétendant qu'il s'agissait simplement de mandats de la Société des Nations, tandis que l'Italie a été refusée. La nouvelle Italie est bien plus forte que l'ancienne et nous forcerons les Turcs à tenir les promesses britanniques."
 ITA_italy_first:0 "L'Italie d'abord"
 ITA_italy_first_desc:0 "Mussolini ne jouera jamais le second rôle devant Hitler ! Nous devons tenir compte des leçons de l'Empire romain ; L'ingérence teutonique dans les affaires italiennes ne se termine jamais bien..."
 ITA_romania_friend:0 "Se lier d'amitié avec la Roumanie"
 ITA_romania_friend_desc:0 "Il serait dans notre intérêt d'amener nos lointains frères roumains dans notre sphère d'influence. Il Duce voit un grand potentiel dans sa \"Garde de Fer\"."
 ITA_german_rd_treaty:0 "Traité avec l'Allemagne"
 ITA_german_rd_treaty_desc:0 "Nous devrions demander aux Allemands d'échanger des secrets technologiques pour le bénéfice de nos deux grandes nations."
 ITA_spanish_italian_faction:0 "Alliance hispano-italienne"
 ITA_spanish_italian_faction_desc:0 "Franco et les nationalistes espagnols sont nos alliés naturels, unis par la religion, la culture et l'idéologie. Ensemble, nous pourrions nous emparer de Gibraltar et rendre la vie très difficile à la Royal Navy..."
 ITA_italian_highways:0 "Autoroutes italiennes"
 ITA_italian_highways_desc:0 "Nous devons étendre nos infrastructures pour assurer une mobilité aisée des troupes dans tout notre empire. Avec des ennemis aux quatre coins du monde, c'est un élément crucial pour pouvoir défendre tout le sol italien."
 ITA_libyan_refineries:0 "Raffineries libyennes"
 ITA_libyan_refineries_desc:0 "Benhasi est un endroit idéal pour construire des raffineries. Proche des sources de pétrole et proche de la production dans le pays."
 ITA_libyan_infrastructure:0 "Infrastructures libyennes"
 ITA_libyan_infrastructure_desc:0 "Nos vastes terres d'Afrique du Nord manquent encore d'infrastructures par rapport au reste de notre empire. Nous devrions concentrer nos efforts sur leur mise à niveau."
 ITA_prospect_for_oil:0 "Perspectives pétrolières"
 ITA_prospect_for_oil_desc:0 "Les anciens empires craignent toujours l'émergence de nouveaux empires et nous ne devrions pas dépendre d'eux. Nous ne pouvons pas compter sur le pétrole d'autres pays et devrions concentrer nos efforts sur la recherche de notre propre source au sein de l'empire. C'est ainsi que nous veillons à rester compétitifs à long terme."
 ITA_greece_war_goal:0 "Guerre avec la Grèce"
 ITA_greece_war_goal_desc:0 "Quel genre d'Empire romain restaurons-nous si nous n'incluons pas la Grèce ? Cela devrait être une cible facile..."
 ITA_greece_friend:0 "Se lier d'amitié avec la Grèce"
 ITA_greece_friend_desc:0 "Les Grecs sont un peuple ancien et le berceau de la civilisation occidentale. Il ne devrait pas être impossible d'aligner leurs objectifs sur les nôtres..."
 ITA_turkey_friend:0 "Se lier d'amitié avec la Turquie"
 ITA_turkey_friend_desc:0 "Les Turcs n'ont aucune raison de nous aimer après la guerre italo-turque et la Grande Guerre. Mais la Realpolitik prend le pas sur les vieux reproches, et la situation actuelle en Méditerranée pourrait rapprocher nos deux étoiles."
 ITA_portugal_friend:0 "Se lier d'amitié avec le Portugal"
 ITA_portugal_friend_desc:0 "Le Portugal est, avec l'Espagne, un allié naturel du peuple italien. Il faut renforcer ces liens d'amitié."
 ITA_anti_uk_war_goals:0 "Guerre avec le Royaume-Uni"
 ITA_anti_uk_war_goals_desc:0 "L'Empire britannique en déclin nous enferme dans la Méditerranée et ne nous en donnera jamais volontairement les clés. Il faut frapper les Anglais le plus tôt possible !"
 ITA_japan_friend:0 "Devenez ami avec le Japon"
 ITA_japan_friend_desc:0 "Les Japonais nous ressemblent beaucoup ; une puissance jeune et affamée avec une démographie positive, rançonnée par le commerce de ploutodémocraties en déclin comme le Royaume-Uni et les Pays-Bas. Nous devrions nous unir à eux pour former un axe naval dynamique à travers les océans !"
 soviet_focus:0 "Objectif national soviétique"
 SOV_finish_five_year_plan:0 "Terminer le plan quinquennal"
 SOV_finish_five_year_plan_desc:0 "Le deuxième plan quinquennal donne la priorité au développement de l'industrie lourde. L'Union soviétique doit se développer rapidement afin de rivaliser avec les puissances capitalistes et fascistes de l'Occident."
 SOV_move_industry_to_urals:0 "Déplacer l'industrie vers l'Oural"
 SOV_move_industry_to_urals_desc:0 "Il ne faut pas permettre aux hitlériens traîtres de s'emparer de nos précieuses usines dans la partie occidentale de l'URSS. Avec des efforts et des sacrifices considérables, nous devrions être en mesure de déplacer rapidement les équipements et installations lourds les plus précieux vers Tcheliabinsk et d'autres endroits de l'Oural."
 SOV_defense_of_moscow:0 "Défense de Moscou"
 SOV_defense_of_moscow_desc:0 "Les fascistes frappent aux portes de la capitale ! Il ne faut pas laisser Moscou tomber à tout prix. Mobilisons tout le monde, des enfants aux personnes âgées, pour ériger en toute hâte toutes les défenses possibles !"
 SOV_defense_of_moscow_forts:0 "Ajoutez §Y28 forts terrestres§! dans et autour de Moscou.\n"
 SOV_infrastructure_effort:0 "Efforts en matière d'infrastructures"
 SOV_infrastructure_effort_desc:0 "L'Union soviétique est vaste mais pratiquement vide. Nous devons garantir la capacité de transporter rapidement des marchandises et des équipements sur tout le territoire."
 SOV_tranformation_of_nature:0 "Transformation de la nature"
 SOV_tranformation_of_nature_desc:0 "Le Grand Plan de Staline pour la Transformation de la Nature doit être mis en oeuvre. L'environnement doit être façonné et façonné à grande échelle pour fonctionner en faveur du peuple."
 SOV_stalin_constitution:0 "Constitution de Staline"
 SOV_stalin_constitution_desc:0 "Il est temps de mettre à jour notre ancienne constitution et d'impressionner le monde avec les droits dont jouissent les ouvriers et les paysans de l'Union soviétique !"
 SOV_militarized_schools:0 "Écoles militarisées"
 SOV_militarized_schools_desc:0 "Les enfants soviétiques devraient être inculqués à la discipline militaire et aux vertus socialistes comme le sacrifice de soi et la solidarité. Les jeunes esprits se façonnent plus facilement."
 SOV_workers_culture:0 "Culture ouvrière"
 SOV_workers_culture_desc:0 "Le socialisme n'est pas seulement un système économique et le marxisme n'est pas seulement une science ; nous devons transformer le tissu même de la société soviétique pour extirper tous les vestiges des moeurs et des traditions bourgeoises."
 SOV_new_soviet_man:0 "Nouvel homme soviétique"
 SOV_new_soviet_man_desc:0 "Le nouvel homme soviétique est altruiste, instruit, discipliné et en bonne santé ; un triomphe vivant sur les instincts vils et la fausse conscience. Les hommes donneront volontiers leur vie pour le bien de tous et les femmes donneront naissance à de nombreux enfants pour l'avenir de la société soviétique."
 SOV_progress_cult:0 "Culte du progrès"
 SOV_progress_cult_desc:0 "Nous devrions célébrer les innovations des scientifiques soviétiques exceptionnels et encourager le bon type de libre pensée. L'URSS sera toujours en avance sur l'Occident décadent lorsqu'il s'agira d'oser de nouveaux domaines scientifiques ; il suffit de regarder le brillant travail du camarade Lyssenko !"
 SOV_socialist_science:0 "Science socialiste"
 SOV_socialist_science_desc:0 "Le monde, tout comme l'esprit, est en mouvement constant. La nature est en progrès constant ; révolution même. Les principes du matérialisme dialectique peuvent être appliqués aux sciences naturelles ainsi qu'au monde social..."
 SOV_aviation_cult:0 "Culte de l'aviation"
 SOV_aviation_cult_desc:0 "L'Union soviétique impressionnera le monde avec ses exploits aériens stupéfiants. Nos pilotes héroïques sont les chevaliers de la culture et du progrès bolcheviques, démontrant notre maîtrise technologique de la nature. Que de chemin parcouru depuis l'époque du tsar !"
 SOV_women_pilots:0 "Les femmes dans l'aviation"
 SOV_women_pilots_desc:0 "La camarade Raskova, notre héroïque aviatrice de longue distance, devrait être autorisée à former des régiments aériens entièrement féminins grâce à son programme Aviation Group 122."
 SOV_night_witches_tt:0 "Le 588. Night Bomber Regiment devient actif à Moscou."
 SOV_improve_railway:0 "Améliorer le réseau ferroviaire"
 SOV_improve_railway_desc:0 "Notre premier plan quinquennal s'est avéré trop efficace. L'expansion massive de l'industrie lourde a laissé l'Union soviétique dans une position beaucoup plus forte pour se défendre, mais le réseau ferroviaire soviétique s'est heurté à des goulots d'étranglement critiques. Le Commissariat du peuple aux chemins de fer (NKPS) a un plan ambitieux pour éliminer ces goulots d'étranglement et garantir que nous puissions défendre la patrie."
 SOV_transpolar_flights:0 "Vols transpolaires"
 SOV_transpolar_flights_desc:0 "Nos pilotes les plus courageux commencent tout juste à prouver que des itinéraires audacieux à travers l'Arctique sont possibles. En utilisant des raccourcis inattendus comme ceux-ci dans notre planification de la guerre aérienne, nous serons en mesure de surprendre l'ennemi."
 SOV_ocean_going_navy:0 "Une marine océanique"
 SOV_ocean_going_navy_desc:0 "Bien que l'Union s'étende sur une plus grande superficie que n'importe quelle autre nation de la planète, les océans du monde ne sont pas encore gouvernés par nos navires. Des cuirassés lourdement blindés feront partie de notre future flotte océanique."
 SOV_peoples_commissariat:0 "J'ai trouvé le PCDI"
 SOV_peoples_commissariat_desc:0 "Le Commissariat du peuple à l'industrie de défense de l'URSS sera un ministère de l'industrie lourde qui se concentrera sur nos projets militaro-industriels. À long terme, la charge de travail pourrait nécessiter de nouvelles divisions du ministère."
 SOV_anti_fascist_diplomacy:0 "Diplomatie antifasciste"
 SOV_anti_fascist_diplomacy_desc:0 "Bien que tous les régimes occidentaux soient répressifs et corrompus, il n'y en a aucun pire que ceux qui prétendent être progressistes ; ou même socialiste ! En promouvant une telle fausse conscience parmi le prolétariat, ils tentent de retarder la Révolution et de maintenir les travailleurs dans un esclavage perpétuel."
 SOV_operation_zet:0 "Opération Zet"
 SOV_operation_zet_desc:0 "Bien que le Kuomintang soit réactionnaire, il semble peu probable que Mao et son courant communiste l'emportent en Chine. Nous devons nous efforcer d'améliorer nos relations avec Chiang ; De toute façon, l'Empire ridiculement anachronique du Japon est voué à s'effondrer bientôt."
 SOV_annex_tannu_tuva:0 "Annexe Tannu Touva"
 SOV_annex_tannu_tuva_desc:0 "Même si cela n'a guère d'importance sur le plan économique, pour des raisons politiques, nous devrions formellement annexer la République populaire de Tannu Touva en tant qu'oblast autonome au sein de l'Union soviétique."
 SOV_improve_stalin_line:0 "Améliorer la ligne Staline"
 SOV_improve_stalin_line_desc:0 "Notre frontière occidentale doit être mieux protégée contre l'agression fasciste. La ligne Staline doit être étendue et modernisée."
 SOV_far_east_fortification_forts_1:0 "Ajoutez §Y6 Forts terrestres§! à la frontière japonaise.\n"
 SOV_far_east_fortification_forts_2:0 "Ajoutez §Y8 Forts terrestres§! à la frontière japonaise.\n"
 SOV_far_east_fortification_forts_3:0 "Ajoutez §Y4 Forts terrestres§! à la frontière japonaise.\n"
 SOV_xian_incident:0 "Incident de Xi'an"
 SOV_xian_incident_desc:0 "Grâce à nos contacts avec d'éminents responsables du Kuomintang, nous devrions pouvoir enlever Chiang Kai-Shek et le forcer à partager le pouvoir avec Mao, mettant ainsi un terme à leur querelle destructrice afin que la Chine puisse mieux résister aux prédations du Japon."
 SOV_xian_incident_tt:0 "Si les deux parties sont d'accord, cela forcera une trêve entre la Chine nationaliste et communiste."
 SOV_anti_capitalist_diplomacy:0 "Diplomatie anticapitaliste"
 SOV_anti_capitalist_diplomacy_desc:0 "Les pires obstacles à la révolution mondiale sont, sans aucun doute, les gros banquiers des États-Unis et les oppresseurs colonialistes impitoyables du Royaume-Uni. Notre objectif premier doit toujours être de gifler leurs mains avides et de saper leur propagande libérale."
 SOV_expand_red_fleet:0 "Développez la flotte rouge"
 SOV_expand_red_fleet_desc:0 "La Flotte rouge est pathétiquement faible comparée aux marines des puissances impérialistes. Nous devons faire de son expansion une priorité nationale !"
 SOV_anti_colonialist_rebels:0 "Le Komintern"
 SOV_anti_colonialist_rebels_desc:0 "Alors que le système capitaliste entre dans sa période d'effondrement final, la position correcte de tous les partis communistes doit être une ligne d'ultra-gauche hautement agressive et militante. En particulier, nous exhortons les partis communistes du monde à consacrer leurs énergies à la destruction de la gauche modérée."
 SOV_southern_thrust:0 "Poussée sud"
 SOV_southern_thrust_desc:0 "L'annexion de l'Iran et de l'Irak garantirait à la fois leurs vastes réserves de pétrole pour la Révolution et exercerait une pression directe sur les impérialistes britanniques en Égypte et en Inde."
 SOV_claim_on_sinkiang:0 "Réclamation du Sinkiang"
 SOV_claim_on_sinkiang_desc:0 "Sous le règne du camarade Sheng Shicai, le Sinkiang est déjà un État fantoche soviétique virtuel. Nous devrions le rendre officiel..."
 SOV_claim_on_sinkiang_threat:0 "Sinkiang revendiqué par les Soviétiques"
 SOV_pan_slavic_rhetoric:0 "Rhétorique panslave"
 SOV_pan_slavic_rhetoric_desc:0 "Le camarade Lénine est allé trop loin dans son abandon de l'identité russe et slave dans sa poursuite de la Révolution mondiale. Un certain degré de nationalisme devrait nous être utile, et la renaissance d'une sorte de panslavisme pourrait nous rapprocher des autres nations slaves."
 SOV_claims_on_baltic:0 "Réclamations en Baltique"
 SOV_claims_on_baltic_desc:0 "Pierre le Grand avait raison de chercher à accéder aux ports de l'Ouest. Les États baltes perdus après la révolution devraient être réintégrés à l'Union soviétique."
 SOV_claim_bessarabia:0 "Réclamation sur la Bessarabie"
 SOV_claim_bessarabia_desc:0 "La mer Noire est encore plus importante pour notre économie que la Baltique. Nous devons faire tout notre possible pour assurer le contrôle du Bosphore et des Dardanelles."
 SOV_claims_on_turkey:0 "Réclamations sur la Turquie"
 SOV_claims_on_turkey_desc:0 "Les Turcs ont non seulement systématiquement refusé nos demandes de contrôle mutuel du détroit du Bosphore, mais ils refusent également de discuter de tout ajustement des frontières à l'est. Il est peut-être temps de leur donner une leçon !"
 SOV_offer_poland_protection_tt:0 "§YLa Pologne se verra attribuer les États revendiqués dans le cadre de cet accord en cas de conquête soviétique.§!\n"
 SOV_great_purge:0 "La grande purge"
 SOV_great_purge_bypass_tt:0 "Trotsky devient le leader de l'Union soviétique"
 SOV_great_purge_desc:0 "Un dangereux complot trotskyste se prépare parmi les officiers ; même aux échelons les plus élevés. Même si l'implication personnelle de Trotsky reste inconnue, la menace est grande. L'URSS pourrait même être plongée dans une autre guerre civile... À moins que nous ne soyons prêts à casser quelques oeufs."
 SOV_great_purge_tt:0 "Une série de §Yprocès-spectacles§! sera organisée pour purger les ministres et dirigeants soupçonnés de trotskisme.\n"
 SOV_great_purge_tt2:2 "Le nombre de purges effectuées affectera la probabilité d'une nouvelle guerre civile §Y§! et augmentera l'effet de §HOfficiers purgés§!.\nNe pas choisir cette orientation mènera à §Yune guerre civile§! et au retour potentiel de §YLéon Trotsky§! d'exil.\n\n"
 SOV_permanent_revolution:0 "Révolution permanente"
 SOV_permanent_revolution_tt:0 "Trotsky est de retour"
 SOV_permanent_revolution_tt2:0 "§YTrotsky§! acquiert un meilleur trait de leader."
 SOV_permanent_revolution_desc:0 "Le démagogue oppressif est parti ! Le véritable pouvoir a été restitué au peuple de notre nation. Tous sont désormais en mesure de défendre leurs intérêts de manière indépendante et sans compromis. Nous sommes en constante évolution. La révolution permanente est une révolution triomphante."
 SOV_nkvd_divisions:0 "Divisions du NKVD"
 SOV_nkvd_divisions_desc:0 "Le NKVD devrait se doter de quelques divisions qui lui sont propres pour agir en tant que troupes internes, protégeant les chemins de fer et les installations importantes."
 SOV_smersh_tt:0 "§YAnnule le risque d'un coup d'État.§!\n"
 SOV_partisan_suppression:0 "Répression partisane"
 SOV_partisan_suppression_desc:0 "Le SMERSH devrait être élargi pour mieux pouvoir infiltrer et réprimer impitoyablement toutes les formes d'activité partisane dans les territoires occupés."
 SOV_war_with_germany:0 "Guerre avec l'Allemagne"
 SOV_war_with_germany_desc:0 "La menace allemande continue de croître. Nous pouvons et devons détruire l'armée allemande et la faire s'incliner devant ses nouveaux suzerains."
 SOV_war_with_germany_tt:0 "Le pacte Molotov-Ribbentrop n'est pas en vigueur"
 SOV_war_with_japan:0 "Guerre avec le Japon"
 SOV_has_not_officers_purged_tt:0 "N'a pas d'esprit national §YOfficiers purgés§!"
 SOV_war_with_japan_desc:0 "Il semble que les Japonais n'aient pas l'intention de reculer. La seule force de dissuasion efficace sera la guerre. Ils regretteront d'avoir résisté à nos exigences lorsque l'Armée rouge les piétinera."
 SOV_war_with_uk:0 "Guerre avec le Royaume-Uni"
 SOV_war_with_uk_desc:0 "Les impérialistes britanniques n'ont jamais eu de respect pour nous. Il ne fait aucun doute qu'ils se tourneront vers l'Union Soviétique lorsqu'ils en auront fini avec le reste du monde. Il n'existe qu'une seule façon d'empêcher leur expansion agressive. Guerre!"
 SOV_claim_on_the_straits:0 "Réclamez le détroit"
 SOV_claim_on_the_straits_desc:0 "Le détroit menant de la mer Noire à la mer Égée constitue un point stratégique clé. Nous ne pouvons pas permettre que ce territoire soit contrôlé par des puissances étrangères. Pour garantir la pertinence de la Flotte Rouge, nous devons sécuriser les détroits."
 SOV_ultimatum_to_greece:0 "Ultimatum à la Grèce"
 SOV_ultimatum_to_greece_desc:0 "Les îles de la mer Égée sont le dernier élément stratégique dont nous avons besoin pour garantir que la Flotte rouge puisse opérer librement. Les Grecs subissent des pressions de toutes parts et préféreront abandonner un petit territoire pour éviter une guerre totale."
 SOV_diversify_the_programme:0 "Diversifier le programme"
 SOV_diversify_the_programme_desc:0 "Nous avons beaucoup appris de ces dernières années et des progrès ont été réalisés dans les domaines de la guerre traditionnelle. Nous sommes une nation de grands scientifiques qui ont la capacité de découvrir des méthodes de guerre offrant d'énormes avantages. Nous devons nous assurer qu'ils bénéficient des meilleures conditions de travail si nous voulons obtenir des résultats."
 SOV_research_city_experiment:0 "Expérience de ville de recherche"
 SOV_research_city_experiment_desc:0 "L'un de nos plus éminents scientifiques, Kurchatov, a noté que lors de la fragmentation des noyaux d'un kilogramme d'uranium, l'énergie libérée doit être égale à l'explosion de 20 000 tonnes de trotyl. Nous devons exploiter ce pouvoir devant nos ennemis pour assurer la survie de la Patrie."
 SOV_closed_city_network:0 "Réseau de villes fermées"
 SOV_closed_city_network_desc:0 "Nous devrions créer des villes fermées pour la recherche qui nécessitent plus d'espace que ce dont nous disposons dans nos bases militaires. Restreindre l'accès aux villes garantit que nos recherches restent secrètes, tout en donnant à nos scientifiques suffisamment d'espace pour des expériences à grande échelle."
 strike_usa_focus:0 "Frappez les États-Unis !"
 strike_usa_focus_desc:0 "Les perfides Américains nous tiennent à leur merci, contrôlant notre approvisionnement en pétrole et autres ressources dont nous avons désespérément besoin. Leur industrie est largement supérieure à la nôtre, donc si nous faisons grève, nous ferions mieux de frapper fort ! Nous ne pouvons pas espérer gagner une guerre prolongée contre les États-Unis..."
 chinese_puppet_focus:0 "Marionnette chinoise"
 chinese_puppet_focus_desc:1 "La Chine a prouvé qu'elle cherchait à éviter la guerre avec nous. Peut-être que leurs dirigeants considèrent la division interne comme une menace plus grande. Nous pourrions leur offrir notre protection contre les communistes et les chefs de guerre, en tant que sujets de la sphère de coprospérité de la Grande Asie de l'Est."
 chinese_war_focus:0 "Guerre avec la Chine"
 chinese_war_focus_desc:0 "L'incident du pont Marco Polo a prouvé que les Chinois ne sont pas intéressés par la coopération. Alors que les tensions croissantes menacent le cessez-le-feu qui s'ensuit, la guerre pourrait être le seul moyen de rétablir l'ordre dans la nation chinoise."
 subdue_warlords_focus:0 "Soumettez les seigneurs de guerre"
 subdue_warlords_focus_desc:0 "Les Chinois ont laissé leur empire autrefois fier être brisé, mis en pièces par des radicaux et des cliques militaires. L'Empire du Japon ne tolérera pas de telles divisions, même entre ses sujets."
 oust_germans_focus:0 "Rompre les liens sino-allemands"
 oust_germans_focus_desc:0 "Les conseillers militaires allemands sont présents en Chine depuis au moins les années vingt, apportant un soutien essentiel au Kuomintang. Cela ne peut plus être toléré. Nous sommes en droit d'exiger le retrait immédiat de tout soutien allemand aux Chinois. Il est temps pour les Allemands de choisir leur camp."
 found_own_faction_focus:0 "J'ai trouvé notre faction"
 found_own_faction_focus_desc:1 "Nous avons déjà déployé des efforts pour créer la sphère de coprospérité de la Grande Asie de l'Est. Pour assurer une victoire durable, le Japon doit être suffisamment fort pour diriger seul, en Asie et au-delà."
 axis_leanings_focus:0 "Tendances de l'Axe"
 axis_leanings_focus_desc:0 "Nous avons de nombreux intérêts et valeurs en commun avec la nouvelle Allemagne, qui construit une base de puissance en Europe. Les rejoindre en tant qu'alliés nous donnerait un ami puissant suffisamment éloigné pour ne pas rivaliser avec notre domination sur l'Asie."
 subvert_india_focus:0 "Armée nationale indienne"
 subvert_india_focus_desc:0 "Si la Grande-Bretagne juge nos efforts pour construire un empire, nous leur montrerons que le leur est déjà en train de s'effondrer. Les prisonniers de guerre indiens et les expatriés formeront la base d'un mouvement capable de renverser le Raj britannique."
 jap_improved_sprit_focus:0 "Esprit national amélioré"
 jap_improved_sprit_focus_desc:0 "La fierté nationaliste et le soutien à la guerre l'emportent sur tous les sujets de l'Empereur, les poussant à des sommets de dévotion toujours plus élevés !"
 befriend_siam_focus:0 "Se lier d'amitié avec Siam"
 befriend_siam_focus_desc:0 "Le Siam a évité la colonisation européenne et n'est pas habitué à être une nation soumise. Au lieu de les soumettre, nous devrions les convaincre de coopérer avec nous pour que cela continue ainsi."
 army_primancy_focus:0 "Primauté de l'armée"
 army_primancy_focus_desc:0 "Des deux principales armes de service, c'est véritablement l'Armée qui est le bras droit fort de l'Empire ! Sa capacité à prendre et à conserver du terrain dépasse de loin les services mineurs que la Marine peut fournir. En reconnaissant ce fait simple et évident et en consacrant davantage de ressources à l'armée, les possibilités sont illimitées."
 JAP_army_primancy_focus_bypass_tt:0 "Pas assez d'emplacements de construction pour §Yusines militaires§! dans la zone d'origine."
 jap_sia_love:0 "Diplomatie nippo-siamoise"
 jap_sia_love_desc:0 "Le Japon a concentré ses efforts diplomatiques sur l'amélioration des relations avec le Siam."
 navy_primancy_focus:0 "Primauté de la Marine"
 JAP_navy_primancy_focus_bypass_tt:0 "Pas assez d'emplacements de construction pour §YChantiers navals§! dans la zone d'origine."
 navy_primancy_focus_desc:0 "Des deux principales armes de service, c'est véritablement la Marine qui est le bras droit fort de l'Empire ! Sa capacité à contrôler les mers dépasse de loin les services mineurs que l'armée peut fournir. En reconnaissant ce fait simple et évident et en consacrant davantage de ressources à la Marine, les possibilités sont illimitées."
 army_innovations_focus:0 "Innovation militaire"
 army_innovations_focus_desc:0 "Maintenant que l'Armée est reconnue comme le principal service de l'Empire, il nous incombe de consacrer davantage de ressources à l'étude des doctrines terrestres."
 army_air_innovations_focus:0 "Innovation aérienne de l'armée"
 army_air_innovations_focus_desc:0 "La mission première de l'Armée de l'Air doit être le soutien de notre tant vantée Armée !"
 army_motorization_focus:0 "Motorisation de l'armée"
 army_motorization_focus_desc:0 "Une plus grande concentration sur la motorisation augmentera la vitesse à laquelle l'infanterie pourra atteindre le champ de bataille, au moins dans les zones dotées de bonnes routes."
 air_base_expansion_focus:0 "Expansion de la base aérienne"
 air_base_expansion_focus_desc:0 "Pour mieux soutenir l'armée, l'armée de l'air a besoin de bases aériennes plus grandes."
 armor_innovations_focus:0 "Innovation en armure"
 armor_innovations_focus_desc:0 "Avec l'ascendant de notre armée, certains généraux ont suggéré que nous investissions dans un certain nombre de véhicules blindés modernes."
 naval_innovations_focus:0 "Innovations navales"
 naval_innovations_focus_desc:0 "Maintenant que la Marine est reconnue comme le premier service de l'Empire, il nous incombe de consacrer davantage de ressources à la conception de nouvelles classes de navires."
 naval_air_innovations_focus:0 "Innovations aéronavales"
 naval_air_innovations_focus_desc:0 "La mission première de l'Armée de l'Air doit être le soutien de notre tant vantée Marine !"
 convoy_protection_focus:0 "Protection des convois"
 convoy_protection_focus_desc:0 "Bien qu'il s'agisse d'une tactique lâche et déshonorante, il est possible que des nations ennemies ciblent les navires marchands qui transportent des fournitures et des ressources dans notre Empire. Nous devons étudier la meilleure manière de protéger ces navires, si cela devait se réaliser."
 advanced_torpedoes_focus:0 "Torpilles avancées"
 advanced_torpedoes_focus_desc:0 "En utilisant de l'oxygène comprimé plutôt que de l'air comprimé dans les systèmes de propulsion, nos torpilles pourront voyager plus loin et transporter une ogive plus grosse que n'importe quel type précédent."
 shbb_focus:0 "Cuirassés super-lourds"
 shbb_focus_desc:0 "À court terme, il est peu probable que nous puissions surpasser la Grande-Bretagne ou les États-Unis en termes de nombre de cuirassés, mais peut-être n'en avons-nous pas besoin. Au lieu de cela, il pourrait être possible de construire des cuirassés beaucoup plus puissants que ce que le traité de Washington des Occidentaux leur permet de construire."
 naval_base_focus:0 "Agrandissement de la base navale"
 naval_base_focus_desc:0 "L'expansion navale nécessite davantage de bases navales."
 carrier_focus:0 "Focus sur le transporteur"
 carrier_focus_desc:0 "Le Japon a besoin d'une marine puissante, et le porte-avions doit être au coeur de la force de notre flotte. La journée du cuirassé est terminée, comme nos ennemis le découvriront bientôt !"
 battleship_focus:0 "Focus sur le cuirassé"
 battleship_focus_desc:0 "Le Japon a besoin d'une marine puissante, et le cuirassé doit être au coeur de la force de notre flotte. Laissez les autres nations gaspiller leur richesse dans des porte-avions non testés, seuls les cuirassés peuvent dominer les mers !"
 spiritual_mobilization_focus:0 "Mobilisation spirituelle"
 spiritual_mobilization_focus_desc:0 "Notre nation tout entière, et pas seulement nos soldats, doit être spirituellement préparée à la guerre. À cette fin, les nationalistes ont été rassemblés au sein du Mouvement de mobilisation spirituelle nationale pour renforcer le patriotisme et le soutien au gouvernement."
 warrior_traditions_focus:0 "Traditions guerrières"
 warrior_traditions_focus_desc:0 "Tout au long de son histoire, le Japon a conservé un ensemble unique de traditions parmi la classe guerrière. Ces valeurs doivent être revitalisées et chéries par chaque soldat, quel que soit son grade."
 divine_wind_focus:0 "Le vent divin"
 divine_wind_focus_desc:0 "On attend de tout soldat qu'il fasse face sans crainte à la perspective de la mort, mais notre peuple doit aller au-delà de cela, se préparant à se sacrifier sans espoir de survie pour la gloire de l'empereur et de la nation."
 imperial_glory_focus:0 "Gloire Impériale"
 imperial_glory_focus_effect:0 "Permet la production de §HYokosuka MXY7 Ohka§!"
 imperial_glory_focus_desc:0 "Les kamikazes, les tactiques de l'unité d'attaque spéciale, ont fait passer les attentats-suicides d'une dernière mesure improvisée à une doctrine établie. Avec de nouveaux avions, essentiellement des missiles pilotés, ces attaques seront imparables."
 student_movement_focus:0 "Le mouvement étudiant"
 student_movement_focus_desc:0 "Le ministère de l'Éducation est un élément aussi important que n'importe quel autre de la mobilisation spirituelle, et le ralliement des éducateurs et des étudiants derrière la nation permettra de construire un système éducatif durable à vocation militaire."
 extra_tech_focus:0 "Recherche supplémentaire"
 synth_oil_focus:0 "Focus sur l'huile synthétique"
 synth_oil_focus_desc:0 "Notre propre production pétrolière est très limitée et importer du pétrole nous met à la merci des intérêts étrangers. La solution la plus sûre serait de perfectionner notre technologie d'huile synthétique."
 JAP_synth_oil_focus_tt:0 "Idemitsu Kosan disponible en tant que préoccupation de l'industrie"
 secret_weapon_focus:0 "Armes avancées"
 secret_weapon_focus_desc:0 "En tant qu'empire insulaire, nous devons toujours être à l'avant-garde de la recherche navale, mais les fusées à longue portée ne peuvent pas non plus faire de mal."
 industrial_effort_focus:0 "Austérité impériale"
 industrial_effort_focus_desc:0 "Chaque sujet de l'Empereur doit se sacrifier pour le bien de l'Empire."
 industrial_effort_focus2:0 "Effort industriel"
 industrial_effort_focus2_desc:0 "Le Japon est un pays nouvellement industrialisé et n'est pas encore aussi puissant que certains pays occidentaux. Nous devons prendre des mesures pour réduire l'écart entre nos capacités."
 infra_effort_focus:0 "Efforts en matière d'infrastructures"
 infra_effort_focus_desc:0 "Il n'a pas été facile de construire des infrastructures dans notre pays montagneux, mais les efforts doivent néanmoins se poursuivre."
 fortress_japan_focus:0 "Forteresse Japon"
 fortress_japan_focus_desc:0 "Si jamais nos ennemis submergeaient notre marine, nos fortifications rendraient toute tentative d'invasion bien plus coûteuse que la plupart des pays ne peuvent se permettre de payer."
 crypto_bomb_focus:0 "Bombe cryptologique"
 crypto_bomb_focus_desc:0 "Les Polonais ont développé une machine brillante qu'ils appellent la « bombe cryptologique » qui peut briser les chiffres allemands Enigma. Nous disposons des ressources nécessaires pour le développer davantage dans nos installations de Bletchley Park."
 tizard_mission_focus:0 "La mission Tézard"
 tizard_mission_focus_desc:0 "Nous avons réalisé de nombreuses percées technologiques que nous ne pouvons pas exploiter pleinement nous-mêmes en raison de notre manque de ressources et de capacité industrielle. Henry Tizard aimerait diriger une délégation pour négocier un traité de partage de technologie avec les États-Unis."
 maud_focus:0 "Le Comité MAUD"
 maud_focus_desc:0 "Le comité « Application militaire de la détonation de l'uranium » est convaincu qu'il est théoriquement possible de construire une bombe d'une puissance incroyable en utilisant l'uranium pour réaliser une réaction de fission nucléaire incontrôlée. Cependant, nous ne pourrons peut-être pas développer cette technologie par nous-mêmes à temps. Nous devrions parler avec les Américains."
#  general_rearmament_focus:0 "General Rearmament"
#  general_rearmament_focus_desc:1 "[Root.GetGeneralRearmamentDesc]"
 ENG_GENERAL_REARMAMENT_DESC_HISTORICAL:0 "Il semble qu'une nouvelle Grande Guerre soit inévitable. Si ce n'est pas Hitler, ce sera le Mikado, ou même les Soviétiques... L'opinion publique a suffisamment changé pour que nous puissions lancer un programme de réarmement général."
 ENG_GENERAL_REARMAMENT_DESC_AHISTORICAL:0 "Nos prédécesseurs ont trop négligé notre situation militaire. Nous devons lancer un programme de réarmement général pour remédier aux insuffisances cinglantes de nos forces armées."
 air_defense_focus:0 "Défense aérienne"
 air_defense_focus_tt:1 "Ajoutez un maximum de §YAnti-Air§! dans §YEast Anglia§!, §YSussex§! et §YSud-Ouest de l'Angleterre§!"
 air_defense_focus_bypass_tt:0 "Pas assez d'emplacements de construction pour §YAnti-Air§!"
 air_defense_focus_desc:0 "Il n'est pas question de savoir d'où viendra l'ennemi ; nous devons protéger la côte avec de vastes batteries anti-aériennes."
 radar_focus:0 "RADAR"
 radar_focus_desc:0 "La capacité de détecter les bombardiers ennemis sera cruciale pour l'effort de guerre. Nous ne devons épargner aucune ressource pour développer davantage la technologie radar et construire un réseau de stations de détection le long des côtes."
#  royal_ordinance_focus:2 "[Root.GetRoyalOrdnanceFactoriesName]"
#  royal_ordinance_focus_desc:1 "[Root.GetRoyalOrdnanceFactoriesDesc]"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_HISTORICAL:0 "Usines royales d'artillerie"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_COMMUNIST:0 "Usines de munitions révolutionnaires"
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_HISTORICAL:0 "L'Arsenal royal de Woolwich est malheureusement insuffisant pour produire toutes les munitions et armes légères dont nous avons besoin. Nous devrions établir beaucoup plus d'usines dans tout le pays, de préférence dans des zones relativement sûres."
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_COMMUNIST:0 "L'arsenal révolutionnaire de Woolwich est malheureusement insuffisant pour produire toutes les munitions et armes légères dont nous avons besoin. Nous devrions établir beaucoup plus d'usines dans tout le pays, de préférence dans des zones relativement sûres."
 shadow_scheme_focus:0 "Le schéma de l'ombre"
 shadow_scheme_focus_desc:0 "Le ministère de l'Air a proposé une brillante suggestion visant à faciliter la conversion des usines civiles en usines militaires. Grâce aux subventions et aux prêts appropriés accordés à diverses entreprises clés, leurs usines peuvent être agrandies et adaptées à l'avance pour rendre la transition vers des applications militaires beaucoup plus fluide."
 shadow_scheme_focus_tt:1 "Accorde §G4§! Emplacements de bâtiment et §Y4 usines militaires§! au total dans deux États lors de l'entrée en guerre.\n"
#  uk_small_arms_focus:0 "BSA Company"
#  uk_small_arms_focus_desc:1 "[ROOT.GetBSACompanyDesc]"
 ENG_BSA_COMPANY_DESC_HISTORICAL:0 "Les Royal Ordnance Factories ne produisent pas suffisamment d'armes légères, mais, comme nous l'avons fait pendant la Grande Guerre, nous pourrions faire appel à la Birmingham Small Arms Company et accroître sa capacité."
 ENG_BSA_COMPANY_DESC_COMMUNIST:0 "Les Revolutionary Ordnance Factories ne produisent pas suffisamment d'armes légères, mais, comme nous l'avons fait pendant la Grande Guerre, nous pourrions faire appel à la Birmingham Small Arms Company et accroître sa capacité."
 UK_secret_focus:0 "Armes secrètes"
 UK_secret_focus_desc:0 "Nous possédons désormais les connaissances et l'infrastructure nécessaires pour nous concentrer sur le développement de divers projets d'armes secrètes qui relevaient autrefois du domaine de la science-fiction."
#  air_rearmament_focus:0 "Air Rearmament"
#  air_rearmament_focus_desc:1 "[Root.GetAirRearmamentDesc]"
 ENG_AIR_REARMAMENT_DESC_HISTORICAL:0 "Dans toute guerre contre un ennemi continental, la Royal Air Force s'avérera la clé de la victoire. Premièrement, nous devons nous assurer que nos bases aériennes peuvent soutenir nos plans de réarmement !"
 ENG_AIR_REARMAMENT_DESC_COMMUNIST:0 "Dans toute guerre contre un ennemi continental, l'Armée de l'Air Populaire s'avérera la clé de la victoire. Premièrement, nous devons nous assurer que nos bases aériennes peuvent soutenir nos plans de réarmement !"
 fighter_command_focus:0 "Commandement des chasseurs"
 fighter_command_focus_desc:0 "Notre première priorité doit être de contrôler notre propre ciel ! Il est difficile de discerner un domaine de recherche militaire plus important que le développement des chasseurs."
 bomber_command_focus:0 "Commandement des bombardiers"
 bomber_command_focus_desc:0 "Comme Giulio Douhet le disait toujours ; \"Le bombardier passera toujours!\". Malgré les progrès de la technologie radar et des défenses anti-aériennes, nous devrions donner la priorité au développement de meilleurs bombardiers."
#  coastal_command_focus:0 "Coastal Command"
#  coastal_command_focus_desc:1 "[Root.GetCoastalCommandDesc]"
 ENG_COASTAL_COMMAND_DESC_HISTORICAL:0 "Notre industrie repose sur les ressources expédiées vers la Grande-Bretagne depuis de nombreuses régions éloignées de l'Empire. Nos convois sont notre élément vital et doivent être protégés à la fois par la Royal Navy et la Royal Air Force. Nous devrions créer une formation spéciale de la RAF pour protéger les abords de nos ports !"
 ENG_COASTAL_COMMAND_DESC_COMMUNIST:0 "Notre industrie repose sur les ressources expédiées vers la Grande-Bretagne depuis de nombreuses régions éloignées de l'Empire. Nos convois sont notre âme et doivent être protégés à la fois par la Marine de libération des travailleurs et par l'Armée de l'Air populaire. Il faudrait mettre en place une formation spéciale PAF pour protéger les abords de nos ports !"
 aircraft_production_focus:0 "Groupe de production aéronautique"
 aircraft_production_focus_desc:0 "La production d'avions reste notre priorité absolue. Le London Aircraft Production Group (LAPG) devrait être créé pour gérer et coordonner toute la production disponible liée aux avions."
 uk_jet_focus:0 "Avion à réaction"
 uk_jet_focus_desc:0 "Il semble presque certain que le moteur à réaction viendra remplacer les moteurs à hélices des avions. Le potentiel est énorme et nous ne devons pas permettre à la Grande-Bretagne d'être à la traîne dans ce domaine crucial de la recherche."
#  naval_rearmament_focus:0 "Naval Rearmament"
#  naval_rearmament_focus_desc:1 "[Root.GetNavalRearmamentDesc]"
 ENG_NAVAL_REARMAMENT_DESC_HISTORICAL:0 "Bien que nous ayons essayé d'empêcher une course aux armements navals avec le deuxième traité naval de Londres, même les signataires l'ignorent pour la plupart. La Royal Navy ne doit jamais perdre sa suprématie mondiale. Nous devons toujours veiller à ce qu'il reste le plus grand au monde."
 ENG_NAVAL_REARMAMENT_DESC_COMMUNIST:0 "Bien que nous ayons essayé d'empêcher une course aux armements navals avec le deuxième traité naval de Londres, même les signataires l'ignorent pour la plupart. La Marine de Libération des Travailleurs ne doit jamais perdre sa suprématie mondiale. Nous devons toujours veiller à ce qu'il reste le plus grand au monde."
 uk_destroyer_focus:0 "Concentration du Destructeur"
 uk_destroyer_focus_desc:0 "Les cuirassés modernes sont des merveilles, mais il ne faut pas négliger le rôle crucial du humble destroyer dans la protection de nos convois."
 uk_convoy_focus:0 "Focus sur l'escorte de convoi"
 uk_convoy_focus_desc:0 "On ne le dira jamais assez, nos convois sont notre pierre angulaire. Nous devons faire tout ce qui est en notre pouvoir pour les protéger et remplacer rapidement le tonnage perdu."
#  uk_waves_focus:0 "Britannia Rules the Waves"
#  uk_waves_focus_desc:1 "[Root.GetBritanniaRulesTheWavesDesc]"
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_HISTORICAL:0 "Dans l'ombre de la Royal Navy, d'autres puissances navales sont obligées de proposer de nouvelles doctrines innovantes pour compenser. Nous ne devons pas nous reposer sur nos lauriers et nous fier uniquement à la quantité et à la qualité des navires individuels."
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_COMMUNIST:0 "Dans l'ombre de la Marine de libération ouvrière, d'autres puissances navales sont obligées de proposer de nouvelles doctrines innovantes pour compenser. Nous ne devons pas nous reposer sur nos lauriers et nous fier uniquement à la quantité et à la qualité des navires individuels."
 uk_carrier_focus:0 "Focus sur le transporteur"
 uk_carrier_focus_desc:0 "Il existe un débat intense parmi les théoriciens navals sur la viabilité continue du cuirassé. Certains soutiennent que la puissance aérienne moderne finira par dominer la puissance navale et que le porte-avions remplacera le cuirassé en tant que roi des océans."
 uk_spain_focus:0 "Contraindre l'Espagne"
 uk_spain_focus_desc:0 "Les Espagnols connaissent mieux que quiconque la puissance de la Royal Navy, mais un rappel s'impose peut-être..."
 uk_battleship_focus:0 "Focus sur le cuirassé"
 uk_battleship_focus_desc:0 "Alors que les théoriciens se disputent sur la suprématie aérienne ou la suprématie navale, personne ne veut que les canons d'un cuirassé soient pointés vers leur palais. Même si les passionnés de porte-avions finissent par donner raison, les cuirassés domineront encore les océans pour les années à venir."
 uk_turkey_focus:0 "Contraindre la Turquie"
 uk_turkey_focus_desc:0 "Ils n'ont pas besoin de nous aimer, mais Johnny Turkey devrait en savoir assez pour craindre nos cuirassés..."
 uk_amphibious_focus:0 "Guerre amphibie"
 uk_amphibious_focus_desc:0 "Contrôler les vagues, c'est bien, mais il faut parfois se mouiller les pieds. Nous ne devons pas négliger notre capacité à débarquer des forces d'invasion en territoire hostile."
 singapore_focus:0 "La stratégie de Singapour"
 singapore_focus_desc:0 "Singapour doit rester notre principale base navale à l'Est. Hong Kong pourrait tomber aux mains des Japonais, mais Singapour doit rester imprenable jusqu'à ce que la flotte principale puisse arriver pour vaincre l'ennemi de manière décisive."
 sp_landward_forts_focus:0 "Fortifications terrestres"
 sp_landward_forts_focus_desc:0 "Les défenses actuelles de l'île de Singapour sont insuffisantes. Nous devons concentrer nos efforts sur le renforcement des fortifications !"
 peninsular_focus:0 "Guerre péninsulaire"
 peninsular_focus_desc:0 "Nous devrions anticiper et ralentir un ennemi venant du nord via la Malaisie avant même qu'il n'atteigne Singapour."
 hongkong_focus:0 "Tenir Hong Kong"
 hongkong_focus_desc:0 "La stratégie de Singapour est obsolète. Notre plan devrait être plus audacieux et s'appuyer sur une base beaucoup plus proche du Japon. Avec des fortifications et des installations suffisantes, Hong Kong servira parfaitement !"
 hk_landward_forts_focus:0 "Fortifications terrestres"
 hk_landward_forts_focus_desc:0 "Hong Kong devra devenir une ville forteresse pour résister à une attaque soutenue de la Chine continentale."
 hk_air_focus:0 "Défenses aériennes"
 hk_air_focus_desc:0 "Nous devons considérablement étendre et améliorer les installations anti-aériennes à Hong Kong."
 uk_embargo_focus:0 "Politique d'embargo"
 uk_embargo_focus_desc:0 "La meilleure façon de vaincre les dictateurs - qu'ils soient rouges ou bruns - est simplement de les priver des ressources dont ils ont besoin pour faire la guerre. Le problème est simplement d'intimider les banquiers et les entreprises qui font affaire avec eux..."
 uk_sanction_italy_focus:0 "Sanctionner l'Italie"
 uk_sanction_italy_focus_desc:0 "Mussolini rêve d'un nouvel Empire romain et, aussi absurde que cela puisse paraître, il pourrait un jour nous attaquer pour réaliser son rêve. Nous devons faire tout notre possible pour empêcher cela avant qu'une guerre n'éclate."
 uk_sanction_japan_focus:0 "Sanctionner le Japon"
 uk_sanction_japan_focus_desc:0 "Les Japonais semblent déterminés à créer leur « sphère de coprospérité de la Grande Asie de l'Est » ; sous leur hégémonie, bien sûr. L'Empire britannique constitue le principal obstacle, aux côtés des colonies des autres puissances occidentales. Il faut leur refuser l'accès aux ressources dont ils ont besoin."
 uk_burma_focus:0 "La route de Birmanie"
 uk_burma_focus_desc:0 "Nous devrions aider les Chinois dans leur lutte contre le Japon en construisant une route - et les infrastructures associées - entre la Birmanie et la Chine, où les approvisionnements pourraient leur parvenir par voie terrestre, à l'abri de la prédation japonaise."
 uk_scandinavian_focus:0 "Intervention scandinave"
 uk_scandinavian_focus_desc:0 "La Scandinavie n'aurait que peu d'importance stratégique sans une chose ; Exportations suédoises de fer. Nous devons faire pression sur la Suède et la Norvège pour empêcher que cette ressource vitale n'atteigne l'Allemagne. S'ils refusent, nous devrons peut-être nous préparer à envahir..."
 uk_iraq_focus:0 "Sécuriser l'Irak"
 uk_iraq_focus_desc:0 "Nous avons accordé l'indépendance à l'Irak en 1932, mais compte tenu de la situation mondiale actuelle, cela aurait pu être une erreur. Le pétrole irakien ne doit jamais parvenir à nos ennemis..."
 uk_iran_focus:0 "Sécuriser l'Iran"
 uk_iran_focus_desc:0 "L'Iran n'est pas seulement riche en pétrole, ce dont nos ennemis doivent se priver ; c'est aussi le lien stratégique entre l'Inde, le Moyen-Orient et l'Union soviétique."
 uk_free_india_focus:0 "Indépendance indienne"
 uk_free_india_focus_desc:0 "Le Japon fomente activement la rébellion en Inde et a même formé une « armée nationale indienne » composée de recrues indiennes. La situation pourrait devenir dangereuse si rien n'est fait pour l'empêcher. Nous pouvons soit vaincre le Japon rapidement, soit promettre aux Indiens leur indépendance dans quelques années."
 uk_colonial_focus:0 "Encourager l'élite coloniale"
 uk_colonial_focus_desc:0 "Notre vaste empire tentaculaire abrite certains des plus grands esprits du monde, mais sa taille empêche nombre d'entre eux de se rencontrer. En les encourageant à travailler ensemble sur nos projets les plus importants, nous pouvons obtenir des résultats plus rapidement."
 uk_asia_focus:0 "Fortifier l'Asie de l'Est"
 uk_asia_focus_desc:0 "Beaucoup de nos anciennes colonies de l'Est sont menacées par les guerres civiles et les ambitions impériales des pays locaux. Nous ne devons pas négliger nos avant-postes restants, mais continuer à développer ces régions pour assurer notre présence mondiale."
 uk_china_focus:0 "Influencer la Chine"
 uk_china_focus_desc:0 "Bien que les nationalistes chinois se soient qualifiés d'ennemis de nos efforts coloniaux, ils sont coincés entre des ennemis qui n'ont pas assez d'alliés. Si nous les contactons, ils seront peut-être disposés à modifier leur politique."
 uk_commonwealth_focus:0 "Liens avec le Commonwealth"
 uk_commonwealth_focus_desc:0 "Unis par une allégeance commune à la Couronne, les nations du Commonwealth britannique sont les premières sur lesquelles nous pouvons compter en cas de nouveau conflit mondial. Il sera essentiel d'assurer la sécurité de notre administration diplomatique dans ce pays."
 uk_india_focus:0 "Développer le Raj"
 uk_india_focus_desc:0 "L'état de nos colonies en Inde reste controversé tant à l'étranger qu'à l'intérieur, mais quel que soit l'avenir qui les attend, le renforcement de leur capacité industrielle est une priorité au stade actuel."
 northern_expansion_focus:0 "Expansion vers le Nord"
 northern_expansion_focus_desc:0 "La doctrine de l'expansion vers le Nord, soutenue par l'armée impériale, reconnaît que l'Union soviétique représente la plus grande menace pour les ambitions japonaises. Avec la montée des tensions en Europe, un moment favorable pour attaquer l'Extrême-Orient russe va forcément se présenter. Il faut frapper vite."
 southern_expansion_focus:0 "Expansion vers le sud"
 southern_expansion_focus_tt:0 "Ajoutez §Ypacte de non-agression§! avec §YUnion soviétique§! lorsque sélectionné\n"
 southern_expansion_focus_desc:0 "La doctrine de l'expansion vers le sud, défendue par la marine impériale, stipule que le Japon doit s'étendre vers le sud, en Asie du Sud-Est et dans le Pacifique. Les riches colonies des puissances européennes disposent de ressources essentielles à l'industrie japonaise, mais cette voie mènera à un conflit avec les États-Unis. Une frappe préventive s'impose."
 new_ideas:0 "Nouveaux ministres disponibles.\n"
 available_political_advisor:0 "§GDisponible§! en tant que §YConseiller Politique§!:\n"
 available_chief_of_army:0 "§GDisponible§! en tant que §YChef d'Armée§!:\n"
 available_chief_of_navy:0 "§GDisponible§! en tant que §YChef de Marine§!:\n"
 available_chief_of_airforce:0 "§GDisponible§! en tant que §YChef de l'Armée de l'Air§!:\n"
 available_military_high_command:0 "§GDisponible§! comme §YHaut Commandement Militaire§!:\n"
 available_theorist:0 "§GDisponible§! comme §YThéoricien§!:\n"
 available_designer:0 "§GDisponible§! en tant que §YDesign Company§!:\n"
 available_industrial_concern:0 "§GDisponible§! en §YEntreprise Industrielle§!:\n"
 remove_political_advisor:0 "§RSupprimer§! en tant que §YConseiller politique§!:\n"
 remove_chief_of_army:0 "§RSupprimer§! en tant que §YChef d'armée§!:\n"
 remove_chief_of_navy:0 "§RSupprimer§! en tant que §YChef de la Marine§!:\n"
 remove_chief_of_airforce:0 "§RSupprimer§! en tant que §YChef de l'Armée de l'Air§!:\n"
 remove_military_high_command:0 "§RSupprimer§! comme §YHaut Commandement Militaire§!:\n"
 remove_theorist:0 "§RSupprimer§! comme §YThéoricien§!:\n"
 usa_focus:0 "Objectif national des États-Unis"
 USA_issue_war_bonds:0 "Émettre des obligations de guerre"
 USA_issue_war_bonds_desc:0 "Avec les obligations de guerre, nous comptons sur le soutien du peuple à l'effort de guerre et sur son patriotisme pour financer les dépenses militaires."
 USA_office_of_strategic_services:0 "Bureau des services stratégiques"
 USA_office_of_strategic_services_desc:0 "La création d'une agence de renseignement dédiée contribuera non seulement à la guerre, mais aussi aux futures opérations à l'étranger. Les services de renseignement britanniques peuvent servir de modèle."
 USA_wartime_industry:0 "Industrie de guerre"
 USA_wartime_industry_desc:0 "Nous avons une industrie forte, mais elle n'est pas entièrement adaptée à la production de matériel de guerre. Trouver des processus efficaces pour faciliter ce changement sera essentiel pour utiliser nos ressources."
 USA_first_special_service_force:0 "Première force de service spécial"
 USA_first_special_service_force_desc:0 "Les opérations derrière les lignes ennemies en territoire inhospitalier feront partie de tout conflit mondial. Former des unités commando pour remplir ces rôles est essentiel à notre guerre future."
 USA_rubber_reserve_company:0 "Société de réserve de caoutchouc"
 USA_rubber_reserve_company_desc:0 "Avec le déclenchement de la guerre, nous avons perdu presque toutes nos sources de caoutchouc importé.\n\nGrâce à un énorme effort coordonné, les sociétés de caoutchouc des États-Unis peuvent coopérer pour trouver de meilleurs moyens de produire du caoutchouc synthétique, voire même répondre aux exigences de l'effort de guerre."
 USA_manifest_destiny:0 "Destin manifeste"
 USA_manifest_destiny_desc:0 "Les circonstances particulières liées à la fondation et à l'histoire de notre nation nous donnent le mandat d'agir contre l'injustice et l'oppression partout dans le monde. Pour créer une communauté internationale sûre, notre principal exportation doit être la liberté."
 USA_manifest_destiny_tt:0 "§YDonne des objectifs de guerre contre toutes les nations fascistes et communistes.§!\n"
 USA_scientist_haven:0 "Havre des scientifiques"
 USA_scientist_haven_desc:0 "Après nous être affirmés comme gardiens de la liberté dans le monde, nous pouvons accueillir des chercheurs et des intellectuels chassés des régimes oppressifs étrangers, leur donnant une chance de réussir et de soutenir notre cause au pays des opportunités."
 USA_wpa:0 "WPA"
 USA_wpa_desc:0 "Des millions de personnes souffrent encore du chômage résultant de la Grande Dépression. Une agence chargée de mettre ces personnes au travail sur des projets publics ne résoudra peut-être pas complètement le problème, mais la Work Progress Administration est un pas dans la bonne direction."
 USA_committee_on_technocracy:0 "Comité sur la technocratie"
 USA_committee_on_technocracy_desc:0 "Nous devrions remplacer un certain nombre de politiciens et d'hommes d'affaires par des scientifiques et des ingénieurs. Ils possèdent l'expertise technique nécessaire pour gérer l'économie et nous assisterons à de grands progrès scientifiques, qui permettront à notre économie de prospérer à nouveau."
 USA_support_rock_island:0 "Soutenez Rock Island"
 USA_support_rock_island_desc:0 "Soutenir nos courageuses troupes de toutes les manières possibles est la clé de la victoire. Que ce soit en déployant des tirs d'artillerie lourde à distance ou en apportant un soutien plus direct sur le champ de bataille. Nous devons nous assurer que nos troupes disposent de tout ce dont elles ont besoin."
 USA_military_construction:0 "Construction militaire"
 USA_military_construction_desc:0 "Alors que les superpuissances menacent la paix mondiale, nos projets de travaux publics doivent être orientés vers les questions militaires aussi bien que civiles."
 USA_USACE_projects:0 "Projets USACE"
 USA_USACE_projects_desc:0 "Le Corps des ingénieurs de l'armée américaine aura pour tâche de jeter les bases de nombreux projets militaires futurs comme le monde n'en a jamais vu. Essais!"
 USA_arsenal_of_democracy:0 "Arsenal de la démocratie"
 USA_arsenal_of_democracy_desc:0 "Que nous choisissions ou non d'intervenir directement dans une guerre, les nations démocratiques doivent savoir que nous les armerons et les soutiendrons."
 USA_liberty_ships:0 "Navires de la Liberté"
 USA_liberty_ships_desc:0 "La production de masse de cargos doit accompagner nos développements industriels pour garantir que nos matériels et nos troupes arrivent sur les théâtres où ils sont nécessaires."
 USA_war_propaganda:0 "Propagande de guerre"
 USA_war_propaganda_desc:0 "Notre peuple ne veut pas envoyer ses enfants mourir dans une autre guerre, mais de nombreux politiciens voient la nécessité d'une intervention. La propagande visant à diaboliser l'ennemi et à appeler à un conflit ouvert n'est peut-être pas seulement un outil au service des tyrans."
 USA_war_plan_black:0 "Plan de guerre noir"
 USA_war_plan_black_desc:0 "Il est évident que la politique et l'expansionnisme allemands vont bien au-delà de toute mesure de bon sens. Il faut les arrêter avant que leur machine de guerre n'atteigne le point de non-retour."
 USA_embargo_germany:0 "Embargo Allemagne"
 USA_embargo_germany_desc:0 "L'Allemagne dépend du pétrole et d'autres ressources naturelles pour son effort de guerre. Leur couper l'accès est la moindre des choses."
 USA_destroyers_for_bases:0 "Destroyers pour bases"
 USA_destroyers_for_bases_desc:0 "Le Royaume-Uni a besoin de navires et nous devons protéger notre territoire. Contre le droit d'établir des bases militaires dans les territoires actuellement britanniques, nous pouvons échanger des destroyers, qui, espérons-le, seront également utilisés à bon escient."
 USA_destroyers_for_bases_tt:0 "§Y[USA.GetNameDef]§!: \n"
 USA_war_plan_white:0 "Plan de guerre blanc"
 USA_war_plan_white_desc:0 "La menace rouge ne peut pas être autorisée à se développer sans contrôle. Que ce soit de l'extérieur ou de l'intérieur, il n'y a pas de plus grande menace pour notre nation et le monde dans son ensemble."
 USA_embargo_USSR:0 "Embargo URSS"
 USA_embargo_USSR_desc:0 "Priver l'Union soviétique d'opportunités commerciales avec nous nous empêchera à la fois de soutenir ses efforts militaires et de prouver la supériorité de notre modèle économique."
 USA_war_plan_red:0 "Plan de guerre rouge"
 USA_war_plan_red_desc:0 "Après avoir semblé sur la voie du respect du peuple, nos anciens oppresseurs sont désormais en contradiction avec le vent du changement que nous avons accepté. L'Empire britannique montre ses vraies couleurs. Nous devons leur faire savoir où nous en sommes."
 USA_embargo_the_empire:0 "Embargo sur l'Empire"
 USA_embargo_the_empire_desc:0 "Bien qu'ils entretiennent de bonnes relations depuis longtemps, les Britanniques ont trahi les idéaux que nous espérions qu'ils aient appris à respecter. Il est temps de leur faire connaître les conséquences."
 USA_war_plan_orange:0 "Plan de guerre Orange"
 USA_war_plan_orange_desc:0 "Il n'y a pas de plus grande menace pour nous que les ambitions impérialistes du Japon. Leurs efforts pour s'étendre en Asie et dans le Pacifique les mettront rapidement en contradiction avec nos intérêts."
 USA_embargo_japan:0 "Embargo sur le Japon"
 USA_embargo_japan_desc:0 "Nous devons montrer au Japon que son agression ne sera ni acceptée ni aidée par les États-Unis. Un embargo sera la première étape pour contrecarrer leurs projets sur le Pacifique."
 USA_prepare_intervention:0 "Préparer l'intervention"
 USA_prepare_intervention_desc:0 "Grâce à des décisions diplomatiques et commerciales, notre position sur la scène internationale est passée de neutre et isolationniste à une position face aux agressions étrangères. Nos politiques militaires le refléteront à l'avenir."
 USA_extra_tech_team:0 "Équipe technique supplémentaire"
 USA_manhattan_project:0 "Projet Manhattan"
 USA_manhattan_project_desc:0 "Le développement de matériaux de substitution, un projet USACE à l'apparence innocente, sera finalement connu sous le nom de projet Manhattan. L'une des entreprises les plus secrètes et les plus dangereuses de l'histoire militaire, son objectif est de créer la première bombe atomique."
 USA_unholy_alliance:0 "Alliance impie"
 USA_unholy_alliance_desc:0 "Parfois, nous devons choisir nos ennemis. Souvent, le choix n'est pas facile. L'avenir pourra nous juger pour nous être tenus aux côtés d'un tyran, ou nous féliciter pour l'avoir sauvé de l'autre."
 USA_unholy_alliance_tt:0 "Stimule l'opinion et l'opinion commerciale avec l'Union soviétique ou l'Allemagne si elles sont en guerre, aux côtés du défenseur."
 USA_limited_intervention:0 "Intervention limitée"
 USA_limited_intervention_desc:0 "Il faudrait une agression extraordinaire pour nous entraîner dans une guerre de grande ampleur, mais après les récents développements, de nombreuses personnes sont librement disposées à contribuer à des conflits à l'étranger."
 USA_the_giant_wakes:0 "Le géant se réveille"
 USA_the_giant_wakes_desc:0 "Les nations se tournent vers nous pour protéger les valeurs de démocratie et de liberté. Le monde dans lequel est née l'Amérique non interventionniste n'existe plus et nous devons nous adapter en conséquence."
 USA_pearl_harbor_gambit:0 "Gambit de Pearl Harbor"
 USA_pearl_harbor_gambit_desc:0 "La base navale de Pearl Harbor est une cible facile pour les Japonais. En y basant une flotte, nous démontrerons notre puissance dans le Pacifique. Oseront-ils contester une démarche aussi audacieuse ?"
 USA_pearl_harbor_gambit_tt:0 "§YPendant que la concentration est active, le Japon aura la possibilité de lancer une attaque.§!"
 USA_cancel_pearl_harbor_gambit:0 "Annuler le Gambit de Pearl Harbor"
 USA_cancel_pearl_harbor_gambit_desc:0 "Stationner une flotte à Pearl Harbor met en danger la vie de nos marins. Nous ne prendrons pas le risque de provoquer une guerre avec le Japon."
 USA_air_war_plans_division:0 "Division des plans de guerre aérienne"
 USA_air_war_plans_division_desc:0 "Définir les bonnes priorités dans l'aviation ainsi que dans la production aéronautique nécessitera une planification à long terme. L'AWPD veillera à ce que nous disposions de plans matériels, organisationnels et stratégiques."
 USA_air_support:0 "Appui aérien"
 USA_air_support_desc:0 "La guerre aérienne doit avant tout être utilisée en conjonction avec d'autres opérations militaires."
 USA_strategic_bombing:0 "Bombardement stratégique"
 USA_strategic_bombing_desc:0 "La capacité d'exécuter des bombardements de précision nous permettra d'arrêter la machine de guerre de n'importe quelle nation dans son élan."
 USA_TAC:0 "Effort de bombardement tactique"
 USA_TAC_desc:0 "La construction d'avions conçus pour attaquer des cibles tactiques permettra à nos troupes d'avancer de manière plus sûre."
 USA_combined_bomber_offensive:0 "Offensive de bombardiers combinée"
 USA_combined_bomber_offensive_desc:0 "Avec une autre grande puissance à nos côtés, nous disposons d'avantages inattendus dans la recherche et l'application de bombardements offensifs à grande échelle."
 USA_fund_the_navy:0 "Financer la Marine"
 USA_fund_the_navy_desc:0 "Nous devons être capables de nous adapter à tout ce que nos ennemis nous lancent. Un financement accru des exercices navals mènera à une marine plus efficace, capable de surpasser tactiquement nos ennemis."
 USA_bureau_of_ships:0 "Bureau des navires"
 USA_bureau_of_ships_desc:0 "Nous regrouperons le Bureau de construction et de réparation et le Bureau d'ingénierie en une seule entité pour superviser les futurs développements navals."
 USA_battleship_primacy:0 "Primauté du cuirassé"
 USA_battleship_primacy_desc:0 "Avec la dénonciation par le Japon du Traité naval de Washington, nous pourrions être confrontés à une nouvelle course aux armements sur les océans. Nous veillerons à disposer du plus grand nombre et des meilleurs cuirassés."
 USA_advanced_mahanian_doctrine:0 "Doctrine mahanienne avancée"
 USA_advanced_mahanian_doctrine_desc:0 "L'influence d'Alfred Thayer Mahan sur la guerre navale ne peut guère être sous-estimée. S'appuyer sur ses travaux nous permettra de faire bon usage des cuirassés, qu'il considère comme un facteur décisif."
 USA_carrier_primacy:0 "Primauté du transporteur"
 USA_carrier_primacy_desc:0 "La puissance aérienne sera nécessaire dans les batailles à venir, et le moyen le plus pratique d'étendre sa portée est l'utilisation de porte-avions. Nous devons créer des modèles plus avancés et spécialisés."
 USA_bureau_of_aeronautics:0 "Bureau de l'aéronautique"
 USA_bureau_of_aeronautics_desc:0 "Pour répondre aux besoins de développement de l'aéronavale, le Bureau de l'aéronautique, responsable de ces questions depuis des décennies, devra être élargi."
 USA_escort_effort:0 "Effort d'escorte"
 USA_escort_effort_desc:0 "Les sous-marins constituent un danger pour nos convois marchands. En nous concentrant sur le développement de nouveaux modèles de destroyers, nous pourrons mener une guerre anti-sous-marine de manière efficace."
 USA_convoy_tactics:0 "Tactiques de convoi"
 USA_convoy_tactics_desc:0 "La protection de nos navires commerciaux n'est pas seulement une question d'escortes et de renseignements efficaces, mais également de choix tactiques quant à la manière d'organiser nos routes et nos routines commerciales."
 USA_amphibious_operations:0 "Opérations amphibies"
 USA_amphibious_operations_desc:0 "À moins que nos pires cauchemars ne se réalisent, cette guerre ne prendra pas fin sur le sol américain. Des atterrissages bien exécutés devront faire partie du chemin vers la victoire."
 USA_expand_the_USMC:0 "Développer l'USMC"
 USA_expand_the_USMC_desc:0 "Le Corps des Marines des États-Unis a joué un rôle décisif dans de nombreuses guerres passées et pourrait être plus pertinent que jamais pour nos campagnes amphibies. Sempre fidèle!"
 USA_reinforce_monroe_doctrine:0 "Réaffirmer la doctrine Monroe"
 USA_reinforce_monroe_doctrine_desc:0 "Datant de plus de 100 ans, la doctrine Monroe codifiait l'intervention américaine en cas de tentatives européennes de colonisation des Amériques, mais restait en dehors des affaires européennes. Renforcer notre rôle de gardien de la paix sur ces continents améliorera notre influence dans la région."
 USA_carribean_sphere:0 "Sphère caribéenne"
 USA_carribean_sphere_desc:0 "Les îles des Caraïbes offrent l'endroit idéal pour lancer des frappes contre notre côte orientale ou le canal de Panama. Nous devons donc bien sûr préciser qu'aucune prise de contrôle hostile de la région ne sera autorisée."
 USA_central_america:0 "Amérique centrale"
 USA_central_america_desc:0 "Il serait impensable de laisser une quelconque puissance étrangère prendre le contrôle, voire menacer, le canal de Panama. Ainsi, nous garantirons l'indépendance de toutes les nations d'Amérique centrale."
 USA_the_neighbors:0 "Les voisins"
 USA_the_neighbors_desc:0 "Nous devons avant tout veiller à la sécurité des pays les plus proches de nous. Plutôt que de laisser l'ennemi traverser nos voisins pour nous atteindre, ils nous traverseront s'ils traversent nos voisins."
 USA_south_america:0 "Amérique du Sud"
 USA_south_america_desc:0 "Les empires coloniaux ne doivent plus jamais pouvoir s'étendre en Amérique du Sud, nous garantirons l'indépendance de nos frères du Sud pour assurer leur sécurité."
 USA_pax_americana:0 "Pax Américaine"
 USA_pax_americana_desc:0 "La paix en Amérique doit être maintenue. Nous avons la force de garantir que les petites querelles entre nations voisines ne dégénèrent pas. Une guerre à nos portes est exactement ce que veulent nos ennemis, et nous devons faire tout notre possible pour l'empêcher."
 USA_pax_americana_tt:0 "@USA §YLes États-Unis§! peuvent intervenir dans les guerres entre pays américains"
 USA_black_chamber:0 "Opération Chambre Noire"
 USA_black_chamber_complete:0 "§RCLASSÉ§!"
 USA_black_chamber_desc:0 "Nous disposons d'informations sur des activités politiques dans un certain nombre de pays américains qui ne correspondent pas à nos intérêts. Heureusement, nous avons établi un réseau de propagande clandestin et sommes prêts à pousser ces pays dans notre direction. C'est quelque chose que nous devons faire pour garantir que nous ne soyons pas menacés chez nous."
 USA_preemptive_intervention:0 "Intervention préventive"
 USA_preemptive_intervention_desc:0 "Nous ne pouvons plus rester les bras croisés et regarder les pays voisins construire des outils de guerre destinés à nous supprimer, nous ou nos alliés. Nous devons intervenir pour le plus grand bien de notre puissant pays et du monde."
 SOV_nkvd_upgrade_tooltip:1 "§YLe NKVD§! est désormais plus étroitement intégré dans notre armée, garantissant ainsi un moral élevé des soldats et une confiance dans le Parti.\n"
 ger_sov_buddies_tooltip_2:0 "Cela dissoudra [Root.GetFactionName] et créera la faction §YBerlin-Moscou§!.\n"
 ger_sov_buddies_tooltip:1 "§RSi les Soviétiques acceptent notre offre, nous subirons une certaine perte de stabilité en raison de ce changement de politique. Il va sans dire que nos camarades fascistes et les pouvoirs démocrates seront également bouleversés par cette tournure des événements.§!\n"
 purged_kalinin:0 " Purgé par Staline"
 purged_khrushchev:0 " Purgé par Staline"
 purged_yezhov:0 " Purgé par Staline"
 purged_beria:0 " Purgé par Staline"
 purge_1_group_a:0 " Purgé par Staline"
 purge_1_group_b:0 " Purgé par Staline"
 purge_2_group_a:0 " Purgé par Staline"
 purge_2_group_b:0 " Purgé par Staline"
 counter_purge:0 " Purgé par Trotsky"
 SOV_war_since_purge:0 "A eu une guerre depuis qu'il a terminé La Grande Purge"
 FRA_metropolitan_france:2 "Investir en France métropolitaine"
 FRA_metropolitan_france_tt:0 "Pas assez d'emplacements de construction pour §YInfrastructures§! en France métropolitaine"
 FRA_metropolitan_france_desc:0 "La Métropole doit toujours passer en premier. Nous pouvons commencer par améliorer notre infrastructure pour créer des emplois et permettre un déploiement plus rapide des troupes."
 FRA_algerie_france:2 "Investir en France algérienne"
 FRA_algerie_france_tt:0 "Pas assez d'emplacements de construction pour §YInfrastructure§! dans la France coloniale"
 FRA_algerie_france_desc:0 "L'Europe traverse une période dangereuse. Nous devrions nous concentrer sur l'amélioration de nos terres au sud et nous assurer que nous pouvons toujours soutenir le continent."
 FRA_industrial_expansion:0 "Expansion industrielle"
 FRA_industrial_expansion_tt:0 "Pas assez d'emplacements de construction pour §YUsines Civiles§! en France Métropolitaine"
 FRA_industrial_expansion_desc:0 "Nous avons besoin d'une présence industrielle plus forte chez nous. Nous avons beaucoup de main-d'oeuvre prête, mais nous avons besoin de plus de lignes d'usine."
 FRA_colonial_industry:0 "Industrie coloniale"
 FRA_colonial_industry_tt:0 "Pas assez d'emplacements de construction pour §YUsines civiles§! en France coloniale"
 FRA_colonial_industry_desc:1 "Nous devrions nous concentrer sur nos industries dans les colonies. Si les tensions s'accentuent en Europe, nous disposerons toujours d'une capacité industrielle hors de portée des bombardiers ennemis."
 FRA_military_factories:0 "Usines militaires"
 FRA_military_factories_tt:0 "Pas assez d'emplacements de construction pour §YUsine Militaire§! en France Métropolitaine"
 FRA_military_factories_desc:1 "Notre machine de guerre est en retard en termes de capacité. Nous devons nous concentrer sur la production d'équipements militaires sur notre territoire pour garantir que nos forces reçoivent constamment de nouveaux équipements."
 FRA_colonial_military_factories:0 "Usines militaires coloniales"
 FRA_colonial_military_factories_tt:0 "Pas assez d'emplacements de construction pour §YUsine militaire§! en France coloniale"
 FRA_colonial_military_factories_desc:0 "Placer notre production militaire hors d'Europe garantit que même si l'ennemi prend le contrôle de notre espace aérien, nous maintiendrons un flux constant d'équipements vers nos troupes de première ligne."
 FRA_extra_research_slot:2 "Soutenez les grandes écoles"
 FRA_extra_research_slot_desc:0 "De jeunes esprits prometteurs surgissent partout. Nous devons leur fournir des installations pour mener leurs recherches. Les progrès technologiques peuvent nous donner un avantage là où nous en avons le plus besoin."
 FRA_nuclear_effort:0 "Effort nucléaire"
 FRA_nuclear_effort_desc:0 "Les premiers tests en science nucléaire ont donné des résultats prometteurs. Exploiter sa puissance peut nous donner une arme qui ne ressemble à rien de ce que l'humanité a vu."
 FRA_jet_effort:0 "Effort de jet"
 FRA_jet_effort_desc:0 "Le combat aérien est avant tout une question de mobilité. Le moteur à réaction est une avancée si puissante que les pilotes ennemis sembleront rester immobiles pendant que nous les arrachons du ciel."
 FRA_extra_research_slot_2:2 "Former le Centre National de Recherche"
 FRA_extra_research_slot_2_desc:0 "De jeunes esprits prometteurs surgissent partout. Nous devons leur fournir des installations pour mener leurs recherches. Les progrès technologiques peuvent nous donner un avantage là où nous en avons le plus besoin."
 FRA_defensive_focus:0 "Concentration défensive"
 FRA_defensive_focus_desc:0 "Dans des moments comme ceux-ci, il est préférable de renforcer nos défenses. S'il y a des menaces, qu'elles viennent à nous afin que nous puissions y faire face sur notre propre territoire. Nous avons le candidat idéal pour diriger notre armée, tout ce dont nous avons besoin c'est de votre parole."
 FRA_aggressive_focus:0 "Concentration agressive"
 FRA_aggressive_focus_desc:0 "Nous ne pouvons pas rester les bras croisés alors que des ennemis envahissent nos frontières. Et nous ne pouvons pas laisser nos alliés se débrouiller seuls dans un scénario de guerre. Préparez notre armée ! Gamelin est l'homme de la situation."
 FRA_fortification_focus:0 "Focus sur les fortifications"
 FRA_fortification_focus_desc:0 "Aussi critiques qu'aient été nos forts, nous devons trouver des moyens de les construire plus efficacement. La ligne Maginot a été un puissant moyen de dissuasion pour les forces ennemies, nous pourrions utiliser la sécurité de davantage de défenses comme celle-ci."
 FRA_alpine_forts:0 "Forts alpins"
 FRA_alpine_forts_desc:0 "Les Italiens ne franchiront pas la frontière aussi facilement une fois que nous aurons fini de couvrir les Alpes avec notre nouvelle ligne de défense. Nous aurons le temps de réagir et de renforcer notre position."
 FRA_extend_the_maginot_line:0 "Prolonger la ligne Maginot"
 FRA_extend_the_maginot_line_desc:0 "Nous ne pouvons pas compter sur la Belgique pour tenir bon, car si elle laisse passer les armées ennemies, nous pourrions avoir des ennuis. Le prolongement de la ligne Maginot est crucial pour empêcher les armées indésirables d'entrer en France !"
 FRA_infantry_focus:0 "Levée en masse"
 FRA_infantry_focus_desc:0 "Tous les hommes et femmes capables de se battre le feront. La production massive d'armes réduira les coûts. Nous mettrons un fusil entre les mains de tout le monde."
 FRA_artillery_focus:0 "Grande Batterie"
 FRA_artillery_focus_desc:0 "Notre artillerie formera une seule unité puissante pour concentrer le feu sur des points spécifiques. Une volée à la fois et nous affaiblirons la ligne ennemie et nous frayerons un chemin s'il le faut !"
 FRA_heavy_armor_focus:0 "Char de Bataille"
 FRA_heavy_armor_focus_desc:0 "Les chars de combat sont la voie à suivre pour l'armée française. Nous voulons contrôler le champ de bataille et pour cela nous aurons besoin de nouveaux chars puissants !"
 FRA_motorized_focus:0 "Mise au point motorisée"
 FRA_motorized_focus_desc:0 "Trouver de meilleures façons de construire nos véhicules d'infanterie améliorera notre capacité à soutenir et à renforcer les lignes de front."
 FRA_mechanized_focus:0 "Mise au point mécanisée"
 FRA_mechanized_focus_desc:0 "Les véhicules blindés jouent un rôle de plus en plus important dans la guerre. Bien qu'ils soient légèrement moins intimidants que votre char moyen, ils nous donnent un avantage en matière de communication, de commandement, de transport et de guerre urbaine. "
 FRA_light_medium_armor:0 "Automitrailleuses"
 FRA_light_medium_armor_desc:0 "Selon la loi, l'infanterie contrôle toutes les forces de chars. Les « véhicules » de cavalerie ou Automitrailleuses plus légers et plus rapides sont mieux adaptés aux déplacements et peuvent toujours infliger des dégâts avec leurs armes montées."
 FRA_army_reform:0 "Réforme de l'armée"
 FRA_army_reform_desc:0 "Aucune unité d'infanterie ou aucun char de haute technologie ne nous fera gagner la guerre à eux seuls. Nous devons concentrer nos efforts sur le développement de nos capacités tactiques et stratégiques. Avec les bonnes personnes au poste, nous pouvons évoluer en tant qu'armée."
 FRA_navy_focus:0 "Focus sur la Marine"
 FRA_navy_focus_tt:0 "Pas assez d'emplacements de construction pour la base navale §Y§!"
 FRA_navy_focus_desc:0 "Si nous envisageons de développer notre marine, la première étape consiste à améliorer et à agrandir nos bases navales. Nos navires uniques nécessitent une attention constante pour rester prêts au combat à tout moment."
 FRA_improved_screen_ships:0 "Navires à écran améliorés"
 FRA_improved_screen_ships_desc:0 "Les destroyers et les croiseurs plus légers jouent un rôle clé dans la défense de nos cuirassés ou porte-avions plus lourds. Si nous perdons notre ligne de défense en mer, nous risquons de mettre en danger tous les navires et tous les hommes. Nous devons nous assurer que nos navires sont construits avec les dernières technologies."
 FRA_capital_ship_focus:0 "Focus sur les navires capitaux"
 FRA_capital_ship_focus_desc:0 "Améliorer la conception de nos cuirassés apporterait de grands avantages tactiques. Avec leur portée et leur puissance incontestées, personne ne pourra distancer leurs armes."
 FRA_carrier_focus:0 "Focus sur le transporteur"
 FRA_carrier_focus_desc:0 "Les théoriciens navals ont attiré notre attention sur nos porte-avions obsolètes. Ils ont des suggestions sur la façon dont les transporteurs peuvent être davantage utilisés si le développement est poussé dans la bonne direction. De réels progrès ne peuvent être réalisés sans notre plein soutien."
 FRA_initiate_government_reform:0 "Réforme du gouvernement"
 FRA_initiate_government_reform_desc:0 "Le monde est devenu dangereux. Nous ne pouvons plus nous laisser lier par nos propres querelles. Il est temps de responsabiliser nos politiques et d'avancer pour le bien de la France."
 FRA_support_the_left:0 "Soutenez la gauche"
 FRA_support_the_left_desc:0 "Le Komintern se renforce. Il est temps de montrer que nos intérêts peuvent être alignés et de soutenir nos organisations communistes."
 FRA_leftist_rhetoric:0 "Rhétorique de gauche"
 FRA_leftist_rhetoric_desc:0 "L'objectif est clair. L'égalité pour tous. Nous ne voulons pas d'intérêts capitalistes dans la politique française. Il est impératif que nous fournissions des conditions optimales pour que nos organisations communistes puissent prospérer."
 FRA_scw_intervention_republicans:0 "Intervention républicaine"
 FRA_scw_intervention_republicans_desc:0 "L'Espagne républicaine a besoin de notre aide ! \nQuiconque est prêt à se battre pour cette cause devrait y être autorisé. Nous ne pouvons pas permettre à un autre régime fasciste de gagner du terrain."
 FRA_national_mobilization:0 "Mobilisation nationale"
 FRA_national_mobilization_desc:0 "Nous avons enfin un gouvernement capable d'agir. Il est désormais temps de renforcer notre armée et de nous préparer à combattre pour la France."
 FRA_humanite_unie:0 "Humanité Unie"
 FRA_humanite_unie_desc:0 "Les gros banquiers et les démagogues avides de pouvoir renforcent leur emprise sanglante sur le monde. Chaque jour qui passe, nous voyons des hommes libres réduits en esclavage et le monde plongé davantage dans la crise, créée par l'avidité de l'individu. Les idéaux français sont plus que jamais nécessaires ! L'humanité a besoin de nous et nous devons l'unir !"
 FRA_join_comintern:0 "Rejoignez le Komintern"
 FRA_join_comintern_desc:0 "Avec des ennemis partout où nous nous tournons, nous devons renforcer notre position auprès de puissants alliés. Nos liens avec le Komintern se sont renforcés et il est temps de nous consacrer pleinement à leur cause."
 FRA_support_status_quo:0 "Soutenir le statu quo"
 FRA_support_status_quo_desc:0 "La France est le berceau et la protectrice de la liberté et doit le rester. Si nous souhaitons un jour retrouver l'unité, nous devons alors stabiliser notre démocratie avant qu'elle ne s'effondre."
 FRA_little_entente:0 "Petite Entente"
 FRA_little_entente_desc:0 "La Petite Entente, une alliance formée après la Grande Guerre pour empêcher l'agression de l'Autriche et de la Hongrie contre leurs voisins, était soutenue par la France, mais a maintenant commencé à s'effondrer. Au lieu de consolider nos liens avec la Grande-Bretagne, nous devrions prendre l'initiative de restaurer et de consolider cette faction, en commençant par ses fondateurs en Tchécoslovaquie."
 FRA_go_with_britain:0 "Partir avec la Grande-Bretagne"
 FRA_go_with_britain_desc:0 "La Russie ayant changé à jamais, seules la France et la Grande-Bretagne restent de l'ancienne Triple Entente. Si l'histoire est vouée à se répéter, nous devons veiller à ce que ces deux nations, bastions de la démocratie et de la liberté en Europe, restent alliées."
 FRA_strengthen_government_support:0 "Renforcer le gouvernement"
 FRA_strengthen_government_support_desc:0 "Nous avons fait des projets pour l'année à venir qui répondront aux souhaits des gens de toutes les régions de France. Montrez-leur que nous sommes capables d'agir et dignes de gouverner la France, pour que nous puissions à nouveau rester unis."
 FRA_defensive_strategems:0 "Stratagèmes défensifs"
 FRA_defensive_strategems_desc:0 "Si nous voulons que le peuple français fasse la guerre à notre place, il est plus important que jamais que nous ayons une direction claire. Nous devons cesser de nous battre entre nous et nous battre pour la France et pour « Liberté, égalité, fraternité »."
 FRA_invite_yugoslavia:0 "Inviter la Yougoslavie"
 FRA_invite_yugoslavia_desc:0 "La Yougoslavie a suffisamment de soucis pour ne pas avoir à se soucier de voisins expansionnistes. Les ramener dans la Petite Entente serait un grand service pour eux et pour nous-mêmes."
 FRA_invite_romania:0 "Inviter la Roumanie"
 FRA_invite_romania_desc:0 "La démocratie roumaine est fragile, prise entre ses factions fascistes internes et le communisme soviétique. Les intégrer à la Petite Entente leur permettra de conserver leur stabilité avec notre soutien."
 FRA_polish_guarantee:0 "Garantie polonaise"
 FRA_polish_guarantee_desc:0 "Les diplomates polonais ont exprimé leurs inquiétudes face aux tensions à leurs frontières. Une garantie de notre puissante nation devrait dissuader quiconque projette une invasion."
 FRA_czech_guarantee:0 "Garantie tchèque"
 FRA_czech_guarantee_desc:0 "La tension monte à la frontière tchèque. Nous ne pouvons pas permettre à des nations expansionnistes de prendre le dessus sur une nation libre et démocratique. Les Tchèques doivent rester un peuple libre. Avec une garantie de notre part, quiconque planifie une invasion y réfléchira à deux fois."
 FRA_revise_versailles:0 "Réviser Versailles"
 FRA_revise_versailles_desc:0 "Les Allemands ignorent déjà les réparations prévues par le traité de Versailles, démontrant que la France n'inspire plus le respect. Au contraire, nous avons le droit d'exiger davantage pour les vies perdues pendant la Grande Guerre, mais un traité juste nécessiterait une France forte, une France nouvelle, pour le faire respecter."
 FRA_support_the_right:0 "Soutenez le droit"
 FRA_support_the_right_desc:0 "La France a toujours été une nation forte et fière, mais le manque d'action du gouvernement a divisé la population. Nous devons unir la France et affirmer notre supériorité et notre force pour éviter de succomber à la décadence."
 FRA_right_wing_rhetoric:0 "Rhétorique de droite"
 FRA_right_wing_rhetoric_desc:0 "Nous devons nous efforcer d'atteindre tous les Français et d'élever leur esprit national. Montrez-leur que nous pouvons être les dirigeants puissants dont ils ont besoin et ils deviendront de fiers citoyens de notre glorieuse nation."
 FRA_scw_intervention_nationalists:0 "Intervention nationaliste"
 FRA_scw_intervention_nationalists_desc:0 " Les nationalistes gagnent enfin du terrain en Espagne. Leur cause est juste et quiconque est prêt à se battre pour eux devrait y être autorisé."
 FRA_army_of_aggression:0 "Armée d'agression"
 FRA_army_of_aggression_desc:0 "Nous ne pouvons plus rester derrière un mur obsolète pendant que nos ennemis sévissent à travers l'Europe. Il est temps de renforcer notre armée et de repousser nos frontières pour garantir que la France continue d'être une grande nation."
 FRA_france_first:0 "La France d'abord"
 FRA_france_first_desc:0 "Nous sommes la France ! Vainqueurs de la Grande Guerre ! Sauveurs de l'Europe ! Nous abritons les plus grands penseurs que le monde ait jamais connu. Trop de pays cherchent à plonger le monde dans le chaos. Nous sommes nécessaires et nous répondrons à l'appel. Nous prendrons la barre, affronterons la tempête et dirigerons l'humanité vers la sécurité sous notre règne !"
 FRA_woo_italy:0 "Courtiser l'Italie"
 FRA_woo_italy_desc:0 "L'Italie a le potentiel pour devenir une nation puissante. Grâce au leadership fort de Mussolini, le peuple italien est uni et prêt à se battre pour la bonne cause. Que cette cause soit la nôtre."
 FRA_dismantle_the_democracies:0 "Démanteler les démocraties"
 FRA_dismantle_the_democracies_desc:0 "La nouvelle alliance démocratique [GER.GetAdjective] en Europe centrale menace notre nouvelle position. Nous devons agir maintenant, avant qu'ils ne deviennent plus puissants."
 FRA_join_germany:0 "Rejoignez l'Allemagne"
 FRA_join_germany_desc:0 "Le Reich allemand devient une force avec laquelle il faut compter. Leur vision d'un avenir meilleur peut être alignée sur nos intérêts. Nous devons les soutenir et, une fois la poussière retombée, la France obtiendra la part qui lui revient de l'Europe."
 FRA_naval_doctrine:0 "Doctrine navale"
 FRA_naval_doctrine_desc:0 "Les progrès récents dans la conception des navires ont ouvert de nouvelles options en matière de manoeuvres tactiques et stratégiques. Avant de prendre des risques avec ces nouvelles théories, nous devons les tester correctement et solidifier les plans."
 FRA_air_focus:0 "Concentration aérienne"
 air_focus_bypass_tt:0 "Pas assez d'emplacements de construction pour la base aérienne §Y§!"
 FRA_air_focus_desc:0 "Le temps est venu de développer notre force aérienne ! Des plans ont déjà été élaborés pour commencer la construction de nouvelles bases aériennes afin de soutenir une forte augmentation du personnel et des avions."
 FRA_cas_focus:0 "Focus CAS"
 FRA_cas_focus_desc:0 "Les avions qui soutiennent nos forces terrestres et nos navires ont constitué un complément très efficace pour un investissement relativement faible. Ces avions bénéficient désormais de plusieurs améliorations suggérées. Nos ingénieurs peuvent développer la prochaine génération d'avions de soutien."
 FRA_fighter_focus:0 "Concentration du combattant"
 FRA_fighter_focus_desc:0 "Une ingénierie civile révolutionnaire peut être appliquée à nos chasseurs pour améliorer leur vitesse, leur portée et leur altitude maximale. Nous devons nous concentrer sur cela si nous voulons suivre les progrès réalisés par d'autres."
 FRA_bomber_focus:0 "Focus sur les bombardiers"
 FRA_bomber_focus_desc:0 "L'appui aérien constitue un élément important de nos capacités défensives et offensives. Si nous concentrons nos efforts sur le développement de bombardiers rapides, plus agiles et plus précis, nous conserverons un avantage dans toutes les batailles terrestres."
 FRA_heavy_fighter_focus:0 "Focus sur les chasseurs lourds"
 FRA_heavy_fighter_focus_desc:0 "Nos chasseurs lourds doivent être capables de soutenir les bombardiers les plus vulnérables. Cela nécessite un armement plus lourd et une portée plus longue au prix d'une certaine vitesse."
 FRA_air_doctrine:0 "Doctrine aérienne"
 FRA_air_doctrine_desc:0 "Nous avons acquis suffisamment d'expérience pour tester plus rapidement de nouvelles théories en matière de guerre aérienne. Cela nous permettra d'explorer de nouvelles possibilités tactiques et stratégiques. Le combat aérien est la clé de la guerre moderne."
 FRA_heavy_bomber_focus:0 "Focus sur les bombardiers lourds"
 FRA_heavy_bomber_focus_desc:0 "Les bombardiers lourds modernes seront armés pour gérer seuls des escarmouches aériennes de moindre envergure. Si nous permettons à nos ingénieurs de se concentrer sur le développement des technologies les plus récentes, nous aurons de meilleures chances de détruire les installations de production ennemies."
 FRA_naval_bomber_focus:0 "Focus sur les bombardiers navals"
 FRA_naval_bomber_focus_desc:0 "Les navires se sont révélés exceptionnellement vulnérables aux avions. Nous devons continuer à améliorer leur technologie pour nous assurer de garder une longueur d'avance sur toute contre-mesure."
#  limited_rearmament_focus:0 "Limited Rearmament"
#  limited_rearmament_focus_desc:1 "[Root.GetLimitedRearmamentDesc]"
 ENG_LIMITED_REARMAMENT_HISTORICAL:0 "Les récentes agitations en Allemagne et dans d'autres puissances fascistes à travers le monde suggèrent que nous ne connaîtrons peut-être pas la paix à notre époque. En guise de préparation, nous devrions commencer à mettre les pièces en mouvement pour notre propre réarmement si la situation s'aggrave."
 ENG_LIMITED_REARMAMENT_AHISTORICAL:0 "Notre nouvelle approche de la politique intérieure et des relations internationales nécessite un soutien militaire sain. En préparation, nous devrions commencer à développer notre industrie civile, afin qu'elle puisse constituer une base stable pour une future expansion de notre industrie militaire, en temps voulu."
 ENG_motorized_focus:0 "Une armée motorisée"
 ENG_motorized_focus_desc:0 "Récemment, l'armée a expérimenté des unités d'infanterie entièrement motorisées. Pour l'instant, ils n'ont pas encore formé de divisions entièrement motorisées, mais, en s'adressant au secrétaire d'État à la Guerre, cela pourrait bientôt être possible."
#  ENG_tank_focus:1 "[Root.GetRoyalTankRegimentName]"
#  ENG_tank_focus_desc:1 "[Root.GetRoyalTankRegimentDesc]"
 ENG_ROYAL_TANK_REGIMENT_NAME_HISTORICAL:0 "Régiment royal de chars"
 ENG_ROYAL_TANK_REGIMENT_NAME_COMMUNIST:0 "Régiment de chars de la Garde républicaine"
 ENG_ROYAL_TANK_REGIMENT_DESC_HISTORICAL:0 "La Grande-Bretagne a inventé le char et le Royal Tank Regiment devrait donc être équipé des meilleurs chars du monde, mais ce n'est pas le cas actuellement. Le Comité de développement des véhicules spéciaux propose de rechercher et de développer une conception moderne pour maintenir la Grande-Bretagne à l'avant-garde du développement des chars."
 ENG_ROYAL_TANK_REGIMENT_DESC_COMMUNIST:0 "La Grande-Bretagne a inventé le char, et le régiment de chars de la Garde républicaine devrait donc être équipé des meilleurs chars du monde, mais ce n'est pas le cas actuellement. Le Comité de développement des véhicules spéciaux propose de rechercher et de développer une conception moderne pour maintenir la Grande-Bretagne à l'avant-garde du développement des chars."
 uk_empire_focus:0 "Renforcer l'Empire"
 uk_empire_focus_desc:0 "Notre Empire est vaste et, malgré notre puissance, faiblement défendu. Pour lutter contre cela, nous devons encourager le patriotisme impérial dans tout le royaume."
 uk_service_focus:0 "Service à l'étranger"
 uk_service_focus_desc:0 "En effectuant une rotation du personnel des forces armées dans les stations coloniales et de retour chez eux, ils peuvent se renseigner sur les conditions sur différents fronts, acquérir de l'expérience et la partager avec leurs camarades restés chez eux."
 uk_mediterranean_focus:0 "Bastion Méditerranéen"
 uk_mediterranean_focus_desc:0 "La route à travers la Méditerranée constitue un raccourci d'une importance vitale vers et depuis l'Inde. Il est donc de la plus haute importance de le garder ouvert et entre nos mains."
 uk_rock_focus:0 "Fortifier le rocher"
 uk_rock_focus_desc:0 "En plus de contrôler l'entrée de la Méditerranée, Gibraltar constitue un port solidement défendu à partir duquel les navires peuvent opérer à la fois dans l'Atlantique et en Méditerranée. Il est donc impératif qu'il soit fortement surveillé."
 uk_greece_focus:0 "Contraindre la Grèce"
 uk_greece_focus_desc:0 "Il est dans notre intérêt d'avoir des droits d'ancrage en Grèce et, franchement, les Grecs ne sont pas en position de nous refuser."
 uk_malta_focus:0 "Fortifier Malte"
 uk_malta_focus_desc:0 "Malte occupe une excellente position dans la Méditerranée centrale, une étape vitale le long de notre ligne de vie à travers l'Égypte et le canal de Suez vers l'Inde et l'Extrême-Orient. Le temps passé à le fortifier plus fortement ne pourrait jamais être perdu."
 ENG_mot_focus_tooltip:0 "Nous pouvons désormais déployer des divisions d'infanterie motorisées."
 uk_canada_focus:0 "Développement au Canada"
 uk_canada_focus_desc:0 "Un investissement dans l'industrie et les chantiers navals du Canada stimulera leur économie et leur permettra d'apporter une plus grande contribution en cas de guerre."
 uk_australia_focus:0 "Développement en Australie"
 uk_australia_focus_desc:0 "Un investissement dans les chantiers navals et l'industrie australiens stimulera leur économie et leur permettra d'apporter une plus grande contribution en cas de guerre."
 uk_protect_suez:0 "Protéger Suez"
 uk_protect_suez_desc:0 "Le contrôle du canal de Suez fait partie des moyens par lesquels l'Empire britannique conserve sa maîtrise de la mer. Perdre cette région serait désastreux. Des mesures doivent être prises pour le fortifier."
 uk_balkan_strategy:0 "Stratégie balkanique"
 uk_balkan_strategy_desc:0 "De nombreux pays des Balkans sont pro-britanniques et voient comme nous la même menace venant de l'Europe centrale. Si nous saisissons l'opportunité et les soutenons rapidement, nous pouvons garantir leur loyauté, mais au prix de la colère de leurs voisins revanchards."
 uk_new_zealand_focus:0 "Développer la Nouvelle-Zélande"
 uk_new_zealand_focus_desc:0 "La Nouvelle-Zélande conserve des liens étroits avec notre nation et a mis en garde contre la menace fasciste. Leur contribution en cas de guerre est certaine et nous devrions les aider à se préparer en conséquence."
 uk_south_africa_focus:0 "Développer l'Afrique du Sud"
 uk_south_africa_focus_desc:0 "La situation politique en Afrique du Sud est incertaine. Nous ne pouvons pas être entièrement sûrs qu'ils soutiendront notre effort de guerre, mais en les aidant à renforcer leur industrie, nous pouvons espérer accroître le soutien à la cause britannique."
 FRA_strengthen_government_support_tooltip:0 "L'idée du « Renforcement du soutien gouvernemental » a fait son temps."
 ITA_victoryinETH:0 "Triomphe en Afrique"
 ITA_victoryinETH_desc:0 "L'échec de la première guerre italo-éthiopienne a entaché l'honneur italien pendant 40 ans, en remportant la victoire maintenant que cette tache sera enlevée et que la force de la volonté de fer du fascisme sera prouvée !"
 USA_reinforce_monroe_doctrine_tt:0 "Augmente l'opinion commerciale avec toutes les nations américaines.\n"
 1939_bookmark_threat:0 "Expansionnisme fasciste récent"
 USA_civil_war_fired:0 "La Seconde Guerre civile américaine a commencé."
 USA_anti_imperialism:0 "Anti-impérialisme"
 USA_anti_imperialism_desc:0 "L'Amérique a toujours été l'ennemie des oppresseurs impérialistes, mais il est évident que la plupart des soi-disant démocraties sont prêtes à maintenir ces institutions en vie aussi longtemps qu'elles en bénéficient. Les révolutionnaires de l'Union soviétique sont de meilleurs alliés."
 USA_fascist_menace:1 "La menace prussienne"
 USA_fascist_menace_desc:1 "Le Traité de Versailles et les sanctions économiques n'ont pas arrêté l'Allemagne, et le militarisme prussien relève une fois de plus sa vilaine tête agressive. L'Allemagne doit être à nouveau vaincue et placée sous notre contrôle, du moins pour le moment."
 USA_crusade_against_communism:0 "Croisade contre le communisme"
 USA_crusade_against_communism_desc:0 "La Terreur rouge est de loin la pire menace à laquelle le monde ait jamais été confronté. Par tous les moyens nécessaires, l'idéologie destructrice émanant de l'Union soviétique doit être coupée à son origine, et c'est nous qui le ferons."
 USA_strike_at_the_empire:0 "Frapper l'Empire"
 USA_strike_at_the_empire_desc:0 "La véritable menace pour la liberté dans le monde, ce sont les empires coloniaux construits par les superpuissances européennes. Ils doivent être écrasés et leurs populations libérées, à commencer par l'Empire britannique dont nous nous sommes autrefois libérés."
 USA_defense_of_the_pacific:0 "Défense du Pacifique"
 USA_defense_of_the_pacific_desc:0 "Le gouvernement japonais est au-delà de tout espoir, son expansionnisme menaçant à la fois notre peuple et ses voisins asiatiques. La nation doit être placée sous administration américaine pour la réformer et l'empêcher de répéter ses erreurs."
 ENG_home_defence:0 "Défense intérieure"
 ENG_home_defence_desc:0 "Un vaste empire ne sert à rien si nous ne pouvons pas protéger le peuple britannique. Nous devons concentrer nos efforts sur la sécurité des îles britanniques."
 ENG_issue_gasmasks:0 "Émettre des masques à gaz"
 ENG_issue_gasmasks_desc:0 "Le monde devient chaque jour plus dangereux. Nous devons protéger la population civile de toute attaque au gaz toxique. La Grande-Bretagne respire tranquillement."
 ENG_military_training_act:0 "Loi sur la formation militaire"
 ENG_military_training_act_desc:0 "La Grande Guerre a donné à notre peuple l'impression qu'il n'aurait plus à se battre. Alors que le monde devient de plus en plus dangereux, nous devons veiller à ce que tous les jeunes hommes capables reçoivent une formation militaire de base."
 ENG_embargo_germany:0 "Embargo Allemagne"
 ENG_embargo_germany_desc:0 "Le réarmement allemand est une insulte et une grande menace pour la paix mondiale. Nous ne leur fournirons pas les ressources dont ils ont besoin pour alimenter leur machine de guerre."
 ENG_war_with_germany:0 "Guerre avec l'Allemagne"
 ENG_war_with_germany_desc:0 "Les Allemands ne nous laissent pas d'autre choix. Pour le bien du monde libre et de l'avenir de nos enfants. L'heure est à la guerre."
 ENG_swedish_intervention:0 "Intervention suédoise"
 ENG_swedish_intervention_desc:0 "Les mouvements suédois contre la démocratie ont acquis une influence inquiétante. Nous ne pouvons pas risquer que l'acier suédois finisse sous forme d'armes entre les mains de nos ennemis. Les Suédois resteront libres, mais nous devons assurer une certaine influence sur leur pays."
 ENG_norwegian_intervention:0 "Intervention norvégienne"
 ENG_norwegian_intervention_desc:1 "Les mouvements norvégiens contre la démocratie continuent de gagner du terrain. Nous devons veiller à ce que leurs politiques restent alignées sur nos propres intérêts, même si nous devons recourir à la force."
 ENG_danish_intervention:0 "Intervention danoise"
 ENG_danish_intervention_desc:0 "Le soutien danois aux ennemis de la paix mondiale n'a cessé de croître. Il n'y a qu'une seule façon de garantir qu'ils restent de notre côté. Nous devrions utiliser le Danemark pour établir une position stratégique dans la région au cas où une invasion terrestre en Europe deviendrait nécessaire."
 ENG_benelux_intervention:0 "Intervention Benelux"
 ENG_benelux_intervention_desc:0 "L'environnement politique au Benelux est de plus en plus hostile à notre égard. Nous devons envoyer un avertissement clair : aucun ennemi de la démocratie ne sera toléré et nous sommes prêts à recourir à la force si nécessaire."
 ENG_belgium_security:0 "Sécurisez la Belgique"
 ENG_belgium_security_desc:0 "Un avertissement n'était clairement pas suffisant. Si les tendances politiques se poursuivent comme elles l'ont fait jusqu'à présent, la Belgique constituera une menace directe pour nos eaux. Nous devons intervenir et établir un point d'ancrage stratégique sur le continent européen."
 ENG_dutch_security:0 "Sécurisez les Pays-Bas"
 ENG_dutch_security_desc:0 "Les mouvements politiques aux Pays-Bas continuent de soutenir nos ennemis. Les Pays-Bas devront être soumis afin de garantir une Europe libre."
 ENG_war_with_japan:0 "Guerre avec le Japon"
 ENG_war_with_japan_desc:0 "Toutes les autres options sont épuisées et les Japonais refusent d'abandonner leurs voies expansionnistes. Pour la sécurité de l'Empire britannique et des peuples d'Asie, nous devons soumettre les Japonais."
 ENG_war_with_italy:0 "Guerre avec l'Italie"
 ENG_war_with_italy_desc:0 "Les Italiens refusent d'abandonner leurs projets de nouvel empire et se sont montrés prêts à entrer en guerre pour étendre leurs frontières. Nous devons faire tout notre possible pour éliminer cette menace avant qu'il ne soit trop tard."
 ENG_embargo_ussr:0 "Embargo sur l'URSS"
 ENG_embargo_ussr_desc:0 "L'Union soviétique devient de plus en plus puissante et utilise les ressources britanniques pour alimenter ses efforts militaires. Nous devrions les priver de l'accès à notre commerce."
 ENG_war_with_ussr:0 "Guerre avec l'URSS"
 ENG_war_with_ussr_desc:0 "La menace de l'Union Soviétique continue de croître malgré nos objections. Nous ne pouvons pas tolérer une Union soviétique agressive et nous n'avons d'autre choix que d'entrer en guerre pour un avenir meilleur."
 kamikaze_focus_tooltip:1 "Permet des missions aériennes §YKamikaze Strike§!, des attaques suicide contre des navires ennemis.\n"
 AST_additional_militia_training:0 "Formation supplémentaire pour la milice"
 AST_additional_militia_training_desc:0 "Une grande partie de nos miliciens sont inaptes au service - soit malades, soit sous-équipés. Nous prenons des mesures pour remédier à cet oubli dans un monde dangereux."
 AST_royal_australian_artillery:0 "Artillerie royale australienne"
 AST_royal_australian_artillery_desc:0 "L'artillerie est la reine du champ de bataille et nous devons élargir notre accès aux armes lourdes."
 AST_promote_reservists:0 "Promouvoir les réservistes"
 AST_promote_reservists_desc:0 "Même si nous avons besoin d'une force de défense intérieure, la promotion de milices et de réserves dans l'armée régulière nous donnera l'augmentation nécessaire en termes de soldats et d'expérience disponibles."
 AST_daimler_dingo:0 "Daimler Dingo"
 AST_daimler_dingo_desc:0 "Cette voiture blindée de fabrication britannique améliorera notre mobilité sur le champ de bataille. Et, après tout, il porte le nom de notre chien national."
 AST_hmas_assault:0 "Assaut du HMAS"
 AST_hmas_assault_desc:0 "La guerre dans le Pacifique sera une guerre amphibie, c'est pourquoi la construction d'une base navale spécialisée dans l'entraînement des marines à la prise de plage est impérative pour l'effort de guerre."
 AST_specialize_equipment:0 "Équipement spécialisé"
 AST_specialize_equipment_desc:0 "Tous les équipements de fabrication britannique que nous utilisons ne sont pas efficaces dans notre situation de combat unique. Des outils spéciaux et personnalisés sont devenus nécessaires."
 AST_australian_womens_army_service:0 "Service militaire féminin australien"
 AST_australian_womens_army_service_desc:0 "Chaque homme est nécessaire au front, c'est pourquoi les tâches de conduite, de signalisation et d'entretien seront assurées par des milliers de femmes australiennes."
 AST_australian_army_catering_corps:0 "Corps de restauration de l'armée australienne"
 AST_australian_army_catering_corps_desc:0 "L'armée australienne est mal servie par la qualité de sa nourriture, en grande partie à cause de la qualité de ses cuisiniers. En réorganisant ce processus, nous pouvons renforcer le moral et l'efficacité."
 AST_fund_owen_gun_research:0 "Financer la recherche sur les armes à feu Owen"
 AST_fund_owen_gun_research_desc:0 "Evelyn Owen a développé une nouvelle mitraillette capable de résister aux dures pressions de la guerre dans la jungle. Nous devrions consacrer les ressources du gouvernement à la production et à l'amélioration de cette arme."
 AST_sentinel_tank_project:0 "Projet de char Sentinelle"
 AST_sentinel_tank_project_desc:0 "L'Australie devrait développer son propre véhicule blindé artisanal. Basé sur les idées allemandes et américaines, le programme Sentinel devrait être avancé."
 AST_airborne_defence:0 "Défense aéroportée"
 AST_airborne_defence_desc:0 "Nous devons protéger le ciel au-dessus de l'Australie en investissant dans la défense aérienne, notamment dans les intercepteurs et les systèmes anti-aériens."
 AST_introduce_unconventional_warfare:0 "Introduire la guerre non conventionnelle"
 AST_introduce_unconventional_warfare_desc:0 "Les jungles du Pacifique nécessiteront un nouveau type de guerre. Nous devons apprendre à nous déplacer rapidement et silencieusement à travers la couverture dense - tendre une embuscade à nos ennemis et attendre la même chose de leur part."
 AST_z_special_unit:0 "Unité spéciale Z"
 AST_z_special_unit_desc:0 "Z Special Unit sera notre équipe commando, spécialisée dans la reconnaissance et le sabotage derrière les lignes ennemies. Cela nécessitera des hommes courageux prêts à suivre la formation la plus sérieuse."
 AST_m_special_unit:0 "Unité spéciale M"
 AST_m_special_unit_desc:0 "L'unité spéciale M sera notre arme avancée de reconnaissance et de reconnaissance pendant la guerre, renvoyant jusqu'au moment des renseignements sur les dispositions et les emplacements de l'ennemi."
 AST_expand_the_raaf:0 "Développer la RAAF"
 AST_expand_the_raaf_desc:0 "Notre force aérienne doit croître, c'est pourquoi nous investissons dans davantage de bases, davantage de formation et davantage de production."
 AST_cac_boomerang:0 "CAC Boomerang"
 AST_cac_boomerang_desc:0 "Le Boomerang constituera la contribution de l'Australie à la conception des chasseurs et une police d'assurance contre la perte d'avions importés. Nous devons rivaliser avec les avions japonais et américains."
 AST_expand_northern_presence:0 "Élargir la présence dans le Nord"
 AST_expand_northern_presence_desc:0 "Avec nos villes situées principalement sur les côtes est et ouest de l'île, la frontière nord de l'Australie ne dispose pas d'une défense ou d'une préparation adéquate en cas d'invasion ou d'attaque. De nouvelles structures militaires dans cette zone seront les bienvenues."
 AST_cac_woomera:0 "CAC Woomera"
 AST_cac_woomera_desc:0 "L'Australie développera son propre bombardier. Le Woomera n'est qu'un engin léger, mais il sera suffisant pour protéger notre patrie et pour le soutien aérien de combat léger."
 AST_volunteer_air_observers_corps:0 "Corps des observateurs aériens volontaires"
 AST_volunteer_air_observers_corps_desc:0 "Gardez les yeux vers le ciel ! Nous appelons les Australiens à connaître les silhouettes des avions courants et à informer le gouvernement de tout avion suspect ou ennemi s'approchant du Dominion."
 AST_naval_bombers:0 "Bombardiers navals"
 AST_naval_bombers_desc:0 "Nous sommes entourés d'eau, nous devrions donc nous pencher sur les avions et les entraînements qui nous permettront d'intercepter et d'attaquer les flottes ennemies. Le bombardement naval est une compétence spécialisée et devrait être une priorité."
 AST_death_from_down_under:0 "La mort d'en bas"
 AST_death_from_down_under_desc:0 "Aucun bombardier n'endommagera nos ports et nos villes une fois que nous aurons amélioré notre système de défense aérienne, grâce à une meilleure compréhension de la puissance aérienne et de la force brute des armes anti-aériennes."
 AST_womens_auxilliary_australian_air_force:0 "Force aérienne australienne auxiliaire féminine"
 AST_womens_auxilliary_australian_air_force_desc:0 "Une bonne moitié de notre population est mieux utilisée dans l'effort de guerre que de rester chez elle. La maintenance des avions, le corps des transmissions et d'autres tâches connexes seront confiées aux femmes."
 AST_dominate_the_skies:0 "Dominez le ciel"
 AST_dominate_the_skies_desc:0 "L'Australie est loin de nombreuses bases aériennes ennemies, notre objectif devrait donc être d'avoir une supériorité aérienne totale dans notre coin du globe."
 AST_cockatoo_island_shipyards:0 "Chantiers navals de l'île Cockatoo"
 AST_cockatoo_island_shipyards_desc:0 "L'agrandissement et l'amélioration des chantiers navals de Cockatoo Island constituent une priorité majeure pour notre gouvernement. Le port de Sydney offre le meilleur accès à la main-d'oeuvre et aux ressources et c'est là que nous devrions concentrer nos efforts de construction navale."
 AST_protect_overseas_commerce:0 "Protéger le commerce extérieur"
 AST_protect_overseas_commerce_desc:0 "Une nation insulaire dépend des approvisionnements qu'elle peut importer des autres à travers les vagues. La défense des lignes de convois et des routes commerciales n'est pas simplement une stratégie : c'est une nécessité."
 AST_fly_the_jolly_roger:0 "Pilotez le Jolly Roger"
 AST_fly_the_jolly_roger_desc:0 "Depuis notre forteresse insulaire, nous pouvons envoyer des paquets de sous-marins pour harceler et détruire le commerce et les approvisionnements ennemis qui passent par nos côtes."
 AST_scrap_iron_flotilla:0 "Flottille de ferraille"
 AST_scrap_iron_flotilla_desc:0 "Jusqu'à ce que nous puissions moderniser notre flotte, nous nous contenterons des navires vieillissants dont nous disposons. Notre ennemi peut qualifier nos anciens destroyers de flottille de ferraille, mais cela nous rendra fiers."
 AST_royal_australian_submarine_service:0 "Service sous-marin royal australien"
 AST_royal_australian_submarine_service_desc:0 "Les sous-marins sont l'arme maritime du futur et un élément crucial des forces de nos alliés. Nous devons adopter cette façon de faire la guerre."
 AST_naval_auxiliary_patrol:0 "Patrouille auxiliaire navale"
 AST_naval_auxiliary_patrol_desc:0 "Les nombreux ports de notre grand pays constituent des cibles propices aux attaques furtives de sous-marins. Une force auxiliaire de patrouilleurs côtiers nous alertera de tout danger."
 AST_cruisers:0 "Croiseurs"
 AST_cruisers_desc:0 "Nous pouvons laisser les cuirassés et les porte-avions aux gros chiens, puisqu'une masse de navires de la taille d'un croiseur suffira amplement à répondre à nos besoins."
 AST_pacific_area_navy:0 "Marine de la zone Pacifique"
 AST_pacific_area_navy_desc:0 "Même si Sa Majesté se bat pour sa survie en Europe, notre priorité immédiate devrait être une marine capable de combattre nos ennemis ici, dans le Pacifique. Nous devons élaborer des stratégies conformes à cet objectif."
 AST_standard_gauge_railway:0 "Chemin de fer à voie standard"
 AST_standard_gauge_railway_desc:0 "Pendant des décennies, l'Australie a eu des écartements ferroviaires concurrents, ce qui a gâché nos besoins en matière de transport et d'expédition. Le moment est venu de normaliser enfin les gabarits ferroviaires dans tout le pays."
 AST_industries_assistance_corporation:0 "Société d'assistance aux industries"
 AST_industries_assistance_corporation_desc:0 "La récente perturbation de l'économie mondiale a découragé les investissements et l'entrepreneuriat en Australie. L'Industries Assistance Corporation conseillera et financera les petites entreprises à travers le pays pour relancer l'économie."
 AST_western_australian_government_railways:0 "Chemins de fer du gouvernement d'Australie occidentale"
 AST_western_australian_government_railways_desc:0 "À ce stade, les chemins de fer publics d'Australie occidentale devraient bénéficier d'une plus grande priorité que la construction de routes. La géographie favorise le train en Occident - nous devrions en profiter."
 AST_south_australian_housing_trust:0 "Fiducie de logement d'Australie du Sud"
 AST_south_australian_housing_trust_desc:0 "L'Australie du Sud a besoin de plus d'industrie et d'investissements, c'est pourquoi elle consacrera des ressources à une série de communautés planifiées et d'améliorations de logements, en particulier autour d'Adélaïde."
 AST_department_of_supply_and_development:0 "Département de l'approvisionnement et du développement"
 AST_department_of_supply_and_development_desc:0 "En temps de guerre, nous avons besoin d'un département spécial pour gérer les questions de logistique et d'approvisionnement - munitions, carburant et tout ce qui est nécessaire pour maintenir une armée en mouvement."
 AST_expand_lithgow_small_arms_factory:0 "Agrandissez l'usine d'armes légères de Lithgow"
 AST_expand_lithgow_small_arms_factory_desc:0 "Nos Vickers et Brens proviennent de l'usine d'armes légères de Lithgow. À mesure qu'elle grandit, il nous sera plus facile d'augmenter notre capacité de combat."
 AST_allied_works_council:0 "Comité d'entreprise allié"
 AST_allied_works_council_desc:0 "Toutes les constructions militaires en Australie seront supervisées par le comité d'entreprise allié. Cette planification centralisée garantira que le gouvernement obtienne le type de productivité dont il a besoin."
 AST_expand_the_northern_railway:0 "Agrandir le chemin de fer du Nord"
 AST_expand_the_northern_railway_desc:0 "Nous avons un chemin de fer qui s'étend d'Adélaïde au sud jusqu'à Alice Springs au nord. Nous devons maintenant étendre ce point nord à d'autres villes de la région, reliant ainsi toute l'Australie."
 AST_australian_arms_production:0 "Production d'armes australienne"
 AST_australian_arms_production_desc:0 "Les longs délais de convoi signifient que l'Australie doit assumer une plus grande responsabilité dans la production de ses propres armes que les autres Dominions. Nous avons les usines et nous avons le savoir-faire."
 AST_uranium_mining:0 "Extraction d'uranium"
 AST_uranium_mining_desc:0 "Au cours des dernières décennies, nous avons découvert d'importants gisements d'uranium en Australie-Méridionale, notamment autour du mont Gee. L'uranium est désormais une ressource militaire vitale et l'exploitation de ces réserves devrait être accrue."
 AST_establish_advisory_war_council:0 "Établir un conseil consultatif de guerre"
 AST_establish_advisory_war_council_desc:0 "Les hommes politiques australiens doivent mettre de côté les désaccords idéologiques et partisans et se réunir pour se consulter et donner des conseils sur la conduite de la guerre."
 AST_national_security_act:0 "Loi sur la sécurité nationale"
 AST_national_security_act_desc:0 "Maintenant que nous sommes en guerre, le gouvernement fédéral assumera de plus grands pouvoirs pour protéger l'Australie. Une plus grande censure de la presse, la suppression des groupes dissidents et une plus grande capacité de taxer et de saisir les propriétés pour la défense du Dominion."
 AST_volunteer_defence_corps:0 "Corps de défense volontaire"
 AST_volunteer_defence_corps_desc:0 "Un corps de défense volontaire a été constitué à partir d'anciens combattants plus âgés et d'autres citoyens ne faisant pas partie de l'armée régulière. Ils serviront de garde intérieure pour libérer l'armée et lui permettre d'agir directement contre ses ennemis."
 AST_civil_construction_corps:0 "Corps de construction civile"
 AST_civil_construction_corps_desc:0 "Nous enrôlerons des hommes valides pour servir dans un corps de construction civile afin d'aider à la construction d'aérodromes, de transports, de forts et d'autres infrastructures militaires importantes."
 AST_army_inventions_directorate:0 "Direction des inventions de l'armée"
 AST_army_inventions_directorate_desc:0 "Les guerres stimulent l'innovation et la créativité et le gouvernement doit trouver un moyen de trier les bonnes idées des mauvaises. Un nouvel office des brevets spécialisé serait chargé de déterminer lesquelles des nombreuses soumissions au gouvernement ont une valeur."
 AST_invest_in_victory:0 "Investissez dans la victoire"
 AST_invest_in_victory_desc:0 "En vendant des obligations de guerre à notre population, ils peuvent contribuer leurs économies à l'effort de guerre."
 AST_citizen_military_forces:0 "Forces militaires citoyennes"
 AST_citizen_military_forces_desc:0 "Il est maintenant temps de préparer une armée de réserve pour accroître notre capacité de préparation en cas de guerre. Nous enrôlerons les miliciens disponibles dans l'armée pour la défense intérieure, puis les préparerons à servir à l'étranger si nécessaire."
 AST_rats_of_tobruk:0 "Rats de Tobrouk"
 AST_rats_of_tobruk_desc:0 "Nos courageux soldats ont prouvé qu'ils étaient experts dans la guerre dans le désert et dans la récupération des déchets sur le champ de bataille. Ils harcèlent l'ennemi, frappant depuis leurs bases puis se retirant avant la contre-attaque."
 AST_rats_of_tobruk_effect_1:0 "Gagnez une unité d'élite à Tobrouk"
 AST_rats_of_tobruk_effect_2:0 "Gagnez une unité d'élite à Sydney"
 AST_fight_work_or_perish:0 "Combattez le travail ou périssez"
 AST_fight_work_or_perish_desc:0 "Alors que notre ennemi représente une menace existentielle pour le Dominion, les Australiens doivent faire un choix. Ils se battront, travailleront ou périront."
 AST_research_collaboration:0 "Collaboration en recherche"
 AST_research_collaboration_desc:0 "Les Britanniques nous ont montré l'avantage de partager les progrès scientifiques entre alliés proches. L'ensemble de notre faction sera en mesure de mener plus efficacement la R&D en temps de guerre si nous prenons les mesures nécessaires pour coordonner cela."
 AST_fund_australian_defense_research:0 "Financer la recherche australienne sur la défense"
 AST_fund_australian_defense_research_desc:0 "Maintenant que l'Australie est pleinement une nation souveraine, nous n'avons plus accès à des prototypes et à des plans avancés comme nous le faisions auparavant. Nous devons veiller à toujours garder une longueur d'avance sur nos ennemis et à ne pas prendre de retard en matière de technologie."
 AST_squash_the_squanderbugs:0 "Éliminez les insectes gaspillés"
 AST_squash_the_squanderbugs_desc:0 "Les dépenses inutiles en biens de consommation affectés par l'inflation enlèvent de l'argent aux obligations de guerre et à l'effort de guerre. Nous devons décourager cet appétit de luxe alors que notre armée est dans le besoin."
 AST_rationing_and_recycling:0 "Rationnement et recyclage"
 AST_rationing_and_recycling_desc:0 "Chaque ressource compte. Nous rationnerons la nourriture pour nos citoyens, recyclerons pour extraire autant de métal que possible des biens usés et promouvrons les économies dans tout le pays."
 AST_classify_aliens:0 "Classer les extraterrestres"
 AST_classify_aliens_desc:0 "L'Australie est une nation d'immigrants et, en tant que telle, elle a peut-être accueilli certains fidèles à leur pays d'origine. Nous enregistrerons et suivrons les Australiens nés à l'étranger."
 AST_strengthen_ties_with_uk:0 "Renforcer les liens avec le Royaume-Uni"
 AST_strengthen_ties_with_uk_desc:0 "Notre loyauté va à la Mère Patrie. Nous irons là où elle suivra et nous engagerons à combattre ses ennemis. Dieu sauve le roi."
 AST_support_the_policy_of_appeasement:0 "Soutenez la politique d'apaisement"
 AST_support_the_policy_of_appeasement_desc:0 "Les coûts de la dernière guerre pèsent encore lourdement sur la mémoire nationale. Si faire des concessions territoriales à l'autre bout du monde peut maintenir l'Australie à l'écart de la guerre, alors nous devrions certainement envisager ces concessions."
 AST_the_singapore_strategy:0 "La stratégie de Singapour"
 AST_the_singapore_strategy_desc:0 "Singapour est trop loin de Londres pour être en sécurité. L'Australie prendra sur elle de protéger cet avant-poste de l'empire des agressions extérieures."
 AST_adopt_westminster:0 "Adoptez Westminster"
 AST_adopt_westminster_desc:0 "Nous adoptons le système de Westminster dont nous avons hérité du Royaume-Uni."
 AST_CSIR:0 "CSIR"
 AST_CSIR_desc:0 "L'Organisation de recherche scientifique et industrielle du Commonwealth est notre organisme de recherche gouvernemental chargé d'améliorer l'efficacité de la science et de la production en Australie. En augmentant notre soutien, nous donnerons davantage d'énergie au nerf de la guerre."
 AST_swpa_protector:0 "Protecteur SWPA"
 AST_swpa_protector_desc:0 "L'Australie doit assumer la position principale de protectrice de la zone du Pacifique Sud-Ouest. Toute la zone maritime, de l'Indochine à la Nouvelle-Guinée en passant par l'Indonésie, doit être sous notre égide."
 AST_empire_air_training_scheme:0 "Programme de formation d'Empire Air"
 AST_empire_air_training_scheme_desc:0 "Il est temps pour l'Australie de s'engager dans un véritable programme de formation aérienne. Avec l'encouragement et le soutien du Royaume-Uni, tous les Dominions travailleront ensemble pour fournir des pilotes et des équipages de soutien à l'effort de guerre."
 AST_commonwealth_aircraft_corporation:0 "Société aéronautique du Commonwealth"
 AST_commonwealth_aircraft_corporation_desc:0 "La Commonwealth Aircraft Corporation est le principal producteur d'avions et de moteurs d'avion en Australie. Il a fait ses preuves et son soutien fournira à nos pilotes le matériel dont ils ont besoin."
 AST_sever_ties_with_uk:0 "Rompre les liens avec le Royaume-Uni"
 AST_sever_ties_with_uk_desc:0 "Le moment est venu de rompre avec le Royaume-Uni. L'Australie peut suivre sa propre voie sans interférence de Londres et revendiquer son propre destin dans sa propre région."
 AST_protect_the_homeland:0 "Protéger la patrie"
 AST_protect_the_homeland_desc:0 "L'Australie est grande, mais ses côtes peuvent être protégées. Assurer la sécurité de notre propre nation est la plus haute priorité."
 AST_the_swpa_menace:0 "La menace SWPA"
 AST_the_swpa_menace_desc:0 "Le Japon construit un empire qui menace la sécurité de l'Australie et la liberté dans la région. Nous devrions nous tourner vers des nations partageant les mêmes idées pour devenir nos alliés."
 AST_never_another_gallipoli:0 "Jamais un autre Gallipoli"
 AST_never_another_gallipoli_desc:0 "La seule façon de garantir que l'Australie ne soit pas entraînée dans de nouvelles guerres coûteuses par sentimentalité est de prendre le contrôle total de notre politique étrangère. Nous n'avons pas besoin d'un roi lointain et nous ne pouvons pas nous permettre d'anciens liens de sang nous entraînant dans des conflits qui ne servent pas nos intérêts."
 AST_woo_usa:0 "Courtiser les États-Unis"
 AST_woo_usa_desc:0 "Notre véritable allié est l'Amérique, une autre puissance du Pacifique aux racines britanniques. Cette terre riche et puissante est mieux à même de comprendre nos besoins, d'accroître notre prospérité et de nous protéger des agressions."
 AST_protect_the_dutch_colonies:0 "Protégez les colonies hollandaises"
 AST_protect_the_dutch_colonies_desc:0 "Les Pays-Bas sont un maître faible et distant de ses colonies indonésiennes. Il ne peut pas les défendre contre les attaques du Japon, de la Chine ou de tout autre pays potentiellement hostile. Nous devons assumer le contrôle pour le bien commun."
 AST_the_south_west_pacific_initiative:0 "L'Initiative du Pacifique Sud-Ouest"
 AST_the_south_west_pacific_initiative_desc:0 "Nous avons établi la base de pouvoir et la crédibilité nécessaires pour créer notre propre réseau d'alliances, centré sur la défense de la zone du Pacifique Sud-Ouest contre les puissances hostiles. Nous rechercherons des puissances partageant les mêmes idées et ferons de l'Australie une voix majeure dans les affaires mondiales."
 AST_preemptive_intervention:0 "Intervention préventive"
 AST_preemptive_intervention_desc:0 "La construction de l'empire japonais au cours de la dernière décennie constitue une menace pour tous les peuples libres du Pacifique. Nous ne pouvons pas nous permettre d'attendre qu'il tourne son regard affamé vers nous. Le moment est venu d'agir."
 AST_research_cooperation:0 "Coopération de recherche"
 AST_research_cooperation_desc:1 "Les Australiens sont un peuple intelligent et ingénieux, mais nous n'avons ni l'infrastructure ni la population nécessaires pour lancer un programme scientifique sérieux. Nous travaillerons avec nos alliés, partageant nos connaissances et nos avancées pour un bénéfice mutuel."
 AST_abandon_the_westminster_system:0 "Abandonner le système de Westminster"
 AST_abandon_the_westminster_system_desc:0 "Bien que le Parlement de Westminster soit notre héritage de la Grande-Bretagne, il n'est plus utile à l'ère moderne. Les désaccords ministériels et les rivalités entre partis n'ont pas contribué à stabiliser l'Australie pendant la récente crise économique."
 AST_support_the_centre_party:0 "Soutenez le Parti du Centre"
 AST_support_the_centre_party_desc:0 "En Nouvelle-Galles du Sud, un vigoureux mouvement anticommuniste est apparu. Aidé par ses alliés de la Nouvelle Garde, le Parti du Centre pourrait détenir la clé du renforcement de l'Australie."
 AST_supply_indonesian_nationalists:0 "Fournir les nationalistes indonésiens"
 AST_supply_indonesian_nationalists_desc:0 "Nous devons soutenir le peuple indonésien dans sa lutte contre ses oppresseurs néerlandais. Ils auront besoin d'éducation et de formation, mais avec leur supériorité numérique, la victoire dans ce combat pour la justice est inévitable, tout comme leur gratitude envers nous."
 AST_support_indonesian_uprising:0 "Soutenez le soulèvement indonésien"
 AST_support_indonesian_uprising_desc:0 "Maintenant que les Indonésiens ont pris les armes contre les Néerlandais, il leur faudra plus que des paroles. Le soulèvement a besoin d'armes et d'autres équipements, ainsi que d'un soutien diplomatique sans réserve."
 AST_demand_new_zealand:0 "Demander en Nouvelle-Zélande"
 AST_demand_new_zealand_desc:0 "Les Kiwis sont depuis longtemps nos plus proches alliés et amis. Nous avons combattu sur les mêmes plages et sommes morts dans les mêmes guerres impériales inutiles. Il est temps d'unir nos deux pays sous un même drapeau."
 AST_protect_the_south_west_pacific:0 "Protéger le Pacifique Sud-Ouest"
 AST_protect_the_south_west_pacific_desc:0 "Il est temps d'utiliser notre puissance régionale pour amener tout le Pacifique Sud-Ouest dans notre sphère d'influence. Nous seuls pouvons protéger les personnes et les ressources des étrangers qui souhaitent piller notre patrimoine."
 AST_a_deal_with_japan:0 "Un accord avec le Japon"
 AST_a_deal_with_japan_desc:0 "Avec le Pacifique Sud-Ouest sur notre orbite, nous pouvons parvenir à un rapprochement avec l'Empire du Japon. S'il reste dans le Nord-Ouest et nous laisse notre sphère, nous n'aurons aucune raison de nous battre."
 AST_our_own_empire:0 "Notre propre empire"
 AST_our_own_empire_desc:0 "Le moment est venu pour l'ancienne colonie de devenir autonome et de proclamer un empire australien. Notre bienveillance et notre planification prévoyante seront pour le bien de tous les habitants de la région."
 AST_japan_tech_sharing:0 "Partage de technologie au Japon"
 AST_japan_tech_sharing_desc:0 "Les scientifiques japonais ont réussi à devancer nos propres instituts de recherche, mais notre nouvelle harmonie avec l'Empire du Soleil Levant ouvre de nouvelles opportunités d'apprentissage et de partage."
 AST_war_on_japan:0 "Guerre contre le Japon"
 AST_war_on_japan_desc:0 "L'agression japonaise dure depuis trop longtemps. Il a violé et pillé toute l'Asie de l'Est et a désormais les yeux rivés sur les terres et les ressources situées plus au sud. Nous ne pouvons pas rester à l'écart."
 AST_empower_the_workers:0 "Autonomiser les travailleurs"
 AST_empower_the_workers_desc:0 "Une nation de condamnés, d'éleveurs et de dockers. C'est l'Australie. Il est temps de donner la parole et le pouvoir aux travailleurs et au prolétariat d'Australie. Vive la Révolution."
 AST_delegation_to_china:0 "Délégation en Chine"
 AST_delegation_to_china_desc:0 "Longtemps déchiré par la cupidité impériale, le peuple chinois a besoin d'un ami. Et nous avons besoin d'un allié régional contre le fascisme. Cette rencontre officielle avec le gouvernement chinois va nous rapprocher."
 AST_commitment_to_the_cause:0 "Engagement envers la cause"
 AST_commitment_to_the_cause_desc:0 "Le moment est venu de se débarrasser des chaînes d'un roi étranger et de construire un paradis des travailleurs libéré du bellicisme impérialiste qui met en danger toute l'Australie."
 AST_indirect_support:0 "Soutien indirect"
 AST_indirect_support_desc:0 "La République populaire de Chine est en guerre, mais nous ne sommes pas en mesure de nous exposer. Une petite livraison d'armes et des encouragements prudents sont tout ce que nous pouvons risquer pour le moment."
 AST_direct_support:0 "Assistance directe"
 AST_direct_support_desc:0 "Aux armes, camarades ! Écoutez l'appel de nos frères chinois qui souffrent dans la guerre contre le fascisme ! Inscrivez-vous et rejoignez la lutte mondiale de tous les travailleurs !"
 AST_join_comintern:0 "Rejoignez le Komintern"
 AST_join_comintern_desc:0 "Notre avenir réside dans le communisme, nous devons donc nous joindre à nos camarades du monde entier dans cette lutte mondiale. Papa Joe nous montrera la voie et conduira les travailleurs d'Australie et de partout ailleurs vers un avenir glorieux."
 AST_workers_paradise:0 "Paradis des travailleurs"
 AST_workers_paradise_desc:0 "L'expérience communiste stalinienne est un échec, mais nous pensons que le socialisme est la bonne voie. L'Australie ouvrira une deuxième voie que les travailleurs pourront suivre, sans aucune direction de Moscou."
 AST_research_city_excursions:0 "Recherche d'excursions en ville"
 AST_research_city_excursions_desc:0 "L'Union soviétique a construit des villes et des laboratoires de recherche sur tout son territoire et a invité des chercheurs australiens à venir découvrir les gloires de la science communiste."
 AST_nz_puppet:0 "Marionnette néo-zélandaise"
 AST_nz_puppet_desc:0 "Les travailleurs de Nouvelle-Zélande devraient se joindre à leurs frères et soeurs australiens. Nous pouvons les protéger et leur offrir la douce main de l'amitié, à condition qu'ils se soumettent à nos directives."
 AST_the_threat_against_the_people:0 "La menace contre le peuple"
 AST_the_threat_against_the_people_desc:0 "La puissance militariste et fasciste du Japon impérial constitue une menace pour le bien-être de tous les Australiens et bloque la coexistence pacifique des travailleurs du monde entier. L'Australie repoussera cet ennemi du peuple, le forçant à rester sur ses îles rocheuses et lugubres."
 AST_new_general_tt:0 "Une nouvelle compétence §Y3§! Général nommée §YIven Mackay§! apparaîtra."
 AST_homeland_defense_tt:0 "Fortifiez la patrie avec §Yforts côtiers et des forts terrestres§! gardant les sites de débarquement et les ports probables."
 AST_swpi_research_tt:0 "Nous conclurons un accord de partage technologique §Y§! avec les États-Unis ou avec d'autres membres de notre faction."
 AST_deal_with_japan_tt:1 "Nous proposerons de transférer la suzeraineté de §YMalaisie§! au Japon en échange d'une alliance. Si cela n'est pas possible, nous proposerons de céder au Japon les États de §YKalimantan§!, §YSulawesi§! et §Ydes Moluques§!.\n"
 CAN_rowell_sirois_commission:0 "Commission Rowell-Sirois"
 CAN_rowell_sirois_commission_desc:0 "La Commission Rowell-Sirois a déterminé que l'arrangement constitutionnel fédéral du Canada entrave la reprise après la Grande Dépression. Nous devrions égaliser les normes de service à l'échelle nationale."
 CAN_crown_corporations:0 "Sociétés d'État"
 CAN_crown_corporations_desc:0 "Pour fournir des services essentiels et stimuler la croissance économique et industrielle, le Canada doit créer de nombreuses nouvelles sociétés d'État. Là où l'entreprise privée n'intervient pas, le gouvernement doit le faire."
 CAN_war_bonds:0 "Obligations de guerre"
 CAN_war_bonds_desc:0 "Nous ne pouvons pas financer l'effort de guerre sur la base de notre maigre assiette fiscale ou de nos exportations de ressources. Le peuple patriote canadien doit investir dans son pays et soutenir l'effort de guerre au moyen d'obligations de guerre."
 CAN_defence_of_canada_regulations:0 "Règlement sur la défense du Canada"
 CAN_defence_of_canada_regulations_desc:0 "En temps de guerre, les droits civils doivent être restreints pour empêcher la subversion de l'effort de guerre. Cela signifie des restrictions sur la presse, les groupes dissidents et certains droits légaux."
 CAN_national_housing_act:0 "Loi nationale sur le logement"
 CAN_national_housing_act_desc:0 "Un Dominion qui se modernise doit avoir des réglementations uniformisées en matière de logement à travers le pays. Nous devons améliorer les conditions de vie de tous les Canadiens."
 CAN_dollar_a_year_men:0 "Un dollar par an pour les hommes"
 CAN_dollar_a_year_men_desc:0 "L'industrie canadienne a des problèmes d'efficacité, mais un certain nombre d'hommes d'affaires fortunés ont offert leurs services et leurs conseils en échange d'une somme symbolique. Cette petite coterie de conseillers nous fera avancer."
 CAN_canada_pacific_railway:0 "Chemin de fer Canadien Pacifique"
 CAN_canada_pacific_railway_desc:0 "Le CFCP a mis toutes ses ressources à la disposition de l'effort de guerre. Des milliers de tonnes de fournitures et de matériel traverseront notre grand Dominion, d'un océan à l'autre, sans interruption."
 CAN_maritime_colonial_railway:0 "Chemin de fer colonial maritime"
 CAN_maritime_colonial_railway_desc:0 "Nos provinces de l'Est sont mal desservies par les lignes ferroviaires depuis la vente du chemin de fer Intercolonial au Canadien National. Nous encourageons et entreprenons un nouveau chemin de fer colonial maritime pour élargir les connexions entre les provinces centrales et les provinces de l'Atlantique."
 CAN_retool_angus_shops:0 "Réorganiser les magasins Angus"
 CAN_retool_angus_shops_desc:0 "Une armée moderne a besoin de blindés, et les ateliers Angus du CFCP conviennent à leur construction. Rééquipez et réaménagez cette infrastructure pour construire des chars."
 CAN_imperial_oil:0 "Pétrolière Impériale"
 CAN_imperial_oil_desc:0 "L'Impériale veut financer l'exploration dans l'Ouest canadien. Cela augmentera nos réserves de pétrole et lubrifiera la machine de guerre."
 CAN_department_of_munitions_and_supply:0 "Département des munitions et des approvisionnements"
 CAN_department_of_munitions_and_supply_desc:0 "Nous confierons le contrôle et la gestion des ressources nationales du Canada à C.D. Howe au ministère des Munitions et des Approvisionnements."
 CAN_national_resources_mobilization_act:0 "Loi sur la mobilisation des ressources nationales"
 CAN_national_resources_mobilization_act_desc:0 "Le Canada est vaste et sa population est dispersée en poches à travers le pays. Un système devrait être développé pour suivre la situation d'emploi et garantir que toute personne éligible au service à l'étranger puisse être localisée."
 CAN_wartime_prices_and_trade_board:0 "Conseil des prix et du commerce en temps de guerre"
 CAN_wartime_prices_and_trade_board_desc:0 "Pour empêcher le profit et la thésaurisation, des contrôles de prix ont été introduits pour rendre les produits accessibles à la plupart des Canadiens."
 CAN_bits_and_pieces_program:0 "Programme de morceaux et de pièces"
 CAN_bits_and_pieces_program_desc:0 "Le programme Bits and Pieces mobilisera pour l'effort de guerre un certain nombre de petites usines dédiées aux biens de consommation mineurs. Une usine de bicyclettes peut trouver de la capacité pour un certain nombre de biens de guerre utiles."
 CAN_fund_the_national_research_council:0 "Financer le Conseil national de recherches"
 CAN_fund_the_national_research_council_desc:0 "Le Canada a une histoire de science et de progrès, mais le besoin de chercheurs est plus grand que jamais. Il est temps d'appuyer davantage le CNRC."
 CAN_mine_the_shield:0 "Extrayez le bouclier"
 CAN_mine_the_shield_desc:0 "Le Bouclier canadien est riche en nickel, cuivre, or et argent. Nous recevons la générosité de la nature en minéraux. Il est temps de l'exploiter davantage."
 CAN_canada_wheat_board:0 "Commission canadienne du blé"
 CAN_canada_wheat_board_desc:0 "La dévastation de nos agriculteurs de l'Ouest pendant la Grande Dépression peut être corrigée si nous redynamisons la Commission canadienne du blé pour fixer les prix de vente du blé, de l'orge, de l'avoine et d'autres cultures."
 CAN_victory_aircraft_limited:0 "Avion Victory Limitée"
 CAN_victory_aircraft_limited_desc:0 "Victory Aircraft a été chargé de construire la flotte de bombardiers du Canada. Des Lancaster pour tout le monde !"
 CAN_alberta_coal_towns:0 "Villes charbonnières de l'Alberta"
 CAN_alberta_coal_towns_desc:0 "Il existe des gisements de charbon tout au long des Rocheuses prêts à être exploités. Nous pouvons promouvoir l'émigration vers ces nouveaux emplacements miniers et améliorer l'emploi dans l'Ouest."
 CAN_commit_to_the_war:0 "S'engager dans la guerre"
 CAN_commit_to_the_war_desc:0 "Le monde brûle et le Canada a un rôle à jouer. Nous nous engageons à protéger la démocratie et le mode de vie britannique."
 CAN_john_inglis_and_company:0 "John Inglis et compagnie"
 CAN_john_inglis_and_company_desc:0 "La John Inglis and Company devrait recevoir l'ordre de construire de nouvelles mitrailleuses et de nouveaux canons pour l'armée canadienne."
 CAN_polymer_corporation:0 "Société de polymères"
 CAN_polymer_corporation_desc:0 "La nouvelle société d'État Polymer Corporation s'est révélée exceptionnellement efficace dans la production de nouveaux polymères de caoutchouc."
 CAN_national_steel_car:0 "Voiture nationale en acier"
 CAN_national_steel_car_desc:0 "Même si elle a traversé la Grande Dépression, la société National Steel Car possède l'expertise et l'expérience nécessaires pour nous aider à construire les véhicules dont nous aurons besoin pour l'expansion du chemin de fer et de l'armée."
 CAN_send_in_the_zombies:0 "Envoyez les zombies"
 CAN_send_in_the_zombies_desc:0 "Le temps est venu de mettre tous les hommes admissibles du Canada au service de l'armée. Nous avons mobilisé beaucoup d'hommes pour travailler dans l'industrie par le biais de la NRMA, mais il faudrait désormais les envoyer à l'étranger."
 CAN_if_day:0 "Si jour"
 CAN_if_day_desc:0 "Les Canadiens ne prennent pas au sérieux la menace d'une domination étrangère, c'est pourquoi nous simulerons une occupation nazie de Winnipeg pour ramener la peur chez nous. Cela augmentera certainement les ventes d'obligations de la victoire."
 CAN_defense_research_grants:0 "Subventions de recherche pour la défense"
 CAN_defense_research_grants_desc:0 "Maintenant que le Canada est pleinement une nation souveraine, nous n'avons plus accès à des prototypes et à des plans avancés comme nous le faisions auparavant. Nous devons veiller à toujours garder une longueur d'avance sur nos ennemis et à ne pas prendre de retard en matière de technologie."
 CAN_uranium_mining:0 "Extraction d'uranium"
 CAN_uranium_mining_desc:0 "Nos alliés travaillent sur un projet secret qui nécessitera de l'uranium. Heureusement, la société Eldorado a découvert le minéral rare et a construit une ville autour des mines : Port Radium. Le gouvernement doit prendre le contrôle de cette entreprise et protéger ce minerai hautement sensible."
 CAN_long_branch_arsenal:0 "Arsenal à longue branche"
 CAN_long_branch_arsenal_desc:0 "L'arsenal de Long Branch, dans l'ouest de Toronto, sera notre centre de production de carabines. Nous avons besoin de milliers de Lee-Enfield, et l'emplacement central de l'Arsenal facilitera leur distribution dans tout le pays."
 CAN_independent_command:0 "Commandement indépendant"
 CAN_independent_command_desc:0 "Durant la Grande Guerre, les troupes canadiennes devaient en fin de compte répondre aux officiers britanniques, ce qui a conduit à des massacres insensés dans la Somme et à Passchendaele. Cette fois, le Canada commandera les siens."
 CAN_forced_quebec_conscription:0 "Conscription forcée au Québec"
 CAN_forced_quebec_conscription_desc:0 "Tout comme en 1917, nos citoyens canadiens-français du Québec résistent à l'idée d'une conscription nationale visant à amener plus d'hommes dans l'armée. Nous ne resterons pas les bras croisés et laisserons une minorité défier la volonté du Parlement."
 CAN_compromise_with_quebec:0 "Compromis avec le Québec"
 CAN_compromise_with_quebec_desc:0 "Le Québec rechigne à la conscription nationale. Cette question a presque déchiré le pays pendant la Grande Guerre, et nous ne pouvons pas nous permettre de perturber notre unité nationale en temps de crise. Peut-être pourrions-nous conclure une entente concernant le service de guerre pour les résidents du Québec."
 CAN_war_fueled_economy:0 "Une économie alimentée par la guerre"
 CAN_war_fueled_economy_desc:0 "La demande étrangère de matières premières et de produits finis permet au Canada de sortir de la dépression. Nos richesses naturelles en forêts et en minéraux peuvent alimenter la machine de guerre alliée et enrichir la nation."
 CAN_army_modernization:0 "Modernisation de l'armée"
 CAN_army_modernization_desc:0 "Trop longtemps enfermé dans notre maison à l'épreuve du feu, loin des matériaux inflammables, le Canada a laissé son armée se contenter d'équipement et d'entraînement désuets. Nous devons passer à la modernisation avant qu'il ne soit trop tard."
 CAN_canadian_infantry_corps:0 "Corps d'infanterie canadien"
 CAN_canadian_infantry_corps_desc:0 "Nous disposons désormais de suffisamment d'hommes pour établir une formation au niveau du corps. Le Corps d'infanterie canadien est notre premier groupe de taille de corps depuis la dernière guerre."
 CAN_cmp_truck:0 "Camion CMP"
 CAN_cmp_truck_desc:0 "Les usines canadiennes sont à l'abri des bombardements ennemis et peuvent donc être chargées d'assurer le transport nécessaire à l'effort de guerre. Notre conception de camion CMP est polyvalente et adaptée à de nombreux climats."
 CAN_royal_regiment_of_canadian_artillery:0 "Régiment royal de l'Artillerie canadienne"
 CAN_royal_regiment_of_canadian_artillery_desc:0 "Malgré le manque de canons modernes, nous devons commencer à entraîner nos artilleurs à mener une guerre moderne, notamment à utiliser les canons anti-aériens et les nouveaux canons de 25 livres."
 CAN_a_motorized_army:0 "Une armée motorisée"
 CAN_a_motorized_army_desc:0 "L'expérience du Canada dans la fabrication de camions et de moteurs nous a donné un avantage dans la recherche et le développement de forces armées motorisées."
 CAN_red_deer_training_camp:0 "Camp d'entraînement de Red Deer"
 CAN_red_deer_training_camp_desc:0 "Le camp d'entraînement de Red Deer sera le principal lieu d'entraînement de notre nouvelle armée. Avec un arsenal complet et des aérodromes à proximité, Red Deer est idéalement situé."
 CAN_the_walkie_talkie:0 "Le talkie-walkie"
 CAN_the_walkie_talkie_desc:0 "Donald Hings a inventé et fait breveter un nouveau dispositif portatif de communication bidirectionnelle qui fonctionne sur les ondes radio. Cela améliorera grandement la communication et le ciblage."
 CAN_1st_canadian_parachute_battalion:0 "1er Bataillon canadien de parachutistes"
 CAN_1st_canadian_parachute_battalion_desc:0 "Malgré la résistance de ceux qui préféreraient que nous nous concentrions sur la défense intérieure, la guerre aéroportée moderne a besoin d'un bataillon de parachutistes dédié pour prendre le dessus sur nos ennemis."
 CAN_the_black_devils:0 "Les Diables Noirs"
 CAN_the_black_devils_desc:0 "Une unité commando spéciale devra être disponible pour les missions dangereuses. Une coopération avec nos alliés américains pour la création de la Brigade du Diable a été organisée."
 CAN_the_valentine_tank:0 "Le réservoir de la Saint-Valentin"
 CAN_the_valentine_tank_desc:0 "Le Canada possède une licence pour produire le Valentine Tank, un char moyen durable de conception britannique."
 CAN_the_rocky_mountain_rangers:0 "Les Rangers des Montagnes Rocheuses"
 CAN_the_rocky_mountain_rangers_desc:0 "La défense nationale dans l'Ouest reviendra aux Rocky Mountain Rangers, basés à Kamloops."
 CAN_strengthen_the_commonwealth_ties:0 "Renforcer les liens avec le Commonwealth"
 CAN_strengthen_the_commonwealth_ties_desc:0 "Nos frères Dominions sont nos plus vrais amis, et nous devrions tous marcher ensemble pour soutenir Sa Majesté."
 CAN_shadow_factories:0 "Usines de l'ombre"
 CAN_shadow_factories_desc:0 "Nous avons besoin d'usines aéronautiques, mais il est plus facile et plus sûr de disperser la fabrication des pièces dans d'autres usines, notamment à proximité des usines automobiles. Cela encouragera le secret et la sécurité."
 CAN_montreal_laboratory_collaboration:0 "Collaboration des laboratoires de Montréal"
 CAN_montreal_laboratory_collaboration_desc:1 "Le Laboratoire de Montréal est devenu une attraction pour les scientifiques du monde entier. Les scientifiques français et britanniques se sont sentis particulièrement bien accueillis et apportent aux efforts des Dominions leur expertise indispensable."
 CAN_the_plan:0 "Le plan"
 CAN_the_plan_desc:0 "Nous nous sommes joints à nos alliés pour partager notre expérience et nos connaissances en matière de formation des pilotes. La guerre pouvait être gagnée par les airs, et le plan d'entraînement aérien du Commonwealth pourrait donc être la clé de la victoire."
 CAN_camp_x:0 "Camp X"
 CAN_camp_x_desc:0 "La collecte de renseignements et la formation des espions seront centralisées dans un endroit secret près d'Oshawa. Il bénéficie d'un emplacement central pour les signaux du Royaume-Uni et des États-Unis."
 CAN_supply_the_empire:0 "Alimenter l'Empire"
 CAN_supply_the_empire_desc:0 "Existe-t-il une nation aussi riche en bois, en fer, en nickel et en charbon ? Tant que nos convois et nos voies ferrées sont sûrs, nous pouvons expédier des matières premières vers nos ports puis vers nos partenaires impériaux."
 CAN_aluminium_company_of_canada:0 "Compagnie d'aluminium du Canada"
 CAN_aluminium_company_of_canada_desc:0 "L'aluminium est léger et antirouille. En développant notre exploitation minière et notre production d'aluminium, nous pouvons garantir que nos usines et nos chaînes de montage seront toujours alimentées."
 CAN_turner_valley_oilfield:0 "Champ pétrolifère de Turner Valley"
 CAN_turner_valley_oilfield_desc:0 "Découverte en 1914, la Turner Valley, à l'extérieur de Calgary, est devenue l'un des plus grands champs de pétrole de l'Empire. La poursuite du développement devrait être une priorité absolue pour l'industrie et le gouvernement."
 CAN_patriation:0 "Rapatriement"
 CAN_patriation_desc:0 "Le temps est venu pour le Canada de réduire ses liens avec la Mère Angleterre. Nous sommes une nation adulte, avec notre propre destin, tournée vers le continent et l'autre côté du Pacifique autant que vers l'Angleterre et l'Europe."
 CAN_permanent_joint_defense_board:0 "Commission mixte permanente de défense"
 CAN_permanent_joint_defense_board_desc:0 "La géographie et le patrimoine commun nous lient aux États-Unis, mais le continent est trop vaste pour que l'un de nous puisse le défendre seul. Une commission de défense commune est nécessaire pour mener des consultations et planifier la protection de l'Amérique du Nord."
 CAN_north_american_alliance:0 "Alliance nord-américaine"
 CAN_north_american_alliance_desc:0 "Le moment est venu d'annoncer un partenariat important et permanent avec les États-Unis d'Amérique. Personne ne peut nous défier lorsque nous sommes unis dans la paix et la fraternité."
 CAN_habakkuk_carrier:0 "Transporteur d'Habacuc"
 CAN_habakkuk_carrier_desc:0 "Le projet Habakkuk est notre plan visant à construire un transporteur anti-sous-marin à partir d'un matériau composé de pâte de bois et de glace. Cela libérera l'acier pour des utilisations plus importantes et fera progresser la science canadienne."
 CAN_refuge_for_scientists:0 "Refuge pour les scientifiques"
 CAN_refuge_for_scientists_desc:0 "Loin du tumulte de la guerre, le Canada s'est révélé être un lieu d'atterrissage prometteur pour les scientifiques qui souhaitent mener leurs travaux à l'abri des bombes et des balles."
 CAN_swastika_clubs:0 "Clubs à croix gammée"
 CAN_swastika_clubs_desc:0 "De nombreux Canadiens se tournent vers les clubs à croix gammée pour promouvoir les idées et les idéaux du fascisme. Fascinant!"
 CAN_support_the_blue_shirts:0 "Soutenez les chemises bleues"
 CAN_support_the_blue_shirts_desc:0 "Le tournant de notre nation vers le fascisme nécessitera une force paramilitaire puissante pour intimider et impressionner nos rivaux. Les Chemises bleues seront notre réponse à tous ceux qui défient notre nouvel ordre."
 CAN_join_germany:0 "Rejoignez l'Allemagne"
 CAN_join_germany_desc:0 "Hitler s'est révélé être un homme raisonnable qui formule des exigences raisonnables tout en renforçant la force de sa nation. Nous nous joindrons au Reich en solidarité pour un nouvel âge d'or."
 CAN_support_a_synarchist_baja:0 "Soutenez une Baja synarchiste"
 CAN_support_a_synarchist_baja_desc:0 "Pour favoriser la propagation du nationalisme conservateur en Amérique du Nord, nous devrions soutenir une révolte synarchiste au Mexique. Une fois que cela aura réussi, nous aurons deux États fascistes prêts à faire passer le message à travers l'hémisphère."
 CAN_pinion_the_eagle:0 "Pignon l'Aigle"
 CAN_pinion_the_eagle_desc:0 "Notre longue frontière avec les États-Unis est restée trop longtemps sans défense. L'Amérique demeure la plus grande menace à la sécurité du Canada, c'est pourquoi des mesures seront prises pour rendre l'invasion américaine trop difficile et trop gênante."
 CAN_skewer_the_eagle:0 "Embrocher l'aigle"
 CAN_skewer_the_eagle_desc:0 "Nous formerons une alliance avec nos frères mexicains pour encercler et contenir la menace américaine."
 CAN_defence_scheme_no_1:0 "Schéma de défense n°1."
 CAN_defence_scheme_no_1_desc:0 "Il est temps de dépoussiérer le Plan de défense n°1, notre plan d'entre-deux-guerres pour une contre-attaque contre les États-Unis en cas de guerre."
 CAN_demand_labrador_and_newfoundland:0 "Exigez le Labrador et Terre-Neuve"
 CAN_demand_labrador_and_newfoundland_desc:0 "Terre-Neuve est un dominion en faillite qui a dû revenir à son statut colonial. Sa véritable place est au Canada."
 CAN_burn_the_royal_portraits:0 "Brûlez les portraits royaux"
 CAN_burn_the_royal_portraits_desc:0 "Fini les monarques ! Nous ne nous soumettrons plus à la domination d'une figure de proue étrangère et d'un parlement étranger. Le Canada sera libre et égal. Le peuple se lèvera."
 CAN_communist_labor_total_war_committee:0 "Comité de guerre totale du travail communiste"
 CAN_communist_labor_total_war_committee_desc:0 "Les communistes canadiens sont aussi des patriotes ! Dans la guerre mondiale contre le fascisme, nous pouvons travailler avec les libéraux bourgeois pour mobiliser la nation entière pour la guerre."
 CAN_defence_scheme_no_2:0 "Schéma de défense n°2"
 CAN_defence_scheme_no_2_desc:0 "Le Plan de Défense N°2 est notre plan d'urgence en cas de guerre dans le Pacifique entre les États-Unis et l'Empire du Japon. Idéalement, nous resterions neutres en cas de guerre, mais quelles que soient les circonstances, une défense solide sur notre côte ouest sera établie."
 CAN_supply_the_red_army:0 "Ravitailler l'Armée rouge"
 CAN_supply_the_red_army_desc:0 "Alors que l'Union soviétique est en guerre contre les ennemis du peuple, le Canada devrait s'engager à aider Moscou en lui fournissant des armes et du matériel."
 CAN_canada_united:0 "Canada Uni"
 CAN_canada_united_desc:0 "Même si notre population est répartie en une mince ligne à travers le continent, nous nous sommes unis face à cette crise mondiale pour défendre les valeurs canadiennes et protéger les plus faibles."
 CAN_join_comintern:0 "Rejoignez le Komintern"
 CAN_join_comintern_desc:0 "L'Union soviétique a prouvé sa bonne foi et sa force. Le Canada devrait rejoindre l'alliance soviétique."
 CAN_support_the_world_revolution:0 "Soutenez la révolution mondiale"
 CAN_support_the_world_revolution_desc:0 "Entendez-vous les gens chanter ? C'est l'Internationale ! Le Canada s'efforcera de libérer le prolétariat de ses chaînes."
 CAN_rcaf_station_borden:0 "Station de l'ARC Borden"
 CAN_rcaf_station_borden_desc:0 "Le Corps aérien du Canada est né à Borden, en Ontario, et cette base devrait être utilisée pour former une nouvelle génération de pilotes."
 CAN_we_have_the_hurricane:0 "Nous avons l'ouragan"
 CAN_we_have_the_hurricane_desc:0 "Le Royaume-Uni nous a donné la permission de construire une ligne de chasseurs Hurricane. Ces avions constitueront le coeur de notre escadre aérienne."
 CAN_the_pacific_coast_air_defence_radar_system:0 "Le système radar de défense aérienne de la côte du Pacifique"
 CAN_the_pacific_coast_air_defence_radar_system_desc:0 "La côte de la Colombie-Britannique est rocheuse et peu peuplée, sauf au sud. Nous devrons nous appuyer sur des systèmes d'alerte précoce, comme une chaîne de stations radar, pour détecter tout événement inhabituel survenant dans le Pacifique."
 CAN_commonwealth_air_training_plan:0 "Plan d'entraînement aérien du Commonwealth"
 CAN_commonwealth_air_training_plan_desc:0 "L'entraînement au combat aérien sera coordonné avec nos alliés du Commonwealth et du Dominion. C'est plus efficace et cela peut être fait en masse et en toute sécurité sur nos aérodromes."
 CAN_fund_fairchilds_development:0 "Financer le développement de Fairchild"
 CAN_fund_fairchilds_development_desc:0 "L'usine d'avions Fairchild, au Québec, devrait recevoir les ressources dont elle a besoin pour augmenter la production de pièces de bombardiers. Nous devrions être en mesure d'augmenter l'emploi de milliers de personnes dans l'usine."
 CAN_cookie_carriers:0 "Supports de cookies"
 CAN_cookie_carriers_desc:0 "La guerre aérienne stratégique nécessite que des bombardiers lourds larguent de délicieuses friandises sur nos ennemis."
 CAN_the_sabre_project:0 "Le projet Sabre"
 CAN_the_sabre_project_desc:0 "Les avions à réaction domineront le ciel du futur, nous devrions donc investir dans la production de nos propres variantes d'avions à réaction étrangers."
 CAN_halifax_shipyards:0 "Chantiers navals d'Halifax"
 CAN_halifax_shipyards_desc:0 "Idéalement situés face à l'Europe, les quais d'Halifax ont construit de nouveaux navires à un rythme record. La bataille de l'Atlantique peut être gagnée."
 CAN_destroyer_effort:0 "Effort du Destructeur"
 CAN_destroyer_effort_desc:0 "La menace d'attaques sous-marines contre les convois de ravitaillement et de troupes nous oblige à nous concentrer sur la construction de destroyers pour chasser et tuer ces dangers sous-marins."
 CAN_light_cruiser_effort:0 "Effort de croiseur léger"
 CAN_light_cruiser_effort_desc:0 "Nous ne pourrons jamais construire beaucoup de vaisseaux capitaux, mais les croiseurs plus petits, construits en masse, peuvent encore avoir du punch."
 CAN_heavy_cruiser_effort:0 "Effort de croiseur lourd"
 CAN_heavy_cruiser_effort_desc:0 "Nous pouvons construire nos flottes autour de croiseurs lourds et disposer de suffisamment de ports pour en faire une stratégie viable."
 CAN_escort_fleet:0 "Flotte d'escorte"
 CAN_escort_fleet_desc:0 "Les océans nous séparent de la plupart des tumultes du monde. Si nos armées veulent combattre et être approvisionnées, nous devons donner la priorité aux formations d'escorte et à la guerre anti-sous-marine."
 CAN_fleet_in_being:0 "Flotte en être"
 CAN_fleet_in_being_desc:0 "En construisant une grande force navale, sa simple existence peut constituer une menace pour nos ennemis même si nous ne la déployons jamais. La simple pensée de nos navires naviguant et frappant leurs voies maritimes les oblige à être prudents."
 CAN_degauss_ship_hulls:0 "Démagnétisation des coques de navires"
 CAN_degauss_ship_hulls_desc:0 "Nous allons commencer à démagnétiser les coques de nos navires, réduisant ainsi leur signature magnétique. Cela les protège des mines magnétiques et réduit le profil électronique des navires."
 CAN_trade_fleet:0 "Flotte commerciale"
 CAN_trade_fleet_desc:0 "Le Canada est une nation commerçante. Construisez plus de cargos et de convois."
 CAN_united_shipyards:0 "Chantiers navals unis"
 CAN_united_shipyards_desc:0 "Le quai de Montréal de United Shipyards est devenu la principale source d'approvisionnement de nos péniches de débarquement et de nos cargos."
 SAF_support_axis_interests_effect_tt:0 "Construisez §YInfrastructure§! et ajoutez §YEmplacements de construction§! dans les États occupés situés dans le sud et le centre de l'Afrique.\n"
 SAF_a_king_for_our_people_trigger_tt:0 "Le roi Édouard a été exilé"
 NATIONAL_FOCUS_MUTUALLY_EXCLUSIVE_TREE:0 "Les branches s'excluent mutuellement."
 NATIONAL_FOCUS_EXCLUSIVE_INFO_DESC:0 "Mutuellement exclusif avec"
 NATIONAL_FOCUS_EXCLUSIVE_INFO_ENTRY:0 "$FOCUS|Y$"
 NATIONAL_FOCUS_NO_CURRENT_EFFECT:0 "Cette focalisation n'a actuellement aucun effet. Les changements dans la situation mondiale peuvent affecter cela."
 SAF_war_measures_act:0 "Loi sur les mesures de guerre"
 SAF_war_measures_act_desc:0 "Nous ne pouvons permettre aucune perturbation de l'effort de guerre, c'est pourquoi nous adoptons une nouvelle législation pour imposer le respect total des objectifs du gouvernement. Cela protégera le flux des ressources et nous permettra de concentrer l'énergie politique là où elle est nécessaire."
 SAF_emergency_workers:0 "Travailleurs d'urgence"
 SAF_emergency_workers_desc:0 "Il est temps de mobiliser une plus grande partie de la population sud-africaine pour l'effort de guerre. Les femmes peuvent également être amenées dans les usines à moindre coût."
 SAF_csir:0 "CSIR"
 SAF_csir_desc:0 "L'Afrique du Sud est à la traîne des autres dominions en matière de science et de technologie, c'est pourquoi la création du Conseil pour la recherche scientifique et industrielle à Pretoria est devenue une question urgente pour le gouvernement."
 SAF_cape_garrison_artillery:0 "Artillerie de la garnison du Cap"
 SAF_cape_garrison_artillery_desc:0 "Le Cap reste une route maritime importante pour de nombreux pays et constitue la porte d'entrée vers le coeur de l'Afrique du Sud. L'expansion des défenses côtières et de l'artillerie de la garnison devrait figurer en tête de notre liste de choses à faire."
 SAF_reconstitute_the_cape_corps:0 "Reconstituer le Cape Corps"
 SAF_reconstitute_the_cape_corps_desc:0 "Historiquement, nous avons pu mettre une partie de notre population métis au service de la défense de l'Afrique du Sud. Cette mesure n'est pas populaire auprès de tout le monde dans le pays, mais elle permettra aux Sud-Africains blancs de servir à l'étranger."
 SAF_expand_the_cape_corps:0 "Développez le Cape Corps"
 SAF_expand_the_cape_corps_desc:0 "Bien que nous ayons reconstitué le Corps du Cap en une force essentiellement non combattante, la menace d'invasion signifie que nous devons donner au Corps davantage de ressources, de formation et d'accès aux armes."
 SAF_work_for_all_poor:0 "Travailler pour tous les pauvres"
 SAF_work_for_all_poor_desc:0 "Les Afrikaners ruraux pauvres ont afflué vers les villes à la recherche de travail ces dernières années, et nous n'avons pas fait grand-chose pour les aider. Jusqu'à maintenant. L'industrialisation et la protection gouvernementale de leur accès au travail aideront cette population."
 SAF_outlaw_strikes:0 "Grèves des hors-la-loi"
 SAF_outlaw_strikes_desc:0 "Les arrêts de travail et les interruptions de travail sont antipatriotiques en temps de crise. Les grèves sont déclarées illégales et le gouvernement obligera les gens à retourner au travail."
 SAF_support_the_policy_of_appeasement:0 "Soutenez la politique d'apaisement"
 SAF_support_the_policy_of_appeasement_desc:0 "L'Allemagne a des griefs légitimes et les Dominions ont beaucoup souffert lors de la dernière guerre. Nous devons profiter de chaque opportunité de paix à notre époque."
 SAF_police_windhoek:0 "Police de Windhoek"
 SAF_police_windhoek_desc:0 "Nous disposons d'un mandat sur l'ancienne colonie allemande du Sud-Ouest africain depuis la fin de la dernière guerre. Il est essentiel que nous soyons à la hauteur de notre devoir de sécuriser et d'améliorer la grande ville de Windhoek."
 SAF_joint_air_training_scheme:0 "Programme conjoint d'entraînement aérien"
 SAF_joint_air_training_scheme_desc:0 "Les pays du Commonwealth mettent en commun leurs ressources et leur expérience pour faciliter et accélérer la formation des pilotes et du personnel navigant."
 SAF_desert_equipment:0 "Équipement du désert"
 SAF_desert_equipment_desc:0 "La guerre en Afrique du Nord nécessite un équipement spécialisé et, comme nos forces pourraient être appelées à servir sur ce front, la fourniture de cet équipement deviendra une question logistique importante."
 SAF_suppress_the_stormjaers:0 "Supprimez les Stormjaers"
 SAF_suppress_the_stormjaers_desc:0 "L'Ossewabrandwag (OB) fasciste et pro-allemand possède une aile paramilitaire calquée sur des groupes européens similaires. Ils perturbent les efforts du gouvernement visant à recruter des troupes et à poursuivre une politique de guerre sûre et unie. Les Stormjaers doivent être démantelés."
 SAF_secure_interests_in_africa:0 "Des intérêts garantis en Afrique"
 SAF_secure_interests_in_africa_desc:0 "L'Union sud-africaine est voisine d'un certain nombre de colonies britanniques qui pourraient être laissées à notre administration. Nous devons également faire tout notre possible pour garantir de manière permanente notre mandat sur le Sud-Ouest africain."
 SAF_native_laws_amendment_act:0 "Loi modifiant les lois autochtones"
 SAF_native_laws_amendment_act_desc:0 "Pour garantir davantage de travail à la population afrikaner, nous devons limiter l'installation des Sud-Africains noirs dans les villes. Seules les personnes ayant une longue histoire dans la commune auront le droit de résider."
 SAF_encourage_segregation:0 "Encourager la ségrégation"
 SAF_encourage_segregation_desc:0 "Nous devrions faire plus d'efforts pour séparer légalement nos différentes populations ethniques afin de promouvoir le pouvoir et l'unité de notre classe dirigeante."
 SAF_abandon_westminster:0 "Abandonner Westminster"
 SAF_abandon_westminster_desc:0 "Le remplacement de la route du Cap par la route de Suez, ainsi que l'expérience formatrice de la guerre des Boers ont contribué à créer une identité sud-africaine distincte de celle de nos alliés du Dominion. Nous devons nous éloigner du roi et tracer notre propre voie."
 SAF_support_the_afrikaner_broederbond:0 "Soutenez l'Afrikaner Broederbond"
 SAF_support_the_afrikaner_broederbond_desc:0 "L'Afrikaner Broederbond s'est battu pour que le peuple afrikaner fasse davantage entendre sa voix et pour une séparation plus forte des races. Le souvenir de la politique britannique pendant la guerre des Boers est toujours fort et le Broederbond peut contribuer à créer une nouvelle Afrique du Sud."
 SAF_support_ossewabrandwag:0 "Soutenez Ossewabrandwag"
 SAF_support_ossewabrandwag_desc:0 "Les paramilitaires fascistes Ossewabrandwag devraient être utilisés comme rempart contre l'agitation étrangère et les soulèvements nationaux qui ciblent notre classe dirigeante."
 SAF_celebrate_the_great_trek:0 "Célébrez le Grand Trek"
 SAF_celebrate_the_great_trek_desc:0 "Il y a un siècle, nos ancêtres Afrikaners se sont séparés de la puissance coloniale britannique montante et ont construit leur propre nation boer dans le nord-est. Leur esprit robuste représente toujours le meilleur de la vertu sud-africaine."
 SAF_voortrekker_monument:0 "Monument aux Voortrekkers"
 SAF_voortrekker_monument_desc:0 "Un monument dédié aux Voortrekkers qui ont entrepris le Grand Trek renforcera l'esprit national et l'unité en ces temps troublés."
 SAF_support_nazification_of_south_west_africa:0 "Soutenir la nazification du Sud-Ouest africain"
 SAF_support_nazification_of_south_west_africa_desc:0 "En tant qu'ancienne colonie allemande, il est tout à fait approprié que nous encourageions la croissance des idées politiques allemandes dans le Sud-Ouest africain."
 SAF_south_africa_first:0 "L'Afrique du Sud d'abord"
 SAF_south_africa_first_desc:0 "L'Afrique du Sud est la nation indépendante la plus puissante du continent et peut donc être un modèle pour l'avenir de l'Afrique et de ses anciennes colonies."
 SAF_support_the_german_coup:0 "Soutenez le coup d'État allemand"
 SAF_support_the_german_coup_desc:0 "Le gouvernement allemand considère depuis longtemps l'Afrique du Sud comme un terrain fertile pour une plus grande influence, et ce depuis le siècle dernier. Notre avenir appartient au Reich, pas à l'Empire, alors poursuivons le plan visant à renverser le gouvernement actuel."
 SAF_reclaim_boer_colonies:0 "Récupérer les colonies boers"
 SAF_reclaim_boer_colonies_desc:0 "L'ancien territoire boer du Transvaal et d'autres régions appartiennent de plein droit aux libres héritiers de ce peuple entreprenant."
 SAF_commemorate_the_battle_of_blood_river:0 "Commémorez la bataille de Blood River"
 SAF_commemorate_the_battle_of_blood_river_desc:0 "En 1838, un groupe de colons boers retint des dizaines de milliers de guerriers zoulous, portant un coup paralysant au pouvoir zoulou dans le Natal. C'était sûrement un signe divin de la justesse de notre cause."
 SAF_german_scientists:0 "Scientifiques allemands"
 SAF_german_scientists_desc:0 "Les scientifiques allemands comptent parmi les meilleurs au monde et ont beaucoup à partager avec nous."
 SAF_support_axis_interests:0 "Soutenir les intérêts de l'Axe"
 SAF_support_axis_interests_desc:0 "Les puissances de l'Axe disposent d'une énergie et d'une idéologie qui peuvent aider l'Afrique du Sud à établir sa place dans le monde. Nous devons leur apporter tout notre soutien diplomatique."
 SAF_a_king_for_our_people:0 "Un roi pour notre peuple"
 SAF_a_king_for_our_people_desc:0 "L'Afrique du Sud devrait avoir un roi et, heureusement, il existe un Windsor que personne n'utilise actuellement. L'ancien Édouard VIII, duc de Windsor, peut s'asseoir sur notre trône."
 SAF_empower_the_workers:0 "Autonomiser les travailleurs"
 SAF_empower_the_workers_desc:0 "Nous sommes un pays de mineurs et d'agriculteurs. Les travailleurs d'Afrique du Sud sont la seule véritable représentation de la volonté nationale."
 SAF_support_spain:0 "Soutenir l'Espagne"
 SAF_support_spain_desc:0 "Le fascisme est en hausse en Europe, et nous pouvons l'arrêter en Espagne - ou du moins ralentir sa propagation. Des hommes et du matériel devraient être envoyés pour soutenir la cause républicaine."
 SAF_repeal_the_native_representation_act:0 "Abroger la Loi sur la représentation autochtone"
 SAF_repeal_the_native_representation_act_desc:0 "La discrimination raciale est contraire aux valeurs de la révolution populaire en Afrique du Sud. Les Noirs devraient être réinscrits sur les listes électorales générales et bénéficier de droits politiques."
 SAF_burn_the_kings_portraits:0 "Brûlez les portraits du roi"
 SAF_burn_the_kings_portraits_desc:0 "A bas la famille royale ! Ce geste symbolique déclarera publiquement notre rupture avec le trône étranger."
 SAF_join_comintern:0 "Rejoignez le Komintern"
 SAF_join_comintern_desc:0 "L'Union Soviétique a été à l'avant-garde de la croisade en faveur des travailleurs et contre le fascisme. Nous rejoindrons leur puissante alliance."
 SAF_support_the_world_revolution:0 "Soutenez la révolution mondiale"
 SAF_support_the_world_revolution_desc:0 "La seule façon pour les travailleurs de triompher est d'unir le monde entier dans un seul effort. La Révolution doit être universelle et donc exportée."
 SAF_equal_opportunity_employment:0 "Égalité des chances en emploi"
 SAF_equal_opportunity_employment_desc:0 "Si nous voulons améliorer le sort des travailleurs dans notre pays, nous devons commencer par garantir que tous les travailleurs soient traités de manière égale, quelle que soit leur couleur de peau."
 SAF_demand_madagascar:0 "Demander Madagascar"
 SAF_demand_madagascar_desc:1 "Avec les changements dramatiques de la situation en Europe, il est temps de réévaluer l'ensemble du système colonialiste. Pourquoi Madagascar devrait-elle être enchaînée à un empire en chute libre ?"
 SAF_invite_soviet_advisers:0 "Inviter des conseillers soviétiques"
 SAF_invite_soviet_advisers_desc:4 "Si nous voulons soutenir l'Union soviétique dans sa lutte pour apporter la liberté aux travailleurs du monde entier, nous devons améliorer notre armée en apprenant d'elle."
 SAF_south_african_soviet_research_treaty:0 "Traité de recherche avec l'URSS"
 SAF_south_african_soviet_research_treaty_desc:1 "Après avoir appris de nombreuses leçons précieuses de nos amis soviétiques, il est temps d'approfondir les relations et de signer un traité formel."
 SAF_anti_colonialist_crusade:0 "Croisade anticolonialiste"
 SAF_anti_colonialist_crusade_desc:1 "Le colonialisme est au coeur du système impérialiste qui opprime les travailleurs du monde entier. Nous sommes dans une position unique pour briser ce système et libérer les peuples africains des siècles d'exploitation qu'ils ont dû endurer."
 SAF_Union_of_the_African_People:0 "Union des peuples africains"
 SAF_Union_of_the_African_People_desc:1 "Pendant très longtemps, les peuples africains n'ont pas eu leur mot à dire dans la détermination de leur propre destin. Ces jours sont révolus. Nous créerons une faction suffisamment forte pour résister à toute tentative des puissances revanchistes du monde de faire reculer nos acquis. L'Afrique sera libérée du colonialisme."
 SAF_liberate_Portuguese:0 "Libérer les colonies portugaises"
 SAF_liberate_Portuguese_desc:1 "Les colonies de l'Angola et du Mozambique se trouvent juste à nos frontières. Il est temps de mettre fin à l'exploitation de leur peuple."
 SAF_liberate_british:0 "Libérer les colonies britanniques"
 SAF_liberate_british_desc:1 "L'Empire britannique est l'exemple de colonialisme le plus tristement célèbre de l'histoire. Nous y mettrons fin."
 SAF_liberate_belgian:0 "Libérer les colonies belges"
 SAF_liberate_belgian_desc:1 "Le Congo belge est largement considéré comme l'une des histoires d'exploitation et d'oppression les plus cruelles. Nous écrirons le dernier chapitre de cette histoire."
 SAF_south_african_railways:0 "Chemins de fer sud-africains"
 SAF_south_african_railways_desc:0 "La société des chemins de fer sud-africains doit être développée. Des groupes de jeunes peuvent y être formés et acquérir les compétences nécessaires pour travailler dans le pays et servir à l'étranger."
 SAF_expand_the_mining_industry:0 "Développer l'industrie minière"
 SAF_expand_the_mining_industry_desc:0 "La richesse minière de l'Afrique du Sud est légendaire et nous venons tout juste de commencer à exploiter ses vastes réserves d'or, de chrome et de platine."
 SAF_heavy_engineering:0 "Ingénierie lourde"
 SAF_heavy_engineering_desc:0 "Il est important que l'Afrique du Sud reste à la pointe des dernières techniques d'ingénierie. Même si notre base industrielle est petite, nous devrions investir dans la machinerie lourde et l'ingénierie pour rattraper rapidement nos pairs."
 SAF_infrastructure_effort:0 "Efforts en matière d'infrastructures"
 SAF_infrastructure_effort_desc:0 "Une grande partie de l'Afrique du Sud reste rurale et sous-développée. Un plus grand nombre de routes et de voies ferrées pourraient amener les richesses naturelles du pays vers ses ports affamés."
 SAF_armament_effort:0 "Effort d'armement"
 SAF_armament_effort_desc:0 "L'Afrique du Sud est à l'abri de toute invasion de toute puissance étrangère, mais également éloignée de ses alliés. Il est vital qu'elle développe sa propre industrie d'armement afin que l'Union ne soit jamais sans défense."
 SAF_south_african_steel:0 "Acier sud-africain"
 SAF_south_african_steel_desc:0 "Nous avons le charbon et le fer. Maintenant, nous avons la raison. L'expansion de l'aciérie Iscor à Pretoria fournira au pays les tôles d'acier lourdes nécessaires aux armes modernes."
 SAF_pretoria_arms:0 "Armes de Pretoria"
 SAF_pretoria_arms_desc:0 "L'aciérie existante à Pretoria s'est concentrée sur les tôles fortes. Cependant, avec quelques machines-outils, nous pouvons transformer une partie de l'usine en un centre de production d'armes légères."
 SAF_expand_the_rand_mines:0 "Agrandissez les mines Rand"
 SAF_expand_the_rand_mines_desc:0 "Les mines de Rand comptent parmi les mines d'or les plus profondes au monde, même avec la technologie du XIXe siècle. Nous sommes capables de bien plus maintenant. Creusez profondément ! Et même avec gourmandise."
 SAF_fund_the_university_of_south_africa:0 "Financer l'Université d'Afrique du Sud"
 SAF_fund_the_university_of_south_africa_desc:0 "L'Université d'Afrique du Sud de Pretoria est l'une des meilleures universités du continent, même de l'hémisphère sud. En y investissant, nous pouvons développer nos propres talents locaux au lieu d'envoyer nos jeunes à l'étranger."
 SAF_establish_the_atomics_energy_board:0 "Créer l'Office de l'énergie atomique"
 SAF_establish_the_atomics_energy_board_desc:0 "Les armes atomiques constitueront la plus grande avancée militaire depuis la poudre à canon, sans parler des utilisations pacifiques de cette puissance si nous parvenons à exploiter l'atome. Rassemblez nos meilleurs scientifiques pour étudier cela."
 SAF_the_cape_defense_institute:0 "L'Institut de Défense du Cap"
 SAF_the_cape_defense_institute_desc:0 "Maintenant que l'Afrique du Sud est pleinement une nation souveraine, nous n'avons plus accès à des prototypes et à des plans avancés comme nous le faisions auparavant. Nous devons veiller à toujours garder une longueur d'avance sur nos ennemis et à ne pas prendre de retard en matière de technologie."
 SAF_defense_collaboration_initiative:0 "Initiative de collaboration en matière de défense"
 SAF_defense_collaboration_initiative_desc:0 "Les Britanniques nous ont montré l'avantage de partager les progrès scientifiques entre alliés proches. L'ensemble de notre faction sera en mesure de mener plus efficacement la R&D en temps de guerre si nous prenons les mesures nécessaires pour coordonner cela."
 SAF_special_service_battalion:0 "Bataillon des services spéciaux"
 SAF_special_service_battalion_desc:0 "L'Afrique du Sud regorge de jeunes hommes au chômage qui ont besoin de trouver quelque chose d'utile à faire. Le bataillon des services spéciaux inculquera une discipline et une organisation indispensables."
 SAF_improve_the_three_oh_three:0 "Améliorer les Trois Oh Trois"
 SAF_improve_the_three_oh_three_desc:0 "Les troupes sud-africaines combattront dans des climats variés et nous avons la chance que le fusil Lee-Enfield soit facilement personnalisable. La cartouche.303 a été modifiée à plusieurs reprises par d'autres pays pour répondre à leurs besoins."
 SAF_q_services_corps:0 "Corps des services Q"
 SAF_q_services_corps_desc:0 "Le Q Services Corps sera l'autorité centralisée responsable de la logistique et de l'approvisionnement de l'armée permanente. Il s'occupera de la distribution du pétrole, des rations, des munitions et des uniformes."
 SAF__south_african_military_college:0 "Collège militaire sud-africain"
 SAF__south_african_military_college_desc:0 "L'Afrique du Sud devrait se doter d'une académie militaire sur le modèle de celle de West Point aux États-Unis. Cela nous donnera un corps d'officiers professionnels fidèles à l'Union."
 SAF_expand_the_south_african_artillery:0 "Développer l'artillerie sud-africaine"
 SAF_expand_the_south_african_artillery_desc:0 "Le corps d'artillerie a été unifié en 1934. Le moment est désormais venu d'augmenter sa taille et sa capacité."
 SAF_sa_engineer_corps:0 "Corps du génie SA"
 SAF_sa_engineer_corps_desc:0 "Le Corps du génie sud-africain compte à peine 600 hommes en uniforme. C'est inacceptable dans une armée moderne. Nous avons besoin de plus d'hommes et de plus de formation pour cette tâche cruciale."
 SAF_equipment_effort:0 "Effort d'équipement"
 SAF_equipment_effort_desc:0 "Nous ne pouvons pas négliger la fourniture du matériel de soutien nécessaire à notre armée. Les canons et les chars, c'est bien beau, mais nous avons besoin d'uniformes, de radios, de kits de réparation et bien plus encore."
 SAF_south_african_special_forces:0 "Forces spéciales sud-africaines"
 SAF_south_african_special_forces_desc:0 "L'Afrique du Sud a besoin d'une escouade commando locale pour accomplir ces tâches difficiles dans des endroits difficiles d'accès."
 SAF_mechanization_effort:0 "Effort de mécanisation"
 SAF_mechanization_effort_desc:0 "La guerre motorisée et mécanisée est à nos portes. Le Grand Trek du futur sera guidé par des véhicules à chenilles et à roues."
 SAF_armor_effort:0 "Effort d'armure"
 SAF_armor_effort_desc:0 "Les chars ont parcouru un long chemin depuis les bêtes paresseuses de la dernière guerre. Nos recherches et notre formation ne peuvent pas être à la traîne par rapport à celles de nos ennemis - ou de nos amis."
 SAF_commit_to_the_five_year_plan:0 "S'engager envers le plan quinquennal"
 SAF_commit_to_the_five_year_plan_desc:0 "Nous avons élaboré un plan quinquennal pour la modernisation et l'expansion de l'armée de l'air sud-africaine. Le gouvernement doit s'engager publiquement à ne pas prendre de retard sur ce calendrier."
 SAF_improve_the_hawker_hartbees:0 "Améliorer les Hawker Hartbees"
 SAF_improve_the_hawker_hartbees_desc:0 "Les Hawker Hartbees dont nous disposons ne sont pas les combattants les plus avancés au monde, mais nous nous débrouillerons. Une mécanique et une formation améliorées permettront de tirer le meilleur parti de ces biplans."
 SAF_replace_the_blenheim:0 "Remplacer le Blenheim"
 SAF_replace_the_blenheim_desc:0 "Le Bristol Blenheim est un bombardier léger utilisable pour la RAF et les Dominions. Mais il est peut-être temps de trouver quelque chose de plus robuste, avec une plus grande portée."
 SAF_perfect_the_cab_rank_technique:0 "Perfectionner la technique du « Cab-Rank »"
 SAF_perfect_the_cab_rank_technique_desc:0 "La technique « Cab-Rank » consiste en une série de bombardiers qui frappent une cible un par un, sur une longue rangée. Cela maintient la pression sur l'ennemi, mais demande beaucoup d'habileté."
 SAF_desert_air_force:0 "Force aérienne du désert"
 SAF_desert_air_force_desc:0 "Le ciel du désert est clair et la chaleur et le sable nécessitent une attention particulière à la mécanique de nos avions. Il existe des compétences précieuses à acquérir dans cet environnement impitoyable."
 SAF_secure_the_cape_sea_route:0 "Sécurisez la route maritime du Cap"
 SAF_secure_the_cape_sea_route_desc:0 "Si le canal de Suez tombe, le Cap redeviendra la porte d'entrée vers l'Est. Défendez-le à tout prix."
 SAF_retain_experienced_pilots:0 "Retenir les pilotes expérimentés"
 SAF_retain_experienced_pilots_desc:0 "Trop souvent, nos pilotes expérimentés rejoignent la RAF au lieu de rester dans nos propres forces. La RAF a de meilleures opportunités d'avancement et de combat. Mais nous devrions nous efforcer de garder nos pilotes formés près de chez nous, où ils peuvent inspirer et éduquer d'autres Sud-Africains."
 SAF_seaward_defence_force:0 "Force de défense vers la mer"
 SAF_seaward_defence_force_desc:0 "La Seaward Defence Force constitue notre marine depuis deux décennies. Son financement devrait être augmenté."
 SAF_protect_the_trade:0 "Protéger le commerce"
 SAF_protect_the_trade_desc:0 "La dernière guerre a montré l'importance des convois et des escortes. L'Afrique du Sud se trouve sur une route commerciale majeure et doit veiller à ce que les marchandises parviennent à destination."
 SAF_disrupt_the_trade:0 "Perturber le commerce"
 SAF_disrupt_the_trade_desc:0 "La dernière guerre a montré l'importance des convois et des escortes. L'Afrique du Sud se trouve sur une route commerciale majeure et est idéalement située pour intercepter et détruire les navires ennemis."
 SAF_expand_the_simons_town_base:0 "Agrandissez la base de Simon's Town"
 SAF_expand_the_simons_town_base_desc:0 "Simon's Town, au Cap, est la base navale la plus importante d'Afrique australe depuis les années 1790. Il devrait être réaménagé et agrandi pour accueillir des navires plus nombreux et plus grands."
 SAF_anti_submarine_tactics:0 "Tactiques anti-sous-marines"
 SAF_anti_submarine_tactics_desc:0 "Les sous-marins menacent les navires qui passent par le cap de Bonne-Espérance. Nous devons les trouver et les détruire."
 SAF_submarine_warfare:0 "Guerre sous-marine"
 SAF_submarine_warfare_desc:0 "Les convois commerciaux ennemis continuent d'emprunter le passage par le cap de Bonne-Espérance. Nous les frapperons par le bas."
 SAF_prepare_overseas_offensive:0 "Préparer une offensive à l'étranger"
 SAF_prepare_overseas_offensive_desc:0 "Avec des kilomètres de côtes, l'Afrique du Sud est apte à entraîner ses soldats à la guerre amphibie. C'est l'une des compétences les plus difficiles, mais nos garçons peuvent la gérer."
 SAF_strengthen_the_cape_garrison_artillery:0 "Renforcer l'artillerie de la garnison du Cap"
 SAF_strengthen_the_cape_garrison_artillery_desc:0 "Les canons de la garnison du Cap doivent être améliorés et augmentés pour protéger le Cap des attaques ennemies."
 SAF_civil_war_tt:1 "§RUne guerre civile éclatera§! entre §Ynationalistes fascistes§! dans le Sud-Ouest africain et §Yunionistes démocrates§! dans le reste du pays."
 SAF_german_research_tt:0 "Nous conclurons un accord de partage de technologie avec l'Allemagne."
 scw_in_progress_tt:0 "L'Espagne est en guerre civile."
 NZL_transfer_the_new_zealand_division:0 "Transférer la division néo-zélandaise"
 NZL_transfer_the_new_zealand_division_desc:0 "La 2e Division néo-zélandaise a été mobilisée pour l'action, nous devrions donc l'envoyer là où se déroulent les combats. La division néo-zélandaise de la Grande Guerre était rattachée à la Méditerranée, tout comme la nouvelle division."
 NZL_form_the_rnzn:0 "Former le RNZN"
 NZL_form_the_rnzn_desc:0 "Notre patrouille côtière, autrefois petite, s'est désormais développée pour inclure des navires capables d'opérer indépendamment de la supervision de la Royal Navy. La Nouvelle-Zélande aura sa propre marine."
 NZL_expand_devonport_naval_base:0 "Agrandir la base navale de Devonport"
 NZL_expand_devonport_naval_base_desc:0 "La base navale de Devonport sera le quartier général de notre marine, mais elle doit être agrandie pour répondre aux nouvelles exigences d'une guerre totale."
 NZL_coastal_defense:0 "Défense côtière"
 NZL_coastal_defense_desc:0 "La Nouvelle-Zélande est une nation insulaire, loin des ennemis, nous devons donc nous préparer à une attaque amphibie le long de nos côtes."
 NZL_destroyer_effort:0 "Effort du Destructeur"
 NZL_destroyer_effort_desc:0 "Grâce à notre petite base industrielle, les destroyers constituent le moyen le plus efficace pour la Nouvelle-Zélande de projeter sa puissance navale. Patrouillez les côtes, interceptez les sous-marins et installez des piquets d'alerte précoce."
 NZL_submarine_effort:0 "Effort sous-marin"
 NZL_submarine_effort_desc:0 "Puisque toute invasion devra se faire par voie maritime, les loups de l'océan peuvent constituer une solide ligne de défense. Furtive et chassant en meute, une flotte sous-marine peut protéger nos voies maritimes."
 NZL_light_cruiser_effort:0 "Effort de croiseur léger"
 NZL_light_cruiser_effort_desc:0 "Les navires de taille moyenne conviennent à une puissance de taille moyenne. Les croiseurs légers peuvent être puissants, mais ont la vitesse nécessaire pour échapper à des engagements majeurs si nécessaire."
 NZL_capital_ship_effort:0 "Effort en matière de navires capitaux"
 NZL_capital_ship_effort_desc:0 "Si la Nouvelle-Zélande veut avoir une marine de premier ordre, elle doit disposer de navires de premier ordre. Nous devons investir dans des cuirassés et des croiseurs lourds."
 NZL_expand_the_nzpaf:0 "Élargir le NZPAF"
 NZL_expand_the_nzpaf_desc:0 "L'armée de l'air permanente néo-zélandaise a besoin de nouveaux bateaux de patrouille côtière et de bombardiers navals. Les nations modernes ne peuvent négliger la guerre aérienne,"
 NZL_form_the_rnzaf:0 "Former la RNZAF"
 NZL_form_the_rnzaf_desc:0 "Le moment est venu de rendre l'armée de l'air indépendante des autres armes de combat. La Royal New Zealand Air Force disposera de sa propre structure de commandement mais coopérera étroitement avec la Royal Air Force."
 NZL_fighter_focus:0 "Concentration du combattant"
 NZL_fighter_focus_desc:0 "Les chasseurs sont efficaces pour intercepter et escorter les bombardiers qui seront l'arme décisive pour nos alliés."
 NZL_bomber_focus:0 "Focus sur les bombardiers"
 NZL_bomber_focus_desc:0 "Les bombardiers légers peuvent protéger efficacement nos côtes et seront nécessaires dans la lutte outre-mer contre nos ennemis."
 NZL_defend_our_islands:0 "Défendre nos îles"
 NZL_defend_our_islands_desc:0 "Nous devons être prêts à attaquer notre île paradisiaque depuis la mer. Les bombardiers navals peuvent intercepter et attaquer des péniches de débarquement ou même cibler des navires capitaux."
 NZL_modern_fighters:0 "Combattants modernes"
 NZL_modern_fighters_desc:0 "Il est temps de mettre à niveau nos modèles de chasseurs vers des vaisseaux plus rapides et dotés d'une plus grande portée. Nos alliés ont montré la voie avec certains des avions les plus avancés que le monde ait jamais vu."
 NZL_heavy_bombers:0 "Bombardiers lourds"
 NZL_heavy_bombers_desc:0 "La guerre ne peut être gagnée qu'en frappant au coeur de la patrie ennemie. Des bombardiers lourds sont nécessaires pour porter un coup dévastateur aux usines et aux villes ennemies."
 NZL_national_roads_board:0 "Conseil national des routes"
 NZL_national_roads_board_desc:0 "Le terrain accidenté de la Nouvelle-Zélande a découragé la mise en place d'un système cohérent de construction de routes, mais nous devons améliorer ce qui est en place. Un réseau routier devrait être étudié, les routes devraient être pavées et de nouveaux sentiers tracés à travers les montagnes."
 NZL_new_zealand_steel:0 "Acier néo-zélandais"
 NZL_new_zealand_steel_desc:0 "La Nouvelle-Zélande a la chance de disposer d'abondantes réserves de sable ferreux, en particulier sur l'île du Nord. Il faut un processus spécial pour extraire le minerai de ce sable, mais il peut servir de pierre angulaire de notre industrie sidérurgique pour les années à venir."
 NZL_taranaki_oil:0 "Huile de taranaki"
 NZL_taranaki_oil_desc:0 "La région de Taranaki, sur l'île du nord, est riche en minéraux et en pétrole. Les entrepreneurs ont tenté d'exploiter ces réserves pétrolières, mais davantage d'investissements sont nécessaires dans les raffineries et les forages."
 NZL_wairarapa_sheep_farms:0 "Fermes de moutons Wairarapa"
 NZL_wairarapa_sheep_farms_desc:0 "L'industrie lainière de Wairarapa est l'une des pierres angulaires de l'économie néo-zélandaise. À mesure que le monde sortira de la dépression, la demande pour notre laine augmentera."
 NZL_bureau_of_industry:0 "Bureau de l'Industrie"
 NZL_bureau_of_industry_desc:0 "La Nouvelle-Zélande est une société agraire, qui met l'accent sur l'élevage. Le Bureau of Industry doit encourager de gros investissements dans les infrastructures et la fabrication."
 NZL_department_of_scientific_and_industrial_research:0 "Département de Recherche Scientifique et Industrielle"
 NZL_department_of_scientific_and_industrial_research_desc:0 "Les autres pays du Commonwealth et du Dominion investissent dans la recherche scientifique et industrielle, nous devrions donc faire de même."
 NZL_industrial_conscription:0 "Conscription industrielle"
 NZL_industrial_conscription_desc:0 "Il n'y a aucune raison pour qu'un homme valide ne serve pas dans les forces armées ou ne travaille pas dans une industrie liée à la guerre. Nos nouvelles lois mettront toutes les épaules au volant de la mobilisation et de la production."
 NZL_think_big:0 "Pensez grand"
 NZL_think_big_desc:0 "Nous avons pris l'habitude de nous considérer comme un Dominion inférieur à celui de nos alliés australiens ou canadiens. Mais la Nouvelle-Zélande est tout à fait capable de réaliser une grandeur industrielle."
 NZL_project_seal:0 "Sceau du projet"
 NZL_project_seal_desc:0 "Le projet Seal est une nouvelle initiative avec les Américains visant à développer une arme capable de déclencher des tsunamis pour submerger nos ennemis. C'est un peu fantaisiste, mais la bombe rebondissante qui a été développée s'avère très prometteuse."
 NZL_national_defense_institute:0 "Institut de la Défense Nationale"
 NZL_national_defense_institute_desc:0 "Maintenant que la Nouvelle-Zélande est pleinement une nation souveraine, nous n'avons plus accès à des prototypes et à des plans avancés comme nous le faisions auparavant. Nous devons veiller à toujours garder une longueur d'avance sur nos ennemis et à ne pas prendre de retard en matière de technologie."
 NZL_expand_the_university_of_auckland:0 "Agrandir l'Université d'Auckland"
 NZL_expand_the_university_of_auckland_desc:0 "L'Université d'Auckland est notre établissement postsecondaire le plus important. En agrandissant ses installations, nous pouvons essayer de garder certains de nos meilleurs esprits ici chez nous."
 NZL_army_reforms:0 "Réformes de l'armée"
 NZL_army_reforms_desc:0 "Nous devons moderniser le système de formation et de promotion de notre armée. De cette façon, nous pouvons être préparés à toute éventualité dans le cadre de la crise mondiale actuelle."
 NZL_charlton_automatic_rifle:0 "Fusil automatique Charlton"
 NZL_charlton_automatic_rifle_desc:0 "Un de nos concitoyens a modifié le fusil Lee Enfield standard en un pistolet entièrement automatique. C'est là le meilleur de l'ingéniosité néo-zélandaise et nous devrions encourager l'innovation dans ce sens."
 NZL_bob_semple_tank:0 "Réservoir Bob Semple"
 NZL_bob_semple_tank_desc:1 "Pourquoi la Nouvelle-Zélande ne devrait-elle pas avoir son propre char ? Le ministère des Travaux publics de Temuka développe un char léger armé uniquement de mitrailleuses. Même si nous n'allons jamais au-delà d'un prototype, l'expérience que nous acquerrons sera inestimable."
 NZL_domestic_arms_industry:0 "Industrie nationale de l'armement"
 NZL_domestic_arms_industry_desc:0 "Nous devrions consacrer autant d'industries que possible à la production d'armes légères. Nous avons besoin de munitions, de pièces d'armes, d'équipements de soutien, etc. Ceux-ci peuvent être fabriqués localement."
 NZL_schofield_tank:0 "Réservoir Schofield"
 NZL_schofield_tank_desc:0 "Si le char Semple ne répondait pas à nos besoins, peut-être qu'un char équipé d'un canon approprié ferait l'affaire. Le système combiné roue/chenille est original et pourrait nous amener à de nouvelles perspectives dans la conception des chars."
 NZL_long_range_patrol:0 "Patrouille à longue portée"
 NZL_long_range_patrol_desc:0 "La Long Range Patrol est destinée à couvrir de vastes étendues de territoire en Afrique du Nord. Cette unité de reconnaissance et de commando entreprendra des missions spéciales dans certains des climats les plus rigoureux de la planète."
 NZL_artillery_focus:0 "Focus sur l'artillerie"
 NZL_artillery_focus_desc:0 "L'artillerie est cruciale pour soutenir tout mouvement vers l'avant de notre infanterie. Élargir la recherche sur la balistique et les canons à canon plus gros."
 NZL_big_bob_tank:0 "Débardeur Big Bob"
 NZL_big_bob_tank_desc:0 "Les champs de bataille d'Europe nécessitent des blindés plus lourds pour rivaliser avec les super tanks de nos ennemis. Le Big Bob sera la contribution de la Nouvelle-Zélande à cet effort de conception."
 NZL_research_collaboration:0 "Collaboration en recherche"
 NZL_research_collaboration_desc:0 "Les Britanniques nous ont montré l'avantage de partager les progrès scientifiques entre alliés proches. L'ensemble de notre faction sera en mesure de mener plus efficacement la R&D en temps de guerre si nous prenons les mesures nécessaires pour coordonner cela."
 NZL_the_first_labor_government:0 "Le premier gouvernement travailliste"
 NZL_the_first_labor_government_desc:0 "Le premier gouvernement travailliste de Nouvelle-Zélande a la possibilité de poursuivre un programme social et économique progressiste. La réglementation industrielle, les droits des travailleurs, les lois sur la protection sociale et les règles salariales sont tous à l'ordre du jour."
 NZL_ratana_alliance:0 "Alliance Ratana"
 NZL_ratana_alliance_desc:0 "Une alliance avec le mouvement Ratana amènera les Maoris néo-zélandais au gouvernement et, espérons-le, commencera à panser certaines des blessures de la conquête britannique."
 NZL_maori_affairs_act:0 "Loi sur les affaires maories"
 NZL_maori_affairs_act_desc:0 "Une grande partie des terres appartenant aux Maoris est économiquement improductive. Si nous pouvons le consolider et en placer davantage sous le contrôle du gouvernement, nous pouvons transformer ces zones arides en sites industriels et commerciaux fructueux."
 NZL_social_security_act:0 "Loi sur la sécurité sociale"
 NZL_social_security_act_desc:0 "Les chômeurs néo-zélandais doivent être pris en charge jusqu'à ce que l'économie se redresse et que davantage d'emplois soient disponibles. Nous avons commencé avec une prime de Noël en 1935, mais le moment est venu de mettre en place un véritable filet de sécurité sociale pour tous les citoyens."
 NZL_the_manpower_act:0 "La loi sur la main-d'oeuvre"
 NZL_the_manpower_act_desc:0 "Depuis le début de la guerre, les Maoris sont venus en grand nombre dans les villes. Le Manpower Act nous permettra de diriger ces énergies vers les usines néo-zélandaises."
 NZL_amend_the_maori_affairs_act:0 "Modifier la loi sur les affaires maories"
 NZL_amend_the_maori_affairs_act_desc:0 "Nous devons modifier la loi sur les affaires maories afin qu'elle stimule la productivité des terres sous-utilisées, sans pour autant déplacer inutilement nos citoyens maoris."
 NZL_waitangi_tribunal:0 "Tribunal de Waitangi"
 NZL_waitangi_tribunal_desc:0 "Les Néo-Zélandais britanniques devraient accepter ce que leurs ancêtres ont fait pour déplacer, perturber et marginaliser les Maoris de Nouvelle-Zélande. Guerres sanglantes, saisies de terres et droits naturels ignorés. Reconnaître cet héritage est une étape vers la guérison."
 NZL_maori_conscription:0 "Conscription maorie"
 NZL_maori_conscription_desc:0 "Le courage et l'héroïsme du bataillon maori attaché au corps expéditionnaire sont un signe que nous devrions tirer le meilleur parti de l'ensemble de notre population en enrôlant même les Maoris réticents dans le service."
 NZL_maori_volunteers:0 "Volontaires maoris"
 NZL_maori_volunteers_desc:0 "Faisant preuve de patriotisme, des centaines de Maoris se portent volontaires pour servir dans l'armée néo-zélandaise."
 NZL_strengthen_the_commonwealth:0 "Renforcer le Commonwealth"
 NZL_strengthen_the_commonwealth_desc:0 "En tant que petit Dominion, il est important de rester proche de nos amis et de notre famille. Nous renforcerons nos liens avec nos compatriotes britanniques."
 NZL_statute_of_westminster:0 "Statut de Westminster"
 NZL_statute_of_westminster_desc:0 "Le Statut de Westminster nous donne une plus grande indépendance sous la Couronne tout en nous gardant au sein de l'Empire."
 NZL_2nzef:0 "2NZEF"
 NZL_2nzef_desc:0 "Malgré les horreurs de la dernière guerre, la Nouvelle-Zélande est prête à marcher à nouveau. La 2e force expéditionnaire néo-zélandaise est en cours d'organisation au moment où nous parlons."
 NZL_arrest_pacifist_leaders:0 "Arrêter les dirigeants pacifistes"
 NZL_arrest_pacifist_leaders_desc:0 "L'heure n'est pas aux dissensions au sein du pays. Tout le monde doit se concentrer sur la victoire de la guerre, et si cela signifie arrêter tous ceux qui s'expriment contre la guerre, alors c'est ce que nous ferons."
 NZL_technology_sharing_with_britain:0 "Partage de technologie avec la Grande-Bretagne"
 NZL_technology_sharing_with_britain_desc:0 "La base scientifique et industrielle de la Grande-Bretagne dépasse de loin la nôtre, mais comme nous sommes une famille, ils sont prêts à partager ce qu'ils savent avec nous."
 NZL_the_lee_affair:0 "L'affaire Lee"
 NZL_the_lee_affair_desc:0 "John Lee, député de Grey Lynn, a causé des problèmes au sein du caucus travailliste. Il milite en faveur d'un programme plus radical au lieu de la voie prudente que nous suivons. Des mesures doivent être prises pour apaiser sa révolte."
 NZL_empower_the_working_class:0 "Autonomiser la classe ouvrière"
 NZL_empower_the_working_class_desc:0 "Le parti travailliste défend la classe ouvrière depuis sa création ; en effet, nombre de nos dirigeants sont issus de la classe ouvrière. Faisons pression pour que les syndicats bénéficient de protections et de pouvoirs plus spectaculaires."
 NZL_join_comintern:0 "Rejoignez le Komintern"
 NZL_join_comintern_desc:0 "Le moment est venu de former une alliance avec nos frères socialistes. Grâce au Komintern, nous atteindrons le paradis des travailleurs."
 NZL_technology_sharing_with_soviet_union:0 "Partage de technologie avec l'Union soviétique"
 NZL_technology_sharing_with_soviet_union_desc:0 "L'Union soviétique compte bon nombre des meilleurs scientifiques et innovateurs technologiques du monde. Ils sont assez généreux pour partager ce qu'ils savent avec nous, leurs compagnons d'armes."
 NZL_in_the_darkness:0 "Dans l'obscurité"
 NZL_in_the_darkness_desc:0 "Il existe une pourriture inhérente aux systèmes démocratiques défendus par notre mère patrie. La véritable force ne peut être démontrée par le compromis."
 NZL_befriend_japan:0 "Devenez ami avec le Japon"
 NZL_befriend_japan_desc:0 "En tant que nation du Pacifique, il est dans l'intérêt de notre sécurité de nous ranger du côté de la puissance la plus puissante de la région. Le Japon et ses puissantes marines peuvent nous protéger des dangers du monde."
 NZL_rule_them_all:0 "Dirigez-les tous"
 NZL_rule_them_all_desc:0 "Les nations antipodes du Pacifique Sud devraient former une seule puissance unie. L'Australie devrait envisager de se soumettre à notre philosophie supérieure."
 NZL_technology_sharing_with_japan:0 "Partage de technologie avec le Japon"
 NZL_technology_sharing_with_japan_desc:0 "Le Japon compte bon nombre des meilleurs scientifiques et innovateurs technologiques du monde. Ils sont assez généreux pour partager ce qu'ils savent avec nous, leurs frères d'armes."
 NZL_constitution_amendment_act:0 "Loi modifiant la Constitution"
 NZL_constitution_amendment_act_desc:0 "Le moment est venu pour la Nouvelle-Zélande d'envisager de se séparer de la domination britannique. Nous modifierons notre constitution pour exercer un plus grand contrôle sur nos propres affaires."
 NZL_independent_new_zealand:0 "Nouvelle-Zélande indépendante"
 NZL_independent_new_zealand_desc:0 "Nous sommes désormais une République ! La Nouvelle-Zélande ne doit rien au Royaume-Uni, si ce n'est la gratitude que tout enfant doit à sa mère pour l'avoir élevé en toute sécurité. Mais nous devons quitter le nid sûr du Commonwealth et considérer le monde en gardant à l'esprit nos propres intérêts."
 NZL_transfer_ships_tt:0 "[ENG.GetNameDefCap] nous transfère §Y2 Light Cruisers§!."
 RAJ_provincial_elections:0 "Élections provinciales"
 RAJ_provincial_elections_desc:0 "La nouvelle loi sur le gouvernement indien impose des élections dans les provinces, établissant ainsi une certaine mesure de gouvernement local responsable envers la population indienne. Nous verrons quel effet cela a sur la domination britannique."
 RAJ_swaraj:0 "Swaraj"
 RAJ_swaraj_desc:0 "Le concept d'autonomie de Gandhi - Swaraj - gagne en popularité dans toute l'Inde. Il prône une rupture totale avec les institutions et coutumes britanniques et des groupes Swaraj s'activent dans les écoles indiennes."
 RAJ_indian_national_congress:0 "Congrès national indien"
 RAJ_indian_national_congress_desc:0 "Le Congrès national indien a connu un grand succès lors des élections à travers le sous-continent. Ils sont une voix forte en faveur d'une Inde indépendante, ou du moins d'une Inde dotée d'une plus grande autonomie au sein de l'Empire."
 RAJ_quit_india_movement:0 "Mouvement pour quitter l'Inde"
 RAJ_quit_india_movement_desc:0 "La campagne de Gandhi pour l'indépendance de l'Inde a atteint son point culminant avec un appel aux Britanniques à quitter l'Inde. Il est inconcevable que le Raj puisse prendre fin avant la fin de la guerre, mais la situation sur le terrain devient de jour en jour plus tendue."
 RAJ_all_india_forward_bloc:0 "Bloc avancé de toute l'Inde"
 RAJ_all_india_forward_bloc_desc:0 "Le All India Forward Bloc estime que le désengagement britannique de l'Inde prend trop de temps. Une position plus forte, voire militante, doit être adoptée."
 RAJ_seek_help_from_soviet:0 "Demander de l'aide au Soviétique"
 RAJ_seek_help_from_soviet_promised:0 " L'Union soviétique a promis son aide"
 RAJ_seek_help_from_soviet_desc:0 "L'Union soviétique constitue l'équilibre naturel de la puissance impériale britannique. Ils prétendent qu'ils sont le moteur de la révolution et nous devrions les encourager à exporter leur révolution en Inde."
 RAJ_indian_peoples_army:0 "Armée du peuple indien"
 RAJ_indian_peoples_army_effect:0 "Les partisans communistes déclenchent une guerre civile pour la liberté. La taille dépend du soutien du parti et des progrès en matière d'autonomie. "
 RAJ_indian_peoples_army_support:0 "[SOV.GetNameDefCap] soutiendra leur cause."
 RAJ_indian_peoples_army_desc:0 "Nous devrions organiser une force militaire qui tirerait les leçons de la cause communiste et s'allierait à elle."
 RAJ_research_city_excursions:0 "Recherche d'excursions en ville"
 RAJ_research_city_excursions_desc:0 "Les villes de recherche soviétiques sont une merveille et la population indienne regorge d'esprits énergiques et intelligents. L'envoi de nos jeunes ingénieurs dans ces villes nous aidera à développer une base nationale de recherche et d'industrie."
 RAJ_combined_arms_academy:0 "Académie interarmes"
 RAJ_combined_arms_academy_desc:0 "La formation militaire soviétique peut être rendue plus efficace grâce à la nouvelle Académie interarmes. Nous pouvons nous tenir au courant de la guerre moderne en utilisant la puissance aérienne, terrestre et maritime."
 RAJ_rani_of_jhans:0 "Rani de Jhansi"
 RAJ_rani_of_jhans_desc:0 "Rani de Jhansi était une grande héroïne de la révolution indienne de 1857. Son exemple de bravoure et de fierté nationale est un modèle pour toutes les femmes indiennes qui souhaitent prendre les armes et former leur propre régiment."
 RAJ_rebuilding_the_nation:0 "Reconstruire la nation"
 RAJ_rebuilding_the_nation_desc:0 "L'oppresseur impérial étant expulsé et la population indienne mobilisée, le moment est venu de réparer les dégâts causés par deux siècles d'occupation."
 RAJ_seek_help_from_germany:0 "Demander de l'aide à l'Allemagne"
 RAJ_seek_help_from_germany_promised:0 " Le Reich allemand a promis son aide"
 RAJ_seek_help_from_germany_desc:0 "L'Allemagne ne nous a jamais fait de mal comme la Grande-Bretagne, et le Reich constitue le défi le plus plausible à la puissance britannique. Nous devrions nous rapprocher des puissances de l'Axe."
 RAJ_indian_national_army:0 "Armée nationale indienne"
 RAJ_indian_national_army_effect:0 "Les partisans fascistes déclenchent une guerre civile pour la liberté. La taille dépend du soutien du parti et des progrès en matière d'autonomie. "
 RAJ_indian_national_army_support:0 "[GER.GetNameDefCap] soutiendra leur cause."
 RAJ_indian_national_army_desc:0 "Une armée nationale indienne, distincte des forces sous contrôle britannique, a été organisée. Nous pouvons le construire dans des régions exemptes de toute ingérence britannique et nous aligner contre les Alliés, sapant ainsi la main-d'oeuvre indienne du Raj."
 RAJ_battaglione_azad_hindoustan:0 "Bataillon Azad Hindoustan"
 RAJ_battaglione_azad_hindoustan_desc:0 "L'Italie a formé le Battaglione Azad Hindoustan, un régiment d'anciens prisonniers de guerre indiens. Formé au sabotage, au parachutisme et à l'infiltration, le BAH pourrait être un grand pas en avant pour la fierté nationale."
#  RAJ_german_technology:1 "[Root.GetGermanTechnologyName]"
#  RAJ_german_technology_german:0 "German Technology"
#  RAJ_german_technology_japan:0 "Japanese Technology"
#  RAJ_german_technology_desc:0 "German scientists are the best in the world, and their military machine is based on the best modern engineering techniques. They are willing to share their advances with us."
#  RAJ_japanese_army_air_force_academy:1 "[Root.GetJAAFAName]"
#  RAJ_japanese_army_air_force_academy_german:0 "Luftwaffe Air Training School"
#  RAJ_japanese_army_air_force_academy_japan:0 "Japanese Army Air Force Academy"
#  RAJ_japanese_army_air_force_academy_desc:0 "The Japanese Air Force Academy has decided to welcome Indian recruits that wish to fight against European domination in Asia."
 RAJ_cripps_mission:0 "Mission de Cripps"
 RAJ_cripps_mission_desc:0 "Nous devons maintenir l'Inde fidèle à la cause alliée et britannique, malgré la ferveur nationaliste croissante pour l'indépendance. Sir Stafford Cripps est un négociateur habile qui peut garantir aux dirigeants nationalistes que leurs revendications seront prises en compte."
 RAJ_two_nation_theory:0 "Théorie des deux nations"
 RAJ_two_nation_theory_effect:0 "Le Pakistan sera libéré lorsque l'Inde aura retrouvé sa liberté.\n"
 RAJ_two_nation_theory_desc:0 "Bien que longtemps gouvernée comme un seul territoire, il est logique de voir l'Inde comme deux nations : une hindoue et une musulmane. La partition du pays n'est peut-être pas la seule solution, mais tout accord en faveur d'une Inde indépendante doit tenir compte de cette double nature du sous-continent."
 RAJ_princely_state_donations:0 "Donations de l'État princier"
 RAJ_princely_state_donations_desc:0 "Les États princiers de l'Inde ont fourni les hommes qui ont longtemps servi de base à l'armée indienne sous les Britanniques. D'autres dons de ces dirigeants locaux soulignent leur soutien à l'Empire."
 RAJ_imperial_service_troops:0 "Troupes du service impérial"
 RAJ_imperial_service_troops_desc:0 "Les troupes du service impérial sont recrutées par les princes de l'Inde et peuvent se compter par centaines de milliers. En ces temps difficiles, il est formidable de savoir que Sa Majesté peut compter sur la fidélité des rajas."
 RAJ_raf_funding:0 "Financement du RAF"
 RAJ_raf_funding_desc:0 "La Royal Air Force of India recevra davantage de financements et d'actifs du Royaume-Uni."
 RAJ_navy_funding:0 "Financement de la Marine"
 RAJ_navy_funding_effect:0 "§Y2 Croiseurs légers§! seront ajoutés à votre marine si vous possédez déjà la technologie.\n"
 RAJ_navy_funding_effect_mtg:0 "§Y2 Croiseurs légers§! de ce type seront ajoutés à notre marine.\n"
 RAJ_navy_funding_desc:0 "La Royal Navy indienne recevra davantage de financements et d'actifs du Royaume-Uni."
 RAJ_british_army_support:0 "Soutien de l'armée britannique"
 RAJ_british_army_support_desc:0 "L'armée britannique connaît bien l'Inde après 200 ans d'occupation. Ils connaissent les gens et le territoire et seront en mesure de soutenir la formation des soldats indiens pour combattre chez eux."
 RAJ_red_eagle_division:0 "Division Aigle Rouge"
 RAJ_create_unit_red_eagles_tt:0 "Gagnez une division d'infanterie d'élite à Delhi.\n"
 RAJ_red_eagle_division_desc:0 "La Division Red Eagle sera la première division indienne à être formée pour combattre outre-mer, prête à combattre dans des conditions difficiles "
 RAJ_chindits:0 "Chindits"
 RAJ_orde_wingate_tt:0 "Une compétence générale §Y4§! nommée §YOrde Wingate§! apparaîtra.\n"
 RAJ_chindits_desc:0 "L'Inde a besoin d'une division de forces spéciales, c'est pourquoi nous avons formé les Chindits pour opérer derrière les lignes ennemies dans les jungles d'Asie. Il s'agit d'une opération risquée qui entraînera un taux de pertes élevé, mais qui pourrait être d'une grande utilité pour l'effort de guerre."
 RAJ_jungle_training:0 "Entraînement dans la jungle"
 RAJ_jungle_training_effect:0 "Permet l'entraînement dans la jungle §H§!\n§HMarines\n    Jungle§!\n      Attaque : §G+5%§!\n      Mouvement : §G+10 %§!\n§HAlpinistes\n    Jungle§!\n      Attaque : §G+5%§!\n      Mouvement : §G+10 %§!\n§HParachutistes\n    Jungle§!\n      Attaque : §G+5%§!\n      Mouvement : §G+10 %§!\n"
 RAJ_jungle_training_desc:0 "L'Inde, la Birmanie et l'Indochine sont couvertes de jungle et un entraînement spécial est recommandé pour rendre nos soldats efficaces sur ce terrain dangereux."
 RAJ_lessons_of_the_great_war:0 "Les leçons de la Grande Guerre"
 RAJ_lessons_of_the_great_war_desc:0 "Les soldats coloniaux indiens ont participé à la dernière guerre mondiale et les leçons de ce conflit devraient être appliquées à la formation et à l'organisation de l'armée."
 RAJ_indianisation_of_army:0 "Indianisation de l'armée"
 RAJ_indianisation_of_army_desc:0 "Pour protéger correctement l'Inde dans une guerre totale, l'ensemble de la population indienne doit être mobilisée. Cela impliquera non seulement de recruter plus largement parmi la population indienne, mais également de permettre aux officiers indiens de prendre le commandement à un moment donné de la chaîne d'autorité."
 RAJ_indian_gurkhas:0 "Gurkhas indiens"
 RAJ_indian_gurkhas_desc:0 "Les Gurkhas des hauts plateaux du Pendjabi et du Népal sont légendaires pour leurs compétences militaires. Ils servent loyalement le Raj depuis de nombreuses années et excellent dans toutes sortes de guerres."
 RAJ_an_indian_sandhurst:0 "Un Sandhurst indien"
 RAJ_an_indian_sandhurst_desc:0 "L'Inde réclame sa propre école militaire depuis la dernière guerre, et nous l'avons finalement créée en 1932. L'Académie militaire indienne forme des officiers indiens depuis quelques années maintenant, nous donnant ainsi un noyau de commandement."
 RAJ_lions_of_the_great_war:0 "Lions de la Grande Guerre"
 RAJ_lions_of_the_great_war_desc:0 "Les Sikhs ont une forte tradition militaire et ont été hautement décorés lors de la dernière guerre. Les Lions du Pendjab forment à eux seuls un régiment puissant, et la région est prête à accueillir de nouveaux recrutements."
 RAJ_indian_gentlemen_officers:0 "Officiers messieurs indiens"
 RAJ_indian_gentlemen_officers_desc:0 "Les messieurs qui ont servi le Raj grâce à une étroite coopération avec les autorités impériales constituent une réserve de commandants prêts à l'emploi, au cas où nous aurions besoin d'hommes loyaux pour diriger la nouvelle armée indienne."
 RAJ_the_bangalore_torpedo:0 "La torpille de Bangalore"
 RAJ_the_bangalore_torpedo_desc:0 "L'une des plus grandes contributions de l'Inde britannique à l'art de la guerre est la torpille de Bangalore, une série de tuyaux connectés qui peuvent être utilisés pour détruire les obstacles pendant que les ingénieurs sont sous le feu. Cet appareil a acquis une grande popularité dans le monde entier. "
 RAJ_vickers_berthier_gun:0 "Pistolet Vickers-Berthier"
 RAJ_vickers_berthier_gun_desc:0 "Le Vickers-Berthier est un peu lourd mais a le mérite d'être facile à produire rapidement. Pour un pays comme l'Inde, il s'agit d'une caractéristique très importante d'une arme à feu."
 RAJ_royal_indian_artillery:0 "Artillerie royale indienne"
 RAJ_royal_indian_artillery_desc:0 "La Royal Indian Artillery existe depuis que la Compagnie des Indes orientales a formé un bataillon de canons avec des artilleurs indiens en 1748. Nous pouvons nous appuyer sur ces nombreuses décennies d'expérience."
 RAJ_army_motorization:0 "Motorisation de l'armée"
 RAJ_army_motorization_desc:0 "L'Inde est trop grande pour être parcourue efficacement par train et par cheval. L'armée devrait disposer de divisions motorisées et de transports réguliers par camions."
 RAJ_revive_the_screw_guns:0 "Faites revivre les pistolets à vis"
 RAJ_revive_the_screw_guns_effect:0 "Active §HMountain Gun§!\n§HArtillerie\n    Montagne§!: Mouvement : §G+15%§!\n§HAntichar\n    Montagne§!: Mouvement : §G+15%§!"
 RAJ_revive_the_screw_guns_desc:0 "Le terrain montagneux du nord de l'Inde a conduit au développement d'une pièce d'artillerie qui pouvait être démontée et transportée à dos de mulet partout où elle était nécessaire. Ce 7 livres est peut-être un peu obsolète, mais il ne faut pas ignorer son utilité."
 RAJ_indian_armor:0 "Armure indienne"
 RAJ_indian_armor_desc:0 "L'Inde devrait se concentrer sur le développement de sa propre division de blindés et de chars."
 RAJ_modernizing_army:0 "Moderniser l'armée"
 RAJ_modernizing_army_desc:0 "Pendant trop longtemps, les forces armées indiennes ont été considérées comme un simple avant-poste colonial, doté de peu d'avantages et d'équipements dont dispose l'armée britannique. Il est temps de moderniser ce que nous avons au Raj."
 RAJ_indian_defense_research:0 "Recherche sur la défense indienne"
 RAJ_indian_defense_research_desc:0 "Maintenant que l'Inde est pleinement une nation souveraine, nous n'avons plus accès à des prototypes et à des plans avancés comme nous le faisions auparavant. Nous devons veiller à toujours garder une longueur d'avance sur nos ennemis et à ne pas prendre de retard en matière de technologie."
 RAJ_british_pilot_training:0 "Formation de pilote britannique"
 RAJ_british_pilot_training_desc:0 "La Royal Air Force a accepté d'accepter des pilotes indiens pour suivre une formation. Cette formation sera d'une grande aide dans le développement de notre propre escadre aérienne."
 RAJ_expand_air_bases:0 "Agrandir les bases aériennes"
 RAJ_expand_air_bases_desc:0 "L'Inde est très vaste, donc patrouiller et protéger son espace aérien signifie que nous devons augmenter notre capacité aérienne dans nos bases à travers le sous-continent."
 RAJ_air_support_effort:0 "Effort de soutien aérien"
 RAJ_air_support_effort_desc:0 "La guerre interarmes est la nouvelle manière de faire la guerre, nous devons donc concentrer une partie de notre énergie sur la formation et la production d'avions capables de soutenir les forces terrestres et maritimes."
 RAJ_fighter_effort:0 "Effort de chasse"
 RAJ_fighter_effort_desc:0 "Nous avons besoin d'avions de combat pour escorter les bombardiers et intercepter tous les avions ennemis qui menacent notre nation."
 RAJ_royal_indian_air_force:0 "Force aérienne royale indienne"
 RAJ_royal_indian_air_force_desc:0 "Le moment est venu de transformer notre petite division aérienne en sa propre branche des forces armées. Une force aérienne nationale dotée d'un commandement indépendant sera mieux à même de servir le peuple indien et l'Empire."
 RAJ_the_smiling_buddha:0 "Le Bouddha souriant"
 RAJ_the_smiling_buddha_desc:0 "Les scientifiques sont sur le point de percer le secret de l'énergie atomique, ce qui conduira à la création d'explosifs très puissants. Nous ne pouvons pas rester à la traîne dans la quête des armes atomiques."
 RAJ_great_indian_peninsula_railway:0 "Chemin de fer de la grande péninsule indienne"
 RAJ_great_indian_peninsula_railway_desc:0 "Le contrôle gouvernemental du Great Indian Peninsula Railway en 1925 signifie que son expansion et son amélioration nous incombent. Une population croissante a besoin de meilleures infrastructures de transport."
 RAJ_industrial_expansion:0 "Expansion industrielle"
 RAJ_industrial_expansion_desc:0 "Des centaines de millions de personnes ont élu domicile en Inde - il n'y a aucune raison pour que cette population ne soit pas la base d'un géant industriel."
 RAJ_tata_steel:0 "Acier Tata"
 RAJ_tata_steel_desc:0 "Tata Steel est en passe de devenir le plus grand fabricant d'acier de l'Empire. Une production accrue alimentera davantage la modernisation de l'Inde."
 RAJ_assam_oil:0 "Huile d'Assam"
 RAJ_assam_oil_desc:0 "L'Assam est le centre de la production pétrolière indienne, notamment la raffinerie de Digboi. L'accès à cette ressource doit être élargi et exploité."
 RAJ_indian_institute_of_science:0 "Institut indien des sciences"
 RAJ_indian_institute_of_science_desc:0 "Le campus de l'Institut indien des sciences à Bangalore permet aux meilleurs et aux plus brillants membres de la population indienne de poursuivre nos progrès."
 RAJ_institute_of_fundamental_research:0 "Institut de recherche fondamentale"
 RAJ_institute_of_fundamental_research_desc:0 "Certains de nos scientifiques et industriels les plus éminents défendent la création d'un nouvel institut de recherche fondamentale pour tirer parti des dernières découvertes en sciences physiques."
 RAJ_research_collaboration:0 "Collaboration en recherche"
 RAJ_research_collaboration_desc:0 "Les Britanniques nous ont montré l'avantage de partager les progrès scientifiques entre alliés proches. L'ensemble de notre faction sera en mesure de mener plus efficacement la R&D en temps de guerre si nous prenons les mesures nécessaires pour coordonner cela."
 RAJ_expand_mazagon_dock:0 "Agrandir le quai Mazagon"
 RAJ_expand_mazagon_dock_desc:0 "Le Mazagon Dock de Mumbai est notre constructeur naval le plus important de la côte ouest. Elle a besoin d'une plus grande capacité dans cette crise mondiale."
 RAJ_found_scindia_shipyard:0 "Trouvé le chantier naval de Scindia"
 RAJ_found_scindia_shipyard_desc:0 "Nous avons besoin d'un chantier naval sur la côte est du pays. L'établissement du chantier naval Scindia à Visakhapatnam est donc logique pour notre avenir naval."
 RAJ_royal_indian_navy:0 "Marine royale indienne"
 RAJ_royal_indian_navy_desc:0 "La Marine royale indienne devra être rapidement développée. Les nouvelles tactiques et les nouveaux navires devraient être une priorité."
 RAJ_screening_effort:0 "Effort de dépistage"
 RAJ_screening_effort_desc:0 "L'Inde joue un rôle crucial dans la défense de la route sud menant au canal de Suez. Les missions de contrôle et d'escorte permettront aux approvisionnements et aux soldats vitaux d'accéder aux théâtres d'opérations européens et africains."
 RAJ_cruiser_effort:0 "Effort de croiseur"
 RAJ_cruiser_effort_desc:0 "Les croiseurs suffiront pour l'instant au développement et à l'expansion de la puissance navale indienne."
 RAJ_submarine_effort:0 "Effort sous-marin"
 RAJ_submarine_effort_desc:0 "Avec la montée en puissance de la puissance navale de surface japonaise en Asie, il pourrait être judicieux de diriger nos énergies sous la mer, en frappant depuis des sous-marins."
 RAJ_capital_ship_effort:0 "Effort en matière de navires capitaux"
 RAJ_capital_ship_effort_desc:0 "En tant qu'avant-poste britannique, l'Inde a pu constater la puissance des navires capitaux pour dominer les mers. Nous devrions construire nos propres croiseurs lourds et cuirassés."
 RAJ_modernizing_navy:0 "Moderniser la marine"
 RAJ_modernizing_navy_desc:0 "De meilleurs moteurs, plus d'espace pour l'équipage, une vitesse plus rapide et des canons plus gros. La marine indienne sera bientôt parmi les meilleures du continent."
 RAJ_east_india_railways:0 "Chemins de fer des Indes orientales"
 RAJ_east_india_railways_desc:0 "Le contrôle gouvernemental du chemin de fer des Indes orientales laisse toutes les décisions concernant son expansion et son amélioration entre les mains de nos ministres."
 RAJ_integrate_princely_railways:0 "Intégrer les Chemins de fer Princiers"
 RAJ_integrate_princely_railways_desc:0 "Certains princes indiens ont financé leurs propres systèmes ferroviaires, mais jusqu'à présent, ils ont été mal intégrés aux lignes ferroviaires construites par le Raj. Il faut faire quelque chose pour relier les trains du pays entre eux."
 RAJ_ishapore_arsenal:0 "Arsenal d'Ishapore"
 RAJ_ishapore_arsenal_desc:0 "L'arsenal et l'usine de fusils d'Ishapore sont en activité depuis le XVIIIe siècle. Il est à l'origine de nombreuses innovations dans la conception des armes à feu et constitue la pièce maîtresse de notre système de production d'armes."
 RAJ_clamp_down_on_corruption:0 "Réprimer la corruption"
 RAJ_clamp_down_on_corruption_desc:0 "Malgré les efforts industriels britanniques visant à développer le système ferroviaire indien, très peu de bénéfices de cette expansion semblent bénéficier à l'Inde. La corruption et le double jeu sont endémiques dans le secteur des transports et nous devons faire quelque chose pour y remédier."
 RAJ_strengthen_ties_with_british_investors:0 "Renforcer les liens avec les investisseurs britanniques"
 RAJ_strengthen_ties_with_british_investors_desc:0 "Pour développer nos usines et nos ressources, nous dépendons encore largement du capital britannique. Tant que nous n'aurons pas notre propre secteur bancaire vigoureux, nous devons nous mettre à genoux à Londres pour chercher du soutien."
 RAJ_british_rail_investors:0 "Investisseurs ferroviaires britanniques"
 RAJ_british_rail_investors_desc:0 "Les infrastructures civiles et de transport en Inde ont besoin d'une importante injection de liquidités de la part des financiers britanniques."
 RAJ_british_arms_investors:0 "Investisseurs britanniques en armement"
 RAJ_british_arms_investors_desc:0 "Si nous voulons faire démarrer rapidement nos usines d'armement, nous devrons demander aux banques britanniques d'investir dans nos infrastructures militaires."
 RAJ_indian_sandhurst_tt:0 "Une compétence générale §Y4§! nommée §YKodandera Madappa Cariappa§! apparaîtra.\nUne compétence générale §Y3§! nommée §YKodandera Subayya Thimayya§! apparaîtra.\nUne compétence générale §Y3§! nommée §YJayanto Nath Chaudhuri§! apparaîtra."
 RAJ_create_unit_gurkas_tt:0 "Gagnez une unité d'élite de Gurkhas à Delhi."
 RAJ_create_unit_rani_tt:0 "Gagnez une unité d'infanterie à Delhi."
 RAJ_create_unit_sikh_tt:0 "Gagnez une unité d'infanterie à Delhi."
 RAJ_create_general_rani_tt:0 "\nUne compétence générale §Y3§! nommée §YLakshmi Sahgal§! apparaîtra"
 continuous_naval_production:0 "Production navale"
 continuous_naval_production_desc:0 "En concentrant les ressources sur nos chantiers navals et en exemptant les constructeurs navals qualifiés du service militaire, nous pouvons réduire considérablement les délais de production des navires."
 continuous_air_production:0 "Production d'air"
 continuous_air_production_desc:0 "Nous pouvons réorganiser notre industrie aéronautique pour éliminer le gaspillage et rationaliser la production."
 continuous_non_factory_construct:0 "Génie de la construction"
 continuous_non_factory_construct_desc:0 "Il y a encore beaucoup de sous-emploi dans notre secteur de la construction. En y concentrant notre attention, nous pouvons obtenir une amélioration significative de la vitesse de construction. Malheureusement, la production de machines-outils s'est avérée être un goulot d'étranglement majeur dans l'expansion de notre industrie lourde, de sorte qu'elle ne bénéficiera pas des efforts dans ce domaine. "
 continuous_reduce_training_time:0 "Formation militaire"
 continuous_reduce_training_time_desc:0 "En créant des unités de formation avancée spécialisées au sein de chaque division, nous pouvons déployer même des divisions qui auraient auparavant été retenues pour terminer leur formation au front."
 continuous_suppression:0 "Suppression de la résistance"
 continuous_suppression_desc:0 "En infiltrant les principaux groupes de résistance dans les territoires occupés et en transformant leurs dirigeants, nous pouvons réduire considérablement les dégâts qu'ils peuvent causer."
 continuous_repair:0 "Réparation de construction"
 continuous_repair_desc:0 "Nous formerons des équipes de réparation spécialisées composées d'ouvriers d'usine et de construction et contrôlerons de manière centralisée leur déploiement pour améliorer la reconstruction des infrastructures endommagées."
 continuous_tech_share:0 "Partage de technologie"
 continuous_tech_share_desc:0 "Nous encouragerons nos instituts de recherche et nos universités à se rapprocher de leurs homologues des pays alliés. Cela nous rapportera un bonus de partage technologique."
 continuous_boost_freedom:0 "Augmenter l'autonomie"
 continuous_boost_freedom_desc:0 "En réorganisant notre bureaucratie coloniale et en recrutant des administrateurs autochtones, nous pourrons, avec le temps, prendre en charge nos propres affaires."
 continuous_restrict_freedom:0 "Supprimer les sujets"
 continuous_restrict_freedom_desc:0 "Nos sujets coloniaux ont eu des idées plutôt stupides sur des choses comme « l'autodétermination » ou « l'indépendance nationale ». Il est temps de les détromper de ces notions."
 subject_autonomy_mod_tt:0 "Autonomie dans les matières : §G-0,5§!"
 unlocks_decision:0 "Débloque la décision : "
 USA_continue_the_new_deal:1 "Poursuivre le New Deal"
 USA_continue_the_new_deal_desc:1 "Les politiques du New Deal ont prouvé leur efficacité. Nous ne devons pas nous perdre maintenant."
 USA_suspend_the_presecution:0 "Suspendre la persécution"
 USA_suspend_the_presecution_desc:0 "La persécution des citoyens américains en raison de leurs opinions politiques - aussi odieuses qu'elles puissent paraître - est fondamentalement en contradiction avec les valeurs de ce pays. Cela doit cesser immédiatement."
 USA_desegregate_the_armed_forces:1 "Déségréger les forces armées"
 USA_desegregate_the_armed_forces_desc:1 "Servir sous les armes dans les forces armées de son pays peut être un devoir malvenu, mais cela peut aussi être un droit précieux. Un droit dont beaucoup de nos citoyens se voient refuser en raison de leur ascendance."
 USA_full_desegregation:1 "Déségrégation complète"
 USA_full_desegregation_desc:1 "Depuis trop longtemps, certains de nos États traitent les gens différemment, sur la base de critères anciens, dépassés et inhumains. Dans une république libre, chaque citoyen doit être traité de manière égale - et non séparément."
 USA_democratic_socialism:1 "Socialisme démocratique"
 USA_democratic_socialism_desc:1 "Aucune personne sensée ne peut nier que le socialisme est l'avenir de la civilisation humaine. En même temps, aucun citoyen fier et patriote de cette république ne pourrait soutenir un système dans lequel le gouvernement n'est plus fait par le peuple et par le peuple. Comme nos fiers ancêtres, nous créerons une nouvelle forme de gouvernement qui combine les deux."
 USA_liberty_for_the_philippines:1 "Liberté pour les Philippines"
 USA_liberty_for_the_philippines_desc:1 "Le peuple des Philippines a montré sa capacité à organiser ses propres affaires, et il est temps que les derniers vestiges du contrôle américain sur leur pays soient officiellement éliminés."
 USA_pacific_decolonisation:1 "Décolonisation du Pacifique"
 USA_pacific_decolonisation_desc:1 "Il n'y a aucune justification - aucune - pour la présence continue des puissances européennes dans le Pacifique, ni pour maintenir les peuples des îles du Pacifique dans la servitude de leurs maîtres européens. L'Amérique ne restera plus les bras croisés alors que cette injustice perdure."
 USA_union_representation_act:1 "Loi sur la représentation syndicale"
 USA_union_representation_act_desc:1 "Le travail est un élément essentiel de la vie humaine, et la syndicalisation est un élément fondamental de l'organisation d'une société démocratique. Il est tout à fait normal que nous reconnaissions cela et garantissions que les syndicats soient obligatoirement représentés au Congrès."
 USA_old_age_pension_act:1 "Loi sur les pensions de vieillesse"
 USA_old_age_pension_act_desc:1 "Après une vie de travail, nos concitoyens méritent de jouir de la sécurité financière et du respect pendant leur vieillesse. La législation existante pour les soutenir est clairement insuffisante."
 USA_accumulated_wealth_tax_act:1 "Loi sur l'impôt sur la fortune accumulée"
 USA_accumulated_wealth_tax_act_desc:1 "Certaines personnes dans notre pays ont amassé des sommes absurdes. Cet argent reste passivement sur des comptes bancaires ou investi dans des bâtiments d'une taille impraticable, des meubles dorés et des peintures coûteuses. Aucun de ces éléments ne répond à un objectif économique viable. En instituant un nouvel impôt, nous forcerons ceux de nos citoyens qui ont accumulé une telle richesse inutile à réinvestir cet argent dans l'économie."
 USA_guarantee_the_american_dream:1 "Garantir le rêve américain"
 USA_guarantee_the_american_dream_desc:0 "La plupart de nos concitoyens ne souhaitent pas grand-chose dans la vie : un emploi stable, une bonne santé et un endroit où fonder une famille. Il n'y a aucune raison pour qu'ils ne le fassent pas."
 USA_worker_management_act:1 "Loi sur la gestion des travailleurs"
 USA_worker_management_act_desc:1 "Bien trop souvent, les usines et les bureaux sont dirigés par des personnes qui n'ont jamais travaillé dans l'atelier. Incapables de comprendre les réalités de la production, ils se fixent des attentes irréalistes. Pour protéger notre économie des dommages que ces dirigeants incompétents peuvent causer, nous imposerons une gestion des travailleurs, par les travailleurs, pour les travailleurs !"
 USA_militia_organization_act:1 "Loi sur l'organisation de la milice"
 USA_militia_organization_act_desc:1 "Notre fière république a une longue tradition de soldat citoyen. Si notre pays se trouvait un jour envahi par un attaquant étranger, celui-ci serait confronté à une milice bien organisée et bien armée d'hommes et de femmes combattant en territoire familier pour défendre leurs foyers."
 USA_communal_property_act:1 "Loi sur la propriété communale"
 USA_communal_property_act_desc:1 "Les besoins du plus grand nombre ne devraient jamais être dépassés par les désirs d'un petit nombre, ni même d'un seul. Pour garantir que tel soit le cas, nous adopterons une nouvelle législation pour permettre aux communautés locales d'exécuter plus facilement le domaine éminent."
 USA_reintegration:1 "Réintégration"
 USA_reintegration_desc:1 "La guerre a divisé notre nation, mais en fin de compte, même ceux qui se sont soulevés contre nous peuvent encore être rachetés. Lorsque la population aura pris conscience de ses erreurs, elle devra être autorisée à réintégrer le processus politique dans notre fière république."
 USA_reach_out_to_the_ware_group:1 "Contactez le groupe Ware"
 USA_reach_out_to_the_ware_group_desc:1 "Il existe un petit groupe de communistes dévoués au sein de notre gouvernement. Ils croient agir en secret, mais nous connaissons leurs noms. Peut-être pourraient-ils voir que nos objectifs correspondent et pourraient être persuadés de rejoindre le gouvernement."
 USA_us_ussr_economic_cooperation:1 "Coopération économique États-Unis-URSS"
 USA_us_ussr_economic_cooperation_desc:1 "Malgré sa naissance chaotique et sanglante, l'Union soviétique a réalisé des progrès remarquables dans la construction d'une société moderne et industrialisée. Nous devrions faire notre part pour les aider."
 USA_secure_china:1 "Sécuriser la Chine"
 USA_secure_china_desc:1 "La Chine est aux prises avec une guerre civile longue et sanglante. Le gouvernement nationaliste est profondément corrompu et a perdu tout soutien au sein de la population. Il est temps que nous commencions à soutenir le seul acteur en Chine qui peut unir et pacifier le pays : le Parti communiste."
 USA_end_monarchism:1 "Mettre fin au monarchisme"
 USA_end_monarchism_desc:1 "Les monarchies européennes ont déjà plongé le monde dans une guerre mondiale - nous ne pouvons pas leur permettre de recommencer. Nos ancêtres ont fait la guerre au roi d'Angleterre pour obtenir leur liberté - nous libérerons le monde de sa tyrannie pour toujours !"
 USA_shatter_the_empires:1 "Briser les empires"
 USA_shatter_the_empires_desc:1 "Nous étions autrefois la colonie d'un empire mondial, jusqu'à ce que nous achetions notre liberté par le sang. Notre république ne pourra pas vraiment se sentir en sécurité tant que ceux qui se rêvent maîtres de ce monde ne seront pas maîtrisés."
 USA_agricultural_adjustment_act:1 "Loi d'ajustement agricole"
 USA_agricultural_adjustment_act_desc:1 "Nos agriculteurs ont été particulièrement durement touchés par la dépression. Nous devons veiller à ce que les personnes qui produisent nos aliments ne soient pas poussées à la faillite par un marché incontrôlé."
 USA_fair_labour_standards_act:1 "Loi sur les normes équitables de travail"
 USA_fair_labour_standards_act_desc:1 "Alors que les premiers signes d'une lente reprise se font jour, il est temps de veiller à ce que les travailleurs puissent y participer. Nous devons interdire les pratiques d'exploitation telles que les heures supplémentaires non rémunérées et introduire un salaire minimum viable."
 USA_federal_housing_act:1 "Loi fédérale sur le logement"
 USA_federal_housing_act_desc:1 "Dans le cadre de nos efforts continus pour éradiquer la pauvreté aux États-Unis, nous créerons un programme de logements subventionnés par le gouvernement fédéral."
 federal_housing_tt:0 "(§YCinq états aléatoires§!) : Ajoutez §G1§! Emplacements de construction."
 USA_office_of_scientific_research_and_development:1 "Bureau de recherche et développement scientifique"
 USA_office_of_scientific_research_and_development_desc:1 "Alors que la guerre se profile à l'horizon, nous devons concentrer nos efforts scientifiques pour garantir qu'aucun adversaire potentiel ne nous surpasse."
 USA_focus_on_europe:1 "Focus sur l'Europe"
 USA_focus_on_europe_desc:1 "Les grandes puissances européennes sont une fois de plus prêtes à plonger le monde dans une guerre mondiale. Nous ne pouvons pas, comme nous le faisions auparavant, attendre que cela nous affecte. Nous devons être prêts à intervenir de manière décisive si une nation européenne menace la paix."
 USA_focus_on_asia:1 "Focus sur l'Asie"
 USA_focus_on_asia_desc:1 "Alors que la plupart des gens regardent avec inquiétude l'Europe, nous sommes également confrontés à l'incertitude et à l'instabilité dans le Pacifique. Il serait peut-être dans notre intérêt d'intervenir à l'étranger avant d'attaquer plus près de chez nous."
 USA_magic:1 "MAGIE"
 USA_magic_desc:1 "La Marine pense pouvoir déchiffrer les codes de cryptage japonais, ce qui nous permettrait de lire tout leur trafic de messages, y compris les mouvements des navires."
 USA_neutrality_act:1 "Loi sur la neutralité"
 USA_neutrality_act_desc:1 "Il semble de plus en plus certain que la guerre éclatera en Europe. Pendant la Grande Guerre, les entreprises américaines ont vendu de grandes quantités d'armes aux Alliés, et beaucoup pensent que l'entrée américaine était principalement motivée par le désir de garantir que ces livraisons seraient payées. Cette fois, il n'y aura pas de profit de guerre."
 USA_lend_lease_act_neutrality_tt:0 "\n\nL'adoption de la loi sur la neutralité augmentera §Rconsidérablement§! les exigences pour adopter la loi sur le prêt-bail"
 USA_lend_lease_act:1 "Loi sur le prêt-bail"
 USA_lend_lease_act_desc:1 "Les grandes démocraties du monde sont attaquées. S'ils perdent la bataille, ce n'est qu'une question de temps avant que la guerre n'éclate sur nos côtes. Nous devons faire tout notre possible pour les soutenir, même s'ils ne peuvent pas payer l'équipement immédiatement."
 USA_reestablish_the_gold_standard:1 "Rétablir l'étalon-or"
 USA_reestablish_the_gold_standard_desc:1 "Sans l'étalon-or, l'argent n'existe qu'un article de foi, tandis que l'inflation galopante ronge les économies de nos citoyens et dévalorise leur travail. Nous devons abandonner cette voie financièrement irresponsable."
 USA_adjusted_compensation_act:1 "Loi sur la rémunération ajustée"
 USA_adjusted_compensation_act_desc:1 "On avait promis à nos anciens combattants de la Grande Guerre une pension équitable. Beaucoup ont connu des moments difficiles récemment avec la dépression. Nous devons faire ce que nous pouvons pour aider ceux qui ont répondu à l'appel de la République en son temps difficile."
 USA_labour_management_relations_act:1 "Loi sur les relations professionnelles"
 USA_labour_management_relations_act_desc:1 "Les entreprises partout en Amérique sont menacées par toutes sortes d'activités syndicales - grèves, syndicalisation, revendications pour des salaires plus élevés. Nous ne pouvons pas permettre que cela continue."
 USA_protectionist_tariffs:1 "Tarifs protectionnistes"
 USA_protectionist_tariffs_desc:1 "Le libre-échange a ouvert nos marchés aux concurrents étrangers, dont beaucoup ont eux-mêmes augmenté leurs droits de douane et leurs droits de douane. Nos entreprises font face à une concurrence féroce tandis que les leurs bénéficient de la sécurité du mur douanier. Cela doit cesser."
 USA_income_tax_reform:2 "Réforme de l'impôt sur le revenu"
 USA_income_tax_reform_desc:1 "L'impôt sur le revenu retire de l'argent du portefeuille de chaque Américain - de l'argent que nos citoyens pourraient dépenser pour acheter d'autres choses et soutenir leur économie locale. Nous redonnerons aux Américains l'autonomie financière."
 USA_institute_of_american_sciences:1 "Institut américain des sciences"
 USA_institute_of_american_sciences_desc:1 "Les universités et les laboratoires de recherche de tout le pays ont jusqu'à présent mené leurs recherches comme bon leur semblait. Cela doit cesser. Nous créerons une nouvelle organisation pour coordonner les efforts de nos scientifiques de classe mondiale."
 USA_america_first:0 "L'Amérique d'abord"
 USA_america_first_desc:2 "Certains voudraient que nous dépensions nos trésors et le sang de notre jeunesse dans des guerres étrangères. Nous ne devons pas nous laisser influencer par ces bellicistes et vivrons plutôt selon une maxime simple : l'Amérique d'abord, tout le monde ensuite."
 USA_extend_the_chinese_exclusion_acts:1 "Prolonger les lois d'exclusion chinoises"
 USA_extend_the_chinese_exclusion_acts_desc:2 "Alors que la Chine est ravagée par la guerre, nous devons prendre des mesures pour limiter l'immigration chinoise, de peur d'être noyés sous des vagues de réfugiés."
 USA_empower_the_huac:1 "Renforcez le Huac"
 USA_empower_the_huac_desc:1 "Le Comité de la Chambre sur les activités non américaines remplit une fonction importante dans notre démocratie saine. Nous ne devons pas permettre à des éléments déloyaux de tenter d'influencer le processus politique."
 USA_voter_registration_act:1 "Loi sur l'inscription des électeurs"
 USA_voter_registration_act_desc:1 "Les élections sont l'élément le plus important d'une démocratie. Il est tout à fait déraisonnable d'exiger qu'il n'y ait aucun contrôle sur qui peut y participer - ou peut-être que ceux qui plaident en faveur d'élections incontrôlées ont des motivations plus sinistres et souhaitent renverser le processus par la fraude électorale..."
 USA_ally_with_the_silver_shirts:1 "Alliez-vous aux chemises d'argent"
 USA_ally_with_the_silver_shirts_desc:1 "Pour redonner à notre nation la place qui lui revient dans le monde et revendiquer notre destinée manifeste, une réorganisation plus fondamentale est nécessaire. Les Chemises d'Argent nous aideront à y parvenir."
 USA_national_prosperity_program:1 "Programme national de prospérité"
 USA_national_prosperity_program_desc:1 "La clé d'une reprise rapide et d'une prospérité durable ne réside pas dans des marchés incontrôlés, mais dans des programmes soigneusement guidés, reliant les entreprises privées et publiques."
 USA_privatize_the_TVA:1 "Privatiser la TVA"
 USA_privatize_the_TVA_desc:1 "La Tennessee Valley Authority a évincé la concurrence privée et a établi une mainmise sur les travaux de construction dans la région. Il ne peut pas appartenir au gouvernement de faire des choses que le secteur privé a prouvé faire mieux."
 USA_de_regulate_the_banking_sector:1 "Déréguler le secteur bancaire"
 USA_de_regulate_the_banking_sector_desc:1 "Suite à une correction des marchés financiers tout à fait normale dans le cycle économique, les gouvernements précédents ont institué des contraintes tout à fait déraisonnables sur les activités financières. Même si ces restrictions sont sans aucun doute bien intentionnées, elles font clairement plus de mal que de bien."
 USA_national_employment_strategy:1 "Stratégie nationale pour l'emploi"
 USA_national_employment_strategy_desc:1 "Le chômage vient d'un constat simple : les gens ne correspondent pas aux emplois proposés. Les usines restent inactives parce que les employeurs ne trouvent pas les travailleurs dont ils ont besoin tandis que dans d'autres régions du pays, les gens meurent de faim. Nous introduirons une nouvelle stratégie qui garantira que tout employeur puisse trouver les personnes dont il a besoin pour diriger son entreprise."
 USA_invite_foreign_support:1 "Inviter un soutien étranger"
 USA_invite_foreign_support_desc:1 "Avec des rapports très inquiétants sur la loyauté de l'armée et de certains gouvernements d'État, nous devrons peut-être chercher du soutien à l'étranger."
 USA_send_lindbergh_to_germany:1 "Envoyer Lindbergh en Allemagne"
 USA_send_lindbergh_to_germany_desc:1 "Le célèbre aviateur a proposé de se rendre en Europe pour étudier comment l'Allemagne s'est reconstruite après la dernière guerre. Cela devrait nous donner une expérience précieuse. Lindbergh a également indiqué qu'il serait prêt à rejoindre le gouvernement dans un rôle de consultant."
 USA_work_with_the_bund:1 "Travailler avec le Bund"
 USA_work_with_the_bund_desc:1 "Le Bund germano-américain a proposé de nous aider à communiquer nos positions aux nombreux Américains d'ascendance allemande. Cela garantirait que nous disposions d'une base sympathique dans leurs États."
 USA_work_with_the_bund_tt:0 "Garantit que les États suivants restent auprès du gouvernement en cas de guerre civile : Ohio, Missouri, Wisconsin, Illinois, Indiana et Michigan"
 USA_recruit_the_free_corps:1 "Recruter le Corps Libre"
 USA_recruit_the_free_corps_desc:1 "Les militaires étant de plus en plus suspects, il faut se tourner vers les héros de la Grande Guerre. En cas de besoin, les corps francs allemands sont venus en aide à la République allemande. Nous avons besoin d'une organisation similaire qui nous restera fidèle lorsque viendra notre heure de besoin."
 USA_honor_the_confederacy:1 "Honorez la Confédération"
 USA_honor_the_confederacy_desc:1 "Pendant trop longtemps, l'histoire de la guerre civile a été racontée du point de vue du Nord - l'histoire d'une rébellion vouée à l'échec. Il est temps que l'autre côté soit également entendu."
 USA_war_powers_act:1 "Loi sur les pouvoirs de guerre"
 USA_war_powers_act_desc:1 "Dans un monde où les avions sont de plus en plus rapides transportant des bombes de plus en plus lourdes, dans un monde de sous-marins et d'armes chimiques, interdire au président d'exiger le consentement du Congrès pour faire ce qui est nécessaire pour défendre le pays est une invitation au désastre."
 USA_seize_cuba:1 "S'emparer de Cuba"
 USA_seize_cuba_desc:1 "Juste au large de nos côtes se trouve un porte-avions insubmersible, prêt à servir de base à un agresseur. Nous ne devons pas permettre que cela se produise."
 USA_eliminate_the_southern_threat:1 "Éliminer la menace du Sud"
 USA_eliminate_the_southern_threat_desc:1 "Le Mexique a été un désastre instable pour la dernière génération. Que la violence déborde notre frontière ou que quelqu'un unisse le pays et marche vers le nord n'a aucune importance : nous devons sécuriser notre flanc sud."
 USA_the_canadian_corridor:1 "Le corridor canadien"
 USA_the_canadian_corridor_desc:1 "Une petite bande de territoire canadien peu peuplé sépare l'Alaska des États-Unis inférieurs. Sa défense dépend donc de la bonne volonté canadienne. Cependant, l'attaquant le plus probable est le Canada. Cela ne peut pas continuer."
 USA_north_american_dominion:1 "Domination nord-américaine"
 USA_north_american_dominion_desc:1 "Nos frontières immédiates étant sécurisées, nous devons regarder plus loin pour prévenir toute menace contre l'Amérique du Nord. Nous ne pouvons tolérer aucun État voyou dans la région."
 USA_strategic_interests:1 "Intérêts stratégiques"
 USA_strategic_interests_desc:1 "Le monde est plus connecté que jamais. Une menace dans une partie du pays peut facilement s'accroître jusqu'à devenir un danger pour le monde entier. Nous devons construire un réseau de bases qui se soutiennent mutuellement dans le monde entier pour nous permettre de réagir rapidement à n'importe quelle situation."
 USA_protect_south_america:1 "Protéger l'Amérique du Sud"
 USA_protect_south_america_desc:1 "La partie sud de notre double continent est le terrain de jeu des empires depuis sa découverte. Il est temps que quelqu'un prenne sur lui de veiller à ce que ces nations ne soient pas perturbées et guidées vers un avenir plus productif."
 USA_pacific_pacification:1 "Pacification du Pacifique"
 USA_pacific_pacification_desc:1 "L'Australie et la Nouvelle-Zélande sont trop éloignées de la Grande-Bretagne pour qu'elles puissent les défendre efficacement. Nous ne pouvons pas permettre qu'ils soient pris en charge par une nation hostile au [USA.GetNameDef]."
 USA_secure_asia:1 "Asie sécurisée"
 USA_secure_asia_desc:1 "Les nations coloniales d'Europe semblent peu disposées ou incapables de défendre efficacement leurs colonies asiatiques. Nous devons assumer ce fardeau à leur place, de peur que ces zones ne deviennent des tremplins pour de nouvelles agressions."
 USA_global_hegemony:1 "Hégémonie mondiale"
 USA_global_hegemony_desc:1 "Nous sommes sur le point d'atteindre une position de suprématie mondiale qui nous permettra de prévenir les conflits par notre simple existence. Nous devons simplement veiller à ce que les grandes puissances restantes sur la planète reconnaissent notre position."
 USA_war_plans_division:1 "Division des plans de guerre"
 USA_war_plans_division_desc:1 "Même si nous désirons la paix, nous devons nous préparer à la guerre."
 USA_intervention_in_the_americas:1 "Intervention dans les Amériques"
 USA_intervention_in_the_americas_desc:1 "Notre première priorité doit être de veiller à ce que nous soyons prêts à toute éventualité dans notre propre hémisphère."
 USA_war_plan_green:1 "Plan de guerre vert"
 USA_war_plan_green_desc:1 "Le Mexique étant dans un état constant d'instabilité suite à la révolution, nous devons être prêts à intervenir de manière décisive."
 USA_war_plan_crimson:1 "Plan de guerre cramoisi"
 USA_war_plan_crimson_desc:1 "Même si le Canada est peut-être aujourd'hui un voisin amical, cela n'est peut-être pas toujours le cas."
 USA_war_plan_gray:1 "Plan de guerre gris"
 USA_war_plan_gray_desc:1 "L'histoire a montré que les nations des Caraïbes sont très instables. Nous devrons peut-être agir rapidement pour protéger les intérêts américains si l'un d'entre eux devait sombrer dans l'instabilité."
 USA_hemisphere_defense:1 "Défense de l'hémisphère"
 USA_hemisphere_defense_desc:1 "Indépendamment de tout engagement étranger, nous devons avant tout nous tourner vers notre propre voisinage."
 USA_intervention_in_europe:1 "Intervention en Europe"
 USA_intervention_in_europe_desc:1 "Moins de deux décennies après la fin de la Grande Guerre, les nations européennes sont à nouveau prêtes à entrer en guerre. Nous devons être prêts au cas où la situation nécessiterait une intervention rapide."
 USA_war_plan_gold:1 "Or du plan de guerre"
 USA_war_plan_gold_desc:1 "La France souffre de divisions internes et d'un radicalisme politique croissant, mais elle est également l'une des plus grandes puissances militaires d'Europe. Cette combinaison met de nombreuses personnes mal à l'aise."
 USA_war_plan_silver:0 "Plan de guerre Argent"
 USA_war_plan_silver_desc:0 "L'Italie a ouvertement déclaré son ambition de gouverner la Méditerranée. Si leurs désirs d'empire entrent en conflit avec nos intérêts, nous devons être préparés."
 USA_anti_bolshevist_aid:1 "Aide anti-bolchevique"
 USA_anti_bolshevist_aid_desc:1 "Toutes les armes, obus, balles et paires de bottes que nous pouvons donner à ceux qui luttent contre la propagation du communisme contribueront en fin de compte à nous défendre."
 USA_war_plan_ruby:1 "Plan de guerre Rubis"
 USA_war_plan_ruby_desc:1 "L'Inde abrite des millions de personnes, auxquelles nous devons être prêts à faire face en cas de conflit."
 USA_war_plan_scarlet_garnet:1 "Plan de guerre Grenat écarlate"
 USA_war_plan_scarlet_garnet_desc:1 "Dans le Pacifique, l'Australie et la Nouvelle-Zélande pourraient bien venir en aide à leur patrie. Tout projet visant à traiter avec la Grande-Bretagne doit tenir compte de ses colonies."
 USA_intervention_in_asia:1 "Intervention en Asie"
 USA_intervention_in_asia_desc:1 "Souvent éclipsée par l'évolution de la situation en Europe, l'Asie connaît ses propres points chauds, ce qui nous oblige à nous préparer à une intervention."
 USA_war_plan_yellow:1 "Plan de guerre jaune"
 USA_war_plan_yellow_desc:1 "La Chine est en guerre civile depuis plus d'une génération. On ne sait pas quand la situation se détériore au point où nous devons intervenir."
 USA_war_department:1 "Département de la guerre"
 USA_war_department_desc:1 "À l'ère de la guerre industrialisée, nous devons disposer d'une administration capable d'exploiter au maximum les ressources de notre grande nation."
 USA_selective_training_act:1 "Loi sur la formation sélective"
 USA_selective_training_act_desc:1 "Les États-Unis ont toujours été lents à adopter un projet, même en temps de guerre. Nous ne pouvons plus nous offrir ce luxe."
 USA_louisiana_maneuvers:1 "Manoeuvres de la Louisiane"
 USA_louisiana_maneuvers_desc:1 "Les contraintes budgétaires nous ont obligés à observer de loin de nombreux développements militaires. Nous pouvons enfin mettre en pratique certaines de nos théories."
 USA_airborne_divisions:1 "Divisions aéroportées"
 USA_airborne_divisions_desc:1 "L'évolution de la portée et de la charge utile des avions a ouvert de nombreuses possibilités. Les avions cargo pourraient transporter une division complète de troupes loin derrière les lignes ennemies, où ils feraient des ravages."
 USA_army_of_the_united_states:1 "Armée des États-Unis"
 USA_army_of_the_united_states_desc:1 "Pour les combats à venir, l'armée américaine est trop petite. Pour superviser l'augmentation spectaculaire de la taille que nous devrons accomplir, nous devrons créer une nouvelle organisation."
 USA_womens_armed_service_integration_act:1 "Loi sur l'intégration des femmes dans les services armés"
 USA_womens_armed_service_integration_act_desc:1 "Nous ne pouvons pas nous permettre de refuser quiconque souhaite servir. Chaque femme en uniforme libère un homme pour combattre au front."
 USA_tank_experiments:1 "Expériences en char"
 USA_tank_experiments_desc:1 "Les chars sont indispensables sur le champ de bataille moderne. Nous devons trouver la meilleure façon de les utiliser."
 USA_tank_destroyer_doctrine:1 "Doctrine des chasseurs de chars"
 USA_tank_destroyer_doctrine_desc:1 "Une théorie controversée développée par certains officiers d'artillerie, affirmant que la meilleure arme contre les percées blindées est un véhicule rapide, légèrement blindé mais lourdement armé."
 USA_main_battle_tanks:1 "Chars de combat principaux"
 USA_main_battle_tanks_desc:1 "L'expérience sur le terrain a clairement montré qu'un char doit être capable d'accomplir un grand nombre de tâches, depuis le soutien de l'infanterie jusqu'à la lutte contre les chars ennemis. Concevoir des véhicules pour répondre à ces besoins nous permet de rationaliser la production."
 USA_armored_infantry:1 "Infanterie blindée"
 USA_armored_infantry_desc:1 "Les chars seuls ne peuvent pas gagner une bataille. Il faut de l'infanterie pour tenir un territoire. Leur fournir des véhicules blindés leur permet de suivre le rythme des chars et de survivre à tout ce qui leur est lancé."
 USA_build_the_pentagon:1 "Construire le Pentagone"
 USA_build_the_pentagon_desc:1 "L'expansion de notre armée nécessite un nouveau quartier général mondial pour la commander."
 USA_department_of_defense:1 "Ministère de la Défense"
 USA_department_of_defense_desc:1 "Renommer le ministère de la Guerre souligne que nous ne pouvons plus choisir d'ignorer notre protection jusqu'au moment où elle est mise à l'épreuve. Nous devons toujours être vigilants."
 USA_escort_fighters:1 "Combattants d'escorte"
 USA_escort_fighters_desc:1 "Même si le bombardier peut toujours passer, son ailier pourrait ne pas le faire, à moins qu'ils ne soient tous deux protégés par des combattants amis."
 USA_us_army_airforce:1 "Force aérienne de l'armée américaine"
 USA_us_army_airforce_desc:1 "L'objectif fondamental de la puissance aérienne militaire est de permettre aux forces terrestres de prendre et de conserver le terrain. Tout le reste est accessoire."
 USA_us_air_force:1 "Force aérienne américaine"
 USA_us_air_force_desc:1 "L'objectif fondamental de la puissance aérienne militaire est de gagner les guerres. Les bombardements stratégiques avec des armes toujours plus dévastatrices briseront la volonté de résistance de l'ennemi ou le rendront matériellement incapable de le faire."
 USA_two_ocean_navy_act:1 "Loi sur la marine des deux océans"
 USA_two_ocean_navy_act_desc:1 "Avec la guerre à l'horizon, nous devons veiller à ce qu'aucun ennemi ne puisse jamais mettre le pied sur les côtes américaines. Notre marine doit être capable de combattre n'importe quel ennemi dans l'un ou l'autre des deux grands océans qui forment nos frontières."
 USA_maritime_commission:1 "Commission maritime"
 USA_maritime_commission_desc:1 "Alors que la plupart des profanes se concentrent uniquement sur les navires de guerre, les vrais experts savent que c'est le modeste cargo qui gagne les guerres. Pour augmenter le volume de transport disponible en temps de guerre, nous formerons un conseil spécial pour coordonner la construction."
 USA_advanced_basing:1 "Base avancée"
 USA_advanced_basing_desc:1 "Plus nous pouvons éloigner l'ennemi de nos côtes, mieux c'est."
 USA_naval_radar:1 "Radar naval"
 USA_naval_radar_desc:1 "Le radar offre des possibilités alléchantes pour éloigner la nuit de nos ennemis et les détecter même par mauvais temps."
 USA_fleet_submarines:1 "Sous-marins de la flotte"
 USA_fleet_submarines_desc:1 "Nos adversaires les plus probables dans la guerre navale s'appuient tous deux sur le commerce extérieur, qui s'est révélé très vulnérable aux sous-marins. Ces sous-marins devraient avoir une très longue portée pour leur permettre de traverser les océans et d'opérer à proximité des côtes ennemies."
 USA_unrestricted_submarine_warfare:1 "Guerre sous-marine sans restriction"
 USA_unrestricted_submarine_warfare_desc:1 "L'histoire a montré que tout traité bien intentionné visant à contrôler la guerre sous-marine ne vaut pas le papier sur lequel il est rédigé. Nous ne devrions pas nous considérer liés par quelque chose que nos ennemis ignoreront de toute façon."
 can_degaussing_tech:0 "Bénéficiez de la technologie de démagnétisation"
 USA_great_depression_cooldown:0 "La nouvelle législation est toujours en cours d'élaboration"
 USA_great_depression_cooldown_tt:0 "Une fois cette loi adoptée, il faudra §Y230 jours§! jusqu'à ce qu'une nouvelle législation sur le New Deal soit rédigée et prête à être signée.\n\n"
 USA_limited_intervention_tt:0 "\n\nL'adoption de cette loi rendra §Rbeaucoup plus difficile§! la mobilisation de votre économie.\n\n"
 britain_enforced_our_loyalty:0 "La Grande-Bretagne a imposé notre loyauté."
