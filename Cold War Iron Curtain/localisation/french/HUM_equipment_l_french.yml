# Kingdom of Humanity equipments
 HUM_infantry_equipment_0:0 "Type 99 Arisaka"
 HUM_infantry_equipment_0_short:0 "Tapez 99"
 HUM_infantry_equipment_0_desc:0 "Le Type 99 Arisaka est un fusil à verrou japonais, introduit en 1939. Chambré dans une puissante cartouche de 7,7 x 58 mm, il a été conçu pour remplacer l'ancien fusil de type 38 pendant la Seconde Guerre mondiale. Le Type 99 présente une conception simple et robuste avec un alésage chromé pour une durabilité améliorée. Il comprend un monopode distinctif et des viseurs anti-aériens rabattables sur certains modèles. La majorité de ces équipements IJA ont été saisis dans l'entrepôt de la base sous-marine Shinnan-Shoto IJA par les Meads après la Seconde Guerre mondiale."

 HUM_infantry_equipment_1:0 "M-1 Garand"
 HUM_infantry_equipment_1_short:0 "M-1 Garand"
 HUM_infantry_equipment_1_desc:0 "Le M1 Garand est un fusil semi-automatique utilisé par les forces américaines pendant la Seconde Guerre mondiale et la guerre de Corée. Chambré en Springfield.30-06, il contient un chargeur en bloc de 8 cartouches, ce qui le rend plus rapide à tirer que les fusils à verrou de son époque. Réputé pour sa précision et sa fiabilité, la conception robuste du M1 Garand permettait aux soldats de maintenir une cadence de tir constante. Son son distinctif « ping » lorsque le clip est éjecté est devenu emblématique sur le champ de bataille. Le général Patton l'a qualifié de « le plus grand outil de combat jamais conçu »."