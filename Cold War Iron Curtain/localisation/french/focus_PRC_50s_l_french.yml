 PRC_Societal_Reforms_desc:0 "Si notre révolution veut vraiment réussir et que notre société tout entière doit être réformée, notre mode de vie doit être réformé. Sous le président Mao et le Parti communiste, nous devons changer notre nation tout entière."
 PRC_End_the_Feudal_Family_desc:0 "Pour provoquer la révolution, nous devons mettre fin à la société patriarcale que nous avons. En mettant fin à la famille féodale, nous pouvons commencer à nous concentrer sur la communauté, en poussant notre peuple à changer la façon dont il perçoit sa famille, sa communauté et, par procuration, sa nation."
