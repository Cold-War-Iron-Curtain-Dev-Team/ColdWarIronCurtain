 PRC_Lessons_from_the_Liberation_War_desc:0 "Nous avons combattu longuement et durement contre les occupants impérialistes, le Kuomintang, le faux empereur et les Japonais. Au cours de ces guerres, de ces guerres de libération, nous avons beaucoup appris. Avec la conclusion de la Guerre populaire de libération en Chine, nous devons tirer les leçons que nous avons apprises et les appliquer à l'Armée populaire de libération."
