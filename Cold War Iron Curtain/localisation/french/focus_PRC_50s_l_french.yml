 #Old
 prc_war:0 "Guerre de libération"
 prc_war_desc:0 "La défense commune de la Chine a pris fin. La Mandchourie a finalement été libérée des réactionnaires et nos succès ont inspiré la jeunesse chinoise à rejoindre nos rangs, et des milliers de soldats ennemis ont compris la futilité de leur combat et ont rejoint les forces communistes. Mais maintenant que nous sommes sur un pied d'égalité, nous pouvons abandonner la stratégie de guérilla et affronter l'ennemi sur le champ de bataille dans une guerre conventionnelle ! Qi Lai ! À la victoire !"
 petty_warfare:0 "Guérilla"
 prc_reform_army:0 "Armée réformée"
