 prc_n_korea:0 "Traité sino-nord-coréen"
 unify_korea:0 "Unification de la Corée"
 liberate_tibet:0 "Libération du Tibet"
 liberate_macau:0 "Libération de Macao"
 liberate_macau_desc:0 "Nos frères de Macao, longtemps séparés, ont été assez longtemps soumis ! Les Portugais n'ont plus d'empire colonial puissant et ne constituent plus une menace pour nous. Une invasion rapide mettra fin à leur contrôle fasciste sur Macao !"
 liberate_hong_kong:0 "Libérer Hong Kong"
 liberate_hong_kong_desc:0 "Hong Kong nous a été enlevé dans le seul but de détruire notre pays avec de l'opium. Nous retrouverons notre honneur en le reprenant au nom du glorieux socialisme chinois ! Il est tout à fait normal que l'empire le plus destructeur du monde soit vaincu par ceux-là mêmes qu'il avait jadis soumis et empoisonnés. On dirait que les Britanniques vont encore une fois se retrouver coincés avec leur horrible thé !"
 prc_kmt_truce:0 "Trêve diplomatique avec le KMT"
 prc_ussr_war:0 "Guerre contre l'URSS"
 unfree_tibet:0 "Tibet « autonome »"
 free_tibet:0 "Tibet autonome"
 newfocus_51:0 "newfocus_51"
 buddhism_prc:0 "Le bouddhisme comme religion d'État"
 denounce_lama:0 "Dénoncer le Dalaï Lama"
 prc_in_un:0 "Reconnaissance de l'ONU"
 prc_in_un_desc:0 "Les Nations Unies continuent de reconnaître le Kuomintang comme le parti au pouvoir en Chine. Maintenant que le Kuomintang appartient essentiellement au passé, nous devons faire appel aux membres du Conseil permanent de sécurité pour qu'ils nous accordent la place qui nous revient en tant que membre et détenteur du droit de veto chinois."
 sim_chinese:0 "Chinois simplifié"
 sim_chinese_desc:0 "Le peuple chinois ne restera pas les bras croisés pendant que le reste du monde joue sur la scène mondiale. Le système d'écriture chinois a toujours été considéré comme l'un des systèmes les plus difficiles à apprendre, mais cela constitue un obstacle sérieux à l'internationalisation de l'idéologie maoïste. Sous la direction du président Mao, nous avons créé une version simplifiée de chaque caractère de la langue pour à la fois accroître l'alphabétisation et aider les étrangers à apprendre notre grande langue."
 one_child:0 "Politique d'un enfant"
 one_child_desc:0 "La population du pays augmente trop rapidement. Les difficultés croissantes commencent déjà à se manifester, c'est pourquoi l'Assemblée populaire nationale a décidé d'instituer une politique de « l'enfant unique ». Cela limitera les couples à n'avoir qu'un seul enfant, sinon ils se verront imposer de lourdes taxes. Il s'agit d'une politique stricte, mais nécessaire pour assurer la santé et la réussite du pays."
 prc_us_relations:0 "Rétablir les relations avec les États-Unis"
 prc_us_relations_desc:0 "Être un ennemi des États-Unis n'entraîne que des restrictions. De meilleures relations avec l'Amérique nous apporteront un meilleur accès aux ressources et au pétrole et contribueront à désamorcer la guerre froide."
 prc_uk_relations:0 "Liez-vous d'amitié avec le Royaume-Uni"
 prc_uk_relations_desc:0 "Malgré leurs griefs historiques contre nous, le Royaume-Uni n'est plus qu'une coquille de ce qu'il était autrefois. Entretenir des relations froides avec eux est puéril et nous devrions investir plus de temps et de ressources pour nous lier d'amitié avec les Britanniques. Peut-être pourrions-nous recommencer à leur envoyer du bon thé..."
 prc_jap_relation:0 "Devenez ami avec le Japon"
 prc_jap_relation_desc:0 "Depuis la Seconde Guerre mondiale, nous entretenons une intense animosité à l'égard des Japonais. Mais après mûre réflexion, nous constatons que les atrocités commises pendant la guerre étaient la faute du gouvernement impérialiste et non du peuple lui-même. Nous allons donc reprendre le dialogue diplomatique avec eux. Peut-être que se lier d'amitié avec eux augmentera la popularité du communisme auprès de notre vieil ennemi."
 prc_uk_hong_kong:0 "Déclaration sino-britannique"
 prc_uk_hong_kong_desc:0 "Maintenant que nous avons repris le dialogue politique avec les Britanniques, nous nous sentons à l'aise d'exiger le retour diplomatique de Hong Kong. Pourquoi risquer d'endommager Hong Kong dans une guerre alors que nous pourrions recevoir pacifiquement les clés des Britanniques ?"
