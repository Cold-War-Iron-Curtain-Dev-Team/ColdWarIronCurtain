 PRC_Links_with_the_Eastern_Bloc_desc:0 "Le monde capitaliste s'opposera à nous à chaque instant. Pour garantir que nous puissions reconstruire notre économie et développer la République populaire, nous devons établir des liens plus étroits avec le bloc de l'Est. Ce n'est que grâce à la coopération mutuelle que nous pourrons tous grandir."
