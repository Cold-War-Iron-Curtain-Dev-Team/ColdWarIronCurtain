 PRC_The_Peoples_Liberation_Army_desc:0 "Fondée le 1er août 1927, l'Armée populaire de libération, ou Armée rouge, est une force dédiée à la lutte contre le colonialisme, l'impérialisme et le capitalisme. Même si elle a fait face à de nombreuses difficultés, l'Armée populaire a triomphé des forces qui cherchaient à nous détruire."
 PRC_Transforming_our_Army_desc:0 "Notre armée s'est concentrée sur la guerre indirecte, en utilisant des tactiques qui nous sont très utiles lorsque nous faisons face à un ennemi écrasant et technologiquement supérieur. Mais aujourd'hui, nous sommes dominants. Ceux qui voudraient nous combattre ne peuvent pas résister à notre puissance unifiée. En tant que telle, l'Armée populaire de libération doit être réformée pour devenir une force combattante capable de faire face à toutes les menaces, tant internes qu'externes."
 PRC_Artillery_Developments_desc:0 "L'artillerie a joué un rôle clé dans notre lutte contre le Japon impérial et la fausse République de Chine. Nous devons continuer à développer notre technologie d'artillerie pour pouvoir faire pleuvoir l'enfer sur tous ceux qui menaceraient la République populaire."
 PRC_Establish_the_Work_Soldier_Militia_desc:0 "Notre capacité à former rapidement des soldats sera essentielle dans la lutte contre le capitalisme. En créant des milices actives, nous garantirons que, lorsque le moment sera nécessaire, les troupes pourront être rapidement amenées au front, où qu'il se trouve."
 PRC_Establish_Air_Defense_Troops_desc:0 "La capitale nouvellement établie, Pékin, doit être protégée. Pour assurer la sécurité de Pékin et de l'État, nous devons établir une force militaire spécialisée dédiée à la défense aérienne autour de Pékin."
 PRC_Development_of_Armored_Troops_desc:0 "Ce n'est plus l'heure de l'infanterie et de la cavalerie pures, ce n'est plus l'heure de lever les bannières. Nous sommes dans une nouvelle ère, une ère de chars, d'avions, de missiles et d'armes qui peuvent anéantir l'humanité. Pour garantir que nos soldats puissent répondre aux besoins de la Chine, nous devons développer nos véhicules blindés."
 PRC_Men_Over_Material_desc:0 "Notre plus grande force est notre peuple, nous devons faire comprendre à la population que servir dans les forces armées contribuera à faire avancer la révolution et à assurer la sécurité de notre précieuse Chine."
 PRC_Establish_the_Public_Security_Forces_desc:0 "L'ordre doit être maintenu, sans ordre notre société s'effondrera. Nous l'avons vu sous les « Rois » de Mandchourie et nous l'avons vu sous la fausse République. Nous devons veiller à ce que notre règle soit codifiée et que ceux qui y désobéissent soient punis."
 PRC_Indoctrinate_the_Peasents_desc:0 "La paysannerie sera l'avant-garde rurale de la révolution, et en la libérant de la dictature des propriétaires fonciers, nous lui montrerons comment sa foi dans le parti apportera sa propre prospérité."
 PRC_Human_Wave_Tactics_desc:0 "L'idée d'un assaut massif sera importante dans les jours à venir, notre plus grand atout est notre peuple, en tant que l'une des nations les plus peuplées de cette Terre, nous devons garantir que nous disposons d'une armée forte et nombreuse."
 PRC_Establish_the_Peoples_Liberation_Navy_desc:0 "Notre nation n'a jamais été une puissance maritime, mais cela doit changer. Face aux menaces auxquelles nous serons confrontés de la part des impérialistes, des colonisateurs et des capitalistes, nous devons établir une marine populaire pour garantir que nous pouvons faire face aux menaces dans le Pacifique et au-delà."
 PRC_Oppose_the_Imperialist_Oppression_desc:0 "Le Zhejiang sera un endroit idéal pour commencer à agrandir les chantiers navals. En plus d'augmenter notre capacité navale, cela contribuera à revitaliser une région déchirée par la guerre et à créer des milliers de nouveaux emplois pour notre population."
 PRC_Dalian_Naval_Academy_desc:0 "Créée en tant que première Académie navale de l'Armée populaire de libération chinoise, l'Académie navale de Dalian sera un lieu privilégié pour former nos marins dans notre lutte contre les réactionnaires et l'Occident impérialiste."
 PRC_Soviet_Naval_Advisors_desc:0 "L'Union soviétique sous Staline a connu une augmentation rapide de sa production navale. En invitant des conseillers soviétiques, nous pouvons utiliser ce qu'ils ont appris en combattant pendant la Seconde Guerre mondiale et l'appliquer à nos propres besoins."
 PRC_Old_KMT_Boats_desc:0 "Nous avons découvert un stock important de navires du Kuomintang, abandonnés après le retrait de la fausse république à Taiwan. Nous les prendrons volontiers et les réutiliserons pour nos propres besoins."
 PRC_Fortify_the_Coasts_desc:0 "Pour le moment, nous sommes en infériorité numérique et en haute mer. Alors que nous commençons à développer notre capacité navale, nous devons en même temps fortifier notre littoral, afin de garantir que les invasions auxquelles la Chine a été soumise par les Japonais pendant la Seconde Guerre sino-japonaise ne puissent plus jamais se reproduire."
 PRC_Naval_Air_Forces_desc:0 "Nous sommes dans une nouvelle ère, dans laquelle nous n'envoyons plus d'énormes cuirassés les uns contre les autres. Pour moderniser la Chine et la préparer à toutes les menaces auxquelles elle peut être confrontée, nous devons moderniser notre force aéronavale."
