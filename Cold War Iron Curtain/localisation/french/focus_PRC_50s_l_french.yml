 PRC_Gender_Equality_desc:0 "Pour transformer pleinement la République populaire de Chine en un véritable État communiste, nous devons éliminer toutes les barrières qui entravent notre peuple, y compris les barrières liées au genre. En faisant respecter l'égalité des sexes, nous pouvons commencer à transformer la Chine en une nation du futur."
