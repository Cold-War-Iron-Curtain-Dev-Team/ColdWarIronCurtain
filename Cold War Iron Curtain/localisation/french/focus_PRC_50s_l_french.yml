 PRC_MAOZEDONG_MEME_DESC:0 "Sagesse suprême ! Grand prophète ! Sage chef ! Il nous a apporté la révolution ! Il nous a donné la liberté ! Vive le Président Mao !!!"
 
 ###50s PGNC Focuses Descrpition
 
 PRC_SOV_The_Sovietization_Of_Manchuria_desc:0 "Pour rapprocher la Chine de l'URSS et de l'orthodoxie marxiste, nous devons lancer une campagne de soviétisation."
 PRC_SOV_Appoint_Liao_Chengzhi_to_head_of_Peoples_Daily_desc:0 "Liao Chengzhi a été directeur de l'agence de presse Xinhua ; il fera du bon travail à la tête du Quotidien du Peuple."
 PRC_SOV_Immortalize_the_Victims_of_Unit_731_desc:0 "Les Japonais nieront les crimes de l'Unité 731, mais nous ne permettrons jamais à quiconque de l'oublier."
 PRC_SOV_Integrate_San-Min_Doctrine_into_the_CCP_desc:0 "Bien-être, démocratie et nationalisme. Telles étaient les valeurs qui, selon Sun Yat-sen, amèneraient la Chine à la prospérité. Sous notre gouvernement socialiste, les Trois Principes du Peuple seront réalisés !"
 PRC_SOV_Introduce_Chinese_Social_Realism_desc:0 "Le réalisme socialiste est courant dans le bloc de l'Est, adoptons cette forme d'art émergente !" 
 PRC_SOV_Organize_Russian_Literacy_Programs_desc:0 "Cela servirait grandement à notre peuple s'il pouvait comprendre la langue principale de nos camarades soviétiques."
 PRC_SOV_Maintain_the_Patriarchal_Society_desc:0 "La tradition n'est pas quelque chose qui s'efface facilement, et il existe certaines tâches pour lesquelles les hommes sont tout simplement mieux adaptés."
 PRC_SOV_Destroy_Traditional_Chinese_Social_Norms_desc:0 "Un véritable État socialiste est libre de la discrimination et du sexisme des sociétés réactionnaires !"
 PRC_SOV_Prohibit_the_Use_and_Sale_of_Opium_desc:0 "L'opium était l'outil utilisé par les impérialistes pour affaiblir et détruire lentement la Chine. Nous n'autoriserons plus jamais ce médicament dans notre pays !"
 PRC_SOV_Empower_the_CDSA_desc:0 "Le Département central des affaires sociales veillera à ce qu'il n'y ait pas de subversion et d'infiltration dans notre pays."
 PRC_SOV_Expand_the_Young_Pioneers_of_China_desc:0 "Les Jeunes Pionniers sont l'avenir de la Chine ! Tous les enfants devraient devenir membres du mouvement !"
 PRC_SOV_Request_NKVD_Advisory_desc:0 "Il y a beaucoup de choses que le NKVD soviétique peut nous apprendre ; nous devrions inviter des conseillers."
 PRC_SOV_Modernize_the_Chinese_Criminal_Code_desc:0 "Le Code pénal chinois est truffé de lois et de réglementations obsolètes et réactionnaires. Une nouvelle Chine a besoin d'un nouveau code !"
 PRC_SOV_Establish_the_Harbin_Re-Education_Complex_desc:0 "Les centres de rééducation soviétiques se sont révélés être un moyen humain de montrer aux contre-révolutionnaires nos bonnes intentions. Nous devrions établir le nôtre."
 PRC_SOV_Consolidate_CCP_Authority_in_Manchuria_desc:0 "Le Parti renaît ! Sous une nouvelle direction, le nord de la Chine prospérera et finira par achever la Révolution !"
 PRC_SOV_Recover_from_the_Disaster_desc:0 "Notre avancée vers le sud s'est soldée par une catastrophe ! Il faut analyser ce qui a conduit à cet échec et y remédier immédiatement !"
 PRC_SOV_Begin_Party_Reorganization_desc:0 "Le peuple ne peut pas être blâmé pour notre échec ; la faute en revient aux membres du parti qui se sont placés devant la Révolution."
 PRC_SOV_Request_a_Larger_Soviet_Garrison_desc:0 "L'APL s'est révélée incapable de libérer la Chine, et encore moins de la maintenir. Pour le moment, des garnisons soviétiques sur notre territoire sont nécessaires."
 PRC_SOV_Chairman_Wang_Ming_desc:0 "Mao Zedong nous a conduit à la ruine. Wang Ming prendra en charge le Parti et réparera les dégâts causés par l'administration précédente."
 PRC_SOV_Establish_the_Manchurian_Republic_desc:0 "L'écart de Mao par rapport au marxisme nous a coûté cher. Pour sauver la Révolution, nous devons suivre le modèle soviétique."
 PRC_SOV_Refuse_ROC_Recognition_desc:0 "Malgré les revers, notre objectif reste clair ; nous sommes le gouvernement légitime de la Chine, pas les nationalistes corrompus."
 PRC_SOV_Outreach_to_the_New_Uighur_State_desc:0 "Les Ouïghours ont mené leur propre campagne contre les nationalistes, une coopération serait judicieuse."
 PRC_SOV_Begin_Constructing_the_Hexin-Rayon_Friendship_Line_desc:0 "Le commerce avec l'Union soviétique est crucial pour notre survie ; nous avons besoin de plus de routes et de voies ferrées pour le faciliter."
 PRC_SOV_Demand_Historic_Chinese_Territory_desc:0 "Le Xinjiang et la Mongolie intérieure sont à juste titre un territoire chinois. Par souci de légitimité, ils doivent nous être transférés."
 PRC_SOV_Denounce_US_presence_in_Aisa_desc:0 "Les États-Unis sont venus en Asie pour aider à vaincre les envahisseurs japonais. Malheureusement, ils ont dépassé la durée de leur accueil et ont aidé les nationalistes à opprimer notre peuple. Ils n'ont plus rien à faire ici."
 PRC_SOV_Appoint_Zang_Wentain_Ambassador_to_Moscow_desc:0 "L'ancien secrétaire général Zhang Wentain a une bonne histoire avec l'URSS, il fera un excellent ambassadeur."
 PRC_SOV_Accept_Chinese_Immigrants_from_the_USSR_desc:0 "Il y a de nombreux expatriés vivant en URSS, nous devrions faire l'effort de les réintégrer dans notre république socialiste naissante."
 PRC_SOV_Put_Forward_Sino-Polish_Trade_Legislation_desc:0 "Le commerce avec la Pologne ouvrira les portes à une coopération plus poussée avec l'ensemble du bloc de l'Est !"
 PRC_SOV_Support_Indochinese_Independence_desc:0 "Pendant des décennies, le peuple indochinois s'est vu refuser son droit à la liberté. Leur combat est aussi le nôtre !"
 PRC_SOV_Strengthen_Korean_Relations_desc:0 "La Chine et la Corée entretiennent des relations solides depuis des siècles et nous n'avons aucune intention de changer cela."
 PRC_SOV_Propose_the_North_Asian_Defense_Treaty_desc:0 "Les États-Unis ne reculeront devant rien pour détruire le socialisme en Asie, nous devons tous nous engager à nous soutenir mutuellement contre leur agression !"
 PRC_SOV_Empower_the_28_Bolsheviks_desc:0 "Les 28 bolcheviks sont diplômés de l'Université communiste Sun Yat-sen de Moscou et ont travaillé en étroite collaboration avec le président Ming dans le passé. Avec leur aide, le Parti deviendra plus fort."
 PRC_SOV_Promote_Lin_Biao_to_National_Defense_Minister_desc:0 "Malgré nos récentes défaites, certains de nos généraux et commandants ont fait preuve d'un talent exceptionnel sur le champ de bataille. L'un d'eux est Lin Biao, qui deviendra ministre de la Défense nationale."
 PRC_SOV_From_the_Chinese_Central_Planning_Committee_desc:0 "La planification centrale est vitale pour nos efforts de reconstruction, nous devrions créer un comité pour superviser cela."
 PRC_SOV_Scale_Down_War_Communism_desc:0 "La guerre s'est retournée contre nous. Nous devons adopter une approche plus pragmatique de la Révolution et atténuer la rhétorique agressive."
 PRC_SOV_Appoint_Zhou_Enlai_Head_of_Economic_Affairs_desc:0 "Zhu Enlai est un véritable économiste ; il fera un excellent chef des affaires économiques."
 PRC_SOV_Join_Comecon_desc:0 "Le Comecon est un élément essentiel des relations économiques inter-blocs, nous devrions demander à en devenir membre à part entière."
 PRC_SOV_Support_Resistance_Cells_in_Central_China_desc:0 "Il y a encore beaucoup de camarades dans le sud qui continuent le combat, quoique discrètement. Nous les aiderons du mieux que nous pouvons."
 PRC_SOV_Begin_General_Demobilization_desc:0 "Nous devons nous concentrer sur la reconstruction de nos forces avant de pouvoir tenter de libérer le reste de la Chine. Nous avons besoin d'hommes dans les champs et dans les usines, pas dans les camps d'entraînement."
 PRC_SOV_Request_Extensive_Sino-Soviet_Military_Coordination_desc:0 "L'Union soviétique possède l'une des armées les plus puissantes au monde. Si nous espérons étendre la révolution vers le sud, nous avons besoin de leur soutien et de leur expertise."
 PRC_SOV_Consolidate_CCP_Influence_desc:0 "Le Parti a connu quelques changements, mais il est toujours la même source de bien et de progrès qu'il a toujours été ! Ne laissez pas les gens l'oublier."
 PRC_SOV_Force_Mao_into_Retirement_desc:0 "L'ancien président Mao continue d'être une épine dans notre pied. Il est temps pour lui de rentrer chez lui et de se lever, qu'il le veuille ou non."
 PRC_SOV_Install_a_Leninist_Vanguard_Party_desc:0 "Selon Lénine, l'Avant-garde a pour mission de faire avancer les objectifs du communisme et d'attirer le peuple vers sa politique. Créons une telle fête !"
 PRC_SOV_Merge_Local_News_Outlets_into_Peoples_Daily_desc:0 "Le peuple a besoin de la bonne information pour faire avancer la cause de la révolution. En regroupant les organes d'information locaux au sein d'une grande agence de presse centrale, la population obtiendra toutes les informations dont elle a besoin."
 PRC_SOV_Begin_Combating_Endemic_Corruption_desc:0 "Le Parti est rempli de manoeuvres politiques corrompus et égoïstes. Il est temps de faire le ménage."
 PRC_SOV_Purge_Hardline_Maoists_From_the_PLA_desc:0 "Mao a des partisans indéfectibles au sein de l'APL. Nous n'avons pas d'autre choix que de les extirper."
 PRC_SOV_Deport_Koreans_to_the_DPRK_desc:0 "De nombreux Coréens vivent sur notre territoire. Même s'ils sont les bienvenus ici, leur pays d'origine a besoin d'eux pour contribuer à la lutte contre l'oppression capitaliste."
 PRC_SOV_Expand_Forced_Labor_Facilities_in_the_Hsingan_Province_desc:0 "Une visite dans nos centres de rééducation suffit aux dissidents pour comprendre que nous ne voulons que le meilleur pour la Chine."
 PRC_SOV_Execute_the_Rural_Pacification_Campaign_desc:0 "Le banditisme sévit dans les campagnes depuis des décennies ; il est temps de trouver une solution permanente à ce problème récurrent."
 PRC_SOV_Begin_the_Manchurian_Economic_Recovery_Program_desc:0 "La Mandchourie a été ravagée par les Japonais et la Révolution nous a empêché de la reconstruire correctement. Maintenant que les choses sont calmes, nous pouvons concentrer notre attention sur la reprise."
 PRC_SOV_Request_Comecon_Aid_desc:0 "Nous avons besoin de l'aide de nos alliés du Comecon pour reconstruire après tant de guerres et de dévastations."
 PRC_SOV_Connect_the_Trans_Siberian_Railway_to_Bejing_desc:0 "Le chemin de fer transsibérien s'étend de Moscou à l'Extrême-Orient. Si nous pouvons y connecter nos lignes, notre commerce prospérera !"
 PRC_SOV_Invite_Soviet_Industrial_Advisors_desc:0 "L'industrie soviétique est l'une des plus puissantes au monde. Qui de mieux pour nous aider dans notre reconstruction d'après-guerre ?"
 PRC_SOV_Tie_the_Yuan_to_the_Soviet_Ruble_desc:0 "Lier le yuan aux décombres encouragera la discipline économique et rapprochera nos pays."
 PRC_SOV_Jumpstart_Consumer_Production_desc:0 "Les gens ont besoin de leurs biens, et nous les leur fournirons !"
 PRC_SOV_Develop_Steel_Industry_desc:0 "Notre industrie est à la traîne par rapport à beaucoup d'autres dans le monde, nous devons y remédier !"
 PRC_SOV_Begin_Coastal_Development_desc:0 "Pendant des milliers d'années, les ports et les marchés côtiers ont contribué à enrichir la Chine et à diffuser nos produits dans le monde entier. Investissons dans davantage de ces projets !"
 PRC_SOV_Electrification_Campaign_desc:0 "Un État moderne et industriel dépend de l'électricité. Que la lumière soit !"
 PRC_SOV_Balance_the_Military_Budget_desc:0 "L'armée est très importante, mais nous ne pouvons négliger les besoins de la population."
 PRC_SOV_Rebuild_a_Fiscal_System_desc:0 "Notre économie a été brisée par des décennies de guerre et de mauvaise gestion. Nous devons construire un système fiscal solide et socialiste."
 PRC_SOV_Launch_Agrarian_Reform_desc:0 "Les politiques odieuses des nationalistes en matière de propriété foncière doivent prendre fin. Le nord de la Chine sera libéré des propriétaires corrompus !"
 PRC_SOV_Introduce_Mass_Collectivization_desc:0 "La collectivisation est une étape nécessaire pour briser l'emprise des propriétaires fonciers sur le peuple."
 PRC_SOV_Redistribute_Manchurian_Private_Assets_desc:0 "Il n'existe pas de propriété privée dans un véritable État marxiste-léniniste, ces biens appartiennent à l'ensemble du collectif."
 PRC_SOV_Allow_Local_Farmers_Markets_desc:0 "Nous autoriserons l'existence de marchés de producteurs. Le tout par les voies appropriées et bien réglementées, bien sûr."
 PRC_SOV_Deport_Landlords_to_Vorkuta_desc:0 "Nous n'avons aucune utilité pour les propriétaires fonciers dans la nouvelle Chine, mais peut-être que nos camarades soviétiques pourront les mettre au travail ?"
 PRC_SOV_Liquidate_the_Growing_Kulak_Class_desc:0 "Il y a un nombre croissant de paysans dont les fermes deviennent trop grandes pour être confortables. Il faut les éliminer."
 PRC_SOV_Raise_Peasant_Tax_Rates_desc:0 "Personne n'aime les impôts, mais la faillite et l'austérité sont bien pires."
 PRC_SOV_The_20th_Congress_of_the_CPSU_desc:0 "Le nouveau secrétaire général de l'Union soviétique a convoqué un congrès du Parti. Bien entendu, nous enverrons un représentant parmi les autres Etats socialistes."
 PRC_SOV_Begin_Modernization_desc:0 "Le monde a radicalement changé depuis la fin de la guerre, nous ne pouvons pas nous permettre de prendre encore du retard ! La modernisation doit être réalisée !"
 PRC_SOV_Accept_Dengs_Reforms_desc:0 "Les réformes proposées par Deng Xiapoing nous aideront à bâtir une économie dynamique !"
 PRC_SOV_Maintain_Leninist_Economic_Orthodoxy_desc:0 "La réforme est une chose dangereuse ; nous ne pouvons pas nous permettre de détruire tout ce pour quoi nous avons travaillé si dur sur la base de projections et de prédictions."
 PRC_SOV_Restart_Limited_Privatization_desc:0 "La propriété réglementée des terres privées nous aidera à revigorer notre économie !"
 PRC_SOV_Attempt_to_Streamline_Central_Bureaucracy_desc:0 "Même les plus grandes nations peuvent devenir la proie d'une bureaucratie pléthorique. Faisons de notre mieux pour éviter cela."
 PRC_SOV_Found_the_Peking_University_of_Economics_desc:0 "Un centre d'enseignement supérieur dédié à l'étude de l'économie socialiste nous apporterait un grand bénéfice."
 PRC_SOV_Launch_Education_Reform_desc:0 "Une population ignorante est sensible à la contre-révolution et à la supercherie capitaliste."
 PRC_SOV_Expand_Study_Abroad_Programs_in_the_USSR_desc:0 "Certains de nos meilleurs esprits ont étudié à l'étranger, principalement en URSS. L'ouverture de programmes d'échange d'étudiants avec les Soviétiques offrira de nombreuses opportunités à nos jeunes étudiants !"
 PRC_SOV_Introduce_Mandatory_Secondary_Education_desc:0 "Pour que notre pays atteigne son plein potentiel, tout notre peuple doit recevoir une éducation secondaire appropriée !"
 PRC_SOV_Implement_Simplified_Chinese_in_Schooling_desc:0 "Afin d'accroître notre alphabétisation, une forme simplifiée de notre langage doit être créée et adoptée."
 PRC_SOV_Exploit_the_Riches_of_Manchuria_desc:0 "Nos industries naissantes sont avides de ressources, et la Mandchourie en a largement assez pour les alimenter."
 PRC_SOV_Replace_Obsolete_Mining_Equipment_desc:0 "Même les meilleurs outils finiront par devenir obsolètes. Il est temps de les remettre aux modèles plus récents."
 PRC_SOV_Replicate_the_Magnitogorsk_Steel_Plant_desc:0 "L'acier est un outil essentiel pour la construction moderne, il faudrait construire quelques usines dédiées à sa production."
 PRC_SOV_Prospect_for_Rare_Minerals_in_Outer_Mongolia_desc:0 "Les premières enquêtes suggèrent qu'il existe davantage de richesses en Mongolie intérieure. Trouvons-les !"
 PRC_SOV_Tackle_the_Housing_Crisis_desc:0 "À mesure que notre population augmente et s'installe dans les villes, la surpopulation augmente régulièrement. Nous avons besoin d'un endroit pour mettre tous ces gens."
 PRC_SOV_Modernize_Heavy_Infrastructure_Along_the_Amur_River_desc:0 "Il est temps que nos ponts et nos routes soient rénovés et mis aux normes modernes !"
 PRC_SOV_Conduct_the_First_National_Census_desc:0 "Tant de destructions ont secoué la Chine au cours des 30 dernières années que nous ne savons même pas combien de personnes il nous reste. Nous attendons depuis longtemps un recensement approprié."
 PRC_SOV_Mao_Zedong_Returns_to_Power_desc:0 "Le récent changement de pouvoir en Union soviétique constitue une occasion en or pour Mao et ses partisans de reprendre le contrôle du Parti communiste chinois."
 PRC_SOV_Introduce_Mass_Line_Politics_desc:0 "Les politiques de ligne de masse sont les idées synergiques des gens transformées en politiques à suivre. En d'autres termes, ils constituent un élément essentiel d'une démocratie populaire socialiste."
 PRC_SOV_Encourage_Self_Criticism_desc:0 "Nous sommes conscients que des erreurs coûteuses ont été commises dans le passé et nous encourageons la population à les signaler."
 PRC_SOV_Sever_Ties_with_the_USSR_desc:0 "L'intervention des Soviétiques dans la guerre visait moins à sauver le socialisme en Chine qu'à installer leur homme préféré dans notre gouvernement. Fini les intrus soviétiques !"
 PRC_SOV_Denounce_Khruschevite_Revisionism_desc:0 "Le révisionnisme menace de détruire tout le mouvement socialiste ! La nouvelle administration soviétique doit être critiquée pour ses idées dangereuses !"
 PRC_SOV_Purge_the_Ming_Administration_desc:0 "Wang Ming n'est rien d'autre qu'une marionnette soviétique, lui et ses partisans doivent être éliminés !"
 PRC_SOV_Increase_Press_Censorship_desc:0 "Des idées contre-révolutionnaires dangereuses se propagent dans les médias ; cela ne peut pas être autorisé !"
 PRC_SOV_Begin_Organizing_Large-Scale_Communes_desc:0 "La Chine est un pays densément peuplé dont les habitants ont de nombreux besoins. Les communes populaires doivent être organisées dans cet esprit."
 PRC_SOV_Escalate_Tension_with_the_ROC_desc:0 "Le gouvernement nationaliste continue d'abuser et de voler le peuple. La Révolution ne sera pas complète tant que toute la Chine ne sera pas rouge !"
 PRC_SOV_Clamp_Down_on_Anti-Soviet_Retoric_desc:0 "Les choses changent en Union Soviétique, et cela rend beaucoup de nos citoyens nerveux. En ces temps incertains, il est crucial d'entretenir de bonnes relations avec nos camarades."
 PRC_SOV_Eliminate_Remaining_Maoist_Loyalists_desc:0 "Les murmures d'un coup d'État maoïste peuvent être entendus dans les couloirs du gouvernement. Faites-les taire."
 PRC_SOV_Meet_with_Khruschev_desc:0 "Il est temps d'avoir une réunion formelle avec le nouveau secrétaire général de l'Union soviétique."
 PRC_SOV_Increase_Comecon_Collaboration_desc:0 "Une coopération accrue avec nos camarades européens ne peut être qu'une bonne chose."
 PRC_SOV_Declare_Eternal_Loyalty_to_Moscow_desc:0 "Même si le monde change dix mille fois, les relations avec nos frères soviétiques seront toujours fortes !"
 PRC_SOV_Sign_the_Sino-Czech_Arms_Research_Agreement_desc:0 "La coopération économique n'est pas la seule chose que nous pouvons offrir à nos alliés du Comecon. Pour repousser l'impérialisme capitaliste, nous devons partager nos armes."
 PRC_SOV_Tolerate_Private_Criticism_desc:0 "Le processus de la Révolution ne sera jamais sans erreurs, nous devons accepter les critiques justes et corriger les défauts de nos politiques lorsqu'ils surviennent."
 PRC_SOV_Expand_Industrial_Democracy_desc:0 "Les voix des travailleurs sont entendues et prises en compte grâce à des syndicats forts et organisés."
 PRC_SOV_Attempt_to_Ease_Tension_with_the_West_desc:0 "Nous devons nous rappeler que l'Est et l'Ouest ont combattu ensemble pour détruire le fascisme afin que les peuples du monde puissent vivre librement et en paix. Dans ce nouveau monde, le maintien de la paix nécessite la coopération et le dialogue."
 PRC_SOV_Begin_Preparations_for_the_Asian_Liberation_War_desc:0 "Maintenant que nous avons reconstruit et récupéré, il est temps d'en finir avec la Révolution !"
 PRC_SOV_Support_Communist_Insurgents_in_Southern_China_desc:0 "De nombreux partisans du communisme, nouveaux et anciens, opèrent dans le sud. Faites-leur savoir que le moment est venu."
 PRC_SOV_Form_the_Northern_Liberation_Front_desc:0 "Nous aurons besoin du soutien de nos camarades dans la bataille à venir, rallions-les à nos côtés !"
 PRC_SOV_Launch_the_Asian_Liberation_War_desc:0 "Tous les préparatifs sont terminés. L'heure de la libération de la Chine est arrivée !"
 PRC_SOV_Adopt_Order_227_in_the_PLA_desc:0 "§RPas un pas en arrière !§"
 PRC_SOV_Request_Greater_Soviet_Commitment_desc:0 "Il y a des années, les Soviétiques sont venus à notre secours lorsque nous en avions besoin. Nous avons encore une fois besoin de leur aide !"
 PRC_SOV_Re-Introduce_Peoples_War_Doctrine_desc:0 "Nous devons tous contribuer à la cause de la libération ! Tous les adultes valides doivent se battre !"
 PRC_SOV_Integrate_Back_Into_the_Iron_Curtian_desc:0 "La guerre est gagnée ! Enfin, la Chine entière peut prospérer sous un socialisme de style soviétique !"
 
 
