 moscow_mission:0 "Mission de Moscou"
 ussr_prc_assistance:0 "Demander une intervention soviétique"
 china_ssr:0 "Rejoindre l'Union Soviétique"
 founding_prc:0 "Cérémonie de fondation"
 founding_prc_desc:0 "Représentés dans la célèbre peinture à l'huile \"Kaiguó Dàdian\", Mao Zedong et les autres membres du Comité central inaugurent la République populaire de Chine sur la place Tiananmen à Pékin. La RPC est désormais officiellement le véritable successeur de la dynastie Qing ! Nous ne serons plus critiqués au niveau international ni privés de notre pouvoir !"
 kmt_truce:0 "Trêve avec le KMT"
 one_china:0 "La politique d'une seule Chine"
 one_china_desc:0 "Le Kuomintang a beau revendiquer la souveraineté, il n'est qu'une simple province rebelle. Il n'y a qu'une seule vraie Chine et le reste du monde doit nous reconnaître !"
 taiwan_liberation:0 "Libération de Taïwan"
 hundred_flowers:0 "Campagne des Cent Fleurs"
 spring_of_57:0 "Printemps chinois"
 usa_prc_assistance:0 "Demander l'intervention des États-Unis"
 prc_foreign_affairs:0 "Ministère des Affaires étrangères"
 prc_foreign_affairs_desc:0 "La Chine ne peut plus se concentrer entièrement sur elle-même. En 1949, la République populaire de Chine a créé le ministère des Affaires étrangères pour s'attaquer à toutes les questions extérieures. L'actuel Premier ministre, Zhou Enlai, a gracieusement accepté le poste de ministre des Affaires étrangères et a commencé le processus de création de relations diplomatiques officielles avec les nations du monde !"
 china_liberation:0 "Chine démocratique"
 prc_student_movement:0 "Mouvement étudiant"
 PRC_spring_of_57:0 "Printemps 57"
 ping_pong_diplo:0 "Diplomatie du ping-pong"
 ping_pong_diplo_desc:0 "La Chine possède certains des plus grands joueurs de ping-pong au monde, mais sans personne avec qui jouer, nous ne pouvons pas afficher notre domination. Ainsi, nous commencerons à organiser des compétitions avec les pays occidentaux, notamment avec les États-Unis. Espérons que cela contribuera à dégeler nos relations avec le reste du monde et à mettre en valeur notre supériorité athlétique."
