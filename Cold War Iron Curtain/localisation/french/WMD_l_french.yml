# nuke events
 wmd_nuke.2.t: "[GetNewspaperHeader]Frappe nucléaire chirurgicale"
 wmd_nuke.2.d: "La capitale de [?wmd_target_country.GetNameDef] a été ciblée par une attaque nucléaire de [ROOT.GetNameDef]. Il semble qu'ils aient cherché à anéantir les hauts dirigeants politiques et militaires de leur ennemi. Les rapports indiquent que les dégâts causés à la capitale ont été assez importants, mais semblent avoir spécifiquement ciblé le gouvernement et les dirigeants militaires. Un correspondant arrivé sur place a constaté une scène de dévastation et de confusion totale. Les dirigeants gouvernementaux et militaires en dehors de la capitale se trouvent dans une position difficile et ne sont actuellement pas en contact avec leurs dirigeants centraux. Il semble que [ROOT.GetNameDef] cherchait uniquement à démontrer sa puissance nucléaire et à ne pas infliger de lourdes pertes militaires ou civiles. Le monde retient son souffle en attendant des nouvelles de représailles ou de nouvelles attaques nucléaires."
 wmd_nuke.2.a: "Bien"
 wmd_nuke.2.b: "Juste le début ?"
 wmd_nuke.3.t: "[GetNewspaperHeader]Frappe nucléaire stratégique"
 wmd_nuke.3.d: "La nation de [?wmd_target_country.GetNameDef] a été touchée par une série de frappes nucléaires visant des installations clés, des bases militaires et des infrastructures stratégiques. Les premiers rapports indiquent que les principaux centres civils ont été épargnés. Un responsable rebelle du [?wmd_target_country.GetNameDef] a condamné l'attaque, affirmant que la puissance de feu et les retombées entraîneraient une perte massive de vies civiles. Rejetant les rapports initiaux, les frappes visaient à épargner les centres civils. Les premiers rapports ont incité les organisations humanitaires internationales à annoncer leur intention d'envoyer des équipes de secours. L'ampleur des frappes fait craindre qu'une nouvelle série d'attaques nucléaires ou de fortes représailles ne surviennent dans les heures à venir."
 wmd_nuke.3.a: "Excellent"
 wmd_nuke.3.b: "Quelle est la prochaine étape ?"
 wmd_nuke.4.t: "[GetNewspaperHeader]Frappe nucléaire d'annihilation totale"
 wmd_nuke.4.d: "Les nouvelles de [?wmd_target_country.GetNameDef] se sont soudainement arrêtées suite à une attaque nucléaire massive contre le pays par [ROOT.GetNameDef]. Les rapports sont rares et difficiles à confirmer, mais il semble qu'ils aient lancé une attaque nucléaire massive. Les centres civils, les cibles militaires et les infrastructures seraient complètement dévastés. Il n'y a pas de mot officiel, mais en privé, un responsable du [ROOT.GetNameDef] a déclaré que l'attaque avait été menée pour préserver la paix et garantir qu'il ne puisse y avoir une escalade ou des représailles égales. On ne sait pas encore quelle sera la réponse, mais de nombreux observateurs internationaux estiment que les nations devraient se préparer à apporter leur soutien aux survivants. La communauté mondiale stupéfaite ne peut qu'espérer que ce type de guerre nucléaire totale s'arrêtera ici et ne sera pas un signe avant-coureur des choses à venir."
 wmd_nuke.4.a: "Parfait"
 wmd_nuke.4.b: "La fin est proche"

 nuke_dropped.1.t: "[GetNewspaperHeader]Le premier bombardement atomique de la guerre froide"
 nuke_dropped.1.d: "Pour la première fois depuis la fin de la Seconde Guerre mondiale, une bombe nucléaire a explosé en [From.From.GetName] dans le cadre d'une guerre internationale. Cette destruction témoigne de la puissance dévastatrice de cette arme, qui est redoutée non seulement pour ses effets sur ses cibles, mais aussi pour ses implications pour celui qui la déploie et pour l'humanité elle-même.\n\nLe monde retient son souffle en attendant la suite. Cela forcera-t-il [From.From.owner.GetNameDef] à se rendre pour éviter de nouveaux actes de terreur, ou cela ne fera-t-il que renforcer leur détermination à riposter contre ceux qui auraient recours à de telles mesures ?"
 nuke_dropped.1.a: "L'ère atomique a véritablement commencé."
 nuke_dropped.1.b: "Nous ferons tout ce qui est nécessaire pour protéger le peuple [FROM.FROM.owner.GetAdjective]."
 nuke_dropped.2.t: "[GetNewspaperHeader]Bombardement atomique d'Hiroshima"
 nuke_dropped.2.d: "\"Les rues étaient comme une scène d'enfer.\"\n -Kuniyoshi Aikawa\n\nAujourd'hui, une bombe nucléaire a explosé au-dessus de la ville d'Hiroshima à 580 mètres d'altitude. Plus des deux tiers de la ville furent instantanément détruits. Bien que la ville ait été construite pour résister aux tremblements de terre, seules quelques structures robustes ont survécu à l'explosion.\n\nAlors que la puissance de la bombe atomique a été mise en avant dans l'esprit du public, le coût humain de cette arme a été minimisé. Aucune des deux parties ne veut contempler l'horreur de l'événement, mais son héritage sera celui de vies perdues en un clin d'oeil et de retombées durables."
 nuke_dropped.2.a: "Combien d'autres tomberont avant la fin de cette guerre ?"
 nuke_dropped.2.b: "Nous devons agir rapidement pour venir en aide aux victimes."
 nuke_dropped.3.t: "[GetNewspaperHeader]Bombardement atomique de Nagasaki"
 nuke_dropped.3.d: "Une bombe nucléaire, initialement destinée à Kokura, a explosé aujourd'hui au-dessus de Nagasaki. Les conditions météorologiques ont contraint les avions à dérouter leur mission, une combinaison de fumée, de nuages et de difficultés techniques étant des facteurs décisifs dans un événement qui pourrait bien changer l'histoire.\n\nLes effets de la bombe ont été quelque peu limités par la situation de la ville dans une vallée, mais les dégâts restent importants. Certaines installations militaires ont été touchées, mais les pertes civiles catastrophiques les éclipsent de loin. Il faudra peut-être des décennies avant que nous connaissions avec certitude les effets à long terme de cette arme."
 nuke_dropped.3.a: "Cela conduira-t-il à une reddition de [From.From.owner.GetAdjective] ?"
 nuke_dropped.3.b: "Nous avions espéré que Nagasaki serait épargnée."
 nuke_dropped.4.t: "[GetNewspaperHeader]Bombardement atomique de Berlin"
 nuke_dropped.4.d: "Aujourd'hui, à [GetDateText], la capitale allemande Berlin a été frappée par une explosion nucléaire. La ville a subi plusieurs attaques, au cours de cette guerre et de la dernière, mais tout le reste n'est rien en comparaison de celle-ci. Depuis la guerre de Trente Ans, Berlin n'a jamais connu une dévastation comparable - ce qui était considéré comme impossible au vu de sa croissance.\n\nLe Führerbunker semble avoir survécu à l'explosion au moins partiellement en raison de l'explosion de la bombe loin de son épicentre prévu, et la rumeur dit que [From.From.owner.GetLeader] serait toujours en vie, même s'il est indigné. Cependant, la manière dont les dirigeants des [From.From.owner.GetAdjective] doivent être évacués et s'ils peuvent être protégés des retombées est une autre affaire."
 nuke_dropped.4.a: "Aujourd'hui, je suis soulagé de ne pas être Berlinois."
 nuke_dropped.4.b: "Nos ennemis ont frappé au coeur de la nation !"
 nuke_dropped.5.t: "[GetNewspaperHeader]Bombardement atomique de Londres"
 nuke_dropped.5.d: "Une explosion nucléaire a dévasté aujourd'hui la ville de Londres. Malgré les défenses anti-aériennes de la ville, [From.From.owner.GetNameDef] n'était pas préparé à cette attaque. À [GetDateText], Big Ben a sonné pour la dernière fois, après avoir été fondu par l'explosion. Les premiers rapports suggèrent que le palais de Buckingham a été complètement rasé et que l'on ignore actuellement où se trouve la famille royale.\n\n[From.From.owner.GetLeader] il a néanmoins été confirmé qu'il a survécu et il prépare un discours passionnant pour la radio plus tard dans la journée. Avec un moral au plus bas, le peuple britannique a cruellement besoin de cela - ou d'une capitulation très éloquente."
 nuke_dropped.5.a: "Il est difficile de garder la lèvre supérieure raide face à une onde de souffle nucléaire."
 nuke_dropped.5.b: "Dieu sauve le roi !"
 nuke_dropped.6.t: "[GetNewspaperHeader]Bombardement atomique de Kyoto"
 nuke_dropped.6.d: "La ville de Kyoto, un important centre industriel [From.From.owner.GetAdjective], a été frappée aujourd'hui par une bombe nucléaire. On suppose que la ville a été choisie comme cible parce qu'elle était considérée comme un centre intellectuel.\n\nLa beauté et l'importance historique de Kyoto ont conduit beaucoup à penser qu'elle serait épargnée par la bombe, mais il semble que la terreur de faire pleuvoir la destruction sur un tel endroit a plutôt été considérée comme un avantage, augmentant l'impact psychologique de l'attaque. La situation de la ville dans la vallée a quelque peu limité l'explosion, mais l'ancien palais impérial et de nombreux bâtiments industriels ont été complètement détruits."
 nuke_dropped.6.a: "L'héritage et la beauté ne signifient rien dans une guerre comme celle-ci."
 nuke_dropped.6.b: "S'ils détruisent l'ancien, nous construirons du nouveau."
 nuke_dropped.7.t: "[GetNewspaperHeader]Bombardement atomique de Tokyo"
 nuke_dropped.7.d: "Aujourd'hui, une frappe nucléaire a été dirigée contre le coeur de l'Empire japonais. La capitale Tokyo, bien que censée être la cible de bombardements incendiaires, n'a jamais été considérée comme une cible prioritaire de cette nouvelle arme. Pourtant, en fin de compte, peut-être en raison de l'importance de la nouvelle capitale et du palais impérial qui a maintenant été détruit, un incendie encore plus dévastateur s'est abattu sur la ville.\n\nMême si [From.From.owner.GetLeader] aurait survécu, l'événement a soulevé des questions quant à savoir jusqu'où les ennemis du Japon sont prêts à aller. Si la guerre ne se termine pas ainsi, quelles sont les cibles restantes ? De quoi reste-t-il à menacer ?"
 nuke_dropped.7.a: "Cela signifie-t-il la fin de l'empire japonais ?"
 nuke_dropped.7.b: "Tant que [From.From.owner.GetLeader] vivra, l'Empire aussi."
 nuke_dropped.8.t: "[GetNewspaperHeader]Bombardement atomique de Washington D.C."
 nuke_dropped.8.d: "Une bombe nucléaire a explosé aujourd'hui au-dessus de la capitale des États-Unis. Dans une attaque clairement dirigée contre le centre politique et l'héritage historique des États-Unis, la Maison Blanche, le Capitole et un certain nombre de monuments et mémoriaux ont été effacés de la surface de la Terre. Même l'incendie de Washington, il y a plus d'un siècle, n'est rien en comparaison de la destruction infligée à la ville par cette arme dévastatrice.\n\nBien que le président [From.From.owner.GetLeader] ait été mis en sécurité, la nation a été profondément ébranlée. Il ne fait aucun doute que les États-Unis espéraient être le premier et le seul pays à utiliser une telle arme. Ces espoirs ont maintenant été brisés de la pire des manières."
 nuke_dropped.8.a: "Une nation indivisible contre un atome divisible."
 nuke_dropped.8.b: "L'aigle renaîtra de ses cendres comme un phénix."
 nuke_dropped.9.t: "[GetNewspaperHeader]Bombardement atomique de Rome"
 nuke_dropped.9.d: "Une explosion nucléaire a frappé la ville de Rome aujourd'hui, choquant les gens du monde entier. En raison de ses trésors historiques et artistiques, beaucoup n'auraient jamais pensé que la ville antique serait la cible d'une destruction aussi aveugle. Alors que la Cité du Vatican est également partiellement détruite et que l'on ignore où se trouve le pape, l'événement a horrifié non seulement les Italiens, mais aussi les catholiques du monde entier.\n\nLa croissance rapide de Rome au cours de la dernière décennie a été presque complètement anéantie par l'attaque. Pendant un certain temps, il a semblé que la ville pourrait contribuer au redressement du pays une fois la guerre terminée. Ces espoirs sont désormais réduits en poussière, tout comme celui de nombreuses personnes."
 nuke_dropped.9.a: "Bomba Iacta Est!"
 nuke_dropped.9.b: "Rome ne sera pas reconstruite en un jour..."
 nuke_dropped.10.t: "[GetNewspaperHeader]Bombardement atomique de Paris"
 nuke_dropped.10.d: "Aujourd'hui, un engin nucléaire a explosé au-dessus de la ville de Paris, provoquant des destructions considérables et d'innombrables victimes. La France était sous le choc lorsque sa capitale a subi ce qui pourrait être l'attaque la plus dévastatrice qu'elle ait jamais connue, malgré des siècles de guerres et de révolutions. Les Parisiens s'attendaient peut-être à une conquête, mais pas à une désolation totale et brutale.\n\nDans l'état actuel de la ville, tout défilé de victoire sur les Champs-Élysées devant les vestiges de l'Arc de Triomphe semble peu probable. Peut-être que les décennies à venir verront naître un nouveau Paris, mais dans l'esprit du public, Paris, la ville construite à la Belle Époque, a disparu à jamais."
 nuke_dropped.10.a: "La ville lumière a brûlé."
 nuke_dropped.10.b: "Hier encore, il semblait que nous aurions toujours Paris."
 nuke_dropped.11.t: "[GetNewspaperHeader]Bombardement atomique de Moscou"
 nuke_dropped.11.d: "Ville que beaucoup ont tenté sans succès de conquérir, Moscou est aujourd'hui la cible d'une attaque nucléaire. L'explosion était dirigée vers le coeur de la direction du [From.owner.GetAdjective], le Kremlin ayant été presque entièrement détruit par l'explosion.\n\n[From.From.owner.GetLeader], étant récemment devenu plus conscient et craintif de toutes les menaces possibles et impossibles, a été évacué à temps et a survécu. Cependant, même l'immensité de [From.From.owner.GetNameDef] pourrait ne pas suffire pour échapper à un ennemi aussi impitoyable. En effet, si cela continue, la nation ne sera bientôt plus composée que de deux sortes de friches : celles qui étaient là au départ, et celles créées par ses ennemis."
 nuke_dropped.11.a: "Un hiver nucléaire ne fera-t-il pas de Moscou une cible plus difficile ?"
 nuke_dropped.11.b: "Ils peuvent brûler toutes nos villes, mais ils ne les prendront jamais."
 nuke_dropped.12.t: "[GetNewspaperHeader]Bombardement atomique de Copenhague"
 nuke_dropped.12.d: "Aujourd'hui, la ville de Copenhague a été frappée par une explosion nucléaire. Ayant grandi après avoir échappé aux destructions de la Grande Guerre grâce à la neutralité du Danemark, la capitale n'a jamais connu une attaque aussi dévastatrice depuis les guerres napoléoniennes. La région environnante de l'Öresund a également connu d'importantes retombées et les survivants ont commencé à fuir vers la Fyn et le continent par crainte de nouvelles attaques.\n\nOn ignore actuellement où se trouve le roi Christian X et le moral de la nation a été gravement endommagé par l'attaque. Reste à savoir si c'est le début de la fin pour l'une des nations les plus anciennes d'Europe."
 nuke_dropped.12.a: "Quelque chose est irradié au Danemark."
 nuke_dropped.12.b: "La ville a déjà brûlé, mais elle n'a pas péri."
 nuke_dropped.12.c: "Avec le plutonium, nous mettons les Danois à genoux !"
 nuke_dropped.13.t: "[GetNewspaperHeader]Bombardement atomique de Stockholm"
 nuke_dropped.13.d: "La belle ville de Stockholm, fière Venise du Nord, a été frappée aujourd'hui par une bombe nucléaire. Malgré tous leurs efforts pour rester neutres dans le passé, les Suédois ont désormais payé le prix ultime du conflit international. L'épicentre de l'explosion se trouvait au centre-sud de Stockholm, une zone destinée à de futurs projets de développement et de grande construction, aujourd'hui détruite de manière irréversible.\n\nUne grande partie de la ville est méconnaissable, mais les anciennes structures de Slussen semblent avoir mieux survécu que prévu à l'explosion. Il a été décidé qu'il resterait intact pour toujours en tant que monument de la résilience de la ville."
 nuke_dropped.13.a: "Ainsi, la neutralité suédoise ne sera plus qu'un souvenir."
 nuke_dropped.13.b: "Le tigre suédois ne perdra pas ses rayures !"
