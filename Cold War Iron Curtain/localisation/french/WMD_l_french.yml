 RETALIATE_NUKES:0 "Très bien. C'était bien tant que ça a duré."
 declare_nuclear_power:0 "Déclarons la puissance nucléaire mondiale !"
 declare_nuclear_power_desc:0 "Nous avons enfin constitué un arsenal nucléaire digne de la crainte internationale. Nous pouvons désormais nous déclarer membres du club nucléaire, et fiers d'appartenir à un club capable de condamner l'humanité pour l'éternité."
 WMD.3.t:0 "[GetNewspaperHeader] Incident diplomatique : l'Union soviétique exige le retour de \"l'espion\" américain"
 WMD.3.d:0 "Moscou, URSS : Un homme, en proie à une crise de folie, a fait irruption dans le hall de l'ambassade américaine, poursuivi par les autorités russes.\n\nSe réclamant de l'immunité diplomatique, il a provoqué un véritable esclandre, choquant les témoins présents. L'homme hurlait hystériquement qu'une première frappe nucléaire soviétique était déjà en cours.\n\nDes témoins oculaires racontent que sa voix s'est brisée et que ses paroles rauques ont résonné aux oreilles de tous les présents, avant qu'il ne s'effondre à genoux, silencieux. L'ambassade américaine n'a pas encore commenté l'incident, et l'homme, connu sous le nom de « Dmitri Polyakov », est actuellement détenu par les autorités américaines."
 WMD.31.t:0 "[GetNewspaperHeader]Des informations font état de multiples lancements nucléaires possibles à travers les États-Unis"
 WMD.31.d:0 "Wamego, Kansas : La petite ville rustique, habituée au bruit des troupeaux et aux jeux des enfants dans les rues, s’était figée.\n\nHommes, femmes et enfants fixaient l’horizon, pétrifiés d’horreur. Des centaines de traînées lumineuses s’élevaient du sol et s’élançaient vers le ciel, ne laissant apparaître que fumée à l’horizon.\n\nPeut-être étaient-ils parmi les premiers à entrevoir ce qui attendait l’humanité, et la terreur semblait les avoir paralysés."
 WMD.6.t:0 "[GetNewspaperHeader]Une frappe de représailles soviétique ?"
 WMD.6.d:0 "Après la première frappe nucléaire sur le bloc soviétique et une journée de silence radio, le président américain [?USA.GetLeader] a déclaré que la bête communiste avait été vaincue une fois pour toutes.\n\nCependant, des agences spatiales internationales ont signalé le lancement d'un grand nombre de missiles depuis le cœur de l'Union soviétique. À ce jour, ces informations ne peuvent être confirmées, mais le président a assuré qu'une première frappe réussie et dévastatrice avait rendu les Soviétiques incapables de riposter."
 WMD.7.t:0 "[GetNewspaperHeader]Une frappe de représailles américaine ?"
 WMD.7.d:0 "Cheyenne, Wyoming : Notre ville semble avoir été épargnée par la première salve de missiles rouges, alors qu’un cauchemar latent se concrétise enfin. Les récits de villes entières rayées de la carte et de brasiers ravageant les zones restantes ont semé la crainte d’une nouvelle frappe qui anéantirait toute vie sur ce continent.\n\nLe président [USA.GetLeader] n’a fait aucune déclaration publique à ce jour, et les rumeurs d’un effondrement de Washington vont bon train. L’espoir de toute une nation repose entre les mains de capitaines qui gisent au fond des océans ; ils demeurent notre seul espoir d’entraîner les Rouges dans leur chute."
