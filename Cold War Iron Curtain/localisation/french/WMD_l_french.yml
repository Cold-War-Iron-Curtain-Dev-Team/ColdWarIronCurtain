 wmd_nuke.2.t:0 "[GetNewspaperHeader] Frappe nucléaire chirurgicale"
 wmd_nuke.2.d:0 "La capitale de [?wmd_target_country.GetNameDef] a été la cible d'une attaque nucléaire menée par [ROOT.GetNameDef]. Il semblerait que l'objectif était d'anéantir les plus hauts dirigeants politiques et militaires de l'ennemi. Selon les rapports, les dégâts dans la capitale sont considérables et semblent avoir visé spécifiquement le gouvernement et les chefs militaires. Un correspondant arrivé sur place a décrit une scène de désolation et de confusion totales. Les dirigeants gouvernementaux et militaires situés hors de la capitale se trouvent dans une situation délicate et sont actuellement sans contact avec leur commandement central. Il semblerait que [ROOT.GetNameDef] ait uniquement cherché à démontrer sa puissance nucléaire et non à infliger des pertes civiles ou militaires massives. Le monde retient son souffle dans l'attente d'une riposte ou de nouvelles attaques nucléaires."
 wmd_nuke.2.a:0 "Bien"
 wmd_nuke.2.b:0 "Ce n'est que le début ?"
 wmd_nuke.3.t:0 "[GetNewspaperHeader] Frappe nucléaire stratégique"
 wmd_nuke.3.d:0 "Le pays de [?wmd_target_country.GetNameDef] a été frappé par une série de frappes nucléaires visant des installations clés, des bases militaires et des infrastructures stratégiques. Selon les premières informations, les principaux centres civils ont été épargnés. Un responsable de [?wmd_target_country.GetNameDef] a condamné l'attaque avec fermeté, affirmant que la puissance de feu et les retombées radioactives entraîneraient des pertes civiles massives. Il a ainsi rejeté les premières informations selon lesquelles les frappes visaient à épargner les zones civiles. Ces premières informations ont incité les organisations humanitaires internationales à annoncer l'envoi d'équipes de secours. L'ampleur des frappes fait craindre une nouvelle série d'attaques nucléaires ou une riposte massive dans les prochaines heures."
 wmd_nuke.3.a:0 "Excellent"
 wmd_nuke.3.b:0 "Et ensuite ?"
 wmd_nuke.4.t:0 "[GetNewspaperHeader] Frappe nucléaire d'annihilation totale"
 wmd_nuke.4.d:0 "Les nouvelles en provenance de [?wmd_target_country.GetNameDef] ont cessé brutalement suite à une attaque nucléaire massive menée par [ROOT.GetNameDef]. Les informations sont rares et difficiles à confirmer, mais il semblerait qu'une attaque nucléaire d'une ampleur considérable ait été lancée. Des centres civils, des cibles militaires et des infrastructures seraient entièrement dévastés. Aucune déclaration officielle n'a été faite, mais un responsable de [ROOT.GetNameDef] a déclaré, sous couvert d'anonymat, que l'attaque visait à préserver la paix et à éviter toute escalade ou représailles équivalentes. Aucune riposte n'a été annoncée, mais de nombreux observateurs internationaux estiment que les nations devraient se préparer à apporter leur soutien aux survivants. La communauté internationale, sous le choc, ne peut qu'espérer que ce type de guerre nucléaire totale s'arrête là et ne présage rien de nouveau."
 wmd_nuke.4.a:0 "Parfait"
 wmd_nuke.4.b:0 "La fin est proche"
 nuke_dropped.1.t:0 "[GetNewspaperHeader]Le premier bombardement atomique de la guerre froide"
 nuke_dropped.1.d:0 "Pour la première fois depuis la fin de la Seconde Guerre mondiale, une bombe nucléaire a explosé à [From.From.GetName] dans le cadre d'un conflit international. Cette destruction témoigne de la puissance dévastatrice de cette arme, redoutée non seulement pour ses effets sur ses cibles, mais aussi pour les conséquences qu'elle entraîne pour celui qui l'utilise et pour l'humanité tout entière.\n\nLe monde retient son souffle, attendant la suite. Cette explosion contraindra-t-elle [From.From.owner.GetNameDef] à capituler pour éviter de nouvelles terreurs, ou ne fera-t-elle que renforcer sa détermination à riposter contre ceux qui recourent à de telles méthodes ?"
 nuke_dropped.1.a:0 "L'ère atomique a véritablement commencé."
 nuke_dropped.1.b:0 "Nous ferons tout ce qui est nécessaire pour protéger les [FROM.FROM.owner.GetAdjective] personnes."
 nuke_dropped.2.t:0 "[GetNewspaperHeader] Bombardement atomique d'Hiroshima"
 nuke_dropped.2.d:0 "« Les rues étaient un véritable champ de bataille. »\n - Kuniyoshi Aikawa.\n\nAujourd'hui, une bombe nucléaire a explosé au-dessus d'Hiroshima à 580 mètres d'altitude. Plus des deux tiers de la ville ont été instantanément détruits. Malgré sa construction parasismique, seuls quelques bâtiments robustes ont résisté à l'explosion.\n\nSi la puissance de la bombe atomique a été largement exagérée, son coût humain a été minimisé. Aucun des deux camps ne souhaite se confronter à l'horreur de cet événement, mais son héritage restera celui de vies fauchées en un instant et de conséquences durables."
 nuke_dropped.2.a:0 "Combien d'autres tomberont avant la fin de cette guerre ?"
 nuke_dropped.2.b:0 "Nous devons agir rapidement pour venir en aide aux victimes."
 nuke_dropped.3.t:0 "[GetNewspaperHeader] Bombardement atomique de Nagasaki"
 nuke_dropped.3.d:0 "Une bombe nucléaire, initialement destinée à Kokura, a explosé aujourd'hui au-dessus de Nagasaki. Les conditions météorologiques ont contraint les avions à dévier de leur mission ; la fumée, les nuages ​​et des difficultés techniques ont été des facteurs déterminants dans cet événement qui pourrait bien changer le cours de l'histoire.\n\nLes effets de la bombe ont été quelque peu atténués par la situation de la ville dans une vallée, mais les dégâts restent considérables. Certaines installations militaires ont été touchées, mais les pertes civiles catastrophiques les éclipsent largement. Il faudra peut-être des décennies avant de connaître avec certitude les effets à long terme de cette arme."
 nuke_dropped.3.a:0 "Cela mènera-t-il à la reddition de [From.From.owner.GetAdjective] ?"
 nuke_dropped.3.b:0 "Nous avions espéré que Nagasaki serait épargnée."
 nuke_dropped.4.t:0 "[GetNewspaperHeader] Bombardement atomique de Berlin"
 nuke_dropped.4.d:0 "Aujourd'hui, à [GetDateText], Berlin, la capitale allemande, a été frappée par une explosion nucléaire. La ville a subi plusieurs attaques, durant cette guerre et la précédente, mais aucune n'est comparable à celle-ci. Depuis la guerre de Trente Ans, Berlin n'a pas connu de dévastation d'une telle ampleur – compte tenu de son développement, une telle catastrophe était considérée comme impossible.\n\nLe Führerbunker semble avoir survécu à l'explosion, au moins en partie grâce au fait que la bombe a explosé loin de son épicentre prévu, et [From.From.owner.GetLeader] serait, selon la rumeur, toujours en vie, bien qu'indigné. La question de l'évacuation des dirigeants [From.From.owner.GetAdjective] et de leur protection contre les retombées radioactives reste cependant entière."
 nuke_dropped.4.a:0 "Aujourd'hui, je suis soulagé de ne pas être Berlinois."
 nuke_dropped.4.b:0 "Nos ennemis ont frappé au cœur de la nation !"
 nuke_dropped.5.t:0 "[GetNewspaperHeader] Bombardement atomique de Londres"
 nuke_dropped.5.d:0 "Une explosion nucléaire a dévasté Londres aujourd'hui. Malgré les défenses antiaériennes de la ville, [From.From.owner.GetNameDef] n'était pas préparée à une telle attaque. À [GetDateText], Big Ben a sonné pour la dernière fois, fondu par l'explosion. Selon les premières informations, Buckingham Palace a été entièrement rasé et on ignore actuellement où se trouve la famille royale.\n\n[From.From.owner.GetLeader] a néanmoins survécu et prépare un discours vibrant pour la radio plus tard dans la journée. Le moral étant au plus bas, le peuple britannique a désespérément besoin de cela – ou d'une capitulation éloquente."
 nuke_dropped.5.a:0 "Il est difficile de garder son sang-froid face à une onde de choc nucléaire."
 nuke_dropped.5.b:0 "Dieu sauve le Roi !"
 nuke_dropped.6.t:0 "[GetNewspaperHeader] Bombardement atomique de Kyoto"
 nuke_dropped.6.d:0 "La ville de Kyoto, important centre industriel du [From.From.owner.GetAdjective], a été frappée aujourd'hui par une bombe nucléaire. On suppose qu'elle a été choisie comme cible en raison de son statut de centre intellectuel.\n\nLa beauté et l'importance historique de Kyoto ont fait croire à beaucoup qu'elle serait épargnée, mais il semble que la terreur de voir la destruction s'abattre sur un tel lieu ait été perçue comme un avantage, renforçant l'impact psychologique de l'attaque. La situation de la ville dans la vallée a quelque peu limité l'explosion, mais l'ancien palais impérial et de nombreux bâtiments industriels ont été entièrement détruits."
 nuke_dropped.6.a:0 "L'héritage et la beauté ne signifient rien dans une guerre comme celle-ci."
 nuke_dropped.6.b:0 "S'ils détruisent l'ancien, nous construirons le nouveau."
 nuke_dropped.7.t:0 "[GetNewspaperHeader] Bombardement atomique de Tokyo"
 nuke_dropped.7.d:0 "Aujourd'hui, une frappe nucléaire a visé le cœur de l'Empire japonais. Tokyo, la capitale, bien que pressentie comme cible d'un bombardement incendiaire, n'était pas considérée comme une cible prioritaire pour cette nouvelle arme. Pourtant, en fin de compte, peut-être en raison de l'importance de la nouvelle capitale et du Palais impérial désormais détruits, un incendie encore plus dévastateur s'est abattu sur la ville.\n\nBien que [From.From.owner.GetLeader] ait survécu, cet événement soulève des questions quant aux limites que les ennemis du Japon sont prêts à franchir. Si la guerre ne s'achève pas ainsi, quelles cibles restent-ils ? Quelles menaces subsistent ?"
 nuke_dropped.7.a:0 "Cela signifie-t-il la fin de l'empire japonais ?"
 nuke_dropped.7.b:0 "Tant que [From.From.owner.GetLeader] vivra, l'Empire vivra aussi."
 nuke_dropped.8.t:0 "[GetNewspaperHeader]Bombardement atomique de Washington D.C."
 nuke_dropped.8.d:0 "Une bombe nucléaire a explosé aujourd'hui au-dessus de Washington, la capitale des États-Unis. Dans une attaque clairement dirigée contre le cœur politique et l'héritage historique du pays, la Maison Blanche, le Capitole et de nombreux monuments et mémoriaux ont été rayés de la carte. Même l'incendie de Washington il y a plus d'un siècle paraît insignifiant en comparaison de la destruction infligée à la ville par cette arme dévastatrice.\n\nBien que le président [From.From.owner.GetLeader] ait été mis en sécurité, la nation est profondément ébranlée. Nul doute que les États-Unis espéraient être le premier et le seul pays à posséder une telle arme. Ces espoirs ont été anéantis de la pire des manières."
 nuke_dropped.8.a:0 "Une nation, indivisible, contre un atome, divisible."
 nuke_dropped.8.b:0 "L'aigle renaîtra de ses cendres tel un phénix."
 nuke_dropped.9.t:0 "[GetNewspaperHeader] Bombardement atomique de Rome"
 nuke_dropped.9.d:0 "Une explosion nucléaire a frappé Rome aujourd'hui, provoquant l'horreur dans le monde entier. Compte tenu de ses trésors historiques et artistiques, beaucoup n'auraient jamais imaginé que la ville antique puisse être la cible d'une destruction aussi aveugle. La Cité du Vatican étant également partiellement détruite et le sort du pape inconnu, l'événement a horrifié non seulement les Italiens, mais aussi les catholiques du monde entier.\n\nLa croissance rapide de Rome au cours de la dernière décennie a été presque entièrement anéantie par l'attaque. Pendant un temps, il semblait que la ville pourrait contribuer au redressement du pays après la guerre. Ces espoirs sont désormais réduits à néant, emportant avec eux de nombreuses vies."
 nuke_dropped.9.a:0 "La bombe a été larguée !"
 nuke_dropped.9.b:0 "Rome ne se reconstruira pas en un jour..."
 nuke_dropped.10.t:0 "[GetNewspaperHeader] Bombardement atomique de Paris"
 nuke_dropped.10.d:0 "Aujourd'hui, une bombe nucléaire a explosé au-dessus de Paris, provoquant des destructions massives et d'innombrables victimes. La France est sous le choc : sa capitale a subi ce qui est peut-être l'attaque la plus dévastatrice de son histoire, malgré des siècles de guerres et de révolutions. Les Parisiens s'attendaient sans doute à la conquête, mais pas à une désolation aussi brutale.\n\nDans l'état actuel de la ville, il semble improbable que l'on puisse imaginer des défilés triomphaux sur les Champs-Élysées, devant les vestiges de l'Arc de Triomphe. Les décennies à venir verront peut-être la naissance d'un nouveau Paris, mais le Paris de l'imaginaire collectif, celui de la Belle Époque, a disparu à jamais."
 nuke_dropped.10.a:0 "La cité des lumières s'est éteinte."
 nuke_dropped.10.b:0 "Pas plus tard qu'hier, il nous semblait que Paris serait toujours là."
 nuke_dropped.11.t:0 "[GetNewspaperHeader] Bombardement atomique de Moscou"
 nuke_dropped.11.d:0 "Moscou, ville que beaucoup ont tenté de conquérir en vain, a été la cible d'une attaque nucléaire aujourd'hui. L'explosion visait le cœur même du pouvoir de [From.owner.GetAdjective], le Kremlin étant presque entièrement détruit par le souffle.\n\n [From.From.owner.GetLeader], récemment devenus plus conscients et plus craintifs face à toutes les menaces, même les plus improbables, ont évacué à temps et ont survécu. Cependant, même l'immensité de [From.From.owner.GetNameDef] pourrait ne pas suffire à échapper à un ennemi aussi impitoyable. En effet, si la situation perdure, le pays ne sera bientôt plus qu'un ensemble de deux types de terres désolées : celles d'origine et celles créées par ses ennemis."
 nuke_dropped.11.a:0 "Un hiver nucléaire ne ferait-il pas que rendre Moscou plus difficile à atteindre ?"
 nuke_dropped.11.b:0 "Ils peuvent brûler toutes nos villes, mais ils ne les prendront jamais."
 nuke_dropped.12.t:0 "[GetNewspaperHeader] Bombardement atomique de Copenhague"
 nuke_dropped.12.d:0 "Aujourd'hui, Copenhague a été frappée par une explosion nucléaire. Ayant prospéré après avoir échappé aux destructions de la Première Guerre mondiale grâce à la neutralité du Danemark, la capitale n'avait jamais subi d'attaque d'une telle ampleur depuis les guerres napoléoniennes. La région d'Öresund a également été fortement touchée par les retombées radioactives et les survivants ont commencé à fuir vers Fyn et le continent, craignant de nouvelles attaques.\n\nOn ignore actuellement où se trouve le roi Christian X et le moral de la nation a été profondément affecté par l'attaque. L'avenir nous dira si cela marque le début de la fin pour l'une des plus anciennes nations d'Europe."
 nuke_dropped.12.a:0 "Quelque chose est irradié dans l'État du Danemark."
 nuke_dropped.12.b:0 "La ville a déjà brûlé, mais elle n'a pas péri."
 nuke_dropped.12.c:0 "Avec le plutonium, nous mettrons les Danois à genoux !"
 nuke_dropped.13.t:0 "[GetNewspaperHeader] Bombardement atomique de Stockholm"
 nuke_dropped.13.d:0 "La magnifique ville de Stockholm, fière Venise du Nord, a été frappée aujourd'hui par une bombe nucléaire. Malgré leurs efforts passés pour rester neutres, les Suédois paient désormais le prix ultime du conflit international. L'épicentre de l'explosion se situait en plein cœur du sud de Stockholm, une zone destinée à de futurs développements et à de grands projets de construction, désormais irrémédiablement détruite.\n\nUne grande partie de la ville est méconnaissable, mais les vieux bâtiments de Slussen semblent avoir mieux résisté à l'explosion que prévu. Il a été décidé de les laisser intacts à jamais, comme un monument à la résilience de la ville."
 nuke_dropped.13.a:0 "Avec cela, la neutralité suédoise ne sera plus qu'un souvenir."
 nuke_dropped.13.b:0 "Le tigre suédois ne perdra pas ses rayures !"