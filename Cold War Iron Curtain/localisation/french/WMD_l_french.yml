 WMD.3.t: "[GetNewspaperHeader] Incident diplomatique, alors que l'Union soviétique exige le retour de « l'espion » américain"
 WMD.3.d: "Moscou, URSS : Un homme fou s'est écrasé frénétiquement dans le hall de l'ambassade américaine alors que les autorités russes restaient à sa poursuite. \n\nRéclamant l'immunité diplomatique et créant toute une scène, les spectateurs sont restés choqués alors que l'homme criait hystériquement à une première frappe nucléaire de l'Union soviétique qui avait déjà été déclenchée. \n\nDes témoins oculaires racontent que la voix de l'homme était brisée et que ses paroles rauques perçaient les oreilles de toutes les personnes présentes, alors qu'il tombait à genoux et restait silencieux. L'ambassade américaine n'a pas encore commenté l'incident et l'homme connu uniquement sous le nom de « Dmitri Polyakov » est actuellement détenu aux États-Unis."
 
 WMD.31.t: "[GetNewspaperHeader]Rapports faisant état de plusieurs lancements nucléaires possibles à travers les États-Unis"
 WMD.31.d: "Wamego, Kansas : La ville rustique, habituée au bruit du bétail et des enfants jouant dans les rues, s'était arrêtée. \n\n Les hommes, les femmes et les enfants regardaient au loin avec une pure horreur. Des centaines de rayons de lumière s'étaient élevés du sol et s'étaient élevés vers le ciel, ne peignant l'horizon que de fumée. \n\nPeut-être étaient-ils parmi les premiers à avoir réalisé ce qui attendait l'humanité, et il semblait que la simple terreur les avait figés sur place. "
 
 WMD.6.t: "[GetNewspaperHeader]Une frappe de représailles soviétique ?"
 WMD.6.d: "Après la première frappe nucléaire contre le bloc soviétique et après une journée de silence radio, le président [?USA.GetLeader] avait déclaré que la bête communiste avait été tuée une fois pour toutes. \n\nCependant, les agences spatiales internationales ont signalé le lancement d'un nombre massif de missiles depuis les profondeurs du territoire soviétique. Pour l'instant, ces informations ne peuvent pas être confirmées, mais le président a assuré qu'une première frappe réussie et débilitante avait rendu les Soviétiques incapables de réagir. "
 
 WMD.7.t: "[GetNewspaperHeader]Une frappe de représailles américaine ?"
 WMD.7.d: "Cheyenne, Wyoming : Notre ville semble avoir été épargnée par la première salve de missiles rouges, alors qu'un cauchemar persistant se manifeste enfin. Les informations selon lesquelles des villes entières auraient été effacées de la surface de la Terre et des tempêtes de feu consumant le reste ont fait craindre d'être la cible d'une autre frappe visant à priver ce continent de toute vie. \n\nLe président [USA.GetLeader] n'a pour l'instant fait aucune annonce publique et les rumeurs sur l'effondrement de Washington vont bon train. Les espoirs d'une nation reposent entre les mains des capitaines qui gisent dans les profondeurs des océans, qui restent notre seul espoir d'entraîner les Rouges en enfer avec nous."

