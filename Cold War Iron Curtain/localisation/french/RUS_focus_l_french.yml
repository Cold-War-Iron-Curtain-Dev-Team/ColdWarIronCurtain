### Russia 1990's ###

 CSTO.1.d: "Dans un développement historique, les dirigeants de la Communauté des États indépendants (CEI) ont annoncé la formation des Forces armées unies, ouvrant la voie à une nouvelle ère de coopération militaire et de sécurité régionale. L'accord historique a été signé aujourd'hui à Minsk par les principaux représentants des États membres de la CEI, témoignant d'un engagement collectif en faveur de la stabilité et de la défense.\n\nDes responsables de haut rang de toute la CEI, dont le président russe Boris Eltsine, le président ukrainien Leonid Kravtchouk et le président biélorusse Stanislav Shushkevich, se sont réunis à Minsk pour finaliser l'accord. La nouvelle alliance militaire vise à unifier les stratégies de défense des anciennes républiques soviétiques, en garantissant une approche coordonnée de la sécurité régionale."
 CSTO.2.d: "Dans le cadre d'un changement important au sein de la Communauté des États indépendants (CEI), la décision de dissoudre les Forces armées unies a été officiellement annoncée aujourd'hui. Parallèlement, les dirigeants de la CEI ont signé le Traité de sécurité collective, établissant un nouveau cadre pour la sécurité et la coopération régionales.\n\nLa dissolution des Forces armées unies marque la fin d'un effort ambitieux mais ambitieux visant à unifier les forces militaires des anciennes républiques soviétiques. Depuis sa création, les Forces armées unies ont été confrontées à de nombreux obstacles logistiques et politiques qui ont nui à leur efficacité. Les intérêts et priorités nationaux divergents devenant de plus en plus prononcés, les États membres ont convenu qu'une nouvelle approche était nécessaire.\n\nÀ la suite de la dissolution des Forces armées unies, les dirigeants de la CEI ont rapidement décidé de créer le Traité de sécurité collective (CST). Le traité, signé aujourd'hui à Minsk, vise à favoriser un accord de sécurité collaboratif tout en respectant la souveraineté et les besoins uniques de chaque État membre."
 CSTO.3.d: "Dans le cadre du développement de la sécurité régionale, la Communauté des États indépendants (CEI) a rebaptisé son alliance militaire en Organisation du Traité de sécurité collective (OTSC). Ce changement de marque reflète un engagement renouvelé en faveur d'une défense coopérative et une approche plus structurée pour relever les défis de sécurité modernes.\n\nLe changement de nom en CSTO marque la dernière évolution dans l'approche de la CEI en matière de sécurité collective. Initialement créée sous le nom de Forces armées unies, puis réformée dans le cadre du Traité de sécurité collective, l'organisation s'est continuellement adaptée à l'évolution du paysage géopolitique et aux divers besoins de ses États membres."

