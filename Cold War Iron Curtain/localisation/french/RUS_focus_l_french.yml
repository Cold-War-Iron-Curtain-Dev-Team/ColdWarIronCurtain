SMO.1.d: "La situation en Ukraine s'est aggravée, les troupes russes ayant réussi à envahir et à s'emparer de la ville de Kiev. Malgré les efforts des forces ukrainiennes, elles se sont révélées incapables de freiner l'avancée des forces armées russes. Les responsables ukrainiens restants ont été contraints de fuir la ville en toute hâte, le président étant parti plusieurs jours avant la prise de pouvoir par les Russes.\nÀ la suite de l'invasion, le président ukrainien a démissionné de ses fonctions, laissant un vide de pouvoir qu'il fallait combler de toute urgence. En l'absence d'un dirigeant dûment élu, la Verkhovna Rada a élu Ioulia Timochenko, également connue sous le nom de « princesse du gaz », comme présidente par intérim de l'Ukraine. Sa nomination est considérée comme une mesure temporaire jusqu'à ce qu'un nouveau dirigeant puisse être élu et que le pays puisse retrouver sa stabilité."
SMO.2.d: "En tant qu'ancien membre de l'Union soviétique, le Kazakhstan bénéficiait d'un emplacement stratégique et d'un accès à un vaste arsenal d'armes de l'ère soviétique, ce qui en faisait un allié crucial pour la Russie.\nCependant, les choses ne se sont pas déroulées comme prévu. Après une bataille prolongée et sanglante dans la ville d'Alma Ata, le président kazakh Noursoultan Nazarbaïev a déclaré sa capitulation sans condition à la Fédération de Russie. Cela a surpris ceux qui s'attendaient à ce que le Kazakhstan résiste plus longtemps à l'armée russe.\nAprès la capitulation, le président Alexandre Rutskoy a établi une zone d'administration militaire kazakhe pour gouverner le pays, nommant Viktor Samsonov à sa tête. Entre-temps, les régions du nord du Kazakhstan, qui comptaient une importante population russe, ont été annexées à la Fédération de Russie."
