l_french: 
 Indonesian_National_Revolution.1.d:0 "L'offensive néerlandaise de l'année dernière nous a plongés dans une guérilla à Java et à Sumatra. La pression internationale les a forcés à rentrer à Yogyakarta et à accepter des négociations. Un cessez-le-feu est actuellement en vigueur, même si nos forces sont engagées dans des opérations de guérilla. Nos forces se reconstruisent lentement. Nous devons déterminer comment aborder les Néerlandais jusqu'à ce qu'un cessez-le-feu global soit mis en place. La plupart des commandants souhaitent poursuivre la guérilla et tenir jusqu'à la paix définitive. D'autres commandants affirment que nous devons changer les conditions sur le terrain. Ils proposent de prendre un mois pour réorganiser certains de nos combattants en unités de combat et lancer des offensives pour forcer les Néerlandais à quitter Java et Sumatra afin de garantir que nous contrôlons les pourparlers de paix. Toutefois, un échec de l'offensive pourrait s'avérer désastreux."
 Indonesian_National_Revolution.2.d:0 "La situation militaire actuelle semble au point mort. Nos forces ont réussi à reconquérir des sites clés à Java et à Sumatra l'année dernière lors de l'opération Kraai, mais la pression internationale nous a forcés à faire des concessions, notamment en restituant Yogyakarta en échange d'un accord de négociation d'un règlement. Il semble qu'un cessez-le-feu plus substantiel ait été établi et que des négociations auront lieu dans quelques mois pour déterminer un règlement final. Nos responsables militaires ont deux plans : le premier consiste à préparer nos forces à une offensive. Même si cela entraînera une réaction internationale et brisera le cessez-le-feu actuel, le coût en vaudra peut-être la peine. Si nos forces remportent une défaite dévastatrice contre les rebelles, nous contrôlons les négociations. Cependant, une offensive ratée serait désastreuse. Une autre option, plus sûre, consiste à conserver le contrôle des zones dont nous disposons actuellement et à tenir jusqu'aux négociations."
 Indonesian_National_Revolution.3.d:0 "À la suite de l'opération Kraai, les Pays-Bas ont été contraints d'arrêter leur offensive et de restituer la capitale républicaine de Yogyakarta et son gouvernement, en échange d'un cessez-le-feu. Alors que le gouvernement républicain devrait bientôt revenir et que des négociations globales devraient avoir lieu dans quelques mois, le gouvernement néerlandais a décidé de retirer tous ses citoyens de Yogyakarta. Les responsables militaires néerlandais exhortent leurs citoyens à ne pas tarder, car le retour de l'autorité républicaine dans la région les expose à un risque accru. Le gouvernement républicain étant en constante évolution, ils n'ont publié aucune déclaration sur la question."
 Indonesian_National_Revolution.4.d:0 "Le gouvernement républicain est officiellement revenu au pouvoir dans sa capitale Yogyakarta. Beaucoup de ses membres avaient fui ou avaient été détenus et exilés par les Néerlandais après la prise de la ville par ses forces lors de l'opération Kraai. Cependant, suite à d'intenses pressions internationales, ils ont accepté de rendre la ville et les dirigeants républicains pour faciliter les pourparlers, qui doivent avoir lieu prochainement. L'arrivée du célèbre leader républicain Sukarno a amené la plupart des habitants de la ville dans les rues pour célébrer son retour. Les Néerlandais avaient espéré que la capture de hauts dirigeants politiques briserait la résistance militaire, mais cela n'a pas été le cas. Malgré l'accueil chaleureux, des rapports ont indiqué que les commandants militaires refusaient d'accepter le retour d'un gouvernement civil, les accusant d'abandonner la révolution. Cependant, l'intervention de plusieurs hauts commandants, dont le colonel Suharto, a permis de garantir que les forces militaires républicaines restent fidèles à Sukarno."
 Indonesian_National_Revolution.5.d:0 "Avec le gouvernement républicain au pouvoir, des efforts sont déployés pour préparer l'indépendance. L'un des plus grands problèmes est de savoir à quoi ressemblera la future armée indonésienne. Après d'intenses discussions, il fut décidé que l'armée républicaine constituerait la base d'une armée indonésienne unifiée, toutes les autres forces irrégulières ou coloniales étant intégrées sur ces lignes. De nombreux observateurs estiment que cette décision pourrait être une tentative du gouvernement de se rapprocher des officiers militaires républicains qui, il y a quelques semaines à peine, ont refusé d'accepter leur autorité. La conférence a également conclu que tout futur gouvernement indépendant serait dirigé par Sukarno."
 Indonesian_National_Revolution.6.d:0 "Une table ronde se tiendra aux Pays-Bas plus tard ce mois-ci. Pour que les négociations aient lieu, il faut un cessez-le-feu complet à Java et à Sumatra. Après discussions, il a été convenu que Java appliquerait un cessez-le-feu à partir du 11 août et que Sumatra débuterait son cessez-le-feu le 12 août. Une fois tous les combats terminés, un processus sera mis en place pour superviser le transfert de l'autorité militaire des forces néerlandaises et indonésiennes irrégulières aux forces républicaines. Les prochaines semaines et mois détermineront le destin de l'Indonésie."
 Indonesian_National_Revolution.7.d:0 "La décision d'intégrer toutes les forces militaires sous commandement républicain a donné lieu à des affrontements dans toute l'Indonésie. Certaines milices et combattants irréguliers ont refusé de se retirer ou de suivre les directives. Ces affrontements sont jusqu'à présent localisés, mais on s'inquiète de ce qui pourrait se produire lorsque des groupes pro-néerlandais plus importants seraient invités à se retirer. Certains craignent que si ces violences ne sont pas maîtrisées, elles pourraient faire dérailler le prochain cessez-le-feu. Si le cessez-le-feu n'entre pas en vigueur, les Pays-Bas pourraient tenter de saborder la table ronde."
 Indonesian_National_Revolution.8.d:0 "Au cours des deux dernières années d'activité, les Néerlandais ont rétabli une présence dans différentes régions de Java. En fait, leur propagande prétend que nos forces sont complètement vaincues. À quelques jours d'un cessez-le-feu à Java, nos commandants veulent lancer un dernier assaut sur Surakarta. Si nous capturons la ville, cela renforcera considérablement notre position de négociation et, à tout le moins, nous montrerons à l'ennemi que notre détermination demeure. Il s'agit d'une opération très risquée qui devra prendre fin avant la date du cessez-le-feu. Une décision doit être prise."
 Indonesian_National_Revolution.9.d:0 "Les forces républicaines indonésiennes ont infiltré les zones autour de Surakarta et sont prêtes à lancer un assaut. Les forces néerlandaises et leurs alliés locaux n'ont pas pu arrêter l'avancée des rebelles et se fortifient dans le centre-ville. L'opération a eu lieu quelques jours seulement avant l'entrée en vigueur attendue d'un cessez-le-feu à Java. Le gouvernement républicain a rejeté les accusations selon lesquelles son offensive perturberait les efforts de paix, affirmant que ses forces respecteraient le cessez-le-feu dès qu'il entrerait en vigueur. Le nombre de forces républicaines impliquées se compterait par centaines."
 Indonesian_National_Revolution.10.d:0 "Nos commandants à Surakarta ont envoyé une demande urgente de renforts. Les forces rebelles qui attaquent la ville s'infiltreraient dans la ville, mettant la pression sur nos défenses. Sans renforts, on craint que la ville ne tombe juste avant le cessez-le-feu. Nous pouvons envoyer plusieurs centaines de commandos RST pour renforcer les défenses et stopper l'avancée des rebelles. Cependant, si nous dépêchons nos forces et perdons quand même la ville, cela pourrait impliquer que nos forces ne pourront pas contenir la menace rebelle. En effet, certains chefs militaires estiment que le commandement de Surakarta est trop prudent et que le déploiement de forces supplémentaires ne fera que renforcer la propagande rebelle."
 Indonesian_National_Revolution.11.d:0 "Le déploiement opportun des commandos du RST a entraîné une route des forces républicaines sur le point de capturer Surakarta. Les Néerlandais seraient ravis qu'une fois de plus leurs forces aient triomphé dans un engagement conventionnel contre les combattants rebelles. Cependant, les violents combats ont révélé les fausses affirmations récentes des autorités coloniales selon lesquelles la résistance rebelle avait pratiquement cessé d'exister. Malgré les éloges du public envers ses forces, en privé, de nombreux responsables coloniaux s'inquiètent du fait que les forces régulières n'ont pu repousser l'attaque rebelle qu'avec l'aide des forces d'élite. Le gouvernement républicain a salué le courage de ses combattants, affirmant qu'il représente le dévouement sans fin du peuple à une Indonésie libre."
 Indonesian_National_Revolution.12.d:0 "Quelques heures seulement avant qu'un cessez-le-feu ait lieu à Java, avant les pourparlers de paix prévus, les forces républicaines ont capturé la ville symbolique et stratégiquement vitale de Surakarta. Les forces néerlandaises n'ont pas réussi à tenir la ville et se sont finalement retirées, même si les républicains affirment avoir capturé de nombreux prisonniers. Un assaut républicain a commencé il y a quelques jours à peine, ce qui a conduit ses forces à assiéger rapidement Surakarta. Dans les jours suivants, la résistance coloniale s'effondre. Certains observateurs estiment que les tactiques de délit de fuite adoptées par les forces républicaines à Java ont sapé le moral des Néerlandais, conduisant à l'effondrement rapide de la résistance. Des rumeurs font état de disputes entre les responsables militaires néerlandais car aucun effort n'a été fait pour amener des renforts dans la ville. Les analystes estiment que la victoire des Républicains leur donne une position dominante dans les pourparlers de paix aux Pays-Bas."
 Indonesian_National_Revolution.13.d:0 "Une grande manifestation de citoyens néerlandais, dont de nombreux étudiants, a défilé à Amsterdam pour protester contre la guerre coloniale en cours en Extrême-Orient. Le gouvernement est accusé de sacrifier l'économie, l'honneur national et la réputation internationale des Pays-Bas au seul profit d'intérêts coloniaux égoïstes. Les manifestants affirment également qu'ils en ont assez des mensonges constants alimentés par le gouvernement. La récente montée de la violence en Indonésie est particulièrement préoccupante non seulement pour les manifestants mais aussi pour les parlementaires. Il semble désormais que le vent tourne assez rapidement en faveur d'un retrait pacifique mais rapide de la région."
 Indonesian_National_Revolution.14.d:0 "La population de Java peut enfin pousser un soupir de soulagement alors qu'un cessez-le-feu entre en vigueur sur l'île. Les forces coloniales et républicaines veilleraient à ce que les conditions du cessez-le-feu soient respectées, les deux parties ne souhaitant pas que les prochains pourparlers de paix subissent un quelconque revers. Malgré cela, des informations font état de certaines forces irrégulières et milices locales qui résistent aux efforts déployés par l'armée républicaine pour les intégrer ou les désarmer. Le gouvernement républicain cherche à établir une armée nationale organisée avant que les Néerlandais n'acceptent leur indépendance. Les forces néerlandaises seront heureuses de voir la fin des attaques meurtrières menées par les forces républicaines engagées dans la guérilla."
 Indonesian_National_Revolution.15.d:0 "Les habitants de Sumatra peuvent enfin pousser un soupir de soulagement alors qu'un cessez-le-feu entre en vigueur sur l'île. Les forces coloniales et républicaines veilleraient à ce que les conditions du cessez-le-feu soient respectées, les deux parties ne souhaitant pas que les prochains pourparlers de paix subissent un quelconque revers. Malgré cela, des informations font état de certaines forces irrégulières et milices locales qui résistent aux efforts déployés par l'armée républicaine pour les intégrer ou les désarmer. Le gouvernement républicain cherche à établir une armée nationale organisée avant que les Néerlandais n'acceptent leur indépendance."
 Indonesian_National_Revolution.16.d:0 "Nous avons rappelé un certain nombre de nos combattants et les avons réorganisés en unités de combat conventionnelles. Ces éléments seront essentiels à notre nouvelle offensive générale, ciblant les îles de Java et de Sumatra. L'escalade prévue et le climat actuel signifient que nous devons porter un coup rapide et décisif pour assurer notre domination dans les futurs pourparlers de paix. Les objectifs de l'offensive de Sumatra sont les villes de Jakarta et Surabaya. A Java, les villes de Palembang et Medan doivent être prises. En capturant ces villes et en gardant le contrôle du territoire que nous contrôlons actuellement, les Néerlandais auront peu de pouvoir de négociation. Nous avons deux semaines pour nous préparer."
 Indonesian_National_Revolution.17.d:0 "Nos forces ont commencé à mener des actions offensives contre les colonisateurs. Ils sont remplis d'une ferveur patriotique. Nous prévoyons de porter un tel coup que l'ennemi n'aura d'autre choix que de conclure la paix à des conditions justes. Depuis trop longtemps, l'ennemi cherche à dicter le champ de bataille, mais rien de plus. Malgré nos préparatifs et notre dévouement, l'ennemi devrait résister farouchement. Puisse cette campagne être le point culminant de toutes nos luttes pour la liberté. Les peuples de Java et de Sumatra attendent la liberté."
 Indonesian_National_Revolution.18.d:0 "Les forces rebelles républicaines lancent des offensives sur Java et Sumatra. Il est clair qu'ils visent à nous chasser de ces îles et à obtenir une position de négociation plus forte pour d'éventuels pourparlers de paix. Les rebelles souhaitent clairement annuler les progrès que nous avons réalisés lors de nos dernières opérations militaires majeures, mais ils n'y parviendront pas. Nos forces militaires sont mieux entraînées, mieux équipées et très motivées. Nous prévoyons non seulement d'atténuer cette dangereuse attaque rebelle, mais aussi, si possible, de les repousser et de les chasser de leurs centres de commandement à Yogyakarta et Bukitinggi."
 Indonesian_National_Revolution.19.d:0 "L'offensive générale lancée par les forces républicaines anticoloniales en Indonésie s'est soldée par un grand vainqueur pour le groupe. Les forces coloniales néerlandaises et leurs alliés ont été forcés de quitter les zones clés des îles vitales de Java et de Sumatra. De nombreux analystes estiment que cette opération a considérablement affaibli la détermination des Pays-Bas à poursuivre le combat. Plus important encore, le gouvernement républicain est désormais prêt à dominer les pourparlers de paix prévus. En plus de perdre le contrôle de ces îles clés, de nombreux citoyens néerlandais se trouvent désormais sur un territoire contrôlé par les Républicains, aux côtés de plusieurs prisonniers de guerre."
 Indonesian_National_Revolution.20.d:0 "L'offensive générale lancée par les forces républicaines anticoloniales en Indonésie s'est terminée de manière peu concluante. Les forces coloniales néerlandaises et leurs alliés, malgré quelques revers, ont réalisé certains de leurs propres gains. Cela a réussi à maintenir les Néerlandais dans la région. Le gouvernement républicain félicite ses forces pour leurs opérations, même s'il est clair que leurs principaux objectifs n'ont pas été atteints. En effet, de nombreux membres du gouvernement pousseront probablement un soupir de soulagement à l'idée que les Néerlandais n'aient pas pu lancer une contre-attaque réussie. Même si les combats ont été intenses, les deux camps vont désormais attendre un nouveau cessez-le-feu avant d'engager des négociations finales. Le pari républicain de prendre le contrôle des négociations a échoué pour eux."
 Indonesian_National_Revolution.21.d:0 "L'offensive générale lancée par les forces républicaines anticoloniales en Indonésie s'est soldée par un échec total. Les forces néerlandaises et leurs alliés ont non seulement émoussé l'attaque, mais ont également lancé leurs propres contre-attaques, chassant la République de ses principaux centres de commandement et politiques. La victoire militaire néerlandaise apparaît tout à fait décisive sur le champ de bataille. Avec leur victoire, les Pays-Bas entameront probablement les négociations en position de force. Les forces républicaines survivantes se livreraient à des tactiques de délit de fuite. Les négociations devraient débuter dans les prochains mois."
 Indonesian_National_Revolution.22.d:0 "Alors que des pourparlers de paix sont attendus dans quelques mois, nous nous préparons à lancer une dernière offensive. Cela pourrait grandement renforcer notre position de négociation et affaiblir le gouvernement républicain. Nous avons raison, car les rebelles continuent de harceler nos forces, mais nous ne pouvons espérer aucune sympathie internationale. En tant que telle, cette opération doit être rapide et nous devons capturer Yogyakarta et Bukitinggi. Nous nous attendons à faire face à une forte résistance. Malgré ces défis, nos forces sont expérimentées, compétentes et prêtes à exécuter le plan de bataille."
 Indonesian_National_Revolution.23.d:0 "Les Pays-Bas ont confirmé que leurs forces avaient lancé une nouvelle « action policière » pour rétablir la paix à Java et à Sumatra. Il a noté que malgré ses concessions au gouvernement républicain et à la communauté internationale, ses forces continuaient de faire face à de violentes attaques. Les forces coloniales visent à affaiblir considérablement la puissance militaire républicaine avant les pourparlers de paix attendus dans les mois à venir. La communauté internationale condamnera probablement fermement cette action. Les analystes estiment que les Néerlandais estiment qu'un succès militaire rapide conduira à des négociations favorables qui contrebalanceront toute action internationale potentielle. Les combats sont centrés à Java et à Sumatra."
 Indonesian_National_Revolution.24.d:0 "Les diplomates des Nations Unies n'ont pas tardé à condamner la récente offensive néerlandaise sur Java et Sumatra. Beaucoup affirment que les Pays-Bas reviennent sur les assurances qu'ils ont données l'année dernière. Il ne semble pas y avoir beaucoup de sympathie pour les affirmations des Pays-Bas selon lesquelles ils répondaient aux opérations de guérilla républicaine. Un projet de sanctions contre les Pays-Bas est déjà en cours de finalisation et devrait être soumis prochainement au vote. Les analystes estiment que les Néerlandais étaient préparés à ce revers diplomatique et tenteront leur chance en votant. Ses dirigeants parient que les bénéfices d'un succès militaire l'emporteront sur la perte de réputation internationale."
 Indonesian_National_Revolution.25.d:0 "Un commandant néerlandais très confiant a donné une conférence de presse au cours de laquelle il a dévoilé tous les prisonniers et les armes capturées lors de leur récente offensive. Les forces néerlandaises et leurs alliés coloniaux ont réussi à s'emparer des principaux centres politiques et de commandement du gouvernement républicain, reprenant ainsi le contrôle de Java et de Sumatra. Outre les prisonniers militaires, un certain nombre de dirigeants politiques ont également été arrêtés. Les observateurs estiment que la victoire des Pays-Bas leur donnera une position beaucoup plus forte lors des négociations dans les mois à venir."
 Indonesian_National_Revolution.26.d:0 "Après des années de combats, les représentants des Pays-Bas, des nationalistes indonésiens et de l'Assemblée consultative fédérale, représentant les États néerlandais en Indonésie, se réunissent à La Haye. La Commission des Nations Unies pour l'Indonésie facilite les pourparlers. Les discussions visent à garantir que toutes les questions en suspens entre les Pays-Bas et l'Indonésie soient résolues avant la cession de souveraineté à une Indonésie indépendante. Bien que les nationalistes espéraient un gouvernement central fort en faveur de l'unité nationale, ils ont convenu avant la conférence de faire un compromis avec l'Assemblée consultative fédérale pour une position unifiée sur une future constitution."
 Indonesian_National_Revolution.27.d:0 "Après discussions, la table ronde s'est accordée sur le calendrier du retrait militaire néerlandais d'Indonésie. Les forces coloniales organisées par les Néerlandais se retireront et seront soit démobilisées, soit intégrées dans une nouvelle armée indonésienne, l'armée républicaine constituant le noyau. Les Pays-Bas seront convaincus que leurs forces se retireront avec tous les honneurs militaires, même si nombreux sont ceux qui estiment que les forces coloniales sont abandonnées. Le gouvernement indonésien sera confronté à la tâche difficile d'intégrer ses forces. Les communautés minoritaires d'Indonésie, qui fournissaient l'essentiel de la main-d'oeuvre militaire coloniale, craignent déjà de perdre leur emploi et leur statut avec le retrait des Pays-Bas. Les Néerlandais doivent se retirer le plus rapidement possible."
 Indonesian_National_Revolution.28.d:0 "L'un des principaux points de friction est la place des civils et des entreprises néerlandaises dans une Indonésie indépendante. Ces communautés et entreprises ont longtemps bénéficié de privilèges particuliers sous le régime colonial. Pour de nombreux Indonésiens, ils restent un exemple de leur statut de seconde classe. Pour de nombreux citoyens néerlandais vivant en Indonésie, c'est le seul chez-soi qu'ils connaissent, et nombre d'entre eux ne souhaitent pas le quitter. Les représentants indonésiens ont convenu qu'il n'y aurait aucune discrimination à l'encontre des citoyens ou des entreprises néerlandaises et que tous les accords commerciaux existants seraient respectés. L'enjeu majeur est la question de la dette accumulée par l'Etat colonial, elle sera abordée ultérieurement lors de la conférence."
 Indonesian_National_Revolution.29.d:0 "La question de la dette est restée un point de friction majeur tout au long des négociations. L'administration coloniale a accumulé des dettes intérieures et extérieures sur une longue période. Les deux parties ont présenté leurs propres calculs sur le montant exact de la dette et étaient en désaccord sur le pourcentage dont l'Indonésie serait responsable. En particulier, les Pays-Bas insistent sur le fait que l'Indonésie devrait être responsable des dettes contractées après le début de l'occupation japonaise en 1942. Les Indonésiens étaient furieux à l'idée de payer pour les opérations militaires néerlandaises contre leur propre peuple. Les États-Unis et l'ONU ont réussi à convaincre les Indonésiens d'accepter la responsabilité de la dette comme prix à payer pour l'indépendance."
 Indonesian_National_Revolution.30.d:0 "Au-delà de la question de la dette, le statut de la Nouvelle-Guinée occidentale a suscité de nombreux échanges houleux. Les Indonésiens insistent sur le fait que le territoire devrait être cédé, mais les Pays-Bas soutiennent qu'il est ethniquement séparé du reste de l'Indonésie. Le gouvernement néerlandais a discrètement déclaré aux représentants que si le territoire était concédé, il ne serait peut-être pas en mesure de faire ratifier un accord par son parlement. Les Indonésiens n'étaient cependant pas disposés à retirer leurs prétentions. Beaucoup craignent que les négociations ne aboutissent à une impasse sur cette question sensible."
 Indonesian_National_Revolution.31.d:0 "Les délégués indonésiens ont convenu de ratifier la Constitution fédérale comme document régissant un État-Unis d'Indonésie indépendant. Les principes de ce document ont été acceptés avant les négociations par toutes les parties indonésiennes. Les États-Unis d'Indonésie seront un gouvernement fédéral doté d'un parlement bicaméral. La République et les États néerlandais seront les entités constitutives de l'État, chacun recevant un certain nombre de sièges. Plusieurs États autonomes sont également à reconnaître. Cette constitution est largement conforme aux exigences des États néerlandais qui craignent qu'un gouvernement central trop puissant ne s'avère un problème à terme. Le nationaliste indonésien, favorable à un centre fort, a fait de lourds compromis pour garantir une Indonésie unie. Cependant, les nationalistes indonésiens occuperont la présidence et le Premier ministre."
 Indonesian_National_Revolution.32.d:0 "La dernière impasse pour un accord final entre les représentants des Pays-Bas et de l'Indonésie à la table ronde a finalement été résolue. Les Indonésiens ont accepté de permettre aux Néerlandais de contrôler la Nouvelle-Guinée occidentale à condition que les deux parties négocient un règlement final dans un délai d'un an après l'indépendance. Le compromis a été trouvé tôt le matin après des heures de discussions intenses. Les nationalistes indonésiens ne seront pas contents mais ils ont au moins reçu une promesse de négociations."
 Indonesian_National_Revolution.33.d:0 "Des mois de négociations entre les représentants néerlandais et indonésiens se sont terminés au Ridderzaal. Les négociations ont été incroyablement difficiles et les deux parties ont été obligées de faire des compromis. Les représentants des deux côtés se seraient montrés fatigués mais satisfaits des résultats. Les Pays-Bas seront satisfaits d'avoir laissé à l'Indonésie des accords fermes protégeant leurs intérêts. Les Indonésiens accueilleront favorablement la fin de la guerre et la reconnaissance de leur pleine souveraineté. Les gouvernements du monde entier envoient leurs félicitations pour la naissance d'une nouvelle nation. Les Néerlandais vont désormais s'efforcer de transférer rapidement leur souveraineté."
 Indonesian_National_Revolution.34.d:0 "Dans le cadre du transfert de souveraineté, les autorités coloniales ont libéré tous les prisonniers républicains, tant militaires que politiques. Les prisonniers rentrent chez eux en héros nationaux de la République. Toutes les prisons sont transférées sous contrôle indonésien. La libération des prisonniers aidera grandement le nouvel État à s'établir, car de nombreux dirigeants politiques influents figuraient parmi les personnes détenues. Le processus de transfert de souveraineté semble se dérouler aussi bien que prévu."
 Indonesian_National_Revolution.35.d:0 "Les Pays-Bas ont officiellement transféré leur souveraineté aux États-Unis d'Indonésie. Pour la première fois, tout le peuple indonésien sera indépendant, uni sous un seul gouvernement. Pour de nombreux Indonésiens, les années de lutte pour la liberté sont enfin terminées. Les Nations Unies ont publié une déclaration sur leur impatience d'accueillir une nouvelle nation. Les principales ambassades font déjà part de leur intention de reconnaître le nouveau gouvernement. Le célèbre héros nationaliste Sukarno est le nouveau président du pays tandis que son allié politique Mohammad Hatta sera le Premier ministre."
 Indonesian_National_Revolution.36.d:0 "Ces dernières semaines, l'ancien commando néerlandais Raymond Westerling a annoncé la création d'un mouvement baptisé Légion de Ratu Adil (APRA). L'APRA, composée d'un groupe diversifié, comprenant d'anciens soldats coloniaux, des combattants républicains mécontents et des Sundanais opposés à la domination politique javanaise. Le groupe s'oppose fermement à une Indonésie indépendante et a envoyé un ultimatum appelant à ce que l'APRA soit nommée l'armée officielle de l'État et garantisse l'autonomie des États fédéraux. Le gouvernement n'a pas réagi et ces derniers jours, les forces de l'APRA ont tenté de lancer un coup d'État et de s'emparer de Bandung et de Jakarta. L'assaut sur Bandung a d'abord été couronné de succès, mais ses forces n'ont pas réussi à capturer Jakarta ou le gouvernement. Les forces républicaines et la police ont pu rapidement rétablir l'ordre, même si Westerling s'est enfui à Singapour. Bien que les Pays-Bas aient condamné cet acte, des rumeurs courent selon lesquelles ils auraient facilité l'évasion de Westerling."
 Indonesian_National_Revolution.37.d:0 "Signe des choses à venir, le parlement de Pasudan, l'un des éléments constitutifs des États-Unis d'Indonésie, a voté sa dissolution et son adhésion à la République. Le Parlement a agi après avoir fait face à d'intenses pressions internes de la part de son peuple. Le vote a eu lieu après des révélations sur l'implication de hauts responsables du gouvernement Pasudan dans la récente tentative de coup d'État de l'APRA. Ces révélations ont confirmé les craintes selon lesquelles les éléments pro-néerlandais en Indonésie chercheraient à utiliser la constitution, dont le centre est faible, pour diviser et maintenir la nation faible. La décision affaiblit considérablement la structure fédérale actuelle et a légèrement fait pencher la balance politique au sein du parlement national."
 Indonesian_National_Revolution.38.d:0 "Le sultan Abdul Hamid II, dirigeant de Pontianak et membre du cabinet fédéral, a été arrêté. Le gouvernement a révélé que l'interrogatoire des membres de l'APRA capturés à la suite de l'échec de leur coup d'État a révélé l'implication d'Abdul Hamid. Interrogé, le sultan a reconnu son implication, révélant même qu'il y avait eu une deuxième tentative de coup d'État avortée en février. Le sultan Abdul Hamid II s'oppose fermement à la création d'un gouvernement central unitaire, craignant que cela ne conduise à la marginalisation des Indonésiens non javanais et a servi comme officier supérieur dans l'armée coloniale. Cette arrestation a déclenché de vastes manifestations dans la province du Kalimantan occidental, les citoyens souhaitant que l'État rejoigne la République. L'échec du coup d'État et les révélations qui ont suivi confirment dans l'esprit de nombreux Indonésiens que la structure politique actuelle est une conception coloniale destinée à maintenir l'Indonésie faible."
 Indonesian_National_Revolution.39.d:0 "Face à la détérioration de la situation politique, les dirigeants de la province des Moluques ont proclamé leur indépendance sous le nom de République des Moluques du Sud. Des partisans armés du mouvement ont pris le contrôle d'Ambon. Les autorités indonésiennes signalent des attaques avec délit de fuite sur Seram. Les protestants des Moluques du Sud ont longtemps constitué l'épine dorsale de l'armée coloniale. Après l'indépendance, la plupart ont décidé de ne pas rejoindre l'armée indonésienne, craignant qu'elle ne soit une institution javanaise dominée par les musulmans. Les combattants armés qui ont pris Ambon seraient des soldats coloniaux en cours de démobilisation. Le gouvernement indonésien a promis de rétablir rapidement l'ordre tout en accusant les Pays-Bas de permettre aux anciens soldats d'accéder aux armes. La rébellion a éclaté après l'annonce que le nouveau cabinet de l'Indonésie orientale envisageait de se dissoudre et de rejoindre la République."
 Indonesian_National_Revolution.40.d:0 "Au cours des deux derniers mois, au milieu des révélations sur la tentative de coup d'État de janvier et du mécontentement général face à la situation politique, pratiquement toutes les zones autonomes et tous les États ont voté en faveur de l'adhésion à la République. Il ne reste que l'est de l'Indonésie et l'est de Sumatra. Les dirigeants des deux États s'opposent fermement à un gouvernement central unitaire, craignant que cela ne conduise à l'exclusion politique des non-Javanais et des musulmans. Cependant, le message nationaliste d'une Indonésie unitaire visant à construire une nation forte trouve un fort écho auprès de larges pans de la population. Des manifestations ont été organisées dans les deux États par des citoyens souhaitant adhérer à la République. Les dirigeants républicains affirment vouloir uniquement soutenir la volonté du peuple."
 Indonesian_National_Revolution.51.d:0 "Les États-Unis d'Indonésie n'existent plus. Le gouvernement central, la République, l'Indonésie orientale et Sumatra oriental ont tous convenu de dissoudre la constitution et de la remplacer par une constitution provisoire qui promet un État unitaire. Jakarta a été confirmée comme capitale de ce nouvel État, la République d'Indonésie. Ces annonces coïncident avec le cinquième anniversaire de la proclamation originale d'indépendance faite par Sukarno. Cette annonce est largement célébrée dans tout le pays. L'ancien système s'est avéré impopulaire pour la plupart qui estimaient qu'il s'agissait d'un système imposé par le colonialisme et destiné à maintenir les Indonésiens divisés. Les partisans des États-Unis d'Indonésie ont été contraints de reculer face à la pression croissante de l'opinion publique."
 Indonesian_National_Revolution.41.d:0 "Après d'intenses discussions, le gouvernement indonésien a accepté de prendre en charge la dette accumulée par l'État colonial suite à l'occupation japonaise de 1942. Bien que les deux parties aient présenté leurs propres chiffres sur le montant, il semble que les Indonésiens aient largement accepté les revendications néerlandaises. Les délégués indonésiens se trouveraient dans une position difficile en raison de leur faible position sur le terrain. En outre, les représentants des Nations Unies et des États-Unis ont insisté pour qu'un accord soit trouvé, estimant que c'était probablement le prix à payer pour la liberté."
 Indonesian_National_Revolution.42.d:0 "L'un des premiers points de friction était la Nouvelle-Guinée occidentale. Le délégué indonésien a soutenu qu'il devrait hériter de toutes les Indes néerlandaises. Les Pays-Bas ont souligné que la région était ethniquement et religieusement distincte du reste de l'Indonésie. Les deux parties sont restées fermes sur leur position jusqu'à ce qu'un accord soit trouvé. Les délégués indonésiens ont accepté que la Nouvelle-Guinée occidentale reste une partie des Pays-Bas à condition que les Pays-Bas s'engagent à envisager de tenir des négociations sur le territoire à l'avenir. Les observateurs notent qu'il s'agit d'un accord souple qui laisse aux Néerlandais toute latitude pour simplement retarder les discussions indéfiniment."
 Indonesian_National_Revolution.43.d:0 "Les délégués indonésiens ont convenu de ratifier la Constitution fédérale comme document régissant un État-Unis d'Indonésie indépendant. Les principes de ce document ont été acceptés avant les négociations par toutes les parties indonésiennes. Les États-Unis d'Indonésie seront un gouvernement fédéral doté d'un parlement bicaméral. La République et les États néerlandais seront les entités constitutives de l'État, chacun recevant un certain nombre de sièges. Plusieurs États autonomes sont également à reconnaître. Cette constitution est largement conforme aux exigences des États néerlandais qui craignent qu'un gouvernement central trop puissant ne s'avère un problème à terme. Le nationaliste indonésien, favorable à un centre fort, a fait de lourds compromis pour garantir une Indonésie unie. Cependant, les nationalistes indonésiens occuperont la présidence et le Premier ministre."
 Indonesian_National_Revolution.44.d:0 "Ces dernières semaines, l'ancien commando néerlandais Raymond Westerling a annoncé la création d'un mouvement baptisé Légion de Ratu Adil (APRA). L'APRA, composée d'un groupe diversifié, comprenant d'anciens soldats coloniaux, des combattants républicains mécontents et des Sundanais opposés à la domination politique javanaise. Le groupe s'oppose fermement à une Indonésie unitaire et a envoyé un ultimatum appelant à ce que l'APRA soit nommée l'armée officielle de l'État et garantisse l'autonomie des États fédéraux. Le gouvernement n'a pas réagi et ces derniers jours, les forces de l'APRA ont tenté de lancer un coup d'État et de s'emparer de Bandung et de Jakarta. Bien que les forces républicaines aient tenté d'intervenir, l'APRA a réussi à s'emparer du cabinet. Des représentants ayant des liens avec l'APRA ont été appelés à faciliter les négociations avec les putschistes. La nation retient son souffle."
 Indonesian_National_Revolution.45.d:0 "Après des négociations tendues, une avancée décisive a été réalisée. L'APRA a accepté de libérer ses prisonniers à condition qu'elle ne subisse aucune répercussion et qu'un nouveau cabinet d'unité nationale soit choisi. Les républicains ont accepté à contrecoeur de permettre au sultan Abdul Hamid II, dirigeant de Pontianak et membre du cabinet fédéral, de prendre la relève en tant que Premier ministre, tandis que Sukarno reste président. Les combattants de l'APRA se retirent actuellement de la capitale. Son succès a inspiré la création de succursales de l'APRA dans tout l'est de l'Indonésie, composées en grande partie d'anciens soldats coloniaux mécontents de la structure militaire actuelle."
 Indonesian_National_Revolution.46.d:0 "Les délégués néerlandais et indonésiens avaient des opinions bien arrêtées sur la dette contractée par l'État colonial. Les Indonésiens croyaient fermement qu'ils n'étaient pas obligés de payer les dépenses engagées par les Néerlandais pour mener la guerre sur les îles et exploiter leurs ressources. Les Pays-Bas estiment que les Indonésiens devraient assumer une partie du fardeau, en particulier à partir de la période où les Japonais ont commencé à occuper les îles. Après d'intenses négociations, les Néerlandais ont accepté de prendre en charge la grande majorité de la dette. Bien qu'ils aient noté que l'Indonésie avait accepté d'assumer une partie de la dette, la plupart des analystes estiment que ce n'est qu'un montant dérisoire pour aider les Néerlandais à sauver la face. Des rumeurs indiquent que les Néerlandais ont été contraints de céder par crainte pour leur personnel militaire et civil sous l'occupation républicaine."
 Indonesian_National_Revolution.47.d:0 "Les Pays-Bas ont accepté de céder la Nouvelle-Guinée occidentale à l'Indonésie. Initialement, les Néerlandais avaient résisté à cette demande, affirmant que la Nouvelle-Guinée occidentale était ethniquement et culturellement distincte du reste de l'Indonésie. Cependant, les délégués indonésiens ont insisté sur le fait qu'elle hériterait de toutes les Indes néerlandaises. La principale pression est venue des citoyens néerlandais eux-mêmes, dont beaucoup sont convaincus que conserver la Nouvelle-Guinée occidentale ne vaut pas la peine de rompre les négociations. Craignant une réaction négative de l'opinion publique, les Pays-Bas ont finalement cédé aux nationalistes. Cela est considéré comme un autre succès majeur des nationalistes au cours de ces pourparlers."
 Indonesian_National_Revolution.48.d:0 "Les délégués indonésiens ont fermement convenu d'adopter la Constitution de 1945 pour la future République d'Indonésie. Le document s'inspire fortement des principes que Sukarno a présentés comme essentiels pour une Indonésie indépendante. Il est considéré comme un système présidentiel doté de caractéristiques parlementaires. Les républicains ont pu négocier l'acceptation de ses documents après avoir démontré leur position militaire et politique dominante sur l'île dans les mois précédant la table ronde. Les observateurs notent que même si le document a été accepté, de nombreux Indonésiens puissants s'inquiètent d'un État central trop puissant et de la domination de la culture javanaise sur toutes les autres îles."
 Indonesian_National_Revolution.49.d:0 "Le gouvernement républicain, dans le cadre du processus de transfert de souveraineté, a finalement libéré le dernier lot de prisonniers néerlandais. Beaucoup de ces hommes ont été capturés au cours de la dernière phase précédant le cessez-le-feu final. Ces prisonniers ont été d'importants outils de négociation lors de la table ronde. Le processus de transfert de souveraineté se poursuit sans relâche, même s'il y a quelques troubles, notamment dans les îles de l'Est, où certains se plaignent que leurs maîtres hollandais ne soient remplacés que par des maîtres javanais. Quoi qu'il en soit, Sukarno et les responsables républicains continuent d'appeler à l'unité et à la coopération nationales."
 Indonesian_National_Revolution.50.d:0 "Les Pays-Bas ont officiellement transféré leur souveraineté à la République d'Indonésie. Pour la première fois, tout le peuple indonésien sera indépendant, uni sous un seul gouvernement. Pour de nombreux Indonésiens, les années de lutte pour la liberté sont enfin terminées. Les Nations Unies ont publié une déclaration sur leur intention d'accueillir une nouvelle nation parmi leurs membres. Les principales ambassades font déjà part de leur intention de reconnaître le nouveau gouvernement. Le célèbre héros nationaliste Sukarno est le nouveau président et il a promis de travailler sans relâche pour le bien de tous les Indonésiens."
