 VIE_STARTUP_CREDIT: "Crédits de l'État du Vietnam :\n\n- §2Tendy Duda (responsable du développement du Vietnam)§!\n- §2ComradeSVN (Codeur, Artiste)§!\n- §Yafushin (codeur)§!\n- §YP.O.G (Codeur)§!\n- §YWeidadelingxiu (Chercheur)§!\n- §YADMIRAL360 (Chercheur)§!\n- §YDuy-Lap Nguyen (Chercheur)§!\n- §YNsenpai (Modèles 3D)§!\n- §YLemms (Chercheur, Écrivain)§!\n- §YNguyen-hong-Chi (Chercheur)§!\n- §YSmiley (Icône)§!\n- §2Taigazdrasvitch (icône, image d'en-tête d'introduction)§!\n\nRéférences :\nGeoffrey C. Stewart, La révolution perdue du Vietnam : l'échec de Ngô Dình Diem à construire une nation indépendante, 1955-1963\nDuy-lap-Nguyen, La communauté inimaginée : Impérialisme et culture au Sud-Vietnam (Histoire culturelle de la guerre moderne)\nAnh-nu-Tran, Construire une nation républicaine au Vietnam, 1920-1963\nEdward Miller, Mésalliance : Ngo Dinh Diem, les États-Unis et le sort du Sud-Vietnam \nSon-chi-Duong Thanh-mau, Duong-ve-Nhan-Vi (Le Manifeste Personnaliste : Version allégée)\nGouvernement du Sud-Vietnam, Thanh-tich Hoat-dong 8 Nam cua Chanh-phu (8 ans de réalisations du gouvernement)\nGouvernement du Sud-Vietnam, Noi-san Nong-tin va Hop-tac (le Journal des révolutions agricoles et coopératives)\nEdmund F. Wehrle, Confédération vietnamienne du travail et du travail international"
 BRA_STARTUP_DESC: "Une fois de plus, le Brésil se trouve à la croisée des chemins de l'histoire. Une nation riche non seulement en culture, en ressources et en histoire, mais toujours aussi divisée par un passé et un présent tumultueux. Et alors que le monde se prépare à s'enfoncer dans une nouvelle ère de division et de changement, le Brésil doit lui aussi se préparer à affronter son destin sur la scène mondiale. \n\nLes 30 dernières années de l'histoire du Brésil ont été parmi les plus polarisantes de toute notre histoire. L'Ancienne République, une époque gouvernée par les militaires et les oligarchies qui a duré 41 ans, s'est terminée en 1930 avec le triomphe de la révolution armée menée par Getúlio Vargas et la destitution du président élu. \n\n Cela n'a pas apporté de stabilité, en fait, c'était une époque difficile. Les troubles provoqués par le soulèvement communiste de 1935 ont conduit Vargas à faire un coup d'État et à fermer le gouvernement en 1937, déclenchant une dictature répressive appelée « Estado Novo ». Avec la centralisation du pouvoir, Vargas a entamé une ère de persécution et de torture, mais ses vastes investissements ont conduit à une industrialisation rapide, stimulant l'économie au début des années 1940. Malgré la déclaration de neutralité de 1939, en 1942, l'Allemagne avait attaqué plusieurs navires marchands brésiliens, conduisant à l'entrée officielle du Brésil dans la Seconde Guerre mondiale. \n\n En 1945, le Brésil souffrait d'une douloureuse contradiction : des centaines de jeunes brésiliens étaient tués et furent tués en Italie contre les fascistes au nom de la liberté et de la démocratie, alors que chez eux, le pays était toujours aussi répressif. Avec la relégalisation de la presse et l'amnistie pour les victimes persécutées de l'Estado Novo, les premières élections directes depuis 15 ans ont eu lieu en décembre 1945. Le général Eurico Gaspar Dutra du PSD social-démocrate a été élu, marquant la fin de l'ère Vargas. \n\n Cependant, les cicatrices du temps ne sont toujours pas cicatrisées. Vargas reste très populaire parmi la population, et en plus de cela, l'armée envahissante garde toujours un oeil sur notre politique, ayant une présence dominante depuis le coup d'État militaire qui a mis fin à la monarchie en 1889, toujours à deux doigts de remettre la main dans le pays. \n\nSeul le temps nous dira si le Brésil est réellement le pays du futur ou s'il ne peut pas dépasser son propre passé."
