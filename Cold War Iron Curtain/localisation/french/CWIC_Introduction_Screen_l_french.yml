 SOV_STARTUP_DESC: "En 1847, §RKarl Marx§!et §RFriedrich Engels§!, publièrent le Manifeste du Parti Communiste, un simple pamphlet, mais qui allait profondément bouleverser l'ordre mondial actuel. S'appuyant sur l'analyse socio-économique précédente du capital réalisée par Marx lui-même, le Manifeste posait les bases d'une nouvelle société. Une révolution qui vaincre le capitalisme grâce à une révolution menée par la classe ouvrière industrielle et qui abolirait la société de classes telle que nous la connaissions. Marx imaginait que cette révolution devait se produire dans les États et les sociétés où le capitalisme était le plus développé. Ce qu'il n'aurait pas pu imaginer, cependant, c'est que la première dictature du prolétariat réussie serait établie dans un État semi-féodal et reculé. Cet État était la Russie.\n\nLa seconde moitié du XIXe siècle et le début du XXe ont causé au gendarme de la réaction européenne de nombreux problèmes politiques internes, illustrés par les réformateurs bourgeois progressistes faisant pression sur l'empereur Alexandre II pour qu'il abolisse le servage en 1861, ce qui a conduit à des réformes qui ont finalement ouvert la porte au développement capitaliste en Russie. Et pourtant, ce développement, contrairement à l'Occident, était encore tissé par un vaste réseau de relations précapitalistes, dirigé par des empereurs despotiques et une noblesse arrogante, qui luttaient encore durement pour préserver des principes existants de longue date.\n\nAvec l'avènement du développement capitaliste et la propagation des idées de Marx à travers le continent, il n'a pas fallu longtemps pour qu'une série de penseurs russes adoptent le marxisme. Radicalisés par les conditions de travail inhumaines du prolétariat russe, des cercles marxistes commencent à émerger dans les principaux centres industriels de l'Empire. L'un de ces hommes était §RVladimir Ilitch Lénine§!. Des groupes tels que le Parti travailliste social-démocrate russe ont tenté d'unifier ces mouvements dispersés sous un cadre idéologique cohérent, bien qu'ils aient été rapidement chassés dans la clandestinité par la police secrète tsariste. \n\nLa Révolution de 1905 marque la première rupture majeure de l'autorité impériale. Après la défaite dans la guerre russo-japonaise, des grèves massives et des troubles ont forcé Nicolas II à des concessions limitées, notamment la création de la Douma. Pourtant, ces réformes n'ont guère affecté la structure semi-féodale de la Russie et, en tant que telle, l'autocratie tsariste est restée.\n\n C'est alors qu'éclate la Grande Guerre. Les impérialistes avaient depuis longtemps soif de rediviser un monde déjà divisé et la Russie s'est retrouvée plongée dans une guerre inter-impérialiste qui a accéléré les contradictions qui déchiraient déjà ses fondations. En 1917, l'ordre ancien était déjà épuisé. Les masses ne croyaient plus au tsar, l'armée ne faisait plus confiance à ses officiers et les classes dirigeantes se révélaient incapables de gouverner comme avant. §YLe changement était désormais inévitable§!.\n\nLa Révolution de février 1917 a balayé la dynastie des Romanov et mis fin à des siècles de régime autocratique, ouvrant finalement la voie au développement capitaliste à grande échelle en Russie. Et pourtant, les masses étaient furieuses, car ce nouveau gouvernement provisoire, une coalition de politiciens libéraux et de soi-disant socialistes modérés tels que les sociaux-révolutionnaires, était plus que désireux de continuer à envoyer ses fils mourir pour les intérêts du capital, puis Lénine est retourné en Russie, et après seulement quelques mois, les flammes de la révolution se sont à nouveau allumées. Dans la nuit du 25 octobre, le gouvernement provisoire a été renversé avec un minimum d'effusion de sang et la première dictature du prolétariat réussie au monde a été établie. La Grande Révolution socialiste d'Octobre avait triomphé. \n\nLa victoire d'octobre a immédiatement suscité les réactions les plus féroces. Propriétaires fonciers, capitalistes, monarchistes et puissances étrangères se sont unis pour tenter d'écraser la jeune République soviétique avant qu'elle ne puisse se consolider. Pendant la guerre civile russe, quatorze États étrangers sont intervenus aux côtés des armées blanches, dirigées par de nombreux jeunes officiers de l'ancienne armée impériale, comme Kolhcak, Denikin et Wrangel, cherchant à restaurer l'ordre ancien, entraînant avec eux d'immenses souffrances. Les forces réactionnaires ont pris part aux massacres les plus ignobles de communistes présumés et de minorités, allant parfois jusqu'à l'anéantissement de colonies entières, provoquant des ravages et des exécutions massives connues sous le nom de Terreur blanche. Le gouvernement soviétique, conscient de la nécessité de contre-mesures et comprenant la nécessité de commencer à liquider les éléments capitalistes restants, déclencherait sa propre terreur - la Terreur rouge, qui, cependant, ne serait même pas comparable à son homologue blanche en termes de souffrances humaines. Malgré la famine, la dévastation et des difficultés insurmontables, les ouvriers et les paysans de Russie se sont ralliés à l'Armée rouge sous la direction des bolcheviks. En 1922, la contre-révolution avait été vaincue et l'Union des Républiques socialistes soviétiques était officiellement créée. \n\nL'État soviétique a hérité d'un pays ruiné par la guerre, la pauvreté et l'analphabétisme. Et pourtant, contre toute attente, elle a réussi à surmonter son retard. La terre fut redistribuée, l'industrie nationalisée et l'exploitation de l'homme par l'homme abolie. L'éducation universelle, les soins de santé et la protection sociale se sont développés à une échelle sans précédent, du jamais vu dans aucun pays. La célébration de toutes ces réalisations a cependant été interrompue par la mort prématurée de §RVladimir Ilitch Lénine§! lui-même, ce qui a conduit à une lutte de pouvoir au sein même du parti d'avant-garde. \n\nC'est §RJoseph Vissarionovitch Staline§!, l'un des proches confidents de Lénine, qui prit effectivement la direction de l'État soviétique en tant que secrétaire général du VKP(B), poste auquel il fut assigné par Lénine lui-même. Avec la montée du fascisme et la réaction dans des pays comme l'Allemagne et l'Italie, la jeune République soviétique s'est retrouvée encerclée par les forces du capital, et il a donc été décidé que des plans quinquennaux ambitieux seraient utilisés pour industrialiser le pays le plus rapidement possible afin de se préparer à une inévitable confrontation finale avec l'impérialisme. \n\nAlors que le parti travaillait dans une relative unité au cours des premières années, à l'exception de l'opposition trotskiste qui fut expulsée en 1927, en 1936 la situation était très différente. Alors que la famine de 1932 avait montré la possibilité d'un sabotage du Koulak, il devint bientôt évident qu'il y avait des saboteurs au sein du parti lui-même, ce qui devint évident avec l'assassinat de Sergueï Kirov. Cette Cinquième Colonne a infiltré tous les organes de l'État et même l'Épée et le Bouclier de la Révolution, le NKVD. Staline et le Comité central ont désespérément tenté de reconstituer la conspiration en cours, qui s'est cachée par tous les moyens possibles, allant même jusqu'à purger et à piéger des membres innocents du parti pour brouiller leurs traces. Cette Grande Terreur a finalement pris fin en 1938 avec le démasquage du bloc terroriste des Droits et des Trotskistes, dirigé par Nikolai Boukharine, et l'arrestation et l'exécution de Nikolai Yezhov, chef du NKVD qui travaillait secrètement pour les renseignements allemands et responsable d'innombrables morts innocentes. \n\nLe complot interne du Cinquième Chronique ayant été déjoué, l'URSS s'est retrouvée une fois de plus dans le feu croisé de l'agression alors que la Seconde Guerre mondiale éclatait. Initialement signant un pacte de non-agression avec les Allemands pour gagner du temps en vue de l'inévitable confrontation avec le nazisme lorsque ces derniers en auraient fini avec leurs affaires en Occident, l'enfer s'est déchaîné lorsque le 22 juin 1941, l'Allemagne nazie et l'ensemble du bloc de l'Axe ont lancé l'opération Barbarossa, la plus grande invasion de l'histoire de l'humanité. \n\n L'invasion fasciste a été brutale et a commencé un an plus tôt que prévu, et pourtant le peuple soviétique a refusé de se rendre. Ouvriers, paysans, soldats et partisans se sont unis dans la Grande Guerre Patriotique, défendant chaque ville, usine et village contre l'envahisseur. Des rues de Moscou aux ruines de Stalingrad, des champs de Koursk à l'assaut final sur Berlin, l'Armée rouge a infligé des défaites décisives à la machine de guerre fasciste. Grâce à d'immenses sacrifices et à une détermination inébranlable, la Brigade de choc du prolétariat mondial a écrasé la bête fasciste et a propagé la révolution vers l'ouest. \n\n Et pourtant, la paix qui a suivi la Grande Guerre patriotique a été interrompue. Les alliés occidentaux, autrefois alliés de l'État ouvrier dans sa lutte contre le fascisme, voient désormais leurs intérêts menacés par l'expansion des dictatures du prolétariat en Europe de l'Est. Aucune des deux parties ne souhaitant s'engager dans une guerre à grande échelle en raison de la menace d'anéantissement nucléaire mutuel, les forces impérialistes, le pays d'Octobre et ses alliés sont désormais engagés dans une nouvelle guerre froide. L'avenir est incertain et la tension entre les deux blocs atteint son paroxysme, mais une chose reste sûre. §YLes travailleurs du monde ne se rendront pas sans combattre§!."
