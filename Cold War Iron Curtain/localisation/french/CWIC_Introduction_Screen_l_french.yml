 JAP_STARTUP_CREDIT: "Crédits de l'État du Japon :\n-§YBreezjira (co-responsable du développement japonais)§!\n-§2Taigazdrasvitch (co-responsable du développement japonais)§!\n-§2Yuri1917 (Icône)§!\n-§YNsenpai (Modèles 3D)§!\n\nMembre du projet de traduction :\n§OTsareich, inarizushi0309, saka8623, Raun139, soldatkei, miasf (yuki), Syacho-7055, Eddi0506, fred409, nnmnnm, Pot-Rance, Kirindar, kebacbb, Beetle-8th, non-life-king, rin0427, botannabe78, piyokichi123, mizu721, Taigazdrastvich, capybara1945, Louis041000, 173Io§!\n\n\nArigato les gars ! Celui qui joue au contenu japonais ! J'apprécierais vraiment que vous me fassiez part de vos commentaires sur Discord Channel ! Ping §YTaigazdrastvich§! Merci :)"
 KOR_STARTUP_DESC: "Après que la joie éphémère de la libération ait été anéantie par les forces étrangères et les affaires internationales en constante évolution, le pays du calme matinal a traversé à bout de souffle une période de troubles sous la surveillance étroite des officiers américains.\n\nEn raison d'une domination étrangère instable et des animosités entre les dirigeants politiques, la partie sud de la péninsule coréenne a été le théâtre d'une série de mouvements et de conflits politiques, dont certains ont été très violents. Cette tournure des événements s'est apparemment conclue avec la formation de la République de Corée en 1948, le premier État coréen indépendant après l'occupation japonaise, fondé sur des idéaux libres et démocratiques.\n\nLa situation n'est cependant pas devenue plus idéale, alors que les insurrections liées aux communistes et les réponses controversées de notre gouvernement pèsent sur la politique de ce nouveau pays. L'économie n'a pas non plus été des plus stables, tandis que les ombres de la domination japonaise passée persistent dans notre société malgré certains efforts.\n\nLa croissance et les provocations de notre homologue communiste dans le nord deviennent également une menace inquiétante pour la sécurité de notre nation. Quoi qu'il en soit, la foi de notre gouvernement et de notre peuple dans un avenir libre, uni et prospère n'a pas encore faibli. Les prochains jours nous prouveront si nous parviendrons ou non à réaliser les rêves auxquels nous aspirons tant."
