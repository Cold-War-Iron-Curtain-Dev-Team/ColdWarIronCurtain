 FRA_STARTUP_DESC: "La §YRépublique française§! entre en 1949 avec les cicatrices d'une décennie turbulente marquée par l'occupation, la libération, les bouleversements politiques et la difficile reconstruction d'une nation en quête à la fois de stabilité et de sens. La France se trouve à l'aube d'un nouvel ordre européen, mais ses institutions restent fragiles, sa société divisée et son empire de plus en plus tendu.\n\nLa crise de la France a commencé avec la campagne désastreuse du §Rmai au§!juin 1940, lorsque la Wehrmacht allemande a envahi les armées françaises avec une rapidité sans précédent. L'armistice signé par §Rle maréchal Philippe Pétain§! conduit à la création du régime collaborationniste §Yde Vichy§!, tandis que §YCharles de Gaulle§! appelle les Français à résister depuis l'étranger. Sous l'occupation, la France a subi une grave répression, du travail forcé, des déportations et une exploitation économique. Pourtant, les années 1940 à 1944 ont également vu la montée de la §YRésistance française§!, un ensemble de mouvements - gaullistes, communistes, socialistes et autres - qui ont mené des campagnes de sabotage, des opérations de renseignement et une guérilla contre l'occupant.\n\nLa §YLibération de la France§! en 1944, obtenue grâce à la combinaison des succès militaires alliés et des efforts de la Résistance, amène de Gaulle au pouvoir à la tête du gouvernement provisoire. La nation en ressort affaiblie mais déterminée à restaurer la démocratie. Les purges contre les collaborateurs, les efforts de reconstruction et les réformes sociales radicales - y compris la création d'une sécurité sociale et l'expansion des droits des travailleurs - ont été menés au milieu des ruines de la guerre.\n\nLa fin de la guerre laisse la France victorieuse mais fragile. La rédaction d'une nouvelle constitution s'est avérée controversée. De Gaulle, frustré par ce qu'il considérait comme un retour à une politique parlementaire instable, démissionna en janvier 1946. Après des mois de débats et deux référendums, la §YQuatrième République§! fut proclamée en octobre 1946. Son cadre institutionnel créa un pouvoir législatif puissant et un exécutif relativement faible - une structure destinée à empêcher l'autoritarisme mais qui contribua bientôt à l'instabilité gouvernementale.\n\nPolitiquement, les années d'après-guerre ont été définies par la concurrence entre le Parti communiste français (PCF) §Y§!, qui s'est imposé comme le parti le plus puissant après la Libération en raison de son rôle central dans la Résistance ; les §YSocialistes (SFIO)§!; et les §YDémocrates-Chrétiens (MRP)§!. En 1947, les tensions croissantes de la guerre froide et les grèves ouvrières alimentèrent les craintes d'une influence communiste. Le PCF a été exclu du gouvernement, marquant l'alignement de la France sur le bloc occidental. §YPaul Ramadier§! et plus tard §YRobert Schuman§! ont eu du mal à maintenir des gouvernements de coalition dans un système en proie à des cabinets éphémères.\n\nSur le plan économique, la France était confrontée à de graves pénuries, à l'inflation et à d'énormes besoins de reconstruction. L'arrivée de l'aide du §YPlan Marshall§! en 1948 revitalise l'industrie et accélère la modernisation, mais accroît également la dépendance de la France à l'égard des États-Unis. L'organisme technocratique de planification, le §YCommissariat général au plan§! sous Jean Monnet, a lancé le Plan Monnet pour reconstruire les secteurs industriels clés et améliorer la productivité, jetant ainsi les bases de la reprise économique de la France d'après-guerre.\n\nEn politique étrangère, la montée de la guerre froide a remodelé la posture stratégique de la France. La peur de l'expansion soviétique a conduit la France à devenir membre fondateur de l'alliance §YOTAN§! en avril 1949. Dans le même temps, la France a soutenu les premières étapes vers une coopération européenne, notamment la création de l' §YOECE§! et les discussions qui mèneraient bientôt au plan Schuman. Néanmoins, les blessures causées par les deux invasions allemandes ont rendu la France extrêmement prudente quant à la reconstruction allemande.\n\nAu-delà de l'Europe, la France est confrontée à des crises croissantes dans tout son empire colonial. Le défi le plus sérieux se situe en §YIndochine§!, où la première guerre d'Indochine éclate en 1946 entre les forces françaises et le Viet Minh. En 1949, le conflit s'était intensifié, épuisant les finances et la main-d'oeuvre tout en soulevant des doutes sur la capacité de la France à maintenir son empire. En Afrique du Nord, les sentiments nationalistes montaient également, notamment en Algérie et en Tunisie.\n\nEn mai 1949, la §YRépublique française§! se trouve à la croisée des chemins. La nation se reconstruit, se modernise et tente de reconquérir son statut de puissance majeure, mais l'instabilité politique de la Quatrième République, le fardeau du conflit colonial et les pressions du monde bipolaire émergent continuent de mettre à l'épreuve la résilience de la France. La question de savoir si la France en sortira plus forte ou sombrera dans une nouvelle crise dépendra de sa capacité à maintenir son unité intérieure tout en évoluant dans un système international en évolution rapide."
 FRA_STARTUP_BUTTON: "Vive la France !"
