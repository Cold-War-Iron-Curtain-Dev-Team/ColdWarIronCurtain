 JAP_STARTUP_DESC: "En §Yaoût 1945§!, l' §YEmpire du Japon§! se rend finalement aux puissances alliées. Autrefois nation qui a proclamé la §YSphère de coprospérité de la Grande Asie de l'Est§! et a étendu son influence à travers l'Asie-Pacifique, le Japon se présente désormais comme un pays vaincu, accablé par §Rdes villes réduites en cendres§!, §Rdes citoyens affamés§!et §Rdes soldats et des rapatriés. Avec nulle part où retourner§!.\n\nLes grandes villes telles que §YTokyo§!, §YOsaka§!et §YNagoya§! ont été dévastées par les raids aériens, tandis que §Rpénuries alimentaires§! et §Rinflation§! continuent d'écraser le quotidien. Le prestige de l'État a été perdu, l'armée a été démantelée et même la position de l'empereur est redéfinie sous une nouvelle forme.\n\nMais la défaite n'était pas seulement une fin. C'était aussi le début d'une nouvelle reconstruction nationale. Sous l'occupation du §YQuartier général des puissances alliées, GHQ§!, le Japon est en train de passer d'un État militariste à une nation démocratique. La dissolution §Gdu zaibatsu§!, la réforme agraire §G§!, le droit de vote des femmes §G§!, la réforme du travail §G§!et la réforme de l'éducation §G§! remodèlent le pays. En §Y1947§!, la §GConstitution du Japon§! est entrée en vigueur, présentant un nouvel idéal national basé sur le renoncement à la guerre.\n\nCependant, le monde se dirigeait déjà vers une nouvelle confrontation. Avec l'expansion de l'influence soviétique et l'évolution de la situation en Chine, les États-Unis ont commencé à considérer le Japon non seulement comme une nation vaincue, mais comme un rempart §Ycontre le communisme en Asie de l'Est§!. Entre les idéaux de démocratisation et les réalités de la guerre froide, l'ordre japonais d'après-guerre est en train de se former.\n\nDe §Y1945 à 1949§!, le Japon renaît de ses cendres, accepte de nouvelles institutions sous l'occupation et s'intègre progressivement dans la structure de la §YGuerre froide§!."
