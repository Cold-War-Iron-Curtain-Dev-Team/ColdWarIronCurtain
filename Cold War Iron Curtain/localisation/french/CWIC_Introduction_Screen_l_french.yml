 FRA_STARTUP_CREDIT: "\n§Rmob (Lead Dev France)§!\n§GTendy Duda (refonte française)§!\n-§2Taigazdrasvitch (image d'en-tête d'introduction et en partie des icônes GFX)§!\n§OMembre du projet de traduction :\nReanon8, extaaz0106-png, LittleZoma (Hugo_Bern), Marchallz, DVB-true, Tauppi§!"
 USA_STARTUP_DESC: "Les §YÉtats-Unis d'Amérique§! entrent en 1949 comme une nation transformée : victorieuse d'une guerre mondiale, mise au défi par les responsabilités d'une puissance sans précédent et animée par la mission de façonner un nouvel ordre mondial au lendemain de la destruction. Les incendies de la Seconde Guerre mondiale ont fait des États-Unis l'arsenal, le grenier et la main directrice du monde libre. Aujourd'hui, alors que la guerre froide éclate, l'Amérique se trouve à la croisée des chemins où convergent l'idéologie, la technologie et le leadership mondial.\n\nLes épreuves de la §RGrande Dépression§! avaient marqué la nation, laissant des millions de personnes au chômage, déplacées et désillusionnées. Pourtant, la réponse du peuple américain - par le travail, les sacrifices et les réformes du §YNew Deal§!- a renouvelé les fondations de la République. Alors que la nation commençait à se rétablir, les nuages d'orage d'un conflit mondial se sont rassemblés sur l'Europe et l'Asie, menaçant l'ordre mondial que les Américains pensaient depuis longtemps rester éloigné de leurs côtes.\n\nL'attaque du §R7 décembre 1941§!, lorsque l'Empire du Japon frappa Pearl Harbor, brisa toute illusion d'isolement. Le peuple américain, enragé et uni, s'est mobilisé avec une puissance inégalée dans l'histoire de l'humanité. En quelques mois, une armée de plusieurs millions de personnes s'était rassemblée, les usines de Détroit et de Pittsburgh reprenaient vie et la puissance scientifique de la nation augmentait. Les soldats américains ont combattu dans les déserts d'Afrique, les montagnes d'Italie, les plages de Normandie et les jungles du Pacifique. Les bombardiers américains ont assombri le ciel au-dessus de l'Allemagne et les flottes américaines ont avancé d'île en île à travers le Pacifique, à un coût terrible.\n\nEn 1945, les États-Unis étaient le principal architecte de la victoire sur §Rl'Allemagne nazie§! et §Rle Japon impérial§!. Pourtant, ce triomphe a été assombri par l'aube d'une nouvelle ère terrifiante : la bombe atomique §Y§!, lâchée à Hiroshima et Nagasaki, a révélé que le pouvoir de destruction de l'humanité avait dépassé sa sagesse.\n\nAu lendemain de la guerre, le président §YHarry S. Truman§! a cherché à consolider la paix dans un monde menacé par l'instabilité et la division idéologique. Les États-Unis ont été à l'origine de la création des §YNations Unies§!, même si leurs espoirs de coopération mondiale se sont rapidement heurtés aux ambitions de l' §RUnion soviétique§!. L'Europe, dévastée et affamée, est devenue le premier champ de bataille de la lutte naissante. La crainte que la faim, la pauvreté et le désespoir n'entraînent les nations dans la sphère soviétique a poussé les États-Unis à agir.\n\nEn 1947, le secrétaire d'État §YGeorge C. Marshall§! annonce le §YPlan Marshall§!, un vaste programme d'aide économique pour reconstruire l'Europe et empêcher la propagation du communisme. Des milliards de dollars ont traversé l'Atlantique, ressuscitant des usines, stabilisant les monnaies et redonnant espoir aux sociétés brisées. Pour beaucoup, c'était la plus grande expression de la générosité américaine ; pour d'autres, l'affirmation la plus audacieuse de l'influence américaine.\n\nLa même année, la §YTruman Doctrine§! déclarait que les États-Unis soutiendraient les peuples libres résistant au totalitarisme. Cet engagement a entraîné l'Amérique dans les affaires mondiales à une échelle sans précédent dans son histoire. En Grèce et en Turquie, l'aide et les conseillers américains ont remplacé l'influence britannique, marquant un tournant où la responsabilité de la sécurité occidentale a été transférée de manière décisive à Washington.\n\nSur le plan intérieur, la nation a connu à la fois le triomphe et la tourmente. La démobilisation a permis à des millions d'anciens combattants de réintégrer la vie civile, remodelant la société grâce au §YGI Bill§!, qui a ouvert les universités et l'accession à la propriété à toute une génération. Pourtant, les tensions se sont accrues à mesure que les grèves se multipliaient, que les craintes d'espionnage soviétique se répandaient et que les débats sur les droits civiques s'intensifiaient. Le §YFair Deal§! cherchait à étendre les réformes du New Deal de Roosevelt, mais l'opposition au Congrès a limité sa portée.\n\nEn politique étrangère, 1948 a marqué une épreuve dramatique : le §Rblocus de Berlin§!, lorsque l'Union soviétique a tenté de forcer les Alliés à quitter Berlin en leur coupant tout accès terrestre. Les États-Unis ont répondu avec le pont aérien §YBerlin§!, un effort soutenu qui a permis de livrer de la nourriture, du carburant et des fournitures par voie aérienne à la ville assiégée. Les pilotes américains risquaient quotidiennement leur vie alors que le ciel de Berlin devenait un symbole de détermination démocratique.\n\nEn avril 1949, les États-Unis avaient franchi une nouvelle étape monumentale en devenant membre fondateur de l'Organisation du Traité de l'Atlantique Nord (OTAN) §Y§!. Cette alliance liait l'Amérique à la défense de l'Europe occidentale - une rupture sans précédent par rapport à sa longue tradition consistant à éviter les engagements militaires en temps de paix.\n\nDepuis le §Ymai 1949§!, les États-Unis constituent le pilier central de l'ordre libéral émergent. Son économie est la plus forte du monde, ses progrès scientifiques sont inégalés et son influence mondiale est vaste. Pourtant, des défis se profilent : l'Union soviétique se dirige vers la capacité nucléaire, la Chine est plongée dans une guerre civile, les empires coloniaux tremblent au bord de l'effondrement et les craintes de subversion interne hantent la politique américaine.\n\nLes États-Unis de 1949 sont une nation pleine de confiance et d'anxiété, d'unité et de division, d'idéalisme et de peur. Qu'il reste le gardien du monde libre ou qu'il succombe aux pressions du leadership mondial dépend de sa détermination, de ses valeurs et de sa volonté d'affronter les responsabilités de sa puissance sans précédent."
 USA_STARTUP_BUTTON: "Oh, dis, tu vois... !"
