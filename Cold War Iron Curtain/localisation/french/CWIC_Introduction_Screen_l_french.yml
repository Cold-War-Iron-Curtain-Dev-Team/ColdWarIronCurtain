 DOM_STARTUP_BUTTON: "El que no Arriesga, no gana. - Celui qui ne prend pas de risques ne gagne pas."
 DOM_STARTUP_DESC: "Après des décennies de conflits tumultueux avec des puissances étrangères pour obtenir et consolider son indépendance, la République dominicaine a été mise en avant par la direction de Rafael L. Trujillo, qui depuis son entrée en fonction a consacré de grands efforts à la stabilisation du pays, au renforcement des institutions et à la centralisation du pouvoir entre ses mains. Cependant, avec les accusations de tyrannie devenant de plus en plus inévitables pour ses alliés occidentaux et l'entêtement historique des dirigeants dominicains, le temps de la fin de Trujillo pourrait toucher à sa fin. Pourtant, il existe de nombreuses opportunités pour la nation caribéenne d'aller de l'avant et de progresser vers une nouvelle ère de prospérité."
 DOM_STARTUP_PATHS: "\n Chemins de fin de la République Dominicaine :\n\n Joaquín Balaguar, Juan Bosch, Elias Wessin y Wessin, Francisco Camaano, Antonio Guzman, Francisco Augusto Lora."
 DOM_STARTUP_CREDIT: "\n La pierre refusée et les altoïdesMaximus"
 LIB_STARTUP_BUTTON: "La meilleure façon de prédire l'avenir est de le créer."
 LIB_STARTUP_DESC: "La guerre froide représente une nouvelle ère sur le continent africain. Le président William Tubman a dominé la politique libérienne d'une main ferme pendant cinq ans. Alors que le monde se divise en sphères distinctes, Tubman a tendu la main aux puissances alignées sur l'Occident pour assurer une plus grande prospérité économique à tous les citoyens libériens, et pas seulement à la classe dirigeante américano-libérienne. Pour y parvenir, les opportunités commerciales internationales potentielles peuvent être exploitées en faveur du Libéria. Cependant, dans le même temps, les vieux intérêts politiques américano-libériens surveillent de très près Tubman à la recherche de signes de faiblesse. La vision de Tubman pour le Libéria survivra-t-elle ou prospérera-t-elle ? L'avenir du Libéria dépend-il de l'ensemble de sa population, ou faut-il des coeurs plus froids pour guider le Libéria dans une guerre froide ?"
 LIB_STARTUP_PATHS: "William Tubman. Guillaume Tolbert. Ellen Mills Scarbrough.. Didwho Welleh Twe.. Guillaume O. Davies Lumineux."
 LIB_80s_STARTUP_DESC: "Il y a des nuages d'orage à l'horizon. Le président américano-libérien au pouvoir, Tolbert, est impopulaire en raison des émeutes du riz à Monrovia un an plus tôt et au sein du parti True Whig lorsqu'il a condamné les meurtres rituels et n'a pas accordé de clémence aux assassins des Harper Seven. Cet acte montre des signes de fissure de la solidarité du Parti True Whig de l'intérieur alors que Tolbert courtise une nouvelle classe politique indigène. Il n'est pas certain que les choses puissent continuer ainsi au Libéria dans un avenir prévisible. À notre époque, le bloc soviétique et les projets africains de la Libye pourraient s'avérer lucratifs si cette voie est choisie. Il serait sage que le dirigeant libérien pèse ses options internationales dans l'intérêt du Libéria. On ne sait pas à quel point le Libéria peut être stable pour résister à la tempête connue sous le nom des années 80 de la guerre froide..."
 LIB_80s_STARTUP_PATHS: "1ère guerre civile libérienne - Chemins Doe et Thomas Quiwonkpa. Jackson Doe - Renversez Samuel Doe Path."
 LIB_STARTUP_CREDIT: "\n La pierre refusée"
 Generic_STARTUP_DESC: "Nous sommes en 1949, une planète brisée commence à retomber dans les bras de la tyrannie et du conflit, alors que de nouvelles rivalités émergent.\n\nBienvenue dans une nouvelle ère de lutte, de détermination et de conflit, alors que les nations luttent pour accéder à l'indépendance et au pouvoir. Des superpuissances renaîtront des cendres du passé, avec des idéologies qui détermineront de façon permanente le sort de la race humaine. Alors que les superpuissances luttent militairement et économiquement pour la suprématie, de nombreuses nations sont libérées du joug de l'oppression coloniale et, enfin, les peuples de continents entiers ont leur mot à dire dans la détermination de leur destin.\n\nLa guerre gronde à nouveau en Asie de l'Est, et le continent africain ne supportera plus l'oppression immorale de son peuple. L'Europe de l'Est est englobée dans la sphère soviétique et l'Occident cherche à sauver son trône en ruine."
 Generic_STARTUP_BUTTON: "Maintenant je suis devenu la Mort, la destructrice des mondes..."
 Generic_STARTUP_PATHS: "Actuellement, il n'est pas possible de vérifier les chemins pour ce pays..."
