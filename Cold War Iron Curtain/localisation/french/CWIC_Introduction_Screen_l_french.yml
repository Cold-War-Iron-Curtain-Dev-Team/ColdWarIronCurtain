 DDR_CURRENT_PATHS: "Voies communistes\n\n-Walter Ulbricht (Historique)\nOtto Grotewohl (ex-SPD)\n \n \n \n \n \n \n \n \n \n \n \n\nVoies non communistes\n\nOtto Nuschke (socialisme chrétien)\n \n \n \n \n \n \n"
 DDR_STARTUP_DESC: "La zone d'occupation soviétique se trouve à un moment décisif. Sur les ruines du Troisième Reich, une nouvelle Allemagne est en train de se façonner, sous la direction des principes socialistes et de l'influence soviétique. Le pays est marqué par la guerre et la division, mais au sein de ces cicatrices se cache l'opportunité de reconstruire sur des bases de justice, d'égalité et d'antifascisme. Le Parti socialiste unifié (SED), dirigé par Walter Ulbricht et Otto Grotewohl, cherche à forger un État libéré du militarisme et du capitalisme qui ont plongé l'Europe dans la catastrophe.\n\nLes usines sont nationalisées, les terres sont redistribuées et les travailleurs sont organisés en syndicats pour garantir que le pouvoir appartient au peuple. L'administration militaire soviétique supervise cette transformation, équilibrant les exigences de réparations avec la reconstruction d'une économie construite pour le bien-être social plutôt que pour le profit. L'éducation et la culture sont réorientées pour produire une nouvelle citoyenneté socialiste fidèle à la paix et au progrès.\n\nDans les zones occidentales, les forces capitalistes se consolident sous la bannière de la nouvelle République fédérale, menaçant de diviser le destin de l'Allemagne. Pourtant, à l'Est, la vision d'une démocratie populaire commence à prendre forme. Mai 1949 marque non seulement les conséquences de l'occupation, mais aussi l'aube d'un État allemand socialiste - un État qui doit prouver sa résilience face au doute interne et à l'hostilité extérieure pour assurer l'avenir d'une Allemagne unie et antifasciste."
 ZIM_STARTUP_DESC: "Cecil John Rhodes était une figure aux multiples facettes : un magnat influent, un colon et un administrateur remarquable. Il a fondé le territoire aujourd'hui connu sous le nom de Rhodésie, par l'intermédiaire de sa société sud-africaine, dans une terre riche en diamants, en patrimoine et en force.\n\nLes années 1890 marquent une période de transformation rapide. Alors que l'Europe était aux prises avec les conséquences de l'industrialisation et de la concurrence mondiale, les terres revendiquées par la British South Africa Company ont vu l'établissement de communautés de colons, d'exploitations minières et de cadres administratifs. La Rhodésie, nommée en l'honneur de Rhodes, s'est forgée une réputation grâce à ses richesses minières, notamment en or, tandis que son potentiel agricole a attiré des vagues de colons européens à la recherche de nouvelles opportunités. Mais derrière cette façade de progrès, des tensions couvaient. L'imposition d'une domination étrangère a perturbé les systèmes de gouvernance traditionnels, conduisant à des soulèvements tels que le premier Chimurenga de 1896 à 1897, au cours duquel les peuples Shona et Ndebele se sont soulevés pour s'opposer à l'empiétement colonial. Même si ces révoltes furent finalement réprimées, elles marquèrent une affirmation significative de la résistance indigène.\n\nAu début du XXe siècle, à mesure que de nouvelles institutions se formaient, l'identité de la Rhodésie se définissait davantage sous la surveillance britannique. Une série de réformes administratives ont progressivement fait passer l'autorité du régime des entreprises à une gouvernance coloniale plus conventionnelle. Les colons ont acquis une influence politique croissante, aboutissant à la création d'organes législatifs qui ont permis aux Européens de façonner de manière significative la politique locale. Cependant, ces changements n'ont guère contribué à améliorer la privation de droits de la population africaine indigène, dont les droits politiques sont restés sévèrement restreints dans le cadre de systèmes conçus pour maintenir la domination des colons.\n\nAu milieu du XXe siècle, un vent de changement mondial soufflait sur l'Afrique. Alors que d'autres territoires commençaient à évoluer vers l'autonomie et l'indépendance, la Rhodésie empruntait une voie plus controversée."
