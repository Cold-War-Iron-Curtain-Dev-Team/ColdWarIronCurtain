 CHI_STARTUP_DESC: "Pendant plus de trois décennies, la §YRépublique de Chine§! a lutté pour achever le rajeunissement national envisagé pour la première fois par le Dr §Y. Sun Yat-sen§!, Père de la Nation. En mai 1949, la Chine se trouve à un carrefour décisif. Nos armées continuent de résister à l'avancée destructrice de l' §Rinsurrection communiste chinoise§!, même si nous défendons l'héritage du constitutionnalisme, de la modernisation et de l'unité nationale.\n\nLe rêve d'une Chine libre et prospère est né lors de l'effondrement de la dynastie corrompue Qing en §Y1911§!, lorsque la révolution Xinhai a renversé deux siècles de décadence impériale. La République nouvellement établie a promis l'égalité, la liberté et la restauration de la dignité de la Chine après le catastrophique §Ysiècle d'humiliation§!. Pourtant, les chefs de guerre régionaux et les impérialistes étrangers menaçaient de déchirer la République naissante.\n\nC'est sous la direction de §YSun Yat-sen§! et de la réorganisation du §YKuomintang (KMT)§! que la vision de l'unification nationale a pris de l'ampleur. L'expédition du Nord §Y§!, lancée en 1926 sous §YChiang Kai-shek§!, a brisé le règne des seigneurs de guerre régionaux et a rétabli Nanjing comme siège légitime du gouvernement chinois. Des codes juridiques modernes, des initiatives industrielles et des réformes éducatives ont suivi - les premiers pas vers la reconstruction d'une Chine souveraine et moderne.\n\nMais l'unité a été brisée par la trahison. L'aile radicale de la faction communiste, refusant de respecter les lois de la République, a lancé des révoltes à travers le Jiangxi, le Hunan et le Guangdong, plongeant les campagnes dans la terreur. Le §RParti communiste chinois (PCC)§! a rejeté les Trois principes du peuple de Sun Yat-sen et a cherché à remplacer la République par une dictature. Pour préserver l'ordre national, le gouvernement a été contraint d'affronter les insurgés, déclenchant une lutte prolongée contre un mouvement qui prétendait se battre pour le peuple mais dirigeait les territoires dont il s'était emparé par la coercition, la confiscation et les purges idéologiques.\n\nAlors même que le gouvernement cherchait à stabiliser le pays, un danger bien plus grand surgissait de l'étranger. L'Empire du Japon §R§!, longtemps convoité de la Mandchourie et de la Chine du Nord, lança une invasion qui plongea la nation dans la §YGuerre de Résistance contre l'agression japonaise§!. Pendant huit longues années, notre peuple a enduré des massacres, des bombardements, la famine et l'occupation étrangère. Des ruines ensanglantées de Nanjing aux villes en feu de Wuhan et Changsha, la République a porté le plus lourd fardeau de la lutte contre l'agression fasciste.\n\nMalgré des obstacles impossibles, la République de Chine n'a jamais capitulé. Sous le §YGénéralissime Chiang Kai-shek§!, l'Armée Nationale Révolutionnaire combattit à travers les montagnes, les plaines et les rivières, immobilisant la majorité de l'armée japonaise et gagnant le temps dont le monde avait besoin pour résister à la tyrannie. Des alliances internationales ont été forgées, l'industrie a été délocalisée à l'intérieur du pays et l'esprit de résistance n'a jamais faibli. Même si les communistes étendaient leur influence dans les régions reculées, c'est le gouvernement du KMT qui portait tout le poids de la puissance mécanisée du Japon.\n\nLa victoire de 1945 a restauré la souveraineté nationale, mais le prix à payer a été énorme : des villes détruites, des millions de morts et une nation épuisée. Dans ce chaos, les communistes ont plongé une nouvelle fois le pays dans la guerre civile. Les armées fidèles à la République se sont battues pour préserver le régime constitutionnel, mais le PCC, armé d'un soutien extérieur et exploitant les souffrances des masses rurales, a progressé grâce à la tromperie, à la guérilla et à la manipulation.\n\nEn 1947, alors que la République entreprenait §Yune réforme agraire§! et introduisait un §Yun gouvernement constitutionnel§!, les communistes intensifiaient leur assaut. Les trois campagnes majeures -§RLiaoshen§!, §RHuaihai§!et §RPingjin§!- ont porté des coups graves aux fronts nord de la République, alors que les forces communistes encerclaient et submergeaient les unités coupées de ravitaillements et de renforts par un terrain accidenté et des sabotages.\n\nPourtant, même dans l'adversité, la légitimité de la République perdure. Le gouvernement continue de respecter les Trois principes §Yde Sun Yat-sen§!, de défendre la souveraineté nationale et de protéger les droits et le bien-être du peuple chinois. Le monde reconnaît la République comme le gouvernement légitime de la Chine, et l'espoir d'un renouveau national ne s'est pas éteint.\n\nDepuis le §Ymai 1949§!, la situation est désastreuse mais pas désespérée. Le gouvernement a rétabli son bastion à §YNanjing§!et des unités héroïques combattent sans relâche à travers Huadong, Hubei et Sichuan. La République compte toujours des millions de citoyens fidèles, d'anciens combattants et de fonctionnaires dévoués à la survie de la Chine.\n\nLa Chine a déjà enduré une guerre civile, une invasion étrangère et une trahison idéologique. Elle est née des cendres de l'effondrement dynastique et a résisté à la puissance des empires. Tant que la République existera, la flamme de la liberté et de l'unité nationales ne s'éteindra pas.\n\n§YLa République de Chine perdurera.§!\n§YLes Trois Principes du Peuple guideront la nation vers l'avant.§!\n§Zhonghua Minguo Wansui !§!"
 CHI_STARTUP_BUTTON: "Zhonghua Minguo Wan Sui !"
 CHI_STARTUP_PATHS: "Chemins actuels pour la République de Chine :\n\n £CHI_Normal_Flag  §cChiang Kai-shek, partie continentale (1949-1960)§!\n\n £CHI_Normal_Flag  §cChiang Kai-shek Taïwan (1949-1960)§!\n\n £CHI_Normal_Flag  §SSun Li-jen Taïwan (1955-1960)§!"
 CHI_STARTUP_CREDIT: "\n-§2Taigazdrasvitch (image d'en-tête d'introduction)§!\n-§tCityWokOwner (responsable ROC, planification et codage de l'arbre de concentration)§!"
 VIN_STARTUP_DESC: "Depuis un siècle, le peuple vietnamien lutte sous l'ombre de la domination étrangère. Depuis le §Ymai 1949§!, la §YRépublique démocratique du Vietnam (RDV)§! reste ferme dans sa mission sacrée de briser les chaînes de l'oppression coloniale et de récupérer le destin qui appartient de droit à la nation vietnamienne.\n\nLa tragédie a commencé à la fin du XIXe siècle, lorsque la France a imposé son joug colonial sur notre territoire. Pendant des décennies, le peuple vietnamien a enduré le travail forcé, une fiscalité exploitante, la suppression des traditions locales et la confiscation de nos ressources. Le régime colonial, soutenu par ses collaborateurs, a cherché à faire taire notre culture et à éteindre notre esprit. Pourtant, la résistance n'est jamais morte.\n\nAu début du XXe siècle, les patriotes à travers le pays se sont levés les uns après les autres :§YPhan Boi Chau§!, §YPhan Chu Trinh§!, les nationalistes du VNQDD et d'innombrables héros anonymes. Mais c'est l'émergence du §YHo Chi Minh§! et la fondation du §YParti communiste indochinois (PCI)§! qui ont unifié les courants révolutionnaires fragmentés du Vietnam en une force de libération nationale disciplinée.\n\nLorsque le monde a plongé dans les incendies de la §YSeconde Guerre mondiale§!, les autorités coloniales françaises se sont effondrées et §Rle Japon impérial§! a exploité le chaos pour prendre le contrôle de l'Indochine. Notre peuple a enduré la famine, la conscription forcée et la terreur, culminant avec la famine §Y1945§! qui a coûté la vie à plus d'un million de personnes. Pourtant, de ces souffrances est né le §YViet Minh§!, le front uni des patriotes et des ouvriers, des paysans et des intellectuels, luttant pour un seul objectif : l'indépendance nationale.\n\nAvec la capitulation du Japon en août 1945, le peuple vietnamien a saisi son opportunité. Sous la direction d'Hô Chi Minh, la §YRévolution d'août§! a renversé l'administration coloniale du Tonkin, de l'Annam et de la Cochinchine. Le §Y2 septembre 1945§!, devant une mer de citoyens triomphants à Hanoï, Hô Chi Minh proclama la naissance de la §YRépublique démocratique du Vietnam§!, déclarant que tous les peuples sont créés égaux et que le Vietnam est libre.\n\nMais l'impérialisme ne meurt pas tranquillement. La France a cherché à revenir, refusant de reconnaître le gouvernement légitime du peuple vietnamien. Des négociations furent tentées mais trahies, culminant avec le §RMassacre de Haïphong§! et le déclenchement de la §YPremière Guerre d'Indochine§! en décembre 1946.\n\nLa DRV, désarmée et sans soutien étranger, s'est battue avec détermination et ingéniosité. Le Viet Minh a établi des bases de résistance fortifiées à travers les montagnes et les jungles, mobilisant les paysans, les travailleurs, les jeunes et les femmes dans une lutte nationale. L'esprit de la Guerre populaire §Y§!- une union de soldats et de civils - est devenu la pierre angulaire de la résistance vietnamienne.\n\nLes forces françaises se sont emparées des grandes villes, imposant leurs gouvernements fantoches en Cochinchine et tentant plus tard de fabriquer un nouvel « État du Vietnam » avec §YBao Dai§! comme figure de proue. Pourtant, le coeur rural est resté fidèle au DRV, qui a organisé la redistribution des terres, des campagnes d'alphabétisation et une éducation politique de masse pour jeter les bases d'une nouvelle société.\n\nDe 1947 à 1949, le Viet Minh a lancé avec succès des opérations de guérilla à travers le Viet Bac, les hauts plateaux du nord et le delta du fleuve Rouge. Les positions françaises sont devenues des îles isolées entourées d'une mer de résistance. Les convois français furent pris en embuscade, les avant-postes envahis et l'autorité coloniale progressivement érodée.\n\nAlors même que les Français se réorganisaient grâce aux ressources du §Yplan Marshall§! et à la politique anticommuniste américaine, la révolution vietnamienne se renforçait. Les vents internationaux tournaient : la victoire de la révolution chinoise dans le nord était imminente et la marée mondiale du colonialisme refluait.\n\nDepuis le §Ymai 1949§!, la DRV reste résolue. Notre gouvernement perdure au Viet Bac, protégé par les montagnes et la loyauté de millions de personnes. Nos soldats combattent avec une discipline inébranlable et notre peuple reste uni derrière la bannière de la libération nationale. Les Français tentent de ressusciter leur empire colonial et leurs collaborateurs cherchent à diviser le Vietnam, mais le destin de la nation n'appartient pas aux envahisseurs ou aux fantoches, mais au peuple vietnamien lui-même.\n\nNous combattons non seulement avec des fusils et des grenades, mais avec la conviction que la justice, l'histoire et la volonté des masses sont de notre côté.\n\n§YLe Vietnam sera libre.§!\n§YLe joug colonial sera brisé.§!"
