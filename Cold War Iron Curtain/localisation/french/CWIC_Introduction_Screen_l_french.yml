 INO_STARTUP_TITLE: "[INO.GetName]"
 INO_STARTUP_DESC: "Pendant 350 ans, l'archipel indonésien a subi la colonisation et la gouvernance par les Néerlandais, une période marquée par l'exploitation et le contrôle de ses riches ressources et de ses diverses cultures. Les années 1920 ont apporté des expériences contrastées ; Alors que les pays occidentaux entraient dans une phase de stabilité et de redressement après la Première Guerre mondiale, les Indes néerlandaises assistaient à une montée significative de la conscience nationale connue sous le nom de Réveil national indonésien.\n\nLa politique éthique néerlandaise, introduite au début des années 1900, visait à améliorer le bien-être de la population indonésienne. Cependant, cela a aussi, par inadvertance, favorisé l'émergence d'organisations politiques autochtones. Parmi les premiers à être créés figurent le Budi Utomo en 1908, qui se concentrait sur la promotion de l'éducation et de la réforme sociale, suivi par l'Indische Partij en 1912, qui plaidait pour davantage de droits politiques et de représentation pour les Indonésiens. Cette période d'éveil politique a vu la formation d'un parlement provisoire des Indes, connu sous le nom de Volksraad, qui a été convoqué en 1918. Le conseil était composé de 39 membres, dont 15 étaient d'origine indonésienne, marquant une étape importante vers l'implication politique de la population locale.\n\nCependant, les effets positifs de la politique éthique ont commencé à se faire sentir en 1927 lorsque Soekarno, nationaliste et militant passionné, a fondé le Parti national indonésien (Partai Nasional Indonesia, ou PNI). Son leadership a enflammé l'esprit révolutionnaire parmi les Indonésiens. En 1928, un événement capital connu sous le nom de Youth Pledge (Sumpah Pemuda) a eu lieu, au cours duquel de jeunes nationalistes se sont réunis pour déclarer leur engagement en faveur d'une nation unifiée. Cet engagement mettait en avant l'idée « d'une nation, d'une langue et d'un peuple », visant à transcender les divisions ethniques et culturelles dans la quête de l'unité nationale.\n\nLa situation a pris une tournure radicale pendant la Seconde Guerre mondiale. En mars 1942, l'Empire japonais envahit et prend le contrôle des Indes néerlandaises. Contrairement aux attentes selon lesquelles les forces japonaises réprimeraient les sentiments nationalistes, elles employèrent Soekarno et Hatta à des fins de propagande, utilisant efficacement leur leadership pour obtenir le soutien de la population indonésienne. L'occupation japonaise a modifié la dynamique du pouvoir et facilité la croissance des mouvements nationalistes.\n\nLe 15 août 1945, après la capitulation du Japon à la fin de la Seconde Guerre mondiale, un groupe de jeunes nationalistes, animés par le désir d'indépendance, kidnappèrent Soekarno et Hatta. Cette décision a abouti à la proclamation de l'État unitaire de la République d'Indonésie le 17 août 1945.\n\nBien que l'Indonésie ait obtenu son indépendance de facto, elle était toujours confrontée à des défis liés au retour des forces néerlandaises sous l'administration civile des Indes néerlandaises. Quatre ans plus tard, en 1949, alors que la lutte pour la pleine souveraineté se poursuivait, la résilience et la détermination du peuple indonésien rayonnaient, alimentées par un esprit collectif resté inflexible face à l'adversité. Le rêve d'indépendance brillait plus fort qu'un million d'étoiles."
