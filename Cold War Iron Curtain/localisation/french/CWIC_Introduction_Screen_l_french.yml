 PRC_STARTUP_DESC: "Cela fait §Y22 ans§!, marquant le jour depuis le §RMassacre de Shanghai§!, où nos camarades révolutionnaires et prolétaires ont été massacrés à Shanghai, et où notre révolution pour libérer la Chine des §Rtraîtres réactionnaires du Guomindang§! a commencé.\n\nNous avons souffert sous §Y100 ans d'humiliation§!. Les Qing ont permis que notre peuple soit empoisonné par l'Occident, l'Alliance des huit nations §R§! a permis la prise de nos ports et de nos peuples, notre dignité nous a été volée par les échecs constants des gouvernements qui prétendaient servir notre peuple.\n\nNotre seul espoir sous §YSun Yat-sen§! nous a été volé lorsque le KMT s'est divisé en §YKMT de gauche§! sous §YWang Jingwei§!, fidèle aux idées de Sun Yat-sen et authentique à ses idéaux révolutionnaires, et le §RKMT de droite§!, une agression révisionniste des idées de Sun qui a affamé notre peuple et détruit notre économie nationale, uniquement au profit des bourgeois et des oligarques, marionnettes sous les ficelles de §RChiang Kai-shek§!, forçant notre peuple à vivre sous une fragile illusion de stabilité et d'unité, à être librement opprimé par les seigneurs de la guerre et asservi pour son propre bien. armées, face à la menace pour la sécurité et les moyens de subsistance de leurs familles, la baïonnette pointée sur leur gorge.\n\nNotre guerre révolutionnaire contre le §RRKMT§! et ses loyalistes réactionnaires a entraîné de grandes pertes pour les deux camps.\n\nBien que nous ayons remporté §Y4 des 5 campagnes d'encerclement§! menées par le commandement sud du KMT NRA, §YMao Zedong§! a lui-même subi une grande perte personnelle après avoir perdu sa femme, §YYang Kaihui§!et d'autres amis proches de Mao et de grands révolutionnaires, dont le cousin de l'épouse de Mao, §YYang Youlin§!, vice-président et commandant de la 16e Armée rouge ; §YXu Yangang§!, chef d'état-major du 1er Corps de l'Armée rouge ; §YDeng Zhongxia§!, commissaire politique du 2e Corps de l'Armée rouge ; §YHe Chang§!, directeur du département politique du 3e Corps de l'Armée rouge ; §YJi Zhentong§!, commandant du 5e corps de l'Armée rouge ; §YYe Ting§!, premier commandant de la Nouvelle Quatrième Armée ; §YXu Jishen§!, commandant de la 1ère Armée rouge ; et §YHuang Gonglue§!, commandant de la 3e Armée rouge.\n\nNos pertes ont été encore plus lourdes lors de la périlleuse §YLongue Marche§!, qui a vu la perte de §R90%§! de nos hommes et femmes dans les montagnes de Chine, l'Armée rouge centrale étant réduite de plus de §Y86 000§! à seulement §Y7 000§! hommes. La flamme de la Révolution a été presque éteinte par la seule force du KMT, mais nous avons survécu et avons créé la base révolutionnaire du Shaanxi §Y§!.\n\nMais une nouvelle menace surgit de l'Est.\n\nL'Empire du Japon §R§! a montré les crocs et a posé ses yeux impérialistes sur notre patrie, désireux de coloniser et d'envahir une fois de plus, ayant déjà commis des atCHIités envers la population locale en §YDongbei§!, avec des unités comme l' §RUnité 731§! montrant à notre peuple à quel point il s'en souciait peu. sur l'humanité et la moralité.\n\nMême après avoir vu cette menace pour notre existence même, §RChiang Kai-shek§! a enfoui son visage dans la terre comme un chien avide et a continué à tenter de détruire le §YCPC§!, sa cupidité et son intention de solidifier son propre pouvoir personnel étant mises à nu pour que toute la Chine puisse le voir.\n\nSon propre commandement en avait assez de lui. §YZhang Xueliang§!, chef de l'Armée anticommuniste du Nord-Ouest, a kidnappé Chiang Kai-shek et l'a amené au PCC pour lui forcer la main à former le §YDeuxième Front uni§!. Chiang a finalement accepté, à contrecoeur.\n\nC'est ainsi qu'ont commencé les §YHuit années de Résistance§!, alors que nos frères saignaient et combattaient avec chaque once de chair et de sang qu'ils avaient dans leur corps, tandis que notre peuple était violé et massacré par les Japonais -§Rla faiblesse du Guomindang§! exposée au monde entier. Notre peuple est mort de faim, mais notre moral n'a jamais été aussi haut. Là où le KMT disposait d'une supériorité aérienne et terrestre, la totalité des zones occupées de Chine étaient soumises à une guérilla massive annoncée par le PCC et les partisans fidèles à notre cause.\n\nUne fois les huit années de résistance terminées, la majeure partie du Nord-Est était sous notre contrôle.\n\nUne fois les huit années de résistance terminées et la majeure partie du Nord-Est passée sous notre contrôle, la lutte contre l'oligarchie fasciste de Chiang §R§! a repris, transformant le conflit frère contre frère en une guerre révolutionnaire à l'échelle nationale.\n\nNos forces sont passées de §Y120 000§! dans l'armée de campagne du Nord-Est à plus de §Y1 million§! en 1947 alors que les paysans, dynamisés par la réforme agraire et l'éveil politique, rejoignaient la cause, alimentant les trois grandes campagnes de 1946 à 1949 : §YLiaoshen§!, §YHuaihai§!et §YPingjin§!, qui incarnaient non seulement la stratégie militaire mais aussi la volonté unifiée du peuple chinois sous §Yle marxisme-léninisme.§! et la direction du Parti.\n\n§YLa campagne Liaoshen§! a libéré le Nord-Est qui souffrait depuis longtemps grâce à un soutien de masse et à des victoires décisives en §YJinzhou§!, §YChangchun§!, §YShenyang§!et §YYingkou§!, nous donnant une base industrielle cruciale.\n\n§YLa campagne Huaihai§! a démontré la puissance d'une véritable guerre populaire, avec §Ydes millions de civils§! soutenant le front et aidant à anéantir l'armée centrale d'élite de l'ennemi.\n\n§YLa campagne Pingjin§! a conclu la lutte dans le nord de la Chine, où §YTianjin§! est tombée rapidement et §YBeiping§! a été libérée pacifiquement grâce à une pression militaire et politique combinée.\n\nEnsemble, ces victoires ont brisé la force militaire du §RGuomindang§!, §Rses fondements économiques§!et §Rsa légitimité restante§!, ouvrant la voie à la naissance de §Yla Nouvelle Chine.§!.\n\nL'ordre réactionnaire au pouvoir s'effondrait. La voie du peuple vers la libération nationale était ouverte devant nous. Le fleuve Yangtze attendait d'être traversé. Nanjing, Shanghai et tout le Sud attendaient leur libération. L'aube de la Nouvelle Chine approchait, portée par les millions de personnes qui s'étaient soulevées pour revendiquer leur avenir.\n\nNous sommes aujourd'hui le §Y23 mai 1949§!et notre Libération n'a jamais été aussi proche. Nous avons pris §YPékin§! et la majorité du Nord-Est, et notre nombre est largement supérieur à celui du Guomindang.\n\n§YNotre libération est maintenant !§! Gloire à l'unité des peuples du monde ! Gloire au Parti !"
 PRC_STARTUP_BUTTON: "Mao Zhuxi Wansui !"
