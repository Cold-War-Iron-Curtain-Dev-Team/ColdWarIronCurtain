 HUK_STARTUP_DESC: "Les îles Philippines ne sont pas étrangères aux révolutions. L'esprit de liberté qui a donné naissance à la lutte du Katipunan contre l'impérialisme espagnol il y a 50 ans perdure encore aujourd'hui, incarné par la résistance du Hukbalahap à l'impérialisme japonais et américain.\n\nAprès la fin de la Seconde Guerre mondiale, la clandestinité socialiste philippine et les syndicats se sont légitimés sous la forme de l'Alliance démocratique, parvenant à remporter 6 sièges au Parlement lors des élections de 1946. Cependant, au moment de prendre leurs sièges, le gouvernement de Manille a refusé d'accepter les résultats des élections, invoquant des fraudes et des tactiques de campagne violentes. Cela a été fait délibérément pour obtenir une majorité au Parlement pour adopter les amendements constitutionnels conformément à la Loi sur le commerce des Philippines, visant à donner aux citoyens et aux entreprises américains des droits sur les ressources naturelles des Philippines comme s'ils étaient des citoyens philippins naturels.\n\nAvec la pression croissante de l'administration Roxas et l'échec des programmes de pacification paysanne ; la goutte d'eau qui a fait déborder le vase a été l'assassinat de Juan Feleo, éminent leader paysan et membre de haut rang du Parti communiste. Sa mort est devenue le signal du retour à la lutte armée. À la fin de l'année, le chef des Huks, Luis Taruc, ainsi que des milliers de paysans et d'anciens guérilleros Huks, sont entrés dans la clandestinité.\n\nLe Parti, quant à lui, a poursuivi son travail pour aider les organisations syndicales et attirer davantage de membres. Après un bref triumvirat suite au décès de Vicente Lava ; le Parti est désormais dirigé par José Lava, frère de l'ancien secrétaire général. Les gens étaient fatigués d'une exploitation constante ; par leurs suzerains, par des envahisseurs étrangers et par des propriétaires terriens impitoyables. Le nombre de personnes soutenant les insurgés augmenta rapidement et, en mars 1948, le président Roxas interdit le Parti communiste et toutes les organisations affiliées, ordonnant des arrestations massives de leurs dirigeants, ce qui aggrava encore le conflit. Il mourut d'ailleurs un mois plus tard des suites d'une crise cardiaque et le vice-président Quirino lui succéda.\n\nAujourd'hui, en 1949, le choc idéologique dans les îles est loin d'être terminé. Même si les forces Huk augmentent chaque jour en nombre, une récente tragédie menace l'avenir du mouvement. La veuve de l'ancien président, Aurora Quezon, a été tuée ainsi que sa fille et son gendre. Comme elle était présidente de la Croix-Rouge philippine, cet acte a suscité une condamnation quasi universelle.\n\nLes gens sont fatigués, les approvisionnements s'épuisent et, avec un monde de plus en plus polarisé, les États-Unis ne peuvent plus rester concentrés sur les îles plus longtemps. La rébellion entre dans une nouvelle étape."
