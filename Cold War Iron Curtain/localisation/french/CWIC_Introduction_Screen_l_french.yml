 VIE_STARTUP_DESC: "L'effondrement de l'Empire japonais en août 1945 a créé un dangereux vide de pouvoir au Vietnam.\n\nAu nord, le §YViet Minh§! proclama son indépendance, mais au sud, Saigon devint le centre d'une lutte bien plus chaotique. Les groupes nationalistes, les mouvements religieux, les anciens responsables coloniaux et les milices armées se disputaient tous l'influence alors que l'ordre ancien s'effondrait.\n\nEn septembre 1945, les forces britanniques débarquèrent à Saigon dans le cadre de l'opération Masterdom pour accepter la capitulation japonaise.§! Pourtant leur arrivée permit bientôt aux Français de réarmer et de restaurer leur administration coloniale. Pour de nombreux Vietnamiens, ce qui était d'abord apparu comme une libération est devenu le §Rle retour de la domination française§!.\n\nTout au long des années 1946 et 1947, l'autorité française fut progressivement rétablie dans les principales villes du sud du Vietnam. Saigon a de nouveau arboré le drapeau tricolore, les responsables coloniaux sont retournés à leurs bureaux et les forces françaises ont sécurisé les ports, les routes et les centres administratifs clés. Cela a donné à la France une mesure de §Gde stabilité urbaine§!, mais elle n'a pas réussi à gagner la loyauté des campagnes.\n\nAu-delà des villes, le §YViet Minh§! et d'autres forces nationalistes ont étendu leurs réseaux clandestins. Les attaques de guérilla, les sabotages et les embuscades se sont répandus dans la Cochinchine rurale, faisant du sud du Vietnam l'un des principaux champs de bataille de la première guerre d'Indochine. Le contrôle français restait le plus fort dans les villes, tandis que les campagnes devenaient de plus en plus difficiles à gouverner.\n\nEn 1948, la France était confrontée à un problème croissant. La force militaire à elle seule ne pouvait vaincre le nationalisme vietnamien, et la domination coloniale directe semblait de plus en plus difficile à justifier auprès du monde extérieur. En réponse, Paris s'est tourné vers une solution politique centrée sur l'ancien empereur §YBao-Dai§!.\n\nEn mai 1949, Bao-Dai accepta de diriger le nouvel État du Vietnam §Y§!, un gouvernement conçu pour offrir une alternative nationaliste modérée §G§! au Viet Minh tout en restant lié à l'Union française. Les partisans ont affirmé qu'il s'agissait d'un pas vers l'autonomie gouvernementale vietnamienne et la reconnaissance internationale.\n\nLes critiques ont cependant dénoncé cet arrangement comme étant un régime fantoche français §R§!, arguant que la véritable indépendance avait simplement été remplacée par une nouvelle forme de contrôle colonial. Le Sud-Vietnam se trouve désormais à la croisée des chemins entre le nationalisme, le compromis colonial et une guerre qui ne montre aucun signe de fin."
