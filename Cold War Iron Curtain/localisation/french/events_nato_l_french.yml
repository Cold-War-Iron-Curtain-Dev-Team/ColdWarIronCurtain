l_french:
 nato.9.t:0 "Isolationnisme ou internationalisme ?"
 nato.9.d:0 "Dans le cadre d'une de ses promesses électorales, le président a promis de retirer les États-Unis de l'OTAN. Il a appelé à moins d'intervention dans le monde et à un retour à notre État isolationniste comme avant la Seconde Guerre mondiale. Cependant, cela pourrait rendre l'Europe vulnérable aux hordes du communisme et donner à l'URSS un monde ouvert pour propager ses idéaux communistes. Si nous restons isolationnistes, nous espérons que nous ne serons pas entraînés dans une Troisième Guerre mondiale. Quelle devrait être la politique étrangère américaine ?"
 nato.9.b:0 "Le communisme est devenu une trop grande menace. L'internationalisme est nécessaire."
 nato.9.a:0 "L'isolationnisme est nécessaire à la paix."

 nato.10.t:0 "L'Amérique quitte l'OTAN"
 nato.10.d:0 "Le président américain Taft a annoncé le retrait de l'Amérique de l'OTAN. Les États-Unis ont déclaré vouloir revenir à leurs politiques isolationnistes d'avant la Seconde Guerre mondiale. Avec le retrait des États-Unis de l'OTAN, nous sommes désormais une alliance beaucoup plus faible. L'URSS aura plus de facilité à étendre son influence dans le monde. Nous devons décider si nous restons dans l'alliance de l'OTAN et conservons ce que nous pouvons détenir de l'URSS, ou si nous devons nous retirer et nous défendre. Si nous restons, le Royaume-Uni sera le leader de l'alliance car il possède la plus grande armée autre que l'Amérique. Nous devons prendre une décision sur l'avenir de l'alliance."
 nato.10.a:0 "L'OTAN doit défendre le monde libre, avec ou sans l'Amérique."
 nato.10.b:0 "L'OTAN est une alliance faible et est devenue une cause perdue."
 
 nato.101.t:0 "[GetNewspaperHeader]Les États-Unis annoncent la fin de leur adhésion à l'OTAN."
 nato.101.d:0 "Les États-Unis ont annoncé aujourd'hui leur retrait du commandement de l'OTAN et leur adhésion. Le président Taft a déclaré qu'il ne souhaitait plus intervenir dans les affaires étrangères et faire ce qui est le mieux pour le peuple américain. Taft a également déclaré qu'il souhaitait inaugurer une nouvelle ère de prospérité américaine qui s'accompagnerait d'un isolationnisme. D'autres membres de l'OTAN sont choqués et se réunissent désormais en conseil d'urgence pour discuter de l'avenir de l'OTAN et du monde libre. L'URSS a déclaré qu'elle souhaitait le meilleur pour les États-Unis et a également déclaré que sa politique isolationniste aiderait le monde. Qu'arrivera-t-il au monde libre ?"
 nato.101.a:0 "Un développement intéressant."
 
 nato.11.t:0 "Les États-Unis quittent l'OTAN : quitter ou rester ?"
 nato.11.d:0 "Le président américain Taft a annoncé le retrait de l'Amérique de l'OTAN. Les États-Unis ont déclaré vouloir revenir à leurs politiques isolationnistes d'avant la Seconde Guerre mondiale. Avec le retrait des États-Unis de l'OTAN, nous sommes désormais une alliance beaucoup plus faible. L'URSS aura plus de facilité à étendre son influence dans le monde. Nous devons décider si nous restons dans l'alliance de l'OTAN et conservons ce que nous pouvons détenir de l'URSS, ou si nous devons nous retirer et nous défendre."
 nato.11.a:0 "Rester"
 nato.11.b:0 "Partir"
 
 nato.12.t:0 "Le Royaume-Uni abandonne l'OTAN : former l'EDC ?"
 nato.12.d:0 "Nous avons le plan Pleven qui souhaite établir une alliance plus eurocentrique, et il pourrait s'avérer être une alternative puissante à l'OTAN. La Communauté européenne de défense (CED) pourrait contribuer à stopper l'URSS et son influence."
 nato.12.a:0 "Formez-le : nous avons besoin d'une alliance européenne."
 nato.12.b:0 "Ne vous en faites pas : nous devons nous soucier de nous-mêmes."
 
 nato.13.t:0 "La France crée EDC"
 nato.13.d:0 "À partir des restes de l'OTAN, une nouvelle faction s'est formée. Cette nouvelle faction est connue sous le nom de Communauté européenne de défense et est destinée à remplacer l'OTAN en Europe. Devons-nous adhérer ?"
 nato.13.a:0 "Rejoindre"
 nato.13.b:0 "Ne rejoignez pas"
 
 nato.14.t:0 "Réformer l'OTAN ?"
 nato.14.d:0 "Avec une nouvelle administration, nous devons décider de nouvelles politiques. L'ancienne politique étrangère était une politique d'isolationnisme et de non-interventionnisme dans les affaires étrangères. Les États-Unis devraient-ils poursuivre leurs politiques isolationnistes ou devrions-nous mettre en oeuvre des politiques interventionnistes ? Avec la dissolution de l'OTAN, nous pourrions essayer de la réformer à nouveau. Quelle devrait être notre politique ?"
 nato.14.a:0 "Réforme"
 nato.14.b:0 "Ne vous réformez pas"
 
 nato.141.t:0 "[GetNewspaperHeader]L'Amérique réforme l'OTAN"
 nato.141.d:0 "Les États-Unis et des dizaines d'autres pays européens se sont réunis aujourd'hui à Bruxelles pour réformer officiellement l'OTAN. Les membres de l'OTAN sont heureux que l'Amérique ait réformé l'alliance et espèrent une Europe plus forte. Les États-Unis ont annoncé ce changement de politique après l'expansion de l'influence soviétique en Europe et la menace évidente qui pesait sur l'Amérique. Le déploiement des troupes américaines en Europe a commencé et l'URSS déclare qu'elle n'est pas satisfaite de l'agression américaine."
 nato.141.a:0 "Une évolution intéressante."
 
 nato.15.t:0 "Les États-Unis réforment l'OTAN : invitation à la rejoindre"
 nato.15.d:0 "Les États-Unis nous ont invités à rejoindre l'OTAN. Faut-il accepter ?"
 nato.15.a:0 "Rejoindre"
 nato.15.b:0 "Partir"
 
 nato.16.t:0 "Réformer EDC?"
 nato.16.d:0 "Avec une nouvelle administration, nous devons décider de nouvelles politiques. L'ancienne politique étrangère était une politique d'isolationnisme et de non-interventionnisme dans les affaires étrangères. Les États-Unis devraient-ils poursuivre leurs politiques isolationnistes ou devrions-nous mettre en oeuvre des politiques interventionnistes ? Avec la dissolution de l'OTAN et la formation de l'EDC, nous pourrions tenter de la réformer à nouveau. Quelle devrait être notre politique ?"
 nato.16.a:0 "Réforme"
 nato.16.b:0 "Ne vous réformez pas"
 
 nato.161.t:0 "[GetNewspaperHeader]EDC dissoute ! L'OTAN réformée par l'Amérique !"
 nato.161.d:0 "Les États-Unis et des dizaines d'autres pays européens se sont réunis aujourd'hui à Bruxelles pour réformer officiellement l'OTAN. Les anciens membres de l'OTAN sont heureux que l'Amérique ait réformé l'alliance et espèrent une Europe plus forte. L'EDC à Paris a été dissoute plus tard dans la journée, mais sa structure de commandement sera introduite dans l'OTAN. Les États-Unis ont annoncé ce changement de politique après l'expansion de l'influence soviétique en Europe et la menace évidente qui pesait sur l'Amérique. Le déploiement des troupes américaines en Europe a commencé et l'URSS déclare qu'elle n'est pas satisfaite de l'agression américaine."
 nato.161.a:0 "Une évolution intéressante."
 
 nato.17.t:0 "Réformes américaines EDC : invitation à réintégrer"
 nato.17.d:0 "Les États-Unis ont réformé l'EDC pour en faire l'OTAN, devrions-nous réintégrer l'OTAN ?"
 nato.17.a:0 "Rejoindre"
 nato.17.b:0 "Partir"
 
 nato.171.t:0 "[GetNewspaperHeader][nato_target.GetName] Rejoint l'OTAN"
 nato.171.d:0 "[nato_target.GetName] a décidé de rejoindre l'OTAN après que les États-Unis ont réformé l'EDC."
 nato.171.a:0 "Une évolution intéressante."
 nato.171.b:0 "Malheureux."
 
 nato.172.t:0 "[GetNewspaperHeader][nato_target.GetName] Quitte l'OTAN"
 nato.172.d:0 "[nato_target.GetName] a décidé de ne pas rejoindre l'OTAN après que les États-Unis ont réformé l'EDC."
 nato.172.a:0 "Une évolution intéressante."
 nato.172.b:0 "Excellente nouvelle !"
 
 nato.18.t:0 "Rejoindre l'OTAN ?"
 nato.18.d:0 "Avec une nouvelle administration, nous devons décider de nouvelles politiques. L'ancienne politique étrangère était une politique d'isolationnisme et de non-internationalisme dans les affaires étrangères. Les États-Unis devraient-ils poursuivre leur politique isolationniste ou devrions-nous mettre en oeuvre une politique internationaliste ? Avec l'OTAN toujours unie, nous pourrions nous réadmettre dans la protection du monde libre. Quelle devrait être notre politique ?"
 nato.18.a:0 "Rejoindre"
 nato.18.b:0 "Ne rejoignez pas"
 
 nato.19.t:0 "Les États-Unis rejoignent l'OTAN : rester ou partir ?"
 nato.19.d:0 "Les États-Unis ont rejoint l'OTAN, devons-nous rester ou partir ?"
 nato.19.a:0 "Rester"
 nato.19.b:0 "Partir"
 
 nato.191.t:0 "[GetNewspaperHeader][nato_target.GetName] Reste dans l'OTAN"
 nato.191.d:0 "[nato_target.GetName] a décidé de rester membre de l'OTAN après le retour des États-Unis."
 nato.191.a:0 "Une évolution intéressante."
 nato.191.b:0 "Malheureux."
 
 nato.192.t:0 "[GetNewspaperHeader][nato_target.GetName] Quitte l'OTAN"
 nato.192.d:0 "[nato_target.GetName] a décidé de quitter l'OTAN après que les États-Unis ont annoncé leur renouvellement."
 nato.192.a:0 "Une évolution intéressante."
 nato.192.b:0 "Excellente nouvelle !"
 
 nato.111.t:0 "[GetNewspaperHeader][nato_target.GetName] Reste dans l'OTAN"
 nato.111.d:0 "[nato_target.GetName] a décidé de rester membre de l'OTAN malgré la perte des États-Unis."
 nato.111.a:0 "Une évolution intéressante."
 nato.111.b:0 "Malheureux."
 
 nato.112.t:0 "[GetNewspaperHeader][nato_target.GetName] Quitte l'OTAN"
 nato.112.d:0 "[nato_target.GetName] a décidé de quitter l'OTAN, suivant l'exemple des États-Unis."
 nato.112.a:0 "Une évolution intéressante."
 nato.112.b:0 "Excellente nouvelle !"
 
 nato.121.t:0 "[GetNewspaperHeader]La France crée EDC"
 nato.121.d:0 "À partir des restes de l'OTAN, une nouvelle faction s'est formée. Dirigée par la France, cette nouvelle faction est connue sous le nom de Communauté européenne de défense et est destinée à prendre la place de l'OTAN en Europe."
 nato.121.a:0 "Un développement intéressant."
 
 nato.122.t:0 "[GetNewspaperHeader]L'OTAN dissoute"
 nato.122.d:0 "Après une réunion d'urgence du conseil d'administration à Londres aujourd'hui, l'OTAN a annoncé la dissolution de l'alliance. Avec le retrait récent de l'Amérique de l'alliance, l'OTAN a perdu son soutien et son moral. Plusieurs pays, comme la France par exemple, ont déclaré que c'était aux pays eux-mêmes de se défendre et que l'OTAN était désormais une alliance faible. Avec la disparition de l'OTAN, nombreux sont ceux qui s'inquiètent de la propagation du communisme, mais les anciens membres ont déclaré qu'ils continueraient à lutter contre le communisme et ses idéaux. Qu'arrivera-t-il désormais au monde libre ?"
 nato.122.a:0 "Un développement intéressant."
 nato.122.b:0 "L'Occident s'affaiblit."
 
 nato.131.t:0 "[GetNewspaperHeader][edc_target.GetName] Rejoint EDC"
 nato.131.d:0 "[edc_target.GetName] a décidé de rejoindre EDC."
 nato.131.a:0 "Une évolution intéressante."
 nato.131.b:0 "Malheureux."
 
 #nato.132.t:0 "[edc_target.GetName] Joins the EDC"
 #nato.132.d:0 "[edc_target.GetName] has decided to join the EDC."
 #nato.132.a:0 "An interesting development."
 #nato.132.b:0 "Great news!"
