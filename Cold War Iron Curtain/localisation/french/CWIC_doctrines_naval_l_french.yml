l_french:
  CW_SEA_CONTROL: "Contrôle maritime"
  CW_SEA_CONTROL_DESC: "Commandez les voies maritimes grâce à des flottes de haute mer équilibrées : des groupes d'action de surface, un porte-avions et un écran ASW profond maintiennent l'Atlantique et le Pacifique ouverts aux renforts, tandis que l'ennemi se voit refuser l'océan."
  CW_SEA_DENIAL: "Déni de mer"
  CW_SEA_DENIAL_DESC: "La marine, la plus faible, refuse la bataille décisive. Les sous-marins, les bateaux lance-missiles, les mines et les avions basés à terre affrontent la mer pour une fraction du coût d'une flotte équilibrée et mettent en danger chaque convoi et chaque force opérationnelle."
  CW_POWER_PROJECTION: "Projection de puissance"
  CW_POWER_PROJECTION_DESC: "La puissance maritime comme instrument de politique : les groupes aéronavals et les forces amphibies transportent la puissance aérienne, les marines et la dissuasion nucléaire sur n'importe quelle côte, frappant les ports et les cibles côtières depuis la mer."
  CW_SHORE_BOMBARDMENT_GUNLINE: "Ligne de tir de bombardement côtier"
  CW_SHORE_BOMBARDMENT_GUNLINE_DESC: "Les derniers gros navires deviennent de l'artillerie flottante pour le flanc côtier : croiseurs et cuirassés ferment le rivage pour pilonner les positions fortifiées, comme à Inchon et Wonsan."
  cw_shore_bombardment_gunline_gunfire_support: "Procédures d'appui aux tirs d'armes à feu"
  cw_shore_bombardment_gunline_spotting_aircraft: "Avion d'observation"
  cw_shore_bombardment_gunline_heavy_shell_stocks: "Stocks d'obus lourds"
  cw_shore_bombardment_gunline_armored_citadels: "Citadelles blindées"
  cw_shore_bombardment_gunline_coastal_fire_discipline: "Discipline des incendies côtiers"
  CW_CRUISER_TASK_GROUPS: "Groupes de travail des croiseurs"
  CW_CRUISER_TASK_GROUPS_DESC: "Les croiseurs canonniers dirigent des groupes de surface indépendants qui filtrent les porte-avions, chassent les raiders et arborent le drapeau sur les stations éloignées pendant que les derniers cuirassés sont désarmés."
  cw_cruiser_task_groups_flagship_coordination: "Coordination phare"
  cw_cruiser_task_groups_night_action_drill: "Exercice d'action nocturne"
  cw_cruiser_task_groups_radar_fire_control: "Contrôle des tirs radar"
  cw_cruiser_task_groups_sustained_deployments: "Déploiements soutenus"
  cw_cruiser_task_groups_squadron_tactics: "Tactiques d'escadron"
  CW_GUIDED_MISSILE_CRUISERS: "Croiseurs lance-missiles"
  CW_GUIDED_MISSILE_CRUISERS_DESC: "Terrier, Talos et Tartar remplacent les canons sur la coque du croiseur. Les croiseurs lance-missiles deviennent l'épine dorsale anti-aérienne d'une flotte et la première ligne contre les raids de bombardiers."
  cw_guided_missile_cruisers_area_air_defense: "Défense aérienne de zone"
  cw_guided_missile_cruisers_missile_magazines: "Chargeurs de missiles"
  cw_guided_missile_cruisers_combat_information_centers: "Centres d'information sur les combats"
  cw_guided_missile_cruisers_conversion_programs: "Programmes de conversion"
  cw_guided_missile_cruisers_missile_gunfire_mix: "Mélange de missiles et d'armes à feu"
  CW_NUCLEAR_SURFACE_ESCORTS: "Escortes de surface nucléaire"
  CW_NUCLEAR_SURFACE_ESCORTS_DESC: "Les croiseurs et les frégates propulsés par réacteur peuvent naviguer avec un porte-avions nucléaire à vitesse de flanc pendant des mois et n'ont pas besoin de pétroliers, étendant ainsi la portée de chaque force opérationnelle escortée."
  cw_nuclear_surface_escorts_reactor_cores: "Coeurs de réacteurs à longue durée de vie"
  cw_nuclear_surface_escorts_high_speed_transit: "Transport en commun à grande vitesse"
  cw_nuclear_surface_escorts_shielded_machinery: "Espaces de machines protégés"
  cw_nuclear_surface_escorts_escort_integration: "Intégration d'escorte de transporteur"
  cw_nuclear_surface_escorts_nuclear_logistics: "Logistique Nucléaire"
  CW_AEGIS_AREA_DEFENSE: "Défense de zone Aegis"
  CW_AEGIS_AREA_DEFENSE_DESC: "Un radar à réseau phasé et des cellules de lancement vertical permettent à un croiseur de suivre et d'engager des centaines de cibles à la fois : les raids de saturation qui coulent les flottes plus anciennes échouent tout simplement."
  cw_aegis_area_defense_phased_array_radar: "Radar à réseau phasé"
  cw_aegis_area_defense_vertical_launch: "Systèmes de lancement vertical"
  cw_aegis_area_defense_cooperative_engagement: "Engagement coopératif"
  cw_aegis_area_defense_ballistic_missile_defense: "Défense contre les missiles balistiques"
  cw_aegis_area_defense_integrated_combat_system: "Système de combat intégré"
  CW_SURFACE_ACTION_GROUPS: "Groupes d'action de surface"
  CW_SURFACE_ACTION_GROUPS_DESC: "De petits groupes de navires lance-missiles opèrent de manière indépendante, chassant la flotte ennemie avec des missiles antinavires à longue portée et s'éloignant avant que l'escadron aérien du transporteur ne puisse répondre."
  cw_surface_action_groups_long_range_targeting: "Ciblage au-delà de l'horizon"
  cw_surface_action_groups_salvo_tactics: "Tactiques de salve"
  cw_surface_action_groups_emission_control: "Contrôle des émissions"
  cw_surface_action_groups_independent_deployments: "Déploiements indépendants"
  cw_surface_action_groups_hit_and_run_doctrine: "Frapper et courir"
  CW_FLEET_CARRIER_STRIKE: "Grève des transporteurs de flotte"
  CW_FLEET_CARRIER_STRIKE_DESC: "Les porte-avions de la flotte d'après-guerre transportent les premières ailes aériennes à réaction. Les frappes concentrées sur le pont remplacent la ligne de bataille comme instrument de décision en mer."
  cw_fleet_carrier_strike_deck_cycle_drill: "Foreuse à cycle de pont"
  cw_fleet_carrier_strike_angled_decks: "Postes de pilotage inclinés"
  cw_fleet_carrier_strike_strike_coordination: "Coordination des grèves"
  cw_fleet_carrier_strike_night_deck_operations: "Opérations de nuit sur le pont"
  cw_fleet_carrier_strike_air_wing_integration: "Intégration de l'aile aérienne"
  CW_ESCORT_CARRIER_ASW: "Transporteur d'escorte ASW"
  CW_ESCORT_CARRIER_ASW_DESC: "Des porte-avions légers équipés de chasseurs et d'avions anti-sous-marins protègent les convois et forment des groupes de chasseurs-tueurs : les patrouilles aériennes empêchent le sous-marin d'accéder à la surface."
  cw_escort_carrier_asw_air_patrol_screens: "Écrans de patrouille aérienne"
  cw_escort_carrier_asw_convoy_air_cover: "Couverture aérienne du convoi"
  cw_escort_carrier_asw_compact_hangars: "Hangars compacts"
  cw_escort_carrier_asw_rocket_armed_aircraft: "Avion armé de fusées"
  cw_escort_carrier_asw_hunter_killer_groups: "Groupes de chasseurs-tueurs"
  CW_SUPERCARRIER_STRIKE: "Frappe du supercarrier"
  CW_SUPERCARRIER_STRIKE_DESC: "Les decks de classe Forrestal lancent des avions d'attaque lourds dotés d'armes nucléaires. Un seul porte-avions possède une puissance de frappe supérieure à celle de la marine d'avant-guerre, et cela peut se produire n'importe où en une semaine."
  cw_supercarrier_strike_steam_catapults: "Catapultes à vapeur"
  cw_supercarrier_strike_heavy_attack_wings: "Ailes d'attaque lourdes"
  cw_supercarrier_strike_nuclear_strike_role: "Rôle de frappe nucléaire"
  cw_supercarrier_strike_armored_flight_decks: "Postes de pilotage blindés"
  cw_supercarrier_strike_underway_replenishment: "Réapprovisionnement en cours"
  CW_HELICOPTER_ASSAULT_CARRIERS: "Porte-hélicoptères d'assaut"
  CW_HELICOPTER_ASSAULT_CARRIERS_DESC: "Les navires d'assaut amphibies lancent des troupes par hélicoptère au-dessus des défenses de la plage et servent également de plates-formes d'hélicoptères ASW : le porte-avions abandonne la vitesse au profit de la polyvalence."
  cw_helicopter_assault_carriers_vertical_envelopment: "Enveloppement vertical"
  cw_helicopter_assault_carriers_well_deck_ops: "Opérations sur le pont de puits"
  cw_helicopter_assault_carriers_asw_helicopter_flights: "Vols en hélicoptère ASW"
  cw_helicopter_assault_carriers_gunship_support: "Soutien aux hélicoptères de combat"
  cw_helicopter_assault_carriers_flexible_hangars: "Hangars flexibles"
  CW_CARRIER_BATTLE_GROUPS: "Groupements tactiques aéronavals"
  CW_CARRIER_BATTLE_GROUPS_DESC: "Le porte-avions est le centre d'une défense à plusieurs niveaux : un anneau extérieur d'escortes ASW, un anneau central de navires lance-missiles et une aile aérienne intérieure maintiennent une cible unique presque impossible à tuer."
  cw_carrier_battle_groups_layered_defense: "Défense en couches"
  cw_carrier_battle_groups_battle_group_tactics: "Tactiques du groupement tactique"
  cw_carrier_battle_groups_sensor_fusion: "Fusion de capteurs"
  cw_carrier_battle_groups_cruise_missile_defense: "Défense contre les missiles de croisière"
  cw_carrier_battle_groups_rapid_rearming: "Réarmement rapide"
  CW_VSTOL_LIGHT_CARRIERS: "Transporteurs légers VSTOL"
  CW_VSTOL_LIGHT_CARRIERS_DESC: "Les jets de saut de classe Harrier sur un croiseur à pont traversant offrent aux petites marines une véritable arme aérienne pour une fraction d'un supercarrier : bon marché, rapide à construire et bien adapté au littoral."
  cw_vstol_light_carriers_ski_jump_ramps: "Rampes de saut à ski"
  cw_vstol_light_carriers_vstol_air_wings: "Ailes aériennes VSTOL"
  cw_vstol_light_carriers_through_deck_design: "Conception traversante"
  cw_vstol_light_carriers_asw_air_group: "Groupe aérien ASW"
  cw_vstol_light_carriers_light_carrier_task_forces: "Groupes de travail sur les transporteurs légers"
  CW_ASW_HUNTER_KILLER: "Groupes de chasseurs-tueurs ASW"
  CW_ASW_HUNTER_KILLER_DESC: "Des destroyers d'escorte équipés de sonars, de hérissons et plus tard d'hélicoptères traquent le sous-marin en groupe : la flotte soviétique est la cible et l'Atlantique Nord le champ de bataille."
  cw_asw_hunter_killer_sonar_training: "Formation Sonar"
  cw_asw_hunter_killer_depth_charge_drill: "Foreuse à grenades sous-marines"
  cw_asw_hunter_killer_coordinated_sweeps: "Balayages coordonnés"
  cw_asw_hunter_killer_ocean_patrol_routine: "Routine de patrouille océanique"
  cw_asw_hunter_killer_kill_zone_tactics: "Tactiques de zone de destruction"
  CW_CONVOY_ESCORT_GROUPS: "Groupes d'escorte de convoi"
  CW_CONVOY_ESCORT_GROUPS_DESC: "Des groupes d'escorte dédiés naviguent avec des convois marchands sur des itinéraires fixes. Le même système qui a approvisionné la Grande-Bretagne permet aux navires de renfort de l'alliance de traverser l'Atlantique."
  cw_convoy_escort_groups_escort_reclassification: "Reclassement d'escorte"
  cw_convoy_escort_groups_convoy_routing: "Acheminement des convois"
  cw_convoy_escort_groups_minesweeping_duty: "Service de déminage"
  cw_convoy_escort_groups_air_defence_escorts: "Escortes de défense aérienne"
  cw_convoy_escort_groups_escort_endurance: "Endurance d'escorte"
  CW_MISSILE_BOAT_SWARMS: "Essaims de bateaux lance-missiles"
  CW_MISSILE_BOAT_SWARMS_DESC: "De petits bateaux rapides armés de missiles antinavires de type Styx coulent des destroyers qui coûtent vingt fois leur prix. Eilat a prouvé la doctrine et toutes les marines côtières ont suivi."
  cw_missile_boat_swarms_mass_salvo: "Salve de masse"
  cw_missile_boat_swarms_coastal_ambush: "Embuscade côtière"
  cw_missile_boat_swarms_small_craft_harassment: "Harcèlement des petites embarcations"
  cw_missile_boat_swarms_fast_attack_craft: "Artisanat d'attaque rapide"
  cw_missile_boat_swarms_mothership_support: "Assistance aux appels d'offres"
  CW_AREA_AIR_DEFENSE_ESCORTS: "Escortes de défense aérienne de zone"
  CW_AREA_AIR_DEFENSE_ESCORTS_DESC: "Les destroyers et les frégates armés de missiles forment une ligne de piquetage loin devant la flotte, détruisant les bombardiers et les missiles de croisière avant qu'ils ne puissent être lancés."
  cw_area_air_defense_escorts_radar_picket: "Stations de piquetage radar"
  cw_area_air_defense_escorts_missile_destroyers: "Destroyers lance-missiles"
  cw_area_air_defense_escorts_screen_discipline: "Discipline à l'écran"
  cw_area_air_defense_escorts_damage_control: "Contrôle des dégâts"
  cw_area_air_defense_escorts_picket_rotation: "Rotation des piquets"
  CW_TOWED_ARRAY_ASW: "Réseau remorqué ASW"
  CW_TOWED_ARRAY_ASW_DESC: "De longs réseaux de sonars remorqués et des hélicoptères LAMPS transforment chaque frégate en poste d'écoute à longue portée : le sous-marin nucléaire silencieux ne peut plus se cacher."
  cw_towed_array_asw_towed_sonar_arrays: "Réseaux de sonars remorqués"
  cw_towed_array_asw_lamps_helicopters: "LAMPES Hélicoptères"
  cw_towed_array_asw_acoustic_analysis: "Analyse acoustique"
  cw_towed_array_asw_lightweight_torpedoes: "Torpilles légères"
  cw_towed_array_asw_barrier_patrols: "Patrouilles de barrières"
  CW_LITTORAL_COMBATANTS: "Combattants du Littoral"
  CW_LITTORAL_COMBATANTS_DESC: "Navires modulaires à faible tirant d'eau construits pour la lutte côtière : ils opèrent à proximité du rivage, tiennent à distance les mines et les batteries côtières et transportent des marines et des drones."
  cw_littoral_combatants_mission_modules: "Modules de missions"
  cw_littoral_combatants_shallow_water_operations: "Opérations en eaux peu profondes"
  cw_littoral_combatants_mine_countermeasures: "Mesures de lutte contre les mines"
  cw_littoral_combatants_coastal_missile_screen: "Écran de missile côtier"
  cw_littoral_combatants_maritime_security: "Sécurité maritime"
  CW_SNORKEL_WOLFPACKS: "Packs de loups de plongée avec tuba"
  CW_SNORKEL_WOLFPACKS_DESC: "Les bateaux de type XXI équipés de tubas et de batteries à grande vitesse sont livrés par paquets de sept : la conception de la coque et les tactiques de Doenitz l'année dernière façonnent encore tous les bateaux diesel du début de la guerre froide."
  cw_snorkel_wolfpacks_snorkel_operations: "Opérations de plongée en apnée"
  cw_snorkel_wolfpacks_pack_search_patterns: "Modèles de recherche de packs"
  cw_snorkel_wolfpacks_acoustic_torpedoes: "Torpilles acoustiques"
  cw_snorkel_wolfpacks_high_speed_battery: "Batteries haute vitesse"
  cw_snorkel_wolfpacks_patrol_endurance: "Endurance de patrouille"
  CW_FLEET_SUBMARINE_SCOUTING: "Reconnaissance des sous-marins de la flotte"
  CW_FLEET_SUBMARINE_SCOUTING_DESC: "Le bateau de la flotte à longue portée fait office d'yeux pour la flotte : des sous-marins radar et des patrouilleurs repèrent les forces de surface et signalent les positions ennemies."
  cw_fleet_submarine_scouting_radar_picket_boats: "Bateaux de piquetage radar"
  cw_fleet_submarine_scouting_long_range_patrols: "Patrouilles à longue portée"
  cw_fleet_submarine_scouting_lifeguard_duty: "Service de sauveteur"
  cw_fleet_submarine_scouting_fleet_liaison: "Liaison avec la flotte"
  cw_fleet_submarine_scouting_quiet_running: "Fonctionnement silencieux"
  CW_NUCLEAR_ATTACK_SUBMARINES: "Sous-marins d'attaque nucléaire"
  CW_NUCLEAR_ATTACK_SUBMARINES_DESC: "Nautilus et Novembre ont placé un réacteur sous une coque qui n'a jamais besoin de faire surface. Rapide, silencieux et d'une patience infinie, le SSN chasse aussi bien les navires que les sous-marins."
  cw_nuclear_attack_submarines_reactor_endurance: "Endurance du réacteur"
  cw_nuclear_attack_submarines_teardrop_hull: "Coque en forme de larme"
  cw_nuclear_attack_submarines_advanced_sonar: "Sonar avancé"
  cw_nuclear_attack_submarines_wire_guided_torpedoes: "Torpilles filoguidées"
  cw_nuclear_attack_submarines_acoustic_silencing: "Silence acoustique"
  CW_SSBN_DETERRENT_PATROLS: "Patrouilles de dissuasion SNLE"
  CW_SSBN_DETERRENT_PATROLS_DESC: "Les sous-marins lance-missiles balistiques patrouillent pendant des mois, invulnérables en profondeur. Une seconde frappe sécurisée constitue la mission stratégique de la flotte et sa tradition la plus silencieuse."
  cw_ssbn_deterrent_patrols_continuous_patrols: "Patrouilles continues"
  cw_ssbn_deterrent_patrols_missile_tubes: "Fiabilité des tubes de missiles"
  cw_ssbn_deterrent_patrols_crew_rotation: "Équipages bleu et or"
  cw_ssbn_deterrent_patrols_ballistic_escort: "Escortes SNLE"
  cw_ssbn_deterrent_patrols_deep_ocean_hide: "Cacher les profondeurs de l'océan"
  CW_BASTION_DEFENSE: "Défense du Bastion"
  CW_BASTION_DEFENSE_DESC: "Les mers de Barents et d'Okhotsk deviennent des bastions protégés : sous-marins d'attaque, navires de surface, avions et mines travaillent ensemble pour protéger les bateaux lance-missiles chez eux."
  cw_bastion_defense_bastion_minefields: "Champs de mines des bastions"
  cw_bastion_defense_coastal_aviation: "Couverture de l'aviation côtière"
  cw_bastion_defense_surface_picket_line: "Ligne de piquetage de surface"
  cw_bastion_defense_layered_asw_barrier: "Barrière ASW en couches"
  cw_bastion_defense_home_waters_advantage: "Avantage des eaux domestiques"
  CW_CRUISE_MISSILE_SUBMARINES: "Sous-marins lance-missiles de croisière"
  CW_CRUISE_MISSILE_SUBMARINES_DESC: "Les missiles de croisière Tomahawk et Granit placés dans la salle des torpilles ou dans des tubes verticaux transforment le sous-marin en une plate-forme de frappe à distance contre les groupes porteurs et les cibles côtières."
  cw_cruise_missile_submarines_vertical_launch_tubes: "Tubes de lancement verticaux"
  cw_cruise_missile_submarines_land_attack_missiles: "Missiles d'attaque terrestre"
  cw_cruise_missile_submarines_anti_ship_salvoes: "Salves anti-navires"
  cw_cruise_missile_submarines_targeting_networks: "Ciblage des réseaux"
  cw_cruise_missile_submarines_stealth_launch: "Lancement furtif"
  CW_STANDING_NAVAL_FORCE: "Force navale permanente"
  CW_STANDING_NAVAL_FORCE_DESC: "Des escadrons multinationaux en temps de paix qui connaissent déjà les signaux, le ravitaillement et les habitudes de chacun dès le début des tirs. La préparation et la coordination remplacent la puissance brute des armes à feu."
  cw_standing_naval_force_allied_staff_integration: "Intégration du personnel allié"
  cw_standing_naval_force_common_logistics_pool: "Pool Logistique Commun"
  cw_standing_naval_force_combined_exercises: "Exercices combinés"
  cw_standing_naval_force_picket_discipline: "Discipline du piquetage"
  cw_standing_naval_force_shared_air_cover: "Couverture aérienne partagée"
  CW_SSM_CRUISER_SALVOS: "Salvos du croiseur SSM"
  CW_SSM_CRUISER_SALVOS_DESC: "Les croiseurs des classes Kirov et Slava transportent de lourds missiles antinavires conçus pour tuer un porte-avions en une seule salve saturée. Les navires de surface deviennent des plates-formes de lancement pour la première et décisive frappe."
  cw_ssm_cruiser_salvos_saturation_salvo: "Salve de saturation"
  cw_ssm_cruiser_salvos_ocean_surveillance_targeting: "Ciblage de la surveillance des océans"
  cw_ssm_cruiser_salvos_warhead_penetration: "Pénétration des ogives"
  cw_ssm_cruiser_salvos_carrier_killer_doctrine: "Doctrine du tueur de porteurs"
  cw_ssm_cruiser_salvos_damage_control_teams: "Équipes de contrôle des dommages"
  CW_GUNBOAT_DIPLOMACY: "Diplomatie de la canonnière"
  CW_GUNBOAT_DIPLOMACY_DESC: "Un croiseur au large des côtes est un argument politique. Les escadrons coloniaux et expéditionnaires arborent le drapeau, débarquent des troupes et bombardent le rivage partout où les intérêts de l'empire sont pressés."
  cw_gunboat_diplomacy_showing_the_flag: "Montrer le drapeau"
  cw_gunboat_diplomacy_overseas_coaling_stations: "Stations de charbon à l'étranger"
  cw_gunboat_diplomacy_landing_party_support: "Prise en charge de l'équipe d'atterrissage"
  cw_gunboat_diplomacy_colonial_squadrons: "Escadrons coloniaux"
  cw_gunboat_diplomacy_port_visit_intelligence: "Renseignements sur les visites au port"
  CW_HUNTER_KILLER_CARRIER_GROUPS: "Groupes de transporteurs chasseurs-tueurs"
  CW_HUNTER_KILLER_CARRIER_GROUPS_DESC: "Des porte-avions convertis équipés d'avions de suivi et des premiers hélicoptères balayent l'Atlantique à la recherche de sous-marins soviétiques. Le transporteur est d'abord une plate-forme de sous-chasse et ensuite un pont d'attaque."
  cw_hunter_killer_carrier_groups_asw_helicopter_squadrons: "Escadrons d'hélicoptères ASW"
  cw_hunter_killer_carrier_groups_tracker_aircraft: "Avion traqueur"
  cw_hunter_killer_carrier_groups_carrier_screen_integration: "Intégration de l'écran porteur"
  cw_hunter_killer_carrier_groups_sonobuoy_barriers: "Barrières à bouées sonores"
  cw_hunter_killer_carrier_groups_deck_crew_drill: "Exercice d'équipage de pont"
  CW_NUCLEAR_STRIKE_CARRIERS: "Porte-avions nucléaires"
  CW_NUCLEAR_STRIKE_CARRIERS_DESC: "Les porte-avions à grand pont transportent des escadrons d'attaque lourds capables de larguer des armes nucléaires et des munitions conventionnelles contre des ports et des aérodromes partout à portée de la mer."
  cw_nuclear_strike_carriers_heavy_attack_squadrons: "Escadrons d'attaque lourds"
  cw_nuclear_strike_carriers_nuclear_capable_decks: "Ponts à capacité nucléaire"
  cw_nuclear_strike_carriers_deck_cycle_tempo: "Tempo du cycle du pont"
  cw_nuclear_strike_carriers_long_range_targeting: "Ciblage à longue portée"
