l_french:
 NHS_idea:0 "Service national de santé"
 NHS_idea_desc:0 "Le NHS, créé en 1948, est un programme conçu pour offrir des soins de santé abordables à tous les citoyens de Britannia, qu'ils soient pauvres, âgés, handicapés, etc."
 HighMilitarism:0 "Haut militarisme"
 HighMilitarism_desc:0 "Afin de protéger la Grande-Bretagne de la menace toujours croissante qu'est le communisme, il est nécessaire de mobiliser davantage la population et l'économie du pays."
 lowmilitarism:0 "Faible militarisme"
 lowmilitarism_desc:0 "Alors que le communisme se renforce chaque jour qui passe, nous devons le combattre, non pas par l'intimidation, mais en montrant la supériorité de notre société. Notre peuple conservera ses libertés, peu importe à quel point le communisme le menace."
 God_Save_Empress:0 "Dieu sauve le roi !"
 God_Save_Empress_desc:0 "Avec la renaissance et la centralisation de l'Empire, des millions de nos citoyens ont retrouvé leur nationalisme et se ruent désormais vers les centres de recrutement afin de se battre pour le Roi et la Patrie."
 RuleBritannia:0 "Règle Britanna !"
 RuleBritannia_desc:0 "Règle la Britannia ! Britannia règne sur les vagues !"
 EURATOM:0 "EURATOM"
 britain_nuke_sharing:0 "Partage d'armes nucléaires du Commonwealth"
 National_Economic_Development_Council:0 "Conseil national de développement économique"
 british_advisors:0 "Conseillers britanniques"
 ENG_queen_elizabeth:0 "Élisabeth II"
 ENG_queen_elizabeth_desc:0 "\n\n\n\n\n\n£Elizabeth_II\n\n\n\n\n\n\n\n§ Elizabeth Alexandra Mary de la maison de Windsor, officiellement connue sous le nom d'Elizabeth II, est la reine du Royaume-Uni et de ses royaumes du Commonwealth. Elle a été couronnée le 2 juillet 1953. Son rôle de reine n'est pas sans responsabilités. Sa personnalité est un brillant exemple pour notre grande nation et nos dépendances à l'étranger."
 ENG_george_vi_desc:0 "\n\n\n\n\n\n£George_VI\n\n\n\n\n\n\n\n§ Le premier chef du Commonwealth et dernier empereur de l'Inde est toujours considéré comme l'héritier d'un grand héritage. Comme son père avant lui, il est une figure de proue populaire et un rassembleur du peuple britannique."