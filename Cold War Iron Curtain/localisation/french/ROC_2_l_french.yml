 KMT_Military_Reforms_category:0 "Réforme de l'armée"
 KMT_Military_Reforms_category_desc:0 "\n\n\n\n\n\n£CHI_Texticon_Army\n\n\n\n\n\n\n\nLa corruption des forces armées républicaines a presque conduit à la destruction totale de nos soldats pendant la guerre civile. Il est nécessaire d'apporter des changements fondamentaux à la structure et aux stratégies de notre armée pour garantir une protection fonctionnelle et une efficacité dans tout conflit futur, qu'il se déroule à l'intérieur ou à l'extérieur de la Chine.\n"
 
 KMT_Shanghai_beating_tigers_category:0 "La transformation de Shanghai"
 KMT_Shanghai_beating_tigers_category_desc:0 "\n\n\n\n\n\n£CHI_Texticon_Shanghai\n\n\n\n\n\n\n\nQuand on pense à Shanghai, on pense à la Perle de l'Orient, à la Porte de l'Ouest, ou encore à la fierté de la modernisation chinoise. Mais la réalité est souvent décevante. Des hommes d'affaires corrompus, des sociétés secrètes et même des membres de gangs ont décidé de revenir dans la ville après la guerre civile, démontrant que la tâche de dompter la ville ne sera pas plus facile qu'avant. La seule différence, cependant, est que cette fois Chiang Ching-Kuo, le fils du généralissime, est deux fois plus disposé à remplir son devoir de rétablir l'ordre public à Shanghai, si c'est ce qu'il faut pour regagner le soutien des Shanghaiens à la République.\n\n§CLes progrès de la réforme de Shanghai sont actuellement à§! [?ROOT.Shanghai_Beating_Tigers_Reform_var|%%0Y]"
 
 send_ching_kuo_to_shanghai:0 "Envoyez Chiang Ching-Kuo à Shanghai"
 send_ching_kuo_to_shanghai_desc:0 "En 1948, Shanghai n'était plus la ville qu'elle était. Bien qu'elle ait été soumise au colonialisme japonais et européen, la ville est devenue l'une des villes clés les plus importantes de Chine. Le commerce, les échanges culturels et la modernisation lui ont valu le nom de « Perle de l'Orient ». Cependant, des années de guerre civile et de troubles sociaux ont créé un terrain propice à la corruption, au népotisme, aux guerres de gangs et au marché noir, qui sévissent encore aujourd'hui dans la ville. Bien qu'il y ait déjà eu plusieurs tentatives pour transformer la ville en ville modèle en 1948, celles-ci ont finalement échoué en raison d'un conflit interne avec le Parti communiste, qui a finalement conquis Shanghai en mai 1949. Ces bandits étant désormais partis, Chiang a pris sa tâche plus au sérieux que quiconque au Kuomintang pourrait l'imaginer. Il n'abandonnera pas Shanghai, et Shanghai ne l'abandonnera probablement pas." 
 
 start_beating_the_tigers:0 "Lancer les réformes de Shanghai"
 
 relaunch_mass_movements_in_shanghai:0 "Relancer les mouvements de masse à Shanghai"
 
 lobby_support_from_government:0 "Soutien du lobby du gouvernement central"
 
 rearrest_green_gang_members:0 "Débarrassez la ville des gangs et des sociétés secrètes"
 
 outline_various_classes_in_Shanghai:0 "Aperçu des classes socio-économiques de Shanghai"
 
 attack_upperclass_businessmen:0 "Cibler les hommes d'affaires de la classe supérieure"
 
 attack_middleclass_businessmen:0 "Cibler les hommes d'affaires de la classe moyenne"
 
 conclude_the_reforms_in_shanghai:0 "Conclure les réformes à Shanghai"
 
 
 KMT_Temporary_Provisions_Taiwan_50s_category:0 "Dispositions temporaires contre la rébellion communiste"
 KMT_Temporary_Provisions_Taiwan_50s_category_desc:0 "\n\n\n\n\n\n£CHI_Temporary_Provisions\n\n\n\n\n\n\n\nLorsque la Constitution de la République de Chine a été rédigée et adoptée par l'Assemblée nationale en 1947, elle a suscité une grande joie et de grands espoirs au sein du gouvernement de pouvoir enfin stabiliser la Chine et entamer la troisième phase de la révolution du Dr Sun Yat-sens, appelant au progrès du constitutionnalisme. Cependant, la progression rapide du Parti communiste sur le continent et les désertions massives nous ont contraints à suspendre la Constitution et à instaurer la loi martiale dans la République jusqu'au retour de la stabilité et de l'ordre. Alors que le PCC occupe le continent chinois et proclame un nouveau gouvernement, il est tout à fait naturel que l'Assemblée nationale approuve le renouvellement des dispositions jusqu'à ce que le continent soit complètement libéré des bandits communistes.\n"
 
 Move_Presidential_Palace_to_Taipei:0 "Déplacer le siège présidentiel à Taipei"
 Move_Presidential_Palace_to_Taipei_desc:0 "Avec la chute de Chengdu à la fin de 1949, les centres temporaires de guerre de la République de Chine furent dissous. En établissant officiellement le bâtiment du bureau présidentiel dans l'ancien palais du gouverneur général japonais à Taipei, nous signalerons que notre retraite est devenue une base structurée à long terme pour la résistance et une éventuelle récupération du continent."
 
 Storage_of_National_Palace_Museum_Goods:0 "Stockage des biens du Musée national du Palais"
 Storage_of_National_Palace_Museum_Goods_desc:0 "Ayant survécu au voyage de Pékin à Nanjing et enfin aux tunnels de Taichung, ces milliers d'artefacts impériaux sont plus que de l'art ; ils constituent le trésor prouvant que la République de Chine reste le véritable gardien de la culture chinoise."
 
 Establish_Mandatory_Portraits_in_School_Classes:0 "Introduire des portraits obligatoires dans les classes scolaires"
 Establish_Mandatory_Portraits_in_School_Classes_desc:0 "Le nationalisme commence au tableau. En plaçant des portraits de Sun Yat-sen et de Chiang Kai-shek dans chaque classe, l'État entretient un culte de la personnalité et veille à ce que les « Trois principes du peuple » soient la première chose que voit chaque étudiant, ancrant ainsi l'identité de la jeunesse à la cause nationaliste." 
 
 Launch_A_Party_Cadre_Recruitment_Wave:0 "Lancez une vague de recrutement de cadres du parti"
 Launch_A_Party_Cadre_Recruitment_Wave_desc:0 "Pour garantir que le KMT survive à son exil, le parti doit passer d'une bureaucratie militaire pléthorique à une machine idéologique allégée. En recrutant une nouvelle génération de cadres fidèles - dont beaucoup sont des Taïwanais locaux - le parti consolide son contrôle de base sur chaque village, usine et unité militaire."
 
 Invite_Yan_Xishan_into_Chiangs_Circle:0 "Invitez Yan Xishan dans le cercle de Chiangs"
 Invite_Yan_Xishan_into_Chiangs_Circle_desc:0 "Le « gouverneur modèle » du Shanxi, ayant perdu sa province au profit des communistes, se retrouve à Taiwan. En intégrant cet ancien homme d'État et vétéran militaire dans notre cercle restreint en tant que conseiller principal, Chiang maintient non seulement une façade de pleine représentation chinoise au sein de son gouvernement, mais gagne également l'un des gouverneurs chinois les plus appréciés et les plus efficaces du siècle." 
 
 Launch_Propaganda_Broadcasts_across_Mainland_China:0 "Lancez des émissions de propagande dans toute la Chine continentale"
 Launch_Propaganda_Broadcasts_across_Mainland_China_desc:0 "Des tours radio de grande puissance le long des côtes de Kinmen et de Matsu commencent à diffuser « La voix de la Chine libre » à travers le détroit de Taiwan. Ces émissions mélangent informations, musique pop et témoignages de transfuges, dans le but de briser le blocus de l'information communiste et de maintenir vivant l'espoir d'une « reprise nationale» dans le coeur des continentaux." 
 
 Formally_Expell_Li_Zongren_as_VP:0 "Expulser Li Zongren du poste de vice-président"
 Formally_Expell_Li_Zongren_as_VP_desc:0 "Alors que la rivalité entre Chiang Kai-shek et Li Zongren a atteint son point de rupture à la fin de la guerre civile, Li agit toujours officiellement en tant que vice-président de la République de Chine. Alors qu'il reste aux États-Unis pour un « traitement médical » et refuse de retourner sur l'île, le gouvernement doit le destituer et quitter son poste rapidement." 
  
 
 KMT_Temporary_Provisions_Mainland_50s_category:0 "Dispositions temporaires contre la rébellion communiste"
 KMT_Temporary_Provisions_Mainland_50s_category_desc:0 "\n\n\n\n\n\n£CHI_Temporary_Provisions\n\n\n\n\n\n\n\nL'adoption de la Constitution de 1947 a été saluée comme un triomphe, une promesse de stabiliser enfin la Chine et de lancer la troisième phase tant attendue de la révolution du Dr Sun Yat-sen. Cependant, l'avancée incessante du communisme et les désertions massives ne nous ont laissé d'autre choix que de suspendre ces libertés et d'imposer la loi martiale pour rétablir l'ordre. L'ennemi étant soutenu par l'aide soviétique en Mandchourie, l'Assemblée nationale doit inévitablement renouveler les dispositions jusqu'à ce que le continent soit complètement libéré des bandits communistes.\nPourtant, alors même que se termine la deuxième phase de la §Rguerre civile chinoise§!, les spectres du passé reviennent. Les £budget_rich  §ccentres urbains§! sont en proie à l'agitation des intellectuels, des commerçants et des §Rsympathisants communistes§!, éloignant la population du gouvernement. Pire encore, les £population_texticon  §Opaysans§! deviennent de plus en plus §Oinsatisfaits§! de la domination des propriétaires fonciers, tandis que le [CHI.GetFlag] §gKuomintang§! reste lui-même paralysé, §gdivisé§! entre factions amères.\n\n --------------\n\n§gEffets de l'instabilité du groupe [CHI.GetFlag] :§!\n\nGain de pouvoir politique : [?ROOT.crisis_factor_party_neg|%0R]\nVitesse de construction : [?ROOT.crisis_factor_party_neg|%0R]\n\n§cEffets de l'instabilité urbaine £budget_rich :§!\n\nSortie d'usine : [?ROOT.crisis_factor_urban_neg|%0R]\nVitesse de recherche : [?ROOT.crisis_factor_urban_neg|%0R]\n\n§OEffets de l'instabilité rurale £population_texticon :§!\n\nFacteur d'offre : [?ROOT.crisis_factor_rural_neg|%0R]\nGain de soutien de guerre hebdomadaire : [?ROOT.crisis_factor_rural_neg|%0R]\n"
 
 End_the_Crisis:0 "Mettre fin à l'instabilité politique"
 End_the_Crisis_desc:0 "L'ordre a été rétabli. Les menaces immédiates contre la stabilité de l'État ont été neutralisées et les mesures d'urgence peuvent désormais être atténuées. La République est à nouveau en sécurité."
 
 Expand_The_Garrison_Command:0 "Développez le commandement de la garnison"
 Expand_The_Garrison_Command_desc:0 "Le commandement de la garnison est le bouclier de l'État. Nous devons étendre sa juridiction et son financement pour éradiquer la subversion, arrêter les traîtres présumés et appliquer la loi martiale avec une efficacité absolue."
 
 Purge_Universities:0 "Purger les universités"
 Purge_Universities_desc:0 "Nos écoles sont devenues des foyers de pensée radicale et de sympathie marxiste. Nous devons nettoyer le corps enseignant et étudiant de ces éléments dangereux pour garantir que la prochaine génération reste fidèle aux Trois Principes."
 
 Enforce_Mandarin_Only_Education:0 "Encourager l'enseignement du mandarin"
 Enforce_Mandarin_Only_Education_desc:0 "Une langue divisée conduit à une nation divisée. Nous appliquerons strictement le mandarin comme seule langue d'enseignement, pénalisant l'utilisation des dialectes locaux pour forger une identité nationale unifiée."
 
 Subsidize_Urban_State_Enterprises:0 "Subventionner les entreprises publiques urbaines"
 Subsidize_Urban_State_Enterprises_desc:0 "La main-d'oeuvre urbaine est agitée. En injectant du capital d'État dans des industries clés, nous pouvons garantir l'emploi et acheter la loyauté du prolétariat, le gardant ainsi hors de portée des agitateurs communistes."
 
 Enforce_375_Rent_Cap:0 "Appliquer le plafond de loyer de 37,5 %"
 Enforce_375_Rent_Cap_desc:0 "Les métayers sont écrasés par des loyers exorbitants. En plafonnant légalement les loyers agricoles à 37,5 % du rendement de la culture principale, nous allégerons leur fardeau et réduirons l'attrait des communistes dans les campagnes."
 
 Compensation_Landlords_with_Japanese_Assets:0 "Utiliser les actifs japonais pour indemniser les propriétaires"
 Compensation_Landlords_with_Japanese_Assets_desc:0 "Pour éviter une révolte de la noblesse terrienne pendant la réforme agraire, nous les compenserons pour les terres perdues par des actions dans des sociétés industrielles saisies aux occupants japonais vaincus."
 
 Land_to_The_Tiller:0 "Atterrir au Tiller"
 Land_to_The_Tiller_desc:0 "La solution finale à la crise agraire. L'État achètera obligatoirement les terres excédentaires aux propriétaires et les revendra aux locataires actuels, créant ainsi une nouvelle classe de propriétaires-agriculteurs fidèles et investis dans la survie de la République."
 
 Deploy_Rural_Pacification_Squads:0 "Déployer des escouades de pacification rurale"
 Deploy_Rural_Pacification_Squads_desc:0 "Les mots seuls n'arrêteront pas les bandits. Nous devons déployer des escouades armées de pacification pour parcourir les provinces, rétablir l'ordre dans les villages et rappeler aux seigneurs de la guerre que la volonté de Nanjing est absolue."
 
 Reform_CC_Clique:0 "Réformer la CC-Clique"
 Reform_CC_Clique_desc:0 "Le « Central Club » est devenu trop puissant, dirigeant le parti comme son fief personnel. Nous devons démanteler leurs réseaux indépendants et placer leurs vastes ressources sous le contrôle direct du président du Parti."
 
 Expand_Yangmingshan_Institute:0 "Agrandir l'Institut Yangmingshan"
 Expand_Yangmingshan_Institute_desc:0 "L'Institut de recherche sur les pratiques révolutionnaires de Yangmingshan est la forge de notre nouvelle élite. Nous élargirons son nombre pour former des milliers de cadres disciplinés à la véritable idéologie du Parti."
 
 Conduct_Ideological_Re_Registration:0 "Effectuer un réenregistrement idéologique"
 Conduct_Ideological_Re_Registration_desc:0 "Nous ne pouvons pas tolérer la passivité. Chaque membre du parti doit se soumettre à un processus rigoureux d'examen et de réinscription. Ceux qui sont jugés corrompus ou hésitants sur le plan idéologique seront immédiatement expulsés du Kuomintang."
 
 Communist_Activities_Urban:0 "Activités communistes urbaines"
 Communist_Activities_Urban_desc:0 "Des agitateurs et des cellules dormantes sont actives dans nos centres industriels, organisant des grèves et semant le défaitisme dans les universités. Si rien n'est fait, les villes deviendront un terrain fertile pour l'insurrection."
 
 Peasant_Rebellions_Rural:0 "Révoltes paysannes rurales"
 Peasant_Rebellions_Rural_desc:0 "Les campagnes sont en révolte ouverte. Le banditisme, alimenté par les promesses communistes de terres, menace notre approvisionnement alimentaire et nos lignes logistiques. Les magistrats locaux perdent le contrôle des villages."
 
 Party_Factionalism:0 "Luttes internes au Kuomintang"
 Party_Factionalism_desc:0 "Le Parti se déchire. Les cliques rivales donnent la priorité à leur propre pouvoir plutôt qu'à la survie de la nation, paralysant le gouvernement central par la corruption et l'impasse bureaucratique."
 
 Chinese_Faction_Decisions_desc:0 "\n\n\n\n\n\n£CHI_Texticon_Warlords\n\n\n\n\n\n\n\nDepuis la mort de Yuan Shikai en 1916, la Chine est en proie à des cliques de seigneurs de guerre, qui ont établi le contrôle de plusieurs provinces chinoises grâce à leurs armées locales. Bien que le Kuomintang ait vaincu les seigneurs de guerre de Beiyang en 1928, plusieurs seigneurs de guerre ont continué à maintenir leur influence, ce qui cause encore aujourd'hui des problèmes à l'administration du Kuomintang.\n"
