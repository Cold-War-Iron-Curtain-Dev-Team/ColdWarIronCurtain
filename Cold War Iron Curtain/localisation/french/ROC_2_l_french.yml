 Overseas_chinese_community_affairs_council_desc:0 ""
 consolidate_connections_with_southeastasia_chinese:0 "Consolider les liens avec les Chinois d'Asie du Sud-Est"
 consolidate_connections_with_southeastasia_chinese_desc:0 ""
 consolidate_connections_with_north_american_chinese:0 "Consolider les liens avec les Chinois d'Amérique du Nord"
 consolidate_connections_with_north_american_chinese_desc:0 ""
 reverse_the_brain_drain:0 "Inverser la fuite des cerveaux"
 reverse_the_brain_drain_desc:0 ""
 status_of_japanese_military_advisors:0 "Statut des conseillers militaires japonais"
 status_of_japanese_military_advisors_desc:0 ""
 diplomatic_report_RAJ:0 "Position diplomatique sur l'Inde"
 diplomatic_report_RAJ_desc:0 ""
 diplomatic_report_JAP:0 "Nos relations avec le Japon"
 diplomatic_report_JAP_desc:0 ""
 diplomatic_report_SEA:0 "Mission en Asie du Sud-Est maritime"
 diplomatic_report_SEA_Desc:0 ""
 cooperation_with_SEATO:0 "Coopérer avec l'OTASE"
 cooperation_with_SEATO_desc:0 "L'Alliance SEATO nouvellement formée par les États-Unis aux côtés des nations anticommunistes d'Asie permet à ces pays de résister à la propagation du communisme, même s'ils ne sont pas directement membres de l'alliance en tant que membres. Pour le moment, nous coopérerons avec l'alliance SEATO et, en échange, nous bénéficierons de la protection des non-membres de l'alliance elle-même."
 request_for_better_treatment_of_chinese_in_thailand:0 "Demander l'égalité pour les citoyens chinois au Vietnam"
 request_for_better_treatment_of_chinese_in_thailand_desc:0 ""
 define_nationality_law_of_the_ROC:0 "Loi sur la nationalité de la République de Chine"
 define_nationality_law_of_the_ROC_desc:0 ""
 New_Dual_Nationality_Law:0 "Nouvelle loi sur la double nationalité"
 New_Dual_Nationality_Law_desc:0 ""
 education_reform_category:0 "Réformes éducatives"
 education_reform_category_desc:0 "\n\n\n\n\n\n£CHI_Texticon_Education\n\n\n\n\n\n\n\nMême si les campagnes militaires ont sécurisé nos frontières, la fragmentation et les déficits éducatifs internes de la République restent une vulnérabilité critique. Pour assurer l'avenir de la République, le ministère de l'Éducation a ratifié le « Plan de relance nationale par l'éducation ». Le mandarin doit être la langue d'enseignement dominante pour combler le fossé entre les provinces et démanteler les factions régionales. De plus, les ressources seront transférées des arts libéraux vers les sciences appliquées et l'ingénierie, garantissant ainsi que nous disposons d'une base industrielle à la hauteur de nos concurrents. Enfin, l'instruction militaire et les Trois principes du peuple deviendront des matières obligatoires, garantissant que chaque diplômé comprend son devoir envers l'État.\n"
 centralize_control_of_schools:0 "Centraliser le contrôle des établissements universitaires"
 centralize_control_of_schools_desc:0 "En raison des périodes de turbulences, nous n'avons pas été en mesure de réglementer les écoles du pays ni de remédier à l'analphabétisme. Maintenant que nous disposons d'au moins une décennie de paix, nous allons détourner les efforts visant à centraliser le contrôle des écoles, depuis les écoles primaires jusqu'aux universités ; après cela, nous déciderons de ce qui reste à l'ordre du jour."
 private_schooling_in_china:0 "L'école privée en Chine"
 private_schooling_in_china_desc:0 "L'école privée est à la fois un obstacle et une forme d'apaisement pour les élites du pays. Nous déciderons de ce que nous ferons de l'enseignement privé."
 compulsory_education_in_china:0 "Enseignement primaire obligatoire en Chine"
 compulsory_education_in_china_desc:0 "Pour réussir pleinement nos campagnes d'alphabétisation, nous devons imposer l'enseignement obligatoire dans le pays afin que chacun reçoive une éducation d'une manière ou d'une autre. Cependant, il pourrait s'avérer coûteux pour le gouvernement de subventionner l'éducation de familles moins aisées, ce qui représente une somme énorme compte tenu de l'immense population de la Chine."
 sanminzhuyi_course:0 "Cours sur les trois principes du peuple"
 sanminzhuyi_course_desc:0 "Le cours a été introduit en 1944 sous le nom de « Principes du parti », pour permettre aux gens de comprendre les trois principes et l'histoire du Kuomintang. Il serait peut-être dans notre intérêt d'introduire ce cours à tous les niveaux d'enseignement."
 
 negotiate_over_hong_kong_desc:0 "Alors que le Royaume-Uni est occupé au Moyen-Orient, nous nous sommes réunis autour de l'opportunité historique de ramener Hong Kong dans la République. Mais nous devrions nous abstenir de recourir à la force et tenter une approche plus diplomatique."
 negotiate_over_hong_kong:0 "Négocier sur Hong Kong"
 
 take_hong_kong_by_force:0 "Prendre Hong Kong par la force"
 take_hong_kong_by_force_desc:0 "Alors que le Royaume-Uni est occupé au Moyen-Orient, nous nous sommes réunis autour de l'opportunité historique de ramener Hong Kong dans la République. Il faut frapper vite !"
 
 #National Spirits and Modifiers#

 #Mainland Ideas#

 KMT_Shanghai_Reforms_Nationwide:0 "Le modèle de Shanghai"
 KMT_Shanghai_Reforms_Nationwide_desc:0 ""

 CHI_land_reform_issue_1:0 "La question de la réforme agraire"
 CHI_land_reform_issue_1_desc:0 "La guerre civile chinoise et les campagnes de propagande du Parti communiste ont réaffirmé la pertinence de la réforme agraire en Chine. La majorité des citoyens chinois sont des paysans, et gagner leur soutien est crucial pour la survie de tout gouvernement chinois. Mais la principale question que se pose le Kuomintang est de savoir quelle sera l'intensité de cet engagement."

 CHI_land_reform_issue_2:0 "La question de la réforme agraire"
 CHI_land_reform_issue_2_desc:0 "La guerre civile chinoise et les campagnes de propagande du Parti communiste ont réaffirmé la pertinence de la réforme agraire en Chine. La majorité des citoyens chinois sont des paysans, et gagner leur soutien est crucial pour la survie de tout gouvernement chinois. Le Kuomintang a déjà pris diverses mesures en saisissant les terres des collaborateurs japonais ou des propriétaires fonciers peu coopératifs, mais d'autres mesures doivent être prises pour apaiser les paysans chinois."

 CHI_Economic_Cooperation:0 "Coopération économique chinoise"
 CHI_Economic_Cooperation_desc:0 "Le gouvernement du Kuomintang est ouvert aux investissements et à la coopération économique avec d'autres pays d'Asie apparus après la capitulation japonaise. Des délégations ont été envoyées dans divers pays d'Indochine et d'Asie du Sud-Est dans l'espoir d'établir des relations diplomatiques et économiques."

 National_Crisis_modifier:0 "État de la République"
 National_Crisis_modifier_desc:0 "Même avec notre victoire dans la guerre civile contre le Parti communiste, le soutien public au Kuomintang est au plus bas et divers dissidents politiques, y compris les restes communistes, les collaborateurs japonais et les sociaux-démocrates, constituent une menace pour le régime actuel. Ces problèmes doivent être abordés et traités avec soin par le gouvernement. Autrement, la loi et l'ordre pourraient ne jamais revenir en Chine."
 
 CHI_Autonomous_region_modifier:0 "Région autonome"
 CHI_Autonomous_region_modifier_desc:0 "Afin d'apaiser les minorités locales, le gouvernement a déclaré cette région comme province autonome, accordant ainsi de plus grands droits individuels et politiques aux minorités respectives et un certain degré de protection contre les mesures du gouvernement central."

 CHI_Disorganized_Kuomintang_1:0 "Le Kuomintang en pagaille"
 CHI_Disorganized_Kuomintang_1_desc:0 "Les années de guerre civile et le retrait chaotique du gouvernement central ont laissé le Parti dans un état de quasi-effondrement. Les luttes intestines entre la clique CC, la clique Whampoa et le groupe de science politique ont paralysé l'administration centrale. La corruption est endémique, les directives de Nanjing sont ignorées par les cadres locaux et l'esprit révolutionnaire de 1911 semble n'être qu'un lointain souvenir. Jusqu'à ce que le généralissime puisse purger les défaitistes et imposer une chaîne de commandement unique, le gouvernement restera un géant aux pieds d'argile."

 CHI_Disorganized_Kuomintang_2:0 "Le Kuomintang en pagaille"
 CHI_Disorganized_Kuomintang_2_desc:0 "Les années de guerre civile et le retrait chaotique du gouvernement central ont laissé le Parti dans un état de quasi-effondrement. Les luttes intestines entre la clique CC, la clique Whampoa et le groupe de science politique ont paralysé l'administration centrale. La corruption est endémique, les directives de Nanjing sont ignorées par les cadres locaux et l'esprit révolutionnaire de 1911 semble n'être qu'un lointain souvenir. Jusqu'à ce que le généralissime puisse purger les défaitistes et imposer une chaîne de commandement unique, le gouvernement restera un géant aux pieds d'argile."
 
 CHI_Disorganized_Kuomintang_3:0 "Le Kuomintang en pagaille"
 CHI_Disorganized_Kuomintang_3_desc:0 "Les années de guerre civile et le retrait chaotique du gouvernement central ont laissé le Parti dans un état de quasi-effondrement. Les luttes intestines entre la clique CC, la clique Whampoa et le groupe de science politique ont paralysé l'administration centrale. La corruption est endémique, les directives de Nanjing sont ignorées par les cadres locaux et l'esprit révolutionnaire de 1911 semble n'être qu'un lointain souvenir. Jusqu'à ce que le généralissime puisse purger les défaitistes et imposer une chaîne de commandement unique, le gouvernement restera un géant aux pieds d'argile."

 CHI_Disorganized_Kuomintang_4:0 "Le Kuomintang en pagaille"
 CHI_Disorganized_Kuomintang_4_desc:0 "Les années de guerre civile et le retrait chaotique du gouvernement central ont laissé le Parti dans un état de quasi-effondrement. Les luttes intestines entre la clique CC, la clique Whampoa et le groupe de science politique ont paralysé l'administration centrale. La corruption est endémique, les directives de Nanjing sont ignorées par les cadres locaux et l'esprit révolutionnaire de 1911 semble n'être qu'un lointain souvenir. Jusqu'à ce que le généralissime puisse purger les défaitistes et imposer une chaîne de commandement unique, le gouvernement restera un géant aux pieds d'argile."

 banditry_desc:0 "Le retrait de la principale force communiste vers le nord a laissé un vide de pouvoir dans les campagnes. Les déserteurs, les survivants des chefs de guerre locaux et les bandes criminelles opportunistes ont comblé le vide, terrorisant les villages et perturbant les lignes d'approvisionnement. S'ils n'ont pas la cohésion idéologique des Rouges, ces bandits rendent impossible une gouvernance efficace dans les provinces. Le mandat de l'État ne s'étend actuellement que jusqu'au champ de tir de la garnison la plus proche."
 banditry2_desc:0 "Le retrait de la principale force communiste vers le nord a laissé un vide de pouvoir dans les campagnes. Les déserteurs, les survivants des chefs de guerre locaux et les bandes criminelles opportunistes ont comblé le vide, terrorisant les villages et perturbant les lignes d'approvisionnement. S'ils n'ont pas la cohésion idéologique des Rouges, ces bandits rendent impossible une gouvernance efficace dans les provinces. Le mandat de l'État ne s'étend actuellement que jusqu'au champ de tir de la garnison la plus proche."
 
 CHI_Georgist_Taxation:0 "Fiscalité géorgiste"
 CHI_Georgist_Taxation_desc:0 ""

 KMT_land_reform_backlash_1:0 "Opposition massive des propriétaires"
 KMT_land_reform_backlash_1_desc:0 "En entendant les plans du gouvernement visant à lancer des réformes agraires par la redistribution des terres, de nombreux propriétaires influents ont commencé à contrarier nos efforts en matière de réformes agraires, bloquant nos réformes agraires et renonçant au soutien des propriétaires."
 KMT_land_reform_backlash_2:0 "Opposition mineure du propriétaire"
 KMT_land_reform_backlash_2_desc:0 "En entendant les projets du gouvernement visant à lancer des réformes agraires par la redistribution des terres, de nombreux propriétaires influents ont commencé à s'opposer à nos efforts en matière de réformes agraires, même si cette tendance s'est progressivement affaiblie à mesure que les réformes du gouvernement semblaient avoir été couronnées de succès et ont largement apaisé les propriétaires."

 CHI_Legacy_of_the_inadequate_US_Army_Structure_1:0 "Militaire désorganisé"
 CHI_Legacy_of_the_inadequate_US_Army_Structure_1_desc:0 "Les forces armées de la République de Chine se battent constamment depuis l'époque de l'Expédition du Nord. Depuis les campagnes d'encerclement, en passant par la guerre anti-japonaise jusqu'à la fin du conflit contre le Parti communiste chinois. La corruption et l'épuisement ont poussé nos militaires à bout, les laissant dans des conditions désastreuses. Si nous voulons rester concentrés sur notre objectif de réunification chinoise, nous devons alors réorganiser et réformer les forces armées de la République."
