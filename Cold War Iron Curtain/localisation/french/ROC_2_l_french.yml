 CHI_export_processing_zone_desc:0 "Dans la zone d'exportation de Kaohsiung, les fabricants peuvent importer des machines et des composants dans le cadre de dispositions douanières spéciales, puis expédier leurs produits finis à l'étranger. L'assemblage électronique offre des emplois aux travailleurs locaux et permet aux entreprises d'accéder aux commandes et aux méthodes de production étrangères."
 CHI_kaohsiung_export_zone:0 "Ouvrir la zone d'exportation de Kaohsiung"
 CHI_kaohsiung_export_zone_desc:0 "Réserver des sites d'usines viabilisés à Kaohsiung pour les fabricants produisant pour l'exportation. Des dispositions douanières spéciales et un accès au port contribueront à attirer les investissements dans l'industrie légère et l'assemblage électronique."
