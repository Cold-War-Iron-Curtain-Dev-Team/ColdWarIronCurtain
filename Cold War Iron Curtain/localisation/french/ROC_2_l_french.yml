 CHI_moved_gold_reserve_PRC:0 "Délocalisation des réserves d'or chinoises"
 CHI_moved_gold_reserve_PRC_desc:0 "Les cochons capitalistes ont volé les réserves d'or chinoises et les ont évacuées vers l'île de Taiwan ! Cela va fortement paralyser nos opérations industrielles pour les mois à venir."
 CHI_Peasant_revolts:0 "Grandes révoltes paysannes"
 CHI_Peasant_revolts_desc:0 "La majorité des paysans chinois en ont assez de la politique du Kuomintang. Le manque de réformes agraires et sociales a poussé la majorité des paysans soit à s'allier au Parti communiste, soit à se soulever contre le gouvernement nationaliste."
 CHI_Peasant_appeased:0 "Paysans apaisés"
 CHI_Peasant_appeased_desc:0 "Nous avons fait diverses promesses sociales et agricoles aux paysans pour obtenir leur soutien. Après le conflit, nous devons tenir nos promesses et mettre en oeuvre des réformes agraires pour répondre à leurs demandes."
