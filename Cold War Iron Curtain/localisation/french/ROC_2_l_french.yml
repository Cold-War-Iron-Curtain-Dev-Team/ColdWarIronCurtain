 Offer_Concessions_to_the_Qinghai_Ma_Clique:0 "Offrir des concessions à la clique §PMa§!"
 Chinese_faction_category:0 "Le Pacte de Nankin"
 Border_Conflict_PRC:0 "Provoquer un conflit frontalier avec le PCC"
 Border_Conflict_PRC_desc:0 "Si nous devions entrer en guerre contre le PCC, nous affronterions très probablement l'ensemble de l'Armée rouge de l'URSS. Nous ne sommes pas en mesure de combattre l'ensemble du Pacte de Varsovie pour le moment, mais nous pourrions provoquer un incident à la frontière pour tester les capacités actuelles de l'APL."
 Chinese_faction_category_desc:0 "Alors que l'ère de l'impérialisme et du colonialisme touche lentement à sa fin, le communisme reste une menace sérieuse pour l'Asie. Avec le soutien de l'Union soviétique, de nombreux pays ont établi des dictatures communistes et renforcé leurs capacités militaires. Si nous voulons arrêter la propagation du communisme en Asie de l'Est, nous devons établir une alliance militaire avec les États anticommunistes de la région et les aider à renforcer leur armée pour résister à toute invasion communiste."
 Escalate_war_PRC:0 "Commencez l'invasion de la Mandchourie"
 Escalate_war_PRC_desc:0 ""
 Negotiate_Ports:0 "Négocier avec les puissances occidentales"
 Negotiate_Ports_desc:0 "Même si nous avons adopté une position anti-impérialiste, nous pourrions peut-être adopter une approche pacifique et tenter de renégocier avec les Britanniques et les Portugais sur le statut de Macao et de Hong Kong. Après tout, leurs empires coloniaux commencent lentement à se désintégrer et, comme l'a montré la crise de Suez, l'URSS et les États-Unis n'interviendront pas en faveur du colonialisme."
 Red_Spear_Uprising:0 "Soulèvement de la Lance Rouge"
 End_the_Warlord_Period:0 "Mettre fin à la période des seigneurs de guerre"
 Vietnam_aggression1:0 "Envahir le Nord-Vietnam"
 Vietnam_limited_intervention:0 "Envoyer des volontaires au Sud-Vietnam"
 Vietnam_peaceful1:0 "Déclarer la neutralité envers le Vietnam"
 korea_aggression1:0 "Envahir la Corée du Nord"
 Korea_protection1:0 "Protéger la Corée du Sud"
 korea_neutrality1:0 "Déclarer la neutralité envers la Corée"
 Chiang_Ching_kuo_Infrastructure_projects_category:0 "Les huit grands projets de construction"
 Chiang_Ching_kuo_Infrastructure_projects_category_desc:0 "Proposés par le Premier ministre Chiang Ching-kuo, les huit grands projets de construction sont les projets d'infrastructure nationaux prévus dans les années 1970 en République de Chine. Le gouvernement estime que le pays manque toujours de services publics essentiels tels que les autoroutes, les ports maritimes, les aéroports et les centrales électriques. De plus, la Chine subit les effets importants de la crise pétrolière de 1973. Par conséquent, pour moderniser l'industrie et développer le pays, le gouvernement a prévu de lancer divers projets de construction de grande envergure."
 Build_CKS_Airport:0 "Construire l'aéroport international de Chiang Kai-shek à Chongqing"
 Build_Nanjing_Museum:0 "Construire le Musée commémoratif national à Nanjing"
 Build_petrochemical_plants:0 "Construire des usines pétrochimiques"
 Build_steel_mills:0 "Construire plus d'aciéries"
 Build_harbours:0 "Projets portuaires"
 Build_Streets_Water:0 "Investissements dans les infrastructures hydrauliques"
 Build_Railroads:0 "Développez les chemins de fer"
 Build_Infrastructure:0 "Infrastructure de base pour les régions sous-développées"
 Invite_Siam_Council:0 "Inviter la Thaïlande au Conseil de Nanjing"
 Invite_Phillipines_Council:0 "Inviter les Philippines au Conseil de Nanjing"
 Invite_Japan_Council:0 "Inviter le Japon au Conseil de Nanjing"
 Declare_Victory_over_Socialism_in_China:0 "Déclarez la victoire sur le socialisme en Asie"
 Sino_American_Relations_Taiwan_50s_category:0 "Relations sino-américaines"
 Sino_American_Relations_Taiwan_50s_category_desc:0 "Les États-Unis d'Amérique ont été notre plus proche allié dans la guerre contre le Japon, nous fournissant divers conseillers, équipements et technologies pour combattre l'armée japonaise. Après la chute de la partie continentale de la Chine et l'invasion de la Corée du Sud par le régime de Pyongyang, les États-Unis nous ont déclaré leur soutien dans notre lutte contre le communisme en Asie. Leur arsenal militaire profitera grandement à notre armée et jouera un rôle crucial dans la reconquête du continent chinois. Mais il serait judicieux de limiter l'impact politique qu'aura Washington..."
