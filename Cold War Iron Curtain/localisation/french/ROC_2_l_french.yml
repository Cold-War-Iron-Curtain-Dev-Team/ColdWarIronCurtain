 POLITICS_LI_ZONGREN_WARLORD_50s_DESC:0 "§gLi Zongren est né dans la province du Guangxi en 1890 et a déjà montré son engagement dans les institutions politiques et militaires au cours de ses premières années. En 1924, Li devient la figure de proue de la clique du Nouveau Guangxi et assiste le KMT lors de l'expédition du Nord. Cependant, cette alliance fut de courte durée puisqu'il fut expulsé du KMT et combattit Chiang Kai-shek lors de la guerre des plaines centrales de 1930.\n\nIl a finalement rejoint le KMT afin d'abroger l'invasion japonaise, mais a continué à s'opposer et à critiquer Chiang Kai-shek. En janvier 1949, après la démission de Chiang Kai-shek de son poste de président, Li Zongren est devenu président par intérim de la Chine. Cependant, il n'a jamais occupé de pouvoir significatif et a été démis de ses fonctions après que Chiang Kai-shek ait repris ses fonctions après la victoire du KMT dans la guerre civile chinoise.§!\n\n§CExplication des clics :§!\n\n§gLa clique du Nouveau Guangxi, dirigée par Li Zongren, Huang Shaohong et Bai Chongxi, est l'une des cliques de seigneurs de guerre les plus influentes de Chine et a toujours eu des relations difficiles avec le gouvernement central de Nanjing. Chiang Kai-Shek a tenté à plusieurs reprises de réorganiser les armées des seigneurs de guerre du Guangxi, ce qui a finalement amené la clique du Guangxi à rompre ses relations avec le gouvernement central, ce qui a déclenché la confrontation qui a conduit à la guerre des plaines centrales. De 1930 à 1936, la Clique organise la reconstruction du Guangxi, qui devient une province « modèle » dotée d'une administration progressiste. En conséquence, le Guangxi a pu fournir un grand nombre de troupes dans l'effort de guerre contre le Japon lors de la Seconde Guerre sino-japonaise, ce qui lui a conféré un grand statut parmi les provinces du sud de la Chine.§!"
 POLITICS_CHIANG_ARMY_ROC_VICTORY_50s_DESC:0 "§gAprès la victoire du Kuomintang sur le Parti communiste, l'autorité et le statut de Chiang Kai-shek au sein du parti furent une fois de plus renforcés, le laissant sans aucune opposition sérieuse à Nanjing. Cependant, il reste encore des obstacles à surmonter pour renforcer la domination du Kuomintang sur toute la Chine. Les seigneurs de guerre et diverses autres cliques politiques règnent sur une grande partie de la Chine, ce qui pourrait constituer une menace sérieuse pour la direction nationale de Nanjing. Chiang a exprimé son désir de réformer le Kuomintang à plusieurs reprises au fil des ans, et avec le retour progressif de la paix et de l'ordre civil en Chine, il pourrait être en mesure d'atteindre ses objectifs.§!\n\n§CExplication des clics :§!\n\n§gAprès la défaite des cliques Beiyang à Zhili et Nanjing, le Kuomintang a transféré son siège à Nanjing, la déclarant nouvelle capitale de la République. Au fil du temps, le Kuomintang assura son autorité dans les provinces de la Chine centrale. Le gouvernement de Nanjing est l'institution politique dominante dans ces provinces et a effectivement écarté tout autre rival politique, qu'il s'agisse d'anciens chefs de guerre locaux ou de cliques politiques opposées. La centralisation a conduit à moins de corruption et à une gouvernance plus efficace dans ces régions et sont considérées comme le « territoire central » du régime du Kuomintang, le KMT cherchant également à étendre son influence dans les autres régions de Chine.§!"
 POLITICS_SUN_DU_50s_WARLORDS_DESC:0 "§gVétéran de l'armée du Yunnan depuis 1915, le général Sun Du a gravi les échelons sous Tang Jiyao et a ensuite servi comme bras droit de Long Yun, gagnant en importance lors des campagnes anticommunistes de la Longue Marche. Au cours des dernières étapes de la guerre avec le Japon, Sun s'est éloigné des dirigeants régionaux pour s'aligner directement sur Chiang Kai-shek. Lorsque la guerre civile a pris fin et que d'autres généraux du Yunna ont fait défection, Sun est resté fidèle à la République et a ensuite été nommé gouverneur de sa province natale. Cependant, malgré son alignement sur Nanjing, son administration est fortement axée sur la préservation des intérêts régionaux traditionnels du Yunnan, à l'image de la gouvernance des seigneurs de guerre avant lui.§!\n\n§CExplication des clics :§!\n\n§gDéfini par son relief accidenté et montagneux et sa position frontalière avec l'Indochine française et la Birmanie, le Yunnan a longtemps maintenu une position très indépendante dans le paysage géopolitique chinois. En tant que bastion traditionnel des seigneurs de guerre régionaux et porte d'entrée vitale pour le commerce extérieur terrestre, la province présente des défis de gouvernance uniques pour Nanjing. Alors que le gouvernement central cherche à intégrer le Yunnan dans le cadre économique et défensif national, l'isolement géographique de la région et les réseaux militaires locaux profondément enracinés lui permettent de conserver un degré substantiel d'autonomie pratique sous l'ombre de la République.§!"
 POLITICS_DING_DELONG_50s_WARLORDS_DESC:0 "§gDing Delong est né dans la province du Hunan à la fin de la dynastie Qing. À l'âge de 20 ans, Ding s'est inscrit dans une académie militaire qui a ensuite fusionné pour devenir l'Académie militaire de Whampoa. En 1931, Ding rejoint la NRA et mène une campagne près du Hunan contre les seigneurs de guerre locaux et les forces communistes. Pendant la guerre avec le Japon, Ding a participé à des actions à Shanghai, dans la province du Henan et dans la ville de Wuhan. Au cours des dernières étapes de la guerre avec le Japon, Ding a été promu lieutenant-général et a mené des campagnes contre les partisans communistes du Hunan. Lorsque Cheng Qian et ses partisans ont choisi de faire défection au Parti communiste, Ding était l'un des rares habitants du Hunan à choisir de ne pas faire défection et a été nommé gouverneur de sa province natale après la fin de la guerre civile. Bien que sa loyauté envers Nankin puisse être remise en question, car il a montré qu'il ne se souciait que de sa maison.§!\n\n§CExplication des clics :§!\n\n§gHistoriquement connu comme le « bol de riz » de la Chine et berceau d'innombrables mouvements révolutionnaires, le Hunan occupe une position géopolitique vitale le long des couloirs centraux du Yangtsé. Son importance stratégique en fait régulièrement un champ de bataille entre ambitions régionalistes et autorité du gouvernement central. Suite à la restructuration d'après-guerre de la province et à la stabilisation de sa direction sous une administration militaire alignée sur le centre, le Hunan est passé d'une frontière instable d'intrigues factionnelles à un pilier fortement fortifié de la défense nationale, sécurisant le réseau logistique intérieur de la République.§!"
 POLITICS_PRINCE_DEM_WARLORD_50s_DESC:0 "§gDemchugdongrub, également connu sous son nom de courtoisie « Xixian », est né à Chahar dans la bannière blanche unie des huit bannières de Chahar pendant la dynastie Qing. Se liant souvent aux descendants du Grand Gengis Khan, Xixian entra en politique en 1929 lorsqu'il fut nommé membre du comité provincial de Chahar. En 1933, il tentait, aux côtés d'autres autonomistes pro-mongols et associés japonais, d'établir une entité politique intérieure-mongole autonome qui fut finalement autorisée par le gouvernement de Nanjing, malgré les premières inquiétudes. Alors qu'il se rangeait du côté des Japonais pendant la guerre de Résistance nationale, il fut finalement capturé par l'Armée rouge et amené en Mongolie extérieure, qui l'accueillit dans un premier temps. Avant d'être autorisé à être transféré dans une prison de Mongolie intérieure sous surveillance soviétique, il s'est rendu à Pékin pour consulter d'autres hommes politiques de Mongolie intérieure. Avant que cette expulsion puisse être poursuivie, les troupes nationalistes se sont emparées de Pékin et le prince a profité de cette opportunité pour échapper à sa détention. Sous l'ordre personnel de Chiang Kai-shek, Xixian a été épargné de l'exécution et mis au pouvoir dans les régions de Mongolie intérieure en réponse à la République socialiste de Mongolie intérieure soutenue par Moscou et dirigée par Oulanhou.§!\n\n§CExplication des clics :§!\n\n§gAprès l'invasion soviétique de la Mandchourie, les forces mongoles procommunistes ont établi un régime socialiste autonome à Xilin Gol tandis que le prince Demchudongrub a proclamé un gouvernement rival sous la supervision du Kuomintang à Suiyuan. Le régime bénéficie actuellement de privilèges d'autonomie plus importants, mais le gouvernement de Nanjing n'a pas oublié la trahison japonaise. Malgré cela, Xixian s'avère être un atout fidèle au Kuomintang et a montré qu'il est plus que disposé à répondre aux demandes de Nanjing si cela garantit sa survie. Il a autant besoin du Kuomintang que le Kuomintang a besoin de lui.§!"   
 POLITICS_TOKA_WARLORD_50s_DESC:0 "§gSalchak Toka, né Kalbakkhorekovich Toka dans une famille d'éleveurs touvans à la fin de l'ère Qing, est entré en politique après avoir étudié à l'Université communiste des travailleurs de l'Est de Moscou. S'alignant étroitement sur les intérêts soviétiques, Toka accéda au pouvoir en 1929 à la suite d'un coup d'État soutenu par les Soviétiques contre le Premier ministre touva Donduk Kuular. En 1932, aux côtés de cadres formés à Moscou et de conseillers soviétiques, il assura le contrôle de la République populaire de Touva en tant que secrétaire général de son parti au pouvoir. Tout en aidant l'Armée rouge pendant la Seconde Guerre mondiale, Toka a activement poussé à mettre fin à l'indépendance nominale de Touva, demandant aux dirigeants soviétiques une annexion totale. Autorisé par Moscou, il a évité les purges politiques et a été maintenu au pouvoir en tant que chef du Parti communiste régional de Touva.§!\n\n§CExplication des clics :§!\n\n§gAnnexée par la dynastie Qing en 1757 après la défaite du khanat de Dzoungar, Touva fut administrée par le biais de bannières indigènes sous le gouverneur militaire d'Uliastai jusqu'à ce que le déclin du pouvoir Qing permette à l'influence tsariste russe d'infiltrer la région à la fin du 19e siècle. Lorsque la dynastie Qing s'est effondrée pendant la révolution Xinhai de 1911, Touva s'est détachée et est devenue un protectorat tsariste en 1914. Bien que les forces chinoises aient brièvement réaffirmé leur contrôle militaire en 1919 pendant la guerre civile russe, les forces de l'Armée rouge soviétique les ont expulsées en 1921 pour établir la République populaire nominale de Touva. Sous la direction soviétique de Salchak Toka, Touva a été officiellement annexée à l'URSS en 1944, une décision que le Kuomintang a farouchement contestée en continuant à inclure Tannu Uriankhai sur les cartes officielles de la Chine jusqu'à aujourd'hui."
 
 POLITICS_WANG_LINGJI_50s_WARLORDS_DESC:0 "§gWang Lingji est né en 1883 dans le Sichuan dans une famille de marchands de soie. En 1903, il rejoint l'Académie militaire du Sichuan, puis part au Japon pour étudier à l'étranger. En 1906, il retourne en Chine et rejoint la nouvelle armée Qing Sichuan, servant au Tibet. Au départ, il était contre la révolution Xinhai, refusant d'aider les révolutionnaires. Allant jusqu'à aider les seigneurs de guerre pro-Yuan Beiyang pendant la guerre de protection nationale. Par la suite, il fut nommé commandant de la garnison de Yantai dans la province du Shandong. Vers 1921, il rejoint Yang Sen pour éliminer la première armée du Sichuan de Xiong Kewu. Bien que cela ait laissé une autre défaite, Wang est resté dans la province. Devenu plus tard général sous la clique de Chongqing de Liu Xiang. Après l'expédition du Nord et le massacre de Shanghai, Wang a fermement soutenu le gouvernement national et a utilisé ses armées sous Liu Xiang pour apaiser les guérilleros communistes. Nommé plus tard commandant en chef par intérim de la campagne de répression des bandits dans le Sichuan par Chiang. Pendant la guerre de Résistance de Huit Ans, la clique de Chongqing fut absorbée par le gouvernement central, avec elle les généraux de la clique. Pendant la guerre civile, il fut promu commandant de la septième zone de pacification, où il se consacra à la purge des membres du Parti communiste, devenant même temporairement président de la province du Sichuan. Plus tard, Wang et Yang Sen ; Les seigneurs de guerre de Chengdu étaient chacun responsables de l'arrestation de Liu Wenhui ; Seigneur de guerre de Xikang, Deng Xihou ; Seigneur de guerre de Leshan, Xiong Kewu ; Seigneur de guerre de Yucheng et autres sympathisants communistes du Sichuan. Après la guerre civile, la province de Xikang a été réintégrée au Sichuan avec la chute de Liu Wenhui. Wang fut ensuite nommé gouverneur du Sichuan après ses succès au Tibet. §!"
 POLITICS_MA_CHENGXIANG_50s_WARLORDS_DESC:0 "§gMa Chengxiang est né en 1914 à Gansu de Ma Qing, en tant que neveu de Ma Buqing et de Ma Bufang. Contrairement à ses proches, il a servi au sein de l'Armée centrale et a voué sa loyauté au Généralissime. Après que le corridor Hexi ait été réintégré au gouvernement central, il a succédé à Ma Buqing et a dirigé la Cinquième Armée de cavalerie. Bien qu'il n'ait pas vu beaucoup d'action pendant les guerres de résistance de huit ans, il a réprimé plusieurs soulèvements ouïghours pendant la rébellion d'Ili. Après les rébellions ouïghoures, il a été nommé commandant militaire de la garnison du Xinjiang. Pendant la guerre civile, il fut rappelé sur les lignes de front et montra sa détermination contre les forces communistes lors de la campagne du Ningxia, empêchant les provinces du Nord-Ouest de tomber entre les mains des communistes, ce qui accorda la confiance de Chiang à Ma Chengxiang. Après que la plupart des membres de la famille Ma aient été confiés au ministère des Affaires étrangères en tant que diplomates auprès de diverses nations islamiques, Chiang a personnellement nommé Ma Chengxiang gouverneur des trois provinces de Xibei.§!\n\n§CExplication des clics :§!\n\n§gLes familles Ma dirigent le nord-ouest de la Chine depuis l'abolition de la dynastie Qing. Il y a trois familles dans la Clique Ma, contrôlant les provinces du Gansu, du Qinhai et du Ningxia. Après l'expédition du Nord, les seigneurs de guerre Ma rejoignirent le Kuomintang et aidèrent le gouvernement nationaliste au Xinjiang, au Tibet et à Wuyuan. Les membres les plus éminents des familles comprennent Ma Bufang, ancien représentant de la Clique Ma, le général de cavalerie Ma Hongkui, Ma Buqing, Ma Hushan et Ma Hongbin. Alors que les tentatives passées de Chiang Kai-Shek pour déstabiliser la région ont échoué, la réorganisation du pays après la guerre civile a nommé Ma Chengxiang au poste de gouverneur, qui est plus que disposé à travailler plus étroitement avec le gouvernement central.§!"
 POLITICS_SONG_XILIAN_50s_WARLORDS_DESC:0 "§gSong Xilian est né en 1907 dans le Hunan dans une riche famille paysanne. En 1923, il fut admis dans la première classe de l'Académie militaire de Whampoa et devint le plus jeune diplômé de la 1ère classe. Après avoir obtenu son diplôme, il rejoint officiellement le Kuomintang et l'Armée nationale révolutionnaire. Il participe ensuite aux expéditions de l'Est et du Nord. Il a également contribué à réprimer les rébellions des seigneurs de guerre anti-Kuomintang au Yunnan et au Guangxi. Au cours des dernières étapes de l'expédition du Nord, il fut grièvement blessé, admis à l'hôpital et pris en position de réserve. Après sa sortie de l'hôpital, il se rend au Japon et étudie dans l'équipe d'étudiants chinois de l'école d'infanterie de l'armée de Chiba au Japon. Alors qu'il était au Japon, il a été arrêté pour avoir mené une manifestation contre les atrocités japonaises lors de l'incident du 3 mai, il a ensuite été libéré après des négociations entre la Chine et le Japon. Lorsque la guerre des plaines centrales a commencé, il a été rappelé en Chine et a dirigé une brigade pour défendre les régions autour de Nanjing lors de l'incident du 28 janvier. Il a ensuite été démis de ses fonctions et nommé commandant adjoint de la division pendant les campagnes d'encerclement. En 1934, il fut promu major général. Après l'incident de Xi'an, il fut nommé commandant de la garnison de Xi'an. Cependant, lorsque la guerre de Résistance de Huit Ans éclate, il est rappelé sur le front, participant aux batailles de Shanghai, Nanjing, Wuhan et Lanfeng. Il mène ensuite son armée contre les Japonais dans la campagne de Birmanie pour défendre la route de Birmanie. Il a ensuite été envoyé au Xinjiang pour réprimer les rébellions ouïghoures et les provocations mongoles. Pendant la guerre civile, il participa à la désastreuse campagne de Huaihai. Il a ensuite arrêté des sympathisants communistes dans le Hunan et a défendu avec succès la route Sichuan-Hunan, ce qui lui a valu la confiance de Chiang. Après la guerre civile, il fut nommé gouverneur du Hunan.§!"
 POLITICS_XU_YONGCHANG_50s_WARLORDS_DESC:0 "§gXu Yongchang est né en 1885 dans le Shanxi. Il est diplômé de l'Institut militaire de Pékin pendant la révolution Xinhai. Par la suite, en 1916, il avait rejoint la milice anti-Yuan Shikai du Shandong. En 1917, il devient membre de la clique du Zhili et nomme un instructeur pour le Zhili Officer Corp. Plus tard, en poste dans le Shaanxi, il sert sous les ordres du Guominjun de Feng Yuxiang avant de changer d'allégeance à l'armée Jin de Yan Xishan. Cependant, lorsque Yan a comploté pour renverser Chiang, Xu s'est opposé à cette décision. Il fut ensuite temporairement nommé gouverneur du Shanxi et du Suiyuan lorsque les forces anti-Chiang furent vaincues lors de la guerre des plaines centrales. Cependant, il a rendu à contrecoeur le poste de gouverneur à Yan. Après la capitulation du Japon, Xu a été envoyé pour représenter la Chine à bord de l'USS Missouri, ainsi que membre de l'Assemblée nationale pour la rédaction de la Constitution. Après la guerre civile, il devient conseiller principal de la présidence. Cependant, lorsque Yan a pris sa retraite, il a été reconduit dans ses fonctions de gouverneur de la province du Shanxi. Bien qu'il soit resté fidèle au gouvernement national, il a plaidé pour un processus de centralisation plus lent et pour permettre à la province de jouir temporairement d'un rôle semi-autonome.§!\n\n§CExplication des clics :§!\n\n§gLe Shanxi s'est séparé de l'armée de Beiyang après la révolution Xinhai sous la direction de Yan Xishan et a adopté une position neutre pour éviter de s'impliquer dans des conflits militaires. Le Shanxi a connu de grandes améliorations en matière d'éducation, de protection sociale et de soins de santé dans les années 1920 jusqu'à ce que Yan décide de rejoindre le KMT dans sa croisade contre la clique du Fengtian en 1927. Pendant l'occupation japonaise, la clique du Shanxi a été fortement affaiblie, ce qui a entraîné la brève occupation communiste de 1946 à 1949. Avec le retour du Kuomintang au pouvoir, on peut supposer que Nanjing cherche à intégrer correctement l'ancienne clique autonome dans la République.§!"
 POLITICS_LI_PINXIAN_50s_WARLORDS_DESC:0 "§gLi a rejoint la NRA en 1926 et a conduit ses troupes à occuper tout le Hunan et a contribué à la défaite de l'armée de Wu Peifu dans le Hubei lors de l'expédition du Nord. Après avoir rejoint la nouvelle clique du Guangxi en 1928 et un court exil à Hong Kong, Li fut finalement vaincu lors de la guerre des plaines centrales, mais continua ensuite à occuper des positions militaires importantes dans le Guangxi. Pendant la Seconde Guerre mondiale, il a été déployé à Shanghai, Xuzhou, Wuhan et Changsha, mais a continué à travailler contre le Parti communiste chinois en supprimant la nouvelle Quatrième Armée. Après la capitulation du Japon, Li est devenu membre du Comité exécutif central du Kuomintang et a brièvement exercé les fonctions de président du gouvernement provincial du Guangxi avant que Li Zongren ne revienne au Guangxi après sa démission.§!"

 POLITICS_YAN_XISHAN_WARLORD_50s_DESC:0 "§gNé dans la province du Shanxi en 1883, Yan Xishan a commencé très jeune à étudier les classiques confucéens et a finalement rejoint l'académie militaire de Taiyuan dans le Shanxi. Yan, aux côtés de divers autres jeunes talents prometteurs, a été envoyé étudier à Tokyo où il était fasciné par les efforts d'occidentalisation du Japon, estimant que la Chine devait prendre des mesures similaires pour ne pas prendre de retard sur la scène internationale. Après le déclenchement de la révolution Xinhai, il retourne en Chine et rejoint la lutte contre les Qing et consolide finalement son pouvoir en tant que gouverneur du Shanxi après la mort de Yuan Shikai. Pendant la Seconde Guerre mondiale, il a servi comme commandant dans le Shanxi contre les Japonais mais a secrètement intensifié ses opérations contre le mouvement communiste local. Après avoir joué un rôle de médiateur en tant que Premier ministre pendant la guerre civile, Yan a retrouvé son poste de gouverneur du Shanxi.§!\n\n§CExplication des clics :§!\n\n§gLe Shanxi s'est séparé de l'armée de Beiyang après la révolution Xinhai sous la direction de Yan Xishan et a adopté une position neutre pour éviter de s'impliquer dans des conflits militaires. Le Shanxi a connu de grandes améliorations en matière d'éducation, de protection sociale et de soins de santé dans les années 1920 jusqu'à ce que Yan décide de rejoindre le KMT dans sa croisade contre la clique du Fengtian en 1927. Pendant l'occupation japonaise, la clique du Shanxi a été fortement affaiblie, ce qui a entraîné la brève occupation communiste de 1946 à 1949. Avec le retour du Kuomintang au pouvoir, on peut supposer que Nanjing cherche à intégrer correctement l'ancienne clique autonome dans la République.§!"
 POLITICS_MA_BUFANG_WARLORD_50s_DESC:0 "§gMa Bufang est né en 1903 dans le Gansu en tant que fils de Ma Qi, fondateur de l'armée musulmane du Ningxia du Qinghai au lendemain de la révolution Xinhai. Ma s'est rangé du côté de Chiang Kai-shek et du Kuomintang après le succès de l'expédition du Nord. La position anticommuniste farouche de Ma et sa loyauté envers le Kuomintang ont été prouvées à plusieurs reprises, comme le montrent ses opérations militaires contre les communistes au début des années 1930 et le refus de plusieurs offres de défection japonaises. Sa loyauté inconditionnelle envers le Kuomintang, bien qu'il soit Hui, a fait de lui l'un des dignes de confiance personnels de Chiang Kai-shek. En 1945, Bufang a été nommé au comité central du parti Kuomintang, et il a combattu avec succès contre les Ouïghours révoltés en plus de combattre le Parti communiste chinois pendant la guerre civile chinoise.§!\n\n§CExplication des clics :§!\n\n§gLes familles Ma dirigent le nord-ouest de la Chine depuis l'abolition de la dynastie Qing. Il y a trois familles dans la Clique Ma, contrôlant les provinces du Gansu, du Qinhai et du Ningxia. Après l'expédition du Nord, les seigneurs de guerre Ma rejoignirent le Kuomintang et aidèrent le gouvernement nationaliste au Xinjiang, au Tibet et à Wuyuan. Les membres les plus éminents des familles comprennent Ma Bufang, l'actuel représentant de la Clique Ma, le général de cavalerie Ma Hongkui, Ma Buqing, Ma Hushan et Ma Hongbin. Les tentatives passées de déstabilisation de la région par Chiang Kai-Shek ont échoué et la relative absence de troupes japonaises et communistes dans le nord-ouest a permis à la région de conserver son autonomie par rapport à Nanjing.§!" 
 POLITICS_SUN_ZHEN_WARLORD_50s_DESC:0 "§gVers la fin de la Seconde Guerre mondiale, Sun Zhen fut nommé dans la province de Zhengzhou et y occupa son poste jusqu'en février 1948. Il fut redirigé vers la province de Xuzhou en tant qu'officier de répression des bandits avant d'être de nouveau muté en octobre 1948, lorsqu'il fut transféré dans la zone frontalière Sichuan-Hubei, et conserva sa carrière d'officier de pacification. Après février 1949, Sun est nommé commandant adjoint du QG de pacification de Chongqing et commandant du QG de pacification de Chuandong. Après la chute de Liu Wenhui, il fut choisi par le généralissime comme gouverneur militaire du Sichuan.§!\n\n§CExplication des clics :§!\n\n§gAprès la chute de la dynastie Qing, la région du Sichuan est devenue un territoire contesté, avec de nombreux seigneurs de guerre se battant pour le contrôle de la province pendant des décennies. La clique du Sichuan était divisée en petits groupes de seigneurs de guerre, ou zones de défense, séparés les uns des autres par des frontières militaires, politiques et économiques distinctes. En 1935, Liu Xiang consolida son règne à Chongqing mais mourut finalement seulement 3 ans plus tard. Cela a ouvert la porte au gouvernement central, qui avait alors été transféré à Chongqing, pour intégrer davantage la province dans la République. Cependant, la fin de la guerre anti-japonaise et la reprise de la guerre civile chinoise ont permis à son successeur Liu Wenhui de retrouver un certain degré d'autonomie, qui est toujours maintenue dans le Sichuan, même après l'arrestation de Liu Wenhui.§!"
 POLITICS_LI_MI_50s_WARLORDS_DESC:0 "§gLi Mi s'est fait un grand nom pendant la première phase de la guerre civile. Il a montré un grand succès en battant les unités de l'Armée rouge en retraite de He Long et Ye Ting, occupant les territoires que les communistes contrôlaient auparavant. Au début de la Seconde Guerre sino-japonaise, Li avait été promu colonel. Lorsque les Japonais se rendirent en 1945, Li Mi fut promu au grade de lieutenant général grâce à ses campagnes réussies contre les Japonais en Chine centrale et dans l'ouest du Yunnan. Il a à peine échappé à une mort certaine lorsque les troupes de l'APL étaient sur le point d'encercler ses unités dans le Henan et a reçu l'ordre de Chiang Kai-shek de défendre la province du Yunnan au début de 1949. Après la guerre, il est entré dans la politique locale du Yunnan et a finalement pris de l'importance grâce à ses bonnes relations avec le généralissime et à la chute de l'ancien gouverneur Sun Du.§!\n\n§CExplication des clics :§!\n\n§gDéfini par son relief accidenté et montagneux et sa position frontalière avec l'Indochine française et la Birmanie, le Yunnan a longtemps maintenu une position très indépendante dans le paysage géopolitique chinois. En tant que bastion traditionnel des seigneurs de guerre régionaux et porte d'entrée vitale pour le commerce extérieur terrestre, la province présente des défis de gouvernance uniques pour Nanjing. Alors que Sun Du a été contraint de quitter la politique locale, le gouvernement central a intégré davantage le Yunnan dans le cadre économique et défensif national.§!"
 POLITICS_CHIA_CHING_TEH_50s_WARLORDS_desc:0 "§gChia est né à Qinshui, province du Shanxi, où il est devenu premier secrétaire du gouverneur du Shanxi en 1912. Après avoir occupé un poste dans la persécution civile, la police et les affaires politiques, il a été intégré à la structure de l'Armée nationale révolutionnaire suite à l'alignement du Shanxi avec le gouvernement du Kuomintang. Il entre dans la politique nationale dans les années 1940 lorsqu'il est nommé conseiller du Yuan exécutif et travaille au ministère de l'Harmonie jusqu'en 1948. Il est nommé vice-premier ministre de la République en 1949, avant de revenir à la politique du Shanxi après la fin de la guerre civile. Maintenant, il a succédé à Yan Xishan en tant que gouverneur du Shanxi, dans l'espoir d'améliorer la province encore plus que Yan ne l'avait fait pendant sa gouvernance.§!"

 POLITICS_WANG_MING_WARLORD_50s_DESC:0 "§gWang Ming faisait partie des 28 bolcheviks envoyés en Chine par le Komintern pour prendre la direction du Parti communiste chinois en 1929. Cependant, ils rencontrèrent une forte résistance au sein du PCC de la part de membres tels que Zhang Guotao et Zhou Enlai. Sans surprise, ils se sont vu attribuer des postes insignifiants. Au cours des années 1930, il est devenu l'un des principaux rivaux politiques de Mao Zedong au sein du PCC, embrassant l'idéologie marxiste-léniniste traditionnelle contrairement aux croyances de Mao. En 1937, il persuada Mao de s'allier à Chiang Kai-shek face à l'agression japonaise. Pendant la guerre, il a continué à critiquer la politique de Mao envers le Japon et le Kuomintang. Malgré une maladie croissante, Wang est resté le plus grand critique de Mao et le candidat préféré de Moscou, ce qui lui a finalement permis de renverser Mao en tant que président du PCC après la défaite désastreuse de la guerre civile chinoise.§!\n\n§CExplication des clics :§!\n\n§gAprès 14 années d'occupation japonaise, la Mandchourie est finalement revenue à la Chine. Cependant, la transition a été tout sauf fluide. La force d'occupation soviétique a violé le traité sino-soviétique de 1945 en remettant la Mandchourie au Parti communiste chinois au lieu du Kuomintang, donnant ainsi aux communistes de Mao Zedong une nouvelle base d'opérations contre le gouvernement de Nanjing. Avec l'encouragement de l'Union soviétique, la région fut utilisée comme base de rassemblement pendant la guerre civile pour les communistes chinois, qui furent presque victorieux en 1949 contre le Kuomintang. Lorsque les forces du généralissime Tchang Kaï-chek atteignirent Pékin et détruisirent presque l'Armée populaire de libération, l'Union soviétique entra de nouveau en Mandchourie et établit un État fantoche soviétique sous l'administration des restes du Parti communiste chinois, laissant pour l'instant la Mandchourie aux mains des Soviétiques.§!" 
 POLITICS_Yumjaagiin_Tsedenbal_WARLORD_50s_DESC:0 "§gYumjaagiin Tsedenbal faisait partie des rares Mongols talentueux sélectionnés pour étudier en Union soviétique dans les années 1920. Il est diplômé de l'Institut des Finances et de l'Économie d'Irkoutsk en 1938 et attire l'attention du Comité central du Parti communiste soviétique lors d'un voyage à Moscou. Il est retourné en Mongolie et a rejoint le Parti révolutionnaire du peuple mongol en 1939 et a été ministre des Finances de la Mongolie pendant une brève période. En 1940, à 24 ans, Tsedenbal est élu membre du Comité central, membre du Présidium et secrétaire général du dixième congrès du MPRP, devenant ainsi le deuxième dirigeant du pays. Après la mort de Khorloogiin Choibalsan en janvier 1952 et une courte lutte pour le pouvoir au sein du parti, Tsedenbal fut nommé président du Conseil des ministres en mai 1952.§!\n\n§CExplication des clics :§!\n\n§gLa Mongolie a déclaré son indépendance après la chute de la dynastie Qing. Malgré l'occupation de la Mongolie par les forces chinoises dirigées par Xu Shuzheng en 1919, l'ancien général russe blanc, le baron Ungern, a conduit ses troupes en Mongolie en 1920, battant les forces d'occupation chinoises. Après la victoire de l'Armée rouge dans la guerre civile russe et la mort de Bogd Khaan, la République populaire mongole fut créée. La Mongolie a connu la collectivisation du bétail, la destruction des monastères bouddhistes et les purges staliniennes sous la direction de Khorloogiin Choibalsan. Afin d'obtenir l'assistance soviétique dans la guerre du Pacifique, les Alliés occidentaux ont accordé qu'après la guerre, la Mongolie extérieure conserverait son indépendance lors de la conférence de Yalta en 1945. Un référendum a eu lieu le 20 octobre 1945, avec 100 % de l'électorat votant pour l'indépendance.§!" 
 POLITICS_QASIM_WARLORD_50s_DESC:0 "§gEhmetjan Qasim succède à Eilhan Tore à la présidence de la Deuxième République du Turkestan oriental en 1946. Il est le candidat favori du Parti communiste de l'Union soviétique en raison de sa formation passée à l'Université communiste des travailleurs de l'Est à Moscou. Pendant la guerre civile chinoise, Qasim a tenté de négocier avec l'administration locale du Kuomintang sur l'avenir de l'ETR en République de Chine, mais ces plans ont finalement été abandonnés par l'Union soviétique après la conquête de Nanjing par les communistes chinois. Malgré la victoire nationaliste, Qasim s'est aligné sur Moscou et contrôle désormais tout le Xinjiang.§!\n\n§CExplication des clics :§!\n\n§gLa République du Turkestan oriental a été fondée en 1944 à la suite de la rébellion d'Ili dans la province du Xinjiang. Avec l'aide soviétique, une nouvelle République fut déclarée après que les rebelles turcs eurent pris Yining au Kuomintang. En juin 1946, le gouvernement central chinois du Kuomintang parvint à un accord négocié avec les dirigeants de l'ETR, formant un gouvernement de coalition qui finira par s'effondrer en août 1947. Les trois districts restèrent une zone pro-soviétique distincte jusqu'à ce que l'Armée rouge entre dans le Xinjiang après l'effondrement de l'Armée populaire de libération en Chine centrale. Le Xinjiang reste pour l'instant sous influence soviétique, mais on ne sait pas pour combien de temps.§!" 
 POLITICS_MAO_ZEDONG_WARLORD_50s_DESC:0 "§gAprès sa défaite écrasante lors de la deuxième étape de la guerre civile chinoise, le président Mao a été soumis à une immense pression de la part de ses rivaux du Parti communiste. Il est tenu pour responsable du désastre et de l'échec à retirer la Chine de l'administration du Kuomintang et sa position au sein du Parti communiste est sérieusement menacée.§!\n\n§CExplication des clics :§!\n\n§gAprès 14 années d'occupation japonaise, la Mandchourie est finalement revenue à la Chine. Cependant, la transition a été tout sauf fluide. La force d'occupation soviétique a violé le traité sino-soviétique de 1945 en remettant la Mandchourie au Parti communiste chinois au lieu du Kuomintang, donnant ainsi aux communistes de Mao Zedong une nouvelle base d'opérations contre le gouvernement de Nanjing. Avec l'encouragement de l'Union soviétique, la région fut utilisée comme base de rassemblement pendant la guerre civile pour les communistes chinois, qui furent presque victorieux en 1949 contre le Kuomintang. Lorsque les forces du généralissime Tchang Kaï-chek atteignirent Pékin et détruisirent presque l'Armée populaire de libération, l'Union soviétique entra de nouveau en Mandchourie et établit un État fantoche soviétique sous l'administration des restes du Parti communiste chinois, laissant pour l'instant la Mandchourie aux mains des Soviétiques.§!" 
 POLITICS_MAO_ZEDONG_WARLORD_50s_RETURNED_DESC:0 "§gAprès sa défaite écrasante lors de la deuxième étape de la guerre civile chinoise, le président Mao a été soumis à une immense pression de la part de ses rivaux du Parti communiste. Il a finalement été démis du pouvoir et contraint à une retraite anticipée par le cercle de Wang Ming. Cependant, les partisans maoïstes restants au sein de l'APL ont mis Pékin sous confinement et réinstallé Mao à la présidence du PCC. Mao est de nouveau au pouvoir et va probablement purger l'ancienne administration et cherche une nouvelle opportunité d'unifier la Chine sous la bannière rouge.§!\n\n§CExplication des clics :§!\n\n§gAprès 14 années d'occupation japonaise, la Mandchourie est finalement revenue à la Chine. Cependant, la transition a été tout sauf fluide. La force d'occupation soviétique a violé le traité sino-soviétique de 1945 en remettant la Mandchourie au Parti communiste chinois au lieu du Kuomintang, donnant ainsi aux communistes de Mao Zedong une nouvelle base d'opérations contre le gouvernement de Nanjing. Avec l'encouragement de l'Union soviétique, la région fut utilisée comme base de rassemblement pendant la guerre civile pour les communistes chinois, qui furent presque victorieux en 1949 contre le Kuomintang. Lorsque les forces du généralissime Tchang Kaï-chek atteignirent Pékin et détruisirent presque l'Armée populaire de libération, l'Union soviétique entra de nouveau en Mandchourie et établit un État fantoche soviétique sous l'administration des restes du Parti communiste chinois, laissant pour l'instant la Mandchourie aux mains des Soviétiques.§!" 
