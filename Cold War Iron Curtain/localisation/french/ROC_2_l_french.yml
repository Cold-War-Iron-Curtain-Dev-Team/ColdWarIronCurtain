 text_help_title_loc:0 "Explication de l'interface graphique"
 text_help_loc:0 "§gCette interface graphique personnalisée vous donne des informations cruciales sur l'état actuel de la Chine. Il affiche toutes les régions concernées de la Chine, y compris le territoire qui est actuellement sous le contrôle du Kuomintang, ainsi que les régions§! §Gindépendantes§! §gcomme le Tibet et les§! §Rrégions§! §galignées sur les Soviétiques comme la Mandchourie, la Mongolie et le Xinjiang. Alors que la majeure partie de la Chine centrale est sous§! §BContrôle principal du KMT§!, §g, les régions restantes sont dominées par§! §CCliques de seigneurs de guerre locaux§!, §gqui ont pris le pouvoir à la suite de la guerre civile. Ces Cliques partagent une grande autonomie au sein de la République, qui est représentée via des modificateurs locaux, donnant§! §Rdebuffs au recrutement et à la construction§!. §gCes cliques pourront éventuellement être intégrées dans la structure administrative de base de la République, étant donné que leur loyauté envers le gouvernement central est suffisamment élevée. Les modifications apportées à la fidélité peuvent être apportées via§! §YObjectifs et décisions nationaux§!. §gSi la loyauté de la clique tombe au-delà d'un certain point, cela provoquera de grands conflits politiques internes et constituera une menace pour la stabilité et le soutien de guerre.§!" 
 
