 CHI_Inflation_small:0 "Hyper-inflation"
 CHI_Inflation_small_desc:0 "L'hyperinflation qui a suivi la fin de la Seconde Guerre mondiale était le résultat du travail incessant des machines à imprimer de l'argent nationalistes pour financer les dépenses de guerre. Au Japon, la contrefaçon, le trafic d'argent et la spéculation ont encore aggravé la situation, provoquant une montée en flèche des prix et l'effondrement de notre économie."
 CHI_Inflation_small2:0 "Crise inflationniste"
 CHI_Inflation_small2_desc:0 "Même si elle n'est pas aussi terrible qu'il y a quelques années, l'inflation reste un problème sérieux, les prix étant déraisonnablement élevés et les puissances étrangères n'étant pas convaincues de se lancer dans le commerce et l'investissement. Nous devons poursuivre les réformes et les mesures visant à ramener l'inflation à un minimum"
