 CHI_Warlord_Armies:0 "Armées de seigneurs de guerre"
 CHI_Warlord_Armies_desc:0 "Même après la chute des seigneurs de guerre de Beiyang, de nombreuses personnalités chinoises ont maintenu leur emprise sur l'administration locale et leurs forces armées. Aujourd'hui encore, les chefs de guerre et les commandants partagent une grande influence sur nos forces, selon qu'ils soient originaires de Nanjing, du Guangxi, du Yunnan ou du Shanxi. Ce manque de contrôle central crée le chaos au sein de la Commission des affaires militaires, et les ordres de Chiang Kai-shek ne sont pas toujours suivis lorsqu'ils devraient l'être."
 CHI_Warlord_Armies_2:0 "Armées de seigneurs de guerre"
 CHI_Warlord_Armies_2_desc:0 "Même après la chute des seigneurs de guerre de Beiyang, de nombreuses personnalités chinoises ont maintenu leur emprise sur l'administration locale et leurs forces armées. Aujourd'hui encore, les chefs de guerre et les commandants partagent une grande influence sur nos forces, selon qu'ils soient originaires de Nanjing, du Guangxi, du Yunnan ou du Shanxi. Ce manque de contrôle central crée le chaos au sein de la Commission des affaires militaires, et les ordres de Chiang Kai-shek ne sont pas toujours suivis lorsqu'ils devraient l'être."
