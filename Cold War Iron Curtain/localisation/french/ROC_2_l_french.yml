##Leader Descriptions#


 POLITICS_SUN_LI_JEN_DESC:0 "§gSun Li-jen est née à Jinnu, Anhui. Il a brièvement effectué un stage à la Chicago Bridge & Iron Company à Chicago, dans l'Illinois. Mais le patriotisme l'a motivé à changer de carrière et à poursuivre des études militaires. Sun a décidé qu'il pourrait mieux servir sa nation divisée en tant que soldat plutôt qu'ingénieur. En 1927, il retourna en Chine et devint caporal dans l'Armée nationale révolutionnaire, stationnée à Duyun, Guizhou. Il était surtout connu pour son leadership dans la Seconde Guerre sino-japonaise et la Guerre civile chinoise. Ses exploits militaires lui valent le surnom élogieux de « Rommel de l'Est ». Avec l'aide de la CIA, Sun Li-jen a désormais consolidé son pouvoir en République de Chine et envisage de réformer le parti, d'abolir la structure de commandement léniniste et de lutter contre la corruption.§!"
 POLITICS_CHIANG_DESC:0 "§YDirecteur général du Kuomintang, général de classe spéciale des forces armées de la République de Chine §!\n§gChiang Kai-shek, né en 1887 à Fenghua, dans la province du Zhejiang, dans une modeste famille de marchands de sel, poursuit d'abord une carrière militaire au Japon avant de retourner en Chine lors de la révolution Xinhai. Il mena des campagnes contre la dynastie Qing et chercha plus tard refuge au Japon sous le règne de Yuan Shikai. À son retour, il noue des liens avec la pègre de Shanghai avant de retrouver son mentor Sun Yat-sen à Canton. Chiang s'est ensuite rendu en Union soviétique pour étudier les méthodes politiques et militaires du Parti communiste soviétique. Après la mort de Sun, il s'empare de la direction du KMT grâce à un coup d'État contre Wang Jingwei et lance l'Expédition du Nord pour unifier la Chine sous la bannière du Kuomintang. Sa tentative de purge du Parti communiste à Shanghai a déclenché une guerre civile entre le Kuomintang et le Parti communiste chinois. Malgré des tentatives répétées pour l'évincer, Chiang a conservé le pouvoir grâce à des manoeuvres diplomatiques et des manigances détournées. Ses efforts pour éradiquer les communistes échouèrent lorsqu'il fut kidnappé par Zhang Xueliang en 1936, ce qui conduisit à une trêve, connue sous le nom de Deuxième Front uni chinois. Après des années de guerre contre les Japonais, la popularité de Chiang, ainsi que la réputation du Kuomintang, ont décliné. Il reprit le conflit avec le Parti communiste en 1946, refusant les négociations avec Mao, ce qui replongea la Chine dans la guerre.§!"
 POLITICS_ZONGREN_DESC:0 "§YPrésident de la République de Chine, commandant de l'armée de l'acier §!\n§gNé dans la province du Guangxi en 1890, Li rejoignit Tongmenghui, le parti révolutionnaire de Sun Yat-sen, en 1910, mais ne comprenait guère les objectifs plus larges de Sun en matière de réforme et de réunification nationale. En 1924, il devient chef de la clique du Guangxi et, en 1926, il aide le KMT lors de son expédition dans le Nord. Cette alliance fut cependant de courte durée puisqu'il fut expulsé du KMT en 1929.\n\nEn 1937, il retrouva cependant le KMT pour abroger l'invasion japonaise en tant que général. Il ne s'est impliqué dans la politique du KMT qu'en 1948, lorsqu'il a été élu vice-président de la République de Chine. En janvier 1949, après la démission de Chiang Kai-shek, Zongren devient président de la Chine.§!"
 POLITICS_CHEN_CHENG_DESC:0 "§gChen servait comme commandant principal de l'Armée nationale révolutionnaire pendant l'expédition du Nord, les campagnes anticommunistes, la deuxième guerre sino-japonaise et la guerre civile contre le PCC. À la fin de la guerre civile, il fut nommé gouverneur de la province de Taiwan, où il déclara la loi martiale afin d'établir un fort bastion nationaliste sur l'île en cas de défaite de l'armée nationaliste sur le continent. Après la chute de Li Zongren, Chiang Kai-shek a repris la présidence aux côtés de Chen Cheng, remplaçant Yan Xishan au poste de Premier ministre. Tout en étant un fervent anticommuniste, nationaliste et partisan de la politique de Chiang Kai-shek, il préconise des mesures pacifiques via la privatisation de l'industrie, des réformes agraires et des politiques de plafonnement des loyers afin d'apaiser les tensions entre les paysans et le gouvernement afin d'arrêter la propagation du communisme.§!"
 POLITICS_CHEN_CHENG_DESC_DEMOCRATIC:0 "§gAprès la chute de Chiang Kai-shek, Chen Cheng s'est d'abord retrouvé dans une situation difficile. Compte tenu de ses anciennes fonctions sous le généralissime, il craignait d'être purgé par le gouvernement provisoire. Le gouvernement provisoire, cependant, a vu le potentiel de sa politique et lui a permis de rester en politique dans un avenir imprévu. Il se trouve désormais à la tête de l'aile conservatrice du Kuomintang, suivant une politique similaire à celle d'avant et plaidant pour une coopération plus étroite avec l'Occident dans sa lutte contre le communisme.§!"
 POLITICS_WELLINGTON_DESC:0 "V. K. Wellington Koo, ou Gu Weijun comme on l'appelle en Chine, est l'un des plus grands diplomates et hommes d'État du pays. Il a été représentant de la délégation chinoise à Versailles en 1919. Il a été témoin de la fondation de la Société des Nations et de l'ONU et a servi sous divers gouvernements chinois avant 1928 en tant que ministre des Finances, ministre des Affaires étrangères, premier ministre et ambassadeur auprès des pays occidentaux.\n\nAprès la victoire du Kuomintang contre la clique de Beiyang en 1928, Wellington Koo était recherché pour arrestation, mais grâce à la médiation de Zhang Xueliang, il fut autorisé à faire partie du nouveau gouvernement du Kuomintang et retourna au service diplomatique. Bien qu'il ait finalement quitté le service diplomatique en 1956, il est devenu juge à la Cour internationale de Justice de La Haye.\n\nEn 1960, Wellington Koo retourna en Chine et devint une figure de proue importante au sein de la faction Minquan prônant une coopération plus étroite avec l'Occident et la constitutionnalisation de la Chine.§!"
 POLITICS_CHIANG_KUO_MAINLAND_DESC:0 "§gChiang Ching-kuo est né dans la province du Zhejiang en tant que fils aîné du premier mariage de Chiang Kai-shek. Il a fréquenté l'Université Sun Yat-sen de Moscou en 1925, mais a été détenu en prison en URSS jusqu'en 1938, date à laquelle il a été autorisé à retourner en Chine et a rejoint le gouvernement de son père à Chongqing. Après la défaite du PCC, il devient chef de la police secrète et est responsable de diverses campagnes contre les cellules communistes. En 1965, il a été promu ministre de la Défense et a gravi les échelons jusqu'au poste de Premier ministre de la République de Chine. À la mort de Chiang Kai-shek, la Chine sera gouvernée par lui, mais pour l'instant, il n'est pas clair si cet avenir perpétuera le régime autoritaire du Kuomintang ou s'il verra peut-être un changement dans la politique chinoise et ouvrira la voie à des réformes démocratiques.§!"
 POLITICS_NATIONAL_ASSEMBLY_DESC:0"§gL'Assemblée nationale, l'organe législatif faisant autorité de la République de Chine, composée du Yuan de contrôle et du Yuan législatif, a assumé l'autorité provisoire de la République suite à la démission du gouvernement de Sun Li-jen. L'Assemblée fera office d'instance gouvernementale provisoire et préparera les premières élections nationales à venir depuis la suspension de la Constitution de 1947.§!"



 ###ROC GENERALS, ADMIRALS AND POLITICANS###

 POLITICS_CHIANG_ARMY_DESC:0 "§gNé dans la province de Chekiang, Chiang était membre du Kuomintang (KMT) et lieutenant de Sun Yat-sen dans la révolution visant à renverser le gouvernement de Beiyang et à réunifier la Chine. Cependant, en 1927, avant la fin de l'expédition du Nord, Chiang purgea les communistes au sein du KMT, déclenchant une guerre civile avec le PCC.\nEn 1936, il fut kidnappé par ses propres généraux et contraint de conclure une trêve avec les communistes pour s'unir contre l'agression japonaise. À la suite de l'incident du pont Marco Polo en 1937, il mobilisa la Chine pour la Seconde Guerre sino-japonaise. Pendant huit ans, il a mené la guerre de résistance contre un ennemi largement supérieur, principalement originaire de Chongqing, la capitale de la guerre.\nAprès l'échec du Double Dixième Accord, la guerre civile reprit en 1946. À l'heure actuelle, la NRA est épuisée en raison de 8 années de guerre contre l'Empire japonais et le soutien populaire au KMT est au plus bas de tous les temps. Chiang a déjà élaboré des plans pour une évacuation vers l'île de Taiwan, si le KMT devait subir une défaite sur le continent.§!"
 POLITICS_CHIANG_DESC_70s:0 "§gAprès le conflit final contre le Parti communiste, Chiang a remporté une fois pour toutes la bataille pour la Chine et entre dans les livres d'histoire comme le grand défenseur de la nation contre l'impérialisme étranger et le marxisme. Après la victoire du Kuomintang, il a utilisé tous les moyens nécessaires pour renforcer son pouvoir sur la Chine et a pourchassé les cellules socialistes restantes avec une force brutale, suspendant les droits et libertés constitutionnels tout en prétendant toujours respecter les Trois principes du peuple du Dr Sun.\n\nBien qu'il ait vaincu tous ses ennemis politiques, le généralissime Chiang dirige le pays depuis près de 50 ans maintenant, et son grand âge le laisse pratiquement incapable de décider seul des choix politiques. On ne sait pas combien de temps il sera encore à la tête de la République, mais il est certain que son héritage et ses fonctions resteront à jamais gravés dans l'histoire chinoise.§!"
 POLITICS_ZONGREN_ARMY_DESC:0 "§gNé dans la province du Guangxi en 1890, Li a rejoint Tongmenghui, le parti révolutionnaire de Sun Yat-sen, en 1910, mais il ne comprenait pas à l'époque les objectifs plus larges de Sun en matière de réforme et de réunification nationale. En 1924, il devient chef de la clique du Guangxi et, en 1926, il aide le KMT lors de son expédition dans le Nord. Cette alliance fut cependant de courte durée puisqu'il fut expulsé du KMT en 1929.\nEn 1937, il retrouva cependant le KMT pour abroger l'invasion japonaise en tant que général. Il ne s'est impliqué dans la politique du KMT qu'en 1948, lorsqu'il a été élu vice-président de la République de Chine. En janvier 1949, après la démission de Chiang Kai-shek, Zongren devient président de la Chine.§!"
 POLITICS_CHI_BAI_CHONGXI_DESC:0 "§gUn musulman du peuple Hui, Bai Chongxi, revendique la descendance d'une famille de marchands persans installés dans le Sichuan. Il a fréquenté l'école de formation des cadres militaires du Guangxi dans le cadre d'un programme modernisé et révolutionnaire dans le cadre de réformes plus larges au sein de l'armée chinoise. Ces connaissances de pointe lui seront très utiles lorsqu'il se fera un nom en servant dans une milice étudiante du Guangxi, gravissant plus tard les échelons pour devenir l'un des généraux les plus influents de l'ère des seigneurs de guerre. Fidèle partisan de la vision de Sun Yat-sen pour une Chine démocratique, il faisait partie du triumvirat connu sous le nom de Nouvelle Clique du Guangxi, qui cherchait à renverser le gouvernement régional des seigneurs de guerre de Lu Rongting.\nAux côtés de Li Zongren, il combattit contre le gouvernement de Chiang Kai-shek lors de la guerre des plaines centrales de 1930, mais finit par retrouver le généralissime pour défendre le pays contre l'agression japonaise et communiste. Chongxi a été le premier ministre de la Défense de la République de Chine de 1946 à 1948 et était responsable de la défense du centre et du sud de la Chine à la fin de la guerre civile chinoise.§!"
 POLITICS_CHI_HSUEH_YUEH_DESC:0 "§gNé dans une famille paysanne Hakka à Shaoguan, Guangdong, Hsueh Yueh rejoint la société secrète du Dr Sun Yat-sen au Japon, la Tongmenghui, en 1909. À son retour en Chine, il fréquente l'Académie militaire de Baoding mais décide de se rendre au Guangdong pour rejoindre volontairement l'armée nouvellement créée de Sun Yat-sen et Chen Jiongming avec le grade de capitaine.\nAu cours de l'expédition du Nord, il fut l'un des commandants nationalistes les plus efficaces, mais s'opposa plus tard à Chiang pendant la guerre des plaines centrales aux côtés de la nouvelle clique du Guangxi. Après leur défaite, Hsueh Yueh fut réintégré dans la NRA en tant que commandant de diverses armées participant aux batailles de Shanghai, Henan, Wuhan et Changde.\nLors de sa coopération avec Claire Lee Chennault, il reçut le surnom de « Patton de l'Asie ».§!"
 POLITICS_CHI_SUN_LI_JEN_ARMY_DESC:0 "§gSun Li-jen est née à Jinnu, Anhui. Il a brièvement effectué un stage à la Chicago Bridge & Iron Company à Chicago, dans l'Illinois, mais le patriotisme l'a motivé à changer de carrière et à poursuivre des études militaires. Sun a décidé qu'il pourrait mieux servir sa nation divisée en tant que soldat plutôt qu'en tant qu'ingénieur. En 1927, il retourna en Chine et devint caporal dans l'Armée nationale révolutionnaire, stationnée à Duyun, Guizhou. Il était surtout connu pour son leadership dans la Seconde Guerre sino-japonaise et la Guerre civile chinoise. Ses exploits militaires lui valent le surnom élogieux de « Rommel de l'Est ».§!"
 POLITICS_CHI_HU_ZONGNAN_DESC:0 "§gHu Zongnan était l'un des protégés les plus fiables de Chiang Kai-Shek et un jeune commandant exemplaire lors de l'expédition du Nord et de la Seconde guerre sino-japonaise. Il participa aux campagnes d'extermination communistes de Chiang, reçut le commandement de la Première Armée en 1936 et prit part à la bataille de Shanghai et de Wuhan.\nCependant, la gloire de Hu sur les champs de bataille fut de courte durée après qu'il fut chargé de plus de 400 000 soldats du Kuomintang par Chiang Kai-shek pour bloquer la base communiste du Shaanxi. Hu Zongnan aurait préféré mourir pour son pays sur les champs de bataille combattant les envahisseurs japonais. Mais en tant que soldat professionnel, il exécuta consciencieusement l'ordre donné par Chiang Kai-shek en conservant ce poste jusqu'à la fin de la guerre.\nAprès la Seconde Guerre mondiale, Hu Zongnan combattit le PCC dans la région du Shaanxi et réussit même à s'emparer de la base communiste de Yan'an. Cependant, en raison du transfert de près de la moitié de ses troupes sur ordre de Chiang Kai-Shek, Zongnan ne put tenir la région et fut contraint de battre en retraite.§!"
 POLITICS_CHI_GU_ZHUTONG_DESC:0 "§gGu est né à Lianshui, dans la province du Jiangsu. Tout au long de sa vie, il a fréquenté de nombreuses académies militaires telles que Baoding et Whampoa, où il était instructeur.\nIl est devenu commandant après le début de l'expédition du Nord et a été promu à plusieurs reprises après l'établissement du gouvernement de Nanjing. Il a participé à diverses opérations telles que les campagnes d'encerclement contre le PCC, ce qui lui a valu l'Ordre du Ciel bleu et du Soleil blanc en 1941 après avoir détruit un important contingent de troupes communistes.\nEn 1946, il était commandant en chef de la NRA à Zhengzhou et fut chargé de lancer des offensives contre les zones contrôlées par les communistes dans la province du Shandong. En 1947, il perdit le Shandong au profit de l'APL et fut relevé de son commandement et nommé chef d'état-major par Chiang Kai-Shek."
 POLITICS_CHI_XIONG_SHIHUI_DESC:0 "§gAprès avoir obtenu son diplôme de l'école élémentaire de l'armée du Jiangxi, Xiong Shihui entre à la quatrième école secondaire de l'armée de Nanjing en 1911 et rejoint le Tongmenghui à cette époque. Après avoir obtenu son diplôme en 1916, il part au Yunnan et devient commandant de bataillon avant de quitter la Chine pour étudier au Japon. À son retour en 1924, il rejoint le KMT et reste à Guangzhou pour servir comme enseignant à l'Académie militaire locale de la NRA et prendre part à l'expédition du Nord.\nAu cours des années suivantes, il a servi dans le gouvernement provincial du Jiangxi et comme chef d'état-major de la Commission des affaires militaires. En 1935, il est nommé 5e membre du Comité exécutif central et membre du Kuomintang et est chargé de la défense de la province du Jiangxi jusqu'à sa démission en 1942. Il revient en 1945 et est réélu membre du Comité exécutif central du Kuomintang, mais rejoint également le Comité politique du Bureau et est chargé de la réquisition du territoire mandchou effondré. Il a occupé ce poste jusqu'en août de l'année suivante et, en décembre, il est devenu membre du Comité consultatif stratégique national du gouvernement.§!"
 POLITICS_CHI_LIU_YUZHANG_DESC:0 "§gLiu Yuzhang s'est inscrit dans la quatrième classe de cadets en 1925. Certains de ses camarades de classe bien connus comprenaient Lin Biao, Hu Lien et Zhang Lingfu. Après avoir obtenu son diplôme, il participe à l'expédition du Nord et à la guerre des plaines centrales et est promu commandant du 5e régiment de la 2e division lorsque la guerre sino-japonaise éclate.\nLiu Yuzhang avait déjà affronté les Japonais sur le champ de bataille lors de la défense de la Grande Muraille en 1933, au cours de laquelle il avait été légèrement blessé. Pendant la guerre, il s'est distingué dans les batailles de Taierzhuang, Wuhan et Changsha et a même conduit des troupes au Vietnam pour accepter la reddition de l'armée japonaise stationnée là-bas.\nAprès la fin de l'occupation soviétique de la Mandchourie en 1946, Liu Yuzhang défendit avec succès Shenyang contre son ancien camarade de classe Lin Biao de l'APL, ce qui lui valut le grade de lieutenant général. Cependant, après la lutte du KMT pour tenir la Mandchourie contre l'APL pendant la campagne de Liaohsi, il se retira en Mandchourie et fut nommé commandant de la zone de défense de Kinmen.§!"
 POLITICS_CHI_HU_LIEN_DESC:0 "§gHu Lien est diplômé de l'Académie militaire de Whampoa aux côtés d'autres généraux célèbres tels que Lin Biao, Du Yuming et Li Yuzhang. Il a servi dans la NRA en tant que général pendant l'expédition du Nord, les campagnes d'encerclement, la guerre de Résistance et la guerre civile. Il était en poste dans le centre et l'est de la Chine pendant la guerre civile et a même mené avec succès des campagnes contre les communistes. Son expérience pourrait s'avérer précieuse pour les conflits futurs, qu'ils se déroulent à l'intérieur ou à l'extérieur de la Chine.§!"
 POLITICS_YINQING_DESC:0 "§gHe Yingqin est né dans la province impériale du Guizhou en 1890 et a passé la plupart de ses premières années à fréquenter des académies militaires. Il a également été choisi par le ministère de la Défense du gouvernement Qing pour étudier à l'étranger au Japon, où il a rencontré Chiang Kai-shek et a rejoint la société secrète anti-Qing du Dr Sun Yat-sens, la Tongmenghui. Il retourna en Chine après le soulèvement de Wuchan en 1911 et obtint finalement son diplôme en 1916, mais fut expulsé de sa province natale du Guizhou vers le Yunnan. Après la création de l'Académie militaire de Whampoa et de l'Armée nationale révolutionnaire en 1924, il devient instructeur général de l'académie et sert comme commandant de division pendant la révolte de Chen Jiongming à Liangguang et continue de diriger les troupes contre la clique de Beiyang pendant l'expédition du Nord. Il a soutenu la position anticommuniste de Chiang Kai-shek après le massacre de Shanghai et a continué à gravir les échelons de carrière au sein du gouvernement du Kuomintang. Il conserve son poste de chef d'état-major des armées du KMT mais est remplacé en 1944 au profit de Chen Cheng, ami de longue date de Chiang Kai-shek, mais est choisi comme représentant du gouvernement chinois pour la cérémonie du 9 septembre à Nanjing, acceptant les conditions de capitulation japonaises, marquant l'apogée de sa carrière. Lorsque Chiang Kai-shek a démissionné de son poste de président, il a été chargé de contenir le pouvoir et l'influence du nouveau président, Li Zongren, en le nommant chef du Yuan exécutif et ministre de la Défense.§!"
 POLITICS_XISHAN_DESC:0 "§gYan Xishan est né dans la province du Shanxi en 1883 et a grandi sous la garde de sa grand-mère, après le décès de sa mère. Très jeune, il a commencé à étudier les classiques confucéens et a finalement rejoint l'académie militaire de Taiyuan dans le Shanxi. Yan, aux côtés de divers autres jeunes talents prometteurs, a été envoyé étudier à Tokyo, où il était fasciné par les efforts d'occidentalisation du Japon, estimant que la Chine devait prendre des mesures similaires pour ne pas prendre de retard sur la scène internationale. Après le déclenchement de la révolution Xinhai, il retourne en Chine et rejoint la lutte contre les Qing et consolide finalement son pouvoir en tant que gouverneur du Shanxi après la mort de Yuan Shikai. Sous son règne, le Shanxi a connu des progrès incroyables dans les domaines de l'agriculture, de la santé et de l'éducation, ainsi que de l'idéologie de Yan appelée « Pensée Yan Xishan », combinant de nouveaux éléments du néoconfucianisme tels que l'autocritique et la culture de soi. Pendant la Seconde Guerre mondiale, il a servi comme commandant dans le Shanxi contre les Japonais mais a secrètement intensifié ses opérations contre le mouvement communiste local. Après la chute de Taiyuan aux mains du PCC, il a réussi à persuader le président par intérim Li Zongren de former un nouveau gouvernement comprenant les partisans de Chiang Kai-shek, avec Yan comme chef du Yuan exécutif, faisant la médiation entre les deux parties, mais malgré ses efforts, Li et Chiang ont continué leur rivalité. Yan reste Premier ministre pour l'instant, mais il est certain que sa démission n'attendra pas longtemps.§!"
 POLITICS_ZHANG_FAKUI_DESC:0 "§gAprès la capitulation japonaise, Zhang resta à Hong Kong, supervisant le rétablissement de l'autorité britannique, lui accordant le titre de Commandeur de l'Ordre de l'Empire britannique. Par la suite, il a été nommé gouverneur de la province du Guangdong mais a été démis de ses fonctions après la démission de Chiang Kai-shek en tant que président. Zhang occupe actuellement le poste d'administrateur militaire en chef de l'île de Hainan et prépare l'île à d'éventuelles invasions, si les communistes s'emparaient du continent chinois.§!"
 POLITICS_ZHAO_HENGTI_ARMY_DESC:0 "§gBien qu'il ait été évincé du pouvoir en 1926 par Tang Shengzhi, Zhao Hengti sortit relativement rapidement de sa retraite pour devenir président de l'Assemblée provisoire du Hunan pendant la Seconde guerre sino-japonaise. Après la guerre, il rejoint le Kuomintang et devient un proche allié de Chiang Kai-shek. Zhao est réintégré dans la politique locale du Hunan et espère consolider à nouveau son pouvoir en tant que gouverneur.§!"
 POLITICS_ZHU_SHAOLIANG_DESC:0 "§gZhu Shaoliang a grandi dans la province du Fujian avant de fréquenter brièvement les académies militaires japonaises. Il s'allia à Sun Yat-sen en 1910 et rejoignit les révolutionnaires à Wuchang l'année suivante. Pendant la Seconde Guerre mondiale, il est vice-président de la Commission des affaires militaires du gouvernement national avant de déménager à Chongqing en 1948. En 1949, le ministère de la Défense nationale nomme Zhu gouverneur de la province du Fujian et du Jiangxi, son poste actuel.§!"
 POLITICS_TANG_ENBO_DESC:0 "§gLa réputation de Tang a été grandement endommagée pendant la guerre anti-japonaise, perdant plus de 37 villes en 36 jours lors des offensives japonaises dans le sud de la Chine en 1944. Après la guerre, les communistes ont tenté de gagner Tang à leur côté, mais il a finalement été motivé par sa concubine à rester fidèle à Chiang Kai-shek. En conséquence, Tang a signalé le projet de Chen Yi de faire défection vers les communistes à Chiang Kai-shek, entraînant l'arrestation de Chen. Cependant, cela a finalement conduit Chiang Kai-shek à perdre toute sa confiance en Tang Enbo, d'autant plus que des découvertes récentes montrent que Tang envisageait de s'enfuir au Japon, après la bataille de Shanghai en 1937§!."
 POLITICS_LI_PINXIAN_DESC:0 "§gLi a rejoint la NRA en 1926 et a conduit ses troupes à occuper tout le Hunan et a contribué à la défaite de l'armée de Wu Peifu dans le Hubei lors de l'expédition du Nord. Après avoir rejoint la nouvelle clique du Guangxi en 1928 et un court exil à Hong Kong, Li fut finalement vaincu lors de la guerre des plaines centrales, mais continua ensuite à occuper des positions militaires importantes dans le Guangxi. Pendant la Seconde Guerre mondiale, il a été déployé à Shanghai, Xuzhou, Wuhan et Changsha, mais a continué à travailler contre le Parti communiste chinois en supprimant la nouvelle Quatrième Armée. Après la capitulation japonaise, Li est devenu membre du Comité exécutif central du Kuomintang et a brièvement exercé les fonctions de président du gouvernement provincial du Guangxi avant que Li Zongren ne retourne au Guangxi après sa démission.§!"
 POLITICS_YANG_SEN_DESC:0 "§gAvant de rejoindre l'Armée nationale révolutionnaire en 1926, Yang Sen a servi dans les rangs de l'armée du Sichuan en tant qu'allié proche du célèbre seigneur de guerre Zhili Wu Peifu. Bien qu'il ait été dégradé en raison de ses liens avec Wu, il est resté fidèle au Kuomintang et a finalement été nommé lieutenant général en 1936. Pendant la Seconde Guerre mondiale, il a participé aux campagnes de Shanghai et a été promu à la tête du 27e groupe d'armées. Après la guerre, il a occupé divers postes importants, tels que celui de membre du Yuan législatif et de l'Assemblée nationale, ainsi que son poste actuel de maire de Chongqing.§!"
 POLITICS_CHEN_JITANG_DESC:0 "§gLes relations de Chen Jitang avec le gouvernement central ont été grandement endommagées lors du complot du Guangxi de la fin de 1936. Alors que le complot visant à renverser Chiang Kai-shek a été abandonné en 1936, Chen a fui à Hong Kong mais est revenu plus tard pour rejoindre le gouvernement national dans sa lutte contre le Japon. Après la guerre, il a été nommé à son poste actuel de gouverneur de Hainan.§!"
 POLITICS_JIANG_DINGWEN_DESC:0 "§gJiang Dingwen s'est retiré à Shanghai, après sa démission après la conclusion de la bataille du Henan en 1944. Après la guerre, il fait campagne pour le mandat de Zhuji à la première Assemblée nationale, qu'il remporte finalement en 1948, mais est également nommé conseiller stratégique du président de la République.§!"
 POLITICS_MA_HONGKUI_DESC:0 "§gMa est née le 14 mars 1892 dans le village de Hanchiachi, dans la région du Gansu. Il était autrefois un allié du chef de Guominjun, Feng Yuxiang, mais il a trahi Feng et s'est allié à Chiang Kai-shek pendant la guerre des plaines centrales. Par la suite, il est devenu gouverneur de la province du Ningxia. Ma est connu pour sa position anticommuniste extrême et a la réputation de traiter durement les communistes sur son territoire. Les étrangers le considèrent comme l'un de nos généraux les plus efficaces.§!"
 POLITICS_MA_HONGBIN_DESC:0 "§gMalgré plusieurs revers dans la politique du Ningxian, Ma Hongbin a gagné une grande popularité grâce à ses efforts défensifs à Suiyuan, empêchant les Japonais d'entrer dans le Ningxia et créant un gouvernement fantoche musulman Hui. Après la capitulation japonaise, il devient conseiller principal au sein du quartier général de l'armée du Nord-Ouest.§!"
 POLITICS_LU_HAN_DESC:0 "§gLu Han a grandi dans le Yunnan, étudiant à l'Académie militaire du Yunnan et servant sous Long Yun dans le Yunnan après la chute des Tang Jiyao en 1927. Pendant la 2e guerre sino-japonaise, il commanda la 60e armée (plus tard la 30e armée) de l'ancienne Armée nationale révolutionnaire et fut déployé dans le Hunan et le Shandong. Après la guerre, il remplace son ancien supérieur Long Yun comme gouverneur du Yunnan avec l'aide de Du Yuming. Depuis février 1949, le général Lun a ignoré à plusieurs reprises les ordres de Nanjing, lui perdant ainsi la confiance du généralissime. Grâce aux efforts de l'ancien président Li Zongren, Lu a pu être convaincu de rester fidèle au Kuomintang en lui promettant une plus grande autonomie politique dans la Chine d'après-guerre.§!"
 POLITICS_CHI_DING_DELONG_DESC:0 "§gDing Delong est né dans la province du Hunan à la fin de la dynastie Qing. À l'âge de 20 ans, Ding s'est inscrit dans une académie militaire qui a ensuite fusionné pour devenir l'Académie militaire de Whampoa. En 1931, Ding rejoint la NRA et mène une campagne près du Hunan contre les seigneurs de guerre locaux et les forces communistes. Pendant la guerre avec le Japon, Ding a participé à des actions à Shanghai, dans la province du Henan et dans la ville de Wuhan. À la fin de la guerre avec le Japon, Ding fut promu lieutenant général et mena des campagnes contre les partisans communistes du Hunan. Lorsque Cheng Qian et de nombreux autres généraux du Hunan ont choisi de faire défection, Ding était l'un des rares habitants du Hunan à choisir de ne pas faire défection et a été nommé gouverneur de sa province natale après la fin de la guerre civile. Bien que sa loyauté envers Nankin puisse être remise en question, car il a montré qu'il ne se souciait que de sa province.§!"
 POLITICS_MA_BUFANG_NORMAL_DESC:0 "§gMa Bufang est né en 1903 dans le Gansu en tant que fils de Ma Qi, fondateur de l'armée musulmane du Ningxia du Qinghai au lendemain de la révolution Xinhai. Ma s'est rangé du côté de Chiang Kai-shek et du Kuomintang après le succès de l'expédition du Nord. La position anticommuniste farouche de Ma et sa loyauté envers le Kuomintang ont été prouvées à plusieurs reprises, comme le montrent ses opérations militaires contre les communistes au début des années 1930 et le refus de plusieurs offres de défection japonaises. Sa loyauté inconditionnelle envers le Kuomintang, bien qu'il soit Hui, a fait de lui l'un des dignes de confiance personnels de Chiang Kai-shek. En 1945, Bufang a été nommé au comité central du parti Kuomintang, et il a combattu avec succès contre les Ouïghours révoltés en plus de combattre le Parti communiste chinois pendant la guerre civile chinoise.§!"
 POLITICS_CHEN_QIAN_NORMAL_DESC:0 "§gCheng Qian a fait ses études au Japon lorsqu'il a rencontré le Dr Sun Yat-sen, rejoignant sa cause relativement tôt. Il sert comme vice-ministre de la Guerre sous Sun Yat-sen et prend rapidement de l'importance au sein du Kuomintang, à la suite de l'expédition du Nord. Il a été élu membre du Comité exécutif central du Kuomintang et a occupé de nombreux postes militaires importants pendant la 2e guerre sino-japonaise. En 1948, il brigue la vice-présidence de la République mais la perd face au seigneur de guerre du Guangxi Li Zongren. Chen s'est vu promettre le poste de gouverneur du Hunan par Chiang Kai-shek dans la Chine d'après-guerre s'il ne faisait pas défection au Parti communiste.§!"
 POLITICS_LIU_WENHUI_NORMAL_DESC:0 "§gLes relations de Liu Wenhui avec Chiang Kai-shek sont aussi instables que les provinces qu'il gouverne depuis 20 ans. Liu rejoint le Kuomintang en 1926 et commande la 24e armée de la NRA au Sichuan. Il a finalement été refoulé dans la province de Xikang par son neveu, le général Liu Xiang, où il a continué à saboter le gouvernement central en permettant aux troupes communistes de traverser Xikang sans être dérangées. Chiang, cependant, n'avait pas les ressources politiques nécessaires pour prendre des mesures contre Liu. Pendant la guerre de Résistance, Liu s'est assuré que ses forces participaient le moins d'action possible, ignorant souvent les ordres de Nanjing. Liu reste indigne de confiance aux yeux de Chiang, mais son autonomie locale et son influence rendent difficile le remplacement de son administration.§!"


 POLITICS_YU_HUNG_CHUN_DESC:0 "§gYu Hongjun, également connu sous le nom d'O. K. Yui, a servi au sein du KMT toute sa vie politique. Le gouvernement nationaliste le nomma maire de Shanghai en 1937, poste qu'il utilisa pour négocier la paix entre les forces chinoises et japonaises juste avant la bataille de Shanghai, qui échoua finalement. Après la guerre civile chinoise et la grande retraite du gouvernement du Kuomintang à Taiwan, il a été le 4e président du gouvernement provincial de Taiwan de la République de Chine jusqu'à sa récente promotion au poste de Premier ministre de la République sous la présidence de Chiang Kai-shek.§!"
 POLITICS_WU_GUOZHEN_DESC:0 "§gWu Guozhen débute sa carrière politique à l'Université de Princeton, où il obtient un doctorat en sciences politiques en 1926. À son retour en Chine la même année, il gravit les échelons de carrière dans le Hunan sous le règne du chef de guerre local Hsia Tou-yin. Après l'occupation du Hunan par les Japonais en 1939, Wu rejoignit le gouvernement de Chiang Kai-shek à Chungking et occupa divers rôles politiques importants jusqu'à la Grande Retraite, notamment la mairie de Chungking et de Shanghai et le poste de vice-ministre des Affaires étrangères. Au lendemain de la retraite à Taiwan, Wu a servi comme gouverneur de Taiwan, tentant d'apporter une plus grande autonomie gouvernementale et moins de brutalité policière au peuple taïwanais. Wu s'est heurté à l'opposition des membres conservateurs du Kuomintang, ce qui a finalement conduit à son renvoi du gouvernement et du Kuomintang. Aujourd'hui, avec la suspension de l'ancien gouvernement, Wu voit une fois de plus l'occasion pour Taiwan de s'engager sur une voie anticommuniste libérale, pacifique et modérée.§!"
 POLITICS_KUO_LIANG_DESC:0 "§gKuo Ting-liang est l'un des rares généraux à avoir été formé à l'Institut militaire de Virginie, où il a finalement rencontré son futur subordonné Sun Li-jen. Ensemble, ils se sont tous deux battus contre l'armée japonaise lors des campagnes de Birmanie et ont fait pression en faveur de réformes de la République à l'américaine après la perte du continent chinois. Malgré son opposition à Chiang Kai-shek, Kuo est toujours anticommuniste dans l'âme mais est prêt à écouter les conseils et les ordres donnés par les États-Unis d'Amérique. On peut supposer que, sous sa vice-présidence, il déploiera d'innombrables efforts pour améliorer et maintenir les relations avec Washington et reconsidérer la reconquête du continent chinois par la force militaire.§!"
 POLITICS_XISHAN_JUNTA_DESC:0 "§gÀ la suite des troubles provoqués par la grande retraite du gouvernement nationaliste à Taiwan, Yan Xishan fut finalement démis de ses fonctions de Premier ministre par Chiang Kai-shek après la chute politique de Li Zongren. Yan s'attendait à passer le reste de sa vie en dehors de la politique, étant séparé de sa maison bien-aimée du Shanxi pour un avenir imprévu. Cependant, lorsque le général Sun Li-jen entra dans le palais présidentiel de Taipei et renversa le gouvernement de Chiang Kai-shek, tout changea une fois de plus pour Yan. Le gouvernement provisoire a décidé de le nommer Premier ministre provisoire de la république jusqu'à la fin du régime militaire, estimant que ses capacités de médiation entre Li Zongren et Chiang Kai-shek pendant la guerre civile pourraient s'avérer efficaces pour l'intégration de l'ancien gouvernement de Chiang Kai-shek. Ce sera peut-être l'occasion pour Yan d'entamer une évolution politique qui pourrait éventuellement conduire à son retour au Shanxi, que ce soit par la diplomatie ou par la guerre.§!"
 POLITICS_WANG_YUN_WU_DESC:0 "§gConsidéré par divers cercles chinois et étrangers comme l'un des plus grands érudits modernes de Chine, M. Wang a occupé des postes clés dans des institutions politiques et éducatives, notamment à l'Institut national chinois de Woosung, dans divers journaux et agences de presse, au ministère de l'Éducation et des Finances et au Yuan exécutif. Wang, croyant dans la tradition, la culture et le confucianisme chinois, s'est opposé aux communistes pendant la révolution chinoise, a décidé de réintégrer la politique et a gravi les échelons jusqu'au gouvernement conservateur nouvellement élu de la République de Chine.§!"
 POLITICS_ZHU_JIAHUA_DESC:0 "§gConnu et respecté par de nombreux membres du parti comme l'homme responsable du déménagement de l'Academia Sinica, Zhu Jiahua est un homme politique influent au sein du Kuomintang. Il est président de l'Academia Sinica depuis 1940 et a fondé divers projets permettant aux étudiants chinois d'étudier à l'étranger aux États-Unis d'Amérique, considérant le paysage éducatif et universitaire américain comme une étape nécessaire vers une éducation efficace pour les futurs politiciens et universitaires. Ses projets ont été initialement désapprouvés par Chiang Kai-shek, mais maintenant qu'il a quitté le pouvoir, Zhu est revenu à la sphère politique et est maintenant Premier ministre de la République de Chine au sein du gouvernement conservateur, dans le but de poursuivre ses anciennes politiques à l'Academia Sinica.§!"
 POLITICS_CHANG_LI_SHENG_DESC:0 "§gChang a passé sa jeune vie dans le cadre d'un programme d'alternance travail-études chinois en France, où il s'est ensuite inscrit à l'Université de Paris et s'est spécialisé en sciences politiques. Pendant ce temps, il rencontre le jeune Zhou Enlai, essayant de convaincre Chang de rejoindre le Parti communiste, ce que Chang refuse finalement. Après son retour en Chine, il rejoint le Kuomintang en 1924 et s'aligne sur le général Chen Cheng pendant la Seconde Guerre mondiale, lançant des campagnes contre le PCC. Au cours des dernières années du règne de Chiang Kai-shek, il a soutenu les programmes de réforme agraire et économique de Chen Cheng et, après la déposition de Chiang, il a commencé à étudier d'éventuels programmes de mise en oeuvre pour l'autonomie culturelle de la population taïwanaise d'origine et la gouvernance constitutionnelle, qu'il espère mettre en oeuvre et renforcer au cours de son mandat.§!"
 POLITICS_ZHANG_JUNMAI_DESC:0 "§gZhang Junmai s'est fait connaître dans les années 1930 en tant que co-fondateur et chef du Parti de la Troisième Force de la République comme alternative au Kuomintang paternaliste et au Parti communiste totalitaire. Zhang a plaidé pour la mise en oeuvre d'une structure politique social-démocrate en Chine sur le modèle social-démocrate du SPD allemand avec des engagements forts en faveur des droits de l'homme, de la séparation des pouvoirs et de la nationalisation des principales industries telles que les chemins de fer et les mines. Mécontent du règne anticonstitutionnel de Chiang Kai-shek à Taiwan, il quitte le pays pour les États-Unis mais y revient après le coup d'État anti-Chiang et rejoint le cercle social-libéral autour de Sun Fo, devenant un proche de lui, ce qui lui vaut finalement d'être nommé Premier ministre de la République.§!"
 POLITICS_SUN_FO_DESC:0 "§gSun Fo, également connu par certains sous le nom de Zhesheng, doit être l'un des membres les plus éminents et les plus symboliques du Kuomintang. Fils de Sun Yat-sen, père de la révolution de 1911, père et premier président de la République et fondateur du Kuomintang, Sun Fo a un passé parental assez impressionnant. Ayant servi dans le gouvernement nationaliste sous son père mais aussi Tchang Kaï-chek dans divers ministères et autres postes, il est devenu l'un des plus hauts fonctionnaires du Kuomintang. Cependant, en raison de ses convictions libérales et nationalistes, inspirées par son père, il eut de multiples disputes et retombées avec l'ancien président Chiang Kai-shek concernant la question du gouvernement constitutionnel et les négociations avec le Parti communiste face à l'agression japonaise. Après le départ du gouvernement nationaliste à Taiwan, il quitta le pays en 1952, mais comme beaucoup d'autres universitaires à l'esprit libéral, il revint après la destitution de Chiang et devint immédiatement le principal candidat du camp social-libéral du Kuomintang.§!"
 POLITICS_LEI_CHEN_DESC:0 "§gAvant de s'installer à Taiwan avec le gouvernement du Kuomintang, Lei Chen a joué un rôle important dans la réorganisation du Parti de la jeunesse chinoise et du Parti socialiste démocratique chinois lors de la session de l'Assemblée nationale de 1946 et des premières élections législatives du Yuan de 1947. Déjà avant son départ pour Taiwan, lui, ainsi que Hu Shi, Wang Shiije et Hang Liwu, se préparaient à publier le journal « Chine libre », qui fut cependant retardé en raison de la traversée communiste du fleuve Yangtze. Tout en entretenant dans un premier temps de bonnes relations avec Chiang Kai-shek et en soutenant ses projets politiques, Lei critique les mesures autoritaires du gouvernement. Il a été démis par Tchang Kaï-chek de son poste de conseiller politique du président et risquait d'être expulsé du Kuomintang. Avec l'éviction du généralissime du pouvoir et le retour de la gouvernance civile, Lei Chen a remporté les récentes élections à la tête de son nouveau Parti démocratique chinois. Même si son parti ne détient pas la majorité absolue, on s'attend à ce que la présidence de Lei entraîne des changements fondamentaux dans la structure gouvernementale de la République de Chine.§!"



