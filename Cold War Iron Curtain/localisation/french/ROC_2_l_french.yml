 CHI_KMT_reborn:0 "La renaissance du Kuomintang"
 CHI_KMT_reborn_desc:0 "\nAprès des décennies d'incompétence, de corruption et d'opportunisme, les réformes du Comité central de réforme du Kuomintang ont finalement transformé le parti en le parti léniniste révolutionnaire qu'il était autrefois. Le moment est désormais venu de préparer l'inévitable libération de la partie continentale de la Chine."
