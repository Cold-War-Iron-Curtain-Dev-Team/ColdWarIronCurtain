 KMT_Economic_aftermath_of_civil_war_1:0 "Conséquences économiques de la guerre civile"
 KMT_Economic_aftermath_of_civil_war_1_desc:0 "Après presque douze années de combats constants, d'instabilité, d'hyperinflation et de sanctions occidentales, l'économie chinoise est en ruine et doit être reconstruite à partir de zéro. Ce sera une tâche difficile, mais le succès de notre gouvernement en dépend."
 KMT_Economic_aftermath_of_civil_war_2:0 "Conséquences économiques de la guerre civile"
 KMT_Economic_aftermath_of_civil_war_2_desc:0 "Après presque douze années de combats constants, d'instabilité, d'hyperinflation et de sanctions occidentales, l'économie chinoise est en ruine et doit être reconstruite à partir de zéro. Ce sera une tâche difficile, mais le succès de notre gouvernement en dépend."
 KMT_Economic_aftermath_of_civil_war_3:0 "Conséquences économiques de la guerre civile"
 KMT_Economic_aftermath_of_civil_war_3_desc:0 "Après presque douze années de combats constants, d'instabilité, d'hyperinflation et de sanctions occidentales, l'économie chinoise est en ruine et doit être reconstruite à partir de zéro. Ce sera une tâche difficile, mais le succès de notre gouvernement en dépend."
 KMT_Economic_aftermath_of_civil_war_4:0 "Conséquences économiques de la guerre civile"
 KMT_Economic_aftermath_of_civil_war_4_desc:0 "Après presque douze années de combats constants, d'instabilité, d'hyperinflation et de sanctions occidentales, l'économie chinoise est en ruine et doit être reconstruite à partir de zéro. Ce sera une tâche difficile, mais le succès de notre gouvernement en dépend."
 KMT_Economic_aftermath_of_civil_war_5:0 "Conséquences économiques de la guerre civile"
 KMT_Economic_aftermath_of_civil_war_5_desc:0 "Après presque douze années de combats constants, d'instabilité, d'hyperinflation et de sanctions occidentales, l'économie chinoise est en ruine et doit être reconstruite à partir de zéro. Ce sera une tâche difficile, mais le succès de notre gouvernement en dépend."
 KMT_Economic_aftermath_of_civil_war_6:0 "Conséquences économiques de la guerre civile"
 KMT_Economic_aftermath_of_civil_war_6_desc:0 "Après presque douze années de combats constants, d'instabilité, d'hyperinflation et de sanctions occidentales, l'économie chinoise est en ruine et doit être reconstruite à partir de zéro. Ce sera une tâche difficile, mais le succès de notre gouvernement en dépend."
 KMT_educational_Reform_1:0 "Diminution de l'analphabétisme"
 KMT_educational_Reform_1_desc:0 "L'ère de l'ignorance massive touche à sa fin. Grâce à des investissements publics incessants et à un engagement national, nous avons atteint un niveau d'éducation qui rivalise avec celui des grandes puissances. Chaque citoyen peut désormais contribuer au destin de la République, que ce soit dans le laboratoire, à l'usine ou au sein du gouvernement. La connaissance est notre bouclier le plus puissant."
 KMT_educational_Reform_2:0 "Diminution de l'analphabétisme"
 KMT_educational_Reform_2_desc:0 "Le mot imprimé n'est plus un mystère pour le citoyen moyen. Grâce à un solide réseau d'écoles primaires et de cours du soir pour les travailleurs, nos taux d'alphabétisation ont atteint des niveaux qui permettent une coordination industrielle complexe et une citoyenneté plus politiquement consciente. Les fondations d'un État moderne sont désormais solidement posées."
 KMT_educational_Reform_3:0 "Analphabétisme généralisé"
 KMT_educational_Reform_3_desc:0 "Nos réformes éducatives gagnent enfin du terrain. Grâce à des campagnes d'alphabétisation de masse et à la simplification des caractères, nous avons réussi à enseigner à une partie importante de la jeunesse les bases de l'écrit. Nous ne sommes plus une nation d'aveugles, mais le chemin vers une main-d'oeuvre moderne est encore long."
 KMT_educational_Reform_4:0 "Analphabétisme généralisé"
 KMT_educational_Reform_4_desc:0 "Si les premières écoles de village ont commencé à apparaître, la lumière de l'éducation n'a pas encore atteint les provinces plus profondes. Une grande partie de nos recrues ne savent pas lire leurs propres manuels et notre industrie souffre d'un manque chronique de main-d'oeuvre qualifiée. La lutte contre « la cécité de l'esprit » se poursuit."
 KMT_educational_Reform_5:0 "Analphabétisme généralisé"
 KMT_educational_Reform_5_desc:0 "Imbéciles mdr# Des décennies d'instabilité et l'effondrement des institutions impériales ont laissé la grande majorité de notre population incapable de lire ou d'écrire. La connaissance est le privilège de quelques-uns, tandis que les masses restent attachées au sol, inaccessibles à l'administration ou à la propagande moderne. Nous devons briser ces chaînes de l'ignorance si nous voulons que la République survive."

 



