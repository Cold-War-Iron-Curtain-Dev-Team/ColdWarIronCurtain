 KMT_60s_Political_Executive_Democracy:0 "La « démocratie » paternelle"
 KMT_60s_Political_Executive_Democracy_desc:0 "Ce n'est que grâce au généralissime Chiang Kai-shek que le pays a survécu à l'insurrection marxiste et a pu se remettre de la Seconde Guerre mondiale et de la guerre civile. Mais comme le Parti communiste résiste toujours en Mandchourie et bénéficie du soutien de l'Union soviétique, nous ne pouvons autoriser aucune réforme démocratique tant que le PCC n'est pas vaincu une fois pour toutes. Le président Chiang Kai-shek, malgré son grand âge, nous guidera à travers ces temps et apportera la paix et l'ordre dans notre république."

 KMT_60s_Political_Executive_Democracy_continue_terror:0 "Réorganiser la Terreur Blanche"
 KMT_60s_Political_Executive_Democracy_continue_terror_desc:0 "Au cours des dernières décennies, nous avons traqué toute dissidence politique liée aux communistes et l'avons écrasée. Bien que cela se soit révélé efficace contre les espions et les infiltrations du PCC, cela a grandement nui à la réputation du Kuomintang en tant que parti populaire, étant donné que des militants sociaux-démocrates et libéraux ont également été pourchassés, arrêtés et exécutés. Nous devrions donner la priorité aux maoïstes comme principale cible politique, tout en gardant un oeil attentif sur les autres militants politiques pour nous assurer qu'ils ne deviendront pas une menace pour notre pouvoir à l'avenir."

 KMT_60s_Political_Executive_Democracy_utilize_shanghai_crime:0 "Poursuivre la coopération avec les gangs de Shanghai"
 KMT_60s_Political_Executive_Democracy_utilize_shanghai_crime_desc:0 "Grâce à ses liens avec la Bande Verte, impliquée dans le commerce de l'opium, la prostitution, l'extorsion et les jeux de hasard, le Kuomintang a gagné beaucoup d'argent et continuera à le faire si nous permettons à la Bande Verte de poursuivre ses opérations à Shanghai. Non seulement leurs profits bénéficieront grandement à notre gouvernement, mais aussi leurs ressources humaines qui ont souvent perturbé et infiltré les cellules et les syndicats maoïstes dans le passé. Cependant, la corruption au sein de cette société secrète s'avérera sûrement un défi de taille à relever. Néanmoins, le gouvernement a besoin de toute urgence de l'argent et des ressources du Green Gang."

 KMT_60s_Political_Executive_Democracy_invest_in_army:0 "Investissements de l'armée"
 KMT_60s_Political_Executive_Democracy_invest_in_army_desc:0 "Il y a un vieux dicton à propos de l'ancien État prussien qui disait : « La Prusse est une armée avec un État ». Le Kuomintang a également dépendu de son armée tout au long de son histoire, depuis l'expédition du Nord jusqu'à aujourd'hui. C'est pour cette raison que nous continuerons à investir dans les forces armées afin d'assurer la survie de notre régime jusqu'à ce que nous puissions entamer la 3ème phase de la Révolution et enfin introduire la démocratie dans la nation. Mais personne ne peut dire exactement quand cela se produira."

 KMT_60s_Political_Executive_Democracy_reform_prison_system:0 "Réformer notre système carcéral"
 KMT_60s_Political_Executive_Democracy_reform_prison_system_desc:0 "Dans le cadre de la réorganisation de nos mesures de répression, nous apporterons également quelques changements à la manière dont les prisonniers politiques sont traités. La peine de mort restera mais ne sera appliquée que pour trahison, désertion et meurtre. En dehors de cela, nous devrions essayer de viser la réhabilitation et la rééducation des individus qui sortent des sentiers battus au lieu de les torturer et de les traiter comme des humains de seconde zone. Nous investirons davantage dans les prisons des zones urbaines afin d'encourager les anciens criminels à s'adapter à notre système et à ne pas les remplir de haine et de colère à notre égard."

 KMT_60s_Political_Executive_Democracy_appease_sino_liberals:0 "« Promettre » des réformes libérales"
 KMT_60s_Political_Executive_Democracy_appease_sino_liberals_desc:0 "Il existe encore un grand nombre de personnalités sino-libérales influentes au sein de notre gouvernement qui s'opposent à la politique de Chiang Kai-shek et des partisans de la ligne dure. Ils sont trop influents pour les purger, c'est pourquoi nous les satisferons en leur promettant d'introduire éventuellement des réformes sociales et démocratiques limitées.\n\nFinalement."

 KMT_60s_Political_Executive_Democracy_tackle_corruption:0 "Faire face à la corruption locale"
 KMT_60s_Political_Executive_Democracy_tackle_corruption_desc:0 "La corruption est responsable de la perte du soutien populaire des gouvernements et détruira toute confiance du peuple dans nos institutions politiques. Chiang Ching-kuo, fils du généralissime, a suggéré de lancer diverses purges contre les fonctionnaires corrompus au sein du Kuomintang. Étant donné que le PCC finira par nous attaquer à nouveau, nous ne pouvons pas risquer que des ressources précieuses affluent dans les poches d'individus cupides au lieu des forces armées et du secteur économique. "

 KMT_60s_Political_Executive_Democracy_councils:0 "Conseils de district"
 KMT_60s_Political_Executive_Democracy_councils_desc:0 "Maintenant que nous contrôlons presque toute la Chine et que nous ne comptons plus sur des cliques de seigneurs de guerre, nous devons établir des conseils locaux comme représentation gouvernementale au niveau local. Même si nous autoriserons les habitants locaux à voter, nous autoriserons uniquement les responsables du Kuomintang à se présenter aux mandats. Cela devrait suffire à apaiser en partie les revendications démocratiques tout en maintenant notre influence dans les zones rurales."

 KMT_60s_Political_Executive_Democracy_carrot_stick:0 "Apprendre de Bismarck"
 KMT_60s_Political_Executive_Democracy_carrot_stick_desc:0 "Les « Sozialistengesetze», également connues sous le nom de lois socialistes, visaient à cibler les camps socialistes et sociaux-démocrates en Allemagne à la suite des tentatives d'assassinat du Kaiser Guillaume Ier par des socialistes radicaux. Les lois ont fini par se retourner contre eux et ont renforcé le mouvement social-démocrate en Allemagne, le SPD devenant le parti le plus puissant au parlement. Nous devrions tirer les leçons des erreurs de Bismarck en offrant davantage de concessions aux paysans pour les encourager à soutenir notre programme au lieu de suivre la propagande communiste."

 KMT_60s_Political_Executive_Democracy_sham_elections_preparation:0 "Programmer les « élections » du Yuan législatif"
 KMT_60s_Political_Executive_Democracy_sham_elections_preparation_desc:0 "Le Yuan législatif sert de parlement de la République de Chine, représentant les intérêts du peuple, mais en raison des menaces internes et externes qui pèsent sur la République, nous ne pouvons pas permettre des élections communes et légales où les partis opposés au Kuomintang pourraient être élus au Parlement. Mais afin de satisfaire les mouvements libéraux dans le pays et de sauver notre réputation de république sur le plan international, nous autoriserons divers autres partis fidèles au KMT à recevoir des mandats au parlement."

 KMT_60s_Political_Executive_Democracy_Change_constitutions:0 "Donner du pouvoir à l'exécutif"
 KMT_60s_Political_Executive_Democracy_Change_constitutions_desc:0 "Nous apporterons quelques modifications à la Constitution de 1947, en la modelant sur celle des États-Unis et de la France, où le président détient un pouvoir important. De cette façon, nous pouvons justifier en partie notre régime autoritaire temporaire au niveau constitutionnel et éviter qu'une opposition croissante au sein du Yuan législatif ne rivalise avec notre régime."

 KMT_60s_Political_Executive_Democracy_Social_reforms:0 "Introduire des réformes sociales"
 KMT_60s_Political_Executive_Democracy_Social_reforms_desc:0 "Dans le cadre de notre tactique de la carotte et du bâton, nous introduirons diverses réformes sociales visant à améliorer la vie du paysan chinois moyen. Si nous les apaisons suffisamment, ils ne seront pas victimes de la propagande du PCC, les incitant à croire à leurs croyances utopiques. Nous devrions envisager d'introduire davantage de réformes dans un avenir proche si nous ne voulons pas risquer de perdre le soutien populaire."

 KMT_60s_Political_Executive_Democracy_limit_bureaucratic_capitalism:0 "Limiter le capitalisme bureaucratique"
 KMT_60s_Political_Executive_Democracy_limit_bureaucratic_capitalism_desc:0 "L'économie de la République repose actuellement sur les entreprises publiques et les sociétés exerçant des activités économiques. Nous devrions donner plus de liberté aux entreprises privées extérieures au gouvernement pour assurer la croissance économique et lutter contre la corruption."

 KMT_60s_Political_Executive_Democracy_vice_president_elections:0 "Organiser des élections vice-présidentielles"
 KMT_60s_Political_Executive_Democracy_vice_president_elections_desc:0 "La pression internationale et extérieure nous oblige à introduire davantage de libertés politiques. Le gouvernement a décidé d'apporter des modifications à l'élection du vice-président. Le vice-président n'a pas beaucoup de pouvoir par rapport au président, ce qui rend l'élection moins importante politiquement que les élections législatives du Yuan. Les candidats les plus populaires sont Sun Fo, fils du fondateur de la République, Sun Yat-sen, et ancien gouverneur de la province de Taiwan et célèbre commandant de la NRA, Chen Cheng, tous deux très proches du Kuomintang au cours des dernières décennies. Ils ne s'écarteront sûrement pas de l'agenda politique du Généralissime."

