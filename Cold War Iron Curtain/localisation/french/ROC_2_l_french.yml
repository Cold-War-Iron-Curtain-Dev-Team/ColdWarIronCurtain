 bss.301.t:0 "Rapport de nos espions à Nanjing"
 bss.301.d:0 "Président ! Nos espions chargés d'infiltrer le gouvernement du Kuomintang et son armée ont fait une découverte choquante. Le cercle autour du traître Chiang Kai-shek a établi des plans pour une invasion de la Mandchourie et mobilise maintenant ses forces armées pour nous attaquer ! Nous devons prendre diverses mesures pour protéger le peuple chinois de Mandchourie de l'impérialisme occidental, mais beaucoup au sein de l'état-major de l'armée de l'APL ne pensent pas que nous puissions résister longtemps à une invasion par nous-mêmes. Même si l'Union soviétique nous soutiendra sans aucun doute via des expéditions d'armes, nous devrions envisager de demander à nos autres camarades socialistes de Mongolie, de Corée, du Vietnam et du Turkestan de nous aider et de vaincre une fois pour toutes les capitalistes d'Asie de l'Est."
 bss.301.a:0 "Contactez nos alliés. Nous avons besoin de chaque âme pour vaincre la Bourgeoise !"

 bss.302.t:0 "L'intervention soviétique"
 bss.302.d:0 "Alors que nous étions au bord d'une défaite totale contre le Kuomintang, l'Union soviétique est intervenue pour empêcher l'effondrement total de nos forces et a envahi les régions du Xinjiang et de la Mongolie intérieure. La Bourgeoise contrôle désormais les principales régions han de Chine, mais nous ne sommes pas en mesure de déclencher un conflit avec le Kuomintang dans les années à venir.\n\nNéanmoins, nous contrôlons toujours Pékin et la Mandchourie. Pour l'instant, nous devons nous concentrer sur la reconstruction de l'armée et sur la maîtrise de nos problèmes internes si nous voulons un jour reprendre la Chine du KMT."
 bss.302.a:0 "Les armes reposent... pour l'instant."

