 ##KMT Mainland 70s##

 KMT_70s_Expand_Terms:0 "Prolonger le mandat de Chiang Kai-shek"
 KMT_70s_Expand_Terms_desc:0 "Le pays a encore besoin des conseils de Chiang Kai-shek et du Kuomintang s'il veut vraiment prospérer et être libre. Nous ne pouvons pas risquer que des menaces constitutionnelles, comme d'autres partis ou des élections, menacent la position du Généralissime. Nous présenterons au Yuan législatif une proposition visant à étendre encore une fois les mandats de Chiang Kai-shek pour garantir que le pays ne déviera pas de sa bonne voie."

 KMT_70s_Call_New_Legislative_Elections:0 "Remaniement du Yuan législatif"
 KMT_70s_Call_New_Legislative_Elections_desc:0 "Alors que nous avons organisé une poignée d'élections simulées au cours des dernières décennies, nous sommes aujourd'hui confrontés au problème suivant : nos proches collaborateurs du Yuan législatif, fidèles à Chiang et à son gouvernement, disparaissent lentement, car la plupart d'entre eux sont des vétérans et des membres qui ont rejoint le parti au cours de la décennie de Nanjing. Nous devons remanier l'institution, mais il faut s'attendre à ce que tous les nouveaux mandats ne partagent pas les mêmes vues autoritaires dures."

 KMT_70s_Appoint_Chiang_Ching_Kuo_PM:0 "Nommer Chiang Ching Kuo Premier ministre"
 KMT_70s_Appoint_Chiang_Ching_Kuo_PM_desc:0 "L'âge avancé de Chiang Kai-shek rend le processus de gouvernement de la Chine de plus en plus difficile. Déjà dans le coma depuis plus de 6 mois, il devient clair qu'il ne peut plus gouverner seul. Le généralissime prépare depuis des décennies son fils Chiang Ching-Kuo à la présidence et a décidé qu'en raison de sa mauvaise santé, il devrait devenir Premier ministre de la République de Chine."

 KMT_70s_Expand_KMT_Influence_Private_Sector:0 "Élargir l'influence du KMT dans le secteur de l'industrie privée"
 KMT_70s_Expand_KMT_Influence_Private_Sector_desc:0 "Le gouvernement doit établir des relations étroites avec le secteur privé, car nous avons besoin d'une plus grande représentation des entreprises dans l'élaboration des politiques, alors que l'économie chinoise s'oriente actuellement vers des industries plus complexes, à forte intensité de capital et de technologie."

 KMT_70s_sideline_pro_democratic_intellectuals:0 "Surveiller les intellectuels pro-démocrates"
 KMT_70s_sideline_pro_democratic_intellectuals_desc:0 "Au cours des dernières années, de nombreux intellectuels non alignés et à l'esprit libéral ont obtenu des postes vitaux dans la bureaucratie locale et dans les établissements d'enseignement. Bien que nous ne puissions pas les retirer directement de leurs fonctions, nous pouvons déployer divers efforts pour surveiller ces individus afin de nous assurer qu'ils ne deviennent pas un danger politique pour l'État."

 KMT_70s_Deal_with_CCP_remnants:0 "Le sort du Parti communiste"
 KMT_70s_Deal_with_CCP_remnants_desc:0 "Après notre victoire finale contre le PCC, la plupart de ses élites ont été jugées ces deux dernières années. Il est désormais temps d'exécuter les sanctions. L'exécution de Mao Zedong sera le triomphe symbolique du Kuomintang sur ses ennemis politiques et affirmera pour toujours sa domination en Chine."

 KMT_70s_Recruit_locals_into_KMT:0 "Recruter des locaux dans le Kuomintang"
 KMT_70s_Recruit_locals_into_KMT_desc:0 "Si nous voulons garantir la stabilité régionale, nous devons recruter dans le parti des militants politiques locaux pro-KMT. Ils s'allieront officiellement au parti tout en faisant également office de mandats représentatifs des intérêts locaux. Après tout, la Chine est très diversifiée et nous devrions essayer d'apaiser cette diversité en la rapprochant de nos croyances."

 KMT_70s_Keep_Elites_In_Check:0 "Gardez les élites sous contrôle"
 KMT_70s_Keep_Elites_In_Check_desc:0 "Hommes d'affaires, officiers, hommes politiques locaux... Ils servent tous le gouvernement en tant que points clés du développement socio-économique. Si le gouvernement et son élite bien sélectionnée et formée travaillent en étroite collaboration, la croissance économique sera plus assurée. Si nous voulons garantir que cela reste ainsi, nous ferions mieux de vérifier le comportement et les croyances des élites pour nous assurer qu'aucune corruption ne se propagera au sein de l'élite, tout comme cela s'est produit pendant la décennie de Nanjing après l'expédition du Nord."

 KMT_70s_Mandarin_Learning_Efforts:0 "Promouvoir les cours de mandarin"
 KMT_70s_Mandarin_Learning_Efforts_desc:0 "Afin de maintenir notre emprise sur la société, nous devons déployer davantage d'efforts dans les campagnes d'apprentissage du mandarin, en commençant à l'école et jusqu'aux universités. Bien que nous ne puissions pas supprimer fortement les dialectes et les langues locales comme nous l'avons fait au cours des dernières décennies, nous pouvons essayer d'affirmer la domination du mandarin pour rendre son utilisation plus attrayante."

 KMT_70s_Tighten_grip_over_radio_television:0 "Resserrons notre emprise sur les nouveaux médias"
 KMT_70s_Tighten_grip_over_radio_television_desc:0 "La télévision et la radio sont de plus en plus présentes dans les foyers du pays. Ils sont utiles pour le divertissement, mais pour diffuser l'information, nous devons nous assurer que le gouvernement contrôle ce qui est diffusé. Non pas que des messages critiques à l'égard du KMT soient envoyés à la table de cuisine de nos citoyens."

 KMT_70s_Get_to_know_the_people:0 "Visitez le pays"
 KMT_70s_Get_to_know_the_people_desc:0 "Le Premier ministre Chiang Ching-Kuo a décidé de se présenter au peuple non pas comme un brillant supérieur, mais comme un citoyen ordinaire du pays. Vêtus de tenues décontractées, lui et ses collaborateurs se sont rendus dans les écoles, universités, usines, bureaux et hôpitaux locaux pour faire connaissance avec les gens et discuter avec eux de leurs besoins et de leurs problèmes."

 KMT_70s_encourage_young_politicians:0 "Soutenir les jeunes politiciens"
 KMT_70s_encourage_young_politicians_desc:0 "Puisque la vieille garde disparaît lentement et que ses méthodes et ses convictions sont de toute façon dépassées, nous devrions recruter davantage de personnes jeunes et énergiques au sein du Kuomintang afin que ce ne soit pas seulement un parti rempli de vieux conservateurs."

 KMT_70s_further_anti_corruption_campaigns:0 "Poursuivre les campagnes anti-corruption"
 KMT_70s_further_anti_corruption_campaigns_desc:0 "Un gouvernement honnête et efficace est la clé du développement socio-économique et politique. Nous ne pouvons permettre à des responsables égoïstes et corrompus d'opérer au sein du gouvernement. Le pays est la priorité numéro un. Pas les gains personnels."

 KMT_70s_attract_western_trained_chinese:0 "Attirer des experts chinois formés en Occident"
 KMT_70s_attract_western_trained_chinese_desc:0 "Les Chinois d'outre-mer formés en sciences sociales, en technologie et en sciences naturelles pourraient être un atout précieux pour notre gouvernement. Leur expertise nous aidera à élaborer de nouvelles politiques visant à améliorer les moyens de subsistance de la population et nous aidera à développer de nouvelles technologies et théories politiques."

 KMT_70s_establish_institute_of_economics:0 "Créer l'Institut d'économie"
 KMT_70s_establish_institute_of_economics_desc:0 "L'Academia Sinica nous sert d'Académie nationale depuis 1928. Nous devons élargir la variété des disciplines, en particulier l'économie. Si nous voulons vraiment assurer la croissance économique et la richesse, nous devons fournir des ressources à nos futurs économistes potentiels."

 KMT_70s_More_Infrastructure:0 "Les huit grands projets de construction"
 KMT_70s_More_Infrastructure_desc:0 "Les différents projets d'infrastructure des années précédentes ont grandement contribué au bien-être local et ont davantage connecté le pays. Cependant, il reste encore beaucoup de travail à faire, comme la modernisation des infrastructures, la maintenance et l'amélioration des connexions. De nombreux Chinois vivent encore dans des conditions difficiles et, au sens confucianiste traditionnel, nous, en tant que dirigeants, sommes obligés de les aider."

 KMT_70s_Appoint_Hsieh_Tung-min_Governor_Taiwan:0 "Nommer Hsieh Tung-min gouverneur de Taiwan"
 KMT_70s_Appoint_Hsieh_Tung-min_Governor_Taiwan_desc:0 "Dans un effort pour apaiser les minorités et les communautés locales, nous devrions nommer des autochtones alignés sur le KMT à des postes gouvernementaux cruciaux à l'égard de ces régions, tels que des gouverneurs et des officiers de garnison. Nous commencerons par nommer Hsieh Tung-min gouverneur de Taiwan, né à Taiwan sous le règne japonais mais qui a décidé de quitter l'île dans les années 1920 pour rejoindre le Kuomintang sur le continent. Alors que nous avions besoin d'anticommunistes radicaux à des postes clés pendant la zone de consolidation qui a suivi la fin de la guerre civile, nous devrions maintenant encourager des personnes moins radicales et connues localement à les remplacer. La promotion de Hsieh Tung-min en servira d'exemple."

 KMT_70s_Build_CKS_airport_Chongqing:0 "Construire l'aéroport de Chiang Kai-shek"
 KMT_70s_Build_CKS_airport_Chongqing_desc:0 "Dans le cadre des divers efforts de construction proposés par le Premier ministre Chiang, nous devons construire davantage d'aéroports pour relier notre pays au monde international. Nous commencerons par Chongqing et lui donnerons le nom du généralissime Chiang Kai-shek."

 KMT_70s_World_Heritage_Sites:0 "Sélectionnez les premiers sites chinois du patrimoine mondial"
 KMT_70s_World_Heritage_Sites_desc:0 "Un site du patrimoine mondial est un point de repère ou une zone bénéficiant d'une protection juridique par une convention internationale administrée par l'Organisation des Nations Unies pour l'éducation, la science et la culture (UNESCO). Les sites du patrimoine mondial sont désignés par l'UNESCO pour leur importance culturelle, historique, scientifique ou autre. Les sites sont considérés comme contenant « un patrimoine culturel et naturel du monde entier considéré comme étant d'une valeur exceptionnelle pour l'humanité. L'architecture, les inventions, la nature et les sites touristiques chinois ont parfaitement démontré la créativité, les ambitions et les capacités physiques de la race humaine et méritent ainsi leur place sur la Liste du patrimoine mondial."

 KMT_70s_Promote_moderate_patriotism:0 "Promouvoir un patriotisme modéré"
 KMT_70s_Promote_moderate_patriotism_desc:0 "Bien que le nationalisme fasse partie intégrante des trois principes du Dr Sun Yat-sens, il peut devenir un élément dangereux s'il devient trop radical. Au lieu de créer une fausse croyance selon laquelle le peuple chinois est supérieur au reste du monde, nous devrions mettre l'accent sur la pensée du patriotisme, ce qui signifie que vous pouvez être fier de votre pays sans exprimer de pensées supérieures ni le désir de faire la guerre pour votre nation. Les tendances nationalistes ne feront que créer l'image d'une société hostile et nuiront grandement à nos relations avec l'Occident."

 KMT_70s_Maintain_US_relations:0 "Entretenir des relations avec les États-Unis"
 KMT_70s_Maintain_US_relations_desc:0 "Même si Chiang Kai-shek a eu des discussions houleuses avec les Américains pendant et après la Seconde Guerre mondiale, il est clair que les États-Unis ont été notre allié le plus proche et nous ont fourni des capitaux, une philosophie politique et un soutien militaire. Il est nécessaire pour notre nation de maintenir de bonnes relations avec Washington, surtout si son plus grand rival, l'URSS, est à ses portes."

 KMT_70s_Open_the_nanjing_memorial_museum:0 "Ouvrir le musée commémoratif de Nanjing"
 KMT_70s_Open_the_nanjing_memorial_museum_desc:0 "Même après des décennies, la guerre de Résistance a eu une influence si remarquable sur la Chine qu'elle restera très probablement un facteur émotionnel dans un avenir proche. Afin de ne jamais oublier ce qui s'est passé sur les champs de bataille et dans les zones occupées, nous devrions construire un musée qui nous rappellera non seulement la courageuse résistance dont les Chinois ont fait preuve face à l'impérialisme étranger, mais aussi à quel point les êtres humains peuvent être cruels les uns envers les autres afin que nous, les humains, ne permettions plus jamais que cela se reproduise."

 KMT_70s_crackdown_on_remaining_communist_cells:0 "Répression des cellules du PCC"
 KMT_70s_crackdown_on_remaining_communist_cells_desc:0 "Alors que l'élite du PCC est partie pour de bon, soit dans la tombe, soit derrière les barreaux, il existe toujours une importante scène clandestine qui tente de saboter et d'infiltrer les institutions gouvernementales et diffuse de la propagande pro-PCC, notamment un petit livre rouge contenant les soi-disant « Pensées du président Mao Zedong ». Nous ne pouvons pas permettre que cette propagande idéologique se propage davantage à l'intérieur du pays."

 KMT_70s_Modernise_Education_Institutions:0 "Moderniser les établissements d'enseignement"
 KMT_70s_Modernise_Education_Institutions_desc:0 "La montée en puissance des ordinateurs peut être observée dans diverses armées du monde entier, y compris les forces armées de la République. Mais pourquoi réserver cette technologie exclusivement au militaire ? Les établissements d'enseignement comme les écoles et les universités pourraient faire un grand usage de ces nouvelles avancées technologiques et augmenteraient sûrement considérablement nos capacités éducatives."

 KMT_70s_spread_anti_ussr_propaganda:0 "Répandre la rhétorique antisoviétique"
 KMT_70s_spread_anti_ussr_propaganda_desc:0 "L'Union soviétique a été la racine de tous les maux, du mal qu'est le communisme. Alors que le Dr Sun et même Chiang Ching-kuo voyaient certains aspects efficaces tels que l'organisation des forces armées ou la manière de mener une révolution anti-impérialiste, il était clair que le PCUS cherchait seulement à aider le Kuomintang à l'influencer et éventuellement à le remplacer par le Parti communiste. C'est pourquoi notre glorieux dirigeant Chiang Kai-shek a compris leurs véritables intentions lors de son séjour à Moscou et a décidé de frapper préventivement le PCC en 1927. Compte tenu de nos relations étroites avec les États-Unis et de notre histoire personnelle avec l'anticommunisme, il est plus que nécessaire de dénoncer l'URSS comme l'ennemi du pays."

 KMT_70s_secure_soviet_borders:0 "Sécuriser les frontières soviétiques"
 KMT_70s_secure_soviet_borders_desc:0 "Même si une invasion directe est peu probable, ce n'est pas une mauvaise idée de déployer divers efforts pour défendre nos frontières. Qui sait quand l'Union soviétique utilisera à nouveau l'excuse de la protection des minorités soviétiques locales pour justifier les guerres locales et les conflits frontaliers."


 ###Economy###

 KMT_70s_review_economy:0 "Revoir l'économie"
 KMT_70s_review_economy_desc:0 "Les dernières décennies ont changé le fonctionnement de notre économie. Mais aujourd'hui, avec un niveau de vie en légère augmentation, davantage d'infrastructures et l'absence de menaces marxistes, nous disposons de conditions privilégiées pour développer encore plus notre économie et pourrions être en mesure de rivaliser avec les États-Unis. Les années à venir, nous nous concentrerons sur la technologie informatique, les infrastructures, les machines électriques et les exportations."

 KMT_70s_establish_Electronic_data_center:0 "Créer le centre de traitement électronique des données"
 KMT_70s_establish_Electronic_data_center_desc:0 "Le Yuan exécutif établira un centre de traitement électronique des données pour aider les agences gouvernementales et les établissements d'enseignement à concevoir leurs propres ordinateurs pour leur utilisation afin d'optimiser l'efficacité."

 KMT_70s_Collaboration_between_Universities_Domestic_Companies:0 "Encourager la collaboration entre les universités et les entreprises locales"
 KMT_70s_Collaboration_between_Universities_Domestic_Companies_desc:0 "Grâce à la collaboration avec les universités et les sociétés électroniques nationales, nous pouvons introduire de nombreuses nouvelles technologies en Chine."

 KMT_70s_Buy_Semiconductors_from_US:0 "Acheter des semi-conducteurs américains"
 KMT_70s_Buy_Semiconductors_from_US_desc:0 "Afin de relancer l'industrie informatique, nous devons d'abord mettre la main sur certains semi-conducteurs. Les projets américano-américains nous aideront non seulement à fabriquer nos premiers modèles informatiques, mais nos ingénieurs et scientifiques chinois expérimentés à l'étranger prépareront et entreprendront également divers projets de semi-conducteurs."

 KMT_70s_encourage_vocational_technical_education:0 "Encourager l'enseignement professionnel et technique"
 KMT_70s_encourage_vocational_technical_education_desc:0 "Nous devons promouvoir l'enseignement professionnel et technique, en particulier au lycée, car l'économie exige de plus en plus de travailleurs et de personnel technique qualifiés."

 KMT_70s_tax_cuts:0 "Réductions d'impôts pour les entreprises étrangères et nationales"
 KMT_70s_tax_cuts_desc:0 "Si nous voulons encourager les investissements des entreprises privées chinoises et étrangères, nous devons réduire les impôts qu'elles paieront pour rendre les investissements plus attractifs."

 KMT_70s_energy_investments:0 "Investir dans l'énergie nucléaire"
 KMT_70s_energy_investments_desc:0 "Afin de disposer d'une sorte de réserve énergétique d'urgence, nous devons investir dans l'énergie nucléaire afin d'être moins dépendants des exportations de pétrole."

 KMT_70s_petro_chemicals:0 "Promouvoir l'industrie pétrochimique"
 KMT_70s_petro_chemicals_desc:0 "Plastiques, plastifiant, solvant. Ce sont tous des éléments clés des biens quotidiens. Nous devons développer l'industrie pétrochimique afin de pouvoir augmenter la production et en apporter davantage sur le marché."

 KMT_70s_Export_Focus:0 "Priorité à l'exportation"
 KMT_70s_Export_Focus_desc:0 "Nous devons nous concentrer davantage sur l'exportation de biens, en particulier de technologie informatique et de produits agricoles, ainsi que sur la réduction des restrictions commerciales telles que les droits de douane et les taxes supplémentaires."

 KMT_70s_Further_Agriculture_Projects:0 "Autres investissements agricoles"
 KMT_70s_Further_Agriculture_Projects_desc:0 "L'agriculture reste un facteur important au sein de l'économie chinoise. De nombreux agriculteurs des régions rurales ont besoin de notre soutien si nous voulons garantir des conditions de vie agréables à tous les Chinois, qu'ils vivent à Shanghai ou à Xining."

 KMT_70s_More_Infrastructure_2:0 "Présenter les grands projets d'infrastructure"
 KMT_70s_More_Infrastructure_2_desc:0 "L'infrastructure est l'élément clé de l'efficacité d'un pays. L'approvisionnement en eau, les transports, les institutions énergétiques, sans eux, les demandes fondamentales de la population ne peuvent être satisfaites. Surtout en ces temps incertains du système mondial capitaliste dominant, nous devons nous préparer à une crise potentielle et investir dans divers projets d'infrastructure pour maintenir la connexion et la stabilité du pays."

 KMT_70s_More_Infrastructure_2_railroads:0 "Connecter les zones rurales"
 KMT_70s_More_Infrastructure_2_railroads_desc:0 "Tandis que nous avons établi d'immenses voies ferrées entre les villes les plus importantes du pays, il est également important que les petites zones rurales aient la possibilité de monter à bord d'un train pour atteindre la gare la plus proche qui les amènera aux grandes villes du pays."

 KMT_70s_More_Infrastructure_2_water_supply_streets:0 "Projets de rue et d'approvisionnement"
 KMT_70s_More_Infrastructure_2_water_supply_streets_desc:0 "Des rues et des réseaux d'approvisionnement en eau fonctionnels sont essentiels pour chaque communauté. Des investissements supplémentaires aideront ces communautés à améliorer leurs infrastructures."

 KMT_70s_More_Infrastructure_2_Expand_Harbours:0 "Agrandissez les ports"
 KMT_70s_More_Infrastructure_2_Expand_Harbours_desc:0 "Nos ports sont la porte d'entrée du commerce avec l'Occident, notamment le Japon, les États-Unis et l'Europe occidentale. Cependant, ils sont terriblement dépassés et nécessitent une modernisation pour maximiser l'efficacité commerciale."

 KMT_70s_More_Infrastructure_2_steel_mills:0 "Construction d'aciéries"
 KMT_70s_More_Infrastructure_2_steel_mills_desc:0 "Même si nous ne nous concentrons pas sur l'industrie lourde, nous ne pouvons pas la négliger car l'acier est nécessaire presque partout."

 KMT_70s_Oil_gansu:0 "Fouilles dans le Gansu"
 KMT_70s_Oil_gansu_desc:0 "Si nous voulons que l'industrie pétrochimique prospère, nous avons besoin de plus de pétrole. Même si l'importation de pétrole des États-Unis nous aidera pour l'instant, nous devrions viser des sources de pétrole plus indépendantes."

 KMT_70s_Build_Fuel_Silos:0 "Développer les stockages de carburant"
 KMT_70s_Build_Fuel_Silos_desc:0 "La demande croissante de pétrole et nos activités intensives d'extraction et d'importation nous obligent à investir davantage dans des unités de stockage de pétrole et de carburant."

 KMT_70s_Build_more_Petrochemical_plants:0 "Plus de raffineries pétrochimiques"
 KMT_70s_Build_more_Petrochemical_plants_desc:0 "La demande toujours croissante de produits pétrochimiques augmente, nous devons donc intensifier notre jeu et investir davantage dans les raffineries pétrochimiques."

 KMT_70s_economic_growth:0 "Croissance économique"
 KMT_70s_economic_growth_desc:0 "Nos experts économiques ont étudié ces dernières années une forte augmentation de la production et de l'efficacité dans notre pays. Nos projets se sont révélés efficaces, mais il reste encore beaucoup à faire, comme la modernisation des centres urbains les plus importants du pays ainsi que les investissements dans l'industrie légère."

 KMT_70s_modernise_our_big_cities:0 "Moderniser les villes"
 KMT_70s_modernise_our_big_cities_desc:0 "Avec l'essor des nouvelles technologies telles que les ordinateurs, la télévision et d'autres inventions nouvelles, nous devons moderniser les institutions administratives, éducatives et bureaucratiques de nos villes les plus importantes. La Chine urbaine deviendra une société moderne."

 KMT_70s_modernise_our_big_cities_nanjing:0 "Nankin"
 KMT_70s_modernise_our_big_cities_nanjing_desc:0 "Nanjing est notre capitale actuelle et a été notre lieu le plus important pour sécuriser et administrer le pays. Il devrait être une priorité en tant qu'objectif de modernisation urbaine."

 KMT_70s_modernise_our_big_cities_chongqing:0 "Chongqing"
 KMT_70s_modernise_our_big_cities_chongqing_desc:0 "Chongqing a servi de capitale d'urgence pendant la Seconde Guerre mondiale et est l'un des endroits les plus importants du Sichuan, le grenier de la Chine. La forte densité de population exige que toutes les grandes villes du Sichuan soient modernisées pour améliorer l'efficacité administrative et nous commencerons par Chongqing."

 KMT_70s_modernise_our_big_cities_beijing:0 "Pékin"
 KMT_70s_modernise_our_big_cities_beijing_desc:0 "L'ancienne capitale de la Chine, le siège des empereurs chinois et l'ancienne capitale des sales bandits communistes. Même si la lutte et l'idéologie du KMT ne s'harmonisent pas avec la ville, elle reste l'une des plus importantes du pays et ne doit pas être exclue de la modernisation."

 KMT_70s_modernise_our_big_cities_Shanghai:0 "Shanghai"
 KMT_70s_modernise_our_big_cities_Shanghai_desc:0 "Même si nous avons déjà investi massivement dans Shanghai car elle nous sert de porte d'entrée vers l'ouest, nous devons continuer à moderniser la ville. Un Shanghai modernisé signifie un commerce modernisé avec l'Occident."

 KMT_70s_modernise_our_big_cities_guangzhou:0 "Canton"
 KMT_70s_modernise_our_big_cities_guangzhou_desc:0 "La ville natale du Dr Sun, la base de soutien du Kuomintang où nous avons préparé nos forces pour l'expédition du nord et l'une des villes les plus riches du Guangdong. Il ne faut pas l'oublier lorsqu'il s'agit de moderniser les villes les plus importantes de Chine."

 KMT_70s_modernise_our_big_cities_kunming:0 "Kunming"
 KMT_70s_modernise_our_big_cities_kunming_desc:0 "Nous ne pouvons pas oublier les régions montagneuses du Yunnan. Les efforts de modernisation seront également dirigés vers sa capitale provinciale, Kunming."

 KMT_70s_modernise_our_big_cities_golmud:0 "Golmud"
 KMT_70s_modernise_our_big_cities_golmud_desc:0 "L'ancienne base de la famille Ma et aujourd'hui capitale de la province du Qinghai est relativement en retard par rapport aux régions côtières. Nous devons également le moderniser pour le rendre plus attractif pour l'urbanisation, mais également en faire une porte d'entrée vers le côté moderne du pays pour les agriculteurs ruraux moyens qui vivent dans la région."

 KMT_70s_modernise_our_big_cities_Dihua:0 "Dihua"
 KMT_70s_modernise_our_big_cities_Dihua_desc:0 "Le Xinjiang et ses tensions ethniques ont toujours causé des problèmes dans le passé. Nous devrions commencer notre politique au Xinjiang en améliorant les infrastructures et en introduisant des technologies modernes dans la région, en particulier à Dihua."

 KMT_70s_Light_Industry:0 "L'industrie légère"
 KMT_70s_Light_Industry_desc:0 "Le développement industriel lourd a dominé notre économie avant la Seconde Guerre mondiale et dans les années qui ont suivi. Alors que la société occidentale se transforme lentement en une société basée sur la consommation, nous devons nous tourner vers l'industrie légère pour encourager la production, l'exportation et l'importation de biens de consommation et de technologies."

 KMT_70s_Radios_Television:0 "Electronique grand public"
 KMT_70s_Radios_Television_desc:0 "La télévision et la radio ne devraient pas être un bien de luxe. Même s'il sera difficile d'offrir un accès financier à toutes les classes sociales, la plupart des foyers chinois devraient être équipés de radios et de télévisions."

 KMT_70s_acer:0 "La Fondation Acer"
 KMT_70s_acer_desc:0 "Fondée par Stan Shih dans la ville de Hsinchu, Acer vise à fournir des pièces électroniques et des conseils pour l'utilisation des technologies de microprocesseur. Elle va sûrement se développer encore davantage à l'avenir et, avec un financement approprié, elle pourrait devenir un acteur majeur dans le domaine des microprocesseurs."

 KMT_70s_American_cars_for_the_chinese_market:0 "Des voitures américaines pour le marché chinois"
 KMT_70s_American_cars_for_the_chinese_market_desc:0 "Grâce à nos bonnes relations avec les États-Unis, nous pouvons encourager leurs constructeurs automobiles à établir des succursales chinoises locales avec l'aide d'investisseurs chinois. En 1972, la branche Ford Lio Ho Motor a été créée et continuera à produire des modèles Ford pour le marché chinois."

 KMT_70s_renewable_energies:0 "Investissez dans les énergies renouvelables"
 KMT_70s_renewable_energies_desc:0 "Les énergies renouvelables sont l'avenir et nous devrions y investir pour nous assurer une deuxième source d'énergie. Ils ne pourront pas remplacer le charbon et le pétrole pour l'instant, mais si nous poursuivons la recherche et le développement dans ce domaine, nous pourrons peut-être réduire de loin les émissions de CO2 à l'avenir. Mais pour l'instant, ils nous serviront de sources d'énergie supplémentaires pour répondre à la demande croissante de machines et de produits électroniques."

 KMT_70s_food_branches:0 "Branches alimentaires"
 KMT_70s_food_branches_desc:0 ""

 KMT_70s_textile_industry:0 "Soutenir l'industrie textile"
 KMT_70s_textile_industry_desc:0 "Les entreprises de confection sont essentielles à la croissance économique. L'augmentation des fonds publics devrait encourager les investissements et accroître l'efficacité ainsi que l'exportation de vêtements."

 KMT_70s_plastic_industry:0 "Investissements plastiques"
 KMT_70s_plastic_industry_desc:0 ""

 KMT_70s_chinese_consumer_society:0 "La société de consommation chinoise"
 KMT_70s_chinese_consumer_society_desc:0 "Aujourd'hui, les Chinois sont également devenus une société de consommation calquée sur le modèle occidental, mais le gouvernement continue de les surveiller de près. La richesse a considérablement augmenté en Chine, grâce au changement de politique économique du Kuomintang. Quelqu'un préférerait ne pas penser aux expériences dangereuses que le PCC aurait tenté s'il avait gagné la guerre civile et pris le contrôle de la Chine."

 ###Army###

 KMT_70s_review_army:0 "Revoir les forces armées"
 KMT_70s_review_army_desc:0 "Au cours des dernières décennies, notre armée a constitué un monopole politique important qui a eu une influence significative sur les décisions politiques. Cependant, la menace du PCC ayant finalement disparu, il est peut-être temps de repenser si nous avons vraiment besoin d'une armée aussi nombreuse et influente."

 KMT_70s_downsize_army:0 "Réduire la taille de l'armée"
 KMT_70s_downsize_army_desc:0 "L'entretien de l'armée est coûteux et la taille et l'influence énormes du ROCA le rendent très coûteux. Avec la disparition définitive de la menace du PCC, il n'est pas nécessaire de préserver notre immense armée. Nous la réduirons à une armée purement défensive et nous concentrerons également sur les commissariats locaux de police et de l'armée pour nous assurer qu'ils sont prêts à faire face aux menaces internes."

 KMT_70s_maintain_huge_army:0 "La Prusse chinoise"
 KMT_70s_maintain_huge_army_desc:0 "Le KMT est arrivé au pouvoir avec une armée, a défendu le pays avec une armée et n'a survécu que grâce à son armée. Le militarisme était essentiel à la survie de notre régime et même avec la chute du PCC, nous ne pouvons pas risquer que notre autorité militaire soit remise en question. On ne sait jamais qui sera ton ennemi demain..."

 KMT_70s_depoliticise_army:0 "Dépolitiser les officiers"
 KMT_70s_depoliticise_army_desc:0 "De nombreux responsables de haut rang continuent d'agir de manière fortement idéologique et tentent d'imposer leur volonté aux soldats. Nous devons garantir que l'armée reste politiquement neutre afin qu'elle puisse se concentrer uniquement sur son seul objectif : la défense du peuple. Nous n'avons pas besoin d'une armée pouvant être manipulée politiquement."

 KMT_70s_utilize_former_warlord_armies:0 "Utiliser les anciennes armées de seigneurs de guerre"
 KMT_70s_utilize_former_warlord_armies_desc:0 "Après avoir intégré les seigneurs de la guerre au gouvernement central, nous pourrions utiliser leurs anciennes armées et les intégrer dans les garnisons et les forces de police locales."

 KMT_70s_volunteer_service:0 "Réformer la conscription universelle"
 KMT_70s_volunteer_service_desc:0 "Afin de lutter contre le militarisme pur et dur, nous devrions apporter quelques modifications à la durée du service. Nous le réduirons à un an au lieu de trois et introduirons également des options alternatives de service militaire, comme au ministère de l'Intérieur."

 KMT_70s_decrease_army_spending:0 "Diminuer les dépenses militaires"
 KMT_70s_decrease_army_spending_desc:0 "Nous devrions réorienter nos financements vers le secteur civil car nous n'avons pour l'instant besoin que d'équipements légers pour nos forces armées."

 KMT_70s_light_equipment:0 "Investissez dans des équipements légers"
 KMT_70s_light_equipment_desc:0 "Puisque notre armée sert désormais principalement à des fins défensives et administratives, nous devrions investir dans des canons légers, de l'artillerie légère et des équipements de soutien pour garantir que nos troupes sont bien équipées pour faire face aux menaces potentielles à l'intérieur ou à l'extérieur de la Chine."

 KMT_70s_remove_corrupt_police_officers:0 "Éliminer les policiers corrompus"
 KMT_70s_remove_corrupt_police_officers_desc:0 "Les fonctionnaires corrompus qui ne pensent qu'à leur gain personnel et tolèrent le crime ne méritent pas de place dans notre administration. Nous surveillerons de près nos forces pour nous assurer qu'elles n'agissent pas de manière suspecte."

 KMT_70s_increase_army_spending:0 "Augmenter les dépenses de l'armée"
 KMT_70s_increase_army_spending_desc:0 "L'armée est la priorité numéro un en ce qui concerne nos fonds. La sécurité de l'État n'a pas de prix et nous sommes prêts à investir davantage de ressources dans ce secteur."

 KMT_70s_loyal_officers:0 "Généraux fidèles"
 KMT_70s_loyal_officers_desc:0 "Si nous ne voulons pas risquer de perdre le pouvoir, nous devons maintenir dans nos forces armées des responsables de haut rang très loyaux. Leur loyauté garantira que nous pouvons utiliser l'armée à toutes fins et garantira également que les soldats soient sous l'influence pro-KMT afin qu'ils ne remettent en question aucun de nos ordres à l'avenir."

 KMT_70s_heavy_machinery:0 "Investissez dans la machinerie lourde"
 KMT_70s_heavy_machinery_desc:0 "Nous devrions investir dans des avions, des chars et d'autres machines lourdes qui amélioreront considérablement la force de nos forces. La dissuasion est l'essence du réalisme dans le domaine de la politique internationale. Personne n'osera nous attaquer si notre pays est armé jusqu'aux dents des dernières technologies imaginables."

 KMT_70s_military_propaganda:0 "Propagande militaire"
 KMT_70s_military_propaganda_desc:0 "Le Pays a besoin de vous ! À tout moment, nous pourrions être attaqués par des puissances impériales étrangères qui exploitent le pays depuis plus de 100 ans. Rejoignez vos frères et faites preuve de patriotisme, de camaraderie et de courage pour défendre vos amis, votre famille et votre pays contre ses ennemis. Rejoignez le ROCA dès aujourd'hui !"

 KMT_70s_army_maneuvers:0 "Manoeuvres de l'armée"
 KMT_70s_army_maneuvers_desc:0 "Nous ne pouvons jamais savoir quand nous serons attaqués. Pour garantir que vos forces sont capables de défendre notre pays, elles ont besoin d'une formation. Nous mènerons diverses manoeuvres avec l'aide de nos conseillers américano-américains pour accroître la force défensive de notre armée."

 KMT_70s_militaristic_society:0 "Une société militariste"
 KMT_70s_militaristic_society_desc:0 "Notre Société s'adapte aux principes de notre pays qui se reflètent également dans le grand ROCA. Cela nous apportera la démocratie, la fierté nationale et le bien-être, mais seulement si tout le monde y croit et participe activement à ce processus. Rejoignez l'armée et contribuez à faire de ce pays un endroit plus sûr pour nos femmes et nos enfants !"

 ##Foreign Policy##

 KMT_70s_foreign_policy:0 "Le ministère des Affaires étrangères"
 KMT_70s_foreign_policy_desc:0 "En tant que grande puissance croissante, nous pouvons utiliser notre pouvoir politique pour influencer d'autres pays via des alliances, des traités, un soutien ou si cela est nécessaire, la guerre. Nous aborderons notre politique étrangère principalement de manière réaliste, ce qui signifie que nous voulons maximiser notre pouvoir politique et garantir notre sécurité."

 KMT_70s_Indian_relations:0 "Relations indiennes"
 KMT_70s_Indian_relations_desc:0 "Alors que nous avons déjà eu des discussions avec l'Inde sur nos régions frontalières au Tibet il y a dix ans, nous devrions repenser. Si nous voulons approcher à nouveau les Indiens et si nous le souhaitons, comment devrions-nous les aborder ?"

 KMT_70s_Recognize_Indian_Claims:0 "Reconnaître la ligne MacMahon"
 KMT_70s_Recognize_Indian_Claims_desc:0 "Nous parviendrons à un accord pacifique avec l'Inde en reconnaissant leur règne sur les territoires définis par la ligne MacMahon. Le traité a été signé par le gouvernement tibétain en 1914 et n'a pas été reconnu par la République, affirmant que le Tibet fait partie de la Chine et ne peut donc pas signer de traités multilittéraux. Mais se faire un autre ennemi en revendiquant ces territoires ou en violant le traité ne serait pas une décision judicieuse. Nous devrions aller vers davantage de coopération entre l'Inde et la Chine."

 KMT_70s_Non_Agression_India:0 "Traité de sécurité sino-indien"
 KMT_70s_Non_Agression_India_desc:0 "Nous devrions proposer à Delhi un traité de non-agression et de coopération pour assurer la paix entre nos deux nations. Travailler en étroite collaboration unifiera encore davantage l'Asie et contribuera à garantir l'ordre et la stabilité dans la région."

 KMT_70s_Utilise_Indian_market:0 "Utiliser le marché indien"
 KMT_70s_Utilise_Indian_market_desc:0 "La population de l'Inde est gigantesque et offre un énorme marché de personnes ayant besoin de biens et de services. Nous devrions encourager nos entreprises chinoises à exporter davantage de biens de consommation vers l'Inde, car leur état social et infrastructurel peu développé entraîne des besoins bien plus importants en biens de base comme la nourriture, les vêtements, les médicaments et les appareils électroniques."

 KMT_70s_Demand_Return_Arunanchal_Pradesh:0 "Dénoncer l'accord MacMahon"
 KMT_70s_Demand_Return_Arunanchal_Pradesh_desc:0 "L'accord MacMahon n'a jamais été un traité juridique puisqu'il a été signé par une délégation tibétaine au début du 20e siècle. Le gouvernement chinois n'a jamais approuvé cela, car le Tibet a toujours fait partie intégrante de la Chine et ne pouvait donc pas signer seul des traités internationaux. Nous continuerons de revendiquer les anciennes régions du Tibet du Sud et n'hésiterons pas à recourir à la force si nos revendications ne sont pas satisfaites."

 KMT_70s_Army_Drills_in_Tibet:0 "Exercices militaires au Tibet"
 KMT_70s_Army_Drills_in_Tibet_desc:0 "Si l'Inde ne cède pas ses territoires légitimes par des moyens pacifiques, nous devons recourir à la force. Nous préparerons notre armée à l'avance dans les montagnes tibétaines si la situation devait encore s'aggraver."

 KMT_70s_Arm_Pakistani_Militias_in_Indian_Kashmir:0 "Armer les milices musulmanes au Cachemire"
 KMT_70s_Arm_Pakistani_Militias_in_Indian_Kashmir_desc:0 "La zone contestée du Cachemire entre nous, l'Inde et le Pakistan pourrait constituer une grande diversion pour les Indiens si quelqu'un voulait mettre le feu à la poudrière. En armant les forces pro-pakistanaises dans la région, cela provoquerait une instabilité et mettrait l'Inde sous pression si nous devions leur exiger nos revendications."

 KMT_70s_Demand_South_Tibet:0 "Exigez le sud du Tibet"
 KMT_70s_Demand_South_Tibet_desc:0 "Le temps est venu de réunir les Indiens à la table et d'exiger la restitution de nos anciens territoires. Nous sommes prêts à donner beaucoup, mais nous ne repartirons pas les mains vides. Si les Indiens ne cèdent pas, nous devrons peut-être envisager de recourir à la force meurtrière contre eux."

 KMT_70s_Soviet_Relations:0 "Relations sino-soviétiques"
 KMT_70s_Soviet_Relations_desc:0 "Les relations entre l'URSS et la Chine sont difficiles. Ils ont soutenu le PCC et l'ont aidé lors de son ascension dans la république, mais ils ont également soutenu notre effort de guerre contre l'invasion japonaise. Cependant l'occupation de la Mandchourie et leur aide au PCC pendant la guerre civile ont gravement endommagé nos relations."

 KMT_70s_Soviet_Detente:0 "Rechercher la détente avec Moscou"
 KMT_70s_Soviet_Detente_desc:0 "Peut-être devrions-nous nous rapprocher de l'URSS et tenter d'apaiser les tensions entre nos nations. Après tout, malgré notre rivalité idéologique, aucun conflit militaire avec l'URSS ne nous intéresse."

 KMT_70s_Soviet_Detente_Tuva:0 "Reconnaître la domination soviétique sur Touva"
 KMT_70s_Soviet_Detente_Tuva_desc:0 "La région de Touva fait partie de la Russie depuis la révolution Xinhai. Les personnes qui y vivent ne sont plus liées à l'influence mongole ou chinoise et toute revendication sur le territoire est donc inutile et n'est qu'une autre source potentielle de conflits avec l'URSS. Nous renoncerons à nos prétentions sur la région."

 KMT_70s_Trade_with_USSR:0 "Établir des relations commerciales"
 KMT_70s_Trade_with_USSR_desc:0 "Nous devrions utiliser le marché soviétique. Tous ces gens qui ont besoin de biens de première nécessité et des diverses ressources de l'URSS comme le pétrole pourraient s'avérer plus utiles que des relations hostiles. Après tout, nous ne voulons pas gâcher une bonne opportunité financière."

 KMT_70s_Reperations_for_deported_Chinese:0 "Indemnisation pour les Chinois expulsés"
 KMT_70s_Reperations_for_deported_Chinese_desc:0 "Entre les années 1920 et 1940, de nombreux Chinois vivant à l'extrême est de la Russie ont été déportés de cette région vers les différentes régions des seigneurs de guerre de Chine. Avec l'apaisement des tensions entre nous et Moscou, nous pourrions essayer de les approcher et peut-être exiger des excuses et des compensations pour les victimes de ces expulsions."

 KMT_70s_invest_into_eastern_block:0 "Investir dans le bloc de l'Est"
 KMT_70s_invest_into_eastern_block_desc:0 "Pourquoi se limiter à l'URSS ? Nous élargirons nos activités économiques et investirons dans les entreprises les plus importantes des différents pays du Pacte de Varsovie."


 KMT_70s_Soviet_Rivalry:0 "Maintenir le cap actuel"
 KMT_70s_Soviet_Rivalry_desc:0 "Notre histoire récente a montré qu'on ne peut jamais faire confiance aux Soviétiques. Il serait inutile d'essayer de coopérer avec eux car ils profiteraient de la première opportunité pour affaiblir notre régime et tenter de rétablir le régime communiste en Chine."

 KMT_70s_accept_soviet_enemies:0 "Offrir un refuge aux ennemis politiques"
 KMT_70s_accept_soviet_enemies_desc:0 "Les Soviétiques tentent de réduire au silence et d'arrêter tous ceux qui s'expriment contre le système communiste pourri. Nous accueillerons à bras ouverts ces personnes opprimées et leur offrirons l'asile dans notre pays."

 KMT_70s_demand_Tanu_Tuva:0 "Exiger Touva"
 KMT_70s_demand_Tanu_Tuva_desc:0 "Les Soviétiques occupent l'ancienne région chinoise de Touva depuis la révolution Xinhai. Nous n'avons jamais reconnu le règne russe sur la région, mais suite au chaos de la révolution, nous n'étions pas en mesure de le reprendre, encore moins la Mongolie. C'est notre droit de ramener la province aux frontières chinoises."

 KMT_70s_Japanese_relations:0 "Notre ancien ennemi"
 KMT_70s_Japanese_relations_desc:0 "La première moitié du XXe siècle et la Seconde Guerre mondiale ont pratiquement détruit toutes les relations que notre pays entretenait avec les Japonais. Les horreurs des crimes commis par les Japonais pendant la guerre sont encore fraîches dans l'esprit du peuple. Mais nous devons quand même aller de l'avant et reconnaître que le Japon est désormais une nation transformée et que ses relations étroites avec les États-Unis le placent idéologiquement davantage dans notre sphère. Nous devrions nous préparer à signer un traité de paix officiel qui normaliserait les relations entre Pékin et Tokyo."

 KMT_70s_Forgive_Japan:0 "Pardonnez les crimes japonais"
 KMT_70s_Forgive_Japan_desc:0 "Les temps ont changé et les Japonais aussi. Si nous voulons aller de l'avant et améliorer nos relations, nous ne devons pas associer aujourd'hui tous les Japonais aux criminels de la Seconde Guerre mondiale. Bien sûr, nous ne pouvons pas oublier que cela s'est produit, mais cela ne devrait pas constituer un obstacle majeur au rétablissement des relations entre nos nations."

 KMT_70s_Demand_Japanese_Reperations:0 "Exiger des réparations"
 KMT_70s_Demand_Japanese_Reperations_desc:0 "Les crimes des Japonais ont causé tant de tort et de souffrance à de nombreuses familles chinoises. Le viol de Nanjing, la bataille de Shanghai, l'unité 731... Nous exigerons des réparations pour leurs crimes et des compensations pour les victimes de leur cruauté."

 KMT_70s_Sign_Joint_Communique:0 "Signez le communiqué conjoint"
 KMT_70s_Sign_Joint_Communique_desc:0 "Nous signerons un traité avec Tokyo afin de rétablir et de normaliser les relations diplomatiques entre le Japon et la République de Chine. Nous cherchons à maintenir la paix en Asie de l'Est, à mettre enfin fin aux relations anormales entre nos deux pays et à résoudre enfin la question des réparations de guerre."

 KMT_70s_cooperate_with_japanese_Firms:0 "Coopérer avec des entreprises japonaises"
 KMT_70s_cooperate_with_japanese_Firms_desc:0 "Le marché japonais s'est avéré offrir de nombreuses avancées technologiques. Panasonic, Sony... Vous l'appelez. Nous devrions coopérer avec ces entreprises pour maximiser notre efficacité et encourager l'innovation."

 KMT_70s_pact_relations:0 "Renforcer le Traité de Nanjing"
 KMT_70s_pact_relations_desc:0 "Notre alliance s'est élargie au cours de la dernière décennie. La Corée, le Vietnam, la Mongolie et le Xinjiang sont tous tombés dans notre sphère d'influence. Nous devons redoubler d'efforts pour renforcer notre alliance politiquement et économiquement afin de maintenir notre position dominante en Asie de l'Est."

 KMT_70s_treaty_of_equals:0 "Un traité d'égaux"
 KMT_70s_treaty_of_equals_desc:0 "Nous ne cherchons pas à exploiter nos frères frères pour notre propre bénéfice. Nous réorganiserons notre Traité d'une alliance militaire à une organisation institutionnelle similaire à la Communauté européenne. Nous diminuerons notre influence sur les États membres et tenterons de toucher davantage de gouvernements de la région partageant les mêmes idées."

 KMT_70s_recall_chinese_officals:0 "Rappel des membres du KMT"
 KMT_70s_recall_chinese_officals_desc:0 "Divers membres du KMT ont été envoyés chez nos alliés pour influencer leur gouvernement afin de le rapprocher davantage de notre politique. Mais avec notre nouvelle approche du Traité de Nanjing, nous ne souhaitons pas nous mêler de la politique intérieure des autres nations. Nous rappellerons nos responsables en Chine afin que nos alliés puissent décider de leur propre politique."

 KMT_70s_grant_loans:0 "Accorder des prêts à la reconstruction"
 KMT_70s_grant_loans_desc:0 "Beaucoup de nos alliés ont connu diverses guerres et conflits causant destruction et souffrance dans les territoires qu'ils administrent aujourd'hui. Nous leur accorderons des prêts pour les aider à se reconstruire et à rétablir la stabilité dans ces pays."

 KMT_70s_decentralised_army_command:0 "Commandement militaire décentralisé"
 KMT_70s_decentralised_army_command_desc:0 "Alors que le Kuomintang a pris le commandement des troupes coréennes et vietnamiennes pendant la guerre anticommuniste, nous devrions inverser notre structure afin que les gouvernements respectifs aient à nouveau le contrôle de leurs armées. Cela évitera toute tentative de coup d'État de la part des forces pro-chinoises au sein du pacte."

 KMT_70s_establish_treaty_institutions:0 "Établir des institutions de traités"
 KMT_70s_establish_treaty_institutions_desc:0 "Nous réformerons le Traité de Nanjing pour qu'il devienne une organisation supranationale régionale au lieu d'un pur traité défensif. Nous nous modèlerons sur les institutions de la Communauté européenne dans le but d'établir une union économique unie pour l'Asie de l'Est."

 KMT_70s_invite_more_countries:0 "Élargir le Traité de Nanjing"
 KMT_70s_invite_more_countries_desc:0 "Nous devrions encourager davantage de pays d'Asie de l'Est partageant les mêmes idées à rejoindre notre sphère. Nous élargirons notre champ de développement économique et établirons davantage de dépendances, ce qui réduira considérablement le risque de conflits dans la région. Envoyons les invitations !"

 KMT_70s_tight_hand:0 "Une main serrée"
 KMT_70s_tight_hand_desc:0 "Afin de tirer le meilleur parti du Traité, nous devons maintenir notre position dominante. L'influence dans d'autres pays signifie tout dans le domaine des relations internationales et nous devons tirer parti de ce fait pour influencer les différents autres membres du traité."

 KMT_70s_centralised_army_command:0 "Commandement centralisé de l'armée"
 KMT_70s_centralised_army_command_desc:0 "Le Kuomintang a pris le commandement des troupes coréennes et vietnamiennes pendant la guerre anticommuniste. Nous devons conserver cette structure afin de rester la force dominante en Asie de l'Est. Les armées restent l'acteur de veto le plus important dans un pays et les contrôler nous donnera encore plus d'influence dans nos États membres."

 KMT_70s_reinforce_chinese_influence:0 "Renforcer l'influence chinoise"
 KMT_70s_reinforce_chinese_influence_desc:0 "Nous continuerons d'envoyer davantage d'espions et de responsables du KMT dans nos États membres dans le but d'infiltrer leurs gouvernements et d'acquérir plus d'influence sur leur programme politique."

 KMT_70s_chinese_companies_in_allied_markets:0 "Influence économique chinoise"
 KMT_70s_chinese_companies_in_allied_markets_desc:0 "Nous laisserons nos grandes entreprises investir dans nos États membres pour y étendre leur influence et, à terme, rendre ces États dépendants de nous."

 KMT_70s_treaty_ports:0 "Les ports du traité"
 KMT_70s_treaty_ports_desc:0 ""

 KMT_70s_buy_treaty_ports:0 "Acheter Hong Kong et Macao"
 KMT_70s_buy_treaty_ports_desc:0 "Même si le bail officiel se poursuivra jusque dans les années 1990, nous pourrions peut-être demander aux Britanniques et aux Portugais s'ils sont prêts à restituer les ports plus tôt en échange d'argent. En raison de la décolonisation, les deux pays connaissent diverses difficultés économiques."
 #Events#

 #KMT on Taiwan 50s Events#

 roc.1.t:0 "Chiang Kai-shek reprend la présidence"
 roc.1.d:0 "Le temps presse pour le président Li Zongren. Après la démission du généralissime Chiang face aux diverses victoires communistes sur le continent, lui et ses partisans en ont désormais assez des ambitions et de la politique de Li Zongren. Li et Chiang n'ont jamais été en bons termes et leur rivalité s'est avérée désastreuse pour la direction du KMT pendant la guerre civile, divisant davantage le parti et l'état-major de l'armée et permettant ainsi aux communistes d'avancer davantage dans les zones nationalistes. Li s'est rendu aux États-Unis et a discrédité le généralissime en le qualifiant de « dictateur » et d'« usurpateur » et prétendant revenir pour écraser le mouvement de Chiang. Chiang Kai-shek a désormais repris ses fonctions de président de la République de Chine, aux côtés de son ami de longue date Chen Cheng, en remplacement de l'ancien Premier ministre Yan Xishan."
 roc.1.a:0 "Bon retour !"

 KMT_Taiwan50s.1.t:0 "Sun Li-jen prend le pouvoir"
 KMT_Taiwan50s.1.d:0 "Au cours des derniers mois, Sun Li-jen, vétéran de la Seconde Guerre mondiale et célèbre héros de guerre, a montré divers signes d'insatisfaction à l'égard de la structure gouvernementale du généralissime du règne du Kuomintang à Taiwan. Formé en Virginie, il est l'associé le plus proche de Washington dans la République et s'est opposé aux réformes du parti léniniste qui se concentrent sur la pénétration de la société et de l'armée au niveau politique pour garantir la loyauté. Grâce à ses relations avec les États-Unis et à ses réformes réussies dans l'armée, il a acquis suffisamment d'influence et de soutien pour renverser le gouvernement de Chiang Kai-shek. Dans la matinée, il entra dans le palais présidentiel aux côtés de ses fidèles bataillons, désarmant les gardes locaux et relevant le généralissime de ses fonctions. Le général Sun s'est désormais déclaré président provisoire de la République jusqu'à ce qu'un nouveau gouvernement puisse être formé. Les États-Unis n'ont pas donné de réponse officielle à cet événement, mais on peut supposer que Washington était au courant des récents développements à Taipei."
 KMT_Taiwan50s.1.a:0 "Mon allégeance est à la République, à la démocratie !"

 KMT_Taiwan50s.2.t:0 "La sinisation de Taiwan"
 KMT_Taiwan50s.2.d:0 "Il y a plus de cinquante ans, la dynastie Qing a cédé l'île de Taiwan à l'Empire japonais après sa défaite lors de la première guerre sino-japonaise de 1895. Aujourd'hui, l'Empire étant vaincu par nos mains, Taiwan est enfin de nouveau sous souveraineté chinoise.\n\nIl reste cependant beaucoup à faire pour guérir la population taïwanaise des maladies de la colonisation et de la nationalisation japonaises. Nous transformerons l'île en un modèle de véritable province chinoise moderne, respectant les Trois principes du peuple, démontrant que seule la vision du Dr Sun peut sauver la Chine et non l'impérialisme soviétique."
 KMT_Taiwan50s.2.a:0 "Mort à l'impérialisme !"

 KMT_Taiwan50s.3.t:0 "L'importance du nouveau confucianisme"
 KMT_Taiwan50s.3.d:0 "Le grand Maître a dit un jour : « L'incapacité à cultiver le pouvoir moral, l'incapacité à explorer ce que j'ai appris, l'incapacité à maintenir ce que je sais être juste, l'incapacité à réformer ce qui n'est pas bon - telles sont mes inquiétudes. »\n\nLorsque le Kuomintang régnait sur le continent, celui-ci était malade, pourri jusqu'à la moelle et rempli d'opportunisme, de corruption et de divers autres individus égoïstes qui ne croyaient pas à la cause du mouvement révolutionnaire national. Afin d'éviter un tel développement à Taiwan, nous commencerons à introduire les enseignements de Confucius dans les institutions éducatives et gouvernementales, en mettant l'accent sur l'autoréflexion et l'autocritique, en encourageant notre peuple à revoir ses actions pour savoir si elles sont bénéfiques à la République. Tout le monde n'est pas parfait, pas même notre bien-aimé président, mais montrer qu'il reste fidèle aux normes et aux valeurs de Confucius et de la révolution augmentera considérablement le soutien populaire à ces enseignements."
 KMT_Taiwan50s.3.a:0 "Une sage leçon."

 KMT_Taiwan50s.4.t:0 "Le problème de la langue"
 KMT_Taiwan50s.4.d:0 "Lorsque nous sommes arrivés à Taiwan, l'influence japonaise était fortement intégrée à la société taïwanaise. Cependant, on peut supposer que les Japonais ont mené de grandes campagnes culturelles pour promouvoir la langue japonaise et sanctionner l'usage des langues locales. La population autochtone de Taiwan partage une diversité en termes de langues locales, mais le gouvernement du Kuomintang est désormais confronté à la question de savoir s'il doit également suivre la voie japonaise et interdire les langues locales et mettre l'accent sur le mandarin ou tolérer l'usage des langues locales. D'une part, nous obtiendrons un soutien populaire plus important de la part de la population autochtone, mais si le mandarin ne se répand pas davantage sur l'île, transformer Taiwan en un modèle de province chinoise moderne s'avérera plus difficile et nous isolera davantage de la culture et des traditions chinoises, ce qui diminuera notre crédibilité et notre légitimité en tant que gouvernement unique de la Chine."
 KMT_Taiwan50s.4.a:0 "Interdisez toutes les langues locales !"
 KMT_Taiwan50s.4.b:0 "Interdire uniquement le japonais et mettre l'accent sur l'usage du mandarin dans les institutions publiques."
 KMT_Taiwan50s.4.c:0 "Accorder la liberté de langue."

 KMT_Taiwan50s.5.t:0 "[GetNewspaperHeader]La voix de la Chine libre sur le continent"
 KMT_Taiwan50s.5.d:0 "Aujourd'hui, la Société de radiodiffusion chinoise a fait son chemin vers le continent chinois depuis Taiwan en contournant la forte emprise du Parti communiste chinois sur les stations de radiodiffusion. La Voix de la Chine libre est une station de radio internationale de la République de Chine qui a fonctionné à partir du 10 octobre 1949 et a depuis servi de source de propagande à la République de Chine qui a attaqué la station centrale de radiodiffusion populaire et China Radio International et a dénoncé l'illégitimité du gouvernement communiste sur le continent. Le département de radiodiffusion à l'étranger de la China Broadcasting Corporation a officiellement commencé à diffuser vers le monde extérieur sous l'indicatif d'appel « Voix de la Chine libre ». Au départ, c'était uniquement en chinois et en anglais. Et des émissions japonaises, puis du coréen, du français, de l'allemand, de l'espagnol, du russe, de l'arabe, du vietnamien, de l'indonésien et d'autres langues. Il est clair que l'infiltration de la propagande des nationalistes chinois sur le continent ne sera pas bien accueillie par les communistes chinois."
 KMT_Taiwan50s.5.a:0 "La guerre de propagande en Chine continue."
 KMT_Taiwan50s.5.b:0 "Les compatriotes du continent doivent entendre cela !"
 KMT_Taiwan50s.5.c:0 "Propagande bourgeoise !" 

 KMT_Taiwan50s.6.t:0 "Le rapport économique"
 KMT_Taiwan50s.6.d:0 "Le ministère des Affaires économiques est arrivé à la conclusion que le gouvernement doit prendre des mesures drastiques pour stabiliser la situation économique actuelle sur l'île de Taiwan, allant des politiques d'inflation aux politiques agricoles qui auront également un impact crucial sur la contribution politique et les réactions des citoyens de la République.\n\nLe Comité central de réforme est arrivé à la conclusion que favoriser les propriétaires fonciers et ignorer les revendications des paysans était un facteur majeur dans la chute de la gouvernance nationaliste sur le continent. Chen Cheng, ancien gouverneur de Taiwan et ami de longue date de Chiang Kai-shek, a suggéré d'introduire diverses réformes agraires basées sur l'indemnisation et la médiation, contrairement aux méthodes d'expropriation des réformes agraires marxistes en Russie, en Allemagne de l'Est et sur le continent occupé. Nous adapterons ses conseils et commencerons à redistribuer les terres des propriétaires taïwanais et à les transmettre aux paysans tout en offrant aux anciens propriétaires des fonds gouvernementaux et des positions politiques locales.\n\nNos experts économiques ont également formulé des propositions pour faire face à la crise inflationniste actuelle que nous avons apportée du continent. Heureusement, de nombreux projets mettant l'accent sur les réformes monétaires pour freiner l'hyperinflation avaient déjà commencé avant cela."
 KMT_Taiwan50s.6.a:0 "Commençons."

 KMT_Taiwan50s.7.t:0 "Une rencontre à Taipei"
 KMT_Taiwan50s.7.d:0 "Dans la matinée à Taipei, [CHI.GetLeader] attendait le Premier ministre, qui s'est révélé être un allié précieux du président grâce à ses campagnes réussies de réforme agricole et fiscale. Lorsque le Premier ministre entra dans la pièce, [CHI.GetLeader] fut surpris d'être accompagné d'un autre homme d'âge moyen. Il s'est présenté au président sous le nom de Yin Zhongrong, un membre du cabinet qui a été invité au Kuomintang par le président Li Zongren en 1949, occupant jusqu'à présent les fonctions de vice-président du comité de gestion de la production du district de Taiwan et de président du Central Trust of China Bank. Il a également joué un rôle important lors du transfert des réserves d'or du continent vers Taiwan et a été responsable de la planification et de l'utilisation des fonds d'aide américains à la république. Le Premier ministre affirme que, bien que Sir K. Y. Yin ne soit pas membre du Kuomintang, il devrait être notre prochain ministre des Affaires économiques. Son expérience au sein d'anciennes entreprises privées sur le continent et son idée d'une « économie de marché planifiée », axée sur la substitution des importations et des politiques orientées vers l'exportation, pourraient s'avérer bénéfiques pour notre gouvernement, car nous devons construire une économie prospère pour transformer Taiwan en un modèle moderne de province chinoise.\n[CHI.GetLeader] est d'accord avec ses arguments et tend la main à Sir Yin."
 KMT_Taiwan50s.7.a:0 "M. Yin, nous suivrons votre carrière avec beaucoup d'intérêt."

 KMT_Taiwan50s.8.t:0 "Les dispositions temporaires"
 KMT_Taiwan50s.8.d:0 "Lorsque la Constitution de la République de Chine a été rédigée et adoptée par l'Assemblée nationale en 1947, elle a suscité une grande joie et de grands espoirs au sein du gouvernement de pouvoir enfin stabiliser la Chine et entamer la troisième phase de la révolution du Dr Sun Yat-sens, appelant au progrès du constitutionnalisme. Cependant, les avancées rapides du Parti communiste sur le continent et les désertions massives nous ont obligés à suspendre la Constitution et à établir la loi martiale dans la République jusqu'au retour de la stabilité et de l'ordre. Alors que le PCC occupe le continent chinois et proclame un nouveau gouvernement, il est tout à fait naturel que l'Assemblée nationale approuve le renouvellement des dispositions jusqu'à ce que le continent soit complètement libéré des bandits communistes."
 KMT_Taiwan50s.8.a:0 "Nous reviendrons."

 KMT_Taiwan50s.9.t:0 "La formation du Comité central de réforme"
 KMT_Taiwan50s.9.d:0 "Le généralissime Chiang estime que la cause de la défaite dans la guerre civile ne vient pas de la force militaire, mais de la désunion bureaucratique et institutionnelle. Chiang a précisé que, pour attirer des membres supérieurs, « le calendrier de réforme devrait souligner l'importance du parti en tant que nouvelle organisation, avec de nouvelles lignes directrices, de nouvelles exigences et de nouvelles tâches ». Notre objectif est de vaincre les factions au sein du Kuomintang en mettant sur la touche les différentes cliques qui ont désormais perdu leur influence, mais aussi en prenant soin des vétérans peu coopératifs du parti.\n\nLe Généralissime a déclaré ce qui suit lors d'une réunion privée avec Chen Cheng : \n\n« Les membres du parti sont devenus impolis et déraisonnables. Dans leur esprit, ils ne se soucient plus de la survie du parti et de l'État. Je dois me concentrer sur la tâche de rectifier le parti afin qu'il puisse survivre. Sans une réforme complète du parti, il n'y aura aucun espoir de sauver notre nation.\n\nNous transformerons le Kuomintang en l'entité politique unie qu'il était à l'époque du Premier Front uni. Nous nous concentrerons particulièrement sur la mise à l'écart des fonctionnaires corrompus et peu coopératifs, ainsi que sur la fin du factionnalisme partisan et du recrutement de la population locale taïwanaise."
 KMT_Taiwan50s.9.a:0 "Mettre l'accent sur l'endoctrinement idéologique"
 KMT_Taiwan50s.9.b:0 "Mettre l'accent sur les campagnes anti-corruption"
 KMT_Taiwan50s.9.c:0 "Mettre l'accent sur l'obtention d'un soutien local"

 KMT_Taiwan50s.10.t:0 "Les trois principes du peuple"
 KMT_Taiwan50s.10.d:0 "Les Trois principes du peuple, également connus sous le nom de doctrine San-min ou tridémisme, constituent la principale philosophie politique du Kuomintang, développée par le père de la révolution nationale, le Dr Sun Yat-sen. Ils servent de lignes directrices pour améliorer la Chine pendant l'ère républicaine et peuvent être brièvement résumés comme « Démocratie, nationalisme et protection sociale ».\n\nMinzu, le premier principe, prône le développement d'une identité nationale plutôt qu'une identité ethnique et appelle à l'indépendance de l'ensemble du peuple chinois face aux menaces impérialistes extérieures et au régime minoritaire interne.\n\nMinquan, souvent traduit par Démocratie, soutient le droit du peuple chinois d'exprimer ses opinions politiques et de contrôler les postes administratifs, qui est représenté par l'Assemblée nationale. Ces droits comprennent le droit de vote, le droit de révocation, le droit d'initiative et le droit d'organiser un référendum. Le système politique doit être divisé en cinq branches distinctes au lieu de trois seulement. L'État est divisé en un Yuan législatif, exécutif, judiciaire, de contrôle et d'examen, alliant la pensée montesquieuenne à la tradition chinoise.\n\nMinsheng, souvent traduit par Bien-être du Peuple, se concentre sur quatre domaines : l'habillement, l'alimentation, le logement et la mobilité. Ce principe est également fortement influencé par les pensées d'Henry George, appelant à la taxation des terres comme « le seul moyen de soutenir le gouvernement est un impôt infiniment juste, raisonnable et équitablement réparti, et c'est sur lui que nous fonderons notre nouveau système ».\n\nSur le continent, nous n'avons pas réussi à mettre en oeuvre ces principes, mais à partir de maintenant, nous consacrerons toutes nos ressources et tous nos efforts à l'achèvement de la révolution nationale selon les Trois principes du peuple."
 KMT_Taiwan50s.10.a:0 "Nous insisterons sur Minzu. Unis, nous sommes debout."
 KMT_Taiwan50s.10.b:0 "Minquan sera d'abord amené au peuple."
 KMT_Taiwan50s.10.c:0 "Minsheng nous apportera un soutien plus populaire."

 KMT_Taiwan50s.11.t:0 "Évaluation des réformes du parti"
 KMT_Taiwan50s.11.d:0 "Aujourd'hui, le Kuomintang tient son premier congrès depuis la perte de la partie continentale de la Chine et a officiellement annoncé la dissolution du Comité central de réforme, le généralissime Chiang et le premier ministre Chen dirigeant désormais le Kuomintang et mettant à l'écart toutes les factions politiques restantes. Grâce aux efforts de réforme, un nouveau régime politique a été établi et, même si nous n'avons pas encore pu reprendre le continent, nous avons réussi à transformer le Kuomintang vaincu et démoralisé en un nouveau parti politique inclusif. Le Comité de réforme a réussi à établir une nouvelle direction du parti composée de cadres jeunes et talentueux tout en donnant au KMT une identité et un objectif, ainsi qu'en créant diverses écoles de cadres pour former les membres du parti afin de pénétrer et de restructurer efficacement la société, l'économie et le système politique."
 KMT_Taiwan50s.11.a:0 "L'ère de l'autoritarisme éclairé a commencé."

 KMT_Taiwan50s.12.t:0 "Mise en place d'une équipe de planification"
 KMT_Taiwan50s.12.d:0 "Le président [CHI.GetLeader] a appelé ses plus proches alliés au sein de l'armée républicaine pour leur faire part des développements au sein des forces armées suite aux réformes des derniers mois. L'état-major estime que \"l'armée républicaine est prête à résister à toute attaque imminente provenant des zones occupées par les communistes\" et a assuré au président que Formose était prête à toute sorte d'attaque que l'APL pourrait lancer. Le Président a souri et a annoncé à ses camarades que la deuxième phase de son plan serait planifiée et organisée très prochainement."
 KMT_Taiwan50s.12.a:0 "La libération du continent est inévitable."

 KMT_Taiwan50s.13.t:0 "La réélection du généralissime Chiang"
 KMT_Taiwan50s.13.d:0 "Aujourd'hui, au Chung-Shan Hall de Taipei, le généralissime Chiang Kai-shek a été réélu président par l'Assemblée nationale de la République de Chine. Bien que l'élection ne doive pas se dérouler par le biais du vote populaire, elle est menée par les délégués des provinces chinoises qui ont formé la première Assemblée nationale en 1947, agissant en tant que représentants de l'ensemble de la Chine. Le président Chiang continuera à servir de président et de commandant en chef de la République, qui nous guidera à travers ces temps désespérés et récupérera le continent occupé des bandits communistes."
 KMT_Taiwan50s.13.a:0 "Wansui !"

 KMT_Taiwan50s.14.t:0 "Construire la démocratie par le bas"
 KMT_Taiwan50s.14.d:0 "Afin de renforcer la légitimité du parti, nous devons introduire diverses réformes politiques locales avec le concept de « démocratie révolutionnaire flexible ». En autorisant des élections démocratiques limitées au niveau local, nous élargirons la base sociale du Kuomintang et introduirons lentement la République dans le long processus de démocratisation, commençant au niveau local et se terminant finalement au niveau national. Bien que ces élections aient pour objectif d'être justes et compétitives, nous les surveillerons de près et interviendrons si des espions anti-révolutionnaires et communistes prennent de l'importance dans nos provinces locales."
 KMT_Taiwan50s.14.a:0 "Vers le deuxième principe."

 KMT_Taiwan50s.144.t:0 "Construire la démocratie par le bas"
 KMT_Taiwan50s.144.d:0 "Afin de renforcer la légitimité de la structure politique républicaine, nous devons introduire diverses réformes politiques locales avec le concept de démocratie libérale directe. En autorisant des élections démocratiques au niveau local, telles que les élections du maire et du conseil municipal, nous augmenterons notre base de partisans et introduirons lentement la République dans le processus de démocratisation, en commençant par le niveau local et en terminant finalement au niveau national. Ces élections doivent être équitables et compétitives, c'est pourquoi nous ne les surveillerons pas d'aussi près et éviterons toute ingérence, même si une certaine opposition remporte le vote populaire."
 KMT_Taiwan50s.144.a:0 "Vers le deuxième principe."

 KMT_Taiwan50s.15.t:0 "Lei Chen expulsé du Kuomintang"
 KMT_Taiwan50s.15.d:0 "Suite à nos récentes campagnes de censure contre les éléments déloyaux au sein de la République, le Comité permanent du Kuomintang a décidé d'expulser du Kuomintang Lei Chen, fondateur et directeur du journal « Chine libre ». Son journal présentait diverses idées politiques qui constituent une menace sérieuse pour notre gouvernement, notamment l'autonomie autochtone, les élections démocratiques et l'abolition du parti unique. Initialement anticommuniste, le journal a constaté une forte montée des valeurs séparatistes et a dénoncé à de nombreuses reprises le gouvernement du KMT, critiquant l'absence de constitutionnalisme et l'extension de la loi martiale. Afin de sauvegarder la stabilité et l'ordre, le gouvernement a décidé d'exclure Lei du parti et a placé la Chine libre sous étroite surveillance."
 KMT_Taiwan50s.15.a:0 "Tout ce qu'ils sont, c'est de la poussière dans le vent."

 KMT_Taiwan50s.16.t:0 "Le rapport sur la Chine libre"
 KMT_Taiwan50s.16.d:0 "Au cours des derniers mois, le célèbre journal « Chine libre », dirigé par Hu Shih et publié par Lei Chen, a connu une augmentation significative du nombre d'exemplaires vendus. Nos responsables rapportent que les Taiwanais d'origine partagent un grand intérêt pour le journal, en particulier pour les articles sur l'autonomie, les réformes démocratiques et une coopération plus étroite entre les réfugiés du continent et la population indigène de Taiwan pour construire une société démocratique chinoise moderne. Bien que ces idées soient absurdes aux yeux du gouvernement du Kuomintang, la fermeture du journal entrerait en conflit avec notre politique de censure douce et contrarierait les abonnés locaux, déstabilisant encore davantage le pays."
 KMT_Taiwan50s.16.a:0 "Surveillez de près le journal..."

 KMT_Taiwan50s.17.t:0 "La montée du Parti démocratique chinois"
 KMT_Taiwan50s.17.d:0 "Lorsque la traîtresse Armée populaire de libération s'est emparée du continent chinois, les différents esprits sino-libéraux de la République, formés aux États-Unis d'Amérique, se sont enfuis à Taipei aux côtés du Kuomintang. Mécontent du régime autoritaire du KMT à Taiwan, un cercle autour de l'ancien membre du parti Lei Chen, comprenant de célèbres universitaires et hommes politiques chinois et taïwanais tels que Hu Shih, Hsu-Shih-hsien, Huang Hua et Wellington Koo, a critiqué le gouvernement pour ses mesures autoritaires et sa répression contre la population indigène. En réponse, Lei Chen a organisé un nouveau mouvement politique qu'il appelle le « Parti démocratique chinois », exigeant des réformes démocratiques, une coopération plus étroite entre les continentaux et les Taiwanais d'origine et un anticommunisme pacifique. Ce nouveau parti a grandi à un point tel qu'il ne peut plus être ignoré par notre gouvernement et nous devons décider comment aborder ce récent développement. Nous pourrions essayer d'inviter le CDL au gouvernement, mais nous risquons de perdre notre soutien et notre légitimité pour l'inévitable récupération du continent occupé, ce qui pourrait grandement menacer notre position de seul gouvernement légitime de la Chine. Cependant, la dissolution forcée du parti provoquerait de grandes dissensions au sein des factions démocratiques et autochtones non seulement du Kuomintang mais aussi dans toute la zone libre de la République de Chine, étant donné que même des personnes influentes au sein du Kuomintang appellent Chiang à respecter la constitution et à ne pas briguer un autre mandat."
 KMT_Taiwan50s.17.a:0 "Contactez le CDP"
 KMT_Taiwan50s.17.b:0 "Assez de ce clowncircus ! Arrêtez-le."

 KMT_Taiwan50s.18.t:0 "Élargir les conditions du Yuan législatif"
 KMT_Taiwan50s.18.d:0 "Lorsque le peuple chinois a finalement été autorisé à jouir de son droit de vote, le premier Yuan législatif en vertu de la Constitution de la République de Chine de 1947 s'est réuni en 1948, composé de 759 représentants des provinces chinoises, avec plus de la moitié desdits mandats se retirant à nos côtés à Taiwan. Afin de maintenir notre légitimité en tant que gouvernement unique de la Chine, nous ne pouvons autoriser aucune nouvelle élection tant que le continent n'est pas enfin libéré des bandits communistes. Autrement, aucun cercle de représentants élus dans la zone libre de la République ne représenterait les intérêts et les désirs de l'ensemble de la population chinoise. Et à cause de ce raisonnement, le gouvernement du Kuomintang a décidé de reporter l'élection du Yuan législatif, gardant aux commandes l'ancien cercle représentatif du continent."
 KMT_Taiwan50s.18.a:0 "C'est pour le bien de la République."

 KMT_Taiwan50s.19.t:0 "Le sort de la famille Chiang"
 KMT_Taiwan50s.19.d:0 "Avec la destitution du généralissime et de son fils, la junte est confrontée à la question de savoir quoi faire des deux Tchiang et de leur famille et quel rôle ils doivent jouer désormais. Bien que diverses voix s'élèvent pour réclamer soit un exil aux États-Unis, soit une assignation à résidence, Chiang Kai-shek jouit toujours d'un grand prestige au sein du Kuomintang, même en dehors de sa faction, en raison de ses réalisations lors de l'Expédition du Nord, des débuts de la guerre civile et de la Guerre de Résistance en tant que symbole principal de la résistance chinoise contre l'impérialisme japonais. A ce titre, le gouvernement provisoire décide que Chiang Kai-shek et sa famille..."
 KMT_Taiwan50s.19.a:0 "...sera exilé aux États-Unis."
 KMT_Taiwan50s.19.b:0 "...doivent être assignés à résidence."
 KMT_Taiwan50s.19.c:0 "...peuvent rester à Taipei en tant que citoyens ordinaires."

 KMT_Taiwan50s.20.t:0 "Le débat vice-présidentiel"
 KMT_Taiwan50s.20.d:0 "Avec le retrait de Chiang Kai-shek du pouvoir, la junte discute désormais de la question de savoir qui devrait désormais assumer les autres rôles politiques importants pour le moment. Il a été rapidement convenu que l'ancien Premier ministre Yan Xishan reviendrait en tant que Premier ministre provisoire, mais la position de vice-président de la République attise les tensions au sein de la junte.\nLa première option serait l'allié le plus proche de Sun Li-jen et commandant de division, Kuo Ting-liang, qui est au service du président depuis les campagnes de Birmanie pendant la Seconde Guerre mondiale et dont ses positions anticommunistes et pro-américaines font de lui le candidat préféré de nos alliés à Washington.\nCependant, divers responsables du gouvernement provisoire ont vu le potentiel des réformes de Chen Cheng au cours de son mandat sous Chiang Kai-shek et estiment que, sous haute surveillance, Chen continuera à se révéler un homme politique pragmatique et réaliste pour notre gouvernement, mais son ancienne alliance et son amitié avec le généralissime font douter Washington et les voix libérales au sein de la République.\nWu Guozhen est le candidat favori de l'aile libérale du Kuomintang, qui milite en faveur d'une plus grande autonomie gouvernementale pour le peuple taïwanais, d'élections locales basées sur le vote populaire, ainsi que d'une réduction de la brutalité policière, tout en s'opposant à la politique de style russe de Chiang Ching-kuo et au régime autoritaire à parti unique de Chiang Kai-shek.\n\nAprès mûre réflexion et consultation, le gouvernement provisoire choisit..."
 KMT_Taiwan50s.20.a:0 "Chen Cheng maintiendra sa position."
 KMT_Taiwan50s.20.b:0 "Kuo Ting-liang deviendra vice-président par intérim."
 KMT_Taiwan50s.20.c:0 "Wu Guozhen, ancien maire de Shanghai."

 KMT_Taiwan50s.22.t:0 "Le débat vice-présidentiel"
 KMT_Taiwan50s.22.d:0 "Avec le retrait de Chiang Kai-shek du pouvoir, la junte discute désormais de la question de savoir qui devrait désormais assumer les autres rôles politiques importants pour le moment. Il a été rapidement convenu que l'ancien Premier ministre Yan Xishan reviendrait en tant que Premier ministre provisoire, mais la position de vice-président de la République attise les tensions au sein de la junte.\nLa première option serait l'allié le plus proche de Sun Li-jen et commandant de division, Kuo Ting-liang, qui est au service du président depuis les campagnes de Birmanie pendant la Seconde Guerre mondiale et dont ses positions anticommunistes et pro-américaines font de lui le candidat préféré de nos alliés à Washington.\nWu Guozhen est le candidat favori de l'aile libérale du Kuomintang, qui milite en faveur d'une plus grande autonomie gouvernementale pour le peuple taïwanais, d'élections locales basées sur le vote populaire, ainsi que d'une réduction de la brutalité policière, tout en s'opposant à la politique de style russe de Chiang Ching-kuo et au régime autoritaire à parti unique de Chiang Kai-shek.\n\nAprès mûre réflexion et consultation, le gouvernement provisoire choisit..."
 KMT_Taiwan50s.22.b:0 "Le lieutenant-colonel Kuo Ting-liang deviendra vice-président par intérim."
 KMT_Taiwan50s.22.c:0 "Wu Guozhen, ancien maire de Shanghai."

 KMT_Taiwan50s.21.t:0 "Le destin de Chen Cheng"
 KMT_Taiwan50s.21.d:0 "Bien qu'il ne soit pas officiellement membre de la famille Chiang, Chen Cheng partage une amitié assez forte avec Chiang Kai-shek depuis les premières années de Whampoa. La loyauté est peut-être un problème, mais il convient d'apprécier le succès et l'efficacité des propositions de réforme de Chen concernant l'agriculture, la politique fiscale et les infrastructures. De nombreuses voix au sein du gouvernement provisoire recommandent que nous le surveillions de près dans notre cercle politique et que nous utilisions ses réformes pragmatiques. Cependant, de grandes inquiétudes existent quant au fait que son amitié avec Chiang Kai-shek pourrait causer des problèmes à l'avenir."
 KMT_Taiwan50s.21.a:0 "Gardez-le dans notre gouvernement. Il a une grande valeur."
 KMT_Taiwan50s.21.b:0 "Expulsez-le de tous les postes !"

 KMT_Taiwan50s.23.t:0 "L'incident de Kuo-Ting-liang"
 KMT_Taiwan50s.23.d:0 "La soviétisation de la société et les forces armées poursuivies par Chiang Ching-kuo ont permis au Kuomintang de renforcer son emprise et son influence sur la population taïwanaise et les membres de son parti, mais diverses voix au sein de l'armée s'opposent fermement à ces réformes, notamment parmi les diplômés de l'Institut militaire américain de Virginie. L'un des plus éminents était Sun Li-jen, mais en raison de notre dépendance à l'égard des États-Unis et de son statut de héros de guerre, nous ne pouvions prendre aucune mesure contre lui. Mais aujourd'hui, une poignée de ses subordonnés ont été arrêtés et interrogés par la police secrète de Ching-kuos. Le lieutenant-colonel Kuo Ting-liang, un proche subordonné de Sun, a admis être un espion du Parti communiste, suivant Sun à Taiwan sous couverture pour infiltrer le Kuomintang et préparer un coup d'État contre le gouvernement de Chiang Kai-shek."
 KMT_Taiwan50s.23.a:0 "Arrêtez ces conspirateurs !"

 KMT_Taiwan50s.25.t:0 "Sun Li-jen arrêté à Taipei"
 KMT_Taiwan50s.25.d:0 "Durant la Seconde Guerre mondiale, la coopération avec le gouvernement de Tchang Kaï-chek s'est révélée pour le moins compliquée, étant donné le refus de Tchang d'écouter nos conseillers et son avidité infinie d'armes et de munitions. Cependant, le cercle autour de Sun Li-jen, diplômé du Virginia Institute, qui a combattu aux côtés de notre mission chinoise en Birmanie, a toujours été jusqu'à présent notre porte d'entrée vers le gouvernement du KMT. Les rapports de nos conseillers locaux indiquent que le général a été arrêté par la police secrète, suite aux aveux d'un subordonné espionnant pour le compte du Parti communiste chinois. Cela diminuera considérablement nos ressources politiques pour influencer le gouvernement de Taipei et renforcera le règne autoritaire de la famille Chiang. Mais dans le cadre de la politique d'endiguement du président Truman, nous sommes obligés de poursuivre notre soutien aux régimes anticommunistes en Asie, face aux menaces de tout mouvement communiste."
 KMT_Taiwan50s.25.a:0 "Dommage."

 KMT_Taiwan50s.24.t:0 "L'état de la bureaucratie"
 KMT_Taiwan50s.24.d:0 "Sous le règne de la famille Chiang, d'innombrables Taïwanais ont été victimes de répression, de terreur et de torture. L'incident du 27 février a transformé l'image du Kuomintang de la libération à la répression et, dans l'esprit de la population indigène, nous ne valons pas mieux que les impérialistes japonais. Une fois l'ancien gouvernement renversé, nous avons commencé à jeter les bases d'une atmosphère libérale, égalitaire et tolérante à Taiwan et nous continuerons de le faire. Cependant, il reste encore à débattre si nous incluons la population autochtone dans la structure bureaucratique de la République ou si nous conservons pour le moment notre personnel continental. La première option augmenterait considérablement le soutien local à notre gouvernement, mais au prix d'une perte potentielle de l'identité chinoise et de notre affiliation à la Chine dans son ensemble, tandis que la seconde option renforcerait notre légitimité en tant que gouvernement chinois, mais au prix d'une perte du soutien de la population autochtone."
 KMT_Taiwan50s.24.a:0 "Les Continentaux et les Autochtones dirigeront ensemble la bureaucratie !"
 KMT_Taiwan50s.24.b:0 "Les autochtones ne sont pas encore prêts."

 KMT_Taiwan50s.26.t:0 "[GetNewspaperHeader]Fin du régime militaire en République de Chine"
 KMT_Taiwan50s.26.d:0 "Plus tôt dans la journée, lors d'une conférence de presse à Taipei, le gouvernement militaire provisoire du général Sun Li-jen a annoncé la fin du régime militaire en République de Chine. Suite à la destitution du généralissime Chiang Kai-shek, la junte a fourni diverses ressources politiques pour le retour aux conditions constitutionnelles conformes à la Constitution chinoise de 1947. Dans sa récente déclaration, le président provisoire Sun Li-jen a annoncé que son gouvernement se retirerait pour permettre l'élection d'un nouveau gouvernement. Pour l'instant, l'Assemblée nationale fait office d'instance gouvernementale provisoire jusqu'aux prochaines élections, qui devraient avoir lieu prochainement."
 KMT_Taiwan50s.26.a:0 "Une démocratie chinoise ?"

 KMT_Taiwan50s.27.t:0 "L'aile social-libérale du Kuomintang"
 KMT_Taiwan50s.27.d:0 "Après la déposition de la famille Chiang, toute la structure du Kuomintang fut réorganisée. Le cercle autoritaire et éduqué soviétique autour de Chiang Kai-shek et Chiang Ching-kuo a été mis à l'écart et de nouvelles factions ont pris de l'importance. L'un de ces cercles rassemble une grande variété d'esprits sino-libéraux, notamment des diplomates, des universitaires et des hommes politiques soutenant des convictions sociales-libérales et démocratiques telles que l'autonomie locale, la protection des minorités, la diplomatie, le renforcement et la protection des droits constitutionnels et l'économie mixte. Son membre le plus éminent est Sun Fo, homme d'État et fils du fondateur de la République, Sun Yat-sen, qui avait été un fervent critique de la politique de Chiang Kai-shek mais qui n'a pas pu être purgé par le généralissime en raison de son statut de fils de son ancien mentor. Parmi les autres membres figurent plusieurs personnes, revenant de leur exil aux États-Unis après la déposition de Chiang, comme l'ancien gouverneur de Taiwan, Wu Guozhen, le social-démocrate et philosophe Zhang Junmai ou l'intellectuel néo-confucéen Xu Fuguan."
 KMT_Taiwan50s.27.a:0 "Compris."

 KMT_Taiwan50s.28.t:0 "L'aile libérale du marché du Kuomintang"
 KMT_Taiwan50s.28.d:0 "L'autre grande faction en lice pour légiférer dans la République est constituée d'anciens politiciens travaillant pour le gouvernement nationaliste de Chiang Kai-shek. Ce qui les différencie cependant de la famille Chiang, c'est leur position apolitique et leur vision réaliste des politiques, cherchant à améliorer l'efficacité dans divers domaines politiques tels que la médecine, l'agriculture, les transports et surtout les questions économiques. Ils considéraient le projet de Chiang Kai-shek de reprendre le continent par la force militaire comme illusoire et leurs réformes efficaces ont convaincu le gouvernement intérimaire de ne pas les purger de la sphère politique. Les personnalités les plus célèbres de cette faction incluent Chen Cheng, ancien associé du généralissime et vétéran de la guerre civile, qui s'est fait connaître grâce à sa redistribution des terres agricoles et à ses réformes des infrastructures, ainsi que Chang Li-sheng, ancien vice-premier ministre sous Chen Cheng et actuel ambassadeur au Japon, responsable de la mise en oeuvre des réformes économiques et agraires de Chen Cheng. Ils soutiennent un programme libéral de marché fort, mettant l'accent sur la privatisation économique, les droits individuels et une gouvernance efficace, et visent également à maintenir et à améliorer les relations avec les États-Unis d'Amérique."
 KMT_Taiwan50s.28.a:0 "J'ai compris."

 KMT_Taiwan50s.29.t:0 "L'aile libérale du marché du Kuomintang"
 KMT_Taiwan50s.29.d:0 "L'autre grande faction en lice pour légiférer dans la République est constituée d'anciens politiciens travaillant pour le gouvernement nationaliste de Chiang Kai-shek. Ce qui les différencie cependant de la famille Chiang, c'est leur position apolitique et leur vision réaliste des politiques, cherchant à améliorer l'efficacité dans divers domaines politiques tels que la médecine, l'agriculture, les transports et surtout les questions économiques. Ils considéraient le projet de Chiang Kai-shek de reprendre le continent par la force militaire comme illusoire et leurs réformes efficaces ont convaincu le gouvernement intérimaire de ne pas les purger de la sphère politique. Les personnalités les plus célèbres de cette faction sont Chang Li-sheng, ancien vice-premier ministre de Chen Cheng et actuel ambassadeur au Japon, responsable de la mise en oeuvre des réformes économiques et agraires de Chen Cheng, qui ont contribué à désamorcer le conflit social tendu entre anciens propriétaires et paysans. D'autres membres notables sont l'ancien ministre de l'Économie, Yin Chung-jung, l'homme politique universitaire Wang Yun-wu et l'actuel président de l'Academia Sinica Zhu Jiahua. Ils soutiennent un programme libéral de marché fort, mettant l'accent sur la privatisation économique, les droits individuels et une gouvernance efficace, et visent également à maintenir et à améliorer les relations avec les États-Unis d'Amérique."
 KMT_Taiwan50s.29.a:0 "J'ai compris."

 KMT_Taiwan50s.31.t:0 "Le Parti Démocratique Chinois"
 KMT_Taiwan50s.31.d:0 "Suite à l'abrogation de la loi sur le parti unique, le cercle autour de l'ancien membre du KMT Lei Chen a fondé le Parti démocratique chinois, un groupe d'intérêt comprenant divers militants taïwanais, plaidant pour une démocratie multipartite, l'autonomie locale et des politiques visant à créer une société multiculturelle à Taiwan, composée de Chinois Han et de Taïwanais locaux. Leur journal affilié « Chine libre » attaque la politique autoritaire et nationaliste du Kuomintang et affiche des abonnements croissants dans les zones rurales de la République. Le CDP est sans aucun doute devenu une force à prendre au sérieux et pourrait s'avérer être un parti efficace, établissant la culture politique du pluralisme, qu'il s'agisse d'une opposition au Kuomintang ou d'un partenaire de coalition."
 KMT_Taiwan50s.31.a:0 "Très bien."


 KMT_Taiwan50s.30.t:0 "Les premières élections nationales"
 KMT_Taiwan50s.30.d:0 "Pour la première fois depuis 1948, le peuple de la République est enfin de retour dans l'isoloir pour décider de l'avenir de son pays. Non seulement les cercles politiques, mais aussi le peuple ont été enthousiasmés par les campagnes des différents candidats aux élections. Et maintenant, après avoir compté tous les votes, nous avons notre résultat, qui nous guidera pour les 4 prochaines années."
 KMT_Taiwan50s.30.a:0 "Sun Fo et les sociaux-libéraux assurent la majorité."
 KMT_Taiwan50s.30.b:0 "Les libéraux de marché dirigés par Chang Li-sheng l'emportent."

 KMT_Taiwan50s.33.t:0 "Les premières élections nationales"
 KMT_Taiwan50s.33.d:0 "Pour la première fois depuis 1948, le peuple de la République est enfin de retour dans l'isoloir pour décider de l'avenir de son pays. Non seulement les cercles politiques, mais aussi le peuple ont été enthousiasmés par les campagnes des différents candidats aux élections. Et maintenant, après avoir compté tous les votes, nous avons notre résultat, qui nous guidera pour les 4 prochaines années."
 KMT_Taiwan50s.33.a:0 "Sun Fo et les sociaux-libéraux assurent la majorité."
 KMT_Taiwan50s.33.b:0 "Les libéraux de marché dirigés par Chen Cheng l'emportent."

 KMT_Taiwan50s.32.t:0 "Les premières élections nationales"
 KMT_Taiwan50s.32.d:0 "Pour la première fois depuis 1948, le peuple de la République est enfin de retour dans l'isoloir pour décider de l'avenir de son pays. Non seulement les cercles politiques, mais aussi le peuple ont été enthousiasmés par les campagnes des différents candidats aux élections. Et maintenant, après avoir compté tous les votes, nous avons notre résultat, qui nous guidera pour les 4 prochaines années."
 KMT_Taiwan50s.32.a:0 "Sun Fo et les sociaux-libéraux assurent la majorité."
 KMT_Taiwan50s.32.b:0 "Chen Cheng et les libéraux du marché l'emportent."
 KMT_Taiwan50s.32.c:0 "Le Parti Démocratique Chinois remporte la majorité des voix."


 KMT_Taiwan50s.34.t:0 "Les premières élections nationales"
 KMT_Taiwan50s.34.d:0 "Pour la première fois depuis 1948, le peuple de la République est enfin de retour dans l'isoloir pour décider de l'avenir de son pays. Non seulement les cercles politiques, mais aussi le peuple ont été enthousiasmés par les campagnes des différents candidats aux élections. Et maintenant, après avoir compté tous les votes, nous avons notre résultat, qui nous guidera pour les 4 prochaines années."
 KMT_Taiwan50s.34.a:0 "Sun Fo et les sociaux-libéraux assurent la majorité."
 KMT_Taiwan50s.34.b:0 "Chang Li-sheng et les libéraux du marché l'emportent."
 KMT_Taiwan50s.34.c:0 "Le Parti Démocratique Chinois remporte la majorité des voix."

 KMT_Taiwan50s.35.t:0 "[GetNewspaperHeader] [GetVIEChiefOfState] visite Taipei"
 KMT_Taiwan50s.35.d:0 "Après la cérémonie de bienvenue à l'aéroport Songshan de Taipei, le chef de l'État vietnamien [GetVIEChiefOfState] a été officiellement reçu à [CHI.GetLeader] au Palais présidentiel de Taipei. Les déclarations du bureau présidentiel suggèrent que [GetVIEChiefOfState] a été invité au nom du gouvernement de Taipei pour discuter d'autres plans et stratégies concernant les rébellions communistes en Chine et au Vietnam et a discuté de diverses options telles que des programmes d'échange, des livraisons d'armes et une expertise militaire. Le Parti communiste chinois et le Politburo du Parti communiste de l'Union soviétique ont exprimé de vives critiques en réponse à cette réunion, la qualifiant de simples négociations écrites entre deux régimes fantoches des États-Unis d'Amérique. Les politologues considèrent ces réunions comme une preuve des tensions accrues entre les deux blocs en Asie de l'Est et prédisent que les politiques futures suivront des perspectives strictement réalistes."
 KMT_Taiwan50s.35.a:0 "Les tensions en Indochine semblent encore s'accentuer..."

 KMT_Taiwan50s.36.t:0 "La situation en Indochine"
 KMT_Taiwan50s.36.d:0 "Au cours de la dernière guerre, les Japonais ont pris l'Indochine aux Français et y ont établi un régime brutal. Cependant, la résistance vietnamienne combattit avec ténacité d'abord les Français puis les Japonais, utilisant souvent la Chine comme base principale. À la fin de la guerre, la Chine occupe le nord du Vietnam jusqu'au retour des Français. La France cherche désormais à rétablir son statut d'avant-guerre, mais est désormais confrontée à divers soulèvements du Viet Quoc au Vietnam. Nous entretenons des liens forts avec le Vietnam, notamment à travers le VNQDD et les États-Unis d'Amérique. Nous aiderons le gouvernement vietnamien à Saigon, pour garantir qu'aucune faction communiste vietnamienne ne devienne dominante et pour faire triompher les anticommunistes."
 KMT_Taiwan50s.36.a:0 "Compris."

 KMT_Taiwan50s.37.t:0 "Une invitation de Taipei"
 KMT_Taiwan50s.37.d:0 "La nouvelle est parvenue au bureau présidentiel à Saigon que [CHI.GetLeader], le président de la République de Chine, nous a invités à une réunion à Taipei. Le gouvernement du KMT partage un grand intérêt à nouer des liens étroits avec d'autres régimes d'Asie de l'Est, qui sont également confrontés à des soulèvements révolutionnaires, afin d'avoir une vue d'ensemble de la situation géopolitique et de développer des stratégies communes pour nettoyer les campagnes des mouvements révolutionnaires totalitaires. Selon les rumeurs, cette invitation aurait été envoyée au nom des États-Unis d'Amérique, qui cherchent à renforcer davantage leur alliance anticommuniste en Asie du Sud-Est."
 KMT_Taiwan50s.37.a:0 "Nous y assisterons avec beaucoup d'intérêt."

 KMT_Taiwan50s.38.t:0 "L'influence du Kuomintang à la hausse"
 KMT_Taiwan50s.38.d:0 "Suite aux derniers mois de coopération entre notre gouvernement et la République de Chine, le VNQDD a vu augmenter son soutien et ses ressources politiques. Il ne fait aucun doute que le KMT cherche à soutenir le parti dans ses objectifs politiques, compte tenu de son allégeance aux Trois principes du peuple, la philosophie d'État du membre fondateur du KMT, Sun Yat-sen. Même si nous ne pouvons pas risquer de rompre nos liens avec le Kuomintang, nous devrions accorder davantage d'attention à nos nouveaux rivaux politiques et veiller à ce qu'ils ne deviennent pas trop influents."
 KMT_Taiwan50s.38.a:0 "Nous devrions garder un oeil sur cette évolution."

 KMT_Taiwan50s.41.t:0 "La flotte américaine entre dans le détroit de Taiwan"
 KMT_Taiwan50s.41.d:0 "Dans sa récente déclaration, le président Truman des États-Unis d'Amérique s'est montré très préoccupé par la sécurité de la paix en Asie de l'Est, suite à l'attaque de la Corée du Nord contre le sud de la péninsule. Il a soutenu que la RPDC avait violé les ordres du Conseil de sécurité des Nations Unies et avait ainsi ordonné à la septième flotte de la marine américaine d'entrer dans le détroit de Taiwan pour empêcher les attaques sur l'île et pour empêcher le gouvernement du Kuomintang de mener des opérations maritimes et aériennes contre le continent chinois. Le président estime que le statut futur de Formose devra alors être déterminé lors du rétablissement de la paix dans le Pacifique et en Asie de l'Est."
 KMT_Taiwan50s.41.a:0 "Dieu merci."
 KMT_Taiwan50s.41.b:0 "L'impérialisme américain à son meilleur."

 KMT_Taiwan50s.42.t:0 "Le Kuomintang demande une protection supplémentaire"
 KMT_Taiwan50s.42.d:0 "Le gouvernement de [CHI.GetLeader] a contacté notre ambassadeur à Taipei, demandant la reconnaissance formelle du régime local et une protection officielle contre les menaces étrangères. Même si nous souhaitons contenir tout mouvement communiste en Asie de l'Est, travailler avec le KMT pendant la Seconde Guerre mondiale peut être décrit comme angoissant, ingrat et fastidieux, compte tenu de la corruption au sein du KMT et du refus de tout conseil donné par nos délégations militaires. Il est dans notre plus grand intérêt d'éviter une guerre à grande échelle en Asie et étant donné la rhétorique du Kuomintang visant à reprendre le continent chinois au PCC, il serait insensé de leur accorder un soutien inconditionnel pour leurs opérations. Cependant, l'état-major reconnaît qu'il serait bénéfique d'aider la République de Chine dans ses efforts défensifs pour protéger l'île de Formose contre le Parti communiste chinois, à l'exclusion des îles de Kinmen et de Matsu. De cette façon, nous pourrons continuer à vendre du matériel militaire au Kuomintang et éviter de nous impliquer activement dans les conflits chinois."
 KMT_Taiwan50s.42.a:0 "Un traité défensif. À prendre ou à laisser."

 KMT_Taiwan50s.43.t:0 "Les Américains acceptent un pacte de défense"
 KMT_Taiwan50s.43.d:0 "La réponse de Washington a suscité des sentiments mitigés au sein du gouvernement. Alors que tout le monde apprécie leur volonté de défendre Formose contre toute menace étrangère, les États-Unis ont explicitement déclaré qu'ils ne cherchaient pas à aider le ROCA dans aucune opération offensive contre le continent occupé par les communistes et qu'ils limitaient la zone défensive à Formose uniquement, excluant ainsi les îles de Matsu, Kinmen et Hainan. Cela changera sans aucun doute nos stratégies et nos plans pour la reconquête du continent, mais ce traité renforcera considérablement notre légitimité internationale en tant que gouvernement unique de la Chine dans un avenir prévisible."
 KMT_Taiwan50s.43.a:0 "Vous prenez ce que vous obtenez."

 KMT_Taiwan50s.44.t:0 "[GetNewspaperHeader] Le traité de défense mutuelle sino-américain"
 KMT_Taiwan50s.44.d:0 "Aujourd'hui, le secrétaire d'État américain John Foster Dulles a annoncé la signature d'un pacte défensif entre les États-Unis d'Amérique et la République de Chine à Taiwan, qui a été négocié l'année dernière entre le généralissime Chiang Kai-shek et Dulles. Il suit des protocoles similaires au traité de défense mutuelle américano-coréen, accordant au gouvernement de Taipei une protection contre les attaques étrangères sur l'île de Formose et reconnaissant le gouvernement du KMT comme la seule instance légitime de gouvernement sur la Chine. Cependant, le statut des îles côtières chinoises encore détenues par le Kuomintang n'est pas encore résolu étant donné l'absence de toute mention de celles-ci par les États-Unis dans le traité. L'accord fournit aux États-Unis de nombreuses bases militaires sur l'île et a été qualifié par Dulles d'« élément de paix » et a affirmé qu'il élimine toute inquiétude quant au fait que Formose soit simplement « un sujet commercial diplomatique qui sera abandonné par Washington lors de la normalisation des relations entre Washington et Pékin ». Le Congrès approuvera sans aucun doute ce traité, étant donné qu'il vise à intégrer Formose dans le système de sécurité américain et qu'il limite également le gouvernement national-chinois dans ses opérations contre la Chine continentale."
 KMT_Taiwan50s.44.a:0 "Est-ce que cela apportera la paix en Chine ?"
 
 KMT_Taiwan50s.45.t:0 "L'oeil vigilant"
 KMT_Taiwan50s.45.d:0 "Avec la consolidation de la République de Chine sur l'île de Taiwan, le ministère de l'Éducation a déterminé que le programme scolaire devait aller au-delà de la simple alphabétisation et des mathématiques. Pour survivre à la menace existentielle venant de l'autre côté du détroit, la prochaine génération doit faire preuve d'une loyauté sans faille envers l'État et ses dirigeants.\n\nUn nouveau décret a été publié : chaque classe, de la plus petite école primaire rurale aux amphithéâtres des universités de Taipei, doit désormais arborer un portrait du généralissime Chiang Kai-shek aux côtés de Sun Yat-sen et du drapeau national. En plaçant l'image du chef devant chaque salle, les étudiants se souviennent quotidiennement du sacrifice des expéditions dans le Nord et de la lutte en cours pour le rétablissement national. Alors que certains critiques dans la clandestinité dénoncent cela comme un « culte de la personnalité », le gouvernement s'empresse de veiller à ce que toute école qui ne se conforme pas à ces règles subisse rapidement des conséquences imprévues."
 KMT_Taiwan50s.45.a:0 "Comme il se doit."
 
 KMT_Taiwan50s.46.t:0 "Le gouverneur modèle"
 KMT_Taiwan50s.46.d:0 "Pendant des décennies, Yan Xishan, le « gouverneur modèle » du Shanxi, s'est imposé comme l'une des personnalités les plus puissantes et indépendantes de Chine. Survivaliste politique pragmatique qui a guidé sa province natale du Shanxi à travers l'ère des seigneurs de guerre, l'invasion japonaise et la guerre civile, Yan s'est retiré à Taipei aux côtés du Kuomintang. Contrairement à beaucoup de ses contemporains qui ont fui vers Hong Kong ou l'Occident, Yan reste attaché à la survie de la République.\n\nMalgré leurs relations conflictuelles, Chiang Kai-shek reconnaît la valeur symbolique de Yan. En l'invitant dans son cercle restreint en tant que conseiller principal, le généralissime peut présenter un front uni, dans lequel même les dirigeants les plus indépendants reconnaissent que le KMT est la seule voie vers le redressement."
 KMT_Taiwan50s.46.a:0 "Content de te revoir."
 
 KMT_Taiwan50s.47.t:0 "Le déménagement de la collection du palais de Pékin"
 KMT_Taiwan50s.47.da:0 "Après un voyage de 12 000 kilomètres à travers les montagnes du Sichuan et l'intérieur de la Chine déchirée par la guerre, les plus beaux trésors de la Cité interdite ont enfin atteint leur sanctuaire temporaire à Taiwan. Stockées d'abord dans les entrepôts sucriers de Taichung et désormais dans les tunnels spécialement construits à Beigou, ces milliers de caisses contiennent des biens culturels issus de cinq mille ans de civilisation chinoise. En sécurisant le chou jadéite, le Mao Gong Ding et les vastes bibliothèques impériales, la République de Chine reste la seule gardienne légitime du mandat chinois. Le monde doit reconnaître que la culture chinoise réside là où sont conservés ses trésors."
 KMT_Taiwan50s.47.db:0 "Alors que la poussière de la guerre de libération retombe, un inventaire vide du Musée du Palais de Pékin révèle l'étendue du désespoir du KMT. Dans leur fuite lâche vers l'île de Taiwan, Chiang Kai-shek et ses partisans ont pillé le patrimoine national, emballant les objets les plus inestimables dans des milliers de caisses et les expédiant à Formose. Des légendaires vases en bronze des Zhou à la plus belle porcelaine des Song, le droit culturel du peuple chinois est tenu en otage par un régime mourant. Les organes de propagande de Taipei prétendent qu'ils « sauvegardent » ces biens, mais la République populaire connaît la vérité : il s'agit d'un vol criminel de l'histoire des masses. Nous ne cesserons jamais d'exiger le retour de ces trésors à leur juste place dans la capitale."
 KMT_Taiwan50s.47.a:0 "Nous sommes les véritables gardiens de l'histoire chinoise."
 KMT_Taiwan50s.47.b:0 "Les Réactionnaires ont volé l'Histoire du Peuple !"

 Strait_Crisis.1.t:0 "L'APL bombarde Kinmen !"
 Strait_Crisis.1.d:0 "Selon la garnison locale de Kinmen et de l'île de Matsu, la traîtresse Armée populaire de libération a commencé à bombarder massivement l'île, causant diverses pertes civiles et militaires, dont deux conseillers américains. Il est clair que le PCC n'abandonne pas son désir de s'emparer du reste de la Chine libre et n'éprouve aucun remords pour les pertes civiles. Mais nous résisterons à cette attaque, comme nous l'avons fait en 1949. Sur ordre du président, les habitants des îles doivent être évacués vers le Zhejiang. On ne sait pas exactement quel rôle les États-Unis joueront dans ce conflit, mais espérons que Washington n'hésitera plus et qu'ils nous aideront dans ce conflit."
 Strait_Crisis.1.a:0 "Chacun à sa position."

 Strait_Crisis.2.t:0 "Poursuite des bombardements"
 Strait_Crisis.2.d:0 "Le Kuomintang a fait preuve d'une résistance farouche aux campagnes de bombardements. Nous devons l'intensifier et attaquer également les autres groupes d'îles pour affaiblir leur effort militaire et épuiser leurs ressources. Bientôt, tout Taiwan et les îles restantes seront sous notre contrôle."
 Strait_Crisis.2.a:0 "Nous éliminerons les garnisons de Kinmen !"

 Strait_Crisis.3.t:0 "La marine américaine passe à l'action"
 Strait_Crisis.3.d:0 "Le président [USA.GetLeader] a autorisé la marine américaine à assister le Kuomintang dans ses efforts défensifs, ainsi que dans ses opérations sur les îles bombardées. Les États-Unis appellent l'APL à cesser ses opérations et à se retirer des îles occupées, sous peine de conséquences désastreuses."
 Strait_Crisis.3.a:0 "Vous pouvez toujours compter sur l'Oncle Sam."
 Strait_Crisis.3.b:0 "Et si nous ne le faisons pas ?"

 Strait_Crisis.4.t:0 "La Situation s'apaise"
 Strait_Crisis.4.d:0 "Grâce à l'intervention et à la médiation des États-Unis à la Conférence de Bandung, les deux parties au conflit ont convenu d'un cessez-le-feu, le KMT conservant les îles au large. Mais on ne sait pas exactement quand le prochain coup de feu pourrait être tiré à nouveau. En attendant, la paix revient en Chine."
 Strait_Crisis.4.a:0 "La paix enfin."
 Strait_Crisis.4.b:0 "Nous les aurons la prochaine fois."

 Strait_Crisis.5.t:0 "La bataille des îles Yijiashan"
 Strait_Crisis.5.d:0 "Une bataille récente a eu lieu sur les îles de Yijiashan, non loin des îles Dachen, entre les forces de l'APL et du ROCA. Zhang Aiping, qui a mené l'attaque avec l'autorisation de Mao, a frappé l'artillerie et les positions de communication du ROC autour des îles avant de débarquer des troupes avec des canonnières et de l'artillerie côtière, supprimant les efforts défensifs du ROCA. Bientôt, trois bataillons supplémentaires de renforts arrivèrent et brisèrent la tête de pont et prirent le contrôle des îles, laissant 519 capturés et 567 capturés pour le ROCA."
 Strait_Crisis.5.a:0 "Les îles Dachen et Kinmen tomberont-elles également ?"
 Strait_Crisis.5.b:0 "Un pas de plus vers la libération de Taiwan !"

 Strait_Crisis.6.t:0 "Arrivée des Airwings américaines à Taiwan"
 Strait_Crisis.6.d:0 "Avec l'intervention américaine aux côtés de la République de Chine, ils ont commencé à déployer des ailes aériennes des Philippines, de la Corée du Sud et du Japon vers des bases aériennes à Taiwan, comme celles de Chiayi, Tainan et Taoyuan, tandis qu'un quartier général provisoire a été installé par la 5e force aérienne à Taipei pour aider à fournir des défenses aériennes autour des îles Dachen."
 Strait_Crisis.6.a:0 "L'APL n'est pas invincible, mais l'armée de l'air américaine l'est certainement !"
 Strait_Crisis.6.b:0  "Maudits impérialistes américains !"

 Strait_Crisis.7.t:0 "Déclenchement de la deuxième crise du détroit de Taiwan"
 Strait_Crisis.7.d:0 "Nous avons reçu des nouvelles selon lesquelles l'APL a pris des mesures brutales en tirant à nouveau sur les îles Kinmen et en bloquant l'île avec un soutien aérien, coulant ainsi notre LST naval. Nous montrerons à ces satanés communistes la véritable puissance de nos forces armées s'ils veulent vraiment un second tour."
 Strait_Crisis.7.a:0 "A bas les sbires de Mao !"

 Strait_Crisis.8.t:0 "Des tracts communistes ont été abandonnés exigeant notre capitulation"
 Strait_Crisis.8.d:0 "Le septième jour des bombardements de l'île de Kinmen, des tracts de propagande ont été lâchés exigeant que les troupes locales du ROCA se rendent à l'APL, cela ne leur servira évidemment à rien et les garnisons de Kinmen ont promis de consacrer leur vie à tenir le coup et à défendre Kinmen contre les communistes envahisseurs."
 Strait_Crisis.8.a:0 "Nous les avons déjà arrêtés à Kinmen, et nous recommencerons !"

 Strait_Crisis.9.t:0 "Les Soviétiques annoncent leur soutien à la RPC"
 Strait_Crisis.9.d:0 "Les Soviétiques ont annoncé qu'ils étaient prêts à soutenir l'APL en lui apportant l'aide morale et matérielle nécessaire dans la lutte pour la « libération » de Taiwan. Même s'il semble y avoir un changement au sein de la direction soviétique, le nouveau dirigeant semble avoir continué à soutenir les bandits communistes et continuera de le faire à l'avenir. Cela indique également que les yeux de la communauté internationale sont tournés vers le détroit de Taiwan, car la situation s'est considérablement aggravée et une guerre pourrait éclater."
 Strait_Crisis.9.a:0 "Pourquoi les Soviétiques ne peuvent-ils pas rester en dehors de cela ?"

 Strait_Crisis.10.t:0 "Les États-Unis nous envoient leur soutien"
 Strait_Crisis.10.d:0 "Les États-Unis ont envoyé le 16e escadron de chasseurs-intercepteurs de la 5e Force aérienne à Taiwan. Ils ont également déployé leurs porte-avions Essex et Midway ainsi que des destroyers d'escorte en renfort de la 7e flotte dans le détroit de Taiwan. Le bataillon Nike-Hercules et des équipements modernes ont également été envoyés à Taiwan. Il semble que le soutien américain à notre égard ne s'arrêtera pas là, puisque l'on dit qu'un autre escadron de chasseurs F104 sera envoyé le 6 septembre."
 Strait_Crisis.10.a:0 "Les États-Unis sont entrés en scène."

 Strait_Crisis.11.t:0 "Rapport militaire sur l'approvisionnement des îles Kinmen"
 Strait_Crisis.11.d:0 "Alors que les forces communistes commençaient à tenter un blocus sur les îles Kinmen, nous avons fait plusieurs tentatives pour réapprovisionner les garnisons Kinmen qui résistent sur l'île. Notre première tentative de réapprovisionnement s'est soldée par un échec majeur, perdant 11 de nos bateaux PT dans le processus. La deuxième tentative de ravitaillement, le lendemain, a permis à la marine de la ROC d'être bien mieux équipée qu'auparavant, mais a conduit les bateaux de la PLA PT à lancer une attaque autour de la baie de Liaolo, empêchant nos convois d'accomplir leurs tâches, et cela se poursuivra jusqu'à ce que les communistes demandent des négociations sur la situation avec l'Amérique, permettant à nos convois de réapprovisionner avec succès l'île intacte. Le lendemain, un seul convoi parvient à ravitailler l'île, les autres étant repoussés par les bombardements incessants. N/n/ Les États-Unis ont trouvé une nouvelle solution pour contourner le blocus, en mettant l'accent sur le largage aérien de fournitures sur les îles, qui étaient petites auparavant mais sur lesquelles on pouvait compter avec une meilleure couverture aérienne américaine."
 Strait_Crisis.11.a:0 "Compris."

 Strait_Crisis.12.t:0 "Premier engagement aérien majeur au-dessus des îles Kinmen"
 Strait_Crisis.12.d:0 "Le premier engagement aérien majeur au-dessus des îles Kinmen a commencé avec 12 F-86 de la ROCAF et 12 MiG-17 de la PLAF démarrant un combat pour la suprématie aérienne sur les îles, perdant 7 à 9 MiG-17 pour la PLAF et 1 pour la ROCAF."
 Strait_Crisis.12.a:0 "Peut-être devrions-nous améliorer notre force aérienne ?"
 Strait_Crisis.12.b:0 "Coûteux mais ça vaut le coup pour la libération de Taiwan !"

 Strait_Crisis.13.t:0 "Deuxième engagement aérien majeur au-dessus des îles Kinmen"
 Strait_Crisis.13.d:0 "Cette fois, 32 F-86 du ROCAF se sont affrontés avec 100 MiG-17 de la PLAAF, cette fois avec 20 de ces F-86 équipés de missiles américains Sidewinder, ils ont été capables de faire énormément mieux que les MiG-17, laissant plus de 25 MiG abattus. Cependant, il y a eu un événement au cours duquel un missile Sidewinder a été inséré dans l'un des MiG-17 de la PLAAF sans exploser, qui a été rapidement retiré et sera probablement utilisé par le bloc communiste pour en faire des copies. "
 Strait_Crisis.13.a:0 "Au moins 25 d'entre eux ont été abattus... ?"
 Strait_Crisis.13.b:0 "Nous avons effectivement volé la technologie américaine !"

 Strait_Crisis.14.t:0 "Engagement aérien majeur au-dessus des îles Matsu"
 Strait_Crisis.14.d:0 "Une nouvelle bataille aérienne a eu lieu au-dessus des îles Matsu, avec six F-86 du ROCAF qui effectuaient des reconnaissances au-dessus des îles Matu ont été pris en embuscade par huit MiG-17 de la PLAAF, où trois MiG-17 ont été abattus et le PLAN a perdu 3 bateaux PT tandis que le F-86 n'en a perdu qu'un."
 Strait_Crisis.14.a:0 "Encore une victoire pour nous !"
 Strait_Crisis.14.b:0 "Au diable les bandits blancs !"

 Strait_Crisis.15.t:0 "Cessez-le-feu décrété par Peng Dihuai"
 Strait_Crisis.15.d:0 "Le blocus étant effectivement levé, le général de l'APL, Peng Dehuai, a décrété un cessez-le-feu unilatéral avec la République de Chine à Kinmen sur la base de « préoccupations humanitaires », malgré les faibles pertes civiles subies lors des bombardements sur les îles de Kinmen. Toutefois, cela signifie que la crise touche bientôt à sa fin et que les discussions sur le cessez-le-feu se poursuivront."
 Strait_Crisis.15.a:0 "Les bandits ont été repoussés !"
 Strait_Crisis.15.b:0 "Profitez du cessez-le-feu tant qu'il dure, laquais !"

 Strait_Crisis.16.t:0 "Prolongation du cessez-le-feu unilatéral"
 Strait_Crisis.16.d:0 "De nouvelles informations sont apparues selon lesquelles le cessez-le-feu a été prolongé et qu'un accord finalisé sera proposé à l'avenir pour mettre fin définitivement au conflit. Il reste encore beaucoup à dire des deux côtés."
 Strait_Crisis.16.a:0 "La situation semble terrible pour les Reds."
 Strait_Crisis.16.b:0 "Peut-être libérerons-nous Taiwan un autre jour."

 Strait_Crisis.17.t:0 "Nouvel accord sur la deuxième crise du détroit de Taiwan"
 Strait_Crisis.17.d:0 "La RPC a proposé un accord selon lequel elle ne serait autorisée à tirer que les jours pairs afin de permettre aux troupes de se réapprovisionner les jours impairs tant que les États-Unis ne les escortaient pas. Cet accord informel bizarre est très probablement une tentative pour sauver la face des communistes, en prétendant que le blocus n'avait pas été éludé."
 Strait_Crisis.17.a:0 "Cette crise restera dans les mémoires !"
 Strait_Crisis.17.b:0 "Gardez vos îles pour un autre jour, bandits blancs !"

 Strait_Crisis.18.t:0 "Retour des avions F-86"
 Strait_Crisis.18.d:0 "Alors que la deuxième crise du détroit de Taiwan touche à sa fin, il est peut-être temps de leur restituer certains avions F-86 américains ? Mais si nous les gardons, nous pourrons peut-être continuer à utiliser leurs missiles Sidewindler contre les communistes lorsque la libération du continent viendra."
 Strait_Crisis.18.a:0 "Nous les garderons encore 7 ans."
 Strait_Crisis.18.b:0 "Renvoyez-les, nous n'en avons plus besoin."

 Strait_Crisis.19.t:0 "Chute des îles Kinmen et Dachen"
 Strait_Crisis.19.d:0 "Alors que la ROCA s'étendait des îles Dachen jusqu'aux îles Kinmen, l'APL fit une percée et anéantit de manière décisive les défenses nationalistes avec des barrages d'artillerie concentrés occupant les défenseurs pendant qu'ils effectuaient un débarquement amphibie derrière eux, conduisant finalement à la chute de toutes les îles au large d'un coup. Il semble que le pari de la République de Chine de conserver toutes les îles ait échoué."
 Strait_Crisis.19.a:0 "Préparez-vous à la défense de Taiwan !"
 Strait_Crisis.19.b:0 "Prochain arrêt... Taïwan !"

 KMT_Taiwan50s.49.t:0 "Vestiges du Kuomintang sur le continent"
 KMT_Taiwan50s.49.d:0 "Alors que les principales forces de l'armée républicaine se sont retirées sur l'île de Taiwan, une poignée de divisions résistent dans diverses provinces du pays. Cela inclut les troupes sous le commandement de la clique musulmane Ma qui se sont retirées dans les régions du Qinghai, du Ningxia et du Xinjiang, poursuivant leur guérilla contre le PCC. Un autre reste de l'ancienne NRA s'est retiré sous la direction du général Li Mi dans les régions frontalières birmanes, établissant une base d'opérations contre l'APL dans la province du Yunan. Il est dans notre plus grand intérêt de soutenir ces unités et de les préparer à d'éventuelles opérations stratégiques contre le Parti communiste."
 KMT_Taiwan50s.49.a:0 "Le combat n'est pas encore terminé !"

 KMT_Taiwan50s.50.t:0 "Assistance de Taipei"
 KMT_Taiwan50s.50.d:0 "Après des combats désespérés sur le continent, le gouvernement central de la République de Chine s'est enfui vers l'île de Taiwan, établissant sa nouvelle base d'opérations contre le Parti communiste. Le gouvernement sous [CHI.GetLeader] nous a maintenant contacté et nous a ordonné de poursuivre la guérilla contre l'APL dans les régions frontalières du Yunnan jusqu'à ce que de nouveaux ordres soient donnés. Ils nous ont promis d'envoyer régulièrement des renforts et du matériel avec l'aide de la CIA pour garantir que les derniers restes du Kuomintang sur le continent chinois ne tombent pas aux mains des traîtres communistes de Pékin."
 KMT_Taiwan50s.50.a:0 "Magnifique."

 KMT_Taiwan50s.51.t:0 "La plainte birmane auprès de l'ONU"
 KMT_Taiwan50s.51.d:0 "Suite à l'échec des efforts diplomatiques et militaires du gouvernement birman pour résoudre le problème du Kuomintang à Kengtung, la Birmanie a déposé une plainte auprès des Nations Unies, produisant une multitude de photos, de documents capturés et de témoignages suffisamment convaincants pour remporter un vote de censure contre la République de Chine. Les États-Unis font également pression sur nous pour rappeler le général Li Mi, estimant que la question du KMT était devenue « une telle source d'embarras international pour les États-Unis ». Même si nous devrions écouter les États-Unis, le rappel des troupes finirait par nous priver d'une autre base géopolitique importante d'opérations contre le Parti communiste."
 KMT_Taiwan50s.51.a:0 "Ramenez-les à la maison."
 KMT_Taiwan50s.51.b:0 "Annoncez les efforts d'évacuation, mais gardez-les secrètement là-bas."

 KMT_Taiwan50s.52.t:0 "L'avenir des unités islamiques"
 KMT_Taiwan50s.52.d:0 "La Clique Ma se bat avec acharnement et passion pour la République, mais ses capacités vont bientôt atteindre leurs limites. L'équipe de planification se demande si nous devons évacuer le Qinghai et le Xinjiang et ramener nos garçons chez eux via la route indienne. Cela nous ferait perdre une autre base d'opérations importante contre l'APL, mais le risque de perdre ces précieux et courageux soldats augmente de jour en jour."
 KMT_Taiwan50s.52.b:0 "Ces hommes sont des héros. Ramenez-les à la maison."
 KMT_Taiwan50s.52.a:0 "Ordonnez-leur de conserver leurs positions."

 KMT_Taiwan50s.53.t:0 "La Corée dans la tourmente"
 KMT_Taiwan50s.53.d:0 "Au lendemain de la guerre civile chinoise, le continent chinois a été perdu au profit du traître Parti communiste chinois tandis que le gouvernement central a dû fuir vers l'ancienne colonie japonaise de Formose. Aujourd'hui, plus de six mois plus tard, Kim Il-sung, président du Parti des travailleurs de Corée, a lancé une invasion totale de la partie sud de la péninsule, dans le but de soumettre l'ensemble de la Corée à son pouvoir. Nos espions sur le continent rapportent des rumeurs sur une éventuelle intervention du Parti communiste chinois en Corée au nom de Kim, qui a exhorté notre gouvernement à intervenir et à soutenir la Corée du Sud et la Coalition de l'ONU par tous les moyens nécessaires. Nous discuterons d'autres plans avec les États-Unis sur la manière d'aborder la situation, mais cela pourrait être notre seule chance de lancer une contre-offensive à grande échelle contre l'APL."
 KMT_Taiwan50s.53.a:0 "Ensemble contre l'impérialisme rouge."

 KMT_Taiwan50s.54.t:0 "Le Kuomintang prépare une attaque"
 KMT_Taiwan50s.54.d:0 "Nos derniers espions à Taiwan rapportent que le Kuomintang a conclu un accord avec la Maison Blanche à Washington, autorisant le régime du [CHI.GetLeader] à envoyer ses troupes dans la mêlée contre nos alliés à Pyongyang. Il faut supposer que le Kuomintang cherche à s'étendre au-delà de la Corée et veut profiter de cette opportunité pour nous reprendre le continent chinois et poursuivre sa répression des paysans. Nous devons prendre des mesures immédiates et préparer l'ensemble de l'APL à la menace imminente."
 KMT_Taiwan50s.54.a:0 "A bas le KMT !"

 KMT_Taiwan50s.55.t:0 "La révolution de Formose"
 KMT_Taiwan50s.55.d:0 "Après des mois de répressions sévères et de politiques anti-autochtones, les autochtones de Taiwan se sont soulevés contre notre gouvernement, ne nous considérant comme la prochaine force d'occupation étrangère de Taiwan qu'après le départ des Japonais de l'île. Des manifestations et des incursions massives ravagent l'île et le gouvernement est submergé par l'ampleur de l'opposition. Les tensions ont atteint des niveaux comparables aux émeutes qui ont suivi l'incident de 1947. Les manifestants exigent la démission immédiate du gouvernement du Kuomintang et exigent l'autonomie, y compris l'abolition de la bureaucratie dominée par les continentaux et la libération de tous les prisonniers politiques. On ne sait pas si le gouvernement pourra d'une manière ou d'une autre désamorcer cette situation, mais étant donné que le Kuomintang a perdu le soutien local des indigènes de Formose, cela semble peu probable."
 KMT_Taiwan50s.55.a:0 "Est-ce la fin ?"

 KMT_fangong_dalu.1.t:0 "Fangong dàlù"
 KMT_fangong_dalu.1.d:0 "Fangong dàlù, un slogan utilisé par la République de Chine qui se traduit directement par Contre-attaque sur le continent en anglais, suggère une action militaire énergique entreprise par les forces armées de la République de Chine pour retourner sur le continent et éliminer les communistes. Ce slogan a également été la principale politique nationale de la République de Chine, la priorité de la nation étant de reconquérir le continent et de « re-glorifier le continent ». Bien qu'il ne s'agisse que d'un simple slogan utilisé par la République de Chine, il donne de l'espoir au peuple, l'espoir de voir le Kuomintang faire son retour sur le continent et l'effondrement du régime communiste sur le continent."
 KMT_fangong_dalu.1.a:0 "Rendons nos terres qui nous reviennent !"



 KMT_50s_Mainland.1.t:0 "La République de Chine (rétablit) ses relations diplomatiques"
 KMT_50s_Mainland.1.d:0 "\nLa République de Chine a survécu à sa lutte contre les Japonais et le Parti communiste. Nanjing a exprimé sa volonté d'établir et de renforcer ses relations avec les nations d'Indochine pour davantage de coopération et de sécurité dans la région. Dans un premier temps, le gouvernement nationaliste chinois a (r)ouvert son ambassade dans notre pays."
 KMT_50s_Mainland.1.a:0 "Pour la paix en Asie !"

 KMT_50s_Mainland.2.t:0 "[GetNewspaperHeader] La République de Chine annonce la politique d'une seule Chine"
 KMT_50s_Mainland.2.d:0 "Après la fin de la guerre civile chinoise, la Chine a été divisée en un État communiste et un État pro-occidental, tout comme la Corée, l'Allemagne et le Vietnam. Alors que le Kuomintang contrôle la majorité des régions dominées par les Han, la République de Chine a annoncé sa position sur le statut international de la Chine.\n\nLe président [CHI.GetLeader] a annoncé que la République de Chine avait adopté la « politique d'une seule Chine », proclamant qu'il n'y a qu'une seule Chine, qui est administrée par la République de Chine sous le gouvernement du Kuomintang, y compris tout territoire chinois hors du contrôle du Kuomintang. Toute nation souhaitant établir ou maintenir des liens avec la République de Chine doit accepter cette politique.\n\nLes diplomates et les universitaires ont évalué cette démarche comme une stratégie du Kuomintang visant à discréditer le Parti communiste chinois et à renforcer la légitimité du régime du KMT au niveau international. Il n'est cependant pas certain que les membres de la sphère d'influence soviétique se plieront à cette politique ou feront pression sur le Kuomintang pour qu'il revienne sur sa politique."
 KMT_50s_Mainland.2.a:0 "La Chine était à nouveau entière. Puis ça s'est encore cassé."

 KMT_50s_Mainland.3.t:0 "La doctrine Kung-Chao"
 KMT_50s_Mainland.3.d:0 "Après des jours de conseils et de discussions, le Ministère des Affaires étrangères et le Président de la République de Chine sont parvenus à un accord sur la position officielle de la République de Chine sur le statut international de la Mandchourie. Selon la « politique d'une seule Chine » de la République de Chine, la Mandchourie fait partie intégrante de la République de Chine qui est actuellement sous contrôle « séparatiste ». Nanjing a donc annoncé la « Doctrine Kung-Chao », du nom de l'actuel ministre des Affaires étrangères George Kung-chao, qui prévoira des sanctions contre tous les pays cherchant à établir des relations diplomatiques avec le PCC en Mandchourie, y compris les pays du bloc de l'Est. Bien que les sanctions elles-mêmes ne nuisent pas à un niveau élevé, elles nuiront grandement aux relations entre la République de Chine et le bloc de l'Est, renforçant ainsi les revendications de la République de Chine sur la Mandchourie."
 KMT_50s_Mainland.3.a:0 "Oh non! Quoi qu'il en soit..."
 KMT_50s_Mainland.3.b:0 "C'est vrai !"

 KMT_50s_Mainland.4.t:0 "Un envoyé de Nanjing"
 KMT_50s_Mainland.4.d:0 "La République de Chine est sortie victorieuse de son conflit avec le Parti communiste et a immédiatement commencé à tendre la main à d'autres États anticommunistes d'Asie de l'Est. En tant que nation indépendante nouvellement établie, nous sommes toujours confrontés à divers problèmes, notamment les troubles socialistes dans les jungles de Malaisie et le gouvernement du Kuomintang a montré un grand intérêt à aider notre gouvernement à stabiliser les campagnes. Les fournitures devraient arriver bientôt."
 KMT_50s_Mainland.4.a:0 "Apprécié."

 KMT_50s_Mainland.5.t:0 "Les Chinois renoncent à leurs revendications"
 KMT_50s_Mainland.5.d:0 "Dans une tournure surprenante des événements, le gouvernement chinois de Nanjing, qui est sorti victorieux de la guerre civile contre le Parti communiste, a annoncé qu'il renoncerait à toute revendication sur le Tibet et reconnaîtrait le Dalaï Lama comme chef d'État du Tibet. Les troupes chinoises quittent des régions frontalières cruciales et les envoyés du Kuomintang nous ont contactés, souhaitant discuter de l'établissement officiel de relations diplomatiques et faire pression pour la reconnaissance internationale de l'indépendance du Tibet."
 KMT_50s_Mainland.5.a:0 "Magnifique."

 KMT_50s_Mainland.6.t:0 "État des lieux des provinces"
 KMT_50s_Mainland.6.d:0 "Les gouverneurs de chaque région de Chine, qu'il s'agisse du Guangxi ou du Qinghai, doivent faire l'objet d'une enquête minutieuse afin de révéler leurs actions et leurs véritables intentions à l'égard du gouvernement national. Nanjing a envoyé des agents secrets dans les capitales provinciales respectives et leurs environs pour inspecter l'état de la bureaucratie, des soins de santé ainsi que de l'éducation. À leur retour et en remettant leurs rapports au secrétaire présidentiel, il est devenu clair à Nanjing que..."
 KMT_50s_Mainland.6.a:0 "... il n'y a aucun problème."
 KMT_50s_Mainland.6.b:0 "... La corruption, le népotisme et divers autres problèmes affligent les régions."

 KMT_50s_Mainland.7.t:0 "La démission de Li Zongren"
 KMT_50s_Mainland.7.d:0 "Bien qu'il soit officiellement devenu président de la République de Chine en janvier 1949, Li Zongren n'avait que peu ou pas de pouvoir sur les autorités militaires centrales et n'a eu que peu de succès dans la mise en oeuvre de la politique qu'il souhaitait en raison de l'opposition des partisans de Chiang. Bien que les relations entre Chiang et Li aient été difficiles, le Premier ministre Yan Xishan a joué un rôle de médiation important entre les deux, ce qui a permis de maintenir l'unité du gouvernement du Kuomintang pendant la phase finale de la guerre civile chinoise. Après la fin de la guerre, la rivalité entre Li Zongren et Chiang Kai-shek a repris, ce qui a finalement conduit Li à démissionner de son poste de vice-président et à retourner dans sa province natale du Guangxi. En raison de son influence et de la politique autonome du Guangxi pendant la Seconde Guerre mondiale, il continuera très probablement à être un obstacle pour Chiang et ses partisans."
 KMT_50s_Mainland.7.a:0 "Nous nous reverrons."

 KMT_50s_Mainland.8.t:0 "Les trois principes du peuple"
 KMT_50s_Mainland.8.d:0 "Les Trois principes du peuple, également connus sous le nom de doctrine San-min ou tridémisme, constituent la principale philosophie politique du Kuomintang, développée par le père de la révolution nationale, le Dr Sun Yat-sen. Ils servent de lignes directrices pour améliorer la Chine pendant l'ère républicaine et peuvent être brièvement résumés comme « Démocratie, nationalisme et protection sociale ».\n\nMinzu, le premier principe, prône le développement d'une identité nationale plutôt qu'une identité ethnique et appelle à l'indépendance de l'ensemble du peuple chinois face aux menaces impérialistes extérieures et au régime minoritaire interne.\n\nMinquan, souvent traduit par Démocratie, soutient le droit du peuple chinois d'exprimer ses opinions politiques et de contrôler les postes administratifs, qui est représenté par l'Assemblée nationale. Ces droits comprennent le droit de vote, le droit de révocation, le droit d'initiative et le droit d'organiser un référendum. Le système politique doit être divisé en cinq branches distinctes au lieu de trois seulement. L'État est divisé en un Yuan législatif, exécutif, judiciaire, de contrôle et d'examen, alliant la pensée montesquieuenne à la tradition chinoise.\n\nMinsheng, souvent traduit par Bien-être du Peuple, se concentre sur quatre domaines : l'habillement, l'alimentation, le logement et la mobilité. Ce principe est également fortement influencé par les pensées d'Henry George, appelant à la taxation des terres comme « le seul moyen de soutenir le gouvernement via un impôt infiniment juste, raisonnable et équitablement réparti, et sur lequel nous fonderons notre nouveau système ».\n\nAu cours des dernières décennies depuis la mort du Dr Sun, le Kuomintang n'a pas réussi à mettre en oeuvre ces principes et a montré peu ou pas de confiance en cette philosophie. Mais à partir de ce jour, nous consacrerons toutes nos ressources et tous nos efforts à l'achèvement de la révolution nationale selon les Trois principes du peuple. Chaque membre du parti doit s'y engager pleinement et toujours garder ces principes à l'esprit."
 KMT_50s_Mainland.8.a:0 "San-min chu-i, shih-hsing.."

 KMT_50s_Mainland.9.t:0 "Un dîner de fin de soirée"
 KMT_50s_Mainland.9.d:0 "Il était déjà 23h00, mais les lumières étaient toujours allumées dans le palais présidentiel de Nanjing. Chiang Kai-shek, avec sa famille et son entourage, dîne et partage ses réflexions sur les dernières années. Chen Cheng, le vice-président de la République, a montré un visage dubitatif toute la soirée, se demandant si les politiques actuelles parviendront à apaiser la population et à garantir un certain degré de soutien populaire :\n\n« Est-ce que cela nous apportera vraiment le soutien nécessaire et détournera l'attention du Parti communiste ? Leurs campagnes de propagande excessives et leurs politiques locales ont failli nous faire perdre la guerre. Les gens n'oublieront pas si vite.\n\nChiang Kai-shek se penche en arrière et affiche un léger sourire. Il affirme qu'il a appris du passé et qu'il savait parfaitement comment résoudre ce problème :\n\n« La réforme du parti n'était que la première étape. En établissant de nouvelles politiques, en mettant l'accent sur le compromis, vous finirez par satisfaire la majorité des gens jusqu'à un certain point où ils accepteront votre règne et reconnaîtront une sorte de légitimité. Il s'agit de trouver l'équilibre parfait entre concessions et restrictions.\n\nBien sûr, cela ne peut pas être une solution éternelle, a-t-il ajouté. Les temps changent et les gens aussi. Mais pour le moment, le Kuomintang se trouve dans une position stable, contrairement à la situation désastreuse de 1949. Finalement, les Trois Principes seront un jour pleinement mis en oeuvre dans la mentalité de la Chine. Mais il reste encore un long chemin à parcourir."
 KMT_50s_Mainland.9.a:0 "Une autre eau bouillie s'il vous plaît."

 KMT_50s_Mainland.10.t:0 "L'introduction d'une nouvelle série Fabi"
 KMT_50s_Mainland.10.d:0 "Depuis 1935, la République subit les effets de l'hyperinflation du Yuan, entraînant une flambée des prix. Après l'établissement du gouvernement du Kuomintang à Nankin, le système bancaire libre a été aboli et le Kuomintang a gagné le soutien politique et financier des plus grandes banques du pays. Les banques sont finalement devenues dépendantes du gouvernement, accordant à Nankin le monopole monétaire. L'introduction de la nouvelle série Fabi est l'une des nombreuses mesures visant à reconstruire l'économie chinoise dévastée ; cette fois, la nouvelle série de Fabi serait rattachée au dollar américain et à plusieurs devises et métaux précieux comme réserves, tout en contrôlant strictement le montant de la circulation et en forçant le remplacement de toutes les anciennes monnaies par de nouveaux yuans Fabi à un certain taux. D'autres changements doivent être apportés au système bancaire, ainsi qu'à l'agriculture et aux infrastructures nationales pour parvenir au redressement complet de la nation."
 KMT_50s_Mainland.10.a:0 "Cela sera fait."

 KMT_50s_Mainland.11.t:0 "La République de Chine demande une aide à la reconstruction"
 KMT_50s_Mainland.11.d:0 "Les ravages de la guerre civile et de la Seconde Guerre mondiale ont plongé la Chine dans un état de ruine. Avec la victoire du Kuomintang, nous disposons d'un autre allié majeur en Chine, doté d'un vaste marché de consommation et d'un paysage de ressources non découvertes. Nous aiderons volontiers le gouvernement du Kuomintang dans ses efforts de reconstruction, afin de nous assurer une ou plusieurs faveurs si jamais nous venions frapper à la porte de Nanjing."
 KMT_50s_Mainland.11.a:0 "Parfait."
 
 KMT_50s_Mainland.11b.t:0 "Les États-Unis accordent des fonds à la reconstruction"
 KMT_50s_Mainland.11b.d:0 "Notre demande d'aide financière a été accordée par le gouvernement fédéral à Washington. La Maison Blanche a annoncé diverses expéditions de nourriture, de conseillers, d'entreprises et d'équipes de reconstruction à destination de la Chine pour garantir que la reconstruction du pays sera la priorité numéro un du gouvernement américain, tout en tentant également de prendre pied pour d'éventuels attachés militaires à l'avenir."
 KMT_50s_Mainland.11b.a:0 "Apprécié."
 
 KMT_50s_Mainland.11c.t:0 "Extraction d'uranium sino-américaine"
 KMT_50s_Mainland.11c.d:0 "Même si la recherche universitaire et les laboratoires de travail d'Eggheads apporteront des progrès théoriques à notre programme nucléaire, il est plus que clair que nous avons cruellement besoin de ressources pour produire de l'énergie nucléaire. De nouveaux projets de fouilles doivent être autorisés, mais ils sont très coûteux. Heureusement, quelques-uns de nos diplomates qui ont passé beaucoup de temps aux États-Unis ont conclu des accords avec des sociétés d'uranium locales qui sont prêtes à nous aider à établir de véritables mines à Shangdong. Peut-être devrions-nous approcher le gouvernement américain à ce sujet ?"
 KMT_50s_Mainland.11c.a:0 "Un avantage pour tous !"
 
 KMT_50s_Mainland.11d.t:0 "Extraction d'uranium sino-américaine"
 KMT_50s_Mainland.11d.d:0 "Au cours des derniers mois, des diplomates, des chercheurs et des lobbyistes chinois ont contacté diverses sociétés d'uranium de notre pays, pensant qu'elles étaient la clé du programme chinois d'énergie nucléaire. Nanjing nous a maintenant officiellement contacté, suggérant un projet d'excavation conjoint à Shangdong, où nous recevrons en retour 30 % de l'uranium et des revenus de la mine."
 KMT_50s_Mainland.11d.a:0 "Bravo à nos partenaires chinois !"

 KMT_50s_Mainland.12.t:0 "La nécessité d'une réforme"
 KMT_50s_Mainland.12.d:0 "Le Kuomintang avait accédé au pouvoir en promettant diverses réformes sociales et économiques au peuple chinois après la chute de la monarchie Qing. Cependant, après la défaite de la clique de Beiyang, le parti s'est principalement concentré sur le maintien et l'expansion de son pouvoir politique, ainsi que sur l'écrasement du mouvement communiste. Une bureaucratie inefficace, la corruption, le factionnalisme et l'opportunisme ont contribué à la chute de la structure du Kuomintang, nous faisant presque perdre la partie continentale de la Chine au profit du Parti communiste. Il est dans notre intérêt de mettre fin à cette misère et de prendre des mesures pour réformer le Kuomintang en un parti uni et efficace. La résistance des seigneurs de la guerre et des différentes factions politiques au sein du Kuomintang ne rendra pas cette tâche facile, mais c'est le seul moyen d'assurer notre domination sur la Chine."
 KMT_50s_Mainland.12.a:0 "Pour un avenir meilleur."

 KMT_punishments.1.t:0 "La République de Chine exige l'extradition de Puyi"
 KMT_punishments.1.d:0 "Le gouvernement du Kuomintang a commencé à concentrer ses efforts sur la punition des collaborateurs avec le Japon, en donnant la priorité à la punition des traîtres qui ont fait honte au pays. Il se trouve que lors de notre invasion de la Mandchourie en 1945, nous avons pu capturer l'un des principaux « traîtres » de Chine, l'ancien empereur de Chine nommé Puyi. Le Kuomintang soutient que ces traîtres doivent être sévèrement punis par le gouvernement chinois légitime et souhaite prendre en main les questions de punition. Nous pourrions potentiellement céder à ces revendications mineures, mais il existe une alternative. Le gouvernement de Mandchourie, qui est dans l'intérêt de nos plus grands intérêts, a également demandé l'extradition de Puyi, tout en affirmant que le gouvernement de Nanjing ne montrerait aucune pitié envers les traîtres, contrairement au gouvernement de Mandchourie."
 KMT_punishments.1.a:0 "Cédez, cette affaire n'est pas grave."
 KMT_punishments.1.b:0 "Nous ne permettrons pas aux « traîtres » de souffrir sous le régime réactionnaire."

 KMT_punishments.2.t:0 "Réponse des Soviétiques concernant notre demande"
 KMT_punishments.2.yes:0 "Les Soviétiques ont accepté la demande d'extradition de Puyi, considérant que ce n'était pas grave en ce qui concerne la punition de Puyi. Les Soviétiques ont finalement repris leurs esprits et se rendent compte que ce n'était qu'une question de temps avant que notre régime parvienne à renverser l'État client soviétique en Mandchourie."
 KMT_punishments.2.no:0 "Les impérialistes soviétiques ont rejeté notre demande d'extradition de Puyi ; au lieu de cela, ils l'ont jusqu'à présent extradé vers le régime communiste de Mandchourie, dans une tentative de contrarier carrément nos relations avec nous. Cet acte ne passera cependant pas inaperçu dans les décennies à venir."
 KMT_punishments.2.a:0 "Les Soviétiques ont changé d'avis."
 KMT_punishments.2.b:0 "Comment osent-ils !"

 KMT_punishments.3.t:0 "Le destin de Puyi"
 KMT_punishments.3.d:0 "Alors que les Soviétiques ont accepté d'extrader Puyi, il est temps pour nous de déterminer le sort du dernier empereur de Chine, qui est détesté par la majorité de la population chinoise, non seulement pour ses liens avec la dynastie Qing, mais aussi pour ses actions de collaboration avec le Japon de 1932 à 1945. Puyi a vécu une vie somptueuse et est gâté jusqu'à la moelle en raison de son statut d'ancien empereur de Chine. L'empereur de Chine est terminé et que sa vie est en jeu."
 KMT_punishments.3.a:0 "Faites-le exécuter par un peloton d'exécution"
 KMT_punishments.3.b:0 "L'emprisonner à vie"

 KMT_punishments.4.t:0 "Le destin de Chen Yi"
 KMT_punishments.4.d:0 "Chen Yi, l'ancien gouverneur de la province de Taiwan, est responsable de l'incident du 28 février, lorsqu'il a déclenché une répression brutale contre la population locale taïwanaise. Ainsi, une série de mécontentements contre notre régime a déjà été suscitée et l'opinion des habitants taïwanais à notre sujet est entachée à cause de Chen. Même avec sa destitution du gouvernement de Taiwan, cela ne semble pas suffire à apaiser la population taïwanaise locale. Nous devons agir et punir l'auteur de tout ce désordre et tenter de regagner le coeur de la population taïwanaise locale."
 KMT_punishments.4.a:0 "Condamnez-le à mort"
 KMT_punishments.4.b:0 "Le punir d'une peine à perpétuité"
 KMT_punishments.4.c:0 "Pardonnez-lui, il mérite une autre chance"


 KMT_punishments.6.t:0 "Le prince Demchudongrub échappe à la prison communiste"
 KMT_punishments.6.d:0 "\nLe prince Demchudongrub, également connu sous le nom de prince De, fut l'une des principales figures derrière la défection de la Mongolie intérieure au profit des Japonais en 1936, bien qu'on lui ait offert l'autonomie plus tôt. Bien qu'il ait été emprisonné par les communistes à Pékin, il a reçu des informations d'Oulan-Bator selon lesquelles il profiterait de l'exil en Mongolie extérieure après la guerre. Cependant, le prince De a pu découvrir la nouvelle selon laquelle les autorités de Mongolie intérieure faisaient pression sur le gouvernement mongol pour qu'il soit arrêté et extradé. Il a ainsi pu éviter son arrestation de justesse en fuyant et en traversant la frontière entre la Chine et la Mongolie dans le désert de Gobi. À son retour en Chine, il a été chaleureusement accueilli par le gouvernement chinois et a de nouveau annoncé son allégeance au gouvernement du Kuomintang."
 KMT_punishments.6.a:0 "Bon retour, vieil ami."
 KMT_punishments.6.b:0 "Maudit soit le KMT !"

 KMT_punishments.7.t:0 "Destin de Zhang Xueliang"
 KMT_punishments.7.d:0 "Zhang Xueliang, surnommé le jeune maréchal qui a servi comme chef de guerre de la clique Fengtian qui a succédé à son père, Zhang Zuolin également connu sous le nom de vieux maréchal. Après la défaite désastreuse de la bataille de la Grande Muraille, Zhang a été réaffecté pour réprimer les communistes dans le Shaanxi dans le cadre de la campagne de répression des bandits du nord-ouest. Il a alors commencé à sympathiser avec les communistes et a tourné le dos au Kuomintang en arrêtant Chiang à Xi'an et en le forçant à former un front uni avec les rouges. Après ce qui s'est passé à Xi'an, Chiang a arrêté Zhang peu de temps après, le plaçant en résidence surveillée pour trahison contre le Kuomintang, l'empêchant de parvenir à faire défection chez les communistes. Alors que les communistes se sont retirés en Mandchourie, de nombreux hommes politiques ont appelé au procès de Zhang ainsi que d'autres sympathisants communistes afin de faire pression sur nous pour qu'ils s'occupent des traîtres à la République. Cependant, en raison de son expérience en Mandchourie sous son père et après sa mort, certains le considèrent comme un atout précieux dans notre future reconquête de la Mandchourie. Si sa loyauté est discutable, ses compétences et son expertise ne le sont pas."
 KMT_punishments.7.c:0 "Personne ne connaît mieux la Mandchourie que lui. Gardez-le à proximité."


 KMT_REFORM.1.d:0 "Un nouveau Comité central de réforme a été créé pour mieux orienter les futurs développements politiques de la république et réformer le KMT. Le nouveau comité évitera l'ineptie et la corruption des comités exécutifs précédents en encourageant les membres du parti instruits, jeunes et très motivés à diriger les efforts et à revitaliser le parti. Le comité a déjà présenté des plans pour les réformes à venir, telles que la réorganisation de la formation des cadres, la réinscription des anciens membres et des contrôles plus stricts des responsables du parti. Chiang Kai-Shek est un leader confirmé, promettant de poursuivre son approche dure de centralisation de l'État, de réformes approfondies du parti et de suppression des restes communistes."
 KMT_REFORM.1.a:0 "Vers le progrès sous son règne."

 chi.1.t:0 "Accepter la RPC à l'ONU"
 chi.1.d:0 "La République populaire de Chine souhaite être reconnue comme le successeur de la République de Chine par les Nations Unies. Le gouvernement du Kuomintang de la République de Chine a fui vers Taiwan et la République populaire de Chine contrôle le continent. Devons-nous plaider pour que le siège de la République de Chine-Taiwan soit confié à la République populaire de Chine ?"
 chi.1.a:0 "Oui bien sûr!"
 chi.1.b:0 "Non, ils resteront dehors."

 CHI_KOR.0.d:0 "L'ambition sans fin de notre ennemi mortel à Pékin a fait une nouvelle victime ; la jeune République de Corée, longtemps en proie à l'agitation de Kim Ill Sung, s'est effondrée dans la guerre civile, la révolution de Mao Zedong soutenant sans aucun doute les forces de Sung au Nord comme moyen de lutter contre le soutien entrant des États-Unis, eux-mêmes en route pour soutenir le gouvernement républicain de Séoul ; c'est une situation que nous, Chinois patriotes, connaissons très bien ce genre de conflit.\n\nLes yeux du monde entier se tournent une fois de plus vers l'Asie alors que la guerre civile coréenne s'intensifie, et la République de Chine ne restera pas les bras croisés alors que la menace rouge frappe le bon peuple de Corée depuis son bastion de Pyongyang.\n\nCependant, bien que le général Macarthur ait fortement encouragé une intervention nationaliste chinoise dans la guerre de Corée, le président Truman s'est ouvertement opposé à cette idée. Par conséquent, la proposition d'intervention des États-Unis dans la guerre de Corée est plus que susceptible d'échouer."

 CHI_KOR.1.d:0 "Notre récente décision de nous impliquer dans la guerre civile en Corée a attiré l'attention des ennemis de la RPC et de leur soutien à Kim Ill Sung ; La République de Chine à Taiwan et les restes du Kuomintang ont proposé de rejoindre l'armée américaine dans la lutte contre l'armée nord-coréenne.\n\nMême si toute tentative visant à empêcher la marée rouge en Asie est la bienvenue, choisir d'impliquer Taïwan pourrait irriter le gouvernement de Pékin, provoquant éventuellement une invasion depuis la Mandchourie"

 CHI_KOR.2.d:0 "La correspondance officielle de Washington D.C. Nous apprend que le gouvernement américain a approuvé la proposition de Chiang Kai-Shek et que l'armée américaine travaillera de concert avec l'armée du Kuomintang dans un effort combiné contre l'armée nord-coréenne ! Le feu vert est désormais donné et d'ici quelques semaines nous lancerons la contre-offensive contre l'APL."

 CHI_KOR.3.d:0 "La correspondance officielle de Washington DC a informé Chiang Kai-Shek du souhait du président que la République de Chine n'intervienne pas dans la guerre civile coréenne, citant les craintes que toute incursion militaire en provenance de Taiwan n'invoquerait des représailles militaires de la part de Pékin, transformant potentiellement la guerre en crise internationale."

 CHI_KOR.4.d:0 "\nAvec le déclenchement de la guerre civile en Corée, il est tout à fait naturel que les ennemis du bloc communiste asiatique soutenant la révolte communiste à Pyongyang cherchent à se joindre aux combats ; Pas même un an après la guerre civile chinoise, les restes du Kuomintang à Taiwan ont décidé, une fois de plus, de prendre les armes contre l'Armée rouge chinoise qui soutient Kim Ill Sung en Corée du Nord.\n\nAprès une récente correspondance entre le président de la République de Chine Chiang Kai-Shek à Taipei et le président américain Harry Truman à Washington, les États-Unis ont donné leur feu vert aux armées du Kuomintang pour aider l'armée américaine contre la Corée du Nord et la Chine rouge, estimant que leurs expériences contre les forces chinoises rouges seraient d'une immense aide contre la menace à laquelle elles sont confrontées."

 CHI_KOR.5.t:0 "[GetNewspaperHeader]La République de Chine se retire de Corée"
 CHI_KOR.5.d:0 "Après des combats acharnés et des tentatives désespérées de défense, la coalition de l'ONU et les forces sud-coréennes ne pouvaient plus résister à l'avancée de l'offensive sino-coréenne en Corée du Sud. Alors que les forces de l'ONU sont toujours dans le pays dans l'espoir de renverser le cours de la guerre, les forces nationalistes chinoises sous le commandement du [CHI.GetLeader] ont reçu l'ordre de se retirer de la péninsule et de rentrer chez elles à Taiwan. Le Parti communiste chinois a discrédité cette annonce en la qualifiant d'exemple de la faiblesse de l'armée du Kuomintang et du fait que la libération de Taiwan par l'APL est inévitable. Les États-Unis ont exprimé de grandes inquiétudes mais ont aidé la République dans ses efforts d'évacuation afin de minimiser le nombre de victimes."
 CHI_KOR.5.a:0 "Sans surprise."

 CHI_KOR.6.t:0 "[GetNewspaperHeader]La République de Chine rejoint la guerre de Corée"
 CHI_KOR.6.d:0 "Avec le déclenchement de la guerre civile en Corée, il est tout à fait naturel que les ennemis du bloc communiste asiatique soutenant la révolte communiste à Pyongyang cherchent à se joindre aux combats ; Pas même un an après la guerre civile chinoise, les restes du Kuomintang à Taiwan ont décidé, une fois de plus, de prendre les armes contre l'Armée rouge chinoise qui soutient Kim Ill Sung en Corée du Nord.\n\nAprès une récente correspondance entre le président de la République de Chine Chiang Kai-Shek à Taipei et le président américain Harry Truman à Washington, les États-Unis ont donné leur feu vert aux armées du Kuomintang pour aider l'armée américaine contre la Corée du Nord et la Chine rouge, estimant que leurs expériences contre les forces chinoises rouges seraient d'une immense aide contre la menace à laquelle elles sont confrontées. En outre, le Kuomintang coordonne une frappe contre le continent communiste avec l'aide des restes du KMT dans les régions du Qinghai et de Birmanie, dans l'espoir de détourner encore davantage l'attention de l'APL et de déstabiliser la direction des forces chinoises rouges."
 CHI_KOR.6.a:0 "Inquiétant."

 CHI_KOR.7.t:0 "Déclenchement de la guerre de Corée"
 CHI_KOR.7.d:0 "Au cours de l'un des derniers moments de notre propre guerre civile, les communistes du nord de la Corée ont lancé une invasion du sud, déclenchant un conflit dans la région, tout comme les perfides communistes chinois l'ont fait avec nous. Nos frères anticommunistes coréens sont dans la même situation que celle dans laquelle nous nous trouvions autrefois, nous devons les aider immédiatement à renverser ces racailles communistes qui sévissent en Asie."
 CHI_KOR.7.a:0 "Deux nations, une lutte."

 CHI_KOR.8.t:0 "[GetNewspaperHeader] La République de Chine condamne la Corée du Nord"
 CHI_KOR.8.d:0 "Dans un geste surprenant, [CHI.GetLeader] a publiquement condamné la République populaire démocratique de Corée pour son invasion de la République de Corée, déclarant que cette invasion était injuste et avait prouvé que le bloc communiste était plein de bellicistes. Sa déclaration a été considérée comme inattendue par de nombreux journalistes, car les nationalistes chinois s'étaient encore complètement remis de leur état de guerre après leur « victoire » dans la guerre civile contre les communistes chinois. Certains hommes politiques ont affirmé qu'il semblait que la Chine allait intervenir dans la guerre de Corée par le biais d'un conflit armé direct comme moyen et justification pour reprendre la guerre civile avec les communistes en Mandchourie et mettre fin au combat avec eux. Malgré cela, le gouvernement américain à Washington a soutenu la condamnation de Pyongyang par les nationalistes et y a vu une victoire diplomatique en Asie, la position anticommuniste dure de la République de Chine garantissant que le bloc communiste aura du mal à s'étendre en Asie."
 CHI_KOR.8.a:0 "Prélude à la reprise de la guerre civile chinoise ?"

 CHI_KOR.9.t:0 "La République de Chine envoie des stocks de guerre civile"
 CHI_KOR.9.d:0 "Dans le but d'améliorer les liens et de freiner la menace communiste, la République de Chine a envoyé une grande partie de ses stocks militaires de la guerre civile chinoise, nous assurant que nous ne sommes pas seuls dans cette lutte contre le communisme en Asie."
 CHI_KOR.9.a:0 "A bas les communistes ensemble !"

 CHI_KOR.10.t:0 "La République de Chine envoie des conseillers militaires"
 CHI_KOR.10.d:0 "Pour aider à empêcher le communisme de s'emparer de l'ensemble de la péninsule coréenne, la République de Chine a envoyé ses officiers aguerris en tant que conseillers en Corée, dans l'espoir de nous donner un moyen de pression supplémentaire contre les communistes. Ces conseillers peuvent s'avérer utiles dès maintenant et à l'avenir et amélioreront grandement les relations entre nos deux pays."
 CHI_KOR.10.a:0 "Bienvenue en Corée."

 CHI_KOR.11.t:0 "La Chine propose avec nous un traité de défense mutuelle"
 CHI_KOR.11.d:0 "Avec la fin de la guerre de Corée, la Chine a proposé de former une alliance militaire avec nous pour assurer la survie de nos deux nations en Asie. Cet accord introduira des plans pour des entraînements militaires conjoints, un accès militaire des troupes chinoises en Corée et une coopération plus poussée entre les deux pays. Nanjing nous a rassuré sur le fait que l'accord sera utile pour la libération de l'Asie du communisme à l'avenir, et ne sera pas une autre alliance militaire lâche."
 CHI_KOR.11.a:0 "Signez le traité de défense mutuelle."
 CHI_KOR.11.b:0 "Nous refusons de le signer."

 CHI_KOR.13.t:0 "[GetNewspaperHeader] La République de Corée refuse de signer un traité de défense mutuelle avec la Chine"
 CHI_KOR.13.d:0 "Dans ce que les nationalistes chinois considèrent comme une mesure diplomatique décisive pour renforcer la coopération avec le gouvernement anticommuniste de Séoul, Séoul a rejeté l'idée d'un traité de défense mutuelle sino-coréen, déclarant que leurs intérêts reposaient actuellement sur les États-Unis et qu'ils ne cherchaient pas de soutien étendu de la part des nationalistes chinois. Le gouvernement nationaliste chinois, qui s'est senti insulté par la réponse de la Corée du Sud, a immédiatement mis fin aux relations diplomatiques avec ce pays et a retiré ses conseillers, dont beaucoup avaient été envoyés pendant la guerre de Corée. Les États-Unis ont jusqu'à présent tenté de modifier les liens entre les deux nations en mettant l'accent sur la diplomatie anticommuniste, qui était ce qui a rapproché les deux nations en premier lieu."
 CHI_KOR.13.a:0 "Le bloc anticommuniste en Asie s'effondre."

 CHI_KOR.12.t:0 "[GetNewspaperHeader] Le traité de défense mutuelle sino-coréen"
 CHI_KOR.12.d:0 "Le gouvernement sud-coréen a signé le traité de défense mutuelle de son plein gré après avoir reçu la proposition du gouvernement chinois à Nanjing, reconnaissant que c'était le seul moyen pour les deux nations de rapprocher leur chemin vers la destruction du communisme en Asie. Cette démarche diplomatique a été considérée par de nombreux hommes politiques américains comme une « victoire » pour le bloc anticommuniste en Asie, car ce traité de défense mutuelle entre les deux nations garantissait leur engagement à s'opposer au communisme, ce qui les maintenait à leur tour dans la guerre froide. Le gouvernement de Nanjing a promis au gouvernement sud-coréen une aide militaire et des programmes de formation plus étendus, en plus de recevoir un autre groupe de conseillers professionnalisés, vétérans de la guerre sino-japonaise et de la guerre civile chinoise."
 CHI_KOR.12.a:0 "Les tensions en Asie semblent bouillonner."
 
 CHI_KOR.14.t:0 "La reddition de la Corée du Sud"
 CHI_KOR.14.d:0 "L'un de nos pires cauchemars est devenu réalité. Les soldats de l'APK, aux côtés des bandits Gongfei, ont de nouveau marché sur Séoul et ont assuré leur contrôle sur toute la péninsule coréenne. Le président Syngman Rhee et son cabinet ont fui vers l'île de Jeju ou vers les États-Unis en quête d'exil. Washington a annoncé qu'il évacuerait toutes ses forces de Corée et les redirigerait vers le Japon et les îles environnantes. Les Américains nous ont exhortés à suivre leur exemple et à retirer toutes nos troupes à Taiwan, étant donné qu'une invasion de la Chine continentale se terminerait par un désastre si nous ne nous retirons pas immédiatement."
 CHI_KOR.14.a:0 "Évacuer? Dans notre moment de triomphe ?"
 CHI_KOR.14.b:0 "Oubliez Mao, nous réduisons nos pertes et nous nous retirons."
 
 CHI_KOR.15.t:0 "La reddition de la Corée du Nord"
 CHI_KOR.15.d:0 "Les fantoches soviétiques à Pyongyang autour de Kim Il-sung ont été chassés par la coalition de l'ONU, la Corée du Sud unifiant la péninsule. Les soldats sud-coréens, aux côtés des soldats du ROCA et des Américains, ont de nouveau marché sur Pyongyang et ont assuré leur contrôle sur toute la péninsule coréenne. Le président Syngman Rhee et son cabinet ont exprimé leur gratitude pour notre aide, mais lui et Washington ont annoncé qu'aucune avancée supplémentaire en Chine ne serait réalisée par les forces coréennes et américaines. Les Américains nous ont exhortés à suivre leur exemple et à retirer nos troupes à Taiwan, étant donné qu'une invasion de la Chine continentale se terminerait désormais par un désastre si nous ne nous retirons pas immédiatement."
 CHI_KOR.15.a:0 "Évacuer? Dans notre moment de triomphe ?"
 CHI_KOR.15.b:0 "Oubliez Mao, nous avons réalisé ce que nous voulions... pour l'instant."

 
 CHI_KOR_TT:0 "[CHI.GetNameDef] rejoindra officiellement la guerre de Corée contre les agresseurs communistes."

 KMT_Lift_Martial_Law2:0 "Lever la loi martiale"

 KMT.10.d:0 "En République de Chine, le parti au pouvoir, le Kuomintang, a annoncé qu'il expulserait Lei Chen, ancien conseiller présidentiel et fondateur du périodique Free China. Bien que Chine Libre ait été fondée en tant que publication indépendante libre de discuter ouvertement des problèmes et d'agir en contraste avec la dureté des médias contrôlés par les communistes, le Kuomintang a trouvé les publications récentes de Chine Libre dangereuses. Plus précisément, plusieurs articles ont critiqué le Kuomintang pour ne pas avoir respecté les procédures constitutionnelles, notamment en termes de limitation des mandats, et le gouvernement a estimé que Lei Chen était à l'origine de ces critiques. Lei Chen est un partisan reconnu de la constitution, même aux dépens du Kuomintang, et il semble que cette position lui ait coûté son adhésion au parti. Il devrait continuer à défendre ses convictions, mais désormais en dehors du parti."

 Formosa.10.d:0 "Le Mouvement 228 fait référence aux massacres et à la répression brutale des manifestants taïwanais par la République de Chine contrôlée par le Kuomintang le 28 février 1947. Les manifestations contre la corruption et l'agression d'une veuve par des représentants de l'État ont abouti au déploiement de troupes qui ont tué des milliers de personnes pour mettre fin aux manifestations. Cela a également déclenché une dure campagne de répression contre le peuple taïwanais à qui il était interdit de discuter ou de se souvenir des événements. Tout cela a accru les tensions entre les Taïwanais et les Chinois du continent. De nombreux Taïwanais n'ont pas oublié et continuent de considérer ces événements comme un exemple clair de la corruption et de la brutalité du Kuomintang de Chine continentale. Ils y voient également la preuve que Taiwan doit être libre et indépendant pour contrôler son propre destin."

 Formosa.11.d:0 "Dans un développement étonnant en République de Chine, le gouvernement au pouvoir s'est effondré face à un soulèvement mené par des Taïwanais irrités par la domination et le contrôle de leur île suite à l'arrivée du Kuomintang de Chine continentale après leur défaite pendant la guerre civile chinoise. Les jours précédents, dans toute l'île, notamment dans la capitale Taipei, des milliers de personnes sont descendues dans la rue. Le gouvernement a déployé des policiers et des militaires avec pour ordre de mettre fin aux manifestations par la violence, mais cela n'a fait qu'inciter davantage de personnes à se joindre aux manifestations. Lorsque le gouvernement a ordonné aux troupes d'utiliser des armes réelles, de nombreuses troupes ont refusé et se sont jointes au soulèvement. Sans le soutien de l'armée, le gouvernement s'est rendu et de nombreuses personnes ont fui vers des missions diplomatiques amies ou vers l'aéroport afin de chercher protection ou de fuir. Les journaux du pays ont annoncé le succès de la révolution de Formose."

 Formosa.12.d:0 "La récente révolution de Formose a vu la population de l'île d'avant l'arrivée du Kuomintang en 1945 prendre enfin le contrôle de l'île. Les révolutionnaires qui ont réussi ont récemment annoncé la création d'un nouveau gouvernement provisoire de Formose pour faire passer l'île vers une nouvelle ère de gouvernance inclusive et juste. Lors des troubles, certains anciens responsables et partisans du gouvernement ont réussi à fuir, mais un grand nombre reste sur l'île, notamment des réfugiés qui ont fui la Chine continentale et les communistes. Pour l'instant, le nouveau gouvernement a déclaré que ces personnes seraient surveillées de près, que ceux qui ont commis des crimes seraient punis et qu'une fois le gouvernement établi, il déciderait quoi faire des réfugiés. Cette déclaration n'a pas été perçue comme rassurante par les réfugiés et de nombreux partisans du Kuomintang sont également préoccupés par la mission sacrée de libération du continent."

 Formosa.100.d:0 "Le nouvel État de Formose a récemment annoncé dans une émission nationale qu'il renonçait à toutes ses revendications sur la Chine continentale. Il déclarait que la nation ne consacrerait plus ses efforts et ne sacrifierait plus ses ressources à une cause qui n'avait que peu d'importance au-delà des réfugiés et des loyalistes du Kuomintang. Formose ne se préoccupe que du bien-être, de la sécurité et du développement de sa propre population. Ils ont ajouté qu'en se lavant les mains de ces revendications territoriales, ils espéraient établir des liens amicaux et de bon voisinage avec le régime communiste chinois, mais qu'ils restaient déterminés à défendre leurs frontières contre l'agression. Pékin n'a pas reçu de réponse officielle, mais de nombreux analystes estiment que l'annonce de Formose ne changera probablement pas la position du gouvernement de la Chine continentale selon laquelle l'île est une province de la Chine et devrait être restituée au pays."

 KMT.110.d:0 "La République de Chine (ROC) et son parti au pouvoir, le Kuomintang, ont accueilli favorablement la visite présidentielle du président américain [USA.GetLeader]. La visite dans la capitale est intensément médiatisée par la presse insulaire pour souligner le niveau de soutien international sur lequel la République de Chine peut compter dans sa lutte pour libérer la Chine. Les deux pays devraient discuter de l'expansion de la coopération en matière de défense, du commerce et de l'environnement de sécurité régionale. Le président [USA.GetLeader] rencontrera de hauts responsables du gouvernement et devrait visiter des sites culturels à travers le pays. Le gouvernement communiste chinois a publié sa propre déclaration condamnant les États-Unis pour leur ingérence dans les affaires intérieures de la Chine et a réitéré qu'il ramènerait bientôt l'île rebelle. En réponse, un homme politique de la République de Chine a condamné la déclaration de la partie continentale et a ajouté que la visite légitime le gouvernement du Kuomintang et contribuera à faire taire les critiques de ses objectifs."

 KMT.201.d:0 "Aujourd'hui, sur l'île de Taiwan, un coup d'État a eu lieu contre le généralissime Chiang Kai-Shek. Selon les autorités et les représentants militaires, le général Sun-Li Jen, l'un des meilleurs généraux et dirigeants de la République de Chine, a mené un coup d'État militaire pour renverser ce qu'il prétend être « un dirigeant raté et honteux pour la nation chinoise ». Favorisés par les Américains, beaucoup affirment que le coup d'État a été soutenu par la CIA et par le président américain, mais ces affirmations n'ont jusqu'à présent reçu aucun soutien ; il semble que ce ne soit qu'une rumeur parmi une pléthore de rumeurs concernant la déposition de Chiang."

 KMT.150.d:0 "Le Rommel de l'Est, le général militaire Sun-Li Jen a été arrêté aujourd'hui par les autorités sous les ordres du généralissime Chiang Kai-Shek ; affirmant que le premier préparait un coup d'État militaire pour renverser et opprimer les Chinois à Taiwan, Kai-Shek s'est engagé à infliger une punition sévère au général, étant accusé de plusieurs négligences en permettant à ses subordonnés de participer à une révolte impliquant des agents communistes ; Le général est actuellement assigné à résidence, dans l'attente d'un sort futur."

 #KMT on Mainland 50s Events#

 CHI_KMT.0.d:0 "Les récentes modifications des dispositions temporaires, initialement introduites pour aider le gouvernement à réprimer l'insurrection communiste, marquent une évolution significative. Initialement mise en oeuvre pour suspendre temporairement certaines libertés politiques et civiles, la première série de dispositions temporaires visait à renforcer les opérations de l'État contre les communistes et à empêcher leur infiltration. Avec une stabilisation temporaire du front, l'Assemblée nationale a voté la révision de ces dispositions pour faciliter dès maintenant la démobilisation politique. En vertu des nouvelles dispositions, le président [CHI.GetLeader] obtient une autorité renforcée pour rétablir le contrôle de l'État sur les territoires restaurés et éliminer tous les sympathisants communistes restants."

 CHI_KMT.1.d:0 "Le KMT se trouve à la croisée des chemins. Ces dernières années, le pays a survécu à une guerre avec le Japon et à une résurgence communiste massive qui a failli renverser le régime. De nombreux membres du parti favorables aux réformes affirment désormais que le moment est venu d'initier des réformes et de changer le cap du parti. Ils accusent la corruption, l'incompétence et le manque de moral d'être la raison pour laquelle le Japon et les communistes ont pu prospérer. Des réformes plus radicales renforceront l'État et empêcheront toute idéologie ou force hostile de prospérer dans la république. Cependant, il existe des oppositions au sein du parti, principalement des factions anti-réformistes qui profitent du système actuel, qui ne sont pas d'accord et soutiennent que ce n'est que grâce à la centralisation et à la loi martiale que la république a été suffisamment forte pour vaincre les menaces. Ils soutiennent que la Chine doit continuer sur cette voie afin de parachever son indépendance et son unification. Le président [CHI.GetLeader] doit décider soit de réformer pour survivre, soit de permettre aux factions corrompues de continuer à déchirer le Kuomintang."

 CHI_TIB.0.d:0 "Le Dalaï Lama a déclaré son indépendance et gouverne le Tibet depuis 1912. Dans le passé, la République de Chine a généreusement offert au Dalaï Lama ses titres historiques et s'est excusée pour tout excès commis pendant la période Qing, mais il refuse de s'engager avec nous. Nous maintenons que la souveraineté du Tibet est chinoise, mais le Dalaï Lama continue de le nier et a négocié des territoires dans le passé sans notre permission. Le moment est venu pour nous d'imposer une résolution sur le Tibet et de décider une fois pour toutes de ses relations avec la république."

 KMT_MIL.1.d:0 "Un groupe d'officiers supérieurs a présenté son rapport sur les capacités de combat, la logistique et l'organisation des forces armées. Le rapport met en lumière les griefs des soldats concernant le mauvais soutien logistique et les salaires inégaux. Il a également souligné des problèmes liés au manque de leadership parmi les officiers et à la formation inadéquate des soldats. Sans réformes, l'Armée nationale révolutionnaire risque de continuer à décliner. La structure actuelle encourage également l'organisation de cliques et le territorialisme et cela doit également être réformé. Les dirigeants nationaux ont décidé de donner suite au rapport et lanceront une série de réformes pour résoudre ces problèmes et renforcer la défense nationale."

 KMT_NUCLEAR.1.d:0 "Le président [CHI.GetLeader] a supervisé l'ouverture du nouvel Institut de recherche sur l'énergie nucléaire. Cela marque une nouvelle focalisation du gouvernement sur le potentiel de la technologie nucléaire. Le gouvernement chinois espère que l'énergie nucléaire pourra jouer un rôle majeur pour répondre à la demande énergétique future à mesure que la Chine progresse. Toutefois, l'institut étudiera également le développement privé d'armes nucléaires. La question sera de savoir si la Chine cherche à développer de telles armes seule ou en demandant l'aide des Américains. Si nous les développions nous-mêmes, nous maîtriserions totalement ces armes, mais cela pourrait prendre beaucoup de temps. Faire venir les Américains accélérerait le développement mais limiterait notre indépendance et notre capacité à adapter le programme à notre situation. Nous devons décider quelle voie prendre, car les communistes sont sans aucun doute en train de développer leur propre bombe."

 CHI_INDO.0.d:0 "Depuis la fin de la Seconde Guerre mondiale, la région d'Indochine a été victime de multiples mouvements révolutionnaires rouges, cherchant à renverser les régimes établis et travaillant en étroite collaboration avec les partis communistes de l'Union soviétique et de la Chine. La République de Chine a exprimé son plus grand intérêt à soutenir notre pays dans sa lutte contre les insurrections communistes afin d'affaiblir le mouvement communiste en Asie de l'Est."

 CHI_INDO.1.t:0 "La République de Chine reconnaît le gouvernement [GetVIEChiefOfState]"
 CHI_INDO.1.d:0 "Après avoir établi son ambassade à Saigon et reconnu ainsi le gouvernement du Sud comme gouvernement légitime du Vietnam, la République de Chine a décidé de soutenir ouvertement le régime de [GetVIEChiefOfState]. Les experts prédisent une implication chinoise dans le mouvement nationaliste de Vu-hong-Khanh, mais Nanjing a décidé d'ignorer ses ambitions et de travailler avec le gouvernement actuel. On ne sait pas si cette décision a été influencée par les États-Unis, mais pour l'instant, la République de Chine travaillera aux côtés de Saigon contre le Parti des travailleurs du Vietnam."
 CHI_INDO.1.a:0 "Magnifique."
 CHI_INDO.1.b:0 "Juste une autre marionnette de l'Occident."

 CHI_INDO.2.t:0 "Nanjing s'inquiète des minorités chinoises à Cho Lon"
 CHI_INDO.2.d:0 "Notre gouvernement a promulgué certaines lois favorisant les groupes ethniques indigènes du Vietnam au fil des années. Cependant, depuis l'établissement des relations entre notre État et la République de Chine, les pressions de l'intérieur et de l'extérieur du pays se sont accrues pour réviser ces lois. Même si Nanjing ne peut pas se permettre de cesser son soutien d'un point de vue géopolitique, l'intensité et les formalités de nos relations pourraient en subir de graves dommages. Il nous appartient maintenant de décider si nous modifierons notre politique à l'égard des minorités chinoises ou si nous maintiendrons le statu quo."
 CHI_INDO.2.a:0 "Nous ne pouvons pas risquer de perdre le soutien chinois. Révisez ces lois."
 CHI_INDO.2.b:0 "Offre Nanjing délocalisation compensée."

 CHI_INDO.3.t:0 "Le gouvernement vietnamien révise les lois anti-chinoises"
 CHI_INDO.3.d:0 "Saigon a reconnu que notre soutien à leur cause est trop précieux pour être perdu. Les lois concernant la discrimination légale des citoyens chinois dans les territoires contrôlés par l'État du Vietnam seront modifiées pour garantir l'égalité des droits et de traitement à ces individus. Il s'agit d'une grande réussite pour notre gouvernement, qui montre clairement que nous protégeons le peuple chinois non seulement à l'intérieur de nos frontières mais aussi à l'extérieur de notre territoire."
 CHI_INDO.3.a:0 "Un jour important pour les Chinois d'outre-mer !"

 CHI_INDO.4.t:0 "La contre-offre de Saigon"
 CHI_INDO.4.d:0 "Le gouvernement du Vietnam a rejeté notre demande de révision des lois concernant la discrimination légale et le traitement inégal des citoyens chinois au Vietnam. Ils ont affirmé que la volonté des groupes ethniques indigènes du Vietnam devait primer en matière de politique nationale, mais Saigon reste ouvert à la négociation. Ils ont rédigé une contre-offre, proposant que nous reprenions les citoyens chinois et leur graciions, tout en recevant une compensation de Saigon pour ces individus, afin de les aider à construire une nouvelle vie dans la République."
 CHI_INDO.4.a:0 "Nous serons d'accord sur cela. Ramenons nos camarades à la maison."

 CHI_INDO.5.t:0 "Investissement chinois"
 CHI_INDO.5.d:0 "Les derniers mois de coopération et de communication intensives avec le gouvernement chinois ont porté leurs fruits. Les entreprises chinoises investissent dans nos activités et diffusent leurs produits sur nos marchés, ce qui entraîne un flux accru de capitaux dans notre économie. Avec leur aide, nous bâtirons une économie qui garantira la prospérité et la stabilité sociale, à l'opposé des économies planifiées radicales des bandits du Nord."
 CHI_INDO.5.a:0 "Merveilleux!"

 CHI_INDO.6.t:0 "La République de Chine affirme son soutien au Viet-Quoc"
 CHI_INDO.6.d:0 "Après avoir établi son ambassade à Saigon et reconnu ainsi le gouvernement du Sud comme gouvernement légitime du Vietnam, la République de Chine a décidé de soutenir secrètement le mouvement nationaliste Viet-Quoc dirigé par Vu-hong-Khanh. S'inspirant du Kuomintang, le VNQDD a gagné un petit nombre de partisans parmi les Nordistes, notamment parmi les enseignants et les intellectuels. Le parti, qui eut moins de succès auprès des paysans et des ouvriers industriels, était organisé en petites cellules clandestines. Les experts ont prédit à l'avance l'implication de la Chine dans le mouvement nationaliste de Vu-hong-Khanh, compte tenu de l'orientation anti-impérialiste du gouvernement de Nanjing, qui considère les rebelles du Nord uniquement comme des marionnettes de l'Union soviétique et reste sceptique quant à l'influence occidentale au Sud-Vietnam. Pour l'instant, la République de Chine continuera de travailler aux côtés de Saigon dans une certaine mesure contre le Parti des travailleurs du Vietnam, mais ses projets de relocalisation des ressources vers le Viet-Quoc ne passeront pas inaperçus."
 CHI_INDO.6.a:0 "Pathétique!"

 CHI_INDO.7.t:0 "La République de Chine offre de nouvelles relations amicales avec nous"
 CHI_INDO.7.d:0 "Voyant les relations diplomatiques s'épanouir, le gouvernement nationaliste chinois a demandé un pacte de non-agression avec le Vietnam qui vise principalement à ne pas interférer avec l'influence économique chinoise en Indochine dans son ensemble. En échange, la Chine abandonnera complètement son soutien au Mouvement Viet Quoc et livrera les membres du Mouvement qui résident toujours en Chine."
 CHI_INDO.7.a:0 "Acceptez leur proposition !"
 CHI_INDO.7.b:0 "Ils ont suffisamment influencé le Vietnam."

 CHI_INDO.8.t:0 "Une mission militaire chinoise en Indochine"
 CHI_INDO.8.d:0 "Alors que le gouvernement de Saigon tente de combattre la guérilla communiste du nord par des campagnes coûteuses, le gouvernement chinois de Nanjing a organisé la mission militaire en Indochine sous la direction du général Nguyen Chan-A. Il ne fait cependant aucun doute que cela permettra aux deux pays de faire un pas en avant vers le développement de nouvelles relations amicales."
 CHI_INDO.8.a:0 "Un succès."
 CHI_INDO.8.b:0 "Excellent!"
 CHI_INDO.8.ab:0 "Les officiers de Nanjing sont les bienvenus à Saigon."

 CHI_INDO.9.t:0 "Réorganisation du VNQDD"
 CHI_INDO.9.d:0 "Grâce aux efforts du Kuomintang pour intervenir dans les affaires du Parti et réorganiser le Viet Quoc, des réformes et des changements massifs ont été apportés à l'organisation du Parti parallèlement à des purges qui impliquaient l'aide de la police secrète nationaliste chinoise. Bien que la purge ait été partiellement sanglante, son résultat a permis au parti VNQDD de mettre fin à sa dépendance à l'égard des propriétaires terriens et des hommes d'affaires, leur permettant ainsi d'élargir leur base de soutien pour inclure la paysannerie."
 CHI_INDO.9.a:0 "L'impérialisme chinois au grand jour"
 CHI_INDO.9.b:0 "Maintenant, le Vietnam marche vers une révolution tridémiste !"

 CHI_INDO.10.t:0 "Former le Viet Quoc"
 CHI_INDO.10.d:0 "Divers généraux ayant allégeance au VNQDD ont été envoyés en Chine pour recevoir une formation militaire de nos généraux qui ont combattu durement pendant la guerre de Résistance et la guerre civile chinoise. Ils s'enrôleront dans notre académie militaire et recevront une formation appropriée avant d'être renvoyés au Vietnam pour déclencher une révolution."
 CHI_INDO.10.a:0 "Une révolution menée par l'étranger ? Les Chinois ont dépassé les limites !"
 CHI_INDO.10.b:0 "Le Vietnam s'unira sous le drapeau de l'Étoile Blanche !"

 CHI_INDO.11.t:0 "Le Vietnam refuse notre proposition"
 CHI_INDO.11.d:0 "Saigon a répondu à notre proposition, la déclinant, affirmant qu'elle « affectait » la politique étrangère du Vietnam en Indochine, l'influence chinoise dominant la région. Cette réponse soudaine a conduit de nombreux hommes politiques à se battre sur l'orientation de la politique étrangère chinoise à l'égard du Vietnam, des responsables nationalistes radicaux souhaitant ré-soutenir le VNQDD afin de l'utiliser pour écraser le régime de Saigon, tandis que de fervents responsables anticommunistes souhaitaient ignorer la réponse du Sud-Vietnam et maintenir les liens avec eux.\n\nLes relations sino-vietnamiennes sont sur le point de se tendre, nous devons réagir immédiatement à la situation actuelle."
 CHI_INDO.11.a:0 "Traîtres à la cause anticommuniste !"
 CHI_INDO.11.b:0 "Cela ne vaut pas la peine de détériorer nos relations."

 CHI_INDO.12.t:0 "La Chine offre [ROOT.GetName] pour rejoindre la mission militaire en Indochine"
 CHI_INDO.12.d:0 "Le gouvernement de la République de Chine a proposé de nous aider avec un soutien et une assistance militaires, de la même manière qu'il avait aidé les Sud-Vietnamiens avec une assistance militaire dans le cadre de la nouvelle mission militaire en Indochine organisée par eux. Cela nous permettra de moderniser notre armée sous la direction chinoise et d'améliorer les liens entre nous et Nanjing, ce qui pourrait ouvrir d'autres opportunités à l'avenir qui profiteraient à notre pays."
 CHI_INDO.12.a:0 "Les Chinois sont les bienvenus pour aider !"
 CHI_INDO.12.b:0 "Il vaut mieux qu'ils restent en dehors de l'Indochine."

 CHI_INDO.13.t:0 "Saigon accepte notre proposition"
 CHI_INDO.13.d:0 "Après un examen sérieux par [VIE.GetLeader], le Sud-Vietnam accepterait la proposition de la République de Chine. Ce nouvel accord permettrait des avantages mutuels entre la République de Chine et le Sud-Vietnam, permettant à la Chine d'agir librement en Indochine tout en promouvant les activités économiques au Vietnam, en même temps le Sud-Vietnam accueillerait les exilés du VNQDD résidant en Chine, leur permettant de diminuer davantage le mouvement Viet Quoc, conduisant finalement à son effondrement. Un jour glorieux pour les peuples de Chine et du Sud-Vietnam !"
 CHI_INDO.13.a:0 "Que nos relations diplomatiques se développent davantage !"

 CHI_INDO.14.t:0 "Le débat sur la loi sur la nationalité"
 CHI_INDO.14.d:0 "Le débat sur la loi sur la nationalité remonte à l'époque des Qing, lorsque la loi sur la nationalité revendiquait la protection de la population chinoise d'outre-mer malgré le fait qu'elle détienne la citoyenneté d'un pays étranger, bien que les puissances coloniales prétendaient le contraire et définissaient la nationalité de leurs sujets par le statut de citoyenneté. Bien que le statu quo soit resté relativement pacifique, les puissances coloniales parvenant à régler les différends entre les autochtones et les Chinois, la décolonisation a mis fin à la médiation des puissances coloniales dans les différends des deux parties, ce qui a conduit à une instabilité fragile pour la population chinoise d'outre-mer, avec des incidents qui se sont terminés par des attaques et bien plus encore. Il semble que la seule façon de garantir la fin de la persécution chinoise serait de conclure un accord avec les pouvoirs locaux, sinon aucune des deux parties ne reconnaîtra les lois sur la nationalité de l'autre et pourrait encore s'aggraver."
 CHI_INDO.14.a:0 "Cela se poursuivra avec le jus sanguinis..."
 CHI_INDO.14.b:0 "Faire des concessions plus larges aux pouvoirs locaux..."

 CHI_INDO.15.t:0 "La République de Chine exige la fin des lois anti-chinoises"
 CHI_INDO.15.d:0 "Le sentiment anti-chinois existe en Thaïlande depuis un certain temps déjà, et Nanjing a récemment remarqué que ces lois anti-chinoises dépassaient les limites. Ils nous ont demandé d'adopter des protections juridiques pour la population chinoise thaïlandaise. Bien que considérée comme une ingérence dans les affaires intérieures d'un autre pays, la position croissante de la Chine dans le monde serait peut-être meilleure si nous cédions à ses exigences afin d'éviter un nouveau conflit."
 CHI_INDO.15.a:0 "Qui sont-ils pour nous dire les lois de notre pays ?"
 CHI_INDO.15.b:0 "Peut-être devrions-nous concéder cette fois-ci."

 CHI_INDO.16.t:0 "La Thaïlande refuse de mettre fin aux lois anti-chinoises"
 CHI_INDO.16.d:0 "Malgré notre demande, la Thaïlande a pourtant refusé de céder à nous, tout en aggravant la situation en nous dénonçant pour « ingérence » dans ses affaires intérieures. La réponse a provoqué choc et colère en Chine, et de nombreux hommes politiques d'origine nationaliste et patriotique ont suggéré de prendre position pour punir la Thaïlande pour avoir laissé croître le sentiment anti-chinois. Nous ne permettrons pas que nos compatriotes d'outre-mer soient enchaînés. "
 CHI_INDO.16.a:0 "Mettez fin à la mission militaire d'Indochine en Thaïlande !"
 CHI_INDO.16.b:0 "Il n'y a aucune raison d'aggraver davantage la situation."

 CHI_INDO.17.t:0 "La Thaïlande se soumet à la fin des lois anti-chinoises."
 CHI_INDO.17.d:0 "L'ambassadeur thaïlandais a envoyé à la Chine de bonnes nouvelles concernant la soumission de la Thaïlande à la demande chinoise. La fin des lois anti-chinoises amènerait les Chinois thaïlandais à être soumis à la protection juridique en vertu de leur constitution et à bénéficier de la même protection que les Thaïlandais eux-mêmes. Un grand jour inoubliable pour le peuple chinois qui vit dans les quatre mers !"
 CHI_INDO.17.a:0 "Sìhai Zhongguó Rén Wànsuì !"

 CHI_INDO.18.t:0 "La fin de la mission militaire en Indochine pour nous"
 CHI_INDO.18.d:0 "Les informations ont été informées que la République de Chine nous a exclus du programme de mission militaire en Indochine, qui visait tous les pays d'Indochine. De toute évidence, le refus de leurs demandes n'a pas été bien accueilli, et maintenant ils tentent d'envoyer un avertissement sévère au monde en leur disant que leurs demandes doivent être satisfaites ou qu'elles subiront des conséquences. Constatant la situation, de nombreux hommes politiques thaïlandais ont suggéré une répression plus sévère contre les Chinois thaïlandais en signe de rébellion face à la tentative chinoise de nous soumettre. Nous signerons immédiatement de nouvelles lois anti-chinoises."
 CHI_INDO.18.a:0 "Nous résisterons à la menace chinoise."

 CHI_INDO.19.t:0 "Nouvelle loi sur la nationalité pour la République de Chine"
 CHI_INDO.19.d:0 "En raison de l'inefficacité du jus sanguinis, une nouvelle loi sur la nationalité a été introduite pour régler la question. Une démarche a été entreprise auprès des pays d'Asie du Sud-Est pour introduire un traité de double nationalité avec ces pays afin de permettre aux migrants chinois de choisir de retourner sur le continent ou de continuer à résider dans la région. Cette approche permet au gouvernement chinois de freiner efficacement les sentiments sinophobes en Asie du Sud-Est et de renforcer la coopération avec les pays d'Asie du Sud-Est."
 CHI_INDO.19.a:0 "Une autre étape de progrès."
 CHI_INDO.19.b:0 "Très bien, cela sera accepté."

 CHI_INDO.20.t:0 "[ROOT.GetName] accepte notre traité de double nationalité"
 CHI_INDO.20.d:0 "[ROOT.GetName] a accepté de signer le traité pour qu'il entre en vigueur. Désormais, des milliers d'immigrés chinois ont le choix de se réinstaller sur le continent ou de continuer à vivre en Asie du Sud-Est. Si la population chinoise souhaite retourner en Chine, elle obtiendra le statut de citoyenneté à part entière et sera aidée à chercher un emploi à son arrivée."
 CHI_INDO.20.a:0 "Huanyíng huí dào zuguó !"

 KMT_qiaowuweiyuanhui.1.t:0 "Le Conseil des affaires de la communauté chinoise d'outre-mer"
 KMT_qiaowuweiyuanhui.1.d:0 "Le Conseil des affaires de la communauté chinoise d'outre-mer (Qiao Wu Weiyuanhuì) a été créé en 1926 dans la ville de Guangzhou, dans le but de travailler avec les communautés chinoises d'outre-mer et de répondre à leurs besoins même si elles ne vivent pas directement dans notre pays. Cependant, les communautés chinoises d'outre-mer continuent de vivre dans la peur d'être persécutées par certains de leurs gouvernements en raison d'une rhétorique antichinoise généralisée, provoquant un mécontentement massif non seulement auprès de la population chinoise vivant dans leur pays, mais aussi auprès de la race chinoise dans son ensemble. Nous devons veiller à ce que le peuple chinois reçoive justice."
 KMT_qiaowuweiyuanhui.1.a:0 "Leur persécution prendra bientôt fin."
 KMT_qiaowuweiyuanhui.1.b:0 "Nous ne sommes pas en mesure de les aider."

 KMT_qiaowuweiyuanhui.2.t:0 "Nouveaux bureaux du Conseil des affaires communautaires établis en Asie du Sud-Est"
 KMT_qiaowuweiyuanhui.2.d:0 "Pour tenter de consolider les liens avec nos hommes chinois d'Asie du Sud-Est, nous avons créé des bureaux sous l'égide du Conseil des affaires de la communauté chinoise d'outre-mer. Cela renforcera également notre influence dans les pays d'Asie du Sud-Est et servira d'avertissement sévère aux puissances locales quant au fait que nous serons là pour prendre soin et défendre les droits de nos compatriotes d'outre-mer."
 KMT_qiaowuweiyuanhui.2.a:0 "Compris."

 KMT_qiaowuweiyuanhui.3.t:0 "Coopération avec l'association chinoise Consolidated Benelovent"
 KMT_qiaowuweiyuanhui.3.d:0 "La Chinese Consolidated Benelovent Association (Zhonghua Huiguan) ou simplement l'Association chinoise si elle est directement traduite, est l'épine dorsale de la communauté chinoise d'outre-mer résidant en Amérique du Nord, en particulier aux États-Unis et au Canada. Cette association comprend principalement des colons chinois du 19e siècle, époque à laquelle ils ont été confrontés à des persécutions plus graves que les colons chinois du 20e siècle. L'Association a accepté de coopérer étroitement avec le Conseil des affaires de la communauté chinoise d'outre-mer, basé à Nanjing, pour coordonner les communautés chinoises en Amérique du Nord et en Chine continentale et résoudre leurs problèmes aux États-Unis ainsi qu'au Canada."
 KMT_qiaowuweiyuanhui.3.a:0 "Un moment charnière dans l'histoire."

 KMT_diplomatic_report.1.t:0 "Rapport diplomatique sur l'Inde"
 KMT_diplomatic_report.1.d:0 "La République de l'Inde, fondée récemment en 1947, juste après la fin de la guerre du Pacifique. Pendant la guerre du Pacifique, Chiang Kai-Shek et Soong Mei-Ling ont fait d'importantes tentatives pour soutenir l'indépendance de l'Inde, qui ont tous deux exprimé leur profond soutien à l'indépendance de l'Inde. Cependant, peu de temps après leur indépendance, ils ont commencé à travailler avec les Soviétiques tout en adoptant une position neutre dans le conflit de la Guerre froide. Il est clair que le monde évolue rapidement et que nous devons prendre la décision d'aller de l'avant."
 KMT_diplomatic_report.1.a:0 "Nous garderons nos liens étroits avec l'Inde !"
 KMT_diplomatic_report.1.b:0 "Peut-être devrions-nous nous tourner vers le Pakistan ?"
 KMT_diplomatic_report.1.c:0 "Il vaut mieux laisser la question sans réponse."

 KMT_diplomatic_report.2.t:0 "Rapport diplomatique sur l'état du Japon"
 KMT_diplomatic_report.2.d:0 "L'État du Japon, fondé lorsque le traité de San Francisco a été signé et a rendu le Japon indépendant, a posé à beaucoup la question suivante : quel sera l'avenir des relations sino-japonaises ? Jusqu'à présent, Chiang Kai-Shek a poursuivi une politique consistant à pardonner aux Japonais leurs horribles actes lors de la Seconde Guerre mondiale et a même collaboré avec des officiers japonais de haut rang pendant la guerre civile contre les communistes. Le Japon a infligé souffrance et terreur à notre peuple, mais cela devrait-il faire des Chinois et des Japonais des ennemis à jamais ?"
 KMT_diplomatic_report.2.a:0 "Ils méritent une seconde chance."
 KMT_diplomatic_report.2.b:0 "Ce serait trop risqué de se lier d'amitié avec le Japon."

 KMT_diplomatic_report.3.t:0 "Rapport diplomatique sur l'Asie du Sud-Est maritime"
 KMT_diplomatic_report.3.d:0 "L'Asie du Sud-Est maritime comprend les pays de la Malaisie, de l'Indonésie et des Philippines. Ces nations étaient autrefois les tributaires des anciennes dynasties chinoises qui régnaient sur la Chine et, en tant que telles, ont largement affirmé leur influence sur la région. Malgré cela, les puissances impérialistes ont réussi à effacer notre influence sur la région et en même temps à affaiblir la Chine, de sorte que même les puissances locales n'ont plus peur de notre autorité qui a cédé la place à la persécution des populations chinoises locales."
 KMT_diplomatic_report.3.a:0 "Nous devrions rechercher de meilleurs liens avec eux."
 KMT_diplomatic_report.3.b:0 "Dénoncez-les parce qu'ils persécutent notre peuple !"
 KMT_diplomatic_report.3.c:0 "Aucune de ces questions ne nous importe."

 CHI_BANDIT.0.d:0 "Le chaos de la guerre et de la guerre civile a laissé les campagnes et les villes isolées victimes des bandits. Beaucoup sont des unités militaires qui dissident ou des milices armées qui ravagent les campagnes. Ces bandits commettent des crimes indescriptibles sur les voyageurs et pillent les marchandises circulant sur les routes. Le gouvernement du KMT devra faire face à cette crise afin de relancer le commerce intérieur et de mieux unifier le pays. Pour de nombreux paysans, ce sont les chefs de guerre locaux qu'ils recherchent pour se protéger des bandits, et non le gouvernement. Si le problème des bandits n'est pas résolu, le soutien populaire et l'économie s'éroderont rapidement."

 CHI_VIN.0.d:0 "Dans le cadre de notre politique de soutien au Viet Quoc anticolonial, nos agents de renseignement ont commencé à assassiner discrètement des officiers du Viet Minh. Le Viet Minh communiste est un autre parti anticolonial vietnamien majeur et rivalise avec le Viet Quoc pour la légitimité et le recrutement. Le retrait de leurs officiers entravera leur capacité à recruter davantage de combattants ou à établir des bandes organisées de combattants. Le Viet Quoc devrait pouvoir mieux recruter et se présenter comme un véritable parti pour l'indépendance du Vietnam. Le Viet Minh ne semble pas être conscient de notre implication dans les meurtres."

 CHI_VIN.1.d:0 "Ces dernières semaines, plusieurs de nos officiers ont été assassinés, principalement dans nos bases situées le long de la frontière chinoise. Les enquêtes sont en cours mais les coupables probables semblent être soit les Français, soit les Chinois, soit les Viet Quoc. Les Français nous considèrent comme la principale menace mais ne sont pas aussi implantés dans la région. Les Chinois sont farouchement anticommunistes mais soutiennent la cause anticoloniale. Les Viet Quoc se prétendent nos camarades et souhaitent lutter ensemble contre les Français mais semblent incapables d'opérations aussi sophistiquées. Quoi qu'il en soit, le retrait de nos officiers affaiblit notre recrutement et notre efficacité au combat. Il faudra suivre la situation de près."

 KMT_Fuguo.1.d:0 ""

 KMT_Fuguo.2.d:0 ""

 KMT_LAND_REFORM.0.d:0 "L'un des plus grands problèmes auxquels la République de Chine est confrontée depuis ses débuts est celui de la réforme agraire. L'incapacité perçue à briser le pouvoir des propriétaires fonciers et à offrir des opportunités aux paysans a longtemps été imputée aux troubles paysans et à la popularité communiste. L'échec de la mise en place d'une réforme agraire radicale est également imputé au développement économique médiocre, la Chine n'atteignant toujours pas sa véritable capacité agricole. Cependant, les propriétaires fonciers offrent un soutien politique et financier au gouvernement et briser leur pouvoir risque de donner du pouvoir aux groupes qui s'opposent souvent au KMT. Le gouvernement doit décider soit de lancer une réforme agraire à grande échelle pour remédier au problème, soit de proposer un plan de réforme plus modeste afin d'apporter une aide aux paysans sans s'aliéner les puissantes classes de propriétaires fonciers."



 TIBET_KMT.100.d:0 "La République de Chine reconnaît que le Panchen Lama, considéré comme le deuxième spirituel derrière le Dalaï Lama, cherche de plus en plus à jouer un rôle politique plus important. Le Panchen Lama commanderait ses propres forces militaires loyales et rechercherait une aide extérieure. Le gouvernement chinois est prêt à offrir à ses forces des armes, une formation et des fonds à condition que, dans le cas où le Dalaï Lama refuserait d'accepter la souveraineté chinoise, il agisse. Cela place le Dalaï Lama dans une position difficile, car il est désormais clair qu'il risque un potentiel soulèvement ou coup d'État s'il ne suit pas les diktats de la Chine."

 TIBET_KMT.4.d:0 "La République de Chine nous a demandé d'accepter sa souveraineté sur nos terres. Les Chinois promettent de respecter notre gouvernement et notre administration actuels, mais souhaitent superviser notre politique étrangère et notre défense. Si nous n'acceptons pas cette demande, nous risquons de subir des tentatives, manifestes ou secrètes, de nous faire changer d'avis. Mais nous aurions une chance de conserver notre indépendance. Si nous acceptons, nous conserverons un certain degré d'autonomie et de liberté d'action, mais à terme, les Chinois pourraient chercher à occuper directement le Tibet."

 TIBET_KMT.20.d:0 "Le Dalaï Lama a reçu des informations selon lesquelles des routes principales et des passages stratégiques seraient bloqués par des hommes armés. Il semble que le Panchen Lama, juste derrière le Dalaï Lama lui-même en termes d'importance spirituelle, orchestre un coup d'État. Il s'agit d'une réaction directe à notre décision de ne pas accepter la souveraineté chinoise et nous soupçonnons que les Chinois exhortent le Panchen Lama à agir. Quant au Panchen Lama, il a exprimé le désir d'une plus grande autorité politique, et il semble que c'est ce que lui promettent les Chinois. Il a également organisé ses propres combattants et les utilise sans aucun doute dans cette tentative de coup d'État. Nos propres loyalistes à Lhassa s'organisent pour réagir, mais il n'est pas sûr que nous arrêterons le coup d'État."

 KMT_MIL.2.d:0 "Le Justice Investigation Bureau est la première agence de renseignement de la république. Il dépend directement du comité exécutif, mais la récente guerre avec le Japon et les communistes a révélé ses faiblesses. L'organisation semble parfois sujette à la corruption et aux pots-de-vin. Sur le terrain, les renseignements étaient également faibles car l'organisation avait du mal à recueillir des informations sur l'infiltration et les mouvements communistes. Un nouveau plan de réforme est en cours de mise en oeuvre pour moderniser la formation, améliorer l'organisation et augmenter les salaires pour remonter le moral. Plus important encore, l'influence des officiers militaires sera limitée afin d'améliorer la capacité du JIB à enquêter sur les questions militaires."

 KMT_MIL.3.d:0 "Les réformes et les enquêtes menées dans l'armée de la République de Chine révèlent qu'un certain nombre d'officiers de haut rang sont idéologiquement compromis ou enclins à la corruption. La direction exécutive doit décider comment procéder. Certains préconisent qu'une grande purge soit menée pour retirer ces officiers négligents de postes importants. Une telle action drastique peut aliéner les militaires et avoir un impact sur le moral à court terme, mais elle présente des avantages à long terme. L'autre solution possible serait d'envoyer ces officiers dans des postes difficiles ou isolés, notamment à la frontière. Ces officiers ne seraient plus en mesure d'influencer négativement la défense et ne seraient plus empêchés d'accéder à des grades plus élevés. Suivre cette voie réduirait l'impact institutionnel sur l'armée, mais les impacts positifs ne seraient pas aussi importants que ceux d'une purge massive."

 KMT_MIL.4.d:0 "La direction exécutive a décidé de déployer à la frontière les officiers identifiés comme idéologiquement compromis, corrompus ou militairement incompétents. Cela empêchera ces officiers d'occuper des postes de direction importants et les empêchera souvent de former des cliques militaires. Ces postes frontaliers ne possèdent pas beaucoup du confort ou de la gloire que l'on trouve dans d'autres affectations. Ces officiers verront désormais leurs voies d'accès à la promotion bloquées et beaucoup devraient éventuellement prendre leur retraite. Le transfert de ces officiers à la frontière nous aidera à lutter contre la corruption et l'inefficacité, ouvrant la voie à des officiers plus compétents et patriotes pour prendre le relais."

 KMT_MIL.5.d:0 "Le président [CHI.GetLeader] a ordonné aux autorités militaires, policières et de renseignement de commencer l'arrestation massive d'officiers identifiés comme étant idéologiquement compromis, politiquement corrompus ou pénalement incompétents pour leur poste. Cette arrestation massive d'officiers militaires ouvre de nombreux postes vacants et provoquera un malaise au sein de l'armée. Cependant, la voie est désormais ouverte pour que des officiers plus jeunes, patriotes et compétents accèdent à des postes plus élevés. Cette période d'arrestations et de purges provoquera sans aucun doute la panique et des défis organisationnels au sein de l'armée, mais une fois terminée, la défense de la République de Chine sera bien plus forte."

 KMT_MIL.6.d:0 "Les purges des officiers militaires par le gouvernement de la République de Chine semblent toucher à leur fin. Le dernier groupe d'officiers a été récemment arrêté, jugé et condamné. De nombreux analystes estiment qu'il faudra du temps à l'armée chinoise pour rétablir le moral et la stabilité au sein de ses rangs. Cependant, le gouvernement est convaincu qu'une fois que les officiers nouvellement promus auront acquis confiance et expérience, les capacités militaires de la république seront beaucoup plus fortes qu'auparavant. Il est également certain que les purges montreront aux jeunes officiers et à ceux qui rejoignent les académies militaires qu'ils doivent être professionnels et dévoués à la nation."

 KMT_MIL.7.t:0 "La République de Chine invite Alexander von Falkenhausen"
 KMT_MIL.7.d:0 "Le gouvernement national de la République de Chine nous a contacté et a envoyé à l'ancien attaché militaire Alexander von Falkenhausen une invitation à retourner en Chine, afin d'aider à la réorganisation de l'ancienne Armée nationale révolutionnaire. Falkenhausen a gagné en importance à la fin de la Seconde Guerre mondiale, ayant des contacts avec la conspiration du 20 juillet, ce qui lui a valu d'être arrêté par la Gestapo. Après la guerre, il sert comme témoin au procès de Nuremberg. Bien qu'il ait été condamné à 12 ans de travaux forcés, Falkenhausen a été libéré trois semaines seulement après sa condamnation et a déménagé à la frontière intérieure de l'Allemagne, près du manoir de son vieil ami Franz von Papen.\n\nEnvoyer Falkenhausen en Chine rétablirait et approfondirait nos relations avec le Kuomintang et les aiderait dans leur inévitable reconquête du nord de la Chine."
 KMT_MIL.7.a:0 "Gute Reise, Alexandre."

 KMT_MIL.Falkenhausen_Back.t:0 "Falkenhausen retourne en Chine"
 KMT_MIL.Falkenhausen_Back.d:0 "Le gouvernement fédéral allemand a autorisé le retour de Falkenhausen en Chine et a accepté sa nomination comme conseiller principal de Chiang. Alexandre aidera notre gouvernement en termes de réformes militaires. Alors qu'il préparait son voyage en Chine, il a découvert les anciens documents du plan des 60 divisions de Hans von Seeckt, utilisé par la NRA il y a plusieurs décennies."
 KMT_MIL.Falkenhausen_Back.a:0 "Willkommen zurück."

 KMT_MIL.8.d:0 "La brigade d'entraînement est une partie importante du plan de la Soixante Division. En tant qu'unité de démonstration, elle deviendra un modèle pour la nouvelle armée chinoise moderne. Grâce à une conception et une exécution minutieuses, la brigade de formation démontrera les capacités tactiques, stratégiques et de leadership les plus avancées, devenant ainsi le berceau de la culture et du développement de talents militaires exceptionnels. À mesure que ce nouveau modèle sera adopté par davantage de nouvelles unités, il contribuera à améliorer l'efficacité au combat et l'efficacité au combat de l'ensemble de l'armée chinoise, lui permettant de rester compétitive dans les conflits militaires modernes et d'apporter des contributions positives à la sécurité et au développement du pays."

 KMT_MIL.9.d:0 "En tant que modèle et sujet expérimental de réforme militaire, la brigade de formation a finalement créé la structure militaire la plus adaptée à la Chine. Maintenant, nous pouvons l'utiliser comme modèle pour commencer la formation de la Division Soixante. La mise en place de cette structure militaire est le résultat d'essais répétés et d'ajustements de la pratique. Grâce aux efforts de la brigade de formation, nous avons trouvé la structure organisationnelle et le mode de combat les plus efficaces, qui apporteront une plus grande efficacité au combat et une plus grande efficience au combat à notre armée."

 KMT_MIL.10.d:0 "Alors que le plan des Soixante Divisions touche à sa fin, les soixante divisions d'élite qui, avec la brigade d'entraînement comme modèle et l'adoption d'une nouvelle structure militaire, constitueraient l'épine dorsale de l'armée chinoise modernisée et de la confiance dans la défaite du Parti communiste en Mandchourie à l'avenir. Le plan des soixante divisions marque également une étape importante dans la transformation de l'armée chinoise. Il s'agit d'une grande réussite dans la modernisation de notre armée et apporte de nouvelles améliorations à nos capacités de défense nationale. Cette transformation n'est pas seulement une mise à jour technique et structurelle, mais aussi une redéfinition de l'efficacité au combat et du positionnement stratégique de notre armée, ouvrant un nouveau chapitre pour la sécurité et le développement de notre pays."

 KMT_MIL.11.d:0 "Dans notre quête de réforme et de correction des déficiences de la structure des forces armées américaines, l'approche la plus logique consiste à faire appel à l'expertise de ceux qui connaissent intimement les subtilités du système - les conseillers militaires de l'armée américaine. Heureusement, en tirant parti de l'influence du lobby chinois et de nos relations avec des généraux pro-ROC tels que Wedemeyer, nous avons réussi à obtenir l'assistance d'un groupe de conseillers militaires américains pour nous aider dans nos efforts de réforme militaire. Cette collaboration représente une opportunité importante pour nous de bénéficier des connaissances et de l'expérience de professionnels chevronnés, accélérant ainsi nos progrès vers la réalisation d'une structure militaire plus robuste et plus efficace."

 KMT_MIL.12.d:0 "De toute évidence, la Chine reste une nation aux prises avec des défis de développement, et cette réalité s'étend même au domaine de la logistique militaire. La complexité et la sophistication de la structure des forces armées américaines reposent dans une large mesure sur des chaînes d'approvisionnement robustes et des infrastructures bien établies, éléments qui font actuellement défaut dans notre cadre militaire. Remédier aux lacunes de la structure des forces armées américaines nécessite une refonte fondamentale de nos systèmes logistiques. Ce n'est que lorsque nous parviendrons à un approvisionnement suffisant que nous pourrons nous attendre à ce que la structure des forces armées américaines fonctionne de manière optimale et soutienne efficacement nos opérations militaires. Ainsi, l'amélioration de notre système logistique constitue la première étape cruciale vers l'alignement sur les normes et les exigences de la structure des forces armées américaines."

 KMT_MIL.13.d:0 "À mesure que le temps passe, il devient de plus en plus évident que les approches traditionnelles ne suffisent plus à répondre aux besoins changeants de nos militaires. C'est pourquoi nous élaborons avec diligence de nouvelles méthodologies adaptées pour répondre aux demandes actuelles et maintenir l'efficacité de la structure de notre armée. Cette initiative proactive souligne notre engagement envers l'adaptabilité et l'amélioration continue pour assurer le fonctionnement optimal de nos forces armées dans des circonstances changeantes."

 KMT_MIL.14.d:0 "Alors que le plan des quatre-vingt-dix divisions se termine, les quatre-vingt-dix divisions envisagées, chacune adaptée à des rôles spécifiques et soutenues par un réseau logistique remanié, sont sur le point de devenir la pierre angulaire de l'armée modernisée de la Chine. Leur importance stratégique s'étend à la lutte contre l'influence communiste en Mandchourie et au-delà. Ce plan représente un moment charnière dans le processus de modernisation de l'armée chinoise, comblant les principales lacunes héritées de l'adoption de la structure militaire américaine. Cela représente une étape de transformation vers le renforcement de nos capacités militaires et l'adaptation aux exigences de la guerre contemporaine."

 KMT_MIL.15.t:0 "Souvenirs de l'Académie militaire de Whampoa"
 KMT_MIL.15.d:0 "En 1925, le Dr Sun Yat-Sen créa l'Académie militaire de Whampoa, qui formerait une nouvelle génération d'officiers qui consacreraient leur vie à la Révolution nationale pour les décennies à venir. La majorité des officiers et généraux de nos forces armées sont diplômés de l'Académie militaire de Whampoa et jouissent ainsi d'une influence réputée en Chine. L'Académie a été déplacée de Whampoa (à Guangzhou) à Nanjing après l'expédition du Nord et a été rebaptisée Académie militaire centrale. Une fois la période des guerres terminée pour nous, nous ferons revivre l'esprit de Whampoa sous la direction de [CHI.GetLeader], en avant avec l'esprit de Whampoa !"
 KMT_MIL.15.a:0 "Camaraderie que nous gardons pour toujours."

 KMT_MIL.16.t:0 "Promouvoir le soleil général"
 KMT_MIL.16.d:0 "Général intrépide qui a réussi à changer le destin de la République, il a suffisamment prouvé sa loyauté en continuant à lutter et à nous aider malgré que nous lui ayons tourné le dos plus tôt. Le lendemain, il sera chargé de superviser les réformes militaires des forces armées de la République de Chine, avec l'aide du MAAG (Military Assistance Advisory Group) américain dans leur mise en oeuvre."
 KMT_MIL.16.a:0 "Il continuera à nous aider."

 FRA_KMT.1.d:0 "La République de Chine a contacté en privé notre gouvernement pour lui demander de coopérer dans le domaine de la technologie nucléaire, y compris l'armement. Les Chinois affirment qu'ils ont accès aux matières nucléaires et qu'ils construisent une vaste infrastructure. Ils ont cependant besoin de l'expertise et de l'expérience françaises dans le domaine nucléaire. La Chine se trouve dans une région vitale et fait face à des menaces majeures de la part de ses voisins communistes. Si nous soutenons la Chine, nous pourrions renforcer l'anticommunisme dans la région et affirmer notre influence en Chine. Une telle relation pourrait contribuer à protéger nos propres intérêts dans la région. Cependant, soutenir les Chinois pourrait aliéner les Soviétiques et les Américains. Un autre problème est que certains conseillers se demandent si les bénéfices valent ce que les Chinois attendraient de nous."

 FRA_KMT.2.d:0 "Le gouvernement français a indiqué qu'il nous aiderait dans nos efforts de développement de notre programme nucléaire. Ce sera une aubaine majeure pour nos efforts visant à acquérir une dissuasion nucléaire. Plus important encore, nous ne serons pas redevables aux États-Unis et nos relations avec la France seront bien plus coopératives. Nous pouvons offrir à la France l'accès aux matières nucléaires pour ses propres programmes. Nos hauts responsables nucléaires prévoient de se rendre à Paris pour rendre visite à leurs homologues dans les prochains jours."

 FRA_KMT.3.d:0 "Le gouvernement français a rejeté notre proposition de coopération nucléaire. Ils ne voient apparemment pas les avantages d'une entreprise commune et d'un alignement des intérêts entre nos États. Nous ne savons pas si la décision française est due à des craintes de répercussions étrangères ou à des menaces directes émanant d'autres puissances. Quoi qu'il en soit, c'est leur perte et le peuple chinois poursuivra son chemin vers la dissuasion nucléaire. Le gouvernement redoublera d'efforts pour soutenir les scientifiques et les installations dédiées au progrès de la technologie nucléaire chinoise."

 KMT_Sinification.0.d:0 "La République de Chine a lancé une intensification de sa campagne de sinification. Le gouvernement cherche depuis longtemps à forger l'unité nationale en diffusant la culture et la langue chinoises dans toutes les communautés. En privé, un responsable a déclaré que tout le monde devait devenir chinois ou quitter le pays et que le temps des barbares était révolu. La campagne se heurte à une résistance, en particulier dans les provinces frontalières de la Chine, qui ne sont souvent pas ethniquement chinoises ou ne suivent pas leurs propres traditions culturelles ou religieuses. Le gouvernement ne semble pas trop préoccupé par les réactions négatives non chinoises."

 KMT_VICTORY_TERROR.0.d:0 "Le gouvernement de la République de Chine a récemment lancé une campagne visant à éliminer la dissidence et les menaces contre l'État. La police et d'autres agences d'État ont déjà ouvert des enquêtes sur des hommes politiques, des écrivains, des militants et des intellectuels accusés de sympathiser avec les ennemis de l'État ou de les soutenir ouvertement. En particulier, l'accent semble être mis sur les sympathisants communistes et les éléments criminels. De nombreux militants des droits humains craignent que cette nouvelle répression de la dissidence ne constitue une « terreur blanche » et soit utilisée pour écraser toute menace contre le parti au pouvoir au détriment des droits individuels ou politiques."

 KMT_CULTS.0.d:0 "La République de Chine a décidé de légitimer les cultes secrets qui fleurissent dans la Chine rurale. Ces mouvements quasi religieux et culturels existent depuis des siècles. Bon nombre des soulèvements les plus puissants de l'histoire chinoise ont eu lieu à cause de ces sectes. Au cours des dernières décennies, des forces d'autodéfense locales se sont formées à partir de ces groupes à l'ère des seigneurs de la guerre et de la guerre civile. Le gouvernement chinois estime qu'en légitimant ces groupes, il apportera ces forces d'autodéfense et la stabilité fournie par ces groupes en soutien à l'État. On craint cependant que ces groupes n'utilisent cette légitimation pour étendre leur influence sous la protection de l'État."

 KMT_CULTS.1.d:0 "La République de Chine a décidé de réprimer et de démanteler les sectes et les sociétés secrètes qui fleurissent dans la Chine rurale. Bien que ces groupes existent depuis des siècles, ils ont commencé au cours des dernières décennies à former des forces d'autodéfense locales dans le contexte d'anarchie générale de l'époque des seigneurs de la guerre et de la guerre civile. En ciblant ces groupes, le gouvernement chinois risquera une crise de l'ordre public jusqu'à ce qu'il puisse établir une présence dans ces zones. D'autres craignent que ces sectes ne se transforment en brigands et ne nuisent davantage à l'ordre public. Quoi qu'il en soit, cette décision indique un engagement fort de l'État chinois à affirmer son contrôle sur le pays."

 KMT_SHOW_TRIALS.1.d:0 "Une série de procès publics de masse ont lieu dans toute la République de Chine. Les collaborateurs japonais de la Seconde Guerre sino-japonaise et les militants communistes accusés de crimes commis pendant la guerre civile sont traduits en audience publique. Le gouvernement fait connaître ces procès à travers le pays et les premières indications indiquent que les tribunaux condamneront tous les accusés. Le gouvernement est désireux de démontrer la force de la République de Chine et de rendre justice au peuple chinois. Les opposants au gouvernement et les observateurs internationaux condamnent ces procès comme étant purement un spectacle et un théâtre politique."

 KMT_LAND_REFORM.1.d:0 "Dans une décision surprise, la République de Chine a adopté une nouvelle loi globale sur la réforme agraire, destinée à réduire le pouvoir écrasant des propriétaires fonciers et à offrir des opportunités aux paysans. Pendant des décennies, le KMT au pouvoir a établi des liens étroits avec les propriétaires ruraux et, pendant des années, son échec à soutenir la réforme agraire s'est avéré avantageux pour les communistes. Le gouvernement espère que son engagement en faveur de la réforme agraire attirera l'affection des paysans auprès de l'État et privera les communistes d'un vivier fertile de recrues pour leurs opérations insurrectionnelles."

 KMT_LAND_REFORM.2.d:0 "La République de Chine a adopté une nouvelle loi sur la réforme agraire, qui, selon le gouvernement, marque une victoire spectaculaire pour les paysans chinois. Cependant, malgré leurs affirmations selon lesquelles une réforme majeure serait réalisée, de nombreux observateurs locaux et internationaux affirment que les réformes sont minimes. Les propriétaires fonciers conservent de nombreuses lacunes et les paysans ne verront pas de changements spectaculaires dans leur situation. Il semble que le gouvernement ne soit pas disposé à perdre le soutien traditionnel des propriétaires qui apportent un soutien économique et politique à l'État."

 CHI_MARTIAL_LAW.0.d:0 "La République de Chine a annoncé qu'elle lèverait la loi martiale du pays. Cela fait partie d'un effort de réforme majeur au sein du parti au pouvoir, le KMT. Les réformateurs croient fermement que le rétablissement des droits constitutionnels et démocratiques affaiblira la dissidence et le soutien populaire aux dirigeants régionaux ou aux infiltrés communistes. Des réformes similaires devraient se poursuivre, malgré les critiques de certains membres de la vieille garde du parti selon lesquelles de telles réformes et la démocratisation pourraient conduire à une perte de contrôle et à des dissensions. La décision de lever la loi martiale est largement saluée dans tout le pays."

 CHI_MARTIAL_LAW.1.d:0 "Le gouvernement national de la République de Chine a officiellement prolongé les « dispositions temporaires en vigueur pendant la période de mobilisation nationale », plaçant la République de Chine sur le pied de guerre pour une durée indéterminée.\n\nDans une démarche décisive pour consolider le pouvoir, le président Chiang Kai-shek a fait valoir que la présence continue du Parti communiste chinois en Mandchourie constitue une menace existentielle que la Constitution actuelle est mal équipée pour gérer. Invoquant la nécessité « d'unité et de détermination », les nouvelles dispositions accordent au pouvoir exécutif de vastes pouvoirs d'urgence, contournant ainsi le Yuan législatif sur les questions de sécurité nationale.\n\nLe décret suspend la durée standard du mandat du président et autorise la restriction des libertés civiles, y compris les droits de réunion et la liberté d'expression, pendant toute la durée de la crise. Alors que les dirigeants du Kuomintang insistent sur le fait que ces mesures constituent une nécessité temporaire pour « éradiquer l'insurrection soutenue par les Soviétiques » dans le nord, des personnalités de l'opposition préviennent que cela marque une transition d'une gouvernance constitutionnelle à une administration militaire centralisée."

 TIBET_KMT.3.d:0 "Le Yuan exécutif de la République de Chine a publié aujourd'hui une déclaration sévère dénonçant formellement le Dalaï Lama pour violations ouvertes de la souveraineté chinoise. Des rapports officiels indiquent que les autorités de Lhassa ont tenté illégalement de céder des territoires et de mener des relations extérieures non autorisées, en violation directe de la constitution.\n\nUn porte-parole du gouvernement a déclaré que même si la République reste attachée au respect des traditions régionales, ces provocations doivent cesser immédiatement. L'administration a rappelé à Lhassa que l'autonomie locale est un privilège accordé par l'État et non une autorisation de sécession."

 TIBET_KMT.10.d:0 "À la surprise de nombreux observateurs, la République de Chine a signé un accord avec le Tibet reconnaissant son indépendance. Le gouvernement chinois a déclaré sa conviction que le territoire avait été conquis par un empire Qing oppressif et que le nouvel État chinois démocratique ne pouvait pas conserver un territoire saisi pour la vanité d'un empereur. Le gouvernement tibétain, dirigé par le Dalaï Lama, a félicité le président [CHI.GetLeader] pour son leadership compétent et a promis une nouvelle ère de paix entre les deux États. De nombreux observateurs pensent que la Chine cherche à établir des liens amicaux avec le Tibet et à le conserver comme État tampon avec l'Asie du Sud."

 TIBET_KMT.5.d:0 "Le leader du Tibet, le Dalaï Lama, a refusé un ultimatum de la République de Chine visant à reconnaître le gouvernement chinois comme souverain du pays. Les Chinois accusent le Dalaï Lama de céder des territoires et de mener ses affaires en tant que chef d'État et non en tant que subordonné de la République de Chine. Les Chinois affirment qu'ils sont prêts à accorder une large autonomie au Dalaï Lama et au Tibet, mais en échange, le Dalaï Lama doit cesser de se conduire comme un chef d'État indépendant. Le refus du gouvernement tibétain indique clairement que le Dalaï Lama revendique une indépendance totale vis-à-vis de la Chine."

 TIBET_KMT.6.d:0 "Le Dalaï Lama a annoncé que le Tibet est une partie souveraine de la République de Chine et qu'il n'est pas un chef d'État. Cela marque une acceptation par le Dalaï Lama des exigences chinoises selon lesquelles il acceptera la souveraineté de la république et cessera toute tentative de négocier des traités ou de céder des territoires sous sa propre autorité. Le Dalaï Lama a probablement accepté après avoir reçu l'assurance que les Chinois accorderaient une immense autonomie au Tibet et laisseraient le gouvernement actuel administrer le territoire pour le compte de la Chine. Certains observateurs estiment que les craintes d'une intervention militaire ou d'un soulèvement parrainé par la Chine ont également poussé le Tibet à accepter les exigences chinoises."

 TIBET_KMT.21.d:0 "Le Dali Lama a été renversé lors d'un récent coup d'État organisé par le Panchen Lama. Le Panchen Lama, le numéro deux spirituel du Dalaï Lama, nourrit depuis des années le désir d'une influence politique accrue. Il semble que les troupes armées qui lui sont fidèles ont réussi à sécuriser les passages et les villes clés, y compris les entrées de Lhassa. Le seul recours étant une guerre civile, le Dalaï Lama a décidé d'ordonner à ses loyalistes de se retirer. Le nouveau gouvernement tibétain a annoncé qu'il accepterait la souveraineté chinoise à condition que le Tibet conserve son autonomie. De nombreux observateurs internationaux estiment que le Panchen Lama bénéficiait du soutien et même des armes de la République de Chine."

 TIBET_KMT.22.d:0 "Une tentative de coup d'État visant à éliminer le Dali Lama au Tibet s'est soldée par un échec. Les combattants fidèles au Panchen Lama, spirituellement second du Dalaï Lama, cherchèrent à prendre le contrôle des villes, des cols et des entrées stratégiques de Lhassa afin de forcer la capitulation rapide du Dalaï Lama. Cependant, les loyalistes du Dalaï Lama ont contrecarré les efforts visant à capturer les zones autour de Lhassa et le Panchen Lama a rapidement vu ses loyalistes fondre lorsque des groupes de combattants pro-Dalaï Lama sont venus les défier. Dans une déclaration, le Dalaï Lama a affirmé avoir stoppé une tentative pro-chinoise de prendre le pouvoir et s'est engagé à ne pas faire de compromis sur l'indépendance de son pays. La République de Chine a nié toute implication, même si certaines photographies ont été publiées montrant les combattants du Panchen Lama avec des fusils chinois."

 TIBET_KMT.11.d:0 "Un nouvel accord a été conclu entre la République de Chine et l'Inde. Bon nombre des différends précédents ont été résolus après que la République de Chine a reconnu l'indépendance du Tibet. Auparavant, la Chine revendiquait la souveraineté sur le Tibet et se considérait comme souveraine pour décider de la frontière entre l'Inde et le Tibet. Le Tibet étant reconnu comme indépendant, la frontière chinoise avec l'Inde est beaucoup plus petite et moins controversée. Après de brèves négociations, les deux parties ont pu signer un accord pour régler officiellement leur frontière. Les gouvernements chinois et indien ont exprimé l'espoir que le nouveau règlement susciterait une amitié renouvelée entre les plus grandes démocraties d'Asie."

 CHI_SEATO.1.d:0 "La République de Chine a accepté de rejoindre l'Organisation du Traité du Sud-Est (OTASE) afin d'élargir sa coopération entre les États membres et de lutter contre l'influence communiste dans la région. Pour le gouvernement chinois, rejoindre le groupe élargira son rôle régional et lui permettra d'accéder à des alliés locaux alors qu'il cherche à coordonner les activités anticommunistes en Asie. Le gouvernement chinois a exprimé son enthousiasme à l'idée de participer au prochain sommet de l'OTASE. Les États-Unis sont particulièrement heureux de l'adhésion de la Chine, car cela confère à l'organisation une plus grande légitimité. L'Union soviétique et les régimes communistes régionaux condamnent cette action et accusent l'OTASE d'être un front impérialiste. Les membres de l'opposition ont fait part en privé aux médias de leurs inquiétudes quant au fait que l'OTASE pourrait offrir peu d'avantages matériels et faire de la Chine une cible plus large pour le communisme international."

 TIBET_KMT.15.d:0 "Le Dalaï Lama, le leader du Tibet, a appelé la communauté internationale à défendre le pays suite aux informations selon lesquelles la République de Chine aurait lancé une invasion. Les troupes chinoises afflueraient au Tibet dans le but d'établir le contrôle chinois. Le gouvernement chinois prétend qu'il ne lance pas une invasion mais mène plutôt une action locale pour rétablir le contrôle d'une province. Les Chinois soutiennent que le Dalaï Lama est un administrateur autonome, mais ses récentes affirmations d'indépendance et ses efforts pour négocier un territoire constituent des violations flagrantes et il doit être réprimandé. Les Chinois insistent sur le fait que tous les efforts visant à parvenir à une résolution pacifique ont été rejetés par le Dalaï Lama et qu'ils espèrent rétablir rapidement la loi et l'ordre pour le peuple du Tibet."

 TIBET_KMT.16.d:0 "Suite à la récente invasion du Tibet par la République de Chine, l'aristocratie tibétaine traditionnelle se retrouve confrontée à des arrestations ou à des accusations. Cette aristocratie a longtemps été une source majeure de légitimité, d'adhésion et de pouvoir pour le Dalaï Lama et son gouvernement. La décision chinoise de cibler ce groupe et de l'affaiblir économiquement et militairement revient à briser la base de soutien à l'ancien gouvernement. Si le Dalaï Lama et ses alliés perdent leurs bases de soutien local, cela renforcera les efforts du gouvernement chinois pour établir un État tibétain plus docile. Plus important encore, les responsables chinois amenés au Tibet seront également protégés de la concurrence locale. Un certain nombre d'aristocrates tibétains fuiraient vers le Népal, l'Inde et la Birmanie."

 TIBET_KMT.105.d:0 "Suite à une série de troubles politiques au Tibet, le Tibet a signé un accord avec la République de Chine. Le Tibet fera partie de la Chine et sera connu sous le nom de région autonome du Tibet. Le gouvernement chinois a promis de soutenir le Panchen Lama, notamment en lui accordant un pouvoir politique étendu, en échange de la soumission de son gouvernement à la souveraineté chinoise. Les gouvernements tibétain et chinois insistent sur le fait que l'administration et la gouvernance du Tibet resteront en grande partie les mêmes, mais que le Tibet ne sera plus en mesure de mener une politique étrangère ni d'exercer un contrôle total sur ses forces militaires."

 CC_CLIQUE_FALL.0.d:0 "Dans le cadre des récentes réformes politiques et de la démocratisation en République de Chine, le Président [CHI.GetLeader] a signé une nouvelle loi cédant un certain nombre de pouvoirs au Yuan législatif. Le Yuan législatif, autrefois organe d'approbation du KMT au pouvoir, a commencé à organiser beaucoup plus de débats et à adopter des lois sans instruction du conseil exécutif. Les observateurs estiment que les nouvelles réformes transforment le Yuan législatif en une institution politique plus puissante et un frein au pouvoir exécutif de la République de Chine."

 CC_CLIQUE_FALL.1.d:0 "La faction CC Clique au sein du KMT a connu une baisse importante de son influence et de son pouvoir au sein de la République de Chine. Beaucoup de ses dirigeants éminents font face à des accusations de corruption ou sont démis de leurs postes clés. Les reportages des médias mettent en lumière certains des échecs militaires et politiques des dirigeants de la Clique du CC au cours des dernières décennies. La Clique du CC représente l'aile droite du KMT et s'est forgé une réputation d'anticommuniste et d'anti-japonais virulents. Cependant, les nouvelles réformes de démocratisation ont ouvert des positions à d'autres groupes et de nombreux réformateurs considèrent la clique du CC comme la vieille garde qui doit être remplacée si la Chine veut prospérer. Les réformateurs espèrent que l'affaiblissement de la clique du CC permettra une transition en douceur vers la démocratie. Les dirigeants de la Clique CC préviennent que des réformes rapides conduiront à l'instabilité et à une mauvaise gouvernance."

 KMT_Atoms.1.d:0 "La République de Chine a annoncé son acceptation et son soutien total au programme Atome pour la paix lancé par les États-Unis. Atoms for Peace est un programme qui encourage les nations à se renseigner sur les risques et les avantages de la technologie nucléaire. Le programme fournit un soutien en matière d'éducation et d'assistance technique pour le développement de réacteurs nucléaires. Le gouvernement chinois estime que le programme l'aidera à former des scientifiques nucléaires et à développer sa propre technologie nucléaire afin de mieux répondre à ses besoins énergétiques alors qu'il envisage un avenir meilleur. Les partis communistes régionaux critiquent le programme comme un moyen secret permettant à la Chine d'acquérir les moyens de produire des armes nucléaires et accusent les États-Unis de soutenir la nucléarisation de l'Asie de l'Est."

 KMT_Atoms.2.d:0 "Dans le cadre d'un projet lancé par la République de Chine et tenu secret du public depuis des années, il a été officiellement rendu public lorsque le premier essai nucléaire chinois a été un succès sous le nom de code \"Projet Blue Sky White Sun\". La population chinoise vivant en Chine et à l'étranger a encouragé l'acquisition d'armes nucléaires par la République chinoise, fière que son pays puisse être considéré comme l'égal des puissances occidentales et que les jours des siècles d'humiliation soient définitivement révolus. Dans le même temps, cela a été condamné par de nombreux journalistes occidentaux qui ont déclaré que le gouvernement américain, qui a travaillé avec la République de Chine pour acquérir des armes nucléaires, n'a fait qu'alimenter la soif des Chinois de remettre en question l'ordre mondial actuel dirigé par les États-Unis et l'Union soviétique, formant potentiellement leur propre ordre mondial pour défier les Américains et les Soviétiques. Néanmoins, le nationalisme chinois est partout à son apogée, la population chinoise célébrant les merveilleuses réalisations de sa nation."

 KMT_Atoms.3.d:0 "Des nouvelles du désert de Gobi d'Alasha nous sont parvenues selon lesquelles notre projet nucléaire sous le nom de Projet Blue Sky White Sun a réussi. Jusqu'à présent, seuls les États-Unis et la République de Chine disposent d'informations sur ce récent essai de détonation nucléaire réussi. Cependant, certains responsables ont déclaré que cette nouvelle devrait être révélée au public et sur la scène internationale, afin d'acquérir une influence régionale et de montrer l'audace et la force de notre nation. Cela pourrait toutefois se retourner contre nous et provoquer des condamnations de notre programme nucléaire."

 ROC_VICTORY.1.d:0 "L'Union soviétique et son alliée la Mongolie sont récemment intervenues dans la guerre civile chinoise pour empêcher l'effondrement total de la République populaire de Chine (RPC), alors qu'elle luttait pour contenir les forces armées de la République de Chine. Après d'intenses combats, un cessez-le-feu a été conclu, la Mongolie intérieure rétablissant une autre république et la RPC installant son gouvernement à Pékin, dans ses environs et en Mandchourie. A l'ouest, le Sinkiang a rejoint le Turkestan oriental. Le reste de la Chine, y compris la majeure partie de sa base industrielle et de sa population ethnique Han, est sous le contrôle de la République de Chine. Le cessez-le-feu précaire tient actuellement, mais les deux parties devraient reconstruire leurs arsenaux et planifier une résolution future du conflit en leur faveur."

 ROC_CLIQUE.15.d:0 "Les efforts visant à rétablir la stabilité et l'harmonie internes en République de Chine semblent échouer, plusieurs cliques militaires se soulevant contre le gouvernement. Ces cliques militaires rappellent ce que l'on a vu pendant la période des seigneurs de guerre, où les chefs militaires formaient des forces loyales dirigées par des officiers partageant des antécédents professionnels, culturels ou territoriaux similaires. Beaucoup en Chine affirment qu'une deuxième période de seigneurs de guerre a commencé et s'inquiètent d'une éventuelle guerre civile, d'une instabilité politique ou d'un effondrement de l'ordre public. Le gouvernement chinois affirme que la situation sera traitée rapidement et que la Chine ne sera la victime d'aucun chef de guerre."

 ROC_CLIQUE.16.d:0 "Jiao Yulu, ancien communiste, est revenu à ses racines de chef de secte en se proclamant héritier de l'empire Ming. Sa revendication est soutenue par la populaire Red Spear Society et d'autres cultes dédiés à la restauration de la dynastie Ming. Le retour des seigneurs de guerre et la montée de la méfiance du public ont entraîné un regain de popularité auprès des groupes qui organisent des forces d'autodéfense locales pour combattre les seigneurs de guerre, les bandits et ceux considérés comme des fonctionnaires corrompus. Le prétendant Ming veut renverser la République de Chine pour restaurer la domination impériale, affirmant que la république n'a pas le mandat du ciel et que la Chine a besoin d'une nouvelle dynastie. Le gouvernement chinois devra restaurer la confiance du public et réagir rapidement avant que ce mouvement monarchiste ne devienne trop puissant."

 ROC_CLIQUE.1.d:0 "Des informations récentes suggèrent que la clique du Hunan s'est soulevée contre la République de Chine. Ces officiers militaires, citant les actions oppressives du gouvernement et ses interventions dans les affaires locales, souhaitent une plus grande autonomie et une réduction du pouvoir centralisé. Le gouvernement chinois a condamné avec colère le soulèvement, ordonnant à tous les officiers loyaux du Hunan de rester fidèles à la république, même s'il semble que leur appel soit largement ignoré. Les officiers du Hunan sont connus pour avoir noué des liens avec les communistes dans les années 1920 et 1930. Le gouvernement chinois craint que la clique du Hunan n'utilise ces contacts et n'invite les communistes à une aide militaire, mais finisse par livrer la région à l'ennemi."

 ROC_CLIQUE.2.d:0 "La Clique Ma du Ningxia s'est soulevée contre la république. Ces officiers militaires, occidentaux et majoritairement musulmans, citent les actions oppressives du gouvernement et ses interventions dans les affaires des citoyens. Ils veulent plus d'autonomie et un pouvoir centralisé réduit. Le gouvernement chinois a condamné avec colère le soulèvement, ordonnant à tous les officiers fidèles du Ningxia de rester fidèles à la république, même s'il semble que leur appel soit largement ignoré. Le gouvernement chinois devra agir rapidement, car tout soulèvement en Occident comporte toujours le risque de déclencher un soulèvement islamique plus large ou d'offrir une opportunité à des voisins hostiles d'étendre leur influence dans l'une des zones frontalières de la Chine."

 ROC_CLIQUE.3.d:0 "La nouvelle clique du Guangxi s'est soulevée contre la république. L'une des cliques les plus puissantes des années 1920 et 1930, son soulèvement est considéré avec une grande inquiétude par le gouvernement chinois. La Clique se soulève grâce aux efforts centralisateurs et aux réformes ciblant les cliques et la vieille garde de la république. Le gouvernement chinois accuse les officiers rebelles d'agir par intérêt personnel et appelle tous les officiers loyaux à rester fidèles à la république. Le gouvernement chinois cherchera à agir rapidement car le Guangxi constitue une population et une base économique majeures pour la Chine."

 ROC_CLIQUE.4.d:0 "La clique Qinghai Ma de l'ouest de la Chine s'est soulevée contre la république. Ses dirigeants citent la centralisation excessive et l'oppression des droits culturels ainsi que de l'autonomie comme la principale cause de leurs troubles. Le gouvernement chinois a appelé tous les officiers à rester loyaux et a condamné la clique pour chercher à arrêter le développement de la Chine. Le gouvernement chinois cherchera à agir rapidement étant donné que le Qinghai est proche de frontières controversées et que l'on craint déjà que les officiers rebelles ne cherchent à s'allier avec un ennemi étranger ou intérieur de la république."

 ROC_CLIQUE.5.d:0 "La clique du Shanxi s'est soulevée contre la république. Ses dirigeants citent une centralisation excessive et des réformes visant à briser l'organisation militaire actuelle comme principales raisons du soulèvement. Le gouvernement chinois accuse la clique de seigneurs de la guerre et appelle tous les officiers à rester fidèles à l'État. Le gouvernement chinois cherchera à agir rapidement pour réprimer les autres soulèvements et rétablir rapidement l'ordre dans le Shanxi. Le Shanxi est proche des communistes et on craint que des agitateurs communistes locaux et étrangers cherchent à utiliser ce conflit pour étendre leur influence."

 ROC_CLIQUE.6.d:0 "La clique du Xinjiang s'est soulevée contre la république. Ces officiers militaires, occidentaux et majoritairement musulmans, citent les actions oppressives du gouvernement et ses interventions dans les affaires des citoyens. Ils veulent plus d'autonomie et un pouvoir centralisé réduit. Le gouvernement chinois a condamné avec colère le soulèvement, ordonnant à tous les officiers fidèles du Xinjiang de rester fidèles à la république, même s'il semble que leur appel soit largement ignoré. Le gouvernement chinois devra agir rapidement, car tout soulèvement en Occident comporte toujours le risque de déclencher un soulèvement islamique plus large ou d'offrir une opportunité à des voisins hostiles d'étendre leur influence dans l'une des zones frontalières de la Chine. La clique aurait entretenu des liens étroits avec les Soviétiques dans le passé."

 ROC_CLIQUE.7.d:0 "La clique du Yunnan s'est soulevée contre la République. Ses dirigeants citent une centralisation excessive et des réformes visant à modifier la structure militaire actuelle du pays comme principales raisons du soulèvement. Le gouvernement chinois accuse la clique de seigneurs de guerre et appelle tous les officiers à rester loyaux. Le gouvernement chinois cherchera à poser des questions rapidement car le Yunnan est une province stratégiquement vitale et a accès à plusieurs États étrangers qui pourraient chercher à utiliser le soulèvement à leur avantage."

 ROC_CLIQUE.100.d:0 "L'empereur Ming autoproclamé de Chine, Jiao Yulu, et sa coalition de milices et de sectaires ont mis fin à la Seconde Période des Seigneurs de Guerre. L'ancien communiste charismatique a su exploiter la colère et la frustration des paysans chinois ruraux qui en avaient assez des combats incessants entre le Kuomintang, les communistes et les seigneurs de la guerre. Le retour des seigneurs de guerre a été la goutte d'eau qui a fait déborder le vase pour beaucoup qui craignaient que leur arrivée n'entraîne davantage de difficultés et de banditisme. Avec la victoire de Jiao Yulu, la République de Chine semble sur le point soit d'unir ses forces et de restaurer la dynastie Ming, soit d'être détruite."

 ROC_CLIQUE.101.d:0 "La deuxième période des seigneurs de guerre a pris fin en Chine. Le retour aux seigneurs de guerre a été amèrement accueilli par de nombreux paysans qui ont vu un retour au banditisme, à l'instabilité et à la violence après des années de guerre. Beaucoup espèrent désormais que ces cliques disparaîtront définitivement. Le gouvernement chinois doit désormais s'efforcer de reconstruire non seulement les dégâts matériels causés, mais également de rétablir la confiance du peuple chinois. À l'échelle internationale, les appels et les pressions se multiplient pour que le gouvernement mette en place de nouvelles politiques afin d'éviter qu'une telle situation ne se reproduise."

 ROC_CLIQUE.102.d:0 "La République populaire de Chine (RPC) a annoncé que ses forces avaient mis fin à la deuxième période des seigneurs de guerre. La RPC a déclaré que la république corrompue et incompétente avait conduit la Chine au point de désintégration et de ruine. Il a ensuite félicité les paysans et le peuple pour s'être soulevés aux côtés de l'Armée populaire de libération pour balayer les seigneurs de guerre corrompus et les fonctionnaires républicains provinciaux et nationaux incompétents. La RPC a conclu en annonçant un programme visant à assurer le développement, la prospérité et la modernisation des paysans négligés et exploités depuis des décennies."

 ROC_CLIQUE.103.d:0 "La deuxième période des seigneurs de guerre a pris fin en Chine. Le retour aux seigneurs de guerre a été amèrement accueilli par de nombreux paysans qui ont vu un retour au banditisme, à l'instabilité et à la violence après des années de guerre. Beaucoup espèrent désormais que ces cliques disparaîtront définitivement. La République de Chine a réussi à réunifier le pays malgré la menace des milices, des chefs de guerre, des communistes et des sectes. Le gouvernement chinois doit désormais s'efforcer de reconstruire non seulement les dégâts matériels causés, mais également de rétablir la confiance du peuple chinois. Le président [CHI.GetLeader] a promis de construire une république forte et de conduire la Chine vers son grand destin."

 KMT_Coup.1.t:0 "[GetNewspaperHeader]Un coup d'État à Nanjing"
 KMT_Coup.1.d:0 "Aujourd'hui, dans la capitale de la République de Chine, un coup d'État a eu lieu contre le généralissime Chiang Kai-Shek. Selon les autorités et les représentants militaires, le général Sun-Li Jen, l'un des meilleurs généraux et dirigeants de la République de Chine, a mené un coup d'État militaire pour renverser ce qu'il prétend être « un dirigeant défaillant qui est honteux pour la nation chinoise ». Favorisés par les Américains, beaucoup affirment que le coup d'État a été soutenu par la CIA et par le président américain, mais ces affirmations n'ont jusqu'à présent reçu aucun soutien ; il semble que ce ne soit qu'une rumeur parmi une pléthore de rumeurs concernant la déposition de Chiang."
 KMT_Coup.1.a:0 "Intéressant"

 KMT_Coup.2.t:0 "[GetNewspaperHeader]Tchang Kaï-chek tient bon"
 KMT_Coup.2.d:0 "Aujourd'hui, dans la capitale de la République de Chine, le généralissime Chiang Kai-shek a été confirmé comme président par le Comité central de réforme. Au cours des derniers mois, de nombreux changements politiques ont eu lieu au sein du Kuomintang. Certains responsables du parti ont disparu et de nouveaux jeunes talents prometteurs sont formés dans de nouvelles écoles de cadres du parti, selon les observateurs américains en Chine. Dans un discours adressé à ses partisans et à ses critiques, Chiang a promis de poursuivre son approche de réforme du parti et de l'État, de lutter contre la corruption et de supprimer les vestiges communistes dans la Chine libre. Les universitaires étrangers prédisent que la loi martiale sera maintenue pour le moment et que les espoirs d'un constitutionnalisme chinois seront anéantis au cours des années ou décennies à venir."
 KMT_Coup.2.a:0 "Un toast au Généralissime !"
 KMT_Coup.2.b:0 "Plus d'autocratie pour la Chine."

 KMT_mainlandburma.1.t:0 "Question de Jiangxinpo"
 KMT_mainlandburma.1.d:0 "Dans la région de Kachin où se trouvait la région de Jiangxinpo. La région était contrôlée par les chefferies birmanes locales, qui appartenaient à la préfecture de Tengyue au Yunnan pendant les dynasties Ming et Qing. Il a été perdu lorsque les Britanniques ont envahi la Birmanie à la fin du 19ème siècle, ainsi les Qing ont perdu le territoire qu'ils détenaient à Jiangxinpo. La question a amené beaucoup à s'interroger sur la valeur du territoire, la République ayant longtemps revendiqué la région."
 KMT_mainlandburma.1.a:0 "Lancez une invasion pour le reprendre !"
 KMT_mainlandburma.1.b:0 "Nous avons des affaires internes à régler."

 KMT_mainlandburma.2.t:0 "Invasion du Jiangxinpo"
 KMT_mainlandburma.2.d:0 "Sous les ordres de Nanjing, des milliers de soldats ont traversé la frontière sino-birmane et établi des bases militaires dans la région du Nord Kachin, empiétant sur la région principalement pour renforcer son contrôle sur la zone territoriale contestée. Bien que Rangoon ait reconnu la présence des troupes chinoises à Kachin et ait ordonné aux troupes de résister à leur présence, les troupes birmanes ont été complètement écrasées après avoir lancé une série de contre-attaques ratées. Nanjing a jusqu'à présent fait pression sur Rangoon pour qu'il ne fasse pas appel à l'ONU sur cette question, tout en les menaçant de financer des groupes rebelles en Birmanie qui souhaitent effondrer l'autorité de Rangoon s'ils tentaient de faire appel à l'ONU."
 KMT_mainlandburma.2.a:0 "Restauration de nos frontières légitimes"
 KMT_mainlandburma.2.b:0 "Maudit chinois !"

 KMT_50s_Mainland.13.t:0 "Question de Hong Kong"
 KMT_50s_Mainland.13.d:0 "La colonie britannique de Hong Kong existe depuis la fin de la première guerre de l'opium, lorsque la Grande-Bretagne a forcé la Chine à céder l'île, peu de temps après que les Britanniques ont commencé à étendre cette colonie sur le continent via Kowloon et les nouveaux territoires. La colonie elle-même marque les jours et les souvenirs des siècles d'humiliation. La seule façon pour la Chine de se remettre d'une telle humiliation est de reprendre ce qui a été volé par les Yangrens (Occidentaux) et d'affirmer notre force, en les forçant à reconnaître que leurs jours de domination de la Chine et de l'Asie sont révolus."
 KMT_50s_Mainland.13.a:0 "Nous le reprendrons quand le moment sera venu"

 KMT_50s_Mainland.14.t:0 "Crise de Suez en Égypte"
 KMT_50s_Mainland.14.d:0 "Avec la crise de Suez en cours entre l'Égypte et la Grande-Bretagne, cela nous donne une chance de reprendre aux Britanniques la colonie perdue depuis longtemps de Hong Kong. Beaucoup de nos responsables et conseillers nous ont informés de la possibilité de frapper immédiatement les positions britanniques à Hong Kong et de les forcer à partir. Cela pourrait sérieusement nuire à notre avenir avec les impérialistes, mais cela contribuerait de manière significative à restaurer la souveraineté et l'indépendance de la Chine vis-à-vis de l'Occident."
 KMT_50s_Mainland.14.a:0 "C'est trop risqué, annule les attaques"
 KMT_50s_Mainland.14.b:0 "Hong Kong est chinoise et l'a toujours été"

 KMT_50s_Mainland.15.t:0 "Invasion chinoise de Hong Kong"
 KMT_50s_Mainland.15.d:0 "Dans un geste surprenant de la part de la Chine, les Chinois ont utilisé la crise de Suez pour envahir la colonie de Hong Kong et en ont chassé les Britanniques presque immédiatement. La Chine a déclaré que Hong Kong leur appartenait, en utilisant comme justification la promesse de l'ancien président américain Roosevelt à la Chine concernant le retour de Hong Kong après la Seconde Guerre mondiale. Bien que les Chinois aient envahi la colonie à tort, ils n'ont pas encore expulsé les hommes d'affaires britanniques locaux et leur ont plutôt permis de rester à Hong Kong."
 KMT_50s_Mainland.15.a:0 "Condamnez leurs actions, ils devraient mieux savoir"
 KMT_50s_Mainland.15.b:0 "Nous ne pouvons rien faire contre les Chinois"

 KMT_50s_Mainland.16.t:0 "Invasion de Macao ?"
 KMT_50s_Mainland.16.d:0 "Juste après l'invasion de Hong Kong, nombre de nos fonctionnaires ont également commencé à faire pression pour le renversement de la colonie de Macao, l'une des dernières colonies en Chine. Même si Macao était une colonie en Chine, les Portugais les avaient acquis grâce à un bail équitable depuis l'époque de la dynastie Ming, tout en se tenant à l'écart des affaires des autres puissances occidentales qui ont ravagé la Chine comme des barbares."
 KMT_50s_Mainland.16.a:0 "Nous n'avons pas besoin de Macao"
 KMT_50s_Mainland.16.b:0 "Macao doit également retrouver la patrie"

 KMT_50s_Mainland.17.t:0 "Invasion de Macao"
 KMT_50s_Mainland.17.d:0 "Après la chute de Hong Kong, les Chinois ont commencé peu après la conquête de Macao en déployant des troupes pour envahir Macao sous prétexte de troubles locaux et de rétablissement de l'ordre. Jusqu'à présent, Macao n'a pas été suffisamment importante économiquement pour déranger la Chine, mais un important soutien local à Macao a également été restitué après que Hong Kong a fait pression sur le gouvernement pour qu'il le fasse."
 KMT_50s_Mainland.17.a:0 "Condamner leurs actes"
 KMT_50s_Mainland.17.b:0 "Nous devrions continuer à chercher à coopérer avec eux"

 KMT_50s_Mainland.18.t:0 "Le Portugal cherche à renforcer sa coopération"
 KMT_50s_Mainland.18.d:0 "Le gouvernement portugais a reconnu notre contrôle sur Macao et était disposé à poursuivre sa coopération avec nous même après notre prise de contrôle de Macao. Il semble qu'il soit sincère dans sa volonté de coopérer avec la Chine."
 KMT_50s_Mainland.18.a:0 "Et nous les accueillerons à bras ouverts"

 KMT_50s_Mainland.19.t:0 "Renommer Bai Chongxi au poste de ministre de la Défense nationale"
 KMT_50s_Mainland.19.d:0 "Avec la reconduction de Bai Chongxi au poste de ministre de la Défense nationale, cela le rapprocherait du gouvernement central et diviserait la nouvelle clique du Guangxi comme auparavant. Bai était l'ancien chef d'état-major et ministre de la Défense nationale, il ne fait aucun doute qu'il est un génie militaire sur le champ de bataille et peut non seulement aider à briser la faction de Li, mais aussi nous aider dans notre quête pour construire des forces armées fortes grâce à son mandat de ministre de la Défense nationale. Espérons que cette fois, nos plans visant à diviser la clique du Guangxi réussiront et forceront Li et ses autres sbires à être soumis par le gouvernement central."
 KMT_50s_Mainland.19.a:0 "La deuxième fois est-elle la bonne ?"

 KMT_50s_Mainland.20.t:0 "La reconstruction de Shanghai"
 KMT_50s_Mainland.20.d:0 "Si vous parcourez les rues de Shanghai et tendez la main aux habitants âgés, ils ne vous raconteront pas l'histoire d'une ville, mais celle de toute une nation. Shanghai est devenue le centre économique du commerce et de l'industrialisation de la Chine, mais au prix de puissances étrangères détenant de grandes parts et droits au sein de la ville.\n\nAprès la chute des Qing, la ville s'est agrandie, devenant finalement l'endroit le plus peuplé du monde, avec divers groupes de personnes cherchant à y commencer une nouvelle vie, notamment des réfugiés juifs d'Allemagne et des émigrés russes blancs. La ville a émergé encore plus loin, l'électricité, la radio et les tramways ont trouvé leur chemin dans la société chinoise via Shanghai, les innovations artistiques en matière de musique et d'animation ont commencé à fleurir.\n\nPolitiquement parlant, la ville était à la tête de commerçants fortement influencés par les gangs clandestins qui ont conclu une alliance avec le Kuomintang dans les années 1920. Cependant, personne ne pouvait prédire les horreurs qui allaient survenir lorsque les Japonais attaqueraient la ville. Les premiers bombardements de 1932 furent marqués par d'intenses combats entre étudiants chinois et soldats des concessions japonaises. Cinq ans plus tard, la bataille de « Stalingrad de l'Est », comme l'appellent aujourd'hui certains observateurs occidentaux, a vu diverses parties de la ville détruites, avec des pertes si élevées qu'on pourrait passer des semaines à compter les corps (si la plupart d'entre eux n'étaient pas brûlés ou désintégrés). Avec la capitulation du Japon en 1945 et la dissolution de la colonie internationale de Shanghai en 1941, la ville put reprendre son souffle après les horreurs qu'elle avait dû endurer jusqu'à ce que survienne le prochain événement majeur, peut-être le plus important. Le 13 juillet 1949, la paix revint enfin à Shanghai pour de bon, lorsque les forces de la République furent capables de résister contre toute attente à l'avancée de l'Armée populaire de libération et empêchèrent Shanghai de tomber entre les mains rouges.\n\nLe moment est peut-être venu pour Shanghai de panser ses blessures. Toute la corruption, la guerre, les étrangers et autres ont influencé et traumatisé la ville à un degré incomparable à aucune autre ville d'Asie de l'Est. Il est peut-être temps pour un nouveau départ."
 KMT_50s_Mainland.20.a:0 "Puisse-t-elle redevenir la Perle de l'Orient."

 KMT_50s_Mainland.21.t:0 "Empiètement communiste sur la Chine"
 KMT_50s_Mainland.21.d:0 "Alors que le conflit de la Guerre froide qui s'ensuit entraîne la République de Chine, l'Union soviétique a de nouveaux projets pour empiéter sur nos territoires, et n'est pas encore satisfaite de sa part du gâteau. La Mongolie, le Turkestan oriental et la Mandchourie étant désormais sous la coupe des impérialistes soviétiques, nous devons préparer leur libération en incitant à des révoltes, plutôt qu'en les envahissant directement, ce qui pourrait également conduire à une intervention soviétique directe. Plus nous attendrons, plus ils se prépareront à frapper la Chine et à opprimer le peuple chinois avec leur rhétorique communiste. Nous ne pouvons pas nous permettre que cela se produise."
 KMT_50s_Mainland.21.a:0 "Nous n'attendrons pas notre temps, préparons-nous à libérer le Nord."

 KMT_50s_Mainland.22.t:0 "Création du NCSIST"
 KMT_50s_Mainland.22.d:0 "La création de l'Institut national des sciences et technologies Chung-Shan, connu en abrégé NCSIST, nous servira de centre militaire de R&D et d'intégration de systèmes. Cela nous permettra d'être autonomes dans l'acquisition des dernières technologies militaires et de réduire notre dépendance à l'égard des États-Unis pour les dernières technologies militaires. Elle sera enregistrée en tant que société d'État appartenant au gouvernement."
 KMT_50s_Mainland.22.a:0 "Super à entendre."

 KMT_50s_Mainland.23.t:0 "Débat sur l'école privée"
 KMT_50s_Mainland.23.d:0 "Depuis quelque temps déjà, l'école privée pose les bases de l'éducation du pays. Même si la dissolution des écoles privées pour faire place aux écoles publiques semble être une excellente décision, elle pourrait donner lieu à un mécontentement parmi les élites qui comptaient sur elles pour leur éducation. Lors du débat sur le maintien ou non des écoles privées, deux factions différentes ont émergé quant à la réponse que le gouvernement devrait donner. L'un souhaite laisser les écoles privées rester en guise d'apaisement envers les élites, tandis que l'autre faction, plus dure, souhaite fermer ces écoles privées et établir uniquement l'enseignement public dans le pays, à la fois pour centraliser le programme scolaire et pour réguler ce qui est pensé. Bien que le [CHI.GetName] n'ait encore rien dit sur sa position, le gouvernement devrait bientôt donner une réponse au public."
 KMT_50s_Mainland.23.a:0 "Laissez les écoles privées rester."
 KMT_50s_Mainland.23.b:0 "Nationalisez-les et rouvrez-les en tant qu'écoles publiques."

 KMT_50s_Mainland.25.t:0 "Question sur l'éducation obligatoire"
 KMT_50s_Mainland.25.d:0 "L'enseignement public étant actuellement le centre de l'éducation en Chine, la question de la durée de la scolarité obligatoire a été soulevée. De nombreux responsables se sont déclarés favorables à une scolarité obligatoire de six ans, tandis que les partisans de la ligne dure souhaitent qu'elle dure jusqu'à neuf ans pour mieux préparer les élèves. Cependant, cette nouvelle tentative de lutte contre l'analphabétisme nécessitera une énorme quantité de ressources publiques pour la mise en oeuvre, afin de subventionner les familles qui ne peuvent pas se permettre le coût des écoles publiques."
 KMT_50s_Mainland.25.a:0 "Six ans de scolarité obligatoire."
 KMT_50s_Mainland.25.b:0 "Neuf années de scolarité obligatoire."
 KMT_50s_Mainland.25.c:0 "Le strict minimum..."

 KMT_50s_Mainland.26.t:0 "Sanmin Zhuyi a enseigné dans les écoles"
 KMT_50s_Mainland.26.d:0 "Les Trois principes du peuple, idéologie inventée par le père fondateur, ont sauvé le Kuomintang de décennies de désastres. Nous rendrons obligatoire aux étudiants la connaissance de la philosophie de son idéologie ainsi que de l'histoire de notre parti. Le cours sera introduit à toutes les formes d'éducation en Chine, afin que chacun soit informé de la cause révolutionnaire nationale."
 KMT_50s_Mainland.26.a:0 "Tout le monde connaîtra ses principes !"
 KMT_50s_Mainland.26.b:0 "Rendez-le facultatif."
 KMT_50s_Mainland.26.c:0 "Atténuez le cours et rendez-le facultatif."
 
 KMT_50s_Mainland.29.t:0 "Le prince Demchudongrub arrive à Nanjing"
 KMT_50s_Mainland.29.d:0 "Sur invitation du président [CHI.GetLeader], le prince Demchudongrub, aux côtés de ses proches collaborateurs He Zhaolin, Bai Haifeng et Bayankhan sont arrivés dans la capitale pour discuter de questions importantes concernant l'autonomie politique de la Mongolie intérieure. Notre gouvernement dépend du prince Demchudongrub et de son entourage en raison de son influence et de sa légitimité en tant que dirigeant de toute la région de la Mongolie intérieure, en particulier envers le régime socialiste illégitime de Xilinhot sous Ulanhu. Même si nous ne favorisons généralement pas les gouvernements autonomes, maintenir le Prince au pouvoir est essentiel pour la stabilité et la loyauté de la région. Les conseillers politiques du président [CHI.GetLeader] ont avancé une idée qui profiterait à Demchudongrub à court terme et nous favoriserait dans un avenir proche. Si nous devions accorder plus de privilèges au prince, au lieu des institutions locales de Mongolie intérieure, nous satisferions les désirs de la noblesse mais empêcherions la Mongolie intérieure d'exercer son autonomie. Une fois que le prince De décèdera ou démissionnera, nous pourrons utiliser le vide du pouvoir pour étendre davantage l'influence Han dans la région."
 KMT_50s_Mainland.29.a:0 "Espérons que cela le maintiendra en ligne."

 KMT_50s_Mainland.30.t:0 "La fin de la nouvelle clique du Guangxi"
 KMT_50s_Mainland.30.b:0 "Pendant des décennies, le Guangxi est resté comme une forteresse impénétrable d'autonomie régionale sous la direction de la nouvelle clique du Guangxi. Cependant, avec l'apaisement de l'urgence nationale et la réaffirmation par Nanjing d'une autorité centrale incontestée, l'ère du fief indépendant de Li Zongren touche à sa fin rapide.\n\nSuite à l'influence croissante du gouvernement central dans la région, le paysage politique à Guilin et Nanning s'est radicalement modifié en faveur du Kuomintang. Li Zongren, déchu de son commandement direct sur les armées régionales, a été élevé à un poste prestigieux mais tout à fait symbolique au sein du Conseil militaire national de Nanjing. Ses principaux fidèles au sein de la bureaucratie civile ont été systématiquement remplacés par des fonctionnaires alignés sur Central Whampoa, tandis que les célèbres divisions du Guangxi ont été réorganisées sous la supervision directe du ministère de la Défense nationale ou ont été mises à la retraite.\n\nLe général Li Pinxian prend la tête du nouveau gouverneur de la province. Bien qu'il soit lui-même originaire du Guangxi, la loyauté inébranlable de Li Pinxian envers l'appareil central et sa volonté d'exécuter les ordres de Nanjing constituent la solution parfaite pour neutraliser la dissidence locale. L'ancien appareil des seigneurs de guerre a été démantelé sans coup férir, transformant le Guangxi d'un centre de pouvoir rival en une province obéissante de la République."
 KMT_50s_Mainland.30.a:0 "Enfin."
 
 KMT_50s_Mainland.31.t:0 "La transformation du Shanxi"
 KMT_50s_Mainland.31.b:0 "Pendant près de quatre décennies, le plateau du Shanxi a fonctionné comme un « royaume au sein d'un État » presque imprenable sous le règne du « gouverneur modèle », Yan Xishan. Protégé par des voies ferrées étroites, des arsenaux privés à Taiyuan et un appareil administratif personnel omniprésent, le Shanxi avait résisté à un contrôle central significatif depuis la naissance de la République. Avec la victoire nationale assurée et l'ère des seigneurs de guerre touchant à sa conclusion définitive, Nanjing a enfin intégré ce bastion du nord dans le giron unifié.\n\nYan Xishan, pragmatique jusqu'au bout et reconnaissant que le temps de l'indépendance régionale est définitivement révolu, a annoncé sa retraite complète des affaires militaires et politiques provinciales. Honoré en tant qu'ancien fondateur de la République, Yan a pris une retraite purement digne à Nanjing avec une nomination au Comité consultatif supérieur du Bureau du Président. Les monopoles économiques provinciaux et les systèmes de patronage privé de Taiyuan ont été ouverts à la réglementation nationale, et les célèbres réseaux de défense du Shanxi ont été placés sous le commandement standard de l'armée centrale.\n\nLe général Xu Yongchang prend la direction de Taiyuan. En tant que vétéran respecté de l'armée du Shanxi, devenu ministre du Conseil des opérations militaires et loyaliste nationaliste de base, Xu est l'homme d'État idéal pour faire le pont entre l'ancien appareil provincial et le nouvel ordre centralisé. "
 KMT_50s_Mainland.31.a:0 "La Forteresse privée du Plateau Nord n'existe plus."
 
 KMT_50s_Mainland.32.t:0 "La pacification du Yunnan"
 KMT_50s_Mainland.32.b:0 "Pendant des décennies, le Yunnan a fonctionné presque comme un royaume distinct le long de la frontière sud de la Chine, protégé par des chaînes de montagnes et farouchement gardé par des élites régionales retranchées. Alors que le général Sun Du avait maintenu une paix fragile avec le gouvernement central, l'appareil provincial de Kunming restait un bastion du localisme, conservant ses propres revenus, ses liens avec des milices privées et ses réseaux commerciaux transfrontaliers indépendants. Alors que la consolidation nationale progresse, Nanjing a pris des mesures pour démanteler ce bastion du sud-ouest.\n\nSun Du, reconnaissant le pouvoir écrasant de la République réunifiée, a démissionné de la direction provinciale. En reconnaissance de sa conformité, il s'est vu proposer d'entrer dans le service diplomatique en tant que représentant de la République en Thaïlande. Ses commandants loyalistes ont été progressivement mis à la retraite avec des pensions confortables ou réaffectés à des tâches d'état-major loin des frontières.\n\nLe général Li Mi, commandant endurci de la huitième armée et loyaliste intransigeant du gouvernement central, prend le contrôle du Yunnan en tant que nouveau gouverneur du Yunnan. Li Mi a agi rapidement pour établir une autorité centrale sur les passages frontaliers, intégrant les douanes provinciales dans le trésor national et remplaçant les garnisons provinciales par des divisions standardisées de l'armée centrale. L'ère de l'isolement des Yunnanais est révolue ; la porte sud de l'Indochine est désormais alignée sur Nanjing."
 KMT_50s_Mainland.32.a:0 "Comme il se doit."
 
 KMT_50s_Mainland.33.t:0 "L'unification du Sichuan et du Xikang"
 KMT_50s_Mainland.33.b:0 "Les zones frontalières du Xikang et de l'ouest du Sichuan ont historiquement servi de refuge fragmenté aux factions régionales des seigneurs de guerre, le général Sun Zhen organisant un réseau de garnisons locales sichuanaises. Consciente que la sécurisation de la frontière sud-ouest nécessite une administration unifiée et moderne plutôt que des cliques frontalières fragmentées, Nanjing a adopté une refonte administrative : fusionner Xikang dans une province du Sichuan restaurée et consolidée.\n\nSun Zhen a renoncé à son commandement militaire régional. En échange, il s'est vu accorder un poste honorifique au sein du Comité consultatif stratégique du gouvernement national à Nanjing, coupant ainsi gracieusement ses liens avec les garnisons de Chengdu et de Kangding. La structure de favoritisme militaire local qui dictait autrefois la politique du Sud-Ouest a été démantelée.\n\nLe général Wang Lingji accède au poste de gouverneur de la province nouvellement réunifiée. Administrateur militaire discipliné, connaissant parfaitement le Sichuan et engagé sans compromis envers Nanjing, Wang a décidé de mettre en oeuvre des réformes fiscales centrales et de réorganiser les unités locales relevant du ministère de la Défense nationale. Avec la dissolution de la partition administrative et l'autorité centrale entièrement rétablie, la porte occidentale du plateau tibétain se trouve sous le commandement direct de Nanjing."
 KMT_50s_Mainland.33.a:0 "Le Sud-Ouest est unifié sous une seule bannière."
 
 KMT_50s_Mainland.34.t:0 "La réorganisation du Hunan"
 KMT_50s_Mainland.34.b:0 "Le Hunan a longtemps servi de carrefour du militarisme régional, ses armées locales gardant obstinément les intérêts provinciaux et résistant aux intrusions extérieures. Les forces de garnison régionales du général Ding Delong étant désormais officiellement absorbées dans la chaîne de commandement nationale, Nanjing a agi rapidement pour garantir que le grenier vital de la Chine centrale ne échappe plus jamais aux mains du gouvernement central.\n\nDing Delong, dont l'autorité indépendante s'appuyait sur le soutien de la noblesse locale, a été poliment mis à l'écart. Délesté de son commandement territorial, il a été réaffecté à un poste de conseiller au ministère de la Défense nationale de Nanjing, loin de Changsha. À sa place, le général Song Xilian, diplômé de Whampoa, a assumé le poste de gouverneur.\n\nSong a immédiatement institué une surveillance administrative et fiscale centrale dans toute la province. Les réseaux de milices locales ont été dissous ou intégrés dans la structure standard de l'armée centrale, et les bureaux provinciaux des recettes sont désormais dotés de fonctionnaires relevant directement de Nanjing. Le provincialisme traditionnel du Hunan a pris fin."
 KMT_50s_Mainland.34.a:0 "Magnifique."
 
 KMT_50s_Mainland.35.t:0 "La nouvelle direction de la Ma Clique"
 KMT_50s_Mainland.35.b:0 "Pendant des générations, la vaste frontière nord-ouest du Gansu, du Qinghai et du Ningxia a été gouvernée par les seigneurs de guerre de la famille Ma. Opérant grâce à des allégeances claniques, une cavalerie musulmane et des trésors provinciaux pratiquement autonomes, le général Ma Bufang et ses proches exerçaient une emprise quasi absolue sur le couloir menant au Xinjiang. Avec le gouvernement central fermement aux commandes et la modernisation balayant la nation, Nanjing a mis fin à l'ère des dynasties de seigneurs de guerre autonomes dans le Nord-Ouest.\n\nLes membres de la famille Ma, réalisant que leur cavalerie régionale ne pouvait plus résister au poids politique et militaire de la République unifiée, ont cédé le commandement territorial suprême. En échange d'une transition ordonnée, Ma Bufang, Ma Hongkui, Ma Buqing et Ma Hongbin ont été affectés comme diplomates dans divers pays du Moyen-Orient afin de les éloigner autant que possible du Nord-Ouest. Entre-temps, le réseau bien établi des anciens de la famille Ma et des collecteurs d'impôts régionaux a été mis à la retraite, remplacé par des fonctionnaires nommés au niveau central et des services administratifs modernes.\n\nPour superviser cette transition délicate, Nanjing a nommé le général Ma Chengxiang. Tout en portant le prestige de la lignée Ma, Ma Chengxiang est un commandant dévoué de l'armée centrale, connu pour sa stricte loyauté envers Nanjing et sa formation militaire moderne. Sous sa direction, les célèbres unités de cavalerie du nord-ouest sont restructurées en divisions mécanisées et d'infanterie standardisées relevant du ministère de la Défense nationale, tandis que les banques centrales prennent en charge la monnaie régionale et les routes commerciales. La frontière historique du nord-ouest a cessé d'être un royaume privé, pleinement intégré à la République."
 KMT_50s_Mainland.35.a:0 "Le Nord-Ouest s'incline devant l'Autorité centrale."
 
 KMT_50s_Mainland.36.t:0 "La colonie de Lhassa"
 KMT_50s_Mainland.36.b:0 "Pendant des décennies, le Tibet est resté isolé et soumis à une autonomie de facto, maintenant son propre gouvernement à Lhassa tandis que les plaines centrales étaient en proie à la guerre. Le continent étant désormais pacifié et les frontières de la République solidement consolidées, les missions diplomatiques de Nankin, escortées par des garnisons de l'armée centrale, ont atteint la ville sainte pour officialiser le retour du Tibet à la Chine.\n\nPour représenter la souveraineté centrale sans bouleverser complètement la hiérarchie sociale traditionnelle, nous avons rétabli le bureau historique de la Commission des affaires mongoles et tibétaines à Lhassa, dirigé par un haut-commissaire central. Alors que les domaines féodaux et les monastères locaux maintiennent pour l'instant leurs coutumes traditionnelles, les garnisons frontalières de l'armée centrale ont pris position le long des passages frontaliers de l'Himalaya, et des projets d'infrastructures nationales commencent à relier Lhassa au Sichuan et au Qinghai. "
 KMT_50s_Mainland.36.a:0 "Bien."
 
 KMT_Shanghai.1.t:0 "Chiang Ching-Kuo revient à Shanghai"
 KMT_Shanghai.1.d:0 "Alors que le chaos règne toujours à Shanghai, Chiang Kai-Shek a décidé de tenter à nouveau la pacification de la ville, même si cela devait défier tous les pronostics. Le généralissime a renvoyé son fils dans la ville de Shanghai pour se charger de forcer les Shanghaiens à rectifier leur comportement nuisible et à en être tenus responsables. Des hommes d'affaires corrompus, des sociétés secrètes et même des membres de gangs ont décidé de retourner dans la ville après que nous ayons gagné la guerre civile, démontrant que la tâche d'apprivoiser la ville ne sera pas plus facile qu'avant. La seule différence cependant est que cette fois, Ching-Kuo est deux fois plus disposé à remplir son devoir de rétablir l'ordre public à Shanghai, si c'est ce qu'il faut pour regagner le soutien des Shanghaiens à la République."
 KMT_Shanghai.1.a:0 "Adieu, Chiang Junior !"

 KMT_Shanghai.2.t:0 "Reprise des « Battre les Tigres » à Shanghai"
 KMT_Shanghai.2.d:0 "Avec le retour de Chiang Ching-Kuo dans la ville, il ordonna immédiatement la restauration de certaines réformes qu'il avait prévu de mettre en oeuvre en 1948. Une série de documents anciens et récemment rédigés lui furent remis pour les faire appliquer sur ses ordres. Jusqu'à présent, il a réintroduit le Corps national de reconstruction pour la répression des bandits, car une annonce publique a également été faite par le bureau du gouvernement de Shanghai concernant le retour de Ching-Kuo et les réformes qui devaient être introduites dans la ville, ce qui a bien sûr été confronté aux critiques de ceux qui ont bénéficié de l'état actuel de Shanghai."
 KMT_Shanghai.2.a:0 "Un prix à payer pour le bien-être du peuple."

 KMT_Shanghai.3.t:0 "Un autre mouvement de masse à Shanghai"
 KMT_Shanghai.3.d:0 "Suite à son projet d'utiliser le peuple pour soutenir ses réformes, Ching-Kuo a commencé à mettre en place diverses stations de signalement, permettant à la population de dénoncer toute personne considérée comme profitant ou corrompant Shanghai. Ching-Kuo a réformé le Corps des services de la jeunesse de Shanghai et a utilisé les jeunes locaux pour patrouiller dans la ville et travailler aux côtés du principal Corps national de reconstruction pour la répression des bandits afin de faire appliquer les réformes de Ching-Kuo."
 KMT_Shanghai.3.a:0 "A bas les profiteurs et les exploiteurs !"
 KMT_Shanghai.3.b:0 "Déradicaliser les mouvements... avant que la violence et le chaos n'éclatent."

 KMT_Shanghai.4.t:0 "Soutien du gouvernement aux réformes"
 KMT_Shanghai.4.d:0 "Reconnaissant son erreur passée de ne pas recevoir le soutien gouvernemental dont il avait besoin, Ching-kuo a décidé cette fois-ci de modifier son approche des réformes. Grâce aux liens étroits avec la famille Soong pour de nombreux hauts fonctionnaires du gouvernement, Ching-Kuo a commencé à se tourner vers les réformateurs de Gexin, qui, bien qu'ils soient une petite faction au sein du Parti et d'extrême droite, étaient favorables à la purge de la bureaucratie des individus corrompus. À leurs côtés, il a utilisé diverses autres factions compétitives au sein du parti, telles que la Clique du Central Club, qui sont très influentes. "
 KMT_Shanghai.4.a:0 "Au moins, notre succès est désormais garanti."
 KMT_Shanghai.4.b:0 "Peut-être ne devrions-nous pas laisser les différentes factions et familles s'immiscer dans notre programme de réforme."

 KMT_Shanghai.5.t:0 "Disparition des gangs et des sociétés secrètes à Shanghai"
 KMT_Shanghai.5.d:0 "La diminution soudaine des gangs et des sociétés secrètes à Shanghai a commencé lorsque Ching-kuo a lancé une répression majeure dans la ville, lançant des raids contre nombre de leurs bases cachées avec l'aide de la police secrète. Le Shanghai Youth Service Corps et le Bandit-Suppression National Reconstruction Corps ont commencé des arrestations massives après la capture d'un grand nombre de leurs membres, dont la plupart étaient soit impliqués dans la gestion des activités de contrebande du marché noir de Shanghai, soit volaient les gens dans les rues par des moyens violents. Après la chute des « mouches » de Shanghai, la baisse du taux de criminalité a permis à la ville de redevenir pratiquement sûre."
 KMT_Shanghai.5.a:0 "Les habitants de Shanghai aiment le maire Chiang !" ###People of Yanbian love Chairman Mao reference###

 KMT_Shanghai.6.t:0 "Lancer des raids contre les hommes d'affaires de la classe supérieure"
 KMT_Shanghai.6.d:0 "Chiang Ching-Kuo a introduit de nouvelles lois qui autorisent le Corps national de reconstruction pour la répression des bandits à lancer des raids contre bon nombre des hommes d'affaires les plus riches et les plus connus de Shanghai, leur permettant ainsi de contrôler pleinement la terreur contre nombre d'entre eux qui ont été reconnus coupables de thésaurisation de marchandises, une pratique courante parmi les entreprises, ainsi que de coopération avec le marché noir de Shanghai pour faire passer des marchandises en contrebande à des prix inférieurs. Ces actions obligeraient bon nombre de ces hommes d'affaires infâmes à être enfermés derrière les barreaux et certains à avoir la tête coupée dans le cadre du plan de Ching-kuo visant à « donner l'exemple aux autres hommes d'affaires »."
 KMT_Shanghai.6.a:0 "Voilà leurs affaires entre les mains du gouvernement."
 KMT_Shanghai.6.b:0 "Permettre à certains hommes d'affaires « propres » de poursuivre leurs opérations."

 KMT_Shanghai.7.t:0 "Lancement d'attaques contre les hommes d'affaires de la classe moyenne"
 KMT_Shanghai.7.d:0 "Chiang Ching-Kuo a introduit de nouvelles lois qui autorisent le Corps national de reconstruction pour la répression des bandits à lancer des raids contre les hommes d'affaires de la classe moyenne pour toute entreprise illégale qu'ils auraient pu commettre. Bien qu'autorisant le capitalisme mais pas la corruption capitaliste, Chiang Ching-kuo a déclaré publiquement que « les hommes d'affaires de la classe moyenne qui ne se sont trouvés dans aucun endroit où ils ne devraient pas être ne devraient pas s'inquiéter des raids ». Des sanctions mineures étaient cependant en place pour eux, car Ching-kuo ne souhaitait pas contrarier la classe moyenne qui serait bientôt l'épine dorsale de Shanghai une fois les réformes terminées."
 KMT_Shanghai.7.a:0 "Une nécessité au prix du soutien de la classe moyenne."
 KMT_Shanghai.7.b:0 "Réprimez plus fort les mouches de Shanghai !"
 KMT_Shanghai.7.c:0 "Ce n'était peut-être pas une bonne idée... Annulez la politique."

 KMT_Shanghai.8.t:0 "Conclusion des réformes"
 KMT_Shanghai.8.d:0 "L'horloge sonnait minuit à Shanghai, alors que le fils du généralissime était assis dans son bureau pour rédiger les derniers rapports qui devaient être envoyés à son père à Nanjing, dans l'espoir de ne pas décevoir à nouveau le peuple shanghaïen comme il l'avait fait auparavant. Il avait écrit à son père ses griefs antérieurs en 1948 après l'échec des réformes à Shanghai et comment il avait essayé diverses méthodes pour poursuivre différemment qu'auparavant. Alors qu'il s'apprêtait à quitter le bureau, il a vu un rapport qu'il avait oublié d'ouvrir. Il a commencé à ouvrir lentement le rapport, où il a découvert que le rapport contenait un graphique et des détails sur les résultats des réformes.\n\nLa déception a rapidement conquis le visage du Généralissime. Selon les protocoles et les rapports, les mesures prises à Shanghai n'ont apporté qu'une si petite contribution que les graves problèmes de la ville, tels que la corruption et les manigances clandestines, continuent de tourmenter la région à un niveau élevé. Même s'il n'est visiblement pas satisfait des résultats, le généralissime s'est retenu de blâmer son fils, reconnaissant l'effort et le désir qu'il a mis dans son voyage à Shanghai. La ville n'est peut-être pas à l'endroit souhaité où elle est censée être, mais la volonté de nettoyer Shanghai de la corruption et des gangs secrets ne s'éteindra pas."
 KMT_Shanghai.8.a:0 "C'est vraiment dommage..."

 KMT_Shanghai.9.t:0 "Conclusion des réformes"
 KMT_Shanghai.9.d:0 "Il était 7 heures du matin à Shanghai, Chiang Kai-Shek se réveilla et reçut un rapport de Ching-kuo accompagné d'une lettre de lui qui exprimait que le résultat des réformes était un succès majeur. Le rapport fait état d'une diminution du taux de criminalité à Shanghai parallèlement à la fin de la corruption des bureaucrates et des hommes d'affaires. Cela a été accueilli avec joie par Chiang, qui a immédiatement vu le potentiel de transformer la ville en une métropole riche de renommée internationale. La ville s'est remise des conflits précédents, et les affaires ont repris leur cours normal pour beaucoup d'entre eux. L'histoire de Ching-kuo d'apprivoiser Shanghai s'est accompagnée d'une augmentation de son prestige au sein du gouvernement, alors que son père commençait à envisager de lui confier de nouvelles responsabilités au sein du gouvernement."
 KMT_Shanghai.9.a:0 "Son histoire a changé Shanghai."


 ###Civil War Stuff###

 KMT_Civilwar.1.t:0 "Instaurer des réformes de l'armée en temps de guerre"
 KMT_Civilwar.1.d:0 "Les années précédentes ayant été marquées par un grand nombre de désertions au sein de l'armée ainsi que par l'inefficacité de la structure de l'armée américaine, nous n'aurons pas besoin d'utiliser une vieille structure militaire, vaste et excessive. Nous en adopterons un, petit mais suffisamment efficace, pour imposer la discipline au sein de l'armée et réprimer les futures désertions potentielles. Maintenant que le front est en grande partie stabilisé, nous pouvons mener des réformes en toute sécurité et faire en sorte que le conflit qui s'ensuit ne puisse pas perturber nos efforts."
 KMT_Civilwar.1.a:0 "J'espère que cela aidera."

 KMT_Civilwar.2.t:0 "Reprise du mouvement de réforme Gexin"
 KMT_Civilwar.2.d:0 "Le Mouvement de réforme Gexin, qui a éclaté en 1944 et a duré trois ans au total, était composé de divers jeunes membres des factions de droite du Kuomintang, principalement la faction Whampoa et la clique du Central Club, qui ont plaidé pour la fin de la corruption et des purges au sein de la bureaucratie et pour réformer le gouvernement pour assurer une gouvernance efficace. Nous encouragerons ces individus et les inviterons au gouvernement."
 KMT_Civilwar.2.a:0 "Pouvons-nous enfin être productifs dans les réformes ?"

 KMT_Civilwar.3.t:0 "Création du Bureau de la sécurité nationale"
 KMT_Civilwar.3.d:0 "L'ère de dépendance totale à l'égard du NBIS (Bureau National d'Enquêtes et de Statistiques) est révolue, ils ne sont plus fiables pour gérer la collecte de renseignements militaires et doivent être remplacés par les bureaux de renseignement d'autres secteurs. Le Bureau de la sécurité nationale aidera à coordonner les autres bureaux de renseignement pour aider à collecter des renseignements militaires et des opérations d'espionnage contre nos ennemis."
 KMT_Civilwar.3.a:0 "Dai Li n'aurait pas aimé ça s'il était vivant."

 KMT_Civilwar.4.t:0 "La République de Chine exige la fin de l'embargo sur les armes"
 KMT_Civilwar.4.d:0 "Aujourd'hui, le lobby chinois (un groupe d'Américains appelant au soutien de la République de Chine) et des diplomates de la République de Chine nous ont affrontés pour mettre fin à l'embargo sur les armes contre la République de Chine de 1947. L'administration Truman a introduit cet embargo pour imposer un cessez-le-feu dans la guerre civile chinoise pendant la mission Marshall, dans l'intention de forcer le Kuomintang à faire des compromis avec les communistes. Aujourd'hui, alors que le soutien à la République de Chine atteint un niveau sans précédent aux États-Unis et que le lobby chinois gagne de plus en plus de soutien tout en poussant à un soutien plus étendu à la Chine, le choix de mettre fin à l'embargo sur les armes est inévitable."
 KMT_Civilwar.4.a:0 "Nous n'avons pas d'autre choix que de concéder."

 KMT_Civilwar.5.t:0 "Washington lève l'embargo sur les armes."
 KMT_Civilwar.5.d:0 "Aujourd'hui, le gouvernement américain a officiellement annoncé la fin de l'embargo sur les armes contre la République de Chine, tout en entendant soutenir la cause de la République contre les communistes, que ce soit sur le plan diplomatique ou militaire. Néanmoins, un progrès majeur a été réalisé dans la reconquête du soutien américain contre les communistes."
 KMT_Civilwar.5.a:0 "Nous accueillerons à nouveau leur soutien, mais nous n'oublierons jamais le jour où ils nous ont abandonnés."

 KMT_Civilwar.6.t:0 "Le lobby chinois réclame un soutien massif à la Chine"
 KMT_Civilwar.6.d:0 "Après la fin de l'embargo sur les armes en République de Chine, le lobby chinois a fait pression sur nous pour qu'ils soutiennent la République, en intervenant directement dans la guerre civile pour forcer la fin de la guerre civile tout en étant en faveur de la République de Chine."
 KMT_Civilwar.6.a:0 "Nous pouvons en convenir."
 KMT_Civilwar.6.b:0 "On ne peut pas faire confiance aux nationalistes !"

 KMT_Civilwar.7.t:0 "[GetNewspaperHeader]Atrocités présumées en Chine"
 KMT_Civilwar.7.d:0 "Récemment, la République de Chine a déployé des journalistes pour surveiller la situation de la guerre civile aux côtés des communistes, avec des instantanés d'atrocités commises dans les zones urbaines à la suite de rafles massives de propriétaires fonciers et d'hommes d'affaires alignés sur le Kuomintang. Les journalistes nationalistes chinois et occidentaux ont qualifié le comportement des communistes de « simple » et ont déclaré que ces atrocités devaient cesser immédiatement. Le Parti communiste chinois a qualifié ces propos de « fausses affirmations des médias occidentaux » et a qualifié ces propriétaires et hommes d'affaires de traverser une période de réhabilitation. Les médias des partis communistes ont dénoncé les affirmations du Kuomintang et ont attiré l'attention sur la prétendue répression des paysans et des travailleurs chinois à travers le Kuomintang, arguant que leur libération de la bourgeosie est inévitable."
 KMT_Civilwar.7.a:0 "Une grande tragédie."

 KMT_Civilwar.8.t:0 "Soutien public au Kuomintang"
 KMT_Civilwar.8.d:0 "Avec la défense réussie des forces du Kuomintang dans le sud de la Chine, la guerre civile chinoise semble être à un tournant : les forces communistes sont incapables de dépasser les défenses nationalistes dans le sud-ouest et perdent lentement leur élan. Dans le même temps, le soutien au Kuomintang s'est rapidement accru aux États-Unis suite à la défense réussie de la ville, beaucoup pensant que le Kuomintang est sur le point de renverser le cours de la guerre et d'écraser les communistes. Face à la pression locale croissante pour le soutien du Kuomintang, l'administration Truman doit prendre une décision."
 KMT_Civilwar.8.a:0 "Nous continuerons à leur apporter notre soutien."
 KMT_Civilwar.8.b:0 "Nous ne ferons plus jamais confiance à ces voleurs corrompus."

 KMT_Civilwar.9.t:0 "Le conflit Chiang-Li"
 KMT_Civilwar.9.d:0 "En 1948, une élection présidentielle a eu lieu et Li Zongren a été élu vice-président de la République de Chine tandis que Chiang Kai-Shek est resté président. En 1949, alors que la situation était pire et que Li Zongren était déjà un grand opposant à Chiang, ils entamèrent une lutte de pouvoir avec la démission de Chiang afin de faire de Li Zongren le bouc émissaire de l'échec contre les communistes pendant la guerre civile. Ceux qui sont fidèles à Li n'ont suivi que les ordres de Li tandis que ceux qui sont uniquement fidèles à Chiang n'ont suivi que ses ordres, car tous deux ont divisé le commandement des forces armées dévastées de la République de Chine, ce qui a causé de graves revers à la défense du reste de la Chine."
 KMT_Civilwar.9.a:0 "Une Situation très désastreuse."

 KMT_Civilwar.10.t:0 "Yan Xishan propose une médiation"
 KMT_Civilwar.10.d:0 "Yan Xishan, gouverneur du Shanxi et actuel Premier ministre, a une fois de plus proposé d'aider à diriger les négociations entre Chiang Kai-shek et Li Zongren pour l'unité du gouvernement central et de la nouvelle clique du Guangxi. Il a affirmé qu'il était prêt à faire tout ce qui est en son pouvoir pour établir un gouvernement stable, car le sort de la République repose à la fois entre les mains de Chiang et de Li."
 KMT_Civilwar.10.a:0 "Sur mon cadavre."
 KMT_Civilwar.10.b:0 "Envoyez-le négocier avec Li."

 KMT_Civilwar.11.t:0 "Réconciliation et compromis atteints"
 KMT_Civilwar.11.d:0 "L'offre de compromis de Yan Xishan avec Li a été globalement réussie, Yan a promis à Li des droits importants sur le trésor national et une protection gouvernementale pour la nouvelle clique du Guangxi. Li était réticent au début, mais a accepté l'offre de Yan, suite à une série de concessions aux proches collaborateurs de Li."
 KMT_Civilwar.11.a:0 "Ces termes sont scandaleux ! Il faut remettre Li à sa place."
 KMT_Civilwar.11.b:0 "Unis nous restons, divisés nous tombons."

 KMT_Civilwar.12.t:0 "Les négociations commencent à échouer"
 KMT_Civilwar.12.d:0 "Li a affirmé que les conditions de Yan étaient bien meilleures que les nôtres et qu'il n'était pas disposé à se contenter d'une coopération en raison des habitudes d'antagonisme de Chiang tout en ne laissant pas Li bénéficier de conditions égales et justes. Les chances de coopération entre le gouvernement central et la nouvelle clique du Guangxi semblent donc sombres."
 KMT_Civilwar.12.a:0 "Bien! Ce n'est pas comme si nous avions besoin de lui."

 KMT_Civilwar.13.t:0 "Li Zongren découvre une tentative de coup d'État."
 KMT_Civilwar.13.d:0 "Alors que Li Zongren découvrait le complot de coup d'État militaire que Chiang avait planifié, lui et ses loyalistes ont fui le continent vers Hong Kong. Avec sa disparition du continent, Chiang a repris la présidence et a reconsolidé le contrôle total sur le gouvernement, alors que l'ensemble des forces armées étaient de nouveau sous son commandement."
 KMT_Civilwar.13.a:0 "Au moins, ce bâtard est parti."

 KMT_Civilwar.14.t:0 "La situation à Shanghai"
 KMT_Civilwar.14.d:0 "Les forces communistes ont occupé Nanjing, l'ancienne capitale de la République de Chine et ont commencé à franchir le fleuve Yangtze à Suzhou, laissant la ville de Shanghai devenir la dernière grande ville de l'est de la Chine.\nLa situation à Shanghai ne semble pas viable et devrait être évacuée pour éviter de nouvelles pertes en victimes dans le processus. \n\n\"Si la défense de Shanghai échoue, elle doit être évacuée, brisée en morceaux et explosée en morceaux.\"\n\n-Chiang Kaï-chek"
 KMT_Civilwar.14.a:0 "Compris."

 KMT_Civilwar.15.t:0 "[GetNewspaperHeader]La deuxième bataille pour Nanjing"
 KMT_Civilwar.15.d:0 "Après la défense réussie de Shanghai et l'arrêt total des offensives communistes, les troupes nationalistes lancèrent une offensive depuis Shanghai vers l'ancienne capitale de la République, Nanjing. Une bataille brutale et intense a eu lieu pour le contrôle de la ville, les forces nationalistes ayant finalement percé les défenses de la ville, forçant les forces communistes à se retirer. Les observateurs étrangers affirment que la guerre a étonnamment tourné en faveur du Kuomintang, qui était au bord de l'effondrement après la percée communiste en Mandchourie lors de la campagne Liao-hsi en 1948. Néanmoins, il ne fait aucun doute que les forces nationalistes gagnent en élan grâce à la reconquête de leur ancienne capitale, ce qui constituerait pour elles une victoire majeure."
 KMT_Civilwar.15.a:0 "Une autre décennie à Nanjing ?"

 KMT_Civilwar.16.t:0 "[GetNewspaperHeader]Le Kuomintang avance sur Wuhan"
 KMT_Civilwar.16.d:0 "Alors que les forces nationalistes commençaient à contre-attaquer les communistes, elles furent rapidement repoussées dans la province du Hubei où la ville de Wuhan fut rapidement reconquise, permettant aux nationalistes d'envisager de poursuivre la traversée du fleuve Yangtze vers le nord. La bataille pour le lieu de naissance de la révolution Xinhai revêt une grande importance, étant donné que le gouvernement du Kuomintang et le gouvernement communiste prétendaient tous deux qu'il était le successeur légitime de la révolution de 1911. La ville de Wuhan tombant sous le contrôle du Kuomintang, il semble que l'esprit révolutionnaire des nationalistes soit toujours en eux. Du moins de l'extérieur."
 KMT_Civilwar.16.a:0 "Une tournure surprenante des événements."

 KMT_Civilwar.17.t:0 "[GetNewspaperHeader]Les troupes du Kuomintang reprennent Beiping"
 KMT_Civilwar.17.d:0 "Lors d'une invasion réussie de la capitale des communistes, les nationalistes ont triomphé des rouges, la guerre étant totalement en leur faveur et détériorant tout élan qu'ils avaient auparavant. La ville étant à nouveau sous le contrôle du Kuomintang, un portrait de Chiang fut de nouveau accroché sur la place Tiananmen, humiliant les communistes dans leur propre capitale. En raison de la nette défaite des forces communistes en Chine, les Soviétiques ont commencé à préparer une intervention dans la région pour imposer un cessez-le-feu difficile entre les deux parties afin d'assurer leur propre influence en Mandchourie, et ont déclaré qu'ils étaient prêts à faire tout ce qui était en leur pouvoir pour renforcer leur influence, même si cela signifiait une escalade totale de la guerre avec la République de Chine et les États-Unis."
 KMT_Civilwar.17.a:0 "Les communistes chinois sont à bout de souffle."

 KMT_Civilwar.18.t:0 "Retourner à Nanjing"
 KMT_Civilwar.18.d:0 "C'est incroyable ce que cette ville a dû traverser au cours des 30 dernières années. Lorsqu'il fut saisi pour la première fois aux seigneurs de guerre du Zhili du Sud lors de l'expédition du Nord en 1927, il fut établi comme quartier général du Kuomintang, qui connut une expansion industrielle et culturelle rapide au cours de la première décennie de Nanjing. Les horreurs qu'elle a dû endurer contre et sous les Japonais ne peuvent être formulées avec des mots, mais même après la capitulation du Japon, la lutte n'était toujours pas terminée. Conquise par les bandits communistes début avril 1949, elle fut finalement préparée à être intégrée à l'administration communiste. Cependant, notre réorganisation militaire a vu les communistes être repoussés sur la ligne de front, pour finalement se retirer à Nanjing. Après des combats acharnés et des jours de siège et d'endurance que seuls les vétérans de l'entrepôt de Sihang connaissaient, les lâches communistes ont fui la ville et le drapeau national de la République de Chine trône fièrement à côté du palais présidentiel.\n\nAvec le retour du gouvernement national à Nanjing, nous pouvons directement ordonner aux forces armées de marcher vers Beiping pour libérer le nord des communistes et rétablir l'ordre en Chine. Les années de persévérance ayant porté leurs fruits alors que nous étions au plus faible, nous pouvons désormais être sûrs que ce n'est qu'une question de temps avant que les communistes ne connaissent leur perte."
 KMT_Civilwar.18.a:0 "Poursuivez les bandits en retraite maintenant !"

 KMT_Civilwar.19.t:0 "La défection du Hunan"
 KMT_Civilwar.19.d:0 "Récemment, le gouverneur du Hunan, Cheng Qian, ainsi que ses subordonnés ont annoncé le transfert pacifique du Hunan aux côtés des forces communistes, rendant impossible la tenue du Hunan à l'écart des communistes. "
 KMT_Civilwar.19.a:0 "Traîtrise! Ordonnez l'arrestation de Cheng Qian !"

 KMT_Civilwar.20.t:0 "Soulèvement de Pengxian"
 KMT_Civilwar.20.d:0 "Avec le soulèvement de Pengxian, le gouverneur Liu Wenhui a changé d'allégeance aux communistes de Pékin à la suite de la campagne communiste du sud-ouest visant à envahir les provinces du Yunnan et du Sichuan."
 KMT_Civilwar.20.a:0 "Traîtres !"

 KMT_Civilwar.21.t:0 "Un soulèvement au Yunnan"
 KMT_Civilwar.21.d:0 "Le Yunnan, autrefois connu comme la forteresse démocratique de la Chine, a fait défection aux communistes. Le gouverneur Lu Han a fait un geste audacieux en annonçant la reddition de la province du Yunnan aux forces communistes. Nous devons réprimer cette vilaine rébellion avant que les forces communistes n'entrent dans le Yunnan."
 KMT_Civilwar.21.a:0 "Et maintenant ?"

 KMT_Civilwar.22.t:0 "Prise de pouvoir communiste au Xinjiang"
 KMT_Civilwar.22.d:0 "Alors que les forces communistes approchaient du Xinjiang, le gouverneur local Burhan Shadini, aux côtés des commandants et des troupes locales, ont commencé à faire défection vers les communistes, avec l'annonce de la « libération pacifique » du Xinjiang, renversant toute forme de forte résistance qui pourrait être fournie aux communistes après avoir atteint le Xinjiang. "
 KMT_Civilwar.22.a:0 "Scandaleux !"

 KMT_Civilwar.23.t:0 "[GetNewspaperHeader] Chute de Yenan"
 KMT_Civilwar.23.d:0 "La troisième chute de Yenan aux mains des nationalistes, à la suite d'une série de batailles intenses menées pour le contrôle de l'ancienne capitale de la base communiste et sa sécurisation, dévastant le moral des communistes pour les semaines suivantes, montrant que les communistes n'étaient pas aussi invincibles qu'ils le pensaient. La ville de Yenan qui a servi de capitale et de siège du Parti communiste chinois depuis 1935, avec la première prise de la ville par l'armée du Nord-Est de Zhang Xueliang lors de la campagne de répression des bandits du Nord-Ouest et la deuxième chute de la ville aux mains des forces nationalistes sous Hu Zongnan. Cette fois-ci cependant, les nationalistes envisagent de consolider leur contrôle sur la ville au lieu de l'abandonner à nouveau, non pas pour son emplacement stratégique mais pour sa capacité à épuiser la volonté des forces communistes."
 KMT_Civilwar.23.a:0 "La fin de l'héritage de la campagne d'encerclement ?"

 KMT_Civilwar.24.t:0 "La nouvelle clique du Guangxi revient à Liangguang"
 KMT_Civilwar.24.d:0 "Avec l'entrée des forces soviétiques en Mandchourie, la majorité de nos forces armées ont été envoyées dans la région pour se préparer à d'éventuelles escarmouches et conflits frontaliers, laissant d'importants vides de pouvoir à Liangguang. La clique du Guangxi a profité de l'absence des forces armées et a repris le pouvoir dans les régions du Guangxi. Tout en ne déclarant pas le régime de Nanjing illégitime, Li Zongren a annoncé que son poste de gouverneur maintiendrait la plus grande autonomie du Guangxi et s'opposerait aux efforts de centralisation du gouvernement nationaliste de Nanjing. En raison de l'épuisement de la guerre, des conditions économiques dévastatrices et de l'instabilité politique, nous ne sommes actuellement pas en mesure de nous débarrasser à nouveau de Li et de ses associés."
 KMT_Civilwar.24.a:0 "Nous les traiterons plus tard."

 KMT_Civilwar.25.t:0 "Sun Li-Jen termine l'entraînement de la 201e Division"
 KMT_Civilwar.25.d:0 "Le général Sun Li-Jen a passé les derniers jours de la guerre civile à entraîner des régiments de l'armée de la jeunesse chinoise pour former la 201e division à Taiwan, la division étant pour l'instant transférée sur l'île de Kinmen. Le général Sun a été initialement nommé comme l'un des commandants chargés de diriger la répression de la rébellion communiste en Mandchourie, réussissant à semer la peur au sein des forces et des commandants de l'APL alors qu'il menait des offensives réussies. Cependant, le désastre s'est produit lorsque le général Du Yuming a demandé au gouvernement central de le retirer du commandement des forces en Mandchourie tout en l'accusant d'insubordination, ce qui a conduit à la situation actuelle de guerre civile dans laquelle nous nous trouvons. Il est maintenant temps de voir Sun revenir sur la ligne de front et se racheter, en espérant inverser le cours de la guerre civile comme nous le souhaitions."
 KMT_Civilwar.25.a:0 "Bon retour Général Sun"

 KMT_Civilwar.26.t:0 "Ma Bufang fait appel à Guangzhou pour obtenir davantage de fournitures"
 KMT_Civilwar.26.d:0 "Alors que les forces communistes s'approchent du nord-ouest, Ma Bufang s'est rendu à Guangzhou pour demander davantage de fournitures pour la défense du nord-ouest contre les forces communistes supérieures, tandis que son fils Ma Jinyuan dirige actuellement la défense de la région. La région du Nord-Ouest est rude, ce qui rend presque impossible toute avancée des communistes s'ils décident d'entrer dans la région afin d'y imposer leur autorité ainsi qu'au Xinjiang. Alors que le gouverneur du Xinjiang, Burhan Shahidi, a été persuadé par son entourage de passer du côté communiste, notre seule option pour les en empêcher sera d'utiliser la clique Ma comme barrière pour empêcher les forces communistes d'entrer dans la région, ce qui fournira une résistance suffisamment ferme pour mettre un terme à leur avancée."
 KMT_Civilwar.26.a:0 "Larguez-lui les fournitures qu'il a demandées"
 KMT_Civilwar.26.b:0 "Dommage, nous n'en avons que pour le sud de la Chine !"

 KMT_Civilwar.27.t:0 "Les mesures de Li Zongren pour freiner l'inflation"
 KMT_Civilwar.27.d:0 "Les tensions avec Chiang étant enfin faibles, Chiang a donné à Li la permission d'utiliser les réserves d'or de Taiwan pour réparer l'économie grâce à l'utilisation provisoire de l'étalon-or dans diverses provinces sous le contrôle de la République ainsi qu'en réduisant les dépenses pour le paiement des salaires des postes inutiles. Ces mesures augmenteraient la popularité de Li Zongren aux yeux du peuple, mais permettraient en même temps de freiner partiellement l'hyperinflation pour renforcer un soutien mineur au Kuomintang."
 KMT_Civilwar.27.a:0 "Il ne échappera pas à notre contrôle."
 KMT_Civilwar.27.b:0 "Il faut lui attribuer tout le mérite des réformes !"

 KMT_Civilwar.28.t:0 "Stratégie de défense sur le continent"
 KMT_Civilwar.28.d:0 "Alors que le Kuomintang a finalement accepté de conserver le continent plutôt que de tout retirer à Taiwan, la question reste de savoir si l'armée devrait ou non se retirer vers des endroits stratégiques autour de la Chine où il serait beaucoup plus facile de fatiguer les avancées ennemies. Li Zongren envisage de déplacer sa propre armée vers le sud de la Chine, principalement dans les provinces du Guangxi et du Guangdong, pour résister aux communistes. Chiang Kai-Shek, quant à lui, a prévu de tenir bon dans le sud-ouest de la Chine, principalement dans le Sichuan où elle fut la capitale de la Guerre de Résistance avec sa propre armée. Nous devons analyser soigneusement nos stratégies et nos conditions, puis décider où concentrer la défense de notre armée."
 KMT_Civilwar.28.a:0 "Le plan de Chiang, concentrer les défenses au sud-ouest"
 KMT_Civilwar.28.b:0 "Le plan de Li, concentrer les défenses sur le Sud"
 KMT_Civilwar.28.c:0 "Nos défenses actuelles sont assez bonnes."

 KMT_Civilwar.29.t:0 "Le traitement de Li Zongren pour la maladie chronique du duodénum ?"
 KMT_Civilwar.29.d:0 "On sait que le président Li Zongren souffre d'une maladie chronique du duodénum et envisage de s'envoler pour les États-Unis et d'être soigné à la célèbre université de Columbia. Même si cette décision pourrait nuire au moral de nombreux soldats, le fait de ne pas le traiter pourrait aggraver la maladie et causer des dommages irréversibles à la santé de Li, mettant sa vie en jeu."
 KMT_Civilwar.29.a:0 "Sa santé est « importante », il devrait se faire soigner."
 
 KMT_Civilwar.41.t:0 "Le traitement de Li Zongren pour la maladie chronique du duodénum ?"
 KMT_Civilwar.41.d:0 "On sait que le président Li Zongren souffre d'une maladie chronique du duodénum et envisage de s'envoler pour les États-Unis et d'être soigné à la célèbre université de Columbia. Cependant, craignant que cette décision ne dégrade le moral de nombreux soldats, Li Zongren a affirmé que l'unité inconditionnelle et un leadership compétent doivent être garantis pour que la République puisse l'emporter. Il s'agit véritablement d'un geste noble, qui pourrait cependant accroître sa popularité au sein du Kuomintang si nous sortions victorieux de la guerre civile."
 KMT_Civilwar.41.a:0 "Ensemble pour la Victoire ! (Il a dit le truc !)"

 KMT_Civilwar.30.t:0 "Complot du soulèvement de Changsha"
 KMT_Civilwar.30.d:0 "Par chance, notre nouveau Bureau de la sécurité nationale a acquis des renseignements sur la tentative du gouverneur du Hunan (Cheng Qian) de passer du côté des communistes. Nous ne pouvons certainement pas leur permettre de conserver le gouvernement du Hunan plus longtemps, il sera plutôt accueilli « chaleureusement » dans la capitale avec Chiang Kai-Shek et « prendra le thé » avec lui."
 KMT_Civilwar.30.a:0 "Invitez Cheng et ses subordonnés à Guangzhou !"

 KMT_Civilwar.31.t:0 "Arrestation de Cheng Qian et de ses subordonnés"
 KMT_Civilwar.31.d:0 "Peu de temps après leur arrivée, Cheng et ses subordonnés ont été immédiatement appréhendés et accusés de trahison contre l'État en utilisant des informations acquises par le Bureau de la sécurité nationale du Kuomintang. Au même moment, Zhao Hengti a été nommé nouveau gouverneur du Hunan et s'est rendu dans la région pour diriger la défense de la province."
 KMT_Civilwar.31.a:0 "Plus de revers."
 KMT_Civilwar.31.b:0 "Le Hunan nous incombera toujours !"

 KMT_Civilwar.32.t:0 "Début de la campagne Chang-heng"
 KMT_Civilwar.32.d:0 "Peu de temps après l'échec du soulèvement de Changsha mené par Cheng Qian et d'autres officiers, le Parti communiste a lancé la campagne Chang-heng dans l'espoir de placer le Hunan sous son autorité et de mettre rapidement fin à la guerre civile chinoise. On ne sait toujours pas quelle est la position du Kuomintang concernant la défense du Hunan, s'il prendrait la position de tenir la province ou s'il l'utiliserait pour préparer une défense concentrée autour de Liangguang et du Sichuan."
 KMT_Civilwar.32.a:0 "Apportez-le!"
 KMT_Civilwar.32.b:0 "Libérez le Hunan des bandits blancs !"

 KMT_Civilwar.33.t:0 "Conférence militaire d'urgence"
 KMT_Civilwar.33.d:0 "Alors que la situation de guerre devenait désastreuse, Chiang Kai-Shek a rappelé des officiers de haut rang et loyaux dans toute la Chine pour retourner dans la capitale et discuter d'une nouvelle approche contre l'avancée des armées communistes. À leur retour, ces agents ont été accueillis avec beaucoup d'impatience, espérant qu'une solution rapide puisse être trouvée à nos problèmes actuels. Les principaux problèmes sont des problèmes logistiques, des soldats déloyaux ainsi que des troubles persistants dans les campagnes. La survie de la République est en jeu. Seules l'unité et l'endurance peuvent apporter la victoire."
 KMT_Civilwar.33.a:0 "Tout le monde parvient à arriver à la conférence."

 KMT_Civilwar.34.t:0 "Deuxième gouvernement de coalition"
 KMT_Civilwar.34.d:0 "Grâce aux efforts de la République de Chine pour ramener le Turkestan oriental au bercail, grâce à des renégociations et des offres de concessions, elle a réussi à obtenir son soutien dans la formation du deuxième gouvernement de coalition. Bien que pour l'instant on leur ait promis autonomie et liberté, cela pourrait changer si la République de Chine sortait victorieuse de la guerre civile."
 KMT_Civilwar.34.a:0 "Une province de plus de retour au bercail."
 KMT_Civilwar.34.b:0 "Malheureusement..."

 KMT_Civilwar.35.t:0 "[GetNewspaperHeader]La chute de Canton"
 KMT_Civilwar.35.d:0 "Les défenses de la ville ont commencé à s'effondrer lorsque l'Armée populaire de libération a lancé un assaut coordonné contre la ville après la chute de la province du Hunan. L'APL a employé une stratégie d'encerclement et a ciblé les défenses du KMT avec des assauts d'artillerie et d'infanterie. Les troupes du KMT, en infériorité numérique et confrontées à des problèmes logistiques, se sont rapidement effondrées sous la pression. Les forces sous le gouvernement nationaliste se dispersent maintenant et fuient vers l'ouest et le sud, tentant de s'échapper ultimement du continent afin d'éviter de vivre sous la nouvelle bannière communiste, alors que la guerre civile touche à sa fin."
 KMT_Civilwar.35.a:0 "C'est fini pour le Kuomintang."

 KMT_Civilwar.36.t:0 "[GetNewspaperHeader]La chute de Chongqing"
 KMT_Civilwar.36.d:0 "Avec la campagne de Chongqing engagée par l'APL pour écraser la résistance militaire restante de la NRA dans la province du Sichuan, capturant l'ancienne capitale de guerre de Chongqing. Les nationalistes ont perdu l'un de leurs derniers grands centres urbains sur le continent. Chiang Kai-shek et les forces nationalistes restantes ont déjà ordonné d'évacuer vers Chengdu, qui est confrontée à la vulnérabilité à la fois de l'arrivée des troupes de l'APL et des seigneurs de guerre rebelles du Sichuan. La chute de Chongqing a jusqu'à présent marqué la victoire quasi totale des communistes dans la guerre civile chinoise, l'effondrement de l'autorité du Kuomintang sur le continent étant inévitable."
 KMT_Civilwar.36.a:0 "Ce n'est plus qu'une question de temps maintenant..."
 
 KMT_Civilwar.37.t:0 "Le dernier jour sur le continent ?"
 KMT_Civilwar.37.d:0 "Il était 23 heures. Lorsque Chiang Kai-shek, Chiang Ching-kuo, Tao Xisheng, Gu Zhenggang, Yu Jishi et le parti ont dit au revoir au chef d'état-major Gu Zhutong qui devait rester sur place et continuer à diriger la résistance après avoir chanté l'hymne national de la République de Chine. Chiang Kai-shek est ensuite monté dans une voiture, escortée par des véhicules blindés et des chars pour assurer sa sécurité totale, et a quitté la porte principale de l'Académie militaire centrale. Sous l'escorte d'un détachement entièrement armé du 23e corps de l'Académie militaire, il s'est rendu directement dans la nuit à l'aéroport de Xinjin, où c'est là que Chiang Kai-shek est monté à bord de l'avion à destination de Taiwan. Cela pourrait aussi être son tout dernier moment sur le continent."
 KMT_Civilwar.37.a:0 "Au moins, nous sommes désormais à l'abri des communistes..."

 KMT_Civilwar.38.t:0 "Défections au sein de l'armée"
 KMT_Civilwar.38.d:0 "Alors que l'APL progresse davantage dans le centre et le sud de la Chine, divers bataillons perdent le moral et décident de faire défection de l'armée républicaine, livrant des villes entières aux communistes sans se battre. Si nous ne renversons pas rapidement le cours de la guerre, ces défections entraîneront notre chute."
 KMT_Civilwar.38.a:0 "Traîtres !"
 
 KMT_Civilwar.39.t:0 "La question des prisonniers de guerre"
 KMT_Civilwar.39.d:0 "Au cours de notre avancée sur le territoire du Kuomintang, nos glorieuses victoires ont non seulement libéré les travailleurs chinois de la bourgeoisie, mais ont également abouti à la capture de plusieurs généraux clés de l'armée républicaine, dont Du Yuming, Fan Hanjie, Huang Wei, Wang Yaowu, Chen Changjie, Shen Zui, Song Xilian et Liao Yaoxiang.\n\nAlors que les forces du Kuomintang s'approchent rapidement de nos fortifications et reconquièrent les villes à un rythme alarmant, la direction du parti commence à remettre en question les capacités de l'Armée populaire de libération et élabore des plans pour une retraite à grande échelle vers les régions de Mandchourie. Des ordres ont été émis pour relocaliser les généraux capturés à Pékin afin d'éviter qu'ils ne soient repris par le Kuomintang."
 KMT_Civilwar.39.a:0 "Vous n'allez nulle part."
 
 KMT_Civilwar.40.t:0 "Le statut de nos généraux capturés"
 KMT_Civilwar.40.d:0 "Durant l'avancée communiste sur notre territoire, nombre de nos courageux généraux, qui risquèrent leur vie pour défendre la République contre les menaces japonaises et communistes, furent capturés par l'Armée populaire de libération. Ces généraux incluent Du Yuming, Fan Hanjie, Huang Wei, Wang Yaowu, Chen Changjie, Shen Zui, Song Xilian et Liao Yaoxiang.\n\nDes espions de Pékin nous ont informés qu'en raison de l'avancée rapide de nos forces, le Parti communiste élabore des plans pour une retraite à grande échelle vers les régions de Mandchourie. Des ordres ont été donnés pour déplacer ces généraux capturés à Pékin afin de les empêcher d'inciter à une révolte à la suite de notre victoire imminente. Même si nous ne savons pas encore comment l'Union soviétique réagira à ces récents développements, il est de notre devoir de sauver ceux qui se sont battus pour préserver la Chine de la tyrannie."
 KMT_Civilwar.40.a:0 "Nous allons redoubler d'efforts !"
 
 KMT_Civilwar.412.t:0 "Un télégramme de Yan Xishan"
 KMT_Civilwar.412.d:0 "Hier, tôt le matin, nos armées du Nord dirigées par Yan Xishan ont poussé plus loin dans le Shanxi, la province natale de Yan. Au début de la guerre civile après la Seconde Guerre mondiale, Yan a dû prendre la décision difficile d'abandonner sa maison bien-aimée face à l'assaut des bandits communistes, le laissant émotionnellement vide et le poussant même à se suicider au lieu de céder sa province aux bandits de Mao.\n\nPersonne n'aurait pu deviner que nous nous retrouverions aux portes de Taiyuan. Malgré tout ce que Yan a enduré, perdant ses camarades, ses amis et sa maison, il n'a jamais abandonné et a fait tout ce qui était en son pouvoir pour stabiliser notre gouvernement et réorganiser divers soldats courageux qui combattent désormais avec une grande passion dans les maisons de Taiyuan. Ses talents de médiateur entre le généralissime Chiang et Li Zongren, bien que pas toujours couronnés de succès, ont apporté une certaine unité au sein du Kuomintang pendant certaines périodes. Même lorsque les choses étaient au plus bas, Yan n'a pas abandonné.\n\nAujourd'hui, le généralissime Chiang et son état-major ont reçu un télégramme chaleureux de Yan, remerciant Chiang et ses associés que Taiyuan ne restera pas sous la tyrannie communiste mais continuera à prospérer sous la pensée Yan Xishan."
 KMT_Civilwar.412.a:0 "Le brave Soldier Boy rentre chez lui."
 
 KMT_Civilwar.411.t:0 "L'endurance du Sichuan"
 KMT_Civilwar.411.d:0 "Alors que la guerre a été considérée comme une cause perdue par divers généraux et désormais transfuges, les Forces républicaines ont démontré que la lutte pour la Chine n'était pas encore tranchée. Les bandits communistes ont tenté de s'emparer du col de Jianmen comme porte d'entrée pour de nouvelles avancées vers le Sichuan sous la direction de Liu Bocheng, Deng Xiaoping et He Long du 540e régiment de l'APL. Long a suggéré qu'une marche sournoise intensive à travers les chaînes de montagnes apporterait une victoire rapide et décisive, combattant dans l'obscurité et nous prenant au dépourvu. Cependant, aux petites heures du matin, la 55e Division dirigée par l'un de nos meilleurs et plus fidèles généraux, Hu Zongnan, s'était attendue à cette manoeuvre et a déplacé ses forces pour décimer l'ennemi sans méfiance, faisant des centaines de prisonniers et forçant le reste des unités du général Long à se retirer au-dessus de la rivière Jialing avant de pouvoir s'engager dans leur opération visant à traverser le ravin et à nous submerger en nombre.\n\nCela ne nous a peut-être pas gagné la guerre, mais cela nous a acheté quelque chose de plus précieux."
 KMT_Civilwar.411.a:0 "Temps."
 
 KMT_Civilwar.42.t:0 "La chute du Sichuan"
 KMT_Civilwar.42.d:0 "Malgré de nombreuses divisions et des efforts courageux pour défendre la capitale provisoire de Chongqing, la force écrasante des bandits communistes nous a contraints à endurer une retraite tactique vers le sud de la Chine. Le général Hu Zongnan, l'un de nos généraux les plus fidèles, a montré beaucoup de regret et de désespoir en réponse à l'avancée de l'APL dans le Sichuan, mais le généralissime Chiang Kai-shek a réaffirmé qu'il devait se recentrer et rassembler son courage pour inverser le cours de la guerre. Alors que le 540e régiment du Parti communiste est en train d'établir son contrôle sur le Sichuan, la bataille pour la Chine est loin d'être terminée. Nous regrouperons nos forces et nous préparerons à une énorme contre-offensive qui cherchera à libérer le Sichuan des bandits communistes !"
 KMT_Civilwar.42.a:0 "Nous reviendrons. Avec des armes."

 KMT_Civilwar.43.t:0 "La disparition du Nord-Ouest"
 KMT_Civilwar.43.d:0 "La Clique Ma s'est battue courageusement et a tout donné pour empêcher les forces communistes d'entrer dans le Gansu. Alors qu'il était initialement prévu de défendre Lanzhou, la plus grande ville du Nord-Ouest, avec l'aide d'unités du Shaanxi et du Gansu, les communistes de Peng Dehuai ont malheureusement vaincu les forces d'élite de Ma Jiyuan et se sont emparés de la ville, ouvrant la voie à l'APL vers le Xinjiang. Après un premier assaut raté, Peng a lancé une offensive coordonnée à grande échelle axée sur les assauts d'artillerie lourde et d'infanterie sur les hauteurs fortifiées au sud de la ville. Après des jours de combats rapprochés et brutaux, les bandits ont franchi le périmètre extérieur, capturé le seul pont sur le fleuve Jaune et coupé notre principale ligne de retraite. Le noyau militaire de la Clique Ma est désormais brisé, aux côtés du pouvoir militaire nationaliste dans le nord-ouest."
 KMT_Civilwar.43.a:0 "C'est un désastre !"

 KMT_Civilwar.44.t:0 "Le triomphe de Ma"
 KMT_Civilwar.44.d:0 "La Clique Ma a combattu avec un zèle inébranlable et a empêché les forces communistes de pénétrer plus profondément dans le Gansu. En défendant Lanzhou, notre principal quartier général dans le nord-ouest, les divisions d'élite de Ma Jiyuan, assistées par des renforts coordonnés du Shaanxi et du Gansu, ont réussi à maintenir la ligne contre les armées rebelles dirigées par Peng Dehuai, sécurisant ainsi la porte d'entrée vers le Xinjiang et les provinces occidentales.\n\nAprès l'échec des premiers assauts de Peng, les bandits communistes ont lancé une offensive imprudente à grande échelle, déployant des tirs d'artillerie massifs pour prendre d'assaut nos fortifications au sud de la ville. Cependant, lors des combats rapprochés à travers le mont Gaolan, nos forces ont tenu le haut du terrain et ont infligé des pertes massives aux forces qui avançaient. Les passages cruciaux du fleuve Jaune restent sous notre contrôle pour l'instant, et l'élan de l'ennemi a été brisé."
 KMT_Civilwar.44.a:0 "Une victoire vraiment décisive pour Ma !"

 KMT_Civilwar.45.t:0 "La chute du Sud"
 KMT_Civilwar.45.d:0 "Le général Bai Chongxi et nos armées du Sud se sont battus désespérément pour maintenir la ligne et empêcher les forces communistes de prendre Liangguang. Alors qu'il était prévu de transformer le Guangdong et le Guangxi en une forteresse impénétrable du sud et de préserver l'accès aux ports du sud, les forces communistes dirigées par Lin Biao et Chen Geng ont débordé nos positions et se sont emparées de Canton et de Nanning, coupant ainsi toutes les voies de retraite organisée vers Hainan.\n\nÀ la suite d'un assaut sur plusieurs fronts à travers les cols de Nanling, les bandits ont exécuté un encerclement impitoyable, coupant nos couloirs d'approvisionnement vers le golfe du Tonkin et piégeant nos principaux groupements tactiques autour de Bobai. Après des semaines de combats intenses et acharnés, les 7e et 48e armées d'élite furent submergées et brisées. Les restes de nos forces se sont soit dispersés à travers la frontière vers l'Indochine, soit évacués dans le désarroi. Notre flanc sud est entièrement brisé, laissant le continent ouvert à l'asservissement total des communistes."
 KMT_Civilwar.45.a:0 "C'est tellement fini."

 KMT_Civilwar.46.t:0 "Le miracle des deux gangs"
 KMT_Civilwar.46.d:0 "Le général Bai Chongxi et nos armées combinées du Sud ont combattu avec habileté et passion, repoussant de manière décisive l'invasion communiste de Liangguang. Debout sur les passages du Hunan, du Guangdong et sur le terrain accidenté du Guangxi, nos forces ont tenu Canton et Nanning, préservant notre redoute sud et gardant les couloirs côtiers vitaux vers Hainan et Taiwan.\n\nAnticipant la tentative de double opération de Lin Biao à travers les monts Nanling, nos 7e et 48e armées d'élite ont fortifié les points d'étranglement et ont entraîné les forces communistes débordées dans une série de contre-embuscades coordonnées. Au cours de semaines de combats acharnés dans les vallées du sud, nos divisions ont brisé l'élan de la Quatrième Armée de campagne, coupant les lignes de ravitaillement avancées de l'ennemi et infligeant des pertes dévastatrices à leurs unités avancées. Les ports le long de la côte sud restent entre nos mains, et les bandits ont été contraints à une retraite coûteuse vers le nord."
 KMT_Civilwar.46.a:0 "Ne plaisantez pas avec le Guangxi !" 
 
 KMT_Civilwar.47.t:0 "Évacuation réussie de Shanghai"
 KMT_Civilwar.47.d:0 "Alors que les forces communistes se rapprochaient du centre commercial du pays, le commandement de la garnison de Shanghai était confronté à une course contre la montre féroce. Chargées d'exécuter un retrait de combat sous le bombardement continu de l'ennemi, nos batteries de défense côtière et nos divisions d'arrière-garde le long des fortifications de Suzhou Creek et de Wusong ont tenu le périmètre contre toute attente, faisant gagner du temps à la flotte d'évacuation.\n\nLes équipements industriels vitaux et les réserves nationales d'or et de devises étrangères stockées à la Banque de Chine ont été embarqués en toute sécurité depuis les quais du Bund et de Wusong. Alors même que l'artillerie communiste commençait à se concentrer sur le port, les derniers éléments de l'arrière-garde se retirèrent en bon ordre sous le barrage protecteur des canons navals.\n\nBien que Shanghai elle-même soit tombée aux mains de l'ennemi, notre force de combat reste entièrement intacte. Les divisions épargnées et les richesses nationales inestimables sont arrivées en toute sécurité dans le sud et à Taiwan, fournissant la main-d'oeuvre et le capital essentiels nécessaires pour soutenir le combat de la République."
 KMT_Civilwar.47.a:0 "Nous avons évité un plus grand désastre."
 
 KMT_Civilwar.48.t:0 "Le désastre de Shanghai"
 KMT_Civilwar.48.d:0 "La défense et l'évacuation prévue de Shanghai se sont effondrées dans un désastre au-delà de toute imagination. Ce qui était prévu comme une retraite progressive et ordonnée vers les installations portuaires de Wusong s'est rapidement désintégré sous le poids écrasant des percées soudaines de la Troisième Armée de Campagne communiste le long des districts urbains.\n\nLes colonnes en retraite encombraient les rues étroites de la ville, se retrouvant désespérément mêlées aux centaines de milliers de réfugiés civils en fuite. Les troupes de choc communistes et les cellules partisanes infiltrées se sont emparées des ponts clés sur la crique de Suzhou, coupant ainsi des quais des milliers de nos divisions de l'armée centrale les mieux équipées. Des navires de transport ont été saisis ou incendiés par l'artillerie ennemie, laissant des milliers de soldats et des stocks abandonnés sur les berges du fleuve."
 KMT_Civilwar.48.a:0 "Comment a-t-on pu en arriver là ?"

 KMT_Civilwar.49.t:0 "Wellington Koo s'exprime au Congrès"
 KMT_Civilwar.49.d:0 "L'intensité de la guerre civile chinoise a atteint des niveaux qu'on ne pouvait imaginer il y a quelques années seulement. L'ambassadeur chinois V. K. Wellington Koo a prononcé un discours au Congrès sur l'état actuel de la guerre civile, expliquant qu'il ne s'agit pas d'un conflit de gouvernements rivaux luttant pour le pouvoir politique, mais plutôt d'une bataille idéologique plus vaste qui déterminerait l'avenir non seulement de la Chine mais de toute l'Asie de l'Est. Il a exhorté le Congrès à mettre de côté ses divergences et à accorder davantage d'aide à la République de Chine afin que le mouvement communiste ne s'étende pas davantage à toute l'Asie. Le lobby chinois a exprimé son soutien, mais le président [USA.GetLeader] reste sceptique quant à une intervention intensive en Chine, craignant un conflit plus grave avec l'Union soviétique en Asie."
 KMT_Civilwar.49.a:0 "Si la Chine tombe, ce sera de votre faute !"
 KMT_Civilwar.49.b:0 "Une situation difficile."
 
 KMT_Civilwar.50.t:0 "Consultation avec la Ma Clique."
 KMT_Civilwar.50.d:0 "Alors que la menace communiste pèse lourdement sur le Nord-Ouest, le général Ma Bufang et les commandants du Nord-Ouest ont proposé de subordonner leur cavalerie vétéran et leurs divisions régionales au Conseil militaire national. Cependant, Ma insiste sur le fait que la gouvernance civile du Gansu, du Qinghai et du Ningxia reste exclusivement entre les mains des autorités locales, exigeant une autonomie totale en matière de nominations provinciales, de collecte des impôts et d'affaires religieuses, sans les inspecteurs de Nanjing. Chiang Kai-shek doit décider si le besoin d'une cavalerie d'élite du nord-ouest en vaut la peine."
 KMT_Civilwar.50.a:0 "Nous avons un accord."
 KMT_Civilwar.50.b:0 "Oubliez ça."
 
 KMT_Civilwar.51.t:0 "Entretiens avec la clique du Yunnan et du Xikang."
 KMT_Civilwar.51.d:0 "Alors que la guerre civile fait rage, des envoyés du Yunnan et du Sichuan sont arrivés dans la capitale pour discuter de la coordination sur la ligne de front. Les seigneurs de guerre du sud-ouest sont prêts à envoyer leurs armées sous le commandement suprême de l'armée centrale, mais seulement si Nanjing assure la protection statutaire de leurs monopoles régionaux, l'exclusion des officiers de Central Whampoa des administrations civiles locales et garantit le contrôle provincial sur les garnisons de défense régionales. La cession accorde au gouvernement national d'importantes réserves de main-d'oeuvre pour le front, mais elle laisse les riches régions du sud-ouest en dehors de l'administration centrale."
 KMT_Civilwar.51.a:0 "Cela semble acceptable."
 KMT_Civilwar.51.b:0 "Scandaleux !"
  
 KMT_Civilwar.52.t:0 "Les inquiétudes de Yan Xishan."
 KMT_Civilwar.52.d:0 "Conscient de la menace existentielle posée par les communistes, Yan Xishan a proposé d'intégrer les forces de défense du Shanxi dans l'effort de guerre central. En échange, le « gouverneur modèle » exige que Nanjing garantisse formellement l'autonomie globale du Shanxi. Ses conditions prévoient que tous les bureaux provinciaux restent composés exclusivement de ses cadres, que le trésor central subventionne ses industries locales sans exercer de contrôle fiscal et qu'aucun organe politique ou policier central n'opère dans la province. L'acceptation garantit la loyauté du Shanxi et la robuste infanterie du Nord, mais elle codifie effectivement le royaume privé de Yan par la loi."
 KMT_Civilwar.52.de:0 "Alors que Chiang Kai-shek a tenté de contacter Yan Xishan pour discuter d'une intégration plus poussée de ses forces dans la structure centrale, Yan a considéré les exigences du gouvernement central comme un prétexte flagrant pour démanteler ses quatre décennies de règne. Yan a rappelé au généralissime son refus de travailler aux côtés de Li Zongren contre les communistes, arguant que la situation n'a dégénéré jusqu'à présent qu'en raison de sa propre cupidité. Même s'il n'a pas l'intention de faire défection ou de trahir Chiang, Yan n'est pas désireux de céder le pouvoir à l'homme qui aurait pu vendre la Chine."
 KMT_Civilwar.52.a:0 "Puisse la province modèle devenir un modèle pour toute la Chine."
 KMT_Civilwar.52.b:0 "Peut-être aurions-nous dû accepter son offre plus tôt."
 
 KMT_Civilwar.53.t:0 "Sabotage mandchou."
 KMT_Civilwar.53.d:0 "Avec l'aide de la CIA et quelques manoeuvres sournoises, le gouvernement du Kuomintang a réussi à contacter divers rebelles nationalistes en Mandchourie et dans la région du Grand Pékin. Les rapports suggèrent que diverses usines ont été gravement endommagées et que les chemins de fer menant aux lignes de front ont été intensivement sabotés."
 KMT_Civilwar.53.a:0 "Bien."
 KMT_Civilwar.53.b:0 "Des salopards !"
 
 KMT_Civilwar.54.t:0 "S'emparer des coffres de Shanghai" 
 KMT_Civilwar.54.d:0 "Face aux caisses vides de l'État et à une inflation galopante, le gouvernement national a pris des mesures extrêmes. La police militaire et les agents gouvernementaux ont encerclé le célèbre Bund de Shanghai, pénétrant dans les banques centrales et les coffres-forts privés pour saisir tout l'or, l'argent et les devises étrangères restants.\n\nLes banquiers et les magnats des affaires de la ville sont furieux, qualifiant cette décision de vol pur et simple, qui détruit la confiance dans l'économie. Cependant, l'opération a permis d'obtenir des millions en espèces sonnantes et trébuchantes pour le gouvernement. L'élite des affaires a perdu ses richesses, mais la machine de guerre nationaliste dispose désormais des fonds d'urgence dont elle a désespérément besoin pour continuer à se battre."
 KMT_Civilwar.54.a:0 "Argent."
  
 
 KMT_Hainan.1.t:0 "[GetNewspaperHeader] PLA avance sur Hainan"
 KMT_Hainan.1.d:0 "Suite à l'évacuation de la Chine continentale, le Kuomintang a transféré la majorité de ses forces sur l'île de Taiwan, se préparant aux futures attaques de l'Armée populaire de libération. L'île de Hainan est restée sous la domination du Kuomintang pour le moment, jusqu'à ce que des vagues de navires de l'APL soient récemment repérées sur la côte nord de l'île. Les restes français de Guangzhouwan ont signalé une grande invasion amphibie se dirigeant directement vers la côte, dans le but de reprendre l'île au Kuomintang et d'anéantir tout espoir de résistance contre le régime nouvellement établi à Pékin. Il n'est pas certain que les forces du Kuomintang puissent annuler l'attaque ou soient contraintes d'évacuer vers Taipei. Le ministère des Affaires étrangères de la République de Chine a refusé de publier une déclaration concernant l'invasion, affirmant qu'il s'agissait d'une « affaire interne »."
 KMT_Hainan.1.a:0 "La guerre civile continue."
 KMT_Hainan.1.b:0 "Venez nous chercher !"
 KMT_Hainan.1.c:0 "Nous libérerons l'île !"
 
 KMT_Hainan.2.t:0 "[GetNewspaperHeader] L'Armée populaire de libération s'empare de Hainan"
 KMT_Hainan.2.d:0 "Après d'intenses combats sur l'île de Hainan, les forces communistes de l'Armée populaire de libération ont marché sur Haikou, déclarant la victoire sur les forces locales du Kuomintang. Le conflit dévastateur entre les troupes restantes du Kuomintang et l'Alliance communiste des soldats de l'APL et des communistes locaux a semé un plus grand désespoir dans les Forces républicaines, qui se sont étendues en Birmanie, au Sud-Vietnam et à Taipei. La République populaire de Chine nouvellement fondée a déclaré sa victoire et a exprimé son désir de libérer le reste des territoires contrôlés par le Kuomintang. Les observateurs ont noté que les défenses de Taiwan s'avèrent plutôt fortifiées, ce qui rend une attaque sur l'île beaucoup plus difficile à envahir que sur Hainan."
 KMT_Hainan.2.a:0 "Taïwan sera-t-il le prochain ?"
 KMT_Hainan.2.b:0 "Bon sang !"
 KMT_Hainan.2.c:0 "Une grande victoire."

 KMT_Hainan.3.t:0 "[GetNewspaperHeader] La défense du Kuomintang sur Hainan"
 KMT_Hainan.3.d:0 "Après d'intenses combats sur l'île de Hainan, les forces communistes de l'Armée populaire de libération ont été encerclées par les unités locales du Kuomintang, qui ont finalement déclaré leur victoire totale sur les communistes, renforçant ainsi leur contrôle sur Hainan. Le ministère des Affaires étrangères de la République de Chine a publié une déclaration qualifiant la défense de \"immense succès pour la reconquête du continent chinois\". Pékin n'a donné aucune information officielle à ce sujet, mais il s'agit probablement d'un embarras mineur pour les dirigeants communistes, compte tenu de leur emprise totale sur la Chine continentale. Cependant, cela indiquera très probablement clairement que l'île de Taiwan ne fera l'objet d'aucune attaque future, pas avant que Hainan n'ait été conquise par les communistes."
 KMT_Hainan.3.a:0 "Une surprise."
 KMT_Hainan.3.b:0 "La Chine libre perdure !"
 KMT_Hainan.3.c:0 "Nous reviendrons."
 
 bss.221.t:0 "La République de Chine à Taiwan"
 bss.221.d:0 "Avec nos soldats vaincus sur le champ de bataille, nos approvisionnements détruits et notre moral au plus bas, les bandits communistes ont pris le contrôle du continent chinois et vont maintenant commencer leur règne totalitaire brutal sur la Chine. Cependant, ce n'est pas le moment de perdre espoir ! La Chine libre perdure, sur l'île de Taiwan. Nous allons nous réarmer et nous réorganiser, puis nous retournerons finalement sur le continent et libérerons le peuple chinois de l'oppression !\n\nDivers rapports suggèrent également que le général Li Kuo-hui et son bataillon se sont retirés dans les régions frontalières de l'ancienne Birmanie britannique et envisagent de lancer une attaque de libération dans le Yunnan. Nous devons le soutenir si nous voulons un jour reprendre le continent !"
 bss.221.a:0 "Un jour, nous reviendrons."
 bss.221.b:0 "Ce combat n'est pas terminé ! (Incarnez YANSA)"

 bss.222.t:0 "[GetNewspaperHeader]Résolution 505 de l'ONU"
 bss.222.d:0 "Aujourd'hui à New York, au nom des représentants de la République de Chine, l'Assemblée générale des Nations Unies a adopté la résolution 505, condamnant officiellement la violation par l'Union soviétique du Traité d'amitié sino-soviétique de 1945. La République de Chine accuse l'Union soviétique de rompre le traité en soutenant le Parti communiste chinois opposé et en l'encourageant à renverser le gouvernement nationaliste de la République de Chine. En outre, les représentants du gouvernement de [CHI.GetLeader] ont affirmé que les forces armées de la République de Chine avaient besoin de l'aide des pays occidentaux pour vaincre l'insurrection communiste en Chine, via des livraisons d'armes et des conseillers. On ne sait pas exactement comment les États-Unis et leurs alliés géreront la situation, mais cela montre clairement que le Kuomintang pourrait ne pas être en mesure de conserver le continent chinois."
 bss.222.a:0 "Un coup dur pour les relations soviéto-chinoises."

 bss.227.t:0 "Défections massives dans les forces armées"
 bss.227.d:0 "À mesure que l'APL progresse dans le centre et le sud de la Chine, de plus en plus de généraux, de gouverneurs et d'amiraux abandonnent leurs forces aux communistes sans même se battre. Des informations nous sont parvenues selon lesquelles le général Liu Wenhui du Sichuan et le général Cheng Qian du Hunan se seraient rendus pacifiquement à l'avancée de l'APL de Mao Zedong. Ajouté à cela, divers amiraux et autres politiciens tels que Ma Hongbin, Ma Dunjing, Li Jishen et Chen Shaokuan ont cédé aux promesses communistes et ont également fait défection vers l'APL, nous privant d'importants équipements militaires. Une fois de retour sur le continent, ils paieront pour leur trahison contre la république !\n\nEn plus de cette trahison, divers généraux courageux qui ont refusé de se rendre aux communistes sont morts d'une mort tragique sur le champ de bataille, soit en étant capturés par l'APL, soit en étant directement assassinés de sang-froid. Leurs sacrifices ne seront pas oubliés et chacun d'entre eux sera vengé !"
 bss.227.a:0 "Traîtres !"

 bss.228.t:0 "Le groupe blanc"
 bss.228.d:0 "D'anciens officiers japonais ayant participé à la Seconde Guerre mondiale furent nommés conseillers militaires de Chiang pendant la guerre civile chinoise, qui fit rage à partir de 1946. Beaucoup d'entre eux ont accepté de continuer à soutenir Chiang pour éteindre la menace communiste chinoise, principalement en raison de leur gratitude envers Chiang, qui a montré un certain degré de pardon face aux atrocités commises contre la population chinoise. Leur aide nous permettra de faire progresser nos capacités militaires grâce à leurs stratégies de guerre supérieures, nous permettant ainsi d'avoir un avantage sur les communistes."
 bss.228.a:0 "Ils travailleront pour nos forces armées !"
 bss.228.b:0 "Cela pourrait se retourner contre vous à long terme..."

 bss.229.t:0 "Les seigneurs de guerre deviennent de plus en plus rebelles..."
 bss.229.d:0 "Avec une autorité inefficace sur nos propres territoires contrôlés, divers gouverneurs régionaux ont commencé à échapper à notre contrôle et à nous considérer comme illégitimes. Il est clair que si nous n'exerçons pas suffisamment d'autorité sur le pays, une révolte des chefs de guerre est inévitable."
 bss.229.a:0 "La situation ne doit pas devenir incontrôlable."

 #KMT on Mainland 60s Events#

 bss.0.t:0 "Kowalski, charge l'arbre des années 60"
 bss.0.d:0 "Kowalski, je veux que tu donnes au joueur son arbre des années 60 et quelques debuffs pour qu'il corresponde à l'état de son pays, tu as compris ?"
 bss.0.a:0 "Oui, monsieur"

 bss.1.t:0 "La République de Chine en 1949"
 bss.1.d:0 "Lorsque la dynastie Qing fut renversée lors de la révolution Xinhai, la République de Chine fut officiellement fondée en 1912, avec le grand Dr Sun Yat-sen comme premier président par intérim, mais elle fut rapidement contrainte de céder le pouvoir à l'ancien général Qing Yuan Shikai. Après que Yuan Shikai se soit proclamé empereur de Chine, une crise nationale a éclaté et de nombreuses provinces ont déclaré leur indépendance vis-à-vis de Pékin, marquant le début de l'ère des seigneurs de guerre en Chine. Le Kuomintang s'est retrouvé dans le Guangdong, d'où il a commencé à planifier une expédition pour unifier le pays. Sun-Yat-sen, le fondateur du Parti, mourut en 1925 et après une lutte de pouvoir entre Wang Jingwei et Chiang Kai-Shek, Chiang sortit triomphant et lança l'Expédition du Nord pour unir le pays sous la bannière du KMT. Les dix années suivantes sont restées dans l'histoire sous le nom de décennie de Nanjing, au cours de laquelle le Kuomintang tentait lentement d'établir son autorité sur le pays. Ces années ont finalement pris fin, après l'incident du pont Marco-Polo de 1937, qui s'est transformé en une véritable guerre entre la République de Chine et l'Empire du Japon. Après plus de huit années de résistance acharnée, la République est sortie victorieuse et a repris aux Japonais ses anciennes provinces de Mandchourie et de Taiwan. La paix et l'ordre n'ont cependant pas duré longtemps, alors que le conflit entre le Kuomintang et le mouvement communiste grandissant a repris, entraînant une fois de plus le pays dans la guerre et le chaos."
 bss.1.a:0 "Parlez-en davantage sur le Kuomintang."
 bss.1.b:0 "Le mouvement communiste ?"
 bss.1.c:0 "En avant !"

 Intro.1.t:0 "L'État du Kuomintang"
 Intro.1.d:0 "Le Kuomintang, également connu sous le nom de Parti nationaliste chinois, est issu de l'organisation clandestine révolutionnaire Tongmenghui, fondée par le Dr Sun Yat-sen et divers autres intellectuels républicains opposés au règne de la dynastie Qing. Le KMT suit les Trois principes du peuple, qui comprennent le bien-être, la démocratie et le nationalisme. Après la montée de Yuan Shikai suite à la grande révolution, le Kuomintang a été interdit mais s'est réorganisé à Liangguang après la division du pays en plusieurs régions de seigneurs de guerre. Afin d'unir le pays, le KMT et le Parti communiste chinois, relativement petit, ont formé le Premier Front uni et ont vaincu les cliques de Beiyang dans le nord, unissant officiellement la Chine sous la bannière du KMT. Cependant, divers chefs de guerre ont été soudoyés et recrutés par le KMT pour maintenir la stabilité régionale. Peu de temps après la mort du Dr Sun en 1925 et la consolidation du pouvoir de Chiang Kai-shek, le PCC fut purgé du KMT en 1927, déclenchant officiellement la guerre civile chinoise. Au cours de la décennie suivante et jusqu'à aujourd'hui, le KMT est resté l'ombre de lui-même. La corruption, l'opportunisme, le factionnalisme et le manque de soutien populaire ont plongé le KMT dans un état désastreux. Même le Généralissime s'en est rendu compte et a annoncé de grandes réformes pour faire du parti l'organisation démocratique révolutionnaire qu'il était autrefois."
 Intro.1.a:0 "Pour la Révolution !"
 Intro.1.b:0 "Parlez-m'en davantage sur le mouvement communiste."

 Intro.2.t:0 "La guerre civile chinoise"
 Intro.2.d:0 "Lorsque le Komintern a soutenu la fondation du Parti communiste chinois, il était au départ une organisation politique inconnue ne comptant que quelques centaines de membres. Le Komintern du Comité central du PCC prévoyait que le PCC rejoindrait éventuellement le Kuomintang dans le Premier Front uni contre les cliques impérialistes de Beiyang et tenterait ensuite d'infiltrer le KMT et d'en faire un parti véritablement marxiste. Cependant, lorsque Sun Yat-sen mourut en 1925 et que la faction Wang Jingwei du Kuomintang fut vaincue par la faction Chiang Kai-shek, le Front uni se divisa et les membres communistes furent purgés lors du massacre de Shanghai en 1927, déclenchant officiellement la guerre civile chinoise. Au cours des dix années suivantes, le Kuomintang a tout essayé pour éradiquer les derniers bandits communistes qui ont fui vers le Shaanxi, mais après l'incident de Mukden de 1931 et l'incident de Shanghai de 1932, les sentiments anti-japonais au sein du KMT ont considérablement augmenté, ce qui a conduit à l'enlèvement de Chiang Kai-shek par le général Zhang Xueliang en 1936, qui a forcé le généralissime à rejoindre un autre front uni avec le PCC contre l'impérialisme japonais. Avec la fin de la guerre contre le Japon en 1945, il n'a pas fallu longtemps pour que le conflit entre le KMT et le PCC se rallume. Depuis 1946, la guerre civile continue de faire rage et les bandits communistes ont gagné de façon exponentielle le soutien populaire des paysans chinois. Nous devons déployer tous nos efforts pour vaincre la menace rouge !"
 Intro.2.a:0 "Et le Kuomintang ?"
 Intro.2.b:0 "Pour la République !"

 bss.2.t:0 "L'intervention soviétique"
 bss.2.d:0 "Alors que nous étions sur le point de remporter la victoire contre les communistes, l'Union soviétique est intervenue pour empêcher l'effondrement total du PCC et a envahi les régions du Xinjiang et de la Mongolie intérieure. Les communistes contrôlent toujours la Mandchourie et la région de Pékin, mais nous ne sommes pas en mesure de déclencher un conflit avec l'URSS.\n\nNéanmoins, nous contrôlons les régions du Main-Han en Chine et avons assuré la direction du KMT. Pour l'instant, nous devons nous concentrer sur la reconstruction du pays et sur la maîtrise de nos problèmes internes si nous voulons un jour reprendre le Nord au PCC."
 bss.2.a:0 "Les armes reposent... pour l'instant."

 bss.3.t:0 "La République sur la scène mondiale"
 bss.3.d:0 "Après la guerre civile, nous nous sommes retrouvés dans une situation difficile. Nous nous sommes imposés comme un bastion anticommuniste en Asie de l'Est, mais après avoir réglé nos problèmes internes, nous devons décider quel rôle nous jouerons dans la politique internationale, en particulier dans nos relations avec les États-Unis et leurs alliés en Asie de l'Est."
 bss.3.a:0 "Nous verrons."

 bss.4.t:0 "Une offre des Chinois"
 bss.4.d:0 "Une délégation du gouvernement de Nanjing est arrivée ce matin à Washington. Le Kuomintang cherche à approfondir ses liens avec nous et propose que nous recevions une base militaire dans le détroit de Taiwan et que nous soyons libres de déplacer nos troupes à l'intérieur des frontières chinoises en échange de conseillers, d'équipements et de protection contre une éventuelle agression communiste. Cela augmenterait notre influence en Chine et en Asie de l'Est dans son ensemble, mais étant donné qu'une invasion du PCC soutenue par les Soviétiques ne semble pas très improbable, cela signifierait que nous serions éventuellement impliqués dans une guerre régionale majeure en Asie de l'Est.\n\nComment devons-nous réagir ?"
 bss.4.a:0 "Excellent! Nous acceptons l'offre."
 bss.4.b:0 "C'est trop risqué."

 bss.5.t:0 "Washington accepte !"
 bss.5.d:0 "Les États-Unis d'Amérique ont accepté notre offre ! Avec leur protection et leur équipement moderne, nous serons non seulement en mesure de repousser toute invasion communiste, mais cela nous aidera également à moderniser notre armée selon les normes occidentales."
 bss.5.a:0 "Magnifique."

 bss.6.t:0 "Les Américains refusent."
 bss.6.d:0 "Les Américains ont refusé notre demande d'équipement et de protection, arguant qu'ils ne voulaient pas être impliqués dans une éventuelle guerre à grande échelle en Chine. Cependant, Washington continue de nous reconnaître comme le seul gouvernement légitime de la Chine et reste ouvert au commerce et au commerce des armes."
 bss.6.a:0 "Malheureux."

 bss.7.t:0 "[GetNewspaperHeader]La République de Chine dénonce les USA"
 bss.7.d:0 "Après une tournure surprenante des événements, le président chinois [CHI.GetLeader] a annoncé que lui et son gouvernement n'étaient pas disposés à continuer à soutenir les États-Unis et a expulsé tous les conseillers américains du sol chinois et a refusé de faire partie de l'OTASE.\nLes Chinois ont fait valoir que les États-Unis ne sont qu'une autre puissance impérialiste qui veut exploiter la Chine pour de l'argent et ont considéré qu'il était nécessaire d'expulser l'influence américaine afin de rapprocher encore plus le siècle de l'humiliation de sa fin. Washington a qualifié ces actions d'insensées et a immédiatement rappelé tous ses conseillers et arrêté son commerce d'armes avec la Chine. Il s'agit néanmoins d'un coup dur porté à l'influence américaine en Asie de l'Est, mais de nombreux experts occidentaux affirment que le gouvernement de Nanjing est désormais extrêmement vulnérable à une éventuelle invasion communiste."
 bss.7.a:0 "Intéressant"

 bss.8.t:0 "[GetNewspaperHeader]La formation du Pacte de Nanjing"
 bss.8.d:0 "Aujourd'hui, le gouvernement de Nanjing a annoncé la formation du Pacte de Nanjing, une alliance militaire dont le but est de contenir le communisme en Asie de l'Est. [CHI.GetLeader] a affirmé que l'OTASE ne pouvait pas à elle seule arrêter la propagation du communisme et a clairement indiqué que la République de Chine apporterait son soutien à toutes les nations d'Asie de l'Est qui sont sous la menace du communisme.\nL'Union soviétique et d'autres gouvernements communistes de la région ont critiqué cette décision, déclarant que l'alliance était inutile et constituait une menace pour la paix dans la région. Les États-Unis d'Amérique ont cependant déjà exprimé leur soutien à cette idée et sont intéressés par une coopération entre l'OTASE et le Pacte de Nanjing."
 bss.8.a:0 "La guerre est-elle à l'horizon ?"

 bss.9.t:0 "En souvenir du Mouvement du 4 Mai"
 bss.9.d:0 "Le Mouvement du 4 mai était un mouvement anti-impérialiste, culturel et politique né des manifestations étudiantes à Pékin le 4 mai 1919. Le premier effet direct du Mouvement du 4 mai fut d'amener l'ancien gouvernement de Beiyang à refuser de signer des contrats défavorables à la Chine. Cette décision a choqué de nombreux pays occidentaux et leur a fait comprendre que la faible Chine, qui avait seulement fui, avait commencé à lui tenir tête.\n\nNon seulement cela a façonné le mouvement anticoncessionniste dans le pays, mais cela a également relancé le nationalisme chinois et, à partir de maintenant, nous nous opposons à nouveau aux impérialistes occidentaux qui tentent toujours d'exploiter notre pays pour leur propre bénéfice. Le célèbre érudit et témoin contemporain du Mouvement du 4 mai, Hu Shih, suggère que si nous voulons un jour mettre fin au siècle de l'humiliation, nous devons nous souvenir et réappliquer les pensées et les normes du Mouvement du 4 mai.\n\nPuisse la Chine se libérer de l'impérialisme étranger. Depuis dix mille ans !"
 bss.9.a:0 "Wansui !"

 KMT_Borderconflict.1.t:0 "Les bataillons de l'APL brisés"
 KMT_Borderconflict.1.d:0 "Nos troupes ont vaincu avec succès les troupes ennemies de l'APL lors d'une escarmouche à la frontière de Pékin. Même si nous ne voulons pas aggraver le conflit pour l'instant, nos forces n'ont pas traversé la frontière, mais c'est quand même une grande victoire pour la République de Chine !"
 KMT_Borderconflict.1.a:0 "Huzzah !"

 KMT_Borderconflict.2.t:0 "Catastrophe à la frontière"
 KMT_Borderconflict.2.d:0 "Terrible nouvelle ! Notre bataillon qui était censé tester les forces ennemies de l'APL à la frontière de Pékin a dû subir une défaite dévastatrice suite à une escarmouche avec les troupes communistes. C'est une grande honte pour la République de Chine."
 KMT_Borderconflict.2.a:0 "Comment cela a-t-il pu arriver ?"

 KMT_Borderconflict.4.t:0 "Les troupes du KMT victorieuses à la frontière"
 KMT_Borderconflict.4.d:0 "Aujourd'hui, un bataillon de l'ancienne NRA a attaqué par surprise notre patrouille frontalière à Pékin. Nos forces ont été débordées et ont dû battre en retraite pour se ravitailler. Même si les troupes du KMT n'ont pas franchi la frontière, cela reste une défaite dévastatrice pour l'APL."
 KMT_Borderconflict.4.a:0 "Horrible !"

 KMT_Borderconflict.3.t:0 "Les troupes du KMT vaincues par la patrouille de l'APL"
 KMT_Borderconflict.3.d:0 "Aujourd'hui, un bataillon de l'ancienne NRA a attaqué par surprise notre patrouille frontalière à Pékin. Nos forces ont été débordées au début, mais ont ensuite pris de l'ampleur en raison des milices de guérilla dans les terres occupées et ont forcé les troupes du KMT à battre en retraite pour se ravitailler. C'est une grande victoire pour l'APL et cela prouve que l'armée du Kuomintang n'est pas invincible."
 KMT_Borderconflict.3.a:0 "Parfait"

 bss.401.t:0 "[GetNewspaperHeader]L'invasion de la Mandchourie"
 bss.401.d:0 "De nombreux observateurs ont prédit que ce jour finirait par arriver et aujourd'hui, le [GetDateText], la République de Chine a commencé son invasion des territoires occupés par les socialistes en Mandchourie. Après la fin de la guerre civile chinoise, le Parti communiste chinois a été soutenu par l'Union soviétique pour empêcher son effondrement total et est resté dans la région de Mandchourie. Le Kuomintang a affirmé qu'il était le seul gouvernement légitime de la Chine et a annoncé que l'unification était inévitable. Tout en se concentrant sur la reconstruction du pays après la guerre civile et la Seconde Guerre mondiale, la République est désormais prête à reprendre ses anciens territoires et à vaincre une fois pour toutes les socialistes en Chine. L'Union soviétique et les États-Unis n'ont pas encore fait de déclaration sur ce récent développement, mais ils supposent certainement qu'ils aideront leurs partenaires respectifs en leur fournissant des livraisons d'armes et des conseillers."
 bss.401.a:0 "La bataille finale pour l'Asie a commencé."

 bss.402.t:0 "[GetNewspaperHeader]Le triomphe nationaliste"
 bss.402.d:0 "Depuis 1911, la nation chinoise a été victime de révolutions, de seigneurs de guerre, de conflits régionaux, de guerres civiles, d'exploitation et d'agression étrangères. Le chapitre de la guerre civile chinoise a été le conflit le plus long de l'histoire récente, s'étendant de 1927 à [GetYear] où le Kuomintang et le Parti communiste chinois se disputaient le contrôle de la nation. Après la fin de la Seconde Guerre mondiale, l'Union soviétique est intervenue dans la guerre civile en faveur des communistes et leur a assuré une base politique en Mandchourie. Cependant, le Kuomintang, qui contrôlait la majorité du pays, a clôturé ce chapitre de l'histoire chinoise avec sa récente invasion de la Mandchourie, marquant la bataille finale entre les deux partis. Le Kuomintang a remporté la victoire et aujourd'hui, dans son discours, le président [CHI.GetLeader] a annoncé au peuple chinois que « la menace du marxisme est enfin vaincue » et que désormais « plus rien ne s'oppose à la prospérité de l'Empire du Milieu ». On ignore actuellement quel est l'état de l'ancien PCC, mais on peut supposer que la plupart d'entre eux sont partis en exil soviétique ou ont été arrêtés et seront jugés."
 bss.402.a:0 "La paix en Chine ?"

 bss.10.t:0 "La République de Chine exige le retrait de l'OTASA"
 bss.10.d:0 "Après avoir adopté une position anti-occidentale, la République de Chine tente désormais de lutter contre l'influence occidentale non seulement en Chine mais aussi dans toute la région de l'Asie de l'Est. Par conséquent, le gouvernement de Nanjing a exigé que nous nous retirons de l'OTASA et que nous expulsions toutes les troupes et responsables américains de notre pays, sinon nous serions confrontés à un embargo qui paralyserait gravement notre économie.\n\nRefuser cet ultimatum aurait d'énormes conséquences sur notre économie, car nous dépendons du commerce avec le gouvernement républicain, mais en même temps, nous ne pouvons pas risquer de perdre le soutien et la protection des États-Unis. Comment devons-nous réagir ?"
 bss.10.a:0 "Nous n'avons pas d'autre choix que d'accepter"
 bss.10.b:0 "Nous ne pouvons pas risquer nos liens avec les États-Unis. Refuser!"

 bss.11.t:0 "Les Chinois réclament Hong Kong !"
 bss.11.d:0 "Après avoir adopté une position anti-impérialiste et dénoncé le colonialisme en Asie de l'Est, le gouvernement de Nanjing a exigé que nous restituions immédiatement le territoire de Hong Kong ! Il s'agit clairement d'une violation du Traité de Nankin et de la Deuxième Convention de Pékin, mais si nous conservons le territoire, nous pourrions faire face à la force de la NRA et, en raison de leur position anticolonialiste, les États-Unis ne nous soutiendront pas dans ce conflit.\n\nCependant, il y a quelques personnes dans notre gouvernement qui proposent qu'au lieu de restituer le territoire, nous essayions d'apaiser les Chinois et de leur donner des droits supplémentaires sur les ressources locales et de laisser leur garnison militaire dans la région.\n\nComment devons-nous réagir ?"
 bss.11.a:0 "Nous ne pouvons pas faire grand-chose à ce sujet."
 bss.11.b:0 "Faire la contre-offre"
 bss.11.c:0 "99 Ans ne sont pas encore terminés !"

 bss.12.t:0 "Les Chinois réclament Macao !"
 bss.12.d:0 "Après avoir adopté une position anti-impérialiste et dénoncé le colonialisme en Asie de l'Est, le gouvernement de Nanjing a exigé que nous restituions immédiatement le territoire de Macao ! Si nous essayons de conserver le territoire, nous pourrions faire face à la force de la NRA et, en raison de leur position anticolonialiste, les États-Unis ne nous soutiendront pas dans ce conflit.\n\nCependant, il y a quelques personnes dans notre gouvernement qui proposent qu'au lieu de restituer le territoire, nous essayions d'apaiser les Chinois et de leur donner des droits supplémentaires sur les ressources locales et de laisser leur garnison militaire dans la région.\n\nComment devons-nous réagir ?"
 bss.12.a:0 "Nous ne pouvons pas faire grand-chose à ce sujet."
 bss.12.b:0 "Faire la contre-offre"
 bss.12.c:0 "Nous n'abandonnerons jamais Macao !"

 bss.13.t:0 "Londres se rend !"
 bss.13.d:0 "Le gouvernement britannique a cédé à nos pressions ! Ils nous ont rendu Hong Kong et leur garnison militaire quitte la Chine. Il s'agit d'une grande réussite pour le peuple chinois et nous sommes désormais sur le point de mettre fin une fois pour toutes au siècle de l'humiliation."
 bss.13.a:0 "Huzzah !"

 bss.14.t:0 "Lisbonne se rend !"
 bss.14.d:0 "Le gouvernement portugais a cédé à nos pressions ! Ils nous ont rendu Macao et leur garnison militaire quitte la Chine. Il s'agit d'une grande réussite pour le peuple chinois et nous sommes désormais sur le point de mettre fin une fois pour toutes au siècle de l'humiliation."
 bss.14.a:0 "Huzzah !"

 bss.15.t:0 "Le Royaume-Uni refuse de céder Hong Kong"
 bss.15.d:0 "\nLe gouvernement de Londres a refusé nos demandes ! Les experts suggèrent que les Britanniques enverront des renforts dans la ville pour la protéger si nous tentions de l'envahir. Mais pour l'instant, la ville est faiblement défendue et la NRA est prête à entrer dans la ville et à libérer la population du colonialisme."
 bss.15.a:0 "Hong Kong est chinois !"
 bss.15.b:0 "Reculons, nous ne voulons pas risquer un conflit potentiel."

 bss.16.t:0 "Les Portugais refusent de céder Macao"
 bss.16.d:0 "\nLe gouvernement de Lisbonne a refusé nos demandes ! Les experts suggèrent que le gouvernement portugais enverra des renforts dans la ville pour la protéger si nous tentions de l'envahir. Mais pour l'instant, la ville est faiblement défendue et la NRA est prête à entrer dans la ville et à libérer la population du colonialisme."
 bss.16.a:0 "Macao est chinois !"
 bss.16.b:0 "Reculons, nous ne voulons pas risquer un conflit potentiel."

 bss.17.t:0 "Les Britanniques proposent un compromis"
 bss.17.d:0 "\nAujourd'hui, l'ambassadeur britannique est venu à notre gouvernement avec une proposition concernant le statut de Hong Kong. Alors que Londres ne veut pas nous céder toute la région, ils proposent que nous soyons libres de déplacer nos forces armées à l'intérieur de la zone et que nous en tirions toutes les ressources naturelles. Même si cela augmenterait notre influence à Hong Kong, Hong Kong ferait toujours partie de l'Empire britannique et non de la République de Chine.\n\nDevons-nous accepter cette offre ou la refuser et exiger le transfert immédiat de la Ville ?"
 bss.17.a:0 "Cela semble être une bonne affaire."
 bss.17.b:0 "Non, le colonialisme doit quitter complètement la Chine."

 bss.18.t:0 "Les Chinois refusent notre proposition"
 bss.18.d:0 "\nLe gouvernement chinois a refusé notre proposition ! Nanjing a clairement indiqué qu'elle n'acceptait aucun compromis et souhaitait que nous quittions complètement la Chine. Dès cette seconde, la NRA se prépare à s'emparer de la ville.\n\nQue devons-nous faire maintenant ?"
 bss.18.a:0 "Nous n'avons pas d'autre choix que de rendre la ville."
 bss.18.b:0 "Nous défendrons la ville à tout prix !"

 bss.19.t:0 "Les Chinois acceptent notre compromis"
 bss.19.d:0 "Nanjing a accepté notre proposition concernant le statut de Hong Kong. L'ambassadeur chinois a informé qu'une garnison est déjà en route vers Hong Kong pour garder la ville et que les sociétés chinoises d'exploitation des ressources sont déjà en train d'établir des bureaux.\n\nNous avons peut-être perdu une certaine influence dans la région, mais c'est une meilleure option que la guerre."
 bss.19.a:0 "La paix à notre époque."

 bss.20.t:0 "Les Chinois reculent"
 bss.20.d:0 "Le gouvernement de Nanjing a décidé de faire marche arrière et de nous laisser Hong Kong, avec pour raisonnement qu'il ne veut pas risquer une guerre potentielle avec l'OTAN à propos d'une seule ville."
 bss.20.a:0 "Des imbéciles."

 bss.21.t:0 "Les Portugais proposent un compromis"
 bss.21.d:0 "\nAujourd'hui, l'ambassadeur du Portugal est venu à notre gouvernement avec une proposition concernant le statut de Macao. Alors que Lisbonne ne veut pas nous céder toute la région, ils proposent que nous soyons libres de déplacer nos forces armées à l'intérieur de la zone et que nous en tirions toutes les ressources naturelles. Même si cela augmenterait notre influence à Macao, celle-ci ferait toujours partie de l'Empire colonial portugais et non de la République de Chine.\n\nDevons-nous accepter cette offre ou la refuser et exiger le transfert immédiat de la Ville ?"
 bss.21.a:0 "Cela semble être une bonne affaire."
 bss.21.b:0 "Non, le colonialisme doit quitter complètement la Chine."

 bss.22.t:0 "Les Chinois refusent notre proposition"
 bss.22.d:0 "\nLe gouvernement chinois a refusé notre proposition ! Nanjing a clairement indiqué qu'elle n'acceptait aucun compromis et souhaitait que nous quittions complètement la Chine. Dès cette seconde, la NRA se prépare à s'emparer de la ville.\n\nQue devons-nous faire maintenant ?"
 bss.22.a:0 "Nous n'avons pas d'autre choix que de rendre la ville."
 bss.22.b:0 "Nous défendrons la ville à tout prix !"

 bss.23.t:0 "Les Chinois acceptent notre compromis"
 bss.23.d:0 "Nanjing a accepté notre proposition concernant le statut de Macao. L'ambassadeur chinois a informé qu'une garnison est déjà en route vers Macao pour garder la ville et que les sociétés chinoises d'exploitation des ressources sont déjà en train d'établir des bureaux.\n\nNous avons peut-être perdu une certaine influence dans la région, mais c'est une meilleure option que la guerre."
 bss.23.a:0 "La paix à notre époque."

 bss.24.t:0 "Les Chinois reculent"
 bss.24.d:0 "Le gouvernement de Nanjing a décidé de faire marche arrière et de nous laisser Macao, avec pour raisonnement qu'il ne veut pas risquer une guerre potentielle avec l'OTAN à propos d'une seule ville."
 bss.24.a:0 "Des imbéciles."

 bss.25.t:0 "La situation au Xinjiang"
 bss.25.d:0 "Tout au long de son histoire, le Xinjiang a abrité un certain nombre de groupes ethniques, notamment les Ouïghours turcs, les Kazakhs et les Kirghizes, les Han, les Tibétains, les Hui, les Tadjiks chinois (Pamiris), les Mongols, les Russes et les Sibe. Depuis qu'elle fait partie de l'empire Qing au XVIIIe siècle, établir la paix et l'ordre dans cette région a toujours été un défi de taille pour le gouvernement chinois en raison des tensions locales entre les différents groupes ethniques.\n\nTout au long de l'histoire de la République chinoise, la province du Xinjiang a traversé des moments difficiles. Elle a été frappée par des menaces internes, telles que la rébellion de Kumul de 1931 à 1934, la révolte de Charkhlik de 1935 et la rébellion islamique de 1937, ainsi que par des menaces externes, notamment de la part de l'Union soviétique, qui tente depuis d'accroître son influence dans la région.\n\nAprès la rébellion d'Ili, une coalition a été établie entre les membres du KMT, les Ouïghours et les forces pro-soviétiques de la région, mais après notre « victoire » dans la guerre civile chinoise contre les communistes, l'Union soviétique est intervenue dans la région et a soutenu le soulèvement du Turkestan à Ili qui a finalement pris le contrôle de tout le Xinjiang et a établi un régime pro-communiste.\n\nPour l'instant, nous devons décider comment aborder cette situation, mais en même temps, nous ne pouvons pas nous permettre de provoquer l'Union soviétique car nous ne sommes pas en position de risquer une guerre avec Moscou."
 bss.25.a:0 "Compris"

 bss.26.t:0 "[GetNewspaperHeader]La République de Chine reconnaît l'indépendance du Turkestan oriental"
 bss.26.d:0 "La région du Xinjiang est sous contrôle chinois depuis près de deux siècles, mais suite à l'intervention soviétique dans la guerre civile chinoise, la République du Turkestan oriental a pu prendre le contrôle de toute la région du Xinjiang et y établir un régime pro-soviétique.\nCependant, contre toute attente, le gouvernement de Nankin a annoncé qu'il renoncerait à ses prétentions sur la région et reconnaîtrait le Turkestan oriental comme un État indépendant et cherchait à améliorer les relations avec la jeune république.\n\nL'Union soviétique a déjà montré son appréciation pour cette démarche et elle renforcera sans aucun doute la légitimité du gouvernement de Yining."
 bss.26.a:0 "Surprenant"

 bss.27.t:0 "Le destin de Sheng Shicai"
 bss.27.d:0 "Sheng Shicai a été officiellement gouverneur du Xinjiang entre 1933 et 1944 sous le KMT, mais s'est révélé peu fiable en raison de ses liens avec l'URSS. Après la bataille de Stalingrad, Sheng a de nouveau tenté de faire appel à Joseph Staline et a tenté de limiter l'influence du KMT au Xinjiang, mais a finalement échoué et a été démis du pouvoir en 1944 et rétrogradé au poste de ministre de l'Agriculture et des Forêts.\nEn raison de notre nouvelle position envers le Xinjiang, de nombreux responsables du parti demandent un procès pour sa trahison envers le KMT. Cependant, l'état-major suggère que son expérience militaire au Xinjiang pourrait être très utile pour développer des stratégies de guerre dans le désert et en montagne.\nCependant, nous pourrions simplement le laisser dans sa position actuelle où nous le surveillons de près."
 bss.27.a:0 "Aucune pitié pour les traîtres !"
 bss.27.b:0 "Son expérience pourrait être utile pour les guerres futures"
 bss.27.c:0 "Nous garderons nos yeux sur lui..."

 bss.28.t:0 "Une offre du Kuomintang"
 bss.28.d:0 "Suite à la reconnaissance de notre régime, le Kuomintang a pris des mesures pour exclure la région du Xinjiang de sa bureaucratie et de son administration formelle. Ils ont déjà dénoncé leurs revendications sur notre territoire et proposent désormais un pacte de non-agression entre nos nations pour apaiser les tensions entre Nankin et le Pacte de Varsovie.\n\nComment devons-nous réagir ?"
 bss.28.a:0 "Nous acceptons leur offre"
 bss.28.b:0 "On ne peut pas leur faire confiance"

 bss.29.t:0 "Yining refuse notre offre !"
 bss.29.d:0 "Contre notre attente, le gouvernement du Turkestan oriental a refusé notre demande d'un pacte de non-agression ! Cela va sûrement non seulement contrarier les responsables de notre gouvernement, mais on suppose que nous serons désormais confrontés à des réactions politiques de la part de l'opinion publique, nous considérant comme faibles et abandonnant le Xinjiang pour rien."
 bss.29.a:0 "Malheureusement"

 bss.30.t:0 "La NRA entre à Hong Kong"
 bss.30.d:0 "Nos forces ont repoussé les Britanniques hors de Hong Kong ! Aujourd'hui, après plus de 100 ans, Hong Kong fait enfin à nouveau partie de la Chine !"
 bss.30.a:0 "Huzzah !"

 bss.31.t:0 "Catastrophe à Hong Kong"
 bss.31.d:0 "Nos forces n'ont pas réussi à repousser les Britanniques hors de Hong Kong ! C'est un désastre et cela portera gravement atteinte à la réputation de notre armée et du gouvernement."
 bss.31.a:0 "Comment cela a-t-il pu arriver ?"

 bss.32.t:0 "La défense de Hong Kong"
 bss.32.d:0 "Excellente nouvelle ! Nos forces militaires à Hong Kong ont pu mettre en place une défense étonnante et après des jours de combat, la NRA s'est retirée et a nettoyé la zone.\nCe n'est pas seulement un grand jour pour l'Empire britannique, mais aussi un énorme regain de moral en ces temps difficiles."
 bss.32.a:0 "Règle la Britannia !"

 bss.33.t:0 "La chute de Hong Kong"
 bss.33.d:0 "Terrible nouvelle ! Nos forces militaires à Hong Kong n'ont pas été en mesure de défendre la ville contre la NRA. L'armée chinoise a rapidement conquis la ville et a déclaré illégitimes tous les responsables britanniques.\nCe n'est pas seulement un jour sombre pour l'Empire britannique, mais aussi un énorme effondrement du moral en ces temps difficiles."
 bss.33.a:0 "Le soleil est sur le point de se coucher..."

 bss.34.t:0 "La NRA entre à Macao"
 bss.34.d:0 "Nos forces ont repoussé les Portugais hors de Macao ! Aujourd'hui, après plus de 400 ans, Macao fait enfin à nouveau partie de la Chine !"
 bss.34.a:0 "Huzzah !"

 bss.35.t:0 "Catastrophe à Macao"
 bss.35.d:0 "Nos forces n'ont pas réussi à repousser les Portugais hors de Macao ! C'est un désastre et cela portera gravement atteinte à la réputation de notre armée et du gouvernement."
 bss.35.a:0 "Comment cela a-t-il pu arriver ?"

 bss.36.t:0 "La défense de Macao"
 bss.36.d:0 "Excellente nouvelle ! Nos forces militaires à Macao ont pu mettre en place une défense étonnante et après des jours de combat, la NRA s'est retirée et a nettoyé la zone.\nCe n'est pas seulement un grand jour pour le Portugal, mais aussi un énorme regain de moral en ces temps difficiles."
 bss.36.a:0 "Parfait."

 bss.37.t:0 "La chute de Macao"
 bss.37.d:0 "Terrible nouvelle ! Nos forces militaires à Macao n'ont pas été en mesure de défendre la ville contre la NRA. L'armée chinoise a rapidement conquis la ville et a déclaré illégitimes tous les responsables portugais.\nCe n'est pas seulement un jour sombre pour le Portugal, mais aussi une énorme perte de moral en ces temps difficiles."
 bss.37.a:0 "C'est un désastre"

 bss.38.t:0 "Le coup d'État échoue"
 bss.38.d:0 "Terribles nouvelles du Xinjiang ! Il semblerait que l'agence d'espionnage du Turkestan oriental, avec l'aide du KGB, ait découvert notre complot visant à renverser le régime de Qasim ! Si quelques-uns de nos hommes ont réussi à s'échapper à temps, beaucoup d'autres n'ont pas pu s'en sortir et ont été arrêtés par les autorités du Xinjiang et seront jugés pour être exécutés.\nC'est un désastre pour notre gouvernement si cela devait être divulgué au public..."
 bss.38.a:0 "Fantastique, c'était une énorme perte de temps."

 bss.39.t:0 "Yulbars Khan sécurise le Xinjiang"
 bss.39.d:0 "Excellente nouvelle ! Il semble que le complot visant à renverser Qasim ait réussi ! Yulbars Khan et ses alliés, ainsi que l'ancien Comité révolutionnaire du Kuomintang chinois, ont sécurisé les principales institutions politiques du Xinjiang et établi leur contrôle sur les villes les plus importantes de la région. Nos espions suggèrent que Qasim et son entourage ont évacué la région et sont en route vers Moscou.\nIl s'agit d'un grand succès pour notre gouvernement et cela permettra sans aucun doute de susciter le soutien populaire à notre régime. Nous devons dès maintenant commencer les préparatifs pour la réintégration du Xinjiang dans la République."
 bss.39.a:0 "Excellent!"

 bss.40.t:0 "Yulbars Khan prend le contrôle !"
 bss.40.d:0 "Terrible nouvelle ! Un complot secret composé des restes du KMT, des Ouïghours locaux et des anticommunistes a pris le contrôle du Xinjiang ! Ils envisagent de renverser le gouvernement depuis des mois et, grâce à quelques manoeuvres intelligentes, ils ont établi leur contrôle sur toutes les institutions politiques du pays. Le président Qasim et son entourage ont fui le pays et demandent asile à Moscou tandis que le nouveau gouvernement dirigé par Yulbars Khan commence déjà à établir son autorité en commençant par des purges massives d'anciens responsables de notre gouvernement."
 bss.40.a:0 "Comment n'avons-nous pas remarqué ?"

 bss.41.t:0 "Un complot a été découvert !"
 bss.41.d:0 "Des nouvelles urgentes ! Un complot secret composé des restes du KMT, des Ouïghours locaux et des anticommunistes sous la direction de Yulbars Khan, ancien général de la NRA et dernier gouverneur du Xinjiang, prévoyait de prendre le contrôle du Xinjiang ! Ils projetaient de putschiser le gouvernement depuis des mois, mais grâce à nos efforts d'espionnage accrus et au soutien du KGB, nous avons pu arrêter la plupart des conspirateurs avant qu'ils ne puissent agir.\n\nCela a sans aucun doute été organisé par le gouvernement de Nanjing et constitue un signe clair qu'il n'acceptera pas la légitimité de notre régime. De nombreux responsables de notre gouvernement et du KGB suggèrent que nous devrions investir davantage dans nos agences de renseignement et nos efforts d'espionnage si nous ne voulons pas que cela se reproduise."
 bss.41.a:0 "Cela aurait pu mal tourner."

 bss.42.t:0 "[GetNewspaperHeader]Coup d'État du Kuomintang au Xinjiang"
 bss.42.d:0 "Aujourd'hui, des milliers de soldats nationalistes dirigés par l'ancien général et gouverneur Yulbars Khan ont lancé un coup d'État contre le régime de Qasim dans l'ancienne République du Turkestan oriental. Des troupes militaires et paramilitaires ont été déployées à Yining, l'aéroport de la ville est fermé et les vols internationaux sont suspendus. Des rapports suggèrent que la République de Chine était à l'origine de ce coup d'État et qu'elle soutenait les forces séparatistes et propageait la dissidence au Xinjiang depuis des mois.\nPour l'instant, l'influence soviétique au Xinjiang est au plus bas, mais Moscou n'a encore montré aucune réaction à ce récent développement."
 bss.42.a:0 "Inquiétant"

 bss.43.t:0 "[GetNewspaperHeader]Coup d'État raté au Xinjiang"
 bss.43.d:0 "Aujourd'hui, des milliers de soldats nationalistes dirigés par l'ancien général et gouverneur Yulbars Khan ont tenté de lancer un coup d'État contre le régime de Qasim dans l'ancienne République du Turkestan oriental. Cependant, le gouvernement de Yining, avec l'aide des troupes soviétiques locales et du KGB, a réussi à arrêter la majorité des conspirateurs et à réprimer les forces nationalistes restantes au Xinjiang. Des rapports suggèrent que la République de Chine était à l'origine de ce coup d'État et qu'elle soutenait les forces séparatistes et propageait la dissidence au Xinjiang depuis des mois.\nLes experts suggèrent que cela augmentera les tensions entre l'Union soviétique et la République de Chine, mais pour l'instant, ni Moscou ni Nanjing n'ont fait preuve de grande avancée quant à l'issue de cet événement."
 bss.43.a:0 "Inquiétant"

 bss.44.t:0 "[GetNewspaperHeader]Nouveaux traités entre Washington et Nanjing"
 bss.44.d:0 "Aujourd'hui, le Congrès américain a adopté la loi sur les relations de Nanjing du [GetYear], qui approfondit les relations entre les États-Unis d'Amérique et la République de Chine. Cet acte vise à élargir la coopération militaire et industrielle entre les deux pays ainsi qu'avec les autres membres de l'OTASE. Le gouvernement de Nanjing espère que ce traité apportera protection et solidarité contre les menaces socialistes dans la région. Le Président [CHI.GetLeader] a annoncé dans un discours public à Nanjing que cette coopération bénéficierait non seulement aux capacités militaires de la République, mais contribuerait également à la paix et à la prospérité dans l'ensemble du pays. L'URSS ainsi que ses alliés ont déjà critiqué cet acte comme une menace pour la stabilité et la paix en Asie de l'Est et envisagent déjà de fortifier leurs frontières dans la région."
 bss.44.a:0 "Intéressant"

 bss.45.t:0 "La situation au Vietnam"
 bss.45.d:0 "Après la première guerre d'Indochine, la France a été contrainte de quitter le continent, entraînant l'indépendance du Laos, du Cambodge et la séparation du Vietnam. Cependant, les espoirs de réunification se sont effondrés après que le gouvernement sud-vietnamien de Ngo Dinh Diem a rejeté les accords de Genève de 1955. À l'heure actuelle, le gouvernement sud-vietnamien est aux prises avec diverses rébellions dans le pays, notamment le Front de libération nationale, qui vise la réunification avec le Nord sous un gouvernement marxiste. Si nous ne voulons pas que le communisme se propage en Asie de l'Est, nous devons aider Saigon dans sa lutte contre ses ennemis."
 bss.45.a:0 "Noté."

 bss.46.t:0 "Nanjing envoie du matériel"
 bss.46.d:0 "Le gouvernement chinois de Nanjing nous a envoyé diverses cargaisons d'armes et d'équipements afin d'aider notre armée à faire face aux éventuelles menaces socialistes."
 bss.46.a:0 "Homme aux armes !"

 bss.47.t:0 "Hu Lien arrive à Saigon"
 bss.47.d:0 "Hu Lien, général au sein du ROCA, est arrivé aujourd'hui à Saigon pour prendre conscience de son rôle de nouvel ambassadeur de Chine dans notre pays. Il a servi pendant l'expédition du Nord, les campagnes d'encerclement, la guerre contre le Japon et la guerre civile. Il apporte donc une bonne expérience des combats sur des terrains difficiles et des zones sous-approvisionnées. [CHI.GetLeader] lui a également chargé de conseiller notre état-major et de développer de nouvelles tactiques contre les insurrections de guérilla dans notre pays."
 bss.47.a:0 "Accueillir!"

 bss.48.t:0 "Aborder la guerre du Vietnam"
 bss.48.d:0 "Même si nous avons apporté un soutien considérable au gouvernement sud-vietnamien, il est clair qu'il ne pourra pas tenir très longtemps seul. De nombreux anticommunistes radicaux au sein de notre gouvernement suggèrent que nous envahissions directement le régime socialiste de Hanoï et que nous mettions fin à ce conflit une fois pour toutes.\nCependant, notre état-major craint fortement qu'une intervention directe ne suscite une réaction négative à Moscou et, compte tenu de notre situation géopolitique, nous devrions l'éviter à tout prix. Peut-être pouvons-nous trouver un compromis ?"
 bss.48.a:0 "Intervention limitée"
 bss.48.b:0 "Déclarer la neutralité"
 bss.48.c:0 "Si nous voulons gagner cette guerre contre le communisme, combattons-la ici ainsi que contre le Vietman"

 bss.49.t:0 "La République de Chine envisage d'envahir le Nord"
 bss.49.d:0 "Aujourd'hui, un télégramme de [CHI.GetLeader] lui-même a attiré notre attention, précisant que le ROCA est prêt et sur le point d'envahir le régime marxiste du Nord, pour ramener l'ordre au Vietnam une fois pour toutes. Nanjing suggère que nous rejoignions leur faction pour une coopération et une communication plus étroites afin que cette invasion réussisse."
 bss.49.a:0 "Comptez sur nous !"

 bss.50.t:0 "Saigon soutient l'invasion"
 bss.50.d:0 "Le gouvernement de Saigon a déclaré qu'il soutiendrait notre armée lors de la prochaine invasion du Nord et a accepté de rejoindre notre alliance pour une coopération militaire plus étroite."
 bss.50.a:0 "Prochain arrêt : Hanoï !"

 bss.52.t:0 "La situation en Corée"
 bss.52.d:0 "Tout comme notre situation, la Corée s'est retrouvée divisée après une guerre civile longue et sanglante. La péninsule reste divisée entre le régime marxiste de Kim Il Sung contrôlant le Nord et le régime anticommuniste au Sud. Le Nord pourrait sans aucun doute tenter d'attaquer le Sud à tout moment avec l'aide du PCC et de l'Union soviétique. Si nous ne voulons pas que le socialisme conquière toute la péninsule, nous devons intervenir et soutenir la Corée du Sud."
 bss.52.a:0 "Noté."

 bss.53.t:0 "[GetNewspaperHeader]L'invasion chinoise du Vietnam"
 bss.53.d:0 "Les espoirs de stabilité et de paix en Indochine ont une fois de plus été réduits à néant. Hier, les forces armées de la République de Chine ont franchi la frontière vietnamienne en coopération avec le gouvernement sud-vietnamien. Le gouvernement chinois a justifié l'invasion comme « un moyen nécessaire pour garantir la paix et la stabilité au Vietnam » et vise à renverser le régime marxiste de Hanoï et à aider Saigon à écraser toute rébellion socialiste dans la région. L'invasion a été fortement critiquée par l'URSS, qui envisageait de porter cette question devant l'ONU, mais a finalement échoué en raison de la sympathie occidentale pour l'invasion."
 bss.53.a:0 "L'Indochine trouvera-t-elle un jour la paix ?"

 bss.54.t:0 "Résoudre la question coréenne"
 bss.54.d:0 "Même si nous avons apporté un soutien considérable au gouvernement sud-coréen, il est clair que l'unification sans la conquête du Nord n'est pas possible. De nombreux anticommunistes radicaux au sein de notre gouvernement suggèrent que nous envahissions directement le régime socialiste de Pyongyang et que nous unifiions la péninsule une fois pour toutes.\nCependant, notre état-major craint fortement qu'une intervention directe ne suscite une réaction négative à Moscou et, compte tenu de notre situation géopolitique, nous devrions l'éviter à tout prix. Peut-être pouvons-nous trouver un compromis ?"
 bss.54.a:0 "Nous serons aux côtés de Séoul dans un conflit défensif"
 bss.54.b:0 "Déclarer la neutralité"
 bss.54.c:0 "Nous marcherons sur Pyongyang !"

 bss.55.t:0 "Une délégation de Nanjing"
 bss.55.d:0 "Aujourd'hui, une délégation du gouvernement de la République de Chine est arrivée à Séoul. Nanjing suggère que nous rejoignions leur faction pour des raisons défensives et économiques. Cette offre nous donnerait plus de protection contre d'éventuelles attaques dans la région et garantirait la croissance économique, mais conduirait finalement les Chinois à accroître leur influence non seulement sur notre économie mais aussi sur notre gouvernement.\n\nComment devons-nous réagir ?"
 bss.55.a:0 "Nous acceptons leur offre."
 bss.55.b:0 "Déline."

 bss.551.t:0 "Une délégation de Nanjing"
 bss.551.d:0 "Aujourd'hui, une délégation du gouvernement de la République de Chine est arrivée à Saigon. Nanjing suggère que nous rejoignions leur faction pour des raisons défensives et économiques. Cette offre nous donnerait plus de protection contre d'éventuelles attaques dans la région et garantirait la croissance économique, mais conduirait finalement les Chinois à accroître leur influence non seulement sur notre économie mais aussi sur notre gouvernement.\n\nComment devons-nous réagir ?"
 bss.551.a:0 "Nous acceptons leur offre."
 bss.551.b:0 "Demandez plutôt une Garantie d'Indépendance."

 bss.561.t:0 "Les Vietnamiens refusent"
 bss.561.d:0 "Bien que le gouvernement de Saigon ait apprécié notre offre, il a affirmé qu'une coopération militaire et économique à une si grande échelle n'était pas nécessaire. Même s'ils n'étaient pas prêts à rejoindre notre faction, ils ont néanmoins demandé une garantie d'indépendance."
 bss.561.a:0 "Cela fonctionnera."

 bss.56.t:0 "Les Coréens refusent"
 bss.56.d:0 "Même si le gouvernement de Séoul a apprécié notre offre, il a affirmé qu'une coopération militaire et économique à une si grande échelle n'était pas nécessaire."
 bss.56.a:0 "Inattendu."

 bss.59.t:0 "La République de Chine envisage d'envahir le Nord"
 bss.59.d:0 "Aujourd'hui, un télégramme de [CHI.GetLeader] lui-même a attiré notre attention, précisant que le ROCA est prêt et sur le point d'envahir le régime marxiste du Nord, pour ramener l'ordre en Corée une fois pour toutes. Nanjing suggère que nous rejoignions leur faction pour une coopération et une communication plus étroites afin que cette invasion réussisse."
 bss.59.a:0 "Comptez sur nous !"

 bss.60.t:0 "Séoul soutient l'invasion"
 bss.60.d:0 "Le gouvernement de Séoul a déclaré qu'il soutiendrait notre armée lors de la prochaine invasion du Nord et a accepté de rejoindre notre alliance pour une coopération militaire plus étroite."
 bss.60.a:0 "Prochaine étape : Pyongyang !"

 bss.61.t:0 "[GetNewspaperHeader]La Seconde Guerre de Corée"
 bss.61.d:0 "Après la guerre de Corée, les espoirs d'unification des deux Corées ont été anéantis, mais les développements récents pourraient changer la donne. Avec la République de Chine, le gouvernement sud-coréen a lancé une invasion totale de la Corée du Nord, dans l'espoir d'unifier la péninsule une fois pour toutes. L'Union soviétique et ses alliés n'ont pas encore répondu à cette invasion, mais les experts suggèrent que ce conflit pourrait facilement dégénérer si l'Armée populaire coréenne n'était pas en mesure de tenir le coup par elle-même."
 bss.61.a:0 "Un autre."

 bss.62.t:0 "Le 9e Congrès national du Kuomintang"
 bss.62.d:0 "Aujourd'hui, les membres du Comité exécutif central se sont réunis à Nanjing pour discuter de l'avenir du parti. Il a été convenu que le Kuomintang s'est éloigné de ses principes depuis le décès du Dr Sun Yat-sen et est devenu un parti pour les propriétaires fonciers et la classe supérieure et non pour le peuple. La corruption, l'opportunisme, l'avidité et le militarisme ont dominé le parti ces dernières années, alors que le parti ne parvenait pas à fonctionner comme une entité unique et à attirer le peuple.\nLe Comité a convenu d'introduire des réformes constitutionnelles et intra-parties pour faire du Kuomintang le parti révolutionnaire qu'il était autrefois, afin qu'il puisse remplir son rôle de guide pour le peuple chinois."
 bss.62.a:0 "Pour un avenir meilleur."

 bss.63.t:0 "La chute du YLTPP"
 bss.63.d:0 "Après la Seconde Guerre mondiale, la Société fasciste des Chemises bleues a subi des pressions politiques, ce qui a finalement abouti à sa dissolution formelle en 1945. Cependant, de nombreux anciens membres ont rejoint le Kuomintang ou ont rejoint la nouvelle Ligue de la jeunesse des Trois principes du peuple (YLTPP) tout en conservant leur influence au sein du Bureau d'enquête et de statistiques. Nous ne pouvons pas permettre à ces personnes de conserver des postes élevés au sein de notre gouvernement car elles ne font pas preuve d'alignement sur la nouvelle politique de notre parti. Si nous voulons vraiment réformer le Kuomintang, nous devons l'exclure du parti."
 bss.63.a:0 "Autant en emporte le vent."

 bss.64.t:0 "Une rencontre avec Li Zongren"
 bss.64.d:0 "\"Je me souviens de mon séjour à Tongmenghui. À cette époque, je ne comprenais pas grand-chose de la vision du Dr Sun en matière de réforme et de réunification nationale, mais en y regardant par la suite, après des années de conflit interne et de guerre contre l'impérialisme, son dévouement et son désir de sauver notre pays étaient remarquables.\"\n\nLi Zongren est l'un des derniers membres survivants du Tongmenghui, une société secrète fondée par Sun Yat-sen et Song Jiaoren en 1905. Combinant nationalisme, républicanisme et socialisme, l'objectif de l'organisation était d'expulser les Mandchous de Chine, d'unir le pays et d'établir une république, où la terre serait répartie équitablement entre le peuple. Ces « Trois principes du peuple » originaux ont été négligés par le Kuomintang après la mort tragique de Sun Yat-sens en 1925.\n\n\"C'est dommage que le parti ait négligé la vision du Dr Sun après avoir assumé la direction nationale, mais les récents développements au sein du parti m'ont donné l'espoir que nous pourrions revenir à nos racines et atteindre les objectifs des personnalités révolutionnaires qui se sont battues pour la liberté et la souveraineté de notre pays.\""
 bss.64.a:0 "Zhongguó wànsuì!"

 bss.65.t:0 "Comprendre Minzu"
 bss.65.d:0 "Que veut dire Minzu ? La signification moderne de Minzu remonte à la révolution Xinhai et était un principe fondateur de la République au début de la zone républicaine. Le début du 20e siècle a allumé la flamme du nationalisme chinois, le rêve d'une communauté chinoise unifiée contre la subjugation et l'impérialisme étrangers, que le Dr Sun a décrit comme l'unification de toutes les nationalités chinoises, afin de développer le pays pour en faire une nation avancée et moderne et de ne pas satisfaire les rêves chauvins des Han. Nous devons approfondir ce principe dans notre nouvelle constitution afin que les Mongols, les Han, les Mandchous, les Hui et les Tibétains ainsi que toutes les autres nationalités reçoivent des droits égaux et créent la communauté chinoise unie dont nous rêvons."
 bss.65.a:0 "Cinq courses sous une seule bannière."

 bss.66.t:0 "Tensions au sein du parti"
 bss.66.d:0 "L'optimisme et l'espoir ont rempli l'atmosphère du Comité exécutif central ces derniers mois. Il est clair que le parti est en train de procéder à une réforme indispensable, mais les demandes de changement de direction sont devenues de plus en plus fortes. Le président [CHI.GetLeader], qui ne s'aligne sur aucune faction du parti, a appelé à une élection à la présidence au sein du parti pour décider de l'avenir du Kuomintang. Chaque membre du Kuomintang pourra voter lors de cette élection très particulière. Alors que toutes les factions partagent la philosophie fondamentale des « Trois principes du peuple », les trois factions les plus influentes plaident respectivement pour la concentration sur un principe spécifique.\nLa droite, également connue sous le nom de « Faction Minzu », soutient une politique basée sur l'intégration nationale, la culture et la tradition, dont l'objectif est l'unification du peuple chinois pour qu'il s'unisse contre l'impérialisme et le marxisme étrangers. L'aile gauche, également connue sous le nom de « Faction Minsheng », plaide en faveur de réformes sociales à l'échelle du pays et recherche la détente et la paix avec nos voisins. L'aile progressiste, également connue sous le nom de « Faction Minquan », prône l'expansion des droits civiques ainsi que la participation économique et politique, l'individualisme et une position amicale envers les pays capitalistes occidentaux. »\n\nLes tensions restent vives au sein de la Commission alors que cette élection très particulière va changer l'avenir de la République chinoise."
 bss.66.a:0 "Nous regardons l'avenir avec optimisme."

 bss.67.t:0 "Les premières élections intra-parti"
 bss.67.d:0 "Le jour est enfin venu. Des centaines de milliers de membres du parti voteront pour décider de l'avenir du Kuomintang et de la République. Après une campagne électorale difficile et serrée, la faction qui l'emporte est..."
 bss.67.a:0 "La faction Minzu !"
 bss.67.b:0 "La faction Minsheng !"
 bss.67.c:0 "La faction Minquan !"

 bss.68.t:0 "Le cancer de la nation"
 bss.68.d:0 "\"Devenez bureaucrate et devenez riche.\"\n\nCe vieux slogan chinois est la norme depuis l'introduction du système d'examen par les dynasties Tang et Song il y a plus de 1000 ans. Cela permettait à une petite poignée de citoyens supérieurs de régner sur la majorité de la population. Également connu sous le nom de Gentry, il s'agissait d'une classe d'élite de la société chinoise qui occupait des postes importants dans la bureaucratie et l'armée et était responsable de la collecte des impôts et de l'administration des forces armées locales dans les différentes provinces.\n\nAprès la Révolution de 1911, ce concept a continué à se développer à un niveau plus intense pendant la zone des Seigneurs de Guerre, qui a vu divers généraux et gouverneurs militaires déclarer leur indépendance du gouvernement central de Pékin, leur base de soutien étant les forces armées locales. Le vieux principe de la hiérarchie despotique a survécu et s'est même maintenu au cours des années 1927-1952 au sein du Kuomintang. L'exploitation, le capitalisme bureaucratique, l'opportunisme, le blanchiment d'argent, la contrebande d'opium, tout cela a contribué à la chute de la Chine à l'ère moderne.\n\nAbandonner des valeurs vieilles de 1000 ans n'est pas facile, mais c'est une étape nécessaire pour conduire le pays vers l'ère moderne. La population locale doit se gouverner elle-même et ne doit pas être exploitée par des tyrans despotiques."
 bss.68.a:0 "La modernisation est inévitable."

 bss.69.t:0 "Reconstruire l'Académie de Whampoa"
 bss.69.d:0 "L'Académie de Whampoa a été l'académie militaire la plus importante au début de la République nationale. Sous la direction de Chiang Kai-shek, de nombreux commandants brillants ont été diplômés et ont prouvé leurs compétences dans la guerre de résistance contre le Japon et dans la guerre civile contre le PCC. C'était même le premier endroit où notre hymne national « San Min Chu-I » a été joué. Pendant la Seconde Guerre sino-japonaise, il fut détruit à Huangpu par des bombardiers japonais. Des années de guerre civile et de conflits internes ont retardé nos efforts de reconstruction, mais le moment est désormais venu de reconstruire l'académie si nous voulons maintenir une armée hautement professionnelle qui nous protégera des menaces impérialistes et marxistes."
 bss.69.a:0 "Renaître des cendres"

 bss.70.t:0 "Une belle journée à Cuiheng"
 bss.70.d:0 "Cuiheng occupe une place particulière dans le coeur de tous au sein du Kuomintang, étant le lieu de naissance de Sun Yat-sen, le père de la nation. Le Comité exécutif central du Kuomintang a décidé d'y établir le siège du nouveau « Syndicat du travail du Minsheng ». La décision a été prise en raison de sa valeur symbolique et de sa proximité avec les zones rurales du Guangdong afin de plaire au peuple. Différents établissements en seront installés à travers le pays. L'Union ne doit pas être confondue avec les « syndicats » totalitaires des pays marxistes despotiques d'Europe et d'Asie de l'Est, qui sont utilisés pour rééduquer et laver le cerveau des gens ordinaires conformément aux politiques gouvernementales. Notre objectif est d'établir un syndicat pour l'homme ordinaire, qui puisse enfin élever la voix dans son environnement de travail et ne soit pas brutalement exploité par ses supérieurs. Le droit de grève fera partie intégrante de notre nouvelle république et après tout, c'est la classe ouvrière et paysanne chinoise commune qui représente la majorité de la nation et non les propriétaires fonciers et les industriels."
 bss.70.a:0 "C'est vraiment un endroit magique."

 bss.71.t:0 "Approche de la carotte et du bâton"
 bss.71.d:0 "À la fin du XIXe siècle, le chancelier de fer Otto von Bismarck d'Allemagne a adopté le principe de « Zuckerbrot und Peitsche » (Carotte et bâton) pour faire face aux mouvements socialistes et sociaux-démocrates en Allemagne. La carotte est apparue sous la forme d'avantages sociaux, notamment les assurances qui ont changé à jamais les politiques sociales dans le monde, tandis que le bâton symbolisait la répression et l'interdiction des organisations socialistes.\n\nMême si cela ne s'est pas révélé aussi efficace qu'espéré en Allemagne, nous devrions adopter cette approche dans son essence et accorder des concessions aux paysans ordinaires et punir les restes maoïstes dans notre pays afin d'arrêter la propagation du communisme dans la République et de la rendre peu attrayante."
 bss.71.a:0 "Ils finiront par retenir la leçon."

 bss.72.t:0 "Le nouveau Yuan législatif"
 bss.72.d:0 "Afin de montrer au monde et aux libéraux chinois que notre République est une véritable démocratie, le président [CHI.GetLeader] a organisé de nouvelles élections pour le Yuan législatif. Cependant, étant donné que la menace du maoïsme reste relativement élevée dans notre pays, les seuls partis sélectionnables seront le Kuomintang, le Parti de la Jeune Chine pro-Kuomintang et le Parti socialiste démocratique de Chine. Néanmoins, cela suffira à apaiser les voix libérales dans notre pays et cela montrera au monde que nous sommes aussi démocratiques que n'importe quelle autre démocratie occidentale."
 bss.72.a:0 "Le Kuomintang remporte comme prévu la majorité."

 bss.73.t:0 "Élection du vice-président"
 bss.73.d:0 "Il semble que la faction réformiste de notre gouvernement n'ait pas été satisfaite des récents résultats des élections au Yuan législatif. De nombreuses voix se sont élevées pour s'inquiéter du trucage des élections et de la corruption, ainsi que de la répression des partis libéraux indépendants. Cependant, ce que nous pourrions faire, c'est organiser une élection vice-présidentielle à l'échelle nationale. Cette position est relativement faible par rapport à celle du président et du premier ministre, mais elle pourrait néanmoins nous promettre une certaine légitimité démocratique.\n\nLe premier choix est l'actuel président de l'examen Yuan et fils du Dr Sun, Sun Fo. Il est également connu pour avoir un « cou de fer », ce qui signifie une position libérale franche contre les mesures autoritaires de Chiang Kai-shek. En tant que partisan du constitutionnalisme et du nationalisme chinois, Sun Fo plaide en faveur de réformes favorisant les institutions constitutionnelles et l'unification pacifique avec le Parti communiste. Bien que cela soit totalement inacceptable pour notre politique, nous ne pouvons pas le purger en raison de son statut de fils du père de la République, qui lui confère également une grande popularité auprès du peuple.\n\nFavorisé par Chiang Kai-shek et ses alliés, Chen Cheng est l'autre premier choix. Chen servait comme commandant principal de la NRA pendant l'expédition du Nord, les campagnes anticommunistes, la deuxième guerre sino-japonaise et la guerre civile contre le PCC. À la fin de la guerre civile, il fut nommé gouverneur de la province de Taiwan où il déclara la loi martiale afin d'établir un fort bastion nationaliste sur l'île en cas de défaite de l'armée nationaliste sur le continent. Tout en étant un fervent anticommuniste et partisan de la politique de Chiang Kai-shek, il plaide pour la libéralisation économique et la réforme agraire afin d'apaiser les tensions entre les paysans et le gouvernement, mais recherche également une coopération étroite avec les États-Unis comme rempart contre le socialisme."
 bss.73.a:0 "Sun Fo perpétuera l'héritage de son père."
 bss.73.b:0 "Chen Cheng assurera la sécurité de la République."

 bss.74.t:0 "[GetNewspaperHeader]Chen Cheng élu vice-président de la République de Chine"
 bss.74.d:0 "Suite aux récentes élections législatives au Yuan, les élections à la vice-présidence ont eu lieu aujourd'hui en République de Chine. Ancien commandant de la NRA et gouverneur de Taiwan, Chen Cheng a prêté serment en tant que vice-président au palais présidentiel de Nanjing. Chen a continué et a prononcé un discours annonçant les projets pour sa législature. En tant qu'anticommuniste convaincu, Chen plaide pour le maintien de la loi martiale et de la haute autorité militaire dans le pays, mais il a également exprimé son intérêt pour les réformes économiques, les projets de construction et la réforme agraire visant à améliorer les zones rurales en Chine. En raison de sa position relativement faible par rapport au président, on ne sait pas actuellement si ses politiques seront mises en oeuvre comme il l'avait prévu, mais en raison de sa longue amitié et de sa coopération avec Chiang Kai-shek, il est très probable qu'il obtiendra l'approbation."
 bss.74.a:0 "Intéressant."

 bss.75.t:0 "[GetNewspaperHeader]Sun Fo élu vice-président de la République de Chine"
 bss.75.d:0 "Suite aux récentes élections législatives au Yuan, les élections à la vice-présidence ont eu lieu aujourd'hui en République de Chine. L'ancien président de l'Examen Yuan et fils de Sun Yat-sen est arrivé en tête et a prêté serment en tant que vice-président au palais présidentiel de Nanjing. Sun était le favori parmi les électeurs en raison de ses tendances libérales, de son soutien à la suspension de la loi martiale et de son plaidoyer en faveur d'une unification pacifique avec le PCC. En raison de sa position relativement faible par rapport au président, on ne sait pas actuellement si ses politiques seront mises en oeuvre comme il l'avait prévu. Surtout en raison de sa rivalité avec Chiang Kai-shek, il est très peu probable qu'il obtienne l'approbation."
 bss.75.a:0 "Intéressant"

 bss.76.t:0 "Une délégation de Nanjing"
 bss.76.d:0 "À la surprise de tous, une délégation du gouvernement de Nanjing est arrivée aujourd'hui à la frontière de Pékin sous la direction de Sun Fo, fils du Dr Sun Yat-sen. Ils ont affirmé vouloir approcher notre gouvernement et proposer un pacte de non-agression entre nos nations, ainsi que la libération mutuelle des prisonniers de guerre de la guerre civile. Il n'est pas certain que leurs intentions soient une véritable réapproche pacifique ou simplement une tentative de nous tromper avec une poignée de belles paroles. Nous devons néanmoins les aborder avec prudence."
 bss.76.a:0 "Nous acceptons leur offre... pour l'instant."
 bss.76.b:0 "Ne faites jamais confiance à la Bourgeoise."

 bss.77.t:0 "Pékin accepte notre offre !"
 bss.77.d:0 "Le gouvernement de Pékin a accepté notre offre. Désormais, tous les prisonniers de guerre faits par les deux camps pendant la guerre civile sont transférés vers leurs territoires respectifs. Même si nous prétendons toujours être le seul gouvernement légitime de toute la Chine, ce traité était une étape nécessaire pour maintenir la paix en Asie de l'Est."
 bss.77.a:0 "Jusqu'à présent, nous n'avons eu aucune relation, maintenant nous en aurons de mauvaises - et c'est un progrès."

 bss.78.t:0 "Le PCC refuse notre offre !"
 bss.78.d:0 "Le gouvernement de Pékin a refusé notre offre, affirmant qu'il s'agissait d'une façade destinée à nous faire gagner du temps pour préparer une invasion du Nord. Il semble que le PCC ne soit pas du tout intéressé par une unification pacifique et cherche seulement à établir son contrôle sur l'ensemble de la Chine."
 bss.78.a:0 "Et ils prétendent être le parti des masses..."

 bss.79.t:0 "Le Mémorial National"
 bss.79.d:0 "Les nuages couvrent le soleil, le ciel devient lentement gris mais il ne pleut pas encore.\n\nCe n'est pas la première fois que Sun Fo visite le mémorial de Nanjing, mieux connu sous le nom de mausolée Sun-Yat-sen. Depuis la mort tragique et prématurée du Dr Sun Yat-sen, le « Père de la Chine moderne », Sun Fo visite chaque année ce lieu très spécial. Le 12 mars 1925, non seulement une nation entière perdait sa figure de proue, mais aussi un fils perdait son père bien-aimé. Mais cette visite est différente, car Zhesheng se présente désormais ici en tant que vice-président de la République de Chine, une Chine unifiée sur le papier mais dont les objectifs de la révolution chinoise n'ont toujours pas été atteints à ce jour. Devant le sarcophage de marbre, il commence tranquillement à parler à son père en lui promettant qu'il fera tout ce qui est en son pouvoir pour réaliser les rêves et les ambitions de la révolution chinoise. Après cela, il y a un moment de silence.\n\nAlors que Sun Fo quitte le Memorial Hall, les nuages commencent à s'estomper et le soleil réapparaît accompagné d'une brise soufflant sur les drapeaux républicains qui entourent le musée."
 bss.79.a:0 "Puisse-t-il briller pendant dix mille ans."

 bss.80.t:0 "La République de Chine propose l'unification"
 bss.80.d:0 "Après la victoire du Kuomintang dans la guerre civile chinoise, la plupart des responsables de notre gouvernement s'attendaient à ce que Nanjing soutienne le régime impérialiste fantoche de Saigon. Cependant, Nanjing a décidé d'éviter toute forme de soutien militaire à Saigon et a plutôt commencé à influencer le gouvernement du Sud-Vietnam, ce qui a abouti à un coup d'État contre l'ancien régime avec le VNQDD, le Kuomintang vietnamien qui partage la philosophie des Trois principes du peuple du Dr Sun Yat-sens, prenant le pouvoir.\n\nÀ Taipei, les gouvernements chinois et sud-vietnamiens, ainsi qu'une de nos délégations, ont proposé une nouvelle proposition pour l'unification pacifique du Vietnam. Le Vietnam unifié sera un État neutre en Asie du Sud-Est et sera dirigé par un gouvernement de coalition composé du Parti communiste vietnamien et du VNQDD qui proposera un programme pour la transition pacifique vers un État libre et démocratique."
 bss.80.a:0 "C'est quelque chose avec lequel nous pouvons travailler."
 bss.80.b:0 "Ce ne sont que des impérialistes déguisés."

 bss.81.t:0 "[GetNewspaperHeader]L'unification du Vietnam"
 bss.81.d:0 "Après de nombreuses semaines de négociations, la Conférence de Taipei a finalement pris fin, aboutissant à l'unification pacifique du Vietnam sous un gouvernement de coalition entre le Parti communiste du Vietnam et le Parti nationaliste vietnamien. Cet événement historique s'est produit grâce à l'initiative du gouvernement chinois à Nanjing, qui a non seulement accueilli la conférence mais a également joué un rôle important de médiateur pendant les négociations. Il y a quelques semaines, l'ancien gouvernement sud-vietnamien corrompu a été renversé par le VNQDD nouvellement réformé, le Kuomintang vietnamien, qui se présente comme un parti nationaliste mais aussi socialiste démocratique. Malgré les tensions passées, le gouvernement nord-vietnamien a apprécié ce changement de politique à Saigon et a accepté les conditions convenues à Taipei. Le nouveau gouvernement vietnamien travaille actuellement sur une nouvelle constitution démocratique pour l'État vietnamien unifié."
 bss.81.a:0 "Est-ce pour autant la paix pour l'Indochine ?"

 bss.82.t:0 "[GetNewspaperHeader]L'échec de la conférence de Taipei"
 bss.82.d:0 "Après de nombreuses semaines de négociations à Taipei, la conférence a finalement pris fin, entraînant le retour du gouvernement nord-vietnamien à Hanoï. Même si les espoirs étaient grands quant à une éventuelle négociation pacifique entre les deux Vietnam, le gouvernement nord-vietnamien a rejeté la proposition faite à Taipei, qui suggérait que le Parti communiste du Vietnam et le Parti nationaliste vietnamien formeraient un gouvernement de coalition et prépareraient la transition vers la démocratie. Les communistes ont critiqué le Parti nationaliste pour n'être que des « lèche-bottes capitalistes chinois » et ont rejeté toute coopération avec eux. Il semble qu'une fois de plus, la table des négociations n'a pas réussi à unir le Vietnam."
 bss.82.a:0 "Seule l'Épée unifiera désormais le pays."

 bss.83.t:0 "La République de Chine suggère NEATO"
 bss.83.d:0 "NEATO, abréviation de Organisation du Traité de l'Asie du Nord-Est, était une proposition du secrétaire d'État John Foster Dulles, qui considérait une telle alliance comme un contrepoids au communisme en Asie du Nord-Est dans les années 50. L'alliance aurait dû inclure nous, la Corée du Sud, le Japon et la République de Chine à Taiwan. Cependant, depuis que le Kuomintang a réussi à renverser la situation dans la guerre civile chinoise et qu'il est arrivé en tête, ils proposent désormais de relancer le projet et d'établir officiellement le NEATO en tant qu'organisation internationale chargée de stopper la propagation du communisme dans la région."
 bss.83.a:0 "Cela arrivera."
 bss.83.b:0 "C'est inutile."

 bss.85.t:0 "Les États-Unis déclinent"
 bss.85.d:0 "Les États-Unis ont déclaré qu'ils ne soutiendraient pas l'idée de NEATO, étant donné qu'il s'agirait simplement d'une extension du traité de défense mutuelle sino-américain, étant donné que le Japon n'est pas autorisé à avoir une armée et que la Corée du Sud n'a pas les ressources nécessaires pour fournir une armée forte. En outre, étant donné que l'OTASE existe déjà, ils ont affirmé qu'une autre organisation serait tout simplement inutile et causerait plus de confusion que n'importe quelle bonne organisation"
 bss.85.a:0 "Compréhensible"

 bss.84.t:0 "Les États-Unis acceptent l'idée"
 bss.84.d:0 "Les États-Unis ont accepté notre idée de relancer le NEATO. Ils ont déjà contacté le Japon et la Corée du Sud et la formalisation officielle du traité aura lieu d'ici quelques mois."
 bss.84.a:0 "Parfait."

 bss.86.t:0 "[GetNewspaperHeader]La création de NEATO"
 bss.86.d:0 "Lors d'une réunion du Conseil des ministres à Tokyo, l'Organisation du Traité de l'Asie du Nord-Est (NEATO) a été officiellement créée. Alors que le projet avait déjà été proposé par les États-Unis au début des années 50 mais avait finalement échoué, il est aujourd'hui relancé à l'initiative de la République de Chine. L'organisation vise à établir une sécurité collective contre d'éventuelles menaces communistes dans la région et a son siège à Nanjing, en République de Chine. Les États-Unis soutiennent cet effort et le considèrent comme une potentielle OTAN régionale pour l'Asie du Nord-Est. Cette formation a déjà été critiquée par les États communistes régionaux, la qualifiant d'effort inutile visant à perturber la paix dans la région."
 bss.86.a:0 "NÉATO ? Nous venons d'avoir l'OTASE"

 #KMT on Mainland 70s Events#

 ###Army Stuff###

 KMT_70s.3.t:0 "L'état de l'armée"
 KMT_70s.3.d:0 "La lutte du Kuomintang pour le pouvoir et la survie dépendait fortement de ses forces armées, l'ancienne Armée nationale révolutionnaire. Après la Seconde Guerre mondiale, la NRA a été réorganisée en forces armées de la République de Chine, mais même après la défaite du PCC, l'armée a conservé une grande autorité dans le pays. Formé sur le modèle soviétique par Chiang Ching-Kuo, il favorise la discipline, l'obéissance politique mais est aussi une source de corruption et de réseaux. De nombreux responsables de notre gouvernement ont appelé à des efforts de dépolitisation pour transformer la ROCA en une pure armée défensive qui ne doit pas être impliquée dans la politique chinoise, tandis que les partisans de la ligne dure soutiennent que sans forces fortes, nous sommes vulnérables aux menaces extérieures."
 KMT_70s.3.a:0 "Le PCC est parti, il n'est pas nécessaire de le maintenir."
 KMT_70s.3.b:0 "Les partisans de la ligne dure refusent les réformes."

 ### Events to be used later ###

 KMT_70s.1.t:0 "Mort de Chiang Kai-Shek"
 KMT_70s.1.d:0 "Le 5 avril 1975, à 23h50 TWT, Chiang Kai-shek, généralissime et président de la République de Chine, est décédé d'une crise cardiaque résultant d'une insuffisance rénale causée par une insuffisance cardiaque avancée et une pneumonie à l'hôpital général des anciens combattants de Taipei, Taiwan, à l'âge de 87 ans. La santé de Chiang s'est progressivement détériorée au cours des années 1970. Au moment de sa mort, il n'avait pas fait d'apparition publique depuis 1972, après avoir reçu un diagnostic de pneumonie et avoir subi une intervention chirurgicale pour une hypertrophie de la prostate. Son fils, Chiang Ching-kuo, fut également nommé son successeur cette même année."
 KMT_70s.1.a:0 "Zongtong Jianggong, votre héritage perdurera !"

 KMT_80s.1.t:0 "Mort de Chiang Ching-Kuo"
 KMT_80s_1.d:0 "Le 13 janvier 1988, le président taïwanais Chiang Ching-kuo est décédé d'une crise cardiaque, mettant fin à une période de quatre décennies au cours de laquelle les Chinois qui ont fui le continent en 1949 étaient les principaux dirigeants de la nation insulaire. Officiellement, il était âgé de 77 ans - même si, selon certains témoignages, il était plus âgé - et il était président depuis 1978. Chiang Ching-Kuo, fils et héritier politique du leader nationaliste chinois Chiang Kai-shek, est décédé dans un hôpital de Taipei, la capitale de Taiwan. Son successeur désigné, le vice-président Lee Teng-hui, 64 ans, lui a succédé. M. Lee, un économiste formé à l'Université Cornell qui a été maire de Taipei et gouverneur provincial, est le premier natif de Taiwan à devenir président. Des spécialistes chinois et américains de Taiwan ont exprimé hier leur inquiétude quant au fait que la mort de Chiang Ching Kuo, mettant fin à la dynastie familiale, pourrait conduire à l'instabilité sur l'île. "
 KMT_80s_1.a:0 "Jingguo Xiansheng, on se souviendra de vous !"

 KMT_Borderconflict.5.t:0 "Les bataillons soviétiques brisés"
 KMT_Borderconflict.5.d:0 "Nos troupes ont vaincu avec succès les troupes ennemies de l'Armée rouge lors d'une escarmouche à la frontière de Touva. Nos forces pourraient sécuriser Touva et libérer son peuple de la répression socialiste. C'est une grande victoire pour la République de Chine !"
 KMT_Borderconflict.5.a:0 "Huzzah !"

 KMT_Borderconflict.6.t:0 "Catastrophe à la frontière de Touva"
 KMT_Borderconflict.6.d:0 "Terrible nouvelle ! Notre bataillon, qui était censé tester les forces ennemies de l'Armée rouge à la frontière de Touva, a dû subir une défaite dévastatrice à la suite d'une escarmouche avec les troupes communistes. C'est une grande honte pour la République de Chine."
 KMT_Borderconflict.6.a:0 "Comment cela a-t-il pu arriver ?"

 KMT_Borderconflict.8.t:0 "Les troupes du KMT victorieuses à la frontière"
 KMT_Borderconflict.8.d:0 "Aujourd'hui, un bataillon du gouvernement du Kuomintang a attaqué par surprise notre patrouille frontalière à Touva. Nos forces ont été débordées et ont dû battre en retraite pour se ravitailler. Les troupes du KMT ont franchi la frontière et occupent désormais Touva. C'est une défaite dévastatrice pour l'Armée rouge."
 KMT_Borderconflict.8.a:0 "Horrible !"

 KMT_Borderconflict.7.t:0 "Les troupes du KMT vaincues par la patrouille de l'Armée rouge"
 KMT_Borderconflict.7.d:0 "Aujourd'hui, un bataillon du gouvernement du Kuomintang a attaqué par surprise notre patrouille frontalière à Touva. Nos forces ont été débordées au début, mais ont ensuite pris de l'ampleur en raison des milices de guérilla en Mongolie et ont forcé les troupes du KMT à battre en retraite pour se ravitailler. C'est une grande victoire pour l'Armée rouge et cela prouve que l'armée du Kuomintang n'est pas invincible."
 KMT_Borderconflict.7.a:0 "Parfait."

 KMT_Borderconflict.9.t:0 "Des bataillons indiens brisés"
 KMT_Borderconflict.9.d:0 "Nos troupes ont vaincu avec succès les troupes ennemies indiennes lors d'une escarmouche à la frontière de Tawang. Nos forces pourraient sécuriser Tawang et libérer sa population de la répression indienne. C'est une grande victoire pour la République de Chine !"
 KMT_Borderconflict.9.a:0 "Huzzah !"

 KMT_Borderconflict.10.t:0 "Catastrophe à la frontière de Tawang"
 KMT_Borderconflict.10.d:0 "Terrible nouvelle ! Notre bataillon qui était censé tester les forces indiennes ennemies à la frontière de Tawang a dû subir une défaite dévastatrice suite à une escarmouche avec les troupes indiennes. C'est une grande honte pour la République de Chine."
 KMT_Borderconflict.10.a:0 "Comment cela a-t-il pu arriver ?"

 KMT_Borderconflict.12.t:0 "Les troupes du KMT victorieuses à la frontière"
 KMT_Borderconflict.12.d:0 "Aujourd'hui, un bataillon du gouvernement du Kuomintang a attaqué par surprise notre patrouille frontalière à Tawang. Nos forces ont été débordées et ont dû battre en retraite pour se ravitailler. Les troupes du KMT ont traversé la frontière et occupent désormais Tawang. C'est une défaite dévastatrice pour notre pays."
 KMT_Borderconflict.12.a:0 "Horrible !"

 KMT_Borderconflict.11.t:0 "Les troupes du KMT vaincues par la patrouille indienne"
 KMT_Borderconflict.11.d:0 "Aujourd'hui, un bataillon du gouvernement du Kuomintang a attaqué par surprise notre patrouille frontalière à Tawang. Nos forces ont été débordées au début, mais ont ensuite pris de l'ampleur en raison des milices de guérilla au Tibet et ont forcé les troupes du KMT à battre en retraite pour se ravitailler. C'est une grande victoire pour l'armée indienne et cela prouve que l'armée du Kuomintang n'est pas invincible."
 KMT_Borderconflict.11.a:0 "Parfait."

