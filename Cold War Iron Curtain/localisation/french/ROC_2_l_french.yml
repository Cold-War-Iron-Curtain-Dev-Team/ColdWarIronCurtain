 progressbar_native_unrest_explanation_tt:0 "§gCette barre de progression vous montre l'état actuel de vos politiques envers la population indigène de Taiwan. Il varie de -30% à 30% et peut être modifié via des décisions, des événements et des focus nationaux dans votre arbre de focus. Si la barre de progression est principalement rouge, votre modificateur sera négatif, vous donnant un affaiblissement de la stabilité, du soutien de guerre et de la population recrutable. Si la barre de progression est principalement verte, votre modificateur sera positif, vous donnant un bonus de stabilité, de soutien de guerre et de population recrutable.§!"
 progressbar_kmt_unity_explanation_tt:0 "§gCette barre de progression vous montre l'état actuel de vos politiques concernant la structure interne et l'organisation du Kuomintang. Il varie de 0 à 100 %, mais est lié à l'esprit national dans votre onglet gouvernemental, qui varie de -20 à 20 %. Il peut être modifié via des décisions, des événements et des focus nationaux dans votre arbre de focus. Si la barre de progression est principalement rouge, votre esprit national a des valeurs négatives, qui sont représentées dans la barre de progression par des valeurs comprises entre 0 % et 50 %, vous donnant un affaiblissement de la limite de reddition, de la vitesse de recherche et de la force du contre-intel. Si la barre de progression est principalement verte, votre esprit national a des valeurs positives, qui sont représentées dans la barre de progression par des valeurs comprises entre 50 % et 100 %, vous donnant un buff pour la limite de reddition, la vitesse de recherche et la force de contre-intel.§!"
 progressbar_kmt_influence_explanation_tt:0 "§gCette barre de progression vous montre avec quelle efficacité (ou inefficacité) le Kuomintang a étendu son influence sur la société taïwanaise. Il varie de 0 à 100 %, mais est lié à l'esprit national dans votre onglet gouvernemental, qui varie de -20 à 20 %. Il peut être modifié via des décisions, des événements et des focus nationaux dans votre arbre de focus. Si la barre de progression est principalement rouge, votre esprit national a des valeurs négatives, qui sont représentées dans la barre de progression par des valeurs comprises entre 0 % et 50 %, vous donnant un affaiblissement du gain de pouvoir politique, de l'efficacité de la production, de la production d'usine et de la plage d'approvisionnement. Si la barre de progression est principalement verte, votre esprit national a des valeurs positives, qui sont représentées dans la barre de progression par des valeurs comprises entre 50 % et 100 %, vous donnant un bonus au gain de pouvoir politique, à l'efficacité de la production, à la production d'usine et à la plage d'approvisionnement.§!"
 progressbar_usa_influence_explanation_tt:0 "§gCette barre de progression vous montre l'influence des États-Unis d'Amérique dans votre pays, qui est également visible dans l'onglet Diplomatie. Cela va de 0 % d'influence à 100 % et selon l'influence des États-Unis, ils peuvent vous faire pression dans certaines négociations bilatérales, comme les accords commerciaux ou les subventions militaires. Si l'influence américaine échappe à tout contrôle et n'est pas combattue par le gouvernement, les forces pro-américaines au sein du Parti et de l'armée prendront des mesures contre l'administration actuelle.§!" 
 
