 CHI_VIE_Exchange_Program:0 "Échange étudiant sino-vietnamien"
 CHI_VIE_Exchange_Program_desc:0 "\nLe gouvernement chinois à Taipei a autorisé les étudiants du Sud-Vietnam à fréquenter les universités de la province de Taiwan, leur donnant ainsi une plus grande expertise et connaissance des difficultés sociales et politiques auxquelles ils sont confrontés au Vietnam."
 CHI_Protected_by_US_Fleet:0 "Protégé par la Septième Flotte"
 CHI_Protected_by_US_Fleet_desc:0 "\nLa septième flotte de la marine américaine s'est installée dans le détroit de Taiwan pour protéger l'île contre toute éventuelle invasion du continent communiste. Cela nous aidera grandement dans nos efforts défensifs contre le PCC, mais interférera également avec nos plans offensifs pour la reconquête du continent chinois."
 native_unrest_50s_taiwan:0 "Troubles autochtones"
 native_unrest_50s_taiwan_desc:0 "Lorsque l'Empire japonais capitula en 1945, l'île de Taiwan fut rétrocédée à la République de Chine. Le gouvernement du Kuomintang, favorable aux politiques de centralisation et de sinification, a déjà pris diverses mesures pour intégrer la province taïwanaise à l'État chinois, notamment en mettant l'accent sur la langue chinoise, l'histoire et un programme soutenant l'idéologie du Kuomintang. Cependant, étant donné que la majorité des Taïwanais sont déconnectés de l'influence chinoise depuis plus de cinq décennies, il est clair qu'ils ne sont pas disposés à s'adapter à toutes les doctrines énoncées par un gouvernement dominé par le continent.\n\n§RSi ce modificateur tombe en dessous de -30 % de stabilité et de soutien de guerre, le gouvernement du Kuomintang tombera et la République de Chine cessera d'exister.§!"
 kmt_party_unity_50s_taiwan:0 "Unité du Kuomintang"
 kmt_party_unity_50s_taiwan_desc:0 "\"La révolution chinoise a échoué\", déclarait Chiang Kai-shek en 1932. \"Mon seul désir aujourd'hui est de restaurer l'esprit révolutionnaire qu'avait le Kuomintang chinois en 1924\". Le Kuomintang avait accédé au pouvoir en promettant diverses réformes sociales et économiques au peuple chinois. Mais après la défaite de la clique de Beiyang, le parti s'est concentré uniquement sur le maintien et l'expansion de son pouvoir et sur la lutte contre le mouvement communiste chinois. Des bureaucrates inefficaces, la corruption, le factionnalisme et l'opportunisme ont contribué à la chute du Kuomintang et à sa défaite contre le Parti communiste sur le continent. Il est dans notre intérêt de mettre fin à cette misère et de prendre des mesures pour réformer le Kuomintang en un parti uni, efficace, libre d'opportunisme et de corruption, un parti de véritables patriotes chinois et un parti d'action et non de paroles."
 kmt_influence_50s_taiwan:0 "Influence du Kuomintang"
 kmt_influence_50s_taiwan_desc:0 "Afin d'assurer les chances du Kuomintang de se rétablir et de reprendre le continent aux mains des communistes, le gouvernement doit utiliser son pouvoir politique pour pénétrer tous les secteurs de la société afin d'approfondir le pouvoir du Kuomintang et sa légitimité en tant que gouvernement unique de la Chine. Le Kuomintang doit aligner l'île de Taiwan selon ses convictions et sa politique, sinon il mettra en péril ses chances de reprendre le continent."
 CHI_Supply_Node:0 "Mesures d'infrastructure d'urgence"
 CHI_Supply_Node_desc:0 "L'échec de l'offensive communiste nous a donné une certaine marge de manoeuvre pour nous regrouper et planifier une contre-attaque. Divers projets spéciaux de routes, de voies ferrées et de réseaux d'approvisionnement doivent être réalisés pour une structure logistique fiable qui assure l'approvisionnement de nos soldats en nourriture, vêtements et équipement." 
 
 
