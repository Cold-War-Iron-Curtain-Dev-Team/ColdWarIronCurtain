 CHI_Chiang_Li_Conflict_1:0 "Conflit Chiang-Li"
 CHI_Chiang_Li_Conflict_1_desc:0 "Chiang Kai-shek et Li Zongren ne partagent pas la meilleure histoire. Lorsque Li Zongren, Yan Xishan et Feng Yuxiang se sont révoltés contre le généralissime pendant la guerre des plaines centrales, Li a ouvertement déclaré le gouvernement de Nanjing illégitime mais a finalement perdu. Après la guerre, il s'allia à Chen Jitang dans le Guangdong mais renonça finalement à s'opposer à Chiang après l'invasion japonaise de la Mandchourie. Son succès pendant la guerre de Résistance et son influence croissante ont été considérés comme une menace par Chiang, ce qui l'a amené à le nommer au poste impuissant de directeur du quartier général. Après la guerre, il fut écarté du commandement au début de la guerre civile chinoise avant de devenir vice-président au nom de l'Assemblée nationale. Après que Chiang ait démissionné de son poste de président, Li a assumé la présidence et a même tenté de négocier avec les communistes pour mettre fin à la guerre civile dans des conditions pacifiques, mais n'a finalement pas cédé aux conditions du PCC. Après la chute de Nanjing, Chiang est resté méfiant et a saisi la plupart des actifs financiers du gouvernement dont Li avait désespérément besoin pour couvrir ses dépenses."
 
