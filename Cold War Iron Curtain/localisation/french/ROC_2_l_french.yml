##Decisions and Missions##

 Chinese_Civil_War_missions_category:0 "La guerre civile chinoise"
 Chinese_Civil_War_missions_category_desc:0 "\n\n\n\n\n\n£CHI_Texticon_Chinese_Civil_War\n\n\n\n\n\n\n\nLa guerre de Résistance est peut-être terminée, mais la Chine est encore loin de la paix. Après l'échec du Double Dixième Accord en 1946, la guerre civile entre le Parti communiste et le Kuomintang a repris, et désormais les deux camps se battent pour le contrôle de la Chine continentale. Quel que soit le vainqueur, cela déterminera l'avenir de la Chine et son rôle dans la guerre froide.\n"
 The_Chinese_Civil_war:0 "La fin de la guerre civile chinoise"
 The_Chinese_Civil_war_desc:0 "Après la percée en Mandchourie, l'Armée populaire de libération continue de marcher sur notre territoire, confrontée à une résistance timide de la part des Forces armées républicaines. Nos soldats sont épuisés et ne peuvent plus se battre longtemps. Si nous voulons sécuriser la Chine, nous devons agir rapidement."
 ADD_DAYS_TO_MISSION:0 "Ajouter DAYS|H jours à la Mission MISSION|H"
 Retreat_to_Manchuria:0 "Retraite en Mandchourie"
 The_Shanghai_Campaign:0 "Évacuation de Shanghai"
 The_Shanghai_Campaign_desc:0 "Il est clair que maintenir Shanghai est impossible et irréalisable ; nous devons immédiatement ordonner l'évacuation des troupes de Shanghai pour retourner sur la ligne de front principale."
 The_Hunan_Campaign:0 "La bataille de Changteh"
 The_Hunan_Campaign_desc:0 "La ville de Changteh a connu de grandes horreurs pendant la Seconde Guerre sino-japonaise. Il s'agit de notre principale base d'approvisionnement dans la région du Hunan, nous devons donc assumer tous les coûts si nous ne voulons pas que nos lignes d'approvisionnement en souffrent."
 The_Sichuan_Campaign:0 "La bataille de Chongqing"
 The_Sichuan_Campaign_desc:0 "La ville de Chongqing a servi de capitale provisoire pendant la guerre contre le Japon. Elle pourrait résister aux bombardements terroristes japonais, elle résistera donc également à la menace communiste."
 CHI_hunan_defection:0 "Le soulèvement de Changsha"
 CHI_hunan_defection_desc:0 "Dans des circonstances claires, la faction pro-paix au sein du Kuomintang, composée de personnalités du Hunan telles que l'actuel gouverneur du Hunan, Cheng Qian et Tang Shengzhi, souhaite une fin rapide de la guerre civile chinoise par une « libération » pacifique, une démarche politique contagieuse qui pourrait influencer l'allégeance d'autres cliques de seigneurs de guerre à notre gouvernement."
 CHI_Rebellious_Troops:0 "Troupes rebelles"
 CHI_sun_li_jen_training_troops:0 "Programme de formation de Sun Li-Jen pour la 201e Division"
 Changheng_campaign:0 "Campagne Chang-heng"
 Changheng_campaign_desc:0 "Avec l'échec du complot du soulèvement de Changsha, une invasion militaire du Hunan était nécessaire pour briser le KMT et consolider le reste du sud de la Chine. La campagne Chang-heng verrait l'APL sécuriser les principales villes du Hunan, en particulier Changsha et Hengyang, leur donnant ainsi une porte d'entrée vers Chongqing et Guangzhou."
 Defense_of_the_southwest:0 "Défense du Sud-Ouest"
 Defense_of_the_southwest_desc:0 "Avec la moitié de la Chine sous le contrôle des communistes, l'une des deux dernières grandes villes encore debout est Chongqing et Chengdu, toutes deux situées dans la région du sud-ouest de la Chine. Si Chongqing s'effondre, le reste du front sur le théâtre sud-ouest tombera également, tandis que les seigneurs de guerre du Xikang et du Yunnan pourraient commencer à se rebeller..."
 Defense_of_Liangguang:0 "Défense de Liangguang"
 Defense_of_Liangguang_desc:0 "L'actuelle capitale de la République, la ville de Guangzhou, est l'une des rares régions où l'industrie reste sous le contrôle de la République de Chine. Les zones situées à côté de la ville, considérées comme les provinces du Guangdong et du Guangxi (appelées ensemble Liangguang), doivent être prêtes à repousser l'APL et à ne l'empêcher en aucun cas de s'approcher de Guangzhou."
 Defense_of_the_Northwest:0 "Défense du Nord-Ouest"
 Defense_of_the_Northwest_desc:0 "La région du nord-ouest, confrontée à la menace et à la vulnérabilité d'une invasion de la RPC, constitue une bonne opportunité de mener une guerre d'usure contre les forces de l'APL pour le KMT tout en empêchant le PCC d'atteindre la province du Xinjiang, où le gouvernement provincial était dominé par des sympathisants communistes attendant l'arrivée de l'APL."
 CHI_keep_propaganda_machines_rolling:0 "Maintenir les machines de propagande en marche"
 CHI_keep_propaganda_machines_rolling_desc:0 "Jusqu'à la destruction des bandits communistes, notre département de propagande continuera à fonctionner."
