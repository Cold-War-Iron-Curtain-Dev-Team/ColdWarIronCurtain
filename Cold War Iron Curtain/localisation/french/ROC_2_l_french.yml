 propose_intervention_into_korea:0 "Proposer aux États-Unis une intervention en Corée"
 Korean_War_Escalation_50s_Taiwan_category:0 "La guerre de Corée"
 Korean_War_Escalation_50s_Taiwan_category_desc:0 "L'invasion de la Corée du Sud par le Parti des travailleurs coréens a été le tournant décisif qui a poussé les États-Unis à abandonner leur politique de neutralité et à poursuivre une politique d'endiguement du stalinisme et du communisme. Après diverses négociations et réunions, Washington nous a donné le feu vert pour intervenir dans la guerre de Corée au nom de la Corée du Sud, contre la menace rouge de Pyongyang et ses partisans du PCC. Des voix fanatiques au sein de l'équipe de planification des forces républicaines suggèrent que nous utilisions ce conflit pour reprendre le continent chinois au Parti communiste, mais cela nécessiterait des efforts logistiques plus importants et des renforts militaires, dont nous allons manquer si le temps ne joue pas en notre faveur. "
 join_the_fray_alone_against_Korea:0 "Rejoignez le combat en Corée"
 join_the_fray_alone_against_Korea_desc:0 "Notre équipe de planification a décidé qu'il serait préférable de déployer nos unités uniquement dans la péninsule coréenne, étant donné que notre armée se remet encore des conséquences de la guerre civile chinoise. Pour l'instant, nous défendrons nos alliés à Séoul et, après davantage de préparation, de réformes et de réorganisation, nous serons en mesure de reprendre le continent aux communistes à l'avenir."
 send_more_guns_to_south_korea:0 "Envoyez plus d'armes en Corée"
 abandon_south_korea:0 "Se retirer de la Corée du Sud"
 abandon_south_korea_desc:0 "La situation devient de plus en plus désastreuse chaque jour. Avec l'offensive sino-coréenne qui s'empare d'importantes villes clés du sud, il est peu probable que la guerre tourne à nouveau en notre faveur. Le mieux serait peut-être de réduire nos pertes et d'ordonner à nos unités de se retirer à Taiwan."
 launch_invasion_of_chinese_mainland:0 "Lancer une invasion du continent communiste"
 launch_invasion_of_chinese_mainland_desc:0 "Le moment est venu de retourner sur le continent chinois. Nos troupes en Birmanie et au Qinghai nous aideront dans notre lutte contre le Parti communiste et avec une grande partie des forces de l'APL distraites en Corée, cela pourrait être notre seule chance de reprendre le continent aux bandits rouges !"
 return_to_nanjing:0 "Retour à Nankin"
 XSM_replace_Ma_Bufang_as_governor:0 "Remplacer Ma Bufang au poste de gouverneur du Nord-Ouest"
 XIK_replace_Sun_Zhen_as_governor:0 "Remplacer Sun Zhen au poste de gouverneur du Sichuan"
 XIK_replace_Sun_Zhen_as_governor_desc:0 "Le dévouement et la loyauté de Sun Zhen envers le Kuomintang pendant la deuxième phase de la guerre civile ne doivent pas être oubliés. Notre administration estime cependant que le retour de la gouvernance locale du Sichuan à l'administration civile permettra d'intégrer davantage la province dans le pays. L'entourage du Généralissime a suggéré que nous relevions Sun Zhen de ses fonctions et lui accordions une retraite par capitalisation bien méritée. Nous renverrons l'ancien président provincial Wang Lingji pour remplacer Sun dans le Sichuan afin de garantir une administration efficace."
 YUN_replace_Sun_Du_as_governor:0 "Remplacer Sun Du au poste de gouverneur du Yunnan"
 YUN_replace_Sun_Du_as_governor_desc:0 "Sun Du a succédé à Lu Han, indigne de confiance, après l'invasion soviétique de la Mandchourie. Il n'a peut-être pas travaillé contre le gouvernement central pendant la dernière étape de la guerre civile, mais son commandement a été terne. De nombreux soldats et hauts fonctionnaires ont fait défection vers le Parti communiste sous sa direction. Même s'il est resté fidèle à l'essentiel, il serait peut-être préférable de remplacer son administration militaire par une administration plus civile, garantissant une gouvernance locale sans force pour le Yunnan."
 HNN_replace_Ding_Delong_as_governor:0 "Remplacer Ding Delong au poste de gouverneur du Hunan"
 HNN_replace_Ding_Delong_as_governor_desc:0 "Malgré la loyauté de Ding Delong envers le gouvernement central et le parti, notre administration estime que le retour de la gouvernance locale du Hunan à l'administration civile intégrera davantage la province dans le pays. L'entourage du Généralissime a suggéré que nous le relevions de ses fonctions et que nous renvoyions le général Song Xilian au Hunan pour garantir une administration civile efficace."
 GXC_replace_Li_Zongren_as_governor:0 "Remplacer Li Zongren au poste de gouverneur du Guangxi"
 GXC_replace_Li_Zongren_as_governor_desc:0 "Li Zongren a défié Chiang pendant des décennies en tant que gouverneur du Guangxi ; Cependant, la clique du Guangxi est devenue très influente dans la politique du gouvernement central et nous ne pouvons donc pas nous permettre de le remplacer facilement par un gouverneur pro-Chiang. Cependant, l'une des figures les plus marquantes de la clique du Guangxi, outre Li Zongren et Bai Chongxi, n'est autre que Li Pinxian. Li était gouverneur civil du Guangxi avant le retour de Li Zongren. Il serait un excellent candidat pour le choix du gouverneur du Guangxi, car cela affaiblit en partie l'influence de Li Zongren dans le Guangxi mais empêche en même temps Li de lancer une rébellion à grande échelle, car l'un de ses associés serait le gouverneur."
 SHX_Retirement_of_Yan_Xishan_as_governor:0 "La retraite de Yan Xishan"
 SHX_Retirement_of_Yan_Xishan_as_governor_desc:0 "Yan Xishan, autrefois un chef de guerre éminent en Chine, n'est plus qu'un simple homme âgé et fragile, dont les ravages de la guerre civile chinoise n'ont pas encore été récupérés dans la région et son autorité affaiblie sur le Shanxi. Il sera remplacé par Xu Yongchang, un ancien membre de la clique du Shanxi qui a été représentant chinois à la Conférence sur la reddition du Japon et homme politique local dans le Shanxi, après l'expulsion du Parti communiste de Taiyuan."
 CHI_recapture_nanjing:0 "Reconquérir Nankin"
 CHI_recapture_nanjing_desc:0 "Nanjing, la capitale de la République, a été le brillant exemple de la modernisation et de l'industrialisation chinoises après l'Expédition du Nord. L'occupation communiste doit cesser le plus tôt possible."
 CHI_recapture_wuhan:0 "Reconquérir Wuhan"
 CHI_recapture_wuhan_desc:0 "Wuhan, berceau de la révolution Xinhai, est l'une des villes les plus importantes de Chine au sens symbolique. Étant donné que le Parti communiste prétend également être le successeur de la Révolution de 1911, il est crucial que nous le reprenions des mains des bandits."
 CHI_recapture_beiping:0 "Reprendre Pékin"
 CHI_recapture_beiping_desc:0 "Lors de la chute de Pékin aux mains des forces communistes en 1948, ils ont commencé à faire de la ville leur nouvelle capitale tout en poursuivant la guerre civile contre nous dans les plaines centrales. La reprise de Pékin portera le coup final aux forces communistes épuisées."
 CHI_move_capital_back_to_nanjing:0 "Déplacer la capitale à Nanjing"
 CHI_move_capital_back_to_nanjing_desc:0 "La menace d'un retour des forces communistes à Nanjing ayant disparu et l'isolement de la ville du front principal, nous pouvons désormais retourner en toute sécurité dans notre ancienne capitale et y reprendre le commandement pendant que les communistes se replient précipitamment vers le nord. La victoire est en vue ; poursuivons-le."
 KMT_Reform_the_Justice_Investigation_Bureau:0 "Réformer le Bureau des enquêtes judiciaires"
 KMT_Reform_the_Justice_Investigation_Bureau_desc:0 "Le Bureau d'enquête judiciaire est le service de contre-espionnage et d'enquête criminelle de la République de Chine. Une réforme est nécessaire de toute urgence pour lutter contre la corruption et les injustices massives dans les opérations du JIB."
 KMT_Launch_Investigations_into_the-Army:0 "Lancement d'enquêtes sur l'armée"
 KMT_Launch_Investigations_into_the-Army_desc:0 "Le Bureau d'enquête judiciaire et le Bureau des renseignements militaires de la République de Chine mèneront immédiatement des enquêtes massives sur certains individus de l'armée de la République de Chine qui ont exprimé des opinions politiques contraires aux idéaux de l'État. La discipline sera maintenue."
 KMT_Send_Suspect_Officers_to_the_Frontier:0 "Envoyer les agents suspects à la frontière"
 KMT_Send_Suspect_Officers_to_the_Frontier_desc:0 "Tous les officiers considérés comme dissidents politiques ou impliqués dans des affaires de corruption ou toute autre activité illégale bénéficieront d'un voyage tous frais payés vers un nouveau commandement dans l'est de la Chine, où ils profiteront de la vie frontalière."
 KMT_Mass_Purges:0 "Purge massive"
 KMT_Mass_Purges_desc:0 "Il est nécessaire de se débarrasser de ceux qui ont déclaré leur déloyauté et leur opposition au régime au pouvoir du Kuomintang ; ces individus seront arrêtés, jugés, condamnés et « traités » en conséquence."
 KMT_acquire_US_advisors:0 "Acquérir des conseillers américains"
 KMT_acquire_US_advisors_desc:0 "Les États-Unis d'Amérique sont notre principal partenaire commercial et diplomatique. Demander davantage de conseillers contribuera à améliorer notre armée et à préparer les troupes aux futurs conflits en Asie de l'Est."
 KMT_training_brigades:0 "Brigades d'entraînement"
 KMT_training_brigades_desc:0 "Le plan de la Soixante Division se concentrera sur la formation d'une force d'élite adaptable et résistante. Au lieu de compter sur la quantité, comme l'a fait Mao, nous tenterons une fois de plus de constituer une force de combat qualitative."
 KMT_adopt_new_army_structure:0 "Adopter une nouvelle structure militaire"
 KMT_adopt_new_army_structure_desc:0 "Une nouvelle structure militaire sera développée, utilisant divers éléments des anciennes structures militaires que nous avons utilisées et qui ont été développées par l'Allemagne, les Soviétiques et les Américains."
 KMT_conclude_the_sixty_divisions_plan:0 "Conclure le plan des soixante divisions"
 KMT_conclude_the_sixty_divisions_plan_desc:0 ""
 KMT_reform_logistical_system:0 "Réformes logistiques"
 KMT_reform_logistical_system_desc:0 "Notre logistique actuelle est insuffisante pour approvisionner et mettre nos armées sur le front pour être pleinement efficaces au combat ; nous allons changer cela et procéder aux réformes logistiques indispensables."
 KMT_devise_new_methods_for_sustaining_army_structure:0 "Concevoir de nouvelles méthodes pour maintenir le plan Alpha"
 KMT_devise_new_methods_for_sustaining_army_structure_desc:0 "Même si nous avons tenté de surmonter tous les défis auxquels nous sommes confrontés pour maintenir la structure actuelle de l'armée, le système présente encore des défauts majeurs et un changement dans la structure de l'armée est donc indispensable."
 KMT_conclude_the_ninety_divisions_plan:0 "Conclure le plan des quatre-vingt-dix divisions"
 KMT_conclude_the_ninety_divisions_plan_desc:0 ""
 International_Diplomacy_category:0 "Diplomatie internationale"
 International_Diplomacy_category_desc:0 "\n\n\n\n\n\n£CHI_Texticon_International_Policy\n\n\n\n\n\n\n\nLa Chine était autrefois le centre du monde, et tous les coins du monde venaient au pays pour lui rendre hommage. Aujourd'hui, les temps changent rapidement et nous avons perdu notre statut autrefois prestigieux au profit des puissances occidentales. Que nous souhaitions poursuivre des politiques purement anticoloniales ou collaborer avec elles, nous devons nous assurer de laisser une marque sur le monde par notre influence et notre pouvoir croissants. Notre place dans le monde ouvrira la voie à de nouvelles opportunités dans le futur."
 request_for_better_treatment_of_chinese_in_vietnam:0 "Demander un meilleur traitement pour les Chinois au Vietnam"
 request_for_better_treatment_of_chinese_in_vietnam_desc:0 ""
 expand_the_indochina_military_mission_to_indochina_nations:0 "Étendre la mission militaire en Indochine à d'autres nations indochinoises"
 expand_the_indochina_military_mission_to_indochina_nations_desc:0 ""
