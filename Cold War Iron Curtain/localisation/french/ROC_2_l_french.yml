 #National Focuses and Descriptions#

 ###KMT CIVIL WAR TREE#

 CHI_CIVILWAR_the_chinese_civil_war:0 "La guerre civile chinoise"
 CHI_CIVILWAR_the_chinese_civil_war_desc:0 "Après la défaite de l'Empire japonais, la guerre civile entre le Kuomintang et le Parti communiste chinois a repris en 1946. Le PCC, avec l'aide de l'URSS, a pris le contrôle de la Mandchourie et a brisé les lignes nationalistes en 1948, devenant finalement une menace sérieuse pour le Kuomintang. Le PCC a actuellement le dessus et le gouvernement a déjà élaboré des plans d'évacuation vers l'île de Taiwan, qui a été restituée à la République après la fin de la Seconde Guerre mondiale. Peu importe qui sortira victorieux, il est certain que cela déterminera le rôle et l'avenir de la Chine dans la guerre froide."

 CHI_CIVILWAR_abandon_mainland:0 "Préparation à l'inévitable"
 CHI_CIVILWAR_abandon_mainland_desc:0 "Le PCC est tout simplement trop fort pour le moment. Nous devons réduire nos pertes et nous retirer du continent. Depuis Taiwan, nous finirons par commencer la reconquête du continent contre les bandits communistes après avoir résolu nos problèmes actuels."

 CHI_CIVILWAR_Relocate_the_government_to_Taipei:0 "Réformer le commandement de la garnison de Taiwan"
 CHI_CIVILWAR_Relocate_the_government_to_Taipei_desc:0 "Notre retrait à Taiwan nous oblige à établir notre siège administratif temporel sur l'île. Des changements et des réformes plus importants doivent être apportés à notre force d'occupation actuelle à Formose, afin de garantir une gouvernance efficace et anticommuniste."

 CHI_CIVILWAR_relocate_gold_reserves:0 "Délocalisation des réserves d'or"
 CHI_CIVILWAR_relocate_gold_reserves_desc:0 "Depuis l'année dernière, le gouvernement a élaboré des plans pour évacuer le continent avec l'or et les trésors qui y sont encore stockés. Nous utiliserons les réserves d'or pour empêcher les opérations économiques du PCC d'effectuer des investissements précoces et nous les utiliserons pour lutter contre le problème de l'hyperinflation."

 CHI_CIVILWAR_relocate_important_institutions:0 "Déplacer les établissements universitaires"
 CHI_CIVILWAR_relocate_important_institutions_desc:0 "L'Academia Sinica, le Musée national du Palais, l'Université Tsing-Hua et diverses autres institutions seront transférés à Taiwan. Des érudits, des documents et des livres seront apportés pour assurer le développement culturel et scientifique de Taiwan. Nous ne voulons pas imaginer ce qui se passerait s'ils tombaient entre les mains des communistes..."

 CHI_CIVILWAR_evacuate_civilians:0 "Évacuer les civils"
 CHI_CIVILWAR_evacuate_civilians_desc:0 "Nous commencerons à évacuer les civils du continent vers Taiwan par voie maritime et aérienne. Des centaines de milliers de civils chinois devraient être déplacés. Seul le temps nous dira combien exactement nous pourrons être à l'abri de la menace communiste imminente."

 CHI_CIVILWAR_fortify_taiwan_desc:0 "Nous ferons de Taiwan une forteresse qui ne tombera jamais aux mains de Mao et de ses acolytes. Nous établirons des bases aériennes et des fortifications sur l'île pour garantir que la Chine libre survivra et reviendra un jour sur le continent !"
 CHI_CIVILWAR_fortify_taiwan:0 "Fortifier Taïwan"

 CHI_CIVILWAR_fortify_hainan:0 "Fortifier Hainan"
 CHI_CIVILWAR_fortify_hainan_desc:0 "L'île de Hainan pourrait être approuvée comme base supplémentaire pour de futures opérations contre le PCC. Nous devons augmenter les mesures défensives sur l'île pour garantir qu'aucune force de l'APL ne puisse jamais nous la prendre !"

 CHI_CIVILWAR_our_darkest_hour:0 "Notre heure la plus sombre"
 CHI_CIVILWAR_our_darkest_hour_desc:0 "La situation semble désespérée mais nous ne pouvons pas abandonner ! Nous retournerons un jour sur le continent et libérerons le peuple du Parti communiste. Pour la République de Chine ! Pour la Révolution !"

 CHI_CIVILWAR_defend_mainland:0 "La bataille pour le continent continue !"
 CHI_CIVILWAR_defend_mainland_desc:0 "Nous nous battrons jusqu'au dernier homme ! Nous ne pouvons pas permettre aux communistes de gagner davantage de terres, sinon la Chine et ses paysans subiront le même sort que les paysans de l'Union soviétique. Nous continuerons à nous battre jusqu'à ce que le PCC soit vaincu une fois pour toutes. A bas les bandits russes, opposez-vous au communisme, éliminez Zhu et Mao et appliquez les Trois principes du peuple !"

 CHI_CIVILWAR_call_for_foreign_support:0 "Appel au soutien étranger"
 CHI_CIVILWAR_call_for_foreign_support_desc:0 "Nous avons désespérément besoin du soutien de l'Occident si nous voulons vaincre le PCC. Nous conseillerons à nos représentants aux Nations Unies à New York de demander l'aide des autres membres du Conseil de l'ONU tels que les États-Unis, les Britanniques et les Français."

 CHI_CIVILWAR_western_guns:0 "Demander des armes aux nations occidentales"
 CHI_CIVILWAR_western_guns_desc:0 "La Seconde Guerre mondiale a été marquée par de grands progrès technologiques dans la fabrication d'armes. Le M14 américain et le L1A1 britannique sont d'excellentes armes et si nous parvenions à nous en emparer, cela bénéficierait grandement à l'effort de guerre. Nous demanderons aux États-Unis et aux Britanniques s'ils sont prêts à nous soutenir avec leurs nouvelles armes."

 CHI_CIVILWAR_request_american_planes:0 "Avions multirôles américains"
 CHI_CIVILWAR_request_american_planes_desc:0 "Le Groupe de Volontaires Américains en Chine pendant la Guerre de Résistance s'est révélé très efficace, désorganisant les avions japonais et aidant nos forces terrestres. Nous demanderons divers P-51 Mustang qui aideront nos troupes terrestres contre l'APL."

 CHI_CIVILWAR_request_army_fonds:0 "Fonds pour les forces armées"
 CHI_CIVILWAR_request_army_fonds_desc:0 "Nous avons besoin de plus d'argent pour l'effort de guerre. Grâce aux prêts américains (que nous finirons par rembourser), nous serons en mesure de produire davantage d'armes et d'autres machines pour approvisionner nos troupes."

 CHI_CIVILWAR_emergency_military_conference:0 "Conférence militaire d'urgence"
 CHI_CIVILWAR_emergency_military_conference_desc:0 "La situation est désespérée pour la République, une conférence militaire d'urgence doit être organisée pour déterminer la stratégie globale des Forces Armées. Le sort du pays est entre nos mains, nous sortirons victorieux de cette guerre civile !"

 CHI_CIVILWAR_Central_Command_CKS:0 "Centraliser le commandement de l'armée"
 CHI_CIVILWAR_Central_Command_CKS_desc:0 "La corruption et l'incompétence sont le résultat du fait que nos commandants font ce qu'ils pensent être juste et bénéfique. Assez de ça ! Les décisions seront prises par le généralissime Chiang Kai-shek et son proche état-major pour garantir une efficacité maximale des armées sur le terrain. Tous les commandants qui refusent ou ne pensent qu'à leurs propres avantages seront démis de leurs fonctions !"

 CHI_CIVILWAR_anti_ccp_propaganda:0 "Campagnes de propagande"
 CHI_CIVILWAR_anti_ccp_propaganda_desc:0 "Afin d'accroître le soutien populaire à notre cause, nous devrons lancer des campagnes de propagande contre le PCC, démontrant au public que ses pensées utopiques ne sont que des appâts et que ses véritables intentions ne sont pas d'aider les paysans et les soldats chinois, mais de donner le pouvoir à une élite totalitaire qui supervisera l'État et réprimera toute dissidence."

 CHI_CIVILWAR_expand_airbases:0 "Développer les bases aériennes"
 CHI_CIVILWAR_expand_airbases_desc:0 "Les communistes ont pris la plupart de nos bases aériennes, nous devons encore agrandir celles-ci pour garantir que nos avions décollent réellement et puissent soutenir nos courageux soldats au sol."

 CHI_CIVILWAR_crush_rural_peasant_revolts:0 "Écraser les révoltes paysannes"
 CHI_CIVILWAR_crush_rural_peasant_revolts_desc:0 "Les différentes révoltes paysannes dans notre pays deviennent de plus en plus dangereuses. Nous devons écraser ces révoltes si nous ne voulons pas que les paysans trahissent nos soldats sur le terrain. Cependant, cela réduirait considérablement le soutien populaire à notre égard et affecterait considérablement l'effort de reconstruction."

 CHI_CIVILWAR_concessions_to_peasants:0 "Concessions aux paysans"
 CHI_CIVILWAR_concessions_to_peasants_desc:0 "Nous devons négocier avec les paysans pour obtenir leur soutien à notre gouvernement. Nous leur promettons diverses réformes agraires et sociales à leur bénéfice après avoir écrasé l'insurrection communiste pour les convaincre que le Kuomintang est le parti de droite du paysan chinois et non le PCC totalitaire."

 CHI_CIVILWAR_amnesty_for_ccp_deserters:0 "Offrir l'amnistie aux déserteurs communistes"
 CHI_CIVILWAR_amnesty_for_ccp_deserters_desc:0 "Avec le vent qui tourne encore une fois, nous faisons de grands progrès dans l'effort de guerre et sommes en route vers Pékin. De nombreux soldats et officiers communistes désertent l'APL et le gouvernement estime que leurs compétences et leurs effectifs pourraient nous aider à vaincre le reste du PCC plus rapidement. "

 CHI_CIVILWAR_Sweet_Victory:0 "Toujours « victorieux » !"
 CHI_CIVILWAR_Sweet_Victory_desc:0 "Même s'il ne s'agit pas d'une victoire totale, nous avons finalement assuré notre position en Chine centrale. L'APL, qui n'est plus que l'ombre d'elle-même, se cache désormais en Mandchourie avec le soutien soviétique, mais ne détient aucune puissance industrielle significative. Nous sommes toujours victorieux !"

 CHI_CIVILWAR_revive_the_gexin_reform_movement:0 "Relancer le mouvement de réforme Gexin"
 CHI_CIVILWAR_revive_the_gexin_reform_movement_desc:0 "Le mouvement de réforme Gexin, composé principalement de jeunes de la faction Whampoa et de la clique du Central Club, a éclaté en 1944, montrant au peuple comment le gouvernement du Kuomintang est capable de se réformer tout en ne se débarrassant pas de son programme de contrôle de la Chine. Nous devons soutenir sa renaissance afin d'ouvrir la voie aux réformes avec son aide."

 CHI_CIVILWAR_temporal_military_reorganization:0 "Réorganisation militaire temporelle"
 CHI_CIVILWAR_temporal_military_reorganization_desc:0 "Avec la victoire dans le sud de la Chine, nous avons réussi à renforcer le moral et l'élan de nos généraux et officiers, nous allons entamer une réorganisation minimale et rapide afin d'utiliser une structure militaire plutôt petite pour le moment, sans avoir besoin d'une structure militaire aussi excessive et grande à la suite des millions de désertions de ces dernières années."

 CHI_CIVILWAR_form_the_national_security_bureau:0 "Former le Bureau de la sécurité nationale"
 CHI_CIVILWAR_form_the_national_security_bureau_desc:0 "Le Bureau National d'Enquêtes et de Statistiques a commis suffisamment d'erreurs en matière de renseignement pendant la guerre civile ! Nous ne pouvons plus compter sur cette seule police secrète pour rassembler des renseignements militaires, nous devons former une nouvelle branche de la police secrète qui aiderait à coordonner les autres branches de la police secrète au sein de la République de Chine, permettant ainsi d'augmenter les chances de succès des opérations d'espionnage."

 CHI_CIVILWAR_discredit_the_CCP_internationally:0 "Discréditer le Parti communiste à l'échelle internationale"
 CHI_CIVILWAR_discredit_the_CCP_internationally_desc:0 "Afin de convaincre le monde que notre guerre contre le PCC vise à libérer le peuple de la brutalité des communistes, nous devons déployer des journalistes sur les lieux des atrocités commises par les communistes, nous les diffuserons ensuite au monde et leur montrerons ce pour quoi nous nous battons."

 CHI_CIVILWAR_drive_the_bandits_back_north:0 "Marche vers le nord"
 CHI_CIVILWAR_drive_the_bandits_back_north_desc:0 "Le cours de la guerre tourne lentement en notre faveur, les communistes perdent peu à peu leur élan alors qu'ils tentent de lancer hommes après hommes contre nos bastions retranchés, il est temps de commencer à les repousser vers le nord."

 CHI_CIVILWAR_pressure_end_to_arms_embargo:0 "La fin de l'embargo sur les armes"
 CHI_CIVILWAR_pressure_end_to_arms_embargo_desc:0 "Alors que la mission Marshall faisait peu de progrès vers la fin de la guerre civile chinoise, les Américains ont décidé de nous imposer un embargo sur les armes et ont arrêté toute importation d'armes en provenance d'eux, comme une ultime tentative pour nous forcer à faire un compromis avec les communistes à la table des négociations. Maintenant que le soutien à notre égard atteint un niveau sans précédent aux États-Unis, nous devons utiliser leur soutien pour faire pression sur le gouvernement américain afin qu'il mette fin à l'embargo sur les armes et qu'il continue de nous soutenir, plutôt que de laisser la Chine tomber aux mains des communistes sous influence soviétique."

 CHI_CIVILWAR_reapproach_li_zongren:0 "Réapprocher Li Zongren"
 CHI_CIVILWAR_reapproach_li_zongren_desc:0 "Avec l'aide de Yan Xishan, les tensions entre la nouvelle clique du Guangxi et le gouvernement central se sont apaisées alors que nous faisons face à un ennemi commun qui souhaite détruire notre République."

 CHI_CIVILWAR_coup_li_zongren:0 "Li Zongren"
 CHI_CIVILWAR_coup_li_zongren_desc:0 "Maintenant que les tensions avec Li sont faibles, nous pouvons facilement le surprendre et le forcer à quitter la Chine grâce à un coup d'État militaire sur Guangzhou, nous rétablirons alors Chiang comme président légitime de la République et aurons le plein contrôle des affaires du gouvernement."

 CHI_CIVILWAR_seize_bund_concessions:0 "S'emparer des concessions du Bund de Shanghai"
 CHI_CIVILWAR_seize_bund_concessions_desc:0 "L'ère de l'extraterritorialité étrangère et des enclaves coloniales le long du Huangpu doit prendre fin dès maintenant. En réquisitionnant les entrepôts, les quais et les actifs bancaires sous administration étrangère le long du Bund, nous obtenons les capitaux et les infrastructures maritimes dont la République a désespérément besoin pour soutenir l'effort de guerre de la République."
 
 CHI_CIVILWAR_halt_money_printing:0 "Arrêtez les presses à imprimer de l'argent"
 CHI_CIVILWAR_halt_money_printing_desc:0 "L'hyperinflation ronge les fondements de notre société plus rapidement que les divisions ennemies ne peuvent progresser. Mettre fin à l'émission excessive de monnaie fiduciaire et introduire des contrôles monétaires stricts est le seul moyen de restaurer la confiance du public dans le yuan et d'éviter l'effondrement économique."
 
 CHI_CIVILWAR_mobilize_sichuan_industry:0 "Mobiliser l'industrie du Sichuan"
 CHI_CIVILWAR_mobilize_sichuan_industry_desc:0 "Abrité par de formidables cols de montagne, le Sichuan a servi de forteresse de guerre contre les Japonais. Aujourd'hui, nous devons une fois de plus transformer la province en une puissance de fabrication lourde et de production d'armes, en veillant à ce que nos lignes de front ne soient jamais à court d'obus et de fusils."
 
 CHI_CIVILWAR_combat_black_market:0 "Combattre le marché noir"
 CHI_CIVILWAR_combat_black_market_desc:0 "Des syndicats corrompus, des accapareurs et des profiteurs siphonnent les céréales, les médicaments et le matériel de guerre du secteur public vers des réseaux de contrebande illicites. Une répression impitoyable avec des pouvoirs étendus de police militaire garantira que chaque sac de céréales nourrit les soldats et les citoyens fidèles plutôt que les coffres du marché noir."
 
 CHI_CIVILWAR_Fortify_Liangguang:0 "Fortifier Liangguang"
 CHI_CIVILWAR_Fortify_Liangguang_desc:0 "Le Guangdong et le Guangxi représentent notre bouée de sauvetage vitale pour la logistique maritime et le commerce avec le monde extérieur. La fortification des ports, des principaux passages fluviaux et des réseaux routiers côtiers établira un bastion inattaquable dans le sud si nos lignes défensives centrales fléchissent."

 CHI_CIVILWAR_Integrate_Xibei_Units:0 "Intégrer les forces Xibei"
 CHI_CIVILWAR_Integrate_Xibei_Units_desc:0 "Les seigneurs de guerre Ma dominent depuis longtemps les étendues arides du Nord-Ouest grâce à leur cavalerie féroce et chevronnée. Intégrer ces divisions régionales directement dans la hiérarchie de l'Armée nationale révolutionnaire renforcera notre flanc nord contre les incursions communistes."

 CHI_CIVILWAR_Integrate_Southwestern_Units:0 "Absorber les forces au Yunnan et au Sichuan"
 CHI_CIVILWAR_Integrate_Southwestern_Units_desc:0 "Les cliques régionales du sud-ouest ne peuvent plus fonctionner comme des fiefs autonomes. En intégrant les contingents du Yunna et du Sichuan au commandement central et en standardisant leurs armements, nous forgeons une force de combat cohésive et unifiée."

 CHI_CIVILWAR_Reasssurances_to_Yan_Xishan:0 "Promesses à Yan Xishan"
 CHI_CIVILWAR_Reasssurances_to_Yan_Xishan_desc:0 "Le « gouverneur modèle » du Shanxi reste profondément prudent, préservant son pouvoir régional tout en faisant face à une intense pression communiste à sa porte. Garantir son autonomie administrative et lui fournir une aide militaire moderne lui assurera sa solidité aux côtés du gouvernement central."

 CHI_CIVILWAR_Nanjing_Reigns_Supreme:0 "Nanjing règne en maître"
 CHI_CIVILWAR_Nanjing_Reigns_Supreme_desc:0 "Grâce à la diplomatie, à la coercition et à la réorganisation en temps de guerre, le factionnalisme qui tourmentait la République a été freiné. Le généralissime et l'appareil central de Nanjing détiennent désormais une autorité absolue sur le commandement politique, industriel et militaire dans toute la Chine contrôlée par les nationalistes."

 CHI_CIVILWAR_leverage_the_red_scare_in_washington:0 "Tirer parti de la peur rouge à Washington"
 CHI_CIVILWAR_leverage_the_red_scare_in_washington_desc:0 "La montée du sentiment anticommuniste au Capitole constitue une opportunité inestimable. En définissant notre lutte comme une défense de première ligne contre l'expansion communiste mondiale, nous pouvons débloquer d'importants prêts militaires américains, des surplus de matériel avancé et un soutien économique."

 CHI_CIVILWAR_operation_paper:0 "Document d'opération"
 CHI_CIVILWAR_operation_paper_desc:0 "La Mandchourie sert de moteur industriel pour alimenter les armées communistes. En infiltrant des agents de renseignement et en organisant des cellules de guérilla anticommuniste locales derrière les lignes ennemies, nous pouvons lancer des campagnes de sabotage ciblées contre les réseaux électriques, les réseaux ferroviaires et les usines de fabrication lourde dans tout le Nord-Est."
 
 
 #KMT on Taiwan 50s#

 CHI_Isolate_Chiangs_enemies:0 "Isoler les ennemis de Chiang"
 CHI_Isolate_Chiangs_enemies_desc:0 "Avec la chute du continent, les différentes cliques et seigneurs de guerre ont perdu leur base de soutien au sein de notre gouvernement et s'avèrent désormais moins un obstacle aux réformes. Le projet du généralissime de réformer le Kuomintang se heurtera à une forte résistance de la part de ces groupes, mais nous ne pouvons prendre aucun risque qui pourrait menacer la transformation du parti. Nous mettrons sur la touche les opposants de Chiang en les assignant à des postes symboliques mais politiquement sans valeur au sein de notre gouvernement."

 CHI_Establish_the_Central_Reform_Committee:0 "Créer le Comité central de réforme"
 CHI_Establish_the_Central_Reform_Committee_desc:0 "Nous n'avons pas perdu la guerre civile à cause de facteurs militaires, mais plutôt à cause du pouvoir organisationnel supérieur du PCC. Le Comité central de réforme (CRC) existera en tant que nouvelle institution centrale du KMT, dans le but de réinventer le Parti et d'en faire une institution démocratique révolutionnaire. Le but ultime du CRC est la renaissance du parti, afin qu'il puisse servir de base solide à la reprise du continent face aux bandits communistes !"

 CHI_create_advisory_group:0 "Introduire des groupes consultatifs"
 CHI_create_advisory_group_desc:0 "Nous créerons un groupe consultatif de vingt-cinq personnes, avec Zhang Qiyun comme secrétaire général, qui assistera le Comité central de réforme. Ce nouvel organe consultatif sera chargé de divers sous-comités et agences spécialisés pour mener à bien des tâches spécifiques de réforme, recruter et former les cadres du parti, gérer les affaires du parti et la planification politique. Ils soutiendront grandement le CRC et assureront la croissance du Kuomintang en tant que parti révolutionnaire efficace et véritablement efficace."

 CHI_declare_sanmin_doctrine_state_doctrine:0 "Déclarer le tridémisme comme doctrine d'État"
 CHI_declare_sanmin_doctrine_state_doctrine_desc:0 "Le Dr Sun Yat-sen est le père fondateur de la République de Chine et a développé la philosophie des Trois principes du peuple, combinant démocratie, protection sociale et nationalisme. Le nouveau Kuomintang purifiera sa pensée et sera prêt à établir les Trois Principes à Taiwan pour servir de modèle d'une Chine véritablement moderne, démontrant que les idéologies communistes sont un poison pour le peuple chinois et sa culture."

 CHI_end_party_factionalism:0 "Mettre fin au fractionnisme des partis"
 CHI_end_party_factionalism_desc:0 "Il a été prouvé que les anciennes cliques et les anciens seigneurs de guerre constituent un obstacle aux réformes de notre parti. Le généralissime envisage de les isoler et de les mettre à l'écart en introduisant un Comité consultatif central, un organe honoraire directement sous son contrôle mais sans pouvoir. Le CRC affectera ensuite les membres du Club central des frères Chen, de la clique du Guangxi et du Groupe d'étude politique (Zhengxuexi) au Comité consultatif, honorant ainsi mais aussi marginalisant les vétérans du parti, les empêchant de diviser la nouvelle direction du parti."

 CHI_encourage_neo_confucian_thinking:0 "Encourager la pensée néo-confucéenne"
 CHI_encourage_neo_confucian_thinking_desc:0 "Chaque membre du parti sera encouragé à entamer une réflexion personnelle et une autocritique afin de garantir que la corruption et le factionnalisme disparaîtront lentement au fil du temps. Seule une réflexion sur nos erreurs sur le continent nous apprendra comment nous pouvons améliorer le parti, et ainsi chaque cadre du parti passera par ce processus."

 CHI_recruit_former_party_members:0 "Recruter d'anciens membres du parti"
 CHI_recruit_former_party_members_desc:0 "Après la création du CRC, il approuvera des mesures de réinscription des membres qui avaient perdu contact avec le Parti pendant la confusion de la guerre civile et la retraite à Taiwan. On s'attend à ce qu'au cours des 20 jours d'inscription, plus de 20 000 membres postulent et reçoivent de nouvelles cartes de parti. Ensuite, les antécédents et le comportement de chaque membre du Parti doivent être évalués. Ce processus comportera trois étapes : les accusations d'actes répréhensibles ; délibération (y compris enquête, autocritique, jugement et décision) ; et enfin la punition."

 CHI_recruit_taiwanese_elites_into_party:0 "Recruter des intellectuels taïwanais au sein du Kuomintang"
 CHI_recruit_taiwanese_elites_into_party_desc:0 "Avec la saisie des terres de la noblesse taïwanaise par le gouvernement et l'autorisation des élections locales, de plus en plus d'intellectuels taïwanais influents locaux ont demandé à devenir membres du Kuomintang. Afin d'apaiser les indigènes, nous leur permettrons de rejoindre le parti afin de gagner davantage de soutien populaire pour le mouvement nationaliste."

 CHI_ensure_effective_and_high_quality_government:0 "Assurer une gouvernance efficace et efficiente"
 CHI_ensure_effective_and_high_quality_government_desc:0 "Afin de garantir le succès de nos réformes, nous devons établir un contrôle et une surveillance stricts sur les cadres et les comités du parti, ainsi que contribuer à accroître notre attractivité sociale en intégrant les paysans et les ouvriers dans le parti. Ces mesures garantiront que le parti ne retombe pas dans le factionnalisme, l'opportunisme et la corruption. Le parti deviendra une base solide pour reprendre la partie continentale de la Chine."

 CHI_Sinicization_of_taiwan:0 "La sinisation de Taiwan"
 CHI_Sinicization_of_taiwan_desc:0 "Après 50 ans de domination japonaise, nous devons re-siniser le peuple taïwanais afin d'établir une base chinoise appropriée pour reprendre le continent aux bandits traîtres communistes !"

 CHI_change_the_curriculum:0 "Changer le programme"
 CHI_change_the_curriculum_desc:0 "Nous abolirons l'ancien programme japonais et établirons un nouveau programme chinois, mettant l'accent sur la pensée néo-confucianiste, les Trois principes du peuple, l'anticommunisme ainsi que l'histoire chinoise."

 CHI_promote_mandarin:0 "Mouvement de promotion des langues nationales"
 CHI_promote_mandarin_desc:0 "Dans le cadre de nos réformes éducatives, nous mettrons l'accent sur l'utilisation du mandarin non seulement dans nos écoles mais également dans les établissements gouvernementaux et les transports publics. Cela contribuera davantage à unir le peuple de Taiwan contre la menace du PCC et nous aidera à établir notre objectif d'une province chinoise modèle moderne. À cet égard, le gouvernement débat actuellement sur le statut des langues autochtones locales et leur rôle dans nos campagnes."

 CHI_tolerate_taiwanese_cultural_groups:0 "Tolérance envers la culture autochtone"
 CHI_tolerate_taiwanese_cultural_groups_desc:0 "Alors que la culture taïwanaise a été fortement modifiée sous le Japon impérial, divers facteurs, traditions et normes qui se différencient des cultures continentales ont survécu à l'occupation. Nous devrions envisager de donner aux autochtones un certain degré de liberté culturelle pour garantir leur soutien à notre cause."

 CHI_teach_neo_confuzian_values:0 "Enseigner les valeurs néo-confucéennes"
 CHI_teach_neo_confuzian_values_desc:0 "Il est important que non seulement nos cadres du parti, mais aussi nos enfants, apprennent l'art de l'autocritique et de l'introspection. De cette façon, l'efficacité de notre cause et de notre société peut être renforcée, ce qui nous aidera grandement à éviter d'éventuelles corruptions et opportunismes dans notre parti et dans notre société."

 CHI_purge_japanese_teachers:0 "Purger les restes japonais"
 CHI_purge_japanese_teachers_desc:0 "Après l'arrivée du KMT à Taiwan en 1945, nous avons déployé divers efforts pour éliminer l'ancienne bureaucratie japonaise. Nous devons poursuivre notre programme en supprimant les anciens professeurs japonais de Taiwan et en les remplaçant par des professeurs de chinois Han qui enseigneront à nos enfants les seules vraies valeurs et normes, et non l'ancienne propagande impériale japonaise et la suprématie culturelle japonaise."

 CHI_Anti_communist_propaganda:0 "Diffuser de la propagande anticommuniste"
 CHI_Anti_communist_propaganda_desc:0 "Les Japonais n'étaient qu'une maladie de peau, tandis que les communistes étaient une maladie du coeur. Pas plus que des marionnettes de l'impérialisme soviétique, ils tentent d'imposer leur idéologie totalitaire au peuple chinois et tentent de détruire la culture et la pensée chinoises. Taiwan deviendra le modèle d'une Chine moderne, tout en honorant son histoire et sa culture chinoise. Nous préparerons le peuple à la reconquête du continent chinois, afin que la Chine puisse se libérer à nouveau de l'impérialisme étranger."

 CHI_Emphazise_Sanmin:0 "Insistez sur la doctrine San-Min"
 CHI_Emphazise_Sanmin_desc:0 "Nous ferons connaître la philosophie du Dr Sun sur les Trois principes du peuple à Taiwan. Même les autochtones doivent apprendre les grandes idées et normes proposées par le père fondateur de la Chine moderne pour transformer notre société en une communauté chinoise véritablement moderne, où la démocratie, le bien-être et le nationalisme ne sont pas seulement un rêve mais une réalité."

 CHI_expand_primary_and_higher_education:0 "Réouverture des écoles privées"
 CHI_expand_primary_and_higher_education_desc:0 "De nombreux continentaux et Taïwanais plus âgés sont toujours mécontents du système éducatif que nous avons mis en place. Il est temps pour nous de rouvrir l'école privée pour les apaiser. Cependant, nous installerons ces écoles privées avec des loyalistes afin de garantir que les écoles privées ne leur enseignent pas des idéaux antipatriotiques."

 CHI_presidential_election_taiwan:0 "L'élection présidentielle de 1954"
 CHI_presidential_election_taiwan_desc:0 "Aujourd'hui, dans la grande salle Chung-Shan de Taipei, l'Assemblée nationale élira le président de la République de Chine ainsi que le vice-président. Le généralissime Chiang est au sommet de son influence grâce aux réformes de son parti et son proche collaborateur Chen Cheng, déjà Premier ministre, sera le candidat à la vice-présidence."

 CHI_waishen_dominated_bureaucracy:0 "Une bureaucratie continentale"
 CHI_waishen_dominated_bureaucracy_desc:0 "Il est préférable de nommer des membres fidèles du parti du continent à des postes bureaucratiques et politiques importants. Ils comprennent vraiment notre cause et notre idéologie, il est donc tout à fait naturel qu'ils dirigent notre gouvernement et notre bureaucratie."

 CHI_ban_opposition_parties:0 "Interdire les partis d'opposition"
 CHI_ban_opposition_parties_desc:0 "Les partis prônant le communisme, l'indépendance de Taiwan et d'autres contre-idéologies du tridémisme seront interdits en République de Chine. Ils ne serviraient que d'obstacle qui diviserait la population et rendrait impossible la reconquête de la patrie."

 CHI_allow_local_elections:0 "Autoriser les élections locales"
 CHI_allow_local_elections_desc:0 "Nous permettrons la « Volonté du peuple » du Dr Sun en autorisant les élections locales à Taiwan. Elles seront plus ouvertes et compétitives que les élections nationales. Même si les membres du KMT seront favorisés lors de la nomination, cela encouragera les élites et intellectuels taïwanais locaux à rejoindre le parti, ce qui nous donnera plus de légitimité en tant que parti du peuple. Les élus locaux pourront toujours affirmer leur influence sur les affaires locales. La démocratie commencera par le bas et finira par atteindre le niveau national."

 CHI_expand_advisory_groups:0 "Développer les groupes consultatifs"
 CHI_expand_advisory_groups_desc:0 "Afin d'inclure d'autres anciens gouverneurs, amiraux, généraux et universitaires parmi les salariés du gouvernement, le bureau présidentiel sera élargi pour inclure ces personnes dans divers comités consultatifs nationaux, commissions et autres institutions."

 CHI_utilize_intellectuals:0 "Utiliser les intellectuels"
 CHI_utilize_intellectuals_desc:0 "Contrairement au président Mao, le président Chiang comprend parfaitement l'importance de l'élite pour la modernisation. Il sélectionnera des responsables économiques exceptionnels qui seront responsables du développement des premières stratégies de croissance économique de Taiwan."

 CHI_appoint_chiang_ching_kuo_secret_police_director:0 "Nommer Chiang Ching-kuo directeur de la police secrète"
 CHI_appoint_chiang_ching_kuo_secret_police_director_desc:0 "Grâce à sa formation en Union Soviétique, le fils du Généralissime va se révéler un chef efficace de la police secrète. Il assurera la stabilité et éliminera toute dissidence politique."

 CHI_establish_green_island_prison:0 "Créer la prison de Green Island"
 CHI_establish_green_island_prison_desc:0 "L'Île Verte servira de lieu isolé et de lieu d'exil pour les prisonniers politiques pendant notre règne. Toutes les forces pro-communistes qui tentent de détruire l'ordre politique en République de Chine seront envoyées ici, afin qu'elles ne puissent pas causer davantage de troubles et de dissidences."

 CHI_postpone_elections:0 "Reporter les élections législatives du Yuan"
 CHI_postpone_elections_desc:0 "L'actuel Yuan législatif a été élu en 1948, alors que nous contrôlions la majorité du continent chinois. Ces mandats représentent la volonté de la nation chinoise tout entière, il est donc tout à fait naturel qu'ils conservent leur mandat jusqu'à ce que le continent soit libéré du PCC !"

 CHI_Arrest_Sun_Li_jen:0 "Arrêter Sun Li-jen"
 CHI_Arrest_Sun_Li_jen_desc:0 "Le général a eu assez de liberté ! Pour avoir conspiré en vue de destituer Chiang Kai-shek, Sun Li-Jen a été démis de ses fonctions et assigné à résidence. Cela devrait servir d'exemple aux autres hauts officiers militaires pour qu'ils placent le pays avant tout."

 CHI_supremacy_Chiang:0 "Le triomphe de Chiang Kai-Shek"
 CHI_supremacy_Chiang_desc:0 "Chiang Kai-Shek triomphe des ennemis de son entourage. Il a guidé la République tout au long de la Seconde Guerre mondiale et continuera de la guider vers de nouvelles grandeurs. Le généralissime Chiang reprendra le continent aux bandits communistes et unifiera à nouveau la Chine sous la bannière républicaine."

 CHI_formation_of_china_democratic_party:0 "Formation du Parti démocratique chinois"
 CHI_formation_of_china_democratic_party_desc:0 "L'ancien responsable du parti Lei Chen a formé un nouveau parti, le CDP, abréviation de China Democratic Party. Il comprend diverses autres voix libérales telles que Hu Shih, Hsu-Shih-hsien et Huang Hua. Le parti, tout en étant fondamentalement anticommuniste, prône une coopération étroite entre les continentaux et le peuple taïwanais d'origine, afin de construire une structure plus démocratique en République de Chine. Il appartient désormais au gouvernement de garantir la légalité et la légitimité du parti."

 CHI_seventh_national_congress_kmt:0 "Le septième congrès national du KMT"
 CHI_seventh_national_congress_kmt_desc:0 "Le Septième Congrès national du KMT sera le premier à se tenir sur l'île de Taiwan. Il marquera officiellement l'achèvement de la période de réforme entre 1950 et 1952 et réfléchira sur lesdites réformes."

 CHI_renew_temporary_provisions:0 "Renouveler les dispositions temporaires"
 CHI_renew_temporary_provisions_desc:0 "Il est devenu clair que les dispositions temporaires en vigueur pendant la période de mobilisation nationale pour la répression de la rébellion communiste ne peuvent pas encore être suspendues. Nous demanderons à l'Assemblée nationale de les renouveler, afin de préparer nos forces au conflit final entre la Chine libre et le continent occupé par les communistes."

 CHI_soft_grip_censorship:0 "Prise en main douce de la censure"
 CHI_soft_grip_censorship_desc:0 "Même si nous ne pouvons évidemment pas permettre aux journaux communistes de diffuser leur propagande, nous autoriserons d'autres journaux, tels que les journaux libéraux, sociaux-démocrates et autochtones. Cela nous gagnera sûrement un soutien supplémentaire de la part de la population indigène taïwanaise."

 CHI_intensify_newspaper_censorship:0 "Intensifier la censure des journaux"
 CHI_intensify_newspaper_censorship_desc:0 "Nous ne pouvons tolérer qu'un journal diffuse de la propagande communiste. Nous remplacerons ces journaux rebelles par des sources d'information fidèles et dignes de confiance."

 CHI_The_Economy_of_Taiwan:0 "L'économie taïwanaise"
 CHI_The_Economy_of_Taiwan_desc:0 "Le continent étant aux mains des communistes, nous devons repartir de zéro. Nous devons évaluer soigneusement notre situation politique et l'utiliser comme base de planification pour nos futures politiques économiques."

 CHI_Land_reform_rent_cap:0 "Introduire des plafonds de loyers fonciers"
 CHI_Land_reform_rent_cap_desc:0 "Comme première étape de nos programmes de réforme agraire, nous réduirons les loyers que les paysans doivent payer à leurs propriétaires. Le Premier ministre Chen Cheng suggère une limite de 37,5% qui doit encore être discutée au sein du Comité central de réforme."

 CHI_Land_reform_sell_public_land:0 "Vendre un terrain public"
 CHI_Land_reform_sell_public_land_desc:0 "Les anciennes terres des suzerains japonais ont été abandonnées par les forces japonaises en retraite après 1945. Le gouvernement du continent saisira ces terres et les vendra à des locataires pauvres à un prix bien inférieur à celui du marché. Nous leur donnerons 10 ans pour acheter leurs terres en produits plutôt qu'en espèces, sans intérêt."

 CHI_Land_reform_establish_land_offices:0 "Créer des bureaux de vulgarisation agricole"
 CHI_Land_reform_establish_land_offices_desc:0 "Des bureaux d'évaluation foncière et de vulgarisation agricole seront créés par le bureau foncier du gouvernement, qui supervisera le démarrage des agriculteurs et des associations d'irrigation, des organismes quasi gouvernementaux qui aident les agriculteurs locaux à suivre les directives du gouvernement."

 CHI_Land_reform:0 "Les propositions de réforme agraire de Chen Cheng"
 CHI_Land_reform_desc:0 "Des rapports en provenance de Chine continentale indiquent que les redistributions violentes des terres par le PCC entraînent des purges massives, des exécutions et des tortures de propriétaires locaux. Le Premier ministre Chen Cheng pense qu'une réforme agraire modérée réduirait le soutien au communisme et a déjà présenté des plans de réforme agraire sur le bureau du président à Taipei."

 CHI_Land_reform_land_to_the_tiller:0 "Terre à la loi Tiller de [GetYear]"
 CHI_Land_reform_land_to_the_tiller_desc:0 "La loi Land to the Tiller indemnisera les anciens propriétaires de Taiwan en leur donnant des obligations foncières et des actions d'entreprises privatisées appartenant à l'État et en les encourageant à se lancer dans la politique locale."

 CHI_Land_reform_modernisation_funds_for_new_farmers:0 "Fonds pour les nouveaux propriétaires fonciers"
 CHI_Land_reform_modernisation_funds_for_new_farmers_desc:0 "Nous accorderons aux nouveaux propriétaires plusieurs prêts pour moderniser leurs fermes et irriguer leurs opérations. Cela garantira l'efficacité et la croissance agricole et augmentera également considérablement le soutien populaire au Kuomintang."

 CHI_Land_reform_encourage_industrial_investment:0 "Encourager les investissements industriels"
 CHI_Land_reform_encourage_industrial_investment_desc:0 "Nous encouragerons les anciens propriétaires à investir leurs nouveaux prêts et leurs actions dans l'industrie afin de garantir la croissance économique en dehors du secteur agricole et de soutenir les entreprises privées qui se voient confier des contrats gouvernementaux."

 CHI_introduce_a_gold_saving_deposit_program:0 "Introduire un programme de dépôt d'épargne en or"
 CHI_introduce_a_gold_saving_deposit_program_desc:0 "Nous établirons un programme de dépôt d'épargne en or pour permettre aux particuliers de déposer nos nouveaux dollars taïwanais sur des comptes payant de l'or à l'échéance. De cette façon, nous maintenons notre monnaie à un niveau plus élevé et évitons le risque d'aggravation de l'inflation."

 CHI_Establish_new_exchange_rates:0 "Établir de nouveaux taux de change"
 CHI_Establish_new_exchange_rates_desc:0 "Les nouveaux dollars taïwanais seront établis avec un taux de change de 1:40 000. La population recevra un NT$ pour 40 000 anciens Taipi Yuan."

 CHI_allow_limited_foreign_exchange:0 "Autoriser un taux de change limité"
 CHI_allow_limited_foreign_exchange_desc:0 "Le ministère des Affaires étrangères a décidé que le NTD serait partiellement convertible, de sorte que les devises soient disponibles pour un grand nombre de paiements et d'investissements extérieurs au taux d'environ 5 NT$ pour 1 $ US."

 CHI_protectonism_agenda:0 "Protectionnisme"
 CHI_protectonism_agenda_desc:0 "Notre programme de substitution des importations prévoit l'importation de biens de production plutôt que de biens de consommation. Nous ajusterons nos tarifs douaniers actuels, nos contrôles à l'importation ainsi que nos taux de change pour promouvoir davantage la substitution aux importations."

 CHI_emphazise_on_import_of_production_goods:0 "Importer des biens de production"
 CHI_emphazise_on_import_of_production_goods_desc:0 "Afin de relancer l'industrialisation de la République de Chine, nous poursuivrons une politique économique de substitution des importations, qui se concentrera sur l'importation de biens de production pour la fabrication locale plutôt que sur l'importation de biens de consommation."

 CHI_import_substitution:0 "Promouvoir l'industrie légère"
 CHI_import_substitution_desc:0 "Aujourd'hui, avec l'importation rapide de nouveaux biens de production en provenance des États-Unis d'Amérique, nous devons encourager l'industrie légère à forte intensité de main-d'oeuvre de Taiwan à répondre aux besoins intérieurs de notre peuple."

 CHI_focus_on_agricultural_exports:0 "Exportation de produits agricoles"
 CHI_focus_on_agricultural_exports_desc:0 "À mesure que notre secteur agricole gagne en efficacité et en production, nous concentrerons notre politique d'exportation sur les produits agricoles vers la communauté internationale. Cependant, cela ne comblera probablement pas notre déficit commercial, étant donné notre dépendance à l'égard des importations de matières premières et d'équipements. Néanmoins, cela détournera davantage de capitaux vers Taipei."

 CHI_divert_labor_overflow_to_light_industries:0 "Détourner le surplus de main-d'oeuvre vers l'industrie légère"
 CHI_divert_labor_overflow_to_light_industries_desc:0 "À mesure que la productivité agricole augmente, une main-d'oeuvre agricole excédentaire devient disponible. Le gouvernement déplacera ce bassin de main-d'oeuvre vers des industries légères et à forte intensité de main-d'oeuvre telles que les produits du bois, les textiles, les produits en plastique, le papier et les appareils électriques. Ces industries ne nécessitent pas beaucoup d'apports de capital ou de main-d'oeuvre qualifiée, mais offrent un retour rapide sur les bénéfices."

 CHI_promote_private_enterprises:0 "Promouvoir les entreprises privées"
 CHI_promote_private_enterprises_desc:0 "Le plan de Yin Zhongrong d'une « économie de marché planifiée » prévoit la coexistence d'entreprises privées et d'entreprises publiques. Tandis que les entreprises publiques ont notre priorité en termes de contrats gouvernementaux, nous demanderons à des entreprises privées, telles que Taiwan Cement et Taiwan Pulp and Paper, de gérer des entreprises auparavant publiques dans les secteurs du ciment, du papier, de l'agriculture et de la sylviculture, afin de promouvoir une économie de marché."

 CHI_appoint_Yin_Zhongrong_minister_of_economic_affairs:0 "Nommer Yin Zhongrong Ministre des Affaires économiques"
 CHI_appoint_Yin_Zhongrong_minister_of_economic_affairs_desc:0 "Yin Zhongrong, bien que n'étant pas membre du Kuomintang, a déjà travaillé dans diverses entreprises privées à Shanghai et possède une grande connaissance et expérience du fonctionnement d'un marché. Le Premier ministre Chen Cheng estime que le potentiel de cet homme peut grandement bénéficier aux affaires économiques de Taiwan et a donc proposé de le nommer ministre des Affaires étrangères de la République."

 CHI_50s_Launch_of_the_first_four_year_plan:0 "Lancer le plan quadriennal"
 CHI_50s_Launch_of_the_first_four_year_plan_desc:0 "Avec peu ou pas de capacité à reprendre le continent, nous devons trouver un autre moyen de nous assurer de nos territoires actuels au lieu de perdre notre temps à Taiwan. Nous lancerons le premier plan quadriennal, un développement bien planifié de nos secteurs industriels légers pour promouvoir l'autosuffisance et mettre fin à la dépendance à l'égard des importations massives."

 CHI_50s_focus_on_the_textile_industrial_sector:0 "Focus sur le secteur textile"
 CHI_50s_focus_on_the_textile_industrial_sector_desc:0 "À l'heure actuelle, nous avons un déficit commercial important dans le secteur de la fabrication textile. Cela doit changer en nous concentrant sur le développement de l'industrie textile dans le pays et en favorisant son expansion car elle peut être facilement fabriquée localement."

 CHI_50s_prioritize_the_fertilizer_industry:0 "Participer à l'industrie des engrais"
 CHI_50s_prioritize_the_fertilizer_industry_desc:0 "L'industrie des engrais à Taiwan signifie de l'argent, car le gouvernement de la République de Chine a réussi à monopoliser l'industrie des engrais auparavant. Nous devons maintenant nous concentrer sur l'encouragement de leur développement et ensuite les utiliser pour les vendre aux agriculteurs qui ont besoin d'engrais pour l'industrie agricole."

 CHI_50s_second_four_year_plan:0 "Commencer le deuxième plan quadriennal"
 CHI_50s_second_four_year_plan_desc:0 "La première s'est très bien déroulée et la plupart de nos industries légères ont été remises sur pied et prospères. Nous devons désormais promouvoir le développement de l'industrie lourde et encourager les investissements étrangers dans le pays. Vers une nouvelle ère !"

 CHI_50s_electrify_the_island:0 "Électrifiez l'île"
 CHI_50s_electrify_the_island_desc:0 "L'île a besoin d'électricité, car notre industrie en dépend pour fonctionner."

 CHI_50s_invite_japanese_investors:0 "Coopérer avec les technocrates japonais"
 CHI_50s_invite_japanese_investors_desc:0 "Les technocrates japonais nous ont approchés pour rechercher des coopérations en vue d'investissements futurs dans le pays, qui nous bénéficieront à long terme."

 CHI_50s_appoint_educated_economists_and_professionals:0 "Nommer des économistes et des professionnels formés"
 CHI_50s_appoint_educated_economists_and_professionals_desc:0 "Comme nous savons que les conseillers américains ne restent pas longtemps parmi nous, nous devons rapidement trouver des remplaçants à des économistes et à des professionnels bien formés. Heureusement, de nombreux Chinois ont fait leurs études à l'étranger et sont revenus nous apporter leurs connaissances. "

 CHI_50s_seek_technological_advancements:0 "Rechercher des avancées technologiques"
 CHI_50s_seek_technological_advancements_desc:0 "Il faudrait mettre davantage l'accent sur les progrès technologiques dans le pays !"

 CHI_50s_develop_heavy_industry:0 "Développer l'industrie lourde"
 CHI_50s_develop_heavy_industry_desc:0 "Contrairement au premier plan quadriennal, nous avons décidé de donner cette fois-ci la priorité aux industries lourdes, y compris la production d'acier et bien d'autres encore, pour nous aider à atteindre notre autosuffisance."

 CHI_50s_national_defense_industrial_expansion:0 "Expansion industrielle de la Défense nationale"
 CHI_50s_national_defense_industrial_expansion_desc:0 "Nos arsenaux militaires doivent être étendus dans le cadre du deuxième plan quadriennal, car nous savons tous que les communistes vont tenter à nouveau de toucher l'une de nos îles."

 CHI_50s_manufacturing_hub_of_the_east:0 "Centre manufacturier de l'Est"
 CHI_50s_manufacturing_hub_of_the_east_desc:0 "Enfin, nous avons surmonté les ravages passés de l'économie et avons même dépassé les attentes d'une économie réformée !"

 CHI_reopen_national_central_library:0 "Rouvrir la Bibliothèque centrale nationale"
 CHI_reopen_national_central_library_desc:0 "L'ancienne Bibliothèque centrale nationale de Nanjing sera rouverte à Taipei, dans le district de Zhongzheng, et deviendra l'unique bibliothèque nationale de Taiwan. Sa mission est d'acquérir, de cataloguer et de préserver les publications nationales destinées au gouvernement, à la recherche et au grand public. La collection de livres rares est l'une des plus importantes collections de livres et de manuscrits anciens chinois au monde. Il soutiendra la recherche et les études sinologiques par l'intermédiaire du Centre d'études chinoises (CCS) affilié."

 CHI_benevolent_leader_chiang:0 "Le bienveillant généralissime"
 CHI_benevolent_leader_chiang_desc:0 "Le parti léniniste s'appuie généralement sur un dirigeant fort, quelqu'un que tout le monde admire, quelqu'un qui unit le peuple pour la cause. Un certain culte de la personnalité (pas nécessairement à la mesure de Staline ou de Mao) est nécessaire pour personnaliser l'organisation du parti, par ailleurs très impersonnelle, et faciliter l'engagement des individus. Les membres du Parti jureront ainsi leur fidélité au Généralissime, qui a défendu la nation contre l'impérialisme japonais et consacre une partie de son temps à combattre le mouvement communiste en Chine. Héritier du Dr Sun, le Koxinga moderne, il sauvera la Chine d'une mort certaine !"

 CHI_launch_voice_of_free_china:0 "La voix de la Chine libre"
 CHI_launch_voice_of_free_china_desc:0 "La Voix de la Chine libre a été créée le 10 octobre 1949 pendant les derniers jours de la guerre civile chinoise. Nous diffuserons sur le continent sous l'indicatif de « Station centrale de radiodiffusion » pour continuer à prêcher aux masses du continent les méfaits du Parti communiste chinois."

 CHI_The_Fall_of_the_Mainland:0 "Le destin du continent"
 CHI_The_Fall_of_the_Mainland_desc:0 "Les forces de la traîtresse Armée populaire de libération nous ont chassés du sud de la Chine ! Nous devons nous regrouper et nous retirer sur l'île de Taiwan, et nous reprendrons le continent le moment venu. Les communistes regretteront le jour où ils nous ont expulsés de notre patrie."

 CHI_Declaration_of_Martial_Law:0 "Déclaration de la loi martiale"
 CHI_Declaration_of_Martial_Law_desc:0 "Afin de préserver la sécurité nationale de notre nouvelle République, la loi martiale doit être déclarée. Nous devons nous préparer à toute attaque sur notre sol et planifier la réinvasion du continent et la défaite des communistes !"

 CHI_Elections_of_1954:0 "Élections de 1954"
 CHI_Elections_of_1954_desc:0 "Les élections générales de 1954 sont âprement disputées entre le Parti populaire démocrate, le Parti communiste taïwanais et le Parti socialiste démocrate chinois. Le peuple parlera avec ses votes !"

 CHI_Elections_of_1958:0 "Élections de 1958"
 CHI_Elections_of_1958_desc:0 "Les élections générales de 1958 sont âprement disputées entre le Parti populaire démocrate, le Parti communiste taïwanais et le Parti socialiste démocrate chinois. Le peuple parlera avec ses votes !"

 CHI_The_Hyperinflation_Crisis:0 "La crise de l'hyperinflation"
 CHI_The_Hyperinflation_Crisis_desc:0 "Nous devons combattre la crise d'hyperinflation provoquée par la guerre civile ! Un nouveau dollar taïwanais sera créé pour remplacer l'ancien dollar taïwanais et le yen taïwanais."

 CHI_Republic_of_China_Armed_Forces:0 "Forces armées de la République de Chine"
 CHI_Republic_of_China_Armed_Forces_desc:0 "Afin de combattre la menace communiste, nos forces doivent être fortes, bien entraînées et capables de reprendre la terre qui nous appartient de droit !"

 CHI_Republic_of_China_Air_Force:0 "Force aérienne de la République de Chine"
 CHI_Republic_of_China_Air_Force_desc:0 "Nous devons nous défendre contre les menaces aériennes révolutionnaires en utilisant les nouvelles technologies et les avions, pour combattre les forces communistes qui s'emparent de notre territoire."

 CHI_Re_Establish_the_Air_Force_Academy:0 "Rétablir l'Académie de l'Armée de l'Air"
 CHI_Re_Establish_the_Air_Force_Academy_desc:0 "Pour bâtir une force aérienne efficace, nous avons besoin non seulement d'avions, mais également d'officiers compétents. C'est exactement ce que fera l'Académie de l'armée de l'air de la République de Chine, en formant des jeunes hommes pour qu'ils deviennent la prochaine génération de l'armée de l'air."

 CHI_Surplus_American_Aircraft:0 "Avions américains excédentaires"
 CHI_Surplus_American_Aircraft_desc:0 "Pour nous aider, nous accepterons les avions excédentaires des États-Unis, afin que nous puissions effectivement démarrer notre puissante force aérienne."

 CHI_Develop_Airbases_on_Kinmen:0 "Développer des bases aériennes sur Kinmen et Matsu"
 CHI_Develop_Airbases_on_Kinmen_desc:0 "Kinmen et Matsu sont les premiers lieux de combat si nous ou les bandits communistes osons lancer un assaut. Nous devons accroître son infrastructure militaire, en commençant par des bases aériennes modernes, afin d'utiliser pleinement notre suprématie aérienne sur l'APL."

 CHI_black_bat_squadrons:0" Les escadrons du Chat Noir"
 CHI_black_bat_squadrons_desc:0 "L'escadron Black Cat, anciennement le 34e escadron, est une escadrille secrète au sein des forces aériennes de la République et mène des missions de reconnaissance au-dessus de la Chine continentale, ainsi que le largage d'agents dans les zones contrôlées par les communistes pour recueillir des renseignements militaires."

 CHI_flying_with_the_usaf:0 "Voler avec l'USAF"
 CHI_flying_with_the_usaf_desc:0 "Avec l'aide et l'assistance de l'armée de l'air américaine, nous pouvons acquérir des tactiques et une expérience cruciales pour nous préparer à l'inévitable conflit avec l'APL. Le soutien aérien est le facteur le plus important de la guerre moderne et, par conséquent, lui accorder la plus haute priorité est une nécessité pour une invasion réussie du continent."

 CHI_The_Fate_of_Hainan:0 "Le destin de Hainan"
 CHI_The_Fate_of_Hainan_desc:0 "Merde"

 CHI_Victory_in_Hainan:0 "Victoire à Hainan"
 CHI_Victory_in_Hainan_desc:0 "Les tentatives communistes de prendre l'île de Hainan par la force ont échoué ! Nos forces ont monté une défense impressionnante, nous considérons cela comme une victoire pour la République de Chine !"

 CHI_Haikou_Kaohsiung_naval_route:0 "Route navale Haikou-Kaohsiung"
 CHI_Haikou_Kaohsiung_naval_route_desc:0 "Les îles de Hainan et Formose partagent une distance de plus de 1 000 kilomètres l'une de l'autre. Nous devons contrecarrer cette situation en augmentant les capacités de transport maritime sur les deux îles, afin d'assurer un approvisionnement et une communication efficaces entre les deux provinces."

 CHI_rebuild_minery_industry:0 "Reconstruire l'industrie minière"
 CHI_rebuild_minery_industry_desc:0 "L'industrie minière a été détruite par la retraite japonaise et par les bombardements alliés. L'île est riche en minéraux comme le fer, l'or, le tungstène et la bauxite. Divers investissements et efforts doivent être faits pour utiliser tout le potentiel des ressources de Hainan."

 CHI_interconnect_hainan:0 "Interconnecter le Hainan"
 CHI_interconnect_hainan_desc:0 "Pendant l'occupation japonaise, les Japonais ont construit une ligne de chemin de fer allant des mines du sud-ouest au sud-est. Nous pouvons désormais le reconstruire et l'étendre jusqu'au port principal, ainsi que créer des routes et les infrastructures nécessaires à la mine."

 CHI_subsidize_rubber_farms:0 "Subventionner les fermes d'hévéa"
 CHI_subsidize_rubber_farms_desc:0 "Les forêts tropicales de l'intérieur des terres sont idéales pour la culture du caoutchouc, subventionner les agriculteurs venant d'autres régions tropicales d'Asie de l'Est s'avérera rentable."

 CHI_expand_textile_industry:0 "Développer l'industrie textile"
 CHI_expand_textile_industry_desc:0 "La plupart des capacités industrielles de Hainan ont été détruites par les Japonais pendant la guerre de Résistance, nous devons reconstruire l'industrie et rendre l'île autosuffisante."

 CHI_open_hainan_university:0 "Université ouverte de Hainan"
 CHI_open_hainan_university_desc:0 "Hainan n'a pas été laissé de côté par nos troupes, maintenant nous devons éviter que, au niveau social, l'extension des installations de formation et des sites de recherche ne soit bénéfique non seulement pour l'île, mais aussi pour toute la République."

 CHI_prevent_future_invasions:0 "Prévenir les futures invasions"
 CHI_prevent_future_invasions_desc:0 "L'île a été sauvée des communistes une fois, mais cela ne veut pas dire qu'ils ne réessayeront pas, pour l'empêcher, nous devons défendre le « Rivage des Perles » de toute attaque maritime."

 CHI_purge_remaining_guerrillas:0 "Purgue, guérilleros restants"
 CHI_purge_remaining_guerrillas_desc:0 "Depuis 1927, divers groupes de soi-disant « combattants de la liberté » ont mené une guérilla sur l'île. Avec la récente invasion, certains de ces groupes ont rassemblé du matériel laissé par les forces communistes en retraite. Nous devons éradiquer ces dangereux rebelles par les racines une fois pour toutes !"

 CHI_Sinification_campaigns_Hainan:0 "Sinisation de Hainan"
 CHI_Sinification_campaigns_Hainan_desc:0 "Hainan fait partie de la Chine depuis l'ancienne dynastie Han (206 avant JC), il serait fou de se distancer de la culture chinoise. Nous lancerons d'autres campagnes de sinisation sur l'île, pour rappeler aux habitants qu'ils font partie de la plus grande nation de la planète depuis l'Antiquité."

 CHI_Retaliate_with_Natives:0 "Représailles contre les autochtones"
 CHI_Retaliate_with_Natives_desc:0 "Au lieu d'imposer notre volonté aux indigènes de l'île, nous essaierons de trouver un terrain d'entente, où nous chercherons un compromis entre la tolérance culturelle régionale mais aussi la promotion de la culture cantonaise sur l'île."

 CHI_Send_Bai_chongxi_to_hainan:0 "Envoyez Bai Chongxi à l'Utsul"
 CHI_Send_Bai_chongxi_to_hainan_desc:0 "Bai Chongxi, ancien chef de guerre du Guangxi, est actuellement général musulman dans les forces armées. Il a collecté des fonds pour construire des mosquées à Taiwan et s'est imposé comme organisateur de la communauté musulmane. Les Utsul constituent la minorité musulmane de Hainan et l'accueilleront sûrement, lui et ses efforts, à bras ouverts, ce qui réduira les tensions sur l'île."

 CHI_Republic_of_China_Army:0 "Armée de la République de Chine"
 CHI_Republic_of_China_Army_desc:0 "Notre nouvelle armée doit être forte et bien entraînée pour combattre les viles forces communistes. Nous devons former une force nombreuse et capable pour vaincre les bandits communistes !"

 CHI_listen_to_Sun_li_jen:0 "Soutenez les réformes de Sun Li-jens"
 CHI_listen_to_Sun_li_jen_desc:0 "Le général Sun Li-jen a été formé aux États-Unis et ses fonctions pendant la guerre de résistance lui ont valu le statut de héros de guerre légendaire. Ses liens étroits avec l'armée américaine et la CIA offrent un grand potentiel pour des réformes d'efficacité au sein des forces armées."

 CHI_empower_the_maag:0 "Donner du pouvoir au MAAG"
 CHI_empower_the_maag_desc:0 "Nous donnerons plus de liberté au Groupe consultatif américain sur l'assistance militaire (MAAG) au sein de nos forces armées. Désormais, ils supervisent la formation doctrinale et d'autres tactiques et stratégies diverses, mais nous leur accorderons plus de liberté dans d'autres domaines, comme l'éducation des soldats, des généraux et des forces de police."

 CHI_indoctrinate_officiers:0 "Endoctriner les forces armées"
 CHI_indoctrinate_officiers_desc:0 "Des officiers militaires, des fonctionnaires et des cadres du parti seront sélectionnés pour fréquenter l'Académie pour l'étude de la conduite de la révolution afin d'unifier leur orientation politique afin qu'ils ne s'écartent pas du rang et ne forment pas de cliques politiques s'opposant à Chiang Kai-shek."

 CHI_establish_the_china_youth_corps:0 "Créer le Corps de la jeunesse chinoise"
 CHI_establish_the_china_youth_corps_desc:0 "Le Corps de salut national de la jeunesse chinoise sera l'organisation officielle de jeunesse de la République de Chine. Chiang Ching-kuo sera élu premier président et a pour objectif de fournir une formation militaire de base aux jeunes avant qu'ils ne soient enrôlés dans le ROCA."

 CHI_further_excersises_with_us_troops:0 "Continuer les exercices avec les Américains"
 CHI_further_excersises_with_us_troops_desc:0 "Nous veillerons à ce que davantage de conseillers américains du MAAG instruisent nos soldats lors des exercices. Ils assisteront nos troupes en utilisant des systèmes de communication sans fil modernes, augmentant ainsi notre efficacité militaire contre l'Armée populaire de libération."

 CHI_amend_act_of_military_system:0 "Modifier la loi sur le système du service militaire"
 CHI_amend_act_of_military_system_desc:0 "Le continent a le plus grand avantage en termes de main-d'oeuvre sur nous, ce qui rend difficilement plausible même une invasion du continent avec nos troupes de qualité américanisées avec un si petit nombre. Nous devons modifier le système de service militaire, les citoyens de sexe masculin doivent effectuer 2 à 3 ans de service actif dans les forces armées selon les branches (2 ans pour l'armée, 3 ans pour la marine, l'armée de l'air, le corps des marines). La loi modifiée a également établi un système permettant au ministère de la Défense nationale de choisir des officiers et des sous-officiers de réserve parmi le bassin de citoyens masculins ordinaires, renforçant ainsi nos capacités de mobilisation militaire."

 CHI_adopt_soviet_style_command_structure:0 "Utiliser la formation soviétique de Chiang Ching-kuos"
 CHI_adopt_soviet_style_command_structure_desc:0 "Forts de l'expérience de Chiang Ching-kuo, le fils de notre président, nous apporterons à notre armée des réformes militaires de type soviétique, en mettant à l'écart le général Sun Li-jen et ses partisans pro-américains. Nous pouvons ainsi étendre pleinement le corps des officiers politiques et la portée du KMT dans les forces armées."

 CHI_American_Arms:0 "Armes américaines"
 CHI_American_Arms_desc:0 "Nous devons nous procurer les derniers modèles d'armes et d'armes américaines pour équiper et entraîner nos militaires, cela permettra à notre armée d'être forte et de vaincre les traîtres communistes !"

 CHI_Urban_Warfare_Training:0 "Formation à la guerre urbaine"
 CHI_Urban_Warfare_Training_desc:0 "Il est essentiel que nos soldats apprennent à combattre dans les villes, que ce soit à Taipei ou à Pékin. La guerre urbaine est essentielle à notre époque moderne, nous ne sommes plus à l'ère victorienne."

 CHI_Fall_of_Hainan:0 "Chute de Hainan"
 CHI_Fall_of_Hainan_desc:0 "Nous avons perdu l'île de Hainan ! Les communistes ont débarqué sur Hainan et ont fait des milliers de victimes ! Notre marine nous a laissé tomber ! Nous devons nous replier sur Taiwan, mais les combats continueront."

 CHI_Fortify_the_Coast:0 "Fortifier la côte"
 CHI_Fortify_the_Coast_desc:0 "Taiwan doit devenir une défense impénétrable contre toute éventuelle incursion ou débarquement communiste. Des forts et des emplacements de défense seront construits le long de la côte ouest pour protéger notre sécurité nationale."

 CHI_the_Korean_War:0 "La guerre de Corée"
 CHI_the_Korean_War_desc:0 "Le gouvernement légitime de la péninsule coréenne se retrouve attaqué par des bandits communistes financés par les Soviétiques, qui cherchent à détruire le gouvernement de Séoul et à établir une dictature socialiste sur l'ensemble de la péninsule. Il est de notre devoir de soutenir le gouvernement coréen contre cette invasion par tous les moyens nécessaires."

 CHI_Korean_War_Intervention_debate:0 "Débat sur l'intervention sur la guerre de Corée"
 CHI_Korean_War_Intervention_debate_desc:0 "Nos options concernant la guerre de Corée dépendent fortement de la volonté des États-Unis d'Amérique. Même si le chef d'état-major et le président Truman refusent toute implication directe, ils apprécient notre service en termes de livraisons d'équipement et d'interrogatoire de prisonniers de guerre chinois. L'entourage proche de Douglas MacArthur soutient cependant l'idée d'une attaque commune sur le continent chinois pour contenir le communisme non seulement en Corée mais aussi en Chine."

 CHI_Korean_War_Prepare_for_Operations_on_mainland:0 "Rejoignez la guerre de Corée"
 CHI_Korean_War_Prepare_for_Operations_on_mainland_desc:0 "Nous suivrons les conseils du général MacArthur et rejoindrons la coalition des Nations Unies dans leur lutte contre les troupes rouges coréennes. Nous ne pouvons pas donner aux communistes un autre pied en Asie !"

 CHI_Korean_War_prepare_yansa_for_insurection_into_Yunnan:0 "Coordonner avec YASA"
 CHI_Korean_War_prepare_yansa_for_insurection_into_Yunnan_desc:0 "Suite à la Grande Retraite vers Formose, le général Li Mi et ses troupes ont été évacuées vers la frontière birmane et ont pillé la région pour frapper l'APL au Yunnan. Grâce à nos relations avec la CIA, nous poursuivrons les livraisons d'armes en Birmanie via la route thaïlandaise et les préparerons à une éventuelle incursion dans le Yunnan."

 CHI_Korean_War_supply_kmt_islamic_insurgency_via_airbridges:0 "Préparer les troupes islamiques au Qinghai"
 CHI_Korean_War_supply_kmt_islamic_insurgency_via_airbridges_desc:0 "Nous continuerons à approvisionner les guérilleros du Qinghai via des espions et des ponts aériens pour financer leurs opérations contre les forces locales de l'APL."

 CHI_Korean_War_supply_south_korean_troops:0 "Ravitailler les troupes sud-coréennes"
 CHI_Korean_War_supply_south_korean_troops_desc:0 "L'armée sud-coréenne a désespérément besoin de munitions et de conseillers. Nous contribuerons à l'effort de guerre en fournissant du matériel de soutien et de communication, donnant ainsi à la République de Corée de plus grandes capacités logistiques."

 CHI_Korean_War_listen_to_the_chief_of_staffs:0 "Écoutez le chef d'état-major"
 CHI_Korean_War_listen_to_the_chief_of_staffs_desc:0 "Nous devrions écouter la recommandation du chef d'état-major de ne pas aggraver la guerre de Corée. Le Kuomintang et les forces armées ont toujours désespérément besoin de réformes et attaquer le continent maintenant entraînerait très probablement l'effondrement de notre domination sur Taiwan."

 CHI_Korean_chinese_deserters:0 "Offrir l'asile aux déserteurs chinois"
 CHI_Korean_chinese_deserters_desc:0 "Les prisonniers de guerre chinois capturés par la coalition des Nations Unies seront amenés à Taiwan et recrutés dans le ROCA. Leurs connaissances et leur expérience pourraient s'avérer efficaces pour de futures opérations contre le PCC."

 CHI_American_financial_aid:0 "Aide financière américaine"
 CHI_American_financial_aid_desc:0 "Les États-Unis d'Amérique sont notre allié le plus proche et la survie de notre régime dépend de leur soutien. Nous demanderons des fonds supplémentaires à Washington pour relancer nos capacités industrielles."

 CHI_request_american_protection:0 "Demander la protection américaine"
 CHI_request_american_protection_desc:0 "La septième flotte nous a sauvé d'une éventuelle invasion communiste, il est tout à fait naturel que nous approfondissions nos liens avec les États-Unis et demandions un traité formel de sécurité et de protection. Avec l'aide des États-Unis d'Amérique, les bandits communistes ne nous prendront jamais l'île !"

 CHI_Sino_american_treaty:0 "Signez le traité de défense mutuelle sino-américain"
 CHI_Sino_american_treaty_desc:0 "Le Congrès a adopté le Traité de défense mutuelle sino-américain, un pacte défensif entre la République de Chine et les États-Unis d'Amérique. Les États-Unis protégeront désormais l'île de Taiwan si jamais elle devait être attaquée par le Parti communiste. Toutefois, cela n'inclut pas les îles de Kinmen et de Matsu et les États-Unis n'ont jusqu'à présent exprimé aucun intérêt pour une invasion du continent chinois."

 CHI_contain_american_political_influence:0 "Contenir l'influence américaine"
 CHI_contain_american_political_influence_desc:0 "Même si l'Amérique nous profite grandement de son soutien industriel et militaire, nous ne pouvons pas lui permettre d'acquérir davantage d'influence politique au sein de notre gouvernement, sans que la position du généralissime Chiang puisse être menacée par la faction pro-américaine de notre gouvernement."

 CHI_allign_closer_to_america:0 "Se rapprocher de Washington"
 CHI_allign_closer_to_america_desc:0 "Grâce aux Américains, Taiwan n'est pas sous domination communiste. Ils alimentent notre économie et fournissent une assistance à notre armée. Il est tout à fait naturel de se rapprocher de l'Oncle Sam pour approfondir notre coopération."

 CHI_encourage_american_investment:0 "Encourager les investissements occidentaux"
 CHI_encourage_american_investment_desc:0 "Nous devons attirer davantage de capitaux et d'investissements étrangers dans l'économie de notre pays ; Au-delà des seuls investisseurs américains, un soutien international est nécessaire."

 CHI_join_seato:0 "Rejoignez l'OTASE"
 CHI_join_seato_desc:0 "Avec la création de l'Organisation du Traité de l'Asie du Sud-Est, il est impératif que Taiwan rejoigne cette organisation pour lutter contre l'agression de la République populaire de Chine, de la Corée du Nord et du Nord-Vietnam."

 CHI_indochinese_policy:0 "Affaires vietnamiennes"
 CHI_indochinese_policy_desc:0 "Depuis la fin de la Seconde Guerre mondiale, la région d'Indochine a été victime de multiples mouvements révolutionnaires rouges, cherchant à renverser les régimes établis et travaillant en étroite collaboration avec le Parti communiste chinois. Il est dans notre plus grand intérêt de soutenir tout pays de la région aux prises avec des insurrections communistes afin d'affaiblir le mouvement communiste en Asie de l'Est."

 CHI_Denounce_Diems_Sinophoby:0 "Dénonçons les lois sinophobes de Diem"
 CHI_Denounce_Diems_Sinophoby_desc:0 "Les lois sévères de restriction envers les personnes d'origine chinoise en République du Vietnam vont trop loin ! En les forçant à renoncer à leur nom mandarin, à leur nationalité et à leurs traditions exceptionnelles, nous refusons de coopérer avec tout gouvernement sinophobe, même si nous partageons un ennemi commun."

 CHI_evacuate_Cho_Lon:0 "Évacuer les actifs de Cho-Lon"
 CHI_evacuate_Cho_Lon_desc:0 "Nous devons évacuer la majorité chinoise du district de Cho Lon. La majorité chinoise et son capital sont trop précieux pour les maintenir aux portes de ce régime sinophobe. Nous les amènerons à Taiwan pour assurer leur sécurité."

 CHI_establish_relations_with_south_vietnam:0 "Établir officiellement des relations avec le Sud-Vietnam"
 CHI_establish_relations_with_south_vietnam_desc:0 "La République du Vietnam est le seul gouvernement légitime du Vietnam, mais elle fait face aux conséquences du mouvement de résistance anti-japonaise sous la bannière du Viet Minh. En tant que membre permanent du Conseil de sécurité de l'ONU, nous reconnaîtrons officiellement leur indépendance et leur suzeraineté sur l'ensemble du Vietnam, ce qui contribuera grandement à la légitimité du gouvernement de Saigon."

 CHI_state_visit_from_saigon:0 "Visite d'État de Saigon"
 CHI_state_visit_from_saigon_desc:0 "Le Président suggère que nous invitions les responsables du gouvernement vietnamien à discuter d'autres plans et stratégies concernant les rébellions communistes en Chine et au Vietnam, tels que les programmes d'échange, les livraisons d'armes et l'expertise militaire."

 CHI_Allign_with_Saigon:0 "Se rapprocher de Saigon"
 CHI_Allign_with_Saigon_desc:0 "Malgré les lois sinophobes de Diem, nous poursuivrons notre politique d'amitié et de coopération avec la République du Vietnam. Ils constituent un atout précieux pour le mouvement anticommuniste en Asie de l'Est et bénéficient d'un soutien supplémentaire de notre gouvernement."

 CHI_fund_vnqdd:0 "Financer le VNQDD"
 CHI_fund_vnqdd_desc:0 "Le Viet Quoc, également connu sous le nom de Viet Nam Quoc Dan Dang ou VNQDD, est un parti nationaliste vietnamien connu pour son sentiment anticolonial et anticommuniste. Ils ont été purgés dans le nord du Vietnam par Ho Chi Ming, mais ils partagent notre vision d'une république fondée sur les Trois principes du peuple. Nous soutiendrons nos frères d'Indochine dans leur lutte contre le colonialisme et le communisme."

 CHI_provide_material_support:0 "Aide militaire à Saigon"
 CHI_provide_material_support_desc:0 "Alors que nous avons besoin de tout l'équipement possible pour la libération du continent, nous redirigerons une certaine quantité d'armes pour la plupart obsolètes vers Saigon afin de maintenir leur armée approvisionnée."

 CHI_mainland_operations:0 "Vestiges sur le continent"
 CHI_mainland_operations_desc:0 "Les restes des forces du Kuomintang qui n'ont pas réussi à évacuer vers Taiwan aux côtés des principales armées ont décidé de se retrancher sur le continent et de résister jusqu'au bout aux forces communistes, dont beaucoup résident soit dans les anciens territoires de la clique Ma sous le général Ma Hushan, soit à la frontière Yunnan-Birmanie sous le général Li Mi. Leurs forces occuperont les communistes jusqu'à ce que nous soyons prêts à reconquérir le continent, et nous nous souviendrons de nous comme des martyrs de la Chine libre !"

 CHI_supply_yansa:0 "Fournir YASA"
 CHI_supply_yansa_desc:0 "Les troupes restantes dans la province du Yunan ont fui vers les régions frontalières de l'ancienne colonie britannique de Birmanie et y ont établi leur base de commandement, en attendant de nouveaux ordres pour reprendre la province du Yunan au PCC. Nous fournirons le général Li Mi et ses unités en vue de la libération du continent."

 CHI_reaction_to_burmese_un_complaint:0 "La plainte birmane auprès de l'ONU"
 CHI_reaction_to_burmese_un_complaint_desc:0 "Suite à l'échec des efforts diplomatiques et militaires du gouvernement birman pour résoudre le problème du Kuomintang à Kengtung, la Birmanie a déposé une plainte auprès des Nations Unies, produisant une multitude de photos, de documents capturés et de témoignages suffisamment convaincants pour remporter un vote de censure contre la République de Chine. Les États-Unis font également pression sur nous pour que nous rappelions le général Li Mi, estimant que la question du KMT était devenue « une telle source d'embarras international pour les États-Unis »."

 CHI_the_taiwan_strait:0 "La crise du détroit de Taiwan"
 CHI_the_taiwan_strait_desc:0 "L'APL a commencé à bombarder l'île de Kinmen ! Nous devons prendre des contre-actions immédiates pour résister à cette attaque sur un territoire républicain plus étendu ! Le ROC ne tombera pas aujourd'hui !"

 CHI_Taiwan_strait_crisis_US_help:0 "Demander l'assistance américaine"
 CHI_Taiwan_strait_crisis_US_help_desc:0 "Nous devons nous appuyer sur la force navale et les capacités logistiques de Washington pour évacuer les civils des îles actuellement bombardées. "

 CHI_evacuate_Dachen_islands:0 "Opération retrait"
 CHI_evacuate_Dachen_islands_desc:0 "Les civils des îles bombardées doivent être évacués au plus vite ! Nous devons déployer des soldats et des responsables de la santé sur ces îles pour décontaminer les civils et les aider à être évacués vers Taiwan."

 CHI_reject_evacuation_efforts_of_dachen:0 "Refuser l'évacuation des îles Dachen"
 CHI_reject_evacuation_efforts_of_dachen_desc:0 "Les îles Dachen sont des positions stratégiques nous permettant de consolider plus facilement la province du Zhejiang dans le futur, abandonner ces positions serait une décision stupide !"

 CHI_fortify_kinmen_matsu:0 "Fortifier Kinmen et Matsu"
 CHI_fortify_kinmen_matsu_desc:0 "Kinmen et Matsu constituent le premier théâtre de combat si nous ou les bandits communistes osons lancer un assaut. Nous devons continuer à développer son infrastructure militaire, notamment en construisant de solides bastions fortifiés pour résister aux futurs bombardements. Nous stationnerons également 40 000 soldats supplémentaires sur les îles."

 CHI_bomb_xiamen:0 "Coquille Xiamen"
 CHI_bomb_xiamen_desc:0 "Il est temps de riposter ! Si les bandits pensent que nous ne sommes pas en mesure de riposter, ils ont complètement tort ! Nous bombarderons leurs batteries d'artillerie à Xiamen pour mettre fin à ce conflit."

 CHI_second_taiwan_strait:0 "Deuxième crise du détroit de Taiwan"
 CHI_second_taiwan_strait_desc:0 "Les communistes ont de nouveau lancé des attaques contre nos positions autour du détroit, nous devons riposter immédiatement !"

 CHI_operation_black_magic:0 "Opération Magie Noire"
 CHI_operation_black_magic_desc:0 "avec le déclenchement de la deuxième crise du détroit de Taiwan, les Américains sont prêts à nous aider à modifier certains de nos chasseurs pour les équiper des premiers missiles air-air AIM-9 Sidewinder nouvellement développés, cela nous donnera sûrement un avantage sur les chasseurs MiG-15 et MiG-17 de fabrication soviétique des communistes chinois tout en menant une guerre pour la suprématie aérienne sur les îles de Kinmen."

 CHI_islamic_insurgency:0 "L'insurrection islamique"
 CHI_islamic_insurgency_desc:0 "Les restes du général Ma Bufang et de la famille Ma résistent toujours dans les régions du Qinghai et du Xinjiang de la République. Avec l'aide des États-Unis, nous pourrions être en mesure de les soutenir avec des armes pour les inciter à se rebeller contre le régime du PCC."

 CHI_Aid_For_Ma_hushan:0 "Aide à Ma Hushan"
 CHI_Aid_For_Ma_hushan_desc:0 "Le général Ma Hushan est la figure clé des troupes islamistes menant une guérilla contre l'APL. Nous devons le contacter, le ravitailler et discuter de l'avenir des 14 000 anciens soldats musulmans."

 CHI_CIA_connections:0 "Connexions de la CIA"
 CHI_CIA_connections_desc:0 "Le président [CHI.GetLeader] croit fermement que nous devons aider l'insurrection islamique au Qinghai et au Xinjiang. Il a ordonné aux avions du Kuomintang de larguer régulièrement des fournitures et des armes aux musulmans de la région de l'Amdo avec l'aide de la Central Intelligence Agency des États-Unis."

 CHI_recalling_muslim_generals:0 "Rappel des généraux musulmans"
 CHI_recalling_muslim_generals_desc:0 "La situation est devenue désastreuse pour les dernières divisions musulmanes. Peut-être devrions-nous travailler plus étroitement avec l'Inde et leur demander de nous aider à évacuer nos généraux restants au Tibet, au Xinjiang et au Qinghai."


 CHI_Reinforced_American_Ties:0 "Des liens américains renforcés"
 CHI_Reinforced_American_Ties_desc:0 "Après avoir sollicité des armes et des avions auprès des États-Unis, nous estimons qu'il est juste de renforcer les liens diplomatiques avec les Américains, notre plus proche allié, dans le but commun d'empêcher la propagation du communisme là où il se trouve."

 CHI_Support_Anti_Communist_Insurgents:0 "Soutenez les insurgés anticommunistes"
 CHI_Support_Anti_Communist_Insurgents_desc:0 "La guerre n'est pas perdue ! Nous continuerons à soutenir les insurgés sur le continent et dans toute l'Asie du Sud-Est pour résister à la propagation rapide du communisme et saper les complots des Soviétiques et des Chinois !"

 CHI_Continue_to_Support_Operations_in_Burma:0 "Continuer à soutenir les opérations en Birmanie"
 CHI_Continue_to_Support_Operations_in_Burma_desc:0 "Nous devons poursuivre nos opérations en Birmanie pour contenir les insurrections des communistes du drapeau rouge et du drapeau blanc. La Birmanie doit être rendue stable et libérée des périls du communisme."



 CHI_Republic_of_China_Navy:0 "Marine de la République de Chine"
 CHI_Republic_of_China_Navy_desc:0 "Notre marine doit être renforcée pour gouverner la mer de Chine méridionale ! Nous devons recruter et former des marins compétents pour que les eaux chinoises nous appartiennent."

 CHI_Develop_Taiwanese_Shipyards:0 "Développer les chantiers navals taïwanais"
 CHI_Develop_Taiwanese_Shipyards_desc:0 "Taiwan est l'endroit idéal pour les chantiers navals, étant situé sur une île. Nous développerons plusieurs installations pour commencer à produire nos propres navires, afin de compléter notre flotte."

 CHI_Commissioning_of_Former_IJN_Destroyers:0 "Mise en service des anciens destroyers IJN"
 CHI_Commissioning_of_Former_IJN_Destroyers_desc:0 "Maintenant que le Japon est allié aux États-Unis, nous avons gracieusement accepté l'offre de plusieurs anciens destroyers japonais. Il est temps de les mettre en service et de les présenter à notre vaillante marine !"

 CHI_Purchase_American_Destroyers:0 "Acheter des navires de débarquement américains"
 CHI_Purchase_American_Destroyers_desc:0 "Les Américains ont également proposé de nous vendre des navires excédentaires, et nous accepterons ; plusieurs destroyers américains plus anciens seront également ajoutés à la flotte toujours croissante."

 CHI_Expand_the_Marine_Corps:0 "Développez le Corps des Marines"
 CHI_Expand_the_Marine_Corps_desc:0 "Le Corps des Marines de la République de Chine (ROCMC) doit être élargi. Formés en 1914, les Marines constituent la branche la plus élitiste des forces armées et doivent être bien entraînés à toutes sortes de combats."

 CHI_The_Temporary_Provisions:0 "Les dispositions temporaires"
 CHI_The_Temporary_Provisions_desc:0 "Afin de réprimer la rébellion communiste, nous devons établir la loi martiale et annuler la constitution de la République de Chine. Des mesures d'urgence doivent être mises en place pour assurer la sécurité nationale et la sûreté de notre nation. Nous devrons rester dans ces conditions jusqu'à ce que nous puissions réussir à reprendre le continent !"

 CHI_Reconstruct_the_KMT:0 "Reconstruire le KMT"
 CHI_Reconstruct_the_KMT_desc:0 "Nous avons peut-être perdu le continent, mais Taiwan est toujours à nous ! Le KMT, ou Kuomintang, restera fort et se concentrera sur la prospérité économique. Nous devons reconstruire et reconstruire notre nouvelle maison."

 CHI_The_Academy_for_the_Study_of_Carrying_out_Revolution:0 "L'Académie pour l'étude de la réalisation de la révolution"
 CHI_The_Academy_for_the_Study_of_Carrying_out_Revolution_desc:0 "Nous devons étudier les échecs du KMT continental et découvrir nos défauts, ainsi que la manière dont nous pouvons fermenter une nouvelle révolution contre le gouvernement communiste."

 CHI_all_is_not_yet_lost:0 "Tout n'est pas encore perdu !"
 CHI_all_is_not_yet_lost_desc:0 "Bien qu'il ait été exilé sur l'île de Taiwan par les bandits communistes, il existe toujours une certitude quant à la reconquête du continent. Le Généralissime est sûr que les bandits communistes finiront par plonger la Chine dans l'instabilité et le chaos, ouvrant la voie au Kuomintang pour qu'il retourne sur le continent et expulse les bandits. Ce n'est qu'une question de temps avant que la prédiction de Chiang ne devienne réalité."

 CHI_triumph_plan:0 "Le plan triomphal"
 CHI_triumph_plan_desc:0 "Avec l'aide des conseillers militaires japonais du Groupe Blanc, ils ont contribué à former nos forces armées pour qu'elles soient plus organisées et prêtes au combat. Ils contribueront également au Plan de Triomphe pour définir les futures opérations de contre-attaque sur le continent."

 CHI_victory_plan:0 "Le plan de victoire"
 CHI_victory_plan_desc:0 "Sans le soutien des conseillers militaires japonais, nous devons décrire les préparatifs pour reprendre le continent par nous-mêmes avec un soutien américain limité en raison de leur opposition à l'idée de notre reconquête du continent."

 CHI_zhongxing_planning_office:0 "Bureau de planification de Zhongxing"
 CHI_zhongxing_planning_office_desc:0 "La création du Bureau de planification de Zhongxing pour les organisations de tâches commencera, nous inclurons uniquement les membres ayant des liens étroits avec le Généralissime parmi les états-majors de planification."

 CHI_Intensify_the_White_Terror:0 "Intensifier la terreur blanche"
 CHI_Intensify_the_White_Terror_desc:0 "Certains « dissidents politiques » doivent être arrêtés pour leur opposition au Kuomintang. Tous les espions communistes parmi nous doivent être éliminés. La Terreur blanche doit être renforcée pour éliminer ceux qui refusent de s'aligner sur les objectifs du KMT."

 CHI_Execute_Aborginee_Leaders:0 "Exécuter les dirigeants aborigènes"
 CHI_Execute_Aborginee_Leaders_desc:0 "Certains dirigeants des peuples autochtones de Taiwan se sont opposés aux politiques du KMT et à leur « assimilation forcée » dans la société chinoise. Nous devons donner l'exemple à ceux qui s'opposent à nous et exécuter plusieurs dirigeants autochtones en guise de déclaration."

 CHI_Sinification_Campaign:0 "Campagne de sinification"
 CHI_Sinification_Campaign_desc:0 "Nous devons nous lancer dans une campagne d'éducation et d'influence auprès des peuples autochtones de Taiwan, afin de faire de notre jeune république un phare de la démocratie et de la culture chinoises. Nous devons combattre les anciennes influences japonaises qui ont entaché le peuple."

 CHI_Repress_Taiwanese_Activists:0 "Réprimer les militants taïwanais"
 CHI_Repress_Taiwanese_Activists_desc:0 "Ceux qui refusent de s'aligner sur les idéaux du KMT doivent être réprimés, c'est le seul moyen de maintenir l'ordre et la stabilité. Les opposants politiques seront traités."

 CHI_Ban_the_Formation_of_New_Political_Parties:0 "Interdire la formation de nouveaux partis politiques"
 CHI_Ban_the_Formation_of_New_Political_Parties_desc:0 "De nouveaux partis politiques ne sont ni nécessaires ni nécessaires. Le KMT est fort et tous ceux qui s'y opposent sont devenus un exemple. La République de Chine ne sera pas une démocratie fracturée et marquée par des luttes politiques internes !"

 CHI_Outlaw_Native_Languages:0 "Mouvement de promotion du mandarin"
 CHI_Outlaw_Native_Languages_desc:0 "Le chinois mandarin sera nécessaire à connaître pour communiquer et s'adapter à nos traditions. Toutes les autres langues ne veulent rien dire et ne servent à rien à la République de Chine."

 CHI_Rename_Street_Names:0 "Renommer les noms de rues"
 CHI_Rename_Street_Names_desc:0 "Conformément à notre campagne de sinification, nous renommerons certaines rues pour refléter les emplacements du continent, car elles constituent notre territoire légitime."

 CHI_appoint_chen_cheng_vp:0 "Nommer Chen Cheng vice-président"
 CHI_appoint_chen_cheng_vp_desc:0 "Chen Cheng, premier ministre de la République, héros de la guerre civile et ancien gouverneur de la province de Taiwan, s'est révélé auprès du généralissime l'un de ses conseillers politiques les plus proches et les plus efficaces. Ses campagnes de réforme agraire ainsi que ses projets d'infrastructures et sa crédibilité internationale, notamment auprès des États-Unis, ont grandement amélioré l'efficacité de notre gouvernement. Le président Chiang a désormais décidé de le promouvoir au poste de vice-président de la République, laissant la présidence à l'ancien maire de Shanghai, Yu Hung-chun."

 CHI_Sun_Li_Jen_Coup:0 "Coup d'État de Sun Li Jen"
 CHI_Sun_Li_Jen_Coup_desc:0 "Sun Li-jen, l'actuel commandant en chef de l'armée de la République de Chine et un vétéran distingué de la guerre civile chinoise, a pris le contrôle du gouvernement lors d'un coup d'État américain soutenu par la CIA. Sun, qui s'est opposé aux réformes de style soviétique dans les forces armées et dans le parti, a rassemblé un cercle restreint de voix politiques libérales et modérées influentes dans le but de destituer le généralissime et de modifier la situation politique actuelle avec un rationalisme et non un fanatisme idéologique aveugle."

 CHI_the_vice_presidential_debate:0 "Le débat vice-présidentiel"
 CHI_the_vice_presidential_debate_desc:0 "Avec le retrait de Chiang Kai-shek du pouvoir, la junte discute désormais de la question de savoir qui devrait désormais assumer les autres rôles politiques importants pour le moment. Il a été rapidement convenu que l'ancien Premier ministre Yan Xishan reviendrait en tant que Premier ministre provisoire, mais la position de vice-président de la République attise les tensions au sein de la junte."

 CHI_purge_pro_chiang_loyalists:0 "Le sort de la famille Chiang"
 CHI_purge_pro_chiang_loyalists_desc:0 "Avec la destitution du généralissime et de son fils, la junte est confrontée à la question de savoir quoi faire des deux Tchiang et de leur famille et quel rôle ils doivent jouer désormais. Bien que diverses voix s'élèvent pour réclamer soit un exil aux États-Unis, soit une assignation à résidence, Chiang Kai-shek jouit toujours d'un grand prestige au sein du Kuomintang, même en dehors de sa faction, en raison de ses réalisations lors de l'Expédition du Nord, des débuts de la guerre civile et de la Guerre de Résistance en tant que symbole principal de la résistance chinoise contre l'impérialisme japonais. A ce titre, le gouvernement provisoire décide que Chiang Kai-shek et sa famille..."

 CHI_release_white_terror_victims:0 "Libérez les prisonniers politiques innocents"
 CHI_release_white_terror_victims_desc:0 "Pendant la vague de terreur du règne de Chiang Kai-shek sur Taiwan, de nombreuses voix libérales, y compris des militants taïwanais, ont été emprisonnées au motif qu'elles étaient des espions et des sympathisants des bandits communistes. Nous annulerons ces purges précipitées et libérerons divers militants libéraux pour gagner davantage de soutien populaire auprès de la population. Cependant, nous garderons toujours les prisonniers communistes traîtres dans leurs cellules afin qu'ils ne détruisent pas notre gouvernement de l'intérieur."

 CHI_the_road_to_democracy:0 "La route vers la démocratie"
 CHI_the_road_to_democracy_desc:0 "La démocratie pour le peuple chinois était un aspect clé de la philosophie du Dr Sun Yat-sens. Nous allons désormais jeter les bases de la démocratisation du peuple de la République de Chine et ne pas utiliser la situation sur le continent comme prétexte pour étendre la loi martiale et suspendre les droits civils."

 CHI_continue_dang_guo:0 "Continuer Dang Guo"
 CHI_continue_dang_guo_desc:0 "La direction du Kuomintang ne peut pas encore s'arrêter. Après nous être débarrassés des éléments autoritaires, nous avons maintenant tracé une voie plus propre pour que le Kuomintang puisse guider la République vers la démocratie. D'autres partis, opposés à la philosophie des Trois principes du peuple, ne feraient que retarder le processus de démocratisation."

 KMT_fortify_tridemism:0 "L'importance du tridémisme"
 KMT_fortify_tridemism_desc:0 "Les Trois principes du peuple constituent les lignes directrices du Kuomintang et doivent être suivis de la même manière. La démocratie, le nationalisme et le bien-être ne doivent pas s'exclure et chaque principe mérite l'attention et les ressources du gouvernement."

 CHI_encourage_tangwai_washingren_cooperation:0 "Le débat Waishengren-Tangwai"
 CHI_encourage_tangwai_washingren_cooperation_desc:0 "Une fois l'ancien gouvernement renversé, nous avons commencé à jeter les bases d'une atmosphère libérale, égalitaire et tolérante à Taiwan et nous continuerons de le faire. Cependant, il reste encore à débattre si nous incluons la population autochtone dans la structure bureaucratique de la République ou si nous conservons pour le moment notre personnel continental."

 CHI_anti_corruption_campaigns:0 "Autres campagnes anti-corruption"
 CHI_anti_corruption_campaigns_desc:0 "La corruption politique est un problème majeur au KMT, mais aussi dans tout le pays. Nous devons éliminer toute corruption afin de rendre le gouvernement plus efficace et pour le peuple, au lieu de chercher à obtenir des gains personnels."

 CHI_greater_local_democratic_reforms:0 "Démocratie locale"
 CHI_greater_local_democratic_reforms_desc:0 "Afin de renforcer la légitimité de la structure politique républicaine, nous devons introduire diverses réformes politiques locales avec le concept de démocratie libérale directe. En autorisant des élections démocratiques au niveau local, telles que les élections du maire et du conseil municipal, nous augmenterons notre base de partisans et introduirons lentement la République dans le processus de démocratisation."

 CHI_rise_of_judicial_yuan:0 "Montée du Yuan judiciaire"
 CHI_rise_of_judicial_yuan_desc:0 "L'État de droit est un principe fondamental de toute démocratie. Il ne doit y avoir aucun cas où l'égalité soit rompue en matière judiciaire. La loi de la Constitution s'applique de manière égale à tous, que vous soyez un homme politique de haut rang ou un paysan local dans les régions rurales."

 KMT_Begin_Seperation_of_Party_and_state:0 "Commencer la séparation du parti et de l'État"
 KMT_Begin_Seperation_of_Party_and_state_desc:0 "La pénétration de la société et de l'armée doit être annulée. Le Kuomintang ne doit pas être égal à l'État et à ses institutions. La Constitution sera bientôt rétablie et le Kuomintang se retrouvera comme l'un des nombreux acteurs politiques du système républicain et non comme le seul acteur dominant."

 CHI_abolish_political_commissars:0 "Supprimer les commissaires politiques"
 CHI_abolish_political_commissars_desc:0 "Les commissaires politiques sont une facette typiquement communiste de l'armée, et nous ne serons jamais comme la racaille communiste ! Il est nécessaire de garder un oeil sur les idéologies de nos troupes, mais pas les commissaires."

 CHI_maintain_anti_communist_rhetoric:0 "Maintenir une rhétorique anticommuniste"
 CHI_maintain_anti_communist_rhetoric_desc:0 "Même si notre position à l'égard du continent occupé diffère de celle de la famille Chiang, en termes de récupération, le mouvement communiste reste la principale menace, non seulement pour nous mais pour l'Asie dans son ensemble. Nous continuerons à dénoncer les activités communistes et à aider toutes les nations menacées par la menace rouge."

 KMT_Outlaw_Torture_Sun_Li_Jen:0 "Torture hors-la-loi"
 KMT_Outlaw_Torture_Sun_Li_Jen_desc:0 "Comme indiqué dans la Déclaration des droits de l'homme des Nations Unies ; que le ROC a signé ; la torture est considérée comme « un traitement cruel, inhumain et dégradant ». Nous adhérerons à cette affirmation et cesserons nos efforts de torture, les rendant ainsi illégaux ; il existe des moyens plus humains d'extraire des informations."

 CHI_invite_US_observers:0 "Inviter des observateurs américains"
 CHI_invite_US_observers_desc:0 "Afin de garantir le développement sans faille de véritables structures démocratiques, nous inviterons des observateurs américains qui examineront les élections, l'État de droit ainsi que les sessions du Yuan législatif et du Yuan judiciaire."

 CHI_declare_end_of_military_rule:0 "Déclarons la fin du régime militaire"
 CHI_declare_end_of_military_rule_desc:0 "Le moment est venu de mettre fin au gouvernement intérimaire. La junte quittera le pouvoir et les préparatifs pour les prochaines élections seront faits."

 CHI_electing_a_new_government:0 "Élire un nouveau gouvernement"
 CHI_electing_a_new_government_desc:0 "Pour la première fois depuis 1948, le peuple de la République de Chine décidera de son propre avenir aux urnes. Avec la fin de la loi martiale, l'avènement de l'État de droit dans nos institutions constitutionnelles et davantage de liberté politique, il est temps d'organiser des élections libres, secrètes et égales qui continueront à stimuler le processus de démocratisation."

 CHI_Release_Formosan_Activists:0 "Libérer les militants de Formose"
 CHI_Release_Formosan_Activists_desc:0 "La République de Chine a le pouvoir de libérer les militants de Formose qui s'opposent activement au régime du Kuomintang, et nous le ferons, ils doivent apprendre à agir avec prudence."

 CHI_Accede_to_American_Pressure:0 "Céder à la pression américaine"
 CHI_Accede_to_American_Pressure_desc:0 "Les Américains nous ont forcé la main ; nous annulerons nos « interrogatoires » politiques des dissidents présumés, dans l'espoir que notre république deviendra plus sûre."

 CHI_Arrest_Sun_Li_Jen:0 "Arrêter Sun Li-Jen"
 CHI_Arrest_Sun_Li_Jen_desc:0 "Le général a eu assez de liberté ! Pour avoir conspiré en vue de destituer Chiang Kai-shek, Sun Li-Jen a été démis de ses fonctions et assigné à résidence. Cela devrait servir d'exemple aux autres hauts officiers militaires pour qu'ils placent le pays avant tout."

 CHI_Intensify_Censorship_Campaign:0 "Intensifier la campagne de censure"
 CHI_Intensify_Censorship_Campaign_desc:0 "Nous devons contrôler toutes les formes de médias, y compris les journaux, la radio et la télévision, afin de maintenir la sécurité nationale et d'empêcher toute opposition au KMT. L'opération de censure doit être intensifiée."

 CHI_Arrest_the_Intellectual_Elite:0 "Arrêter l'élite intellectuelle"
 CHI_Arrest_the_Intellectual_Elite_desc:0 "Il est nécessaire d'arrêter certains membres de l'intelligentsia afin de contenir leur opposition au gouvernement du KMT. Leur soutien vocal à la démocratie et à l'indépendance de Taiwan sera étouffé."

 CHI_Play_the_Cliques_off_Against_One_Another:0 "Jouez les cliques les unes contre les autres"
 CHI_Play_the_Cliques_off_Against_One_Another_desc:0 "Les cliques opposées au KMT doivent s'affronter les unes contre les autres, afin qu'elles se battent et que notre parti reste au sommet !"

 CHI_Empower_The_CC_Clique:0 "Renforcez la clique CC"
 CHI_Empower_The_CC_Clique_desc:0 "Le CC, ou Central Club Clique, est considéré comme l'extrême droite du Kuomintang, représentant les anticommunistes et les nationalistes, et compte de nombreux membres de l'élite du parti et de l'armée, des renseignements et de l'influence des affaires. Nous devons responsabiliser leurs actions et leur permettre de poursuivre leur influence."

 CHI_Outlaw_Political_Demonstrations:0 "Interdire les manifestations politiques"
 CHI_Outlaw_Political_Demonstrations_desc:0 "L'opposition au gouvernement du Kuomintang ne sera pas tolérée. Toute manifestation politique, en particulier celle contre le KMT, sera réprimée avec force et réduite au silence."

 CHI_Expel_Lei_Chen_From_the_Party:0 "Expulser Lei Chen du parti"
 CHI_Expel_Lei_Chen_From_the_Party_desc:0 "Lei Chen est devenu un leader du mouvement d'opposition visant à créer une République de Chine plus démocratique. Nous devons l'expulser du parti et l'arrêter, car il ne partage plus la même loyauté qu'autrefois !"

 CHI_Outlaw_Strikes:0 "Grèves des hors-la-loi"
 CHI_Outlaw_Strikes_desc:0 "Faire grève pour de meilleures conditions de travail ne sera tout simplement plus possible. Nous avons peut-être des lois autorisant les travailleurs à former des syndicats et à conclure des conventions collectives, mais toute grève en République de Chine sera combattue par la force du gouvernement et rapidement brisée, qu'elle se fasse ou non au prix de vies humaines."

 CHI_Allow_the_Former_Blueshirts_to_Run_the_Secret_Police:0 "Permettre aux anciens chemises bleues de diriger la police secrète"
 CHI_Allow_the_Former_Blueshirts_to_Run_the_Secret_Police_desc:0 "La Société de pratique des trois principes du peuple (officieusement connue sous le nom de Chemises bleues) était une faction paramilitaire ultranationaliste d'extrême droite du KMT. Connus pour leur fervent anticommunisme et leurs opérations basées sur les fascistes italiens, nous leur permettrons de prendre le contrôle du commandement de la garnison de Taiwan et d'opérer comme la police secrète du KMT."

 CHI_Empower_The_Secret_Police:0 "Donnez du pouvoir à la police secrète"
 CHI_Empower_The_Secret_Police_desc:0 "Maintenant que les Chemises bleues sont aux commandes, nous pouvons étendre les pouvoirs et la portée de la police secrète, en leur permettant de prendre toute mesure contre l'opposition au KMT ou contre d'éventuelles tendances communistes."

 CHI_Inhibit_the_Political_Center:0 "Inhiber le centre politique"
 CHI_Inhibit_the_Political_Center_desc:0 "Nous devons inhiber le centre politique de notre idéologie, au lieu de tenter de rechercher un équilibre entre les deux côtés."

 CHI_Seek_Out_American_Support:0 "Rechercher le soutien américain"
 CHI_Seek_Out_American_Support_desc:0 "Nous devons recevoir davantage de soutien de notre allié, les États-Unis. C'est le seul moyen de maintenir notre stabilité face à la méchanceté des révolutionnaires communistes du continent."

 CHI_Investigate_Mainland_Refugees:0 "Enquêter sur les réfugiés du continent"
 CHI_Investigate_Mainland_Refugees_desc:0 "Nous devons enquêter sur les réfugiés du continent, pour nous assurer qu'ils sont vraiment ici pour demander l'asile et non des agents dormants communistes !"

 CHI_Invest_in_Textiles:0 "Investir dans le textile"
 CHI_Invest_in_Textiles_desc:0 "Il est nécessaire de faire de l'industrie textile l'une des principales industries de Taiwan. Le ministère des Affaires économiques créera immédiatement un comité chargé de mettre en oeuvre l'expansion de l'industrie textile."

 CHI_Sovietize_the_Armed_Forces:0 "Soviétiser les forces armées"
 CHI_Sovietize_the_Armed_Forces_desc:0 "Grâce à l'expérience de Chiang Ching-kuo, le fils de notre président, nous apporterons à notre armée des réformes militaires de type soviétique ; Maintenant que Sun Li-Jen a été « éliminé », nous pouvons étendre pleinement le corps des officiers politiques et la portée du KMT."

 CHI_Establish_Light_Industries:0 "Créer des industries légères"
 CHI_Establish_Light_Industries_desc:0 "Il est essentiel que nous commencions à produire davantage de biens de consommation en développant les industries légères, afin d'obtenir le soutien de la population."

 CHI_Democratic_Progressive_Victory:0 "Victoire démocratique progressiste"
 CHI_Democratic_Progressive_Victory_desc:0 "Aux élections de 1954, le Parti démocrate progressiste a gagné ! Le DPP est connu pour sa position de centre-gauche et nationaliste."

 CHI_A_Formosan_Identity:0 "Une identité formelle"
 CHI_A_Formosan_Identity_desc:0 "Il est nécessaire que nous commencions à nous forger une identité ici à Formose, dans notre nouveau foyer, pour montrer au monde que nous sommes un peuple diversifié."

 CHI_Moderate_Welfare_Spending:0 "Dépenses sociales modérées"
 CHI_Moderate_Welfare_Spending_desc:0 "Le gouvernement commencera à assumer davantage de dépenses en matière de santé publique, d'hôpitaux et de prévention des maladies. Le ministère de la Santé et du Bien-être social sera créé à cet effet."

 CHI_Increase_Ties_to_South_Korea:0 "Renforcer les liens avec la Corée du Sud"
 CHI_Increase_Ties_to_South_Korea_desc:0 "Nous devons étendre nos relations amicales et diplomatiques avec d'autres nations libres d'Asie. La Corée du Sud doit être notre alliée, car nos deux pays font face à des menaces de communisme que nous devons partager."

 CHI_Japanese_Investments:0 "Investissements japonais"
 CHI_Japanese_Investments_desc:0 "Nous autoriserons le gouvernement japonais et les entreprises japonaises à investir dans nos textiles et nos industries légères, cela renforcera les relations entre nous deux et profitera à tous."

 CHI_Industrial_Expansion:0 "Expansion industrielle"
 CHI_Industrial_Expansion_desc:0 "Nous devons continuer à développer notre industrie, tant celle des biens lourds que celle des biens de consommation. La République de Chine sera connue pour sa puissance industrielle !"

 CHI_Defend_Our_Newfound_Independence:0 "Défendre notre nouvelle indépendance"
 CHI_Defend_Our_Newfound_Independence_desc:0 "La République de Chine est une nation indépendante et souveraine, et toute tentative de la République populaire de Chine pour changer cela échouera. Nous nous battrons pour notre indépendance !"

 CHI_Naturalization_of_the_Military:0 "Naturalisation des militaires"
 CHI_Naturalization_of_the_Military_desc:0 "Si un non-citoyen a servi dans les forces armées de la République de Chine, il sera naturalisé et deviendra citoyen taïwanais en reconnaissance de son service rendu à l'État."

 CHI_Constitutional_Reform:0 "Réforme constitutionnelle"
 CHI_Constitutional_Reform_desc:0 "La Constitution de la République de Chine doit être réformée pour affirmer notre souveraineté, notre territoire et notre indépendance vis-à-vis du régime communiste."

 CHI_Democratic_Progressive_Victory_1958:0 "Victoire démocratique progressiste 1958"
 CHI_Democratic_Progressive_Victory_1958_desc:0 "Aux élections de 1958, le Parti démocrate progressiste a gagné ! Le DPP est connu pour sa position de centre-gauche et nationaliste."

 CHI_Purchase_American_Weaponry:0 "Acheter des armes américaines"
 CHI_Purchase_American_Weaponry_desc:0 "Afin de suivre le rythme des technologies émergentes, nous devons continuer à acheter des armes et des équipements aux États-Unis, pour des raisons de défense et de sécurité nationales."

 CHI_Trade_Deal_with_Indonesia:0 "Accord commercial avec l'Indonésie"
 CHI_Trade_Deal_with_Indonesia_desc:0 "Il est nécessaire de conclure un accord commercial avec l'Indonésie, puissance voisine, pour obtenir du pétrole, du gaz et de l'huile de palme. En échange, nous leur donnerons des textiles et des biens de consommation."

 CHI_Abandon_Hope:0 "Abandonner l'espoir"
 CHI_Abandon_Hope_desc:0 "Cet effort est inutile. Les forces communistes ne sont présentes que de l'autre côté de la mer, et elles viendront bientôt en masse et nous soumettront tous. Nous devons abandonner tout espoir et faire face aux faits."

 CHI_Political_Instability:0 "Instabilité politique"
 CHI_Political_Instability_desc:0 "Il existe une énorme instabilité politique dans la situation actuelle. Des factions de tous bords se disputent le pouvoir et le pays tout entier est plongé dans le chaos."

 CHI_Increase_Taiwanese_Repression:0 "Augmenter la répression taïwanaise"
 CHI_Increase_Taiwanese_Repression_desc:0 "Nous devons assimiler les Taiwanais d'origine et les faire adhérer pleinement aux principes du Kuomintang et du gouvernement en place. Toute opposition sera réduite au silence."

 CHI_Legacy_of_the_228_Incident:0 "L'héritage de l'incident 228"
 CHI_Legacy_of_the_228_Incident_desc:0 "Nous devons nous excuser auprès des familles des victimes de l'incident 228 et ne jamais oublier cette horrible tragédie qui est arrivée à la population."

 CHI_The_Formosan_Revolution:0 "La révolution de Formose"
 CHI_The_Formosan_Revolution_desc:0 "Le peuple doit se soulever contre le gouvernement corrompu et autoritaire du Kuomintang ! Nous ne resterons pas sous le coup de la répression nationaliste !"

 CHI_The_Republic_of_Formosa_Provisional_Government:0 "Gouvernement provisoire de la République de Formose"
 CHI_The_Republic_of_Formosa_Provisional_Government_desc:0 "Maintenant que nous avons renversé le gouvernement corrompu du KMT, nous devons créer un parti plus démocratique et moins nationaliste pour le peuple."

 CHI_Restore_Japanese_Relations:0 "Restaurer les relations japonaises"
 CHI_Restore_Japanese_Relations_desc:0 "Nous sommes à nouveau Formose, le Japon doit s'impliquer davantage dans nos relations et dans la sécurité régionale. Les relations diplomatiques seront rétablies."

 CHI_President_Thomas_Liao:0 "Président Thomas Liao"
 CHI_President_Thomas_Liao_desc:0 "Thomas Liao est un illustre fondateur du mouvement indépendantiste taïwanais. Maintenant que nous sommes devenus la République de Formose, il semble juste de le nommer président de la nouvelle nation indépendante."

 CHI_Equal_Rights:0 "Égalité des droits"
 CHI_Equal_Rights_desc:0 "Contrairement à la répression politique et à l'assimilation forcée pratiquées par le gouvernement du Kuomintang, chaque citoyen de Formose sera traité sur un pied d'égalité et jouira de toutes les libertés."

 CHI_Formation_of_the_Democratic_Progressive_Party:0 "Formation du Parti démocrate progressiste"
 CHI_Formation_of_the_Democratic_Progressive_Party_desc:0 "Le Parti Démocratique Progressiste doit être fondé afin de promouvoir les idées de bien-être et de nationalisme pour notre nouvelle république."

 CHI_Promote_Formosan_Culture:0 "Promouvoir la culture de Formose"
 CHI_Promote_Formosan_Culture_desc:0 "Nous devons favoriser une identité favorable aux peuples autochtones de Formose, nous ne serons pas connus pour leur culture chinoise, mais pour la nôtre."

 CHI_Ban_The_KMT:0 "Interdire le KMT"
 CHI_Ban_The_KMT_desc:0 "Le KMT est un parti corrompu et brutalement autoritaire. Ils ne seront plus jamais tolérés à Formose. Nous ne voulons pas d'eux ici."

 CHI_Seek_American_Aid:0 "Rechercher l'aide américaine"
 CHI_Seek_American_Aid_desc:0 "Nous devons continuer à recevoir l'aide américaine, quel que soit le changement de régime. Nous avons besoin d'aide pour nous aider à mener à bien la révolution et à défendre nos côtes."

 CHI_Education_Reform:0 "Réforme de l'éducation"
 CHI_Education_Reform_desc:0 "Nous devons changer le programme de l'histoire. Au lieu de glorifier l'arrivée du Kuomintang, nous devrions leur en vouloir et promouvoir davantage d'éducation des sociétés indigènes à Formose."

 CHI_Free_Market_Reforms:0 "Réformes du marché libre"
 CHI_Free_Market_Reforms_desc:0 "La République de Formose doit continuer à être une puissance leader sur la scène mondiale. Notre système économique doit être réformé pour refléter un commerce ouvert avec tous les pays."

 CHI_One_China_One_Formosa:0 "Une Chine, une Formose"
 CHI_One_China_One_Formosa_desc:0 "Le moment est venu, il faut arrêter de rêver à reconquérir le continent. La guerre civile est terminée et il n'y a désormais aucun espoir d'écraser les communistes. Nous accepterons notre territoire actuel, et rien de plus ; La Chine et Formose sont désormais différentes."

 CHI_Taiwanese_Communist_Party_Victory:0 "Victoire du Parti communiste taïwanais"
 CHI_Taiwanese_Communist_Party_Victory_desc:0 "Le Parti communiste taïwanais a remporté les élections de 1954 ! Le Parti communiste taïwanais est connu pour... Eh bien... Le communisme."

 CHI_Emulate_the_Japanese_Communist_Party:0 "Imitez le Parti communiste japonais"
 CHI_Emulate_the_Japanese_Communist_Party_desc:0 "Nous ne devons pas nous tourner vers des politiques répressives staliniennes. En imitant les communistes japonais, nous nous concentrerons sur le développement économique plutôt que sur l'autoritarisme."

 CHI_Increase_Welfare:0 "Augmenter le bien-être"
 CHI_Increase_Welfare_desc:0 "Il est essentiel que nous consacrions plus d'argent aux soins de santé et à d'autres besoins, pour le bien-être de notre population et une meilleure qualité de vie pour tous."

 CHI_Socialist_Values:0 "Valeurs socialistes"
 CHI_Socialist_Values_desc:0 "Les valeurs socialistes peuvent être utiles à la République de Formose, nous devons commencer à consolider l'économie entre les mains du gouvernement et faire ce qu'il y a de mieux pour notre peuple."

 CHI_Embrace_Secularism:0 "Adoptez la laïcité"
 CHI_Embrace_Secularism_desc:0 "La religion est morte, et de telles aspirations creuses ne feraient que nous détourner de notre développement économique et de notre défense nationale."

 CHI_Reconstruction:0 "Reconstruction"
 CHI_Reconstruction_desc:0 "Nous devons reconstruire après des années de guerre civile, de répression politique et de violence. Formose redeviendra forte."

 CHI_Universal_Elementary_Education:0 "Enseignement élémentaire universel"
 CHI_Universal_Elementary_Education_desc:0 "Chaque enfant de notre pays, quels que soient sa race ou son sexe, mérite de recevoir une éducation égale et impartiale. Nous le fournirons."

 CHI_Reduce_Unemployment_Crisis:0 "Réduire la crise du chômage"
 CHI_Reduce_Unemployment_Crisis_desc:0 "Pour réduire le chômage, nous devons offrir des emplois aux gens, sous la forme de travaux gouvernementaux ou dans les industries. Cela renforcera encore davantage notre économie."

 CHI_Reduce_Land_Rent_Costs:0 "Réduire les coûts de location des terrains"
 CHI_Reduce_Land_Rent_Costs_desc:0 "L'agriculture à Taiwan peut être stimulée en réduisant les coûts de location des terres, permettant ainsi à l'homme ordinaire de démarrer une ferme et permettant une plus grande prospérité partout."

 CHI_Promote_Domestic_Industry:0 "Promouvoir l'industrie nationale"
 CHI_Promote_Domestic_Industry_desc:0 "Nous devons essayer de maintenir toute la fabrication exclusivement à Taiwan ; nous ne pouvons pas dépendre très longtemps des importations étrangères."

 CHI_Repatriate_Former_Japanese_Property:0 "Rapatrier une ancienne propriété japonaise"
 CHI_Repatriate_Former_Japanese_Property_desc:0 "Ce qui était autrefois japonais est désormais le nôtre. Toute propriété japonaise à Taiwan deviendra propriété du gouvernement."

 CHI_The_Farmers_Fields_Bill:0 "Le projet de loi sur les champs agricoles"
 CHI_The_Farmers_Fields_Bill_desc:0 "Le projet de loi sur les champs agricoles sera adopté par le Yuan législatif, accordant davantage de droits aux agriculteurs et permettant à leurs excédents d'être vendus pour des profits élevés au profit de l'État."

 CHI_American_Foreign_Aid:0 "Aide étrangère américaine"
 CHI_American_Foreign_Aid_desc:0 "Une aide étrangère accrue est nécessaire de la part des États-Unis pour nous permettre de soutenir notre économie et notre système de protection sociale en pleine croissance."

 CHI_Protectionism:0 "Protectionnisme"
 CHI_Protectionism_desc:0 "Afin de renforcer davantage notre économie, nous devons être contraints de taxer les importations, afin de donner à nos industries nationales un avantage sur le marché de Formose."

 CHI_Increase_Literacy_Rates:0 "Augmenter les taux d'alphabétisation"
 CHI_Increase_Literacy_Rates_desc:0 "Notre système éducatif performant ne peut qu'augmenter les taux d'alphabétisation de notre population et rendre les gens de plus en plus intelligents !"

 CHI_Economic_Integration_of_Recent_Immigrants:0 "Intégration économique des immigrants récents"
 CHI_Economic_Integration_of_Recent_Immigrants_desc:0 "Tous les immigrants récents, qu'ils viennent du continent ou d'ailleurs, seront intégrés rapidement et efficacement dans la main-d'oeuvre nationale, où ils deviendront de fiers exemples de citoyens de Formose."

 CHI_Womens_Rights:0 "Droits des femmes"
 CHI_Womens_Rights_desc:0 "Dans le cadre de notre croyance dans les libertés individuelles, les femmes devraient bénéficier de tous les droits à l'emploi, au vote et à l'éducation, tout autant que n'importe quel homme."

 CHI_Establish_a_Minimum_Wage:0 "Établir un salaire minimum"
 CHI_Establish_a_Minimum_Wage_desc:0 "L'époque des salaires exorbitants est révolue ! Avec l'inflation, le gouvernement fixera un montant horaire minimum que chaque travailleur devrait percevoir pour tenir compte du coût de la vie."

 CHI_Expand_the_Port_of_Kaohsiung:0 "Agrandir le port de Kaohsiung"
 CHI_Expand_the_Port_of_Kaohsiung_desc:0 "Pendant l'occupation japonaise de Taiwan, plusieurs projets d'expansion furent lancés, la dernière phase étant interrompue en raison de la Seconde Guerre mondiale. Il faut poursuivre cette expansion, afin de faire de Kaohsiung un port majeur pour Taiwan."

 CHI_Invest_in_Taipei:0 "Investir à Taipei"
 CHI_Invest_in_Taipei_desc:0 "Taipei, notre brillante capitale, doit faire l'objet d'investissements massifs ; elle a la capacité d'être un centre de commerce international et le gouvernement de Formose devrait faire tout ce qui est en son pouvoir pour atteindre cet objectif."

 CHI_Urbanization:0 "Urbanisation"
 CHI_Urbanization_desc:0 "Nous devons urbaniser les grandes villes et les banlieues de Taiwan, la population en croissance rapide a besoin de lieux de vie et de travail, et les villes doivent s'étendre !"

 CHI_Lift_the_Ban_on_the_KMT:0 "Lever l'interdiction du KMT"
 CHI_Lift_the_Ban_on_the_KMT_desc:0 "Même si le KMT est connu pour son oppression politique et son autoritarisme, nous devons être transparents dans le processus politique. L'interdiction sera levée et le Kuomintang sera à nouveau autorisé à opérer à Taiwan."

 CHI_Promote_Democratic_Values:0 "Promouvoir les valeurs démocratiques"
 CHI_Promote_Democratic_Values_desc:0 "Nous ne voulons pas que Taiwan revienne à un État policier sous le pouvoir du KMT, l'idée de démocratie doit être implantée chez chaque citoyen pour lui garantir sa liberté et sa prospérité."

 CHI_Housing_Reform:0 "Réforme du logement"
 CHI_Housing_Reform_desc:0 "À mesure que la population augmente, le gouvernement doit rendre le logement et son accès plus abordables et plus faciles à réaliser, en particulier pour les personnes à faible revenu de notre société."

 CHI_Expand_Health_Access:0 "Élargir l'accès à la santé"
 CHI_Expand_Health_Access_desc:0 "L'accès à la santé doit être garanti à tous. Le ministère de la Santé et du Bien-être social doit déployer de véritables efforts pour rendre l'accès aux soins de santé accessible à tous les citoyens de Taiwan, quels que soient leur race, leur sexe ou leurs croyances."

 CHI_Expand_Labor_Unions:0 "Développer les syndicats"
 CHI_Expand_Labor_Unions_desc:0 "Il faut donner au peuple le pouvoir de négocier collectivement les droits des travailleurs. Les syndicats seront élargis pour permettre à l'homme ordinaire d'obtenir les droits qu'il mérite, grâce au processus démocratique. Nous ne serons plus des esclaves !"

 CHI_Freedom_of_the_Press:0 "Liberté de la presse"
 CHI_Freedom_of_the_Press_desc:0 "Les médias ne seront plus ce qu'ils étaient sous le KMT. Il n'y aura pas de journaux appartenant à l'État et les médias seront autorisés à rendre compte du gouvernement et de la politique sans conséquence, pour la liberté du peuple."

 CHI_Infrastructure_Modernization:0 "Modernisation des infrastructures"
 CHI_Infrastructure_Modernization_desc:0 "Nos routes, bâtiments publics, barrages, canaux et ports doivent être modernisés et améliorés avec l'évolution des temps. Nous ne pouvons pas permettre que nos infrastructures vitales vieillissent et s'effondrent dans un pays aussi prospère et prospère."

 CHI_China_Democratic_Socialist_Party_Victory_1958:0 "Victoire du Parti Socialiste Démocratique Chinois 1958"
 CHI_China_Democratic_Socialist_Party_Victory_1958_desc:0 "Le Parti socialiste démocratique chinois a remporté les élections de 1958 ! Le CDSP est connu pour son socialisme démocratique de centre-gauche, plaidant pour la paix mondiale, les libertés individuelles et les systèmes de protection sociale."

 CHI_The_Formosan_Welfare_State:0 "L'État providence de Formose"
 CHI_The_Formosan_Welfare_State_desc:0 "Notre système de protection sociale doit être massivement étendu, pour permettre à tous les aspects d'un État-providence traditionnel d'apparaître ; Formose doit être connue pour son excellent système de santé et son État-providence assuré par le gouvernement !"

 CHI_Socialized_Health_Care:0 "Soins de santé socialisés"
 CHI_Socialized_Health_Care_desc:0 "Le gouvernement de Formose fournira des soins de santé à sa population, via des coûts réduits et des plans de soins de santé, qui coûteront très peu aux gens ordinaires en visites à l'hôpital ou en examens standards."

 CHI_Establish_Pensions:0 "Établir des retraites"
 CHI_Establish_Pensions_desc:0 "Nos citoyens âgés doivent être pris en charge et pris en charge de la même manière que tout le monde dans notre pays. Nous fournirons des allocations de retraite ou des pensions aux retraités pour leur permettre de vivre confortablement leurs dernières années."

 CHI_Promote_World_Peace:0 "Promouvoir la paix mondiale"
 CHI_Promote_World_Peace_desc:0 "Nous avons mis fin à notre conflit avec la Chine communiste et nous exhortons tous les autres pays du monde à mettre de côté leurs différences idéologiques ou politiques et à faire de la Terre un endroit globalement plus sûr pour tous."

 CHI_Condemn_Soviet_Imperialism:0 "Condamner l'impérialisme soviétique"
 CHI_Condemn_Soviet_Imperialism_desc:0 "L'impérialisme soviétique a dépassé les limites. L'implication soviétique en Europe de l'Est, au Moyen-Orient et en Asie du Sud-Est est allée assez loin."

 CHI_The_Plight_of_the_Indigenous_Formosans:0 "Le sort des indigènes de Formose"
 CHI_The_Plight_of_the_Indigenous_Formosans_desc:0 "Nos indigènes de Formose ont beaucoup souffert ; Un chômage élevé, une éducation de qualité inférieure, l'assimilation culturelle et la perte des langues ont ruiné les autochtones."

 CHI_Rural_Investments:0 "Investissements ruraux"
 CHI_Rural_Investments_desc:0 "Nous devons soutenir notre industrie agricole en investissant davantage dans la propriété rurale, les fermes et les subventions aux cultures ; cela renforcera nos marchés nationaux et étrangers."

 CHI_China_Democratic_Socialist_Party_Victory:0 "Victoire du Parti Socialiste Démocratique Chinois"
 CHI_China_Democratic_Socialist_Party_Victory_desc:0 "Le Parti socialiste démocratique chinois a remporté les élections de 1958 ! Le CDSP est connu pour son socialisme démocratique de centre-gauche, plaidant pour la paix mondiale, les libertés individuelles et les systèmes de protection sociale."

 CHI_Reform_the_Formosan_Navy:0 "Réformer la marine de Formose"
 CHI_Reform_the_Formosan_Navy_desc:0 "Notre marine doit être réformée, tant dans son équipement que dans ses officiers ; la marine de Formose doit être réformée pour refléter une stratégie défensive, en utilisant les derniers équipements et tactiques d'entraînement."

 CHI_Relations_With_South_Vietnam:0 "Relations avec le Sud-Vietnam"
 CHI_Relations_With_South_Vietnam_desc:0 "Il est impératif que le gouvernement de Formose entame dès que possible des relations diplomatiques avec le Sud-Vietnam, car il s'agit d'un autre pays asiatique menacé par les révolutionnaires communistes."

 CHI_Attract_Formosan_Loyalists:0 "Attirer les loyalistes de Formose"
 CHI_Attract_Formosan_Loyalists_desc:0 "Les loyalistes du mouvement formose et les peuples indigènes doivent être attirés et soutenus, nous avons besoin de plus de diversité et de transparence au sein de notre gouvernement."

 CHI_A_Free_Formosa:0 "Une Formose libre"
 CHI_A_Free_Formosa_desc:0 "Formose doit être libérée de la méchanceté du régime communiste chinois ! Nos troupes doivent être entraînées pour défendre notre pays !"

 CHI_Cooperate_with_the_Treaty_Ports:0 "Coopérer avec les ports du traité"
 CHI_Cooperate_with_the_Treaty_Ports_desc:0 "Nous devons continuer à coopérer avec les ports conventionnels que nous imposent les puissances occidentales, ce qui nous permettra de poursuivre nos échanges commerciaux avec le reste du monde."

 CHI_Reform_the_Tax_Code:0 "Réformer le code des impôts"
 CHI_Reform_the_Tax_Code_desc:0 "Notre système fiscal doit être remanié afin que nos citoyens les plus riches soient davantage imposés et ne puissent éviter de payer leurs impôts ; nos impôts sont essentiels au fonctionnement du gouvernement et au succès de notre pays."

 CHI_New_Taiwan_Dollars:0 "Nouveaux dollars de Taïwan"
 CHI_New_Taiwan_Dollars_desc:0 "Pour résoudre pleinement notre crise d'hyperinflation, nous instituerons une nouvelle forme de dollar taïwanais. Ce dollar sera égal à 40 000 anciens dollars taïwanais et le gouvernement échangera volontiers toutes les devises contre la nouvelle version."

 CHI_Socialist_Unions:0 "Syndicats socialistes"
 CHI_Socialist_Unions_desc:0 "Les travailleurs doivent s'unir, non seulement dans des syndicats, mais aussi dans des groupes promouvant les valeurs du socialisme et les moyens de production."

 CHI_Distance_Ourselves_From_Maoism:0 "Nous nous éloignons du maoïsme"
 CHI_Distance_Ourselves_From_Maoism_desc:0 "Les principes chinois du communisme, plus communément appelés maoïsme, sont vils et ne conviennent pas à un pays comme Taiwan. Nous utiliserons les principes du socialisme yougoslave au lieu des idées autoritaires et destructrices du maoïsme."

 CHI_Soviet_Aid:0 "Aide soviétique"
 CHI_Soviet_Aid_desc:0 "Nous demanderons l'aide de l'Union soviétique pour nous aider dans notre développement militaire et économique. Nous adoptons une forme de gouvernement typiquement socialiste et l'URSS bénéficiera de notre travail."

 CHI_Establishing_a_Taiwanese_Identity:0 "Établir une identité taïwanaise"
 CHI_Establishing_a_Taiwanese_Identity_desc:0 "Notre identité nationale doit être basée sur les idéaux indigènes de Taiwan, notre pays. Nous ne défendrons aucun autre idéal que celui d'une identité spécifiquement taïwanaise."

 CHI_Limited_Collectivization:0 "Collectivisation limitée"
 CHI_Limited_Collectivization_desc:0 "Pour renforcer notre industrie agricole, nous poursuivrons la création limitée de fermes publiques ou collectives, administrées par le gouvernement national ; cela centralisera notre approvisionnement alimentaire et nos techniques agricoles et garantira l'égalité dans tout le pays."

 CHI_Ties_with_North_Korea:0 "Liens avec la Corée du Nord"
 CHI_Ties_with_North_Korea_desc:0 "Maintenant que nous sommes passés à un gouvernement socialiste, nous devons devenir amis avec la République populaire démocratique de Corée (RPDC), un autre grand pays asiatique socialiste, connu pour sa force économique et sa prospérité !"

 CHI_Encourage_Indigenous_Culture:0 "Encourager la culture autochtone"
 CHI_Encourage_Indigenous_Culture_desc:0 "Nos citoyens natifs de Taiwan doivent être accueillis pour leur culture et leurs différentes langues. Nous ne devons pas tenter de les endoctriner dans notre culture, mais plutôt les respecter."

 CHI_Egalitarian_Reforms:0 "Réformes égalitaires"
 CHI_Egalitarian_Reforms_desc:0 "Tous les habitants de Taiwan doivent être égaux ; nous devons réformer notre gouvernement et notre société pour refléter l'égalité de tous, non fondée sur le sexe, la race ou la classe."

 CHI_Soviet_Advisors:0 "Conseillers soviétiques"
 CHI_Soviet_Advisors_desc:0 "Nous devons accueillir dans notre pays des conseillers de l'URSS pour nous assister dans nos affaires économiques et militaires."

 CHI_Join_COMECON:0 "Rejoignez le COMÉCON"
 CHI_Join_COMECON_desc:0 "Le COMECON, ou Conseil d'assistance économique mutuelle, est une organisation du bloc de l'Est destinée à aider tous les pays socialistes dans leurs affaires économiques, afin de les rendre forts. Nous rejoindrons le COMECON, car tout soutien économique de nos nouveaux alliés serait bénéfique."

 CHI_Condemn_Maoism:0 "Condamner le maoïsme"
 CHI_Condemn_Maoism_desc:0 "L'idéologie du maoïsme est défectueuse et nous ne pouvons pas la tolérer. En tant que fier pays socialiste, nous devons dénoncer le maoïsme comme étant la mauvaise philosophie qu'il est aujourd'hui."

 CHI_Aid_the_Vietminh:0 "Aidez le Vietminh"
 CHI_Aid_the_Vietminh_desc:0 "Le Viet Minh, une organisation anti-impérialiste vietnamienne, est attaché aux idéaux du socialisme vietnamien et de la libération du colonialisme français. Nous devons soutenir leurs efforts partisans !"

 CHI_Taiwanese_Communist_Party_Victory_58:0 "Victoire du Parti communiste taïwanais 58"
 CHI_Taiwanese_Communist_Party_Victory_58_desc:0 "Le Parti communiste taïwanais a remporté les élections de 1958 ! Le Parti communiste taïwanais est connu pour... Eh bien... Le communisme."

 CHI_Reformation_of_the_State_and_Party:0 "Réforme de l'État et du parti"
 CHI_Reformation_of_the_State_and_Party_desc:0 "Il est essentiel de réformer certains éléments de l'État pour garantir une prospérité politique et économique au bénéfice de la bonne volonté du peuple."

 CHI_Reform_the_Secret_Police:0 "Réformer la police secrète"
 CHI_Reform_the_Secret_Police_desc:0 "Notre police secrète doit être réformée et recyclée pour refléter la nouvelle idéologie socialiste de l'État plutôt que l'ancien régime fasciste."

 CHI_Reduce_Censorship:0 "Réduire la censure"
 CHI_Reduce_Censorship_desc:0 "Notre peuple doit pouvoir exprimer ses opinions sans répression politique comme l'a fait le régime précédent. Nous réduirons la censure et le contrôle des médias."

 CHI_American_Investors:0 "Investisseurs américains"
 CHI_American_Investors_desc:0 "Les investisseurs américains devraient être autorisés à investir dans notre système économique en croissance rapide, cela sera bénéfique à la fois pour notre économie et pour les investisseurs eux-mêmes."

 CHI_CIA_Observers:0 "Observateurs de la CIA"
 CHI_CIA_Observers_desc:0 "La Central Intelligence Agency (CIA) américaine bénéficiera grandement de la présence d'observateurs à Taiwan ; notre emplacement est parfait pour la surveillance des mouvements communistes chinois le long de la côte."

 CHI_Focus_on_the_Defensive:0 "Concentrez-vous sur la défensive"
 CHI_Focus_on_the_Defensive_desc:0 "Nous devons nous préparer à toute éventualité. Les communistes chinois sont désormais capables de beaucoup de choses et notre politique militaire doit se concentrer sur la défense de Taiwan."

 CHI_Bolster_the_Viet_Quoc:0 "Renforcer le Viet Quoc"
 CHI_Bolster_the_Viet_Quoc_desc:0 "Le Viet Quoc, ou VNQDD, est un parti nationaliste vietnamien qui milite pour la libération du joug colonial français. Nous devons soutenir ce parti dans ses actions anti-impérialistes."

 CHI_Open_Up_to_Foreign_Investment:0 "S'ouvrir aux investissements étrangers"
 CHI_Open_Up_to_Foreign_Investment_desc:0 "Il est important de soutenir notre économie en autorisant les investissements étrangers dans nos industries et nos entreprises. Cela sera bénéfique à la fois pour notre économie et pour le monde."

 CHI_Join_SEATO:0 "Rejoignez l'OTASE"
 CHI_Join_SEATO_desc:0 "Avec la création de l'Organisation du Traité de l'Asie du Sud-Est, il est impératif que Taiwan rejoigne cette organisation pour lutter contre l'agression de la République populaire de Chine, de la Corée du Nord et du Nord-Vietnam."

 CHI_American_Backed_Economic_Reforms:0 "Des réformes économiques soutenues par les États-Unis"
 CHI_American_Backed_Economic_Reforms_desc:0 "Nous serions honorés d'utiliser les idées américaines pour réformer notre économie et la rendre plus prospère que jamais !"

 CHI_Tolerate_Political_Dissenters:0 "Tolérer les dissidents politiques"
 CHI_Tolerate_Political_Dissenters_desc:0 "La liberté d'opinion est l'aspect le plus important d'une démocratie, et la dissidence politique sera acceptée à Taiwan, mais pas encouragée."

 CHI_Economic_Growth:0 "Croissance économique"
 CHI_Economic_Growth_desc:0 "Notre économie doit devenir forte et une industrialisation rapide doit être réalisée rapidement pour que Taiwan soit connue dans toute la région comme une puissance prospère."

 CHI_Increase_Relations_with_Vietnam_and_Korea:0 "Renforcer les relations avec le Vietnam et la Corée"
 CHI_Increase_Relations_with_Vietnam_and_Korea_desc:0 "Le Vietnam et la Corée sont tous deux affligés par les horreurs d'un ennemi communiste. Dans une situation similaire, nous devons nous soutenir et nous allier avec eux, pour partager un lien commun."

 CHI_Cut_Our_Foreign_Losses:0 "Réduisons nos pertes à l'étranger"
 CHI_Cut_Our_Foreign_Losses_desc:0 "Nos investissements à l'étranger et nos exportations ne portent pas leurs fruits. Plutôt que de continuer à perdre de l'argent précieux, nous annulerons toutes les transactions."

 CHI_Lift_the_Martial_Law:0 "Lever la loi martiale"
 CHI_Lift_the_Martial_Law_desc:0 "Les années de paranoïa et d'autoritarisme sont révolues. Nous devons revenir aux voies démocratiques et non-violentes de notre passé. La loi martiale sera levée."

 CHI_Allow_Formation_of_New_Parties:0 "Autoriser la formation de nouveaux partis"
 CHI_Allow_Formation_of_New_Parties_desc:0 "En accordant plus de liberté, le peuple sera autorisé à former de nouveaux partis politiques, à exprimer son opinion sur le gouvernement et à susciter davantage de démocratie au sein de la population."

 CHI_Limited_Democracy:0 "Démocratie limitée"
 CHI_Limited_Democracy_desc:0 "Le peuple a peut-être la démocratie, mais nous ne devons pas oublier les mesures agressives de la RPC et d'autres pays communistes pervers de la région, et faire tout ce que nous pouvons pour empêcher cela."

 CHI_Limit_American_Influence:0 "Limiter l'influence américaine"
 CHI_Limit_American_Influence_desc:0 "Les Américains en ont fait assez à Taiwan. Nous sommes indépendants et, bien que déterminés à stopper la propagation du communisme, les États-Unis ne peuvent pas contrôler notre démocratie."

 CHI_State_Visit_From_Washington:0 "Visite d'État de Washington"
 CHI_State_Visit_From_Washington_desc:0 "Nous inviterons volontiers le président américain à se rendre à Taiwan et à discuter ensemble de la démocratie et de la sécurité dans la région asiatique tout en favorisant la paix et la prospérité."

 CHI_Embrace_Capitalism:0 "Embrassez le capitalisme"
 CHI_Embrace_Capitalism_desc:0 "Le capitalisme est synonyme de succès pour Taiwan, et nos récents succès en matière de construction économique et d'investissements étrangers ont précisément prouvé que le marché signifie de bonnes choses pour nous."

 CHI_Militarist_Propaganda:0 "Propagande militariste"
 CHI_Militarist_Propaganda_desc:0 "Notre armée doit être renforcée pour défendre nos côtes contre les communistes ! Il faut recruter massivement."

 CHI_Prepare_for_Operation_National_Salvation:0 "Préparez-vous à l'opération Salut national"
 CHI_Prepare_for_Operation_National_Salvation_desc:0 "Le moment est venu pour nous de dépasser Taiwan et de reprendre le continent. Nous nous battrons une fois de plus pour notre contrôle du continent !"

 #KMT Victory 1950s#

 KMT_Amend_the_Temporary_Provisions:0 "Modifier les dispositions temporaires"
 KMT_Amend_the_Temporary_Provisions_desc:0 "Maintenant que la rébellion communiste a été réprimée, nos dispositions temporaires peuvent être modifiées pour ramener la Chine en paix et mettre fin à la mobilisation politique."

 KMT_Republic_of_China_Armed_Forces:0 "Forces armées de la République de Chine"
 KMT_Republic_of_China_Armed_Forces_desc:0 "Notre armée doit être renforcée, pour servir de phare de liberté, de démocratie et d'anticommunisme dans toute la région asiatique !"

 KMT_The_Direction_of_the_Kuomintang:0 "La direction du Kuomintang"
 KMT_The_Direction_of_the_Kuomintang_desc:0 "Le Kuomintang doit devenir le parti politique le plus important et le plus important de toute la Chine. Il est essentiel de laisser les communistes sous contrôle."

 KMT_The_Tibetan_Situation:0 "La situation tibétaine"
 KMT_The_Tibetan_Situation_desc:0 "Il y a des rumeurs d'indépendance et de révolution dans la région tibétaine de la part des forces d'occupation chinoises. Nous les avons gardés libres, cela ne tiendra pas."

 KMT_Republic_of_China_Army:0 "Réformer les forces armées de la République de Chine"
 KMT_Republic_of_China_Army_desc:0 "Notre armée révolutionnaire autrefois glorieuse doit être réformée afin d'unir la Chine et d'assurer l'ordre, la paix et la prospérité dans notre nouvelle société démocratique."

 KMT_The_Hyperinflation_Crisis:0 "La crise de l'hyperinflation"
 KMT_The_Hyperinflation_Crisis_desc:0 "L'inflation de notre monnaie est allée assez loin ! Nous commencerons à combattre la crise d'hyperinflation en Chine et à reconstruire notre industrie !"

 KMT_Establish_the_Institute_of_Nuclear_Energy_Research:0 "Créer l'Institut de recherche sur l'énergie nucléaire"
 KMT_Establish_the_Institute_of_Nuclear_Energy_Research_desc:0 "L'énergie nucléaire est l'avenir et il est essentiel que la République de Chine se mette à construire des réacteurs nucléaires le plus rapidement possible. Un institut sera créé pour faciliter et intensifier ces recherches."

 KMT_seeking_allies_in_asia:0 "À la recherche d'alliés à long terme en Asie"
 KMT_seeking_allies_in_asia_desc:0 "S'appuyer fortement sur la diplomatie avec les puissances occidentales et refuser de rechercher des alliances à long terme avec les pays de la région ne fera qu'isoler notre position en Asie. Notre ministère des Affaires étrangères s'adressera à ces nations anticommunistes régionales pour rechercher des liens mutuellement bénéfiques, dans l'espoir d'expulser le communisme du continent."

 KMT_korean_war:0 "Guerre dans la péninsule coréenne"
 KMT_korean_war_desc:0 "Peu de temps avant la fin de la guerre civile chinoise, les Nord-Coréens ont envahi injustement le Sud, alimentés par les tensions croissantes dans la région et avec l'autorisation de la République populaire de Chine et de l'Union soviétique. Même si notre nation se trouve dans l'état le plus défavorable que nous puissions espérer, nous devrions prêter main-forte à nos frères anticommunistes de Corée en leur apportant un soutien limité."

 KMT_support_rhee_government:0 "Soutenez le gouvernement de Rhee"
 KMT_support_rhee_government_desc:0 " Le gouvernement anticommuniste de Corée sous Rhee, avec lequel nous étions autrefois en désaccord, est désormais notre seul espoir d'empêcher la propagation du communisme en Corée. Nous devons l'aider, lui et son gouvernement, dans leur guerre pour débarrasser la racaille communiste, même si elle ne se déroule pas exactement selon nos conditions."

 KMT_supply_the_ROK_with_CCW_arms:0 "Fournir au Sud des équipements de guerre civile"
 KMT_supply_the_ROK_with_CCW_arms_desc:0 "N'ayant plus besoin de compter sur des équipements obsolètes au sein de notre stock, nous pouvons nous permettre d'en épargner pour approvisionner Rhee et son armée en armes que nous avons autrefois utilisées dans notre propre guerre civile. "

 KMT_military_advisors_for_korea:0 "Attaché militaire pour la République de Corée"
 KMT_military_advisors_for_korea_desc:0 "Dans le but d'étendre le soutien militaire aux Coréens, un attaché militaire a été organisé pour la Corée dans l'espoir d'aider ses forces armées. Tant que la menace communiste empiète sur l'Asie, il n'y aura aucune limite au soutien de nos alliés anticommunistes."

 KMT_sino_korean_mutual_defense_treaty:0 "Proposer le traité de défense mutuelle sino-coréen"
 KMT_sino_korean_mutual_defense_treaty_desc:0 "Au cours de la guerre de Corée, la République de Chine et la République de Corée se sont rapprochées dans leur position contre le communisme, et les rancunes passées ont presque disparu. En signe d'amitié au cours de ces dernières années ensemble, nous proposerons aux Coréens un pacte de défense mutuelle qui puisse profiter aux deux nations."

 KMT_The_Legacy_of_the_Faustian_Bargain:0 "L'héritage du marché faustien"
 KMT_The_Legacy_of_the_Faustian_Bargain_desc:0 "Nous avons gagné la guerre civile, mais nous devons désormais résoudre d'autres problèmes. Tel que le pacte faustien est défini, nous avons maintenant la Chine continentale mais avons « vendu notre âme » au diable pour l'avoir. Cela signifie que nous devons améliorer notre nouveau pays."

 KMT_Repress_the_Bandits:0 "Réprimer les bandits"
 KMT_Repress_the_Bandits_desc:0 "Les bandits et les chefs de guerre de Chine continentale ne seront pas et ne pourront pas être des membres opérationnels du nouveau gouvernement. Ils sont opposés au Kuomintang et doivent donc être réduits au silence."

 KMT_Restoring_Rural_Order:0 "Restaurer l'ordre rural"
 KMT_Restoring_Rural_Order_desc:0 "L'ordre doit être rétabli dans les régions rurales de Chine, celles particulièrement ciblées par les chefs de guerre locaux ou les communistes, qui ne sont pas fidèles au nouveau gouvernement. Nous ferons tout ce qui est en notre pouvoir pour assurer la sûreté et la sécurité de nos régions rurales."

 KMT_Combat_Opium_Usage:0 "Combattre la consommation d'opium"
 KMT_Combat_Opium_Usage_desc:0 "L'opium est une drogue dangereuse et mortelle qui a été introduite par les puissances européennes et nous a plongés dans la guerre internationale, les luttes intestines et la ruine. Nous devons à tout prix arrêter l'usage de ce médicament pour protéger notre nouvelle nation."

 KMT_allow_current_societal_norms:0 "Autoriser les normes sociétales actuelles"
 KMT_allow_current_societal_norms_desc:0 "Toutes les normes apportées par l'Occident ne sont pas mauvaises. Le jeu et la prostitution sont des vices nécessaires qui garantiront les moyens de subsistance et la conformité de notre population et fourniront les emplois nécessaires aux industries des casinos et du sexe."

 KMT_enforce_change_in_social_norms:0 "Société réformée"
 KMT_enforce_change_in_social_norms_desc:0 "En proie à l'influence occidentale et aux pratiques corrompues, nos normes sociales actuelles, autrefois fortement critiquées, sont désormais encouragées et font désormais partie de la vie de chacun. Nous imposerons nos normes sociales à la population et tenterons de réformer la société."

 KMT_Promote_Christian_Missionary_Activity:0 "Promouvoir l'activité missionnaire chrétienne"
 KMT_Promote_Christian_Missionary_Activity_desc:0 "Reconnaissant les bénéfices et la bonne volonté acquis dans la foi chrétienne, nous autoriserons les missionnaires à entrer en Chine et à diffuser la parole de Dieu à tous ceux qui souhaitent l'entendre."

 KMT_reopen_sun_yat_sen_university:0 "Rouvrir les universités nationales Sun Yat-sen"
 KMT_reopen_sun_yat_sen_university_desc:0 "Avec la mort du père fondateur, le Dr Sun Yat-Sen, quatre grandes universités ont été rebaptisées en son honneur après l'expédition dans le nord, notamment l'Université de Wuhan, l'Université du Zhejiang, l'Université de Nanjing et l'Université du Guangdong, qui ont toutes fourni des réalisations académiques et des progrès majeurs pour la nation. Alors que les communistes envahissaient près de la moitié de la Chine, de nombreuses universités furent occupées et rebaptisées par eux. Maintenant que toutes les universités nationales Sun Yat-Sen sont à nouveau sous notre contrôle, nous pouvons les rouvrir et les subventionner en toute sécurité. "

 KMT_support_the_western_allies:0 "Soutenez les alliés occidentaux"
 KMT_support_the_western_allies_desc:0 "Bien qu'elles soient colonialistes et impérialistes dans l'âme, les puissances occidentales ont été nos plus grands alliés pendant la guerre de Résistance. Nous les soutiendrons dans leurs efforts et mettrons l'accent sur la coopération avec eux."

 KMT_anti_colonial_rhetoric:0 "Rhétorique anticoloniale"
 KMT_anti_colonial_rhetoric_desc:0 "Les puissances coloniales sont intervenues assez longtemps dans les affaires chinoises ! Nous agirons de manière indépendante et ne soutiendrons pas leurs aventures impérialistes en Asie et aiderons les nations qui se trouvent à la pointe de l'épée du colonialisme britannique et français."

 KMT_establish_embassies_in_indochina:0 "Créer des ambassades au Laos, au Cambodge et en Thaïlande"
 KMT_establish_embassies_in_indochina_desc:0 "Après la capitulation du Japon et l'effondrement de l'autorité française en Indochine, divers États ont tenté sans relâche d'établir leur indépendance vis-à-vis des puissances étrangères. Nous nous lierons d'amitié avec ces nations et ouvrirons nos ambassades dans leurs capitales pour davantage de soutien et de solidarité."

 KMT_seek_cooperation_with_Malaya:0 "Reconnaître la Fédération de Malaisie"
 KMT_seek_cooperation_with_Malaya_desc:0 "La Malaisie présente un grand intérêt pour notre sphère d'influence, compte tenu de la minorité importante de citoyens d'origine chinoise. La fédération est actuellement en lutte constante avec l'Armée de libération nationale malaise, motivée par les maoïstes, qui prétend mettre fin à la domination coloniale britannique et « libérer » la Malaisie."

 KMT_give_malaya_guns:0 "Envoyer un soutien militaire"
 KMT_give_malaya_guns_desc:0 "La Fédération de Malaisie et les forces britanniques ont besoin d'aide dans leurs efforts contre les forces maoïstes de Chin Peng. Il est vital pour la sécurité de la population malaise (qui comprend plus de 2 millions de citoyens d'origine chinoise) que la loi et l'ordre soient maintenus et appliqués."

 KMT_The_Tibetan_Reconcilation:0 "Réconciliation avec le Tibet"
 KMT_The_Tibetan_Reconcilation_desc:0 "Bien que le Tibet fasse partie de la Chine depuis la dynastie des Yuan (avec quelques pauses entre les deux), il est préférable de laisser la province tranquille et de ne pas obliger les Tibétains, qui ne s'identifient pas comme Chinois, à faire partie de la culture Han."

 KMT_Suppress_Ethnic_Seccessionists:0 "Réprimer les sécessionnistes ethniques"
 KMT_Suppress_Ethnic_Seccessionists_desc:0 "Il faut à tout prix empêcher ceux qui veulent se séparer de notre grande et humble nation. Nous souhaitons être unis et non divisés ; tous ceux qui s'opposent à la direction du gouvernement du Kuomintang seront détenus en tant que dissidents politiques."

 KMT_Launch_Sinicization_Campaign:0 "Lancer une campagne de sinisation"
 KMT_Launch_Sinicization_Campaign_desc:0 "La diffusion de la culture autochtone chinoise est la plus importante de nos campagnes éducatives et nous ferons tout notre possible pour assimiler les peuples autochtones à notre culture et à leur mode de vie typiquement chinois."

 KMT_Support_The_Viet_Quoc:0 "Reconnaître le mouvement VNQDD de Vu Hong-Khanh"
 KMT_Support_The_Viet_Quoc_desc:0 "Vu Hong-Khanh a passé beaucoup de temps au sein du Kuomintang et de l'ancienne NRA au cours des premières décennies de Nanjing. Pendant la Seconde Guerre mondiale, il était responsable de la formation et du recrutement de soldats vietnamiens et thaïlandais avant de retourner au Vietnam en réponse à la deuxième phase de la guerre civile chinoise, soutenant les politiques anticommunistes et anti-françaises de Cuong De."

 KMT_The_White_Terror:0 "La terreur blanche"
 KMT_The_White_Terror_desc:0 "Notre situation est devenue désastreuse ; certains opposants au régime du KMT doivent être arrêtés et interrogés sur leurs motivations idéologiques ; il s'agit d'assurer la loyauté et l'absence d'opposition au parti au pouvoir de notre glorieuse Chine !"

 KMT_Utilize_Organized_Crime_Connetions:0 "Utiliser les connexions avec le crime organisé"
 KMT_Utilize_Organized_Crime_Connetions_desc:0 "Les liens que notre gouvernement entretient avec les différents syndicats et triades sont trop précieux pour être perdus. Avec leur soutien, nous pouvons obtenir tout ce que nous voulons et devenir encore plus puissants !"

 KMT_Crackdown_on_Organized_Crime:0 "Répression du crime organisé"
 KMT_Crackdown_on_Organized_Crime_desc:0 "Les familles et organisations du crime organisé en Chine doivent être éradiquées. Nous ne devons pas avoir de corruption ici."

 KMT_Legitimize_Rural_Secret_Cults:0 "Légitimer les cultes secrets ruraux"
 KMT_Legitimize_Rural_Secret_Cults_desc:0 "Divers cultes, tels que la Société du Sable Jaune, doivent être légitimés et intégrés à la société chinoise."

 KMT_Crush_Secret_Societies:0 "Écraser les sociétés secrètes"
 KMT_Crush_Secret_Societies_desc:0 "Les sociétés secrètes sont un fléau sur cette terre et pourraient être utilisées pour fomenter la résistance ou la rébellion contre notre régime. Nous ne permettrons plus que cela existe."

 KMT_recall_VNQDD_members:0 "Former les milices Viet-Quoc"
 KMT_recall_VNQDD_members_desc:0 "De nombreux membres du VNQDD sont confrontés à la menace d'exécution et de répression de la part des régimes de Hanoï et de Saigon. Nous devons les aider à survivre en encourageant et en soutenant la guérilla et la guerre clandestine, ainsi qu'en leur offrant l'asile ici en République de Chine et en commençant à les préparer."

 KMT_send_hanjians_to_labour_camps:0 "Agrandir les camps de travail pour les Hanjians"
 KMT_send_hanjians_to_labour_camps_desc:0 "Ceux qui ont soutenu les traîtres communistes et japonais doivent être sévèrement punis. Ils seront envoyés dans des camps de travail chinois récemment ouverts où ils serviront la République jusqu'à ce que le gouvernement les juge opportuns d'être relâchés dans la société."

 KMT_remove_these_traitors_entirely:0 "Exterminez tous les traîtres"
 KMT_remove_these_traitors_entirely_desc:0 "Ces traîtres ne méritent plus de vivre, il faut donner l'exemple à ceux qui ont le cran de collaborer avec les maladies de la peau et du coeur, nous ne tolérerons plus ces traîtres !"

 KMT_Commencen_the_Show_Trials:0 "Commencez les essais du spectacle"
 KMT_Commencen_the_Show_Trials_desc:0 "Un exemple doit être donné aux individus impliqués dans la collaboration avec les Japonais et les communistes lors de leur invasion et de leur occupation. Nous n'accepterons pas les traîtres ici !"

 KMT_Pardon_Japanese_Collaborators:0 "Pardon aux collaborateurs japonais"
 KMT_Pardon_Japanese_Collaborators_desc:0 "Nous devons mettre l'accent sur l'égalité, et maintenant que la Chine est dans une nouvelle ère, nous devons pardonner et nous purifier de toutes les offenses passées ; ceux qui ont travaillé avec les Japonais seront graciés."

 KMT_harden_grip_over_the_media:0 "Renforcer l'emprise sur les médias"
 KMT_harden_grip_over_the_media_desc:0 "Il existe encore de nombreux médias qui restent autonomes et échappent à notre contrôle, tout en diffusant des critiques à l'égard de notre glorieux Parti et en soutenant les traîtres communistes de Mandchourie. Nous nationaliserons tous les médias opérant en Chine et nous punirons ceux qui osent répandre de fausses rumeurs sur le parti et la république. "

 KMT_Investigate_Land_Reform:0 "Enquêter sur la réforme agraire"
 KMT_Investigate_Land_Reform_desc:0 "Il est essentiel que notre gouvernement étudie et recherche les meilleures politiques de réforme agraire, afin de faire de notre pays le plus prospère du secteur agricole."

 KMT_Commit_to_Land_Reform:0 "S'engager dans la réforme agraire"
 KMT_Commit_to_Land_Reform_desc:0 "Il est clair qu'une réforme est nécessaire pour aider à redistribuer la propriété et les fermes aux citoyens ordinaires. Le gouvernement se chargera volontiers de cette tâche !"

 KMT_Implement_Georgist_Tax_Reforms:0 "Mettre en oeuvre les réformes fiscales Georgist"
 KMT_Implement_Georgist_Tax_Reforms_desc:0 "Dans les Trois principes du peuple, le Dr Sun Yat-Sen a proposé au gouvernement des moyens d'égaliser les droits fonciers en utilisant la valeur fiscale foncière du géorgisme. La théorie de Sun suggère que tout propriétaire qui sur-déclare la valeur de son terrain se verrait taxer à un taux plus élevé. Si un propriétaire décide de sous-estimer la valeur de son terrain, celui-ci peut être acheté à moindre coût par le gouvernement, ce qui oblige les propriétaires à déclarer la bonne valeur de leur terrain au gouvernement."

 KMT_Allow_Clique_Autonomy:0 "Autoriser l'autonomie des clics"
 KMT_Allow_Clique_Autonomy_desc:0 "Les différentes cliques de Chine continentale doivent bénéficier de plus de liberté, car elles serviront de gouvernements locaux ; pour maintenir la paix et assurer la loyauté envers le gouvernement national."

 KMT_Compensate_Landowners:0 "Compenser les propriétaires fonciers"
 KMT_Compensate_Landowners_desc:0 "En échange de la production de cultures et de leur ajout au marché, nous fournirons une compensation ou une subvention pour aider nos propriétaires fonciers à compenser la hausse des coûts agricoles."

 KMT_Liquidate_Uncooperative_Landlords:0 "Liquider les propriétaires peu coopératifs"
 KMT_Liquidate_Uncooperative_Landlords_desc:0 "Tous les propriétaires qui refusent de se conformer à la nouvelle réforme agraire de l'État seront arrêtés et interrogés ; nous voulons garantir l'égalité agricole et foncière pour tous ceux qui souhaitent devenir agriculteurs."

 KMT_Take_Half_Measures:0 "Prendre des demi-mesures"
 KMT_Take_Half_Measures_desc:0 "La réforme agraire n'est pas nécessaire aux yeux du Kuomintang, nous ne voyons aucune raison de lancer des projets massifs ou même d'apporter le strict minimum de soutien si cela n'est pas nécessaire."

 KMT_Seize_Collaborators_Land:0 "Saisir les terres des collaborateurs"
 KMT_Seize_Collaborators_Land_desc:0 "Les anciens collaborateurs des communistes ou des occupants japonais seront dûment punis et leurs terres seront saisies par l'État, dans l'espoir d'être distribuées à des citoyens plus fidèles."

 KMT_Reward_Kuomitang_Loyalists:0 "Récompenser les loyalistes du Kuomintang"
 KMT_Reward_Kuomitang_Loyalists_desc:0 "Ceux qui sont restés fidèles et forts au KMT seront récompensés par des terres ou des propriétés supplémentaires pour démarrer leur ferme ou leur entreprise."

 KMT_Commit_to_Reform:0 "S'engager dans la réforme"
 KMT_Commit_to_Reform_desc:0 "Depuis que nous avons libéré le continent, le gouvernement au pouvoir a rencontré de nombreux problèmes. Une réforme est nécessaire pour renforcer notre contrôle sur le nouveau territoire et garantir que nos citoyens soient traités équitablement."

 KMT_Deny_Need_to_Reform:0 "Nier la nécessité de réformer"
 KMT_Deny_Need_to_Reform_desc:0 "Les réformes ne sont clairement pas nécessaires dans le glorieux gouvernement chinois, nous sommes forts et nous avons repris le continent sans aucune nouvelle « réforme », elles ne sont tout simplement pas nécessaires."

 KMT_Lift_Martial_Law:0 "Lever la loi martiale"
 KMT_Lift_Martial_Law_desc:0 "Nous ne voyons pas la nécessité de maintenir la loi martiale. La guerre civile est terminée et les communistes ont été correctement maîtrisés. Le peuple nous est fidèle et nous ne voyons pas la nécessité de lui imposer de nouvelles mesures autoritaires."
 KMT_Lift_Martial_Law2_desc:0 "Nous ne voyons pas la nécessité de maintenir la loi martiale. La guerre civile est terminée et les communistes ont été correctement maîtrisés. Le peuple nous est fidèle et nous ne voyons pas la nécessité de lui imposer de nouvelles mesures autoritaires."

 KMT_Continue_Martial_Law:0 "Continuer la loi martiale"
 KMT_Continue_Martial_Law_desc:0 "Il est clair que les communistes et les opposants à la direction du Kuomintang constituent toujours une menace pour notre sécurité intérieure. La loi martiale sera maintenue pour garantir que ces individus soient traités."

 KMT_Strengthen_Grip_Over_Cliques:0 "Renforcer l'adhérence sur les cliques"
 KMT_Strengthen_Grip_Over_Cliques_desc:0 "Notre contrôle sur les cliques doit être étendu ; leur participation à notre régime garantira davantage la loyauté du peuple à notre égard."

 KMT_Empower_the_Cliques:0 "Donnez du pouvoir aux cliques"
 KMT_Empower_the_Cliques_desc:0 "Au lieu de tenter d'assimiler les différentes cliques à notre régime, nous leur donnerons certaines libertés, mais elles apprendront à rester sous notre regard vigilant, sinon des choses très désagréables se produiront."

 KMT_The_Central_Reform_Committee:0 "Le Comité central de réforme"
 KMT_The_Central_Reform_Committee_desc:0 "Nous devons former le Comité central de réforme du Kuomintang, qui sera responsable de la réinvention et de la transformation du KMT en un parti plus démocratique et plus populaire, en utilisant l'idéologie des Trois principes du peuple, créée par notre fondateur, Sun Yat-sen."

 KMT_Launch_Kuomintang_Reorganization:0 "Lancer la réorganisation du Kuomintang"
 KMT_Launch_Kuomintang_Reorganization_desc:0 "Il est devenu évident que le Kuomintang a désespérément besoin de réformes. Les combats internes constants entre les différentes factions, ainsi que le manque de formation des cadres conduisent à une gouvernance inefficace. Nous devons agir et prendre des mesures pour stabiliser et unifier le parti dans son ensemble."

 KMT_Establish_A_Social_Base:0 "Définir une base sociale"
 KMT_Establish_A_Social_Base_desc:0 "Au cours des dernières décennies, le Kuomintang a perdu le soutien des paysans au profit du Parti communiste et celui des universitaires, des étudiants et des intellectuels au profit des États-Unis. Le moment est venu pour le Kuomintang de se réinventer en tant que véritable parti du peuple chinois ordinaire."

 KMT_Encourage_Cadre_Training:0 "Formation pour les cadres du parti"
 KMT_Encourage_Cadre_Training_desc:0 "La faiblesse de l'organisation du Kuomintang a failli provoquer sa défaite face au PCC. Le généralissime Chiang s'est plaint du fait que les membres du parti ne reçoivent pas une formation adéquate lorsqu'ils rejoignent le KMT. Cela doit être changé."

 KMT_Fortify_Tridemism_Mainland:0 "La doctrine San-Min"
 KMT_Fortify_Tridemism_Mainland_desc:0 "Le Dr Sun Yat-sen est le père fondateur de la République de Chine et a développé la philosophie des Trois principes du peuple, combinant démocratie, protection sociale et nationalisme. Le nouveau Kuomintang purifiera sa pensée et sera prêt à établir les Trois Principes pour servir de modèle d'une Chine véritablement moderne, démontrant que les idéologies communistes sont un poison pour le peuple chinois et sa culture."

 KMT_send_ching_kuo_to_shanghai:0 "Envoyez Chiang Ching-Kuo à Shanghai"
 KMT_send_ching_kuo_to_shanghai_desc:0 "La ville de Shanghai, qui revêt une importance majeure pour la Chine elle-même sur les plans économique et politique, est devenue ces dernières années une dystopie après la fin de la guerre civile chinoise. Nos précédentes tentatives de réforme de la politique de la ville en utilisant la position dure de Ching-Kuo contre la corruption locale en 1948 ont lamentablement échoué car elles ont supprimé le soutien dont disposait à l'origine le Kuomintang et n'ont pas réussi à obtenir le soutien de la classe inférieure. Alors que la guerre civile touche à sa fin, nous pouvons nous permettre de perdre certains partisans dans le processus de réforme de la ville pour en faire une utopie visant à attirer le soutien de la classe inférieure."

 KMT_restore_bai_as_minister_of_national_defense:0 "Restaurer Bai en tant que ministre de la Défense nationale"
 KMT_restore_bai_as_minister_of_national_defense_desc:0 "La nouvelle clique du Guangxi sous la direction de Li Zongren a toujours constitué une menace pour notre régime depuis le début de la guerre des plaines centrales en 1930. Pendant la guerre de Résistance, nous avons fait des efforts pour séparer les membres clés de l'influence de Li, tels que Bai Chongxi. Nous maintiendrons notre politique de « diviser pour régner » contre la nouvelle clique du Guangxi, et nous veillerons à ce qu'elle ne puisse plus jamais constituer une menace pour le gouvernement de Nanjing."

 KMT_Chen_Cheng_50s_Rent_cap:0 "La réduction de loyer de 37,5%"
 KMT_Chen_Cheng_50s_Rent_cap_desc:0 "La politique de réduction des loyers de Chen Cheng vise à plafonner le loyer payé par les agriculteurs aux propriétaires à 37,5 % de la récolte. Avant la directive, les propriétaires réclamaient souvent plus de la moitié de la récolte en guise de paiement. Le président espère que son initiative lui donnera une base de soutien plus large parmi les paysans chinois tout en espérant qu'elle stoppera la propagation du marxisme au sein de la République."

 KMT_Sideline_Opposition_Factions:0 "Mettre les factions rivales à l'écart"
 KMT_Sideline_Opposition_Factions_desc:0 "Les différentes factions rivales au sein du KMT, telles que la Clique des Sciences Politiques et la Faction Whampoa, nuisent collectivement à l'efficacité du gouvernement central sans même le vouloir. Nous devons prendre des mesures pour mettre fin à la division politique au sein du Kuomintang et essayer d'unir toutes les différentes ailes, afin d'assurer moins de corruption et une gouvernance plus efficace."

 KMT_Integrate_Intelligensa:0 "Intégrez la clique de science politique"
 KMT_Integrate_Intelligensa_desc:0 "La Clique de Science Politique est une faction au sein du Kuomintang composée principalement d'intellectuels à quelques exceptions mineures près, sous le contrôle de Zhang Qun, ancien gouverneur du Sichuan et Premier ministre de la République de Chine. Sa faction, bien que vaguement alignée, peut être utilisée par nous pour faire avancer nos objectifs d'une Chine réformée par l'intégration."

 KMT_Deradicalize_the_CC_Clique:0 "Réformer la CC-Clique"
 KMT_Deradicalize_the_CC_Clique_desc:0 "La Clique du CC, une faction d'extrême droite au sein du Kuomintang, et ses politiques sont fortement en conflit avec le nouveau gouvernement réformé du Kuomintang. Bien que nous ne puissions pas purger le frère Chen restant (Chen Guofu est décédé au début de 1951), Chen Lifu occupera toujours un siège important au sein du gouvernement en raison de son amitié de longue date avec Chiang Kai-shek. Cependant, cette clique doit se rendre compte que les intérêts fonciers et les anciennes méthodes traditionnelles de gouvernance ne conviennent pas à notre agenda actuel et doivent être révisés."

 KMT_Strengthen_the_Secret_Police:0 "Renforcer la police secrète"
 KMT_Strengthen_the_Secret_Police_desc:0 "Notre force de police secrète doit être considérablement renforcée pour soutenir nos opérations visant à maintenir la loyauté et à écraser tous ceux qui ne sont pas d'accord avec nos idéaux patriotiques et nationaux."

 KMT_collaborate_with_other_parties:0 "Collaboration avec les parties alignées"
 KMT_collaborate_with_other_parties_desc:0 "Le Parti de la Jeune Chine et le Parti socialiste démocratique chinois ont convenu de travailler avec nous dans la lutte contre le communisme et pour établir une République forte. Nous devons mettre de côté nos différences et collaborer efficacement, tout en gagnant leur loyauté pour lutter pour la République."

 KMT_Outlaw_Labor_Strikes:0 "Protection des travailleurs mineurs"
 KMT_Outlaw_Labor_Strikes_desc:0 "Les grèves constitueront une menace pour notre stabilité. Le gouvernement a donc décidé de lancer de petites campagnes sociales, visant à améliorer les conditions des travailleurs de manière à éviter les grèves à grande échelle. Nous espérons que cela détournera les sympathisants communistes de leurs rêves utopiques et apportera davantage de soutien à notre gouvernement."

 KMT_Play_the_Cliques_Against_Each_Other:0 "Jouez les cliques les unes contre les autres"
 KMT_Play_the_Cliques_Against_Each_Other_desc:0 "Les différentes cliques du KMT sont éclatées et différentes dans leurs convictions et leurs objectifs pour le parti ; il est nécessaire de les opposer les uns aux autres pour réduire la résistance à notre idéologie nationaliste au sein du parti."

 KMT_Restrain_American_Influence:0 "Limiter l'influence américaine"
 KMT_Restrain_American_Influence_desc:0 "L'influence américaine est allée assez loin ; nous avons gagné notre guerre civile et écrasé violemment tous les communistes restés des restes de ce conflit. Nous sommes désormais autosuffisants et n'avons besoin ni de l'aide ni de l'argent de Washington."

 KMT_Crackdown_on_the_Intellectual_Elites:0 "Persécuter les mouvements de gauche"
 KMT_Crackdown_on_the_Intellectual_Elites_desc:0 "Les mouvements de gauche, tels que le Parti démocratique chinois ou l'ancienne aile gauche du Kuomintang, présentent une menace pour notre sécurité nationale, notamment dans leur diffusion d'idées contre-productives par rapport aux objectifs du KMT. Les membres de ces mouvements et partis seront mis à l'écart en les assignant à des postes insignifiants."

 KMT_institute_ching_kuo_reforms_nationwide:0 "Instituer les réformes de Chiang Ching-kuo dans tout le pays"
 KMT_institute_ching_kuo_reforms_nationwide_desc:0 "Ching-Kuo a déployé d'énormes efforts pour mettre fin au chaos économique de Shanghai, faisant de Shanghai d'un état désastreux une ville modèle. Forts de ses grands succès dans ces réformes, nous devons les instaurer dans d'autres grandes villes comme Nanjing, Guangzhou et même Wuhan. Nous devons donner la priorité aux moyens de subsistance du peuple chinois plutôt qu'au profit, même si cela signifie abandonner ceux qui nous ont autrefois fait allégeance."

 KMT_Supremacy_of_CKS:0 "Le triomphe de Chiang Kai-shek"
 KMT_Supremacy_of_CKS_desc:0 "Après les réformes au sein du Kuomintang, toutes les autres factions politiques rivales ont été mises sur la touche et Chiang Kai-shek a fait pencher la balance en sa faveur. Chiang Kai-Shek a effectivement dominé une grande partie du Kuomintang."

 KMT_Replace_Untrustworthy_Governors:0 "Remplacer les gouverneurs peu fiables"
 KMT_Replace_Untrustworthy_Governors_desc:0 "Les désertions massives constituaient un problème majeur à la fin de la guerre civile chinoise. Afin de convaincre nos gouverneurs de rester fidèles, nous avons dû leur faire d'importantes concessions pour garantir leur fidélité. Aujourd'hui, avec le retour d'une certaine stabilité en Chine, nous devrions revoir nos choix de gouverneur et envisager de remplacer quelques individus peu dignes de confiance."

 KMT_Outreach_to_the_Panchen_Lama:0 "Sensibilisation au Panchen Lama"
 KMT_Outreach_to_the_Panchen_Lama_desc:0 "Le Panchen Lama, ou deuxième plus haut chef spirituel du bouddhisme tibétain, est important pour notre cause et il faut lui parler le plus tôt possible pour éviter la crise au Tibet."

 KMT_Launch_Investigations_into_Warlords:0 "Lancez des enquêtes sur les seigneurs de guerre"
 KMT_Launch_Investigations_into_Warlords_desc:0 "Les chefs de guerre de chaque région doivent faire l'objet d'une enquête minutieuse afin de révéler leurs actions et leurs véritables intentions au gouvernement national ; nous devons nous assurer de leur fidélité."

 KMT_Condemn_the_Dalai_Lama:0 "Condamner le Dalaï Lama"
 KMT_Condemn_the_Dalai_Lama_desc:0 "Le Dalaï Lama, dans sa tentative de forcer le Tibet à devenir indépendant, sépare son peuple de la protection et de la sécurité de la République de Chine. Nous condamnons toutes ses actions sécessionnistes."

 KMT_Demand_Tibetan_Submission:0 "Exigez la soumission tibétaine"
 KMT_Demand_Tibetan_Submission_desc:0 "Nous exigeons que le Tibet se retire et reprenne sa place au sein de la République de Chine en tant que province fonctionnelle de notre pays ; la résistance et les menaces d'indépendance ne feront rien pour leur cause."

 KMT_Back_Coup_by_Panchen_Lama:0 "Coup d'État du Panchen Lama"
 KMT_Back_Coup_by_Panchen_Lama_desc:0 "Afin de mettre un terme à ces actions ignobles commises par le Dalaï Lama, nous allons soutenir son adjoint, le Panchen Lama, dans sa tentative de renverser et de prendre le contrôle du gouvernement régional tibétain."

 KMT_Recognize_Tibetan_Independence:0 "Reconnaître l'indépendance du Tibet"
 KMT_Recognize_Tibetan_Independence_desc:0 "Le Tibet a exprimé son indépendance vis-à-vis de notre nation et, étant en mesure de l'accepter, nous reconnaîtrons le Tibet comme une nation souveraine et espérons que d'autres nations amies du monde feront de même."

 KMT_Settle_Border_Claims_with_India:0 "Régler les revendications frontalières avec l'Inde"
 KMT_Settle_Border_Claims_with_India_desc:0 "En ce qui concerne les frontières occidentales, notre frontière avec la République de l'Inde a fait l'objet de nombreuses controverses et, au nom de la paix, nous proposons de régler les revendications frontalières avec l'Inde le plus rapidement possible afin d'éviter un conflit."

 KMT_Invade_Tibet:0 "Envahir le Tibet"
 KMT_Invade_Tibet_desc:0 "Le Tibet en a assez de la rébellion et de la résistance ! Pour montrer notre pouvoir de répression et notre ressentiment à l'égard de l'indépendance du Tibet, nos divisions les plus fines et les mieux équipées envahiront le Tibet et réprimeront toute résistance."

 KMT_Crush_the_Tibetan_Aristocracy:0 "Tolérer l'aristocratie tibétaine"
 KMT_Crush_the_Tibetan_Aristocracy_desc:0 "La classe supérieure tibétaine est peut-être à l'origine de la rébellion dans la région, mais l'aristocratie de la région tibétaine est un acteur clé de la stabilité et de la tradition au sein de la région. Le gouvernement a donc décidé de tolérer le statut de l'aristocratie tibétaine avec un certain degré de surveillance."

 KMT_reforge_the_tip:0 "Reforger le Parti pour l'amélioration du Tibet"
 KMT_reforge_the_tip_desc:0 "Afin de promouvoir l'autonomie et la stabilité au Tibet, nous autoriserons le Parti local pour l'amélioration du Tibet à diriger le gouvernement local et à poursuivre sa propre politique intérieure. Cela brisera le fossé entre le gouvernement centralisé de Nanjing et les préoccupations d'oppression à Lhansa."

 KMT_Sinicization_of_Tibet:0 "La sinisation du Tibet"
 KMT_Sinicization_of_Tibet_desc:0 "Nous promouvrons nos convictions constitutionnelles et politiques au Tibet afin de les aligner sur votre société, notre système politique et la République de Chine dans son ensemble."

 KMT_reinforce_authority_in_jiangxinpo:0 "Regardez la frontière du Yunnan"
 KMT_reinforce_authority_in_jiangxinpo_desc:0 "La région de Birmanie est plongée dans un chaos constant depuis l'indépendance de la colonie par la Grande-Bretagne, avec de nombreuses insurrections et séparatistes se déchaînant dans la campagne birmane, offrant une grande résistance au gouvernement de Rangoon. Cela nous donne cependant l'occasion de récupérer notre contrôle sur le nord du Kachin, autrement connu sous le nom de « Jiangxinpo », qui sera cédé à la province du Yunnan une fois le contrôle rétabli."

 KMT_the_manchurian_issue:0 "La question mandchoue"
 KMT_the_manchurian_issue_desc:0 "En arrivant dans l'ancienne capitale impériale de Pékin, l'Union soviétique nous a lancé un ultimatum : soit nous reculons, soit nous ne marchons pas plus loin en Mandchourie, sous peine de subir des « conséquences désastreuses ». Nos conditions logistiques et politiques nous ont forcés à accepter son ultimatum, sauvant ainsi le Parti communiste chinois de l'anéantissement total. Cependant, le statu quo ne durera pas éternellement..."

 KMT_Grant_More_Privileges_to_Prince_De:0 "Accorder des concessions au prince Demchudongrub"
 KMT_Grant_More_Privileges_to_Prince_De_desc:0 "Même si nous préférerions ne pas voir la Mongolie intérieure accroître son autonomie locale, nous pourrions rediriger les privilèges vers le prince De lui-même, en arguant que le pouvoir ne se concentre pas sur les institutions mongoles intérieures mais plutôt sur le prince. S'il devait démissionner ou décéder un jour, nous pourrions utiliser cette décision pour resserrer notre emprise sur la Mongolie intérieure à l'avenir. Pour l'instant, il acceptera notre offre sans hésitation, espérons-le."
 
 KMT_expand_military_infrastructure_hebei_alsha:0 "Développer l'infrastructure militaire sur le rideau"
 KMT_expand_military_infrastructure_hebei_alsha_desc:0 "L'Alliance militaire soviétique a rapidement élargi sa frontière avec la République. Le Xinjiang, la Mongolie et la Mandchourie sont sous occupation étrangère et constituent une menace sérieuse pour la sécurité nationale. Il est crucial de développer les infrastructures et la logistique pour consolider notre position actuelle."

 KMT_announce_the_one_china_policy:0 "Annoncer la politique d'une seule Chine"
 KMT_announce_the_one_china_policy_desc:0 "Le régime de Mandchourie n'est qu'un gouvernement fantoche soviétique, qui n'a aucune crédibilité ni légitimité internationale. En tant que membre permanent du système de sécurité de l'ONU, nous annoncerons le principe « d'une seule Chine », affirmant qu'il n'y a qu'une seule Chine, qui comprend non seulement les territoires actuellement contrôlés de la République de Chine, mais aussi la Mandchourie, la Mongolie, le Tibet, Macao, Hong Kong et le Xinjiang. Les nations qui souhaitent poursuivre leurs relations diplomatiques sans gouvernement doivent accepter ce concept. Dans le cas contraire, il n'y aura pas de communication diplomatique."

 KMT_the_kung_chao_doctrine:0 "La doctrine Kung-Chao"
 KMT_the_kung_chao_doctrine_desc:0 "Après des jours de conseils et de discussions, le ministère des Affaires étrangères et le Président sont parvenus à un accord sur la position officielle de la République de Chine sur le statut international de la Mandchourie. Selon la « politique d'une seule Chine » de la République de Chine, la Mandchourie fait partie intégrante de la République de Chine qui est actuellement sous contrôle séparatiste. Nanjing a donc annoncé la « Doctrine Kung-Chao », du nom de l'actuel ministre des Affaires étrangères George Kung-chao, qui prévoira des sanctions contre toute nation cherchant à établir des relations diplomatiques avec le PCC en Mandchourie."

 KMT_intensify_border_controls:0 "Intensifier les contrôles aux frontières"
 KMT_intensify_border_controls_desc:0 "Nous ne pouvons pas risquer que des agents dormants communistes infiltrent la République via la Mandchourie ou la Mongolie. Des contrôles aux frontières plus stricts doivent être effectués dans ces zones pour empêcher les espions de pénétrer sur notre sol."

 KMT_send_spies_into_ccp_territory:0 "Envoyez des espions en Mandchourie communiste"
 KMT_send_spies_into_ccp_territory_desc:0 "Il est crucial de connaître les projets et les ambitions du Parti communiste en Mandchourie. Nous enverrons nos plus grands espions en Mandchourie pour nous fournir des informations sur l'état actuel du PCC, sa politique et ses plans contre notre régime."

 KMT_Tibet_accepts_submission:0 "Le Tibet accepte la soumission"
 KMT_Tibet_accepts_submission_desc:0 "Le Tibet a accepté notre ultimatum après des jours de négociations à la table verte. Le Dalaï Lama abandonne ses prétentions à l'indépendance mais reste l'instance gouvernementale locale du Tibet, gardant le monopole de l'élaboration de la politique intérieure mais soumettant sa politique étrangère à Nanjing."

 KMT_Tibet_refuses_submission:0 "Le Tibet refuse de se soumettre"
 KMT_Tibet_refuses_submission_desc:0 "Le Tibet a refusé notre ultimatium après des jours de négociations à la table verte. Le Dalaï Lama n'abandonne pas ses prétentions à l'indépendance et a clairement déclaré que le Tibet ne fait pas partie de la Chine et ne le fera plus jamais."

 KMT_End_Political_Commissars:0 "Mettre fin aux commissaires politiques"
 KMT_End_Political_Commissars_desc:0 "Les commissaires politiques sont une facette typiquement communiste de l'armée, et nous ne serons jamais comme la racaille communiste ! Il est nécessaire de garder un oeil sur les idéologies de nos troupes, mais pas les commissaires."

 KMT_Crackdown_on_Party_Corruption:0 "Répression de la corruption au sein des partis"
 KMT_Crackdown_on_Party_Corruption_desc:0 "Chen, qu'est-ce que tu fais ?\n\n Fissure.\n\n C'est quoi ce bordel ???"

 KMT_Republic_of_China_Air_Force:0 "Force aérienne de la République de Chine"
 KMT_Republic_of_China_Air_Force_desc:0 "Notre force aérienne doit être renforcée avec les derniers modèles d'avions, et nous serons reconnus comme la première puissance aérienne de la région !"

 KMT_Anti_Aircraft_Initiative:0 "Initiative anti-aérienne"
 KMT_Anti_Aircraft_Initiative_desc:0 "Technologie anti-aérienne ; dont les canons AA, les radars et les missiles sol-air (SAM) sont les plus importants pour nous ; l'Union soviétique dispose de systèmes similaires et nous devons nous préparer à toute action militaire offensive de la part de nos ennemis."

 KMT_Re_Establish_the_Whampoa_Military_Academy:0 "Restaurer l'Académie militaire centrale"
 KMT_Re_Establish_the_Whampoa_Military_Academy_desc:0 "L'Académie militaire centrale (connue par beaucoup sous le nom d'Académie militaire de Whampoa) a formé nombre de nos vaillants officiers et militaires pendant la Seconde Guerre mondiale et la guerre civile chinoise ; nous restaurerons l'Académie militaire de Nanjing et la renommerons en même temps Académie militaire de la République de Chine, ce qui en fera la première académie militaire pour notre corps de cadets."

 KMT_Reform_the_Air_Force_Academy:0 "Réformer l'Académie de l'Armée de l'Air"
 KMT_Reform_the_Air_Force_Academy_desc:0 "L'Académie de l'armée de l'air de la République de Chine doit être réformée pour refléter les technologies émergentes et une formation plus approfondie que nos officiers de l'air doivent recevoir."

 KMT_Import_American_Jets:0 "Importer des avions américains"
 KMT_Import_American_Jets_desc:0 "Les États-Unis, l'un de nos alliés les plus proches, possèdent certains des avions les plus récents et les plus modernes ; nous leur achèterons volontiers certains des derniers modèles d'avions multirôles pour compléter notre force aérienne."

 KMT_A_Chinese_Jet_Fighter:0 "Un chasseur à réaction chinois"
 KMT_A_Chinese_Jet_Fighter_desc:0 "Inspirés par notre premier prototype de chasseur auto-fabriqué (Chu XP-0) fabriqué en 1943, de nombreux ingénieurs locaux ainsi que des généraux militaires ont opté pour un avion de combat d'inspiration occidentale qui sera conçu et fabriqué uniquement par nous-mêmes ; car il est impératif qu'au lieu de compter uniquement sur les importations étrangères de nos alliés, la République de Chine développe ses propres avions à réaction, afin d'étendre massivement sa force aérienne."

 KMT_reform_the_ministry_of_national_defense:0 "Réformer le ministère de la Défense nationale"
 KMT_reform_the_ministry_of_national_defense_desc:0 "Le ministère de la Défense nationale, successeur du ministère de la Guerre du gouvernement et de la Commission des affaires militaires après la rédaction de la Constitution de 1946, est en charge de toutes les affaires de défense et militaires de la République. Cependant, le ministère de la Défense nationale n'est actuellement pas en mesure de mettre en oeuvre pleinement des réformes qui perturberaient l'appareil militaire actuel des forces armées en raison de son inefficacité et du pouvoir qu'il ne détient que de nom. Cela doit être modifié."

 KMT_clamp_down_on_army_nepotism:0 "Réprimer le népotisme militaire"
 KMT_clamp_down_on_army_nepotism_desc:0 "Le népotisme militaire a été un grand problème au sein de notre armée depuis la guerre civile, avec de nombreux officiers volant des fonds et des armes juste pour les faire vendre sur le marché noir par les communistes eux-mêmes. Il y a même eu un casier judiciaire d'un officier qui avait tenté de faire sortir clandestinement de l'or du pays dans un avion pendant la guerre civile chinoise. Si nous souhaitons véritablement réformer les forces armées, il faut remédier au népotisme au sein de l'armée."

 KMT_chinese_armed_forces_structure:0 "Abolir la structure des forces armées américaines"
 KMT_chinese_armed_forces_structure_desc:0 "La structure des forces armées américaines a montré que son inefficacité au combat pendant la guerre civile, l'accent mis sur l'approvisionnement et les bonnes infrastructures rendant peu plausible notre maintien à long terme, nous bénéficierions davantage si nous réformions les forces armées de notre propre gré et réinvitions nos amis allemands à nous aider à le faire."

 KMT_US_armed_forces_structure:0 "S'en tenir à la structure des forces armées américaines"
 KMT_US_armed_forces_structure_desc:0 "La structure des forces armées américaines, même si elle met l'accent sur l'approvisionnement et les bonnes infrastructures, ce que nous ne pouvons pas soutenir pour le moment, il serait dans notre intérêt de progresser lentement pour développer un meilleur système logistique pour aider à soutenir l'armée, plutôt que de l'abolir complètement et de revenir à une armée arriérée."

 KMT_recall_falkenhausen:0 "Rappel de Falkenhausen"
 KMT_recall_falkenhausen_desc:0 "Alexander Von Falkenhausen, l'ancien conseiller militaire allemand en Chine qui a remplacé Hans Von Seeckt dans la mission militaire allemande en Chine, nous a grandement aidé dans les démarches visant à développer une armée réformée. Il réside actuellement en Allemagne et reste toujours en contact avec nous. Peut-être pourrions-nous organiser son retour pour assister nos nouvelles réformes militaires ?"

 KMT_sixty_divisions_plan:0 "Deuxième plan des soixante divisions"
 KMT_sixty_divisions_plan_desc:0 "Le plan original des soixante divisions conçu par Hans Von Seeckt, mettant l'accent sur l'utilisation de l'artillerie sur laquelle il était difficile de mettre la main au début, est maintenant disponible et peut être facilement produit localement, nous permettant d'avoir les capacités nécessaires pour reconstituer le plan des soixante divisions sous la supervision de Falkenhausen."

 KMT_promote_sun_li_jen:0 "Promouvoir Sun Li-Jen"
 KMT_promote_sun_li_jen_desc:0 "Sun Li-Jen a apporté des contributions majeures sur le champ de bataille pendant la guerre civile. Sans ses efforts, la guerre se serait terminée par notre perte ! Avec son éducation aux États-Unis et sa connaissance de la structure militaire américaine, peut-être pourrions-nous le promouvoir et lui faire superviser nos projets de réforme des forces armées chinoises pour qu'elles ressemblent davantage à nos frères américains ?"

 KMT_ninety_divisions_plan:0 "Apportez le plan des quatre-vingt-dix divisions"
 KMT_ninety_divisions_plan_desc:0 "Le plan des quatre-vingt-dix divisions, proposé par Joseph Stilwell à l'époque de la guerre de Résistance, prévoit la réorganisation de l'armée chinoise en 90 divisions. Même si l'époque de la guerre de résistance et de la guerre civile est révolue, nous pourrions peut-être nous inspirer du plan original des quatre-vingt-dix divisions et le reformuler pour l'adapter à notre situation actuelle."

 KMT_Restore_the_Hanyang_Arsenal:0 "Restaurer l'arsenal de Hanyang"
 KMT_Restore_the_Hanyang_Arsenal_desc:0 "L'arsenal de Hanyang est l'arsenal le plus célèbre et le plus ancien de Chine, contribuant à la production de fusils depuis la rébellion des Boxers et pendant la guerre civile. Nous le restaurerons pour permettre à nouveau d'y produire des armes légères et des fusils."

 KMT_Restore_the_Taiyuan_Arsenal:0 "Restaurer l'arsenal de Taiyuan"
 KMT_Restore_the_Taiyuan_Arsenal_desc:0 "Nous restaurerons également l'Arsenal de Taiyuan ! Situé dans le Shanxi, cet arsenal était également connu pour produire des fusils Mauser Type 24 pendant la guerre civile, ainsi que des mitrailleuses, des pièces d'artillerie et des obus."

 KMT_Reform_the_Kiangnan_Arsenal:0 "Réformer l'Arsenal de Kiangnan"
 KMT_Reform_the_Kiangnan_Arsenal_desc:0 "Situé à Shanghai, l'arsenal de Kiangnan était adjacent aux chantiers navals de Kiangnan et se concentrait sur la production d'armes à feu jusqu'à sa dissolution en 1937, juste avant la guerre de résistance contre l'agression japonaise. Nous allons le reconstruire !"

 KMT_Urban_Warfare_Training:0 "Formation à la guerre urbaine"
 KMT_Urban_Warfare_Training_desc:0 "La guerre urbaine devient de plus en plus courante à l'ère moderne de la guerre asymétrique. Nos forces doivent être bien entraînées aux combats urbains, qu'il s'agisse d'attaque ou de défense."

 KMT_Republic_of_China_Navy:0 "Marine de la République de Chine"
 KMT_Republic_of_China_Navy_desc:0 "Notre marine doit être renforcée, car nous devons être l'une des principales puissances navales de la région. La sécurité dans nos eaux et dans nos mers est la priorité absolue de notre marine."

 KMT_Expand_the_Kiangnan_Shipyard:0 "Agrandir le chantier naval de Kiangnan"
 KMT_Expand_the_Kiangnan_Shipyard_desc:0 "Agrandissement du chantier naval de Kiangnan, célèbre pour la construction de canonnières et d'autres bateaux de patrouille dans les années 1920 ; nous ferons appel à leur expertise pour développer notre marine."

 KMT_Commissioning_Former_IJN_Destroyers:0 "Mise en service des anciens destroyers IJN"
 KMT_Commissioning_Former_IJN_Destroyers_desc:0 "Nous avons sérieusement besoin de navires ; prendre d'anciens destroyers japonais permettrait à la fois d'élargir notre marine et d'aider le gouvernement japonais ; la mise en service débutera dans les plus brefs délais."

 KMT_Puchase_American_Vessels:0 "Acheter des navires américains"
 KMT_Puchase_American_Vessels_desc:0 "Les États-Unis cherchent également à moderniser leur marine ; nous accepterions gracieusement des navires américains d'anciens modèles pour rendre notre marine plus grande et plus diversifiée."

 KMT_Expand_the_Marine_Corps:0 "Développez le Corps des Marines"
 KMT_Expand_the_Marine_Corps_desc:0 "Le Corps des Marines de la République de Chine, ou ROCMC, est considéré comme la branche d'élite de l'armée ; une expansion est nécessaire pour se préparer à toute opération en Asie qui nécessiterait notre aide."

 KMT_Seek_Western_Financial_Aid:0 "Nationalisation inversée des industries légères"
 KMT_Seek_Western_Financial_Aid_desc:0 "Depuis le début de la Guerre de Résistance, nous avons nationalisé plus de 90 % des industries chinoises dans le but de mobiliser la nation pour une résistance totale contre les envahisseurs japonais. Cela ne nous a cependant pas profité à long terme, car la croissance économique s'est arrêtée à cause de la corruption généralisée des bureaucrates qui ont pris le contrôle des industries nationalisées, qui sont sous leur contrôle depuis plus de 13 ans. La guerre civile étant terminée, il est temps de restituer la propriété des industries légères aux hommes d'affaires, ce qui devrait permettre à notre économie de se remettre lentement de la dévastation."

 KMT_Enact_Currency_Reform:0 "Adopter une réforme monétaire"
 KMT_Enact_Currency_Reform_desc:0 "Notre monnaie doit être réformée le plus tôt possible ; L'hyperinflation pèse lourdement sur notre économie et nous devons trouver des solutions pour éviter notre effondrement économique."

 KMT_Introduce_New_Standardized_Currency:0 "Distribuez le Fabi Yuan"
 KMT_Introduce_New_Standardized_Currency_desc:0 "Le Fabi Yuan sera officiellement réadapté en tant que monnaie de la République de Chine. Le gouvernement et les banques nationales faciliteront le change selon la nouvelle norme."

 KMT_Apply_For_American_Reconstruction_Aid:0 "Demander une aide américaine à la reconstruction"
 KMT_Apply_For_American_Reconstruction_Aid_desc:0 "Les succès rapides du Plan Marshall en Europe nous ont convaincus que l'aide américaine à la reconstruction est la meilleure stratégie pour reconstruire notre économie et nos infrastructures."

 KMT_Commence_Planning_of_the_Four_Year_Plan:0 "Autoriser les services bancaires privés limités"
 KMT_Commence_Planning_of_the_Four_Year_Plan_desc:0 "Rétrospectivement, l'abolition du système bancaire privé en 1935 s'est avérée être un désastre pour l'économie chinoise. La réforme monétaire a détruit le système bancaire privé qui avait bien servi l'économie chinoise et a placé le contrôle de la monnaie entre les mains d'un gouvernement corrompu et incompétent. L'inflation a commencé presque immédiatement. Finalement, l'inflation est devenue si grave qu'elle a contribué au quasi-effondrement de notre régime. Nous devons prendre des mesures pour éviter une nouvelle inflation."

 KMT_The_First_Four_Year_Plan:0 "Le premier plan quadriennal"
 KMT_The_First_Four_Year_Plan_desc:0 "Nous avons élaboré une planification approfondie et le plan quadriennal débutera dès que possible, avec pour objectif principal de reconstruire et de rajeunir les industries vitales sous notre contrôle."

 KMT_National_Corporations_Department:0 "Département des sociétés nationales"
 KMT_National_Corporations_Department_desc:0 "Pour aider à la reprise des industries lourdes nationalisées de Chine, le Département des sociétés nationales chargé de superviser la gestion des entreprises publiques sera créé sous l'égide du ministère des Affaires économiques."

 KMT_Nationalize_Mining_and_Extraction_Industries:0 "Nationaliser les industries minières et d'extraction"
 KMT_Nationalize_Mining_and_Extraction_Industries_desc:0 "Notre industrie minière et d'extraction a fait ses preuves tant au niveau national qu'international ; sa nationalisation permettra davantage de commerce et de profits pour la République de Chine."

 KMT_Nationalize_the_Arms_Industry:0 "Moderniser les industries d'armement chinoises"
 KMT_Nationalize_the_Arms_Industry_desc:0 "La Chine est encore loin derrière lorsqu'il s'agit de disposer d'industries d'armement véritablement modernisées, avec des décennies de retard par rapport à l'Occident. Nous devons utiliser l'aide étrangère pour remplacer les machines et les outils obsolètes par des neufs, et ce n'est qu'alors que nous pourrons enfin avoir une industrie militaire autosuffisante."

 KMT_Begin_Mechanizing_Agriculture:0 "Commencer à mécaniser l'agriculture"
 KMT_Begin_Mechanizing_Agriculture_desc:0 "Les systèmes agricoles et la technologie utilisés par nos agriculteurs sont obsolètes ; nous devons commencer à mécaniser et rationaliser le processus d'agriculture afin de nourrir notre population."

 KMT_Invest_in_Irrigation_Projects:0 "Investissez dans des projets d'irrigation"
 KMT_Invest_in_Irrigation_Projects_desc:0 "Les régions particulièrement sèches de Chine ont besoin de sérieux projets d'irrigation et, grâce aux fonds américains, nous investirons massivement dans les infrastructures hydrauliques de notre pays."

 KMT_Commence_Reconstruction:0 "Commencer la reconstruction"
 KMT_Commence_Reconstruction_desc:0 "Nos efforts de reconstruction commenceront et nos infrastructures et notre industrie nouvellement construites seront les meilleures du continent asiatique !"

 KMT_Rebuild_Coastal_Infrastructure:0 "Reconstruire les infrastructures côtières"
 KMT_Rebuild_Coastal_Infrastructure_desc:0 "Les infrastructures de nos zones côtières, notamment les ports, les ponts et les routes, doivent être reconstruites et développées selon les normes modernes."

 KMT_Rebuild_Southern_Railways:0 "Reconstruire les chemins de fer du Sud"
 KMT_Rebuild_Southern_Railways_desc:0 "Nos lignes ferroviaires du sud ont été paralysées pendant les guerres dans la région ; ils doivent être modernisés et rendus efficaces pour transporter des passagers et des marchandises dans toute la région."

 KMT_Decline_to_Seek_American_Cooperation:0 "Refus de rechercher la coopération américaine"
 KMT_Decline_to_Seek_American_Cooperation_desc:0 "Dans le domaine de la recherche nucléaire, il existe d'autres puissances avec lesquelles nous pourrions coopérer ; nous apprécions le soutien américain, mais la République de Chine ne sera pas attachée pour toujours."

 KMT_Reform_University_Departments:0 "Départements universitaires réformés"
 KMT_Reform_University_Departments_desc:0 "En prenant la voie indépendante de la recherche, nos départements d'enseignement supérieur et universitaires doivent être réformés, pour refléter l'ère moderne dans laquelle nous vivons et la recherche scientifique que nous devons mener."

 KMT_Import_Dassault_Mirage_IV_Strategic_Bombers:0 "Importer des bombardiers stratégiques Dassault Mirage IV"
 KMT_Import_Dassault_Mirage_IV_Strategic_Bombers_desc:0 "Dans le cadre de notre coopération avec d'autres pays, nous importerons de France des bombardiers stratégiques, le dernier modèle du Mirage IV ; cela nous permettra à la fois de développer notre force aérienne et de commencer à commercer avec d'autres alliés démocratiques."

 KMT_Prioritize_Coastal_Relief:0 "Donner la priorité au secours côtier"
 KMT_Prioritize_Coastal_Relief_desc:0 "Les îles et les villes balnéaires de la côte chinoise ont été les plus durement touchées par les récentes guerres ; l'aide globale apportée au pays doit être accordée en priorité à ces régions."

 KMT_Nationalize_Taiwanese_Assets:0 "Nationaliser les actifs taïwanais"
 KMT_Nationalize_Taiwanese_Assets_desc:0 "Tous les actifs agricoles et industriels de l'île de Taiwan seront nationalisés pour soutenir notre économie en plein essor ; Taiwan sera connue comme une puissance économique !"

 KMT_Attract_Foriegn_Capital:0 "Attirer les capitaux étrangers"
 KMT_Attract_Foriegn_Capital_desc:0 "Nous devons attirer davantage de capitaux et d'investissements étrangers dans l'économie de notre pays ; Au-delà des seuls investisseurs américains, un soutien international est nécessaire."

 KMT_Exploit_Uranium_Deposits_in_Shandong:0 "Exploiter les gisements d'uranium du Shangdong"
 KMT_Exploit_Uranium_Deposits_in_Shandong_desc:0 "Pour poursuivre notre programme nucléaire, les mines d'uranium de Shangdong doivent être agrandies et enrichies afin de nous aider à obtenir les ressources dont nous avons besoin."

 KMT_Refocus_Tsing_Hua_University:0 "Réorienter l'Université Tsing-Hua"
 KMT_Refocus_Tsing_Hua_University_desc:0 "En encourageant la recherche nucléaire à l'université de Tsing-Hua, nous pourrons, nous l'espérons, les persuader de nous aider dans notre programme d'énergie et d'armement nucléaires."

 KMT_Intensify_French_Nuclear_Cooperation:0 "Intensifier la coopération nucléaire française"
 KMT_Intensify_French_Nuclear_Cooperation_desc:0 "La France est rapidement devenue notre alliée la plus importante dans le domaine de la recherche nucléaire et nos relations ne font que se renforcer."

 KMT_tackle_national_illiteracy_problem:0 "S'attaquer au problème national de l'analphabétisme"
 KMT_tackle_national_illiteracy_problem_desc:0 "La prochaine fois, lis un livre."

 KMT_Establish_Modern_Military_RD_Center:0 "Établir un centre de R&D militaire moderne"
 KMT_Establish_Modern_Military_RD_Center_desc:0 "Sans aucun progrès dans la recherche militaire, nous serons considérablement en retard sur les autres et serons soumis à davantage d'humiliation. Un nouveau centre de recherche et de développement militaire moderne sera créé pour poursuivre nos progrès militaires. De cette façon, nous n'aurons pas à compter sur les Américains pour chaque nouvelle technologie militaire qu'ils acquièrent."

 KMT_first_chinese_a_bomb:0 "La première bombe atomique chinoise"
 KMT_first_chinese_a_bomb_desc:0 "Enfin, nos recherches nucléaires ont porté leurs fruits ! La République de Chine deviendra une puissance nucléaire, rejoignant les rangs des États-Unis, du Royaume-Uni, de la France et de l'URSS ; c'est un jour mémorable pour les Chinois du monde entier !"

 KMT_chinese_nuclear_plants:0 "Centrales nucléaires chinoises"
 KMT_chinese_nuclear_plants_desc:0 "Maintenant, Président [CHI.GetLeader], nous avons besoin de plus d'énergie nucléaire !"

 KMT_Develop_Chinese_Nuclear_Power:0 "Développer l'énergie nucléaire chinoise"
 KMT_Develop_Chinese_Nuclear_Power_desc:0 "L'énergie nucléaire est la forme de production d'électricité la plus moderne, la plus économe en énergie et la plus sûre qui ait été développée. La République de Chine mérite de posséder l'énergie nucléaire et nous la développerons comme la nôtre. "

 KMT_American_Cooperation:0 "Coopération américaine"
 KMT_American_Cooperation_desc:0 "Après tout, les Américains ont été les premiers à utiliser les armes et l'énergie nucléaires ; alors pourquoi ne pas solliciter leur aide dans nos efforts pour un programme ?"

 KMT_Joint_American_Chinese_Uranium_Extraction:0 "Extraction conjointe d'uranium américano-chinoise"
 KMT_Joint_American_Chinese_Uranium_Extraction_desc:0 "Avec l'aide et la coopération des États-Unis, nous commencerons à extraire de l'uranium des gisements de Shangdong, pour le bénéfice de nos deux pays."

 KMT_Establish_the_Tibetan_Autonomous_Region:0 "Créer la région autonome du Tibet"
 KMT_Establish_the_Tibetan_Autonomous_Region_desc:0 "Maintenant que le coup d'État du Panchen Lama a réussi, nous ferons du Tibet une région autonome, sous notre contrôle mais avec un semblant d'autonomie gouvernementale."

 KMT_Prepare_for_Mass_Industrialization_Program:0 "Préparez-vous au programme d'industrialisation de masse"
 KMT_Prepare_for_Mass_Industrialization_Program_desc:0 "Notre objectif d'industrialisation doit commencer le plus tôt possible. Cela permettra une industrie plus grande et une économie plus diversifiée et plus prospère."

 KMT_Aim_for_Electric_Equipment_Self_Sufficiency:0 "Viser l'autosuffisance des équipements électriques"
 KMT_Aim_for_Electric_Equipment_Self_Sufficiency_desc:0 "La République de Chine doit commencer à maintenir son autosuffisance dans notre réseau électrique ; des centrales électriques seront construites dans notre pays pour mettre fin à notre dépendance à l'égard des autres pays pour l'électricité."

 KMT_Modernize_Steel_Production:0 "Moderniser la production d'acier"
 KMT_Modernize_Steel_Production_desc:0 "Le procédé de base de fabrication de l'acier à l'oxygène vient d'être développé par Robert Durrer en 1948 ; nous devons rattraper les nouveaux développements de la production pour suivre le rythme des autres pays industrialisés du monde."

 KMT_Economic_Planning_Council:0 "Conseil de planification économique"
 KMT_Economic_Planning_Council_desc:0 "Le Conseil pour l'aide des États-Unis sera réformé en Conseil de planification économique pour aider à la planification des plans quadriennaux de la Chine à l'avenir."

 KMT_Complete_the_Reforms:0 "Achever les réformes"
 KMT_Complete_the_Reforms_desc:0 "Nos réformes agraires seront bientôt achevées. Cela permettra une plus grande liberté du peuple et une plus grande prospérité pour tous, en particulier pour ceux qui souhaitent devenir agriculteurs."

 KMT_Attempt_to_Persuade_Reluctant_Landlords:0 "Tentative de persuader les propriétaires réticents"
 KMT_Attempt_to_Persuade_Reluctant_Landlords_desc:0 "Les propriétaires qui ne sont pas sûrs des politiques de réforme agraire de la République de Chine se verront rappeler doucement et discrètement les avantages de suivre les règles, peut-être avec un paiement anticipé de quelques centaines de dollars..."

 KMT_Invest_in_Agricultural_Modernization:0 "Investir dans la modernisation agricole"
 KMT_Invest_in_Agricultural_Modernization_desc:0 "L'agriculture est une industrie majeure en Chine, et investir dans les dernières technologies et idées du monde agricole nous permettra d'être à égalité avec les pays plus modernisés."

 KMT_Enforce_Reforms_in_Clique_Territory:0 "Appliquer les réformes dans le territoire de la clique"
 KMT_Enforce_Reforms_in_Clique_Territory_desc:0 "Nos réformes doivent être poussées plus fortement sur le territoire des cliques du pays, car elles ont besoin de plus d'aide et d'assistance de la part du gouvernement national que les autres régions."

 KMT_Launch_the_Second_Four_Year_Plan:0 "Lancer le deuxième plan quadriennal"
 KMT_Launch_the_Second_Four_Year_Plan_desc:0 "Constatant le succès massif du premier plan quadriennal, nous lancerons le deuxième plan dès que possible, en nous concentrant sur la poursuite de l'industrialisation et de la modernisation de l'économie."

 KMT_Begin_Mass_Literacy_Campaigns:0 "Lancer des campagnes d'alphabétisation de masse"
 KMT_Begin_Mass_Literacy_Campaigns_desc:0 "En plus de nos campagnes d'industrialisation, notre peuple doit être éduqué, non seulement dans le sens de l'idéologie nationaliste, mais aussi pour savoir lire et écrire comme des citoyens modernes. Le peuple chinois sera connu pour son intelligence !"

 KMT_Construct_New_Steel_Mills:0 "Construire de nouvelles aciéries"
 KMT_Construct_New_Steel_Mills_desc:0 "Avec la modernisation de notre production sidérurgique et l'expansion de notre industrie lourde, il semble nécessaire de construire davantage d'aciéries."

 KMT_Expand_Heavy_Industry:0 "Développer l'industrie lourde"
 KMT_Expand_Heavy_Industry_desc:0 "Notre industrie lourde doit se développer davantage pour produire davantage de produits industriels, d'avions et d'armements."

 KMT_Seek_Foriegn_Economic_Advisors:0 "Rechercher des conseillers économiques étrangers"
 KMT_Seek_Foriegn_Economic_Advisors_desc:0 "Nous devons faire appel à l'aide américaine sous la forme de conseillers économiques pour proposer des suggestions sur l'amélioration de notre économie et de nos industries."

 KMT_Electrification_Campaign:0 "Campagne d'électrification"
 KMT_Electrification_Campaign_desc:0 "L'électricité doit être rendue disponible partout en Chine ! Des centrales électriques seront construites dans tout le pays pour fournir un réseau électrique stable."

 KMT_Build_New_Dams:0 "Commencez la construction du barrage des Trois Gorges"
 KMT_Build_New_Dams_desc:0 "Le barrage des Trois Gorges, une idée envisagée par le grand père fondateur Sun Yat-Sen, pour avoir un barrage situé dans le barrage des Trois Gorges capable de générer 30 millions de chevaux (22 GW) en aval de celui-ci. En même temps que nous avions déjà établi des plans en 1932 pour commencer à planifier la construction du barrage des Trois Gorges, il est enfin temps de mettre en oeuvre la construction du barrage."

 KMT_Exploit_Rare_Earth_Deposits:0 "Exploiter les gisements de terres rares"
 KMT_Exploit_Rare_Earth_Deposits_desc:0 "De précieux gisements de métaux des terres rares, comme le tungstène, ont été découverts partout dans notre pays ! Nous devons les exploiter pour nos usages industriels et vendre le reste sur le marché international."

 KMT_Encourage_Urbanization:0 "Encourager l'urbanisation"
 KMT_Encourage_Urbanization_desc:0 "Nous devons étendre les zones urbaines de Pékin, Shanghai, Guangzhou et d'autres grandes villes ; l'urbanisation permettra la concentration de l'industrie et des travailleurs dans un emplacement central et un accès plus facile au soutien pour la population."

 KMT_Expand_Rural_Rail_Access:0 "Deuxième mouvement de reconstruction rurale"
 KMT_Expand_Rural_Rail_Access_desc:0 "Le mouvement de reconstruction rurale a révolutionné les zones rurales de Chine grâce aux efforts de reconstruction et de modernisation. Nous devons accueillir YC James Yen pour qu'il continue ce qu'il avait commencé."

 KMT_Expand_Shanghai_Port_Capacity:0 "Augmenter la capacité du port de Shanghai"
 KMT_Expand_Shanghai_Port_Capacity_desc:0 "Davantage de quais et de chantiers navals doivent être construits dans le port de Shanghai pour faciliter l'essor du commerce et de notre marine en constante expansion, ainsi que les efforts de construction et de réparation."

 KMT_The_Industrialization_of_China:0 "L'industrialisation de la Chine"
 KMT_The_Industrialization_of_China_desc:0 "Dans le cadre de notre deuxième plan quadriennal, une plus grande partie de la Chine doit être industrialisée ; des complexes industriels seront construits partout où ils seront nécessaires dans notre pays."

 KMT_Economic_Modernization:0 "Modernisation économique"
 KMT_Economic_Modernization_desc:0 "À mesure que les temps changent, nos méthodes de fabrication et de production doivent également être modifiées pour suivre le rythme des autres nations modernes et industrialisées du monde."

 KMT_Conduct_a_Proper_Census:0 "Mener un recensement approprié"
 KMT_Conduct_a_Proper_Census_desc:0 "Notre peuple doit être compté ; cela est très nécessaire car cela permettra de mieux déterminer les besoins de la population et la manière dont le gouvernement peut y répondre."

 KMT_Rapid_Economic_Growt:0 "Croissance économique rapide"
 KMT_Rapid_Economic_Growt_desc:0 "Notre économie croît plus rapidement que jamais, grâce au succès de nos plans quadriennaux et de l'aide internationale !"

 KMT_Reform_the_Judicial_System:0 "Réformer le système judiciaire"
 KMT_Reform_the_Judicial_System_desc:0 "Notre pouvoir judiciaire et notre système judiciaire doivent être réformés pour refléter la justice, et non la corruption ou l'autoritarisme."

 KMT_Empower_the_Legislative_Yuan:0 "Renforcer le Yuan législatif"
 KMT_Empower_the_Legislative_Yuan_desc:0 "Le pouvoir législatif de la République de Chine, le Yuan, doit être autorisé à débattre d'autres questions liées au peuple et au développement de l'économie, pour le bien de la démocratie et de la nation."

 KMT_Introduce_Limited_Democratic_Reforms:0 "Introduire des réformes démocratiques limitées"
 KMT_Introduce_Limited_Democratic_Reforms_desc:0 "La démocratie limitée est la voie à suivre pour la République de Chine, et elle le restera ; Une démocratie complète peut être dangereuse et l'autoritarisme est inefficace de nos jours. Des réformes doivent être faites."

 KMT_Prosecute_the_CC_Clique:0 "Poursuivre la clique CC"
 KMT_Prosecute_the_CC_Clique_desc:0 "La Clique CC est constituée de traîtres, fidèles uniquement à Chiang et non à leur parti ni à leur pays. Ils seront punis pour servir d'exemple à ceux qui sont corrompus et ne se soucient pas de leur glorieuse nation."

 KMT_Begin_Preperations_for_First_Nuclear_Test:0 "Commencer les préparatifs du premier essai nucléaire"
 KMT_Begin_Preperations_for_First_Nuclear_Test_desc:0 "Nous commencerons à mobiliser des chercheurs scientifiques nucléaires pour lancer les travaux sur la bombe atomique chinoise. Un nouveau lieu désigné sera choisi dans le processus pour devenir la zone d'essais nucléaires."

 KMT_Embrace_Atoms_for_Peace:0 "Adoptez les atomes pour la paix"
 KMT_Embrace_Atoms_for_Peace_desc:0 "Au lieu d'utiliser l'énergie nucléaire pour la guerre et la destruction, la République de Chine s'engagera à utiliser l'énergie nucléaire de manière pacifique, en l'utilisant uniquement pour la production d'électricité et d'électricité."

 KMT_Siphon_American_Material:0 "Siphon Matériel Américain"
 KMT_Siphon_American_Material_desc:0 "Le matériel et les documents américains seront très utiles à notre cause de construction d'armes nucléaires. Il se peut que certains de leurs documents les plus importants disparaissent pendant quelques heures..."

 KMT_Quaidam_Basin_Installations:0 "Installations du bassin de Qaidam"
 KMT_Quaidam_Basin_Installations_desc:0 "En raison de sa terre riche en calium, magnésium et lithium ainsi qu'en gaz et plomb (et de son éloignement des centres urbains), c'est l'endroit optimal pour la construction de notre nouvelle centrale électrique."

 KMT_Redevelop_Damaged_Factories:0 "Redévelopper les usines endommagées"
 KMT_Redevelop_Damaged_Factories_desc:0 "Nos usines endommagées doivent être reconstruites et réaménagées pour refléter les technologies et méthodes modernes courantes dans le monde industriel."

 KMT_recognise_saigon_authority_in_vietnam:0 "Reconnaître l'autorité de Saigon au Vietnam"
 KMT_recognise_saigon_authority_in_vietnam_desc:0 "Il ne fait aucun doute que la révolution tridémiste a horriblement échoué au Vietnam, le Viet Quoc étant sur le point de se dissoudre au Vietnam même. Nous devons accepter la dure réalité et travailler à coopérer avec le gouvernement anticommuniste de Saigon dans l'espoir de freiner la menace dans le nord du Vietnam, qui cherche à menacer notre stabilité intérieure."

 KMT_non_aggression_pact_with_vietnam:0 "Approfondir nos relations avec le Sud-Vietnam"
 KMT_non_aggression_pact_with_vietnam_desc:0 "Alors que nos relations s'améliorent grâce à l'établissement de liens entre nos deux pays, nous devons prendre des mesures pour les approfondir grâce à des accords avec le gouvernement de Saigon. Des promesses seraient faites dans l'accord selon lesquelles nous n'essaierons pas de jouer avec leur politique parallèlement à la signature d'un pacte de non-agression. Ce faisant, nous abandonnerons également totalement tout soutien au VNQDD et remettrons au gouvernement de Saigon les membres du parti VNQDD résidant toujours en Chine."

 KMT_organize_the_indochina_military_mission:0 "Organiser la mission militaire en Indochine"
 KMT_organize_the_indochina_military_mission_desc:0 "Avec notre position de politique étrangère à l'égard du Vietnam clairement définie et le renvoi du général Nguyen Chan-A chez nous, nous devons organiser la mission militaire en Indochine sous sa direction, afin de soutenir nos objectifs de réalisation de notre programme en Indochine."

 KMT_indochina_situation:0 "Affaires vietnamiennes"
 KMT_indochina_situation_desc:0 "L'État du Sud-Vietnam peut devenir un nouvel allié précieux au lendemain de la Seconde Guerre mondiale. Toutefois, l'administration actuelle pourrait ne pas être disposée à coopérer pleinement avec nous. Le VNQDD a été actif en politique dans le Sud, suite à la dissolution du parti au Nord sous la pression du Viet Minh. Peut-être pouvons-nous les soutenir dans l'espoir de gagner un autre allié idéologique en Asie du Sud-Est."

 KMT_guard_maritime_trade_routes_in_SCS:0 "sauvegarder les routes commerciales maritimes en mer de Chine méridionale"
 KMT_guard_maritime_trade_routes_in_SCS_desc:0 "Même si nous avons clairement indiqué qu'il était dans notre intérêt de rester à l'écart du conflit vietnamien, cela ne garantit pas que le conflit ne puisse pas nous atteindre, notamment par voie maritime. Nous devons veiller à ce que nos échanges maritimes en mer de Chine méridionale ne soient pas perturbés par le conflit et à ce qu'ils puissent être escortés par notre marine."

 KMT_partial_cooperation_with_diem:0 "coopération partielle avec Diem"
 KMT_partial_cooperation_with_diem_desc:0 "Nous avons réalisé que pour garantir qu'il n'y ait pas un Vietnam hostile dans le sud de notre pays, nous devons choisir un camp à soutenir, un camp qui s'oppose au communisme à nos côtés. L'État du Vietnam, bien que légèrement hostile à nos frères du VNQDD, a clairement indiqué qu'il était prêt à coopérer avec nous pour se débarrasser du Viet Minh qui constitue une menace pour nos deux régimes anticommunistes."

 KMT_Invest_in_the_Empire_of_Vietnam:0 "Investir dans l'État du Vietnam"
 KMT_Invest_in_the_Empire_of_Vietnam_desc:0 "Grâce à notre assistance mutuelle au Vietnam, nous considérons qu'il est juste d'investir dans l'industrie et l'économie du Vietnam, en veillant à leur stabilité dans un avenir lointain."

 KMT_Reorganize_the_VNQDD_party:0 "Réorganiser le VNQDD"
 KMT_Reorganize_the_VNQDD_party_desc:0 "Une autre raison de leur échec dans la révolution tridémiste est due à leur manque d'esprit révolutionnaire et de loyauté envers les Trois principes du peuple, corrompant ainsi ce que représentait le fondateur du tridémisme, le Dr Sun Yat-Sen. Nous devons intervenir dans les affaires du Parti et éliminer les riches hommes d'affaires du parti qui n'ont fait que profiter du statut du parti. Après avoir nettoyé le Parti, nous endoctrinerons les membres du parti pour qu'ils soient loyaux à l'idéologie elle-même, afin qu'ils puissent même avoir une chance de s'opposer à la fois aux bandits communistes de Hanoï et aux chiens de poche impérialistes de Saigon."

 KMT_training_for_VNQDD:0 "Former le Viet Quoc"
 KMT_training_for_VNQDD_desc:0 "Le VNQDD n'a pas de capacités militaires pour déclencher une révolution dans son propre pays, c'est donc un appel pour que nous puissions soutenir ses efforts à travers des programmes de formation spécialement conçus pour lui, en utilisant notre expérience de la Guerre de Résistance et de la Guerre Civile chinoise."

 KMT_collapse_the_iron_curtain_in_north_asia:0 "Brisez le rideau de bambou dans le Nord"
 KMT_collapse_the_iron_curtain_in_north_asia_desc:0 "Nous ne tolérerons pas le statu quo actuel ! Nous préparerons la libération inévitable de ceux qui vivent à l'extérieur, nombre de ceux qui vivent dans le pays souffrant des diverses difficultés imposées par les régimes dirigés par les communistes. Alors que l'Union Soviétique prépare ses États fantoches pour un second round contre nous, notre seul meilleur espoir est de frapper leurs États fantoches à l'intérieur, et lentement, un par un, le bloc communiste en Asie s'effondrera."

 #KMT Victory 60s#

 #Foreign Policy'

 KMT_60s_ROC_in_the_world:0 "Notre politique étrangère"
 KMT_60s_ROC_in_the_world_desc:0 "Puisque nous sommes désormais stables en tant que nation, nous devons faire face aux problèmes internes et externes qui nous entourent en Asie."

 KMT_60s_USA_Relations:0 "Nos relations avec Washington"
 KMT_60s_USA_Relations_desc:0 "Puisque les États-Unis nous ont aidés à gagner la guerre civile chinoise il y a dix ans, nous devons prendre une décision sur la manière dont nous devons gérer nos relations avec Washington à l'avenir."

 KMT_60s_USA_Cooperation:0 "Traité avec les États-Unis"
 KMT_60s_USA_Cooperation_desc:0 "Considérant que nous sommes toujours confrontés à des menaces communistes autour de nous, nous devons une fois de plus faire équipe avec les États-Unis pour lutter contre les futures agressions communistes."

 KMT_60s_USA_exercises:0 "Un savoir-faire américain"
 KMT_60s_USA_exercises_desc:0 "En envoyant nos étudiants aux États-Unis, nous pouvons obtenir des Américains des informations précieuses qui peuvent nous aider à lutter contre le communiste qui nous entoure."

 KMT_60s_USA_CIA:0 "Inviter une mission militaire"
 KMT_60s_USA_CIA_desc:0 "En invitant les États-Unis en Chine pour une mission militaire, nous pouvons apprendre des tactiques et une discipline militaires adaptées à l'ère de la guerre moderne."

 KMT_60s_USA_Qingdao_base:0 "Établir la base aérienne de Tsingtao"
 KMT_60s_USA_Qingdao_base_desc:0 ""

 KMT_60s_SEATO:0 "Travailler avec l'OTASE"
 KMT_60s_SEATO_desc:0 "Au lieu de rejoindre la sphère des anciens impérialistes européens, nous devrions nous aligner sur vos amis d'Asie du Sud-Est pour faire face à la menace du socialisme"

 KMT_60s_NEATO:0 "Créer NEATO"
 KMT_60s_NEATO_desc:0 ""

 KMT_60s_Invest_Europe:0 "Investir dans des entreprises européennes"
 KMT_60s_Invest_Europe_desc:0 ""

 KMT_60s_renegotiate_over_HK_Macau:0 "Renégocier les traités inégaux"
 KMT_60s_renegotiate_over_HK_Macau_desc:0 ""

 KMT_60s_NATO:0 "Travailler avec l'OTAN"
 KMT_60s_NATO_desc:0 "En travaillant en étroite collaboration avec l'OTAN, nous pouvons coordonner notre lutte contre les communistes dans le monde entier."

 KMT_60s_Industry_USA:0 "Aide industrielle américaine"
 KMT_60s_Industry_USA_desc:0 "Avec l'aide des États-Unis, nous pouvons reconstruire notre industrie à un rythme plus rapide que si nous le faisions nous-mêmes."

 KMT_60s_USA_no_cooperation:0 "Dénoncer l'influence américaine"
 KMT_60s_USA_no_cooperation_desc:0 "Afin de libérer la Chine des influences étrangères, nous devons rejeter toute tentative américaine d'influencer notre nation et notre avenir."

 KMT_60s_USA_Spies:0 "Diffuser de la propagande anti-impérialiste"
 KMT_60s_USA_Spies_desc:0 "Pour repousser les influences américaines dans notre pays, nous commencerons par diffuser une propagande anti-impérialiste."

 KMT_60s_USA_Seize:0 "Saisir les capitaux étrangers"
 KMT_60s_USA_Seize_desc:0 "En saisissant les capitaux étrangers dans notre pays, nous pouvons les utiliser pour reconstruire rapidement notre industrie sans avoir à dépendre de l'aide des États-Unis."

 KMT_60s_USA_Steal_Bluprints:0 "Reconstruire les conceptions américaines"
 KMT_60s_USA_Steal_Bluprints_desc:0 ""

 KMT_60s_Pressure_SEATO:0 "Faire pression sur les membres de l'OTASE"
 KMT_60s_Pressure_SEATO_desc:0 "En faisant pression sur les membres de l'OTASA, nous pouvons les éloigner de l'impérialisme américain et former ensemble notre propre alliance asiatique contre les communistes et les impérialistes."

 KMT_60s_Anti-Concessionist:0 "Souvenez-vous du mouvement du 4 mai"
 KMT_60s_Anti-Concessionist_desc:0 "Il est important que nous nous souvenions du Mouvement du 4 Mai et de ce qu'il représente en ne permettant pas à notre nation de tomber à nouveau sous des influences étrangères comme auparavant."

 KMT_60s_ports:0 "Les ports du traité"
 KMT_60s_ports_desc:0 "Enfin, nous sommes en mesure de faire face aux derniers vestiges d'influences étrangères dans notre pays grâce à des négociations avec des pays étrangers sur le sort des ports traités en Chine et leur futur retour à la Chine."

 KMT_60s_USA_No_aggression:0 "Traité de non-agression"
 KMT_60s_USA_No_aggression_desc:0 "En acceptant un traité de non-agression avec les États-Unis, nous pouvons garantir la paix à jamais entre les États-Unis et la Chine."

 KMT_60s_North_PRC:0 "Regardez vers le Nord"
 KMT_60s_North_PRC_desc:0 "Même si nous avons sécurisé la majeure partie de la Chine continentale, nous devons toujours garder les yeux tournés vers le Nord, où les restes de la force communiste restent sous la protection soviétique."

 KMT_60s_Prepare_Manchurian_Invasion:0 "Préparer le projet National Glory"
 KMT_60s_Prepare_Manchurian_Invasion_desc:0 ""

 KMT_60s_Forts_PRC:0 "Préparez-vous à la prochaine invasion de l'APL"
 KMT_60s_Forts_PRC_desc:0 "Pour empêcher toute incursion future de l'Armée populaire de libération, nous devons fortifier notre frontière nord afin de sécuriser nos territoires du Nord."

 KMT_60s_Infiltrate_PRC:0 "Infiltrer le PCC"
 KMT_60s_Infiltrate_PRC_desc:0 "Pour affaiblir davantage le PCC, nous enverrons des espions pour infiltrer le PCC et semer la méfiance et la division au sein du parti."

 KMT_60s_Propaganda_PRC:0 "Répandre la propagande pro-KMT en Mandchourie"
 KMT_60s_Propaganda_PRC_desc:0 "Avec nos espions retranchés en Mandchourie, nous diffuserons des propagandes pro-KMT auprès de la population afin de diminuer sa loyauté envers le PCC."

 KMT_60s_Prepare_army:0 "Déclarer la loi martiale dans les régions frontalières du Hopeh"
 KMT_60s_Prepare_army_desc:0 "Nous devons mobiliser et responsabiliser l'armée à la frontière pour la défendre contre de futures incursions communistes."

 KMT_60s_lessons_civilwar:0 "Les leçons de la guerre civile"
 KMT_60s_lessons_civilwar_desc:0 "Nos expériences de la guerre civile nous aideront à lutter contre les tactiques que l'armée communiste pourrait utiliser contre nous à l'avenir."

 KMT_60s_defense_of_free_china:0 "La défense de la Chine libre"
 KMT_60s_defense_of_free_china_desc:0 ""

 KMT_60s_expand_infrastructure:0 "Améliorer l'infrastructure frontalière"
 KMT_60s_expand_infrastructure_desc:0 "Nous devons améliorer l'infrastructure frontalière pour garantir que nos troupes puissent se déplacer rapidement d'un endroit à un autre en réponse aux futures incursions communistes."

 KMT_60s_test_prc:0 "Exécuter le projet Gloire nationale"
 KMT_60s_test_prc_desc:0 "Puisque nous avons construit notre frontière au nord, nous allons tester notre puissance contre le PCC."

 KMT_60s_aid_south_korea:0 "La question coréenne"
 KMT_60s_aid_south_korea_desc:0 "Puisque la République de Corée a été confrontée à une guerre civile comme la nôtre il y a dix ans, nous devons trouver un moyen d'aider les Coréens à lutter contre leur homologue communiste."

 KMT_60s_aid_south_korea_army:0 "Ravitailler l'armée sud-coréenne"
 KMT_60s_aid_south_korea_army_desc:0 "Nous devons approvisionner l'armée sud-coréenne pour garantir qu'elle puisse se défendre contre les futures invasions communistes venant du Nord."

 KMT_60s_neutrality_korea:0 "Déclarer la neutralité envers la Corée"
 KMT_60s_neutrality_korea_desc:0 ""

 KMT_60s_denounce_kim:0 "Sanctionner la Corée du Nord"
 KMT_60s_denounce_kim_desc:0 ""

 KMT_60s_denounce_park:0 "Dénoncer Park Chung-hee"
 KMT_60s_denounce_park_desc:0 ""

 KMT_60s_protect_south_korea:0 "Protéger la Corée du Sud"
 KMT_60s_protect_south_korea_desc:0 ""

 KMT_60s_aid_south_vietnam:0 "Le conflit vietnamien"
 KMT_60s_aid_south_vietnam_desc:0 "Le Vietnam connaît également une guerre civile entre le régime communiste du Nord et le régime libre du Sud. Aidons le régime sudiste de Saigon de toutes les manières possibles."

 KMT_60s_stay_out_of_vietnam_militarily:0 "Évitez l'escalade"
 KMT_60s_stay_out_of_vietnam_militarily_desc:0 ""

 KMT_60s_support_south_vietnam:0 "Soutenez le Sud-Vietnam"
 KMT_60s_support_south_vietnam_desc:0 ""

 KMT_60s_nation_building_south:0 "Bâtiment de l'État au Sud-Vietnam"
 KMT_60s_nation_building_south_desc:0 ""

 KMT_60s_push_for_regime_change:0 "Faire pression pour un changement de régime"
 KMT_60s_push_for_regime_change_desc:0 ""

 KMT_60s_embargo_north:0 "Embargo sur le Nord"
 KMT_60s_embargo_north_desc:0 "Pour affaiblir le régime communiste au Nord-Vietnam, nous leur imposerons un embargo, empêchant ainsi l'arrivée d'armes et de fournitures supplémentaires."

 KMT_60s_sabotage_supply_north:0 "Sabotage des lignes d'approvisionnement du Viet Cong"
 KMT_60s_sabotage_supply_north_desc:0 "En sabotant les lignes d'approvisionnement du Viet Cong, nous pouvons paralyser l'effort de guerre du régime communiste au Nord-Vietnam."

 KMT_60s_vietnam_war:0 "Nommer Hu Lien ambassadeur au Vietnam"
 KMT_60s_vietnam_war_desc:0 "Puisque Hu Lien a de l'expérience dans la lutte contre les guérilleros communistes, nous pourrions peut-être l'envoyer comme ambassadeur au Sud-Vietnam pour aider l'ARVN à combattre ses guérilleros communistes grâce à son expertise."

 KMT_60s_guns_for_vietnam:0 "Soutien matériel à Saigon"
 KMT_60s_guns_for_vietnam_desc:0 "Nous aiderons le gouvernement de Saigon au Sud-Vietnam en lui envoyant des fournitures et des équipements qui pourront l'aider à mener la guerre contre le Viet Minh."

 KMT_60s_secret_negotiations:0 "Augmenter l'influence du VNQDD"
 KMT_60s_secret_negotiations_desc:0 "Le VNQDD partage notre vision d'une république fondée sur les Trois principes du peuple, aidons-les également à étendre leur influence au Vietnam. Le Viet Quoc, également connu sous le nom de Viet Nam Quoc Dan Dang ou VNQDD, est un parti nationaliste vietnamien connu pour son sentiment anti-français. Nous soutiendrons nos frères d'Indochine dans leur lutte contre les maux du colonialisme !"

 KMT_60s_direct_intervention:0 "Intervention directe"
 KMT_60s_direct_intervention_desc:0 "Nous devons soutenir directement Saigon dans ses relations avec le Nord-Vietnam communiste, afin d'aider le Sud-Vietnam à gagner la guerre."

 KMT_60s_send_volunteers:0 "Fournir des bénévoles"
 KMT_60s_send_volunteers_desc:0 ""

 KMT_60s_mediate_unification:0 "Organisez la conférence de Taipei"
 KMT_60s_mediate_unification_desc:0 ""

 KMT_60s_united_vietnam_in_our_sphere:0 "Traité sino-vietnamien de coopération et d'amitié"
 KMT_60s_united_vietnam_in_our_sphere_desc:0 ""

 KMT_60s_Sinkiang:0 "Le problème du Xinjiang"
 KMT_60s_Sinkiang_desc:0 "Le Xinjiang étant toujours sous contrôle communiste, nous devons rapidement décider comment y faire face."

 KMT_60s_Yulbars:0 "Contacter Yulbars Khan"
 KMT_60s_Yulbars_desc:0 "Puisque le Xinjiang fait partie de la Chine depuis la dynastie Qing, nous n'y renoncerons jamais. Contactons le chef de guerre loyaliste Yulbars Khan et aidons-le à prendre le Xinjiang."

 KMT_60s_Ressource_Smuggle:0 "Contrebande de ressources"
 KMT_60s_Ressource_Smuggle_desc:0 "Nous pouvons commencer à soutenir Yulbars Khan dans la reprise du Xinjiang en faisant passer clandestinement des ressources qui peuvent nous aider à lutter contre les communistes là-bas."

 KMT_60s_arm_hans:0 "Armer les milices Han locales"
 KMT_60s_arm_hans_desc:0 "Puisque les tensions ethniques entre les Ouïghours et les Han locaux restent fortes au Xinjiang, envoyons des armes aux milices Han locales pour lutter contre le gouvernement communiste du Xinjiang."

 KMT_60s_support_KMT_remnants:0 "Soutenir les restes du KMT"
 KMT_60s_support_KMT_remnants_desc:0 "Nous pouvons également envoyer notre soutien aux restes du KMT qui combattent toujours au Xinjiang contre le gouvernement communiste afin de l'affaiblir de l'intérieur."

 KMT_60s_raid_Bayingolin:0 "Raid Bayingolin"
 KMT_60s_raid_Bayingolin_desc:0 "Passons à l'offensive et attaquons Bayingolin pour affaiblir encore plus l'armée communiste du Xinjiang, ouvrant potentiellement la voie à un coup d'État."

 KMT_60s_do_coup:0 "Lancez le coup d'État"
 KMT_60s_do_coup_desc:0 "Puisque nous avons affaibli les forces communistes au Xinjiang, il est temps pour nous de lancer un coup d'État au Xinjiang avec l'aide de Yulbars Khan et des aides locales de l'intérieur, reprenons le Xinjiang aux forces communistes et réunifions la Chine une fois pour toutes."

 KMT_60s_Asylum:0 "Offrir l'asile aux immigrants Han"
 KMT_60s_Asylum_desc:0 "Puisque nous avons renoncé à nos revendications sur le Xinjiang, offrons l'asile aux immigrants Han qui souhaitent émigrer du Xinjiang."

 KMT_60s_recall_officiers:0 "Rappel des responsables militaires du Xinjiang"
 KMT_60s_recall_officiers_desc:0 "Rappelons tous les responsables militaires restés au Xinjiang maintenant que nous ne le revendiquons plus."

 KMT_60s_abolish_governate:0 "Abolir le gouvernorat du Xinjiang"
 KMT_60s_abolish_governate_desc:0 "Nous allons maintenant abolir le gouvernorat du Xinjiang et le retirer de la carte de notre nation."

 KMT_60s_integrate_sik:0 "Intégrer le Xinjiang"
 KMT_60s_integrate_sik_desc:0 ""

 KMT_60s_friendship_SIK:0 "Traité d'amitié et de non-agression"
 KMT_60s_friendship_SIK_desc:0 "Grâce au Traité d'amitié et de non-agression, nous pouvons garantir à Moscou qu'il y aura la paix en Asie, à condition que ni nous ni eux ne nous attaquons."

 KMT_60s_ask_sov:0 "Contactez Moscou"
 KMT_60s_ask_sov_desc:0 "Nous devons tendre la main à Moscou et veiller à ne pas envahir le Xinjiang à l'avenir."

 KMT_60s_trial_Shicai:0 "Le destin de Sheng Shicai"
 KMT_60s_trial_Shicai_desc:0 "Puisque nous avons abandonné le Xinjiang, nous allons mener un procès contre Sheng Shicai, l'ancien gouverneur du Xinjiang, et déterminer ce que nous ferons de lui à l'avenir."

 KMT_60s_Coup:0 "Développer le NCIS "
 KMT_60s_Coup_desc:0 "Nous devons élargir la SNB afin de mener efficacement notre opération de reconquête du Xinjiang."

 KMT_60s_korea_industrial_aid:0 "Aide industrielle à Séoul"
 KMT_60s_korea_industrial_aid_desc:0 "Nous pouvons envoyer des aides industrielles à Séoul afin que la République de Corée puisse reconstruire rapidement son industrie."

 KMT_60s_korea_war:0 "Conseillers militaires"
 KMT_60s_korea_war_desc:0 "Nous pouvons envoyer des conseillers militaires à Séoul pour les aider à former des soldats pour lutter contre les communistes."

 KMT_60s_korea_refugees:0 "Accepter les réfugiés coréens"
 KMT_60s_korea_refugees_desc:0 "Nous devrions accepter les réfugiés coréens qui souhaitent émigrer dans notre pays pour échapper à la répression et à la torture."

 KMT_60s_korea_joint_exercises:0 "Exercices militaires conjoints"
 KMT_60s_korea_joint_exercises_desc:0 "Nous devrions mener des exercices militaires conjoints avec l'armée sud-coréenne pour rapprocher les armées des deux pays contre les forces communistes."

 KMT_60s_korea_solve_conflict:0 "Unir la péninsule"
 KMT_60s_korea_solve_conflict_desc:0 "Nous devons trouver un moyen de résoudre le conflit coréen afin de garantir que nous aurons un allié dans la péninsule coréenne."

 KMT_60s_sino_korean_friendship:0 "Traité d'assistance sino-coréen"
 KMT_60s_sino_korean_friendship_desc:0 ""

 KMT_60s_korea_Protect_only:0 "Mesures défensives"
 KMT_60s_korea_Protect_only_desc:0 "Nous garantirons officiellement la souveraineté de la République de Corée, donc Pyongyang y réfléchira à deux fois avant de franchir à nouveau la frontière."

 KMT_60s_Recognize:0 "Reconnaître l'indépendance du Turkestan oriental"
 KMT_60s_Recognize_desc:0 "Nous devons comprendre que le Xinjiang est une cause perdue et que reconnaître l'indépendance de la République du Turkestan oriental serait le premier pas vers la paix dans le Nord-Ouest."

 KMT_60s_Infra_Structure:0 "Moderniser les infrastructures à Xibei"
 KMT_60s_Infra_Structure_desc:0 "Nous devons moderniser nos infrastructures dans la région du Nord-Ouest afin de les protéger des incursions du gouvernement communiste du Xinjiang."

 KMT_60s_Training:0 "Exercices militaires au Qinghai"
 KMT_60s_Training_desc:0 "Nous devons mener des exercices militaires au Qinghai pour le défendre des futures invasions communistes du Xinjiang."

 KMT_60s_Forts_SIK:0 "Efforts de fortification"
 KMT_60s_Forts_SIK_desc:0 "Nous devons construire des fortifications à la frontière nord-ouest pour dissuader toute tentative d'invasion depuis le Xinjiang."

