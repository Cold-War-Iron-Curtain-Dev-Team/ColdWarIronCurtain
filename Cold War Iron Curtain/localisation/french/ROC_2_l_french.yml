 text_native_unrest_loc:0 "Troubles autochtones :"
 text_native_unrest_title_tt:0 "§CTroubles autochtones§!"
 text_native_unrest_tt:0 "§gLorsque l'Empire japonais capitula en 1945, l'île de Taiwan fut rétrocédée à la République de Chine. Le gouvernement du Kuomintang, favorable aux politiques de centralisation et de sinisation, a déjà pris diverses mesures pour aligner la province taïwanaise sur l'État chinois. Les écoles taïwanaises mettent désormais l'accent sur la langue chinoise, l'histoire et un programme soutenant l'idéologie du Kuomintang. Cependant, étant donné que la majorité des Taïwanais sont déconnectés de l'influence chinoise depuis plus de cinq décennies, il est clair qu'ils ne sont pas disposés à adopter toutes les doctrines énoncées par un gouvernement dominé par le continent.\n\n§RSi ce modificateur tombe en dessous de -30 % de stabilité et de soutien de guerre, le gouvernement du Kuomintang tombera et la République de Chine cessera d'exister.§! §!"
 text_kmt_strength_loc:0 "Unité du KMT :" 
 text_kmt_strength_title_tt:0 "§CUnité du Kuomintang§!"
 text_kmt_strength_tt:0 "§g\"La révolution chinoise a échoué. Mon seul désir aujourd'hui est de restaurer l'esprit révolutionnaire qu'avait le Kuomintang chinois en 1924\", a déclaré Chiang Kai-shek en 1932. \n\nLe Kuomintang avait accédé au pouvoir en promettant diverses réformes sociales et économiques au peuple chinois. Mais après la défaite de la clique de Beiyang, le parti s'est concentré uniquement sur le maintien et l'expansion de son pouvoir et sur la lutte contre le Parti communiste. Des bureaucrates inefficaces, la corruption, le factionnalisme et l'opportunisme ont contribué à la chute du Kuomintang et à sa défaite contre le Parti communiste sur le continent. Il est dans notre intérêt de mettre fin à cette misère et de prendre des mesures pour réformer le Kuomintang en un parti uni, efficace, exempt d'opportunistes et de corruption.§!"
 text_kmt_influence_loc:0 "Influence du KMT :"
 text_kmt_influence_title_tt:0 "§CInfluence du Kuomintang§!"
 text_kmt_influence_tt:0 "§gAfin d'avoir une chance de reprendre le continent aux mains des communistes, le Kuomintang doit promouvoir les valeurs et les croyances du Parti auprès du peuple taïwanais. Si le peuple ne considère pas le Kuomintang comme le seul gouvernement chinois légitime, l'opportunité de reconquérir la Chine pourrait être perdue à jamais.§!"
 text_cia_influence_loc:0 "Influence américaine :" 
 text_cia_influence_tt:0 "§gLes États-Unis d'Amérique ont été notre allié le plus proche dans la guerre de Résistance, nous fournissant les conseillers et les armes indispensables pour expulser les envahisseurs japonais. Après la chute de la partie continentale de la Chine, les États-Unis ont déclaré leur soutien dans notre lutte contre le communisme en Asie. Leur puissant arsenal profitera grandement à notre armée et jouera un rôle crucial dans la reconquête du continent chinois, mais il serait sage de limiter l'influence politique de Washington...§!" 
 text_cia_influence_title_tt:0 "§CInfluence américaine§!"
 president_title_tt:0 "§YPrésident de la République de Chine§!"
 vice_president_title_tt:0 "§YVice-président de la République de Chine§!"
 premier_title_tt:0 "§YPremier ministre de la République de Chine§!"
 premier_description_tt:0 "§gLe Premier ministre de la République de Chine est à la tête du gouvernement républicain et à la tête du Yuan exécutif. Le Premier ministre est nommé par le Président de la République et est responsable de la recommandation du vice-Premier ministre, des ministres du gouvernement ainsi que des présidents du Yuan exécutif, qui doivent ensuite être nommés par le Président. Le Premier ministre a le devoir de représenter les politiques administratives et doit rendre compte des projets de loi au Yuan législatif. Le Premier ministre peut exercer les fonctions de vice-président, si le vice-président actuel prend ses fonctions de président jusqu'à ce que le reste du mandat présidentiel initial soit terminé. Le Premier ministre doit démissionner de ses fonctions si une motion de censure est initiée par le Yuan législatif et approuvée à la majorité simple. Compte tenu de l'énorme influence de la position présidentielle de Chiang Kai-shek, il est peu probable que le Premier ministre détienne actuellement des pouvoirs significatifs au sein du gouvernement." 
 president_vice_description_tt:0 "§gSelon l'article 49 de la Constitution de la République de Chine de 1947, le vice-président est le deuxième plus haut fonctionnaire de la République et succède au président au cas où le poste deviendrait vacant jusqu'à l'expiration du mandat présidentiel initial. Le vice-président fait également office de représentant du président en cas d'empêchement de celui-ci. Si le vice-président assume la présidence en cas de décès, de maladie ou de démission du président actuel, le chef du Yuan exécutif et Premier ministre de la République de Chine assumera le rôle de vice-président. La fonction, parallèlement à la fonction présidentielle, est confiée par l'Assemblée nationale tous les 6 ans, mais détient très peu de pouvoir formel dans le gouvernement républicain et dépend fortement du programme politique du président§g."
 president_description_tt:0 "§gLe président de la République de Chine est le chef de l'État et le commandant en chef de l'armée chinoise. Selon la Constitution de la République de Chine de 1947, qui a rétabli la Chine en tant que république parlementaire, le président ne détient que des pouvoirs cérémoniels et peu ou pas de pouvoir exécutif réel sur le papier et est élu par l'Assemblée nationale tous les six ans.\n\nSuite à la décision de l'Assemblée nationale de soutenir Chiang Kai-shek en tant que président, Chiang a continué à étendre ses pouvoirs, transférant le pouvoir du Yuan législatif et du Premier ministre au président. Le bureau présidentiel, du moins pour l'instant, conserve des pouvoirs quasi dictatoriaux.§!" 
 
