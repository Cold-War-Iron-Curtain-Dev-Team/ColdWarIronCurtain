 saf_news.1.d:0 "La police sud-africaine a fait l'objet d'une surveillance étroite de la part d'un grand nombre de gouvernements après l'annonce de policiers tirant sur une foule de manifestants. La foule protestait contre les lois sur les laissez-passer du gouvernement de la minorité blanche d'Afrique du Sud lorsque la police s'est alarmée et a commencé à tirer sur la foule qui protestait. Des renforts, des jets et des gaz lacrymogènes ont été utilisés pour tenter de disperser la foule, mais cela n'a fait qu'accroître la violence des manifestants. Des pierres ont été lancées et quelques combats mineurs ont eu lieu avant le massacre de Sharpeville, comme on l'a surnommé. Le résultat a été de 249 victimes, dont 29 enfants. Les dirigeants du monde et les organisations internationales ont déjà condamné le Parti national sud-africain et son recours continu à l'apartheid."
 saf_news.200.d:0 "Hendrik Verwoed, le président sud-africain largement considéré comme le fondateur de l'apartheid, est décédé aujourd'hui. À 14 h 15, heure locale, un assistant parlementaire inconnu a poignardé le président à quatre reprises. Le président a été transporté d'urgence à l'hôpital et déclaré mort. Le président avait déjà survécu à une tentative d'assassinat, mais cette fois, malgré l'aide de certains parlementaires médicalement formés, il n'a pas eu autant de chance.\n Verwoed, pendant son mandat, a créé une République sud-africaine, mettant l'accent sur l'anglophobie et l'isolationnisme afin de donner du crédit à son régime. Ses actions ont conduit à l'exclusion de l'équipe sud-africaine de nombreux événements sportifs. Au cours de son premier mandat, il a également été confronté aux critiques des Nations Unies et de leurs sanctions. Sous son règne, le complexe militaro-industriel sud-africain est créé. En outre, il est possible qu'il ait créé un programme sud-africain d'armes nucléaires et biologiques, mais cela n'est pas encore confirmé. \n Cependant, nombreux sont ceux qui doutent que ce soit la fin de l'apartheid."
