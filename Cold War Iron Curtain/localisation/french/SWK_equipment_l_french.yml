########## SWK Infantry
 SWK_infantry_equipment_0:0 "Carabine de jungle n°5 Mk.1"
 SWK_infantry_equipment_0_short:0 "Fusil n°5 Mk I"
 SWK_infantry_equipment_0_desc:0 "Le fusil n° 5 Mk I ou « Jungle Carbine » était une version légère et raccourcie du britannique Lee-Enfield n° 4 Mk I, chambré en.303 British. Développé pendant la Seconde Guerre mondiale pour la guerre dans la jungle, il était environ 100 mm (3,9 pouces) plus court et près d'un kilogramme (2,2 livres) plus léger que le fusil standard. \nLe fusil était doté d'une crosse en caoutchouc, qui facilitait l'adhérence mais augmentait le recul. Ses viseurs en fer étaient conçus pour les distances rapprochées et plus longues, ce qui le rend idéal pour la maniabilité sur terrain dense. Produite entre 1944 et 1947, la Jungle Carbine était appréciée pour son efficacité dans les combats dans la jungle."

 SWK_infantry_equipment_1:0 "Carabine Owen Machine"
 SWK_infantry_equipment_1_short:0 "Owen-2"
 SWK_infantry_equipment_1_desc:0 "La carabine Owen Machine était un SMG australien utilisé pendant la Seconde Guerre mondiale et la guerre de Corée. Conçu par Evelyn Owen en 1939, il fut produit entre 1941 et 1944. Chambré en Parabellum 9×19 mm, le pistolet Owen était réputé pour sa fiabilité dans des conditions difficiles, notamment dans la guerre dans la jungle. \nL'arme comportait un chargeur monté sur le dessus, permettant à la gravité de faciliter l'alimentation, et une opération de retour de flamme simple qui contribuait à sa robustesse. Sa conception comprenait un carénage de canon distinctif et un viseur latéral, ce qui améliorait la facilité d'utilisation dans des espaces rapprochés. Pesant environ 4,22 kg (9,3 lb) et avec une cadence de tir d'environ 700 coups par minute, le pistolet Owen est devenu l'un des favoris des rangers du Sarawak pour sa durabilité et sa facilité d'entretien dans des environnements difficiles."

 SWK_infantry_equipment_2:0 "Fusil d'assaut Owen Jungle"
 SWK_infantry_equipment_2_short:0 "Pot Owen-2"
 SWK_infantry_equipment_2_desc:0 "L'Owen-2 était une arme à feu commandée par les forces armées du Sarawak en 1955. Elle combinait les caractéristiques légères et robustes de la mitraillette Owen avec les principes de conception modernes du fusil à chargement automatique L1. Chambré en 7,62 × 51 mm OTAN, le fusil semi-automatique offrait une plus grande portée et une plus grande puissance d'arrêt tout en conservant la simplicité et la fiabilité de son prédécesseur SMG. \nLe fusil présentait une conception squelettée pour réduire le poids, une crosse rabattable latéralement pour la portabilité et une poignée de chargement montée sur le dessus pour une utilisation facile dans des conditions difficiles. Ses viseurs en fer étaient réglables jusqu'à 800 mètres, fusionnant la précision du L1 avec la durabilité nécessaire à la guerre dans la jungle. Le fusil Owen est devenu un atout précieux pour sa puissance, sa simplicité et son adaptabilité dans les environnements difficiles de Bornéo."

 SWK_infantry_equipment_3:0 "La carabine Jungle Brooke-Kuchingarms V-04"
 SWK_infantry_equipment_3_short:0 "Carabine V-4"
 SWK_infantry_equipment_3_desc:0 "La V-04 Jungle Carbine est une carabine moderne produite dans le pays, conçue spécifiquement pour la guerre dans la jungle. Il combine les caractéristiques des fusils des séries AK et M, offrant polyvalence et adaptabilité pour les défis uniques des environnements tropicaux denses. Le V-04 est chambré dans la cartouche OTAN de 5,56 × 45 mm, offrant un équilibre entre puissance d'arrêt et recul gérable, garantissant précision et facilité d'utilisation lors de combats soutenus. \nAvec une construction robuste et légère, il est bien adapté aux patrouilles, aux embuscades et aux longues randonnées dans des conditions humides. Le V-04 est équipé d'accessoires modernes qui le rendent efficace aussi bien dans les combats rapprochés que de moyenne portée. Sa conception robuste garantit sa fiabilité dans des environnements difficiles, ce qui en fait un atout essentiel pour les forces du Sarawak dans les opérations dans la jungle."

 SWK_infantry_equipment_4:0 "Carabine, calibre 5,56 mm, M4"
 SWK_infantry_equipment_4_short:0 "Carabine M4"
 SWK_infantry_equipment_4_desc:0 "La carabine M4 est une nouvelle amélioration par rapport au M16A2. Il a été initialement commandé pour être conçu par une grande équipe ad hoc de concepteurs en 1984 et le développement s'est terminé en 1993. Après 9 ans de développement, j'espère que cela aurait valu la peine d'attendre. Il présente un plus grand niveau de fiabilité et est beaucoup plus léger et plus court. Principalement grâce à des matériaux améliorés, il est plus précis que le M16A2. Sa taille compacte le rend plus polyvalent et plus facile à utiliser que le M16A2. La carabine M4 a été utilisée lors de la guerre américaine en Afghanistan, de la guerre en Irak et de la guerre contre l'Etat islamique."
 
 SWK_auto_cannon_equipment_1:0 "Type 96 25 mm AA"
 SWK_auto_cannon_equipment_1_short:0 "Tapez 96"
 SWK_auto_cannon_equipment_1_desc:0 "Le canon AA de 25 mm Type 96 était un canon automatique utilisé par la marine impériale japonaise pendant la Seconde Guerre mondiale. Variante construite localement du canon anti-aérien français Hotchkiss de 25 mm, il a été conçu comme une arme à double usage destinée à être utilisée contre les véhicules blindés et les avions, mais a été largement déployé dans et autour de la région de Kuching pendant la brève occupation de Bornéo par l'IJA avant d'être ensuite acquis par les forces du Sarawak après la Seconde Guerre mondiale."
 
 SWK_auto_cannon_equipment_2:0 "Canon anti-aérien lourd QF de 3,7 pouces"
 SWK_auto_cannon_equipment_2_short:0 "QF 3,7 pouces AA"
 SWK_auto_cannon_equipment_2_desc:0 "Le QF 3,7 pouces AA était le principal canon anti-aérien lourd britannique pendant la Seconde Guerre mondiale. C'était à peu près l'équivalent du Flak allemand 8,8 cm et du 90 mm américain, mais avec un calibre légèrement plus grand de 3,7 pouces, soit environ 94 mm. La production a commencé en 1937 et a été utilisée tout au long de la Seconde Guerre mondiale sur tous les théâtres d'opérations, à l'exception du front de l'Est. Il est resté utilisé après la guerre pendant l'urgence malaise par les forces du Commonwealth jusqu'à ce que les canons AA soient remplacés par des missiles guidés à partir de 1957."
 
 SWK_artillery_equipment_1:0 "Canon moyen BL 5,5 pouces Mk 3"
 SWK_artillery_equipment_1_short:0 "Pistolet BL 5,5 pouces"
 SWK_artillery_equipment_1_desc:0 "Le canon BL 5,5 pouces était une pièce d'artillerie moyenne britannique utilisée pendant la Seconde Guerre mondiale et les conflits ultérieurs. Connu pour sa fiabilité et sa polyvalence, le canon tirait un obus de 5,5 pouces et était principalement utilisé pour les bombardements à longue portée. Il avait une portée effective d'environ 16 200 mètres (10 miles) et était utilisé par les forces du Commonwealth pour des rôles de défense sur le terrain et côtière. Le canon BL de 5,5 pouces est resté en service pendant toute la guerre froide, servant dans des conflits comme l'urgence malaise et la guerre de Corée. Il est devenu un incontournable des régiments d'artillerie britanniques et du Commonwealth, loué pour sa précision et sa puissance de feu."
 
 SWK_artillery_equipment_2:0 "OTO OTO Melara Modèle 56/14 pack Obusier "
 SWK_artillery_equipment_2_short:0 "OTO Melara Mod 56"
 SWK_artillery_equipment_2_desc:0 "L'obusier pack OTO Melara Mod 56/14 est une pièce d'artillerie légère de 105 mm conçue par le fabricant italien OTO Melara. Connu pour sa portabilité et sa facilité d'assemblage, il peut être décomposé en plusieurs pièces pour être transporté sur des terrains difficiles, ce qui le rend idéal pour la guerre en montagne et dans la jungle. L'obusier a une portée maximale d'environ 10 500 mètres et a été largement utilisé par diverses forces militaires à travers le monde, en particulier dans les régions où la mobilité est essentielle. Sa polyvalence l'a amené à être utilisé dans des rôles de soutien d'infanterie, antipersonnel et de tir indirect."
 
 SWK_light_artillery_equipment_1:0 "Ordnance QF 25 livres"
 SWK_light_artillery_equipment_1_short:0 "25 livres"
 SWK_light_artillery_equipment_1_desc:0 "L'Ordnance QF 25-pounder était un canon de campagne et un obusier britannique, largement considéré comme l'une des meilleures pièces d'artillerie de la Seconde Guerre mondiale. Il tirait des obus de 25 livres (11,3 kg) et était très apprécié pour sa polyvalence, capable de tirs directs et indirects. Avec une portée effective d'environ 12 000 mètres (7,5 miles), il était utilisé pour divers rôles, notamment le soutien de l'infanterie, le tir de contre-batterie et le bombardement. Le canon de 25 livres a continué à servir dans les conflits d'après-guerre comme l'urgence malaise, loué pour son équilibre entre puissance de feu, mobilité et précision."
 
 SWK_heavy_artillery_equipment_1:0 "artillerie lourde de 12,7 cm/40 Type 89"
 SWK_heavy_artillery_equipment_1_short:0 "Pistolet type 89"
 SWK_heavy_artillery_equipment_1_desc:0 "L'artillerie lourde de 12,7 cm/40 Type 89 a été conçue à l'origine comme un canon anti-aérien et naval à double usage par la marine impériale japonaise. Pendant l'occupation de Bornéo par le Japon pendant la Seconde Guerre mondiale, ces canons ont été modifiés et réutilisés par l'armée impériale japonaise pour être utilisés comme défense côtière et comme artillerie lourde. Positionnés stratégiquement le long des côtes, ils étaient destinés à se défendre contre les forces navales alliées. Après la guerre, bon nombre de ces armes capturées ont été reprises par les forces du Sarawak et réutilisées pour leur propre défense côtière, marquant ainsi leur service continu dans la région."
 
 SWK_direct_fire_gun_equipment_1:0 "Ordnance QF 2 livres"
 SWK_direct_fire_gun_equipment_1_short:0 "Canon livreur QF-2"
 SWK_direct_fire_gun_equipment_1_desc:0 "L'Ordnance QF 2-pounder était un canon antichar britannique monté sur véhicule largement utilisé pendant les premières années de la Seconde Guerre mondiale. Tirant un projectile de 40 mm, il était très efficace contre les véhicules légèrement blindés, mais devint moins utile à mesure que le blindage ennemi s'améliorait. Le canon était généralement monté sur des chars, des véhicules blindés et comme arme antichar autonome. Il joua un rôle important dans les premières campagnes d'Afrique du Nord et resta en service comme arme secondaire même après avoir été remplacé par une artillerie plus lourde."
 
 SWK_direct_fire_gun_equipment_2:0 "Ordnance QF 6 livres 7 cwt"
 SWK_direct_fire_gun_equipment_2_short:0 "canon de 57 mm M1"
 SWK_direct_fire_gun_equipment_2_desc:0 "Le canon antichar M1 de 57 mm était une version américaine du canon antichar britannique Ordnance QF de 6 livres. Il est devenu le canon antichar moyen standard des forces américaines pendant la Seconde Guerre mondiale. Le M1 était capable de pénétrer le blindage de la plupart des chars ennemis de l'époque et était largement déployé sur les théâtres européens. Il a été loué pour sa mobilité, son efficacité contre les chars moyens et sa durabilité au combat, mais à mesure que le blindage des chars s'est amélioré, il a finalement été remplacé par des canons antichar de plus gros calibre."
 
 SWK_motorized_equipment_1:0 "Camion Ford F30 de modèle militaire canadien (CMP)"
 SWK_motorized_equipment_1_short:0 "Camion Ford Australie CMP"
 SWK_motorized_equipment_1_desc:0 " Le camion Ford F30 de modèle militaire canadien (CMP) produit par Ford Australie pendant la Seconde Guerre mondiale était un véhicule 4x4 de 30 quintaux (1,5 tonne) conçu pour un usage militaire dans divers environnements. Connu pour sa durabilité, sa polyvalence et ses capacités tout-terrain, le Ford F30 a servi dans des rôles tels que le transport de troupes, le transporteur de marchandises et le tracteur d'artillerie. Sa conception CMP standardisée permettait un entretien facile et l'interchangeabilité des pièces avec d'autres véhicules militaires. Le F30 a joué un rôle essentiel dans les opérations alliées en Afrique du Nord, en Europe et dans le Pacifique, et plus tard lors de l'urgence malaise contre le MNLA et les camarades de Chin Peng."
 
 
