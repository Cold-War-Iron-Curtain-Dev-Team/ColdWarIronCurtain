l_french:
 air_disaster.1.d:0 "Tard hier soir, un vol de Korean Airlines en provenance de l'aéroport international Ted Stevens d'Anchorage, en Alaska, à destination de l'aéroport international de Gimpo à Séoul, en Corée du Sud, s'est égaré dans l'espace aérien soviétique à 15 h 51 UTC au-dessus de la péninsule du Kamtchatka et a été abattu suite à l'échec de l'avion à réagir aux panneaux d'avertissement et aux communications de l'armée soviétique. Un Sukhoi SU-15 soviétique a abattu l'avion de ligne civil, avec à son bord le membre du Congrès géorgien Larry McDonald. Les 269 passagers à bord ont péri."
 air_disaster.2.d:0 "Plus tôt cet après-midi, un vol El Al en provenance de l'aéroport international Wien-Schwechat de Vienne et à destination de l'aéroport Lod de Tel Aviv a été abattu au-dessus de la République populaire de Bulgarie en raison d'un écart par rapport à sa trajectoire prévue. La cause de cette déviation est inconnue pour le moment. Il a été établi que le vol, volant à Fl180, a quitté la voie aérienne Amber 10 et s'est égaré sur 200 milles en territoire bulgare. L'avion avait ignoré les obus de sommation tirés par les MiG-15 stationnés pour défendre Sofia. Pinchas Ben-Porat, l'homme qui a conduit à la formation de l'armée de l'air israélienne, le 101e escadron de l'IAF, et El Al sont morts à bord."
 air_disaster.3.d:0 "Une tragédie a frappé cet après-midi à l'aérodrome de Llandow lorsqu'un Avro Tudor V nommé « Star Girl » s'est écrasé après avoir tenté d'atterrir à l'aérodrome de Llandow. Des témoins oculaires ont déclaré que l'avion s'est approché de la piste à une altitude anormalement basse avec son train d'atterrissage abaissé. Seules 3 personnes ont survécu à cet accident tandis que 8 ont réussi à se rendre à l'hôpital mais sont décédées des suites de leurs blessures. À l'heure actuelle, il s'agit de l'incident aérien le plus meurtrier au Pays de Galles. "
 air_disaster.4.d:0 "De graves pertes en vies humaines ont eu lieu aujourd'hui à l'aéroport de Los Rodeos. Deux 747, un de KLM et un de Pan American, se sont écrasés dans le brouillard alors qu'ils tentaient de décoller. Après avoir été détourné en raison d'un attentat terroriste à l'aéroport de Gran Canaria, la congestion à Los Rodeos a conduit à l'accident au cours duquel 583 personnes ont perdu la vie. 61 personnes ont survécu à l'incident et elles étaient toutes assises à bord de l'avion Pan American. Il s'agit de l'incident aérien le plus meurtrier au monde."
 air_disaster.5.d:0 "Une tragédie frappe le monde du Rock and Roll. Au cours de la tournée Winter Dance Party de Buddy Holly, Ritchie Valens et J. P. \"The Big Bopper\" Richardson, leur V-Tail Bonanza affrété par Beechcraft a disparu dans la neige entourant l'aéroport municipal de Mason City et a été rapidement retrouvé en train de fumer dans un champ de maïs à 9h35 à moins de six miles de l'aéroport. Ce jour, le 3 février 1959, sera, comme certains le disent, le jour où la musique est morte."
 air_disaster.6.d:0 "\nSuite au crash d'un DC-10 d'American Airlines à l'aéroport international O'Hare, la Federal Aviation Administration, sous la direction de Langhorne Bond, a déclaré que ce soir, le 6 juillet 1979, tous les DC-10 basés aux États-Unis, au nombre de 138, ainsi que tous les DC-10 en provenance de pays ayant des accords bilatéraux avec les États-Unis seraient cloués au sol. Tous les DC-10 sont également interdits de voler dans l'espace aérien américain, à l'exception des transporteurs étrangers qui ramènent leurs DC-10 à leurs bases de maintenance."
 
 Thai_Focus_1_desc:0 "\nAvec l'administration de Plaek Phibunsongkhram, un nationaliste, il n'a pas fallu longtemps pour que la nation soit renommée Siam. La Thaïlande est une nation composée de nombreuses ethnies et cultures et le changement est né du désir du leader nationaliste de moderniser la Thaïlande et d'une campagne d'occidentalisation, qui comprenait des vêtements de style occidental, un nouvel hymne national, un nouveau drapeau et un calendrier occidental. Cela englobait également le changement du nom de Siam en Thaïlande ; comme un geste qui symbolise l'unité de tous les peuples de langue Tai, y compris les Laotiens et les Shan, mais à l'exclusion des Chinois ; le slogan de la campagne était « La Thaïlande pour les Thaïlandais ». Après que Phibunsongkhram ait été chassé du pouvoir au milieu des années 1940, Seni Pramoj l'a rebaptisé Siam, comme symbole de la fin du régime nationaliste, mais lorsque Plaek est arrivé au pouvoir en 1949, il a de nouveau été rebaptisé Thaïlande."
 Thai_Focus_2_desc:0 "Des nouvelles urgentes sont apparues, il semble que des officiers de la marine royale thaïlandaise aient capturé le Premier ministre Plaek Phibunsongkhram et l'ont retenu en otage lors d'une cérémonie de remise du bateau dragueur américain « Manhattan » et l'ont emmené à bord du navire amiral de la marine HTMS « Sri Ayudhya ». Le navire a commencé à se diriger vers le département des munitions navales à Bang Na, mais les putschistes n'ont pas réussi à obtenir l'ouverture du pont commémoratif et le navire amiral n'a pas pu poursuivre sa route. Un combat s'est rapidement ensuivi et les unités navales qui se sont rangées du côté des rebelles ont été submergées par la police, l'armée et les forces aériennes, qui étaient et sont fidèles au gouvernement thaïlandais. Le navire a été coulé alors que Phibun était toujours à bord et a dû nager jusqu'à terre avec les marins. La lutte contre les conspirateurs a entraîné la mort de 17 militaires, huit policiers et 103 civils ; plus de 500 personnes ont été blessées et le coup d'État a été déclaré un échec."
 Thai_Focus_3_desc:0 "Après la défaite de la tentative de coup d'État de la Marine contre le gouvernement de Phibunsongkhram, le Coup Group dirigé par l'armée, une clique de quarante officiers subalternes de l'armée qui ont été contraints à la retraite par Pridi Phanomyong, un Premier ministre thaïlandais, a commencé des manoeuvres politiques pour établir un cabinet militaire plus large. À la suite de la tentative de coup d'État de la marine, une bataille politique s'est ensuivie entre les dirigeants civils et militaires pour les postes au sein du gouvernement et le groupe putschiste a tenté de persuader le roi d'autoriser davantage de voix militaires dans les élections et davantage de fonctionnaires militaires du gouvernement, ce qui ne s'est pas avéré fructueux - quelque chose que le groupe putschiste a ensuite ignoré alors qu'il tentait de prendre sa décision, étant dissuadé uniquement par Phibunsongkhram, qui était personnellement pressé par le groupe putschiste, alors que le roi retournait en Thaïlande après un voyage à Lauseanne. Ils ne risquèrent pas une confrontation avec le monarque et c'est pourquoi ils annoncèrent à la radio la dissolution du Parlement, le rétablissement de la constitution de 1932 et la formation d'un gouvernement provisoire. Phibunsongkhram a d'abord refusé, mais a ensuite accepté le coup d'État, revenant au poste de Premier ministre après des négociations."
 Thai_Focus_4_desc:0 "Après la défaite de la tentative de coup d'État de la Marine contre le gouvernement de Phibunsongkhram, le Coup Group dirigé par l'armée, une clique de quarante officiers subalternes de l'armée qui ont été contraints à la retraite par Pridi Phanomyong, un Premier ministre thaïlandais, a commencé des manoeuvres politiques pour établir un cabinet militaire plus large. À la suite de la tentative de coup d'État de la marine, une bataille politique s'est ensuivie entre les dirigeants civils et militaires pour les postes au sein du gouvernement et le groupe putschiste a tenté de persuader le roi d'autoriser davantage de voix militaires dans les élections et davantage de responsables militaires du gouvernement, ce qui ne s'est pas avéré fructueux - quelque chose que le groupe putschiste a ensuite ignoré alors qu'il tentait de prendre sa décision, étant dissuadé uniquement par Phibunsongkhram, qui a subi des pressions du groupe putschiste mais a refusé de bouger, ordonnant l'arrestation de plus de la moitié du groupe tandis que l'autre moitié s'agrandissait. Extrêmement désespéré - le coup d'État est rapidement devenu une croyance marginale lorsque le roi de Thaïlande est rentré chez lui après un voyage à Lauseanne, où les officiers restants se sont rendus, où ils ont été arrêtés puis purgés de tout poste dans l'armée thaïlandaise. Il semble que le coup d'État ait échoué."
 Thai_Focus_5_desc:0 "Un ultimatum a été lancé aujourd'hui au gouvernement de Plaek Phibunsongkhram, exigeant sa démission, signé par cinquante-huit officiers de l'armée et dirigé par Sarit Thanarat, un général thaïlandais qui a gagné en popularité ces dernières années en raison de la mauvaise gestion du gouvernement de Phibunsongkhram. Bientôt, il y a eu un rassemblement public pour protester contre le gouvernement de Phibun. La foule a marché jusqu'à la résidence de Sarit pour montrer son soutien aux exigences de l'armée ; il y a eu des rapports selon lesquels Sarit et son armée ont déjà commencé le coup d'État, capturant avec succès des points stratégiques sans résistance, Phibunsongkhram est introuvable, fuyant très probablement le pays après ce qui s'est passé, le coup d'État contre Phibun et son gouvernement inefficace a été réussi."