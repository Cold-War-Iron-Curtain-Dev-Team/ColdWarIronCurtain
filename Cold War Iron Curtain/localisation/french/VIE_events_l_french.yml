l_french:
 # === Kingdom of Humanity ===
 HUM.1.t: "Southwark organise son premier référendum"
 HUM.1.d: "Notre grand Royaume de l'humanité a été témoin de notre premier référendum politique majeur, déclenché par le mouvement républicain grandissant dirigé par Christopher Schroeder. Ce mouvement appelait à l'établissement d'une république moderne, arguant qu'elle répondrait à la vision originale du fondateur de notre royaume, le capitaine James Georges Meads, qui rêvait d'une nation artificielle ouverte à toutes les races et à tous les peuples du monde entier. Schroeder et ses partisans ont défié notre monarchie bienveillante actuelle de la dynastie Meads, en plaidant pour un système démocratique plus inclusif. Le référendum a déclenché des débats dans tout le Royaume sur notre orientation future et notre identité culturelle."

 HUM.2.t: "Des réfugiés vietnamiens repérés"
 HUM.2.d: "Au milieu de l'escalade de la violence de la guerre d'Indochine, un groupe de pêcheurs vietnamiens a cherché refuge dans l'archipel Maroc-Songhrati, demandant l'asile au roi Morton Ier du Royaume de l'Humanité. Fuyant les dangers du conflit, ces pêcheurs ont fait appel au roi pour obtenir protection et possibilité de repartir à zéro dans les îles paisibles. Ému par leur sort, le roi Morton Ier a examiné leur demande, reconnaissant le besoin humanitaire et le potentiel d'intégration des réfugiés dans la très petite population du Royaume. L'événement a mis en évidence le rôle croissant de l'archipel en tant que sanctuaire au milieu des troubles régionaux."

 VIE_Humanity.1.t: "Reconnaissance de la « souveraineté » du Maroc"
 VIE_Humanity.1.d: "Au milieu des changements géopolitiques complexes en Asie du Sud-Est, notre glorieux leader Bao-Dai, a cherché à affirmer notre influence dans la mer de Chine méridionale, reconnaissant l'importance stratégique des alliances et du soutien de toute présence établie dans la région, a décidé de reconnaître le Royaume de Morac-Songhrati-Meads, également connu sous le nom de Royaume de l'Humanité. Cela a été officialisé lors d'une petite cérémonie à Saigon en présence du roi Morton Ier et d'un diplomate vietnamien.\n\nLa reconnaissance par notre Etat a conféré au Royaume de Morac-Songhrati-Meads un semblant de légitimité sur la scène internationale. Cependant, cette reconnaissance n'a guère modifié le contrôle pratique des îles, car diverses autres nations continuaient de se disputer le territoire."

 VIE_Humanity.2.d: "Au milieu des changements géopolitiques complexes en Asie du Sud-Est, le gouvernement vietnamien et son chef Bao-Dai ont reconnu la souveraineté et les revendications légitimes de notre grand royaume de l'humanité et notre juste cause d'unifier toute l'humanité sous les règles éclairées de la dynastie Meads.\n\nUne petite cérémonie a été organisée à Saigon en présence de notre sage roi Morton Ier et du gouvernement vietnamien. La reconnaissance par l'État vietnamien a conféré à notre royaume une légitimité et un prestige sur la scène internationale dont nous avons sûrement besoin pour lutter contre d'autres colonisateurs étrangers !"

 VIE_Humanity.3.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Dans une démarche diplomatique surprenante mais surréaliste, le gouvernement vietnamien, dirigé par l'empereur Bao-Dai, a officiellement reconnu la souveraineté du Royaume du Maroc-Songhrati-Meads, également connu sous le nom de Royaume de l'Humanité, une micronation revendiquant la colonisation des îles Spratly, longtemps contestées. La cérémonie, qui s'est tenue à Saigon, a vu la participation du roi Morton I de la dynastie Meads et de responsables vietnamiens.\n\nCette reconnaissance confère au Royaume de l'Humanité un certain degré de légitimité internationale, renforçant ses revendications et ses efforts contre les autres colonisateurs étrangers de la région. L'événement souligne les changements géopolitiques complexes en Asie du Sud-Est, alors que le Vietnam cherche à s'orienter et à affirmer son influence au milieu de revendications territoriales concurrentes."

 VIE_Humanity.4.d: "Dans une tournure décourageante des événements, notre roi Morton F. Meads et le Royaume de l'humanité ont été rejetés par le gouvernement du Vietnam, qui a refusé de reconnaître notre souveraineté légitime. Saigon a cité que notre nation manquait de « liens historiques ou culturels » et nous a qualifié de « riches colonisateurs blancs d'îlots éloignés et inhabitables ». Bien que déçu, le Royaume garde espoir, considérant cela comme un revers temporaire. Notre King Meads et notre peuple poursuivent notre quête de reconnaissance, déterminés à bâtir un héritage et à établir notre propre souveraineté sur la scène mondiale, sans se laisser décourager par ce refus initial."

 PHI_Humanity.1.t: "Le « Royaume de l'humanité » demande la reconnaissance de notre gouvernement"
 PHI_Humanity.1.d: "Dans une démarche diplomatique audacieuse, la micronation « Royaume de l'humanité » et son « roi » Morton Meads ont officiellement envoyé une lettre à notre président, demandant leur reconnaissance en tant que nation souveraine. En échange de cette reconnaissance, le Royaume a proposé de reconnaître notre contrôle sur les réserves pétrolières dans la région contestée de la ZEE de la mer de Chine méridionale. Cette offre marque la dernière tentative de leur « Royaume » de s'établir comme un pays légitime, tout en résolvant les différends régionaux en cours concernant des ressources précieuses."

 PHI_Humanity.2.t: "Les Philippines reconnaissent notre pays"
 PHI_Humanity.2.d: "Dans le cadre d'une percée diplomatique monumentale, notre Royaume de l'humanité, dirigé par notre roi Morton Meads, est ravi d'avoir reçu la reconnaissance officielle de la République des Philippines. Considérée pendant des années comme une micronation, cette reconnaissance élève notre petite nation à un statut souverain sur la scène mondiale. L'accord, dans lequel notre Royaume reconnaît le contrôle des Philippins sur les champs pétroliers contestés dans la ZEE de la mer de Chine méridionale, a été salué comme une victoire par le roi Meads. Notre Royaume est désormais fier de sa souveraineté formellement reconnue par une véritable entité souveraine !"

 PHI_Humanity.3.t: "Les Philippines ont refusé de nous reconnaître !"
 PHI_Humanity.3.d: "Dans une tournure décourageante des événements, notre roi Morton F. Meads et le Royaume de l'humanité ont été rejetés par le président des Philippines, qui a refusé de reconnaître notre souveraineté légitime. Manille a souligné que notre nation manquait de « liens historiques ou culturels » et nous qualifiait de « riches colonisateurs blancs d'îlots éloignés et inhabitables ». Bien que déçu, le Royaume garde espoir, considérant cela comme un revers temporaire. Notre King Meads et notre peuple poursuivent notre quête de reconnaissance, déterminés à bâtir un héritage et à établir notre propre souveraineté sur la scène mondiale, sans se laisser décourager par ce refus initial."

 BRU_Humanity.1.t: "Les colons illégaux demandent la reconnaissance du sultan"
 BRU_Humanity.1.d: "Dans une démarche diplomatique audacieuse, Morton Meads, de la micronation non reconnue « Royaume de l'humanité » basée dans quelques atolls occupés de l'archipel Spartly, a contacté le sultan de Brunei, offrant la reconnaissance de notre contrôle légitime sur les champs pétroliers contestés dans la zone économique exclusive (ZEE) contestée de la mer de Chine méridionale. En retour, Meads demande à notre sultan la reconnaissance formelle de leur micronation. La proposition vise à régler le différend maritime de longue date et à renforcer les liens entre les deux nations, tout en garantissant notre influence sur les gisements pétroliers lucratifs. Les négociations devraient se dérouler sous un examen minutieux régional et international."

 BRU_Humanity.2.t: "Brunei reconnaît notre pays"
 BRU_Humanity.2.d: "Dans le cadre d'une percée diplomatique monumentale, notre Royaume de l'humanité, dirigé par notre roi Morton Meads, est ravi après avoir reçu la reconnaissance formelle du sultan de Brunei. Considérée pendant des années comme une micronation, cette reconnaissance élève notre petite nation à un statut souverain sur la scène mondiale. L'accord, dans lequel notre Royaume reconnaît le contrôle du Brunei sur les champs pétroliers contestés dans la ZEE de la mer de Chine méridionale, a été salué comme une victoire par le roi Meads. Notre Royaume est désormais fier de sa souveraineté formellement reconnue par une véritable entité souveraine !"

 BRU_Humanity.3.t: "Brunei a refusé de nous reconnaître !"
 BRU_Humanity.3.d: "Dans une tournure décourageante des événements, notre roi Morton F. Meads et le Royaume de l'humanité ont été rejetés par le sultan de Brunei, qui a refusé de reconnaître notre souveraineté légitime. Brunei a souligné que notre nation manquait de « liens historiques ou culturels » tout en nous qualifiant de « simples vagabonds essayant de s'emparer d'îlots isolés et inhabitables ». Bien que déçu, le Royaume garde espoir, considérant cela comme un revers temporaire. Notre King Meads et notre peuple poursuivent notre quête de reconnaissance, déterminés à bâtir un héritage et à établir notre propre souveraineté sur la scène mondiale, sans se laisser décourager par ce refus initial."

 # === Phu Dai Army - 1950s Events ===
 PQC_1950s.0.d: "Il y a quelques jours, le Traité Sima sino-français a été négocié et signé entre He Zhuben, chef d'état-major du général Hoang Kiet de la République de Chine, et le chef d'état-major des forces coloniales françaises au Vietnam.\n\nLe traité stipulait le processus d'évacuation des troupes nationalistes chinoises de Chine via le Vietnam et la ville de Haïphong, où elles rendraient leurs armes aux autorités françaises ; qui sera chargé de les restituer au Gouvernement de la République de Chine. Conformément à l'accord, les groupes seront composés de 500 personnes chacun, la priorité étant donnée aux femmes et aux enfants en fuite.\n\nCependant, la ferme condamnation de Zhou Enlai, Premier ministre de la République populaire de Chine, a amené les autorités coloniales françaises à reconsidérer leur accord, après que les forces de Hoang étaient déjà entrées au Vietnam. Pendant un temps, l'armée de Phu Dai, comme on l'appelle, a été internée dans des camps autour de Haïphong, avant que les autorités françaises ne les transportent sur l'île de Phu Quoc, une île largement sous-développée sous contrôle du Vietnam, où leur sort est incertain."

 PQC_1950s.1.d: "CONFIDENTIEL\n[GetDateText]\n\nOBJET : Rapport de situation de la Force Futai (Phu Dai)\n\nGénéralissime,\n\nLe ministère de la Défense nationale a attiré l'attention sur le fait que les forces nationalistes sont piégées sur l'île vietnamienne peu développée de Fuguo, également connue sous le nom d'île de Phu Quoc. À la suite d'un accord avorté entre notre gouvernement et les forces coloniales françaises en Indochine, une armée sous le commandement du général Huang Jie y réside actuellement, après avoir été internée à Haïphong puis exilée sur l'île.\n\nLe général Huang nous a contactés dans l'espoir de recevoir le soutien du gouvernement. Il est peut-être dans notre intérêt de les soutenir et de fournir davantage d'armes aux forces de Huang, car leur emplacement à Phu Quoc constitue un avantage stratégique pour notre frappe pleine d'espoir contre les forces communistes traîtres sur le continent.\n\nVotre réponse à cette mise à jour serait grandement appréciée."

 PQC_1950s.2.d: "Notre gouvernement a appris que les troupes nationalistes chinoises du général Hoang Kiet, également connues sous le nom d'armée de Phu Dai, ont abandonné l'île de Phu Quoc où elles étaient stationnées après l'abandon du traité sino-français Sima.\n\nSelon certaines informations, l'armée de Phu Dai a été rapatriée à Taiwan, où elle sera réintégrée dans le Corps des Marines de la République de Chine. C'est un casse-tête de moins auquel notre gouvernement doit faire face alors que nous traitons de questions plus urgentes chez nous."

 PQC_1950s.3.d: "Selon des rapports internes et externes, le Viet Nam Quoc Dan Dang, connu sous le nom de VNQDD ou simplement Viet Quoc, a fondé une république sur l'île de Phu Quoc, au large de notre côte sud.\n\nBénéficiant de l'aide des troupes nationalistes chinoises, connues sous le nom d'Armée Phu Dai, stationnées là-bas, le VNQDD adhère à la même idéologie que les nationalistes chinois ; principalement les Trois principes du peuple développés par Sun Yat-Sen.\n\nOn ne sait pas exactement comment notre gouvernement devrait réagir immédiatement, mais il s'agit d'un problème grave qui doit être traité avec le plus grand soin et la plus grande rapidité."

 PQC_1950s.4.d: "Selon des informations provenant de toute la région, le nationaliste Viet Nam Quoc Dan Dang, VNQDD ou Viet Quoc, a fondé une république sur l'île de Phu Quoc, au large des côtes du Sud-Vietnam.\n\nBénéficiant apparemment de l'aide des troupes nationalistes chinoises, connues sous le nom d'Armée Phu Dai, stationnées là-bas, le VNQDD adhère à la même idéologie du Kuomintang que les Taiwanais ; connu sous le nom de Trois Principes du Peuple ou Tridémisme.\n\nÀ l'heure actuelle, on ne sait pas exactement comment notre gouvernement devrait réagir, mais il semble que le VNQDD reste diamétralement opposé au communisme, étant entré en conflit avec son prédécesseur, le Parti communiste indochinois, dans les années précédant la Seconde Guerre mondiale. Nous devons observer et réagir à la situation avec l'attitude appropriée et la rapidité requise."

 PQC_1950s.5.d: "Une dépêche est arrivée de notre ambassade à Saigon indiquant que l'île de Phu Quoc, sur la côte du Sud-Vietnam, s'est déclarée république séparatiste sous la direction du VNQDD, un parti nationaliste chinois et vietnamien aligné sur les nationalistes. Bénéficiant prétendument du soutien des troupes nationalistes qui ont fui vers l'île après la guerre civile chinoise, la République du Vietnam, comme elle s'appelle elle-même, demande aux États-Unis de la reconnaître comme État souverain.\n\nNotre ambassadeur et notre personnel diplomatique à Saigon signalent la prudence ; cette « République » semble avoir été une surprise pour les responsables nord-vietnamiens et sud-vietnamiens. La reconnaissance de cet état peut avoir un coût, mais légitimera également un effort nationaliste renouvelé, ainsi que la propagation du tridémisme dans toute l'Asie du Sud."

 PQC_1950s.6.d: "De bonnes nouvelles sont arrivées de Washington et de Saigon puisque l'ambassadeur américain confirme que notre République a été reconnue par les États-Unis comme un État souverain. Les Américains, parmi les premiers à reconnaître notre gouvernement, ont changé d'allégeance, reconnaissant auparavant le gouvernement sud-vietnamien au nord comme le gouvernement vietnamien légitime.\n\nIl s'agit d'une victoire majeure non seulement pour nos affaires étrangères, mais aussi pour nos affaires intérieures. Désormais, grâce à la reconnaissance des États-Unis, nous pouvons bénéficier de nombreux avantages et notre nation continuera de croître !"

 PQC_1950s.7.d: "Malheureusement, l'ambassadeur américain à Saigon a fait savoir que le Département d'État américain avait rejeté une demande de reconnaissance de notre gouvernement. Il semble que les Américains continuent de reconnaître le gouvernement vietnamien à Saigon, par opposition à notre gouvernement du VNQDD, et que toutes les tentatives visant à devenir amis avec les États-Unis ont été repoussées."

 PQC_1950s.8.d: "Le choc a résonné aujourd'hui dans le monde entier lorsque les États-Unis ont annoncé la reconnaissance de la République du Vietnam dirigée par le VNQDD comme gouvernement vietnamien légitime dans la région.\n\nSoutenant à l'origine le gouvernement vietnamien basé à Saigon, les Américains ont changé d'avis en faveur du gouvernement du VNQDD, composé principalement de nationalistes vietnamiens et de soldats nationalistes chinois, basé sur l'île de Phu Quoc, au large des côtes sud du Vietnam. Prochement aligné sur le Kuomintang en termes d'idéologie et de relations géopolitiques, le VNQDD apparaît comme le nouveau concurrent dans la situation géopolitique entourant l'Indochine."

 # === South Vietnam - 1950s Events ===

 # -- Country Events --

 # Mechanics
 VIE_Mechanics.1.t: "Nos nouveaux territoires"
 VIE_Mechanics.1.d: "Malgré la récente unification de l'Annam et de la Cochinchine sous un seul gouvernement, de nombreuses régions restent confrontées à des troubles provoqués par les cellules Viet-Minh à travers les provinces. En tant que dirigeant du Vietnam, il est de notre devoir de maintenir l'ordre et d'apaiser la population par des moyens militaires et diplomatiques. Si nous ne pacifions pas les provinces du Vietnam, davantage de cellules Viet-Minh se soulèveront contre nous."
 VIE_Mechanics.1.a: "Pièce par pièce, nous unirons notre nation sous [GetVIEChiefOfState]"

 VIE_Mechanics.2.t: "La question de la secte"
 VIE_Mechanics.2.d: "La Cochinchine répond au Gouvernement Central sur la carte. En dehors de Saigon, elle répond à cinq hommes, et chacun d'eux a des soldats, des revenus et une province.\n\nHuynh Cong-Bo détient le pays Hoa-Hao. Pham Cong-Tac retient avec lui Tay-Ninh et le Cao-Dai. Jean Leroy possède le delta catholique à travers l'UMDC. Thich Hoa-Binh dirige les Harmonistes. Et Le Van-Vien et le Binh-Xuyen détiennent les accès à la capitale, le trafic fluvial et beaucoup de choses qui se passent à l'intérieur même de Saigon.\n\nAucun gouvernement vietnamien n'a jamais gouverné le Sud sans s'entendre avec eux ou sans les briser, et il n'y a pas de troisième voie. Nous pouvons les faire venir - leur offrir leur grade, leur budget et leur statut, et accepter que notre armée contienne des armées. Ou nous pouvons prendre leurs armes et découvrir combien des cinq sont prêts à se battre pour nous."
 VIE_Mechanics.2.a: "L'unité de notre nation se résume à cela."

 # Political

 # Elysee Accords
 Elysee_Accords.1.t: "Les accords de l'Élysée"
 Elysee_Accords.1.d: "À l'Elysée, dans le lointain pays de France, un accord historique a été conclu qui changera à jamais l'avenir de millions de citoyens vivant sur notre territoire. Notre jeune nation, reconnue internationalement sous le nom d'État du Vietnam, se verra accorder une plus grande indépendance vis-à-vis de la France dans le cadre du système multicontinental de l'Union française, une réalisation capitale qui constitue le point culminant de mois de travail acharné de notre chef d'État Bao-Dai. Les Accords de l'Élysée vont désormais être soumis à l'Assemblée nationale française, pour être officiellement ratifiés et signés par le président français.\n\nLes accords prévoyaient que le Vietnam pouvait désormais mener ses propres affaires étrangères, contrôler ses finances et disposer d'une armée. Plus précisément, nous avons obtenu le droit de nommer des diplomates en Chine, en Thaïlande et dans la Cité du Vatican, mais le reste de notre politique étrangère restera sous la direction française. Certains diront peut-être que cela ne suffit pas à garantir une indépendance totale, mais le fait est que c'était le mieux que nous pouvions obtenir, surtout dans des temps aussi turbulents où repousser nos bienfaiteurs français serait un suicide complet."
 Elysee_Accords.1.a: "Lentement et régulièrement, il remporte la course."

 Elysee_Accords.2.t: "Le deuxième article des accords de l'Elysée"
 Elysee_Accords.2.d: "Les Accords nous ont donné un fragment d'indépendance, et il convient d'être précis sur la minceur de ce fragment. Nous pouvons nommer des diplomates en République de Chine, en Thaïlande et au Vatican. C'est l'intégralité de notre service extérieur.\n\nDeux des trois sont voisins, ce qui n'est pas rien. Les questions frontalières, les réfugiés et le commerce le long du Mékong peuvent désormais être réglés entre gouvernements plutôt qu'entre administrations coloniales, et un État qui négocie en son propre nom commence à ressembler à un État quel que soit le nom choisi par le Quai d'Orsay.\n\nCe qu'on ne peut pas prétendre, c'est que l'arrangement était généreux. Les Français restent nos bienfaiteurs et, avec le Nord communiste là où il se trouve, notre protection en plus, et il n'existe pas de version des prochaines années dans laquelle nous les repousserons et survivrons à la pression. Un jour viendra peut-être où nous traiterons les grandes puissances sur un pied d'égalité plutôt que comme la pupille de quelqu'un. Ce n'est pas aujourd'hui, et tous ceux qui ont lu le texte le savent."
 Elysee_Accords.2.a: "Ce qu'ils appellent une solution Bao-Dai s'est avérée n'être qu'une solution française."


 # Etat du Vietnam
 Etat_du_Vietnam.1.t: "Une coopérative du Sud-Vietnam"
 Etat_du_Vietnam.1.d: "Bao-Dai a conquis Saigon par la négociation plutôt que par la force. La Cochinchine et l'Annam sont réunies sous un seul gouvernement, et ce gouvernement est le nôtre : l'État du Vietnam, l'État du Viet-Nam, avec le chef de l'État à sa tête.\n\nIl vaut la peine d'être clair sur ce qui a été unifié. Une administration coloniale qui répond à Paris sur toutes les questions qui comptent. Des milices religieuses qui détiennent des provinces et prélèvent leurs propres impôts. Des bandes de bandits dans le delta que personne n'a comptées. Et une insurrection communiste qui parcourt tout le pays, de la frontière chinoise à la mangrove.\n\nLe chef de l'État entend s'appuyer sur cela plutôt que de s'y reposer. Les domaines restants de la Couronne doivent être placés sous le même gouvernement, et chaque province récupérée est un argument qu'il peut présenter à Paris pour une plus grande mesure d'autonomie. Les communistes représentent l'autre moitié du débat, et ils sont la moitié qui ne sera pas réglée à une table de conférence."
 Etat_du_Vietnam.1.a: "Après tout, le Sud-Vietnam est à nouveau uni !"

 Etat_du_Vietnam.2.t: "Un Sud-Vietnam uni"
 Etat_du_Vietnam.2.d: "Bao-Dai entra dans Saigon à la tête de ses soldats, et la Cochinchine fut rattachée à l'Annam sous un seul gouvernement. C'est fait, et on se souvient de la manière de le faire : l'État du Vietnam, l'État du Viet-Nam, a été proclamé sur une ville dans laquelle il a fallu pénétrer plutôt que persuader.\n\nIl vaut la peine d'être clair sur ce qui a été unifié. Une administration coloniale qui répond à Paris sur toutes les questions qui comptent. Des milices religieuses qui détiennent des provinces et prélèvent leurs propres impôts. Des bandes de bandits dans le delta que personne n'a comptées. Et une insurrection communiste qui parcourt tout le pays, de la frontière chinoise à la mangrove.\n\nLe chef de l'État entend continuer. Les domaines restants de la Couronne doivent être placés sous le même gouvernement, et chaque province récupérée est un argument qu'il peut présenter à Paris pour une plus grande mesure d'autonomie. La question de savoir si un État qui a commencé ainsi peut demander à ses provinces autre chose que l'obéissance est une question qui sera posée plus tard."
 Etat_du_Vietnam.2.a: "Après tout, le Sud-Vietnam est à nouveau uni..."

 Etat_du_Vietnam.3.t: "Reconnaître le nouveau régime de Bao-Dai ?"
 Etat_du_Vietnam.3.d: "Bao-Dai a pris la Cochinchine et a proclamé l'État du Vietnam, et la question de la reconnaissance est désormais sur ce bureau plutôt que sur celui de quelqu'un d'autre.\n\nLe reconnaître nous achète des relations diplomatiques avec un gouvernement qui au moins existe, un partenaire anticommuniste dans une région où nous en manquons, et un pied en Indochine qui ne dépend pas entièrement de la demande d'autorisation à Paris. Ce ne sont pas de petites choses.\n\nLes réserves sont tout aussi claires. L'État existe depuis des semaines, son mandat s'arrête là où s'arrêtent les garnisons françaises, et son homme à la tête a une réputation contre laquelle notre propre presse ne sera pas tendre. La reconnaissance est facile à accorder et très difficile à retirer, et quoi que devienne ce gouvernement, nous serons reconnus comme l'ayant soutenu en premier."
 Etat_du_Vietnam.3.a: "Un toast à nos nouveaux alliés anticommunistes !"
 Etat_du_Vietnam.3.b: "Gardons les choses ouvertes pour l'instant."

 Etat_du_Vietnam.4.t: "Bao-Dai nous déclare « communistes démoniaques » !"
 Etat_du_Vietnam.4.d: "Sans surprise, Bao-Dai nous a déclarés « communistes démoniaques » qui doivent être éliminés de la Terre le plus rapidement possible. Nous avons décidé de nous moquer de ses propos, considérant son statut de simple laquais français opprimant le peuple. Nous devons poursuivre notre objectif de libérer une fois pour toutes le Vietnam du Nord au Sud de la puissance impérialiste."
 Etat_du_Vietnam.4.a: "Il obtiendra ce qui lui arrive."

 Etat_du_Vietnam.5.t: "Nguyen-Van-Xuan est élu vice-Premier ministre de l'État du Vietnam"
 Etat_du_Vietnam.5.d: "La Cochinchine et l'Annam sont rejoints sans coup férir, et la première nomination du nouvel Etat devrait dire quelque chose sur la manière dont gouverner. Nguyen-Van-Xuan est le nom devant l'assemblée.\n\nIl dirigeait la Cochinchine et il la dirigeait avec compétence, ce qui est plus que ce qu'on peut dire de la plupart des administrations que ce pays a eues. Élever un homme aussi prestigieux - et le faire par un vote plutôt que par un décret - est le signal le plus clair dont disposent Washington et Londres que l'État du Vietnam a l'intention d'être un gouvernement et non une maison.\n\nIl y a aussi une raison plus froide. Xuan dirigeait la République autonome jusqu'il y a quinze jours et ses fonctionnaires sont toujours ses fonctionnaires. La Cochinchine sera beaucoup plus facile à tenir avec lui à l'intérieur du cabinet qu'à l'extérieur, et tous ceux qui voteront pour lui le comprennent."
 Etat_du_Vietnam.5.a: "Un allié utile."

 Etat_du_Vietnam.6.t: "Bao-Dai reste l'unique Premier ministre de l'État du Vietnam"
 Etat_du_Vietnam.6.d: "La Cochinchine et l'Annam sont rejoints, et aucun deuxième nom n'a été avancé. Bao-Dai occupe lui-même les deux postes jusqu'aux prochaines élections, chaque fois qu'elles sont déclenchées.\n\nCe que cela achète, c'est la cohérence. Il n'y aura pas de querelle de cabinet à propos des communistes, pas de briefing ministériel contre le palais et pas d'ambiguïté à l'étranger quant à savoir qui parle au nom du Vietnam. Un État vieux de quinze jours peut faire bon usage des trois.\n\nLe prix à payer, c'est que tout dépend désormais d'un seul homme, y compris les parties de lui dont parle le pays. Le mode de vie du chef de l'État est évoqué sur tous les marchés de Saigon et imprimé à Hanoï, et un gouvernement sans autre visage à montrer n'a aucun moyen de se séparer de lui. Il devra faire preuve d'une plus grande prudence qu'il n'a jamais eu à l'être auparavant."
 Etat_du_Vietnam.6.a: "Espérons qu'il saura garder les choses sous contrôle."

 # Bao-Dai
 BaoDai.1.t: "Un cadeau à Le-Van-Vien"
 BaoDai.1.d: "Dans une remarquable démonstration de faveur personnelle, le chef de l'État Bao-Dai a choisi de renforcer ses relations avec Le-Van-Vien, le leader influent du Binh-Xuyen. Reconnaissant sa loyauté envers l'État du Vietnam et son rôle croissant dans le maintien de la sécurité autour de Saigon, le chef de l'État a officiellement adopté Bay-Vien comme son frère de sang et lui a conféré le noble titre de baron au sein de la maison royale.\n\nL'annonce a surpris de nombreuses personnes à travers le pays. Pour certains, c'est un honneur extraordinaire pour un homme dont les origines remontent à la pègre turbulente du sud du Vietnam. D'autres considèrent cette décision comme une alliance politique pragmatique, intégrant fermement l'un des dirigeants armés les plus puissants du pays dans le giron national.\n\nEn tant que chef du Binh-Xuyen, commandant de milliers de combattants fidèles et président du Parti du Front populaire (Mat-tran Binh-dan) qui compte près de 10 000 membres, Bay-Vien exerce une influence qui s'étend bien au-delà des rues de Saigon-Cho-Lon. Son soutien offre au jeune État vietnamien une force de sécurité expérimentée et un allié précieux dans une période d'incertitude.\n\nL'amitié entre le chef de l'État Bao-Dai et Bay-Vien s'étend au-delà de la politique. Les deux hommes sont connus pour passer du temps ensemble à Da-Lat, où ils partagent des expéditions de chasse, des sorties de pêche et des soirées à la table de cartes. Leur lien personnel est devenu l'une des relations dont on parle le plus au sein du gouvernement.\n\nQu'elle soit motivée par la loyauté, le respect mutuel ou la nécessité politique, l'élévation du baron Le-Van-Vien marque l'émergence de l'une des figures les plus influentes de l'État vietnamien. Avec la confiance du chef de l'État et la force des Binh-Xuyen derrière lui, la position de Bay-Vien au sein de la nation n'a jamais été aussi forte."
 BaoDai.1.a: "Il est difficile de trouver un bon ami de nos jours."

 BaoDai.2.t: "Da-Lat, la capitale de l'été"
 BaoDai.2.d: "Da-Lat est la ville la plus agréable du Vietnam, et tous ceux qui ont les moyens de s'y rendre le disent. Les Français l'ont construite pour le climat - tempéré là où le reste du pays est tropical - et les brumes qui règnent dans ses vallées toute l'année lui ont valu le nom de Ville du Printemps éternel.\n\nCe qui lui manque, c'est une infrastructure fonctionnelle. L'eau, l'électricité et les routes ont été aménagées pour une station de montagne de quelques centaines de familles coloniales et ont été étendues depuis lors par des travaux de réparation, avec pour résultat que la capitale d'été perd son électricité un peu plus souvent que ce que la famille royale juge acceptable.\n\nL'Empereur a donc décrété une refonte complète : des services modernes partout et actuels dans chaque bâtiment important. Le travail sera beau et coûteux, et il sera exécuté dans une ville où personne ne gouverne rien pendant huit mois de l'année."
 BaoDai.2.a: "La Ville aux Mille Fleurs arrive dans l'ère moderne."

 BaoDai.3.t: "Saigon, Perle de l'Orient"
 BaoDai.3.d: "Saigon était la fierté de l'Indochine française et est la capitale de notre État, et ces deux faits se mélangent mal dans chaque rue. La Perle de l'Orient a été construite pour être vue par des personnes arrivant d'ailleurs.\n\nL'Empereur a déclaré une réforme en profondeur de la ville : le tissu de l'antiquité historique a été ramené à un niveau moderne, et l'ensemble a donné un caractère vietnamien plutôt qu'emprunté. L'intention est qu'un visiteur descendant d'un navire voie une capitale et non une concession coloniale qui a changé de mains.\n\nIl y a un calcul derrière la décoration et les ministères n'ont pas pris la peine de le dissimuler. Les investissements étrangers suivent la confiance, la confiance suit les apparences, et un pays qui demande au monde de prendre son indépendance au sérieux a intérêt à ressembler à un endroit où l'argent serait en sécurité."
 BaoDai.3.a: "La Perle brille toujours autant."

 BaoDai.4.t: "Le Manifeste de Ngo-Dinh-Diem"
 BaoDai.4.d: "Le [?global.date.GetDateStringNoHourLong], un développement important s'est produit lorsque la police secrète française, connue sous le nom de « Xac-Te », a directement contacté notre gouvernement pour délivrer un grave avertissement sur le péril représenté par Ngo-Dinh-Diem, qu'ils ont qualifié de traître. Leurs inquiétudes se concentraient sur le dernier manifeste de Diem, qui venait d'être publié dans nos journaux. Cet article contenait des idées profondément troublantes et radicales, avec l'intention apparente de semer les graines de la rébellion parmi notre population, les incitant à se soulever à la fois contre notre nouveau gouvernement et nos bienfaiteurs français.\n\nLe chef de la sécurité de Xac-Te a souligné qu'une action rapide aurait dû être prise pour retirer Diem de l'équation, soulignant la menace potentielle posée par son mouvement social chrétien. La crainte était que si on le laissait continuer, Diem pourrait infliger davantage de dégâts à la lutte de notre gouvernement contre le spectre envahissant du communisme du Nord et perturber la stabilité fragile que nous cherchions à maintenir.\n\nVoici un extrait du manifeste de Diem, qui met en lumière sa position idéologique :\n\n\"Nous devons reconnaître que notre lutte actuelle s'étend au-delà de la simple indépendance politique de notre patrie. Il s'agit, par essence, d'une RÉVOLUTION SOCIALISTE, visant à assurer la LIBERTÉ aux AGRICULTEURS ET AUX TRAVAILLEURS DU VIETNAM ! Notre objectif ultime est de garantir que chaque individu au Vietnam possède les moyens de production, lui permettant de mener une vie digne. Pour y parvenir, je plaide pour des réformes sociales progressives et audacieuses qui non seulement sauvegarderont notre dignité humaine, mais ouvriront également la voie à une ère de croissance et d'évolution.\"\n\nL'urgence de la situation est indéniable et la nécessité de rectifier le tir est immédiate."
 BaoDai.4.a: "Encore une nuisance."
 BaoDai.4.b: "Une opportunité potentielle..."

 BaoDai.5.t: "Le chef de l'État Bao-Dai ne répond pas au manifeste de Ngo-Dinh-Diem"
 BaoDai.5.d: "Le manifeste de Ngo-Dinh-Diem pour une révolution sociale a fait ce que le palais nous avait assuré qu'il ne ferait pas, et le chef de l'État n'a trouvé aucune réponse en trois semaines de tentatives.\n\nLes revendications sont assez simples pour être criées : un meilleur traitement pour les travailleurs et la fin du favoritisme de nos bienfaiteurs. Une telle simplicité voyage, et elle a traversé une population sans aucun moyen de juger de ce que cela coûterait. Il y a des émeutes dans les quartiers industriels et des grèves dans le port, et les grèves s'étendent maintenant aux villes où pas un homme sur mille n'a lu le manifeste.\n\nOn ne peut pas voir ce gouvernement négocier avec un document qui appelle à sa dissolution. Les Xac-Te et les Canh-Sat Quoc-Gia ont donc été autorisés à rétablir l'ordre par des mesures plus drastiques, et ce que signifie précisément cette phrase sera réglé dans les rues demain matin..."
 BaoDai.5.a: "Tirez-leur dessus !"

 BaoDai.6.t: "Contenir les ambitions de Diem"
 BaoDai.6.d: "Le dernier manifeste de Ngo-Dinh-Diem pour un Vietnam « socialiste » a été largement remarqué et peu soutenu. Cela s'est vendu, cela a été discuté et cela n'a produit aucun mouvement digne de ce nom. Quelle que soit la mesure ordinaire, cela a échoué.\n\nLes Français ne l'ont pas lu selon une mesure ordinaire. Le Haut-Commissariat a conclu qu'un homme capable de rédiger un tel document et de trouver un public pour lui constitue une menace permanente pour la solution Quoc-Gia, et a recommandé que son influence soit neutralisée avant qu'elle n'acquière une organisation. Notre gouvernement a accepté, et nous travaillons tous les deux sur le même dossier.\n\nL'évolution à surveiller se situe de l'autre côté. Le Viet Minh aurait abandonné deux années d'efforts pour lui amener Diem. Il est désormais isolé de toutes les forces organisées du pays, et un homme dans cette position n'a rien à perdre en attendant."
 BaoDai.6.a: "L'horloge tourne..."

 BaoDai.7.t: "Faire face à Diem"
 BaoDai.7.d: "Sous la pression des Français, le chef de l'État Bao-Dai et le gouvernement Quoc-Gia de l'État du Vietnam ont été confrontés à une décision cruciale sur la manière de gérer le défi croissant posé par Ngo-Dinh-Diem. Après des consultations approfondies avec la Cong-an Quoc-Gia (police nationale) et la police secrète de Xac-Te, trois options ont été proposées :\n\nAttendre l'auto-exil de Diem : ce serait l'approche la plus sûre, car la rumeur disait que Diem quitterait bientôt le pays volontairement, neutralisant la menace sans confrontation directe.\n\nArrêter Diem : Diem pourrait être accusé d'activités anti-étatiques et de terrorisme communiste, même si cela risquerait de détériorer les relations avec l'influente famille Ngo-inh, dont les relations politiques étaient encore formidables.\n\nArrêter Ngo-Dinh-Nhu : Cibler le frère cadet de Diem, Nhu, soupçonné de collaboration avec des cellules communistes et syndicalistes et d'incitation à des grèves et des émeutes quotidiennes à Saigon, pourrait faire taire Diem sans confrontation directe, même si cela comporte des risques de réaction publique."
 BaoDai.7.a: "Attendez l'auto-exil de Diem"
 BaoDai.7.b: "Arrêter Diem"
 BaoDai.7.c: "Arrêter Ngo-Dinh-Nhu"

 BaoDai.8.t: "Les partis nationalistes soutiennent Bao-Dai"
 BaoDai.8.d: "Le Viet-Quoc, le Dai-Viet et un certain nombre de petits partis de droite et nationalistes ont convenu de travailler dans le cadre du compromis français. Le but français en proposant cette proposition était de diviser le mouvement anticolonial et de consolider ce qui restait sous la solution Bao-Dai, plus maniable, et personne qui a signé ne se faisait d'illusion sur ce point.\n\nNous l'avons pris malgré tout. Les partis sont entrés dans le Lien-Minh Quoc-Gia, le Front National, et ont placé leurs organisations, leurs journaux et leurs appareils provinciaux derrière la cause Quoc-Gia et derrière le chef de l'Etat.\n\nLe raisonnement est qu'une façade est un endroit où se tenir debout. Le sud doit être unifié contre Hô Chi Minh avant que quoi que ce soit puisse être tenté contre le nord, et un parti extérieur à l'accord conserve ses principes et ne détient aucune province. Ce qui a été concédé en l'acceptant devra être récupéré par la suite, et tout homme qui a signé le sait."
 BaoDai.8.a: "Une autre victoire pour la cause Quoc-Gia"

 BaoDai.9.t: "La grande élection de 1955"
 BaoDai.9.d: "À l'approche du référendum de 1955, les citoyens sud-vietnamiens détermineront pour la première fois l'avenir de la nation. L'élection oppose le Premier ministre Ngo-Dinh-Diem, un leader visionnaire prônant l'indépendance et la réforme, à l'ancien empereur Bao-Dai, qui cherche à maintenir le statu quo et entretient des liens étroits avec la France.\n\nBeaucoup au Sud-Vietnam considèrent Diem comme le leader qui peut enfin libérer le pays de l'influence coloniale. Sa promesse de construire une république selon les principes du personnalisme travailliste - en mettant l'accent sur l'autonomisation de la classe ouvrière, la promotion des idées progressistes et la modernisation de la société - a inspiré l'espoir d'un Vietnam nouveau et indépendant. Pour beaucoup, Diem représente un avenir dans lequel le Vietnam pourra se débrouiller seul, sans ingérence étrangère.\n\nEn revanche, Bao-Dai, qui a abdiqué en 1945 mais continue de détenir le titre de chef de l'Etat, représente l'ordre ancien. Il propose de maintenir en place la monarchie pro-française, estimant que le maintien de ces liens garantira stabilité et aide financière. Pourtant, son leadership distant et son style de vie somptueux à l'étranger ont conduit beaucoup à remettre en question son engagement en faveur du bien-être du pays.\n\nAlors que le Sud-Vietnam reste fracturé - ses campagnes contrôlées par de puissantes sectes religieuses comme Cao-Dai et Hoa-hao, et les rues de Saigon sous l'emprise du syndicat du crime Binh-Xuyen - la population du Sud-Vietnam voit le prochain référendum comme une opportunité de reconquérir l'avenir. Pour certains, Diem est la figure révolutionnaire qui peut unifier la nation, tandis que pour d'autres, les promesses de stabilité de Bao-Dai sont attrayantes mais le vote n'a pas encore été voté..."
 BaoDai.9.a: "Et... Le Premier ministre Diem a gagné avec... 98,9% des voix !"

 BaoDai.10.t: "Le sort des dirigeants du Viet-Minh capturés"
 BaoDai.10.d: "Nos courageux héros de l'Armée nationale vietnamienne de notre gouvernement Quoc-Gia ont capturé plusieurs hauts dirigeants Viet-Minh, suscitant un débat sur leur sort. Alors que le commandement français du CEFEO a demandé leur exécution pour éliminer les futures menaces révolutionnaires, nombre de nos compatriotes ont plutôt plaidé en faveur de la clémence.\n\nNotre Dong-bao a soutenu qu'épargner les captifs montrerait que la cause Quoc-Gia est synonyme d'unité et de réconciliation, visant à rassembler tous les Vietnamiens, quelles que soient leurs divergences politiques, dans la construction d'un avenir commun. Ils croient qu'en choisissant la miséricorde, le Sud-Vietnam peut démontrer son engagement en faveur de la solidarité nationale, au-dessus des divisions de la mauvaise cause communiste."
 BaoDai.10.a: "Mieux vaut mort que rouge."
 BaoDai.10.b: "Peu importe, nous sommes tous des Dong-Bao"

 BaoDai.11.t: "Adieu Bao-Dai !"
 BaoDai.11.d_republic: "Après la défaite de Bao-Dai aux grandes élections de 1955, qui l'a officiellement dépouillé de tous ses titres et pouvoirs, l'ancien chef de l'État Bao-Dai s'est exilé. Le [?global.date.GetDateStringNoHourLong], depuis sa résidence à Paris, Bao-Dai a tenté de limoger le Premier ministre Ngo-Dinh-Diem, accusant notre Premier ministre de créer un État policier et de diriger une dictature personnaliste de gauche oppressive. Cependant, cette décision n'a réussi à rassembler aucun soutien populaire, à l'exception de groupes réactionnaires de niche, consolidant ainsi sa sortie du pouvoir.\n\nBao-Dai a depuis déménagé à Cannes puis en Alsace, où il mène une vie tranquille en exil, nouant des amitiés avec des personnalités influentes comme Jean de Beaumont, ancien membre du parlement cochinchinois. Son règne autrefois grandiose semble désormais n'être qu'un lointain souvenir alors que le Sud-Vietnam avance sous la direction de Diem."
 BaoDai.11.d_throne: "Bao-Dai est parti pour la France. Il n'a pas perdu une élection, parce que celle qui a été déclenchée ne l'a pas destitué, et il ne s'exile pas, parce que personne ne lui a dit qu'il ne pouvait pas revenir. Il est simplement monté à bord d'un avion, comme il l'a fait chaque année de son règne, et le gouvernement de Saigon a continué sans lui exactement comme il le fait lorsqu'il est à Dalat.\n\nL'État du Vietnam reste ce qu'il était. Il y a toujours un chef d'État, toujours un premier ministre qui sert à son gré, et toujours un arrangement permanent par lequel le second peut être remplacé par télégramme chaque fois que le premier le trouve incommode. Les hommes autour du palais comptent déjà qui sera le prochain.\n\nIl a pris une chambre à Cannes. Qu'il s'agisse de vacances ou d'un départ à la retraite est une question à laquelle personne à Saigon n'est en mesure de répondre, et plusieurs d'entre eux préféreraient ne pas le faire."
 BaoDai.11.d_junta: "Bao-Dai est parti pour la France et le gouvernement qu'il a quitté n'est plus celui qu'il a nommé. Le général Nguyen-Van-Hinh détient Saigon, les ministères répondent aux officiers qui les ont pris, et le trône qu'il occupe encore nominalement est devenu un papier à en-tête.\n\nIl n'y a eu ni référendum ni déposition. Il n'était pas nécessaire qu'il y en ait un. Un chef d'État dont l'armée a cessé de le consulter a déjà été démis de ses fonctions dans tous les sens importants, et la formalité peut attendre que quelqu'un à Paris décide que la paperasse en vaut la peine.\n\nIl a pris une chambre à Cannes. Les généraux ne lui ont pas demandé de revenir et il ne l'a pas proposé."
 BaoDai.11.a: "Un essayage se termine pour un playboy"

 BaoDai.12.t: "L'exil de Bao-Dai"
 BaoDai.12.d: "Bao-Dai est à court de soutien dans chaque trimestre qui aurait pu le retenir. Le peuple est parti le premier, la classe politique vietnamienne a suivi, et les Français ont cessé de le défendre quelques mois avant de l'admettre.\n\nSes fidèles s'amenuisent un peu plus chaque semaine dans les ministères et dans l'état-major - discrètement, par des transferts et des départs à la retraite plutôt que par des licenciements. Il n'y a pas de purge car aucune purge n'est nécessaire. Un homme dont les personnes nommées sont révoquées une à une ne peut pas gouverner longtemps et ne peut finalement pas rester.\n\nIl a été vu pour la dernière fois à Paris et ne reviendra pas. Le dernier empereur des Nguyen, le premier chef d'État de ce pays et le premier d'entre eux à terminer ses jours dans un appartement français. Le compte rendu se lira ainsi, quoi qu'on en dise ici."
 BaoDai.12.a: "Au revoir Bao-Dai."

 BaoDai.13.t: "Le style de vie imprudent du prince Bao-Long"
 BaoDai.13.d: "Paris, [?global.date.GetDateStringNoHourLong] - Le prince Nguyen-Phuc Bao-Long, fils du chef de l'État du Vietnam, a acquis dans cette ville une réputation que sa mère a mis deux ans à ne pas contenir. Le goût des voitures rapides et des compagnies chères est précisément celui de son père, et il a bien moins de raisons que son père d'être discret à ce sujet.\n\nPour son anniversaire, le chef de l'État lui a offert une Jaguar VII. Le prince l'a échangé en une semaine contre la nouvelle XK 120, au motif que la XK 120 est la première voiture de série à dépasser les deux cents kilomètres par heure et que la machine est désormais parfaitement connue de la police parisienne.\n\nNotre propre gouvernement a délivré au jeune prince un permis spécial pour la conduire. Ce détail est parvenu aux journaux de Saigon, dans un pays où les routes à l'extérieur de la capitale sont en latérite et où la guerre se déroule le long de celles-ci."
 BaoDai.13.a: "Peut-on lui retirer son permis ?"

 BaoDai.14.t: "Activités récentes de Diem au Japon et aux États-Unis."
 BaoDai.14.d: "Après le récent auto-exil, nos bienfaiteurs français ont informé notre gouvernement des récentes activités de Ngo-Dinh-Diem à l'étranger : lors d'une rencontre au Japon avec le général Douglas MacArthur, Diem, accompagné de son frère Mgr Ngo Dinh Thuc, a reçu une réponse tiède. MacArthur a montré peu d'intérêt pour les appels de Diem au soutien des États-Unis pour libérer le Vietnam du contrôle français, se concentrant plutôt sur le Japon d'après-guerre.\n\nSuite à cela, Diem s'est rendu aux États-Unis, rencontrant des responsables du Département d'État américain sur les conseils du professeur de politique Wesley Fishel. Cependant, sa présentation n'a pas réussi à impressionner les décideurs américains. Un responsable du Département d'État américain a noté que Diem semblait plus préoccupé par ses ambitions personnelles que par la résolution des problèmes complexes du Vietnam. Les États-Unis ne sont toujours pas convaincus de son leadership, laissant Diem sans le soutien qu'il recherchait."
 BaoDai.14.a: "Personne ne prendra au sérieux ses idées pseudo-communistes"

 BaoDai.15.t: "Les affaires personnelles de l'empereur"
 BaoDai.15.d: "Les efforts récents du gouvernement pour gérer les affaires personnelles de l'empereur ont été gérés discrètement par divers canaux. Des fonds ont été alloués pour régler les dettes impayées et résoudre diverses questions personnelles qui suscitaient des inquiétudes. Grâce à une gestion financière prudente et à des négociations discrètes, ces problèmes ont été résolus sans attirer l'attention du public.\n\nCette résolution discrète a contribué à maintenir la stabilité de l'administration et à empêcher que les retombées politiques potentielles de ces affaires personnelles ne soient rendues publiques."
 BaoDai.15.a: "Les affaires personnelles de l'Empereur ne regardent que lui"

 BaoDai.16.t.a: "Le Prince est mort"
 BaoDai.16.t.b: "Mort d'un prince exilé"

 BaoDai.16.d.a: "Le télégramme est parvenu au gouvernement et au chef de l'État de la famille Ando, qui a adopté Cuong-De au Japon et l'y a enterré. Le prince est décédé à l'université médicale Nihon de Tokyo d'un cancer du poumon qui n'a pas été diagnostiqué pendant des années et qui l'a tué en un mois.\n\nL'Ando a transmis ses dernières paroles par le télégramme : \"Phai dung lai Chien-cuoc nay...\" - nous devons arrêter cette guerre, la transmettre à notre peuple. Il a demandé qu'elle atteigne aussi bien Bao-Dai à Saigon qu'Hô Chi Minh à Hanoï, que le Vietnam soit réunifié contre l'impérialisme occidental et que cette guerre fraternelle prenne fin.\n\nIl était en exil depuis 1906 et n'est jamais revenu au pays. Pendant un demi-siècle, il a été l'alternative avec laquelle tout gouvernement vietnamien devait compter, et les hommes qui l'ont soutenu ne cesseront pas d'exister parce qu'il l'a fait. Le palais n'a pas dit ce qu'il comptait faire concernant les funérailles ou le corps, et chaque heure il dit que rien n'est compté."
 BaoDai.16.d.b: "L'hôpital de la Nippon Medical School a appris que le prince vietnamien Cuong-De est mort d'un cancer du poumon. Il fut notre hôte pendant quarante-cinq ans et on dit qu'il refusa le traitement qui lui était proposé, considérant la maladie comme le châtiment dû à un homme qui ne pouvait pas prendre les rênes de son propre pays.\n\nLa réponse de notre gouvernement a été brève et correcte. Aucune démarche n'est venue de Saigon concernant le retour du corps, et aucune n'a été sollicitée de ce côté.\n\nIl y a ici des comptes à rendre que personne au ministère ne se soucie de faire valoir à haute voix. Il a été amené dans ce pays comme un espoir, utilisé comme un instrument, et conservé après que l'instrument n'était plus utile. Il a survécu à la guerre, à l'empire qui l'a combattu et à toutes les promesses qui lui ont été faites au cours des deux."

 BaoDai.16.a: "Repose en paix, nous atteindrons bientôt la victoire finale !"
 BaoDai.16.b: "Votre vie d'honneur a été éclipsée par une alliance avec les perdants et se termine dans l'obscurité."

 # Hoang Lien Revolt
 HoangLienRevolt.1.t: "Révolte à Hoang Lien Son"
 HoangLienRevolt.1.d: "Quelques semaines après que nos forces ont pris le contrôle des territoires du nord, des rapports inquiétants ont émergé de la province de Hoang Lien Son. Des éléments procommunistes et des travailleurs mécontents, enhardis par les récents bouleversements politiques, ont lancé un soulèvement coordonné contre notre administration.\n\nLes ouvriers d'usine, les paysans et les restes du Viet Minh sont descendus dans la rue, organisant des grèves et des manifestations qui ont rapidement dégénéré en rébellion ouverte. Les autorités locales rapportent que des agitateurs communistes diffusent de la propagande parmi la population, exploitant les griefs économiques et le sentiment nationaliste pour retourner la population contre notre gouvernement.\n\nLa situation s'est rapidement détériorée. La résistance à notre régime a considérablement augmenté, et le respect de cette règle s'est effondré à mesure que la population devient de plus en plus hostile. Nos garnisons dans la région luttent pour maintenir l'ordre et la province est devenue un foyer d'activités antigouvernementales. Si rien n'est fait, cette révolte pourrait s'étendre à d'autres provinces du nord et saper notre victoire durement gagnée.\n\nNous devons agir de manière décisive pour écraser cette rébellion avant qu'elle ne prenne davantage d'ampleur."
 HoangLienRevolt.1.a: "Cela ne peut être toléré."

 HoangLienRevolt.2.t: "La répression"
 HoangLienRevolt.2.d: "Suite au déclenchement de la rébellion à Hoang Lien Son, nos forces militaires ont reçu l'ordre de rétablir l'ordre par une action décisive. La répression a été rapide et brutale, nos troupes parcourant la province pour expulser les sympathisants communistes et rétablir le contrôle du gouvernement.\n\nDes centaines de rebelles présumés ont été arrêtés et de nombreux affrontements ont eu lieu entre nos forces et les insurgés. L'opération a été coûteuse : nous avons perdu des effectifs importants dans les combats et la répression violente a suscité des critiques tant au niveau national qu'international. La réponse musclée a également ébranlé la confiance du public, le soutien à la guerre diminuant à mesure que la nouvelle de la répression se répand.\n\nL'opération a cependant atteint son objectif premier. La résistance à Hoang Lien Son a été écrasée, la conformité a été rétablie et la province est désormais fermement sous notre contrôle. Une fois la rébellion réprimée, nous avons officiellement intégré Hoang Lien Son à la République du Vietnam, l'ajoutant ainsi comme territoire central. La province fait désormais pleinement partie de notre nation, même si les cicatrices du conflit restent visibles dans les communautés qui ont subi le plus gros des combats."
 HoangLienRevolt.2.a: "L'ordre a été rétabli."

 # French Coup
 French_Coup.1.t: "La reprise de Leroy"
 French_Coup.1.d: "Nous avons irrité les Français au point où ils étaient prêts à continuer à faire des affaires avec nous, et ce matin ils ont recouvré la dette.\n\nDes hommes armés dirigés par Jean Leroy de l'UMDC ont encerclé puis pénétré dans la résidence avant l'aube. Il n'y a pas eu de combat digne de ce nom. Leroy est un commandant de milice catholique avec une armée privée et le soutien français, et le soutien était la partie opérationnelle - le garde comprenait de qui il transmettait les ordres et s'est tenu à l'écart.\n\nLa France tient à nouveau le Vietnam, et compte installer Nguyen-Van-Hinh à la tête du [VIE.GetNameDef]: un général avec une commission française, un passeport français, et aucune circonscription dans ce pays qui ne porte l'uniforme. Quelle que soit l'indépendance conquise sur le papier ces dernières années, elle a été détruite en un seul matin par une centaine d'hommes, et il faudra beaucoup de temps avant qu'elle soit reconquise."
 French_Coup.1.a: "Nous aurions dû nous occuper de lui quand nous en avions l'occasion."

 French_Coup.2.t: "L'Ascension de Hinh"
 French_Coup.2.d: "Pour consolider à nouveau le contrôle français au Vietnam, le gouvernement français a nommé le général Nguyen-Van-Hinh à la tête du [VIE.GetName]. En tant qu'officier loyal formé en France, Hinh permet aux Français d'avoir un visage local tout en répondant toujours à la France. Cela signifie que le gouvernement vietnamien actuel restera dépendant de la France pour les années à venir."
 French_Coup.2.a: "Cela ne peut pas arriver..."

 # Hinh's French Government
 French_Hinh.1.t: "Le gouvernement fantoche français"
 French_Hinh.1.d: "Après avoir consolidé sa position par des purges, la censure et la répression, le général Nguyen-Van-Hinh a mis en place un gouvernement qui n'est guère plus qu'un régime fantoche français. Même si Hinh conserve l'apparence d'un leadership vietnamien, toutes les décisions importantes doivent être approuvées par les conseillers et les responsables français. Le haut-commissaire français conserve l'autorité ultime sur les affaires vietnamiennes, le gouvernement de Hinh fonctionnant principalement comme un organe administratif chargé de mettre en oeuvre la politique française.\n\nL'accord garantit le contrôle français sur les ressources, l'armée et la politique étrangère du Vietnam tout en présentant une façade d'autonomie vietnamienne. La position de Hinh dépend entièrement du soutien français, et toute tentative d'affirmer une véritable indépendance entraînerait son renvoi immédiat. Le peuple vietnamien est bien conscient de cet arrangement, considérant Hinh comme un traître qui a vendu son pays aux maîtres coloniaux."
 French_Hinh.1.a: "Nous servons au gré de la France."

 French_Hinh.2.t: "La façade de la souveraineté"
 French_Hinh.2.d: "Après des mois de négociations minutieuses, le général Hinh a conclu un accord avec le haut-commissaire français : le Vietnam conservera les structures formelles de son État - son drapeau, ses ministères, son siège dans l'Union française - tandis que la France maintiendra une surveillance discrète de la défense et des affaires étrangères.\n\nCet arrangement ne satisfait complètement personne. Les responsables français y voient une concession abordable qui préserve leur influence sans les coûts d'une administration directe. Le gouvernement de Hinh le célèbre comme une victoire pour la dignité vietnamienne, même si les acclamations des ministères sonnent creux alors que les conseillers français occupent toujours les bureaux voisins.\n\nDans les rues de Saigon, les cyniques affirment que peu de choses ont changé. Peut-être ont-ils raison. Mais Hinh a un État, et un État est quelque chose sur lequel bâtir - du moins c'est ce qu'il se dit."
 French_Hinh.2.a: "Nous prenons ce que nous pouvons obtenir."

 French_Hinh.3.t: "Une Province de France"
 French_Hinh.3.d: "La directive arrive de Paris sans cérémonie. Les administrateurs français assumeront la supervision directe des ministères des Finances, de l'Intérieur et de la Défense. L'Armée nationale vietnamienne sera formellement placée sous le commandement opérationnel du Corps expéditionnaire français. Les accords commerciaux seront renégociés pour donner la priorité aux intérêts commerciaux français.\n\nLe général Hinh lit le document deux fois avant de le signer. Il ne proteste pas. Son gouvernement existe parce que la France lui permet d'exister, et la France a désormais choisi de simplifier les arrangements. Le Vietnam restera sur les cartes en tant que nom et territoire, mais les décisions seront prises à Paris.\n\nDans les cafés de Saigon, la nouvelle se répand vite. Les riziculteurs du delta du Mékong, les étudiants des universités, les anciens combattants qui se sont battus pour l'indépendance, tous comprennent ce que signifie ce document, même si aucun n'ose le dire ouvertement."
 French_Hinh.3.a: "Signez les papiers."

 # Ngo-Dinh Brothers
 NgoDinh_Brothers.1.t: "L'exil de Diem"
 NgoDinh_Brothers.1.d: "Des informations sont parvenues à la police secrète française \"Xac-Te\" selon lesquelles Ngo-Dinh-Diem, la figure insaisissable derrière le manifeste controversé, a réussi à échapper à sa capture. Les renseignements suggèrent que Diem a trouvé refuge au Japon, ce qui complique encore davantage nos efforts pour contenir son programme radical.\n\nDe récentes interceptions des services de renseignement indiquent également que Diem a eu une réunion clandestine avec Cuong-De, une personnalité connue pour son implication dans des activités antigouvernementales. Cette réunion, entourée de secret, laisse entrevoir une alliance potentielle entre deux forces aux objectifs similaires mais aux méthodes différentes.\n\nL'implication de Cuong-De soulève des inquiétudes quant à la profondeur de la collaboration entre les différentes factions cherchant à remettre en question la stabilité de notre gouvernement et le soutien de la France. La présence continue de Diem sur la scène internationale, couplée à cette nouvelle alliance, ajoute un autre niveau de complexité à la situation en évolution.\n\nXac-Te reste vigilant, surveillant de près ces développements et évaluant les implications de cette rencontre inattendue. Alors que nous nous efforçons de protéger notre nation contre la menace communiste, cette nouvelle alliance pourrait s'avérer être un formidable défi dans les jours à venir."
 NgoDinh_Brothers.1.a: "Quelqu'un va être licencié pour ça !"

 NgoDinh_Brothers.2.t: "L'arrestation de Diem"
 NgoDinh_Brothers.2.d: "Diem fut emmené sur la route de Vinh-Long, où il allait rendre visite à son frère Thuc. Les Xac-Te ont procédé à l'arrestation sur la base d'un mandat d'arrêt du gouvernement, et l'accusation inscrite sur le journal est une activité anti-étatique, que les rédacteurs ont commodément laissée sous silence.\n\nCela s'est fait dans le calme et cela n'est pas resté silencieux pendant une heure. Diem n'est pas un simple citoyen. Il a refusé un ministère du chef de l'État et une place du Viet Minh, et il y a des hommes dans toutes les factions de ce pays qui attendent de voir dans quelle direction il évoluerait finalement.\n\nLa famille a répondu avant la fin de la journée. Les Ngo-Dinh ont publié une lettre dénonçant l'arrestation comme étant injuste et politiquement motivée, exigeant sa libération immédiate et avertissant que le gouvernement a commis une erreur qui lui coûtera cher. Ce sont des catholiques avec un évêque dans la famille et des fidèles dans les paroisses du nord, et la lettre a été rédigée par des personnes qui savent précisément jusqu'où elle ira."
 NgoDinh_Brothers.2.a: "Échec et mat!"

 NgoDinh_Brothers.3.t: "L'arrestation de Nhu"
 NgoDinh_Brothers.3.d: "Nhu a été arrêté ce matin par les Xac-Te pour activités antiétatiques et terrorisme communiste. La deuxième accusation ne survivrait pas à une salle d'audience, et ce n'est pas prévu.\n\nCe qu'il fait en réalité, c'est organiser. Les grèves quotidiennes et les troubles qui ont rendu Saigon ingouvernable ce mois-ci ont été menés hors de son cercle, en travaillant avec les cellules syndicalistes et, là où cela lui convenait, avec des hommes bien plus à gauche que cela. Le port n'a pas déplacé de marchandises depuis neuf jours.\n\nL'arrestation vise à accomplir deux choses à la fois. Cela retire l'organisateur de la rue et place le mot terrorisme à côté du nom de famille au moment précis où le manifeste de son frère est débattu dans tous les cafés de la ville. Un rocher et deux oiseaux, comme le dit le dossier : Nhu réduit au silence, et Diem discrédité par l'association."
 NgoDinh_Brothers.3.a: "Et... ÉCHEC ET MAT !"

 NgoDinh_Brothers.4.t: "Tran-Quoc-Buu forme une alliance syndicaliste avec Ngo-Dinh-Nhu"
 NgoDinh_Brothers.4.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Tran-Quoc-Buu, qui dirige la Confédération vietnamienne des travailleurs, a fait cause commune avec Ngo-Dinh-Nhu. La Sûreté signale le contact depuis le début de l'année. Ce qui est nouveau, c'est qu'aucun des deux hommes ne prend plus la peine de le cacher.\n\nTous deux construisent un mouvement syndicaliste contre la domination française, et Buu a mis la Confédération derrière le programme du frère de Nhu - le Manifeste Social-Révolutionnaire de 1949, qui était jusqu'à présent un pamphlet auquel aucune organisation n'était attachée. Ils publient ensemble dans un journal de Saigon appelé \"Xa-Hoi\", et sa diffusion parmi les syndicats des docks et des usines a augmenté chaque mois depuis sa parution.\n\nC'est la combinaison contre laquelle la cause Quoc-Gia a le moins de défense. Nhu fournit la doctrine et les connexions ; Buu approvisionne des dizaines de milliers de travailleurs organisés dans le port et les usines. Nos patrons français liront cela comme une agitation et nous pousseront à agir, et agir signifie arrêter un dirigeant syndical suivi et le frère d'un homme que la moitié de l'Assemblée espère gouverner. Il y a un an, la prison coûtait moins cher qu'aujourd'hui."
 NgoDinh_Brothers.4.a: "Nous aurions dû les arrêter il y a longtemps"

 # VIE PMs
 VIE_PMs.1.t: "Nguyen-Van-Xuan démissionne de son poste de Premier ministre"
 VIE_PMs.1.d: "Nguyen-Van-Xuan a démissionné de son poste de Premier ministre. Il n'a donné aucune raison digne d'être publiée et aucune n'a été insistée. Le chef de l'État assumera lui-même ses fonctions jusqu'à ce qu'un successeur soit trouvé, un arrangement que personne n'a l'intention de laisser en vigueur longtemps.\n\nDeux noms sont à l'étude. Nguyen-Phan-Long est un caodaiste, ouvertement pro-américain et nationaliste en politique intérieure - une combinaison qui plairait au Cao-Dai, à Washington et à la presse nationaliste, trois circonscriptions que ce gouvernement ne peut actuellement atteindre à lui seul.\n\nL'autre est Tran-Quang-Vinh, un général Cao-Dai, et l'objection à son égard est connue : il n'a jamais caché son soutien au prince exilé Cuong-De. Le nommer achèterait carrément les sectes. Cela placerait également un homme fidèle à un prétendant rival un échelon en dessous du sommet de ce gouvernement."
 VIE_PMs.1.a: "Bao-Dai ne peut pas tout faire seul !"

 VIE_PMs.2.t: "Nguyen-Phan-Long démissionne de son poste de Premier ministre"
 VIE_PMs.2.d: "Nguyen-Phan-Long gouvernait du mieux qu'on pouvait dans le temps qui lui était imparti, et ce sont les Français qu'il perdit plutôt que le pays. Une fois que le Haut-commissariat a fait connaître son point de vue, il n'y a eu aucune version des événements dans lesquels il est resté, et le chef de l'État a dû exiger sa démission. Bao-Dai occupe lui-même le poste jusqu'à ce qu'un successeur émerge.\n\nTran-Van-Huu est le premier nom sur la liste. Il fut vice-premier ministre de Cochinchine, et on se souvient surtout de lui pour avoir mis la police sur les manifestations étudiantes de 1950 - ce qui est précisément le titre qui le recommande aux hommes qui viennent de destituer son prédécesseur.\n\nLe second est Nguyen-Bao-Toan, un révolutionnaire catholique en bons termes avec les Hoa-Hao et allié de Diem. Il entraînerait avec lui les sectes et les catholiques. Il rapprocherait également Diem du centre de ce gouvernement bien plus que le palais n'a jamais souhaité qu'il le soit."
 VIE_PMs.2.a: "Espérons que nous pourrons trouver un remplaçant à temps."

 VIE_PMs.3.t: "Tran-Van-Huu démissionne de son poste de Premier ministre"
 VIE_PMs.3.d: "Tran-Van-Huu a démissionné après deux ans, ce qui, selon les normes de cette fonction, est un mandat long et inadéquat selon les normes du pays. Le chef de l'Etat doit trouver un successeur et a deux hommes en réflexion.\n\nNguyen-Van-Tam est allié du Viet-Nam Quoc-Dan Dang et a bâti sa réputation sur la destruction du Viet Minh dans le delta. Ses méthodes lui ont valu le surnom de « Tigre de Cai-Lay », qu'il n'a jamais répudié et que ses partisans présentent comme une recommandation plutôt que comme une réserve.\n\nDinh-Xuan-Quang est juge, a participé au mouvement anticolonial dans sa jeunesse et entretient des liens étroits avec la communauté catholique de Phat-Diem. Il serait la nomination la plus respectable et, de loin, la moins effrayante, et c'est précisément cela l'argument contre lui."
 VIE_PMs.3.a: "Espérons que nous pourrons trouver un remplaçant à temps."

 VIE_PMs.4.t: "Nguyen-Van-Tam démissionne de son poste de Premier ministre"
 VIE_PMs.4.d: "Comme tous les premiers ministres avant lui, Nguyen-Van-Tam a démissionné de son poste de Premier ministre de [VIE.GetName] moins d'un an après sa nomination par Bao-Dai. Pour combler ce vide, Bao-Dai a décidé de nommer son cousin, Nguyen-Phuc Buu-Loc, au poste de Premier ministre."
 VIE_PMs.4.a: "C'est le mieux que nous puissions faire pour l'instant."

 VIE_PMs.5.t: "Nguyen-Phuc Buu-Loc démissionne de son poste de Premier ministre"
 VIE_PMs.5.d: "Après avoir gouverné pendant un an, Nguyen-Phuc Buu-Loc a démissionné de son poste de premier ministre du [VIE.GetName]. Pour l'instant, comme il n'y a personne pour occuper le poste, Bao-Dai restera en charge du [VIE.GetName] jusqu'à ce qu'il trouve quelqu'un prêt à occuper le poste."
 VIE_PMs.5.a: "Qu'est-ce que cela signifie pour le Vietnam ?"

 VIE_PMs.6.t: "Tran-Quang-Vinh démissionne de son poste de Premier ministre"
 VIE_PMs.6.d: "Tran-Quang-Vinh gouvernait à peu près aussi bien qu'un général Cao-Dai dans un cabinet soutenu par la France aurait pu s'attendre à le faire, et ce sont les Français qu'il a perdu plutôt que le pays. Une fois que le Haut-commissariat a fait connaître son point de vue, il n'y a eu aucune version des événements dans lesquels il est resté, et le chef de l'État a dû exiger sa démission. Bao-Dai occupe lui-même le poste jusqu'à ce qu'un successeur émerge.\n\nTran-Van-Huu est le premier nom sur la liste. Il fut vice-premier ministre de Cochinchine, et on se souvient surtout de lui pour avoir mis la police sur les manifestations étudiantes de 1950 - ce qui est précisément le titre qui le recommande aux hommes qui viennent de destituer son prédécesseur.\n\nLe second est Nguyen-Bao-Toan, un révolutionnaire catholique en bons termes avec les Hoa-Hao et allié de Diem. Il entraînerait avec lui les sectes et les catholiques. Il rapprocherait également Diem du centre de ce gouvernement bien plus que le palais n'a jamais souhaité qu'il le soit."
 VIE_PMs.6.a: "Espérons que nous pourrons trouver un remplaçant à temps."

 VIE_PMs.7.t: "Nguyen-Bao-Toan assassiné"
 VIE_PMs.7.d: "Le Premier ministre Nguyen-Bao-Toan est mort. Il a été abattu devant sa résidence au petit matin, quelques jours avant le début du coup d'État qu'il préparait contre le chef de l'État et la Haute-commissariat français. La Sûreté lisait sa correspondance depuis des semaines ; s'ils ont agi sur ordre ou ont simplement détourné le regard, personne dans le palais ne se porte volontaire pour le dire.\n\nLes arrestations ont commencé avant que son corps n'ait été enlevé. Les officiers qui lui ont pris son argent, les organisateurs qui ont entraîné sa milice et les députés qui avaient été aperçus à ses dîners sont rassemblés à travers Saigon et accusés de trahison contre le chef de l'Etat. Ceux qui en ont les moyens ont déjà quitté le pays. Ceux qui sont dehors découvrent lesquels de leurs amis n'ont jamais été leurs amis.\n\nLe poste qu'il occupait doit désormais être pourvu. Deux hommes sont à l'étude. Nguyen-Van-Tam, « Le Tigre de Cai-Lay », est allié du Viet-Nam Quoc-Dan Dang et a bâti son nom sur la destruction du Viet Minh dans le delta ; après cette semaine, ses méthodes ressemblent moins à un handicap qu'à une qualification. Dinh-Xuan-Quang est un juge étroitement lié à la communauté catholique de Phat-Diem, la nomination la plus respectable et, de loin, la moins effrayante, et l'argument contre lui est précisément cela."
 VIE_PMs.7.a: "La trahison a un prix."

 VIE_PMs.10.t: "Nguyen-Bao-Toan démissionne de son poste de Premier ministre"
 VIE_PMs.10.d: "Nguyen-Bao-Toan a démissionné après deux ans de mandat et le chef de l'État doit trouver un successeur. Deux hommes sont à l'étude, et ils ne pourraient guère se ressembler.\n\nNguyen-Van-Tam est allié du Viet-Nam Quoc-Dan Dang et a bâti sa réputation sur la destruction du Viet Minh dans le delta. Ses méthodes lui ont valu le surnom de « Tigre de Cai-Lay », qu'il n'a jamais répudié et que ses partisans présentent comme une recommandation plutôt que comme une réserve.\n\nDinh-Xuan-Quang est juge, a participé au mouvement anticolonial dans sa jeunesse et entretient des liens étroits avec la communauté catholique de Phat-Diem. Il serait la nomination la plus respectable et, de loin, la moins effrayante, et c'est précisément cela l'argument contre lui."
 VIE_PMs.10.a: "Espérons que nous pourrons trouver un remplaçant à temps."

 VIE_PMs.8.t: "Dinh-Xuan-Quang démissionne de son poste de Premier ministre"
 VIE_PMs.8.d: "Comme tous les premiers ministres avant lui, Dinh-Xuan-Quang a démissionné de son poste de Premier ministre de [VIE.GetName] moins d'un an après sa nomination par Bao-Dai. Pour combler ce vide, Bao-Dai a décidé de nommer son cousin, Nguyen-Phuc Buu-Loc, au poste de Premier ministre."
 VIE_PMs.8.a: "C'est le mieux que nous puissions faire pour l'instant."

 # Huu
 VIE_Huu.1.t: "L'État du Vietnam exige des réparations de guerre"
 VIE_Huu.1.d: "En 1940, le Japon envahit l'Indochine française et la met sous son contrôle pendant 5 ans. Après la Seconde Guerre mondiale, le Japon a dû abandonner son empire et a été occupé par les Américains. Récemment, nous avons reçu des nouvelles du Premier ministre Huu de l'État du Vietnam nous exigeant de payer des réparations de guerre pour les années d'occupation pendant la Seconde Guerre mondiale. Devons-nous accepter la demande du gouvernement vietnamien ?"
 VIE_Huu.1.a: "Acceptez leurs demandes."
 VIE_Huu.1.b: "Refusez leurs demandes."

 VIE_Huu.2.t: "Tokyo concède la demande de réparations"
 VIE_Huu.2.d: "La réponse est venue des autorités d'occupation américaines plutôt que d'un quelconque ministère japonais, ce qui nous dit l'essentiel de ce que nous devons savoir sur la manière dont cette décision a été prise. Le Japon accepte le principe des réparations pour les cinq années pendant lesquelles son armée a gouverné l'Indochine, et accepte notre gouvernement comme partie habilitée à les recevoir.\n\nCe deuxième point vaut plus pour le Premier ministre Huu que la somme elle-même. Hanoï soutient depuis des années que l'État du Vietnam est une convenance française sans pouvoir parler au nom du pays. Une puissance étrangère a désormais réglé une dette envers Saigon et envers personne d'autre, et les journaux ont été informés exactement quelle phrase publier.\n\nL'argent est suffisamment modeste pour être dépensé dans l'année, la majeure partie étant consacrée à des obligations déjà en souffrance. Ce que nous avons acheté, c'est un précédent et une correspondance plus froide avec Tokyo, qui espérait que ce dossier resterait clos."
 VIE_Huu.2.a: "Que le dossier montre qui a été payé et par qui."

 VIE_Huu.3.t: "Les Japonais refusent"
 VIE_Huu.3.d: "Tragique nouvelle ! Malgré nos efforts pour convaincre le gouvernement japonais d'accorder des réparations de guerre, il a refusé d'accepter nos demandes. C'est une grande injustice pour les atrocités qu'ils ont commises pendant les cinq années d'occupation."
 VIE_Huu.3.a: "Comment osent-ils !"

 VIE_Huu.4.t: "La VOA"
 VIE_Huu.4.d: "\"Voice Of America\", ou VOA, est une radio internationale de l'Agence d'information des États-Unis. Créée en 1942, la VOA vise à servir les intérêts américains à l'étranger à travers des émissions radiophoniques d'informations, de musique et bien d'autres programmes.\n\nDepuis le début de la guerre froide, la VOA a intensifié ses opérations mondiales dans le but d'aider les États-Unis à lutter contre le communisme. Ce nouveau changement de direction peut être clairement ressenti dans les points chauds politiques du monde entier, en particulier au Vietnam, alors que notre pays est actuellement à l'avant-garde d'un grand affrontement international entre superpuissances.\n\nAlors que l'information et le divertissement continuent de danser ensemble dans le tango d'influence de la VOA, le spectre de la domination géopolitique américaine ne disparaîtra pas de sitôt."
 VIE_Huu.4.a: "C'est la voix de l'Amérique, Washington D.C., qui approuve."

 VIE_Huu.5.t: "[VIE.GetLeader] Demande une aide supplémentaire"
 VIE_Huu.5.d: "Nous avons reçu des nouvelles du Vietnam nous demandant une aide supplémentaire pour lutter contre les communistes en Indochine. Nous pouvons accepter leurs demandes pour nous assurer qu'ils restent amicaux avec nous ou nous pouvons définir certains termes et conditions qu'ils devront respecter avant de pouvoir leur envoyer de l'aide."
 VIE_Huu.5.a: "D'accord."
 VIE_Huu.5.b: "Pas si vite."

 VIE_Huu.6.t: "Paris accorde l'aide sans conditions"
 VIE_Huu.6.d: "Le Premier ministre Huu a demandé au gouvernement français d'augmenter son aide et n'a attaché aucune concession à cette demande. Paris a répondu dans le même esprit : pas de protocoles révisés, pas de commission de contrôle, pas de clause sur la destination des fonds. Les crédits sont simplement libérés.\n\nNos ministères s'étaient préparés à une négociation et se retrouvent désormais avec de l'argent et aucun argument à avoir. La première tranche va à la capitale : le bloc administratif dont Saigon a besoin depuis que la bureaucratie cochinchine s'est intégrée à la nôtre, et les travaux routiers que chaque saison des pluies défait.\n\nIl serait agréable de lire cela comme une confiance française en nous. La lecture la plus sobre du cabinet du Premier ministre est que Paris a trop de dossiers ouverts en Indochine pour passer un mois à débattre sur celui-ci, et qu'une demande différée n'est pas une demande retirée."
 VIE_Huu.6.a: "Prenez les crédits et rappelez-vous qui les a signés."

 VIE_Huu.7.t: "Les Français ont certaines conditions"
 VIE_Huu.7.d: "Mon chef, il semble que même si les Français semblent accepter l'idée d'envoyer de l'aide au Vietnam, ils ont fixé certains termes et conditions que nous devons respecter pour qu'ils puissent envoyer de l'aide. Nous pourrions refuser de telles conditions dans l'intérêt de notre autodétermination, proposer un compromis en guise de contre-offre de notre part, ou accepter leurs termes et conditions d'aide."
 VIE_Huu.7.a: "Nous ne soumettons pas."
 VIE_Huu.7.b: "Compromis?"
 VIE_Huu.7.c: "Nous avons désespérément besoin d'aide, acceptez tout ce qu'ils nous proposent."

 VIE_Huu.8.t: "Le Vietnam refuse de bouger"
 VIE_Huu.8.d: "Grave nouvelle ! Malgré nos efforts pour leur proposer des termes et conditions en échange de notre aide, le gouvernement vietnamien refuse d'accepter notre demande. Nous pouvons refuser de les aider ou leur donner ce qu'ils veulent pour maintenir des relations cordiales entre les deux nations."
 VIE_Huu.8.a: "Qu'il en soit ainsi."
 VIE_Huu.8.b: "Nous ne refuserons pas l'aide à un allié précieux, nous ne lui donnerons pas ce qu'il veut."

 VIE_Huu.9.t: "Le Vietnam propose un compromis"
 VIE_Huu.9.d: "Mon chef ! Nous avons reçu des nouvelles du Vietnam selon lesquelles ils ont décidé de nous proposer des compromis en échange de l'acceptation de nos termes et conditions d'aide. Nous pouvons accepter leurs compromis et leur apporter l'aide qu'ils souhaitent ou rejeter leur compromis et ne rien leur envoyer."
 VIE_Huu.9.a: "C'est un compromis."
 VIE_Huu.9.b: "Ce n'est pas ce que nous exigeons, nous ne vous aiderons pas."

 VIE_Huu.10.t: "Le Vietnam cède"
 VIE_Huu.10.d: "Bonne nouvelle ! Le gouvernement vietnamien a décidé de céder à nos demandes en échange d'une aide. Nous devrions célébrer ce moment car il montre comment nous pouvons persuader les autres d'accepter nos conditions sans être intimidés."
 VIE_Huu.10.a: "C'est un plaisir de faire affaire avec eux."

 VIE_Huu.11.t: "Paris retire son offre d'aide"
 VIE_Huu.11.d: "Nous avons dit aux Français que nous n'accepterions pas leurs conditions, et nous l'avons dit là où cela pouvait être entendu. La réponse est revenue par le Haut-Commissariat dans le langage le plus sec possible : l'offre est retirée, le dossier est clos et il n'y a plus rien à discuter pour le moment.\n\nPersonne au cabinet n'est surpris. Ce refus était une déclaration sur notre souveraineté plutôt qu'un calcul sur notre budget, et le premier ministre en connaissait le prix lorsqu'il l'a fait. Ce qui n'a pas été pleinement évalué, c'est la manière dont l'Assemblée prendrait la suite - les mêmes députés qui ont applaudi le refus demandent maintenant où se trouvent les fonds de remplacement.\n\nIl n'y en a pas. Les programmes tirés de cette aide seront réduits ou reportés, et chaque report sera rapporté à Hanoï comme la preuve que Saigon ne peut pas se nourrir sans la France."
 VIE_Huu.11.a: "Nous paierons notre dignité en plusieurs versements."

 VIE_Huu.12.t: "La France accepte la contre-offre"
 VIE_Huu.12.d: "Le compromis porté par notre délégation à Paris a été accepté. Nous acceptons un paquet plus petit, à des conditions plus légères que celles qui nous ont été imposées au départ : certaines clauses de supervision survivent, les plus dures ne le sont pas, et l'aide est transférée.\n\nC'est le résultat souhaité par le Premier ministre et c'est aussi le plus difficile à vendre. Un refus aurait fait la une des journaux. Une reddition aurait au moins été simple. Un compromis est un document, et les documents sont lus par des hommes recherchant ce qui a été concédé plutôt que ce qui a été conservé.\n\nL'argent va d'abord dans les routes, où l'effet peut être vu depuis la vitre d'une voiture. Les nationalistes de l'Assemblée liront attentivement le texte signé et y trouveront toutes les lignes que nous avions juré de ne pas accepter, et ils n'auront pas entièrement tort."
 VIE_Huu.12.a: "Une moitié de pain et une moitié de querelle."

 VIE_Huu.13.t: "La France accepte de nous aider quand même"
 VIE_Huu.13.d: "Étonnamment, malgré quelques appréhensions, les Français ont décidé d'accepter de nous envoyer de l'aide sans nous obliger à accepter leurs termes et conditions. C'est une bonne nouvelle car cela montre que nous n'avons pas besoin de nous plier aux Français pour obtenir nos revendications."
 VIE_Huu.13.a: "D'accord."

 VIE_Huu.14.t: "La France rejette le compromis"
 VIE_Huu.14.d: "Notre contre-offre a été catégoriquement refusée. Paris n'assouplira pas les conditions attachées à l'aide, ne discutera pas d'un paquet réduit et a laissé entendre que les conditions posées sur la table sont les conditions et ont toujours été les conditions.\n\nL'insulte réside dans la manière plus que dans le fond. Nous n'avons pas été refusés par un ministre ; nous avons lu la décision dans la presse française deux jours avant que la note ne parvienne à notre ministère des Affaires étrangères. Le Premier ministre Huu avait misé sur sa conviction qu'un allié menant la même guerre le rencontrerait à mi-chemin, et il a été démontré le contraire devant tout le monde.\n\nLa perte pratique est l'aide. L'argument est la perte durable, car tous ceux qui à Saigon ont dit que la France traitait l'État du Vietnam comme une administration plutôt que comme un État viennent d'en avoir la preuve."
 VIE_Huu.14.a: "Voilà donc ce que vaut notre alliance."

 # Tam
 VIE_Tam.1.t: "Intensification des opérations anticommunistes"
 VIE_Tam.1.d: "Le Premier ministre Nguyen Van Tam a annoncé une escalade majeure des opérations de sécurité anticommunistes dans tout le Sud-Vietnam. En réponse à la menace croissante du Viet Minh et de ses partisans dans les campagnes, le gouvernement met en oeuvre une stratégie anti-insurrectionnelle globale.\n\nCela comprend des patrouilles militaires accrues, des points de contrôle de sécurité plus stricts, des opérations de collecte de renseignements élargies et des tactiques plus agressives contre les sympathisants présumés du communisme. L'objectif est d'éradiquer l'infrastructure communiste qui s'est construite dans le Sud et d'empêcher le Nord de prendre pied dans les zones rurales.\n\nSi ces mesures sont nécessaires pour la sécurité nationale, elles ont également suscité des inquiétudes quant aux libertés civiles et aux risques d'abus. Certains critiques affirment que l'approche autoritaire du gouvernement pourrait aliéner les personnes mêmes qu'il cherche à protéger, les poussant dans les bras des communistes.\n\nNéanmoins, le Premier ministre Tam est déterminé à poursuivre ces opérations, estimant qu'une action décisive maintenant empêchera un conflit plus large plus tard."
 VIE_Tam.1.a: "Nous devons être vigilants face à la menace communiste."

 VIE_Tam.2.t: "Le premier Cai-Cach Dien-Dia"
 VIE_Tam.2.d: "Malgré les précédents de tentatives de redistribution des terres par divers groupes politiques et religieux au Sud-Vietnam pendant la guerre d'Indochine, ce n'est que lorsque notre plan de réforme agraire « Cai-Cach Dien-Dia » est mis en oeuvre qu'il existe un programme officiel de redistribution systématique dans le Sud. \"Cai-Cach Dien-Dia\" a un objectif ambitieux, avec plusieurs points de réalisation importants :\n\n    1. Réguler le montant du loyer et le taux d'intérêt qu'un propriétaire peut demander.\n    2. Officialiser et formaliser la conduite des prêts - emprunts de terres par le biais de contrats.\n    3. Mise en place de lignes directrices détaillées pour le prêt foncier.\n    4. Revente des terres des propriétaires aux agriculteurs par le biais d'un rachat par le gouvernement et d'une compensation par le biais d'obligations publiques.\n\nAvec ce projet en plein essor, ce n'est qu'une question de temps avant que les anciennes relations sociales entre propriétaires et agriculteurs ne soient complètement abolies. Une nouvelle ère arrive au Sud-Vietnam !"
 VIE_Tam.2.a: "Les agriculteurs auront leurs rizières."

 VIE_Tam.3.t: "La croisade de Tam contre le Nord communiste"
 VIE_Tam.3.d: "Le Premier ministre Tam a lancé une campagne globale contre le Nord communiste, déclarant que le Sud-Vietnam ne se reposera pas tant que la menace du régime de Ho Chi Minh ne sera pas éliminée. Cette « croisade » implique non seulement des opérations militaires, mais aussi des efforts de propagande, une guerre économique et des initiatives diplomatiques pour isoler le Nord.\n\nLa campagne comprend une sécurité accrue aux frontières, des émissions de contre-propagande et des efforts visant à couper les lignes d'approvisionnement du Nord et les réseaux de soutien au Sud. Tam a également appelé la communauté internationale à reconnaître la menace posée par l'expansion communiste en Asie du Sud-Est et à apporter un plus grand soutien à la lutte du Sud-Vietnam.\n\nCette position agressive a suscité à la fois du soutien et des critiques. Les partisans louent la détermination et la vision claire de Tam, tandis que les critiques craignent qu'une approche aussi intransigeante puisse rendre impossible une résolution pacifique et aggraver le conflit de manière incontrôlable.\n\nQuel que soit le débat, le Premier ministre Tam reste déterminé. \"Nous ne négocierons pas avec les terroristes\", a-t-il déclaré récemment dans un discours. \"Nous nous battrons jusqu'à ce que nous ayons la victoire, ou jusqu'à ce que nous ne puissions plus nous battre.\""
 VIE_Tam.3.a: "La lutte contre le communisme continue."

 # Vinh
 VIE_Vinh.1.t: "Faire face au général Phuong"
 VIE_Vinh.1.d: "Le Premier ministre Tran-Quang-Vinh est confronté à une situation délicate et dangereuse avec le général Nguyen-Thanh-Phuong, un éminent chef militaire de Cao-Dai, qui devient de plus en plus problématique. L'influence croissante et les actions indépendantes du général Phuong ont suscité des inquiétudes quant à sa loyauté envers le gouvernement et son potentiel à provoquer l'instabilité.\n\nPhuong commande des forces importantes dans la région de Tay-Ninh, coeur du mouvement religieux Cao-Dai, et ses relations avec le gouvernement se détériorent. Selon certaines informations, il aurait pris des décisions non autorisées, ignoré les ordres de Saigon et aurait potentiellement comploté contre le gouvernement central.\n\nLe Premier ministre Vinh doit décider comment gérer cette situation. Les options vont de la tentative de négocier et de ramener Phuong dans le giron à des mesures plus drastiques. Cependant, toute action contre Phuong risque de s'aliéner la communauté Cao-Dai, qui constitue une force politique et militaire importante au Sud-Vietnam.\n\nLa situation est tendue et le temps presse pour la résoudre pacifiquement."
 VIE_Vinh.1.a: "Nous devons faire face à cette menace avant qu'elle ne s'aggrave."

 VIE_Vinh.2.t: "Planification de l'assassinat de Phuong"
 VIE_Vinh.2.d: "Le comportement du général Phuong devenant de plus en plus imprévisible et dangereux, le Premier ministre Vinh a pris la décision difficile d'autoriser un plan visant à neutraliser le général par l'assassinat. Il s'agit d'une mesure extrême, mais Vinh estime qu'elle est nécessaire pour éviter une crise plus importante.\n\nLes agents ont été identifiés et informés de la mission. Le plan consiste à infiltrer le cercle restreint de Phuong et à l'éliminer au moment opportun. L'opération doit être exécutée avec précision et dans le secret, car tout échec pourrait déclencher une réaction violente de la part des partisans de Phuong.\n\nCette décision pèse lourdement sur Vinh, car un assassinat est une mesure grave qui pourrait avoir des conséquences considérables. Cependant, il estime que l'alternative - permettre à Phuong de poursuivre ses activités perturbatrices - constitue une menace encore plus grande pour la stabilité du Sud-Vietnam.\n\nL'opération devrait se dérouler dans quelques jours. Un succès pourrait neutraliser une menace majeure, mais un échec pourrait plonger le pays dans le chaos."
 VIE_Vinh.2.a: "Procédez à l'opération."

 VIE_Vinh.3.t: "Mutinerie à Tay-Ninh"
 VIE_Vinh.3.d: "Le pire des cas s'est réalisé. Le général Phuong a déclenché une mutinerie à grande échelle à Tay-Ninh, déclarant son indépendance du gouvernement central et mobilisant ses forces Cao-Dai contre Saigon. La mutinerie a surpris le gouvernement et les forces de Phuong ont rapidement pris le contrôle de positions clés dans la région.\n\nLa situation est critique. Phuong commande des troupes bien entraînées et motivées, et il bénéficie du soutien de nombreux membres de la communauté Cao-Dai qui se sentent marginalisés par le gouvernement. La mutinerie menace de diviser le Sud-Vietnam à un moment où l'unité est désespérément nécessaire contre la menace communiste.\n\nLe Premier ministre Vinh doit agir rapidement pour réprimer cette rébellion. La réponse du gouvernement déterminera non seulement le sort de Tay-Ninh, mais potentiellement l'avenir du Sud-Vietnam lui-même. Ne pas réprimer cette mutinerie pourrait enhardir d'autres groupes dissidents et conduire à la fragmentation de l'État.\n\nLes militaires se mobilisent et une confrontation semble inévitable. La question n'est pas de savoir s'il y aura des combats, mais combien de temps ils dureront et quel en sera le coût."
 VIE_Vinh.3.a: "Nous devons écraser cette rébellion immédiatement."

 VIE_Vinh.4.t: "La mutinerie a été réprimée avec succès"
 VIE_Vinh.4.d: "Bonne nouvelle ! Nos efforts pour réprimer la mutinerie de Tay-Ninh ont été un succès. Malgré la résistance initiale, les mutins n'étaient pas à la hauteur de nos forces et nous avons réussi à les éliminer. Espérons que nous puissions donner l'exemple à ceux qui tentent de se rebeller contre nous avec ce succès."
 VIE_Vinh.4.a: "Excellent!"

 VIE_Vinh.5.t: "Phuong neutralisé"
 VIE_Vinh.5.d: "L'opération de neutralisation du général Phuong a été menée à bien. Grâce à une planification et une exécution minutieuses, les agents du gouvernement ont pu éliminer le général gênant, éliminant ainsi une menace majeure pour la stabilité.\n\nAvec le départ de Phuong, ses forces sont en désarroi et le gouvernement a l'occasion de réaffirmer son contrôle sur la région de Tay-Ninh. La communauté Cao-Dai, bien que choquée par la nouvelle, semble accepter la situation, même si certains partisans de la ligne dure restent irrités.\n\nLe Premier ministre Vinh a agi rapidement pour consolider la position du gouvernement, en offrant l'amnistie aux anciens partisans de Phuong qui acceptent de déposer les armes et de réintégrer le bercail. L'objectif est d'apaiser les divisions et de restaurer l'unité sans nouvelle effusion de sang.\n\nCette opération réussie a renforcé la position de Vinh et démontré la détermination du gouvernement à maintenir l'ordre. Cependant, les tensions sous-jacentes qui ont conduit à cette crise demeurent et Vinh doit s'efforcer d'y remédier afin d'éviter que des situations similaires ne se reproduisent à l'avenir."
 VIE_Vinh.5.a: "L'ordre a été rétabli."

 VIE_Vinh.6.t: "Une ambassade pour l'État du Vietnam"
 VIE_Vinh.6.d: "Le Premier ministre Vinh a annoncé son intention de créer une ambassade officielle au Japon, marquant une avancée significative dans les relations vietnamiennes-japonaises. Cette mission diplomatique servira de représentation permanente du Sud-Vietnam à Tokyo et facilitera une coopération plus étroite entre les deux nations.\n\nL'ambassade gérera les affaires diplomatiques, promouvra la coopération commerciale et économique et servira de pont culturel entre le Vietnam et le Japon. Il représente la vision de Vinh de construire des liens plus solides avec les nations asiatiques, allant au-delà des relations coloniales du passé.\n\nLa création de cette ambassade a été saluée par les deux gouvernements, qui y voient le symbole de leur partenariat croissant. Pour le Vietnam, cela représente une opportunité de diversifier ses relations internationales et de réduire sa dépendance à l'égard des puissances occidentales.\n\nLes préparatifs sont en cours et l'ambassade devrait ouvrir d'ici quelques mois. Cette nouvelle présence diplomatique contribuera à façonner l'avenir des relations vietnamiennes-japonaises."
 VIE_Vinh.6.a: "Un nouveau chapitre dans nos relations avec le Japon."

 VIE_Vinh.7.t: "Création de l'Association d'amitié vietnamo-japonaise"
 VIE_Vinh.7.d: "L'Association d'amitié vietnamo-japonaise a été officiellement créée, créant un cadre officiel pour la coopération culturelle, économique et diplomatique entre les deux nations. Cette organisation coordonnera les échanges, facilitera les accords commerciaux et favorisera la compréhension mutuelle.\n\nLa cérémonie de fondation de l'association s'est déroulée en présence de dignitaires des deux pays, qui ont souligné l'importance de construire des ponts entre les nations asiatiques. Le Premier ministre Vinh a prononcé un discours soulignant les valeurs partagées et les intérêts communs qui unissent le Vietnam et le Japon.\n\nCependant, cette relation plus étroite avec le Japon n'est pas passée inaperçue auprès des autres puissances. La France et les États-Unis ont exprimé certaines inquiétudes quant aux liens croissants entre le Vietnam et le Japon, y voyant un changement potentiel dans l'équilibre des pouvoirs régional.\n\nMalgré ces inquiétudes, Vinh reste déterminé à poursuivre la politique étrangère indépendante du Vietnam. L'Association d'amitié représente une étape vers un paysage diplomatique plus multipolaire en Asie du Sud-Est."
 VIE_Vinh.7.a: "Amitié et coopération entre nos nations."

 VIE_Vinh.8.t: "L'État du Vietnam demande le rapatriement de Cuong-De"
 VIE_Vinh.8.d: "Nous avons reçu une demande du gouvernement vietnamien visant à rapatrier le prince Cuong-De au Vietnam. D'une part, accepter cette offre pourrait améliorer les relations Vietnam-Japon. D'un autre côté, étant donné que le prince Cuong-De est un ami du Japon, le rapatrier au Vietnam serait trop risqué car on ne sait quel sort l'attend là-bas."
 VIE_Vinh.8.a: "D'accord."
 VIE_Vinh.8.b: "Non."

 VIE_Vinh.9.t: "Le Japon accepte le rapatriement de Cuong-De"
 VIE_Vinh.9.d: "Après des mois pendant lesquels le ministère japonais des Affaires étrangères n'a donné aucune réponse, Tokyo a accepté. Le prince Cuong-De, qui a quitté ce pays en 1906 et y passe chaque année depuis lors comme hôte du Japon, sera embarqué à bord d'un navire pour Saigon.\n\nLe Premier ministre Vinh a insisté sur ce point et pourrait le revendiquer. La demande a été refusée à deux reprises ; la troisième approche est passée par la famille Ando plutôt que par le ministère, et c'est la famille qui a porté l'argument. Quoi qu'on dise de l'affaire, un gouvernement vietnamien a demandé un prince vietnamien à une puissance étrangère et n'a pas été renvoyé les mains vides.\n\nCe qui arrive n'est pas simplement un vieil homme. Cuong-De est le principal survivant de la lignée des Nguyen, et il y a des hommes à Hué et à Tay-Ninh qui ont attendu un demi-siècle pour le dire à haute voix. Le chef de l'Etat Bao-Dai n'a publié aucune déclaration sur le rapatriement, une omission que les correspondants du palais ont déjà remarquée et imprimée."
 VIE_Vinh.9.a: "Ramenez-le à la maison et regardez qui descend à la rencontre du navire."

 VIE_Vinh.10.t: "Le Japon refuse le rapatriement de Cuong-De"
 VIE_Vinh.10.d: "Malgré nos meilleures tentatives de négociation pour le rapatriement du prince Cuong-De, le gouvernement japonais a refusé de le rapatrier au Vietnam. Les Japonais ont invoqué leurs inquiétudes concernant la sécurité de Cuong-De et leur amitié de longue date avec le prince pour justifier leur décision.\n\nCe refus est une déception pour le gouvernement vietnamien, qui espérait que le rapatriement de Cuong-De contribuerait à normaliser les relations et démontrerait le soutien du Japon aux dirigeants vietnamiens actuels. Cependant, la position japonaise est ferme et ils ne se laisseront pas influencer.\n\nLes relations diplomatiques entre le Vietnam et le Japon restent intactes, mais cet épisode a mis en lumière la complexité des relations internationales et les limites de ce qui peut être réalisé par la seule négociation."
 VIE_Vinh.10.a: "Nous devons respecter leur décision."

 VIE_Vinh.11.t: "L'État du Vietnam demande le rapatriement à titre posthume de Cuong-De"
 VIE_Vinh.11.d: "Nous avons reçu une demande du gouvernement vietnamien pour rapatrier la dépouille du prince Cuong-De, décédé au Japon. D'une part, accepter cette offre pourrait améliorer les relations Vietnam-Japon. En revanche, étant donné que le prince Cuong-De était un ami du Japon, rapatrier sa dépouille au Vietnam serait trop risqué."
 VIE_Vinh.11.a: "D'accord."
 VIE_Vinh.11.b: "Non."

 VIE_Vinh.12.t: "Le Japon accepte de rapatrier la dépouille de Cuong-De"
 VIE_Vinh.12.d: "Après de longues négociations, le gouvernement japonais a accepté de rapatrier la dépouille du prince Cuong-De au Vietnam. Cette décision intervient après la mort du prince au Japon, et les Japonais ont finalement cédé aux demandes vietnamiennes de restitution de son corps.\n\nLe rapatriement de la dépouille de Cuong-De est un moment important pour le Vietnam. Cela permet à la nation d'honorer convenablement la mémoire du prince et de mettre un terme à ses partisans. Les restes seront enterrés avec tous les honneurs, reconnaissant le rôle de Cuong-De dans l'histoire vietnamienne et ses contributions au mouvement indépendantiste.\n\nCet accord a contribué à améliorer les relations entre le Vietnam et le Japon, démontrant que des solutions diplomatiques peuvent être trouvées même dans des circonstances difficiles. Le rapatriement réussi crée un précédent positif pour la coopération future entre les deux nations."
 VIE_Vinh.12.a: "Nous pouvons enfin honorer convenablement sa mémoire."

 VIE_Vinh.13.t: "Le Japon refuse de rapatrier la dépouille de Cuong-De"
 VIE_Vinh.13.d: "Malgré nos efforts persistants pour négocier le rapatriement de la dépouille du prince Cuong-De, le gouvernement japonais a refusé notre demande. Les Japonais soutiennent que Cuong-De était un ami du Japon et que sa dernière demeure devait rester dans le pays où il a passé son exil.\n\nCe refus est profondément décevant pour le gouvernement vietnamien et pour les nombreux partisans de Cuong-De. L'incapacité de ramener la dépouille du prince chez elle est devenue une source de frustration et a quelque peu tendu les relations entre les deux pays.\n\nMême si les relations diplomatiques restent fonctionnelles, cet épisode a mis en évidence les limites de ce qui peut être réalisé par la négociation lorsqu'il existe des différences fondamentales de perspective."
 VIE_Vinh.13.a: "Il faut accepter leur décision, aussi décevante soit-elle."

 VIE_Vinh.14.t: "Honorer la lutte malheureuse du Viet-Quoc"
 VIE_Vinh.14.d: "Le Premier ministre Vinh a annoncé son intention d'honorer la mémoire du Viet-Quoc (Parti nationaliste vietnamien) et de sa lutte pour l'indépendance. Malgré l'échec final du parti et le sort tragique de nombre de ses membres, Vinh estime qu'il est important de reconnaître leurs contributions au mouvement indépendantiste vietnamien.\n\nUn mémorial sera érigé pour commémorer ceux qui ont combattu et sont morts pour la cause de l'indépendance vietnamienne, même si leurs méthodes et leur idéologie différaient de celles du gouvernement actuel. Ce geste vise à promouvoir l'unité nationale et à reconnaître l'histoire complexe de la lutte pour l'indépendance.\n\nCependant, cette décision a suscité des réactions mitigées. Certains y voient une étape positive vers la réconciliation et la reconnaissance historique, tandis que d'autres le considèrent comme inapproprié, compte tenu des conflits passés du Viet-Quoc avec divers gouvernements vietnamiens.\n\nIndépendamment du débat, Vinh poursuit le mémorial, estimant qu'honorer le passé, même ses aspects difficiles, est essentiel pour construire un avenir meilleur."
 VIE_Vinh.14.a: "Nous honorons tous ceux qui se sont battus pour l'indépendance du Vietnam."

 VIE_Vinh.15.t: "Les motivations douteuses de Vinh"
 VIE_Vinh.15.d: "Des rumeurs et des soupçons ont commencé à circuler sur les véritables motivations et allégeances du Premier ministre Vinh. Certains critiques ont soulevé des questions sur ses relations avec diverses factions politiques, sa gestion de la crise de Phuong et ses décisions de politique étrangère.\n\nCes inquiétudes ont été alimentées par les actions parfois imprévisibles de Vinh et sa volonté apparente de conclure des accords avec divers groupes, dont les Cao-Dai, les Japonais et d'autres. Certains observateurs se demandent si Vinh est véritablement engagé dans les meilleurs intérêts du Vietnam ou s'il poursuit un agenda personnel.\n\nLe Premier ministre a rejeté ces inquiétudes en les qualifiant de rumeurs sans fondement propagées par des opposants politiques, mais les questions persistent. Dans une période de grande incertitude et de conflits, la confiance dans les dirigeants est cruciale, et tout doute sur les motivations du Premier ministre peut nuire à l'efficacité du gouvernement.\n\nSeul le temps nous dira si ces soupçons sont justifiés ou s'ils sont simplement le produit d'un environnement politique tendu où chaque action est scrutée et remise en question."
 VIE_Vinh.15.a: "Nous devons faire confiance à notre leadership."

 VIE_Toan.1.t: "Formalisation du Dan-Xanisme et du Parti Dan-Xa"
 VIE_Toan.1.d: "Le Parti socialiste démocratique du Vietnam (Parti Dan-Xa), également connu sous le nom de Parti socialiste démocratique, a été créé par le Vénérable Bouddha Huynh-Phu-So de la foi bouddhiste Hoa-Hao le 21 septembre 1946 avec l'aide de certains intellectuels de gauche tels que Nguyen-Van-Sam, Tran-Van-An, Nguyen-Hoan-Bich (Nguyen-Bao-Toan) et l'avocat Mai-Van-Dau. Le professeur Nguyen-hoan-Bich, croyant catholique, a été nommé secrétaire général.\n\nQuelques jours avant l'annonce, le vénérable Huynh a fait appel à un certain nombre de fidèles de tout le pays et leur a donné les instructions suivantes :\n\n1 - En raison de la situation nationale, il serait inapproprié pour moi d'utiliser la lutte pour le pouvoir de la Sangha bouddhiste Hoa-Hao dans la lutte pour l'indépendance, car la foi se concentre sur une véritable illumination spirituelle. Par conséquent, je dois organiser un parti politique pour mieux répondre aux besoins de la nation.\n\n2 - Les véritables patriotes du pays, bien qu'ils me reconnaissent comme patriote, ne peuvent pas s'unir à moi sous le nom du bouddhisme Hoa-Hao pour gérer les affaires nationales. C'est parce qu'ils ne peuvent pas pratiquer comme moi, ou s'ils ont déjà une religion, ils ne peuvent pas l'abandonner pour se convertir au bouddhisme Hoa-Hao. Par conséquent, je dois organiser un parti politique, tandis que chacun doit conserver sa propre religion.\n\n3 - Alors, vous tous les croyants, si vous sentez que vous avez encore une dette envers la nation et le pays, aimez le pays et le peuple, alors rejoignez le Parti socialiste démocratique du Viet-Nam. C'est un moyen pour vous de pratiquer les Quatre Vertus.\n\nAprès sa création, le Dan-xa a formé un Comité exécutif central pour les provinces occidentales et différents niveaux de comités généraux, provinciaux, de district et de branche basés sur les organisations religieuses locales. Le parti a également construit ses propres forces armées pour protéger les zones contrôlées et lutter contre les Français et le Viet Minh."
 VIE_Toan.1.a: "Cach-Mang Con-Nguoi, Cach-Mang Dan-Toc, Cach-Mang Xa-Hoi"

 VIE_Toan.2.t: "Cach-Mang Con-Nguoi - Déclaration de la révolution morale"
 VIE_Toan.2.d: "Dans le cadre d'un développement politique et spirituel historique et inspiré par les enseignements révolutionnaires du Bouddha Huynh-Phu-So de la foi Hoa-Hao, vénéré par ses adeptes comme le « Maître vertueux », le parti cherche à remodeler la société vietnamienne à travers ce qu'il appelle un Cach-Mang Con-Nguoi, une « Révolution humaine ».\n\nRejetant à la fois le capitalisme colonial et la lutte des classes marxiste orthodoxe, les Dan-Xaistes soutiennent plutôt que la société vietnamienne, après des décennies de domination étrangère, a été réduite à une seule classe exploitée. En tant que tel, il n'appelle pas à un conflit de classes, mais à une reconstruction morale - visant à empêcher l'émergence de futures élites exploiteuses tout en nourrissant ce qu'il appelle la « classe procréatrice » : une population moralement honnête et autonome, fondée sur le travail, la famille et la foi.\n\nS'inspirant des doctrines spirituelles du bouddhisme Hoa-hao, le mouvement met l'accent sur la vie éthique comme fondement du renouveau national. Sa déclaration dénonce les maux sociaux tels que le jeu, la consommation d'opium et les pratiques économiques d'exploitation, notamment l'usure et la recherche excessive du profit. À leur place, il promeut l'épargne, la charité et le concept d'une économie du « juste prix » - où la richesse est modérée par la responsabilité morale.\n\nLe cadre idéologique intègre également l'éthique confucéenne traditionnelle, appelant à la préservation des trois liens fondamentaux - entre dirigeant et sujet, père et fils, et mari et femme - aux côtés des cinq vertus constantes : bienveillance, droiture, convenance, sagesse et fiabilité. Ces principes sont présentés non pas comme des reliques du passé, mais comme des piliers essentiels d'une société vietnamienne harmonieuse et unifiée."
 VIE_Toan.2.a: "Bouddha a de l'amour pour tous. Ils finiront par l'accepter."
 VIE_Toan.2.b: "Pour la transformation immédiate de notre société vers Bouddha !"

 VIE_Toan.3.t: "Invitation aux Frères Ngo-Dinh"
 VIE_Toan.3.d: "Les dirigeants du parti Dan-Xa ont tourné leur attention vers la construction d'une coalition anticoloniale et anticommuniste plus large. Reconnaissant l'influence croissante de personnalités révolutionnaires et patriotiques en dehors de leur base religieuse, le parti a adressé une invitation formelle à Ngo-Dinh-Diem et à son frère Ngo-Dinh-Nhu à se joindre ou à coopérer pour former un mouvement national unifié.\n\nCette sensibilisation fait suite au Manifeste socialiste de Diem de 1949 rejetant les Accords de l'Élysée et à son appel à une nouvelle voie révolutionnaire - une voie qui défierait à la fois l'autorité coloniale française et le Viet-Minh dirigé par les communistes. Sa vision d'une révolution sociale fondée sur la dignité humaine et l'indépendance nationale ressemble étroitement à l'enseignement du révérend Huynh et du Parti Dan-Xa, qui rejettent également la lutte des classes en faveur de la transformation morale et sociale.\n\nPendant ce temps, Nhu a organisé des organisations de masse orientées vers le travail, y compris des propositions pour un mouvement ouvrier national et l'établissement de nouvelles formes d'idéologie révolutionnaire inspirées par le syndicalisme, le personnalisme de Mournier et le marxisme. Ces efforts recoupent l'accent mis par Dan-Xa sur l'économie éthique, la justice sociale et la mobilisation populaire parmi les paysans et les travailleurs.\n\nL'alliance proposée n'est pas sans tension. Les différences de fondement religieux - entre le Dan-Xa du bouddhiste Hoa-Hao et le personnalisme catholique de la famille Ngo - ainsi que les visions concurrentes de l'autorité et de la structure de l'État soulèvent la question de savoir si une telle coopération peut durer. Pourtant, l'urgence du moment pourrait l'emporter sur les divisions idéologiques."
 VIE_Toan.3.a: "L'amour déborde dans tout l'univers ; il ne pouvait pas aimer seulement un client rougissant."

 VIE_Toan.4.t: "Cach-Mang Dan-Toc - Commencez la libération nationale"
 VIE_Toan.4.d: "Au milieu de la lutte qui s'intensifie entre les forces coloniales et les révolutionnaires communistes, le parti Dan-Xa, enraciné dans les enseignements du révérend Huynh du bouddhiste Hoa-Hao, a officiellement proclamé une doctrine de révolution nationale et de libération nationale.\n\nAu coeur de cette déclaration se trouve une priorité claire : l'indépendance nationale avant tout. Les dirigeants des partis affirment que sans souveraineté, toutes les autres réformes - sociales, économiques ou morales - restent impossibles. Seul un Nam-Viet libre, affirment-ils, peut être égal entre les nations et contribuer de manière significative à la paix mondiale conformément aux principes des Nations Unies.\n\nRejetant à la fois la domination coloniale et le matérialisme marxiste, le Dan-Xa propose une vision de « la politique du peuple », fondée sur le principe selon lequel la souveraineté réside entièrement dans le peuple. Cette doctrine s'oppose explicitement à toute forme de dictature, qu'elle soit imposée par des impérialistes étrangers ou par des élites matérialistes nationales telles que le Viet-Minh.\n\nAu niveau international, le mouvement appelle à une coopération entre les nations basée sur l'égalité et le respect mutuel, ainsi qu'à la solidarité avec les États les plus faibles qui résistent à l'impérialisme. Au niveau national, il met l'accent sur l'unité nationale, déclarant que le Vietnam - nord, centre et sud - est une seule entité indivisible. Dans ce cadre, les adeptes des bouddhistes Dan-Xa et Hoa-Hao se positionnent comme une « troisième force », distincte à la fois des autorités coloniales françaises et des insurgés communistes."
 VIE_Toan.4.a: "Aimez la nation, aimez le peuple."

 VIE_Quang.1.t: "Le nouveau Code du travail de Dinh-Xuan-Quang est adopté"
 VIE_Quang.1.d: "Le Premier ministre Dinh Xuan Quang a réussi à faire adopter un nouveau code du travail global qui représente une avancée significative pour les droits des travailleurs au Sud-Vietnam. La législation comprend des dispositions sur le salaire minimum, la durée maximale de travail, les normes de sécurité sur le lieu de travail et le droit d'organisation.\n\nCe code du travail est l'un des textes législatifs les plus progressistes d'Asie du Sud-Est et il a été accueilli avec enthousiasme par les travailleurs et les organisations syndicales. Le code établit un cadre pour des pratiques de travail équitables et offre des protections qui faisaient auparavant défaut.\n\nCependant, la législation s'est également heurtée à l'opposition des propriétaires d'entreprises et de certains éléments conservateurs qui affirment qu'elle augmenterait les coûts et réduirait la compétitivité. Malgré ces inquiétudes, Quang reste attaché à la réforme, estimant qu'un traitement équitable des travailleurs est essentiel à la stabilité sociale et au développement économique.\n\nL'adoption de ce code représente une réalisation majeure pour le gouvernement de Quang et démontre son engagement en faveur de la réforme sociale et du bien-être de la classe ouvrière."
 VIE_Quang.1.a: "Une victoire pour les travailleurs du Vietnam."

 VIE_Quang.2.t: "Adoption du nouveau statut de la fonction publique de Dinh-Xuan-Quang"
 VIE_Quang.2.d: "Le Premier ministre Quang a mis en oeuvre des réformes radicales du système de fonction publique, en introduisant de nouvelles réglementations visant à améliorer l'efficacité, à réduire la corruption et à garantir que les postes gouvernementaux soient pourvus sur la base du mérite plutôt que des relations.\n\nLes nouvelles réglementations établissent des normes claires en matière d'embauche, de promotion et d'évaluation des performances. Ils comprennent également des dispositions en matière de formation et de développement professionnel, dans le but de créer une bureaucratie plus compétente et plus réactive.\n\nCes réformes font partie du programme plus large de Quang visant à moderniser l'État vietnamien et à le rendre plus efficace au service du peuple. En professionnalisant la fonction publique, Quang espère améliorer les performances du gouvernement et restaurer la confiance du public dans l'administration.\n\nLes changements ont été bien accueillis par beaucoup qui les considèrent comme une étape nécessaire vers une bonne gouvernance, même si certains intérêts bien établis ont résisté aux réformes. Néanmoins, Quang est déterminé à les mener à bien, estimant qu'une fonction publique professionnelle est essentielle pour l'avenir du Vietnam."
 VIE_Quang.2.a: "Un gouvernement plus professionnel et efficace."

 VIE_Quang.3.t: "Création de l'hôpital pour enfants de Saigon"
 VIE_Quang.3.d: "Le Premier ministre Quang a officiellement inauguré le nouvel hôpital pour enfants de Saigon, un établissement médical de pointe dédié à la fourniture de soins de santé aux plus jeunes habitants de la ville. Cet hôpital représente un investissement majeur en santé publique et démontre l'engagement du gouvernement envers le bien-être de ses citoyens.\n\nL'hôpital est doté d'équipements médicaux modernes et emploie des professionnels qualifiés, dont beaucoup ont reçu une formation spécialisée à l'étranger. Il fournira une gamme de services, allant des soins de routine aux traitements spécialisés pour les maladies graves.\n\nLa création de cet hôpital a été largement saluée comme un développement positif pour Saigon et pour le Vietnam dans son ensemble. Cela représente non seulement une infrastructure de soins de santé améliorée, mais aussi la reconnaissance du fait qu'investir dans la santé des enfants, c'est investir dans l'avenir de la nation.\n\nLe Premier ministre Quang, dans son discours d'ouverture, a souligné que cet hôpital n'est que le début d'un effort plus large visant à améliorer l'accès aux soins de santé dans tout le Sud-Vietnam. « Chaque enfant mérite des soins de santé de qualité », a-t-il déclaré, « et nous travaillerons pour que cela devienne une réalité »."
 VIE_Quang.3.a: "Un avenir plus sain pour nos enfants."

 # VIE Historical Events
 VIE_Historical.1.t: "Les intellectuels de Saigon protestent contre la guerre"
 VIE_Historical.1.d: "Saigon, [?global.date.GetDateStringNoHourLong] Ingénieur Luu-Van-Lang, le premier ingénieur natif d'Indochine, a mené une petite mais significative protestation à Saigon contre notre guerre en cours contre l'expansion communiste du Nord. Connu pour sa ferveur patriotique, l'ingénieur Lang, aux côtés de centaines d'intellectuels, a appelé à la fin des hostilités et a exhorté nos bienfaiteurs français et nos autorités à négocier la paix avec Hô Chi Minh.\n\nRassemblés sur une place publique devant l'Hôtel de Ville, 1er arrondissement, les manifestants ont brandi des banderoles et scandé des slogans prônant des positions anti-françaises au sein du gouvernement et de la paix. Ils ont présenté une déclaration signée par d'éminents intellectuels, exigeant des négociations immédiates pour mettre fin au conflit, mais elle a été rapidement stoppée par la police et la gendarmerie qui ont rapidement balayé la place !"
 VIE_Historical.1.a: "Il vaut mieux tirer sur ces dissidents la prochaine fois !"

 VIE_Historical.2.t: "Grève étudiante au lycée Petrus Ky"
 VIE_Historical.2.d: "Saigon, [?global.date.GetDateStringNoHourLong] - À l'occasion du neuvième anniversaire du soulèvement du Sud du Viet-Minh, une grève massive a éclaté parmi les étudiants de Saigon. La grève a été déclenchée à la suite des arrestations massives par Xac-Te de plusieurs étudiants du lycée Petrus Ky pour subversion contre notre gouvernement.\n\nTran-Van-On, un étudiant rebelle notoire, a dirigé un groupe d'étudiants du lycée Petrus Ky dans la manifestation. Faisant preuve d'un leadership exceptionnel, il a guidé la marche dans les rues de Saigon, exigeant la libération de ses pairs et la fin de l'oppression coloniale qui a perturbé de nombreuses activités quotidiennes à Saigon."
 VIE_Historical.2.a: "Il faut vraiment restaurer la stabilité !"

 VIE_Historical.3.t: "Les étudiants sont de retour dans la rue"
 VIE_Historical.3.d: "La manifestation s'est reformée à Saigon, plus grande que la précédente. Six mille étudiants et enseignants d'une douzaine d'écoles sont dans les rues derrière Tran-Van-On, exigeant la libération des camarades arrêtés il y a quinze jours et une libéralisation politique générale, et ils le réclament nommément de [VIE.GetLeader].\n\nVers une heure, la gendarmerie et les Xac-Te étaient déployés en force. Des canons à eau ont été utilisés, des matraques ont ensuite été utilisées librement et la foule a été dispersée plutôt que dispersée. Cent cinquante sont en état d'arrestation et trente sont grièvement blessés.\n\nLa foule n'est pas rentrée chez elle ; ça a bougé. Nos commandants dans la ville rapportent que le nombre de manifestants dans les rues est plus élevé ce soir qu'à midi et demandent une décision plutôt que des renforts. Il existe deux manières de reprendre une ville et le gouvernement doit choisir entre elles avant le matin."
 VIE_Historical.3.a: "Négocions avec eux, nous pourrons au moins mettre en oeuvre certaines de leurs demandes"
 VIE_Historical.3.b: "Pas de compromis, abattez-les."

 VIE_Historical.4.t: "La mort de Tran-Van-On"
 VIE_Historical.4.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Tran-Van-On a été abattu par notre police dans le premier district alors qu'il aidait un autre étudiant à franchir le mur d'un bâtiment gouvernemental. Il fut transporté à Cho-Ray et y mourut à trois heures et demie de l'après-midi.\n\nIl avait dix-neuf ans. Ce chiffre figure dans tous les rapports qui parviennent à ce bureau et sera publié dans tous les journaux d'ici la matinée, et il n'existe aucune version de l'incident dans laquelle ce n'est pas la première chose que l'on apprend.\n\nLa fusillade était censée mettre fin aux troubles et a fait le contraire avec une intégralité que personne n'avait imaginée. Les manifestations sont plus nombreuses ce soir qu'elles ne l'étaient ce matin et leur état d'esprit a changé : ce qui était une revendication de libération des prisonniers est en train de devenir autre chose. Les modérés du mouvement étudiant ont perdu l'argument face à ceux qui disaient depuis le début que ce gouvernement ne répond qu'à la force, et l'autorité française est désormais nommée dans le même souffle que la nôtre."
 VIE_Historical.4.a: "Il faut faire quelque chose rapidement !"

 VIE_Historical.6.t: "Négociations avec Tran-Van-On"
 VIE_Historical.6.d: "Saigon, [?global.date.GetDateStringNoHourLong] - L'ordre ayant disparu dans la ville et les manifestations se multipliant de jour en jour, le gouvernement a choisi de parler. [VIE.GetLeader] reçut Tran-Van-On à l'Hôtel de Ville au cours d'une réunion d'une heure peut-être, sans aucun fonctionnaire du Haut-Commissariat présent et aucun informé au préalable.\n\nCe qui a été concédé est modeste sur le papier : un régime plus libéral dans les prisons, une plus grande liberté académique et un engagement du gouvernement à promouvoir activement le patriotisme vietnamien et la culture vietnamienne. Les rues se sont vidées en deux jours, soit plus que ce que la gendarmerie a réalisé en quinze jours.\n\nParis est furieux. Une lettre de protestation est arrivée avant que l'encre du communiqué ne soit sèche, affirmant que les concessions compromettaient la stabilité et ouvraient les écoles à l'infiltration communiste. La lettre ne dit pas autre chose, c'est-à-dire que le gouvernement vietnamien a réglé une querelle vietnamienne sans rien demander, et que le précédent est pire pour le Haut-Commissariat que n'importe quelle réforme."
 VIE_Historical.6.a: "C'est le « meilleur résultat »."

 VIE_Historical.7.t: "Funérailles de Tran-Van-On"
 VIE_Historical.7.d: "Saigon, [?global.date.GetDateStringNoHourLong] - L'autorisation a été accordée et Tran-Van-On est resté en état pendant trois jours dans une maison d'adieu de la rue Thuan-Kieu. Un autel funéraire et une tablette spirituelle ont été érigés à l'école Petrus Ky, où les élèves sont venus en classe avec des brassards noirs et n'ont pas été arrêtés.\n\nDurant ces trois jours, les personnes en deuil étaient des ouvriers, des intellectuels, des hommes d'affaires, des fonctionnaires, des artistes, des journalistes et des étudiants, et ils ont laissé derrière eux plus de trois cents couronnes. L'une des couronnes provenait des \"Soldats démocrates\" français, détail que notre propre presse a été invitée à laisser de côté.\n\nLes funérailles ont attiré quelque vingt-cinq mille personnes dans le cortège lui-même et peut-être trois cent mille autres dans les rues pour le regarder passer. Elle était dirigée par l'ingénieur Luu-Van-Lang, l'avocat Trinh-Dinh-Thao, Nguyen-Huu-Tho et un certain nombre d'hommes dont la Sûreté tient des dossiers, et elle se terminait au cimetière de Cho-Lon. Un écolier abattu lors d'une manifestation a donné lieu au plus grand rassemblement que cette ville ait connu depuis la guerre."
 VIE_Historical.7.a: "C'est terminé... pour l'instant ?"

 VIE_Historical.8.t: "Création de la Société de la Croix-Rouge"
 VIE_Historical.8.d: "Le docteur Ho-Van-Nhut a fondé la Hoi Hong-Thap-Tu, la Société de la Croix-Rouge, et le Comité international a accepté l'affiliation avec une rapidité inhabituelle. Elle porte le nom de la Croix-Rouge vietnamienne et travaille depuis une maison de la rue Hong-Thap-Tu à Saigon.\n\nSa nécessité ne nécessite aucun argument. Entre la guerre et une série d'inondations, la médecine de base est en panne depuis trois ans dans les provinces, et l'administration civile n'a ni le personnel ni la capacité d'atteindre les endroits où elle échoue le plus.\n\nNhut a rassemblé l'argent et l'a dépensé rapidement. Il y a un quartier général, il y a la première école d'infirmières du sud dirigée et enseignée par des Vietnamiens, il y a un cours gratuit de premiers secours ouvert à tous ceux qui s'y rendent, et il y a des cliniques pour les pauvres dans des districts qui n'ont jamais vu de médecin payé par qui que ce soit. C'est l'argument de Khai-Tri, avancé en briques et en bandages : qu'un peuple éduqué et traité par ses propres mains est déjà à moitié chemin pour se gouverner lui-même."
 VIE_Historical.8.a: "Heureux de voir que la cause Khai-tri est toujours d'actualité"

 VIE_Historical.9.t: "Le retour du capitaine d'Hers"
 VIE_Historical.9.d: "Le capitaine Jean d'Hers de la gendarmerie française s'est vu refuser une affectation en France métropolitaine en 1940 et a passé le reste de sa guerre en Indochine, collectant d'abord des renseignements pour les Alliés puis, une fois que les Japonais en ont pris le contrôle total en 1945, les combattant dans les collines avec tous les hommes qu'il pouvait recruter. Il fit sauter des ponts, tendit une embuscade à des colonnes et fut tué en menant une poignée d'entre elles contre deux cents soldats japonais.\n\nSon corps et ceux de ses compagnons ont été exhumés de la jungle cochinchine où ils ont été enterrés, et transportés à travers Saigon jusqu'aux quais par un cortège de gendarmes et de vieux résistants, pour être acheminés vers la France. La ville était calme tandis que le navire franchissait le fleuve.\n\nIl n'y a aucune contestation sur ce que l'homme a fait. Il y a beaucoup de controverses sur le but des funérailles. Pour la communauté française, c'était l'honneur d'un héros et c'était organisé comme tel. Pour bon nombre de Vietnamiens qui regardaient depuis le trottoir, c'était un ordre colonial de rassembler ses morts et de les emmener, et ils lisaient la procession comme un départ plutôt que comme un hommage. Notre gouvernement doit décider laquelle de ces significations il souhaite soutenir en public."
 VIE_Historical.9.a: "Honorez le héros déchu"
 VIE_Historical.9.b: "Concentrez-vous sur l'avenir"

 VIE_Historical.10.ta: "La tentative contre le gouverneur Thai-Lap-Thanh échoue"
 VIE_Historical.10.tb: "Le gouverneur Thai-Lap-Thanh et le général Chanson assassinés"
 VIE_Historical.10.tac: "Thai-Lap-Thanh et Chanson s'éloignent"
 VIE_Historical.10.tbc: "Le meurtre de Thai-Lap-Thanh et Chanson"
 VIE_Historical.10.da: "Une tentative d'assassinat visant le gouverneur et maire de Saigon-Cholon Thai-Lap-Thanh et le général Charles Chanson, commandant du Corps expéditionnaire français (CEFEO) en Indochine du Sud, a secoué aujourd'hui la ville méridionale de Sadec. Alors que les deux dirigeants arrivaient pour une tournée d'inspection, un homme en tenue militaire a franchi le périmètre de sécurité et a fait exploser plusieurs grenades près de leur véhicule Delage D8.\n\nDes réflexes rapides et de la pure chance ont épargné aux deux hommes une mort certaine. Alors que le gouverneur Thai a été légèrement blessé par des éclats d'obus et que le général Chanson a été temporairement assourdi par l'explosion, tous deux se rétablissent désormais et ont juré de poursuivre leurs fonctions.\n\nL'agresseur, identifié comme membre de la milice Thanh-nien Bao-Quoc ((Groupe de jeunesse pour la défense de la patrie)) soupçonné de liens avec le Viet-minh, a été tué sur le coup dans l'explosion. Les forces de sécurité sont en état d'alerte et une enquête majeure est en cours pour démanteler tous les réseaux liés au complot manqué."
 VIE_Historical.10.db: "Un deuil national saisit notre nation alors que le bien-aimé gouverneur et maire de Saigon-Cholon Thai-Lap-Thanh et le général Charles Chanson, commandant du Corps expéditionnaire français (CEFEO) dans le sud de l'Indochine, ont été assassinés lors d'une violente attaque lors d'une tournée d'inspection officielle à Sadec.\n\nAlors que leur voiture ralentissait près de l'hôtel de ville de Sa-dec, un homme vêtu d'un uniforme kaki a franchi le cordon de sécurité et a fait exploser huit grenades enveloppées dans du plastique, tuant les deux hommes et blessant plusieurs officiers de haut rang. L'agresseur a été identifié comme un militant du Thanh-nien Bao-quoc (Groupe de jeunes pour la défense de la patrie) - un groupe paramilitaire nationaliste - mais des renseignements récents suggèrent des liens profonds et secrets avec le Viet-minh.\n\nCette frappe ciblée a porté un coup dur aux dirigeants administratifs et militaires du Sud. Avec les rumeurs d'une influence communiste plus large au sein des sectes anticoloniales, une nouvelle vague d'instabilité politique pourrait se profiler à l'horizon."
 VIE_Historical.10.dac: "Une opération coordonnée par des sympathisants clandestins de Thanh Nien Bao Quoc Milita n'a pas réussi à éliminer les principaux collaborateurs coloniaux de Sadec. Le gouverneur Thai Lap Thanh et le général Charles Chanson, tous deux symboles de la domination et de la répression françaises, ont échappé de peu à la mort lorsqu'un kamikaze a fait exploser des grenades près de leur véhicule.\n\nMême si plusieurs officiers et civils ont été blessés, les principales cibles ont survécu. Les renseignements confirment que l'attaquant avait un alignement idéologique direct sur le Front de libération nationale, même si nous ne commandions pas directement l'opération. L'échec de la grève, bien que courageuse, risque de resserrer l'emprise coloniale sur Saigon et d'approfondir la méfiance entre factions au sein du mouvement anticolonial.\n\nLes efforts de propagande doivent désormais gérer soigneusement les retombées pour préserver le moral et empêcher les représailles d'aliéner notre base plus large."
 VIE_Historical.10.dbc: "Les nouvelles du delta du Mékong résonnent à travers la résistance : le gouverneur Thai Lap Thanh, longtemps laquais foncier des Français, et le général Charles Chanson, chef des forces expéditionnaires du Sud, ont été assassinés au coeur de Sadec.\n\nBien que l'attaque ait été officiellement menée par un membre des paramilitaires Thanh Nien Bao Quoc, les rumeurs de notre réseau confirment que l'assassin avait de profondes sympathies pour la cause du Viet Minh et entretenait des liens secrets actifs avec nos agents. Son sacrifice est une autre fissure dans la structure de gouvernance fantoche.\n\nAlors que des hommes de main sud-vietnamiens se démènent maintenant pour assurer leur leadership et leur commandement français en plein désarroi, nos bureaux de propagande saluent déjà cette action comme une victoire pour la libération nationale et un martyre pour la cause révolutionnaire."
 VIE_Historical.10.a: "Nous devons améliorer la protection de nos fonctionnaires"
 VIE_Historical.10.b: "Un adieu à un ami bien-aimé du peuple"
 VIE_Historical.10.ac: "Même en cas d'échec, la flamme de la résistance brûle plus fort"
 VIE_Historical.10.bc: "Depuis l'ombre, la révolution aiguise sa lame."

 VIE_Historical.11.t: "Kiep-Hoa, le premier long métrage de la République"
 VIE_Historical.11.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le grand écran du Sud ouvre un nouveau chapitre avec l'arrivée de Kiep-Hoa (La vie d'une fleur), réalisé par Doan-Hai-Thanh et écrit par Nguyen-Kim-Thanh. Le mélodrame a été créé à Hanoï à la fin de 1953 et a été largement acclamé par le public, rapportant jusqu'à dix millions de dongs et devenant l'un des grands succès cinématographiques de son année.\n\nTouchant désormais le public du Sud, Kiep-Hoa raconte une histoire d'amour, de déplacement et de difficultés endurées par les Vietnamiens ordinaires au cours des années de guerre. Il suit deux soeurs, Ngoc-Lan et Ngoc-Thuy, dont la vie est bouleversée par la mort de leur mère et la perte de leur maison. Séparées de Thien, l'homme que Lan aime, les soeurs luttent pour survivre à Hanoï, affrontant l'exploitation et la trahison avant de tenter de reconstruire leur vie grâce au modeste commerce de rue.\n\nLa fortune revient brièvement lorsque Lan retrouve Thien, seulement pour que la honte et le traumatisme de son passé menacent leur bonheur. À travers son héroïne tragique, Kiep-Hoa explore la vulnérabilité des femmes en temps de guerre, la cruauté de l'exploitation et le fragile espoir de retrouver la dignité au milieu du malheur.\n\nPour nous, le film est plus qu'un succès importé du Nord : c'est l'occasion de cultiver un cinéma national enraciné dans les histoires, la langue et les sentiments vietnamiens. Alors que les cinémas de Saigon se remplissent d'un public avide de contes familiers à l'écran, Kiep-Hoa constitue l'une des premières étapes de la culture cinématographique du Sud après la partition."
 VIE_Historical.11.a: "Nous devrions commencer à investir dans notre propre industrie cinématographique !"

 # Initial Cuong-De
 Initial_CuongDe.0.t: "Une offre inattendue"
 Initial_CuongDe.0.d: "Aujourd'hui, une lettre a été envoyée directement de Hoang-Nam-Hung au chef de l'État Bao-Dai, qui était un révolutionnaire de Phuc-Quoc et camarade en second du tristement célèbre collaborateur japonais en exil, le prince Cuong-De.\n\nCurieusement, le contenu de la lettre a été écrit directement par Hung et elle contient d'innombrables éloges à l'égard du chef de l'État et des réalisations de notre gouvernement dans notre lutte contre le communisme. La lettre se terminait ensuite par une offre personnelle de Hung lui-même de créer une unité d'élite de la milice anticommuniste en Cochinchine qui serait composée d'anciens Phuc-Quoc et d'anciens membres de l'IJA. Le Xac-Te a également pu confirmer les activités passées de Hung, notamment en tant qu'ancien général de division du KMT dans les années 1930, mais nous devrons repenser cette décision judicieusement. D'un côté, nous avons besoin de toute l'aide possible pour la cause de Quoc-Gia, mais il est confirmé que Hung continue de soutenir la cause de Cuong-De et qu'il sera difficile à contenir."
 Initial_CuongDe.0.a: "Un combat ! Nous mettrons votre talent à profit sur le champ de bataille !"
 Initial_CuongDe.0.b: "Nous ne pouvons proposer qu'un poste gouvernemental mineur pour des raisons de sécurité."

 Initial_CuongDe.1.t: "Les ambitions de Cuong-De"
 Initial_CuongDe.1.d: "Gia-Long, premier empereur de la dynastie Nguyen, a vécu la tragédie dévastatrice de survivre à son propre fils aîné, le prince Nguyen-Phuc-Canh, qui a laissé derrière lui un fils avant sa mort. Malgré cela, le trône fut transmis au quatrième fils de Gia-Long, Minh-Mang, ancêtre de notre actuel chef de l'Etat Bao-Dai. Mais le passé est revenu nous hanter une fois de plus, car Cuong-De, descendant du prince Canh, est devenu une véritable épine dans notre pied en utilisant son héritage pour promouvoir ses objectifs politiques personnels.\n\nFormé au Japon, Cuong-De était une figure clé du mouvement Dong Du (En route vers l'Est), qui a parrainé quelque 200 Vietnamiens pour étudier au Japon. Faisant face à de nombreuses persécutions de la part des Français, il échappa néanmoins à la capture et fonda le Viet-Nam Quang-Phuc Hoi (Organisation de restauration du Vietnam) aux côtés de Phan-Boi-Chau en 1911, dans l'espoir de renverser la domination coloniale française au Vietnam et d'établir une république démocratique. L'organisation n'a pas réussi à prendre de l'ampleur, paralysée par les arrestations de ses membres. Cuong-De n'abandonna cependant pas et créa plus tard la Viet-Nam Phuc-quoc Dong-minh Hoi (Ligue pour la restauration du Vietnam) en 1938 et tenta de solliciter le soutien du Japon.\n\nMaintenant que l'ordre a été rétabli dans notre pays et que les Français sont revenus, les ambitions de Cuong-De ne peuvent plus rester sans contrôle. Après avoir donné une conférence de presse publique déclarant son intention de retourner au Vietnam et de former une opposition à notre gouvernement, nous devons nous assurer que cet arrivant illégitime n'acquière pas davantage d'influence. Des propositions rédigées personnellement par Bao-Dai seront envoyées aux grandes puissances étrangères comme la France et les États-Unis, leur demandant d'ignorer Cuong-De, tandis qu'une protestation diplomatique sera adressée au Japon pour l'avoir accueilli comme citoyen."
 Initial_CuongDe.1.a: "Il sera relégué au rang des notes de bas de page de l'histoire."
 Initial_CuongDe.1.b: "Bao-Dai est un traître au Vietnam, Cuong-De est le seul moyen !"

 Initial_CuongDe.2.t: "Bao-Dai nous demande d'ignorer les lettres de Cuong-De"
 Initial_CuongDe.2.d: "Le gouvernement vietnamien nous a demandé de laisser sans réponse les lettres du prince Cuong-De. La demande est venue de leur ambassade, et elle a été faite avec bien plus d'urgence que ce que l'affaire semble justifier à première vue.\n\nLe prince n'est pas une proposition simple. Il veut que le Vietnam sorte des mains coloniales, ce qui est gênant, et il est pro-japonais bien avant la naissance de la plupart de nos fonctionnaires, ce qui est pire. En revanche, il n'est pas communiste, il a des partisans et il ne dépend actuellement de personne.\n\nIl existe donc deux manières de lire le fichier. Nous pouvons honorer la demande de Bao-Dai, refuser la correspondance et maintenir notre emprise sur le Vietnam selon les conditions que nous avons. Ou bien nous pouvons répondre aux lettres et découvrir si un prince sans ressources propres pourrait être amené à dépendre de nous au lieu d'un chef d'État qui a démontré qu'il ne pouvait pas gouverner."
 Initial_CuongDe.2.a: "Nous avons déjà suffisamment de problèmes dans l'état actuel des choses."

 Initial_CuongDe.3.t: "Bao-Dai nous condamne pour avoir hébergé Cuong-De"
 Initial_CuongDe.3.d: "Bao-Dai nous a attaqués publiquement pour avoir hébergé le traître Cuong-De, et le langage de sa déclaration laisse très peu de place à un règlement tranquille. Son gouvernement affirme que nous gardons le prince comme un instrument pour le saper, et a longuement répété les arguments contre son aptitude à gouverner : quarante ans de tentatives infructueuses de libération du Vietnam et une guerre menée du mauvais côté de celui-ci.\n\nLa véhémence est elle-même informative. Les déclarations de Cuong-De semblent trouver un public au Vietnam, et Saigon ne crierait pas s'il était confiant. Leur ambassadeur a été explicite auprès de notre ministère des Affaires étrangères : continuer à accueillir le prince nuirait aux relations et un embargo n'est pas à exclure. Les Français ont ajouté leur propre plainte, selon laquelle Cuong-De sape le rétablissement de l'ordre.\n\nLe prince a demandé à plusieurs reprises à être renvoyé chez lui. Personne n'a pu expliquer comment cela pourrait être organisé ; il ne peut pas débarquer à Saigon, et aucun pays tiers ne le transportera. Certains membres de nos services de renseignement ont proposé de simplement le faire traverser une frontière et de le laisser partir de là par ses propres moyens."
 Initial_CuongDe.3.a: "Refusez de commenter le sujet."
 Initial_CuongDe.3.b: "Cuong-De restera dans notre pays."
 Initial_CuongDe.3.c: "Nous devons expulser Cuong-De pour ses crimes de guerre pendant la Seconde Guerre mondiale."

 Initial_CuongDe.4.t: "Cuong-De annonce son retour au Vietnam"
 Initial_CuongDe.4.d: "Le prince Cuong-De a récemment déclaré son intention de retourner au Vietnam pour récupérer sa position d'empereur du Vietnam en tant que descendant du prince Nguyen-Phuc-Canh. Bien que cela puisse causer des problèmes au gouvernement Bao-Dai, seul le temps nous dira si Cuong-De parviendra ou non à atteindre son objectif."
 Initial_CuongDe.4.a: "C'est un homme ambitieux, gardons un oeil sur lui pour l'instant."

 Initial_CuongDe.5.t: "Le voyage de Cuong-De"
 Initial_CuongDe.5.d: "Selon certaines informations, le prince Cuong-De serait déguisé en route vers le Vietnam depuis Tokyo via Hong Kong et Bangkok. Il envisage de se faufiler au Vietnam en empruntant la route Hong Kong-Bangkok. Élaborons un plan pour l'intercepter à Bangkok et voyons si nous pouvons déjouer son complot visant à renverser Bao-Dai."
 Initial_CuongDe.5.a: "Un problème vite résolu."

 Initial_CuongDe.6.t: "Cuong-De à Bangkok"
 Initial_CuongDe.6.d: "À Bangkok, des agents ont repéré le prince Cuong-De déguisé. Il semblerait que le prince se déguise en Chinois avec un faux passeport. Avec le prince à leur portée, les agents commencent leur action pour l'arrêter, et le résultat est..."
 Initial_CuongDe.6.a: "Cuong-De est appréhendé."
 Initial_CuongDe.6.b: "Cuong-De échappe à notre emprise !"

 # Similar to Etat_du_Vietnam.1, except from Cuong-De's perspective
 Initial_CuongDe.7.t: "Bao-Dai annexe l'État provisoire de Cochinchine"
 Initial_CuongDe.7.d: "Le chef de l'État Bao-Dai a proclamé l'annexion de l'État provisoire de Cochinchine. Nam-Ky Quoc, gouvernée depuis la guerre comme une république semi-autonome dotée d'une assemblée propre, cesse d'exister et son territoire passe à l'État du Vietnam selon les termes convenus à l'Elysée en mars. L'Assemblée nationale française a donné son accord fin mai, le seul requis par la loi.\n\nPour ce gouvernement, c'est tout l'argument gagné sur le papier. La séparation de la Cochinchine a été le moyen par lequel Paris a maintenu le tiers le plus riche du pays en dehors de tout État vietnamien, et elle a constitué un reproche permanent à toutes les affirmations de Bao-Dai de parler en faveur d'un Vietnam unique. Il peut désormais dire que le pays est entier, et il entend le répéter souvent.\n\nLa réprimande n'a pas disparu ; il a seulement changé de mains. Les gens de Cuong-De qualifient déjà l'annexion de colis enveloppé par l'administration coloniale pour dissimuler le fait que rien sous le papier n'a bougé - les mêmes fonctionnaires, les mêmes garnisons, le même budget voté à Paris. Leur accusation est qu'un Vietnam unifié dirigé par un chef d'État complaisant vaut moins pour la nation qu'un Vietnam divisé dirigé par un dirigeant qui ne serait pas docile, et cette affirmation est écoutée."
 Initial_CuongDe.7.a: "Le temps presse"

 Initial_CuongDe.8.t: "La liste des réformes de Cuong-De"
 Initial_CuongDe.8.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le collaborateur exilé a de nouveau écrit au Chef de l'Etat. Ce n'est pas la première lettre de cette année et c'est la première à contenir une proposition concrète.\n\nCuong-De fait part de son inquiétude quant à l'avenir sombre du Vietnam et demande qu'une mission diplomatique soit envoyée au Japon pour conclure un traité commercial, qui, selon lui, de manière assez détaillée et chiffrée, ferait plus pour l'économie que tout ce qui est actuellement soumis au Parlement. Il se propose comme médiateur entre les deux parties et fait observer que ses relations japonaises verraient très probablement la chose approuvée.\n\nLes aspects économiques ne sont manifestement pas erronés, et c'est là toute la difficulté. Un homme exclu du pays propose un traité que le gouvernement ne pourrait pas négocier pour son propre compte et propose de le négocier en notre nom. Chaque mois où les lettres restent sans réponse est un mois pendant lequel il peut dire qu'il a proposé et que nous avons refusé."
 Initial_CuongDe.8.a: "Ignorons cela pour l'instant..."

 Initial_CuongDe.9.t: "Cuong-De exige des réformes urgentes"
 Initial_CuongDe.9.d: "Après d'innombrables tentatives pour prendre le pouvoir, puis se faisant prendre à Bangkok et à Hong Kong par les Xac-Te, le prince Cuong-De s'obstine toujours à envoyer des lettres au chef de l'État Bao-Dai. La dernière lettre contient des divagations politiques qui se terminent par six demandes adressées à notre gouvernement :\n\n    1. Créer une commission chargée de gérer et d'exercer le pouvoir pour « subvenir aux besoins du peuple ».\n    2. Conserver les fonctionnaires français comme « amis du peuple ».\n    3. Créer une commission chargée de s'occuper des personnes, en particulier des membres de la famille royale.\n    4. Création d'une commission de traduction des ouvrages vietnamiens relatifs à l'hygiène.\n    5. Équipez chaque village de haut-parleurs et de lignes télégraphiques.\n    6. Adopter une attitude généreuse dans la lutte contre les communistes et l'opposition.\n\nLa lettre se terminait alors par une autre demande du prince exilé. Une demande d'envoi d'un mandarin au Japon pour établir des échanges économiques avec le Japon."
 Initial_CuongDe.9.a: "Pouvons-nous le mettre sur liste noire de la Poste ?"
 Initial_CuongDe.9.b: "Peut-être pourrions-nous examiner sa proposition commerciale japonaise."

 Initial_CuongDe.10.t: "[GetVIEChiefOfState] Propose des liens économiques"
 Initial_CuongDe.10.d: "Le gouvernement vietnamien a envoyé une proposition formelle au Japon visant à établir des liens économiques plus étroits entre les deux nations. La proposition comprend des dispositions relatives aux accords commerciaux, aux opportunités d'investissement et à la coopération technique dans divers secteurs.\n\nCette initiative représente l'intérêt du Vietnam à diversifier ses relations économiques et à réduire sa dépendance à l'égard des puissances occidentales. Pour le Japon, cela offre un accès aux marchés et aux ressources de l'Asie du Sud-Est, ainsi qu'une opportunité d'étendre son influence dans la région.\n\nLa proposition a été accueillie avec intérêt à Tokyo, où les responsables étudient les avantages potentiels d'une coopération économique plus étroite avec le Vietnam. La relation pourrait être mutuellement bénéfique, le Japon fournissant des technologies et des investissements tandis que le Vietnam offre des marchés et des ressources.\n\nReste à savoir si cette proposition aboutira à un partenariat économique formel, mais elle représente une étape importante dans la construction des relations entre les deux nations asiatiques."
 Initial_CuongDe.10.a: "Nous attendons avec impatience leur réponse."

 # Cuong-De
 CuongDe.1.t: "Cuong-De repéré à Tay-Ninh"
 CuongDe.1.d: "Récemment, la nouvelle de l'arrivée du prince Cuong-De à Tay-Ninh n'est pas passée inaperçue auprès du gouvernement vietnamien. Il semble que l'arrivée de Cuong-De à Tay-Ninh ait rallié de nombreux partisans caodaïstes et non-caodaïstes contre le gouvernement de Bao-Dai. Bao-Dai peut choisir d'agir maintenant pour étouffer toute chance de voir Cuong-De reprendre le trône impérial ou d'ignorer ce problème pour l'instant puisque la nation est toujours en guerre."
 CuongDe.1.a: "Nous devons agir maintenant."

 CuongDe.2.t: "Xac-Te met en garde contre l'influence croissante de Cuong-De"
 CuongDe.2.d: "Les Xac-Te ont déposé un rapport sur le bureau du chef de l'État, dont la substance tient en une phrase : Cuong-De a gagné la bataille. La promesse du prince de libérer le Vietnam de la domination coloniale est répétée là où nos propres émissions ne parviennent pas, par des gens qui ne l'ont jamais vu.\n\nIl y a pire dans le corps du rapport. Des récits non confirmés mais concordants montrent que ses agents se rapprocheraient des Britanniques et des Américains, leur proposant un nationalisme vietnamien anticommuniste sans être français. Si l'un ou l'autre gouvernement prenait cette offre au sérieux, notre position deviendrait très rapidement difficile.\n\nLes Xac-Te n'ont pas pour habitude de rédiger des articles et l'ont fait ici. Leur évaluation est que le mouvement du prince peut encore être brisé, qu'il ne le restera pas très longtemps, et que l'inaction est en soi une décision dont le chef de l'État répondra."
 CuongDe.2.a: "Sérieusement, nous devons agir au plus vite."

 CuongDe.3.t: "Un plaidoyer de Cuong-De"
 CuongDe.3.d: "Nous avons reçu des informations faisant état d'une tentative du prince Cuong-De d'apaiser le gouvernement colonial français. Il semble que le prince Cuong-De tente de convaincre le gouvernement français que Bao-Dai est incompétent et qu'il serait un meilleur dirigeant pour le Vietnam si les Français soutenaient sa candidature au pouvoir. Si Bao-Dai n'agit pas rapidement, il perdra son pouvoir et devra passer son temps en exil."
 CuongDe.3.a: "Espérons qu'ils n'aient pas d'idées brillantes."
 CuongDe.3.b: "Cuong-De est l'option la plus raisonnable."

 CuongDe.4.t: "Cuong-De s'enfuit au Japon !"
 CuongDe.4.d: "Le prince a perdu. Tous les calculs des deux dernières années supposaient que Bao-Dai pourrait être déjoué, et Bao-Dai ne l'a pas été. Le complot est brisé, les hommes derrière sont dispersés et Cuong-De est à bord d'un navire.\n\nIl se rend à Tokyo, où il a passé les quarante dernières années et où la famille Ando l'accueillera à nouveau. Il est interdit de séjour au Vietnam pour le reste de sa vie par décret, et cette fois, le décret soutient un gouvernement qui l'a battu plutôt qu'un gouvernement qui ne l'aimait pas simplement.\n\nVoilà la revendication impériale terminée. Cela devrait être une pensée tout à fait confortable, et ce n'est pas le cas : le prince s'est approché beaucoup plus près que quiconque dans le palais ne l'avait admis à l'époque, et les hommes qui l'ont soutenu n'ont pas été arrêtés. Ils n'ont été que déçus."
 CuongDe.4.a: "Trop proche pour le confort."

 CuongDe.5.t: "Cuong-De couronné chef du Vietnam ?"
 CuongDe.5.d: "Le coup d'État a eu lieu et Cuong-De a accédé au trône en tant qu'empereur Nam-Hung de l'État populaire du Vietnam.\n\nLe discours du couronnement était plus long au programme qu'à la cérémonie. Il s'est engagé à éliminer la corruption de Bao-Dai du gouvernement, à mener à bien les réformes promises à ce pays depuis une décennie, à régler la question sectaire et à unifier le Vietnam sous une administration unique. Ses propres partisans ont applaudi chaque clause du texte. Un certain nombre de gouvernements étrangers ont déclaré, prudemment, qu'ils notaient ce changement avec intérêt.\n\nPas un mot n'en a encore été dit. Il détient le palais, la capitale et la loyauté d'une coalition réunie dans le but de destituer un homme - et cette coalition a maintenant accompli la seule chose sur laquelle tous ses membres étaient d'accord."
 CuongDe.5.a: "Il l'a effectivement fait."

 CuongDe.6.t: "Purge de l'armée de Bao-Dai"
 CuongDe.6.d: "Ce matin, l'empereur Nam-Hung a annoncé le départ à la retraite de nombreux généraux fidèles à Bao-Dai. Bien que cette décision ait reçu une large approbation de la part des citoyens et de ceux qui détestent Bao-Dai, de nombreux loyalistes de Bao-Dai n'ont évidemment pas bien pris cette nouvelle. Quoi qu'il en soit, avec tous les loyalistes de Bao-Dai purgés, l'empereur sera moins susceptible de faire face à une quelconque résistance de la part de Bao-Dai."
 CuongDe.6.a: "Bon débarras"

 CuongDe.7.t: "Bao-Dai s'installe à Paris"
 CuongDe.7.d: "Bao-Dai a quitté le pays. Le peuple était déjà parti, la classe politique vietnamienne est passée ensuite, et quand Paris a cessé de répondre à ses appels, plus rien ne l'arrêtait. Le retrait par l'Empereur de ses fidèles des ministères et de l'état-major en supprima les derniers.\n\nLe décret de Phu-Xuan est permanent. Il est condamné à l'exil et interdit de remettre les pieds au Vietnam, et il prend l'avion pour la France sans contester. Il a été vu pour la dernière fois à Paris, où il a toujours été le plus à l'aise et où il restera désormais.\n\nC'est tout son palmarès : dernier empereur des Nguyen, premier chef d'État d'une république vietnamienne, et premier des deux à mettre fin à ses jours dans un appartement français. Ses ennemis diront qu'il n'a jamais été qu'une nomination française. Il serait plus précis, et moins confortable, de dire qu'il était l'arrangement que ce pays a essayé avant de nous essayer."
 CuongDe.7.a: "Au revoir Bao-Dai."

 CuongDe.8.t: "L'idée Dan-Vuong de Nam-Hung"
 CuongDe.8.d: "L'Empereur a publié la doctrine par laquelle il entend régner, et ce n'est la doctrine d'aucun empereur avant lui. Il l'appelle « Dan-Vuong », monarchie populaire, et, de son propre aveu, il y a travaillé pendant la plus grande partie de son exil.\n\nLa construction marie les Trois Principes de Sun Yat-Sen au trône. Le souverain exerce la fonction exécutive et l'exerce dans l'intérêt commun ; un parlement doté de pouvoirs réels détient le pouvoir législatif. Il ne s'agit ni du système impérial ni d'une république, et il n'est pas proposé comme une étape vers l'un ou l'autre.\n\nL'argument en faveur de ce point est que le Vietnam ne peut pas revenir à un empereur qui règne sans gouverner, et ne pourrait pas survivre à une république qui a passé sa première décennie à décider qui avait le droit de la diriger. La question de savoir si une doctrine peut maintenir ce juste milieu face aux pressions qui pèsent actuellement sur ce pays est précisément ce que décideront les prochaines années."
 CuongDe.8.a: "Une nouvelle idée pour une nouvelle ère !"

 # Event for Japan
 CuongDe.9.t: "La quête de collaboration économique de Nam-Hung"
 CuongDe.9.d: "L'empereur du Vietnam Nam-Hung a personnellement envoyé un télégramme à notre gouvernement, demandant une mission diplomatique à Tokyo pour établir une collaboration économique entre les deux nations. Le télégramme comprend également un remerciement à notre gouvernement pour avoir soutenu la cause de l'Empereur et aidé l'Empereur à regagner le trône du Vietnam."
 CuongDe.9.a: "Voyons ce qu'ils ont à dire."

 CuongDe.10.t: "Un télégraphe à nos bienfaiteurs"
 CuongDe.10.d: "Le ministère des Relations extérieures a passé une semaine à aider l'Empereur à rédiger un unique télégramme, qui dit l'essentiel de ce qu'il y a à dire sur la délicatesse de l'exercice. Elle s'adresse au Président [FRA.GetLeader], au ministère des Outre-mer et à l'Assemblée, et elle doit remercier une puissance coloniale pour son aide sans admettre que cette aide lui soit jamais due.\n\nLe texte propose une \"Association d'amitié\" pour poursuivre les échanges culturels et les missions diplomatiques entre les deux pays. Il porte les remerciements personnels de l'Empereur pour l'aide française à notre cause. Il se termine sur la guerre contre les marxistes du Nord, formulé de manière à ce que Paris puisse le lire comme une demande de davantage et que nos propres journaux puissent le lire comme une déclaration de confiance.\n\nRien de tout cela n'est de l'affection. L'Empereur est arrivé au trône malgré les objections françaises et aux dépens d'un client français, et cela n'est pas oublié rue Oudinot. Le télégramme existe pour rendre coûteuse l'action sur la mémoire."
 CuongDe.10.a: "Espérons qu'ils seront satisfaits pour l'instant."

 CuongDe.11.t: "Un télégraphe de Nam-Hung"
 CuongDe.11.d: "Un télégramme est arrivé de Phu-Xuan, signé personnellement par le nouvel empereur du Vietnam et adressé au président [FRA.GetLeader], au ministère de la France d'outre-mer et à l'Assemblée ensemble. Il s'ouvre en souhaitant à la République une vie pleine de richesses, de bonheur et de prospérité, qui est soit une courtoisie, soit une comédie selon le lecteur.\n\nIl propose une association d'amitié pour assurer les échanges culturels et les missions diplomatiques entre les deux pays, et il est rédigé avec plus de soin que ne le suggère le message d'accueil. Rien n'y demande rien, ce qui dans une première communication d'un souverain que nous n'avons pas choisi est en soi une manoeuvre.\n\nLe problème est dans le dernier paragraphe. Nam-Hung nous remercie longuement d'avoir préféré la solution Cuong-De à la solution ratée Bao-Dai dans la situation actuelle, et s'engage à ne pas dormir ni s'arrêter jusqu'à ce que la paix et l'ordre soient rétablis en Indochine. Il nous remercie d'une décision à laquelle le Quai d'Orsay a résisté pendant deux ans et il l'a mise par écrit pour que nous ne puissions pas prétendre le contraire."
 CuongDe.11.a: "Peut-être que notre choix était le bon depuis le début."

 CuongDe.12.t: "Les réformes du travail Buu-Nhu"
 CuongDe.12.d: "Après des mois de pression, Ngo-Dinh-Nhu et Tran-Quoc-Buu ont fait passer leurs projets de loi sur le travail au Parlement avec le soutien de l'Empereur. Les mesures sont modestes à première vue : les organisations de travailleurs sont légalisées, les salaires sont fixés à un plancher de 250 dongs de l'heure et les soins médicaux pour les travailleurs sont gratuits sur le lieu d'utilisation.\n\nL'accueil a été tout sauf modeste. Les projets de loi furent connus dans tous les districts ouvriers du sud en quelques jours, et l'empereur, Nhu et Buu sont maintenant présentés ensemble comme des héros de la cause Can-Lao - une expression que ce gouvernement n'a pas inventée et ne peut pas facilement renier.\n\nCertains nationalistes ont qualifié le paquet de marxiste, sauf le nom, et ils n'ont pas entièrement tort quant à l'endroit où ses auteurs ont appris leur métier. La plupart des organisations politiques ont adopté un point de vue différent : c'est la première fois que le gouvernement fait ce que le Manifeste Dan-Vuong a annoncé qu'il ferait. \"...nous veillerons à ce que chacune de nos décisions, luttes et objectifs soit pleinement aligné sur les objectifs et désirs communs des travailleurs...\""
 CuongDe.12.a: "La première étape pour offrir aux masses laborieuses un foyer confortable et un repas savoureux !"

 CuongDe.13.t: "Du-So 4/HD/DP"
 CuongDe.13.d: "Le vote est de cinquante et un contre quarante-neuf. \"Du-So 4/HD/DP\" passe, après des mois de retard et de disputes entre l'Empereur, le Parlement et le Front National Populaire.\n\nLe Du a été parmi les premières réformes proposées au début du règne, et la clause qui l'a retardé est celle qui suspend indéfiniment l'activité de tout parti et organisation politique en dehors du Phuc-Quoc Hoi, pour la sécurité et la stabilité du pays en temps de guerre. Les parties concernées ont eu des mois pour dire ce qu'elles en pensaient et elles ont utilisé chacune d'entre elles.\n\nDeux votes ont tranché la question. Lorsque la ratification sera signée, les organisations qui s'y sont opposées cesseront d'exister juridiquement, et bon nombre des hommes qui ont voté contre ce matin se retrouveront en dehors du seul parti qui reste."
 CuongDe.13.a: "Un mal nécessaire."

 CuongDe.14.t: "Décevant, mais attendu"
 CuongDe.14.d: "La réponse de la communauté internationale à nos demandes de soutien a été décevante, bien que pas totalement inattendue. De nombreux pays ont hésité à consacrer des ressources importantes à notre cause, invoquant leurs propres priorités et craintes de s'impliquer dans un autre conflit.\n\nBien que nous ayons reçu quelques expressions de sympathie et une aide limitée, le niveau de soutien que nous espérions ne s'est pas concrétisé. C'est frustrant, mais c'est aussi une réalité que nous devons accepter. Le monde est concentré sur d'autres problèmes et la lutte du Vietnam, bien qu'importante pour nous, n'est pas au premier rang des priorités de tous.\n\nIl ne faut cependant pas se décourager. Nous continuerons de faire valoir notre cause auprès de la communauté internationale et nous continuerons à lutter pour notre indépendance et notre avenir, avec ou sans soutien extérieur. Notre cause est juste et nous persévérerons.\n\nCette déception nous rappelle que nous devons compter avant tout sur notre propre force et notre détermination. Nous ne pouvons pas compter sur les autres pour nous sauver : nous devons nous sauver nous-mêmes."
 CuongDe.14.a: "Nous continuerons notre lutte malgré tout."

 CuongDe.15.t: "Notre cause est entendue"
 CuongDe.15.d: "Excellente nouvelle ! Nos efforts diplomatiques ont porté leurs fruits et nous avons reçu un soutien important de la part de partenaires internationaux clés. Les États-Unis et le Japon ont répondu positivement à nos demandes, en fournissant à la fois une aide matérielle et un soutien diplomatique.\n\nCe soutien comprend des équipements militaires, une aide économique et une reconnaissance politique de notre gouvernement. Cette aide contribuera à renforcer notre position et nous permettra de mieux résister à la menace communiste venant du Nord.\n\nLa réponse de la communauté internationale démontre que notre cause est entendue et qu'il existe des nations disposées à nous soutenir dans notre lutte. Ce soutien n'est pas seulement une question d'aide matérielle, il s'agit également d'une reconnaissance et d'une légitimité, qui sont cruciales pour notre réussite à long terme.\n\nNous sommes reconnaissants pour cette aide et nous l'utiliserons judicieusement pour faire avancer nos objectifs. Grâce à ce soutien, nous sommes mieux placés pour atteindre nos objectifs et assurer un avenir meilleur au Vietnam."
 CuongDe.15.a: "Nous ne sommes pas seuls dans cette lutte."

 CuongDe.16.t: "L'empereur Nam-Hung dévoile le nouveau drapeau national du Vietnam"
 CuongDe.16.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - L'Empereur a dévoilé le drapeau national, lors d'une cérémonie organisée pour ne laisser aucun doute sur le fait que le dessin a été réglé par lui et non par un comité. Il reprend les trois bandes rouges de l'ancien Etat du Vietnam et les marie à la bannière proposée par l'Association Phuc-Quoc en exil.\n\nLes trois groupes sont disposés pour former le caractère « Vuong » - la royauté - et représentent le mandat du ciel, de la nation vietnamienne et du gouvernement révolutionnaire. En dessous se trouve une barre blanche pour le pouvoir du peuple, pour l'égalité et pour la pureté. Le terrain est de l'or, pour l'unité et la richesse des régions vietnamiennes et des empereurs qui les détenaient.\n\nUn drapeau qui se lit comme une phrase est une affirmation sur la raison d'être de l'État, et celui-ci défend toute l'affaire Dan-Vuong dans un seul morceau de tissu : un empereur élu et les travailleurs dans le même dessin, sans qu'aucun ne soit placé au-dessus de l'autre. Que le pays l'interprète de cette façon est une autre affaire, et il survolera chaque bureau provincial d'ici la fin du mois."
 CuongDe.16.a: "La bannière du Dan-vuong régnera en maître !"

 CuongDe.17.t: "L'empereur est mort"
 CuongDe.17.d: "Le Cabinet du Roi a télégraphié au gouvernement et [GetVIEPremierTitle] [VIE.GetLeader]. L'Empereur est mort. Nam-Hung est décédé à l'Université de médecine de Phu-Xuan après un mois au cours duquel la maladie qu'il avait gardée pour lui pendant bien plus longtemps ne pouvait plus être cachée à personne. Elle a été diffusée dans tout le pays en une heure.\n\nL'Office a publié l'éloge funèbre ainsi que les mémoires qu'il a terminés cette année, son bilan révolutionnaire et les réalisations d'un règne qui a duré une fraction de l'exil qui l'a précédé. Ses dernières paroles enregistrées furent \"Phai dung lai Chien-cuoc nay...\" - nous devons arrêter cette guerre, transmettre cela à notre peuple - et avec elles il demanda que la patrie soit réunifiée et qu'elle s'oppose à l'impérialisme occidental.\n\nLe règne fut court. Le modèle Dan-Vuong ne l'est pas, et il est désormais la propriété de celui qui se révèle capable de le détenir. Un pays qui, de mémoire d'homme, était une colonie a dans cette région un poids qu'il n'avait pas il y a cinq ans, et les hommes qui hériteront de l'autorité du trône ont déjà commencé à compter ce qu'ils détiennent."
 CuongDe.17.a: "Repose en paix, notre bien-aimé Empereur."

 CuongDe.101.t: "[GetNewspaperHeader]Mort de Nam-Hung, empereur du Vietnam"
 CuongDe.101.d: "Phu Xuan, [?global.date.GetDateStringNoHourLong] - L'empereur Nam-Hung, connu avant son avènement sous le nom de Prince Cuong-De, est décédé à l'âge de 70 ans. Un télégramme officiel transmis aux Nations Unies en donne la cause comme un cancer du poumon et le lieu comme l'Université de médecine de Phu-Xuan, au terme d'une longue maladie que la cour n'avait pas rendue publique.\n\nDescendant direct de Gia-Long, Nam-Hung a passé plus de quarante ans en exil avant de revenir revendiquer le trône vietnamien dans une période de retrait colonial et de guerre idéologique. Son ascension reposait sur une coalition dont les membres ne s'accordaient que sur peu de choses au-delà de leur opposition aux Bao-Dai - les milices Cao-Dai, les officiers japonais qui ne sont jamais rentrés chez eux et les formations du Kuomintang qui avaient traversé la frontière chinoise - et elle s'est constituée beaucoup plus rapidement que quiconque ne l'espérait.\n\nSon règne fut bref et sa doctrine lui survivra probablement. Dan-Vuong, que ses partisans qualifient de monarchisme populaire, a cherché à fusionner l'autorité impériale avec le nationalisme révolutionnaire, et il n'existe désormais aucune main évidente pour maintenir les deux ensemble. Les partisans attribuent à l'empereur le mérite d'avoir conservé intacte une grande partie du Vietnam et de donner au pays une voix propre dans la région. Les critiques répondent que la coalition et le soutien étranger constituaient le règne, et que ni l'un ni l'autre ne peut être hérité."
 CuongDe.101.a: "Nous devons arrêter la guerre en Indochine."

 # Cuong-De Ngo-Dinh
 CuongDe_NgoDinh.1.t: "Les frères Ngo-Dinh échappent à l'arrestation !"
 CuongDe_NgoDinh.1.d: "Excellente nouvelle ! Avant que les agents de Bao-Dai n'arrivent chez le résident de Ngo-Dinh, nous avons réussi à les mettre en sécurité. Puisque Ngo-Dinh-Diem a été le partisan du prince Cuong-De avant même la guerre, recrutons également son frère Ngo-Dinh-Nhu à notre cause. La fuite du frère de Ngo-Dinh pourrait potentiellement être le début de la fin du régime de Bao-Dai."
 CuongDe_NgoDinh.1.a: "C'était proche."

 CuongDe_NgoDinh.2.t: "Bao-Dai a emprisonné les frères Ngo-Dinh !"
 CuongDe_NgoDinh.2.d: "Les Xac-Te atteignirent les résidences des Ngo-Dinh avant nous. Diem et Nhu ont été emmenés de chez eux sur mandat de Bao-Dai et sont détenus pour des charges que personne n'a pris la peine de préciser, et trois mois d'approche prudente n'ont abouti à rien.\n\nC'est une perte et non une défaite. Aucun des deux frères n'a été blessé, tous deux sont bien trop connus pour être éliminés en silence, et Bao-Dai vient de montrer à tout le pays qu'il a peur de deux hommes sans armée entre eux.\n\nL'oeuvre déménage à Paris. Si les Français peuvent être amenés au retour du prince, la libération des frères Ngo-Dinh devient une clause de l'accord plutôt qu'une faveur à mendier, et les hommes libérés par un nouveau souverain ont tendance à se rappeler quel nom figurait sur l'ordre."
 CuongDe_NgoDinh.2.a: "Maudit soit ce Bao-Dai."

 CuongDe_NgoDinh.3.t: "Recrutement des Frères Ngo-Dinh"
 CuongDe_NgoDinh.3.d: "Les frères étant sortis et en sécurité, l'offre leur a été soumise directement. Tous deux l'ont accepté.\n\nDiem n'a jamais vraiment douté. Il a soutenu la revendication du prince bien avant qu'il ne soit respectable de le faire, et a payé pour ce poste plus d'une fois. Ce qu'il apporte n'est pas un changement d'avis mais une réputation qui ne s'achète à aucun prix : le seul nationaliste de rang dans ce pays qui n'a jamais accepté l'argent français.\n\nNhu est le plus immédiatement utile des deux. Il rédige, et il rédige pour un public plutôt que pour un ministère, et le manifeste qui a fait de son frère une figure nationale était en grande partie son oeuvre. Une restauration a besoin que ses arguments soient présentés au peuple dans un langage que le peuple répétera. Nous avons maintenant l'homme qui peut l'écrire."
 CuongDe_NgoDinh.3.a: "Encore une victoire assurée."

 CuongDe_NgoDinh.4.t: "Tran-Le-Xuan et le Syndicat des femmes solidaires mènent les efforts de reboisement de Saigon"
 CuongDe_NgoDinh.4.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Tran-Le-Xuan et le Syndicat de Solidarité des Femmes ont achevé la première étape de la plantation, et la ligne de nouvelles pousses s'étend désormais de la périphérie de la ville jusqu'à Cat-Tien.\n\nLe terrain qu'il couvre était un terrain vague : bombardé, incendié lors des combats de la dernière décennie, et abandonné depuis parce qu'aucun ministère n'avait la main-d'oeuvre nécessaire pour tenter quoi que ce soit avec cela. Le Syndicat avait la main-d'oeuvre. Plusieurs milliers de femmes, organisées par district et travaillant dans le corridor en alternance sur deux saisons, ont investi ce que le ministère de l'Agriculture avait chiffré et mis de côté.\n\nLa ceinture retient le sol et ramène la nappe phréatique, ce qui, selon les agronomes, prendrait dix ans et a pris plutôt moins. Les villages qui le longent ont commencé à appeler ces peuplements les forêts de Tran-Le-Xuan, et Madame Nhu ne leur a pas demandé d'arrêter."
 CuongDe_NgoDinh.4.a: "Vraiment une femme révolutionnaire !"
 CuongDe_NgoDinh_4_hint_tt: "§GDans les mois à venir, les Phu-Nu Lien-Doi mèneront un grand effort de reboisement et d'agriculture à travers Dong-Nam-Phan.§!"
 CuongDe_NgoDinh_27_hint_tt: "§GLa construction des zones Tru-mat et de la grande Hoa-Luu Agroville a commencé ; nous célébrerons son inauguration dans les prochains mois§!"

 CuongDe_Annexation.1.t: "Les Highlands se préparent à la réunification"
 CuongDe_Annexation.1.d: "Après des années de liens croissants entre les dirigeants des Hauts Plateaux et le gouvernement vietnamien, les Hauts Plateaux autonomes ont officiellement annoncé leur intention de se réunifier avec le Vietnam. Les préparatifs administratifs pour un transfert ordonné du pouvoir ont commencé et une intégration complète est attendue dans les mois à venir."
 CuongDe_Annexation.1.a: "De retour au bercail !"

 CuongDe_Annexation.2.t: "Les Highlands reviennent au Vietnam"
 CuongDe_Annexation.2.d: "La période de transition est terminée : les territoires des Highlands ont été formellement réintégrés au Vietnam. Les peuples des Hauts Plateaux du Centre sont à nouveau sous administration vietnamienne et leurs forces de défense ont été incorporées à l'armée nationale."
 CuongDe_Annexation.2.a: "Le Vietnam grandit à nouveau !"

 DiemMarx.1.t: "Un infiltré découvert"
 DiemMarx.1.d: "L'un des cadres réhabilités déployés dans le cadre du programme Chieu-Hoi a été dénoncé comme un agent actif du Viet-Minh, alimentant depuis des mois des rapports sur l'organisation de notre parti vers le nord. L'appareil de sécurité de Can-Lao a procédé à l'arrestation en toute discrétion, mais la nouvelle circule dans les villages et la radio de Hanoï ne perd pas de temps à célébrer son « patriote du sud »."
 DiemMarx.1.a: "Les grâces ne sont pas accordées deux fois."

 CuongDe_NgoDinh.5.t: "Tran-Le-Xuan et le Syndicat des femmes solidaires promeuvent la lutte révolutionnaire et la libération féministe"
 CuongDe_NgoDinh.5.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Tran-Le-Xuan et le Syndicat des femmes solidaires sont passés de l'organisation à la législation, et les projets de loi qu'ils soumettent à l'Assemblée concernent le mariage et la famille.\n\nLe programme n'est pas ce qu'un lecteur français attend d'un mouvement de femmes. Le Syndicat fait campagne contre l'avortement forcé et contre l'adultère, pour protéger les femmes qui n'ont actuellement aucun recours légal contre leur mari ou leur employeur ; et contre les concours de beauté et la boxe, en tant que dégradations publiques, la République ne devrait pas autoriser.\n\nL'argument de Madame Nhu est que l'ordre traditionnel et la libération des femmes ne sont pas opposés mais ne font qu'un : qu'une femme soit libérée ensemble par la loi et par la dignité, ou qu'elle ne soit pas libérée du tout. Il a radicalisé un grand nombre de femmes qui n'auraient jamais adhéré à un parti et a fusionné la cause travailliste personnaliste avec un mouvement que ce gouvernement n'a pas créé et qu'il ne contrôle pas entièrement."
 CuongDe_NgoDinh.5.a: "Nous devons favoriser cette nouvelle culture révolutionnaire !"

 CuongDe_NgoDinh.6.t: "Le président Ngo-Dinh-Diem annonce la formation du Mouvement révolutionnaire national"
 CuongDe_NgoDinh.6.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Dans un développement politique historique, le président Ngo-Dinh-Diem a annoncé la formation du Mouvement révolutionnaire national (Phong-trao Cach-mang Quoc-Gia), une organisation faîtière de divers mouvements de masse au Vietnam alignés sur le Parti Cong-Nong du Vietnam. Cet organisme unifié vise à promouvoir le personnalisme travailliste et à garantir que toutes les organisations membres adhèrent à ses enseignements révolutionnaires, luttant fermement contre le capitalisme matérialiste et les forces réactionnaires. La conférence, rassemblant un large éventail d'idéologies et d'organisations politiques, a officiellement publié une déclaration établissant le Mouvement révolutionnaire national. Cette grande organisation politique unifiée comprend : le Front de résistance nationale vietnamienne (Cao-Dai), le Parti Dan Xa vietnamien (Hoa-Hao), la Jeunesse républicaine vietnamienne, la Jeunesse nationale (Cao-Dai), le Syndicat de solidarité des femmes, le Parti révolutionnaire vietnamien Cong-Nong, le Groupe spirituel, le Syndicat national révolutionnaire des fonctionnaires, les Bouddhistes de la Terre pure du Vietnam, la Société catholique, la Confédération générale du travail du Vietnam, l'Union des journalistes vietnamiens, le Mouvement syndical populaire vietnamien, la Société catholique. Groupe, Anciens combattants de la Résistance vietnamienne, Viet-Nam Quoc-Dan Dang, Mat-Tran Quoc-Dan, Viet-Nam Quang-Phuc Hoi. Cette coalition représente une étape importante vers la réalisation de l'unité nationale et la coordination des efforts entre divers secteurs de la société, renforçant ainsi la capacité du gouvernement à promouvoir le personnalisme travailliste."
 CuongDe_NgoDinh.6.a: "Tôt ou tard, la révolution sociale réussira !"

 CuongDe_NgoDinh.7.t: "Le président Ngo-Dinh-Diem annonce la réforme du Front populaire national"
 CuongDe_NgoDinh.7.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Dans une démarche attendue, le président Ngo-Dinh-Diem a annoncé la réforme du Front populaire national (Mat-tran Dan-quoc Quoc-Gia), une organisation faîtière de divers mouvements de masse au Vietnam alignés sur les idéaux de l'empereur Nam-Hung et de ses modèles Dan-vuong. Ce corps unifié a été formé à l'origine par l'empereur comme moyen de promouvoir les modèles Dan-vuong et l'unité nationale, mais il doit désormais également promouvoir le personnalisme travailliste et adhérer aux luttes pan-asiatiques de l'empereur et du président. La conférence, rassemblant un large éventail d'idéologies et d'organisations politiques, a officiellement publié une déclaration réformant le Front. Cette grande organisation politique unifiée comprend : le Front de résistance nationale du Vietnam (Cao-Dai), le Parti Dan Xa du Vietnam (Hoa-Hao), la Jeunesse républicaine du Vietnam, la Jeunesse nationale (Cao-Dai), le Syndicat de solidarité des femmes, le Parti révolutionnaire vietnamien Cong-Nong, le Groupe spirituel, le Syndicat national des fonctionnaires révolutionnaires, les Bouddhistes de la Terre pure du Vietnam, la Société catholique, la Confédération générale du travail du Vietnam, l'Union des journalistes vietnamiens, le Mouvement syndical du peuple vietnamien, le Groupe des citoyens, Anciens combattants de la Résistance vietnamienne, Viet-Nam Quoc-Dan Dang, Mat-Tran Quoc-Dan, Viet-Nam Quang-Phuc Hoi. Cette réforme représente une étape importante vers la réalisation de l'unité nationale et la coordination des efforts entre divers secteurs de la société, renforçant ainsi la capacité du gouvernement à promouvoir les enseignements révolutionnaires de l'empereur."
 CuongDe_NgoDinh.7.a: "Dan-Vuong, Can-Lao !"

 CuongDe_NgoDinh.8.t: "La Confédération vietnamienne du travail (CTVC) rejoint les rangs de Diem"
 CuongDe_NgoDinh.8.d: "Saigon, [?global.date.GetDateStringNoHourLong] - La Confédération des travailleurs vietnamiens (Tong-lien-doan Lao-cong Viet-Nam) est passée sous le patronage personnel de Ngo-Dinh-Nhu, frère et principal conseiller politique du président, et a été restructurée selon les lignes travaillistes personnalistes en un an. La Confédération revendique désormais un demi-million de membres. Personne n'a vérifié ce chiffre et personne dans les ministères n'est enclin à le faire.\n\nIl est dirigé par Tran-Quoc-Buu, qui a commandé pour le Viet Minh avant d'être syndicaliste et n'a jamais prétendu le contraire. Sous sa direction, le CVTC a multiplié ses services à ses membres, ouvert des syndicats coopératifs dans tout le sud et commencé à planifier une « ville ouvrière » pour loger la main-d'oeuvre urbaine à des loyers qu'un docker peut réellement atteindre.\n\nLe reste est plus calme et compte plus. Buu a créé des chambres mixtes de métiers entre les syndicats et les employeurs, ainsi qu'une chaîne de \"Coopératives Raiffeisen\" - des sociétés rurales d'épargne et de crédit sur le modèle allemand des années 1860 - parrainées par le Président lui-même par l'intermédiaire du ministère des Travaux publics et du Travail. Le crédit dans les villages est venu jusqu'à présent du propriétaire foncier ou du Viet Minh, et de personne d'autre."
 CuongDe_NgoDinh.8.a: "Nous visons la libération totale des prolétaires !"

 CuongDe_NgoDinh.9.t: "Kieu Cong Cung crée un commissariat à l'action civique et un bureau de réforme agraire"
 CuongDe_NgoDinh.9.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Kieu-cong-Cung, un ancien marxiste devenu personnaliste travailliste, a été nommé commissaire général du nouveau Commissariat spécial à l'action civique (Dac-uy Phu-Cong-Dan vu) (CDV) et président du Bureau de la réforme agraire (Nha Cai-cach Dien-dia) relevant du Cabinet du Premier ministre. Cette décision marque une étape importante vers une réforme agraire radicale au Sud-Vietnam. Le Commissariat spécial, composé des services centraux et du Bureau de la réforme agraire, a été chargé d'assurer la liaison avec les ministères concernés, d'élaborer des plans complets et de former les cadres nécessaires à la mise en oeuvre de ces réformes. Le quartier général temporaire du Commissariat, fourni par le ministère de la Défense, est équipé du mobilier, du matériel, des véhicules et des recrues militaires servant de personnel administratif. Sous la direction de Cung, le Commissariat à l'action civique vise à mener des politiques radicales de réforme agraire, mêlant le personnalisme travailliste aux principes marxistes pour résoudre les problèmes de répartition des terres et promouvoir l'égalité sociale au Sud-Vietnam. Cette initiative marque un effort crucial pour transformer le paysage agricole et améliorer la vie des communautés rurales."
 CuongDe_NgoDinh.9.a: "Cung nous aidera à conquérir le coeur des agriculteurs ordinaires"

 CuongDe_NgoDinh.10.t: "La politique révolutionnaire personnaliste du travailliste du président Ngo-Dinh-Diem dévoilée"
 CuongDe_NgoDinh.10.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le président Ngo-Dinh-Diem a dévoilé la première série de politiques travaillistes personnalistes transformatrices visant à remodeler la société et à favoriser le progrès économique et social au Sud-Vietnam pendant la révolution sociale. Guerre contre les quatre péchés : Diem a lancé une campagne globale contre l'alcoolisme, le jeu, la prostitution et la toxicomanie. Cet effort vise non seulement à purifier la société mais aussi à renforcer ses fondements moraux, en promouvant une population vertueuse et disciplinée. Programme de bien-être populaire : pierre angulaire du programme de Diem, ce programme se concentre sur l'expansion des services sociaux, des soins de santé et de l'éducation pour améliorer le bien-être de tous les citoyens. En donnant la priorité à ces domaines, le gouvernement cherche à améliorer le niveau de vie et à garantir l'égalité d'accès aux services essentiels."
 CuongDe_NgoDinh.10.a: "Nous sommes les libérateurs du peuple Can-Lao !"

 CuongDe_NgoDinh.11.t: "Le président Ngo-Dinh-Diem annonce la politique d'Agroville"
 CuongDe_NgoDinh.11.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le Président a défini trois mesures dans le cadre du programme travailliste personnaliste et les a présentées comme un seul projet plutôt que comme trois décrets.\n\nLe premier est le programme d'agro-crédit. Les agriculteurs doivent bénéficier d'une aide avancée en contrepartie de leurs contributions et de leur production, enregistrée non pas en piastres mais en \"Nong-Tin\", une unité émise par l'État et échangeable uniquement au sein du système coopératif. L'objectif affiché est une production accrue et une autosuffisance alimentaire. L'objectif tacite est d'éloigner complètement les campagnes des devises françaises et étrangères.\n\nLe deuxième est le programme Agroville : des établissements ruraux planifiés, construits à neuf, dans lesquels sont rassemblés les habitants de hameaux dispersés. Le gouvernement les décrit comme des instruments de cohésion sociale et de développement rural. Ils sont également défendables, et les districts choisis en premier sont ceux dans lesquels les insurgés se déplacent le plus librement.\n\nLe troisième est un slogan : « Faites progresser le mouvement travailliste, tous atteindront le socialisme » et il ne faut pas le considérer comme un ornement. C'est la formule par laquelle un président catholique gouvernant grâce au crédit américain propose de retirer le vocabulaire de la révolution aux hommes du Nord qui l'utilisent depuis 1945."
 CuongDe_NgoDinh.11.a: "Thang-Tien Can-Lao, Dong-Tien Xa-Hoi !"

 CuongDe_NgoDinh.12.t: "Nhan-Vinisation"
 CuongDe_NgoDinh.12.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le Président a ordonné la Nhan-Vinisation du gouvernement : chaque département, à tous les niveaux, soit soumis à la doctrine du personnalisme travailliste et mène ses affaires au nom de l'Empereur.\n\nLe programme comporte trois parties. Le personnalisme du travail doit être enseigné dans toute l'administration, systématiquement et non après coup. La propriété privée des travailleurs doit être défendue et étendue, et c'est sur ce point que cette doctrine se démarque du Nord. Et toute cette entreprise est placée sous la mémoire de Nam-Hung, dont le Président revendique l'enseignement révolutionnaire comme le fondement du sien.\n\nCe dernier élément est celui qui mérite d'être pris en compte. Un président catholique qui gouverne un État construit par l'Empereur revendique l'héritage de l'Empereur plutôt que de le remplacer, et ce à un moment où plusieurs autres hommes sont en mesure de faire la même revendication. La réforme des ministères est réelle. C'est aussi un argument sur la succession qui s'effectue à travers la fonction publique."
 CuongDe_NgoDinh.12.a: "L'oeuvre de l'Empereur continue entre nos mains"

 CuongDe_NgoDinh.13.t: "Le président Ngo-Dinh-Diem a annoncé la nationalisation des actifs étrangers"
 CuongDe_NgoDinh.13.d: "Saigon,[?global.date.GetDateStringNoHourLong] - Le président Ngo-Dinh-Diem a annoncé une nationalisation majeure pour entamer les premières étapes des plans quinquennaux à venir et de la réforme agraire visant à lutter contre les graves inégalités de propriété foncière au Sud-Vietnam. Dans les années 1950, 2,5 % des grands propriétaires fonciers contrôlaient 45 % des terres, tandis que 73 % des petits propriétaires fonciers n'en partageaient que 15 %. A Bac Lieu, 4% des propriétaires fonciers en possédaient 70%, laissant 72% des agriculteurs sans terre. Les entreprises et plantations françaises, comme le Domaine Agricole de l'Ouest, possèdent une part importante de ces grands domaines. La réforme ciblera ces exploitations pour la collectivisation et la redistribution aux classes Can-Lao et prolétariennes. Suite aux efforts antérieurs du Viet-Minh pour confisquer et redistribuer les terres dans leurs régions, le Parti vise à garantir une compensation équitable et un soutien juridique, en promouvant le personnalisme travailliste dans le développement agricole-industriel et la stabilité sociale."
 CuongDe_NgoDinh.13.a: "Nous devons résoudre ce problème au plus vite !"

 CuongDe_NgoDinh.14.t: "Mme Nhu lance le Syndicat de solidarité des femmes"
 CuongDe_NgoDinh.14.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Mme Tran-Le-Xuan a fondé le Syndicat de solidarité des femmes (Phu-nu Lien-doi), visant à libérer et à autonomiser le rôle des femmes dans le soutien à la République. L'organisation est dirigée par Mme Nhu, avec son Comité central composé principalement de femmes importantes de ministres, de généraux et d'autres origines influentes. Le leadership provincial est structuré de la même manière, les épouses des gouverneurs, des sous-gouverneurs et des fonctionnaires locaux jouant des rôles clés. Le mouvement comprend plusieurs comités spécialisés : Comité judiciaire, Comité des affaires des soldats, Comité de santé, Comité scolaire, Comité social, Comité paramilitaire des femmes Thanh. Ces comités mènent des activités de routine et des visites mensuelles pour rendre compte de leurs progrès, renforçant l'esprit révolutionnaire du personnalisme travailliste et luttant pour l'égalité totale des sexes et le féminisme dans tout le Sud-Vietnam."
 CuongDe_NgoDinh.14.a: "Vraiment une dame dragon !"

 CuongDe_NgoDinh.15.t: "Création du Parti révolutionnaire de Cong-Nong"
 CuongDe_NgoDinh.15.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Dans un développement politique significatif, les camarades de Ngo-Dinh-Diem, les éléments patriotiques des associations de l'empereur Nam-hung et les syndicats syndicalistes sont officiellement entrés dans l'arène politique, formant le Parti révolutionnaire de Cong-Nong. Les premiers participants incluent Huynh-Huu-Nghia, Ngo-Dinh-Can, Tran-Trung-Dung, Tran-Chanh-Thanh et Nguyen-Dinh-Thuan. Le Parti révolutionnaire de Cong-Nong servira d'appareil central aux côtés du Front populaire national (Mat-Tran Quoc-Dan), reflétant la structure d'un Parti communiste d'avant-garde. Dédié à la libération totale du peuple, le parti vise à protéger la dignité humaine, à combattre l'avidité matérialiste et à faire respecter les principes révolutionnaires travaillistes personnalistes défendus par Ngo Tong-thong et Ngo-Dinh-Nhu. Le parti a obtenu le soutien de diverses organisations, dont le Mouvement populaire uni et l'Association des anciens combattants pour le salut national. Cette coalition cherche à mobiliser un large soutien en faveur de la vision travailliste personnaliste de Diem d'un Vietnam socialement juste, économiquement autosuffisant et spirituellement enrichi."
 CuongDe_NgoDinh.15.a: "Nhan-Vi, Cong-Dong, Dong-Tien !"

 CuongDe_NgoDinh.16.t: "Création de mouvements de jeunesse révolutionnaires"
 CuongDe_NgoDinh.16.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Dans une étape importante vers le renforcement de l'esprit révolutionnaire, le Parti révolutionnaire de Cong-nong a annoncé la formation de quatre nouveaux syndicats de jeunesse visant à mobiliser la jeunesse du pays sous la bannière du personnalisme travailliste. L'initiative, dirigée par le président du Mouvement révolutionnaire national Tran-Chanh-Thanh et la présidente du Syndicat de solidarité des femmes, Tran-Le-Xuan, devrait attirer 50 000 participants au cours de la prochaine année. Les syndicats de jeunesse nouvellement créés comprennent : l'Union républicaine de la jeunesse, l'Union des jeunes femmes, l'Union républicaine des femmes et les Gardes républicaines armées. Ces syndicats adopteront les mêmes uniformes bleus révolutionnaires symbolisant la justice divine, à porter fièrement. La structure organisationnelle suivra les divisions administratives, avec des groupes nommés en fonction de leur localisation, tels que les unions de jeunesse de district et les syndicats municipaux. Le président Tran-Chanh-Thanh a souligné que ces mouvements visent à favoriser un fort sentiment de communauté et de ferveur révolutionnaire parmi les jeunes, en s'alignant sur les objectifs plus larges de l'idéologie travailliste personnaliste. La création de ces syndicats marque une étape importante dans les efforts visant à former une force de jeunesse dévouée et idéologiquement alignée, engagée dans le progrès révolutionnaire et social de la nation."
 CuongDe_NgoDinh.16.a: "Saluons tous la révolution sociale ! Salut à tous la jeunesse !"

 CuongDe_NgoDinh.17.t: "Révolutionner l'Armée Nationale de Construction"
 CuongDe_NgoDinh.17.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Ngo Tong-thong, avec derrière lui Ngo-Dinh-Nhu et le Parti révolutionnaire de Cong-Nong, a ordonné la refonte de l'Armée nationale de construction (Viet-Nam Kien-Quoc Quan). Le colonel Le-Quang-Tung s'en chargera. La formation reste Dan-Vuong dans ses officiers et dans ses loyautés, et c'est la raison évidente de la réforme.\n\nQuatre mesures ont été annoncées. L'armée doit suivre une instruction travailliste personnaliste. Sa structure de commandement doit être raccourcie afin que les décisions puissent être prises rapidement et attribuées à un seul homme. Les éléments réactionnaires doivent être éliminés et la cohésion maintenue par tous les moyens que le Colonel juge nécessaires. Et des commissaires politiques seront rattachés tout au long de la formation.\n\nCe qui est fait à l'Armée de construction a déjà été fait aux partis et aux organisations de masse, et l'ordre dans lequel cela s'est produit n'est pas dû au hasard. Lorsque cela sera terminé, il n'y aura plus d'institution dans la République dans laquelle le Parti ne siège pas."
 CuongDe_NgoDinh.17.a: "Une armée révolutionnaire pour un État révolutionnaire !"

 CuongDe_NgoDinh.18.t: "Le Président Ngo déclare la création de l'Armée Révolutionnaire"
 CuongDe_NgoDinh.18.d: "Dans un geste surprenant, contrairement aux attentes de la plupart des observateurs politiques, le président Ngo-Dinh-Diem a annoncé la création d'une deuxième Armée révolutionnaire. Cette nouvelle organisation sera composée de petits paramilitaires révolutionnaires tels que les Gardes républicaines armées, les Femmes républicaines et la Jeunesse républicaine. Sa mission principale sera d'appliquer les politiques révolutionnaires travaillistes et personnalistes visant à renforcer la sécurité et à faire avancer la lutte révolutionnaire. Ces paramilitaires opéreront sous le contrôle direct du Parti révolutionnaire de Cong-nong, soigneusement structuré à différents niveaux : au niveau provincial, y compris les syndicats de commune, dans les villes, englobant les unions régionales, à Saigon, intégrant les syndicats de quartier, au niveau central, une Union générale supervisera les opérations. Chaque unité au sein des communes et des districts sera dirigée par un dirigeant syndical adjoint, un dirigeant syndical et un conseil directeur. Les provinces et les districts auront un chef, deux chefs adjoints et un conseil directeur, tandis que le niveau central sera dirigé par un chef général et trois dirigeants spéciaux. Pour garantir l'état de préparation et les capacités, le gouvernement de la République du Vietnam a créé le poste d'« inspecteur de la jeunesse » dans les provinces pour superviser la formation militaire de cette nouvelle organisation. Cette restructuration audacieuse marque un changement significatif alors que Diem élimine progressivement l'Armée nationale de construction, consolidant les efforts révolutionnaires dans un cadre révolutionnaire plus centralisé et organisé."
 CuongDe_NgoDinh.18.a: "A bas l'ancien, place au nouveau !"

 CuongDe_NgoDinh.19.t: "Diem annonce la consolidation des partis politiques sous la direction du Parti révolutionnaire de Cong-Nong"
 CuongDe_NgoDinh.19.d: "Ngo Tong-thong a interdit tous les partis politiques du pays et a ordonné que leurs membres soient regroupés au sein du Parti révolutionnaire de Cong-Nong. Le Parti nationaliste vietnamien et la Ligue pour la Restauration sont nommés dans le décret. Tout le reste est couvert par omission, puisque rien n'est laissé en dehors.\n\nLa raison invoquée est la sécurité intérieure et l'intégrité de l'enseignement personnaliste du travail. L'opposition réactionnaire, a déclaré le Président, ne peut être raisonnée tant qu'elle détient des sièges et des fonctions, et un État qui lutte pour sa vie ne peut pas maintenir une opposition légale qui partage les objectifs de son ennemi. Le parti consolidé supervisera les fonctions du gouvernement à tous les niveaux et rendra compte de l'activité politique dans tout le pays.\n\nIl existe désormais un parti au Sud-Vietnam. Les hommes qui dirigeaient les autres n'ont pas disparu. Le VNQDD compte des cadres dans les provinces du Nord qui combattaient les Français avant l'existence du Parti Cong-Nong, et ils ont reçu pour instruction de s'enrôler dans un corps qu'ils considèrent comme inférieur à eux. Ce qui était autrefois un débat à l'Assemblée devient un débat à l'intérieur du Parti, ou bien en dehors de la loi."
 CuongDe_NgoDinh.19.a: "Pour la sécurité et la stabilité !"

 CuongDe_NgoDinh.20.t: "Diem réprime les triades et la mafia Binh-Xuyen"
 CuongDe_NgoDinh.20.d: "Ngo Tong-thong s'est engagé contre le crime organisé à Saigon et Cho-Lon. Elle est présentée comme faisant partie de la « guerre contre les quatre péchés » - la boisson, le jeu, la prostitution et l'opium - et comme une oeuvre de régénération morale plutôt que de maintien de l'ordre, comme ce gouvernement préfère décrire tout ce qu'il fait.\n\nLes activités de la Triade sont purement et simplement interdites et les propriétés qui les sous-tendent à Cho-Lon ont été démantelées. Le casino Grande Monde, que les Binh-Xuyen exploitaient depuis des années comme concession autorisée et comme trésor, a été démoli. Des chars ont été utilisés pour le faire et des photographes étaient sur place pour enregistrer le fait.\n\nCe dernier détail constitue l'ensemble de l'annonce. Les Binh-Xuyen ne constituent pas un gang criminel au sens ordinaire du terme. Ils tiennent la préfecture de police, ils tiennent le terrain à Cho-Lon, et leur concession a été achetée au chef de l'Etat lui-même. Envoyer des blindés contre leur casino en plein jour était un message adressé à eux, ainsi qu'à tous ceux qui ont payé pour la protection d'un gouvernement qui a désormais l'intention de cesser de la vendre."
 CuongDe_NgoDinh.20.a: "Pour une société révolutionnaire juste et morale !"

 CuongDe_NgoDinh.21.t: "Ngo Tong-thong désarme les armées privées religieuses pour mettre fin à l'instabilité à Nam-phan"
 CuongDe_NgoDinh.21.d: "Ngo Tong-thong s'est attaqué aux armées privées. Les milices chrétiennes Cao-Dai, Hoa-Hao et UMDC de Nam-Phan doivent être désarmées et la campagne s'est ouverte sans les négociations préalables habituelles.\n\nL'instrument n'est pas l'armée régulière. Les Gardes républicaines armées, l'Union des femmes républicaines et la Jeunesse républicaine - levées, organisées et payées par le Parti révolutionnaire de Cong-Nong - sont envoyées pour procéder au désarmement. Cela signifie que l'opération relève du Parti plutôt que de l'état-major, et qu'aucun général ne peut en être tenu pour responsable.\n\nL'objectif est de mettre fin à trente années au cours desquelles les milices sectaires se sont imposées, se sont surveillées et se sont battues les unes contre les autres dans les provinces à l'ouest de Saigon avec le consentement tacite de celui qui gouvernait. C'est aussi le plus gros pari que le président ait jamais fait. Les sectes ont des divisions sur le terrain, un territoire qui leur est propre et la loyauté de plusieurs millions de personnes, et cela ne peut pas être fait à moitié."
 CuongDe_NgoDinh.21.a: "Échec et mat!"

 CuongDe_NgoDinh.22.t: "L'école des officiers d'infanterie de Thu-duc est ouverte !"
 CuongDe_NgoDinh.22.d: "Thu-Duc, [?global.date.GetDateStringNoHourLong] - Le Gouvernement national et le Commissaire spécial à la Défense ont créé l'École des officiers de réserve de Thu-Duc sur la colline Tang-Nhon-Phu, dans la commune de Linh-Xuan-Thon, province de Gia-Dinh. Il prend le nom de l'empereur Nam-Hung, et le premier cours ouvre la semaine prochaine.\n\nCe qu'il produit, ce sont des officiers de réserve - des hommes qui occupent un emploi civil et commandent un peloton lorsqu'ils sont appelés à le faire. Il s'agit d'un choix délibéré plutôt que d'un compromis. Une académie professionnelle forme quelques centaines d'officiers de carrière en une décennie ; une école de réserve produit chaque année plusieurs milliers d'hommes qui peuvent être sous les armes en une quinzaine de jours.\n\nPour le parti Cong-Nong, c'est l'argument déjà avancé à propos des ministères et des syndicats, désormais appliqué à l'armée. La Révolution sociale a besoin d'une défense qu'elle n'a pas besoin d'emprunter, et d'un corps d'officiers issus des Can-Lao plutôt que des familles qui ont fourni des officiers aux Français."
 CuongDe_NgoDinh.22.a: "Nous l'attendons avec impatience !"

 CuongDe_NgoDinh.23.t: "Tran-Chanh-Thanh lance un journal révolutionnaire"
 CuongDe_NgoDinh.23.d: "Le président du Mouvement révolutionnaire national a lancé un journal. \"Quan-Chung\" - le Peuple - est publié par le Parti révolutionnaire de Cong-Nong en tant que voix officielle du Mouvement, et son en-tête porte la formule que le Parti veut répéter partout : \"Da-thuc, Bai-phong, De-cao Nhan-Vi\" - combattez le colonialisme, éliminez la féodalité, promouvez le personnalisme.\n\nParallèlement, le Parti révolutionnaire travailliste a lancé un hebdomadaire, \"Xa-Hoi\", qui circule à Saigon, Phu-Xuan et Can-Tho. Entre les deux, le Parti a désormais un quotidien pour les villes et un hebdomadaire pour partout ailleurs, dans les trois villes où se forme réellement l'opinion dans ce pays.\n\nC'est ce qui manque à l'appareil idéologique. Il y a eu des écoles, des cadres et des déclarations depuis deux ans, et aucun moyen fiable d'imposer la même peine dans chaque province la même semaine. Il y en a un maintenant."
 CuongDe_NgoDinh.23.a: "Bai-phong, Ta-thuc, De-cao Nhan-Vi !"

 CuongDe_NgoDinh.24.t: "Ngo Tong-thong a publié des décrets pour créer la base d'entraînement de Tay-ninh"
 CuongDe_NgoDinh.24.d: "Dans une démarche significative visant à solidifier le personnalisme travailliste, Ngo Tong-thong a annoncé que Tay Ninh serait le site de la première base de formation révolutionnaire pour les cours révolutionnaires « Tu-nghiep ». L'emplacement stratégique de Tay-Ninh et le fort soutien des alliés de Cao-Dai, autrefois fidèles à l'empereur Nam-Hung et maintenant son successeur Diem, en faisaient un choix idéal. Cette base fournira une formation politique, idéologique et technique et militaire intensive aux cadres et à la classe ouvrière, visant à faire progresser les principes révolutionnaires et à renforcer la loyauté envers le gouvernement de Diem. Cette initiative marque une étape cruciale dans les efforts de Diem pour consolider le pouvoir et promouvoir le personnalisme travailliste dans tout le Sud-Vietnam."
 CuongDe_NgoDinh.24.a: "Can-Lao, Cach-mang, Nhan-Vi !"

 CuongDe_NgoDinh.25.t: "Le Politburo du Parti Cong-nong a annoncé l'ouverture massive de bases d'entraînement révolutionnaires"
 CuongDe_NgoDinh.25.d: "La première base de formation travailliste personnaliste à Tay-Ninh a fait ce qui lui était demandé, et le Politburo du Parti Cong-Nong a ordonné l'ouverture de trois autres bases dans le sud. Chacun doit former des cadres et des ouvriers à la doctrine, et chacun s'est vu attribuer une région et un homme pour la diriger.\n\nHué assume la mission spéciale de la région centrale sous la direction du conseiller politique Ngo-Dinh-Can, couvrant le pays de Phan-Rang au dix-septième parallèle et à l'intérieur des terres à travers les hauts plateaux. Il regroupe les équipes de renseignement, de sécurité secrète et de propagande mobile en un seul bureau, et est dirigé au jour le jour par Duong-Van-Hieu et Nguyen-Tu-Thai - le premier était marxiste avant d'être autre chose, et c'est précisément pourquoi il a été choisi. Son bilan en matière de sécurité et de contrôle de la population est le meilleur du pays.\n\nSaigon est le siège du Mouvement Révolutionnaire National, ouvert sous Ngo-Dinh-Nhu et désormais en grande partie entre les mains de son épouse, Tran-Le-Xuan. Elle fait moins qu'autrefois, mais elle reste le lieu où la doctrine est établie avant d'être enseignée ailleurs. Can-Tho, dans le delta, a connu l'année politique la plus calme et par conséquent l'année la plus chargée : le recrutement et l'aide aux pauvres, que le Parti considère comme une même entreprise menée par d'autres moyens."
 CuongDe_NgoDinh.25.a: "Nhan-Vi + Cong-Dong = Dong-Tien !"

 CuongDe_NgoDinh.26.t: "Ngo Tong-thong et le colonel Le-Quang-Tung forment des commissaires politiques travaillistes personnalistes"
 CuongDe_NgoDinh.26.d: "Le président et le colonel Le-Quang-Tung ont annoncé la création d'un corps de commissaires politiques travaillistes personnalistes. Le modèle est soviétique et le gouvernement n'a pas prétendu le contraire. L'argument avancé est qu'une doctrine qui n'est pas appliquée au sein de l'appareil d'État ne survivra pas au contact des hommes qui en font partie.\n\nLe-Quang-Tung, qui commande les Forces spéciales révolutionnaires, dirigera le corps. Les commissaires doivent s'asseoir aux côtés de la chaîne de commandement existante dans les ministères et dans l'armée sans la déplacer - surveillant, signalant et marquant les éléments réactionnaires en vue de leur élimination. Leur autorité vient du président personnellement plutôt que d'un quelconque département, et c'est précisément le but de l'accord.\n\nCe que cela achète, c'est un gouvernement sur lequel on peut compter pour dire la même chose dans toutes les provinces. Ce qu'il en coûte, c'est que chaque officier et chaque fonctionnaire travaille désormais aux côtés d'un homme dont la fonction est de le critiquer. L'armée a également remarqué que le corps était annoncé par un colonel des forces spéciales et non par le chef d'état-major."
 CuongDe_NgoDinh.26.a: "Salut à tous les forces armées ! Salut à tous la fête !"

 CuongDe_NgoDinh.27.t: "Ngo Tong-thong annonce l'ouverture de Hoa-Luu Agroville"
 CuongDe_NgoDinh.27.d: "Vi-Thanh, [?global.date.GetDateStringNoHourLong] - Le Président a inauguré Hoa-Luu, la plus grande des Agrovilles et celle par rapport à laquelle le gouvernement entend mesurer le reste. La cérémonie a attiré des fonctionnaires, des dignitaires provinciaux et une foule de plusieurs milliers de personnes, et le président est venu en personne, ce que personne n'a manqué de remarquer.\n\n\"Cette année\", leur a-t-il dit, \"je propose de créer des zones Tru-Mat à la campagne, dans des endroits offrant des transports pratiques, de l'hygiène et des commodités minimales, pour rassembler les agriculteurs pauvres qui vivent sporadiquement et dans le besoin.\" Les colonies sont destinées à devenir des sièges de district et de province à part entière - des quartiers modernes, une formation agricole et des programmes sociaux grâce auxquels le personnalisme travailliste atteint des gens qui n'en liront jamais une ligne.\n\nHoa-Luu dispose de l'infrastructure nécessaire pour faire valoir son argument. Ce qu'il n'a pas encore, c'est une réponse à la question que le delta ne cesse de se poser : ce qu'il est advenu des agriculteurs qui ne souhaitaient pas quitter les terres que leurs familles avaient travaillées et qui en ont été expulsés malgré tout."
 CuongDe_NgoDinh.27.a: "Je vous donne, l'Agroville !"

 CuongDe_NgoDinh.28.t: "Signification des conflits de classes sous le régime travailliste personnaliste"
 CuongDe_NgoDinh.28.d: "Le Parti révolutionnaire de Cong-Nong a lancé une campagne, dirigée par Ngo-Dinh-Nhu et Tran-Quoc-Buu, pour régler la question de classe sous le personnalisme travailliste - ou plutôt, pour la déclarer réglée.\n\nNhu a exposé la doctrine assez clairement. \"Le personnalisme travailliste encourage les prolétaires et la classe ouvrière à posséder leur propre capital, à condition qu'il soit obtenu légalement et ne nuise pas au bien commun collectiviste.\" Tran-Quoc-Buu, au nom de la Confédération générale des travailleurs, l'a exprimé de manière encore plus provocante : « Notre idéologie, le personnalisme travailliste, synthétise le capitalisme et le communisme pour donner du pouvoir à la classe ouvrière. »\n\nTrois choses découlent de la déclaration. La propriété privée des travailleurs doit être rendue légale et sûre là où elle ne l'est pas actuellement. Une campagne d'éducation portera la doctrine dans les syndicats et les villages. Et des coopératives et des coopératives de crédit doivent être fondées pour financer les entreprises dont les travailleurs sont entièrement propriétaires. Qu'il s'agisse d'une synthèse ou d'une évasion, c'est le débat que le Parti vient de choisir de mener publiquement."
 CuongDe_NgoDinh.28.a: "Quyen Tu-huu duoc dam-bao cho cac Giai-cap Can-Lao !"

 CuongDe_NgoDinh.29.t: "Création de Sonadezi et de la première zone industrielle à Bien-Hoa"
 CuongDe_NgoDinh.29.d: "Aujourd'hui, Ngo Tong-thong, avec la collaboration du commissaire spécial à l'action civile et du commissaire spécial à l'industrie et aux travaux publics, a collaboré et déclaré la création du syndicat Sonadezi (Société nationale du développement des zones industrielles), marquant une étape importante dans le développement industriel du Sud-Vietnam sous le personnalisme travailliste. Cet effort visait à réduire la dépendance à l'égard des produits industriels occidentaux et français et à renforcer les capacités industrielles nationales. Sonadezi a servi de plaque tournante pour les conseillers techniques, les investisseurs et les fonctionnaires du ministère de l'Économie du gouvernement de Saigon, facilitant la création de zones industrielles à travers le Vietnam. La première zone industrielle a été créée à Bien-Hoa, établissant un modèle pour les futurs complexes industriels à Tay-Do (Can-Tho), Da-Nang et Cam-Ranh. Le président Diem a souligné : « Sonadezi sera le fer de lance de la révolution industrielle de notre pays, en promouvant l'autosuffisance et la croissance économique grâce à des stratégies d'industrialisation innovantes ». Cette initiative a jeté les bases de l'expansion industrielle du Vietnam, démontrant l'engagement du personnalisme travailliste en faveur de l'indépendance économique et du progrès technologique."
 CuongDe_NgoDinh.29.a: "La ky-nghénisation se passe bien !"

 CuongDe_NgoDinh.30.t: "Le président visite le bureau de calcul automatique"
 CuongDe_NgoDinh.30.d: "Le président a visité l'Auto Calculate Bureau, qui fonctionne désormais sur des machines IBM et qui est, autant que l'on puisse le constater, la seule installation de ce type entre Manille et Karachi. On lui a montré les machines informatiques travaillant sur les rôles d'imposition d'une province, et il est resté un peu plus longtemps que ne le permettait l'horaire.\n\nCe qui l'intéresse, c'est ce que les machines font à l'évaluation. Un rôle d'impôt tenu à la main est un rôle d'impôt tenu par des hommes qu'on peut persuader, et les grands domaines les persuadent depuis l'arrivée des Français. Il est plus difficile de contester le chiffre d'affaires qu'une machine peut réaliser en un après-midi, et le président a fait le lien à haute voix : la modernisation comme instrument contre les vestiges féodaux et coloniaux, plutôt que comme ornement du budget.\n\n\"Notre objectif est d'automatiser entièrement la bureaucratie vietnamienne, la rendant plus efficace et mieux informée\", a-t-il déclaré au personnel. \"Cette modernisation nous aidera à bâtir une société plus juste et plus prospère.\" Le Bureau dispose d'une telle installation et le pays compte une quarantaine de provinces, de sorte que l'ambition dépasse actuellement de loin l'équipement."
 CuongDe_NgoDinh.30.a: "101010"

 CuongDe_NgoDinh.31.t: "Inauguration de la centrale hydroélectrique de Da Nhim et célébration du panasiatisme"
 CuongDe_NgoDinh.31.d: "La centrale hydroélectrique de Da-Nhim a été inaugurée et c'est la plus grande centrale construite par ce pays depuis la guerre. Il se situe au confluent du Krong-Let et du Da-Nhim à Don-Duong dans la province de Lam-Dong et a été financé par le gouvernement japonais grâce aux réparations réglées à San Francisco en 1951.\n\nLes chiffres méritent d'être mentionnés une fois. Un barrage de quinze cents mètres de long ; un tunnel sous pression de cinq kilomètres traversant le champ de tir ; un réservoir de onze ou douze kilomètres carrés situé au-dessus de mille mètres d'altitude ; 160 mégawatts installés, soit près d'un milliard de kilowattheures par an. Les hauts plateaux n'ont jamais eu d'électricité digne de ce nom et vont désormais l'envoyer vers la côte.\n\nLa cérémonie était aussi, et très ouvertement, une occasion pan-asiatique. Des ingénieurs japonais se tenaient aux côtés des ministres vietnamiens dans une usine construite avec de l'argent japonais selon des conditions négociées par Cuong-De lui-même, et les discours disaient ce que toutes les personnes présentes avaient déjà compris. L'argent est sorti d'une guerre, il a été transformé en barrage, et c'est à cela que devrait ressembler désormais l'amitié entre les deux pays."
 CuongDe_NgoDinh.31.a: "Un toast à nos camarades japonais"

 CuongDe_NgoDinh.32.t: "Annonce de la première ville planifiée révolutionnaire travailliste et personnaliste"
 CuongDe_NgoDinh.32.d: "La première pierre a été inaugurée aujourd'hui pour Nghiep-doan Thanh, la Ville des Travailleurs, annoncée conjointement par Tran-Quoc-Buu du Syndicat général des travailleurs vietnamiens, le conseiller Ngo-Dinh-Nhu et le commissaire général Kieu-Cong-Cung à l'action civique. Ce sera la première ville du Sud construite selon un plan travailliste personnaliste plutôt que adaptée par la suite.\n\nLa conception regroupe les logements, les écoles, les cliniques et les terrains publics dans un seul aménagement, au lieu de laisser une ville s'accumuler autour d'un marché et d'une garnison comme l'ont fait toutes les autres villes du delta. Buu a parlé de l'autonomisation des travailleurs et de l'harmonie sociale. Nhu a parlé de la méthode de planification et de ce que le site est censé prouver. Kieu-Cong-Cung, dont les cadres de l'Action Civique réaliseront la construction proprement dite, a parlé d'unité et a dit le moins des trois sur les délais.\n\nTrois hommes qui s'accordent sur très peu de choses se sont présentés sur le même programme pour cela, qui vaut autant pour le gouvernement que le béton. Si la ville est achevée, elle deviendra le modèle de tout programme de colonisation désormais sur papier. Si ce n'est pas le cas, cela devient l'illustration permanente de ce que la doctrine produit lorsqu'elle respecte un budget."
 CuongDe_NgoDinh.32.a: "Le premier élément constitutif de quelque chose de plus grand !"

 CuongDe_NgoDinh.33.t: "Annonce du programme d'agro-crédit"
 CuongDe_NgoDinh.33.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le programme d'agro-crédit a été lancé ce matin à neuf heures au Centre de recherche et de formation pour les coopératives agricoles, sous la direction de Tran-Ngoc-Lien, chef du Commissariat aux coopératives agricoles et à l'agro-crédit, sous la présidence du président du Comité populaire pour l'amélioration de la vie à la campagne.\n\nLa liste des invités représentait la moitié de l'intérêt de l'occasion. Tran-Quoc-Buu du Syndicat général des travailleurs du Vietnam était assis à côté de M. Kleinpeter de la mission française d'aide économique et technique, avec des responsables du Comité populaire, du Commissariat et d'une demi-douzaine de départements remplissant le reste de la salle. Les syndicats, les ministères et l'administration française de l'aide humanitaire n'ont pas souvent été réunis dans une même salle, et jamais encore pour avaliser le même document.\n\nBuu a défendu le syndicalisme comme le contenu socio-économique de la cause travailliste personnaliste. Tran-Ngoc-Lien parlait pour le mouvement de masse révolutionnaire unifié et pour la formation des cadres Nhan-Vi, qu'il appelait la base sur laquelle repose tout le reste. Le programme lui-même est plus simple que les discours qui l'ont soutenu : l'agriculteur doit être crédité dans une monnaie gagnée grâce au travail et aux cotisations sociales plutôt que détenue en espèces, et le gouvernement parie que les campagnes l'accepteront."
 CuongDe_NgoDinh.33.a: "Thang-tien Nong-tin Cuoc !"

 # Cuong-De Coup
 CuongDe_Coup.1.t: "Donnez-vous le feu vert au coup d'État de Cuong-De ?"
 CuongDe_Coup.1.d: "Après des années de préparation, les hommes de Cuong-De nous sont parvenus avec une proposition finale, et elle est formulée assez clairement. Ils veulent notre soutien pour la destitution de Bao-Dai et l'installation du prince sur le trône impérial.\n\nL'objection à son égard est connue et personne dans ce ministère ne l'a oublié. Il a passé la guerre comme hôte des Japonais, et s'ils avaient duré un peu plus longtemps, il nous aurait pris le pays avec leur aide.\n\nLe problème pour lui est qu'il n'est pas Bao-Dai. Notre homme actuel doit être soutenu tous les quelques mois, n'a jamais produit un gouvernement qui gouverne et a dépensé une quantité remarquable de notre crédit aux tables de Cho-Lon. Cuong-De a une organisation, une clientèle et une réputation de sérieux personnel qui manquent manifestement à notre client. La question qui se pose à nous est de savoir si nous préférerions être embarrassés par notre homme à Saigon ou remplacés par lui."
 CuongDe_Coup.1.a: "Ils ont gagné notre permission, Bao-Dai doit être retiré."
 CuongDe_Coup.1.b: "Bao-Dai peut encore être racheté, nous ne soutiendrons pas cet acte illégal !"

 CuongDe_Coup.2.t: "La France accepte de contribuer à notre coup d'État"
 CuongDe_Coup.2.d: "Bonne nouvelle ! Les Français ont accepté notre projet visant à ramener le prince Cuong-De sur le trône impérial. Il semble que tous nos efforts pour influencer les responsables et le gouvernement français ont porté leurs fruits, car ils sont prêts à soutenir nos efforts visant à renverser Bao-Dai et à reconnaître le gouvernement du prince Cuong-De comme le gouvernement légitime du Vietnam. Nous attendons maintenant le bon moment pour éliminer Bao-Dai."
 CuongDe_Coup.2.a: "La victoire est à notre portée !"

 CuongDe_Coup.3.t: "La France refuse de contribuer à notre coup d'État"
 CuongDe_Coup.3.d: "Tragique nouvelle ! Malgré notre meilleure capacité à convaincre le gouvernement français que le prince Cuong-De est le meilleur espoir d'unification du Vietnam, nous n'avons pas réussi à le convaincre de soutenir notre cause visant à renverser Bao-Dai. Sans l'aide du gouvernement français, notre cause échouera très probablement car Bao-Dai contrôle la nation d'une main de fer."
 CuongDe_Coup.3.a: "Etait-ce pour rien ?"

 CuongDe_Coup.4.t: "L'horloge sonne douze"
 CuongDe_Coup.4.d: "Avec la distraction continue de la guerre entre le gouvernement de Bao-Dai et les communistes, nous avons trouvé l'occasion de tenter un coup d'État contre Bao-Dai. Ce matin, les partisans du prince Cuong-De se sont rassemblés à Hué pour tenter de prendre d'assaut le résident de Bao-Dai. Bien qu'ils aient rencontré la résistance de la garde du palais, le résultat de la tentative de coup d'État est..."
 CuongDe_Coup.4.a: "Victoire pour notre juste dirigeant !"
 CuongDe_Coup.4.b: "Défaite contre les forces de Bao-Dai..."

 CuongDe_Coup.5.t: "Un moment attendu depuis longtemps..."
 CuongDe_Coup.5.d: "La garde du palais combattit brièvement. Ils furent en infériorité numérique dès la première minute et furent abandonnés dès que les Français firent connaître leur position, et en quelques heures les hommes du prince étaient dans la résidence avec Bao-Dai devant eux.\n\nIl a abdiqué à la radio et à la télévision, en lisant un texte qu'il n'avait pas écrit, et le monde entier était invité à le voir le faire. Il n'y a pas eu de négociation parce qu'il n'y avait plus rien à négocier. Les Français étaient partis, l'armée n'avait pas bougé et la moitié des ministres téléphonaient à Phu-Xuan depuis la veille au soir.\n\nCuong-De est le chef de l'État vietnamien. Les attentes dans tout le pays sont énormes et visent un seul point : que ce qui suivra sera au moins moins corrompu et moins oisif que ce qui vient d'être fait hors du palais. C'est beaucoup de s'accrocher à un homme âgé qui est à l'étranger depuis quarante ans."
 CuongDe_Coup.5.a: "Van-tue Cuong-De!"

 # Cuong-De Successor
 CuongDe_Successor.1.t: "Qui réussira ?"
 CuongDe_Successor.1.d: "L'Empereur est vieux et malade, et les médecins du palais ont renoncé à prétendre le contraire. La succession doit être réglée pendant qu'il est encore en état de la régler lui-même, et il y a quatre noms devant lui.\n\nNguyen-Rinh-Nhiep est le commandant en second et la réponse évidente : l'homme qui a dirigé l'administration pendant que l'empereur dirigeait la révolution. Ngo-Dinh-Diem soutient la restauration depuis plus longtemps que quiconque et entraînerait avec lui les catholiques et les réformateurs, au prix de tous ceux que les réformes effraient. Hoang-Nam-Hung est le choix nationaliste, et celui que l'armée trouverait le plus facile à avaler.\n\nEt il y a Tran-Quang-Vinh. Les Cao-Dai font pression pour avoir leur propre candidat, et Vinh est le candidat qu'ils ont. Il commande leurs divisions et détient Tay-Ninh, et une succession réglée contre lui est une succession que les sectes peuvent simplement refuser de reconnaître."
 CuongDe_Successor.1.a: "Le loyaliste, Nguyen-Rinh-Nhiep."
 CuongDe_Successor.1.b: "Le radical Ngo-Dinh-Diem."
 CuongDe_Successor.1.c: "Le nationaliste Hoang-Nam-Hung."
 CuongDe_Successor.1.e: "Le pragmatique Tran-Quang-Vinh."

 # North Vietnam & Cuong-De
 NV_CuongDe.1.t: "Cuong-De propose un cessez-le-feu"
 NV_CuongDe.1.d: "L'Empereur a appelé à un cessez-le-feu, et il a défendu son argument dans les termes qu'il a utilisés toute sa vie : que les Vietnamiens forment un seul peuple avec un seul héritage, et que les frères ne devraient pas s'entre-tuer pendant qu'une armée étrangère les regarde le faire.\n\nCe n'était pas seulement un discours. Ngo-Dinh-Diem a été désigné pour une mission auprès de la Commission internationale de contrôle, avec pour instruction d'ouvrir un processus vers le Nord plutôt que de simplement déposer une protestation. Cette nomination est en elle-même le message : l'Empereur a envoyé son anticommuniste le plus intransigeant, et ce n'est pas un homme avec qui Hanoï se sentirait à l'aise de traiter.\n\nPersonne dans ce gouvernement ne s'attend à ce que Ho accepte rapidement, et l'Empereur ne semble pas s'y attendre non plus. Ce qu'il veut que ce soit consigné dans le compte rendu, c'est que l'offre a été faite de ce côté-ci, en public, et que tout ce qui suivra n'a pas été choisi ici."
 NV_CuongDe.1.a: "Espérons que des progrès en découlent."

 NV_CuongDe.2.t: "Diem propose des pourparlers de paix"
 NV_CuongDe.2.d: "Grâce aux efforts intermédiaires de la Mission de contrôle internationale et à des mois de négociations secrètes, le gouvernement Ngo-Dinh-Diem du Sud-Vietnam a proposé un accord avec le Nord concernant la paix et l'éventuelle réunification du Vietnam. Le plan propose 6 étapes de paix avant la réunification officielle :\n\nÉtape 1 : L'interdiction de l'échange de lettres entre citoyens du Nord et du Sud doit être levée.\nÉtape 2 : La frontière entre le Nord et le Sud doit alors être ouverte à tous les citoyens vietnamiens des deux côtés.\nÉtape 3 : Les Vietnamiens des deux côtés doivent avoir le droit de se réinstaller librement n'importe où au Vietnam s'ils le souhaitent.\nÉtape 4 : Les échanges économiques entre le Nord et le Sud doivent reprendre. Par exemple, le Sud échangerait le riz du Sud contre du charbon du Nord.\nÉtape 5 : Un débat d'unification à l'échelle nationale doit avoir lieu\nÉtape 6 : élections générales\n\nC'est désormais au Nord d'accepter cette proposition. Les choses sont incertaines, mais une chose est claire :"
 NV_CuongDe.2.a: "Dans les prochains jours, le sort du Vietnam dépendra d'un seul morceau de papier."

 NV_CuongDe.3.t: "Saigon propose la coexistence"
 NV_CuongDe.3.d: "La route vers la réunification étant fermée, le gouvernement du Sud a adressé à Hanoï une nouvelle proposition, plus modeste : des relations normalisées entre les deux États vietnamiens. L'offre ne parle plus d'élections ou de fusion, mais de frontières tranquilles, de reprise de la correspondance entre familles divisées et d'échange de riz du Sud contre du charbon du Nord.\n\nPour le Politburo, cette offre présente un dilemme familier. L'accepter allégerait le fardeau d'une population fatiguée par la guerre et ouvrirait un commerce précieux - mais cela donnerait également une légitimité au gouvernement de Saigon et calmerait la lutte révolutionnaire dans le Sud. Le rejeter maintient la cause en vie, au prix d'un isolement et de difficultés continus.\n\nQuelle sera la réponse du Nord ?"
 NV_CuongDe.3.a: "Il y a de la sagesse dans les frontières tranquilles."
 NV_CuongDe.3.b: "La révolution ne se repose pas."

 # North Vietnam & Cuong-De Unification
 NV_CuongDe_Unification.1.t: "La proposition d'unification de Diem"
 NV_CuongDe_Unification.1.d: "Après des mois de négociations secrètes et de voies diplomatiques, le président Ngo-Dinh-Diem du Sud-Vietnam a officiellement proposé un plan global pour la réunification pacifique du Vietnam. La proposition décrit un processus progressif de réconciliation et d'intégration entre le Nord et le Sud.\n\nLe plan prévoit un processus en six étapes :\n\n§YÉtape 1 :§! Levée de l'interdiction de correspondance entre citoyens du Nord et citoyens du Sud\n§YÉtape 2 :§! Ouverture de la frontière pour la libre circulation de tous les citoyens vietnamiens\n§YÉtape 3 :§! Accorder le droit de se réinstaller n'importe où au Vietnam\n§YÉtape 4 :§! Reprise des échanges économiques entre les deux régions\n§YÉtape 5 :§! Organiser un débat national sur l'unification\n§YÉtape 6 :§! Organiser des élections générales pour un gouvernement unifié\n\nCette proposition représente une rupture significative avec le conflit en cours. La balle est désormais dans le camp du Nord-Vietnam : accepteront-ils ces conditions et entameront-ils le chemin vers une réunification pacifique ?"
 NV_CuongDe_Unification.1.a: "Nous acceptons la proposition et entamerons les négociations."
 NV_CuongDe_Unification.1.b: "Nous rejetons cette proposition."

 NV_CuongDe_Unification.2.t: "Réviser les conditions"
 NV_CuongDe_Unification.2.d: "Le gouvernement nord-vietnamien a reçu la proposition d'unification de Diem et en examine attentivement les termes. L'accent mis par la proposition sur l'intégration progressive et les processus démocratiques présente à la fois des opportunités et des défis pour les dirigeants communistes.\n\nPoints clés à l'étude :\n\n- Les échanges économiques bénéficieraient aux deux parties, mais créeraient également des dépendances\n- La libre circulation pourrait conduire à une contamination idéologique ou, à l'inverse, renforcer la position du Nord\n- Les élections générales représentent un risque important si la population du Sud se montre plus favorable au gouvernement actuel\n- L'approche par étapes permet un suivi et un ajustement minutieux du processus\n\nLe Politburo doit décider s'il doit poursuivre les négociations formelles ou rejeter catégoriquement la proposition."
 NV_CuongDe_Unification.2.a: "Nous entamerons des négociations formelles."

 NV_CuongDe_Unification.3.t: "Négocier les détails"
 NV_CuongDe_Unification.3.d: "Des négociations formelles ont commencé entre les représentants du Nord et du Sud Vietnam. Les discussions sont tendues mais productives, les deux parties s'efforçant d'affiner les termes de la proposition d'unification.\n\nPoints clés de la discussion :\n\n- Le calendrier de chaque étape du processus\n- Garanties pour les droits et la sécurité des citoyens pendant la transition\n- Arrangements économiques et accords commerciaux\n- Procédures électorales et éligibilité des électeurs\n- Le rôle des puissances étrangères dans le processus\n\nDes progrès sont réalisés, même si des différences significatives subsistent. La délégation sud-vietnamienne, dirigée par les représentants de Diem, fait pression pour une mise en oeuvre plus rapide, tandis que le Nord souhaite davantage de garanties et une période de transition plus longue."
 NV_CuongDe_Unification.3.a: "Poursuivre les négociations."

 NV_CuongDe_Unification.4.t: "Parvenir à un accord"
 NV_CuongDe_Unification.4.d: "Après des semaines de négociations intensives, les deux parties sont parvenues à un accord global sur les conditions de la réunification vietnamienne. Le document final présente une feuille de route détaillée pour le processus en six étapes, avec des délais, des garanties et des mécanismes de mise en oeuvre spécifiques.\n\nL'accord comprend :\n\n- Une ouverture progressive des frontières à partir de six mois\n- Protocoles de coopération économique pour le commerce et l'échange de ressources\n- Structure de la commission électorale et procédures de vote\n- Dispositions gouvernementales de transition\n- Mécanismes internationaux de surveillance et de vérification\n\nLes deux gouvernements sont désormais prêts à signer l'accord et à entamer le processus de mise en oeuvre. Cela marque un moment historique : la fin de la guerre d'Indochine et le début d'un nouveau chapitre de l'histoire vietnamienne, même si le chemin à parcourir reste incertain."
 NV_CuongDe_Unification.4.a: "Signez l'accord et commencez la mise en oeuvre."

 NV_CuongDe_Unification.5.t: "[GetNewspaperHeader]Un accord historique met fin à la guerre d'Indochine et ouvre la voie à la réunification vietnamienne"
 NV_CuongDe_Unification.5.d: "[?global.date.GetDateStringNoHourLong] - Dans un développement qui a stupéfié les observateurs du monde entier, les gouvernements du Nord et du Sud Vietnam ont signé un accord global mettant fin à la guerre d'Indochine et établissant un cadre pour une réunification pacifique. Cet accord constitue le premier règlement négocié entre les deux États vietnamiens depuis le début du conflit.\n\nConclu après des mois de négociations secrètes et des semaines de pourparlers formels, l'accord décrit un processus de réunification en six étapes. Les premières mesures rétabliront la correspondance civile, suivies par l'ouverture des frontières, les droits de réinstallation, la coopération économique, un débat politique à l'échelle nationale et, finalement, des élections générales pour déterminer l'avenir du Vietnam.\n\nLe président Ngo-Dinh-Diem et le président Hô Chi Minh ont salué ensemble l'accord comme une victoire du peuple vietnamien plutôt que d'une seule partie. Un cessez-le-feu et une zone démilitarisée le long du 17e parallèle seront appliqués sous supervision internationale.\n\n"
 NV_CuongDe_Unification.5.a: "Un nouveau chapitre commence."

 NV_CuongDe_Unification.6.t: "Le Nord-Vietnam rejette la proposition"
 NV_CuongDe_Unification.6.d: "Le gouvernement nord-vietnamien a formellement rejeté la proposition d'unification du président Diem. Ce rejet est une déception pour ceux qui espéraient une résolution pacifique du conflit, mais il n'est pas totalement inattendu compte tenu des profondes divisions idéologiques et politiques entre les deux parties.\n\nLe refus du Nord de s'engager sur la proposition suggère qu'il n'est pas encore prêt à faire un compromis sur sa position, ou qu'il considère les conditions comme défavorables. Ce rejet signifie que la voie vers une réunification pacifique reste bloquée, du moins pour le moment.\n\nLe gouvernement sud-vietnamien doit maintenant décider comment réagir. Vont-ils tenter de réviser la proposition et de faire une autre offre, ou ce rejet marquera-t-il la fin des efforts diplomatiques et le retour à des approches plus conflictuelles ?"
 NV_CuongDe_Unification.6.a: "Nous répondrons en conséquence."

 NV_CuongDe_Unification.7.t: "Les relations diplomatiques se détériorent"
 NV_CuongDe_Unification.7.d: "Suite au rejet par le Nord-Vietnam de la proposition d'unification, les relations diplomatiques entre les deux États vietnamiens se sont considérablement détériorées. L'échec de ces négociations a créé une nouvelle atmosphère de tension et de méfiance.\n\nLes deux parties ont durci leurs positions et les perspectives d'un futur dialogue pacifique semblent sombres. Le rejet a été interprété au Sud comme un signe que le Nord n'est pas véritablement intéressé par une réunification pacifique, tandis que le Nord considère probablement la proposition comme une tentative de saper sa légitimité.\n\nLes voies diplomatiques étant effectivement fermées, la situation est revenue à un état de guerre froide, les deux parties maintenant leurs chemins séparés et se préparant à un avenir incertain. Le rêve d'une réunification pacifique semble plus lointain que jamais."
 NV_CuongDe_Unification.7.a: "Retour au statu quo."

 NV_CuongDe_Unification.8.t: "Élections générales et réunification"
 NV_CuongDe_Unification.8.d: "Après un an de mise en oeuvre du processus d'unification en six étapes, des élections générales ont eu lieu dans tout le Vietnam. Les élections ont abouti à une victoire décisive du président Ngo-Dinh-Diem et du gouvernement sud-vietnamien, conduisant à la réunification formelle du Vietnam sous la direction du Sud.\n\nLe résultat n'a jamais été sérieusement mis en doute. L'administration du Nord avait rejeté les premières étapes du processus, les cadres du Viet-Minh étaient dispersés ou clandestins, et le décompte des voix était effectué par des fonctionnaires qui répondaient à Saigon. Les observateurs étrangers ont noté les irrégularités, mais le Haut-commissariat français a accepté le résultat et a reconnu le nouveau gouvernement national dans la semaine.\n\nPour le Sud, le vote met fin à un long débat sur la question de savoir qui parle au nom de la nation vietnamienne. Pour le Nord, c'est une défaite dont on se souviendra comme du moment où l'unité a été conquise par la force de l'administration plutôt que par un accord."
 NV_CuongDe_Unification.8.a: "Le Vietnam est réunifié !"

 NV_CuongDe_Unification.9.t: "Le moment est passé"
 NV_CuongDe_Unification.9.d: "L'accord de réunification a été signé par deux hommes - Ngo-Dinh-Diem et Ho Chi Minh - et il ne pouvait être exécuté que par eux. Avec le départ de l'un des signataires du pouvoir ou la reprise des échanges entre le Nord et le Sud, le délicat mécanisme du processus en six étapes s'est arrêté.\n\nLa correspondance reprend son silence, les postes frontières ferment et les commissions électorales sont discrètement dissoutes. Ce qui devait être la réunification du peuple vietnamien est devenu une nouvelle entrée dans le long registre des occasions manquées.\n\nLa maison reste divisée."
 NV_CuongDe_Unification.9.a: "Si proche et pourtant si loin."

 # Nhiep PM for Cuong-De
 CD_Nhiep.1.t: "Rapatriement des familles de Nam-Hung"
 CD_Nhiep.1.d: "Après la mort de l'empereur Cuong-De, nombre de membres de sa famille et de ses proches collaborateurs qui vivaient en exil au Japon ont exprimé leur désir de retourner au Vietnam. Ces individus, qui avaient suivi l'empereur en exil pendant la période coloniale, cherchent désormais à rentrer chez eux et à honorer son héritage.\n\nL'effort de rapatriement implique une coordination avec les autorités japonaises pour faciliter le retour de plusieurs dizaines de familles. Beaucoup de ces rapatriés sont des personnes âgées, ayant passé des décennies loin de leur pays d'origine. Ils apportent avec eux non seulement leurs effets personnels, mais aussi des souvenirs, des documents et des objets datant de l'exil de l'Empereur.\n\nPour le Premier ministre Nguyen-Rinh-Nhiep, cela représente une opportunité de renforcer les liens avec le Japon tout en honorant la mémoire de son prédécesseur. Le retour de ces familles contribuera à préserver l'héritage culturel et historique de la tradition impériale, même si le Vietnam avance sous un nouveau gouvernement."
 CD_Nhiep.1.a: "Accueillez-les chez vous à bras ouverts."

 CD_Nhiep.2.t: "Créer l'Association d'amitié vietnamo-japonaise ?"
 CD_Nhiep.2.d: "Le Premier ministre Nhiep a proposé la création d'une association d'amitié vietnamienne-japonaise formelle pour renforcer les liens culturels, économiques et diplomatiques entre les deux nations. Cette organisation servirait de pont entre le Vietnam et le Japon, facilitant les échanges dans les domaines de l'éducation, du commerce et de la technologie.\n\nLa proposition a été envoyée au gouvernement japonais pour examen. Une telle association serait la première du genre en Asie du Sud-Est et représenterait un pas en avant significatif dans la coopération régionale. Cela aiderait également le Vietnam à accéder à l'expertise japonaise en matière de modernisation et d'industrialisation, domaines dans lesquels le Japon a fait des progrès remarquables.\n\nLa réponse japonaise déterminera si ce plan ambitieux peut aller de l'avant, ouvrant potentiellement de nouvelles voies pour le développement et la coopération internationale du Vietnam."
 CD_Nhiep.2.a: "Nous attendons leur réponse."

 CD_Nhiep.3.t: "Création de l'Association d'amitié vietnamo-japonaise"
 CD_Nhiep.3.d: "Le gouvernement japonais a accepté avec enthousiasme la proposition du Premier ministre Nhiep et l'Association d'amitié vietnamo-japonaise a été officiellement créée. La cérémonie inaugurale s'est déroulée en présence de dignitaires des deux pays, marquant un moment historique dans les relations bilatérales.\n\nL'association coordonnera les échanges culturels, facilitera les accords commerciaux et promouvra les partenariats éducatifs. Des projets sont déjà en cours de discussion pour que des conseillers techniques japonais aident aux projets d'infrastructure vietnamiens, tandis que les étudiants vietnamiens auront la possibilité d'étudier au Japon.\n\nCependant, cette relation plus étroite avec le Japon n'est pas passée inaperçue auprès des autres puissances. La France et les États-Unis ont exprimé leur inquiétude quant aux liens croissants du Vietnam avec le Japon, y voyant un potentiel éloignement de leur sphère d'influence. Le paysage diplomatique devient de plus en plus complexe, mais le Premier ministre Nhiep reste déterminé à poursuivre la voie de l'indépendance du Vietnam."
 CD_Nhiep.3.a: "Une nouvelle ère de coopération commence."

 CD_Nhiep.4.t: "L'expansion de Phu-Xuan"
 CD_Nhiep.4.d: "Le Premier ministre Nhiep a annoncé un plan global visant à agrandir et moderniser Phu-Xuan, transformant l'ancienne capitale impériale en un centre administratif moderne. Le projet implique un vaste urbanisme, le développement des infrastructures et la construction de nouvelles installations gouvernementales.\n\nL'expansion comprend la création de nouveaux districts administratifs, la création de complexes de bureaux modernes et l'amélioration des infrastructures de la ville. L'objectif est de faire de Phu-Xuan non seulement un symbole du passé impérial du Vietnam, mais aussi une vitrine de son avenir moderne.\n\nDe manière symbolique, le gouvernement a également annoncé que la capitale serait officiellement transférée à Phu-Xuan, reconnaissant ainsi son importance historique tout en la positionnant comme le centre du nouvel ordre politique du Vietnam. Cette décision représente une rupture avec l'accent mis sur Saigon pendant l'ère coloniale et un retour aux centres de pouvoir vietnamiens traditionnels.\n\nLe projet est ambitieux et coûteux, mais le Premier ministre Nhiep estime qu'il est essentiel pour établir l'identité du Vietnam en tant que nation indépendante et moderne."
 CD_Nhiep.4.a: "Commencez la transformation."

 CD_Nhiep.5.t: "Projets de métro au Sud-Vietnam"
 CD_Nhiep.5.d: "Le gouvernement vietnamien a contacté le Japon avec une proposition visant à construire un système de métro moderne à Phu-Xuan, reliant la Citadelle impériale aux quartiers administratifs et commerciaux en pleine expansion de la ville. Il s'agirait du premier système ferroviaire souterrain d'Asie du Sud-Est, ce qui représenterait une avancée technologique importante.\n\nLes Japonais ont été invités à fournir à la fois une expertise technique et une aide financière au projet. Le métro servirait non seulement de solution de transport pratique pour la capitale en pleine croissance, mais aussi de symbole de la modernisation du Vietnam et de son partenariat avec le Japon.\n\nLa proposition comprend des plans pour une gare principale sous la Citadelle impériale, avec des lignes s'étendant vers les principales zones gouvernementales et commerciales. Les ingénieurs japonais ont déjà mené des études préliminaires et sont impressionnés par l'ambition du projet.\n\nToutefois, le coût est substantiel et le gouvernement japonais doit peser les avantages de cet investissement par rapport à d'autres priorités. Leur décision déterminera si le Vietnam peut franchir cette étape majeure vers la modernisation."
 CD_Nhiep.5.a: "Nous financerons et aiderons le projet."
 CD_Nhiep.5.b: "Nous ne pouvons pas nous engager dans une entreprise aussi coûteuse pour le moment."

 CD_Nhiep.6.t: "Début des travaux de construction de la station de métro Citadelle Impériale"
 CD_Nhiep.6.d: "Grâce au financement et au soutien technique japonais, la construction du système de métro Phu-Xuan a officiellement commencé. Le projet commence par la gare phare située sous la Citadelle Impériale, un lieu choisi à la fois pour son importance symbolique et sa position centrale dans la ville.\n\nDes ingénieurs japonais et des travailleurs vietnamiens travaillent côte à côte, les dernières technologies de tunnel étant utilisées pour créer le réseau souterrain. Le chantier de construction est devenu un centre d'activité, avec des grues, des excavatrices et des équipes de construction travaillant 24 heures sur 24.\n\nLe projet devrait durer environ deux ans, période pendant laquelle la ville devra gérer les perturbations causées par la construction. Cependant, la promesse d'un système de transport moderne a suscité l'enthousiasme de la population, qui y voit une preuve des progrès du Vietnam.\n\nLe Premier ministre Nhiep a personnellement visité le chantier de construction, soulignant l'importance de ce projet pour l'avenir du Vietnam. \"Ce métro\", a-t-il déclaré, \"transportera non seulement des passagers, mais aussi les espoirs d'un Vietnam moderne\"."
 CD_Nhiep.6.a: "Un symbole de progrès surgit de la terre."

 CD_Nhiep.7.t: "Ouverture de la station de métro Citadelle Impériale"
 CD_Nhiep.7.d: "Après deux années de construction intensive, le système de métro Phu-Xuan a été achevé et officiellement ouvert au public. La grande cérémonie d'ouverture s'est déroulée en présence du Premier ministre Nhiep, de dignitaires japonais et de milliers de citoyens rassemblés pour assister à ce moment historique.\n\nLe système de métro comprend des stations ultramodernes, des trains modernes fournis par des fabricants japonais et un vaste réseau reliant la Citadelle impériale aux quartiers clés de la capitale. La gare principale située sous la Citadelle est particulièrement impressionnante, avec son design élégant mêlant éléments architecturaux traditionnels vietnamiens et fonctionnalités modernes.\n\nL'achèvement de ce projet représente une réalisation majeure pour le Vietnam. Non seulement il assure un transport efficace pour la population croissante de la capitale, mais il démontre également la capacité du pays à entreprendre et à réaliser des projets d'infrastructure à grande échelle. Le métro est devenu une source de fierté nationale, un symbole tangible de la modernisation du Vietnam.\n\nLes conseillers techniques japonais restent au Vietnam pour assurer le bon fonctionnement du système et former les ingénieurs vietnamiens à la maintenance et à l'expansion future. Le succès de ce projet a renforcé le partenariat entre les deux nations et ouvert la porte à une coopération plus poussée."
 CD_Nhiep.7.a: "Une nouvelle ère du transport urbain commence."

 CD_Nhiep.8.t: "Les Japonais refusent nos projets"
 CD_Nhiep.8.d: "Le gouvernement japonais a malheureusement refusé de financer le projet du métro de Phu-Xuan, invoquant des contraintes budgétaires et d'autres priorités. Bien qu'ils aient exprimé leur intérêt pour le concept et salué l'ambition du Vietnam, ils ne peuvent pas engager les ressources substantielles nécessaires pour le moment.\n\nCette décision est une déception pour le Premier ministre Nhiep et son gouvernement, qui espéraient que le métro servirait de pièce maîtresse de leurs efforts de modernisation. Ce refus représente également un revers dans les relations vietnamiennes-japonaises, même si les deux parties ont souligné leur engagement à maintenir des relations amicales.\n\nCertains au sein du gouvernement ont suggéré de rechercher des sources de financement alternatives ou de réduire le projet, mais pour l'instant, l'ambitieux projet de métro doit être mis de côté. Le rêve d'un système ferroviaire souterrain moderne pour Phu-Xuan devra attendre des circonstances plus favorables.\n\nLes relations diplomatiques avec le Japon restent intactes, mais cet épisode rappelle que les partenariats internationaux, bien que précieux, ne peuvent pas toujours être fiables pour des investissements majeurs dans les infrastructures."
 CD_Nhiep.8.a: "Nous trouverons une autre voie à suivre."

 CD_Nhiep.9.t: "Préparation du mausolée de Nam-Hung"
 CD_Nhiep.9.d: "Le Premier ministre Nhiep a annoncé son intention de construire un grand mausolée à Phu-Xuan pour honorer la mémoire de l'empereur Cuong-De, qui avait pris le nom royal de Nam-Hung pendant son règne. Ce monument servira de lieu de repos final au défunt empereur et de mémorial permanent à son héritage.\n\nLe mausolée est conçu pour refléter à la fois l'architecture impériale vietnamienne traditionnelle et les techniques de construction modernes. Il sera situé dans un emplacement bien en vue au sein de la capitale, garantissant que la mémoire de l'Empereur reste au coeur de l'identité de la nation.\n\nLe projet implique non seulement la construction du mausolée lui-même, mais également la création de jardins environnants, de salles commémoratives et d'espaces cérémoniels. Le design intègre des éléments qui honorent à la fois le rôle de l'empereur dans l'histoire vietnamienne et sa vision d'un Vietnam indépendant.\n\nLa construction devrait durer environ deux ans, période pendant laquelle le site sera préparé et la structure construite selon les normes les plus exigeantes. Ce sera un hommage durable à un dirigeant qui a consacré sa vie à la cause de l'indépendance vietnamienne."
 CD_Nhiep.9.a: "Commencez la construction de ce monument sacré."

 CD_Nhiep.10.t: "L'ouverture du mausolée de Nam-Hung"
 CD_Nhiep.10.d: "Après deux ans de construction, le mausolée de l'empereur Nam-Hung est achevé et officiellement inauguré. La grande cérémonie s'est déroulée en présence de représentants du gouvernement, de membres de la famille impériale et de milliers de citoyens venus lui rendre hommage.\n\nLe mausolée est une structure magnifique, combinant des éléments architecturaux traditionnels vietnamiens avec un design moderne. Ses salles contiennent des expositions documentant la vie de l'empereur, ses années d'exil et ses contributions au mouvement indépendantiste vietnamien. Les jardins environnants offrent un espace paisible de réflexion et de souvenir.\n\nL'achèvement du mausolée a transformé Phu-Xuan, ajoutant un monument culturel et historique important à la capitale. C'est devenu une destination à la fois pour les citoyens vietnamiens et les visiteurs étrangers, rappelant l'histoire complexe de la nation et les sacrifices consentis dans la poursuite de l'indépendance.\n\nLe Premier ministre Nhiep, dans son discours d'inauguration, a souligné que le mausolée ne représente pas seulement la mémoire d'un homme, mais aussi l'esprit durable du nationalisme vietnamien et la lutte en cours pour une véritable indépendance. \"Ici\", a-t-il déclaré, \"nous honorons non seulement un empereur, mais l'idée d'un Vietnam libre\"."
 CD_Nhiep.10.a: "Un monument durable à un grand leader."

 CD_Nhiep.11.t: "La 1ère Conférence Phuc-Quoc Hoi"
 CD_Nhiep.11.d: "Le Premier ministre Nhiep a convoqué la première grande conférence de Phuc-Quoc Hoi (Association nationale de restauration), réunissant des membres du parti, des responsables gouvernementaux et des représentants de tout le Vietnam. Ce rassemblement représente un moment important dans la consolidation du nouvel ordre politique.\n\nLa conférence répond à plusieurs objectifs : elle fournit une plate-forme pour discuter de politique, renforce l'unité du parti et démontre l'engagement du gouvernement envers les processus démocratiques. Des délégués de diverses régions se sont rendus à Phu-Xuan pour y participer, ce qui en fait l'un des plus grands rassemblements politiques de l'histoire moderne du Vietnam.\n\nLes principaux sujets à l'ordre du jour comprennent le développement économique, la réforme administrative et l'expansion de l'influence du parti à travers le pays. Le Premier ministre Nhiep prononce un discours majeur décrivant sa vision de l'avenir du Vietnam, mettant l'accent sur la modernisation, l'indépendance et l'unité nationale.\n\nLa conférence sert également à honorer ceux qui ont été fidèles à la cause, de nombreux officiers militaires et représentants du gouvernement recevant une reconnaissance pour leurs services. L'atmosphère est à l'optimisme et à la détermination, alors que le parti cherche à construire une base solide pour l'avenir du Vietnam.\n\nÀ l'issue de la conférence, le Phuc-Quoc Hoi est devenu une force plus organisée et plus influente dans la politique vietnamienne, avec un programme clair et une cohésion interne renforcée."
 CD_Nhiep.11.a: "Unité et progrès pour le Vietnam."

 # Coconut Monk
 Cocunut_Monk.1.t: "La légende du moine noix de coco"
 Cocunut_Monk.1.d: "Ces dernières années, dans tout le sud de la Cochinchine, une légende populaire a circulé à propos d'un moine errant surnommé « Ong Dao-Dua », ou le moine de la noix de coco.\n\nRécemment, nous avons reçu des informations selon lesquelles il se serait rendu dans la commune de Phuoc-Thanh, province de Kien-Hoa, où il aurait commencé à construire une plate-forme bagua de 14 mètres de haut. Nuit après nuit, il s'asseyait et pratiquait l'ascétisme sur la plate-forme tout en recevant de l'argent des passants. Il ne mangeait que des fruits, principalement des noix de coco, et ne portait qu'une chemise fine, restant assis en silence jour et nuit. Curieusement, même s'il a été ordonné moine bouddhiste, il a plutôt pratiqué et diffusé une nouvelle croyance syncrétisée qui intègre le christianisme, les croyances populaires, le cao-daoïsme et le dharma bouddhiste dans la région de Kien-Hoa. Il ne se baignait qu'une fois par an le jour de l'anniversaire de Bouddha (AL 8-4), et nous avons même reçu un rapport selon lequel il avait récemment acheté de petites barges et deux navires à passagers pour faciliter les pratiques religieuses et le transport des croyants vers son sanctuaire."
 Cocunut_Monk.1.a: "Nous devrons le surveiller pour l'instant..."
 VIE_Lien_Minh.1.t: "Rumeurs sur le brigadier The"
 VIE_Lien_Minh.1.d: "Malgré son opposition publique au communisme, des rumeurs croissantes ont émergé concernant les relations clandestines du général de brigade caodaïste Trinh-Minh-The avec le Viet-Minh. Les rapports indiquent que le 17 février 1950, ils ont fourni des armes aux forces viet-minh à Trang-Bang pour une attaque contre un convoi français. En outre, ses représentants auraient été vus assister aux réunions du Viet-Minh à Long-Thanh le 30 avril et à Dong-Thap-Muoi le 14 juin.\n\nCes révélations ont fait naître des soupçons selon lesquels The pourrait avoir poursuivi une entente secrète avec les communistes, cherchant peut-être à sécuriser ses forces et à protéger le Saint-Siège Cao-Dai des attaques du Viet-Minh. En effet, les affrontements entre ses troupes et le Viet-Minh sont restés relativement mineurs, souvent limités à des différends concernant l'approvisionnement en nourriture et en céréales. Les forces Cao-Dai de The ne comptant qu'environ 2 000 à 3 000 hommes, une confrontation directe avec les forces beaucoup plus importantes du Viet-Minh serait difficile à maintenir.\n\nBien que le brigadier The continue de dénoncer à la fois le colonialisme français et le communisme, ses actions apparemment contradictoires ont placé Saigon dans une position inconfortable. Le commandant Cao-Dai coopère-t-il secrètement avec le Viet-Minh pour préserver son propre pouvoir, ou est-il simplement en train de gagner du temps jusqu'à ce que son mouvement nationaliste indépendant soit suffisamment fort pour être autonome ?"
 VIE_Lien_Minh.1.a: "Demandez au Xac-te de démarrer un dossier sur cette personne."
 VIE_Lien_Minh.2.t: "Trinh-Minh-The proclame le Front Lien-Minh"
 VIE_Lien_Minh.2.d: "Début juin 1951, le général de brigade Trinh-Minh-The est nommé chef d'état-major de l'armée Cao-Dai, en remplacement du général de division Nguyen-Thanh-Phuong. Cependant, son mandat ne durera que vingt-quatre heures. Aux premières heures du 7 juin, The a secrètement conduit plus de 3 500 soldats qui lui étaient fidèles loin de l'établissement militaire de Cao-Dai, traversant la rivière Vam-Co-Dong et se retirant dans les forêts de Bung-Ro, où il a établi un quartier général provisoire. Ses forces se déplaceront ensuite plus au sud le long de la frontière vietnamo-cambodgienne, établissant la zone de guerre fortifiée de Bu-Lu.\n\nLe 8 juin, The a été promu au grade de major général par le lieutenant-général Nguyen-Van-Thanh, agissant au nom des dirigeants religieux Cao-Dai. Néanmoins, The rompit formellement ses liens avec la hiérarchie religieuse Cao-Dai et proclama la création d'un mouvement militaire indépendant connu sous le nom de Lien-Minh (Alliance). Rejetant à la fois la domination coloniale française et le Viet-Minh communiste, ils envisageaient une troisième force nationaliste indépendante, capable d'unir les différentes factions religieuses et militaires du Vietnam.\n\nLe mouvement s'est rapidement développé en Front de résistance nationale, également connu sous le nom de Front interreligieux, réunissant les forces Cao-Dai, la communauté catholique de Ben-Tre, les bouddhistes Hoa-Hao et les Binh-Xuyen sous la bannière collective du Front Cao-Thien-Hoa-Binh. Ses formations militaires sont devenues connues sous le nom d'Armée Quoc-Gia Lien-Minh (Armée nationale unie), Trinh-Minh-The assumant les postes de président du Front et de commandant en chef. Plusieurs officiers éminents le suivirent dans le nouveau mouvement, dont Van-Thanh-Cao, nommé commandant en chef adjoint, aux côtés de Nhi-Lang et du colonel Ho-Han-Son.\n\nL'Alliance a établi son quartier général dans la région de Ba-Den. La campagne environnante était fortifiée par un réseau d'avant-postes militaires à Ho-Bo, Boi-Loi, Nui-Heo et Nui-Cau."
 VIE_Lien_Minh.2.t_phuong: "Nguyen-Thanh-Phuong proclame le Front Lien-Minh"
 VIE_Lien_Minh.2.d_phuong: "Trinh-Minh-The servant désormais dans l'armée nationale, l'establishment militaire de Cao-Dai a perdu l'officier que beaucoup attendaient pour diriger sa faction dissidente. Début juin 1951, c'est le lieutenant-général Nguyen-Thanh-Phuong qui fait le break. Aux premières heures du 7 juin, Phuong a éloigné du Saint-Siège des milliers de soldats qui lui étaient fidèles, traversant la rivière Vam-Co-Dong et se retirant dans les forêts de Bung-Ro, où il a établi un quartier général provisoire. Ses forces se sont depuis déplacées vers le sud, le long de la frontière vietnamo-cambodgienne, établissant la zone de guerre fortifiée de Bu-Lu.\n\nPhuong a officiellement rompu ses liens avec la hiérarchie religieuse Cao-Dai et a proclamé la création d'un mouvement militaire indépendant connu sous le nom de Lien-Minh (Alliance). Rejetant à la fois la domination coloniale française et le Viet-Minh communiste, il présente le mouvement comme une Troisième Force nationaliste indépendante, capable d'unir les différentes factions religieuses et militaires du Vietnam.\n\nLe mouvement s'est développé pour devenir le Front de résistance nationale, également connu sous le nom de Front interreligieux, réunissant les forces Cao-Dai, la communauté catholique de Ben-Tre, les bouddhistes Hoa-Hao et les Binh-Xuyen sous la bannière collective du Front Cao-Thien-Hoa-Binh. Ses formations militaires sont connues sous le nom d'Armée Quoc-Gia Lien-Minh (Armée nationale unie), avec Phuong comme président du Front et commandant en chef et Van-Thanh-Cao comme commandant en chef adjoint.\n\nL'Alliance a établi son quartier général dans la région de Ba-Den. La campagne environnante est fortifiée par un réseau d'avant-postes militaires à Ho-Bo, Boi-Loi, Nui-Heo et Nui-Cau."
 VIE_Lien_Minh.2.a: "Une autre armée dans la jungle, donc."
 VIE_Lien_Minh.3.t: "Le Lien-Minh se retourne contre le communisme"
 VIE_Lien_Minh.3.d: "Le mouvement Lien-Minh a connu un changement radical suite à une tragédie personnelle dévastatrice pour son commandant. En 1953, Nam-Quoi, père du général Trinh-Minh-The, et son jeune frère Trinh-Minh-Duc, lieutenant de Cao-Dai, furent assassinés par une bombe secrètement posée dans leur résidence de Long-Hung. Les principales forces armées Cao-Dai ont par la suite publié une déclaration accusant le Viet-Minh d'être responsable de l'attaque, attisant encore davantage le sentiment anticommuniste au sein des communautés religieuses et militaires.\n\nLa mort de ses proches semble avoir profondément durci la position du général The à l'égard des communistes. Abandonnant toute ambiguïté restante sur ses relations avec le Viet-Minh, il adopte un nouveau slogan politique : « Bao-phong, Ta-thuc, Diet-Cong » (Opposez-vous au colonialisme, éradiquez la féodalité et détruisez les communistes).\n\nParallèlement, les rapports des services de renseignement français ont soulevé de nouvelles controverses sur les activités de Lien-Minh. Les forces du général The ont été impliquées dans une série d'attentats à la bombe contre des cibles militaires françaises à Saigon entre 1951 et 1953, attaques initialement attribuées aux insurgés communistes. Les services de renseignement français ont également suggéré que des agents de Lien-Minh pourraient avoir été impliqués dans l'assassinat du général Chanson à Sa-Dec en 1951, bien que ces allégations restent à prouver.\n\nAvec sa famille assassinée, ses relations avec le Viet-Minh qui se détériorent et les autorités françaises de plus en plus méfiantes à l'égard de ses activités, Trinh-Minh-The semble déterminé à poursuivre une voie nationaliste indépendante. Le Lien-Minh se retrouve désormais opposé non seulement à la domination coloniale française, mais de plus en plus engagé dans la destruction de l'influence communiste dans le sud du Vietnam."
 VIE_Lien_Minh.3.a: "Peut-être qu'ils devraient alors arrêter les bombardements."
 VIE_Sect_Intro.1.t: "Le-Van-Vien et le Binh-Xuyen"
 VIE_Sect_Intro.1.d: "Peu d'hommes dans l'État du Vietnam exercent autant d'influence - ou autant de controverses - que Le-Van-Vien, mieux connu dans toute la Cochinchine sous le nom de Bay-Vien. Issu des enfers de Saigon-Cho-Lon, il a transformé Binh-Xuyen, autrefois fragmenté, en l'une des organisations armées les plus puissantes du sud du Vietnam.\n\nLes origines du Binh-Xuyen remontent aux jours turbulents qui ont suivi la Révolution d'août 1945. Nommée d'après les marais de Binh-Xuyen près de Saigon, la force a d'abord été unifiée par Duong-Van-Duong, regroupant de nombreux groupes armés opérant dans tout Nha-Be, Thu-Thiem, Tan-Thuan et les voies navigables entourant la capitale. Initialement luttant contre le retour des Français, l'organisation s'est forgée une formidable réputation grâce à sa connaissance du labyrinthe de rivières et de canaux de la région.\n\nAprès la mort de Duong-Van-Duong en 1946, le mouvement se fracture. Tandis qu'une faction restait avec le Viet-Minh, Le-Van-Vien assumait progressivement la direction d'une autre aile. En 1948, il rompt avec les communistes et rallie ses forces à l'État du Vietnam soutenu par la France, réorganisant ses hommes sous la bannière des Cong-an Xung-phong (volontaires de la police nationale).\n\nEn 1949, Bay-Vien s'était fermement établi comme le chef incontesté des Binh-Xuyen. Depuis son siège près du pont Chu-Y, son organisation contrôlait de vastes opérations de sécurité dans tout Saigon-Cho-Lon tout en entretenant ses propres casernes, entreprises et réseau politique. Pour ses partisans, il est un nationaliste patriotique dont les forces assurent la stabilité dans une ville menacée par les insurgés communistes et les troubles politiques. Cependant, pour ses détracteurs, il reste à la tête d'un puissant syndicat criminel dont l'influence s'étend aux jeux de hasard, au divertissement et au marché noir.\n\nMalgré sa réputation controversée, le chef de l'État Bao-Dai a reconnu la valeur militaire des Binh-Xuyen."
 VIE_Sect_Intro.1.a: "Comment une bande de voyous peut-elle contrôler la police ?"
 VIE_Sect_Intro.2.t: "L'armée Hoa-Hao et l'armée Nguyen-Trung-Truc"
 VIE_Sect_Intro.2.d: "Les plaines fertiles du delta du Mékong sont depuis longtemps la patrie spirituelle du mouvement bouddhiste Hoa-Hao. Fondée par Huynh-Phu-So, la foi a rapidement gagné des millions d'adeptes parmi la population rurale, combinant le bouddhisme populaire, les croyances populaires et un fort sentiment de nationalisme sud-vietnamien. Dans les années turbulentes qui ont suivi la Révolution d'Août, les Hoa-Hao sont également devenus une formidable force militaire et politique dans le sud du Vietnam.\n\nÀ la fin de 1946, les dirigeants Hoa-Hao ont organisé leurs partisans armés dans l'Armée nationale révolutionnaire de défense et de résistance Nguyen-Trung-Truc (Nghia-quan Cach-mang Ve-quoc Lien-doi Nguyen-Trung-Truc), nommée en l'honneur du légendaire patriote anti-français Nguyen-Trung-Truc. À son apogée, la force comptait près de 20 000 soldats armés soutenus par des centaines de milliers de miliciens locaux et de fidèles croyants, ce qui en faisait l'une des plus grandes armées non étatiques d'Indochine.\n\nCependant, après la disparition de Huynh-Phu-So en 1947, le mouvement se fracture. Les commandants rivaux - dont Tran-Van-Soai (Nam-Lua), Lam-Thanh-Nguyen (Hai-Ngoan), Le-Quang-Vinh (Ba-Cut) et Nguyen-Giac-Ngo - ont établi leurs propres bastions régionaux dans les provinces de l'ouest. Bien qu'unis par leur foi Hoa-Hao, ces dirigeants poursuivaient souvent des ambitions politiques différentes, ce qui entraînait de fréquentes rivalités et des alliances changeantes.\n\nAvec la création de l'État du Vietnam en 1949, de nombreux commandants Hoa-Hao ont apporté leur soutien au chef de l'État Bao-Dai, considérant le nouveau gouvernement comme le meilleur moyen de protéger à la fois leurs communautés religieuses et l'autonomie du delta du Mékong. En retour, Saigon a reconnu les forces armées Hoa-Hao comme un allié important dans la lutte contre l'expansion communiste."
 VIE_Sect_Intro.2.a: "Que l'esprit éternel de Nguyen-Trung-Truc bénisse notre juste cause contre les communistes démoniaques !"
 VIE_Sect_Intro.3.t: "L'Empire du Bay-Vien"
 VIE_Sect_Intro.3.d: "L'influence du baron Le-Van-Vien, plus connu sous le nom de Bay-Vien, atteint des sommets sans précédent. Déjà l'un des commandants militaires les plus influents de l'État du Vietnam, le dirigeant Binh-Xuyen n'a cessé d'étendre son empire économique à travers le sud du Vietnam, faisant de lui l'une des personnalités les plus riches et les plus puissantes d'Indochine.\n\nLe 1er janvier 1951, Bay-Vien obtient la concession d'exploitation du célèbre Casino Grand Monde (Dai-The-Gioi) à Cho-Lon, l'un des plus grands établissements de jeux d'Asie. Soutenu par de riches hommes d'affaires chinois et bénéficiant de la confiance du chef de l'État Bao-Dai, il réussit à surenchérir sur les intérêts rivaux et à prendre le contrôle du casino. La possession du Dai-The-Gioi a effectivement donné aux Binh-Xuyen une énorme influence sur la vie commerciale trépidante de Cho-Lon, le coeur économique de la communauté chinoise au Vietnam.\n\nSes intérêts commerciaux ne s'arrêtent pas là. Bay-Vien a également obtenu la concession du casino Kim-Chung, investi dans des opérations forestières, des sociétés de transport, des entreprises commerciales et de nombreuses autres entreprises dans toute la Cochinchine. Combinée au contrôle exercé par Binh-Xuyen sur la police et la sécurité dans certaines parties de Saigon, son organisation est devenue à la fois une force militaire et une vaste entreprise commerciale.\n\nLes partisans soutiennent que la richesse de Bay-Vien lui permet de financer ses troupes sans alourdir le trésor public tout en maintenant l'ordre dans des régions longtemps en proie à l'instabilité. Ses détracteurs préviennent cependant que la frontière entre les entreprises légitimes et le crime organisé est devenue de plus en plus floue, craignant qu'aucun citoyen privé ne puisse exercer un pouvoir politique, militaire et économique aussi énorme."
 VIE_Lien_Minh.4.t: "Formation du Front uni des forces nationales"
 VIE_Lien_Minh.4.d: "Alors qu'une grande partie du delta du Mékong sombre dans le désordre, les formations armées des Hoa-Hao et des Cao-Dai se battent de plus en plus pour l'influence territoriale, tandis que les Binh-Xuyen maintiennent leurs propres bastions militaires et mafieux autour de Saigon. De grandes parties de la campagne échappent à l'autorité effective du gouvernement central, suscitant des inquiétudes parmi les dirigeants sectaires du pays et le chef de l'État, Bao-Dai.\n\nCherchant à empêcher une nouvelle fragmentation, Bao-Dai envoya son cousin, le prince Vinh-Canh, négocier avec les factions religieuses et militaires. Ses efforts aboutirent à un accord de non-agression entre les Cao-Dai et les Hoa-Hao, ouvrant la voie à une alliance plus large avec les Binh-Xuyen. Le 4 mars, les différentes factions ont officiellement créé le Mat-Tran Thong-Nhut Toan-Luc Quoc-Gia (Front uni des forces nationales), sous la présidence du pape Cao-Dai Pham-Cong-Tac.\n\nLe Front réunissait les armées Cao-Dai et Hoa-Hao, les armées Binh-Xuyen, le Parti Dan-Xa et les armées Lien-Minh. Son objectif déclaré était de protéger le pays, de servir le peuple et de maintenir l'autorité de Bao-Dai. Cependant, sa formation représentait également un défi collectif pour le Premier ministre Ngo-Dinh-Diem, dont le gouvernement cherchait de plus en plus à placer les organisations armées autonomes sous le contrôle de Saigon.\n\nMalgré leur opposition commune à la centralisation de Diem, le Front reste divisé. [GetVIEUnitedFrontModerates], tandis que Le-Van-Vien et Le-Quang-Vinh prônaient l'affrontement armé. Des conseillers politiques, dont Tran-Van-An, Ho-Huu-Tuong, Tran-Thai-Hue et Nhi-Lang, se sont également associés à la coalition.\n\nDiem, cependant, a refusé de négocier des concessions politiques avant que les armées sectaires n'acceptent l'unification militaire sous l'égide de l'Armée nationale."
 VIE_Lien_Minh.4.t_partial: "Les restes des sectes s'unissent"
 VIE_Lien_Minh.4.d_partial: "Alors que la campagne échappait toujours à la pleine autorité du gouvernement central, le chef de l'État Bao-Dai envoya son cousin, le prince Vinh-Canh, pour rassembler les forces sectaires restantes. Le 4 mars, ce qui reste des armées autonomes a officiellement proclamé le Mat-Tran Thong-Nhut Toan-Luc Quoc-Gia (Front uni des forces nationales), sous la présidence du pape Cao-Dai Pham-Cong-Tac.\n\nLe Front prétend protéger le pays, servir le peuple et maintenir l'autorité de Bao-Dai, mais il n'est pourtant que l'ombre de la coalition imaginée autrefois par ses organisateurs. Plusieurs des grandes armées sectaires ont déjà été démantelées ou absorbées dans l'Armée nationale, et celles qui restent n'apportent à la table que les restes de leurs anciennes forces.\n\nLe Front constitue néanmoins un défi direct au Premier ministre Ngo-Dinh-Diem, qui a refusé de discuter de concessions politiques avant que chaque organisation armée n'accepte l'unification militaire. Sa faiblesse rend cependant la position de Diem plus claire que jamais : les sectes ne peuvent plus négocier sur un pied d'égalité."
 VIE_united_front_loyalty_tt: "Chaque membre restant du Front (§YBinh-Xuyen§!, §YCao-Dai§!, §YHoa-Hao§!, §YLien-Minh§!) tombe à §R0%§! §YFidélité§!"
 VIE_UF_MODERATES_THE: "Des modérés tels que Lam-Thanh-Nguyen et Trinh-Minh-The étaient favorables à une collaboration avec le gouvernement ; Nguyen-Thanh-Phuong maintient une position plus neutre"
 VIE_UF_MODERATES_PHUONG: "Des modérés comme Lam-Thanh-Nguyen étaient favorables à la collaboration avec le gouvernement ; Nguyen-Thanh-Phuong, désormais à la tête du Lien-Minh, maintient une position plus neutre"
 VIE_Lien_Minh.4.a: "Une poudrière."
 VIE_Sect_Intro.4.t: "Le Corps auxiliaire des guerriers justes de Cao-Dai"
 VIE_Sect_Intro.4.d: "Issue du mouvement religieux et politique créé en 1926, l'armée Cao-Dai, officiellement organisée sous le nom de Doan Noi-Ung Nghia-Binh (Corps auxiliaire des guerriers justes), est devenue la force militaire sectaire la plus puissante et la plus importante du sud du Vietnam. Enraciné dans la foi syncrétique Cao-Dai, qui combine des éléments du bouddhisme, du taoïsme, du confucianisme, du christianisme et du culte des esprits, le mouvement s'est progressivement transformé en une puissance politique et militaire indépendante sous l'influence de sa hiérarchie religieuse.\n\nSon organisation armée prend forme vers 1943 sous la direction du général Tran-Quang-Vinh, avec l'aide du Kempeitai japonais. Les armes et le soutien financier japonais ont permis la formation d'unités paramilitaires clandestines comptant environ 3 000 hommes. Ces forces ont ensuite participé à la prise de l'Indochine par le Japon en mars 1945, contribuant à la sécurité et au maintien de l'ordre locaux jusqu'à la capitulation du Japon plus tard dans l'année. Le retour français qui s'ensuit amena le Cao-Dai dans une confrontation armée avec le Viet-Minh.\n\nEn 1949, après l'établissement du Vietnam en tant qu'État associé au sein de l'Union française, les dirigeants de Cao-Dai avaient prêté allégeance au chef d'État Bao-Dai. Leurs relations avec les autorités françaises restent toutefois largement pragmatiques, dans la mesure où la coopération militaire et la formation française offrent des opportunités de préserver et d'étendre leur propre influence territoriale. Le retour d'exil du pape Cao-Dai Pham-Cong-Tac et l'accord de paix qui a suivi en août ont encore renforcé la position politique de la secte.\n\nNéanmoins, le Cao-Dai resta profondément protecteur de son autonomie, se heurtant fréquemment aux armées religieuses rivales, en particulier les Hoa-Hao. Comme l'aurait observé un officier français, la secte n'avait ni ennemis ni amis permanents, seulement des intérêts permanents qui lui étaient propres."
 VIE_Sect_Intro.4.a: "Nos intérêts permanents sont alignés."
 VIE_Sect_Intro.5.t: "L'UMDC : défenseurs de la chrétienté"
 VIE_Sect_Intro.5.d: "Créées à l'origine en août 1947 sous la direction du riche propriétaire eurasien Jean Léon Leroy, avec le soutien personnel du général Pierre Boyer de la Tour et de l'armée française, les Unités Mobiles pour la Défense des Chrétiens (UMDC) sont devenues l'une des organisations armées sectaires les plus redoutables du sud du Vietnam. Fondée pour protéger les communautés catholiques et mener une croisade contre les incursions du Viet-Minh et d'autres forces hostiles, la milice a étendu son influence dans tout Ben-Tré et dans les provinces voisines, comptant environ 3 100 membres armés.\n\nMalgré sa mission religieuse, l'UMDC est devenue de plus en plus un fief militaire personnel sous Leroy, jouissant d'une autonomie considérable grâce à une importante assistance financière et logistique française. Ses forces ont été accusées de massacres, de conversions forcées et de persécution systématique des adeptes du moine cocotier et des communautés bouddhistes, tandis que son célèbre escadron de la mort, le Hac-Y-Dang (groupe vêtu de noir ou groupe du crâne), mène des assassinats et des intimidations contre des ennemis présumés et des innocents."
 VIE_Sect_Intro.5.a: "Pro Deo et Patria ?"
 VIE_Sect_Intro.3.a: "Nous devons faire quelque chose à ce sujet."

 # Diplomacy

 # VIE & USA Support
 VIE_USA_Support.1.t: "[VIE.GetLeader]le virage diplomatique"
 VIE_USA_Support.1.d: "Récemment, notre attention s'est concentrée sur les situations actuelles en Chine et en Corée, et un autre pays d'Asie du Sud-Est nous a demandé de l'aide. L'État du Vietnam, ancien État colonial français, est confronté à une insurrection communiste en interne et à une guerre à grande échelle de la part de l'État nord-vietnamien soutenu par les Soviétiques. Un tel enchevêtrement ne prendrait probablement pas longtemps, et nous pouvons prédire un effondrement rapide du Nord-Vietnam si nous mettions tout notre poids derrière le Sud.\n\nLe chef de l'État et le Premier ministre n'ont pas encore formulé de demandes à notre égard, mais le Pentagone nous conseille de fournir dès maintenant du matériel militaire et éventuellement de préparer les forces aériennes et terrestres à s'impliquer formellement en cas d'agression du Nord contre le Sud."
 VIE_USA_Support.1.a: "Nous ne pouvons pas laisser tomber les dominos."

 VIE_USA_Support.2.t: "Intervention proposée au Vietnam"
 VIE_USA_Support.2.d: "Avec le général combattant au Vietnam, Saigon est revenu à nous, et la liste est cette fois plus longue. Aide financière et industrielle. Conseillers militaires. Soutien logistique à une campagne de bombardement et aérienne. Équipement pour l'Armée nationale vietnamienne. Et, à la fin de la liste, là où ils espéraient que cela attirerait le moins d'attention, l'implication militaire américaine directe.\n\nLe Pentagone s'y emploie actuellement. L'évaluation militaire prendra des semaines ; la question politique est effectivement déjà faite, car l'alternative à l'aide à un gouvernement anticommuniste en Asie du Sud-Est est d'observer ce qui le remplace et de l'expliquer au Sénat.\n\nC'est l'argument, et il est fort. La partie que personne n'a encore mise sur papier est celle où s'arrête l'engagement. Chaque élément de cette liste rend l'élément suivant plus facile à accorder, et le dernier élément de la liste concerne les soldats américains."
 VIE_USA_Support.2.a: "Préparez l'état-major. Les dominos s'arrêtent ici."
 VIE_USA_Support.2.b: "Ce n'est pas notre problème. Nous ne mettrons pas en danger les militaires américains."

 # VIE & CHI
 VIE_Chinese_Cooperation.1.t: "L'ambassade de Chine à Saigon"
 VIE_Chinese_Cooperation.1.d: "La mission des [CHI.GetNameDef] a ouvert ses portes rue Catinat. La chancellerie est modeste et la plupart de son personnel est composé d'officiers consulaires provenant de l'ancienne agence commerciale, mais le drapeau est levé et l'accréditation appartient à notre gouvernement plutôt qu'au Haut-commissariat.\n\nLa reconnaissance compte plus que le bâtiment. Tout Etat qui traite directement avec Saigon est un Etat qui n'attend plus que Paris réponde en notre faveur. Il y a aussi à Cholon une centaine de milliers de Chinois dont les affaires ont été jusqu'à présent gérées par des fonctionnaires qui n'ont aucun pouvoir pour les gérer, et c'est une circonscription qu'aucun gouvernement ici ne peut se permettre de laisser à quelqu'un d'autre.\n\nAucun des deux ministères des Affaires étrangères n'a été timide quant au deuxième calcul derrière l'échange. Nous avons tous deux sur notre territoire un mouvement communiste armé, discipliné et approvisionné au-delà d'une frontière que nous ne contrôlons pas."
 VIE_Chinese_Cooperation.1.a: "Un ami de l'autre côté du Viet-Minh."

 VIE_Chinese_Cooperation.2.t: "Exercices militaires conjoints vietnamo-chinois"
 VIE_Chinese_Cooperation.2.d: "Alors que le lien entre le [CHI.GetName] et notre nation se renforce, les deux gouvernements décident de mener un exercice militaire conjoint. Espérons que les deux nations pourront apprendre l'une de l'autre dans la lutte contre les communistes."
 VIE_Chinese_Cooperation.2.a: "Excellent!"

 # VIE & Malaysia
 VIE_Malaysia.1.t.a: "Reconnaissance pour la Fédération en exil"
 VIE_Malaysia.1.t.b: "Saigon reconnaît la Fédération"
 VIE_Malaysia.1.t.c: "Saigon reconnaît les fugitifs"
 VIE_Malaysia.1.d.a: "Les colonnes de Chin Peng tiennent Kuala Lumpur, les ministres de la Fédération sont sortis via Singapour et ce qui reste du gouvernement de Malaisie siège désormais à Kuching sous la tolérance britannique. Notre reconnaissance leur va.\n\nIl ne nous apporte pas grand-chose matériellement. Les exilés ne contrôlent aucun territoire, aucun revenu et aucune armée digne de ce nom, et notre note sera lue à Londres avec une certaine irritation, car elle nous engage dans une position que la Grande-Bretagne n'a pas encore prise. Le chef de l'État l'a signé malgré tout.\n\nLa raison s'inscrit le long de notre propre frontière nord. Un mouvement communiste a pris un pays dans cette région par la force des armes et a été autorisé à le conserver, et tous les arguments que nous faisons à Saigon au sujet de notre propre guerre repose sur le fait que cette issue n'est pas considérée comme réglée. Reconnaître un gouvernement qui a perdu, c'est ainsi qu'un gouvernement qui n'a pas encore perdu déclare ses intentions."
 VIE_Malaysia.1.d.b: "Une note est arrivée de Saigon. L'Etat du Vietnam reconnaît ce gouvernement comme le gouvernement légitime de la Malaisie et continuera de recevoir nos représentants comme tel.\n\nIl vaut exactement ce qu'il semble valoir. Le Vietnam ne peut pas nous livrer un fusil dont il n'a pas besoin, ni épargner un bataillon dans une guerre dans laquelle il perd du terrain. Ce qu'il peut faire, et ce qu'il a fait, c'est mettre sur papier que les hommes de Kuala Lumpur sont des occupants et non un État - et il l'a fait avant Londres.\n\nPour un conseil des ministres dans des bureaux empruntés à Kuching, ce n'est pas rien. Chaque ministère des Affaires étrangères qui suit Saigon rend notre retour plus difficile à contester, et tout autre ministère qui ne le fait pas rend cet exil un peu plus permanent."
 VIE_Malaysia.1.d.c: "Saigon a reconnu les fugitifs de Kuching comme le gouvernement de la Malaisie. Le télégramme est arrivé par la voie commerciale britannique, ce qui est révélateur : l'État du Vietnam a pris une position que Londres s'apprête encore à prendre, et l'a prise très tôt afin d'être vu en train de la prendre.\n\nL'administration de Saigon n'est pas en mesure de donner des leçons à qui que ce soit sur la légitimité. Il gouverne ce que le corps expéditionnaire lui réserve et pas un hameau de plus, et il a maintenant étendu sa reconnaissance à un cabinet dont les mandats ne dépassent pas la salle où il se réunit. La comparaison s'écrit d'elle-même, et nos émissions verront qu'elle s'entend de Penang à Cholon.\n\nLa note a quand même un but, et elle ne nous est pas adressée. Il s'adresse à Washington et aux ministères hésitants de la région et affirme que ce qui s'est passé en Malaisie doit être considéré comme réversible. Nous gouvernerons de manière à ce que la question ne reste pas ouverte."
 VIE_Malaysia.1.a: "Nous reconnaissons la Fédération, où qu'elle siège"
 VIE_Malaysia.1.b: "Quelqu'un, au moins, s'adresse encore à nous en tant que gouvernement"
 VIE_Malaysia.1.c: "Laissez-les poster leurs lettres à Kuching"

 # VIE & KOR
 VIE_KOR.1.t: "La guerre de Corée"
 VIE_KOR.1.d: "De l'autre côté de la mer, un autre État anticommuniste, la République de Corée, est impliqué dans une guerre pour sa survie contre la menace rouge expansionniste du Nord, et nous devons aider nos autres luttes anticommunistes. Cela dit, envoyer de l'aide au Sud pourrait affaiblir nos forces intérieures en cas d'invasion du Sud par le Nord."
 VIE_KOR.1.a: "Préparez nos forces à un combat prolongé avec les communistes et informez le Sud que nous aiderons."
 VIE_KOR.1.b: "Nous ne pouvons épargner aucune troupe, mais certains équipements pourraient aider le Sud."
 VIE_KOR.1.c: "Nous ne pouvons rien épargner, nous devons préparer notre guerre."

 VIE_KOR.2.t: "La menace au nord du Vietnam"
 VIE_KOR.2.d: "Avec la menace persistante de la Corée du Nord, nous devons être prudents avant d'autoriser davantage de nations communistes en Asie, car cela pourrait très facilement conduire à notre chute. C'est pourquoi nous proposerons formellement de mener une invasion du Nord-Vietnam dirigée par les forces coréennes. Le Sud soutiendrait probablement cette proposition et enverrait ses forces, et une victoire au Nord-Vietnam empêcherait la montée du communisme dans la région SEA.\n\nL'invasion entraînerait le déploiement formel des forces de défense coréennes, ainsi que l'implication de l'armée de l'air pour fournir des bombardements, et des ouvertures diplomatiques envers Washington et Taipei pour garantir leur soutien au cas où d'autres puissances décideraient de s'impliquer, mais le risque d'une intervention est faible, et l'administration et l'armée soutiennent cet effort."
 VIE_KOR.2.a: "Je parlerai moi-même au chef de l'État et l'informerai de notre offre."

 VIE_KOR.3.t: "[KOR.GetLeader] Propose une invasion conjointe du Nord-Vietnam"
 VIE_KOR.3.d: "Séoul nous a fait une offre, et elle est bien plus concrète que tout ce que nous avons jusqu'à présent reçu de Washington.\n\nLe président [KOR.GetLeader] propose d'entrer à nos côtés dans la guerre contre le Nord. Pas de conseillers, pas de matériel : trois divisions expéditionnaires coréennes engagées sur le théâtre, des opérations terrestres à travers la frontière menées conjointement et l'armée de l'air coréenne en soutien. Le travail du personnel a clairement été effectué avant que l'approche ne soit prise.\n\nIls ont combattu cet ennemi et l'ont tenu, ce qu'aucun autre gouvernement en Asie ne peut faire valoir. Par contre, une armée coréenne combattant des Vietnamiens sur le sol vietnamien est une photographie que Hanoï utilisera pendant les vingt prochaines années, et la frontière de Séoul n'est pas une question réglée. L'état-major devrait prendre connaissance des plans avant que quiconque ne réponde au télégramme."
 VIE_KOR.3.a: "Une perspective intrigante. Convoquez l'état-major et préparez des plans."
 VIE_KOR.3.b: "Nous n'avons pas besoin de l'aide coréenne, ils devraient d'abord se tourner vers leurs frontières."

 VIE_KOR.4.t: "[VIE.GetLeader] Accepte"
 VIE_KOR.4.d: "Malgré les risques associés à une invasion préventive du Nord-Vietnam, le chef de l'État vietnamien a accepté notre plan et a mobilisé son armée jusqu'à la frontière. Ici, le temps joue contre nous, et les préparatifs pertinents sont déjà terminés, sur la parole de notre président, nous partons en guerre pour aider nos frères asiatiques contre les Rouges."
 VIE_KOR.4.a: "Excellent, pour la République de Corée, nous combattons la menace rouge, la guerre !"

 VIE_KOR.5.t: "[VIE.GetLeader] Refuse respectueusement"
 VIE_KOR.5.d: "De manière plutôt fâcheuse, le Sud-Vietnam a décliné l'offre d'emblée, affirmant qu'une guerre précoce avec le Nord serait bien trop risquée, surtout avec la possibilité d'une intervention d'autres nations comme la Chine communiste et l'Union soviétique. Pour l'instant, ils semblent réorienter leur politique vers les Américains, mais ils poursuivent dans tous les cas leurs préparatifs de guerre."
 VIE_KOR.5.a: "S'ils prétendent ne pas avoir besoin de notre aide, qu'il en soit ainsi."

 # VIE & JAP
 VIE_JAP.1.t: "Bao-Dai nous demande de rompre les liens avec Cuong-De"
 VIE_JAP.1.d: "Nous avons reçu des nouvelles du gouvernement vietnamien dénonçant notre intention d'accueillir le prince Cuong-De au Japon. Puisque le prince Cuong-De est un ami du Japon et a l'intention de libérer le Vietnam du colonialisme français, il serait préférable pour nous d'ignorer toute demande de tentative de le renvoyer au Vietnam."
 VIE_JAP.1.a: "Nous ne livrerons pas un citoyen japonais."
 VIE_JAP.1.b: "Faisons ce qu'il y a de mieux et ignorons cette lettre."

 VIE_JAP.2.t: "Le Japon refuse d'expulser Cuong-De"
 VIE_JAP.2.d: "Le gouvernement japonais a fermement refusé la demande vietnamienne d'expulser le prince Cuong-De. Dans leur réponse, les Japonais ont souligné que Cuong-De est un ami du Japon et qu'ils ne l'abandonneront pas, quelles que soient les pressions des autres gouvernements.\n\nCe refus a été déçu au Vietnam, où le gouvernement espérait que le Japon coopérerait pour éliminer cette menace potentielle à la stabilité. Toutefois, la position japonaise est claire et inébranlable.\n\nLa relation entre le Vietnam et le Japon reste fonctionnelle, mais cet épisode a mis en lumière les limites de l'influence diplomatique lorsque des principes fondamentaux sont en jeu. La décision du Japon de soutenir Cuong-De démontre son engagement envers ses amis, même si cela crée des complications diplomatiques."
 VIE_JAP.2.a: "Nous devons respecter leur décision."

 VIE_JAP.3.t: "Le Japon ignore nos appels"
 VIE_JAP.3.d: "Le gouvernement japonais a choisi d'ignorer les appels répétés du Vietnam concernant le prince Cuong-De. Malgré de multiples communications diplomatiques, Tokyo n'a pas fourni de réponse substantielle, laissant ainsi la question sans solution.\n\nCe silence est frustrant pour le gouvernement vietnamien, qui espérait une résolution claire de la situation. L'absence de réponse suggère que le Japon n'est pas disposé ou incapable de répondre aux préoccupations du Vietnam pour le moment.\n\nLes relations diplomatiques se poursuivent, mais cet épisode a créé quelques tensions. Le Vietnam doit décider comment procéder face à l'absence de réponse du Japon, en équilibrant la nécessité de résoudre la question de Cuong-De avec le désir de maintenir de bonnes relations avec un partenaire régional important."
 VIE_JAP.3.a: "Nous continuerons à défendre notre cause."

 VIE_JAP.4.t: "Cuong-De nous plaide pour une aide économique"
 VIE_JAP.4.d: "Le prince Cuong-De nous a proposé de rétablir son statut de dirigeant légitime du Vietnam au moyen d'aides économiques. Nous pourrions volontiers accepter notre ancien allié et lui envoyer l'aide dont il a besoin en échange de son retour au Vietnam, ou nous pourrions refuser car nous nous retrouverions dans de nouveaux problèmes contre la France et l'Amérique."
 VIE_JAP.4.a: "Nous offrirons volontiers de l'aide à Cuong-De."
 VIE_JAP.4.b: "Ne nous impliquons pas là-dedans."

 VIE_JAP.5.t: "Le Japon accepte d'envoyer une aide économique"
 VIE_JAP.5.d: "Le gouvernement japonais a accepté de fournir une aide économique au prince Cuong-De, soutenant ainsi ses efforts pour restaurer sa position au Vietnam. Cette assistance comprend un soutien financier, des opportunités commerciales et potentiellement d'autres formes de coopération économique.\n\nLa décision du Japon de soutenir Cuong-De représente une évolution significative dans le paysage politique régional. Cela démontre la volonté du Japon de soutenir un leadership alternatif au Vietnam et suggère un changement potentiel dans son approche de politique étrangère.\n\nCette aide aidera Cuong-De à construire son mouvement et potentiellement à défier le gouvernement vietnamien actuel. Les implications de ce soutien sont considérables et pourraient remodeler la dynamique politique en Asie du Sud-Est.\n\nPour le Vietnam, cela représente à la fois une opportunité et un défi. Le soutien japonais à Cuong-De pourrait ouvrir de nouvelles possibilités, mais il crée également des complications dans les relations entre les deux pays."
 VIE_JAP.5.a: "Ce soutien pourrait tout changer."

 VIE_JAP.6.t: "Le Japon refuse d'envoyer une aide économique"
 VIE_JAP.6.d: "Malgré les supplications du prince Cuong-De, le gouvernement japonais a décidé de ne pas fournir d'aide économique pour soutenir sa cause. Même si le Japon entretient des relations amicales avec Cuong-De, il n'est pas disposé à engager des ressources dans ce qu'il considère comme une entreprise risquée et incertaine.\n\nCe refus est un revers pour Cuong-De, qui espérait que le soutien japonais l'aiderait à retrouver de l'influence au Vietnam. Sans ce soutien économique, ses options sont plus limitées et il devra trouver d'autres sources de soutien s'il souhaite poursuivre ses objectifs.\n\nPour le gouvernement vietnamien actuel, cette décision est quelque peu rassurante, car elle signifie une force extérieure de moins pour soutenir ses rivaux potentiels. Cependant, la situation reste complexe et l'avenir encore incertain."
 VIE_JAP.6.a: "Nous devons trouver une autre voie à suivre."

 # VIE & PQC
 VIE_PQC.1.t: "[VIE.GetLeader] Exige notre sortie !"
 VIE_PQC.1.d: "Une déclaration officielle est arrivée du Vietnam et son ton est agressif. Ils ont exigé que nous cédions immédiatement le territoire contesté de Phu-Quoc et de ses îles environnantes à leur administration, affirmant qu'il est vital pour l'effort de guerre et qu'il est reconnu par l'Occident comme « la possession légitime des Vietnamiens ». Les généraux veulent savoir quelle sera notre réponse."
 VIE_PQC.1.a: "Il n'y a rien à faire, préparez le matériel et informez la République de notre retour."
 VIE_PQC.1.b: "Ils veulent l'île ? Ils peuvent venir le chercher. Mobilisons nos forces."

 VIE_PQC.2.t: "Saigon nous passe par-dessus la tête à Phu-Quoc"
 VIE_PQC.2.d: "La garnison de Phu-Quoc signale qu'un officier vietnamien a débarqué sous un drapeau de trêve et leur a remis un ultimatum par écrit. Ils doivent évacuer l'île et la remettre à l'administration de l'Etat du Vietnam. Aucune note n'a été remise à notre ministère des Affaires étrangères, aucune démarche n'a été effectuée par l'intermédiaire des Français et nous l'avons appris de nos propres soldats bloqués.\n\nCes hommes sont ce qui reste des formations qui ont traversé la frontière plutôt que de se rendre. Nous n'avons pas pu les faire sortir de cette île et nous n'avons pas voulu les renier, et Saigon a maintenant fait de notre indécision une vertu en négociant avec la garnison comme si elle était une partie souveraine avec laquelle il fallait traiter directement.\n\nUne protestation sera déposée. On y répondra poliment et cela ne changera rien. Ce que nous coûte cette affaire est lisible pour chaque communauté chinoise, de Cholon à Singapour : un gouvernement qui ne peut pas abriter ses propres soldats bloqués est un gouvernement dont la protection peut être ignorée en toute sécurité."
 VIE_PQC.2.a: "Ils traitent avec nos hommes et non avec nous."

 VIE_PQC.3.t: "Phu-Dai accepte !"
 VIE_PQC.3.d: "Heureusement, il semble que la raison et la logique aient persévéré. Nous avons reçu une réponse de Phu-Quoc indiquant qu'ils céderaient l'île à notre gouvernement presque immédiatement. Nos bureaucrates arriveront bientôt pour mettre en place le gouvernement civil et nous nous préparons à construire un grand complexe pénitentiaire pour les soldats capturés de la NVA."
 VIE_PQC.3.a: "Heureux de voir qu'on peut les raisonner."

 VIE_PQC.4.t: "Phu-Dai décline !"
 VIE_PQC.4.d: "Malheureusement, les forces de Phu-Quoc n'ont pas voulu entendre raison et ont rejeté nos demandes de retrait d'une île qui nous appartient ! La seule option est militaire. Une petite armée expéditionnaire a été préparée et attend le feu vert pour lancer l'invasion."
 VIE_PQC.4.a: "Si la diplomatie échoue, l'armée peut alors faire le travail."

 # The Brevert Lines
 Brevert_Lines.1.t: "Le Vietnam nous demande d'accepter les lignes Brevert"
 Brevert_Lines.1.d: "Une communication est arrivée de Saigon du président du Vietnam, nous demandant d'envisager de participer à un sommet pour finaliser notre différend frontalier en cours sur les limites maritimes. Il s'agit de l'île de Phu-Quoc, qui abrite une petite force d'exil du KMT et qui est par ailleurs assez petite, mais sa position est d'une importance vitale, et l'abandon de nos revendications pourrait ébranler la perception du public à l'égard de notre gouvernement.\n\nAlternativement, abandonner leurs revendications sur une île en grande partie petite et inutile qu'ils administrent déjà contribuerait grandement à réduire les tensions et pourrait ouvrir la voie à une coopération future avec le Sud-Vietnam."
 Brevert_Lines.1.a: "Nous y assisterons, notre revendication peut être abandonnée au nom de bonnes relations."
 Brevert_Lines.1.b: "Tactique dilatoire, cette île est stratégiquement importante, et nous n'abandonnerons pas nos revendications."

 Brevert_Lines.2.t: "Le Cambodge accepte"
 Brevert_Lines.2.d: "Une belle réussite ! Suite à leur participation au sommet, le Cambodge a accepté d'abandonner ses revendications sur les îles de Phu-Quoc et Tho-Chu et a complètement retiré toutes ses réserves diplomatiques quant au maintien de notre administration, cela nous a également permis de finaliser nos autres désaccords frontaliers avec eux et de voir une paix durable entre nos deux pays."
 Brevert_Lines.2.a: "La diplomatie l'emporte une fois de plus."

 Brevert_Lines.3.t: "Le Cambodge décline"
 Brevert_Lines.3.d: "Phnom Penh est au point mort, comme Phnom Penh stagne toujours, et a maintenant carrément refusé la conférence. Le motif avancé est que cela « a directement violé leur souveraineté et leurs terres ancestrales sacrées ».\n\nNous administrons le territoire. Nous le contrôlons. Nous le contrôlions bien avant l'existence de ce gouvernement khmer, et rien de tout cela n'a jamais obligé qui que ce soit en politique internationale à être raisonnable à ce sujet.\n\nLa difficulté est que les lignes Brevert s'installent plus que Phu-Quoc ; le même instrument fixe toute notre frontière occidentale, et une ligne incertaine y est une invitation permanente. Des plans sont prêts à déplacer des forces vers la frontière une fois la rébellion maîtrisée - non pas pour prendre quoi que ce soit, mais pour faire réfléchir les Khmers à deux fois avant de prendre notre patience pour de la faiblesse."
 Brevert_Lines.3.a: "Il est clair qu'ils ne sont pas disposés à accepter la diplomatie."

 Brevert_Lines.4.t: "Victoire dans la guerre frontalière"
 Brevert_Lines.4.d: "Nos forces ont repoussé les unités khmères de l'autre côté de la frontière, et Phnom Penh a discrètement laissé tomber ses réserves sur Phu Quoc plutôt que de prolonger un combat qu'elle ne peut pas gagner. L'île est désormais sous administration vietnamienne, même si la population locale nous reste hostile. Nous devons travailler à pacifier la région et à l'intégrer correctement au Vietnam."
 Brevert_Lines.4.a: "L'île est à nous, mais les gens résistent."

 Brevert_Lines.5.t: "Défaite dans la guerre frontalière"
 Brevert_Lines.5.d: "L'affrontement à la frontière khmère s'est soldé par un désastre. Nos compagnies ont été chassées du terrain qu'elles étaient venues conquérir, et Phnom Penh conserve ses droits sur Phu-Quoc avec beaucoup plus de prestige qu'il y a une semaine.\n\nLes dégâts à l'étranger sont pires que ceux à la frontière. Nos voisins ont vu une armée vietnamienne échouer face à une armée khmère ; les Français ont assisté à la même chose et demandent par écrit quel était exactement le but de l'opération ; et notre position dans la lutte en Indochine a reculé bien plus que cette frontière ne valait jamais.\n\nChez nous, les critiques sont sévères et ne se limitent pas à l'opposition. Les hommes qui ont le plus longtemps lutté pour l'indépendance sont les hommes les plus touchés par cette situation, car les arguments en faveur de cette indépendance ont toujours reposé sur l'affirmation selon laquelle nous pouvions gérer nos propres affaires et nos propres soldats. Nous venons de démontrer le contraire devant tout le monde."
 Brevert_Lines.5.a: "C'est un grave revers."

 Brevert_Lines.6.t.a: "Le choc des frontières s'interrompt"
 Brevert_Lines.6.t.b: "La rupture vietnamienne"
 Brevert_Lines.6.d.a: "Les combats à la frontière khmère ont cessé sans que nous prenions du terrain et sans que Phnom Penh ne demande des conditions. Les entreprises qui ont passé une semaine à se bousculer à travers les rizières se sont repliées sur leurs positions de départ, et le communiqué du personnel qualifie le résultat de rétablissement du statu quo car aucune autre expression n'est disponible.\n\nRien n'est réglé. Les lignes Brevert, tracées par une administration indochinoise en 1939, fonctionnent là où elles se trouvaient, ne satisfont personne et restent le seul document qu'aucun gouvernement puisse produire. Phu-Quoc se trouve là où il a toujours été, revendiqué à deux reprises, administré par nous et ne nous a été concédé par personne.\n\nLes unités seront déplacées et les postes frontières renforcés, ce qui fait suite à une querelle qui n'est pas terminée. Celui qui rouvrira ce fichier le rouvrira exactement à partir de cette ligne."
 Brevert_Lines.6.d.b: "Les Vietnamiens se sont retirés de nos postes frontières sans forcer de décision. Nos soldats ont tenu le terrain qui leur était confié ; Saigon a refusé de dépenser ce qu'aurait coûté cette prise, et les tirs ont tout simplement cessé.\n\nLe palais présentera cela comme un succès khmer, et dans des limites qui sont justes : le royaume était pressé et n'a pas cédé. Il faut dire clairement dans la salle du conseil que nous ne sommes pas plus près de Phu-Quoc que nous ne l'étions et que nos revendications reposent toujours sur les lignes Brevert de 1939 et sur la patience de nos voisins.\n\nLes postes frontières seront reconstruits et les garnisons renforcées. Saigon a appris ce que coûte le terrain et pourrait décider que cela vaut la peine de payer."
 Brevert_Lines.6.a: "Rien de gagné, rien de concédé."
 Brevert_Lines.6.b: "Le royaume est là où il était."

 Brevert_Lines.7.t: "La frontière tient"
 Brevert_Lines.7.d: "Saigon a parié qu'une démonstration de force le long de la frontière briserait notre détermination concernant Phu Quoc. Ce n'est pas le cas. Nos soldats ont tenu bon et ont renvoyé les Vietnamiens par où ils étaient venus, et les prétentions du royaume sur l'île restent intactes. Le palais a veillé à ce que tous les journaux de Phnom Penh publient l'histoire."
 Brevert_Lines.7.a: "Le Cambodge ne plie pas."

 Brevert_Lines.8.t: "Chassé de la frontière"
 Brevert_Lines.8.d: "Les Vietnamiens ont frappé nos postes frontières et nos soldats n'ont pas pu les retenir. Nos forces se sont retirées du terrain contesté, et avec elles disparaît tout espoir pratique de faire valoir nos revendications sur Phu Quoc. Le gouvernement doit expliquer comment un différend concernant une île lointaine est devenu une humiliation sur notre propre sol."
 Brevert_Lines.8.a: "Une leçon coûteuse."

 Brevert_Lines_no_clash_tt: "§RAucun affrontement frontalier ne peut être combattu§! - Le Cambodge et le Vietnam doivent partager une frontière terrestre, et nous devons avoir au moins une division stationnée dans un État adjacent"

 # The French-Drawn Borders
 French_Drawn_Borders.1.t: "Les enjeux de la frontière française"
 French_Drawn_Borders.1.d: "Leur influence en Indochine s'effaçant, les Français ont entrepris de tracer les lignes qui sépareront le Vietnam, le Laos et le Cambodge lors de leur départ. Les lignes sont tracées à Paris, par des hommes qui n'ont pas vu le terrain, et une fois tracées, elles seront très difficiles à déplacer.\n\nL'un d'eux traverse Xiangkhouang. Cette province fut longtemps vietnamienne et fut gouvernée sous le nom de Tran-Ninh ; il est passé sous juridiction laotienne pendant la période coloniale, dans le cadre du Protectorat du Laos, par une commodité administrative dont personne ne nous a consultés.\n\nNous pouvons déposer la revendication maintenant, sur le terrain historique, alors que les frontières sont encore en train d'être réglées et qu'une revendication peut encore être déposée. Ou nous pouvons accepter la ligne telle qu'elle est tracée et maintenir nos relations avec Vientiane à l'amiable, ce qui importera beaucoup dans les années où aucun de nous n'aura de garnison française derrière laquelle se cacher."
 French_Drawn_Borders.1.a: "Tran-Ninh est à nous pour toujours !"
 French_Drawn_Borders.1.b: "Oublions ces affirmations, nous avons déjà suffisamment de problèmes tels quels."

 # The Crown Domains
 Crown_Domains.1.t: "[GetVIEChiefOfState] Demande un règlement du domaine de la Couronne du Sud"
 Crown_Domains.1.d: "[GetVIEChiefOfState]le gouvernement de Saigon a demandé à la France de reconnaître l'autorité de Saigon sur le domaine de la couronne des Hauts Plateaux du Centre et sur les territoires autonomes restants du sud. Cette demande est présentée comme une consolidation nécessaire du commandement sud contre le Viet Minh.\n\nLes territoires du Nord sont une autre affaire. Les conseils de Tai, Nung, Muong et Tho gardent le terrain d'opération du CEFEO et doivent continuer à répondre au corps expéditionnaire tant que dure la guerre du Nord. Nous pouvons reconnaître les revendications méridionales de Saigon sans transférer ces commandements."
 Crown_Domains.1.a: "Reconnaissez la colonie du sud."
 Crown_Domains.1.b: "Nous ne voulons pas trop responsabiliser [GetVIEChiefOfState]."

 Crown_Domains.2.t: "Les Français acceptent"
 Crown_Domains.2.d: "La France a reconnu notre droit à coloniser les territoires autonomes du sud. Les Hauts Plateaux du Centre et la Cochinchine peuvent désormais être gérés par le processus politique propre à Saigon. Le CEFEO conserve les domaines de la couronne nord pendant toute la durée de sa campagne."
 Crown_Domains.2.a: "Le commandement sud se renforce."

 Crown_Domains.3.t: "Les Français refusent"
 Crown_Domains.3.d: "La France a refusé de reconnaître l'autorité de Saigon sur les territoires autonomes du sud. Le CEFEO détient toujours le commandement du nord, mais Paris ne concédera même pas le règlement séparé du sud. Ce refus approfondira tous les différends existants au sein du camp anti-Viet Minh."
 Crown_Domains.3.a: "A quoi pensent-ils ?"

 Crown_Domains.4.t: "[GetVIEChiefOfState] Demande l'annexion du domaine des hauts plateaux du centre"
 Crown_Domains.4.d: "[GetVIEChiefOfState] ne demande plus seulement une autorité administrative sur le domaine des Central Highlands. Saigon veut maintenant que le territoire autonome soit complètement dissous, que ses chefs soient rendus responsables devant le gouvernement vietnamien et que les garanties que la France a données aux Montagnards prennent fin.\n\nCette demande concerne le commandement sud. Il ne transfère pas les territoires du nord de Tai, Nung, Muong ou Tho du CEFEO. L'accorder mettrait néanmoins fin à une grande entreprise française et les Montagnards ne seront pas consultés."
 Crown_Domains.4.a: "Il est temps que le Sud-Vietnam soit unifié."
 Crown_Domains.4.b: "Il ne faut pas être téméraire, il va falloir y réfléchir."

 Crown_Domains.5.t: "Les Français acceptent"
 Crown_Domains.5.d: "La France a accepté la dissolution du domaine de la couronne des Hauts Plateaux du Centre. Son territoire entrera sous administration vietnamienne ordinaire ; les domaines de la couronne nord demeurent une responsabilité distincte du CEFEO."
 Crown_Domains.5.a: "Une évolution phénoménale !"

 Crown_Domains.6.t: "Les Français refusent"
 Crown_Domains.6.d: "La France a refusé de dissoudre le domaine de la couronne des Hauts Plateaux du Centre. Le commandement sud reste divisé et ce refus ne change rien à la garde séparée des territoires du nord par le CEFEO."
 Crown_Domains.6.a: "Serons-nous un jour capables de véritablement unir le Vietnam ?"

 # Military

 # Sect Militias
 VIE_Sect_Militias.1.t: "Ami ou ennemi ?"
 VIE_Sect_Militias.1.d: "Cher Chau,\n\nJ'ai été envoyé dans la région de Nam-Phan, à Ben-Tre pour protéger notre pays dans le cadre des ordres du Haut Commissariat de l'ANV. La plupart du temps, rien ne se passe, mais la peur demeure ; Je me réveille et je veux juste être à la maison. J'ai vu la nouvelle selon laquelle nous avons de nouveaux alliés « intégrés » dans l'armée. Ce ne sont pas mes alliés ; J'ai vu l'une des « milices catholiques de l'UMDC » de Leroy couper et hacher des personnes au hasard que nous savions innocentes ; ce n'est pas la cause pour laquelle je pensais que nous nous battions. Sans compter qu'avec certaines de ces nouvelles unités françaises, si vous tournez le dos trop longtemps, ils vous tireront dessus. Nous combattons du mieux que nous pouvons, mais ce n'est pas la même chose que de combattre les Japonais. Nos conseillers français et nos officiers vétérans des guerres mondiales passées n'ont aucune expérience dans ce genre de combat. On peut traverser un village dix fois sans rien voir d'anormal, et la fois d'après, on se retrouve pris dans une embuscade. Je commence à penser que certaines de nos unités transmettent des informations. Les unités Khinh-Quan sont amies du beau temps, et je ne serais pas surpris si elles changeaient de camp un jour maintenant."
 VIE_Sect_Militias.1.a: "Le prix que nous payons pour débarrasser notre pays du communisme est trop élevé."

 VIE_Sect_Militias.2.t: "Des décisions difficiles"
 VIE_Sect_Militias.2.d: "Dans une salle de réunion faiblement éclairée, officiers coloniaux français et personnels vietnamiens se rassemblent autour d'une table en bois recouverte de cartes et de photographies. L'atmosphère est tendue alors qu'ils discutent de la menace urgente posée par la milice Bao-Dai - un groupe paramilitaire nationaliste bien armé qui a lutté à la fois contre l'occupation japonaise et la domination coloniale française.\n\n\"Nous ne pouvons pas ignorer cette menace\", déclare un officier français, sa voix traversant le silence pesant. \"Ils sont bien entraînés et leur retour est alarmant.\" Un autre officier ajoute : « Leur histoire de lutte contre nous rend l'intégration une question délicate ».\n\nUn commandant vietnamien répond prudemment : « Si nous ne les intégrons pas, ils pourraient devenir une force déstabilisatrice. Mais les arrêter pourrait encore aggraver la situation. » Se penchant plus près du chef d'état-major vietnamien silencieux, il murmure : \"N'oubliez pas qu'ils sont notre peuple. Ils se sont battus pour notre indépendance. Il pourrait y avoir un terrain d'entente pour la réconciliation.\"\n\nTous les regards se tournent vers le chef d'état-major, resté silencieux tout au long de la discussion. La tension dans la salle atteint un point de rupture alors que chacun attend sa décision. Enfin, il parle :"
 VIE_Sect_Militias.2.a: "Rassemblez-les, ils ne sont qu'une autre menace à combattre."
 VIE_Sect_Militias.2.b: "Convoquons leurs dirigeants pour une réunion, nous discuterons des modalités de leur intégration."

 # Leroy
 VIE_Leroy.1.t: "Que faire avec Leroy"
 VIE_Leroy.1.d: "Jean Leroy commande l'UMDC, la milice catholique du delta, et il a gardé les villages chrétiens de Ben-Tré hors des mains du Viet Minh alors que personne d'autre ne le pouvait. Personne ne le conteste, y compris le Viet Minh.\n\nLa manière dont il l'a fait est très controversée. Les méthodes signalées dans ses districts sont celles d'un homme qui entend se faire craindre, et elles ont été signalées à plus d'une ambassade. Un gouvernement qui le prend à son service emporte avec lui son bilan.\n\nIl y a donc deux cours. Nous le recrutons et mettons son expérience de la contre-insurrection là où elle est le plus nécessaire, et acceptons ce qui sera dit de nous à l'étranger. Ou nous le laissons à Ben-Tré avec sa milice et sa province et aucune place dans la structure nationale - ce qui nous garde les mains propres et laisse un homme armé suivi en dehors du gouvernement, exactement là où il se trouvait."
 VIE_Leroy.1.a: "Un peu d'aide ne fera pas de mal."
 VIE_Leroy.1.b: "Il est trop brutal, le recruter ne fera que nous faire du mal."

 # VIE & PQC - Military
 VIE_PQC_Mil.1.t: "Le Vietnam demande à intégrer l'armée de Phu-Dai"
 VIE_PQC_Mil.1.d: "À la suite de notre défaite lors de la guerre civile et de notre relocalisation ultérieure, quoique temporaire, vers la base d'opérations de Taiwan, nos forces ont été stratégiquement positionnées dans divers endroits clés. Ces déploiements ont été effectués en prévision d'un éventuel retour dans notre pays. Parmi eux, un contingent notable, près de 33 000 soldats sous le commandement du général Huang Chieh, s'est interné sur l'île sud-vietnamienne de Phu Quoc. Outre ces forces, nos troupes ont également maintenu une présence en Birmanie.\n\nDepuis leur déploiement, ces troupes sont restées en grande partie stationnées à Phu Quoc mais ont depuis prévu de rentrer chez elles. Le conflit en cours au Vietnam présente des risques considérables pour le retour de ces forces, car tout mouvement nécessiterait de naviguer dans des eaux contrôlées par la NVA et la RPC ou d'emprunter une route alternative difficile. Dans ces circonstances difficiles, le gouvernement sud-vietnamien a présenté une proposition intéressante. Ils recherchent l'engagement de notre armée dans leur conflit contre les marxistes du Nord. Engager nos forces de cette manière pourrait avoir un impact significatif sur l'avancée du communisme, une perspective qui fait actuellement l'objet d'intenses délibérations. On s'attend également à ce qu'une telle démarche reçoive probablement le soutien de la partie américaine.\n\nLe général Huang Chieh, qui opère de manière semi-autonome, n'a pas encore été informé de cette proposition. Nous nous trouvons à la croisée des chemins avec le pouvoir de faire avancer cette idée ou de la rejeter avant qu'elle n'atteigne le général. La décision présente deux options distinctes :"
 VIE_PQC_Mil.1.a: "Hiérarchiser nos besoins stratégiques et refuser la proposition. Informez le président que nous ne pouvons pas épargner ces troupes à ce stade."
 VIE_PQC_Mil.1.b: "Cela devrait être laissé au Général lui-même, nous ne pouvons pas commenter, mais nous ne serions pas opposés à la proposition."

 VIE_PQC_Mil.2.t: "[CHI.GetName] Refuse notre offre"
 VIE_PQC_Mil.2.d: "[CHI.GetNameDef] a refusé. La proposition d'intégrer la garnison de Phu-Quoc dans nos forces a été rejetée, et rejetée en quelques jours, ce qui nous indique qu'elle n'a jamais été sérieusement envisagée.\n\nLa raison invoquée est une nécessité stratégique. Ces formations sont nécessaires à des opérations qui leur sont propres, nous dit-on, et ne peuvent pas être confiées à un commandement étranger - une position qui aurait bien plus de poids si quelqu'un pouvait nommer les opérations, ou expliquer ce qu'une garnison bloquée sur une île y contribue actuellement.\n\nNous sommes restés là où nous avons commencé, et il nous manque les hommes sur lesquels nous comptions. Il faudra trouver du renfort ailleurs, et il ne reste plus beaucoup d'endroits où chercher."
 VIE_PQC_Mil.2.a: "Des lâches sans âme, qui ne se soucient que d'eux-mêmes !"

 VIE_PQC_Mil.3.t: "Une offre de [VIE.GetName]"
 VIE_PQC_Mil.3.d: "Nous avons récemment reçu d'importantes communications provenant de deux sources ; notre gouvernement à Taiwan et le bureau du président du Vietnam à Saigon. Les deux messages font référence à une proposition significative du chef de l'État [GetVIEChiefOfState] du Sud-Vietnam. Cette proposition implique l'intégration de nos forces dans l'armée sud-vietnamienne en tant qu'unité semi-autonome. Notre rôle principal serait de les aider dans leur campagne en cours contre les forces communistes dans le Nord. Cette opportunité, bien que non dénuée de risques, présente une opportunité impérieuse d'arrêter l'avancée des communistes dans la péninsule indochinoise.\n\nEn réponse à cette proposition, une réunion de notre corps d'officiers a été convoquée pour délibérer sur la voie à suivre. La décision à prendre est cruciale."
 VIE_PQC_Mil.3.a: "Mobilisez les soldats et préparez le départ, contactez le Président et dites-lui que nous allons vous aider."
 VIE_PQC_Mil.3.b: "Nous ne pouvons pas nous risquer dans un conflit tant que la menace rouge plane sur Pékin, déclinons cette demande."

 VIE_PQC_Mil.4.t: "L'armée de Phu-Dai accepte l'intégration"
 VIE_PQC_Mil.4.d: "Nous avions des doutes et ils étaient déplacés. La République de Chine et la garnison de Phu-Quoc ont accepté l'intégration, et les hommes sont actuellement en train d'être déplacés hors de l'île.\n\nLeur base d'opérations est transférée à Saigon et ils espèrent être disponibles pour les opérations presque immédiatement. Il n'y a pas de longue période de réorganisation à subir, car ce ne sont pas des recrues : chacun d'entre eux a combattu une armée communiste sur le terrain et la plupart d'entre eux l'ont fait pendant près d'une décennie.\n\nC'est la valeur de l'affaire et elle est considérable. Cela amène également dans notre ordre de bataille plusieurs milliers d'hommes qui ont perdu leur propre pays face à cet ennemi et qui ont passé des années sur une île à y réfléchir. Ils se battront. Ce qu'ils seront capables de commander est quelque chose que notre personnel découvrira."
 VIE_PQC_Mil.4.a: "Préparez une réunion d'état-major et informez nos alliés."

 VIE_PQC_Mil.5.t: "L'armée Phu-Dai refuse de s'intégrer !"
 VIE_PQC_Mil.5.d: "Malgré notre demande claire et la menace constante de l'Armée du Nord, le général Huang a rejeté notre demande d'intégration. Ils semblent vouloir rester à l'écart et regarder l'histoire passer à côté d'eux. Les rapports des Français ont également indiqué d'importants renforcements et expansions militaires de l'armée de Phu-Dai sur l'île que nous devrions surveiller..."
 VIE_PQC_Mil.5.a: "C'est la guerre..."
 VIE_PQC_Mil.5.b: "Qu'il en soit ainsi, nous laisserons tranquilles les lâches."

 # PQC Annexes South Vietnam
 PQC_Annexed_South_Vietnam.1.t: "Le Sud est à nous - Maintenant, place au Nord !"
 PQC_Annexed_South_Vietnam.1.d: "Avec la chute de Saigon et l'annexion complète du Sud-Vietnam, nos forces ont remporté une victoire éclatante. Le Parti Viet Quoc et l'Armée Phu Dai ont prouvé que nous sommes les véritables défenseurs de l'indépendance vietnamienne, rejetant à la fois le colonialisme français et la tyrannie communiste.\n\nCependant, notre travail n'est pas encore terminé. Le régime communiste du Nord contrôle toujours la moitié de notre pays. Pour véritablement unifier le Vietnam sous notre bannière de gouvernance nationaliste et anticommuniste, nous devons maintenant tourner notre attention vers le nord. Le moment est venu de déclarer notre intention de libérer tout le Vietnam de la menace rouge.\n\nCe sera une campagne difficile : les forces nord-vietnamiennes sont bien implantées et ont reçu le soutien des puissances communistes. Mais avec les ressources du Sud désormais à notre disposition et la juste cause de l'unification nationale qui fait avancer nos soldats, nous sommes convaincus que l'Étoile Blanche survolera tout le Vietnam."
 PQC_Annexed_South_Vietnam.1.a: "Pour un Vietnam unifié sous l'Étoile Blanche !"

 # Northern Question
 VIE_Northern_Question.1.t: "La question du Nord"
 VIE_Northern_Question.1.d: "Alors que nous avons réussi à nettoyer notre Viet-Minh au sud, les Français et leurs alliés luttent toujours contre la branche nord du Viet-Minh. Nous pourrions laisser les Français gérer ce problème pendant que nous récupérons ou nous pourrions donner un coup de main aux Français et vaincre le Viet-Minh une fois pour toutes."
 VIE_Northern_Question.1.a: "Sommes-nous fous ? Laissons les Français s'en occuper."
 VIE_Northern_Question.1.b: "Une opportunité se présente. Nous reprendrons notre pays aux communistes !"

 # Chinese Civil War
 VIE_China_Civil_War.1.t: "[VIE.GetLeader] Demande notre aide pour leur guerre anticommuniste"
 VIE_China_Civil_War.1.d: "Le gouvernement vietnamien a envoyé une demande officielle d'assistance dans sa lutte actuelle contre le communisme. La demande met l'accent sur la cause anticommuniste commune et sur l'importance de soutenir les nations soeurs dans la lutte contre l'expansion marxiste.\n\nLe Vietnam est confronté à une menace importante de la part du Nord communiste et estime que le soutien international est crucial pour sa survie. Ils demandent du matériel militaire, une aide économique et un soutien diplomatique pour les aider à résister à l'avancée communiste.\n\nCette demande intervient à un moment où la lutte mondiale contre le communisme s'intensifie et où de nombreux pays sont contraints de choisir leur camp. Soutenir le Vietnam signifierait engager des ressources sur un autre front de la guerre froide, mais cela pourrait également contribuer à empêcher la propagation du communisme en Asie du Sud-Est.\n\nLa décision n'est pas facile. Fournir de l'aide signifie s'impliquer dans un conflit complexe aux issues incertaines, mais refuser pourrait signifier abandonner un allié dans le besoin et potentiellement permettre au communisme de prendre un autre pied dans la région."
 VIE_China_Civil_War.1.a: "Aide à nos frères anticommunistes !"
 VIE_China_Civil_War.1.b: "Nous ne devons pas nous mêler des affaires des autres pays."

 # Economic

 # Self-Determination
 VIE_Econ_SelfDem.1.t: "Notre plaidoyer pour l'autodétermination économique"
 VIE_Econ_SelfDem.1.d: "Notre grand leader [GetVIEChiefOfState] a pris des mesures pour convaincre nos bienfaiteurs français d'accorder au Vietnam son indépendance économique qui lui revient. Leur contrôle décroissant signifie qu'il est beaucoup plus facile de saisir l'opportunité, et en tant que tel, [GetVIEChiefOfState] a choisi, grâce à sa diplomatie magistrale, de demander aux Français de décentraliser leur emprise sur nos terres en nous permettant de contrôler directement toutes nos principales industries et investissements. Bien que cela puisse ressembler à une forme de soumission et de reconnaissance de l'hégémonie française, il s'agit en fait de l'une des premières étapes vers la création d'un Vietnam indépendant et glorieux.\n\n[GetVIEChiefOfState] a organisé une ligne de conduite pour le cas où les Français accepteraient inévitablement sa proposition et envisage de développer encore davantage le pays qu'il a fait prospérer."
 VIE_Econ_SelfDem.1.a: "Envoyez la demande."

 VIE_Econ_SelfDem.2.t: "Le Vietnam demande l'autodétermination économique"
 VIE_Econ_SelfDem.2.d: "Le dirigeant vietnamien [GetVIEChiefOfState]a humblement demandé davantage d'indépendance économique. Malgré leur approche amicale de cette diplomatie, il y a des nuances quelque peu menaçantes, compte tenu de notre économie en difficulté d'après-guerre. Nous contrôlons leurs industries clés et de nombreux investissements, même s'il serait peut-être sage de leur laisser plus d'autonomie, de peur de risquer des tensions que nous ne pouvons pas nous permettre."
 VIE_Econ_SelfDem.2.a: "Nous acceptons."
 VIE_Econ_SelfDem.2.b: "Permettez-leur de racheter nos industries."
 VIE_Econ_SelfDem.2.c: "Notre influence coloniale ne doit pas faiblir !"

 VIE_Econ_SelfDem.3.t: "L'Office National du Tourisme"
 VIE_Econ_SelfDem.3.d: "\"Le Vietnam est l'un des pays au monde les plus susceptibles d'attirer les touristes étrangers. La courtoisie de la race vietnamienne et sa politesse innée sont une garantie sûre d'un accueil chaleureux. L'extraordinaire diversité offerte par les lieux d'intérêt et les gens eux-mêmes, la proximité des vestiges de civilisations anciennes et des constructions modernes, la variété du climat et de la végétation font une impression irrésistible même sur le globe-trotter le plus endurci. Que le visiteur soit un admirateur des arts ou des paysages, attiré par la comportement de la société traditionnelle, ou désireux d'observer le développement du pays dans un paysage d'indépendance postcoloniale.\n\n - Dans le tract de propagande d'aujourd'hui, nous annoncerons la création de l'Office national du tourisme aujourd'hui en [VIE.capital.GetName]..."
 VIE_Econ_SelfDem.3.a: "Une façon moderne de gagner de l'argent rapidement"

 TruongSa_Islands.1.t: "Colonisation des îles Truong-Sa"
 TruongSa_Islands.1.d: "Depuis la dynastie Le, les îles au large de la côte est étaient collectivement appelées les îles « Dai Truong Sa » et ont été colonisées par des pêcheurs vietnamiens. Pendant la dynastie des Nguyen et sous le règne du roi Minh-Mang, le nom Van-Ly Truong-Sa est apparu sur la carte de Phan Huy Chu du Dai Nam Nhat Thong Toan Do. Plus tard, le 21 décembre 1933, le gouverneur de la Cochinchine, Jean-Félix Krautheimer, signa le décret n° 4702-CP annexant les îles susmentionnées et d'autres « îles dépendantes » à la province de Ba Ria de la Fédération indochinoise.\n\nBien que notre nation soit encore pauvre et en guerre contre les forces du Viet-Minh, nous pouvons détourner une partie de nos ressources très limitées pour nous installer et incorporer les îles sous le nom d'îles « Truong-Sa » sous la province de Phuoc-Tuy. Grâce au Sac-lenh 143/NV, qui a été signé par notre leader [GetVIEChiefOfState], nous pouvons nous attendre à ce que les îles Truong-Sa soient sous notre contrôle total avec effet immédiat."
 TruongSa_Islands.1.db: "Depuis la dynastie Le, les îles au large de la côte est étaient collectivement appelées les îles « Dai Truong Sa » et ont été colonisées par des pêcheurs vietnamiens. Pendant la dynastie des Nguyen et sous le règne du roi Minh-Mang, le nom Van-Ly Truong-Sa est apparu sur la carte de Phan Huy Chu du Dai Nam Nhat Thong Toan Do. Plus tard, le 21 décembre 1933, le gouverneur de la Cochinchine, Jean-Félix Krautheimer, signa le décret n° 4702-CP annexant les îles susmentionnées et d'autres « îles dépendantes » à la province de Ba Ria de la Fédération indochinoise.\n\nBien que la nation vietnamienne soit encore pauvre et en guerre contre les forces du Viet-Minh, nous avons remarqué qu'elle détournait une partie de ses ressources très limitées pour s'installer et incorporer les îles sous le nom d'îles « Truong-Sa » sous la province de Phuoc-Tuy. Grâce à Sac-lenh 143/NV, qui a été signé par le leader [GetVIEChiefOfState], nous pouvons nous attendre à ce que les îles Truong-Sa soient immédiatement sous leur contrôle total."
 TruongSa_Islands.1.a: "Nos terres légitimes."
 TruongSa_Islands.1.b: "Concernant."

 # May-Day Parade
 MayDay_Parade.1.t: "Les travailleurs syndiqués demandent une manifestation le 1er mai"
 MayDay_Parade.1.d: "Tran-Quoc-Buu a demandé un permis à la moitié des ministères de Saigon. Il propose d'organiser le premier défilé annuel du 1er mai et il présente une pétition en tant que représentant d'un grand nombre de syndicats dispersés et de cellules d'usines qui n'ont eu jusqu'à présent aucun représentant.\n\nLes Xac-Te s'y opposent et ont longuement exposé leurs raisons. Buu était avec le Viet Minh ; la confirmation est dans leurs dossiers et ne fait aucun doute. Selon eux, une manifestation autorisée de travailleurs organisés le 1er mai n'est pas un défilé mais une assemblée, et une assemblée de cette taille dans cette ville est une invitation que l'autre partie ne refusera pas.\n\nLe ministère du Travail, de l'Agriculture et des Relations sociales est d'un avis contraire et le formule plus froidement. Ces syndicats existent, que nous leur accordions ou non une licence. Un permis les met en relation avec le gouvernement, nous donne notre mot à dire sur qui parle et ce qui est porté, et offre la seule chance que nous aurons probablement de guider l'ensemble du mouvement vers la cause Quoc-Gia au lieu de s'en éloigner."
 MayDay_Parade.1.a: "Une manifestation en temps de guerre ? Absolument pas."
 MayDay_Parade.1.b: "Peut-être avons-nous plus à gagner que nous ne le pensons. Acceptez leur pétition."

 MayDay_Parade.2.t: "Le 1er défilé national du 1er mai"
 MayDay_Parade.2.d: "La première Fête nationale du mois de mai - Dien-Hanh Quoc-Gia Ngay Quoc-Te Can-Lao - a eu lieu le deuxième du mois au Palais Norodom. Phan-Khac-Su, ministre du Travail, de l'Agriculture et des Relations sociales, l'a dirigé au nom d'une coalition de syndicats d'usine et de syndicats, avec le syndicaliste Tran-Quoc-Buu sur la tribune à ses côtés.\n\nLe ministre a parlé bien et longuement. La cause Quoc-Gia, a-t-il dit, a uni toutes les classes de Vietnamiens dans la défense de la culture du pays et de sa souveraineté contre la menace communiste. Puis vint le défilé : des voitures décorées et des travailleurs d'entreprises vietnamiennes et françaises défilant sous les bannières de leurs propres organisations. Il avait été assemblé à la hâte et il en avait l'air.\n\nIl n'est pas arrivé au bout du parcours. À un moment donné, une partie des manifestants a commencé à scander des slogans communistes ; les chants se sont répandus ; et le Xac-Te et la Gendarmerie ont amené des véhicules blindés sur la place et l'ont nettoyée. Des arrestations ont eu lieu et le reste du programme a été annulé. La bande d'actualités du discours du ministre sera diffusée sans les images qui l'ont suivi."
 MayDay_Parade.2.a: "Tôt ou tard, les travailleurs comprendront la cause Quoc-Gia."

 # -- News Events --

 Etat_du_Vietnam.0.t: "[GetNewspaperHeader]Bao-Dai proclame « l'État du Vietnam »"
 Etat_du_Vietnam.0.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le chef de l'Etat Bao-Dai est arrivé dans la capitale pour proclamer l'unification de la Cochinchine et de l'Annam sous l'Etat du Vietnam (Etat du Viet-Nam). Cette déclaration marque une étape importante vers la consolidation du territoire vietnamien sous un gouvernement unique.\n\nMalgré de nombreux défis - notamment des difficultés d'administration coloniale, des groupes paramilitaires religieux, des bandits et une insurrection communiste à l'échelle nationale - Bao-Dai a réussi à placer ces deux régions sous un contrôle unifié. La nouvelle structure étatique représente une tentative de renforcer l'autonomie vietnamienne tout en maintenant le cadre de l'association française.\n\nUne fois cette fondation établie, Bao-Dai cherche désormais à étendre son autorité sur les domaines restants de la Couronne et à intensifier ses efforts contre les forces communistes. La proclamation marque une nouvelle phase dans le développement politique du Vietnam, même si le chemin à parcourir reste semé d'embûches.\n"
 Etat_du_Vietnam.0.a: "Intéressant."

 BaoDai.0.t: "[GetNewspaperHeader]Le chef de l'Etat Bao-Dai censure Saïgon et la presse étrangère"
 BaoDai.0.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le chef de l'Etat Bao-Dai a ordonné une censure stricte de la presse saigonnaise et étrangère à la suite de rapports critiques sur sa conduite personnelle. L'article du journaliste Merry Bromberger a révélé les fréquentes apparitions du dirigeant dans les discothèques et les casinos de Hong Kong, établissant des comparaisons avec le roi de France Louis XVI.\n\nLe gouvernement a imposé de sévères restrictions aux publications, en particulier celles qui examinent la vie privée et les habitudes de dépenses de Bao-Dai. Ces mesures ont suscité de sérieuses inquiétudes parmi les observateurs internationaux quant à la liberté de la presse et aux principes démocratiques au Vietnam.\n\nCette répression représente une escalade significative du contrôle de l'État sur l'information, susceptible de nuire à la réputation internationale du Vietnam et à ses relations avec les puissances occidentales qui valorisent la liberté d'expression.\n\n"
 BaoDai.0.a: "Liberté d'expression..."

 BaoDai.100.t: "[GetNewspaperHeader]Ngo-Dinh-Diem est nommé premier président de la République du Vietnam"
 BaoDai.100.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Ngo-Dinh-Diem a prêté serment en tant que premier président de la République du Vietnam, à la suite du référendum qui a destitué le chef de l'État Bao-Dai. Le rapport officiel attribue à Diem 605 025 voix rien qu'à Saigon, un chiffre supérieur au nombre d'électeurs inscrits dans la ville, et les observateurs étrangers invités au décompte ont refusé de le certifier.\n\nLa machinerie derrière le vote a évolué plus vite que les débats à son sujet. Une Assemblée constituante a été élue, une constitution promulguée et l'État du Vietnam (Quoc-Gia Viet-Nam) est devenu la République du Vietnam (Viet-Nam Cong-Hoa) en quelques semaines. Bao-Dai, qui n'est pas revenu de France, conteste la légalité de toute la procédure venue de Cannes ; aucun journal de Saigon n'a repris cette déclaration.\n\nLe nouveau président a promis de gouverner selon la doctrine que ses partisans appellent le personnalisme travailliste (Can-Lao Nhan-Vi). Il hérite d'une république vieille de quelques jours, d'une partition que les deux moitiés qualifient de temporaire et d'une garnison française dont le départ est désormais une question de négociation plutôt que de calendrier."
 BaoDai.100.a: "Le nouvel homme miracle du Vietnam."

 French_Hinh.0.t: "[GetNewspaperHeader]Le Vietnam obtient une plus grande autonomie au sein de l'Union française"
 French_Hinh.0.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le gouvernement français a annoncé un nouvel arrangement administratif accordant à l'État du Vietnam une autonomie élargie au sein de l'Union française. Le général Nguyen-Van-Hinh, qui dirige le gouvernement vietnamien depuis la crise politique de l'année dernière, a salué cet accord comme « un nouveau chapitre du partenariat » entre la France et le Vietnam.\n\nAux termes de cet accord, le Vietnam conservera le contrôle formel de son administration intérieure tandis que la France assurera la surveillance de la défense et des affaires étrangères. Les responsables français ont décrit l'accord comme un modèle de partenariat coopératif adapté à l'ère moderne.\n\nL'accord a suscité des réactions mitigées au niveau international. Les États-Unis ont accueilli la nouvelle avec prudence, tandis que les groupes nationalistes vietnamiens en exil l'ont condamnée comme une continuation du régime colonial sous un nom différent. À Saigon même, la réaction a été largement modérée - de nombreux Vietnamiens sont habitués depuis longtemps à lire entre les lignes des annonces officielles.\n\n"
 French_Hinh.0.a: "Un nouveau chapitre pour l'Indochine."

 French_Hinh.100.t: "[GetNewspaperHeader]La France réaffirme son contrôle direct sur le Vietnam"
 French_Hinh.100.d: "Paris, [?global.date.GetDateStringNoHourLong] - L'Assemblée nationale française a approuvé des mesures plaçant l'État du Vietnam sous la tutelle administrative directe française. Les principaux ministères de Saigon fonctionneront désormais sous la direction française et l'Armée nationale vietnamienne sera intégrée à la structure de commandement du Corps expéditionnaire français.\n\nLe général Nguyen-Van-Hinh, chef du gouvernement vietnamien, a signé l'accord formel avec le haut-commissaire français lors d'une brève cérémonie à Saigon. Les responsables parisiens ont décrit cette décision comme une mesure de stabilisation visant à garantir la poursuite de la lutte contre l'insurrection communiste en Indochine.\n\nCette décision a suscité de vives critiques de la part de Washington, qui avait pressé la France d'honorer l'autodétermination vietnamienne comme condition de l'aide américaine. Plusieurs partis politiques vietnamiens ont lancé des protestations officielles, tandis que des groupes nationalistes ont appelé à une nouvelle résistance. Les observateurs notent que la France a choisi la certitude du contrôle plutôt que la promesse de légitimité - un pari de plus en plus risqué.\n\n"
 French_Hinh.100.a: "L'empire perdure."

 VIE_Vinh.0.t: "[GetNewspaperHeader]Cuong-De couronné empereur honoraire du Vietnam"
 VIE_Vinh.0.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - Lors d'une cérémonie historique, le prince Cuong-De a été officiellement couronné empereur honoraire du Vietnam, prenant le nom royal de Nam-Hung. Le couronnement marque le point culminant d'années de lutte politique et marque une rupture décisive avec l'ère Bao-Dai.\n\nDes dignitaires de tout le pays et de l'étranger se sont rassemblés pour assister à cet événement mémorable. Dans son discours de couronnement, l'empereur Nam-Hung s'est engagé à lutter contre la corruption, à mettre en oeuvre des réformes globales et à poursuivre l'unification du Vietnam.\n\nCette transition représente un changement fondamental dans la politique vietnamienne, vers une nouvelle vision de la nation. Les partisans célèbrent le changement, tandis que les observateurs observent avec un intérêt prudent si le nouvel empereur peut tenir ses promesses ambitieuses.\n\n"
 VIE_Vinh.0.a: "Intéressant."

 CuongDe.0.t: "[GetNewspaperHeader]Bao-Dai s'installe à Paris"
 CuongDe.0.d: "Paris, [?global.date.GetDateStringNoHourLong] - L'ancien chef de l'État Bao-Dai est arrivé dans la capitale française pour commencer une vie en exil, après avoir perdu totalement le soutien du peuple vietnamien et du gouvernement français. Le décret de l'empereur Nam-Hung a formellement condamné Bao-Dai à l'exil permanent, lui interdisant de retourner au Vietnam.\n\nLa chute de Bao-Dai est survenue rapidement après que l'empereur a annoncé le retrait de tous les loyalistes de Bao-Dai des postes gouvernementaux et militaires. Sa base politique étant éliminée et sa réputation en lambeaux, l'exil devint la seule option restante.\n\nBao-Dai rejoint désormais les rangs des anciens dirigeants en disgrâce qui ont passé leurs dernières années en exil français, marquant une fin humiliante à une carrière politique autrefois prometteuse. Son départ marque la fin définitive d'une époque dans la politique vietnamienne.\n\n"
 CuongDe.0.a: "Une fin digne d'un Playboy..."

 CuongDe.100.t: "[GetNewspaperHeader]Le Vietnam adopte la Déclaration universelle des droits de l'homme de l'ONU"
 CuongDe.100.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - Le gouvernement vietnamien a officiellement adopté la Déclaration universelle des droits de l'homme des Nations Unies, engageant la nation à respecter les droits et libertés fondamentaux. Cette adoption représente une étape importante vers l'alignement du Vietnam sur les normes internationales en matière de droits de l'homme.\n\nLa déclaration garantit la liberté d'expression, de réunion et de religion, ainsi que des protections contre les arrestations arbitraires et la torture. En adoptant ces principes, le Vietnam démontre son engagement envers le bien-être de ses citoyens et les normes internationales.\n\nCependant, la mise en oeuvre se heurte à de sérieux défis. Le Vietnam reste plongé dans un conflit et les impératifs de sécurité entrent souvent en conflit avec le plein exercice des droits de l'homme. Le gouvernement doit équilibrer ces priorités concurrentes tout en s'efforçant de mettre en oeuvre les principes de la déclaration.\n\nCette adoption marque néanmoins un progrès important vers une société plus juste. Cet engagement sera mis à l'épreuve dans les années à venir alors que le Vietnam navigue dans la relation complexe entre sécurité et liberté.\n"
 CuongDe.100.a: "Intéressant."

 CuongDe_Coup.0.t: "[GetNewspaperHeader]Le nouvel empereur du Vietnam"
 CuongDe_Coup.0.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - Les partisans du prince Cuong-De ont organisé un coup d'État réussi, prenant d'assaut la résidence de Bao-Dai et le forçant à démissionner sous la menace d'une arme. Avec le soutien de la France, Cuong-De est monté sur le trône impérial en tant qu'empereur Nam-Hung, marquant un changement radical dans la politique vietnamienne.\n\nDans son discours de couronnement, le nouvel empereur s'est engagé à lutter contre la corruption politique, à mettre en oeuvre des réformes radicales et à poursuivre l'unification du Vietnam. Ses partisans ont éclaté de cris de « Van-Tue ! Van-Tue ! Van-Tue ! » - \"Vive l'Empereur !\" - tandis que des dignitaires étrangers leur ont adressé leurs salutations officielles.\n\nCe coup d'État représente le point culminant d'années de manoeuvres politiques et marque la fin de l'ère Bao-Dai. Le nouvel empereur est désormais confronté au défi de tenir ses promesses tout en maintenant la stabilité dans une nation toujours aux prises avec des divisions internes et des pressions extérieures.\n\n"
 CuongDe_Coup.0.a: "Intéressant."

 CuongDe_Successor.0.t: "[GetNewspaperHeader]Nhiep couronné chef du Vietnam"
 CuongDe_Successor.0.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - Suite à la mort de l'empereur Nam-Hung (Cuong-De), Nguyen Rinh Nhiep a été officiellement installé comme nouveau dirigeant du Vietnam. Nhiep, qui a été Premier ministre sous le défunt empereur, a été choisi pour poursuivre la politique et la vision de l'ère Nam-Hung.\n\nLa transition s'est déroulée sans heurts, Nhiep bénéficiant d'un large soutien du gouvernement et de l'armée. Dans son discours inaugural, il s'est engagé à honorer l'héritage de l'empereur Nam-Hung et à continuer de construire un Vietnam moderne et indépendant.\n\nL'ascension de Nhiep représente une continuité plutôt qu'un changement, car il était étroitement aligné sur la politique du défunt empereur. Cependant, il est confronté au défi de maintenir la stabilité sans le leader charismatique qui a unifié la nation.\n\nL'avenir reste incertain, mais la transition s'est déroulée avec succès. Le Vietnam entre désormais dans un nouveau chapitre sous la direction de Nhiep.\n"
 CuongDe_Successor.0.a: "Intéressant."

 CuongDe_Successor.100.t: "[GetNewspaperHeader]Diem succède à Cuong-De"
 CuongDe_Successor.100.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - Dans un développement surprenant, Ngo-Dinh-Diem a été choisi pour succéder à l'empereur Nam-Hung (Cuong-De) à la tête du Vietnam. Diem, personnalité politique éminente et ancien partisan de l'empereur, accède au pouvoir à un moment critique de l'histoire du pays.\n\nLa sélection de Diem signale un changement important dans la politique vietnamienne. Contrairement au défunt empereur, il apporte sa propre vision et ses propres politiques qui peuvent fondamentalement modifier l'orientation du gouvernement. Ses liens avec les États-Unis suggèrent que la politique étrangère du Vietnam pourrait évoluer considérablement.\n\nLa transition a suscité des réactions mitigées. Les partisans de Diem accueillent favorablement ce changement, tandis que d'autres expriment leurs inquiétudes quant à d'éventuels revirements de politique. Les mois à venir révéleront si Diem maintient la continuité ou trace une toute nouvelle voie.\n\nLe Vietnam entre désormais dans une ère d'incertitude. Le leadership de Diem façonnera l'avenir de la nation d'une manière qui reste à déterminer.\n"
 CuongDe_Successor.100.a: "Intéressant."

 CuongDe_Successor.200.t: "[GetNewspaperHeader]La prise de contrôle de Cao-Dai"
 CuongDe_Successor.200.d: "Tay-Ninh, [?global.date.GetDateStringNoHourLong] - Après la mort de l'empereur Nam-Hung, le mouvement religieux Cao-Dai a réussi à affirmer son contrôle sur le gouvernement vietnamien. Tirant parti de leur solide structure organisationnelle et de leur influence significative dans la région de Tay-Ninh, les Cao-Dai dirigent désormais l'avenir politique du Vietnam.\n\nCette évolution marque un changement fondamental dans la politique vietnamienne, l'autorité religieuse assumant un rôle central dans la gouvernance. Les Cao-Dai apportent des capacités organisationnelles et un soutien populaire, même si leur orientation religieuse peut compliquer les relations avec les éléments laïcs et les partenaires internationaux.\n\nLa transition s'est relativement bien déroulée, les Cao-Dai utilisant les réseaux existants pour consolider le pouvoir. Cependant, des questions persistent quant à leur capacité à gouverner une nation diversifiée et à maintenir l'unité face aux défis actuels.\n\nLe Vietnam entre en territoire inconnu avec un mouvement religieux à sa tête. Le succès ou l'échec de cette expérience déterminera la trajectoire de la nation pour les années à venir."
 CuongDe_Successor.200.a: "Intéressant."

 VIE_JAP.0.t: "[GetNewspaperHeader]Le virage de Cuong-De vers le Japon"
 VIE_JAP.0.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - L'empereur Nam-Hung (Cuong-De) a annoncé un changement significatif dans la politique étrangère vietnamienne vers des relations plus étroites avec le Japon. Cet abandon de l'attention exclusive portée aux puissances occidentales témoigne de l'intérêt du Vietnam à construire des liens plus solides avec les pays asiatiques.\n\nLa nouvelle orientation comprend des plans de coopération économique, d'échanges culturels et potentiellement un alignement diplomatique plus étroit. Tokyo a accueilli favorablement cette évolution, y voyant une opportunité d'étendre l'influence japonaise en Asie du Sud-Est.\n\nCependant, ce réalignement a suscité des inquiétudes parmi les alliés traditionnels du Vietnam, en particulier la France et les États-Unis, qui pourraient y voir un éloignement de leur sphère d'influence. Les implications complètes restent floues à mesure que se déroule ce changement diplomatique.\n\nPour le Vietnam, cela représente une tentative de diversifier les relations internationales et de réduire la dépendance à l'égard d'une seule puissance. Reste à savoir si cette stratégie réussira, mais elle marque un moment charnière dans la politique étrangère vietnamienne.\n"
 VIE_JAP.0.a: "Intéressant."

 VIE_JAP.100.t: "[GetNewspaperHeader]Le panasiatisme déclaré"
 VIE_JAP.100.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - Le Vietnam a officiellement déclaré son engagement en faveur du panasiatisme, une philosophie mettant l'accent sur la coopération et l'unité entre les nations asiatiques. Cette déclaration représente un changement fondamental dans la politique étrangère, signalant un abandon de l'alignement avec les puissances occidentales.\n\nLe panasiatisme appelle les nations asiatiques à travailler ensemble pour un bénéfice mutuel, sans domination extérieure. Il met l'accent sur le patrimoine culturel partagé, la coopération économique et la solidarité politique. Pour le Vietnam, cela offre l'opportunité de construire des relations fondées sur l'égalité plutôt que sur des arrangements coloniaux.\n\nLa déclaration a suscité l'intérêt dans toute l'Asie, où certains la considèrent comme une étape positive vers la coopération régionale. Cependant, les puissances occidentales ont exprimé leur inquiétude, y voyant une remise en cause de leur influence dans la région.\n\nLa mise en oeuvre sera complexe et nécessitera un équilibre minutieux entre les divers intérêts et systèmes politiques asiatiques. Néanmoins, la déclaration du Vietnam marque une étape importante vers une nouvelle vision de la coopération asiatique."
 VIE_JAP.100.a: "Intéressant."

 VNA.0.t: "[GetNewspaperHeader]Fondation de l'Armée Nationale du Vietnam"
 VNA.0.d: "Saigon, [?global.date.GetDateStringNoHourLong] - L'Etat du Vietnam et la France ont signé l'accord militaire créant la Quan-Doi Quoc-Gia Viet-Nam, l'Armée nationale du Vietnam. Selon ses termes, les bataillons vietnamiens levés, payés et dirigés par le commandement français passent au commandement vietnamien, et le chef de l'État Bao-Dai est nommé commandant en chef.\n\nSur le papier, la force devrait atteindre quelque 120 000 hommes sous 4 000 officiers, tous vietnamiens. Ce corps d'officiers n'existe pas encore. La France recrute des lieutenants vietnamiens depuis à peine deux ans et l'accord laisse donc les officiers français détachés auprès des unités vietnamiennes le temps nécessaire pour les remplacer. Le général de Lattre de Tassigny, qui a le plus insisté pour cet accord, a déclaré lors de la cérémonie que les recrues ne manquaient que d'entraînement et que l'entraînement était la seule chose qui ne s'improvisait pas.\n\nL'accord détermine qui commande. Elle laisse ouverte la question de savoir qui paie, qui arme et ce que représente une armée nationale, tandis que son artillerie, ses moyens de transport et son soutien aérien restent aux mains du corps expéditionnaire."
 VNA.0.a: "Danh-Du-To-Quoc!"

 VNA.1.t: "[GetNewspaperHeader]La Fondation de l'Armée nationale vietnamienne de construction"
 VNA.1.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - Le Bo-Quoc-Phong (ministère national de la Défense) a annoncé la fusion réussie de divers groupes armés en une force militaire unifiée. Cette tâche apparemment insurmontable a été accomplie grâce à l'habile diplomatie du chef de l'État Cuong-De et de ses ministres.\n\nLes observateurs notent que les forces sud-vietnamiennes expérimentent des concepts de guerre innovants, notamment des divisions blindées de reconnaissance et des unités spécialisées dans la guerre dans la jungle (Khinh-Quan). Il est remarquable que les armées catholiques, bouddhistes et religieuses aient toutes été rassemblées sous une seule bannière, unies dans la cause nationaliste.\n\nCette consolidation représente une réalisation majeure dans l'organisation militaire. Avec des progrès aussi impressionnants, il semble que l'insurrection du Sud pourrait entrer dans sa phase finale et que la paix pourrait bientôt être rétablie dans la région.\n\n"
 VNA.1.a: "Intéressant."

 VNA.3.t: "1er défilé militaire annuel"
 VNA.3.da: "Saigon, [?global.date.GetDateStringNoHourLong] - [GetVIEPremierTitle] [VIE.GetLeader] et le général de brigade Phan-Van-Giao ont organisé aujourd'hui le premier défilé militaire annuel dans la capitale. Il était composé principalement de la nouvelle Garde nationale, avec des divisions françaises marchant derrière, et les foules le long de la route étaient considérables.\n\nGiao a été élevé au rang de lieutenant général à la tribune de révision par le chef de l'État et nommé inspecteur général de l'armée et Premier ministre du Trung-Viet dans la même annonce. La citation parle de son patriotisme et de son rôle dans la création de la première force vietnamienne moderne, et dans les deux cas, elle est méritée : la Garde est sa création et n'existerait pas sans lui.\n\nTrois rendez-vous en une après-midi, c'est néanmoins beaucoup à offrir à un soldat. Giao inspecte désormais l'armée qu'il a construite, gouverne une région et siège au cabinet, et il n'y a plus personne dans la structure pour lui dire non."
 VNA.3.db: "Saigon, [?global.date.GetDateStringNoHourLong] - [GetVIEPremierTitle] [VIE.GetLeader] et le général de brigade Nguyen-Van-Hinh ont organisé aujourd'hui le premier défilé militaire annuel dans la capitale. Il était composé principalement de la nouvelle Garde nationale, avec des divisions françaises marchant derrière, et les foules le long de la route étaient considérables.\n\nHinh a été élevé au rang de lieutenant général à la tribune de révision par le chef de l'État et nommé inspecteur général de l'armée et Premier ministre du Trung-Viet dans la même annonce. La citation parle de son patriotisme et de son rôle dans la levée de la première force vietnamienne moderne.\n\nTrois rendez-vous en une après-midi, c'est beaucoup à donner à un soldat, et ce soldat est titulaire d'une commission française et d'un passeport français ainsi que d'un vietnamien. Hinh inspecte désormais l'armée, gouverne une région et siège au cabinet, et il n'y a plus personne dans la structure pour lui dire non - encore moins à Saigon."
 VNA.3.a: "Nous pouvons amener le combat entre les communistes maintenant !"

 VNA.4.t: "Fondation de la Marine Nationale"
 VNA.4.d: "La Marine vietnamienne est aujourd'hui constituée comme la deuxième branche armée de l'Armée nationale, avec ses services subordonnés établis à ses côtés par le même décret.\n\nLe Centre de formation navale de Nha-Trang ouvrira dans quatre mois pour former des officiers, des officiers mariniers et des matelots sous le commandement naval, et les premiers cours sont déjà surchargés. Il y a une difficulté avec le programme, et elle n'est pas minime : la Marine ne dispose pas de navires. Les diplômés seront envoyés servir à bord des navires français jusqu'à ce qu'il y ait des ponts vietnamiens pour les embarquer.\n\nUne marine qui commence avec une école et sans flotte est facilement ridiculisée, et on se moque d'elle. C'est aussi le seul ordre dans lequel cela peut être fait. Les coques peuvent être achetées ou données au cours d'une saison ; un corps d'officiers vietnamiens capable de prendre la mer avec un navire ne le peut pas."
 VNA.4.a: "To-Quoc - Dai-Duong !"

 VNA.5.t: "Fondation de l'Armée de l'Air Nationale"
 VNA.5.da: "Une Section aérienne a été créée au sein de l'état-major général de l'Armée nationale, sous la supervision du maréchal Giao. C'est le début d'une troisième branche armée, et actuellement c'est un bureau.\n\nCe qu'elle administre, c'est l'escadron de liaison, que commande l'armée de l'air française. Les pilotes vietnamiens volent avec, mais ils volent en tant que seconds pilotes ; chaque commandant d'avion et chaque pilote en chef à chaque sortie est un officier français. La Section peut planifier, réquisitionner et faire rapport. Il ne peut pas ordonner à un avion de décoller.\n\nDes académies d'officiers de l'air à Nha-Trang et Tan-Son-Nhut ont été créées et attendent leur homologation, c'est-à-dire des avions et des instructeurs que la France n'a pas encore proposés. En attendant, l'air de la patrie appartient à celui qui est assis sur le siège de gauche."
 VNA.5.db: "Une section aérienne a été créée au sein de l'état-major général de l'armée nationale, sous la direction du général Hinh, qui a lui-même volé pour l'armée de l'air française et est le seul homme du bâtiment qualifié pour la diriger. C'est le début d'une troisième branche armée, et actuellement c'est un bureau.\n\nCe qu'elle administre, c'est l'escadron de liaison, que commande l'armée de l'air française. Les pilotes vietnamiens volent avec, mais ils volent en tant que seconds pilotes ; chaque commandant d'avion et chaque pilote en chef à chaque sortie est un officier français. La Section peut planifier, réquisitionner et faire rapport. Il ne peut pas ordonner à un avion de décoller.\n\nDes académies d'officiers de l'air à Nha-Trang et Tan-Son-Nhut ont été créées et attendent leur homologation, c'est-à-dire des avions et des instructeurs que la France n'a pas encore proposés. En attendant, l'air de la patrie appartient à celui qui est assis sur le siège de gauche."
 VNA.5.a: "To-Quoc - Khong-Gian !"

 VNA.6.t: "La Fondation de l'Armée nationale vietnamienne de construction"
 VNA.6.d: "Phu-Xuan, [?global.date.GetDateStringNoHourLong] - L'Empereur a proclamé la première armée nationale d'un Vietnam libre et lui a donné un nom chargé d'histoire : le Viet-Nam Kien-Quoc Quan, l'Armée Nationale de Construction. L'ancienne armée de Kien-Quoc appartenait à Cuong-De, elle était commandée par le général Tran-Trung-Lap et elle fut détruite en 1945. Nam-Hung a choisi de dire clairement de quelle armée est issue celle-ci.\n\nOn y intègre quelque soixante mille hommes : le Bao-Quoc Doan, le Ve-Quoc Doan, une demi-douzaine de corps paramilitaires plus petits et les formations auxiliaires françaises qui combattent à leurs côtés sans jamais rendre compte à un officier vietnamien. Ils doivent être rééquipés, restructurés et placés sous la direction d'un corps d'officiers professionnels vietnamiens.\n\nIl s'agit d'un prototype et le gouvernement n'a pas prétendu le contraire. Ce qui est testé ici est de savoir si les officiers vietnamiens peuvent maintenir ensemble une force constituée d'armées privées et d'auxiliaires coloniaux, et si cette force se battra pour un État plutôt que pour les hommes qui l'ont créé."
 VNA.6.a: "Dan-Quoc - Trach-Nhiem - Quyet Chien !"

 VNA.7.t: "1er défilé militaire annuel"
 VNA.7.d: "L'empereur et le général Tran-Quang-Vinh des forces Cao-Dai ont organisé aujourd'hui un défilé dans la capitale, le plus grand défilé que ce pays ait organisé. Elle était composée principalement de la nouvelle Armée nationale de construction, suivie par des divisions françaises, et les foules étaient informées à l'avance de ce qu'elles avaient en face : une armée vietnamienne, en uniforme vietnamien, sous un souverain vietnamien.\n\nVinh a été élevé au rang de maréchal par décret du Parlement à la barre de révision, et nommé dans le même temps inspecteur général de l'armée et Premier ministre du Trung-Viet. La citation parle de son patriotisme et de son rôle dans la construction de la première force vietnamienne moderne, et les deux sont mérités.\n\nTrois offices en une après-midi ont néanmoins été signalés. Vinh commande le Cao-Dai, le Cao-Dai commande Tay-Ninh, et un gouvernement qui ne peut pas encore désarmer ses sectes peut au moins promouvoir l'homme qui dirige la plus grande d'entre elles. Qu'il s'agisse d'un sens politique ou d'un hommage dépend de la personne à qui on demande."
 VNA.7.a: "Nous pouvons défendre notre nation maintenant !"

 VNG.0.t: "[GetNewspaperHeader]Fondation du Ve-Binh Quoc-Gia Viet-Nam"
 VNG.0.d: "Saigon, [?global.date.GetDateStringNoHourLong] - [GetVIEPremierTitle] [VIE.GetLeader] a annoncé la formation de la Ve-Binh Quoc-Gia Viet-Nam, la Garde nationale vietnamienne, et a fixé ses effectifs à quelque 60 000 hommes. La force n'est pas nouvellement créée. Il s'agit d'un amalgame sur le papier de corps paramilitaires que l'administration française et les notables du Sud financent séparément depuis près de quatre ans.\n\nY participent le Viet-Binh Doan de Phan-Van-Giao, le Ve-Binh Nam-Viet, le Bao-Chanh Doan et le Ve-Binh Son-Cuoc, ainsi qu'une douzaine de formations plus petites dont les salaires n'ont jamais été entièrement audités. Le projet initial de Giao a échoué précisément parce que de telles unités répondent aux hommes qui les ont élevées, et le décret annoncé ici n'y change rien en lui-même. Aucune déclaration n'a été faite quant aux dirigeants qui seront retenus.\n\nLa Garde nationale est destinée à mettre en garnison le sud et à libérer des unités régulières pour le terrain. La décision de savoir si elle deviendra une gendarmerie de l'État ou un parapluie légal pour les mêmes armées privées sera décidée dans les provinces plutôt qu'à Saigon."
 VNG.0.a: "Pour la cause des Quoc-Gia !"

 VNA.100.t: "[GetNewspaperHeader]Formation de l'Armée nationale Muong"
 VNA.100.d: "[?global.date.GetDateStringNoHourLong] - Le peuple Muong a officiellement créé sa propre armée nationale, marquant un développement important dans la politique ethnique du Vietnam. Cette nouvelle force militaire représente l'affirmation de l'identité des Muong et leur détermination à protéger leurs intérêts et leur autonomie.\n\nCette formation intervient dans une période de grande complexité dans la politique vietnamienne, où divers groupes ethniques cherchent à faire valoir leurs droits et à protéger leurs communautés. Les Muong, avec leur identité culturelle distincte et leur présence historique, organisent désormais des capacités militaires indépendantes.\n\nCette évolution a de profondes implications sur la situation politique du Vietnam. Une force militaire Muong indépendante pourrait contribuer à la stabilité en assurant la sécurité, ou elle pourrait créer des tensions avec le gouvernement central, qui pourrait y voir un défi à son autorité.\n\n"
 VNA.100.a: "Intéressant."

 # === Montagnard Country - 1950s Events ===

 # -- Country Events --

 # Political

 # Quy-Che 16
 QuyChe_16.1.t: "Quy-Che 16"
 QuyChe_16.1.d: "Aujourd'hui, le chef de l'Etat Bao-Dai a délivré le Quy-Qhe 16 après une cérémonie à Ban-Me-Thuot avec le haut-commissaire français en Indochine, Léon Pignon. Le Quy-Che, qui a été rédigé pour promulguer la création d'un « règlement spécial », a été conçu pour permettre aux Montagnards de participer davantage aux affaires locales dans les hauts plateaux de Trung-Phan. De nouvelles réglementations ont réaffirmé les « droits éminents » de l'État du Vietnam sur les territoires nouvellement acquis. Quy-Che 16 contenait les règlements suivants relatifs aux zones de hautes terres du Domaine de la Couronne :\n\n 1. Les intérêts de l'État vietnamien doivent être alignés sur les intérêts des minorités ethniques (Sac-toc Thieu-so).\n 2. Le territoire appartient personnellement au Chef de l'Etat.\n 3. Les Montagnards autochtones seront autorisés à participer au développement des Hautes Terres.\n 4. Le gouvernement Quoc-Gia respectera le système tribal et la culture des Montagnards."
 QuyChe_16.1.a: "Nous allons « civiliser » ces minorités..."

 # Bao-Dai Personality Cult
 BaoDai_Personality_Cult.1.t: "Le culte de Bao-Dai"
 BaoDai_Personality_Cult.1.d: "Quelque chose d'inattendu se passe sur le plateau. Dans le domaine de la Couronne des Hautes Terres du Sud, les chefs et les communautés villageoises ont commencé à placer des images du chef de l'État parmi leurs propres divinités - non pas en tant que dirigeant à honorer, mais à l'intérieur du panthéon, en tant qu'avatar du Créateur suprême.\n\nLes anthropologues envoyés pour l'examiner font état d'une pratique qui se propage entre les villages sans que personne dans l'administration ne l'ait encouragée. Un chef, invité à s'expliquer, résume tout cela en une phrase : « L'Empereur est le roi des dieux qui protège les forêts et les plaines de mon peuple.\n\nAucun gouvernement n'a jamais gouverné ces hauts plateaux depuis Saigon ou depuis Hué par la seule administration. Ce qui est apparu ici de lui-même est précisément ce qui manquait à toutes les tentatives précédentes, et la question qui se pose aux ministères est de savoir si cela peut être encouragé ailleurs sans paraître fabriqué - car dès qu'il semble fabriqué, il cesse de fonctionner."
 BaoDai_Personality_Cult.1.a: "Peut-être allons-nous intégrer cette façon de penser dans d'autres tribus..."

 # Fire Water Kings
 FireWater_Kings.1.t: "La légende du potao d'eau et de feu de Jerai"
 FireWater_Kings.1.d: "Partout dans les hauts plateaux du centre, jusqu'au Laos et au Cambodge, les Potao Apui et les Potao Ia des Jerai sont vénérés par des peuples qui ne partagent presque rien d'autre. Le Roi du Feu et le Roi de l'Eau ne sont pas des chefs au sens ordinaire du terme. Ils détiennent ensemble l'autorité spirituelle et la position militaire, et la tradition veut qu'ils soient choisis par l'Empereur de Jade pour se tenir entre la communauté et les dieux.\n\nLes Français connaissaient assez bien cette fonction pour en avoir peur. Les Rois du Feu et de l'Eau actuels ont résisté à l'administration coloniale, ont été emprisonnés pour cela et sont toujours en prison - ce qui est le fait le plus utile dans ce dossier.\n\nUn gouvernement qui les libérerait et les honorerait n'achèterait pas deux hommes. Ce serait acheter l'allégeance des Jerai et le respect de tous les peuples qui se tournent vers eux, de Kontum jusqu'au Mékong, et ce serait payer avec une monnaie que les Français n'ont jamais pu dépenser."
 FireWater_Kings.1.a: "Ce seraient des atouts très précieux."

 # Montagnard Administrative
 Montagnard_Administrative.1.t: "Création du Tribunal de la culture montagnarde"
 Montagnard_Administrative.1.d: "Ban-Me-Thuot, [?global.date.GetDateStringNoHourLong] - Le Tribunal de la Culture Montagnard a été constitué dans la capitale du Domaine de la Couronne, et c'est la première institution dans l'histoire de ces hauts plateaux où les montagnards détiennent la majorité des sièges.\n\nQuinze juges y siègent, dix montagnards et cinq français. Il fait respecter le droit du domaine de la Couronne et détient la compétence sur les coutumes, les successions et les observances des peuples du plateau, matières qui jusqu'à présent étaient réglées par l'administrateur français affecté dans le district.\n\nLe chef de l'État préside, et c'est la disposition qui rend tout cela possible : un tribunal siégeant en son nom est un tribunal qu'aucun fonctionnaire provincial ne peut renverser. Dix sur quinze constituent une véritable majorité et elle n'a pas été facilement concédée, et les hommes qui l'ont remportée comprennent qu'une institution ne vaut que ce qu'on peut lui faire faire."
 Montagnard_Administrative.1.a: "Laissez-les juger par eux-mêmes"

 # Du-So 21
 Du_So_21.1.t: "Du-So 21"
 Du_So_21.1.d: "[GetVIEPremierTitle] [VIE.GetLeader] a signé Du-So 21, et le Domaine de la Couronne cesse d'exister en tant qu'entité distincte. Le chef de l'État lui a donné force de loi.\n\nLa raison invoquée est la réunification et la centralisation des territoires du sud, et c'est la véritable raison. Un pays qui lutte pour sa survie ne peut pas maintenir un deuxième ordre juridique à l'intérieur de ses propres frontières, administré par différents fonctionnaires sous une autorité souveraine différente, aussi élégant que paraisse cet arrangement lors de sa rédaction.\n\nCe qui reste du Domaine passe à Trung-Phan. Le Du comporte des garanties - une relative autonomie pour les districts des hautes terres, et la préservation de la culture montagnarde et des institutions montagnardes - et ces garanties sont inscrites dans le texte plutôt que promises à côté de celui-ci. Leur maintien dépendra des hommes dans les bureaux provinciaux et non de quoi que ce soit signé ce matin."
 Du_So_21.1.a: "On dirait que c'est ça."

 Du_So_21.2.t: "L'annexion du domaine de la Couronne des Hautes Terres du Sud"
 Du_So_21.2.d: "Kontum, [?global.date.GetDateStringNoHourLong] - Une petite cérémonie a eu lieu ce matin devant le tribunal administratif et plusieurs milliers de personnes sont descendues des villages pour y assister : chefs, anciens et familles d'une douzaine de peuples, debout sur une place que les Français avaient tracée à de tout autres fins.\n\nLe chef de l'État a lui-même lu la déclaration. Quatre ans et onze mois après sa constitution, le Domaine de la Couronne prend fin et les peuples montagnards des hauts plateaux sont citoyens de l'État du Vietnam avec tout ce que la citoyenneté comporte.\n\nIl a répété la garantie à deux reprises, ce que les personnes présentes ont remarqué. L'autonomie des hauts plateaux est préservée, leurs institutions sont préservées et leur avenir dépend d'eux. Cela a été dit devant les hommes qui le feront tenir, et d'ici la fin de la semaine, tout le plateau saura exactement ce qui a été promis à Kontum."
 Du_So_21.2.a: "Le Sud-Vietnam accueille vos peuples à bras ouverts !"

 # Autonomous Republic
 Autonomous_FUL_Republic.1.t: "Notre Déclaration d'Indépendance"
 Autonomous_FUL_Republic.1.d: "Le soutien du Parlement français fut d'abord obtenu, et ce n'est qu'à ce moment-là que le président Pignon déclara l'indépendance des peuples montagnards vis-à-vis de leurs anciens occupants vietnamiens. L'ordre de ces deux événements sera retenu contre nous, et il n'y avait aucun autre ordre disponible.\n\nLa cérémonie à Ban-Me-Thuot était petite. Les chefs montagnards se sont tenus aux côtés des responsables français et d'un bon nombre d'hommes armés, et le président a clôturé le discours par un discours sur la défense de l'intégrité culturelle et de l'avenir des peuples montagnards contre la colonisation vietnamienne envahissante et sur l'épargne à ces hauts plateaux de l'effusion de sang de la guerre en contrebas. Chefs et Français l'ont applaudi ensemble, ce qui n'est pas un spectacle que ce plateau a souvent offert.\n\nDu côté du gouvernement vietnamien, rien n'a été fait. Aucune protestation, aucune félicitation, aucune reconnaissance du fait que la cérémonie a eu lieu. Ce silence ne durera pas et la suite nous dira ce que vaut réellement notre indépendance."
 Autonomous_FUL_Republic.1.a: "Nous sommes le gouvernement légitime des Montagnards."

 Autonomous_FUL_Republic.2.t: "Reconnaître les Montagnards ?"
 Autonomous_FUL_Republic.2.d: "Le Département d'État a reçu un télégramme du nouveau [FUL.GetName], signé par le président Léon Pignon, demandant la reconnaissance de son indépendance et de son identité nationale.\n\nLa France et ses colonies l'ont déjà reconnu, c'est la première chose que nos analystes ont remarquée. Phu-Xuan a déposé une protestation auprès de Paris et des Nations Unies, arguant que les Hauts Plateaux du Centre étaient vietnamiens depuis des siècles, produisant des documents pour le prouver, et qualifiant la république de Pignon de dispositif illégal pour continuer la domination coloniale française sous un autre drapeau. La note de l'Empereur est soignée, bien rédigée et difficile à répondre sur le fond.\n\nIl n'y a pas de réponse gratuite ici. La reconnaissance indique à Phu-Xuan que Washington financera le démembrement d'un État que nous avons passé quatre ans à construire. Ce refus signifie à Paris que nous ne soutiendrons pas ses dispositions, même là où elles sont déjà en vigueur. Celui que nous choisirons nous sera cité en Indochine pendant des années."
 Autonomous_FUL_Republic.2.a: "Nous sommes aux côtés de Phu-Xuan, nous ne tolérons aucune forme de néo-impérialisme."
 Autonomous_FUL_Republic.2.b: "Nous reconnaissons les droits des Montanard(?) à l'autodétermination et à l'indépendance nationale !"

 Autonomous_FUL_Republic.3.t: "L'empereur Nam-Hung condamne la déclaration d'indépendance des Montagnards"
 Autonomous_FUL_Republic.3.d: "Notre Empereur Nam-Hung a réagi avec fureur à la suite de la déclaration d'indépendance montagnarde par Léon Pignon à Ban-Me-Thuot, une décision qui a défié et directement menacé l'intégrité territoriale de notre nation nouvellement unifiée du Dan-Quoc (État populaire) du Vietnam. Dans son discours, Pignon a dénoncé notre gouvernement Dan-Quoc, le qualifiant de « relique de l'impérialisme japonais et l'accusant de poursuivre des politiques qui mèneraient à l'effacement culturel du peuple montagnard ». L'appel de Pignon à la reconnaissance internationale et son accusation sévère selon laquelle le gouvernement vietnamien menait une « colonisation génocidaire » dans les hauts plateaux du centre ont encore enflammé l'indignation de Nam-Hung.\n\nEn réponse à cette déclaration, notre empereur Nam-Hung a condamné Pignon comme étant un simple colonialiste délirant jouant le rôle de sauveur blanc et l'a accusé de porter atteinte à l'unité et à la souveraineté du Vietnam. Il a affirmé que les terres montagnardes avaient toujours fait partie intégrante du Vietnam, s'engageant à apporter la stabilité à la région malgré les tentatives étrangères de diviser la nation."
 Autonomous_FUL_Republic.3.a: "Encore un stratagème colonialiste français ! Notre cause Dan-Quoc régnera en maître !"

 # Combatting Cuong-De
 Combat_CuongDe.1.t: "Léon Pignon déclare \"invalide\" le régime de Cuong-De"
 Combat_CuongDe.1.d: "Léon Pignon a déclaré ce gouvernement invalide. Le chef du Haut Comité français en Indochine, s'exprimant à Da-Lat, a qualifié l'Empereur de dictateur et de menace pour la stabilité de la région, et a appelé à la cessation immédiate de toutes les relations diplomatiques avec nous.\n\nLe langage mérite attention, car ce n'est pas le langage d'un désaccord entre gouvernements. Pignon ne dit pas que notre politique est erronée. Il dit que nous n'existons pas en tant qu'autorité légitime, et c'est une formule qui précède habituellement quelque chose plutôt qu'elle ne le conclut. Il a déjà été utilisé dans cette péninsule.\n\nIl y a un réconfort à avoir. Un haut-commissaire en mesure de nous destituer n'aurait pas eu besoin de prononcer un discours à ce sujet au préalable. Pignon s'adresse à Paris plutôt qu'à Phu-Xuan, et le fait qu'il doive plaider sa cause signifie que celle-ci n'est pas encore gagnée."
 Combat_CuongDe.1.a: "Nous ne tolérerons aucune forme de néo-impérialisme !"

 # Diplomacy
 VIE_Beg_Pulo_Condore_Return_tt: "Une demande formelle sera soumise à @FRA §YFrance§!, qui pourra accepter de nous transférer §YCon Island§!."

 VIE_Pulo_Condore.1.t: "Une note sur la restitution de Pulo Condore"
 VIE_Pulo_Condore.1.d: "Le Conseil des ministres a achevé l'examen du statut de l'archipel de Con Dao, qui reste sous administration française directe sous le nom de Pulo Condore. Bien que la France continue d'y maintenir son établissement pénitentiaire et ses installations navales, les îles font historiquement et géographiquement partie intégrante du Vietnam.\n\nNotre gouvernement reste associé à la France et doit donc procéder par les voies diplomatiques appropriées. Une note officielle a été préparée pour être transmise à Paris, demandant respectueusement que la souveraineté et la responsabilité administrative de l'archipel soient restituées à l'administration vietnamienne."
 VIE_Pulo_Condore.1.a: "Transmettre la note au Gouvernement français."

 VIE_Pulo_Condore.2.t: "Le Vietnam demande la restitution de Pulo Condore"
 VIE_Pulo_Condore.2.d: "Le gouvernement de [VIE.GetNameDef] a présenté une note formelle demandant la restitution de Pulo Condore, connu des Vietnamiens sous le nom de Con Dao. Saigon soutient que l'archipel fait partie indissociable du territoire vietnamien et que le maintien de l'administration française directe n'est plus cohérent avec le développement des relations constitutionnelles entre la France et le Vietnam.\n\nLes îles conservent leur valeur en tant que colonie pénitentiaire et en tant que modeste station navale commandant les abords du sud de l'Indochine. Néanmoins, leur transfert éliminerait un grief persistant, confirmerait la politique déclarée de la France de délégation des responsabilités administratives et renforcerait un gouvernement dont la coopération dépend de plus en plus de la défense de l'Indochine."
 VIE_Pulo_Condore.2.a: "Les îles seront restituées à l'administration vietnamienne."
 VIE_Pulo_Condore.2.b: "L'administration française continuera pour le moment."

 VIE_Pulo_Condore.3.t: "La France approuve la restitution de Pulo Condore"
 VIE_Pulo_Condore.3.d: "Le Gouvernement français a formellement accepté notre demande concernant Pulo Condore. Les autorités civiles et militaires françaises ont été chargées d'organiser un transfert ordonné de l'archipel, y compris de son port, de sa station de radio et de son établissement pénitentiaire, à nos représentants.\n\nNotre drapeau flotte désormais sur Con Dao et les îles ont enfin retrouvé la souveraineté vietnamienne. Le règlement constitue une avancée modeste mais tangible dans la récupération de notre patrimoine national."
 VIE_Pulo_Condore.3.a: "Con Dao retourne au Vietnam."

 VIE_Pulo_Condore.4.t: "La France refuse la restitution de Pulo Condore"
 VIE_Pulo_Condore.4.d: "Le Gouvernement français a rejeté notre demande de restitution de Pulo Condore. Sa réponse invoque l'importance militaire persistante de l'archipel, les exigences de l'administration pénitentiaire et la situation sécuritaire instable en Indochine. Paris n'a proposé aucune date précise à laquelle la question pourrait être réexaminée.\n\nCette décision a suscité une grande déception au sein du Conseil des ministres. Notre revendication reste inchangée, mais tant que notre gouvernement reste dépendant de la protection française, nos moyens de la faire valoir sont nécessairement limités."
 VIE_Pulo_Condore.4.a: "Les droits du Vietnam ne peuvent pas être indéfiniment mis de côté."

 DaLat_Question.1.t: "Demander le retour de Da-Lat"
 DaLat_Question.1.d: "Le ministère des Affaires étrangères a envoyé un télégramme portant la signature du président Sogny à l'empereur autoproclamé du Vietnam et au gouvernement de Phu-Xuan, exigeant le retour de Da-Lat sous notre juridiction en tant que capitale légitime.\n\nL'affaire repose sur les limites tracées par les Français eux-mêmes. Da-Lat a été fondée en 1890, après l'expédition du docteur Yersin, en tant que ville thermale pour l'élite coloniale, et se situe à l'intérieur des frontières provinciales établies par l'administration pour les hauts plateaux du centre plutôt qu'à l'intérieur du Vietnam. Elle est depuis lors la capitale de facto du plateau, un fait que même Bao-Dai a concédé et promulgué avec Du-So 6/QT/TG.\n\nNous demandons donc une ville que nous administrons en tout sauf le nom, sur la base d'un décret émis par celui dont le successeur l'occupe désormais. C'est un argument fort dans une chancellerie et un argument faible sur le terrain, où Phu-Xuan a des soldats dans la ville et où nous avons un télégramme."
 DaLat_Question.1.a: "Envoyez un télégramme à Paris et mobilisez nos armées !"

 DaLat_Question.2.t: "Pignon et ses colonialistes exigent le contrôle de Da-Lat"
 DaLat_Question.2.d: "Le Ministère des Affaires Étrangères a reçu une demande adressée à l'Empereur du régime d'occupation colonial des Hauts Plateaux du Centre, sous la signature de Léon Sogny, concernant le contrôle et la juridiction de Da-Lat.\n\nLe dossier n'est pas contesté. La dynastie des Nguyen s'est installée sur ces territoires dans les années 1700. Lorsque les Français sont arrivés en 1883, ils ont reconnu nos droits sur eux et nous ont laissé le contrôle nominal, que nous avons exercé sans interruption jusqu'au drame récent. Da-Lat elle-même a été fondée en 1890, après l'expédition du docteur Yersin, comme ville thermale pour l'élite dirigeante française ; elle est depuis devenue la capitale de facto des hauts plateaux du centre, un statut que Bao-Dai lui-même a réaffirmé et promulgué dans Du-So 6/QT/TG.\n\nLa revendication nous demande donc de concéder par télégramme ce qui n'a jamais été concédé en soixante-dix ans d'administration coloniale, et de le concéder alors que le reste des hauts plateaux de Trung-Phan est sous une occupation que nous n'avons jamais reconnue. La ville est à nous. Reste à savoir jusqu'où ce gouvernement est prêt à continuer à le dire."
 DaLat_Question.2.a: "Fortifiez la ville et envoyez un télégramme à Paris !"

 DaLat_Question.3.t: "Drame sur Da-Lat"
 DaLat_Question.3.d: "Le ministère des Affaires étrangères dispose de deux télégrammes sur le même bureau. L'un vient de l'empereur Nam-Hung du Vietnam et l'autre du président Léon Pignon des Montagnards, et tous deux concernent Da-Lat.\n\nLa faute est la nôtre. Lorsque nous avons tracé les limites modernes des hauts plateaux du centre, nous avons permis à Da-Lat d'être fondée en tant que ville thermale pour notre propre élite dirigeante et nous n'avons jamais pris la peine de définir son statut. Depuis, elle a fonctionné comme un condominium de mauvaise humeur entre l'ancienne haute résidence d'Annam et le protectorat de Nguyen. L'arrangement dura aussi longtemps qu'aucune des parties n'eut autre chose à faire.\n\nLes deux l'ont désormais fait. Des escarmouches et une militarisation ont été signalées à travers le plateau, et nous ne sommes pas en état de mener une seconde querelle derrière la première. Le ministère propose la solution la moins digne et très probablement la seule viable : acheter la ville au gouvernement de Nam-Hung pour quatre cents millions de francs, la transférer à Pignon et payer le calme."
 DaLat_Question.3.a: "Espérons que cela puisse désamorcer la situation..."

 DaLat_Question.4.t: "La France propose un accord"
 DaLat_Question.4.d: "Le ministère des Affaires étrangères dispose d'un télégramme du ministère des Outre-mer. Paris offre quatre cents millions de francs pour Da-Lat, et en plus des armes modernes pour notre guerre.\n\nL'Empereur n'y prit pas une heure. Il a rejeté l'offre sur place, et le Parlement, qui avait siégé tranquillement jusqu'à ce que le texte soit lu à haute voix, s'est dissous dans un tumulte qui a mis vingt minutes au Président pour se calmer. Personne à la Chambre n'a plaidé en faveur de l'acceptation.\n\nLa réponse partit l'après-midi même, rédigée à la hâte et envoyée sans révision. Il remercie la République pour sa considération et expose sa position dans les propres mots de l'Empereur : \"notre patrie est comme nos tripes et notre chair, nous préférons donc mourir plutôt que de vendre des pièces de notre espèce !\" Cette phrase est déjà dans les journaux de Phu-Xuan et le sera demain dans les journaux de Saigon."
 DaLat_Question.4.a: "Les représailles ne signifient qu'une victoire communiste !"
 DaLat_Question.4.b: "Peut-être pouvons-nous contourner Cuong-De, nous avons vraiment besoin de fournitures..."

 DaLat_Question.5.t: "Phu-Xuan décline notre offre"
 DaLat_Question.5.d: "Phu-Xuan a répondu à Da-Lat, et le ministère préférerait que la réponse soit venue par valise diplomatique plutôt que par télégramme ouvert.\n\nIl a été rédigé dans la colère et envoyé sans que personne n'y pense mieux. Quatre cents millions de francs et un lot d'armes modernes sont refusés sur une seule ligne : « Notre patrie est comme nos tripes et notre chair, nous préférons donc mourir plutôt que de vendre des pièces de notre espèce ! - et le reste s'adresse à nos motivations plutôt qu'à nos conditions.\n\nLe passage final est celui qui mérite d'être noté. Si la France ne peut pas soutenir le régime qu'elle a installé, écrit l'Empereur, et propose à la place de le dépecer, alors la France organise simplement une victoire du Viet Minh par tranches. C'est offensant, c'était censé l'être, et personne dans ce bâtiment n'a encore apporté de réponse."
 DaLat_Question.5.a: "Rediriger l'argent et les aides vers Pignon. Conseillez-lui de ne pas poursuivre cette affaire !"

 DaLat_Question.6.t: "Un résultat décevant"
 DaLat_Question.6.d: "Le ministère de l'Outre-mer a répondu à notre demande pour Da-Lat, et la réponse est un refus enveloppé dans un cadeau.\n\nCuong-De, nous dit-on, a menacé de nous envahir sur cette question. Paris n'est pas prêt à déstabiliser un allié en Indochine pendant que le Viet Minh risque d'hériter de ce qui tombera, et nous conseille dans le langage le plus clair qu'un gouvernement ami puisse utiliser pour laisser tomber l'affaire.\n\nEn guise de consolation, arrivent demain quatre cent cinquante millions de francs et un lot d'armes modernes, décrit comme un cadeau complémentaire marquant notre récente indépendance et notre appartenance à la Communauté française. Nous sommes payés pour ne pas faire valoir une réclamation que Paris lui-même a reconnue par écrit, et l'argent arrive si rapidement qu'il a été clairement autorisé avant la rédaction du refus."
 DaLat_Question.6.a: "Nous n'oublierons jamais cette trahison !"

 DaLat_Question.7.t: "Le retour de Dalat"
 DaLat_Question.7.d: "Le ministère des Outre-mer l'a confirmé. Le gouvernement de Cuong-De s'est retiré et a signé l'instrument nous transférant Da-Lat. La ville nous appartient de droit et le sera de fait d'ici une semaine.\n\nLe reste du télégramme gâche la fête. Paris nous conseille - et la formulation n'est pas la formulation d'un conseil - de commencer immédiatement à rétablir nos relations avec Phu-Xuan, car la France ne peut plus rien faire pour nous ici sans provoquer des représailles qui mettraient fin à ce pays avant qu'il n'ait réellement commencé.\n\nCet avertissement s'ajoute à des informations que nous n'avons pas pu confirmer : les formations de Cuong-De se déplacent et les travaux remontent le long de la frontière. Nous avons gagné la ville. Que nous ayons gagné autre chose sera établi à la frontière plutôt que dans les archives."
 DaLat_Question.7.a: "Espérons que ce ne soit pas une victoire à la Pyrrhus..."

 # Da-Lat Question

 # -- News Events --

 Autonomous_FUL_Republic.0.t: "[GetNewspaperHeader]Les Montagnards déclarent leur indépendance"
 Autonomous_FUL_Republic.0.d: "Ban-Me-Thuot, [?global.date.GetDateStringNoHourLong] - Les peuples des hauts plateaux connus collectivement sous le nom de montagnards ont proclamé un gouvernement intérimaire et se sont déclarés indépendants des deux États vietnamiens. La cérémonie a eu lieu dans cette ville et a été diffusée dans toute l'Indochine, et la déclaration a été lue par Léon Pignon, l'ancien haut-commissaire d'Indochine, qui a plaidé en faveur de l'autodétermination des hauts plateaux bien avant qu'il n'y ait une quelconque base électorale à Paris.\n\nPignon parla pendant près d'une heure. Il a présenté le nouveau gouvernement comme une défense de l'intégrité culturelle et de l'avenir des peuples montagnards contre ce qu'il appelle une colonisation vietnamienne agressive du plateau, et comme un moyen d'empêcher la guerre dans les deltas de se propager aux hauts plateaux. Il a terminé par un appel aux puissances mondiales pour qu'elles soient reconnues et aidées à maintenir une paix qu'il a qualifiée de fragile.\n\nAucun gouvernement n'a encore répondu. Saigon a refusé de commenter, ce qui est une sorte de réponse : le plateau abrite les plantations d'hévéas, les routes allant à l'est de la frontière laotienne et le terrain sur lequel toute campagne pour les provinces centrales devrait se dérouler."
 Autonomous_FUL_Republic.0.a: "Félicitations pour votre indépendance ?"

 # -- Cuong-De Recruit Events --
 VIE_CD_Recruit.1.t: "Recrutement du lieutenant-général Phan-Van-Giao"
 VIE_CD_Recruit.1.d: "Le lieutenant-général Phan-Van-Giao est Premier ministre de Trung-Phan et fonde le Viet-Binh-Doan qu'il commande toujours. Il a le patriotisme et l'expérience militaire dont cette entreprise a besoin, et s'il peut être amené, il amènera avec lui la Garde nationale.\n\nIl est aussi, à première vue, l'homme le moins susceptible de venir au Vietnam. Giao était l'un des loyalistes les plus fanatiques de Bao-Dai et a contribué à l'élaboration de la solution Bao-Dai elle-même en 1948, et il y a consacré chaque année depuis la construction du régime et de son armée.\n\nC'est précisément pourquoi il vaut la peine de l'approcher maintenant. Le factionnalisme et son propre patriotisme gênant l'ont poussé aux limites du cercle qu'il a contribué à créer, et il y a une proposition à Saigon pour le remplacer purement et simplement par Nguyen-Van-Hinh et les officiers pro-français qui l'entourent. Un homme sur le point d'être rejeté par l'arrangement qu'il a construit est un homme qui lira au moins la lettre."
 VIE_CD_Recruit.1.a: "Envoyez-lui une lettre, une promesse de promotion et une reconnaissance pour ses efforts."
 VIE_CD_Recruit.1.b: "Envoyez-lui simplement une lettre."

 VIE_CD_Recruit.2.t: "Le général Giao a accepté notre invitation"
 VIE_CD_Recruit.2.d: "Excellente nouvelle, grâce à notre persuasion et à la justesse de notre cause, le général Giao a accepté l'invitation et s'est engagé à soutenir nos causes en préparant des détachements de ses forces loyalistes Viet-Binh Doan pour notre prochain coup d'État !"
 VIE_CD_Recruit.2.a: "Super!"

 VIE_CD_Recruit.3.t: "Le général Giao a rejeté notre invitation"
 VIE_CD_Recruit.3.d: "Malheureusement, malgré notre persuasion et la justesse de notre cause, le général Giao a ri de l'invitation et a déclaré que notre « cause » était naïve et ne contribuerait qu'à accroître l'instabilité dans notre pays, il a même déclaré que des détachements de ses forces loyalistes Viet-Binh étaient prêts à lutter contre notre prochain « coup d'État » !"
 VIE_CD_Recruit.3.a: "Vous n'êtes rien sans nous !"

 VIE_CD_Recruit.4.t: "Recrutement du général de brigade Nguyen-Van-Xuan"
 VIE_CD_Recruit.4.d: "Le général de brigade Nguyen-Van-Xuan est Premier ministre de Cochinchine et a fondé le Nam-Ky Ve-Binh qu'il commande toujours. Il possède à la fois le patriotisme et le passé militaire qu'exige cette entreprise, et Nam-Phan s'attache à lui.\n\nSon histoire est l'argument pour l'approcher. Xuan s'est opposé dès le début à la solution Bao-Dai, c'est pourquoi les Français l'ont choisi pour diriger leur République cochinchine autoproclamée. Il a beaucoup modernisé Nam-Phan depuis, et il n'a absolument réussi ni à maîtriser ni le Viet Minh ni les armées sectaires, et il connaît ces deux faits mieux que nous.\n\nCe qui le rend précieux, c'est ce qui le rend difficile. Xuan est un loyaliste français de bout en bout - donc le faire venir ferait plus que n'importe quel argument de notre part pour persuader Paris que Cuong-De est le leader légitime du Vietnam, et cela nous donnerait par-dessus le marché un Nam-Phan pacifié."
 VIE_CD_Recruit.4.a: "Envoyez-lui une lettre et reconnaissez son autorité à Nam-Phan."
 VIE_CD_Recruit.4.b: "Envoyez-lui simplement une lettre."

 VIE_CD_Recruit.5.t: "Le général Xuan a accepté notre invitation"
 VIE_CD_Recruit.5.d: "Excellente nouvelle, grâce à notre persuasion et à la justesse de notre cause, le général Xuan a accepté l'invitation et s'est engagé à soutenir nos causes en sécurisant la région de Nam-phan sous le contrôle des forces de notre chef Cuong-De après le coup d'État."
 VIE_CD_Recruit.5.a: "Super!"

 VIE_CD_Recruit.6.t: "Le général Xuan a rejeté notre invitation"
 VIE_CD_Recruit.6.d: "Malheureusement, malgré notre persuasion et la justesse de notre cause, le brigadier Xuan a rejeté l'invitation et a déclaré qu'il soumettrait l'autorité de la Cochinchine à Bao-Dai et aux Français plutôt qu'à un collaborateur de l'IJA"
 VIE_CD_Recruit.6.a: "Décevant."

 VIE_CD_Recruit.7.t: "Recrutement du Major Le-Van-Ty"
 VIE_CD_Recruit.7.d: "Le major Le-Van-Ty commande le Ve-Binh Nam-Ky. Il a combattu en Europe et à nouveau en Indochine au cours de la dernière guerre, ce qui constitue un record que presque aucun autre officier vietnamien de son âge ne peut produire, et c'est la raison pour laquelle il vaut la peine de l'avoir.\n\nTy est l'homme montant du jeune Viet-Binh-Doan de Bao-Dai et est respecté bien au-delà, y compris les officiers français. Il a passé ces dernières années à aider Nguyen-Van-Xuan et Bao-Dai à construire leurs armées, et il l'a fait avec compétence et sans se plaindre.\n\nCe qu'on ne sait pas, c'est ce qu'il veut. Ty n'a jamais pris de position politique, ne s'est jamais attaché à une faction et, de toute évidence, considère l'ensemble de l'affaire avec l'indifférence d'un professionnel. Cela fait de lui l'approche la plus sûre de notre liste et la moins prévisible : un homme qui a refusé toutes les autres parties peut tout simplement refuser la nôtre également."
 VIE_CD_Recruit.7.a: "Envoyez-lui une lettre, une promesse de promotion et une reconnaissance pour sa carrière militaire."
 VIE_CD_Recruit.7.b: "Envoyez-lui simplement une lettre."

 VIE_CD_Recruit.8.t: "Le colonel Ty a accepté notre invitation"
 VIE_CD_Recruit.8.d: "Excellente nouvelle, grâce à notre persuasion et à la justesse de notre cause, le colonel Ty a accepté l'invitation et s'est engagé à soutenir nos causes en garantissant la loyauté de ses forces et le professionnalisme de notre future armée."
 VIE_CD_Recruit.8.a: "Super!"

 VIE_CD_Recruit.9.t: "Le colonel Ty a rejeté notre invitation"
 VIE_CD_Recruit.9.d: "Malheureusement, malgré notre persuasion et la justesse de notre cause, le colonel Ty a rejeté l'invitation et a déclaré qu'il n'était qu'un soldat et qu'il ne se préoccupait que des affaires militaires plutôt que de la politique ou des changements de régime."
 VIE_CD_Recruit.9.a: "Décevant."

 # -- Cuong-De Hung PM Events --
 CD_Hung.1.t: "Taipei répond au Premier ministre Hung"
 CD_Hung.1.d: "Le Premier ministre Hung est revenu de Taipei avec ses objectifs. La République de Chine enverra une mission militaire, et elle enverra bien plus que des conseillers : un centre de munitions sera aménagé aux frais de la Chine, pour fournir à notre armée des armes légères et des munitions provenant de modèles et de stocks chinois.\n\nL'instrument formel est une association de coopération anticommuniste, présidée de notre côté par le Premier ministre et composée de personnel provenant des deux ministères des Affaires étrangères. En pratique, elle place des officiers nationalistes chinois dans nos établissements de formation et des fusils chinois dans nos dépôts, sans rien demander à Paris non plus.\n\nL'attrait de leur côté est assez facile à énoncer. Ils ont perdu un continent face à ce même ennemi et n'ont pas cessé de croire qu'ils reviendraient le récupérer, et un Vietnam qui combat et tient est le premier argument qu'ils ont eu en trois ans. Le nôtre est encore plus simple. Il s'agit de la seule assistance militaire disponible partout en Asie qui arrive sans la signature française."
 CD_Hung.1.a: "Nous lutterons ensemble contre le communisme !"

 CD_Hung.2.t: "Le Front uni anticommuniste"
 CD_Hung.2.d: "Le Front uni anticommuniste a été constitué et le Premier ministre le préside lui-même. Elle rassemble les partis nationalistes, les directions sectaires, les associations d'anciens combattants et le gouvernement en un seul organe permanent avec un seul objet déclaré, et la déclaration a été rédigée précisément de manière à ce qu'aucun homme ne puisse la signer et rester ensuite ambiguë.\n\nC'était le but de l'exercice. La politique vietnamienne repose depuis des années sur des hommes qui dénoncent le communisme à Saigon tout en gardant un canal ouvert aux maquis contre un changement de vent. Le Front ferme la chaîne. Ses membres sont une liste publiée, et cette liste sera lue à Hanoï avec autant d'attention qu'elle l'est ici.\n\nLa réponse est déjà venue. Le Viet Minh a nommé individuellement les signataires dans ses émissions et s'est engagé à les traiter en conséquence. Le Premier ministre Hung a vu les transcriptions et a déclaré à la Chambre que c'était simplement le prix à payer pour savoir qui sont ses amis."
 CD_Hung.2.a: "Nous lutterons ensemble contre le communisme !"

 CD_Hung.3.t: "Moderniser les tactiques de guerre"
 CD_Hung.3.d: "Dans le cadre d'un développement militaire important, le gouvernement vietnamien a annoncé la modernisation de ses tactiques de guerre. La modernisation servira à aider le gouvernement vietnamien à se défendre contre les révoltes montagnardes locales et les incursions du Viet-Minh. La modernisation comprendra l'utilisation de nouvelles armes et équipements, ainsi que la formation de nouvelles troupes."
 CD_Hung.3.a: "Nous moderniserons nos tactiques de guerre pour aider le gouvernement vietnamien à se défendre."

 CD_Hung.4.t: "Nettoyer la gauche"
 CD_Hung.4.d: "Le Premier ministre a ordonné que la campagne soit portée à un niveau supérieur, et elle a été menée à deux endroits à la fois.\n\nAu sein du gouvernement, le balayage est administratif. Les fonctionnaires appartenant aux mauvaises associations sont mis à la retraite, mutés ou arrêtés selon l'épaisseur du dossier les concernant, et les ministères les plus touchés sont ceux du Travail, de l'Éducation et de l'Information, où les hommes de cette conviction ont toujours trouvé du travail. Cela se fait rapidement et sans trop se soucier de la qualité des preuves.\n\nEn dehors, la campagne est militaire. Vingt mille hommes et beaucoup d'argent ont été engagés dans des opérations contre les cellules du Viet Minh et les bandes montagnardes dans les districts contestés, et ces districts sont désormais clairs : l'administration est revenue, les rôles d'imposition sont en train d'être réécrits et les provinces sont à nous, de fait comme sur la carte. La gauche sera plus calme pour tout cela. Quant à savoir si elle sera plus petite, c'est une autre question, et la réponse viendra des villages que nous venons d'occuper."
 CD_Hung.4.a: "Mieux vaut un bureau vide qu'un bureau douteux"

 # -- Cuong-De Diem PM Events --
 NH_DIEMa.2.t: "La politique révolutionnaire personnaliste du travailliste du président Ngo-Dinh-Diem dévoilée"
 NH_DIEMa.2.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le Président a présenté la première des mesures travaillistes personnalistes de la Révolution Sociale. Il y en a deux et ils sont destinés à être lus ensemble.\n\nLa Guerre contre les Quatre Péchés ouvre une campagne contre la boisson, le jeu, la prostitution et l'opium. Le gouvernement le présente comme une oeuvre de fondement moral plutôt que comme une oeuvre de maintien de l'ordre, et ses partisans soutiennent qu'un peuple invité à faire des sacrifices pour une révolution doit d'abord recevoir de quoi devenir sobre. Ses opposants observent que les quatre vices sont actuellement autorisés, taxés et, dans certains cas, confiés à des hommes dotés d'armées privées.\n\nLe programme de protection sociale du peuple constitue l'autre moitié de l'argument : une expansion des services sociaux, de la médecine et de l'école, sur le principe que ceux-ci sont dus au citoyen plutôt que de lui être vendus. À elles deux, les deux mesures reviennent à affirmer que ce gouvernement a l'intention de s'immiscer dans la vie ordinaire plus profondément que n'importe quelle autre administration vietnamienne. Cette affirmation sera testée dans les villages où aucun des deux programmes n'est encore arrivé."
 NH_DIEMa.2.a: "Nous sommes les libérateurs du peuple Can-Lao"

 NH_DIEMa.3.t: "Création du Parti révolutionnaire de Cong-Nong"
 NH_DIEMa.3.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Dans un développement politique significatif, les camarades de Ngo-Dinh-Diem, les éléments patriotiques des associations de l'empereur Nam-hung et les syndicats syndicalistes sont officiellement entrés dans l'arène politique, formant le Parti révolutionnaire de Cong-Nong. Les premiers participants incluent Huynh-Huu-Nghia, Ngo-Dinh-Can, Tran-Trung-Dung, Tran-Chanh-Thanh et Nguyen-Dinh-Thuan.\n\nLe Parti révolutionnaire de Cong-Nong servira d'appareil central aux côtés du Front populaire national (Mat-Tran Quoc-Dan), reflétant la structure d'un Parti communiste d'avant-garde. Dédié à la libération totale du peuple, le parti vise à protéger la dignité humaine, à combattre l'avidité matérialiste et à défendre les principes révolutionnaires travaillistes personnalistes défendus par Ngo Tong-thong et Ngo-Dinh-Nhu.\n\nLe parti a obtenu le soutien de diverses organisations, dont le Mouvement du peuple uni et l'Association des anciens combattants pour le salut national. Cette coalition cherche à mobiliser un large soutien en faveur de la vision travailliste personnaliste de Diem d'un Vietnam socialement juste, économiquement autosuffisant et spirituellement enrichi."
 NH_DIEMa.3.a: "Nhan-Vi, Cong-dong, Dong-tien !"

 NH_DIEMa.4.t: "Le président réforme le Front populaire national"
 NH_DIEMa.4.d: "Le Front populaire national (Mat-tran Dan-quoc Quoc-Gia) a été reconstitué par déclaration présidentielle. Le Front était l'instrument de l'Empereur - l'organisme à travers lequel Nam-Hung propageait le modèle Dan-Vuong, et par lequel une douzaine de mouvements qui n'étaient d'accord sur rien d'autre étaient réunis dans une seule salle. Le président Ngo-Dinh-Diem ne l'a pas aboli. Il l'a repris.\n\nLa déclaration issue de la conférence lie le Front au programme panasiatique de l'Empereur et, parallèlement, au personnalisme travailliste. Tout ce qui était dans le Front y reste : le Front de Résistance Nationale et la Jeunesse Nationale du Cao-Dai, le parti Hoa-Hao Dan-Xa, la Jeunesse Républicaine, le Syndicat de Solidarité des Femmes, le Parti Révolutionnaire de Cong-Nong, le Groupe Spirituel, les syndicats de fonctionnaires et de journalistes, les Bouddhistes de la Terre Pure, la Société Catholique, la Confédération Générale du Travail, le Mouvement Union Populaire, le Groupe des Citoyens, les Anciens Combattants de la Résistance, le Viet-Nam Quoc-Dan Dang, Mat-Tran Quoc-Dan et Quang-Phuc Hoi.\n\nUne liste de membres aussi longue est une affirmation sur la nation plutôt qu'une description d'une organisation, et les organismes qui y figurent en sont parfaitement conscients. Ce que la réforme donne au gouvernement, c'est une adresse unique à laquelle tous les mouvements de masse du pays peuvent être contactés. Ce que cela coûte au gouvernement, c'est que chaque querelle au sein du Front soit désormais une querelle au sein de l'État."
 NH_DIEMa.4.a: "Dan-vuong, Can-Lao !"

 NH_DIEMa.5.t: "Le président Ngo-Dinh-Diem annonce la formation du Mouvement révolutionnaire national"
 NH_DIEMa.5.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le président Ngo-Dinh-Diem a annoncé la création du Mouvement révolutionnaire national (Phong-trao Cach-mang Quoc-Gia), un organisme qui regroupe les organisations de masse alignées sur le Parti Cong-Nong. Son objectif déclaré est de propager le personnalisme travailliste et d'y imposer chaque organisation membre, contre le capitalisme matérialiste d'un côté et la réaction de l'autre.\n\nLa conférence fondatrice a publié une déclaration et une liste de membres. Sur la liste figurent le Front de Résistance Nationale et la Jeunesse Nationale du Cao-Dai, le parti Hoa-Hao Dan-Xa, la Jeunesse Républicaine, le Syndicat de Solidarité des Femmes, le Parti Révolutionnaire de Cong-Nong, le Groupe Spirituel, les syndicats de fonctionnaires et de journalistes, les Bouddhistes de la Terre Pure, la Société Catholique, la Confédération Générale du Travail, le Mouvement Union Populaire, le Groupe des Citoyens, les Anciens Combattants de la Résistance, le Viet-Nam. Quoc-Dan Dang, le Mat-Tran Quoc-Dan et le Quang-Phuc Hoi.\n\nPlusieurs de ces corps se sont battus de mémoire d'homme et plusieurs d'entre eux détiennent encore des hommes armés. Ce qui les lie ici n'est pas l'accord mais l'accès : le Mouvement est le canal par lequel les nominations, les permis et les subventions doivent désormais circuler. Il s'agit d'une forme de loyauté durable et fragile, et le gouvernement saura laquelle d'ici un an."
 NH_DIEMa.5.a: "Tôt ou tard, la révolution sociale réussira !"

 NH_DIEMa.6.t: "Le président lève une armée révolutionnaire"
 NH_DIEMa.6.d: "Le Président a annoncé la formation d'une deuxième Armée Révolutionnaire, à laquelle peu d'observateurs s'attendaient et encore moins ont été consultés. Il doit être constitué des plus petits paramilitaires révolutionnaires déjà existants - les Gardes républicaines armées, les Femmes républicaines, la Jeunesse républicaine - et sa tâche est d'appliquer la politique travailliste personnaliste dans les provinces plutôt que de tenir bon contre l'ennemi.\n\nLe commandement passe par le Parti révolutionnaire de Cong-Nong et non par l'état-major, et la structure suit l'administration plutôt que la carte. Les communes et les districts sont dirigés par un leader syndical, un député et un conseil d'orientation ; les provinces et les villes par un chef, deux députés et un conseil ; Saigon organise par quartier ; et au centre, une Union générale siège sous la direction d'un chef général et de trois dirigeants spéciaux. Un nouveau poste d'inspecteur de la jeunesse a été créé dans chaque province pour superviser la formation militaire.\n\nL'Armée nationale de construction sera dissoute à mesure que cette force se relèvera. C'est la phrase que l'armée a lue avec le plus d'attention, car elle signifie que les hommes, les armes et le budget d'une formation existante sont remis à un organisme qui dépend du Parti."
 NH_DIEMa.6.a: "A bas l'ancien, place au nouveau !"

 NH_DIEMa.7.t: "Mme Nhu lance le Syndicat de solidarité des femmes"
 NH_DIEMa.7.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Mme Tran-Le-Xuan a fondé le Syndicat de solidarité des femmes (Phu-Nu Lien-Doi), visant à libérer et à autonomiser le rôle des femmes dans le soutien à la République. L'organisation est dirigée par Mme Nhu, avec son Comité central composé principalement de femmes importantes de ministres, de généraux et d'autres origines influentes. \n\nLe leadership provincial est structuré de la même manière, les épouses des gouverneurs, des sous-gouverneurs et des fonctionnaires locaux jouant des rôles clés. Le mouvement comprend plusieurs commissions spécialisées :\nComité judiciaire\nCommission des affaires des soldats\nComité de santé\nComité d'école\nComité social\nComité paramilitaire des femmes de Thanh\n\nCes comités mènent des activités de routine et des visites mensuelles pour rendre compte de leurs progrès, renforçant l'esprit révolutionnaire du personnalisme travailliste et luttant pour l'égalité totale des sexes et le féminisme dans tout le Sud-Vietnam."
 NH_DIEMa.7.a: "Vraiment une dame dragon !"

 NH_DIEMa.8.t: "Ngo Tong-thong lance le programme Chieu-Hoi"
 NH_DIEMa.8.d: "Le président Ngo-Dinh-Diem a officiellement lancé le programme Chieu-Hoi (retour) - une initiative ambitieuse visant non seulement à vaincre le communisme, mais aussi à récupérer l'âme révolutionnaire du Vietnam de son chemin erroné.\nLes penseurs travaillistes personnalistes, en particulier Ngo-Dinh-Nhu, affirmaient que les marxistes-léninistes de Hanoï étaient des « révolutionnaires en uniforme uniquement » - des nationalistes déguisés dépendant des armes soviétiques, incapables de saisir la véritable profondeur philosophique de Marx ou la dimension spirituelle de la libération humaine.\n\nDiem a déclaré :\n\"Nous ne nous opposons pas aux communistes parce qu'ils sont révolutionnaires. Nous nous opposons à eux parce qu'ils ne sont pas assez révolutionnaires. Le personnalisme travailliste est la révolution la plus vraie et la plus élevée - à la fois de l'âme et de la société.\"\n\nDans cet esprit, le programme Chieu-Hoi n'était pas simplement un mécanisme de reddition mais une campagne de réhabilitation et d'intégration idéologique de masse. Les cadres révolutionnaires qui ont fait défection n'ont pas été punis, mais rééduqués dans une optique personnaliste, étant souvent affectés à de nouveaux rôles civiques au sein du Bureau d'action civile lui-même.\n\nNgo-Dinh-Nhu a expliqué plus en détail :\n\"Nous avons déjà des marxistes qui travaillent avec nous, de vrais. Pas des dogmatiques, ni des marionnettes de Moscou, mais des intellectuels qui croient en la justice, l'esprit et la dignité de l'homme. Le personnalisme travailliste les accueille dans une plus grande synthèse.\"\n\nLes principales caractéristiques du programme Chieu-Hoi comprenaient :\n\nCentres de réorientation révolutionnaire où d'anciens cadres du Viet Minh et communistes recevraient une formation politique et philosophique au personnalisme.\n\nDes parcours d'emploi vers le Bureau d'action civile, les coopératives agricoles et même l'administration militaire pour les anciens révolutionnaires de gauche.\n\nProjets de publication idéologiques comparant le personnalisme travailliste et le marxisme, soulignant la croyance de Diem en une révolution personnaliste."
 NH_DIEMa.8.a: "Nhan-Vi + Cong-dong = Dong-tien"

 NH_DIEMa.9.t: "Création de mouvements de jeunesse révolutionnaires"
 NH_DIEMa.9.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le Parti révolutionnaire de Cong-Nong a annoncé la création de quatre nouveaux syndicats de jeunesse, qui seront créés sous la bannière du personnalisme travailliste et devraient recruter cinquante mille personnes d'ici l'année. L'entreprise est dirigée par Tran-Chanh-Thanh, présidente du Mouvement révolutionnaire national, et Tran-Le-Xuan, présidente du Syndicat de solidarité des femmes.\n\nIl s'agit de l'Union républicaine de la jeunesse, de l'Union des jeunes femmes, de l'Union républicaine des femmes et des Gardes républicaines armées. Tous porteront le bleu révolutionnaire, que le Parti présente comme la couleur de la justice divine. L'organisation suit exactement les divisions administratives, de sorte qu'on peut s'adresser à une union de jeunesse de district ou à un syndicat municipal au même titre qu'un chef de district ou un maire.\n\nTran-Chanh-Thanh a parlé de communauté et de ferveur révolutionnaire parmi les jeunes. Le dessein qui sous-tend le discours est plus clair : un corps dans chaque district, en uniforme, choisi précisément dans la tranche d'âge dans laquelle le Viet Minh recrute, répondant au Parti plutôt qu'à la province."
 NH_DIEMa.9.a: "Saluons tous la révolution sociale ! Saluons tous la jeunesse"

 NH_DIEMa.10.t: "Ngo Tong-thong fait revivre le panasiatisme sous la direction de l'empereur Nam-Hung"
 NH_DIEMa.10.d: "Lors d'une cérémonie solennelle mais animée organisée au nouveau Hall de l'amitié orientale à Saigon, le président Ngo-Dinh-Diem a rendu hommage aux enseignements de l'empereur Nam-Hung, monarque et visionnaire pan-asiatique. Diem, invoquant l'héritage de Nam-Hung, a annoncé une nouvelle campagne idéologique et diplomatique intitulée « A-chau Dai-dong » - L'Initiative d'unité du Grand Est.\n\nDiem a proclamé :\n\"Nous, peuples de l'Est, partageons une destinée spirituelle. Comme l'a enseigné l'empereur Nam-Hung, la véritable indépendance n'est pas seulement l'affranchissement de la domination étrangère, mais aussi l'unité entre frères du même soleil et du même sol.\"\n\nCet événement a marqué la réhabilitation symbolique des idées pan-asiatiques de Nam-Hung, auparavant mises de côté pendant la domination coloniale. Le régime travailliste personnaliste de Diem cherchait désormais à positionner le Sud-Vietnam comme une avant-garde morale et spirituelle de l'unité asiatique, mêlant le personnalisme à la solidarité asiatique pour défier à la fois le matérialisme occidental et l'athéisme communiste.\n\nLes éléments clés de cette initiative comprenaient :\n\nFondation de l'Académie Nam-Hung pour la pensée orientale, dédiée à la philosophie pan-asiatique, au renouveau confucéen et au dialogue bouddhiste-catholique.\n\nPropositions pour une Ligue des nations asiatiques souveraines, promouvant le non-alignement, les échanges culturels et la coopération économique en dehors des blocs de la guerre froide.\n\nPublication de « The Concord Doctrine », un manifeste mêlant le personnalisme travailliste à l'unité pan-asiatique et à la résistance anticoloniale.\n\nDes envoyés spéciaux ont été envoyés au Japon, en Thaïlande, aux Philippines et en Inde pour explorer les valeurs communes et les synergies culturelles et politiques potentielles.\n\nCette renaissance du panasiatisme sous Diem a marqué une redéfinition audacieuse du rôle régional du Vietnam - non seulement comme rempart contre le communisme, mais comme phare spirituel de l'éveil oriental."
 NH_DIEMa.10.a: "A-chau Dai-dong !"

 NH_DIEMa.11.t: "Ngo Tong-thong a publié des décrets pour créer la base d'entraînement de Tay-ninh"
 NH_DIEMa.11.d: "Ngo Tong-thong a décrété la première base d'entraînement révolutionnaire, pour les cours \"Tu-Nghiep\", et l'a implantée à Tay-Ninh.\n\nLe choix n'est pas accidentel. Tay-Ninh est le coeur du Cao-Dai, les dirigeants de la secte y étaient fidèles à l'empereur Nam-Hung, et le président a hérité de cette loyauté plutôt que de la mériter. Placer la base dans leur province teste si l'héritage tient et le teste là où un échec pourrait encore être contenu.\n\nLes cours allient l'enseignement politique à la formation pratique, technique et militaire, et ils font progresser les cadres et les ouvriers ensemble plutôt que séparément. Ce qui sort de Tay-Ninh va aux provinces pour gérer les programmes que ce gouvernement a annoncés et ne peut pas actuellement fournir de personnel. Tout ce que le président a promis dépend de la présence d'hommes pour les mettre en oeuvre."
 NH_DIEMa.11.a: "Can-Lao, Cach-mang, Nhan-Vi !"

 DiemLR.0.t: "Kieu Cong Cung crée un commissariat à l'action civique et un bureau de réforme agraire"
 DiemLR.0.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Kieu-Cong-Cung, marxiste avant d'être personnaliste travailliste et jamais silencieux sur l'un ou l'autre, a été nommé commissaire général du nouveau Commissariat spécial à l'action civique (Dac-uy Phu Cong-Dan-Vu) et président du Bureau de la réforme agraire (Nha Cai-cach Dien-dia), tous deux relevant du Cabinet du Premier ministre.\n\nLe Commissariat regroupe les Services centraux et le Bureau de la réforme agraire. Il s'agit de travailler à travers les ministères, d'élaborer les plans et de former les cadres qui porteront la réforme dans les villages. Ses bureaux sont temporaires et ont été fournis par le ministère de la Défense jusqu'aux véhicules et aux conscrits occupant les postes de bureau, ce qui indique assez bien avec quelle rapidité la nomination a été prise et qui l'a payé.\n\nCe que Cung propose, c'est une redistribution à une échelle qu'aucun gouvernement de Saigon n'a jamais mise sur papier, argumentée dans le langage du personnalisme travailliste et s'appuyant ouvertement sur les méthodes qu'il a apprises de l'autre côté. Les propriétaires l'ont parfaitement compris. Il en va de même pour les cadres du delta, qui ont passé des années à dire aux agriculteurs qu'aucun gouvernement de Saigon ne tenterait jamais une telle chose."
 DiemLR.0.a: "Cung nous aidera à conquérir le coeur des agriculteurs ordinaires !"

 DiemLR.1.t: "Le président Ngo-Dinh-Diem annonce la nationalisation des actifs étrangers"
 DiemLR.1.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le Président a annoncé la nationalisation des domaines appartenant à des étrangers, comme première étape du premier plan quinquennal et de la réforme agraire qui le sous-tend.\n\nL'affaire repose sur les chiffres de l'enquête et ils ne sont pas contestés. Deux et demi pour cent des propriétaires fonciers détiennent quarante-cinq pour cent des terres ; Soixante-treize pour cent des petits exploitants se partagent quinze pour cent. A Bac-Lieu, quatre pour cent des propriétaires possèdent soixante-dix pour cent de la province, et soixante-douze pour cent des cultivateurs n'y possèdent rien du tout. Une grande partie des plus grands domaines appartiennent à des sociétés françaises, parmi lesquelles le Domaine Agricole de l'Ouest, et ce sont ces exploitations que le décret nomme en premier.\n\nLa terre doit devenir propriété collective et redistribuée aux Can-Lao et aux sans terre, avec une compensation évaluée et payée et les transferts enregistrés dans la loi. C'est ce dernier point qui constitue tout l'argumentation du gouvernement. Depuis six ans, le Viet Minh confisque et redistribue les terres dans les zones qu'il détient, sans compensation et sans formalités administratives, et il ne manque pas de preneurs."
 DiemLR.1.a: "Nous devons nous attaquer à ce problème au plus vite !"

 DiemLR.2.t: "Création de Sonadezi et de la première zone industrielle à Bien-Hoa"
 DiemLR.2.d: "Aujourd'hui, Ngo Tong-thong, avec la collaboration du commissaire spécial à l'action civile et du commissaire spécial à l'industrie et aux travaux publics, a collaboré et déclaré la création du syndicat Sonadezi (Société nationale du développement des zones industrielles), marquant une étape importante dans le développement industriel du Sud-Vietnam sous le personnalisme travailliste. Cet effort visait à réduire la dépendance à l'égard des produits industriels occidentaux et français et à renforcer les capacités industrielles nationales.\n\nSonadezi a servi de plaque tournante pour les conseillers techniques, les investisseurs et les fonctionnaires du ministère de l'Économie du gouvernement de Saigon, facilitant la création de zones industrielles à travers le Vietnam. La première zone industrielle a été créée à Bien-Hoa, établissant un modèle pour les futurs complexes industriels à Tay-Do (Can-Tho), Da-Nang et Cam-Ranh.\n\nLe président Diem a souligné : « Sonadezi sera le fer de lance de la révolution industrielle de notre pays, en promouvant l'autosuffisance et la croissance économique grâce à des stratégies d'industrialisation innovantes ».\n\nCette initiative a jeté les bases de l'expansion industrielle du Vietnam, démontrant l'engagement du personnalisme travailliste en faveur de l'indépendance économique et du progrès technologique."
 DiemLR.2.a: "La ky-nghénisation se passe bien !"

 DiemLR.3.t: "La deuxième phase de l'industrialisation"
 DiemLR.3.d: "Le président Ngo-Dinh-Diem a annoncé le lancement de la deuxième phase du programme d'industrialisation du Vietnam, s'appuyant sur les succès de l'initiative Sonadezi et des premières zones industrielles. Cette nouvelle phase étendra le développement industriel à d'autres régions, créant ainsi de nouvelles opportunités de croissance économique et d'emploi.\n\nLa deuxième phase comprend la création de zones industrielles à Tay-Do (Can-Tho), Da-Nang et Cam-Ranh, sur le modèle établi à Bien-Hoa. Ces zones se concentreront sur différents secteurs, de la transformation agricole à la fabrication et à la technologie, créant ainsi une base industrielle diversifiée pour le Vietnam.\n\nCette expansion représente un investissement important dans l'avenir économique du Vietnam et démontre l'engagement du gouvernement en faveur du développement industriel selon l'idéologie du personnalisme travailliste. Les nouvelles zones créeront des emplois, stimuleront les économies locales et contribueront à réduire la dépendance du Vietnam à l'égard des produits importés.\n\nLe président Diem a souligné que cette industrialisation ne concerne pas seulement la croissance économique, mais également la construction d'un Vietnam moderne, autosuffisant, capable de se démarquer au sein de la communauté internationale. \"Nous construisons non seulement des usines\", a-t-il déclaré, \"mais nous construisons les fondations d'une nation forte et indépendante\"."
 DiemLR.3.a: "L'industrialisation continue à grands pas !"

 # === Border Settlement ===

 # --- Events ---
 VIE_Border_Settlement.1.t: "Saigon revendique [VIE_border_demand_target.GetName]"
 VIE_Border_Settlement.1.d: "Une note est arrivée du ministère vietnamien des Affaires étrangères concernant [VIE_border_demand_target.GetName]. C'est courtois, c'est long et c'est totalement unilatéral. Saigon rappelle l'administration précoloniale de la province, rejette la délimitation française comme l'acte arbitraire d'une puissance depuis disparue, et nous invite à rectifier le tir en transférant la province à la souveraineté vietnamienne.\n\nLa province n'est pas grande. Ce qu'il en est, c'est le nôtre, et les hommes qui ont tracé la ligne ne peuvent pas être consultés. Si nous le cédons parce que Saigon l'a demandé fermement, on nous demandera à nouveau quelque chose d'autre, et il n'y aura plus de discussion à faire."
 VIE_Border_Settlement.1.a: "La province ne vaut pas une querelle. Laissez-les l'avoir."
 VIE_Border_Settlement.1.b: "La frontière est debout. Dites-le-leur."
 VIE_Border_Settlement.2.t: "La frontière est cédée"
 VIE_Border_Settlement.2.d: "[VIE_border_demand_owner.GetNameDefCap] a accepté de transférer [VIE_border_demand_target.GetName] à l'administration vietnamienne. Il n'y a eu ni ultimatum ni fusillade - seulement une note, quelques mois de correspondance et un gouvernement qui a décidé que la province ne valait pas la querelle.\n\nLe transfert sera présenté à Saigon comme la correction d'une erreur coloniale. Cela sera présenté dans leur capitale comme étant bien moindre que cela, et il y a des hommes au ministère des Affaires étrangères qui ne le pardonneront pas."
 VIE_Border_Settlement.2.a: "La carte est corrigée."
 VIE_Border_Settlement.3.t: "La demande est rejetée"
 VIE_Border_Settlement.3.d: "La réponse de [VIE_border_demand_owner.GetNameDefCap] est brève là où notre note était longue. La frontière a été fixée par traité, le traité est toujours en vigueur, et l'histoire interne de la province avant le protectorat est l'affaire des érudits plutôt que des diplomates. Ils refusent d'en discuter davantage.\n\nLa voie légale est fermée. Ce qui reste, c'est la pression - et la pression exercée sur une frontière risque de devenir autre chose."
 VIE_Border_Settlement.3.a: "Nous rendrons alors la frontière coûteuse pour eux."
 VIE_Border_Settlement.4.t: "Aucune réponse de [VIE_border_demand_owner.GetName]"
 VIE_Border_Settlement.4.d: "Un mois s'est écoulé et la note concernant [VIE_border_demand_target.GetName] n'a pas reçu de réponse. Il n'y a eu aucun refus, aucune contre-proposition, pas même un accusé de réception - seulement le silence particulier d'un ministère des Affaires étrangères qui a décidé que toute cette affaire disparaîtrait si on la laissait tranquille assez longtemps.\n\nIl s'agit d'un refus, livré de la manière la moins coûteuse dont ils disposent. Notre ambassadeur nous conseille d'arrêter d'attendre une lettre qui n'est pas écrite."
 VIE_Border_Settlement.4.a: "Le silence est une réponse. Traitez-le comme tel."
 VIE_Border_Settlement.10.t: "Un incident tourne mal"
 VIE_Border_Settlement.10.d: "Une patrouille a traversé plus loin que prévu et est revenue à court d'hommes et de matériel. Les postes frontières de l'autre côté étaient mieux préparés que ne le pensait notre état-major, et l'affaire a été décrite dans leur presse comme une invasion repoussée.\n\nL'armée en a tiré une leçon. Le coût de la leçon est de s'asseoir dans un ravin du mauvais côté de la ligne."
 VIE_Border_Settlement.10.a: "Une éducation coûteuse."
 VIE_Border_Settlement.11.t: "La frontière se durcit"
 VIE_Border_Settlement.11.d: "Notre campagne d'incidents a produit un effet, mais pas celui escompté. Le gouvernement d'en face a utilisé nos provocations pour justifier le renforcement des districts que nous souhaitons, et les villageois - qui il y a un an n'avaient aucune opinion sur le capital qui les imposait - ont commencé à en développer une.\n\nNos propres journaux se demandent pourquoi une question de frontière a retenu autant d'attention pour si peu de résultats."
 VIE_Border_Settlement.11.a: "La pression va dans les deux sens."
 VIE_Border_Settlement.12.t: "Les voisins en prennent note"
 VIE_Border_Settlement.12.d: "Ce que nous avons fait sur une frontière a été lu sur toutes. Les gouvernements d'Indochine ont comparé leurs notes et sont parvenus à la conclusion qu'un Vietnam qui fait pression sur un voisin est un Vietnam qui finira par faire pression sur les autres.\n\nLes invitations ont refroidi. Les ambassadeurs ont été rappelés pour des consultations. Rien n'a été dit officiellement, ce qui est en soi le message."
 VIE_Border_Settlement.12.a: "Qu'ils soient nerveux."
 VIE_Border_Settlement.13.t: "Une saison tranquille à la frontière"
 VIE_Border_Settlement.13.d: "Le rapport du commandement des frontières sur [VIE_border_incident_target.GetName] est le genre de rapport que notre école d'état-major prend comme modèle : rien de ce qu'il contient ne peut être prouvé, rien de ce contenu ne peut être nié et rien de tout cela n'est apparu dans les journaux de qui que ce soit. Les postes de douane ont dérivé. Les patrouilles sont allées là où les patrouilles n'étaient pas allées. Deux villages ont découvert qu'ils payaient des impôts au mauvais gouvernement depuis une décennie et ont été invités à envisager une alternative.\n\nIl n'y a eu aucune victime digne de ce nom ni aucune note diplomatique. Ce qu'il y a, c'est une administration provinciale aux mains de [VIE_border_incident_owner.GetAdjective] qui est un peu moins sûre d'elle-même qu'elle ne l'était il y a quinze jours."
 VIE_Border_Settlement.13.a: "Pression appliquée là où elle sera ressentie."
 VIE_Border_Settlement.20.t: "Les ambitions frontalières de Saigon"
 VIE_Border_Settlement.20.d: "Notre client à Saigon a monté un dossier de guerre contre un État voisin au sujet d'une province frontalière. Le dossier est mince, les récits d'atrocités sont recyclés et toute cette affaire dégage l'odeur indubitable d'un gouvernement à la recherche d'une victoire pour laquelle il peut organiser un défilé.\n\nNous finançons ce gouvernement pour maintenir une ligne contre le communisme en Asie, et non pour redessiner la carte de l'Indochine pour sa propre convenance. D'un autre côté, un Vietnam confiant et en expansion est un Vietnam qui ne s'effondre pas - et il existe des arguments, avancés en silence, selon lesquels nous devrions laisser tomber celui-ci."
 VIE_Border_Settlement.20.a: "Prévenez-les. Nous ne les avons pas armés pour cela."
 VIE_Border_Settlement.20.b: "Un Saigon fort nous sert. Regardez de l'autre côté."
 VIE_Border_Settlement.21.t: "La République redessine nos frontières"
 VIE_Border_Settlement.21.d: "Les frontières de l'Indochine ont été établies par les administrateurs français, par traité et par enquête, au cours de soixante années de travail patient et parfois violent. Saigon a maintenant décidé que ce travail était arbitraire et pouvait être annulé par proclamation.\n\nC'est une petite province et la France a des préoccupations plus grandes. Mais il y a quelque chose de particulièrement exaspérant à voir un État que nous avons créé démanteler le seul héritage que nous avons laissé derrière nous et avec lequel tout le monde avait accepté de vivre."
 VIE_Border_Settlement.21.a: "Déposez une protestation. Cela ne changera rien."
 VIE_Border_Settlement.30.t: "La frontière est prise"
 VIE_Border_Settlement.30.d: "Nos troupes détiennent [VIE_border_clash_target.GetName]. L'opération a duré des jours plutôt que des semaines, la garnison adverse s'est retirée plutôt que d'être encerclée et l'administration provinciale a été placée sous l'autorité vietnamienne.\n\nPersonne n'a déclaré la guerre et personne ne le fera. La province est tout simplement la nôtre désormais, et la question de savoir si elle aurait dû l'être sera menée, au cours des cinquante prochaines années, entièrement par les historiens."
 VIE_Border_Settlement.30.a: "La ligne est là où nous disons qu'elle est."
 VIE_Border_Settlement.31.t: "L'opération échoue"
 VIE_Border_Settlement.31.d: "L'opération a échoué. Nos colonnes n'ont pas atteint la capitale provinciale, les défenseurs ne se sont pas brisés et nos forces se sont repliées sur la ligne de départ sans rien faire, sauf faire d'un modeste conflit frontalier une humiliation nationale.\n\nOn demande haut et fort au gouvernement pourquoi l'armée a été envoyée et pourquoi elle n'a pas pu le faire. La province leur appartient et chacun de nos voisins vient de recalculer la valeur de nos menaces."
 VIE_Border_Settlement.31.a: "Cela sera payé à Saigon."
 VIE_Border_Settlement.32.t: "Les Vietnamiens sont rejetés"
 VIE_Border_Settlement.32.d: "Saigon a envoyé son armée à travers notre frontière et nos soldats l'ont renvoyée chez elle. La province est intacte, la position du gouvernement n'a jamais été aussi élevée et les Vietnamiens doivent expliquer au monde comment une opération punitive s'est transformée en déroute.\n\nIl y aura une autre tentative un jour. Aujourd'hui n'est pas le jour pour s'en inquiéter."
 VIE_Border_Settlement.32.a: "Nous avons tenu."
 VIE_Border_Settlement.33.t: "La province est perdue"
 VIE_Border_Settlement.33.d: "Les troupes vietnamiennes tiennent la province. Notre garnison était en infériorité numérique et dépassée, et s'est retirée plutôt que d'être détruite pour un district que l'état-major avait privé il y a des années.\n\nLe gouvernement doit maintenant expliquer au pays comment une frontière garantie par traité a été modifiée par une armée étrangère en l'espace d'une semaine, et ce qu'il compte faire à ce sujet. La réponse honnête à la deuxième question n'est rien."
 VIE_Border_Settlement.33.a: "Une humiliation à laquelle nous ne pouvons pas répondre."
 VIE_Border_Settlement.34.t: "Le choc Peters Out"
 VIE_Border_Settlement.34.d: "Les combats à la frontière ont cessé sans qu'aucun des deux camps n'obtienne quoi que ce soit. Les positions ont été reprises, les morts ont été ramassés et la province reste exactement là où elle était.\n\nLe différend n'est pas réglé. Elle a simplement été reportée."
 VIE_Border_Settlement.34.a: "Rien n'est résolu."
 VIE_Border_Settlement.35.t: "Un fait accompli à la frontière"
 VIE_Border_Settlement.35.d: "Il n'y a pas eu d'affrontement. Nos troupes sont restées à [VIE_border_clash_target.GetName] depuis la guerre, le drapeau au-dessus de la résidence n'a jamais été retiré, et la seule chose qui a changé cette semaine est que Saigon a cessé de prétendre que l'arrangement était temporaire.\n\nL'administration provinciale a été placée sous l'autorité vietnamienne et les fonctionnaires du propriétaire ont obtenu le passage à la frontière. L'armée n'a rien à faire qu'elle n'ait déjà fait.\n\nLes protestations seront bruyantes et déposées. La possession, comme le ministère l'a discrètement observé toute l'année, constitue l'intégralité de la loi ici."
 VIE_Border_Settlement.35.a: "Nous n'allions jamais partir."
 VIE_Border_Settlement.40.t: "Saigon s'oppose à nos clients"
 VIE_Border_Settlement.40.d: "La République du Vietnam a lancé une opération militaire contre [VIE_border_clash_target.GetName], détenue par nos amis du mouvement laotien. Les provinces du nord leur ont été garanties par accord, et Saigon a décidé que l'accord ne s'appliquait pas à elle.\n\nNous pouvons étendre ouvertement notre garantie et faire comprendre à Saigon ce que signifierait un pas supplémentaire vers l'ouest. Ou bien nous pouvons protester, ne rien faire et espérer que nos camarades détiendront les laissez-passer seuls."
 VIE_Border_Settlement.40.a: "Garantissez-les ouvertement. Saigon doit savoir où est la ligne."
 VIE_Border_Settlement.40.b: "Protestation, et rien de plus. Nous avons notre propre guerre à terminer."

 # === VIN Reunification 50s ===

 # --- National election preparations ---
 VIE_VIN_Reunification_50s.1.t: "Se préparer à une élection nationale"
 VIE_VIN_Reunification_50s.1.d: "Le règlement de Genève a placé la question de l'avenir du Vietnam devant l'ensemble de la nation. Ses dispositions appellent à des élections à l'échelle nationale pour déterminer un gouvernement vietnamien unique, mettant ainsi fin à la division temporaire imposée par la guerre, l'occupation et l'intervention étrangère. \n\nEn République démocratique, les préparatifs ont véritablement commencé. Les cadres rassemblent les listes électorales, les comités d'impression rédigent le matériel de campagne et les délégués du nord, du centre et du sud ont été invités à discuter de la manière dont un vote national pourrait se dérouler dans des conditions de paix. Pour Hô Chi Minh et le gouvernement, les élections ne sont pas simplement un exercice constitutionnel. Il s'agit de prouver que l'unité vietnamienne peut être réalisée par la volonté du peuple plutôt que par l'imposition d'armées étrangères. \n\nPourtant, aucune élection ne peut avoir lieu sans la coopération des autorités du sud. Hanoï peut préparer ses propres quartiers, mais la question décisive reste sans réponse : Saigon honorera-t-il la promesse de la réunification nationale ?"
 VIE_VIN_Reunification_50s.1.a: "Le scrutin doit achever la révolution."

 # --- VIE decision ---
 VIE_VIN_Reunification_50s.2.t: "La question des élections nationales"
 VIE_VIN_Reunification_50s.2.d: "Le gouvernement du Nord a commencé les préparatifs pour les élections nationales prévues par l'accord de Genève. À Saigon, la proposition a déclenché un vif débat parmi les ministres, les officiers militaires, les chefs religieux et les conseillers étrangers. \n\nLes partisans du vote soutiennent qu'une élection pourrait conférer au gouvernement du Sud une légitimité internationale, réduire le risque d'une reprise de la guerre et permettre au Vietnam de déterminer son avenir sans une autre génération d'effusion de sang. Leurs opposants préviennent que la supériorité de l'organisation du Nord et le prestige d'Hô Chi Minh transformeraient tout vote national en victoire pour Hanoï. Ils soutiennent qu'accepter les élections signifierait renoncer à l'indépendance politique du Sud avant même le début de la campagne. \n\nLe gouvernement doit décider si la promesse de réunification sera honorée ou si la ligne temporaire séparant le Vietnam se durcira pour devenir une frontière permanente."
 VIE_VIN_Reunification_50s.2.a: "Honorez l'engagement national."
 VIE_VIN_Reunification_50s.2.b: "Le Sud doit rester séparé."

 # --- Election cancellation ---
 VIE_VIN_Reunification_50s.3.t: "Les élections de réunification sont annulées"
 VIE_VIN_Reunification_50s.3.d: "La perspective d'élections nationales s'est effondrée. Les autorités du Sud ont rejeté le vote proposé, arguant que les conditions requises pour des élections libres n'existent pas et que la République démocratique ne peut pas être autorisée à étendre son système politique à l'ensemble du pays. \n\nA Hanoï, cette annonce a été accueillie comme un rejet à la fois du règlement de Genève et du principe de l'autodétermination nationale. Les journaux du parti décrivent cette décision comme le résultat d'une influence étrangère et d'une réaction intérieure, tandis que des vétérans de la résistance avertissent que le pays s'est vu refuser la réunification pacifique pour laquelle tant de personnes se sont battues. \n\nLa partition du Vietnam était censée être temporaire. Son annulation oblige désormais la République démocratique à se confronter à une question plus dure : si l'unité nationale peut encore être réalisée par la négociation, ou si une nouvelle lutte l'attend."
 VIE_VIN_Reunification_50s.3.a: "La nation n'a pas pu s'exprimer."

 # --- French channel ---
 VIE_VIN_Reunification_50s.4.t: "Un canal à travers Paris"
 VIE_VIN_Reunification_50s.4.d: "L'effondrement du processus électoral n'a pas entièrement fermé la voie à la diplomatie. Charles de Gaulle et des cercles au sein de l'establishment politique français ont indiqué que Paris pourrait être disposé à discuter d'un règlement qui préserve l'indépendance vietnamienne tout en empêchant la partition de devenir l'ouverture d'une autre guerre majeure. \n\nPour Hanoï, un tel contact comporte de nombreux risques. La France reste l'ancienne puissance coloniale et de nombreux Vietnamiens se souviennent des coûts des compromis consentis dans des conditions de faiblesse. Pourtant, une chaîne française pourrait également offrir un moyen de faire pression sur le gouvernement du Sud, de restreindre l'intervention étrangère et de rouvrir la question de la réunification avant que la division ne devienne irréversible. \n\nLe gouvernement a autorisé des pourparlers exploratoires discrets. Aucun accord n'a été trouvé, mais la diplomatie aura une chance supplémentaire de restaurer un Vietnam uni."
 VIE_VIN_Reunification_50s.4.a: "Laissons la diplomatie tester la partition."

 # --- Southern liberation preparations ---
 VIE_VIN_Reunification_50s.5.t: "Préparer la libération du Sud"
 VIE_VIN_Reunification_50s.5.d: "Alors que les élections nationales ont été annulées et que les autorités du Sud ont refusé un règlement politique, la République démocratique a commencé à réévaluer les moyens par lesquels la réunification pourrait être réalisée. Publiquement, Hanoï continue de parler de paix, d'unité nationale et des droits garantis par le règlement de Genève. En privé, les cadres reçoivent pour instruction de préserver les réseaux clandestins, de renforcer les contacts avec les vétérans de la résistance du Sud et de préparer les bases politiques d'une lutte renouvelée. \n\nLa tâche n'est pas encore une guerre ouverte. Les campagnes du sud restent fragmentées et une confrontation immédiate pourrait entraîner une intervention étrangère directe. Le gouvernement entend plutôt cultiver un mouvement organisé capable de relier les revendications locales à la demande plus large de réunification vietnamienne. \n\nPour ceux qui espéraient que le scrutin mettrait fin à la division du pays, c'est un tournant amer. Mais selon les mots de la résistance, la cause de l'unité n'a fait que changer de champ de bataille."
 VIE_VIN_Reunification_50s.5.a: "Le Sud n'a pas été oublié."

 # --- Global reunification news ---
 VIE_VIN_Reunification_50s.100.t: "[GetNewspaperHeader]Le Vietnam réunifié après les élections nationales"
 VIE_VIN_Reunification_50s.100.d: "Le Vietnam a été réunifié sous un gouvernement national unique après la réussite du processus électoral national. Le vote, organisé après des années de guerre, de partition temporaire et d'intenses pressions internationales, a mis fin aux administrations distinctes qui ont émergé de l'effondrement de la domination coloniale française. \n\nA Hanoï, Hô Chi Minh et la République Démocratique ont proclamé que le résultat confirmait la volonté du peuple vietnamien de vivre dans un seul Etat indépendant. Des délégations de l'autre côté de l'ancienne ligne de démarcation se sont rassemblées pour entamer le difficile travail d'intégration des administrations, des forces armées et des systèmes économiques longtemps façonnés par des autorités rivales et des sponsors étrangers. \n\nLa réunification du Vietnam est suivie de près dans toute l'Asie. Pour les partisans du nouveau gouvernement, il représente une victoire majeure pour l'autodétermination nationale et les mouvements anticoloniaux qui ont transformé le monde d'après-guerre. Pour ses opposants, cela marque une modification significative de l'équilibre stratégique en Asie du Sud-Est. \n\nPour le Vietnam lui-même, la promesse est plus simple et plus profonde : le pays est redevenu une seule nation."
 VIE_VIN_Reunification_50s.100.a: "Un seul Vietnam est à nouveau debout."

 # --- The American channel - Washington puts the ballot to Saigon ---
 VIE_VIN_Reunification_50s.6.t: "Washington nous demande de refuser le scrutin"
 VIE_VIN_Reunification_50s.6.d: "La mission américaine a rendu sa position, et celle-ci n'est pas subtile. Les États-Unis n'ont jamais souscrit à la clause électorale à Genève, se considèrent comme non liés par un accord qu'ils ont refusé de signer et s'attendent à ce que le gouvernement de Saigon parvienne à la même conclusion. Selon les Américains, un scrutin à l'échelle du Vietnam ne serait pas du tout un scrutin : les districts du nord sont administrés par un parti unique qui n'a jamais permis un vote contesté, et aucune supervision prévue par les accords ne pourrait changer cela. \n\nCe qui n'est pas dit est entendu assez clairement. L'argent américain, l'équipement américain et la couverture diplomatique américaine ne sont pas inconditionnels, et les hommes qui les fournissent ont clairement indiqué quelle réponse ils attendaient. \n\nÀ cela s'opposent le texte brut des accords, notre propre signature et le fait qu'un grand nombre de Vietnamiens des deux côtés de la ligne attendent toujours la tenue du vote. Refuser, c'est accepter que la ligne temporaire devienne une frontière, et accepter le nom que Hanoi lui donnera."
 VIE_VIN_Reunification_50s.6.a: "L'élection ne peut avoir lieu dans de telles conditions."
 VIE_VIN_Reunification_50s.6.b: "Nous avons signé les accords. Le vote aura lieu."

 VIE_VIN_Reunification_50s.7.t: "Washington ne fera pas obstacle"
 VIE_VIN_Reunification_50s.7.d: "La position américaine est quelque peu surprenante. Washington nous a informés qu'il ne s'opposerait pas au scrutin pan-vietnamien prévu par les accords et qu'il était prêt à voir la question du gouvernement vietnamien réglée par les urnes plutôt que reportée indéfiniment. \n\nCela supprime l'excuse, mais pas le problème. La décision repose désormais là où elle a toujours été : à Saigon. Nos ministres sont divisés : certains y voient une opportunité de contester le Nord sur le terrain politique et de remporter un mandat qu'aucune puissance étrangère ne pourrait contester ; d'autres comptent les circonscriptions, comptent l'électorat de chaque côté de la ligne et arrivent à une conclusion qu'ils trouvent intolérable. \n\nNous pouvons organiser le vote avec la bénédiction de notre patron, ou nous pouvons l'enterrer de notre propre autorité et laisser Washington l'expliquer aux coprésidents."
 VIE_VIN_Reunification_50s.7.a: "Laissez le pays voter."
 VIE_VIN_Reunification_50s.7.b: "Le scrutin meurt ici, quoi qu'en dise Washington."

 VIE_VIN_Reunification_50s.8.t: "Saigon répond sur le bulletin de vote"
 VIE_VIN_Reunification_50s.8.d_complied: "Le gouvernement de l'État du Vietnam a annoncé qu'il ne participerait pas aux élections pan-vietnamiennes prévues par le règlement de Genève, au motif que le vote libre ne peut être garanti sur le territoire administré depuis Hanoï. \n\nLa formulation est celle de Saigon ; le poste est le nôtre. Notre mission rapporte que la décision a rencontré peu de résistance au sein du gouvernement une fois que le point de vue américain a été connu, et le résultat pratique est que le scrutin n'aura pas lieu. La division du Vietnam, qualifiée à Genève de provisoire, n'a désormais aucune fin programmée. \n\nHanoï a déjà commencé à le dire haut et fort aux coprésidents."
 VIE_VIN_Reunification_50s.8.d_defied: "Saigon a refusé de suivre nos conseils. Le gouvernement a confirmé qu'il se considère lié par la clause électorale qu'il a signée et que le scrutin pan-vietnamien se déroulera selon le calendrier fixé par les accords. \n\nNotre mission n'a pas été consultée mais plutôt informée. La pression a été exercée, comprise et mise de côté - et avec la décision publique, nous ne disposons plus d'aucun moyen discret pour influencer le décompte. Quoi qu'il arrive lors des élections, cela se passera désormais selon les conditions vietnamiennes. \n\nLa question à Washington a changé du jour au lendemain, passant de la manière d'empêcher le vote à ce que nous faisons si le vote se déroule dans le mauvais sens."
 VIE_VIN_Reunification_50s.8.a: "La division tient."
 VIE_VIN_Reunification_50s.8.b: "Notre client a son propre esprit."

 VIE_VIN_Reunification_50s.9.t: "Saigon répond sur le bulletin de vote"
 VIE_VIN_Reunification_50s.9.d_proceeded: "Saigon a confirmé qu'elle contesterait les élections pan-vietnamiennes plutôt que de les entraver. Les préparatifs sont en cours dans les provinces du sud, et le gouvernement a commencé à faire campagne sérieusement plutôt que de se contenter de subir le calendrier. \n\nAprès avoir dit aux Vietnamiens que nous ne leur ferions pas obstacle, nous sommes désormais attachés au résultat - et le résultat est véritablement incertain. Nos analystes sont divisés sur le décompte, et les coprésidents surveilleront de près les modalités de supervision. \n\nQuel que soit le résultat, il sera difficile de prétendre par la suite que le vote n'était pas la volonté du peuple vietnamien."
 VIE_VIN_Reunification_50s.9.d_cancelled: "Après avoir été informé que Washington ne ferait pas obstacle au scrutin, le gouvernement de Saigon a lui-même fait obstacle au scrutin. La clause électorale a été répudiée au motif qu'aucun vote libre n'est possible au nord de la ligne - un argument que notre propre mission avait pris soin d'éviter à cette occasion. \n\nLa décision est vietnamienne et la responsabilité en est vietnamienne, ce qui est au moins diplomatiquement pratique. C'est aussi un rappel que Saigon est un gouvernement et non un instrument, et qu'il agira à l'encontre de nos préférences déclarées lorsqu'il jugera que sa survie est en jeu. \n\nHanoï ne fera pas cette distinction, et les coprésidents non plus."
 VIE_VIN_Reunification_50s.9.a: "Les Vietnamiens en décideront eux-mêmes."
 VIE_VIN_Reunification_50s.9.b: "Ils l'ont enterré sans nous."

 VIE_VIN_Reunification_50s.10.t: "Les Américains ont la main sur le bulletin de vote"
 VIE_VIN_Reunification_50s.10.d: "On ne nous l'a pas demandé. En silence, et sans aucune démarche formelle auprès de ce gouvernement, les agences américaines ont commencé à travailler dans les provinces où le scrutin devrait être serré : listes d'inscription révisées, fonctionnaires de district formés, arrangements d'impression pris en main par des hommes qui ne figurent sur aucune liste d'ambassade. \n\nL'intention est clairement d'obtenir le résultat plutôt que d'influencer le débat, et l'assistance a été accordée comme une faveur que nous ne sommes pas en mesure de refuser. S'il réussit, le vote donnera la réponse souhaitée par Saigon. S'il est découvert, le vote ne vaudra rien du tout, et notre prétention d'avoir honoré les accords non plus."
 VIE_VIN_Reunification_50s.10.a: "Ne dites rien et espérez que le comte se taise."
 VIE_VIN_Reunification_50s.10.b: "Protestation auprès de l'ambassade, ne serait-ce que pour mémoire."

 # --- Trigger tooltips ---
 USA_50s_Block_Ballot_to_Saigon_tt: "§YIl sera demandé à Saigon§! de refuser le scrutin pan-vietnamien - la décision et l'annonce leur appartiennent §Y§!"
 USA_50s_Endorse_Ballot_to_Saigon_tt: "§YOn dira à Saigon§! que nous ne nous opposons pas au scrutin pan-vietnamien - ils peuvent toujours §Rl'enterrer eux-mêmes§!"

 VIN_election_won_avail_tt: "§YLe scrutin panvietnamien a été compté et notre liste a emporté le pays§!"
 VIN_election_never_held_bypass_tt: "§RLe scrutin pan-vietnamien n'aura jamais lieu§! - l'élection a été annulée et la réunification doit être recherchée par d'autres moyens"
 VIE_PMs.9.t: "Ngo-Dinh-Diem quitte son bureau"
 VIE_PMs.9.d: "Le référendum a rendu Bao-Dai, et le Premier ministre qui a passé dix-huit mois à insister sur le fait que le trône était un obstacle au gouvernement a été démis du trône. Ngo-Dinh-Diem quitte le palais Norodom sans parti sur lequel s'appuyer et sans armée prête à marcher pour lui, et l'administration intérimaire prend le siège jusqu'à ce que [VIE.GetLeader] décide qui doit le remplir."
 VIE_PMs.9.a: "Il n'allait jamais y aller tranquillement."
 Diem.1.t: "Le général Hinh menace le gouvernement"
 Diem.1.d: "Le général Nguyen-Van-Hinh, chef d'état-major de l'Armée nationale, possède la nationalité française, une commission française et l'affection du commandement français, et il a passé la semaine à dire aux journalistes que le Vietnam a besoin d'un dirigeant fort et populaire. Ses officiers parlent ouvertement d'une marche sur le palais. Il n'a pas encore dit qu'il destituerait le premier ministre, et il n'a pas non plus pris la peine de le nier.\n\nLe premier ministre ne dispose pas de troupes propres. Ce qu'il a, c'est la mission américaine, un empereur à Cannes qui ne veut pas choisir, et le fait qu'un général qui parle aux journaux pendant trois semaines est un général qui n'a pas encore bougé.\n\nHinh peut être brisé si le palais et Washington tiennent bon. Il peut aussi être payé, et l'armée laissée là où elle a toujours été : aux mains des Français."
 Diem.1.a: "Appelez-le à Cannes et laissez-le continuer jusqu'à Paris."
 Diem.1.b: "Achetez l'homme. Nous ne pouvons pas combattre à la fois l'armée et les sectes."
 Diem.2.t: "La bataille de Saïgon"
 Diem.2.d: "Les Binh-Xuyen de Le-Van-Vien ont bombardé le palais Norodom et creusé Cholon, et le commandement français a proposé un cessez-le-feu qui les laisserait exactement là où ils se trouvent. Les envoyés de Washington sont divisés, l'empereur a télégraphié de France ordonnant au Premier ministre de se désister, et l'armée nationale attend qu'on lui dise ce qu'elle en est.\n\nLe syndicat détient la police, les casinos et l'opium, et chaque piastre découle d'une licence impériale achetée pour quarante millions. Ils ne constituent pas une faction de l'État. Ils sont la preuve qu'il n'y a pas d'État.\n\nSi les parachutistes pénètrent dans Cholon, soit le gouvernement apparaît comme la seule puissance armée à Saigon, soit il n'émerge pas du tout."
 Diem.2.a: "À Cholon. Il y aura un gouvernement dans cette ville."
 Diem.2.b: "Prenez le cessez-le-feu. Nous ne sommes pas prêts pour cela."
 Diem.42.t: "La situation des échelons et des sacs"
 Diem.42.d: "Cholon a été prise. La préfecture est aux mains de l'Armée nationale, les casinos sont fermés et le mandat du syndicat dans la capitale a pris fin après neuf ans.\n\nCe qui n'est pas terminé, c'est le syndicat. Le-Van-Vien a entraîné les bataillons survivants vers le sud-est, dans le Rung-Sac, le pays des mangroves entre la ville et la mer, où les canaux ne sont navigables qu'aux hommes qui y ont grandi et où une division peut être engloutie sans jamais trouver personne pour combattre. Ils tiennent toujours Phuoc Tuy derrière eux et sont toujours armés.\n\nLe commandement français considère l'affaire comme close et préférerait que cela reste ainsi. Des gens qui ont lu les mêmes cartes disent au premier ministre qu'une force qui survit dans les marais est une force qui en sort."
 Diem.42.a: "Puis nous allons dans le marais après eux."
 Diem.3.t: "Le Comité National Révolutionnaire"
 Diem.3.d: "Quelque dix-huit organisations se sont réunies à Saigon sous le nom de Comité national révolutionnaire. Personne ne les a élus, plusieurs d'entre eux ont été réunis la semaine dernière, et un ou deux existent essentiellement sur papier à en-tête. Ce qu'ils ont, c'est une salle, un grand nombre de délégués et une résolution.\n\nLa résolution exige la destitution de Bao-Dai, la dissolution du gouvernement impérial et les pleins pouvoirs pour le premier ministre. Il appelle, au nom de la révolution, à demander directement au peuple lequel des deux hommes doit le diriger.\n\nUn premier ministre ne peut pas destituer son propre chef d'État. Un comité national, parlant au nom de la révolution, peut demander un référendum - et le Premier ministre peut être persuadé de l'autoriser."
 Diem.3.a: "Laissons la parole au Comité. Le trône a eu sa réponse."
 Diem.3.b: "Gardez-le consultatif. Il n'est pas nécessaire d'humilier l'empereur."
 Diem.4.t: "98,2 Pour cent"
 Diem.4.d: "Le décompte est tombé et il est absurde. Ngo-Dinh-Diem est crédité de 98,2 pour cent et Saigon, qui a enregistré quelque quatre cent cinquante mille électeurs, lui a rendu six cent cinq mille bulletins de vote. Les ouvriers de Ngo-Dinh-Nhu étaient minutieux, et là où ils ne l'étaient pas, les bulletins de vote eux-mêmes faisaient le travail - le bulletin du Premier ministre imprimé en rouge pour la bonne fortune, celui de l'empereur en vert pour la couleur du cocu.\n\nPersonne à Saigon ne croit à ce chiffre et cela ne semble pas avoir d'importance. L'armée est restée dans les casernes, les sectes sont brisées ou achetées, le Comité a son mandat et le palais de Cannes n'a émis aucun ordre auquel personne n'entende obéir.\n\nBao-Dai est déposé. Le Comité national de la révolution prend le gouvernement jusqu'à ce que la forme du nouvel État soit fixée."
 Diem.4.a: "Les gens ont parlé, un peu plus fort qu'on ne leur avait demandé de le faire."
 Diem.5.t: "Un verdict auquel personne ne croit"
 Diem.5.d: "Le premier ministre a sa majorité, et cela lui a coûté ce que valait le mot référendum. Le décompte était trop grossier pour être défendu et trop étroit pour être célébré : des quartiers entiers n'étaient tout simplement pas ouverts, des quartiers monarchistes étaient fermés par des hommes armés de gourdins, et les décomptes du delta arrivaient après que le résultat ait déjà été annoncé.\n\nBao-Dai est tout de même déposé. Mais la presse loyaliste n'a pas été réduite au silence, le pays sectaire de l'ouest n'est pas réconcilié et les officiers qui ont obéi au gouvernement ce mois-ci se demandent tranquillement à quoi ils ont obéi.\n\nLe Comité National de la Révolution prend le gouvernement. Il faudra plus de temps que prévu pour en faire une république."
 Diem.5.a: "Nous avons gagné. Que personne n'examine comment."
 Diem.6.t: "Le trône tient"
 Diem.6.d: "Le référendum a été organisé contre un empereur qui n'était pas dans le pays et il l'a renvoyé. Le Premier ministre n'avait aucun parti pour faire campagne pour lui, aucune armée suffisamment sûre pour fermer les bureaux de vote, et aucune réponse pour le pays sectaire de l'ouest, qui votait comme ses seigneurs de guerre. La résolution du Comité s'est avérée parler au nom de la salle dans laquelle elle a été lue et très peu au-delà.\n\nBao-Dai reste chef de l'Etat et a destitué celui qui avait tenté de le destituer. Ngo-Dinh-Diem n'a ni faction, ni commandement, ni bureau, et les Américains qui l'ont soutenu se demandent déjà à qui revient la faute.\n\nL'État du Vietnam continue, avec un trône, un gouvernement intérimaire, et sans plus d'idée qu'avant de ce qu'il entend être."
 Diem.6.a: "L'empereur garde donc son pays après tout."

# === Diem premiership additions ===
 Diem.20.t: "J'ai seulement besoin de décrocher le téléphone"
 Diem.20.d: "Le général Nguyen-Van-Hinh a prononcé cette sentence devant un correspondant français lors d'un déjeuner et n'a pas pris la peine de la retirer depuis. \"Il me suffit de décrocher le téléphone\", dit-il, \"pour me débarrasser de Diem\". Il a été imprimé à Paris et lu à haute voix dans tous les mess de Saigon.\n\nIl a été envoyé à l'étranger pour une mission de six mois afin d'étudier la réforme de l'armée nationale. Il n'est pas parti. Il reçut alors l'ordre de quitter le pays dans les vingt-quatre heures et n'y revint pas non plus ; au lieu de cela, il a télégraphié directement au chef de l'État et a demandé une intervention, et des voitures blindées sont apparues aux portes du Palais de l'Indépendance le même après-midi.\n\nLe gouvernement l'a déclaré rebelle et ne peut absolument rien y faire. Ce n'est pas un décret qui décide, mais plutôt la capacité du Premier ministre à accumuler une base suffisante - des réfugiés, de l'argent, un parti, des gardes américains - pour que cet appel téléphonique ne vaille pas la peine d'être passé. Il n'attendra pas indéfiniment."
 Diem.20.a: "Alors donnons-lui une raison de poser le téléphone."
 Diem.21.t: "Le Cabinet se retire"
 Diem.21.d: "Quinze des dix-huit ministres ont démissionné ensemble ce matin, après s'être mis d'accord sur le texte entre eux la veille. Ils citent la paralysie du gouvernement, ce qui est vrai, et leur propre incapacité à servir dans les conditions actuelles, ce qui est également vrai et bien plus pertinent.\n\nCertains d'entre eux appartenaient à Hinh depuis le début. La plupart comptaient simplement et sont parvenus à un chiffre qui ne leur plaît pas. Un ministre qui démissionne avant le coup d'État fait carrière après ; un ministre qui démissionne après que ce ne soit pas le cas.\n\nIl ne reste qu'un premier ministre, son frère et un immeuble. Les ministères continuent d'ouvrir le matin parce que les commis sont plus fidèles que les ministres, mais rien ne s'y décide."
 Diem.21.a: "Laissez-les partir. Nous découvrirons qui reste."
 Diem.22.t: "Le téléphone ne répond pas"
 Diem.22.d: "Le général Hinh préparait son coup d'État. Les blindés étaient ravitaillés, les nominations du personnel étaient rédigées et la date avait été fixée à deux reprises. Cela ne s'est pas produit, et les raisons sont presque ridiculement petites : les Américains ne diraient pas oui, les Français ne diraient pas non, et un plan qui oblige les deux à agir en même temps exige qu'ils soient tous deux attentifs.\n\nAu moment où ce moment était passé, il était définitivement passé. Les officiers qui lui avaient promis leurs bataillons commencèrent à se rappeler qu'ils l'avaient promis sous conditions. Le chef de l'État, qui l'avait encouragé en privé, a refusé de l'encourager publiquement.\n\nIl a démissionné de l'état-major et a pris un avion pour Paris, où il bénéficie de la citoyenneté et d'une pension. L'Armée nationale reçoit désormais ses ordres du bureau du Premier ministre, ce qui n'est pas la même chose que la loyauté, mais c'est de cela qu'est constitué un gouvernement."
 Diem.22.a: "L'armée a un gouvernement. Aujourd'hui, le gouvernement a besoin d'un pays."
 Diem.23.t: "Les mouvements d'armure"
 Diem.23.d: "Cela s'est produit à quatre heures du matin et cela a duré quatre-vingt-dix minutes. La garde du palais n'a pas tiré ; il y avait très peu de choses sur lesquelles tirer, et personne ne leur avait dit contre quoi ils se protégeaient.\n\nLe Premier ministre était prévenu depuis quatre mois et les avait passés à rédiger des décrets. Il n'avait aucun parti à appeler, aucun régiment à lui et aucun allié à Saigon qui n'attendait de voir dans quelle direction les choses allaient se dérouler. On a dit aux Américains qu'il s'agissait d'une question interne. On n'a rien dit à Paris, et ce n'était pas nécessaire.\n\nLe général Nguyen-Van-Hinh est chef d'État, président du Conseil et tout ce qu'il souhaite avant le déjeuner. Les conseillers français sont de retour dans les bureaux attenants, et ils y resteront."
 Diem.23.a: "Il ne s'agissait donc que d'un appel téléphonique."
 Diem.24.t: "Le détail de Manille"
 Diem.24.d: "Le colonel Lansdale s'est envolé pour Manille et a posé la question directement au président Magsaysay, sur la base de la théorie raisonnable selon laquelle un homme qui avait vaincu sa propre insurrection comprendrait un premier ministre qui ne pouvait pas quitter son propre palais.\n\nQuatre officiers sont revenus avec lui sous les ordres du Colonel Napoléon Valeriano, et ils ont emménagé dans l'ancienne résidence du Haut-Commissaire avec le 2ème Bataillon de la Garde Royale. Il a été demandé au colonel Nguyen-Van-Vy de leur trouver des soldats vietnamiens de grande taille, entraînés au combat à mains nues et d'origine absolument claire ; la dernière condition s'est révélée la plus difficile.\n\nIl en est résulté trois compagnies de gardes, un escadron blindé, un bataillon d'artillerie lourde et un peloton de transmissions, tous responsables devant le Premier ministre et devant personne d'autre dans l'armée nationale. Les véhicules blindés du général sont toujours devant les portes. Ils ont maintenant quelque chose à regarder."
 Diem.24.a: "Que le général compte les canons des deux côtés."
 Diem.30.t: "Un télégramme de Cannes"
 Diem.30.d: "Le chef de l'État a limogé le Premier ministre. Le texte est arrivé de Paris ce matin, cinq jours avant le scrutin, et il n'est pas ambigu : le recours aux mesures d'État policier et à la dictature personnelle doit cesser, et il ne peut pas continuer à remettre son nom et son autorité entre les mains d'un homme qui mènera le pays à la ruine, à la famine et à la guerre.\n\nC'est tout à fait légal. Il a nommé le Premier ministre et il peut le dénommer, et aucun tribunal à Saigon ne dirait le contraire si on lui demandait. Il a également ajouté, à tous ceux qui l'écouteront à Cannes, qu'il peut leur dire à l'avance le nombre de voix que M. Diem a décidé de remporter.\n\nLe télégramme se trouve actuellement dans un tiroir du Palais de l'Indépendance. Aucun journal ne l'a publié, la radio ne l'a pas diffusé et les fonctionnaires qui devraient agir en conséquence ne l'ont pas vu. Cela peut être maintenu pendant cinq jours. Il ne peut pas être maintenu pendant six heures."
 Diem.30.a: "Le tiroir reste fermé. Ouvrez les sondages."
 Diem.30.b: "Il m'a nommé. Qu'il me dénomme."
 Diem.31.t: "Un référendum sans candidat"
 Diem.31.d: "Le scrutin demandait au pays de choisir entre le chef de l'État et le premier ministre qui le remplacerait, et la seconde moitié de la question n'a jamais été remplie. Il n'y a pas de Ngo-Dinh-Diem sur le papier, parce qu'il n'y a pas de Ngo-Dinh-Diem dans le gouvernement, et les hommes qui auraient pu le remplacer n'ont ni le parti, ni l'armée, ni l'argent américain qui auraient rendu la compétition réelle.\n\nLe pays a donc voté, et il a voté pour le seul nom imprimé. Bao-Dai est confirmé comme chef de l'État avec une marge qui ne flatte personne, encore moins lui, et les journaux qui étaient prêts à parler d'une république ont tranquillement refait leurs unes.\n\nLe trône est en sécurité. Il est sûr de la même manière qu'un bâtiment que personne n'a pris la peine de démolir est sûr."
 Diem.31.a: "Confirmé. Par défaut, mais confirmé."
 Diem.40.t: "Dans le sac à barreaux"
 Diem.40.d: "Les Binh-Xuyen ont été chassés de Cholon en avril et ont passé l'été dans la mangrove au sud-est de la ville, où les canaux changent avec la marée et les cartes sont décoratives. Ils ont pillé le trafic fluvial, c'est ainsi qu'ils mangent, et le trafic fluvial est la façon dont Saigon mange.\n\nLe colonel Duong-Van-Minh a demandé la campagne et a un plan pour cela : de petites colonnes, des sampans, pas de blindés, et la patience de le faire sur des semaines plutôt que sur des jours. Il propose de lui donner le nom de Hoang-Dieu, ce qui est une affirmation considérable à propos d'une action policière contre un syndicat de jeux de hasard.\n\nLe-Van-Vien est toujours avec eux, et il a encore de l'argent. Si on lui donne six mois supplémentaires, il aura racheté sa place dans les calculs de quelqu'un, comme il l'a toujours fait."
 Diem.40.a: "Terminez-le. Nommez-le comme il veut."
 Diem.40.b: "Bloquez les canaux et laissez la marée les retenir."
 Diem.41.t: "Le général Vy descend de Da Lat"
 Diem.41.d: "Il est arrivé cet après-midi au Palais de l'Indépendance avec le colonel Nguyen-Tuyen et un télégramme du chef de l'État le nommant à l'état-major, et il a demandé au Premier ministre - dans la salle, devant témoins, avec le général Le-Van-Ty debout à ses côtés - de donner instruction à Le-Van-Ty de lui céder le poste.\n\nLe Premier ministre a répondu que le Conseil de gouvernement maintenait les dispositions existantes. À ce moment-là, M. Nhi-Lang, qui est un civil et n'est membre d'aucune armée, a sorti un pistolet et l'a pointé sur le général à travers le tapis, et plusieurs des hommes politiques présents ont commencé à exiger son arrestation.\n\nLe premier ministre prit le général Vy par le bras et l'emmena dans la pièce voisine pour s'asseoir avec les autres officiers, ce qui désamorça la situation. Que ce soit de la miséricorde ou de l'arithmétique, c'est une question pour plus tard ; la Garde Royale est toujours à Da-Lat et elle appartient toujours au trône."
 Diem.41.a: "Asseyez-le avec les autres. Personne n'est arrêté chez moi."
 Diem.41.b: "Arrêtez-le. Il est venu ici pour prendre l'armée."
 Diem.50.t: "Le limogeage du général Nguyen-Van-Vy"
 Diem.50.d: "Le 1er mai à l'aube, la Garde Royale descendit de Da-Lat et occupa la Poste, la radio militaire et la Banque Nationale. Ils les ont retenus jusqu'à midi, lorsque l'état-major a déplacé les troupes dans chaque bâtiment et a demandé leur retrait, et ils se sont retirés, ce qui vous dit l'essentiel de ce qu'il y a à savoir sur l'affaire.\n\nCet après-midi-là, les généraux télégraphièrent eux-mêmes au chef de l'État. L'Armée nationale, disaient-ils, ne connaissait que le gouvernement de Ngo-Dinh-Diem ; et si ce gouvernement n'était pas reconnu, l'Armée nationale obéirait au gouvernement élu par le peuple. Elle a été signée par des hommes qui avaient été promus la veille, et c'est la phrase la plus utile que l'on ait écrite cette année, car elle met la question au vote.\n\nLe général Vy a été relevé de l'inspection et s'est rendu en France. Lui et le colonel Nguyen-Tuyen seront jugés par contumace pour trahison. La branche de la Garde Royale est supprimée, le 2e Bataillon devient la Garde Présidentielle et le 1er est réparti entre les régiments de ligne."
 Diem.50.a: "Le trône garde son palais. Elle ne tient pas de régiment."
 Diem.60.t: "La République du Vietnam"
 Diem.60.d: "L'État du Vietnam est fini. Le référendum a destitué le chef de l'État, l'Assemblée constituante a promulgué une constitution et la République du Vietnam existe avec un président qui était, il y a dix-huit mois, un homme sans parti, sans armée et sans argent.\n\nBao-Dai ne reviendra pas de Cannes. L'empereur d'Annam, le dernier chef d'État et le dernier homme du pays qui pouvait destituer un premier ministre par télégramme, est devenu un simple citoyen français avec une maison dans les collines et un grief que personne à Saigon n'imprimera.\n\nLa suite appartient à la présidence : les traités avec la France à déchirer, la garnison à renvoyer chez elle, les terres à redistribuer, le Nord à débattre. Rien de tout cela n'est l'affaire du gouvernement qui s'arrête là."
 Diem.60.a: "Dix-huit mois et une république."
 Diem.61.t: "L'État du Vietnam perdure"
 Diem.61.d: "Le trône a tenu. Le référendum ne s'est pas déroulé comme il était censé se dérouler, ou n'a jamais été convoqué, et le chef de l'État s'est envolé pour la France comme il le fait toujours, étant entendu qu'il pourra revenir chaque fois que le gouvernement de Saigon deviendra incommode.\n\nL'État du Vietnam reste ce qu'il était : une monarchie sans couronnement, un gouvernement sans mandat et un Premier ministre qui change de mains si souvent que les ministères ont cessé de repeindre les portes.\n\nCe n'est pas un pays sédentaire et il ne le deviendra pas grâce à cet arrangement. Mais il est toujours debout, ce qui dans l'Indochine de 1955 n'est pas rien."
 Diem.61.a: "L'arrangement tient. Pour l'instant."
 Diem.62.t: "L'État des généraux"
 Diem.62.d: "Le général Nguyen-Van-Hinh a pris le gouvernement et l'a conservé, et l'arrangement qui a suivi convient à tous ceux qui comptent à Paris. Le Vietnam a un drapeau, un cabinet, des ministères et un siège dans l'Union française ; La France a la défense, les affaires étrangères et les cabinets attenants aux ministres.\n\nLes hommes qui voulaient une république nationaliste sont en exil, en prison ou en province, silencieux. Les hommes qui voulaient le retour des Français n'ont jamais eu à le demander.\n\nQuoi que devienne cet État, cela ne sera pas décidé à Saigon, et ce n'est plus l'histoire de la propre politique de l'État du Vietnam."
 Diem.62.a: "Les bureaux sont attenants. C'est tout."
 Diem.70.t: "Moderniser la citadelle d'Ong-Dem"
 Diem.70.d: "Le Premier ministre Ngo-Dinh-Diem a ordonné la modernisation de la citadelle d'Ong-Dem, l'une des installations militaires les plus stratégiques du centre de Saigon. A l'origine une caserne coloniale française, le complexe se trouve à proximité des principaux bâtiments gouvernementaux de la ville, ce qui en fait une position précieuse pour sécuriser la capitale.\n\nAlors que les installations françaises passent aux mains des Vietnamiens, Diem entend transformer la citadelle en fief de l'armée nationale. Le programme améliorera ses ouvrages défensifs, ses communications, ses casernes, ses liaisons de transport et ses dépôts d'armes, le préparant ainsi à accueillir les troupes fidèles au gouvernement. Avec la montée des tensions entre Saigon et Binh-Xuyen, la loyauté de la garnison de la citadelle pourrait s'avérer aussi importante que ses fortifications.\n\nLe gouvernement réfléchit également à un nouveau nom : Thanh-Cong-Hoa, la Citadelle républicaine. Pour Diem, sa transformation symboliserait l'émergence d'un établissement militaire vietnamien indépendant du contrôle français."
 Diem.70.a: "Une fondation pour une armée nationale indépendante."
 Diem.71.t: "Face aux Binh-Xuyen"
 Diem.71.d: "Le Premier ministre Ngo-Dinh-Diem s'est attaqué aux fondements financiers du Binh-Xuyen, l'organisation armée dirigée par Le-Van-Vien, plus connu sous le nom de Bay-Vien. Le gouvernement mettra fin à ses concessions de jeux de hasard et fermera les casinos et les bordels lucratifs qui soutiennent son influence sur la pègre de Saigon.\n\nCes établissements fournissent bien plus que des fortunes personnelles. Leurs revenus financent une armée privée et permettent à Bay-Vien de défier l'autorité du gouvernement national. Diem soutient que le rétablissement de l'ordre public nécessite la fin de cet arrangement : aucune organisation armée ne peut être autorisée à maintenir un État au sein de l'État.\n\nLes Binh-Xuyen ne veulent pas renoncer à leurs privilèges. En s'attaquant à leurs revenus, le Premier ministre a posé au grand jour la question de savoir qui gouverne réellement la capitale. Une confrontation apparaît désormais de plus en plus difficile à éviter."
 Diem.71.a: "Rétablir l'ordre et maintenir l'autorité de l'État."
 Diem.72.t: "Une région autonome pour les hauts plateaux du centre"
 Diem.72.d: "Le Premier ministre Ngo-Dinh-Diem a choisi de préserver le statut particulier des Hauts Plateaux du Centre. Plutôt que d'absorber la région dans l'administration provinciale ordinaire, le gouvernement réorganisera ses territoires autonomes dans le cadre national de l'État vietnamien.\n\nLa nouvelle région conservera une autorité substantielle sur l'administration locale, l'éducation, les affaires culturelles et les institutions coutumières. La défense, les relations étrangères et la politique économique nationale resteront sous la responsabilité du gouvernement central. Saigon espère qu'une véritable autonomie gouvernementale renforcera l'allégeance des peuples des hauts plateaux au Vietnam sans les obliger à renoncer à leurs identités distinctes.\n\nPour diriger l'administration, Diem a nommé le nationaliste montagnard Paul Nur comme chef régional. Le Premier ministre présente sa nomination comme une rupture avec le paternalisme colonial et l'assimilation forcée. Les peuples des hautes terres, déclare-t-il, doivent avoir leur mot à dire dans la gouvernance de leurs propres communautés et dans l'élaboration de l'avenir du pays."
 Diem.72.a: "Égalité, dignité et voix pour les peuples des hauts plateaux."
 Diem.73.t: "Donner du pouvoir au groupe Tinh-Than"
 Diem.73.d: "Le Premier ministre Ngo-Dinh-Diem a offert son soutien au Nhom Tinh-Than, un cercle intellectuel dont les membres allient le nationalisme vietnamien à la volonté de débattre de l'avenir politique et philosophique du pays. Les personnages associés au groupe comprennent Tran-Van-Do, Ngo-Dinh-Luyen, Nguyen-Thanh-Nguyen et Ngo-Dinh-Nhu. Ses discussions s'inspirent en partie des idées du père Parrell, un prêtre catholique basé à Da-Lat.\n\nDiem considère le groupe comme un forum dans lequel des nationalistes sympathisants peuvent développer une vision politique vietnamienne indépendante. Ses membres sont cependant loin d'être unis. Diem et Nhu sont favorables à une rupture décisive avec l'influence politique française, tandis que d'autres prônent un accommodement plus modéré. Les désaccords sur les Binh-Xuyen révèlent encore davantage les limites de leur objectif commun.\n\nPour le Premier ministre, de telles différences ne doivent pas empêcher la coopération. En soutenant les activités du groupe, il espère donner à son État nationaliste émergent une base intellectuelle suffisamment large pour permettre le débat entre ceux qui sont attachés à l'indépendance vietnamienne."
 Diem.73.a: "Grâce au débat, les idéaux de Can-Lao prendront racine."
 Diem.74.t: "Un règlement multipartite provisoire"
 Diem.74.d: "L'État du Vietnam reste politiquement fragile, tandis que le Viet-Minh continue de revendiquer le rôle du nationalisme vietnamien. Le Premier ministre Ngo-Dinh-Diem a donc proposé un accommodement provisoire avec les mouvements nationalistes non communistes rivaux, cherchant à les intégrer dans le système politique plutôt que de les pousser dans l'opposition.\n\nDans le cadre d'une nouvelle politique de réconciliation nationale, le gouvernement légalisera les organisations auparavant marginalisées et ouvrira des négociations avec le Dai-Viet, le Viet-Quoc et Quang-Phuc-Hoi. Leurs membres peuvent participer ouvertement à la vie politique, à condition de reconnaître le gouvernement national et d'abandonner la rivalité armée. Diem soutient que la lutte pour l'indépendance ne doit pas devenir une guerre entre nationalistes eux-mêmes.\n\nCet arrangement comporte des risques considérables. Ces mouvements ont leurs propres dirigeants et ambitions, et nombreux sont ceux qui se méfient du Premier ministre. Néanmoins, une coalition commence à se former, réunissant des intellectuels nationalistes, des militants chevronnés, des personnalistes catholiques et des hommes politiques indépendants sous la bannière d'un Vietnam indépendant."
 Diem.74.a: "Pour l'instant, intégrons nos rivaux à la coalition nationale."
 Diem.75.t: "Ngo-Dinh-Can prend les commandes du centre du Vietnam"
 Diem.75.d: "Notre gouvernement est confronté à la tâche difficile d'étendre son autorité aux provinces centrales. Plutôt que d'administrer Trung-Phan entièrement depuis Saigon, le Premier ministre Ngo-Dinh-Diem a confié les affaires régionales à son jeune frère, Ngo-Dinh-Can.\n\nDepuis sa base de Hué, Can a bâti un vaste réseau de partisans locaux, de responsables, de contacts religieux et de commandants de milice. Son aide clandestine a aidé Diem à défier les organisations nationalistes rivales, et son influence fait de lui un formidable allié. En tant que conseiller régional, il coordonnera l'administration, la sécurité et l'organisation politique dans tout le centre du Vietnam.\n\nBien que formellement subordonnée à Saigon, l'autorité de Can prend déjà un caractère qui lui est propre. Les responsables fidèles et les forces de sécurité régionales lui répondent de plus en plus personnellement. Cet accord promet une emprise plus ferme sur les provinces centrales, mais il pourrait également créer un domaine politique dans lequel le gouvernement devrait négocier avec son propre représentant plutôt que de simplement donner des ordres."
 Diem.75.a: "Can doit tenir les réactionnaires sous contrôle."
 Diem.75.b: "Can doit tenir les réactionnaires sous contrôle - sous sa propre bannière."
 VIE_Trung_Phan_Commissariat_tt: "§YNgo-Dinh-Can§! gouvernera le Centre du Vietnam en tant que §YCommissariat spécial de Trung-Phan§!, un régime fantoche sous notre autorité. À moins que l'autonomie montagnarde ne soit conservée, les hauts plateaux du haut et du bas Trung-Phan seront également cédés. Da-Lat et notre capitale restent à Saigon.\nLe Commissariat verse chaque mois §G80%§! de ses recettes fiscales à Saigon et nous envoie la plupart de ses ressources et de son industrie civile.\n"
 VIE_Trung_Phan_Alt_Flag_tt: "Le Commissariat arborera la bannière personnelle §Rde Can§!\n"
 TRP_commissariat_remittance: "Envois de fonds à Saigon"
 TRP_commissariat_remittance_desc: "Le Commissariat spécial répond à Saigon de ses revenus. La plupart des impôts collectés à Hué et dans les provinces centrales, ainsi que la majeure partie de la production de la région, sont envoyés au gouvernement national vers le sud."
 Diem.76.t: "Le Commissariat Spécial à l'Action Civique"
 Diem.76.d: "L'autorité gouvernementale reste faible dans une grande partie des campagnes. Pour renforcer ses liens avec la population rurale, le Premier ministre Ngo-Dinh-Diem a approuvé la création du Commissariat spécial à l'action civique, initialement placé sous sa tutelle. Kieu-Cong-Cung, un ancien officier Viet-Minh recommandé par le colonel Edward Lansdale, en sera le premier commissaire général.\n\nLe nouveau programme vise à établir la présence du gouvernement à travers une assistance pratique ainsi que la sécurité. Les cadres formés vivront et travailleront aux côtés des villageois, contribueront à l'agriculture et aux travaux publics et encourageront les communautés à organiser les affaires locales. L'éducation civique, les campagnes d'alphabétisation et les projets sociaux visent à démontrer que le gouvernement national peut fournir des services longtemps absents sous le régime colonial.\n\nPour Cung, qui a rejoint le Viet-Minh en tant que nationaliste avant de rompre avec le mouvement, cette nomination offre l'opportunité de servir une vision différente de l'indépendance vietnamienne. Le Commissariat doit maintenant transformer cette vision en une présence visible dans les villages."
 Diem.76.a: "Manger ensemble, vivre ensemble, travailler ensemble."
 Diem.77.t: "Abolition des terres royales de la Couronne"
 Diem.77.d: "Le Premier ministre Ngo-Dinh-Diem a obtenu l'approbation du chef de l'État Bao-Dai pour mettre fin au statut administratif spécial des terres de la Couronne royale dans les hauts plateaux du centre. Créé en 1950, cet accord préservait l'autorité et les privilèges de l'ancien empereur dans la région tout en gardant les hauts plateaux en dehors de la structure administrative ordinaire de l'État du Vietnam.\n\nLe nouveau décret place les hauts plateaux du centre et Da-Lat sous administration nationale directe. Le territoire sera incorporé sous le nom de Cao-Nguyen Trung-Phan, et les privilèges spéciaux restants associés à l'influence royale et française seront réduits.\n\nPour Diem, il s'agit de plus qu'une simple réforme administrative. Il supprime une base importante de l'influence politique de Bao-Dai et affirme le droit de Saigon à déterminer l'avenir des hauts plateaux. Le gouvernement promet l'égalité des citoyens et le développement, mais doit maintenant persuader les divers peuples de la région que l'intégration servira leurs intérêts autant que les siens."
 Diem.77.a: "Une administration, une citoyenneté égale dans tous les hauts plateaux."
 Diem.78.t: "Une alliance avec Tran-Quoc-Buu"
 Diem.78.d: "Le Premier ministre Ngo-Dinh-Diem cherche un soutien au-delà des factions politiques traditionnelles. Parmi ses alliés potentiels les plus prometteurs figure Tran-Quoc-Buu, l'organisateur syndical qui dirige le Tong-Lien-Doan Lao-Cong Viet-Nam, la Confédération vietnamienne du travail.\n\nLa carrière de Buu l'a fait passer de l'emprisonnement sous les Français à la participation au Viet-Minh, suivie d'une rupture avec le mouvement communiste. Après avoir étudié l'organisation syndicale en France, il retourne au Vietnam pour contribuer à la construction d'une fédération syndicale indépendante. Son mouvement combine le nationalisme avec des revendications pour de meilleurs salaires, une protection sociale et des organisations de travailleurs plus fortes.\n\nDiem a proposé une alliance : le gouvernement reconnaîtrait la fédération, lui laisserait la possibilité de s'organiser et soutiendrait les coopératives et les initiatives sociales. En retour, Buu rassemblera les travailleurs derrière le gouvernement national et résistera aux efforts communistes visant à dominer le mouvement ouvrier. L'accord pourrait donner à Saigon une nouvelle base de soutien populaire, à condition que ses promesses envers les travailleurs soient honorées."
 Diem.78.a: "Une nation bâtie par le travail doit servir ses travailleurs."
 Diem.79.t: "Le Commissariat Général aux Réfugiés"
 Diem.79.d: "Le règlement de Genève a divisé le Vietnam et déclenché une vaste migration du Nord vers le Sud. Alors que les réfugiés arrivent en nombre croissant, le gouvernement du Premier ministre Ngo-Dinh-Diem est confronté à la tâche urgente de les accueillir, de les transporter, de les loger et de les réinstaller.\n\nLes premières estimations se sont révélées insuffisantes. Avec l'aide française et américaine soutenant le mouvement vers le sud, le gouvernement a créé le Commissariat général aux réfugiés pour coordonner sa réponse. Le nouvel organisme enregistrera les familles déplacées, distribuera des fournitures d'urgence, organisera le transport et organisera des installations permanentes.\n\nLes familles agricoles feront l'objet d'une attention particulière, avec des plans visant à établir de nouvelles communautés dans les zones moins densément peuplées du delta du Mékong. La réinstallation doit offrir plus qu'un abri temporaire : ces familles ont besoin de terres, de moyens de subsistance et d'une place dans l'avenir du pays."
 Diem.79.a: "Bienvenue, compatriotes. Construisons ensemble une nouvelle maison."
 Diem.80.t: "Le premier conseiller d'État"
 Diem.80.d: "Alors que Ngo-Dinh-Diem forme son gouvernement, l'appareil de l'État vietnamien reste fragmenté. L'influence française est toujours forte et des factions nationalistes concurrentes réclament une place dans la nouvelle administration. Le Premier ministre a proposé de nommer un conseiller d'État, ou Quoc-Vu-Khanh, pour servir d'intermédiaire politique principal.\n\nDans un premier temps, la fonction sera en grande partie cérémonielle, représentant le gouvernement et maintenant le contact avec le chef de l'État Bao-Dai et les factions politiques du pays. Diem entend néanmoins étendre ses responsabilités à mesure que son administration consolide son autorité.\n\nQuatre candidats se sont présentés. Tran-Van-Chuong offre une expérience diplomatique et des relations internationales. Ngo-Dinh-Nhu apporte un engagement idéologique et la confiance de son frère, même si sa nomination susciterait des accusations de favoritisme. Le commandant Hoa-Hao Tran-Van-Soai, connu sous le nom de Nam-Lua, pourrait rapprocher une puissante armée religieuse de l'État. Nguyen-Ngoc-Tho offre une expérience administrative et une approche plus pragmatique. Notre choix contribuera à déterminer le caractère du nouveau gouvernement."
 Diem.80.a: "Nommez Tran-Van-Chuong. Son expérience diplomatique nous sera très utile."
 Diem.80.b: "Nommez Ngo-Dinh-Nhu. Nous avons besoin d'une main de confiance au sein du gouvernement."
 Diem.80.c: "Nommez Tran-Van-Soai. Amenez les Hoa-Hao dans l'administration nationale."
 Diem.80.e: "Nommez Nguyen-Ngoc-Tho. L'expérience et le pragmatisme doivent nous guider."
 Diem.81.t: "Le deuxième cabinet"
 Diem.81.d: "Suite à la confrontation avec les Binh-Xuyen et aux tensions croissantes avec les factions Cao-Dai et Hoa-Hao, le Premier ministre Ngo-Dinh-Diem a réorganisé son cabinet. Le remaniement place les ministères clés entre les mains de personnalités considérées comme des partisans fiables du gouvernement national et renforce l'engagement de l'administration envers l'autorité centrale.\n\nDiem conserve le poste de Premier ministre et assume personnellement le portefeuille de la défense. Plusieurs ministres du gouvernement précédent ont été remplacés, tandis que le développement économique, l'éducation, les affaires sociales, l'agriculture et la réforme agraire font l'objet d'une attention renouvelée. Le gouvernement espère établir son autorité au-delà de Saigon grâce à la fois à une réforme administrative et à des améliorations pratiques de la vie quotidienne.\n\nLe nouveau cabinet rassemble des personnalités nationalistes et anticommunistes dans une administration déterminée à réduire l'influence française et le pouvoir des factions armées autonomes. Son succès dépendra de la capacité de ces ministres à transformer un gouvernement plus fort dans la capitale en un gouvernement efficace dans tout le pays."
 Diem.81.a: "Un gouvernement national au service de tous les Vietnamiens."
 Diem.10.t: "[GetNewspaperHeader]L'abolition de la monarchie vietnamienne"
 Diem.10.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le référendum a destitué Bao-Dai. Les électeurs ont reçu deux bulletins, rouge pour la République et vert pour la monarchie, et des instructions ont été données dans certains bureaux de vote par des fonctionnaires qui n'ont pas jugé ces instructions inappropriées. Les fiches vertes ont été comptées là où elles avaient été restituées.\n\nLa fonction de chef de l'État, et avec elle la dernière trace constitutionnelle de la dynastie des Nguyen, cesse d'exister. Le Comité national de la révolution maintient le gouvernement jusqu'à ce qu'une constitution puisse être promulguée. Bao-Dai, qui n'a pas quitté la France, conteste la légalité de l'ensemble de la procédure cannoise.\n\nCe qui est terminé est plus vieux que le bureau. Il y a un empereur d'une sorte ou d'une autre au Vietnam depuis très longtemps, et il n'y a eu aucune cérémonie ce matin pour marquer le fait qu'il n'y en a plus maintenant."
 Diem.10.a: "La fin d'une époque, et personne ne dira laquelle."
 Diem.11.t: "[GetNewspaperHeader]La création de la République du Vietnam"
 Diem.11.d: "Saigon, [?global.date.GetDateStringNoHourLong] - L'État du Vietnam est dissous. Une Assemblée constituante s'est réunie ce matin au Palais de l'Indépendance pour promulguer une constitution, et dans l'après-midi, la République du Vietnam existait, avec Ngo-Dinh-Diem comme premier président et l'Armée nationale renommée pour l'État qu'elle sert désormais.\n\nLa chaîne juridique est courte et pas particulièrement solide. Il y a trois jours, un référendum a destitué un chef de l'État qui niait avoir le pouvoir de le faire, et une assemblée convoquée par le gouvernement qu'il a produit a maintenant rédigé les règles selon lesquelles ce gouvernement continuera à fonctionner. Personne dans la salle n'a prétendu le contraire et personne dans la salle n'a objecté.\n\nCe qui est véritablement nouveau est plus petit et plus difficile à discuter. Pour la première fois depuis le débarquement français à Da-Nang, il existe au sud du parallèle un État vietnamien dont la constitution n'a pas été rédigée à Paris et dont le chef n'y a pas été choisi. La question de savoir si cela durera est une question distincte, que cette assemblée a pris soin de ne pas soulever."
 Diem.11.a: "Le nôtre, enfin, et quoi qu'il en soit."
 Diem.12.t: "[GetNewspaperHeader]Le Sud-Vietnam rejette les accords de Genève"
 Diem.12.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le gouvernement a refusé de participer aux élections nationales prévues l'année prochaine dans le cadre de l'accord de Genève. \"Nous ne serons pas liés\", indique le communiqué, \"par un accord mandaté par l'étranger et signé contre la volonté du peuple vietnamien\".\n\nL'argument juridique est mince et le gouvernement le sait : le Sud a assisté à la conférence et a refusé de signer, ce qui représente soit la totalité de la défense, soit rien du tout, selon qui lit. L'argument pratique n'est pas du tout mince. Un scrutin organisé de part et d'autre du dix-septième parallèle serait gratuit dans une moitié du pays et administré dans l'autre.\n\nHanoï a protesté et continuera à protester. Ce que la protestation ne peut pas produire, c'est un vote, et les deux gouvernements ont maintenant déclaré publiquement ce qu'ils avaient tous deux compris en privé depuis juillet de l'année dernière : la ligne temporaire serait une frontière."
 Diem.12.a: "La ligne reste alors là où elle est."
 Can_Lao.1.t: "[GetNewspaperHeader]La formation du parti Can-Lao"
 Can_Lao.1.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Sac-lenh 116/BNV/CT a créé le Can-Lao Nhan-Vi Cach-Mang Dang - le Parti révolutionnaire travailliste personnaliste - avec Ngo-Dinh-Nhu comme secrétaire général. Le décret a été publié sans cérémonie et le parti n'a pas annoncé de siège.\n\nSa doctrine est le Personnalisme, que ses fondateurs décrivent comme une troisième voie entre un matérialisme qui fait des hommes des consommateurs et un collectivisme qui en fait des unités. Sa structure est un peu plus concrète : des cellules de cinq, recrutées sur invitation, dont les membres ne connaissent pas l'identité des autres cellules.\n\nCe que cela donne au Premier ministre est quelque chose qui lui manquait manifestement. Il est arrivé à Saigon sans organisation, sans journal et sans hommes dans les provinces, et gouverne depuis trois mois fort d'une famille et d'une mission américaine. Le Can-Lao est la réponse à cela, et il sera présent dans les ministères et dans le corps des officiers bien avant d'être présent à toute élection."
 Can_Lao.1.a: "Un groupe de cellules. Comme c'est très moderne."
 DaiViet.1.t: "Une conspiration dans les casernes"
 DaiViet.1.d: "Les services de sécurité ont arrêté onze officiers dans trois garnisons et les interrogatoires ont donné les mêmes noms dans les trois garnisons. Le Dai-Viet Quoc-Dan-Dang recrutait au sein de l'Armée nationale bien avant l'existence de ce gouvernement, et les officiers concernés ne semblent pas penser qu'ils faisaient quelque chose de répréhensible.\n\nC'est là toute la difficulté du Dai-Viet. Ce ne sont pas une faction étrangère et ils ne sont pas communistes ; ce sont des nationalistes qui complotaient contre les Français lorsque ce premier ministre se trouvait dans un monastère du New Jersey, et un grand nombre d'entre eux considèrent l'arrangement actuel comme une interruption plutôt que comme un gouvernement.\n\nL'intrigue est brisée. Le parti ne l'est pas, et les hommes que nous avons arrêtés sont ceux qui sont suffisamment imprudents pour être arrêtés."
 DaiViet.1.a: "Onze officiers. Découvrez qui leur a dit que c'était sécuritaire."
 DaiViet.2.t: "Le mouvement Dai-Viet"
 DaiViet.2.d: "Cela a commencé avant l'aube avec deux bataillons quittant leurs casernes sans ordres et une proclamation préparée à l'avance et lue sur une station de radio prise une heure plus tôt. La proclamation est prudente : elle accuse le Premier ministre de népotisme, de dictature et de vente de la cause nationaliste à Washington, et elle ne mentionne pas une seule fois les Français.\n\nLes Dai-Viet préparent cela depuis un an et ne sont pas des amateurs. Ils ont des officiers dans les régiments de ligne, des cadres à Quang-Tri et Thua-Thien et une revendication d'un héritage nationaliste bien plus ancien que celui du gouvernement.\n\nCe qui se passera dans les six prochaines heures dépend entièrement de la question de savoir si le reste de l'Armée nationale obéira au bureau du Premier ministre ou attendra de voir."
 DaiViet.2.a: "L'armée a répondu. Rassemblez-les."
 DaiViet.2.b: "Les garnisons attendent de voir. Nous aussi."
 DaiViet.3.t: "L'alternative américaine"
 DaiViet.3.d: "Le général J. Lawton Collins s'est rendu à Washington pour affirmer que le poste de Premier ministre n'est pas viable, qu'il ne peut former une coalition et qu'il perdra toutes les élections qu'il est autorisé à organiser. Il propose un remplaçant nommément : Phan-Huy-Quat du Dai-Viet, un homme avec un parti, un palmarès et la confiance des Français.\n\nLe câble ordonnant à Collins et au général Ely de faire pression pour obtenir leur démission a été rédigé. Il a également été lu par des personnes à qui il n'était pas adressé, et sa substance est parvenue au Palais de l'Indépendance avant la réponse.\n\nLa question est donc tranchée cette semaine plutôt que l'année prochaine, et elle dépendra de la capacité du Premier ministre à démontrer, dans les prochains jours, qu'il contrôle le pays qu'il prétend gouverner."
 DaiViet.3.a: "Washington a choisi. Il n'y a plus rien à retenir."
 DaiViet.3.b: "Laissons le Dr Quat expliquer son mandat à l'état-major."
 DaiViet.4.t: "La zone de guerre de Ba-Long"
 DaiViet.4.d: "La redoute de Ha-Thuc-Ky se trouve dans les collines au-dessus du Thach-Han à Quang-Tri, et elle possède tout l'appareil d'un petit État : une garnison d'armes françaises, un impôt sur les villages en contrebas, un tribunal et une imprimerie qui s'occupe de ce gouvernement depuis juin.\n\nIl a été créé avec de l'argent français sur l'argument selon lequel une zone de base du Dai-Viet maintiendrait la province contre le Viet Minh. Il a tenu la province contre l'autre. En dix-huit mois, il n'a mené aucun engagement avec qui que ce soit, à l'exception des collecteurs d'impôts de Hué.\n\nL'Armée nationale peut s'en emparer en une semaine, perdre des hommes et transformer le Dai-Viet d'un parti comploteur en un parti de martyrs. Ou la chose peut être rachetée, ce qui coûte plus cher et s'installe moins."
 DaiViet.4.a: "Prends-le. Une zone de guerre qui ne combat personne n'est pas une zone de guerre."
 DaiViet.4.b: "Achetez-le. Nous avons assez d'ennemis ce printemps."
 Sect_Crisis.1.t: "La crise des sectes"
 Sect_Crisis.1.d: "Saigon a arrêté la subvention. Cinq millions de dôngs par mois, promis par nous aux Cao-Dai, aux Hoa-Hao et aux Binh-Xuyen et payés par eux, et le Premier ministre a simplement refusé de signer le mandat.\n\nTous trois ont fait ce qu'ils n'avaient jamais réussi auparavant, ils ont formé un front commun et ils font directement pression sur le chef de l'État, qui est sympathique pour l'excellente raison que le Grande Monde payait sa maison un million de dongs par jour. Ils ont lancé un ultimatum exigeant une part du gouvernement. Ils ont à eux seuls trente mille hommes et ils nous demandent, pas très subtilement, si nous avons l'intention de maintenir l'accord que nous avons pris.\n\nNous pouvons. Cela nous coûterait ce qui nous reste de notre poste de Premier ministre et ce serait une ingérence dans les affaires intérieures d'un État que nous avons reconnu comme souverain. Ou nous pouvons laisser le front découvrir ce que cela vaut sans nous."
 Sect_Crisis.1.a: "Laissez partir les sectes. Nous avons un gouvernement à garder."
 Sect_Crisis.1.b: "Écraser la coalition à Saigon. Financez le Front."
 Sect_Crisis.2.t: "[GetNewspaperHeader]La crise des sectes"
 Sect_Crisis.2.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Le gouvernement a mis fin au paiement mensuel des sectes religieuses armées, et les Cao-Dai, les Hoa-Hao et les Binh-Xuyen ont annoncé en réponse la création d'un Front national unifié. Un ultimatum exigeant une part du gouvernement a été lancé au Palais de l'Indépendance.\n\nL'argent n'a jamais été vietnamien. Le commandement français a arrangé en 1947 le maintien des armées sectaires en campagne contre le Viet Minh, et la facture a été remise à Saigon avec l'indépendance. Y mettre fin est présenté comme une question de souveraineté et est aussi une question d'arithmétique : les sectes constituent le poste le plus important du budget.\n\nLe Front dispose d'environ trente mille hommes, de ses propres provinces, de ses propres collecteurs d'impôts et, dans le cas des Binh-Xuyen, de la police nationale de la capitale. Que ce projet bénéficie également du soutien français est la question que se posent tous les ministères de Saigon, à laquelle personne au Haut-commissariat ne répond."
 Sect_Crisis.2.a: "Trente mille hommes et un ultimatum."
 VIE_Toan.5.t: "Le coup d'État réussit"
 VIE_Toan.5.d: "Les hommes du Nam-Viet Dan-Xa Dang tiennent la capitale. L'administration coloniale a été balayée et nos forces contrôlent le palais, les ministères et la radio. Nguyen-Bao-Toan quitte son poste de Premier ministre et confie le gouvernement au conseil révolutionnaire. Le Haut-commissariat français exige notre reddition et le chef de l'État s'est enfui. La révolution a commencé et la question est désormais de savoir jusqu'où elle ira."
 VIE_Toan.5.a: "La révolution continue"
 VIE_Toan.3.b: "Nous avons besoin de leur réseau, pas de leur foi. Gardez les mains du parti sur les leviers."
 VIE_Toan.4.b: "Armez les cadres. L'indépendance ne nous sera pas donnée."
 VIE_Toan.6.t: "La nuit du coup d'État"
 VIE_Toan.6.d: "Nguyen-Bao-Toan a ordonné au parti Dan-Xa de lancer son coup d'État à Saigon ce soir. Les cadres du Parti prennent leurs positions assignées, les transports sont prêts et les miliciens Hoa-Hao tiennent les routes d'accès. Les partisans au sein des ministères se préparent à aider à la saisie des bureaux du gouvernement. L'opération est dirigée à la fois contre le Haut-commissariat français et contre le chef de l'État.\n\nLa direction Dan-Xa présente le soulèvement comme le moyen d'assurer l'indépendance nationale sans se soumettre au Viet-Minh communiste. Ses préparatifs s'appuient sur l'organisation politique du parti et ses liens avec les Hoa-Hao, mais le soutien aux réformes ne signifie pas nécessairement la volonté d'une prise de pouvoir armée. Les modérés peuvent refuser de suivre les cadres dans une révolte ouverte, tandis que la Sûreté reste capable de perturber l'opération si elle peut agir avant que le parti n'atteigne ses objectifs.\n\nLa tâche immédiate des partisans de Toan est de prendre le contrôle des institutions de la capitale avant que les autorités puissent organiser une réponse coordonnée."
 VIE_Toan.6.a: "Il n'y a pas de retour en arrière."
 VIE_toan_coup_odds_tt: "Chances de réussite du coup d'État : §Y[?toan_coup_chance|0]%§! (§Y15%§! par point de radicalisme Dan-Xa supérieur à 2, actuellement §Y[?Toan_Radicalism|0]§!). S'il échoue, Nguyen-Bao-Toan est §Rassassiné§!."
