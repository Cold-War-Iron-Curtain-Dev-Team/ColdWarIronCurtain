 # ---- from Libya_Focus_events.txt ----
 LBA.1.a2:0 "Il y a un avenir meilleur pour les Berbères et les Arabes libyens"
 LBA.1.d2:0 "Après l'indignation internationale suscitée par les discussions sur le plan néo-impérialiste Bevin-Sforza, l'ONU a adopté une résolution exigeant l'unification d'un nouveau royaume libyen indépendant sous Idris."
 LBA.1.t2:0 "L'ONU adopte une résolution sur l'indépendance de la Libye"
 LBA.10.a2:0 "Cela peut avoir des conséquences imprévues"
 LBA.10.t2:0 "L'afflux continu d'enseignants égyptiens"
 LBA.11.a2:0 "La jeunesse est toujours rebelle, elle deviendra plus modérée et loyale avec l'âge."
 LBA.11.t2:0 "La radicalisation de la jeunesse"
 LBA.12.a2:0 "Qu'est-ce que cela signifie pour la Libye ?"
 LBA.12.d2:0 "Pour une raison quelconque, sa majesté le roi Idris Ier est de moins en moins vue dans la sphère publique et politique. Sans sa direction, de nombreuses décisions du Royaume pourraient être négligées."
 LBA.12.t2:0 "Idris se retire de la vie publique"
 LBA.13.a2:0 "Ahmed ? Une Régence ? Nous avons besoin d'Idris !"
 LBA.13.t2:0 "La nouvelle régence"
 LBA.14.a2:0 "De nouvelles idées pour un peuple ancien"
 LBA.14.t2:0 "La révolution libyenne"
 LBA.15.a2:0 "Nous nous efforcerons toujours d'atteindre l'unité arabe"
 LBA.15.t2:0 "La formation d'un nouveau syndicat"
 LBA.16.a2:0 "Le monde dans lequel nous vivons aujourd'hui est bien trop interconnecté"
 LBA.16.t2:0 "Politique étrangère libyenne"
 LBA.17.a2:0 "Nous pouvons toujours compter sur nos compatriotes arabes"
 LBA.17.d2:0 "La Libye a envoyé des volontaires et du matériel dans l'effort de guerre uni égyptien et syrien contre Israël"
 LBA.17.t2:0 "La Libye aide l'Egypte et la Syrie dans leurs efforts contre Israël"
 LBA.18.a2:0 "Ce n'était pas ce à quoi les travailleurs s'attendaient"
 LBA.18.d2:0 "De manière inattendue, les membres du conseil du RCC ont adopté une loi interdisant les syndicats."
 LBA.18.t2:0 "Interdiction des syndicats"
 LBA.19.a2:0 "Ce n'est pas un changement"
 LBA.19.d2:0 "Les partisans de la ligne dure du RCC apportent des changements non souhaités par les officiers révolutionnaires. Ils légifèrent désormais sur la charia car ils sont alignés sur les imams"
 LBA.19.t2:0 "Mise en oeuvre de la charia"
 LBA.2.a2:0 "Il y a un avenir meilleur pour les Berbères et les Arabes libyens"
 LBA.2.d2:0 "Le roi Idris déclare par la présente le Royaume-Uni de Libye indépendant, unissant les trois régions de Cyrénaïque, de Tripolitaine et de Fezzan."
 LBA.2.t2:0 "Déclaration du Royaume-Uni indépendant de Libye"
 LBA.20.a2:0 "Nous devons laisser Mouammar Kadhafi prendre les rênes du RCC"
 LBA.20.b2:0 "Loyalistes Senussi, c'est notre chance !"
 LBA.20.t2:0 "kadhafi démissionne en signe de protestation !"
 LBA.21.a2:0 "Gloire à la révolution ! Allahou Akbar !"
 LBA.21.d2:0 "C'est désormais un nouveau départ pour la République arabe libyenne. Tous les aspects de nos vies vont changer à l'avenir et il est difficile de voir ce que l'avenir nous réserve. Quoi qu'il en soit, nous sommes avec Mouammar al-Kadhafi"
 LBA.21.t2:0 "La révolution populaire"
 LBA.3.a2:0 "Un État unitaire"
 LBA.3.b2:0 "Un système fédéral"
 LBA.3.d2:0 "Avant de former un Royaume-Uni libyen, nous devons décider si nous aurons un système fédéral avec la Tripolitaine et le Fezzan comme deux États séparés ou un État unitaire sous une seule administration."
 LBA.3.t2:0 "Notre future administration"
 LBA.4.a2:0 "Une monarchie parlementaire"
 LBA.4.b2:0 "Maintenir le statu quo"
 LBA.4.d2:0 "Compte tenu du monde moderne, on peut se demander si nous devrions maintenir notre statu quo de contrôle monarchique complet ou adopter un système monarchique parlementaire."
 LBA.4.t2:0 "Question du pouvoir exécutif"
 LBA.5.a2:0 "Que Fekini nous serve bien"
 LBA.5.t2:0 "Le nouveau Premier ministre"
 LBA.6.a2:0 "Idris avec plus de puissance n'est que pour notre bénéfice"
 LBA.6.d2:0 "Idris et son cabinet sont désormais en désaccord avec l'organisation fédérale du Royaume-Uni de Libye en tant qu'États situés entre le Fezzan, la Cyrénaïque et la Tripolitaine. Le gouvernement adoptera un gouvernement unitaire, indivisible."
 LBA.6.t2:0 "Abolition du système fédéral"
 LBA.7.a2:0 "Les Américains n'ont rien à faire en Libye"
 LBA.7.d2:0 "Les relations fracturées entre sa majesté, le roi Idris, ont abouti à ce que l'administration force les puissances étrangères à maintenir des bases militaires dans notre pays."
 LBA.7.t2:0 "Suppression des bases militaires américaines"
 LBA.8.a2:0 "Les Britanniques n'ont rien à faire en Libye"
 LBA.8.d2:0 "Les relations fracturées entre sa majesté, le roi Idris, ont abouti à ce que l'administration force les puissances étrangères à maintenir des bases militaires dans notre pays."
 LBA.8.t2:0 "Suppression des bases militaires britanniques"
 LBA.9.a2:0 "Réévaluation plutôt que concession"
 LBA.9.t2:0 "Révision de la Constitution de 1951"
 libya_news.1.a2:0 "La France et la Grande-Bretagne sont allées trop loin"
 libya_news.1.t2:0 "[GetNewspaperHeader]Manifestations mondiales contre le plan Bevin-Sforza"
