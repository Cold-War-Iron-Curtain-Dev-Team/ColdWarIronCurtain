 tank_expeditionary_company:0 "Compagnie expéditionnaire"
 tank_experimental_company:0 "Entreprise expérimentale"
 tank_mass_produced_company_desc:0 "Cette société se concentre sur la réduction des coûts et des frais généraux, ce qui nous permet de produire plus d'unités au sol et d'économiser de l'argent, mais les rend moins fiables et tombent plus facilement en panne."
 tank_mobile_warfare_company_desc:0 "Cette entreprise mise sur la vitesse et la mobilité et prendra des mesures pour optimiser la vitesse de nos véhicules terrestres"
 tank_heavy_vehicle_company_desc:0 "Cette entreprise s'appuie sur la fabrication de véhicules lourdement blindés"
 tank_superior_firepower_company_desc:0 "Cette société investit massivement pour augmenter la puissance de feu et la portée de nos véhicules terrestres"
 tank_expeditionary_company_desc:0 "Cette entreprise se concentre sur la fabrication de véhicules capables de survivre sur des terrains accidentés et de réduire la consommation d'approvisionnement et de carburant"
 tank_experimental_company_desc:0 "Cette entreprise est tournée vers l'avenir et investit massivement dans la création de nouveaux designs"
 air_mass_produced_company:0 "Entreprise de production de masse"
 air_guardian_angel_company:0 "Compagnie des anges gardiens"
 air_firestorm_company:0 "Compagnie de tempête de feu"
 air_assault_horizon_company:0 "Compagnie Assaut Horizon"
 air_infinity_company:0 "Société Infini"
 air_mass_produced_company_desc:0 "Cette société se concentre sur la production en masse de grandes quantités d'avions au prix de les rendre moins fiables et plus susceptibles de tomber en panne pendant leur utilisation"
 air_guardian_angel_company_desc:0 "Cette société estime que l'armée de l'air devrait jouer un rôle de soutien et de garde des unités terrestres"
 air_firestorm_company_desc:0 "Cette société estime que l'armée de l'air devrait jouer un rôle direct et s'efforce de la rendre plus capable d'effectuer des missions dédiées"
 air_assault_horizon_company_desc:0 "Cette entreprise souhaite rendre les avions fiables, capables dans toutes les conditions et qui durent de longues périodes"
 air_infinity_company_desc:0 "Cette entreprise est tournée vers l'avenir et investit massivement dans la création de nouveaux designs"
 materiel_value_company:0 "Entreprise de matériel de valeur"
 materiel_infantry_company:0 "Compagnie de matériel d'infanterie"
 materiel_support_company:0 "Compagnie de matériel de soutien"
 materiel_experimental_company:0 "Compagnie de matériel expérimental"
 materiel_value_company_desc:0 "Cette entreprise se concentre sur la simplification des équipements et leur fiabilisation afin de réduire les coûts globaux"
 materiel_infantry_company_desc:0 "Cette entreprise consacre toute son attention à l'amélioration de l'équipement de l'infanterie"
 materiel_support_company_desc:0 "Cette entreprise estime que l'infanterie n'est qu'une distraction ; c'est l'artillerie qui fait le travail"
 materiel_experimental_company_desc:0 "Cette entreprise est tournée vers l'avenir et investit massivement dans la création de nouveaux designs"