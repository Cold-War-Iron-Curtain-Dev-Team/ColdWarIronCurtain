l_french:
 FRE_Highlands.1.t:0 "Col Mang Yang"
 FRE_Highlands.1.d:0 "La campagne de Dien Bien Phu étant décidée, le commandement du CEFEO des Hauts Plateaux du Centre doit retirer le Groupement Mobile 100 d'An Khe. Le seul moyen d'accéder à Pleiku est la route 19, qui passe par le col Mang Yang, un défilé étroit où le Viet Minh a eu des semaines pour se préparer. La même colonne s'est frayée un chemin à travers la Corée et constitue la meilleure réserve mobile que le corps expéditionnaire ait laissée dans les hautes terres.\n\nLa colonne routière est bon marché et rapide, mais chaque kilomètre du col est une position d'embuscade. Un pont aérien permettrait d'économiser les véhicules et la plupart des hommes, mais cela coûterait cher en heures et en crédits de transport. Rester à An Khe évite complètement le col, mais laisse le groupement isolé dans un quartier que le Viet Minh contrôle de plus en plus."
 FRE_Highlands.1.a:0 "Retrait sur la route 19"
 FRE_Highlands.1.b:0 "Transporter le groupement par avion"
 FRE_Highlands.1.c:0 "Tenez An Khe"
 FRE_Highlands_Mang_Yang_Road_tt:0 "Dépensez §Y10 crédits de guerre§!. Le Groupement Mobile 100 se dirige vers Pleiku par le col de Mang Yang et est pris en embuscade dans les cinq jours. Les pertes dépendent de qui détient Dak Doa et Pleiku et de la façon dont les combats de Dak Doa se sont terminés."
 FRE_Highlands_Mang_Yang_Airlift_tt:0 "Dépensez §Y60 crédits de guerre§! et §Y3 Metropole Patience§!. Le Groupement Mobile 100 s'envole vers Pleiku et évite complètement l'embuscade."
 FRE_Highlands_Mang_Yang_Hold_tt:0 "Perdez §Y2 Métropole Patience§!. Le Groupement Mobile 100 séjourne à An Khe. Il y est exposé aux attaques et peut encore être mutilé ou détruit."
 FRE_Highlands.2.t:0 "Col Mang Yang : conséquences"
 FRE_Highlands.2.d_destroyed:0 "Le Groupement Mobile 100 a été pris dans le col de Mang Yang et détruit en tant qu'unité de combat. Les véhicules brûlent le long de la route 19 et les survivants sont dispersés dans les collines. Le Viet Minh le présentera comme la preuve que le corps expéditionnaire peut être battu en rase campagne, et Paris n'acceptera pas la perte sans bruit."
 FRE_Highlands.2.d_mauled:0 "Le Groupement Mobile 100 s'est frayé un chemin à travers le col Mang Yang à un prix terrible. Un vestige brisé a atteint sa destination, mais il faudra des mois pour reconstruire le groupement. Le Viet Minh revendique la victoire et Paris est consterné."
 FRE_Highlands.2.d_escaped:0 "Le Groupement Mobile 100 a brisé les embuscades sur la route 19 avec des pertes modérées et a atteint Pleiku intact. Les commandants du Viet Minh n'ont pas pu fermer le col à temps et le moral des Français est un peu plus stable."
 FRE_Highlands.2.d_airlifted:0 "Des avions de transport ont soulevé le Groupement Mobile 100 hors d'An Khe avant que le Viet Minh ne puisse se rapprocher. Les véhicules et le matériel lourd ont été abandonnés pour être détruits, mais les hommes sont en sécurité à Pleiku."
 FRE_Highlands.2.d_held:0 "Le Viet Minh sonda les défenses d'An Khe mais ne parvint pas à briser le Groupement Mobile 100. Le groupement est toujours en place, isolé mais intact."
 FRE_Highlands.2.d_superseded:0 "La guerre dans son ensemble a progressé avant que le sort du Groupement Mobile 100 puisse être décidé. Le retrait d'An Khe n'apportera rien de plus."
 FRE_Highlands.2.a:0 "Une dure leçon"
 FRE_Highlands.3.t:0 "Col Chu Dreh"
 FRE_Highlands.3.d:0 "Les garnisons des hautes terres sont repliées vers la côte et le sud. Le Groupement Mobile 42 tient Pleiku et reçoit l'ordre de se replier le long de la route 14 en direction de Ban Me Thuot, en traversant en chemin le col de Chu Dreh. Le Viet Minh savait que l'ordre arrivait et a déplacé ses unités près de la route.\n\nLa colonne peut partir immédiatement et espérer échapper à l'embuscade. Alternativement, le groupement peut rester à Pleiku et garder la ville, où il est attaché et toujours à la portée des forces du Viet Minh."
 FRE_Highlands.3.a:0 "Envoyez la colonne vers Ban Me Thuot"
 FRE_Highlands.3.b:0 "Tenez Pleiku"
 FRE_Highlands_Chu_Dreh_Road_tt:0 "Dépensez §Y15 crédits de guerre§!. Le Groupement Mobile 42 se dirige vers Ban Me Thuot par le col de Chu Dreh et est pris en embuscade dans les cinq jours. Le risque dépend de qui détient Pleiku et Dak Doa et de la façon dont l'embuscade de Mang Yang s'est terminée."
 FRE_Highlands_Chu_Dreh_Hold_tt:0 "Dépensez §Y10 crédits de guerre§! et perdez §Y1 Metropole Patience§!. Le Groupement Mobile 42 reste à Pleiku, avec moins de risques d'être mutilé mais sans atteindre Ban Me Thuot."
 FRE_Highlands.4.t:0 "Col Chu Dreh : conséquences"
 FRE_Highlands.4.d_mauled:0 "Le Groupement Mobile 42 a été heurté sur la route 14 et mutilé. Un reste réduit survit, mais le Viet Minh a de nouveau blessé le corps expéditionnaire et le public français perd patience."
 FRE_Highlands.4.d_escaped:0 "Le Groupement Mobile 42 s'est frayé un chemin à travers le col de Chu Dreh et a atteint Ban Me Thuot en bon ordre. Les embuscades du Viet Minh sont arrivées trop tard et trop faibles."
 FRE_Highlands.4.d_held:0 "La garnison de Pleiku a résisté à la pression et a gardé ses positions. Le Groupement Mobile 42 est toujours en place, intact."
 FRE_Highlands.4.d_superseded:0 "La guerre dans son ensemble a progressé avant que le sort du Groupement Mobile 42 puisse être décidé. Le retrait de Pleiku ne donnera rien de plus."
 FRE_Highlands.4.a:0 "Alors ça va"
