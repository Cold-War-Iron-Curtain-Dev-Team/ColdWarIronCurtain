 Arab_Socialism: "Socialisme arabe"
 Arab_Socialism_desc: "£Ideology_Arab_Socialism_pic\n\n\n\n\n\n\n\n\nLe socialisme arabe est apparu au milieu du XXe siècle en tant que mouvement politique et idéologique principalement dans les pays arabes, mêlant des éléments du socialisme au nationalisme arabe. Il visait à lutter contre les inégalités socio-économiques, l'héritage colonial et les aspirations à l'indépendance et au progrès dans le monde arabe.\n\nÀ la base, le socialisme arabe plaidait pour un développement économique dirigé par l'État, souvent par le biais de la nationalisation d'industries et de ressources clés, d'une redistribution des richesses et de vastes programmes de protection sociale. Il cherchait à autonomiser la classe ouvrière, à réduire la pauvreté et à atteindre une plus grande autosuffisance économique tout en affirmant l'identité arabe et la solidarité contre l'impérialisme et l'influence étrangère.\n\nD'éminents dirigeants socialistes arabes comme Gamal Abdel Nasser en Égypte, Hafez al-Assad en Syrie et Saddam Hussein en Irak ont mis en oeuvre des variantes des politiques socialistes arabes, mettant l'accent sur un rôle fort de l'État dans l'économie, la rhétorique socialiste et l'unité panarabe. Cependant, le mouvement a été confronté à des défis, notamment des inefficacités économiques, la répression politique et des conflits régionaux, ce qui a conduit au déclin de son influence dans certains pays au fil du temps. Néanmoins, le socialisme arabe reste une force historique et idéologique importante qui façonne le discours politique et les politiques dans le monde arabe."
 conservative_progressivism: "Progressisme conservateur"
 conservative_progressivism_desc: "£Ideology_Conservative_Progressivism_pic\n\n\n\n\n\n\n\n\nIl existe une expérience qui en possède une et qui appelle à l'action. Ils veulent du changement : le progressisme conservateur arrive à maturité avec cohérence et radicalisme. En raison de sa position, il affirme que le changement ne peut être bénéfique sans stabilité. Si un changement est juste, il ne doit pas détruire les fondements moraux, culturels et institutionnels d'un État. \n\nAlors que les radicaux détruisent tandis que les technocrates avancent à la hâte, c'est le progressisme conservateur qui trace une voie médiane caractérisée par la transparence, la discipline et la prévisibilité. Il acceptera tous les changements qui sont dans l'intérêt public ; cependant, il n'approuvera pas les changements qui satisferaient simplement des désirs à court terme ou des dogmes extérieurs. La tradition n'est pas un boulet ; c'est le centre d'échange par lequel une société trouve son chemin en période de troubles.\n\nIl insiste sur la réforme : la justice sociale, la modernisation économique et un meilleur fonctionnement des institutions ne sont pas des options. Mais ces objectifs doivent être poursuivis avec prudence et dans le respect de l'histoire, des valeurs et de l'identité unificatrice de la nation. Tout ce qui dérange pour le plaisir est déconseillé. La voie à suivre est l'évolution, et non la révolution.\n\nLa famille, la foi, le devoir et la nation ne sont pas anachroniques, mais sont indispensables à l'unité et à la continuité. Sans eux, la liberté se transforme en licence et le progrès dégénère en anarchie. Le progressisme conservateur s'efforce de créer un monde qui respecte ces vertus."
 democratic_america: "Parti Démocratique"
 democratic_america_desc: "£Ideology_Democratic_Party_pic\n\n\n\n\n\n\n\n\nLe Parti démocrate est l'un des deux principaux partis politiques contemporains aux États-Unis, avec le Parti républicain. Remontant son héritage au Parti démocrate-républicain de Thomas Jefferson et James Madison, le Parti démocrate moderne a été fondé vers 1828 par des partisans d'Andrew Jackson, ce qui en fait le plus ancien parti politique actif au monde."
 ho_chi_minh_thought_socdem: "Pensée Hô Chi Minh"
 ho_chi_minh_thought_socdem_desc: "£Ideology_Ho_Chi_Minh_Thought_SocDem_pic\n\n\n\n\n\n\n\n\nLa Pensée Hô Chi Minh est l'idéologie officielle du Parti communiste vietnamien sous la direction du président Hô Chi Minh. Bien que fermement marxiste-léniniste, Ho croit en une réinterprétation plus nationaliste du marxisme pour les conditions uniques de la révolution vietnamienne, prenant même une certaine influence des « Trois principes du peuple » de Sun Yat-Sen et des révolutionnaires américains. La pensée Hô Chi Minh est aussi fièrement vietnamienne que communiste et appelle à une « révolution nationale démocratique » - une voie véritablement vietnamienne vers le socialisme où les ouvriers, les paysans, les soldats et les commerçants s'uniront contre les inégalités et l'impérialisme sous toutes ses formes."
 kemalism: "Kémalisme"
 kemalism_desc: "£Ideology_Kemalism_pic\n\n\n\n\n\n\n\n\nLe kémalisme est l'idéologie fondamentale de la République de Turquie, du nom de son fondateur, Mustafa Kemal Atatürk. Il englobe une série de vastes réformes politiques, sociales, culturelles et religieuses visant à distinguer le nouvel État turc de son prédécesseur Ottoman et à adopter un mode de vie occidentalisé. Cela comprend l'instauration de la démocratie, la promotion de la laïcité, le soutien de l'État au progrès scientifique et la fourniture d'un enseignement gratuit.\n\nDans les années qui ont suivi la Seconde Guerre mondiale, le principe du nationalisme turc a gagné en importance. Ce changement était en grande partie une réponse à la montée des puissances communistes en Europe et une réaction contre les mouvements d'extrême gauche en Turquie même."
 labor_zionism: "Le sionisme travailliste"
 labor_zionism_desc: "£Ideology_Labor_Zionism_pic\n\n\n\n\n\n\n\n\nLe sionisme travailliste est l'aile gauche du mouvement sioniste. Pendant de nombreuses années, c'était la tendance la plus importante parmi les sionistes et les organisations sionistes. Il se considérait comme le secteur sioniste des mouvements ouvriers juifs historiques d'Europe centrale et orientale, développant finalement des unités locales dans la plupart des pays comptant une population juive importante. Les sionistes travaillistes croient qu'un État juif ne peut être créé que grâce aux efforts de la classe ouvrière juive s'installant en Terre d'Israël et construisant un État par la création d'une société juive progressiste avec des kibboutzim et des moshavim ruraux et un prolétariat juif urbain."
 left_wing_populism: "Populisme de gauche"
 left_wing_populism_desc: "£Ideology_Left_Wing_Populism_pic\n\n\n\n\n\n\n\n\nLe populisme de gauche est une idéologie politique qui combine les principes d'égalité sociale, de justice économique et de souveraineté populaire avec une critique virulente des élites bien établies et des structures de pouvoir économique. Il positionne « le peuple » comme une majorité vertueuse et exploitée, s'opposant à une classe dirigeante corrompue composée de riches oligarques, d'intérêts corporatifs et d'institutions politiques complices.\n\nÀ la base, le populisme de gauche est motivé par le désir de responsabiliser les citoyens ordinaires, en particulier la classe ouvrière, les pauvres et les communautés marginalisées. Il appelle à la redistribution des richesses, à l'expansion des services publics, à une protection plus forte des travailleurs et à des réformes démocratiques qui détournent le pouvoir des élites financières et des bureaucraties irresponsables. Bien qu'il partage des points communs avec les idéologies traditionnelles de gauche telles que le socialisme, il se distingue par sa rhétorique de mobilisation de masse, son leadership charismatique et sa concentration sur l'engagement direct avec « le peuple » en dehors des structures partisanes conventionnelles."
 NZL_left_wing_populism_desc: "£Ideology_Left_Wing_Populism_NZL_pic\n\n\n\n\n\n\n\n\nLe populisme de gauche est une idéologie politique qui combine les principes d'égalité sociale, de justice économique et de souveraineté populaire avec une critique virulente des élites bien établies et des structures de pouvoir économique. Il positionne « le peuple » comme une majorité vertueuse et exploitée, s'opposant à une classe dirigeante corrompue composée de riches oligarques, d'intérêts corporatifs et d'institutions politiques complices.\n\nÀ la base, le populisme de gauche est motivé par le désir de responsabiliser les citoyens ordinaires, en particulier la classe ouvrière, les pauvres et les communautés marginalisées. Il appelle à la redistribution des richesses, à l'expansion des services publics, à une protection plus forte des travailleurs et à des réformes démocratiques qui détournent le pouvoir des élites financières et des bureaucraties irresponsables. Bien qu'il partage des points communs avec les idéologies traditionnelles de gauche telles que le socialisme, il se distingue par sa rhétorique de mobilisation de masse, son leadership charismatique et sa concentration sur l'engagement direct avec « le peuple » en dehors des structures partisanes conventionnelles."
 lumumbism: "Lumumbisme"
 lumumbism_desc: "£Ideology_Lumumbism_pic\n\n\n\n\n\n\n\n\nLe Lumumbisme (ou Lumumbisme en français) est une idéologie politique ancrée dans les idées et l'héritage de Patrice Lumumba, premier Premier ministre démocratiquement élu de la République démocratique du Congo et figure centrale de la lutte anticoloniale en Afrique. Émergeant comme une alternative révolutionnaire à la domination étrangère, le Lumumbisme met l'accent sur l'anti-impérialisme, l'unité panafricaine, la souveraineté nationale, la justice sociale et le nationalisme radical, se distinguant nettement des distorsions autoritaires ultérieures comme le Mobutuisme. À la base, l'idéologie rejette toutes les formes de colonialisme et d'exploitation néocoloniale, plaidant plutôt pour une véritable indépendance économique et politique des puissances occidentales - un principe que Lumumba a démontré lorsqu'il s'est opposé avec défi à la poursuite de l'ingérence belge après l'indépendance du Congo en 196. Sa vision allait au-delà de la libération nationale, embrassant la solidarité panafricaine avec des dirigeants comme Kwame Nkrumah et Gamal Abdel Nasser, qu'il considérait comme des alliés dans la construction d'un front uni contre l'intervention étrangère et l'exploitation capitaliste. Sur le plan économique, le Lumumbisme favorise le développement dirigé par l'État et la nationalisation des ressources clés pour garantir que la richesse profite au peuple congolais plutôt qu'aux sociétés étrangères, reflétant ses tendances socialistes sans adhésion stricte au dogme marxiste. Politiquement, il soutient la démocratie populaire et la mobilisation de masse contre la corruption des élites et les régimes fantoches soutenus par l'étranger - une position qui a finalement conduit au renversement et à l'assassinat de Lumumba soutenu par l'Occident en 1961, cimentant ainsi son martyre comme symbole de résistance. Aujourd'hui, le lumumbisme demeure à la fois une inspiration révolutionnaire pour les mouvements souverainistes africains et une critique du néocolonialisme, même si ses idéaux radicaux ont rarement été pleinement mis en oeuvre, souvent cooptés ou supprimés par les régimes autoritaires ultérieurs et les structures de pouvoir mondiales."
 populist_reformist: "Réformiste populiste"
 populist_reformist_desc: "£Ideology_Populist_Reformist_pic\n\n\n\n\n\n\n\n\nRéformiste populiste."
 social_democrat: "Social-démocratie"
 social_democrat_desc: "£Ideology_Social_Democratic_pic\n\n\n\n\n\n\n\n\nLa social-démocratie est une idéologie politique, sociale et économique aux multiples facettes qui préconise des interventions économiques et sociales significatives visant à réaliser la justice sociale dans le cadre d'une économie capitaliste. Il souligne l'importance d'une démocratie représentative solide, dans laquelle les citoyens ont voix au chapitre dans les processus décisionnels. En promouvant des mesures de redistribution des revenus, les sociales-démocraties visent à réduire les inégalités et à améliorer les opportunités pour tous les individus. L'objectif est de garantir que les bénéfices de la croissance économique soient partagés plus équitablement au sein de la société.\n\nEn outre, la social-démocratie soutient la régulation de l'économie dans l'intérêt général, ce qui implique l'établissement de garde-fous pour équilibrer les forces du marché et les besoins de protection sociale. Au coeur de cette idéologie se trouve le concept d'État-providence, dans lequel des dispositions sont prises pour soutenir les citoyens en cas de besoin, que ce soit par le biais de soins de santé, d'éducation ou d'allocations de chômage. Dans l'ensemble, la social-démocratie cherche à créer une société inclusive qui valorise à la fois les libertés individuelles et le bien-être collectif."
 AST_social_democrat_desc: "£Ideology_Social_Democratic_AST_pic\n\n\n\n\n\n\n\n\nLa social-démocratie est une idéologie politique, sociale et économique aux multiples facettes qui préconise des interventions économiques et sociales significatives visant à réaliser la justice sociale dans le cadre d'une économie capitaliste. Il souligne l'importance d'une démocratie représentative solide, dans laquelle les citoyens ont voix au chapitre dans les processus décisionnels. En promouvant des mesures de redistribution des revenus, les sociales-démocraties visent à réduire les inégalités et à améliorer les opportunités pour tous les individus. L'objectif est de garantir que les bénéfices de la croissance économique soient partagés plus équitablement au sein de la société.\n\nEn outre, la social-démocratie soutient la régulation de l'économie dans l'intérêt général, ce qui implique l'établissement de garde-fous pour équilibrer les forces du marché et les besoins de protection sociale. Au coeur de cette idéologie se trouve le concept d'État-providence, dans lequel des dispositions sont prises pour soutenir les citoyens en cas de besoin, que ce soit par le biais de soins de santé, d'éducation ou d'allocations de chômage. Dans l'ensemble, la social-démocratie cherche à créer une société inclusive qui valorise à la fois les libertés individuelles et le bien-être collectif."
