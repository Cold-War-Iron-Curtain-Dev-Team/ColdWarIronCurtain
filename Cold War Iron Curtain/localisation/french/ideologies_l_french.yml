 khomeinist: "Tutelle du juriste islamique"
 khomeinist_desc: "£Ideology_Khomeinism_pic\n\n\n\n\n\n\n\n\nLe khomeinisme a été fondé par Ruhollah Khomeini pendant la révolution islamique iranienne. Il s'agit de remplacer l'ancien régime monarchique par un système théocratique dirigé par des religieux islamiques. L'idéologie est apparue comme une réponse au régime de la monarchie iranienne et cherchait à créer un nouvel ordre politique basé sur les principes islamiques plutôt que sur l'autorité laïque ou royale. Dans ce système, les dirigeants religieux sont étroitement liés au pouvoir politique, les religieux jouant un rôle central dans la gouvernance de l'État et l'orientation de la société selon les enseignements islamiques. Ruhollah Khomeini a soutenu que la monarchie avait corrompu l'Iran et que seul un gouvernement islamique pouvait représenter correctement la volonté de Dieu et les valeurs de la communauté musulmane.\n\nTout ce qui est contenu dans le Coran est désormais une loi du gouvernement, ce qui signifie que les enseignements religieux islamiques deviennent le fondement de la législation, de la politique et de la vie sociale. Le système est basé sur l'idée que les juristes islamiques devraient guider et superviser l'État pour garantir que ses lois respectent la doctrine religieuse et les principes moraux. Ce concept, souvent lié au principe du Velayat-e Faqih, place l'autorité ultime entre les mains d'un érudit islamique de haut rang qui supervise à la fois les affaires religieuses et politiques. En conséquence, le gouvernement n'est pas seulement une institution politique mais aussi religieuse, où l'interprétation de la loi islamique façonne les politiques, les institutions et la vie quotidienne du pays."
 radical_modernism: "Modernisme islamique (radical)"
 radical_modernism_desc: "£Ideology_Islamic_Modernism_pic\n\n\n\n\n\n\n\n\nLe modernisme islamique est apparu au XIXe siècle en réponse à la crise intellectuelle et politique du monde musulman. Il abordait les défis posés par le colonialisme européen, la stagnation interne et les progrès rapides de la science et de la gouvernance modernes. Les adeptes de ce mouvement ne cherchaient pas à abandonner la tradition islamique mais à la réinterpréter à la lumière de valeurs modernes telles que le rationalisme, le constitutionnalisme, l'éducation et le progrès. Ils croyaient que l'Islam n'avait jamais été destiné à entrer en conflit avec la raison.\n\nDes personnalités éminentes telles que Jamal al-Din al-Afghani, Muhammad Abduh et Rashid Rida ont dirigé ce mouvement. Ils ont contesté la pratique consistant à suivre aveuglément les décisions passées et ont plutôt plaidé en faveur de l'ijtihad, ou raisonnement indépendant, comme moyen de revitaliser la société islamique. Les modernistes islamiques ont souligné que même si le Coran et la Sunna sont intemporels, leurs interprétations doivent être renouvelées à chaque époque pour répondre aux nouvelles réalités. Cette perspective a permis l'intégration du constitutionnalisme, de la réforme du genre, de la recherche scientifique et des institutions laïques - non pas comme des déviations par rapport à l'Islam, mais comme une continuation de sa mission éthique."
 radical_shiaist: "Chiisme radical"
 radical_shiaist_desc: "£Ideology_Radical_Shiaism_pic\n\n\n\n\n\n\n\n\nChiisme radical."
 radical_zaidiism: "Houthiisme"
 radical_zaidiism_desc: "£Ideology_Houthiism_pic\n\n\n\n\n\n\n\n\nLe houthisme est un mouvement armé issu d'une secte de l'islam chiite, le zaïdisme. Le houthisme est quasiment inexistant en dehors du Yémen. Le mouvement Houthi s'oppose fermement à l'Arabie saoudite, aux États-Unis et à Israël et cherche à lutter contre le « sous-développement et la marginalisation » du Yémen."
 shia_islamism: "Islamisme chiite"
 shia_islamism_desc: "£Ideology_Shia_Islamism_pic\n\n\n\n\n\n\n\n\nLe chiite est une branche de l'Islam selon laquelle le prophète islamique Mahomet a désigné Ali ibn Abi Talib comme son successeur (Imam)."
