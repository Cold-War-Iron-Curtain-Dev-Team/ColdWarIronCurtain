 absolute_monarchy: "Monarchie Absolue"
 absolute_monarchy_desc: "£Ideology_Absolute_Monarchy_pic\n\n\n\n\n\n\n\n\nUne monarchie absolue est une forme de gouvernement dans laquelle un seul dirigeant, généralement un roi ou une reine, détient tout le pouvoir et toute l'autorité sur l'État, ses décisions n'étant pas liées par des lois ou une constitution. Ce système met souvent l'accent sur le droit divin des rois, affirmant que les monarques sont choisis par Dieu et ne sont donc responsables que devant lui. Cela conduit à la centralisation du pouvoir et à la diminution de l'influence des nobles."
 islamic_monarchy: "Monarchie islamique"
 islamic_monarchy_desc: "£Ideology_Islamic_Monarchism_pic\n\n\n\n\n\n\n\n\nLes monarchies islamiques constituent une forme distincte de gouvernance islamique dans laquelle le pouvoir est confié à un dirigeant héréditaire, souvent légitimé à la fois par la tradition et par l'autorité religieuse. Tout au long de l'histoire, ces monarchies ont pris divers titres : Mamlakah (royaume), Califat, Sultanat et Émirat, chacun reflétant différents degrés d'autorité religieuse, politique et militaire au sein du monde islamique.\n\nLoin d'être monolithiques, les monarchies islamiques ont une structure et un style très variés. Certains, comme les califats, revendiquaient un leadership à la fois temporel et spirituel sur la Oumma musulmane, tandis que d'autres, comme les sultanats et les Émirats, gouvernaient de manière plus régionale, équilibrant le pouvoir dynastique et la légitimité religieuse. Ces monarchies étaient souvent fondées sur les principes islamiques de justice ('adl), de consultation (shura) et d'intendance (amanah), tout en s'inspirant de traditions tribales et dynastiques profondément enracinées. À l'ère moderne, les monarchies islamiques continuent d'exister, s'adaptant à la politique contemporaine tout en conservant leur légitimité grâce à la fois à l'autorité ancestrale et à l'adhésion aux valeurs islamiques."
 BUT_islamic_monarchy_desc: "£Ideology_Buton_Islamic_Monarchism_pic\n\n\n\n\n\n\n\n\nLa version butonaise de la monarchie islamique, comme celle de toutes les îles d'Indonésie, est née à la fois des commerçants et des prédicateurs. Il a été créé sous le sixième roi de Buton, le roi Lakilapoto, qui s'est converti à l'islam sous la direction du cheikh Abdul Wahid bin Syarif Sulaiman al-Fathani, originaire de Johor. Contrairement à d'autres régions d'Indonésie à cette époque, Buton a établi une constitution, ce qui en fait la première monarchie islamique constitutionnelle d'Asie du Sud-Est.\n\nLoin d'être monolithiques, les monarchies islamiques ont une structure et un style très variés. Certains, comme les califats, revendiquaient un leadership à la fois temporel et spirituel sur la Oumma musulmane, tandis que d'autres, comme les sultanats et les Émirats, gouvernaient de manière plus régionale, équilibrant le pouvoir dynastique et la légitimité religieuse. Ces monarchies étaient souvent fondées sur les principes islamiques de justice ('adl), de consultation (shura) et d'intendance (amanah), tout en s'inspirant de traditions tribales et dynastiques profondément enracinées. À l'ère moderne, les monarchies islamiques continuent d'exister, s'adaptant à la politique contemporaine tout en conservant leur légitimité grâce à la fois à l'autorité ancestrale et à l'adhésion aux valeurs islamiques."
 monarchist: "Monarchie"
 monarchist_desc: "£Ideology_Monarchism_pic\n\n\n\n\n\n\n\n\nLe monarchisme est la croyance en un système politique où la souveraineté est incarnée par un seul dirigeant : un monarque. Ce dirigeant peut régner par droit héréditaire, sanction divine ou tradition établie de longue date. Il ne s'agit pas simplement d'une préférence pour les rois et les couronnes ; il s'agit plutôt de la conviction que la continuité, l'ordre et la légitimité sont mieux préservés lorsque le leadership est transmis à travers une lignée singulière et consacrée. Dans la pensée monarchiste, le trône ne représente pas seulement l'autorité d'une seule personne, mais le poids des siècles, englobant l'histoire, la culture et le devoir forgés dans une institution vivante.\n\nAlors que les républiques s'enorgueillissent souvent de la voix du peuple, les monarchistes soutiennent que la stabilité ne réside pas dans la popularité, mais dans la permanence. Un monarque se tient au-dessus des partis, des factions et des humeurs passagères de la population, symbolisant l'unité en période de division politique. Le monarchisme ne rejette pas le changement ; il cherche plutôt à ancrer le changement dans la tradition. Qu'ils soient constitutionnels ou absolus, les monarques sont considérés par leurs partisans comme les gardiens de l'identité, de la religion et de l'ordre moral."
 AFG_monarchist_desc: "£Ideology_Monarchism_AFG_pic\n\n\n\n\n\n\n\n\nLe monarchisme est la croyance en un système politique où la souveraineté est incarnée par un seul dirigeant : un monarque. Ce dirigeant peut régner par droit héréditaire, sanction divine ou tradition établie de longue date. Il ne s'agit pas simplement d'une préférence pour les rois et les couronnes ; il s'agit plutôt de la conviction que la continuité, l'ordre et la légitimité sont mieux préservés lorsque le leadership est transmis à travers une lignée singulière et consacrée. Dans la pensée monarchiste, le trône ne représente pas seulement l'autorité d'une seule personne, mais le poids des siècles, englobant l'histoire, la culture et le devoir forgés dans une institution vivante.\n\nAlors que les républiques s'enorgueillissent souvent de la voix du peuple, les monarchistes soutiennent que la stabilité ne réside pas dans la popularité, mais dans la permanence. Un monarque se tient au-dessus des partis, des factions et des humeurs passagères de la population, symbolisant l'unité en période de division politique. Le monarchisme ne rejette pas le changement ; il cherche plutôt à ancrer le changement dans la tradition. Qu'ils soient constitutionnels ou absolus, les monarques sont considérés par leurs partisans comme les gardiens de l'identité, de la religion et de l'ordre moral."
