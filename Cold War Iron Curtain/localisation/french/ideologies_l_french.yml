 social_nationalism: "Nationalisme social"
 social_nationalism_desc: "£Ideology_Social_Nationalism_pic\n\n\n\n\n\n\n\n\nLe nationalisme social est une idéologie politique qui met l'accent sur l'importance de l'identité nationale tout en prônant la justice sociale et l'égalité au sein de la nation. L'idéologie cherche à unir la société à travers un sentiment partagé d'appartenance nationale tout en s'attaquant aux inégalités économiques, à la protection sociale et aux droits des citoyens ordinaires. Plutôt que de se concentrer uniquement sur le patriotisme ou le pouvoir de l'État, le nationalisme social combine la solidarité nationale avec la conviction que la nation a la responsabilité d'assurer l'équité et la protection sociale de son peuple.\n\nCe terme est lié aux thèmes plus larges de la résistance contre l'impérialisme, alors que les groupes autochtones cherchaient à récupérer leur identité et leurs droits face à la domination coloniale, mêlant souvent la fierté nationale à des appels à la réforme sociale et au bien-être de leurs communautés. Dans de nombreux mouvements anticoloniaux, le nationalisme social est devenu un moyen de renforcer l'unité au sein de la population tout en défiant la domination étrangère et en exigeant un ordre social plus juste. En liant l'indépendance nationale au progrès social, l'idéologie a joué un rôle important dans la formation des mouvements politiques visant à défendre à la fois la souveraineté et le bien-être de la nation."
 INO_social_nationalism_desc: "£Ideology_INO_Social_Nationalist_pic\n\n\n\n\n\n\n\n\nLe nationalisme social est une idéologie politique qui met l'accent sur l'importance de l'identité nationale tout en prônant la justice sociale et l'égalité au sein de la nation. L'idéologie cherche à unir la société à travers un sentiment partagé d'appartenance nationale tout en s'attaquant aux inégalités économiques, à la protection sociale et aux droits des citoyens ordinaires. Plutôt que de se concentrer uniquement sur le patriotisme ou le pouvoir de l'État, le nationalisme social combine la solidarité nationale avec la conviction que la nation a la responsabilité d'assurer l'équité et la protection sociale de son peuple.\n\nCe terme est lié aux thèmes plus larges de la résistance contre l'impérialisme, alors que les groupes autochtones cherchaient à récupérer leur identité et leurs droits face à la domination coloniale, mêlant souvent la fierté nationale à des appels à la réforme sociale et au bien-être de leurs communautés. Dans de nombreux mouvements anticoloniaux, le nationalisme social est devenu un moyen de renforcer l'unité au sein de la population tout en défiant la domination étrangère et en exigeant un ordre social plus juste. En liant l'indépendance nationale au progrès social, l'idéologie a joué un rôle important dans la formation des mouvements politiques visant à défendre à la fois la souveraineté et le bien-être de la nation."
 socialism: "Socialisme"
 socialism_desc: "£Ideology_Socialism_pic\n\n\n\n\n\n\n\n\nLe socialisme non marxiste est une gamme de systèmes économiques et sociaux caractérisés par la propriété sociale et l'autogestion ouvrière des moyens de production ainsi que par les théories et mouvements politiques qui leur sont associés. La propriété sociale peut faire référence à des formes de propriété publique, collective ou coopérative, ou à la propriété citoyenne des capitaux propres. Il existe de nombreuses variétés de socialisme et il n'existe pas de définition unique les englobant toutes, bien que la propriété sociale soit l'élément commun partagé par ses diverses formes. Les systèmes économiques socialistes peuvent être divisés en formes non marchandes et marchandes. Le socialisme non marchand implique la substitution des marchés de facteurs et de la monnaie par des critères d'ingénierie et techniques, basés sur des calculs effectués en nature, produisant ainsi un mécanisme économique qui fonctionne selon des lois économiques différentes de celles du capitalisme. Le socialisme non marchand vise à contourner les inefficacités et les crises traditionnellement associées à l'accumulation du capital et au système de profit. En revanche, le socialisme de marché conserve le recours aux prix monétaires, aux marchés de facteurs et, dans certains cas, à la recherche du profit, en ce qui concerne le fonctionnement des entreprises collectives et la répartition des biens d'équipement entre elles. Les bénéfices générés par ces entreprises seraient contrôlés directement par la main-d'oeuvre de chaque entreprise ou reviendraient à la société dans son ensemble sous la forme d'un dividende social. Le débat sur le calcul socialiste discute de la faisabilité et des méthodes d'allocation des ressources pour un système socialiste."
 Socialism_with_Chinese_Characteristics_soc: "Socialisme à la chinoise - Social-Démocratie"
 Socialism_with_Chinese_Characteristics_soc_desc: "£Ideology_Chinese_Characteristics_Soc_pic\n\n\n\n\n\n\n\n\nSocialisme à la chinoise (marxisme révisionniste)."
 ujamaa: "Ujamaa"
 ujamaa_desc: "£Ideology_Ujamaa_pic\n\n\n\n\n\n\n\n\nLe mot swahili Ujamaa signifie « famille élargie », « fraternité » ou « socialisme » ; en tant que concept politique, il affirme qu'une personne devient une personne à travers le peuple ou la communauté. Ujamaa était un terme rendu populaire par la philosophie politique appliquée dans le cadre des politiques de développement social et économique de Julius Nyerere en Tanzanie après son indépendance de la Grande-Bretagne en 1961."

