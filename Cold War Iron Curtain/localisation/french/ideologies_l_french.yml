 sankarism: "Sankarisme"
 sankarism_desc: "£Ideology_Sankarism_pic\n\n\n\n\n\n\n\n\nLe sankarisme (ou Sankaraïsme) est un terme vaguement défini nommé d'après le capitaine Thomas Sankara du Burkina Faso. Parce que les groupes de gauche comme de droite prétendent suivre les idées et les théories du sankarisme, il est difficile de déterminer exactement ce qu'est le sankarisme. Cependant, Sankar lui-même a déclaré que son objectif était de réaliser la « révolution démocratique et populaire » et de rendre le pays autosuffisant."
 SOV_marxism_lenninism: "Marxisme-léninisme orthodoxe" 
 SOV_marxism_lenninism_desc: "£Ideology_Marxism_Leninism_pic\n\n\n\n\n\n\n\n\nLe marxisme-léninisme est l'idéologie combinant la théorie socio-économique marxiste et la praxis politique léniniste, qui est l'idéologie officielle de l'Union des Républiques socialistes soviétiques et de l'Internationale communiste. Le but du marxisme-léninisme est le développement révolutionnaire d'un État capitaliste en un État socialiste, réalisé par la direction d'un parti d'avant-garde composé de révolutionnaires professionnels issus de la classe ouvrière."
 SOV_stalinism: "Marxisme-léninisme" 
 SOV_stalinism_desc: "£Ideology_SOV_Stalinism_pic\n\n\n\n\n\n\n\n\nLe stalinisme est le moyen de gouverner et l'ensemble des politiques connexes mises en oeuvre entre 1927 et 1953 environ sous la direction de Joseph Staline. Il a pris forme dans le contexte des efforts de l'Union soviétique pour consolider son pouvoir après la guerre civile russe et pour transformer rapidement une société largement agraire en un État socialiste industrialisé. En tant que système de gouvernement, le stalinisme combinait une autorité politique centralisée avec un contrôle étatique étendu sur la vie économique, sociale et culturelle, établissant un cadre rigide de gouvernance et de conformité idéologique.\n\nLes politiques et idées staliniennes, telles que développées en Union soviétique, comprenaient une industrialisation rapide, la théorie du socialisme dans un seul pays, l'établissement d'un État totalitaire et la collectivisation de l'agriculture. Celles-ci s'accompagnaient de la promotion d'un culte de la personnalité et de la stricte subordination des intérêts des partis communistes étrangers à ceux du Parti communiste de l'Union soviétique. Sous le stalinisme, le PCUS était considéré comme le principal parti d'avant-garde de la révolution communiste mondiale, et ses priorités étaient considérées comme primordiales dans l'élaboration de la politique intérieure et des mouvements communistes internationaux."
 DDR_stalinism_desc: "£Ideology_DDR_Stalinism_pic\n\n\n\n\n\n\n\n\nLe stalinisme est le moyen de gouverner et l'ensemble des politiques connexes mises en oeuvre entre 1927 et 1953 environ sous la direction de Joseph Staline. Il a pris forme dans le contexte des efforts de l'Union soviétique pour consolider son pouvoir après la guerre civile russe et pour transformer rapidement une société largement agraire en un État socialiste industrialisé. En tant que système de gouvernement, le stalinisme combinait une autorité politique centralisée avec un contrôle étatique étendu sur la vie économique, sociale et culturelle, établissant un cadre rigide de gouvernance et de conformité idéologique.\n\nLes politiques et idées staliniennes, telles que développées en Union soviétique, comprenaient une industrialisation rapide, la théorie du socialisme dans un seul pays, l'établissement d'un État totalitaire et la collectivisation de l'agriculture. Celles-ci s'accompagnaient de la promotion d'un culte de la personnalité et de la stricte subordination des intérêts des partis communistes étrangers à ceux du Parti communiste de l'Union soviétique. Sous le stalinisme, le PCUS était considéré comme le principal parti d'avant-garde de la révolution communiste mondiale, et ses priorités étaient considérées comme primordiales dans l'élaboration de la politique intérieure et des mouvements communistes internationaux."
 KPA_stalinism_desc: "£Ideology_KPA_Stalinism_pic\n\n\n\n\n\n\n\n\nLe stalinisme est le moyen de gouverner et l'ensemble des politiques connexes mises en oeuvre entre 1927 et 1953 environ sous la direction de Joseph Staline. Il a pris forme dans le contexte des efforts de l'Union soviétique pour consolider son pouvoir après la guerre civile russe et pour transformer rapidement une société largement agraire en un État socialiste industrialisé. En tant que système de gouvernement, le stalinisme combinait une autorité politique centralisée avec un contrôle étatique étendu sur la vie économique, sociale et culturelle, établissant un cadre rigide de gouvernance et de conformité idéologique.\n\nLes politiques et idées staliniennes, telles que développées en Union soviétique, comprenaient une industrialisation rapide, la théorie du socialisme dans un seul pays, l'établissement d'un État totalitaire et la collectivisation de l'agriculture. Celles-ci s'accompagnaient de la promotion d'un culte de la personnalité et de la stricte subordination des intérêts des partis communistes étrangers à ceux du Parti communiste de l'Union soviétique. Sous le stalinisme, le PCUS était considéré comme le principal parti d'avant-garde de la révolution communiste mondiale, et ses priorités étaient considérées comme primordiales dans l'élaboration de la politique intérieure et des mouvements communistes internationaux."
 stalinism: "Marxisme-léninisme"
 stalinism_desc: "£Ideology_Marxism_Leninism_Stalinism_pic\n\n\n\n\n\n\n\n\nLe stalinisme est le moyen de gouverner et l'ensemble des politiques connexes mises en oeuvre entre 1927 et 1953 environ sous la direction de Joseph Staline. Il a pris forme dans le contexte des efforts de l'Union soviétique pour consolider son pouvoir après la guerre civile russe et pour transformer rapidement une société largement agraire en un État socialiste industrialisé. En tant que système de gouvernement, le stalinisme combinait une autorité politique centralisée avec un contrôle étatique étendu sur la vie économique, sociale et culturelle, établissant un cadre rigide de gouvernance et de conformité idéologique.\n\nLes politiques et idées staliniennes, telles que développées en Union soviétique, comprenaient une industrialisation rapide, la théorie du socialisme dans un seul pays, l'établissement d'un État totalitaire et la collectivisation de l'agriculture. Celles-ci s'accompagnaient de la promotion d'un culte de la personnalité et de la stricte subordination des intérêts des partis communistes étrangers à ceux du Parti communiste de l'Union soviétique. Sous le stalinisme, le PCUS était considéré comme le principal parti d'avant-garde de la révolution communiste mondiale, et ses priorités étaient considérées comme primordiales dans l'élaboration de la politique intérieure et des mouvements communistes internationaux."
 twenty_eight_bolsheviks_desc: "£Ideology_28_Bolsheviks_pic\n\n\n\n\n\n\n\n\nLa faction des 28 bolcheviks ou « étudiants revenus » est un groupe d'hommes politiques qui ont étudié à l'université Sun Yat-Sen de Moscou avec l'aide de Pavel Mif entre 1926 et 1935 sous les autorités du Komitern. Leurs membres importants étaient Wang Ming, Wang Jiaxiang, Zhang Wentian, Qin Bangxian (alias Bo Gu), Yang Shangkun, He Kequan (alias Kai Feng) et des étrangers comme Otto Braun (alias Li De) lors de leur choix d'influence sur le PCC entre 1931 et 1935 (Conférence Zunyi) qui met fin à la faction des 28 bolcheviks pour Zhou Enlai, Zhu De, Mao Zedong. Faction. La pensée des 28 bolcheviks est de conserver la doctrine marxiste-léniniste basée sur le parti avant-gardiste VKP/KPSS de l'Union soviétique tout en rejetant toute « distorsion » de la théorie marxiste-léniniste et de conserver l'analyse de la condition matérielle avant-gardiste léniniste et de rejeter la « sinisation du marxisme » de Mao avec l'analyse dialectique matérielle chinoise proposée par des idéologues comme Zhou Yang ou Chen Boda (qui ont promu une position politique plus douce à l'égard de la culture chinoise). Lieu en chinois « Nouvelle Culture »). Cependant, les « étudiants de retour » étaient divisés sur leur position à l'égard des conditions matérielles de la Chine et de Mao Zedong, comme Zhang Wentian et Wang Jiaxiang qui soutenaient des concepts proches de la « nouvelle démocratie » de Mao ou certains principes de la « nouvelle culture » avec des désaccords sur le statut de « l'ancienne culture » pour passer à la « nouvelle culture » où Wang Ming ou Bo Gu étaient dogmatiques et suivaient la voie de l'Union soviétique."
 
# Revolutionary Socialism
 trotskyism: "Marxisme révisionniste"
 trotskyism_desc: "État socialiste"
