 WGR_social_democrat_desc: "£Ideology_Social_Democratic_WGR_pic\n\n\n\n\n\n\n\n\nLa social-démocratie est une idéologie politique, sociale et économique aux multiples facettes qui préconise des interventions économiques et sociales significatives visant à réaliser la justice sociale dans le cadre d'une économie capitaliste. Il souligne l'importance d'une démocratie représentative solide, dans laquelle les citoyens ont voix au chapitre dans les processus décisionnels. En promouvant des mesures de redistribution des revenus, les sociales-démocraties visent à réduire les inégalités et à améliorer les opportunités pour tous les individus. L'objectif est de garantir que les bénéfices de la croissance économique soient partagés plus équitablement au sein de la société.\n\nEn outre, la social-démocratie soutient la régulation de l'économie dans l'intérêt général, ce qui implique l'établissement de garde-fous pour équilibrer les forces du marché et les besoins de protection sociale. Au coeur de cette idéologie se trouve le concept d'État-providence, dans lequel des dispositions sont prises pour soutenir les citoyens en cas de besoin, que ce soit par le biais de soins de santé, d'éducation ou d'allocations de chômage. Dans l'ensemble, la social-démocratie cherche à créer une société inclusive qui valorise à la fois les libertés individuelles et le bien-être collectif."
 Three_principles_of_people_socdem: "Kuomintang (Faction Minsheng)"
 Three_principles_of_people_socdem_desc: "£Ideology_Three_Principles_SocDem_pic\n\n\n\n\n\n\n\n\nL'aile gauche du Kuomintang est composée de membres défendant le principe Minsheng, qui remonte à la philosophie Sun Yat-sens du Tongmenghui. Le concept peut être compris comme une protection sociale et se concentre donc sur l'amélioration de la vie des gens ordinaires. L'inspiration de ce principe a été influencée par le penseur américain Henry George et sa théorie du géorgisme. Le domaine de subsistance est divisé en 4 domaines (nourriture, vêtements, logement et transport) et les réformes et politiques du Kuomintang de gauche sont centrées sur ces domaines, tout en prônant le nationalisme chinois et l'anti-impérialisme."
 
 atari_democrat: "Démocrate Atari"
 atari_democrat_desc: "£Ideology_Atari_Democrat_pic\n\n\n\n\n\n\n\n\nLe Parti démocrate est l'un des deux principaux partis politiques contemporains aux États-Unis, avec le Parti républicain. Remontant son héritage à Thomas Jefferson et au Parti démocrate-républicain de James Madison, le Parti démocrate moderne a été fondé vers 1828 par des partisans d'Andrew Jackson, ce qui en fait le plus ancien parti politique actif au monde."
 boil_weevil: "Charançon de l'ébullition (Hardline Dixiecrat)"
 boil_weevil_desc: "£Ideology_Boil_Weevil_pic\n\n\n\n\n\n\n\n\nLe Parti démocrate est l'un des deux principaux partis politiques contemporains aux États-Unis, avec le Parti républicain. Remontant son héritage au Parti démocrate-républicain de Thomas Jefferson et James Madison, le Parti démocrate moderne a été fondé vers 1828 par des partisans d'Andrew Jackson, ce qui en fait le plus ancien parti politique actif au monde."
 mcgovernism: "McGouvernisme"
 mcgovernism_desc: "£Ideology_McGovernism_pic\n\n\n\n\n\n\n\n\nLe Parti démocrate est l'un des deux principaux partis politiques contemporains aux États-Unis, avec le Parti républicain. Remontant son héritage au Parti démocrate-républicain de Thomas Jefferson et James Madison, le Parti démocrate moderne a été fondé vers 1828 par des partisans d'Andrew Jackson, ce qui en fait le plus ancien parti politique actif au monde."
 new_deal_democrat: "Démocrate du New Deal"
 new_deal_democrat_desc: "£Ideology_New_Deal_Democrat_pic\n\n\n\n\n\n\n\n\nLes Démocrates du New Deal représentent un large alignement politique au sein du Parti démocrate qui a émergé en réponse à la crise économique de la Grande Dépression et qui a duré jusqu'au milieu du 20e siècle. Enracinée dans les réformes radicales introduites sous le président Franklin D. Roosevelt, cette coalition a donné la priorité à l'intervention du gouvernement dans l'économie, aux programmes de protection sociale et à l'élargissement des droits du travail, dans le but de stabiliser le capitalisme tout en atténuant ses effets les plus sévères sur les travailleurs américains.\n\nCe courant politique a réuni un large éventail de groupes : ouvriers industriels des villes du Nord, agriculteurs, Afro-Américains des centres urbains, intellectuels progressistes et segments de l'électorat du Sud. Ce qui les unissait était la conviction commune que le gouvernement avait un rôle légitime à jouer pour protéger les citoyens des difficultés économiques et garantir un niveau de vie de base. Les travaux publics, la sécurité sociale, les programmes de création d'emplois et la réglementation financière sont devenus les caractéristiques de cette philosophie politique.\n\nLes démocrates du New Deal ont soutenu un gouvernement fédéral actif non pas comme un outil de pouvoir centralisé, mais comme un moyen de rétablir l'équilibre dans une économie que beaucoup pensaient être devenue biaisée en faveur du capital concentré. L'accent était mis sur la sécurité économique, la stabilité de l'emploi et la conviction que la prospérité devait être plus largement partagée - sans renverser le système capitaliste sous-jacent."
 new_democrat: "Nouveau Démocrate"
 new_democrat_desc: "£Ideology_New_Democrat_pic\n\n\n\n\n\n\n\n\nLe Parti démocrate est l'un des deux principaux partis politiques contemporains aux États-Unis, avec le Parti républicain. Remontant son héritage au Parti démocrate-républicain de Thomas Jefferson et James Madison, le Parti démocrate moderne a été fondé vers 1828 par des partisans d'Andrew Jackson, ce qui en fait le plus ancien parti politique actif au monde."
