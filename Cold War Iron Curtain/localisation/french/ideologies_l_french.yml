 agrarianism: "Agraire"
 agrarianism_desc: "£Ideology_Agrarianism_pic\n\n\n\n\n\n\n\n\nLe conservatisme agraire, souvent appelé agraire conservateur, est une idéologie politique et sociale centrée sur l'importance de protéger et de préserver les droits, les traditions et le bien-être général des paysans, des agriculteurs et des communautés rurales. Cette idéologie repose sur la conviction fondamentale que la vie rurale, le travail agricole et la gestion responsable des terres sont essentiels au tissu moral et culturel d'une société stable et prospère.\n\nLes partisans du conservatisme agraire soutiennent que l'essence d'une société saine réside dans son lien avec la terre et les cycles naturels de l'agriculture. Ils mettent l'accent sur la valeur des modes de vie ruraux traditionnels et sur les structures sociales uniques qui émergent des communautés agricoles. Cette perspective contraste souvent fortement avec les tendances modernes d'industrialisation et d'urbanisation, que les conservateurs agraires critiquent pour éroder ces liens ruraux vitaux.\n\nPlutôt que d'envisager le progrès économique uniquement sous l'angle de la croissance industrielle, le conservatisme agraire prône des pratiques agricoles durables, la promotion des économies locales et la préservation du patrimoine rural. Les partisans s'efforcent de défendre la dignité de l'agriculture en tant que moyen de subsistance et mode de vie, estimant que la protection de ces communautés est cruciale pour promouvoir des valeurs sociales telles que la coopération, l'intendance et le respect de la terre."
 black_conservatism: "Conservatisme noir"
 black_conservatism_desc: "£Ideology_Black_Conservatism_pic\n\n\n\n\n\n\n\n\nLe conservatisme noir est un type d'idéologie conservatrice populaire parmi les Africains des deux hémisphères. Les individus qui feraient la promotion du conservatisme noir seraient probablement des partisans du capitalisme de marché libre, de la promotion des croyances traditionnelles (généralement en ce qui concerne le christianisme catholique et protestant) et du patriotisme ou du jingoïsme. Le conservatisme noir s'oppose généralement au panafricanisme, au socialisme et à l'anti-impérialisme et recherche des liens étroits avec les anciennes puissances coloniales."
 boryu_conservatism: "Conservatisme Boryu"
 boryu_conservatism_desc: "£Ideology_Boryu_Conservativism_pic\n\n\n\n\n\n\n\n\nLe conservatisme Boryu (Sidestream Conservatisme), inspiré par les idéaux affirmés d'anciennes élites politiques, se présente comme un courant idéologique distinct au sein de la politique japonaise, contrastant avec la position plus modérée du conservatisme Honryu. Plusieurs des hommes politiques conservateurs fondateurs de Boryu étaient d'anciennes élites conservatrices d'avant-guerre qui ont été évincées du pouvoir, certains risquant même une peine d'emprisonnement temporaire. Adoptant une approche plus affirmée, le conservatisme Boryu donne la priorité au développement des capacités militaires du Japon, à la flexibilité des amendements constitutionnels et à l'intégration du concept de « sanjo » dans le système de sécurité sociale."
 conservatism: "Conservatisme"
 conservatism_desc: "£Ideology_Conservatism_pic\n\n\n\n\n\n\n\n\nLe conservatisme est une philosophie politique et sociale promouvant les institutions sociales traditionnelles dans le contexte de la culture et de la civilisation. Les principes centraux du conservatisme comprennent la tradition, l'imperfection humaine, la société organique, la hiérarchie et l'autorité, ainsi que les droits de propriété. Les conservateurs cherchent à préserver une série d'institutions telles que la monarchie, la religion, le gouvernement parlementaire et les droits de propriété, dans le but de mettre l'accent sur la stabilité et la continuité sociales."
 ZIM_conservatism_desc: "£Ideology_Conservatism_ZIM_pic\n\n\n\n\n\n\n\n\nLe conservatisme est une philosophie politique et sociale promouvant les institutions sociales traditionnelles dans le contexte de la culture et de la civilisation. Les principes centraux du conservatisme comprennent la tradition, l'imperfection humaine, la société organique, la hiérarchie et l'autorité, ainsi que les droits de propriété. Les conservateurs cherchent à préserver une série d'institutions telles que la monarchie, la religion, le gouvernement parlementaire et les droits de propriété, dans le but de mettre l'accent sur la stabilité et la continuité sociales."
 conservative_democracy: "Démocratie conservatrice"
 conservative_democracy_desc: "£Ideology_Conservative_Democracy_pic\n\n\n\n\n\n\n\n\nLa démocratie conservatrice est une combinaison de conservatisme et de démocratie. Parfois, il est confondu avec le nom utilisé dans la politique turque, mais le concept de démocratie conservatrice existe certainement. La démocratie conservatrice n'abandonne jamais les valeurs démocratiques, mais c'est une idéologie qui mêle les valeurs conservatrices et elle est généralement classée comme centre-droit."
 corporatism: "Corporatisme"
 AST_corporatism_desc: "£Ideology_Corporatism_AST_pic\n\n\n\n\n\n\n\n\nCorporatisme."
 free_trade_amoralism: "Amoralisme du libre-échange"
 free_trade_amoralism_desc: "£Ideology_Free_Trade_Amoralism_pic\n\n\n\n\n\n\n\n\nAmoralisme du libre-échange."
 gaullist: "Gaullisme"
 gaullist_desc: "£Ideology_Gaullism_pic\n\n\n\n\n\n\n\n\nLe gaullisme est une position politique française basée sur la pensée et l'action du chef de la Résistance française de la Seconde Guerre mondiale, le général Charles de Gaulle, qui deviendra le président fondateur de la Cinquième République française."
 herrenvolk_conservatism: "Conservatisme Herrenvolk"
 herrenvolk_conservatism_desc: "£Ideology_Herrenvolk_Conservatism_pic\n\n\n\n\n\n\n\n\nHerrenvolk Conservatisme." 
 idiosyncratic_paternalism: "Paternalisme idiosyncrasique"
 idiosyncratic_paternalism_desc: "£Ideology_Idiosyncratic_Paternalism_pic\n\n\n\n\n\n\n\n\nPaternalisme idiosyncrasique."
 ilminism_conservative: "Ilminisme"
 ilminism_conservative_desc: "£Ideology_Ilminism_pic\n\n\n\n\n\n\n\n\nL'ilminisme est une idéologie dominante qui « éliminons les divisions internes du peuple », qui a été désignée comme poème national par le président de l'époque Syngman Rhee en 1949. Elle a été théorisée par Ahn Ho-sang, le premier ministre de la Culture et de l'Éducation et philosophe.\nL'ilminisme inclut le nationalisme ethnique et contient même un peu de fascisme. L'idée la plus fondamentale de cette idée est le conservatisme autoritaire."
 islamic_nationalism_conservative: "Nationalisme islamique"
 islamic_nationalism_conservative_desc: "£Ideology_Islamic_Nationalism_pic\n\n\n\n\n\n\n\n\nLe prophète Mahomet a déclaré avec audace :\n\n§Y\"Quiconque se bat sous la bannière de la folie, soutient le tribalisme ou se met en colère pour le tribalisme mourra dans un état d'ignorance.\"§!\n\nL'Islam exige l'allégeance à la foi, à la justice et à la fraternité des croyants, et non aux États-nations.\n\nEt pourtant, l'islamisme s'est emparé de l'imaginaire nationaliste du monde islamique postcolonial. Beaucoup de ceux qui ont obtenu leur indépendance grâce à une longue domination étrangère ont tenté de façonner leur identité islamique dans un cadre national. Cette fusion place l'Islam comme l'âme moulée dans l'engin du nationalisme. Équilibrer un acte entre l'universalisme abstrait de la Oumma et la situation réelle de l'État."
 janist_labourism: "Le travailliste janiste"
 janist_labourism_desc: "£Ideology_Janist_Labourism_pic\n\n\n\n\n\n\n\n\nÉponyme de son personnage principal, Jânio Quadros, le janisme est une variante du conservatisme, née du mélange de rhétorique traditionaliste et de populisme ouvrier. À la différence du getulisme et du péronisme, plutôt que de faire appel aux travailleurs avec des promesses de meilleurs droits, le janisme les a séduits avec des promesses de justice rapide envers les politiciens corrompus. Bien qu'il s'agisse d'une idéologie conservatrice, le janisme était à l'époque étonnamment non aligné, entretenant des relations avec les nations du spectre socialiste, soutenant l'impartialité, l'antiparlamentarisme et le moralisme conservateur."
 liberal_nationalism: "Nationalisme libéral"
 liberal_nationalism_desc: "£Ideology_Liberal_Nationalism_pic\n\n\n\n\n\n\n\n\nNationalisme libéral."
 SAF_liberal_nationalism_desc: "£Ideology_Liberal_Nationalism_SAF_pic\n\n\n\n\n\n\n\n\nNationalisme libéral."
 national_conservatism: "Conservatisme national"
 national_conservatism_desc: "£Ideology_National_Conservatism_pic\n\n\n\n\n\n\n\n\nLe conservatisme national est une idéologie qui met l'accent sur la primauté de l'État-nation, la cohésion culturelle et le traditionalisme, et est franchement une vision prudente et souvent sceptique de l'internationalisme libéral, du changement social ou de toute institution supranationale. Il vise à conserver les principales caractéristiques de toute nation - souveraineté, identité nationale, intégrité morale, traditions religieuses et continuité culturelle - qu'il espère qu'un État puissant défendra et dirigera.\n\nLe conservatisme national, selon sa propre présentation, considère que les sociétés fonctionnent mieux lorsqu'elles sont fondées sur des coutumes et une histoire partagées et sur un sentiment d'appartenance commun. Non hostile à la démocratie et au capitalisme en tant que tels, cela signifie que ces deux-là devraient être mis au service de la nation contre les idéaux mondiaux abstraits ou les extrêmes individualistes.\n\nAinsi, paraphrasant l'homme d'État britannique Enoch Powell : §Y« Une nation est rendue grande non seulement par sa taille mais par son identité et ses institutions, par sa mémoire et son objectif »§!. Dans un tel allèle, le conservatisme national considère l'héritage de l'histoire comme moins un fardeau et bien plus comme une base - une boussole à travers les terrains incertains de l'existence contemporaine.\n\nContrairement à d'autres nationalistes qui caractérisent leurs idéologies essentiellement en termes économiques, les conservateurs nationaux le font sous des angles très différents : politique et moral."
 paternalistic_conservatism: "Conservatisme paternaliste"
 paternalistic_conservatism_desc: "£Ideology_Paternalistic_Conservatism_pic\n\n\n\n\n\n\n\n\nConservatisme paternaliste."
 religious_zionism: "Sionisme religieux"
 religious_zionism_desc: "£Ideology_Religious_Zionism_pic\n\n\n\n\n\n\n\n\nLes sionistes religieux n'étaient autrefois que des juifs pratiquants qui soutenaient le mouvement sioniste, mais celui-ci a progressivement évolué pour devenir un mouvement à part entière. Les adeptes du sionisme religieux croient que le droit des Juifs de s'installer sur l'ancienne terre d'Israël qui leur a été promise par Dieu est permanent et inaliénable. Le sionisme se heurte toujours à l'opposition des Juifs ultra-orthodoxes qui voient le sionisme comme une interférence avec le salut et, par conséquent, les sionistes blasphématoires mais religieux croient toujours au mérite de s'installer en Israël pour des raisons religieuses."
 republican: "Parti républicain"
 republican_desc: "£Ideology_Republican_Party_pic\n\n\n\n\n\n\n\n\nLe Parti républicain est l'un des deux principaux partis politiques aux États-Unis, l'autre étant son rival historique, le Parti démocrate. Le parti doit son nom au républicanisme, une idéologie majeure de la Révolution américaine. Fondés par des militants anti-esclavagistes, des modernisateurs économiques, d'anciens républicains nationaux, d'anciens Free Soilers et des Whigs en 1854, les républicains ont largement dominé la politique au niveau national et dans la majorité des États du Nord entre 1860 et 1932."
 right_wing_populism: "Populisme de droite"
 right_wing_populism_desc: "£Ideology_Right_Wing_Populism_pic\n\n\n\n\n\n\n\n\nLe populisme de droite, souvent appelé populisme national ou populisme de droite, est une idéologie politique qui synthétise des éléments de convictions politiques de droite avec une rhétorique et des thèmes populistes. Cette idéologie se caractérise par sa focalisation sur l'antiélitisme, qui implique une critique des institutions politiques établies et des élites perçues comme déconnectées des expériences et des préoccupations quotidiennes des citoyens ordinaires. Les mouvements populistes de droite mettent généralement l'accent sur l'identité nationale, défendant les intérêts et les valeurs des « gens ordinaires » contre ce qu'ils considèrent comme un establishment déconnecté de la réalité.\n\nDe plus, le populisme de droite met souvent l'accent sur des questions telles que le contrôle de l'immigration, le nationalisme et le protectionnisme économique, décrivant ces positions comme essentielles à la sauvegarde de la culture et des intérêts de la nation. La rhétorique utilisée dans ce cadre idéologique tend à galvaniser le soutien des individus qui se sentent marginalisés ou ignorés par la politique dominante, permettant ainsi aux dirigeants des mouvements populistes de droite de rallier efficacement une base importante de partisans autour de griefs et d'aspirations communes."
 social_conservative: "Conservatisme social"
 social_conservative_desc: "£Ideology_Social_Conservatism_pic\n\n\n\n\n\n\n\n\nLe conservatisme social est une idéologie qui prône les devoirs et les valeurs sociales traditionnelles considérées comme souhaitables sur la base des valeurs traditionnelles sociales, religieuses, culturelles et ethniques (ou nationales) et recherche la stabilité sociale à travers un ordre social existant. Les conservateurs sociaux croient généralement que la société est construite sur un réseau de relations fragiles et que c'est pourquoi les gouvernements devraient encourager ou mettre en oeuvre un large éventail de valeurs ou d'actions traditionnelles des sociétés existantes."
 Three_principles_of_people_conservative: "Kuomintang (aile Minzu-orthodoxe)"
 Three_principles_of_people_conservative_desc: "£Ideology_Kuomintang_Minzu_Orthodox_pic\n\n\n\n\n\n\n\n\nContrairement aux autres factions du Kuomintang réformé, le cercle conservateur plaide pour la préservation de l'héritage et des racines chinoises comme une priorité majeure de l'État au niveau national. Sur le plan économique, il soutient une économie mixte qui implique généralement une planification centrale de la part du gouvernement lui-même ainsi qu'une privatisation partielle de certaines industries, permettant la coexistence de nationalisations et de privatisations. Sur le plan diplomatique, les membres de droite espèrent l'éradication du communisme en tant que principale politique étrangère de la république, tout en augmentant l'autonomie de la Chine et en empêchant toute tentative américaine de soumettre la Chine à sa sphère d'influence."
 
 conservative_republican: "Républicain conservateur"
 conservative_republican_desc: "£Ideology_Conservative_Republican_pic\n\n\n\n\n\n\n\n\nLe Parti républicain est l'un des deux principaux partis politiques aux États-Unis, l'autre étant son rival historique, le Parti démocrate. Le parti doit son nom au républicanisme, une idéologie majeure de la Révolution américaine. Fondés par des militants anti-esclavagistes, des modernisateurs économiques, d'anciens républicains nationaux, d'anciens Free Soilers et des Whigs en 1854, les républicains ont largement dominé la politique au niveau national et dans la majorité des États du Nord entre 1860 et 1932."
