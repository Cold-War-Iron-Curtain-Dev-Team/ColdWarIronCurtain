 salafist: "Salafiste"
 salafist_desc: "£Ideology_Salafist_pic\n\n\n\n\n\n\n\n\nL'idéologie politique salafiste prône l'établissement d'une société basée sur une interprétation stricte de la loi islamique (charia) telle que pratiquée par les premières générations de musulmans (les Salaf). Il met l'accent sur un retour à ce que ses adeptes considèrent comme la forme pure et authentique de l'Islam, rejetant les innovations modernes et les influences laïques. Les politiques salafistes cherchent souvent à mettre en oeuvre la charia dans la gouvernance, l'éducation et les normes sociales, dans le but de créer un État qui reflète les principes et les pratiques des débuts de l'Islam."
