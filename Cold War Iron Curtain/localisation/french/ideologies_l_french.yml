 agrarian_populism: "Populisme agraire"
 agrarian_populism_desc: "£Ideology_Agrarian_Populism_pic\n\n\n\n\n\n\n\n\nPopulisme agraire."
 authoritarian_democracy: "Démocratie autoritaire"
 authoritarian_democracy_desc: "£Ideology_Authoritarian_Democracy_pic\n\n\n\n\n\n\n\n\nLa démocratie autoritaire présente un paradoxe enveloppé dans son principe : le peuple peut choisir, mais il ne gouverne pas. C'est un système qui conserve les rituels de représentation - élections, assemblées, constitutions - tout en concentrant la véritable autorité entre les mains d'un exécutif discipliné ou d'une direction centralisée. L'État ne fait pas taire le public ; il parle en son nom, souvent à sa place.\n\nDans ce système, le leader ne reflète pas simplement la volonté du peuple : il l'interprète et la fait respecter, parfois à l'encontre de ses passions momentanées, au nom de son bien durable. Là où la démocratie libérale prospère grâce à la dissidence et à la division, la démocratie autoritaire recherche l'unité, la continuité et la direction.\n\nCarl Schmitt, le juriste allemand, a soutenu que \"la démocratie ne signifie pas nécessairement le libéralisme. Cela ne signifie pas non plus le pluralisme des partis\". Selon lui, la démocratie pouvait être pleinement compatible avec une autorité forte et centralisée, à condition qu'elle revendique sa légitimité auprès de la nation dans son ensemble.\n\nDans une démocratie autoritaire, la représentation existe non pas pour disperser le pouvoir, mais pour le valider. Les institutions sont préservées, mais leur indépendance est réduite. La dissidence n'est pas carrément criminalisée, mais elle est gérée, contenue ou canalisée. La presse peut fonctionner, mais toujours à l'ombre de l'intérêt national."
 autocracy: "Autocratie"
 autocracy_desc: "£Ideology_Autocracy_pic\n\n\n\n\n\n\n\n\nAutocratie."
 buddhist_theocracy: "Théocratie bouddhiste"
 buddhist_theocracy_desc: "£Ideology_Buddhist_Theocracy_pic\n\n\n\n\n\n\n\n\nThéocratie bouddhiste."
 civilian_dictatorship: "Dictature personnaliste"
 civilian_dictatorship_desc: "£Ideology_Civilian_Dictatorship_pic\n\n\n\n\n\n\n\n\nLa dictature personnaliste incarne une forme de régime autoritaire où tout le pouvoir politique est concentré entre les mains d'un seul dirigeant. Ce leader exerce son autorité non pas à travers des institutions établies ou des cadres idéologiques, mais plutôt à travers un contrôle personnel, des réseaux de loyauté complexes et une image d'indispensable savamment conçue. Au sein de cette structure, les mécanismes de gouvernance, militaires et économiques sont souvent à la discrétion du dirigeant, faisant des lois et procédures formelles de simples outils qui servent les caprices du dirigeant plutôt que de contrôler son pouvoir.\n\nLa légitimité d'un régime personnaliste dépend de la perception de la force, du charisme et de la capacité du dirigeant à assurer la stabilité. Ces perceptions sont souvent renforcées par la propagande, le favoritisme et la répression de la dissidence. Les institutions sont systématiquement affaiblies ou reconfigurées pour s'aligner sur les intérêts du dirigeant, éliminant ainsi tout centre de pouvoir rival. Bien que ce système puisse permettre une prise de décision rapide et un leadership affirmé, il reste profondément instable : son existence même dépend du sort, des motivations et des ambitions d'un seul individu, faisant ainsi de la succession politique une source récurrente de troubles."
 colonial_regime: "Gouvernement colonial"
 colonial_regime_desc: "£Ideology_Colonial_Regime_pic\n\n\n\n\n\n\n\n\nUn gouvernement colonial est un système d'administration dans lequel une puissance européenne au pouvoir exerce un contrôle sur un territoire ou un peuple par le biais d'une règle directe ou indirecte. Que le colonisateur établisse une administration bureaucratique ou s'appuie sur les structures de pouvoir locales existantes, la puissance coloniale est nommée un gouverneur pour superviser la colonie. Cela s'accompagne souvent d'une stabilisation ou d'une exploitation économique, d'une imposition culturelle ou de la suppression complète de toute représentation antérieure.\nDe nombreuses colonies des premières années de la guerre froide sont en cours de décolonisation, où de nouvelles nations indépendantes émergeront soit par une transition pacifique, soit par un conflit violent. Les luttes nationalistes et le sentiment anticolonial en résulteront certainement, car les Nations Unies ont constamment adopté des résolutions appelant à l'indépendance immédiate des territoires coloniaux."
 colonial_regime_asia: "Gouvernement colonial"
 colonial_regime_asia_desc: "£Ideology_Colonial_Regime_Asia_pic\n\n\n\n\n\n\n\n\nUn gouvernement colonial est un système d'administration dans lequel une puissance européenne au pouvoir exerce un contrôle sur un territoire ou un peuple par le biais d'une règle directe ou indirecte. Que le colonisateur établisse une administration bureaucratique ou s'appuie sur les structures de pouvoir locales existantes, la puissance coloniale est nommée un gouverneur pour superviser la colonie. Cela s'accompagne souvent d'une stabilisation ou d'une exploitation économique, d'une imposition culturelle ou de la suppression complète de toute représentation antérieure.\nDe nombreuses colonies des premières années de la guerre froide sont en cours de décolonisation, où de nouvelles nations indépendantes émergeront soit par une transition pacifique, soit par un conflit violent. Les luttes nationalistes et le sentiment anticolonial en résulteront certainement, car les Nations Unies ont constamment adopté des résolutions appelant à l'indépendance immédiate des territoires coloniaux."
 colonial_regime_middle_east: "Gouvernement colonial"
 colonial_regime_middle_east_desc: "£Ideology_Colonial_Regime_Middle_East_pic\n\n\n\n\n\n\n\n\nUn gouvernement colonial est un système d'administration dans lequel une puissance européenne au pouvoir exerce un contrôle sur un territoire ou un peuple par le biais d'une règle directe ou indirecte. Que le colonisateur établisse une administration bureaucratique ou s'appuie sur les structures de pouvoir locales existantes, la puissance coloniale est nommée un gouverneur pour superviser la colonie. Cela s'accompagne souvent d'une stabilisation ou d'une exploitation économique, d'une imposition culturelle ou de la suppression complète de toute représentation antérieure.\nDe nombreuses colonies des premières années de la guerre froide sont en cours de décolonisation, où de nouvelles nations indépendantes émergeront soit par une transition pacifique, soit par un conflit violent. Les luttes nationalistes et le sentiment anticolonial en résulteront certainement, car les Nations Unies ont constamment adopté des résolutions appelant à l'indépendance immédiate des territoires coloniaux."
 despotism: "Despotisme"
 despotism_desc: "£Ideology_Despotism_pic\n\n\n\n\n\n\n\n\nLe despotisme est une forme de régime autoritaire dans lequel le pouvoir absolu est détenu par un seul dirigeant - souvent appelé despote - qui gouverne sans contraintes juridiques ou constitutionnelles. Dans un État despotique, le dirigeant exerce une autorité illimitée sur les lois, les institutions et la vie des citoyens, s'appuyant souvent sur la peur, la coercition et la répression pour maintenir le contrôle.\n\nContrairement aux monarchies liées par la tradition ou aux constitutions, ou aux dictatures qui peuvent revendiquer une légitimité idéologique ou populaire, le despotisme est caractérisé par le fait que la volonté personnelle du dirigeant constitue la loi suprême. Les ordres du despote l'emportent sur les institutions, et l'opposition est généralement réduite au silence par la surveillance, la censure, l'emprisonnement ou la violence. L'État de droit est faible, voire inexistant, et l'État existe avant tout pour servir la volonté du despote."
 PAR_despotism_desc: "£Ideology_Despotism_PAR_pic\n\n\n\n\n\n\n\n\nLe despotisme est une forme de régime autoritaire dans lequel le pouvoir absolu est détenu par un seul dirigeant - souvent appelé despote - qui gouverne sans contraintes juridiques ou constitutionnelles. Dans un État despotique, le dirigeant exerce une autorité illimitée sur les lois, les institutions et la vie des citoyens, s'appuyant souvent sur la peur, la coercition et la répression pour maintenir le contrôle.\n\nContrairement aux monarchies liées par la tradition ou aux constitutions, ou aux dictatures qui peuvent revendiquer une légitimité idéologique ou populaire, le despotisme est caractérisé par le fait que la volonté personnelle du dirigeant constitue la loi suprême. Les ordres du despote l'emportent sur les institutions, et l'opposition est généralement réduite au silence par la surveillance, la censure, l'emprisonnement ou la violence. L'État de droit est faible, voire inexistant, et l'État existe avant tout pour servir la volonté du despote."
 directorial_regime: "République Directrice"
 directorial_regime_desc: "£Ideology_Directorial_Republic_pic\n\n\n\n\n\n\n\n\nL'un des exemples les plus marquants et les plus durables de régime directoire est la Confédération suisse. L'exécutif fédéral suisse, le Conseil fédéral, est composé de sept membres qui assument conjointement les fonctions de chef d'État et de gouvernement du pays. Chaque membre dirige un ministère fédéral et les décisions sont prises par consensus ou par vote majoritaire au sein du conseil. La présidence du conseil tourne chaque année entre ses membres, mais le président ne détient aucun pouvoir supplémentaire, servant plutôt de primus inter pares (premier parmi ses égaux).\n\nCe système reflète l'engagement de la Suisse en faveur de la neutralité, de la collégialité et du fédéralisme. Il assure la continuité, réduit le risque d'autoritarisme et favorise une culture politique basée sur le compromis et la stabilité. Le modèle de direction suisse contraste avec les systèmes plus hiérarchiques et reste l'un des rares exemples fonctionnels de véritable leadership exécutif collectif dans le monde moderne."
 dominant_party_democracy: "Démocratie du parti dominant"
 haredi: "Haredu"
 haredi_desc: "£Ideology_Haredu_pic\n\n\n\n\n\n\n\n\nHaredu."
 independent: "Indépendant"
 independent_desc: "£Ideology_Independent_pic\n\n\n\n\n\n\n\n\nUn homme politique indépendant est un homme politique individuel qui n'est affilié à aucun parti politique."
 WGR_independent_desc: "£Ideology_Independent_WGR_pic\n\n\n\n\n\n\n\n\nL'Allemagne de l'Ouest se trouve devant l'Europe à la croisée des chemins. La jeune république se retrouve dans un paysage politique très fragmenté, alors que le Parlement fédéral rétabli va bientôt tracer une nouvelle voie. Les principales forces naviguent dans les petits partis des régions locales tandis que les franges radicales dominent dans l'équilibre des pouvoirs qui s'ensuit, mais instable. Se reconstruisant des ombres de la guerre, tandis que les ombres rouges de l'Est se profilent. \n\nReste à savoir quel groupe politique parviendra à déjouer et à dominer ses adversaires en premier. Quel sera l'avenir de l'Allemagne ?"
 interim_government: "Gouvernement intérimaire"
 interim_government_desc: "£Ideology_Interim_Government_pic\n\n\n\n\n\n\n\n\nUn gouvernement intérimaire est un organe directeur temporaire créé pour superviser un pays pendant une période de transition, qui survient généralement après l'effondrement d'un régime précédent, lors de bouleversements politiques ou entre des administrations. Son objectif principal est de maintenir les fonctions gouvernementales de base, d'assurer la stabilité et de préparer la mise en place d'un gouvernement permanent, souvent par le biais d'élections, de réformes constitutionnelles ou de négociations de paix.\n\nContrairement aux administrations ordinaires, les gouvernements intérimaires opèrent généralement avec des mandats limités. Ils sont censés agir avec neutralité et retenue, en s'efforçant de faciliter une transition en douceur plutôt que de poursuivre des programmes politiques à long terme. Ces gouvernements peuvent être formés par le biais de négociations entre factions politiques, d'une intervention militaire ou d'une médiation internationale, selon le contexte spécifique de la crise ou de la transition."
 INO_interim_government_desc: "£Ideology_INO_Interim_Government_pic\n\n\n\n\n\n\n\n\nLorsque les Néerlandais lancèrent leur attaque contre l'Indonésie, Soekarno et Hatta se rendirent à Yogyakarta. Mais avant de le faire, Soekarno a confié un mandat à Sjafruddin Prawiranegara, signalant que la situation était devenue désastreuse.\n\nLe gouvernement indonésien d'urgence a été formé à la fin de 1948 en dernier recours. Il était destiné à servir de gouvernement en exil, mais il n'a jamais vraiment rempli ce rôle. Au lieu de cela, la République a continué à mener une guérilla, naviguant à travers les jungles, les rizières et les centres urbains, pleinement consciente que l'indépendance valait la peine de mourir.\n\nAvec le succès de Roem van Roijen, la République peut enfin envisager d'atteindre sa pleine souveraineté. Mais est-ce que cela va durer, ou la République va-t-elle faiblir à cause de ses propres erreurs ?"
 keynesian_paternalism: "Paternalisme keynésien"
 keynesian_paternalism_desc: "£Ideology_Keynesian_Paternalism_pic\n\n\n\n\n\n\n\n\nPaternalisme keynésien."
 military_occupation: "Occupation militaire"
 military_occupation_desc: "£Ideology_Military_Occupation_pic\n\n\n\n\n\n\n\n\nOccupation militaire."
 RYU_military_occupation_desc: "£Ideology_USA_Military_Occupation_pic\n\n\n\n\n\n\n\n\nOccupation militaire (Ryukyu)."
 military_junta: "Régime militaire"
 military_junta_desc: "£Ideology_Military_Regime_pic\n\n\n\n\n\n\n\n\nUn régime militaire est une forme de gouvernement dans laquelle une force militaire exerce un contrôle total ou substantiel sur l'autorité politique.\nCe style de gouvernance peut être une tentative de démocratisation par le biais d'un pouvoir militaire temporaire, tout comme une tentative de promouvoir un pouvoir militaire semi-permanent."
 moderate_afrikaner: "Afrikaner modéré"
 moderate_afrikaner_desc: "£Ideology_Moderate_Afrikaner_pic\n\n\n\n\n\n\n\n\nLe nationalisme afrikaner est une idéologie promouvant l'unification des Blancs de langue afrikaans pour garantir l'autodétermination absolue des Afrikaners blancs et leur domination politique et culturelle. Il combinait des croyances religieuses calvinistes, une identité linguistique distincte et un sentiment anti-britannique."
 oligarchism: "Oligarchisme"
 oligarchism_desc: "£Ideology_Oligarchism_pic\n\n\n\n\n\n\n\n\nL'oligarchie est une forme de gouvernement dans laquelle le pouvoir est concentré entre les mains d'un petit groupe d'individus, de familles ou d'organisations, souvent élitistes. Ces élites dirigeantes - qu'elles soient fondées sur la richesse, l'influence militaire, les relations politiques ou le statut social - exercent un contrôle important sur les décisions, les institutions et les ressources de l'État, souvent pour servir leurs propres intérêts plutôt que ceux de la population dans son ensemble.\n\nContrairement aux démocraties, où le pouvoir est distribué par le biais d'élections et de participation populaire, ou aux monarchies, où le pouvoir est héréditaire, une oligarchie opère à travers un cercle d'influence étroit qui peut fonctionner derrière des structures étatiques formelles. Dans de nombreux cas, cette élite peut dominer des secteurs clés tels que l'économie, les forces de sécurité et les médias, garantissant ainsi que la véritable autorité leur revient, indépendamment de toute apparence extérieure de gouvernance démocratique."
 reactionary: "Réactionnaire"
 reactionary_desc: "£Ideology_Reactionary_pic\n\n\n\n\n\n\n\n\nEn science politique, un réactionnaire est une personne qui a des opinions politiques favorables à un retour au statu quo ante, l'état politique antérieur de la société, qui, selon lui, possédait des caractéristiques négativement absentes du statu quo contemporain d'une société."
 stratocracy: "Stratocratie"
 stratocracy_desc: "£Ideology_Stratocracy_pic\n\n\n\n\n\n\n\n\nLa stratocratie est un système de gouvernement dans lequel l'armée dirige directement l'État, l'autorité politique reposant sur les forces armées plutôt que sur les institutions civiles. Contrairement aux dictatures militaires, qui peuvent résulter de coups d'État temporaires, une stratocratie est institutionnalisée : l'armée n'est pas seulement le pouvoir derrière le trône ; c'est le trône. Dans ce type de gouvernement, leadership politique et commandement militaire se chevauchent souvent, et la politique de l'État est avant tout façonnée par des considérations stratégiques et sécuritaires.\n\nHistoriquement, les stratocraties se sont développées dans des sociétés où le service militaire est à la fois un devoir civique et la principale voie d'accès au pouvoir politique. L'ancienne Sparte, où les citoyens servaient comme soldats à vie, constitue un excellent exemple de ce modèle.\n\nLes partisans de la gouvernance stratocratique affirment qu'elle offre discipline, unité et leadership décisif, surtout en période d'instabilité. Les critiques avertissent cependant que cela peut conduire à l'érosion des libertés civiles, à la suppression de la dissidence et à la subordination de la vie civile à un militarisme perpétuel."
 ultra_protectionism: "Ultra-protectionnisme"
 ultra_protectionism_desc: "£Ideology_Ultra_Protectionism_pic\n\n\n\n\n\n\n\n\nUltra-protectionnisme (agrarianisme réactionnaire)."
 un_mandate: "Mandat des Nations Unies"
 un_mandate_desc: "£Ideology_UN_Mandate_pic\n\n\n\n\n\n\n\n\nLes mandats de l'ONU font référence à un système de gouvernance internationale dans lequel certains territoires, jugés non encore capables d'une pleine autonomie gouvernementale, sont placés sous l'administration temporaire d'un État membre agissant en tant qu'administrateur. Émergeant des idéaux de responsabilité collective et de décolonisation, ce système reflète la conviction que la stabilité mondiale dépend de l'orientation des anciennes colonies et des régions déchirées par des conflits vers l'indépendance grâce à une surveillance et un développement structurés.\n\nEnracinés dans le système de mandat antérieur de la Société des Nations, mais redéfinis dans le cadre du système de tutelle des Nations Unies, les mandats de l'ONU reposent sur le principe selon lequel la souveraineté est un objectif à atteindre et non à imposer. Les puissances administrantes n'ont pas pour mission de dominer, mais de favoriser la maturité politique, le développement économique, l'éducation et les droits de l'homme, le tout sous la surveillance du Conseil de tutelle. Contrairement au colonialisme, qui cherchait à extraire et à contrôler, les mandats de l'ONU sont conçus comme une obligation morale de préparer les peuples à l'autonomie."
 UR_party: "Autocratie (Russie Unie)"
 UR_party_desc: "£Ideology_UR_Party_pic\n\n\n\n\n\n\n\n\nAutocratie (Russie unie)."
 vennamolaisuus: "Vennamolaisius"
 vennamolaisuus_desc: "Vennamolaisuus, ou Vennamoism en anglais, est le nom donné à l'idéologie et au mouvement politique de Veikko Vennamo, le chef du Parti rural finlandais. Il se caractérise par le populisme, le recours aux slogans et le soutien à l'agriculture."

# Nationalism
