 green: "Politique verte"
 green_desc: "£Ideology_Green_Politics_pic\n\n\n\n\n\n\n\n\nLa politique verte est une idéologie politique qui vise à créer une société écologiquement durable ancrée dans l'environnementalisme, la non-violence, la justice sociale et la démocratie populaire."
 left_wing_peronism: "Péronisme de gauche"
 left_wing_peronism_desc: "£Ideology_Left_Peronism_pic\n\n\n\n\n\n\n\n\nLe péronisme, en tant qu'idéologie politique dominante en Argentine aujourd'hui, est un mélange de justice sociale, de droits du travail et de nationalisme, avec un fort accent sur le rôle de l'État dans l'économie. Il plaide en faveur d'une redistribution des richesses et d'une amélioration du niveau de vie de la classe ouvrière, tout en garantissant que les syndicats et les organisations de travailleurs occupent une place centrale dans l'élaboration des politiques. L'idéologie promeut le protectionnisme économique, luttant pour la souveraineté nationale et réduisant l'influence étrangère. Le péronisme se positionne comme une « troisième position » entre le capitalisme et le socialisme, visant une économie mixte et équilibrée. Alors qu'il continue de défendre les réformes sociales et les appels populistes, sa gouvernance a été critiquée pour ses tendances autoritaires, avec une forte centralisation du pouvoir et un contrôle sur divers secteurs. Le mouvement reste profondément divisé, avec des factions allant des ailes les plus progressistes aux ailes conservatrices, mais il continue de façonner la voie de l'Argentine en se concentrant sur l'unité nationale et le bien-être de son peuple."
 progressive: "Progressisme"
 progressive_desc: "£Ideology_Progressivism_pic\n\n\n\n\n\n\n\n\nLe progressisme est le soutien ou la promotion de l'amélioration de la société par la réforme. En tant que philosophie, elle repose sur l'idée de progrès, qui affirme que les progrès de la science, de la technologie, du développement économique et de l'organisation sociale sont essentiels à l'amélioration de la condition humaine."
 SAF_progressive_desc: "£Ideology_Progressivism_SAF_pic\n\n\n\n\n\n\n\n\nLe progressisme est le soutien ou la promotion de l'amélioration de la société par la réforme. En tant que philosophie, elle repose sur l'idée de progrès, qui affirme que les progrès de la science, de la technologie, du développement économique et de l'organisation sociale sont essentiels à l'amélioration de la condition humaine."
