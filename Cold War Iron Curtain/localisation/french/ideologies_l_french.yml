 chin_peng_thought_communist: "Pensée Chin Peng"
 chin_peng_thought_communist_desc: "£Ideology_Chin_Peng_Thought_Communist_pic\n\n\n\n\n\n\n\n\n\nLe camarade Chin Peng, le chef du Parti communiste malais, s'est initialement inspiré du tridémisme de Sun Yat-sen, qui mettait l'accent sur le nationalisme, la démocratie et les moyens de subsistance du peuple. Dans sa jeunesse, il admirait Chiang Kai-shek et son régime nationaliste sur le sud de la Chine et à Taiwan. Cependant, Chin Peng a ensuite été fortement influencé par « Sur la guerre prolongée » de Mao Zedong, embrassant les idéaux maoïstes de la lutte révolutionnaire chinoise et de la guerre des classes. Il croyait en la nécessité d'une révolution armée à long terme pour libérer le prolétariat chinois de l'impérialisme occidental et de l'oppression capitaliste en Malaisie. Bien qu'il s'aligne sur d'autres races en Malaisie, Chin Peng nourrissait un préjugé culturel distinct envers les Chinois malais, et il envisageait une version du communisme malais qui incorporerait des éléments du tridémisme, du bouddhisme et de la religion, cherchant à mélanger les croyances locales avec les objectifs révolutionnaires socialistes. Son cadre idéologique reflétait à la fois le pragmatisme et le désir nationaliste Han de créer un modèle communiste chinois culturellement spécifique pour la Malaisie."
 cybcom_ideological: "Communisme cybernétique - Parti"
 cybcom_ideological_desc: "£Ideology_Cybernetic_Communism_pic\n\n\n\n\n\n\n\n\nCommunisme cybernétique."
 cybcom_planning: "Communisme cybernétique - Technocratique"
 cybcom_planning_desc: "£Ideology_Cybernetic_Communism_pic\n\n\n\n\n\n\n\n\nCommunisme cybernétique."
 dengism: "Théorie de Deng Xiaoping"
 dengism_desc: "£Ideology_Deng_Xiapong_Theory_pic\n\n\n\n\n\n\n\n\nLe dengisme est une série de théories économiques et idéologiques réformistes développées par Deng Xiaoping de Chine. S'éloignant du marxisme orthodoxe, mais sans le rejeter, le dengisme souligne la nécessité du pragmatisme et des réformes, telles que « l'ouverture » du pays au monde extérieur. Ces idées sont communément appelées « socialisme à la chinoise », tant en Chine qu'à l'étranger."
 ho_chi_minh_thought: "Pensée Hô Chi Minh"
 ho_chi_minh_thought_desc: "£Ideology_Ho_Chi_Minh_Thought_Com_pic\n\n\n\n\n\n\n\n\nLa Pensée Hô Chi Minh est l'idéologie officielle du Parti communiste vietnamien sous la direction du président Hô Chi Minh. Bien que fermement marxiste-léniniste, Ho croit en une réinterprétation plus nationaliste du marxisme pour les conditions uniques de la révolution vietnamienne, prenant même une certaine influence des « Trois principes du peuple » de Sun Yat-Sen et des révolutionnaires américains. La pensée Hô Chi Minh est aussi fièrement vietnamienne que communiste et appelle à une « révolution nationale démocratique » - une voie véritablement vietnamienne vers le socialisme où les ouvriers, les paysans, les soldats et les commerçants s'uniront contre les inégalités et l'impérialisme sous toutes ses formes."
 indian_ocean_socialism: "Socialisme de l'Océan Indien"
 indian_ocean_socialism_desc: "£Ideology_Indian_Ocean_Socialism_pic\n\n\n\n\n\n\n\n\nLe socialisme de l'océan Indien est une idéologie socialiste progressiste, anticoloniale et internationaliste profondément influencée par la vision révolutionnaire de France-Albert René, l'ancien président des Seychelles dont le leadership transformateur a illustré ses principes fondamentaux. Enracinée dans l'interconnectivité historique et culturelle de la région de l'océan Indien - couvrant l'Asie du Sud, l'Afrique de l'Est, l'Asie du Sud-Est et les îles - cette idéologie mélange les traditions socialistes indigènes comme le socialisme gandhien, l'Ujamaa africain et le collectivisme maritime avec la pensée marxiste et écologique moderne. Inspiré du socialisme pragmatique de René, il met l'accent sur l'autonomie, la démocratie participative et le démantèlement des structures économiques néocoloniales. Les politiques de René - telles que la réforme agraire, la protection sociale universelle et la promotion des coopératives de travailleurs et de pêcheurs - servent de modèle pour une redistribution équitable des ressources et un développement durable. Au coeur du socialisme de l'océan Indien se trouvent la décolonisation du commerce et la création d'une fédération panrégionale basée sur l'entraide, la résilience climatique et la solidarité anti-impérialiste. Le défi de René contre l'hégémonie occidentale et son plaidoyer en faveur de la souveraineté des petits États non alignés soulignent l'engagement du mouvement à résister à l'exploitation tout en favorisant l'unité entre les nations de l'océan Indien. En donnant la priorité aux droits des communautés côtières et insulaires marginalisées, cette idéologie promeut un avenir d'équilibre écologique, de justice économique et d'autodétermination collective, perpétuant l'héritage d'humanisme révolutionnaire de René dans la lutte pour un monde libéré de l'océan Indien."
 juche: "Juchéisme"
 juche_desc: "£Ideology_Juche_pic\n\n\n\n\n\n\n\n\nLe juchéisme est l'idéologie officielle de la RPDC, décrite par le gouvernement comme la contribution originale, brillante et révolutionnaire de Kim Il-sung à la pensée nationale et internationale. Il postule que les masses coréennes doivent agir en maîtres de la révolution et de la construction et qu'en devenant autonome et forte, une nation peut réaliser le véritable socialisme."
 KPRF_party: "KPRF"
 KPRF_party_desc: "£Ideology_CPRF_pic\n\n\n\n\n\n\n\n\nKommunisticheskaya Partiya Rossiyskoy Federatsii (KPRF)."
 liberal_communism: "Communisme libéral"
 liberal_communism_desc: "£Ideology_Liberal_Communism_pic\n\n\n\n\n\n\n\n\nLe communisme libéral préserve l'État communiste et la suprématie du parti. Cependant, il cherche à réduire ou à limiter les éléments les plus répressifs ou coercitifs d'un système communiste. Les organisations sociales et politiques non communistes sont autorisées à exister. Le débat public et les critiques sont tolérés, mais l'État et le Parti restent dominants et toute tentative de renversement n'est pas autorisée. Le communisme libéral contribue à rassembler tous les segments de la population et à contribuer à une société socialiste plus pacifique. Les communistes plus traditionalistes soutiennent que cette idéologie ne fait qu'affaiblir l'emprise du Parti et ouvre la voie à l'anarchie ou aux forces contre-révolutionnaires."
 marxism_leninism: "Marxisme-léninisme"
 marxism_leninism_desc: "£Ideology_Marxism_Leninism_pic\n\n\n\n\n\n\n\n\nLe marxisme-léninisme est l'idéologie combinant la théorie socio-économique marxiste et la praxis politique léniniste, qui est l'idéologie officielle de l'Union des Républiques socialistes soviétiques et de l'Internationale communiste. Le but du marxisme-léninisme est le développement révolutionnaire d'un État capitaliste en un État socialiste, réalisé par la direction d'un parti d'avant-garde composé de révolutionnaires professionnels issus de la classe ouvrière."
 militant_socialism: "Socialisme militant"
 militant_socialism_desc: "£Ideology_Militant_Socialism_pic\n\n\n\n\n\n\n\n\n\"Un homme avec une arme à feu peut en contrôler une centaine sans en avoir une.\" \n- §YVladimir Ilitch Lénine.§!\n\nTout au long de l'histoire, de nombreuses personnes opprimées et pauvres aspiraient à une vie meilleure. Certains ont rejoint l'armée en quête d'amélioration et de reconnaissance, tandis que d'autres ont gardé dans leur coeur les idées du socialisme et du marxisme.\n\nC'est là qu'est apparu le §Ysocialisme militant§!. Ce groupe de révolutionnaires n'était pas composé d'ouvriers ou de paysans ordinaires mais provenait des gardiens de la nation : l'armée elle-même. §YLes militants socialistes§! pensaient que pour parvenir à la dictature du prolétariat, l'armée devait prendre les choses en main. Contrairement à une junte typique, ils affirmaient que le pouvoir reviendrait finalement aux dirigeants civils une fois que les principes du marxisme-léninisme seraient enracinés."
 BEL_militant_socialism_desc: "£Ideology_SOV_Junta_pic\n\n\n\n\n\n\n\n\n\"Un homme avec une arme à feu peut en contrôler une centaine sans en avoir une.\" \n- §YVladimir Ilitch Lénine.§!\n\nTout au long de l'histoire, de nombreuses personnes opprimées et pauvres aspiraient à une vie meilleure. Certains ont rejoint l'armée en quête d'amélioration et de reconnaissance, tandis que d'autres ont gardé dans leur coeur les idées du socialisme et du marxisme.\n\nC'est là qu'est apparu le §Ysocialisme militant§!. Ce groupe de révolutionnaires n'était pas composé d'ouvriers ou de paysans ordinaires mais provenait des gardiens de la nation : l'armée elle-même. §YLes militants socialistes§! pensaient que pour parvenir à la dictature du prolétariat, l'armée devait prendre les choses en main. Contrairement à une junte typique, ils affirmaient que le pouvoir reviendrait finalement aux dirigeants civils une fois que les principes du marxisme-léninisme seraient enracinés."
