 chin_peng_thought: "Pensée Chin Peng"
 chin_peng_thought_desc: "£Ideology_Chin_Peng_Thought_pic\n\n\n\n\n\n\n\n\n\nLe camarade Chin Peng, le chef du Parti communiste malais, s'est initialement inspiré du tridémisme de Sun Yat-sen, qui mettait l'accent sur le nationalisme, la démocratie et les moyens de subsistance du peuple. Dans sa jeunesse, il admirait Chiang Kai-shek et son régime nationaliste sur le sud de la Chine et à Taiwan. Cependant, Chin Peng a ensuite été fortement influencé par « Sur la guerre prolongée » de Mao Zedong, embrassant les idéaux maoïstes de la lutte révolutionnaire chinoise et de la guerre des classes. Il croyait en la nécessité d'une révolution armée à long terme pour libérer le prolétariat chinois de l'impérialisme occidental et de l'oppression capitaliste en Malaisie. Bien qu'il s'aligne sur d'autres races en Malaisie, Chin Peng nourrissait un préjugé culturel distinct envers les Chinois malais, et il envisageait une version du communisme malais qui incorporerait des éléments du tridémisme, du bouddhisme et de la religion, cherchant à mélanger les croyances locales avec les objectifs révolutionnaires socialistes. Son cadre idéologique reflétait à la fois le pragmatisme et le désir nationaliste Han de créer un modèle communiste chinois culturellement spécifique pour la Malaisie."
 gonzalo_thought: "Pensée Gonzalo"
 gonzalo_thought_desc: "£Ideology_Gonzalo_Thought_pic\n\n\n\n\n\n\n\n\n\nDoctrine antirévisionniste et maoïste créée par Abimael Guzmán du Pérou qui synthétise les idées de Karl Marx, Vladimir Lénine, Mao Zedong et José Carlos Mariátegui et les adapte à la réalité péruvienne. Il défend la nécessité d'une révolution violente basée sur la guérilla et d'une militarisation totale du mouvement communiste."
 guevarism: "Guévarisme"
 guevarism_desc: "£Ideology_Guevarism_pic\n\n\n\n\n\n\n\n\n\nLe guévarisme est une théorie de la révolution communiste et une stratégie militaire de guérilla associée au révolutionnaire communiste Ernesto « Che » Guevara. L'idéologie promeut l'exportation de la révolution vers tout pays dont le leader est soutenu par l'empire (les États-Unis) et est tombé en disgrâce auprès de ses citoyens. L'idéologie repose sur trois points principaux : le peuple peut gagner s'il est correctement organisé contre l'armée d'une nation ; que les conditions qui rendent une révolution possible peuvent être mises en place par les forces populaires ; et que les forces populaires ont toujours un avantage en milieu non urbain."
 hoxhaism: "Hoxhaisme"
 hoxhaism_desc: "£Ideology_Hoxhaism_pic\n\n\n\n\n\n\n\n\n\nLe hoxhaïsme est une variante du marxisme-léninisme antirévisionniste qui s'est développé à la fin des années 197 en raison d'une scission du mouvement maoïste, apparue après le conflit idéologique entre le Parti communiste chinois et le Parti du travail d'Albanie. L'idéologie porte le nom d'Enver Hoxha, un notable dirigeant communiste albanais."
 mao_zedong_thought: "La pensée de Mao Zedong"
 mao_zedong_thought_desc: "£Ideology_Mao_Zedong_Thought_pic\n\n\n\n\n\n\n\n\nLa pensée Mao Zedong est le produit de la combinaison des principes fondamentaux du marxisme-léninisme et de la réalité spécifique de la révolution chinoise. Il est né de l'expérience pratique de la lutte révolutionnaire en Chine, adaptant la théorie marxiste-léniniste universelle aux conditions historiques, à la structure sociale et aux circonstances économiques uniques du pays. En tant que tel, il représente la cristallisation de la sagesse collective des communistes chinois, formée par une pratique révolutionnaire prolongée et une réflexion théorique.\n\nEn tant que théorie politique, militaire et de développement défendue par Mao Zedong, la pensée de Mao Zedong a été largement appliquée tout au long de la révolution chinoise du XXe siècle. Il a fourni des conseils sur la stratégie révolutionnaire, la mobilisation de masse et la construction de l'État, façonnant l'orientation et les méthodes du mouvement communiste chinois. Il est généralement considéré comme le développement et la sinisation du marxisme-léninisme en Chine, marquant une étape distincte dans l'évolution de la théorie socialiste dans le contexte révolutionnaire chinois."
 maoist: "Anti-révisionnisme"
 maoist_desc: "£Ideology_Anti_Revisionism_pic\n\n\n\n\n\n\n\n\nUne position marxiste-léniniste apparue après le XXe Congrès du Parti communiste de l'Union soviétique. Les mouvements antirévisionnistes s'opposent aux réformes de la période khrouchtchev et soutiennent les développements staliniens et maoïstes du marxisme. "
 marxism_leninism_maoism: "Marxisme-Léninisme-Maoïsme"
 marxism_leninism_maoism_desc: "£Ideology_Marxism_Leninism_Maoism_pic\n\n\n\n\n\n\n\n\nLa synthèse du marxisme-léninisme-maoïsme n'a pas eu lieu du vivant de Mao Zedong. À partir des années 196, les groupes qui se disaient maoïstes ou qui soutenaient le maoïsme n'étaient pas unifiés autour d'une compréhension commune du maoïsme et avaient plutôt leurs propres interprétations particulières des oeuvres politiques, philosophiques, économiques et militaires de Mao ; ces tendances idéologiques désorganisées constituaient, et constituent toujours, la pensée Mao Zedong."
 marxist_leninism_AST: "Marxiste-léninisme"
 marxist_leninism_AST_desc: "£Ideology_Marxist_Leninism_AST_pic\n\n\n\n\n\n\n\n\nLa synthèse du marxisme-léninisme-maoïsme n'a pas eu lieu du vivant de Mao Zedong. À partir des années 196, les groupes qui se disaient maoïstes ou qui soutenaient le maoïsme n'étaient pas unifiés autour d'une compréhension commune du maoïsme et avaient plutôt leurs propres interprétations particulières des oeuvres politiques, philosophiques, économiques et militaires de Mao ; ces tendances idéologiques désorganisées constituaient, et constituent toujours, la pensée Mao Zedong."
 scientific_socialism: "Socialisme scientifique"
 scientific_socialism_desc: "£Ideology_Scientific_Socialism_pic\n\n\n\n\n\n\n\n\nLe socialisme scientifique a été fondé par Friedrich Engels et Karl Marx, mais a été largement utilisé par Deng Xiaoping de la RPC pour réformer le maoïsme. Il s'agit souvent du maoïsme, mais avec quelques réformes qui mettent davantage l'accent sur la science, l'industrialisation et, de manière générale, une nouvelle focalisation sur l'économie."

