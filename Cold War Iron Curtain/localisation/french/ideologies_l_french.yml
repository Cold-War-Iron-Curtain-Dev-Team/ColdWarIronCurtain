 corporate_neo_liberalism: "Néolibéralisme corporatif"
 corporate_neo_liberalism_desc: "£Ideology_Corporate_Neo_Liberalism_pic\n\n\n\n\n\n\n\n\nMalgré la social-démocratie traditionnelle et l'interventionnisme étatique des partis travaillistes occidentaux, Roger Douglas avait défendu une idéologie néolibérale radicale connue sous le nom de « Rogernomics », prônant des réformes radicales du libre marché en mélangeant la libéralisation économique et la déréglementation des marchés financiers et des industries, la suppression des subventions et des tarifs douaniers, la corporatisation et la privatisation des actifs de l'État, l'introduction d'une taxe sur les biens et services et de fortes réductions des taux d'imposition sur le revenu."
 general_zionism: "Sionisme général"
 general_zionism_desc: "£Ideology_General_Zionism_pic\n\n\n\n\n\n\n\n\nDe nombreuses personnes et partis ont choisi de ne suivre aucune des écoles de pensée sionistes distinctes et ont choisi de s'en tenir à l'idéologie fondamentale du sionisme, en s'installant en Israël et en créant l'État juif. La plupart des partis qui restent au « noyau » du sionisme sont des partis centristes qui ne s'associent ni à la gauche ni à la droite et ont tendance à être économiquement libéraux."
 liberal_democracy: "Démocratie libérale"
 liberal_democracy_desc: "£Ideology_Liberal_Democracy_pic\n\n\n\n\n\n\n\n\nLa démocratie libérale est une forme de principe politique et de gouvernement qui combine libéralisme et démocratie. Il fait référence à un système dans lequel des représentants élus à la majorité selon des procédures démocratiques prennent des décisions dans le cadre du constitutionnalisme en établissant une constitution qui garantit la liberté individuelle et les droits fondés sur la dignité humaine. La démocratie libérale repose sur des élections équitables, les droits de propriété privée, la séparation du gouvernement et des autres agences gouvernementales (dite séparation des trois pouvoirs), l'État civil, la protection des droits civils et l'égalité devant la loi."
 liberalism: "Libéralisme"
 liberalism_desc: "£Ideology_Liberalism_pic\n\n\n\n\n\n\n\n\nLe libéralisme est une idée politique qui soutient l'égalité devant la loi, la protection des droits civils, y compris la liberté, et la liberté d'expression et de religion. En d'autres termes, le libéralisme est une idée qui soutient la liberté individuelle et cherche à se libérer du contrôle injuste ou de l'oppression, de la discrimination, des contrôles et de l'obstruction de toute personne puissante. C'est un concept qui se distingue clairement de « l'indulgence » sans ordre ni discipline."
 libertarianism: "Libertarisme"
 libertarianism_desc: "£Ideology_Libertarianism_pic\n\n\n\n\n\n\n\n\nLe libertarianisme est un ensemble de philosophies et de mouvements politiques qui défendent la liberté comme principe fondamental. Les libertaires cherchent à maximiser la liberté politique et l'autonomie, en mettant l'accent sur la liberté de choix, l'association volontaire et le jugement individuel. Les libertaires partagent un scepticisme à l'égard de l'autorité et du pouvoir de l'État, mais ils divergent sur l'ampleur de leur opposition aux systèmes politiques et économiques existants."

