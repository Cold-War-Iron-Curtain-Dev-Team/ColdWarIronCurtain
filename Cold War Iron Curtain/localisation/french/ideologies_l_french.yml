 centrism: "Centrisme"
 centrism_desc: "£Ideology_Centrism_pic\n\n\n\n\n\n\n\n\nLe centrisme est une idéologie politique qui cherche à trouver un juste milieu entre les extrêmes du spectre politique. Cette perspective souligne l'importance d'équilibrer l'égalité sociale - qui vise à fournir un traitement et des opportunités équitables à tous les individus - avec la reconnaissance de la hiérarchie sociale, qui reconnaît que certaines structures et certains rôles peuvent naturellement exister au sein de la société. Les centristes plaident généralement en faveur de politiques favorisant un changement progressif et le pragmatisme, plutôt que des réformes radicales qui pourraient conduire à un changement substantiel vers des idéologies de gauche ou de droite. En soutenant une approche mesurée de la gouvernance et de l'élaboration des politiques, le centrisme vise à favoriser la stabilité et l'inclusion, en permettant la diversité des points de vue tout en évitant la polarisation."
 FRA_centrism_desc: "£Ideology_Centrism_FRA_pic\n\n\n\n\n\n\n\n\nLe centrisme est une idéologie politique qui cherche à trouver un juste milieu entre les extrêmes du spectre politique. Cette perspective souligne l'importance d'équilibrer l'égalité sociale - qui vise à fournir un traitement et des opportunités équitables à tous les individus - avec la reconnaissance de la hiérarchie sociale, qui reconnaît que certaines structures et certains rôles peuvent naturellement exister au sein de la société. Les centristes plaident généralement en faveur de politiques favorisant un changement progressif et le pragmatisme, plutôt que des réformes radicales qui pourraient conduire à un changement substantiel vers des idéologies de gauche ou de droite. En soutenant une approche mesurée de la gouvernance et de l'élaboration des politiques, le centrisme vise à favoriser la stabilité et l'inclusion, en permettant la diversité des points de vue tout en évitant la polarisation."
 libertarian_populism: "Populisme libertaire"
 libertarian_populism_desc: "£Ideology_Libertarian_Populism_pic\n\n\n\n\n\n\n\n\nPopulisme libertaire."
 majimboism: "Majimboïsme"
 majimboism_desc: "£Ideology_Majimboism_pic\n\n\n\n\n\n\n\n\nMajimboïsme."
 mexican_constitutionalism: "Constitutionnalisme mexicain"
 mexican_constitutionalism_desc: "£Ideology_Mexican_Constitutionalism_pic\n\n\n\n\n\n\n\n\nInitialement ancrée dans les idéaux de la révolution mexicaine - réforme agraire, droits du travail et anti-impérialisme - elle a structuré la société en secteurs contrôlés par l'État (syndicats, ligues paysannes) pour échanger le patronage contre la loyauté. Tout en maintenant une rhétorique centriste de la « voie médiane », il a gouverné par la fraude électorale, la répression et la modernisation contrôlée. Dans les années 1980 et 1990, le PRI s'est tourné vers le néolibéralisme (privatisations, ALENA), abandonnant ses racines populistes. Son idéologie n'a jamais été figée, mais plutôt un outil de pouvoir, passant d'un étatisme de gauche à des politiques de libre marché de droite tout en préservant la domination des élites par la coercition et la cooptation."
 nordic_agrarianism: "L'agrarianisme nordique"
 nordic_agrarianism_desc: "£Ideology_Nordic_Agrarianism_pic\n\n\n\n\n\n\n\n\nL'agrisme nordique."
 populism: "Populisme"
 populism_desc: "£Ideology_Populism_pic\n\n\n\n\n\n\n\n\nDans le paysage politique turbulent du XXe siècle, le populisme centriste est apparu comme une force qui a canalisé le mécontentement des masses vers des réformes modérées, se distinguant de la gauche et de la droite radicales en combinant des appels anti-establishment avec une gouvernance pragmatique. Cette tendance populiste est souvent apparue pendant les périodes de crise - effondrement économique, scandales de corruption ou déclin institutionnel - lorsque les partis traditionnels perdaient leur crédibilité et que les électeurs rejetaient les alternatives révolutionnaires. Des dirigeants comme l'Argentin Arturo Frondizi (1958-1962) et le Vénézuélien Rómulo Betancourt (1959-1964) ont illustré cette approche, utilisant une rhétorique populiste pour mobiliser de larges coalitions tout en poursuivant des politiques développementistes qui équilibraient l'intervention de l'État et les investissements étrangers. Au Pérou, la campagne « Marche vers les Andes » de Fernando Belaúnde Terry dans les années 196 mélangeait symbolisme nationaliste et projets d'infrastructure centristes, présentant les solutions technocratiques comme une croisade morale pour les marginalisés. L'attrait résidait dans son ambiguïté : il promettait un changement sans bouleversement, attaquant les oligarchies tout en évitant les réformes agraires ou les expropriations qui pourraient déclencher une réaction des élites."
 Three_principles_of_people: "Tridémisme"
 Three_principles_of_people_desc: "£Ideology_Tridemism_pic\n\n\n\n\n\n\n\n\nLe tridémisme suit la philosophie de Sun Yat-sen, connue sous le nom de doctrine San-Min. Ces 3 principes se traduisent souvent par nationalisme (Minzu), démocratie (Minquan) et bien-être (Minsheng). Afin de réaliser ces principes, le pays doit passer par les trois phases de la révolution, en commençant par un régime militaire qui se concentre sur l'élimination de la corruption et des opposants à la révolution, suivi de la deuxième phase qui est une période de transition, au cours de laquelle une constitution provisoire sera promulguée. Son objectif est de construire un système d'autonomie locale pour le développement de la démocratie. La troisième étape, qui marque l'achèvement de la reconstruction nationale, inaugurera un gouvernement constitutionnel. Durant cette période, les organes autonomes des différentes circonscriptions devraient exercer le pouvoir politique direct du peuple."
 trumpism_centrist: "Trumpisme"
 trumpism_centrist_desc: "£Ideology_Trumpism_Centrist_pic\n\n\n\n\n\n\n\n\nTrumpisme (indépendant)."
  
