 african_socialism: "Socialisme africain"
 african_socialism_desc: "£Ideology_African_Socialism_pic\n\n\n\n\n\n\n\n\nLe socialisme africain et l'afro-marxisme sont une croyance dans le partage des ressources économiques d'une manière traditionnelle africaine, par opposition au socialisme classique. Les principes communs du socialisme africain sont le développement social guidé par un vaste secteur public, intégrant l'identité africaine et ce que signifie être africain, et l'évitement du développement de classes sociales au sein de la société."
 ZIM_african_socialism_desc: "£Ideology_African_Socialism_ZIM_pic\n\n\n\n\n\n\n\n\nLe socialisme africain et l'afro-marxisme sont une croyance dans le partage des ressources économiques d'une manière traditionnelle africaine, par opposition au socialisme classique. Les principes communs du socialisme africain sont le développement social guidé par un vaste secteur public, intégrant l'identité africaine et ce que signifie être africain, et l'évitement du développement de classes sociales au sein de la société."
 bolivarianism: "Bolivarisme"
 bolivarianism_desc: "£Ideology_Bolivarianism_pic\n\n\n\n\n\n\n\n\nLe bolivarianisme, défendu par Hugo Chávez, est une idéologie nationaliste et socialiste de gauche enracinée dans les idéaux révolutionnaires de Simón Bolívar, réinventée pour le Venezuela moderne avec de fortes influences anti-impérialistes, populistes et marxistes. Au coeur de la vision de Chávez se trouvait le rejet de l'hégémonie américaine et du capitalisme néolibéral, favorisant plutôt l'unité latino-américaine, la souveraineté économique et la redistribution des richesses contrôlée par l'État. Son gouvernement a nationalisé des industries clés - en particulier le pétrole - pour financer de vastes programmes de protection sociale (misiones) visant à réduire la pauvreté et à élargir l'accès aux soins de santé, à l'éducation et au logement. Sur le plan politique, le chavisme a mis l'accent sur la démocratie participative à travers des conseils communaux et des réformes constitutionnelles, consolidant le pouvoir sous une direction centralisée et charismatique tout en donnant rhétoriquement du pouvoir aux marginalisés. Idéologiquement, il mélangeait le panaméricanisme de Bolivar avec la rhétorique de la lutte des classes, se positionnant comme une alternative radicale au capitalisme et un phare pour les mouvements de gauche régionaux, bien que les critiques l'aient dénoncé comme un populisme autoritaire masquant la mauvaise gestion économique et l'érosion démocratique."
 buddhist_socialism: "Socialisme bouddhiste"
 buddhist_socialism_desc: "£Ideology_Buddhist_Socialism_pic\n\n\n\n\n\n\n\n\nLe socialisme bouddhiste est une idéologie qui cherche à mélanger les enseignements éthiques et spirituels du bouddhisme avec les principes socialistes d'égalité, de bien-être communautaire et de justice économique. Il est apparu comme une réponse unique aux défis socio-économiques auxquels sont confrontés les pays à majorité bouddhiste, en particulier en Asie du Sud-Est. Les partisans du socialisme bouddhiste proposent un système dans lequel la richesse matérielle est distribuée pour réduire la pauvreté et la souffrance, mais en mettant toujours l'accent sur l'intégrité morale et la responsabilité personnelle.\n\nÀ la base, le socialisme bouddhiste enseigne que l'avidité et l'égoïsme - les principales causes de souffrance selon la doctrine bouddhiste - devraient être minimisés au sein de la société grâce à la propriété communautaire et à une gouvernance altruiste. Contrairement au socialisme laïc, il évite la lutte des classes comme voie vers la justice, mais promeut plutôt la compassion, l'harmonie et une gouvernance consciente pour parvenir à l'égalité sociale et économique. Des partisans influents comme U Nu au Myanmar et Tenzin Gyatso, le 14e Dalaï Lama, ont soutenu que le socialisme bouddhiste pourrait apporter un monde plus pacifique, moral et équilibré, répondant à la fois aux besoins matériels et spirituels de la société."
 democratic_socialist: "Socialisme démocratique"
 democratic_socialist_desc: "£Ideology_Democratic_Socialism_pic\n\n\n\n\n\n\n\n\nLe socialisme démocratique est une philosophie politique qui prône la démocratie politique parallèlement à la propriété sociale des moyens de production, en mettant l'accent sur l'autogestion et la gestion démocratique des institutions économiques au sein d'un marché ou d'une certaine forme d'économie socialiste planifiée décentralisée."
 AST_democratic_socialist_desc: "£Ideology_Democratic_Socialism_AST_pic\n\n\n\n\n\n\n\n\nLe socialisme démocratique est une philosophie politique qui prône la démocratie politique parallèlement à la propriété sociale des moyens de production, en mettant l'accent sur l'autogestion et la gestion démocratique des institutions économiques au sein d'un marché ou d'une certaine forme d'économie socialiste planifiée décentralisée."
 islamic_socialism: "Socialisme islamique"
 islamic_socialism_desc: "£Ideology_Islamic_Socialism_pic\n\n\n\n\n\n\n\n\nLe socialisme islamique est une idéologie politique qui fusionne les principes éthiques islamiques avec les politiques économiques socialistes, visant à établir une société juste par le biais d'une redistribution des richesses dirigée par l'État, de mesures anti-exploitation et d'un contrôle public des ressources clés tout en adhérant aux enseignements islamiques. Apparu de manière importante au milieu du XXe siècle, il a servi d'alternative postcoloniale au capitalisme occidental et au communisme athée, en particulier dans les pays à majorité musulmane. L'idéologie met l'accent sur la justice économique à travers des mécanismes islamiques comme la Zakat (aumône obligatoire) et l'interdiction de la riba (usure), ainsi que des politiques d'inspiration socialiste telles que les réformes agraires, la nationalisation des industries et les programmes sociaux. Des dirigeants comme Gamal Abdel Nasser en Égypte, Ahmed Ben Bella en Algérie et Mouammar Kadhafi en Libye ont expérimenté des variantes du socialisme islamique, mêlant anti-impérialisme, unité panarabe ou panislamique et développement dirigé par l'État. Les critiques affirment qu'il donne souvent la priorité à une gouvernance autoritaire plutôt qu'à la participation démocratique, tandis que ses partisans y voient un moyen d'atteindre des objectifs égalitaires sans rejeter l'identité islamique. L'héritage de cette idéologie persiste dans les débats sur le développement équitable dans un cadre islamique, même si son influence a diminué après la fin du XXe siècle avec la montée du néolibéralisme et des mouvements islamistes prônant un islam de libre marché ou des modèles théocratiques."
 jamahiriya: "Troisième théorie internationale"
 jamahiriya_desc: "£Ideology_Jamahiriya_pic\n\n\n\n\n\n\n\n\nL'idéologie de la Jamahiriya de Mouammar Kadhafi, décrite dans son Livre vert, est un système politique unique qui rejette à la fois le capitalisme et le communisme, promouvant une troisième voie basée sur la démocratie directe. Il met l'accent sur la gouvernance décentralisée à travers les comités populaires locaux, où les citoyens participent directement à la prise de décision. Kadhafi prône le socialisme libyen, avec la propriété étatique des industries clés et la redistribution des richesses. Son idéologie s'étend au panarabisme et au panafricanisme, visant l'unité entre les nations arabes et africaines. Bien qu'il promeuve la justice sociale et l'anti-impérialisme, le système est souvent critiqué pour son caractère autoritaire, Kadhafi gardant le contrôle du pays."
 labor_zionism_mapai: "Le sionisme travailliste"
 labor_zionism_mapai_desc: "£Ideology_Labor_Zionism_pic\n\n\n\n\n\n\n\n\nLe sionisme travailliste est l'aile gauche du mouvement sioniste. Pendant de nombreuses années, c'était la tendance la plus importante parmi les sionistes et les organisations sionistes. Il se considérait comme le secteur sioniste des mouvements ouvriers juifs historiques d'Europe centrale et orientale, développant finalement des unités locales dans la plupart des pays comptant une population juive importante. Les sionistes travaillistes croient qu'un État juif ne peut être créé que grâce aux efforts de la classe ouvrière juive s'installant en Terre d'Israël et construisant un État par la création d'une société juive progressiste avec des kibboutzim et des moshavim ruraux et un prolétariat juif urbain."
 marhaenism: "Marhaenisme"
 marhaenism_desc: "£Ideology_Marhaenism_pic\n\n\n\n\n\n\n\n\nL'administration de l'Ordre Nouvel de Suharto, le deuxième président de l'Indonésie, a fortement soutenu Pancasila. Son gouvernement a promu les cinq principes comme idéologie nationale clé. Ils ont été présentés comme représentant l'ancienne sagesse du peuple indonésien, antérieure à l'introduction de religions étrangères telles que l'hindouisme et l'islam. Dans un discours de juillet 1982 qui reflétait son attachement aux croyances javanaises, Suharto a glorifié Pancasila comme la clé pour atteindre la vie parfaite (javanais : ilmu kasampurnaning urip) d'harmonie avec Dieu et ses semblables."
 market_socialism: "Socialisme de marché"
 market_socialism_desc: "£Ideology_Market_Socialism_pic\n\n\n\n\n\n\n\n\nLe socialisme de marché est un type de système économique impliquant la propriété publique, coopérative ou sociale des moyens de production dans le cadre d'une économie de marché."
 neocommunism: "Néocommunisme"
 neocommunism_desc: "£Ideology_Neocommunism_pic\n\n\n\n\n\n\n\n\nNéocommunisme."
 nkrumaism: "Nkrumaïsme"
 nkrumaism_desc: "£Ideology_Nkrumaism_pic\n\n\n\n\n\n\n\n\nLe nkrumaïsme est la philosophie politique et idéologique développée par Kwame Nkrumah, premier président du Ghana et figure de proue du mouvement panafricain. Il a émergé pendant la lutte pour l'indépendance africaine et a été façonné par l'anticolonialisme, le socialisme et le panafricanisme. Le nkrumaïsme cherchait à fournir un cadre pour la libération, l'unité et le développement de l'Afrique. À la base, le nkrumaïsme met l'accent sur l'anticolonialisme et la libération, plaidant pour le rejet complet du colonialisme, de l'impérialisme et du néocolonialisme tout en poussant à l'indépendance politique et économique des nations africaines. Le panafricanisme et l'unité africaine sont au coeur de l'idéologie, Nkrumah envisageant des États-Unis d'Afrique - un gouvernement continental pour assurer la force collective de l'Afrique - et promouvant activement l'Organisation de l'unité africaine (OUA), le précurseur de l'Union africaine. Sur le plan économique, le nkrumaïsme soutient le socialisme africain, mêlant les principes socialistes aux traditions communautaires africaines pour plaider en faveur d'une industrialisation dirigée par l'État, d'une redistribution des richesses et de l'autosuffisance économique afin de rompre la dépendance vis-à-vis des anciennes puissances coloniales. Politiquement, il favorise un État socialiste à parti unique, arguant que les systèmes multipartites dans l'Afrique postcoloniale pourraient conduire à la division et à l'ingérence néocoloniale, promouvant plutôt un modèle de gouvernance centralisé et discipliné. De plus, le Nkrumaism met l'accent sur la renaissance culturelle et l'éducation, en soulignant l'importance de décoloniser les esprits africains, de faire revivre les cultures autochtones et d'utiliser l'éducation comme outil de développement national et de formation idéologique. Enfin, il met l'accent sur l'antinéocolonialisme, mettant en garde contre le maintien de la domination économique et politique occidentale même après l'indépendance et appelant à des politiques économiques donnant la priorité aux intérêts africains. Le nkrumaïsme reste influent dans les discussions sur l'unité africaine, le socialisme et le développement, inspirant les mouvements et les dirigeants de tout le continent."
 popular_socialism: "Socialisme populaire"
 popular_socialism_desc: "£Ideology_Popular_Socialism_pic\n\n\n\n\n\n\n\n\nSocialisme populaire."
 racial_populism: "Populisme racial"
