 afrikanernasionalisme: "Afrikanernasionalisme"
 afrikanernasionalisme_desc: "£Ideology_Afrikanernasionalisme_pic\n\n\n\n\n\n\n\nLe nationalisme afrikaner est une idéologie promouvant l'unification des Blancs de langue afrikaans pour garantir l'autodétermination absolue des Afrikaners blancs et leur domination politique et culturelle. Il combinait des croyances religieuses calvinistes, une identité linguistique distincte et un sentiment anti-britannique."
 Bourguibism: "Bourguibisme"
 Bourguibism_desc: "£Ideology_Bourguibism_pic\n\n\n\n\n\n\n\n\nBourguibisme."
 dixiecrat: "Populisme du Sud (populiste Dixiecrat)"
 dixiecrat_desc: "£Ideology_Dixiecrat_pic\n\n\n\n\n\n\n\n\nDixiecrat (nationaliste)."
 ethnic_nationalism: "Ethnonationalisme"
 ethnic_nationalism_desc: "£Ideology_Ethnic_Nationalism_pic\n\n\n\n\n\n\n\n\nL'ethnonationalisme est une forme de nationalisme dans laquelle la nation et la nationalité sont définies en termes d'appartenance ethnique, en mettant l'accent sur une approche ethnocentrique (et dans certains cas ethnocratique) de diverses questions politiques liées à l'affirmation nationale d'un groupe ethnique particulier."
 ilminism: "Ilminisme"
 ilminism_desc: "£Ideology_Ilminism_pic\n\n\n\n\n\n\n\n\nL'ilminisme est une idéologie dominante qui « éliminons les divisions internes du peuple », qui a été désignée comme poème national par le président de l'époque Syngman Rhee en 1949. Elle a été théorisée par Ahn Ho-sang, le premier ministre de la Culture et de l'Éducation et philosophe.\nL'ilminisme inclut le nationalisme ethnique et contient même un peu de fascisme. L'idée la plus fondamentale de cette idée est le conservatisme autoritaire."
 islamic_nationalism: "Nationalisme islamique"
 islamic_nationalism_desc: "£Ideology_Islamic_Nationalism_pic\n\n\n\n\n\n\n\n\nLe prophète Mahomet a déclaré avec audace :\n\n§Y\"Quiconque se bat sous la bannière de la folie, soutient le tribalisme ou se met en colère pour le tribalisme mourra dans un état d'ignorance.\"§!\n\nL'Islam exige l'allégeance à la foi, à la justice et à la fraternité des croyants, et non aux États-nations.\n\nEt pourtant, l'islamisme s'est emparé de l'imaginaire nationaliste du monde islamique postcolonial. Beaucoup de ceux qui ont obtenu leur indépendance grâce à une longue domination étrangère ont tenté de façonner leur identité islamique dans un cadre national. Cette fusion place l'Islam comme l'âme moulée dans l'engin du nationalisme. Équilibrer un acte entre l'universalisme abstrait de la Oumma et la situation réelle de l'État."
 langism: "Langisme"
 langism_desc: "£Ideology_Langism_pic\n\n\n\n\n\n\n\n\nLangisme."
 left_nationalist: "Nationalisme de gauche"
 left_nationalist_desc: "£Ideology_Left_Wing_Nationalism_pic\n\n\n\n\n\n\n\n\nLe nationalisme de gauche est une forme de nationalisme qui promeut l'élévation des normes sociétales pour son propre peuple national, généralement par l'introduction de l'égalité sociale et de la nationalisation gouvernementale. Le nationalisme de gauche est souvent anti-impérialiste et peut généralement représenter des fronts de libération nationale. En général, le nationalisme de gauche sera une réponse à l'exploitation répétée d'une nation par des facteurs extérieurs."
 national_democrat: "Nationalisme civique"
 national_democrat_desc: "£Ideology_National_Democracy_pic\n\n\n\n\n\n\n\n\nLe nationalisme civique représente une vision convaincante de ce que signifie appartenir à une nation. Il définit la nation non pas à travers le prisme de l'appartenance ethnique, de la religion ou des traditions héritées, mais à travers les valeurs, les institutions et les responsabilités civiques partagées qui unissent ses citoyens. Cette idéologie souligne que l'appartenance à la nation est à la fois volontaire et inclusive, fondamentalement ancrée dans l'allégeance à un cadre politique commun et dans un engagement envers les principes démocratiques et l'État de droit. Dans cette perspective, la nation se présente comme une communauté d'égaux, liés par le respect mutuel et un dévouement collectif au bien commun.\n\nAdopter le nationalisme civique signifie reconnaître que la diversité d'origine enrichit la nation plutôt qu'elle ne la menace, à condition que tous les citoyens s'engagent envers les mêmes idéaux civiques. Le patriotisme, dans ce cadre, se manifeste par un engagement actif dans la vie politique, la protection des libertés individuelles et un respect inébranlable de la loi. En rejetant l'exclusion fondée sur l'ascendance, le nationalisme civique souligne que l'unité naît de la participation active et du consentement du peuple. En s'efforçant de concrétiser cette vision, le nationalisme civique vise à forger une société stable et démocratique où l'identité est façonnée par une citoyenneté partagée et des objectifs communs, transcendant les lignées et les droits de naissance."
 nationalist_ideology: "Nationalisme"
 nationalist_ideology_desc: "£Ideology_Nationalism_pic\n\n\n\n\n\n\n\n\nLe nationalisme est une idéologie politique qui met l'accent sur les intérêts de sa propre nation. Cela s'inscrit généralement dans le contexte de la défense de l'identité nationale et du territoire historique. Le nationalisme est un ensemble extrêmement diversifié de nombreuses idéologies différentes, même si ce qui est commun à la plupart des formes est la protection et l'amélioration des citoyens d'une nation et leur promotion aux dépens des intérêts des autres nations. Il s'agit le plus souvent d'une réponse à des facteurs extérieurs menaçants, que les habitants de l'État-nation considèrent comme nuisant à leurs propres intérêts."
 nationalist_populism: "Populisme nationaliste"
 nationalist_populism_desc: "£Ideology_Nationalist_Populism_pic\n\n\n\n\n\n\n\n\nPopulisme nationaliste."
 revolutionary_nationalism: "Nationalisme révolutionnaire"
 revolutionary_nationalism_desc: "£Ideology_Revolutionary_Nationalism_pic\n\n\n\n\n\n\n\n\nLe nationalisme révolutionnaire est une forme de nationalisme qui promeut l'élévation des normes sociétales pour son propre peuple national, généralement par l'introduction de l'égalité sociale et de la nationalisation gouvernementale. Le nationalisme révolutionnaire est souvent anti-impérialiste et peut généralement représenter des fronts de libération nationale. D'une manière générale, le nationalisme révolutionnaire sera une réponse à l'exploitation répétée d'une nation par des facteurs extérieurs."
 papua_nationalism: "Nationalisme papou"
 papua_nationalism_desc: "£Ideology_Papua_Nationalism_pic\n\n\n\n\n\n\n\n\nNationalisme papou."
 pan_africanism: "Panafricanisme"
 pan_africanism_desc: "£Ideology_Pan-Africanism_pic\n\n\n\n\n\n\n\n\nLe panafricanisme est un mouvement mondial qui vise à encourager et à renforcer les liens de solidarité entre toutes les personnes d'ascendance africaine. Fondé sur un destin commun remontant à la traite négrière atlantique, le mouvement s'étend au-delà des continents africains, avec une base de soutien importante parmi la diaspora africaine des Caraïbes, d'Amérique latine et des États-Unis."
 pan_arabism: "Nassérisme"
 pan_arabism_desc: "£Ideology_Nasserism_pic\n\n\n\n\n\n\n\n\nLe nassérisme est une idéologie révolutionnaire, inspirée par le deuxième président égyptien, Gamal Abdel Nasser ; en faveur de l'unification de ce que l'on appelle le monde arabe. Il affirme que le peuple arabe constitue une nation ou une fédération unique, fondée sur une langue et une culture communes, transcendant l'islam et le christianisme. Les partisans du nassérisme ont souvent été décrits comme représentant des positions politiques et économiques laïques, socialistes, nationalistes, socialement progressistes et anti-impérialistes."
 peronism: "Centre-péronisme"
 peronism_desc: "£Ideology_Center_Peronism_pic\n\n\n\n\n\n\n\n\nLe péronisme, en tant qu'idéologie politique dominante en Argentine aujourd'hui, est un mélange de justice sociale, de droits du travail et de nationalisme, avec un fort accent sur le rôle de l'État dans l'économie. Il plaide en faveur d'une redistribution des richesses et d'une amélioration du niveau de vie de la classe ouvrière, tout en garantissant que les syndicats et les organisations de travailleurs occupent une place centrale dans l'élaboration des politiques. L'idéologie promeut le protectionnisme économique, luttant pour la souveraineté nationale et réduisant l'influence étrangère. Le péronisme se positionne comme une « troisième position » entre le capitalisme et le socialisme, visant une économie mixte et équilibrée. Alors qu'il continue de défendre les réformes sociales et les appels populistes, sa gouvernance a été critiquée pour ses tendances autoritaires, avec une forte centralisation du pouvoir et un contrôle sur divers secteurs. Le mouvement reste profondément divisé, avec des factions allant des ailes les plus progressistes aux ailes conservatrices, mais il continue de façonner la voie de l'Argentine en se concentrant sur l'unité nationale et le bien-être de son peuple."
 pioneer_corporatism: "Corporatisme pionnier"
 pioneer_corporatism_desc: "£Ideology_Pioneer_Corporatism_pic\n\n\n\n\n\n\n\n\nVenez tous, fils du sol du Queensland..."
 provisional_government: "Gouvernement provisoire"
 provisional_government_desc: "£Ideology_Provisional_Government_pic\n\n\n\n\n\n\n\n\nGouvernement provisoire."
 revisionist_zionism: "Le sionisme révisionniste"
 revisionist_zionism_desc: "£Ideology_Revisionist_Zionism_pic\n\n\n\n\n\n\n\n\nFormé comme une opposition nationaliste et servant de base à la droite israélienne, le sionisme révisionniste envisage l'intégrité territoriale de la terre historique d'Israël et soutient le nationalisme juif. Les sionistes révisionnistes croyaient que les Juifs détenaient la souveraineté sur les deux rives du Jourdain et leurs partisans remettaient en question la légitimité du Royaume de Jordanie. Actuellement, le sionisme révisionniste est considéré comme une idéologie marginale, mais ses partisans ont récemment lancé une campagne visant à rendre l'idéologie plus modérée et donc plus éligible."
 stratocracy_nat: "Stratocratie"
 stratocracy_nat_desc: "£Ideology_Stratocracy_Nat_pic\n\n\n\n\n\n\n\n\nLa stratocratie est un système de gouvernement dans lequel l'armée dirige directement l'État, l'autorité politique reposant sur les forces armées plutôt que sur les institutions civiles. Contrairement aux dictatures militaires, qui peuvent résulter de coups d'État temporaires, une stratocratie est institutionnalisée : l'armée n'est pas seulement le pouvoir derrière le trône ; c'est le trône. Dans ce type de gouvernement, leadership politique et commandement militaire se chevauchent souvent, et la politique de l'État est avant tout façonnée par des considérations stratégiques et sécuritaires.\n\nHistoriquement, les stratocraties se sont développées dans des sociétés où le service militaire est à la fois un devoir civique et la principale voie d'accès au pouvoir politique. L'ancienne Sparte, où les citoyens servaient comme soldats à vie, constitue un excellent exemple de ce modèle.\n\nLes partisans de la gouvernance stratocratique affirment qu'elle offre discipline, unité et leadership décisif, surtout en période d'instabilité. Les critiques avertissent cependant que cela peut conduire à l'érosion des libertés civiles, à la suppression de la dissidence et à la subordination de la vie civile à un militarisme perpétuel."
 Three_principles_of_people_chiangist: "Tridémisme (Chiangisme)"
 Three_principles_of_people_chiangist_desc: "£Ideology_Tridemism_Nat_pic\n\n\n\n\n\n\n\n\nChiang Kai-Shek, conformément aux idéaux originaux de Sun Yat-Sen, cherche à faire respecter les Trois principes du peuple et à honorer l'héritage du père fondateur. Bien que Sun ait tendance à adopter une mentalité réformiste, la position de Chiang vire au conservatisme, donnant la priorité à la préservation de la culture et du patrimoine chinois. Il considère la démocratie non seulement comme une quête de liberté individuelle, mais aussi comme un moyen d'imposer une gouvernance disciplinée, contrairement à la démocratie individualiste occidentale. Sur le plan économique, Chiang envisage un système mixte, dans lequel la planification centrale gouvernementale coexiste avec la privatisation partielle de certaines industries. Cette approche permet un mélange de nationalisation et de privatisation, souvent décrit comme un « capitalisme de parti et d'État » par les critiques. De plus, Chiang donne la priorité à l'éradication du communisme dans son programme de politique étrangère, tout en préservant l'autonomie de la République de Chine afin de contrecarrer tout effort potentiel des États-Unis visant à soumettre la nation."
 Three_principles_of_people_nationalist: "Kuomintang (Faction Minzu)"
 Three_principles_of_people_nationalist_desc: "£Ideology_Kuomintang_Minzu_pic\n\n\n\n\n\n\n\n\nL'aile droite du Kuomintang est composée de membres défendant le principe Minzu, qui remonte à la philosophie de Sun Yat-sens du Tongmenghui. Le concept peut être compris comme un nationalisme civique et se concentre donc sur l'unification des différents groupes ethniques chinois face à l'agression impérialiste. Bien qu'opposée aux réformes sociales et constitutionnelles, la droite plaide en faveur de réformes financières pour renforcer les capacités industrielles du pays."
 
# Monarchism
