 democratic_islamism: "Modernisme islamique"
 democratic_islamism_desc: "£Ideology_Islamic_Modernism_pic\n\n\n\n\n\n\n\n\nLe modernisme islamique est apparu au XIXe siècle en réponse à la crise intellectuelle et politique du monde musulman. Il abordait les défis posés par le colonialisme européen, la stagnation interne et les progrès rapides de la science et de la gouvernance modernes. Les adeptes de ce mouvement ne cherchaient pas à abandonner la tradition islamique mais à la réinterpréter à la lumière de valeurs modernes telles que le rationalisme, le constitutionnalisme, l'éducation et le progrès. Ils croyaient que l'Islam n'avait jamais été destiné à entrer en conflit avec la raison.\n\nDes personnalités éminentes telles que Jamal al-Din al-Afghani, Muhammad Abduh et Rashid Rida ont dirigé ce mouvement. Ils ont contesté la pratique consistant à suivre aveuglément les décisions passées et ont plutôt plaidé en faveur de l'ijtihad, ou raisonnement indépendant, comme moyen de revitaliser la société islamique. Les modernistes islamiques ont souligné que même si le Coran et la Sunna sont intemporels, leurs interprétations doivent être renouvelées à chaque époque pour répondre aux nouvelles réalités. Cette perspective a permis l'intégration du constitutionnalisme, de la réforme du genre, de la recherche scientifique et des institutions laïques - non pas comme des déviations par rapport à l'Islam, mais comme une continuation de sa mission éthique."
 INO_democratic_islamism_desc: "£Ideology_Indonesia_Islamic_Modernism_pic\n\n\n\n\n\n\n\n\nLe modernisme islamique est apparu au XIXe siècle en réponse à la crise intellectuelle et politique du monde musulman. Il abordait les défis posés par le colonialisme européen, la stagnation interne et les progrès rapides de la science et de la gouvernance modernes. Les adeptes de ce mouvement ne cherchaient pas à abandonner la tradition islamique mais à la réinterpréter à la lumière de valeurs modernes telles que le rationalisme, le constitutionnalisme, l'éducation et le progrès. Ils croyaient que l'Islam n'avait jamais été destiné à entrer en conflit avec la raison.\n\nDes personnalités éminentes telles que Jamal al-Din al-Afghani, Muhammad Abduh et Rashid Rida ont dirigé ce mouvement. Ils ont contesté la pratique consistant à suivre aveuglément les décisions passées et ont plutôt plaidé en faveur de l'ijtihad, ou raisonnement indépendant, comme moyen de revitaliser la société islamique. Les modernistes islamiques ont souligné que même si le Coran et la Sunna sont intemporels, leurs interprétations doivent être renouvelées à chaque époque pour répondre aux nouvelles réalités. Cette perspective a permis l'intégration du constitutionnalisme, de la réforme du genre, de la recherche scientifique et des institutions laïques - non pas comme des déviations par rapport à l'Islam, mais comme une continuation de sa mission éthique."
 ibadi_immamate: "Imamat ibadite"
