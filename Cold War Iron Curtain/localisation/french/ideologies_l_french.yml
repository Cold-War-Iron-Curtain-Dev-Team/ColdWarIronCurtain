 christian_democracy: "Démocratie chrétienne"
 christian_democracy_desc: "£Ideology_Christian_Democracy_pic\n\n\n\n\n\n\n\n\nLa démocratie chrétienne est une forme de conservatisme et une idéologie politique apparue dans l'Europe du XIXe siècle sous l'influence de l'enseignement social catholique ainsi que du néo-calvinisme. Il s'est développé en réponse aux transformations sociales, politiques et économiques provoquées par l'industrialisation, la laïcisation et la montée des mouvements libéraux et socialistes. Conçue à l'origine comme une synthèse des croyances catholiques traditionnelles et des principes démocratiques modernes, la démocratie chrétienne cherchait à concilier les valeurs morales religieuses avec le gouvernement représentatif, le constitutionnalisme et la responsabilité sociale, en mettant l'accent sur la dignité de la personne humaine, le rôle central de la famille et l'importance de l'harmonie sociale.\n\nAu fil du temps, la démocratie chrétienne s'est étendue au-delà de ses fondements catholiques initiaux et a intégré les enseignements sociaux d'autres confessions chrétiennes, notamment l'Église luthérienne et l'Église réformée. Cette influence oecuménique plus large a renforcé son engagement en faveur de la justice sociale, de la solidarité et de la subsidiarité tout en maintenant une vision fondamentalement conservatrice enracinée dans l'éthique chrétienne. En conséquence, la démocratie chrétienne a évolué vers une tradition politique mêlant valeurs religieuses et gouvernance démocratique, façonnant les mouvements et partis politiques à travers l'Europe tout en mettant l'accent sur l'ordre moral, le bien-être social et la responsabilité communautaire."
 GRE_christian_democracy_desc: "£Ideology_Christian_Democracy_GRE_pic\n\n\n\n\n\n\n\n\nLa démocratie chrétienne est une forme de conservatisme et une idéologie politique apparue dans l'Europe du XIXe siècle sous l'influence de l'enseignement social catholique ainsi que du néo-calvinisme. Il s'est développé en réponse aux transformations sociales, politiques et économiques provoquées par l'industrialisation, la laïcisation et la montée des mouvements libéraux et socialistes. Conçue à l'origine comme une synthèse des croyances catholiques traditionnelles et des principes démocratiques modernes, la démocratie chrétienne cherchait à concilier les valeurs morales religieuses avec le gouvernement représentatif, le constitutionnalisme et la responsabilité sociale, en mettant l'accent sur la dignité de la personne humaine, le rôle central de la famille et l'importance de l'harmonie sociale.\n\nAu fil du temps, la démocratie chrétienne s'est étendue au-delà de ses fondements catholiques initiaux et a intégré les enseignements sociaux d'autres confessions chrétiennes, notamment l'Église luthérienne et l'Église réformée. Cette influence oecuménique plus large a renforcé son engagement en faveur de la justice sociale, de la solidarité et de la subsidiarité tout en maintenant une vision fondamentalement conservatrice enracinée dans l'éthique chrétienne. En conséquence, la démocratie chrétienne a évolué vers une tradition politique mêlant valeurs religieuses et gouvernance démocratique, façonnant les mouvements et partis politiques à travers l'Europe tout en mettant l'accent sur l'ordre moral, le bien-être social et la responsabilité communautaire."
 industrial_grouperism: "Grouperisme industriel"
 industrial_grouperism_desc: "£Ideology_Industrial_Grouperism_pic\n\n\n\n\n\n\n\n\nGrouperisme industriel."
 italian_christian_democracy: "Démocratie chrétienne"
 italian_christian_democracy_desc: "£Ideology_Italian_Christian_Democracy_pic\n\n\n\n\n\n\n\n\nEnracinée dans la tradition de l'enseignement social catholique et inspirée par l'héritage du Partito Popolare Italiano d'avant-guerre, la démocratie chrétienne se présente comme un vaste mouvement centriste - ni réactionnaire ni révolutionnaire. Il tire sa force de la paysannerie rurale, des classes moyennes urbaines, des fidèles fervents et de ceux qui recherchent une alternative morale et stable aux extrêmes du fascisme et du communisme. Avant tout, il défend une démocratie guidée par l'éthique chrétienne, plaçant la dignité de la personne humaine, de la famille, du travail et de la justice sociale au centre de la reconstruction nationale.\n\nDepuis la libération, les démocrates-chrétiens ont travaillé à façonner une nouvelle Italie, en aidant à rédiger la Constitution, en guidant la reprise économique et en relevant les défis de la reconstruction avec le soutien du Vatican et une étroite coopération avec les puissances occidentales. Le parti rejette le conflit de classe en faveur de la solidarité et de la coopération corporative entre travailleurs et employeurs. Elle soutient le marché, mais non sans retenue morale et sans responsabilité publique."
