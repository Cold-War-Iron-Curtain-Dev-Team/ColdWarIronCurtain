 anarcho_communism: "Anarcho-communisme"
 anarcho_communism_desc: "£Ideology_Anarcho_Communism_pic\n\n\n\n\n\n\n\n\nL'anarcho-communisme est une théorie de l'anarchisme qui prône l'abolition de l'État, du capitalisme, du travail salarié et de la propriété privée en faveur de la propriété commune des moyens de production, de la démocratie directe et d'un réseau horizontal de conseils ouvriers avec une production et une consommation basées sur le principe directeur : De chacun selon ses capacités, à chacun selon ses besoins."
 eurocommunism: "Eurocommunisme"
 eurocommunism_desc: "£Ideology_Eurocommunism_pic\n\n\n\n\n\n\n\n\nL'eurocommunisme est une interprétation ouest-européenne du marxisme qui rejette l'influence de l'Union soviétique et de son Parti communiste en faveur d'une voie démocratique vers le socialisme. Ses idées seraient nées lors du Printemps de Prague de 1968 et de l'invasion et de l'occupation ultérieures du pays par l'URSS."
 AST_eurocommunism_desc: "£Ideology_Eurocommunism_AST_pic\n\n\n\n\n\n\n\n\nL'eurocommunisme est une interprétation ouest-européenne du marxisme qui rejette l'influence de l'Union soviétique et de son Parti communiste en faveur d'une voie démocratique vers le socialisme. Ses idées seraient nées lors du Printemps de Prague de 1968 et de l'invasion et de l'occupation ultérieures du pays par l'URSS."
 ho_chi_minh_thought_revsoc: "Pensée Hô Chi Minh"
 ho_chi_minh_thought_revsoc_desc: "£Ideology_Ho_Chi_Minh_Thought_RevSoc_pic\n\n\n\n\n\n\n\n\nLa Pensée Hô Chi Minh est l'idéologie officielle du Parti communiste vietnamien sous la direction du président Hô Chi Minh. Bien que fermement marxiste-léniniste, Ho croit en une réinterprétation plus nationaliste du marxisme pour les conditions uniques de la révolution vietnamienne, prenant même une certaine influence des « Trois principes du peuple » de Sun Yat-Sen et des révolutionnaires américains. La pensée Hô Chi Minh est aussi fièrement vietnamienne que communiste et appelle à une « révolution nationale démocratique » - une voie véritablement vietnamienne vers le socialisme où les ouvriers, les paysans, les soldats et les commerçants s'uniront contre les inégalités et l'impérialisme sous toutes ses formes."
 left_communism: "Communisme de gauche italien"
 left_communism_desc: "£Ideology_Italian_Left_Communism_pic\n\n\n\n\n\n\n\n\nCommunisme de gauche italien."
 left_wing_dictatorship: "Régime militaire de gauche"
 left_wing_dictatorship_desc: "£Ideology_Left_Wing_Dictatorship_pic\n\n\n\n\n\n\n\n\nDictature de gauche."
 posadism: "Posadisme"
 posadism_desc: "£Ideology_Posadism_pic\n\n\n\n\n\n\n\n\nPosadisme."
 revolutionary_islamic_socialism: "Socialisme islamique révolutionnaire"
 revolutionary_islamic_socialism_desc: "£Ideology_Revolutionary_Islamic_Socialism_pic\n\n\n\n\n\n\n\n\nProfondément influencé par les travaux d'Ali Shariati, le socialisme islamique révolutionnaire croit en l'Islam comme une force révolutionnaire destinée à créer une société sans classes. Ses idéologues actuels présentent les idées et les pratiques du martyre islamique comme étant historiquement opposées au féodalisme et au capitalisme. Ils soutiennent désormais que le zèle révolutionnaire islamique, en particulier parmi les chiites, doit être exploité pour achever le processus d'établissement d'une société sans classes. Les opposants accusent les partisans de cette idéologie de cacher le marxisme sous une couverture islamique, mais ses partisans affirment que l'islam est une composante vitale et rejettent la nature athée du marxisme."
 revolutionary_socialism: "Socialisme révolutionnaire"
 revolutionary_socialism_desc: "£Ideology_Revolutionary_Socialism_pic\n\n\n\n\n\n\n\n\nLe socialisme révolutionnaire est la doctrine socialiste selon laquelle la révolution sociale est nécessaire pour provoquer des changements structurels dans la société. Plus précisément, la révolution est une condition préalable nécessaire à la transition du capitalisme au socialisme."
 sandanista: "Sandaniste"
 sandanista_desc: "£Ideology_Sandanista_pic\n\n\n\n\n\n\n\n\nLe sandinisme est une idéologie politique de gauche qui tire son nom du défunt chef de la résistance nicaraguayenne Augusto Cesar Sandino. Fondé en 1961 par des intellectuels et révolutionnaires marxistes nicaraguayens, le sandinisme est un mouvement chrétien-socialiste et démocratique et pluraliste. Leurs tactiques de guérilla ont été critiquées par les groupes d'opposition, mais leur affiliation aux syndicats, aux groupes étudiants et à l'Église aide les sandinistes à conserver le soutien populaire."
 sartre_thought: "Pensée Sartre"
 sartre_thought_desc: "£Ideology_Sartre_Thought_pic\n\n\n\n\n\n\n\n\nPensée Sartre."
 Socialism_with_Chinese_Characteristics_tro: "Socialisme à la chinoise - Socialiste"
 Socialism_with_Chinese_Characteristics_tro_desc: "£Ideology_Chinese_Characteristics_RevSoc_pic\n\n\n\n\n\n\n\n\n"
 socialist_nationalism: "Nationalisme socialiste"
 socialist_nationalism_desc: "£Ideology_Socialist_Nationalism_pic\n\n\n\n\n\n\n\nNationalisme social (marxiste révisionniste)."
 syndicalism: "Le syndicalisme"
 syndicalism_desc: "£Ideology_Syndicalism_pic\n\n\n\n\n\n\n\n\nLe syndicalisme est une idéologie révolutionnaire de gauche pré-marxiste qui recherche la propriété et le contrôle total des moyens de production à travers le syndicalisme industriel en syndiquant les travailleurs selon leurs professions/spécialisations et en faisant avancer leurs revendications collectives par le biais de grèves et de violences contre les réactionnaires, les capitalistes et les forces gouvernementales. Influencés par les travaux de Proudhon, Georges Sorel,... Et par les luttes des syndicats français à la fin du XIXe siècle, les mouvements syndicalistes étaient à leur apogée au sein du mouvement de gauche mais ont finalement disparu lors de la montée de l'Union soviétique et du marxisme-léninisme après la Seconde Guerre mondiale."
 titoism: "Titisme"
 titoism_desc: "£Ideology_Titoism_pic\n\n\n\n\n\n\n\n\nLe titisme fait référence aux politiques et pratiques associées à Josip Broz Tito dans la période qui a suivi la Seconde Guerre mondiale, en particulier pendant la guerre froide. Il se caractérise par son opposition à l'Union soviétique et représente l'approche distincte de Tito dans la politique internationale de la guerre froide.\n\nLe titisme est apparu lorsque les partisans yougoslaves ont libéré la Yougoslavie sans l'aide de l'Armée rouge. En conséquence, la Yougoslavie est devenue le seul pays d'Europe de l'Est à maintenir un gouvernement socialiste tout en restant indépendant après la Seconde Guerre mondiale, résistant avec succès aux pressions de l'Union soviétique."
 trotskyism_ideology: "Trotskysme"
 trotskyism_ideology_desc: "£Ideology_Trotskyism_pic\n\n\n\n\n\n\n\n\nLe trotskisme est la théorie du marxisme défendue par le russe Léon Trotsky. Trotsky s'est identifié comme un marxiste orthodoxe et un bolchevique-léniniste. Il a soutenu la fondation d'un parti d'avant-garde du prolétariat, l'internationalisme prolétarien et une dictature du prolétariat basée sur l'auto-émancipation de la classe ouvrière et la démocratie de masse."
 
