 provisional_government_soclib: "Gouvernement provisoire"
 provisional_government_soclib_desc: "£Ideology_Provisional_Government_pic\n\n\n\n\n\n\n\n\nGouvernement provisoire."
 ZIM_provisional_government_soclib_desc: "£Ideology_Provisional_Government_ZIM_pic\n\n\n\n\n\n\n\n\nÉlu grâce au « Règlement interne », l'administration de l'évêque Abel Muzorewa visait à transférer le pouvoir à la majorité noire tout en préservant les privilèges économiques et militaires des Blancs. Cependant, faute de légitimité d'une reconnaissance internationale et en raison de l'échec persistant à mettre un terme aux guerres de brousse en cours des principaux mouvements de libération noirs, cette transition du pouvoir pourrait s'enflammer."
 social_liberal: "Libéralisme social"
 social_liberal_desc: "£Ideology_Social_Liberalism_pic\n\n\n\n\n\n\n\n\nLe social-libéralisme est une idéologie politique selon laquelle la liberté individuelle nécessite un certain niveau de justice sociale. Comme le libéralisme classique, le libéralisme social soutient une économie de marché et l'expansion des droits et libertés civils et politiques, mais s'en distingue en ce qu'il estime que le rôle légitime du gouvernement inclut la résolution de problèmes économiques et sociaux tels que la pauvreté, les soins de santé et l'éducation."
 AST_social_liberal_desc: "£Ideology_Social_Liberalism_AST_pic\n\n\n\n\n\n\n\n\nLe social-libéralisme est une idéologie politique selon laquelle la liberté individuelle nécessite un certain niveau de justice sociale. Comme le libéralisme classique, le libéralisme social soutient une économie de marché et l'expansion des droits et libertés civils et politiques, mais s'en distingue en ce qu'il estime que le rôle légitime du gouvernement inclut la résolution de problèmes économiques et sociaux tels que la pauvreté, les soins de santé et l'éducation."
 CAN_social_liberal_desc: "£Ideology_Social_Liberalism_CAN_pic\n\n\n\n\n\n\n\n\nLe social-libéralisme est une idéologie politique selon laquelle la liberté individuelle nécessite un certain niveau de justice sociale. Comme le libéralisme classique, le libéralisme social soutient une économie de marché et l'expansion des droits et libertés civils et politiques, mais s'en distingue en ce qu'il estime que le rôle légitime du gouvernement inclut la résolution de problèmes économiques et sociaux tels que la pauvreté, les soins de santé et l'éducation."
