 neo_nazism: "Néonazisme"
 neo_nazism_desc: "£Ideology_Neo_Nazism_pic\n\n\n\n\n\n\n\n\nLe néo-nazisme se compose de mouvements militants, sociaux ou politiques de l'après-Seconde Guerre mondiale cherchant à faire revivre l'idéologie du nazisme. Il emprunte des éléments à la doctrine nazie, notamment l'ultranationalisme, le racisme jusqu'à la xénophobie, le capacitisme, l'homophobie, l'antiromanisme, l'antisémitisme, l'anticommunisme et l'initiation du Quatrième Reich. La négation de l'Holocauste est une caractéristique courante, tout comme l'incorporation de symboles nazis et l'admiration pour Adolf Hitler."
 SAF_neo_nazism_desc: "£Ideology_Neo_Nazism_SAF_pic\n\n\n\n\n\n\n\n\nLe néo-nazisme se compose de mouvements militants, sociaux ou politiques de l'après-Seconde Guerre mondiale cherchant à faire revivre l'idéologie du nazisme. Il emprunte des éléments à la doctrine nazie, notamment l'ultranationalisme, le racisme jusqu'à la xénophobie, le capacitisme, l'homophobie, l'antiromanisme, l'antisémitisme, l'anticommunisme et l'initiation du Quatrième Reich. La négation de l'Holocauste est une caractéristique courante, tout comme l'incorporation de symboles nazis et l'admiration pour Adolf Hitler."
 repressive_autocracy: "Autocratie répressive"
 repressive_autocracy_desc: "£Ideology_Repressive_Autocracy_pic\n\n\n\n\n\n\n\n\nL'autocratie répressive est un système d'autorité absolue, caractérisé par la concentration du pouvoir entre les mains d'un seul individu exerçant un contrôle total sur l'État et ses citoyens. Faute de freins et de contrepoids, l'autocrate a souvent recours à la force, à l'intimidation et à la coercition pour maintenir la stabilité et le pouvoir. La répression de la dissidence, de l'opposition et des droits individuels suit peu de temps après, incluant souvent le recours à la police secrète, la détention arbitraire, la torture et les exécutions extrajudiciaires. Dans ce système de contrôle brutal, l'autocrate contrôle également l'économie, l'utilisant souvent pour récompenser les loyalistes et punir toute menace potentielle pour le pouvoir."
 rexism: "Rexisme"
 rexism_desc: "£Ideology_Rexism_pic\n\n\n\n\n\n\n\n\nFortement opposé aux idéaux libéraux et communistes, le rexisme est un mouvement nationaliste résolument conservateur qui prône une politique économique corporatiste. Utilisant une rhétorique de plus en plus populiste et autoritaire, leurs idéaux se rapprochent des autres mouvements fascistes."
 right_wing_peronism: "Péronisme de droite"
 right_wing_peronism_desc: "£Ideology_Right_Peronism_pic\n\n\n\n\n\n\n\n\nLe péronisme orthodoxe d'Isabel Perón, Raúl Lastiri et José López Rega combine la rhétorique tiers-positionniste et le néolibéralisme autoritaire. Tout en maintenant une posture anticommuniste et antilibérale, le gouvernement réprime violemment l'opposition de gauche à travers les escadrons de la mort de l'AAA tout en imposant des mesures d'austérité néolibérales comme le programme choc Rodrigazo - réduisant les salaires, réduisant les subventions et ouvrant l'économie aux capitaux étrangers. Malgré ses fondements syndicalistes traditionnels, le péronisme affaiblit activement les syndicats et démantèle les protections des travailleurs. Cette transformation réactionnaire transforme le justicialisme en un mélange contradictoire de terreur d'État et de libéralisation économique, trahissant la vision originale de Perón tout en ouvrant la voie à l'ère néolibérale ultérieure de l'Argentine. La répression brutale du régime contre la gauche reflète son virage économique vers la droite, exposant le péronisme orthodoxe comme une fusion instable de violence fasciste et de restructuration capitaliste."
 Salazarism: "Nouvel État (salazarisme)"
 Salazarism_desc: "£Ideology_Salazarism_pic\n\n\n\n\n\n\n\n\nLe salazarisme est une idéologie nationaliste autoritaire axée sur « Dieu, la patrie et la famille » et mettant l'accent sur le rôle social du catholicisme, le distinguant des variantes dominantes du fascisme."
 trujillism: "Trujillisme"
 trujillism_desc: "£Ideology_Trujillism_pic\n\n\n\n\n\n\n\n\nLe trujillisme est une idéologie politique et un culte de la personnalité construits autour du règne et de l'héritage de Rafael Leónidas Trujillo, le dirigeant autoritaire qui a dominé la République dominicaine pendant plus de trois décennies. À la base, le trujillisme se définit par une extrême concentration du pouvoir, une loyauté personnelle envers le leader, un nationalisme militarisé et la fusion de l'autorité de l'État avec l'identité d'un seul homme.\n\nIdéologiquement, le trujillisme mélange des éléments d'autoritarisme de droite, de centralisme nationaliste et d'anticommunisme, enveloppés dans une image soigneusement construite de Trujillo comme sauveur et incarnation de la nation. Dans ce système, l'État est présenté comme une extension de la volonté du dirigeant et toutes les institutions - militaires, politiques, religieuses et civiles - sont subordonnées à son autorité. Le régime a mis l'accent sur l'ordre, la discipline et la modernisation, se vantant souvent de projets d'infrastructures et de stabilité économique comme preuve du régime « bienveillant » de Trujillo, alors même que la répression, la surveillance et la violence écrasaient la dissidence.\n\nLe trujillisme promeut une société patriarcale et hiérarchique, glorifiant les valeurs traditionnelles, le contrôle social rigide et le nationalisme racial."
 ultra_afrikaner: "Ultra-Afrikaner"
 ultra_afrikaner_desc: "£Ideology_Ultra_Afrikaner_pic\n\n\n\n\n\n\n\n\n Ultra-Afrikanernasionalisme." 
 
