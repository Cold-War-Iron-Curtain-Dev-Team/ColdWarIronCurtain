 sunni_islamism: "Islamisme sunnite"
 sunni_islamism_desc: "£Ideology_Sunni_Islamism_pic\n\n\n\n\n\n\n\n\nL'islam sunnite est la plus grande confession de l'Islam. Son nom vient du mot Sunnah, faisant référence au comportement exemplaire du prophète islamique Mahomet"

