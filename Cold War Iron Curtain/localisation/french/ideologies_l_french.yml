 negusa_nagast: "Negusa Nagast"
 negusa_nagast_desc: "£Ideology_Negusa_Nagast_pic\n\n\n\n\n\n\n\n\nNegusa Nagast, ou roi des rois, est un type de monarchie impériale héréditaire sélective qui est devenue la direction dominante de l'Éthiopie depuis que Negus Zemene Mesafint a mis fin à la période de l'ère des princes où l'Éthiopie était divisée entre de petites principautés, royaumes et sultanats."
 regency: "Régence"
 regency_desc: "£Ideology_Regency_pic\n\n\n\n\n\n\n\n\nUne régence est une forme temporaire de gouvernance dans laquelle un régent exerce les pouvoirs et les devoirs d'un monarque incapable de gouverner en raison de circonstances spécifiques - le plus souvent une minorité (être trop jeune pour gouverner), une incapacité physique ou mentale ou une absence prolongée. Bien que le régent agisse avec l'autorité royale, il le fait en tant que gardien et non en tant que souverain à part entière.\n\nDes régences ont eu lieu tout au long de l'histoire dans les monarchies du monde entier, souvent en période de transition ou de crise. La structure et les limites d'une régence sont généralement définies par la loi ou la coutume et peuvent impliquer un seul régent ou un conseil de régents. Bien qu'il détienne un grand pouvoir, la légitimité d'un régent est toujours liée à l'autorité du monarque qu'il remplace, et son règne devrait prendre fin une fois que le monarque est en mesure de reprendre le trône."
 TIB_regency_desc: "£Ideology_Tibet_Regency_pic\n\n\n\n\n\n\n\n\nUne régence est une forme temporaire de gouvernance dans laquelle un régent exerce les pouvoirs et les devoirs d'un monarque incapable de gouverner en raison de circonstances spécifiques - le plus souvent une minorité (être trop jeune pour gouverner), une incapacité physique ou mentale ou une absence prolongée. Bien que le régent agisse avec l'autorité royale, il le fait en tant que gardien et non en tant que souverain à part entière.\n\nDes régences ont eu lieu tout au long de l'histoire dans les monarchies du monde entier, souvent en période de transition ou de crise. La structure et les limites d'une régence sont généralement définies par la loi ou la coutume et peuvent impliquer un seul régent ou un conseil de régents. Bien qu'il détienne un grand pouvoir, la légitimité d'un régent est toujours liée à l'autorité du monarque qu'il remplace, et son règne devrait prendre fin une fois que le monarque est en mesure de reprendre le trône."
 semi_constitutional_monarrchy: "Monarchie semi-constitutionnelle"
 semi_constitutional_monarrchy_desc: "£Ideology_Semi_Constitutional_Monarchy_pic\n\n\n\n\n\n\n\n\nMonarchie semi-constitutionnelle."
 vatican: "Papauté"
 vatican_desc: "£Ideology_Papacy_pic\n\n\n\n\n\n\n\n\nLa politique de la Cité du Vatican se déroule dans le cadre d'une monarchie élective absolue théocratique, dans laquelle le pape, religieusement parlant, chef de l'Église catholique romaine et évêque de Rome, exerce d'office le pouvoir législatif, exécutif et judiciaire suprême sur la Cité du Vatican, un cas rare de monarchie non héréditaire."

