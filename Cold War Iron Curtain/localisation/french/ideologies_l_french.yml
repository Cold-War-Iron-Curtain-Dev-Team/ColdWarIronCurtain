 authenticite: "Mobutuisme (Authenticite)"
 authenticite_desc: "£Ideology_Mobutuism_pic\n\n\n\n\n\n\n\n\nLe mobutuisme (ou Mobutisme en français) était l'idéologie officielle de l'État du Zaïre sous le règne de Mobutu Sese Seko (1965-1997), servant de doctrine politique destinée à légitimer son régime autoritaire et à promouvoir l'unité nationale sous sa direction. L'idéologie mélangeait nationalisme africain, anticolonialisme, autoritarisme et renouveau culturel, avec un fort accent sur la suprématie personnelle de Mobutu. Un élément clé était Authenticité (Authenticité), une campagne visant à rejeter les influences coloniales européennes et à promouvoir l'identité africaine, qui comprenait l'abandon des noms chrétiens au profit de noms africains (Mobutu lui-même a adopté le nom Mobutu Sese Seko Kuku Ngbendu wa za Banga) et décourageant les vêtements occidentaux en faveur de l'abacost (un costume sans cravate, symbolisant l'identité africaine). Le mobutuisme a également rejeté à la fois le capitalisme occidental et le communisme marxiste, préconisant plutôt une voie africaine soi-disant unique, même si en pratique, Mobutu s'est appuyé sur le soutien occidental (en particulier celui des États-Unis et de la Belgique) pour maintenir son pouvoir. Le régime a imposé le régime d'un parti unique sous le Mouvement populaire de la révolution (MPR), le seul parti politique légal, dont tous les citoyens étaient automatiquement considérés comme membres, tandis que Mobutu centralisait le pouvoir, éliminant l'opposition et cultivant un culte de la personnalité qui le présentait comme le leader indispensable de la nation. Sur le plan économique, le mobutuisme a favorisé le contrôle de l'État et les réseaux de clientélisme, même si la corruption et la mauvaise gestion généralisées ont conduit au déclin économique. Malgré sa rhétorique de fierté et d'indépendance africaines, le mobutuisme a finalement fonctionné comme un outil permettant de maintenir le contrôle autocratique de Mobutu sur le Zaïre plutôt que de favoriser un véritable développement ou une véritable démocratie."
 baathism: "Baasisme"
 baathism_desc: "£Ideology_Baathism_pic\n\n\n\n\n\n\n\n\n§HWahda, Hurriyya, Ishtirakiyya !§!\n\nLe Baasisme est une idéologie nationaliste arabe qui promeut le développement et la création d'un État arabe unifié à travers la direction d'un parti d'avant-garde sur un gouvernement révolutionnaire progressiste. Il est apparu au milieu du XXe siècle en réponse à l'influence coloniale et à la fragmentation du monde arabe, mettant l'accent sur l'unité, la liberté et le socialisme comme principes fondamentaux. L'idéologie cherche à transcender les divisions régionales, tribales et sectaires, plaidant plutôt en faveur d'une identité arabe unique liée par une langue, une culture et une expérience historique communes.\n\nAu coeur du baathisme se trouve la conviction que seul un parti discipliné et idéologiquement engagé peut guider la société à travers une transformation révolutionnaire vers la modernisation et l'indépendance. L'État, dans la pensée baathiste, joue un rôle dominant dans la direction du développement économique et social, incorporant souvent des éléments du socialisme pour assurer la redistribution des richesses et l'autosuffisance nationale. Bien que sa mise en oeuvre ait varié selon les pays, le Baathisme se présente systématiquement comme une force en faveur de l'anti-impérialisme, de la gouvernance laïque et de la revitalisation de la force et de l'unité arabes sur la scène mondiale."
 IRQ_baathism_desc: "£Ideology_Baathism_IRQ_pic\n\n\n\n\n\n\n\n\n§HWahda, Hurriyya, Ishtirakiyya !§!\n\nLe Baasisme est une idéologie nationaliste arabe qui promeut le développement et la création d'un État arabe unifié à travers la direction d'un parti d'avant-garde sur un gouvernement révolutionnaire progressiste. Il est apparu au milieu du XXe siècle en réponse à l'influence coloniale et à la fragmentation du monde arabe, mettant l'accent sur l'unité, la liberté et le socialisme comme principes fondamentaux. L'idéologie cherche à transcender les divisions régionales, tribales et sectaires, plaidant plutôt en faveur d'une identité arabe unique liée par une langue, une culture et une expérience historique communes.\n\nAu coeur du baathisme se trouve la conviction que seul un parti discipliné et idéologiquement engagé peut guider la société à travers une transformation révolutionnaire vers la modernisation et l'indépendance. L'État, dans la pensée baathiste, joue un rôle dominant dans la direction du développement économique et social, incorporant souvent des éléments du socialisme pour assurer la redistribution des richesses et l'autosuffisance nationale. Bien que sa mise en oeuvre ait varié selon les pays, le Baathisme se présente systématiquement comme une force en faveur de l'anti-impérialisme, de la gouvernance laïque et de la revitalisation de la force et de l'unité arabes sur la scène mondiale."
 dixiecrat_fascist: "Charançon de l'ébullition (Hardline Dixiecrat)"
 dixiecrat_fascist_desc: "£Ideology_Dixiecrat_pic\n\n\n\n\n\n\n\n\nDixiecrat (Fascisme)."
 falangism: "Falangisme"
 falangism_desc: "£Ideology_Falangism_pic\n\n\n\n\n\n\n\n\nLe phalangisme est une idéologie autoritaire et nationaliste d'extrême droite née en Espagne au début du XXe siècle. Il est le plus étroitement associé à la Phalange espagnole, un mouvement politique fasciste fondé par José Antonio Primo de Rivera. Le phalangisme promeut une vision d'unité nationale basée sur le traditionalisme catholique, le militarisme, l'anticommunisme et l'économie corporatiste, rejetant à la fois la démocratie libérale et le socialisme marxiste.\n\nÀ la base, le phalangisme cherche à créer un État totalitaire dans lequel tous les aspects de la société - politiques, économiques et culturels - sont subordonnés aux objectifs de la nation tels que définis par une identité unique et unifiée. Il met l'accent sur l'importance de la hiérarchie, du devoir et du sacrifice, glorifie l'héritage historique de la nation et considère l'individualisme comme une menace pour la cohésion sociale."
 fascism_ideology: "Troisième positionnisme (fascisme)"
 fascism_ideology_desc: "£Ideology_Fascism_pic\n\n\n\n\n\n\n\n\nEnglobant une variété de mouvements ultranationalistes, le troisième positionnisme vénère généralement le dévouement à l'État et l'unité du peuple sous un leader fort. Le troisième positionisme est présenté comme sa propre idéologie unique comme une troisième option au capitalisme ou au communisme."
 fascism_siam: "Troisième positionnisme (fascisme)"
 fascism_siam_desc: "£Ideology_Fascism_Siam_pic\n\n\n\n\n\n\n\n\nEnglobant une variété de mouvements ultranationalistes, le troisième positionnisme vénère généralement le dévouement à l'État et l'unité du peuple sous un leader fort. Le troisième positionisme est présenté comme sa propre idéologie unique comme une troisième option au capitalisme ou au communisme."
 fujimorism: "Fujimorisme"
 fujimorism_desc: "£Ideology_Fujimorism_pic\n\n\n\n\n\n\n\n\nLe fujimorisme fait référence à l'idéologie politique du Péruvien Alberto Fujimori (1990-2000) et de sa fille Keiko, mêlant populisme autoritaire, économie néolibérale et rhétorique contestataire. Fujimori a centralisé le pouvoir via un auto-coup d'État en 1992, a écrasé l'insurrection du Sentier lumineux avec des tactiques brutales et a mis en oeuvre des réformes de marché de type thérapie de choc qui ont stabilisé l'économie du Pérou mais a aggravé les inégalités. Son règne reposait sur le clientélisme, la corruption et un récit de « sauveur », laissant un héritage polarisant crédité de la fin de l'hyperinflation et du terrorisme, mais condamné pour violations des droits de l'homme et détournement de fonds. Le fujimorisme reste influent à travers les campagnes politiques de Keiko, entretenant un fossé entre ses partisans louant son pragmatisme et ses critiques condamnant son autoritarisme."
 hindu_nationalism: "Nationalisme hindou"
 hindu_nationalism_desc: "£Ideology_Hindu_Nationalism_pic\n\n\n\n\n\n\n\n\nLe nationalisme hindou a été collectivement considéré comme l'expression d'une pensée sociale et politique, basée sur les traditions spirituelles et culturelles indigènes du sous-continent indien."
 hutu_supremacy: "Suprématie Hutu"
 hutu_supremacy_desc: "£Ideology_Hutu_Supremacy_pic\n\n\n\n\n\n\n\n\nLa suprématie hutue est une idéologie nationaliste ethnique qui affirme la domination du groupe ethnique Hutu sur d'autres groupes au Rwanda et au Burundi, en particulier les Tutsi et, dans une moindre mesure, les Twa. Cette décision est apparue comme une réaction aux politiques de l'époque coloniale qui favorisaient la minorité tutsie sous la domination belge, créant ainsi un profond ressentiment au sein de la majorité hutu. L'idéologie promeut la conviction que les Hutus, en tant que population majoritaire, devraient détenir le pouvoir politique, économique et social exclusif, renversant ainsi la domination historique des Tutsis. Au coeur de la suprématie hutue se trouve une rhétorique anti-Tutsi virulente, qui présente historiquement les Tutsis comme des oppresseurs étrangers, des envahisseurs, voire des sous-humains, utilisant souvent la propagande pour les déshumaniser et justifier l'exclusion, la discrimination ou la violence. Politiquement, l'idéologie a été institutionnalisée dans le Rwanda postcolonial à travers des mouvements comme le parti Parmehutu et plus tard les extrémistes Hutu Power, qui ont appliqué des politiques telles que les quotas ethniques et la marginalisation systémique des Tutsis. Sur le plan économique, il cherchait à démanteler la richesse et la propriété foncière des Tutsis, en redistribuant les ressources aux Hutus sous couvert de justice sociale. À son extrême extrême, la suprématie hutue a alimenté la violence de masse, notamment la révolution hutue de 1959, des pogroms périodiques et, finalement, le génocide rwandais de 1994, au cours duquel les dirigeants du Hutu Power ont incité à l'extermination des Tutsis et des Hutus modérés. L'idéologie s'appuyait sur l'alarmisme, le révisionnisme historique et le mythe d'une lutte de libération des Hutus, décrivant les Tutsis comme une menace éternelle qui devait être éliminée pour la survie des Hutus. Même si ses manifestations les plus violentes ont été réprimées après la victoire du Front patriotique rwandais en 1994, des vestiges de la pensée suprémaciste hutue persistent parmi certains groupes extrémistes en exil et factions de la diaspora, bien qu'elle soit largement condamnée comme une idéologie génocidaire dans le Rwanda moderne."
 kahanism: "Kahanisme"
 kahanism_desc: "£Ideology_Kahanism_pic\n\n\n\n\n\n\n\n\nKahanisme."
 ku_klux_klan: "Ku Klux Klan"
 ku_klux_klan_desc: "£Ideology_Ku_Klux_Klan_pic\n\n\n\n\n\n\n\n\nLe Ku Klux Klan est un groupe haineux américain suprémaciste blanc. Le Klan a existé à trois époques distinctes à différents moments de l'histoire des États-Unis. Chacun a préconisé des positions réactionnaires extrémistes telles que la suprématie blanche, le nationalisme blanc, l'anti-immigration et - surtout dans les versions ultérieures - le nordicisme et l'anti-catholicisme."
