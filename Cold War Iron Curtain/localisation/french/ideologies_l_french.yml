 conservative_liberalism: "Libéralisme conservateur"
 conservative_liberalism_desc: "£Ideology_Conservative_Liberalism_pic\n\n\n\n\n\n\n\n\nLe libéralisme conservateur est une variante du libéralisme, combinant des valeurs et des politiques libérales avec des positions conservatrices, ou représentant simplement la droite du mouvement libéral. Il s'agit d'une variante plus positive et moins radicale du libéralisme classique."
 AST_conservative_liberalism_desc: "£Ideology_Conservative_Liberalism_AST_pic\n\n\n\n\n\n\n\n\nLe libéralisme conservateur est une variante du libéralisme, combinant des valeurs et des politiques libérales avec des positions conservatrices, ou représentant simplement la droite du mouvement libéral. Il s'agit d'une variante plus positive et moins radicale du libéralisme classique."
 IRE_conservative_liberalism_desc: "£Ideology_Conservative_Liberalism_IRE_pic\n\n\n\n\n\n\n\n\nLe libéralisme conservateur est une variante du libéralisme, combinant des valeurs et des politiques libérales avec des positions conservatrices, ou représentant simplement la droite du mouvement libéral. Il s'agit d'une variante plus positive et moins radicale du libéralisme classique."
 NZL_conservative_liberalism_desc: "£Ideology_Conservative_Liberalism_NZL_pic\n\n\n\n\n\n\n\n\nLe libéralisme conservateur est une variante du libéralisme, combinant des valeurs et des politiques libérales avec des positions conservatrices, ou représentant simplement la droite du mouvement libéral. Il s'agit d'une variante plus positive et moins radicale du libéralisme classique."
 honryu_conservativism: "Conservatisme Honryu"
 honryu_conservativism_desc: "£Ideology_Honryu_Conservativism_pic\n\n\n\n\n\n\n\n\nLe conservatisme Honryu (conservatisme dominant) représente une position idéologique importante au sein de la politique japonaise, avec ses fondements façonnés par les principes d'anciens bureaucrates. Les premiers politiciens conservateurs de Honryu étaient principalement composés d'anciens fonctionnaires d'avant-guerre qui ont gravi les échelons de la bureaucratie et sont passés à la politique pour combler le vide pendant l'occupation américaine. Se distinguant du conservatisme Boryu, plus affirmé, le conservatisme Honryu se caractérise par son approche modérée et la conviction que les bureaucrates sont suffisamment qualifiés pour diriger le pays. Il préconise de préserver le statut désarmé du Japon, de donner la priorité à la stabilité économique et de favoriser l'expansion de la sécurité sociale dans le cadre du Traité de sécurité nippo-américain."
 liberal_agrarianism: "L'agrarianisme libéral"
 liberal_agrarianism_desc: "£Ideology_Liberal_Agrarianism_pic\n\n\n\n\n\n\n\n\nL'agrisme libéral."
 liberal_conservatives: "Conservatisme libéral"
 liberal_conservatives_desc: "£Ideology_Liberal_Conservatism_pic\n\n\n\n\n\n\n\n\nLe conservatisme libéral combine des politiques conservatrices avec des positions libérales, notamment sur les questions économiques, sociales et éthiques. Il intègre la vision libérale classique d'une intervention gouvernementale minimale dans l'économie, selon laquelle les individus devraient être libres de participer au marché et de générer de la richesse sans ingérence du gouvernement. Cependant, on ne peut pas vraiment compter sur les individus pour agir de manière responsable dans d'autres sphères de la vie. C'est pourquoi les conservateurs libéraux estiment qu'un État fort est nécessaire pour garantir l'ordre public et que les institutions sociales sont nécessaires pour nourrir le sens du devoir et de la responsabilité envers la nation. Ils soutiennent également les libertés civiles, ainsi que certaines positions sociales conservatrices."
 AST_liberal_conservatives_desc: "£Ideology_Liberal_Conservatism_AST_pic\n\n\n\n\n\n\n\n\nLe libéralisme conservateur est une variante du libéralisme, combinant des valeurs et des politiques libérales avec des positions conservatrices, ou représentant simplement la droite du mouvement libéral. Il s'agit d'une variante plus positive et moins radicale du libéralisme classique."
 IRE_liberal_conservatives_desc: "£Ideology_Liberal_Conservatism_IRE_pic\n\n\n\n\n\n\n\n\nLe conservatisme libéral combine des politiques conservatrices avec des positions libérales, notamment sur les questions économiques, sociales et éthiques. Il intègre la vision libérale classique d'une intervention gouvernementale minimale dans l'économie, selon laquelle les individus devraient être libres de participer au marché et de générer de la richesse sans ingérence du gouvernement. Cependant, on ne peut pas vraiment compter sur les individus pour agir de manière responsable dans d'autres sphères de la vie. C'est pourquoi les conservateurs libéraux estiment qu'un État fort est nécessaire pour garantir l'ordre public et que les institutions sociales sont nécessaires pour nourrir le sens du devoir et de la responsabilité envers la nation. Ils soutiennent également les libertés civiles, ainsi que certaines positions sociales conservatrices."
 NZL_liberal_conservatives_desc: "£Ideology_Liberal_Conservatism_NZL_pic\n\n\n\n\n\n\n\n\nLe libéralisme conservateur est une variante du libéralisme, combinant des valeurs et des politiques libérales avec des positions conservatrices, ou représentant simplement la droite du mouvement libéral. Il s'agit d'une variante plus positive et moins radicale du libéralisme classique."
 SAF_liberal_conservatives_desc: "£Ideology_Liberal_Conservatism_SAF_pic\n\n\n\n\n\n\n\n\nLe libéralisme conservateur est une variante du libéralisme, combinant des valeurs et des politiques libérales avec des positions conservatrices, ou représentant simplement la droite du mouvement libéral. Il s'agit d'une variante plus positive et moins radicale du libéralisme classique."
 liberal_kemalism: "Kémalisme libéral"
 liberal_kemalism_desc: "£Ideology_Liberal_Kemalism_pic\n\n\n\n\n\n\n\n\nAlors que le kémalisme traditionnel mettait généralement l'accent sur un rôle fort de l'État dans la gouvernance, en se concentrant sur la laïcité, le nationalisme et la modernisation dirigée par l'État. En revanche, le kémalisme libéral cherche à réinterpréter ces principes d'une manière qui soutient de plus grandes libertés individuelles, une démocratie pluraliste et une économie de marché plus ouverte.\n\nCette perspective a émergé parmi les intellectuels, les politiciens et les bureaucrates réformateurs qui soutiennent que les fondements républicains et laïcs de la Turquie peuvent être mieux préservés non pas par un centralisme autoritaire, mais par le renforcement des institutions démocratiques et l'expansion des libertés civiles. Ils soutiennent que les valeurs fondamentales du kémalisme - telles que la laïcité, la souveraineté nationale et la modernisation - sont compatibles avec les droits humains universels, la liberté d'expression et la concurrence multipartite, le tout sans nécessiter une surveillance sévère de l'État."
 neo_liberalism: "Néo-libéralisme"
 neo_liberalism_desc: "£Ideology_Neo_Liberalism_pic\n\n\n\n\n\n\n\n\nNéo-libéralisme."
 progressive_conservatism: "Conservatisme progressiste"
 progressive_conservatism_desc: "£Ideology_Progressive_Conservatism_pic\n\n\n\n\n\n\n\n\nConservatisme progressiste."
 NZL_progressive_conservatism_desc: "£Ideology_Progressive_Conservatism_NZL_pic\n\n\n\n\n\n\n\n\nConservatisme progressiste."
 Three_principles_of_people_progessive: "Kuomintang (aile sociale-libérale)"
 Three_principles_of_people_progessive_desc: "£Ideology_Three_Principles_pic\n\n\n\n\n\n\n\n\nL'aile progressiste du Kuomintang est composée de membres plus libéraux qui cherchent à se distancer de l'aile militaire et plaident en faveur de davantage de réformes vers le libéralisme de marché et le bien-être du peuple, basées sur des réformes non radicales. Ils cherchent également à limiter la corruption au sein du gouvernement et plaident en faveur du libre-échange avec l'Occident."
 yeltsinism: "Conservatisme russe"
 yeltsinism_desc: "£Ideology_Yeltsinism_pic\n\n\n\n\n\n\n\n\nConservatisme russe (Eltsinisme)."

