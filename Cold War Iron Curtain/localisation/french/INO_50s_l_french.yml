 PKI_TITLE: "Parti communiste d'Indonésie (PKI)"
 PKI_DESC: "Le PKI constitue une force puissante dans la jeune démocratie indonésienne, reconstruite après des années de répression coloniale et de lutte en temps de guerre. Il organise les paysans, les travailleurs et les étudiants sous la promesse d'une réforme agraire, de salaires équitables et d'un accès à l'éducation. S'alignant sur la vision anti-impérialiste de Sukarno, le PKI se présente comme la véritable voix du peuple, cherchant à guider la république vers la justice, l'égalité et une indépendance durable."
 
 BPKI_TITLE: "Conseil consultatif pour la citoyenneté indonésienne (BPKI)"
 BKPI_DESC: "Formé dès les premiers jours de l'indépendance, le BPKI représente la première tentative indonésienne de créer un organisme national pour guider la république. Il a rassemblé diverses voix de tout l'archipel pour conseiller le gouvernement de Sukarno, débattre des questions constitutionnelles et définir le sens de la citoyenneté. Bien que transitoire, il a jeté les bases des assemblées ultérieures et symbolisé l'unité dans la formation d'un État souverain."

 MURBA_PARTY_TITLE: "Fête Murba (Partai Murba)"
 MURBA_PARTY_DESC: "Le Parti Murba apparaît comme une force socialiste révolutionnaire enracinée parmi les vétérans de la lutte pour l'indépendance et les partisans de Tan Malaka. Plus petit que le PKI mais farouchement engagé, il appelle à une réforme agraire radicale, à un anti-impérialisme militant et à une économie populaire. Murba prône une voie plus intransigeante pour la révolution indonésienne, se présentant comme l'avant-garde des ouvriers et des paysans peu disposés à faire des compromis avec les vieilles élites ou les puissances étrangères."

 PSI_TITLE: "Parti socialiste d'Indonésie (PSI)"
 PSI_DESC: "Le PSI se présente comme un parti intellectuel et réformateur, dirigé par des personnalités telles que Sutan Sjahrir. Il défend le socialisme démocratique, la gouvernance parlementaire et la modernisation par l'éducation et la planification. Bien qu'il lui manque la base de masse du PKI ou du PNI, le PSI fait appel aux professionnels urbains, aux étudiants et aux fonctionnaires, se présentant comme une voix de principe en faveur de la démocratie, de l'intégrité et des réformes progressistes dans la jeune république."

 PARTAI_BURUH_TITLE: "Parti travailliste (Partai Buruh)"
 PARTAI_BURUH_DESC: "Le Parti travailliste organise les travailleurs des secteurs industriels et des transports en pleine croissance en Indonésie. Ancré dans l'activité syndicale, il prône des salaires équitables, de meilleures conditions et des protections juridiques pour le travail. Bien que de plus petite portée par rapport aux grands partis nationaux, il se positionne comme la voix de la classe ouvrière urbaine indonésienne, s'efforçant de garantir que l'indépendance apporte non seulement la libération du colonialisme mais aussi la dignité dans la vie quotidienne."

 PNI_TITLE: "Parti national indonésien (PNI)"
 PNI_DESC: "Le PNI constitue l'un des piliers dominants de la politique post-indépendance, étroitement lié au leadership de Sukarno. Enraciné dans le nationalisme, il met l'accent sur l'unité, l'anti-impérialisme et le rôle central de l'État dans l'orientation du développement. Fort d'un large attrait auprès de toutes les classes sociales et de toutes les régions, le PNI se présente comme le parti naturel du gouvernement, symbolisant la lutte pour l'indépendance et la force directrice de l'identité nationale indonésienne."

 PDI_TITLE: "Parti démocratique indonésien (PDI)"
 PDI_DESC: "Le PDI rassemble des nationalistes et des modérés réformateurs qui cherchent à équilibrer démocratie et stabilité. Moins radical que les partis de gauche mais distinct de la politique islamique, il met l'accent sur les droits civiques, le progrès social et un rôle parlementaire fort. Sa plateforme séduit les classes moyennes urbaines et les intellectuels, offrant une vision d'une démocratie ordonnée au sein de la nouvelle république."

 PRI_TITLE: "Parti populaire indonésien (PRI)"
 PRI_DESC: "Le PRI apparaît comme un petit parti nationaliste prétendant représenter les intérêts de la base en dehors des appareils politiques plus larges. Il prône la justice sociale, l'indépendance vis-à-vis de l'influence étrangère et une participation politique plus large. Bien qu'éclipsé par le PNI et le PKI, il se taille une place en tant que voix populiste, se présentant comme proche des Indonésiens ordinaires et de leurs luttes quotidiennes dans la nouvelle république."
 
 PARKINDO_TITLE: "Parti chrétien indonésien (Parkindo)"
 PARKINDO_DESC: "Parkindo est la principale voix politique des communautés protestantes d'Indonésie. Il prône la liberté religieuse, l'éducation et la responsabilité sociale, tout en soulignant la loyauté envers la république. Bien que sa portée soit limitée par rapport aux partis nationalistes ou islamiques, Parkindo offre une plate-forme permettant aux chrétiens de participer à la politique, promouvant une vision morale de justice, de tolérance et d'unité au sein de la démocratie diversifiée de l'Indonésie."
 
 PARTAI_KATOLIK_TITLE: "Parti catholique (Partai Katolik)"
 PARTAI_KATOLIK_DESC: "Le Parti catholique représente la minorité catholique indonésienne, s'appuyant sur les écoles, les organisations sociales et les communautés de Java et des régions orientales. Il prône la liberté religieuse, l'éducation et la justice sociale, tout en soutenant l'unité de la république. Bien que de taille modeste, il garantit que les voix catholiques sont entendues dans la politique nationale, promouvant la coopération et l'harmonie au sein de la démocratie diversifiée de l'Indonésie."
 
 IPPRI_TITLE: "Association des employés de la police de la République d'Indonésie (IPPRI)"
 IPPRI_DESC: "L'IPPRI fonctionne comme une organisation professionnelle devenue un mouvement politique pour le personnel policier. Il met l'accent sur la loyauté envers l'État, l'ordre et la sécurité dans l'environnement fragile de l'après-indépendance. En entrant en politique, l'association cherche à protéger les intérêts des employés de la police tout en se présentant comme une force stabilisatrice, engagée à sauvegarder la république et à garantir l'ordre public au cours de ses années de formation."
 
 PIR_TITLE: "Parti de la grande unité indonésienne (PIR)"
 PIR_DESC: "Le PIR se présente comme un parti nationaliste voué à consolider l'indépendance de l'Indonésie et à unifier divers groupes sous une seule bannière. Il met l'accent sur l'anti-impérialisme, le développement et la représentation parlementaire des communautés régionales. Bien qu'il ne soit jamais aussi dominant que le PNI ou le PKI, le PIR se positionne comme une alternative patriotique, visant à combler les divisions et à renforcer la république par l'unité et un objectif national partagé."
 
 PRN_TITLE: "Parti populaire national (PRN)"
 PRN_DESC: "Le PRN apparaît comme un groupe nationaliste cherchant à élargir la représentation des Indonésiens ordinaires dans le système post-indépendance. Il met l'accent sur la loyauté envers la république, la justice économique et la participation politique dans tout l'archipel. Bien que plus petit que le PNI, il se présente comme une alternative patriotique, visant à maintenir vivant l'esprit d'indépendance dans la gouvernance quotidienne."
 
 GPP_TITLE: "Mouvement pour la défense du Pancasila (GPP)"
 GPP_DESC: "Le GPP s'organise comme un mouvement résolument nationaliste centré sur la protection de l'idéologie Pancasila de Sukarno. Il met l'accent sur l'unité, l'anticommunisme et la fidélité aux principes fondateurs de la république. Bien qu'il ne soit pas aussi large que les partis de masse, il se positionne comme un gardien moral de la philosophie de l'État indonésien, faisant appel à ceux qui craignent que la division ou l'extrémisme ne sape la nouvelle nation."
 
 IPKI_TITLE: "Ligue des partisans de l'indépendance indonésienne (IPKI)"
 IPKI_DESC: "L'IPKI, étroitement lié aux officiers militaires, cherche à traduire le prestige de la lutte armée en influence politique. Il met l'accent sur l'ordre, le nationalisme et la discipline, se présentant comme une garantie contre l'instabilité. Bien que sa portée électorale soit limitée, l'IPKI a un poids symbolique en tant que parti d'anciens combattants, dont l'objectif est de garantir que les sacrifices de l'indépendance soient honorés dans la politique de la république."
 
 NU_TITLE: "Nahdlatul Ulama (NU)"
 NU_DESC: "Le NU, enraciné dans l'islam traditionaliste, devient une force politique majeure en mobilisant les réseaux pesantren, les religieux et les communautés rurales. Il met l'accent sur l'éducation religieuse, le bien-être de la communauté et la loyauté envers la république tout en résistant aux extrêmes laïcs ou radicaux. Ayant des liens profonds avec la campagne de Java, NU offre une voix puissante aux musulmans traditionnels, équilibrant la foi avec une participation active à la démocratie indonésienne."
 
 INO_PPP_TITLE: "Parti uni pour le développement (PPP)"
 INO_PPP_DESC: "Le PPP émerge plus tard comme une fusion de partis islamiques, unissant diverses voix musulmanes sous une même bannière. Il promeut la protection des valeurs islamiques, le bien-être social et la gouvernance morale tout en travaillant au sein du système politique indonésien. Créé pour renforcer la représentation islamique, le PPP devient un canal clé pour les aspirations musulmanes au parlement, équilibrant les convictions religieuses et l'unité nationale."
 
 GOLKAR_TITLE: "Parti des groupes fonctionnels (Golkar)"
 GOLKAR_DESC: "Golkar est à l'origine une fédération de groupes professionnels et fonctionnels promus par l'État. Il se présente comme non idéologique, donnant la priorité à la stabilité, au développement et à l'efficacité administrative plutôt qu'à la politique partisane. Au fil du temps, Golkar devient l'organisation dirigeante dominante, s'alignant sur l'autorité gouvernementale pour maintenir l'ordre et moderniser l'Indonésie. Il séduit les fonctionnaires, les technocrates et ceux qui sont favorables à un leadership fort et centralisé."
 
 PERTI_TITLE: "Mouvement d'éducation islamique (PERTI)"
 PERTI_DESC: "Le PERTI se développe à partir de réseaux éducatifs islamiques, notamment à Sumatra, et se transforme en force politique après l'indépendance. Enraciné dans les traditions pesantren, il promeut l'apprentissage islamique, les valeurs morales et la loyauté envers la république. Bien que plus petit que NU ou Masyumi, PERTI offre un débouché aux universitaires et aux étudiants de la région, garantissant que l'éducation reste au coeur de la politique islamique indonésienne."
 
 PSII_TITLE: "Parti de l'Union islamique indonésienne (PSII)"
 PSII_DESC: "Le PSII perpétue l'héritage du premier mouvement Sarekat Islam, l'une des premières organisations politiques de masse d'Indonésie. Il prône les valeurs islamiques, la justice économique et l'indépendance vis-à-vis de la domination étrangère. Après l'indépendance, son influence est moindre, mais il reste respecté en tant que parti islamique pionnier, symbolisant la continuité entre les premières luttes nationalistes et la république moderne."
 
 MASYUMI_PARTY_TITLE: "Fête Masyumi"
 MASYUMI_PARTY_DESC: "Masyumi apparaît comme le principal parti islamique, réunissant des musulmans modernistes, des intellectuels et des militants urbains. Il prône la démocratie, la réforme économique et la gouvernance guidée par les principes islamiques, tout en promouvant l'unité nationale. Bénéficiant d'un large soutien dans tout l'archipel, Masyumi devient l'un des partis les plus puissants d'Indonésie dans les années 1950, se présentant à la fois comme un mouvement politique moderne et la principale voix des aspirations islamiques."
 
 INO_OTHER_TITLE: "Autres partis"
 INO_OTHER_DESC: "À côté des grands mouvements nationaux, la jeune démocratie indonésienne voit également naître de nombreux partis plus petits et régionalistes. Ces groupes reflètent les préoccupations locales, les identités culturelles et les dirigeants communautaires en quête de représentation. Bien que leur portée soit souvent limitée, ils apportent de la diversité au Parlement, donnant la parole à des régions et à des intérêts qui autrement pourraient être éclipsés par les blocs plus larges."

 INO_MIO_Increased_Funding: "Augmentation du financement militaro-industriel"
 INO_MIO_Increased_Funding_desc: "Les fonds publics affluent plus librement vers notre industrie militaire."
 INO_MIO_Expanded_Task_Capacity: "Capacité militaro-industrielle accrue"
 INO_MIO_Expanded_Task_Capacity_desc: "Nos organisations militaro-industrielles peuvent assumer plusieurs tâches à la fois."
