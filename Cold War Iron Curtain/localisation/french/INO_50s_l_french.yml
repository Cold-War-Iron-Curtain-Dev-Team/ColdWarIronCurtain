	####ARMED FORCES####
	INO_APRI_desc: "Formées à l'origine pendant l'ère tumultueuse de Bersiap, les forces armées indonésiennes sont apparues comme protectrices de la sécurité de la population au milieu du chaos et de l'incertitude. Les années de guérilla acharnée contre les forces coloniales néerlandaises ont non seulement forgé un sentiment d'identité nationale, mais ont également établi une réputation remarquable pour les forces armées. Leur bravoure et leur résilience face à l'adversité sont devenues une source de fierté pour la nation, jetant les bases d'une institution militaire qui incarne l'esprit et la détermination du peuple indonésien. Cette période, malgré sa brutalité, a solidifié le rôle des forces armées en tant que défenseurs de la souveraineté et a joué un rôle central dans l'élaboration du récit de l'indépendance de l'Indonésie.\n\nAlors que la nation s'éloigne du passé révolutionnaire, il est crucial de faire évoluer les forces armées indonésiennes vers une structure militaire moderne et performante, capable de répondre efficacement aux défis contemporains, en particulier dans le contexte d'une guerre froide émergente."
	INO_Ground_Forces_desc: "L'armée indonésienne est sans doute la composante la plus influente des forces armées du pays, servant de colonne vertébrale et de principale force de combat pour défendre la souveraineté du pays et relever divers défis. Son rôle s'étend au-delà du combat, car l'armée indonésienne façonne de manière significative les politiques de sécurité nationale et joue un rôle clé dans le maintien de la stabilité dans le pays."
