	#focus natsir
	INO_Forming_New_Cabinet_Natsir: "Former un nouveau cabinet"
	INO_Forming_New_Cabinet_Natsir_desc: "La motion Natsir est largement considérée comme l'une des réalisations les plus importantes de Mohammad Natsir. Suite à cette motion, Natsir a reçu des éloges et une admiration considérables de la part de personnalités clés du gouvernement, notamment du président Soekarno et du vice-président Mohammad Hatta, qui ont tous deux reconnu son impact sur l'orientation future du pays.\n\nAvec l'abolition formelle du système fédéral précédemment institué, le président Soekarno a vu une opportunité de remodeler la structure gouvernementale. Il nous a confié la responsabilité de former un nouveau cabinet qui serait mieux aligné sur les intérêts nationaux de l'Indonésie."
	INO_Compromise_With_PNI: "Compromis avec PNI"
	INO_Compromise_With_PNI_desc: "§RCE CHEMIN N'EST PAS ENCORE DISPONIBLE§!\n\n\"Le mâle et la femelle sont comme les deux ailes d'un oiseau. Si deux ailes sont de force égale, l'oiseau peut voler jusqu'au point le plus haut ; si l'une d'elles est cassée, l'oiseau ne peut pas voler du tout.\"\n\nCette analogie perspicace a déjà été formulée par Sukarno, et elle résonne encore plus profondément à la lumière des récents événements qui se déroulent autour de nous. Dans notre quête de stabilité et de progrès, nous avons l'opportunité de collaborer avec le PNI, en unissant notre force collective pour remplir nos rôles en tant que cabinet nouvellement nommé de l'État unitaire. Même si des voix comme celles de Soekiman et d'Anshary peuvent s'opposer fermement à ce partenariat, nous devons réfléchir aux implications d'une telle résistance. Mais nous ne pourrions jamais prendre un si gros risque, n'est-ce pas ?"
	INO_Masjumi_Alone: "Masyumi seul"
	INO_Masjumi_Alone_desc: "\"On ne pouvait pas faire confiance au PNI, on ne devrait jamais faire confiance au PNI, Masyumi dirigera l'Indonésie avec la voix de millions de musulmans !\"\n\nSi le parti choisit de poursuivre ses objectifs de manière indépendante, il risque de s'aliéner le PNI qui, comme de nombreux citoyens le perçoivent, est la force politique dominante du DPRS.\n\nMême si s'aligner sur le PNI pourrait ne pas donner les meilleurs résultats, Anshary croit fermement que si Masyumi parvient à affirmer efficacement son indépendance et à rallier le soutien du public, il existe une opportunité en or de former un gouvernement capable de véritablement transformer l'Indonésie en une démocratie dynamique et pleinement réalisée. Cette vision ambitieuse repose sur notre capacité à inspirer la population, en articulant clairement nos objectifs et nos valeurs, pour faire de Masyumi la force leader dans l'élaboration de l'avenir démocratique de la nation."
