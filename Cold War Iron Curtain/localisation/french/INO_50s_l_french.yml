	####East Indonesia####
	INS_Negara_Ikut_Tuan: "Negara Ikut Tuan"
	INS_Negara_Ikut_Tuan_desc: "Le nom « Negara Ikut Tuan » est devenu un slogan symbolique pour le gouvernement républicain de Jakarta en se référant à nous, mais le mot est plus vrai que jamais.\n\nEn réalité, nous sommes un territoire au sein de l'Empire néerlandais. Tôt ou tard, avec les conséquences de Roem van Roijen, nous pourrons enfin atteindre nos objectifs en tant qu'États-Unis d'Indonésie."
	INS_Independent_In_Name: "Indépendant, mais de nom"
	INS_Independent_In_Name_desc: ""
	#decision
	Indonesia_Serikat_decisions: "Développement postcolonial"
	Indonesia_Serikat_decisions_desc: "\n\n\n\n\n£INO_Development\n\n\n\n\n\n\nÀ la suite du transfert formel de souveraineté des £WPA Indes orientales néerlandaises à la £INO République d'Indonésie, l'État indonésien a pris le contrôle d'une série d'infrastructures industrielles qui étaient auparavant gérées par l'administration coloniale. Il s'agit notamment d'usines, d'usines de transformation, d'entrepôts, d'ateliers et d'une gamme d'installations de soutien, dont beaucoup étaient autrefois essentielles à la configuration économique de l'ancien système colonial.\n\nDésormais aux mains de l'État, ces biens se présentent par conséquent comme une bénédiction et une malédiction. Même si une grande partie des machines et de l'aménagement industriels pourraient facilement répondre aux besoins d'une industrie extractive ou orientée vers l'exportation, ils démontrent également un grand potentiel de reconversion vers le développement national et l'autosuffisance industrielle. Beaucoup de ces installations sont déjà à l'étude pour leur adaptabilité ; certains d'entre eux pourraient être réutilisés pour soutenir£politics_industrial_construction l'industrie manufacturière nationale,£politics_land_reform la transformation agricole ou£growth la production d'énergie."
    Indonesia_1: "Développement à Djakarta"
	Indonesia_1_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Development2\n\n\n\n\n\n§W-----------------------§!\nAvec la disparition des Pays-Bas, nous acquérons enfin la pleine souveraineté, mais notre économie est minime, voire inexistante. Nous devrions donc commencer à développer l'île principale où siège notre gouvernement, l'île de Java. En particulier la région de [842.GetName]."
	Indonesia_2: "Développement dans l'Est de Java"
	Indonesia_2_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Development4\n\n\n\n\n\n§W-----------------------§!\nAvec la disparition des Pays-Bas, nous acquérons enfin la pleine souveraineté, mais notre économie est minime, voire inexistante. Nous devrions donc commencer à développer l'île principale où siège notre gouvernement, l'île de Java. En particulier la région de [845.GetName], [1982.GetName] et [1983.GetName]."
	Indonesia_3: "Développement en D.I. Djogjakarta"
	Indonesia_3_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Development5\n\n\n\n\n\n§W-----------------------§!\nAvec la disparition des Pays-Bas, nous acquérons enfin la pleine souveraineté, mais notre économie est minime, voire inexistante. Nous devrions donc commencer à développer l'île principale où siège notre gouvernement, l'île de Java. En particulier la région de [846.GetName]."
	Indonesia_4: "Développement dans le centre de Java"
	Indonesia_4_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Development6\n\n\n\n\n\n§W-----------------------§!\nAvec la disparition des Pays-Bas, nous acquérons enfin la pleine souveraineté, mais notre économie est minime, voire inexistante. Nous devrions donc commencer à développer l'île principale où siège notre gouvernement, l'île de Java. En particulier la région de [335.GetName] et [1981.GetName]."
	Indonesia_5: "Développement à Banten"
	Indonesia_5_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Development3\n\n\n\n\n\n§W-----------------------§!\nAvec la disparition des Pays-Bas, nous acquérons enfin la pleine souveraineté, mais notre économie est minime, voire inexistante. Nous devrions donc commencer à développer l'île principale où siège notre gouvernement, l'île de Java. En particulier la région de [843.GetName]"
	Indonesia_6: "Développement dans l'ouest de Java"
	Indonesia_6_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Development1\n\n\n\n\n\n§W-----------------------§!\nAvec la disparition des Pays-Bas, nous acquérons enfin la pleine souveraineté, mais notre économie est minime, voire inexistante. Nous devrions donc commencer à développer l'île principale où siège notre gouvernement, l'île de Java. En particulier la région de [844.GetName]"
	######National Revolution######
	Indonesia_War_decisions: "Révolution nationale indonésienne"
	Indonesia_War_decisions_desc: "\n\n\n\n\n£Indonesia_Revolution\n\n\n\n\n\n\n17 000 îles, 70 millions d'habitants, et pourtant colonisés par une nation à peine un quart de sa taille depuis 350 ans.\n\nLorsque l'Empire du Japon était confronté à la défaite face aux Alliés lors de la Seconde Guerre mondiale, ils ont promis aux Indonésiens une indépendance rapide. Mais cette promesse était un mensonge. Les Japonais avaient l'intention de remettre les Indes néerlandaises occupées sous contrôle néerlandais une fois la guerre terminée.\n\nLes jeunes révolutionnaires ont réalisé ce plan. Le 16 août 1945, ils kidnappèrent Sukarno et Hatta, les forçant à proclamer leur indépendance. Dès le lendemain, le 17 août 1945, l'indépendance est déclarée.\n\nMais le chemin ne s'arrête pas là.\n\nAlors que les groupes d'exilés des Indes orientales néerlandaises rejoignaient Java, ils proclamèrent haut et fort qu'ils étaient toujours l'autorité légitime. À leur tête se trouvait la NICA, et en son centre se tenait Hubertus van Mook.\n\nLa jeune République est plongée dans le chaos et, dans tout l'archipel, les flammes de la Révolution nationale s'allument.\n\n§RMerdeka atau Binasa!§!\n§WMerdeka atau Mati!§!"
	Indonesia_War_1: "Enflammer l'esprit révolutionnaire"
	Indonesia_War_1_desc: "§W-----------------------§!\n\n\n\n£Indonesia_War1\n\n\n\n\n\n§W-----------------------§!\nDepuis la guerre de Java jusqu'à aujourd'hui, nous sommes catégoriques dans notre quête de l'indépendance, les Néerlandais ne le savent pas, ils ne le sauront jamais, à leurs yeux nous ne sommes qu'une colonie glorifiée, fabriquée et utilisée pour le plaisir des Néerlandais, tandis que nous sommes réduits en esclavage et envoyés au large pour travailler dans leurs plantations et autres travaux dangereux.\n\nCe n'est plus le cas, cette guerre sera la plus décisive, nous ne pouvons pas échouer et nous n'échouerons pas. La République tiendra bon, le peuple indonésien sera enfin victorieux.\n\n§RMerd§!§Weka !§!"
	Indonesia_War_2: "Roem van Roijen Compte à rebours pour le cessez-le-feu"
	Indonesia_War_2_desc: "§W-----------------------§!\n\n\n\n£Indonesia_War2\n\n\n\n\n\n§W-----------------------§!\n§W\"Est-ce enfin fini ? Allons-nous endurer ? Qu'arrive-t-il aux §YNéerlandais§! maintenant ? Pouvons-nous faire confiance à leur parole et ne pas répéter §YLinggadjati ?§!\"§!\n\nCes paroles ont été prononcées dans de nombreuses villes et villages qui ont appris que la République serait enfin totalement libre. Beaucoup dans la République ne croyaient pas les Néerlandais, le traumatisme des accords de Linggadjati et de Renville a rendu de nombreux citoyens de la République méfiants à l'égard de l'accord de Roem van Roijen, mais tout ce qu'ils pouvaient espérer, c'est que les Néerlandais reculeraient enfin et ouvriraient la voie à une Indonésie unie et libre."
	Indonesia_War_3: "Embuscade du convoi néerlandais"
	Indonesia_War_3_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Infantry\n\n\n\n\n\n§W-----------------------§!\nLes Néerlandais battent en retraite, mais ils sont toujours dangereux, nous devrions profiter de cette occasion pour les frapper alors qu'ils sont faibles et leur montrer que nous ne les laisserons pas partir sans combattre."
	######Rebellion######
	Indonesia_Rebellion_decisions: "Rébellion en Indonésie"
	Indonesia_Rebellion_decisions_desc: "\n\n\n\n\n£Rebellion_INO\n\n\n\n\n\n\nLa conclusion de la période la plus tumultueuse de notre histoire marque un tournant important pour notre République, qui reste dans ses années de formation et se retrouve à naviguer dans la dynamique complexe de la guerre froide. En tant que nation diversifiée, nous sommes composés de divers groupes ethniques, chacun avec sa propre culture et ses propres traditions. Malgré ces différences, nous restons fermes dans notre engagement à construire un État cohésif, lié par une identité nationale singulière et supérieure, caractérisée par une patrie commune, un drapeau et une langue officielle.\n\nCependant, le chemin vers l'unité est semé d'embûches. Certains groupes ethniques et religieux au sein de notre société ont résisté à cette vision, entraînant des tensions et des conflits qui menacent notre stabilité. Certains sont allés jusqu'à prendre les armes au mépris du pouvoir central. Il est impératif que nous relevions ces défis de manière décisive ; ne pas le faire pourrait conduire à la dissolution de notre jeune République et mettre en péril l'existence de l'Indonésie en tant que nation unifiée.\n\n§Y[830.GetName]§! est la propriété du §Y[830.owner.GetNameWithFlag]§!\n§Y[1979.GetName]§! est la propriété du §Y[1979.owner.GetNameWithFlag]§!\n§Y[672.GetName]§! est la propriété du §Y[672.owner.GetNameWithFlag]§!\n§Y[836.GetName]§! est la propriété du §Y[836.owner.GetNameWithFlag]§!\n§Y[844.GetName]§! est la propriété du §Y[844.owner.GetNameWithFlag]§!\n§Y[668.GetName]§! est la propriété du §Y[668.owner.GetNameWithFlag]§!\n§Y[669.GetName]§! est la propriété du §Y[669.owner.GetNameWithFlag]§!\n§Y[858.GetName]§! est la propriété du §Y[858.owner.GetNameWithFlag]§!"
	darul_islam_0: "Darul Islam fait des pas !"
	darul_islam_0_desc: "Les forces de Kartosoewirjo préparent une autre attaque dans l'ouest de Java ; nous devons l'arrêter avant qu'il puisse prendre une autre ville et un autre village."
	darul_islam_1: "Frappez Darul Islam"
	darul_islam_1_desc: "§W-----------------------§!\n\n\n\n£Indonesia_DI1\n\n\n\n\n\n§W-----------------------§!\nLa montée du §RDI§!/§WTII§!, communément appelé §RDarul§! §WIslam§! ou §W[DAR.GetNameWithFlag]§!, constitue une menace sérieuse pour le gouvernement central ; Cette rébellion n'était pas la première et ne serait probablement pas la dernière à surgir, c'est pourquoi nous devons prendre des mesures contre elle."
	darul_islam_2: "Raid dans leur cachette"
	darul_islam_2_desc: "§W-----------------------§!\n\n\n\n£Indonesia_DI2\n\n\n\n\n\n§W-----------------------§!\nAvec §RDarul§! §WIslam§! presque disparu, nous devrions donc prendre des mesures pour mettre fin à leur règne une fois pour toutes et établir notre contrôle sur la partie orientale de Java occidental. Même si cela ne signifie pas qu'ils seront complètement éradiqués, de telles mesures mettront sûrement fin à leur présence problématique."
	darul_islam_3: "Terminez Darul Islam"
	darul_islam_3_desc: "§W-----------------------§!\n\n\n\n£Indonesia_DI4\n\n\n\n\n\n§W-----------------------§!\nLa rébellion de Kartosoewirjo est presque terminée, ses forces se sont volontairement rendues ou nous ont échappé, Darul Islam, l'une des plus grandes menaces pour l'existence de la République depuis que le PKI de Madiun a presque été éradiqué.\n\nIl est maintenant temps de passer à un dernier acte pour véritablement l'éradiquer, et c'est une déformation dégoûtante du Pancasila et de son idéologie radicale."
	darul_islam_4: "Proposer à l'Émir Fatah de se rendre"
	darul_islam_4_desc: "§W-----------------------§!\n\n\n\n£Indonesia_DI3\n\n\n\n\n\n§W-----------------------§!\nAmir Fatah, également connu sous le nom de Suhario, est l'un des commandants des groupes DI/TII. Suhario est devenu commandant de l'Hisbullah dans les régions de Sidoarjo et Mojokerto et chef de terrain de l'Hisbullah pendant la bataille de Surabaya. En 1946, Sudirman envoya Suhario à Java occidental pour assurer la loyauté de Java occidental envers l'Indonésie.\n\nLà, il a rencontré Kartosoewirjo, l'imam du Darul Islam, bien qu'il ait tenté à plusieurs reprises de convaincre Kartosoewirjo de ne pas proclamer l'État islamique, il a cédé après avoir rencontré l'un de ses envoyés.\n\nToutefois, cela ne représente pas toute l'histoire. Amir Fatah a eu un avis approximatif sur la réorganisation du DI/TII. Avec sa consternation, nous pourrions le convaincre de se rendre et de lui pardonner, ce qui serait un coup dur pour la direction de la DI/TII."
	darul_islam_5: "Sabotage de Darul Islam"
	darul_islam_5_desc: "§W-----------------------§!\n\n\n\n£Indonesia_DI\n\n\n\n\n\n§W-----------------------§!\nDarul Islam maintient une présence importante et résiliente dans l'ouest de Java. Si leur style opérationnel ressemble au nôtre, ils possèdent un avantage supplémentaire : l'utilisation de la religion comme outil d'influence et de recrutement. Pour contrer efficacement leur impact, il est crucial d'éduquer les communautés locales sur nos objectifs et nos valeurs, en soulignant les dangers potentiels posés par l'idéologie de Darul Islam. En sensibilisant et en favorisant la pensée critique parmi les habitants de diverses villes et villages de l'ouest de Java, nous pouvons effectivement diminuer leur influence."
	south_maluku: "Envoyez des Marines à Ambon"
	south_maluku_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Maluku1\n\n\n\n\n\n§W-----------------------§!\nLe 25 avril 1950, suite à l'annexion imminente de l'Indonésie orientale à la République d'Indonésie, les fédéralistes Chris Soumokil, Johanes Manuhutu et d'autres formèrent la République des Moluques du Sud, un État sécessionniste destiné à détester le gouvernement central de Jakarta. Nous ne pouvons donc pas laisser cela aller plus loin ; d'une manière ou d'une autre, Ambon doit être pris. Cette tâche incombe au Corps des Marines."
	jail_soumokil: "Trouver la cachette de Soumokil"
	jail_soumokil_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Soumokil\n\n\n\n\n\n§W-----------------------§!\nLa frappe finale décisive sur Ambon a décapité le reste des forces de guerre de la République des Moluques du Sud, mais leur commandant en chef et président, Chris Soumokil, n'a pas encore été retrouvé. On pense que Soumokil se cache dans la campagne, échappant à la capture et restant insaisissable pour mener une guérilla.\n\nMaintenant, la question demeure : où est-il ? une fois que nous l'aurons découvert, nous n'aurons aucune pitié pour un traître à la République."
	south_maluku_0: "Les États-Unis ont décrété un cessez-le-feu !"
	south_maluku_0_desc: "L'incapacité de rétablir la paix aux Moluques pourrait recourir à une intervention étrangère. C'est pourquoi nous devons capituler les Moluques le plus rapidement possible.\n\n§RPS ; Si vous ne pouvez pas capituler dans un délai donné, ne jouez pas à hoi4§!"
	aceh_rebellion_0: "Rébellion de Daud Bereuh à Aceh"
	aceh_rebellion_0_desc: ""
	aceh_1: "Envoyez une brigade AA pour saisir les armes illégales d'Aceh"
	aceh_1_desc: "§W-----------------------§!\n\n\n\n£Aceh1\n\n\n\n\n\n§W-----------------------§!\nIl a été porté à notre attention que le gouverneur d'Aceh, Daud Bereuh, a stocké des armes illégales sur le marché noir à Aceh, même s'il a nié ne pas en avoir, nos informations suggèrent qu'il prépare une rébellion contre l'État unitaire. Nous devons saisir ces armes avant qu'elles puissent être utilisées."
	AOI_Rebellion: "Rébellion islamique d'Angkatan Oemat"
	AOI_Rebellion_desc: "§W-----------------------§!\n\n\n\n£Indonesia_AOI\n\n\n\n\n\n§W-----------------------§!\nAlors que la formation d'un État unitaire est en vue, un groupe islamiste connu sous le nom d'Angkatan Oemat Islam a organisé une rébellion dans le centre de Java, nous devons les éradiquer rapidement."
	######Politics#######
	Indonesia_Politics_decisions: "Question politique indonésienne"
	Indonesia_Politics_decisions_desc: "\n\n\n\n\n£Indonesia_Politics\n\n\n\n\n\n\n\n\n£Indonesia_Government\n\n\n\nPrésident actuel : §Y[GetINO_PRES]§!\nVice-président actuel : §Y[GetINO_VP]§!\nPremier ministre actuel : §Y[INO.GetLeader]§!\n\nCabinet actuel : §Y[GetINOCabinetTitle]§!\n\n\n[Get_INO_DEPUTY_PM]  [Get_INO_FINANCE]  [Get_INO_DEFENSE]  [Get_INO_EDUCATION]  [Get_INO_RELIGION]  [Get_INO_FOREIGN]  \n\n\n£INO_Approval_Rating §GApprobation§! Note : [?INO_Approval_factor_var|+|0%]\n£INO_Stability §2Stabilité§! obtenue grâce à la confiance du Cabinet : [?INO_Approval_factor_speed_var|+|%2]\n£industry §8Biens de consommation§! affectés par le Cabinet Trust : [?INO_Approval_Consumer_Goods_factor_var|%1]\n\nLégislature actuelle : §9[GetDPRNameINO]§!\nConstitution actuelle : §G[GetINOConstitution]§!\n\nL'Indonésie est, pour beaucoup d'entre nous, non seulement un pays, mais notre maison, notre unique maison. Cependant, malgré son riche patrimoine culturel et son potentiel de croissance, nous sommes confrontés à de sérieux défis qui entravent notre progrès. Parmi ceux-ci figurent les abus systémiques, la corruption généralisée, le népotisme enraciné et une culture inquiétante de l'arrogance. Ces problèmes sapent la confiance dans nos institutions et étouffent les opportunités offertes à de nombreux citoyens.\n\nPour que l'Indonésie puisse véritablement prospérer et réaliser tout son potentiel, il est impératif que nous affrontions ces problèmes de front. Cela nécessite un effort collectif de la part de tous les secteurs de la société, y compris le gouvernement, la société civile et le secteur privé. Nous devons favoriser la transparence, la responsabilité et l'intégrité de nos institutions tout en promouvant l'égalité des chances pour chaque citoyen. Ce n'est que par une action et un engagement résolus que nous pourrons espérer surmonter ces obstacles et bâtir un avenir meilleur pour notre nation bien-aimée."
	Indonesian_Politics_Parties: "Popularité du PNI : [?INO_Party_SUPPORT_LOCAL^6|+%2]\nPopularité des PKI : [?INO_Party_SUPPORT_LOCAL^1|+%2]\n"
	Indonesia_Politics_1: "La motion d'intégrité Natsir"
	Indonesia_Politics_1_desc: "§W-----------------------§!\n\n\n\n£Natsir_Motion\n\n\n\n\n\n§W-----------------------§!\nLe Premier ministre Mohammad Hatta a chargé Natsir et Sri Sultan Hamengkubuwono IX de faire pression pour résoudre diverses crises dans la région. L'expérience dans la région s'ajoute au réseau de Natsir. En outre, sa capacité à négocier avec les chefs de faction au Parlement du RIS, tels que IJ Kasimo de la faction du parti catholique et AM Tambunan du Parti chrétien, a poussé Natsir à une conclusion : les États sont prêts à se dissoudre pour s'unir au RI - tant qu'on ne leur demande pas de se dissoudre."
	Indonesia_Politics_2: "Envoyez Hatta en Pasundan"
	Indonesia_Politics_2_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Hatta\n\n\n\n\n\n§W-----------------------§!\nFace à l'incapacité de Natsir à former une phase cohérente pour réintégrer formellement les États, Mohammad Hatta, en collaboration avec Sukarni, et Raden Mas Sartono sont arrivés à la conclusion que le Premier ministre doit se rendre à Pasundan et entendre les souhaits du peuple.\n\nC'est la seule manière si nous voulons réintégrer les États à la République d'Indonésie, en particulier l'État de Pasundan."
	Indonesia_Politics_3: "Rejoignez les Nations Unies"
	Indonesia_Politics_3_desc: "§W-----------------------§!\n\n\n\n£Indonesia_UN\n\n\n\n\n\n§W-----------------------§!\nAlors que nous avons enfin acquis notre noble indépendance, il nous reste une tâche importante à accomplir : rejoindre l'ONU. Cette étape est essentielle pour établir notre position dans la guerre froide naissante. En tant que nation libre et indépendante, nous sommes déterminés à améliorer le sort de l'Indonésie et à promouvoir la paix dans le monde."
	Indonesia_Politics_4: "Établir officiellement des relations avec l'URSS"
	Indonesia_Politics_4_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Soviet\n\n\n\n\n\n§W-----------------------§!\nLes liens entre l'Union soviétique et notre pays ne sont peut-être pas aussi forts qu'ils l'étaient avec l'Inde ou l'Égypte, mais les liens entre les peuples russe et indonésien perdurent depuis le XIXe siècle.\n\nEn 1806, Ivan Krusenstern et Yuri Lisyansky se sont échoués sur nos côtes lors du premier tour du monde russe. Puis, en 1818, Kotsebu dirigea son expédition scientifique. Les gens diront peut-être que ce n'est qu'une exploration et rien de grand. Cependant, à la fin du XIXe siècle, N.N. Mikluho-Maclay, A.I.. Voeikov et V.A. Karavaev a mené des recherches sur Java et d'autres îles de l'archipel.\n\nLe grand intérêt de la Russie pour l'Indonésie s'est manifesté avec l'ouverture du premier consulat en 1894 à Batavia, alors capitale des Indes néerlandaises. Avant l'ouverture du consulat, les navires russes Pamyaty Azova et Vladimir Monomah sont arrivés à Batavia en 1890 avec à leur bord le prince héritier Nicolas II, qui deviendra plus tard empereur de Russie, lors de son voyage vers les pays de l'Est.\n\nIl est dans notre intérêt de poursuivre cette relation plus avant, car en fait, l'influence soviétique dans notre pays ne pourrait que profiter à nos capacités industrielles et armées naissantes."
	Indonesia_Politics_5: "Contenir l'influence de la PKI"
	Indonesia_Politics_5_desc: "§W-----------------------§!\n\n\n\n£Indonesia_PKI3\n\n\n\n\n\n§W-----------------------§!\nLa résurgence du PKI a provoqué une réaction très mitigée au sein du spectre politique, les islamistes affirmant que le communiste n'a pas sa place en Indonésie, et les nationalistes qui dédaignent beaucoup l'idéologie communiste d'une société apatride.\n\nDans le cadre de ces forces, il est également dans notre intérêt de contenir l'influence du PKI à la fois au sein du DPRS et du Public, ce qui sera utile pour nos prochaines élections à l'avenir."
	Indonesia_Politics_6: "Intégrer le Sultanat de Buton"
	Indonesia_Politics_6_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Buton\n\n\n\n\n\n§W-----------------------§!\nPendant la majeure partie de son histoire, le sultanat de Buton était le seul sultanat indépendant des Indes néerlandaises. Bien qu'il prétende ne jamais s'être formellement soumis à la domination néerlandaise, le Sultanat est sans aucun doute l'une des nombreuses régions qui faisaient partie des anciennes Indes néerlandaises.\n\nEn intégrant formellement le Sultanat, nous achèverons notre lutte pour un État unitaire unique."
	Indonesia_Politics_7: "Abolir le sultanat de Buton"
	Indonesia_Politics_8: "Vote de censure"
	Indonesia_Politics_8_desc: "Le Conseil représentatif du peuple et le président [GetINO_PRES] ont annoncé qu'ils nous retireraient notre mandat si nous ne parvenons pas à rassembler le soutien nécessaire dans un délai d'un mois."
	Indonesia_Politics_9: "Parler avec le président"
	Indonesia_Politics_10: "Faire une réfutation en DPR"
	Indonesia_Politics_11: "Ultimatum PNI à Natsir"
	Indonesia_Politics_11_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Natsir_Motion\n\n\n\n\n\n§W-----------------------§!\nLe refus de Mohammad Natsir de coopérer avec le PNI a entraîné leur résistance à la politique de Natsir et au gouvernement du Cabinet au sein du DPRS. Actuellement, leur résistance est uniquement concentrée au sein du DPRS. Les tensions politiques continuent de croître alors que les personnalités de l'opposition défient de plus en plus le gouvernement et critiquent sa politique, créant ainsi une instabilité croissante au sein de l'Assemblée.\n\nMais si les choses deviennent trop chaudes, Mohammad Natsir pourrait être inculpé puis démis de ses fonctions de Premier ministre. Si la situation continue de s'aggraver, la résistance au sein du DPRS pourrait se transformer en une tentative directe de le destituer de ses fonctions, déclenchant potentiellement une crise politique plus large."
	Indonesia_Politics_12: "Deuxième ultimatum PNI"
	Indonesia_Politics_12_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Natsir_Motion_2\n\n\n\n\n\n§W-----------------------§!\nL'impasse qui a suivi le premier ultimatum et le désaccord des autres partis sur les politiques de non-réconciliation de Natsir ont poussé le DPRS au point de rupture. Les tensions politiques au sein de l'Assemblée continuent de croître alors que les partis d'opposition considèrent de plus en plus la position du cabinet comme inflexible et préjudiciable aux efforts de compromis et de stabilité.\n\nC'est désormais décisif : si Natsir continue à ne pas coopérer, il doit être remplacé. Les pourparlers se multiplient déjà avec les partis recommandant l'ancien ministre de la Santé et médecin, M. Soekiman Wirjosandjojo."
	Indonesia_Politics_13: "Manai Sophiaan Mouvement"
	Indonesia_Politics_14: "Les affaires [GetMonth]"
	Indonesia_Politics_14_desc: "§W-----------------------§!\n\n\n\n£Indonesia_October\n\n\n\n\n\n§W-----------------------§!\nL'introduction d'un projet de loi concernant la restructuration et la démobilisation des forces armées a provoqué un tollé important au sein de l'armée, notamment parmi les généraux de haut rang, comme Nasution, Soebroto et même Hamengkubuwono IX, qui s'opposaient à tout projet de démobilisation et de définancement de l'armée.\n\nCependant, si nous pouvons les combattre, que ce soit en faisant des compromis ou simplement en convainquant l'un des généraux, nous pouvons leur faire accepter partiellement la nouvelle normalité. Quoi qu'il en soit, si nous ne le faisons pas immédiatement, l'armée contraindra le président Soekarno contre nous."
	Indonesia_Politics_15: "Contraindre Nahdlatul Ulama"
	Indonesia_Politics_15_desc: "§W-----------------------§!\n\n\n\n£Indonesia_NU\n\n\n\n\n\n§W-----------------------§!\nL'une des plus grandes organisations islamiques traditionnelles, Nahdlatul Ulama, s'est séparée du Masyumi et s'est constituée en parti politique, les deux se battant les uns contre les autres et se qualifiant de forces de division au sein de la structure politique indonésienne. Il est dans notre intérêt d'approcher NU et d'essayer de le contraindre à soutenir notre gouvernement, cela rendra le gouvernement plus rigide et fonctionnera mieux car la moitié de la population javanaise, qui dominait le tableau, fait sans aucun doute également partie de Nahdlatul Ulama."
	Indonesia_Politics_16: "Les communistes font des pas !"
	Indonesia_Politics_16_desc: "§W-----------------------§!\n\n\n\n£Indonesia_PKI\n\n\n\n\n\n§W-----------------------§!\nSuite au rajeunissement de son Parti communiste, le PKI a progressivement accru son soutien au sein de la classe prolétaire de notre pays, nous devons agir !"
	Indonesia_Politics_17: "Arrêter les dirigeants du PKI"
	Indonesia_Politics_17_desc: "§W-----------------------§!\n\n\n\n£Indonesia_PKI2\n\n\n\n\n\n§W-----------------------§!\nLes communistes au sein du DPRS ont agi de manière plus radicale dans leurs actions. Le Premier ministre [INO.GetLeader] a donc accepté d'arrêter les dirigeants du PKI au sein du DPRS, ce qui porterait un coup à leur influence au sein du gouvernement."
	Indonesia_Politics_18: "Poursuite de Re-Ra"
	Indonesia_Politics_18_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Rera\n\n\n\n\n\n§W-----------------------§!\nLa proclamation de l'USI ouvre une nouvelle opportunité pour poursuivre le programme ReRa, qui a été stoppé lors de la deuxième agression militaire néerlandaise en 1948. En prévision de la création éventuelle de l'État unitaire de la République d'Indonésie, nous devons renforcer la chaîne de commandement au sein de l'État, afin de pouvoir transformer l'APRIS en une véritable force de combat."
	Indonesia_Politics_19: "Loi militaire centrale n°1/1951"
	Indonesia_Politics_19_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Sobsi\n\n\n\n\n\n§W-----------------------§!\nSentral Organisasi Buruh Seluruh Indonesia, ou SOBSI est un syndicat étroitement lié au PKI, le principal parti communiste de notre république. Ces derniers temps, ils ont organisé une grève des travailleurs et ont stoppé notre industrie naissante, que ce soit par volonté sincère ou si le PKI lui-même l'orchestre, pour le moment nous devrions interdire la grève des travailleurs si nécessaire."
	Indonesia_Politics_20: "Loi d'urgence n° 16/1951"
	Indonesia_Politics_20_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Sobsi2\n\n\n\n\n\n§W-----------------------§!\nL'interdiction des grèves ouvrières a eu un impact profond sur notre économie naissante. Alors que le PKI devient encore plus radical, nous n'avons d'autre choix que de lever l'interdiction des grèves."
	Indonesia_Politics_21: "Loi d'urgence n° 12/1951"
	Indonesia_Politics_21_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Law\n\n\n\n\n\n§W-----------------------§!\nPendant la période de la Révolution Nationale, de nombreux groupes ont combattu sous notre nom, suite à la reconnaissance de la souveraineté et au retour subséquent à un État unitaire, ces groupes qui possèdent une arme de fortune, qu'il s'agisse d'un fusil, d'une lance en bambou ou d'une machette, se comptent par centaines de milliers, voire par millions. En promulguant cette loi, nous réduirons ce nombre d'armes illégales et les saisies seront redistribuées à l'ensemble des Forces armées."
	Indonesia_Politics_22: "Soutenez Mohammed Hatta"
	Indonesia_Politics_22_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Hatta1\n\n\n\n\n\n§W-----------------------§!\n§Y\"La démocratie ne fonctionne que si elle s'accompagne d'un sens des responsabilités. Il n'y a pas de démocratie sans responsabilité. Et une démocratie qui dépasse ses limites et déborde dans l'anarchie connaîtra sa fin et sera temporairement remplacée par des dictateurs.\"\n-Mohammad Hatta§!\n\nAlors que le gouvernement Wilopo annonçait sa démission, un nom s'est levé au sein du DPRS, ce nom est quelque chose que tout le monde connaît, celui du vice-président, Mohammad Hatta, qui est considéré comme le leader du compromis jusqu'aux élections."
	Indonesia_Politics_23: "Soutenez Ali Sostroamidjojo"
	Indonesia_Politics_23_desc: "§W-----------------------§!\n\n\n\n£Indonesia_Sostroamidjojo\n\n\n\n\n\n§W-----------------------§!\n§Y\"Une Nation de Droit est la garante de la liberté des peuples\".\n-Ali Sostroamidjojo§!\n\nAlors que le gouvernement Wilopo est presque hors de cause en raison de la bévue de l'armée et de la mauvaise réaction à l'incident de Tandjung Morawa, on a parlé au sein du DPRS d'une destitution, et avant que cela ne soit fait, Wilopo annonce la démission de son cabinet, Ali Sostroamidjojo, ancien ministre de l'Éducation, devrait le remplacer."
