	INO_Death_of_Sudirman: "Décès du général Soedirman"
	INO_Death_of_Sudirman_desc: "§RC'est arrivé...§!\n\nSoedirman, l'un de nos généraux les plus vénérés, est décédé. Pendant des années, il a mené notre lutte pour l'indépendance à travers une guérilla brutale. Il affronta de redoutables adversaires sur deux fronts : les forces coloniales néerlandaises et la tuberculose implacable. Son courage inébranlable et son génie stratégique ont inspiré d'innombrables autres personnes à se joindre à la lutte pour la liberté.\n\nMalgré notre triomphe sur les Hollandais, Soedirman succomba finalement à la tuberculose. Sa perte est profondément ressentie dans tout le pays, car il symbolisait non seulement la résilience et la détermination, mais incarnait également l'esprit de notre lutte pour la liberté. Son héritage vivra à jamais dans le coeur de ceux qu'il a inspirés et dans l'histoire de notre indépendance."
