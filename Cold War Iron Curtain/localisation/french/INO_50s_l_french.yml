	POLITICS_MOHAMMAD_HATTA_DESC: "Né à Sumatra, dans les Indes néerlandaises, le 12 août 1902, Mohammad Hatta n'a pas besoin de pousser fort pour recevoir une audience. C'était un individu calme et systématisé, une personne forte qui ne pensait pas dans le bruit mais avec une conviction tranquille et une clarté d'objectif indubitable.\n\nLà où d'autres suscitent la ferveur, Hatta suscite le respect. Un penseur, un économiste, un nationaliste courbé par les études et l'exil ; il évite le rôle de démagogue en faveur d'un gentleman-homme d'État calculé, posé et sans compromis juste dans sa quête de justice et d'indépendance. Son patriotisme murmure, non pas un cri à ignorer, mais un patriotisme enraciné, fondé sur des principes et précis.\n\nSon comportement l'éloigne peut-être des applaudissements, mais il impose le respect par sa présence. Leur Premier ministre, Hatta, avait du culot, traversait la table des responsables coloniaux ou se promenait parmi les villageois avec un sourire discret. Essentiellement, il était l'intellect, la conscience et l'équilibre moral de la République. La liberté, dans son concept, n'est pas un cri mais un acte - un acte qui doit être solidement construit autour des structures, de la loi et de la dignité du travail."
	POLITICS_MOHAMMAD_HATTA_LIB_DESC: "Mohammad Hatta est né le 12 août 1902 à Sumatra, dans les Indes néerlandaises. Tout au long de sa vie, il a fait preuve d'une capacité remarquable à attirer l'attention sans jamais avoir besoin d'élever la voix. Connu pour son attitude posée et son approche méthodique, Hatta était une figure de force qui opérait non pas dans le tumulte d'une rhétorique bruyante mais dans la clarté sereine de ses convictions et de ses objectifs.\n\nAlors que de nombreux dirigeants prospèrent grâce à la ferveur et aux appels émotionnels, la force de Hatta réside dans le respect qu'il a gagné des autres. C'était un penseur et un économiste, un nationaliste dévoué qui a fait face à des difficultés, notamment des périodes d'exil, mais il a choisi de rejeter la voie du démagogue. Au lieu de cela, il a adopté le rôle d'un gentleman-homme d'État - calculé dans ses actions, équilibré dans son comportement et inébranlablement engagé en faveur de la justice et de la quête de l'indépendance de son pays.\n\nMême si son approche calme l'a peut-être éloigné des fanfares et des applaudissements généralement associés aux dirigeants politiques, sa présence imposait un profond respect. En tant que Premier ministre indonésien, Hatta a fait preuve d'un courage remarquable lors des négociations, qu'il soit assis à la table des responsables coloniaux ou qu'il discute avec les villageois, tout en arborant son doux sourire caractéristique.\n\nSes efforts ont abouti à une réalisation significative lorsqu'il a négocié avec succès l'intégration du Pasundan dans la République. Cette victoire renforce sa réputation, le transformant d'un simple diplomate avisé en une figure nationale célébrée dans tout l'archipel. En tant que vice-président de la République et voix de premier plan en matière de gouvernance nationale, Hatta se tenait à l'avant-garde d'un mouvement prêt à réaliser le rêve longtemps caressé de la République. Sous sa direction et sa vision, l'Indonésie était sur la bonne voie pour devenir une nation prospère, responsable et véritablement indépendante."
	POLITICS_ANAK_AGUNG_DESC: "Né dans l'aristocratie balinaise le 21 juillet 1921, Anak Agung était le Raja de Gianyar, instruit aux Pays-Bas et en Indonésie, parlant couramment la diplomatie et imprégné des traditions politiques indigènes. Son parcours était unique : un dirigeant traditionnel façonné par l'administration coloniale et l'éducation occidentale, mais de plus en plus attiré par la cause nationaliste.\n\nPendant la Révolution nationale indonésienne, il a choisi la voie de la négociation et de l'unité. Contrairement à certains dirigeants fédéralistes qui se sont alignés sur les États parrainés par les Pays-Bas, Anak Agung a adopté une position plus mesurée et finalement pro-républicaine. Il devient Premier ministre de l'État d'Indonésie orientale, une entité fédérale créée par les Néerlandais pour contrer la République d'Indonésie centrée à Yogyakarta.\n\nBien que sa position soit intrinsèquement liée au fédéralisme conçu par les Pays-Bas, Anak Agung a utilisé sa fonction non pas pour diviser, mais pour rechercher une réconciliation pacifique entre la République et les États fédéraux. Il a joué de plus en plus le rôle de médiateur, plaidant pour une Indonésie unifiée et travaillant en coulisses pour garantir que la diplomatie - et non la force - déterminerait l'avenir du pays."
    POLITICS_SYAFRUDDIN_PRAWIRANEGARA_DESC: "Né le 28 février 1911 à Anyer Kidul, Banten. Sjafruddin Prawiranegara était issu d'une famille aristocratique santri, un milieu qui combinait une lignée noble avec les valeurs disciplinées de l'érudition islamique. Ce double héritage a influencé ses premières années, lui apportant à la fois la rigueur intellectuelle de l'éducation coloniale néerlandaise et les fondements moraux de la tradition religieuse. Dès le début, il s'est distingué comme étant doté de principes, d'esprit vif et inébranlable dans son sens du but. Son ascension vers la notoriété n'est pas due à l'opportunisme, mais plutôt au résultat d'une détermination tranquille et d'une extraordinaire clarté de pensée dans des périodes de turbulences.\n\nCalme d'attitude et ferme dans sa politique, il imposait le respect non par son autorité mais par son caractère. Dans les moments de crise, il est resté fidèle, non pas comme un simple symbole, mais comme un point d'ancrage solide. Son leadership n'était pas guidé par l'ambition du gain personnel, mais par un sens du devoir envers la République et ses idéaux fondateurs. Suivre Sjafruddin signifiait suivre l'intégrité elle-même.\n\nÉconomiste passionné et l'un des premiers architectes financiers de la République, le leadership de Sjafruddin a atteint son apogée lors de l'agression militaire néerlandaise lorsqu'il est devenu le chef du gouvernement d'urgence de la République en 1948. Dans ce rôle, il a maintenu l'esprit de la République vivant au plus profond de l'arrière-pays de Sumatra. Ni né dans un palais ni forgé au combat, son sens politique était marqué par l'endurance, l'intégrité et une loyauté farouche envers les idéaux de la République."
	POLITICS_ENGELBERT_TATENGKENG_DESC: "Dans les trésors littéraires indonésiens, de nombreux aspects religieux trouvent un écho sous forme de poésie. Il y a Taufiq Ismail, Emha Ainun Najib et bien d'autres. Surtout lorsqu'on parle des nouveaux poètes, bien sûr, les gens se souviendront du nom d'Amir Hamzah, le roi des nouveaux poètes, qui, non moins souvent, écrivait des poèmes religieux. Cependant, la couleur du christianisme dans la littérature indonésienne n'est pas grande.\n\nMais cela ne veut pas dire qu'aucun écrivain chrétien n'a jamais orné la littérature de ce pays. Pourtant, une génération avec le nouveau poète King a également enregistré le nom J.E. Tatengheng. Si l'un vient de l'ouest de l'Indonésie, l'autre vient de l'est de l'Indonésie. C'est juste que J.E. Tatengkeng est le seul écrivain qui présente les nuances du christianisme de son époque.\n\nNé sous le nom de Jan Engelbert Tatengkeng à Kolongan, Sangihe, Sulawesi du Nord, le 19 octobre 1907. Son père était professeur d'évangile ainsi que directeur d'une école zending. Il n'est pas surprenant qu'il semble finalement avoir une culture chrétienne assez épaisse, qu'il présente dans divers poèmes. Certaines personnes peuvent considérer ses oeuvres qui respirent le christianisme comme étant uniquement basées sur les antécédents familiaux et les habitants de Sulawesi, qui, en fait, sont chrétiens. Cependant, nous devons considérer le fait que le Saint-Esprit oeuvre effectivement chez ses élus.\n\nBien que considéré comme l'un des nouveaux écrivains poètes, Tatengkeng est également actif en politique. Comme il est actuellement Premier ministre de l'Indonésie orientale, en remplacement d'Ide Anak Agung Gde Agung, son leadership n'a pas encore été prouvé, mais Tatengkeng, malgré ses antécédents et ses opinions politiques, savait ce que signifiait diriger, ce que signifiait être indonésien."
	POLITICS_MOHAMMAD_NATSIR_DESC: "Un leader, un penseur et sans aucun doute un moderniste : des titres qui résument l'histoire de la vie de §YMohammad Natsir.§!\n\nNé en 1908 dans une famille islamique pieuse, Natsir était un apprenant avide qui recherchait des connaissances et de nouvelles langues, dont le français et l'anglais. En tant que moderniste, il s'est activement engagé dans des discussions avec d'éminentes personnalités islamiques, telles qu'Agus Salim. Son parcours en tant que leader a véritablement commencé avec la création de Masyumi.\n\nSuite à la proclamation de l'indépendance de l'Indonésie, Natsir a été nommé ministre de l'Information. Son initiative, le Natsir Integral Motion, représentait une étape importante vers la restauration de l'État unitaire. Le 6 septembre 1950, il est nommé Premier ministre de la République d'Indonésie."
