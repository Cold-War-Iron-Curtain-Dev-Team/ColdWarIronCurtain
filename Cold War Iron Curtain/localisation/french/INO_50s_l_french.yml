    INO_Hatta_Premiership: "La Premiership Hatta"
	INO_Hatta_Premiership_desc: "Mohammad Hatta a mené une vie extraordinaire et sa contribution à l'existence de notre pays est incalculable. Il y en a très peu dans notre jeune nation à la fois aussi qualifiées et intrinsèquement liées à notre lutte pour la liberté que Hatta"
	INO_Cabinet_Program: "Programmes du Cabinet"
	INO_Cabinet_Program_desc: "Le deuxième cabinet Hatta est plutôt intéressant, car il a été formé à la suite de l'accord Roem Van Roijen, Hatta étant à nouveau Premier ministre. Suite au transfert de souveraineté, le Cabinet a été rebaptisé Cabinet des États-Unis d'Indonésie, et le programme du Cabinet sera enfin mis en oeuvre pour remplir son devoir."
	INO_Education_Program: "Programmes éducatifs"
	INO_Education_Program_desc: "L'éducation coloniale est loin d'être comparable à celle de n'importe quelle nation ayant remporté un dur combat pour son indépendance, et l'Indonésie n'est pas différente. Ce qui n'est qu'aggravé par le fait que nous avons été contraints de faire face successivement à l'occupation hollandaise et japonaise. Maintenant que nous sommes maîtres de notre pays, nous pouvons offrir à notre peuple une éducation plus complète et plus moderne."
	INO_Rebuilding_Economy: "Construire les bases des économies"
	INO_Rebuilding_Economy_desc: "Malheureusement, les Néerlandais nous ont laissé très peu d'économie sur laquelle s'emparer et utiliser pour reconstruire l'Indonésie. Nous devons effectivement repartir de zéro. Cela dit, cela signifie que nous avons la possibilité de développer une économie qui réponde au mieux à nos besoins sans avoir à affronter les ruines de ce qui existait auparavant."
	INO_Repatriate_Former_KNIL: "Rapatrier les anciens soldats du KNIL"
	INO_Repatriate_Former_KNIL_desc: "La KNIL (Armée royale des Indes orientales néerlandaises) est une longue épine dans notre pied, même maintenant que nous avons gagné une paix relative. Nous avons toujours essayé d'intégrer le reste de la KNIL pour renforcer nos propres forces armées, mais les conflits internes ont rendu cet objectif inaccessible. Leur permettre de se réinstaller aux Pays-Bas est une solution bien plus humanitaire et plus rentable que de les laisser pourrir."
	INO_Return_Dutch_Soldiers: "Retourner les soldats néerlandais"
	INO_Return_Dutch_Soldiers_desc: "Même si nous ne pouvons pas prétendre que les dernières décennies d'oppression violente et de conflits n'ont pas eu lieu, nous ne pouvons pas non plus rester aveugles aux réalités de la guerre froide qui se déroule aujourd'hui. Cela n'a aucun sens de garder des soldats prisonniers alors que leur guerre est déjà perdue. Si rien d'autre leur accorder leur liberté ne nous aide à garantir la légitimité de notre gouvernement à l'étranger"
	INO_Start_Integration_Process: "Démarrer le processus d'intégration"
	INO_Start_Integration_Process_desc: "Bien que nous soyons les maîtres incontestables de notre pays, nombre de nos territoires sont restés sous le contrôle ferme de nos anciens oppresseurs coloniaux. Maintenant que ces territoires sont sous notre contrôle, il est temps d'entamer le processus visant à les consolider en tant que véritables pierres angulaires d'une Indonésie libre"
	INO_Continue_Talks_on_Papua: "Poursuivre le débat sur la Papouasie"
	INO_Continue_Talks_on_Papua_desc: "Même si nous sommes libérés de la domination coloniale, notre chaîne d'îles ne l'est pas. Malheureusement, les Papous sont piégés par un tyran colonial différent du nôtre, les laissant, ainsi que notre territoire légitime, sous occupation néerlandaise. Cependant, les Néerlandais, lors de la table ronde, nous ont promis qu'ils nous rendraient la Papouasie une fois notre souveraineté établie."
	INO_Form_the_UI: "Former l'Université d'Indonésie"
	INO_Form_the_UI_desc: "Construite sur la base de l'ancienne « École de la santé, des sciences et des vaccins » néerlandaise, l'Université d'Indonésie (UI) sera un institut moderne pour l'enseignement supérieur de notre peuple et sera un véhicule clé pour élever notre pays au niveau de celui de nos anciens oppresseurs coloniaux. Espérons que ce soit le premier d'une longue série d'assurances-chômage qui permettront à nos citoyens de suivre une formation médicale et technique supérieure sans avoir à quitter le pays."
	INO_Start_Literacy_Program: "Commencez à éradiquer l'analphabétisme"
	INO_Start_Literacy_Program_desc: "Des décennies de régime colonial et des années de lutte pour l'indépendance ne permettent généralement pas une éducation à grande échelle de la jeunesse d'une nation. Cela l'est encore moins lorsque les niveaux d'éducation sont réglementés par des années d'oppression coloniale. Maintenant que nous avons gagné notre liberté, il est temps de remédier aux nombreux déficits créés par nos anciens oppresseurs. À commencer par notre taux d'alphabétisation."
	INO_A_New_Generation: "Éduquer la nouvelle génération"
	INO_A_New_Generation_desc: "Bientôt naîtra une génération qui ne connaîtra jamais les horreurs de la guerre ni la lutte pour l'indépendance. Aujourd'hui encore, une génération est en train de naître qui n'aura jamais connu l'oppression néerlandaise. Si nous souhaitons réussir à l'avenir, nous devons veiller à ce que nos générations futures soient armées des connaissances dont elles ont besoin pour nous faire avancer."
	INO_Support_Pesantren: "Fonds Pesantren"
	INO_Support_Pesantren_desc: "Pesantren est un internat islamique traditionnel de longue date enseigné dans des maisons privées, des pondoks ou des mosquées. Bien qu'il ne s'agisse pas de ce que beaucoup à l'extérieur de notre pays appelleraient une éducation standard, elle constitue un outil indispensable à la fois pour lutter contre l'analphabétisme, mais également pour garantir que l'éducation atteigne les communautés plus rurales et isolées. Si nous voulons garantir à notre population l'accès à l'éducation dans tout le pays, des institutions comme Pesantren sont des moyens parfaits pour y parvenir."
	INO_Formalize_Higher_Education_System: "Formaliser le système d'enseignement supérieur"
	INO_Formalize_Higher_Education_System_desc: "Nous pouvons garantir que nos citoyens puissent recevoir une éducation comparable à celle de la communauté mondiale dans son ensemble, et encore moins travailler dans des industries plus complexes au niveau national s'ils n'ont personne pour leur enseigner. Si nous voulons garantir que nos citoyens ne cherchent pas à faire des études supérieures à l'étranger, nous devons travailler rapidement pour garantir qu'ils puissent les trouver ici."
	INO_Start_Preparatory_Committee_For_Election: "Formulaire Comité préparatoire des élections"
	INO_Start_Preparatory_Committee_For_Election_desc: "Si nous voulons une transition en douceur du pouvoir et, par conséquent, un système politique stable, nous avons besoin d'un comité pour organiser et formaliser à la fois un système et des lignes directrices sur la manière dont les élections se dérouleront et sur la manière dont notre peuple y participera."
	INO_Policing_Action: "Agissez contre la rébellion"
	INO_Policing_Action_desc: "Darul Islam et Madiun Affairs sont deux des nombreuses rébellions qui ont eu lieu en Indonésie. Une fois notre souveraineté enfin proclamée et le « Londo » détesté disparu, nous devrions agir contre ces rébellions. Après tout, notre République doit durer, unie dans la diversité."
	INO_Campaign_for_Recognition: "Lancer une campagne de reconnaissance"
	INO_Campaign_for_Recognition_desc: "Gagner notre liberté est une chose, mais être un État reconnu en est une autre. Si le monde ne nous reconnaît pas comme le gouvernement légitime de l'Indonésie, cela ouvrira la porte à une répétition des horreurs de ces dernières années. Entamer une tournée mondiale pour obtenir la reconnaissance éradiquera non seulement davantage les ambitions néerlandaises pour son ancienne colonie, mais nous permettra également d'exercer un jour notre propre influence et de soutenir nos propres ambitions."
	INO_Free_and_Active: "Place de l'Indonésie dans le monde"
	INO_Free_and_Active_desc: "Maintenant que nous avons un pays qui nous appartient, nous sommes désormais obligés de nous poser et de répondre à la simple question de savoir quelle est notre place dans ce monde idéologiquement divisé. Avec qui allons-nous nous ranger, qu'apportons-nous à la communauté mondiale ? Nous devrons bientôt répondre à de nombreuses questions comme celles-ci si nous voulons nous considérer comme un pays fonctionnel."
	INO_Fixing_the_Railways: "Moderniser le chemin de fer indonésien"
	INO_Fixing_the_Railways_desc: "Malgré la nécessité de systèmes ferroviaires modernes à l'échelle nationale, le développement des lignes ferroviaires de Java est le meilleur point de départ. Non seulement cela s'associera parfaitement à nos plans de développement de la région, mais le transport de marchandises à travers l'île qui abrite notre capitale est l'élément vital de notre nation, et les ruines de l'infrastructure coloniale sont loin de suffire à répondre à nos besoins."
	INO_Development_in_Java: "Démarrer le programme de développement en Java"
	INO_Development_in_Java_desc: "Nous avons un long chemin à parcourir pour sortir notre pays des ruines de l'occupation et de la guerre civile, et quel meilleur point de départ que Java lui-même ? Non seulement elle abrite notre capitale, Jakarta, mais elle abrite également une grande partie de la population du pays dans son ensemble. Les nouvelles industries et les efforts d'urbanisation ne sont que la première étape pour amener l'ensemble de l'Indonésie dans le monde moderne."
	INO_Start_Light_Industry: "Financement de l'industrie légère nationale"
	INO_Start_Light_Industry_desc: "Aussi important que soit le développement de Jakarta, nous ne pouvons pas laisser le reste de notre pays languir. Financer le développement et la création de lieux de travail pour notre population non seulement aidera directement notre économie en plein essor, mais est également crucial pour sortir notre population de la pauvreté."
	INO_Minimum_Wage: "Établir les salaires de base"
	INO_Minimum_Wage_desc: "Kerdja Paksa, ou travail forcé, fait référence aux conditions de travail vécues sous le gouvernement colonial en Indonésie. Malgré la proclamation de l'indépendance, il n'y a pas eu de programme significatif pour les travailleurs et les ouvriers. Pour résoudre ce problème, nous nous engageons à établir un programme de salaire minimum à l'échelle nationale."
	INO_Build_New_Hospital: "Élargir l'accès à l'hôpital"
	INO_Build_New_Hospital_desc: "C'est une triste réalité que l'accès à des soins de santé de qualité, sans parler d'un endroit capable de soigner les malades ou les blessés graves, soit incroyablement faible. Nos communautés les plus rurales ont peu accès aux soins de santé modernes, et même certaines de nos villes peuvent en être dépourvues. Poser les bases de nouveaux hôpitaux est une nécessité immédiate."
	INO_Dismantle_Federal_Institute: "Proclamer l'État unitaire"
	INO_Dismantle_Federal_Institute_desc: "Même si beaucoup pourraient affirmer qu'un système fédéral nous conviendrait mieux dans un pays aussi grand et rempli de langues et de cultures diverses que le nôtre. C'est tout simplement un idéalisme faux et insensé qui ignore la réalité. Nous avons besoin d'un gouvernement central fort, capable de prendre les décisions drastiques et nécessaires et de prendre les mesures immédiates dont nous avons besoin pour nous élever vers le monde moderne en tant que nation libre et développée. Aujourd'hui, nous célébrons l'abolition des États-Unis d'Indonésie et annonçons une nouvelle ère pour notre pays !"
