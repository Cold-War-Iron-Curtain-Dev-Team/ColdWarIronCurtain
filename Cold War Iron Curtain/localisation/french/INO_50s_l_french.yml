    #spirit
	INO_Approval_Rate_dynamic: "Cote d'approbation du Premier ministre"
	INO_Independence_or_Death: "L'indépendance ou la mort"
	INO_Independence_or_Death_desc: "§RKami menderita kekalahan, tapi kami tidak pernah mengaku kalah. Kami senantiasa menjimpan dalam djiwa kami, tjita² Indonésie merdeka, berdaulat, adil, dan makmur !!\n§W-Mohammad Hatta, 17 août 1949§!"
	INO_Roem_van_Roijen_Agreement: "Accord Roem Van Roijen"
	INO_Roem_van_Roijen_Agreement_desc: "Roem et van Roijen étaient deux individus distincts avec des idées différentes, mais ils ont trouvé un terrain d'entente et se sont rencontrés pour discuter du sort de l'Indonésie.\n\nBeaucoup considèrent cet accord comme une tentative ratée de plus, à l'instar des accords de Linggadjati et de Renville. Cependant, certains espèrent encore un tel accord, non pas parce qu'ils croient que les Néerlandais le respecteront, mais parce qu'ils croient que la diplomatie peut triompher des canons et des chars. L'avenir de la République, une fois de plus, est en jeu."
	INO_Federalism: "Système fédéral dans un État unitaire"
	INO_Federalism_desc: "Dans la Constitution de 1945, l'Indonésie est classée comme État unitaire. Cependant, cet objectif d'établir un État unitaire entrave la voie vers une véritable indépendance. Lors de la table ronde, les Néerlandais ont fait pression sur nous pour réformer notre système pour en faire un système fédéral, semblable à celui des États-Unis. Finalement, c'était le prix que nous devions payer pour l'indépendance, n'est-ce pas ?"
	INO_Federalism_2: "Système fédéral dans un État unitaire"
	INO_Federalism_2_desc: "Dans la Constitution de 1945, l'Indonésie est classée comme État unitaire. Cependant, cet objectif d'établir un État unitaire entrave la voie vers une véritable indépendance. Lors de la table ronde, les Néerlandais ont fait pression sur nous pour réformer notre système pour en faire un système fédéral, semblable à celui des États-Unis. Finalement, c'était le prix que nous devions payer pour l'indépendance, n'est-ce pas ?"
	INO_Federalism_3: "Système fédéral dans un État unitaire"
	INO_Federalism_3_desc: "Dans la Constitution de 1945, l'Indonésie est classée comme État unitaire. Cependant, cet objectif d'établir un État unitaire entrave la voie vers une véritable indépendance. Lors de la table ronde, les Néerlandais ont fait pression sur nous pour réformer notre système pour en faire un système fédéral, semblable à celui des États-Unis. Finalement, c'était le prix que nous devions payer pour l'indépendance, n'est-ce pas ?"
	INO_United_and_Indivisible: "Unis et Indivisibles"
	INO_United_and_Indivisible_desc: "Nous avons enfin atteint un tournant capital dans l'histoire de notre nation, marquant l'abolition de la Constitution du RIS et l'établissement de la Constitution provisoire de 1950. L'Indonésie est à nouveau unie en tant que République unitaire singulière. Cependant, ce n'est que le début de notre voyage.\n\nMême si nous avons rédigé une nouvelle constitution qui reflète nos aspirations et nos besoins actuels, il est essentiel de reconnaître que cette Constitution n'est pas gravée dans le marbre. D'une manière ou d'une autre, nous finirons par modifier cette Constitution."
	INO_United_and_Indivisible_2: "Unis et Indivisibles"
	INO_United_and_Indivisible_2_desc: "Nous avons enfin atteint un tournant capital dans l'histoire de notre nation, marquant l'abolition de la Constitution du RIS et l'établissement de la Constitution provisoire de 1950. L'Indonésie est à nouveau unie en tant que République unitaire singulière. Cependant, ce n'est que le début de notre voyage.\n\nMême si nous avons rédigé une nouvelle constitution qui reflète nos aspirations et nos besoins actuels, il est essentiel de reconnaître que cette Constitution n'est pas gravée dans le marbre. D'une manière ou d'une autre, nous finirons par modifier cette Constitution."
	INO_Bandung_Sea_of_Fire: "Mer de feu de Bandung"
	INO_Bandung_Sea_of_Fire_desc: "§RHalo, halo Bandung, ibukota P'riangan\nHalo, halo Bandung, kota kenang-kenangan\nSudah lama beta tidak berdjumpa dengan kau\nSekarang telah mendjadi lautan api\nMari Bung réfute Kembali !§!\n\nIl y a trois ans, face à l'arrivée imminente des forces britanniques et néerlandaises, nos combattants républicains ont pris une décision grave mais résolue : ils ont rasé la moitié sud de Bandung. Ce n'était pas par imprudence ou par désespoir, mais par un sacrifice calculé visant à priver l'ennemi de confort, d'abri et de contrôle."
	INO_Bandung_Sea_of_Fire_2: "Mer de feu de Bandung"
	INO_Bandung_Sea_of_Fire_2_desc: "§RHalo, halo Bandung, ibukota P'riangan\nHalo, halo Bandung, kota kenang-kenangan\nSudah lama beta tidak berdjumpa dengan kau\nSekarang telah mendjadi lautan api\nMari Bung réfute Kembali !§!\n\nMaintenant que la lutte a porté ses fruits et que la République est reconnue et souveraine, nous regardons avec une fierté solennelle les incendies qui allumaient autrefois le ciel de Bandung. La victoire étant désormais assurée, ce moment ne constitue pas une tragédie, mais un monument de courage. Les restes calcinés du sud de Bandung nous rappellent le prix que nous avons payé pour la liberté - un prix qui ne se compte pas seulement en vies ou en biens, mais en détermination à construire une nation invaincue par la force. "
	INO_A_New_Generation_of_Thinkers: "Une nouvelle génération de penseurs"
	INO_A_New_Generation_of_Thinkers_desc: "L'éducation indonésienne a été confrontée à des défis importants et n'a pas été historiquement considérée comme admirable. Cependant, suite au transfert de souveraineté et à la mise en place d'un système éducatif indépendant, le gouvernement a déployé des efforts concertés pour renforcer la croissance de l'éducation dans le pays. Cela implique le remplacement de l'ancien programme colonial par un programme plus adapté aux besoins et au contexte du peuple indonésien. Pour la première fois dans l'histoire indonésienne, ce changement a permis aux Indonésiens d'origine d'accéder à des opportunités d'enseignement supérieur, leur permettant ainsi de fréquenter des universités et de poursuivre des études avancées."
	INO_Diplomacy_the_Cure_of_Dishonesty: "La diplomatie, le remède à la malhonnêteté"
	INO_Diplomacy_the_Cure_of_Dishonesty_desc: "La République d'Indonésie, malgré la proclamation de son indépendance en 1945, n'a pas d'amis, à l'exception de §Y[RAJ.GetNameWithFlag]§!, §G[EGY.GetNameWithFlag]§!et d'une reconnaissance limitée de §C[USA.GetNameWithFlag]§!. Suite à la création de la République des États-Unis d'Indonésie, le gouvernement indonésien a contacté plusieurs pays pour obtenir une reconnaissance diplomatique."
	INO_Memory_of_Madiun_Affair: "Mémoire de l'affaire Madiun"
	INO_Memory_of_Madiun_Affair_desc: "En 1948, Musso revient de son exil en Union soviétique, où il étudie et reste fidèle aux idéaux du marxisme-léninisme promulgués par le gouvernement soviétique. De retour à Yogyakarta, il rencontre Sukarno dans une série d'affaires compliquées, notamment à Madiun. L'ancien Premier ministre Amir Sjarifuddin et Musso ont formé le Front démocratique du peuple, conçu comme une organisation défiant les dirigeants de Soekarno-Hatta. Néanmoins, ils ont attaqué le TRI stationné près de Madiun, et lorsque la tempête s'est calmée, le TRI s'est lancé dans une chasse aux sorcières et a traqué tous les membres du PDF, y compris Sjarifuddin et Musso lui-même, tandis que le PKI est entré dans la clandestinité."
