    dutch_east_indies_war.1.a: "Nous n'accepterons pas le transfert de la Papouasie occidentale"
    dutch_east_indies_war.1.b: "Nous n'accepterons pas le transfert de la Papouasie occidentale mais nous donnerons à l'Indonésie le choix de la restituer"
    dutch_east_indies_war.1.c: "Nous acceptons tous les termes"
    dutch_east_indies_war.1.t: "La table ronde"
    dutch_east_indies_war.2.t: "Décès de Simon Spoor"
	indonesia.13.t: "Formation du cabinet Wilopo-Prawoto"
	indonesia.13.d: "L'échec du gouvernement de Soekiman Wirjosandjojo à relever efficacement les défis du pays a entraîné une baisse significative de la confiance du public. En conséquence, le DPR a adopté une motion de censure contre Soekiman, incitant le président Soekarno à révoquer son mandat. En réponse, le président Soekarno a nommé Wilopo comme nouveau Premier ministre, avec Prawoto Mangkusasmito comme adjoint. Ce nouveau cabinet devrait apporter de nouvelles perspectives et une énergie renouvelée pour s'attaquer aux problèmes urgents auxquels notre nation est confrontée."
	indonesia.13.a: "Encore...?"
	indonesia.17.d: "Suite à la récente visite du Premier Ministre Hatta dans l'État de Pasundan, sa stature de leader s'est considérablement améliorée. La visite a non seulement mis en valeur ses compétences diplomatiques, mais a également mis en valeur sa capacité à dialoguer avec les dirigeants régionaux et à répondre aux préoccupations locales, ce qui a trouvé un bon écho auprès de la population. En conséquence, l'intérêt du public pour ses politiques et son leadership s'est accru, conduisant à un regain de confiance dans sa gouvernance.\n\nÀ la lumière de cette confiance renouvelée, le gouvernement a décidé de réorganiser sa structure pour mieux s'aligner sur la vision de Hatta pour la nation. Aujourd'hui a marqué un moment charnière alors que le Premier ministre a entrepris un remaniement ministériel, introduisant une nouvelle composition visant à revigorer l'approche gouvernementale face aux divers défis nationaux.\n\nLe Cabinet nouvellement formé, connu sous le nom de Cabinet Hatta-Sjahrir ou Cabinet indonésien uni, reflète un effort de collaboration visant à unifier les différentes factions politiques sous une vision unique pour le pays. Ce cabinet vise à aborder des questions urgentes telles que le développement économique, la justice sociale et l'unité nationale, en mettant l'accent sur la promotion de la coopération entre les différentes régions et secteurs de la société, ainsi qu'en abordant la question de la Papouasie occidentale."
	indonesia.17.a: "Vers une Indonésie prospère !"
	indonesia.18.t: "Création de l'Université d'Indonésie"
	indonesia.18.d: "Aujourd'hui marque un moment charnière dans l'histoire de notre jeune République. Avec l'unification d'établissements d'enseignement supérieur réputés à travers le pays, l'Université d'Indonésie est désormais établie comme le premier centre d'apprentissage de notre pays. De l'ancienne Faculté de médecine de Batavia à la Faculté de droit de Jakarta, ces institutions, autrefois liées par la gouvernance coloniale, sont désormais unies sous la bannière de la République, engagées à faire progresser les intérêts du peuple indonésien.\n\nL'Université offrira un enseignement et une formation exceptionnels en médecine, en droit, en ingénierie et en sciences, équipant ainsi une nouvelle génération d'universitaires et de professionnels qui dirigeront avec confiance notre nation vers cette ère passionnante. Ici, nous cultiverons l'esprit de la jeunesse indonésienne, en lui donnant les moyens de servir avec des compétences exceptionnelles, une intégrité et un engagement inébranlable envers les idéaux d'indépendance."
	indonesia.18.a: "Veritas, Probitas, Justitia"
	indonesia.19.t: "Poursuivre la question de la Papouasie"
	indonesia.19.d: "Le long et pénible crépuscule de l'indépendance a été une période difficile pour notre nation, marquée à la fois par l'espoir et la lutte alors que nous cherchions à établir notre souveraineté. C'est au milieu de cette période charnière qu'a eu lieu la Table ronde, marquant un moment crucial dans nos négociations avec les Pays-Bas. Lors de ces discussions, le gouvernement néerlandais a fait une promesse importante : il nous a assuré que la région d'Irian Jaya, riche en ressources et stratégiquement importante, nous serait à terme cédée.\n\nNous avons compris l'importance de cet engagement et l'avons accepté, le considérant comme un tremplin vers la réalisation des aspirations de notre nation. Aujourd'hui, alors que nous nous trouvons dans une position plus stable - après avoir traversé des eaux politiques difficiles et acquis une plus grande cohésion interne - nous reconnaissons qu'il est temps de revoir cet accord. Nous sommes prêts à dialoguer à nouveau avec les Néerlandais, en exigeant une discussion approfondie sur l'avenir de la Papouasie, une région qui, selon nous, devrait légitimement nous appartenir.\n\nCependant, nous sommes parfaitement conscients qu'il peut y avoir des résistances. Si les Pays-Bas refusent de s'engager dans un dialogue constructif ou tentent de bloquer le processus, nous resterons résolus dans notre position. Nous sommes allés trop loin pour reculer facilement ; la lutte pour nos territoires légitimes se poursuivra et nous n'hésiterons pas à faire valoir nos revendications. Notre détermination est forte et nous sommes déterminés à garantir que les promesses faites lors de la table ronde soient honorées."
	indonesia.19.a: "Expédié à Amsterdam"
	indonesia.20.t: "L'Indonésie sous pression sur la question de la Papouasie"
	indonesia.20.d: "Le gouvernement indonésien nous a envoyé une demande formelle pour discuter de l'avenir de la Papouasie, une région qui a longtemps été un point de discorde entre nos deux nations. Nous comprenons l'importance de cette question et l'importance qu'elle revêt pour l'Indonésie, mais nous devons également tenir compte de nos propres intérêts et de la complexité de telles discussions.\n\nMême si nous sommes ouverts au dialogue, nous sommes préoccupés par le calendrier et l'approche adoptée par le gouvernement indonésien. Nous pensons que l'Indonésie n'est peut-être pas encore tout à fait prête à s'engager dans des négociations significatives sur cette question, et nous estimons qu'il lui faut davantage de temps pour consolider sa position et obtenir le soutien nécessaire de son parlement.\n\nNous sommes prêts à revenir sur cette question à l'avenir, mais pour le moment, nous devons donner la priorité à nos propres intérêts nationaux et veiller à ce que toutes les discussions soient menées d'une manière respectueuse et productive pour les deux parties. Nous espérons que l'Indonésie comprendra notre position et que nous pourrons trouver un moyen d'avancer ensemble le moment venu."
	indonesia.20.a: "Bougre éteint"
	indonesia.21.t: "Néerlandais Refusé"
	indonesia.21.d: "Il est certainement décourageant lorsque les attentes se heurtent à la déception. Récemment, nous avons contacté les Néerlandais au sujet d'une question urgente, dans l'espoir d'entamer un dialogue. Malgré notre anticipation, la réponse que nous avons reçue a été plutôt décourageante. Les représentants néerlandais nous ont informés qu'ils estimaient que nous n'étions pas encore prêts à engager une discussion. Ils ont exprimé la nécessité de disposer de plus de temps pour délibérer sur la question avec leur parlement avant que des conversations puissent avoir lieu.\n\nCette situation nous place dans une position difficile. Même si nous comprenons la nécessité de discussions approfondies au sein de leur corps législatif, il est frustrant d'être mis en attente. La suggestion de réexaminer notre demande ultérieurement ne fait qu'ajouter à notre déception, car nous espérions un échange d'idées plus immédiat et potentiellement une voie à suivre. Dans l'ensemble, cela ressemble à un revers, et nous nous retrouvons dans l'attente d'un calendrier futur incertain où un dialogue pourrait réellement avoir lieu."
	indonesia.21.a: "Nous reviendrons dans un an"
	indonesia.22.t: "Le retour des soldats hollandais"
	indonesia.22.d: "Il y a trois siècles, les COV arrivaient sur nos côtes avec l'intention de coloniser nos terres. Ils se sont emparés de nos riches ressources, ont exploité nos richesses naturelles et ont imposé un travail pénible à notre peuple, nous privant de notre dignité et de notre autonomie. Depuis plus de 300 ans, nous subissons un héritage d'humiliation, de souffrance et d'oppression de la part de dirigeants étrangers. Aujourd'hui, nous sommes unis et résolus, déclarant un NON sans équivoque ! Fini le colonialisme, fini la soumission. Nous sommes ici pour affirmer nos droits et réclamer notre souveraineté."
	indonesia.22.a: "Tot Ziens!"
	indonesia.23.t: "Néerlandais accepté sous condition"
	indonesia.23.d: "Le fait que les Néerlandais tiennent leur promesse de négocier le transfert de l'Irian Jaya constitue un pas en avant significatif dans notre lutte en cours pour la pleine souveraineté. Cependant, leur condition selon laquelle nous devons d'abord reconnaître la souveraineté des États-Unis d'Indonésie (RIS) avant de s'engager dans des discussions sur la Papouasie est une exigence complexe et quelque peu frustrante. Même si nous comprenons les réalités politiques et la nécessité de naviguer prudemment dans ces eaux diplomatiques, cela nous semble être un obstacle supplémentaire dans notre quête pour récupérer ce qui nous revient de droit.\n\nNéanmoins, nous nous engageons à remplir nos obligations et à reconnaître le RIS comme faisant partie de notre stratégie plus large pour atteindre nos objectifs. Nous aborderons cette situation avec pragmatisme et détermination, en veillant à remplir leurs conditions tout en gardant en vue notre objectif ultime : assurer l'avenir de la Papouasie en tant que partie intégrante de l'Indonésie."
	indonesia.23.a: "La deuxième promesse qu'ils ont tenue."
	indonesia.24.t: "Conférence inter-indonésienne"
	indonesia.24.d: "La Conférence inter-indonésienne a officiellement débuté aujourd'hui, marquant un rassemblement important de représentants de diverses régions d'Indonésie. Les délégations comprenaient non seulement des dirigeants locaux et des représentants de différentes provinces, mais également des participants du Bijeenkomst voor Federaal Overleg, soulignant le caractère global de ce dialogue national.\n\nLa conférence était présidée par M. Mohammad Hatta, l'actuel Premier ministre et vice-président de la République. Son leadership a donné le ton aux discussions, soulignant l'importance de l'unité et de la collaboration entre les divers États indonésiens.\n\nUn thème central de la conférence était la formation de la Republik Indonesia Serikat, ou la République des États-Unis d'Indonésie. Une partie importante des discussions a porté sur la composition du RIS, soulignant la nécessité d'une représentation équitable des différentes régions et groupes ethniques dans sa structure de gouvernance. Les délégués ont exprimé leurs préoccupations concernant les droits des États et des régions autonomes dans le nouveau cadre proposé, cherchant à garantir que les intérêts et les identités locales seraient préservés et respectés."
	indonesia.24.a: "Djalan Kemerdekaan"
	indonesia.25.t: "Conclusion de la Conférence inter-indonésienne"
	indonesia.25.d: "La Conférence inter-indonésienne s'est terminée aujourd'hui, établissant l'accord suivant comme fondement officiel de la République indonésienne libre :\n\n1. L'État des États-Unis d'Indonésie est approuvé sous le nom de République des États-Unis d'Indonésie, sur la base des principes de démocratie et de fédéralisme.\n2. La République des États-Unis d'Indonésie sera dirigée par un président constitutionnel, soutenu par des ministres responsables devant la Chambre des représentants.\n3. Deux organes représentatifs seront créés : la Chambre des représentants et le Sénat. Le premier organe à être créé sera la Chambre des représentants provisoire.\n4. Le gouvernement fédéral provisoire recevra la souveraineté non seulement des Néerlandais mais également de la République d'Indonésie.\n5. Il a été décidé que le drapeau du RIS serait rouge et blanc.\n6. L'hymne national sera « Indonesia Raya » de W.R. Soepratman.\n7. La langue officielle du RIS sera le bahasa indonésien."
	indonesia.25.a: "Eh bien, c'est fait."
	indonesia.26.t: "Le siège de Surakarta"
	indonesia.26.d: "Malgré les progrès significatifs que nous avons réalisés dans le cadre de l'accord Roem Van-Roijen, notre sentiment de satisfaction reste insaisissable. Nous ne pourrons jamais vraiment nous contenter tant que notre pays bien-aimé reste sous le contrôle oppressif des puissances coloniales néerlandaises. Même si nous participerons à la prochaine Conférence, nous devons reconnaître la dure réalité : notre position de négociation est loin d'être solide par rapport à celle du BFO et des négociateurs néerlandais.\n\nÀ la lumière de cela, nous pensons qu'il sera essentiel de lancer une opération militaire décisive à Surakarta. Une telle action enverrait un message clair et sans équivoque aux Néerlandais : notre détermination et notre engagement en faveur de la souveraineté sont à la fois inflexibles et irrévocables. Nous n'aurons de cesse que l'Indonésie ne soit considérée comme un égal sur la scène mondiale."
	indonesia.26.a: "Commencez l'attaque !"
	indonesia.27.t: "Conséquences"
	indonesia.27.d: "Dans les rues de Surakarta, beaucoup ont été victimes, beaucoup sont morts et nous avons encore perdu une bataille. Suharto était parti précipitamment, tout comme Rijadi. Ils retournèrent dans la forêt profonde ; leur mission, même si elle n'a pas été couronnée de succès, a donné au gouvernement l'avantage lors de la Conférence en cours à La Haye. Pakubuwono, qui est l'actuel sultan, les a appréciés ; ils les honorent alors qu'ils poursuivent leur combat pour l'indépendance."
	indonesia.27.a: "Cela devrait au moins leur donner une leçon !"
	indonesia.28.t: "La fin est proche"
	indonesia.28.d: "[INO.GetLeader] alors qu'il était assis dans son bureau du palais Merdeka, il reçut ce soir-là un rapport sur les discussions avec le gouvernement des Moluques au sujet de la trêve et de la reconnaissance réticente de l'Indonésie de sa souveraineté.\n\nSoudain, son assistant fit irruption dans la pièce. \"Monsieur, le colonel Nasution est ici pour vous voir en personne\", dit nerveusement l'assistant. \"Y a-t-il quelque chose qui se passe ?\" Répondit le Premier ministre, Nasution est arrivé de nulle part, visiblement énervé et en sueur, \"Bung, tout en considérant la situation de plus en plus critique qui menace notre identité nationale elle-même. Et aussi l'échec du gouvernement actuel à résoudre cette question, que d'autres régions se sont également rebellées, a conduit au point où un plus grand nombre de soldats ont péri pour rien, donc à ce moment et à cette heure précis, l'armée vous a relevé de vos fonctions, aux côtés du président Sukarno qui a accepté de dissoudre la RPD et de vous destituer. Du bureau.\"\n\n\"S'il vous plaît, signez ceci.\" Nasution a exigé : \"C'est le seul choix que nous avons\". [INO.GetLeader] a signé le papier et en dessous du papier se trouve la signature du nouveau Premier ministre."
	indonesia.28.a: "£Nasution_Signature"
	indonesia.31.t: "L'Indonésie a demandé la reconnaissance"
	indonesia.31.d: "Le gouvernement indonésien nous a officiellement contacté pour nous demander d'établir des relations diplomatiques. Cette proposition nous place devant une décision importante : nous pouvons soit choisir d'accepter leur invitation et aller de l'avant dans le renforcement de nos relations bilatérales, soit décider de ne pas le faire et de maintenir le niveau actuel de notre engagement diplomatique."
	indonesia.31.a: "Bien sûr"
	indonesia.31.b: "Ehh, pas maintenant"
	indonesia.32.t: "[FROM.GetAdjectiveCap] Le gouvernement nous a reconnus !"
	indonesia.32.d: "Le gouvernement [FROM.GetAdjectiveCap] a officiellement reconnu notre souveraineté. Cette reconnaissance ouvre de nouvelles opportunités pour établir une relation commerciale solide et une mission diplomatique avec [FROM.GetName]. Nous sommes désormais en mesure de faciliter des échanges réguliers et de renforcer nos liens, ouvrant ainsi la voie à une coopération accrue et à des avantages mutuels entre nos pays."
	indonesia.32.a: "Agréable"
	indonesia.33.t: "Début de la première session du Conseil représentatif du peuple"
	indonesia.33.d: "\"Chers membres de la Chambre des représentants,\n\nAu cours des quatre dernières années, nous avons travaillé ensemble pour préserver l'indépendance de notre nation, alimentés par notre courage et notre rêve de parvenir à une véritable indépendance. Je déclare par la présente ouverte la première session de la Chambre des représentants des États-Unis d'Indonésie.\n\nAvant tout, nous devons aborder la question du leadership. Par conséquent, la première chose à l'ordre du jour sera d'élire le nouveau président de la Chambre. »\n\nAu fur et à mesure que les votes seraient comptés et que les résultats seraient connus, le nouveau Président serait..."
	indonesia.33.a: "Sartono élu"
	indonesia.34.t: "Ali à Wilopo sorti"
    indonesia.34.d: "La mémoire de Tandjung Morawa est encore ressentie par la majorité de la population du nord de Sumatra, le cabinet Wilopo sortant a chargé l'ancien ambassadeur et ministre de l'Éducation, Ali Sostroamidjojo, de prendre la relève, le parti majoritaire au sein du DPRS et le président Soekarno a approuvé la nomination d'Ali Sostroamidjojo comme prochain Premier ministre de l'Indonésie."
    indonesia.34.a: "Répétition de Natsir et Soekiman."
	indonesia.35.t: "Formation du Cabinet"
	indonesia.35.d: "Suite au succès de la motion Natsir et au retour à un État unitaire, le président Soekarno a nommé Mohammad Natsir pour former le nouveau cabinet. Cependant, comme c'est souvent le cas dans notre pays, nous n'étions pas pleinement préparés. Dans le cadre de la politique Masyumi, un Premier ministre ne peut pas diriger son propre parti, c'est pourquoi Natsir a démissionné de son poste.\n\nActuellement, la principale question est de savoir si nous devons ou non faire des compromis avec le PNI. Ne pas faire de compromis pourrait renforcer notre parti mais affaiblir notre soutien au Parlement. D'un autre côté, faire des compromis reviendrait à exécuter les ordres du PNI malgré nos divergences, que nous soyons d'accord ou non."
	indonesia.35.a: "Si c'est ce qu'il faut."
	indonesia.35.b: "Nous ne les laisserons pas entrer dans notre gouvernement !"
	indonesia.36.t: "Gunting Sjafruddin"
	indonesia.36.d: "Une nouvelle question se pose et elle concerne notre économie. Notre monnaie, créée il y a moins de cinq ans, est en grande difficulté. Plusieurs devises étrangères circulent parmi le public, notamment l'Oeang Republik Indonesia, le florin émis par la NICA de la De Javanesche Bank et le yen japonais.\n\nCette situation nous pose un problème important car nous ne pouvons pas contrôler la circulation de ces monnaies. Notre impression excessive de l'Oeang Republik Indonesia a conduit à une inflation massive, qui n'est pas impactée par le florin ou le yen.\n\nPour résoudre ce problème, Sjafruddin Prawiranegara a proposé une solution drastique : réduire de moitié chaque billet dépassant la valeur nominale de 5. Cela s'appliquerait à toutes les monnaies en circulation. Nous nous attendons à une opposition du public à cette idée ; Cependant, sans de telles mesures, notre économie aura du mal à progresser et nous pourrions être confrontés à une inflation encore plus forte.\n\nQue devons-nous faire ?"
	indonesia.36.a: "Réduisons un peu d'argent !"
	indonesia.36.b: "Cela n'en vaut pas la peine..."
	indonesia.37.t: "Irian prêt à saisir"
	indonesia.37.d: "Alors que la situation politique aux Pays-Bas se détériore en Europe, les conséquences se font sentir loin de chez nous, notamment en Irian, le dernier territoire colonisé de notre pays. La région est actuellement en proie à des troubles, marqués par des troubles et des émeutes. En réponse à cette situation critique, le général Abdul Haris Nasution s'est réuni au palais Merdeka pour évaluer la situation en Irian occidental et présenter un rapport de situation complet.\n\nConscient de l'urgence du moment, le général Nasution a proposé une initiative stratégique connue sous le nom d'« Opération Trikora », destinée à libérer l'Irian occidental de la domination coloniale néerlandaise. Cette opération représente un pas décisif vers la fin de siècles d'oppression coloniale. Pour assurer son succès, chaque secteur de nos forces armées sera mobilisé et chargé de rôles et de responsabilités spécifiques dans cette importante campagne."
	indonesia.37.a: "Commencez l'opération Trikora !"
	indonesia.38.t: ""
	indonesia.38.d: ""
	indonesia.38.a: ""
	indonesia.39.t: "Fruit de la politique de Sjafruddin"
	indonesia.39.d: "Depuis la mise en oeuvre de la politique de Gunting Sjafruddin début mars, notre économie a montré des signes significatifs de reprise. Nous sommes heureux d'annoncer que nous avons accumulé plus de 1,5 milliard de roupies de réserves, ce qui témoigne de l'impact positif de cette initiative. Cette stabilité financière est de bon augure pour notre croissance et notre développement futurs.\n\nAvec ces fonds substantiels à notre disposition, nous avons maintenant la possibilité d'investir dans des projets majeurs qui peuvent améliorer davantage notre paysage économique. Ces initiatives créeront non seulement des emplois, mais amélioreront également les infrastructures et les services, bénéficiant en fin de compte à notre communauté et favorisant la prospérité à long terme."
	indonesia.39.a: "Merveilleux!"
	indonesia.40.t: "L'inquiétude séparatiste"
	indonesia.40.d: "Il existe actuellement deux mouvements séparatistes majeurs qui menacent l'unité de notre nation. Le premier est le mouvement Darul Islam, actif dans diverses régions et qui constitue une menace importante pour notre sécurité nationale. Le deuxième est le mouvement séparatiste des Moluques, qui a également gagné du terrain et provoque des troubles dans les îles Moluques.\n\nMême si ces deux mouvements sont préoccupants, il est crucial que nous accordions la priorité à notre réponse. Le mouvement Darul Islam a une portée plus large et est responsable de nombreuses attaques et perturbations à travers le pays. Par conséquent, cela exige notre attention et nos ressources immédiates pour assurer la sécurité et la stabilité de notre nation.\n\nD'un autre côté, même si le mouvement séparatiste des Moluques est également préoccupant, il est plus localisé et ne constitue pas actuellement une menace aussi importante que le Darul Islam. Nous continuerons de suivre de près la situation dans les îles Moluques, mais notre priorité doit être de répondre à la question la plus urgente du mouvement Darul Islam."
	indonesia.40.a: "Concentrons-nous sur les Moluques."
	indonesia.40.b: "Les Darul Islam représentent une plus grande menace."
	indonesia.41.t: "Lettre de Daud Bereueh"
	indonesia.41.d: "Pendant une longue période, Daud Bereuh a joué un rôle crucial en soutenant notre lutte contre les colonialistes néerlandais. La communauté d'Aceh a généreusement contribué par ses ressources pour permettre à l'Indonésie d'acquérir son premier avion. Cet esprit de coopération et de sacrifice a été inestimable dans notre lutte pour l'indépendance.\n\nToutefois, la volonté d'obtenir une plus grande autonomie à Aceh présente des défis importants. Même s'il existe une volonté d'accorder un certain niveau d'autonomie gouvernementale, la proposition de Bereuh d'appliquer la charia dans la région suscite de sérieuses inquiétudes. Une telle démarche serait fondamentalement contraire aux principes de Pancasila."
	indonesia.41.a: "Eh bien, n'est-ce pas simplement merveilleux..."
	indonesia.41.b: "Si seulement nous pouvions embarquer le DPRS..."
	indonesia.42.t: "Votes de la première assemblée du DPRS"
	indonesia.42.d: "Alors que nous nous établissons en tant que nation indépendante, de nombreuses préoccupations et questions croissantes doivent être apaisées. Les différences régionales liées aux coutumes, à la morale, aux traditions, à la religion, parmi bien d'autres, menacent de déchirer notre jeune nation aussi vite qu'elle s'est formée.\n\nBien que ce soit un processus long et probablement douloureux, avec l'ouverture de la Première Assemblée, nous pouvons aborder les divisions les plus immédiates alors que les représentants de toute l'Indonésie se réunissent. Cependant, le temps nous dira si cela produira des résultats tangibles et constituera le premier véritable test de notre démocratie parlementaire naissante..."
	indonesia.42.a: "On peut enfin se mettre au travail !"
	indonesia.43.t: "DPRS a refusé de nous faire confiance !"
	indonesia.43.d: "Malgré l'exploit monumental de devenir chef du premier cabinet du nouvel État unitaire, la confiance dans le leadership de Mohammad Natsir est clairement très minime au sein du Parlement et du PNI lui-même.\n\nToutes les tentatives de Natsir pour former des coalitions au sein du Parlement se sont heurtées à des échecs et à des rejets constants, rendant encore plus instable un statut déjà précaire. Au manque de confiance croissant dans son statut de Premier ministre s'ajoutent les échecs croissants de son leadership, allant d'une croissance apparemment sans fin des rébellions régionales, à la croissance des mouvements indépendantistes locaux et à une sécurité nationale catastrophique, parmi de nombreuses autres controverses. Il n'est peut-être pas surprenant que le Parlement ait complètement bloqué l'autorité politique de Natsir.\n\nMême s'il n'est pas clair s'il sera capable de retrouver son statut au Parlement et de rétablir son autorité sur le gouvernement, il est peu probable que Natsir reste les bras croisés à la prochaine Assemblée nationale..."
	indonesia.43.a: "Quoi ?!"
	indonesia.44.t: "Examiner nos possibilités"
	indonesia.44.d: "Une fois de plus, les Néerlandais ont refusé de s'engager dans des discussions sur l'avenir de la Papouasie, nous laissant ainsi des options limitées. Nous n'avons d'autre choix que d'envisager des approches alternatives pour affirmer nos revendications sur la région. Une solution potentielle consisterait à suspendre notre adhésion à l'Union Pays-Bas-Indonésie, ce qui pourrait servir de déclaration puissante de notre mécontentement et d'appel à l'attention internationale sur notre cause.\n\nNous pourrions également choisir de réévaluer nos options et d'explorer d'autres voies diplomatiques ou stratégiques pour résoudre le problème. Cela peut impliquer de rechercher le soutien d'autres pays, de s'engager dans des alliances régionales ou de recourir à des voies juridiques auprès des tribunaux internationaux. Chacune de ces options comporte son propre ensemble de défis et de conséquences potentielles, et nous devons les peser soigneusement par rapport à nos objectifs à long terme et aux meilleurs intérêts de l'Indonésie."
	indonesia.44.da: "Que ce soit par dépit ou avec sincérité, les Néerlandais ont accepté d'engager des discussions sur l'avenir de la Papouasie, ce qui constitue un pas en avant significatif. Cette volonté de dialogue nous ouvre de nouvelles possibilités pour affirmer nos revendications sur la région et oeuvrer à une résolution qui respecte notre souveraineté et nos intérêts. Nous pouvons désormais explorer diverses voies diplomatiques, telles que négocier les conditions du transfert de contrôle, rechercher un soutien international ou même proposer des accords d'administration conjointe qui pourraient bénéficier aux deux parties. Cette évolution est un signe positif selon lequel nous pourrions être en mesure d'atteindre nos objectifs grâce au dialogue et à la coopération plutôt qu'à la confrontation."
	indonesia.44.a: "Suspendons notre adhésion"
	indonesia.44.b: "Réévaluons notre option..."
	indonesia.45.t: "Recherche de formateurs"
	indonesia.45.d: "Alors que nous continuons à développer nos capacités militaires, il est crucial que nous recherchions des formateurs expérimentés pour nous aider à bâtir une force de défense solide et efficace. Nous avons identifié des formateurs potentiels issus de trois grandes puissances : les États-Unis, l'Union soviétique et la Chine. Chacune de ces nations possède une riche expérience en matière de formation militaire et pourrait fournir des informations et des techniques précieuses pour renforcer nos forces armées.\n\nNous devrons évaluer soigneusement les avantages et les inconvénients d'un partenariat avec chacun de ces pays, en tenant compte de facteurs tels que leurs intérêts géopolitiques, la qualité de leurs programmes de formation et la mesure dans laquelle leurs approches s'alignent sur nos propres objectifs stratégiques. En fin de compte, notre décision sera guidée par ce qui est le mieux pour la sécurité et la souveraineté de l'Indonésie."
    indonesia.45.a: "Entraîneur américain"
    indonesia.45.b: "Entraîneur soviétique"
    indonesia.45.c: "Entraîneur chinois"
    indonesia.45.da: "Nous devrions nous entraîner"
	indonesia.47.t: "La préparation des prochaines élections"
	indonesia.47.d: "La route de l'indépendance est terminée, et nous voici à la croisée des chemins vers la construction d'une Indonésie libre et démocratique, la plupart des pays nouvellement formés ne procèdent pas immédiatement à leurs élections, mais nous avions prévu des élections auparavant, dès 1946, lorsque la République a été divisée en deux par les Néerlandais.\n\nDe nombreuses factions au sein du DPRS qui estiment que le Parlement est inégalement divisé se sont pressées sur la question des élections, mais nous ne pouvons pas les avoir maintenant, mais pour apaiser tout le monde, nous allons simplement les préparer."
	indonesia.47.a: "Vers une Indonésie démocratique !"
	indonesia.48.t: "La tragédie de Kebumen"
	indonesia.48.d: "Au cours de l'année écoulée, le ReRa a connu pour l'essentiel du succès, sauf dans quelques cas où les autres milices se sont rebellées comme dans les Moluques du Sud et l'APRA, comme dans les cas également d'AOI, ou d'Angkatan Oemat Islam, un groupe d'islamistes dirigé par K.H. Mahfudh Abdurrahman qui se sentent négligés par le cabinet Hatta. Alors que de nombreux groupes armés ont finalement accepté l'intégration et la coopération dans le cadre du nouvel ordre, plusieurs factions sont restées insatisfaites et ont continué à résister à l'autorité gouvernementale, estimant que leurs intérêts et leurs sacrifices pendant la révolution avaient été ignorés. Parmi ces groupes, l'un des plus virulents était l'AOI, dont les dirigeants accusaient de plus en plus le gouvernement d'abandonner les combattants islamiques et de les exclure de l'influence politique et de la représentation militaire.\n\nÀ Kebumen, le premier coup de feu a été tiré à 4 km à Somalungu, un membre de l'AOI a été vu se promener et a attiré l'attention de la police militaire, sur la route, le membre de l'AOI est entré en colère et la police militaire a été obligée de lui tirer dessus. L'incident a rapidement semé la panique dans les environs et a marqué le début d'une confrontation plus large qui allait bientôt dégénérer en violence ouverte. Les rumeurs de tirs ont rapidement circulé parmi les sympathisants de l'AOI, attisant encore davantage les tensions et approfondissant l'hostilité envers les forces gouvernementales stationnées autour de Kebumen. Ce qui semblait initialement être une rencontre isolée s'est rapidement transformé en une crise sécuritaire plus large, alors que les partisans armés de l'AOI ont commencé à se rassembler et que la résistance contre les autorités s'est intensifiée au lendemain de la confrontation."
	indonesia.48.a: "Envoyez l'APRIS!"
	indonesia.48.b: "Négocions avec eux..."
	indonesia.49.t: "Rupture des négociations"
	indonesia.49.d: "Les négociations ayant échoué, nous n'avons d'autre choix que d'envoyer les forces armées. L'AOI s'est emparée de la station Kebumen, prenant des otages et tentant de semer la désunion au sein de la population tout en semant la peur dans les environs. Malgré les efforts répétés pour régler la question de manière pacifique et éviter une nouvelle escalade, toutes les tentatives de communication ont échoué, laissant les autorités avec des options de plus en plus limitées à mesure que la crise s'aggrave d'heure en heure.\n\nNous sommes désespérés et la situation a désormais atteint un point critique où une action immédiate ne peut plus être retardée. Les rapports provenant de la région indiquent une instabilité croissante autour de la station, avec des civils pris au piège de l'incertitude et des tensions continuant de monter. L'occupation de la gare de Kebumen a perturbé l'ordre public et menace de provoquer des troubles encore plus graves si elle reste sans réponse. À la lumière de ces développements, le déploiement des forces armées est désormais considéré comme nécessaire pour rétablir le contrôle, garantir la libération des otages et empêcher l'AOI de tenter davantage de semer la désunion dans la région."
	indonesia.49.a: "Envoyez l'APRIS!"
	indonesia.50.t: "Le Garuda et l'Aigle"
    indonesia.50.d: "Les États-Unis d'Amérique sont peut-être notre plus grand allié pendant la Révolution nationale, c'est grâce à leur intervention que l'Accord de Renville a eu lieu, et c'est grâce à leur intervention que les Néerlandais ont finalement mis fin à leur tentative de reprendre l'Indonésie.\n\nMais cela ne veut pas dire que nous sommes des alliés des États-Unis, non, en fait, nous sommes indépendants dans notre politique, ni des Soviétiques ni des États-Unis, mais comme le cours du monde semble suspendu entre les deux, et avec les communistes récemment rajeunis, nous nous trouvons face à un dilemme.\n\nNous pourrions prendre l'argent américain, ce qui nous rapprocherait d'eux et nous éloigner de notre allié du DPRS, ou nous pourrions poursuivre notre politique étrangère en tant qu'indépendant et actif."
    indonesia.50.a: "Qu'est-ce qui pourrait mal se passer avec un peu d'argent ?"
    indonesia.50.b: "Le principe avant les matériaux !"
	indonesia.51.t: "Élection vice-présidentielle"
    indonesia.51.d: "L'article 45 de la Constitution provisoire stipulait que le président et le vice-président étaient élus selon des règles fixées par la loi. Néanmoins, le président a nommé le vice-président sur recommandation de la Chambre des représentants. Sur cette base, le DPRS a procédé à l'élection du poste de vice-présidence.\n\nIl y a plusieurs candidats pour ce poste, voici les plus importants qui pourraient théoriquement devenir vice-président si le président le recommande :\n\n1. Vice-président actuel - Drs. Mohamed Hatta\n2. Ancien ministre de l'Éducation - Ki Hadjar Dewantara\n3. Président du Parti socialiste d'Indonésie - Sutan Sjahrir\n4. Président du parti Masyumi - Soekiman Wirjosandjojo"
    indonesia.51.d.a: "L'article 45 de la Constitution provisoire stipulait que le président et le vice-président étaient élus selon des règles fixées par la loi. Néanmoins, le président a nommé le vice-président sur recommandation de la Chambre des représentants. Sur cette base, le DPRS a procédé à l'élection du poste de vice-présidence. \n\nAvec l'insistance de Mohammad Hatta sur le fait qu'il voulait se concentrer sur son poste de Premier ministre, l'élection du vice-président sera très contestée.\n\nIl y a plusieurs candidats pour ce poste, voici les plus importants qui pourraient théoriquement devenir vice-président si le président le recommande :\n\n1. Ancien ministre de l'Éducation - Ki Hadjar Dewantara\n2. Président du Parti socialiste d'Indonésie - Sutan Sjahrir\n3. Président du parti Masyumi - Soekiman Wirjosandjojo"
	indonesia.51.a: "Restons fidèles à Hatta !"
    indonesia.51.b: "Ki Hadjar semble prometteur..."
    indonesia.51.c: "Les circonstances actuelles appellent Sjahrir !"
    indonesia.51.e: "Soekiman est le choix de l'Indonésie islamique !"
	indonesia.52.t: "Plantation de Tandjung Morawa"
    indonesia.52.d: "Sous le Premier ministre Soekiman, Iskaq Tjokrohadisurjo a réussi à trouver un compromis avec la Deli Planters Association, un grand syndicat de planteurs de tabac. Le gouvernement nationaliserait 130 000 des 255 000 hectares de terres appartenant à la DPV. En échange, la DPV recevrait un nouveau bail de 30 ans sur les 125 000 hectares restants. Le gouvernement réinstallerait alors les paysans qui squattaient ailleurs les terres louées.\n\nAvec la formation du Cabinet Wilopo, le Parti national indonésien a voulu faire avancer l'accord et ainsi achever ce que l'Iskaq avait réussi à faire il y a un an. Mais ce n'est pas une affaire ordinaire, puisque ces plantations étaient et sont toujours la propriété des Néerlandais, le gouverneur Abdul Hakim a pour l'instant apaisé les paysans, mais si l'on tarde trop, l'affaire deviendra plus compliquée."
    indonesia.52.a: "Mettez ceci de côté pour plus tard."
	indonesia.53.t: "La tragédie de Tandjung Morawa"
    indonesia.53.d: "Fatigués des promesses qui n'ont pas été tenues, aujourd'hui, le [GetDate], plusieurs manifestants, majoritairement issus de la classe paysanne, se sont affrontés avec les forces de police locales à Tandjung Morawa. Les négociations qui n'ont pas abouti à un résultat auprès de la population locale ont brisé la volonté de la population d'attendre plus longtemps.\n\nAvec plus de 20 blessés et 5 morts, le DPRS, plusieurs partis politiques, dont le propre PNI de Wilopo, et le PKI ont formé une commission d'enquête sur la tragédie, les jours de Wilopo sont désormais comptés."
    indonesia.53.a: "C'est fini..."
	indonesia.54.t: "Problèmes budgétaires de l'armée"
    indonesia.54.d: "Pendant une brève période au cours de la guerre de Corée, la République a connu une période de boom économique, ce qui s'est produit sous les cabinets de Natsir et de Soekiman. Cependant, cette époque est désormais révolue depuis longtemps, la République étant confrontée à un énorme déficit, de nombreux membres du DPRS se tournent désormais vers l'armée.\n\nLes forces de guerre indonésiennes comptent 200 000 membres, ce qui est assez important étant donné que l'armée est désormais concentrée sur l'éradication des petits groupes d'insurrection, et pour des conditions de temps de paix, cela est considéré par le DPRS comme excessif, les trois quarts du budget de l'armée ont été dépensés en salaires, limitant la quantité d'équipement achetable pour le renouvellement, et même ainsi, les allocations salariales étaient minimes. Les réorganisateurs de l'armée ont décidé d'entamer cette année un processus de démobilisation, qui démobiliserait 80 000 soldats sur 200 000. Même si des pensions seraient versées, le plan est impopulaire parmi de nombreux soldats de base à licencier et parmi les officiers traditionnels."
    indonesia.54.a: "Argent!"
    indonesia.55.t: "Mouvement Burhanuddin"
    indonesia.55.d: "Le parlementaire Zainul Baharuddin et d'autres délégués du parti Murba et du parti travailliste ont cosigné une motion qui réduirait la structure des forces armées, et aujourd'hui cette motion a été révisée pour recueillir le soutien du PNI, cela nous a mis à la croisée des chemins, même si la motion révisée semble prometteuse, nous ne pouvons pas approuver quelque chose qui affaiblirait les forces de guerre.\n\nÉgalement à la même époque, les plus hauts commandants de l'armée régionale s'étaient réunis à Djakarta pour une réunion, à savoir Maludin Simbolon, A. E. Kawilarang et Gatot Subroto. Le temps presse..."
    indonesia.55.a: "Nous attendrons simplement une motion plus prometteuse."
	indonesia.56.t: "Manai Sophiaan Mouvement"
    indonesia.56.d: "La motion de Burhanuddin ayant été rejetée, une motion plus modérée proposée deux jours plus tôt par I. J. Kasimo, du Parti catholique, a été approuvée par le gouvernement. La situation semble s'être apaisée.\n\nPuis est venu Manai Sophiaan, celui qui a personnalisé le taureau du logo du PNI, a présenté une autre motion puissante, que le DPRS, sans doute approuvée, cette motion qui a permis aux politiciens civils de modifier la direction des forces armées, a pour mieux dire plonger l'armée dans une profonde colère..."
    indonesia.56.a: "Ah non..."
	indonesia.57.t: "La mort d'Ernest Douwes Dekker"
    indonesia.57.d: "Danudirja Setiabudi ou Ernest Douwes Dekker, l'un de nos notables politiciens pro-républicains néerlandais et fondateur d'Indo Europeesch Verbond, est décédé.\n\nL'impact de Setiabudi sur la politique indonésienne n'est pas minime, le président Soekarno le considère comme son professeur, pendant la période coloniale, il a plaidé pour l'indépendance de l'Indonésie. Les autorités néerlandaises l'ont exilé à plusieurs reprises, mais son moral n'a pas été brisé.\n\nPendant la Seconde Guerre mondiale, les autorités néerlandaises, qui le considéraient comme un activiste dangereux, l'exilèrent, ainsi que de nombreux Indo-européens d'origine allemande, au Suriname. Le Dr Setiabudi est retourné en Indonésie en 1947.\n\nAprès son retour, il fut élu au KNIP, en 1948 les Néerlandais le soulevèrent de son lit de malade pour l'arrêter, mais en raison de son état de santé, il fut libéré. Il fut ravi lorsque les Néerlandais reconnurent formellement la souveraineté de l'Indonésie en 1949."
    indonesia.57.a: "Repose en paix."
	papua.2.t: "L'Indonésie nous a invités à une conférence sur la Papouasie"
	papua.2.d: "Aujourd'hui, nous avons reçu une initiative intéressante de la part du ministre indonésien des Affaires étrangères. C'est un fait bien connu que nos relations avec l'Indonésie sont non seulement tendues mais, pour beaucoup de membres de notre gouvernement, ouvertement hostiles. Mis à part l'histoire coloniale et les ambitions personnelles, les jours de domination coloniale incontestée ont pris fin dans la violence et nous devons faire face à la réalité. L'idée de reconquérir notre colonie perdue depuis longtemps est une chimère, d'autant plus que les appels mondiaux et locaux à la décolonisation ne font que croître. Mais les tensions ne s'apaisent pas du jour au lendemain.\n\nL'ouest de l'Irain est l'une de nos dernières possessions coloniales dans le Pacifique, et c'est loin d'être une simple bande de terre inutile ; et peut encore être très rentable, peut-être même crucial maintenant que notre emprise sur l'Indonésie a été brisée. C'est aussi une ponction financière non négligeable et qui continuera d'être un point sensible indéniable dans nos relations avec notre ancienne colonie. Cependant, Mohammad Roem, le ministre indonésien des Affaires étrangères, a fait une offre raisonnable. Bien que cet accord prévoit le transfert du nord de l'Irain à la nouvelle nation indonésienne, ils ont également déclaré leur intention de préserver nos intérêts nationaux sur l'île, ce qui nous permettrait de récolter de nombreux avantages économiques et d'éviter une grande partie des coûts associés. En outre, il est clair que le vieil ordre européen se dirige droit vers la tombe, et plus nous résistons à l'inévitable, plus il nous frappera durement. Sans oublier que nous gagnerons plus d'une Indonésie amie que d'un Iran occidental. Dans le même temps, une perte de territoire aussi importante éliminerait complètement les derniers vestiges d'une présence hollandaise significative dans le Pacifique et serait très certainement perçue comme une perte humiliante. C'est une décision difficile, mais finalement il a été décidé que..."
	papua.2.a: "Dieu nous pardonne..."
	papua.2.b: "Comme nous le ferions !"
	papua.4.t: "Les Pays-Bas refusent encore une fois..."
	papua.4.d: "Nos ouvertures aux Néerlandais ont une fois de plus été rejetées. Il semble que, à notre connaissance, ils n'aient jamais vraiment voulu abandonner Irian. Cette impasse continue a clairement montré que les négociations n'ont pas produit les résultats escomptés.\n\nCependant, si nous parvenons à gérer cette situation avec prudence, il pourrait encore y avoir une opportunité pour nous. En jouant bien nos cartes, nous pourrions potentiellement porter les questions entourant l'Irian à l'attention des Nations Unies à l'avenir. "
	papua.4.a: "Eh bien..."
	smk.1.t: "Les Moluques font sécession !"
	smk.2.t: "La prise d'Ambon"
	smk.2.d: "A Ambon, le bruit des coups de feu a finalement cessé. Nos troupes courageuses ont réussi à vaincre les forces séparatistes, ce qui constitue une réussite importante dans nos efforts visant à maintenir l'unité nationale. Cependant, la situation n'est toujours pas résolue puisque leur chef, Chris Soumokil, a réussi à échapper à la capture. Nous intensifions désormais nos efforts pour le traduire en justice et restaurer la stabilité dans la région."
	smk.2.a: "NKRI Harga Mati !"
	smk.6.t: "Trahison néerlandaise"
	smk.6.d: "Les Néerlandais, dans leur arrogance et leur égoïsme, ont soutenu la nation rebelle proclamée aux Moluques, trahissant leur promesse lors de la table ronde de ne pas interférer avec l'Indonésie.\n\n\"Trahison, trahison, trahison !\" A déclaré Sukarno à son assistant, Sukarno, visiblement furieux de la décision néerlandaise, venant d'être informé par Hamengkubuwono, \"Nous devons faire quelque chose contre eux !\" » a déclaré Sukarno, alors qu'il tourne en rond autour du bureau présidentiel. \"Appelle [INO.GetLeader] et dis-lui de venir ici immédiatement !\" Alors que l'assistant partait, il entendit Sukarno crier."
	smk.6.a: "\"Maudis-les !!!\""
	smk.10.t: "Reprendre les Moluques"
	smk.10.d: "La situation aux Moluques a atteint un point critique. Les forces séparatistes, dirigées par Chris Soumokil, se sont retranchées dans la région, représentant une menace importante pour notre unité nationale. En réponse, nous avons lancé une opération militaire décisive pour reprendre le contrôle des Moluques et rétablir l'ordre.\n\nNos forces armées sont pleinement engagées dans cette mission et nous sommes déterminés à mettre fin au mouvement séparatiste. Nous n'aurons de cesse que les Moluques ne soient à nouveau fermement sous notre souveraineté, et nous ferons tout ce qui est en notre pouvoir pour atteindre cet objectif. La poursuite de Chris Soumokil se poursuit et nous sommes déterminés à le traduire en justice pour ses actes contre notre nation."
	smk.10.a: "A bas les séparatistes !"
	hatta.2.t: "Félicitations."
    hatta.2.d: "À : Premier ministre indonésien, M. Mohammad Hatta\nDE : Bureau du Premier ministre de l'État d'Israël\n\nCher Monsieur le Premier Ministre, permettez-moi de vous féliciter pour cette merveilleuse occasion, je, [ISR.GetLeader], suis très reconnaissant de vous écrire cette lettre. L'État d'Israël et la République d'Indonésie souffrent tous deux de l'emprise de l'impérialisme colonial, c'est pourquoi nous, le peuple d'Israël, souhaitons sincèrement la compréhension mutuelle et l'établissement de relations diplomatiques entre nos deux pays. Dans cet esprit de lutte partagée et d'expérience historique, nous tendons la main avec bonne volonté, convaincus que les liens forgés à travers les épreuves peuvent servir de fondement à un partenariat respectueux et constructif entre nos nations.\n\nNous espérons sincèrement que grâce au dialogue, à la coopération et à la reconnaissance de notre passé commun, nos deux pays pourront avancer vers un avenir défini non pas par la division, mais par le respect mutuel et la coexistence pacifique. Nous sommes fermement convaincus que l'établissement de relations diplomatiques bénéficiera non seulement à nos gouvernements, mais apportera également prospérité et compréhension à nos peuples, renforçant ainsi les idéaux de souveraineté, d'indépendance et d'unité qui sont chers à Israël et à l'Indonésie.\n\n"
    hatta.2.a: "Merci"
	soekiman.1.t: "Réintégrer les anciens combattants dans des emplois productifs"
	soekiman.1.d: "Les vétérans de notre lutte pour l'indépendance ont tant sacrifié pour notre nation, et il est de notre devoir de veiller à ce qu'ils soient réintégrés dans la société d'une manière qui leur permette de mener une vie épanouissante et productive. Nous mettrons en oeuvre des programmes complets pour leur fournir le soutien nécessaire, notamment une formation professionnelle, des services de placement et des ressources en santé mentale. Ce faisant, nous pouvons honorer leurs contributions et les aider à faire une transition en douceur vers la vie civile, en veillant à ce que leurs sacrifices continuent de profiter de manière significative à notre nation."
	soekiman.1.a: "Békerdja!"
	soekiman.2.t: "Matin au Palais Pancasila"
	soekiman.2.d: "Soekiman vient de commencer sa première journée en tant que nouveau Premier ministre indonésien et il est déjà confronté à un défi de taille. La récente réforme salariale a suscité un mécontentement généralisé dans l'opinion publique, en particulier parmi les travailleurs extérieurs au système de fonction publique. Nombreux sont ceux qui estiment que la réforme profite principalement aux fonctionnaires et autres employés de l'État, laissant les travailleurs du secteur privé et les travailleurs informels sans soutien comparable. Ce sentiment d'exclusion a donné lieu à des protestations et à un sentiment croissant de frustration parmi les groupes concernés, qui soutiennent que les réformes devraient être plus inclusives et plus équitables. Alors que Soekiman aborde cette question, il devra répondre aux préoccupations de ces travailleurs tout en gérant les implications politiques de la réforme."
	soekiman.2.a: "Eh bien, ça va être amusant..."
	soekiman.3.t: "Manifestation contre la réforme des salaires"
	soekiman.3.d: "La récente réforme salariale a considérablement nui à l'opinion publique, en particulier parmi les travailleurs extérieurs au système de fonction publique. Beaucoup se sentent exclus des bénéfices de la réforme, qui favorise principalement les fonctionnaires et autres employés de l'État, laissant les travailleurs du secteur privé et les travailleurs informels sans soutien comparable. Ce sentiment d'exclusion a suscité un mécontentement et des protestations généralisés dans l'opinion publique, alors que les groupes concernés expriment leurs frustrations face aux inégalités perçues et à une protection économique inadéquate.\n\nLes manifestants soutiennent que les réformes devraient être plus inclusives et équitables, abordant des problèmes tels que la stagnation des salaires, la taxation des indemnités de congés et le manque de soutien aux travailleurs non fonctionnaires. Ces manifestations mettent en évidence la profonde frustration face à un système qui, selon beaucoup, donne la priorité à un groupe limité tout en laissant la majorité de la population active supporter le fardeau économique."
	soekiman.3.a: "Merde !"
	soekiman.4.t: "Soekiman rend son mandat au président Sukarno"
	soekiman.4.d: "Les retombées du plan d'Ahmad Soebardjo visant à obtenir une aide Marshall des États-Unis ont conduit à un nouveau remaniement, le président Soekarno ayant rapidement accepté le retour de Soekiman au mandat. Avec le ministre des Affaires économiques, M. Wilopo étant le précurseur du prochain Premier ministre."
	soekiman.4.a: "Eh bien..."
	soekiman.5.t: "Nahdlatul Ulama rompt avec Masyumi"
	soekiman.5.d: "La divergence croissante entre la majorité dominée par Muhammadiyah au sein de Masyumi et la faction Nahdlatul Ulama a atteint un point critique, aboutissant à une rupture institutionnelle. La décision de Wahid Hasyim, agissant en tant que principal représentant des intérêts de Nahdlatul Ulama au sein de Masyumi, de retirer l'organisation du parti est considérée comme un développement politique important ayant des implications pour la stabilité parlementaire. Ce qui était autrefois le cadre d'une expression politique islamique unifiée se fragmente désormais selon des lignes idéologiques et organisationnelles, suscitant des inquiétudes au sein des cercles gouvernementaux quant à la cohérence de la représentation islamique au sein de la DPRS.\n\nEn réponse, les dirigeants de Masyumi ont formellement critiqué la décision de Wahid Hasyim, la présentant comme une mesure qui sape l'unité plus large des forces politiques islamiques à un moment où la consolidation est jugée essentielle pour la gouvernance nationale. Néanmoins, Nahdlatul Ulama a continué à s'imposer comme une entité politique indépendante, mobilisant rapidement des soutiens, en particulier dans l'est de Java, où sa base traditionnelle reste forte."
	soekiman.5.a: "Eh bien, c'est dommage..."
	soekiman.6.t: "Papouasie..."
    soekiman.6.d: "Hatta a échoué, Natsir a échoué, ils étaient trop confiants dans leur approche contre les Néerlandais, estimant que la diplomatie seule suffirait à régler l'affaire. Ils ont sous-estimé la situation, tandis que l'appel aux Nations Unies est arrivé trop tard, ne nous laissant d'autre choix que de régler le problème nous-mêmes d'abord.\n\nNous devons traiter les Pays-Bas à notre manière, sans compter immédiatement sur une intervention internationale. La priorité est de négocier et de marchander diplomatiquement, en utilisant comme base de discussion les termes convenus lors de la Table ronde de 1949.\n\nSi les Néerlandais refusent à nouveau et continuent d'ignorer les accords, nous porterons l'affaire devant les Nations Unies. Mais d'ici là, nous devons prouver que nous pouvons nous débrouiller seuls et lutter pour nos intérêts par nos propres méthodes."
    soekiman.6.a: "Tout pour la Papouasie !"

	wilopo.1.t: "Reconnaître les erreurs du passé"
	wilopo.1.d: "Deux gouvernements islamistes successifs ratés, deux dirigeants Masyumi ratés, n'en avons-nous pas assez ? Les gens voulaient un pays stable, une nation qui prend soin d'eux, pas ce que veulent les dirigeants.\n\nPuis il est arrivé, Wilopo ne s'était jamais attendu à ce qu'il soit le nouveau Premier ministre, l'échec de Soekiman à stabiliser son cabinet a conduit à la disparition définitive du gouvernement dirigé par Masyumi, Wilopo veillera à ce que quoi qu'il arrive, l'Indonésie se portera mieux, sous la bannière du PNI, et sous la direction populaire du président Soekarno, l'Indonésie sera totalement libre."
	wilopo.1.a: "Garuda éternel"
	wilopo.2.t: "Nahdlatul Ulama"
	wilopo.2.d: "\"Pour vous, votre religion ; pour moi, ma religion.\"\n\nCes mots décrivent Nahdlatul Ulama comme une entité, à la fois la plus grande organisation islamique d'Indonésie et aujourd'hui le plus grand parti islamique d'Indonésie, Nahdlatul Ulama a parcouru un long chemin pour en arriver là.\n\nLa rupture avec Masyumi n'a pas été agréable pour eux, Masyumi aurait écarté la faction Nahdlatul Ulama au profit de la faction plus libérale et moderniste. En gardant cela à l'esprit et en tentant de les contraindre, nous pouvons retenir K.H. Wahab Hasbullah et Wahid Hasyim de s'opposer à notre politique et à notre mandat jusqu'aux prochaines élections, avec le NU à bord, le gouvernement PNI stabilisera l'Indonésie."
	wilopo.2.a: "Ahlan Wa Sahlan!"
	wilopo.3.t: "Entre deux rochers"
    wilopo.3.d: "L'incident de Tandjung Morawa a été comme un clou dans le cercueil pour le gouvernement Wilopo, tandis que la tentative de coup d'État de l'armée a plutôt agi comme un précurseur d'une tragédie plus grave. Le Cabinet a donc décidé de démissionner avant que la Chambre des représentants ne publie une motion de censure.\n\nIl y a actuellement deux personnes qui ont la possibilité de devenir Premier ministre, il s'agit de Mohammad Hatta et Ali Sostroamidjojo.\n\nMohammad Hatta a été Premier ministre pendant la plus longue période, après le mandat d'Amir Sjariffudin jusqu'à la nomination de Mohammad Natsir le 6 septembre 1950. De nombreuses oppositions au sein du DPRS concluent que la reconduction de Mohammad Hatta est inconstitutionnelle, mais si c'est pour le meilleur de la République, Hatta est l'option la plus sûre.\n\nAli Sostroamidjojo est l'actuel ambassadeur aux États-Unis et ancien ministre de l'Éducation et de la Culture, il fait également partie du PNI, notre parti, tandis que Mohammad Hatta serait considéré comme un simple Premier ministre de transition, Ali Sostroamidjojo sera considéré comme la continuation du PNI au sein du DPRS, au moins jusqu'à ce que les élections aient lieu, ce qui est à la fois une option plus sûre et peut-être moins risquée de la part de Hatta."
    wilopo.3.a: "Mohammad Hatta devrait gouverner !"
    wilopo.3.b: "Ali Sostroamidjojo devrait continuer à diriger le PNI !"
	wilopo.4.t: "Le 4ème cabinet de Mohammad Hatta"
    wilopo.4.d: "Suite à un débat tendu au sein du DPRS et à un compromis au sein de Masyumi et du PNI, Mohammad Hatta a été recommandé au président Soekarno comme candidat de compromis jusqu'aux prochaines élections. Le président Soekarno a déjà convoqué Mohammad Hatta pour préparer le transfert du pouvoir du cabinet Wilopo sortant au palais de Pancasila."
    wilopo.4.a: "Enfin, il revint."
	wilopo.5.t: "Le président Soekarno a sauvé la mise"
    wilopo.5.d: "À Djakarta, la rue était remplie de camions remplis de manifestants, des centaines, voire des milliers, ont été amenés devant le DPRS pour protester et contrer la législation qui affaiblissait les forces armées.\n\nC'est alors que le président Soekarno est intervenu. Il a été initialement amené à dissoudre le DPRS, à suspendre la Constitution provisoire et à préserver l'intégrité des forces de guerre. Au lieu de cela, il a prononcé un discours enflammé, disant aux manifestants de rentrer chez eux, d'arrêter cet acte de rébellion et de dissuader le DPRS d'imposer des conditions sévères."
    wilopo.5.a: "Au moins, les gens lui font confiance."
    wilopo.6.t: "[GetNewspaperHeader] Les affaires [GetMonth]"
    wilopo.6.d: "Les rues de Jakarta étaient remplies de camions militaires aujourd'hui alors que l'armée protestait contre la motion du parlement indonésien visant à démobiliser et à restructurer les forces armées. L'armée a chargé ses manifestants dans les camions et a été vue manifestant devant le parlement.\n\nLe président Soekarno a été élevé et a supplié de dissoudre le parlement. Au lieu de cela, il a prononcé un discours enflammé qui a démoralisé tous ceux qui tentaient d'interférer avec le parlement. Bien qu'il soit du côté du DPRS, le président Soekarno a quand même insisté pour que la motion soit moins dure.\n\nManai Sophiaan, celui qui a présenté la motion, a vu sa motion suspendue pour une durée indéterminée."
    wilopo.6.a: "Coup d'Etat militaire ?"
