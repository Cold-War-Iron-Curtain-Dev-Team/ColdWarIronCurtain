	#focus desc
	INO_The_Provisional_Government_desc: "Dans le long crépuscule de la lutte coloniale, où les mots ont si souvent été utilisés pour retarder plutôt que pour apporter des résultats, l'Accord Roem Van Roijen marque un pas prudent loin de la confrontation et vers un règlement, aussi imparfait soit-il, aussi inachevé. Pour la partie indonésienne, cet accord avec les Néerlandais n'est pas une victoire en soi, mais une reconnaissance, même à contrecoeur, du fait que le monde change et que notre République ne peut être ignorée.\n\nDe Jakarta à Yogyakarta, dans les maisons de ceux qui ont enduré l'exil, la guerre et le silence, les conséquences des négociations de Roem Van Roijen n'apportent ni célébration ni confiance totale, mais un souffle de soulagement prudent. Les Néerlandais, sous la pression croissante des voix internationales et le changement d'humeur de l'après-guerre, ont accepté de relâcher leurs dirigeants et d'ouvrir la voie à de nouvelles négociations. Ce n'est pas l'accomplissement de l'indépendance, mais ce n'est plus sa négation."
	INO_Remember_the_Revolution_desc: "Chaque année, à l'approche du mois d'août, les souvenirs reviennent, non pas comme des échos lointains, mais comme une flamme vive dans l'âme de la République. La Révolution de 1945 n'était pas simplement une déclaration ; c'était un soulèvement de volonté, né dans le feu de l'occupation, de la souffrance et d'un espoir inébranlable. C'est le moment où l'Indonésie, longtemps silencieuse sous le poids de l'empire, retrouve sa voix et rugit.\n\nPour ceux qui l'ont vécue, la Proclamation n'était qu'un début. Ce qui suivit n'était pas la paix, mais le sacrifice. Les jeunes comme les aînés ont pris les armes non pas pour conquérir, mais pour conserver une liberté dont ils savaient qu'elle leur appartenait de droit et non de permission. Dans tout l'archipel, les kampungs et les villes sont devenus des champs de bataille non seulement de balles, mais aussi d'esprits, luttant non seulement contre le contrôle étranger, mais aussi pour le droit de façonner notre propre avenir."
	INO_Contact_the_Escapists_desc: "Dans le calme fragile qui a suivi les changements politiques et les accords prudents de la fin des années 1940, une tâche restait urgente pour la République : rétablir le contact avec les commandants en exil, au coeur de Java, ces chefs de guérilla qui avaient tenu la flamme de la résistance lorsque les villes de la République se sont tues et que ses dirigeants ont été emmenés.\n\nCoupés par les offensives hollandaises, dispersés par le terrain et le blocus, ces hommes et ces femmes n'avaient pas disparu. Depuis les jungles du centre de Java jusqu'aux pentes des montagnes du sud, ils avaient poursuivi le combat en silence, avec des fusils usés, des ordres chuchotés et la conviction éternelle que la République vivait toujours. Ils n'avaient pas besoin de rappels d'indépendance ; ils avaient saigné pour cela dans l'isolement, à travers la faim, la maladie et le feu."
	INO_Restoration_of_the_Government_desc: "Cela faisait des mois qu'ils avaient été emmenés, escortés par les forces néerlandaises lors de l'agression militaire visant à faire taire la République. En leur absence, la ville avait retenu son souffle. Les habitants de Yogyakarta, et d'ailleurs tous les Indonésiens, ont supporté le poids de l'incertitude, mais n'ont jamais perdu espoir. Les mouvements clandestins se poursuivent. Les guérilleros présents dans les collines ont continué la résistance. La République, battue et acculée, a refusé de mourir.\n\nAujourd'hui, après de longues négociations et la pression internationale, le moment était venu. Le président et le vice-président de la République devaient revenir. Pas enchaînés, pas sous surveillance, mais par la volonté du peuple et la force de ses convictions.\n\nIl n'était pas nécessaire d'annoncer ce que cela signifiait. Chaque villageois, chaque commerçant, chaque étudiant le savait : il ne s'agissait pas d'une simple visite. C'était le retour du coeur et de la voix de la République."
	INO_Prepare_for_Negotiation_desc: "Avec le gouvernement républicain désormais rétabli à Yogyakarta - notre capitale en lutte et coeur de la résistance - l'Indonésie reste ferme et unie. La longue nuit d'incertitude n'a pas affaibli notre détermination ; cela n'a fait qu'affiner notre clarté d'objectif. Le retour de nos dirigeants marque non seulement un moment symbolique, mais un tournant décisif dans notre parcours national.\n\nAujourd'hui, avec une légitimité renouvelée et tout le poids du peuple derrière nous, nous nous préparons à franchir la prochaine étape audacieuse : affronter les Néerlandais sur leur propre terrain. Le moment est venu de se rendre aux Pays-Bas, non pas en tant que sujets, non pas en tant que pétitionnaires, mais en tant que représentants légitimes d'un peuple souverain. Le monde a vu notre courage dans les armes et notre endurance dans la lutte ; elle doit maintenant témoigner de notre détermination en matière diplomatique.\n\nLa tâche qui nous attend est claire : formaliser ce pour quoi nous nous battons depuis longtemps : le transfert total et inconditionnel de souveraineté. L'Indonésie ne sera plus à mi-chemin entre dépendance et liberté."
	INO_Issue_of_Papua_desc: "Alors que la voie vers une souveraineté formelle s'ouvrait devant nous lors de la table ronde, une question restait en suspens - une blessure non cicatrisée : la Papouasie occidentale. Tandis que nous, la République d'Indonésie, étions assis face aux Néerlandais pour négocier la fin de la domination coloniale, ils s'accrochaient à un fragment de l'archipel comme si l'esprit d'empire ne s'était pas encore éteint.\n\nPour nous, la question n'a jamais été ambiguë. La Papouasie fait partie de la même terre, des mêmes eaux et de la même âme qui définissent l'Indonésie. Sa population peut être diversifiée en termes de culture et de langue, comme c'est le cas pour tous au sein de notre nation, mais le principe est indivisible : aucune partie de notre patrie ne doit rester sous contrôle étranger."
	INO_The_Union_Issue_desc: "Au milieu des négociations qui ont façonné le transfert de souveraineté lors de la table ronde, un concept a émergé avec insistance de la délégation néerlandaise : la création d'une union néerlando-indonésienne. Présenté comme un geste de coopération continue entre l'ancienne puissance coloniale et l'Indonésie, bientôt souveraine, il s'agissait en réalité d'une dernière tentative des Pays-Bas de conserver leur influence sur le destin de la République, quoique sous de nouvelles conditions.\n\nDu point de vue indonésien, cette union n'a pas été conclue avec enthousiasme, mais avec une nécessité calculée. Notre priorité était l'indépendance - reconnue, légale et irrévocable. Si l'Union était le dernier pont permettant d'atteindre ce résultat, alors nous le franchirions prudemment, les yeux grands ouverts. Mais nous avons été clairs : l'Indonésie se présenterait comme une nation libre et égale, et non comme un partenaire mineur lié par l'ancien ordre colonial."
	INO_Federalization_Issue_desc: "Dès le début, la République s'était déclarée une et indivisible. Notre lutte n'était pas pour une mosaïque d'États, mais pour une nation entière et souveraine - de Sabang à Merauke. Pourtant, au cours des dernières années du conflit, les Néerlandais ont cherché à créer des États fantoches et des régions fédérales, créant ainsi une fausse image d'un archipel divisé qui aspirait soi-disant à l'autonomie sous la direction néerlandaise.\n\nPourtant, dans la poursuite d'une indépendance totale - reconnue, légitime et définitive - nous avons été contraints de nous frayer un chemin dans ce cadre imposé."
	INO_Issue_of_Debts_desc: "Parmi les nombreux fardeaux imposés à l'Indonésie au cours de la table ronde, l'un d'entre eux s'est démarqué à la fois par son poids et par son symbolisme : la question du remboursement de la dette. Les Néerlandais, alors même qu'ils se préparaient à abandonner leur contrôle formel, exigeaient que le nouvel État indonésien assume la responsabilité des obligations financières contractées par l'administration coloniale des Indes néerlandaises - un régime qui extrayait depuis longtemps les richesses de l'archipel."
	INO_Proclaim_the_USI_desc: "De toutes les questions non résolues qui ont assombri la Table ronde, la création officielle des États-Unis d'Indonésie était la plus complexe. Il ne s'agissait pas simplement de la création d'une nouvelle forme de gouvernement : c'était la conséquence de la collision de la guerre, de la diplomatie et du compromis. Pour le monde, c'était la fin du régime colonial ; pour de nombreux Indonésiens, c'était une maison de transition vers une véritable indépendance.\n\nNéanmoins, dans un souci de souveraineté formelle et de reconnaissance internationale, nous avons accepté le cadre fédéral. Nous l'avons accepté non pas comme une fin, mais comme une réalité politique à remodeler de l'intérieur. La République est devenue l'une des nombreuses composantes, mais elle est restée le coeur battant de la nouvelle union."
	###NATSIR###
	INO_The_Natsir_Premiership_desc: "Le succès de Mohammad Natsir dans la réintégration de l'État du Pasundan a conduit le président Soekarno à le nommer Premier ministre du nouvel État unitaire.\n\nAvec de nombreuses rébellions et instabilités au sein de l'État, Mohammad Natsir Premiership est confronté à de nombreux défis, mais réussira-t-il ?"
	INO_Papua_Talk_desc: "Lors de la table ronde, nous avons posé des questions sur la Papouasie et les Néerlandais ont déclaré qu'une conférence de suivi aurait lieu concernant le statut de la Papouasie, qui n'a pas encore été restitué entre nos mains.\n\nPendant le mandat de Mohammad Hatta, nous leur avons demandé à nouveau ; « Quand pourrons-nous regagner la Papouasie ? Et ils ont dit que la discussion aurait lieu une fois que nous serons suffisamment stables. Aujourd'hui, avec la formation de l'État unitaire qui est pour l'essentiel stable, nous allons essayer de les poser à nouveau."
	INO_Strive_For_Consolidation_of_Power_desc: "Consolider notre emprise au pouvoir, ce dont Natsir a pensé à plusieurs reprises, nous donnerait un gouvernement majoritaire, tant au sein du DPRS qu'au Cabinet, et renforcerait ainsi la confiance que le président Soekarno nous a confiée de manière significative.\n\nMais nous ne pouvons pas le faire instantanément, notre popularité sera au plus bas dès que nous consoliderons notre gouvernement, ni le DPRS ni le président Soekarno n'approuveront donc non plus une telle chose. Néanmoins, un gouvernement Masjumi stable serait le plus bénéfique pour la population et pour l'Islam dans son ensemble."
	INO_Strive_For_National_Leadership_desc: "Même si cela ne nous mènera pas loin, la lutte pour un leadership plus stable sera plus valable dans notre situation actuelle, couplée au mépris croissant pour notre gouvernement, il est dans le meilleur intérêt de Masyumi et du cabinet Natsir, que la voie à suivre soit plurielle et stable."
	INO_Resolve_The_Separatist_Issue_desc: "Les conséquences de la lutte pour l'indépendance et de la formation des États-Unis d'Indonésie, aujourd'hui dissous, ont conduit à de nombreux mouvements sécessionnistes au sein de la République, des Moluques à Darul Islam, en passant par l'APRA et Angkatan Oemat Islam.\n\nCes forces qui ont résisté à la fois au programme ReRa et finalement aux forces armées elles-mêmes ont menacé le principe fondamental de Pancasila à l'extérieur et à l'intérieur, les traiter soit par la force, soit par la négociation est le seul moyen pour nous de maintenir la République intacte."
	INO_Intensify_Effort_To_Achieve_Peace_desc: "Le séparatisme ne peut pas être totalement réprimé par la force ; cela se fait parfois par la négociation. C'est l'une des politiques fondamentales de Natsir pour faire face à la menace de désunion, même si c'est plus difficile et politiquement susceptible de se retourner contre elle, la menace d'une telle désunion ne pourrait devenir apparente que si le gouvernement central est considéré comme brutal dans sa gestion.\n\nMohammad Natsir travaillera avec les membres du Cabinet pour résoudre le problème de manière pacifique, au cas où il y aurait une résistance active au sein des forces armées..."
	INO_Develop_National_Economy_desc: "Non seulement nous héritons de la dette néerlandaise, mais nous héritons également de leurs infrastructures, qui sont... inadéquates, surtout après la Révolution nationale qui a détruit, voire complètement démantelé, l'industrie dans certaines régions de la République.\n\nEn développant l'économie nationale à partir de zéro, nous pourrions restaurer notre économie naissante et la comparer à celle du reste du monde, et cette idée commence dès maintenant."
	INO_Pressure_The_Dutch_desc: "Nous avons dit des bêtises pendant une heure auparavant, nous l'avons fait poliment et avec un ton formel, mais ils refusent toujours, ils ont toujours dit un an de plus, mais nous savons qu'ils ne donneraient pas leur dernière grande colonie comme ça.\n\nFaire pression sur les Néerlandais pour qu'ils cèdent et acceptent notre mandat est une évidence, mais en étant plus ferme et décisif, notre cabinet apparaîtra également plus sérieux quant à la voie que nous prenons."
	INO_Abide_By_The_1949_Conference_desc: "Le faire de manière imprudente pourrait nuire à notre image auprès des Pays-Bas, c'est pourquoi nous devons respecter la Conférence de La Haye jusqu'au bout, en discuter calmement tout en faisant des concessions si cela est nécessaire.\n\nMais les factions au sein de notre Cabinet et du DPRS ont détesté l'idée, ils pensent que nous nous inclinons devant les Pays-Bas comme une forme de soumission, que cela leur plaise ou non, la Papouasie sera à nous de reconquérir. "
	INO_Prepare_Constituent_Assembly_Election_desc: "L'Assemblée constituante a été formée le 17 août 1950 suite à l'adoption de la Constitution provisoire de 1950. Ces constituants ont discuté de l'éventuel remplacement de la Constitution par une nouvelle Constitution plus permanente.\n\nMais cette Constituante était composée de la faction actuelle du DPRS, qui est divisée entre le PNI et Masjumi, avant que la discussion sur la nouvelle Constitution puisse avoir lieu, nous devons d'abord élire la nouvelle constituante pour apaiser davantage le peuple pour la nouvelle Constitution."
	INO_South_Maluku_Separatism_desc: "Le 25 avril 1950, à la suite du soulèvement de Makassar, d'anciens membres mécontents du KNIL de Maluku dirigés par Johannes Manuhutu ont déclaré la République des Moluques du Sud, un mouvement sécessionniste clair et une menace pour l'intégrité de la République.\n\nParce qu'il ne s'agit pas d'une rébellion conventionnelle comme Darul Islam ou Westerling APRA, et qu'elle est composée de vétérans du KNIL, s'occuper d'eux est la priorité de la République, pour enfin porter le coup final à d'autres groupes qui souhaitent se séparer de l'État unitaire de la République d'Indonésie."
	INO_The_Aceh_Predicament_desc: "Aceh, l'une des régions les plus profondément islamiques d'Indonésie, a également été la dernière région d'Indonésie à être colonisée par les Néerlandais, qu'ils ont entièrement annexée après la guerre d'Aceh il y a moins de 40 ans.\n\nDe Tjut Njak Dien à Teuku Umar, en passant par la Révolution nationale, à laquelle les Acehnais ont contribué en donnant de l'argent pour donner à la République son tout premier avion officiel, leur contribution à notre nation est décevante, mais le président Soekarno s'abstient de séparer Aceh de la province de Sumatra du Nord pour en faire sa propre province, ce qui a conduit à la déception, en particulier à Deud Bereuh."
	INO_Expand_Business_Venture_desc: "L'évolution finale de la République est terminée, il est maintenant temps de démarrer précisément notre économie, avec notre industrie naissante et peut-être une infrastructure inexistante, nous pouvons commencer à attirer des entreprises locales et extérieures pour aider à rajeunir l'économie vers une économie véritablement standardisée qui pourrait rivaliser avec le reste du monde."
	INO_Public_Housing_Program_desc: "Résultat de la Révolution nationale et de la destruction de la plupart des régions en raison de la guerre constante et dans certains cas des tactiques barbares et morales hollandaises, la plupart des Indonésiens n'ont pas de maison qui peut être qualifiée d'adéquate, certains vivent dans une maison faite d'arbres et un toit fait de feuilles ou de feuilles de bananier.\n\nAinsi, avec ce programme, nous contribuerons à élever le niveau de base du logement pour la population, à moderniser la République et à détruire la barbarie néerlandaise dans son ensemble."
	INO_Review_Dutch_Indonesian_Union_desc: "Au cours de la table ronde, nous avons convenu de former une union avec les Pays-Bas, en nous alignant étroitement sur Amsterdam de manière bénéfique, c'était du moins sur le papier. \n\nEn réalité, nos désirs et nos besoins ont été soit ignorés, soit rejetés, et la question sans fin de la Papouasie et des Pays-Bas, déterminante pour son maintien, a placé le statut de notre union dans une question controversée."
	INO_Government_Regulation_No_39_desc: "Alors que nous disposons déjà d'un Parlement, celui-ci est totalement compliqué à gérer, ce qui entrave l'activité et la politique du Président et du Premier Ministre au sein de la République. En tant que tel, en simplifiant le Dewan Perwakilan Rakjat Sementara et le Dewan Pemerintah dans l'ensemble du pays, nous pourrions éventuellement faciliter cette affaire compliquée et normaliser le système gouvernemental de la République."
	INO_The_Issue_of_Dual_Education_desc: "Tout comme au Moyen-Orient et en Iran, la République d'Indonésie compte deux grands établissements d'enseignement, à savoir un Pesantren, un internat islamique et l'école traditionnelle organisée par l'État lui-même.\n\nCe déséquilibre a créé une forme de choix très conflictuelle pour les parents : la plupart des musulmans choisissent Pesantren, ce qui en fait un établissement d'enseignement majoritaire, et le reste choisit l'école traditionnelle."
	INO_Merapi_Merbabu_Complex_desc: "À la suite des affaires Madiun de 1948, il existe une milice communiste dans la forêt de Gunung Merapi, dans le centre de Java, connue sous le nom de Complexe Merapi-Merbabu, un groupe très militant qui promet sa loyauté au Parti communiste indonésien.\n\nCes milices étaient exemptées du programme ReRa, dans lequel le général Nasution et Mohammad Hatta se méfiaient de l'influence communiste au sein de l'armée. Alors qu'Alimin a déclaré que le MMC fait partie intégrante de la structure du PKI, même le PKI lui-même a fermé les yeux sur lui en raison de son statut de parti politique légal."
	INO_Expand_Coop_desc: "L'économie indonésienne repose sur deux choses : L'UMKM et l'industrie productive réelle, les premières sont les micro, petites et moyennes entreprises, telles que les vendeurs ambulants, les magasins locaux et les petits restaurants, les secondes sont les industries qui contribuent davantage aux revenus de l'État, comme les usines, les usines et autres industries d'État.\n\nL'expansion de la coopérative signifie que nous reconnaissons officiellement l'UMKM comme une industrie de base pour la majorité de la population, même si elle est plus petite que l'industrie de base, en y investissant, nous pourrions peut-être augmenter les revenus qu'elle génère."
	INO_Sumitro_Plan_Natsir_desc: "Soemitro Djojohadikoesoemo, notre ministre du Commerce a proposé un plan économique qui serait totalement bénéfique et relancerait l'économie pour notre jeune nation.\n\nSumitro, l'un des rares Indonésiens à avoir une compréhension approfondie de la théorie économique moderne, prépare des efforts pour préparer l'orientation de la politique économique après l'indépendance.\n\n\"§YLe principal problème de l'économie indonésienne est de savoir comment construire une économie nationale forte, basée sur sa propre force, et promouvoir le bien-être du plus grand nombre.§!\"\n- Soemitro Djojohadikoesoemo"
	INO_Reintegrate_Ex_Guerilla_To_Civilian_Life_desc: "Le programme ReRa a considérablement réduit le nombre de nos militaires actifs, passant de 300 000 hommes pendant la révolution à 10 000 hommes. Même si beaucoup étaient considérés comme inaptes au service ou tout simplement trop radicaux, nous ne pouvons pas oublier ceux qui ont combattu au nom de la République d'Indonésie pendant la Révolution nationale.\n\nEn les réinsérant dans la vie civile, nous pourrions ainsi disposer de forces productives et de grandes opportunités pour eux, que ce soit dans l'industrie ou sur le terrain.\n\n§7La République n'oublie pas ses héros.§!"
	INO_Establish_Bapindo_desc: "Actuellement, au sein de la République, nous n'avons qu'une seule grande banque, la BRI, ou Bank Rakjat Indonesia, qui gère le flux de Rupiah, mais il n'existe aucune banque qui puisse être décrite comme bénéfique pour le secteur industriel.\n\nEn créant la Banque Pembangunan Indonesia, cette lacune sera comblée et ferait ainsi de notre industrie un tremplin vers l'avenir de l'industrialisation de la République."
	INO_Start_Medium_Industry_desc: "Le développement du secteur industriel moyen est une question qui se pose depuis que nous avons acquis notre souveraineté, mais nous ne pouvons pas le faire jusqu'à aujourd'hui.\n\nLa création d'une force industrielle nécessiterait de nombreux préparatifs, ce que nous ne pouvons actuellement faire que. Jusqu'à présent, notre industrie naissante est à peine capable de maintenir notre économie à flot. En investissant davantage dans ce secteur, l'Indonésie serait légèrement capable de maintenir son secteur industriel et également de fournir des emplois à la population."
	INO_BRI_Reorganization_desc: "La BRI a été la première banque à être créée après notre déclaration d'indépendance. Son rôle est de fournir des flux monétaires à la République et, pendant la révolution, elle a été la principale source de revenus de la République, que ce soit via le marché noir ou la fiscalité.\n\nMais l'époque de la révolution est désormais révolue, la République est pleinement en paix et indépendante, il est temps de transformer la BRI en une véritable banque d'État qui défend les intérêts de l'État."
	INO_Form_The_National_Design_Bureau_desc: "Au sein de la République, il existe de nombreuses industries nouvelles qui étaient prêtes à travailler avec le gouvernement, notamment l'usine Demakidjo, l'usine d'armes à feu et de poudre, etc. Qui ont fourni à la République sa propre arme nationale. Ces usines, pour la plupart, ont été héritées des Néerlandais. Leur capacité de production est donc très productive par rapport aux nouvelles startups.\n\nNon seulement ils nous ont fourni des armes, mais si nous allons plus loin, ils pourraient devenir le principal entrepreneur de défense du pays et la République pourrait peut-être fabriquer ses propres chars et avions."
	INO_Pass_The_Electoral_Bill_desc: "En 1945, un mois après la proclamation de l'Indépendance, nous avons convenu d'organiser des élections sur une base universelle dès 1946, mais les partis de retour d'Hubertus van Mook et du NICA ont empêché cela, donc il n'y a pas eu d'élections pour le Comité central national indonésien.\n\nDes années plus tard, nous avons obtenu notre souveraineté, alors que les élections étaient discutées sous le mandat de Mohammad Hatta, ce n'est qu'une formalité, maintenant nous nous préparons en fait à établir des élections par la loi, dès 1952."
	INO_DPR_Motion_desc: ""
	###SOEKIMAN###
	INO_Soekiman_Premiership_desc: "L'échec de Mohammad Natsir à faire un compromis a conduit à un autre remaniement ministériel, Soekiman Wirjosandjojo, le président du parti Masyumi, a été nommé par le président Soekarno pour diriger le poste de Premier ministre, cette fois Masyumi doit faire un compromis et former une coalition, avec nul autre que le PNI."
	INO_Rebuilding_Program_desc: ""
	INO_Foundation_of_Bebas_Active_desc: ""
	INO_Closer_to_America_desc: "Les États-Unis d'Amérique ont été notre plus grand soutien, que ce soit en faisant pression diplomatiquement sur les Néerlandais pendant la Révolution nationale ou en nous apportant bientôt des avantages économiques si nous jouons bien nos cartes.\n\nLe plan Marshall américain, mis en place après la Seconde Guerre mondiale, avait aidé les pays européens à relancer leur économie. En saluant leur geste, nous pourrions peut-être avoir une chance nous-mêmes."
	INO_Taking_Firm_Measure_On_Security_desc: ""
	INO_Reforming_State_Organization_desc: ""
	INO_Recognize_Labor_Union_desc: ""
	INO_Minimum_Wage_Reform_desc: ""
	INO_National_Prosperity_Program_desc: ""
	INO_Agrarian_Reform_desc: ""
	INO_Continuing_Natsir_Election_Bid_desc: "Mohammad Natsir était autrefois considéré comme le plus grand pionnier de l'Indonésie post-USI, mais ses problèmes avec le PNI l'ont amené à démissionner en raison de la pression des responsables du PNI en faveur d'un gouvernement de coalition, dans lequel il a refusé.\n\nAujourd'hui, le cabinet Soekiman a fait un compromis avec le PNI et ses alliés, mais nous ne pouvons pas oublier ce que Natsir a fait pour notre pays, pour la République."
	INO_Agrarian_Mechanization_desc: ""
	INO_Reaffirm_PNI_Support_desc: ""
	INO_Irian_Again_desc: "Nous leur avons demandé deux fois, et deux fois ils ont refusé, nous savons qu'ils ne donneraient pas la Papouasie aussi facilement, ni pacifiquement, mais nous savons que plus nous faisons pression sur eux, plus les Nations Unies le remarquent.\n\nLa troisième fois cette année, ils refuseront, ils diront une année de plus, mais nous savons que la troisième est décisive, juste un petit peu jusqu'à ce que nous plantions notre Merah Putih en terre papoue."
