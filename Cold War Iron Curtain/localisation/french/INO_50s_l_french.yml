	#events
	darul_islam.1.t: "Proclamation de l'État islamique d'Indonésie"
	darul_islam.1.d: "Au nom d'Allah, le Tout Miséricordieux, le Très Miséricordieux\n\nJ'atteste qu'il n'y a de divinité qu'Allah et j'atteste que Muhammad est le messager d'Allah\n\nNous, les musulmans d'Indonésie\n\nDÉCLARE PAR LA PRÉSENTE :\n\nLa création de « l'ÉTAT ISLAMIQUE D'INDONÉSIE »\n\nAinsi, la loi en vigueur en\n\nl'État islamique d'Indonésie est :\n\n§GLOI ISLAMIQUE§!\n\nAllahou Akbar ! Allahou Akbar ! Allahou Akbar !\n\nAu nom des musulmans d'Indonésie\n\nIMAM DE L'ÉTAT ISLAMIQUE D'INDONÉSIE\n\n£Kartosoewirjo_Signature\n\n\n(SM. KARTOSUWIRJO)\n\nMÉDINE-INDONÉSIE 12 SHAWWAL 1368|7 AOÛT 1949"
	darul_islam.1.a: "Machallah"
	darul_islam.2.t: "Kartosoewirjo se rend à la République !"
	darul_islam.2.d: "Suite à une rébellion massive dans le centre de Java, les forces de Darul Islam se sont rendues à l'armée après la chute de sa capitale temporaire à Bogor.\n\nLe président Soekarno a qualifié la crise du Darul Islam de finalement résolue, soulignant qu'il n'y a pas de place pour l'idéologie fondamentaliste extrémiste dans l'Indonésie laïque."
	darul_islam.2.a: "Aucune pitié pour le traître !"
	indonesia_apra.2.d: "Notre initiative stratégique visant à retarder les réunions prévues tout en alertant le responsable néerlandais a donné des résultats positifs. Malgré le succès initial des forces Westerling dans la capture de Bandung lors de leur premier assaut, nous avions anticipé cette possibilité. Grâce à nos préparatifs minutieux et à nos plans d'urgence, nous avons pu, par la grâce de Dieu, contrecarrer toute tentative des forces de Westerling visant à cibler des responsables gouvernementaux. Cette approche proactive a non seulement protégé des personnes clés, mais a également renforcé notre position dans la situation actuelle. Nos efforts soulignent l'importance de la vigilance et de la préparation face aux menaces potentielles."
	indonesia_lib.1.d: "Au coeur de la République, beaucoup percevaient la structure fédérale imposée par la Table ronde non pas comme une véritable expression de l'unité de l'Indonésie, mais comme une tactique néerlandaise persistante visant à fragmenter et affaiblir la nation naissante. Les États-Unis d'Indonésie, avec leur mélange d'États et de territoires, ont conduit à la désunion politique et ont donné aux dirigeants régionaux le pouvoir d'ignorer le gouvernement central de Yogyakarta.\n\nLes dirigeants républicains ont reconnu l'urgence de la situation et ont rapidement dénoncé le fédéralisme comme un vestige colonial incompatible avec l'esprit révolutionnaire. Grâce à un mélange de négociations politiques, de persuasion publique efficace et de pressions décisives, la république a entrepris d'unifier les États fédéraux sous une seule République d'Indonésie. Au milieu des années 1950, la majorité des États étaient convaincus de se dissoudre et de fusionner avec l'autorité centrale, motivés par des manifestations de masse, un sentiment nationaliste croissant et la promesse d'un avenir plus stable.\n\nL'intégration complète de l'État d'Indonésie orientale a marqué la fin du système fédéral. À Jakarta, aujourd'hui capitale d'une république unifiée, cette réalisation a été saluée comme un triomphe des idéaux révolutionnaires, affirmant que l'indépendance de l'Indonésie serait désormais gouvernée sous un seul drapeau et un seul gouvernement cohésif."
	indonesia_lib.2.d: "Aujourd'hui, le Premier ministre Mohammad Hatta se rendra à Pasundan pour engager des discussions concernant la réintégration de l'État de Pasundan dans la République d'Indonésie. Cette décision fait suite à la tentative de coup d'État manquée de l'Angkatan Perang Ratu Adil, qui visait à assassiner les dirigeants du RUSI et à former une Indonésie pro-néerlandaise.\n\nÀ la lumière des événements récents, un nombre important de citoyens sundanais ont manifesté un regain d'intérêt pour réintégrer la République en tant que province. Ce sentiment reflète un changement dans l'opinion publique, puisque beaucoup préfèrent désormais la stabilité et le soutien que procure l'appartenance à une nation plus grande, plutôt que de rechercher une structure étatique semi-indépendante.\n\nAu cours de sa visite, le Premier ministre Hatta devrait répondre aux préoccupations et aux aspirations du peuple sundanais, en le rassurant sur l'engagement du gouvernement central en faveur de son bien-être et de son intégration. Les discussions porteront probablement sur les avantages potentiels de la réintégration, notamment le développement économique, le soutien aux infrastructures et la reconnaissance culturelle dans le cadre de la République."
	indonesia_news.2.d: "Par une journée humide de décembre, alors que le poids de la révolution était encore frais et que les négociations étaient à peine terminées, les États-Unis d'Indonésie furent officiellement proclamés. C'était un moment tant attendu : la souveraineté néerlandaise avait pris fin et l'Indonésie était désormais, sur le papier, une nation libre et indépendante. Mais la forme qu'elle a prise n'était pas la République singulière envisagée en 1945 : il s'agissait d'un État fédéral, constitué de parties disparates, né davantage de la diplomatie que de l'unité.\n\nLa proclamation fait suite aux résultats de la table ronde de La Haye, où les Néerlandais ont accepté de transférer leur souveraineté, non pas directement à la République d'Indonésie basée à Yogyakarta, mais à une fédération plus large comprenant à la fois la République et plusieurs États fédéraux parrainés par les Pays-Bas. Cette structure, tout en reconnaissant formellement l'indépendance de l'Indonésie, reflétait les efforts des Pays-Bas pour conserver leur influence en divisant l'archipel en plusieurs entités sous un seul drapeau.\n\nAinsi, ce jour-là, Sukarno a été intronisé non pas en tant que président de la République de 1945, mais en tant que président des États-Unis d'Indonésie, un titre de compromis dans un État de compromis."
	indonesia_news.3.d: "Après la mort du président Soekarno, père fondateur de la République et symbole majeur de la lutte révolutionnaire indonésienne, la nation est entrée dans une période de transition profonde. Immédiatement après son décès, les rênes du pouvoir ont été confiées au maréchal de l'air Omar Dhani, commandant des forces aériennes indonésiennes, qui a désormais assumé la présidence.\n\nLes rapports suggèrent que l'accession de Dhani à la présidence n'était pas uniquement le produit d'un processus institutionnel, mais qu'elle a été façonnée par la volonté personnelle et l'appui politique de Soekarno lui-même, exprimés au cours de la dernière période de son mandat. En tant que proche confident et fidèle partisan de Soekarno, Omar Dhani représentait la continuité au sein du camp révolutionnaire - un individu qui avait été profondément impliqué dans l'élaboration de la posture de défense de l'Indonésie et s'était longtemps aligné sur la voie nationaliste et anti-impérialiste tracée par le défunt président.\n\nPour la première fois, la présidence est désormais assurée par un officier supérieur de l'armée, personnage dont la carrière n'a pas été définie dans la sphère civile, mais dans le cockpit de l'armée de l'air et dans les halls stratégiques de la défense nationale. Le leadership de Dhani devrait faire avancer bon nombre des idéaux de Soekarno."
	indonesia_news.4.d: "Pendant des décennies, beaucoup ont considéré l'Indonésie comme le principal État anti-impérialiste d'Asie du Sud-Est. Après des années de recherche et avec l'aide de la Chine, l'Indonésie a renforcé cette réputation avec la détonation du PBN-45, désormais connu sous le nom de Projet Gatot Kaca, sur l'île de Riau.\n\nGrâce à cette réussite, l'Indonésie est devenue le sixième pays au monde - après les États-Unis, l'Union soviétique, la France, le Royaume-Uni et la Chine - à posséder son propre arsenal nucléaire. Le président Soekarno a déclaré que les forces de l'impérialisme seraient vaincues et qu'un nouvel ordre de société libre, socialiste et révolutionnaire prendrait racine. La Chine a félicité l'Indonésie pour cette étape importante, tandis que l'Union soviétique et les États-Unis ont répondu par des réactions modérées."
	indonesia_news.8.t: "[GetNewspaperHeader] L'Indonésie a aboli le système fédéral"
	indonesia_news.8.d: "Après le transfert de souveraineté le 27 décembre 1949, l'Indonésie est revenue à un État unitaire après une brève période de huit mois en tant qu'État fédéral, un statut qui avait été imposé par l'administration coloniale néerlandaise. Ce changement a marqué un moment important dans l'histoire de la nation, soulignant l'engagement de l'Indonésie en faveur de son unité et de son indépendance.\n\nAu cours de cette période charnière, le Premier ministre Mohammad Hatta s'est rendu à Pasundan, une région qui avait résisté à l'intégration à la République d'Indonésie. Grâce à ses efforts diplomatiques et à son engagement auprès des dirigeants locaux, Hatta a réussi à obtenir un soutien en faveur de la réintégration de la région. Sa visite a été cruciale pour convaincre les législateurs du Parlement, qui ont reconnu l'importance de l'unité pour cette jeune nation. En conséquence, le Parlement a approuvé le maintien de Hatta au poste de Premier ministre, ce qui a également été approuvé par le président Sukarno, renforçant ainsi le leadership du gouvernement pendant cette période de transformation.\n\nLa déclaration officielle de cette réintégration a été faite lors du cinquième anniversaire de l'indépendance du pays, célébré le 17 août 1950."
	indonesia_news.8.a: "Libre du néerlandais pour poursuivre son rêve"
	indonesia_news.9.t: "[GetNewspaperHeader] L'Indonésie a aboli le système fédéral"
	indonesia_news.9.d: "Suite au transfert de souveraineté le 27 décembre 1949, l'Indonésie redevient un État unitaire après huit mois de statut d'État fédéral, un statut imposé par les Néerlandais.\n\nLa capacité de Mohammad Natsir à émettre une motion d'intégrité a fortement influencé la transformation de la nation en un État unitaire. Le président Sukarno a nommé Natsir à la tête du nouveau gouvernement, Mohammad Hatta étant le Premier ministre par intérim jusqu'à la formation d'un nouveau cabinet.\n\nLa Déclaration a été faite lors du cinquième anniversaire de l'indépendance du pays, le 17 août 1950."
	indonesia_news.9.a: "Une nation de rêveurs."
	indonesia_news.10.t: "[GetNewspaperHeader] Soulèvement des Moluques"
	indonesia_news.10.d: "À la suite de la motion officielle de l'État d'Indonésie orientale visant à rejoindre la République d'Indonésie, plusieurs groupes pro-fédéralistes des îles Moluques ont pris des mesures significatives en publiant un décret déclarant l'indépendance des Moluques du Sud, dirigé par Johanis Manuhutu. Cette déclaration intervient quelques semaines seulement après le soulèvement d'Ambon, un conflit violent qui a mis en évidence les tensions dans la région sur les questions de gouvernance et d'autonomie.\n\nEn réponse à l'escalade de la situation, le président de l'Indonésie orientale, Tjokorda Gde Raka Soekawati, a communiqué directement avec le gouvernement central de Djakarta, soulignant que l'Indonésie orientale ne soutient ni ne tolère la rébellion menée par ces groupes. Il a réaffirmé l'engagement de l'Indonésie orientale à s'intégrer pleinement à la République d'Indonésie, signalant son désir de stabilité et d'unité face aux sentiments séparatistes croissants dans la région."
	indonesia_news.10.a: "Je ne veux pas y aller."
	indonesia_news.11.t: "[GetNewspaperHeader] [INO.GetLeader] Signé Supersemfeb, l'Armée prend le contrôle !"
	indonesia_news.11.d: "Après l'échec des forces armées indonésiennes à reprendre le contrôle des Moluques du Sud, un tournant important s'est produit avec la facilitation de la Déclaration de Surabaya par les Nations Unies. Cette déclaration a marqué un effort diplomatique important pour faire face à l'escalade des tensions dans la région.\n\nDans une tournure dramatique des événements, l'armée, dirigée par Abdul Haris Nasution, a exercé une pression intense sur le gouvernement, conduisant à la démission de responsables clés. Le Premier ministre indonésien, le président Soekarno et le vice-président Mohammad Hatta ont démissionné en disgrâce, ce qui a mis un terme brutal à une période brève et tumultueuse de gouvernance démocratique en Indonésie.\n\nÀ la suite de ces développements, le Premier ministre Nasution a annoncé son engagement à organiser des élections anticipées et à mettre en oeuvre une restructuration globale du système gouvernemental. Cette promesse visait à restaurer la stabilité et la légitimité du processus politique. Cependant, cette annonce a suscité de vives réactions lorsque divers partis politiques, dont le PKI, Masyumi, le PNI et le PSI, sont descendus dans la rue pour protester contre les actions du gouvernement, exprimant leur désaccord et appelant à un cadre politique plus inclusif."
	indonesia_news.11.a: "Celui-ci réussi."
	indonesia_news.7.t: "[GetNewspaperHeader]Rébellion du Darul Islam"
	indonesia_news.7.d: "L'incapacité persistante du gouvernement de Djakarta à réprimer efficacement l'insurrection islamiste croissante dans l'ouest de Java a déclenché un soulèvement important dans toute la région. Face à la détérioration de la situation sécuritaire, le gouverneur de Java Ouest, M. Sewaka, a pris la décision décisive de déclarer la loi martiale dans le but de reprendre le contrôle et de stabiliser la région. Cependant, cette décision a rencontré des réactions négatives importantes, conduisant à la destitution de M. Sewaka peu de temps après. Sanusi Hardjadinata lui succèdera, qui devrait mettre en oeuvre des stratégies visant à rétablir l'ordre et à résoudre les problèmes sous-jacents qui ont alimenté les troubles.\n\nAfin de gérer la crise, le Président a rappelé l'armée, placée sous le commandement du général A.H. Nasution. Leur mission principale est de rétablir la paix et la sécurité dans l'ouest de Java au milieu des troubles actuels. Pour rassurer le public et favoriser un sentiment de calme, le Premier ministre [INO.GetLeader] s'est adressé à la nation à travers une émission matinale sur RRI Radio, appelant les citoyens à rester calmes et patients pendant que le gouvernement prend des mesures pour résoudre la crise."
	indonesia_news.7.a: "Jours sombres pour l'Indonésie."
	indonesia_news.13.t: "[GetNewspaperHeader]Prise de contrôle indonésienne de la Papouasie !"
	indonesia_news.13.d: "Alors que la guerre se poursuit en Europe, l'attention du monde reste concentrée là-bas. Au milieu de cette tourmente, le [INO.GetName] a pris des mesures significatives. Aujourd'hui, le général Nasution a annoncé la prise de contrôle de l'ancienne Nouvelle-Guinée néerlandaise. En réponse, le Premier ministre néerlandais en exil, M. [SUR.GetLeader], a condamné cette décision, affirmant qu'elle faisait partie d'un stratagème soviétique et d'une ingérence en Asie.\n\nLe président indonésien Soekarno a officiellement déclaré l'achèvement de l'opération Trikora. Dans un discours prononcé devant des milliers d'Indonésiens, il a proclamé :\n\n\"C'est fini ! Oui, c'est fini : 300 ans de colonialisme, de pillage et d'esclavage ont pris fin aujourd'hui ! Le peuple indonésien a pris les choses en main et, par la grâce de Dieu Tout-Puissant, l'Indonésie est désormais totalement libérée du colonialisme.\""
	indonesia_news.13.a: "Un empire s'effondre une fois de plus..."
	indonesia_news.14.t: "[GetNewspaperHeader]L'Indonésie a capturé Ambon, Soumokil s'est caché !"
	indonesia_news.14.d: "Après le débarquement des forces armées indonésiennes à Ambon, le gouvernement provisoire de la République autoproclamée des Moluques du Sud s'est rapidement retrouvé dans une situation difficile. Alors que l'armée indonésienne intensifiait sa campagne, les dirigeants et les membres des forces armées de la République furent contraints de se retirer dans les jungles denses des Moluques. Ce retrait stratégique ne signifiait cependant pas une capitulation ; cela a plutôt marqué le début d'une lutte prolongée. À l'avant-garde de cette résistance se trouvait leur chef, Chris Soumokil, qui s'est caché, ralliant ses fidèles partisans et s'engageant dans une guérilla contre l'armée indonésienne envahissante.\n\nMalgré les difficultés liées au fait d'opérer dans l'ombre, la détermination de Soumokil est restée inébranlable. Ses forces, composées d'un mélange de soldats dévoués et de milices locales, ont mis à profit leur connaissance du terrain pour lancer des attaques surprises et se lancer dans des sabotages contre les lignes d'approvisionnement de l'armée indonésienne.\n\nPendant ce temps, le Premier ministre [INO.GetLeader] s'est adressé à la nation lors d'une conférence de presse, affirmant l'engagement inébranlable de la République d'Indonésie à réprimer toute rébellion avec une force décisive."
	indonesia_news.14.a: "Un à un, les Domino tombent."
	indonesia_news.15.t: "[GetNewspaperHeader]Le président Suharto démissionne après des mois de protestation"
    indonesia_news.15.d: "Après des mois de protestations incessantes qui se sont étendues à toute l'Indonésie, la situation est devenue de plus en plus chaotique alors que les manifestations sont devenues violentes dans de nombreuses villes. Les rues autrefois remplies d'activités ordinaires sont devenues le théâtre de barricades en feu, d'affrontements avec les forces de sécurité et de vagues de troubles qui ne montrent aucun signe de ralentissement. La colère du peuple avait atteint un point de rupture et chaque jour qui passait apportait de nouveaux troubles, ébranlant les fondements de la nation.\n\nAu milieu de cette crise croissante, le président Suharto a finalement annoncé sa démission. Son départ a marqué la fin soudaine d'un régime de longue date qui définissait l'Indonésie depuis des décennies. À mesure que la nouvelle se répandait, elle signalait un changement radical dans l'histoire du pays, clôturant un chapitre et en ouvrant un autre au milieu de l'incertitude et du changement."
    indonesia_news.15.a: "Chute du Nouvel Ordre"
	indonesia_apri.3.t: "Reconstruction et rationalisation"
    indonesia_apri.3.d: "Le bref programme Re-Ra en 1948 a été interrompu par la deuxième agression militaire néerlandaise. En tant que tel, le programme a finalement été interrompu après le transfert de souveraineté le 27 décembre 1949. La République s'est retrouvée dans un environnement chaotique, de nombreuses anciennes milices supposées réintégrées se sont retrouvées dans un nouveau type d'administration différent de leur chaîne de commandement d'origine, le commandement suprême repose désormais entre les mains du président des États-Unis d'Indonésie et du Premier ministre indonésien.\n\nNous avons désormais la possibilité de poursuivre le programme Re-Ra, d'intégrer d'anciennes milices, comme l'Hisbullah, le Laskar Rakjat et l'ancien KNIL, plus hautement entraîné. Même s'il y aura des membres des milices mécontents qui n'auront pas pu entrer correctement dans APRIS, nous nous attendons à ce qu'il s'agisse d'un sujet mineur et franchement hors de propos à discuter."
    indonesia_apri.3.a: "Vers une Indonésie prospère !"
	indonesia.1.t: "La République indonésienne - renaît"
	indonesia.1.a: "Raja d'Indonésie, Merdeka ! Merdeka !"
	indonesia.4.t: "Dissolution du gouvernement d'urgence"
	indonesia.4.d: "Lorsque les Néerlandais lancèrent leur deuxième agression militaire et capturèrent le président Sukarno et le vice-président Mohammad Hatta, il apparut au monde extérieur que la République était tombée. Mais au plus profond des montagnes et des vallées de Sumatra, la flamme de la souveraineté est restée vivante. À Bukittinggi, loin de la capitale occupée de Yogyakarta, Sjafruddin Prawiranegara et une poignée de responsables républicains ont tranquillement assumé le rôle de leader, non par ambition, mais par nécessité - pour garantir que la République ne meure pas.\n\nLe PDRI n'était pas un gouvernement né du pouvoir, mais du devoir. Elle était mobile, insaisissable et s'adaptait constamment - se déplaçant de village en village, coordonnant la résistance, maintenant la communication avec les forces de guérilla et envoyant un signal clair : l'Indonésie vit et l'Indonésie résiste.\n\nAujourd'hui, avec le retour des dirigeants républicains légitimes à Yogyakarta suite aux pressions diplomatiques internationales et à l'accord Roem-Van Roijen, le PDRI a rempli sa tâche. Il ne s'est pas accroché au pouvoir. Il ne recherchait pas la gloire. Dans un acte de dignité discrète, il s'est retiré, après avoir fait ce qui devait être fait alors que la République n'avait pas de voix."
	indonesia.4.a: "Hiduplah Indonésie Raja !"
	indonesia.6.d: "Soedirman était plus qu'un chef militaire. Il était le coeur vivant de la révolution, un homme dont l'autorité ne venait pas de médailles ou de grades, mais de la force morale, d'une conviction inébranlable et de l'humilité tranquille avec laquelle il supportait des fardeaux impossibles. Encore jeune, gravement malade et souvent transporté sur une civière à travers les jungles et les champs de bataille, il refusa de déposer les armes alors que la République restait menacée. Son corps s'est affaibli, mais sa volonté ne s'est jamais affaiblie.\n\nAu cours des nuits les plus sombres de l'occupation et de la trahison, c'est Soedirman qui a rallié soldats et civils avec une détermination tranquille. Il s'est battu non seulement avec des tactiques, mais aussi avec conviction : la conviction que la liberté ne doit pas être gagnée uniquement par les armes, mais aussi par l'honneur, le sacrifice et la discipline. Il a mené des campagnes de guérilla non pas derrière ses bureaux, mais aux côtés de ces mêmes hommes qui marchaient pieds nus à travers les forêts et les rivières, qui lui étaient fidèles parce qu'il n'avait jamais exigé d'eux plus que ce qu'il était prêt à se donner.\n\nSa mort laisse un silence qui ne peut être comblé. Pourtant, dans ce silence, résonne le souvenir d'un homme qui n'a jamais crié, n'a jamais recherché la gloire et n'a jamais quitté le chemin en lequel il croyait. Soedirman ne laisse derrière lui aucun palais, aucune richesse, aucun monument de pouvoir - seulement un héritage écrit dans le coeur de ceux qui l'ont vu se battre, qui l'ont suivi dans les montagnes et qui doivent maintenant poursuivre ce qu'il a commencé.\n\nL'Indonésie a perdu un général. Mais il a acquis une légende."
	indonesia.9.t: "Le problème de la dette restante"
	indonesia.9.d: "Nous nous sommes assis en face d'eux, non pas en suppliants, mais en survivants. Après quatre années d'effusion de sang, d'occupation, d'exil et de défi, nous sommes venus à La Haye pour revendiquer ce qui nous appartenait déjà : notre indépendance. Et pourtant, alors même qu'ils reconnaissaient la République et se préparaient à céder formellement leur souveraineté, les Néerlandais nous ont posé une dernière condition : la dette.\n\nIls ont dit que c'était juste. Ils disaient que c'était le coût de l'administration coloniale, le prix des investissements réalisés avant la guerre. Mais cachés dans ces chiffres se cachaient les coûts des navires de guerre et des balles, ainsi que des campagnes militaires lancées pour écraser notre résistance. Ils nous ont en effet demandé de payer pour les bombes larguées sur notre propre sol. Pour régler le compte de la répression que nous avons endurée. Pour financer la cage dont nous nous sommes libérés.\n\nAccepter était amer - une insulte, disaient certains. S'éloigner, c'était risquer notre place parmi les nations, retarder la reconnaissance que nous avions déjà gagnée par le sang.\n\nQue devons-nous faire ?"
	indonesia.9.a: "La liberté a un prix"
	indonesia.10.a: "£Hatta_Signature"
	indonesia.10.d: "Il ne s'agissait pas d'un départ triomphal, mais d'un devoir solennel enveloppé du poids de l'histoire. Lorsque Mohammad Hatta, le vice-président de la République, est monté à bord de l'avion à destination des Pays-Bas, il ne l'a pas fait avec joie, mais en sachant pertinemment que l'âme même de l'indépendance durement gagnée de l'Indonésie était en jeu.\n\nLa guerre ne s'est pas terminée par une victoire nette. La Révolution a coûté des vies, des maisons et des années d'incertitude. Même si l'Indonésie avait tenu bon, les Néerlandais refusaient toujours de reconnaître pleinement la souveraineté de la République. C'est ainsi que, dans le cadre du cessez-le-feu fragile et sous l'immense pression internationale, Hatta a pris la fuite, non pas pour se rendre, mais pour négocier ce qui ne pouvait être gagné par les armes seules : la reconnaissance mondiale de la République.\n\nSon voyage à La Haye fut à la fois physique et symbolique. Traversant les océans, il transportait non seulement des documents et des notes diplomatiques, mais aussi les espoirs collectifs d'un peuple blessé. C'était un homme intelligent, calme et convaincu - loin d'être un orateur incendiaire - mais à cette époque, personne ne représentait mieux l'équilibre et les principes de la révolution."
	indonesia.10.t: "Mohammad Hatta se rend à La Haye"
	indonesia.11.d: "Les drapeaux flottaient doucement alors que les premiers responsables républicains revenaient à Yogyakarta - non pas en tant que fugitifs ou prisonniers, mais en tant que gouvernement légitime d'une nation libre. Les rues autrefois patrouillées par les troupes étrangères résonnent désormais des pas des dirigeants de retour. La République était revenue à la maison.\n\nAprès des mois d'absence, d'exil et de résistance, le coeur symbolique de l'Indonésie a été restauré. Yogyakarta n'est pas tombée facilement et n'a jamais été véritablement conquise spirituellement. Même si les Néerlandais ont revendiqué la ville et exilé ses dirigeants lors de la deuxième agression militaire, la République a continué à vivre dans les collines, dans les champs et dans la volonté du peuple. Grâce au gouvernement d'urgence de Bukittinggi, à la guérilla et à la diplomatie internationale, l'Indonésie a survécu.\n\nAujourd'hui, après l'accord Roem-Van Roijen et la pression internationale croissante, les Néerlandais se sont retirés. À leur place revinrent les dirigeants de la République - Sukarno, Hatta et le cabinet, qui avaient été retenus en captivité des mois plus tôt. Leur retour ne fut pas marqué par un défilé ou un spectacle, mais par un calme profond et fier. Yogyakarta les a accueillis avec dignité, non pas en conquérants, mais en gardiens d'un rêve restauré."
	indonesia.12.d: "Dans les vallées, le long des sentiers de la jungle et sur les fronts dispersés de Java et de Sumatra, le bruit des coups de feu a commencé à se taire. Non pas parce que la volonté de se battre s'est estompée, mais parce que le moment est venu de maintenir le cap par des paroles et non par des balles.\n\nSuite au fragile accord conclu lors des négociations Roem-Van Roijen, les forces militaires républicaines, sous la direction républicaine, ont commencé à cesser leurs opérations offensives contre les troupes néerlandaises occupant diverses parties de l'archipel. Il ne s'agit pas d'une reddition, mais d'un choix calculé et difficile, né d'un champ de bataille changeant : de la guerre dans la jungle aux manoeuvres diplomatiques.\n\nLe cessez-le-feu marque un tournant. Après des années de guérilla - combattant depuis les forêts, survivant à l'occupation, résistant aux convois blindés et aux bombardements aériens - la République a désormais manifesté son engagement en faveur d'une solution politique."
	indonesia.15.d: "Près de quatre longues années se sont écoulées depuis ce matin flamboyant d'août 1945, lorsque Soekarno se tenait devant une humble maison de l'est de Jakarta, la voix ferme, les paroles provocatrices, et déclarait au monde que l'Indonésie était libre. L'encre de la Proclamation était à peine sèche que la tempête commençait. Ce moment, rayonnant d'espoir, n'était pas la fin de notre lutte, c'était le début d'une nouvelle.\n\nDepuis lors, le chemin a été semé de sacrifices. Nous avons combattu non seulement avec des fusils, mais aussi à mains nues, avec un esprit brûlant et avec la force d'un peuple qui refusait de s'incliner à nouveau. Dans les jungles de Sumatra, dans les ruelles de Surabaya, depuis les rizières du centre de Java jusqu'aux collines de Sulawesi, nous avons défendu cette déclaration avec sang et volonté.\n\nNous avons fait face au retour du colonisateur, armé d'avions, de navires et de traités. Nous avons été confrontés à la division, à la tromperie et aux retards. Nous avons vu nos dirigeants exilés, nos villes bombardées et notre drapeau démoli - pour ensuite le hisser à nouveau, à chaque fois, plus haut qu'auparavant. La république ne vivait pas dans des bâtiments ou des frontières, mais dans le coeur de son peuple, dans le murmure de « Merdeka ! Transmis de bouche en bouche même dans les heures les plus sombres.\n\nEt maintenant, quatre ans plus tard, nous ne sommes toujours pas en paix, mais à la limite du possible. Notre lutte n'est pas encore terminée. L'indépendance a été déclarée, certes, mais ce qui est déclaré doit encore devenir réalité. Il ne suffit pas d'être libre sur le papier. Nous devons être libres en fait. Libre de toute domination, libre de choisir notre avenir, libre de parler, de construire, de respirer en tant que nation entière et souveraine."
	indonesia.15.a: "£Soekarno_Signature"
	indonesia.16.d: "Avec le rétablissement de l'autorité souveraine de la République à Yogyakarta et l'ouverture des négociations, l'Indonésie n'est plus en lutte mais en gestion. La formation du deuxième cabinet Hatta marque un acte délibéré et nécessaire : un gouvernement conçu pour porter le fardeau de la responsabilité nationale, non pas par défi mais en tant qu'État.\n\nCe cabinet, une fois de plus dans l'exercice de leadership de Mohammad Hatta, n'est pas né du feu de la révolution mais du travail calme et exigeant de la reconstruction. Il s'agit d'un gouvernement non pas de slogans, mais de devoir, formé par des hommes chargés de diriger un corps politique qui vient tout juste de sortir du creuset de la guerre, de la division et de la négociation, et qui exercent l'autorité de se gouverner lui-même.\n\nDans ce nouvel arrangement, nous n'abandonnons pas les idéaux de la République ; nous leur donnons plutôt une forme. Le leadership calme et rationnel de Hatta est le reflet de la maturité de la République. Le Cabinet reflète une consolidation organisée du pouvoir, non pas pour l'oppression mais pour l'orientation."
	indonesia.16.a: "£Hatta_Signature"
	indonesia_states.0.d: "Occuper notre territoire légitime ne nous mènera pas loin. C'est une triste réalité que nos territoires libérés ne peuvent pas être immédiatement et harmonieusement placés sous notre aile administrative. Non seulement la réalité de la résistance locale rend ce rêve impossible, mais nous devons plutôt renverser l'administration actuelle et la remplacer par la nôtre. Beaucoup de ces territoires disparates ne disposent pas d'infrastructures directes les reliant au reste du pays, mais nous devons nous assurer que toute administration que nous mettons en place peut réellement mettre en oeuvre nos politiques et appliquer efficacement nos lois. Ces efforts nécessitent du temps et des ressources et plus tôt nous les allouerons, plus tôt nous pourrons véritablement dire que notre gouvernement représente toute l'Indonésie"
	indonesia_states.1.t: "Intégrer l'État du Pasundan"
	indonesia_states.1.d: "Bien qu'il s'agisse d'une région troublée avec une longue histoire de rébellion, allant des gouvernements parrainés par les Pays-Bas aux groupes islamiques anti-néerlandais, grâce à des efforts considérables, nous pouvons enfin proclamer que Pasundan a été complètement intégré dans notre gouvernement unitaire. Même si les habitants restent hésitants, en grande partie en raison de sa courte histoire d'autonomie gouvernementale, à partir de ce jour, Pasundan restera une région centrale de notre République."
	indonesia_states.1.a: "Laissez Natsir travailler sur celui-ci !"
	indonesia_states.1.b: "Il faut y faire attention, Pasundan n'est pas comme les autres Etats !"
	indonesia_states.2.d: "Malgré sa taille, l'intégration de la petite île de Madura constitue une énorme victoire pour une Indonésie nouvellement libre. Autrefois source cruciale de recrutement pour notre ancien oppresseur colonial, l'incorporation de Madura nous rapproche de l'affirmation de notre contrôle plus large sur l'ensemble de Java. La production de tabac et de sel de l'île s'avérera cependant certainement être un atout supplémentaire."
	indonesia_states.3.d: "Colonisé pour la première fois par les puissances impérialistes en 1522, nous pouvons enfin proclamer aujourd'hui que Jawa Timur est véritablement indonésien. Grâce à des efforts constants et diligents, nous avons finalement affirmé notre contrôle administratif. En tant que théâtre d'allers-retours constants avec les colonisateurs néerlandais, Jawa Timur sera un atout indispensable dans nos efforts d'édification de la nation."
	indonesia_states.4.d: "Saisi par la VOC néerlandaise au XVIIe siècle, Sumatera Selatan abritait jusqu'à récemment plusieurs royaumes indépendants. Cette période est désormais terminée avec l'affirmation de notre régime unitaire, alors que nos hommes d'État compétents ont travaillé sans relâche pour intégrer le territoire sous notre aile administrative compétente ; pas facile pour une région remplie de plusieurs langues et d'ethnies diverses. Il s'agit néanmoins d'un moment historique pour la force et la légitimité de notre gouvernement."
	indonesia_states.5.d: "Ayant échangé des mains entre les impérialistes néerlandais et japonais tout au long de la Seconde Guerre mondiale, l'Est de Sumatra est pour nous depuis un certain temps une région problématique. Composés de combattants « indépendantistes » formés par les Japonais et issus de la Seconde Guerre mondiale, nos responsables ont eu du pain sur la planche pour pacifier une région aussi hostile. Cependant, avec des efforts considérables, nous pouvons enfin dire que l'Est de Sumatra est sous notre surveillance administrative et qu'il restera, nous l'espérons, une pierre angulaire permanente de notre nouvelle nation libre."
	indonesia_states.6.t: "Rédaction d'une nouvelle Constitution"
    indonesia_states.6.d: "L'échec du soulèvement de Westerling au début de cette année a créé une opposition significative au maintien du système fédéral et au retour à l'État unitaire.\n\\nLe Cabinet Hatta, répondant à la motion de Natsir, a convenu que la situation était intenable, négociant avec Abdul Halim, de la République d'Indonésie, une nouvelle constitution, quoique provisoire par nature, sera rédigée immédiatement pour remplacer la Constitution des États-Unis d'Indonésie de 1949.\n\\nCette commission et cette proposition ont été présentées conjointement par Soepomo et le vice-Premier ministre de la République d'Indonésie, Abdoel Hakim."
    indonesia_states.6.a: "Nécessaire."
	indonesia_news.1.d: "À la suite de l'agression militaire néerlandaise et de l'occupation de Yogyakarta à la fin de 1948, des dirigeants républicains clés, dont le président Sukarno et le vice-président Mohammad Hatta, furent capturés et exilés. En réponse, Sjafruddin Prawiranegara et un groupe de responsables républicains ont créé le PDRI à Bukittinggi, dans l'ouest de Sumatra, pour assurer la continuité de la République et démontrer que l'Indonésie restait une entité souveraine en résistance.\n\nAvec le retour des dirigeants républicains à Yogyakarta suite à la pression internationale et à la signature de l'accord Roem-Van Roijen, le gouvernement d'origine a été rétabli. Reconnaissant le rétablissement de l'autorité légitime, Sjafruddin et son cabinet ont déclaré la dissolution du PDRI, mettant ainsi fin à l'administration d'urgence."
    indonesia_serikat.2.d: "Au palais Pancasila, Hatta travaillait dans son bureau, rédigeant le discours de la réunion, lorsque sa secrétaire a soudainement fait irruption sans frapper. « Savez-vous à quel point il est inapproprié d'entrer dans mon bureau sans frapper ? » demanda Hatta. \n\n\"Je suis désolé, monsieur\", répondit le secrétaire. \"Mais nous avons reçu une lettre du capitaine Westerling. Il nous demande de reconnaître l'APRA comme l'armée officielle de l'Etat du Pasundan.\" \n\n\"Êtes-vous sérieux?\" » demanda Hatta. \n\n\"Oui, monsieur. Il exige également le respect inconditionnel de l'autonomie des Etats. Il a déclaré que si nous ne répondons pas dans les sept jours, il ne pourra pas être tenu pour responsable du déclenchement de combats à grande échelle au sein de l'APRA.\"\n\nHatta se leva de sa chaise et se dirigea vers sa secrétaire. \"Est-ce ainsi?\""
	indonesia_serikat.2.a.1: "\"Appelle Sukarno, dis-lui d'annuler les réunions.\""
    indonesia_serikat.2.a.2: "\"Il bluffe juste...\""
	indonesia_serikat.1.d: "Le soleil était bas, projetant une lumière dorée sur les haies taillées et les allées pavées. Meutia Hatta a pourchassé son amie autour d'un carré d'herbe, leurs pieds nus faisant de légers bruits sourds contre le sol. Les rires résonnaient sous les branches du flamboyant, les fleurs au-dessus d'un rouge vif - correspondant presque au drapeau ondulant doucement au sommet du toit du palais.\n\nLes lourdes portes d'entrée s'ouvrirent avec un grincement. Mohammad Hatta, son manteau à la main, sortit, s'arrêtant pour respirer l'air frais.\n\nMeutia : \"Papa !\"\n\nHatta : \"Voilà ma copine. Hmm, tu as couru comme un combattant de la liberté en prenant d'assaut les tranchées, est-ce que tu t'amuses ?\"\n\nMeutia : \"Oui, Papa ! On construit une base secrète sous l'arbre ! C'est là que se réunissent les dirigeants.\"\n\nHatta : « Une base secrète, hein ? Suis-je autorisé à entrer, ou est-ce réservé aux révolutionnaires de moins de dix ans ?\n\nMeutia : \"Seulement si vous apportez des collations. Et prononcez le mot de code.\"\n\nHatta : \"Laisse-moi deviner... 'Merdeka' ?\"\n\nMeutia : \"Comment le saviez-vous ?!\"\n\nHatta : \"Eh bien, certains mots restent proches du coeur. Surtout celui-là.\"\n\nL'après-midi s'est révélé paisible, presque ordinaire, mais au-delà de tout cela, il y avait un léger sentiment de victoire. Ce jardin, ces rires, ce moment, rien de tout cela n'aurait été possible sans la lutte des années passées."
	indonesia_serikat.1.a: "Merdeka !"
	indonesia_serikat.3.t: "Hamid Alkadrie condamné"
	indonesia_serikat.3.a: "Justice rendue"
	indonesia_serikat.3.d: "Compte tenu de l'effondrement de Westerling et de sa faction APRA, il est à la fois légitime et essentiel de demander des comptes à ces individus pour leurs actes. Parmi eux se trouve Hamid Alkadrie, anciennement connu sous le nom de Sultan Hamid II de Pontianak. Malgré ses affirmations ultérieures selon lesquelles il avait cherché à arrêter le coup d'État après avoir découvert le complot de Westerling visant à assassiner les dirigeants du RUSI, cela ne l'exonère pas. Selon la loi, Alkadrie reste complice du complot, ses actions étant irrévocablement liées aux efforts visant à déstabiliser notre gouvernement."
	indonesia_serikat.4.d: "L'analphabétisme reste l'un des défis les plus importants auxquels est confrontée l'Indonésie aujourd'hui, touchant près de la moitié de la population qui manque des compétences essentielles en lecture et en écriture. Ce problème répandu est enraciné dans l'héritage colonial, où les initiatives éducatives donnaient la priorité aux élites autochtones tout en négligeant la population dans son ensemble. En conséquence, d'innombrables Indonésiens ont été privés d'opportunités d'éducation de base et des ressources nécessaires qui pourraient les autonomiser. \n\nDans un effort pour lutter contre ce problème urgent, nous créons le §GSekolah Pemberantas Buta Huruf Umum§!. Cette institution vise à proposer des programmes d'alphabétisation complets adaptés aux besoins de la communauté. Grâce à un enseignement dédié et à des ressources accessibles, nous espérons réduire considérablement, voire éradiquer complètement, l'analphabétisme en Indonésie. Notre objectif est de créer une population plus instruite, dotée des compétences nécessaires pour améliorer sa situation personnelle et contribuer positivement à la société."
	indonesia_serikat.4.a: "Tut Wuri Handajani"
	indonesia_apri.1.d: "Nous sommes sortis des flammes de la révolution, unis dans notre objectif et dans notre esprit. En 1945, lorsque l'appel à l'action a retenti, nous étions agriculteurs, dockers, étudiants et anciens soldats - mais surtout, nous étions des Indonésiens déterminés à ne plus jamais nous soumettre à la domination étrangère. Dans les jungles, le long des côtes et dans les villes animées, nous ne nous sommes battus pas pour la richesse ou le statut, mais pour le drapeau rouge et blanc qui représentait un avenir dont nos parents n'avaient que rêvé. Chaque fusil que nous portions n'était pas seulement une arme ; c'était la promesse que cette terre resterait la nôtre pour toujours. Nous n'étions pas de simples soldats ; nous incarnons la volonté inflexible du peuple.\n\nDepuis ces jours tumultueux, nous sommes restés vigilants alors que notre république faisait ses premiers pas timides. Nous avons protégé nos frontières contre les menaces extérieures et sommes restés fermes face au chaos qui surgissait de l'intérieur. Même si les politiciens peuvent diriger le gouvernement, nous sommes la force inébranlable qui assure la sécurité de la nation. Nous sommes les fiers fils et filles de l'indépendance, liés par un serment qui transcende le temps : défendre l'Indonésie, quel que soit le sacrifice. Tant que le Garuda planera dans le ciel, nous resterons résolus - le bouclier inébranlable et la puissante épée de notre nation bien-aimée."
	indonesia_apra.1.d: "La matinée du coup d'État a commencé comme toutes les autres à Jakarta, mais elle a rapidement dégénéré en un chaos qui allait ébranler les fondations de notre jeune république. Les forces de Raymond Westerling ont profité de la confusion pour frapper rapidement des sites clés du gouvernement. Au milieu de la tourmente, nous avons appris la tragique nouvelle que le président Sukarno et le vice-président Hatta avaient été tués au début de l'assaut alors qu'ils tentaient de coordonner une réponse. L'annonce s'est répandue dans nos rues comme une traînée de poudre, envoyant une onde de choc à travers l'archipel et nous laissant incrédules."
	indonesia_news.6.d: "L'Indonésie était encore en train d'absorber le poids de sa souveraineté durement acquise. Pourtant, sous la surface de la célébration, des tensions couvaient. Le capitaine Raymond Westerling, autrefois commandant d'un commando néerlandais redouté dans le sud de Sulawesi, a refusé d'accepter la nouvelle réalité. Soutenu par des éléments mécontents de l'ancienne KNIL et certains sympathisants pro-néerlandais, il a conçu un plan audacieux : frapper rapidement à Jakarta, éliminer les hauts responsables du gouvernement et remplacer la direction républicaine par une autorité provisoire fidèle aux intérêts néerlandais.\n\nBandung est devenu le centre névralgique de la conspiration. Depuis des refuges discrets, les messages et les ordres circulaient tranquillement, et de petites unités se préparaient sous couvert d'« exercices de sécurité ». Mais les renseignements républicains surveillaient. À la mi-janvier, des informations sont parvenues à Jakarta faisant état de mouvements inhabituels et de rassemblements armés. Agissant rapidement, l'armée indonésienne a renforcé les points de contrôle, intercepté les coursiers et procédé à des arrestations préventives. L'élan espéré par Westerling ne s'est jamais concrétisé. Ses forces, isolées et encerclées, abandonnèrent le plan. Westerling lui-même a fui Bandung, échappant aux patrouilles avant de disparaître outre-mer."
	indonesia_news.5.d: "Les troubles politiques et l'incertitude quant à la structure fédérale de la jeune République ont fourni une ouverture parfaite au capitaine Raymond Westerling. Avec les restes fidèles du KNIL et un réseau de sympathisants pro-néerlandais, il a lancé une opération éclair depuis Bandung. Son plan était précis : s'emparer de Jakarta, neutraliser les dirigeants républicains et établir une administration provisoire qui « rétablirait l'ordre » sous les États-Unis fédéraux d'Indonésie. Par une matinée brumeuse, des unités coordonnées ont avancé dans la capitale, écrasant les forces républicaines dispersées gardant les ministères clés et les centres de communication.\n\nEn 48 heures, le palais présidentiel était sous surveillance, d'importants responsables du gouvernement étaient en détention, le président Soekarno et le vice-président Hatta étaient assassinés, et les stations de radio diffusaient des décrets d'urgence sous l'autorité de Westerling. A Sumatra, un gouvernement rival dirigé par le général Soedirman prétend être le prolongement légitime de l'Indonésie de Soekarno-Hatta. Les gouvernements étrangers, inquiets d'une nouvelle instabilité, ont hésité à intervenir directement, laissant ainsi aux deux régimes le temps de se consolider."
	indonesia.5.d: "Au coeur de la République, beaucoup percevaient la structure fédérale imposée par la Table ronde non pas comme une véritable expression de l'unité de l'Indonésie, mais comme une tactique néerlandaise persistante visant à fragmenter et affaiblir la nation naissante. Les États-Unis d'Indonésie, avec leur mélange d'États et de territoires, ont conduit à la désunion politique et ont donné aux dirigeants régionaux le pouvoir d'ignorer le gouvernement central de Yogyakarta.\n\nLes dirigeants républicains ont reconnu l'urgence de la situation et ont rapidement dénoncé le fédéralisme comme un vestige colonial incompatible avec l'esprit révolutionnaire. Grâce à un mélange de négociations politiques, de persuasion publique efficace et de pressions décisives, la république a entrepris d'unifier les États fédéraux sous une seule République d'Indonésie. Au milieu des années 1950, la majorité des États étaient convaincus de se dissoudre et de fusionner avec l'autorité centrale, motivés par des manifestations de masse, un sentiment nationaliste croissant et la promesse d'un avenir plus stable.\n\nL'intégration complète de l'État d'Indonésie orientale a marqué la fin du système fédéral. À Jakarta, aujourd'hui capitale d'une république unifiée, cette réalisation a été saluée comme un triomphe des idéaux révolutionnaires, affirmant que l'indépendance de l'Indonésie serait désormais gouvernée sous un seul drapeau et un seul gouvernement cohésif."
	pki.1.d: "\n\n\n\n\n£PKI_Rejuvenation\n\n\n\n\n\n\n\nOBJET : PKI légalement rétablie \nÀ : Premier ministre indonésien, M. Mohammad Hatta\n\nCher Monsieur le Premier Ministre,\n\nJe vous écris pour exprimer ma profonde préoccupation concernant la récente réintégration légale du Parti communiste indonésien. Cela envoie un signal troublant à ceux d'entre nous qui se souviennent très bien du chaos et de l'effusion de sang provoqués par les actions du PKI, en particulier lors de l'affaire Madiun il y a à peine deux ans.\n\nPermettre le retour d'une telle force sous couvert de la légalité est, à mon avis, une grave erreur. Le PKI a constamment démontré qu'il n'agit pas dans les limites de la démocratie et qu'il ne respecte pas non plus les principes sur lesquels repose notre République. Son idéologie est incompatible avec notre caractère national.\n\nJe vous exhorte, Monsieur le Premier ministre, à traiter cette question avec le sérieux qu'elle exige. Nous devons rester fermes dans notre détermination à protéger la République des forces qui cherchent à exploiter nos libertés dans le seul but de les détruire de l'intérieur. Ce n'est pas simplement une question de compétition politique ; c'est une question de survie nationale. Tirons les leçons du passé pour ne plus en souffrir.\n\nCordialement, \nKepala Staf Dinas Chusus, Badan Intelijen Negara :"
	pki.2.t: "Étrange matinée"
	pki.2.d: "Alimin était assis bien droit dans son lit, de la sueur froide coulait sur son front pâle alors que l'horloge créait une mélodie régulière mais exaspérante. Sa femme, Hajjah, a essayé de le rassurer et lui a posé des questions approfondies sur ce qui l'avait tiré de leur sommeil. Cependant, ses paroles étaient inconsciemment rendues muettes par son esprit troublé. Comment pourraient-ils ne pas l'être, après ce dont il venait d'être témoin\n\n1948 fut une année terrible et, peu importe le temps écoulé, les cicatrices de l'affaire Madiun étaient encore profondément ancrées dans son esprit privé de sommeil. Le 28 octobre de la même année, ses idéaux ont été incendiés et certains de ses plus proches confidents ont été brutalement massacrés par un gouvernement qu'il devait désormais prétendre servir en tant que « fonctionnaire dévoué ». C'était comme une trahison envers le massacre qui avait coûté la vie aux hommes et aux femmes qu'il était chargé de diriger alors qu'il restait assis tranquillement à faire de la politique avec ceux-là mêmes qui les avaient assassinés. Alimin se souvenait encore des visages de ses amis - Djoko, Maruto et Munawar Musso - tués alors qu'ils fuyaient, leurs corps brûlés pour envoyer un message brutal mais efficace.\n\nHanté par sa trahison perçue pendant la journée, son esprit cherchait à le punir la nuit, le tourmentant de cauchemars. Dans ces rêves, le massacre de Java se répéterait, mais cette fois, ce serait son corps profané aspergé d'essence et incendié, aimé et oublié par personne. Chaque fois qu'il fermait les yeux, tout ce qu'il pouvait voir étaient les visages immobiles de cadavres en feu, figés dans une peur et une terreur perpétuelles.\n\nLa réflexion d'Alimin fut finalement interrompue lorsqu'il sentit la main de sa femme se poser doucement sur son épaule. Il réalisa soudain à quel point il se sentait froid et moite, et à quel point les draps étaient devenus mouillés de sueur. Elle ne voulait rien d'autre que soulager sa douleur, le poussant à partager son cauchemar avec elle, mais il ne pouvait pas se résoudre à le faire. Il ne pouvait pas la soumettre à une telle cruauté, mais il redoutait l'idée de fermer à nouveau les yeux. Alors, il l'a tranquillement rassurée en lui disant que ce n'était qu'un simple cauchemar et que tout ce dont il avait besoin c'était d'un peu d'air frais."
	pki.2.a: "Bizarre..."
	pki.4.t: "Arrestation massive du PKI"
    pki.4.d: "Le rajeunissement du Parti communiste d'Indonésie a ses propres conséquences, lorsque Aidit a surpassé le parti d'Alimin en 1950, il a reconstruit le parti en une véritable force de combat, au-delà de son apogée avant les affaires de Madiun. Cela provoque un tollé au sein des partis islamiques de la République, mais cela ne s'arrête pas là.\n\nAvec de nombreuses grèves des syndicats alignés sur le PKI tels que le SOBSI et le BTI, le gouvernement n'a pu que céder face à son insistance en faveur des droits des travailleurs, donnant ainsi au gouvernement de coalition au sein du DPRS l'impression de mettre en avant l'agenda du PKI, le parti d'opposition, au lieu de son propre agenda.\n\nLa manifestation de Tandjung Priok qui a fait plusieurs centaines de morts a mis le cabinet Soekiman au point de rupture, avec l'approbation du président Soekarno, cette arrestation que nous avions procédé nous a mis dans de mauvaises relations avec la population laborieuse, qui voyait le PKI comme sa seule voix au sein du DPRS.\n\nEt maintenant, nous nous sommes dit : si PKI réussit, le premier sila est mort."
    pki.4.a: "Brutal, mais nécessaire."
	pki.5.t: "Débrayage PKI"
    pki.5.d: "Sans surprise, le PKI a protesté, et à la surprise générale, il l'a fait vocalement plutôt que par une action directe. La récente interdiction de la grève des travailleurs a poussé les parlementaires du PKI à se retirer de la session au sein du DPRS, exigeant le rétablissement de la grève comme forme de protestation et d'expression politique.\n\nMalgré le départ brutal des représentants du PKI, la séance s'est poursuivie comme d'habitude sans perturbation majeure. Le Parlement a poursuivi son ordre du jour, démontrant que la protestation, bien que symbolique et très médiatisée, n'a pas réussi à interrompre les débats ni à modifier la décision."
    pki.5.a: "Tch, faible."
	indonesia.7.t: "Formation du cabinet Natsir Ier"
	indonesia.7.d: "Nous sommes heureux d'annoncer que nous avons atteint le point où nous pouvons finaliser notre liste de cabinet. Bien que cette décision puisse contrarier certains partis, notamment le PNI, nous pensons qu'il s'agit d'une étape nécessaire vers la réalisation de notre vision. Même s'ils peuvent être mécontents à l'heure actuelle, nous sommes convaincus que nos choix seront finalement bénéfiques. Notre objectif est de créer le meilleur Cabinet possible et nous attendons avec impatience les résultats positifs qui découleront de nos décisions. Nous sommes prêts à avancer avec fierté et anticipation, sachant que nous finirons par réussir."
	indonesia.7.a: "Formation trépidante"
	indonesia.8.t: "Formation du cabinet Soekiman-Soewirjo"
	indonesia.8.d: "L'incapacité de Mohammad Natsir à former un gouvernement cohérent et stable a conduit à une autre crise, faisant chuter sa cote de popularité à [?INO_Approval_factor_var_temp|+%0]. En réponse, le DPR a émis une motion de censure contre Natsir. En conséquence, le président Soekarno a révoqué le mandat de Natsir et a publié un décret nommant Soekiman Wirjosandjojo comme nouveau Premier ministre."
	indonesia.8.a: "Pauvre Natsir"
