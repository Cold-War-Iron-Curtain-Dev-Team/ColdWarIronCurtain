	Indonesia_debug_decisions: "Affaires Sukarno"
	Indonesia_debug_decisions_desc: "\n\n\n\n\n\n\n\n£Sukarno_Affairs\n\n\n\n\n\n\n\n\n\nÊtre président n'est pas une tâche facile ; c'est pourquoi Sukarno, pour mieux dire, trouve un soulagement à trouver une belle femme à épouser. Sans partenaire pour l'accompagner, Sukarno ne se sentira pas énergique pour accomplir son devoir. Peut-être aussi bien épouser Larissa Rochefort.\n\n\nPremier ministre actuel : §Y[INO.GetLeader]§!\n[?indonesia_party_seats|%1]\n\nINO_Approval_factor_var : [?INO_Approval_factor_var|%1]\n\nINO_Approval_factor_var_temp : [?INO_Approval_factor_var_temp|%1]\n\nINO_Approval_factor_speed_var : [?INO_Approval_factor_speed_var|%1]\n\nINO_Approval_Consumer_Goods_factor_var : [?INO_Approval_Consumer_Goods_factor_var|%1]\nINO_Approval_Consumer_Goods_factor_var : [?INO_TNI_Approval|%1]"
