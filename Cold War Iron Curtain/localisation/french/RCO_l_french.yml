l_french:
 OPT_REGIME_CHANGE_OPPORTUNITY_TITLE:0 "§ROption pour adopter un changement de régime§!"
 OPT_REGIME_CHANGE_OPPORTUNITY_ACTION_DESC:0 "Adopter un changement de régime"
 RCO_alert_tt:0 "§ROpportunité de changement de régime§!\nDisponible en :\n[RCO_target_list]\nOuvrez l'écran §Ydiplomatie§! du pays et utilisez §YOpportunité de changement de régime§!.\n\n§GCliquez avec le bouton droit sur§! pour ignorer jusqu'à ce qu'une nouvelle opportunité apparaisse."
 RCO_selectable_tt:0 "Nous avons la possibilité d'intervenir dans les affaires intérieures de ce pays"
 RCO_target_line:0 " - §Y[?rco_v.GetName]§!\n[RCO_target_list_inner]"
 opt_regime_change_opportunity:0 "Opportunité de changement de régime"
 RCO.1.t:0 "Opportunité de changement de régime : [RCO_target.GetNameDef]"
 RCO.1.d:0 "La situation en [RCO_target.GetNameDef] a ouvert une fenêtre pour changer le cours de l'histoire. Comment allons-nous procéder ?"
 RCO.1.cancel:0 "Pas maintenant."
 RCO_sov_greece:0 "L'accord de pourcentage"
 RCO_sov_greece_desc:0 "§gHistorique§!\nL'Armée démocratique grecque s'effondre. Honorez l'accord de 1944 avec Churchill et laissez partir la Grèce, ou bien déchirez-le et intervenez ouvertement."
 RCO_sov_china:0 "L'intervention mandchoue"
 RCO_sov_china_desc:0 "§YHistoire alternative§!\nL'Armée populaire de libération est au bord de la défaite. Intervenir en Mandchourie pour sauver ce qui reste de la révolution chinoise. §RLa guerre civile se termine par une victoire nationaliste§!: les communistes ne survivent que dans le nord-est."
 RCO_sov_wgr49:0 "Les élections au Bundestag de 1949"
 RCO_sov_wgr49_desc:0 "§YHistoire alternative§!\nLes premières élections ouest-allemandes approchent. Nos réseaux pourraient faire basculer les votes en faveur du KPD, au risque d'être démasqués."
 RCO_sov_stalin_note:0 "La note de Staline"
 RCO_sov_stalin_note_desc:0 "§gHistorique§!\nProposer une Allemagne réunifiée et neutre aux puissances occidentales, avant que l'Allemagne de l'Ouest ne soit liée à l'alliance atlantique."
 RCO_sov_yug:0 "Ultimatum à Belgrade"
 RCO_sov_yug_desc:0 "§YHistoire alternative§!\nAlors que les communistes grecs tiennent la frontière, Tito est encerclé. Exigez que la Yougoslavie accepte les troupes soviétiques, sous peine d'affronter la guerre."
 RCO_sov_pol:0 "Les révisionnistes polonais"
 RCO_sov_pol_desc:0 "§YHistoire alternative§!\nLes révisionnistes polonais sont allés encore plus loin que les khrouchtchéviens, nous ne tolérerons pas leur dégénérescence !"
