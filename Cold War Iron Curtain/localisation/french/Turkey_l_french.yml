 ###DECISIONS###
 
 tur_dp_factionalism_decisions:0 "Le factionnalisme du Parti démocrate"
 tur_dp_factionalism_decisions_desc:0 "Depuis le jour où il a remporté les élections, le pouvoir et l'influence au sein du Parti démocrate ont été partagés par 3 groupes en particulier : les représentants parlementaires à l'Assemblée nationale, Celal Bayar au manoir de Çankaya et Adnan Menderes au siège du Premier ministre. Ces trois groupes s'efforceront à tout moment d'être le véritable pouvoir derrière le Parti, et si l'un d'eux travaille avec l'autre, ce sera toujours pour s'opposer au troisième."
 TUR_Bayar_tt:0 "Celal Bayar"
 TUR_Bayar_tt_desc:0 "L'un des nombreux héros de la Lutte Nationale, rival de longue date d'Inönü, troisième premier ministre et aujourd'hui président de la république. Celal Bayar représente la vieille garde qui dirigeait la politique turque depuis sa fondation. C'est sous lui que le Parti démocrate a été fondé et c'est son expertise qui a mené le parti à la victoire. Après des années de lutte, il ne se contentera jamais d'un devoir symbolique.\n\nLa clique de Bayar représente l'aile libérale du PD qui n'est pas nécessairement conservatrice. Toujours attachés aux réformes et à l'héritage d'Atatürk, ils jouent un rôle important dans le maintien des relations avec le CHP."
 
