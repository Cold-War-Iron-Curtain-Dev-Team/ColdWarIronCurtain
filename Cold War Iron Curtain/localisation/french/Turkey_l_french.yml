 ###EVENTS###
 
 TUR_Gunaltay.1.t:0 "Nous aligner sur les normes démocratiques occidentales"
 TUR_Gunaltay.1.d:0 "Lorsque le président Inönü a nommé Semsettin Günaltay au poste de Premier ministre en janvier dernier, l'intention était de confier le mouvement de démocratisation à un modéré, en signe de bonne volonté. Son programme gouvernemental est décrit comme le plus démocratique des dix-huit gouvernements du CHP depuis sa création. Une commission dirigée par Nihat Erim, adjoint de Günaltay, travaille déjà sur le prochain projet de loi « Loi sur l'élection des représentants ». Le Premier ministre lui-même cherche à utiliser le temps limité dont il dispose pour remettre en question le statu quo du CHP autant qu'il le peut, suffisamment pour regagner la confiance du peuple."
 TUR_Gunaltay.1.a:0 "Avec une nouvelle décennie, un vent de changement souffle."
 TUR_Gunaltay.2.t:0 "Mise en oeuvre des révisions de la taxe routière"
 TUR_Gunaltay.2.d:0 "Bien que nous ayons promis à plusieurs reprises d'abolir complètement la taxe routière, notre politique actuelle en matière de transports rend cette promesse risquée à tenir, car nous avons désespérément besoin de financement. Au lieu de cela, nous avons choisi de réviser la loi pour mettre un poids sur les ventes d'essence sous la forme d'une taxe sur les ventes.\n\nIl est tout à fait juste que les personnes qui utilisent activement les routes que nous construisons paient la part la plus élevée de la taxe. Nos législateurs et conseillers économiques conviennent qu'il s'agit du compromis nécessaire que nous devons faire pour maintenir la stabilité de nos finances.\n\nBien entendu, nous pouvons encore différer les révisions et décider de tenir parole et de supprimer toute forme de taxe routière. Il est difficile de revenir sur le travail déjà accompli à un stade aussi avancé du processus, sans parler des obstacles potentiels à notre secteur de la construction, mais le moment venu, cela pourrait faire la différence dans l'esprit des électeurs."
 TUR_Gunaltay.2.a:0 "Espérons que cela suffira à regagner quelques voix."
 TUR_Gunaltay.2.b:0 "Renvoyez-le à l'Assemblée, il faut supprimer complètement l'impôt !"
 TUR_Gunaltay.3.t:0 "Fevzi Cakmak est décédé"
 TUR_Gunaltay.3.d:0 "Soldat. Politicien. Patriote. Rares sont ceux qui ont eu autant d'influence sur la république que Fevzi Çakmak au cours des 30 dernières années. Après la victoire à la bataille de Dumlupinar, il obtint le grade de maréchal, la deuxième et dernière personne à le faire après Atatürk lui-même. Après la guerre, il a occupé de nombreux postes, dont celui de chef d'état-major, pendant 22 ans.\n\nToujours critique à l'égard du CHP sous Inönü, Çakmak fut l'un des premiers membres du DP. Après la Déclaration du 12 juillet, lorsque les deux partis ont fait amende honorable, il a fondé, avec cinq autres personnes opposées au compromis, le Millet Partisi (Parti de la Nation). Bien que peu nombreux, leur groupe parlementaire est devenu la voix la plus forte de l'opposition.\n\nBien qu'il envisageait de diriger le parti aux prochaines élections, il est décédé subitement aujourd'hui. Bien qu'aucun rapport officiel n'ait été rendu public, certains pensent que les médecins lui ont délibérément administré le mauvais type de sang.\n\nSes prochaines funérailles devraient rassembler des centaines de milliers de personnes. Nous avons la possibilité de rendre officiellement hommage à un héros de la guerre d'indépendance, malgré ses critiques sévères à notre égard. On peut aussi se contenter de quelques simples annonces au Journal Officiel pour véritablement mettre le dernier clou dans le cercueil du Parti Nation. Cela risque cependant d'aliéner et même de galvaniser les gens contre nous pour manque de respect à une figure hautement vénérée."
 TUR_Gunaltay.3.a:0 "L'opposition a perdu son héros. Alors, qu'y a-t-il d'autre à la radio ?"
 TUR_Gunaltay.3.b:0 "La République a perdu un héros, déclarez une semaine de deuil !"
 TUR_Gunaltay.4.t:0 "Les extrémistes mécontents"
 TUR_Gunaltay.4.d:0 "Nos efforts pour répondre davantage aux besoins de la population dans son ensemble ont suscité certaines inquiétudes parmi certains des éléments les plus radicaux du parti. Ils croient que toute mesure qui s'écarterait des principes du kémalisme déclencherait un effet domino qui aboutirait à ce que le programme du parti soit impossible à distinguer de celui des partis d'opposition.\n\nCes voix, bien que peu nombreuses, ont le potentiel de croître à mesure que nous changeons et nous adaptons davantage. Si les membres de gauche comme de droite commencent à se radicaliser, cela peut déchirer notre pays."
 TUR_Gunaltay.4.a:0 "Nous faisons seulement ce qui est nécessaire."
