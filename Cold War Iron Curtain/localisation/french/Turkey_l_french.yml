 ###FOCUS TREE###
 
 TUR_Democratize_The_Regime:0 "Démocratiser le régime"
 TUR_Democratize_The_Regime_desc:0 "L'Europe de l'Est tombe chaque jour un peu plus entre les mains des communistes. Alors que l'avenir de la Grèce est sombre et que les Soviétiques se trouvent de l'autre côté de nos frontières, il est malheureusement évident que nous devons nous rapprocher rapidement des puissances occidentales. Pour montrer notre engagement en faveur de la démocratie et de l'État de droit occidental, nous devons d'abord commencer à réformer notre système républicain très critiqué, qui n'a jusqu'à présent favorisé que le gouvernement au pouvoir."
 TUR_Closer_Ties_With_West:0 "Rechercher des liens diplomatiques plus étroits avec l'Occident"
 TUR_Closer_Ties_With_West_desc:0 "L'un des grands idéaux que poursuit notre gouvernement est la communion fraternelle entre les nations ainsi que la paix et la sécurité dans le monde entier. L'ONU est l'un des véhicules, sinon le principal, qui nous mènera vers cet avenir. Nous devons continuer à forger de meilleures relations avec nos amis occidentaux et aider cette nouvelle organisation à atteindre le potentiel qu'elle véhicule."
 TUR_Prioritize_Trade_With_United_States:0 "Donner la priorité au commerce avec les États-Unis"
 TUR_Prioritize_Trade_With_United_States_desc:0 "Bien que notre pays ait échappé aux destructions de la Seconde Guerre mondiale, notre économie n'était pas très bonne au départ. Nous avons sérieusement besoin de devises de réserve, sinon nous risquons une crise à un moment très critique. Alors que l'Europe occidentale est encore en train de se reconstruire et que l'Amérique est devenue la première puissance économique, il serait naturel pour nous de donner la priorité à nos relations commerciales avec ce poids lourd."
 TUR_Utilize_Marshall_Funds:0 "Utiliser les fonds Marshall"
 TUR_Utilize_Marshall_Funds_desc:0 "L'entreprise lancée par le gouvernement américain pour la reconstruction et le développement de l'Europe, le soi-disant Plan Marshall, nous a également permis de récolter une certaine aide monétaire. Cette aide financière pourrait nous aider à développer considérablement notre industrie si elle est utilisée de la bonne manière ; élargir nos capacités minières, acquérir des matières premières et investir dans la stabilité financière bien sûr. En échange de cette attitude amicale, nous nous efforcerons d'être un partenaire utile pour les Américains ainsi que pour l'Organisation européenne de coopération économique. Après tout, une économie forte pour nous pourrait un jour signifier une économie forte pour l'Europe."
 TUR_American_Arms_And_Artillery:0 "Armes et artillerie américaines"
 TUR_American_Arms_And_Artillery_desc:0 "Notre armée héroïque doit être forte pour surmonter les défis liés à l'instauration de la paix mondiale. Nos amis du gouvernement américain apprécient notre position et sont plus que disposés à aider à doter nos troupes des armes et des outils modernes nécessaires. Nous devons travailler à sécuriser une nouvelle expédition tout en travaillant sur de nouveaux plans et mesures adaptés au monde d'aujourd'hui."
 TUR_Improve_Productivity_of_Government_Workers:0 "Améliorer la productivité des fonctionnaires"
 TUR_Improve_Productivity_of_Government_Workers_desc:0 "Pour garantir que le citoyen moyen aime de tout coeur l'État et ses travailleurs, il faut rendre les processus aussi efficaces que possible sans causer de perte de temps inutile à notre peuple. En plus d'améliorer nos organisations au niveau administratif, nous modifierons également les lois sur les provinces et les administrations spéciales et les présenterons à l'Assemblée nationale dès que possible. Nous pensons que lorsque les forces de l'ordre locales commenceront à travailler sans hésitation, la sérénité régnera dans le pays."
 TUR_Preparations_for_1950_Elections:0 "Commencer les préparatifs pour les élections de 1950"
 TUR_Preparations_for_1950_Elections_desc:0 "Le moment est venu de commencer à préparer les prochaines élections générales. Il faut choisir des candidats, organiser des rassemblements et surtout signer de nouvelles lois. Les six derniers mois précédant une élection peuvent décider de l'issue totale. Nous devons être particulièrement attentifs à ce que nous faisons ou disons au cours des prochains mois."
 TUR_Implement_Tax_Reform:0 "Mettre en oeuvre la réforme fiscale"
 TUR_Implement_Tax_Reform_desc:0 "Lorsque le gouvernement de Günaltay a été formé l'année dernière, l'une des premières mesures qu'il a prises a été de commencer à réviser certaines taxes, en particulier la très détestée « taxe routière ». Depuis plus de cent ans, il existe une forme de taxe routière pour notre peuple, la dernière version ayant été mise en oeuvre dans les années 30 pour financer le développement des infrastructures. Toutefois, récemment, les forces libérales de l'opposition ont utilisé la haine accumulée pour réaliser des gains considérables dans la course électorale. Quoi qu'il en soit, nous devons finaliser les révisions et les mettre en vigueur immédiatement."
 TUR_Lighten_Governments_Stance_on_Religion:0 "Alléger notre position sur la religion"
 TUR_Lighten_Governments_Stance_on_Religion_desc:0 "La politique de laïcité agressive que nous avons menée jusqu'à présent, bien qu'utile dans notre croisade visant à débarrasser notre peuple des idées rétrogrades, a aliéné la majorité de notre population et nous courons désormais le risque de perdre une grande partie des voix au profit du PD. Dans son plan gouvernemental, le Premier ministre a annoncé son intention d'inclure l'enseignement religieux facultatif dans l'enseignement primaire, d'ouvrir un département de théologie à l'Université d'Ankara et d'ouvrir des türbes pour un certain nombre de personnages historiques. Avec un Premier ministre islamiste à la tête du pays, cela devrait nous permettre de reconquérir la foule religieuse."
 TUR_Reform_the_Electoral_System:0 "Réformer le système électoral"
 TUR_Reform_the_Electoral_System_desc:0 "Pour beaucoup dans les cercles de l'opposition, les élections générales de 1946 sont considérées comme un homicide brutal, une fausse élection délibérément organisée pour garantir qu'aucune véritable opposition ne puisse se former. Dans sa déclaration du 12 juillet, le président Inönü a promis une représentation plus juste et des élections justes aux dirigeants du PD en échange de leur coopération. Le moment est venu pour nous de mettre enfin en oeuvre les réformes promises dans le système juridique."
