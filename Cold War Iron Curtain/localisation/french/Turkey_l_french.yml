 ##Leader Desc##

 POLITICS_ISMET_INONU_DESC:0 "Comme Mustafa Kemal avant lui, le doyen des hommes d'État d'Ankara est vénéré pour avoir, avec ruse et diplomatie, tenu le peuple turc à l'écart de la Seconde Guerre mondiale seulement jusqu'à la dernière année du conflit, dans l'espoir d'épargner à l'ancien coeur du pays Ottoman la même mort et la même récession qui ont mis l'Empire à genoux. Aujourd'hui, alors que les puissances de l'Axe à l'ouest sont pacifiées, Inonu se trouve isolé de ses alliés à l'ouest, et avec le radicalisme croissant chez les voisins de la Turquie au sud et la menace imminente du nouvel empire prolétarien tapi au-delà de la mer Noire, il incombe au sage vétéran turc de suivre le chemin étroit du maintien de la discipline et du développement de l'État turc au milieu d'un Moyen-Orient de plus en plus instable."
 Semsettin_Gunaltay_Leader_Desc:0 "Contrairement à l'homme politique moyen du CHP, Mehmet Semsettin Günaltay est issu d'un solide milieu religieux. Ayant fait ses études dans des écoles occidentales à l'étranger et dans des institutions religieuses locales, Günaltay a commencé sa carrière d'enseignant en 1905 et a enseigné dans d'importantes madrasas de l'époque ainsi que dans les départements islamiques de plusieurs universités après la réforme de l'éducation. Sa carrière d'enseignant s'est poursuivie jusqu'en 1940, date à laquelle il a été interdit aux politiciens en exercice d'enseigner dans les écoles.\n\nÉlu pour la première fois au Parlement Ottoman en 1915, Günaltay a participé activement à la formation d'associations de défense locales pendant les années d'occupation d'Istanbul. Après la formation de la république, il a été élu représentant de Sivas et est depuis lors membre permanent du parlement.\n\nBien qu'il ait une formation scientifique et religieuse, Günaltay mène une carrière d'historien particulièrement influente, contribuant à la création de la Société d'histoire turque en 1931. Depuis 1941, il en est le président."

