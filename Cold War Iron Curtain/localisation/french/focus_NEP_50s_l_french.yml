 nep_pajani_init_baseline_tt:0 "§YInitialiser le système de patronage Pajani§!\nÉtablit un contrôle noble de base sur la bureaucratie et les réseaux financiers, en appliquant le modificateur dynamique §YPajani Patronage§!."
 nep_pajani_increase_one_step_tt:0 "§YRenforcer le patronage Pajani§!\nAugmente le contrôle noble sur la bureaucratie et les marchés du crédit.\n\n§G-1 pp§! aux taux d'imposition des sociétés et des classes supérieures\n§G-1 pp§! aux salaires et à l'efficacité de la main-d'oeuvre\n§R+1%§! aux biens de consommation et aux charges publiques"
 nep_pajani_reduce_one_step_tt:0 "§YRelâcher le patronage des Pajani§!\nLes réformes affaiblissent le clientélisme noble et renforcent l'indépendance fiscale.\n\n§G+1 pp§! aux taux d'imposition des sociétés et des classes supérieures\n§G+1 pp§! aux salaires et à l'efficacité de la main-d'oeuvre\n§R-1%§! aux biens de consommation et aux dépenses publiques"
 nep_pajani_remove_tt:0 "§YDémanteler le patronage Pajani§!\nAbolit la mainmise de la noblesse sur la bureaucratie et la finance, en supprimant toutes les variables et modificateurs liés à Pajani."

 NEP_bop_desc_rana_shah:0 "Les ministres oligarchiques de Rana et le Palais du Shah se disputent la primauté sur l'État. Les Ranas détiennent l'appareil gouvernemental grâce au favoritisme et au précédent, tandis que la monarchie manoeuvre pour récupérer l'autorité directe. Courtisans, officiers et financiers choisissent leur camp tandis que les nominations et les décrets deviennent des armes."

 NEP_bop_desc_shah_dem:0 "Une fois l'emprise des Rana relâchée, la lutte se transforme en un affrontement entre le Palais et l'opposition démocratique. La monarchie promet l'ordre et la continuité sous un vernis constitutionnel ; les réformistes font pression en faveur d'un gouvernement responsable, de tribunaux indépendants et de transparence budgétaire. Chaque concession remodèle l'équilibre."

 NEP_bop_desc_shah_cpn:0 "La Couronne du Shah affronte un mouvement communiste mobilisé. Les décrets royaux concentrent le pouvoir pour réprimer les organisations radicales, tandis que la gauche canalise les troubles autour des terres, des salaires et des privilèges des élites. La stabilité et la modernisation se heurtent aux appels à la révolution sociale et au démantèlement des structures féodales."

 NEP_bop_desc_dem_cpn:0 "Le bloc démocratique et les communistes s'affrontent pour définir l'avenir du Népal après l'autocratie. Les modérés poussent aux élections, aux libertés civiles et aux réformes progressives ; la gauche exige une mobilisation de masse, une redistribution des terres et la fin de la finance oligarchique. Les grèves, les rassemblements et les crises ministérielles donnent le tempo."

 NEP_bop_desc_rana_dem:0 "Le réseau Rana, bien établi, fait face à une opposition démocratique croissante. Le patronage et le contrôle administratif défendent l'ordre ancien, mais les réformistes organisent les enseignants, les commerçants et les officiers subalternes. Chaque ministère ouvert affaiblit les nobles privilèges et recâble le crédit, les contrats et les carrières."

 # (Optional, in case you later add it)
 NEP_bop_desc_rana_cpn:0 "L'oligarchie Rana se prépare à l'agitation communiste dans les usines et les villages. La censure et les arrestations se renforcent, mais des comités clandestins se répandent à travers les guildes et les garnisons. La question est de savoir si le clientélisme et le pouvoir policier peuvent contenir un programme de transformation sociale totale."

 # --- Convenience label (if you want to preview current pair as a line) ---
 NEP_bop_current_pair_line:0 "Concours actuel : §Y[GetNEP_BOP_LeftName]§! vs §Y[GetNEP_BOP_RightName]§!"

 NEP_shah_monarchy_tt:0 "§YLa monarchie du Shah§! représente l'autorité de la cour royale, du palais et l'influence politique exercée au nom du roi. Bien que contraint pendant une grande partie des années 1950, il reste l'une des forces centrales de la politique népalaise.\n\nInfluence actuelle : §Y[?ROOT.NEP_shah_monarchy_percent|0]%§!"
 NEP_rana_tt:0 "§YLe Rana§! représente l'ordre aristocratique bien établi qui a dominé le Népal pendant des générations par le biais de fonctions héréditaires, de patronage et de contrôle de l'État. Même en déclin, l'influence Rana reste profondément ancrée dans la structure politique du royaume.\n\nInfluence actuelle : §Y[?ROOT.NEP_rana_percent|0]%§!"
 NEP_nepali_congress_tt:0 "§YLe Congrès népalais§! représente le principal mouvement de réforme parlementaire et démocratique au Népal, prônant un gouvernement constitutionnel, la participation civile et le démantèlement du régime oligarchique. C'est le plus important challenger civil organisé de l'ordre ancien.\n\nInfluence actuelle : §Y[?ROOT.NEP_nepali_congress_percent|0]%§!"
 NEP_tanka_prasad_singh_faction_tt:0 "§YLa faction Tanka Prasad Singh§! représente les partisans, les alliés et le courant politique entourant Tanka Prasad Singh, combinant politique nationaliste, influence personnelle et manoeuvres au sein du système de transition instable du Népal.\n\nInfluence actuelle : §Y[?ROOT.NEP_tanka_prasad_singh_faction_percent|0]%§!"
 NEP_gorkha_nationalist_tt:0 "§YGorkha Nationalists§! représente des éléments nationalistes radicaux hostiles à l'influence étrangère et engagés dans une vision plus affirmée, centralisée et militante de la souveraineté népalaise. Leur force s'accroît souvent en période d'instabilité et de frustration politique.\n\nInfluence actuelle : §Y[?ROOT.NEP_gorkha_nationalist_percent|0]%§!"
 NEP_communist_party_nepal_tt:0 "§YLe Parti communiste du Népal§! représente le mouvement communiste du royaume, dont l'influence est encore limitée dans les années 1950 mais capable de s'étendre à travers les troubles, les revendications de classe et le mécontentement à l'égard de l'ordre politique existant.\n\nInfluence actuelle : §Y[?ROOT.NEP_communist_party_nepal_percent|0]%§!"

 NEP_indian_influence_tt:0 "§YL'influence indienne§! représente la pression politique, économique et stratégique exercée par l'Inde sur le Népal. Grâce à ses relations diplomatiques, à ses dépendances commerciales et à son soutien aux forces démocratiques, l'Inde cherche à maintenir le Népal dans sa sphère d'influence et à empêcher les puissances hostiles de prendre pied dans la région himalayenne."
 NEP_chinese_influence_tt:0 "§YL'influence chinoise§! représente la présence croissante et l'intérêt stratégique de la Chine au Népal. Cherchant à contrer la domination indienne et à étendre son influence régionale, la Chine soutient des forces politiques alternatives et favorise des liens plus étroits, en particulier en période d'instabilité ou de sentiment anti-indien au sein du royaume."

 NEP_indian_sphere_tt:0 "§YLa sphère d'influence indienne§! représente l'alignement du Népal sur l'ordre régional de l'Inde. Les liens politiques, économiques et stratégiques lient étroitement le royaume à New Delhi, renforçant les courants pro-indiens tout en limitant la marge d'intervention des puissances extérieures rivales."
 NEP_chinese_sphere_tt:0 "§YLa sphère d'influence chinoise§! représente l'alignement du Népal sur la présence régionale croissante de la Chine. Le soutien de Pékin renforce les tendances politiques anti-indiennes et radicales tout en attirant plus fermement le royaume dans l'orbite stratégique de la Chine."
 NEP_foreign_neutral_tt:0 "§YLa politique étrangère indépendante§! représente le Népal maintenant une position en dehors de la sphère directe de l'Inde ou de la Chine. Si cela préserve l'autonomie, cela laisse également le royaume plus exposé aux pressions diplomatiques, aux rivalités internes et aux changements soudains de l'équilibre régional."

 NEP_stability_green_tt:0 "§GÉquilibre politique stable§!\n\nLe système politique du Népal est actuellement stable, avec une faction conservant une avance claire et incontestée. Les tensions internes sont limitées et le risque de crise immédiate est faible. Même si les factions rivales restent actives, elles n'ont pas la force de remettre sérieusement en question l'équilibre des pouvoirs existant."
 NEP_stability_yellow_tt:0 "§YUn équilibre politique fragile§!\n\nLe système politique du Népal est de plus en plus tendu, avec de multiples factions qui se disputent l'influence. Aucune force à elle seule n'a pleinement consolidé son contrôle et les tensions politiques s'accentuent. Même si la situation reste gérable, une rivalité persistante ou des changements soudains d'influence pourraient déstabiliser le gouvernement."
 NEP_stability_red_tt:0 "§RCrise politique§!\n\nLe système politique du Népal est en crise, avec des factions concurrentes engagées dans une lutte pour le pouvoir. Aucune faction n'a assuré la domination, et l'instabilité menace de dégénérer en confrontation directe. Sans une action décisive, il est peu probable que l'équilibre actuel soit maintenu et un bouleversement politique majeur est imminent."

