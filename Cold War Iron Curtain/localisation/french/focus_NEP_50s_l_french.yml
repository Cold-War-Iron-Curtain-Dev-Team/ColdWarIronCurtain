 NEP_bop_communist_right:0 "Mouvement communiste"
 NEP_bop_communist_right_desc:0 "Le Parti communiste du Népal milite en faveur d'une réforme agraire radicale, d'une révolution anti-féodale et de la fin de l'influence étrangère. Bien que clandestin au début, il incarne un courant révolutionnaire croissant parmi les ouvriers et les paysans."

