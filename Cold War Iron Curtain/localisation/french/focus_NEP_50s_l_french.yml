 NEP_bop_rana_oligarchy_left:0 "Oligarchie Rana"
 NEP_bop_rana_oligarchy_left_desc:0 "La famille Rana domine le Népal grâce à son pouvoir héréditaire, son contrôle militaire et sa bureaucratie stricte. Leur autorité découle de siècles de régime autocratique, maintenu par la loyauté et l'isolement."

