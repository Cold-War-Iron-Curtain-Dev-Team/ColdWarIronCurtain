l_french:
 NEP_rana_visible_R:0 "Influence des Rana"
 NEP_rana_visible_R_desc:0 "Les Ranas maintiennent un contrôle visible sur la bureaucratie de l'État et sur l'armée, même si des fissures commencent à apparaître."
 NEP_rana_bias_R:0 "Ascendant Rana"
 NEP_rana_bias_R_desc:0 "Les ministres héréditaires affirment leur domination, freinant les réformes et maintenant les anciens privilèges."
 NEP_rana_majority_R:0 "Le régime Rana enraciné"
 NEP_rana_majority_R_desc:0 "Les Ranas contrôlent les leviers du gouvernement et de l'armée, consolidant ainsi l'autocratie."
 NEP_rana_dominance_R:0 "Hégémonie Rana"
 NEP_rana_dominance_R_desc:0 "L'oligarchie règne en maître, faisant taire toute dissidence et préservant sa dynastie par la force."

 NEP_shah_visible_R:0 "Influence royale"
 NEP_shah_visible_R_desc:0 "La monarchie joue un rôle actif dans les affaires de l'État, récupérant une certaine autorité des Ranas."
 NEP_shah_bias_R:0 "Ascendance royale"
 NEP_shah_bias_R_desc:0 "Le Palais affirme le commandement de l'armée et de la fonction publique, guidant la nation vers un contrôle monarchique."
 NEP_shah_majority_R:0 "Majorité royale"
 NEP_shah_majority_R_desc:0 "La parole du roi prévaut ; la monarchie gouverne au-dessus des factions, apportant à la fois stabilité et stagnation."
 NEP_shah_dominance_R:0 "Hégémonie royale"
 NEP_shah_dominance_R_desc:0 "La couronne du Shah reste incontestée. Toute politique découle d'un décret royal, cimentant le pouvoir absolu."

 NEP_dem_visible_R:0 "Influence de l'opposition"
 NEP_dem_visible_R_desc:0 "Les réformistes gagnent du terrain parmi les étudiants, les commerçants et les officiers de l'armée qui réclament une représentation."
 NEP_dem_bias_R:0 "Ascendant de l'opposition"
 NEP_dem_bias_R_desc:0 "Le mouvement démocratique prend de l'ampleur, faisant pression pour que la monarchie soit soumise à des limites constitutionnelles."
 NEP_dem_majority_R:0 "Majorité d'opposition"
 NEP_dem_majority_R_desc:0 "Le Congrès népalais bénéficie d'un soutien massif et commence à façonner la gouvernance vers des normes démocratiques."
 NEP_dem_dominance_R:0 "Hégémonie de l'opposition"
 NEP_dem_dominance_R_desc:0 "Les idéaux démocratiques triomphent. La monarchie est contrainte de partager le pouvoir et la politique populaire domine Katmandou."

 NEP_cpn_visible_R:0 "Influence communiste"
 NEP_cpn_visible_R_desc:0 "Les groupes de gauche gagnent en influence dans les districts ruraux et dans le prolétariat urbain, poussant une rhétorique révolutionnaire."
 NEP_cpn_bias_R:0 "Ascendant communiste"
 NEP_cpn_bias_R_desc:0 "Les communistes organisent des grèves et des campagnes de propagande, affaiblissant la confiance dans la monarchie."
 NEP_cpn_majority_R:0 "Majorité communiste"
 NEP_cpn_majority_R_desc:0 "Le Parti communiste gagne un soutien massif. Des drapeaux rouges flottent dans les campagnes alors que le conflit de classes s'intensifie."
 NEP_cpn_dominance_R:0 "Hégémonie communiste"
 NEP_cpn_dominance_R_desc:0 "Le pouvoir révolutionnaire se solidifie. La monarchie s'effondre et le Népal est au bord du régime d'une république populaire."

 NEP_Factional:0 "Politique factionnelle au Népal"
 NEP_Factional_desc:0 "Le Népal des années 1950 n'est pas défini par une direction politique unifiée, mais par un équilibre fragile entre des forces concurrentes. L'héritage de l'oligarchie Rana continue de façonner l'État, alors même que la monarchie du Shah cherche à réaffirmer son autorité. Des mouvements politiques émergents tels que le Congrès népalais et les partisans de Tanka Prasad Singh remettent en question l'ordre ancien, tandis que les éléments nationalistes et communistes gagnent en influence sous la surface. Dans le même temps, la position du Népal entre l'Inde et la Chine l'expose à des pressions extérieures qui compliquent encore davantage sa dynamique interne. La stabilité de l'État dépend du maintien d'un équilibre délicat entre ces factions, car tout changement de pouvoir risque de déclencher une crise politique plus large qui pourrait redéfinir l'avenir du royaume."

