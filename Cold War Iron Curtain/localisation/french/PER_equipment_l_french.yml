### Redone Persia/Iran Firearms
 
 PER_infantry_equipment_0:0 "SA iranienne vz. 24, modèle 49, carabine 'Brno'"
 PER_infantry_equipment_0_short:0 "Modèle iranien 49 'Brno'"
 PER_infantry_equipment_0_desc:0 "En 1929, l'Iran commanda 30 000 vz. 24 fusils chambrés en 7,92 mm, tous issus des stocks de l'armée tchécoslovaque. Une nouvelle commande de 240 000 fusils fut passée en 1930, mais il s'agissait de la variante vz.98/29 avec un canon plus long ; une autre commande de 30 000 vz. Des fusils \"mousqueton\" 98/29 ont été placés en même temps. Les fusils, appelés « Brnos » ou « Bernos », du nom de leur ville de fabrication, se sont révélés très prisés par les différents groupes tribaux iraniens, qui se rebellaient fréquemment contre le gouvernement du Shah."

 PER_infantry_equipment_1:0 "Modèle iranien, carabine américaine, calibre.30, M2"
 PER_infantry_equipment_1_short:0 "Carabine M2 (I)"
 PER_infantry_equipment_1_desc:0 "Copie fabriquée par l'Iran de la carabine M2 pour les forces armées impériales iraniennes au début de la guerre froide dans le cadre de l'assistance militaire des États-Unis au Shah d'Iran. Les M1 Garand ont également été fournis en grande quantité aux forces armées iraniennes et serviront jusqu'à la révolution iranienne et la lutte ultérieure contre l'Irak pendant la guerre Iran-Irak."

 PER_infantry_equipment_2:0 "Heckler & Koch G3"
 PER_infantry_equipment_2_short:0 "Heckler & Koch G3"
 PER_infantry_equipment_2_desc:0 "Modèle original basé sur le CETME Model 58 introduit en 1959 et approuvé en 1960. Il avait une crosse et un garde-main en bois."

 PER_infantry_equipment_3:0 "Heckler & Koch G3A6"
 PER_infantry_equipment_3_short:0 "Heckler & Koch G3A6"
 PER_infantry_equipment_3_desc:0 " La version de 1963 la plus connue. Des viseurs à tambour avec un guidon amélioré, un suppresseur de flash/frein de bouche capable de tirer des grenades aux normes OTAN, une crosse fixe en plastique solide et un protège-main en plastique qui n'entre pas en contact avec le canon flottant. Le protège-main était disponible en version fine et ventilée et en version large. Ce dernier permet la fixation d'un bipied."

 PER_infantry_equipment_4:0 "Organisation des industries de défense KH-2002 Khaybar"
 PER_infantry_equipment_4_short:0 "KH-2002 Khaybar"
 PER_infantry_equipment_4_desc:0 "le KH-2002 Khaybar est un fusil d'assaut de conception iranienne, dérivé du fusil d'assaut DIO S 5.56 (un clone sans licence du Norinco CQ chinois, qui à son tour est une copie sans licence du M16 américain) et développé par l'Organisation des industries de défense iranienne (DIO)."

 ########## REDONE PER ARMOR

 PER_lt_equipment_1:0 "CKD TNHP"
 PER_lt_equipment_1_short:0 "TNHP"
 PER_lt_equipment_1_desc:0 "Le premier client de la série fut l'Iran, qui reçut 60 TNHP de 1935 à 1937. Ceux-ci étaient équipés d'un canon Skoda A4 de 37 mm (1,46 in) de 60 coups et de deux mitrailleuses vz.35 de 3000 coups, une coaxiale et une dans la coque."
 PER_lt_equipment_2:0 "Lévrier M8"
 PER_lt_equipment_2_short:0 "Lévrier M8"
 PER_lt_equipment_3:0 "M24A1 Chaffee"
 PER_lt_equipment_3_short:0 "M24A1 Chaffee"
 PER_lt_equipment_3_desc:0 "Le M24A1 Chaffee est un char léger développé par le Département des munitions de l'armée américaine en 1944, vers la fin de la Seconde Guerre mondiale, le Boogaloo électrique. Le M24 possède un blindage de 38 mm et un canon principal de 75 mm. Le moteur est un V8 Twin Cadillac avec une transmission Hydramatic qui peut se déplacer à peu près de la même manière que le M5 Stuart. Au combat, le petit canon du M5 Stuart s'est avéré être une lacune importante, notamment lors de la campagne d'Afrique du Nord. C'est peu de temps après que le M24 Chaffee fut développé dans le but de lui donner plus de puissance de feu pour mieux remplir son rôle."
 PER_lt_equipment_4:0 "M113 C&R Lynx"
 PER_lt_equipment_4_short:0 "M113 C&R Lynx"
 PER_lt_equipment_5:0 "Alvis FV101 Scorpion"
 PER_lt_equipment_5_short:0 "FV101 Scorpion"
 PER_lt_equipment_6:0 "Alvis FV101 Tosan"
 PER_lt_equipment_6_short:0 "Tosan"

 PER_mbt_equipment_0:0 "M4 Sherman"
 PER_mbt_equipment_0_short:0 "M4 Sherman"
 PER_mbt_equipment_1:0 "M4A1(76)W HVSS Sherman"
 PER_mbt_equipment_1_short:0 "M4A1(76)W HVSS Sherman"
 PER_mbt_equipment_1_desc:0 "L'Iran a reçu un nombre indéterminé de Sherman armés de canons de 76 mm (ceux équipés du système de suspension de type HVSS) des États-Unis (l'un de ses alliés les plus importants pendant la guerre froide jusqu'en 1979) au cours des années 1950 et au moins certains ont été utilisés au combat à partir de 1980, lorsqu'il a connu une action militaire contre des chars irakiens beaucoup plus modernes."
 #PER_mbt_equipment_2:0 ""
 #PER_mbt_equipment_2_short:0 ""
 PER_mbt_equipment_3:0 "Char de combat, entièrement chenillé, canon de 90 mm, M47"
 PER_mbt_equipment_3_short:0 "M47 Patton"
 PER_mbt_equipment_3_desc:0 "Le M47 Patton est l'un des premiers chars de combat principaux et a été conçu par le département des munitions de l'armée américaine en 1951. Il est très similaire au M46 Patton mais avec une tourelle de canon mise à jour avec un mécanisme interne amélioré et une transmission améliorée. Il a connu des combats lors de la crise de Suez, de la guerre des 6 jours et des guerres yougoslaves."
 PER_mbt_equipment_4:0 "Char de combat à chenilles complète : canon de 90 mm, M48"
 PER_mbt_equipment_4_short:0 "M48 Patton"
 PER_mbt_equipment_4_desc:0 "Le M48 Patton est un CCP conçu par le Département des munitions de l'armée américaine en 1953. Le M48 est doté d'un blindage de 110 mm et d'un canon principal amélioré de 90 mm. Le moteur est une variante optimisée du V12 utilisé dans les chars Patton précédents avec un système d'injection de carburant léger et est suralimenté. Il a une autonomie de fonctionnement hors route de 160 milles et de 300 milles sur route. Il peut rouler sur route à 30 mph, mais atteint 20 mph hors route grâce au moteur, à la transmission et aux chenilles améliorés. Il a servi de char principal pendant la guerre du Vietnam et était couramment utilisé par les alliés des États-Unis pendant la guerre froide. Il ressemble au M47 Patton mais il s'agit d'un tout nouveau design avec de nouveaux mécanismes internes. Il est utilisé par l'armée américaine et les Marines avant d'être finalement remplacé par le M60, bien que de nombreuses unités de la Garde nationale exploitaient et entretenaient encore des M48 jusqu'à la fin des années 80."
 PER_mbt_equipment_5:0 "M60A1"
 PER_mbt_equipment_5_short:0 "M60A1"
 PER_mbt_equipment_6:0 "FV4201 Chef Mk.3P"
 PER_mbt_equipment_6_short:0 "Chef Mk.3P"
 PER_mbt_equipment_7:0 "FV4030/1 Chieftain Mk. 5/3 (P) « Perse »"
 PER_mbt_equipment_7_short:0 "Chef Mk. 5/3 (P)"
 PER_mbt_equipment_8:0 "SKDIC Zulfiqar-1"
 PER_mbt_equipment_8_short:0 "Zulfiqar-1"
 PER_mbt_equipment_8_desc:0 "Le Zulfiqar est un char de combat principal iranien, conçu par le général de brigade Mir-Younes Masoumzadeh, commandant adjoint des forces terrestres pour la recherche et l'autosuffisance des forces armées."
 PER_mbt_equipment_9:0 "SKDIC Zulfiqar-3"
 PER_mbt_equipment_9_short:0 "Zulfiqar-3"
 PER_mbt_equipment_9_desc:0 "Le Zulfiqar-3 est un prototype provisoire de char de combat principal utilisé comme banc d'essai. Cette variante est équipée d'un nouveau moteur plus puissant. Il dispose d'un châssis étendu et utilise éventuellement un chargeur automatique amélioré."

