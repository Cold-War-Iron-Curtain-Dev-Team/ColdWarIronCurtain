 PER_attack_helicopter_equipment_3:0 "Bell AH-1J International"
 PER_attack_helicopter_equipment_3_short:0 "AH-1J International"
 PER_attack_helicopter_equipment_3_desc:0 "En 1971, l'Iran a acheté des exemplaires d'un AH-1J amélioré, nommé « AH-1J International », aux États-Unis. Cette Cobra améliorée était équipée d'un moteur P&WC T400-WV-402 amélioré et d'une transmission plus puissante. Un équipement d'amortissement du recul a été installé sur la tourelle du canon M-197 de 20 mm, et le tireur a reçu un viseur stabilisé et même un siège stabilisé. Parmi les AH-1J livrés à l'aviation de l'armée impériale iranienne du Shah, 62 étaient capables de TOW."
 PER_attack_helicopter_equipment_4:0 "Bell AH-1J(IM) International"
 PER_attack_helicopter_equipment_4_short:0 "AH-1J(IM)International"
 PER_attack_helicopter_equipment_4_desc:0 "En 1971, l'Iran a acheté des exemplaires d'un AH-1J amélioré, nommé « AH-1J International », aux États-Unis. Cette Cobra améliorée était équipée d'un moteur P&WC T400-WV-402 amélioré et d'une transmission plus puissante. Un équipement d'amortissement du recul a été installé sur la tourelle du canon M-197 de 20 mm, et le tireur a reçu un viseur stabilisé et même un siège stabilisé. Parmi les AH-1J livrés à l'aviation de l'armée impériale iranienne du Shah, 62 étaient capables de TOW."
 PER_attack_helicopter_equipment_5:0 "Panha 2091 Toufan"
 PER_attack_helicopter_equipment_5_short:0 "2091 Touffan"
 PER_attack_helicopter_equipment_5_desc:0 "Le Panha 2091 \"Toufan\" est une révision et une mise à niveau iranienne de l'hélicoptère d'attaque Bell AH-1J International (version export du SeaCobra) acheté avant la Révolution islamique de 1979. Le programme de révision et de mise à niveau est connu sous le nom de projet numéro 2091 de la société iranienne de soutien et de renouvellement des hélicoptères (également connue sous le nom de Panha)."

 PER_naval_helicopter_equipment_3:0 "Kaman HH-43 Huskie"
 PER_naval_helicopter_equipment_3_short:0 "HH-43 Husky"
 PER_naval_helicopter_equipment_3_desc:0 "Le Kaman HH-43 Huskie était un hélicoptère à rotors engrenés utilisé par l'armée de l'air américaine, la marine américaine et le corps des Marines des États-Unis des années 1950 aux années 1970."
 PER_naval_helicopter_equipment_4:0 "Agusta Westland SH-3D Sea King"
 PER_naval_helicopter_equipment_4_short:0 "Roi des Mers SH-3D"
 PER_naval_helicopter_equipment_5:0 "Agusta Westland SH-3D(IM) Sea King"
 PER_naval_helicopter_equipment_5_short:0 "SH-3D(IM) Sea King"

 PER_cargo_helicopter_equipment_2:0 "Boeing-Meridionali CH-47C Chinook"
 PER_cargo_helicopter_equipment_2_short:0 "CH-47C Chinook"
 PER_cargo_helicopter_equipment_2_desc:0 "Le CH-47 (à l'origine HC-1B) est un hélicoptère bimoteur à rotor tandem qui compte parmi les hélicoptères de transport les plus lourds de l'Ouest. Remplaçant le CH-37 Mojave, le CH-47 possède plusieurs moyens de chargement de diverses marchandises, notamment plusieurs portes à travers le fuselage, une large rampe de chargement située à l'arrière du fuselage et un total de trois crochets de chargement ventraux externes pour transporter des charges suspendues. C'était également l'hélicoptère le plus rapide parmi ses contemporains lors de son introduction en 1962, et il est toujours considéré actuellement comme l'un des hélicoptères les plus rapides de l'arsenal de l'armée américaine. Son nom, « Chinook », vient du peuple amérindien Chinook de l'État de Washington actuel."
 PER_cargo_helicopter_equipment_3:0 "Boeing-Meridionali CH-47C(IM) Chinook"
 PER_cargo_helicopter_equipment_3_short:0 "CH-47C(IM) Chinook"
 PER_cargo_helicopter_equipment_3_desc:0 "Le CH-47 (à l'origine HC-1B) est un hélicoptère bimoteur à rotor tandem qui compte parmi les hélicoptères de transport les plus lourds de l'Ouest. Remplaçant le CH-37 Mojave, le CH-47 possède plusieurs moyens de chargement de diverses marchandises, notamment plusieurs portes à travers le fuselage, une large rampe de chargement située à l'arrière du fuselage et un total de trois crochets de chargement ventraux externes pour transporter des charges suspendues. C'était également l'hélicoptère le plus rapide parmi ses contemporains lors de son introduction en 1962, et il est toujours considéré actuellement comme l'un des hélicoptères les plus rapides de l'arsenal de l'armée américaine. Son nom, « Chinook », vient du peuple amérindien Chinook de l'État de Washington actuel."


