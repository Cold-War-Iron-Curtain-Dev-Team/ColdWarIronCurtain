 PER_nav_bomber_equipment_8_desc:0 "L'IrAn-140 est une version sous licence de l'An-140, assemblée par HESA à Shahin Shahr, en Iran, à partir de kits démontables complets fournis par Antonov. En 2008, il était prévu de construire 13 avions par an. Il était prévu de produire des versions patrouille maritime (IrAn-140MP) et cargo (IrAn-140T). Il était prévu de construire 100 avions au total ; 20 d'entre eux devaient être acquis par le gouvernement iranien pour la patrouille et la surveillance des frontières."

 #Iranian Army Aviation

 PER_utility_helicopter_equipment_3:0 "Cloche 205"
 PER_utility_helicopter_equipment_3_short:0 "Cloche 205"
 PER_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."
 PER_utility_helicopter_equipment_4:0 "Bell 214A Ispahan"
 PER_utility_helicopter_equipment_4_short:0 "Bell 214A Ispahan"
 PER_utility_helicopter_equipment_4_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."
