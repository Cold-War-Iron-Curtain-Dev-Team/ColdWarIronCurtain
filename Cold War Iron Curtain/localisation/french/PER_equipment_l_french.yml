 PER_artillery_equipment_4:0 "Obusier Fälthaubits 77 de 155 mm"
 PER_artillery_equipment_4_short:0 "Obusier FH-77 de 155 mm"
 PER_artillery_equipment_4_desc:0 "Le Fälthaubits 77 (« Field Howitzer 77 » suédois) ou FH77 est un obusier suédois de 155 mm. Il a été développé et fabriqué par Bofors. Il était disponible en deux versions, l'original (parfois appelé Haubits 77 A) avec un canon de calibre 38 et un mécanisme à bloc coulissant, et la dernière version d'exportation FH77 B avec un canon de calibre 39 et une culasse à vis interrompue. "
 PER_artillery_equipment_5:0 "Obusier DIO HM-41 de 155 mm"
 PER_artillery_equipment_5_short:0 "Obusier HM-41 de 155 mm"
 PER_artillery_equipment_5_desc:0 "Le HM-41 est un obusier iranien qui serait basé sur le M114 américain. En apparence, il ressemble beaucoup au KH179 sud-coréen. Il dispose d'un canon de calibre 155 mm/39 avec un frein de bouche pour réduire le recul."

