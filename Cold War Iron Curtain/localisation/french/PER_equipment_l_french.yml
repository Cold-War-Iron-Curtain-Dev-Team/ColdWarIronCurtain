 PER_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 PER_jet_light_equipment_1_short:0 "Étoile filante T-33"
 PER_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 PER_jet_light_equipment_2:0 "Reims Cessna FTB-337G Skymaster"
 PER_jet_light_equipment_2_short:0 "FTB-337G Skymaster"
 PER_jet_light_equipment_3:0 "Chasseur de la liberté Northrop F-5A"
 PER_jet_light_equipment_3_short:0 "Chasseur de la liberté F-5A"
 PER_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de combat léger destiné principalement à l'exportation. Il est plus léger et moins cher à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour remplacer les escadrons de chasseurs à courte portée. Malgré cela, ce type s'est avéré assez agile et était l'avion le plus proche pour rivaliser avec le MiG-21 « Fishbed » soviétique. Parce qu'il a été utilisé par la majorité des alliés de l'Amérique au plus fort de la guerre froide, il a été appelé à juste titre « Freedom Fighter »."
 PER_jet_light_equipment_4:0 "Chasseur de la liberté Northrop F-5B"
 PER_jet_light_equipment_4_short:0 "Chasseur de la liberté F-5B"
 PER_jet_light_equipment_4_desc:0 "L'avion américain Northrop F-5B Freedom Fighter utilisé par la Royal Norwegian Airforco. Principalement utilisé comme entraîneur d'introduction pour d'autres avions à réaction multirôles, il disposait de points d'attache pour les ordonnances."

