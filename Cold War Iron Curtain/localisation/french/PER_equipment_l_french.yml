#Redone Iran/Persia Air Force
 PER_fighter_equipment_0:0 "Force aérienne iranienne"
 PER_fighter_equipment_0_short:0 "Force aérienne iranienne"
 PER_fighter_equipment_0_desc:0 "L'armée de l'air de la République islamique d'Iran (IRIAF Nirvi-ye Hevayi-ye Artesh-e Jimhuri-ye Eslâmi-ye Iran) est la branche aéronautique de l'armée de la République islamique d'Iran. L'armée de l'air actuelle a vu le jour lorsque l'armée de l'air impériale iranienne a été rebaptisée en 1979. C'est l'une des rares forces aériennes du Moyen-Orient, ayant l'expérience d'une guerre conventionnelle, ayant combattu la guerre Iran-Irak. Elle a mené des opérations majeures comme l'opération Kaman 99, l'opération Sultan 10, la frappe aérienne H-3 et la première attaque contre un réacteur nucléaire de l'histoire, lors de l'opération Scorch Sword. Suite à une guerre aérienne brutale et intense sans escale pendant 8 ans, l'IRIAF possède le plus grand nombre d'as de chasse dans la région (en dehors de l'IAF), avec jusqu'à 7 personnes avec plus de 6 tués. La plupart de ces as ont atteint leur statut en pilotant le jet F-14 Tomcat. Forte de son expérience dans ce conflit, l'IRIAF a développé de véritables tactiques éprouvées au combat et un cadre de pilotes compétents. Beaucoup d'entre eux, vétérans de la guerre de 8 ans et aujourd'hui généraux supérieurs, constituent aujourd'hui le noyau du commandement de l'IRIAF."

 PER_fighter_equipment_1:0 "Hawker Hurricane Mk.I"
 PER_fighter_equipment_1_short:0 "Ouragan Mk.I"
 PER_fighter_equipment_2:0 "Curtiss H-75A-9"
 PER_fighter_equipment_2_short:0 "Curtiss H-75A-9"
 PER_fighter_equipment_3:0 "République P-47D-30 Thunderbolt"
 PER_fighter_equipment_3_short:0 "P-47D-30 Coup de tonnerre"

 PER_jet_multirole_equipment_1:0 "République F-47D-30-RA Thunderbolt"
 PER_jet_multirole_equipment_1_short:0 "F-47D-30-RA Coup de tonnerre"
 PER_jet_multirole_equipment_2:0 "Canadair CL-13 Sabre Mark 5"
 PER_jet_multirole_equipment_2_short:0 "Sabre Mk.5"
 PER_jet_multirole_equipment_2_desc:0 " le premier Sabre Mk.5 a volé avec le moteur Orenda 10, ce qui lui a donné un net avantage en termes de taux de montée et de plafond par rapport aux variantes précédentes. D'autres améliorations du Mk 5 comprenaient un nouveau système d'oxygène et une maniabilité améliorée et des caractéristiques à basse vitesse obtenues en augmentant la corde de l'aile de six pouces (15,2 cm) à l'emplanture et de trois pouces (7,2 cm) au bout de l'aile ainsi qu'en installant une petite clôture d'aile verticale."
 PER_jet_multirole_equipment_3:0 "Sabre nord-américain F-86F"
 PER_jet_multirole_equipment_3_short:0 "Sabre F-86F"
 PER_jet_multirole_equipment_3_desc:0 "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un contrôle à pleine puissance avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche qui étaient encore conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur.) Les Sabre F avaient une agilité à grande vitesse bien améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 PER_jet_multirole_equipment_4:0 "Canadair CL-13 Sabre Mark 6s "
 PER_jet_multirole_equipment_4_short:0 "Sabre Mk.6"
 PER_jet_multirole_equipment_4_desc:0 "Le Canadair Sabre Mk.6s, abréviation de sidewinder équipé, est une mise à niveau de la variante finale et a été considéré comme le « meilleur » Sabre de production jamais construit. Avec points d'attache de montage pour les AIM-9B Sidewinders."
 #PER_jet_multirole_equipment_5:0 ""
 #PER_jet_multirole_equipment_5_short:0 ""
 #PER_jet_multirole_equipment_5_desc:0 "Canadair Sabre GFX"
 PER_jet_multirole_equipment_6:0 "McDonnell Douglas F-4D Phantom II"
 PER_jet_multirole_equipment_6_short:0 "F-4D Fantôme II"
 PER_jet_multirole_equipment_6_desc:0 "F-4C avec avionique mise à jour et radar AN/APQ-109."
 PER_jet_multirole_equipment_7:0 "McDonnell Douglas F-4E Phantom II"
 PER_jet_multirole_equipment_7_short:0 "F-4E Fantôme II"
 PER_jet_multirole_equipment_7_desc:0 "Version USAF avec un canon M61 Vulcan intégré dans le nez allongé du RF-4C, un radar AN/APQ-120 avec une section plus petite pour accueillir le canon, des moteurs J79-GE-17 avec 17 900 lbf (79,379 kN) de poussée de postcombustion chacun. Avions de dernière série équipés de lattes de pointe pour améliorer la maniabilité au détriment de la vitesse de pointe dans le cadre du programme Agile Eagle. À partir du bloc 53, les avions ont ajouté la capacité AGM-65 Maverick et les moteurs sans fumée J79-GE-17C ou -17E. Premier vol le 1er août 1965. La variante Phantom la plus nombreuse ; 1 370 construits."
 PER_jet_multirole_equipment_8:0 "Northrop F-5E Tigre II"
 PER_jet_multirole_equipment_8_short:0 "F-5E Tigre II"
 #PER_jet_multirole_equipment_8:0 "General Dynamics F-16A Fighting Falcon"
 #PER_jet_multirole_equipment_8_short:0 "F-16A Fighting Falcon"
 #PER_jet_multirole_equipment_8_desc:0 "A tractable, lightweight fighter with well-balanced maneuverability and stability. It has an exceptionally lightweight and aerodynamic blended wing body, and though a single-engine plane, it is equipped with a powerful engine. Called the 'Fighting Falcon', its relatively low cost and high power are the reason it has been adapted by air forces all over the world. To date, more than 4,000 of this best-selling model have been manufactured."
 PER_jet_multirole_equipment_9:0 "Garde aérienne Chengdu F-7N"
 PER_jet_multirole_equipment_9_short:0 "Garde aérienne F-7N"
 PER_jet_multirole_equipment_10_desc:0 "Version de production en série de la série avec Peng Renying comme concepteur général. Grâce à une avionique occidentale plus légère, 130 kg supplémentaires sont ajoutés dans le fuselage avant pour compenser le changement de centre de gravité, lorsqu'il a été décidé de ne pas utiliser de matériau composite. La durée de vie des sous-systèmes embarqués a atteint 75 % de celle du soviétique."
 PER_jet_multirole_equipment_10:0 "HESA Azarakhsh"
 PER_jet_multirole_equipment_10_short:0 "Azarakhch"

 #PER_mr_stealth_fighter_equipment_1:0 "IAIO Qaher-313"
 #PER_mr_stealth_fighter_equipment_1_short:0 "Qaher-313"

 PER_cv_jet_multirole_equipment_8:0 "Grumman F-14A Tomcat"
 PER_cv_jet_multirole_equipment_8_short:0 "F-14A Tomcat"
 PER_cv_jet_multirole_equipment_8_desc:0 "Le seul client étranger du Tomcat était l'armée de l'air impériale iranienne, sous le règne du dernier Shah d'Iran, Mohammad Reza Pahlavi. Au début des années 1970, l'armée de l'air impériale iranienne (IIAF) recherchait un chasseur avancé, en particulier capable d'intercepter les vols de reconnaissance soviétiques MiG-25. Après une visite du président américain Richard Nixon en Iran en 1972, au cours de laquelle l'Iran s'est vu offrir les dernières technologies militaires américaines, l'IIAF a sélectionné et lancé l'acquisition du F-14 Tomcat."
 PER_cv_jet_multirole_equipment_9:0 "Modification indigène du Grumman F-14A(IM) Tomcat"
 PER_cv_jet_multirole_equipment_9_short:0 "F-14A(IM) Tomcat"
 PER_cv_jet_multirole_equipment_9_desc:0 "Pendant la guerre Iran/Irak, l'approvisionnement iranien en missiles Phoenix AIM-54 s'est rapidement épuisé. Certains des premiers et des plus nouveaux efforts pour surmonter ce problème ont eu lieu pendant la brutale guerre Iran-Irak, notamment la combinaison d'éléments du missile sol-air MIM-23 Hawk et de la bombe de classe M117 de 750 livres pour créer une arme air-sol appelée Yasser pour les F-14A Tomcats de l'armée de l'air iranienne afin de conserver leur capacité anti-aérienne à longue portée. En raison de la taille des missiles, le Tomcat ne pouvait en transporter que deux à la fois. Cette modification ne changerait rien à l'avionique et n'est donc pas connue comme une mise à niveau majeure ou une variante de bloc mais comme une modification locale."
 #PER_cv_jet_multirole_equipment_10:0 ""
 #PER_cv_jet_multirole_equipment_10_short:0 ""
