l_french:
 #Korean War Events
 Korean_War_Ceasefire_show:0 "Quelques jours avant l'imposition d'un cessez-le-feu par l'ONU"
 korea.1.t:0 "La guerre de Corée"
 korea.1.d:0 "L'État capitaliste bandit de la « République de Corée » doit être dissous et les terres sous son contrôle doivent être restituées aux autorités compétentes. Avec le soutien et l'approbation de l'Union soviétique et de la Chine, nous pouvons désormais commencer à restaurer le contrôle de nos terres du sud."
 korea.1.o.a:0 "Donne l'ordre d'envahir"
 korea.1.o.b:0 "Reposez-vous pour l'instant"
 korea.2.t:0 "[GetNewspaperHeader]Guerre de Corée"
 korea.2.d:0 "Suite à la division de la Corée et à l'échec des efforts de réunification diplomatique, les forces communistes de la République populaire démocratique de Corée ont lancé une attaque surprise contre la République pro-capitaliste de Corée. L'attaque nord-coréenne a commencé par le bombardement des bases aériennes américano-américaines à Gimpo, causant d'importants dégâts aux infrastructures locales et aux habitants. Le gouvernement de la République de Corée a déclaré l'état d'urgence et demande l'aide des États-Unis d'Amérique et des Nations Unies. Les experts occidentaux supposent que l'Union soviétique a aidé le régime de Pyongyang dans ses efforts de préparation à l'invasion et qu'elle continue secrètement à approvisionner les forces nord-coréennes. Reste à savoir qui sortira vainqueur de cette lutte tant que le conflit ne s'intensifiera pas davantage."
 korea.2.o.a:0 "Nous venons de vivre une guerre mondiale."
 korea.2.o.b:0 "Tout se passe comme prévu"
 korea.2.o.c:0 "Nous ferions mieux d'obtenir l'aide des États-Unis"
 korea.2.o.d:0 "Il faut les aider"
 korea.31.t:0 "Sauver la République de Corée"
 korea.3.t:0 "Aide à la République de Corée"
 korea.3.d:0 "Aider la République de Corée contre l'agression communiste est nécessaire pour garantir la sécurité du Japon. Nous devrions donc envoyer nos forces militaires là-bas pour les aider."
 korea.3.o.a:0 "Envoyons nos troupes là-bas"
 korea.3.o.b:0 "Nous restons en dehors de ça"
 korea.4.t:0 "[GetNewspaperHeader]Les États-Unis entrent dans le conflit coréen"
 korea.4.d:0 "Les États-Unis sont entrés dans le conflit coréen aux côtés de la République de Corée contre la République populaire démocratique et communiste de Corée."
 korea.4.o.a:0 "Cela va juste dégénérer, n'est-ce pas"
 korea.4.o.b:0 "C'était prévu"
 korea.4.o.c:0 "Bien, nous en avons vraiment besoin"
 korea.4.o.d:0 "C'est la bonne chose"
 north_korean_faction:0 "Corée du Nord"
 korea.5.t:0 "Aide la Corée du Nord"
 korea.5.d1:0 "En aidant la Corée du Nord contre les Américains et leur État bandit, la « République de Corée » est nécessaire pour assurer la sécurité de la Chine et du communisme en Asie. Nous devrions donc envoyer nos forces militaires là-bas pour les aider."
 korea.5.d2:0 "Aider la Corée du Nord contre l'État bandit de la « République de Corée » est nécessaire pour garantir la sécurité du communisme en Asie. Nous devrions donc envoyer nos forces militaires là-bas pour les aider."
 korea.6.t:0 "[GetNewspaperHeader]La Chine communiste entre dans le conflit coréen"
 korea.6.d:0 "La Chine communiste est entrée dans le conflit coréen aux côtés de la République populaire démocratique de Corée contre la République capitaliste de Corée."
 korea.6.o.a:0 "Qu'est-ce que j'ai dit, j'avais raison"
 korea.6.o.b:0 "Cela transformera la guerre en faveur des communistes"
 korea.6.o.c:0 "Bonne nouvelle"
 korea.6.o.d:0 "Bon sang"
 korea.6.o.e:0 "Un digne adversaire"
 korea.7.t:0 "L'État bandit vaincu"
 korea.7.d:0 "Aujourd'hui, nos forces militaires ont vaincu la « République de Corée » capitaliste et nous avons désormais rétabli le contrôle de nos terres du sud."
 korea.7.o.a:0 "Une victoire pour le communisme !"
 korea.8.t:0 "[GetNewspaperHeader]L'effondrement de la République de Corée"
 korea.8.d1:0 "La République de Corée s'est officiellement rendue hier, ce qui constitue un coup catastrophique pour les Nations Unies et une victoire historique pour le bloc communiste. La péninsule coréenne toute entière est désormais sous le contrôle du Nord.\n\nL'effondrement final s'est produit après qu'une offensive massive nord-coréenne ait brisé les lignes défensives de l'ONU autour de la ville portuaire de Pusan. Ce qui a suivi a été une déroute totale, conduisant à une évacuation désespérée et chaotique des troupes et du personnel restants de l'ONU. La radio de Pyongyang a annoncé la reddition hier soir, affirmant que le président Syngman Rhee avait fui la péninsule malgré tous les obstacles.\n\nLa nouvelle a été accueillie par un silence stupéfiant à Washington et a plongé l'ONU dans une crise de légitimité. À l'opposé, les pays du bloc de l'Est diffusent des célébrations triomphales de leur victoire sur les « impérialistes américains »."
 korea.8.d2:0 "La République de Corée s'est officiellement rendue hier, ce qui constitue un coup catastrophique pour les Nations Unies et une victoire historique pour le bloc communiste. La péninsule coréenne toute entière est désormais sous le contrôle du Nord.\n\nL'effondrement final s'est produit après qu'une offensive massive nord-coréenne ait brisé les lignes défensives de l'ONU autour de la ville portuaire de Pusan. Ce qui a suivi a été une déroute totale, conduisant à une évacuation désespérée et chaotique des troupes et du personnel restants de l'ONU. La radio de Pyongyang a annoncé la reddition hier soir, affirmant que le président Syngman Rhee avait fui la péninsule malgré tous les obstacles.\n\nLa nouvelle a été accueillie par un silence stupéfiant à Washington et a plongé l'ONU dans une crise de légitimité. À l'opposé, les pays du bloc de l'Est diffusent des célébrations triomphales de leur victoire sur les « impérialistes américains »."
 korea.8.d3:0 "La République de Corée s'est officiellement rendue hier, ce qui constitue un coup catastrophique pour les Nations Unies et une victoire historique pour le bloc communiste. La péninsule coréenne toute entière est désormais sous le contrôle du Nord.\n\nL'effondrement final s'est produit après qu'une offensive massive nord-coréenne ait brisé les lignes défensives de l'ONU autour de la ville portuaire de Pusan. Ce qui a suivi a été une déroute totale, conduisant à une évacuation désespérée et chaotique des troupes et du personnel restants de l'ONU. La radio de Pyongyang a annoncé la reddition hier soir, affirmant que le président Syngman Rhee avait fui la péninsule malgré tous les obstacles.\n\nLa nouvelle a été accueillie par un silence stupéfiant à Washington et a plongé l'ONU dans une crise de légitimité. À l'opposé, les pays du bloc de l'Est diffusent des célébrations triomphales de leur victoire sur les « impérialistes américains »."
 korea.8.o.b:0 "C'est malheureux."
 korea.8.o.c:0 "Comment pourrions-nous laisser cela se produire."
 korea.8.o.d:0 "Mission accomplie."
 korea.9.t:0 "Nous avons été brisés"
 korea.9.d:0 "Nous avons perdu trop de terres pour continuer raisonnablement le combat, nous devrions nous rendre."
 korea.9.o.a:0 "Signez la reddition"
 korea.9.o.b:0 "Traîtres ! Nous n'abandonnerons jamais !"
 korea.11.t:0 "Les rebelles communistes vaincus"
 korea.11.d:0 "Aujourd'hui, nos forces militaires ont vaincu les rebelles communistes qui ont proclamé un soi-disant « État ». Nous avons désormais rétabli le contrôle de nos terres du nord."
 korea.11.o.a:0 "Une victoire pour la Corée anticommuniste !"
 korea.12.t:0 "[GetNewspaperHeader]L'effondrement de la Corée du Nord"
 korea.12.d1:0 "La péninsule coréenne est à nouveau entière. Dans une conclusion étonnante et rapide au conflit, les restes de l'armée nord-coréenne se sont rendus hier face à l'avancée des forces des Nations Unies et de la République de Corée. La capitulation marque une victoire totale pour le monde libre et la conclusion réussie du premier grand test d'armes de l'ONU.\n\nL'effondrement final du Nord a suivi le brillant débarquement amphibie d'Incheon et la libération ultérieure de Séoul. Les forces de l'ONU, sous le commandement du général Douglas MacArthur, ont lancé une offensive éclair vers le nord, capturant la capitale Pyongyang il y a quelques semaines et poursuivant sans relâche l'Armée populaire coréenne brisée. La guerre a effectivement pris fin après la capture des principaux responsables du gouvernement de la RPDC, même si le Premier ministre Kim Il Sung était introuvable.\n\nLa liesse a éclaté à Séoul, à Washington et au siège de l'ONU à New York. Le président Syngman Rhee a annoncé son intention d'organiser des élections nationales pour unifier le pays sous un gouvernement démocratique. À l'opposé, les émissions de radio du bloc de l'Est sont restées silencieuses après des semaines de dénonciations furieuses de l'avancée de l'ONU."
 korea.12.d2:0 "La péninsule coréenne est à nouveau entière. Dans une conclusion étonnante et rapide au conflit, les restes de l'armée nord-coréenne se sont rendus hier face à l'avancée des forces des Nations Unies et de la République de Corée. La capitulation marque une victoire totale pour le monde libre et la conclusion réussie du premier grand test d'armes de l'ONU.\n\nL'effondrement final du Nord a suivi le brillant débarquement amphibie d'Incheon et la libération ultérieure de Séoul. Les forces de l'ONU, sous le commandement du général Douglas MacArthur, ont lancé une offensive éclair vers le nord, capturant la capitale Pyongyang il y a quelques semaines et poursuivant sans relâche l'Armée populaire coréenne brisée. La guerre a effectivement pris fin après la capture des principaux responsables du gouvernement de la RPDC, même si le Premier ministre Kim Il Sung était introuvable.\n\nLa liesse a éclaté à Séoul, à Washington et au siège de l'ONU à New York. Le président Syngman Rhee a annoncé son intention d'organiser des élections nationales pour unifier le pays sous un gouvernement démocratique. À l'opposé, les émissions de radio du bloc de l'Est sont restées silencieuses après des semaines de dénonciations furieuses de l'avancée de l'ONU."
 korea.12.d3:0 "La péninsule coréenne est à nouveau entière. Dans une conclusion étonnante et rapide au conflit, les restes de l'armée nord-coréenne se sont rendus hier face à l'avancée des forces des Nations Unies et de la République de Corée. La capitulation marque une victoire totale pour le monde libre et la conclusion réussie du premier grand test d'armes de l'ONU.\n\nL'effondrement final du Nord a suivi le brillant débarquement amphibie d'Incheon et la libération ultérieure de Séoul. Les forces de l'ONU, sous le commandement du général Douglas MacArthur, ont lancé une offensive éclair vers le nord, capturant la capitale Pyongyang il y a quelques semaines et poursuivant sans relâche l'Armée populaire coréenne brisée. La guerre a effectivement pris fin après la capture des principaux responsables du gouvernement de la RPDC, même si le Premier ministre Kim Il Sung était introuvable.\n\nLa liesse a éclaté à Séoul, à Washington et au siège de l'ONU à New York. Le président Syngman Rhee a annoncé son intention d'organiser des élections nationales pour unifier le pays sous un gouvernement démocratique. À l'opposé, les émissions de radio du bloc de l'Est sont restées silencieuses après des semaines de dénonciations furieuses de l'avancée de l'ONU."
 korea.12.o.a:0 "Finalement, les communistes sont vaincus."
 korea.12.o.b:0 "Le communisme est repoussé..."
 korea.12.o.c:0 "Ils n'auraient pas dû envahir."
 korea.13.t:0 "[GetNewspaperHeader]Armistice du conflit coréen"
 korea.13.d:0 "La guerre de Corée a assez duré et nous n'avons réalisé aucun progrès dans la guerre. La frontière coréenne est un véritable casse-tête pour nos soldats et nous perdons des centaines d'hommes chaque semaine rien que pour tenir la ligne de front. Nous discutons d'un plan de paix avec les États-Unis et les Nations Unies. Cela pourrait être notre chance de mettre fin à cette guerre et de permettre à la vie de revenir à la normale. Cependant, nous pourrions attendre et voir si nous pouvons faire une percée dans la guerre et voir si nous pouvons unifier la péninsule coréenne, mais si cela dure aussi longtemps, cela pourrait prendre encore quelques mois, voire quelques années. Pouvons-nous nous permettre les pertes et les sacrifices ? Devons-nous envoyer l'Armistice pour qu'il soit signé et laisser cette guerre se terminer ?"
 korea.13.o.a:0 "Bonne idée, envoyez-le à la République de Corée"
 korea.13.o.b:0 "Vous avez peur des communistes ?"
 korea.14.d:0 "Les États-Unis nous ont proposé l'idée d'un armistice avec les communistes."
 korea.14.o.a:0 "Vas-y, il est temps d'en finir"
 korea.14.o.b:0 "Mais ils ne sont pas encore vaincus"
 korea.15.d:0 "L'État bandit nous a approché avec l'idée d'un armistice avec eux."
 korea.15.o.a:0 "Bien sûr, pour l'instant, mais tu attends"
 korea.16.t:0 "Accord d'armistice coréen"
 korea.16.d:0 "L'accord d'armistice coréen a maintenant été signé dans le village de Panmunjom, mettant fin aux hostilités de la guerre de Corée et échangeant des terres entre les deux parties."
 korea.16.o.a:0 "Enfin, un peu de calme"
 korea.17.o.a:0 "Bonne idée, envoie-le en Corée du Nord"
 korea.17.o.b:0 "Peur des capitalistes ?"
 korea.18.d:0 "La Chine nous a proposé l'idée d'un armistice avec cet État bandit."
 korea.19.d:0 "Les rebelles communistes nous ont approché avec l'idée d'un armistice avec eux."
 korea.20.d:0 "Le Nord et la République de Corée ont signé un armistice, mettant ainsi fin pour l'instant à la guerre entre eux."
 korea.20.o.a:0 "La paix revient en Corée"
 korea.20.o.b:0 "Les choses ne se sont pas déroulées comme prévu"
 korea.22.d:0 "Les Nations Unies nous ont proposé l'idée d'un armistice avec eux et avec l'État bandit."
 korea.23.d:0 "Les Nations Unies nous ont proposé l'idée d'un armistice avec les communistes."
 korea.24.t:0 "Combattez"
 korea.24.d:0 "La République de Corée est perdue. Nous pouvons peut-être le restaurer, mais cela nécessite un effort encore plus important. Sommes-nous prêts à le faire ?"
 korea.24.o.a:0 "Non, laisse tomber"
 korea.24.o.b:0 "Oui, nous continuerons à nous battre pour la République de Corée"
 korea.25.d:0 "La Corée du Nord est perdue. Nous pouvons peut-être le restaurer, mais cela nécessite un effort encore plus important. Sommes-nous prêts à le faire ?"
 korea.25.o.b:0 "Oui, nous continuerons à nous battre pour la Corée du Nord"
 korea.26.t:0 "[GetNewspaperHeader]Les États-Unis se retirent de Corée"
 korea.26.d:0 "Les forces américaines se retirent de Corée alors que la République de Corée a été dissoute et remplacée par un régime communiste."
 korea.26.o.a:0 "Alors la guerre est enfin finie ?"
 korea.26.o.b:0 "Nous avons échoué"
 korea.27.t:0 "[GetNewspaperHeader]La Chine se retire de la Corée"
 korea.27.d:0 "Les forces chinoises se retirent de Corée alors que la République populaire démocratique de Corée a été dissoute et remplacée par un régime capitaliste."
 korea.28.t:0 "Annexion de la République de Corée"
 korea.28.d1:0 "Ici, nous avons besoin que vous signiez ces documents comme une formalité pour annexer l'État bandit ainsi que pour dissoudre notre faction en temps de guerre avec la Chine."
 korea.28.d2:0 "Ici, nous avons besoin que vous signiez ces papiers comme formalité pour annexer l'État bandit."
 korea.28.o.a:0 "Laisse-moi le signer"
 korea.29.t:0 "Annexion de la Corée du Nord"
 korea.29.d:0 "Ici, nous avons besoin que vous signiez ces papiers comme formalité pour annexer l'État rebelle communiste."
 korea.30.t:0 "[GetNewspaperHeader]Accord d'armistice en Corée !"
 korea.30.d:0 "Un accord d'armistice a été signé entre la Corée du Nord et la République de Corée avec les États-Unis. L'accord d'armistice coréen stipule que la nouvelle frontière est basée sur la ligne du Kansas ou sur l'endroit où les derniers combats ont eu lieu. Il existe désormais une zone DMZ de 250 km à la frontière. Les deux nations belligérantes ont signé un cessez-le-feu et les combats ont cessé. La guerre de Corée semble s'être calmée et désormais les deux camps revendiquent la victoire, même si c'est un statu quo. La situation est désormais calme dans la péninsule coréenne. Espérons qu'ils oeuvrent désormais en faveur de la paix, plutôt que de la guerre à nouveau."
 korea.30.o.a:0 "Que va-t-il se passer maintenant ?"
 korea.30.o.b:0 "C'est notre destin de libérer la Corée."
 korea.30.o.c:0 "Nous défendrons jusqu'au dernier homme"
 korea.30.o.d:0 "Nous avons contenu le communisme."
 korea.30.o.e:0 "Nous aiderons la Corée du Nord à tout moment à se libérer."
 korea.30.o.f:0 "Nous libérerons la Corée une autre fois."
 korea.31.d:0 "La République de Corée est attaquée par la menace communiste au Nord, nous devrions envoyer nos forces militaires là-bas pour l'aider."
 korea.31.o.a:0 "Envoyons nos troupes là-bas"
 korea.31.o.b:0 "Nous restons en dehors de ça"
 korea.32.t:0 "[GetNewspaperHeader]Le Commonwealth entre dans le conflit coréen"
 korea.32.d:0 "Le Commonwealth est entré dans le conflit coréen aux côtés de la République de Corée contre la République populaire démocratique et communiste de Corée."
 korea.32.o.a:0 "Cela va juste dégénérer, n'est-ce pas"
 korea.32.o.b:0 "C'était prévu"
 korea.32.o.c:0 "Bien, nous en avons vraiment besoin"
 korea.32.o.d:0 "C'est la bonne chose"
 korea.33.t:0 "Aide la Corée du Nord"
 korea.33.d1:0 "En aidant la Corée du Nord contre les Américains et leur État bandit, la « République de Corée » est nécessaire pour assurer la sécurité de l'Union soviétique et du communisme en Asie. Nous devrions donc envoyer nos forces militaires là-bas pour les aider."
 korea.33.d2:0 "Aider la Corée du Nord contre l'État bandit de la « République de Corée » est nécessaire pour garantir la sécurité du communisme en Asie. Nous devrions donc envoyer nos forces militaires là-bas pour les aider."
 korea.34.t:0 "[GetNewspaperHeader]L'Union soviétique entre dans le conflit coréen"
 korea.34.d:0 "L'Union soviétique est entrée dans le conflit coréen aux côtés de la République populaire démocratique de Corée et contre la République capitaliste de Corée."
 korea.34.o.a:0 "Qu'est-ce que j'ai dit, j'avais raison"
 korea.34.o.b:0 "Cela transformera la guerre en faveur des communistes"
 korea.34.o.c:0 "Bonne nouvelle"
 korea.34.o.d:0 "S'il vous plaît non"
 korea.34.o.e:0 "Un digne adversaire"
 korea.33.o.b:0 "Envoyez du matériel à nos camarades"
 korea.33.o.a:0 "Ils peuvent facilement les détruire"
 Korean_War_Ceasefire:0 "Cessez-le-feu de la guerre de Corée"
 FRAkorea.4.d:0 "Paris a répondu à l'appel des Nations Unies avec un bataillon de volontaires pour la Corée. Le bataillon français servira sous le commandement unifié, rattaché à une division d'infanterie américaine.\n\nSon commandant est le général Raoul Magrin-Vernerey, plus connu sous le nom de Monclar, vétéran décoré des deux guerres mondiales. Il a accepté une réduction au rang de lieutenant-colonel afin de pouvoir diriger lui-même le bataillon.\n\nAvec la majeure partie de son armée engagée en Indochine, la France ne peut guère épargner plus que cela pour l'instant. Le gouvernement affirme que cette contribution montre que la France se tient aux côtés de ses alliés partout où la Charte est remise en question."
 korea.47.d:0 "Dans un climat mondial de mécontentement à l'égard de l'autorité et de dégoût national à l'égard du gouvernement de la République de Corée, les braises de la protestation ont éclaté cette année. Au cours des deux dernières années, le peuple de la République de Corée est devenu de plus en plus irrité envers son président, Syngman Rhee, au pouvoir depuis 1948. En 1958, craignant une perte de pouvoir, le président Rhee a imposé un changement dans les lois du pays qui a considérablement élargi le pouvoir exécutif. L'année suivante, les deux plus grands rivaux politiques de Rhee pour l'élection présidentielle de 1960 sont morts dans des circonstances suspectes et l'un de ses plus proches alliés politiques a été élu vice-président par un vote frauduleux, ce qui a conduit à des rumeurs répandues selon lesquelles Rhee maintenait le pouvoir par le sang et l'intrigue. Cette année, les Coréens ont annoncé qu'ils en avaient assez. Ce qui a commencé comme une petite manifestation du Parti démocrate a pris une ampleur considérable après que la police a tué un étudiant manifestant avec une bombe lacrymogène. Alors que les manifestations s'intensifiaient tout au long du mois d'avril, les soldats et les policiers, en nombre inférieur, ont mené une bataille perdue d'avance avant de finalement refuser de tirer sur les manifestants. Laissé à la merci de son électorat, Rhee n'a pas tardé à démissionner et à fuir le pays. Le peuple de la République de Corée cherche désormais à réorganiser sa république sur un modèle parlementaire, dans l'espoir de limiter le pouvoir de l'exécutif et de garantir qu'aucun homme fort corrompu ne prenne les rênes du pouvoir."
 korea.48.d:0 "Le Conseil de sécurité des Nations Unies a voté à l'unanimité l'adoption de la résolution 82 en réponse à l'invasion nord-coréenne de la République de Corée. L'Union soviétique n'a pas assisté à la réunion car elle boycotte le Conseil de sécurité et ne peut donc pas y opposer son veto. Parmi les membres actuels du Conseil de sécurité, seule la Yougoslavie a choisi de s'abstenir. La résolution condamne l'invasion nord-coréenne et appelle les États membres à aider la République de Corée et à s'abstenir d'armer ou de soutenir la Corée du Nord. Les États-Unis et leurs alliés considèrent cette résolution comme une victoire diplomatique majeure et les analystes estiment qu'elle ouvrira la voie à une implication américaine plus directe dans le conflit. De nombreux États membres, en particulier les États-Unis et l'Europe occidentale, éprouvent de la sympathie pour la République de Corée, car les souvenirs de la Seconde Guerre mondiale et des attaques surprises des puissances de l'Axe restent ancrés dans la mémoire collective de ses dirigeants."