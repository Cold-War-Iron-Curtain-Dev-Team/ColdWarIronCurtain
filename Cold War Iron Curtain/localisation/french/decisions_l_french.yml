bombardiers à haute vitesse§! sont beaucoup plus rapides, ont une portée beaucoup plus longue et ont beaucoup plus de chances de survivre. §YLes bombardiers nucléaires§! ont une portée mondiale.\n\n§CMISSILES§!\n§YMissiles de croisière§! et §YLes missiles balistiques§! sont des armes dévastatrices à usage unique que vous déployez à partir de lanceurs de missiles à longue portée stationnés dans les bases aériennes §Y§!. Ils peuvent accomplir presque toutes les missions et produire des effets immédiats dévastateurs. §YLes missiles balistiques§! sont nucléaires.\n\n§CAVIONS DE TRANSPORT§!\n§YLes avions de transport/logistique§! sont utilisés pour larguer des unités §YAirborne§! et pour effectuer des missions de ravitaillement aérien §Y§! afin de déplacer temporairement une partie de la limite de ravitaillement §Y§! de la région où se trouve la base aérienne §Y§!. dans la région cible."
 
 TUTOR_military_205: "Marine"
 TUTOR.205.t: "Marine"
 TUTOR_military_205_desc: "La §YNavy§! est une branche quelque peu complexe de la §YMilitary§! qui implique un équilibre minutieux entre les classes de navires et les tactiques navales.\n\n§CCOMBAT NAVAL§!\nLes navires sont de 4 types. §YScreen-Line§!, §YBattle-Line§!, §YCarrier§!et §YSubmersible§!. Les navires §YScreen-Line§! forment l'épine dorsale de la §YNavy§! et constituent la majeure partie des effectifs pour empêcher les navires beaucoup plus clairsemés §YBattle-Line§! d'être déchiquetés. La quantité généreusement appliquée d'attaque HG et de torpilles universelles §Y§! rend le combat naval dans le CWIC mortel pour les grands navires. Avoir un nombre suffisant pour couvrir votre ligne de bataille §Y§! est vital. Les navires §YBattle-Line§! transportent une quantité beaucoup plus grande de puissance de feu à §YHP§! par rapport aux navires §YScreen-Line§! et, en tant que tels, sont les plus puissants. En plus d'être l'essentiel de la puissance de feu, ils empêchent la §YBattle-Line§! ennemie d'attaquer directement les §YCarriers§!. Les porte-avions §Y§! transportent soit §YVTOL§! soit §YCV Multirole§! des avions qui peuvent combattre ou infliger des dégâts aux navires, §YCV CAS§! qui peuvent bombarder des navires ennemis ou fournir un soutien au sol, ou §YHélicoptères ASW§! qui protègent les §YCarriers§! et §YBattle-Line§! des §YSubmersibles§!. Les §YSubmersibles§! tentent de rester indétectables et d'attaquer directement la §YBattle-Line§! ou les §YCarriers§! s'ils parviennent à passer outre la détection des armes anti-sous-marines. De plus, les sous-marins balistiques §Y§! (coques MTG §YSingle-Large§! et §YDouble-Large§!) peuvent transporter des missiles de croisière §YSLBM§!ou §Y.§! pour attaquer des cibles terrestres ou des flottes ennemies. Les torpilles §Y§! peuvent directement attaquer et dévaster la ligne de bataille §Y§! et les porte-avions §Y§!. De plus, les torpilles moyennes §Y§! peuvent endommager les submersibles §Y§!.\n\n§CCONVOIS§!\nVital pour §Yle commerce§!, §Yle transport des troupes§!et §Yl'approvisionnement§!, §Yles convois§! sont l'une des principales raisons pour lesquelles gagner un combat naval est un combat crucial, même sur des terres interconnectées. §YLes convois§! qui ne sont pas protégés peuvent être annihilés par les §YSubmersibles§!. Les convois en combat naval apparaissent dans la ligne §YCarrier§! et seront protégés par les navires §YScreen-Line§! et §YBattle-Line§!.\n\n§CMODULES§!\nSpécifiques à MTG, les modules §Y§! se présentent sous diverses formes.\n Les pistolets AA§! et les §Y§YSAM§!§! §Bsont respectivement des recherches issues des technologies§! Autocannon§! et SAM.\n§YLes armements§! sont des armes à faible perçage et à faibles dégâts, tandis que les §YASM§! sont des armes à faible perçage et à faibles dégâts. §YBlindage§! peut facilement vaincre les navires qui ont trop de §YASM§! et pas assez d'armements §Y§!\n§YLes contre-mesures§! sont §GTRÈS BON COÛT§! et peuvent donc être considérées comme une augmentation forfaitaire à §YBlindage§! lorsque §Brecherché§! et déployé sur les navires. §YCIWS§! est §Rextrêmement plus cher, surtout en £resources_strip|2 mais ajoute beaucoup de §YArmor§! au navire. Si le blindage §Yd'un navire§! est supérieur au perçage de son ennemi, même un peu, alors il infligera §Rbeaucoup moins de dégâts.§!\n§YLes modules maritimes§! sont équipés dans l'emplacement maritime §Y§!. §YTA/FCS§! est requis pour que AA inflige une quantité décente de dégâts et augmente les dégâts de toutes les §YArmes§!. §YEW/SS§! augmente la détection §Yd'un navire§!. §YNavigation§! améliore la §YFurtivité§! d'un navire en l'aidant à éviter d'être détecté et offre des bonus lors des combats sur un terrain accidenté ou exigu. Les modules sonar §Y§! sont utilisés pour détecter §Yles submersibles§!.\n\n§CARMES SPÉCIALES§!\nLa plupart des vaisseaux ont un emplacement pour module d'arme spéciale §Y§!. Ceux-ci offrent tous une variété d'avantages différents et sont très divers et, en tant que tels, doivent être équipés avec soin.\n\n§CMOTEURS NUCLÉAIRES§!\n§YLes moteurs nucléaires§! sont recherchés dans l'onglet §BNucléaire/ADM§! et §Gne consomment aucun carburant§! tout en étant plus §Yfiables§!, ce qui fait que le navire a beaucoup moins de risques de panne en mer ou au combat."
