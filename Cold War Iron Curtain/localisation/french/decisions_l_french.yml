PRISES§!\n§YLes compagnies de soutien§! fournissent des statistiques et des modificateurs spéciaux à votre armée ou fonctionnent comme des bataillons supplémentaires §YFire Support§! dans l'emplacement de la compagnie. Il existe une variété de variables mobiles plus puissantes de §YSociétés de support§! dans l'arborescence §YSupport§! §BTechnologie§!. §YLes hélicoptères§! sont de loin les variantes les plus puissantes."
 
 TUTOR_military_204: "Aviation"
 TUTOR.204.t: "Aviation"
 TUTOR_military_204_desc: "La §YAir Force§! est une branche de l'armée capable de dévaster les bâtiments ennemis et les §YMarines§! à distance et de fournir des buffs de combat extrêmement puissants à l' §YArmy§!. §YL'avion léger§! peut effectuer presque toutes les missions, mais il le fait mal à tous égards. Ils sont cependant les plus rentables, mais ils sont instantanément réduits en lambeaux face à un bon nombre d'avions normaux des pays plus riches.§! Missions de ravitaillement aérien §CCOÛT AUCUN CP§! dans CWIC en raison de leur importance dans la guerre moderne au rythme rapide, alors utilisez-les au maximum.\n\n§CCOMBAT AIR-AIR§!\n §YLes multirôles§! effectuent des missions constantes §Yde supériorité aérienne§! qui fournissent des améliorations aux unités au sol et attaquent automatiquement les avions ennemis. Les intercepteurs §Y§! sont des unités axées sur le combat aérien qui n'offrent pas d'avantages d'attaque au sol des missions §Yde supériorité aérienne§! et ne peuvent attaquer que d'autres avions. Les intercepteurs à haute puissance §Y§! sont spécialisés dans les missions défensives §Yd'interception§! et détruisent les bombardiers §Yennemis§! et les avions de transport §Y§! et peuvent se redéployer rapidement n'importe où dans le monde.\n\n§CAPPUI AÉRIEN§!\n §YLes avions d'appui aérien rapproché§!, les §Ymultirôles§!et les §Ybombardiers tactiques§! peuvent être déployés dans des missions §YCAS§! où ils aident §Ydivisions militaires§! au combat en infligeant des dégâts massifs à l'ennemi. les unités spécialisées §YClose Air Support§! étant les meilleures par rapport à leur coût.\n\n§CBOMBARDEMENT§!\n§YLes bombardiers stratégiques§! et §YLes bombardiers tactiques§! peuvent détruire des bâtiments et des structures dans les missions de bombardement §Y§!. Ils doivent être protégés par des avions exécutant §YSupériorité aérienne§! pour se défendre. §YLes bombardiers navals§! peuvent bombarder les flottes ennemies ou les navires au port de manière très efficace. §YLes bombardiers à haute vitesse§! sont beaucoup plus rapides, ont une portée beaucoup plus longue et ont beaucoup plus de chances de survivre. §YLes bombardiers nucléaires§! ont une portée mondiale.\n\n§CMISSILES§!\n§YMissiles de croisière§! et §YLes missiles balistiques§! sont des armes dévastatrices à usage unique que vous déployez à partir de lanceurs de missiles à longue portée stationnés dans les bases aériennes §Y§!. Ils peuvent accomplir presque toutes les missions et produire des effets immédiats dévastateurs. §YLes missiles balistiques§! sont nucléaires.\n\n§CAVIONS DE TRANSPORT§!\n§YLes avions de transport/logistique§! sont utilisés pour larguer des unités §YAirborne§! et pour effectuer des missions de ravitaillement aérien §Y§! afin de déplacer temporairement une partie de la limite de ravitaillement §Y§! de la région où se trouve la base aérienne §Y§!. dans la région cible."
