 TUTOR_military_209: "Doctrines"
 TUTOR.209.t: "Doctrines"
 TUTOR_military_209_desc: "§YLes doctrines§! sont utilisées pour définir les stratégies globales de votre armée et définir ou améliorer votre style de jeu tout au long de la campagne. §YLes doctrines§! sont §Rmutuellement exclusives§! et ne peuvent pas être modifiées (en raison d'un bug qui provoque le crash des doctrines modifiées).\n\n§CDOCTRINES AÉRIENNES§!\nIl y a 3 §YDoctrines Aériennes§! dans CWIC.\n§YLa Polyvalence Aéronautique§! est une doctrine centrée sur la polyvalence et la maintenance minimale. Il améliore l'efficacité des bombardiers §Ymultirôles§! et tactiques,§! vous permettant de minimiser le nombre de lignes de production différentes dont vous avez besoin. De plus, il §Gréduit considérablement les accidents et les pénalités liées aux intempéries§!.\n§YLa guerre systémique§! donne la priorité à l'aspect stratégique de la §YAir Force§!. Il accorde des améliorations à §YBombardement stratégique§! et §YSupériorité aérienne§!. Son objectif est de vous assurer de perturber indirectement la machine de guerre ennemie grâce à une destruction stratégique.\n§YL'intégrité tactique§! est à l'opposé de §YPolyvalence aéronautique§! et §YGuerre systémique§!. §YIntégrité tactique§! donne des bonus aux unités aériennes spécialisées et se concentre sur le soutien des armées et des marines pendant leur poussée. Il accorde plus de bonus aux missions §YSupériorité aérienne§! et aux avions spécialisés pour remplir un rôle de soutien pour les autres branches et améliore §YInterception§! pour combattre les bombardiers ennemis."
 TUTOR.209.d: "§YLes doctrines§! sont utilisées pour définir les stratégies globales de votre armée et définir ou améliorer votre style de jeu tout au long de la campagne. §YLes doctrines§! sont §Rmutuellement exclusives§! et ne peuvent pas être modifiées (en raison d'un bug qui provoque le crash des doctrines modifiées).\n\n§CDOCTRINES AÉRIENNES§!\nIl y a 3 §YDoctrines Aériennes§! dans CWIC.\n§YLa Polyvalence Aéronautique§! est une doctrine centrée sur la polyvalence et la maintenance minimale. Il améliore l'efficacité des bombardiers §Ymultirôles§! et tactiques,§! vous permettant de minimiser le nombre de lignes de production différentes dont vous avez besoin. De plus, il §Gréduit considérablement les accidents et les pénalités liées aux intempéries§!.\n§YLa guerre systémique§! donne la priorité à l'aspect stratégique de la §YAir Force§!. Il accorde des améliorations à §YBombardement stratégique§! et §YSupériorité aérienne§!. Son objectif est de vous assurer de perturber indirectement la machine de guerre ennemie grâce à une destruction stratégique.\n§YL'intégrité tactique§! est à l'opposé de §YPolyvalence aéronautique§! et §YGuerre systémique§!. §YIntégrité tactique§! donne des bonus aux unités aériennes spécialisées et se concentre sur le soutien des armées et des marines pendant leur poussée. Il accorde plus de bonus aux missions §YSupériorité aérienne§! et aux avions spécialisés pour remplir un rôle de soutien pour les autres branches et améliore §YInterception§! pour combattre les bombardiers ennemis."
 
 TUTOR_military_210: "Insurrections/Occupation"
 TUTOR.210.t: "Insurrections/Occupation"
 TUTOR_military_210_desc: "Tout au long du jeu vous devrez affronter §RRésistances§!. Il existe 2 types de §RRésistances§!.\n\n§CINSURRECTIONS§!\n§RLes résistances§! qui sont §CLes insurrections §! sont très dangereuses et menacent votre paysage politique. Ils sont spécifiques à une zone et programmés pour se produire. Ils apparaîtront comme mécanicien dans l'onglet §YDécisions§!. Ils peuvent avoir besoin d'une grande quantité de §Yde pouvoir politique§!, de §Yd'argent§!et de §Yd'équipement§! pour combattre. Si vous ne parvenez pas à les supprimer, ils §Rengendreront un nouveau pays indépendant aligné contre vous ou changeront de gouvernement§! en prenant de grandes quantités de §Yressources§!, des terres et potentiellement des actifs militaires tels que §Ydes équipements§! ou §Ydes bases aériennes§!.\n\n§CRÉSISTANCE NON ESSENTIELLE§!\n§RLes résistances non essentielles§! sont des résistances §R§! qui sont dynamiques et se produisent dans tous les territoires §Ynon essentiels§!. Ils sont dynamiques et sont supprimés par vos §YModèles de garnison§! dans l'onglet §YDéploiement§!. Il est recommandé de donner la priorité à la création d'un modèle de garnison §Y§! qui est rentable et d'une largeur de 10+. La largeur spécifique n'a pas d'importance puisque les garnisons §Y§! peuvent utiliser des garnisons §Ypartielles ou multiples§! dans un territoire. Donnez la priorité à un rapport coût/suppression optimal et §RÉQUIPEZ-LES TOUJOURS D'UNE UNITÉ DE POLICE MILITAIRE§!. Ne leur donnez pas §YVéhicules de combat§! tels que §YChars§! ou §YArmes d'appui-feu§! telles que §YArtillerie§! car ils sont inutiles à §YGarnison§! modèles. §YLa cavalerie motorisée, APC mécanisée et aérienne§! ont toutes des niveaux élevés de suppression, mais la cavalerie aérienne, bien que légèrement plus efficace en termes de main-d'oeuvre, n'est souvent pas rentable. S'il y a §RNon-respect§! dans la région, la résistance §R§! attaquera la §YGarnison§! et tentera de détruire §YBâtiments§! et pourra même §RDéclarer l'Indépendance§!. Lorsque la Résistance §R§! attaque la Garnison §Y§!, elle mènera §YOpérations de Résistance§! qui ciblent les actifs. Avoir §YCanon automatique§! ou §YPolice militaire§! §Btechnologies§! peut réduire les dégâts causés par §YOpérations de résistance§!. Le pourcentage de dureté §Yde la garnison§! réduira les dégâts globaux causés par le §YRésistance§! à eux."
 TUTOR.210.d: "Tout au long du jeu vous devrez affronter §RRésistances§!. Il existe 2 types de §RRésistances§!.\n\n§CINSURRECTIONS§!\n§RLes résistances§! qui sont §CLes insurrections §! sont très dangereuses et menacent votre paysage politique. Ils sont spécifiques à une zone et programmés pour se produire. Ils apparaîtront comme mécanicien dans l'onglet §YDécisions§!. Ils peuvent avoir besoin d'une grande quantité de §Yde pouvoir politique§!, de §Yd'argent§!et de §Yd'équipement§! pour combattre. Si vous ne parvenez pas à les supprimer, ils §Rengendreront un nouveau pays indépendant aligné contre vous ou changeront de gouvernement§! en prenant de grandes quantités de §Yressources§!, des terres et potentiellement des actifs militaires tels que §Ydes équipements§! ou §Ydes bases aériennes§!.\n\n§CRÉSISTANCE NON ESSENTIELLE§!\n§RLes résistances non essentielles§! sont des résistances §R§! qui sont dynamiques et se produisent dans tous les territoires §Ynon essentiels§!. Ils sont dynamiques et sont supprimés par vos §YModèles de garnison§! dans l'onglet §YDéploiement§!. Il est recommandé de donner la priorité à la création d'un modèle de garnison §Y§! qui est rentable et d'une largeur de 10+. La largeur spécifique n'a pas d'importance puisque les garnisons §Y§! peuvent utiliser des garnisons §Ypartielles ou multiples§! dans un territoire. Donnez la priorité à un rapport coût/suppression optimal et §RÉQUIPEZ-LES TOUJOURS D'UNE UNITÉ DE POLICE MILITAIRE§!. Ne leur donnez pas §YVéhicules de combat§! tels que §YChars§! ou §YArmes d'appui-feu§! telles que §YArtillerie§! car ils sont inutiles à §YGarnison§! modèles. §YLa cavalerie motorisée, APC mécanisée et aérienne§! ont toutes des niveaux élevés de suppression, mais la cavalerie aérienne, bien que légèrement plus efficace en termes de main-d'oeuvre, n'est souvent pas rentable. S'il y a §RNon-respect§! dans la région, la résistance §R§! attaquera la §YGarnison§! et tentera de détruire §YBâtiments§! et pourra même §RDéclarer l'Indépendance§!. Lorsque la Résistance §R§! attaque la Garnison §Y§!, elle mènera §YOpérations de Résistance§! qui ciblent les actifs. Avoir §YCanon automatique§! ou §YPolice militaire§! §Btechnologies§! peut réduire les dégâts causés par §YOpérations de résistance§!. Le pourcentage de dureté §Yde la garnison§! réduira les dégâts globaux causés par le §YRésistance§! à eux."
 TUTOR_military_211: "L'interface graphique WMD expliquée"
 TUTOR.211.d: "Le rideau de fer de la guerre froide introduit un tout nouveau système d'armes de destruction massive, permettant des échanges nucléaires plus complexes et stratégiques par rapport à la méthode standard \"cliquez sur chaque province\". L'interface graphique comporte 8 parties de base. \n 1. L'écran en haut à gauche montre les puissances nucléaires du monde, en d'autres termes, qui a armé leur stock via la politique de l'onglet politique. \n 2. L'écran Defcon affiche votre niveau Defcon et n'est disponible qu'aux États-Unis, en URSS et en RPC. Baisser le niveau indiquera un stade de tension plus élevé.\n \n 3. La section centrale de l'interface graphique indique le nombre d'armes de destruction massive de chaque type dont vous disposez, des armes nucléaires classiques aux ICBM. La liste des armes chimiques à l'extrême droite est un WIP, et le bit de dénucléarisation - eh bien, pourquoi voudriez-vous faire ça, de toute façon ? \n 4. Sous la section discutée en 3 se trouvent 3 options, pour une frappe de niveau 1, 2 ou 3, chacune offrant différentes quantités d'armes nucléaires utilisées et différentes cibles. Le niveau 1 est une attaque de base sur les capitales ennemies à portée. Le niveau 2 est le niveau 1, plus des armes nucléaires supplémentaires pour les cibles stratégiques, c'est-à-dire. Grande population ou centres industriels. Le niveau 3 est une bordée nucléaire complète et nécessite l'une des deux choses suivantes : la technologie ICBM, ou pour l'URSS ou les États-Unis, des missiles à Cuba ou en Turquie, respectivement. \n 5. Le gros bouton nucléaire grisé deviendra rouge si toutes les conditions de lancement sont remplies, et vous pourrez alors jouer à une guerre thermonucléaire mondiale. \n 6. Sous le gros bouton se trouve une liste des armes nucléaires nécessaires à la frappe. \n 7. À gauche se trouve une liste de cibles de l'État pour la grève. \n 8. À gauche se trouve une liste des pays ennemis à portée de vos missiles. \n\n N'oubliez pas que si vous rencontrez des bugs ou des problèmes avec ce système, n'hésitez pas à les lister sur steam ou discord. \n\n Bon bombardement !"
