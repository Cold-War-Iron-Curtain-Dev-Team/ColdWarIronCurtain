 RUS_rally_pro_yeltsin_protesters_desc: "Avec des manifestants effrénés en faveur du Parlement, rallier nos partisans en public devrait contribuer à rétablir un certain sentiment de calme."
 RUS_cut_parliaments_power_desc: "Si nous souhaitons réaffirmer notre contrôle, nous devons priver le Parlement de la capacité d'affirmer son propre contrôle. En coupant leur électricité, ils resteront isolés."
 RUS_denounce_opposition_leadership_desc: "Bien que notre opposition bénéficie d'une base de soutien malheureusement importante, nous ne pouvons tout simplement pas laisser ses calomnies s'exprimer librement. Nous espérons que les traîner à travers la Terre contribuera à convaincre leurs partisans de notre côté."
 RUS_solicit_support_from_george_soros_desc: " George Soros a joué un rôle déterminant dans le financement de mouvements antisoviétiques dans l'ex-bloc de l'Est dans le passé, ainsi que dans le financement d'institutions dans les États post-soviétiques. Son action financière et politique pourrait grandement contribuer à stabiliser notre situation actuelle."
 RUS_deploy_police_to_the_streets_of_moscow_desc: "Les manifestants anti-Eltsine ont eu beaucoup trop de latitude quant à ce qu'ils pouvaient faire. Il est temps de rétablir l'ordre et de nettoyer les rues de notre capitale."
 RUS_address_the_nation_desc: "Si nous souhaitons garantir la cohésion nationale et l'unité derrière le président, nous devons veiller à ce que la population sache ce qui se passe et, surtout, qui soutenir."
 RUS_send_the_kantemer_division_desc: "La loyauté de la division Kantemir envers le président est inébranlable et assurée. Il est devenu clair que la seule solution à cette crise est celle de la force. Nous utiliserons la division pour encercler le Parlement et ferons ce qui doit être fait pour rétablir l'ordre."
