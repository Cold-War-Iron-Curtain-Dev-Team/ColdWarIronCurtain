 TUTOR_economics_101: "Gagner de l'argent et PIB"
 TUTOR.101.t: "Gagner de l'argent et PIB"
 TUTOR_economics_101_desc: "§YL'argent§! est une ressource dans CWIC qui est produite par presque tous les bâtiments productifs.\n\n§CGAGNER DE L'ARGENT§!\nL'argent a de nombreuses sources. La fiscalité §Y§! rapporte de l'argent en fonction du niveau de développement §Y§! de la population d'un État avec des taux d'imposition globaux §Yplus élevés§! réduisant §Yl'efficacité de la production§!. Les parcs industriels §Y§! et les chantiers navals §Y§! ont tous deux un revenu de base de §G0,5 milliard§! par bâtiment multiplié par §YProductivité§! (efficacité de production + 50 %). §YLes chantiers navals§! bénéficient également d'un bonus basé sur §YLois commerciales§! et §YTechnologie logistique§!. §YLes raffineries§! ont un revenu de base de §G0,75B§! par bâtiment multiplié par +15% pour chacune de leurs §YTechnologies des sciences des matériaux§!respectives. §YOffice Parks§! sont les bâtiments les plus productifs car ils produisent un revenu de base de §G1,5 milliard§! par bâtiment multiplié par +15 % pour chaque §YConsumer Electronics§! technologie que vous avez recherchée. Exporter §YRessources§! est également une bonne source de revenus. §YLes complexes agro-industriels§! produisent §G0,5B§! par temps de construction +15 % par §YAgriculture§! technologie.\n\n§CPIB§!\nLe PIB §Yde votre pays§! est défini par la productivité totale de l'industrie et du commerce de votre pays. Plus de bâtiments = plus §YPIB§!.\n\n§COBLIGATIONS ET DETTES§!\nS'endetter n'est pas toujours un problème, surtout si vous utilisez l'argent pour réinvestir dans des revenus ou des dépenses immédiates. Chaque fois que vous dépensez plus d'argent que vous n'en avez dans les réserves, votre pays contracte §YPrêts étrangers au jour le jour§! à un taux d'intérêt §Y§! de §Y4%§! par an à rembourser automatiquement dans un délai de §Y3 ans§!. Si vous souhaitez des prêts à taux d'intérêt §Yinférieurs§! ou si vous souhaitez obtenir des prêts à plus long terme, accédez à la catégorie de décision §YDécisions économiques§! et parcourez les §YObligations§! qui vous sont proposées à l'achat. Ils ont tous des taux d'intérêt variables de §Y§! et des durées de prêt de §Y§!. Toutes les §Yobligations§! étrangères augmentent l' §Yinfluence§! d'une autre nation sur vous. Si vous préférez éviter cela, construisez §YOffice Parks§! pour augmenter votre limite de §YDomestic Bond§!. Le pool §YDomestic Bond§! est limité mais se reconstitue au fil du temps."
