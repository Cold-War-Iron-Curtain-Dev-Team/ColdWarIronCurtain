es bases aériennes §Y§! pour infliger de nombreux dégâts en rafale à un coût élevé avant de devoir en construire davantage. §YLes missiles balistiques§! sont des armes nucléaires tactiques que vous pouvez utiliser pour infliger beaucoup plus de dégâts que les §Yles missiles de croisière§! mais sont beaucoup plus chers, §BRecherche§! coûteux et nécessitent £resources_strip|6."
 
 TUTOR_military_207: "NBC/ADM/Technologie Nucléaire"
 TUTOR.207.t: "NBC/ADM/Technologie Nucléaire"
 TUTOR_military_207_desc: "L'onglet technique §BWMD§! est l'endroit où vous effectuez des recherches nucléaires, biologiques et chimiques §B§!. Vous pouvez §Brechercher§! §YArmes et utilitaires NBC§!, §RADM nucléaires§!, §YMoteurs nucléaires§!et §YÉnergie nucléaire§!.\n\n§CADM NUCLÉAIRES§!\n§YLes armes de destruction nucléaire§! sont les armes les plus dévastatrices que vous ayez dans votre arsenal. Utilisées dans l'onglet §YWMD§!, ces armes peuvent être utilisées pour anéantir rapidement le pays et l'économie d'un adversaire pendant une §RGuerre nucléaire§!. Vous construisez §YArmes nucléaires§! dans l'onglet §BRocketry Tech§! ou construisez d'énormes §RArmes thermonucléaires§! en utilisant le bâtiment §YUsine de fabrication d'armes nucléaires§!. Le bâtiment §YAbri de défense civile§! est un excellent moyen de réduire les dégâts subis par les attaques ennemies.\n\n§CARMES/UTILITAIRES NBC§!\nDans cette section, vous pouvez §Brechercher§! §Ydes armes biologiques§! à déchaîner sur vos ennemis dans l'onglet §YWMD§!, §Ydes armes chimiques et des utilitaires§! qui sont utilisés comme §Ycapacités de l'armée.§!et §YNerve Gas§! qui est une capacité qui devient progressivement plus puissante mais dangereuse à la fois pour l'ennemi et son utilisateur à mesure que vous la développez.\n\n§CRECHERCHE NUCLÉAIRE§!\nDans cette section, vous pouvez §Brechercher§! une variété de §Btechnologies nucléaires non utilisées comme armes§!. §YLes centrales nucléaires§! sont coûteuses, vulnérables aux bombardements stratégiques §R§!et consomment £resources_strip|6. Malgré cela, ils constituent la forme la plus efficace de gain £resources_strip|7. §YLes réacteurs nucléaires navals§! sont des moteurs très fiables mais très coûteux qui ne consomment aucun carburant. §YFusion Power§! est un bâtiment de drapeau §Yextrêmement coûteux§! (les bâtiments de drapeau sont des bâtiments construits par décisions et ne sont pas dans les emplacements de construction) qui est construit via §YDécisions RGO§!."
 TUTOR.207.d: "L'onglet technique §BWMD§! est l'endroit où vous effectuez des recherches nucléaires, biologiques et chimiques §B§!. Vous pouvez §Brechercher§! §YArmes et utilitaires NBC§!, §RADM nucléaires§!, §YMoteurs nucléaires§!et §YÉnergie nucléaire§!.\n\n§CADM NUCLÉAIRES§!\n§YLes armes de destruction nucléaire§! sont les armes les plus dévastatrices que vous ayez dans votre arsenal. Utilisées dans l'onglet §YWMD§!, ces armes peuvent être utilisées pour anéantir rapidement le pays et l'économie d'un adversaire pendant une §RGuerre nucléaire§!. Vous construisez §YArmes nucléaires§! dans l'onglet §BRocketry Tech§! ou construisez d'énormes §RArmes thermonucléaires§! en utilisant le bâtiment §YUsine de fabrication d'armes nucléaires§!. Le bâtiment §YAbri de défense civile§! est un excellent moyen de réduire les dégâts subis par les attaques ennemies.\n\n§CARMES/UTILITAIRES NBC§!\nDans cette section, vous pouvez §Brechercher§! §Ydes armes biologiques§! à déchaîner sur vos ennemis dans l'onglet §YWMD§!, §Ydes armes chimiques et des utilitaires§! qui sont utilisés comme §Ycapacités de l'armée.§!et §YNerve Gas§! qui est une capacité qui devient progressivement plus puissante mais dangereuse à la fois pour l'ennemi et son utilisateur à mesure que vous la développez.\n\n§CRECHERCHE NUCLÉAIRE§!\nDans cette section, vous pouvez §Brechercher§! une variété de §Btechnologies nucléaires non utilisées comme armes§!. §YLes centrales nucléaires§! sont coûteuses, vulnérables aux bombardements stratégiques §R§!et consomment £resources_strip|6. Malgré cela, ils constituent la forme la plus efficace de gain £resources_strip|7. §YLes réacteurs nucléaires navals§! sont des moteurs très fiables mais très coûteux qui ne consomment aucun carburant. §YFusion Power§! est un bâtiment de drapeau §Yextrêmement coûteux§! (les bâtiments de drapeau sont des bâtiments construits par décisions et ne sont pas dans les emplacements de construction) qui est construit via §YDécisions RGO§!."
 
