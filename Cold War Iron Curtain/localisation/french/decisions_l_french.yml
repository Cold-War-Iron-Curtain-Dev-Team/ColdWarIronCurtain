 contra_insurgency_options.1.d: "Les Contras s'appuient sur la peur et l'intimidation pour s'exprimer. Ceux qui les soutiennent sont souvent d'anciens voyous ou des individus avares qui cherchent désespérément de l'argent provenant d'étrangers opposés à notre révolution. En tant que tel, il n'est pas si difficile pour nous de recruter des habitants des zones contrôlées par les Contra qui sont prêts à accomplir leur devoir patriotique et à recueillir des informations pour nous. Lors d'une récente opération de renseignement, nous avons réussi à recruter un villageois près d'une importante base Contra. Il nous a fourni des informations inestimables sur leurs tactiques de recrutement, leurs déploiements et le niveau de leurs approvisionnements en armes. Plus important encore, comme de nombreux Contras font leurs courses ou passent leur temps libre dans le village, nous obtenons également des informations sur les futures offensives Contra. Grâce à ces informations, nous sommes mieux en mesure de déployer nos forces dans la zone pour contrer leurs forces et avons pu intercepter plusieurs tentatives des Contras d'amener de nouveaux chasseurs dans la zone."
 contra_insurgency_options.2.d: "Les Contras s'appuient sur la peur et l'intimidation pour s'exprimer. Ceux qui les soutiennent sont souvent d'anciens voyous ou des individus avares qui cherchent désespérément de l'argent provenant d'étrangers opposés à notre révolution. En tant que tel, il n'est pas si difficile pour nous de recruter des habitants des zones contrôlées par les Contra qui sont prêts à accomplir leur devoir patriotique et à recueillir des informations pour nous. Lors d'une récente opération de renseignement, nous avons réussi à recruter un villageois dans une zone contrôlée par les Contra. La source de l'époque s'est avérée utile et a fourni des renseignements indiquant une offensive majeure des Contra dans la région. Nous avons déployé des forces pour contrer cette offensive à venir, mais elle a fini par se produire dans une zone différente et les Contras ont chassé nos forces non préparées. Nous avons réalisé que notre recrue était un agent double et qu'elle avait facilité le succès de la Contra. Notre opération avait été un échec."
 contra_insurgency_options.3.d: "Les Contras sont un groupe de lâches, qui n'attaquent souvent que depuis la jungle pour cibler des fonctionnaires non armés ou des civils innocents. Nous avons déployé une force pour protéger plusieurs villages qui ont été récemment attaqués. Les Contras ne s'en sont pas rendu compte et nous avons réussi à découvrir leur base opérationnelle dans la région. Au cours d'un raid audacieux, nos forces ont réussi à infiltrer et à attaquer les forces Contra. Pris au dépourvu, leurs combattants ont subi de lourdes pertes alors qu'ils s'enfuyaient et couraient, beaucoup abandonnant leurs fusils occidentaux modernes. Nous avons fait des prisonniers et capturé des documents. Les villageois sont reconnaissants de nos actions et le moral de nos forces dans la région s'est amélioré."
 contra_insurgency_options.4.d: "Les Contras sont un groupe de lâches, qui n'attaquent souvent que depuis la jungle pour cibler des fonctionnaires non armés ou des civils innocents. Nous avons déployé une force pour protéger plusieurs villages qui ont été récemment attaqués. Cependant, notre commandant a commis une erreur en identifiant la base à partir de laquelle ils lançaient les attaques. Lorsque nos soldats se sont déplacés pour lancer l'assaut, les Contras se préparaient à partir et étaient en alerte. Ils ont fini par repérer nos forces et lorsque l'assaut a été lancé, nos hommes ont fait face à un ennemi retranché et préparé. Nous avons subi des pertes et nos soldats ont été contraints de se retirer. La défaite a permis aux Contras d'agir de manière plus agressive dans la région et les villageois de la région ont perdu confiance dans le gouvernement."
 contra_insurgency_options.5.d: "Nous avons une Force aérienne modeste, mais nos pilotes sont pleins de ferveur révolutionnaire. Grâce aux renseignements d'une puissance amie, nous avons pu découvrir l'emplacement d'un camp d'entraînement Contra en plein air. Il semble qu'ils nous croient effrontément incapables de frapper la base car elle est assez éloignée. Cependant, nous avons pu envoyer certains de nos avions avec des bombes et ils ont touché directement la cible. Après l'attaque, nous avons appris grâce à nos renseignements que la base avait été un grand camp d'entraînement et une zone de rassemblement pour les rebelles et qu'après l'attaque, elle n'est plus opérationnelle. Les capacités ennemies dans la zone ont été épuisées par cette frappe réussie."
 contra_insurgency_options.6.d: "Nous avons une Force aérienne modeste, mais nos pilotes sont pleins de ferveur révolutionnaire. Grâce aux renseignements d'une puissance amie, nous avons pu découvrir l'emplacement d'un camp d'entraînement Contra en plein air. Nous avons envoyé certains de nos avions détruire la cible, ce qu'ils ont fait. Cependant, les interceptions et les sources des services de renseignement n'indiquent pas que les Contras ont subi des pertes dans la région. Confus, un petit groupe d'hommes a enquêté sur le site. Il semble que nos avions aient peut-être ciblé les mauvaises coordonnées et frappé un champ ouvert près d'une ferme. Il semble qu'il n'y ait eu aucune victime civile, mais les bombardements ont rendu furieux les habitants qui nous ont accusés d'essayer de les chasser de leurs terres. Les Contras alimentent de telles réflexions et ont gagné en popularité."

 contra_insurgency_options.11.d: "La dernière offensive des forces Contra a réussi à isoler Managua du reste du pays. Dans la capitale, cela a conduit de nombreux manifestants à exiger la fin du conflit, mettant à rude épreuve les ressources d'un gouvernement sandiniste déjà affaibli. Face à l'imminence d'un assaut contre la capitale, le gouvernement sandiniste a finalement capitulé, appelant à un cessez-le-feu. Les Contras acceptèrent et, en un jour, les forces sandinistes acceptèrent de démobiliser et de rendre la capitale. Les forces Contra victorieuses à travers le pays ont célébré leur victoire, au milieu d'informations sporadiques selon lesquelles elles auraient commis des actes de représailles. Un comité composé des principaux dirigeants de la Contra a rencontré les médias à Managua. Ils ont affirmé qu'ils établiraient rapidement un gouvernement et organiseraient des élections libres. Interrogés sur le sort des sandinistes ou sur leur future participation aux élections, ils ont simplement déclaré que le temps déterminerait la réponse. Bien que les médias internationaux considèrent l'annonce d'élections libres comme un pas dans la bonne direction, nombreux sont ceux au Nicaragua qui doutent qu'elles aient réellement lieu."
 contra_insurgency_options.10.d: "Le gouvernement sandiniste a réussi à rassembler ses forces militaires pour stopper l'avancée des Contras. Les récentes offensives ont chassé les Contras de leurs refuges et les ont éloignés de la population. Les capacités des Contras étant considérablement affaiblies et face à la pression internationale pour mettre fin aux combats, les sandinistes ont décidé d'engager des pourparlers avec les Contras. Les Contras vaincus ont accepté de démobiliser leurs combattants et de mettre fin aux attaques contre les civils. Après la démobilisation des Contras, le gouvernement a accepté d'organiser des élections sous la direction d'observateurs internationaux venus de toute la région. Bien que les Contras et leurs partisans aient tenté de faire avancer l'engagement de démobilisation, la réalité de leur situation militaire signifiait qu'ils n'avaient d'autre choix que de mettre fin à leur lutte. Les Nicaraguayens attendent avec impatience la paix et des élections qui se dérouleront dans une atmosphère positive. Le gouvernement sandiniste reçoit des éloges internationaux pour son approche impartiale visant à mettre fin à la menace Contra."
 contra_insurgency_Decisions: "La guerre des Contras"
 contra_insurgency_Decisions_desc: "Les restes du régime Samoza, les combattants anti-Samoza trahis par les gauchistes qui ont pris le pouvoir et les Nicaraguayens anticommunistes se sont unis pour former les Contras. Ils sont unis dans leur opposition au gouvernement socialiste sandiniste et à ses atteintes à leurs droits et à leur mode de vie. Ils entretiennent des liens étroits avec les États-Unis et d'autres États anticommunistes. Le gouvernement sandiniste organise ses propres forces pour faire face à cette menace et préserver sa révolution. Les paysans nicaraguayens sont pris entre les deux camps alors qu'ils luttent désespérément pour le destin futur du Nicaragua.\n\nForce actuelle [?ROOT.contra_insurgency]%"

