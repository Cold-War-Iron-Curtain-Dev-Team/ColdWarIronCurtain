 TUTOR_politics_304: "Influence"
 TUTOR.304.t: "Influence"
 TUTOR_politics_304_desc: "§YL'influence§! est un système dans CWIC où différents pays peuvent exercer un certain niveau de contrôle sur les autres.\n\n§CGAGNER DE L'INFLUENCE§!\nAfin de gagner §YInfluence§!, vous devez sélectionner un pays étranger et dépenser §YPuissance politique§! pour augmenter votre §YInfluence§! avec lui. Les grandes nations sont plus difficiles à acquérir §YInfluence§!. Votre §YCryptage§! et §YDécryptage§! affectent respectivement le degré d' §YInfluence§! que vous pouvez gagner et résister aux autres. De plus, contracter §YPrêts§! augmente généralement l'influence §Ydu débiteur§! sur vous. De plus, des actions telles que le paiement de l'armée d'un pays étranger ou l'octroi de subventions pour la dette peuvent augmenter l'influence de §Y§! sur eux.\n\n§CLUTTE CONTRE L'INFLUENCE§!\nAvoir un niveau élevé de §Yde cryptage§! rend plus difficile pour les pays (à l'exception des prêts via §Y§!) d'obtenir §Yd'influence§! sur vous. Dans l'onglet §YDécisions§!, vous pouvez vérifier le montant de §YInfluence§! que d'autres pays ont sur vous. Cela devient problématique au-dessus de §Y15%§! et peut être dangereux au-dessus de §Y40%§!. Afin de combattre l'influence étrangère §Y§!, vous pouvez dépenser §Ypuissance politique§! pour réduire directement l'influence §Y§! d'une cible ou promouvoir §Yla souveraineté§!, ce qui rend de manière permanente légèrement plus difficile l'influence §Y§! toi.\n\n§CUSER DE SON INFLUENCE§!\nTous les pays peuvent dépenser leur §YInfluence§! sur un pays à différents niveaux. Ils peuvent voler les §Yressources§!d'une nation, prendre le contrôle partiel de son §Yéconomie§!, ou même §Rmarionner votre pays si l'influence atteint des niveaux suffisamment élevés !§! Cependant, certaines entités non nationales telles que le §YFMI§! peuvent chercher à modifier vos §Ypolitiques fiscales et sociales§! pour les adapter à leur agenda ou à ajouter §Ydes idées nationales§! qui peuvent être préjudiciables ou bénéfiques pour votre nation."
 TUTOR.304.d: "§YL'influence§! est un système dans CWIC où différents pays peuvent exercer un certain niveau de contrôle sur les autres.\n\n§CGAGNER DE L'INFLUENCE§!\nAfin de gagner §YInfluence§!, vous devez sélectionner un pays étranger et dépenser §YPuissance politique§! pour augmenter votre §YInfluence§! avec lui. Les grandes nations sont plus difficiles à acquérir §YInfluence§!. Votre §YCryptage§! et §YDécryptage§! affectent respectivement le degré d' §YInfluence§! que vous pouvez gagner et résister aux autres. De plus, contracter §YPrêts§! augmente généralement l'influence §Ydu débiteur§! sur vous. De plus, des actions telles que le paiement de l'armée d'un pays étranger ou l'octroi de subventions pour la dette peuvent augmenter l'influence de §Y§! sur eux.\n\n§CLUTTE CONTRE L'INFLUENCE§!\nAvoir un niveau élevé de §Yde cryptage§! rend plus difficile pour les pays (à l'exception des prêts via §Y§!) d'obtenir §Yd'influence§! sur vous. Dans l'onglet §YDécisions§!, vous pouvez vérifier le montant de §YInfluence§! que d'autres pays ont sur vous. Cela devient problématique au-dessus de §Y15%§! et peut être dangereux au-dessus de §Y40%§!. Afin de combattre l'influence étrangère §Y§!, vous pouvez dépenser §Ypuissance politique§! pour réduire directement l'influence §Y§! d'une cible ou promouvoir §Yla souveraineté§!, ce qui rend de manière permanente légèrement plus difficile l'influence §Y§! toi.\n\n§CUSER DE SON INFLUENCE§!\nTous les pays peuvent dépenser leur §YInfluence§! sur un pays à différents niveaux. Ils peuvent voler les §Yressources§!d'une nation, prendre le contrôle partiel de son §Yéconomie§!, ou même §Rmarionner votre pays si l'influence atteint des niveaux suffisamment élevés !§! Cependant, certaines entités non nationales telles que le §YFMI§! peuvent chercher à modifier vos §Ypolitiques fiscales et sociales§! pour les adapter à leur agenda ou à ajouter §Ydes idées nationales§! qui peuvent être préjudiciables ou bénéfiques pour votre nation."
