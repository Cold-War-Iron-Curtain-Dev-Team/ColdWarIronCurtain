 TUTOR_politics_303: "Factions"
 TUTOR.303.t: "Factions"
 TUTOR_politics_303_desc: "§YLes factions§! dans CWIC fonctionnent légèrement différemment. La plupart des §YFactions§! telles que §YNATO§! ne s'activeront que si l'un de leurs membres est attaqué ou si leur §YSphere Leader§! (comme le §EU§!§WS§!§CA§!) les appelle dans un §RWar§! pré-scénarisé tel que §RWW3§!. Pratiquement toutes les §YFactions§! ne peuvent pas être rejointes manuellement et doivent être rejointes par un événement ou un focus historique ou alt-historique. "
