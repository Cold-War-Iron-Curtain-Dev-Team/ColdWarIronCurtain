e§!, §Yle transport des troupes§!et §Yl'approvisionnement§!, §Yles convois§! sont l'une des principales raisons pour lesquelles gagner un combat naval est un combat crucial, même sur des terres interconnectées. §YLes convois§! qui ne sont pas protégés peuvent être annihilés par les §YSubmersibles§!. Les convois en combat naval apparaissent dans la ligne §YCarrier§! et seront protégés par les navires §YScreen-Line§! et §YBattle-Line§!. "
 TUTOR.2052.t: "MTG"
 TUTOR.2052.d: "§CMODULES§!\nSpécifiques à MTG, les modules §Y§! se présentent sous diverses formes.\n Les pistolets AA§! et les §Y§YSAM§!§! §Bsont respectivement des recherches issues des technologies§! Autocannon§! et SAM.\n§YLes armements§! sont des armes à faible perçage et à faibles dégâts, tandis que les ASM §Y§! sont des armes à faible perçage et à faibles dégâts. §YBlindage§! peut facilement vaincre les navires qui ont trop de §YASM§! et pas assez de §YArmements§!\n§YLes contre-mesures§! sont §GTRÈS PEU COÛTES§! et peuvent donc être considérées comme une augmentation forfaitaire à §YArmure§! lorsque §Brecherché§! et déployé sur les navires. §YCIWS§! est §Rextrêmement plus cher, surtout en £resources_strip|2 mais ajoute beaucoup de §YArmor§! au navire. Si le blindage §Y§! d'un navire est supérieur au perçage de son ennemi, même un peu, alors il infligera §Rbeaucoup moins de dégâts.§!\n§YLes modules maritimes§! sont équipés dans le slot maritime §Y§!. §YTA/FCS§! est requis pour que AA inflige une quantité décente de dégâts et augmente les dégâts de toutes les §YArmes§!. §YEW/SS§! augmente la détection §Yd'un navire§!. §YNavigation§! améliore la §YFurtivité§! d'un navire en l'aidant à éviter d'être détecté et offre des bonus lors des combats sur un terrain accidenté ou exigu. Les modules sonar §Y§! sont utilisés pour détecter les submersibles §Y§!.\n\n§CARMES SPÉCIALES§!\nLa plupart des vaisseaux ont un emplacement pour module d'arme spéciale §Y§!. Ceux-ci offrent tous une variété d'avantages différents et sont très divers et, en tant que tels, doivent être équipés avec soin.\n\n§CMOTEURS NUCLÉAIRES§!\n§YLes moteurs nucléaires§! sont recherchés dans l'onglet §BNucléaire/ADM§! et §Gne consomment aucun carburant§! tout en étant plus §Yfiables§!, ce qui fait que le navire subit beaucoup moins de risques de panne en mer ou au combat."
 
 TUTOR_military_206: "Fusée"
 TUTOR.206.t: "Fusée"
 TUTOR_military_206_desc: "L'arbre technologique §BRocketry§! est un niveau supérieur du §Ymilitaire§! qui est crucial pour les combats de milieu à fin de partie pour toutes les branches. Bien qu'il soit prudent d'y renoncer dès le début, vous devriez avoir une base solide de §YRocketry Technologies§! et §YEquipment§! avant l'ère '73 §YEra§!.\n\n§CROQUETTES BASÉES SUR L'ARMÉE§!\n§YLes ATGM§! et §YLes SAM§! sont spécialisés §YAnti-Tank§! et §YAnti-Air§! §BArmes de soutien§! qui manquent d'attaque douce, sont plus chères et rivalisent avec le milieu à la fin du jeu §YIFV Infanterie/Hélicoptères/Véhicules de combat§!. §YRocket Artillery§! inflige des quantités incroyables d'attaques douces et oblige les joueurs à utiliser plus de §Yd'hélicoptères§! et de §Yd'infanterie APC/IFV§!. Les SAM à longue portée §L§! sont utilisés pour les bâtiments anti-aériens §Y§! et augmentent leur niveau maximum ou les améliorent.\n\n§CFUSÉES BASÉES SUR L'ARMÉE DE L'AIR§!\nLes technologies §YAAM§! et §YAGM§! §B§! accordent des bonus importants aux §Yunités aériennes§! et augmentent considérablement leur attaque. Sans ces technologies §B§!, vous serez pratiquement incapable de combattre les avions air-air ennemis ou de constater que vos avions sont abattus en masse §R§! par §YSAM§! et en fin de partie §YSPAAG et unités anti-aériennes§!.\n\n§CFUSÉES BASÉES SUR LA MARINE§!\nLes technologies §YASM§! §B§! sont des modules navals §Yà faible perçage et à dégâts élevés§! en MTG ou des bonus vitaux dans un gameplay non-MTG. Lorsqu'elle est soigneusement équilibrée avec des modules d'armement §Ytrès perforants et à faibles dégâts§!, votre marine peut submerger et détruire l'ennemi. Gardez simplement un oeil sur les contre-mesures §Yet les technologies CIWS§! disponibles au moment où vous concevez vos navires, sinon les §YASM§! seront §Rinefficaces§!.\n\n§CMISSILES§!\n§YLes missiles de croisière§! sont des unités conventionnelles à usage unique que vous pouvez déployer à partir de lanceurs à longue portée dans les bases aériennes §Y§! pour infliger de nombreux dégâts en rafale à un coût élevé avant de devoir en construire davantage. §YLes missiles balistiques§! sont des armes nucléaires tactiques que vous pouvez utiliser pour infliger beaucoup plus de dégâts que les §Yles missiles de croisière§! mais sont beaucoup plus chers, §BRecherche§! coûteux et nécessitent £resources_strip|6."
