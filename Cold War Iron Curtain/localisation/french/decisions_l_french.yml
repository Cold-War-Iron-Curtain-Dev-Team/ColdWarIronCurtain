 TUTOR_politics_301: "Mécanique de l'arbre de concentration"
 TUTOR.301.t: "Mécanique de l'arbre de concentration"
 TUTOR_politics_301_desc: "Les arbres de focus §Y§! dans CWIC fonctionnent différemment des autres mods en raison de la durée extraordinairement longue de CWIC. Chaque §YÈre§!, ('49, '60, '73, '80,) §YLes arbres de concentration§! changeront. Tous les focus non terminés au moment du changement ne pourront plus être complétés, alors gardez une trace de la date et planifiez à l'avance.\n\n§CÉLECTIONS§!\nLes pays auront périodiquement des scripts §YElections§! dans lesquels vous pourrez choisir un chemin spécifique. Ces élections débloqueront généralement l'un des nombreux focus entrelacés §Yliés politiquement§! mutuellement exclusifs verrouillés derrière la balise §RToujours = Non§! dans l'arbre de focus §Y§!.\n\n§CFOCUS ÉVÉNEMENTIELS§!\nÀ part §Yles focus§! liés politiquement, les autres §RAlways = no§! les focus verrouillés sont les §Yles focus liés à un événement§!. Ils sont enfermés derrière des décisions qui impliquent des événements §Yprogrammés§! qui peuvent se produire ou se sont déjà produits et qui nécessitent un choix. Bien que rarement, certaines de ces orientations peuvent s'appuyer sur des événements ou des décisions étrangères et sont considérées comme des réponses à d'autres nations ou à des événements mondiaux. "
 TUTOR.301.d: "Les arbres de focus §Y§! dans CWIC fonctionnent différemment des autres mods en raison de la durée extraordinairement longue de CWIC. Chaque §YÈre§!, ('49, '60, '73, '80,) §YLes arbres de concentration§! changeront. Tous les focus non terminés au moment du changement ne pourront plus être complétés, alors gardez une trace de la date et planifiez à l'avance.\n\n§CÉLECTIONS§!\nLes pays auront périodiquement des scripts §YElections§! dans lesquels vous pourrez choisir un chemin spécifique. Ces élections débloqueront généralement l'un des nombreux focus entrelacés §Yliés politiquement§! mutuellement exclusifs verrouillés derrière la balise §RToujours = Non§! dans l'arbre de focus §Y§!.\n\n§CFOCUS ÉVÉNEMENTIELS§!\nÀ part §Yles focus§! liés politiquement, les autres §RAlways = no§! les focus verrouillés sont les §Yles focus liés à un événement§!. Ils sont enfermés derrière des décisions qui impliquent des événements §Yprogrammés§! qui peuvent se produire ou se sont déjà produits et qui nécessitent un choix. Bien que rarement, certaines de ces orientations peuvent s'appuyer sur des événements ou des décisions étrangères et sont considérées comme des réponses à d'autres nations ou à des événements mondiaux. "
 
