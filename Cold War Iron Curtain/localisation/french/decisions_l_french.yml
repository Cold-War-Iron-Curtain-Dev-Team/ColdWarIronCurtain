! et parcourez les §YObligations§! qui vous sont proposées à l'achat. Ils ont tous des taux d'intérêt variables de §Y§! et des durées de prêt de §Y§!. Toutes les §Yobligations§! étrangères augmentent l' §Yinfluence§! d'une autre nation sur vous. Si vous préférez éviter cela, construisez §YOffice Parks§! pour augmenter votre limite de §YDomestic Bond§!. Le pool §YDomestic Bond§! est limité mais se reconstitue au fil du temps."
 
 TUTOR_economics_102: "Politiques et édits"
 TUTOR.102.t: "Politiques et édits"
 TUTOR_economics_102_desc: "Les politiques et les décrets sont disponibles dans l'onglet politiques situé à côté de la section lois dans l'écran politique de votre pays. Toutes les politiques qui coûtent de l'argent le font en fonction de la population totale de votre pays.\n\n§CPOLITIQUES BUDGÉTAIRES§!\n§YLes politiques fiscales§! sont des politiques qui vous obligent à payer un coût d'entretien de §Y§! basé sur votre population totale de §Y§!. Ces polices offrent une variété de bonus que vous pouvez consulter en survolant chaque police. Vous ne pouvez passer qu'aux polices adjacentes et pour §O150 PP§!. L'augmentation d'une politique entraîne une période de refroidissement au cours de laquelle la politique doit être mise en oeuvre et ses installations construites. La réduction de §YLes politiques budgétaires§! n'ont pas de période de refroidissement. La plupart des pays ne peuvent pas accéder aux systèmes haut de gamme au début du jeu et devront développer leur technologie pour les mettre en oeuvre.\n\n§CPOLITIQUES SOCIALES§!\n§YLes politiques sociales§! sont des politiques qui s'accompagnent généralement de compromis qui correspondent à différents styles de jeu ou créent divers besoins. Il est généralement préférable de les voir d'un point de vue immersif ou de jeu de rôle. Certaines §YIdéologies§! vous empêchent de posséder certaines §YPolitiques sociales§!. §YLes politiques sociales§! ont toutes des coûts §YPouvoir politique§! variables et des durées de recharge en fonction de l'ampleur du changement. Souvent, certains changements peuvent se heurter à §Rune résistance violente§! de la part de la population. L'augmentation de la marginalisation des groupes raciaux dans le pays, par exemple, déclenche une §Rguerre raciale§! qui peut durer plusieurs années. \n\n§CONGLET D'INFORMATIONS§!\nLe dernier onglet vous présente un grand nombre de statistiques sur votre pays. Ces informations affiche votre répartition §GRevenu§! par source, répertorie diverses statistiques nationales telles que §YPIB§!et vous permet de modifier votre §YTaux d'imposition global§!."
 TUTOR.102.d: "Les politiques et les décrets sont disponibles dans l'onglet politiques situé à côté de la section lois dans l'écran politique de votre pays. Toutes les politiques qui coûtent de l'argent le font en fonction de la population totale de votre pays.\n\n§CPOLITIQUES BUDGÉTAIRES§!\n§YLes politiques fiscales§! sont des politiques qui vous obligent à payer un coût d'entretien de §Y§! basé sur votre population totale de §Y§!. Ces polices offrent une variété de bonus que vous pouvez consulter en survolant chaque police. Vous ne pouvez passer qu'aux polices adjacentes et pour §O150 PP§!. L'augmentation d'une politique entraîne une période de refroidissement au cours de laquelle la politique doit être mise en oeuvre et ses installations construites. La réduction de §YPolitiques budgétaires§! n'a pas de période de refroidissement et laisse l'infrastructure existante à §RDégradation§! après §Y2§! ans, après quoi vous devrez attendre à nouveau le temps de recharge. La plupart des pays ne peuvent pas accéder aux systèmes haut de gamme au début du jeu et devront développer leur technologie pour les mettre en oeuvre.\n\n§CPOLITIQUES SOCIALES§!\n§YLes politiques sociales§! sont des politiques qui s'accompagnent généralement de compromis qui correspondent à différents styles de jeu ou créent divers besoins. Il est généralement préférable de les voir d'un point de vue immersif ou de jeu de rôle. Certaines §YIdéologies§! vous empêchent de posséder certaines §YPolitiques sociales§!. §YLes politiques sociales§! ont toutes des coûts §YPouvoir politique§! variables et des durées de recharge en fonction de l'extrême du changement. Souvent, certains changements peuvent se heurter à §Rune résistance violente§! de la part de la population. L'augmentation de la marginalisation des groupes raciaux dans le pays, par exemple, déclenche une §Rguerre raciale§! qui peut durer plusieurs années. \n\n§CONGLET D'INFORMATIONS§!\nLe dernier onglet vous présente un grand nombre de statistiques sur votre pays. Ces informations affiche votre répartition §GRevenu§! par source, répertorie diverses statistiques nationales telles que §YPIB§!et vous permet de modifier votre §YTaux d'imposition global§!."
 
 TUTOR_economics_103: "Catégories/Drapeau Bâtiments"
 TUTOR.103.t: "Catégories/Drapeau Bâtiments"
 TUTOR_economics_103_desc: "Les bâtiments de drapeau sont des bâtiments construits par décision et ne se trouvent pas dans des emplacements de bâtiment. La catégorie d'État §Y§! dans le CWIC est déterminée par la population §Y§! et le niveau de développement §Y§! d'un État. Dans pratiquement tous les mods et vanilles, les catégories d'état §Y§! ne peuvent pas être mises à niveau. Les bâtiments à drapeau §Y§! sont des bâtiments qui ne sont pas construits par des moyens conventionnels et qui utilisent à la place des drapeaux d'État. Les bâtiments de prospection des ressources vanille sont un exemple de §YFlag Buildings§!.\n\n§CCatégorie d'État§!\nDans CWIC, §YEmplacements de construction§! sont déterminés par la formule suivante (§YPopulation§! en millions §Gx2§! x (§Y+50 %§! par §YNiveau de développement§!)). Vous pouvez améliorer votre niveau de développement §Y§! dans la catégorie de décision §YInvestissements économiques§!. Cela augmentera également les recettes fiscales. Vous pouvez afficher le niveau de développement §Y§! en cliquant sur l'état et en affichant la zone d'information à droite.\n\n§CBâtiments de drapeau§!\nOutre les §YRGO§! (opérations de collecte de ressources), le CWIC présente d'autres bâtiments de drapeau qui sont construits par décision ou par concentration. §YTélécoms§! (à venir) en sera un autre. Le coût de construction de ces §YFlag Buildings§! peut être vu affiché à côté de leurs décisions respectives."
 TUTOR.103.d: "Les bâtiments de drapeau sont des bâtiments construits par décision et ne se trouvent pas dans des emplacements de bâtiment. La catégorie d'État §Y§! dans le CWIC est déterminée par la population §Y§! et le niveau de développement §Y§! d'un État. Dans pratiquement tous les mods et vanilles, les catégories d'état §Y§! ne peuvent pas être mises à niveau. Les bâtiments à drapeau §Y§! sont des bâtiments qui ne sont pas construits par des moyens conventionnels et qui utilisent à la place des drapeaux d'État. Les bâtiments de prospection des ressources vanille sont un exemple de §YFlag Buildings§!.\n\n§CCatégorie d'État§!\nDans CWIC, §YEmplacements de construction§! sont déterminés par la formule suivante (§YPopulation§! en millions §Gx2§! x (§Y+50 %§! par §YNiveau de développement§!)). Vous pouvez améliorer votre niveau de développement §Y§! dans la catégorie de décision §YInvestissements économiques§!. Cela augmentera également les recettes fiscales. Vous pouvez afficher le niveau de développement §Y§! en cliquant sur l'état et en affichant la zone d'information à droite.\n\n§CBâtiments de drapeau§!\nOutre les §YRGO§! (opérations de collecte de ressources), le CWIC présente d'autres bâtiments de drapeau qui sont construits par décision ou par concentration. §YTélécoms§! (à venir) en sera un autre. Le coût de construction de ces §YFlag Buildings§! peut être vu affiché à côté de leurs décisions respectives."
 
 TUTOR_economics_104: "Agriculture"
 TUTOR.104.t: "Agriculture"
 TUTOR_economics_104_desc: "Votre nation a besoin de §Yde biens agricoles§!£resources_strip|3 pour survivre. §YLes biens agricoles§!£resources_strip|3 sont représentés par l'icône £resources_strip|3. Le manque de §Yde produits agricoles/alimentaires§!£resources_strip|3 entraînera pour votre pays une souffrance de §Rde pénalités massives§! à §Yd'efficacité de production§!, §Yde stabilité§!, et à des niveaux extrêmes, cela provoquera §Rde famine.§! §YLes biens agricoles§!£resources_strip|3 sont produits par le bâtiment §YComplexe agro-industriel§! qui produit également §YArgent§!.\n\n§CAGRO-BIOMES§!\n§YLes agrobiomes§! sont une caractéristique d'état visible sur l'écran d'informations d'état entre les bâtiments non partagés et partagés. Plus l'Agri-biome §Y§! est fertile, plus il produira. \nLes complexes agro-industriels ont les résultats de base suivants en fonction du biome agricole de l'État :\n§YMontagnes désolées§! = §G0,5§!£resources_strip|3 \n§YDésert ou toundra§! = §G1§!£resources_strip|3 \n§YDésert luxuriant ou montagnes tempérées§! = §G2§!£resources_strip|3 \n§YBoréal§! = §G3§!£resources_strip|3 \n§YTempéré §! = §G4§!£resources_strip|3\n§YToute l'année§! = §G6§!£resources_strip|3\n\n§CINFRASTRUCTURES HYDRAULIQUES§!\n§YL'infrastructure hydraulique§! est un type d'infrastructure qui améliore le rendement des complexes agro-industriels §Y§! dans l'état où ils sont construits. Si un État ne dispose pas d'infrastructures hydrauliques §Y§!, il ne produira presque pas de £resources_strip|3. Chaque niveau d'infrastructure hydraulique §Y§! augmentera la production de §G+25 %§!"
 TUTOR.104.d: "Votre nation a besoin de §Yde biens agricoles§!£resources_strip|3 pour survivre. §YLes biens agricoles§!£resources_strip|3 sont représentés par l'icône £resources_strip|3. Le manque de §Yde produits agricoles/alimentaires§!£resources_strip|3 entraînera pour votre pays une souffrance de §Rde pénalités massives§! à §Yd'efficacité de production§!, §Yde stabilité§!, et à des niveaux extrêmes, cela provoquera §Rde famine.§! §YLes biens agricoles§!£resources_strip|3 sont produits par le bâtiment §YComplexe agro-industriel§! qui produit également §YArgent§!.\n\n§CAGRO-BIOMES§!\n§YLes agrobiomes§! sont une caractéristique d'état visible sur l'écran d'informations d'état entre les bâtiments non partagés et partagés. Plus l'Agri-biome §Y§! est fertile, plus il produira. \nLes complexes agro-industriels ont les résultats de base suivants en fonction du biome agricole de l'État :\n§YMontagnes désolées§! = §G0,5§!£resources_strip|3 \n§YDésert ou toundra§! = §G1§!£resources_strip|3 \n§YDésert luxuriant ou montagnes tempérées§! = §G2§!£resources_strip|3 \n§YBoréal§! = §G3§!£resources_strip|3 \n§YTempéré §! = §G4§!£resources_strip|3\n§YToute l'année§! = §G6§!£resources_strip|3\n\n§CINFRASTRUCTURES HYDRAULIQUES§!\n§YL'infrastructure hydraulique§! est un type d'infrastructure qui améliore le rendement des complexes agro-industriels §Y§! dans l'état où ils sont construits. Si un État ne dispose pas d'infrastructures hydrauliques §Y§!, il ne produira presque pas de £resources_strip|3. Chaque niveau d'infrastructure hydraulique §Y§! augmentera la production de §G+25 %§!"
 
 TUTOR_economics_105: "Énergie et infrastructures"
 TUTOR.105.t: "Énergie et infrastructures"
 TUTOR_economics_105_desc: "§YL'énergie§!£resources_strip|7 est une ressource nouvelle et importante et §YInfrastructure§! a obtenu sa propre mise à jour et extension dans CWIC.\n\n§CÉNERGIE§!\n§YL'énergie§!£resources_strip|7 est consommée par chaque bâtiment productif du CWIC. §YRaffineries§!, §YParcs industriels§!, §YProduction militaire§!, §YParcs de bureaux§! et tous les autres bâtiments productifs utilisent l'électricité pour fonctionner eux-mêmes. Les technologies §YÉcoénergie§! réduisent la consommation §YÉnergie§!£resources_strip|7 des bâtiments. Toutes les sources d'énergie sont améliorées par les technologies §YGrid§!. §YCombustible fossile§! L'énergie est bon marché et fiable à construire mais consomme §YProduits pétrochimiques§!£resources_strip|1. Il est amélioré par la gamme technologique §YGas§!. §YL'énergie verte§! est beaucoup plus chère mais extrêmement plus difficile à bombarder et ne nécessite pas de §YProduits pétrochimiques§!£resources_strip|1. §YL'énergie nucléaire§! peut être trouvée dans l'arbre §YWMD§! et est extrêmement productive mais constitue une cible concentrée et nécessite un investissement massif de §BRecherche§!.\n\n§CINFRASTRUCTURES§!\n§YL'infrastructure§! dans CWIC possède une arborescence entière §BTechnologie§! à elle seule. §YL'infrastructure municipale§! augmente la vitesse de construction §Y§! dans un État. §YL'infrastructure de l'État§! augmente §Yl'offre§! et §Yla production de ressources§! dans un État. §YL'infrastructure hydraulique§! est nécessaire pour les complexes agro-industriels productifs §Y§! dans l'État. Vous pouvez augmenter le niveau de construction maximum dans chaque état de chaque type d' §Yinfrastructure§! en §Brecherchant§! leurs technologies respectives. La ligne technologique §YInframanagement§! est un sac de bonus général pour §YIndustry§! et §YConstruction d'infrastructures§!."
 TUTOR.105.d: "§YL'énergie§!£resources_strip|7 est une ressource nouvelle et importante et §YInfrastructure§! a obtenu sa propre mise à jour et extension dans CWIC.\n\n§CÉNERGIE§!\n§YL'énergie§!£resources_strip|7 est consommée par chaque bâtiment productif du CWIC. §YRaffineries§!, §YParcs industriels§!, §YProduction militaire§!, §YParcs de bureaux§! et tous les autres bâtiments productifs utilisent l'électricité pour fonctionner eux-mêmes. Les technologies §YÉcoénergie§! réduisent la consommation §YÉnergie§!£resources_strip|7 des bâtiments. Toutes les sources d'énergie sont améliorées par les technologies §YGrid§!. §YCombustible fossile§! L'énergie est bon marché et fiable à construire mais consomme §YProduits pétrochimiques§!£resources_strip|1. Il est amélioré par la gamme technologique §YGas§!. §YL'énergie verte§! est beaucoup plus chère mais extrêmement plus difficile à bombarder et ne nécessite pas de §YProduits pétrochimiques§!£resources_strip|1. §YL'énergie nucléaire§! peut être trouvée dans l'arbre §YWMD§! et est extrêmement productive mais constitue une cible concentrée et nécessite un investissement massif de §BRecherche§!.\n\n§CINFRASTRUCTURES§!\n§YL'infrastructure§! dans CWIC possède une arborescence entière §BTechnologie§! à elle seule. §YL'infrastructure municipale§! augmente la vitesse de construction §Y§! dans un État. §YL'infrastructure de l'État§! augmente §Yl'offre§! et §Yla production de ressources§! dans un État. §YL'infrastructure hydraulique§! est nécessaire pour les complexes agro-industriels productifs §Y§! dans l'État. Vous pouvez augmenter le niveau de construction maximum dans chaque état de chaque type d' §Yinfrastructure§! en §Brecherchant§! leurs technologies respectives. La ligne technologique §YInframanagement§! est un sac de bonus général pour §YIndustry§! et §YConstruction d'infrastructures§!."
 
 TUTOR_economics_106: "Technologie"
 TUTOR.106.t: "Technologie"
 TUTOR_economics_106_desc: "§BLa technologie§! du CWIC est étroitement liée aux technologies divisées en catégories hautement spécialisées. Vous trouverez ci-dessous une liste compilée de ce que fait chaque ligne technologique.\n\n§CONGLET INDUSTRIE§!\n§YLogistique§! - Capacité industrielle, revenus des chantiers navals, vitesse de réparation et stockage du carburant\n§YProduction§! - Capacité industrielle et plafond de productivité\n§YGestion§! - Capacité industrielle, gain et rétention d'efficacité, et réaménagement naval\n§YAgriculture§! - Améliore la production du complexe agro-industriel\n§YProduits biologiques§! - Croissance démographique (la santé des écosystèmes sera bientôt disponible)\n§YEau§! - Niveau maximum de l'infrastructure d'eau et bonus de la direction\n§YBiocarburants/Voitures électriques§! - Réduire la consommation pétrochimique civile (la santé des écosystèmes sera bientôt disponible)\n§YGénie civil§! - Vitesse de construction et réparation\n§YExcavation§! - Sortie de ressources\n§YSciences des matériaux§! - Condition préalable à de nombreuses autres technologies, améliore les revenus des raffineries et augmente leur production. Les plastiques améliorent le gain de carburant.\n§YGrille§! - Améliore toutes les sources d'énergie\n§YÉnergie verte/Ecoénergie§! - Améliore la production et le niveau maximum des centrales électriques renouvelables et réduit respectivement la consommation d'énergie des autres bâtiments\n§YGaz§! - Améliore la production d'énergie des centrales électriques à combustibles fossiles\n§YInframanegement§! - Un sac de bonus variés\n§YInfrastructure§! - Améliore le niveau maximum des infrastructures municipales et étatiques\n\n§CÉLECTRONIQUE§!\n§YTransistors§! - Condition préalable aux supercalculateurs\n§YSupercalcul§! - Augmente la vitesse de recherche\n§YMatériel§! - Prérequis pour de nombreuses autres technologies et presque toutes les technologies militaires\n§YLogiciel§! - Un sac de bonus variés\n§YInternetworking et Coms§! - Augmente la puissance de commande maximale et le gain (construction du drapeau des télécommunications à venir)\n§YConsumer Electronics§! - Augmente les revenus déjà massifs des parcs de bureaux\n§YCryptage/Déchiffrement§! - Important pour le gain d'informations\n§YRadar§! - Augmente le niveau maximum de la station radar et un mélange de bonus.\n\n§CNUCLÉAIRE§!\n§YÉnergie nucléaire§! - Améliore la production et l'efficacité de l'énergie nucléaire"
 TUTOR.106.d: "§BLa technologie§! du CWIC est étroitement liée aux technologies divisées en catégories hautement spécialisées. Vous trouverez ci-dessous une liste compilée de ce que fait chaque ligne technologique.\n\n§CONGLET INDUSTRIE§!\n§YLogistique§! - Capacité industrielle, revenus des chantiers navals, vitesse de réparation et stockage du carburant\n§YProduction§! - Capacité industrielle et plafond de productivité\n§YGestion§! - Capacité industrielle, gain et rétention d'efficacité, et réaménagement naval\n§YAgriculture§! - Améliore la production du complexe agro-industriel\n§YProduits biologiques§! - Croissance démographique (la santé des écosystèmes sera bientôt disponible)\n§YEau§! - Niveau maximum de l'infrastructure d'eau et bonus de la direction\n§YBiocarburants/Voitures électriques§! - Réduire la consommation pétrochimique civile (la santé des écosystèmes sera bientôt disponible)\n§YGénie civil§! - Vitesse de construction et réparation\n§YExcavation§! - Sortie de ressources\n§YSciences des matériaux§! - Condition préalable à de nombreuses autres technologies, améliore les revenus des raffineries et augmente leur production. Les plastiques améliorent le gain de carburant.\n§YGrille§! - Améliore toutes les sources d'énergie\n§YÉnergie verte/Ecoénergie§! - Améliore la production et le niveau maximum des centrales électriques renouvelables et réduit respectivement la consommation d'énergie des autres bâtiments\n§YGaz§! - Améliore la production d'énergie des centrales électriques à combustibles fossiles\n§YInframanegement§! - Un sac de bonus variés\n§YInfrastructure§! - Améliore le niveau maximum des infrastructures municipales et étatiques"
 TUTOR.1062.t: "Technologie"
 TUTOR.1062.d: "§CÉLECTRONIQUE§!\n§YTransistors§! - Condition préalable aux supercalculateurs\n§YSupercalcul§! - Augmente la vitesse de recherche\n§YMatériel§! - Prérequis pour de nombreuses autres technologies et presque toutes les technologies militaires\n§YLogiciel§! - Un sac de bonus variés\n§YInternetworking et Coms§! - Augmente le maximum et le gain de puissance de commande (construction du drapeau des télécommunications à venir)\n§YConsumer Electronics§! - Augmente les revenus déjà massifs des parcs de bureaux\n§YCryptage/Déchiffrement§! - Important pour le gain d'informations\n§YRadar§! - Augmente le niveau maximum de la station radar et un mélange de bonus.\n\n§CNUCLÉAIRE§!\n§YÉnergie nucléaire§! - Améliore la production et l'efficacité de l'énergie nucléaire"
 
 TUTOR_economics_107: "Achat d'équipement"
 TUTOR.107.t: "Achat d'équipement"
 TUTOR_economics_107_desc: "§YL'achat d'équipement§! vous permet d'utiliser §YMoney§! pour acheter de l'équipement pour votre armée. §G1x§! achats ont un temps de recharge de 1 an et vous permettent d'acheter instantanément de l'équipement immédiatement. Des quantités plus élevées d'achats d'équipement §Y§! ont des périodes de commande en souffrance au cours desquelles le(s) fabricant(s) §Ysous contrat§! doivent produire l'équipement à vous vendre.\n\n§CMARCHÉ CIVIL§!\nLe marché civil §Y§! est un contrat universel librement disponible sur lequel tout le monde peut acheter. Vous pouvez acheter des choses telles que §YÉquipement de soutien§!, §YÉquipement motorisé§!ou §YAvions de transport§! qui ne nécessitent pas de contrat militaire ici. Ce sont généralement des articles peu coûteux qui n'ont pas de capacités de combat et sont principalement produits par §YCivils§! §YFabricants indépendants§!.\n\n§CCONTRATS§!\nVous pouvez avoir jusqu'à 1 §YContrat§! de chaque niveau (faible, moyen, élevé) pour différentes formes d'équipement militaire §Y§! et d'armes §Y§!. Pour négocier un contrat §Y§!, sélectionnez le bouton §YNégocier un contrat§! et choisissez un §YFabricant§!. Vous aurez besoin de §Y100-300§! §Yde pouvoir politique§! pour obtenir un contrat. Vous pouvez mettre à niveau un contrat de haut niveau §Y§! vers §Yde niveau maximum§! vous permettant d'acheter §Ydes transporteurs, des croiseurs et des jets CV§! auprès d'eux. Certains fabricants §Y§! ont des niveaux techniques §Y§! plus élevés que d'autres, augmentant ainsi leur choix et la qualité de leurs équipements."
 TUTOR.107.d: "§YL'achat d'équipement§! vous permet d'utiliser §YMoney§! pour acheter de l'équipement pour votre armée. §G1x§! achats ont un temps de recharge de 1 an et vous permettent d'acheter instantanément de l'équipement immédiatement. Des quantités plus élevées d'achats d'équipement §Y§! ont des périodes de commande en souffrance au cours desquelles le(s) fabricant(s) §Ysous contrat§! doivent produire l'équipement à vous vendre.\n\n§CMARCHÉ CIVIL§!\nLe marché civil §Y§! est un contrat universel librement disponible sur lequel tout le monde peut acheter. Vous pouvez acheter des choses telles que §YÉquipement de soutien§!, §YÉquipement motorisé§!ou §YAvions de transport§! qui ne nécessitent pas de contrat militaire ici. Ce sont généralement des articles peu coûteux qui n'ont pas de capacités de combat et sont principalement produits par §YCivils§! §YFabricants indépendants§!.\n\n§CCONTRATS§!\nVous pouvez avoir jusqu'à 1 §YContrat§! de chaque niveau (faible, moyen, élevé) pour différentes formes d'équipement militaire §Y§! et d'armes §Y§!. Pour négocier un contrat §Y§!, sélectionnez le bouton §YNégocier un contrat§! et choisissez un §YFabricant§!. Vous aurez besoin de §Y100-300§! §Yde pouvoir politique§! pour obtenir un contrat. Vous pouvez mettre à niveau un contrat de haut niveau §Y§! vers §Yde niveau maximum§! vous permettant d'acheter §Ydes transporteurs, des croiseurs et des jets CV§! auprès d'eux. Certains fabricants §Y§! ont des niveaux techniques §Y§! plus élevés que d'autres, augmentant ainsi leur choix et la qualité de leurs équipements."
 
 TUTOR_economics_108: "Ressources et RGO"
 TUTOR.108.t: "Ressources et RGO"
 TUTOR_economics_108_desc: "§YLes ressources§! sont utilisées par pratiquement tout dans CWIC. La plupart des bâtiments consomment §YRessources§!. §YLes parcs industriels§! consomment £resources_strip|7, £resources_strip|5 et £resources_strip|1. §YOffice Parks§! consomment £resources_strip|7, £resources_strip|2 et £resources_strip|1. §YLes chantiers navals§! consomment £resources_strip|7, et certaines §YCentrales électriques§! consomment également des ressources spécifiques.\n\n§CRGO§!\n§YLes RGO§! ou §YLes opérations de collecte de ressources§! sont la source de la plupart des ressources que vous produisez. La plupart des États commencent déjà le jeu avec quelques §YRGO§! mais vous pouvez en construire davantage dans la catégorie de décision §YRGO§! en investissant §YMoney§! dans leur construction. De nombreux §YRGO§! nécessitent §BTechnologies d'extraction§! pour apparaître ou vous obligent à construire certains bâtiments dans l'État."
 TUTOR.108.d: "§YLes ressources§! sont utilisées par pratiquement tout dans CWIC. La plupart des bâtiments consomment §YRessources§!. §YLes parcs industriels§! consomment £resources_strip|7, £resources_strip|5 et £resources_strip|1. §YOffice Parks§! consomment £resources_strip|7, £resources_strip|2 et £resources_strip|1. §YLes chantiers navals§! consomment £resources_strip|7, et certaines §YCentrales électriques§! consomment également des ressources spécifiques.\n\n§CRGO§!\n§YLes RGO§! ou §YLes opérations de collecte de ressources§! sont la source de la plupart des ressources que vous produisez. La plupart des États commencent déjà le jeu avec quelques §YRGO§! mais vous pouvez en construire davantage dans la catégorie de décision §YRGO§! en investissant §YMoney§! dans leur construction. De nombreux §YRGO§! nécessitent §BTechnologies d'extraction§! pour apparaître ou vous obligent à construire certains bâtiments dans l'État."
