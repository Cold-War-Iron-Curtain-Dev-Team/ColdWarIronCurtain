 TUTOR_military_201: "Bases générales"
 TUTOR.201.t: "Bases générales"
 TUTOR_military_201_desc: "Il y a quelques détails importants qui sont universels à tous les mods HOI4.\n\n§CMODÈLES§!\nLes modèles doivent toujours avoir une largeur de §Y10, 20,§! ou §Y40§! car une écrasante majorité des combats se déroule sur un terrain qui supporte des multiples de §Y20§! de largeur. Tout espace restant ne sera pas rempli car les divisions §Y§! ne peuvent pas remplir partiellement les espaces. Les emplacements §YSupport§! prennent en charge jusqu'à 10 sociétés §Yindépendantes§!. Chaque §YDivision§! a accès à jusqu'à 5 §YBrigades§! qui comptent chacune jusqu'à 5 §YBataillons§!.\n\n§CSTATISTIQUES§!\nGardez un oeil sur §YOrganisation§! car il déterminera combien de temps votre division peut rester dans le combat tandis que §YForce/HP§! définit quelle partie de l'équipement et de la main d'oeuvre est perdue en cas de dommage. §YInfantry§! est l'épine dorsale de votre armée et booste massivement §YOrg§! et §YHP§!. §YLes unités d'appui-feu§! telles que l'artillerie §Y§! ou les ATGM §Y§! sont efficaces pour améliorer les dégâts bruts §Y§! mais terribles pour §Yl'organisation§! et §YHP§!. Les véhicules blindés/combat §Y§! sont essentiels pour augmenter vos statistiques §Yde percée§! et §Yde défense§! qui vous permettent d'éviter les dégâts et d'infliger plus de coups à l'ennemi qu'ils ne vous en infligent. §YTaux de récupération/Moral§! permet à votre armée de récupérer son §YOrganisation§! plus rapidement hors combat.\n\n§CSOUTENIR LES ENTREPRISES§!\n§YENTREPRISES DE SOUTIEN§! sont les 2 colonnes de gauche. Vous pouvez en avoir jusqu'à 10. Les compagnies §YFire Support§! augmentent les statistiques de combat de la division d'un montant fixe, à l'exception des compagnies §YForces spéciales§! qui améliorent les statistiques globales spécifiques de la division en effectuant des opérations spéciales derrière les lignes que vous pouvez §Brechercher§! dans les §BSF-Forces§! arbre. Les sociétés §YCombat Support§! et §YCombat Service§! accordent des statistiques spéciales telles que §YRecon§! ou §YRetranchement§!.\n\n§CAUTRES STATISTIQUES§!\nIl existe de nombreuses statistiques spéciales §Y§! qui sont principalement obtenues auprès des sociétés de support §Y§!.\n§YRecon§! - Gagnez des informations pendant la bataille pour obtenir des buffs et augmentez la probabilité de contrer les tactiques ennemies afin d'obtenir un avantage pressant ou de vaincre un ennemi plus fort\n§YRetranchement§! - Lorsqu'elles restent immobiles, les divisions peuvent se retrancher et obtenir d'énormes buffs défensifs si elles sont attaquées\n§YInitiative§! - L'une des statistiques les plus puissantes. Toute la division n'arrive pas au combat en même temps. Les divisions au combat commencent faibles et vulnérables et gagnent progressivement en puissance au fil du temps. L'initiative accélère ce processus et peut vous permettre de submerger l'ennemi ou de vaincre rapidement une force plus forte\n§YSuppression§! - Important uniquement pour les garnisons ! Affecte la capacité de la division à réprimer les insurrections dans les territoires occupés et à maintenir l'ordre efficacement.\n§YPoids§! - Affecte le temps nécessaire pour lancer une invasion navale\n§YFiabilité et capture d'équipement§! - La fiabilité affecte l'attrition. Plus il est fiable, moins il risque de subir une attrition et d'être détruit hors combat ou de tomber en panne pendant le combat. La capture d'équipement vous permet de récupérer l'équipement perdu de votre ennemi (y compris l'équipement ennemi peu fiable qui est tombé en panne sans combat)\n§YTrickleback et perte d'XP§! - Permet d'éviter la perte de main d'oeuvre et d'expérience au combat lorsque des soldats meurent/des HP sont perdus\n§YArmor vs Piercing§! - Si l'armure de l'adversaire est supérieure à celle de l'autre division, tous les dégâts sont considérablement réduits\n§YDureté§! - La dureté affecte le rapport entre les dégâts légers et durs subis. Une division dure à 30 % prendra 70 % de l'attaque douce de l'adversaire plus 30 % de son attaque dure. Les garnisons les plus difficiles subissent moins de dégâts et de morts de la part des insurgés, des émeutiers et des terroristes dans les territoires occupés\n§YAcclimatation§! - Réduit l'attrition par la chaleur ou le froid. Les équipements dont la fiabilité est inférieure à 70 % subiront presque toujours une attrition liée au climat, quelle que soit l'acclimatation.\n§YTerrain Buffs/Debuffs§! - Affectent les dégâts, la percée et la défense d'une division lors de combats sur des terrains spécifiques, visibles au bas du §YConcepteur de division§!"
 TUTOR.201.d: "Il y a quelques détails importants qui sont universels à tous les mods HOI4.\n\n§CMODÈLES§!\nLes modèles doivent toujours avoir une largeur de §Y10, 20,§! ou §Y40§! car une écrasante majorité des combats se déroule sur un terrain qui supporte des multiples de §Y20§! de largeur. Tout espace restant ne sera pas rempli car les divisions §Y§! ne peuvent pas remplir partiellement les espaces. Les emplacements §YSupport§! prennent en charge jusqu'à 10 sociétés §Yindépendantes§!. Chaque §YDivision§! a accès à jusqu'à 5 §YBrigades§! qui comptent chacune jusqu'à 5 §YBataillons§!.\n\n§CSTATISTIQUES§!\nGardez un oeil sur §YOrganisation§! car il déterminera combien de temps votre division peut rester dans le combat tandis que §YForce/HP§! définit quelle partie de l'équipement et de la main d'oeuvre est perdue en cas de dommage. §YInfantry§! est l'épine dorsale de votre armée et booste massivement §YOrg§! et §YHP§!. §YLes unités d'appui-feu§! telles que l'artillerie §Y§! ou les ATGM §Y§! sont efficaces pour améliorer les dégâts bruts §Y§! mais terribles pour §Yl'organisation§! et §YHP§!. Les véhicules blindés/combat §Y§! sont essentiels pour augmenter vos statistiques §Yde percée§! et §Yde défense§! qui vous permettent d'éviter les dégâts et d'infliger plus de coups à l'ennemi qu'ils ne vous en infligent. §YTaux de récupération/Moral§! permet à votre armée de récupérer son §YOrganisation§! plus rapidement hors combat.\n\n§CSOUTENIR LES ENTREPRISES§!\n§YENTREPRISES DE SOUTIEN§! sont les 2 colonnes de gauche. Vous pouvez en avoir jusqu'à 10. Les compagnies §YFire Support§! augmentent les statistiques de combat de la division d'un montant fixe, à l'exception des compagnies §YForces spéciales§! qui améliorent les statistiques globales spécifiques de la division en effectuant des opérations spéciales derrière les lignes que vous pouvez §Brechercher§! dans les §BSF-Forces§! arbre. Les sociétés §YCombat Support§! et §YCombat Service§! accordent des statistiques spéciales telles que §YRecon§! ou §YRetranchement§!."
 TUTOR.2012.t: "Plus de statistiques"
 TUTOR.2012.d: "§CAUTRES STATISTIQUES§!\nIl existe de nombreuses §Ystatistiques spéciales§! qui sont principalement obtenues grâce aux §Ysociétés de soutien§!.\n§YRecon§! - Gagnez des informations pendant la bataille pour obtenir des buffs et augmentez la probabilité de contrer les tactiques ennemies afin d'obtenir un avantage pressant ou de vaincre un ennemi plus fort\n§YRetranchement§! - Lorsqu'elles restent immobiles, les divisions peuvent se retrancher et gagner d'énormes buffs défensifs si elles sont attaquées\n§YInitiative§! - L'une des statistiques les plus puissantes. Toute la division n'arrive pas au combat en même temps. Les divisions au combat commencent faibles et vulnérables et gagnent progressivement en puissance au fil du temps. L'initiative accélère ce processus et peut vous permettre de submerger l'ennemi ou de vaincre rapidement une force plus forte\n§YSuppression§! - Important uniquement pour les garnisons ! Affecte la capacité de la division à réprimer les insurrections dans les territoires occupés et à maintenir l'ordre efficacement.\n§YPoids§! - Affecte le temps nécessaire pour lancer une invasion navale\n§YFiabilité et capture d'équipement§! - La fiabilité affecte l'attrition. Plus il est fiable, moins il risque de subir une attrition et d'être détruit hors combat ou de tomber en panne pendant le combat. La capture d'équipement vous permet de récupérer l'équipement perdu de votre ennemi (y compris l'équipement ennemi peu fiable qui est tombé en panne sans combat)\n§YTrickleback et perte d'XP§! - Permet d'éviter la perte de main d'oeuvre et d'expérience au combat lorsque des soldats meurent/des HP sont perdus\n§YArmor vs Piercing§! - Si l'armure de l'adversaire est supérieure à celle de l'autre division, tous les dégâts sont considérablement réduits\n§YDureté§! - La dureté affecte le rapport entre les dégâts légers et durs subis. Une division dure à 30 % prendra 70 % de l'attaque douce de l'adversaire plus 30 % de son attaque dure. Les garnisons les plus difficiles subissent moins de dégâts et de morts de la part des insurgés, des émeutiers et des terroristes dans les territoires occupés\n§YAcclimatation§! - Réduit l'attrition par la chaleur ou le froid. Les équipements dont la fiabilité est inférieure à 70 % subiront presque toujours une attrition liée au climat, quelle que soit l'acclimatation.\n§YTerrain Buffs/Debuffs§! - Affectent les dégâts, la percée et la défense d'une division lors de combats sur des terrains spécifiques, visibles au bas du §YConcepteur de division§!"
 
 TUTOR_military_202: "SF-Forces et déploiements d'équipements"
 TUTOR.202.t: "SF-Forces et déploiements d'équipements"
 TUTOR_military_202_desc: "§YSF-Forces§! est un groupe de technologies §B§! qui fournissent une myriade d'avantages universels non doctrinaires pour combattre sur divers terrains, améliorent la capacité de combat des §Ybataillons de choc§! tels que les §YMarines§!, et améliorent la capacité des très puissantes forces spéciales §Y§! §YEntreprises de soutien§!. Outre les bataillons standard, §YMarines mécanisés et aéroportés§!, §YCavalry§!et §YAir Cavalry§! sont débloqués via cet arbre. La plupart des munitions §Y§! et des équipements auxiliaires d'infanterie §Y§! ne sont pas déployées par défaut, mais les décisions de déploiement §Y§! sont nécessaires pour en bénéficier.\n\n§CForces SF§!\n§YSF-Forces§! est un groupe de §BTechnologies§! qui accorde un grand nombre d'avantages à différentes zones de votre armée qui n'impliquent pas de batailles directes conventionnelles. Les bataillons de choc §Y§! tels que les §YMarines§!, les §YAirborne§!ou les §YMountaineers§! comptent sur les avantages de §YSF-Forces§!. Il y a 3 arbres différents dans §YSF-Forces§! chacun avec 3 avantages et une ligne distincte §YTactiques spéciales et entraînement§! pour les forces spéciales mutuellement exclusives §BTechnologies§! qui se concentrent sur la qualité ou la quantité.\n§YMountain/Arctic Warfare§! accorde des avantages aux combats dans les climats froids et en montagne. §YDesert Warfare§! fait la même chose mais pour les climats chauds. §YGuerre amphibie§! accorde des statistiques améliorées à §YMarines§! lors des combats en terrain amphibie ou des bonus à §YInvasions navales§!. §YLanding Craft§! améliore la capacité et la vitesse de §YNaval Invasion§!. §YOpérations d'assaut aérien§! accorde des bonus aux §YParachutistes§!. §YForces spéciales de l'armée, de la marine et de l'air§! débloquez et améliorez les puissants bataillons de soutien des forces spéciales §Y§! qui effectuent des §Yopérations spéciales§! dans les coulisses pour accorder des améliorations globales à la division qu'ils servent.\n\n§CDÉPLOIEMENTS§!\n§YLes équipements auxiliaires d'infanterie§! et §Yles munitions§! §Bles technologies§! n'accordent pas automatiquement leurs avantages. Au lieu de cela, ils débloquent §YDécisions de déploiement§! où vous devez les déployer au fil du temps dans vos troupes. Vous pouvez accélérer leur déploiement en dépensant §YCommand Power§!. Si vous avez un grand nombre de §Ydivisions§! par rapport aux §Yusines militaires§!, les déploiements prendront beaucoup plus de temps, alors faites attention aux petites divisions §Ydéconnectées et contenant du spam.§!"
 TUTOR.202.d: "§YSF-Forces§! est un groupe de technologies §B§! qui fournissent une myriade d'avantages universels non doctrinaires pour combattre sur divers terrains, améliorent la capacité de combat des §Ybataillons de choc§! tels que les §YMarines§!, et améliorent la capacité des très puissantes forces spéciales §Y§! §YEntreprises de soutien§!. Outre les bataillons standard, §YMarines mécanisés et aéroportés§!, §YCavalry§!et §YAir Cavalry§! sont débloqués via cet arbre. La plupart des munitions §Y§! et des équipements auxiliaires d'infanterie §Y§! ne sont pas déployées par défaut, mais les décisions de déploiement §Y§! sont nécessaires pour en bénéficier.\n\n§CForces SF§!\n§YSF-Forces§! est un groupe de §BTechnologies§! qui accorde un grand nombre d'avantages à différentes zones de votre armée qui n'impliquent pas de batailles directes conventionnelles. Les bataillons de choc §Y§! tels que les §YMarines§!, les §YAirborne§!ou les §YMountaineers§! comptent sur les avantages de §YSF-Forces§!. Il y a 3 arbres différents dans §YSF-Forces§! chacun avec 3 avantages et une ligne distincte §YTactiques spéciales et entraînement§! pour les forces spéciales mutuellement exclusives §BTechnologies§! qui se concentrent sur la qualité ou la quantité.\n§YMountain/Arctic Warfare§! accorde des avantages aux combats dans les climats froids et en montagne. §YDesert Warfare§! fait la même chose mais pour les climats chauds. §YGuerre amphibie§! accorde des statistiques améliorées à §YMarines§! lors des combats en terrain amphibie ou des bonus à §YInvasions navales§!. §YLanding Craft§! améliore la capacité et la vitesse de §YNaval Invasion§!. §YOpérations d'assaut aérien§! accorde des bonus aux §YParachutistes§!. §YForces spéciales de l'armée, de la marine et de l'air§! débloquez et améliorez les puissants bataillons de soutien des forces spéciales §Y§! qui effectuent des §Yopérations spéciales§! dans les coulisses pour accorder des améliorations globales à la division qu'ils servent.\n\n§CDÉPLOIEMENTS§!\n§YLes équipements auxiliaires d'infanterie§! et §Yles munitions§! §Bles technologies§! n'accordent pas automatiquement leurs avantages. Au lieu de cela, ils débloquent §YDécisions de déploiement§! où vous devez les déployer au fil du temps dans vos troupes. Vous pouvez accélérer leur déploiement en dépensant §YCommand Power§!. Si vous avez un grand nombre de §Ydivisions§! par rapport aux §Yusines militaires§!, les déploiements prendront beaucoup plus de temps, alors faites attention aux petites divisions §Ydéconnectées et contenant du spam.§!"
 
 TUTOR_military_203: "Armée"
 TUTOR.203.t: "Armée"
 TUTOR_military_203_desc: "L'Armée §Y§! est tout aussi importante que les autres branches, mais c'est la plus complexe et le noyau de votre armée.\n\n§CINFANTERIE§!\n§YL'infanterie§! est l'épine dorsale de votre armée, elle fournit les §Yl'organisation§! et les §YHP§! de votre armée. §YInfanterie mobile§! accorde plus de §YOrganisation§! et §YHP§!. §YIFV/Heavy Mechanized Infantry§! a le plus d'armure et possède des statistiques de combat supplémentaires. §YCavalerie aérienne§! est la plus rapide et a la meilleure §YPercée§! et §YDéfense§!. §YAPC/Mechanized Infantry§! est rapide et correctement blindé.\n\n§CVÉHICULES BLINDÉS/DE COMBAT§!\n§YLes chars§! fournissent beaucoup de §YBreakthrough§! et §YDéfense§! ainsi que d'assez bonnes statistiques de combat et sont extrêmement durs. Les chasseurs de chars §Y/véhicules de combat de manoeuvre§! fonctionnent de la même manière que les chars §Y§! mais avec une attaque plus dure et moins douce et sont mal blindés. Les hélicoptères d'attaque §Y§! sont extrêmement puissants mais limités pour servir d'une seule compagnie de soutien §Y§! par §YDivision§! Il est conseillé d'en utiliser un grand nombre.\n\n§YAPPUI-FEU§!\n§YL'appui-feu§! est très diversifié et constitue la majorité de vos dégâts infligés. L'artillerie §Ylégère, moyenne et lourde§! est optimisée respectivement pour les rôles défensifs, offensifs et de dégâts purs. Les canons automatiques §Y§! fournissent §YAnti-Air§!, une petite quantité de §YDéfense§!et une attaque douce. Les transporteurs SAM §Y§! sont similaires aux canons automatiques §Y§! mais ne fournissent que §YAnti-Air§! mais le font avec beaucoup plus de puissance. Les pistolets à tir direct §Y§! fournissent beaucoup de §Yperçants§! et une attaque dure et une petite quantité d'attaque douce. Les §YATGM/ATGM Carriers§! fonctionnent de la même manière mais sont beaucoup plus coûteux et se concentrent très fortement sur un rôle anti-blindage avec du pur §YPiercing§! et une puissance d'attaque dure.\n\n§CSOUTENIR LES ENTREPRISES§!\n§YLes compagnies de soutien§! fournissent des statistiques et des modificateurs spéciaux à votre armée ou fonctionnent comme des bataillons supplémentaires §YFire Support§! dans l'emplacement de la compagnie. Il existe une variété de variables mobiles plus puissantes de §YSociétés de support§! dans l'arborescence §YSupport§! §BTechnologie§!. §YLes hélicoptères§! sont de loin les variantes les plus puissantes."
