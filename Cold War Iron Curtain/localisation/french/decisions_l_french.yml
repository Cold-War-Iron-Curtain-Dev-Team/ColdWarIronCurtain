 DOMESTIC_FILM_INDUSTRY_DESC: "L'industrie cinématographique [ROOT.GetAdjective] s'est considérablement développée au cours de la dernière décennie. Avec une population avide de divertissement, nous avons tout à gagner d'une production cinématographique conçue pour attiser le sentiment patriotique."
 IMPORTED_FILM_INDUSTRY_DESC: "Nos bienfaiteurs et alliés font un usage stratégique des films de propagande. Avec un petit investissement, nous pourrions projeter ces productions dans tout notre propre pays afin de stimuler l'effort de guerre parmi notre peuple."
