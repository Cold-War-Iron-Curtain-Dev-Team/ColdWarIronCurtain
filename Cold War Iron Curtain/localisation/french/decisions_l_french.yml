 RUS_Constitutional_Crisis: "La crise constitutionnelle russe de 1993"
 Russia_Crisis_Desc: "La décision d'Eltsine de dissoudre le Parlement a conduit à une impasse, culminant avec le bombardement de la Maison Blanche russe. Si Eltsine n'agit pas rapidement, la crise pourrait dégénérer en un conflit civil violent et prolongé, mettant en péril la transition démocratique et les réformes économiques de la Russie."
 RUS_rally_pro_yeltsin_protesters: "Rassemblement des manifestants pro-Eltsine"
 RUS_cut_parliaments_power: "Couper le pouvoir du Parlement"
 RUS_denounce_opposition_leadership: "Dénoncer les dirigeants de l'opposition"
 RUS_solicit_support_from_george_soros: "Solliciter le soutien de George Soros"
 RUS_deploy_police_to_the_streets_of_moscow: "Déployer la police dans les rues de Moscou"
 RUS_address_the_nation: "S'adresser à la nation"
 RUS_send_the_kantemer_division: "Envoyez la division Kantemir"
