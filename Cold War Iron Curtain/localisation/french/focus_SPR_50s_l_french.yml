 spr.tr.1:0 "Nous reformerons notre armée grâce à nos seules connaissances"
 SPR_mama_bear:0 "§R Pour un certain prix, nous demanderons la protection des Soviétiques§!"
 spr.tr.2:0 "Il est temps de chasser le fascisme !"
 SPR_independent_army:0 "Armée indépendante"
 SPR_independent_army_desc:0 "A cause de notre isolation, nous ne pouvons pas compter sur l'aide d'autres nation pour notre armée. A la place,nous devons le faire avec nos propres connaissances."
 veteran_of_the_national_revolutionary_war:0 "Vétérans de la guerre révolutionnaire nationale"
 SPR_industrial_effort:0 "Effort industriel"
 SPR_industrial_effort_desc:0 "Cela fait 10 ans que la guerre civile espagnole a pris fin, et il y a encore des parties du pays qui n'ont pas été reconstruites avec succès et des usines qui n'ont pas été restaurées. Redoublons d'efforts pour reconstruire nos infrastructures."
 SPR_construction_effort:0 "Stimuler la fabrication locale"
 SPR_construction_effort_desc:0 "Dans le cadre du plan d'autarcie, nous devons apporter un soutien gouvernemental aux entreprises locales pour qu'elles se développent."
 SPR_construction_effort_2:0 "Soutenir la fondation de SEAT"
 SPR_construction_effort_2_desc:0 "Depuis 1940, nous avons essayé de développer notre industrie automobile. Cependant, à cause de notre manque d'expertise dans le domaine automobile, nous avons décidé de trouver un partenaire étranger pouvant nous aider. Pendant notre rétablissement après la guerre civile et la guerre mondiale, le projet a été suspendu. Maintenant, nous avons réussi à obtenir le soutien de FIAT et, à ce titre, nous devons soutenir la fondation de Sociedad Española de Automóviles de Turismo, S.A. par l'Instituto Nacional de Industria."
 SPR_construction_effort_3:0 "Effort de construction III"
 SPR_construction_effort_3_desc:0 "Notre production industrielle croît à un rythme soutenu grâce au plan d'autarcie, et l'expansion de nos infrastructures a considérablement amélioré notre capacité industrielle. Nous devons travailler pour poursuivre ces développements."
 SPR_mining_development:0 "Fondation de l'ENSIDESA"
 SPR_mining_development_desc:0 "Dans le cadre de l'industrialisation et de la modernisation de l'économie espagnole, une nouvelle entreprise publique Empresa Nacional Siderúrgia Sociedad Anónima (ENSIDESA) doit être fondée pour augmenter la production d'acier en Espagne."
 SPR_steel_industry:0 "Industrie sidérurgique"
 SPR_steel_industry_desc:0 "Nous avons besoin d'acier pour aider notre industrie automobile à rivaliser avec les géants italiens et allemands. Il y a des gisements de minerai de fer en Espagne qui attendent d'être transformé en acier. Nous devons saisir cette opportunité."
 SPR_oil_development:0 "Développement pétrolier"
 SPR_oil_development_desc:0 "Nous avons besoin de gisements de pétrole si nous voulons un jour disposer des ressources nécessaires pour construire une économie industrialisée, sans parler de mener des guerres. Il y a des gisements pétroliers en Espagne qui n'attendent que d'être exploités !"
 SPR_chromium_development:0 "Développement du chrome"
 SPR_chromium_development_desc:0 "Le chrome est une ressource importante dans le développement d'équipement lourd et de vaisseaux de grande envergure. Aussi, nous devons trouver une région riche en chrome en Espagne et commencer à le miner."
 SPR_production_effort:0 "Fondation du CETME"
 SPR_production_effort_desc:0 "Centro de Estudios Técnicos de Materiales Especiales ou CETME va être une entreprise pour développer des armes à feu pour notre armée."
 SPR_production_effort_3:0 "Développement de l'industrie de l'armement domestique"
 SPR_production_effort_3_desc:0 "Nous devons être autosuffisants concernant notre armée. Développons nos industries nationales d'armement et développons nos propres armes à feu."
 SPR_infrastructure_effort:0 "Effort d'infrastructure"
 SPR_infrastructure_effort_desc:0 "L'Espagne a toujours eu de mauvaises infrastructures, résultat de l'instabilité et de la mauvaise gestion des gouvernements successif à travers le 18e, 19e et début du 20e siècle. Il est temps que nous démariions la construction de nouvelles infrastructures, et tirons l'Espagne vers la modernité."
 SPR_infrastructure_effort_2:0 "Réseau d'autopista"
 SPR_infrastructure_effort_2_desc:0 "Nous devrons commercer par la construction d'un réseau autoroutier, sur le modèle de celui de l'ancienne Allemagne nazie. Ainsi, nous pouvons mieux relier les villes et déplacer nos citoyens dans tout le pays à plus grande vitesse."
 SPR_extra_tech_slot:0 "Universidad de Navarra"
 SPR_extra_tech_slot_desc:0 "L'institution a été fondée sous le nom d'Estudio General de Navarra le 17 octobre 1952 avec l'encouragement de Saint Josemaría Escrivá, le chef de l'Opus Dei. À l'origine une faculté de droit avec huit professeurs et quarante-huit étudiants, elle est aujourd'hui classée et considérée comme la meilleure université privée d'Espagne."
 SPR_nuclear_effort:0 "Effort nucléaire"
 SPR_extra_tech_slot_2:0 "Emplacement de recherche supplémentaire II"
 SPR_secret_weapons:0 "Armes secrètes"
 SPR_secret_weapons_desc:0 "À cette époque appelée guerre froide, nous devrons travailler au développement de nos propres projets d'armes secrètes. Avions à réaction, Missiles balistiques, même notre propre programme d'armes nucléaires. Tout nous sera clairement expliqué."
 SPR_flexible_navy:0 "Marine flexible"
 SPR_flexible_navy_desc:0 "L'époque des grandes marines est révolue. Afin de procéder au développement naval, nous devrons adopter nos doctrines pour utiliser la guerre sous-marine et anti-sous-marine pour éloigner les ennemis."
 SPR_reform_officer_corps:0 "Corps des officiers moderne"
 SPR_reform_officer_corps_desc:0 "Grâce aux efforts des Américains, nous pouvons maintenant disposer d'un corps d'officiers compétent pour rendre l'armée espagnole viable à l'avenir."
 SPR_american_license_agreements:0 "Accords de licence américains"
 SPR_american_weapon_sale_Copy_Copy:0 "Vente d'armes américaines III"
 SPR_american_weapon_sale_Copy_Copy_desc:0 "Les États-Unis ont un surplus d'équipement après la Seconde Guerre mondiale qu'ils sont prêts à nous vendre. Nous devons profiter de cet accord."
 SPR_american_weapon_sale_Copy:0 "Vente d'armes américaines II"
 SPR_american_weapon_sale_Copy_desc:0 "Les États-Unis ont un surplus d'équipement après la Seconde Guerre mondiale qu'ils sont prêts à nous vendre. Nous devons profiter de cet accord."
 SPR_american_weapon_sale:0 "Vente d'armes américaines"
 SPR_american_weapon_sale_desc:0 "Les États-Unis ont un surplus d'équipement après la Seconde Guerre mondiale qu'ils sont prêts à nous vendre. Nous devons profiter de cet accord."
 SPR_american_mic_contracts:0 "Contrats avec le CMI américain"
 SPR_american_mic_contracts_desc:0 "Obtenons des contrats des industries militaires américaines pour aider la recherche et le développement de nos besoins militaires."
 SPR_american_alignment:0 "Alignement américain"
 SPR_american_alignment_desc:0 "Les États-Unis sont l'un des principaux vainqueurs de la Seconde Guerre mondiale. Développons nos forces militaires sous leur tutelle."
 SPR_american_aircraft_training:0 "Entrainement aérien américain"
 SPR_american_aircraft_training_desc:0 "L'Armée de l'air des États-Unis a de nombreux as qui peuvent nous apprendre à mieux voler, tirer et, dans l'ensemble, à mieux combattre. Amenons leurs as en Espagne pour former nos pilotes."
 SPR_american_advisors:0 "Conseillers Américains"
 SPR_american_advisors_desc:0 "L'armée américaine compte de nombreux officiers expérimentés qu'elle peut envoyer en Espagne en tant que conseillers, pour enseigner à nos officiers et les aider à former nos soldats."
 SPR_american_airfield_development:0 "Développements américain des aérodromes"
 SPR_american_airfield_development_desc:0 "En utilisant les bases américaines à Saragosse, Torrejón et Morón comme modèle, développons nos autres bases aériennes de manière aussi efficientes que le modèle américain."
 SPR_american_rocket_tech:0 "Technologie de fusée américaine"
 SPR_american_rocket_tech_desc:0 "L'Amérique a développé des armes à base de roquettes et est sur la voie du développement d'armes à base de missiles. Nous devons faire partie de cette affaire."
 SPR_american_mechanized_equipment:0 "Matériel mécanisé américain"
 SPR_american_mechanized_equipment_desc:0 "Les États-Unis ont développé une formidable plate-forme pour l'infanterie mécanisée. L'Espagne a besoin d'en acquérir pour équiper notre force d'infanterie mécanisée en plein essor."
 SPR_american_tanks:0 "Chars américains"
 SPR_american_tanks_desc:0 "Un certain nombre de chars moyens et lourds de fabrication américaine sont tombés en désuétude après la Seconde Guerre mondiale. Peut-être pourrions-nous en acquérir quelques-unes pour équiper nos forces blindées."
 SPR_american_intelligence_aid:0 "Aide au renseignement américaine"
 SPR_american_intelligence_aid_desc:0 "La CIA peut nous aider à entraîner nos espions à extirper les ennemis de l'Espagne. Centralisons notre agence de renseignement étrangère en une seule basée sur le modèle de la CIA."
 SPR_american_anti_air_defences:0 "Aide américaine au développement anti-aérien"
 SPR_american_anti_air_defences_desc:0 "Les armes antiaériennes américaines ont facilement dépassé celles utilisées par l'Allemagne et l'Italie pendant la Seconde Guerre mondiale et ont continué de s'améliorer après la guerre. Apprenons d'eux et acquérons ces armes."
 SPR_american_doctrine_air:0 "Doctrine aérienne américaine"
 SPR_american_doctrine_air_desc:0 "Alignons notre doctrine aérienne sur celle des Américains afin de mieux contrer les doctrines utilisées par l'empire soviétique."
 SPR_american_bombers:0 "Bombardiers américains"
 SPR_american_bombers_desc:0 "Las bombardiers américaines sont capables de transporter des armes nucléaires et de lourdes charges. Bien que nous n'ayons aucun désir d'armes nucléaires pour le moment, en être capable ferait de notre pays une grande puissance. Nous avons simplement besoin de mettre la main dessus."
 SPR_american_doctrine:0 "Doctrine américaine"
 SPR_american_doctrine_desc:0 "Alignons notre doctrine militaire sur celle des Américains afin de mieux contrer les doctrines utilisées par l'empire soviétique."
 SPR_american_armed_divisions:0 "Divisions armées américaines"
 SPR_american_surplus_equipment:0 "Surplus d’équipement américain"
 SPR_american_surplus_equipment_desc:0 "Les États-Unis ont beaucoup d'équipements restant de la Seconde Guerre mondiale qui sont transmis à des éléments peu recommandables. Rachetons-en quelques-uns pour leur bien et pour le nôtre."
 SPR_american_fighters:0 "Chasseurs américains"
 SPR_american_fighters_desc:0 "Il y a un grand nombre d'avions à réaction américains qui n'attendent que d’être acheté par l'Espagne. Acquérons un stock d'avions à réaction américains pour notre armée."
 SPR_reform_officer_corps_2:0 "Corps des officiers moderne"
 SPR_reform_officer_corps_2_desc:0 "Grâce à un dur labeur, nous avons réussi à constituer et à former notre corps d'officiers à partir des leçons apprises pendant la Guerre civile espagnole et par la Division Bleue. Maintenant, affrontons l'avenir apporté par la guerre froide avec une armée et un corps d'officiers compétents !"
 SPR_develop_a_native_mic:0 "Développer un complexe militaro-industriel local"
 SPR_aviation_effort:0 "Effort d'aviation"
 SPR_aviation_effort_desc:0 "L'aviation est un domaine que toute nation moderne doit maîtriser. Assurons-nous de développer nos propres doctrines aériennes afin de ne pas prendre de retard sur les autres pays."
 SPR_army_effort:0 "Effort de l'armée"
 SPR_army_effort_desc:0 "Malgré la sophistication croissante de la guerre aérienne et navale, le combat au sol est toujours la clé des futures guerres."
 SPR_equipment_effort:0 "Effort d'équipement"
 SPR_equipment_effort_desc:0 "Les limites de l'équipement pouvant être transporté par l'infanterie sont constamment repoussées, même de nos jours. Nous devons nous concentrer à donner à nos troupes les meilleurs outils disponibles pour le travail."
 SPR_motorization_effort:0 "Effort de motorisation"
 SPR_motorization_effort_desc:0 "La mobilité et la protection sont essentielles pour amener l'infanterie sur le terrain et en sortir en toute sécurité. Développons des véhicules plus efficaces pour y parvenir."
 SPR_fighter_focus:0 "Priorité aux chasseurs"
 SPR_fighter_focus_desc:0 "Nous n'avons pas vu le dernier des combats aériens, même après la fin de la Seconde Grande Guerre. Garder une longueur d'avance dans le développement des avions de combat, en particulier l'utilisation d'avions à réaction, nous donnera un avantage à l'avenir."
 SPR_bomber_focus:0 "Priorité aux bombardiers"
 SPR_bomber_focus_dec:0 "Lorsque les gens du futur parleront de l'horreur des guerres d'aujourd'hui, le feu qui pleut du ciel figurera en bonne place. Nous ferons de notre mieux pour que ces histoires soient racontées par nos ennemis."
 SPR_doctrine_effort:0 "Effort de doctrine"
 SPR_doctrine_effort_desc:0 "Les doctrines militaires qui ont défini le combat au sol pendant la Seconde Grande Guerre seront, bien qu'elles soient toujours d'actualité, un jour terriblement dépassées. Nous devons mettre nos plus grands esprits à la tâche de façonner la pensée militaire de demain."
 SPR_aviation_effort_2:0 "Développer les Bases Aériennes"
 SPR_CAS_effort:0 "Développer l'appui aérien rapproché"
 SPR_CAS_effort_desc:0 "Une armée moderne a besoin du soutien de véhicules non seulement au sol, mais aussi dans les airs."
 SPR_NAV_effort:0 "Effort sur l'aviation navale"
 SPR_NAV_effort_desc:0 "Un pays entouré des deux côtés par l'eau signifie que la priorité doit être donnée à nos avions de guerre navale pour patrouiller dans les eaux de l'Atlantique et de la Méditerranée."
 SPR_rocket_effort:0 "Effort de fusée"
 SPR_rocket_effort_desc:0 "Les moteurs de fusée permettent le développement d'armes de missiles, l'avenir de la puissance destructrice et du combat aérien. Les pionniers de ces technologies nous permettront de prendre l'ennemi par surprise."
 SPR_special_forces:0 "Efforts spéciaux"
 SPR_special_forces_desc:0 "Nous avons besoin de forces d'élite ; les troupes de montagne et les parachutistes devraient être notre priorité."
 SPR_mechanization_effort:0 "Effort de mécanisation"
 SPR_mechanization_effort_desc:0 "C'est en reconsidérant les perspectives offertes par l'infanterie motorisée que nous pourrons repousser les limites des véhicules que nous construisons actuellement."
 SPR_equipment_effort_2:0 "Effort d'équipement"
 SPR_equipment_effort_2_desc:0 "Nous devons poursuivre nos efforts pour doter l'infanterie et les troupes de soutien du meilleur matériel actuellement disponible."
 SPR_doctrine_effort_2:0 "Effort de doctrine II"
 SPR_doctrine_effort_2_desc:0 "Les champs de bataille ont changé, pas seulement après la Seconde Guerre mondiale, mais également lors des tout derniers conflits. Nos doctrines doivent donc continuer de s'adapter à ces mutations."
 SPR_armor_effort:0 "Effort sur les blindés"
 SPR_armor_effort_desc:0 "Forts de l'expérience acquise en mécanisant l'infanterie, nous pouvons améliorer aussi les blindés."
 SPR_equipment_effort_3:0 "Effort d'équipement III"
 SPR_equipment_effort_3_desc:0 "Nous nous concentrerons sur nos derniers efforts pour créer l'arme d'infanterie ultime, celle qui rivalisera avec celles proposées par les principaux fabricants tels que les États-Unis, l'Union soviétique, la Belgique, l'Allemagne ou d'autres!"
 SPR_purge_officer_corps:0 "Purger le corps des officiers"
 SPR_soviet_scuds:0 "Scuds soviétiques"
 SPR_backwards_engineer_soviet_designs:0 "Ingénierie inversée du matériel soviétique"
 SPR_research_advances_air:0 "Développement de la recherche aérienne"
 SPR_more_surplus_equipment:0 "Surplus d’équipement soviétique supplémentaire"
 SPR_soviet_bombers:0 "Bombardiers soviétiques"
 SPR_soviet_air_doctrine:0 "Doctrine aérienne soviétique"
 SPR_soviet_army_doctrine:0 "Doctrine militaire soviétique"
 SPR_soviet_armed_divisions:0 "Divisions armées soviétiques"
 SPR_non_aligned:0 "Neutralité armée"
 SPR_non_aligned_desc:0 "De nos jours, nous ne pouvons pas compter sur les États-Unis pour aider à reconstruire nos forces de peur qu'ils ne révèlent une faille dans notre doctrine. Nous développerons nos propres stratagèmes pour redevenir une grande puissance!"
 SPR_tungsten_extraction:0 "Extraction de tungstène"
 SPR_naval_effort:0 "Effort naval"
 SPR_naval_effort_desc:0 "L'expansion de la flotte doit être une priorité absolue. Affectons toutes les ressources disponibles à la construction de chantiers navals et menons des recherches dans le domaine des navires légers de surface."
 SPR_large_navy:0 "Grande marine"
 SPR_large_navy_desc:0 "Nous nous concentrerons sur le développement d'une grande flotte de surface, pour revenir à l'époque de l'armada espagnole d'autrefois. L'Espagne dominera les mers une fois de plus !"
 SPR_cruiser_effort:0 "Effort sur les croiseurs"
 SPR_cruiser_effort_desc:0 "Avant de chercher à faire des avancées très poussées dans le domaine des cuirassés légers les plus perfectionnés, il vaut mieux commencer par améliorer nos croiseurs."
 SPR_submarine_effort:0 "Effort sur les sous-marins"
 SPR_submarine_effort_desc:0 "Nous étudierons l'utilisation, et exploiterons l'utilisation de sous-marins modernes en utilisant les leçons tirées de l'utilisation par l'Allemagne des Sous-marins allemands pendant la Seconde Guerre mondiale. À partir de là, nous développerons nos propres submersibles, plus efficaces."
 SPR_capital_ships_effort:0 "Effort sur les navires capitaux"
 SPR_capital_ships_effort_desc:0 "La nation avec le plus de cuirassés régnera sur les océans. Les cuirassés et bientôt les porte-avions représentent l'ancien et le nouveau en supériorité navale."
 SPR_destroyer_effort:0 "Effort sur les destroyers"
 SPR_destroyer_effort_desc:0 "En étudiant la conception et l'utilisation stratégique des sous-marins après la Seconde Guerre mondiale, nous avons également appris à contrer ces stratégies. Les destroyers seront encore plus critiques pour ce rôle."
 SPR_industrial_development:0 "Instituto Nacional de Industria"
 SPR_industrial_development_desc:0 "La vision de Francisco Franco de l'économie espagnole tourne autour de l'idée d'autarcie, ou d'autosuffisance.\nAvec la dévastation de la guerre et l'isolement commercial, l'Espagne était beaucoup plus arriérée économiquement dans les années 1940 qu'elle ne l'avait été une décennie plus tôt. L'inflation a grimpé en flèche, la reconstruction économique a échoué, la nourriture était rare et, certaines années, l'Espagne a enregistré des taux de croissance négatifs."
 SPR_New_Housing:0 "Nouveaux logements"
 SPR_New_Housing_desc:0 "Non seulement le développement des infrastructures sur le continent est impératif, mais nos colonies et protectorats en Afrique ont également besoin d'un tel développement. Construisons de nouveaux logements et encourageons l'émigration vers les territoires africains."
 SPR_Colonial_Infrastructure:0 "Infrastructures coloniales"
 SPR_Colonial_Infrastructure_desc:0 "Malgré nos ressources limitées, nous devons continuer à construire des infrastructures à l'étranger et poursuivre nos efforts pour établir des provinces hispanophones en Afrique. Ce faisant, nous pouvons élever ces régions à un niveau similaire à celui du continent lui-même."
 SPR_Colonial_Industry:0 "Industrie coloniale"
 SPR_Colonial_Industry_desc:0 "La capacité industrielle des colonies est pauvre. Commençons immédiatement à développer les industries dans les colonies."
 SPR_Colonial_Military_Industry:0 "Industrie militaire coloniale"
 SPR_Colonial_Military_Industry_desc:0 "Avoir des garnisons coloniales est important pour la police coloniale espagnole. Malheureusement, les armes les plus récentes mettent souvent du temps à atteindre ces garnisons. Construisons des installations militaires pour que nos forces puissent recevoir leurs armes le plus rapidement possible."
 SPR_Lessons_of_the_Civil_War:0 "Leçons de la guerre civile"
 SPR_Lessons_of_the_Civil_War_desc:0 "Beaucoup a été appris de la guerre civile espagnole, et des exploits de la Division Bleue. Cela a  conduit au développement de nouvelles doctrines à utiliser par l'armée espagnole. Poursuivons ces progrès et développons de nouvelles armes et stratégies développées à partir de la guerre."
 SPR_Expand_the_Military:0 "Elargir l’armée"
 SPR_Expand_the_Military_desc:0 "Nous devons réaliser une expansion de l'armée. Le temps du deuil et de la lassitude de la guerre est révolu. Commençons une campagne de recrutement dans toute l'Espagne pour augmenter nos effectifs."
 SPR_Colonial_Military_Integration:0 "Guardia Colonial"
 SPR_Colonial_Military_Integration_desc:0 "Si le recrutement en Espagne proprement dite n'est plus un problème, les garnisons coloniales manquent de personnel. Recrutons des locaux dans l'armée et enseignons-leur le service à la nation espagnole."
 SPR_Expand_Domestic_Military_Industry:0 "Développement de l'industrie de l'armement domestique"
 SPR_The_Spanish_Political_Sphere:0 "La sphère politique espagnole"
 SPR_The_Spanish_Political_Sphere_desc:0 "Depuis la fin de la Guerre civile espagnole, la sphère politique de l'Espagne a été largement dominée par Francisco Franco et la Falange Española Tradicionalista y de las Juntas de Ofensiva Nacional Sindicalista. Mais alors que nous entrons dans les années 1950, de nombreux événements peuvent façonner l'avenir de l'État espagnol."
 SPR_Sattelite_Morocco:0 "Satelliser le Maroc"
 SPR_Annex_Morocco:0 "Annexer le Maroc"
 SPR_Strengthen_Falange:0 "Renforcer la Phalange"
 SPR_Strengthen_Falange_desc:0 "Franco a dirigé avec succès le cours de la politique espagnole tout au long des années 40 tumultueuses. Nous devons renforcer l'emprise du FET y de las JONS sur l'Espagne et veiller à ce qu'il reste au pouvoir."
 SPR_Democratic_Underground_Copy:0 "Réseau démocratique clandestin"
 SPR_Democratic_Underground_desc:0 "Le fascisme n'a pas sa place dans le monde moderne ! Nous devons créer un réseau démocratique clandestin pour le combattre."
 SPR_Democratic_Underground:0 "Réseau démocratique clandestin"
 SPR_Communist_Partisans:0 "Partisans communistes"
 SPR_Rappoachment_with_America:0 "Rapprochement avec l’Amérique"
 SPR_Rappoachment_with_America_desc:0 "Nous avons réussi à éviter le conflit avec les Alliés occidentaux et le Komintern en grande partie parce que nous savions nous ne devions pas nous associer à Hitler. Malgré tout, l'Amérique nous considère comme un allié potentiel. Dans des moments comme ceux-ci, nous ne pouvons pas nous permettre d'être ennemis des Américains. Il est temps de commencer à rétablir de bonnes relations."
 SPR_The_Pact_of_Madrid:0 "Le pacte de Madrid"
 SPR_The_Pact_of_Madrid_desc:0 "Le Pacte de Madrid mettra fin à une période de quasi-isolement pour l'Espagne. La signature de ce pacte avec les États-Unis nous permettra d'obtenir l'aide économique et militaire nécessaire, en échange de l'octroi d'installations militaires qui seront mises en place et exploitées par la marine et l'aviation américaines."
 SPR_Suppress_Left_Wing_Movements:0 "Supprimer les mouvements de gauche"
 SPR_Suppress_Left_Wing_Movements_desc:0 "Les mouvements de gauche sont une menace dangereuse pour notre contrôle sur le pays. En tant que traîtres à l'État, ils ne méritent ni soutien ni indulgence et doivent être éradiqués."
 SPR_Algerian_War_Opportunity:0 "Opportunité de la guerre d'Algérie"
 SPR_End_of_the_Algerian_War:0 "Rester en dehors de l'Algérie"
 SPR_Intervene_in_Algeria1:0 "Intervenir en Algérie"
 SPR_Reshuffle_the_Cabinet:0 "Manifestations contre l'isolement"
 SPR_Reshuffle_the_Cabinet_desc:0 "Nombreux sont ceux en Espagne qui estiment que la politique isolationniste actuelle imposée par les Alliés occidentaux nuit à l'Espagne. Nous devons mettre fin à cette erreur diplomatique par tous les moyens nécessaires."
 SPR_Reliance_on_Falange:0 "Fascisme traditionnel"
 SPR_Reliance_on_Falange_desc:0 "L'idéologie phalangiste de Franco n'est pas la même chose que le fascisme traditionnel. Aussi, nous devons nous débarrasser de lui et amener quelqu'un de plus traditionnel à sa place pour mener l'Espagne vers la gloire!"
 SPR_Democratic_Reforms:0 "Réformes Démocratiques"
 SPR_Demand_Morocco:0 "Demander le Maroc"
 SPR_Demand_Morocco_desc:0 "Nous avons signé un traité avec la France en 1912 pour diviser le Maroc en deux zones d'occupation, l'Espagne recevant le Rif et une zone tampon avec la province espagnole du Sahara, tandis que la France contrôlerait le reste. Cependant, nos intérêts nationaux font d'une telle situation une menace. Afin de sécuriser nos intérêts au Maroc et de sécuriser la patrie elle-même, le Maroc doit être uni sous notre domination."
 SPR_Invade_Libya:0 "Envahir la Libye"
 SPR_Invade_Libya_desc:0 "La famille El-Senussi règne désormais sur l'ensemble de la Libye depuis la chute de l'empire italien. Plus important encore, les El-Senussi contrôlent un bon pourcentage des réserves de pétrole du pays qui sont à notre portée. Nous avons besoin de ce pétrole, alors dessinons un plan pour conquérir ce territoire!"
 SPR_Strengthen_Ties_To_Portugal:0 "Renforcer les liens avec le Portugal"
 SPR_Support_French_Nationalists:0 "Soutenir les nationalistes français"
 SPR_The_Concordat:0 "Le Concordat"
 SPR_War_With_Brazil:0 "Guerre avec le Brésil"
 SPR_Reclaim_Venezuela:0 "Reprendre le Venezuela"
 SPR_Reclaim_Venezuela_desc:0 "Le Venezuela est le pays d'origine du traître Simon Bolivar, dont les exploits ont conduit à la perte de l'Amérique du Sud au profit des révolutionnaires. Pour la gloire de tous les Hispaniques, rétablissons la Capitainerie générale du Venezuela !"
 SPR_Reclaim_Cuba:0 "Reprendre Cuba"
 SPR_Reclaim_Cuba_desc:0 "Depuis que nous avons perdu Cuba en 1898, l'île est tombée dans la petite dictature et la corruption sociale. Il est temps que nous récupérions cette colonie rebelle pour la nôtre et que nous élevions la stature de la race hispanique."
 SPR_Falangist_Propaganda_in_Latin_America:0 "Propagande phalangiste en Amérique latine"
 SPR_Falangist_Propaganda_in_Latin_America_desc:0 "Les différentes nations d'Amérique latine ont vu de quoi l'Espagne était capable à la suite de notre reconquête du Venezuela et de Cuba. Il est temps qu'ils voient le vrai chemin du Falango-fascisme!"
 SPR_Propose_Hispanic_Unification:0 "Proposer l'unification des nations hispaniques"
 SPR_Propose_Hispanic_Unification_desc:0 "Avec un grand nombre de nos partenaires hispanophones dans les Caraïbes maintenant engagés dans la pensée phalangiste, le moment est venu pour nos dirigeants de se rencontrer pour discuter d'une patrie unie pour tous les hispanophones. Tous les peuples sous une seule bannière, la bannière de l'Espagne!"
 SPR_Align_with_Mao:0 "S'aligner avec Mao"
 SPR_Maoist_Backed_Coup:0 "Coup d'Etat soutenu par les maoïstes"
 SPR_Cultural_Revolution:0 "Révolution culturelle"
 SPR_Condemn_Soviet_Agression:0 "Condamner l'agression soviétique"
 SPR_The_Second_Spanish_Civil_War:0 "Seconde guerre civile espagnole"
 SPR_Intervene_in_Algeria:0 "Intervenir en Algérie"
 SPR_Seek_Soviet_Support:0 "Chercher le soutien soviétique"
 SPR_Soviet_Backed_Coup:0 "Coup d'Etat soutenu par les soviétiques"
 SPR_The_Five_Year_Plan:0 "Le premier plan quinquennal"
 SPR_Subvert_the_Spanish_Church:0 "Subvertir l’Église espagnole"
 SPR_Seek_Western_Support:0 "Soutient occidental pour la démocratie"
 SPR_Seek_Western_Support_desc:0 "Il y a un certain nombre de nations et de factions en Amérique et en Europe qui préféreraient soutenir un régime démocratique en Espagne plutôt qu'un régime autocratique. La France en particulier serait un digne partisan de la fin du régime franquiste."
 SPR_Another_Spanish_Civil_War:0 "Une autre guerre civile espagnole"
 SPR_Declare_the_Spanish_Republic:0 "Déclarer la république espagnole"
 SPR_Rebuild_Spain:0 "Reconstruire l'Espagne"
 SPR_Embrace_Capitalism:0 "Embrasser le capitalisme"
 SPR_Embrace_Capitalism_desc:0 "La politique protectionniste de Franco fait plus de mal que de bien a l'Espagne. Pour faciliter un véritable miracle économique, nous devons embrasser le capitalisme."
 SPR_Seek_Closer_Ties_to_France:0 "Renforcer les liens avec la France"
 SPR_Seek_Closer_Ties_to_France_desc:0 "La France est la plus puissante des démocraties proche de nous, et a toujours été un allié fidèle au cours des siècles. Il est tout naturel pour nous de rechercher des liens avec nos amis français."
 SPR_Influence_Portugal:0 "Soutenir la démocratie au Portugal"
 SPR_Influence_Portugal_desc:0 "Salazar a régné sur le Portugal pendant trop longtemps. Nous soutiendrons secrètement des éléments républicains au Portugal dans l'espoir de les voir finalement renverser le gouvernement et le remplacer par une véritable République portugaise."
 SPR_Aid_France_in_Algeria:0 "Aider la France en Algérie"
 SPR_Aid_France_in_Algeria_desc:0 "Contrairement à nos entités coloniales, l'Algérie fait partie intégrante de la République française. Les nationalistes algériens sont des traîtres à la France, et à ce titre, nous devrions venir soutenir notre allié et faire la guerre à ces traîtres."
 SPR_Begin_Decolonization:0 "Décolonisation"
 SPR_Begin_Decolonization_desc:0 "De nos jours, nous devons donner aux peuples de nos colonies l'autodétermination. Nous accorderons immédiatement à nos colonies leur indépendance!"
 SPR_Spanish_Republic_Joins_NATO:0 ""
 SPR_Reliance_on_Opus_Dei:0 "Statu quo"
 SPR_Reliance_on_Opus_Dei_desc:0 "Le cabinet a été remanié et rempli de personnes fidèles à Franco et à l'État espagnol."
 SPR_the_Ifni_War:0 "Combattre jusqu’à la fin"
 SPR_the_Ifni_War_desc:0 "Le Royaume marocain menace de prendre le contrôle de nos territoires dans la région. Nous ne laisserons pas cela arriver. Ralliez nos hommes, nous défendrons nos territoires jusqu'au bout!"
 SPR_Peace_With_Morocco:0 "Paix avec le Maroc"
 SPR_Peace_With_Morocco_desc:0 "Il est temps que nous proposions la paix avec les Marocains et renoncions au contrôle de territoires spécifiques qu'ils revendiquent non sans raison."
 SPR_Proclaim_the_Spanish_Empire:0 "Proclamer le l'Union hispanique"
 SPR_Proclaim_the_Spanish_Empire_desc:0 "Nous sommes maintenant prêts pour cela. C'est pour cela que nous nous sommes battus. C'est pourquoi Franco a dû partir. Pour l'unité de tous les Hispaniques. ¡Por el Imperio Español! ¡Por la Unión Hispana!"
 SPR_Independence_for_Spanish_Guinea:0 "Indépendance de la Guinée espagnole"
 SPR_The_Begining_of_the_Spanish_Miracle:0 "Le début du miracle espagnol"
 SPR_The_Begining_of_the_Spanish_Miracle_desc:0 "Grâce aux efforts de nos technocrates et industriels, notre économie a eu une croissance encore jamais vue. Nous pouvons enfin laisser derrière nous l'héritage laissé par Napoléon !"
 SPR_Bureacratic_Centralism:0 "Centralisme bureaucratique"
 SPR_Aid_Algerian_Rebels:0 "Aider les rebelles algériens"
 SPR_Revolution_in_Portugal:0 "Révolution au Portugal"
 SPR_Invade_Portugal:0 "Envahir le Portugal"
 SPR_Join_the_Warsaw_Pact:0 "Rejoindre le Pacte de Varsovie"
 SPR_Create_the_Western_Pact:0 "Créer le Pacte Occidental"
 SPR_Second_Five_Year_Plan:0 "Deuxième plan quinquennal"
 SPR_Declare_the_Iberian_Peoples_Republic:0 "Proclamer la République populaire ibérique"
 SPR_Declare_a_Constiutional_Monarchy:0 "Proclamer une monarchie constitutionnelle"
 SPR_American_Development:0 "Développement américain"
 SPR_Join_NATO_early:0 "Rejoindre l'OTAN de façon précoce"
 SPR_60s_Liberalisation:0 "Libéralisation"
 SPR_60s_Liberalisation_desc:0 "L'Espagne a été une dictature militaire depuis 1939. Au cours de ces 20 années, nous avons connu divers hauts et bas, mais c'est certain, quelque chose doit être changé."
 SPR_60s_Spanish_economy:0 "L’économie espagnole"
 SPR_60s_Spanish_economy_desc:0 "Alors que l'économie espagnole est en plein essor, nous sommes confrontés à deux factions au sein du gouvernement : la voie de l'autarcie, qui croit que nous devrions augmenter les dépenses militaires, et les technocrates, qui essaient de maintenir la voie actuelle. Le choix sera difficile, et cela n'affecterait la nation espagnole pas seulement de manière économique."
 SPR_60s_Legacy_of_Fascism:0 "Héritage du fascisme"
 SPR_60s_Legacy_of_Fascism_desc:0 ""
 SPR_60s_Expand_the_Army:0 "Elargir l’armée"
 SPR_60s_Expand_the_Army_desc:0 ""
 SPR_60s_Morocco_Crisis:0 "Zemla Intifada"
 SPR_60s_Morocco_Crisis_desc:0 ""
 SPR_60s_Reject_Decolonisation:0 "Rejeter la décolonisation"
 SPR_60s_Reject_Decolonisation_desc:0 "Les Africains ne peuvent pas gouverner dans leur propre pays. Ils sont sans instruction, affamés et ils ne connaissent rien à l'économie ou à l'armée. Nous perdrions également beaucoup de ressources précieuses si nous leur laissions l'indépendance. Par conséquent, tant que l'État espagnol existera, nos colonies resteront des colonies."
 SPR_60s_Critics_of_the_Government:0 "Critiques contre le gouvernement"
 SPR_60s_Critics_of_the_Government_desc:0 ""
 SPR_Long_Live_Franco:0 "Vive Franco !"
 SPR_Long_Live_Franco_desc:0 ""
 SPR_60s_Demand_Gibraltar:0 "Demander Gibraltar"
 SPR_60s_Demand_Gibraltar_desc:0 ""
 SPR_60s_Atlanatic_Fleet:0 "Flotte de l'Atlantique"
 SPR_60s_Atlanatic_Fleet_desc:0 ""
 SPR_60s_Franco_Steps_Down:0 "Franco démissionne"
 SPR_60s_Franco_Steps_Down_desc:0 ""
 SPR_60s_Third_Spanish_Republic:0 "Troisième république espagnole"
 SPR_60s_Third_Spanish_Republic_desc:0 ""
 SPR_60s_Legacy_of_the_Spanish_Civil_War:0 "Héritage de la guerre civile espagnole"
 SPR_60s_Legacy_of_the_Spanish_Civil_War_desc:0 ""
 SPR_60s_Carrillo_returns_from_exile:0 "Carrillo rentre d'exil"
 SPR_60s_Carrillo_returns_from_exile_desc:0 ""
 SPR_60s_Align_with_China:0 "S'aligner sur la Chine"
 SPR_60s_Align_with_China_desc:0 ""
 SPR_60s_The_Vietnam_War:0 "La Guerre du Vietnam"
 SPR_60s_The_Vietnam_War_desc:0 ""
 SPR_Send_Medical_and_Economic_Aid:0 "Envoyer de l'aide médicale et économique"
 SPR_Send_Medical_and_Economic_Aid_desc:0 ""
 SPR_60s_Monarchists_take_power:0 "Les monarchistes prennent le pouvoir"
 SPR_60s_Monarchists_take_power_desc:0 "Juan I vient de déclarer une nouvelle ère pour l'Espagne. La monarchie a été restaurée et maintenant une question se pose. Devons-nous avoir une monarchie constitutionnelle comme au Royaume-Uni ou au Japon, ou Juan devrait-il gouverner le pays d'une main de fer ?"
 SPR_60s_Constitutional_monarchy:0 "Monarchie constitutionnelle"
 SPR_60s_Constitutional_monarchy_desc:0 "Il n'y a pratiquement aucune grande puissance qui ait un roi seul régnant sur le pays. Nous avons eu Franco comme dictateur-et nous n'en avons pas besoin d'un autre."
 SPR_60s_Give_Guinea_Independence:0 "Donnez l'indépendance à la Guinée"
 SPR_60s_Give_Guinea_Independence_desc:0 ""
 SPR_60s_Suarez_as_Prime_Minister:0 "Suarez premier ministre"
 SPR_60s_Suarez_as_Prime_Minister_desc:0 "Le charme, l'intelligence mais aussi la vigilance d'Adolfo Suarez ont été les raisons pour lesquelles le roi a décidé que ce jeune homme deviendrai le nouveau premier ministre d'Espagne. Sous sa direction, l'Espagne prospérera."
 SPR_Send_Volunteers:0 "Envoyer des volontaires au Vietnam"
 SPR_Send_Volunteers_desc:0 ""
 SPR_Seek_American_Payment:0 "Demander des paiements américains"
 SPR_Seek_American_Payment_desc:0 ""
 SPR_60s_Espanoles_en_Vietnam:0 "Españoles en Vietnam"
 SPR_60s_Espanoles_en_Vietnam_desc:0 ""
 SPR_60s_Embrace_the_Carlist_Faction:0 "La faction carliste"
 SPR_60s_Embrace_the_Carlist_Faction_desc:0 ""
 SPR_Embrace_Traditional_Catholicism:0 "Embrasser le Catholicisme traditionnel"
 SPR_Embrace_Traditional_Catholicism_desc:0 ""
 SPR_60s_Apply_for_NATO_Membership:0 "Demande d'adhésion à l'OTAN"
 SPR_60s_Apply_for_NATO_Membership_desc:0 ""
 SPR_Heavy_Regulated_Economy:0 "Économie fortement régulée"
 SPR_Heavy_Regulated_Economy_desc:0 ""
 SPR_60s_Democratisation_of_the_regime:0 "Démocratisation du régime"
 SPR_60s_Democratisation_of_the_regime_desc:0 ""
 SPR_60s_Join_NATO:0 "Rejoindre l'OTAN"
 SPR_60s_Join_NATO_desc:0 ""
 SPR_60s_Allow_political_parties:0 "Autoriser les partis politiques"
 SPR_60s_Allow_political_parties_desc:0 ""
 SPR_60s_Presidential_elections:0 "Élections présidentielles"
 SPR_60s_Presidential_elections_desc:0 "Cela fait des décennies depuis les dernières élections. Les gens sont heureux, mais ils ne le seront pas pour longtemps, car en tant que candidats, nous avons deux conservateurs, qui sont prêts à établir une dictature pire que le régime de Franco. Ce serait probablement nos dernières élections pour cette décennie."
 SPR_60s_Manuel_Fraga_Iribarne:0 "Manuel Fraga Iribarne"
 SPR_60s_Manuel_Fraga_Iribarne_desc:0 ""
 SPR_60s_La_calle_es_mia:0 "La Calle Es Mia"
 SPR_60s_La_calle_es_mia_desc:0 ""
 SPR_60s_Right_wing_republic:0 "République de droite"
 SPR_60s_Right_wing_republic_desc:0 ""
 SPR_60s_Carlos_Arias_Navarro:0 "Carlos Arias Navarro"
 SPR_60s_Carlos_Arias_Navarro_desc:0 "Navarro a gagné. Bien qu'il envisage des referenda pour la Catalogne et le Basque, il souhaite également restaurer le parti phalangiste en Espagne. Il a critiqué et dénoncé Franco pour ne pas être entré dans l'Axe parce que, comme il l'a déclaré, les troupes espagnoles feraient une grande différence dans la Seconde Guerre mondiale. Le peuple le critique déjà et soupçonne ouvertement qu'il aurait pu truquer les élections."
 SPR_60s_Denounce_Franco:0 "Dénoncer Franco"
 SPR_60s_Denounce_Franco_desc:0 ""
 SPR_60s_Refererndums_for_Catalonia_and_Basque:0 "Referenda pour la Catalogne et le Pays basque"
 SPR_60s_Refererndums_for_Catalonia_and_Basque_desc:0 ""
 SPR_60s_Condemn_Portuguese_Colonialism:0 "Condamner le colonialisme portugais"
 SPR_60s_Condemn_Portuguese_Colonialism_desc:0 ""
 SPR_60s_Maintain_technocracy:0 "Maintenir la technocratie"
 SPR_60s_Maintain_technocracy_desc:0 ""
 SPR_60s_Continued_Industrialization:0 "Continuer le programme d'industrialisation"
 SPR_60s_Continued_Industrialization_desc:0 ""
 SPR_60s_Spanish_Economic_Miracle:0 "Le miracle économique espagnol"
 SPR_60s_Spanish_Economic_Miracle_desc:0 ""
 SPR_Invest_in_Infrastructure:0 "Investir dans les infrastructures"
 SPR_Invest_in_Infrastructure_desc:0 "Les routes, les autoroutes et les chemins de fer sécurisent notre économie. Nous ne pouvons pas prospérer si nous utilisons des routes qui ont été construites avant la Seconde Guerre mondiale et la guerre civile. Nous devons lancer de grands projets de reconstruction des infrastructures espagnoles ou notre récent miracle se retournera contre nous."
 SPR_Free_Trade_with_NATO_Members:0 "Libre-échange avec les pays de l'OTAN"
 SPR_Free_Trade_with_NATO_Members_desc:0 ""
 SPR_Market_Economy:0 "Embrasser l’économie de marché"
 SPR_Market_Economy_desc:0 ""
 SPR_60s_Rethink_about_our_economy:0 "Repenser notre structure économique"
 SPR_60s_Rethink_about_our_economy_desc:0 ""
 SPR_60s_Military_spending:0 "Augmenter les dépenses militaires"
 SPR_60s_Military_spending_desc:0 ""
 SPR_60s_Autarks_once_again:0 "Nouvelle autarcie"
 SPR_60s_Autarks_once_again_desc:0 ""
 SPR_60s_New_military_airfields:0 "Nouveaux aérodromes"
 SPR_60s_New_military_airfields_desc:0 "Des aérodromes dans tout le pays assureront notre supériorité aérienne en Espagne et veilleront à ce qu'aucune des forces d'invasion ne rentre en vie chez elle !"
 SPR_60s_Militarist_economy:0 "Économie militariste"
 SPR_60s_Militarist_economy_desc:0 ""
 SPR_60s_Maintain_ban_on_communists:0 "Maintenir l'interdiction du communisme"
 SPR_60s_Maintain_ban_on_communists_desc:0 ""
 SPR_60s_Demand_Puerto_Rico:0 "Demander Porto Rico"
 SPR_60s_Demand_Puerto_Rico_desc:0 ""
 SPR_60s_Demand_unification_with_Portugal:0 "Demander l'unification avec le Portugal"
 SPR_60s_Demand_unification_with_Portugal_desc:0 ""
 SPR_60s_Liberation_of_Cuba:0 "Libérer Cuba"
 SPR_60s_Liberation_of_Cuba_desc:0 "Le Cuba d'aujourd'hui est écœurant. Le communisme a détruit leur économie et ils ont amené le monde au bord de la Troisième Guerre mondiale. Avec notre flotte atlantique, nous devrions pouvoir atteindre Cuba et la ramener en Espagne."
 SPR_60s_Death_of_Franco:0 "La mort de Franco"
 SPR_60s_Death_of_Franco_desc:0 "Notre dirigeant Franco est mort. Il a fait grandir l'Espagne et l'a ramené vers ses jours de gloire. Personne ne peut remplacer ni lui ni son héritage, mais nous ne pouvons survivre sans un gouvernement ferme."
 SPR_60s_Junta_takes_over:0 "La Junte prend le pouvoir"
 SPR_60s_Junta_takes_over_desc:0 ""
 SPR_60s_Supress_separatists:0 "Réprimer les séparatistes"
 SPR_60s_Supress_separatists_desc:0 ""
 SPR_60s_Proclaim_Spanish_Empire:0 "Proclamer un nouvel Empire espagnol"
 SPR_60s_Proclaim_Spanish_Empire_desc:0 ""
 SPR_60s_Eradicate_elections:0 "Suspendre les élections"
 SPR_60s_Eradicate_elections_desc:0 "Les élections sont absurdes. Les gens votent, et ils maudissent ensuite le gouvernement et le président pour lesquels ils ont voté. Il est temps d'arrêter cela. Maintenant, nous avons le sage Iribarne comme président et personne ne peut le remplacer."
 SPR_Curtail_Social_Rights:0 "Restreindre les droits civils"
 SPR_Curtail_Social_Rights_desc:0 ""
 SPR_Paramilitarism:0 "Les élections sont absurdes. Les gens votent, et ils maudissent ensuite le gouvernement et le président pour lesquels ils ont voté. Il est temps d'arrêter cela. Maintenant, nous avons le sage Iribarne comme président et personne ne peut le remplacer."
