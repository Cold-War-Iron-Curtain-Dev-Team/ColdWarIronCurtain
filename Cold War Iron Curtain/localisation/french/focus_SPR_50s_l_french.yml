 SPR_1960s_destroyer_effort:0 "Effort du Destructeur"
 SPR_assasinate_franco:0 "Noche des cuchillos largos"
 SPR_assasinate_franco_desc:0 "Notre Nuit des Longs Couteaux fera « disparaître » ces manifestants pour toujours."
 SPR_promote_spanish_culture:0 "Promouvoir la culture espagnole"
 SPR_promote_spanish_culture_desc:0 "La corrida, le flamenco et d'autres activités espagnoles ont été promues par l'Espagne de Franco."
 SPR_meomiers_of_civil_war:0 "Souvenirs de la guerre civile"
 SPR_meomiers_of_civil_war_desc:0 "La guerre a été horrible et personne ne veut la répéter. Mais c'est en même temps un excellent outil de propagande contre Franco."
 SPR_oust_Franco:0 "Arrêter Franco"
 SPR_oust_Franco_desc:0 "Franco doit être arrêté et emprisonné pour ses crimes contre l'Espagne."
 SPR_extradite_nazi_criminals:0 "Extrader les criminels nazis"
 SPR_extradite_nazi_criminals_desc:0 "De nombreux nazis se sont enfuis en Espagne en 44 et 45. Aujourd'hui, nous les renvoyons en Allemagne."
 SPR_tve_foc:0 "J'ai trouvé la Télévision Española"
 SPR_tve_foc_desc:0 "Fondée par le gouvernement de Francisco Franco, TVE est une chaîne de télévision gouvernementale dont le but est de diffuser la propagande gouvernementale. Après la mort de Franco, TVE est devenue une chaîne de télévision publique régulière."
 SPR_crackdown_on_autonomic_regions:0 "Répression contre les régions autonomes"
 SPR_crackdown_on_autonomic_regions_desc:0 "Ces régions veulent peut-être l'indépendance, mais nous ne la leur accorderons pas."
 SPR_join_nato:0 "Rejoindre l'OTAN"
 SPR_join_nato_desc:0 "L'Organisation américaine du Traité de l'Atlantique Nord représente le phare de la liberté vers laquelle aspire la République espagnole. Avec la bénédiction des autres nations du monde libre, rejoignons-nous et faisons notre place dans cette alliance."
 SPR_democratic_defence_pact:0 "Pacte de défense démocratique"
 SPR_democratic_defence_pact_desc:0 "L'OTAN ne sert pas les meilleurs intérêts de la République espagnole. Formons notre propre pacte de défense local pour défendre l'Espagne et ses amis et alliés contre toute menace à laquelle nous sommes confrontés."
 SPR_agracultural_fixes:0 "Améliorer l'agriculture"
 SPR_agracultural_fixes_desc:0 "En raison de notre initiative d'industrialisation, les populations rurales de notre pays ont conduit, avant et après la guerre civile, à l'émigration de nos agriculteurs vers les villes. Nous devrons améliorer nos pratiques agricoles pour compenser, ce qui inclura à terme la mécanisation de notre agriculture."
 SPR_auxilo_social:0 "Auxiliaire Social"
 SPR_auxilo_social_desc:0 "L'Auxilio Social est une organisation humanitaire et un outil de propagande important pour le régime franquiste. Parmi les nombreux travaux qu'ils ont réalisés, citons la récupération des enfants qui ont fui l'Espagne franquiste après la victoire des nationalistes dans la guerre civile espagnole."
 SPR_end_of_autarky:0 "Fin de l'autarcie"
 SPR_end_of_autarky_desc:0 "Grâce à notre rapprochement avec d'autres nations et à notre réintroduction sur la scène mondiale, nous pouvons désormais mettre fin à la pratique de l'autarcie mise en place depuis la Seconde Guerre mondiale."
 SPR_focus_on_identitety:0 "Identité catholique"
 SPR_focus_on_identitety_desc:0 "Nous, le peuple espagnol, nous sommes toujours considérés comme un peuple catholique. Depuis l'époque de la Reconquista espagnole, nous avons toujours cru en la volonté de notre seigneur et sauveur, et nous continuerons à ancrer cela dans la psyché espagnole."
 SPR_spanish_democracy:0 "Démocratie totalitaire"
 SPR_spanish_democracy_desc:0 "Même si nous nous sommes alignés sur les puissances occidentales, la Phalange détient toujours le véritable pouvoir en Espagne. Nous présenterons un minimum de démocratie, mais en fin de compte, la volonté de Franco sera réalisée."
 SPR_recruitment_campaign:0 "Campagne de recrutement"
 SPR_recruitment_campaign_desc:0 "Aliste aujourd'hui pour le défenseur de l'État espagnol ! Ce seront les mots qui convaincront le peuple de rejoindre et de défendre la nation espagnole."
 SPR_continue_diplomatic_isolation:0 "Poursuivre l'isolement diplomatique"
 SPR_continue_diplomatic_isolation_desc:0 "Les puissances occidentales ont continué à nous condamner. En ce qui nous concerne, nous n'avons guère intérêt à les courtiser davantage. Nous poursuivrons notre isolationnisme diplomatique."
 SPR_new_concordat:0 "Concordat entre l'État espagnol et le Saint-Siège"
 SPR_new_concordat_desc:0 "Le Concordat constitue un effort important pour briser l'isolement international de l'Espagne après la Seconde Guerre mondiale. Il s'agissait d'une tentative de réunir une sainte alliance avec l'Espagne et ses voisins immédiats, au premier rang desquels l'Estado Novo de Salazar."
 SPR_join_the_un:0 "Rejoignez les Nations Unies"
 SPR_join_the_un_desc:0 "Une fois le rapprochement réussi avec les Américains, Francisco Franco pourrait demander son admission aux Nations Unies. Cette institution a initialement refusé l'Espagne en raison de son parti pris pro-Axe pendant la Seconde Guerre mondiale, mais sous la menace de l'Union soviétique et la pression des Américains, les alliés occidentaux ont cédé et l'Espagne a été admise le 14 décembre 1955."
 SPR_economic_aid:0 "Aide économique américaine"
 SPR_economic_aid_desc:0 "Dans le cadre des accords du Pacte de Madrid de 1953, les États-Unis devaient fournir une aide économique indispensable au gouvernement espagnol. Cela jouerait un rôle dans la relance de l'économie et fut l'un des facteurs, bien que mineur, qui ont conduit au miracle économique espagnol."
 SPR_autarky_stays:0 "Économie espagnole indépendante"
 SPR_autarky_stays_desc:0 "Même si nous voulons améliorer nos relations avec les autres nations du monde, nous devons maintenir notre politique d'autarcie. Après tout, nous ne devrions pas être redevables aux gouvernements d'autres nations pour une stabilité économique indispensable"
 SPR_iberian_pact:0 "Pacte ibérique"
 SPR_iberian_pact_desc:0 "Le Portugal a été à la fois un ennemi et un allié au fil des siècles. Maintenant que Salazar, un caudillo partageant les mêmes idées, est au pouvoir au Portugal, il est peut-être temps de développer des relations plus étroites avec notre voisin ibérique et de former un pacte commun pour le bénéfice des deux nations."
 SPR_political_chaos:0 "Chaos politique"
 SPR_political_chaos_desc:0 ""
 wartime_debts:0 "Dettes de guerre"
 SPR_memories_of_civil_war:0 "Souvenirs de la guerre civile espagnole"
 SPR_memories_of_civil_war_desc:0 "La guerre civile espagnole a été une période sombre de notre histoire et personne ne veut la répéter. Cependant, nous pouvons en même temps utiliser ses crimes contre les droits de l'homme pendant la guerre comme un excellent outil de propagande contre Franco."
 SPR_chaos_in_country:0 "Pays dans le chaos"
 SPR_chaos_in_country_desc:0 "Alors que les manifestants sont galvanisés contre Franco et ses phalangistes, le gouvernement se trouve incapable de gérer correctement le chaos provoqué par la montée du mouvement de gauche en Espagne."
 SPR_revolution:0 "Révolution sociale espagnole"
 SPR_revolution_desc:0 "Le moment est venu de renverser Franco une fois pour toutes. Provoquons une deuxième révolution glorieuse en Espagne et proclamons la République espagnole !"
 SPR_pruge_falangism:0 "Purger les partisans des phalangistes"
 SPR_pruge_falangism_desc:0 "Tout comme ils ont purgé les partisans démocrates et communistes lorsque les nationalistes ont gagné la guerre civile en 1939, nous leur ferons la même chose. Nous ne pouvons pas permettre une contre-révolution si peu de temps après avoir reconquis notre pouvoir."
 SPR_unify_idgf:0 "Unifier les antifascistes"
 SPR_unify_idgf_desc:0 "Il existe de nombreux groupes antifascistes notables en Espagne et à l'étranger. Nous devons faire appel à tous ceux qui s'opposent au Caudillo et les rallier à notre cause !"
 SPR_align_with_moscow:0 "Protégé par maman ours"
 SPR_align_with_moscow_desc:0 "Nous sommes une île rouge dans une mer de porcs capitalistes. Si nous voulons pouvoir défendre la révolution, nous devons obtenir le soutien de nos amis de Moscou. Toutefois, les Soviétiques peuvent exiger un coût pour leur protection."
 SPR_release_all_colonies:0 "Libérer toutes les colonies"
 SPR_release_all_colonies_desc:0 "Le colonialisme ne fait pas partie du rêve communiste. Nous accorderons immédiatement à nos colonies leur indépendance sous la direction de nos frères communistes !"
 SPR_closen_with_europe:0 "Plus proche de l'Europe"
 SPR_closen_with_europe_desc:0 "Maintenant que nous commençons à briser notre isolement, nous devons resserrer nos liens avec les autres nations européennes."
 SPR_anit_corruption_measures:0 "Mesures anti-corruption"
 SPR_anit_corruption_measures_desc:0 "La corruption est endémique dans le pays en raison d'une mauvaise gestion au cours de la dernière décennie. Il faut s'en occuper si nous voulons nous moderniser."
 SPR_economic_freedom:0 "Permettre plus de liberté économique"
 SPR_economic_freedom_desc:0 "Afin de tirer parti de nos atouts économiques, nous autoriserons une politique économique plus libérale. Adoptons certains principes capitalistes dans notre économie."
 SPR_stabilization_plan:0 "Plan de stabilisation de 1959"
 SPR_stabilization_plan_desc:0 "Le plan de stabilisation de 1959 était une série de mesures économiques prises par le gouvernement espagnol en 1959. Son objectif principal était la libéralisation économique des marchés espagnols, marquant un tournant par rapport aux politiques précédentes orientées vers l'autarcie. Ce plan a contribué au boom économique qu'a connu l'Espagne dans les années 1960 et a réduit l'inflation de 500 %."
 SPR_una_grande_libre:0 "¡Una, Grande et Libre!"
 SPR_una_grande_libre_desc:0 "Une, Grande et Libre, la devise franquiste de l'Espagne était de déterminer les idéaux des nationalistes, une nation indivisible face aux sentiments séparatistes, une nation impériale face aux colonies encore détenues et autrefois détenues, et une nation non soumise aux influences étrangères, face aux conspirations lancées contre l'Espagne."
 SPR_education_boost:0 "Concentrez-vous sur l'amélioration de l'éducation"
 SPR_education_boost_desc:0 "Nos normes d'éducation sont médiocres et ont conduit au long déclin de la puissance espagnole. Nous devons moderniser notre politique éducative nationale."
 SPR_ban_old_shirts:0 "Condamner les Camisas Viejas"
 SPR_ban_old_shirts_desc:0 "Les Vieilles Chemises, les Falangistes qui soutiennent l'ancien leader phalangiste José Antonio Primo de Rivera, ont remis en question les récentes politiques de Franco pour l'Espagne. Même si nous vénérons toujours l'héritage de Primo de Rivera, nous ne pouvons pas laisser la vieille garde continuer à remettre en question notre façon de faire. Nous les supprimerons."
 SPR_convert_portugal:0 "Convertir Portugal"
 SPR_convert_portugal_desc:0 "Le Portugal constitue une menace dangereuse pour nos arrières et pour le socialisme espagnol. Nous pourrions leur faire la guerre, mais cela attirerait sur nous la colère de l'Amérique. Peut-être pourrions-nous plutôt parrainer les communistes et les républicains du Portugal pour renverser Salazar. Cela nous protégerait au moins pour le moment."
 SPR_socilize_healthcare:0 "Soins de santé socialistes"
 SPR_seize_companies:0 "Saisir les entreprises"
 SPR_the_iron_curtain:0 "Le rideau de fer"
 SPR_the_iron_curtain_desc:0 "Tout comme le rideau de fer était descendu de Stettin dans la Baltique à Trieste dans l'Adriatique, un deuxième rideau de fer descendra, de Bilbao dans l'Atlantique à Barcelone dans la Méditerranée. Nous sommes désormais communistes, dans la sphère soviétique, pour la gloire du peuple espagnol."
 SPR_howthefuckdoiwritethislol:0 "Expatrié Les Nazis"
 SPR_howthefuckdoiwritethislol_desc:0 "Pendant et après la Seconde Guerre mondiale, de nombreux nazis ont cherché refuge dans notre pays. Ils seront renvoyés en Allemagne pour répondre de leurs crimes."
 SPR_return_to_democracy:0 "Retour à la démocratie"
 SPR_return_to_democracy_desc:0 "Même si nous avons lancé une révolution communiste il y a quelque temps, nous ne sommes pas nécessairement une dictature. Nous restaurerons les institutions démocratiques et oeuvrerons sur la voie de la libéralisation. Nous établirons un État socialiste avec nos propres caractéristiques uniques."
 SPR_pursuit_the_dream:0 "La révolution doit continuer"
 SPR_pursuit_the_dream_desc:0 "Même si nous avons atteint les objectifs que nous souhaitions depuis longtemps depuis la formation de la Deuxième République en 1931, cela ne signifie pas que nous pouvons nous permettre de nous reposer sur nos lauriers. La révolution doit continuer et continuera, et nous répandrons le communisme à l'étranger."
 SPR_puppet_portugal:0 "Libérer le Portugal"
 SPR_puppet_portugal_desc:0 "Le premier pas vers la propagation du communisme à l'étranger devrait être notre voisin occidental. Le peuple portugais a souffert depuis longtemps sous les régimes d'un gouvernement à la fois militaire et fasciste aux côtés d'un gouvernement bourgeois corrompu. Nous les purgerons et installerons à leur place une véritable république socialiste."
 SPR_example_to_west:0 "Exemple vers l'ouest"
 SPR_example_to_west_desc:0 "Qui a dit que les pays communistes devaient être des dictatures corrompues ? Pas nous, disons-nous. Nous montrerons aux puissances occidentales que le communisme peut exister dans le cadre d'une institution démocratique."
 SPR_The_Pact_of_Madrid2:0 "Accord militaire américano-espagnol"
 SPR_Reforming_the_Army:0 "Réformer l'armée"
 SPR_Ejercito_de_Tierra:0 "Éjército de Tierra"
 SPR_Re_Thinking_Our_Strategies:0 "Repenser nos stratégies"
 SPR_US_Equipment:0 "Équipement fabriqué aux États-Unis"
 SPR_Renewing_Our_Armory:0 "Renouveler notre arsenal"
 SPR_Armada_Espanola:0 "Armada espagnole"
 SPR_US_Inspired_Designs:0 "Conceptions inspirées des États-Unis"
 SPR_Nato_Naval_Tactics:0 "Adopter les tactiques navales de l'OTAN"
 SPR_Unidad_de_Operaciones_Especiales:0 "Unité d'opérations spéciales"
 SPR_Ejercito_del_Aire:0 "Aéroport de l'Aire"
 SPR_US_Jets:0 "Jets fabriqués aux États-Unis"
 SPR_Helicopters:0 "Commencer le développement d'hélicoptères"
 SPR_Found_the_Almogavares:0 "J'ai trouvé les Almogavares "
 SPR_Army_Updated:0 "Une armée enfin à jour"
 spr.5.d:0 "Enfin, nous sommes parvenus à un accord entre nous et les États-Unis pour un programme de partage de technologies militaires et l'ouverture de relations diplomatiques et commerciales avec nous"
 spr.6.d:0 "Nos compatriotes sont aujourd'hui dans la joie puisque l'entreprise \"Chupa Chups\", fondée par Eric Bernat, a ouvert ses portes au public. Bernat, l'un des hommes d'affaires les plus importants d'Espagne, a décidé de développer son entreprise dans une entreprise plus jeune, avec un bonbon appelé « sucette » comme produit phare. Lors de son inauguration à Barcelone, l'entreprise a connu un grand succès, avec des revenus et des bénéfices dépassant les attentes, avec un potentiel d'expansion dans toute l'Espagne et peut-être dans le monde entier. C'est sûrement un excellent exemple des merveilles de l'esprit d'entreprise et de l'ingéniosité espagnole."
 spr.7.d:0 "Les familles et leurs enfants sont ravis aujourd'hui, car la nouvelle marque appelée « Chupa Chups » a dévoilé une nouvelle gamme de sucettes. Fondée par Enric Bernat, il a imaginé de créer une nouvelle ligne de bonbons, plus orientée vers les enfants puisque la plupart des clients de ses produits sont des enfants. Au cours de ses premiers jours d'ouverture, l'entreprise a connu un grand succès, générant des bénéfices indispensables au développement de l'entreprise. Bernat envisage de s'étendre dans toute l'Espagne et potentiellement dans le monde entier si les fonds de son entreprise sont en mesure de soutenir une telle croissance."
 ######################ministers
 Francisco_Franco:0 "Francisco Franco"
 Caudillo:0 "Caudillo d'Espagne"
 Francisco_Franco_desc:0 "Né à El Ferrol en 1892, Francisco Franco était un militaire de carrière qui gravit les échelons jusqu'au milieu des années 1930. Franco a rejoint le mouvement rebelle grandissant et a rapidement mené un soulèvement contre le gouvernement républicain de gauche et a pris le contrôle du pays après la guerre civile espagnole. Après avoir maintenu la neutralité de la nation pendant la Seconde Guerre mondiale, Franco est désormais soutenu par le reste de l'Occident en raison de ses opinions anticommunistes. Bien que fasciste dans ses opinions et méthodes politiques, il s'identifie comme un « conservateur » et un « monarchiste », cherchant simplement à préserver la tradition et la fierté nationale de l'Espagne."
 
 Falange.1.d:0 "Le gouvernement espagnol a confirmé la suprématie de son idéologie phalangiste en adoptant les Principes fondamentaux du mouvement national. Ces principes posent les fondements idéologiques de l'État franquiste. Tous les hauts responsables du gouvernement devront désormais prêter allégeance à ces principes pour pouvoir accéder à des fonctions ou à des postes d'autorité. Le gouvernement espagnol épouse une troisième voie antidémocratique et anticommuniste qui prétend supprimer toute distinction de classe. Le gouvernement croit que grâce à la dictature et à l'ordre, l'Espagne retrouvera sa gloire passée. Se soumettre au gouvernement et embrasser l'Église sont également des éléments importants du système espagnol. Les observateurs du régime espagnol soutiennent cependant que l'idéologie phalangiste n'est pas une troisième option mais simplement une idéologie d'extrême droite. Ils notent que la nouvelle loi renforce encore la séparation de l'Espagne des courants idéologiques plus larges du monde."
 IC_Franco.1.d:0 "\nLe dictateur espagnol Francisco Franco a déclaré publiquement que la menace de la conspiration judéo-maçonnique s'est accrue, les Juifs internationaux opérant désormais également à travers le communisme mondial. Depuis le début de son règne, Franco et ses partisans ont ouvertement adopté une croyance en la conspiration largement discréditée selon laquelle les Juifs contrôlaient le monde grâce à leur infiltration des francs-maçons. Cette conspiration a été popularisée au début du XXe siècle par la publication des Protocoles de Sion. En plus de cette annonce, le gouvernement a déclaré qu'il étendrait la publication et la distribution des Protocoles de Sion. Le gouvernement a également demandé aux ministères concernés de préparer une campagne internationale et nationale pour sensibiliser davantage la population à cette menace élargie."
 SPA_ISR.1.d:0 "Francisco Franco a annoncé une nouvelle campagne visant à sensibiliser le public à la menace juive contre la nation espagnole. Franco a souligné que le pays ne pouvait pas se contenter de cette menace. Il a noté que l'existence d'Israël confirme l'ampleur de la menace. Dans une déclaration complémentaire, le gouvernement a exhorté les citoyens espagnols à rester vigilants face à cette menace. Depuis que Franco est arrivé au pouvoir, il s'est activement engagé dans des campagnes et de la propagande antisémites. De nombreux partisans conservateurs du régime ont activement soutenu que le déclin du christianisme et que l'Empire espagnol pouvaient être directement liés aux actions d'une conspiration juive internationale. On s'attend à ce que cette campagne provoque l'indignation internationale."
 SPA_MOR.1.d:0 "Le gouvernement espagnol a annoncé qu'il confierait l'administration et la souveraineté du Rif au nouvel État marocain nouvellement indépendant. Cette décision a été bien accueillie par les Marocains et la Ligue arabe. Cette décision reflète une approche plus libérale de la décolonisation suivie par l'Espagne, notamment par rapport à certains de ses voisins européens. Beaucoup attribuent cela au désir de l'Espagne de mettre fin à son isolement international depuis la fin de la Seconde Guerre mondiale. L'émergence de nouveaux États issus de la décolonisation offre à l'Espagne l'opportunité d'étendre ses relations avec de nouveaux États et de maintenir son idéologie."
 Juby.1.d:0 "Le gouvernement espagnol a annoncé qu'il avait restitué Port Juby au Maroc conformément à son récent accord. Le Maroc avait demandé à l'Espagne de restituer ce qu'il considère comme son territoire sous administration espagnole. Après mûre réflexion, le gouvernement espagnol a accepté et a préparé au cours des semaines précédentes un transfert en douceur du territoire au Maroc. Cette décision est bien accueillie dans toute l'Afrique du Nord et les observateurs notent qu'il pourrait s'agir d'une tentative de la part de l'Espagne de gagner les faveurs des nouveaux États émergents. Le gouvernement espagnol a été confronté à l'isolement de ses voisins européens en raison de son association avec les puissances de l'Axe lors de la dernière guerre. La décolonisation offre à l'Espagne l'opportunité de briser son isolement international et de s'engager avec d'autres États."
 Opus_Dei.1.d:0 "L'Opus Dei a été fondé par des prêtres espagnols en 1928 pour servir de guide spirituel au monde laïc. Après la guerre civile espagnole, le groupe commença à se développer parmi les partisans de Franco. Au milieu des années 1940, le groupe s'est développé à l'échelle internationale et a récemment reçu l'approbation du pape. La politique du gouvernement espagnol visant à promouvoir la piété religieuse et à lier l'État à la religion a fait de l'Opus Dei un choix idéal pour les partisans de Franco. Son statut d'institution ecclésiale laïque permet à ses membres de rester engagés dans le catholicisme mais également dévoués à l'État espagnol. Aujourd'hui, les membres de l'Opus Dei dominent le gouvernement espagnol et offrent des conseils spirituels et un soutien aux principaux responsables de l'État."
 SPA_MOR.2.d:0 "Le Maroc a récemment demandé à l'Espagne de restituer Ifni, qui avait été cédée par le Maroc en 1860. Le Maroc affirme qu'il a été contraint de céder ces terres en raison de la menace des puissances colonisatrices, mais qu'elles doivent maintenant être restituées. Après de nombreuses consultations, le gouvernement espagnol a accepté et depuis hier, Ifni est désormais sous l'administration du Maroc. Le dernier navire des responsables espagnols est parti peu après la cérémonie de remise. De nombreux observateurs notent que la décision espagnole contraste avec celle de nombreux voisins européens qui ont adopté une position beaucoup plus dure sur la question de la décolonisation. Ils attribuent la décision de l'Espagne au désir de gagner des faveurs et de nouvelles voies diplomatiques pour briser l'isolement international auquel l'Espagne a été confrontée en raison de sa coopération en temps de guerre avec les puissances de l'Axe."
 eng_mobilization.2.d:0 "Certains des 400 navires de guerre qui constituent la flotte de réserve de la Royal Navy, qui comprend des cuirassés, des croiseurs, des porte-avions, des destroyers, des frégates et des dragueurs de mines, se préparent à prendre la mer en raison des tensions et des conflits mondiaux et agissent comme une solution d'urgence face aux menaces croissantes. Considérée par beaucoup comme un assemblage de navires de guerre morts et inutiles, la flotte a été mobilisée et est actuellement en cours de finition pour naviguer à nouveau en haute mer grâce à son brillant état-major. Elle sera prête à reconstituer à tout moment la flotte active et les courageux marins de la Royal Navy, la flotte en attente étant déjà en route pour protéger les intérêts britanniques à l'étranger et apporter un soutien à la flotte principale de la Royal Navy."
 usa_mobilization.1.d:0 "En raison des tensions désormais croissantes et de la nécessité d'une plus grande présence militaire, une partie de la flotte américaine, principalement des navires semi-modernes en raison des réductions de la défense de la fin des années 1940, sera la première à être rappelée au service actif pour fournir un soutien à la flotte principale à l'étranger. Avec une poignée de porte-avions, de destroyers et de croiseurs, ainsi que de navires amphibies et auxiliaires, prêts à repartir, tandis que les navires plus gros et plus volumineux, tels que les croiseurs et les cuirassés plus lourds, subissent des travaux supplémentaires pour se préparer si nécessaire à leur remise en service, le public américain ne peut que se demander si ces navires résisteront à l'épreuve du temps et si l'infaillibilité de la marine américaine est toujours valable à ce jour."
 usa_mobilization.2.d:0 "Une partie de la flotte de réserve ayant déjà mis les voiles, le reste de la réserve a désormais terminé les travaux de remise en service et les marins y ont afflué ainsi que les aviateurs navals préparant leurs avions. De nombreux porte-avions, cuirassés, croiseurs et un trop grand nombre de destroyers pour les compter prendront le large dans le cadre du plus grand déploiement de navires depuis la Seconde Guerre mondiale. La Marine a fait une déclaration qui mentionne la protection des intérêts américains et de la vie de tous les marins américains à bord des navires en mer, ils doivent se préparer et prendre toute mesure nécessaire à la défense des États-Unis d'Amérique et de leurs alliés."

