 spr.tr.1:0 "Nous réformons l'armée avec nos propres connaissances"
 SPR_mama_bear:0 "§RMoyennant un certain prix, nous demandons la protection des Soviétiques§!"
 spr.tr.2:0 "Il est temps de chasser le fascisme !"
 SPR_independent_army:0 "Armée indépendante"
 SPR_independent_army_desc:0 "En raison de notre isolement, nous ne pouvons pas compter sur l'aide d'autres nations pour notre armée. Au lieu de cela, nous devons le faire avec nos propres connaissances."
 veteran_of_the_national_revolutionary_war:0 "Vétéran de la guerre d'indépendance nationale"
 SPR_industrial_effort:0 "Effort industriel"
 SPR_industrial_effort_desc:0 "Dix ans se sont écoulés depuis la fin de la guerre civile espagnole, et il reste encore des régions du pays qui n'ont pas été reconstruites avec succès et des usines qui n'ont pas été restaurées. Commençons par déployer nos efforts pour reconstruire nos infrastructures."
 SPR_construction_effort:0 "Stimuler la fabrication locale"
 SPR_construction_effort_desc:0 "Conformément au plan d'autarcie, nous devons apporter un soutien gouvernemental au développement des entreprises locales."
 SPR_construction_effort_2:0 "Soutenir la création de SEAT"
 SPR_construction_effort_2_desc:0 "Depuis 1940, nous essayons de relancer notre industrie automobile nationale. Cependant, en raison de notre manque d'expertise en matière de développement automobile, il a été décidé de trouver un partenaire étranger pour nous aider. Pendant notre rétablissement après la guerre civile et la guerre mondiale, le projet a été suspendu. Nous avons maintenant réussi à obtenir le soutien de FIAT et, à ce titre, nous devons soutenir la création de la Sociedad Española de Automóviles de Turismo, S.A. Par l'Instituto Nacional de Industria."
 SPR_construction_effort_3:0 "Effort de construction III"
 SPR_construction_effort_3_desc:0 "Notre production industrielle croît à un rythme soutenu grâce au plan d'autarcie, et l'expansion de notre réseau d'infrastructures a considérablement amélioré notre capacité industrielle. Travaillons à poursuivre ces évolutions."
 SPR_mining_development:0 "Fondation de l'ENSIDESA"
 SPR_mining_development_desc:0 "Dans le cadre de l'industrialisation et de la modernisation de l'économie espagnole, une nouvelle entreprise publique Empresa Nacional Siderúrgia Sociedad Anónima (ENSIDESA) doit être créée pour augmenter la production d'acier espagnole."
 SPR_steel_industry:0 "Industrie sidérurgique"
 SPR_steel_industry_desc:0 "Nous avons besoin d'acier pour aider à développer notre industrie automobile et à rivaliser avec celle de géants comme l'Italie et l'Allemagne. Il existe des gisements de minerai de fer en Espagne qui attendent d'être convertis en acier. Saisissons cette opportunité."
 SPR_oil_development:0 "Développement pétrolier"
 SPR_oil_development_desc:0 "Nous avons besoin de gisements de pétrole si nous voulons un jour disposer des ressources nécessaires pour construire une économie industrialisée, et encore moins pour faire la guerre. Il y a des gisements de pétrole en Espagne qui attendent d'être exploités !"
 SPR_chromium_development:0 "Développement de chrome"
 SPR_chromium_development_desc:0 "Le chrome constitue un atout important dans le développement d'équipements plus lourds et de navires plus grands. C'est pourquoi nous devons exploiter une zone riche en chrome en Espagne et commencer les opérations minières."
 SPR_production_effort:0 "Fondation du CETME"
 SPR_production_effort_desc:0 "Le Centro de Estudios Técnicos de Materiales Especiales ou CETME sera une entreprise destinée à développer des armes à feu pour nos militaires."
 SPR_production_effort_3:0 "Développer l'industrie nationale de l'armement"
 SPR_production_effort_3_desc:0 "Nous devons être autonomes en ce qui concerne nos militaires. Développons nos industries d'armement nationales et développons nos propres armes à feu."
 SPR_infrastructure_effort:0 "Efforts en matière d'infrastructures"
 SPR_infrastructure_effort_desc:0 "L'Espagne a toujours eu des infrastructures médiocres en raison de l'instabilité et de la mauvaise gestion des gouvernements successifs tout au long des XVIIIe, XIXe et début du XXe siècles. Il est temps d'entamer le processus de construction de nouvelles infrastructures et d'entraîner l'Espagne vers la modernité."
 SPR_infrastructure_effort_2:0 "Réseau Autopista"
 SPR_infrastructure_effort_2_desc:0 "Nous commencerons par la construction d'un réseau autoroutier, sur le modèle de celui de l'ancienne Allemagne nazie. Ce faisant, nous pouvons mieux relier les villes et déplacer plus rapidement nos citoyens dans tout le pays."
 SPR_extra_tech_slot:0 "Université de Navarre"
 SPR_extra_tech_slot_desc:0 "L'institution a été fondée sous le nom d'Estudio General de Navarra le 17 octobre 1952 avec l'encouragement de saint Josémaria Escriva, leader du mouvement Opus Dei. À l'origine une école de droit comptant huit professeurs et quarante-huit étudiants, elle est aujourd'hui classée et considérée comme la meilleure université privée d'Espagne."
 SPR_nuclear_effort:0 "Effort nucléaire"
 SPR_extra_tech_slot_2:0 "Emplacement technologique supplémentaire II"
 SPR_secret_weapons:0 "Armes secrètes"
 SPR_secret_weapons_desc:0 "En cette époque appelée guerre froide, nous devrons travailler au développement de nos propres projets d'armes secrètes. Avions à réaction, missiles balistiques et même notre propre programme d'armes nucléaires. Tout nous sera expliqué clairement."
 SPR_flexible_navy:0 "Marine souple"
 SPR_flexible_navy_desc:0 "L'époque des grandes marines est révolue. Afin de poursuivre le développement naval, nous devrons adopter nos doctrines visant à utiliser la guerre sous-marine et anti-sous-marine pour éloigner les ennemis."
 SPR_reform_officer_corps:0 "Corps d'officiers moderne"
 SPR_reform_officer_corps_desc:0 "Grâce aux efforts des Américains, nous pouvons désormais disposer d'un corps d'officiers pleinement compétents pour rendre l'armée espagnole viable à l'avenir."
 SPR_american_license_agreements:0 "Contrats de licence américains"
 SPR_american_weapon_sale_Copy_Copy:0 "Vente d'armes américaines III"
 SPR_american_weapon_sale_Copy_Copy_desc:0 "Les États-Unis possèdent des équipements excédentaires fabriqués après la Seconde Guerre mondiale et sont prêts à nous les vendre. Profitons de cet accord."
 SPR_american_weapon_sale_Copy:0 "Vente d'armes américaines II"
 SPR_american_weapon_sale_Copy_desc:0 "Les États-Unis possèdent des équipements excédentaires fabriqués après la Seconde Guerre mondiale et sont prêts à nous les vendre. Profitons de cet accord."
 SPR_american_weapon_sale:0 "Vente d'armes américaines"
 SPR_american_weapon_sale_desc:0 "Les États-Unis possèdent des équipements excédentaires fabriqués après la Seconde Guerre mondiale et sont prêts à nous les vendre. Profitons de cet accord."
 SPR_american_mic_contracts:0 "Contrats MIC américains"
 SPR_american_mic_contracts_desc:0 "Obtenons des contrats des industries militaires américaines pour nous aider dans la recherche et le développement de nos besoins militaires."
 SPR_american_alignment:0 "Alignement américain"
 SPR_american_alignment_desc:0 "Les États-Unis sont l'un des principaux vainqueurs de la Seconde Guerre mondiale. Développons nos forces militaires sous leur aile."
 SPR_american_aircraft_training:0 "Formation sur les avions américains"
 SPR_american_aircraft_training_desc:0 "L'armée de l'air américaine compte de nombreux atouts qui peuvent nous apprendre à voler, à tirer et, dans l'ensemble, à mieux combattre. Amenons leurs as en Espagne pour former nos pilotes."
 SPR_american_advisors:0 "Conseillers américains"
 SPR_american_advisors_desc:0 "L'armée américaine dispose de nombreux officiers expérimentés qu'elle peut envoyer en Espagne en tant que conseillers, pour former nos officiers et aider à former nos soldats."
 SPR_american_airfield_development:0 "Développement de l'aérodrome américain"
 SPR_american_airfield_development_desc:0 "En nous basant sur les bases américaines de Saragosse, Torrejón et Morón, développons nos autres bases aériennes de manière aussi efficace que le modèle américain."
 SPR_american_rocket_tech:0 "Technologie de fusée américaine"
 SPR_american_rocket_tech_desc:0 "L'Amérique a développé des armes basées sur des fusées et est sur la voie du développement d'armes basées sur des missiles. Nous avons besoin de nous occuper de cette affaire."
 SPR_american_mechanized_equipment:0 "Équipement mécanisé américain"
 SPR_american_mechanized_equipment_desc:0 "Les États-Unis avaient développé une formidable plate-forme pour l'infanterie mécanisée. L'Espagne doit en acquérir certains pour équiper sa force d'infanterie mécanisée en plein essor."
 SPR_american_tanks:0 "Chars américains"
 SPR_american_tanks_desc:0 "Un certain nombre de chars moyens et lourds de fabrication américaine sont tombés en désuétude après la Seconde Guerre mondiale. Peut-être pourrions-nous en acquérir quelques-uns pour équiper nos forces blindées."
 SPR_american_intelligence_aid:0 "Aide au renseignement américain"
 SPR_american_intelligence_aid_desc:0 "La Central Intelligence Agency américaine peut fournir un effort pour former nos espions afin d'extirper les ennemis de l'Espagne. Centralisons notre agence de renseignement extérieur en une agence basée sur le modèle de la CIA."
 SPR_american_anti_air_defences:0 "Aide au développement antiaérienne américaine"
 SPR_american_anti_air_defences_desc:0 "L'armement anti-aérien américain a largement dépassé celui utilisé par l'Allemagne et l'Italie pendant la Seconde Guerre mondiale, et a continué à s'améliorer dans l'immédiat après-guerre. Apprenons et acquérons ces armes."
 SPR_american_doctrine_air:0 "Doctrine aérienne américaine"
 SPR_american_doctrine_air_desc:0 "Alignons notre doctrine aérienne sur celle des Américains afin de mieux contrer les doctrines utilisées par l'Empire soviétique."
 SPR_american_bombers:0 "Bombardiers américains"
 SPR_american_bombers_desc:0 "La force de bombardiers américaine est capable de transporter des armes nucléaires et de lourdes charges utiles. Même si nous n'avons aucun désir de posséder des armes nucléaires pour le moment, avoir ce pouvoir entre nos mains ferait de notre pays une force puissante. Il suffit de mettre la main dessus, c'est tout."
 SPR_american_doctrine:0 "Doctrine américaine"
 SPR_american_doctrine_desc:0 "Alignons notre doctrine militaire sur celle des Américains afin de mieux contrer les doctrines utilisées par l'Empire soviétique."
 SPR_american_armed_divisions:0 "Divisions armées américaines"
 SPR_american_surplus_equipment:0 "Équipement excédentaire américain"
 SPR_american_surplus_equipment_desc:0 "Les États-Unis disposent de nombreux équipements hérités de la Seconde Guerre mondiale, qui sont confiés à des éléments miteux. Achetons certaines de ces actions pour leur bénéfice et pour notre bénéfice également."
 SPR_american_fighters:0 "Combattants américains"
 SPR_american_fighters_desc:0 "Il existe un certain nombre d'avions à réaction américains qui n'attendent que d'être achetés par l'Espagne. Acquérons le stock américain d'avions de combat à réaction pour l'utiliser pour notre armée."
 SPR_reform_officer_corps_2:0 "Corps d'officiers moderne"
 SPR_reform_officer_corps_2_desc:0 "Grâce à un travail acharné et à des efforts acharnés, nous avons réussi à constituer et à former notre corps d'officiers à partir des leçons apprises pendant la guerre civile espagnole et la Division Bleue. Faisons maintenant face à l'avenir apporté par la guerre froide avec une armée et un corps d'officiers forts !"
 SPR_develop_a_native_mic:0 "Développer un MIC natif"
 SPR_aviation_effort:0 "Efforts aériens"
 SPR_aviation_effort_desc:0 "L'aviation est un domaine que toute nation moderne doit maîtriser. Assurons-nous de développer nos propres doctrines aériennes afin de suivre le rythme."
 SPR_army_effort:0 "Effort militaire"
 SPR_army_effort_desc:0 "Malgré la sophistication croissante de la guerre aérienne et navale, le combat terrestre reste essentiel dans les guerres du futur."
 SPR_equipment_effort:0 "Effort d'équipement"
 SPR_equipment_effort_desc:0 "Les limites de l'équipement pouvant être transporté par l'infanterie sont constamment repoussées, même de nos jours. Nous devons nous efforcer de donner à nos troupes les meilleurs outils disponibles pour accomplir leur travail."
 SPR_motorization_effort:0 "Effort de motorisation"
 SPR_motorization_effort_desc:0 "La mobilité et la protection sont essentielles pour permettre à l'infanterie d'entrer et de sortir du terrain en toute sécurité. Développons des camions plus efficaces pour y parvenir."
 SPR_fighter_focus:0 "Concentration du combattant"
 SPR_fighter_focus_desc:0 "Nous n'avons pas vu la fin des combats aériens, même après la fin de la Seconde Grande Guerre. Garder une longueur d'avance dans le développement des avions de combat, en particulier dans l'utilisation des avions à réaction, nous donnera un avantage à l'avenir."
 SPR_bomber_focus:0 "Focus sur les bombardiers"
 SPR_bomber_focus_dec:0 "Lorsque les gens du futur parleront de l'horreur des guerres d'aujourd'hui, le feu qui tombe du ciel occupera une place importante. Nous ferons de notre mieux pour que ces histoires soient racontées par nos ennemis."
 SPR_doctrine_effort:0 "Effort doctrinal"
 SPR_doctrine_effort_desc:0 "Les doctrines militaires qui ont défini le combat terrestre pendant la Seconde Grande Guerre sont, même si elles sont toujours pertinentes, elles seront un jour terriblement dépassées. Nous devons consacrer nos plus grands esprits à façonner la pensée militaire de demain."
 SPR_aviation_effort_2:0 "Développer les bases aériennes"
 SPR_CAS_effort:0 "Effort du CAS"
 SPR_CAS_effort_desc:0 "Une armée moderne a besoin du soutien de véhicules non seulement au sol, mais aussi dans les airs."
 SPR_NAV_effort:0 "Effort de NAV"
 SPR_NAV_effort_desc:0 "Un pays entouré d'eau sur deux côtés signifierait que la priorité doit être donnée à nos avions de guerre navale pour patrouiller les eaux de l'Atlantique et de la Méditerranée."
 SPR_rocket_effort:0 "Effort de fusée"
 SPR_rocket_effort_desc:0 "Les moteurs-fusées permettent le développement d'armes à missiles, l'avenir de la puissance destructrice et du combat aérien. Être pionnier dans ces technologies nous permettra de surprendre l'ennemi."
 SPR_special_forces:0 "Efforts spéciaux"
 SPR_special_forces_desc:0 "Nous avons besoin de forces d'élite ; les troupes de montagne et les parachutistes devraient être notre priorité."
 SPR_mechanization_effort:0 "Effort de mécanisation"
 SPR_mechanization_effort_desc:0 "En repensant les possibilités de l'infanterie motorisée, nous pouvons repousser les limites des véhicules pouvant être construits aujourd'hui."
 SPR_equipment_effort_2:0 "Effort d'équipement"
 SPR_equipment_effort_2_desc:0 "Nous poursuivrons nos efforts pour garantir que notre infanterie et nos troupes de soutien soient armées du meilleur équipement possible de notre époque."
 SPR_doctrine_effort_2:0 "Effort doctrinal II"
 SPR_doctrine_effort_2_desc:0 "Le champ de bataille a changé non seulement dans les années qui ont suivi la Seconde Guerre mondiale, mais aussi au cours des conflits récents. Nous devons continuellement réévaluer nos doctrines pour refléter cela."
 SPR_armor_effort:0 "Effort d'armure"
 SPR_armor_effort_desc:0 "En appliquant ce que nous avons appris en mécanisant notre infanterie, nous pouvons également améliorer nos véhicules blindés."
 SPR_equipment_effort_3:0 "Effort d'équipement III"
 SPR_equipment_effort_3_desc:0 "Nous nous concentrerons sur nos derniers efforts pour créer l'arme d'infanterie ultime, qui rivalisera avec celles proposées par les principaux fabricants tels que les États-Unis, l'Union soviétique, la Belgique, l'Allemagne ou d'autres !"
 SPR_purge_officer_corps:0 "Corps des officiers de purge"
 SPR_soviet_scuds:0 "Scuds soviétiques"
 SPR_backwards_engineer_soviet_designs:0 "Conceptions soviétiques d'ingénieur à l'envers"
 SPR_research_advances_air:0 "Développement de la recherche aérienne"
 SPR_more_surplus_equipment:0 "Équipement soviétique excédentaire supplémentaire"
 SPR_soviet_bombers:0 "Bombardiers soviétiques"
 SPR_soviet_air_doctrine:0 "Doctrine aérienne soviétique"
 SPR_soviet_army_doctrine:0 "Doctrine de l'armée soviétique"
 SPR_soviet_armed_divisions:0 "Divisions armées soviétiques"
 SPR_non_aligned:0 "Neutralité armée"
 SPR_non_aligned_desc:0 "De nos jours, nous ne pouvons pas compter sur les États-Unis pour nous aider à reconstruire nos forces, de peur qu'ils ne révèlent une faille dans notre doctrine. Nous développerons nos propres stratagèmes pour redevenir une grande puissance !"
 SPR_tungsten_extraction:0 "Extraction de tungstène"
 SPR_naval_effort:0 "Effort naval"
 SPR_naval_effort_desc:0 "L'expansion de notre marine devrait être notre première priorité. Affectez toutes les ressources disponibles aux nouveaux chantiers navals et recherchez des navires de surface légers."
 SPR_large_navy:0 "Grande Marine"
 SPR_large_navy_desc:0 "Nous nous concentrerons sur le développement d'une grande flotte de surface, pour rappeler l'époque de l'Armada espagnole d'autrefois. L'Hispanie dominera à nouveau les vagues !"
 SPR_cruiser_effort:0 "Effort de croiseur"
 SPR_cruiser_effort_desc:0 "Avant de faire des incursions dans la recherche avancée sur les cuirassés, les petits croiseurs légers ont besoin d'être remplacés."
 SPR_submarine_effort:0 "Effort sous-marin"
 SPR_submarine_effort_desc:0 "Nous étudierons et exploiterons l'utilisation des sous-marins modernes en nous basant sur les leçons tirées de l'utilisation des sous-marins par l'Allemagne pendant la Seconde Guerre mondiale. À partir de là, nous développerons nos propres submersibles, plus efficaces."
 SPR_capital_ships_effort:0 "Effort en matière de navires capitaux"
 SPR_capital_ships_effort_desc:0 "La nation possédant le plus de cuirassés dominera les océans. Les cuirassés, et bientôt les porte-avions, représentent l'ancien et le nouveau en matière de supériorité navale."
 SPR_destroyer_effort:0 "Effort du Destructeur"
 SPR_destroyer_effort_desc:0 "En étudiant la conception et l'utilisation stratégique des sous-marins après la Seconde Guerre mondiale, nous avons également appris comment contrer ces stratégies. Les destroyers seront encore plus critiques pour ce rôle."
 SPR_industrial_development:0 "Institut national de l'industrie"
 SPR_industrial_development_desc:0 "La vision de Francisco Franco de l'économie espagnole tourne autour de l'idée d'autarcie ou d'autonomie.\nAvec la dévastation de la guerre et l'isolement commercial, l'Espagne était économiquement beaucoup plus en retard dans les années 1940 qu'elle ne l'était dix ans plus tôt. L'inflation s'est envolée, la reconstruction économique a échoué, la nourriture était rare et, certaines années, l'Espagne a enregistré des taux de croissance négatifs."
 SPR_New_Housing:0 "Nouveau logement"
 SPR_New_Housing_desc:0 "Non seulement le développement des infrastructures sur le continent est impératif. Nos colonies et protectorats en Afrique ont eux aussi besoin d'un tel développement. Construisons de nouveaux logements et encourageons l'émigration vers les territoires africains."
 SPR_Colonial_Infrastructure:0 "Infrastructure coloniale"
 SPR_Colonial_Infrastructure_desc:0 "Malgré nos ressources limitées, nous devons continuer à construire des infrastructures à l'étranger et poursuivre nos efforts pour établir des provinces hispanophones en Afrique. Ce faisant, nous pouvons élever ces États à un niveau similaire à celui du continent lui-même."
 SPR_Colonial_Industry:0 "Industrie coloniale"
 SPR_Colonial_Industry_desc:0 "Le niveau de capacité industrielle des colonies est pour le moins médiocre. Commençons immédiatement à développer les industries dans les colonies."
 SPR_Colonial_Military_Industry:0 "Industrie militaire coloniale"
 SPR_Colonial_Military_Industry_desc:0 "Avoir des garnisons coloniales est important pour le maintien de l'ordre dans les colonies espagnoles. Malheureusement, les armes les plus récentes mettent souvent du temps à atteindre ces garnisons. Construisons des installations militaires pour que nos forces puissent recevoir leurs armes le plus rapidement possible."
 SPR_Lessons_of_the_Civil_War:0 "Leçons de la guerre civile"
 SPR_Lessons_of_the_Civil_War_desc:0 "Beaucoup de choses ont été apprises de la guerre civile espagnole et, grâce à cela et aux exploits de la Division bleue, ont conduit au développement de nouvelles doctrines destinées à être utilisées par l'armée espagnole. Renforçons ces progrès et développons de nouvelles armes et stratégies issues de la guerre."
 SPR_Expand_the_Military:0 "Développer l'armée"
 SPR_Expand_the_Military_desc:0 "Nous devons procéder à une expansion de l'armée. Le temps du deuil et de la lassitude de la guerre est révolu. Lançons une campagne de recrutement dans toute l'Espagne pour augmenter nos effectifs."
 SPR_Colonial_Military_Integration:0 "Garde Coloniale"
 SPR_Colonial_Military_Integration_desc:0 "Alors que la main-d'oeuvre en Espagne proprement dite n'est plus un problème, les garnisons coloniales manquent d'effectifs. Recrutons des locaux dans l'armée et apprenons-leur à servir la nation espagnole."
 SPR_Expand_Domestic_Military_Industry:0 "Développer l'industrie militaire nationale"
 SPR_The_Spanish_Political_Sphere:0 "La sphère politique espagnole"
 SPR_The_Spanish_Political_Sphere_desc:0 "Depuis la fin de la guerre civile espagnole, la sphère politique espagnole était largement dominée par Francisco Franco et la Falange Española Tradicionalista y de las Juntas de Ofensiva Nacional Sindicalista. Mais à l'aube des années 1950, de nombreux événements peuvent façonner l'avenir de l'État espagnol."
 SPR_Sattelite_Morocco:0 "Satellite Maroc"
 SPR_Annex_Morocco:0 "Annexe Maroc"
 SPR_Strengthen_Falange:0 "Renforcer la Phalange"
 SPR_Strengthen_Falange_desc:0 "Franco a dirigé avec succès le cours de la politique espagnole tout au long des années 40 tumultueuses. Nous devons renforcer l'emprise du FET et de las JONS sur l'Espagne et veiller à ce qu'il reste au pouvoir."
 SPR_Democratic_Underground_Copy:0 "Underground Démocratique"
 SPR_Democratic_Underground_desc:0 "Le fascisme n'a pas sa place dans le monde moderne ! Nous devons former une clandestinité démocratique pour le combattre."
 SPR_Democratic_Underground:0 "Underground Démocratique"
 SPR_Communist_Partisans:0 "Partisans communistes"
 SPR_Rappoachment_with_America:0 "Rapprochement avec l'Amérique"
 SPR_Rappoachment_with_America_desc:0 "Nous avons réussi à éviter le conflit avec les Alliés occidentaux et le Komintern en grande partie parce que nous savions que nous n'étions pas affiliés à Hitler. Malgré cela, l'Amérique nous considère comme un allié potentiel. Dans des moments comme ceux-là, nous ne pouvons pas nous permettre d'être ennemis des Américains. Il est temps de commencer à réparer les barrières."
 SPR_The_Pact_of_Madrid:0 "Le Pacte de Madrid"
 SPR_The_Pact_of_Madrid_desc:0 "Le Pacte de Madrid mettra fin à une période de quasi-isolement de l'Espagne. La signature de cet accord avec les États-Unis nous permettra d'obtenir l'aide économique et militaire nécessaire, en échange de l'autorisation d'installer et d'exploiter des installations militaires par la marine et l'armée de l'air américaines."
 SPR_Suppress_Left_Wing_Movements:0 "Supprimer les mouvements de gauche"
 SPR_Suppress_Left_Wing_Movements_desc:0 "Les mouvements de gauche constituent une menace dangereuse pour notre domination sur le pays. En tant que traîtres à l'État, ils ne méritent ni soutien ni clémence et doivent être éradiqués."
 SPR_Algerian_War_Opportunity:0 "Opportunité de guerre en Algérie"
 SPR_End_of_the_Algerian_War:0 "Restez en dehors de l'Algérie"
 SPR_Intervene_in_Algeria1:0 "Intervenir en Algérie"
 SPR_Reshuffle_the_Cabinet:0 "Manifestations contre l'isolement"
 SPR_Reshuffle_the_Cabinet_desc:0 "Nombreux sont ceux qui, en Espagne, estiment que la politique isolationniste actuelle imposée par les Alliés occidentaux porte préjudice à l'Espagne. Nous devons mettre fin à cette erreur diplomatique par tous les moyens nécessaires."
 SPR_Reliance_on_Falange:0 "Le fascisme traditionnel"
 SPR_Reliance_on_Falange_desc:0 "L'idéologie phalangiste de Franco n'est pas la même chose que le fascisme traditionnel. Il faut donc se débarrasser de lui et amener quelqu'un de plus traditionnel à sa place pour mener l'Espagne vers la gloire !"
 SPR_Democratic_Reforms:0 "Réformes démocratiques"
 SPR_Demand_Morocco:0 "Exigez le Maroc"
 SPR_Demand_Morocco_desc:0 "Nous avons signé un traité avec la France en 1912 pour diviser le Maroc en deux zones d'occupation, l'Espagne recevant le Rif et une zone tampon avec la province espagnole du Sahara, tandis que la France contrôlerait le reste. Toutefois, nos intérêts nationaux font qu'une telle situation constitue une menace. Afin de sécuriser nos participations au Maroc et de sécuriser la patrie elle-même, le Maroc doit être uni sous notre domination."
 SPR_Invade_Libya:0 "Envahir la Libye"
 SPR_Invade_Libya_desc:0 "Les Senussi règnent désormais sur l'ensemble de la Libye depuis la chute de l'Empire italien. Plus important encore, les Senussi contrôlent un bon pourcentage des réserves pétrolières du pays, ce qui est à notre portée. Nous avons besoin de ce pétrole, alors élaborons un plan pour conquérir ce territoire !"
 SPR_Strengthen_Ties_To_Portugal:0 "Renforcer les liens avec le Portugal"
 SPR_Support_French_Nationalists:0 "Soutenez les nationalistes français"
 SPR_The_Concordat:0 "Le Concordat"
 SPR_War_With_Brazil:0 "Guerre avec le Brésil"
 SPR_Reclaim_Venezuela:0 "Récupérer le Venezuela"
 SPR_Reclaim_Venezuela_desc:0 "Le Venezuela est le pays d'origine de ce traître Simon Bolivar, dont les exploits ont conduit à la perte de l'Amérique du Sud au profit des révolutionnaires. Pour la gloire de tous les Hispaniques, restaurons la capitainerie générale du Venezuela !"
 SPR_Reclaim_Cuba:0 "Récupérer Cuba"
 SPR_Reclaim_Cuba_desc:0 "Depuis que nous avons perdu Cuba en 1898, l'île est tombée dans une petite dictature et dans la corruption sociale. Il est temps que nous récupérions cette colonie capricieuse et que nous élevions la réputation de la race hispanique."
 SPR_Falangist_Propaganda_in_Latin_America:0 "Propagande phalangiste en Amérique latine"
 SPR_Falangist_Propaganda_in_Latin_America_desc:0 "Les différentes nations d'Amérique latine ont vu de quoi l'Espagne était capable grâce à la reconquête du Venezuela et de Cuba. Il est temps qu'ils voient le vrai chemin du Falango-Fascisme !"
 SPR_Propose_Hispanic_Unification:0 "Proposer l'unification hispanique"
 SPR_Propose_Hispanic_Unification_desc:0 "Alors que nombre de nos partenaires hispanophones des Caraïbes sont désormais engagés dans la pensée phalangiste, le moment est venu pour nos dirigeants de se rencontrer pour discuter d'une patrie unie pour tous les hispanophones. Tous les peuples sous une même bannière, la bannière de l'Espagne !"
 SPR_Align_with_Mao:0 "S'aligner sur Mao"
 SPR_Maoist_Backed_Coup:0 "Coup d'État soutenu par les maoïstes"
 SPR_Cultural_Revolution:0 "Révolution culturelle"
 SPR_Condemn_Soviet_Agression:0 "Condamner l'agression soviétique"
 SPR_The_Second_Spanish_Civil_War:0 "La deuxième guerre civile espagnole"
 SPR_Intervene_in_Algeria:0 "Intervenir en Algérie"
 SPR_Seek_Soviet_Support:0 "Rechercher le soutien soviétique"
 SPR_Soviet_Backed_Coup:0 "Coup d'État soutenu par les Soviétiques"
 SPR_The_Five_Year_Plan:0 "Le premier plan quinquennal"
 SPR_Subvert_the_Spanish_Church:0 "Subvertir l'Église espagnole"
 SPR_Seek_Western_Support:0 "Le soutien occidental à la démocratie"
 SPR_Seek_Western_Support_desc:0 "Il existe un certain nombre de nations et de factions en Amérique et en Europe qui préféreraient soutenir un régime démocratique en Espagne plutôt qu'un régime autocratique. La France en particulier serait un digne partisan de la fin du régime franquiste."
 SPR_Another_Spanish_Civil_War:0 "Une autre guerre civile espagnole"
 SPR_Declare_the_Spanish_Republic:0 "Déclarer la République espagnole"
 SPR_Rebuild_Spain:0 "Reconstruire l'Espagne"
 SPR_Embrace_Capitalism:0 "Embrassez le capitalisme"
 SPR_Embrace_Capitalism_desc:0 "Les politiques économiques protectionnistes de Franco font plus de mal que de bien à l'économie espagnole. Afin de faciliter un véritable miracle économique, nous devons adopter des politiques capitalistes."
 SPR_Seek_Closer_Ties_to_France:0 "Rechercher des liens plus étroits avec la France"
 SPR_Seek_Closer_Ties_to_France_desc:0 "La France est la démocratie la plus forte la plus proche de nous et elle est un allié fidèle depuis de nombreux siècles. Il est tout naturel que nous recherchions des liens avec nos amis français."
 SPR_Influence_Portugal:0 "Soutenir la démocratie au Portugal"
 SPR_Influence_Portugal_desc:0 "Salazar règne sur le Portugal depuis trop longtemps. Nous soutiendrons secrètement les éléments républicains au Portugal dans l'espoir de les laisser renverser le gouvernement et de le remplacer par une véritable République portugaise."
 SPR_Aid_France_in_Algeria:0 "Aide la France en Algérie"
 SPR_Aid_France_in_Algeria_desc:0 "Contrairement à nos entités coloniales, l'Algérie fait partie intégrante de la République française. Ces nationalistes algériens sont des traîtres envers les Français et, à ce titre, nous devrions venir soutenir notre allié et faire la guerre à ces traîtres."
 SPR_Begin_Decolonization:0 "Décolonisation"
 SPR_Begin_Decolonization_desc:0 "De nos jours, nous devons donner aux peuples de nos colonies l'autodétermination. Nous accorderons immédiatement leur indépendance à nos colonies !"
 SPR_Spanish_Republic_Joins_NATO:0 ""
 SPR_Reliance_on_Opus_Dei:0 "Statu quo"
 SPR_Reliance_on_Opus_Dei_desc:0 "Le cabinet a été remanié et composé de personnes fidèles à Franco et à l'État espagnol."
 SPR_the_Ifni_War:0 "Combattez jusqu'à la fin"
 SPR_the_Ifni_War_desc:0 "Le Royaume marocain menace de prendre le contrôle de nos territoires dans la région. Nous ne laisserons pas cela se produire. Rassemblez les hommes, nous défendrons nos territoires jusqu'au bout !"
 SPR_Peace_With_Morocco:0 "Paix avec le Maroc"
 SPR_Peace_With_Morocco_desc:0 "Il est temps de proposer la paix avec les Marocains et d'abandonner le contrôle de territoires spécifiques qu'ils revendiquent dans des limites raisonnables."
 SPR_Proclaim_the_Spanish_Empire:0 "Proclamer l'Union hispanique"
 SPR_Proclaim_the_Spanish_Empire_desc:0 "Nous sommes maintenant prêts pour cela. C'est pour cela que nous nous sommes battus. C'est pourquoi Franco a dû partir. Pour l'unité de tous les Hispaniques. ¡Por el Imperio Español! Par la Unión Hispana!"
 SPR_Independence_for_Spanish_Guinea:0 "Indépendance de la Guinée espagnole"
 SPR_The_Begining_of_the_Spanish_Miracle:0 "Le début du miracle espagnol"
 SPR_The_Begining_of_the_Spanish_Miracle_desc:0 "Grâce aux efforts de nos technocrates et de nos industriels, notre économie a atteint un niveau jamais vu auparavant. Nous pouvons enfin laisser derrière nous l'héritage laissé par Napoléon !"
 SPR_Bureacratic_Centralism:0 "Centralisme bureaucratique"
 SPR_Aid_Algerian_Rebels:0 "Aidez les rebelles algériens"
 SPR_Revolution_in_Portugal:0 "Révolution au Portugal"
 SPR_Invade_Portugal:0 "Envahir le Portugal"
 SPR_Join_the_Warsaw_Pact:0 "Rejoignez le Pacte de Varsovie"
 SPR_Create_the_Western_Pact:0 "Créer le Pacte occidental"
 SPR_Second_Five_Year_Plan:0 "Deuxième plan quinquennal"
 SPR_Declare_the_Iberian_Peoples_Republic:0 "Déclarer la République populaire ibérique"
 SPR_Declare_a_Constiutional_Monarchy:0 "Déclarer une monarchie constitutionnelle"
 SPR_American_Development:0 "Développement américain"
 SPR_Join_NATO_early:0 "Rejoignez l'OTAN rapidement"
 SPR_60s_Liberalisation:0 "Libéralisation"
 SPR_60s_Liberalisation_desc:0 "L'Espagne est une dictature militaire depuis 1939. Au cours de ces 20 années, nous avons connu des hauts et des bas, mais il est certain qu'il faut changer quelque chose."
 SPR_60s_Spanish_economy:0 "L'économie espagnole"
 SPR_60s_Spanish_economy_desc:0 "Alors que l'économie espagnole est en plein essor, nous sommes confrontés à deux factions au sein du gouvernement autarcique, qui croient que nous devrions augmenter les dépenses militaires, et des technocrates, qui tentent de maintenir cette voie. Le choix sera difficile et cela n'affectera pas seulement la nation espagnole sur le plan économique."
 SPR_60s_Legacy_of_Fascism:0 "L'héritage du fascisme"
 SPR_60s_Legacy_of_Fascism_desc:0 ""
 SPR_60s_Expand_the_Army:0 "Développer l'armée"
 SPR_60s_Expand_the_Army_desc:0 ""
 SPR_60s_Morocco_Crisis:0 "Intifada de Zemla"
 SPR_60s_Morocco_Crisis_desc:0 ""
 SPR_60s_Reject_Decolonisation:0 "Rejeter la décolonisation"
 SPR_60s_Reject_Decolonisation_desc:0 "Les Africains ne peuvent pas gouverner leur propre pays. Ils sont sans éducation, affamés et ne connaissent rien à l'économie ou à l'armée. Nous perdrions également beaucoup de ressources précieuses si nous leur laissions l'indépendance. Par conséquent, tant qu'existera l'État espagnol, nos colonies resteront des colonies."
 SPR_60s_Critics_of_the_Government:0 "Critiques du gouvernement"
 SPR_60s_Critics_of_the_Government_desc:0 ""
 SPR_Long_Live_Franco:0 "Vive Franco"
 SPR_Long_Live_Franco_desc:0 ""
 SPR_60s_Demand_Gibraltar:0 "Exigez Gibraltar"
 SPR_60s_Demand_Gibraltar_desc:0 ""
 SPR_60s_Atlanatic_Fleet:0 "Flotte de l'Atlantique"
 SPR_60s_Atlanatic_Fleet_desc:0 ""
 SPR_60s_Franco_Steps_Down:0 "Franco démissionne"
 SPR_60s_Franco_Steps_Down_desc:0 ""
 SPR_60s_Third_Spanish_Republic:0 "Troisième République espagnole"
 SPR_60s_Third_Spanish_Republic_desc:0 ""
 SPR_60s_Legacy_of_the_Spanish_Civil_War:0 "L'héritage de la guerre civile espagnole"
 SPR_60s_Legacy_of_the_Spanish_Civil_War_desc:0 ""
 SPR_60s_Carrillo_returns_from_exile:0 "Carrillo revient d'exil"
 SPR_60s_Carrillo_returns_from_exile_desc:0 ""
 SPR_60s_Align_with_China:0 "S'aligner sur la Chine"
 SPR_60s_Align_with_China_desc:0 ""
 SPR_60s_The_Vietnam_War:0 "La guerre du Vietnam"
 SPR_60s_The_Vietnam_War_desc:0 ""
 SPR_Send_Medical_and_Economic_Aid:0 "Envoyer une aide médicale et économique"
 SPR_Send_Medical_and_Economic_Aid_desc:0 ""
 SPR_60s_Monarchists_take_power:0 "Les monarchistes prennent le pouvoir"
 SPR_60s_Monarchists_take_power_desc:0 "Juan Ier vient de déclarer une nouvelle ère pour l'Espagne. La monarchie a été rétablie et nous nous posons maintenant la question : devrions-nous avoir une monarchie constitutionnelle comme au Royaume-Uni ou au Japon, ou Juan devrait-il gouverner le pays avec son poing ?"
 SPR_60s_Constitutional_monarchy:0 "Monarchie constitutionnelle"
 SPR_60s_Constitutional_monarchy_desc:0 "Il n'existe pratiquement aucune grande puissance dirigée par un roi seul sur le pays. Nous avions Franco comme dictateur - et nous n'en avons pas besoin d'un autre."
 SPR_60s_Give_Guinea_Independence:0 "Donnez l'indépendance à la Guinée"
 SPR_60s_Give_Guinea_Independence_desc:0 ""
 SPR_60s_Suarez_as_Prime_Minister:0 "Suarez comme Premier ministre"
 SPR_60s_Suarez_as_Prime_Minister_desc:0 "Le charme, l'intelligence et la vigilance d'Adolfo Suarez ont été les raisons qui ont poussé le roi à décider ce jeune homme à devenir le nouveau Premier ministre d'Espagne. Sous sa direction, l'Espagne prospérera."
 SPR_Send_Volunteers:0 "Envoyer des volontaires au Vietnam"
 SPR_Send_Volunteers_desc:0 ""
 SPR_Seek_American_Payment:0 "Rechercher un paiement américain"
 SPR_Seek_American_Payment_desc:0 ""
 SPR_60s_Espanoles_en_Vietnam:0 "Espagnols au Vietnam"
 SPR_60s_Espanoles_en_Vietnam_desc:0 ""
 SPR_60s_Embrace_the_Carlist_Faction:0 "La faction carliste"
 SPR_60s_Embrace_the_Carlist_Faction_desc:0 ""
 SPR_Embrace_Traditional_Catholicism:0 "Adoptez le catholicisme traditionnel"
 SPR_Embrace_Traditional_Catholicism_desc:0 ""
 SPR_60s_Apply_for_NATO_Membership:0 "Demande d'adhésion à l'OTAN"
 SPR_60s_Apply_for_NATO_Membership_desc:0 ""
 SPR_Heavy_Regulated_Economy:0 "Une économie fortement réglementée"
 SPR_Heavy_Regulated_Economy_desc:0 ""
 SPR_60s_Democratisation_of_the_regime:0 "Démocratisation du régime"
 SPR_60s_Democratisation_of_the_regime_desc:0 ""
 SPR_60s_Join_NATO:0 "Rejoindre l'OTAN"
 SPR_60s_Join_NATO_desc:0 ""
 SPR_60s_Allow_political_parties:0 "Autoriser les partis politiques"
 SPR_60s_Allow_political_parties_desc:0 ""
 SPR_60s_Presidential_elections:0 "Élections présidentielles"
 SPR_60s_Presidential_elections_desc:0 "Cela fait des décennies. Des décennies depuis les dernières élections. Les gens sont contents, mais ils ne le seront pas pour longtemps, car comme candidats, nous avons deux conservateurs prêts à établir une dictature pire que le régime de Franco. Ce seraient probablement nos dernières élections de cette décennie."
 SPR_60s_Manuel_Fraga_Iribarne:0 "Manuel Fraga Iribarne"
 SPR_60s_Manuel_Fraga_Iribarne_desc:0 ""
 SPR_60s_La_calle_es_mia:0 "La Calle Es Mià"
 SPR_60s_La_calle_es_mia_desc:0 ""
 SPR_60s_Right_wing_republic:0 "République de droite"
 SPR_60s_Right_wing_republic_desc:0 ""
 SPR_60s_Carlos_Arias_Navarro:0 "Carlos Arias Navarro"
 SPR_60s_Carlos_Arias_Navarro_desc:0 "Navarro a gagné. Bien qu'il ait l'intention d'organiser des référendums pour la Catalogne et le Pays basque, il souhaite également restaurer le parti phalangiste en Espagne. Il a critiqué et dénoncé Franco pour ne pas entrer dans l'Axe parce que, comme il l'a déclaré, les troupes espagnoles feraient une grande différence dans la Seconde Guerre mondiale. Les gens le détestent déjà et soupçonnent ouvertement qu'il a pu truquer les élections."
 SPR_60s_Denounce_Franco:0 "Dénoncer Franco"
 SPR_60s_Denounce_Franco_desc:0 ""
 SPR_60s_Refererndums_for_Catalonia_and_Basque:0 "Référendums pour la Catalogne et le Pays basque"
 SPR_60s_Refererndums_for_Catalonia_and_Basque_desc:0 ""
 SPR_60s_Condemn_Portuguese_Colonialism:0 "Condamner le colonialisme portugais"
 SPR_60s_Condemn_Portuguese_Colonialism_desc:0 ""
 SPR_60s_Maintain_technocracy:0 "Maintenir la technocratie"
 SPR_60s_Maintain_technocracy_desc:0 ""
 SPR_60s_Continued_Industrialization:0 "Poursuivre le programme d'industrialisation"
 SPR_60s_Continued_Industrialization_desc:0 ""
 SPR_60s_Spanish_Economic_Miracle:0 "Le miracle économique espagnol"
 SPR_60s_Spanish_Economic_Miracle_desc:0 ""
 SPR_Invest_in_Infrastructure:0 "Investir dans les infrastructures"
 SPR_Invest_in_Infrastructure_desc:0 "Les routes, les autoroutes et les chemins de fer sécurisent notre économie. Nous ne pouvons pas prospecter si nous utilisons des routes construites avant la Seconde Guerre mondiale et la guerre civile. Nous devons lancer de grands projets de reconstruction des infrastructures espagnoles, sinon notre récent miracle se retournera contre nous."
 SPR_Free_Trade_with_NATO_Members:0 "Libre-échange avec les membres de l'OTAN"
 SPR_Free_Trade_with_NATO_Members_desc:0 ""
 SPR_Market_Economy:0 "Adoptez une économie de marché"
 SPR_Market_Economy_desc:0 ""
 SPR_60s_Rethink_about_our_economy:0 "Repenser notre structure économique"
 SPR_60s_Rethink_about_our_economy_desc:0 ""
 SPR_60s_Military_spending:0 "Augmenter les dépenses militaires"
 SPR_60s_Military_spending_desc:0 ""
 SPR_60s_Autarks_once_again:0 "Ramenez l'autarcie"
 SPR_60s_Autarks_once_again_desc:0 ""
 SPR_60s_New_military_airfields:0 "Nouveaux aérodromes"
 SPR_60s_New_military_airfields_desc:0 "Les aérodromes dans tout le pays assureront notre supériorité aérienne en Espagne et veilleront à ce qu'aucune des forces d'invasion ne revienne vivante chez elle !"
 SPR_60s_Militarist_economy:0 "Économie militariste"
 SPR_60s_Militarist_economy_desc:0 ""
 SPR_60s_Maintain_ban_on_communists:0 "Maintenir l'interdiction des communistes"
 SPR_60s_Maintain_ban_on_communists_desc:0 ""
 SPR_60s_Demand_Puerto_Rico:0 "Exiger Porto Rico"
 SPR_60s_Demand_Puerto_Rico_desc:0 ""
 SPR_60s_Demand_unification_with_Portugal:0 "Exiger l'unification avec le Portugal"
 SPR_60s_Demand_unification_with_Portugal_desc:0 ""
 SPR_60s_Liberation_of_Cuba:0 "Libérer Cuba"
 SPR_60s_Liberation_of_Cuba_desc:0 "Cuba aujourd'hui est tout simplement dégoûtante. Le communisme a fait chuter leur économie et a amené le monde au bord de la Troisième Guerre mondiale. Avec notre flotte atlantique, nous devrions être en mesure d'atteindre Cuba et de la ramener à l'Espagne."
 SPR_60s_Death_of_Franco:0 "Mort de Franco"
 SPR_60s_Death_of_Franco_desc:0 "Notre chef Franco est mort. Il a agrandi l'Espagne et l'a rendue aux jours glorieux. Personne ne peut le remplacer ni remplacer son héritage, mais nous ne pouvons pas survivre sans un leader ferme."
 SPR_60s_Junta_takes_over:0 "La junte prend le pouvoir"
 SPR_60s_Junta_takes_over_desc:0 ""
 SPR_60s_Supress_separatists:0 "Supprimer les séparatistes"
 SPR_60s_Supress_separatists_desc:0 ""
 SPR_60s_Proclaim_Spanish_Empire:0 "Proclamer un nouvel empire espagnol"
 SPR_60s_Proclaim_Spanish_Empire_desc:0 ""
 SPR_60s_Eradicate_elections:0 "Suspendre les élections"
 SPR_60s_Eradicate_elections_desc:0 "Les élections sont un non-sens. Les gens votent, puis ils maudissent le gouvernement et le président pour lesquels ils ont voté. Il est temps d'arrêter cela. Nous avons désormais le sage Iribarna comme président et personne ne peut le remplacer."
