 SPR_assasinate_franco:0 "Noche de los cuchillos largos"
 SPR_assasinate_franco_desc:0 "Notre Nuit des longs couteaux fera \"disparaître\" nos opposants pour toujours"
 SPR_promote_spanish_culture:0 "Promouvoir la culture espagnole"
 SPR_promote_spanish_culture_desc:0 "La corrida, le flamenco et d'autres éléments de la culture espagnole ont été promus par l'Espagne franquiste."
 SPR_meomiers_of_civil_war:0 "Mémoires de la guerre civile"
 SPR_meomiers_of_civil_war_desc:0 "La guerre était horrible et personne ne veut la répéter. Cependant, en même temps, c'est un excellent outil de propagande contre Franco."
 SPR_oust_Franco:0 "Arrêter Franco"
 SPR_oust_Franco_desc:0 "Franco doit être arrêté et emprisonné pour ses crimes contre l'Espagne"
 SPR_extradite_nazi_criminals:0 "Extrader les criminels nazis"
 SPR_extradite_nazi_criminals_desc:0 "De nombreux nazis se sont enfuis en Espagne entre 1944 et 1945. Maintenant, nous les renverrons en Allemagne."
 SPR_tve_foc:0 "Fonder la Televisión Española"
 SPR_tve_foc_desc:0 "Fondée par le gouvernement de Francisco Franco, la TVE est une chaîne de télévision gouvernementale destinée à diffuser la propagande gouvernementale. Après la mort de Franco, TVE est devenue une chaîne de télévision publique classique."
 SPR_crackdown_on_autonomic_regions:0 "Répression des régions autonomes"
 SPR_crackdown_on_autonomic_regions_desc:0 "Ces régions veulent peut-être l'indépendance, mais nous ne la leur donnerons pas."
 SPR_join_nato:0 "Rejoindre l'OTAN"
 SPR_join_nato_desc:0 "L'Organisation du Traité de l'Atlantique Nord des États-Unis représente le phare de la liberté auquel aspire la République espagnole. Avec les bénédictions des autres nations du monde libre, rejoignons-nous et faisons notre place dans cette alliance."
 SPR_democratic_defence_pact:0 "Pacte de défense démocratique"
 SPR_democratic_defence_pact_desc:0 "L'OTAN ne sert pas au mieux les intérêts de la République espagnole. Formons notre propre Pacte de défense local pour défendre l'Espagne et ses amis et alliés contre toute menace à laquelle nous sommes confrontés"
 SPR_agracultural_fixes:0 "Améliorer l'agriculture"
 SPR_agracultural_fixes_desc:0 "À la suite de notre initiative d'industrialisation, les populations rurales de notre pays ont, avant et après la guerre civile, émigrées vers les villes. Nous devrons améliorer nos pratiques agricoles pour compenser, ce qui inclura à terme la mécanisation de notre agriculture."
 SPR_auxilo_social:0 "Auxilio Social"
 SPR_auxilo_social_desc:0 "L'Auxilio Social est une organisation humanitaire et un outil de propagande important pour le régime de Franco. Parmi les nombreuses œuvres qu'ils ont réalisées figuraient la récupération des enfants qui se sont échappés de l'Espagne franquiste après la victoire des nationalistes dans la guerre civile espagnole."
 SPR_end_of_autarky:0 "Fin de l'autarcie"
 SPR_end_of_autarky_desc:0 "Avec notre rapprochement avec d'autres nations, et notre réintroduction sur la scène mondiale, nous pouvons maintenant mettre fin à la pratique de l'autarcie qui a été mise en place depuis la Seconde Guerre mondiale."
 SPR_focus_on_identitety:0 "Identité catholique"
 SPR_focus_on_identitety_desc:0 "Nous, le peuple espagnol, nous sommes toujours considérés comme un peuple catholique. Depuis l'époque de la Reconquista espagnole, nous avons toujours cru en la volonté de notre Seigneur et sauveur, et nous continuerons à l'ancrer dans la mentalité espagnole."
 SPR_spanish_democracy:0 "Démocratie totalitaire"
 SPR_spanish_democracy_desc:0 "Bien que nous nous soyons alignés sur les puissances de l'Occident, la Phalange détient toujours le vrai pouvoir en Espagne. Nous présenterons un minimum de démocratie, in fine, l’héritage de Franco sera préservé."
 SPR_recruitment_campaign:0 "Campagne de recrutement"
 SPR_recruitment_campaign_desc:0 "Aliste hoy para defender el estado Español !Ce seront les mots qui convaincront la population de rejoindre l’armée et de défendre la nation espagnole."
 SPR_continue_diplomatic_isolation:0 "Poursuivre l'isolement diplomatique"
 SPR_continue_diplomatic_isolation_desc:0 "Les puissances occidentales n'ont cessé de nous condamner. En ce qui nous concerne, nous avons peu d'intérêt à les courtiser davantage. Nous continuerons notre isolationnisme diplomatique."
 SPR_new_concordat:0 "Concordato entre el Estado Español y la Santa Sede"
 SPR_new_concordat_desc:0 "Le Concordat est un effort important pour briser l'isolement international de l'Espagne après la Seconde Guerre mondiale. C'est une tentative de réunir une sainte alliance avec l'Espagne et sess voisins immédiats, au premier rang desquels l'Estado Novo de Salazar."
 SPR_join_the_un:0 "Rejoindre les Nations Unies"
 SPR_join_the_un_desc:0 "Avec un rapprochement réussi avec les Américains, Francisco Franco pourrait demander son admission aux Nations Unies. Cette institution a initialement refusé l'Espagne en raison de son parti pris pro-Axe pendant la Seconde Guerre mondiale, mais avec la menace de l'Union soviétique et la pression des Américains, les alliés occidentaux ont cédé et l'Espagne serait admise le 14 décembre 1955."
 SPR_economic_aid:0 "Aide économique américaine"
 SPR_economic_aid_desc:0 "Dans le cadre du Pacte des accords de Madrid en 1953, les États-Unis devaient fournir une aide économique indispensable au gouvernement espagnol. Cela contribuerait à relancer l'économie et a été l'un des facteurs, bien que mineur, qui a conduit au Miracle économique espagnol."
 SPR_autarky_stays:0 "Économie espagnole indépendante"
 SPR_autarky_stays_desc:0 "Même si nous voulons améliorer les relations avec les autres nations du monde, nous devons conserver notre politique d'autarcie. Après tout, nous ne devrions pas être redevables aux gouvernements des autres nations pour une stabilité économique indispensable"
 SPR_iberian_pact:0 "Pacte ibérique"
 SPR_iberian_pact_desc:0 "Le Portugal a été à la fois un ennemi et un allié à travers les siècles. Maintenant que Salazar, un caudillo aux vues similaires est au pouvoir au Portugal, il est peut-être temps de développer des relations plus étroites avec notre voisin ibérique et de former un pacte commun au profit des deux nations."
 SPR_political_chaos:0 "Chaos politique"
 SPR_political_chaos_desc:0 ""
 wartime_debts:0 "Dettes de guerre"
 SPR_memories_of_civil_war:0 "Mémoires de la guerre civile espagnole"
 SPR_memories_of_civil_war_desc:0 "La Guerre civile espagnole a été une période sombre de notre histoire et personne ne veut la répéter. Toutefois, nous pouvons utiliser les crimes contre les droits de l'homme commis pendant la guerre comme un excellent outil de propagande contre Franco."
 SPR_chaos_in_country:0 "Chaos dans le pays"
 SPR_chaos_in_country_desc:0 "Avec les manifestants galvanisés contre Franco et ses phalangistes, le gouvernement se retrouve incapable de gérer correctement le chaos provoqué par la montée de la gauche en Espagne."
 SPR_revolution:0 "Revolución Social Española"
 SPR_revolution_desc:0 "Le moment est venu de déposer Franco une fois pour toutes. Faisons une seconde révolution glorieuse en Espagne et proclamons la République espagnole!"
 SPR_pruge_falangism:0 "Purger les phalangistes"
 SPR_pruge_falangism_desc:0 "Exactement comme ils ont purgé les partisans démocrates et communistes lorsque les nationalistes ont remporté la guerre civile en 1939, nous ferons de même. Nous ne pouvons pas permettre une contre-révolution si peu de temps après avoir récupéré notre pouvoir."
 SPR_unify_idgf:0 "Unifier les antifascistes"
 SPR_unify_idgf_desc:0 "Il existe de nombreux groupes antifascistes notables à la fois en Espagne et à l’étranger. Nous devons appeler tous ceux qui s'opposent au Caudillo et les amener à notre cause !"
 SPR_align_with_moscow:0 "Protégé par Maman Ours"
 SPR_align_with_moscow_desc:0 "Nous sommes une île rouge dans une mer de porcs capitalistes. Si nous voulons pouvoir défendre la révolution, nous devons obtenir le soutien de nos amis à Moscou. Cependant, les Soviétiques peuvent exiger un coût pour leur protection."
 SPR_release_all_colonies:0 "Libérer toutes les colonies"
 SPR_release_all_colonies_desc:0 "Le colonialisme ne fait pas partie du rêve communiste. Nous accorderons immédiatement à nos colonies leur indépendance sous des régimes communistes frères !"
 SPR_closen_with_europe:0 "Plus proche de l'Europe"
 SPR_closen_with_europe_desc:0 "Maintenant que nous commençons à rompre notre isolement, nous devrions resserrer nos liens avec les autres nations européennes."
 SPR_anit_corruption_measures:0 "Mesures anti-corruption"
 SPR_anit_corruption_measures_desc:0 "La corruption est endémique dans le pays en raison de la mauvaise gestion au cours de la dernière décennie. Il faut s'en occuper si nous voulons nous moderniser."
 SPR_economic_freedom:0 "Autoriser plus de libertés économiques"
 SPR_economic_freedom_desc:0 "Afin de tirer parti de nos atouts économiques, nous permettrons une politique économique plus libérale. Adoptons quelques principes capitalistes dans notre économie."
 SPR_stabilization_plan:0 "Plan de Estabilización de 1959"
 SPR_stabilization_plan_desc:0 "Le Plan de stabilisation de 1959 était une série de mesures économiques prises par le gouvernement espagnol en 1959. Son objectif principal était la libéralisation économique des marchés espagnols, marquant un tournant par rapport aux politiques précédentes orientées vers l'autarcie. Ce plan a contribué au boom économique que l'Espagne a connu dans les années 1960 et a réduit l'inflation de 500%."
 SPR_una_grande_libre:0 "¡ Una, Grande y Libre !"
 SPR_una_grande_libre_desc:0 "Une, Grande et Libre, la devise franquiste de l'Espagne était de déterminer les idéaux des nationalistes, une nation indivisible face aux sentiments séparatistes, une nation impériale face aux colonies encore détenues et autrefois détenues, et une nation non soumise aux influences étrangères, face aux complots lancés contre l'Espagne."
 SPR_education_boost:0 "Priorité sur l’amélioration de l'education"
 SPR_education_boost_desc:0 "Nos normes d'éducation sont médiocres et ont conduit au long déclin de la puissance espagnole. Nous devons moderniser notre politique nationale d'éducation."
 SPR_ban_old_shirts:0 "Condamner les Camisas Viejas"
 SPR_ban_old_shirts_desc:0 "Les Vieilles Chemises, les phalangistes à l'appui de l'ancien dirigeant phalangiste José Antonio Primo de Rivera ont remis en question les politiques récentes de la voie suivie par Franco pour l'Espagne. Bien que nous révérions toujours l'héritage de Primo de Rivera, nous ne pouvons pas laisser la vieille garde continuer à remettre en question notre chemin. Nous les éliminerons."
 SPR_convert_portugal:0 "Convertir le Portugal"
 SPR_convert_portugal_desc:0 "Le Portugal est une menace dangereuse pour nos arrières et pour le socialisme espagnol. Nous pourrions leur faire la guerre, mais cela nous attirerait la colère de l'Amérique. Peut-être qu'à la place, nous pouvons parrainer les communistes et les républicains du Portugal pour renverser Salazar. Cela nous protégerait au moins pour le moment."
 SPR_socilize_healthcare:0 "Santé publique socialiste"
 SPR_seize_companies:0 "Saisir les entreprises"
 SPR_the_iron_curtain:0 "Le Rideau de Fer"
 SPR_the_iron_curtain_desc:0 "Tout comme le Rideau de Fer était descendu de Stettin dans la Baltique à Trieste dans l'Adriatique, un deuxième Rideau de Fer descendra, de Bilbao dans l'Atlantique à Barcelone en Méditerranée. Nous sommes maintenant communistes, dans la sphère soviétique, pour la gloire du peuple espagnol."
 SPR_howthefuckdoiwritethislol:0 "Expatrier les nazis"
 SPR_howthefuckdoiwritethislol_desc:0 "Pendant et après la Seconde Guerre mondiale, de nombreux nazis ont cherché refuge dans notre pays. Ils seront renvoyés en Allemagne pour répondre de leurs crimes."
 SPR_return_to_democracy:0 "Retour à la démocratie"
 SPR_return_to_democracy_desc:0 "Bien que nous ayons initié une révolution communiste il y a quelque temps, nous ne devons pas nécessairement être une dictature. Nous rétablirons les institutions démocratiques et travaillerons sur la voie de la libéralisation. Nous établirons un État socialiste avec nos propres caractéristiques uniques."
 SPR_pursuit_the_dream:0 "La révolution doit continuer"
 SPR_pursuit_the_dream_desc:0 "Bien que nous ayons atteint nos objectifs longtemps souhaités depuis la formation de la Deuxième République en 1931, cela ne signifie pas que nous pouvons nous permettre de nous reposer sur nos lauriers. La révolution doit et continuera, et nous répandrons le communisme à l'étranger."
 SPR_puppet_portugal:0 "Libérer le Portugal"
 SPR_puppet_portugal_desc:0 "Le premier pas vers la propagation du communisme à l'étranger devrait être notre voisin occidental. Le peuple portugais souffre depuis longtemps sous les régimes d'un gouvernement militaire et fasciste aux côtés d'un gouvernement bourgeois corrompu. Nous les purgerons et installerons une véritable république socialiste à sa place."
 SPR_example_to_west:0 "Un exemple pour l'Ouest"
 SPR_example_to_west_desc:0 "Qui a dit que les pays communistes devaient être des dictatures corrompues? Pas nous. Nous montrerons aux puissances occidentales que le communisme peut exister sous une institution démocratique."
 SPR_The_Pact_of_Madrid2:0 "Accord militaire américano-espagnol"
 SPR_Reforming_the_Army:0 "Réformer l'armée"
 SPR_Ejercito_de_Tierra:0 "Ejército de Tierra"
 SPR_Re_Thinking_Our_Strategies:0 "Repenser nos stratégies"
 SPR_US_Equipment:0 "Équipement fabriqué aux États-Unis"
 SPR_Renewing_Our_Armory:0 "Renouveler notre armurerie"
 SPR_Armada_Espanola:0 "Armada Espanola"
 SPR_US_Inspired_Designs:0 "Des designs inspirés des États-Unis"
 SPR_Nato_Naval_Tactics:0 "Adopter les tactiques navales de L'OTAN"
 SPR_Unidad_de_Operaciones_Especiales:0 "Unidad de Operaciones Especiales"
 SPR_Ejercito_del_Aire:0 "Ejército del Aire"
 SPR_US_Jets:0 "Jets fabriqués aux États-Unis"
 SPR_Helicopters:0 "Commencer le développement d'hélicoptères"
 SPR_Found_the_Almogavares:0 "Fonder l'Almogavares"
 SPR_Army_Updated:0 "Une armée enfin à jour"
 spr.5.d:0 "Enfin, nous sommes parvenus à un accord entre nous et les États-Unis pour un programme de partage de technologies militaires et l'ouverture de relations diplomatiques et commerciales avec nous"
 spr.6.d:0 "Nos compatriotes sont dans la joie aujourd'hui, car la société \"Chupa Chups\", fondée par Eric Bernat, a ouvert ses portes au public. Bernat, l'un des hommes d'affaires les plus en vue ici en Espagne, il a décidé d'aventurer son entreprise dans une entreprise plus axée sur les jeunes, avec un bonbon appelé \"sucette\" comme produit phare. Lors de son inauguration à Barcelone, il a connu un grand succès, avec des revenus et des bénéfices dépassant les attentes, avec un potentiel d'expansion dans toute l'Espagne et peut-être dans le monde entier. C'est sûrement un excellent exemple des merveilles de l'esprit d'entreprise et de l'ingéniosité espagnols."
 spr.7.d:0 "Les familles et leurs enfants sont excités aujourd'hui, car la nouvelle marque appelée \"Chupa Chups\" a dévoilé une nouvelle gamme de sucettes. Fondé par Enric Bernat, il a imaginé de créer une nouvelle ligne de bonbons, plus orientée vers les enfants car la plupart des clients de ses produits sont des enfants. Au cours de ses premiers jours d'ouverture, il a connu un grand succès, apportant des bénéfices indispensables à l'expansion de l'entreprise, Bernat prévoyant de s'étendre dans toute l'Espagne et potentiellement dans le monde entier si les fonds de son entreprise pouvaient soutenir une croissance aussi énorme."
 Francisco_Franco:0 "Francisco Franco"
 Caudillo:0 "Caudillo de España"
 Francisco_Franco_desc:0 "Né à El Ferrol en 1892, Francisco Franco était un soldat de carrière qui gravit les échelons jusqu'au milieu des années 1930. Franco a rejoint le mouvement rebelle croissant et a rapidement mené un soulèvement contre le gouvernement républicain de gauche et a pris le contrôle du pays après la guerre civile espagnole. Après avoir maintenu la nation neutre pendant la Seconde Guerre mondiale, Franco est maintenant soutenu par le reste de l'Occident en raison de ses opinions anticommunistes. Bien que fasciste dans ses opinions et méthodes politiques, il s'identifie comme un \"conservateur\" et un \"monarchiste\", cherchant simplement à préserver la tradition et la fierté nationale de l'Espagne."
 Falange.1.d:0 "Le gouvernement espagnol a confirmé la suprématie de son idéologie phalangiste en adoptant les Principes Fondamentaux du Mouvement National. Ces principes constituent le fondement idéologique de l'État franquiste. Tous les hauts fonctionnaires du gouvernement devront désormais prêter serment d'allégeance à ces principes pour accéder à des fonctions ou à des postes d'autorité. Le gouvernement espagnol adopte une troisième voie antidémocratique et anticommuniste qui prétend supprimer toute distinction de classe. Le gouvernement croit que grâce à la dictature et à l'ordre, l'Espagne régénérera sa gloire passée. Se rendre au gouvernement et embrasser l'Église sont également des éléments importants du système espagnol. Les observateurs du régime espagnol soutiennent cependant que l'idéologie phalangiste n'est pas une troisième option mais juste une idéologie d'extrême droite. Ils notent que la nouvelle loi cimente davantage la séparation de l'Espagne des courants idéologiques plus larges du monde."
 IC_Franco.1.d:0 "\nLe dictateur espagnol Francisco Franco a déclaré publiquement que la conspiration judéo-maçonnique avait fait grandir sa menace, les Juifs opérant désormais également par le biais du communisme mondial. Depuis le début de son règne, Franco et ses partisans ont ouvertement épousé une croyance dans la conspiration largement discréditée selon laquelle les Juifs contrôlaient le monde par son infiltration des Francs-maçons. Cette conspiration a été popularisée au début du XXe siècle par la publication des Protocoles de Sion. En plus de cette annonce, le gouvernement a déclaré qu'il étendrait la publication et la distribution des Protocoles de Sion. Le gouvernement a également demandé aux ministères concernés de préparer une campagne internationale et nationale pour sensibiliser davantage la population à cette menace élargie."
 SPA_ISR.1.d:0 "Francisco Franco a annoncé une nouvelle campagne pour sensibiliser le public à la menace juive pour la nation espagnole. Franco a noté que le pays ne pouvait pas devenir complaisant face à cette menace. Il a noté que l'existence d'Israël confirme à quel point la menace est devenue forte. Dans une déclaration de suivi, le gouvernement a exhorté les citoyens espagnols à rester vigilants face à la menace. Depuis que Franco est arrivé au pouvoir, il s'est activement engagé dans des campagnes et une propagande antisémites. De nombreux partisans conservateurs du régime ont activement soutenu que le déclin du christianisme et de l'Empire espagnol pouvait être directement lié aux actions d'une conspiration juive internationale. La campagne devrait provoquer l'indignation internationale."
 SPA_MOR.1.d:0 "Le gouvernement espagnol a annoncé qu'il remettrait l'administration et la souveraineté sur le toit au nouvel État marocain nouvellement indépendant. Cette initiative a été bien accueillie par les Marocains et la Ligue arabe. Cette décision reflète une approche plus libérale de la décolonisation suivie par l'Espagne, en particulier par rapport à certains de ses voisins européens. Beaucoup attribuent cela au désir de l'Espagne de mettre fin à son isolement international depuis la fin de la Seconde Guerre mondiale. L'émergence de nouveaux États issus de la décolonisation offre à l'Espagne l'opportunité d'élargir ses relations avec de nouveaux États et de maintenir son idéologie."
 Juby.1.d:0 "Le gouvernement espagnol a annoncé qu'il avait rendu Port Juby au Maroc conformément à son récent accord. Le Maroc avait demandé à l'Espagne de restituer ce qu'il perçoit comme son territoire sous administration espagnole. Après mûre réflexion, le gouvernement espagnol a accepté et, au cours des semaines précédentes, s'est préparé à un transfert en douceur du territoire au Maroc. Cette décision est bien accueillie dans toute l'Afrique du Nord et les observateurs notent qu'il pourrait s'agir d'une tentative de l'Espagne de favoriser les nouveaux États émergents. Le gouvernement espagnol a été confronté à l'isolement de ses voisins européens en raison de son association avec les puissances de l'Axe pendant la dernière guerre. La décolonisation offre à l'Espagne l'occasion de sortir de son isolement international et de s'engager avec d'autres États."
 Opus_Dei.1.d:0 "L'Opus Dei a été fondé par des prêtres espagnols en 1928 pour servir de guide spirituel au monde séculier. Après la Guerre civile espagnole, le groupe a commencé à se développer parmi les partisans de Franco. Au milieu des années 1940, le groupe s'est développé à l'échelle internationale et a récemment reçu l'approbation papale. La politique du gouvernement espagnol de promouvoir la piété religieuse et de relier l'État à la religion a fait de l'Opus Dei un choix parfait pour les partisans de Franco. Son statut d'institution ecclésiale laïque permet à ses membres de rester attachés au catholicisme mais aussi dévoués à l'État espagnol. Aujourd'hui, les membres de l'Opus Dei dominent le gouvernement espagnol et offrent des conseils spirituels et un soutien aux hauts fonctionnaires de l'État."
 SPA_MOR.2.d:0 "Le Maroc a récemment demandé à l'Espagne de restituer Ifni, qui avait été cédé par le Maroc en 1860. Le Maroc soutient qu'il avait été contraint de céder la terre en raison de la menace des puissances colonisatrices, mais qu'elle doit maintenant être restituée. Après de nombreuses consultations, le gouvernement espagnol a accepté et depuis hier, Ifni est désormais sous administration marocaine. Le dernier navire d'officiels espagnols est parti peu de temps après la cérémonie de transfert. De nombreux observateurs notent que la décision espagnole contraste avec nombre de ses voisins européens qui ont adopté une ligne beaucoup plus dure sur la question de la décolonisation. Ils attribuent la décision de l'Espagne à un désir de gagner la faveur et de nouvelles voies de relations diplomatiques pour briser l'isolement international auquel l'Espagne a été confrontée pour sa coopération en temps de guerre avec les puissances de l'Axe."
 eng_mobilization.2.d:0 "Certains des 400 navires de guerre qui constituent la flotte de réserve de la Royal Navy, qui comprend des cuirassés, des croiseurs, des porte-avions, des destroyers, des frégates et des dragueurs de mines, se préparent à appareiller en raison des tensions et des conflits mondiaux et agissent comme une éventualité d'urgence face aux menaces croissantes. Considérée par beaucoup comme un assemblage de navires de guerre morts et inutiles, la flotte a été mobilisée et subit actuellement des finitions pour naviguer à nouveau en haute mer grâce à son brillant état-major de commandement. Il sera prêt à reconstituer la flotte active à tout moment et les courageux marins de la Royal Navy, la flotte de réserve étant déjà en route pour protéger les intérêts britanniques outre-mer et apporter un soutien à la flotte principale de la Royal Navy."
 usa_mobilization.1.d:0 "En raison des tensions croissantes et de la nécessité d'une plus grande présence militaire, certaines parties de la flotte américaine de naphtaline, principalement des navires semi-modernes en raison des compressions de défense de la fin des années 1940, vont être les premières à être rappelées au service actif pour fournir un soutien à la flotte principale à l'étranger. Avec une poignée de porte-avions, de destroyers et de croiseurs ainsi que des navires amphibies et auxiliaires prêts à reprendre la mer tandis que les navires plus gros et plus volumineux tels que les croiseurs et les cuirassés plus lourds subissent des travaux supplémentaires pour se préparer au besoin à être remis en service, le public américain ne peut que se demander si ces navires résisteront à l'épreuve du temps et si l'infaillibilité de la marine des États-Unis est toujours valable à ce jour."
 usa_mobilization.2.d:0 "Une partie de la flotte de réserve ayant déjà appareillé, le reste de la réserve a maintenant terminé les travaux de remise en service et les marins y affluent ainsi que les aviateurs de la marine préparant leurs avions. De nombreux porte-avions, cuirassés, croiseurs et trop de destroyers pour en compter partiront comme le plus grand déploiement de navires depuis la Seconde Guerre mondiale. La Marine a fait une déclaration qui mentionne la protection des intérêts américains et la vie de tous les marins américains à bord des navires en mer, ils doivent se préparer et prendre toutes les mesures nécessaires à la défense des États-Unis d'Amérique et de ses alliés."