tutorial.1000.t:0 "[GetNewspaperHeader]Guerre froide : le rideau de fer TUTORIEL"
 tutorial.1000.d:0 "Bienvenue dans le mod Guerre froide : Le rideau de fer. Veuillez lire le didacticiel, car il explique les nouveaux mécanismes, tels que les hélicoptères, les missiles nucléaires et la déclaration de guerre."
 tutorial.1000.a:0 "Apprenez-moi les nouvelles mécaniques."
 tutorial.1000.b:0 "Je sais déjà jouer."
 
 tutorial.1.t:0 "Menu Tutoriel"
 tutorial.1.d:0 "Choisissez le sujet que vous souhaitez en savoir plus dans ce mod."
 tutorial.2.t:0 "Menu Tutoriel - Page 2"
 tutorial.2.d:0 "Choisissez le sujet que vous souhaitez en savoir plus dans ce mod."
 tutorial.1.dd:0 "Page suivante"
 tutorial.1.a:0 "Apprenez-moi ce qu'est le DEFCON et comment déclarer la guerre."
 tutorial.1.b:0 "Apprenez-moi les missiles nucléaires."
 tutorial.1.c:0 "Apprenez-moi les hélicoptères."
 tutorial.1.f:0 "Parlez-moi de l'OTAN."
 tutorial.1.g:0 "Apprenez-moi les armes chimiques."
 tutorial.1.e:0 "Je n'ai pas besoin d'apprendre autre chose."
 tutorial.1.h:0 "Retourner"
 
 tutorial.go:0 "Continuez."
 tutorial.back:0 "Retournez."
 tutorial.menu:0 "Retour au menu."
 
 tutorial.11.t:0 "Menu DÉFCON"
 tutorial.11.d:0 "DEFCON est une nouvelle mécanique introduite dans notre mod et peut être déroutante à comprendre. DEFCON affecte désormais la façon dont vous déclarez la guerre ou la façon dont vous interagissez militairement avec d'autres pays."
 tutorial.12.t:0 "DÉFCON V"
 tutorial.12.d:0 "Tout d'abord, nous avons DEFCON 5. Cela signifie un temps de paix et comporte le moins d'actions de guerre possible. DEFCON 5 est déjà sélectionné pour vous et cela affecte déjà ce que vous pouvez faire militairement. Vous ne pourrez pas déclarer la guerre du tout tant que vous n'aurez pas atteint 50 % de tension mondiale ou qu'un événement vous fera déclarer la guerre ou que vous déclarerez la guerre à un pays. Un exemple serait la guerre de Corée et l'appel des États-Unis. Cela débloquerait l'utilisation de DEFCON 3. Les guerres par procuration sont plus importantes désormais car vous ne pouvez pas entièrement déclarer la guerre, mais vous pouvez toujours envoyer des baux fonciers ou envoyer des volontaires."
 
 tutorial.13.t:0 "DÉFCON IV"
 tutorial.13.d:0 "DEFCON 4 est débloqué lorsqu'il y a plus de 25 % de tension mondiale. Vous pouvez envoyer plus de volontaires et prêter un bail à vos guerres par procuration. Vous pouvez également influencer de plus en plus les pays avec chaque DEFCON."
 tutorial.14.t:0 "DÉFCON III"
 tutorial.14.d:0 "DEFCON 3 est le moment où les choses commencent à devenir sérieuses. Vous ne pouvez activer DEFCON 3 que pendant une guerre (pas une guerre mondiale, mais une guerre par procuration par exemple. Vous devez avoir plus de 50 % de tension mondiale. Avec DEFCON 3, vous pouvez désormais envoyer de plus en plus de prêt-bail et de volontaires, mais vous pouvez désormais déclarer vos propres guerres. Avec DEFCON 2, vous avez besoin de 75 % ou plus de tension mondiale."
 tutorial.15.t:0 "DÉFCON II"
 tutorial.15.d:0 "DEFCON 2 peut vous permettre d'envoyer beaucoup plus de volontaires et de prêter des baux, et rend également les CB et les guerres encore moins chers. DEFCON 1 nécessite plus de 95 % de tension mondiale pour se débloquer."
 tutorial.16.t:0 "DÉFCON JE"
 tutorial.16.d:0 "DEFCON 1 peut vous permettre d'envoyer un maximum de volontaires et de prêter un bail, tout en déclarant vos propres guerres encore moins chères. Cela provoque une guerre totale et mettra probablement fin au monde pour vous alors que la Troisième Guerre mondiale éclatera."
 tutorial.17.t:0 "DEFCON : Conclusion"
 tutorial.17.d:0 "Voici les étapes à suivre pour savoir comment cela fonctionne et nous espérons que ce tutoriel vous aidera, maintenant allez jouer à Global Thermonuclear War !\n\n\n-De la guerre froide : l'équipe de développement du rideau de fer"
 
 tutorial.22.t:0 "Missiles Nucléaires"
 tutorial.22.d:0 "« Missiles nucléaires » est une nouvelle mécanique introduite dans notre mod et peut être déroutante à comprendre. Il existe 2 types de bombes nucléaires : la fission atomique (bombes atomiques) et la fusion atomique (bombes à hydrogène) et 4 types de missiles nucléaires : le missile balistique lancé sous-marin (SLBM), le missile balistique à courte portée (SRBM), le missile balistique à portée intermédiaire (IRBM) et le missile balistique intercontinental (ICBM)."
 tutorial.23.t:0 "Missiles nucléaires II"
 tutorial.23.d:0 "Les SLBM peuvent être lancés depuis n'importe où dans le monde à partir de sous-marins balistiques. Les SRBM sont des missiles à courte portée et n'ont qu'une portée de quelques centaines de kilomètres. (Exemple : de l'Allemagne de l'Ouest à l'ouest de la Pologne). Les IRBM vont de plusieurs centaines de kilomètres à quelques milliers. (Exemple : de l'Est de la France à Moscou). Les ICBM peuvent pratiquement toucher n'importe quoi dans le monde. (Exemple : de l'est des États-Unis à l'ouest de la Russie). Voici comment construire et utiliser des missiles nucléaires :"
 tutorial.24.t:0 "Missile nucléaire : étape 1."
 tutorial.24.d:0 "Étape 1. Une fois que vous ouvrez l'onglet de recherche, vous verrez l'onglet à l'extrémité. Le symbole radioactif est l'onglet de l'arborescence WMD. Cliquez dessus et cela vous mènera à l'arborescence WMD."
 tutorial.25.t:0 "Missile nucléaire : étape 2."
 tutorial.25.d:0 "Étape 2. Une fois que vous êtes sur l'onglet WMD, vous verrez tous les missiles et bombes. Cliquez maintenant pour rechercher un missile ou une bombe. Pour cela, nous utiliserons un missile."
 tutorial.26.t:0 "Missile nucléaire : étape 3."
 tutorial.26.d:0 "Étape 3. Une fois que vous avez recherché un missile, vous accédez à l'onglet production. Une fois sur place, tous les missiles et bombes sont classés parmi les avions. Une fois cela fait, vous construisez le missile que vous voulez."
 tutorial.27.t:0 "Missile nucléaire : étape 4."
 tutorial.27.d:0 "Étape 4. Une fois la construction des missiles terminée, vous devez ensuite trouver où ils se trouvent. Ils apparaîtront sur les aérodromes et vous pourrez les positionner sur les aérodromes où vous le souhaitez. Vous créez une nouvelle aile aérienne et elle se formera."
 tutorial.28.t:0 "Missile nucléaire : étape 5."
 tutorial.28.d:0 "Étape 5. Maintenant, une fois que vous les avez placés sur un aérodrome, vous pouvez survoler l'aérodrome et voir la portée du missile. C'est tout ce qu'ils peuvent aller. Si vous souhaitez une plus grande portée, recherchez une classe technologique ultérieure ou recherchez un missile plus gros avec une plus grande portée."
 tutorial.29.t:0 "Missile nucléaire : étape 6 (SLBM)."
 tutorial.29.d:0 "(Facultatif/Uniquement pour les SLBM) Étape 6. Pour les SRBM, ils agissent comme des avions navals pour les porte-avions. Vous devez construire une nouvelle classe de sous-marins. Cette classe est un sous-marin balistique. Ensuite, vous faites ce que vous faites habituellement pour les avions sur porte-avions et vous les ajoutez là."
 tutorial.30.t:0 "Missile nucléaire : étape 7."
 tutorial.30.d:0 "Étape 7. Une fois ces étapes effectuées, vous êtes désormais disponible pour mener une guerre thermonucléaire mondiale. Pour ce faire, cliquez simplement sur une province et le bouton nucléaire vanille sera là. Cela enverra le missile vers la province et KABOOM, une explosion nucléaire se déclenchera et la guerre nucléaire commencera."
 tutorial.31.t:0 "Conclusion sur les missiles nucléaires"
 tutorial.31.d:0 "Ce sont les étapes de leur fonctionnement ; nous espérons que ce tutoriel vous a aidé, maintenant allez provoquer Armageddon sur le monde !\n\n\n-De la guerre froide : l'équipe de développement du rideau de fer"
 
 tutorial.33.t:0 "Hélicoptères"
 tutorial.33.d:0 "Les hélicoptères sont une nouvelle mécanique introduite dans notre mod et peuvent être déroutants à comprendre. Il existe 4 types d'hélicoptères : cargo, utilitaire, d'attaque, d'attaque légère/éclaireur et ASW."
 
 tutorial.34.t:0 "Cargaison"
 tutorial.34.d:0 "Cargo s'occupe du transport du ravitaillement et veille à ce que vos troupes soient approvisionnées."
 
 tutorial.35.t:0 "Utilitaire"
 tutorial.35.d:0 "Utility s'occupe du transport de troupes sur de courtes distances, se déplace rapidement et inflige un peu de dégâts en raison des canons de porte et des nacelles d'armes à feu. Utility constituera également un nouveau modèle de division Air Cavalry."
 
 tutorial.36.t:0 "Attaque"
 tutorial.36.d:0 "Les hélicoptères d'attaque attaquent les unités terrestres et infligent des dégâts aux unités aériennes. Les hélicoptères d'attaque font également partie des modèles de division et donneront des améliorations à l'attaque."
 
 tutorial.37.t:0 "Attaque légère/Éclaireur"
 tutorial.37.d:0 "Light Attack/Scout s'occupe principalement de la reconnaissance mais peut infliger de légers dégâts aux unités terrestres. Les hélicoptères scouts sont très rapides car ils sont légers."
 
 tutorial.38.t:0 "Guerre anti-sous-marine"
 tutorial.38.d:0 "L'ASW s'occupe d'attaquer des navires ou des sous-marins et est le seul hélicoptère capable d'attaquer des unités navales. Les hélicoptères ASW s'attachent aux porte-hélicoptères et aux porte-avions réguliers, bien que vous ne puissiez pas en installer grand-chose sur les porte-avions réguliers."
 tutorial.39.t:0 "Hélicoptères II"
 tutorial.39.d:0 "les hélicoptères peuvent être rapides et moins chers à produire, ils sont plus faciles à éliminer car ils ne sont pas aussi rapides que les avions. Alors choisissez judicieusement ce que vous voudriez faire."
 tutorial.40.t:0 "Conclusion sur les hélicoptères"
 tutorial.40.d:0 "Ce sont les étapes de fonctionnement et nous espérons que ce tutoriel vous aidera. Maintenant, allez jouer à Fortune Son dans un hélicoptère !\n\n\n-De la guerre froide : l'équipe de développement du rideau de fer"

 tutorial.44.t:0 "OTAN"
 tutorial.44.d:0 "L'OTAN est désormais une alliance défensive depuis la mise à jour 3.10. Cela signifie qu'il n'apparaît pas sur l'écran de faction et ne peut être vu qu'à travers l'idée attribuée à un pays. Lorsque l'un d'eux est attaqué, l'autre a la possibilité de le rejoindre. Leur acceptation dépend de la force/faiblesse du pays ennemi."

 tutorial.55.t:0 "Armes chimiques"
 tutorial.55.d:0 "Les armes chimiques sont des capacités qui peuvent être débloquées grâce à leurs recherches dans l'onglet WMD Tech. Vous devez produire 50 unités d'une arme pour pouvoir utiliser cette capacité avec votre commandant.\n\nCela nécessite le DLC Waking the Tiger."

 tutorial.211.d:0 "Le rideau de fer de la guerre froide introduit un tout nouveau système d'armes de destruction massive, permettant des échanges nucléaires plus complexes et stratégiques par rapport à la méthode standard \"cliquez sur chaque province\". L'interface graphique comporte 8 parties de base. \n 1. L'écran en haut à gauche montre les puissances nucléaires du monde, en d'autres termes, qui a armé leur stock via la politique de l'onglet politique. \n 2. L'écran Defcon affiche votre niveau Defcon et n'est disponible qu'aux États-Unis, en URSS et en RPC. Baisser le niveau indiquera un stade de tension plus élevé.\n \n 3. La section centrale de l'interface graphique indique le nombre d'armes de destruction massive de chaque type dont vous disposez, des armes nucléaires classiques aux ICBM. La liste des armes chimiques à l'extrême droite est un WIP, et le bit de dénucléarisation - eh bien, pourquoi voudriez-vous faire ça, de toute façon ? \n 4. Sous la section discutée en 3 se trouvent 3 options, pour une frappe de niveau 1, 2 ou 3, chacune offrant différentes quantités d'armes nucléaires utilisées et différentes cibles. Le niveau 1 est une attaque de base sur les capitales ennemies à portée. Le niveau 2 est le niveau 1, plus des armes nucléaires supplémentaires pour les cibles stratégiques, c'est-à-dire. Grande population ou centres industriels. Le niveau 3 est une bordée nucléaire complète et nécessite l'une des deux choses suivantes : la technologie ICBM, ou pour l'URSS ou les États-Unis, des missiles à Cuba ou en Turquie, respectivement. \n 5. Le gros bouton nucléaire grisé deviendra rouge si toutes les conditions de lancement sont remplies, et vous pourrez alors jouer à une guerre thermonucléaire mondiale. \n 6. Sous le gros bouton se trouve une liste des armes nucléaires nécessaires à la frappe. \n 7. À gauche se trouve une liste de cibles de l'État pour la grève. \n 8. À gauche se trouve une liste des pays ennemis à portée de vos missiles. \n\n N'oubliez pas que si vous rencontrez des bugs ou des problèmes avec ce système, n'hésitez pas à les lister sur steam ou discord. \n\n Bon bombardement !"

 TUTOR.666.t:0 "§RNE JOUE PAS AU VATICAN§!"
 TUTOR.666.d:0 "§RLe Vatican se veut une plateforme mondiale permettant de prendre des décisions et de contrôler le jeu en coulisses. Jouer avec le Vatican provoquera des plantages, des erreurs, des bugs et ne fera généralement tout simplement pas fonctionner le jeu.§!"
 TUTOR.666.a:0 "Ok, putain, calme-toi. Je vais redémarrer le jeu car je l'ai déjà gâché."
 

