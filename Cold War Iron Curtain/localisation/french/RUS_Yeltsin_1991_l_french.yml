 # ==============================================================================
 # RUSSIAN FEDERATION: YELTSIN 1991 FOCUS TREE LOCALISATION
 # ==============================================================================
 # Tree Header
 RUS_90s_Yeltsin_1991: "L'administration Eltsine (1991-1999)"
 RUS_90s_Yeltsin_1991_desc: "La décennie inaugurale tumultueuse de la Fédération de Russie, définie par une avancée démocratique, une transformation économique traumatisante, des conflits régionaux et la naissance douloureuse d'un nouvel ordre étatique."

 # Diplomatic & Foreign Policy Branch
 RUS_Andrey_Kozyrev_New_Post: "La politique étrangère d'Andreï Kozyrev"
 RUS_Andrey_Kozyrev_New_Post_desc: "À l'aube de la Fédération de Russie, le diplomate chevronné Andreï Kozyrev prend la tête du ministère des Affaires étrangères. Kozyrev plaide pour l'internationalisme libéral, l'intégration pacifique dans l'ordre mondial dirigé par l'Occident et le partenariat avec les démocraties d'Europe et d'Amérique du Nord."
 
 RUS_Found_the_Council_of_the_Baltic_Sea_States: "Création du Conseil des États de la mer Baltique"
 RUS_Found_the_Council_of_the_Baltic_Sea_States_desc: "La stabilité régionale sur le littoral baltique est essentielle pour sécuriser les routes commerciales occidentales de la Russie et empêcher Kaliningrad de devenir une enclave isolée. Rejoindre l'Allemagne, les États nordiques, la Pologne et les républiques baltes nouvellement souveraines à Copenhague favorisera la coopération multilatérale."
 
 RUS_Found_the_EuroFaculty: "Créer l'EuroFaculté"
 RUS_Found_the_EuroFaculty_desc: "La modernisation de nos établissements d'enseignement nécessite des échanges académiques directs avec les universités européennes. En co-parrainant l'initiative EuroFaculty à Tartu, Riga et Vilnius, la Russie peut former une nouvelle génération d'avocats, d'économistes et d'administrateurs ancrés dans la démocratie de marché."
 
 RUS_Push_for_Partnership_of_Peace_Program: "Faire pression pour un partenariat pour la paix"
 RUS_Push_for_Partnership_of_Peace_Program_desc: "Pour rassurer nos voisins européens et construire une architecture de sécurité post-guerre froide sans nouvelles lignes de fracture, la Russie doit s'engager aux côtés de l'OTAN dans le cadre du Partenariat pour la paix (PpP). La confiance mutuelle ne peut être instaurée que grâce à des exercices conjoints transparents et à une liaison diplomatique."
 
 RUS_Peace_at_Home: "Le Traité de la Fédération"
 RUS_Peace_at_Home_desc: "La Fédération de Russie comprend des dizaines de républiques ethniques, de régions autonomes et de vastes territoires qui risquent de se désintégrer dans un chaos centrifuge. La négociation d'un traité de fédération global établira des compétences fédérales claires, déléguera des pouvoirs économiques et préservera l'intégrité territoriale de la Russie."
 
 RUS_War_in_Abkhazia: "Le conflit abkhaze"
 RUS_War_in_Abkhazia_desc: "Une guerre ethnique a éclaté le long de la côte de la mer Noire alors que les forces abkhazes affrontent les forces militaires de la République de Géorgie nouvellement indépendante. Alors que les commandants locaux prennent les choses en main, Moscou doit affirmer son autorité en tant que médiateur régional et garant du maintien de la paix."
 
 RUS_Massacre_in_Sukhumi: "La chute de Soukhoumi"
 RUS_Massacre_in_Sukhumi_desc: "Le siège acharné de Soukhoumi s'est soldé par une tragédie, des déplacements et des atrocités réciproques. La Russie doit gérer l'afflux de réfugiés, maintenir des couloirs humanitaires et faire pression sur les deux parties pour qu'elles signent un armistice avant que le Caucase tout entier ne sombre dans une conflagration incontrôlée."
 
 RUS_The_Oslo_I_Accord: "Approuver les accords d'Oslo"
 RUS_The_Oslo_I_Accord_desc: "En tant que co-sponsor du processus de paix au Moyen-Orient aux côtés des États-Unis, la Fédération de Russie prête son poids international à l'accord historique d'Oslo I entre Israël et l'Organisation de libération de la Palestine."

 # Yeltsin Presidency & Domestic Political Branch
 RUS_Glory_to_Russia_Our_Fatherland: "Gloire à la Russie, notre patrie"
 RUS_Glory_to_Russia_Our_Fatherland_desc: "Renaîtant des cendres du dogme idéologique, la Fédération de Russie récupère son ancienne souveraineté, son drapeau tricolore historique et la dignité durable de ses peuples. L'avenir de la Russie appartient à la démocratie, à l'État de droit et au renouveau spirituel."
 
 RUS_The_Yeltsin_Presidency: "La présidence Eltsine"
 RUS_The_Yeltsin_Presidency_desc: "Élu par le vote populaire président de la République socialiste fédérative soviétique de Russie avant le coup d'État, Boris Nikolaïevitch Eltsine est désormais l'exécutif suprême d'un État russe pleinement indépendant. Il jouit d'une énorme popularité personnelle et d'un mandat historique de transformation."
 
 RUS_Talk_with_Shushkevich: "Consulter Stanislav Chouchkevitch"
 RUS_Talk_with_Shushkevich_desc: "Afin de sortir de la paralysie des institutions centrales soviétiques et de tracer la voie vers un Commonwealth volontaire, le président Eltsine rencontre le président du Soviet suprême de Biélorussie, Stanislav Chouchkevitch, à la résidence d'État de Viskuli, dans la forêt de Beloveja."
 
 RUS_Talk_with_Kravchuk: "Consulter Leonid Kravchuk"
 RUS_Talk_with_Kravchuk_desc: "Après le référendum sur l'indépendance de l'Ukraine du 1er décembre 1991, au cours duquel plus de 90 pour cent ont voté en faveur de la sortie de l'URSS, le président ukrainien Leonid Kravtchouk détient la clé décisive pour l'avenir de l'Union soviétique. Un consensus bilatéral entre Moscou et Kiev est indispensable."
 
 RUS_The_Belovezh_Accords: "Les accords Belovezh"
 RUS_The_Belovezh_Accords_desc: "Le 8 décembre 1991, les dirigeants des trois républiques fondatrices de l'URSS - la Russie, l'Ukraine et la Biélorussie - se réunissent dans la forêt de Beloveja. Ensemble, ils déclarent que l'Union des Républiques socialistes soviétiques, en tant que sujet de droit international et réalité géopolitique, cesse d'exister et créent la Communauté des États indépendants (CEI)."
 
 RUS_The_Union_Forever_Buried: "L'Union enterrée à jamais"
 RUS_The_Union_Forever_Buried_desc: "Le marteau et la faucille sont définitivement abaissés du Grand Palais du Kremlin, remplacés par le drapeau tricolore blanc, bleu et rouge. L'Union des Républiques socialistes soviétiques n'existe plus. La Russie assume la succession légale de l'État soviétique aux Nations Unies et dans la communauté internationale."
 
 RUS_Establish_the_Post_of_Vice_President: "Confirmer la vice-présidence"
 RUS_Establish_the_Post_of_Vice_President_desc: "Afin de consolider le pouvoir exécutif et de resserrer les liens avec l'armée, le héros de guerre afghan et général de l'aviation Alexander Rutskoy est confirmé au poste de vice-président de la Fédération de Russie."
 
 RUS_A_Speach_to_the_American_Congress: "Discours au Congrès américain"
 RUS_A_Speach_to_the_American_Congress_desc: "En juin 1992, Boris Eltsine s'adresse à une session conjointe du Congrès des États-Unis à Washington, recevant des ovations répétées lorsqu'il déclare : « L'idole du communisme, qui a répandu partout les conflits sociaux, l'animosité et une brutalité sans précédent, qui a semé la peur dans l'humanité, s'est effondrée !"
 
 RUS_The_Question_of_Prime_Minister_Post: "La question du Premier ministre"
 RUS_The_Question_of_Prime_Minister_Post_desc: "Le président Eltsine a exercé directement les pouvoirs de Premier ministre pendant les premiers mois d'urgence de la réforme. Aujourd'hui, sous la pression croissante du Soviet suprême, il faut choisir un chef de gouvernement permanent : l'économiste réformateur radical Egor Gaidar ou l'industriel pragmatique de Gazprom Viktor Tchernomyrdine."
 
 RUS_Compromise_with_the_Supreme_Soviets: "Compromis avec le Soviet suprême"
 RUS_Compromise_with_the_Supreme_Soviets_desc: "Plutôt que d'imposer une confrontation constitutionnelle immédiate avec le président Ruslan Khasbulatov et le Congrès des députés du peuple, l'exécutif propose des concessions législatives, une déréglementation économique plus lente et des nominations partagées."
 
 RUS_Disband_the_Supreme_Soviets: "Dissoudre le Soviet suprême"
 RUS_Disband_the_Supreme_Soviets_desc: "La Constitution soviétique de 1978 crée un double pouvoir et une impasse législative impossible qui paralyse la gouvernance. Eltsine décide de trancher le noeud gordien : dissoudre le Soviet suprême, abolir le Congrès des députés du peuple et convoquer de nouvelles élections parlementaires."
 
 RUS_Push_for_an_End_to_the_Planned_Economy_System: "Démanteler l'économie dirigée"
 RUS_Push_for_an_End_to_the_Planned_Economy_System_desc: "Le Gosplan, le contrôle centralisé des prix et le rationnement de l'offre par l'État ont amené le pays au bord de la famine et de l'effondrement total. La Russie doit évoluer de manière décisive vers la concurrence sur le marché, l'initiative privée et l'ouverture des prix."
 
 RUS_Macroeconomic_Stabilization: "Stabilisation macroéconomique"
 RUS_Macroeconomic_Stabilization_desc: "Mettre un terme à l'impression incontrôlée de roubles non garantis, réduire les déficits budgétaires et remettre les biens de consommation dans les rayons vides des magasins nécessitent une discipline budgétaire stricte et une politique coordonnée de la banque centrale."
 
 RUS_Assume_Special_Powers: "Assumer des pouvoirs présidentiels spéciaux"
 RUS_Assume_Special_Powers_desc: "Face à une urgence économique sans précédent et à une paralysie institutionnelle, le président Eltsine demande au Parlement des pouvoirs spéciaux en matière de décrets pour faire adopter des réformes économiques cruciales sans retards législatifs."
 
 RUS_Organize_Pro_Government_Protestors: "Mobiliser les rassemblements démocratiques"
 RUS_Organize_Pro_Government_Protestors_desc: "Alors que la confrontation entre le Kremlin et la Maison Blanche s'intensifie, des centaines de milliers de Moscovites descendent dans la rue pour défendre la présidence élue et les réformes démocratiques contre une opposition dure."
 
 RUS_Ukaz_1400: "Décret présidentiel n° 1400"
 RUS_Ukaz_1400_desc: "Le 21 septembre 1993, Boris Eltsine signe le décret n° 1400 « Sur la réforme constitutionnelle progressive dans la Fédération de Russie ». Le décret suspend les pouvoirs du Soviet suprême et du Congrès des députés du peuple et prévoit un référendum national sur une nouvelle constitution démocratique."
 
 RUS_Secure_Support_from_the_Army_and_Intelligentsia: "Rassemblez les militaires et l'intelligentsia"
 RUS_Secure_Support_from_the_Army_and_Intelligentsia_desc: "Garantir la loyauté du ministre de la Défense Pavel Grachev, des principaux commandants de garnison militaire et de l'intelligentsia culturelle garantit que les forces armées maintiendront l'ordre constitutionnel lorsque la crise atteindra son point d'ébullition."
 
 RUS_The_Black_October: "Octobre noir 1993"
 RUS_The_Black_October_desc: "Les affrontements armés entre milices parlementaires et forces intérieures fédérales culminent avec l'encerclement et le bombardement de la Maison Blanche, dans le centre de Moscou. Cette confrontation tragique aboutit à la défaite totale de la rébellion parlementaire et ouvre la voie à la Constitution de décembre 1993."

 # Regional Defense & Near Abroad Branch
 RUS_The_Yeltsin_Doctrine: "La doctrine Eltsine"
 RUS_The_Yeltsin_Doctrine_desc: "La Russie a des responsabilités historiques et des intérêts de sécurité particuliers dans l'ancien espace soviétique - l'« étranger proche ». Moscou interviendra activement en tant que gardien de la paix pour mettre un terme aux effusions de sang interethnique et protéger les populations russophones."
 
 RUS_The_Tajik_Civil_War: "Intervenir dans la guerre civile tadjike"
 RUS_The_Tajik_Civil_War_desc: "La guerre civile a éclaté au Tadjikistan entre le gouvernement laïc et les factions islamistes-démocratiques, les guérilleros traversant librement le pays depuis l'Afghanistan. La 201e division de fusiliers motorisés russes et les unités de garde-frontières doivent sécuriser la frontière afghane et stabiliser Douchanbé."
 
 RUS_The_War_in_Chechenya: "Crise en Tchétchénie"
 RUS_The_War_in_Chechenya_desc: "L'ancien général de l'armée de l'air soviétique Dzhokhar Dudayev a pris le pouvoir à Grozny, a déclaré la République tchétchène souveraine d'Itchkérie et a refusé de signer le Traité de la Fédération. Les forces fédérales doivent se préparer à rétablir l'ordre constitutionnel dans la république rebelle."
 
 RUS_Khasavyurt_Accord: "L'accord de Khassaviourt"
 RUS_Khasavyurt_Accord_desc: "Après la sanglante bataille de Grozny en août 1996, le secrétaire du Conseil de sécurité Alexandre Lebed et le chef d'état-major tchétchène Aslan Maskhadov négocient l'accord de Khasavyurt. Les troupes fédérales se retirent et la détermination définitive du statut politique de la Tchétchénie est reportée à 2001."
 
 RUS_Invasion_of_Dagestan: "Repousser l'invasion du Daghestan"
 RUS_Invasion_of_Dagestan_desc: "En août 1999, des brigades insurgées radicales wahhabites dirigées par Shamil Basayev et Ibn al-Khattab envahissent l'ouest du Daghestan pour tenter d'établir un État islamique. Les forces fédérales russes et les milices civiles du Daghestan doivent se coordonner pour écraser les envahisseurs."
 
 RUS_Second_Chechen_Counter_Terrorism: "L'opération antiterroriste"
 RUS_Second_Chechen_Counter_Terrorism_desc: "Déclenchées par l'invasion du Daghestan et les attentats à la bombe dans des appartements dans des villes russes, les forces fédérales lancent une vaste opération antiterroriste en Tchétchénie. Sous le commandement unifié de l'armée et du FSB, l'autorité constitutionnelle est systématiquement rétablie dans tout le Caucase du Nord."

 # State Security & FSB (Lubyanka) Branch
 RUS_Martial_Law_in_Chechenya_and_Kalmykia: "État d'urgence dans le Caucase du Nord"
 RUS_Martial_Law_in_Chechenya_and_Kalmykia_desc: "Pour contrer les insurrections séparatistes et le trafic d'armes, des protocoles de sécurité spéciaux et des cordons militaires sont établis dans le district militaire du Caucase du Nord."
 
 RUS_Fight_off_the_Chcehen_Insurgency: "Contenir l'infiltration des insurgés"
 RUS_Fight_off_the_Chcehen_Insurgency_desc: "Les troupes de l'intérieur, l'OMON et les forces de sécurité fédérales coordonnent des opérations de ratissage contre les caches d'armes des rebelles, des embuscades souterraines et des réseaux de prises d'otages dans les contreforts du Caucase."
 
 RUS_Dismantle_the_KGB: "Démanteler le KGB monolithique"
 RUS_Dismantle_the_KGB_desc: "À la suite du putsch d'août 1991, le KGB tentaculaire est éclaté. L'espionnage étranger est transféré au SVR, la sécurité des communications à la FAPSI et le contre-espionnage interne au nouveau ministère de la Sécurité (MBRF)."
 
 RUS_Defang_the_Securocrats: "Réorganiser le FSK"
 RUS_Defang_the_Securocrats_desc: "Se méfiant des hésitations du MBRF lors de la crise d'octobre 1993, Eltsine signe le décret n° 2167, remplaçant le ministère par le Service fédéral de contre-espionnage (FSK) et réduisant ses pouvoirs d'arrestation et de détention."
 
 RUS_Rebuild_Lubyanka_FSB: "Loi fédérale n° 40-FZ : création du FSB"
 RUS_Rebuild_Lubyanka_FSB_desc: "Les réalités opérationnelles de la guerre en Tchétchénie et la montée du crime organisé démontrent qu'un service de sécurité affaibli ne peut pas protéger l'État. La loi n° 40-FZ crée officiellement le Service fédéral de sécurité (FSB), rétablissant ainsi le plein pouvoir d'enquête et de détention armée."
 
 RUS_TsSN_Alpha_and_Vympel: "Renforcez TsSN Alpha et Vympel"
 RUS_TsSN_Alpha_and_Vympel_desc: "Les unités d'élite des forces spéciales Alpha et Vympel sont unifiées sous le nouveau Centre à vocation spéciale (TsSN) du FSB. Ils fournissent à la Fédération des capacités de sauvetage d'otages, de lutte contre le terrorisme et de frappe chirurgicale à haut risque de classe mondiale."
 
 RUS_Putin_Appointed_FSB_Director: "Nommer Vladimir Poutine à la Loubianka"
 RUS_Putin_Appointed_FSB_Director_desc: "En juillet 1998, le président Eltsine nomme Vladimir Poutine, administrateur de confiance de Saint-Pétersbourg et ancien officier du renseignement étranger, au poste de directeur du FSB. Poutine réorganise la Loubianka en un instrument d'État étroitement centralisé et discipliné."
 
 RUS_The_Siloviki_Consolidation: "La consolidation de Siloviki"
 RUS_The_Siloviki_Consolidation_desc: "Sous Nikolai Patrushev et Vladimir Poutine, des vétérans des organes de sécurité de l'État - les « siloviki » - se mobilisent pour restaurer l'autorité de l'État, combattre les réseaux terroristes et protéger les institutions souveraines de la Fédération de Russie."

 # Military Reorganization Branch
 RUS_Legacy_of_the_Soviet_Army: "L'héritage des forces armées soviétiques"
 RUS_Legacy_of_the_Soviet_Army_desc: "La Fédération de Russie hérite de l'essentiel de la machine militaire soviétique : des millions de soldats, des dizaines de milliers de véhicules blindés, des arsenaux nucléaires et de vastes stocks d'équipements. Nous devons évaluer ce patrimoine colossal et déterminer sa future structure de commandement."
 
 RUS_United_Armed_Forces_of_the_Commonwealth_of_Independent_States: "Forces armées unies de la CEI"
 RUS_United_Armed_Forces_of_the_Commonwealth_of_Independent_States_desc: "Tentant de préserver un contrôle stratégique unifié sur les armes nucléaires et les forces conventionnelles, Moscou propose que toutes les anciennes républiques maintiennent des forces armées conjointes sous le commandement opérationnel du maréchal Eugène Shaposhnikov."
 
 RUS_Unified_Armed_Forces: "Traités de défense commune de la CEI"
 RUS_Unified_Armed_Forces_desc: "Formaliser des pactes de sécurité collective entre les États membres de la CEI, garantissant des réseaux de défense aérienne coordonnés, un renseignement militaire partagé et des exercices de formation conjoints."
 
 RUS_A_Centralized_Russian_Army: "Une armée nationale russe"
 RUS_A_Centralized_Russian_Army_desc: "Alors que l'Ukraine, la Biélorussie et d'autres républiques établissent leurs propres armées indépendantes, s'appuyer sur un commandement conjoint édenté de la CEI est une illusion. La Russie doit construire ses propres forces armées souveraines et centralisées sous commandement national direct."
 
 RUS_Invincible_and_Legendary: "La fierté de la patrie"
 RUS_Invincible_and_Legendary_desc: "Perpétuant les glorieuses traditions militaires de l'armée russe et de la Grande Guerre patriotique, nos soldats restent le bouclier inflexible de l'État russe."
 
 RUS_To_Serve_Russia: "Servir la Fédération de Russie"
 RUS_To_Serve_Russia_desc: "Le décret présidentiel n° 466 crée officiellement les Forces armées de la Fédération de Russie. Les soldats russes prêtent leur serment sacré de loyauté envers le peuple russe, le président et la Constitution."
 
 RUS_Propose_the_Pan_European_Collective_Security: "Architecture de sécurité paneuropéenne"
 RUS_Propose_the_Pan_European_Collective_Security_desc: "La Russie propose la création d'une architecture de sécurité européenne inclusive de Vancouver à Vladivostok, garantissant que la défense européenne ne soit pas dominée exclusivement par l'expansion de l'OTAN."
 
 RUS_Turn_Back_on_America: "Pivoter vers la multipolarité"
 RUS_Turn_Back_on_America_desc: "L'unilatéralisme occidental, l'expansion de l'OTAN vers nos frontières et l'indifférence à l'égard des intérêts nationaux russes exigent la fin de l'atlantisme naïf. La Russie doit défendre un ordre mondial multipolaire."
 
 RUS_America_Agrees_to_European_Security_Re_Evaluation: "Partenariat avec l'Occident"
 RUS_America_Agrees_to_European_Security_Re_Evaluation_desc: "Washington et les capitales européennes reconnaissent la Russie comme un partenaire indispensable à la stabilité européenne, ouvrant la porte à des consultations approfondies en matière de défense et à un maintien de la paix partagé."

 # Transcaucasia & Nagorno-Karabakh Branch
 RUS_The_Mi_8_Shoot_Down: "L'incident de la fusillade du Mi-8 en 1991"
 RUS_The_Mi_8_Shoot_Down_desc: "L'abattage d'un hélicoptère des troupes internes dans le ciel du Haut-Karabakh transportant de hauts observateurs de la paix russes et kazakhs porte le conflit transcaucasien à un sommet alarmant. Moscou doit exercer un levier décisif en matière de maintien de la paix."
 
 RUS_Withdraw_the_366th_Guards_Motor_Rifle_Regiment: "Retirer le 366e Régiment"
 RUS_Withdraw_the_366th_Guards_Motor_Rifle_Regiment_desc: "Stationné à Stepanakert au milieu de violents combats ethniques, le 366th Guards Motor Rifle Regiment s'est retrouvé entraîné entre deux feux. Pour éviter de nouvelles pertes russes, le régiment est retiré sur le territoire russe, laissant derrière lui du matériel lourd."
 
 RUS_Begin_Direct_Arm_Sales_to_Armenia: "Livrer des armements à Erevan"
 RUS_Begin_Direct_Arm_Sales_to_Armenia_desc: "L'Arménie est une ancienne civilisation chrétienne et notre alliée stratégique traditionnelle dans le Caucase du Sud. Fournir du matériel de défense et des conseillers techniques préservera l'équilibre des pouvoirs."
 
 RUS_Rescind_Control_of_the_295th_Division_to_Azerbaijan: "Transférer la 295e division à Bakou"
 RUS_Rescind_Control_of_the_295th_Division_to_Azerbaijan_desc: "En échange de lucratifs accords sur les oléoducs caspiens et de droits de transit, Moscou cède le matériel conventionnel de la 295e division de fusiliers motorisés soviétique aux forces armées azerbaïdjanaises."
 
 RUS_Aid_Armenian_Air_Defences: "Moderniser la défense aérienne arménienne"
 RUS_Aid_Armenian_Air_Defences_desc: "Intégrer les stations radar et les batteries de missiles sol-air à Gyumri et Erevan dans le cadre de défense aérienne commune de la CEI, protégeant ainsi le ciel arménien des frappes aériennes."
 
 RUS_Cease_Fire_in_Karabakh: "Négocier le cessez-le-feu à Bichkek"
 RUS_Cease_Fire_in_Karabakh_desc: "En mai 1994, grâce à la médiation russe active dans le cadre du Protocole de Bichkek, l'Arménie, l'Azerbaïdjan et le Haut-Karabakh conviennent d'un cessez-le-feu global, gelant ainsi le conflit et mettant fin à six années de guerre dévastatrice."
 
 RUS_Begin_Sellinf_Off_Priced_Equipment_to_Yerevan: "Consolider l'alliance stratégique avec l'Arménie"
 RUS_Begin_Sellinf_Off_Priced_Equipment_to_Yerevan_desc: "Proposer des accords préférentiels d'armes et de livraisons d'artillerie à l'Arménie en échange d'une garnison militaire russe permanente à la 102e base militaire de Gyumri."
 
 RUS_Negotiate_Favorable_Gas_Prices_with_Baku: "Négocier des accords énergétiques avec Bakou"
 RUS_Negotiate_Favorable_Gas_Prices_with_Baku_desc: "Obtenez des concessions de gazoducs à long terme, des droits de forage sur les fonds marins de la Caspienne et des conditions tarifaires favorables avec l'Azerbaïdjan."

 # Post-Soviet Economic Reform Branch
 RUS_Gaidar_Shock_Therapy: "Thérapie de choc de Gaidar"
 RUS_Gaidar_Shock_Therapy_desc: "Le 2 janvier 1992, Yegor Gaidar débloque du jour au lendemain le contrôle des prix par l'État. Alors que les prix à la consommation grimpent et que l'épargne s'érode, les pénuries alimentaires disparaissent des rayons des magasins et les mécanismes de marché s'enracinent dans toute la Fédération."
 
 RUS_Chubais_Voucher_Privatization: "Privatisation des bons de Chubais"
 RUS_Chubais_Voucher_Privatization_desc: "Dirigé par Anatoli Tchoubaïs, le Comité des biens de l'État délivre des bons de privatisation de 10 000 roubles à l'ensemble des 148 millions de citoyens russes, permettant aux citoyens d'acquérir des actions dans des usines, des mines et des entreprises qui appartenaient auparavant à l'État."
 
 RUS_Loans_for_Shares: "Prêts pour enchères d'actions"
 RUS_Loans_for_Shares_desc: "Confronté à un déficit budgétaire catastrophique à l'approche de l'élection présidentielle de 1996, le Kremlin vend aux enchères ses participations dans les monopoles lucratifs du pétrole, du nickel et de la métallurgie à des banques commerciales en échange de prêts gouvernementaux vitaux, créant ainsi une puissante élite oligarchique."
 
 RUS_Tame_Hyperinflation: "Apprivoiser l'hyperinflation"
 RUS_Tame_Hyperinflation_desc: "En établissant un corridor de taux de change du rouble et en appliquant une politique monétaire disciplinée, le président de la Banque centrale, Viktor Gerashchenko, a réussi à maîtriser l'inflation post-soviétique et à stabiliser les prix à la consommation."
 
 RUS_IMF_Stabilization_Tranches: "Tranches de stabilisation du FMI"
 RUS_IMF_Stabilization_Tranches_desc: "L'obtention de tranches de financement étendues de plusieurs milliards de dollars auprès du Fonds monétaire international rassure les investisseurs internationaux et fournit des réserves en devises fortes à la Banque centrale."
 
 RUS_The_1998_Financial_Crisis: "L'effondrement du rouble en 1998"
 RUS_The_1998_Financial_Crisis_desc: "Frappé par la crise financière asiatique et la chute des prix mondiaux du pétrole, le gouvernement russe fait défaut sur ses obligations nationales GKO le 17 août 1998, dévaluant le rouble et déclenchant une panique bancaire généralisée."
 
 RUS_Primakov_Economic_Compromise: "Le compromis Primakov"
 RUS_Primakov_Economic_Compromise_desc: "Nommé Premier ministre à la suite du krach d'août, l'ancien homme d'État Eugène Primakov s'associe au chef de la Banque centrale, Viktor Gerashchenko. Leur approche pragmatique et centrée sur la production rembourse les arriérés de salaires de l'État et déclenche une substitution rapide des importations industrielles nationales."

