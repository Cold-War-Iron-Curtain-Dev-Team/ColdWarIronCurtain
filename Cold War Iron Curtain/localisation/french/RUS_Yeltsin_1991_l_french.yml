 Abkhazian_Intervention_TT: "Permet les décisions de maintien de la paix et de médiation dans la zone de conflit abkhaze."
 Centralize_Power_TT: "Dissout le Soviet suprême et accélère la lutte pour la suprématie présidentielle."
 Yeltsin_Doctrine_TT: "Permet de prendre des décisions en matière de maintien de la paix et de sécurité dans l'ancien espace soviétique."
 Tajik_Intervention_TT: "Autorise le déploiement de forces fédérales de maintien de la paix au Tadjikistan."
 Chechen_Intervention_TT: "Débloque les options fédérales de sécurité et de contre-insurrection dans le Caucase du Nord."
 Increased_Domestic_Support_TT: "Rassemble un large soutien civil et militaire derrière le président."
 Enable_Protest_Related_Decisions_TT: "Débloque les décisions de rassemblement de masse pendant la crise constitutionnelle."
 Enable_RCW_Militia_Decisions_TT: "Permet des options de mobilisation de milice d'urgence."
 Mi_8Shoot_Down_prereq_TT: "Cela nécessite des tensions militaires actives ou des escarmouches frontalières entre l'Arménie et l'Azerbaïdjan."
 karabakh_ceasefire_prereq_TT: "Nécessite à la fois une aide à la défense aérienne arménienne et des transferts d'équipement azerbaïdjanais."
 Gaidar_Appointed_PM_TT: "Nomme §YYegor Gaidar§! au poste de Premier ministre et accélère la thérapie de choc économique du libre marché."
 Chernomyrdin_Appointed_PM_TT: "Nomme §YViktor Tchernomyrdine§! au poste de Premier ministre, en poursuivant le compromis industriel et les réformes pragmatiques."
 RUS_fsb_alpha_vympel_readiness_TT: "Débloque des opérations spéciales améliorées et une préparation antiterroriste pour §YAlpha§! et §YVympel§!."

 # ==============================================================================
 # NATIONAL IDEAS LOCALISATION
 # ==============================================================================

 Yeltsinonomics_1: "Choc des prix et transition du marché"
 Yeltsinonomics_1_desc: "Le démantèlement de l'économie dirigée soviétique et la soudaine libéralisation des prix ont déclenché une inflation galopante, des déficits budgétaires et des difficultés sociales, tout en posant les bases de l'entreprise privée."
 
 Yeltsinonomics_2: "Stabilisation macroéconomique"
 Yeltsinonomics_2_desc: "La discipline monétaire, la réduction des déficits budgétaires et la normalisation des échanges commerciaux ont commencé à freiner l'inflation galopante, favorisant ainsi la stabilité des marchés."
 
 RUS_voucher_privatization: "Privatisation des bons"
 RUS_voucher_privatization_desc: "La distribution massive de bons de privatisation a transféré des milliers d'entreprises d'État entre des mains privées, accélérant la formation de capital au prix d'une disparité croissante des richesses."
 
 RUS_loans_for_shares_oligarchy: "La Semibankirshchina"
 RUS_loans_for_shares_oligarchy_desc: "Un petit cartel d'oligarques influents du secteur bancaire et des ressources naturelles détient un immense pouvoir de pression sur les médias, l'industrie et la gouvernance du Kremlin en échange du financement de l'administration."
 
 RUS_tamed_inflation: "Hyperinflation apprivoisée"
 RUS_tamed_inflation_desc: "La création d'un corridor monétaire et les ratios stricts de réserves des banques centrales ont rétabli la stabilité de base du rouble russe."
 
 RUS_imf_assistance: "Tranches de stabilisation du FMI"
 RUS_imf_assistance_desc: "Les crédits étrangers du Fonds monétaire international et des créanciers internationaux fournissent au Trésor des liquidités vitales en devises fortes."
 
 RUS_1998_financial_collapse: "La crise des défauts de paiement de 1998"
 RUS_1998_financial_collapse_desc: "Le défaut de paiement de la dette souveraine sur les obligations du Trésor à court terme et l'effondrement du rouble ont déclenché une grave panique bancaire et ébranlé la confiance des investisseurs étrangers."
 
 RUS_primakov_industrial_recovery: "Reprise industrielle nationale"
 RUS_primakov_industrial_recovery_desc: "La gestion pragmatique, le remboursement des salaires par l'État et la dévaluation de la monnaie ont insufflé une nouvelle vie aux producteurs manufacturiers et agricoles nationaux."
 
 Declining_Political_Situation: "Impasse constitutionnelle"
 Declining_Political_Situation_desc: "L'âpre lutte institutionnelle entre le président et le Soviet suprême paralyse la législation fédérale et menace de plonger le pays dans la guerre civile."
 
 World_Renowned_Army: "Traditions martiales de la patrie"
 World_Renowned_Army_desc: "Enracinés dans l'héritage héroïque des forces armées russes et soviétiques, nos soldats font preuve d'une résilience au combat et d'une détermination tactique inégalées."
 
 RUS_centralized_russian_military: "Les Forces armées de la Fédération de Russie"
 RUS_centralized_russian_military_desc: "Une structure militaire nationale unifiée et professionnelle directement subordonnée au ministère russe de la Défense."
 
 RUS_peace_at_home_spirit: "Accord fédéral"
 RUS_peace_at_home_spirit_desc: "Une large autonomie régionale et un partage consensuel du pouvoir dans le cadre du Traité de la Fédération garantissent la paix et la cohésion interne entre les républiques russes."
 
 RUS_partnership_for_peace: "Partenariat pour la paix"
 RUS_partnership_for_peace_desc: "Une coopération militaire structurée et des échanges de liaison avec l'OTAN favorisent la stabilité régionale et le renforcement de la confiance sans enchevêtrements formels dans l'alliance."
