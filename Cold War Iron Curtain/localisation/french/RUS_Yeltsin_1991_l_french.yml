 # EVENTS LOCALISATION
 # ==============================================================================

 Belovezh_Accords.0.t: "Consultations dans la forêt de Beloveja"
 Belovezh_Accords.0.d: "Des représentants des dirigeants russes sont arrivés à la datcha gouvernementale à Viskuli, en Biélorussie, pour discuter de l'effondrement institutionnel croissant de l'Union soviétique. Alors que le projet de Traité d'Union de Mikhaïl Gorbatchev échoue, Boris Eltsine a proposé que les principales républiques slaves sortent de l'impasse constitutionnelle selon leurs propres conditions."
 Belovezh_Accords.0.a: "Commencez les négociations."

 Belovezh_Accords.1.t: "La Biélorussie accepte le dialogue"
 Belovezh_Accords.1.d: "Stanislav Chouchkevitch, président du Soviet suprême de Biélorussie, a accueilli la délégation russe à Viskuli. Alors que le pays est paralysé économiquement et que les ministères centraux de Moscou sont impuissants, les dirigeants biélorusses conviennent qu'une nouvelle structure du Commonwealth doit remplacer le centre soviétique."
 Belovezh_Accords.1.a: "Un nouveau cadre est à notre portée."

 Belovezh_Accords.3.t: "La signature des accords Belovezh"
 Belovezh_Accords.3.d: "Le 8 décembre 1991, dans la forêt isolée de Beloveja, Boris Eltsine, Leonid Kravchuk et Stanislav Shushkevich signent l'accord historique établissant la Communauté des États indépendants.\n\nLe préambule délivre une déclaration sismique : « Nous, la République de Biélorussie, la Fédération de Russie (RSFSR) et l'Ukraine, en tant qu'États fondateurs de l'URSS, signataires du Traité d'Union de 1922... déclarons que l'URSS, en tant que sujet de droit international et réalité géopolitique, cesse d'exister. »\n\nLes sept décennies d'histoire du superÉtat soviétique ont atteint leur conclusion juridique et politique."
 Belovezh_Accords.3.a: "Signez les Accords. L'Union est dissoute."

 Belovezh_Accords.4.t: "L'Ukraine ratifie les accords Belovezh"
 Belovezh_Accords.4.d: "Le président Leonid Kravtchouk a signé les accords Belovezh au nom de l'Ukraine, mettant officiellement fin aux liens de l'Ukraine avec l'ancien gouvernement central de Moscou tout en affirmant son appartenance à la nouvelle Communauté des États indépendants."
 Belovezh_Accords.4.a: "Reconnu."

 Belovezh_Accords.5.t: "La Biélorussie ratifie les accords Belovezh"
 Belovezh_Accords.5.d: "Le Soviet suprême de Biélorussie a officiellement ratifié les accords de Belovezh, confirmant la création de la CEI et la dissolution pacifique de l'Union soviétique."
 Belovezh_Accords.5.a: "Reconnu."

 Belovezh_Accords.6.t: "La dissolution de l'Union soviétique"
 Belovezh_Accords.6.d: "Dans une déclaration stupéfiante depuis la forêt de Beloveja, près de Brest, les dirigeants de la Russie, de l'Ukraine et de la Biélorussie ont déclaré que l'Union des Républiques socialistes soviétiques avait cessé d'exister en tant que sujet de droit international.\n\nÀ sa place, une Communauté volontaire d'États indépendants (CEI) a été créée pour maintenir des liens économiques, des frontières ouvertes et un commandement coordonné des forces nucléaires stratégiques. Partout dans le monde, les dirigeants du monde réagissent avec étonnement à la dissolution pacifique de la plus grande superpuissance communiste du XXe siècle."
 Belovezh_Accords.6.a: "Le monde a changé pour toujours."

 SOV_END.0.t: "La Fédération de Russie émerge"
 SOV_END.0.d: "L'Union soviétique appartient officiellement à l'histoire ancienne. La Fédération de Russie entre sur la scène mondiale en tant que démocratie souveraine, assumant le siège soviétique au Conseil de sécurité des Nations Unies et l'entière responsabilité de la gestion nucléaire et des traités internationaux."
 SOV_END.0.a: "Vive la Fédération de Russie !"

 SOV_END.1.t: "Indépendance souveraine confirmée"
 SOV_END.1.d: "Avec la liquidation formelle de l'Union soviétique, notre nation est pleinement indépendante et souveraine, libre de toute tutelle centrale."
 SOV_END.1.a: "L'indépendance est acquise !"

 Yeltsin.1.t: "Boris Eltsine : président de la Fédération de Russie"
 Yeltsin.1.d: "Boris Nikolaïevitch Eltsine a officiellement assumé la fonction exécutive suprême de la Fédération de Russie souveraine. L'ancien chef charismatique du parti moscovite, qui s'est rendu sur un char pour défendre la démocratie lors du coup d'État d'août 1991, dirige désormais une nation de 148 millions d'habitants dans des eaux politiques et économiques inexplorées."
 Yeltsin.1.a: "Une nouvelle ère commence."

 Yeltsin.2.t: "La vice-présidence confirmée"
 Yeltsin.2.d: "Le président Eltsine a signé une loi confirmant Alexandre Rutskoï, héros de l'Union soviétique et aviateur de combat décoré pendant la guerre d'Afghanistan, au poste de vice-président de la Fédération de Russie. La nomination de Rutskoï comble le fossé entre l'administration réformiste du Kremlin et l'establishment militaro-industriel."
 Yeltsin.2.a: "Le vice-président Rutskoy entre en fonction."

 Yeltsin.3.t: "Sélection du chef du gouvernement"
 Yeltsin.3.d: "Le président Eltsine doit maintenant nommer un Premier ministre dédié pour diriger les opérations gouvernementales quotidiennes et diriger l'économie dans des eaux turbulentes.\n\nYegor Gaidar, le leader intellectuel de 36 ans des réformateurs économiques radicaux, propose d'accélérer la libéralisation des prix et la privatisation. Alternativement, Viktor Tchernomyrdine, un vétéran de l'industrie gazière, propose une stabilité industrielle pragmatique, des liens plus étroits avec les entreprises d'État et une transition plus progressive."
 Yeltsin.3.a: "Nommer Yegor Gaidar : Accélérer les réformes du marché."
 Yeltsin.3.b: "Nommer Viktor Tchernomyrdine : Choisir le compromis industriel."

 Yeltsin.4.t: "Le drapeau rouge baissé sur le Kremlin"
 Yeltsin.4.d: "Le 25 décembre 1991, à 19 h 32, après le discours télévisé de démission de Mikhaïl Gorbatchev, le drapeau rouge de l'État soviétique avec le marteau et la faucille est lentement abaissé pour la dernière fois du dôme du palais du Sénat au Kremlin de Moscou. Quelques minutes plus tard, le drapeau tricolore russe historique est hissé à sa place."
 Yeltsin.4.a: "Un empire entre dans l'histoire."

 Yeltsin.6.t: "Eltsine s'adresse au Congrès américain"
 Yeltsin.6.d: "Le président Boris Eltsine a prononcé un discours historique devant une session conjointe du Congrès américain. Il a affirmé que la Russie avait irrévocablement tourné le dos au totalitarisme, à l'expansion impériale et à la confrontation idéologique, appelant à une amitié durable entre les peuples russe et américain."
 Yeltsin.6.a: "Un partenariat pour la paix."

 Yeltsin.7.t: "La doctrine Eltsine annoncée"
 Yeltsin.7.d: "Le gouvernement russe a formulé sa doctrine fondamentale de politique étrangère pour l'espace post-soviétique. La « Doctrine Eltsine » affirme que la Russie se réserve le droit et la responsabilité particuliers de mener des opérations de maintien de la paix dans tout le « Proche étranger » pour empêcher le nettoyage ethnique, protéger les minorités et assurer la stabilité stratégique."
 Yeltsin.7.a: "La Russie reste le garant de la stabilité régionale."

 Yeltsin.8.t: "L'intervention dans la guerre civile tadjike"
 Yeltsin.8.d: "Alors que la guerre civile ravage le Tadjikistan, les brigades mécanisées russes de la 201e division de fusiliers motorisés et les gardes-frontières fédéraux se sont déployés à Douchanbé et à la frontière du fleuve Panj. Les forces russes ont sécurisé les installations gouvernementales et stoppé les colonnes d'insurgés venant du nord de l'Afghanistan."
 Yeltsin.8.a: "Ordonnez à la 201e Division de tenir la ligne."

 Yeltsin.9.t: "Crise dans le Caucase du Nord"
 Yeltsin.9.d: "À Grozny, les forces séparatistes dirigées par Dzhokhar Dudayev se sont emparées des bâtiments administratifs, des armureries soviétiques et ont déclaré la République tchétchène souveraine d'Itchkérie. Doudaïev refuse de reconnaître la loi fédérale ou de percevoir des impôts fédéraux, ce qui pose au Kremlin un défi sans précédent pour l'unité territoriale de la Fédération."
 Yeltsin.9.a: "Préparer les options de sécurité pour le Caucase du Nord."

 Yeltsin.10.t: "Manifestations à Moscou"
 Yeltsin.10.d: "Les tensions entre le président et le Soviet suprême se sont propagées dans les rues de Moscou. Des dizaines de milliers de manifestants pro-démocratie se sont rassemblés près du Kremlin et de l'hôtel de ville de Moscou, scandant des slogans de soutien au président Eltsine et exigeant une nouvelle constitution."
 Yeltsin.10.a: "La voix du peuple est aux côtés du président."

 Yeltsin_FP.1.t: "Andreï Kozyrev nommé ministre des Affaires étrangères"
 Yeltsin_FP.1.d: "Le président Eltsine a confirmé le diplomate de carrière Andreï Kozyrev au poste de ministre des Affaires étrangères. Kozyrev s'engage à mettre fin à des décennies d'hostilité idéologique avec l'Occident, à rechercher l'intégration de la Russie dans les organismes économiques et sécuritaires mondiaux et à poursuivre une politique d'internationalisme démocratique."
 Yeltsin_FP.1.a: "Une diplomatie guidée par les valeurs démocratiques."

 Yeltsin_FP.2.t: "Création du Conseil des États de la mer Baltique"
 Yeltsin_FP.2.d: "À Copenhague, les ministres des Affaires étrangères de dix pays de la région, dont la Russie, l'Allemagne, la Suède et la Pologne, ont officiellement créé le Conseil des États de la mer Baltique (CBSS). Le conseil coordonnera le commerce, la protection de l'environnement et le transit énergétique autour de la mer Baltique."
 Yeltsin_FP.2.a: "Un nouveau forum régional est né."

 Yeltsin_FP.3.t: "La Russie rejoint le CBSS"
 Yeltsin_FP.3.d: "L'adhésion de la Russie au Conseil des États de la mer Baltique garantit que la région de Kaliningrad ne sera pas coupée des réseaux commerciaux européens et instaure un dialogue diplomatique régulier avec nos voisins du nord-ouest."
 Yeltsin_FP.3.a: "Coopération dans la Baltique."

 Yeltsin_FP.4.t: "Création de l'EuroFaculty"
 Yeltsin_FP.4.d: "L'initiative EuroFaculty a été lancée pour moderniser l'enseignement supérieur sur le littoral baltique. Des professeurs russes de droit et d'économie participeront à des programmes d'échange visant à réformer les programmes d'études selon les principes européens contemporains."
 Yeltsin_FP.4.a: "Investissez dans l'enseignement supérieur."

 Yeltsin_FP.5.t: "La Russie propose un partenariat pour la paix"
 Yeltsin_FP.5.d: "La Fédération de Russie a officiellement proposé de participer au programme de Partenariat pour la paix (PpP) de l'OTAN. Moscou recherche des consultations militaires transparentes, des exercices conjoints de recherche et de sauvetage et des mesures de confiance sans tracer de nouvelles lignes de division militaires en Europe."
 Yeltsin_FP.5.a: "Acceptez la Russie dans le Partenariat pour la paix."
 Yeltsin_FP.5.b: "Refus d'officialiser les liens militaires avec Moscou."

 Yeltsin_FP.6.t: "Le Traité de Fédération signé"
 Yeltsin_FP.6.d: "Dans la salle Saint-Georges du Grand Palais du Kremlin, les représentants de 86 des 88 républiques et régions constituant la Russie ont signé le traité historique de la Fédération. L'accord délègue une large autonomie budgétaire aux autorités régionales tout en préservant définitivement la souveraineté et l'intégrité territoriale de la Fédération de Russie."
 Yeltsin_FP.6.a: "La Fédération tient ensemble."

 Yeltsin_FP.7.t: "La bataille de Soukhoumi"
 Yeltsin_FP.7.d: "À la suite d'intenses combats urbains, Soukhoumi est tombée aux mains des forces abkhazes appuyées par des brigades de volontaires du Caucase du Nord. Des milliers de civils et militaires géorgiens ont fui vers la côte de la mer Noire. Des navires de guerre russes ont été dépêchés pour évacuer les réfugiés et empêcher de nouvelles effusions de sang."
 Yeltsin_FP.7.a: "Envoyez des secours humanitaires et des forces de maintien de la paix."

 CIS.0.t: "Création des Forces armées unifiées de la CEI"
 CIS.0.d: "À Minsk, les pays membres de la Communauté des États indépendants ont convenu de créer les Forces armées conjointes de la CEI sous le commandement opérationnel du maréchal de l'aviation Eugène Shaposhnikov. Le traité vise à maintenir le commandement nucléaire stratégique et la sécurité conventionnelle des frontières sous un toit unifié."
 CIS.0.a: "Les forces stratégiques restent unies."

 CIS.1.t: "Accord de défense collective CEI"
 CIS.1.d: "Notre pays a ratifié les protocoles de défense commune de la Communauté des États indépendants, acceptant de coordonner la défense aérienne, les fréquences de communication militaires et la maintenance des équipements stratégiques avec les républiques partenaires."
 CIS.1.a: "Ratifier les protocoles."

 Yeltsin_Geo.1.t: "Cadre paneuropéen de sécurité collective"
 Yeltsin_Geo.1.d: "Le gouvernement russe a proposé aux États-Unis un traité paneuropéen complet de sécurité collective. Selon cette proposition, les décisions de sécurité affectant la stabilité européenne seraient délibérées conjointement, empêchant ainsi l'expansion de l'OTAN d'isoler la Russie démocratique."
 Yeltsin_Geo.1.a: "Accepter des consultations structurées sur la sécurité avec Moscou."
 Yeltsin_Geo.1.b: "Rejetez l'initiative ; L'OTAN reste le seul arbitre en matière de sécurité."

 Yeltin_Mil.1.t: "Création des Forces armées de la Fédération de Russie"
 Yeltin_Mil.1.d: "Le 7 mai 1992, le président Boris Eltsine signe le décret présidentiel n° 466 créant officiellement les Forces armées de la Fédération de Russie. Le général d'armée Pavel Grachev est nommé ministre de la Défense. La nouvelle armée hérite des fiers honneurs de bataille de l'histoire russe tout en faisant face au défi monumental de la restructuration du 21e siècle."
 Yeltin_Mil.1.a: "Pour servir la Fédération de Russie !"

 Karabach_Rus.1.t: "Retrait du 366th Motor Rifle Regiment"
 Karabach_Rus.1.d: "Les forces russes du 366e régiment de fusiliers motorisés de la Garde ont achevé leur évacuation de Stepanakert. Pris entre deux feux dans la guerre du Haut-Karabagh, le retrait du régiment évite aux soldats russes de se retrouver impliqués dans un conflit ethnique, même si des armements importants ont été transférés aux forces d'autodéfense arméniennes locales."
 Karabach_Rus.1.a: "Nos soldats rentrent chez eux."

 RUS_ECON90.1.t: "Le choc des prix de Gaidar"
 RUS_ECON90.1.d: "Le 2 janvier 1992, Yegor Gaidar débloque du jour au lendemain le contrôle des prix par l'État. En quelques jours, les prix du pain, des produits laitiers et des biens de consommation grimpent de plusieurs centaines de pour cent, anéantissant l'épargne des ménages dans les banques d'État. Pourtant, pour la première fois de mémoire, les longues files d'attente disparaissent et les marchandises reviennent dans les rayons des magasins. La Russie a fait un saut irréversible vers l'économie de marché."
 RUS_ECON90.1.a: "Une transition douloureuse, mais nécessaire."

 RUS_ECON90.2.t: "Anatoliy Chubais et privatisation des bons d'achat"
 RUS_ECON90.2.d: "Dirigé par Anatoli Chubais, le Comité des domaines de l'État a lancé le programme de privatisation par bons. Chaque citoyen russe reçoit un bon d'une valeur nominale de 10 000 roubles, échangeable contre des actions dans les usines d'État. Tandis que de nombreux citoyens vendent leurs bons d'achat pour obtenir rapidement de l'argent, une nouvelle classe d'entrepreneurs privés commence à prendre le contrôle des actifs industriels du pays."
 RUS_ECON90.2.a: "Distribuez les bons."

 RUS_ECON90.3.t: "Les enchères de prêts contre actions"
 RUS_ECON90.3.d: "Confronté à des déficits budgétaires catastrophiques et à des retraites impayées à l'approche des élections de 1996, le gouvernement adopte le programme de « prêts contre actions » conçu par Vladimir Potanine. Dans le cadre d'enchères fermées, des consortiums de banques commerciales privées prêtent de l'argent à l'État en échange du contrôle de participations dans des géants des ressources naturelles comme Ioukos, Norilsk Nickel et Sibneft.\n\nTandis que l'État reçoit des liquidités essentielles, le programme controversé consolide l'immense pouvoir politique et économique des nouveaux oligarques russes."
 RUS_ECON90.3.a: "Approuvez les enchères : sécurisez les fonds du trésor vitaux."
 RUS_ECON90.3.b: "Rejetez le projet : gardez les monopoles naturels entre les mains de l'État."

 RUS_ECON90.4.t: "Le corridor du rouble et la défense monétaire"
 RUS_ECON90.4.d: "Pour mettre fin à la spéculation sauvage sur les devises et maîtriser l'inflation persistante, la Banque centrale de Russie et le ministère des Finances ont introduit le « corridor du rouble », fixant le taux de change du rouble dans des bandes définies. Soutenue par une discipline monétaire stricte, l'inflation mensuelle tombe à un chiffre, rétablissant la confiance dans la monnaie nationale."
 RUS_ECON90.4.a: "Le rouble est stabilisé."

 RUS_ECON90.5.t: "Le krach financier d'août 1998"
 RUS_ECON90.5.d: "Le 17 août 1998, frappés par la crise financière asiatique et la chute des prix du pétrole brut à 10 dollars le baril, le gouvernement russe et la Banque centrale annoncent un moratoire d'urgence de 90 jours sur le paiement de la dette extérieure et une dévaluation massive du rouble.\n\nLe marché des bons du Trésor de GKO s'effondre, les grandes banques commerciales gèlent leurs opérations et les citoyens ordinaires font la queue devant leurs succursales fermées. Le président Eltsine limoge Sergueï Kirienko et doit nommer un gouvernement de consensus pour empêcher l'effondrement de l'État."
 RUS_ECON90.5.a: "Un coup catastrophique pour le système financier."

 RUS_ECON90.6.t: "Le cabinet de stabilisation Primakov"
 RUS_ECON90.6.d: "Nommé Premier ministre avec le soutien massif de tous les partis de la Douma d'État, l'homme d'État respecté Eugène Primakov s'associe au président de la Banque centrale, Viktor Gerashchenko. Refusant les formules idéologiques radicales, le gouvernement de Primakov donne la priorité au remboursement des salaires et des retraites, met fin aux programmes d'obligations spéculatives et soutient l'industrie manufacturière nationale.\n\nAidées par la déévaluation du rouble, les industries nationales russes reprennent vie, générant une croissance économique robuste et inattendue."
 RUS_ECON90.6.a: "L'économie russe commence à se rétablir."

