 IND_convoy1_desc: "Navire cargo marchand civil utilisé pour transporter de grandes quantités de marchandises par voie maritime. Les navires marchands civils peuvent parfaitement servir à la logistique militaire et sont omniprésents avec d'innombrables fabricants et cales sèches facilement disponibles pour fabriquer en masse ces navires. Les cargos assurent la majeure partie du commerce international dans le monde et sont divisés en classes en fonction du type de marchandise qu'ils transportent. Il peut s'agir de cargos généraux, de porte-conteneurs, de pétroliers, de vraquiers secs, de navires polyvalents, de navires RORO (pour véhicules à roues) ou de navires frigorifiques (réfrigérés)."
 IND_convoy_desc: "Navire cargo marchand civil utilisé pour transporter de grandes quantités de marchandises par voie maritime. Les navires marchands civils peuvent parfaitement servir à la logistique militaire et sont omniprésents avec d'innombrables fabricants et cales sèches facilement disponibles pour fabriquer en masse ces navires. Les cargos assurent la majeure partie du commerce international dans le monde et sont divisés en classes en fonction du type de marchandise qu'ils transportent. Il peut s'agir de cargos généraux, de porte-conteneurs, de pétroliers, de vraquiers secs, de navires polyvalents, de navires RORO (pour véhicules à roues) ou de navires frigorifiques (réfrigérés)."
 
