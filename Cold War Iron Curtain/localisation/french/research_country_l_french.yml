 IND_support_equipment_desc: "Un large assortiment d'équipements de haute qualité achetés sur le marché civil. Équipements et fournitures médicaux, équipements logistiques, jumelles, équipements et outils de construction, ainsi que divers autres articles accessibles au public. Il n'est pas difficile de trouver, de commander ou de sous-traiter la grande majorité des équipements de support utilisés."
 IND_support_equipment_0_desc: "Un large assortiment d'équipements de haute qualité achetés sur le marché civil. Équipements et fournitures médicaux, équipements logistiques, jumelles, équipements et outils de construction, ainsi que divers autres articles accessibles au public. Il n'est pas difficile de trouver, de commander ou de sous-traiter la grande majorité des équipements de support utilisés."
 IND_motorized_equipment_1_desc: "Un camion agricole 4x4 robuste et fiable de 1,5 tonne. Bien qu'ils ne soient pas aussi performants que les camions de qualité militaire, les gros camions agricoles conviennent souvent très bien à leur objectif. Les camions agricoles sont construits dans un souci de fiabilité et sont capables de transporter de grosses charges de marchandises sur divers terrains. Les camions agricoles peuvent transporter une bonne quantité de marchandises et transporter jusqu'à 10 soldats à l'arrière. Bien que fiables et quelque peu solides, ils ont souvent du mal à transporter des charges particulièrement lourdes et peuvent nécessiter des conversions ou des remorques pour répondre à leurs besoins. En tant que tels, ces camions agricoles sont livrés avec des équipements ou des spécifications commandés sur mesure."
 IND_motorized_equipment_4_desc: "Un camion tout-terrain robuste 6x6 de 5 tonnes exceptionnellement solide, construit à des fins industrielles avec des modifications personnalisées et construit sur commande sur le marché civil. Capables de transporter jusqu'à 12 soldats et de transporter autant de poids que les camions utilitaires militaires, les camions industriels 6x6 du marché civil répondent parfaitement aux besoins militaires. Ces camions partagent souvent la plupart des mêmes éléments que les véhicules de qualité militaire et sont parfois de même conception."
 IND_utility_helicopter_equipment_1_desc: "Un hélicoptère simple mais élégant du début du marché. Les hélicoptères ont de nombreuses utilisations dans l'industrie, les services publics, les services d'urgence, le commerce et parfois pour un usage personnel. Les hélicoptères du marché civil sont rarement à la hauteur des spécifications des hélicoptères de qualité militaire et ne seront pas aussi performants."
 IND_utility_helicopter_equipment_3_desc: "Un hélicoptère commercial acheté sur le marché civil. Ces hélicoptères sont destinés à diverses fins civiles, notamment les services d'urgence ou publics et le commerce. Ces hélicoptères peuvent être équipés pour une variété de rôles militaires sur commande personnalisée ou par modernisation par des professionnels militaires."
 IND_utility_helicopter_equipment_5_desc: "Un hélicoptère robuste exceptionnellement solide et performant, conçu pour les services d'urgence et un usage industriel. Ces hélicoptères sont rapides, solides et quelque peu comparables aux hélicoptères de qualité militaire à l'époque où ils étaient disponibles à l'achat. Ils peuvent être installés pour remplir pratiquement n'importe quel rôle qu'un hélicoptère utilitaire militaire peut jouer et jouer un rôle de combat direct ou de soutien. De plus, avec des spécifications personnalisées mineures, ils peuvent même être équipés de contre-mesures ou d'armes que vous produisez ou achetez dans le cadre de contrats militaires."
 IND_transport_plane_equipment_3_desc: "Un mélange de nombreux avions de transport excédentaires différents, issus de la Seconde Guerre mondiale et vendus par une grande variété de commerçants indépendants de surplus. Après la Seconde Guerre mondiale, de nombreux pays disposaient d'équipements excédentaires qu'ils ne souhaitaient plus conserver ou qu'ils voulaient remplacer par des avions plus modernes après la guerre. En tant que tels, ces avions de transport excédentaires de la Seconde Guerre mondiale se présentent dans différents états de réparation, de kilométrage et de conception. Mais on ne peut pas mettre un prix à l'antiquité."
 IND_transport_plane_equipment_5_desc: "Après la création d'un fret aérien efficace dans les années 1950, les utilisations commerciales et industrielles des avions cargo ont explosé. Ces avions cargo commerciaux sont plus que capables de transporter efficacement des marchandises ou de servir à des fins militaires. Les avions cargo commerciaux nécessitent un minimum de réaménagement à des fins militaires, à moins qu'ils ne soient utilisés pour des opérations aéroportées, auquel cas leur conception devrait être considérablement modifiée pour répondre à ce rôle. Cependant, ils n'ont souvent aucun problème dans la plupart des situations."
 IND_transport_plane_equipment_8_desc: "Composés de nombreuses catégories différentes d'avions-cargos, ces avions-cargos commerciaux peuvent aller des avions combinés aux avions-cargos à ventre ou même comprendre des avions-cargos des services postaux internationaux. Ces avions cargo sont souvent utilisés pour transporter des marchandises qui doivent être livrées rapidement et qui ne peuvent pas arriver à l'heure prévue par un cargo. Ces avions sont souvent capables de remplir des rôles militaires, mais il est fortement recommandé de les commander sur mesure pour des opérations aéroportées dans des zones de combat."
 IND_cargo_helicopter_equipment_2_desc: "Un prototype/hélicoptère cargo civil à adoption précoce. Alors que le monde civil avait d'innombrables utilisations des hélicoptères utilitaires, la fabrication d'hélicoptères cargo lourds à des fins commerciales ou militaires a pris du temps. Il y avait de nombreux premiers utilisateurs des hélicoptères cargo et un grand nombre de fabricants indépendants qui pouvaient accepter des contrats et des commandes d'hélicoptères cargo."
 IND_cargo_helicopter_equipment_4_desc: "Un hélicoptère cargo industriel/commercial entièrement performant pour le marché civil. Ces hélicoptères sont capables de remplir de nombreux rôles dans l'industrie ou le commerce et sont largement utilisés dans les services d'urgence. Outre les services d'urgence et certaines divisions de l'industrie et du commerce, ils constituent souvent un luxe ou une nouveauté, car de plus petits hélicoptères utilitaires remplissent les mêmes rôles, tout aussi bien pour les besoins civils. Cependant, il n'est pas difficile de trouver des fabricants industriels civils capables et désireux de les produire."
