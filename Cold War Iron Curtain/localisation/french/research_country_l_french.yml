 SOV_agm_0: "S-5K"
 SOV_agm_0_short: "S-5K"
 SOV_agm_0_desc: "Initialement testées comme missiles air-air, et échouant dans cette tâche, les roquettes non guidées S-5 de 55 mm ont trouvé leur efficacité dans l'engagement de cibles au sol. La variante S-5K est dotée d'une ogive à charge creuse (HEAT) très efficace contre les cibles blindées moyennes et légères sans perdre en performances contre les cibles non blindées."
 SOV_agm_1: "S-8B"
 SOV_agm_1_short: "S-8K"
 SOV_agm_1_desc: "La fusée non guidée S-8 est le développement ultérieur du S-5. Le S-8 mesure 80 mm, a des capacités de poids globales plus importantes et augmente la portée de la fusée. La variante S-8B se concentre sur le fait d'être un pénétrateur solide, chargé de moins d'explosifs et le rendant plus efficace contre des cibles mieux blindées."
