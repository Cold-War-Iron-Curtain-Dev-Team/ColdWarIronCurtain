 USA_aam_short_range_0: "AIM-9B Sidewinder"
 USA_aam_short_range_0_short: "OBJECTIF-9B"
 USA_aam_short_range_0_desc: "Le développement du Sidewinder a commencé en 1950 au NOTS, rebaptisé plus tard NWC (Naval Weapons Center) à China Lake. L'idée était de créer un missile air-air à recherche de chaleur très simple en équipant une fusée air-air de 12,7 cm (basée sur le zuni de 5 pouces) d'une cellule photoélectrique au sulfure de plomb dans un nez en verre hémisphérique pour détecter le rayonnement infrarouge. Une autre idée simple, mais efficace, était l'utilisation de \"Rollerons\" (roues entraînées par un train de glissement sur les bords de fuite des ailerons agissant comme des gyroscopes stabilisateurs) comme dispositifs de stabilisation du roulis. Le premier test des missiles ont été tirés en 1951 et le 11 septembre 1953, le premier tir air-air contre un drone a été réalisé."
 USA_aam_long_range_0: "Moineau AIM-7D"
 USA_aam_long_range_0_short: "OBJECTIF-7J"
 USA_aam_long_range_0_desc: "L'AAM-N-6a (AIM-7D) était similaire au -6, mais utilisait un nouveau moteur-fusée à carburant liquide Thiokol pour des performances améliorées. Il comprenait également des modifications de l'électronique de guidage pour la rendre efficace à des vitesses de fermeture plus élevées. Le -6a a également été sélectionné pour armer les chasseurs F-110A Spectre (F-4 Phantom) de l'Air Force en 1962, connus sous le nom d'AIM-101. Il est entré en production en 1959, avec 7 500 exemplaires construits."
 USA_aam_short_range_1: "AIM-9E Sidewinder"
 USA_aam_short_range_1_short: "OBJECTIF-9E"
 USA_aam_short_range_1_desc: "L'AIM-9E fut la première version spécifiquement développée par l'USAF. Il s'agissait d'un AIM-9B amélioré avec un nouveau chercheur avec refroidissement thermoélectrique (Peltier) et un taux de poursuite plus élevé de 12°/s. La méthode de refroidissement Peltier permettait un temps de refroidissement illimité pendant que le missile était sur le rail de lancement. Extérieurement, l'AIM-9E différait de l'AIM-9B par sa section nasale conique plus longue. Environ 5 000 AIM-9B ont été convertis en AIM-9E. L'AIM-9E-2 est une variante avec un moteur à fumée réduite."
 USA_aam_long_range_1: "Moineau AIM-7F"
 USA_aam_long_range_1_short: "OBJECTIF-7F"
 USA_aam_long_range_1_desc: "En janvier 1972, Raytheon commença le développement de l'AIM-7F considérablement amélioré. Il comportait un nouveau moteur-fusée à double poussée (boost/sustain) (généralement un Hercules MK 58, mais parfois un Aerojet MK 65), ce qui augmentait considérablement la portée du missile. L'AIM-7F disposait également d'un tout nouveau système électronique de guidage et de contrôle (GCS) à semi-conducteurs, désigné AN/DSQ-35, qui était également compatible avec les radars impulsion-doppler modernes."
 USA_aam_short_range_2: "AIM-9L Sidewinder"
 USA_aam_short_range_2_short: "OBJECTIF-9L"
 USA_aam_short_range_2_desc: "En 1971, l'USAF et l'US Navy ont convenu de développer conjointement l'AIM-9L, un Sidewinder considérablement amélioré basé sur l'AIM-9H. Les principaux objectifs de développement étaient l'ALASCA (capacité tous aspects) et une utilisation efficace contre des cibles à manoeuvres violentes et à grande vitesse à toutes les distances. Toutes les fonctionnalités de l'AIM-9L ont abouti à un missile considérablement amélioré, capable d'acquérir des cibles sous tous les aspects et offrant des performances de suivi, de manoeuvre, de référencement terminal et de destruction bien améliorées. La production a commencé en 1978 et plus de 16 000 AIM-9L ont été construits."
 USA_aam_long_range_2: "Moineau AIM-7M"
 USA_aam_long_range_2_short: "OBJECTIF-7M"
 USA_aam_long_range_2_desc: "La version suivante de l'AIM-7 était l'AIM-7M, dont la principale nouveauté était le nouveau chercheur monopulse inverse pour la capacité de recherche/d'abattage dans une nouvelle section de guidage WGU-6/B (plus tard WGU-23/B). L'AIM-7M dispose également d'une nouvelle ogive à fragmentation explosive WDU-27/B dans une section d'ogive WAU-17/B. Le premier tir d'un YAIM-7M a eu lieu en 1980 et l'AIM-7M est entré en production en 1982."
 USA_aam_short_range_3: "AIM-9M Sidewinder"
 USA_aam_short_range_3_short: "OBJECTIF-9M"
 USA_aam_short_range_3_desc: "L'AIM-9M est un développement de l'AIM-9L et a remplacé ce dernier sur la chaîne de production. Il est doté d'un moteur-fusée à fumée réduite, d'une section de guidage améliorée désignée WGU-4/B, d'une meilleure résistance aux contre-mesures (IRCCM - Infrared Counter-Countermeasures) et d'une fiabilité globale améliorée. La production a commencé en 1982 et jusqu'à présent, plus de 7 000 missiles ont été construits par Raytheon."
 USA_aam_long_range_3: "AIM-120A AMRAAM"
 USA_aam_long_range_3_short: "OBJECTIF-120A"
 USA_aam_long_range_3_desc: ""
 USA_aam_short_range_4: "AIM-9M-8/9 Sidewinder"
 USA_aam_short_range_4_short: "VISER-9M-8/9"
 USA_aam_short_range_4_desc: "Les principales versions de production actuelles sont l'AIM-9M-8 (USN) et l'AIM-9M-9 (USAF). Ils ont encore amélioré les circuits de détection IRCM et les dernières versions du moteur-fusée (MK 36 MOD 11), de la section de guidage (WGU-4E/B) et de l'AOTD (DSU-15B/B). La plupart des AIM-9M existants seront mis à niveau vers la norme -9M-8/9."
