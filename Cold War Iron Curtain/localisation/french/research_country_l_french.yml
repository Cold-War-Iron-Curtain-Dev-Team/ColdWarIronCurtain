 ISR_aam_long_range_0: "Moineau AIM-7D"
 ISR_aam_long_range_0_short: "OBJECTIF-7J"
 ISR_aam_long_range_0_desc: "L'AAM-N-6a (AIM-7D) était similaire au -6, mais utilisait un nouveau moteur-fusée à carburant liquide Thiokol pour des performances améliorées. Il comprenait également des modifications de l'électronique de guidage pour la rendre efficace à des vitesses de fermeture plus élevées. Le -6a a également été sélectionné pour armer les chasseurs F-110A Spectre (F-4 Phantom) de l'Air Force en 1962, connus sous le nom d'AIM-101. Il est entré en production en 1959, avec 7 500 exemplaires construits."
 ISR_aam_short_range_1: "Shafrir-1"
 ISR_aam_short_range_1_short: "Shafrir-1"
 ISR_aam_long_range_1: "Moineau AIM-7F"
 ISR_aam_long_range_1_short: "OBJECTIF-7F"
 ISR_aam_long_range_1_desc: "En janvier 1972, Raytheon commença le développement de l'AIM-7F considérablement amélioré. Il comportait un nouveau moteur-fusée à double poussée (boost/sustain) (généralement un Hercules MK 58, mais parfois un Aerojet MK 65), ce qui augmentait considérablement la portée du missile. L'AIM-7F disposait également d'un tout nouveau système électronique de guidage et de contrôle (GCS) à semi-conducteurs, désigné AN/DSQ-35, qui était également compatible avec les radars impulsion-doppler modernes."
 ISR_aam_short_range_2: "Shafrir-2"
 ISR_aam_short_range_2_short: "Shafrir-2"
 ISR_aam_long_range_2: "Moineau AIM-7M"
 ISR_aam_long_range_2_short: "OBJECTIF-7M"
 ISR_aam_long_range_2_desc: "La version suivante de l'AIM-7 était l'AIM-7M, dont la principale nouveauté était le nouveau chercheur monopulse inverse pour la capacité de recherche/d'abattage dans une nouvelle section de guidage WGU-6/B (plus tard WGU-23/B). L'AIM-7M dispose également d'une nouvelle ogive à fragmentation explosive WDU-27/B dans une section d'ogive WAU-17/B. Le premier tir d'un YAIM-7M a eu lieu en 1980 et l'AIM-7M est entré en production en 1982."
