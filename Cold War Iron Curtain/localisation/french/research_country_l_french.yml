 #### France
 FRA_aam_short_range_0: "Nord AA.20"
 FRA_aam_short_range_0_short: "AA.20"
 FRA_aam_short_range_0_desc: "Le Nord AA.20 était un missile air-air à guidage radio étroitement lié au missile antichar SS.10. Le missile a ensuite été amélioré pour devenir le missile radar AA.25."
 FRA_aam_short_range_1: "Matra R.530 IR"
 FRA_aam_short_range_1_short: "R.530 IR"
 FRA_aam_short_range_1_desc: "Le R.530 a remplacé le R.510, offrant à la fois des modes de référencement radar infrarouge et semi-actif. "
 FRA_aam_short_range_2: "Matra R.550 Magie"
 FRA_aam_short_range_2_short: "R.550 Magie"
 FRA_aam_short_range_2_desc: "Le R.550 Magic a été conçu comme un concurrent du missile Sidwinder, améliorant les performances de l'autodirecteur grâce à l'utilisation d'une cellule photoélectrique IR refroidie."
 FRA_aam_short_range_3: "Matra R.550 Magique 2"
 FRA_aam_short_range_3_short: "R.550 Magie 2"
 FRA_aam_short_range_3_desc: "Le Magic 2 améliore le Magic en ajoutant un chercheur tous aspects ainsi que de petites améliorations des performances du moteur."
 FRA_aam_short_range_4: "MBDA MICA-IR"
 FRA_aam_short_range_4_short: "MICA-IR"
 FRA_aam_short_range_4_desc: "Le missile MICA, développé par le consortium international MBDA, remplace la famille R.530, qui a longtemps servi. Disponible en modes de référence radar actif et d'imagerie infrarouge, le missile offre une capacité hors ligne élevée et une portée améliorée."
 FRA_aam_short_range_5: "MBDA MICA NG"
 FRA_aam_short_range_5_short: "MICA NG"
 FRA_aam_short_range_5_desc: "Deuxième génération de MICA conçue contre des cibles furtives. Le chercheur infrarouge utilisera un capteur matriciel offrant une plus grande sensibilité."

 FRA_aam_long_range_0: "Matra R.511"
 FRA_aam_long_range_0_short: "R.511"
 FRA_aam_long_range_0_desc: "Proche parent du R.510, le R.511 a remplacé l'autodirecteur IR du R.510 par un système de guidage radar semi-actif ainsi qu'un mode de guidage par commande."
 FRA_aam_long_range_1: "Matra R.530"
 FRA_aam_long_range_1_short: "R.530"
 FRA_aam_long_range_1_desc: "Le R.530 a remplacé le R.510, offrant à la fois des modes de référencement radar infrarouge et semi-actif."
 FRA_aam_long_range_2: "Matra Super 530F"
 FRA_aam_long_range_2_short: "Super 530F"
 FRA_aam_long_range_2_desc: "Faisant évoluer le R.530, le Super 530 utilise la même conception large que le R.530 mais avec un autodirecteur radar semi-actif amélioré."
 FRA_aam_long_range_3: "Matra Super 530D"
 FRA_aam_long_range_3_short: "Super 530D"
 FRA_aam_long_range_3_desc: "Le Super 530D utilise un nouveau radar Doppler à impulsions, améliorant la discrimination des cibles, le rejet des contre-mesures et la capacité d'engagement à basse altitude."
 FRA_aam_long_range_4: "MBDA MICA-EM"
 FRA_aam_long_range_4_short: "MICA-EM"
 FRA_aam_long_range_4_desc: "Le missile MICA, développé par le consortium international MBDA, remplace la famille R.530, qui a longtemps servi. Disponible en modes de référence radar actif et d'imagerie infrarouge, le missile offre une capacité hors ligne élevée et une portée améliorée."
 
