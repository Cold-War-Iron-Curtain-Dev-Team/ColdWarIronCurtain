 PRC_team_weapons_2: "Tapez 54 DshK (HMG)"
 PRC_team_weapons_2_short: "Type 54 DshK"
 PRC_team_weapons_2_desc: "La mitrailleuse lourde DShK est une HMG à clapet fonctionnant au gaz développée en 1938 par Vasily Degtyaryov. L'arme elle-même a été utilisée à la fois comme HMG et parfois comme petite arme anti-aérienne par l'infanterie pendant la Seconde Guerre mondiale. Plus d'un million d'exemplaires ont été fabriqués aujourd'hui et, en raison de leur faible coût et de leur facilité de fabrication, ils continuent d'être fabriqués par de nombreux pays sous-développés à travers le monde avec un succès notable."
