 PRC_team_weapons_4: "QJC-88 (HMG), QLZ-87 (HGL)"
 PRC_team_weapons_4_short: "QJC-88, QLZ-87"
 PRC_team_weapons_4_desc: "Le NSVT est une variante améliorée du NSV HMG qui a été améliorée par ses concepteurs d'origine quelque temps après la sortie de l'arme initiale. Le NSVT présentait des améliorations telles qu'un poids plus léger grâce à des pièces simplifiées et des matériaux plus modernisés pour permettre à l'arme de tirer plus longtemps. C'est également à cette époque que divers accessoires furent développés pour le HMG. Le NSVT est bien connu pour être monté sur les CCP soviétiques tels que le 64, le 72 et le 80.\nLe 2B14 est un mortier léger à tir indirect moderne conçu en 1983 par l'usine d'ingénierie de Nizni Novgorod pour être utilisé dans les forces aéroportées et d'infanterie légère. L'arme tire un mortier moderne de 82 mm et a une cadence de tir d'environ 24 coups par minute. Sa cadence de tir élevée et sa conception logistique efficace en faisaient une excellente arme pour les Soviétiques et son utilisation allait bien au-delà de son objectif prévu, y compris pour les unités de fusils motorisés. Son succès s'est largement manifesté pendant la guerre en Afghanistan."
 PRC_team_weapons_5: "QJZ-90 (HMG)"
 PRC_team_weapons_5_short: "QJZ-90"
 PRC_team_weapons_5_desc: "Le Kord 6P50 est un HMG russe conçu par Namitulin, Obidin, Bogdanov et Zhirokhin. L'arme présente d'importants changements par rapport à l'ancien NSVT, notamment un boulon rotatif remplaçant le verrou de culasse pivotant, un système de gaz amélioré et un déflecteur de bouche retravaillé. Le canon a beaucoup moins de recul, ce qui lui confère une plus grande précision et des temps de tir plus longs, ce qui le rend meilleur pour supprimer les tirs et l'appui-feu à longue portée. Il est également beaucoup plus léger et produit un volume de feu plus élevé. Il a été témoin de combats dans une grande variété de conflits modernes en Russie et dans la sphère russe, notamment la guerre russo-géorgienne et la guerre civile syrienne. Il existe également des rapports selon lesquels cela a été observé dans les guerres en Irak et en Afghanistan avec les États-Unis, bien que rarement.\nL'ASG-30 est un lance-grenades lourd développé en 1990 par le bureau du KBP pour l'Union soviétique mais qui n'a été adopté qu'après la dissolution en 1995 par la fédération de Russie. Il tire à une cadence de 400 coups par minute et est équipé d'une action Blowback. Sa conception est fortement basée sur l'AGS-17 et est massivement plus légère, plus mobile, a une portée plus longue et est plus précise. Le lanceur a acquis un prestige notable grâce à sa capacité à abattre des ennemis fortifiés. Sa capacité a été prouvée lors de la deuxième guerre de Tchétchénie, où elle s'est révélée être une arme très performante."

 PRC_squad_weapons_1: "DP (LMG)"
 PRC_squad_weapons_1_short: "DP"
 PRC_squad_weapons_1_desc: "Le DP est un LMG développé par Vasily Degtyaryov en 1927 pour l'Union soviétique. Le pistolet lui-même utilise les mêmes munitions que le Mosin-Nagant et est un LMG entièrement automatique fonctionnant au gaz avec une conception de verrouillage des volets Kjellmann-Friberg. Il comprend un canon amovible avec un suppresseur de flash intégré et un chargeur panoramique. Il était facile à fabriquer en série en raison de la simplicité et du petit nombre de pièces. Il est bien connu pour sa légèreté et sa polyvalence. Il était monté sur des chars et des avions soviétiques et utilisé par l'infanterie. Il a été largement utilisé tout au long de la Seconde Guerre mondiale."
 PRC_squad_weapons_2: "RP-46 (LMG)"
 PRC_squad_weapons_2_short: "RP-46 (LMG)"
 PRC_squad_weapons_2_desc: "Le RPK est un LMG conçu par Mikhaïl Kalachnikov en 1961 et mis en service presque immédiatement par l'Union soviétique. Le RPK utilise en grande partie les mêmes fonctions et mécanismes que l'AK-47, notamment en utilisant la même forme de munition, ce qui permet un système logistique et de production plus rationalisé. Le RPK est doté d'un canon long et lourd et d'un récepteur renforcé pour améliorer sa portée, sa précision et sa capacité de tir soutenu. Le canon chromé était fixé de manière permanente, empêchant toute maintenance sur le terrain, et bien qu'il soit plus fiable au combat, il nécessitait un équipement spécialisé pour le nettoyer et l'entretenir. Le RPK verrait le combat dans le conflit frontalier sino-soviétique en 1969 être utilisé par l'Union soviétique. De plus, il a été largement utilisé lors de l'invasion de la Tchécoslovaquie par le Pacte de Varsovie en 1968."
 PRC_squad_weapons_3: "QJY-67 (LMG)"
 PRC_squad_weapons_3_short: "QJY-67"
 PRC_squad_weapons_3_desc: "Le RPK est un LMG conçu par Mikhaïl Kalachnikov en 1961 et mis en service presque immédiatement par l'Union soviétique. Le RPK utilise en grande partie les mêmes fonctions et mécanismes que l'AK-47, notamment en utilisant la même forme de munition, ce qui permet un système logistique et de production plus rationalisé. Le RPK est doté d'un canon long et lourd et d'un récepteur renforcé pour améliorer sa portée, sa précision et sa capacité de tir soutenu. Le canon chromé était fixé de manière permanente, empêchant toute maintenance sur le terrain, et bien qu'il soit plus fiable au combat, il nécessitait un équipement spécialisé pour le nettoyer et l'entretenir. Le RPK verrait le combat dans le conflit frontalier sino-soviétique en 1969 être utilisé par l'Union soviétique. De plus, il a été largement utilisé lors de l'invasion de la Tchécoslovaquie par le Pacte de Varsovie en 1968."
 PRC_squad_weapons_4: "QJY-88 (LMG)"
 PRC_squad_weapons_4_short: "QJY-88 (LMG)"
 PRC_squad_weapons_4_desc: "Le RPK-74 est une version améliorée du RPK développé en 1974 par Mikhaïl Kalachnikov et adopté presque immédiatement. Le RPK-74 utilise les munitions plus petites également utilisées par l'AK-74. Il utilise un canon chromé plus long et un bloc de gaz amélioré avec un canal de gaz à 90 degrés de l'axe d'alésage avec un anneau pour la tige de nettoyage. Il est également livré avec un tourillon arrière renforcé et un puits de chargeur renforcé. Le canon lui-même tire plus rapidement avec une vitesse initiale beaucoup plus élevée que son prédécesseur. Il a été largement utilisé pendant la guerre dans le Donbass et le conflit en Afghanistan.\nLe GP-25 est un lance-grenades soviétique qui peut être monté sur le canon des fusils Kalachnikov. Il a été développé par TsKIB SOO en 1978 et a été immédiatement adopté. Il tire une grenade sans étui de 40 mm et est extrêmement fiable. Pendant la guerre en Afghanistan, le lance-grenades a démontré des capacités de combat exceptionnelles."
 PRC_squad_weapons_5: "QBB-95 (LMG), LF-91 (GL)"
 PRC_squad_weapons_5_short: "QBB-95, LF-91"
 PRC_squad_weapons_5_desc: "La PKP est une mitrailleuse moderne à usage général conçue par TsNIITochMash en Russie en 2001. Elle est beaucoup plus précise que tous les modèles précédents et chambre le plus gros calibre de munitions utilisé par l'AK-47. Il est doté d'un canon de refroidissement à air pulsé plus lourd et non amovible et de nervures radiales qui empêchent la brume thermique et maintiennent le canon au frais lors d'un tir soutenu. Il comporte également des matériaux et des alliages modernes intégrés à sa conception, ce qui lui permet d'être plus solide et de conserver une plus grande puissance de feu que les modèles précédents. Il a été utilisé massivement dans le monde entier lors de la guerre civile syrienne, de la guerre de Géorgie, de la deuxième guerre de Tchétchénie, de l'invasion de la Crimée, etc. *Renifle*"

 PRC_specialist_1: "SVT-40 (SR)"
 PRC_specialist_1_short: "SVT-40"
 PRC_specialist_1_desc: "Le SVT-40 est un fusil à gaz semi-automatique qui utilise une alimentation par chargeur. Le SVT-40 est un fusil de combat développé pour l'Union soviétique en 1940 par Sergueï Simonov. Il a été donné à des tireurs d'élite et à des tireurs d'élite désignés, bien que le modèle standard Mosin-Nagant ait également été utilisé pour les combats à longue distance par certains tireurs d'élite. Il a été largement utilisé pendant la Seconde Guerre mondiale et a depuis lors été impliqué dans de nombreuses insurrections communistes, car il a été loué aux rebelles par l'Union soviétique."
 PRC_specialist_2: "Fusil de précision Dragunov (SR)"
 PRC_specialist_2_short: "NDM-86 Dragounov"
 PRC_specialist_2_desc: "Le fusil de précision Dragunov est un DMR semi-automatique qui chambre la cartouche Mosin 7,62x54R. Le Dragunov a été développé en 1963 par Yevgeny Dragunov. L'arme elle-même est connue pour sa grande précision et sa fiabilité exceptionnelle et a été utilisée encore aujourd'hui par les armées du monde entier. Des munitions peu coûteuses, un entretien facile et une grande fiabilité ont permis à cette arme de rester en service même dans certaines des armées les plus pauvres du monde, tout en parvenant à s'imposer dans les combats modernes. Il a été témoin d'un nombre inquantifiable de combats dans plus de 40 guerres à travers le monde."
 PRC_specialist_3: "CONTRE (SR)"
 PRC_specialist_3_short: "VSS"
 PRC_specialist_3_desc: "Le fusil de précision VSS est un fusil de précision spécialisé développé en 1980 par Serdjukov et Krasnikov. Le fusil de précision VSS est doté d'un canon supprimé intégré et utilise des munitions subsoniques ou AP. Le fusil lui-même est principalement utilisé par les unités des forces spéciales telles que Spetsnaz pour sa capacité clandestine et son système intégré de suppression du son et des flashs. Il a été témoin de combats lors de la guerre en Afghanistan, mais très rarement en dehors de celle-ci."
 PRC_specialist_4: "OTs-03 SVU (SR)"
 PRC_specialist_4_short: "OTs-03 SVU"
 PRC_specialist_4_desc: "Le Dragunov SVU est une variante bullpup moderne du Dragunov qui était initialement destinée à moderniser légèrement le Dragunov mais le projet a conduit à une refonte presque complète de l'arme. Conçue en 1990 par le KBP Instrument Design Bureau, l'arme a réinventé l'ancien Dragunov. Un frein de bouche spécial a été ajouté, réduisant considérablement l'énergie de recul, et une crosse élastique a été fixée. Un grand nombre d'autres petites améliorations telles qu'une meilleure adhérence, un support de visée et une taille de canon réduite avec une configuration bullpup ont rendu l'arme plus facile à manipuler. Le SVU a combattu lors de la première guerre de Tchétchénie, où il a démontré des performances exceptionnelles au-dessus du Dragunov original."
 PRC_specialist_5: "QBU 88 (SR)"
 PRC_specialist_5_short: "QBU88"
 PRC_specialist_5_desc: "Le SVDK est un fusil de précision russe moderne conçu à la fin des années 1990 par TSNIITOCHMASH, mais n'a été produit qu'en 2006. Le SVDK est un fusil de précision de gros calibre qui a une portée effective d'environ 600 mètres. Il peut pénétrer dans un gilet pare-balles ou une couverture lourde et a été construit dans le but d'attaquer des cibles que le SVU ne peut pas. Aucun incident n'a été signalé au cours duquel le SVDK a participé à des combats."

 PRC_ammo_explosives_1: "RGD-33 (Grenade AT), FMJ (Munitions)"
 PRC_ammo_explosives_1_short: "RGD-33, FMJ"
 PRC_ammo_explosives_1_desc: "La grenade RGD-33 AP était une grenade à main conçue par Dyakonov en 1933. La grenade elle-même est chargée de TNT et la mèche a été frappée par un processus de lancement et d'élan vers l'avant après avoir été amorcée. La grenade elle-même n'a été assemblée qu'avant le combat pour réduire le risque d'accident, le manchon, l'ogive et la poignée étant séparés. Il indique des niveaux d'utilisation importants avant, pendant et après la Seconde Guerre mondiale ainsi que la guerre de Corée et du Vietnam.\nLa cartouche Full Metal Jacket est une balle inventée en 1882 par le colonel suisse Eduard Rubin. Cependant, des améliorations ont été apportées à la métallurgie depuis la Seconde Guerre mondiale et, en tant que tel, la ronde FMJ de la Seconde Guerre mondiale a simplement incorporé des matériaux de meilleure qualité dans la conception déjà existante."
 PRC_ammo_explosives_2: "RKG-3 (Grenade AT), F1 (Grenade), MON Mines (Mines)"
 PRC_ammo_explosives_2_short: "Mines RKG-3, F1, MON"
 PRC_ammo_explosives_2_desc: "La grenade RKG-3 AT est une grenade AT soviétique développée en 1950 comme une amélioration du RPG-40 par ses fabricants. Elle a été impliquée dans les guerres d'Irak et de Yom Kippour. La grenade elle-même présentait un meilleur niveau de capacité anti-blindage par rapport à son prédécesseur et comportait un fusible amélioré et un mélange de remplissage puissant.\nLa grenade F1 AP est une grenade AP/frag de développement partagé dans laquelle les fabricants d'armes russes ont amélioré la grenade F1 française existante en installant un fusible à fil-piège moderne et un remplissage en TNT avec un ensemble de coques métalliques à fragmentation de meilleure qualité. Il a été témoin de pratiquement tous les combats russes depuis la Seconde Guerre mondiale, depuis sa création en 1941 jusqu'à nos jours.\nLes mines terrestres MON sont une série de premières mines terrestres développées pour l'Union soviétique par divers concepteurs des années 50 aux années 60. Les mines terrestres MON sont toutes antipersonnel et utilisent généralement la fragmentation et le TNT pour effectuer des missions de déni de zone. Ils ont été témoins de pratiquement tous les combats de l'Union soviétique dans les années 50 et 60."
 PRC_ammo_explosives_3: "Munitions AP modernes (munitions), mines TM (mines terrestres)"
 PRC_ammo_explosives_3_short: "Munitions AP modernes, mines TM"
 PRC_ammo_explosives_3_desc: "Les obus AP existent depuis de nombreuses années avant la Première Guerre mondiale et étaient principalement utilisés dans les navires de guerre pénétrants. Autour de la Première Guerre mondiale, après l'entrée du char sur le champ de bataille, des obus miniaturisés ont été créés. Finalement, de petits calibres AP ont été créés en réponse aux gilets pare-balles. Les munitions AP modernes ont été créées en 1965 pour répondre à l'augmentation de l'infanterie lourdement blindée et de la couverture d'infanterie. Les mines terrestres TM sont une série de mines antichars soviétiques initialement développées et largement utilisées vers 1941, mais qui ont été abandonnées en raison d'une pénurie de métal qui a été priorisée pour créer d'autres armes. Cependant, vers 1957, elles firent leur retour et le développement et la production des mines TM se poursuivirent finalement en utilisant des explosifs plus modernes. Les mines TM ont été fréquemment utilisées presque partout où il y avait un conflit dans la sphère soviétique, mais leur plein potentiel a été démontré lors de l'invasion soviétique de l'Afghanistan."
 PRC_ammo_explosives_4: "RGO/RGN (Grenades)"
 PRC_ammo_explosives_4_short: "RGO/RGN"
 PRC_ammo_explosives_4_desc: "La RGO et la RGN sont respectivement des grenades à main à fragmentation défensive et offensive. Ils sont constitués d'un corps pré-fragmenté monocouche. La coque elle-même est composée de 2 sections dentelées en aluminium en haut et en bas. Les grenades elles-mêmes explosent immédiatement à l'impact, rendant la réaction des cibles plus difficile. Ils ont été créés dans le cadre du projet BAZALT pendant la guerre soviéto-afghane et leurs explosions à impact ont permis d'atteindre plus facilement des cibles sur un terrain rocheux.\nLes grenades utilitaires sont des grenades à main qui ont des rôles spécialisés tels que des flashbangs, des fumigènes, des incendiaires, etc. Elles peuvent être utilisées respectivement pour étourdir les ennemis, dissimuler des positions et interdire une zone. "
 PRC_ammo_explosives_5: "Cartouches modernes (munitions)"
 PRC_ammo_explosives_5_short: "Rondes modernes"
 PRC_ammo_explosives_5_desc: "À l'ère moderne, il existe un vaste arsenal de différents types de munitions spécialisées pouvant être utilisées dans des situations spécifiques. Les obus AP modernes sont bien meilleurs pour pénétrer les cibles que les obus AP plus anciens et peuvent atteindre des vitesses plus élevées. Les alliages modernes permettent aux munitions standard d'infliger plus de dégâts à une cible. Les balles frangibles ou les cartouches incendiaires ont des situations particulières dans lesquelles elles sont utiles. De plus, les fusils de chasse peuvent avoir une utilisation améliorée dans les combats modernes avec des cartouches HE, des munitions 000, des cartouches à fléchettes ou des tirs incendiaires."

 PRC_manpats_1: "Grenade à fusil Dyakanov"
 PRC_manpats_1_short: "Grenade à fusil Dyakanov"
 PRC_manpats_1_desc: "Le lance-grenades à fusil Dyakanov était l'un des premiers modèles d'explosifs tirés par l'infanterie et servait parfois d'antichar pendant la Seconde Guerre mondiale. Cependant, l'Union soviétique n'a pas développé ses propres armes d'infanterie antichar et s'est fortement appuyée sur les prêts-bails. Le Dyakanov a été développé par Dyakanov MG en 1917 et peut lancer des explosifs spécialement conçus chargés par la bouche, tels que des grenades antichar ou antipersonnel. L'arme elle-même a été largement utilisée pendant la Seconde Guerre mondiale, mais a été rapidement abandonnée après la fin de la guerre au profit de l'Union soviétique développant de meilleurs lance-grenades d'infanterie et des MANPATS appropriés."
 PRC_manpats_2: "RPG-7"
 PRC_manpats_2_short: "RPG-7"
 PRC_manpats_2_desc: "Le RPG-7 est une grenade antichar propulsée par fusée développée en 1958 par la société de fabrication d'armes Bazalt. Le RPG-7 est bien connu pour sa simplicité, son faible coût, sa grande efficacité ainsi que son incroyable longévité et fiabilité. Il est capable de tirer des obus standard, HEAT, à fragmentation et thermobariques. Il est composé d'un système très simple qui se caractérise par son faible coût et sa facilité d'entretien. Il est basé sur un tube d'acier et le milieu est recouvert de bois pour le protéger de la chaleur. L'extrémité est évasée pour aider à protéger l'utilisateur contre les explosions et à réduire le recul. Lorsqu'il est tiré, il frappe simplement le percuteur comme une arme à feu ordinaire pour enflammer la grenade. Il est omniprésent depuis sa création et a été observé dans pratiquement tous les combats partout sur Terre."
 PRC_manpats_3: "RPG-18"
 PRC_manpats_3_short: "RPG-18"
 PRC_manpats_3_desc: "Le RPG-19 a été développé par le fabricant d'armes Bazalt au début des années 1970. Le RPG-18 tire une ogive HEAT de 64 mm et a une portée effective de 200 mètres. L'ogive s'autodétruit toujours après 6 secondes, ce qui impose une limite définie. Le RPG-18 n'a pas été autant utilisé que le RPG-7 et n'a pas fait autant de chemin dans le monde en raison du fait qu'il ne peut pas être rechargé. Il est cependant très bon marché bien qu'il soit plus lourd sur le plan logistique car chaque tube ne tire qu'une seule fois. Il a été largement utilisé dans diverses guerres menées par la Chine ainsi que dans la guerre soviéto-afghane."
 PRC_manpats_4: "RPG-29"
 PRC_manpats_4_short: "RPG-29"
 PRC_manpats_4_desc: "Le RPG-29 est un RPG antichar rechargeable développé par Bazalt à la fin des années 1980. Il a été développé pour fournir une variante moderne et améliorée du RPG-7 et est rechargeable contrairement au RPG-18. Il tire des roquettes à une portée effective d'environ 600 mètres et n'est pas limité par une ogive chronométrée. Il est bien plus capable de pénétrer l'armure que le RPG-7, même s'il n'a pas complètement dissuadé le RPG-7 ou le RPG-18 en raison de son coût plus élevé. Le RPG-29 n'a pas non plus de charge propulsive initiale pour protéger les opérateurs lorsque la fusée s'enflamme afin de réduire le poids et de donner une valeur de poids plus précieuse qui peut être utilisée pour plus de carburant de fusée. Cela signifie qu'il n'est pas aussi simple à utiliser et nécessite un niveau de protection pour son utilisateur mais le rend plus efficace. Le RPG-29 a été utilisé dans la guerre en Irak, dans la guerre civile syrienne et dans la guerre du Liban en 2006."
 PRC_manpats_5: "RPG-32"
 PRC_manpats_5_short: "RPG-32"
 PRC_manpats_5_desc: "Le RPG-32 est une arme d'infanterie antichar russe moderne développée par Bazalt en 2005. L'arme a une portée effective d'environ 350 m avec une portée maximale de 700 m. Le lanceur est livré avec 2 ogives différentes de 72 ou 105 mm, thermobariques ou HEAT. Il a une capacité de perforation de blindage bien plus grande que n'importe lequel de ses prédécesseurs. Il n'a pas encore été déployé ni accepté par l'armée russe en raison de son coût élevé, bien que plusieurs pays du Moyen-Orient l'importent de Russie, principalement pour l'utiliser dans les bataillons haut de gamme de leur armée. Il est actuellement utilisé dans la guerre civile irakienne et la guerre civile yéménite."

 PRC_hmg_1: "DShK"
 PRC_hmg_1_short: "DShK"
 PRC_hmg_1_desc: "La mitrailleuse lourde DShK est une HMG à clapet fonctionnant au gaz développée en 1938 par Vasily Degtyaryov. L'arme elle-même a été utilisée à la fois comme HMG et parfois comme petite arme anti-aérienne par l'infanterie pendant la Seconde Guerre mondiale. Plus d'un million d'exemplaires ont été fabriqués aujourd'hui et, en raison de leur faible coût et de leur facilité de fabrication, ils continuent d'être fabriqués par de nombreux pays sous-développés à travers le monde avec un succès notable."
 PRC_manpads_1: "Strela-2"
 PRC_manpads_1_short: "Strela-2"
 PRC_manpads_1_desc: "Le Strela-2 est un lanceur de missiles antiaériens portable d'infanterie MANPAD qui était une arme de base de la sphère soviétique. Conçue par KBM en 1964, l'arme comportait un fusible à détonation à impact sans retard, une ogive explosive HE et un système de guidage de missile à logique de navigation proportionnelle. Il s'est avéré relativement peu coûteux à fabriquer en série. Cependant, le haut commandement soviétique a rapidement remarqué que le Strela-2 fonctionnait mal et bien en deçà de ce à quoi il s'attendait. Il a été témoin de conflits lors de la guerre soviéto-afghane, de nombreuses révolutions communistes différentes, ainsi que d'une utilisation intensive dans les conflits du Moyen-Orient. "
 PRC_manpads_2: "Strela-3"
 PRC_manpads_2_short: "Strela-3"
 PRC_manpads_2_desc: "L'Union soviétique a rapidement commencé à développer le Strela-3 après avoir constaté que le Strela-2 avait été inefficace au combat. KBM a terminé le développement du Strela-3 en 1974 et il s'est avéré bien plus performant. Au lieu d'une logique de navigation proportionnelle, le Strela-3 a utilisé le guidage infrarouge pour atteindre des cibles bien au-delà de la portée effective du Strela-2. De plus, il était livré avec un refroidisseur d'élément détecteur dans le missile lui-même, ce qui lui permet d'être moins facilement trompé par les fusées éclairantes et de rechercher plus précisément les véritables cibles. Malgré cela, les ajouts ont rendu le missile plus lourd et nécessitent un carburant de propulsion plus cher, rendant chaque tir plus cher. Le Strela-3 a été utilisé dans de nombreux conflits au Moyen-Orient, tels que la guerre Irak-Iran, mais n'a pas connu beaucoup de combats au sein même de la sphère soviétique."
 PRC_manpads_3: "Igla"
 PRC_manpads_3_short: "Igla"
 PRC_manpads_3_desc: "L'Igla est un système MANPAD amélioré développé par KBM en 1981. L'Igla utilise un système de guidage infrarouge à double bande d'ondes et dispose d'un système de détonation de fusible magnétique à impact retardé. Le missile était également équipé d'un aérospike pour réduire la traînée et améliorer les performances. L'arme a été témoin de nombreux conflits généraux au Moyen-Orient mais aussi des guerres de Yougoslavie."
 PRC_manpads_4: "Verbe"
 PRC_manpads_4_short: "Verbe"
 PRC_manpads_4_desc: "Le Verba est un système MANPAD russe moderne créé en 2011. Il utilise un système de guidage optique à 3 canaux avec un plafond de vol exceptionnel de 5 km et une très longue portée. L'arme est également livrée avec une ogive moderne et plus puissante. L'arme elle-même est très difficile à tromper avec les systèmes de contre-mesures en raison des 3 canaux qu'elle possède dans chaque missile nécessitant l'utilisation de contre-mesures de haute qualité. Le Verba est utilisé par les Arméniens, les Russes et les Syriens mais n'a jusqu'à présent été combattu qu'en Syrie."

 PRC_protection_equip_1: "Bavoir en acier"
 PRC_protection_equip_1_short: "Bavoir en acier"
 PRC_protection_equip_1_desc: "La bavette en acier est un modèle extrêmement ancien d'équipement de protection d'infanterie basé sur la cuirasse en acier et a été fabriquée pendant la Première Guerre mondiale. Les cuirasses elles-mêmes ont été mises en oeuvre vers 1942 et les résultats de leur utilisation au combat ont été mitigés. Les cuirasses elles-mêmes fonctionnaient dans des environnements urbains à forte densité d'infanterie, mais étaient lourdes sur le terrain."
 PRC_protection_equip_2: "SN+SSh40"
 PRC_protection_equip_2_short: "SN+SSh40"
 PRC_protection_equip_2_desc: "Les gilets pare-balles SN et les casques SSh40 ont été développés vers la fin de la Seconde Guerre mondiale. Les casques eux-mêmes étaient plus robustes que leurs versions précédentes."
 PRC_protection_equip_3: "6B5-15+STSh-81"
 PRC_protection_equip_3_short: "6B5-15+STSh-81"
 PRC_protection_equip_3_desc: "Le gilet 6B5-15 a été développé par l'institut de recherche soviétique Stali et produit de 1986 à 1998. Le gilet lui-même utilisait des matériaux en kevlar pour protéger l'utilisateur et était livré avec une série de camouflages multicam. Les casques STSh-81 sont des casques en titane et en acier également produits par Stali pour l'Union soviétique. Les casques STSh-81 ont démontré une résistance considérable au combat."
 PRC_protection_equip_4: "6B7"
 PRC_protection_equip_4_short: "6B7"
 PRC_protection_equip_4_desc: "Au fil du temps, le blindage balistique 6B5-15 devra être doté de harnais et de composants accessoires plus nombreux et améliorés. Stali a entrepris de créer un ensemble complet d'équipements modernes pour la plupart des environnements du monde, qui pourraient être fabriqués à volonté par l'Union soviétique. Les casques 6B7 étaient une version améliorée des casques STSh-81 et succédaient à leur ancien design. Stali les a fabriqués avec des matériaux plus modernes, tels qu'une structure interne en acier améliorée, capable de dévier plus efficacement la force provenant des balles."
 PRC_protection_equip_5: "6B45+6B47"
 PRC_protection_equip_5_short: "6B45+6B47"
 PRC_protection_equip_5_desc: "Techinkom a développé les gilets 6B5 et l'équipement d'infanterie au début des années 2000 pour répondre aux besoins du combat moderne. Ils étaient plus maniables, durables et efficaces qu'auparavant. Ils étaient dotés d'un placage moderne absorbant les chocs, d'une doublure résistante aux intempéries et à l'humidité et pouvaient facilement donner à n'importe quel soldat un avantage considérable dans les combats d'infanterie. Le casque 6B47 et ses fixations d'équipement offrent une plus grande protection à ses porteurs qu'auparavant offrant une plus grande protection."
 
 
 
 ##########ISR Tree
 ISR_team_weapons_1: "M1919 Browning (HMG), mortier M1 (mortier)"
 ISR_team_weapons_1_short: "M1919 Browning, mortier M1"
 ISR_team_weapons_1_desc: "La M1919 Browning est une mitrailleuse lourde développée en 1919 par John Browning. L'arme est devenue emblématique après sa célèbre utilisation pendant la Grande Guerre d'émeu, mais elle a également été utilisée pendant la Seconde Guerre mondiale. L'arme utilise des cartouches de calibre.30, a une action opérationnelle à recul court et a une portée effective de 1 500 mètres. Son prédécesseur, le M1917, était refroidi par eau mais le refroidissement par eau a été supprimé pour alléger l'arme au détriment du temps de tir. Cela s'est avéré dangereux car en cas de surchauffe, le propulseur pouvait chauffer et provoquer des tirs sans avertissement, ce qui conduirait à un incendie incontrôlable./nLe mortier M1 est une variante du mortier français Brandt créé par les États-Unis à l'approche de leur adhésion initiale à la Seconde Guerre mondiale. Il tire un mortier de calibre 81 mm jusqu'à 1,9 milles. Il a été largement utilisé pendant la Seconde Guerre mondiale et a également été utilisé au Vietnam et en Corée."
 ISR_team_weapons_2: "M2 Browning (HMG), M29 Mortier (Mortier), M75 (HGL)"
 ISR_team_weapons_2_short: "M2 Browning, M29 Mortier, M75"
 ISR_team_weapons_2_desc: "Le M2 Browning est un HMG généralement monté sur des véhicules, mais qui peut également être utilisé comme canon embarqué. Il tire des obus de calibre.50 et possède une puissance de feu bien supérieure à celle du M1919. Il a été conçu en 1919 par John Browning et utilisé tout au long de la Seconde Guerre mondiale. Il est similaire en complexité et en qualité au M1919 mais il est plus lourd et transporte des munitions plus lourdes./nLe mortier M29 est un mortier américain construit pour remplacer le mortier M1 en 1952 par une équipe ad hoc. Il peut tirer de 4 à 12 coups par minute, est beaucoup plus léger et a une plus grande portée. De plus, il est chromé pour améliorer la fiabilité de l'arme et améliorer le nettoyage./nLe M75 HGL est un lance-grenades lourd conçu par Philco-Ford en 1961 et utilisé pendant la guerre du Vietnam. Il est automatique et entraîné par un moteur électrique avec une cadence de tir de 225 par minute jusqu'à 2 045 mètres de distance. Le lanceur lui-même a été très rapidement remplacé en raison d'un certain nombre de problèmes de fiabilité, d'efficacité énergétique et de poids."
 ISR_team_weapons_3: "Mk19 (HGL)"
 ISR_team_weapons_3_short: "Mk19"
 ISR_team_weapons_3_desc: "Le Mk19 est un lance-grenades lourd à action explosive utilisé dans les emplacements ou sur les véhicules. Il a été conçu en 1966 par NOSL et a été utilisé au Vietnam, pendant la guerre du Golfe, en Afghanistan, en Irak et lors de la guerre contre la drogue au Mexique. Le premier modèle du HGL était extrêmement peu fiable et dangereux, mais les modèles ultérieurs se sont révélés très efficaces et plus susceptibles de tuer l'ennemi que l'opérateur. L'arme peut tirer 40 obus de 40 mm par minute jusqu'à 1 600 mètres de distance."
 ISR_team_weapons_4: "M85 (HMG), mortier M224 (mortier)"
 ISR_team_weapons_4_short: "Mortier M85, M224"
 ISR_team_weapons_4_desc: "La M85 est une mitrailleuse capiteuse conçue dans les années 80 par General Electric pour remplacer la M2 Browning. Il a été utilisé pendant la guerre du Golfe, mais n'a pas connu beaucoup de combats en dehors de cela. Le poids du M2 Browning a finalement conduit à la commande du développement du M85 par l'armée américaine. Le M85 est beaucoup plus léger et possède des cadences de tir sélectives. Il est également configurable quant aux pièces qu'il peut contenir ou dans quelle direction il peut être alimenté, ce qui ajoute à sa polyvalence./nLe mortier M224 a été conçu en 1978 par une équipe ad hoc. Le mortier a participé à des combats pendant la guerre du Golfe, en Irak, en Afghanistan et des prototypes ont été utilisés au Vietnam. Le mortier lui-même était composé de pièces plus légères et plus durables que le M29 et est plus facile à entretenir sur le terrain."
 ISR_team_weapons_5: "XM312 (HMG), XM307 (HGL)"
 ISR_team_weapons_5_short: "XM312, XM307"
 ISR_team_weapons_5_desc: "Le XM312 HMG est dérivé du canon automatique XM307 et est chambré pour des obus de calibre.50. Le canon automatique XM307 est un HGL automatique doté d'une capacité d'explosion aérienne. Le XM307 a été conçu à la fin des années 90 et le XM312 est sorti en 2000. Tous deux ont été créés par General Dynamics et n'ont pas encore combattu. Les deux peuvent être rapidement convertis l'un en l'autre sur le terrain, permettant à une unité de passer aux HMG ou aux HGL selon les besoins de la situation actuelle. Ils sont légers (pour les armes lourdes mises en place) et fiables bien que coûteux. "

 ISR_squad_weapons_1: "Barre Browning 1918A2 (LMG)"
 ISR_squad_weapons_1_short: "Brunissement 1918A2"
 ISR_squad_weapons_1_desc: "Le Browning 1918A2 (alias BAR) doit son nom à la personne qui l'a conçu en 1917 pour l'armée américaine, le designer John Browning, et non à ce qui arrive au pantalon de l'ennemi lorsqu'il le voit. L'arme elle-même est un LMG de tir d'appui qui utilise un verrou à pêne montant et une action à gaz. Il a une portée effective de 1 500 mètres et un poids exceptionnellement léger, même pour un LMG. Le BAR a été largement utilisé pendant la Seconde Guerre mondiale, où il a démontré des capacités remarquables."
 ISR_squad_weapons_2: "FN Mag (LMG)"
 ISR_squad_weapons_2_short: "FN Mag"
 ISR_squad_weapons_2_desc: ""
 ISR_squad_weapons_3: "M60 (LMG)"
 ISR_squad_weapons_3_short: "M60"
 ISR_squad_weapons_3_desc: "Le M60 est un LMG développé pour l'armée américaine en 1957 par Saco Defence. Il peut tirer des balles, des balles traçantes et des balles perforantes. Le LMG utilise un piston à gaz à course courte et un mécanisme à boulon ouvert. Le système d'alimentation est une bande désintégrante et a une portée efficace de 1 200 mètres. Son utilisation est très peu coûteuse et est encore utilisé par l'armée américaine à ce jour en raison de son faible coût et de sa grande viabilité au combat. Cependant, il n'est pas fiable dans des conditions extrêmes, notamment lorsqu'il est sale. De plus, il est exceptionnellement lourd pour un LMG, bien qu'il soit l'un des canons de 7,62 mm les plus légers qui existent. Il a été témoin de combats au Vietnam, au Cambodge, pendant la guerre du Golfe, en Irak, en Afghanistan et contre l'Etat islamique. "
 ISR_squad_weapons_4: "M249 (LMG), M32 (GL)"
 ISR_squad_weapons_4_short: "M249, M32"
 ISR_squad_weapons_4_desc: "Le M249 est un LMG conçu par FN Herstal en 1976. Il est considérablement plus léger et plus fiable que le M60 mais possède une puissance de feu globale moindre. Le M249 a été utilisé dans tous les conflits majeurs impliquant les États-Unis depuis l'invasion du Panama. En raison de son poids plus léger et de sa fiabilité supérieure, il fonctionne mieux que le M60 dans des environnements contrôlés non urbains et fonctionne mieux comme arme d'escouade offensive. En fait, le M249 a été initialement commandé pour remplacer le M60 en tant qu'arme plus légère./nLe lance-grenades M32 est une variante américaine du lance-grenades à revolver d'escouade, le Milkor MGL. Le Milkor a été développé en 1980 par Andries Piek pour l'Afrique du Sud et constitue une avancée notable en tant que lance-grenades d'escouade par rapport au M79. Le Corps des Marines des États-Unis l'a adopté et a apporté des modifications mineures pour créer la variante M32. Il peut être chargé pour contenir jusqu'à 6 coups et les tirer rapidement en 2 secondes. Il peut augmenter considérablement la puissance de feu d'une escouade grâce à sa capacité d'éclatement. De plus, le lanceur a été adopté par les forces de l'ordre du monde entier pour être utilisé avec des grenades non mortelles telles que des fumigènes. Il a été utilisé pendant la guerre civile rwandaise et le conflit colombien."
 ISR_squad_weapons_5: "IMI Néguev (LMG)"
 ISR_squad_weapons_5_short: "IMI Néguev"
 ISR_squad_weapons_5_desc: "L'IWI Negev est une mitrailleuse à feu sélectif fonctionnant au gaz qui utilise les gaz propulseurs du canon pour faire fonctionner un système de fonctionnement à piston à gaz à courte course sous le canon et un mécanisme de verrouillage à boulon rotatif. L'arme a été mise en service en 1997 et a été utilisée dans tous les conflits auxquels Tsahal a participé"

 ISR_specialist_1: "M1903 Springfield (SR)"
 ISR_specialist_1_short: "M1903 Springfield"
 ISR_specialist_1_desc: "Le M1903 Springfield est un fusil à verrou utilisé par les tireurs d'élite pendant la Seconde Guerre mondiale. Il a été conçu par le Springfield Armory en 1903 et a été utilisé immédiatement. Le Springfield est un fusil à verrou à 5 cartouches qui tire efficacement des cartouches.30-06 jusqu'à 1 000 mètres. Cependant, la portée maximale va jusqu'à 5 500 mètres. Plus de 3 millions de ces fusils ont été produits et les tireurs d'élite les ont fréquemment utilisés pendant la Seconde Guerre mondiale."
 ISR_specialist_2: "M40 (SR)"
 ISR_specialist_2_short: "M40"
 ISR_specialist_2_desc: "Le M40 est un fusil de précision à verrou développé en 1966 par Remington Arms pour l'USMC. Il tire les obus standard de 7,62 x 51 mm et a une portée effective de 900 mètres. Il a été utilisé au Vietnam, pendant la guerre du Golfe, en Afghanistan, en Irak et au Liban. Le M40 présente une fiabilité remarquable et est relativement facile à entretenir. Il était efficace comme fusil de précision anti-infanterie."
 ISR_specialist_3: "M21 (SR)"
 ISR_specialist_3_short: "M21"
 ISR_specialist_3_desc: "Le M21 est l'une des armes les plus sexy jamais créées. Le M21 est un fusil de précision semi-automatique qui a été utilisé par les États-Unis et tous les autres pays ayant la chance de posséder une arme aussi magnifique. Conçu en 1969 par le Marines Weapons Command après avoir été directement inspiré par Dieu, il peut délivrer un jugement ultime à une portée effective de 900 mètres et utilise les glorieuses munitions de 7,62 x 51 mm. Il peut être alimenté avec un chargeur de 5, 10 ou 20 coups selon vos goûts. Il a fait preuve de sa vigueur et de ses prouesses incomparables lors des guerres du Vietnam et de l'Irak et aurait probablement gagné la guerre du Vietnam s'ils en avaient envoyé davantage. Il n'est pas surprenant qu'une arme légendaire aussi incroyable soit toujours utilisée et donne des coups de pied aujourd'hui."
 ISR_specialist_4: "Barrett M82 (AMR), M24 (SR)"
 ISR_specialist_4_short: "M82, M24"
 ISR_specialist_4_desc: "Le Barrett M82 est un fusil de précision bullpup anti-matériel semi-automatique qui utilise des munitions de calibre.50. Il a été développé en 1980 par Ronnie Barrett, à temps pour la guerre en Afghanistan et la guerre en Irak. Il a une portée effective de 2 000 mètres et peut pénétrer les murs, tout type de gilet pare-balles et les véhicules légèrement blindés. Le M82 est emblématique pour son efficacité et sa capacité anti-matériel. Sa licence est très recherchée par de nombreux pays et est détenue par 54 pays, et d'autres tentent d'obtenir des droits de fabrication ou d'acquérir l'arme./nLe M24 est un fusil de précision à verrou utilisé par l'armée américaine. Il a été conçu en 1988 par Remington Arms et commandé pour remplacer le M40 en tant que fusil de précision standard utilisé. Il a une portée effective de 875 mètres et utilise des munitions de 7,62 x 51 mm. Il a été témoin de combats lors de la guerre du Golfe, en Afghanistan, en Irak et en Syrie. Le M24 est livré avec une lunette amovible gratuite et un trépied amovible."
 ISR_specialist_5: "M110 (SR)"
 ISR_specialist_5_short: "M110"
 ISR_specialist_5_desc: "Le M110 est un fusil de précision antipersonnel à boulon rotatif semi-automatique et DMR. Il a été initialement développé en 2007 par la Knight's Armament Company et a été mis en service après que l'armée américaine ait été témoin des effets des tireurs d'élite de l'USSOCOM et des rapports après action des tireurs d'élite des SOF dans tout l'Irak. Après un concours impliquant de nombreux modèles différents, le M110 a été sélectionné et Knights a remporté un contrat très important. Depuis, il a été utilisé en Afghanistan et en Irak. Il a une portée effective d'environ 875 mètres et peut fournir des tirs de harcèlement bien au-delà."

 ISR_ammo_explosives_1: "Grenade Mk2 (Grenade), FMJ (Munitions), Mine chimique M1 (Mine)"
 ISR_ammo_explosives_1_short: "Grenade Mk2, FMJ, mine chimique M1"
 ISR_ammo_explosives_1_desc: "La grenade à main MK2 est une grenade à main antipersonnel utilisée par les États-Unis pendant la Seconde Guerre mondiale et la Première Guerre mondiale. Elle a été conçue en 1918 par une grande équipe ad hoc de concepteurs et a été utilisée par de nombreux pays différents. La grenade elle-même est une simple grenade frangible qui explose sur une mèche temporisée environ 4 secondes après avoir tiré sur la goupille. Un excédent excessif a été créé pendant la Seconde Guerre mondiale et, en tant que tel, malgré une production minime, voire inexistante, il a été utilisé de manière continue pendant de nombreuses années./nLa mine chimique M1 est une mine antipersonnel qui contient du gaz moutarde qui se libère lors de la détonation. Elle a été utilisée pendant la Seconde Guerre mondiale et pouvait maintenir l'interdiction de zone après la détonation aussi longtemps que le gaz persistait./nLa balle Full Metal Jacket est une balle inventée en 1882 par le colonel suisse Eduard Rubin. Cependant, des améliorations ont été apportées à la métallurgie depuis la Seconde Guerre mondiale et, en tant que tel, la ronde FMJ de la Seconde Guerre mondiale a simplement incorporé des matériaux de meilleure qualité dans la conception déjà existante."
 ISR_ammo_explosives_2: "M26 (Grenade), M18 Claymore (Mine)"
 ISR_ammo_explosives_2_short: "M26, M18 Claymore "
 ISR_ammo_explosives_2_desc: "La grenade à main M26 est une grenade à main frangible conçue par une grande équipe ad hoc en 1950. Elle est entrée en service et a en même temps participé pour la première fois au combat pendant la guerre de Corée. Elle comportait un fusible à friction temporisé et une capacité explosive supérieure à celle de la grenade Mk2. De plus, la fragmentation est facilitée par une bobine pré-encochée à l'intérieur de la grenade qui facilite la fragmentation./nLa mine Claymore M18 est une mine antipersonnel à fragmentation directionnelle développée en 1956 par une grande équipe ad hoc dirigée par Norman Macleod. Il a été utilisé pendant la guerre du Vietnam, a été installé dans la KDMZ et dans la guerre en Irak. Il utilise un capuchon en plastique M4 pour exploser et est rempli de C4."
 ISR_ammo_explosives_3: "Munitions à grain supérieur (munitions), grenade M67 (grenade)"
 ISR_ammo_explosives_3_short: "Munitions à grain supérieur, grenade M67"
 ISR_ammo_explosives_3_desc: "La grenade à main M67 est une grenade à main antipersonnel à fragmentation conçue pour remplacer la série M26 utilisée au Vietnam et en Corée. Il contient un retard pyrotechnique et possède une capacité explosive supérieure à celle du M26. Il comporte également un clip de sécurité pour éviter que la goupille ne soit tirée accidentellement. Il a été utilisé dans toutes les guerres américaines depuis le Vietnam. Les obus/NAP existent depuis de nombreuses années avant la Première Guerre mondiale et sont principalement utilisés dans la pénétration des navires de guerre. Autour de la Première Guerre mondiale, après l'entrée du char sur le champ de bataille, des obus miniaturisés ont été créés. Finalement, de petits calibres AP ont été créés en réponse aux gilets pare-balles. Les munitions AP modernes ont été créées en 1965 pour répondre à l'augmentation de l'infanterie lourdement blindée et de la couverture d'infanterie. "
 ISR_ammo_explosives_4: "Grenades utilitaires (Grenade), Mine M93 AT (Mine)"
 ISR_ammo_explosives_4_short: "Grenades utilitaires, mines anti-M93"
 ISR_ammo_explosives_4_desc: "Les grenades utilitaires sont des grenades à main qui ont des rôles spécialisés tels que des flashbangs, des fumigènes, des incendiaires, etc. Elles peuvent être utilisées respectivement pour étourdir les ennemis, dissimuler des positions et interdire la zone./nLes mines M93 sont des mines antichar développées par Textron en 1987. Elles sont capables d'attaquer des cibles jusqu'à 100 mètres de leur position. Les mines M93 utilisent des capteurs sismiques et acoustiques pour suivre et identifier les cibles à proximité. Une fois qu'il détecte une cible, il se retourne pour lui faire face et tire sa sous-munition, une balle de tantale de 450 g."
 ISR_ammo_explosives_5: "Cartouches modernes (munitions)"
 ISR_ammo_explosives_5_short: "Rondes modernes"
 ISR_ammo_explosives_5_desc: "À l'ère moderne, il existe un vaste arsenal de différents types de munitions spécialisées pouvant être utilisées dans des situations spécifiques. Les obus AP modernes sont bien meilleurs pour pénétrer les cibles que les obus AP plus anciens et peuvent atteindre des vitesses plus élevées. Les alliages modernes permettent aux munitions standard d'infliger plus de dégâts à une cible. Les balles frangibles ou les cartouches incendiaires ont des situations particulières dans lesquelles elles sont utiles. De plus, les fusils de chasse peuvent avoir une utilisation améliorée dans les combats modernes avec des cartouches HE, des munitions 000, des cartouches à fléchettes ou des tirs incendiaires."

 ISR_manpats_1: "M1 Bazooka"
 ISR_manpats_1_short: "M1 Bazooka"
 ISR_manpats_1_desc: "Le M1 Bazooka est une fusée antichar sans recul développée en 1942 par Edward Uhl. Plus de 400 000 unités ont été créées et ont été utilisées massivement pendant la Seconde Guerre mondiale, en Corée et au Vietnam. Le M1 Bazooka est l'une des premières armes antichar propulsées par fusée. Il pourrait être utilisé contre des bunkers, des véhicules blindés, des nids de mitrailleuses ou des chars. Certaines copies du M1 ont été capturées par les forces allemandes rapidement après avoir été déployées et ont fait l'objet d'une ingénierie inverse pour créer le Panzerschreck. Le M1 coûte très peu et d'énormes quantités de munitions excédentaires ont été créées. Il a donc été utilisé dans les guerres futures et est encore utilisé aujourd'hui par les armées à petit budget. Au rythme actuel d'utilisation, l'arme continuera probablement à être combattue par des armées à petit budget. Cependant, avec le développement mondial entraînant une augmentation du nombre de PRI dédiés et les conflits actuels qui les épuisent, il est peu probable que cela se produise avant très longtemps."
 ISR_manpats_2: "M20A1 SuperBazooka"
 ISR_manpats_2_short: "M20A1 SuperBazooka"
 ISR_manpats_2_desc: "Le superbazooka M20A1 est la synthèse d'un grand nombre d'améliorations apportées au Bazooka par Edward Uhl tout au long de la guerre jusqu'au milieu des années 50. Il comportait des moulages légers, un support d'emplacement auxiliaire, un viseur optique, une portée étendue grâce à une munition améliorée, un mécanisme de couplage amélioré, une gâchette magnétique remplaçant l'allumage de la batterie, des meubles en métal et peut être démonté pour faciliter la mobilité et l'entretien. Les améliorations en ont fait une arme beaucoup plus performante que le M1, qui pourrait être utilisée contre des cibles plus puissantes. Il a été utilisé pendant la guerre de Corée et dans de nombreux autres conflits par d'autres pays."
 ISR_manpats_3: "LOI M72"
 ISR_manpats_3_short: "LOI M72"
 ISR_manpats_3_desc: "Le M72 LAW est un lance-roquettes antichar non guidé léger à un coup développé par FA Spinale, CB Weeks et PV Choate en 1963. Il a été introduit immédiatement pour remplacer le bazooka en production et a été combattu dans tous les conflits américains depuis sa création. L'arme elle-même est très légère et permet à l'infanterie régulière de la transporter et de l'utiliser partout où elle est nécessaire. Il n'est pas rechargeable mais ne pèse que 5,5 livres, donc même votre grand-mère pourrait l'utiliser. Sa portée effective est de 660 pieds. L'arme a été utilisée dans la guerre en Afghanistan, en Irak, en Somalie, dans la guerre du Golfe et au Vietnam."
 ISR_manpats_4: "ÉCLAIR M202"
 ISR_manpats_4_short: "ÉCLAIR M202"
 ISR_manpats_4_desc: "Le M202 FLASH est un lance-roquettes incendiaire multi-coups conçu en 1978 par une grande équipe ad hoc et utilisé dans la guerre du Vietnam. Il peut être chargé de roquettes incendiaires de 66 mm utilisant le TPA pour enflammer une zone après une explosion. Il peut brûler beaucoup plus chaud que le napalm et crée suffisamment de chaleur et de fumée pour forcer les hélicoptères volant à basse altitude à éviter une zone. Il peut être utilisé comme arme antichar en raison de l'énorme chaleur qu'il crée sur une vaste zone, rôtissant efficacement l'équipage d'un véhicule. Alternativement, le M202 peut utiliser les roquettes de 66 mm du LAW si l'opérateur en a besoin pour utiliser des roquettes directes plutôt que de couvrir une zone de feu. Il n'a pas été officiellement produit à grande échelle, bien que plusieurs centaines de prototypes aient été fabriqués et utilisés au Vietnam. "
 ISR_manpats_5: "M141/153 PETIT"
 ISR_manpats_5_short: "M141/153 PETIT"
 ISR_manpats_5_desc: "Le M153 SMAW est un lance-roquettes antichar et anti-fortification développé en 1984 par McDonnell Douglas. Cette arme a été utilisée lors de la guerre du Golfe, en Afghanistan, en Irak et au Yémen. Le M141 est une arme anti-fortification jetable à un coup dédiée à la destruction des bunkers. Elle a une portée effective de 1 200 mètres mais peut être utilisée pour atteindre de grandes cibles plus loin. Le M153 est une arme réutilisable qui tire des cartouches HEAA ou thermobariques. Le SMAW peut effondrer des bâtiments et possède un très grand rayon d'explosion. Cependant, il dégage une grande quantité de fumée semi-toxique, ce qui rend son tir à partir d'un espace clos dangereux sans protection contre les gaz. Ce problème ne sera pas résolu tant que le SMAW II ne sera pas développé. Il a été témoin de combats lors de la guerre du Golfe, en Afghanistan et en Irak."

 ISR_hmg_1: "M45 Quadmount"
 ISR_hmg_1_short: "M45 Quadmount"
 ISR_hmg_1_desc: "Le M45 Quadmount est une arme anti-aérienne remorquée dotée d'une cadence de tir exceptionnelle grâce à ses 4 mitrailleuses browning M2. Il est alimenté électriquement et a une portée maximale de 1,6 miles. Il a été développé par la WL Maxson Corporation en 1943 et a été utilisé pendant la Seconde Guerre mondiale, la guerre de Corée et comme emplacement pendant la guerre du Vietnam. Surnommé le « hachoir à viande », il pouvait être utilisé horizontalement pour éliminer de manière interchangeable des cibles souples et des avions. Le M45 était également monté sur des remorques ou des half-tracks pour être utilisé comme canon SP AA bon marché. "
 ISR_manpads_1: "Yeux rouges I"
 ISR_manpads_1_short: "Yeux rouges I"
 ISR_manpads_1_desc: "Le Redeye est un MANPADS anti-aérien créé en 1959 par Convair pour s'adapter aux combats modernes où les avions à réaction pouvaient distancer ou surpasser les canons anti-aériens. Il utilise l'infrarouge pour atteindre sa cible. En 1948, l'armée américaine commença à chercher de nouvelles armes de défense aérienne pour remplacer les canons inefficaces. De nombreux concepts différents de fusées rapides ont été étudiés, mais aucun n'était finalement précis. Au milieu des années 1950, Convair a commencé à étudier l'utilisation du guidage infrarouge pour créer un système de missile sol-air portable. Convair a commencé à étudier les premiers missiles air-air pour créer son arme et a réussi à la réduire à un niveau plus petit. Le Redeye a été utilisé au Vietnam, au Nicaragua et en Afghanistan."
 ISR_manpads_2: "Yeux rouges II"
 ISR_manpads_2_short: "Yeux rouges II"
 ISR_manpads_2_desc: "Le Redeye II est un MANPADS anti-aérien développé par General Dynamics en 1967. Il utilise un missile surface-air infrarouge pour se diriger vers sa cible. Il comportait un ordinateur haut de gamme et des améliorations générales des pièces et de la conception globale pour le rendre plus fiable. Bien que le Redeye II soit une amélioration par rapport au Redeye I, il n'a pas été largement fabriqué et est resté un prototype car la plupart de ses améliorations pouvaient simplement être ajoutées au Redeye I. On peut considérer que développer le Redeye II dans ce contexte améliore l'ordinateur du Redeye I et fabrique le meilleur équipement."
 ISR_manpads_3: "Stinger A"
 ISR_manpads_3_short: "Stinger A"
 ISR_manpads_3_desc: "Le Stinger A est le résultat final du projet Redeye II achevé en 1980 par General Dynamics. Le Stinger A présente une refonte complète de l'ensemble du système Redeye et est livré avec un double chercheur infrarouge et UV pour mieux déterminer ce qu'est une contre-mesure et quelle est la cible réelle. Les munitions du Stinger A contiennent un mélange plus puissant qui lui confère plus de puissance que son prédécesseur et peut atteindre une plus grande portée. Elle a démontré une puissance considérable dans la guerre des Malouines, en Afghanistan, dans la guerre irano-irakienne et dans de nombreux autres conflits du Moyen-Orient."
 ISR_manpads_4: "Stinger C"
 ISR_manpads_4_short: "Stinger C"
 ISR_manpads_4_desc: "Le Stinger C est une amélioration apportée au Stinger B terminé vers 1990 par General Dynamics. Le Stinger B était doté d'un autodirecteur amélioré doté d'un balayage en rosette. Cependant, la Stinger B n'a été produite qu'à peine à 600 exemplaires. Le Stinger C a ajouté davantage de composants informatiques, de meilleurs logiciels et un système adaptatif capable de tenter de surmonter les interférences en ajustant ses modules pour tenter de trouver le visuel le plus clair. Plus de 20 000 unités ont été créées et ont combattu en Afghanistan et en Irak. Le projet Stinger continue de se développer avec de nouveaux ajouts mineurs et de nouvelles variantes désignées comme améliorations mineures."
 
 ##########USA Tree
 USA_team_weapons_1: "M1919 Browning (HMG), mortier M1 (mortier)"
 USA_team_weapons_1_short: "M1919 Browning, mortier M1"
 USA_team_weapons_1_desc: "La M1919 Browning est une mitrailleuse lourde développée en 1919 par John Browning. L'arme est devenue emblématique après sa célèbre utilisation pendant la Grande Guerre d'émeu, mais elle a également été utilisée pendant la Seconde Guerre mondiale. L'arme utilise des cartouches de calibre.30, a une action opérationnelle à recul court et a une portée effective de 1 500 mètres. Son prédécesseur, le M1917, était refroidi par eau mais le refroidissement par eau a été supprimé pour alléger l'arme au détriment du temps de tir. Cela s'est avéré dangereux car en cas de surchauffe, le propulseur pouvait chauffer et provoquer des tirs sans avertissement, ce qui conduirait à un incendie incontrôlable./nLe mortier M1 est une variante du mortier français Brandt créé par les États-Unis à l'approche de leur adhésion initiale à la Seconde Guerre mondiale. Il tire un mortier de calibre 81 mm jusqu'à 1,9 milles. Il a été largement utilisé pendant la Seconde Guerre mondiale et a également été utilisé au Vietnam et en Corée."
 USA_team_weapons_2: "M2 Browning (HMG), mortier M29 (mortier), M75 (HGL)"
 USA_team_weapons_2_short: "M2 Browning, M29 Mortier, M75"
 USA_team_weapons_2_desc: "Le M2 Browning est un HMG généralement monté sur des véhicules, mais qui peut également être utilisé comme canon embarqué. Il tire des obus de calibre.50 et possède une puissance de feu bien supérieure à celle du M1919. Il a été conçu en 1919 par John Browning et utilisé tout au long de la Seconde Guerre mondiale. Il est similaire en complexité et en qualité au M1919 mais il est plus lourd et transporte des munitions plus lourdes./nLe mortier M29 est un mortier américain construit pour remplacer le mortier M1 en 1952 par une équipe ad hoc. Il peut tirer de 4 à 12 coups par minute, est beaucoup plus léger et a une plus grande portée. De plus, il est chromé pour améliorer la fiabilité de l'arme et améliorer le nettoyage./nLe M75 HGL est un lance-grenades lourd conçu par Philco-Ford en 1961 et utilisé pendant la guerre du Vietnam. Il est automatique et entraîné par un moteur électrique avec une cadence de tir de 225 par minute jusqu'à 2 045 mètres de distance. Le lanceur lui-même a été très rapidement remplacé en raison d'un certain nombre de problèmes de fiabilité, d'efficacité énergétique et de poids."
 USA_team_weapons_3: "Mk19 (HGL)"
 USA_team_weapons_3_short: "Mk19"
 USA_team_weapons_3_desc: "Le Mk19 est un lance-grenades lourd à action explosive utilisé dans les emplacements ou sur les véhicules. Il a été conçu en 1966 par NOSL et a été utilisé au Vietnam, pendant la guerre du Golfe, en Afghanistan, en Irak et lors de la guerre contre la drogue au Mexique. Le premier modèle du HGL était extrêmement peu fiable et dangereux, mais les modèles ultérieurs se sont révélés très efficaces et plus susceptibles de tuer l'ennemi que l'opérateur. L'arme peut tirer 40 obus de 40 mm par minute jusqu'à 1 600 mètres de distance."
 USA_team_weapons_4: "M85 (HMG), mortier M224 (mortier)"
 USA_team_weapons_4_short: "Mortier M85, M224"
 USA_team_weapons_4_desc: "La M85 est une mitrailleuse capiteuse conçue dans les années 80 par General Electric pour remplacer la M2 Browning. Il a été utilisé pendant la guerre du Golfe, mais n'a pas connu beaucoup de combats en dehors de cela. Le poids du M2 Browning a finalement conduit à la commande du développement du M85 par l'armée américaine. Le M85 est beaucoup plus léger et possède des cadences de tir sélectives. Il est également configurable quant aux pièces qu'il peut contenir ou dans quelle direction il peut être alimenté, ce qui ajoute à sa polyvalence./nLe mortier M224 a été conçu en 1978 par une équipe ad hoc. Le mortier a participé à des combats pendant la guerre du Golfe, en Irak, en Afghanistan et des prototypes ont été utilisés au Vietnam. Le mortier lui-même était composé de pièces plus légères et plus durables que le M29 et est plus facile à entretenir sur le terrain."
 USA_team_weapons_5: "XM312 (HMG), XM307 (HGL)"
 USA_team_weapons_5_short: "XM312, XM307"
 USA_team_weapons_5_desc: "Le XM312 HMG est dérivé du canon automatique XM307 et est chambré pour des obus de calibre.50. Le canon automatique XM307 est un HGL automatique doté d'une capacité d'explosion aérienne. Le XM307 a été conçu à la fin des années 90 et le XM312 est sorti en 2000. Tous deux ont été créés par General Dynamics et n'ont pas encore combattu. Les deux peuvent être rapidement convertis l'un en l'autre sur le terrain, permettant à une unité de passer aux HMG ou aux HGL selon les besoins de la situation actuelle. Ils sont légers (pour les armes lourdes mises en place) et fiables bien que coûteux. "

 USA_squad_weapons_1: "Barre Browning 1918A2 (LMG)"
 USA_squad_weapons_1_short: "Brunissement 1918A2"
 USA_squad_weapons_1_desc: "Le Browning 1918A2 (alias BAR) doit son nom à la personne qui l'a conçu en 1917 pour l'armée américaine, le designer John Browning, et non à ce qui arrive au pantalon de l'ennemi lorsqu'il le voit. L'arme elle-même est un LMG de tir d'appui qui utilise un verrou à pêne montant et une action à gaz. Il a une portée effective de 1 500 mètres et un poids exceptionnellement léger, même pour un LMG. Le BAR a été largement utilisé pendant la Seconde Guerre mondiale, où il a démontré des capacités remarquables."
 USA_squad_weapons_2: "M79 (GL)"
 USA_squad_weapons_2_short: "M79"
 USA_squad_weapons_2_desc: "Le M79 est un lance-grenades à un coup développé en 1960 par le Springfield Armory pour l'armée américaine. Il s'agit d'un lance-grenades à un coup qui tire une grenade de 40 mm. Au cours de son utilisation pendant la guerre du Vietnam, il s'est montré doté d'une puissance de feu incroyable et d'un tir plus long que les grenades à fusil, mais il est plus portable qu'un mortier, ce qui lui permet de faciliter les engagements de combat de l'infanterie et de bien fonctionner contre les véhicules ennemis légers et les ennemis à couvert."
 USA_squad_weapons_3: "M60 (LMG)"
 USA_squad_weapons_3_short: "M60"
 USA_squad_weapons_3_desc: "Le M60 est un LMG développé pour l'armée américaine en 1957 par Saco Defence. Il peut tirer des balles, des balles traçantes et des balles perforantes. Le LMG utilise un piston à gaz à course courte et un mécanisme à boulon ouvert. Le système d'alimentation est une bande désintégrante et a une portée efficace de 1 200 mètres. Son utilisation est très peu coûteuse et est encore utilisé par l'armée américaine à ce jour en raison de son faible coût et de sa grande viabilité au combat. Cependant, il n'est pas fiable dans des conditions extrêmes, notamment lorsqu'il est sale. De plus, il est exceptionnellement lourd pour un LMG, bien qu'il soit l'un des canons de 7,62 mm les plus légers qui existent. Il a été témoin de combats au Vietnam, au Cambodge, pendant la guerre du Golfe, en Irak, en Afghanistan et contre l'Etat islamique. "
 USA_squad_weapons_4: "M249 (LMG), M32 (GL)"
 USA_squad_weapons_4_short: "M249, M32"
 USA_squad_weapons_4_desc: "Le M249 est un LMG conçu par FN Herstal en 1976. Il est considérablement plus léger et plus fiable que le M60 mais possède une puissance de feu globale moindre. Le M249 a été utilisé dans tous les conflits majeurs impliquant les États-Unis depuis l'invasion du Panama. En raison de son poids plus léger et de sa fiabilité supérieure, il fonctionne mieux que le M60 dans des environnements contrôlés non urbains et fonctionne mieux comme arme d'escouade offensive. En fait, le M249 a été initialement commandé pour remplacer le M60 en tant qu'arme plus légère./nLe lance-grenades M32 est une variante américaine du lance-grenades à revolver d'escouade, le Milkor MGL. Le Milkor a été développé en 1980 par Andries Piek pour l'Afrique du Sud et constitue une avancée notable en tant que lance-grenades d'escouade par rapport au M79. Le Corps des Marines des États-Unis l'a adopté et a apporté des modifications mineures pour créer la variante M32. Il peut être chargé pour contenir jusqu'à 6 coups et les tirer rapidement en 2 secondes. Il peut augmenter considérablement la puissance de feu d'une escouade grâce à sa capacité d'éclatement. De plus, le lanceur a été adopté par les forces de l'ordre du monde entier pour être utilisé avec des grenades non mortelles telles que des fumigènes. Il a été utilisé pendant la guerre civile rwandaise et le conflit colombien."
 USA_squad_weapons_5: "MK48 (LMG), XM25 (GL)"
 USA_squad_weapons_5_short: "MK48, XM25"
 USA_squad_weapons_5_desc: "Le MK48 est un LMG développé en 2003 par FN Herstal en collaboration avec le Commandement des opérations spéciales américain. Il est extrêmement léger pour un LMG et a été largement utilisé par les États-Unis lors de combats en Irak et en Afghanistan. L'arme elle-même est très facile à démonter et peut être réalisée sur le terrain pour remplacer les canons surchauffés. Son principal avantage par rapport au M249 est son poids léger et ses pièces beaucoup plus simplifiées, ce qui facilite la maintenance et la fabrication./nLe lance-grenades XM25 CDTE est un lance-grenades bullpup moderne développé en 2010 par Heckler et Koch et a été utilisé dans la guerre en Afghanistan. Il tire des grenades à partir d'un chargeur et est capable d'avoir une portée efficace allant jusqu'à 765 mètres. Il est doté d'une capacité d'explosion et de munitions programmables. Il est livré avec un ordinateur système et un télémètre laser pour aider l'opérateur. Les premiers prototypes ont souffert de nombreux dysfonctionnements et le budget du projet a finalement été réduit. Bien que nous ayons assisté à des combats en Afghanistan et démontré nos capacités, il a été décidé que le projet n'en valait pas la peine en raison de mauvaises perspectives quant à son coût."

 USA_specialist_1: "M1903 Springfield (SR)"
 USA_specialist_1_short: "M1903 Springfield"
 USA_specialist_1_desc: "Le M1903 Springfield est un fusil à verrou utilisé par les tireurs d'élite pendant la Seconde Guerre mondiale. Il a été conçu par le Springfield Armory en 1903 et a été utilisé immédiatement. Le Springfield est un fusil à verrou à 5 cartouches qui tire efficacement des cartouches.30-06 jusqu'à 1 000 mètres. Cependant, la portée maximale va jusqu'à 5 500 mètres. Plus de 3 millions de ces fusils ont été produits et les tireurs d'élite les ont fréquemment utilisés pendant la Seconde Guerre mondiale."
 USA_specialist_2: "M40 (SR)"
 USA_specialist_2_short: "M40"
 USA_specialist_2_desc: "Le M40 est un fusil de précision à verrou développé en 1966 par Remington Arms pour l'USMC. Il tire les obus standard de 7,62 x 51 mm et a une portée effective de 900 mètres. Il a été utilisé au Vietnam, pendant la guerre du Golfe, en Afghanistan, en Irak et au Liban. Le M40 présente une fiabilité remarquable et est relativement facile à entretenir. Il était efficace comme fusil de précision anti-infanterie."
 USA_specialist_3: "M21 (SR)"
 USA_specialist_3_short: "M21"
 USA_specialist_3_desc: "Le M21 est l'une des armes les plus sexy jamais créées. Le M21 est un fusil de précision semi-automatique qui a été utilisé par les États-Unis et tous les autres pays ayant la chance de posséder une arme aussi magnifique. Conçu en 1969 par le Marines Weapons Command après avoir été directement inspiré par Dieu, il peut délivrer un jugement ultime à une portée effective de 900 mètres et utilise les glorieuses munitions de 7,62 x 51 mm. Il peut être alimenté avec un chargeur de 5, 10 ou 20 coups selon vos goûts. Il a fait preuve de sa vigueur et de ses prouesses incomparables lors des guerres du Vietnam et de l'Irak et aurait probablement gagné la guerre du Vietnam s'ils en avaient envoyé davantage. Il n'est pas surprenant qu'une arme légendaire aussi incroyable soit toujours utilisée et donne des coups de pied aujourd'hui."
 USA_specialist_4: "Barrett M82 (AMR), M24 (SR)"
 USA_specialist_4_short: "M82, M24"
 USA_specialist_4_desc: "Le Barrett M82 est un fusil de précision bullpup anti-matériel semi-automatique qui utilise des munitions de calibre.50. Il a été développé en 1980 par Ronnie Barrett, à temps pour la guerre en Afghanistan et la guerre en Irak. Il a une portée effective de 2 000 mètres et peut pénétrer les murs, tout type de gilet pare-balles et les véhicules légèrement blindés. Le M82 est emblématique pour son efficacité et sa capacité anti-matériel. Sa licence est très recherchée par de nombreux pays et est détenue par 54 pays, et d'autres tentent d'obtenir des droits de fabrication ou d'acquérir l'arme./nLe M24 est un fusil de précision à verrou utilisé par l'armée américaine. Il a été conçu en 1988 par Remington Arms et commandé pour remplacer le M40 en tant que fusil de précision standard utilisé. Il a une portée effective de 875 mètres et utilise des munitions de 7,62 x 51 mm. Il a été témoin de combats lors de la guerre du Golfe, en Afghanistan, en Irak et en Syrie. Le M24 est livré avec une lunette amovible gratuite et un trépied amovible."
 USA_specialist_5: "M110 (SR)"
 USA_specialist_5_short: "M110"
 USA_specialist_5_desc: "Le M110 est un fusil de précision antipersonnel à boulon rotatif semi-automatique et DMR. Il a été initialement développé en 2007 par la Knight's Armament Company et a été mis en service après que l'armée américaine ait été témoin des effets des tireurs d'élite de l'USSOCOM et des rapports après action des tireurs d'élite des SOF dans tout l'Irak. Après un concours impliquant de nombreux modèles différents, le M110 a été sélectionné et Knights a remporté un contrat très important. Depuis, il a été utilisé en Afghanistan et en Irak. Il a une portée effective d'environ 875 mètres et peut fournir des tirs de harcèlement bien au-delà."

 USA_ammo_explosives_1: "Grenade Mk2 (Grenade), FMJ (Munitions), Mine chimique M1 (Mine)"
 USA_ammo_explosives_1_short: "Grenade Mk2, FMJ, mine chimique M1"
 USA_ammo_explosives_1_desc: "La grenade à main MK2 est une grenade à main antipersonnel utilisée par les États-Unis pendant la Seconde Guerre mondiale et la Première Guerre mondiale. Elle a été conçue en 1918 par une grande équipe ad hoc de concepteurs et a été utilisée par de nombreux pays différents. La grenade elle-même est une simple grenade frangible qui explose sur une mèche temporisée environ 4 secondes après avoir tiré sur la goupille. Un excédent excessif a été créé pendant la Seconde Guerre mondiale et, en tant que tel, malgré une production minime, voire inexistante, il a été utilisé de manière continue pendant de nombreuses années./nLa mine chimique M1 est une mine antipersonnel qui contient du gaz moutarde qui se libère lors de la détonation. Elle a été utilisée pendant la Seconde Guerre mondiale et pouvait maintenir l'interdiction de zone après la détonation aussi longtemps que le gaz persistait./nLa balle Full Metal Jacket est une balle inventée en 1882 par le colonel suisse Eduard Rubin. Cependant, des améliorations ont été apportées à la métallurgie depuis la Seconde Guerre mondiale et, en tant que tel, la ronde FMJ de la Seconde Guerre mondiale a simplement incorporé des matériaux de meilleure qualité dans la conception déjà existante."
 USA_ammo_explosives_2: "M26 (Grenade), M18 Claymore (Mine)"
 USA_ammo_explosives_2_short: "M26, M18 Claymore "
 USA_ammo_explosives_2_desc: "La grenade à main M26 est une grenade à main frangible conçue par une grande équipe ad hoc en 1950. Elle est entrée en service et a en même temps participé pour la première fois au combat pendant la guerre de Corée. Elle comportait un fusible à friction temporisé et une capacité explosive supérieure à celle de la grenade Mk2. De plus, la fragmentation est facilitée par une bobine pré-encochée à l'intérieur de la grenade qui facilite la fragmentation./nLa mine Claymore M18 est une mine antipersonnel à fragmentation directionnelle développée en 1956 par une grande équipe ad hoc dirigée par Norman Macleod. Il a été utilisé pendant la guerre du Vietnam, a été installé dans la zone KDMZ et pendant la guerre en Irak. Il utilise un capuchon en plastique M4 pour exploser et est rempli de C4."
 USA_ammo_explosives_3: "Munitions à grain supérieur, grenade M67"
 USA_ammo_explosives_3_short: "Munitions à grain supérieur (Munitions), Grenade M67 (Grenade)"
 USA_ammo_explosives_3_desc: "La grenade à main M67 est une grenade à main antipersonnel à fragmentation conçue pour remplacer la série M26 utilisée au Vietnam et en Corée. Il contient un retard pyrotechnique et possède une capacité explosive supérieure à celle du M26. Il comporte également un clip de sécurité pour éviter que la goupille ne soit tirée accidentellement. Il a été utilisé dans toutes les guerres américaines depuis le Vietnam. Les obus/NAP existent depuis de nombreuses années avant la Première Guerre mondiale et sont principalement utilisés dans la pénétration des navires de guerre. Autour de la Première Guerre mondiale, après l'entrée du char sur le champ de bataille, des obus miniaturisés ont été créés. Finalement, de petits calibres AP ont été créés en réponse aux gilets pare-balles. Les munitions AP modernes ont été créées en 1965 pour répondre à l'augmentation de l'infanterie lourdement blindée et de la couverture d'infanterie. "
 USA_ammo_explosives_4: "Grenades utilitaires (Grenade), Mine M93 AT (Mine)"
 USA_ammo_explosives_4_short: "Grenades utilitaires, mines anti-M93"
 USA_ammo_explosives_4_desc: "Les grenades utilitaires sont des grenades à main qui ont des rôles spécialisés tels que des flashbangs, des fumigènes, des incendiaires, etc. Elles peuvent être utilisées respectivement pour étourdir les ennemis, dissimuler des positions et interdire la zone./nLes mines M93 sont des mines antichar développées par Textron en 1987. Elles sont capables d'attaquer des cibles jusqu'à 100 mètres de leur position. Les mines M93 utilisent des capteurs sismiques et acoustiques pour suivre et identifier les cibles à proximité. Une fois qu'il détecte une cible, il se retourne pour lui faire face et tire sa sous-munition, une balle de tantale de 450 g."
 USA_ammo_explosives_5: "Cartouches modernes (munitions)"
 USA_ammo_explosives_5_short: "Rondes modernes"
 USA_ammo_explosives_5_desc: "À l'ère moderne, il existe un vaste arsenal de différents types de munitions spécialisées pouvant être utilisées dans des situations spécifiques. Les obus AP modernes sont bien meilleurs pour pénétrer les cibles que les obus AP plus anciens et peuvent atteindre des vitesses plus élevées. Les alliages modernes permettent aux munitions standard d'infliger plus de dégâts à une cible. Les balles frangibles ou les cartouches incendiaires ont des situations particulières dans lesquelles elles sont utiles. De plus, les fusils de chasse peuvent avoir une utilisation améliorée dans les combats modernes avec des cartouches HE, des munitions 000, des cartouches à fléchettes ou des tirs incendiaires."

 USA_manpats_1: "M1 Bazooka"
 USA_manpats_1_short: "M1 Bazooka"
 USA_manpats_1_desc: "Le M1 Bazooka est une fusée antichar sans recul développée en 1942 par Edward Uhl. Plus de 400 000 unités ont été créées et ont été utilisées massivement pendant la Seconde Guerre mondiale, en Corée et au Vietnam. Le M1 Bazooka est l'une des premières armes antichar propulsées par fusée. Il pourrait être utilisé contre des bunkers, des véhicules blindés, des nids de mitrailleuses ou des chars. Certaines copies du M1 ont été capturées par les forces allemandes rapidement après avoir été déployées et ont fait l'objet d'une ingénierie inverse pour créer le Panzerschreck. Le M1 coûte très peu et d'énormes quantités de munitions excédentaires ont été créées. Il a donc été utilisé dans les guerres futures et est encore utilisé aujourd'hui par les armées à petit budget. Au rythme actuel d'utilisation, l'arme continuera probablement à être combattue par des armées à petit budget. Cependant, avec le développement mondial entraînant une augmentation du nombre de PRI dédiés et les conflits actuels qui les épuisent, il est peu probable que cela se produise avant très longtemps."
 USA_manpats_2: "M20A1 Super Bazooka"
 USA_manpats_2_short: "M20A1 Super Bazooka"
 USA_manpats_2_desc: "Le M20A1 Super Bazooka est la synthèse d'un grand nombre d'améliorations apportées au Bazooka par Edward Uhl tout au long de la guerre jusqu'au milieu des années 50. Il comportait des moulages légers, un support d'emplacement auxiliaire, un viseur optique, une portée étendue grâce à une munition améliorée, un mécanisme de couplage amélioré, une gâchette magnétique remplaçant l'allumage de la batterie, des meubles en métal et peut être démonté pour faciliter la mobilité et l'entretien. Les améliorations en ont fait une arme beaucoup plus performante que le M1, qui pourrait être utilisée contre des cibles plus puissantes. Il a été utilisé pendant la guerre de Corée et dans de nombreux autres conflits par d'autres pays."
 USA_manpats_3: "LOI M72"
 USA_manpats_3_short: "LOI M72"
 USA_manpats_3_desc: "Le M72 LAW est un lance-roquettes antichar non guidé léger à un coup développé par FA Spinale, CB Weeks et PV Choate en 1963. Il a été introduit immédiatement pour remplacer le bazooka en production et a été combattu dans tous les conflits américains depuis sa création. L'arme elle-même est très légère et permet à l'infanterie régulière de la transporter et de l'utiliser partout où elle est nécessaire. Il n'est pas rechargeable mais ne pèse que 5,5 livres, donc même votre grand-mère pourrait l'utiliser. Sa portée effective est de 660 pieds. L'arme a été utilisée dans la guerre en Afghanistan, en Irak, en Somalie, dans la guerre du Golfe et au Vietnam."
 USA_manpats_4: "ÉCLAIR M202"
 USA_manpats_4_short: "ÉCLAIR M202"
 USA_manpats_4_desc: "Le M202 FLASH est un lance-roquettes incendiaire multi-coups conçu en 1978 par une grande équipe ad hoc et utilisé dans la guerre du Vietnam. Il peut être chargé de roquettes incendiaires de 66 mm utilisant le TPA pour enflammer une zone après une explosion. Il peut brûler beaucoup plus chaud que le napalm et crée suffisamment de chaleur et de fumée pour forcer les hélicoptères volant à basse altitude à éviter une zone. Il peut être utilisé comme arme antichar en raison de l'énorme chaleur qu'il crée sur une vaste zone, rôtissant efficacement l'équipage d'un véhicule. Alternativement, le M202 peut utiliser les roquettes de 66 mm du LAW si l'opérateur en a besoin pour utiliser des roquettes directes plutôt que de couvrir une zone de feu. Il n'a pas été officiellement produit à grande échelle, bien que plusieurs centaines de prototypes aient été fabriqués et utilisés au Vietnam. "
 USA_manpats_5: "M141/153 PETIT"
 USA_manpats_5_short: "M141/153 PETIT"
 USA_manpats_5_desc: "Le M153 SMAW est un lance-roquettes antichar et anti-fortification développé en 1984 par McDonnell Douglas. Cette arme a été utilisée lors de la guerre du Golfe, en Afghanistan, en Irak et au Yémen. Le M141 est une arme anti-fortification jetable à un coup dédiée à la destruction des bunkers. Elle a une portée effective de 1 200 mètres mais peut être utilisée pour atteindre de grandes cibles plus loin. Le M153 est une arme réutilisable qui tire des cartouches HEAA ou thermobariques. Le SMAW peut effondrer des bâtiments et possède un très grand rayon d'explosion. Cependant, il dégage une grande quantité de fumée semi-toxique, ce qui rend son tir à partir d'un espace clos dangereux sans protection contre les gaz. Ce problème ne sera pas résolu tant que le SMAW II ne sera pas développé. Il a été témoin de combats lors de la guerre du Golfe, en Afghanistan et en Irak."

 USA_hmg_1: "M45 Quadmount"
 USA_hmg_1_short: "M45 Quadmount"
 USA_hmg_1_desc: "Le M45 Quadmount est une arme anti-aérienne remorquée dotée d'une cadence de tir exceptionnelle grâce à ses 4 mitrailleuses browning M2. Il est alimenté électriquement et a une portée maximale de 1,6 miles. Il a été développé par la WL Maxson Corporation en 1943 et a été utilisé pendant la Seconde Guerre mondiale, la guerre de Corée et comme emplacement pendant la guerre du Vietnam. Surnommé le « hachoir à viande », il pouvait être utilisé horizontalement pour éliminer de manière interchangeable des cibles souples et des avions. Le M45 était également monté sur des remorques ou des half-tracks pour être utilisé comme canon SP AA bon marché. "
 USA_manpads_1: "Yeux rouges I"
 USA_manpads_1_short: "Yeux rouges I"
 USA_manpads_1_desc: "Le Redeye est un MANPADS anti-aérien créé en 1959 par Convair pour s'adapter aux combats modernes où les avions à réaction pouvaient distancer ou surpasser les canons anti-aériens. Il utilise l'infrarouge pour atteindre sa cible. En 1948, l'armée américaine commença à chercher de nouvelles armes de défense aérienne pour remplacer les canons inefficaces. De nombreux concepts différents de fusées rapides ont été étudiés, mais aucun n'était finalement précis. Au milieu des années 1950, Convair a commencé à étudier l'utilisation du guidage infrarouge pour créer un système de missile sol-air portable. Convair a commencé à étudier les premiers missiles air-air pour créer son arme et a réussi à la réduire à un niveau plus petit. Le Redeye a été utilisé au Vietnam, au Nicaragua et en Afghanistan."
 USA_manpads_2: "Yeux rouges II"
 USA_manpads_2_short: "Yeux rouges II"
 USA_manpads_2_desc: "Le Redeye II est un MANPADS anti-aérien développé par General Dynamics en 1967. Il utilise un missile surface-air infrarouge pour se diriger vers sa cible. Il comportait un ordinateur haut de gamme et des améliorations générales des pièces et de la conception globale pour le rendre plus fiable. Bien que le Redeye II soit une amélioration par rapport au Redeye I, il n'a pas été largement fabriqué et est resté un prototype car la plupart de ses améliorations pouvaient simplement être ajoutées au Redeye I. On peut considérer que développer le Redeye II dans ce contexte améliore l'ordinateur du Redeye I et fabrique le meilleur équipement."
 USA_manpads_3: "Stinger A"
 USA_manpads_3_short: "Stinger A"
 USA_manpads_3_desc: "Le Stinger A est le résultat final du projet Redeye II achevé en 1980 par General Dynamics. Le Stinger A présente une refonte complète de l'ensemble du système Redeye et est livré avec un double chercheur infrarouge et UV pour mieux déterminer ce qu'est une contre-mesure et quelle est la cible réelle. Les munitions du Stinger A contiennent un mélange plus puissant qui lui confère plus de puissance que son prédécesseur et peut atteindre une plus grande portée. Elle a démontré une puissance considérable dans la guerre des Malouines, en Afghanistan, dans la guerre irano-irakienne et dans de nombreux autres conflits du Moyen-Orient."
 USA_manpads_4: "Stinger C"
 USA_manpads_4_short: "Stinger C"
 USA_manpads_4_desc: "Le Stinger C est une amélioration apportée au Stinger B terminé vers 1990 par General Dynamics. Le Stinger B était doté d'un autodirecteur amélioré doté d'un balayage en rosette. Cependant, la Stinger B n'a été produite qu'à peine à 600 exemplaires. Le Stinger C a ajouté davantage de composants informatiques, de meilleurs logiciels et un système adaptatif capable de tenter de surmonter les interférences en ajustant ses modules pour tenter de trouver le visuel le plus clair. Plus de 20 000 unités ont été créées et ont combattu en Afghanistan et en Irak. Le projet Stinger continue de se développer avec de nouveaux ajouts mineurs et de nouvelles variantes désignées comme améliorations mineures."

 USA_protection_equip_1: "M12 + M1"
 USA_protection_equip_1_short: "M12 + M1"
 USA_protection_equip_1_desc: "Pendant la Seconde Guerre mondiale, le gilet pare-balles M12 était utilisé par les États-Unis comme pièce d'armure protectrice capable d'absorber les obus anti-aériens et de petit calibre. Cependant, c'était très encombrant et la plupart du temps, le seul uniforme d'un soldat était l'uniforme en fibre de coton Olive Drab. Malgré cela, le M12 a bien fonctionné pour protéger les soldats contre les éclats d'obus, à condition que les éclats d'obus n'atteignent pas le vaste espace que le gilet n'occupait pas./nLe casque M1 a été conçu en 1941 par le major Sydenham de l'armée américaine. Il était très efficace pour dévier les tirs vectoriels mais pas frontaux. Il a été largement utilisé pendant la Seconde Guerre mondiale et est devenu emblématique."
 USA_protection_equip_2: "M1952A + M1A"
 USA_protection_equip_2_short: "M1952A + M1A"
 USA_protection_equip_2_desc: "Le M1952A est un gilet anti-aérien utilisé par les États-Unis pendant la guerre du Vietnam et développé en 1952. Il offrait une protection nominale contre les armes de faible calibre et la DCA. Le gilet est nominalement léger et comporte des poches intégrées pour transporter des munitions. Il a également été conçu, avec un succès limité, pour isoler de la chaleur. Le M1952A sera remplacé par le M1965A lorsque le kevlar sera inventé presque immédiatement. Le M1A est une amélioration par rapport au casque M1 avec des modifications mineures à l'intérieur du casque afin qu'il repose plus facilement sur la tête."
 USA_protection_equip_3: "PASSÉ"
 USA_protection_equip_3_short: "PASSÉ"
 USA_protection_equip_3_desc: "PASGT est la désignation d'un ensemble de blindages développé pour l'infanterie américaine en 1975 par le US Army Soldier Systems Center. Il protège bien mieux l'infanterie que le M1965A, qu'il a remplacé. Incorporant plusieurs couches de nylon, le casque et le gilet PASGAT seraient complètement déployés d'ici 1983. Cependant, bien qu'il offre une meilleure protection, le PASGAT était extrêmement lourd, encombrant et très inconfortable à des températures extrêmes."
 USA_protection_equip_4: "Intercepteur"
 USA_protection_equip_4_short: "Intercepteur"
 USA_protection_equip_4_desc: "Interceptor est la désignation de l'équipement de protection moderne utilisé par l'armée américaine. Il a été conçu par la DARPA en 1998 et cherchait à fournir une protection qui n'a pas été accordée à l'infanterie depuis que le blindage est devenu obsolète. Bien qu'elle ne soit pas aussi efficace contre les tirs d'armes à feu que l'armure de plaques l'était contre les épées. Le gilet pare-balles Interceptor se compose de l'OTV, du DAPS et du MICH. L'OTV est le gilet qui protège le cou, la gorge, les biceps et l'aine. Les auxiliaires peuvent être retirés de la protection du torse. L'OTV contient des plaques balistiques et des composés de nylon modernes qui peuvent protéger les soldats mieux que n'importe quelle armure antérieure. Le système est également doté de la capacité de protéger le soldat avec un mince gilet Flattening Load Carrier pour faciliter le transport de l'équipement. Les DAPS sont des manchons de protection auxiliaires destinés à protéger les jambes et les bras. Le MICH est un casque léger en kevlar doté de ports auxiliaires pour contenir différentes pièces d'équipement telles que des jumelles. "
 USA_protection_equip_5: "IOTV"
 USA_protection_equip_5_short: "IOTV"
 USA_protection_equip_5_desc: "Le Gilet Tactique Combiné Amélioré et sa variante Forces Spéciales sont des ensembles théoriques d'équipements de protection individuelle destinés à remplacer l'Interceptor. Actuellement, la plupart des pièces sont en développement ou en phase conceptuelle. L'ICTV et le SFICTV ont commencé leur développement au début des années 2000 par divers fabricants, seul l'IOTV étant développé en 2007 et la série de casques actuellement en développement ou conceptuelle. L'ICTV devrait inclure un ensemble complet de gilets pare-balles protégeant la quasi-totalité du corps avec des espaces protégés par des couches de fibres imbriquées et des plaques métalliques légères. Le casque est livré avec une protection auditive et oculaire avec un support auxiliaire pour un masque à gaz d'assaut pare-balles et un support pour des jumelles. La variante SF est beaucoup plus légère avec une grande partie du placage réduit ou segmenté pour faciliter le mouvement. Une fois développé, il offrira une protection complète."
 ###USA END

 ###SOV Tree
 SOV_team_weapons_1: "SG-43 (HMG), M1938 (Mortier)"
 SOV_team_weapons_1_short: "SG-43, M1938"
 SOV_team_weapons_1_desc: "La SG-43 est une mitrailleuse moyenne développée par PM Goryunov pour remplacer la PM M1910 MG, obsolète, selon les normes de la Seconde Guerre mondiale, qui a été utilisée par l'Union soviétique pendant la majeure partie de la guerre. Le SG-43 utilisait une culasse inclinable et était livré avec un appareil en bas qui permettait d'être monté sur des trépieds, des supports à roues ou sur des véhicules comme arme de support. Le canon est refroidi par air et très dense, ce qui rend difficile son refroidissement dans la plupart des températures, mais il est livré avec un alésage chromé qui peut les supporter. Cela le rend peu fiable à des températures plus élevées. Il a été largement utilisé vers la fin de la Seconde Guerre mondiale. Il a été autorisé dans un grand nombre de pays, ce qui lui a permis de participer aux guerres de Corée et du Vietnam. Bien que l'arme elle-même ait également été impliquée dans de très nombreuses guerres civiles.\nLe mortier M1938 est un mortier soviétique de 120 mm largement utilisé par l'armée soviétique pendant la Seconde Guerre mondiale. Son design est une quasi-copie du Mortier Brandt français de 120 mm. Le mortier lui-même est très facile à assouplir et à détacher et peut se déplacer rapidement pour éviter les contre-tirs. Il utilise des obus très lourds de 120 mm et possède une cadence de tir élevée, ce qui en fait une arme puissante pour frapper les campements ennemis ou l'infanterie se trouvant à couvert, comme des bâtiments."
 SOV_team_weapons_2: "120-PM-43 (Mortier), KPV (HMG)"
 SOV_team_weapons_2_short: "120H-43, KPV"
 SOV_team_weapons_2_desc: "Le KPV est une mitrailleuse lourde conçue pour les Soviétiques en 1944 par Semen Vladimirov. Il n'a été mis en production ou en service qu'en 1949. Le canon lui-même a finalement été retiré du service d'infanterie au milieu des années 1960 en raison de son poids immense et remplacé par un HMG alternatif. Il est connu pour sa portée horizontale exceptionnelle de 3 000 mètres et sa portée aérienne de 2 000 mètres. Son gros calibre pouvait également en faire une arme anti-blindée légère et était placé sur les voitures de reconnaissance et les BTR. Il a été utilisé pendant la guerre de Corée et du Vietnam et sa location de longue date a conduit ces armes à être utilisées dans de nombreuses guerres différentes. Même aujourd'hui, l'arme elle-même n'a pas encore été mise hors service et a été témoin de conflits modernes tels que les guerres du Golfe et d'Irak.\nLe mortier 120-PM-43 était un mortier soviétique à culasse de 120 mm chargé par la bouche développé en 1943 et était une version modifiée du M1938. Sa conception a été fortement simplifiée et son poids et ses coûts ont été considérablement réduits. Il a été utilisé à la fin de la Seconde Guerre mondiale et a été utilisé par les Soviétiques dans les guerres d'Afghanistan ainsi qu'au Vietnam et dans la guerre du Golfe."
 SOV_team_weapons_3: "NSV (HMG), ASG-17 (HGL)"
 SOV_team_weapons_3_short: "NSV, ASG-17"
 SOV_team_weapons_3_desc: "Le NSV est une mitrailleuse lourde conçue par Nikitin, Sokolov et Volkov en 1971. Bien qu'elle ait une portée inférieure à celle du KPV, le canon lui-même présente quelques avantages, notamment un poids beaucoup moins important, ce qui lui permet de continuer à être utilisé comme HMG d'infanterie et une plus grande polyvalence. Il était également connu pour être plus fiable et moins cher à fabriquer, permettant une amélioration globale en tant que HMG d'infanterie. Il a été témoin des guerres d'Afghanistan et du Vietnam, ainsi que des guerres en Irak et en Syrie.\nL'ASG-17 est un lance-grenades automatique lourd conçu par KBP en 1967. Il est conçu pour fonctionner depuis un véhicule ou une position fortifiée. Le tambour standard peut contenir jusqu'à 29 grenades et peut toutes les tirer en 10 secondes. Il a été largement utilisé par l'Union soviétique et s'est révélé extrêmement fiable en Afghanistan."
 SOV_team_weapons_4: "NSVT (HMG), 2B14 (Mortier)"
 SOV_team_weapons_4_short: "NSVT, 2B14"
 SOV_team_weapons_4_desc: "Le NSVT est une variante améliorée du NSV HMG qui a été améliorée par ses concepteurs d'origine quelque temps après la sortie de l'arme initiale. Le NSVT présentait des améliorations telles qu'un poids plus léger grâce à des pièces simplifiées et des matériaux plus modernisés pour permettre à l'arme de tirer plus longtemps. C'est également à cette époque que divers accessoires furent développés pour le HMG. Le NSVT est bien connu pour être monté sur les CCP soviétiques tels que le 64, le 72 et le 80.\nLe 2B14 est un mortier léger à tir indirect moderne conçu en 1983 par l'usine d'ingénierie de Nizni Novgorod pour être utilisé dans les forces aéroportées et d'infanterie légère. L'arme tire un mortier moderne de 82 mm et a une cadence de tir d'environ 24 coups par minute. Sa cadence de tir élevée et sa conception logistique efficace en faisaient une excellente arme pour les Soviétiques et son utilisation allait bien au-delà de son objectif prévu, y compris pour les unités de fusils motorisés. Son succès s'est largement manifesté pendant la guerre en Afghanistan."
 SOV_team_weapons_5: "Kord-6P50 (HMG), AGS-30 (HGL)"
 SOV_team_weapons_5_short: "Kord-6P50, AGS-30"
 SOV_team_weapons_5_desc: "Le Kord 6P50 est un HMG russe conçu par Namitulin, Obidin, Bogdanov et Zhirokhin. L'arme présente d'importants changements par rapport à l'ancien NSVT, notamment un boulon rotatif remplaçant le verrou de culasse pivotant, un système de gaz amélioré et un déflecteur de bouche retravaillé. Le canon a beaucoup moins de recul, ce qui lui confère une plus grande précision et des temps de tir plus longs, ce qui le rend meilleur pour supprimer les tirs et l'appui-feu à longue portée. Il est également beaucoup plus léger et produit un volume de feu plus élevé. Il a été témoin de combats dans une grande variété de conflits modernes en Russie et dans la sphère russe, notamment la guerre russo-géorgienne et la guerre civile syrienne. Il existe également des rapports selon lesquels cela a été observé dans les guerres en Irak et en Afghanistan avec les États-Unis, bien que rarement.\nL'ASG-30 est un lance-grenades lourd développé en 1990 par le bureau du KBP pour l'Union soviétique mais qui n'a été adopté qu'après la dissolution en 1995 par la fédération de Russie. Il tire à une cadence de 400 coups par minute et est équipé d'une action Blowback. Sa conception est fortement basée sur l'AGS-17 et est massivement plus légère, plus mobile, a une portée plus longue et est plus précise. Le lanceur a acquis un prestige notable grâce à sa capacité à abattre des ennemis fortifiés. Sa capacité a été prouvée lors de la deuxième guerre de Tchétchénie, où elle s'est révélée être une arme très performante."

 SOV_squad_weapons_1: "DP (LMG)"
 SOV_squad_weapons_1_short: "DP"
 SOV_squad_weapons_1_desc: "Le DP est un LMG développé par Vasily Degtyaryov en 1927 pour l'Union soviétique. Le pistolet lui-même utilise les mêmes munitions que le Mosin-Nagant et est un LMG entièrement automatique fonctionnant au gaz avec une conception de verrouillage des volets Kjellmann-Friberg. Il comprend un canon amovible avec un suppresseur de flash intégré et un chargeur panoramique. Il était facile à fabriquer en série en raison de la simplicité et du petit nombre de pièces. Il est bien connu pour sa légèreté et sa polyvalence. Il était monté sur des chars et des avions soviétiques et utilisé par l'infanterie. Il a été largement utilisé tout au long de la Seconde Guerre mondiale."
 SOV_squad_weapons_2: "RP-46 (LMG)"
 SOV_squad_weapons_2_short: "RP-46 (LMG)"
 SOV_squad_weapons_2_desc: "Le RPK est un LMG conçu par Mikhaïl Kalachnikov en 1961 et mis en service presque immédiatement par l'Union soviétique. Le RPK utilise en grande partie les mêmes fonctions et mécanismes que l'AK-47, notamment en utilisant la même forme de munition, ce qui permet un système logistique et de production plus rationalisé. Le RPK est doté d'un canon long et lourd et d'un récepteur renforcé pour améliorer sa portée, sa précision et sa capacité de tir soutenu. Le canon chromé était fixé de manière permanente, empêchant toute maintenance sur le terrain, et bien qu'il soit plus fiable au combat, il nécessitait un équipement spécialisé pour le nettoyer et l'entretenir. Le RPK verrait le combat dans le conflit frontalier sino-soviétique en 1969 être utilisé par l'Union soviétique. De plus, il a été largement utilisé lors de l'invasion de la Tchécoslovaquie par le Pacte de Varsovie en 1968."
 SOV_squad_weapons_3: "RPK (LMG)"
 SOV_squad_weapons_3_short: "RPK"
 SOV_squad_weapons_3_desc: "Le RPK est un LMG conçu par Mikhaïl Kalachnikov en 1961 et mis en service presque immédiatement par l'Union soviétique. Le RPK utilise en grande partie les mêmes fonctions et mécanismes que l'AK-47, notamment en utilisant la même forme de munition, ce qui permet un système logistique et de production plus rationalisé. Le RPK est doté d'un canon long et lourd et d'un récepteur renforcé pour améliorer sa portée, sa précision et sa capacité de tir soutenu. Le canon chromé était fixé de manière permanente, empêchant toute maintenance sur le terrain, et bien qu'il soit plus fiable au combat, il nécessitait un équipement spécialisé pour le nettoyer et l'entretenir. Le RPK verrait le combat dans le conflit frontalier sino-soviétique en 1969 être utilisé par l'Union soviétique. De plus, il a été largement utilisé lors de l'invasion de la Tchécoslovaquie par le Pacte de Varsovie en 1968."
 SOV_squad_weapons_4: "RPK-74 (LMG) GP-25 (GL)"
 SOV_squad_weapons_4_short: "RPK-74, GP-25"
 SOV_squad_weapons_4_desc: "Le RPK-74 est une version améliorée du RPK développé en 1974 par Mikhaïl Kalachnikov et adopté presque immédiatement. Le RPK-74 utilise les munitions plus petites également utilisées par l'AK-74. Il utilise un canon chromé plus long et un bloc de gaz amélioré avec un canal de gaz à 90 degrés de l'axe d'alésage avec un anneau pour la tige de nettoyage. Il est également livré avec un tourillon arrière renforcé et un puits de chargeur renforcé. Le canon lui-même tire plus rapidement avec une vitesse initiale beaucoup plus élevée que son prédécesseur. Il a été largement utilisé pendant la guerre dans le Donbass et le conflit en Afghanistan.\nLe GP-25 est un lance-grenades soviétique qui peut être monté sur le canon des fusils Kalachnikov. Il a été développé par TsKIB SOO en 1978 et a été immédiatement adopté. Il tire une grenade sans étui de 40 mm et est extrêmement fiable. Pendant la guerre en Afghanistan, le lance-grenades a démontré des capacités de combat exceptionnelles."
 SOV_squad_weapons_5: "PKP Pecheneg (LMG)"
 SOV_squad_weapons_5_short: "PKP Pecheneg"
 SOV_squad_weapons_5_desc: "La PKP est une mitrailleuse moderne à usage général conçue par TsNIITochMash en Russie en 2001. Elle est beaucoup plus précise que tous les modèles précédents et chambre le plus gros calibre de munitions utilisé par l'AK-47. Il est doté d'un canon de refroidissement à air pulsé plus lourd et non amovible et de nervures radiales qui empêchent la brume thermique et maintiennent le canon au frais lors d'un tir soutenu. Il comporte également des matériaux et des alliages modernes intégrés à sa conception, ce qui lui permet d'être plus solide et de conserver une plus grande puissance de feu que les modèles précédents. Il a été utilisé massivement dans le monde entier lors de la guerre civile syrienne, de la guerre de Géorgie, de la deuxième guerre de Tchétchénie, de l'invasion de la Crimée, etc. *Renifle*"

 SOV_specialist_1: "SVT-40 (SR)"
 SOV_specialist_1_short: "SVT-40"
 SOV_specialist_1_desc: "Le SVT-40 est un fusil à gaz semi-automatique qui utilise une alimentation par chargeur. Le SVT-40 est un fusil de combat développé pour l'Union soviétique en 1940 par Sergueï Simonov. Il a été donné à des tireurs d'élite et à des tireurs d'élite désignés, bien que le modèle standard Mosin-Nagant ait également été utilisé pour les combats à longue distance par certains tireurs d'élite. Il a été largement utilisé pendant la Seconde Guerre mondiale et a depuis lors été impliqué dans de nombreuses insurrections communistes, car il a été loué aux rebelles par l'Union soviétique."
 SOV_specialist_2: "Fusil de précision Dragunov (SR)"
 SOV_specialist_2_short: "Dragounov"
 SOV_specialist_2_desc: "Le fusil de précision Dragunov est un DMR semi-automatique qui chambre la cartouche Mosin 7,62x54R. Le Dragunov a été développé en 1963 par Yevgeny Dragunov. L'arme elle-même est connue pour sa grande précision et sa fiabilité exceptionnelle et a été utilisée encore aujourd'hui par les armées du monde entier. Des munitions peu coûteuses, un entretien facile et une grande fiabilité ont permis à cette arme de rester en service même dans certaines des armées les plus pauvres du monde, tout en parvenant à s'imposer dans les combats modernes. Il a été témoin d'un nombre inquantifiable de combats dans plus de 40 guerres à travers le monde."
 SOV_specialist_3: "CONTRE (SR)"
 SOV_specialist_3_short: "VSS"
 SOV_specialist_3_desc: "Le fusil de précision VSS est un fusil de précision spécialisé développé en 1980 par Serdjukov et Krasnikov. Le fusil de précision VSS est doté d'un canon supprimé intégré et utilise des munitions subsoniques ou AP. Le fusil lui-même est principalement utilisé par les unités des forces spéciales telles que Spetsnaz pour sa capacité clandestine et son système intégré de suppression du son et des flashs. Il a été témoin de combats lors de la guerre en Afghanistan, mais très rarement en dehors de celle-ci."
 SOV_specialist_4: "OTs-03 SVU (SR)"
 SOV_specialist_4_short: "OTs-03 SVU"
 SOV_specialist_4_desc: "Le Dragunov SVU est une variante bullpup moderne du Dragunov qui était initialement destinée à moderniser légèrement le Dragunov mais le projet a conduit à une refonte presque complète de l'arme. Conçue en 1990 par le KBP Instrument Design Bureau, l'arme a réinventé l'ancien Dragunov. Un frein de bouche spécial a été ajouté, réduisant considérablement l'énergie de recul, et une crosse élastique a été fixée. Un grand nombre d'autres petites améliorations telles qu'une meilleure adhérence, un support de visée et une taille de canon réduite avec une configuration bullpup ont rendu l'arme plus facile à manipuler. Le SVU a combattu lors de la première guerre de Tchétchénie, où il a démontré des performances exceptionnelles au-dessus du Dragunov original."
 SOV_specialist_5: "OSV-96 (SR)"
 SOV_specialist_5_short: "OSV-96"
 SOV_specialist_5_desc: "Le SVDK est un fusil de précision russe moderne conçu à la fin des années 1990 par TSNIITOCHMASH, mais n'a été produit ou déployé qu'en 2006. Le SVDK est un fusil de précision de gros calibre qui a une portée effective d'environ 600 mètres. Il peut pénétrer dans un gilet pare-balles ou une couverture lourde et a été construit dans le but d'attaquer des cibles que le SVU ne peut pas. Aucun incident n'a été signalé au cours duquel le SVDK a participé à des combats."

 SOV_ammo_explosives_1: "RGD-33 (Grenade AT), FMJ (Munitions)"
 SOV_ammo_explosives_1_short: "RGD-33, FMJ"
 SOV_ammo_explosives_1_desc: "La grenade RGD-33 AP était une grenade à main conçue par Dyakonov en 1933. La grenade elle-même est chargée de TNT et la mèche a été frappée par un processus de lancement et d'élan vers l'avant après avoir été amorcée. La grenade elle-même n'a été assemblée qu'avant le combat pour réduire le risque d'accident, le manchon, l'ogive et la poignée étant séparés. Il indique des niveaux d'utilisation importants avant, pendant et après la Seconde Guerre mondiale ainsi que la guerre de Corée et du Vietnam.\nLa cartouche Full Metal Jacket est une balle inventée en 1882 par le colonel suisse Eduard Rubin. Cependant, des améliorations ont été apportées à la métallurgie depuis la Seconde Guerre mondiale et, en tant que tel, la ronde FMJ de la Seconde Guerre mondiale a simplement incorporé des matériaux de meilleure qualité dans la conception déjà existante."
 SOV_ammo_explosives_2: "RKG-3 (Grenade AT), F1 (Grenade), MON Mines (Mines)"
 SOV_ammo_explosives_2_short: "Mines RKG-3, F1, MON"
 SOV_ammo_explosives_2_desc: "La grenade RKG-3 AT est une grenade AT soviétique développée en 1950 comme une amélioration du RPG-40 par ses fabricants. Elle a été impliquée dans les guerres d'Irak et de Yom Kippour. La grenade elle-même présentait un meilleur niveau de capacité anti-blindage par rapport à son prédécesseur et comportait un fusible amélioré et un mélange de remplissage puissant.\nLa grenade F1 AP est une grenade AP/frag de développement partagé dans laquelle les fabricants d'armes russes ont amélioré la grenade F1 française existante en installant un fusible à fil-piège moderne et un remplissage en TNT avec un ensemble de coques métalliques à fragmentation de meilleure qualité. Il a été témoin de pratiquement tous les combats russes depuis la Seconde Guerre mondiale, depuis sa création en 1941 jusqu'à nos jours.\nLes mines terrestres MON sont une série de premières mines terrestres développées pour l'Union soviétique par divers concepteurs des années 50 aux années 60. Les mines terrestres MON sont toutes antipersonnel et utilisent généralement la fragmentation et le TNT pour effectuer des missions de déni de zone. Ils ont été témoins de pratiquement tous les combats de l'Union soviétique dans les années 50 et 60."
 SOV_ammo_explosives_3: "Munitions AP modernes (munitions), mines TM (mines terrestres)"
 SOV_ammo_explosives_3_short: "Munitions AP modernes, mines TM"
 SOV_ammo_explosives_3_desc: "Les obus AP existent depuis de nombreuses années avant la Première Guerre mondiale et étaient principalement utilisés dans les navires de guerre pénétrants. Autour de la Première Guerre mondiale, après l'entrée du char sur le champ de bataille, des obus miniaturisés ont été créés. Finalement, de petits calibres AP ont été créés en réponse aux gilets pare-balles. Les munitions AP modernes ont été créées en 1965 pour répondre à l'augmentation de l'infanterie lourdement blindée et de la couverture d'infanterie. Les mines terrestres TM sont une série de mines antichars soviétiques initialement développées et largement utilisées vers 1941, mais qui ont été abandonnées en raison d'une pénurie de métal qui a été priorisée pour créer d'autres armes. Cependant, vers 1957, elles firent leur retour et le développement et la production des mines TM se poursuivirent finalement en utilisant des explosifs plus modernes. Les mines TM ont été fréquemment utilisées presque partout où il y avait un conflit dans la sphère soviétique, mais leur plein potentiel a été démontré lors de l'invasion soviétique de l'Afghanistan."
 SOV_ammo_explosives_4: "RGO/RGN (Grenades)"
 SOV_ammo_explosives_4_short: "RGO/RGN"
 SOV_ammo_explosives_4_desc: "La RGO et la RGN sont respectivement des grenades à main à fragmentation défensive et offensive. Ils sont constitués d'un corps pré-fragmenté monocouche. La coque elle-même est composée de 2 sections dentelées en aluminium en haut et en bas. Les grenades elles-mêmes explosent immédiatement à l'impact, rendant la réaction des cibles plus difficile. Ils ont été créés dans le cadre du projet BAZALT pendant la guerre soviéto-afghane et leurs explosions à impact ont permis d'atteindre plus facilement des cibles sur un terrain rocheux.\nLes grenades utilitaires sont des grenades à main qui ont des rôles spécialisés tels que des flashbangs, des fumigènes, des incendiaires, etc. Elles peuvent être utilisées respectivement pour étourdir les ennemis, dissimuler des positions et interdire une zone. "
 SOV_ammo_explosives_5: "Cartouches modernes (munitions)"
 SOV_ammo_explosives_5_short: "Rondes modernes"
 SOV_ammo_explosives_5_desc: "À l'ère moderne, il existe un vaste arsenal de différents types de munitions spécialisées pouvant être utilisées dans des situations spécifiques. Les obus AP modernes sont bien meilleurs pour pénétrer les cibles que les obus AP plus anciens et peuvent atteindre des vitesses plus élevées. Les alliages modernes permettent aux munitions standard d'infliger plus de dégâts à une cible. Les balles frangibles ou les cartouches incendiaires ont des situations particulières dans lesquelles elles sont utiles. De plus, les fusils de chasse peuvent avoir une utilisation améliorée dans les combats modernes avec des cartouches HE, des munitions 000, des cartouches à fléchettes ou des tirs incendiaires."

 SOV_manpats_1: "Grenade à fusil Dyakanov"
 SOV_manpats_1_short: "Grenade à fusil Dyakanov"
 SOV_manpats_1_desc: "Le lance-grenades à fusil Dyakanov était l'un des premiers modèles d'explosifs tirés par l'infanterie et servait parfois d'antichar pendant la Seconde Guerre mondiale. Cependant, l'Union soviétique n'a pas développé ses propres armes d'infanterie antichar et s'est fortement appuyée sur les prêts-bails. Le Dyakanov a été développé par Dyakanov MG en 1917 et peut lancer des explosifs spécialement conçus chargés par la bouche, tels que des grenades antichar ou antipersonnel. L'arme elle-même a été largement utilisée pendant la Seconde Guerre mondiale, mais a été rapidement abandonnée après la fin de la guerre au profit de l'Union soviétique développant de meilleurs lance-grenades d'infanterie et des MANPATS appropriés."
 SOV_manpats_2: "RPG-7"
 SOV_manpats_2_short: "RPG-7"
 SOV_manpats_2_desc: "Le RPG-7 est une grenade antichar propulsée par fusée développée en 1958 par la société de fabrication d'armes Bazalt. Le RPG-7 est bien connu pour sa simplicité, son faible coût, sa grande efficacité ainsi que son incroyable longévité et fiabilité. Il est capable de tirer des obus standard, HEAT, à fragmentation et thermobariques. Il est composé d'un système très simple qui se caractérise par son faible coût et sa facilité d'entretien. Il est basé sur un tube d'acier et le milieu est recouvert de bois pour le protéger de la chaleur. L'extrémité est évasée pour aider à protéger l'utilisateur contre les explosions et à réduire le recul. Lorsqu'il est tiré, il frappe simplement le percuteur comme une arme à feu ordinaire pour enflammer la grenade. Il est omniprésent depuis sa création et a été observé dans pratiquement tous les combats partout sur Terre."
 SOV_manpats_3: "RPG-18"
 SOV_manpats_3_short: "RPG-18"
 SOV_manpats_3_desc: "Le RPG-19 a été développé par le fabricant d'armes Bazalt au début des années 1970. Le RPG-18 tire une ogive HEAT de 64 mm et a une portée effective de 200 mètres. L'ogive s'autodétruit toujours après 6 secondes, ce qui impose une limite définie. Le RPG-18 n'a pas été autant utilisé que le RPG-7 et n'a pas fait autant de chemin dans le monde en raison du fait qu'il ne peut pas être rechargé. Il est cependant très bon marché bien qu'il soit plus lourd sur le plan logistique car chaque tube ne tire qu'une seule fois. Il a été largement utilisé dans diverses guerres menées par la Chine ainsi que dans la guerre soviéto-afghane."
 SOV_manpats_4: "RPG-29"
 SOV_manpats_4_short: "RPG-29"
 SOV_manpats_4_desc: "Le RPG-29 est un RPG antichar rechargeable développé par Bazalt à la fin des années 1980. Il a été développé pour fournir une variante moderne et améliorée du RPG-7 et est rechargeable contrairement au RPG-18. Il tire des roquettes à une portée effective d'environ 600 mètres et n'est pas limité par une ogive chronométrée. Il est bien plus capable de pénétrer l'armure que le RPG-7, même s'il n'a pas complètement dissuadé le RPG-7 ou le RPG-18 en raison de son coût plus élevé. Le RPG-29 n'a pas non plus de charge propulsive initiale pour protéger les opérateurs lorsque la fusée s'enflamme afin de réduire le poids et de donner une valeur de poids plus précieuse qui peut être utilisée pour plus de carburant de fusée. Cela signifie qu'il n'est pas aussi simple à utiliser et nécessite un niveau de protection pour son utilisateur mais le rend plus efficace. Le RPG-29 a été utilisé dans la guerre en Irak, dans la guerre civile syrienne et dans la guerre du Liban en 2006."
 SOV_manpats_5: "RPG-32"
 SOV_manpats_5_short: "RPG-32"
 SOV_manpats_5_desc: "Le RPG-32 est une arme d'infanterie antichar russe moderne développée par Bazalt en 2005. L'arme a une portée effective d'environ 350 m avec une portée maximale de 700 m. Le lanceur est livré avec 2 ogives différentes de 72 ou 105 mm, thermobariques ou HEAT. Il a une capacité de perforation de blindage bien plus grande que n'importe lequel de ses prédécesseurs. Il n'a pas encore été déployé ni accepté par l'armée russe en raison de son coût élevé, bien que plusieurs pays du Moyen-Orient l'importent de Russie, principalement pour l'utiliser dans les bataillons haut de gamme de leur armée. Il est actuellement utilisé dans la guerre civile irakienne et la guerre civile yéménite."

 SOV_hmg_1: "DShK"
 SOV_hmg_1_short: "DShK"
 SOV_hmg_1_desc: "La mitrailleuse lourde DShK est une HMG à clapet fonctionnant au gaz développée en 1938 par Vasily Degtyaryov. L'arme elle-même a été utilisée à la fois comme HMG et parfois comme petite arme anti-aérienne par l'infanterie pendant la Seconde Guerre mondiale. Plus d'un million d'exemplaires ont été fabriqués aujourd'hui et, en raison de leur faible coût et de leur facilité de fabrication, ils continuent d'être fabriqués par de nombreux pays sous-développés à travers le monde avec un succès notable."
 SOV_manpads_1: "Strela-2"
 SOV_manpads_1_short: "Strela-2"
 SOV_manpads_1_desc: "Le Strela-2 est un lanceur de missiles antiaériens portable d'infanterie MANPAD qui était une arme de base de la sphère soviétique. Conçue par KBM en 1964, l'arme comportait un fusible à détonation à impact sans retard, une ogive explosive HE et un système de guidage de missile à logique de navigation proportionnelle. Il s'est avéré relativement peu coûteux à fabriquer en série. Cependant, le haut commandement soviétique a rapidement remarqué que le Strela-2 fonctionnait mal et bien en deçà de ce à quoi il s'attendait. Il a été témoin de conflits lors de la guerre soviéto-afghane, de nombreuses révolutions communistes différentes, ainsi que d'une utilisation intensive dans les conflits du Moyen-Orient. "
 SOV_manpads_2: "Strela-3"
 SOV_manpads_2_short: "Strela-3"
 SOV_manpads_2_desc: "L'Union soviétique a rapidement commencé à développer le Strela-3 après avoir constaté que le Strela-2 avait été inefficace au combat. KBM a terminé le développement du Strela-3 en 1974 et il s'est avéré bien plus performant. Au lieu d'une logique de navigation proportionnelle, le Strela-3 a utilisé le guidage infrarouge pour atteindre des cibles bien au-delà de la portée effective du Strela-2. De plus, il était livré avec un refroidisseur d'élément détecteur dans le missile lui-même, ce qui lui permet d'être moins facilement trompé par les fusées éclairantes et de rechercher plus précisément les véritables cibles. Malgré cela, les ajouts ont rendu le missile plus lourd et nécessitent un carburant de propulsion plus cher, rendant chaque tir plus cher. Le Strela-3 a été utilisé dans de nombreux conflits au Moyen-Orient, tels que la guerre Irak-Iran, mais n'a pas connu beaucoup de combats au sein même de la sphère soviétique."
 SOV_manpads_3: "Igla"
 SOV_manpads_3_short: "Igla"
 SOV_manpads_3_desc: "L'Igla est un système MANPAD amélioré développé par KBM en 1981. L'Igla utilise un système de guidage infrarouge à double bande d'ondes et dispose d'un système de détonation de fusible magnétique à impact retardé. Le missile était également équipé d'un aérospike pour réduire la traînée et améliorer les performances. L'arme a été témoin de nombreux conflits généraux au Moyen-Orient mais aussi des guerres de Yougoslavie."
 SOV_manpads_4: "Verbe"
 SOV_manpads_4_short: "Verbe"
 SOV_manpads_4_desc: "Le Verba est un système MANPAD russe moderne créé en 2011. Il utilise un système de guidage optique à 3 canaux avec un plafond de vol exceptionnel de 5 km et une très longue portée. L'arme est également livrée avec une ogive moderne et plus puissante. L'arme elle-même est très difficile à tromper avec les systèmes de contre-mesures en raison des 3 canaux qu'elle possède dans chaque missile nécessitant l'utilisation de contre-mesures de haute qualité. Le Verba est utilisé par les Arméniens, les Russes et les Syriens mais n'a jusqu'à présent été combattu qu'en Syrie."

 SOV_protection_equip_1: "Bavoir en acier"
 SOV_protection_equip_1_short: "Bavoir en acier"
 SOV_protection_equip_1_desc: "La bavette en acier est un modèle extrêmement ancien d'équipement de protection d'infanterie basé sur la cuirasse en acier et a été fabriquée pendant la Première Guerre mondiale. Les cuirasses elles-mêmes ont été mises en oeuvre vers 1942 et les résultats de leur utilisation au combat ont été mitigés. Les cuirasses elles-mêmes fonctionnaient dans des environnements urbains à forte densité d'infanterie, mais étaient lourdes sur le terrain."
 SOV_protection_equip_2: "SN+SSh40"
 SOV_protection_equip_2_short: "SN+SSh40"
 SOV_protection_equip_2_desc: "Les gilets pare-balles SN et les casques SSh40 ont été développés vers la fin de la Seconde Guerre mondiale. Les casques eux-mêmes étaient plus robustes que leurs versions précédentes."
 SOV_protection_equip_3: "6B5-15+STSh-81"
 SOV_protection_equip_3_short: "6B5-15+STSh-81"
 SOV_protection_equip_3_desc: "Le gilet 6B5-15 a été développé par l'institut de recherche soviétique Stali et produit de 1986 à 1998. Le gilet lui-même utilisait des matériaux en kevlar pour protéger l'utilisateur et était livré avec une série de camouflages multicam. Les casques STSh-81 sont des casques en titane et en acier également produits par Stali pour l'Union soviétique. Les casques STSh-81 ont démontré une résistance considérable au combat."
 SOV_protection_equip_4: "6B7"
 SOV_protection_equip_4_short: "6B7"
 SOV_protection_equip_4_desc: "Au fil du temps, le blindage balistique 6B5-15 devra être doté de harnais et de composants accessoires plus nombreux et améliorés. Stali a entrepris de créer un ensemble complet d'équipements modernes pour la plupart des environnements du monde, qui pourraient être fabriqués à volonté par l'Union soviétique. Les casques 6B7 étaient une version améliorée des casques STSh-81 et succédaient à leur ancien design. Stali les a fabriqués avec des matériaux plus modernes, tels qu'une structure interne en acier améliorée, capable de dévier plus efficacement la force provenant des balles."
 SOV_protection_equip_5: "6B45+6B47"
 SOV_protection_equip_5_short: "6B45+6B47"
 SOV_protection_equip_5_desc: "Techinkom a développé les gilets 6B5 et l'équipement d'infanterie au début des années 2000 pour répondre aux besoins du combat moderne. Ils étaient plus maniables, durables et efficaces qu'auparavant. Ils étaient dotés d'un placage moderne absorbant les chocs, d'une doublure résistante aux intempéries et à l'humidité et pouvaient facilement donner à n'importe quel soldat un avantage considérable dans les combats d'infanterie. Le casque 6B47 et ses fixations d'équipement offrent une plus grande protection à ses porteurs qu'auparavant offrant une plus grande protection."

