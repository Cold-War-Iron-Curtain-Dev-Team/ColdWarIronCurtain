 syr_news.1.t: "Président Husni al-Zaim"
 syr_news.1.d: "Le 30 mars 1949, le général Husni al-Za'im prend le pouvoir lors d'un coup d'État sans effusion de sang. La résidence du président Shukri al-Quwatli a été prise d'assaut par des soldats et le général a déclaré son arrestation. On pensait que la CIA avait contribué au coup d'État, ce qui en faisait la première opération de l'agence à l'étranger. Al-Za'im, plus conforme aux exigences de Washington, a approuvé le pipeline transarabe auquel Quwatli s'est opposé, et a entamé des négociations avec Israël pour un cessez-le-feu. Que s'est-il passé dans l'ensemble, cependant, c'est que le pays a été plongé dans une décennie de chaos..."
 syr_news.1.a: "Qu'arrive-t-il à la Syrie ?"
 syr_news.2.t: "Armistice avec Israël"
 syr_news.2.d: "L'accord d'armistice de 1949 a été signé entre Israël et la Syrie le 20 juillet 1949 sur la colline 232 près de Mahanayim, mettant fin au conflit formel dans l'ancien mandat de la Palestine. La partie israélienne était représentée par le lieutenant-colonel Mordechai Maklef, Yehoshua Penman et Shabtai Rosenne, tandis que la partie syrienne était représentée par le colonel Fawzi Selo, le lieutenant-colonel Mohamed Nasser et le capitaine Afif Sizri. Même si les accords d'armistice avec la Syrie ont conclu la guerre israélo-arabe de 1948, ils n'ont pas marqué la fin du conflit israélo-arabe."
 syr_news.2.a: "Paix. Pour l'instant."
 syr_news.3.t: "[GetNewspaperHeader]Husni al-Zaim destitué"
 syr_news.3.d: "Moins de cinq mois après le début de sa présidence, Husni al-Za'im lui-même est devenu la cible d'un nouveau coup d'État. Sami al-Hinnawi s'est déclaré nouveau président, mais à peine quatre semaines plus tard, il a été destitué par Adib Shishakli. Shishakli, avec sa nouvelle position, conserverait une position pro-occidentale comme l'avaient fait les deux généraux précédents, mais créerait des divisions au sein de la population syrienne."
 syr_news.3.a: "Encore du chaos."
 syr_news.4.t: "[GetNewspaperHeader]Démocratie restaurée !"
 syr_news.4.d: "Un mécontentement croissant contre Shishakli s'est élevé parmi la population, culminant avec la destitution de l'homme fort militaire. Le Parti communiste syrien, le parti Baas et l'armée dirigent le mouvement anti-Shishakli. Refusant d'entraîner le pays dans une guerre civile, il a démissionné sans combattre. Des élections ont eu lieu par la suite et Shukri al-Quwatli a été réélu président de la Syrie."
 syr_news.4.a: "Est-ce la fin ?"
 syr_news.5.t: "Affronter l'influence de gauche"
 syr_news.5.d: "Les gauchistes syriens sont devenus influents depuis que le pays s'est aligné sur l'Union soviétique. Il a attiré une attention indésirable de la part de l'Irak, de la Jordanie et de la Turquie, alors que le Pacte de Bagdad menaçait d'invasion pour contenir le communisme. Nous pouvons appeler au soutien égyptien ou nous soumettre à leurs exigences."
 syr_news.5.a: "Que pouvons-nous faire maintenant ?"
 syr_news.6.t: "[GetNewspaperHeader]coup d'État du 8 mars"
 syr_news.6.d: "Dans la nuit du 8 mars, des unités militaires fidèles à la branche syrienne du parti arabe socialiste Baas se sont déplacées vers Damas après un an de planification et de bénédiction du chef du parti Michel Aflaq. Dès le matin, les conspirateurs ont pris l'appareil d'État avec une violence minime, et le peuple syrien a agi avec indifférence. Les nouveaux dirigeants syriens ont créé le Conseil national pour le commandement révolutionnaire (NCRC), composé de douze baasistes, de huit nasséristes et d'indépendants, comme organe dirigeant. Les nasséristes ont parlé d'une nouvelle tentative d'unification avec l'Égypte, même si les baasistes sont moins enthousiastes à l'égard de cette idée."
 syr_news.6.a: "Encore un coup d'Etat ? Quand apprendront-ils ?"
 syr_news.7.t: "[GetNewspaperHeader]Coup d'État syrien de 1966"
 syr_news.7.d: "Des conflits internes couvaient au sein du Parti Baas socialiste arabe depuis 1963. Les dirigeants et la vieille garde du parti souhaitaient diriger la Syrie selon un baasisme « classique », mais les membres plus jeunes et radicaux voyaient une Syrie meilleure sous la forme d'un « néo-baasisme » selon les principes marxistes-léninistes. Le 21 février, des violences ont éclaté entre les membres du parti Baas dans les grandes villes et, une fois la poussière retombée, les néo-baasistes ont gagné la lutte. Les fondateurs du parti Baas ont fui le pays vers l'Irak et ont provoqué un schisme entre les baasistes d'Irak et de Syrie."
 syr_news.7.a: "Suis-je censé faire un commentaire à ce sujet ?"
 syr_news.8.t: "[GetNewspaperHeader]Mouvement correctif"
 syr_news.8.d: "Le général Hafez al-Assad, après s'être brouillé avec le général Salah Jadid, a largement planifié de prendre le pouvoir. Alors qu'il attendait l'occasion, il a discrètement remplacé les partisans de Jadid par les siens dans l'armée et, dès le début du coup d'État, il avait l'avantage. Avant d'assister au Congrès général national, il a ordonné à ses loyalistes d'encercler et d'arrêter Jadid et ses partisans. Durant le Congrès, Jadid a critiqué Assad et lui a retiré le pouvoir alors que la majorité des délégués présents savaient qu'ils avaient perdu. Une fois la réunion terminée, Jadid et les délégués ont été arrêtés par des soldats syriens fidèles à Assad sans faire de victimes. Assad a déclaré la victoire et le début du « mouvement correctif » pour réparer les torts causés par Jadid dans le pays."
 syr_news.8.a: "Intéressant."
 syr_news.12.t: "[GetNewspaperHeader]Tentative de coup d'État déjouée"
 syr_news.12.d: "Le général Hafez al-Assad, après s'être brouillé avec le général Salah Jadid, a largement planifié de prendre le pouvoir. Alors qu'il attendait l'occasion, il a discrètement remplacé les partisans de Jadid par les siens dans l'armée et, dès le début du coup d'État, il avait l'avantage. Avant d'assister au Congrès général national, il a ordonné à ses loyalistes d'encercler et d'arrêter Jadid et ses partisans, mais une source anonyme a permis à Jadid de se préparer. Durant le Congrès, Jadid a critiqué Assad et lui a retiré le pouvoir alors que la majorité des délégués présents savaient qu'ils avaient perdu. Une fois la réunion terminée, Assad a été arrêté par des soldats syriens fidèles à Jadid sans faire de victimes. Jadid a déclaré la victoire et a dénoncé Assad comme un « contre-révolutionnaire » qui tentait de trahir le pays."
 syr_news.12.a: "Pas cette fois."
 syr_news.13.t: "Coup d'État de Sami al Hinawi !"
 syr_news.13.d: ""
 syr_news.13.a: "Quoi??!!"
 syr_news.14.t: "Adib Shishakli contre-coup d'État !"
 syr_news.14.d: ""
 syr_news.14.a: "Merde, encore ?!?!"
 syr_news.9.t: "[GetNewspaperHeader]Un espion israélien compromis"
 syr_news.9.d: "Le Moukhabarat syrien, avec l'aide du matériel et du personnel du KGB, et de l'ambassade indienne nous informant de transmissions radio inhabituelles, a découvert un espion israélien. De grandes quantités d'interférences radio ont été détectées dans l'appartement de l'espion israélien Eli Cohen et il a été pris au milieu d'une transmission vers Israël. Après son procès devant un tribunal militaire, l'espion a été condamné à mort en vertu de la loi martiale du pays. Israël a tenté de demander la clémence, mais la condamnation à mort a été confirmée. Cohen a été pendu publiquement sur la place Marjeh."
 syr_news.9.a: "Intéressant."
 syr_news.10.t: "Lutte pour le pouvoir Assad-Jadid"
 syr_news.10.d: "Le conflit entre les généraux syriens Salah Jadid et Hafez al-Assad est devenu de plus en plus visible dans l'opinion publique. Le virage du baasisme vers le communisme opéré par Jadid a poussé ceux qui étaient désapprobateurs à s'aligner sur Assad. La dualité du véritable pouvoir entre les deux est devenue un sujet de discussion en Syrie, et il est clair qu'un seul d'entre eux peut survivre avec un pouvoir total."
 syr_news.10.a: "Intéressant."
 syr_news.11.t: "La Syrie propose un traité de défense mutuelle"
 syr_news.11.d: "Une délégation syrienne s'est rendue à Moscou pour proposer un traité de défense mutuelle. Alors que les baathistes se disent socialistes, leurs griefs envers Israël et leur nationalisme suscitent certaines inquiétudes au sein du Présidium..."
 syr_news.11.aa: "À tout moment, camarade."
 syr_news.11.ab: "Vous plaisantez, n'est-ce pas ?"
 syr_news.40.t: "La Syrie exige notre annexion"
 syr_news.40.d: "Un message de Damas exigeait que le Liban soit annexé à l'État syrien. L'ultimatum ne nous laisse pas beaucoup de place."
 syr_news.40.aa: "Nous ne pouvons pas gagner. Nous céderons"
 syr_news.40.ab: "Nous n'abandonnerons pas notre souveraineté."
 syr_news.41.t: "Le Liban cède"
 syr_news.41.d: "Beyrouth a répondu qu'elle accepterait l'annexion. Nos soldats peuvent entrer et sécuriser le pays."
 syr_news.41.a: "Ils sont intelligents de connaître leur défaite."
 syr_news.42.t: "Le Liban refuse"
 syr_news.42.d: "Beyrouth a répondu qu'elle résistait à notre ultimatum. Nos soldats peuvent entrer et sécuriser le pays."
 syr_news.42.aa: "Il est temps de leur faire regretter cette décision."
 syr_news.42.ab: "On dirait que nous ne pouvons pas les toucher."
 syr_news.43.t: "La Syrie demande au Koweït"
 syr_news.43.d: "Damas a envoyé un message indiquant qu'il souhaitait étendre la Syrie au Koweït. Tandis que la Syrie est notre alliée, le Koweït est sous notre protection."
 syr_news.43.aa: "Une Syrie plus grande est un meilleur allié que le Koweït."
 syr_news.43.ab: "Le Koweït est sous notre protection. Nous ne pouvons pas accepter cela."
 syr_news.44.t: "La Syrie veut nous annexer"
 syr_news.44.d: "Damas a envoyé un message à Londres indiquant qu'il souhaitait étendre la Syrie au Koweït. La Grande-Bretagne nous a dit qu'elle pourrait se mettre d'accord, mais elle est venue nous en informer."
 syr_news.44.aa: "Nous ne pouvons pas gagner contre la Syrie, ni entraîner la Grande-Bretagne dans la guerre."
 syr_news.44.ab: "Bien sûr, nous ne pouvons pas accepter cela !"
 syr_news.45.t: "Le Koweït soumet"
 syr_news.45.d: "Le Koweït a accepté l'annexion après des consultations avec la Grande-Bretagne."
 syr_news.45.a: "Un autre à ma connexion."
 syr_news.46.t: "Le Koweït défie"
 syr_news.46.d: "Le Koweït a refusé l'annexion. La Grande-Bretagne a déclaré qu'elle soutiendrait le Koweït sur cette question."
 syr_news.46.aa: "On dirait que la force est le seul langage !"
 syr_news.46.ab: "La prochaine fois peut-être."
 syr_news.50.t: "La Syrie nous invite à leur union"
 syr_news.50.d: "Notre cousin de Syrie nous invite à une union arabe pour restaurer les rêves ratés du royaume syrien. On pourrait les rejoindre ?"
 syr_news.50.aa: "Nous restaurerons le rêve raté. Comptez sur nous."
 syr_news.50.ab: "Trop ambitieux à notre goût."
 syr_news.51.t: "La Jordanie est d'accord"
 syr_news.51.d: "Jordan a accepté le syndicat."
 syr_news.51.a: "Un autre dans ma collection."
 syr_news.52.t: "La Jordanie décline"
 syr_news.52.d: "Jordan a décliné l'offre."
 syr_news.52.a: "Leur perte."
 syr_news.53.t: "La Syrie nous invite à leur union"
 syr_news.53.d: "Notre cousin de Syrie nous invite à une union arabe pour restaurer les rêves ratés du royaume syrien. On pourrait les rejoindre ?"
 syr_news.53.aa: "Nous restaurerons le rêve raté. Comptez sur nous."
 syr_news.53.ab: "Trop ambitieux à notre goût."
 syr_news.54.t: "L'Irak est d'accord"
 syr_news.54.d: "L'Irak a accepté l'union."
 syr_news.54.a: "Un autre dans ma collection."
 syr_news.55.t: "L'Irak décline"
 syr_news.55.d: "L'Irak a décliné l'offre."
 syr_news.55.a: "Leur perte."
 syr_news.56.t: "La Syrie exige notre subordination"
 syr_news.56.d: "Un message de Damas exigeait que le Liban soit un protectorat de l'État syrien. L'ultimatum ne nous laisse pas beaucoup de place."
 syr_news.56.aa: "Nous ne pouvons pas gagner. Nous céderons"
 syr_news.56.ab: "Nous n'abandonnerons pas notre souveraineté."
 syr_news.57.t: "Le Liban cède"
 syr_news.57.d: "Beyrouth a répondu qu'elle accepterait d'entrer dans notre sphère d'influence. Nos soldats peuvent entrer et sécuriser le pays."
 syr_news.57.a: "Ils sont intelligents de connaître leur défaite."
 syr_news.58.t: "Le Liban refuse"
 syr_news.58.d: "Beyrouth a répondu qu'elle résistait à notre ultimatum. Nos soldats peuvent entrer et sécuriser le pays."
 syr_news.58.aa: "Il est temps de leur faire regretter cette décision."
 syr_news.58.ab: "On dirait que nous ne pouvons pas les toucher."
 syr_news.59.t: "La Syrie demande au Koweït"
 syr_news.59.d: "Damas a envoyé un message indiquant qu'il souhaitait étendre la Syrie au Koweït. Tandis que la Syrie est notre alliée, le Koweït est sous notre protection."
 syr_news.59.aa: "La Syrie serait un meilleur allié que le Koweït."
 syr_news.59.ab: "Le Koweït est sous notre protection. Nous ne pouvons pas accepter cela."
 syr_news.60.t: "La Syrie veut nous annexer"
 syr_news.60.d: "Damas a envoyé un message à Londres indiquant qu'il souhaitait étendre l'influence syrienne au Koweït. La Grande-Bretagne nous a dit qu'elle pourrait se mettre d'accord, mais elle est venue nous en informer."
 syr_news.60.aa: "Nous ne pouvons pas gagner contre la Syrie, ni entraîner la Grande-Bretagne dans la guerre."
 syr_news.60.ab: "Bien sûr, nous ne pouvons pas accepter cela !"
 syr_news.61.t: "Le Koweït soumet"
 syr_news.61.d: "Le Koweït a accepté l'union après des consultations avec la Grande-Bretagne."
 syr_news.61.a: "Un autre dans ma collection."
 syr_news.62.t: "Le Koweït défie"
 syr_news.62.d: "Le Koweït a refusé notre invitation. La Grande-Bretagne a déclaré qu'elle soutiendrait le Koweït sur cette question."
 syr_news.62.aa: "On dirait que la force est le seul langage !"
 syr_news.62.ab: "La prochaine fois peut-être."
 syr_news.63.t: "La Syrie veut rejoindre le CENTO"
 syr_news.63.d: "Nous avons reçu une demande inhabituelle de la Syrie. Il semble qu'ils souhaitent rejoindre le CENTO et faire partie du bouclier arabe contre le communisme. Devons-nous les laisser entrer ?"
 syr_news.63.a: "Plus on est de fous, plus on est de fous."
 syr_news.63.b: "Et si non ?"