 NBO_Econ.1.t: "Lancement du premier plan de reconstruction et de développement"
 NBO_Econ.1.d: "Au lendemain de la Seconde Guerre mondiale et de l'occupation japonaise, le nord de Bornéo est meurtri : ses ports endommagés, ses plantations abandonnées et son système administratif fonctionnant à peine. En réponse, l'administration britannique a dévoilé le premier plan de reconstruction et de développement du nord de Bornéo, un vaste plan de revitalisation qui s'étend sur les années 1948 à 1955.\n\nCe plan marque le premier des trois programmes de développement à long terme envisagés pour préparer la colonie à une éventuelle autonomie gouvernementale. Il vise à moderniser les infrastructures fragiles du territoire, à reconstruire la capacité administrative et à jeter les bases sociales et économiques d'un État stable et autosuffisant.\n\nParmi les principaux piliers du plan figurent :\n    -Infrastructure : reconstruire et étendre les réseaux routiers et ferroviaires, réparer et moderniser le port de Jesselton et construire de nouveaux systèmes de télécommunications.\n    -Diversification économique : Réduire la dépendance à l'égard des exportations de bois en investissant dans l'agriculture, la pêche et la petite industrie.\n    -Développement social : Développer l'enseignement primaire, introduire des programmes locaux de formation des enseignants, construire des cliniques rurales et réformer la fonction publique.\n    -Réformes politiques : jeter les bases des institutions représentatives afin de favoriser la participation politique et la gouvernance responsable."
 NBO_Econ.1.a: "Une nouvelle aube pour le nord de Bornéo"
 NBO_Econ.2.t: "Adoption de la loi sur le développement pétrolier de Sabah"
 NBO_Econ.2.d: "Dans une démarche historique visant à affirmer le contrôle de ses richesses naturelles, le Parlement du Nord de Bornéo a adopté la loi sur le développement pétrolier de Sabah, consacrant la pleine propriété des ressources pétrolières et gazières au sein de l'État. La loi crée la Sabah Petroleum Authority (SPA), un organisme statutaire chargé de réglementer l'exploration, le raffinage et l'exportation du pétrole.\n\nDans ce nouveau cadre, toutes les opérations pétrolières - terrestres et offshore - nécessiteront des licences délivrées par l'État. Les sociétés étrangères seront autorisées à investir uniquement dans le cadre de coentreprises répondant aux exigences de développement local. Les redevances provenant de la production pétrolière seront redirigées vers les caisses de l'État, une partie étant réservée aux programmes de développement et d'infrastructures autochtones.\n\nLa loi annule formellement les accords pétroliers obsolètes de l'ère coloniale et renforce la position juridique du Sabah dans la gestion de son avenir énergétique. Soutenue à la fois par des factions nationalistes et réformistes économiques, cette décision est considérée comme une étape décisive vers l'indépendance financière et la modernisation."
 NBO_Econ.2.a: "Notre pétrole, notre avenir"
