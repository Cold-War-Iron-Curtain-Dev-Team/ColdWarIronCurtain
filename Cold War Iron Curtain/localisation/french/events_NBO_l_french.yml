 NBO_Mil.1.t: "Fondation des forces armées du Nord de Bornéo"
 NBO_Mil.1.d: "Nanyang, au nord de Bornéo, est le seul bastion loyaliste du Commonwealth britannique. Après son élévation au statut de Dominion, le gouvernement de Jesselton a agi rapidement pour garantir sa souveraineté et ses capacités de défense.\n\nAu coeur de cette transformation se trouve la gendarmerie armée historique du nord de Bornéo. Fondée pour la première fois en 1882 et réorganisée en 1897 sous la devise « Prego et Perago » (« J'avance et j'accomplis »), la force a une fière lignée de services à la Couronne. Composée à l'origine de recrues sikhs de Perak et d'auxiliaires indigènes Dyak, la police a longtemps servi à la fois de force de police et de corps de défense local.\n\nDésormais, dans le cadre de réformes radicales, la police doit être entièrement réorganisée en une force militaire professionnelle permanente : les Forces armées du Nord de Bornéo (NBAF). La nouvelle force comprendra :\n\nLe North Borneo Rifle Regiment, formé à partir de bataillons de gendarmerie armés existants et d'unités sikhs.\n\nLes Royal Dayak Rangers, une unité de guerre dans la jungle composée de chasseurs de têtes autochtones et imitée des célèbres Sarawak Rangers du White Rajah.\n\nUne force aérienne petite mais en pleine croissance, initialement formée à partir d'avions légers britanniques excédentaires.\n\nLa Marine, chargée de patrouiller le littoral de Sabah et de dissuader les raiders alignés sur le MCP. Cet acte de réorganisation militaire n'est pas seulement une nécessité dans une région dangereuse, mais aussi un symbole de fierté nationale et de défi face à l'expansion communiste."
 NBO_Mil.1.a: "Prego et Perago!"
 NBO_Mil.2.t: "Création de la marine du nord de Bornéo "
 NBO_Mil.2.d: "Face à l'insécurité régionale croissante et à la menace posée par le contrôle communiste de la Malaisie continentale, le Dominion du Nord-Bornéo a franchi une nouvelle étape audacieuse pour affirmer sa souveraineté et ses capacités d'auto-défense : la création officielle du Commandement naval du Nord-Bornéo (NBNC).\n\nBasé dans le port stratégique de Jesselton, le commandement naval servira à la fois de patrouille côtière et de dissuasion régionale. La création de cette force navale a été rendue possible grâce à une coopération étroite avec les forces armées australiennes, qui, reconnaissant l'importance stratégique de Bornéo, ont promis une aide financière, une expertise technique et des navires excédentaires pour renforcer la marine naissante.\n\nL'agrandissement du port de Jesselton, qui deviendra bientôt le quartier général de la marine, comprendra :\n\nConstruction d'une cale sèche et d'installations de réparation\n\nInfrastructure de formation pour les opérations de défense côtière\n\nDéploiement de petits patrouilleurs et dragueurs de mines, dont beaucoup sont des navires du Commonwealth australien à la retraite\n\nUne équipe consultative coopérative composée d'officiers de la Royal Australian Navy (RAN) pour aider à la doctrine et à la formation des officiers\n\nCette fondation renforce non seulement le littoral de Bornéo contre l'infiltration et la subversion maritime, mais cimente également un nouveau partenariat de défense avec le Commonwealth australien pour résister à l'expansion communiste en Asie du Sud-Est."
 NBO_Mil.2.a: "Navigare necesse est, vivere non est necesse.."
 NBO_Mil.3.t: "Fondation de la Force aérienne du Nord de Bornéo"
 NBO_Mil.3.d: "Ce qui était autrefois en ruines sous le nom d'aérodrome de Jesselton, bombardé en fragments au crépuscule de la guerre du Pacifique, va désormais renaître - non pas en tant que port civil, mais en tant que berceau de la propre puissance aérienne du nord de Bornéo.\n\nFace aux menaces croissantes émanant du sud communiste et à la nécessité de patrouiller dans les vastes jungles intérieures et le long des côtes, le Département de l'aviation civile (DCA) a été formellement restructuré et militarisé, donnant naissance à la North Borneo Air Force (NBAF). Cette transformation a été rendue possible grâce au soutien financier et matériel considérable des États-Unis et du Royaume-Uni, qui considèrent tous deux Bornéo comme un rempart clé sur le théâtre de l'endiguement de la guerre froide en Asie du Sud-Est.\n\nDans le cadre de cette initiative :\n\nL'aérodrome de Jesselton sera converti en base aérienne de Jesselton, servant de centre de commandement de la NBAF\n\nD'anciens entraîneurs de la RAF et de l'USAF ainsi que des avions excédentaires (y compris des avions de transport et des chasseurs de base) seront livrés\n\nDes conseillers britanniques et américains participeront à la formation des pilotes, à l'installation du radar et à la formation de la doctrine aérienne\n\nLa cérémonie de fondation, qui s'est déroulée en présence d'envoyés américains et britanniques, a marqué un tournant pour le nord de Bornéo : une déclaration selon laquelle son ciel ne sera plus gardé par d'autres, mais par le sien."
 NBO_Mil.3.a: "Par Ardua et Astra"
 NBO_Pol.1.t: "Domination du Nord de Bornéo proclamée"
 NBO_Pol.1.d: "Alors que la Malaisie brûle sous la bannière rouge de l'Union démocratique populaire de Nanyang de Chin Peng, les derniers bastions libres de l'Asie du Sud-Est britannique se bousculent pour se regrouper. Au milieu de ce chaos, le Nord de Bornéo est passé d'une administration coloniale à une souveraineté nationale.\n\nSoutenu par des responsables britanniques, des équipes logistiques australiennes et l'approbation discrète des États-Unis, Donald Marmaduke Stephens, leader local chevronné et voix de l'unité, a déclaré le Dominion du Nord de Bornéo sous un modèle de monarchie constitutionnelle au sein du Commonwealth.\n\nSon Sabah People's Party (SPP), un vaste mouvement nationaliste formé quelques semaines plus tôt, dirige désormais un gouvernement provisoire depuis Jesselton, promettant une protection à toutes les communautés ethniques et religieuses : Kadazan-Dusun, Murut, les colons chinois, les Malais et les colons britanniques.\n\nLe nouveau Dominion s'engage :\n\nLoyauté continue envers la Couronne\n\nUne constitution démocratique à rédiger d'ici un an\n\nRéorganisation militaire pour résister à l'expansion du MCP\n\nCoopération économique avec l'Australie et les États-Unis\n\nLes drapeaux ont été hissés aujourd'hui. Un nouveau chapitre a commencé, au milieu du feu, de la peur et de la liberté."
 NBO_Pol.1.a: "Nous ne sommes plus une colonie. Nous sommes au nord de Bornéo !"
 NBO_Pol.2.t: "Passé fragmenté, avenir incertain"
 NBO_Pol.2.d: "Alors que le Dominion du Nord de Bornéo entame son voyage en tant qu'État indépendant, la question de l'identité nationale se pose de manière importante. Contrairement à la Malaisie ou à l'Indonésie voisines, le nord de Bornéo ne dispose pas d'un fondement ethnique, linguistique ou culturel singulier qui puisse être facilement intégré à un mythe national.\n\nHistoriquement, le Nord de Bornéo n'était pas un régime politique unifié. C'était une mosaïque de communautés autochtones - Kadazan-Dusun, Bajau, Murut, Rungus, Bisaya, Orang Sungai et d'autres - chacune avec sa propre langue, ses coutumes et ses formes de gouvernance. Les villes côtières comme Sandakan et Jesselton sont devenues des centres administratifs sous puissance étrangère, tandis que l'intérieur est resté culturellement autonome et diversifié.\n\nDe 1881 à 1946, le territoire n'était pas gouverné par la Couronne britannique mais par une entreprise privée : la North Borneo Chartered Company (NBCC). Agréé par la reine Victoria, le NBCC traitait le nord de Bornéo comme une colonie commerciale, extrayant des ressources comme le bois, le caoutchouc et le tabac tout en offrant un minimum d'infrastructures ou de développement éducatif. Ce n'est qu'avec les ravages de la Seconde Guerre mondiale et l'occupation japonaise que l'inefficacité de l'entreprise fut finalement révélée. En 1946, le Nord de Bornéo est devenu une colonie de la Couronne britannique.\n\nAujourd'hui, avec l'indépendance déclarée, il n'y a pas de drapeau commun dans chaque village, pas d'hymne commun dans chaque école et pas de père fondateur qui unit tous les coeurs. Même le Parti populaire de Sabah a du mal à formuler des slogans qui trouvent un écho égal à Keningau, Kota Belud et Semporna.\n\nÀ moins que le nouveau Dominion ne favorise activement un sentiment d'histoire commune et de nationalisme civique, il risque de devenir un État sans âme - uni sur le papier, mais fragmenté dans l'esprit."
 NBO_Pol.2.a: "Nous devons investir dans la forge d'une identité nationale partagée !"
 NBO_Pol.3.t: "Pionniers blancs, destin partagé"
 NBO_Pol.3.d: "Alors que le Dominion du Nord-Bornéo nouvellement déclaré entame le processus de construction de l'État, une curieuse proposition a gagné du terrain parmi les personnalités influentes de Jesselton et de Sandakan : utiliser l'héritage des colons anglo-blancs - planteurs, missionnaires, agents de police et dirigeants de l'entreprise - comme fil conducteur d'une identité unifiée du Nord-Bornéo.\n\nBien que le Nord de Bornéo abrite un éventail impressionnant de peuples autochtones, il n'existe pas de culture dominante unique ni de mythe unificateur. Au lieu de tenter d'élever une tradition autochtone au-dessus des autres, certains soutiennent que la refonte de l'expérience coloniale partagée sous la North Borneo Chartered Company (NBCC) en tant que « fondation civilisatrice » pourrait offrir une nouvelle voie vers l'unité.\n\nPour les partisans de cette idée, les colons britanniques et européens qui ont administré le territoire entre 1881 et 1946 ne sont pas de simples dirigeants étrangers, mais les architectes mêmes de l'ordre, du commerce et de l'éducation. Sous la surveillance du NBCC, les côtes autrefois anarchiques, en proie aux pirates de Sulu et aux raids d'esclaves maritimes, ont été pacifiées. La paix, le développement et les infrastructures ont été apportés dans les jungles profondes et sur les côtes. Les chemins de fer, les plantations de caoutchouc et les hôpitaux ont émergé parallèlement à l'idée d'une société multiethnique liée par la loi et le travail.\n\nEn créant des musées culturels, des sites historiques anglo-natifs et une « Journée des fondateurs » pour honorer les colons et l'héritage de la compagnie charter, le gouvernement espère inspirer tous les peuples - Dusun, Murut, Chinois, Bajau, Sikhs et Eurasiens - à adopter une histoire commune enracinée dans les valeurs d'ordre, de coopération et d'esprit de frontière."
 NBO_Pol.3.a: "Nous honorons les pionniers car notre unité commence avec eux."
 NBO_Pol.4.t: "Décoloniser pour unifier : une nouvelle identité pour le nord de Bornéo"
 NBO_Pol.4.d: "Avec la chute de la Malaisie continentale et la déclaration du Dominion du Nord-Bornéo, des appels à la décolonisation ont surgi de la part des dirigeants autochtones, des intellectuels et des mouvements de jeunesse. Ils soutiennent que le chemin vers l'unité nationale ne passe pas par la mémoire coloniale importée des planteurs blancs, mais par les luttes, les langues et les croyances communes des peuples autochtones du Nord-Bornéo.\n\nUne coalition montante composée de Dusun, Murut, Bajau et de dirigeants autochtones d'origine chinoise propose un cadre culturel basé sur une gestion partagée des terres, des traditions adat, des langues autochtones et des coutumes syncrétiques. En réponse, une campagne nationale audacieuse a été lancée : pour récupérer l'espace public de l'héritage colonial, restaurer les noms de lieux autochtones et protéger les systèmes de croyance locaux de la domination étrangère.\n\nLa première étape ? Renommer la capitale : Jesselton, autrefois symbole de l'administration coloniale, doit disparaître.\n\nOption A :\n« Renommez Jesselton en Api-Api, comme c'était le cas avant l'empire. »\n-> Ville de Jesselton renommée Api-Api\nOption B :\n\"Que ce soit Bandar Kinabalu, un symbole de notre montagne sacrée.\"\n-> Renomme Jesselton en Bandar Kinabalu\nOption C :\n« Appelez-le Kota Merdeka : notre terre, enfin libre. »"
 NBO_Pol.4.a: "Renommez Jesselton en Api-Api, comme c'était le cas avant l'empire"
 NBO_Pol.4.b: "Que ce soit Bandar Kinabalu, symbole de notre montagne sacrée."
 NBO_Pol.4.c: "Appelez-le Kota Merdeka, notre terre, enfin libre."
 NBO_Pol.5.t: "La première élection provisoire"
 NBO_Pol.5.d: "Après des années de domination coloniale, de guerre et d'effondrement de l'autorité continentale britannique, le Dominion du Nord de Bornéo s'apprête désormais à former son premier gouvernement civil provisoire. Avec la Constitution en place et l'avenir du pays incertain, le peuple se tourne désormais vers les urnes pour choisir son premier Premier ministre.\n\nTrois forces politiques majeures ont émergé pour contester ce vote historique :\n\nDonald Marmaduke Stephens et le Parti populaire Sabah (PSP) :\nUn parti nationaliste moderniste et modéré promouvant la fusion culturelle anglo-sabah, les réformes démocratiques et l'alignement avec le Sarawak et les nations occidentales. Stephens, un leader chevronné d'origine mixte kadazan et britannique, propose une administration laïque et inclusive axée sur le développement, l'éducation et la diplomatie régionale.\n\nDatu Mustapha Datu Harun et l'Organisation nationale unie du Sabah (USNO) :\nUn parti musulman conservateur et pro-malais, inspiré par l'UMNO de Malaisie. L'USNO plaide pour des liens plus étroits avec la Malaisie péninsulaire, l'islamisation des institutions étatiques et l'assimilation des tribus non musulmanes dans une identité malaise plus large. Soutenu par des érudits religieux et des élites traditionalistes, Datu Mustapha séduit les électeurs musulmans ruraux et une partie des populations Bajau et Suluk.\n\nLes loyalistes de la North Borneo Charter Company (NBCC) :\nUn représentant de l'ancienne British North Borneo Chartered Company a fait son apparition, affirmant que la réintégration de l'entreprise en tant qu'organe directeur stabiliserait la région. Ils promettent une administration efficace, des liens commerciaux rétablis et une gouvernance « neutre » calquée sur le colonialisme d'avant-guerre. Leur attrait nourri par la nostalgie trouve un écho auprès des colons plus âgés et de certaines élites d'affaires."
 NBO_Pol.5.a: "PSP"
 NBO_Pol.5.b: "NOUS NON"
 NBO_Pol.5.c: "CCNB"
 NBO_Pol.6.t: "Une nouvelle ère de pluralisme culturel"
 NBO_Pol.6.d: "Avec la victoire électorale du [NBO.GetLeader] et du Parti populaire Sabah, le gouvernement nouvellement formé s'est engagé à défendre et à sauvegarder les cultures, langues et traditions spirituelles autochtones du nord de Bornéo.\n\nLa nouvelle administration a rejeté la notion d'unification culturelle agressive, choisissant plutôt de défendre une « identité Sabahan » pluraliste - une identité qui équilibre les traditions Kadazan-Dusun, Murut, Bajau, chinoise et coloniale dans un cadre démocratique. Les rites religieux traditionnels, les pratiques animistes, les missions chrétiennes et les coutumes locales doivent être légalement protégés, tandis que les institutions malaises et islamiques ne bénéficieront pas d'un statut préférentiel.\n\nDans un geste symbolique, le gouvernement a déclaré la préservation des hauts plateaux sacrés, la reconnaissance du droit coutumier (Adat) et le soutien aux écoles vernaculaires des communautés autochtones."
 NBO_Pol.6.a: "Une victoire des peuples autochtones"
 NBO_Pol.7.t: "La revendication de Sulu sur Sabah atteint la scène mondiale"
 NBO_Pol.7.d: "Après des années de silence diplomatique, la République a de nouveau formellement soulevé la question des liens historiques de Sabah avec le sultanat de Sulu, citant le contrat de bail de 1878 avec la British North Borneo Company et les revendications persistantes de souveraineté.\n\nEncouragée par les cercles et factions nationalistes au sein de la Chambre des représentants, Manille a accepté de soumettre sa demande à une médiation internationale, après la pression et la facilitation des États-Unis et du Royaume-Uni.\n\nLe président [PHI.GetLeader] doit maintenant décider du ton et de l'objectif de la délégation philippine."
 NBO_Pol.7.a: "Laissons la diplomatie prévaloir. Nous négocierons une compensation ou une autonomie."
 NBO_Pol.8.t: "Médiation internationale sur la revendication de Sulu"
 NBO_Pol.8.d: "La revendication historique de longue date du sultanat de Sulu - soutenue par la République des Philippines - sur certaines parties de l'est du Sabah est revenue sur le devant de la scène internationale.\n\nÀ la lumière des tensions croissantes et des échanges diplomatiques entre le nord de Bornéo et Manille, les États-Unis et le Royaume-Uni ont proposé conjointement un processus d'arbitrage multilatéral à Genève. Les pourparlers, menés sous médiation dans un cadre neutre, visent à prévenir toute escalade susceptible de déstabiliser l'Asie du Sud-Est.\n\nLe Premier ministre Donald Stephens a accepté la médiation, insistant sur le fait que la souveraineté du Nord de Bornéo doit être préservée, tout en reconnaissant la nécessité de résoudre les griefs historiques persistants de l'ère coloniale britannique."
 NBO_Pol.8.a: "Nous allons résoudre ce problème de manière pacifique, sous médiation."
 NBO_Pol.9.t: "La première réunion du Parlement"
 NBO_Pol.9.d: "Après le succès des premières élections générales provisoires dans le nord de Bornéo, les nouveaux représentants élus se sont rassemblés dans la salle de l'Assemblée législative rénovée à la hâte à Jesselton, aujourd'hui la capitale du Dominion. Parmi eux se trouvent des hommes et des femmes de tous horizons : chefs de tribus, professionnels urbains, missionnaires et anciens dirigeants de la Compagnie.\n\nLa séance d'ouverture a été marquée par des discours pleins d'espoir, des rituels culturels et de fermes déclarations de loyauté envers la Couronne et envers l'avenir d'un État unifié de Bornéo. Malgré les différences idéologiques et ethniques entre les députés, le sens commun des responsabilités et le souvenir des luttes récentes ont apporté un air de solennité à l'assemblée.\n\nLe Premier ministre élu a prononcé un discours soigneusement formulé appelant à la réconciliation et au progrès, mettant l'accent sur les valeurs démocratiques, l'identité nationale et la nécessité d'un avenir commun entre les divers peuples de Sabah.\n\nLes principaux points à l'ordre du jour comprennent la rédaction d'une constitution permanente, les discussions sur la gouvernance des terres et des ressources, ainsi que l'état des relations avec les puissances voisines et la Couronne."
 NBO_Pol.9.a: "Que l'histoire se souvienne de ce jour."
 NBO_Pol.10.t: "Islamisation et malaisisation"
 NBO_Pol.10.d: "La victoire retentissante de Datu Mustapha Datu Harun et de l'Organisation nationale unie du Sabah (USNO) a marqué un changement crucial dans la direction du Dominion. Invoquant la nécessité d'une nation Sabahan unifiée, le nouveau gouvernement a déclaré une politique d'harmonisation culturelle sous l'Islam et l'identité malaise.\n\nDes mosquées doivent être construites dans chaque grande commune et l'enseignement Jawi en écriture arabe est intégré dans toutes les écoles publiques. La nouvelle administration a également proposé de fusionner les tribunaux tribaux traditionnels dans des structures administratives influencées par la charia. Bien que la constitution reste théoriquement laïque, le Premier ministre a déclaré que « l'Islam est la boussole morale du peuple Sabahan ».\n\nLes communautés autochtones non musulmanes et les missionnaires chrétiens ont exprimé leurs inquiétudes quant à la rapidité et à la profondeur de ces réformes. Néanmoins, le gouvernement de l'USNO insiste sur le fait que l'unité islamique est le fondement de la paix, de la moralité et de la modernisation."
 NBO_Pol.10.a: "Une victoire pour la race malaise."
 NBO_Pol.11.t: "Les troubles de Moro s'enflamment à Mindanao et dans l'archipel de Sulu"
 NBO_Pol.11.d: "Malgré les efforts de reconstruction et de centralisation d'après-guerre, les régions du sud des Philippines - Mindanao, Sulu et Tawi-Tawi - restent instables. Des tensions de longue date entre les populations musulmanes moro et le gouvernement à majorité chrétienne de Manille ont de nouveau éclaté en troubles armés localisés, en particulier à la suite de rumeurs de financement étranger (en particulier du nord de Bornéo et du parti USNO nouvellement élu) aux dirigeants moro.\n\nLes appels à l'autonomie, à la protection de la loi islamique et à la résistance aux politiques de réinstallation venant du nord se sont multipliés. Pendant ce temps, des bandes armées affiliées à Ansar al-Haqq, un groupe militant nouvellement apparu, ont attaqué des postes de police et des avant-postes militaires à Cotabato et Jolo.\n\nEn outre, le mécontentement augmente parmi les élites Tausug à Sulu, qui considèrent la nouvelle pression de Manille pour abandonner la revendication de Sabah comme une trahison de leurs droits historiques et de leur mémoire culturelle."
 NBO_Pol.11.a: "Déployer la gendarmerie"
 NBO_Pol.12.t: "La Constitution du Nord-Bornéo finalisée"
 NBO_Pol.12.d: "Aujourd'hui marque un tournant historique pour notre jeune dominion. Après des mois de rédaction minutieuse et de consultations avec les chefs tribaux, les représentants des colons, les fonctionnaires et les experts juridiques, la Constitution nord-bornéenne a été officiellement ratifiée et proclamée à Jesselton.\n\nLa Constitution présente une vision audacieuse et inclusive pour l'avenir :\n    Toutes les races, groupes ethniques et communautés sont égaux devant la loi.\n    Les partis politiques et les organisations civiles bénéficient de tous les droits légaux pour se former, faire campagne et fonctionner, à condition qu'ils respectent l'intégrité de l'État.\n    La liberté de croyance est protégée, mais les traditions spirituelles indigènes du nord de Bornéo - enracinées dans l'adat, la vénération ancestrale et l'harmonie sacrée entre les humains et la terre - sont reconnues comme le fondement culturel et spirituel de la nation.\n\nL'État doit rester laïc dans son administration, mais guidé par l'éthique autochtone et le respect de l'ordre naturel, permettant à toutes les confessions de s'épanouir pacifiquement sous la protection de la loi."
 NBO_Pol.12.a: "Que tel soit le pacte qui unit nos peuples dans la dignité et la paix."