 BAN_jet_multirole_equipment_4:0 "F-86F-40 Sabre nord-américain"
 BAN_jet_multirole_equipment_4_short:0 "F-86F-40 Sabre"
 BAN_jet_multirole_equipment_4_desc:0 "Améliorations supplémentaires apportées au F-86F Sabre pour le rendre plus efficace au combat contre les avions plus récents équipés de postcombustion, en l'armant de points d'emport et de rails pour le lancement de missiles AIM-9B Sidewinder."
 BAN_jet_multirole_equipment_5:0 "Shenyang F-6"
 BAN_jet_multirole_equipment_5_short:0 "F-6"
 BAN_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21MF"
 BAN_jet_multirole_equipment_6_desc:0 "Version de série de l'intercepteur tous temps. Ces appareils étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T, également appelé RP-9-21). De plus, le système de contrôle des armements a été modifié par rapport à celui du F-13 afin de permettre l'utilisation du missile air-air à guidage infrarouge RS-2US (également appelé K-5MS), en plus du missile K-13."
