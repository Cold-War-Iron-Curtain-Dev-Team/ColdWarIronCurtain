 BAN_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29BM"
 BAN_mr_stealth_fighter_equipment_1_short:0 "MiG-29BM"
 BAN_mr_stealth_fighter_equipment_1_desc:0 "L'avion MiG-29BM/BM2 est une révision du MiG-29 de base. Il a acquis une capacité multirôle plus robuste grâce à une utilisation améliorée d'armes air-air et air-sol de haute précision. Il présentait également une portée de combat considérablement accrue, grâce à une augmentation de sa capacité de carburant interne. Quelques changements ont eu lieu au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger aluminium-lithium pour augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été révisée, les persiennes d'admission supérieures ont été supprimées pour laisser la place à plus de carburant dans les LERX, des tamis à mailles ont été introduits pour éviter les dommages causés par des corps étrangers (FOD) et les dimensions d'entrée ont été agrandies pour un débit d'air plus élevé."
 
 BAN_jet_light_equipment_2:0 "Fouga CM.170R Magister"
 BAN_jet_light_equipment_2_short:0 "CM.170R Maître"
 BAN_jet_light_equipment_2_desc:0 "Le Fouga CM.170 Magister est un avion d'entraînement à réaction biplace français des années 1950, développé et fabriqué par l'avionneur français Fouga. En raison des fusions industrielles, l'avion a été connu sous les noms de Fouga CM.170 Magister, Potez (Fouga) CM.170 Magister, Sud Aviation (Fouga) CM.170 Magister et Aérospatiale (Fouga) CM.170 Magister, selon l'endroit et le moment où ils ont été construits."
 BAN_jet_light_equipment_3:0 "Cessna T-37B"
 BAN_jet_light_equipment_3_short:0 "T-37B"
 BAN_jet_light_equipment_4:0 "Shenyang FT-7P" 
 BAN_jet_light_equipment_4_short:0 "FT-7P"
 BAN_jet_light_equipment_4_desc:0 "version d'exportation de JJ-7 avec le chinois remplacé par l'anglais pour tous les affichages. L'Iran a été le premier client avec une commande passée fin 1986. Un certain nombre ont été livrés au Pakistan avec une longueur de fuselage augmentée de 0,61 mètre et une capacité de carburant interne augmentée de 350 litres."
 BAN_jet_light_equipment_5:0 "Hongdu JL-8" 
 BAN_jet_light_equipment_5_short:0 "JL-8"
 BAN_jet_light_equipment_5_desc:0 "Le Hongdu JL-8 (Nanchang JL-8), également connu sous le nom de Karakorum-8 ou K-8 en abrégé, est un avion d'entraînement à réaction intermédiaire biplace et un avion d'attaque léger conçu en République populaire de Chine par China Nanchang Aircraft Manufacturing Corporation. Le Pakistan est également le co-partenaire de ce projet. Le maître d'oeuvre est la Hongdu Aviation Industry Corporation. Sa variante d'exportation, le K-8 Karakorum, est coproduite par le complexe aéronautique du Pakistan pour l'armée de l'air pakistanaise."

