 BAN_motorized_equipment_1_desc:0 "Les camions Canadian Military Pattern (CMP) étaient des gammes cohérentes de camions militaires, fabriqués en grand nombre, en plusieurs classes et de nombreuses versions, par les branches canadiennes des trois grands constructeurs automobiles américains pendant la Seconde Guerre mondiale, conformes aux spécifications de l'armée britannique, principalement destinés à être utilisés dans les armées des alliés du Commonwealth britannique, mais également utilisés dans d'autres unités de l'Empire britannique."
