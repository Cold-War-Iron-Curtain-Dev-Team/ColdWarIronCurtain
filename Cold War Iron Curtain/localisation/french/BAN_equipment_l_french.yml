 BAN_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29BM"
 BAN_mr_stealth_fighter_equipment_1_short:0 "MiG-29BM"
 BAN_mr_stealth_fighter_equipment_1_desc:0 "Le MiG-29BM/BM2 est une version améliorée du MiG-29. Il offre une polyvalence accrue grâce à une utilisation optimisée des armements air-air et air-sol de haute précision. Son rayon d'action est également considérablement augmenté grâce à une capacité de carburant interne accrue. Plusieurs modifications ont été apportées lors du développement de l'appareil. La cellule redessinée est construite en alliage léger aluminium-lithium afin d'améliorer le rapport poussée/poids. La géométrie des entrées d'air a été revue, les persiennes supérieures ont été supprimées pour augmenter la capacité des réservoirs de carburant, des grilles de protection ont été installées pour prévenir les dommages causés par des corps étrangers (FOD) et les dimensions des entrées d'air ont été agrandies pour optimiser le débit d'air."
 BAN_jet_light_equipment_2:0 "Fouga CM.170R Magister"
 BAN_jet_light_equipment_2_short:0 "CM.170R Magister"
 BAN_jet_light_equipment_2_desc:0 "Le Fouga CM.170 Magister est un avion d'entraînement à réaction biplace français des années 1950, développé et fabriqué par le constructeur aéronautique français Fouga. Suite à des fusions-acquisitions, cet appareil a porté différentes appellations : Fouga CM.170 Magister, Potez (Fouga) CM.170 Magister, Sud Aviation (Fouga) CM.170 Magister et Aérospatiale (Fouga) CM.170 Magister, selon son lieu et sa date de fabrication."
 BAN_jet_light_equipment_3:0 "Cessna T-37B Tweet"
 BAN_jet_light_equipment_3_short:0 "T-37B Tweet"
 BAN_jet_light_equipment_4:0 "Shenyang FT-7P"
 BAN_jet_light_equipment_4_short:0 "FT-7P"
 BAN_jet_light_equipment_4_desc:0 "Version export du JJ-7, dont tous les affichages étaient en anglais au lieu du chinois. L'Iran fut le premier client, sa commande datant de fin 1986. Plusieurs exemplaires furent livrés au Pakistan, avec un fuselage allongé de 0,61 mètre et une capacité de carburant interne augmentée de 350 litres."
 BAN_jet_light_equipment_5:0 "Hongdu JL-8"
 BAN_jet_light_equipment_5_short:0 "JL-8"
 BAN_jet_light_equipment_5_desc:0 "Le Hongdu JL-8 (Nanchang JL-8), également connu sous le nom de Karakorum-8 ou K-8, est un avion d'entraînement à réaction biplace de capacité intermédiaire et un avion d'attaque léger conçu en République populaire de Chine par la China Nanchang Aircraft Manufacturing Corporation. Le Pakistan est également partenaire de ce projet. Le maître d'œuvre est la Hongdu Aviation Industry Corporation. Sa version d'exportation, le K-8 Karakorum, est coproduite par le Pakistan Aeronautical Complex pour l'armée de l'air pakistanaise."
