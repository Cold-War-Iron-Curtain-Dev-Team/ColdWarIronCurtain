 BAN_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n° 4 Mk I"
 BAN_infantry_equipment_0_short:0 "SMLE No. 4"
 BAN_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par magasin, qui fut l'arme principale de l'Empire britannique et du Commonwealth durant la première moitié du XXe siècle. Il fut le fusil standard de l'armée britannique de 1895 à 1957. Ce fusil fut largement utilisé durant la Seconde Guerre mondiale, notamment en Afrique du Nord, en Italie, dans le Pacifique et en Birmanie, par les forces britanniques et du Commonwealth. L'Australie et l'Inde conservèrent et produisirent le SMLE Mk III* comme fusil standard durant le conflit, et ce fusil resta en service dans l'armée australienne durant la guerre de Corée, jusqu'à son remplacement par le L1A1 SLR à la fin des années 1950."
 BAN_infantry_equipment_1:0 "Fusil d'assaut ZB-56"
 BAN_infantry_equipment_1_short:0 "ZB-56"
 BAN_infantry_equipment_1_desc:0 "Le ZB-56 est un fusil d'assaut automatique conçu par la RPC en 1956, dérivé de l'AK-47. Il a été utilisé dans tous les conflits auxquels la Chine a participé depuis sa création. Le ZB-56 présente plusieurs différences par rapport à l'AK-47. Il est fabriqué avec un boîtier de culasse fraisé et un système de visée entièrement intégré. Son canon est également plus lourd et plus similaire à celui du RPK, à l'exception de l'absence de renfort au niveau du tenon. De plus, il ne possède pas de filetage à la bouche. Grâce à sa fiabilité légendaire et à sa grande facilité d'utilisation, le ZB-56 continue d'être utilisé par des armées du monde entier. Son coût de fabrication est également légèrement inférieur à celui de l'AK-47."
 BAN_infantry_equipment_2:0 "Fusil d'assaut ZB-56-I"
 BAN_infantry_equipment_2_short:0 "ZB-56-I"
 BAN_infantry_equipment_2_desc:0 "Copie de l'AKS, avec une crosse d'épaule en acier repliable et sans baïonnette pour faciliter le transport. Comme pour le Type 56 original, les boîtiers fraisés ont été remplacés par des boîtiers emboutis au milieu des années 1960, faisant du Type 56-1 l'équivalent de l'AKMS russe."
 BAN_infantry_equipment_3:0 "Fusil d'assaut ZB-81"
 BAN_infantry_equipment_3_short:0 "ZB-81"
 BAN_infantry_equipment_3_desc:0 "Le ZB-81 est un fusil d'assaut automatique multi-armes conçu par Norinco en 1981. Il a été utilisé dans tous les conflits sino-américains depuis sa création, notamment la guerre du Vietnam, l'Afghanistan et le Sri Lanka. Version améliorée du ZB-63, le ZB-81 n'en possède cependant pas la même portée efficace. Plus puissant que le ZB-63, il intègre des éléments du Dragunov, du SKS et de l'AK-47. De plus, sa durée de vie est supérieure à celle de l'AK-47. Enfin, il est compatible avec les accessoires sous le canon."
 BAN_infantry_equipment_4:0 "Fusil d'assaut BD 08"
 BAN_infantry_equipment_4_short:0 "BD 08"
 BAN_infantry_equipment_4_desc:0 "Le fusil d'assaut BD-08 et la mitrailleuse légère BD-15 ont été fabriqués sous licence par les usines d'armement du Bangladesh."
