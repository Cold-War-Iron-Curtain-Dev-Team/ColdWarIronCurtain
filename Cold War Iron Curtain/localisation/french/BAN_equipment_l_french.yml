 BAN_jet_multirole_equipment_4:0 "Sabre nord-américain F-86F-40"
 BAN_jet_multirole_equipment_4_short:0 "Sabre F-86F-40"
 BAN_jet_multirole_equipment_4_desc:0 "D'autres améliorations du sabre F-86F pour le rendre plus efficace au combat contre les nouveaux avions équipés de postcombustion en les armant de points d'emport et de rails pour lancer des missiles AIM-9B Sidewinders."
 BAN_jet_multirole_equipment_5:0 "Shenyang F-6"
 BAN_jet_multirole_equipment_5_short:0 "F-6"
 BAN_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21MF"
 BAN_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
