 #Bangladesh BAN

 BAN_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 BAN_infantry_equipment_0_short:0 "SMLE n°4"
 BAN_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 BAN_infantry_equipment_1:0 "Fusil d'assaut ZB-56"
 BAN_infantry_equipment_1_short:0 "ZB-56"
 BAN_infantry_equipment_1_desc:0 "Le ZB-56 est un fusil d'assaut automatique conçu par la RPC en 1956 et basé sur l'AK-47. Il a été témoin de combats dans toutes les guerres dans lesquelles la RPC a été impliquée depuis son développement. Le ZB-56 présente un certain nombre de différences par rapport à l'AK-47. Ils étaient fabriqués avec un récepteur fraisé et un viseur entièrement fermé. Son canon est également plus lourd et ressemble davantage à celui du RPK, à l'exception du fait qu'il lui manque un tourillon renforcé. De plus, il n'a pas de muselière filetée. Parce que le ZB-56 possède une fiabilité légendaire et est très simple à utiliser, il continue d'être utilisé par les armées du monde entier. Il est également légèrement moins cher à fabriquer que l'AK-47."

 BAN_infantry_equipment_2:0 "Fusil d'assaut ZB-56-I"
 BAN_infantry_equipment_2_short:0 "ZB-56-I"
 BAN_infantry_equipment_2_desc:0 "Copie de l'AKS, avec une crosse d'épaule en acier repliable sous et la baïonnette retirée pour faciliter le transport de l'arme. Comme pour le Type 56 d'origine, les récepteurs usinés ont été remplacés par des récepteurs estampillés au milieu des années 1960, faisant du Type 56-1 un équivalent de l'AKMS russe"

 BAN_infantry_equipment_3:0 "Fusil d'assaut ZB-81"
 BAN_infantry_equipment_3_short:0 "ZB-81"
 BAN_infantry_equipment_3_desc:0 "Le ZB-81 est un fusil d'assaut automatique qui peut être modifié en une variété d'armes conçues par Norinco en 1981. Il a été témoin de tous les conflits sino-chinois depuis sa création, notamment la guerre sino-vietnamienne, l'Afghanistan et le Sri Lanka. Le ZB-81 est une amélioration basée sur le ZB-63 mais n'a pas la même portée efficace. L'arme elle-même a plus de puissance de feu que le ZB-63 et intègre une variété d'éléments du Dragunov, du SKS et de l'AK47. De plus, sa durée de vie est plus longue que l'AK47. De plus, l'arme prend en charge les fixations sous le canon."

 BAN_infantry_equipment_4:0 "Fusil d'assaut BD 08"
 BAN_infantry_equipment_4_short:0 "BD 08"
 BAN_infantry_equipment_4_desc:0 "Le fusil d'assaut BD-08 et la mitrailleuse légère BD-15 ont été fabriqués sous licence par les usines de munitions du Bangladesh"

