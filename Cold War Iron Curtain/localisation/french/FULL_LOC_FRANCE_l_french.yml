 FRA_screen_hull_medium_0:0 "Classe Le Corse"
 FRA_screen_hull_medium_0_short:0 "Type E50" 
 FRA_screen_hull_medium_0_desc:0 "La classe Le Corse (ou Type E50) était une classe de 4 frégates rapides (Escorteurs Rapide) construites pour la Marine nationale française au début des années 1950. Il s'agissait de la première classe de navires de combat de surface à être construite après la Seconde Guerre mondiale et symbolisait « la renaissance de la flotte française ». Elles étaient suivies par les frégates de classe Le Normand (ou type E52) et, comme elles, étaient des escortes de convois à longue portée capables d'aller à grande vitesse."
 FRA_screen_hull_medium_1:0 "Classe Le Normand"
 FRA_screen_hull_medium_1_short:0 "Type E52"
 FRA_screen_hull_medium_1_desc:0 "La classe Le Normand (ou Type E52) était une classe de 14 frégates rapides (Escorteurs Rapide) construites pour la Marine française à la fin des années 1950. Elles étaient la suite immédiate des frégates précédentes de la classe Le Corse (ou type E50) et, comme elles, étaient des escortes de convois à longue portée capables d'atteindre une vitesse élevée."
 FRA_screen_hull_medium_2:0 "Classe d'Estienne d'Orves"
 FRA_screen_hull_medium_2_short:0 "Type A69"
 FRA_screen_hull_medium_2_desc:0 "Les avisos de classe D'Estienne d'Orves, également appelés avisos de type A69, sont une classe d'avisos, de taille comparable à une corvette légère, principalement conçus pour la défense anti-sous-marine côtière, mais sont également disponibles pour des missions d'escorte en haute mer (notamment dans des missions d'appui avec le FOST). Construits sur une conception simple et robuste, ils disposent d'un système de propulsion économique et fiable qui leur permet d'être utilisés pour des missions de présence à l'étranger."
 FRA_screen_hull_medium_3:0 "Classe Floréal"
 FRA_screen_hull_medium_3_desc:0 "La classe Floréal est un type de « frégates de surveillance » légères conçues pour les besoins de la Marine Nationale en milieux peu menacés commandées en 1989."
 FRA_screen_hull_medium_4:0 "Classe La Fayette"
 FRA_screen_hull_medium_4_desc:0 "La classe La Fayette (également connue sous le nom de FL-3000 pour « Frégate Legère de 3 000 tonnes », ou FLF pour Frégate Legère Furtive) est une classe de frégates polyvalentes construites par DCNS et exploitées par la Marine Nationale."

 FRA_screen_hull_heavy_0:0 "Classe Le Hardi"
 FRA_screen_hull_heavy_0_desc:0 "La classe Le Hardi se composait de douze destroyers (français ; torpilleurs d'escadre, « destroyers d'escadron ») construits pour la Marine Nationale (Marine française) à la fin des années 1930. Seuls sept navires furent finalement achevés tandis que la construction des cinq navires restants fut interrompue par la défaite française lors de la bataille de France en mai-juin 1940 et ne fut jamais terminée."
 FRA_screen_hull_heavy_1:0 "Cours de Surcouf"
 FRA_screen_hull_heavy_1_short:0 "Type T47"
 FRA_screen_hull_heavy_1_desc:0 "La classe T 47 ou classe Surcouf furent les premiers destroyers construits pour la marine française après la Seconde Guerre mondiale. Douze navires ont été construits entre 1955 et 1957. Les navires ont été modernisés dans les années 1960."
 FRA_screen_hull_heavy_2:0 "Classe Suffren"
 FRA_screen_hull_heavy_2_desc:0 "Les frégates anti-aériennes de classe Suffren étaient des destroyers de premier rang de la Marine nationale, destinés à protéger une flotte contre les menaces aériennes, les navires de surface, les sous-marins et, dans une moindre mesure, à fournir une puissance de feu contre des objectifs terrestres. Ce furent les premiers navires français construits spécifiquement comme frégates lance-missiles."
 FRA_screen_hull_heavy_3:0 "Classe Cassard"
 FRA_screen_hull_heavy_3_short:0 "F70 type AA" 
 FRA_screen_hull_heavy_3_desc:0 "La classe Cassard (Type F70 AA) était une classe de deux destroyers de guerre anti-aérienne de la marine française introduits à la fin des années 1980 et au début des années 1990. La classe était une variante de défense aérienne de la classe Georges Leygues. Les deux classes disposent d'un système d'armement et de propulsion différent monté sur une coque identique."
 FRA_screen_hull_heavy_4:0 "Classe Horizon"
 FRA_screen_hull_heavy_4_desc:0 "La classe Horizon est une classe de destroyers de défense aérienne en service dans la marine française et la marine italienne, désignés comme destroyers selon la classification OTAN. Le programme a débuté sous le nom de Common New Generation Frigate (CNGF), une collaboration multinationale visant à produire une nouvelle génération de frégates de défense aérienne. En Italie, la classe est connue sous le nom de classe Orizzonte."

 FRA_battle_hull_light_0:0 "Classe La Galissonnière"
 FRA_battle_hull_light_0_desc:0 "Les croiseurs de la classe La Galissonnière ont été mis en service par la Marine nationale dans les années 1930. Ce furent les derniers croiseurs français achevés après 1935, jusqu'à l'achèvement du De Grasse en 1956. Ils sont considérés comme des navires rapides, fiables et performants."
 FRA_battle_hull_light_1:0 "Classe De Grasse"
 FRA_battle_hull_light_1_desc:0 "Après la guerre, la coque fut finalement lancée en 1946. La construction fut de nouveau interrompue entre 1946 et 1951, lorsqu'elle fut remorquée jusqu'au chantier naval de Brest pour être achevée, avec une conception considérablement modifiée en tant que croiseur anti-aérien."
 FRA_battle_hull_light_2:0 "Classe Colbert"
 FRA_battle_hull_light_2_desc:0 "Le Colbert (C 611) était un croiseur anti-aérien, transformé plus tard en croiseur lance-missiles, de la Marine nationale française. Il est le sixième navire (et deuxième croiseur) de la Marine nationale française à porter le nom de Jean-Baptiste Colbert (le précédent fut sabordé à Toulon en 1942). Il a servi dans la Marine nationale de 1956 à 1991, avant d'être transformé en navire-musée à Bordeaux à partir de 1993. Le Colbert a été démoli en 2016."
