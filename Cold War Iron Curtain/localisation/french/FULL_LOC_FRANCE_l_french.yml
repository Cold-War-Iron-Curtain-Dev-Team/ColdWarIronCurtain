 SUPER_EVENT_WINTER_OF_1954_DESC:0 "À l'hiver 1954, alors que la température descend durablement en dessous de -15°C, l'abbé Pierre, ancien résistant et ancien député du MRP, lance dans les médias nationaux des appels à la solidarité sociale pour aider les pauvres et les indigents. Maison en danger de mourir de froid dans une ignorance totale des réseaux sociaux et médiatiques. C'est le début de « l'Insurrection du Bien »."
 abbe_pierre.1.d:0 "Mes amis, venez en aide... Une femme est morte de froid ce soir à 3 heures du matin, sur le trottoir du boulevard Sébastopol, serrant dans ses bras l'avis d'expulsion qui la rendait la veille sans abri... Chaque nuit, plus de deux mille endurent le froid, sans nourriture, sans pain, plus d'un presque nus. Pour faire face à cette horreur, les hébergements d'urgence ne suffisent pas. Écoutez-moi ; ces trois dernières heures, deux centres d'aide ont été créés : un sous toile au pied du Panthéon, rue Montagne Sainte-Geneviève ; l'autre à Courbevoie. Ils débordent déjà, il faut les ouvrir partout. Ce soir, dans chaque ville de France, dans chaque quartier de Paris, il faut accrocher des pancartes sous une lumière dans l'obscurité, à la porte des endroits où il y a des couvertures, des couchettes, de la soupe ; où l'on peut lire, sous le titre 'Centre d'Aide Fraternelle', ces simples mots : 'Si vous êtes de l'Union et de la fraternité française, qui que vous soyez, entrez, mangez, dormez, retrouvez l'espoir, vous voilà aimé'. On prévoit un mois de fortes gelées. Tant que dure l'hiver, tant que les centres existent, face à leurs frères qui meurent dans la pauvreté, toute l'humanité doit être d'une seule volonté : celle de rendre cette situation impossible. Je vous en prie, aimons-nous assez les uns les autres pour le faire maintenant. De tant de douleur, qu'une chose merveilleuse nous soit donnée : l'esprit partagé de la France. Merci! Tout le monde peut aider les sans-abri. Il nous faut, ce soir et demain au plus tard, cinq mille couvertures, trois cents grandes tentes américaines et deux cents réchauds catalytiques. Amenez-les vite à l'Hôtel Rochester, numéro quatre-vingt-douze, rue de la Boétie. Rendez-vous des bénévoles et des camions pour les transporter : ce soir à onze heures, devant la tente sur la Montagne Sainte-Geneviève. Grâce à vous, aucun homme, aucun enfant, ne dormira sur le bitume ou sur les quais de Paris ce soir"
