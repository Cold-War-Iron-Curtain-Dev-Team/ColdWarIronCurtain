#Battleship/Battlecruiser Hulls in research tree# 

 FRA_battle_hull_medium_0:0 "Classe Richelieu"
 FRA_battle_hull_medium_1:0 "Réaménagement de la classe Richelieu"
 FRA_battle_hull_medium_0_desc:0 "La classe Richelieu était un cuirassé rapide construit pour la marine française entre les années 1930 et 1950. Initialement, deux navires furent commandés en 1935 en réponse aux commandes italiennes de cuirassés de classe Littorio l'année précédente. Les Richelieu étaient basés sur la classe Dunkerque précédente, mais ont été agrandis pour accueillir des canons et un blindage plus puissants de 380 mm (15 pouces) pour les protéger des canons du même calibre."
 FRA_battle_hull_medium_1_desc:0 "Et si le Jean Bart et le Richelieu avaient reçu la même ampleur et la même quantité de réaménagement que les navires de la classe Iowa de l'US Navy."
 
 #Carrier Hulls in research tree#
 FRA_carrier_hull_0:0 "Réaménagement de la classe Bearn"
 FRA_carrier_hull_1:0 "Classe Clémenceau"
 FRA_carrier_hull_2:0 "Refit I de la Classe Clemenceau"
 FRA_carrier_hull_3:0 "Refit II de la Classe Clemenceau"
 FRA_carrier_hull_4:0 "Classe Charles de Gaulle"
 FRA_carrier_hull_0_desc:0 "Le Béarn était un porte-avions converti à partir d'un cuirassé incomplet de classe Normandie pour la Marine Nationale (Marine française) dans les années 1920. Entrée en service en 1928, la marine avait l'intention de l'utiliser pour développer des tactiques et des techniques pour l'aviation porteuse. Seul porte-avions produit par la France jusqu'après la Seconde Guerre mondiale, le navire a joué un rôle mineur au début de la guerre, s'entraînant dans ses eaux intérieures et dispensant une formation de pilote."
 FRA_carrier_hull_1_desc:0 "Les porte-avions de classe Clemenceau sont une paire de porte-avions qui ont servi dans la marine française de 1961 à 2000. De 2000 à 2017, l'un d'entre eux a servi dans la marine brésilienne sous le nom de Sao Paulo. La classe Clemenceau fut le premier porte-avions français à succès après la Seconde Guerre mondiale et fut l'épine dorsale de la flotte française pendant ses quarante années de service."
 FRA_carrier_hull_2_desc:0 "Conçus dès l'origine comme porte-avions multi-rôles de flotte, les deux navires de la classe Clemenceau disposaient initialement en 1961 d'un groupe aérien avec dix avions chacun de la version d'attaque IVM et de la version de reconnaissance IVP du chasseur d'attaque Dassault Etendard IV, d'un escadron de huit avions Breguet Alize étaient embarqués pour la mission de guerre anti-sous-marine et, dans le rôle de défense aérienne, d'un escadron de Sud Aviation Aquilon (construit sous licence de Havilland Sea Venom). combattants."
 FRA_carrier_hull_3_desc:0 "Clemenceau et Foch ont été modernisés de septembre 1977 à novembre 1978 et de juillet 1980 à août 1981 (Foch). Cette mise à niveau à mi-vie les a autorisés à utiliser le nouveau Super Etendard (ainsi que plusieurs autres mises à niveau, comme le système SENIT C3). Ensuite, ils avaient jusqu'à 40 avions. 10 F-8FN, 15 - 16 Super Etendard et 3 - 4 Etendard IVP, 7 Alize, 2 Super Frelon et 2 Alouette III. Leur hangar mesurait 152 x 24 x 7 mètres (3 648 mètres carrés). Les dépôts de carburant de Clemenceau étaient de 1 200 mc (JP5) et 400 mc (AVGAS). Foch a augmenté ce montant jusqu'à respectivement 1 800 et 109."
 FRA_carrier_hull_4_desc:0 "Charles de Gaulle est le vaisseau amiral de la Marine Nationale. Le navire est le dixième porte-avions français, le premier navire de surface à propulsion nucléaire français et le seul porte-avions à propulsion nucléaire achevé en dehors de la marine américaine. Elle porte le nom de l'homme d'État français et général Charles de Gaulle."
 
 FRA_carrier_hull_light_0:0 "Classe Arromanches"
 FRA_carrier_hull_light_1:0 "Refit de la classe Arromanches"
 FRA_carrier_hull_light_2:0 "Classe Jeanne d'Arc"
 FRA_carrier_hull_light_3:0 "Classe Foudre"
 FRA_carrier_hull_light_4:0 "Classe Mistral"
 FRA_carrier_hull_light_0_desc:0 "Le Design Light Fleet Carrier de 1942, communément appelé British Light Fleet Carrier, était un porte-avions léger créé par la Royal Navy pendant la Seconde Guerre mondiale et utilisé par huit forces navales entre 1944 et 2001. Ils ont été conçus et construits par des chantiers navals civils pour servir d'étape intermédiaire entre les porte-avions de flotte de grande taille et coûteux et les porte-avions d'escorte moins chers mais à capacité limitée."
 FRA_carrier_hull_light_1_desc:0 "Arromanches a été reconstruit avec un poste de pilotage incliné à quatre degrés, un viseur d'atterrissage à miroir et avec d'autres modifications pour la guerre anti-sous-marine, y compris l'exploitation de l'avion Breguet Alize ASW. Elle était également équipée pour les opérations de formation."
 FRA_carrier_hull_light_2_desc:0 "Jeanne d'Arc était un porte-hélicoptère de la Marine française. Il s'agit du sixième navire de la marine française nommé en l'honneur de Jeanne d'Arc (« Jeanne d'Arc » en français), héroïne nationale de la France et sainte de l'Église catholique qui s'est illustrée pendant la guerre de Cent Ans en aidant la France à inverser le cours de la phase lancastrienne."
 FRA_carrier_hull_light_3_desc:0 "Le quai de plate-forme de débarquement de classe Foudre était une classe de quais de plate-forme de débarquement conçus et utilisés par la marine française. Les navires ont fonctionné de 1990 à aujourd'hui. En 2011, Foudre a été vendu à la marine chilienne. Siroco a été vendu à la marine brésilienne en 2015."
 FRA_carrier_hull_light_4_desc:0 "La classe Mistral est une classe de cinq navires d'assaut amphibies construits par la France. Également connu sous le nom de porte-hélicoptères, et appelés « bâtiments de projection et de commandement » (BPC), un navire de classe Mistral est capable de transporter et de déployer 16 hélicoptères NH90 ou Tigre, quatre barges de débarquement, jusqu'à 70 véhicules dont 13 chars Leclerc, ou un bataillon de chars Leclerc de 40 hommes, et 450 militaires."

 #FRA_carrier_hull_super_1:0 ""
 #FRA_carrier_hull_super_2:0 ""
 #FRA_carrier_hull_super_3:0 ""
 FRA_carrier_hull_super_4:0 "SERREMENT"
 #FRA_carrier_hull_super_1_desc:0 ""
 #FRA_carrier_hull_super_2_desc:0 ""
 #FRA_carrier_hull_super_3_desc:0 ""
 FRA_carrier_hull_super_4_desc:0 "La Marine nationale prépare activement un futur porte-avions et un nouveau vaisseau amiral. Il est connu en français sous le nom de Porte-avions de nouvelle génération (PA-NG) pour « porte-avions de nouvelle génération »."
 
 # Submarine Hulls #
 FRA_sub_hull_small_single_0:0 "Classe Aurore GUPPY"
 FRA_sub_hull_small_single_0_desc:0 "Cinq des sous-marins, Andromède, Astrée, Africaine, Artémis et Créole, ont été achevés après la guerre, ont été mis en service dans la marine française et ont servi jusque dans les années 1960. Andromède, Artémis et Créole étaient équipés de voiles GUPPY et de tubas sous-marins."
 FRA_sub_hull_small_single_1:0 "Classe Daphné"
 FRA_sub_hull_small_single_1_desc:0 "Le sous-marin de classe Daphné était une classe de sous-marins à propulsion diesel-électrique conçus et construits par l'entreprise de défense française DCNS pour la marine française en 1964. Commercialisé par le gouvernement français pour le marché d'exportation."
 #FRA_sub_hull_small_single_2:0 ""
 #FRA_sub_hull_small_single_2_desc:0 ""
 FRA_sub_hull_small_single_3:0 "Classe Scorpène"
 FRA_sub_hull_small_single_3_desc:0 "Les sous-marins de classe Scorpène sont une classe de sous-marins d'attaque diesel-électriques développés conjointement par le Groupe Naval français (anciennement Direction des Constructions Navales) et la société espagnole Navantia."
 FRA_sub_hull_small_single_4:0 "Classe Scorpène 2000"
 FRA_sub_hull_small_single_4_desc:0 "Les sous-marins de classe Scorpène sont une classe de sous-marins d'attaque diesel-électriques développés conjointement par le Groupe Naval français (anciennement Direction des Constructions Navales) et la société espagnole Navantia."

 FRA_sub_hull_large_single_0:0 "Classe Narval"
 FRA_sub_hull_large_single_0_desc:0 "La classe Narval (sous-marins d'escadre) était des sous-marins de patrouille construits pour la Marine française dans les années 1950."
 FRA_sub_hull_large_single_1:0 "Classe Aréthuse"
 FRA_sub_hull_large_single_1_desc:0 "La classe Aréthuse était un sous-marin construit pour la marine française dans les années 1950. Ils ont été conçus comme sous-marins d'attaque pour la guerre anti-sous-marine et étaient appelés Sous-marins de Chasse par la Marine française."
 FRA_sub_hull_large_single_2:0 "Classe Agosta"
 FRA_sub_hull_large_single_2_desc:0 "Le sous-marin de classe Agosta est une classe de sous-marins d'attaque rapide diesel-électrique développé et construit par la société française DCNS dans les années 1970 pour succéder aux sous-marins de classe Daphné. Les sous-marins ont servi dans la marine française et ont été exportés vers les marines espagnole et pakistanaise."
 FRA_sub_hull_large_single_3:0 "Classe Rubis"
 FRA_sub_hull_large_single_3_desc:0 "La classe Rubis est une série de sous-marins d'attaque à propulsion nucléaire exploités par la Marine nationale française. La classe comprend six navires et ce sont les sous-marins nucléaires d'attaque les plus compacts à ce jour. Tous les sous-marins de la classe (à l'exception du Casabianca) portent le nom de pierres précieuses."
 FRA_sub_hull_large_single_4:0 "Classe Barracuda"
 FRA_sub_hull_large_single_4_desc:0 "La classe Barracuda (ou classe Suffren) est un sous-marin nucléaire d'attaque, conçu par le constructeur naval français Naval Group (anciennement DCNS et DCN) pour la Marine nationale. Il est destiné à remplacer les sous-marins de la classe Rubis. La construction a commencé en 2007 et la première unité a été mise en service le 6 novembre 2020. La pleine capacité opérationnelle n'est pas prévue avant 2022."

 FRA_sub_hull_large_double_0:0 "Cours de gymnastique"
 FRA_sub_hull_large_double_0_desc:0 "Gymnote (S655) était un sous-marin expérimental de la Marine nationale. C'était un sous-marin d'essai pour les missiles balistiques lancés par un sous-marin (SLBM) et propulsé par des moteurs diesel-électriques. Il doit son nom au Gymnote, le premier sous-marin entièrement électrique au monde construit en France à la fin du XIXe siècle."
 FRA_sub_hull_large_double_1:0 "Classe redoutable"
 FRA_sub_hull_large_double_1_desc:0 "Le sous-marin de classe Le Redoutable était une classe de sous-marins lance-missiles balistiques de la Marine Nationale française. En français, ce type est appelé Sous-marin Nucléaire Lanceur d'Engins (SNLE), littéralement « sous-marin nucléaire lanceur de missiles »."
 FRA_sub_hull_large_double_2:0 "Réaménagement de la classe Redoutable"
 FRA_sub_hull_large_double_2_desc:0 "Le sous-marin de classe Le Redoutable était une classe de sous-marins lance-missiles balistiques de la Marine Nationale française. En français, ce type est appelé Sous-marin Nucléaire Lanceur d'Engins (SNLE), littéralement « sous-marin nucléaire lanceur de missiles »."
 FRA_sub_hull_large_double_3:0 "Classe triomphante"
 FRA_sub_hull_large_double_3_desc:0 "La classe Triomphant de sous-marins lance-missiles balistiques de la Marine française est la classe de bateaux de tête active de quatre bateaux entrés en service en 1997, 1999, 2004 et 2010. Ces quatre ont remplacé l'ancienne classe Redoutable et fournissent la composante océanique (la Force océanique stratégique) de la force de frappe de dissuasion nucléaire française, la Force de dissuasion (force de dissuasion)."

