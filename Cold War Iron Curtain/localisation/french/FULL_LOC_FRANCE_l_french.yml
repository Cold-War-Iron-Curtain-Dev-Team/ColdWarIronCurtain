 ECSC_desc:0 "Dans une étape sans précédent vers la coopération européenne, §cFrance§!, §PAllemagne de l'Ouest§!, §GItalie§!, §mBelgique§!, §NPays-Bas§!et §4Luxembourg§! ont créé la Communauté européenne du charbon et de l'acier (CECA). Entrée officiellement en vigueur à la suite du Traité de Paris de 1951, la CECA crée une autorité supranationale §R§! pour superviser la production de charbon et d'acier, garantissant qu'aucune nation ne peut contrôler unilatéralement ces matériaux de guerre cruciaux. Les décisions concernant les niveaux de production, les prix et les échanges sont désormais placées sous la juridiction de la Haute Autorité, un organisme indépendant chargé de réguler le marché dans l'intérêt de tous les États membres."
