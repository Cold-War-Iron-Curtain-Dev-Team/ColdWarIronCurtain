 fra_news.1.t:0 "[GetNewspaperHeader]Introduction du nouveau franc"
 fra_news.1.d:0 "Le 27 décembre 1958, est arrêté « qu'à compter d'une date à fixer par décret, et au plus tard le 1er janvier 1960, sera créée une nouvelle unité monétaire française dont la valeur sera de cent francs ». La nouvelle unité est « désignée par le terme nouveau franc ». Cette réforme monétaire est la partie la plus publique d'un programme ambitieux, préparé par Jacques Rueff, qui prône la consolidation budgétaire pour mettre fin à l'inflation et favoriser le renouveau économique et financier du pays. Avec une valeur extérieure du franc fixée à 1,8 milligramme d'or fin (180 milligrammes pour un nouveau franc), la France est associée au retour à la convertibilité des monnaies européennes et peut ainsi participer pleinement au lancement du grand chantier. Construction de la Communauté européenne."
 fra_news.1.a:0 "Ils ont restauré un franc prestigieux"
 fra_news.2.t:0 "[GetNewspaperHeader]Service d'Action Civique Formation"
 fra_news.2.d:0 "À mesure que l'intensité de la guerre d'Algérie augmentait, la tension entre les Algériens ne faisait qu'augmenter. Suite à l'opposition arabe, communiste et militaire à De Gaulle, le conseiller en chef africain Jacques Foccart a vu la nécessité d'une contre-vague contre ces forces. Une milice gaulliste connue sous le nom de Service d'Action Civique a été créée, basée à Constantine, constituant une coalition de forces progouvernementales dispersées dans toute la région."
 fra_news.2.a:0 "Une autre milice ?!"
 fra_news.3.t:0 "[GetNewspaperHeader]Semaine des barricades"
 fra_news.3.d:0 "Les Algériens français étaient furieux que De Gaulle semble les avoir abandonnés à leur propre sort, ce qui a conduit de nombreux dirigeants étudiants à organiser des manifestations dans la ville d'Alger. Le chef Pierre Lagaillarde orchestrerait la descente de milliers de personnes dans la rue. Ce qui avait commencé dans le calme est devenu violent lorsque la police a commencé à tirer sur la foule. Les bâtiments gouvernementaux ont été rapidement submergés et tout sentiment d'ordre a été rapidement perdu. Le 1er février, les loyalistes de De Gaulle envahiraient la ville et rétabliraient l'ordre. Même si la situation est maîtrisée, le conflit algérien ne montre aucun signe d'apaisement"
 fra_news.3.a:0 "Jusqu'où cela peut-il continuer à s'aggraver ?"
 fra_news.4.t:0 "Mort d'Albert Camus"
 fra_news.4.d:0 "Le célèbre auteur franco-algérien Albert Camus a été déclaré mort après un accident de voiture mortel le 4 janvier 1960. L'un des plus grands auteurs de la littérature française, Camus a fait de grands pas dans le développement de l'absurdisme et a fait prendre conscience de la lutte algérienne au sein de la République. Bien qu'il ait vécu une vie courte, ses contributions au monde de la littérature ne seront pas oubliées, vivant pour l'éternité dans ses oeuvres."
 fra_news.4.a:0 "\"Il n'y a pas d'amour de la vie sans désespoir de la vie\""
 fra_news.21.t.fal:0 "[GetNewspaperHeader]Le putsch d'Alger échoue"
 fra_news.21.t.suc:0 "[GetNewspaperHeader]Révolution d'Alger"
 fra_news.21.d.fal:0 "En pleine guerre d'Algérie, des négociations secrètes entre le FLN et De Gaulle ont provoqué la colère des généraux algériens français qui avaient le sentiment que la population algérienne européenne était trahie. Dirigées par Maurice Challe, les troupes coloniales françaises tenteraient d'organiser un coup d'État dans les trois principales villes d'Algérie mais trouveraient de petits soldats pour les soutenir. À Oran et à Constantine, le coup d'État n'a même pas commencé car les officiers comme les soldats ont refusé de recevoir les ordres. Le lendemain, De Gaulle prononcerait un discours inspirant qui atténuerait encore davantage le soutien au coup d'État. Le putsch s'effondrerait rapidement car toutes les personnes impliquées changeraient de camp pour revenir au gouvernement.\n \nÀ la fin de l'épreuve, le coup d'État a lamentablement échoué et n'a rien apporté à cette tentative. Cet incident a prouvé que la France se tient aux côtés de De Gaulle, même dans les moments de lutte nationale."
 fra_news.21.d.suc:0 "Les combats à Paris finiraient par s'apaiser lorsque les quelques combattants gaullistes et communistes restants dispersés dans la ville se rendraient. Après une brève chasse à l'homme, Charles De Gaulle fut finalement capturé à Rouen alors qu'il tentait d'atteindre Le Havre pour tenter de s'échapper vers la Grande-Bretagne. Le procès de De Gaulle se déroule rapidement, qui est jugé pour trahison par les putschistes pour la trahison de l'Algérie française. Les groupes de gauche à travers la France ne s'en sortent pas mieux, avec, semble-t-il, plus de 5 000 socialistes et communistes français arrêtés. Le Parti radical et le Parti gaulliste ont tous deux été officiellement interdits, et tout lien avec eux peut être détecté avec la police à sa porte. Les rues de Paris en disent long sur la nation dans son ensemble, car l'atmosphère autrefois bruyante est devenue sombre. Les Parisiens passent devant des chars roulants sur le chemin du travail et entendent occasionnellement des tirs à distance. Les gens continuent à vivre leur vie, même à la fin de la nouvelle Ve République.\n Alors que la poussière retombe, l'avenir de la France reste en équilibre. S'agira-t-il d'une étape de transition vers la VIe République ou d'une nouvelle aube de l'autoritarisme français ? Une chose est confirmée, la guerre d'Algérie est loin d'être terminée..."
 fra_news.21.a:0 "Vive la France !"
 fra_news.21.b:0 "Les Français vont endurer !"
 fra_news.21.c:0 "Intéressant..."
 fra_news.31.t.gen:0 "[GetNewspaperHeader][USA.GetLeader] Visiter la France"
 fra_news.31.t.jfk:0 "[GetNewspaperHeader] Le président américain Kennedy en visite en France"
 fra_news.31.d.gen:0 "\"Je ne viens pas ici pour régler nos différends, car ce sont des disputes entre amis, mais pour demander conseil à l'un des hommes les plus sages et les plus héroïques de notre temps. Et pour expliquer à l'Europe ce qu'est l'Amérique aujourd'hui.\" Les premiers mots de [USA.GetLeader] à Paris cartonnent auprès de Charles de Gaulle. Entre les deux alliés, douze heures de discussions sont prévues jusqu'à vendredi pour évoquer les tensions entre l'Est et l'Ouest à Berlin, la guerre d'Algérie mais aussi le choix de la France de se doter de l'arme nucléaire. [USA.GetLeader] a tenté de l'en dissuader mais que faire face à l'obstination de l'homme du « Non » ?"
 fra_news.5.t:0 "Michel Debré obtient les pleins pouvoirs sur la question algérienne"
 fra_news.5.d:0 "A l'issue de la Semaine des Barricades, le Premier ministre français Michel Debré s'est vu attribuer les pleins pouvoirs par le Parlement français pour traiter de la question algérienne. Michel Debré défend depuis longtemps l'Algérie française, mais en fin de compte, la manière dont il traitera l'Algérie n'est qu'une question de temps. L'escalade de la situation s'aggrave à mesure que le temps passe et que les groupes militants ne font que se renforcer."
 fra_news.5.a:0 "Espérons que le premier ministre prendra la bonne décision."
 fra_news.7.t:0 "[GetNewspaperHeader]Réseau Jeanson et FLN interpellés à Métropole"
 fra_news.7.d:0 "Suite aux ordres du Premier ministre français, le groupe militant de gauche français Réseau Jeanson et le Front de libération nationale de l'Algérie sont arrêtés en France métropolitaine. Ces groupes font depuis longtemps passer des billets de banque et des armes en contrebande depuis le pays pour soutenir les belligérants en Algérie et n'ont pas été détectés. Cependant, suite à une série d'interrogatoires dans la nuit, les emplacements de différentes cellules et connexions ont été révélés. Suite à ces informations, des arrestations sont en cours et tous les complices sont placés en garde à vue."
 fra_news.7.a:0 "Cette série d'arrestations entraînera probablement une pénurie d'armes et d'argent pour le FLN."
 fra_news.8.t:0 "De Gaulle arrive en Algérie"
 fra_news.8.d:0 "En pleine guerre d'Algérie, Charles De Gaulle arrive à Alger et effectue une tournée dans les grandes villes de la région. Alger, Constantine et Oran verraient le président rencontrer des officiers militaires pour discuter de nouveaux plans pour faire face à l'insurrection. A propos de ses projets, De Gaulle réaffirme que les Algériens ont le choix quant à la manière de décider de leur avenir, mais que tant que la violence militaire perdure, cela ne sera pas possible. Les conditions pour les militaires français ont été jugées satisfaisantes et De Gaulle continue de donner l'ordre de poursuivre le combat.\nCe voyage a remonté le moral de ceux qui combattent en Algérie, prouvant que la campagne peut s'avérer fructueuse si les efforts français se poursuivent, alors que le conflit ne montre aucun signe d'arrêt."
 fra_news.8.a:0 "Le combat continue !"
 fra_news.9.t:0 "Khrouchtchev en visite en France"
 fra_news.9.d:0 "Aujourd'hui, le premier secrétaire du Parti communiste de l'Union soviétique, Khrouchtchev, rend visite à De Gaulle dans le cadre d'une mission diplomatique concernant l'Allemagne divisée. Khrouchtchev exige qu'un traité de paix soit conclu avec les deux États allemands et l'Union soviétique, sinon il conclurait un traité avec l'Allemagne de l'Est, leur laissant ainsi le contrôle total des routes menant à la ville. Les pressions sur la question allemande d'après-guerre s'intensifient et cette question suscite des dissensions parmi les alliés occidentaux qui ne souhaitent pas entrer en guerre si peu de temps après la Seconde Guerre mondiale."
 fra_news.9.a:0 "La France est-elle prête à reconnaître la République démocratique allemande ?"
 fra_news.10.t:0 "Fondation du Parti Socialiste Unifié"
 fra_news.10.d:0 "Le Parti Socialiste Unifié de France, après de nombreuses années de déconnexion de la gauche française, se rassemble. Les socialistes démocrates, les chrétiens de gauche et les sociaux-démocrates célèbrent dans tout le pays la fondation du parti. Avec environ 20 000 membres actifs et environ 500 000 sympathisants à travers le pays, l'USP cherche à étendre son influence avec une série de campagnes sous la direction de la gauche française nouvellement unie. L'USP travaille actuellement à la publication de sa plateforme officielle combinant des éléments communs aux trois partis socialistes unis. Avec le soutien des gauchistes de tout le pays, les idéologies de gauche ont plus que jamais de chances d'accéder au pouvoir politique en France."
 fra_news.10.a:0 "Mitterrand a fait du bon travail..."
 fra_news.31.a:0 "Une belle visite de notre ami américain !"
 fra_news.31.b:0 "...Ils sont arrivés à Paris comme des rois, ils repartent comme une légende !"
 fra_news.31.d.jfk:0 "Si les épineuses négociations diplomatiques se déroulent en coulisses, l'histoire retiendra surtout ce qui se passe sur la scène. Malgré la bruine qui gâche cette fin de printemps, l'effervescence est à son comble dans la capitale pour accueillir le couple politique le plus glamour de la planète. Ils sont jeunes, beaux, bronzés, chics et décontractés... La presse nourrit d'autant plus la curiosité du public que le séduisant président et la première dame n'occupent la Maison Blanche que cinq mois. \"Messed-up Hairs, mesurant 1,82 m, pesant 81 kg, a 44 ans...\" Décrivent les journalistes. Mais très vite, c'est sa femme Jacqueline, 31 ans, qui affole les gazettes. Les Parisiens n'ont d'yeux que pour ses \"tenues élégantes\", ses chapeaux en forme de camembert, ses \"yeux rieurs\" et sa voix de petite fille. Mieux encore : elle a du sang français, comme en témoignent son prénom et son nom de jeune fille (Bouvier). Kennedy l'a aussi compris : la star, c'est Jackie. Et il se rattrape : \"Je ne pense pas qu'il soit superflu que je me présente : je suis le gars qui accompagne Jackie Kennedy\", glisse-t-il vendredi en préambule de son discours devant 500 journalistes. La veille, le couple avait dîné au château de Versailles, dans une halle aux glaces éclairée aux chandelles. \"Je pense que je suis transportée au paradis, je n'ai jamais rien vu de pareil\", dit Jackie, scintillante dans sa robe brodée. Lorsque la limousine les ramène à Orly, 150 000 personnes les acclament..."
 algerian_war_news.1.t:0 "[GetNewspaperHeader]Détonation Gerboise Blanche"
 algerian_war_news.1.d:0 "\nL'explosion qui a secoué l'Afrique\n\nL'essai nucléaire français tant attendu allait enfin arriver, dans la ville de Reggane, à l'extrême sud de l'Algérie. De nombreux sites de missiles existaient depuis un certain temps à la périphérie du village, et c'est là qu'un site d'essais a été construit dans le désert. En débarrassant la ville voisine de ses civils pour éviter les radiations, les Français importeraient 150 prisonniers et s'attendaient à ce que les partisans du FLN soient les participants involontaires à la frappe. À 22h00, l'attaque nucléaire commencerait, brûlant le site d'essai et se transformant malheureusement en feu nucléaire.\n\nBeaucoup sont choqués que les Français fassent cela, même ceux de l'Ouest ont dénoncé cette décision. Cette action a suscité des tensions dans la guerre d'Algérie en cours, ralliant le FLN dans une frénésie."
 algerian_war_news.1.a:0 "Quelle réussite !"
 algerian_war_news.2.t:0 "Assassinat en Algérie !"
 algerian_war_news.2.d:0 "Henri Lorillot, l'officier supérieur français du haut commandement de la colonie algérienne, a découvert des suicides très horribles commis par certains dirigeants nationalistes algériens éminents. Parmi eux, Robert Barrat, un fervent journaliste anticoloniste. Cette découverte controversée a amené certains à croire qu'il ne s'agissait pas de suicides, mais plutôt d'assassinats commis par les forces françaises en Algérie. Cela pourrait être très préjudiciable à la colonie nord-africaine actuellement instable."
 algerian_war_news.2.a:0 "Quelles méthodes barbares"
 fra_news.6.t:0 "[GetNewspaperHeader]\n\n Détonation Gerboise Bleue"
