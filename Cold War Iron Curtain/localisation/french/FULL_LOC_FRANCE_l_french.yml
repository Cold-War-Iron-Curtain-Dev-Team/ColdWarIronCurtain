 FRA_Indochina_War_category_desc:0 "La guerre d'Indochine\n\nAprès une longue campagne de résistance contre les Français et les Japonais, les forces du Viet Minh ont revendiqué une victoire (la Révolution d'Août) après la capitulation des forces japonaises et françaises de Vichy dans le Nord le 15 août 1945.\n\nLors de la guerre du Vietnam, les forces britanniques ont occupé temporairement le Sud, à partir du 13 septembre 1945, pour ensuite restaurer le contrôle colonial français en 1946. Aux Nations Unies, et à travers leur alliance avec le Royaume-Uni et les États-Unis, les Français ont exigé le retour de leur ancienne colonie d'Indochine avant d'accepter de participer à l'alliance de l'OTAN s'opposant à l'expansion soviétique au-delà des pays du Komintern pendant la guerre froide.\n\nLe Viet Minh communiste, que les Alliés avaient soutenu pendant la Seconde Guerre mondiale, a continué à combattre les Français avec le soutien de la Chine communiste et de l'Union soviétique."
