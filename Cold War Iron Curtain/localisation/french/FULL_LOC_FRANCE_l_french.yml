 ################SPEECHES#######

 gaulle_speech_category:0 "Discours publics du général Charles de Gaulle"
 gaulle_speech_category_desc:0 "Le général de Gaulle a fait beaucoup de grandes choses pour notre nation, il a conduit notre nation à lutter contre les nazis et veut une France plus forte et libre de toute influence étrangère, ses discours remontent toujours le moral du peuple français."
 speak_on_may_first:0 "Prise de parole en public le 1er mai 1950"
 speak_on_may_first_desc:0 "Du renouveau de la France aujourd'hui dans le monde en fusion au milieu de tous les appels à la haine ou à la faiblesse, parmi tous les intérêts opposés qui me confondaient moi et mes compagnons, disons que dans le pays rien ne compte sauf restaurer l'unité. D'abord par la concorde sociale, nous sommes sûrs qu'à la masse des Français qui nous ont déjà rejoint, sans compter beaucoup de ceux qui ne nous entendent pas d'abord dire ou refusent de nous suivre, les travailleurs sont avant tout avec vous. Je veux construire la France nouvelle, d'abord par rapport aux préoccupations. La question principale qui domine tout ce qui est au fond de tous les drames de notre temps je veux dire, c'est la question de la condition de travail."

 
