 #DECOLONISATION#
 indochina_decolonisation.1.t:0 "[GetNewspaperHeader]La France accorde l'indépendance au Royaume du Laos"
 indochina_decolonisation.1.d:0 "Notre Royaume du Laos a célébré sa nouvelle indépendance le [?global.date.GetDateStringNoHourLong], avec un mélange de fierté et d'espoir prudent. Après des années de domination coloniale, le Traité d'amitié et d'association franco-lao symbolise une nouvelle ère pour la nation. Le gouvernement laotien, dirigé par notre roi Sisavang Vong, a considéré ce moment comme une étape cruciale vers l'autodétermination et l'unité nationale. Cependant, les défis liés au maintien de la stabilité et à la gestion des tensions régionales étaient évidents, alors que le Laos cherchait à établir sa place dans une Asie du Sud-Est en évolution rapide."
 indochina_decolonisation.1.a:0 "Une victoire pour notre peuple."
 indochina_decolonisation.2.t:0 "[GetNewspaperHeader]La France accorde l'indépendance au Royaume du Kampuchéa"
 indochina_decolonisation.2.d:0 "En [GetMonth] [GetYear], notre Royaume du Kampuchéa a obtenu son indépendance tant recherchée, marquée par le retour triomphal de notre Roi Norodom Sihanouk à Phnom Penh. Le peuple khmer s'est réjoui de la fin de la domination coloniale française, y voyant le rétablissement de la fierté et de la souveraineté nationales. La déclaration d'indépendance de Sihanouk a été considérée comme un moment unificateur, ouvrant la voie à un nouveau chapitre de l'histoire du Kampuchéa. Cependant, la nation était confrontée à la tâche ardue de se forger un avenir stable et prospère dans un contexte d'incertitudes régionales et de défis internes."
 indochina_decolonisation.2.a:0 "En avant vers le futur !"
 indochina_decolonisation.3.t:0 "[GetNewspaperHeader]La France accorde l'indépendance au Kampuchéa et au Laos"
 indochina_decolonisation.3.d:0 "Le [?global.date.GetDateStringNoHourLong], le ministère français des Outre-mer a officiellement transféré ses pouvoirs restants au Royaume du Laos par le biais du Traité franco-laotien d'amitié et d'association, marquant la fin de la domination coloniale française. De même, un accord partiel avec le Kampuchéa conduit le roi Norodom Sihanouk à déclarer son indépendance et à rentrer triomphalement à Phnom Penh.\nDu point de vue français, cette décision était considérée comme une concession nécessaire aux mouvements nationalistes croissants. En accordant l'indépendance, la France espérait maintenir des relations amicales et préserver son influence dans la région au milieu de la montée du sentiment anticolonial."
 indochina_decolonisation.3.a:0 "Nous espérons que cela contiendra le communisme en Indochine"
 indochina_decolonisation.4.t:0 "[GetNewspaperHeader]La France accorde l'indépendance aux royaumes du Kampuchéa et du Laos"
 indochina_decolonisation.4.d:0 "Notre gouvernement Quoc-gia a considéré la récente décision française d'accorder l'indépendance aux royaumes de Cam-bot et du Laos avec un optimisme prudent. Si cela marque la diminution de l'influence coloniale dans la région, cela marque également un changement dans l'équilibre des pouvoirs. Notre dirigeant [VIE.leader] espérait que ces nations nouvellement indépendantes se joindraient à nous pour résister à l'expansion communiste et maintenir la stabilité en Asie du Sud-Est. Cette décision a été considérée comme un pas vers la solidarité régionale contre la menace imminente posée par le Viet Minh et ses alliés."
 indochina_decolonisation.4.a:0 "Bienvenue les amis"
 indochina_decolonisation.5.t:0 "[GetNewspaperHeader]Accorde l'indépendance aux royaumes du Kampuchéa et du Laos"
 indochina_decolonisation.5.d:0 "Du point de vue de notre Parti, l'octroi par la France de l'indépendance au Kampuchéa et au Laos était une victoire stratégique pour le mouvement anticolonial au sens large. L'oncle Ho et le Parti y ont vu une preuve supplémentaire de l'affaiblissement de l'emprise des forces impérialistes en Indochine. Nos dirigeants considéraient également les nations nouvellement indépendantes comme des alliés potentiels dans la lutte contre la domination étrangère et espéraient encourager les mouvements révolutionnaires au sein de ces pays pour soutenir la cause communiste plus large en Asie du Sud-Est."
 indochina_decolonisation.5.a:0 "Félicitations à nos camarades indochinois"
 
 fra_state_schneider_et_cie: "Schneider et Cie"

 #FP Events
 FRA_FP.1.d:0 "Au lendemain de la Seconde Guerre mondiale et dans un contexte d'intensification de la guerre froide, la République française est confrontée au besoin urgent de moderniser ses institutions diplomatiques pour répondre aux nouveaux défis mondiaux. Le ministère des Affaires étrangères - connu depuis longtemps pour ses corps d'élite et sa diplomatie classique - se trouve sous pression pour évoluer d'un bastion de tradition aristocratique vers un bras dynamique de la stratégie républicaine.\n\nÀ l'initiative du président René Coty et avec le soutien du Premier ministre [FRA.GetLeader], le ministère a été restructuré pour centraliser les affaires culturelles internationales, renforcer le rayonnement francophone et améliorer la coordination avec le ministère de la Défense et le ministère des Affaires européennes nouvellement créé. Ces changements marquent une rupture avec la diplomatie prudente de la Quatrième République et reflètent une ambition de réaffirmer l'influence française non seulement en Europe, mais dans le monde en décolonisation.\n\nPour la première fois depuis Louis de Revol, le Quai d'Orsay voit officiellement le ministre des Affaires étrangères élevé à un siège permanent au Conseil national de sécurité, comblant ainsi le fossé entre diplomatie et stratégie de défense. Les critiques dénoncent cette décision comme une politisation de la diplomatie, mais les partisans soutiennent qu'il est essentiel que la France maintienne la parité avec Washington et Moscou dans l'ordre mondial bipolaire émergent."
 FRA_FP.2.d:0 "Au lendemain de la Seconde Guerre mondiale et au milieu des mouvements de décolonisation croissants à travers le monde, la Quatrième République française a cherché à restructurer ses possessions impériales dans un nouveau cadre : l'Union française. Bien qu'officiellement déclarée en 1946, les efforts se sont intensifiés en 1950 pour consolider cette entité politique en un système administratif et idéologique fonctionnel. Dans ce cadre, la France ne désigne plus ses domaines comme des « colonies », mais plutôt comme des parties intégrantes d'une France singulière et indivisible - dotée d'une citoyenneté et d'une culture partagées.\n\nLa France métropolitaine englobe désormais non seulement le continent et la Corse, mais les quatre départements de l'Algérie française. Parallèlement, les « anciennes colonies » des Caraïbes et de l'océan Indien ont été réorganisées en départements d'outre-mer à part entière, et les « nouvelles colonies » en territoires d'outre-mer. Pendant ce temps, les États associés comme le Cambodge, le Laos et le Vietnam, ainsi que les protectorats comme le Maroc et la Tunisie, restent liés diplomatiquement sous des formes de contrôle plus souples. Pourtant, l'Union française, bien que symbole d'unité, peine à masquer les profondes inégalités qui persistent au sein de son cadre - en particulier alors que les troubles éclatent en Afrique et en Indochine."
 FRA_FP.3.d:0 "Des sommets volcaniques balayés par les vents de Kerguelen aux côtes de Crozet parsemées de manchots, la France a tranquillement réaffirmé sa revendication souveraine sur ses territoires les plus éloignés. Ces îles ont été découvertes dès le XVIe siècle dans le cadre de l'exploration de la route des Indes, initiée par les Portugais et les Britanniques, les Français et les Hollandais. Bien que ces archipels - dispersés dans l'océan Austral - aient été autrefois gérés par le gouverneur général de Madagascar, leur éloignement et leur valeur scientifique leur ont valu une nouvelle importance dans une époque de rivalité polaire et d'expansion économique de la guerre froide.\n\nL'Assemblée nationale française a adopté la loi n° 55-1052 créant officiellement les « Terres australes et antarctiques françaises » (TAAF). Ce nouveau territoire d'outre-mer comprend les îles Kerguelen, Saint-Paul et Amsterdam, l'archipel de Crozet et la partie de la Terre Adélie en Antarctique revendiquée par la France. Son administration supervisera les stations scientifiques et les eaux territoriales, tandis que les fonds de pêche environnants offrent des perspectives aux flottes de pêche françaises.\n\nLa France a une fois de plus réaffirmé son statut de puissance polaire et maritime - même si sur des terres que peu de citoyens verront jamais."
 FRA_FP.4.d:0 "Un rapport classifié diffusé au sein du ministère français des Affaires étrangères analyse la situation actuelle en Égypte à la suite de l'intervention militaire conjointe anglo-française-israélienne lancée le 29 octobre 1956 en réponse à la nationalisation du canal de Suez par le président Gamal Abdel Nasser. Le rapport salue le succès initial de l'opération Mousquetaire, qui a vu des gains rapides des forces israéliennes et franco-britanniques près de la zone du canal. Cependant, le rapport met également en garde contre de graves conséquences diplomatiques, notant la condamnation des États-Unis, de l'Union soviétique et des Nations Unies, qui a abouti à la résolution 997 de l'ONU appelant à un cessez-le-feu et à un retrait immédiats.\n\nLe document détaille en outre l'inquiétude croissante au sein de l'Elysée concernant l'effondrement potentiel de l'influence française au Moyen-Orient et en Afrique du Nord, ainsi que l'affaiblissement du prestige colonial suite au défi de l'Égypte. Les responsables français soulignent la nécessité de préserver les alliances avec la Grande-Bretagne et Israël, mais appellent également à la prudence face aux craintes de représailles soviétiques et de sanctions économiques. Le rapport se termine par une recommandation d'un désengagement diplomatique discret et d'un soutien à la proposition de maintien de la paix de l'ONU comme moyen de sauver la position internationale de la France sans capitulation totale."
 FRA_FP.5.d:0 " Après la nationalisation audacieuse du canal de Suez par le président Nasser le 26 juillet, le gouvernement français, déjà furieux du soutien égyptien aux insurgés algériens, a opté pour une action décisive. Le 29 juillet 1956, le Cabinet approuva les plans d'une opération militaire conjointe contre l'Égypte, invitant les gouvernements britannique et israélien à conclure une alliance secrète. L'amiral Nomy, de l'état-major de la marine, fut rapidement envoyé à Londres pour proposer la coordination de l'action militaire.\n\nMalgré les contraintes de ressources liées à la guerre d'Algérie en cours, la France mobilisera une force formidable. Notre Régiment de Parachutistes Coloniaux (RPC), vétérans de l'Indochine et de l'Algérie, mènera la charge. Ces troupes aguerries sont connues pour leur efficacité impitoyable et leur expérience de combat inégalée, même si leur doctrine du « feu d'abord » peut provoquer des réactions négatives politiques.\n\nLe général André Beaufre, stratège audacieux et agressif, a été placé sous un commandement conjoint avec des officiers britanniques, faisant pression pour des opérations rapides et mobiles. Même si des lacunes logistiques subsistent, notamment en matière de capacités amphibies, la flotte de porte-avions de la Marine française est prête à projeter sa puissance en profondeur sur le territoire égyptien. Les chars agiles AMX-13 français, bien que légèrement blindés, sont idéaux pour le type d'opérations de flanc envisagées par Beaufre.\n\nL'opération, baptisée \"Mousquetaire\", mettra une fois de plus à l'épreuve la capacité de la France à exercer une influence sur la scène mondiale. Même si le succès peut restaurer le prestige colonial, l'échec pourrait aggraver l'isolement diplomatique - surtout si les États-Unis ou l'Union soviétique interviennent."
 FRA_FP.6.d:0 "Lors d'un sommet secret sans précédent tenu du 22 au 24 octobre 1956, des représentants de la France, d'Israël et du Royaume-Uni se sont réunis dans une villa isolée de Sèvres, en banlieue proche de Paris, pour finaliser un accord clandestin qui aboutirait bientôt à une intervention militaire tripartite contre l'Égypte.\n\nParmi les signataires figuraient :\n\nShimon Peres (directeur général du ministère israélien de la Défense), le ministre de la Défense Maurice Bourges-Maunoury (France), le ministre des Affaires étrangères Christian Pineau (France), les émissaires du Premier ministre [ENG.GetLeader]Patrick Dean et Harold Macmillan (Royaume-Uni) et les chefs d'état-major des forces armées respectives.\n\nDans le cadre du Protocole de Sèvres, les trois pays ont convenu d'une stratégie coordonnée par laquelle Israël lancerait une invasion préventive de l'Égypte à travers la péninsule du Sinaï, créant ainsi un prétexte pour que les forces anglo-françaises lancent un ultimatum puis interviennent « pour séparer les belligérants » et « protéger le canal de Suez ». L'intention sous-jacente était cependant de renverser le président Gamal Abdel Nasser et de reprendre le contrôle occidental sur le canal après sa nationalisation en juillet.\n\nClauses clés du protocole :\n\nIsraël lancerait des opérations militaires contre l'Égypte dans les 48 heures suivant l'accord. La France et la Grande-Bretagne lanceraient un ultimatum commun exigeant un cessez-le-feu et le retrait de la zone du canal. Face au refus prévisible de l'Égypte, les forces françaises et britanniques lanceraient une invasion de la zone du canal sous couvert de maintien de la paix. La France fournirait à Israël un soutien aérien, des armes et une coordination logistique. Toutes les parties ont convenu de nier l'existence du protocole et de maintenir un déni plausible par la voie diplomatique. Même si les États-Unis n'étaient pas partie à l'accord, ils surveillaient de près les tensions dans la région. Les responsables américains, dont le secrétaire d'État John Foster Dulles, ont mis en garde à plusieurs reprises contre une action unilatérale, préférant une solution diplomatique via les Nations Unies. Les pourparlers de Sèvres ont été délibérément cachés à Washington, craignant que l'administration Eisenhower ne réagisse fortement contre une agression néocoloniale perçue."
 FRA_FP.7.d:0 "Le Corps expéditionnaire français en Extrême-Orient (CEFEO), placé sous l'autorité du Haut-commissaire en Indochine et de l'état-major français, a dressé son dernier bilan opérationnel de la campagne en cours contre l'insurrection du Viet Minh. La première guerre d'Indochine, qui en est à sa septième année, continue de mettre à rude épreuve à la fois les ressources militaires et la volonté politique de Paris.\n\nContexte :\n\nLe CEFEO a été créé en 1945 pour remplacer les forces d'occupation japonaises et réaffirmer le contrôle français sur l'Indochine. Elle comprend désormais des unités métropolitaines françaises, des régiments de la Légion étrangère, des tirailleurs nord-africains, des troupes coloniales africaines et des auxiliaires vietnamiens. Au maximum de ses effectifs, le CEFEO compte environ 190 000 hommes, même si la rotation et l'attrition des troupes restent des préoccupations constantes.\n\nSituation opérationnelle :\n\n-Delta du Tonkin : Le Viet Minh maintient une forte activité de guérilla dans le delta du fleuve Rouge. Malgré l'opération Léa et d'autres opérations de nettoyage, l'infiltration ennemie persiste.\n\n-Frontière centrale de l'Annam et du Laos : le terrain en jungle favorise les lignes d'approvisionnement de l'ennemi en provenance de Chine, où la République populaire de Chine fournit ouvertement une aide militaire au Viet Minh depuis fin 1949.\n\n-Cochinchine et secteurs du sud : les efforts de pacification ont été plus efficaces, mais l'instabilité politique et les insurrections locales demeurent.\n\nÉvaluation militaire :\n\nLes unités du CEFEO ont fait preuve d'un haut niveau de professionnalisme, en particulier le 1er Bataillon Etranger de Parachutistes et d'autres éléments de la Légion étrangère, mais le moral est sous pression en raison de la durée des déploiements, des maladies tropicales et de la difficulté de réaliser des engagements décisifs contre un ennemi habile dans les tactiques de guérilla. Le Viet Minh évite les batailles conventionnelles sauf lorsque la supériorité numérique et l'avantage du terrain sont assurés.\n\nConsidérations politiques :\n\nA Paris, la guerre est de plus en plus critiquée pour son coût en vies humaines et en trésors. Les chefs militaires préviennent que sans un coup décisif porté au Viet Minh, la guerre pourrait se prolonger indéfiniment. Le gouvernement a entamé des discussions avec les puissances alliées, notamment les États-Unis, pour obtenir un plus grand soutien logistique et financier.\n\nConclusion :\n\nLe ministère de la Défense reconnaît que le CEFEO mène une guerre d'usure dans un environnement hostile. Même si des victoires tactiques ont été remportées, l'issue stratégique reste incertaine. La poursuite du renforcement et de la modernisation des unités du CEFEO, ainsi que l'intensification des opérations, seront nécessaires pour parvenir à un règlement favorable."
 FRA_FP.8.d:0 "RAPPORT - Ministère des Armées\n\nObjet : Îles de la mer de Chine méridionale - Statut stratégique, problèmes de sécurité et transfert de souveraineté proposé\n\nLes autorités françaises en Indochine ont prospecté les îles Spratly, les îles Paracels et Pulo Condore (Con Son). Leur rapport passe en revue les tentatives de colonisation privées et les menaces pesant sur la navigation. Une proposition visant à remettre les Paracels au gouvernement de l'État du Vietnam attend une décision à Paris.\n\nÎles Spratly (Îles Spratly) :\n\nLes revendications françaises couvrent plusieurs éléments de l'archipel, même si l'occupation reste limitée. Des aventuriers privés ont avancé des revendications rivales et tenté de s'établir de petites colonies sans autorisation officielle. Les autorités ne reconnaissent aucun droit souverain découlant de ces entreprises. Des patrouilles intermittentes et des équipes de débarquement maintiennent une présence française ; les difficultés d'approvisionnement empêchent l'occupation continue de chaque île.\n\nÎles Paracels (Îles Paracels) :\n\nLes îles administrées depuis l'Indochine restent difficiles à patrouiller. Les rapports navals décrivent des bandes de pirates utilisant des mouillages éloignés pour attaquer les navires marchands. Les opérations françaises de lutte contre la piraterie ont dispersé certains de ces groupes, mais le maintien des navires sur place impose un fardeau permanent.\n\nLe ministère propose soit de conserver l'administration française et de maintenir la revendication sur les Paracels du sud, soit de transférer les Paracels sous contrôle français à l'État du Vietnam. Le maintien préserverait notre position dans les îles tout en renouvelant le conflit avec les gouvernements chinois. Une rétrocession renforcerait les relations avec le gouvernement vietnamien et sa prétention à administrer le territoire.\n\nPulo Condore (Con Son):\n\nL'archipel continue d'abriter la prison coloniale. Son port et sa station radio servent également l'administration locale. Les propositions visant à les remettre aux autorités vietnamiennes font toujours partie des négociations plus larges sur les responsabilités françaises en Indochine ; elles sont distinctes de la présente décision sur les Paracels.\n\nTransfert de souveraineté :\n\nLes négociations menées dans le cadre des accords de l'Elysée ont rehaussé la répartition des avoirs maritimes de la France. Aucun ordre de transfert des Paracels n'a encore été émis. Si Paris approuve la proposition, l'administration organisera la passation de pouvoir à l'État du Vietnam. Si le contrôle français est conservé, les autorités navales continueront leurs fonctions et maintiendront leurs revendications sur les îles du sud.\n\nLe ministère demande des instructions sur les Paracels avant d'engager du personnel ou de publier une annonce publique. Les Spratly et Pulo Condore ne sont pas inclus dans le transfert actuellement soumis à approbation."
 FRA_FP.9.d:0 "Le ministère de la Défense nationale a proposé de lever le Bataillon français de l'ONU pour servir dans les forces des Nations Unies en Corée. Composé de volontaires et commandé par des officiers français, le bataillon donnerait à la France un rôle de combat dans la défense de la Corée du Sud aux côtés de ses alliés américains.\n\nCette proposition intervient alors que la guerre en Indochine impose déjà de lourdes exigences à l'armée. Un déploiement en Corée nécessiterait des hommes et du matériel, suivis de remplacements aussi longtemps que les combats se poursuivraient. L'assistance matérielle à elle seule aiderait les forces sud-coréennes sans créer un nouvel engagement français au combat, mais aurait moins de poids auprès de Washington.\n\nLe cabinet doit décider du nombre d'effectifs qu'il peut engager en Corée tout en maintenant les forces nécessaires ailleurs."
 FRA_FP.10.d:0 "Le Corps expéditionnaire français en Extrême-Orient (CEFEO), chargé de maintenir l'autorité française en Indochine, est confronté à une grave pénurie d'effectifs. Des années d'opérations anti-insurrectionnelles exténuantes contre le Viet Minh ont épuisé les réserves, tandis que les engagements en Afrique du Nord et en Europe poussent la capacité de l'armée jusqu'au point de rupture.\n\nL'état-major a proposé deux solutions possibles :\n\n-Détourner les troupes coloniales - comme les Tirailleurs du Maroc et d'Algérie - des garnisons nord-africaines pour renforcer le CEFEO.\n\n-Autoriser le recrutement local à grande échelle d'Indochinois dans les formations du CEFEO, une politique qui pourrait renforcer les effectifs mais risque d'être infiltrée par des sympathisants nationalistes.\n\nCe choix affectera non seulement la force de nos forces en Indochine mais aussi la sécurité de nos autres possessions coloniales."
 FRA_FP.11.d:0 "Après que la violente révolte malgache de 1947-1949 ait été brutalement réprimée, Paris a cherché à remodeler sa politique à l'égard de l'île pour éviter de nouvelles révoltes et troubles. Aujourd'hui, la République française a annoncé que Madagascar obtiendrait une autonomie politique dans le cadre de l'Union française.\n\nNorbert Zafimahova, homme politique local respecté, ancien sénateur du Sénat français et administrateur colonial, a été nommé premier président de l'île dans le cadre du nouvel arrangement. Son gouvernement devrait travailler en étroite collaboration avec Paris pour assurer la stabilité politique, le développement économique et la résistance à l'influence communiste dans la région.\n\nLes responsables français présentent cette décision comme un modèle de décolonisation progressive et ordonnée, préservant les liens stratégiques et culturels tout en permettant l'autonomie locale. Les critiques au pays et à l'étranger se demandent cependant si « l'autonomie » est authentique, soulignant le contrôle continu de la France sur la défense, les affaires étrangères et les industries clés.\n\nPour Madagascar, il s'agit du premier pas vers un nouvel avenir politique - un avenir dont Paris espère qu'il restera fermement aligné sur les intérêts français."
 FRA_FP.12.d:0 "À la suite de la guerre du Cameroun et des appels à l'autonomie gouvernementale, la République française a annoncé que le Cameroun obtiendrait une autonomie politique dans le cadre de l'Union française.\n\nCharles Okala, un leader politique émergent connu pour sa position modérée et sénateur du Sénat français à Paris, a été nommé premier président du territoire. L'accord maintient la supervision française sur la défense, la politique étrangère et les secteurs économiques clés, tout en permettant au Cameroun de former son gouvernement et de gérer les affaires locales.\n\nLes responsables français décrivent cette étape comme faisant partie d'un processus de décolonisation soigneusement géré visant à maintenir la stabilité du territoire et à l'aligner sur les intérêts occidentaux au milieu de la guerre froide. Les partisans le saluent comme un équilibre pragmatique entre indépendance et coopération, tandis que les critiques - notamment parmi les groupes nationalistes radicaux - le considèrent comme une façade pour une domination coloniale continue."
 FRA_FP.13.d:0 "Répondant à une proposition de l'Organisation météorologique internationale de l'ONU et de diverses organisations météorologiques, le gouvernement français a accepté de créer une zone internationale de recherche en cédant les îles Kerguelen et les îles éparses des Terres australes et antarctiques françaises (TAAF).\n\nAbritant déjà plusieurs stations météorologiques demandées par l'Organisation météorologique mondiale, ces territoires isolés se trouvent dans une position critique, directement le long des trajectoires des cyclones tropicaux dans le sud-ouest de l'océan Indien. L'initiative permettra aux scientifiques de toutes les nations de mener des recherches météorologiques, océanographiques et climatiques dans un cadre coopératif et apolitique dans une zone internationale.\n\nLes responsables français soulignent que la souveraineté sur les îles reste inchangée, mais cette décision témoigne de la volonté de Paris d'intégrer ses territoires d'outre-mer dans la communauté scientifique mondiale plus large. Cette décision est saluée comme un pas en avant dans la coopération internationale visant à comprendre les environnements les plus reculés et les plus extrêmes de la Terre." 
 FRA_FP.14.d: "RAPPORT - Ministère de l'Europe et des Affaires étrangères\n\nObjet : Situation en Malaisie britannique\n\nSuite à l'incident de Sungai Siput, le gouvernement malais a pris des mesures contre les militants communistes, telles que des arrestations massives et leur assassinat. Même si les premières opérations ont été efficaces, les communistes se sont rapidement retirés dans la jungle, acquérant leurs stocks d'armes dans leurs cachettes. Suite à cela, ils ont formé l'Armée de libération nationale malaise - MNLA en abrégé, dirigée par Chin Peng, le chef du Parti communiste de Malaisie.\n\nLe gouvernement malais a adopté une stratégie de « contre-terrorisme », avec des niveaux élevés de coercition de l'État contre les civils, ce qui a incité davantage de personnes à rejoindre le mouvement communiste. Il peut sembler que le gouvernement ait le dessus, mais il est trop tôt pour savoir quel camp l'emportera.\n\nLes tensions en Malaisie restent élevées et nous devons être prêts au cas où la Malaisie tomberait."
 FRA_FP.15.d: "DOSSIER - Ministère des Outre-mer\n\nObjet : Statut d'Extrême-Orient \n\nAprès la victoire de la Seconde Guerre mondiale, notre domination n'a pas été réimposée en Indochine. Avec l'armistice signé avec le Japon, nos forces sont retournées en Indochine du Sud, les troupes chinoises occupant le Nord. Cependant, Hô Chi Minh, chef du Viet Minh, l'a fortement dénoncé et a déclaré l'indépendance du Vietnam de la France le jour même de la signature d'un armistice entre le CEFEO et le Japon.\n\nIndifférent à toute implication dans le conflit, Chiang Kai-shek, dirigeant de la République de Chine, a persuadé les deux parties de signer l'accord Ho-Sainteny, nous obligeant à renoncer à des concessions en Chine, en échange de leur retrait du Nord et de leur permettre de le réoccuper.\n\nUne paix difficile a été instaurée dans le Nord au cours des négociations. Cependant, un conflit a éclaté entre nous et le Viet Minh à Haiphong en novembre 1946. Par la suite, nous avons rapidement occupé la plupart des capitales provinciales, forçant le Viet Minh à se retirer dans des zones forestières et montagneuses isolées et à recourir à des tactiques de guérilla.\n\nEn octobre 1947, nous avons lancé l'Opération Léa, visant à éliminer les principales unités de combat vietnamiennes et à capturer les dirigeants du Viet Minh. En fin de compte, nous n'avons pas réussi à atteindre nos objectifs et les opérations militaires ont été interrompues faute de main-d'oeuvre.\n\nAprès l'échec de l'opération, nous nous sommes retrouvés en infériorité numérique par rapport au Viet Minh, ce qui nous a incité à trouver une solution politique. En juin 1948, le gouvernement central provisoire du Vietnam a été créé, permettant l'unification vietnamienne et approuvant l'unification de la Cochinchine avec lui en mai 1949.\n\nAvec une armée épuisée et en infériorité numérique, il est difficile de dire que nous triompherons sans trouver des solutions alternatives à ce conflit."
 
 FRA_Quai_d_Orsay:0 "Le Quai d'Orsay"
 FRA_Quai_d_Orsay_desc:0 "Les dépêches de Washington rivalisent avec les rapports de Hanoï sur le bureau du ministre des Affaires étrangères. Le Quai d'Orsay doit porter ces engagements concurrents devant le cabinet avec une politique cohérente, donnant une direction plus ferme à la diplomatie française malgré la succession de gouvernements."
 FRA_Ministry_Overseas_Territories_French_Union:0 "Administrer l'Union française"
 FRA_Ministry_Overseas_Territories_French_Union_desc:0 "La constitution de 1946 a remplacé le langage de l'empire par la promesse d'une Union française, mais les gouverneurs et les élus ne sont toujours pas d'accord sur les implications de cette promesse. Une réflexion du ministère des Outre-mer permettra de clarifier nos responsabilités et de rallier une politique commune d'outre-mer."
 FRA_Grant_Autonomy_Malagasy:0 "Autonomie malgache"
 FRA_Grant_Autonomy_Malagasy_desc:0 "La répression du soulèvement malgache a laissé des prisonniers, des villages ruinés et des griefs qu'une circulaire administrative ne peut régler. Accorder à Madagascar le statut d'État associé confierait davantage de ses affaires à un gouvernement local tout en préservant ses relations avec la France."
 FRA_Wipe_Malagasy_Rebels:0 "Renforcer l'administration malgache"
 FRA_Wipe_Malagasy_Rebels_desc:0 "Les responsables malgaches préviennent que la défaite du soulèvement n'a pas mis fin à la résistance à la domination française. Nous fournirons des fusils et des moyens de transport motorisés aux autorités de l'île et développerons la production industrielle et d'armes locale pour soutenir leur campagne."
 FRA_Intensify_Franconization_Algeria:0 "Approfondir l'intégration de l'Algérie"
 FRA_Intensify_Franconization_Algeria_desc:0 "Les défenseurs de l'Algérie française insistent sur le fait que les départements du pourtour méditerranéen appartiennent autant à la République que ceux du continent. Nous consoliderons cette affirmation en traitant davantage de territoires algériens comme un territoire français à part entière, même si les nationalistes contestent les inégalités qui les sous-tendent."
 FRA_Internationalization_TAAF:0 "Ouvrir les Terres du Sud à la science"
 FRA_Internationalization_TAAF_desc:0 "Les Terres australes et antarctiques françaises offrent des sites précieux pour l'observation météorologique et la recherche océanographique. Une administration dépendante distincte offrirait un cadre aux travaux scientifiques internationaux tout en conservant la tutelle française sur le territoire."
 FRA_Incorporate_TAAF:0 "Incorporer les Terres du Sud"
 FRA_Incorporate_TAAF_desc:0 "Administrer nos îles lointaines du sud à travers Madagascar laisse leur statut lié à l'avenir politique de l'île. Nous les établirons comme une possession française à part entière, supprimant les revendications territoriales malgaches héritées de l'ancien arrangement administratif."
 FRA_Fund_Economic_Social_Development:0 "Financer le développement à l'étranger"
 FRA_Fund_Economic_Social_Development_desc:0 "Les représentants d'outre-mer ont entendu des promesses répétées de progrès économique et social sous l'Union française. Un financement du Trésor pour l'industrie civile dans l'ensemble de nos dépendances donnerait un soutien matériel à ces promesses et réduirait leur dépendance à l'égard des produits manufacturés importés."
 FRA_Begin_Colonial_Modernization_Projects:0 "Moderniser les territoires africains"
 FRA_Begin_Colonial_Modernization_Projects_desc:0 "Dans les territoires africains, les plans d'aménagement restent trop souvent des dossiers en attente d'un crédit de Paris. Un investissement substantiel dans les sites industriels autour de leurs capitales permettra de mettre en service de nouvelles usines et de réserver des terrains pour de nouvelles constructions."
 FRA_Relaxing_Citizenships_Criteria:0 "Rendre la citoyenneté de l'Union accessible"
 FRA_Relaxing_Citizenships_Criteria_desc:0 "La citoyenneté proclamée en 1946 n'a pas supprimé les barrières administratives et les pratiques inégales rencontrées par les habitants d'outre-mer. L'assouplissement de ces restrictions peut accroître les opportunités dans nos dépendances africaines, notamment en matière de développement local, même si les opposants à la réforme risquent de perturber la position du gouvernement dans leur pays."
 FRA_Casablanca_Riots:0 "Les émeutes de Casablanca"
 FRA_Casablanca_Riots_desc:0 "Des informations faisant état de grèves et de combats de rue à Casablanca ont porté la crise politique du protectorat marocain devant le cabinet. Les troubles et la réponse officielle détermineront le moment où Paris devra affronter le problème ; cela ne peut pas être programmé comme une autre initiative ministérielle."
 FRA_Tunisian_Morrocan_Independence:0 "Indépendance de la Tunisie et du Maroc"
 FRA_Tunisian_Morrocan_Independence_desc:0 "Les revendications nationalistes en Tunisie et au Maroc ont dépassé les concessions proposées au sein des protectorats. Reconnaître les deux pays comme indépendants mettra fin à la tutelle politique française et laissera nos relations futures faire l'objet de négociations entre gouvernements souverains."
 FRA_Cameroon_War:0 "Le conflit camerounais"
 FRA_Cameroon_War_desc:0 "L'Union des peuples du Cameroun conteste l'autorité française sur un territoire administré sous tutelle des Nations Unies. Alors que les informations faisant état d'activités insurrectionnelles et d'opérations de sécurité parviennent à Paris, les événements au Cameroun obligeront à décider s'il faut renforcer l'administration existante ou concéder l'autorité locale."
 FRA_Maintain_Colonial_Regime:0 "Faire respecter la domination française au Cameroun"
 FRA_Maintain_Colonial_Regime_desc:0 "L'administration camerounaise affirme que les concessions faites sous la pression des insurgés affaibliraient tous les responsables qui répondent encore à la France. Des fusils, des équipements de soutien et des camions, soutenus par une production d'armes supplémentaire, renforceront sa capacité à conserver le territoire."
 FRA_Grant_Cameroon_Autonomy:0 "Un gouvernement camerounais sous Okala"
 FRA_Grant_Cameroon_Autonomy_desc:0 "Charles Okala propose à Paris un partenaire pour un transfert limité d'autorité au Cameroun. Nous placerons sous sa direction un gouvernement dirigé localement tout en conservant une étroite surveillance française, en cherchant une alternative à la fois à l'administration directe et à une victoire insurrectionnelle."
 FRA_Prepare_Decolonization:0 "Préparez-vous à la décolonisation"
 FRA_Prepare_Decolonization_desc:0 "Le ministère des Outre-mer doit préparer les transferts de compétences que Paris n'a jusqu'ici négociés que sous pression. Donner désormais une plus grande autonomie à nos dépendances africaines laissera aux responsables des arrangements qu'ils pourront mettre en oeuvre lorsque la France promettra la liberté de l'Afrique en 1958, renforçant ainsi la confiance du public et la main du gouvernement lorsque cet engagement sera pris."
 FRA_Prepare_Decolonization_tt:0 "La réalisation de la promesse de liberté africaine de 1958 accordera 5 % de stabilité supplémentaire et 50 % de pouvoir politique."
 FRA_Suez_Crisis:0 "Affronter la crise de Suez"
 FRA_Suez_Crisis_desc:0 "La nationalisation du canal de Suez par Nasser a mis les intérêts commerciaux et la sécurité des communications méditerranéennes devant le cabinet. Son soutien aux nationalistes algériens donne au conflit une dimension française immédiate, exigeant une évaluation diplomatique et militaire coordonnée."
 FRA_Sign_Protocol_Sevres:0 "Le Protocole de Sèvres"
 FRA_Sign_Protocol_Sevres_desc:0 "Les discussions secrètes à Sèvres proposent un plan d'action coordonnée par la France, la Grande-Bretagne et Israël contre l'Égypte. Une attaque israélienne serait l'occasion d'un ultimatum anglo-français sur le canal, dissimulant une intervention convenue derrière une prétention de séparer les belligérants."
 FRA_Prepare_Invasion_Force:0 "Préparez l'expédition égyptienne"
 FRA_Prepare_Invasion_Force_desc:0 "Toute opération contre l'Égypte nécessite des dispositions allant au-delà du déplacement des troupes vers des transports. Garantir l'accès à travers le territoire israélien et revoir les préparatifs de l'expédition donneront à nos commandants une base plus solide pour une action commune."
 FRA_Accept_Post_Colonial_New_Order:0 "Acceptez les limites de l'intervention"
 FRA_Accept_Post_Colonial_New_Order_desc:0 "La crise de Suez s'est terminée sans la victoire promise par les partisans de l'expédition, et la France n'est plus en guerre contre l'Égypte. Accepter les limites révélées par l'intervention contribuera à rétablir les relations avec Washington et les gouvernements arabes. Chez eux, les ministres doivent répondre à ceux qui considèrent le retrait comme une humiliation."
 FRA_Victoire:0 "Victoire"
 FRA_Victoire_desc:0 "Alors que la France reste en guerre contre l'Égypte, les forces françaises ou leurs partenaires doivent tenir la zone du canal avant que le cabinet puisse proclamer un succès militaire. La possession du canal donnerait aux partisans de l'expédition une raison de rallier le pays à cette campagne, même si Washington et Moscou la condamnent. Déclarer la victoire ne mettra pas fin en soi à la guerre."
 FRA_Sign_Ceasefire:0 "Mettre fin aux hostilités avec l'Égypte"
 FRA_Sign_Ceasefire_desc:0 "La France est toujours en guerre contre l'Égypte, et chaque nouvelle opération prolonge un différend que nos alliés souhaitent mettre fin. Nous conclurons un cessez-le-feu sans imposer de conditions territoriales. La fin des combats devrait stabiliser le gouvernement dans son pays, même si cela décevra ceux qui espéraient que l'expédition obtiendrait un règlement plus ambitieux."
 FRA_CEFEO_FarEast_Desk:0 "Revoir les engagements d'Extrême-Orient"
 FRA_CEFEO_FarEast_Desk_desc:0 "Le Corps expéditionnaire français en Extrême-Orient envoie des demandes d'hommes et de matériels indissociables de notre diplomatie envers la Chine et les Etats voisins. Un examen conjoint de la région donnera au cabinet une base plus claire pour orienter les engagements de la France en Asie."
 FRA_Recognize_PRC:0 "Reconnaître la République populaire"
 FRA_Recognize_PRC_desc:0 "La victoire communiste en Chine a placé la France face à un gouvernement dont le contrôle du continent a des conséquences immédiates pour l'Indochine. Une reconnaissance améliorerait les relations avec Pékin, au prix d'une rupture brutale avec la République de Chine."
 FRA_Enter_Dialogue_Zhou_Enlai:0 "Discussions ouvertes avec Zhou Enlai"
 FRA_Enter_Dialogue_Zhou_Enlai_desc:0 "La reconnaissance à elle seule ne réglera pas nos désaccords avec le gouvernement chinois sur l'Indochine. L'ouverture de discussions avec Zhou Enlai permettrait aux deux parties d'exprimer directement leurs préoccupations, sans présumer qu'elles soient prêtes à faire des concessions."
 FRA_Maintain_Support_Kuomintang:0 "Soutenez la République de Chine"
 FRA_Maintain_Support_Kuomintang_desc:0 "Les partisans du maintien des relations avec Chiang Kai-shek préviennent que l'abandon de la République de Chine récompenserait les avancées communistes à travers l'Asie. Maintenir cet engagement renforcera nos liens avec le gouvernement nationaliste tout en aggravant les relations avec son rival communiste."
 FRA_Begin_Economic_Cooperation_Nanking:0 "Coopération économique avec Nankin"
 FRA_Begin_Economic_Cooperation_Nanking_desc:0 "Une victoire nationaliste sur le continent offre à la France l'opportunité de reconstruire ses relations commerciales avec Nankin. L'expansion industrielle conjointe et l'augmentation de la marine marchande donneront aux deux pays un intérêt concret dans le partenariat."
 FRA_Maintain_ROC_Seat_UNSC:0 "Défendre le siège nationaliste de la Chine"
 FRA_Maintain_ROC_Seat_UNSC_desc:0 "La question de savoir qui représente la Chine aux Nations Unies est devenue un test d'allégeance diplomatique. Maintenir le siège permanent de la République de Chine au Conseil de sécurité nous liera plus étroitement aux nationalistes et approfondira le différend avec Pékin."
 FRA_Funding_Kampuchea_Laos:0 "Soutenez le Kampuchéa et le Laos"
 FRA_Funding_Kampuchea_Laos_desc:0 "Les gouvernements du Kampuchéa et du Laos ont besoin de ressources propres s'ils veulent résister aux pressions qui s'étendent à travers l'Indochine. L'aide financière et la production de nouvelles armes renforceront leur capacité à maintenir leurs forces plutôt que de dépendre entièrement de l'approvisionnement français."
 FRA_First_Indochina_War:0 "Soutenir la campagne d'Indochine"
 FRA_First_Indochina_War_desc:0 "La guerre contre le Viet Minh consomme les ressources françaises tandis que chaque revers renforce les exigences d'un départ négocié. Un engagement renouvelé envers le commandement expéditionnaire renforcera notre position dans la lutte, mais cela poussera également le conflit vers une nouvelle escalade."
 FRA_South_China_Sea_Islands_Situation:0 "Découvrez les îles de la mer de Chine méridionale"
 FRA_South_China_Sea_Islands_Situation_desc:0 "Les revendications françaises dans les Paracels et les Spratleys reposent sur des postes et des patrouilles épars, loin des principaux combats en Indochine. Les ministères doivent revoir la sécurité et la souveraineté de ces possessions maritimes, car les revendications vietnamiennes et chinoises rivales compliquent leur avenir."
 FRA_CEFEO_Manpower_Issue:0 "Le corps expéditionnaire a besoin d'hommes"
 FRA_CEFEO_Manpower_Issue_desc:0 "Le commandement expéditionnaire ne peut pas continuer à remplacer les blessés tout en maintenant chaque garnison et réserve mobile. Son rapport sur les effectifs propose à Paris deux solutions concurrentes : recruter davantage d'hommes en Indochine ou envoyer des formations supplémentaires depuis l'étranger."
 FRA_Request_US_Intervention:0 "Demander une intervention américaine"
 FRA_Request_US_Intervention_desc:0 "L'aide américaine a rendu Washington de plus en plus important dans la conduite de la guerre d'Indochine. Nous demanderons aux États-Unis d'envisager une intervention directe, laissant leur gouvernement décider si la résistance à l'expansion communiste justifie un engagement plus profond."
 FRA_Encourage_Local_Recruitment_Indochinese:0 "Développer le recrutement indochinois"
 FRA_Encourage_Local_Recruitment_Indochinese_desc:0 "Les commandants affirment que les hommes recrutés dans les territoires qu'ils défendent peuvent soulager la dépendance du corps expéditionnaire à l'égard des remplacements venus de l'étranger. L'élargissement du recrutement local dans toutes les zones sous son contrôle ouvrira une base de main-d'oeuvre plus large et apportera un apport immédiat de volontaires."
 FRA_Send_Tirailleur_Reinforcements:0 "Envoyer des renforts à l'étranger"
 FRA_Send_Tirailleur_Reinforcements_desc:0 "L'état-major préfère renforcer le corps expéditionnaire avec des formations supplémentaires plutôt que de s'appuyer sur un recrutement local plus large. D'autres unités, dont des troupes de la Légion étrangère, seront rassemblées sous le commandement de l'Indochine pour pallier la pénurie."
 FRA_Korean_War:0 "Guerre dans la péninsule coréenne"
 FRA_Korean_War_desc:0 "Les combats en Corée imposent une nouvelle exigence à la France alors que son armée reste fortement engagée en Indochine. L'évolution de la péninsule et la réponse internationale poseront au gouvernement la question de la contribution française."
 FRA_Advisory_Mission_Korea:0 "Une mission militaire en Corée"
 FRA_Advisory_Mission_Korea_desc:0 "Une mission militaire offre un moyen de soutenir la Corée du Sud sans engager un bataillon de combat français. Parallèlement à des relations plus étroites, l'aide à la production d'armes aidera les forces coréennes à soutenir leur propre effort de guerre."
 FRA_Recognize_South_Korea:0 "Soutenez la République de Corée"
 FRA_Recognize_South_Korea_desc:0 "Un engagement diplomatique ferme envers la République de Corée ne laisserait aucun doute sur la position de la France dans le conflit. Un soutien à l'industrie civile accompagnera cet engagement, renforçant ainsi la base économique dont dépend le gouvernement coréen."
 FRA_Form_BFONU:0 "Former le bataillon français de l'ONU"
 FRA_Form_BFONU_desc:0 "Les volontaires pourraient apporter une contribution de combat française à l'effort des Nations Unies sans nécessiter un détournement général des conscrits d'Europe. Nous proposerons au gouvernement la formation du Bataillon français de l'ONU, en s'appuyant sur les officiers et soldats expérimentés de l'armée."
 FRA_Fund_South_Korean_Reconstruction:0 "Reconstruire la Corée du Sud"
 FRA_Fund_South_Korean_Reconstruction_desc:0 "L'économie coréenne endommagée ne peut pas se rétablir uniquement grâce aux livraisons militaires. Le développement de l'industrie civile et des locaux commerciaux dans la région de la capitale, avec des espaces réservés à de nouvelles constructions, donnera à la reconstruction une base plus large."
 FRA_Malayan_Emergency:0 "Revoir l'urgence malaise"
 FRA_Malayan_Emergency_desc:0 "Les opérations britanniques contre l'insurrection communiste en Malaisie offrent à la fois des avertissements et des points de comparaison à nos commandants en Indochine. Un rapport régional examinera la campagne et les choix politiques auxquels sont confrontées les autorités malaises avant que la France ne détermine sa propre implication."
 FRA_Advisory_Mission_Malaya:0 "Envoyer des conseillers en Malaisie"
 FRA_Advisory_Mission_Malaya_desc:0 "Les officiers servant en Malaisie et en Indochine sont confrontés à des difficultés similaires pour adapter les forces conventionnelles à une guerre d'insurrection. Une mission de conseil française aidera le commandement malais à développer sa doctrine grâce à un échange continu d'expériences militaires."
 FRA_Recognize_Malaya:0 "Établir des relations avec la Malaisie"
 FRA_Recognize_Malaya_desc:0 "Les autorités malaises ont besoin d'un soutien international ainsi que d'une réponse militaire à l'insurrection. Une reconnaissance formelle, accompagnée d'une aide à l'industrie civile, encouragera des relations plus étroites avec la France."
 FRA_Settle_Malayans_South_Vietnam:0 "Installer des Malais dans le sud du Vietnam"
 FRA_Settle_Malayans_South_Vietnam_desc:0 "L'état d'urgence a donné lieu à des propositions visant à réinstaller les habitants de Malaisie hors de portée des combats. Parrainer une colonie malaise dans le sud du Vietnam ajouterait une nouvelle communauté et augmenterait la population de la région, même si l'Indochine n'offre aucun refuge assuré contre la violence politique."
 FRA_Funding_Malayan_Reconstruction:0 "Investir dans la reconstruction malaise"
 FRA_Funding_Malayan_Reconstruction_desc:0 "Une contribution française substantielle à la reconstruction malaise établirait une présence économique parallèlement à nos engagements diplomatiques. Le financement du développement commercial à Kuala Lumpur et l'ouverture de chantiers de construction à travers le pays augmenteront également l'influence française."
 FRA_Recognize_Sarawak_Borneo:0 "Relations avec le Sarawak et le nord de Bornéo"
 FRA_Recognize_Sarawak_Borneo_desc:0 "Le Sarawak et le nord de Bornéo occupent une place importante sur les routes maritimes reliant la mer de Chine méridionale à l'archipel dans son ensemble. L'extension de la reconnaissance diplomatique et le soutien à l'industrie civile dans les deux territoires permettront à la France de resserrer ses liens au-delà de la péninsule malaise."
 FRA_Geneva_Peace_Conference:0 "La Conférence de paix de Genève"
 FRA_Geneva_Peace_Conference_desc:0 "Une fois que les puissances auront accepté de convoquer la conférence de Genève, la France pourra envoyer sa délégation à la table des négociations. Y assister ne règle pas la guerre ; les négociations et les combats détermineront l'issue."
 FRA_Failed_State_Ending:0 "Un règlement sans autorité"
 FRA_Failed_State_Ending_desc:0 "Le retrait français a laissé les autorités rivales incapables de maintenir la cohésion du Vietnam. Les responsables qui négociaient autrefois pour un gouvernement unique sont désormais confrontés à des administrations concurrentes et à des mouvements armés dont l'autorité s'arrête à leurs propres points de contrôle. Cette focalisation est automatiquement complétée par cet effondrement, le cabinet supportant le coût politique de l'échec du règlement."
 FRA_Enforce_Federation_Proposal:0 "Appuyez sur le règlement fédéral"
 FRA_Enforce_Federation_Proposal_desc:0 "La guerre s'est terminée par un règlement fédéral qui maintient le Vietnam au sein de l'Union française tout en concédant une plus grande autonomie locale. Les représentants français doivent désormais oeuvrer au sein des nouvelles institutions et entretenir des liens avec les gouvernements du Vietnam, du Laos et du Cambodge. Cette focalisation enregistre le résultat fédéral et est complétée automatiquement lorsque ce règlement entre en vigueur."
 FRA_Accept_Temporary_Partitions:0 "Accepter la partition provisoire"
 FRA_Accept_Temporary_Partitions_desc:0 "Le règlement de Genève a établi les conditions dans lesquelles la France doit mettre fin à son intervention, que le Vietnam reste sous un gouvernement unique ou que l'accord trace une ligne de partition provisoire. Les représentants français doivent mettre en oeuvre les arrangements convenus plutôt que de promettre un retour à l'administration d'avant-guerre. Le règlement complète automatiquement cette focalisation ; Paris ne peut pas choisir une partition indépendamment des négociations."
 FRA_Accept_Unified_Interim_Settlement:0 "Accepter le règlement provisoire unifié"
 FRA_Accept_Unified_Interim_Settlement_desc:0 "Le règlement de Genève laisse le Vietnam sous une administration intérimaire unique, avec un vote national sur son gouvernement permanent dans un délai de deux ans. La France doit faire en sorte que les arrangements convenus soient maintenus jusqu'au scrutin."
 FRA_Accept_Three_States_Settlement:0 "Acceptez le règlement à trois États"
 FRA_Accept_Three_States_Settlement_desc:0 "Le règlement de Genève divise le Vietnam en trois États distincts, avec une zone nord détenue par le Kuomintang. La France doit mettre en oeuvre cet arrangement et retirer ses forces des zones que les accords cèdent à d'autres."
 FRA_The_Conference_Collapses:0 "La conférence s'effondre"
 FRA_The_Conference_Collapses_desc:0 "Les négociations de Genève ont été interrompues sans accord. La France n'a aucun règlement à mettre en oeuvre et la guerre d'Indochine continue."
 FRA_Accept_Diems_Regime:0 "Négocier avec le gouvernement à Saigon"
 FRA_Accept_Diems_Regime_desc:0 "Le gouvernement établi à Saigon après le règlement est l'autorité avec laquelle la France doit désormais traiter, que Ngo Dinh Diem reste au pouvoir ou qu'un autre dirigeant prenne sa place. Accepter ce gouvernement et améliorer les relations donneront à nos représentants une base plus solide pour préserver l'influence française sans chercher à remplacer ses ministres."
 FRA_Anti_Diem_Coup:0 "Demander le retrait de Diem"
 FRA_Anti_Diem_Coup_desc:0 "Tant que Diem gouverne Saigon et que les officiers prêts à agir contre lui restent en place, la France peut encourager son renvoi. Soutenir ces rivaux nous mettrait en conflit avec Washington. Notre intervention passera par la confrontation avec Nguyen Van Hinh lorsque cela est possible, ou encouragera un coup d'État pro-français à travers la mission putschiste existante ; elle ne peut garantir le succès des conspirateurs."
 FRA_Anti_Diem_Coup_tt:0 "Encourage un coup d'État pro-français à Saigon à travers la crise de Nguyen Van Hinh, si cette voie reste ouverte, ou à travers la mission putschiste pro-française existante. Ne garantit pas le retrait de Diem."
 FRA_Retreat_From_Indochina:0 "Se retirer d'Indochine"
 FRA_Retreat_From_Indochina_desc:0 "Paris ne peut plus soutenir un commandement expéditionnaire dont il ne veut pas défendre les objectifs politiques. Mettre fin à cet engagement affaiblirait la position française dans toute lutte continue, favoriserait la désescalade et mettrait le corps expéditionnaire sur la voie de la dissolution."
 FRA_Total_Victory:0 "Dicter le règlement de l'Indochine"
 FRA_Total_Victory_desc:0 "Les forces anticommunistes ont remporté une victoire décisive en Indochine. Paris peut se targuer d'un succès militaire, mais le règlement doit encore refléter l'autorité assurée par nos partenaires vietnamiens et les peuples qui ont combattu à nos côtés. La victoire dans la guerre complète automatiquement cette orientation ; le règlement qui en résulte détermine également quelle disposition territoriale est enregistrée ci-dessous."
 FRA_Grant_Independence_Ethnostates:0 "Indépendance des peuples des Highlands"
 FRA_Grant_Independence_Ethnostates_desc:0 "Le règlement victorieux a reconnu des États indépendants pour les peuples des hautes terres qui ont combattu sous la protection française. Leurs gouvernements se tourneront vers Paris pour défendre les arrangements contre les demandes d'unité territoriale vietnamienne. Complété automatiquement par ce résultat, le focus enregistre les nouveaux États plutôt que d'autoriser un partage séparé après la victoire."
 FRA_Transfer_North_To_South:0 "Confier le Nord à Saigon"
 FRA_Transfer_North_To_South_desc:0 "La victoire a placé les territoires du Nord sous l'autorité du gouvernement de Saigon, établissant ainsi un Vietnam anticommuniste unifié. La France doit désormais conduire ses relations avec un gouvernement dont la portée s'étend au-delà de l'ancienne zone sud. Cette concentration est complétée automatiquement par la réunification sous Saigon, et non par un ordre français distinct de transférer le nord."