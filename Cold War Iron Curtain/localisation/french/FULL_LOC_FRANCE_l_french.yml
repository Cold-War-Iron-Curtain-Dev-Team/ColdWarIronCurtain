 FRA_ind_dev:0 "Développer l'industrie"
 FRA_ind_dev_desc:0 "Une fois notre reconstruction terminée, la poursuite du développement vers notre secteur industriel est définitivement de mise."
 FRA_mainland:0 "Le continent"
 FRA_mainland_desc:0 "La France métropolitaine étant le coeur de notre nation, le développement de sa capacité industrielle s'impose."
 FRA_urbanism:0 "Urbanisme"
 FRA_urbanism_desc:0 "Nos régions urbaines connaissent une explosion de la croissance démographique, dont une grande partie provient de personnes qui quittent les zones rurales. La poursuite du développement et de l'expansion de nos villes et villages est nécessaire."
 FRA_mic_one:0 "Développement militaire"
 FRA_mic_one_desc:0 "La menace rouge étant si répandue, même dans notre propre pays, le renforcement de notre production militaire est particulièrement nécessaire."
 FRA_mic_two:0 "Continuer à développer notre industrie militaire"
 FRA_mic_two_desc:0 "Notre armée a besoin d'une modernisation supplémentaire pour suivre le rythme des autres grandes puissances."
 FRA_cic_one:0 "Développement civil"
 FRA_cic_one_desc:0 "Notre secteur civil a été gravement endommagé pendant la guerre, et il est désormais réparé. La poursuite du développement et des investissements devraient protéger notre nation contre de nouveaux dommages."
 FRA_more_cic:0 "Continuer à développer l'industrie civile"
 FRA_more_cic_desc:0 "Notre secteur civil a davantage besoin d'investissements afin de renforcer davantage notre industrie."
 FRA_ind_reform:0 "Une industrialisation réussie"
 FRA_ind_reform_desc:0 "Les plans actuels visant à poursuivre l'expansion de notre industrie ont été réalisés de manière adéquate."
 
 
 
 
