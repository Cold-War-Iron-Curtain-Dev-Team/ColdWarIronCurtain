 fra_rene_mayer:0 "Enquête sur René Mayer"
 fra_rene_mayer_desc:0 "René Mayer est ministre des Finances et de l'Économie, de la Défense nationale et de la Justice. Il devient également vice-président de l'Alliance Israélite Universelle. Il est un porte-parole franc des pétitions en faveur de la grande colonisation à l'Assemblée nationale. Si nous ne mettons pas fin à cette ridicule vendetta, il pourrait aggraver les soulèvements algériens..."
 rene_mayer_tooltip:0 "Une enquête sur René Mayer va être menée\nEn cas de succès, cela favorisera §Yla paix en Algérie§! de §G3§! et diminuera §Yle nationalisme algérien§! de §G1§!"
