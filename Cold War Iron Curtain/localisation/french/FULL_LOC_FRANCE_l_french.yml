 tooltip_gerboise_blanche:0 "Nous ferons exploser la Gerboise Blanche et observerons les effets sur les prisonniers algériens capturés"
 fra_nuclear_test_on_algerian_prisoners:0 "Faire exploser Gerboise Blanche | Essais nucléaires sur des prisonniers algériens"
 fra_extend_natives_algerian_rights_1:0 "Lancer un vote au Parlement pour donner aux autochtones algériens des droits égaux"
 fra_sicomi:0 "SICOMI"
 Algerian_Independentism_desc:0 "Guerre d'Algérie\nRelation Français-Autochtones : §G[?FRA.Algerian_mending]§!\nNationalisme algérien : §R[?FRA.Algerian_Nationalism]§!"
 fra_algerian_rights_1_tooltip:0 "Nous essaierons de faire adopter une loi au Parlement, accordant des droits étendus aux Algériens de souche, changeant leur statut d'Autochtone à Français musulman. Bien sûr, il ne s'agit pas d'une citoyenneté à part entière, mais si cette loi est adoptée, nous espérons leur donner des droits égaux à l'avenir."
