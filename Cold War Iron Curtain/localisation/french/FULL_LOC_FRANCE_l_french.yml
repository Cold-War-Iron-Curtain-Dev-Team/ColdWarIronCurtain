l_french:
 CWIC.2.t:0 "Miracle de l'utérus d'acier !"
 CWIC.2.d:0 "Moscou, le 4 décembre 1993\n\nDans une révélation qui a stupéfié les scientifiques, les soldats et les hommes d'État, l'Institut de cybernétique soviétique a annoncé que l'unité §YKaterina-7§!, une construction compagnon autonome de classe IV, porte un enfant.\n\nCette grossesse, la première enregistrée entre l'homme et la machine, survient deux ans seulement après que le plan d'automatisation populaire de l'URSS ait introduit des robots dans chaque usine, ferme et bureau de l'Union. Aujourd'hui, il semble que la frontière entre la chair et l'acier soit encore plus floue.\n\nL'ingénieur en chef Yuri S. Dmitriev a déclaré : §G\"Nous avons réalisé la synthèse dialectique de la biologie et de la machinerie. C'est la victoire du socialisme sur les limites de la nature.\"§! Les médias d'État appellent l'enfant à naître §Y« Le bébé du peuple »§!, tandis qu'en Occident, l'OTAN organise des réunions d'urgence pour discuter de ce que cette avancée pourrait signifier pour l'équilibre des pouvoirs.\n\nL'échéance est fixée à avril 1994. Entre-temps, les yeux du monde se tournent vers Moscou, où l'avenir est peut-être déjà en train de se dessiner."
 fre_report.1.t:0 "L'inspection inversée"
 fre_report.1.d:0 "Le général Georges Revers, nouvellement chargé d'examiner la dégradation de la position française en Indochine, a achevé sa mission d'inspection. Accompagné de Roger Peyré, son proche collaborateur, Revers devait proposer des solutions pour reprendre l'initiative dans le conflit qui s'aggrave entre la colonie et le Viet Minh.\nLe rapport Revers qui en résulte, soumis confidentiellement le 29 juin 1949, offre une sombre perspective : défaites militaires généralisées, corruption endémique au sein du régime Bao-Dai, troupes locales peu fiables et faible moral des soldats français. Revers propose une réorientation majeure - un retrait partiel des postes frontières nord indéfendables, la formation d'une armée nationale vietnamienne et l'internationalisation du conflit pour obtenir le soutien britannique et thaïlandais ou la proposition d'un traité de paix avec Ho-chi-Minh.\nLe rapport, imprimé à seulement 50 exemplaires top-secrets, était destiné uniquement aux plus hauts niveaux du gouvernement. Mais ses critiques brutalement honnêtes de la politique coloniale française et du gouvernement Bao-Dai suscitent bientôt l'indignation des cercles politiques et militaires."
 fre_report.1.a:0 "Ignorez-le et mettez-le sur la touche"
 fre_report.1.b:0 "Laissons implémenter ses propositions"
 fre_report.2.t:0 "Les documents sont divulgués"
 fre_report.2.d:0 "Le 18 septembre, une violente altercation près de la gare de Lyon révèle le scandale. La police arrête Do-Dai-Phuoc, un juriste vietnamien et sympathisant présumé du Viet Minh, portant une copie dactylographiée complète du rapport marqué « Top Secret ». La DST (Direction de la Surveillance du Territoire) ouvre une enquête immédiate. En quelques semaines, plus de 70 copies non autorisées sont découvertes dans les cercles nationalistes vietnamiens à Paris et même à la Légation vietnamienne.\nLes preuves révèlent que Roger Peyré, agissant avec le soutien informel du général Mast et peut-être du général Revers lui-même, en a distribué des exemplaires à Van-Co et au prince Vinh-Xa - deux personnalités nationalistes clés ayant des liens avec le Viet Minh. La partie politique du rapport fut éditée de manière sélective : des exemplaires faisant l'éloge de Bao-Dai furent envoyés aux monarchistes, tandis que des annexes critiques parvinrent au Viet Minh.\nAlors que des fragments du reportage commencent à être diffusés sur la radio Viet Minh, l'indignation grandit au sein de l'Assemblée nationale et des dirigeants militaires. La stratégie coloniale de la France est désormais exposée, tant à ses ennemis qu'aux critiques intérieures."
 fre_report.2.a:0 "Merde...."
 fre_report.3.t:0 "Crise dans les rangs français"
 fre_report.3.d:0 "Un rapport militaire français confidentiel du général Georges Revers, initialement destiné à évaluer et améliorer la situation de guerre en Indochine, a été divulgué au public - et pire encore, à nos ennemis. Le soi-disant rapport Revers dresse un sombre tableau de la force militaire française, dénonce notre gouvernement comme corrompu et inefficace et recommande des retraits majeurs des positions stratégiques au Tonkin.\n\nBien qu'il ait été conçu comme un document interne, des acteurs traîtres en France et dans les cercles nationalistes vietnamiens l'ont largement diffusé, permettant au Viet Minh de claironner la faiblesse française et de se moquer de notre gouvernement souverain. Nous sommes indignés qu'un tel contenu diffamatoire puisse être écrit, et encore moins diffusé. L'empereur Bao-Dai lui-même a exprimé de vives inquiétudes, notamment face à la duplicité du général Mast et à la conduite scandaleuse de Roger Peyré.\n\nC'est un poignard pointé directement vers notre légitimité nationale. Alors que les Français peinent à coordonner leur commandement, notre gouvernement exige un contrôle plus fort et une plus grande responsabilité sur nos propres forces nationales."
 fre_report.3.a:0 "Nous devons nous assurer que ces documents ne seront pas rendus publics"
 fre_report.4.t:0 "les affaires des Levers"
 fre_report.4.d:0 "Le soi-disant Rapport Revers, une analyse top-secrète du général Revers sur la mission expéditionnaire française en Indochine, est tombé entre nos mains. Ce rapport accablant confirme ce que l'on sait depuis longtemps : les colonialistes français sont en train de perdre. Leurs soldats souffrent d'épuisement, leurs commandants doutent du but de la guerre et leur fantoche Bao-Dai est considéré par ses propres sponsors comme corrompu, inefficace et incapable de gouverner.\nL'honnêteté brutale du rapport n'a d'égale que son imprudence politique : il recommande d'abandonner les avant-postes et fait allusion à des négociations avec des puissances régionales comme la Thaïlande et la Grande-Bretagne. Les impérialistes ne parviennent même pas à se mettre d'accord sur une stratégie, et leur corruption interne les ronge vivants.\nNos bureaux de propagande diffusent déjà largement le contenu du rapport. Que le peuple vietnamien et le monde entier voient le véritable état de la machine de guerre coloniale !"
 fre_report.4.a:0 "Une victoire pour le peuple"
