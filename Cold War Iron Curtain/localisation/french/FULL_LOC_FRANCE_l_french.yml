 FRA_NATO_PCF.1.d:0 "Après sa victoire électorale, le Parti communiste français (PCF) a commencé à mettre en oeuvre son mandat. Depuis la création de l'OTAN en 1949, beaucoup de Français soupçonnaient que l'alliance érodait l'indépendance de l'armée et de l'État français. Plus important encore, le PCF a soutenu que l'alliance cherchait à renverser la volonté des peuples des États membres. Les États-Unis pourraient éventuellement tirer parti de l'OTAN pour cibler activement la gauche ou tout groupe considéré comme une menace. Fort de ces préoccupations et réflexions, le PCF a annoncé qu'il avait mis fin à l'adhésion de la France à l'OTAN et qu'il retirerait complètement la France de l'OTAN. La France ne serait plus un outil au service des intérêts impérialistes des États-Unis ou même du Royaume-Uni et elle serait enfin complètement indépendante des influences extérieures. La nouvelle de la décision de la France de mettre fin à son adhésion à l'OTAN a secoué Washington et Londres. Tous deux envisageaient la France comme le principal pilier de la défense des États membres de l'OTAN, notamment en Europe continentale. L'Union soviétique aurait accueilli favorablement cette annonce et se réjouirait de continuer à travailler avec le nouveau gouvernement français."
 ALG_Partition.1.d:0 "Le gouvernement français a mis en oeuvre aujourd'hui sa partition de l'Algérie. Le plan a été conçu par plusieurs hauts conseillers du président et des membres de l'Assemblée nationale qui cherchent à séparer les zones européennes de l'Algérie des zones non européennes. Les observateurs ont noté que les Français avaient tracé ces lignes de séparation de telle manière que la section européenne avait accès aux infrastructures clés et aux gisements de ressources, au détriment des réalités démographiques sur le terrain. Les Français soutiennent que la partition donnera aux pieds noirs et aux populations arabes le droit à l'autonomie gouvernementale et soutiennent que cela se traduira par la sécurité et une paix durable. Cependant, les critiques soulignent que le tracé des frontières laisse des milliers d'Arabes hors de leurs zones et que l'État arabe algérien n'a pas accès à des ressources clés. Compte tenu de l'histoire des Balkans et de l'histoire plus récente du Moyen-Orient, cette situation semble propice à la poursuite de la violence, des déportations massives ou de la répression politique au lieu d'une paix durable. Sur le plan international, le plan de la France a rencontré des réponses discrètes de la part des grandes puissances coloniales et des États-Unis. Ils espèrent que le plan mènera à plus de paix, mais ont choisi de ne pas soutenir publiquement la politique française. Dans le monde arabe et dans les États décolonisés d'Afrique et d'Asie, la réponse a été une rhétorique enflammée condamnant ce qui est considéré comme un effort visant à préserver l'impérialisme."
 Gladio_Reveal.1.d:0 "Lors d'une conférence de presse époustouflante à Paris, le gouvernement français a annoncé la découverte d'une armée paramilitaire secrète en France et dans tous les États de l'OTAN. Après la Seconde Guerre mondiale, les États-Unis et le Royaume-Uni ont établi des caches d'armes secrètes et des cellules de combattants pour s'activer dans un mouvement de résistance en cas d'invasion soviétique. Le programme s'appelait Opération Gladio et a été mis en place dans les zones occupées par les Alliés en Allemagne, en Italie et en France. Lors de la création de l'OTAN, le programme de cellules dormantes de paramilitaires était présent dans tous les États membres. Le gouvernement français a déclaré que des officiers patriotes de l'armée française l'avaient informé de cette organisation secrète, craignant que les États-Unis envisagent d'activer les forces paramilitaires françaises pour déstabiliser le gouvernement français. Le ministre de la Défense a déclaré : « La France a rendu cette information publique afin de se protéger des agressions étrangères et de montrer à nos amis européens ce qu'implique réellement la « liberté » américaine ! Dès l'annonce de la nouvelle, les citoyens des pays de l'OTAN sont descendus dans la rue pour protester contre ces armées secrètes."
 VIN_PCF.1.d:0 "La guerre d'Indochine durait depuis 1946, la France dépensant beaucoup de sang et d'argent pour rendre le territoire sous domination française. Cependant, le PCF, comme bien d'autres, a longtemps reconnu que ce conflit ne servait qu'à restaurer le colonialisme français à l'ère de la décolonisation. Le PCF voyait dans le conflit les germes d'un déclin français, et non d'une restauration des gloires passées. À mesure que le conflit se prolongeait, l'État français devenait de plus en plus dépendant de l'aide économique et militaire des États-Unis. Mener une guerre impérialiste après avoir obtenu un mandat électoral du peuple français pour gouverner dans son intérêt n'avait aucun sens. Fort de ces considérations, le gouvernement français a annoncé qu'il reconnaîtrait un État vietnamien indépendant sous le contrôle du Viet Minh, qui rassemble tous les principaux partis indépendantistes du pays et est clairement le meilleur représentant des intérêts vietnamiens. Paris a réagi avec joie à la nouvelle alors que des milliers d'étudiants sont descendus dans la rue pour célébrer la fin de la guerre. Les troupes rentraient au pays et le cauchemar de la France en Indochine touchait à sa fin."
 French_Euroskepticism.1.d:0 "Le Traité de Rome et l'Union économique européenne (UEE) qui en a résulté représentaient tout ce que le président Pierre Poujade et ses collègues poujadistes détestaient. Dans un discours à la nation, le président Poujade a déclaré que l'organisation enlèverait la souveraineté économique française et placerait les Français sous la coupe des élites étrangères et des sociétés internationales qui les soutiennent. Les politiques soutenues par l'UEE finiraient par entraîner la destruction de la culture et de la société françaises. Les agriculteurs seront contraints de s'industrialiser à grande échelle pour rivaliser sur le marché, détruisant ainsi les campagnes et leur mode de vie. Les belles villes françaises seront transformées en usines urbaines, entraînant un déclin moral et une expansion des idées étrangères décadentes. Pour éviter un tel désastre, le président Poujade a annoncé que la France rejetterait le traité de Rome et se retirerait complètement de l'UEE. La France ne participera pas à une organisation destinée à détruire la souveraineté et l'identité européennes. Pour les signataires du Traité de Rome, le retrait français constitue un coup dur pour le rêve d'un marché et d'une union économique européens unifiés."
 ALG_Comp.3.d:0 "Avec les résultats des deux récents référendums, l'un métropolitain et l'autre pieds noirs, l'armée française en Algérie a décidé d'agir. Sous la direction du général à la retraite Raoul Salan, des unités d'élite françaises d'Alger, ont rapidement pris le contrôle de la ville. Partout en Algérie, d'autres unités ont pris des emplacements clés, notamment des stations de radio, des ports et des aéroports. Le général Salan a annoncé que l'armée avait pris le contrôle de l'Algérie afin de préserver la liberté et la vie des pieds noirs et des musulmans pro-français. Il a proclamé la République algérienne sous sa direction et s'est engagé à ne pas abandonner l'Algérie ni à laisser les sacrifices militaires être vains. Le gouvernement français à Paris a été complètement surpris par ces développements et les efforts pour communiquer avec l'Algérie ou même intervenir sont assez limités en raison de la saisie d'installations clés par les soldats rebelles. De nombreux observateurs estiment que les progrès dans les pourparlers de paix sont désormais interrompus et que si la situation persiste, les combats en Algérie pourraient reprendre une nouvelle intensité."
 ALG_Comp.4.d:0 "la junte militaire dirigée par le général Raoul Salan ne progressait pas. Les autorités françaises étaient particulièrement ennuyées car Salan et ses partisans ont utilisé le temps consacré aux négociations pour reprendre complètement au gouvernement toute l'administration de l'Algérie. Un responsable français a noté que le gouvernement ne pouvait plus répondre aux besoins d'une cabale d'officiers mutins. Un représentant de la soi-disant République algérienne a seulement déclaré que l'Algérie ne reste française et libre que grâce à la direction du général Salan et de ses courageux officiers. Les observateurs notent qu'un refus du commerce ou des relations pourrait provoquer une crise d'approvisionnement majeure pour le régime Salan. Il semble que la France espère qu'une telle crise forcera Salan à reculer."
 ALG_Comp.5.d:0 "Au lendemain de la prise de pouvoir de l'Algérie par le général Raoul Salan et de la proclamation de la République algérienne, nombreux sont ceux en France qui ont demandé des explications sur la manière dont le gouvernement a si horriblement géré la situation. Suite aux dénonciations à l'Assemblée nationale et aux manifestations de rue, le président René Coty a présenté sa démission. Dans une déclaration écrite, il a exprimé ses regrets sur la façon dont les choses se sont terminées et espère que son successeur sera capable de sauver la France du désastre, soulignant qu'une nouvelle direction pourrait être nécessaire alors que le système politique actuel conduit à la désunion et à l'instabilité. Son successeur est le politicien conservateur Antoine Pinay. De nombreux observateurs apprécient les succès de Pinay en matière de finance et de politique économique tout au long de sa carrière et il est considéré comme un homme politique chevronné. Nous espérons que cette expérience pourra contribuer à guider la nation vers l'unité politique face aux problèmes internationaux de la France et à la crise de la République algérienne."
 FFL_Relocation.1.d:0 "La Légion étrangère française (FFL) a longtemps été les troupes de choc de l'empire et de la nation française. Son personnel adhère depuis longtemps aux principes de ce que signifie être Français et a longtemps été sur lequel le gouvernement s'est appuyé en temps de crise. Cependant, lors de la récente prise de pouvoir militaire en Algérie, plusieurs unités de la Légion étrangère ont participé et se sont activement jointes à la prise de pouvoir. Cela a rendu l'unité suspecte aux yeux du gouvernement français qui a décidé de retirer les FFL d'Algérie. Les unités FFL d'Algérie doivent être dissoutes et le personnel réaffecté à d'autres unités FFL. Des informations proches de la principale caserne des FFL à Siddi Bel Abbès indiquent que des incendies et des bruits forts se font entendre à l'intérieur. Apparemment, le personnel est devenu furieux face à ces événements et a brûlé une relique historique de l'histoire du régiment. Malgré leur colère, on s'attend à ce que les légionnaires se conforment car ils restent dévoués à la France et à la récompense de la citoyenneté française une fois leur devoir accompli. Paris est confiant dans le retour des FFL en bon état et espère réhabiliter son personnel à son retour sur le continent."
 FRA_Referendum.10.d:0 "Le peuple français et ses territoires votent pour accepter la nouvelle constitution élaborée sous la supervision de Charles de Gaulle. La récente crise en Algérie a précipité les troubles dans les rues, parmi les militaires, et l'instabilité au sein de l'Assemblée nationale. Le héros national Charles de Gaulle revient à la politique et appelle à la fin de la Quatrième République. Exiger une nouvelle constitution qui conviendrait mieux à la France. L'incapacité du gouvernement à répondre efficacement à ces défis a conduit à la dissolution de la Quatrième République et à la tenue d'une assemblée constitutionnelle sous le règne de de Gaulle. La nouvelle constitution cherche à créer un système présidentiel fort et accorde à de Gaulle des pouvoirs d'urgence pendant les six premiers mois. La Quatrième République avait conservé le pouvoir au Parlement, mais ses dispositions destinées à empêcher la désunion politique ont largement échoué. La constitution de De Gaulle cherchait à aider la France à faire face aux problèmes urgents de la guerre froide et de la décolonisation. L'électorat français est confronté à deux choix lors du référendum. Qu'il s'agisse d'accepter la constitution de De Gaulle et de proclamer une Ve République ou de la rejeter."
 ALG_Comp.1.d:0 "Le gouvernement français a décidé d'organiser un référendum pour le peuple français. Il demande à la population d'approuver un plan visant à offrir au peuple algérien le droit à l'autodétermination. Le référendum précise : \"Approuvez-vous le projet de loi soumis au peuple français par le Président de la République et concernant l'autodétermination des populations d'Algérie et l'organisation des pouvoirs publics en Algérie préalablement à l'autodétermination ?\" Le gouvernement espère que le soutien populaire à ses projets, par le biais du référendum, lui permettra de résoudre la guerre d'Algérie et de prendre des décisions difficiles en toute confiance avec le peuple français. Les opposants y voient le début d'une capitulation française de l'Algérie et d'un abandon du sol et des citoyens français. Les partisans du référendum affirment que l'autodétermination reflète les valeurs démocratiques françaises et considèrent le statu quo en Algérie comme intenable."
 ALG_Comp.2.d:0 "Les pieds noirs vivent en Algérie depuis 1830. Représentant plus de dix pour cent de la population algérienne, ce groupe a joué un rôle essentiel dans le développement administratif, économique, social et culturel de l'Algérie depuis le début de la colonisation française. Depuis le début de la guerre d'Algérie, les pieds noirs se sont révélés essentiels en soutenant les efforts du gouvernement colonial pour vaincre les rebelles. Ils ont fourni des renseignements vitaux, des volontaires militaires et des zones sûres à partir desquelles les forces françaises peuvent opérer. Alors que le gouvernement français sur le continent s'oriente de plus en plus vers la reconnaissance de l'autodétermination, les dirigeants pieds noirs ont fait valoir que cette voie mènerait à l'indépendance de l'Algérie, à un régime majoritaire et à la destruction de leur mode de vie. Ils ne voient aucune chance de compromis avec la population majoritaire qui, selon eux, n'a pas le développement culturel ou la maturité politique nécessaires pour se réconcilier. Les massacres et la répression seront leur avenir. On ne peut plus compter sur la France pour servir ses intérêts. Au lieu de cela, les pieds noirs doivent contrôler leur propre destin et sécuriser l'Algérie. Pour y parvenir, la direction du pied noir a organisé un référendum pour savoir si l'Algérie devait être gouvernée et gouvernée par les pieds noirs. Ce système de gouvernement minoritaire garantirait l'identité de l'Algérie et, plus important encore, préserverait l'Algérie de la dégradation. Le rejet de ce référendum signifiera l'acceptation de l'autodétermination."
 MNA.1.d:0 "Le Mouvement national algérien (ANM) est apparu sous la direction du nationaliste Messali Hadj comme un mouvement nationaliste alternatif au Front de libération nationale (FLN). Le FLN a longtemps prétendu être le seul représentant du peuple algérien dans la lutte contre le colonialisme français. L'émergence de l'ANM remet en question cette vision et des informations sont arrivées selon lesquelles le FLN comploterait pour éliminer le groupe. Peut-être sera-t-il dans l'intérêt de la France de financer et de soutenir secrètement l'ANM, puisque son leader n'a pas initialement soutenu la lutte armée du FLN. Si le groupe se renforce, cela entraînera des luttes intestines entre les groupes nationalistes. Cela peut donner plus de liberté à nos forces de sécurité et nous aider à briser les rebelles plus facilement, car nous pouvons jouer les uns contre les autres. Nous devons décider si nous voulons soutenir secrètement l'ANM et espérer qu'il puisse diviser le message et la capacité de combat du FLN."
