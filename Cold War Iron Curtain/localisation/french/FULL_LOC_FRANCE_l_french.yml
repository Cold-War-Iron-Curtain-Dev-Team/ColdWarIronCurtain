 #### ELECTIONS ####
 ###################
 
 ######################
 ### 1951 ELECTIONS ###
 ######################
 
 FRA_Elections_of_1951:0 "Élections législatives de 1951"
 FRA_Elections_of_1951_desc:0 "Les élections françaises de 1951 pourraient constituer un tournant majeur pour la République. Les principaux concurrents sont la Troisième Force, le FPR et le PCF. Nos amis occidentaux espèrent que soit la Troisième Force, soit le FPR gagneront, car une victoire du PCF posera problème, mais nous ne savons jamais vraiment ce que l'avenir nous réserve."
 
 ### RPF VICTORY ###
 
 FRA_RPF_Victory:0 "Majorité FPR"
 FRA_RPF_Victory_desc:0 "Le Parti conservateur de France, ou FPR, a réussi à obtenir une majorité électorale au Parlement. Ce faisant, ils ont également installé un Premier ministre loyal, ce qui signifie que si tout se passe bien, l'avenir de la France pourrait être entre les mains de Charles De Gaulle."
 FRA_Economic_Third_Way:0 "Troisième voie économique"
 FRA_Economic_Third_Way_desc:0 "L'économie française tente depuis trop longtemps de faire des compromis entre la gauche et la droite. Il est temps que nous confirmions enfin notre allégeance au monde capitaliste et occidental. Avec cette loi, l'économie française adaptera les principes de base du capitalisme et entamera son abandon total du communisme."
 FRA_Presidential_Empowerment_decree:0 "Décret présidentiel d'autonomisation"
 FRA_Presidential_Empowerment_decree_desc:0 "Nous avons presque toujours plaidé pour un président plus puissant. Aujourd'hui, notre Premier ministre envisage de prendre un décret à cet effet et, avec l'approbation du président, ce décret devrait devenir une loi."
 FRA_Reform_the_voting_system:0 "Réformer le système électoral"
 FRA_Reform_the_voting_system_desc:0 "Le système électoral français est un désastre. Il est supervisé par un parlement corrompu qui vote toujours pour le bénéfice de ses membres, et les élections présidentielles françaises sont également un désastre. Il est temps d'en finir avec ça. Le système électoral français doit changer."
 FRA_Reform_the_RTF:0 "Réformer la RTF"
 FRA_Reform_the_RTF_desc:0 "La Radio Télévision Française est depuis longtemps une chaîne de télévision fière et distinguée, mais elle est devenue vieille, rouillée et certains diraient même inutile. Pour cette raison, nous avons élaboré un programme pour sa réforme et sa restauration à son ancien emplacement."
 FRA_Favorize_Gaullist_Syndicates:0 "Favoriser les syndicats gaullistes"
 FRA_Favorize_Gaullist_Syndicates_desc:0 "Il existe de nombreux syndicats dans notre pays qui promeuvent ou suivent un large éventail d'idéologies. En raison de la grande popularité de Charles De Gaulle parmi eux et des similitudes entre nos agendas, il est logique de les favoriser au Parlement."
 FRA_Finish_the_Dams:0 "Finir les barrages"
 FRA_Finish_the_Dams_desc:0 "Nos réserves d'eau et d'énergie hydroélectrique sont extrêmement faibles, tant dans la Métropole que sur nos terres africaines. En terminant notre projet de barrage en cours dans les deux régions, nous pouvons résoudre ces deux problèmes."
 FRA_Appoint_Giscard_Finances_Minister:0 "Nommer Giscard au poste de ministre des Finances"
 FRA_Appoint_Giscard_Finances_Minister_desc:0 "Valéry Giscard, homme politique sans doute de tendance conservatrice, s'est révélé être un conseiller économique utile au niveau local. C'est pour cette raison que nous envisageons de le nommer ministre des Finances. Espérons qu'il pourra aider notre gouvernement à réduire l'hyperinflation."
 FRA_Pragmatic_Politics:0 "Politique pragmatique"
 FRA_Pragmatic_Politics_desc:0 "Maudite Quatrième République ! Nos politiciens et notre président n'ont rien fait, assis sur leurs fesses et attendant un miracle. Il est temps d'en finir avec ça ! Nous, le FPR, ne pouvons plus attendre, et le moment est venu pour la République d'agir !"
 FRA_Breakup_of_the_Troisieme_Force_Coalition:0 "Dissolution de la Troisième Coalition des Forces"
 FRA_Breakup_of_the_Troisieme_Force_Coalition_desc:0 "Les politiciens centristes, plutôt que d'admettre leur défaite et de travailler avec nous, tentent d'entraîner notre glorieux pays dans leur chute. Pour cette raison, par une loi présidentielle soutenue par le Premier ministre, nous détruirons leur coalition et ne laisserons aucun doute sur qui est aux commandes."
 FRA_National_Referendum_on_the_Republic:0 "Référendum national sur la République"
 FRA_National_Referendum_on_the_Republic_desc:0 "La Troisième République est tout simplement un système rétrograde. Le Président n'a quasiment aucun pouvoir, tandis que le Premier ministre, souvent une marionnette du Parlement, s'en baigne pratiquement. Le Parlement, toujours aussi idiot, ne changera pas cela, mais le peuple, lui, n'est pas si stupide, et il le changera, et nous lui donnerons le droit de le faire en votant au référendum."
 FRA_Marginalization_of_the_Communists:0 "Marginalisation des communistes"
 FRA_Marginalization_of_the_Communists_desc:0 "Les Parti communistes ne sont que des agents soviétiques et pour cela ils doivent être marginalisés lors des prochaines élections. Le peuple ne devrait même pas avoir la possibilité de nommer des provocateurs communistes au Parlement, et nous veillerons à ce qu'ils ne l'obtiennent pas. "
 FRA_Find_an_agreement_with_Tunisia:0 "Trouver un accord avec la Tunisie"
 FRA_Find_an_agreement_with_Tunisia_desc:0 "La République française a connu de gros problèmes en Tunisie ces derniers temps. Pour y mettre fin, nous devrions essayer de conclure un accord avec les Tunisiens autochtones, peut-être l'indépendance, peut-être l'autonomie - qui sait - mais il faut faire quelque chose."
 FRA_Devaluate_the_Franc:0 "Dévaluer le franc"
 FRA_Devaluate_the_Franc_desc:0 "Le franc français a été maintenu à une valeur si élevée pendant si longtemps qu'il a presque détruit notre économie. Nous devons le dévaluer rapidement, avant que notre économie et notre monnaie ne tombent trop loin pour être sauvées."
 FRA_Intensify_Nuclear_Program:0 "Intensifier le programme nucléaire"
 FRA_Intensify_Nuclear_Program_desc:0 "Il est tout à fait clair que la force nucléaire sera le facteur décisif dans toute guerre majeure à venir, et nous devons nous efforcer de disposer de notre propre arsenal solide et fonctionnel."
 FRA_Invest_in_Rocketry:0 "Investissez dans les fusées"
 FRA_Invest_in_Rocketry_desc:0 "Cette guerre entre l'Est et l'Ouest est froide, mais rien ne nous assure qu'elle ne finira pas par s'échauffer. C'est pourquoi nous devons nous assurer que nous disposons de la puissance de feu et des missiles nécessaires pour nous défendre."
 FRA_Propose_a_constitutional_Reform:0 "Proposer une réforme constitutionnelle"
 FRA_Propose_a_constitutional_Reform_desc:0 "La Troisième République est terminée. Notre message a trouvé un écho auprès de notre peuple, qui veut sortir des gouvernements de canard boiteux du passé. Il est temps de réformer la constitution et de donner plus de pouvoir au Président, qui saura nous guider à travers ces temps de turbulences."

