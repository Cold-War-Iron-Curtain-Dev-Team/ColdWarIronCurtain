 france_junta.1.d:0 "Aujourd'hui place de la Bastille l'ancien Président et traître à la République Charles de Gaulle a été guillotiné pour procéder à son exécution, ses derniers mots ont été \"Au nom de la France, j'ordonne que tous les moyens, je dis tous les moyens, soient utilisés pour barrer partout la route à ces hommes, en attendant de les réduire.\" "
 france_junta.2.d:0 "Tôt ce matin, place de la Concorde, les dirigeants communistes et socialistes ont été alignés et fusillés de sang-froid. Deux personnalités importantes étaient le député socialiste et ancien candidat à la présidentielle François Mitterrand et le secrétaire général du Parti communiste Maurice Thorez"
