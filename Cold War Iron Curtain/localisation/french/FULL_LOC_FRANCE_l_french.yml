###########FRENCH EVENTS##########################

 tripartite.1.d:0 "Le pacte tripartite avec les États-Unis et la Grande-Bretagne a été refusé. Accepter un tel pacte créerait un déséquilibre majeur des pouvoirs. Pour que la France conserve son indépendance et sa position internationale, elle doit continuer à éviter les accords qui la rendent dépendante ou un partenaire junior. Même si les États-Unis et la Grande-Bretagne seront déçus, il est vital que la France veille avant tout à ses propres intérêts, même si nous maintiendrons notre partenariat."
 algerian_war.1.d:0 "Les informations faisant état d'un cessez-le-feu en Algérie se répandent lentement à travers la France. De nombreux citoyens français sont las de ce conflit sans fin. Les premiers rapports suggèrent qu'il y aura probablement une partition entre les Français et les Algériens. Cependant, la nouvelle du cessez-le-feu suscite un optimisme hésitant. Les rumeurs se multiplient selon lesquelles les Pieds Noirs seraient très agités par cette nouvelle. Ils se sentent de plus en plus trahis par le gouvernement français et l'on craint qu'un coup d'État ne soit lancé pour faire dérailler tout règlement en Algérie."
 fra_post_edc.1.desc:0 "À la suite d'un récent attentat terroriste en Algérie, nombreux sont ceux qui, au sein du gouvernement, estiment que le parti nationaliste MTLD en est l'architecte. Le MTLD a remplacé l'ancien parti nationaliste après son interdiction. Nos renseignements rapportent que le parti connaît de nombreuses luttes internes, notamment entre modérés et extrémistes, peut-être qu'une faction du parti a orchestré l'attaque. Cependant, d'autres sources suggèrent que l'attaque pourrait provenir d'un nouveau groupe cherchant à s'établir. L'enquête est en cours."
 fra_crisis.1.crisis_end_well_desc:0 "L'opinion publique française soutient largement le gouvernement dans ses actions dans la crise de Suez. Beaucoup félicitent l'armée française pour ses opérations professionnelles, efficaces et précises contre les Égyptiens. On a le sentiment que la France est en train d'effacer les taches de sa défaite lors de la Seconde Guerre mondiale et qu'elle s'impose comme une puissance mondiale. Ceci malgré les critiques internationales concernant cette action. Le public français accepte les raisons de l'intervention et estime que toute opposition est enracinée dans un effort de la communauté mondiale pour maintenir la France faible."
 fra_crisis.1.crisis_end_bad_desc:0 "Il y a une colère généralisée dirigée contre le gouvernement français suite à l'échec de l'aventure Suez. Les partis d'opposition et d'autres organisations organisent des manifestations dans tout le pays tandis que les médias publient des éditoriaux négatifs. Beaucoup en France ont le sentiment que le gouvernement a plongé son armée dans une opération à laquelle elle n'était pas préparée et a fini par humilier la France sur la scène internationale. Il y a aussi des accusations selon lesquelles le gouvernement aurait fait des compromis sur les intérêts français ou, au pire, se serait laissé égarer par Israël et la Grande-Bretagne."
 fra_crisis.2.bombing_sakiet_sidi_desc:0 "Les rapports des commandants militaires en Algérie indiquent que l'ALN a intensifié ses raids depuis ses refuges en Tunisie. Les rebelles utilisent également la frontière et leurs liens avec des sympathisants tunisiens pour inonder d'armes l'Algérie et le FLN. Nos forces tentent d'intercepter ces forces et ces armes, mais les Tunisiens ne nous aident pas. Les tentatives diplomatiques avec la Tunisie ne mènent à rien et les relations continuent de se détériorer. L'armée souhaite l'autorisation de lancer une frappe aérienne sur la ville de Sakiet Sidi Youssef. Il s'agit d'un point de rassemblement majeur pour l'ALN et une frappe efficace pourrait paralyser leurs opérations. Cependant, si nous donnons la permission, cela déclenchera probablement une forte réaction tunisienne."
 fra_crisis.3.bombing_sakiet_sidi_desc:0 "Le village tunisien de Sakiet Sidi Youssef a récemment été victime de frappes aériennes aveugles d'avions français basés en Tunisie. Les Français ont affirmé que le village abritait une base importante de l'ALN et qu'il avait neutralisé les rebelles. La frontière entre l'Algérie et la Tunisie a connu une forte escalade des affrontements entre l'ALN et les forces françaises. Malgré les affirmations françaises, la frappe a fait des dizaines de morts et de nombreux blessés, pour la plupart des civils. Le peuple tunisien est furieux et exige une réponse. Le gouvernement est fortement invité à rompre les relations diplomatiques avec la France, faute de quoi cela pourrait provoquer un bouleversement au sein du peuple tunisien."
 fra_crisis.31.bombing_sakiet_sidi_desc:0 "Le conflit entre les combattants nationalistes algériens du FLN et les forces françaises en Algérie s'est intensifié à la suite de l'annonce selon laquelle des avions de combat français avaient lancé des frappes aériennes sur la ville frontalière tunisienne de Sakiet Sidi Youssef. La France accuse depuis longtemps les rebelles algériens d'utiliser la frontière tunisienne comme base pour ses opérations contre les forces françaises. Ils citent une augmentation des attaques dans la région ainsi qu'une augmentation spectaculaire de la contrebande d'armes en provenance de Tunisie. Le gouvernement tunisien a longtemps résisté aux pressions diplomatiques de la France pour répondre à ses préoccupations en matière de sécurité et est exaspéré par les bombardements. Les autorités tunisiennes affirment que les bombardements étaient aveugles et ont fait des centaines de victimes civiles. Les pertes humaines et la violation flagrante de la souveraineté nationale sont intolérables pour le peuple tunisien, et beaucoup souhaitent la fin des relations diplomatiques avec la France."
 fra_crisis.4.motion_of_non_confidence_desc:0 "L'Assemblée nationale à Paris a voté une motion de censure, mettant ainsi fin au gouvernement du Premier ministre Félix Galliard. Le jeune Premier ministre cherchait à construire une alliance politique centriste mais ces efforts furent contrecarrés par la guerre d'Algérie. L'armée française a récemment lancé des frappes aériennes contre le village frontalier tunisien de Sakiet Sidi Youssef, visant prétendument une base des FNL. Cependant, le grand nombre de victimes, dont de nombreux civils, et la violation de la souveraineté tunisienne ont provoqué une crise diplomatique majeure. Les autorités tunisiennes suppriment rapidement les privilèges français dans le pays et beaucoup en France estiment que le gouvernement a complètement bâclé la situation et qu'on ne peut plus lui faire confiance pour gouverner. Pour beaucoup en France, l'effondrement rapide du gouvernement Galliard correspond à l'instabilité politique générale qui a tourmenté la Quatrième République."
 fra_crisis.5.motion_of_non_confidence_desc:0 "La France est confrontée à des troubles croissants en raison de l'instabilité de la scène politique et des troubles croissants en Algérie. Le président René Coty a demandé à René Pleven et à Georges Bidault de former des gouvernements, mais tous deux n'y sont pas parvenus. L'ordre civil étant menacé, la pression s'accentue sur le président pour qu'il trouve rapidement un nouveau gouvernement. Cependant, le président semble incapable ou peu disposé à jouer un rôle plus actif. La configuration constitutionnelle limite également sa capacité d'agir. Alors que la situation semble plus désastreuse, de nombreux citoyens français se demandent comment la situation peut être sauvée."
 fra_crisis.6.motion_of_non_confidence_desc:0 "Le FLN a annoncé avoir exécuté des soldats français capturés lors de ses récentes opérations. La nouvelle a choqué et galvanisé de nombreuses personnes en France. Si le FLN s'attendait à ce que cette annonce affaiblisse la détermination française, il se trompait lourdement. L'armée française promet déjà des représailles et, selon certaines informations, des militants du Pied Noir planifieraient leurs propres représailles contre les Algériens. Les combats en Algérie ont atteint un nouveau niveau de notoriété. Il semble que l'action du FLN n'ait fait qu'ouvrir la porte à des combats plus brutaux."
 fra_crisis.7.motion_of_non_confidence_desc:0 "Alors que Pierre Pflimlin était sur le point de former un nouveau gouvernement français à Paris, les forces françaises en Algérie ont organisé un coup d'État. Les généraux Jacques Massu et Raoul Salan ont mené le coup d'État, Massu prononçant un discours annonçant les exigences des putschistes envers le gouvernement. Massu a appelé à un nouveau gouvernement de sécurité publique sous la direction du légendaire dirigeant français Charles de Gaulle. Ils souhaitent que le nouveau gouvernement reçoive des pouvoirs extraordinaires pour garantir que l'Algérie ne soit pas abandonnée. Le président français René Coty serait abasourdi par le changement d'événement alors que le nouveau Premier ministre constate que ses partisans le désertent rapidement. La réponse militaire semble être une réponse aux inquiétudes suscitées par les projets du nouveau Premier ministre de négocier une paix qui remettrait l'Algérie au FLn."
 fra_crisis.8.motion_of_non_confidence_desc:0 "Le général Raoul Salan s'est adressé au peuple français dans une allocution radiodiffusée depuis Alger. Le général a confirmé qu'il commande le nouveau gouvernement militaire en Algérie. Il a réitéré les demandes des putschistes que Charles de Gaulle soit nommé à la tête d'un gouvernement doté de pouvoirs supplémentaires pour garantir que l'Algérie ne soit pas abandonnée. Salan s'est ensuite adressé à une foule nombreuse depuis un balcon, entonnant Viva de Gaulle. Deux jours plus tard, des journalistes français interviewaient Charles de Gaulle, qui se déclarait prêt à assumer les pouvoirs de la République s'il était appelé à le faire. Cette annonce a suscité des inquiétudes dans toute la France quant au possible rapprochement de De Gaulle avec la junte militaire en Algérie."
 fra_crisis.9.motion_of_non_confidence_desc:0 "Deux jours après avoir suscité l'inquiétude du public suite à ses remarques concernant le coup d'État en Algérie, le célèbre dirigeant français Charles de Gaull a tenu une conférence de presse. Il a réitéré une fois de plus que si la nation avait besoin de lui, il en assumerait la responsabilité. Lorsqu'un journaliste s'est demandé si son accession au pouvoir par la pression militaire entraînerait une suppression des libertés civiles, le dirigeant français a rapidement répondu. Il a déclaré : \"Ai-je déjà fait cela ? Bien au contraire, je les ai rétablis lorsqu'ils avaient disparu. Qui croit honnêtement qu'à 67 ans, je commencerais une carrière de dictateur ?\" Il est clair que Charles de Gaulle se croit prêt à prendre le pouvoir si nécessaire."
 fra_crisis.10.motion_of_non_confidence_desc:0 "La crise algérienne s'est intensifiée lorsque la junte d'Alger a annoncé la formation du Comité de Salut Public Algérie-Sahara. Le chef de la junte, le général Raoul Salan, a déclaré que l'actuel Comité de sécurité publique superviserait désormais l'ensemble de l'Algérie et du Sahara. Les putschistes se sont désormais officiellement emparés du mandat territorial du gouvernement français en Afrique du Nord. Il est désormais clair que les putschistes se préparent probablement à étendre leurs opérations pour éventuellement étendre leurs opérations et leur mandat à la France métropolitaine."
 fra_crisis.11.motion_of_non_confidence_desc:0 "Pour accroître la pression sur Paris, des parachutistes d'élite français d'Algérie parachutés et s'emparèrent de la Corse. L'opération s'appelle Résurrection. Les parachutistes ne rencontrent aucune résistance et prennent le contrôle de la Corse sans aucune résistance. On craint de plus en plus à Paris que l'armée contienne de nombreux éléments sympathisants de la junte d'Alger dirigée par le général Raoul Salan. Après le succès de l'opération, Salan lança un ultimatum donnant au gouvernement jusqu'au 29 pour donner le pouvoir à Charles de Gaulle. La France semble au bord de la guerre civile."
 fra_crisis.12.motion_of_non_confidence_desc:0 "Charles de Gaulle a rencontré le Premier ministre Pierre Pflimlin pour parvenir à un accord. Cependant, les discussions n'ont absolument pas abouti à une solution. Il semble que les deux hommes ne soient pas d'accord sur la plupart des questions, notamment sur l'Algérie. L'échec des pourparlers ne fait qu'aggraver la crise car il semble que de Gaulle ne sera pas en mesure de travailler avec le gouvernement actuel pour résoudre le conflit. Les putschistes d'Alger restent déterminés à exiger que Charles de Gaulle prenne le pouvoir. Plus le temps qui passe sans résolution augmente la probabilité d'une invasion algérienne."
 fra_crisis.13.motion_of_non_confidence_desc:0 "Le Premier ministre Pierre Pflimlin et son gouvernement ont démissionné au milieu de la crise provoquée par le coup d'État militaire en Algérie. La récente occupation de la Corse et l'ultimatum lancé par le général Raoul Salan ont renouvelé la pression sur le gouvernement pour qu'il parvienne à une solution avant que la guerre civile n'éclate. Le Premier ministre Pflimlin, dont la nomination a provoqué la crise, a tenté de parvenir à un accord avec Charles de Gaulle, mais ces négociations ont échoué. A l'approche de l'échéance, on rapporte que la pression du président René Coty aurait persuadé le Premier ministre et ses ministres de démissionner."
 fra_crisis.14.motion_of_non_confidence_desc:0 "Le président René Coty s'est adressé à l'Assemblée nationale à Paris. Il a exposé la situation difficile à laquelle est confrontée la République, soulignant que la France est au bord d'une guerre civile totale. Il a ensuite exhorté l'Assemblée à mettre de côté leurs divergences et à voter pour nommer Charles de Gaulle au poste de Premier ministre. Il a rappelé aux représentants que c'est de Gaulle qui a restauré la liberté aux heures les plus sombres de l'histoire de France. De Gaulle et Coty se sont alors mis d'accord sur le fait qu'une nouvelle constitution, avec un exécutif puissant, serait rédigée et que de Gaulle recevrait des pouvoirs extraordinaires pour les six prochains mois. L'Assemblée nationale votera dans les prochains jours l'approbation de Charles de Gaulle et de son cabinet. Le président Coty a indiqué qu'il démissionnerait si de Gaulle n'était pas approuvé."
 fra_crisis.141.motion_of_non_confidence_desc:0 "L'armée française en Algérie, dirigée par le général Raoul Salan, a récemment lancé un coup d'État en Afrique du Nord française, exigeant que Charles de Gaulle prenne le contrôle de la France. Cette action fait suite à une frustration croissante face à l'environnement politique instable à Paris et aux craintes que le gouvernement actuel envisage de négocier la fin de la domination française en Algérie. Les tensions se sont intensifiées après que la junte, au cours d'une opération aéroportée sans effusion de sang, ait capturé la Corse. Ils ont ensuite fixé un délai pour la nomination de De Gaulle. De son côté, Charles de Gaulle a simplement déclaré que si la nation avait besoin de lui, il était prêt à agir. A l'approche de l'échéance, le président René Corty décide de nommer de Gaulle, menaçant de démissionner si l'Assemblée nationale n'approuve pas. Charles De Gaulle a ensuite été élu, avec pour mandat de superviser une nouvelle constitution et six mois de pouvoirs d'urgence pour réformer et restaurer les institutions nationales."
 fra_crisis.15.motion_of_non_confidence_desc:0 "La première phase de l'opération Résurrection s'est avérée un succès majeur. Nos parachutistes ont réussi à atterrir et à capturer la Corse sans aucune interférence ni résistance. De nombreux militaires sur le continent soutiennent cette cause, ils croient fermement à la préservation de l'Algérie française, au nationalisme et à une armée forte. Si le gouvernement refuse de donner suite à notre demande de donner le pouvoir à Charles de Gaulle ou si de Gaulle demande de l'aide, nous lancerons la deuxième phase de l'opération Résurrection. Avec des unités militaires sympathisantes à Paris, nous pouvons déployer plus d'un millier de parachutistes pour s'emparer de la capitale et capturer le gouvernement."
 fra_crisis.17.motion_of_non_confidence_desc:0 "Les hauts dirigeants de la junte d'Alger ont été arrêtés à la suite de négociations fructueuses menées par le président. Avec un nouveau gouvernement plus stable au pouvoir, des informations sont arrivées selon lesquelles de hauts commandants militaires en Algérie prévoyaient de lancer un coup d'État pour exiger le retour au pouvoir de Charles de Gaulle. Cependant, avec un compromis et un gouvernement stable à Paris, les putschistes n'avaient aucune justification ni aucune agitation pour justifier une action. Cela a conduit à la panique et à la trahison, ce qui a permis aux unités militaires loyales d'arrêter les putschistes. La voie est désormais libre pour que le nouveau gouvernement entame des négociations avec le FLN sur une éventuelle fin du régime colonial en Algérie."
 fra_crisis.171.motion_of_non_confidence_desc:0 "Un certain nombre de hauts commandants français en Algérie ont été arrêtés à Alger. Les autorités françaises affirment que les officiers étaient impliqués dans un complot nationaliste visant à utiliser le pouvoir militaire et à renverser le régime civil. Le président français a récemment facilité la conclusion d'un accord en faveur d'un gouvernement plus stable, doté d'un mandat fort. Ce nouveau régime a dénoncé les putschistes car les conspirateurs ne trouvaient pas de justification pour agir. Cela a conduit à la panique et à la trahison, ce qui a permis aux unités militaires loyales d'arrêter les putschistes. La voie est désormais libre pour que le nouveau gouvernement entame des négociations avec le FLN sur une éventuelle fin du régime colonial en Algérie."
 
 fra_army.1.desc:0 "La France a demandé aux États-Unis de fournir davantage de soutien militaire à travers le Programme d'assistance mutuelle (MAP). Le MAP fait partie du Mutual Defense Assistance Act et permet aux États-Unis de fournir du matériel militaire à des partenaires étrangers pour soutenir les intérêts américains. Le matériel militaire fourni n'a pas besoin d'être remboursé. Cette loi est devenue la pierre angulaire des efforts américains visant à contenir l'agression communiste à l'échelle mondiale. Les autorités françaises affirment qu'elles ont besoin d'un soutien accru de la part du MAP pour renforcer leur défense face aux menaces communistes croissantes."
 fra_army.2.desc:0 "Les États-Unis ont accepté notre demande d'augmenter le financement du Programme d'assistance mutuelle (MAP) pour nous. Ils reconnaissent le rôle vital que joue la France dans la protection de la démocratie et de l'Europe contre les forces déstabilisatrices. Nos responsables militaires et de la défense accueilleront favorablement cette nouvelle, car la France a désespérément besoin d'un soutien militaire pour relever les défis et obligations actuels. La structure MAP permet aux États-Unis de fournir du matériel militaire à leurs alliés sans exiger que ces armes soient payées. Il s'agit d'un outil crucial pour la coopération et également pour contenir la propagation du communisme à l'échelle mondiale."
 fra_army.3.desc:0 "La Marine nationale française a commandé un nouveau porte-avions aux États-Unis. Le navire faisait partie du programme d'assistance mutuelle. Les États-Unis ont salué cette rétrocession, affirmant que le nouveau navire de guerre renforcerait la marine française dans son engagement envers l'OTAN et dans la lutte contre le communisme à l'échelle mondiale. Le gouvernement français a publié sa propre déclaration, saluant le nouveau navire et saluant les liens profonds et continus entre la France et les États-Unis. Les responsables de la marine française déclarent que le navire est prêt à intervenir immédiatement au service de la France."
 fra_army.4.desc:0 "Les États-Unis ont approuvé notre demande de porte-avions. Nos forces navales ont désespérément besoin d'un tel navire de guerre pour maintenir notre crédibilité et nos obligations internationales. Le transporteur américain contribuera à répondre à nos besoins. La Marine enverra bientôt du personnel pour suivre une formation sur le navire. Lorsqu'ils seront prêts, le navire sera mis en service dans la marine. L'accord met enfin en évidence la profondeur du lien entre la France et les États-Unis."
 fra_army.5.desc:0 "La marine française a commandé plusieurs nouveaux destroyers américains dans sa marine. Les navires faisaient partie du programme d'assistance mutuelle. Les États-Unis ont salué cette rétrocession, affirmant que les nouveaux navires de guerre renforceraient la marine française dans son engagement envers l'OTAN et dans la lutte contre le communisme à l'échelle mondiale. Le gouvernement français a publié sa propre déclaration, saluant le nouveau navire et saluant les liens profonds et continus entre la France et les États-Unis. Les responsables de la marine française déclarent que le navire est prêt à intervenir immédiatement au service de la France."
 fra_army.6.desc:0 "Les États-Unis ont approuvé notre demande de nouveaux destroyers. Nos forces navales ont désespérément besoin de tels navires de guerre pour maintenir notre crédibilité et nos obligations internationales. Les destroyers américains contribueront à répondre à nos besoins. La Marine enverra bientôt du personnel pour suivre une formation sur le navire. Lorsqu'ils seront prêts, le navire sera mis en service dans la marine. L'accord met enfin en évidence la profondeur du lien entre la France et les États-Unis."
 fra_army.7.d:0 "La Gendarmerie Nationale, la force de police militarisée de France, trouve ses origines dans la Maréchaussée du Moyen Âge, officiellement créée sous le roi Louis XV en 1720 pour maintenir l'ordre public dans tout le royaume. Elle a été rebaptisée Gendarmerie pendant la Révolution française et intégrée aux forces armées, où elle servirait à la fois de police et de force de soutien militaire. Tout au long du XIXe siècle, la Gendarmerie est devenue un symbole de l'autorité de l'État dans la France rurale, s'occupant de la sécurité intérieure, des enquêtes criminelles et agissant comme l'épine dorsale de l'ordre civil. Sa présence s'étendait à tout l'empire colonial français, où les gendarmes faisaient respecter la loi dans les centres urbains et les avant-postes éloignés. Pendant la Première Guerre mondiale, les gendarmes servaient au front en tant que police militaire, géraient les itinéraires logistiques et maintenaient la discipline dans les tranchées. Dans l'entre-deux-guerres, la force a été modernisée, avec une formation et une coordination améliorées sous l'égide du ministère de la Guerre. Pendant la Seconde Guerre mondiale, la gendarmerie était prise entre la France de Vichy et la Résistance. De nombreuses unités aidèrent discrètement les efforts de la Résistance, tandis que d'autres furent contraintes sous le contrôle de Vichy. Après 1944, la gendarmerie a été purgée des éléments collaborationnistes et restaurée en tant que bras loyal de la République française. En 1949, la gendarmerie reste essentielle à la sécurité intérieure de la République. Elle est activement déployée en Algérie, en Indochine et dans toute la France métropolitaine pour réprimer l'insurrection, soutenir l'ordre public et assister l'armée régulière en temps de guerre et de crise."
 fra_army.8.d:0 "L'Armée française (Armée de Terre) trouve ses origines dans les levées féodales médiévales et a évolué vers une force professionnelle permanente sous des rois comme Louis XIV et Napoléon Bonaparte. Officiellement institutionnalisée sous l'Ancien Régime, elle est devenue le principal moteur de la projection de la puissance française à travers l'Europe. À l'ère moderne, l'armée française s'est distinguée à l'échelle mondiale lors des guerres napoléoniennes, où sous Napoléon Ier, elle a remporté une série de victoires historiques à Austerlitz (1805), Iéna (1806) et Wagram (1809). Bien que plus tard humilié à Waterloo, l'héritage de la doctrine militaire française perdura tout au long du XIXe siècle, notamment lors de l'expansion coloniale en Afrique et en Indochine. La Première Guerre mondiale a vu l'armée défendre vaillamment la nation sur la Marne (1914), à Verdun (1916) et lors de la deuxième bataille de la Marne (1918). Malgré d'horribles pertes, les troupes françaises ont tenu la ligne et ont joué un rôle décisif dans la défaite des puissances centrales. En 1940, pendant la Seconde Guerre mondiale, l'armée subit une défaite rapide lors de la bataille de France en raison de la tactique allemande du Blitzkrieg. Cependant, elle s'est reconstituée en exil et grâce aux Forces françaises libres dirigées par Charles de Gaulle, elle a combattu en Afrique du Nord, en Italie, et a contribué à la libération de Paris en 1944. La première guerre d'Indochine, qui a débuté en 1946, voit l'armée française une fois de plus au combat, cette fois face aux insurgés du Viet Minh dans une lutte prolongée et exténuante pour le contrôle colonial."
 fra_army.9.d:0 "La Marine Nationale, historiquement appelée « La Royale », est une puissance navale majeure depuis le XVIIe siècle. Fondée officiellement en 1624 sous le cardinal de Richelieu, elle a joué un rôle central à la fois dans la guerre de Succession d'Espagne et dans la guerre d'indépendance américaine, notamment lors de la bataille de Chesapeake (1781), qui a conduit à la capitulation britannique à Yorktown. Tout au long du XIXe siècle, la marine française a maintenu sa suprématie coloniale, soutenant l'empire français d'outre-mer. Au début du XXe siècle, la France possédait la quatrième plus grande marine mondiale, avec des dreadnoughts modernes et un réseau mondial de bases. La Première Guerre mondiale a vu la Marine Nationale sécuriser les routes de la Méditerranée et combattre la marine austro-hongroise dans l'Adriatique. Le développement naval de l'entre-deux-guerres a produit des croiseurs modernes comme l'Algérie et les puissants cuirassés de la classe Dunkerque. En 1940, après la chute de la France, la flotte française fut divisée entre Vichy et les forces françaises libres. Le tragique sabordage de la flotte à Toulon en 1942 a empêché la capture allemande, tandis que les forces navales françaises libres combattaient vaillamment aux côtés des Alliés en Afrique du Nord, en Normandie et pour la protection des convois de l'Atlantique. En 1949, la marine française se reconstruit, aidée par le soutien américain et britannique, en projetant des forces en Indochine et en restaurant le prestige naval de la France."
 fra_army.10.d:0 "L'Armée de l'Air a été officiellement créée en tant que branche militaire indépendante le 2 juillet 1934, même si ses racines remontent aux jours pionniers de l'aviation militaire pendant la Première Guerre mondiale. Des aviateurs français tels que Georges Guynemer et René Fonck figuraient parmi les meilleurs as de la guerre, le premier devenant un héros national. La France était une puissance aérienne de premier plan dans l'entre-deux-guerres, développant des avions et des doctrines avancées. Cependant, en 1940, les forces aériennes françaises étaient en infériorité numérique et technologiquement en retard par rapport à la Luftwaffe. Malgré une courageuse résistance aérienne lors de la bataille de France, l'armée de l'air fut débordée. De nombreux pilotes se sont enfuis pour rejoindre les Forces aériennes françaises libres (FAFL), qui ont volé aux côtés de la RAF lors des campagnes de la bataille d'Angleterre et d'Afrique du Nord. L'une des unités les plus célèbres des FAFL était le Groupe de Chasse Normandie-Niémen, qui combattit sur le front de l'Est aux côtés des Soviétiques, gagnant une haute distinction. Après la libération, l'armée de l'air s'est rééquipée d'avions alliés et a soutenu les opérations en Allemagne et en Indochine. L'Armée de l'Air constitue désormais un pilier essentiel de la puissance militaire française, soutenant les opérations terrestres, défendant l'espace aérien et affirmant la souveraineté française sur ses territoires mondiaux."
 French_Communism.1.d:0 "Il est clair que les communistes ont remporté les récentes élections législatives. Cela a provoqué une crise politique majeure lorsque le président Vincent Auriol a annoncé sa démission. Il a refusé de nommer un Premier ministre communiste. Gaston Monnerville a pris la présidence en promettant d'organiser de nouvelles élections. Les événements récents ont suscité la colère des militants communistes et des dirigeants politiques qui estiment que la volonté du peuple est réprimée. Le président Monnerville insiste sur le fait qu'il respectera le parti qui remportera les élections."
 French_Communism.2.d:0 "Le parti communiste français PCF a lancé un appel au soutien de l'Union soviétique. Les dirigeants communistes français estiment que le gouvernement et l'armée résistent activement à la volonté du peuple français. Il s'agit d'une réponse à la décision prise par le nouveau Président, Gaston Monnerville, d'organiser de nouvelles élections. Cette décision intervient après la démission de son prédécesseur après avoir refusé de nommer un Premier ministre communiste. Les autres partis politiques français condamnent la décision du PCF, affirmant que le parti doit fonctionner et faire confiance à la République française. Un haut responsable de la défense a déclaré en privé aux médias que le pays courrait un risque d'ingérence soviétique."
 French_Communism.3.d:0 "Le parti communiste PCF a remporté de justesse la majorité à l'issue des nouvelles élections législatives. Avec leur majorité, le président français Gaston Monnerville a rempli consciencieusement sa fonction, permettant au leader du PCF Maurice Thorez de prendre la tête du gouvernement. Même si de nombreuses personnes en France saluent publiquement le transfert du pouvoir comme une preuve que la République reste forte, on craint que Thorez ne cherche à transformer le système. De l'autre côté, les partisans du PCF craignent que certaines institutions, notamment militaires, cherchent à renverser la République et à prendre pour cible le PCF. Les tensions sont exacerbées à travers le pays."
 French_Communism.4.d:0 "Plusieurs officiers supérieurs de l'armée française nous ont contactés en privé. Ils aimeraient que les États-Unis fournissent secrètement du matériel de guerre et un soutien au cas où une guerre civile éclaterait. Le Parti communiste français a récemment remporté les élections nationales et a formé un gouvernement. Les militaires craignent qu'ils envisagent d'inviter l'Union soviétique et de détruire la République française. Avec notre soutien, les généraux français croient pouvoir protéger la France en cas de coup d'État communiste ou d'invasion soviétique. Beaucoup au Pentagone soutiennent la proposition, même si certains responsables préviennent que si de tels transferts d'armes étaient découverts, cela pourrait grandement renforcer le PCF sur le plan politique."
 French_Communism.5.d:0 "Le président Maurice Thorez a provoqué un tollé majeur à l'Assemblée nationale après avoir nommé Jacques Duclos au poste de Premier ministre. Cette décision a poussé l'opposition à quitter l'Assemblée nationale en signe de protestation. Beaucoup ont estimé que cette nomination donnait au communiste trop de pouvoir au sein de l'exécutif et qu'il aurait dû rechercher un choix plus modéré pour le Premier ministre. Des manifestations ont également eu lieu dans les villes par des organisations anticommunistes qui craignent que le PCF ait l'intention de transformer la France en république soviétique. Le Président a accusé l'opposition de ne pas tenir compte de la volonté du peuple français."
 French_Communism.6.d:0 "Dans une escalade stupéfiante vers la crise politique qui couvait à Paris, le légendaire dirigeant français Charles de Gaulle a prononcé un discours appelant à la démission du président Maurice Thorez. Dans ses remarques, il a condamné le communisme comme étant incompatible avec la République et les idéaux français. Ces commentaires sont susceptibles de galvaniser le sentiment anticommuniste dans le pays. La forte explosion de de Gaulle confirme les soupçons du PCF selon lesquels il existe une vaste conspiration visant à le déstabiliser et à l'écarter du pouvoir. Le climat politique reste tendu dans toute la France."
 French_Communism.7.d:0 "Des rapports en provenance d'Algérie indiquent qu'il existe une mobilisation importante des forces militaires en Algérie. Les forces mobilisées sont sous le contrôle du général nationaliste conservateur Raoul Salan. Les mouvements de l'armée sont très préoccupants car ils ne semblent pas liés à l'environnement sécuritaire actuel en Algérie. Le président et ses hauts responsables doivent garder un oeil attentif sur la situation, car cela pourrait être le premier pas vers une sorte d'intervention d'éléments anticommunistes au sein de l'armée."
 French_Communism.8.d:0 "Le gouvernement communiste français, dirigé par le PCF, nous demande un soutien militaire. Le PCF craint que l'armée française conservatrice ne soit prête à lancer un coup d'État contre le gouvernement. Les dirigeants du PCF estiment que même si le peuple les soutient, leur manque de personnel militaire ou d'équipement assurera la prédominance des forces anti-révolutionnaires. Protéger la révolution française pourrait nous permettre de prendre pied solidement en Europe occidentale et dans l'Atlantique. Cependant, certains responsables estiment que l'implication de nos forces ne pourrait que provoquer une réaction massive de l'OTAN et drainer des ressources."
 French_Communism.9.d:0 "L'Union soviétique a accepté d'offrir son plein soutien au gouvernement du PCF alors qu'il fait face au risque d'une révolte de l'armée française. De nombreux commandants et unités militaires françaises sont anticommunistes et s'opposent au régime du PCF. Les communistes français croient que l'aide soviétique protégera leur régime d'une prise de pouvoir militaire. Pour les autorités soviétiques, soutenir le gouvernement français montrera leur engagement envers les partenaires internationaux et offrira aux Soviétiques l'opportunité de s'implanter en Europe occidentale."
 French_Communism.10.d:0 "Les États-Unis ont récemment déclaré clairement qu'ils restaient déterminés à soutenir les forces françaises « patriotiques » alors qu'elles tentent de sauver leur nation du régime fantoche des Soviétiques. La propagande militaire française considère l'implication soviétique comme la preuve que le PCF a l'intention de transformer la France en colonie russe. L'Union soviétique doit déterminer si soutenir le régime français vaut la peine de risquer un conflit avec les États-Unis ou un conflit prolongé en Europe occidentale. Cependant, de nombreux responsables soviétiques estiment que les avantages potentiels dépassent les risques posés par l'implication américaine."
 French_Communism.11.d:0 "L'Union soviétique a refusé de reculer face à la crise en France, affirmant qu'elle ne trahirait pas ses camarades français qui sont les seuls à protéger la France d'une dictature militaire. Il a annoncé qu'une flotte soviétique avait été dépêchée pour protéger le gouvernement français de toute opération illégale étrangère ou nationale. Le gouvernement français a publié sa propre déclaration, déclarant qu'il accueillerait favorablement la flotte soviétique qu'il avait invitée. Cette évolution suscite des inquiétudes chez les États-Unis, qui doivent réfléchir à leurs options. Faut-il faire marche arrière, en acceptant pour l'instant le régime communiste, ou bien maintenir le cap et soutenir les unités militaires anticommunistes."
 French_Communism.12.d:0 "Les responsables français et soviétiques se réjouissent des informations selon lesquelles les États-Unis ne s'impliqueront pas activement dans les affaires françaises. Le gouvernement américain a estimé que les risques d'un conflit armé avec l'Union soviétique ne valaient pas la peine de soutenir des unités militaires françaises anticommunistes. Même si les Soviétiques et leurs alliés français seront convaincus que la situation en France métropolitaine est calme, dans les colonies, c'est une autre histoire. Les forces militaires françaises en Afrique du Nord se sont pour l'essentiel séparées du continent et les généraux supérieurs promettent que l'armée française reviendra un jour pour libérer la France."
 French_Communism.13.d:0 "L'Union soviétique a confirmé qu'elle n'enverrait pas de forces militaires pour soutenir le gouvernement communiste français. Bien qu'aucune explication n'ait été donnée, les observateurs pensent que les dirigeants soviétiques ont déterminé qu'il serait trop difficile de maîtriser l'armée française anticommuniste, surtout si elle était soutenue par les États-Unis. Avec l'évaporation du soutien soviétique, le président Maurice Thorez a démissionné. Le très respecté Gaston Monnerville assumera ses fonctions jusqu'à ce que les élections soient organisées. Cette nomination satisfera probablement toutes les factions politiques jusqu'aux prochaines élections. Beaucoup en France attendront avec impatience les nouvelles élections, avec l'espoir que la paix puisse revenir dans la nation."
 french_elections.14.d:0 "Le 17 juin 1951, la Quatrième République française organise des élections pour élire les membres de sa deuxième Assemblée nationale. Le vote a été façonné par les divisions amères du début de la Guerre froide et l'instabilité persistante du règlement d'après-guerre.\n\nDepuis la Libération, trois forces principales dominent la politique française : les communistes (PCF), les socialistes (SFIO) et les démocrates-chrétiens (MRP), les trois principaux courants de la Résistance. Pourtant, en 1947, l'alliance « tripartite » s'effondra. Les communistes furent expulsés du gouvernement et Charles de Gaulle fonda le Rassemblement du peuple français (RPF), se présentant comme l'alternative à ce qu'il ridiculisait comme le « régime des partis ». \n\nEn réponse, les socialistes, les démocrates-chrétiens et les radicaux ont forgé la coalition dite Troisième Force. Menée par Henri Queuille avec Georges Bidault, Guy Mollet et René Pleven comme vice-premiers ministres, cette coalition cherchait à préserver la démocratie parlementaire contre les « menaces jumelles » de la révolution communiste et du populisme gaulliste. Cependant, l'alliance était fragile et divisée sur la laïcité, la réforme économique et le rôle de l'État.\n\nCraignant des gains communistes et gaullistes, le gouvernement a adopté une réforme électorale controversée au début de 1951. Même si la représentation proportionnelle était préservée, si une coalition dépassait 50 % des voix dans une circonscription, elle remporterait tous les sièges selon la nouvelle règle d'apparence. Le système favorisait fortement les partis progouvernementaux fragmentés, qui pouvaient s'allier, tout en isolant le PCF et le FPR, dont le gouffre idéologique empêchait la coopération."
 french_elections.11.d:0 "En décembre 1953, la Quatrième République française fut confrontée à l'une de ses élections présidentielles les plus longues et les plus chaotiques. La présidence, laissée vacante par Vincent Auriol après son mandat de 1947, est devenue l'objet d'une lutte acharnée entre la gauche, le centre et la droite à une époque où la France était déchirée par l'instabilité gouvernementale, de profondes divisions sur la guerre d'Indochine et d'âpres débats sur le projet de Communauté européenne de défense (CED).\n\nPour la première fois dans l'histoire, l'élection a été retransmise à la télévision française. Mais l'émission s'est avérée interminable, s'étalant sur plusieurs jours et plusieurs reprises, et a finalement été interrompue sur ordre du gouvernement - démonstration embarrassante des dysfonctionnements de la République.\n\nDu 17 au 23 décembre, pas moins de treize tours de scrutin ont eu lieu :\n\n-Marcel-Edmond Naegelen, soutenu par les socialistes et les communistes, dominait la gauche. Fervent opposant à la CED, il bénéficiait du soutien de parlementaires déterminés à bloquer les ambitions fédéralistes européennes.\n\n-Joseph Laniel, leader du centre-droit, a failli remporter la victoire au 8e tour, avec seulement 22 voix d'écart. Une manoeuvre procédurale du président du scrutin, le socialiste André Le Troquer, a invalidé plusieurs bulletins de vote, lui refusant ainsi la présidence.\n\n-Des candidats radicaux comme Yvon Delbos et Jean Médecin ont tenté de rallier le soutien des centristes mais n'ont pas réussi à sortir de l'impasse.\n\nAlors que les tours s'éternisaient et que l'épuisement s'installait, la candidature de Naegelen restait bloquée par le centre droit. Le retrait de Laniel a laissé le champ libre aux compromis. Finalement, la droite et les modérés se sont ralliés à René Coty, un parlementaire havrais largement négligé. Coty, qui s'était abstenu lors de l'EDC en raison d'une opération de la prostate, a ironisé : \"Si je suis président de la République, c'est parce que j'ai été opéré.\"\n\net le gagnant est...."
 french_elections.18.d:0 "Le peuple français s'est récemment rendu aux urnes pour les dernières élections législatives. Beaucoup espèrent qu'une nouvelle législature pourra aider le pays à surmonter les récents bouleversements politiques et internationaux auxquels le pays est confronté. Cependant, il est clair qu'une Assemblée nationale divisée en plusieurs partis sera à nouveau le résultat, mais on ne sait pas quelle coalition a obtenu la majorité. Le Front républicain, une coalition de partis socialistes, semble être le vainqueur probable si leurs partis obtiennent la majorité. S'ils n'obtiennent pas de majorité, il est probable que les partis de centre droit formeront la coalition au pouvoir. Les citoyens de toute la France attendent de connaître les résultats finaux et le destin futur de leur nation."
 fra_crisis_2_desc:0 "L'instabilité politique fréquente à Paris et le manque de direction concernant la guerre d'Algérie ont suscité l'inquiétude au sein de l'armée française. De nombreux officiers craignent que les politiciens trahissent l'honneur français et laissent tomber la nation. Les officiers les plus radicaux ont convergé vers l'Algérie et ont récemment décidé d'agir. La nouvelle parvint bientôt au gouvernement français stupéfait selon lequel les généraux français en Algérie avaient pris le pouvoir aux autorités civiles. La nouvelle junte s'appelle le Comité de salut public. Ils ont réclamé un leadership fort et le retour du héros français Charles de Gaulle. Quelques jours plus tard, les troupes françaises en Algérie se sont emparées de la Corse pour accroître la pression sur le gouvernement. De Gaulle a seulement déclaré qu'il servirait la nation s'il était appelé par le gouvernement. Le gouvernement français doit maintenant décider s'il doit ramener de Gaulle, accepter la prise de pouvoir du Comité de salut public ou proposer un compromis pour l'Algérie."
 fra.1.t:0 "L'unification de l'Autriche"
 fra.1.d:0 "Le peuple autrichien veut redevenir un pays libre et indépendant. Il pourrait servir d'État tampon entre l'Est et l'Ouest. Est-ce qu'on permet cela ?"
 fra.1.a:0 "Oui bien sûr!"
 fra.1.b:0 "Non, nous gardons la terre."
 fra.2.t:0 "Accepter la RPC à l'ONU"
 fra.2.d:0 "La République populaire de Chine veut être reconnue à l'ONU. La République de Chine est devenue très faible après la guerre civile, nous devons donc désormais soutenir la nation la plus grande et la plus forte, à savoir la République populaire de Chine."
 fra.2.a:0 "Oui bien sûr!"
 fra.2.b:0 "Non, ils resteront dehors."
 fra.4.t:0 "Le Niger demande l'indépendance"
 fra.4.a:0 "Oui, ce sera leur jour d'indépendance !"
 fra.4.b:0 "Non, ils ont toujours besoin de notre protection."
 fra.11.t:0 "Création de l'Union de l'Europe occidentale"
 algeirs.6.t:0 "\"Putsch des Généraux\" Le sort de Gerboise Verte"
 algeirs.6.d:0 "Les autorités gouvernementales françaises à Paris ont ordonné l'explosion de la bombe atomique Gerboise Verte au Sahara dans le cadre d'un programme d'essais programmé. Gerboise Verte serait alors sur le point d'exploser aujourd'hui. Alors que les tests et le site d'essai sont déjà préparés dans le cadre du programme nucléaire national, le calendrier des tests doit être accéléré pour garantir que la sécurité de l'appareil n'est pas compromise, cependant des rumeurs selon lesquelles des putschistes tenteraient de prendre le contrôle de la bombe avant que le gouvernement ne la fasse exploser..."
 algeirs.6.a:0 "La détonation de la bombe est un succès"
 algeirs.6.b:0 "La bombe a été saisie avant son explosion !"
 algeirs.4.t.his:0 "\"Putsch des Généraux\" Discours de De Gaulle"
 algeirs.4.t.alt:0 "\"Putsch des Généraux\" Discours du Général Faure"
 algeirs.5.t.his:0 "\"Putsch des Généraux\" Discours de Chérif Sid Cara"
 algeirs.5.t.alt:0 "Les parachutistes du \"Putsch des Généraux\" débarquent à Paris !"
 algeirs.5.d.his:0 "Aujourd'hui, le député Chérif Sid Cara, lui-même putschiste en 1958, en tant que président du conseil général d'Oran, publie avec vingt autres conseillers généraux une déclaration de soutien aux putschistes. Ils \"saluvent avec ferveur l'aube d'une Algérie définitivement française, gage évident d'une véritable fraternité...\", et \"... Présentent l'hommage profondément ému de leur gratitude à l'armée française et à ses dirigeants dont ils se déclarent totalement solidaires...\", cela affecterait-il le soutien aux putchistes ?"
 algeirs.5.d.alt:0 "Aujourd'hui un groupe de parachutistes a débarqué à Marseille et à Paris, rejoignant le général Faure et arrêtant les dirigeants socialistes et communistes, en Algérie le shérif adjoint Sid Cara, lui-même putschiste en 1958, en tant que président du conseil général d'Oran, a publié avec vingt autres conseillers généraux une déclaration de soutien aux putschistes. Ils \"saluvent avec ferveur l'aube d'une Algérie définitivement française, gage évident d'une véritable fraternité...\", et \"... Présentent l'hommage profondément ému de leur gratitude à l'armée française et à ses dirigeants dont ils se déclarent totalement solidaires...\""
 algeirs.5.a:0 "Les putschistes sont déjà condamnés, ils ont perdu tous leurs soutiens."
 algeirs.5.b:0 "La loi martiale est promulguée sur le continent et plusieurs "
 algeirs.4.d.his:0 "Dans la nuit, le général Salan est arrivé en Algérie en provenance d'Espagne et a refusé d'armer les militants civils. A 20 heures, le président de Gaulle est apparu à la télévision dans son uniforme militaire vintage des années 1940, appelant les militaires et civils français, en France métropolitaine ou en Algérie, à s'opposer au putsch : en raison de la popularité d'une invention récente, le transistor, l'appel de de Gaulle a été entendu par les soldats conscrits, qui ont refusé en masse de suivre l'appel à l'insurrection des soldats professionnels et ont dans certains cas emprisonné leurs officiers. Le putsch a rencontré une large opposition, en grande partie sous la forme d'une résistance civile, y compris une grève générale d'une heure convoquée par les syndicats le lendemain de la diffusion de de Gaulle. Au sein de l'armée elle-même, beaucoup dépendait de la position prise par chaque officier supérieur. La 13e Division légère d'infanterie, responsable de la zone stratégique Sud Oranais et comprenant des unités de la Légion étrangère, a suivi l'exemple de son commandant, le général Philippe Ginestet, en restant fidèle au gouvernement de Paris. Le succès des mutineries est encore inconnu"
 algeirs.4.d.alt:0 "Dans la nuit, le général Salan est arrivé d'Espagne en Algérie et a commencé à armer les militants civils. A 20 heures, le général Jacques Faure comparaît au Parlement, appelant les militaires et civils français, en France métropolitaine ou en Algérie, à se joindre au putsch : en raison de la popularité d'une invention récente, la radio à transistors, l'appel de Faure a été entendu par les soldats appelés, qui se sont joints en masse pour suivre l'appel à l'insurrection des soldats professionnels et ont dans certains cas emprisonné les fonctionnaires. Le putsch a rencontré une large opposition, en grande partie sous la forme d'une résistance gaulliste et communiste, y compris une grève générale d'une heure convoquée par les syndicats le lendemain de l'émission de Faure. Au sein de l'armée elle-même, beaucoup dépendait de la position prise par chaque officier supérieur. La 13e Division légère d'infanterie, responsable de la Zone stratégique Sud Oranais et comprenant des unités de la Légion étrangère, a suivi l'exemple de son commandant, le général Philippe Ginestet, en restant fidèle au gouvernement de Paris. Les loyalistes attendent toujours une communication du gouvernement"
 algeirs.4.a:0 "Les conscrits ont repoussé avec succès le putsch"
 algeirs.4.b:0 "Les putschistes ont pris le Parlement à Paris et les parachutistes ont débarqué en Corse"
 algeirs.3.t:0 "\"Putsch des Généraux\" Complot de Paris"
 algeirs.3.d.alt:0 "Ce matin, la population d'Alger s'est réveillée avec la nouvelle que \"l'armée a pris le contrôle de l'Algérie et du Sahara\". Les quatre généraux rebelles, Maurice Challe, Edmond Jouhaud, Marie-Michel Gouraud et André Zeller, en accord avec les colonels Godart, Argoud et Lacheroy, arrêtent le délégué général du gouvernement, Jean Morin, le ministre des Transports, Robert Buron, qui était en déplacement, ainsi que plusieurs autorités civiles et militaires. Certains régiments firent défection et suivirent les ordres des chefs rebelles. A Paris, la police a tenté d'arrêter de manière désorganisée le général Jacques Faure, ainsi que six autres officiers et quelques civils impliqués dans le « Complot de Paris » - un plan visant à exporter le coup d'État en France métropolitaine. Lors du Conseil des ministres de 17 heures, aucune autre communication n'a été faite par le Gouvernement. L'Algérie reste en état d'urgence. Les partis de gauche, les syndicats et la Ligue des droits de l'homme appellent à manifester « l'opposition des travailleurs et des démocrates au coup de force d'Alger ». Le sort de Jacques Faure est encore inconnu."
 algeirs.3.d.his:0 "Ce matin, la population d'Alger s'est réveillée avec la nouvelle que \"l'armée a pris le contrôle de l'Algérie et du Sahara\". Les trois généraux rebelles, Maurice Challe, Edmond Jouhaud et André Zeller, en accord avec les colonels Godart, Argoud et Lacheroy, arrêtent le délégué général du gouvernement, Jean Morin, le ministre des Transports, Robert Buron, qui était en déplacement, ainsi que plusieurs autorités civiles et militaires. Certains régiments firent défection et suivirent les ordres des chefs rebelles. A Paris, la police a tenté d'arrêter de manière désorganisée le général Jacques Faure, ainsi que six autres officiers et quelques civils impliqués dans le « Complot de Paris » - un plan visant à exporter le coup d'État en France métropolitaine. Au Conseil des ministres de 17 heures, de Gaulle, serein, a déclaré : \"Ce qui est grave dans cette affaire, messieurs, c'est que ce n'est pas grave.\" L'Algérie reste en état d'urgence. Les partis de gauche, les syndicats et la Ligue des droits de l'homme appellent à manifester « l'opposition des travailleurs et des démocrates au coup de force d'Alger ». Le sort de Jacques Faure est encore inconnu."
 algeirs.3.a:0 "Le Général Faure a été arrêté par la Police"
 algeirs.3.b:0 "Le général Faure n'a pas fait passer le message mais n'a pas été arrêté"
 algeirs.3.c:0 "Le général Faure a réussi à diffuser la nouvelle et plusieurs divisions se sont jointes au putsch"
 algeirs.2.t:0 "Les généraux prennent le contrôle d'Alger !"
 algeirs.2.d:0 "Les généraux André Zeller, Edmond Joshua, Maurice Challe et Gouraud ont perpétré un complot contre De Gaulle. Ils l'ont exécuté ce soir, et le 1er Régiment étranger de parachutistes (REP), sous les ordres du capitaine Hélie Denoix de Saint-Marc, commandant par intérim du régiment, s'empare d'Alger en trois heures. Y compris le Gouvernement Général d'Alger, la mairie, les radios et l'aéroport d'Alger. La seule victime de l'opération est le maréchal Pierre Brillant. Abattu alors qu'il défendait l'émetteur radio d'Ouled Fayet. Le préfet de police Maurice Papon et le directeur de l'Administration de la sécurité nationale installent une cellule de crise dans un salon de la Comédie-Française, où le général de Gaulle assiste avec Léopold Sédar Senghor à une présentation de Britannicus. Le chef de l'Etat a été informé à l'entracte par Jacques Foccart, secrétaire général chargé des Affaires africaines et malgaches, son plus proche collaborateur. Officiellement, De Gaulle a été prévenu après la représentation. Les rumeurs selon lesquelles le général Gouraud aurait renoncé au complot font encore débat. Les renseignements sont revenus avec un rapport..."
 algeirs.2.a:0 "...Le général Gouraud démissionne"
 algeirs.2.b:0 "...Le général Gouraud prend le contrôle de Constantine !"
 algeirs.1.t:0 "Fin du putsch d'Alger"
 algeirs.1.d.his:0 "Les quelques unités militaires qui avaient suivi les généraux se rendirent progressivement. Le général Challe se rendit aux autorités et fut immédiatement transféré en France métropolitaine. Le putsch a été annulé avec succès, mais l'article 16 accordant des pouvoirs pleins et extraordinaires à de Gaulle sera maintenu pendant cinq mois. « La bataille des transistors », comme l'appelait la presse, fut rapidement et définitivement gagnée par de Gaulle."
 algeirs.1.d.alt:0 "Les quelques unités militaires qui avaient suivi le gouvernement se rendirent progressivement. Le Premier ministre Michel Debré se rend au putschiste et est immédiatement transféré à la prison de Clairvaux. Le putsch a réussi, mais l'opposition communiste et les loyalistes gaullistes sont tombés dans la clandestinité et ont lancé une guérilla en France métropolitaine. La presse fut rapidement fermée et la loi martiale étendue à toute la France, le sort de De Gaulle est encore inconnu"
 algeirs.1.a:0 "Ce qui est grave dans cette affaire, messieurs, c'est qu'elle n'est pas sérieux."
 algeirs.1.b:0 "Les forces gouvernementales sont vaincues et une nouvelle junte militaire dirigera désormais le pays"
 fra.15.d:0 "Philippe Pétain, général et collaborateur nazi, est décédé aujourd'hui. Il est décédé hier matin à l'Île d'Yeu, à l'âge de 95 ans, et a été inhumé au cimetière marin (Cimetière communal de Port-Joinville) proche de la prison."
 may.681.d:0 "Le groupe d'extrême droite Occident a annoncé aujourd'hui son intention de tenir une réunion à la Faculté de Nanterre, prévue le 3 mai. En réponse, des partisans maoïstes aidés par des militants anti-guerre ont occupé la Faculté."
 may.682.d:0 "Plus tard dans la journée aura lieu le défilé du premier mai, à l'appel de la CGT, du PCF et du PSU, mais la CFDT, le FGDS et la FEN ont refusé de se joindre à la marche. Un événement notable est le cortège du « Mouvement du 22 mars » qui s'est affronté avec la CGT."
 may.683.d:0 "Des incendies se déclarent à la Sorbonne occupée. Des rumeurs selon lesquelles le groupe d'extrême droite Occident allait attaquer les insurgés maoïstes, des étudiants communistes ont contacté les ouvriers pour les aider à construire des barricades à l'aide d'un bulldozer. La police est venue arrêter les étudiants, Nanterre a été fermée et le Premier ministre est parti en visite diplomatique."
 may.684.d:0 "Les émeutes se sont étendues au Quartier Latin. Plusieurs organisations d'extrême gauche étaient présentes. L'Occident est venu les enlever mais a été repoussé. Le Quartier Latin est devenu un champ de bataille entre policiers et étudiants communistes."
 referendumfr.2.d:0 "La Loi sur les Apparentements est une loi votée en 1951 pour contrer les scores croissants des gaullistes et des communistes aux élections législatives. Ensemble, ils représentaient jusqu'à 45% des voix et tous deux visaient à bloquer le processus législatif de la IVe République. Contre cette menace, la loi stipulait que n'importe quelle liste pouvait s'associer à d'autres ; si le score total connecté était supérieur à 50 %, ils prendraient tous les sièges et les répartiraient entre eux. Puisque les gaullistes ou les communistes n'avaient aucun lien avec qui que ce soit, ils étaient assurés de perdre la plupart des circonscriptions."
 FRAPCF.1.d:0 "Le gouvernement français a annoncé qu'il reconnaissait officiellement son rôle historique dans l'exploitation et l'oppression des peuples de ses colonies d'Indochine. Cependant, le gouvernement actuel ne commettra pas les erreurs du passé ni ne perpétuera la misère que le capitalisme inflige aux gens. Le gouvernement a décidé qu'il soutiendrait tous les mouvements de libération en Indochine et qu'il oeuvrerait pour aider ces groupes à établir des gouvernements indépendants, libres de l'influence de l'exploitation capitaliste ou impériale. Cette annonce du gouvernement français est accueillie avec prudence dans les colonies françaises et accueillie avec enthousiasme parmi les classes intellectuelles urbaines de France. Cependant, parmi la classe moyenne et les Français ruraux, l'accueil a été mitigé, car beaucoup dans ces communautés considèrent l'Indochine comme faisant partie de la nation française mondiale et pensent qu'elle devrait rester française."
 FRAPCF.2.d:0 "Alors que l'Union soviétique fait preuve de plus en plus de répression et de tendances antidémocratiques, de nombreux communistes d'Europe occidentale s'en éloignent de plus en plus. En outre, le modèle soviétique apparaît de plus en plus étranger aux sociétés habituées aux approches démocratiques. Ces tendances, ainsi qu'une révision de la théorie marxiste, ont vu l'émergence de l'eurocommunisme. L'eurocommunisme soutient les institutions démocratiques et encourage les partis communistes à s'allier avec d'autres groupes pour lancer des réformes sociales à grande échelle et parvenir à une domination démocratique de la société. L'accent mis sur la classe ouvrière s'est désormais étendu à la classe moyenne. L'eurocommunisme offre une nouvelle voie démocratique vers le socialisme et les communistes qui l'adoptent s'éloignent également de l'Union soviétique. L'Union soviétique et les communistes traditionnels considèrent l'eurocommunisme comme une voie révisionniste dangereuse, vouée à l'échec. Cependant, pour les communistes français, l'eurocommunisme offre un moyen d'élargir leur base de soutien et de démontrer leur indépendance au sein de l'ordre communiste mondial."
 FRAPCF.3.d:0 "Le Parti communiste français a décidé, après d'intenses réunions, que la France embrasserait l'anarchisme. L'anarchisme maintiendra un État minimal et garantira à tous les citoyens une liberté absolue. Des associations libres commenceront probablement à émerger et la France sera bientôt la nation la plus libre de la planète. La France ne sera plus asservie par l'ordre capitaliste car son peuple ne sera plus contrôlé par les mécanismes étatiques. Beaucoup en France associent ce nouveau tournant à la continuation des expériences anarchiques menées à Barcelone pendant la guerre civile espagnole. Bien que ces expériences aient été abandonnées, leur héritage perdure et l'anarchisme sera désormais la voie de la France. Les États voisins ont exprimé leur inquiétude et leur inquiétude, tout en déclarant qu'ils attendraient de voir ce que l'anarchisme impliquerait. Dans les capitales européennes, des foules d'anarchistes sont descendues dans les rues pour célébrer les nouvelles venues de France."
 PCF_ALG.1.d:0 "Le gouvernement communiste français a déclaré que la violence insensée, l'exploitation et la misère prendraient fin en Algérie. Il a décidé d'accorder l'indépendance à l'Algérie et de la laisser diriger par son propre peuple. Le gouvernement français a déclaré que c'était le système capitaliste et les pressions impérialistes qui avaient forcé la France à se battre pour contrôler l'Algérie. Maintenant que ces pressions n'influencent plus le gouvernement, il est clair que la guerre en Algérie ne sert plus à rien et doit être menée à une juste conclusion. En France, la décision bénéficie d'un large soutien dans les zones urbaines, mais dans les zones rurales et parmi la classe moyenne, il existe un sentiment de trahison. Pour eux, l'Algérie n'a jamais été une colonie, mais une extension de la patrie et ils voient l'annonce du gouvernement comme une trahison non seulement de la nation mais de la population française qui vit actuellement en Algérie."
 ALG_CRACKDOWN.1.d:0 "Le gouvernement français a déjà déclaré son opposition à la décolonisation en ce qui concerne l'Algérie. Selon eux, l'Algérie n'est pas une colonie, mais une partie de la métropole française et doit être préservée des idéologies barbares et étrangères. Pour soutenir cette position, le gouvernement français a confirmé avoir approuvé une nouvelle campagne visant à pacifier l'Algérie. Les médias algériens indiquent que les forces françaises se sont engagées dans une opération généralisée, utilisant des tactiques de recherche agressives, des armes lourdes et parfois des tirs aveugles afin de déraciner et de réprimer le mouvement indépendantiste. Cette nouvelle intensité de la violence a encouragé de nombreuses personnes en France qui estiment que le gouvernement devrait faire tout ce qui est nécessaire pour résoudre la crise. Cependant, des protestations ont également eu lieu contre cette brutalité et, au niveau international, de nombreux États ont déjà exprimé leur inquiétude face au recours disproportionné à la force par l'armée française."
 Petain.100.d:0 "Suite au décès de Philippe Pétain, un débat a éclaté sur l'endroit où l'ancien général et président français devrait être enterré. Pétain avait été l'un des plus grands généraux français de la Première Guerre mondiale, dirigeant les forces françaises lors de la bataille de Verdun. Cependant, son héritage est devenu controversé lorsque, pendant la Seconde Guerre mondiale, il a dirigé le gouvernement fantoche français pro-nazi à Vichy. Il est vilipendé par beaucoup mais vénéré par de nombreux vétérans et nationalistes en France. Après la guerre, il fut reconnu coupable de trahison et passa le reste de sa vie dans une cellule de prison de l'Île d'Yeu. Après sa mort, il a été prévu de l'enterrer sur l'île d'Yeu mais de nombreux nationalistes français ont exigé qu'il soit enterré à la nécropole de Douaumont avec les tombes françaises de Verdun. Le gouvernement français doit décider s'il doit l'enterrer à l'Île d'Yeu ou apaiser les nationalistes et l'enterrer à Verdun."
 AJAX.20.d:0 "Dans une tournure étonnante et inattendue des événements, le Shah est rentré en Iran aujourd'hui, son avion atterrissant à l'aéroport de Mehrabad où il a été accueilli avec enthousiasme. Après une période d'intense incertitude nationale, son arrivée semble avoir galvanisé une population désespérée en quête de stabilité.\n\nDès les premières heures de la matinée, des foules massives avaient envahi les principaux boulevards de la capitale, agitant des drapeaux nationaux et brandissant des portraits du monarque. Pour beaucoup, le retour de l'héritier d'une dynastie vieille de 2 500 ans est salué comme un moment charnière, représentant un ancrage solide en temps de crise et de restauration de l'ordre national."
 state_islam:0 "Islam d'État"
 idea_IRQ_rights_for_minorities:0 "Droits des minorités"
 ECSC.1.desc:0 "En France, le ministre des Affaires étrangères Robert Schuman a réussi à obtenir le soutien de nombreuses couches de la nation et des partis non communistes à la Communauté européenne du charbon et de l'acier. Cette idée a recueilli le soutien de collègues ministériels, du président de la commission des relations extérieures et de l'ancien Premier ministre Paul Reynard. Comment allons-nous choisir ?"
 ECSC.2.desc:0 "En Allemagne de l'Ouest, le soutien à la CECA est mitigé. Le Parti social-démocrate dirigé par Kurt Schumacher s'est opposé à sa création ainsi qu'à l'adhésion de la République fédérale à la CECA. Cependant, le ministre-président de la Rhénanie du Nord-Westphalie, où se trouvent de nombreuses installations de charbon et d'acier, s'est prononcé en faveur de la CECA. Comment allons-nous choisir ?"
 ECSC.3.desc:0 "La Belgique est un exportateur majeur de charbon et possède plusieurs grandes mines en région wallonne. Cela contribuera à la croissance de notre économie, mais pourrait être perçu comme une cession face aux autres puissances occidentales. Nos travailleurs seront peut-être heureux, mais pas nos hommes d'affaires. Comment allons-nous choisir ?"
 ECSC.4.desc:0 "Les Pays-Bas importent d'importantes quantités de produits agricoles et de produits industriels. La CECA contribuera à la croissance de notre économie, mais pourrait être perçue comme un acte de cession face aux autres puissances occidentales. Nos travailleurs seront peut-être heureux, mais pas nos hommes d'affaires. Comment allons-nous choisir ?"
 ECSC.5.desc:0 "Le Luxembourg, bien que petit pays, possède un important secteur bancaire et de télécommunications. La CECA contribuera à la croissance de notre économie, mais pourrait être perçue comme un acte de cession face aux autres puissances occidentales. Nos travailleurs seront peut-être heureux, mais pas nos hommes d'affaires. Comment allons-nous choisir ?"
 ECSC.6.desc:0 "L'Italie est en train de passer d'une nation essentiellement agricole à une puissance industrielle en croissance rapide avec une production automobile et alimentaire. La CECA contribuera à la croissance de notre économie, mais pourrait être perçue comme un acte de cession face aux autres puissances occidentales. Nos travailleurs seront peut-être heureux, mais pas nos hommes d'affaires. Comment allons-nous choisir ?"
 fra.16.d:0 "Après que le Parti communiste a pris le pouvoir en France, la Deuxième Grande Terreur a été déclenchée et les purges sont monnaie courante dans toute la France. Des individus particuliers tels que des anticommunistes connus, des collaborateurs des nazis et des critiques du régime. Certains responsables diplomatiques français ont décidé de fuir à l'étranger ou dans des ambassades alignées sur l'Occident, tandis que d'autres tentent désespérément d'éviter d'être arrêtés et emprisonnés. La Vague Rouge est de nouveau revenue en France."
 fra.17.d:0 "Après avoir quitté l'OTAN, et au grand choc des puissances occidentales voisines, la France a annoncé son adhésion au Pacte de Varsovie, l'alliance défensive communiste soviétique. Il s'agit d'un avantage majeur pour le bloc communiste, dans la mesure où l'armée française est vaste et étendue ; ainsi que stratégiquement précieux, le fait que la France soit détachée du reste du bloc de l'Est en étant en Europe occidentale. Il s'agit certainement d'une évolution."
 fra.18.d:0 "Le stalinisme en France est resté une valeur fondamentale du PCF et est dirigé par Maurice Thorez. Le révisionnisme, en particulier les idées avancées par Nikita Khrouchtchev et Auguste Lecoeur, ne sont pas tolérés et sont considérés comme une soumission aux puissances impérialistes bourgeoises occidentales. Ces individus ne peuvent tout simplement pas rester debout et les idées de Staline perdureront dans notre paradis socialiste français."
 fra.19.d:0 "Auguste Lecoeur, chef du Parti communiste français de 1942 à 1944, député et maire de Lens, a prêté serment en tant que président de la France. Connu comme un opposant virulent à Maurice Thorez et un partisan de Nikita Khrouchtchev et du révisionnisme, on s'attend à ce que de nombreuses réformes viennent de sa direction."
 fra.22.d:0 "Des rapports du ministère de la Défense indiquent que nos forces communistes françaises ont annexé la région frontalière de la Sarre en Allemagne, y compris des forces marchant vers la plus grande ville de Sarrebruck. Théoriquement, le protectorat de la Sarre est sous contrôle français depuis la fin de la Seconde Guerre mondiale, mais par crainte qu'il ne soit pris par l'Allemagne de l'Ouest dans le chaos communiste qui a suivi, la France l'a directement annexé."

