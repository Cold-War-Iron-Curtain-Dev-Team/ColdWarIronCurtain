 European_Development_Fake_description:0 "Lorsque Aristide Briand, Gustav Stresemann et Richard Coudenhove-Kalergi ont défendu les idées du partenariat franco-allemand et de l'unité européenne dans les années 1920, ils ont pour la plupart rencontré des oreilles chauvines et nationalistes sourdes, sapant l'importance de l'unité et des interdépendances. Avec la Seconde Guerre mondiale derrière nous, une nouvelle chance pour l'intégration européenne peut commencer. Un chapitre qui pourrait rapprocher les nations d'Europe pour mettre fin aux guerres sans fin sur ce continent au fil des siècles."
