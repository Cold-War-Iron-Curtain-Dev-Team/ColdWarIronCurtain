 FRA_60s_The_Algeirs_Coup_desc:0 "La récente conférence de presse sur l'avenir de l'Algérie a accru les tensions entre les Pieds-Noirs et le peuple algérien d'origine. Le plaidoyer de De Gaulle en faveur de la décolonisation, basé sur le fait que l'Algérie est devenue une charge pour la nation française ces dernières années, a suscité la peur des Français de souche qui ont construit leur vie à travers la Méditerranée. Il est fort possible que d'éminents Pied-Noirs tentent de se maintenir au pouvoir, même sans notre présence dans le pays. Si la France s'engageait à se retirer d'Algérie, le vide de pouvoir qui en résulterait pourrait être exploité par des commandants opposés à la décolonisation."
