 jap_yoshida.19.t: "Bakayaro...."
 jap_yoshida.19.d: "Lors de la 15e session de la Diète nationale, un incident mémorable s'est produit lors de la séance de questions-réponses entre le Premier ministre Yoshida et Eiichi Nishimura, membre du parti Shakai-to Uha. De manière inattendue, Yoshida a utilisé un terme inhabituel, qualifiant Nishimura d'« idiot », dans sa barbe. À la surprise de beaucoup, cette déclaration a été captée par inadvertance par un microphone, qui a été entendu par l'ensemble de la Chambre des représentants.\n\nEn réponse, Nishimura a rapidement riposté, comparant Yoshida et son cabinet au célèbre premier ministre Tojo Hideki en temps de guerre. Cet échange a dégénéré en une dispute brève mais intense entre les deux hommes politiques. Sentant la gravité de la situation, Yoshida a rapidement rétracté ses propos pour tenter de désamorcer les tensions. Néanmoins, les membres du parti Shakai-to Uha, interprétant le commentaire de Yoshida comme une démonstration flagrante de manque de respect envers l'institution estimée de la Diète, ont résolu collectivement de renvoyer le Premier ministre devant la commission disciplinaire pour ce qu'ils considéraient comme une « infraction disciplinaire en tant que législateur ». Ils ont également déposé une motion de censure et le vote devrait avoir lieu prochainement. Ichiro Hatoyama, reconnaissant l'opportunité de renverser Yoshida, son rival acharné de longue date, a laissé Jiyu-to avec d'autres conservateurs Boryu pour assurer le succès de la motion de censure. Que se passe-t-il ensuite ? Le temps nous le dira."
 jap_yoshida.19.a: "Opportunistes !"
 jap_yoshida.20.t: "[GetNewspaperHeader]Dissolution de Bakayaro"
 jap_yoshida.20.d: "Suite au récent « incident du bakayaro », une motion de censure a été déclenchée par le commentaire irrespectueux de Yoshida envers un législateur. Avec un soutien diminué de la part des conservateurs pro-Hatoyama, la motion a trouvé l'approbation de la majorité. Plus de 30 membres de la faction Hatoyama du Jiyu-to, absents lors du vote sur le renvoi pour infraction disciplinaire, ont quitté le parti, s'alignant sur la motion de censure contre le cabinet, qui a également été approuvée.\n\nEn réponse, Yoshida, confronté à des turbulences politiques, a dissous la Chambre des représentants, signalant l'annonce imminente des prochaines élections générales. Cette dissolution a divisé le Jiyu-to, alors que les législateurs anti-Yoshida se sont séparés pour créer leur faction dirigée par Ichiro Hatoyama, prêts à défier le Jiyu-to de Yoshida lors des prochaines élections."
 jap_yoshida.20.a: "Bien."
 jap_yoshida.21.t: "Formation du Kaishin-to"
 jap_yoshida.21.d: "Aujourd'hui marque la création d'un nouveau parti politique, connu sous le nom de Kaishin-to. Le parti est né de la fusion du Kokumin-to et du Nokyo-to, les législateurs du premier formant le noyau de cette entité nouvellement créée. Kaishin-to se positionne comme un parti majoritairement centriste.\n\nAvant la fusion, des délibérations ont eu lieu concernant une éventuelle union avec Nokyo-to. Des inquiétudes ont notamment été exprimées, notamment par des membres de l'ancien Minshu-to, concernant l'adoption de « politiques socialistes modérées ». Malgré ces réserves, un accord fut finalement trouvé, aboutissant à la formation du Kaishin-to. La convention a également vu la participation de membres du Shinsei Club, un groupe dissident du Minsei Kyuyukai (qui est une association d'anciens démocrates d'avant-guerre). Cependant, en raison de désaccords persistants entre les législateurs pro-Ashida et pro-Miki, le poste de président au sein du parti nouvellement formé restera temporairement vacant. Des efforts sont en cours pour résoudre ces divergences et nommer un président dans un avenir proche.\n\nKaishin-to, contrairement à Jiyu-to, a déclaré le programme suivant : plaider pour l'autodéfense indépendante du Japon, créer un esprit national sans radicalisme et mettre en oeuvre des réformes progressistes."
 jap_yoshida.21.a: "Mais sera-t-il suffisamment compétent ?"
 jap_yoshida.22.t: "[GetNewspaperHeader]résultats des 26èmes élections générales"
 jap_yoshida.22.d: "Au point culminant des 26èmes élections générales japonaises, Shigeru Yoshida est sorti victorieux une fois de plus, assurant son poste de Premier ministre après le triomphe consécutif de Jiyu-to.\n\nMalgré le caractère peu surprenant de la victoire de Yoshida, la composition des sièges à la Chambre des représentants a connu des changements notables. Jiyu-to, tout en conservant sa domination avec 199 sièges, a connu un revers, perdant 41 sièges par rapport aux élections précédentes. Le parti a notamment dû faire face au départ de certains députés conservateurs de Boryu, dirigés par Ichiro Hatoyama, qui se sont divisés pour former leur propre parti indépendant. Le paysage électoral se déroule avec Jiyu-to (199 sièges) en tête, suivi de Kaishin-to (76 sièges), Shakai-to Saha (72 sièges), Shakai-to Uha (66 sièges), le Jiyu-to dirigé par Hatoyama (35 sièges), Kono-to (5 sièges) et Kyosan-to n'obtenant qu'un seul siège. Les 11 sièges restants sont répartis entre divers partis mineurs et candidats indépendants.\n\nCette élection marque également la première fois où l'examen populaire national des juges de la Cour suprême a été omis. La décision était fondée sur le peu de temps écoulé depuis le dernier examen à la fin de 1952."
 jap_yoshida.22.a: "Yoroshiku !"
 jap_yoshida.23.t: "annonce des 25e élections générales"
 jap_yoshida.23.d: "Le gouvernement a déclaré la tenue prochaine des 25èmes élections générales, marquant un moment historique alors que le pays se prépare à son premier exercice électoral après la fin de l'occupation alliée, ainsi qu'en vertu de la nouvelle loi sur les élections aux fonctions publiques. Adoptée en 1950, cette loi constitue une consolidation essentielle de l'ancienne loi électorale de la Chambre des représentants et de l'ancienne loi électorale de la Chambre des conseillers. Sa mise en oeuvre introduit un système complet d'élection publique des dirigeants des gouvernements locaux et des commissaires à l'éducation.\n\nL'un des développements significatifs menant à cette étape électorale est la levée des interdictions frappant certains membres de fonctions publiques, résultat de l'application du Traité de paix de San Francisco. Ce changement monumental a ouvert l'arène politique à un groupe de politiciens expérimentés qui n'avaient auparavant pas le droit de briguer des fonctions publiques. À la suite de ce changement de politique, un nombre important de ces personnes ont choisi de se présenter aux élections, marquant ainsi leur retour sur le devant de la scène politique nationale."
 jap_yoshida.23.a: "Faisons de notre mieux !"
 jap_yoshida.24.t: "[GetNewspaperHeader]résultats des 25èmes élections générales"
 jap_yoshida.24.d: "À la suite des 25èmes élections générales japonaises, le parti conservateur Jiyu-to est sorti vainqueur écrasant, consolidant ainsi sa domination sur la politique japonaise. Shigeru Yoshida, l'influent conservateur Honryu et défenseur des politiques pro-américaines, reste à la barre en tant que Premier ministre, prolongeant son mandat face à un mandat retentissant. La Chambre des représentants reflète l'ampleur du triomphe de Jiyu-to, puisqu'elle a obtenu un nombre stupéfiant de 240 sièges. Les partis d'opposition sont à la traîne, Kaishin-to obtenant 85 sièges, Shakai-to Uha avec 57 sièges et Shakai-to Saha juste derrière avec 54 sièges. Kono-to parvient à obtenir un modeste 4 sièges, tandis que les 26 sièges restants sont répartis entre divers petits partis et législateurs indépendants. Consternant les militants d'extrême gauche et les communistes, le Kyosan-to n'a pas remporté un seul siège lors de cette élection, principalement en raison d'une diminution du soutien public résultant de ses récentes activités militantes.\n\nAlors que la poussière retombe sur les résultats des élections, le Japon se prépare à une période de leadership continu sous la direction de Shigeru Yoshida et du parti Jiyu-to."
 jap_yoshida.24.a: "Yoroshiku !"
