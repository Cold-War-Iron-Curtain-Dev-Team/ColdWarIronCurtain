 JAP_RI_Labour_Union_Radicalism: "Radicalisme syndical"
 JAP_RI_Kyosanto_Militants: "Kyosan-aux militants"
 JAP_RI_Uyoku_Dantai_tt: "§YUyoku Dantai (groupes de droite)§!\nContribuer à : §BLes troubles Uyoku§!"
 JAP_RI_Kyosanto_Militants_tt: "§YKyosan-aux militants§!\nContribuer à : §RSayoku Troubles§!"
 JAP_RI_Labour_Union_Radicalism_tt: "§YRadicalisme syndical§!\nContribuer à : §RSayoku Troubles§!"
 JAP_RI_Uyoku_Dantai_ttd: "£JAP_Uyoku_Dantai_tt\n\n\n\n\n\n\n\n§YDes jeunes de droite participent à la « Convention nationale pour renverser Sohyo »§!\n\nPendant la guerre, les Uyoku Dantai ont prospéré mais ont décliné après la défaite du Japon, supprimés par l'occupation américaine visant la démocratisation et la démilitarisation du Japon. Cela a conduit à un déclin des forces nationalistes de droite, mais bientôt remplacées par des groupes pro-américains. Cependant, au plus fort de la guerre froide et alors que les Américains souhaitaient faire du Japon un allié anticommuniste, les mouvements de droite ont pu réapparaître, contrecarrant les troubles croissants à gauche. Des rassemblements patriotes ont émergé, donnant naissance à un mélange de groupes militants d'avant et d'après-guerre. Ces groupes de droite s'opposent fermement aux radicaux de gauche, soutiennent les liens américains et prônent le réarmement du Japon. Notamment, les boryokudan (groupes violents Yakuza) soutiennent souvent financièrement ces factions."
 JAP_RI_Kyosanto_Militants_ttd: "£JAP_Kyosanto_Militants_tt\n\n\n\n\n\n\n\n§YDes policiers font une descente dans une base militante de Sanson Kosakutai§!\n\nL'idée d'une « révolution pacifique » ayant été rejetée, le Kyosan-to a maintenant recours à la violence, employant des militants pour inciter à une « révolution nationale pour libérer le peuple japonais ». Inspirés par la tactique de Mao Zedong, ils ont établi de nombreux bastions militants dans les villages ruraux. Même si leur objectif d'une révolution nationale n'est qu'une farce, leurs activités militantes continuent de perturber la paix et la stabilité publiques. Utilisant des cocktails Molotov et d'autres armes de fortune, ils ciblent fréquemment les commissariats de police et les résidences de politiciens de droite. Ces militants incitent manifestement d'autres radicaux de gauche à la violence à des degrés divers. Il faut donc s'en occuper le plus rapidement possible."
 JAP_RI_Labour_Union_Radicalism_ttd: "£JAP_Labour_Union_Radicalism_tt\n\n\n\n\n\n\n\n§YManifestation syndicale de gauche devant la Diète nationale§!\n\nLes syndicats japonais sont apparus au cours de l'industrialisation de l'ère Meiji, mais avec des droits limités et une faible position juridique. Après la fin de la guerre et les efforts de démocratisation du Japon, ces syndicats ont obtenu la liberté de faire grève collective et de négocier pour leurs droits. Cependant, cette transition a également marqué le début d'un sentiment de gauche notable au sein de ces syndicats, souvent soutenu par le soutien de factions radicales et de partis politiques de gauche, aux côtés de l'importance de personnalités syndicales influentes d'extrême gauche. Ces syndicats participent fréquemment à des manifestations et à des grèves contre les initiatives gouvernementales qui vont à l'encontre de leur idéologie de gauche, recourant même au militantisme dans des circonstances extrêmes."


