 JAP_carrier_hull_light_4: "Classe Hyuga"
 #JAP_carrier_hull_light_0_desc: ""
 #JAP_carrier_hull_light_2_desc: ""
 JAP_carrier_hull_light_1_desc: "Les ambitions de JMSDF en tant que transporteur remontent à loin. Dès le début, au début des années 1950, la JMSDF envisageait d'acquérir ou de louer des transporteurs légers auprès de l'USN. Ce concept actuel était l'un des deux projets envisagés au début des années 60. Le premier était le CVH-a, un navire de 23 000 tonnes, qui transportait 18 hélicoptères ASW HSS-2 (SH-3 Sea King) et six avions ASW à voilure fixe S-2 Tracker. L'autre, le CVH-b, était nettement plus petit mais devait quand même transporter 18 HSS-2."
 JAP_carrier_hull_light_3_desc: "La classe Osumi est un quai de transport amphibie japonais. La classe est également connue sous le nom de classe Oosumi. Alors que la Force maritime d'autodéfense japonaise (JMSDF) décrit la classe Osumi comme des navires de débarquement de chars (LST), ils n'ont pas les portes avant et la capacité d'échouage traditionnellement associées aux LST. Fonctionnellement, leur pont de coffre fait ressembler la classe Osumi à un navire de débarquement à quai (LSD)."
 JAP_carrier_hull_light_4_desc: "Le destroyer d'hélicoptères de classe Hyuga est une classe de porte-hélicoptères construit pour la Force maritime d'autodéfense japonaise (JMSDF)."

