 ### GUI Tooltips ###
 JAP_National_Diet_info_text: "§YLa note d'approbation du Cabinet§! représente la confiance de la Diète nationale dans le cabinet du Premier ministre actuel. Certaines décisions et priorités peuvent nécessiter un montant minimum spécifique de pourcentage «§GApprouver§!», il est donc sage de maintenir ce nombre élevé.\n\n§YL'approbation globale du public§! représente l'opinion de l'ensemble de la population sur le gouvernement actuel. Comme ci-dessus, certaines décisions et orientations peuvent également nécessiter une note d'approbation minimale spécifique.\n\n§YLes notes d'approbation du Cabinet§! §Ret§! §YL'approbation globale du public§! §Rpeuvent changer après l'élection d'un nouveau Premier ministre.§!\n\n§YLa composition de la Chambre des représentants§! représente les partis présents à la Chambre basse et le nombre de sièges qu'ils occupent. §GVerts§! les noms représentent §Yles noms§! affiliés au gouvernement ou §Yles partis de la coalition au pouvoir§!, §Rrouges§! les noms représentent §Yles partis d'opposition§!, et « Autres » représente des partis non affiliés ou mineurs.\n\n§YComposition de la Chambre des représentants§! §Ret§! §YLes factions intra-partis§! §Rexistent pour des raisons de saveur et d'immersion. Pour l'instant, ils ne disposent d'aucune mécanique affectant le jeu.§!\n\nTout au long du jeu, vous devez vous attendre à une poignée d'événements et de priorités nationales qui affecteront les mécanismes ci-dessus, en bien ou en mal. Soyez prudent dans ce que vous faites pour maintenir les chiffres à un niveau élevé !"
