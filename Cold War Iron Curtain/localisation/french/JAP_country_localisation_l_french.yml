 ### Decisions ###
 JAP_SF_Treaty_Category: "Mission pour un accord de paix"
 JAP_SF_Treaty_Category_desc: "\n\n\n\n\n£GFX_JAP_SF_Treaty_Categor_Banner\n\n\n\n\n\n\n§YJohn Foster Dulles§!, dépêché de Washington, est arrivé à Tokyo. Sa visite symbolise un changement décisif §Ydans la politique d'occupation§!. Les objectifs initiaux de démilitarisation et de démocratisation du Japon commencent à changer à mesure que la guerre froide §Y§! s'approfondit. Face à la propagation du communisme à travers l'Asie, les États-Unis ne voient plus le Japon simplement comme une nation isolée et vaincue, mais comme un §Gpilier central de l'ordre du Pacifique§!.\n\nMais la paix ne signifiera pas simplement le rétablissement de la souveraineté. La présence continue de §Rbases militaires américaines§!, la question d'un §Ytraité de sécurité§!, l'avenir de §YOkinawa§!et la pression croissante pour §Run réarmement§! restent toutes en suspens. Pour retrouver son indépendance, le Japon doit décider s'il accepte une nouvelle forme de dépendance §R§!, ou s'il poursuit un accord de paix plus large sur une voie beaucoup plus incertaine.\n\nLe destin du Japon d'après-guerre est désormais en train d'être décidé.\n\n\nINFLUENCE DE LA PROPOSITION\n§Y[USA.GetFlag]Les États-Unis§!: [?JAP_Peace_Deal_Mission_support_USA_var|%]\n§Y[SOV.GetFlag]Union Soviétique§!: [?JAP_Peace_Deal_Mission_support_SOV_var|%]\n§Y[JAP.GetFlag]État du Japon§!: [?JAP_Peace_Deal_Mission_support_JAP_var|%]\n\n\nMême si le Japon a été vaincu lors de la Seconde Guerre mondiale, nous ne resterons pas de simples serviteurs des Alliés. Nous devons rester fermes sur ce que nous accepterons et ce que nous refuserons. Cependant, §RUne influence étrangère écrasante sur la proposition japonaise brisera l'accord de paix !§!\n"

 JAP_Keiretsu_Category: "Donner du pouvoir au Keiretsu"
 JAP_Keiretsu_Category_desc: "Après la guerre, les autorités d'occupation américaines ont démantelé les puissants zaibatsus, qui étaient de grandes entreprises sur notre territoire, dans le but de briser leur contrôle monopolistique. Cependant, nous devrions aujourd'hui réfléchir à la nécessité d'utiliser les restes de ces géants industriels. Les ressusciter sous le nom de «§YKeiretsus§!» pourrait être une étape vitale dans la revitalisation du Japon d'après-guerre, qui se trouve actuellement dans un état de désarroi économique. Ces conglomérats commerciaux historiquement influents ont le potentiel d'apporter stabilité et croissance économique à une nation désireuse de se reconstruire et de retrouver son ancienne prospérité. En revigorant l'esprit de coopération et de planification stratégique à long terme que représentent les Keiretsus, le Japon pourrait trouver les bases nécessaires pour relever ses défis actuels et ouvrir la voie à un avenir meilleur."
