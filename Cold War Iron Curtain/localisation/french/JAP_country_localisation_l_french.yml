 #JAP_carrier_hull_0_desc: ""
 #JAP_carrier_hull_2_desc: ""
 JAP_carrier_hull_1_desc: "Les ambitions de JMSDF en tant que transporteur remontent à loin. Dès le début, au début des années 1950, la JMSDF envisageait d'acquérir ou de louer des transporteurs légers auprès de l'USN. Ce concept actuel était l'un des deux projets envisagés au début des années 60. Le premier était le CVH-a, un navire de 23 000 tonnes, qui transportait 18 hélicoptères ASW HSS-2 (SH-3 Sea King) et six avions ASW à voilure fixe S-2 Tracker. L'autre, le CVH-b, était nettement plus petit mais devait quand même transporter 18 HSS-2."
 #JAP_carrier_hull_3_desc: ""
 JAP_carrier_hull_4_desc: "Les destroyers polyvalents de classe Izumo ou 22DDH sont des porte-hélicoptères en service dans la Force maritime d'autodéfense japonaise (JMSDF)."
 
