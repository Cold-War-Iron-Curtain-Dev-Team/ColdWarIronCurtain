 JAP_National_Radicalism_GUI_info_text: "§YL'équilibre d'influence§! représente le bras de fer entre les §Yd'extrême droite§! et les §Yd'extrême gauche§!. Il n'a pas de modificateur, mais certaines décisions ou même certaines priorités peuvent nécessiter un certain pourcentage d'influence de n'importe quel camp.\n\n§YLes niveaux de troubles§! représentent la gravité de l'activisme des deux spectres, comme son nom l'indique. Plus le niveau d'agitation augmente, plus les effets de l'activisme d'extrême droite §Y§! ou §Yde l'activisme d'extrême gauche§! des esprits nationaux sont graves.\n\n§YProblèmes actuels§! n'est qu'une liste de causes contribuant aux troubles des deux spectres radicaux. Cependant, la liste agit davantage comme une saveur ou un caractère immersif, puisque vous ne pouvez pas supprimer manuellement les problèmes. Certains événements, décisions et priorités nationales ajouteront ou supprimeront des problèmes au fil du temps.\n\nTout au long du jeu, vous devez vous attendre à une poignée d'événements et de priorités nationales qui affecteront les mécanismes ci-dessus, en bien ou en mal. Soyez prudent dans ce que vous faites pour maintenir la stabilité du Japon !"
