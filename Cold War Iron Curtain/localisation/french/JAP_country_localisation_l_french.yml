 POLITICS_NOBUSUKE_KISHI_DESC: "Au cours des années 1920 et au début des années 1930, le brillant jeune bureaucrate Nobusuke Kishi s'est rendu dans les principales puissances industrielles du monde et a étudié leurs politiques économiques. À son retour, il est devenu partisan d'une croissance économique guidée par l'État. Au milieu des années 1930, l'armée japonaise remit entièrement la politique économique du Mandchoukouo entre les mains de Kishi. Il a supervisé la croissance économique mais a été impliqué dans la corruption et l'exploitation du travail avant son retour au Japon en 1940. Pendant la guerre, il a servi plusieurs cabinets, principalement en tant que ministre des Munitions. À la fin de la guerre, il a été arrêté mais a évité des poursuites pénales malgré sa profonde implication dans l'exploitation brutale de la main-d'oeuvre non japonaise. Il trouva les procès américains illégitimes et chercha à organiser les partisans conservateurs au Japon pour affirmer l'indépendance du pays. Bien que membre du Parti libéral au pouvoir, il critique et critique activement le Premier ministre Shigeru Yoshida pour sa dépendance excessive à l'égard des États-Unis. Cependant, pour l'instant, Kishi a évité d'être purgé par les Américains en raison de sa capacité à organiser des factions conservatrices au sein du Parti libéral contre les socialistes japonais."
 POLITICS_SHIGERU_YOSHIDA_DESC: "Lorsque le Parti libéral remporta les élections générales de 1946, les autorités alliées interdisèrent rapidement au chef du parti, Ichiro Hatoyama, de devenir Premier ministre. À sa place, Shigeru Yoshida a repris le poste de Premier ministre. Shigeru Yoshida a rejoint le service extérieur en 1906 et, pendant la Seconde Guerre mondiale, il a activement cherché à pousser le Japon à rechercher la paix avec les puissances alliées. Le diplomate de carrière a longtemps eu des tendances pro-américaines et pro-britanniques, ce qui en fait un Premier ministre idéal pour les autorités d'occupation. Depuis qu'il est devenu Premier ministre, Yoshida s'est concentré sur l'économie, cherchant à reconstruire l'économie japonaise. En termes de politique étrangère, Yoshida s'est efforcé d'établir un partenariat de sécurité avec les États-Unis. Beaucoup suggèrent que cette politique donnant la priorité à l'économie et à une défense différente des Américains est une doctrine Yoshida. Yoshida doit garder un oeil sur les restes de factions nationalistes au Japon et démontrer à l'ensemble de la population que sa politique mènera à la prospérité et à la sécurité du Japon, sous peine d'être qualifié de larbin des États-Unis."


### Decisions ######################################
 JAP_National_Projects_Category: "Projets de développement du Japon"
 JAP_National_Projects_Category_desc: "Le Japon explore des initiatives innovantes pour stimuler son économie en améliorant des secteurs clés, tels que les infrastructures, la technologie et l'énergie. Ces initiatives visent à stimuler le développement économique, à soutenir la croissance et à favoriser un avenir prospère pour nos citoyens tout en tirant parti des opportunités émergentes. En investissant stratégiquement dans ces entreprises, nous visons à tirer parti de nos atouts et à solidifier notre économie."
