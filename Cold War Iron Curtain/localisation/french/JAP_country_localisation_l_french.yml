 jap_yoshida.46.t: "[GetNewspaperHeader]Création de la Force d'autodéfense japonaise"
 jap_yoshida.46.d: "À la suite de l'occupation, l'évolution de la position du Japon concernant l'article 9 de sa Constitution a ouvert la voie à un renforcement des capacités militaires. Le climat de guerre froide a contraint le Japon à reconnaître l'impératif des capacités d'autodéfense dans les affaires mondiales. Soutenue par le soutien des États-Unis, cette initiative a abouti à la création d'une Agence de défense et à la conversion de la Force de sécurité nationale en « Forces japonaises d'autodéfense » - une armée en tous points, sauf en termes de nomenclature. Cependant, son rôle est strictement limité à des fins d'autodéfense et est étroitement surveillé par les États-Unis. La JSDF, composée de la JGSDF, de la JASDF et de la JMSDF, émerge comme une réponse à la situation géopolitique, garantissant la préparation du Japon à l'autodéfense tout en naviguant dans les nuances délicates de son cadre constitutionnel. Malgré ses limites, la formation du JSDF renforce la position délicate du bloc occidental en Asie, soulignant la souveraineté nationale fraîchement affirmée du Japon."
 jap_yoshida.46.a: "Une décision cruciale pour notre sécurité."
 jap_yoshida.47.t: "[GetNewspaperHeader]Grande consolidation Showa"
 jap_yoshida.47.d: "Le Japon a connu plusieurs vagues de consolidations municipales depuis la restauration Meiji. Le nouveau projet de « Consolidation du Grand Showa » aidera le pays à faire face aux changements apportés par les soi-disant réformes d'après-guerre, en particulier le gouvernement agissant en vertu de la nouvelle Constitution de 1947 ainsi que de la loi sur l'autonomie locale de 1947. Dans le cadre de ce système de gouvernement local d'après-guerre, les rôles des municipalités ont été renforcés et elles ont été chargées de gérer les lycées, de mener des activités de prévention des incendies et de s'occuper des questions de protection sociale. Avec la population en croissance constante, et donc le nombre croissant de collégiens, ainsi que le nouveau système de lycées, leur gestion est forcément une charge pour chaque municipalité.\nÀ cette fin, la consolidation Great Showa sera étayée par deux lois sur la fusion municipale afin de rendre efficace la gestion des collèges et de peaufiner l'administration municipale. Cela contribuera également à utiliser la petite superficie du pays pour une industrie et une urbanisation en plein essor."
 jap_yoshida.47.a: "Super!"
 jap_yoshida.48.t: "La purge rouge"
 jap_yoshida.48.d: "Avec l'introduction récente de la « Doctrine Truman », les États-Unis ont annoncé leur position inflexible contre le communisme, avec le Japon comme cible pour le nettoyer des radicaux d'extrême gauche. L'année dernière, alors que le diplomate américain George Kennan faisait pression sur MacArthur pour qu'il change sa politique modérée, les troubles se sont répandus entre le printemps et l'été avec une série de manifestations d'ouvriers, d'étudiants et d'enseignants dans les principales villes du Japon. Sans surprise, après l'approbation de Washington, les autorités d'occupation ainsi que la Huitième Armée ont réprimé de manière agressive ces mouvements. Le tristement célèbre « incident de l'éducation Hanshin » s'est produit en avril lorsque les autorités japonaises, sous la direction du gouvernement américain et du ministère japonais de l'Éducation, ont fermé les écoles privées coréennes en activité au Japon ; on dit que de telles actions ont été motivées par la crainte d'une éventuelle infiltration communiste dans les écoles. En outre, plus tard en septembre, Hitoshi Ashida, alors Premier ministre du Japon et homme politique de gauche, a été arrêté avec certains de ses membres de son cabinet à la suite du tristement célèbre « scandale Showa Denko ».\nAvec le nouvel héritage des événements de l'année dernière, l'incertitude économique, les efforts politiques de Kyosan-to et la formation du Zengakuren, l'extrême gauche ne pourra se propager à travers le pays que si rien n'est fait pour y faire face ; la situation nécessite donc de continuer à s'attaquer à la menace rouge."
 jap_yoshida.48.a: "Il fallait..."
 jap_yoshida.49.t: "Iruzu Senpu"
 jap_yoshida.49.d: "Dans le cadre de la « Purge rouge » en cours visant à freiner la menace communiste croissante au Japon, la Section civile, d'information et d'éducation du GHQ a élaboré des plans pour garantir que le système éducatif reste pur de tout idéal d'extrême gauche. À cette fin, les autorités ont envoyé le Dr Walter C. Eells, qui sert au GHQ en tant que conseiller en matière d'enseignement supérieur, dans trente universités nationales pour appeler au licenciement immédiat des professeurs et du personnel sympathisants du communisme. Eells a également visité l'Université de Niigata et a qualifié le communisme de « doctrine dangereuse et destructrice ». En raison de ses idéaux, l'anticommunisme devient peu à peu un sentiment national et ouvertement boudé par les journaux nationaux. De plus, des sympathisants d'extrême gauche ont été licenciés des établissements d'enseignement, la plupart du temps pour des raisons non pertinentes. Cette initiative est communément connue sous le nom de « typhon Eells », ou « Iruzu Senpu », comme nous l'appelons.\n\nCertains affirment que les actions d'Eells constituent une suppression flagrante de la liberté académique au Japon, tandis que d'autres le défendront, affirmant que le CIE n'a jamais été directement impliqué dans la purge rouge. Quoi qu'il en soit, une chose reste claire : « l'Iruzu Senpu » est un élément essentiel de la purge rouge en cours."
 jap_yoshida.49.a: "Tant mieux pour lui."
 jap_yoshida.50.t: "[GetNewspaperHeader]Incident de Shimoyama"
 jap_yoshida.50.d: "Le premier président des chemins de fer nationaux japonais, Sadanori Shimoyama, a récemment été retrouvé mort sur la ligne Joban, Adachi, après avoir été porté disparu hier. Sur la base de l'autopsie officielle dirigée par le professeur Tanemoto Furuhata, il a été déterminé que Shimoyama était mort avant d'être heurté par le train, une perte de sang étant possible en raison du manque de sang sur le corps. De plus, dans certaines parties du corps, des hémorragies internes ont été constatées, qui pourraient avoir été provoquées uniquement par une force considérable, comme des coups de pied. D'un autre côté, on pense également que la mort de Shimoyama était un suicide. Cependant, l'hémorragie interne observée correspondait également à une collision avec un train, et les enquêteurs n'auraient pas pu observer de sang sur les lieux car il pleuvait.\n\nQuelques jours avant sa mort, Shimoyama a reçu l'ordre de réduire le personnel de JNR dans le cadre de la politique de Dodge Line et a publié une liste de 30 000 employés à licencier. La rumeur dit qu'il a reçu des menaces de mort de la part de hauts responsables militaires américains pour s'assurer qu'il exécutait l'ordre, ce qui aurait pu provoquer une grave détresse mentale et donc un possible suicide. D'un autre côté, des rumeurs courent même selon lesquelles certains des employés susceptibles d'être licenciés pourraient être impliqués d'une manière ou d'une autre. Néanmoins, l'incident reste un mystère."
 jap_yoshida.50.a: "Choquant"
 jap_yoshida.51.t: "[GetNewspaperHeader]Incident de Mitaka"
 jap_yoshida.51.d: "Aujourd'hui, un train sans pilote en fuite circulant à une vitesse d'environ 60 km/h a franchi un arrêt tampon et a plongé dans une rue commerçante voisine, tuant six personnes et en blessant vingt vingt, à la gare de Mitaka, ligne principale Chuo. Les autorités chargées de l'enquête ont arrêté dix employés de Kyosan-to et un ancien conducteur de train, Keisuke Takeuchi, soupçonnés d'un éventuel complot commun dans le cadre de l'activisme d'extrême gauche. Cependant, le procès final et la décision du tribunal sur la question n'ont pas encore eu lieu.\n\nCet incident s'est produit peu de temps après le récent incident de Shimoyama, au cours duquel le premier président du JNR, Sadanori Shimoyama, a été retrouvé mort sur la ligne Joban, et les gens ont déjà commencé à remettre en question l'authenticité des accusations portées contre l'Union nationale des chemins de fer japonais (Kokuro) et le Kyosan-to à propos de ces deux incidents."
 jap_yoshida.51.a: "Discutable."
 jap_yoshida.52.t: "[GetNewspaperHeader]Déraillement de Matsukawa"
 jap_yoshida.52.d: "Sans surprise, un autre incident ferroviaire s'est produit. Aujourd'hui, un train de voyageurs de la ligne principale du Tohoku a déraillé et s'est renversé sur un tronçon de voie courbe, alors qu'il se rendait de la gare d'Aomori à la gare d'Ueno. La locomotive s'est renversée, tuant trois membres d'équipage ; cependant, aucun des 412 passagers n'a été blessé ou tué. Les enquêteurs ont découvert que les boulons et les écrous des joints de voie avaient été desserrés et qu'un grand nombre de crampons de chemin de fer fixant les rails aux traverses avaient été retirés, ainsi qu'une clé et un levier dans une rizière à proximité. Comme d'habitude, les soupçons se sont immédiatement portés sur le Kokuro, les travailleurs de l'usine voisine de Toshiba-Matsukawa et les travailleurs de Kyosan-to, en raison des récentes protestations contre les réductions d'effectifs. Dix ouvriers de l'usine de Matsukawa et dix employés de JNR ont été inculpés et accusés de sabotage.\n\nLe fait que cela, ainsi que les récents incidents de Shimoyama et Mitaka se soient produits en l'espace de deux mois, a germé une théorie du complot selon laquelle le GHQ, avec l'aide des services de renseignement américains, aurait perpétré ces incidents comme prétexte pour arrêter les membres de Kokuro et Kyosan afin de contrecarrer tout éventuel activisme d'extrême gauche."
 jap_yoshida.52.a: "Coïncidence?"
 jap_yoshida.53.t: "Formation des Keiretsus"
 jap_yoshida.53.d: "Alors que le vent du changement souffle sur notre pays, nous devons faire face à l'héritage de notre passé. Les Zaibatsus, autrefois puissances économiques du Japon, n'existent plus. À leur place, un nouvel ordre économique est en train d'émerger : le Keiretsus. Ces conglomérats, constitués des vestiges des anciens zaibatsus, sont sur le point de façonner l'avenir économique du Japon. Aujourd'hui, nous avons pris une décision cruciale qui déterminera le cours de l'économie de notre pays. Les anciens zaibatsus étaient entravés par les restrictions d'après-guerre qui limitaient leur influence et étouffaient la croissance économique. En levant ces restrictions et en encourageant la formation de Keiretsus, nous pouvons espérer libérer tout le potentiel de nos industries. Cela entraînera une augmentation de la production économique, de l'innovation technologique et une amélioration de la compétitivité sur la scène nationale."
 jap_yoshida.53.a: "C'est pour le mieux."
 jap_yoshida.54.t: "La proposition CVH"
 jap_yoshida.54.d: "La sécurité et la défense du pays restant une priorité absolue, une décision attend. Une nouvelle « proposition CVH » a été présentée, une initiative stratégique visant à renforcer les capacités navales du pays. Cependant, le potentiel de réaction politique de la proposition soulève des questions quant à son approbation immédiate. La proposition CVH, élaborée après de longues délibérations par des experts de la défense, vise à renforcer les efforts de recherche et développement axés sur les porte-avions et les hélicoptères pour la JMSDF. L'initiative présente une opportunité importante de renforcer la sécurité maritime du Japon, car elle fournirait à la JMSDF les moyens modernes et polyvalents nécessaires à la sauvegarde des eaux territoriales du pays et à la contribution aux efforts de sécurité internationale. Les porte-avions et les hélicoptères constituent l'épine dorsale de toute force navale efficace, permettant un déploiement rapide du personnel, des fournitures et des équipements sur de vastes territoires maritimes.\n\nCependant, il est important de reconnaître que la mise en oeuvre de cette proposition pourrait susciter de légères réactions politiques, car l'opposition estime que cela violerait la constitution pacifiste et contribuerait à une course aux armements inutile."
 jap_yoshida.54.a: "La constitution pacifiste doit être respectée."
 jap_yoshida.54.b: "La sécurité nationale avant tout !"
 jap_yoshida.55.t: "Perle d'Asie"
 jap_yoshida.55.d: "La récente résurgence diplomatique et économique du Japon n'est pas passée inaperçue dans toute l'Asie. À mesure que nos industries se redressent et que notre influence s'étend progressivement, certains à l'étranger ont commencé à décrire notre pays comme une nouvelle « Perle de l'Asie »." 
 jap_yoshida.55.a: "Intéressant."
 jap_yoshida.55.b: "Le Japon est fier."
 jap_yoshida.55.c: "Nous surveillerons cela de près."
 jap_yoshida.55.e: "Concernant."
 jap_yoshida.56.t: "La Réserve de la Police Nationale"
 jap_yoshida.56.d: "Face à la guerre en Corée et avec l'autorisation et la demande du commandement suprême des puissances alliées, le gouvernement japonais a pris la décision de créer la réserve de la police nationale. Cette force n'est pas seulement destinée à faire face aux menaces extérieures potentielles, mais également à maintenir la stabilité intérieure, notamment en ce qui concerne notre situation politique fragile, où des troubles intérieurs sont très possibles.\n\nDepuis la dissolution complète de notre armée suite à notre défaite dans la guerre, nous sommes restés désarmés pendant près d'une demi-décennie. Aujourd'hui, pour la première fois, nous levons à nouveau les armes, non pas dans le cadre d'une résurgence militaire, mais pour la sécurité nationale. Cependant, il faut reconnaître qu'avec l'article 9 toujours en vigueur, le rôle du NPR est strictement limité à la sécurité et à l'ordre public. Cette force n'est en aucun cas une armée permanente et sa taille est soigneusement limitée à 75 000 hommes, garantissant ainsi qu'elle reste une entité défensive et non militaire."
 jap_yoshida.56.a: "Étape nécessaire."
 jap_yoshida.57.t: "La Force de Sécurité Côtière"
 jap_yoshida.57.d: "Après la création de la Réserve de la Police Nationale en tant que force de sécurité terrestre, il y a eu une discussion concernant la création d'une force similaire dédiée à la sécurité maritime. Après la défaite du Japon en 1945, sa marine fut complètement dissoute et la garde côtière se retrouva avec des ressources limitées : limitées à des bateaux de patrouille dotés d'un armement minimal et même de restrictions sur leur vitesse et leur portée ; cela a rendu notre pays vulnérable en termes de capacités de défense maritime. Cependant, avec le déclenchement de la guerre de Corée, le SCAP s'est montré de plus en plus favorable à l'idée d'un élargissement de ses capacités de défense par le Japon. Ce changement de politique s'est manifesté clairement dans l'approbation de la création du NPR, signe clair du changement de position à l'égard des besoins de défense du Japon. Dans cette optique, les discussions ont désormais conduit à la création de la Force de sécurité côtière, une force de sécurité nouvellement créée chargée de protéger les frontières maritimes du Japon et de sécuriser ses eaux.\n\nAlors que le Japon progresse dans ses efforts, des discussions sont en cours avec des responsables américains concernant la possibilité de louer des frégates et d'autres navires de fabrication américaine pour faciliter les capacités opérationnelles de la Force de sécurité côtière."
 jap_yoshida.57.a: "Excellente nouvelle."
 jap_yoshida.58.t: "Accord de location de navires entre le Japon et les États-Unis"
 jap_yoshida.58.d: "Suite à l'autorisation accordée par le SCAP au Japon de créer une force de sécurité côtière, les discussions entre les responsables américains et japonais ont conduit à une décision importante visant à aider leurs capacités de défense maritime. Conscients de l'importance stratégique de la sécurisation des eaux territoriales japonaises dans le contexte de la guerre de Corée en cours, les États-Unis ont décidé de louer une flotte de navires pour soutenir la nouvelle force de sécurité japonaise.\n\nDans le cadre de cet accord, le Japon recevra 18 patrouilleurs de classe Tacoma et 55 patrouilleurs de classe Yuri, fournissant ainsi la base nécessaire aux opérations maritimes. En outre, des programmes de formation conjoints et des conseils opérationnels seront organisés pour garantir l'intégration transparente de ces navires dans les forces de sécurité japonaises."
 jap_yoshida.58.a: "Nos alliés du Pacifique."
 jap_yoshida.58.b: "Nos alliés du Pacifique."
 jap_yoshida.59.t: "[GetNewspaperHeader]La loi sur les forces d'autodéfense"
 jap_yoshida.59.d: "Alors que le redressement du Japon est en bonne voie et que sa position internationale s'est renforcée après la signature du traité de paix, la nécessité de renforcer ses propres capacités de défense est devenue de plus en plus évidente. Les tensions de la Guerre froide en Asie de l'Est, la récente guerre de Corée et la présence continue de l'Union soviétique et de la Chine comme menaces régionales ont encore renforcé la nécessité d'une autonomie en matière de sécurité nationale. En réponse, le Japon a promulgué l'Accord d'assistance mutuelle en matière de sécurité, obligeant le pays à assumer une plus grande responsabilité pour sa propre défense.\n\nSuite à cela, la loi sur la création de l'Agence de défense et la loi sur les forces d'autodéfense ont été adoptées et ces lois sont entrées en vigueur. L'Agence nationale de sécurité a été réorganisée en Agence de défense et ses branches militaires ont été réformées avec la création de la JGSDF, de la JASDF et de la JMSDF."
 jap_yoshida.59.a: "Une étape nécessaire à notre légitime défense, au nom de l'Empereur."
 jap_yoshida.60.t: "L'Agence Nationale de Sécurité"
 jap_yoshida.60.d: "Face aux tensions persistantes en Asie de l'Est, le Japon a franchi une nouvelle étape dans la reconstruction de ses forces de sécurité sous la supervision américaine. Suite à la création de la réserve de la police nationale et de la force de sécurité côtière, le besoin d'une force de sécurité plus structurée et organisée est devenu évident. Étant donné que la NPR et la CSF étaient des organisations de forces de sécurité distinctes, leur intégration de commandement était simple. Mais jusqu'à présent, en réponse à ces préoccupations, l'Agence nationale de sécurité a été officiellement créée en tant qu'organisation centralisée supervisant à la fois la NPR et la Force de sécurité côtière nouvellement créée, et pour intégrer également leurs structures de commandement. La NSA, bien que techniquement une agence civile relevant du bureau du Premier ministre, sert en réalité de structure proto-militaire, permettant au Japon de développer ses capacités de défense tout en adhérant à l'article 9 de la constitution. Une démarche soutenue par la SCAP."
 jap_yoshida.60.a: "Parfait."
 jap_yoshida.61.t: "Lettre de Douglas MacArthur"
 jap_yoshida.61.d: "Cher Monsieur le Premier Ministre :\n\n     Conformément à ma politique établie visant à réinvestir l'autorité autonome dans le gouvernement japonais aussi rapidement que la situation le permet, j'ai visualisé le développement progressif d'organismes chargés de l'application des lois adéquats au maintien de la sécurité et de l'ordre intérieurs et à la sauvegarde du littoral japonais.\n\n     En ce qui concerne la sécurité maritime dans les ports et les eaux côtières du Japon, le Bureau de la sécurité maritime a obtenu des résultats très satisfaisants, mais les événements révèlent que la sauvegarde de la longue ligne côtière japonaise nécessite l'emploi d'une force plus grande que celle actuellement prévue par la loi.\n\n     En conséquence, j'autorise votre gouvernement à prendre les mesures nécessaires pour constituer une réserve de police nationale de 75 000 hommes. Les sections appropriées de ce quartier général seront disponibles, comme auparavant, pour conseiller et assister sur les aspects techniques de ces mesures.\n\nTrès sincèrement,\nDOUGLAS MacArthur"
 jap_yoshida.61.a: "Reconnu."
 jap_yoshida.62.t: "[GetNewspaperHeader]Une bagarre à la Chambre des Représentants !"
 jap_yoshida.62.d: "Il y a environ trois semaines, un projet d'amendement à la loi sur la police a été adopté par la Chambre des représentants et la session devait se terminer à cette date. Cependant, pour des raisons inconnues, le président de la Chambre des représentants, Yasujiro Tsutsumi, a proposé une prolongation de deux jours de la session.\nEstimant que la prolongation était invalide et inutile, les députés de l'opposition ont empêché le Président de prendre son siège dans le but d'annuler la prolongation proposée. N'ayant pas d'autre choix, le Président a convoqué la police de la Diète pour maintenir l'ordre et la discipline ; Cependant, cela n'a fait qu'aggraver la situation lorsque les membres de la maison et la police se sont livrés à une bagarre brutale./nHeureusement, l'incident n'a pas fait de blessés graves, même si une poignée d'entre eux ont dû être hospitalisés. La session a été prolongée de deux jours comme proposé, même si cet incident aura certainement des conséquences désagréables."
 jap_yoshida.62.a: "Politique!"
 jap_yoshida.63.t: "Validité de la prolongation de la session"
 jap_yoshida.63.d: "Avec la récente prolongation inattendue de la session et la bagarre qui a suivi, nombreux sont ceux qui remettent en question sa validité. Il est affirmé que lors de la prolongation de la session de la Diète, le président de la Chambre des représentants doit consulter le président de la Chambre des conseillers avant que la Chambre des représentants ne prenne une résolution. Décider de prolonger la session sur la seule base de la volonté de la Chambre des représentants dès le début est un défaut majeur ; De plus, le Président n'était pas présent à son siège lorsque la prolongation a été annoncée. Cependant, d'autres soutiennent que la majorité de la Chambre des représentants a décidé de prolonger la session, ce qui a été accepté par la Chambre des conseillers. De plus, le Président n'a pas pu prendre place en raison d'une obstruction. On peut également interpréter qu'en cas d'urgence, la seule volonté de la Chambre des représentants suffit de par la nature de la prolongation de la session. Quoi qu'il en soit, il est presque impossible d'exclure si la prolongation était valide ou non."
 jap_yoshida.63.a: "Effectivement ambigu."
 jap_yoshida.64.t: "Session prolongée jusqu'au 15 juin"
 jap_yoshida.64.d: "Bien que la 19ème session de la Chambre des Représentants ait été initialement prolongée jusqu'à aujourd'hui, le 5 juin, le Président a proposé de prolonger encore la session jusqu'au 15 juin. Cela est principalement dû à l'absence des principaux partis ces deux derniers jours, notamment les partis socialistes de droite et de gauche ; probablement en guise de protestation contre la récente prolongation de la session et la bagarre qui a suivi entre les membres de la Chambre et la police de la Diète convoquée. Ainsi, dans ces circonstances, aucune décision unanime n'a pu être prise sur le projet de loi modifiant la loi sur la police, ce qui a obligé le Président à prolonger une fois de plus la session."
 jap_yoshida.64.a: "Mieux vaut être prudent que se précipiter."
 jap_yoshida.65.t: "Projet de loi modifiant la loi sur la police réussi !"
 jap_yoshida.65.d: "Hier, lors des délibérations de la Commission de l'Administration Locale de la Chambre des Conseillers, un rapport intérimaire a été soumis pour discussion en séance plénière, où le projet de loi d'amendement a été adopté et promulgué. Il a été promulgué aujourd'hui encore et a été approuvé avec la plupart des voix en faveur du projet de loi. Il n'y a donc plus d'obstacles à l'application de la loi sur la police."
 jap_yoshida.65.a: "Enfin!"
 jap_yoshida.66.t: "Corée"
 jap_yoshida.66.d: ""
 jap_yoshida.66.a: ""
 jap_yoshida.66.b: ""
 jap_yoshida.67.t: "Promulgation de la loi sur la prévention des activités subversives"
 jap_yoshida.67.d: "Le cabinet Yoshida a récemment mis en oeuvre la loi sur la prévention des activités subversives en réponse aux troubles provoqués par le Kyosan-to. Cette législation habilite le gouvernement à émettre des directives visant à freiner les activités et, dans les cas graves, à dissoudre les organisations engagées dans des actions subversives qui perturbent l'ordre public et incitent à la violence. Néanmoins, la loi s'est heurtée à l'opposition, notamment de la part du Shakai-to, qui a contesté sa proposition au motif de violation des droits constitutionnels. Ils sont allés jusqu'à accuser le cabinet Yoshida de régresser vers les pratiques totalitaires du passé. Malgré les protestations de divers groupes Sohyo et Zengakuren lors de la phase de rédaction de la loi, l'escalade des émeutes et de la violence lors des manifestations a contraint le gouvernement à la promulguer.\n\nEn réponse à ces critiques, le Cabinet Yoshida a fait la déclaration suivante : « La raison de cette loi est que des activités terroristes dangereuses sont menées par certains éléments de groupes organisés dans notre pays. Aussi regrettable que cela puisse paraître, des activités dangereuses ont été révélées qui proclament dans divers types de documents le bien-fondé et la nécessité du renversement de la Constitution et du gouvernement établi en vertu de celle-ci. Ces activités semblent également sur le point de progresser vers la réalisation de ces objectifs par le biais du terrorisme armé et de la guérilla. Être mené par des groupes organisés ayant des connexions internationales et semble être solide et largement développé."
 jap_yoshida.67.a: "Il ne devrait y avoir aucun compromis sur la loi et l'ordre."
 
 jap_hatoyama.1.t: "[GetNewspaperHeader]Hatoyama prête serment en tant que Premier ministre"
 jap_hatoyama.1.d: "Aujourd'hui marque un tournant majeur dans la politique nationale alors qu'Ichiro Hatoyama assume le titre de Premier ministre, triomphant de plusieurs jours d'obstacles politiques et de rivalités avec le parti Yoshida. Suite à la démission massive du cabinet Yoshida hier, Hatoyama a rapidement nommé son nouveau cabinet, avec Mamoru Shigemitsu comme vice-premier ministre. Après six années de règne conservateur ininterrompu, la faction Jiyu-to concède le pouvoir aux Minshu-to, les laissant découragés. Notamment, l'ancien Premier ministre Yoshida quitte ses fonctions de président du parti et passe le flambeau à Taketora Ogata.\n\nDiplomate charismatique, Hatoyama s'engage à renforcer la position mondiale du Japon à travers des engagements diplomatiques avec l'URSS et l'adhésion aux Nations Unies. Et malgré les désaccords avec l'ancien président du Jiyu-to, Hatoyama a également exprimé sa volonté d'unir les deux partis conservateurs."
 jap_hatoyama.1.a: "Le gouvernement conservateur recommence."
 jap_hatoyama.31.t: "Lettre Domnitski"
 jap_hatoyama.31.d: "Élément clé de son programme, Hatoyama a montré son enthousiasme pour les négociations avec l'Union soviétique. En réponse, la délégation de l'Union soviétique au Japon a contacté le Premier ministre et, le 7 janvier comme aujourd'hui, le chef de mission adjoint Andrei Domnitsky a effectué des visites secrètes au palais d'Otowa et a exprimé son désir de négocier avec la partie soviétique sur un certain nombre de sujets de préoccupation. Aujourd'hui, Domnitsky a remis à Hatoyama un document intitulé « Lettre Domnitski », qui ne contenait ni le nom ni la date de l'expéditeur, mais plutôt un « document du gouvernement soviétique ». La lettre indique ce qui suit :\n\n     \"L'URSS, motivée par son désir de normaliser ses relations avec le Japon, a toujours, comme chacun le sait, préconisé un ajustement des relations bilatérales. La déclaration bien connue de la volonté de normaliser les relations entre l'URSS et le Japon, entre autres, figure dans la Déclaration commune sino-soviétique et dans la déclaration du Ministre des Affaires étrangères de l'URSS.\n     L'opinion publique sait également que vous, Monsieur le Premier Ministre, avez exprimé dans votre récente déclaration votre soutien au règlement des relations nippo-soviétiques. L'espoir d'une normalisation des relations nippo-soviétiques a également été exprimé par le ministre des Affaires étrangères Shigemitsu dans sa déclaration du 11 décembre 1954 et dans des déclarations ultérieures.\n     Compte tenu de ces circonstances, la partie soviétique estime qu'il serait opportun d'échanger des vues sur les mesures à prendre pour normaliser les relations entre le Japon et l'Union soviétique.\n     La partie soviétique est prête à désigner des représentants pour les négociations qui auront lieu soit à Moscou, soit à Tokyo et aimerait connaître les intentions de la partie japonaise à cet égard. »"
 jap_hatoyama.31.a: "Espérons que des efforts soient réellement faits."
 jap_hatoyama.32.t: "Événement d'amitié nippo-soviétique organisé à Shimoda"
 jap_hatoyama.32.d: "Aujourd'hui, l'événement d'échange culturel nippo-soviétique s'est déroulé dans le temple bouddhiste Gyokusen-ji de la ville de Shimoda, préfecture de Shizuoka. L'événement, auquel ont participé avec un réel intérêt les responsables de la ville de Shimoda et des invités étrangers estimés de l'URSS, visait à favoriser la compréhension culturelle entre le Japon et l'Union soviétique.\n\nLe temple Gyokusen-ji, où a eu lieu ce rassemblement, joue un rôle important dans l'histoire des relations nippo-russes. C'est là que l'amiral Poutiatine et sa délégation ont séjourné pendant les délibérations menant à la signature du traité de Shimoda en 1855 entre l'Empire russe et le shogunat Tokugawa. Le temple, chargé d'importance historique, a été le témoin de l'établissement de relations diplomatiques qui ont résisté à l'épreuve du temps. Au cours de l'événement, Mme Irina Nikolayena, professeur distingué à l'Université des études étrangères de Tokyo, et M. Anushevsky ont rendu hommage aux tombes de quatre marins russes enterrés dans l'enceinte du temple, qui ont perdu la vie pendant leur séjour à Shimoda.\n\nAjoutant une touche mélodique aux débats, des musiciens russes ont honoré l'occasion avec les airs enchanteurs de leur pays d'origine. Les balalaïkas résonnaient dans le temple en jouant des chansons folkloriques russes, notamment le classique « Au bord du lac Baïkal ». La musique a servi de pont culturel, transcendant les barrières linguistiques et créant une atmosphère d'appréciation mutuelle."
 jap_hatoyama.32.a: "Beau!"
 jap_hatoyama.33.t: "Début des négociations sur les relations nippo-soviétiques"
 jap_hatoyama.33.d: "Grâce à l'enthousiasme du Premier ministre japonais Ichiro Hatoyama pour les négociations, les deux bureaux diplomatiques du Japon et de l'URSS ont convenu d'organiser des négociations à partir d'aujourd'hui. La mission diplomatique japonaise, dirigée par Shunichi Matsumoto, a quitté l'aéroport de Haneda, à Tokyo, où elle a été accueillie par des familles de prisonniers de guerre japonais toujours détenus en Union soviétique, dans l'espoir que les pourparlers permettront de les ramener chez eux. La mission diplomatique japonaise a rencontré la mission diplomatique soviétique dirigée par Yakov Malik à l'ambassade soviétique située à Londres et les négociations ont commencé.\n\nLes deux parties espèrent que les négociations se dérouleront sans heurts, mais les questions controversées, notamment celle des îles Kouriles, seront inévitablement évoquées et traitées, espérons-le, sans désaccord. L'atmosphère est marquée par un sentiment d'optimisme prudent alors que les diplomates engagent des discussions pour trouver un terrain d'entente et établir les bases d'une amélioration des relations entre les deux nations. Les familles des prisonniers de guerre japonais attendent avec impatience le résultat, espérant que ces négociations ouvriront la voie au retour de leurs proches."
 jap_hatoyama.33.a: "Des obstructions sont à prévoir dans tous les cas."
 jap_hatoyama.34.t: "Convention nationale pour le retour des territoires du Nord"
 jap_hatoyama.34.d: "La convention nationale a eu lieu au Hibiya Public Hall, à Tokyo. Co-parrainé par le Congrès pour le retour des îles Kouriles et des îles Habomai, l'Association de Hokkaido pour la promotion des pêches du Nord, l'Association de Hokkaido et le gouvernement de Hokkaido, il a plaidé en faveur de l'expansion des zones de pêche et du retour des ports de pêche. La convention a exhorté les négociations nippo-soviétiques à Londres à répondre à ces préoccupations, en soulignant l'importance de récupérer les droits territoriaux et d'assurer le bien-être de l'industrie de la pêche."
 jap_hatoyama.34.a: "Ces préoccupations sont pleinement valables !"
 jap_hatoyama.35.t: "Les pourparlers aboutissent à une impasse sur le conflit des îles Kouriles"
 jap_hatoyama.35.d: "Après des mois de négociations, le discours diplomatique entre les envoyés japonais et soviétiques s'est rompu, principalement en raison du différend de longue date sur les îles Kouriles (territoires du Nord).\n\nL'impasse est apparue en août, initialement semée d'embûches, jusqu'à ce qu'une lueur d'espoir fasse surface. A l'issue d'une réunion officielle le 5 août, lors d'une pause thé dans le jardin de l'ambassade du Japon au Royaume-Uni, Yakov Malik, chef de la délégation soviétique, a fait allusion de manière inattendue à une potentielle concession : la possible rétrocession des îles Habomai et Shikotan au Japon. Cette indication s'est concrétisée par une proposition officielle lors d'une réunion ultérieure le 9, au cours de laquelle l'Union soviétique a formellement suggéré le retour de Habomai et Shikotan. Pourtant, les espoirs d'une percée ont été anéantis lorsqu'un télégramme confidentiel de l'envoyé japonais Shunichi Matsumoto au Premier ministre Hatoyama, plaidant pour l'acceptation de l'offre, a été intercepté et rejeté par le ministre des Affaires étrangères Shigemitsu.\n\nPoussés par les responsables du ministère des Affaires étrangères et les diplomates américains, Shigemitsu et ses alliés ont appelé à une position plus affirmée, exigeant le retour des quatre îles, dont Etorofu et Kunashiri. Plus tard, le 27 août, une directive du ministère japonais des Affaires étrangères fut télégraphiée à Matsumoto : « Nous ne devons pas faire de compromis sur le retour de deux îles. Nous devons insister sur le retour de quatre îles. Malgré cette directive, la résistance soviétique reste inflexible. La partie soviétique n'était pas disposée à faire davantage de concessions et a immédiatement rejeté la proposition de restituer les quatre îles. En conséquence, les négociations ont échoué et aucun compromis n'a été trouvé.\n\nAlors que les négociations s'effondraient, les Soviétiques ont riposté en imposant unilatéralement la « Ligne Boulganine », interdisant aux navires de pêche japonais d'accéder à certaines parties des eaux des îles Kouriles, en représailles évidentes à l'impasse diplomatique. Non seulement cela a entraîné des relations tendues entre les deux pays, mais l'industrie de la pêche d'Hokkaido a subi de lourdes pertes en raison des restrictions imposées sur la ligne Boulganine. Les deux camps étant restés sur leurs positions, la perspective d'une résolution de la question territoriale contestée reste lointaine."
 jap_hatoyama.35.a: "Un excellent exemple de nos relations compliquées avec les Russes..."
 jap_hatoyama.35.b: "Ils obtiennent ce qu'ils méritent !"
 jap_hatoyama.37.t: "Visite d'État du Premier ministre Hatoyama en URSS"
 jap_hatoyama.37.d: "La visite d'État du Premier ministre Hatoyama en Union soviétique a débuté dans une grande attente. Au départ de l'aéroport de Haneda à bord d'un avion à hélices de Norwegian Airlines le 7 octobre à 21h15, Hatoyama, accompagné de son envoyé, dont son épouse Kaoru Hatoyama, du ministre de l'Agriculture Ichiro Kono et du conseiller diplomatique Shunichi Matsumoto, a entrepris un voyage de 6 jours à destination de Moscou. À leur arrivée à l'aéroport de Moscou, une atmosphère chaleureuse et accueillante a enveloppé l'envoyé de Hatoyama. Le Premier ministre soviétique lui-même, respirant l'hospitalité, les a accueillis avec un sourire. Pour marquer l'occasion, les airs de Kimigayo ont résonné dans les airs, gracieuseté de l'orchestre de l'armée soviétique.\n\nLa toile de fond de cette visite est soulignée par les complexités diplomatiques des communications antérieures de Hatoyama avec les dirigeants soviétiques. Il a envoyé une lettre personnelle au Premier ministre soviétique, dans laquelle il a exposé sa politique de base pour les négociations à venir, qui consistait à laisser de côté la question territoriale pour de futures négociations, à mettre fin à l'état de guerre, à échanger des ambassadeurs, à rapatrier les prisonniers de guerre japonais détenus en URSS, à soutenir l'adhésion du Japon aux Nations Unies et à promulguer officiellement l'accord de pêche. Malgré l'acceptation initiale des conditions de Hatoyama par les Soviétiques, des inquiétudes persistaient concernant la question territoriale. Par conséquent, Hatoyama a réaffecté Shunichi Matsumoto pour obtenir un engagement ferme dans les futures négociations sur les questions territoriales. Matsumoto a rencontré Andrei Gromyko, vice-ministre soviétique des Affaires étrangères, et lui a remis une lettre demandant un engagement ferme à poursuivre les négociations. Gromyko a répondu dans une lettre : \"Nous convenons de poursuivre les négociations concernant la conclusion d'un traité de paix, y compris les questions territoriales, après la reprise des relations diplomatiques normales entre les deux pays.\"\n\nDe retour à l'heure actuelle, alors que les négociations devraient commencer dans quelques jours, le décor est planté pour que le ministre Kono s'engage dans des consultations préliminaires avec le secrétaire [SOV.GetLeader], ouvrant la voie au Premier ministre Hatoyama pour finaliser le dialogue diplomatique avec le Premier ministre soviétique. Espérons que cette fois, un accord soit finalement trouvé entre les deux pays."
 jap_hatoyama.37.a: "Faites de votre mieux, Hatoyama-san !"
 jap_hatoyama.37.b: "Espérons qu'ils ne gâcheront pas les choses cette fois-ci."
 jap_hatoyama.39.t: "[GetNewspaperHeader]Les combats se terminent sur l'île natale !"
 jap_hatoyama.39.d: "Après le débarquement soviétique sur les îles japonaises, une série de batailles intenses et sporadiques éclatèrent, conduisant finalement à la capitulation officielle du Japon face à l'avancée de l'armée soviétique.\n\nL'empereur Hirohito, qui avait été épargné par le commandement suprême des puissances alliées dans les années 1940 en raison de son rôle symbolique dans la culture japonaise, fait désormais face à un nouveau procès. Dans un geste historique, Hirohito a été contraint d'abdiquer le trône et de céder le pouvoir à son fils aîné, Akihito. Akihito a été nommé président de la Diète nationale nouvellement créée.\n\nPour superviser la transition et l'administration des territoires occupés par le Japon, le commandant soviétique Konstantin Rokossovsky a été désigné comme administrateur par intérim. Son rôle consistera à gérer la région jusqu'à ce qu'une nouvelle constitution soit rédigée, établissant un cadre de gouvernance qui reflète les idéaux du nouveau paysage politique japonais."
 jap_hatoyama.39.a: "Un autre allié américain est tombé..."
 jap_hatoyama.40.t: "[GetNewspaperHeader]Nouvelle Constitution du Japon"
 jap_hatoyama.40.d: "Après la défaite du Japon, l'Union soviétique a chargé le Parti communiste japonais de commencer à rédiger une nouvelle Constitution. Le jour est finalement arrivé où le Parti communiste japonais a fusionné avec la faction de gauche du Parti socialiste japonais, formant un nouveau parti appelé Parti paysan et ouvrier japonais. Comme le prévoit la nouvelle Constitution, ce parti est devenu le seul parti légal et la force directrice de la nation.\n\nLes États-Unis et d'autres alliés de l'OTAN ont condamné cette évolution, la considérant comme un acte de l'impérialisme du Japon. Le président américain a exprimé son choc et sa colère à l'idée que le Japon devienne un autre État fantoche de l'Union soviétique.\n\nKenji Miyamoto a été élu nouveau président du parti et, par conséquent, Premier ministre du Japon. Pendant ce temps, le prince Akihito, fils de l'ancien empereur Hirohito, a été nommé président du Japon."
 jap_hatoyama.40.a: "Le Soleil Rouge s'est levé."
 jap_hatoyama.41.t: "Une paix humiliante"
 jap_hatoyama.41.d: "L'avancée soviétique et l'effondrement du front des Home Islands ont placé Tokyo dans une position impossible. Les ministres se disputent âprement pour savoir si le gouvernement doit accepter l'humiliation, mettre fin aux combats et préserver ce qui reste de la nation, ou poursuivre une lutte désespérée au coût catastrophique.\n\nToute décision de rechercher la paix aux conditions soviétiques provoquerait l'indignation de Washington et de ceux qui croient encore que le Japon ne doit jamais céder devant Moscou. Pourtant, alors que le pays est épuisé et que la situation de guerre est irréparable, le gouvernement doit désormais choisir entre la survie nationale et la honte politique."
 jap_hatoyama.41.a: "Acceptez la paix amère."
 jap_hatoyama.41.b: "Nous ne céderons pas."
 jap_hatoyama.42.t: "[GetNewspaperHeader]Le Japon accepte les conditions de paix soviétiques"
 jap_hatoyama.42.d: "Après d'âpres débats internes et un effondrement militaire sur les îles japonaises, le gouvernement japonais a accepté de mettre fin aux hostilités et d'accepter la paix avec l'Union soviétique. Cette décision a stupéfié la communauté internationale et provoqué une onde de choc à Washington, où les responsables considèrent l'accord comme une grave défaite stratégique en Asie de l'Est.\n\nPour le Japon, la guerre est terminée, mais les conséquences de cette paix façonneront l'avenir du pays pour les années à venir."
 jap_hatoyama.42.a: "Une fin sombre."

 jap_kishi.11.t: "Formation de l'Anpo Kokumin Kaigi"
 jap_kishi.11.d: "Alors que le Premier ministre Kishi cherche à établir un nouveau traité de sécurité entre le Japon et les États-Unis, la politique nationale est pleine de tensions. Toutefois, les événements récents ont considérablement accru l'incertitude. À la suite de la tentative ratée de Kishi de faire adopter en force le projet de loi sur les devoirs de la police, sa crédibilité s'est effondrée, ternissant sa réputation de leader. Le public le considère désormais avec méfiance et ses actions lui rappellent des souvenirs désagréables de l'autoritarisme d'avant-guerre.\n\nCela a renforcé les mouvements d'opposition et a abouti à la formation d'Anpo Joyaku Kaitei Soshi Kokumin Kaigi (en abrégé Anpo Kokumin Kaigi). Il s'agit d'une coalition mixte de 134 organisations de gauche, comprenant des militants antinucléaires, des militants de Zengakuren, des militants de base anti-américains, des partis socialistes et communistes, des syndicats, des groupes de femmes, et bien plus encore. Cette organisation nationale vise à organiser diverses « actions nationales » à l'échelle nationale pour soulever les masses contre les propositions de Kishi, où ses organisations membres coopéreraient pour mener des activités de protestation.\n\nL'Anpo Kokumin Kaigi ne cherche pas à négocier, mais à mettre fin au traité de sécurité. Malgré les intentions de Kishi de présenter un traité de sécurité révisé et amélioré pour plaire au public, les agitateurs de gauche restent obstinés dans leur demande d'y mettre fin complètement. Alors que les tensions s'intensifient et que le fossé entre le gouvernement et l'opposition se creuse, notre pays se trouve à la croisée des chemins, où des événements pourraient éventuellement conduire aux plus grands troubles politiques de l'histoire de notre pays jusqu'à présent."
 jap_kishi.11.a: "Les choses ne feront que faire boule de neige à partir d'ici."
 jap_kishi.12.t: "Détails publiés du nouveau traité de sécurité"
 jap_kishi.12.d: "Suite aux efforts de collaboration entre le président [USA.GetLeader] et le Premier ministre [JAP.GetLeader] au cours de l'année écoulée, les amendements au Traité de sécurité de 1951 entre le Japon et les États-Unis ont été finalisés et les détails sont désormais rendus publics.\n\nDans le Traité de sécurité révisé entre le Japon et les États-Unis, une poignée de changements importants ont été mis en oeuvre. Premièrement, il établit l'engagement des deux pays à donner la priorité à la résolution pacifique des différends internationaux, en mettant particulièrement l'accent sur l'ONU en tant que principale instance chargée de faire face à l'agression. Deuxièmement, le traité révisé lève une ambiguïté de longue date en déclarant explicitement que les États-Unis prendront la défense du Japon en cas d'attaque par un tiers. En outre, il exige que les États-Unis engagent des consultations avec le Japon concernant le déploiement de leurs troupes sur le sol japonais, et déclare que le gouvernement japonais doit être consulté avant des changements significatifs dans le déploiement des forces américaines au Japon ou l'utilisation de bases japonaises pour des opérations de combat non défensives. De plus, le traité délimite les juridictions respectives des deux pays concernant les crimes commis au Japon par le personnel militaire américain.\n\nMalgré les améliorations considérables du nouveau traité par rapport à la version originale signée en 1951, l'Anpo Kokumin Kaigi persiste dans sa résistance, poussé par le ressentiment de longue date des agitateurs de gauche contre la présence de bases américaines sur le sol japonais. Au lieu d'accepter le traité révisé, l'organisation continue de plaider en faveur de son abolition totale."
 jap_kishi.12.a: "Ils sont trop exigeants, le nouveau traité ne sera pas rejeté !"
 jap_kishi.12.b: "Nous ne pouvons que souhaiter le meilleur à nos alliés."
 jap_kishi.13.t: "Anpo Hihan no Kai"
 jap_kishi.13.d: "Suite à la publication des détails du nouveau traité de sécurité, le mouvement national est entré dans une nouvelle phase, recueillant progressivement un soutien public accru. Ainsi, environ 1 000 bunkajin (gens de la culture) - un assortiment mixte d'intellectuels, d'artistes, d'écrivains, d'interprètes et de critiques culturels - se sont rassemblés au parc Hibiya et ont fondé l'Anpo Hihan no Kai, se faisant appeler « Société de critique du traité de sécurité ». Opérant sous cette bannière, ils se sont alignés sur le mouvement en cours contre le traité de sécurité, en participant à des manifestations pacifiques dans les rues, collaborant parfois avec l'Anpo Kokumin Kaigi."
 jap_kishi.13.a: "Le sentiment anti-traité ne cesse de se propager."
 jap_kishi.14.t: "[GetNewspaperHeader]Anpo Kokumin Kaigi 8e Action unie"
 jap_kishi.14.d: "Aujourd'hui, l'Anpo Kokumin Kaigi a organisé sa « Huitième Action unie » devant l'enceinte de la Diète nationale, dans le but d'une manifestation pacifique et ordonnée. Cependant, un groupe de radicaux de la faction dominante du Zengakuren, accompagnés de syndicalistes militants alliés, ont pénétré dans l'enceinte de la Diète nationale, surmontant une ligne de garde composée de 5 000 policiers. Dans l'enceinte, ils ont scandé des chants de protestation et se sont livrés à des danses du serpent pendant plusieurs heures avant de se disperser pacifiquement. Environ 26 500 manifestants y ont participé. Cette intrusion dans la Diète nationale a suscité une condamnation généralisée, notamment de la part de factions au sein de l'Anpo Kokumin Kaigi. Cependant, il a également efficacement attiré l'attention sur le mouvement anti-traité, dynamisant des groupes de gauche auparavant inactifs."
 jap_kishi.14.a: "Scandaleux."
 jap_kishi.15.t: "Arrestation de Takeo Shimizu"
 jap_kishi.15.d: "En tant que secrétaire en chef du Zengakuren, avec le soutien des radicaux de la faction dominante, Takeo Shimizu a été un coordinateur clé dans l'orchestration du raid sur le terrain de la Diète nationale le 27 novembre. Pour échapper à son arrestation, il s'était réfugié dans les dortoirs du Collège d'enseignement général du campus de Komaba de l'Université de Tokyo depuis le mois dernier. Aujourd'hui marquait la « Neuvième Action Unie » d'Anpo Kokumin Kaigi, incitant Shimizu à quitter l'Université de Tokyo avec 1 000 étudiants pour rejoindre le rassemblement de Zengakuren à Hibiya. Cependant, ils se sont heurtés à l'opposition de la police sur leur route, ce qui a entraîné un affrontement entre les partisans de Shimizu et les forces de l'ordre. Après la bagarre, Shimizu a finalement été arrêté et placé en garde à vue.\n\nPendant ce temps, à Osaka, les étudiants de l'Université de la ville d'Osaka ont organisé une grève dans le cadre de la Neuvième Action unie."
 jap_kishi.15.a: "Il a eu ce qu'il méritait."
 jap_kishi.16.t: "Troubles à l'aéroport de Haneda"
 jap_kishi.16.d: "Le Premier ministre Kishi, le ministre des Affaires étrangères Fujiyama, le ministre des Affaires étrangères Ishii et une délégation de plénipotentiaires ont quitté aujourd'hui l'aéroport de Haneda pour se rendre aux États-Unis pour assister à la cérémonie de signature du nouveau traité de sécurité nippo-américain. Cependant, leur départ s'est heurté à une résistance farouche. Environ 700 radicaux du Zengakuren se sont rassemblés à l'aéroport pour tenter d'empêcher la délégation de partir. Les étudiants ont occupé le hall, sont entrés par effraction dans la cafétéria et ont érigé une barricade. La situation a dégénéré, conduisant à une confrontation avec les forces de l'ordre. Finalement, les autorités ont dégagé la zone, arrêtant ainsi soixante-dix-huit étudiants. Malgré les perturbations, la délégation est repartie comme prévu et le nouveau traité de sécurité sera signé le 19."
 jap_kishi.16.a: "Nous espérons une visite fructueuse."
 jap_kishi.17.t: "[GetNewspaperHeader]Signature du nouveau traité de sécurité nippo-américain"
 jap_kishi.17.d: "Après environ deux ans de négociations, le nouveau traité de sécurité nippo-américain a finalement été signé lors d'une cérémonie organisée dans la salle Est de la Maison Blanche, en présence du président [USA.GetLeader] et du Premier ministre Nobusuke Kishi. Le traité constitue une amélioration significative du point de vue japonais, dans la mesure où il engage les États-Unis à défendre le Japon en cas d'attaque, exige des consultations préalables avant d'envoyer des forces américaines à l'étranger, supprime la clause relative à la répression des troubles intérieurs et précise un terme de 10 ans, après quoi il peut être abrogé avec un préavis d'un an.\n\nCependant, malgré cette amélioration, de nombreux Japonais, notamment ceux de gauche, sont toujours mécontents de la présence de bases militaires américaines sur le sol japonais et espèrent se débarrasser complètement du traité. Avec la signature du traité mais en attente de ratification, ainsi que la visite prévue du président américain au Japon en juin prochain, l'urgence et l'intensité des protestations en cours au Japon n'ont fait qu'augmenter."
 jap_kishi.17.a: "Bonne et mauvaise nouvelle."
 jap_kishi.17.b: "Louable, mais inquiétant aussi."
 jap_kishi.17.c: "Une alliance coûteuse ?"
 jap_kishi.18.t: "[GetNewspaperHeader]La lutte Anpo"
 jap_kishi.18.d: "Avec la signature du nouveau traité de sécurité, les protestations au Japon se sont intensifiées et sont entrées dans une phase significative. L'Anpo Kokumin Kaigi organise davantage d'« actions unies » à l'échelle nationale, tandis que les protestations deviennent plus urgentes compte tenu du temps limité qui s'écoule avant la ratification du traité et la visite du président américain. Les manifestations de militants de gauche dans les grandes villes sont devenues monnaie courante, avec des rassemblements de masse et des protestations devant la Diète nationale et la résidence du Premier ministre. Des affrontements occasionnels entre les radicaux de Zengakuren et la police ajoutent à la tension.\n\nLe monde regarde le Japon faire face à ce qui semble être les plus grandes manifestations de son histoire, plongeant lentement le pays dans l'instabilité politique. Quelle que soit la décision du gouvernement et la manière dont il gère cette épreuve, cela peut avoir des effets significatifs et durables sur l'avenir politique du Japon."
 jap_kishi.18.a: "Il est temps de nous préparer à ce qui va arriver."
 jap_kishi.18.b: "Inquiétant."
 jap_kishi.18.c: "Des temps turbulents."
 jap_kishi.19.t: "L'opposition socialiste monte"
 jap_kishi.19.d: "La date de ratification du nouveau traité de sécurité a été fixée, mais les sessions de la Diète nationale sont devenues un champ de bataille de mots. L'opposition Shakai-to utilise toutes les tactiques dilatoires parlementaires disponibles, dans le but de faire traîner le débat et de donner au mouvement anti-traité plus de temps pour rassembler des soutiens. Leur objectif ultime est de prolonger le débat au-delà de la fin de la session de la Diète en mai, en espérant que cet examen prolongé conduira à des éléments anti-traité et anti-Kishi au sein du Jimin, voire à évincer le Premier ministre Kishi et à mettre le traité de côté.\n\nLa stratégie des socialistes s'est révélée très efficace. Les remises en question astucieuses de la part des dirigeants socialistes ont mis en lumière plusieurs aspects discutables du nouveau traité. Les réponses hargneuses et évasives de Kishi lors de ces séances n'ont pas aidé sa cause ; Au lieu de cela, ils ont incité les médias, auparavant favorables au traité, à soutenir l'appel des socialistes à davantage de discussions. Des points clés tels que la nature de la « consultation préalable » et la définition du terme « Extrême-Orient » restent encore particulièrement vagues et controversés."
 jap_kishi.19.a: "Ils ne font qu'alimenter le feu."
 jap_kishi.20.t: "Manifestations avant le début de la prochaine session de la Diète nationale"
 jap_kishi.20.d: "La date du début de la prochaine session de la Diète nationale approche et les débats seront essentiellement centrés autour du nouveau traité de sécurité. Sur ce, les manifestants anti-traité sont de nouveau descendus dans la rue. La semaine dernière, cinq mille manifestants se sont rassemblés la nuit devant la Diète nationale, agitant des drapeaux rouges et tenant des lanternes en papier. La plupart des manifestants étaient des ouvriers de Sohyo. Récemment, la 13e Action unie a été organisée par l'Anpo Kokumin Kaigi, avec une réunion à la piscine publique d'Ogimachi à Osaka où les dirigeants du mouvement anti-traité ont prononcé des discours passionnés devant la foule. Des manifestations massives ont également eu lieu dans le quartier Minami d'Osaka."
 jap_kishi.20.a: "Une montée effrénée des tensions politiques."
 jap_kishi.21.t: "Comité des mesures spéciales de ratification de l'Anpo"
 jap_kishi.21.d: "Conscient de la menace qui pèse sur son cabinet et sur le traité révisé si la Diète devait se retirer, le Premier ministre Kishi a discrètement élaboré des plans pour garantir l'adoption du traité à tout prix. Après avoir été contrecarré à plusieurs reprises dans ses efforts pour soumettre le traité au vote, notamment en raison de factions peu coopératives au sein de son propre parti, Kishi a créé le comité top-secret « Comité des mesures spéciales de ratification de l'Anpo », plutôt connu sous son surnom « Anpo Tokkotai ». Ce comité est chargé d'élaborer une stratégie pour imposer le traité à la Diète par tous les moyens nécessaires avant la fin de la session en cours."
 jap_kishi.21.a: "Idée imprudente..."
 jap_kishi.22.t: "Anpo Kokumin Kaigi 16e Action unie"
 jap_kishi.22.d: "Aujourd'hui, le pays a de nouveau été témoin d'une vague de protestations importante alors que les manifestants anti-traité ont organisé leur 16e Action unie dans tout le pays, avec une forte présence de militants du Zengakuren. À Tokyo, environ six mille étudiants ont tenté de pénétrer dans les locaux de la Diète nationale. La police, postée à l'entrée principale, a réussi à contrecarrer leur avancée, provoquant d'intenses affrontements. Au milieu du chaos, des étudiants déterminés ont été vus escalader des camions de police pour tenter de franchir les barrières.\n\nPendant ce temps, à Osaka, la faction locale du Zengakuren organisait des activités parallèles. L'Université de la ville d'Osaka a connu une grève totale alors que les étudiants ont appelé à l'abandon des cours en solidarité avec le mouvement national. Un grand rassemblement s'est tenu sur la place Oemae, dans le quartier est, attirant de grandes foules et soulignant leur mécontentement à l'égard des politiques actuelles du traité."
 jap_kishi.22.a: "Leurs tactiques ignobles ne font que se développer."
 jap_kishi.23.t: "Manifestations hors de contrôle et la paranoïa de Kishi au point de rupture"
 jap_kishi.23.d: "Non seulement Tokyo, mais Osaka est également devenue un foyer de troubles alors que les manifestants, frustrés par le traité de sécurité en cours, sont descendus dans les rues lors d'une spectaculaire procession aux lanternes la nuit dernière. Des chants de « Stop Anpo ! » » a fait écho dans le centre-ville, signalant un mécontentement généralisé. Aujourd'hui, les protestations se sont intensifiées alors que la faction Zengakuren d'Osaka a saisi l'occasion pour exprimer son mécontentement. La hausse du prix des tickets de métro a fourni un prétexte idéal pour les manifestations, alimentées principalement par l'opposition au traité de sécurité.\n\nLa vague de protestations ne s'est pas limitée à Tokyo et Osaka. Les grandes villes du pays connaissent des bouleversements similaires. La situation s'est aggravée au point que jusqu'à dix millions de lettres de pétition dénonçant le traité de sécurité ont été livrées au parloir de la Chambre des représentants.\n\nPendant ce temps, la paranoïa du Premier ministre Kishi devient de plus en plus évidente, et il ne serait pas surprenant que la pression croissante le pousse à prendre une décision imprudente..."
 jap_kishi.23.a: "Nous nous trouvons à un point critique."
 jap_kishi.24.t: "Incident du 19 mai"
 jap_kishi.24.d: "Alors que la session de la Diète nationale touche à sa fin et que la visite du président [USA.GetLeader]est prévue pour le 19 juin, le Premier ministre Kishi a mis en oeuvre son plan imprudent. Ce matin, dans une \"attaque sournoise\", les législateurs de Jimin-to ont brusquement prolongé la session de la Diète de cinquante jours. En représailles, les députés de l'opposition Shakai-to ont organisé un sit-in, empêchant le président de la Chambre, Ichiro Kiyose, de convoquer un vote. Pendant ce temps, plusieurs milliers de manifestants anti-traité se sont rapidement rassemblés devant le bâtiment de la Diète nationale.\n\nIgnorant les appels de Kiyose à cesser leurs perturbations, les législateurs de Shakai-to ont dû faire face à l'arrivée de 500 policiers. La nation a regardé sous le choc à la télévision NHK les policiers expulser de force chaque député socialiste du bâtiment et les députés Jimin, sans opposition, adoptant rapidement la motion de prolongation de la session. Cependant, « l'attaque sournoise » de Kishi s'est poursuivie alors que le président de la Chambre a également appelé de manière inattendue à un vote sur le nouveau traité de sécurité. Dans une image saisissante, les caméras de la NHK ont filmé les membres de Jimin-to levant la main, puis ont effectué un panoramique spectaculaire pour montrer les sièges vides de l'opposition."
 jap_kishi.24.a: "Cela valait-il vraiment le coup de violer nos valeurs démocratiques... ?"
 jap_kishi.24.b: "Épouvantable."
 jap_kishi.25.t: "Les sentiments anti-américains grandissent parmi les manifestants de l'Anpo"
 jap_kishi.25.d: "Tout le monde s'attendait à ce que Kishi tente de prolonger la session de la Diète, mais rares sont ceux, même au sein de son propre parti, qui ont réalisé qu'il envisageait également de ratifier le traité simultanément. Il s'agissait d'une manoeuvre astucieuse car, selon les règles de la Diète de l'époque, tout traité adopté par la chambre basse serait automatiquement approuvé après trente jours, même sans action de la chambre haute, tant que la Diète restait en session pendant cette période.\n\nEn faisant passer le traité par la chambre basse ce jour-là, Kishi a assuré qu'il serait automatiquement ratifié le 19 juin, juste à temps pour l'arrivée du président [USA.GetLeader]au Japon ce jour-là. Cependant, cette manoeuvre était peut-être trop intelligente. Cela a donné l'impression que Kishi rampait devant le président américain et a étroitement lié le sort du traité et les protestations qui en découlent à la visite des [USA.GetLeader], qui n'avait pas été considérée auparavant comme particulièrement liée à la ratification du traité.\n\nPar conséquent, ce timing n'a fait que garantir que les manifestations prendraient désormais un ton anti-américain plus fort qu'elles ne l'étaient auparavant."
 jap_kishi.25.a: "Un résultat malheureux de décisions insensées..."
 jap_kishi.26.t: "Les médias et le Zaikai font pression sur Kishi"
 jap_kishi.26.d: "Avec la mise en lumière de l'histoire politique du Premier ministre Kishi - en particulier son rôle dans le cabinet Tojo au plus fort de la guerre du Pacifique, ses tentatives pour briser le Nikkyoso, sympathisant de gauche, son désir de réviser l'article 9 et sa tristement célèbre mauvaise gestion du projet de loi sur les devoirs de la police - l'opposition a facilement présenté son projet de révision du traité de sécurité comme un « plan diabolique » visant à remilitariser le Japon et à revenir au système d'avant-guerre. Cette image n'a été que renforcée par le récent incident du 19 mai.\n\nAvec cela, les médias se sont complètement retournés contre lui, même des journaux conservateurs comme Nihon Keizai Shimbun et Sankei Shimbun appelant à la démission massive du cabinet Kishi. La communauté des affaires du pays, connue sous le nom de zaikai, est également de plus en plus préoccupée par les troubles politiques actuels, qui menacent de nuire gravement aux affaires et au commerce international du Japon, poussant ainsi Kishi à démissionner."
 jap_kishi.26.a: "Comment un homme peut-il être si têtu ?"
 jap_kishi.27.t: "Conflit anti-Kishi au sein du Jimin-to"
 jap_kishi.27.d: "Suite aux actions imprudentes et secrètes de Kishi lors de l'incident du 19 mai, les critiques et l'opposition ont également pris racine au sein du Jimin-to. Les membres du parti anti-mainstream pensaient que seule la prolongation de la session de la Diète serait votée. Cependant, ils ignoraient que Kishi manoeuvrerait également pour faire voter le nouveau traité de sécurité, les gardant ainsi dans l'ignorance.\n\nLors du vote, 27 législateurs Jimin-to, dont des chefs de faction tels que Tanzan Ishibashi, Kenzo Matsumura, Ichiro Kono et Takeo Miki, ont boycotté le vote en signe de protestation. Ces factions, nourrissant désormais des sentiments anti-Kishi, exigent publiquement la démission de Kishi. Kono dirige principalement ce mouvement et a menacé de quitter le parti avec ses alliés si la situation se détériorait encore. Avec des membres anti-mainstream sympathisants avec l'opposition, le parti risque de se disloquer si les problèmes ne sont pas résolus dans les semaines à venir."
 jap_kishi.27.a: "Les fissures continuent de s'étendre."
 jap_kishi.29.t: "[GetNewspaperHeader]Manifestations massives à l'échelle nationale au Japon"
 jap_kishi.29.d: "Depuis l'incident du 19 mai, les protestations en cours au Japon ont atteint leur apogée, entrant dans leur phase la plus importante à ce jour. Aujourd'hui, le pays a connu ses plus grandes manifestations à ce jour, alors que 175 000 manifestants ont soudainement envahi la zone située devant le bâtiment de la Diète nationale comme un tsunami, tandis que la police barricadait la porte principale pour les empêcher d'entrer dans les locaux.\n\nD'autres grandes villes que Tokyo, comme Osaka, ont également été confrontées à d'intenses protestations. Les manifestants anti-traité, soutenus par le Syndicat des travailleurs d'Osaka, sont descendus dans les rues et se sont rassemblés devant le bureau du gouvernement préfectoral, exprimant leur mécontentement.\n\nLe mouvement anti-traité de sécurité intègre désormais des sentiments anti-Kishi, cherchant non seulement à empêcher la ratification du traité, mais également à obtenir la démission du Premier ministre Kishi, dont les récentes actions sont considérées comme antidémocratiques et rappelant l'autoritarisme d'avant-guerre."
 jap_kishi.29.a: "Les choses nous échappent vraiment !"
 jap_kishi.29.b: "Concernant."
 jap_kishi.30.t: "Sohyo appelle à une grève générale"
 jap_kishi.30.d: "Les Sohyo ont appelé à une grève nationale massive qui a paralysé le pays. Un chiffre stupéfiant de 5,6 millions de personnes, dont 76 syndicats, 4,6 millions de travailleurs, 1 million d'étudiants et diverses organisations démocratiques et petits entrepreneurs, se sont unis pour exiger l'empêchement de la ratification du traité de sécurité et la démission du Premier ministre Kishi. Le « Comité de grève 6.4 », force motrice derrière cette grève sans précédent, a exécuté son plan avec précision. Dès les premières lueurs de l'aube jusqu'à 7 heures du matin, 35 000 syndicalistes et étudiants ont réussi à paralyser 15 sections de la voie ferrée de l'Est et des sections de locomotives d'Oku et de Shinagawa, laissant l'horaire des trains dans un désarroi complet. Au dépôt ferroviaire de Kamata, une ligne de piquetage d'environ 200 personnes a interrompu l'inspection du premier train, entraînant l'arrêt complet de 39 trains.\n\nAlors que le mouvement anti-traité atteint son apogée, le Sohyo s'est engagé à organiser davantage de grèves dans les prochains jours."
 jap_kishi.30.a: "Un incendie de forêt qui fait rage et ne peut être éteint."
 jap_kishi.31.t: "[GetNewspaperHeader]Incident de Hagerty"
 jap_kishi.31.d: "Aujourd'hui, une crise diplomatique majeure a éclaté entre les États-Unis et le Japon, jetant une ombre sur la visite prévue du président [USA.GetLeader] plus tard ce mois-ci. L'incident s'est produit lorsque James Hagerty, le secrétaire de presse de la Maison Blanche, est arrivé à l'aéroport Haneda de Tokyo pour préparer la prochaine visite du président. Alors que Hagerty était escorté depuis l'aéroport dans une voiture noire conduite par l'ambassadeur américain au Japon, le véhicule a été encerclé par environ 6 000 manifestants japonais.\n\nLes manifestants, dans le cadre du mouvement anti-traité en cours, ont assiégé la voiture, la secouant violemment pendant plus d'une heure. Les vitres ont été fêlées, les feux arrière brisés et les manifestants sont montés sur le toit, scandant des slogans anti-américains et entonnant des chants de protestation. La situation tendue n'a pris fin que lorsqu'un hélicoptère militaire des Marines américains est arrivé pour transporter Hagerty et l'ambassadeur en lieu sûr, un sauvetage dramatique capturé par les agences de presse et diffusé dans le monde entier.\n\nL'incident a stupéfié la nation japonaise, jetant le doute sur la sécurité de la visite du président américain. Le Premier ministre Kishi cherche désormais de toute urgence à prendre des mesures pour garantir la sécurité du président dans un contexte d'escalade des protestations."
 jap_kishi.31.a: "C'est honteux..."
 jap_kishi.31.b: "Scandaleux !"
 jap_kishi.31.c: "Une tourmente incontrôlable à portée de main."
 jap_kishi.33.t: "[GetNewspaperHeader]Incident du 15 juin"
 jap_kishi.33.d: "Aujourd'hui, le Japon a été secoué par une scène stupéfiante alors que les citoyens écoutaient leurs radios et leurs télévisions. Dans le cadre de la 24e Action unie d'Anpo Kokumin Kaigi, des centaines de milliers de manifestants se sont rendus à la Diète nationale à Tokyo, exprimant leur opposition au traité de sécurité controversé.\n\nEn fin d'après-midi, la manifestation a pris une tournure violente lorsque des contre-manifestants ultranationalistes de droite ont attaqué, percutant la foule avec des camions et les attaquant avec des bâtons de bois hérissés de clous. Cet affrontement brutal a fait des dizaines de blessés, allant de modérés à graves, et plusieurs victimes ont été transportées à l'hôpital. Au milieu du chaos, des militants de gauche radicale du Zengakuren ont pénétré de force dans l'enceinte de la Diète, provoquant une violente confrontation avec la police. Les étudiants non armés ont été accueillis à coups de matraque et les violences qui ont suivi ont été retransmises en direct, choquant la nation.\n\nLe Japon est désormais confronté aux pires troubles politiques. Le Premier ministre Kishi subit une immense pression pour qu'il démissionne alors qu'il est aux prises avec la prochaine visite du président américain. L'avenir de la politique japonaise est en jeu tandis que la nation regarde avec impatience."
 jap_kishi.33.a: "Nous avons atteint un plus bas historique."
 jap_kishi.33.b: "Étonnant."
 jap_kishi.34.t: "Hier, la prise de la Diète nationale"
 jap_kishi.34.d: "L'incident d'hier a commencé avec la deuxième grève générale nationale de Sohyo, dans le cadre de la 24e Action unie, impliquant 6,4 millions de travailleurs et fermant 30 000 magasins, dont 8 000 à Tokyo. Une journée de protestation massive a eu lieu à la Diète, mais celle-ci est devenue violente. Les étudiants de Zengakuren, déterminés à envahir le terrain de la Diète, commencèrent à se rassembler devant la porte principale en milieu d'après-midi. Ils l'ont trouvé lourdement fortifié par des barricades et 5 000 policiers.\n\nPendant ce temps, environ 1 000 artistes, écrivains et critiques d'Anpo Hihan no Kai ont défilé du parc Hibiya vers la Diète. À 17h15, alors qu'ils présentaient des pétitions aux membres du Shakai-to Diet, des contre-manifestants de droite de l'Ishin Kodo Tai les ont attaqués. Les membres de la Modern Drama Association ont été visés par des poteaux en bois incrustés de clous et par deux camions percutant leur colonne. Quatre-vingts personnes ont été blessées, dont onze hospitalisées, et un acteur souffre d'une perte auditive permanente.\n\nQuelques minutes plus tard, des étudiants radicaux ont franchi la porte sud et ont envahi la Diète. La police s'est retirée, permettant aux étudiants de prononcer des discours et de chanter des chansons pendant plus d'une heure. Après 19 heures, la police a riposté, repoussant les étudiants, entraînant la mort piétinée de Kanba Michiko, étudiant de premier cycle à l'Université de Tokyo. Sa mort a mis les étudiants en colère, conduisant à de violents combats à la porte principale.\n\nA 1h du matin, la police a reçu l'ordre d'évacuer tous les manifestants. À 1 h 15 du matin, ils ont attaqué des étudiants, des professeurs et des journalistes avec des matraques et des gaz lacrymogènes, tandis que les caméras montraient les corps inconscients et ensanglantés des étudiants transportés vers des ambulances. L'enceinte de la Diète était jonchée de pierres, de chaussures, de pancartes brisées, de mares de sang et de dix-huit wagons à riz détruits.\n\nC'est un incident qui laissera une marque inoubliable pour les années à venir."
 jap_kishi.34.a: "Une atteinte à notre stabilité nationale..."
 jap_kishi.35.t: "Mort de Michiko Kanba"
 jap_kishi.35.d: "L'incident du 15 juin a secoué la nation tout entière, mais le résultat le plus tragique a été la mort de Michiko Kanba, militante de Zengakuren et étudiante de premier cycle à l'Université de Tokyo. Kanba est mort dans les affrontements alors que le chaos s'intensifiait.\n\nMichiko Kanba est née à Musashino, Tokyo, dans une famille d'érudits ; son père était sociologue et professeur à l'Université de Chuo. Elle a fréquenté le lycée d'Ashiya, Hyogo, et après avoir obtenu son diplôme, est retournée à Tokyo pour ses études supérieures. Là, elle rejoint le Kyosan-to et le Zengakuren, devenant militante et participant au mouvement anti-traité en tant que secrétaire générale de la faction de la ligue communiste du Zengakuren. Elle faisait partie des 78 étudiants arrêtés lors de l'occupation du hall de l'aéroport de Haneda en janvier. Aux côtés de ses collègues militants traditionnels de Zengakuren, elle a également participé à plusieurs tentatives d'intrusion dans la Diète et dans la résidence officielle du Premier ministre.\n\nCependant, lors de l'incident du 15 juin, lorsque la police a riposté après que des étudiants ont occupé les locaux de la Diète pendant une période prolongée, elle est décédée des suites de graves blessures subies lors des affrontements. Les circonstances exactes de sa mort restent controversées : la police affirme qu'elle a été renversée et piétinée à mort, tandis que les étudiants imputent sa mort aux agressions physiques perpétrées par des policiers.\n\nNéanmoins, sa mort a choqué la nation et a fait l'objet d'une large couverture médiatique. Cela est considéré comme une « triple tragédie » : elle était jeune, étudiante dans une université d'élite et femme. Sa mort a rappelé les nombreuses jeunes vies perdues pendant la Seconde Guerre mondiale, et son héritage, ainsi que la sympathie pour sa cause, continueront d'être importants dans les années qui suivront."
 jap_kishi.35.a: "Tragique."
 jap_kishi.36.t: "Kishi annonce sa démission"
 jap_kishi.36.d: "Après l'incident du 15 juin, le Premier ministre Kishi a d'abord refusé de démissionner, s'affirmant comme la voix de la « majorité silencieuse ». Convaincu que la majorité de la population soutenait silencieusement le nouveau traité, sa conviction était en partie vraie, dans la mesure où l'ensemble de la population japonaise n'est pas descendue dans la rue pour protester.\n\nNéanmoins, la sécurité de la prochaine visite de [USA.GetLeader]reste incertaine. Bien que Kishi ait envisagé de déployer les JSDF pour sécuriser les rues, il a été dissuadé de prendre une mesure aussi drastique. Sans le soutien de deux personnalités clés, le chef de l'Agence de défense Akagi Munemori et le chef de la police nationale Kashiwamura Nobuo, Kishi a annoncé la démission massive de l'ensemble de son cabinet.\n\nLa démission serait effective le mois prochain, après quoi le nouveau Premier ministre prêterait serment."
 jap_kishi.36.a: "Une issue inévitable."
 jap_kishi.37.t: "Les médias critiquent l'Anpo Kokumin Kaigi"
 jap_kishi.37.d: "Après des semaines de critiques incessantes visant le cabinet Kishi, les grands médias ont désormais adopté une position décisive contre le mouvement de protestation. Dans un effort coordonné, les sept principaux journaux de Tokyo - Asahi, Yomiuri, Mainichi, Sankei, Nihon Keizai, Tokyo et Tokyo Times - ont publié conjointement une déclaration cinglante intitulée « Éradiquer la violence, préserver la démocratie parlementaire ». Cette déclaration, soutenue par quarante-huit journaux à travers le pays, impute la responsabilité de la crise actuelle non seulement à l'administration Kishi mais aussi aux manifestants eux-mêmes.\n\nEn outre, les voix influentes des grandes entreprises se sont prononcées contre les troubles. Les quatre organisations les plus importantes du monde des affaires - Keidanren, Nikkeiren, Keizai Doyukai et la Chambre de commerce du Japon - se sont unies pour publier exactement la même déclaration reflétant les sentiments des médias."
 jap_kishi.37.a: "Bien dit."
 jap_kishi.38.t: "[GetNewspaperHeader]Ratification du traité de sécurité nippo-américain"
 jap_kishi.38.d: "Les manifestants anti-traité sont restés perplexes et déçus alors que le nouveau traité de sécurité entre le Japon et les États-Unis a été officiellement ratifié et entré en vigueur. Malgré leur mouvement énergique et à grande échelle, ils ne purent empêcher la signature du traité.\n\nHier, la veille de la ratification, l'Anpo Kokumin Kaigi a désespérément organisé son action unie et le Sohyo a organisé une autre grève nationale. Cette protestation combinée a impliqué plus de six millions de personnes dans tout le pays, mais même cet effort massif n'a pas suffi à empêcher la ratification du traité. Les instruments de ratification ont dû passer clandestinement dans une bonbonnière pour éviter d'être repérés par les manifestants qui envahissaient la résidence du ministère des Affaires étrangères. Les instruments ont été signés par Aiichiro Fujiyama, du ministère des Affaires étrangères, et par l'ambassadeur des États-Unis au Japon, Douglas MacArthur II.\n\nBien que le mouvement anti-traité ait réussi à provoquer des perturbations significatives, y compris l'annulation de la visite du président Eisenhower en raison des problèmes de sécurité soulevés par l'incident du 15 juin, ils n'ont finalement pas pu atteindre leur objectif principal, à savoir mettre un terme au traité."
 jap_kishi.38.a: "Les jours de colère et de crise touchent à leur fin."
 jap_kishi.38.b: "Une victoire durement gagnée."
 jap_kishi.39.t: "[GetNewspaperHeader]Démission du Premier ministre Kishi et tentative d'assassinat"
 jap_kishi.39.d: "Aujourd'hui, la démission de Nobusuke Kishi est devenue effective, suite à son annonce le mois dernier à la suite de l'incident du 15 juin. Cependant, alors que Kishi se rendait à une garden-party célébrant l'accession de Hayato Ikeda au poste de Premier ministre du Japon, il a été attaqué par Taisuke Aramaki, un chômeur de 65 ans affilié à divers groupes d'extrême droite. Aramaki, brandissant un couteau, a poignardé Kishi six fois à la cuisse. Bien que Kishi ait saigné abondamment, les coups de couteau ont manqué des artères principales. Il a été transporté d'urgence dans un hôpital voisin où il a reçu une trentaine de points de suture sur ses blessures, survivant finalement à la tentative d'assassinat.\n\nSelon l'interrogatoire de la police, Aramaki n'a jusqu'à présent pas révélé ses motivations, mais a affirmé qu'il avait uniquement l'intention de « blesser gravement » Kishi, niant toute intention de le tuer."
 jap_kishi.39.a: "Notre politique ne peut pas être plus ridicule..."
 jap_kishi.39.b: "Choquant."
 jap_kishi.40.t: "Le mouvement Anpo Kokumin Kaigi s'éteint"
 jap_kishi.40.d: "Malgré les manifestations à grande échelle qui ont éclaté de manière inattendue au cours du premier semestre de cette année, le mouvement anti-traité a largement perdu de son élan. Le traité étant désormais ratifié et Nobusuke Kishi ayant démissionné de ses fonctions, il ne semble pas nécessaire que le mouvement se poursuive. Les seuls signes restants de ce mouvement sont des manifestations à petite échelle du Zengakuren et des grèves mineures de divers syndicats.\n\nAvec la fin des pires troubles politiques et des plus grandes manifestations de l'histoire de notre pays, le Japon regarde désormais vers l'avenir sous la direction enthousiaste de Hayato Ikeda. Son objectif est de déplacer notre attention nationale de la politique vers la prospérité économique. Bien que la tristement célèbre lutte Anpo ait enfin pris fin, son héritage devrait influencer la décennie à venir et au-delà."
 jap_kishi.40.a: "La fin d'une malheureuse crise."


### Country Super Events ######################################
 JAP_BIG_EVENT_QUOTE: "[JAP_Big_Event_Quote_Loc]"
 JAP_Big_Event_Hatoyama_Quote: "En commençant par les « nouveaux amis », ils deviennent les « meilleurs amis », puis les « vrais amis » et enfin les « amis de coeur ».\n-Ichiro Hatoyama"
 JAP_Big_Event_LDP_Formation_Quote: "La politique appartient au peuple et notre devoir est de stabiliser les moyens de subsistance du peuple, de promouvoir le bien-être public et de restaurer le droit à l'autonomie et à l'indépendance vis-à-vis du monde extérieur.\n-Déclaration du parti de Jimin-to"
 JAP_Big_Event_Independence_Quote: "La fleur qui fleurit dans l'adversité est la plus rare et la plus belle de toutes.\n-L'empereur Meiji"


### OLD Events ######################################
 jap_genelec_a.1.t: "annonce des 25e élections générales"
 jap_genelec_a.1.d: "Le gouvernement a déclaré la tenue prochaine des 25èmes élections générales, marquant un moment historique alors que le pays se prépare à son premier exercice électoral après la fin de l'occupation alliée, ainsi qu'en vertu de la nouvelle loi sur les élections aux fonctions publiques. Adoptée en 1950, cette loi constitue une consolidation essentielle de l'ancienne loi électorale de la Chambre des représentants et de l'ancienne loi électorale de la Chambre des conseillers. Sa mise en oeuvre introduit un système complet d'élection publique des dirigeants des gouvernements locaux et des commissaires à l'éducation.\n\nL'un des développements significatifs menant à cette étape électorale est la levée des interdictions frappant certains membres de fonctions publiques, résultat de l'application du Traité de paix de San Francisco. Ce changement monumental a ouvert l'arène politique à un groupe de politiciens expérimentés qui n'avaient auparavant pas le droit de briguer des fonctions publiques. À la suite de ce changement de politique, un nombre important de ces personnes ont choisi de se présenter aux élections, marquant ainsi leur retour sur le devant de la scène politique nationale."
 jap_genelec_a.1.a: "Faisons de notre mieux !"
 jap_genelec_b.1.t: "[GetNewspaperHeader]résultats des 25èmes élections générales"
 jap_genelec_b.1.d: "À la suite des 25èmes élections générales japonaises, le parti conservateur Jiyu-to est sorti vainqueur écrasant, consolidant ainsi sa domination sur la politique japonaise. Shigeru Yoshida, l'influent conservateur Honryu et défenseur des politiques pro-américaines, reste à la barre en tant que Premier ministre, prolongeant son mandat face à un mandat retentissant. La Chambre des représentants reflète l'ampleur du triomphe de Jiyu-to, puisqu'elle a obtenu un nombre stupéfiant de 240 sièges. Les partis d'opposition sont à la traîne, Kaishin-to obtenant 85 sièges, Shakai-to Uha avec 57 sièges et Shakai-to Saha juste derrière avec 54 sièges. Kono-to parvient à obtenir un modeste 4 sièges, tandis que les 26 sièges restants sont répartis entre divers petits partis et législateurs indépendants. Consternant les militants d'extrême gauche et les communistes, le Kyosan-to n'a pas remporté un seul siège lors de cette élection, principalement en raison d'une diminution du soutien public résultant de ses récentes activités militantes.\n\nAlors que la poussière retombe sur les résultats des élections, le Japon se prépare à une période de leadership continu sous la direction de Shigeru Yoshida et du parti Jiyu-to."
 jap_genelec_b.1.a: "Yoroshiku !"
 jap_genelec_a.2.t: "annonce des 27e élections générales"
 jap_genelec_a.2.d: "À la suite de la récente dissolution de la Chambre des représentants, une semaine à peine s'est écoulée avant l'annonce des 27es élections générales japonaises. Les prochaines élections marquent une rupture par rapport à la norme observée ces deux dernières années. Notamment, les rênes du pouvoir reposent désormais entre les mains du Minshu-to des conservateurs de Boryu, un changement par rapport à la domination précédente du Jiyu-to des conservateurs de Honryu.\n\nLe paysage électoral est rempli d'incertitude alors que le Minshu-to pro-Hatoyama, désormais au pouvoir, fait face à une formidable opposition de la part du Jiyu-to pro-Yoshida. Ce dernier, après avoir perdu du terrain ces derniers mois, est déterminé à resurgir et à reconquérir sa position dominante sur la scène politique."
 jap_genelec_a.2.a: "Faisons de notre mieux !"
 jap_genelec_b.2.t: "[GetNewspaperHeader]résultats des 27èmes élections générales"
 jap_genelec_b.2.d: "Les résultats des élections ont bouleversé le paysage politique puisque le parti d'Ichiro Hatoyama, Minshu-to, est sorti victorieux d'un triomphe électoral éclatant. Les législateurs de Jiyu-to se trouvent sidérés, témoins de l'influence sans précédent du soutien à la direction de Hatoyama.\n\nC'est la première fois en cinq ans environ que le Jiyu-to, une force politique de longue date, ne parvient pas à obtenir la majorité des sièges, la popularité du Minshu-to dépassant celle de son rival. La répartition des sièges dresse le tableau d'une bataille très disputée, Minshu-to obtenant 185 sièges, tandis que Jiyu-to est à la traîne avec 112 sièges. Il est ensuite suivi par Shakai-to Saha (89 sièges), Shakai-to Uha (67 sièges), Kono-to (4 sièges) et Kyosan-to, loin derrière avec seulement deux sièges. Les 8 sièges restants sont répartis entre divers mini-partis et candidats indépendants.\n\nC'est également la première fois que les sociétés de diffusion NHK et Nitteru fournissent un rapport préliminaire sur le dépouillement des votes à la télévision ; cette décision marque une rupture avec les procédures électorales traditionnelles."
 jap_genelec_b.2.a: "Yoroshiku !"
 jap_genelec_a.3.t: "annonce des 28e élections générales"
 jap_genelec_a.3.d: "Alors que la Chambre des Représentants a été dissoute la semaine dernière, les 28èmes élections générales ont récemment été annoncées. Contrairement aux cycles précédents, le spectre politique a subi une transformation majeure, conduisant à une Diète nationale plus bipolarisée.\n\nÀ l'avant-garde de ce réalignement politique se trouvent deux factions dominantes. D'un côté se trouve le bastion conservateur de Jimin-to, un formidable parti politique qui a consolidé son pouvoir - grâce à la fusion stratégique des factions conservatrices Honryu et Boryu autrefois divisées - il y a trois ans. De l'autre côté se trouve le socialiste Shakai-to ; le camp socialiste a réalisé son unité grâce à la fusion des factions de gauche et de droite en 1955. Ensuite, nous avons le Kyosan-to qui reste un petit parti, retranché dans son propre camp politique."
 jap_genelec_a.3.a: "Faisons de notre mieux !"
 jap_genelec_b.3.t: "[GetNewspaperHeader]résultats des 28èmes élections générales"
 jap_genelec_b.3.d: "Dans un triomphe retentissant, la faction Jimin-to a remporté une victoire décisive lors des 28e élections générales japonaises, portant un coup dur aux espoirs du Shakai-to et décevant les législateurs alignés sur le camp socialiste. [JAP.GetLeader], à la tête du parti triomphal Jimin-to, sort vainqueur, assurant la poursuite de son mandat de Premier ministre.\n\nLe paysage électoral reflète un contraste saisissant, avec Jimin-to prenant une avance considérable en remportant 287 sièges, éclipsant le total plus modeste de 166 du Shakai-to. Le Kyosan-to, loin en troisième position, parvient à obtenir un simple siège. Les candidats indépendants parviennent à remporter les treize sièges restants.\n\nCe résultat électoral marque une tendance notable dans la politique japonaise tout au long des années 1950, alors que les candidats conservateurs dominent systématiquement l'arène électorale. La série ininterrompue de victoires des forces conservatrices constitue une évolution décourageante pour le camp socialiste, qui se retrouve perdant à chaque élection de la décennie."
 jap_genelec_b.3.a: "Yoroshiku !"
 jap_genelec_a.4.t: "annonce des 29e élections générales"
 jap_genelec_a.4.d: "Alors que le pays surmonte les récentes troubles politiques déclenchés par les manifestations de l'Anpo, un sentiment d'anticipation se répand dans tout le pays avec l'annonce de nouvelles élections générales. Malgré une baisse de l'approbation du public, le Jimin-to maintient toujours sa position de parti le plus important à la Diète, se préparant aux défis électoraux à venir. L'impact des récentes manifestations est évident alors que le Shakai-to, profitant de l'élan acquis par la dissidence, se trouve au sommet de son influence. Un nouveau concurrent est également apparu, le Minsha-to, qui comprend des sociaux-démocrates modérés qui se sont séparés du Shakai-to plus tôt dans l'année. Cependant, leur force, bien que non négligeable, est éclipsée par l'influence renouvelée des Shakai-to."
 jap_genelec_a.4.a: "Faisons de notre mieux !"
 jap_genelec_b.4.t: "[GetNewspaperHeader]résultats des 29èmes élections générales"
 jap_genelec_b.4.d: "À la fin des 29èmes élections générales, le Jimin-to est sorti triomphant, obtenant un mandat écrasant qui en a surpris beaucoup. La victoire éclatante du Jimin-to a porté un coup dur aux socialistes, qui ont vu avec consternation leurs rivaux politiques remporter plus du double du nombre de sièges, amassant un nombre impressionnant de 296 contre 145 pour le Shakai-to. Minsha-to, dans une tournure décevante des événements, n'a réussi à obtenir que 17 sièges, loin derrière ses homologues du Shakai-to, tandis que le Kyosan-to n'a pu rassembler que trois modestes sièges. Les six sièges restants ont été répartis entre divers petits partis et législateurs indépendants.\n\n[JAP.GetLeader], désormais réélu, est prêt à poursuivre son mandat et s'est engagé à inaugurer de nouveaux changements dans la nation, promettant des progrès sur les fronts économique et social."
 jap_genelec_b.4.a: "Yoroshiku !"
 
 jap_startup.1.t: "L'aube du soleil levant"
 jap_startup.1.d: "Alors que le soleil se couche sur les vestiges d'un empire autrefois puissant, le Pays du Soleil Levant se retrouve enchaîné sous le poids de la défaite et de l'occupation étrangère. Les échos des bombardements atomiques qui ont marqué la chute de l'Empire du Japon en 1945 résonnent encore, jetant une ombre sombre sur la nation.\n\nSous l'emprise de la botte américaine, nous avons subi une transformation radicale. L'année 1947 a vu la naissance d'une nouvelle ère alors que la constitution influencée par les États-Unis prenait racine, donnant naissance à une démocratie naissante. Notre sol sacré, autrefois gardé par l'esprit samouraï, porte désormais les germes de principes constitutionnels, notamment dans l'adoption pacifiste de l'article 9 qui a démantelé la machine militaire autrefois puissante.\n\nCependant, le vent du changement apporte non seulement un renouveau mais aussi une tempête de défis. L'hyperinflation s'empare de l'économie, les pénuries alimentaires persistent et le coeur industriel du pays peine à se rétablir. Les turbulences politiques, alimentées par les militants d'extrême gauche, menacent la fragile stabilité qui subsiste. Notre nation, bien que abattue, reste résiliente.\n\nPourtant, au coeur de l'adversité se trouve notre esprit Yamato. En tant que nation ayant l'habitude de persévérer malgré les épreuves et les tribulations, nous avons une détermination éternelle à transcender les difficultés. Dans les murmures feutrés sous les fleurs de cerisier, se cache la promesse que le Pays du Soleil Levant s'élèvera à nouveau. L'espoir scintille comme une lanterne dans la nuit, nous guidant sur le chemin tumultueux du rétablissement. Avec une loyauté inébranlable envers l'Empereur et un profond sens du devoir, notre nation regarde vers l'avenir. Sur les cendres de la défaite, nous nous engageons à reconstruire une nation indomptable, pour la gloire de l'Empereur et l'esprit durable de la nation !"
 jap_startup.1.a: "Le Japon va se relever..."
 
 japan.1.d: "À la suite de l'occupation, l'évolution de la position du Japon concernant l'article 9 de sa Constitution a ouvert la voie à un renforcement des capacités militaires. Le climat de guerre froide a contraint le Japon à reconnaître l'impératif des capacités d'autodéfense dans les affaires mondiales. Soutenue par le soutien des États-Unis, cette initiative a abouti à la création d'une Agence de défense et à la conversion de la Force de sécurité nationale en « Forces japonaises d'autodéfense » - une armée en tous points, sauf en termes de nomenclature. Cependant, son rôle est strictement limité à des fins d'autodéfense et est étroitement surveillé par les États-Unis. La JSDF, composée de la JGSDF, de la JASDF et de la JMSDF, émerge comme une réponse à la situation géopolitique, garantissant la préparation du Japon à l'autodéfense tout en naviguant dans les nuances délicates de son cadre constitutionnel. Malgré ses limites, la formation du JSDF renforce la position délicate du bloc occidental en Asie, soulignant la souveraineté nationale fraîchement affirmée du Japon."
 japan.1.a: "Une décision cruciale pour notre sécurité."
 japan.2.d: ""
 japan.2.a: "Allez au-delà !"
 japan.2.b: "Impressionnant."
 japan.3.d: "Le Japon a connu plusieurs vagues de consolidations municipales depuis la restauration Meiji. Le nouveau projet de « Consolidation du Grand Showa » aidera le pays à faire face aux changements apportés par les soi-disant réformes d'après-guerre, en particulier le gouvernement agissant en vertu de la nouvelle Constitution de 1947 ainsi que de la loi sur l'autonomie locale de 1947. Dans le cadre de ce système de gouvernement local d'après-guerre, les rôles des municipalités ont été renforcés et elles ont été chargées de gérer les lycées, de mener des activités de prévention des incendies et de s'occuper des questions de protection sociale. Avec la population en croissance constante, et donc le nombre croissant de collégiens, ainsi que le nouveau système de lycées, leur gestion est forcément une charge pour chaque municipalité.\nÀ cette fin, la consolidation Great Showa sera étayée par deux lois sur la fusion municipale afin de rendre efficace la gestion des collèges et de peaufiner l'administration municipale. Cela contribuera également à utiliser la petite superficie du pays pour une industrie et une urbanisation en plein essor."
 japan.3.a: "Super!"
 japan.4.t: "La purge rouge"
 japan.4.d: "Avec l'introduction récente de la « Doctrine Truman », les États-Unis ont annoncé leur position inflexible contre le communisme, avec le Japon comme cible pour le nettoyer des radicaux d'extrême gauche. L'année dernière, alors que le diplomate américain George Kennan faisait pression sur MacArthur pour qu'il change sa politique modérée, les troubles se sont répandus entre le printemps et l'été avec une série de manifestations d'ouvriers, d'étudiants et d'enseignants dans les principales villes du Japon. Sans surprise, après l'approbation de Washington, les autorités d'occupation ainsi que la Huitième Armée ont réprimé de manière agressive ces mouvements. Le tristement célèbre « incident de l'éducation Hanshin » s'est produit en avril lorsque les autorités japonaises, sous la direction du gouvernement américain et du ministère japonais de l'Éducation, ont fermé les écoles privées coréennes en activité au Japon ; on dit que de telles actions ont été motivées par la crainte d'une éventuelle infiltration communiste dans les écoles. En outre, plus tard en septembre, Hitoshi Ashida, alors Premier ministre du Japon et homme politique de gauche, a été arrêté avec certains de ses membres de son cabinet à la suite du tristement célèbre « scandale Showa Denko ».\nAvec le nouvel héritage des événements de l'année dernière, l'incertitude économique, les efforts politiques de Kyosan-to et la formation du Zengakuren, l'extrême gauche ne pourra se propager à travers le pays que si rien n'est fait pour y faire face ; la situation nécessite donc de continuer à s'attaquer à la menace rouge."
 japan.4.a: "Il fallait..."
 japan.5.d: "Dans le cadre de la « Purge rouge » en cours visant à freiner la menace communiste croissante au Japon, la Section civile, d'information et d'éducation du GHQ a élaboré des plans pour garantir que le système éducatif reste pur de tout idéal d'extrême gauche. À cette fin, les autorités ont envoyé le Dr Walter C. Eells, qui sert au GHQ en tant que conseiller en matière d'enseignement supérieur, dans trente universités nationales pour appeler au licenciement immédiat des professeurs et du personnel sympathisants du communisme. Eells a également visité l'Université de Niigata et a qualifié le communisme de « doctrine dangereuse et destructrice ». En raison de ses idéaux, l'anticommunisme devient peu à peu un sentiment national et ouvertement boudé par les journaux nationaux. De plus, des sympathisants d'extrême gauche ont été licenciés des établissements d'enseignement, la plupart du temps pour des raisons non pertinentes. Cette initiative est communément connue sous le nom de « typhon Eells », ou « Izuru Senpu », comme nous l'appelons.\n\nCertains affirment que les actions d'Eells constituent une suppression flagrante de la liberté académique au Japon, tandis que d'autres le défendront, affirmant que le CIE n'a jamais été directement impliqué dans la purge rouge. Quoi qu'il en soit, une chose reste claire : « Izuru Senpu » est un élément essentiel de la purge rouge en cours."
 japan.5.a: "Tant mieux pour lui."
 japan.6.d: "Le premier président des chemins de fer nationaux japonais, Sadanori Shimoyama, a récemment été retrouvé mort sur la ligne Joban, Adachi, après avoir été porté disparu hier. Sur la base de l'autopsie officielle dirigée par le professeur Tanemoto Furuhata, il a été déterminé que Shimoyama était mort avant d'être heurté par le train, une perte de sang étant possible en raison du manque de sang sur le corps. De plus, dans certaines parties du corps, des hémorragies internes ont été constatées, qui pourraient avoir été provoquées uniquement par une force considérable, comme des coups de pied. D'un autre côté, on pense également que la mort de Shimoyama était un suicide. Cependant, l'hémorragie interne observée correspondait également à une collision avec un train, et les enquêteurs n'auraient pas pu observer de sang sur les lieux car il pleuvait.\n\nQuelques jours avant sa mort, Shimoyama a reçu l'ordre de réduire le personnel de JNR dans le cadre de la politique de Dodge Line et a publié une liste de 30 000 employés à licencier. La rumeur dit qu'il a reçu des menaces de mort de la part de hauts responsables militaires américains pour s'assurer qu'il exécutait l'ordre, ce qui aurait pu provoquer une grave détresse mentale et donc un possible suicide. D'un autre côté, des rumeurs courent même selon lesquelles certains des employés susceptibles d'être licenciés pourraient être impliqués d'une manière ou d'une autre. Néanmoins, l'incident reste un mystère."
 japan.6.a: "Tragique."
 japan.7.d: "Aujourd'hui, un train sans pilote en fuite circulant à une vitesse d'environ 60 km/h a franchi un arrêt tampon et a plongé dans une rue commerçante voisine, tuant six personnes et en blessant vingt vingt, à la gare de Mitaka, ligne principale Chuo. Les autorités chargées de l'enquête ont arrêté dix employés de Kyosan-to et un ancien conducteur de train, Keisuke Takeuchi, soupçonnés d'un éventuel complot commun dans le cadre de l'activisme d'extrême gauche. Cependant, le procès final et la décision du tribunal sur la question n'ont pas encore eu lieu.\n\nCet incident s'est produit peu de temps après le récent incident de Shimoyama, au cours duquel le premier président du JNR, Sadanori Shimoyama, a été retrouvé mort sur la ligne Joban, et les gens ont déjà commencé à remettre en question l'authenticité des accusations portées contre l'Union nationale des chemins de fer japonais (Kokuro) et le Kyosan-to à propos de ces deux incidents."
 japan.7.a: "Discutable."
 japan.8.d: "Sans surprise, un autre incident ferroviaire s'est produit. Aujourd'hui, un train de voyageurs de la ligne principale du Tohoku a déraillé et s'est renversé sur un tronçon de voie courbe, alors qu'il se rendait de la gare d'Aomori à la gare d'Ueno. La locomotive s'est renversée, tuant trois membres d'équipage ; cependant, aucun des 412 passagers n'a été blessé ou tué. Les enquêteurs ont découvert que les boulons et les écrous des joints de voie avaient été desserrés et qu'un grand nombre de crampons de chemin de fer fixant les rails aux traverses avaient été retirés, ainsi qu'une clé et un levier dans une rizière à proximité. Comme d'habitude, les soupçons se sont immédiatement portés sur le Kokuro, les travailleurs de l'usine voisine de Toshiba-Matsukawa et les travailleurs de Kyosan-to, en raison des récentes protestations contre les réductions d'effectifs. Dix ouvriers de l'usine de Matsukawa et dix employés de JNR ont été inculpés et accusés de sabotage.\n\nLe fait que cela, ainsi que les récents incidents de Shimoyama et Mitaka se soient produits en l'espace de deux mois, a germé une théorie du complot selon laquelle le GHQ, avec l'aide des services de renseignement américains, aurait perpétré ces incidents comme prétexte pour arrêter les membres de Kokuro et Kyosan afin de contrecarrer tout éventuel activisme d'extrême gauche."
 japan.8.a: "Coïncidence?"
 japan.9.t: "Formation des Keiretsus"
 japan.9.d: "Alors que le vent du changement souffle sur notre pays, nous devons faire face à l'héritage de notre passé. Les Zaibatsus, autrefois puissances économiques du Japon, n'existent plus. À leur place, un nouvel ordre économique est en train d'émerger : le Keiretsus. Ces conglomérats, constitués des vestiges des anciens zaibatsus, sont sur le point de façonner l'avenir économique du Japon. Aujourd'hui, nous avons pris une décision cruciale qui déterminera le cours de l'économie de notre pays. Les anciens zaibatsus étaient entravés par les restrictions d'après-guerre qui limitaient leur influence et étouffaient la croissance économique. En levant ces restrictions et en encourageant la formation de Keiretsus, nous pouvons espérer libérer tout le potentiel de nos industries. Cela entraînera une augmentation de la production économique, de l'innovation technologique et une amélioration de la compétitivité sur la scène nationale."
 japan.9.a: "C'est pour le mieux."
 japan.10.t: "La proposition CVH"
 japan.10.d: "La sécurité et la défense du pays restant une priorité absolue, une décision attend. Une nouvelle « proposition CVH » a été présentée, une initiative stratégique visant à renforcer les capacités navales du pays. Cependant, le potentiel de réaction politique de la proposition soulève des questions quant à son approbation immédiate. La proposition CVH, élaborée après de longues délibérations par des experts de la défense, vise à renforcer les efforts de recherche et développement axés sur les porte-avions et les hélicoptères pour la JMSDF. L'initiative présente une opportunité importante de renforcer la sécurité maritime du Japon, car elle fournirait à la JMSDF les moyens modernes et polyvalents nécessaires à la sauvegarde des eaux territoriales du pays et à la contribution aux efforts de sécurité internationale. Les porte-avions et les hélicoptères constituent l'épine dorsale de toute force navale efficace, permettant un déploiement rapide du personnel, des fournitures et des équipements sur de vastes territoires maritimes.\n\nCependant, il est important de reconnaître que la mise en oeuvre de cette proposition pourrait susciter de légères réactions politiques, car l'opposition estime que cela violerait la constitution pacifiste et contribuerait à une course aux armements inutile."
 japan.10.a: "La constitution pacifiste doit être respectée."
 japan.10.b: "La sécurité nationale avant tout !"
 japan.12.t: "La Réserve de la Police Nationale"
 japan.12.d: "Face à la guerre en Corée et avec l'autorisation et la demande du commandement suprême des puissances alliées, le gouvernement japonais a pris la décision de créer la réserve de la police nationale. Cette force n'est pas seulement destinée à faire face aux menaces extérieures potentielles, mais également à maintenir la stabilité intérieure, notamment en ce qui concerne notre situation politique fragile, où des troubles intérieurs sont très possibles.\n\nDepuis la dissolution complète de notre armée suite à notre défaite dans la guerre, nous sommes restés désarmés pendant près d'une demi-décennie. Aujourd'hui, pour la première fois, nous levons à nouveau les armes, non pas dans le cadre d'une résurgence militaire, mais pour la sécurité nationale. Cependant, il faut reconnaître qu'avec l'article 9 toujours en vigueur, le rôle du NPR est strictement limité à la sécurité et à l'ordre public. Cette force n'est en aucun cas une armée permanente et sa taille est soigneusement limitée à 75 000 hommes, garantissant ainsi qu'elle reste une entité défensive et non militaire."
 japan.12.a: "Étape nécessaire."
 japan.13.t: "La Force de Sécurité Côtière"
 japan.13.d: "Après la création de la Réserve de la Police Nationale en tant que force de sécurité terrestre, il y a eu une discussion concernant la création d'une force similaire dédiée à la sécurité maritime. Après la défaite du Japon en 1945, sa marine fut complètement dissoute et la garde côtière se retrouva avec des ressources limitées : limitées à des bateaux de patrouille dotés d'un armement minimal et même de restrictions sur leur vitesse et leur portée ; cela a rendu notre pays vulnérable en termes de capacités de défense maritime. Cependant, avec le déclenchement de la guerre de Corée, le SCAP s'est montré de plus en plus favorable à l'idée d'un élargissement de ses capacités de défense par le Japon. Ce changement de politique s'est manifesté clairement dans l'approbation de la création du NPR, signe clair du changement de position à l'égard des besoins de défense du Japon. Dans cette optique, les discussions ont désormais conduit à la création de la Force de sécurité côtière, une force de sécurité nouvellement créée chargée de protéger les frontières maritimes du Japon et de sécuriser ses eaux.\n\nAlors que le Japon progresse dans ses efforts, des discussions sont en cours avec des responsables américains concernant la possibilité de louer des frégates et d'autres navires de fabrication américaine pour faciliter les capacités opérationnelles de la Force de sécurité côtière."
 japan.13.a: "Excellente nouvelle."
 japan.14.t: "Accord de location de navires entre le Japon et les États-Unis"
 japan.14.d: "Suite à l'autorisation accordée par le SCAP au Japon de créer une force de sécurité côtière, les discussions entre les responsables américains et japonais ont conduit à une décision importante visant à aider leurs capacités de défense maritime. Conscients de l'importance stratégique de la sécurisation des eaux territoriales japonaises dans le contexte de la guerre de Corée en cours, les États-Unis ont décidé de louer une flotte de navires pour soutenir la nouvelle force de sécurité japonaise.\n\nDans le cadre de cet accord, le Japon recevra 18 patrouilleurs de classe Tacoma et 55 patrouilleurs de classe Yuri, fournissant ainsi la base nécessaire aux opérations maritimes. En outre, des programmes de formation conjoints et des conseils opérationnels seront organisés pour garantir l'intégration transparente de ces navires dans les forces de sécurité japonaises."
 japan.14.a: "Nos alliés du Pacifique."
 japan.14.b: "Nos alliés du Pacifique."
 japan.15.t: "[GetNewspaperHeader]La loi sur les forces d'autodéfense"
 japan.15.d: "Alors que le redressement du Japon est en bonne voie et que sa position internationale s'est renforcée après la signature du traité de paix, la nécessité de renforcer ses propres capacités de défense est devenue de plus en plus évidente. Les tensions de la Guerre froide en Asie de l'Est, la récente guerre de Corée et la présence continue de l'Union soviétique et de la Chine comme menaces régionales ont encore renforcé la nécessité d'une autonomie en matière de sécurité nationale. En réponse, le Japon a promulgué l'Accord d'assistance mutuelle en matière de sécurité, obligeant le pays à assumer une plus grande responsabilité pour sa propre défense.\n\nSuite à cela, la loi sur la création de l'Agence de défense et la loi sur les forces d'autodéfense ont été adoptées et ces lois sont entrées en vigueur. L'Agence nationale de sécurité a été réorganisée en Agence de défense et ses branches militaires ont été réformées avec la création de la JGSDF, de la JASDF et de la JMSDF."
 japan.15.a: "Une étape nécessaire à notre légitime défense, au nom de l'Empereur."
 japan.16.t: "L'Agence Nationale de Sécurité"
 japan.16.d: "Face aux tensions persistantes en Asie de l'Est, le Japon a franchi une nouvelle étape dans la reconstruction de ses forces de sécurité sous la supervision américaine. Suite à la création de la réserve de la police nationale et de la force de sécurité côtière, le besoin d'une force de sécurité plus structurée et organisée est devenu évident. Étant donné que la NPR et la CSF étaient des organisations de forces de sécurité distinctes, leur intégration de commandement était simple. Mais jusqu'à présent, en réponse à ces préoccupations, l'Agence nationale de sécurité a été officiellement créée en tant qu'organisation centralisée supervisant à la fois la NPR et la Force de sécurité côtière nouvellement créée, et pour intégrer également leurs structures de commandement. La NSA, bien que techniquement une agence civile relevant du bureau du Premier ministre, sert en réalité de structure proto-militaire, permettant au Japon de développer ses capacités de défense tout en adhérant à l'article 9 de la constitution. Une démarche soutenue par la SCAP."
 japan.16.a: "Parfait."
 japan.17.t: "Lettre de Douglas MacArthur"
 japan.17.d: "Cher Monsieur le Premier Ministre :\n\n     Conformément à ma politique établie visant à réinvestir l'autorité autonome dans le gouvernement japonais aussi rapidement que la situation le permet, j'ai visualisé le développement progressif d'organismes chargés de l'application des lois adéquats au maintien de la sécurité et de l'ordre intérieurs et à la sauvegarde du littoral japonais.\n\n     En ce qui concerne la sécurité maritime dans les ports et les eaux côtières du Japon, le Bureau de la sécurité maritime a obtenu des résultats très satisfaisants, mais les événements révèlent que la sauvegarde de la longue ligne côtière japonaise nécessite l'emploi d'une force plus grande que celle actuellement prévue par la loi.\n\n     En conséquence, j'autorise votre gouvernement à prendre les mesures nécessaires pour constituer une réserve de police nationale de 75 000 hommes. Les sections appropriées de ce quartier général seront disponibles, comme auparavant, pour conseiller et assister sur les aspects techniques de ces mesures.\n\nTrès sincèrement,\nDOUGLAS MacArthur"
 japan.17.a: "Reconnu."

 jap_police_law_of_1954.1.d: "Il y a environ trois semaines, un projet d'amendement à la loi sur la police a été adopté par la Chambre des représentants et la session devait se terminer à cette date. Cependant, pour des raisons inconnues, le président de la Chambre des représentants, Yasujiro Tsutsumi, a proposé une prolongation de deux jours de la session.\nEstimant que la prolongation était invalide et inutile, les députés de l'opposition ont empêché le Président de prendre son siège dans le but d'annuler la prolongation proposée. N'ayant pas d'autre choix, le Président a convoqué la police de la Diète pour maintenir l'ordre et la discipline ; Cependant, cela n'a fait qu'aggraver la situation lorsque les membres de la maison et la police se sont livrés à une bagarre brutale./nHeureusement, l'incident n'a pas fait de blessés graves, même si une poignée d'entre eux ont dû être hospitalisés. La session a été prolongée de deux jours comme proposé, même si cet incident aura certainement des conséquences désagréables."
 jap_police_law_of_1954.1.a: "Politique!"
 jap_police_law_of_1954.2.t: "Validité de la prolongation de la session"
 jap_police_law_of_1954.2.d: "Avec la récente prolongation inattendue de la session et la bagarre qui a suivi, nombreux sont ceux qui remettent en question sa validité. Il est affirmé que lors de la prolongation de la session de la Diète, le président de la Chambre des représentants doit consulter le président de la Chambre des conseillers avant que la Chambre des représentants ne prenne une résolution. Décider de prolonger la session sur la seule base de la volonté de la Chambre des représentants dès le début est un défaut majeur ; De plus, le Président n'était pas présent à son siège lorsque la prolongation a été annoncée. Cependant, d'autres soutiennent que la majorité de la Chambre des représentants a décidé de prolonger la session, ce qui a été accepté par la Chambre des conseillers. De plus, le Président n'a pas pu prendre place en raison d'une obstruction. On peut également interpréter qu'en cas d'urgence, la seule volonté de la Chambre des représentants suffit de par la nature de la prolongation de la session. Quoi qu'il en soit, il est presque impossible d'exclure si la prolongation était valide ou non."
 jap_police_law_of_1954.2.a: "Effectivement ambigu."
 jap_police_law_of_1954.3.t: "Session prolongée jusqu'au 15 juin"
 jap_police_law_of_1954.3.d: "Bien que la 19ème session de la Chambre des Représentants ait été initialement prolongée jusqu'à aujourd'hui, le 5 juin, le Président a proposé de prolonger encore la session jusqu'au 15 juin. Cela est principalement dû à l'absence des principaux partis ces deux derniers jours, notamment les partis socialistes de droite et de gauche ; probablement en guise de protestation contre la récente prolongation de la session et la bagarre qui a suivi entre les membres de la Chambre et la police de la Diète convoquée. Ainsi, dans ces circonstances, aucune décision unanime n'a pu être prise sur le projet de loi modifiant la loi sur la police, ce qui a obligé le Président à prolonger une fois de plus la session."
 jap_police_law_of_1954.3.a: "Mieux vaut être prudent que se précipiter."
 jap_police_law_of_1954.4.t: "Projet de loi modifiant la loi sur la police réussi !"
 jap_police_law_of_1954.4.d: "Hier, lors des délibérations de la Commission de l'Administration Locale de la Chambre des Conseillers, un rapport intérimaire a été soumis pour discussion en séance plénière, où le projet de loi d'amendement a été adopté et promulgué. Il a été promulgué aujourd'hui encore et a été approuvé avec la plupart des voix en faveur du projet de loi. Il n'y a donc plus d'obstacles à l'application de la loi sur la police."
 jap_police_law_of_1954.4.a: "Enfin!"
 jap_police_law_of_1954.5.d: "La loi sur la police de 1947 a été entièrement révisée par le biais d'un amendement et appliquée. La loi récemment remaniée stipule que la police se fonde sur une philosophie démocratique afin de protéger les droits et libertés des individus et de maintenir la sécurité et l'ordre publics.\nLes principaux facteurs à l'origine de cette révision sont la démocratisation de la police ainsi que la centralisation de la gestion et de la structure. Les services de police décentralisés font peser une lourde charge financière sur les gouvernements locaux, et la fragmentation excessive des organisations policières a conduit à des conflits territoriaux excessifs et a rendu difficile les enquêtes à grande échelle. En outre, la police nationale et locale et la police locale étaient sur un pied d'égalité et la responsabilité de la sécurité nationale devenait floue. En vertu de la nouvelle loi, les agences de police nationales et locales existantes ont été dissoutes et remplacées par la nouvelle « Agence nationale de police » qui coopérerait avec les agences de police préfectorales."
 jap_police_law_of_1954.5.a: "Super."
 
 jap_bakayaro.1.t: "Bakayaro...."
 jap_bakayaro.1.d: "Lors de la 15e session de la Diète nationale, un incident mémorable s'est produit lors de la séance de questions-réponses entre le Premier ministre Yoshida et Eiichi Nishimura, membre du parti Shakai-to Uha. De manière inattendue, Yoshida a utilisé un terme inhabituel, qualifiant Nishimura d'« idiot », dans sa barbe. À la surprise de beaucoup, cette déclaration a été captée par inadvertance par un microphone, qui a été entendu par l'ensemble de la Chambre des représentants.\n\nEn réponse, Nishimura a rapidement riposté, comparant Yoshida et son cabinet au célèbre premier ministre Tojo Hideki en temps de guerre. Cet échange a dégénéré en une dispute brève mais intense entre les deux hommes politiques. Sentant la gravité de la situation, Yoshida a rapidement rétracté ses propos pour tenter de désamorcer les tensions. Néanmoins, les membres du parti Shakai-to Uha, interprétant le commentaire de Yoshida comme une démonstration flagrante de manque de respect envers l'institution estimée de la Diète, ont résolu collectivement de renvoyer le Premier ministre devant la commission disciplinaire pour ce qu'ils considéraient comme une « infraction disciplinaire en tant que législateur ». Ils ont également déposé une motion de censure et le vote devrait avoir lieu prochainement. Ichiro Hatoyama, reconnaissant l'opportunité de renverser Yoshida, son rival acharné de longue date, a laissé Jiyu-to avec d'autres conservateurs Boryu pour assurer le succès de la motion de censure. Que se passe-t-il ensuite ? Le temps nous le dira."
 jap_bakayaro.1.a: "Opportunistes !"
 jap_bakayaro.2.t: "[GetNewspaperHeader]Dissolution de Bakayaro"
 jap_bakayaro.2.d: "Suite au récent « incident du bakayaro », une motion de censure a été déclenchée par le commentaire irrespectueux de Yoshida envers un législateur. Avec un soutien diminué de la part des conservateurs pro-Hatoyama, la motion a trouvé l'approbation de la majorité. Plus de 30 membres de la faction Hatoyama du Jiyu-to, absents lors du vote sur le renvoi pour infraction disciplinaire, ont quitté le parti, s'alignant sur la motion de censure contre le cabinet, qui a également été approuvée.\n\nEn réponse, Yoshida, confronté à des turbulences politiques, a dissous la Chambre des représentants, signalant l'annonce imminente des prochaines élections générales. Cette dissolution a divisé le Jiyu-to, alors que les législateurs anti-Yoshida se sont séparés pour créer leur faction dirigée par Ichiro Hatoyama, prêts à défier le Jiyu-to de Yoshida lors des prochaines élections."
 jap_bakayaro.2.a: "Bien."
 jap_bakayaro.3.t: "annonce des 26e élections générales"
 jap_bakayaro.3.d: "Après la récente « dissolution de Bakayaro », au cours de laquelle le Premier ministre Shigeru Yoshida a pris la mesure controversée de dissoudre la Diète nationale pour contrer une motion de censure imminente, l'annonce des 26èmes élections générales japonaises a été faite. Cependant, cette décision est largement critiquée comme étant une manoeuvre stratégique visant à éviter un éventuel vote de censure. Les législateurs de l'opposition ont dénoncé les actions de Yoshida, qualifiant la dissolution de tentative flagrante d'échapper au spectre de la « justice » par le biais de processus démocratiques. Malgré les protestations et les accusations de manoeuvres politiques, les dés sont jetés et la nation se prépare désormais aux prochaines élections.\n\nAu milieu de ces événements, le Jiyu-to est confronté à des fractures internes, avec plus de quarante de ses membres, principalement des conservateurs de Honryu, qui ont fait défection pour rejoindre le parti nouvellement formé dirigé par Ichiro Hatoyama."
 jap_bakayaro.3.a: "Faisons de notre mieux !"
 jap_bakayaro.4.t: "[GetNewspaperHeader]résultats des 26èmes élections générales"
 jap_bakayaro.4.d: "Au point culminant des 26èmes élections générales japonaises, Shigeru Yoshida est sorti victorieux une fois de plus, assurant son poste de Premier ministre après le triomphe consécutif de Jiyu-to.\n\nMalgré le caractère peu surprenant de la victoire de Yoshida, la composition des sièges à la Chambre des représentants a connu des changements notables. Jiyu-to, tout en conservant sa domination avec 199 sièges, a connu un revers, perdant 41 sièges par rapport aux élections précédentes. Le parti a notamment dû faire face au départ de certains députés conservateurs de Boryu, dirigés par Ichiro Hatoyama, qui se sont divisés pour former leur propre parti indépendant. Le paysage électoral se déroule avec Jiyu-to (199 sièges) en tête, suivi de Kaishin-to (76 sièges), Shakai-to Saha (72 sièges), Shakai-to Uha (66 sièges), le Jiyu-to dirigé par Hatoyama (35 sièges), Kono-to (5 sièges) et Kyosan-to n'obtenant qu'un seul siège. Les 11 sièges restants sont répartis entre divers partis mineurs et candidats indépendants.\n\nCette élection marque également la première fois où l'examen populaire national des juges de la Cour suprême a été omis. La décision était fondée sur le peu de temps écoulé depuis le dernier examen à la fin de 1952."
 jap_bakayaro.4.a: "Yoroshiku !"
 
 jap_national_projects.1.t: "Ouverture de la ligne Marunouchi"
 jap_national_projects.1.d: "La ville de Tokyo a vibré d'enthousiasme alors que le métro de Tokyo a marqué aujourd'hui une étape importante avec l'ouverture tant attendue du premier tronçon de la ligne Marunouchi. Après près de trois ans de construction approfondie et de planification méticuleuse, ce nouvel ajout au réseau de métro de la ville promet d'améliorer le transport pour d'innombrables navetteurs.\nActuellement, la ligne Marunouchi s'étend de la gare d'Ikebukuro à la gare d'Ochanomizu, comprenant 6 stations le long de son parcours. Cette expansion vise à atténuer la congestion et la demande toujours croissantes des transports souterrains de Tokyo et à offrir des déplacements fluides aux résidents et aux touristes. En grande pompe, le train inaugural a quitté la gare d'Ikebukuro, transportant une foule de dignitaires, de représentants du gouvernement et de passionnés de train. La cérémonie d'ouverture, qui s'est tenue à la gare d'Ikebukuro, s'est déroulée en présence du gouverneur de Tokyo, ainsi que de hauts dirigeants du métro de Tokyo. Le ruban de cérémonie, symbolisant le début des opérations. La ligne Marunouchi est appelée à devenir un symbole de l'engagement de Tokyo en faveur du progrès et du développement, propulsant la ville dans une nouvelle ère d'excellence en matière de transport."
 jap_national_projects.1.a: "Impressionnant!"
 
 jap_labour.1.t: "Les syndicats se mettent en grève"
 jap_labour.1.d: "Sur fond tumultueux de la guerre de Corée, une vague de mécontentement a balayé le Japon alors qu'une poignée de syndicats ont déclenché une série de grèves mineures dans les grandes villes, alimentées par leur mécontentement face au rationnement en cours. Certaines usines ont également été temporairement à l'arrêt, les ouvriers se joignant à la cause, amplifiant ainsi le choeur de la dissidence. La résonance de leur protestation n'échappe pas à la population, les syndicats bénéficiant d'un immense soutien. Dans ce creuset de mécontentement, la faction de gauche du parti Shakai-to a connu un regain de popularité, polarisant davantage le camp socialiste."
 jap_labour.1.a: "Concernant."
 jap_labour.2.t: "Création de Sohyo"
 jap_labour.2.d: "La convention inaugurale de Sohyo s'est tenue à Toko Kaikan dans le quartier Minato de Tokyo, s'étendant sur deux jours. Takeo Muto, un ancien charbonnier, est devenu le premier président, tandis que Zengoro Shimagami, un ancien commerçant de Sodomei, a obtenu le poste de secrétaire général. La participation à l'événement s'est étendue au-delà des limites des conseils constituants Sohyo, avec l'inclusion d'autres unions civiles telles que Sodomei, Nikkyoso, Kokuro, Tororen, Kaiin et Shitetsuroren.\n\nLa création de Sohyo a été fortement influencée par le GHQ d'occupation allié, jouant un rôle central dans l'orientation de la trajectoire du syndicat. Lors du congrès fondateur, une déclaration a été adoptée sous la direction du GHQ, excluant explicitement les idéaux de Kyosan-to. En outre, l'accent a été mis sur l'établissement de relations chaleureuses avec la Confédération internationale des syndicats libres. Nettoyer les syndicats de l'influence des partis politiques et se concentrer sur les luttes économiques du travail figuraient également parmi les éléments clés de l'ordre du jour. Aujourd'hui, Sohyo apparaît comme une entité syndicale distincte, aux connotations anticommunistes. Cependant, connaissant la nature des syndicats, leur position anticommuniste actuelle pourrait ne pas durer longtemps. Cela est déjà évident dans l'implication active d'éminents militants socialistes de gauche dirigés par Takano Minoru. Takano, qui entretient des liens étroits avec le Kyosan-to, est déterminé à persuader les syndicats de Sohyo de s'éloigner de leur perspective anticommuniste, malgré la récente initiative adoptée lors du congrès."
 jap_labour.2.a: "Voyons ce qui se passe alors."
 jap_labour.3.t: "Deuxième congrès de Sohyo"
 jap_labour.3.d: "Une deuxième convention de Sohyo, d'une durée de trois jours, s'est tenue récemment, au cours de laquelle les groupes de gauche et de droite des syndicats de Sohyo se sont engagés dans un conflit sur la politique générale et les objectifs du Sohyo. Les gauchistes, principalement dirigés par Minoru Takano, ont plaidé pour l'adoption des « Principes de paix » du Shakai-to comme nouveau programme, ce qui a déclenché une farouche opposition de la part de la faction de droite au sein de Sohyo. Les principes de paix incluent l'opposition au réarmement et à l'expansion des forces de défense japonaises, mettant l'accent sur une adhésion totale à l'article 9. Deuxièmement, plaider pour que le Japon rejoigne le mouvement des non-alignés et maintienne sa neutralité dans la guerre froide qui se prépare, en s'éloignant d'une position pro-occidentale. Enfin. S'opposer aux bases militaires américaines au Japon et soutenir l'organisation de manifestations anti-américaines contre les bases militaires. Un moment charnière de la convention a été le rejet de l'objectif précédent d'adhésion à la Confédération internationale des syndicats libres, intensifiant les tensions entre les ailes opposées.\n\nCes principes ont marqué un changement radical par rapport à l'agenda fixé lors de la première convention, indiquant un changement significatif au sein du spectre politique en moins d'un an. Désormais sous la nouvelle direction du socialiste de gauche Minoru Takano, Sohyo a, sans surprise, adopté une position de gauche, rejetant ouvertement la politique pro-américaine du Japon."
 jap_labour.3.a: "Même pas surpris."
 jap_labour.4.t: "Troisième Convention de Sohyo"
 jap_labour.4.d: "La troisième Convention de Sohyo a eu lieu en juillet dernier, marquée par des développements importants qui ont souligné la division idéologique persistante au sein de l'organisation. Lors du congrès, une proposition présentée par la faction de droite visant à reconsidérer son adhésion à l'ICTFU a été catégoriquement rejetée par les syndicats de gauche. Un point de discorde notable est survenu concernant le Traité de Francisco nouvellement appliqué. Les membres de droite ont plaidé pour une approche plus conciliante, mettant l'accent sur la coopération avec le gouvernement, tandis que la faction de gauche a insisté sur une stratégie d'opposition agressive. Ce dernier s'alignait étroitement sur la politique du groupe dissident de gauche de Shakai-to, Shakai-to Uha. Dans une décision reflétant la domination de la gauche au sein de Sohyo, les hauts responsables ont décidé de soutenir le Shakai-to Uha, affirmant sans équivoque l'orientation de gauche de l'organisation. Susumu Fujita est devenu le nouveau président du comité de Densan, renforçant ainsi la direction de gauche. De plus, Minoru Takano a conservé son poste de secrétaire général. Malgré les questions controversées discutées lors de la convention, aucune concession n'a été faite pour apaiser la faction de droite. Par conséquent, le conflit interne entre la gauche et la droite au sein de Sohyo s'est intensifié, signalant un schisme idéologique croissant au sein de Sohyo."
 jap_labour.4.a: "Plus ça se fracture, mieux c'est !"
 jap_labour.5.t: "Quatrième Convention de Sohyo"
 jap_labour.5.d: "Aujourd'hui, la Quatrième Convention de Sohyo a marqué un tournant important dans la structure et les activités de l'organisation. Au cours de cette assemblée, les dirigeants de Sohyo ont officiellement adopté les « Neuf principes », définissant le cadre de leurs efforts futurs. Ces principes, enracinés dans le marxisme et le léninisme, englobent divers aspects, notamment l'opposition à la rationalisation capitaliste, l'unification du front du travail, la protection et le maintien de la paix et la stabilisation de l'économie en temps de paix. Remarquablement, Sohyo a subi une transformation substantielle en l'espace de trois ans. Née comme un mouvement anticommuniste, l'organisation a désormais adopté une position totalement opposée à sa position antérieure.\n\nDans le cadre de Sohyo, une faction connue sous le nom de Minroren a émergé, composée de syndicats de droite cherchant à modérer les politiques de l'organisation de l'intérieur. Cependant, trois syndicats de droite, à savoir Kaiin, Zensen Domei et Zeneien, ont atteint un point de rupture avec la direction dominée par la gauche de Sohyo. Comme prévu, ces syndicats ont choisi de se retirer du comité Sohyo en raison des divisions importantes au sein de l'organisation, laissant Nihoro comme le seul syndicat de droite restant."
 jap_labour.5.a: "C'était inévitable."
 jap_labour.6.t: "Formation de Zenro Kaigi"
 jap_labour.6.d: "Aujourd'hui, les syndicats de droite, issus du parti Sohyo, dominé par la gauche, se sont réunis pour leur congrès inaugural et ont officiellement créé le Zenro Kaigi. Les partisans notables de cette alliance nouvellement formée incluent Kaiin, Zensen Domei et Zeneien. De plus, les membres de droite de Sohyo alignés sur la faction Minroren, aux côtés des membres de droite de Sodomei, étaient présents, formant collectivement le Zenro Kaigi de droite comme un redoutable rival de Sohyo.\n\nL'objectif principal de Zenro est de contrer les aspirations gauchistes de Sohyo, en visant à éliminer toutes les tendances pro-communistes au sein des syndicats affiliés et en se positionnant du côté du « monde libre ». L'organisation dénonce également les grèves à motivation politique, en particulier celles orchestrées par Sohyo, et exprime son intention de rechercher une affiliation à la CISL. Contrairement à une position socialiste dure, Zenro penche vers une social-démocratie plus modérée. Le Conseil s'oppose notamment au réarmement immédiat du Japon, préconisant plutôt une garantie de la sécurité du Japon par le biais des Nations Unies.\n\nAvec actuellement 700 000 adhérents, la croissance future de Zenro Kaigi pourrait servir d'indicateur de l'évolution de la trajectoire politique du mouvement syndical japonais. Cette polarisation suggère le déclenchement d'une mini-guerre froide au sein de la politique syndicale."
 jap_labour.6.a: "La politique travailliste est certainement intéressante..."
 jap_labour.7.t: "Dissolution de Sanbetsu Kaigi"
 jap_labour.7.d: "Alors que son congrès final a eu lieu aujourd'hui, le Sanbetsu Kaigi, autrefois puissant, n'est plus puisque les syndicats qui le constituent encore ont officiellement démissionné et se sont retirés, marquant officiellement la fin du conseil industriel. Créé il y a dix ans, en 1948, Sanbetsu Kaigi a d'abord été salué comme l'un des principaux conseils industriels nationaux. Cependant, des fractures au sein de l'organisation étaient évidentes dès sa création. L'inclusion d'éléments pro-démocratiques a déclenché des conflits avec des sympathisants de gauche, entraînant une diminution précoce de ses membres. La présence de la faction Mindo, un groupe anticommuniste, a encore exacerbé les divisions internes alors que les membres de gauche cherchaient à resserrer leurs liens avec le Kyosan-to. En 1949, au plus fort de la « Purge rouge », Sanbetsu Kaigi s'efforça de conserver son éminence. L'expulsion des militants de gauche des lieux de travail à l'échelle nationale a brisé sa légitimité, conduisant à une cascade de scissions au sein des syndicats et à des retraits du conseil. L'année 1950 s'est avérée être la pire pour l'organisation, car les autorités d'occupation ont directement réprimé le Kyosan-to et les groupes affiliés, dont Sanbetsu Kaigi. Il s'en est suivi la perte de la majorité de ses fonctionnaires occupant des postes clés. La création de Sohyo plus tard cet été-là a porté le coup final, provoquant un exode important des principaux syndicats constituants vers Sohyo. Malgré près de huit années de trébuchements et de vaines tentatives pour regagner de l'importance, les membres ont désormais choisi de dissoudre définitivement l'organisation."
 jap_labour.7.a: "Un autre botte le seau."
 
 jap_parties.1.t: "Formation du Jiyu-to"
 jap_parties.1.d: "Lors de la convention d'aujourd'hui, les législateurs de Minji-to, aux côtés de la faction dissidente de Minshu-to, ont officiellement créé la nouvelle entité politique, Jiyu-to.\n\nLes divisions internes au sein du Minshu-to sont apparues ces dernières années, notamment avec la rivalité Shidehara-Ashida et l'émergence du Doshi Club, qui a miné la cohésion du parti. La situation s'est aggravée il y a deux ans avec le tristement célèbre scandale Showa Denko, qui a conduit à la démission massive du cabinet Ashida et porté un coup final à tout espoir de préserver l'unité du parti. La faction dissidente, qui s'est alignée sur le Jiyu-to de Yoshida lors de la convention d'aujourd'hui, avait récemment vu le jour. Dirigée par Shigeru Hori, Kozaemon Kimura et Takeru Inukai, cette coalition a quitté Minshu-to, contribuant ainsi à l'état actuel de désarroi du parti.\n\nAlors que Minshu-to est en ruine après les récents événements, le Jiyu-to nouvellement créé est sur le point d'assumer le rôle de la principale force politique conservatrice du pays dans un avenir prévisible."
 jap_parties.1.a: "Kanpaï !"
 jap_parties.2.t: "Fusion de Kokukyo-to et Minshu-to"
 jap_parties.2.d: "Aujourd'hui, les législateurs de Kokukyo-to et les restes de Minshu-to sont parvenus à un accord pour fusionner, formant une nouvelle entité politique connue sous le nom de Kokumin Minshu-to, en abrégé Kokumin-to.\n\nCette évolution fait suite à la récente fracture de Minshu-to, où une faction s'est séparée et a uni ses forces avec Minji-to pour créer Jiyu-to, laissant Minshu-to dans le désarroi et confronté à une pénurie de main-d'oeuvre. Avant la fusion, des discussions ont eu lieu entre Miki de Kokukyo-to et Ashida de Minshu-to. Ils ont délibéré sur la nécessité de créer un parti à base élargie pouvant accueillir certains éléments socialistes. Cependant, pour des raisons pratiques, une fusion avec l'aile droite du Shakai-to a été jugée désagréable. Même si Ashida ne s'est pas publiquement opposé à la position de Miki, il a reconnu les problèmes urgents de Minshu-to, notamment le manque de ressources humaines et de fonds politiques.\n\nÀ la lumière de ces considérations, un accord de fusion a été conclu, conduisant à la formation du Kokumin-to avec le démocrate Gizo Tomabechi comme président. Cette décision intervient juste avant les prochaines élections à la Chambre des conseillers cet été."
 jap_parties.2.a: "Tant mieux pour eux."
 jap_parties.3.t: "Formation du Kaishin-to"
 jap_parties.3.d: "Aujourd'hui marque la création d'un nouveau parti politique, connu sous le nom de Kaishin-to. Le parti est né de la fusion du Kokumin-to et du Nokyo-to, les législateurs du premier formant le noyau de cette entité nouvellement créée. Kaishin-to se positionne comme un parti majoritairement centriste.\n\nAvant la fusion, des délibérations ont eu lieu concernant une éventuelle union avec Nokyo-to. Des inquiétudes ont notamment été exprimées, notamment par des membres de l'ancien Minshu-to, concernant l'adoption de « politiques socialistes modérées ». Malgré ces réserves, un accord fut finalement trouvé, aboutissant à la formation du Kaishin-to. La convention a également vu la participation de membres du Shinsei Club, un groupe dissident du Minsei Kyuyukai (qui est une association d'anciens démocrates d'avant-guerre). Cependant, en raison de désaccords persistants entre les législateurs pro-Ashida et pro-Miki, le poste de président au sein du parti nouvellement formé restera temporairement vacant. Des efforts sont en cours pour résoudre ces divergences et nommer un président dans un avenir proche.\n\nKaishin-to, contrairement à Jiyu-to, a déclaré le programme suivant : plaider pour l'autodéfense indépendante du Japon, créer un esprit national sans radicalisme et mettre en oeuvre des réformes progressistes."
 jap_parties.3.a: "Mais sera-t-il suffisamment compétent ?"
 jap_parties.4.t: "Formation du Nihon Jiyu-to"
 jap_parties.4.d: "Après la tristement célèbre « dissolution de Bakayaro », il y a quelques mois, les législateurs dissidents anti-Yoshida se sont séparés de Jiyu-to, s'unissant sous la direction de Hatoyama. Après leur défaite aux récentes élections générales, la plupart ont rejoint le parti de Yoshida, y compris Hatoyama lui-même. Pourtant, huit dissidents inébranlables, salués comme les Huit Samouraïs, ont défié la tendance. Ensemble, ils ont hardiment déclaré la création du Nihon Jiyu-to (Nijiyu-to en abrégé). Sous la direction d'Ichiro Kono en tant que secrétaire en chef et de Bukichi Miki en tant que consultant suprême, Nijiyu-to émerge avec un objectif unique : démanteler la « domination d'un seul homme » enracinée de Yoshida."
 jap_parties.4.a: "Traîtres !"
 jap_parties.5.t: "Formation du Nihon Minshu-to"
 jap_parties.5.d: "Depuis que le scandale de la construction navale a fait surface et que les procureurs ont ouvert une enquête sur des hauts responsables du parti Jiyu-to au pouvoir, soupçonnés de corruption, le taux d'approbation du cabinet de Yoshida a chuté. Jiyu-to a publié une proposition visant à former un nouveau parti en fusionnant avec le Kaishin-to. Mais la proposition, avancée par le député du Jiyu-to, Taketora Ogata, a rencontré une opposition et l'idée ne s'est pas concrétisée. Au lieu de cela, le Kaishin-to a tenté de créer un nouveau parti visant à contrer Yoshida.\n\nPendant ce temps, Nobusuke Kishi et Tanzan Ishibashi, tous deux législateurs anti-Yoshida au sein de Jiyu-to, et Hitoshi Ashida de Kaishin-to ont décidé de former un nouveau parti visant à contrer Yoshida en mettant en place un comité préparatoire pour la création d'un tel parti. En réponse, Yoshida a expulsé Kishi et Ishibashi du parti tandis que les factions anti-Yoshida au sein de Jiyu-to ont quitté le parti au pouvoir. Aujourd'hui, ces forces s'associent au Kaishin-to et au Nijiyu-to, conduisant à la création du Nihon Minshu-to (Minshu-to en abrégé, §Rà ne pas confondre avec un parti du même nom dissous en 1950§!).\n\nIchiro Hatoyama a été élu président du nouveau parti et Mamoru Shigemitsu a été nommé vice-président."
 jap_parties.5.a: "Opportunistes."
 jap_parties.6.t: "Une fusion conservatrice ?"
 jap_parties.6.d: "Au cours de cette décennie, les conservateurs ont constamment dominé les élections, empêchant toute accession des socialistes au poste de Premier ministre. La division au sein du Shakai-to a joué un rôle central dans la fracture des efforts politiques socialistes. Cependant, la rivalité actuelle entre Yoshida et Hatoyama a laissé le camp conservateur dans le désarroi, ce qui peut mettre en péril sa séquence de victoires. Sentant cette vulnérabilité, des discussions ont émergé entre les ailes droite et gauche du Shakai-to concernant un front uni contre les conservateurs. La perspective d'un Shakai-to uni constitue une menace importante, capable de vaincre les partis conservateurs divisés.\n\nSimultanément, les dirigeants du Jiyu-to et du Minshu-to se retrouvent sous la pression du monde des affaires (Keidanren). Le Keidanren affirme la nécessité d'une coalition conservatrice stable pour contrebalancer l'influence croissante du Shakai-to. Cette urgence découle de l'engagement de Keidanren en faveur de l'innovation technologique et de la rationalisation de la production. Ils soutiennent qu'un gouvernement conservateur stable est essentiel au maintien de relations positives avec les États-Unis ; d'un autre côté, les socialistes prônent ouvertement un programme anti-américain.\n\nAu milieu de ces considérations, il existe un sentiment croissant selon lequel une fusion entre Jiyu-to et Minshu-to devrait être sérieusement envisagée, surtout compte tenu de la nature impérative de la situation. L'insistance du Keidanren sur une action rapide souligne la conviction qu'un front conservateur consolidé est essentiel pour éviter la montée potentielle du Shakai-to et garantir un environnement politique stable propice à leurs intérêts économiques. Il est peut-être préférable de considérer que cela est fait le plus tôt possible."
 jap_parties.6.a: "Convenu."
 jap_parties.7.t: "Discussions pour la fusion conservatrice"
 jap_parties.7.d: "Avec le concept de fusion conservatrice à la lumière, les politiciens conservateurs du parti de Hatoyama et du parti de Yoshida ont réfléchi à ses perspectives. Les principaux acteurs sont le président du comité exécutif de Nihon-to, Bukichi Miki, et le secrétaire général de Jiyu-to, Banboku Ono. Nobusuke Kishi, Taketora Ogata et Mitsujiro Ishii font également partie des partisans de la fusion conservatrice.\n\nCependant, l'opposition de Hatoyama et de Yoshida, ainsi que la rivalité de longue date entre les conservateurs de Honryu et de Boryu en raison des relations complexes entre les bureaucrates d'avant-guerre et les élites politiques, s'avèrent être les principaux obstacles à la progression de la fusion. De plus, il y a eu un désaccord entre Hatoyama et Ono sur les accords de fabrication de saucisses conclus pour faciliter la fusion, en particulier Hatoyama favorisant les vues de Miki par rapport à celles d'Ono."
 jap_parties.7.a: "Mieux vaut se dépêcher."
 jap_parties.8.t: "Le rapport Ogata"
 jap_parties.8.d: "Dans un rapport présenté par un officier de la CIA en interviewant Taketora Ogata, l'actuel président du Jiyu-to, une évaluation complète du paysage politique dévoile des perspectives menant aux prochaines élections générales ainsi que la perspective d'une « fusion conservatrice ». Selon Ogata, le Jiyu-to devrait perdre au maximum dix sièges, tandis que le Minshu-to pourrait potentiellement gagner jusqu'à 20 sièges. Cela pourrait laisser Jiyu-to avec une majorité de 30 sièges, ce qui indiquerait un changement dans le camp conservateur.\n\nOgata a exprimé son désir de fusionner avec Minshu-to, tout en reconnaissant la nécessité d'environ trois mois de travail préparatoire. Il considère les personnalités clés du Minshu-to, notamment le secrétaire général Nobusuke Kishi, le ministre des Finances Hisato Ichimada et le conseiller du Minshu-to Hitoshi Ashida, comme un excellent groupe avec lequel les discussions sur une éventuelle fusion pourraient être fructueuses. Exprimant sa détermination à jeter les bases d'une majorité absolue conservatrice d'ici un an, Ogata n'a pas exclu la possibilité de réviser les lois électorales si cela est jugé nécessaire pour atteindre cet objectif ambitieux.\n\nOgata souligne également la décision de Kyosan-to d'utiliser des méthodes électorales régulières, prévoyant des conséquences à la fois positives et négatives. Du côté positif, Ogata estime que les candidats communistes pourraient diviser le vote de gauche, ce qui pourrait coûter des sièges à Shakai et aider ainsi les conservateurs. Cependant, il note l'inconvénient potentiel que le Kyosan-to pourrait être perçu par le peuple japonais comme un parti parlementaire ordinaire plutôt que comme un outil influencé par l'URSS. Ogata spécule même que le camp socialiste pourrait recevoir une aide financière substantielle de l'étranger, mais il n'existe aucune preuve concrète pour étayer cette affirmation."
 jap_parties.8.a: "Bon à savoir."
 jap_parties.9.t: "Entretien avec Shoriki"
 jap_parties.9.d: "Une visite a été rendue à M. Matsutaro Shoriki (propriétaire de Yomiuri Shimbun, président de Nitteru. Et membre de la Chambre basse) à son domicile de Zushi le dimanche après-midi. La conversation portait principalement sur ses activités politiques au cours des deux dernières années.\n\nIl a déclaré qu'il avait fait de son mieux pour essayer de rapprocher Yoshida et Hatoyama afin de se réconcilier il y a environ 2 ans. Shoriki a rendu visite à Hatoyama à Nirayama. A peine a-t-il abordé le sujet avec Hatoyama, qui était tellement en colère qu'il a quitté la pièce et a refusé de lui parler davantage. Shoriki s'est donc contenté de déjeuner avec Mme Hatoyama et Tomejiro Okubo, l'actuel ministre d'État et directeur général du Hokkaido Development Board, sans accomplir sa mission.\n\nShoriki a déclaré que Yoshida lui avait répété avec insistance qu'il aimerait remettre le gouvernement à Hatoyama le moment venu, et Shorika croyait fermement que cette assurance était de bonne foi jusqu'à ce que Yoshida déclare dans l'interview de presse donnée à Paris lors de son dernier voyage à l'étranger, que les rênes du gouvernement ne peuvent pas être confiées à un « invalide » comme Hatoyama. À partir de ce jour, il dit avoir réalisé qu'il avait été trahi, et il a complètement changé son attitude envers Yoshida et dès le lendemain il a ordonné à Yomiuri de changer sa politique éditoriale pour s'opposer au parti de Yoshida.\n\nLors de la crise politique de novembre dernier, il a déclaré qu'il entretenait des relations étroites avec Banboku Ono, président du conseil exécutif du Jiyu-to et qu'il travaillait à la démission du cabinet Yoshida au lieu de la dissolution de la Diète. Concernant le mouvement actuel de fusion conservatrice, il a même déclaré que c'était lui qui avait amené Bukichi Miki et Bamboku Ono, ennemis traditionnels, à se rencontrer secrètement pour préparer la fusion."
 jap_parties.9.a: "Intéressant."
 jap_parties.10.t: "[GetNewspaperHeader]Shakai-à la réunification"
 jap_parties.10.d: "Lors de la convention spéciale qui s'est tenue aujourd'hui à l'Auditorium Kyoritsu, les ailes droite et gauche de Shakai ont mis de côté leurs différences et se sont réunifiées. Menée par Mosaburo Suzuki de gauche et Jotaro Kawakami de droite, la fusion s'est heurtée à une résistance interne, notamment de la part de Sueshiro Nishio de droite, critique de la position de la gauche sur la révision constitutionnelle et de son alignement sur le radical Sohyo.\n\nMalgré l'opposition, un Shakai-to unifié constitue un formidable défi pour les forces conservatrices, actuellement aux prises avec des divisions internes entre les factions Yoshida et Hatoyama. L'urgence de contrecarrer la menace socialiste a accéléré la fusion conservatrice, alors que les deux camps mènent des négociations pour présenter un front uni contre le Shakai-to."
 jap_parties.10.a: "Bientôt, ce sera notre tour."
 jap_parties.11.t: "Les politiques du nouveau Parti conservateur sont présentées"
 jap_parties.11.d: "Les efforts pour la fusion du camp conservateur entre Jiyu-to et Minshu-to ont redoublé après la réunification de Shakai-to. Après discussions, les grandes lignes de la politique du futur parti conservateur ont été finalisées comme suit :\n\n1. Établissement de principes moraux nationaux et renouvellement de l'éducation, en particulier du système universitaire.\n2. Réformer la fonction politique et civile, ainsi que le système électoral.\n3. Atteindre l'indépendance économique grâce à la stabilisation de la valeur monétaire et à une planification économique à long terme.\n4. Établir un système de protection sociale.\n5. Promouvoir la diplomatie de paix, en mettant l'accent sur les négociations avec l'Union soviétique sur le conflit des Territoires du Nord.\n6. Établir un système indépendant et envisager une réforme constitutionnelle pour maintenir les forces d'autodéfense."
 jap_parties.11.a: "Ça a l'air génial!"
 jap_parties.12.t: "[GetNewspaperHeader]Formation du Parti libéral-démocrate"
 jap_parties.12.d: "Aujourd'hui marque un moment historique dans la politique japonaise alors que les factions conservatrices de Jiyu-to et Minshu-laissent de côté leurs divergences et leur opposition, s'unissant pour former un puissant front conservateur. Ce parti uni apparaît comme une force opposée au camp socialiste récemment uni, présentant un changement significatif dans le paysage politique. La question cruciale de la présidence du parti reste en délibération, ce qui a conduit à la création d'un comité présidentiel de quatre membres. Ce comité, composé d'Ichiro Hatoyama, Bukichi Miki, Taketora Ogata et Banboku Ono, jouera un rôle décisif dans la détermination de la future direction du parti nouvellement formé.\n\nGrâce à cette unité, il semble que les forces conservatrices aient effectivement neutralisé la menace perçue comme posée par la faction socialiste, marquant ainsi un tournant dans la dynamique politique du Japon."
 jap_parties.12.a: "Banzaï !"
 jap_parties.12.b: "Intéressant."
 jap_parties.13.t: "Dissolution de Rono-to"
 jap_parties.13.d: "Le parti d'extrême gauche, aux idéaux maoïstes, a été dissous après qu'environ deux mille de ses militants ont quitté le parti pour le Shakai-to, mettant fin à un parti déjà en difficulté depuis dix ans."
 jap_parties.13.a: "Bien?"
 jap_parties.14.t: "Différend Morito-Inamura"
 jap_parties.14.d: "Un conflit au sein du parti éclata lors du Quatrième Congrès du Shakai-to en 1949, centré sur le projet de politique de campagne. Tatsuo Morito et Junzo Inamura, représentant respectivement les factions de droite et de gauche du parti, se sont retrouvés dans un affrontement controversé, chacun défendant ses propositions distinctes. La position de Morito décrivait le parti comme un « parti national », s'alignant sur les principes anticommunistes dans le cadre des règles parlementaires. À l'inverse, la proposition d'Inamura décrivait le parti comme un « parti de classe » visant à révolutionner le système social, en collaborant potentiellement avec Kyosan-to et d'autres législateurs d'extrême gauche.\n\nFinalement, sous la médiation de Seiichi Katsumada, une résolution a émergé, définissant le caractère du parti dans la politique de campagne comme « une organisation démocratique des larges masses ouvrières, avec la classe ouvrière en son noyau, englobant les paysans, les petites et moyennes entreprises et la classe intellectuelle ». Le ton général de la politique de campagne penchait fortement vers une perspective de gauche. En conséquence, Mosaburo Suzuki, représentant la faction de gauche, a assumé le poste de secrétaire général, remplaçant ainsi Inajiro Asanuma, de droite. Ce changement n'a fait qu'approfondir le fossé idéologique entre la gauche et la droite au sein du parti.\n\nCet épisode historique préfigure l'archétype des futurs conflits au sein du parti, illustrant les défis persistants liés à la réconciliation d'idéologies divergentes au sein du Shakai-to."
 jap_parties.14.a: "Intéressant."
 jap_parties.15.t: "Nihon Shakai-to se sépare !"
 jap_parties.15.d: "Inévitablement, le Shakai-to a subi une fracture importante après des mois de conflits internes entre ses factions de droite et de gauche. Les racines de cette division remontent à 1945, lorsque le parti a fusionné diverses factions prolétariennes, chacune nourrissant des interprétations diverses et souvent contradictoires du socialisme.\n\nLes premières fissures au sein du Shakai-to sont devenues apparentes en 1948 lorsque six membres de gauche ont été évincés du cabinet Ashida, une décision destinée à réprimer l'opposition au plan budgétaire. Les tensions se sont intensifiées à mesure que la popularité de la droite diminuait, notamment à la suite du fameux scandale Showa Denko. La controverse Morito-Inamura, survenue deux ans auparavant, a encore alimenté la discorde, dans la mesure où les politiques de campagne des ailes opposées contredisaient clairement les idéaux de chacun. L'influence de la gauche s'est notamment développée grâce au soutien substantiel des syndicats Sohyo, une tendance qui s'est accentuée pendant la guerre de Corée. Aujourd'hui, le coup final porté à cette unité déjà fragile a eu lieu lors d'un différend sur l'approbation du Traité de San Francisco. La droite, favorable à cette proposition, affirmait que son acceptation serait le seul moyen réaliste de recouvrer la souveraineté du Japon ; l'aile gauche, qui s'y opposait, affirmait que l'acceptation amènerait le Japon à rejoindre officiellement le bloc occidental, contrariant ainsi l'URSS.\n\nPar conséquent, Shakai-to est désormais divisé en deux factions. Le parti de droite Shakai-to Uha, dirigé par Jotaro Kawakami, adhère à une politique modérée. De l'autre côté, le parti de gauche Shakai-to Saha, dirigé par Mosaburo Suzuki, poursuit résolument une politique révolutionnaire affirmée, alimentée par l'anti-américanisme et le rejet du traité de sécurité américano-japonais. Cette rupture pourrait laisser présager un déclin potentiel du socialisme au Japon, du moins dans un avenir immédiat."
 jap_parties.15.a: "Des temps incertains."
 
 jap_jcp.1.t: "Différend entre le Shokan-ha et le Kokusai-ha"
 jap_jcp.1.d: "Dans la dernière édition de \"Pour une paix durable, pour une démocratie populaire!\", une publication du Cominform, un article a été publié critiquant les principes prônés par Sanzo Nosaka, le leader du Kyosan-to. Sa qualification des forces d'occupation américaines comme « l'armée de libération » et sa proposition d'instaurer le communisme au Japon par le biais d'une « révolution pacifique » ont été mal vues. L'article allait plus loin en dénonçant les idéaux de Nosaka comme une simple glorification des « mauvais capitalistes », trompant la population japonaise et s'écartant du véritable esprit du marxisme-léninisme.\n\nCette critique a porté un coup dur à la structure du Kyosan-to, déclenchant des discordes internes sur la manière de répondre à la censure. La faction dominante du parti, sous la direction de Kyuichi Tokuda, a rejeté les critiques du Kominform et a publié une réfutation, arguant qu'elle n'avait pas pris en compte les réalités pratiques du Japon. Cependant, Kenji Miyamoto a adopté une position contraire, plaidant pour la reconnaissance et le respect des critiques du Kominform. Il est allé jusqu'à qualifier Tokuda et ses partisans d'« opportunistes de droite » et de « titistes ». Par conséquent, le parti s'est retrouvé divisé alors que les tensions s'intensifiaient entre deux factions : le Shokan-ha, dirigé par Kyuichi Tokuda et Shigeo Shida, et le Kokusai-ha, dirigé par Kenji Miyamoto et Yoshio Shiga."
 jap_jcp.1.a: "Ce n'est pas la première fois qu'un parti est confronté au factionnalisme."
 jap_jcp.2.t: "Incident au Kokyogaien"
 jap_jcp.2.d: "Le Front populaire démocratique, parrainé par le Kyosan-to, a organisé un rassemblement de 50 000 personnes dans le jardin national Kokyogaien, devant le palais impérial de Chiyoda, à Tokyo. Apparaissant initialement comme une manifestation pacifique, l'événement a rapidement tourné au chaos lorsque des policiers infiltrés ont tenté d'appréhender un individu qui avait infiltré le rassemblement, déclenchant une bagarre avec le personnel de sécurité chargé de surveiller le rassemblement. Par la suite, huit étudiants travailleurs, dont le président du comité de Tokyo de la Ligue démocratique de la jeunesse, ont été arrêtés.\n\nEn réponse aux violences qui ont suivi, la police métropolitaine a imposé une interdiction temporaire de rassemblements publics similaires à Tokyo. De plus, le QG du SCAP et le gouvernement ont émis des directives visant à expulser de leurs fonctions publiques 24 membres du Comité central du Kyosan-to et à suspendre temporairement Akahata Shimbun, un journal affilié au Comité central du Kyosan-to."
 jap_jcp.2.a: "Ce n'est pas la première fois que cela se produit, et ce ne sera pas non plus la dernière."
 jap_jcp.3.t: "4e Convention nationale de Kyosan-to"
 jap_jcp.3.d: "Lors de la 4e Convention nationale de Kyosan-to, une politique militante a été proposée et prise en considération, qui est la suivante :\n\n     \"Nous devons mener une lutte inflexible contre les impérialistes et les traîtres américains, développer une lutte d'autodéfense et diriger une force militante. La classe ouvrière doit organiser de petits groupes militants pour disperser, perturber et attaquer les forces armées de l'ennemi.\n     Les bases militantes dans les zones rurales doivent toujours être intégrées aux centres urbains et développées sous la direction de la classe ouvrière. Ils ont besoin d'une forteresse à partir de laquelle se défendre et progresser contre leurs adversaires. La base principale des militants sera gérée de manière centralisée, servant de centre de résistance régionale, s'étendant aux terrains montagneux et aux villages. Ces localités ont joué un rôle central dans le façonnement de la société rurale pendant des siècles et peuvent se targuer d'un héritage de soulèvements paysans révolutionnaires. Dans de nombreux cas, des villages entiers ont succombé à la destruction en l'espace de deux ou trois ans sous l'effet de l'oppression féodale, de l'exploitation, d'une fiscalité excessive, de subventions et d'un chômage croissant. Ces paysans ont donc deux options : la destruction ou la révolution.\n     Pour les régions et les villages montagneux, il est impératif que les travailleurs entreprennent des efforts révolutionnaires et établissent les bases nécessaires à de tels efforts. Plus précisément, il est essentiel de poser les bases telles que les zones arrière de Keihin, Hanshin, Kitakyushu, Chukyo, Sorachi et Sapporo.\n     Les militants sont une arme pour le développement d'un front national uni de salut anti-américain et seront menés dans le but de se transformer en une armée populaire de libération. »"
 jap_jcp.3.a: "Aventurisme typique d'extrême gauche."
 jap_jcp.4.t: "Plate-forme 1951"
 jap_jcp.4.d: "Aujourd'hui, le Kyosan-to a convoqué sa 5e Convention nationale, au cours de laquelle il a finalisé son ordre du jour et adopté une politique militante décrite dans son document « Plateforme de 1951 », une idée initialement proposée lors de sa 4e Convention.\n\nLa Plate-forme de 1951 déclare que le Japon contemporain reste une nation semi-féodale, opprimée par « l'impérialisme américain ». Par conséquent, la mission du Kyosan-to est de diriger une « révolution de libération nationale », visant à libérer la nation japonaise de la domination américaine et à démanteler les « forces réactionnaires semi-féodales » présentes au Japon. Rejetant la notion de « révolution pacifique », la plateforme souligne que la transformation du Japon nécessite la lutte armée et le recours à la force, rejetant l'idée d'approches démocratiques et pacifistes.\n\nLe programme affirme en outre l'impératif de protéger « nos camarades » des forces armées de l'adversaire et, en fin de compte, de les vaincre pour renverser le gouvernement Yoshida. La stratégie des militants se concentre sur la neutralisation de « l'ennemi » à travers la défiance coordonnée des unités partisanes ouvrières et paysannes et le soulèvement armé du prolétariat."
 jap_jcp.4.a: "Un groupe communiste recourant à la violence ? Sans surprise."
 jap_jcp.5.t: "[GetNewspaperHeader]Incident de tir de l'inspecteur Shiratori"
 jap_jcp.5.d: "À Sapporo, un meurtre s'est produit lorsque Kazuo Shiratori, chef du département de sécurité de la police de la ville de Sapporo, a été abattu par un cycliste inconnu alors qu'il rentrait chez lui par une sombre soirée. Son corps a été transporté à l'hôpital universitaire d'Hokkaido pour une autopsie, où il a été déterminé qu'un pistolet Browning de calibre.32 avait été utilisé.\n\nLes soupçons se sont immédiatement portés sur les Kyosan-to, car ils avaient envoyé des menaces à l'inspecteur Shiratori par courrier avant l'incident. Apparemment, il s'agissait de représailles contre la police de Sapporo, sous les ordres de l'inspecteur Shiratori, qui avait interrompu une exposition de dessins sur les bombardements nucléaires organisée par le comité local de Kyosan-to. De nombreux membres du Kyosan-to ont été arrêtés ce jour-là pour avoir perturbé des sit-in, décrivant l'inspecteur Shiratori comme un « oppresseur fasciste » à leurs yeux."
 jap_jcp.5.a: "Cela semble louche."
 jap_jcp.6.t: "Incident de Suita"
 jap_jcp.6.d: "Avec la guerre de Corée en cours, le Japon est devenu une plaque tournante de la logistique et des fournitures de secours pour les forces de l'ONU, le Premier ministre Yoshida soutenant pleinement ces efforts. Cependant, cette position a suscité des critiques de la part des militants de gauche et anti-guerre, notamment du Kyosan, qui sympathisent avec leurs sentiments et les exploitent pour renforcer leurs activités militantes.\n\nAujourd'hui, les Zengakuren ont orchestré un rassemblement contre la guerre, attirant environ un millier de participants sur le campus Toyonaka de l'université d'Osaka. Les manifestants se sont opposés à la présence de l'armée américaine au Japon et ont plaidé pour l'interruption des approvisionnements militaires facilités par le gouvernement japonais. Le rassemblement a dégénéré en violence alors que la foule enragée a redirigé sa marche vers le chantier ferroviaire de Suita, une installation clé pour le transport des provisions militaires de l'ONU. En cours de route, ils ont vandalisé la résidence de Ryoichi Sasakawa, un éminent militant de droite et défenseur pro-américain. En convergeant vers Suita, les manifestants ont scandé des slogans anti-guerre et ont exigé l'arrêt des trains de marchandises. Par la suite, des affrontements ont éclaté lorsque la foule a lancé des pierres et des cocktails Molotov sur les postes de police, les voitures de patrouille et le véhicule du général de brigade américain Carter W. Clark, le laissant grièvement blessé. Alors que les manifestants tentaient de monter à bord d'un train pour leur prochaine destination, ils ont été interceptés par une trentaine de policiers, déclenchant un affrontement sur le quai de la gare.\n\nL'altercation a fait des blessés parmi les manifestants, les forces de l'ordre et des passants innocents. Par la suite, 200 personnes ont été arrêtées, dont 111 accusées de sédition. La rumeur dit que les Chuukaku Jietai étaient plus ou moins impliqués."
 jap_jcp.6.a: "La politique d'après-guerre est vraiment quelque chose."
 jap_jcp.7.t: "Incident d'émeute d'Osu"
 jap_jcp.7.d: "Au stade Osu de Nagoya, environ 7 000 personnes se sont rassemblées pour un événement de bienvenue en l'honneur de Kei Hoashi et Kisuke Miyakoshi, les représentants du Shakai-to qui ont récemment visité l'URSS et la Chine communiste, marquant la première visite de ce type de responsables japonais depuis la fin de la guerre. Leur retour a suscité une attention particulière de la part de divers groupes de gauche, notamment de la communauté Zainichi pro-RPDC.\n\nA leur arrivée, les deux représentants ont été chaleureusement accueillis par des applaudissements et se sont vu offrir des banquets avant de prononcer leurs discours de rapport. Suite à leurs discours, un étudiant de l'Université de Nagoya s'est approché de la tribune et a exprimé son mécontentement face aux événements de la veille, critiquant l'intervention de ce qu'il a qualifié de « police oppressive » pour disperser les manifestations lors de l'arrivée des représentants. Il a exhorté le public à se joindre à lui pour protester contre la police. En réponse, l'hôte de l'événement, le directeur Nagamitsu Ito, a rapidement annoncé la clôture de l'événement. Cependant, le discours passionné avait déjà enflammé le public, conduisant à des chants d'accord avec les sentiments de l'étudiant.\n\nLa foule, qui compte désormais environ 1 500 personnes, est devenue de plus en plus agitée, brandissant des drapeaux rouges à mesure qu'elle sortait du stade. Certains individus se sont armés de cocktails Molotov et de lances en bambou, entraînant la destruction d'un fourgon de diffusion de la police et le vandalisme de plusieurs véhicules. Les tentatives de la police pour réprimer l'émeute n'ont servi qu'à provoquer davantage les manifestants, aboutissant à des violences. Au cours du chaos qui a suivi, un lycéen de Zainichi a été mortellement blessé par balle à la tête.\n\nAu total, 84 personnes ont été blessées, dont 150 ont finalement été inculpées et accusées d'incitation à la violence. Les rapports de police suggèrent l'implication probable du groupe Kyosan-to dans l'incitation à la violence en collaborant avec des factions radicales au sein de la communauté Zainichi."
 jap_jcp.7.a: "Tragique."
 jap_jcp.8.t: "[GetNewspaperHeader]1Er mai sanglant"
 jap_jcp.8.d: "Trois jours après la fin de l'occupation, le 1er mai (jour traditionnel des manifestations Sayoku), les Sohyo ont orchestré des manifestations pacifiques à l'échelle nationale pour exprimer leur mécontentement à l'égard du traité « unilatéral » entre le Japon et les États-Unis. Cependant, à Tokyo, les factions Kyosan-to et radicales Zengakuren ont infiltré les manifestations pacifiques, les rendant violentes. Les manifestants ont pris le contrôle de Kokyogaien, qui était fermé au public ce jour-là, et y ont organisé des manifestations. Néanmoins, les forces de l'ordre sont rapidement intervenues, exigeant que les manifestants quittent immédiatement la place. En réponse à l'agression, les manifestants agités ont brandi des cocktails Molotov, des lances en bambou et des battes de baseball. Les passants américains, notamment des soldats et des journalistes, sont devenus des cibles et ont été agressés, mais ils ont finalement été secourus par la police. Finalement, les forces de l'ordre ont tiré des coups de semonce, certains dirigés vers la foule, faisant deux morts. La foule s'est finalement dispersée, quittant la place paniquée, incendiant des véhicules militaires américains sur le chemin et s'engageant dans de nouveaux affrontements avec la police. Dans la foulée, plus de deux mille personnes ont été blessées et 1 232 arrestations ont été effectuées."
 jap_jcp.8.a: "Il semble que les troubles persisteront même après la fin de l'occupation."
 jap_jcp.9.t: "Les militants de Kyosan-to prennent les armes"
 jap_jcp.9.d: "La tristement célèbre Plateforme du Kyosan-to de 1951 vient d'être enfin mise en oeuvre, avec des groupes militants affiliés prenant les armes dans l'intention d'inciter à la violence dans diverses zones rurales et suburbaines. Baptisés Chuukaku Jietai, les principales activités de ces groupes consistent à incendier des commissariats de police avec des cocktails Molotov et à orchestrer des émeutes armées. De plus, ils sont équipés de bombes incendiaires artisanales illégales, de gaz lacrymogènes et de dispositifs anti-crevaison, tous fabriqués à partir de brochures et de livres de référence acquis illégalement. Les extrémistes communistes ont également créé des groupes de cadres connus sous le nom de Sanson Kosakutai et les ont envoyés dans les villages de montagne pour tenter de persuader et de recruter des agriculteurs à leur cause.\n\nLe Kyosan-to travaille activement au renforcement de son système de cellules clandestines en créant de petits comités dans divers établissements d'enseignement et en recherchant l'aide volontaire des extrémistes de Zengakuren."
 jap_jcp.9.a: "Une menace pour la paix publique."
 jap_jcp.10.t: "Les dirigeants du Shokan-ha fuient vers la Chine communiste"
 jap_jcp.10.d: "Au Japon, après l'incident du Kokyogaien, le Comité central du Kyosan-to s'est vu interdire toute fonction publique conformément aux directives du gouvernement. Néanmoins, le Bureau d'enquête spécial du ministère de la Justice a reçu des renseignements indiquant que les dirigeants du Kyosan-to se sont réunis à Kinugawa Onsen à Tochigi. Malgré l'interdiction imposée des fonctions publiques, des discussions ont eu lieu concernant l'avancement des activités politiques et la restructuration des partis. En réponse, le Bureau d'enquête, citant la loi sur la réglementation des groupes, a rendu obligatoire la comparution des parties impliquées devant le tribunal. Cependant, neuf responsables de Kyosan-to ont échappé à cette obligation et se sont cachés, ce qui a conduit à l'émission de mandats d'arrêt contre chaque individu.\n\nMalgré les mandats d'arrêt, certains responsables, notamment Kyuichi Tokuda, Sanzo Nosaka, Takaji Nishizawa et d'autres membres éminents du Shokan-ha, ont réussi à échapper à leur arrestation et ont élaboré des plans pour fuir le Japon. En coordination avec le Parti communiste chinois par l'intermédiaire d'intermédiaires, ils attendaient le signal pour procéder. Après avoir reçu le feu vert, ils sont partis pour la Chine communiste via un bateau depuis Osaka. Dans leur nouvel asile à [PRC.capital.GetName], ils visent à reprendre leurs activités politiques tout en maintenant la communication avec les membres restants du Kyosan-to au Japon."
 jap_jcp.10.a: "Vous ne pouvez pas vous enfuir pour toujours !"
 jap_jcp.10.b: "Bienvenue à nos camarades communistes !"
 jap_jcp.11.t: "6e Convention nationale de Kyosan-to"
 jap_jcp.11.d: "Au cours de sa 6e Convention nationale, le Kyosan-to a subi des changements importants tant au niveau de sa direction que de son programme. L'assemblée a marqué un moment solennel avec l'annonce du décès de Kyuichi Tokuda, ancien leader du Kyosan-to et figure clé du mouvement, décédé deux ans auparavant en Chine. Notamment, les Kokusai-ha exerçaient une influence majoritaire au sein du parti, éclipsant leurs homologues du Shokan-ha. Cependant, avec l'intention de maintenir l'unité du parti et d'éviter d'éventuelles divisions, le Comité central a décidé de nommer Sanzo Nosaka du Shokan-ha comme nouveau chef.\n\nUn énorme changement de politique s'est produit lors de cette convention, centré sur l'autocritique des dirigeants concernant la Plate-forme de 1951. Ils l'ont collectivement dénoncé comme un « aventurisme d'extrême gauche ». En conséquence, le Kyosan-to a mis fin à son soutien financier aux groupes militants Chuukaku Jietai, revenant à son ancien programme de promotion d'une « révolution pacifique ». Ce changement englobe le rejet de la violence et un engagement à acquérir le pouvoir par des moyens démocratiques.\n\nCependant, cette réorientation stratégique n'a pas été sans répercussions, car elle a semé la méfiance entre les Kyosan-to et Zengakuren. Ces derniers, mécontents de l'adoption de politiques pacifiques, restent attachés à une approche plus militante, favorisant un désir de lutte violente."
 jap_jcp.11.a: "Il est peu probable que ce soit la dernière des violences de gauche."


