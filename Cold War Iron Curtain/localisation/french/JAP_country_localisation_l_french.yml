 JAP_battle_hull_light_2: "Classe Haruna"
 JAP_battle_hull_light_2_desc: "Le destroyer de classe Haruna était une classe de destroyers construite pour la Force maritime d'autodéfense japonaise (JMSDF) au début des années 1970. Ces destroyers porte-hélicoptères (DDH) sont construits autour d'un grand hangar central pouvant accueillir jusqu'à trois hélicoptères."
 JAP_battle_hull_light_3: "Classe Shirane"
 JAP_battle_hull_light_3_desc: "Les destroyers de classe Shirane étaient deux destroyers japonais construits à la fin des années 1970. Ils sont construits autour d'un grand hangar central pouvant accueillir jusqu'à trois hélicoptères et sont les successeurs naturels des destroyers de classe Haruna."
