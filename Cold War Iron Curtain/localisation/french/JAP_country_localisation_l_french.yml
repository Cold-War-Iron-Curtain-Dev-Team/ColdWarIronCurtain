 # National Radicalism Category
 JAP_National_Radicalism_Category: "Problèmes de radicalisme national et de troubles"
 JAP_National_Radicalism_GUI_desc: "\n\n\n\n\n£GFX_JAP_National_Radicalism_Category_Banner\n\n\n\n\n\n\nAu lendemain de la guerre, le Japon est confronté à la montée de l'extrémisme politique. Les radicaux des §Rgauche (sayoku)§! et §Bdroite (uyoku)§! remettent en question le statu quo conservateur construit pendant l'occupation américaine.\n\nLe §RNihon Shakai-to (JSP)§! est la plus grande force de gauche du pays, à la tête du camp socialiste. Cependant, le parti est souvent aux prises avec des divisions internes et doit également rivaliser avec la domination du camp conservateur. Malgré cela, le camp socialiste est très efficace en apportant un immense soutien aux syndicats ainsi qu'au §RZengakuren§!et en les utilisant pour troubler l'administration conservatrice. En revanche, la droite radicale est plus dissolue, composée de divers §BUyoku Dantai§! (groupes ultra-nationalistes). Il y a aussi la présence des clans §BYakuza§!, qui utilisent souvent leur richesse et leur pouvoir contre les mouvements d'extrême gauche. Même si les partis ultranationalistes possèdent une influence minime à la Diète nationale par rapport à leurs homologues socialistes, l'importance croissante de l'extrême droite pourrait potentiellement donner naissance à des factions ultranationalistes au sein du camp conservateur.\n\nLe Japon aspire à suivre un statu quo conservateur stable et à atteindre la prospérité. Mais si un camp domine, il pourrait être confronté à un changement significatif du paysage politique."
 JAP_Power_Equillibrium_title: "Équilibre du radicalisme"
