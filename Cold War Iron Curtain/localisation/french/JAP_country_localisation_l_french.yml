 JAP_export_drive: "Industries d'exportation"
 JAP_export_drive_desc: "Les acheteurs étrangers s'attendent à des moteurs et des radios fiables qui fonctionnent dès la sortie de la caisse. Les fabricants japonais réorganisent leurs chaînes de production pour répondre à ces normes, tandis que les maisons de commerce organisent les matériaux et les commandes qui permettent aux usines de fonctionner."
 JAP_MITI_guidance: "Orientation industrielle du MITI"
 JAP_MITI_guidance_desc: "Le ministère du Commerce international et de l'Industrie travaille avec les entreprises d'électronique pour améliorer les méthodes de production et sécuriser les importations essentielles. L'accès aux machines et aux accords techniques aide les fabricants à transformer des matériaux rares en biens vendables."
 JAP_MITI_industrial_guidance: "Coordonner les investissements en électronique"
 JAP_MITI_industrial_guidance_desc: "Amener les fabricants d'électronique en consultation avec le ministère du Commerce international et de l'Industrie. Des investissements coordonnés et une aide pour l'obtention de composants importés peuvent donner aux entreprises les moyens d'augmenter leur production."
