 ### National Focus Description ###
 JAP_The_Kishi_Administration_desc: "La longue domination de Shigeru Yoshida étant finalement brisée, un courant conservateur plus dur et plus ambitieux accède au pouvoir sous la direction de Nobusuke Kishi. L'administration Kishi ne cherche pas seulement la stabilité et le redressement, mais aussi une réaffirmation de l'autonomie politique japonaise, une autorité de l'État plus forte et un rôle plus actif dans l'ordre de la guerre froide."
 JAP_Establish_Diplomatic_Relations_with_Eastern_Europe_desc: "L'anticommunisme de Kishi ne l'empêche pas de poursuivre une diplomatie pragmatique. En ouvrant des canaux formels vers l'Europe de l'Est, le Japon pourrait élargir sa marge de manoeuvre, développer ses échanges commerciaux et démontrer que Tokyo n'est pas un simple appendice de Washington."
 JAP_Compensations_for_Vietnam_desc: "La guerre et l'occupation ont laissé de profondes cicatrices à travers l'Asie, et Kishi comprend que l'influence japonaise ne peut pas revenir sans s'attaquer à l'héritage de l'empire. Une compensation accordée au Vietnam peut servir à la fois de restitution et d'ouverture à des liens économiques et politiques renouvelés."
 JAP_War_Reparations_for_Indonesia_desc: "L'Indonésie est trop importante pour être ignorée : riche en ressources, stratégiquement située et centrale au rayonnement économique du sud du Japon. Les réparations, si elles sont gérées avec compétence, peuvent passer du statut de fardeau à celui de fondement d'un partenariat durable."
 JAP_Pearl_of_Asia_desc: "Kishi rêve d'un Japon restauré non seulement en richesse, mais aussi en prestige. Si Tokyo peut diriger l'Asie grâce au commerce, à la diplomatie et à la vitalité industrielle, la nation peut encore reconquérir une place d'honneur en tant que perle de l'Asie."
 JAP_Ramp_Up_the_Constitutional_Debate_desc: "Pour Kishi, la constitution d'après-guerre reste un symbole de défaite et d'imposition étrangère. En intensifiant le débat public et parlementaire, son gouvernement peut préparer le terrain pour un ordre constitutionnel plus souverain et plus affirmé."
 JAP_Overcome_the_Lingering_Legacy_of_the_Occupation_desc: "Même si l'occupation a officiellement pris fin, son empreinte juridique, politique et psychologique continue de façonner l'État japonais. Kishi a l'intention de supprimer ces contraintes persistantes et de prouver que le Japon se gouverne désormais selon ses propres conditions."
 JAP_Invest_in_New_Domestic_Destroyers_desc: "Une arme maritime revitalisée est essentielle à toute politique de défense nationale sérieuse. L'expansion de la construction nationale de destroyers renforcera les chantiers navals japonais, approfondira l'autonomie militaire et indiquera que le réarmement n'est plus une perspective lointaine."
 JAP_Request_Release_of_Remaining_War_Criminals_desc: "Beaucoup à droite considèrent les procès d'après-guerre comme une justice des vainqueurs plutôt que comme une loi impartiale. Faire pression pour la libération des prisonniers restants rallierait le sentiment nationaliste et soulignerait l'effort plus large de Kishi pour réviser l'héritage moral de la défaite."
 JAP_Five_Million_Nationwide_Membership_Campaign_desc: "Dans le Japon d'après-guerre, le pouvoir n'est pas assuré uniquement par l'idéologie, mais aussi par l'organisation. Une vaste campagne d'adhésion peut transformer la sympathie conservatrice en une machine politique disciplinée, capable de surpasser la gauche dans chaque préfecture."
 JAP_Push_for_Single_Member_Districts_desc: "La réforme électorale offre une voie pour remodeler le champ de bataille lui-même. En faisant pression pour des circonscriptions uninominales, Kishi espère stabiliser le régime conservateur, affaiblir la fragmentation factionnelle et réduire l'influence parlementaire de l'opposition."
 JAP_Remove_the_Opposition_From_Committee_Chair_Positions_desc: "L'opposition utilise depuis longtemps des leviers procéduraux au sein de la Diète pour faire obstacle aux programmes conservateurs. En les supprimant des présidents de comités clés, Kishi peut centraliser le contrôle et garantir que la législation gouvernementale soit soumise à ses conditions."
 JAP_Withdraw_the_Police_Duties_Bill_desc: "Kishi est peut-être énergique, mais il n'est pas aveugle à la réalité politique. Si le projet de loi sur les fonctions de police devient trop coûteux, un retrait tactique pourrait préserver le cabinet, calmer les rues et permettre au gouvernement de se battre un autre jour."
 JAP_School_Curriculum_and_Teachers_Efficiency_Rating_System_Reforms_desc: "La salle de classe est une arène politique au même titre que la Diète. Réformer les programmes scolaires et renforcer la surveillance des enseignants aiderait les conservateurs à réduire l'influence de la gauche, à inculquer la discipline civique et à façonner les valeurs d'une nouvelle génération."
 JAP_Take_Control_of_the_M_Fund_desc: "Des rumeurs et des intrigues entourent le mystérieux M-Fund, un réservoir de richesse et d'influence secrètes dans le Japon d'après-guerre. Si Kishi parvient à le mettre sous son orbite, il gagnera non seulement de l'argent, mais aussi un instrument de patronage, de manipulation et de survie politique."
 
 ### Decisions ###
 JAP_Anpo_Protests_Category: ""
 JAP_Anpo_Protests_Category_desc: "\n\n\n\n\n£GFX_JAP_Anpo_Protests_Category_Banner\n\n\n\n\n\n\nLa révision du Traité de sécurité §Yentre les États-Unis et le Japon§! a déclenché une tempête à travers le pays. Le Premier ministre §YNobusuke Kishi§! insiste sur le fait que le nouveau traité restaurera une plus grande égalité au sein de l'alliance et garantira la place du Japon au sein de l'ordre de sécurité du Pacifique §G§!. Pour Washington, l'accord représente la consolidation du Japon en tant que partenaire fiable de la guerre froide en Asie de l'Est.\n\nPourtant, dans les rues de Tokyo, une vision très différente du Japon se dessine. Étudiants, syndicats, socialistes, intellectuels et citoyens ordinaires se sont rassemblés en grand nombre, dénonçant le traité comme un symbole de la §Rdomination militaire américaine§! et une trahison de la démocratie d'après-guerre. Le souvenir de la guerre reste frais et beaucoup craignent que le nouveau dispositif de sécurité n'entraîne une fois de plus le Japon dans des conflits au-delà de ses frontières.\n\nAlors que les manifestations se multiplient devant la Diète nationale, le gouvernement est confronté à une crise de légitimité. Le traité pourrait être adopté, mais le coût politique pourrait être sévère. L'avenir du Japon se situe désormais entre §Gla sécurité sous l'alliance américaine§! et §Rles troubles intérieurs nés des souvenirs non résolus de la guerre§!.\n"

