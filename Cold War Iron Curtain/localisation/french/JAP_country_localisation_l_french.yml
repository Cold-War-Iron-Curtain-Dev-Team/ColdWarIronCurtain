 JAP_Article_Nine: "Article 9"
 JAP_Article_Nine_desc: "La Constitution du Japon, comme le stipule son article 9, renonce à la guerre en tant que droit souverain et moyen de régler les différends internationaux. Par conséquent, tout potentiel de guerre ne sera jamais maintenu et doit être strictement limité à des fins d'autodéfense."
