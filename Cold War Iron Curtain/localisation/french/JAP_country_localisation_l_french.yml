  # Submarine Hulls #
 JAP_sub_hull_small_single_0: "Classe Natsushio"
 JAP_sub_hull_small_single_0_desc: ""
 JAP_sub_hull_small_single_1: "Classe Asashio"
 JAP_sub_hull_small_single_1_desc: "Le sous-marin de classe Asashio est une classe de sous-marins de la Force maritime d'autodéfense japonaise. Cette classe est le successeur d'Oshio."
 JAP_sub_hull_small_single_2: "Réaménagement de la classe Asashio"
 JAP_sub_hull_small_single_2_desc: "Le sous-marin de classe Asashio est une classe de sous-marins de la Force maritime d'autodéfense japonaise. Cette classe est le successeur d'Oshio."
 JAP_sub_hull_small_single_3: "Classe Oyashio"
 JAP_sub_hull_small_single_3_desc: "La classe Oyashio est une série de sous-marins d'attaque diesel-électriques japonais exploités par la JMSDF. Les sous-marins sont entrés en service à la fin des années 1990. Les sous-marins sont plus grands que la classe Harushio précédente, afin de fournir de l'espace pour un réseau de sonars de flanc."
 JAP_sub_hull_small_single_4: "Classe Soryu"
 JAP_sub_hull_small_single_4_desc: "Les sous-marins de classe Soryu (16SS) sont des sous-marins d'attaque diesel-électriques. Le premier bateau de cette classe est entré en service dans la Force maritime d'autodéfense japonaise en 2009."

 JAP_sub_hull_large_single_0: "Classe Oyashio"
 JAP_sub_hull_large_single_0_desc: "JDS Oyashio (SS-511) était un sous-marin de la Force maritime d'autodéfense japonaise, du nom du courant Oyashio, un courant froid qui traverse le détroit de Béring. "
 JAP_sub_hull_large_single_1: "Classe Oshio"
 JAP_sub_hull_large_single_1_desc: "Le JDS Oshio (SS-561) était le seul navire de ce type en service dans la Force maritime d'autodéfense japonaise. Oshio a été planifié et construit pour remplacer le JDS Kuroshio vieillissant."
 JAP_sub_hull_large_single_2: "Classe Uzushio"
 JAP_sub_hull_large_single_2_desc: "Le sous-marin de classe Uzushio (Whirlpools) était une série de sous-marins en service dans la Force d'autodéfense maritime japonaise qui était la première génération du sous-marin de type larme qui évaluait les performances sous-marines par rapport à celles de la classe Asashio de type à coque conventionnelle."
 JAP_sub_hull_large_single_3: "Classe Yushio"
 JAP_sub_hull_large_single_3_desc: "La classe Yushio était une classe de sous-marins diesel-électriques japonais exploitée par la JMSDF. Il s'agissait d'un sous-marin de deuxième génération, un développement de la classe Uzushio, intégrant une coque en forme de larme, ce qui entraînait une augmentation des performances sous-marines de la classe Uzushio."
 JAP_sub_hull_large_single_4: "Classe Harushio"
 JAP_sub_hull_large_single_4_desc: "La classe Harushio est une classe de sous-marins diesel-électriques exploitée par la Force maritime d'autodéfense japonaise (JMSDF). Le design est une évolution de la classe Yushio, étant légèrement plus grand et offrant une meilleure réduction du bruit. "
 
