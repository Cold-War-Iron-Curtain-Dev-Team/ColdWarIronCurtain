 ### National Focus Description ###
 JAP_The_Yoshida_Administration_desc: "Dans les années incertaines qui ont suivi la dévastation de la guerre, alors que le Japon se trouvait au milieu des cendres de la défaite et de l'occupation, la nécessité d'un leadership calme et stable est devenue douloureusement évidente. C'est dans ce moment fragile que Shigeru Yoshida, diplomate chevronné et patriote pragmatique, a été appelé à guider la nation dans sa transformation la plus délicate.\n\nLa formation de l'administration Yoshida marquera un tournant dans la reprise politique et nationale du Japon. Croyant fermement à la reconstruction de la nation par le développement pacifique, la reconstruction économique et la coopération internationale, Yoshida a pris ses fonctions non pas avec le zèle incendiaire de la révolution, mais avec la détermination tranquille d'un homme d'État qui a compris le poids de la responsabilité."
 JAP_Establish_the_Yoshida_School_desc: "Au lendemain délicat de la guerre et sous le regard vigilant de l'occupation alliée, le Japon était confronté au choix entre reprendre des forces grâce à ses anciennes ambitions ou se relever en suivant une voie différente. Parmi les autres options envisagées, le Japon a choisi cette dernière sous la main ferme du Premier ministre Yoshida Shigeru. Le résultat de ce choix est devenu le cadre de ce que l'on appelle Yoshida Gakko, une attitude directrice, une stratégie de maîtrise de soi et une déclaration de priorités pour un Japon humble mais déterminé.\n\nAu lieu d'opter pour un réarmement précipité et une diplomatie provocatrice, l'autre méthode, que Yoshida a choisie intentionnellement et calmement, a laissé le pays se concentrer sur la reprise économique, la modernisation industrielle et la stabilité sociale."
