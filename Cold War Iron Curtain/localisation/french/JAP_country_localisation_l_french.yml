 jap_yoshida.30.t: "Nihon Shakai-to se sépare !"
 jap_yoshida.30.d: "Inévitablement, le Shakai-to a subi une fracture importante après des mois de conflits internes entre ses factions de droite et de gauche. Les racines de cette division remontent à 1945, lorsque le parti a fusionné diverses factions prolétariennes, chacune nourrissant des interprétations diverses et souvent contradictoires du socialisme.\n\nLes premières fissures au sein du Shakai-to sont devenues apparentes en 1948 lorsque six membres de gauche ont été évincés du cabinet Ashida, une décision destinée à réprimer l'opposition au plan budgétaire. Les tensions se sont intensifiées à mesure que la popularité de la droite diminuait, notamment à la suite du fameux scandale Showa Denko. La controverse Morito-Inamura, survenue deux ans auparavant, a encore alimenté la discorde, dans la mesure où les politiques de campagne des ailes opposées contredisaient clairement les idéaux de chacun. L'influence de la gauche s'est notamment développée grâce au soutien substantiel des syndicats Sohyo, une tendance qui s'est accentuée pendant la guerre de Corée. Aujourd'hui, le coup final porté à cette unité déjà fragile a eu lieu lors d'un différend sur l'approbation du Traité de San Francisco. La droite, favorable à cette proposition, affirmait que son acceptation serait le seul moyen réaliste de recouvrer la souveraineté du Japon ; l'aile gauche, qui s'y opposait, affirmait que l'acceptation amènerait le Japon à rejoindre officiellement le bloc occidental, contrariant ainsi l'URSS.\n\nPar conséquent, Shakai-to est désormais divisé en deux factions. Le parti de droite Shakai-to Uha, dirigé par Jotaro Kawakami, adhère à une politique modérée. De l'autre côté, le parti de gauche Shakai-to Saha, dirigé par Mosaburo Suzuki, poursuit résolument une politique révolutionnaire affirmée, alimentée par l'anti-américanisme et le rejet du traité de sécurité américano-japonais. Cette rupture pourrait laisser présager un déclin potentiel du socialisme au Japon, du moins dans un avenir immédiat."
 jap_yoshida.30.a: "Des temps incertains."
 jap_yoshida.31.t: "[GetNewspaperHeader]Une affaire de scandale dans la construction navale se déroule à Tokyo"
 jap_yoshida.31.d: "Dans une tournure dramatique des événements, le bureau du procureur du district de Tokyo, avec l'aide de la police, a lancé une descente d'une journée à la résidence du vice-Premier ministre, Taketora Ogata. Simultanément, Banboku Ono, directeur de l'Agence de développement d'Hokkaido, a été interrogé sans relâche par le procureur en chef Kawai Nobutaro. Le scandale tourne autour d'un stratagème de corruption lié à la « Loi sur les bonifications d'intérêts pour la construction navale océanique », visant à réduire les taux d'intérêt sur les projets de construction navale.\n\nCette affaire menace également d'embrouiller davantage les personnalités politiques et les bureaucrates, les premiers soupçons pointant déjà vers plusieurs membres de la Diète et des dirigeants de haut rang de la construction navale. À mesure que l'enquête s'approfondit, le scandale jette une ombre sur l'intégrité du parti au pouvoir et de l'industrie de la construction navale."
 jap_yoshida.31.a: "Avec cela commence la chute du cabinet Yoshida..."
 jap_yoshida.32.t: "Raid au siège de l'agence de voyages"
 jap_yoshida.32.d: "Face aux soupçons grandissants entourant le scandale de la construction navale, le département des enquêtes spéciales du parquet du district de Tokyo a lancé un raid audacieux contre le siège de l'agence de voyage japonaise situé dans l'arrondissement de Chiyoda, à Tokyo. Les autorités ont passé au peigne fin les documents et saisi des preuves, enquêtant sur d'éventuels liens avec des activités illicites. Peu de temps après le raid, le président Hiroshi Takada a été interrogé par les procureurs pour répondre aux soupçons, dans le but d'extraire des informations et de faire la lumière sur une implication potentielle dans cette affaire scandaleuse. Les procureurs, sans se laisser décourager, ont dévoilé leur intention d'élargir leur enquête, signalant des perquisitions imminentes contre d'autres sociétés de transport."
 jap_yoshida.32.a: "On dirait que c'est loin d'être fini."
 jap_yoshida.33.t: "Yoshida Naikaku Tadou Kokumin Dai-kai"
 jap_yoshida.33.d: "Alors que le soutien du public au cabinet Yoshida faiblit, les syndicats mécontents de Sohyo, ainsi que des militants d'extrême gauche, se sont rassemblés dans le parc Hibiya pour une conférence organisée par des gauchistes influents de Sohyo, intitulée « Yoshida Naikaku Tadou Kokumin Dai-kai » (Alliance nationale pour renverser le cabinet Yoshida). Au milieu de discours passionnés dénonçant le cabinet Yoshida, la foule s'est transformée en une foule en colère qui s'est répandue dans les rues. Leur destination : le siège social de Jiyu-to. Cependant, leur passage a été entravé par une formidable présence policière gardant le bâtiment. Les manifestants agités ont affronté les forces de l'ordre, tentant de briser le cordon de sécurité. Malgré des échauffourées mineures, la police a réussi à disperser la foule sans faire de blessés, garantissant ainsi une issue pacifique au rassemblement."
 jap_yoshida.33.a: "Compte tenu de Yoshida, il faudra plus que cela."
 jap_yoshida.34.t: "Le parquet du district de Tokyo lance une opération de masse"
 jap_yoshida.34.d: "Face à l'évolution du scandale, le parquet du district de Tokyo a orchestré aujourd'hui une vaste opération ciblant les sièges sociaux de plusieurs sociétés de transport. Les fonctionnaires ont minutieusement examiné les documents, certains d'entre eux étant saisis pour un examen plus approfondi. Au total, huit sociétés de transport se sont retrouvées sous surveillance, parmi lesquelles la Railway Benefit Association, Tozai Kisen Co., la résidence du vice-président de la société Iino Kaiun, ainsi que le siège social d'Hitachi Zosen, l'une des principales sociétés de construction navale. Les autorités se sont concentrées sur l'acquisition d'informations pertinentes pour reconstituer les détails du scandale.\n\nÀ l'extérieur des bâtiments ciblés, une foule de reporters et de journalistes s'est rassemblée, désireuse de couvrir les débats. Simultanément, des employés mécontents, temporairement interdits d'accès à leur lieu de travail pendant les perquisitions, ont observé le déroulement des événements.\n\nL'attention s'est notamment portée sur Hayato Ikeda, un membre éminent du Jiyu-to et président du conseil politique du Shin Nihon Kaiun. Bien que son implication reste non vérifiée, les débats en cours au sein de la Diète nationale tournent autour de sa convocation comme témoin du scandale. Cependant, aucune information ne justifie pour l'instant une perquisition dans son bureau."
 jap_yoshida.34.a: "Concernant."
 jap_yoshida.35.t: "Mandat d'arrêt émis contre Jiro Arita"
 jap_yoshida.35.d: "Le secrétaire en chef du Cabinet, Kenji Fukunaga, s'est adressé calmement à un groupe de journalistes dans les salles sacrées de la Chambre des représentants. Agitant une lettre, il a lu à haute voix l'autorisation officielle d'arrestation de Jiro Arita, membre de la Chambre des représentants et directeur de Namura Kisen Co. À la fin de la lecture, diverses réactions se sont manifestées parmi les journalistes rassemblés. Certains se sont montrés déçus par l'absence de révélations dramatiques, tandis que d'autres ont apprécié l'opportunité d'obtenir un scoop substantiel. Le mandat d'arrêt émis représente une mesure mesurée de la part du bureau du procureur du district de Tokyo, qui s'attend à ce qu'Arita se rende dans la semaine stipulée."
 jap_yoshida.35.a: "Quelle déception."
 jap_yoshida.36.t: "[GetNewspaperHeader]Jiro Arita se rend aux autorités après l'approbation du régime"
 jap_yoshida.36.d: "Une semaine après que le parquet du district de Tokyo a émis le mandat d'arrêt, Jiro Arita s'est rendu aujourd'hui. Hier, en séance plénière, la Diète a autorisé le parquet à procéder à l'arrestation d'Arita, à condition que la période de détention soit limitée à une semaine. Dans une scène feutrée au bureau du procureur du district de Tokyo, les policiers ont arrêté Arita sans incident. Une foule de journalistes s'est rassemblée pour couvrir l'événement, capturant la reddition sans prétention. L'arrestation approuvée marque une étape importante dans l'enquête en cours, maintenant une approche mesurée alors que les autorités approfondissent encore davantage l'affaire du scandale."
 jap_yoshida.36.a: "Encore une tache à notre réputation !"
 jap_yoshida.37.t: "Le ministre de la Justice invoque « l'autorité de commandement » au milieu du dévoilement du scandale"
 jap_yoshida.37.d: "À la suite d'un mandat d'arrêt contre Eisaku Sato, secrétaire général du Jiyu-to, émis hier dans le cadre du scandale de la construction navale et accusé de corruption par des tiers, le ministre de la Justice Takeru Inukai a pris une décision inattendue aujourd'hui. Citant l'article 14 de la loi sur le ministère public, Inukai a invoqué son autorité de commandement, ordonnant au procureur général Tosuke Sato de suspendre l'arrestation. La justification présentée était les délibérations en cours sur des projets de loi cruciaux à la Diète nationale, jugeant la présence du Secrétaire général nécessaire. Cependant, le ministre de la Justice Inukai a également annoncé simultanément sa démission, à compter de demain, et Ryogoro Kato devrait lui succéder. Les raisons de la démission restent pour l'instant inconnues."
 jap_yoshida.37.a: "Discutable."
 jap_yoshida.38.t: "Motion de censure rejetée à la Chambre des conseillers"
 jap_yoshida.38.d: "Suite à l'adoption hier d'une motion de censure contre le cabinet Yoshida en réponse à la controverse sur l'autorité de commandement, la session d'aujourd'hui semble prête à sceller le sort du cabinet. Les attentes étaient grandes quant à l'approbation de la motion, annonçant potentiellement l'éviction du cabinet Yoshida.\n\nCependant, dans une tournure inattendue des événements, des divisions internes au sein du parti Kaishin-to sont intervenues, assurant la survie du Cabinet. Des différends et des opinions divergentes au sein du Kaishin-to ont conduit à un rejet de la motion à la dernière minute, les membres ayant voté contre et s'être abstenus. Ajoutant une note particulière aux débats, des tracts ont été lancés depuis le public lors du discours du président de la commission. Le perturbateur, Shinoda Minoru du Dai-Nippon Aikoku-to, a été rapidement expulsé de la salle."
 jap_yoshida.38.a: "En effet, l'opposition ne reculera pas facilement."
 jap_yoshida.39.t: "Le procureur général Sato témoigne"
 jap_yoshida.39.d: "La commission du budget s'est réunie aujourd'hui pour conclure ses enquêtes sur le scandale de la construction navale. Le procureur général Tosuke Sato a soigneusement ouvert son emballage de furoshiki contenant des « secrets professionnels » et a parcouru les documents avant de prendre position et de donner son témoignage. Observa sévèrement le président du comité, Tanaka Akira, fumant un cigare en arrière-plan.\n\nSato a affirmé que l'invocation de l'autorité de commandement par le ministre de la Justice avait grandement entravé l'enquête sur le scandale de la construction navale. Ce recours à l'autorité, prétendument pour protéger les hommes politiques, a érodé la légitimité politique du système démocratique japonais, marquant un revers regrettable. Il a également fait allusion à un programme sous-jacent, suggérant un plan visant à manipuler les nominations juridiques en invoquant l'autorité de commandement. Reconnaissant les conflits internes, Sato a admis une divergence dans la politique des poursuites, notamment en ce qui concerne l'évaluation des preuves. Les hauts procureurs, inquiets de l'approche énergique du Département des enquêtes spéciales, ont discrètement proposé au ministre de la Justice d'interrompre l'enquête par l'intermédiaire de l'autorité de commandement.\n\nSato a confirmé les échanges monétaires entre l'industrie de la construction navale et Jiyu-to, mais a souligné la difficulté de prouver la corruption avec des preuves irrévocables. Le chapitre sur le scandale de la construction navale se termine par 71 arrestations et 35 inculpations. Parmi eux, 23 avaient une implication significative, 7 ont été acquittés, 12 ont été condamnés à des peines avec sursis et 2 ont été condamnés à une amende. Le procureur général et le procureur en chef du district de Tokyo signalent la fin, sans aucun plan de nouvelles perquisitions, enquêtes ou arrestations."
 jap_yoshida.39.a: "La fin justifie les moyens... ?"
 jap_yoshida.40.t: "Yoshida critiqué pour son refus d'assignation à comparaître"
 jap_yoshida.40.d: "Malgré la conclusion de l'enquête sur le scandale de la construction navale, le Premier ministre Yoshida fait face à des critiques persistantes pour son récent refus de comparaître devant la commission du budget. Cette décision continue d'être exploitée par les législateurs de l'opposition qui cherchent à ternir la réputation du cabinet Yoshida, déjà en difficulté.\n\nDans un geste discret mais significatif, Tanaka Akira, président de la commission du budget, ainsi que des membres de la commission des comptes de quatre partis d'opposition, se sont rendus au parquet suprême pour rencontrer le procureur général Tosuke Sato et le procureur en chef Baba Yoshitsugu du parquet du district de Tokyo. Au cours de la réunion, une plainte officielle a été déposée auprès du procureur général Yoshitsugu, accusant le Premier ministre Yoshida d'avoir violé la loi sur le témoignage parlementaire. La plainte allègue que le refus de Yoshida de comparaître devant la commission était injustifié, citant les obligations officielles et les préparatifs du voyage à l'étranger comme des raisons insuffisantes pour contourner l'obligation légale de témoigner.\n\nAlors que le cabinet Yoshida est aux prises avec les défis existants, les critiques de l'opposition s'intensifient encore, créant des obstacles supplémentaires pour l'administration déjà en difficulté."
 jap_yoshida.40.a: "Un autre clou dans le cercueil."
