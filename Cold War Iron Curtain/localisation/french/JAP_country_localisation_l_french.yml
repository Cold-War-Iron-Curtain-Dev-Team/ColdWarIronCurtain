 JAP_LDP_President_tt: "[JAP_LDP_President_tt_desc]"
 JAP_LDP_Vice_President_tt: "[JAP_LDP_Vice_President_tt_desc]"
 JAP_LDP_Chairperson_General_Council_tt: "[JAP_LDP_Chairperson_General_Council_tt_desc]"
 JAP_LDP_Chairperson_Policy_Research_Council_tt: "[JAP_LDP_Chairperson_Policy_Research_Council_tt_desc]"
 JAP_LDP_Secretary_General_tt: "[JAP_LDP_Secretary_General_tt_desc]"
 JAP_LDP_Hashimoto_Role_tt: "§YTomizaburo Hashimoto§!\n-------------------------------------\n\nLors de la fusion conservatrice §Y§!de 1955, Hashimoto a suivi la position de son mentor §GShigeru Yoshida§!, qui §Ra refusé de rejoindre le Parti libéral-démocrate§!et a également déclaré §Rson propre refus de participer§!.\n\nEn §Y1957§!, lorsque §GNobusuke Kishi§!, le frère aîné de §GSato§!, devint §Gprésident du PLD§!, Yoshida fut persuadé par §GKishi§! et §GHayato Ikeda§! à §Yrejoignent le Parti libéral-démocrate§!.\nSuite à cette décision, §GSato§! et §GHashimoto§! se sont également alignés sur le parti.\n\nIl a également joué un rôle important dans la création §Yde la Japan Broadcasting Corporation en tant que société publique spéciale§!, contribuant ainsi à la fondation institutionnelle de la §YNHK§!."
 JAP_LDP_Hori_Role_tt: "§YShigeru Hori§!\n-------------------------------------\n\nAu cours de la scission du Parti démocrate§!en §Yen 1950, il s'est aligné sur la faction de coalition du Parti démocrate §Y§! et a fusionné avec le Parti libéral démocrate§!de Shigeru Yoshida §G, contribuant à la formation du Parti libéral §Y§!.\nIl a ensuite été traité comme une figure de confiance au sein de la soi-disant école §YYoshida§!, effectivement considéré comme un membre transféré et chargé de responsabilités importantes par Yoshida.\n\nAu sein du Parti libéral §YYoshida§!, §YOno Banboku§!, §YHayashi Joji§!et §YMasutani Hideji§! étaient connus sous le nom de §YTrois Grandes Maisons.§!, tandis que §GHayato Ikeda§!, §GEisaku Sato§!, §YHirokawa Kozen§!et §YHori Shigeru§! étaient collectivement appelés les §YQuatre Magistrats§!."
 JAP_LDP_Funada_Role_tt: "§YNaka Funada§!\n-------------------------------------\n\nIl était le frère aîné des soi-disant §YFunada Three Brothers§!, une famille largement connue dans la politique japonaise.\nSon frère cadet §GKoji Funada§! a été membre de la Chambre des représentants et §GDirecteur général de l'Agence de gestion administrative§!, tandis qu'un autre frère, §GIsuke Fujieda§!, également membre de la Chambre, a occupé des postes tels que §GMinistre des Transports.§! et §GMinistre de l'Intérieur§!.\n\nEn §Y1955§!, à la suite de la fusion conservatrice §Y§!, il rejoint le Parti libéral-démocrate §G§!.\nLa même année, il est nommé §GDirecteur général de l'Agence de défense§! dans le §YTroisième cabinet Hatoyama§!.\n\nIl a ensuite été §Gprésident du Conseil de recherche sur les affaires étrangères du PLD§! et §Gprésident du Conseil de recherche sur la politique de sécurité§!.\nPolitiquement, il a adopté une position §Ypro-Taïwan§! et §Ypro-République de Corée§! et était considéré comme une figure §Rbelliciste§! au sein du parti."
 JAP_LDP_Kishi_Role_tt: "§YNobusuke Kishi§!\n-------------------------------------\n\nEn §Ynovembre 1954§!, il a cofondé le §GParti démocrate japonais§! avec §GIchiro Hatoyama§! et a assumé le poste de §GSecrétaire général§!.\nAyant longtemps prôné un système bipartite §Y§!, §GNobusuke Kishi§! a pris la tête, aux côtés de §GIchiro Hatoyama§! et §GMiki Takekichi§!, dans la promotion du §Yfusion conservatrice§! entre le Parti libéral et le Parti démocrate.\n\nLe §Yoctobre 1955§!, le Parti socialiste japonais, divisé en factions de gauche et de droite, s'est réunifié.\nEn réponse, un nouveau Parti libéral-démocrate §G§! a été formé le §Ynovembre§!.\n§GNobusuke Kishi§! est devenu le §Gpremier secrétaire général§! du parti, tandis que §GIchiro Hatoyama§! a assumé le rôle de §Gpremier président du parti§!.\n\nAinsi, le système §Y1955§! a été créé."
 JAP_LDP_Ikeda_Role_tt: "§YHayato Ikeda§!\n-------------------------------------\n\nIkeda bénéficiait de §Gune forte confiance§! de la part de §GShigeru Yoshida§!, et sa confiance frôlait parfois un §Yun excès de confiance§!, conduisant à une série de §Rremarques controversées§! qui ont suscité un débat public.\n\nLa participation à la §Yfusion conservatrice de 1955§! aurait obligé la faction Yoshida à s'incliner devant des personnalités telles que §GTakekichi Miki§!, §GIchiro Kono§!et §GNobusuke Kishi§!, qui soutenaient §GIchiro Hatoyama§!, provoquant de profondes hésitations au sein du groupe Yoshida.\n\nBien qu'Ikeda ait été une figure centrale §Rdans le camp de l'opposition§!, il a finalement pris une décision pragmatique §Y§!.\nAvec les hauts responsables §GJoji Hayashi§! et §GHideji Masutani§!, il a unifié la faction Yoshida et l'a conduite à participer au §GParti libéral-démocrate§!.\n\nIkeda a également exhorté §GShigeru Yoshida§! à rejoindre le parti, mais Eisaku Sato§!s'y est opposé §R."
 JAP_LDP_Sato_Role_tt: "§YEisaku Sato§!\n-------------------------------------\n\nIl avait entretenu très tôt des liens personnels étroits avec §GShigeru Yoshida§!, avec qui il avait un lien de parenté éloigné.\nEn §Y1948§!, pendant le §YDeuxième cabinet Yoshida§!, il entre dans le cabinet en tant que §GSecrétaire en chef du cabinet§! bien qu'il ne soit pas membre de la Diète.\nAvec §GHayato Ikeda§!, il est devenu une figure de proue de l'école §YYoshida§!.\n\nLors de la fusion conservatrice §Y§! qui a conduit à la formation du Parti libéral-démocrate, il a suivi la décision de Yoshida de §Rrefuser de participer au PLD§!, aux côtés de §YTomisaburo Hashimoto§!.\nEn §Y1957§!, suite au départ à la retraite de §GIchiro Hatoyama§!, il §Yrejoint le Parti libéral-démocrate§!.\n\nServant de §Gbras droit§! de son frère aîné §GNobusuke Kishi§!, il a été nommé §GPrésident du Conseil général du LDP§!.\nAvec §GTakeo Miki§!, qui a été §Gprésident du Conseil de recherche politique§!, il a joué un rôle central dans §Gle soutien à l'administration Kishi§!."
 JAP_LDP_Tanaka_Role_tt: "§YKakuei Tanaka§!\n-------------------------------------\n\nEn §Y1954§!, Tanaka a été nommé §GVice-secrétaire général§! du §YParti libéral§! dirigé par §GShigeru Yoshida§!.\nIl en est venu à être considéré comme l'un des proches collaborateurs de Yoshida, connu sous le nom de §YYoshida Thirteen§!.\n\nAvec la fusion §Yconservatrice§! du §Ynovembre 1955§!, le Parti libéral s'est joint au Parti démocrate japonais pour former le §GParti libéral-démocrate§!, et Tanaka a participé à sa création.\nPar la suite, il a occupé une série de postes au sein du parti et au Parlement, dont §GDirecteur du Bureau électoral§!, §GVice-ministre parlementaire des Affaires juridiques§!, §GPrésident de la branche préfectorale de Niigata du Conseil général du Parti§!, §GVice-secrétaire général.§!et §GMembre du comité de mise en accusation des juges§!."
 JAP_LDP_Miki_Role_tt: "§YTakeo Miki§!\n-------------------------------------\n\nLe §Y15 novembre 1955§! (Showa 30), la fusion conservatrice §Y§! fut réalisée et le §GParti libéral-démocrate§! fut officiellement créé.\nBien que §GMiki§! ait continué à §Rs'opposer à la fusion conservatrice§!, il a finalement décidé de §Yrejoindre le LDP§!.\n\nAprès être entré dans le parti, §GMiki§! en est venu à diriger une §Yfaction mineure§! connue sous le nom de §Yfaction Miki§!, composée principalement d'anciens §Yéléments réformistes du Kaishinto§! et souvent appelé le §Ygroupe réformiste conservateur§!.\n\nLors du vote forcé §Y§! sur le §YTraité de sécurité Japon-États-Unis§!, §GMiki§! n'avait pas été informé à l'avance de la décision.\nPour protester contre le passage forcé de §R§!, il §Rs'est retiré de la chambre et s'est abstenu de voter§! avec §YKono§! et §YIshibashi§!."
 JAP_LDP_Fukuda_Role_tt: "§YTakeo Fukuda§!\n-------------------------------------\n\nMoins de §Yun an§! après son entrée au §Yministère des Finances§!, il a été envoyé à Londres en tant qu'attaché financier §G§! auprès de l'ambassade du Japon §Yau Royaume-Uni§!.\nAprès §Ytrois ans et demi§! de service en Grande-Bretagne, il retourne au Japon.\n\nPendant la période de guerre §R§!, il a servi comme conseiller financier §Y§! auprès du gouvernement national réorganisé de Chine §Rsous Wang Jingwei§!.\n\nIl est entré en politique après avoir remporté un siège aux élections générales de §Y1952§!.\nAgissant en étroite coordination avec §GNobusuke Kishi§!, il a ensuite été §Gsecrétaire général du Parti libéral-démocrate§! et plus tard §Gministre de l'Agriculture§! sous le §Ycabinet Kishi§!."
 JAP_LDP_Ohira_Role_tt: "§YMasayoshi Ohira§!\n-------------------------------------\n\nEn §Y1952§!, à l'invitation de §GHayato Ikeda§!, qui avait été son supérieur pendant son séjour au §Yministère des Finances§!, il démissionna du ministère le §Yle 5 septembre§! et se présenta aux élections. §YÉlection à la Chambre des Représentants§!.\n\nLorsque §GHayato Ikeda§! a créé la faction §YKochikai§! en §Y1957§!, il s'est naturellement rallié aux côtés d'Ikeda.\nEn tant que membre d'un groupe d'anciens responsables du ministère des Finances dirigé par §GShigezaburo Maeo§!, il est devenu l'un des §Ycerveaux politiques clés d'Ikeda§!.\nAvec §GKiichi Miyazawa§! et §GYasumi Kurogane§!, il était connu comme l'un des proches collaborateurs d'Ikeda, collectivement appelés le trio de secrétaires §Y§!."
 JAP_LDP_Nakasone_Role_tt: "§YYasuhiro Nakasone§!\n-------------------------------------\n\nLors de la fusion conservatrice §Y1955§!, il rejoint la faction §YKono§! après que son associé de longue date §GTokutaro Kitamura§! s'est aligné sur le groupe Kono, issu de l'ancienne faction Hatoyama §Y§!.\n\nEn §Y1956§!, il a agi énergiquement en tant que §Rdéfenseur de la révision constitutionnelle§!, publiant même une oeuvre connue sous le nom de §YChanson de révision de la Constitution§!, ce qui a conduit les médias à le qualifier de §Rjeune officier militaire.§!.\n\nLors de sa première campagne électorale réussie, il a réalisé une performance saisissante en conduisant un vélo peint en blanc §Y§! orné d'un drapeau national japonais §Y§!, attirant l'attention du grand public."
 JAP_LDP_Banboku_Role_tt: "§YBanboku-Ono§!\n-------------------------------------\n\nIl était connu comme un politicien du parti classique §Y§! et était affectueusement surnommé §YBan-chan§!.\nLors de la §Yfusion conservatrice de 1955§!, il travailla en étroite collaboration avec §GMiki Takekichi§! et joua un rôle clé dans la §Gformation du Parti libéral-démocrate§!.\nÀ partir de §Y1957§!, il a été §Gvice-président du Parti libéral-démocrate§!.\nIl était considéré comme un courtier de pouvoir en coulisses §Y§!, un homme politique habile à §Ymanipuler les relations de pouvoir entre factions§! grâce à des manoeuvres en coulisses."
 JAP_LDP_Kawashima_Role_tt: "§YShojiro Kawashima§!\n-------------------------------------\n\nIl a souvent été comparé à §YJoseph Fouché§!, homme politique français de l'époque napoléonienne, et a gagné le surnom de §Yle Fouché de l'ère Edo§!.\nAprès la démission du cabinet Hatoyama, il s'est engagé de manière décisive dans la course à la direction du parti pour soutenir la formation de l'administration §GKishi§!, et a ensuite assumé le poste de §Gsecrétaire général du Parti libéral-démocrate§! sous la direction du Premier ministre Kishi.\n\nAvant les §Ymanifestations de l'Anpo§!en 1960, Kawashima a habilement contenu §Rles troubles internes croissants du parti§! et a soigneusement organisé l'adoption forcée §Rde la législation§!, pour finalement §Gprotéger le gouvernement Kishi§! jusqu'à ce que §Gle nouveau Traité de sécurité§! a été conclu avec succès.\n\nBien que son expérience en tant que ministre se soit limitée à §Yportefeuilles relativement mineurs§!, il a continuellement occupé §Gpostes de direction et d'influence§! au sein de la direction du parti, passant d'un poste clé à un autre."
 JAP_LDP_Kono_Role_tt: "§YIchiro Kono§!\n-------------------------------------\n\nAprès avoir travaillé comme journaliste §Y§!, il devient §GSeiyukai§! membre de la Chambre des représentants en §Y1932§!et, dans la période d'après-guerre, participe à la formation §Gdu Parti libéral§!.\nEn tant que figure de proue de la faction politique du parti §Y§! au sein du Parti libéral-démocrate §G§!, il a exercé une influence considérable et sa conduite politique a été décrite comme §Ynon conventionnelle et enfreignant les règles§!.\n\nSous le §YDeuxième cabinet Kishi§!, il a été nommé §GPrésident du Conseil général du LDP§!.\nCependant, après que le Premier ministre Kishi §Rait refusé de le nommer secrétaire général§! en §Yjuin 1959§!, il est passé dans la faction anti-mainstream §R§!.\n\nConcernant la révision §Ydu Traité de sécurité entre le Japon et les États-Unis§!, il a adopté une position critique §R§! envers le cabinet Kishi.\nLors du vote forcé §R§! à la Chambre des représentants, la faction §YKono§! §Ya boycotté la session§! avec la faction §YMiki§!."
 JAP_LDP_Shiina_Role_tt: "§YEtsusaburo Shiina§!\n-------------------------------------\n\nEn §Yfévrier 1957§!, suite à la démission du §YCabinet Ishibashi§! en raison de la maladie §Ydu Premier ministre Tanzan Ishibashi§!, le §GPremier cabinet Kishi§! fut formé.\nBien qu'il n'ait été qu'un §Ymembre élu une fois§!, Shiina a été nommé §GDirecteur du Bureau de comptabilité du LDP§! après avoir été reconnu par le §GSecrétaire général Shojiro Kawashima§! pour son expérience au §YMinistère du Commerce et de l'Industrie§! et ses §Yrelations étendues au sein du secteur industriel§!.\n\nAprès que Shiina ait assumé le poste de directrice du Bureau de la comptabilité, §Rles dons d'entreprises§! du monde des affaires au Parti libéral-démocrate ont considérablement augmenté, passant de l'ancien niveau de §Y200 millions de yens§! à §R1 milliard de yens§!."
 JAP_LDP_Suzuki_Role_tt: "§YZenko Suzuki§!\n-------------------------------------\n\nEn §Y1947§!, il se présenta aux élections générales en tant que candidat du §YParti socialiste japonais§! et remporta son premier siège.\nCependant, grâce à l'introduction de son compatriote législateur §GSajoki Ozawa§!, il a été transféré au §GParti libéral démocrate§! dirigé par §GShigeru Yoshida§!, devenant par la suite un §Ypoliticien conservateur§!.\n\nSuite à la fusion conservatrice §Y§!, il a rejoint la faction Kochikai§! de §GHayato Ikeda.\nFavorisé comme proche collaborateur §Y§! par Ikeda, il a progressivement gravi §Gles échelons de la politique nationale§! et a consolidé sa position au sein de l'establishment politique."
 JAP_LDP_Maeo_Role_tt: "§YShigesaburo Maeo§!\n-------------------------------------\n\nLors des élections générales §Y1949 pour la Chambre des représentants§!, il s'est présenté comme candidat officiel du §GParti libéral-démocrate§! sous la direction de §GShigeru Yoshida§!.\nAlors que son entourage promouvait Maeo comme le §Yfutur ministre des Finances§!, lui-même était particulièrement réservé, même lors des réunions du soir, se montrant réticent à verser des boissons et embarrassé à l'idée de porter des fleurs sur sa poitrine.\nMême après avoir bu, ses discours ont montré §Ypeu d'amélioration§!.\n\nEn tant que membre de l'école §YYoshida§!, il a ensuite été §Gprésident du comité d'administration locale§! et §Gprésident de la commission des affaires étrangères§! à la Chambre des représentants.\nEn §Y1957§!, il entre au cabinet en tant que §GMinistre du Commerce international et de l'Industrie§! dans le §YPremier Cabinet remanié de Kishi§!."
 JAP_LDP_Mizuta_Role_tt: "§YMikio Mizuta§!\n-------------------------------------\n\nEn §Y1953§!, il entre pour la première fois au cabinet en tant que §GDirecteur général de l'Agence de planification économique§! sous le §YQuatrième cabinet Yoshida§!.\nAu sein du Parti libéral §Y§!, il a été élu à plusieurs reprises §Gprésident du Conseil de recherche politique§!, s'imposant comme un spécialiste politique §Y§!.\n\nÀ la suite de la fusion conservatrice §Y1955§!, il a été nommé §Gpremier président du Conseil de recherche politique du LDP§!, l'un des §Ytrois postes exécutifs les plus élevés du parti§!.\n\nIl a ensuite été §GMinistre du Commerce international et de l'Industrie§! et membre du §YConseil de planification industrielle§! sous les §YCabinets Ishibashi de 1956 et 1957§!.\nIl a continué à occuper le même rôle que §GMinistre du Commerce international et de l'Industrie§! dans le §YPremier Cabinet Kishi§! en §Y1957§!."

