 LDP_Bancho_text: "§OBanchoken§!: [?LDP_fac_support_Bancho_var|%]"
 LDP_Shunjukai_text: "§6Shunjukai§!: [?LDP_fac_support_Shunjukai_var|%]"
 LDP_Tokakai_text_tt: "§YTokakaï§!\n-------------------------------------\n\n\n\n\n£GFX_LDP_Tokakai_Banner\n\n\n\n\n\n\n§YGain de pouvoir politique :§! [?JAP_Liberal_Democratic_Party_political_power_gain|+1%]\n§YUsine d'armes :§! §GVitesse de production§! [?JAP_Liberal_Democratic_Party_production_speed_arms_factory_factor|+1%]\n-------------------------------------\n\n\nCette faction périphérique conservatrice trouve ses origines dans la ligne §Yanti-Shigeru Yoshida§! au sein du Parti démocrate japonais au moment de la fusion conservatrice §Y1955§!, en particulier les courants politiques associés à §GNobusuke Kishi§! et §GIchiro. Hatoyama§!.\nTout en maintenant une orientation §Ypro-États-Unis et anticommuniste§!, il prône §Yune révision constitutionnelle et l'établissement d'une constitution autonome§!, et adopte §Rune position active sur le réarmement§!, donnant à la faction un caractère §Rrelativement belliciste.§!."
 LDP_Kochikai_text_tt: "§YKochikai§!\n-------------------------------------\n\n\n\n\n£GFX_LDP_Kochikai_Banner\n\n\n\n\n\n\n§YComplexe industriel :§! §GVitesse de production§! [?JAP_Liberal_Democratic_Party_production_speed_industrial_complex_factor|+1%]\n§YCentrale à combustible fossile : vitesse de production§! §G§! [?JAP_Liberal_Democratic_Party_production_speed_fossil_fuel_powerplant_factor|+1%]\n-------------------------------------\n\n\nCette faction conservatrice dominante a été fondée par §GHayato Ikeda§!, un disciple direct de §GShigeru Yoshida§!, et fait remonter sa lignée au §YParti libéral§! dirigé par Yoshida.\nIkeda a formé cette faction en séparant l'ancienne école Yoshida §Y§! du Parti libéral du §YShuzankai§!, créant ainsi un groupe politique distinct.\nCentrée sur §Yélites bureaucratiques§!, la faction a réuni une coalition §Gà orientation politique accommodante§! qui mettait l'accent sur une gouvernance pragmatique et un leadership administratif."
 LDP_Shuzankai_text_tt: "§YShuzankaï§!\n-------------------------------------\n\n\n\n\n£GFX_LDP_Shuzankai_Banner\n\n\n\n\n\n\n§YParc de bureaux :§! §GVitesse de production§! [?JAP_Liberal_Democratic_Party_production_speed_office_park_factor|+1%]\n§YCentrale renouvelable :§! §GVitesse de production§! [?JAP_Liberal_Democratic_Party_production_speed_renewable_powerplant_factor|+1%]\n-------------------------------------\n\n\nCette faction conservatrice dominante fait remonter sa lignée au Parti libéral §Y§! dirigé par §GShigeru Yoshida§! et a ses racines dans l'école §YYoshida§!.\nIl évite les réformes radicales §Y§!, place l'alliance §YJapon-États-Unis§! comme pierre angulaire absolue et met l'accent sur le développement des capacités de défense §Ydans le cadre de l'article 9 de la Constitution§!.\nEn tant que groupe politique centré sur la réalité §Gconservateur centriste§! et §G§!, il donne la priorité au pragmatisme, à la stabilité et à la continuité de la gouvernance."
 LDP_Bancho_text_tt: "§YBancho Kenkyukai§!\n-------------------------------------\n\n\n\n\n£GFX_LDP_Bancho_Banner\n\n\n\n\n\n\n§YVitesse de recherche :§! [?JAP_Liberal_Democratic_Party_research_speed_factor|+1%]\n§YFacteur de biens de consommation :§! [?JAP_Liberal_Democratic_Party_consumer_goods_factor|-1%]\n-------------------------------------\n\n\nCette faction trouve ses racines dans le Minseito §Y§!, l'un des deux principaux partis politiques de l'avant-guerre, ainsi que dans le Parti coopératif populaire §Y§!, un parti centriste de l'après-guerre.\nIl est composé de législateurs de la lignée §YKaishinto§! dirigé par §GMamoru Shigemitsu§!et représente une continuation de la tradition conservatrice dominante §Y§! au sein du §YParti libéral-démocrate§!.\nAu sein du LDP, cette faction correspond à l'aile gauche §Y§! et est considérée comme une présence §Rpeu orthodoxe et marginale§!."
 LDP_Shunjukai_text_tt: "§YShujukaï§!\n-------------------------------------\n\n\n\n\n£GFX_LDP_Shunjukai_Banner\n\n\n\n\n\n\n§YStabilité :§! [?JAP_Liberal_Democratic_Party_stability_factor|+1%]\n§YComplexe industriel agricole :§! §GVitesse de production§! [?JAP_Liberal_Democratic_Party_production_speed_agri_industrial_complex_factor|+1%]\n-------------------------------------\n\n\nCette faction non dominante de gauche a été formée en §Y1956§! sous la direction de §GIchiro Kono§!, et a ensuite été dirigée sous sa forte direction personnelle.\nIl a ouvertement §Rdéfié Shigeru Yoshida§! et a joué un rôle central dans §Rla chute du cabinet Yoshida§!.\nLa faction Shunjukai a rassemblé §Yéléments pro-chinois§! et §Ypro-soviétiques§! au sein du Parti libéral-démocrate, le marquant comme §Rune présence non conventionnelle et dissidente§! dans le parti."

