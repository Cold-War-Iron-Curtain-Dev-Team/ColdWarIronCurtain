 # Screen Hulls #

 #Frigate
 JAP_screen_hull_medium_0: "Classe Asahi"
 JAP_screen_hull_medium_0_desc: "Le destroyer d'escorte de classe Asahi était une classe de destroyers d'escorte de la Force maritime d'autodéfense japonaise. Deux navires de la classe Cannon ont été prêtés par l'US Navy et mis en service de 1955 à 1975."
 JAP_screen_hull_medium_1: "Classe Akebono"
 JAP_screen_hull_medium_1_desc: "JDS Akebono (DE 201) était un destroyer d'escorte (ou frégate) de la Force maritime d'autodéfense japonaise. L'Akebono fut l'un des premiers navires de guerre japonais construits après la Seconde Guerre mondiale."
 JAP_screen_hull_medium_2: "Classe Chikugo"
 JAP_screen_hull_medium_2_desc: "Le destroyer d'escorte (ou frégate) de classe Chikugo était une classe de destroyers d'escorte construits par la Force maritime d'autodéfense japonaise en tant que successeur de la classe Isuzu, avec la même mission ASW. Ce cours a été suivi par JDS Ishikari. Il s'agit du premier destroyer d'escorte japonais à embarquer des missiles anti-sous-marins ASROC."
 JAP_screen_hull_medium_3: "Classe Yubari"
 JAP_screen_hull_medium_3_desc: "Le destroyer d'escorte (ou frégate) de classe Yubari de la Force maritime d'autodéfense japonaise est le successeur du destroyer d'escorte de classe Ishikari. Yubari doit son nom au croiseur léger expérimental des années 1920-1930, qui a servi (et a été perdu pendant) la Seconde Guerre mondiale."
 JAP_screen_hull_medium_4: "Classe Abukuma"
 JAP_screen_hull_medium_4_desc: "Le destroyer d'escorte (ou frégate) de classe Abukuma est le destroyer d'escorte polyvalent de la Force maritime d'autodéfense japonaise. C'est le successeur de la classe Yubari antérieure."

 #Destroyer
 JAP_screen_hull_heavy_0: "Classe Ariake"
 JAP_screen_hull_heavy_0_desc: "Le destroyer de classe Ariake est une classe de destroyers de la Force maritime d'autodéfense japonaise. Deux navires de la classe Fletcher ont été prêtés par la marine américaine et ont été en service de 1959 à 1974."
 JAP_screen_hull_heavy_1: "Cours d'Akizuki"
 JAP_screen_hull_heavy_1_desc: "Le destroyer de classe Akizuki était une classe de destroyers construite pour la Force maritime d'autodéfense japonaise (JMSDF) à la fin des années 1950. Cette classe était prévue pour être un chef de flottille avec une capacité de commandement et de contrôle améliorée, donc parfois cette classe était classée officieusement comme « DDC » (destroyer commandant)."
 JAP_screen_hull_heavy_2: "Classe Hatsuyuki"
 JAP_screen_hull_heavy_2_desc: "Le destroyer de classe Hatsuyuki est une classe de destroyer servant dans la Force maritime d'autodéfense japonaise (JMSDF). Il s'agissait de la première classe de destroyers polyvalents de première génération de la JMSDF."
 JAP_screen_hull_heavy_3: "Classe Hatakaze"
 JAP_screen_hull_heavy_3_desc: "La classe Hatakaze de destroyers lance-missiles est une classe de navires de troisième génération en service dans la Force maritime d'autodéfense japonaise (JMSDF). Ils furent les premiers navires de la JMSDF à être propulsés par une turbine à gaz."
 JAP_screen_hull_heavy_4: "Classe Kongo"
 JAP_screen_hull_heavy_4_desc: "La classe Kongo de destroyers lance-missiles de la Force d'autodéfense maritime japonaise est équipée du système de combat Aegis et est la première des rares classes de navires en dehors des États-Unis à disposer de cette capacité."

