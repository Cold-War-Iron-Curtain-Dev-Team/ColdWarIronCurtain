# Raun Yoshida
JAP_workshop_of_orient: "L'Atelier de l'Orient"
JAP_workshop_of_orient_desc: "Nous devons reconstruire les usines dévastées par la guerre et restaurer le Japon comme l'une des principales puissances industrielles d'Asie. En combinant notre abondante main-d'oeuvre avec les bases techniques qui ont survécu au conflit, le Japon peut redevenir l'Atelier de l'Orient."
JAP_priority_investment_in_steel: "Investissement prioritaire dans l'acier"
JAP_priority_investment_in_steel_desc: "Sans acier, il ne peut y avoir de chemins de fer, de chantiers navals ou de nouvelles usines. En concentrant nos capitaux et nos ressources limités sur l'industrie sidérurgique, nous obtiendrons les matériaux nécessaires à la reconstruction industrielle."
JAP_priority_investment_in_coal: "Investissement prioritaire dans le charbon"
JAP_priority_investment_in_coal_desc: "Le charbon reste le combustible essentiel qui alimente les usines et les centrales électriques du Japon. En modernisant les mines et en rationalisant la production et les transports, nous pouvons fournir l'énergie nécessaire à la reconstruction depuis notre propre pays."
JAP_rebuilding_power_grid: "Reconstruire le réseau électrique"
JAP_rebuilding_power_grid_desc: "L'expansion industrielle est impossible sans un approvisionnement fiable en électricité. Nous restaurerons les centrales électriques et les réseaux de transmission endommagés, garantissant ainsi que les villes et les régions industrielles du Japon reçoivent un flux continu d'électricité."
JAP_logistics_hub_of_far_east: "Le hub logistique de l'Extrême-Orient"
JAP_logistics_hub_of_far_east_desc: "La guerre dans la péninsule coréenne a attiré les ports, les chemins de fer et les usines du Japon dans le réseau logistique des forces des Nations Unies. Nous exploiterons pleinement ce rôle et ferons du Japon le principal centre d'approvisionnement et de maintenance en Extrême-Orient."
JAP_american_industrial_standards: "Normes industrielles américaines"
JAP_american_industrial_standards_desc: "Pour répondre au volume croissant des commandes militaires américaines, nos dimensions, composants et contrôles de qualité doivent être conformes aux normes américaines. La normalisation simplifiera non seulement les achats actuels, mais préparera également les produits japonais à la concurrence sur les marchés internationaux."
JAP_round_clock_production: "Production 24 heures sur 24"
JAP_round_clock_production_desc: "La demande du front continue de croître de jour comme de nuit. Le travail posté étendu permettra à nos usines de fonctionner 24 heures sur 24, augmentant considérablement la production au prix d'une charge supplémentaire pour la main-d'oeuvre."
JAP_round_clock_production_idea: "$JAP_round_clock_production$"
JAP_round_clock_production_idea_desc: "$JAP_round_clock_production_desc$"
JAP_permanent_defense_industry: "Une industrie de défense permanente"
JAP_permanent_defense_industry_desc: "Si nous comptons uniquement sur une demande temporaire en temps de guerre, l'équipement et l'expertise que nous avons accumulés finiront par disparaître. Des commandes stables et des réseaux de fournisseurs coordonnés établiront une base permanente pour l'industrie de défense japonaise."
JAP_japans_defense_industry_idea: "L'industrie de défense japonaise"
JAP_japans_defense_industry_idea_desc: "Le boom des achats spéciaux généré par la guerre de Corée a fourni l'occasion de reconstruire la base de production militaire démantelée du Japon. Grâce aux commandes américaines et à la fourniture d'équipements à la réserve de la police nationale, les entreprises japonaises récupèrent le savoir-faire et les installations nécessaires à la production d'armes. Bien que l'industrie reste fortement dépendante des États-Unis, une industrie de défense nationale a recommencé à s'implanter."
JAP_reinvesting_special_procurement_boom: "Réinvestir le boom des achats spéciaux"
JAP_reinvesting_special_procurement_boom_desc: "Les bénéfices générés par le boom des achats spéciaux ne doivent pas rester concentrés entre un petit nombre d'entreprises. En réinvestissant ces gains dans les infrastructures, la protection sociale et l'éducation, la demande du temps de guerre peut être convertie en reconstruction pour la nation dans son ensemble."
JAP_expansion_of_social_security: "Expansion de la sécurité sociale"
JAP_expansion_of_social_security_desc: "Même si l'industrialisation s'accélère, la maladie, le chômage et l'insécurité des personnes âgées continuent de peser sur une grande partie de la population. L'expansion de l'assurance sociale et de l'assistance publique garantira que les bénéfices de la croissance économique soient partagés plus largement."
JAP_reinvestment_in_technical_education: "Réinvestissement dans l'enseignement technique"
JAP_reinvestment_in_technical_education_desc: "L'industrie moderne nécessite bien plus que des machines. Cela nécessite également des ingénieurs et des ouvriers qualifiés capables de le concevoir et de l'exploiter. En développant les écoles techniques, la formation professionnelle et l'enseignement scientifique, nous préparerons la main-d'oeuvre nécessaire aux industries du futur."
JAP_reinvesting_special_procurement_boom_idea1: "Conversion civile de l'expertise spéciale en matière d'approvisionnement"
JAP_reinvesting_special_procurement_boom_idea1_desc: "La production destinée à l'armée américaine a doté les entreprises japonaises d'une nouvelle expertise en matière de contrôle qualité, d'ingénierie de précision et de production de masse. En élargissant l'enseignement technique et en transférant ces capacités à l'industrie civile, nous favoriserons le développement de la fabrication de machines, d'électronique, d'équipements de transport et de machines-outils."
JAP_civilian_conversion_of_military_production: "Conversion civile de la production militaire"
JAP_civilian_conversion_of_military_production_desc: "Les méthodes d'ingénierie de précision, de contrôle qualité et de production de masse développées pour les armes et les véhicules militaires peuvent également servir les industries de la paix. En transférant cette expertise aux automobiles, aux machines et à l'électronique, nous cultiverons une nouvelle génération d'industries d'exportation."
JAP_the_factories_that_build_factories: "Les usines qui construisent des usines"
JAP_the_factories_that_build_factories_desc: "Une véritable puissance industrielle doit produire non seulement des produits finis, mais aussi les machines nécessaires à leur fabrication. En renforçant nos industries de machines-outils et d'équipements industriels, le Japon deviendra un exportateur de biens d'équipement dont dépend l'industrialisation elle-même."
JAP_expansion_of_medical_infrastructure: "Expansion de l'infrastructure médicale"
JAP_expansion_of_medical_infrastructure_desc: "Nous devons reconstruire les installations médicales endommagées par la guerre et agrandir les hôpitaux, les cliniques et les centres de santé publique à travers le pays. Alors que la tuberculose et les maladies infectieuses menacent toujours la population, les soins médicaux doivent être étendus au-delà des grandes villes afin que le traitement soit accessible à tous ceux qui en ont besoin."
JAP_modernization_of_medical_industry: "Modernisation de l'industrie médicale"
JAP_modernization_of_medical_industry_desc: "Répondre aux besoins médicaux croissants du pays nécessite un approvisionnement national fiable en produits pharmaceutiques et en équipements médicaux. En adoptant des technologies étrangères, en améliorant le contrôle de qualité et en appliquant les progrès de la chimie et de l'ingénierie de précision, nous moderniserons l'industrie médicale japonaise, depuis les antibiotiques jusqu'aux instruments de diagnostic."
JAP_reinvesting_special_procurement_boom2_idea1: "Réinvestissement social des bénéfices des marchés spéciaux"
JAP_reinvesting_special_procurement_boom2_idea1_desc: "Les bénéfices générés par les achats spéciaux ne doivent pas rester concentrés entre un petit nombre d'entreprises. En les réinvestissant dans la sécurité sociale, les installations médicales et la production nationale de produits pharmaceutiques et d'équipements médicaux, la demande en temps de guerre peut se transformer en améliorations dans la vie du peuple japonais."
JAP_join_colombo_plan: "Rejoignez le Plan Colombo"
JAP_join_colombo_plan_desc: "À mesure que le Japon avance dans sa reconstruction d'après-guerre, nous devons reconstruire nos relations avec les nations asiatiques sur de nouvelles bases. En rejoignant le Plan Colombo, nous commencerons à accueillir des étudiants et des stagiaires techniques tout en envoyant des experts japonais à l'étranger, mettant ainsi notre expérience de l'industrialisation au service du développement régional. Une telle coopération contribuera à restaurer la confiance mutuelle et à jeter les bases des futurs échanges commerciaux et économiques."
JAP_asian_technical_cooperation_program_idea: "Programme asiatique de coopération technique"
JAP_asian_technical_cooperation_program_idea_desc: "L'acceptation d'étudiants et de stagiaires techniques étrangers, ainsi que l'envoi d'experts japonais à l'étranger, imposent de nouvelles charges financières et administratives au gouvernement. Néanmoins, ces échanges rétablissent la confiance avec les pays d'Asie et créent de nouvelles connexions internationales pour les entreprises et les établissements d'enseignement japonais. Les bases sont progressivement posées pour que la technologie et les produits japonais puissent pénétrer les marchés régionaux."
JAP_technical_assistance_idea: "Assistance technique japonaise"
JAP_technical_assistance_idea_desc: "Des experts envoyés du Japon et des techniciens formés dans des institutions japonaises introduisent de nouvelles connaissances en matière de production industrielle, de développement des infrastructures et de contrôle qualité. Même si l'ampleur de la coopération reste limitée, elle améliore régulièrement nos bases techniques nationales et notre capacité de production."
JAP_reconstruction.1.t: "Assistance technique japonaise"
JAP_reconstruction.1.d: "Le gouvernement japonais nous a informé qu'il lancerait un programme de coopération technique avec notre pays dans le cadre du Plan Colombo. Les universités et établissements de formation japonais accueilleront nos étudiants et stagiaires techniques, tandis que des experts japonais seront envoyés dans des domaines tels que l'industrie, les infrastructures et la santé publique.\n\nMême si certains restent méfiants quant aux intentions du Japon, cette coopération offre une précieuse opportunité d'acquérir les compétences nécessaires à la reconstruction et à la modernisation, tout en reconstruisant les relations entre nos deux pays sur de nouvelles bases."
JAP_reconstruction.1.a: "Nous accueillerons favorablement cette coopération."
