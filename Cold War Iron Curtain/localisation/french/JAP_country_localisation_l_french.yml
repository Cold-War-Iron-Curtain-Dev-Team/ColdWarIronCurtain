### Nobusuke Kishi ######################################
 ### National Focus ###
 JAP_The_Kishi_Administration: "L'administration Kishi"
 JAP_Establish_Diplomatic_Relations_with_Eastern_Europe: "Établir des relations diplomatiques avec l'Europe de l'Est"
 JAP_Compensations_for_Vietnam: "Compensations pour le Vietnam"
