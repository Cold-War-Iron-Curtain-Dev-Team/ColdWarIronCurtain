 jap_dissolution_event_title: "Chambre des représentants dissoute"
 jap_dissolution_event_description: "En préparation des prochaines élections générales, la Chambre des représentants de la Diète nationale (Chambre basse) a été officiellement dissoute. Par conséquent, tous les sièges de la Chambre basse restent vacants, ce qui entraîne la suspension de toutes les sessions prévues jusqu'à la conclusion des élections générales et l'élection ultérieure de nouveaux membres à la Chambre basse."
 jap_dissolution_event_response: "Reconnu."
 jap_heaven_dissolution_event_title: "La « voix céleste » mène à la dissolution"
 jap_heaven_dissolution_event_description: "Ichiro Hatoyama, lorsqu'il a été nommé Premier ministre le mois dernier, avait stratégiquement obtenu le soutien des ailes droite et gauche du Shakai-to, car son parti, Minshu-to, n'avait pas la majorité à la Chambre des représentants. En échange de cette collaboration, Hatoyama promet aux partis socialistes une dissolution rapide de la Diète.\n\nAujourd'hui, lors de la séance plénière de la Chambre des Représentants, une question représentative sur les trois discours du gouvernement a entraîné une évolution inattendue. Hatoyama, accompagné d'Hisato Ichimada, le ministre des Finances, a répondu aux questions de Masamichi Cho, membre de Shakai. Suite à cela, le ministre du Commerce international et de l'Industrie, Tanzan Ishibashi, est monté sur le podium pour sa séance de questions-réponses.\n\nCependant, les débats ont pris une tournure inattendue lorsque le président de la Chambre To Matsunaga a brusquement interrompu Ishibashi, criant de toute urgence : « Ishibashi Tanzan-kun, Ishibashi Tanzan-kun... » Après avoir créé un moment de suspense, Matsunaga a poursuivi : « Ministre Ishibashi, s'il vous plaît, attendez un moment. » L'impatience des membres du Minshu-to et des partis socialistes atteignit son paroxysme lorsque Matsunaga annonça : « Je viens d'être informé que le Premier ministre a émis un rescrit impérial, que je vais maintenant lire à haute voix. Matsunaga a ensuite lu à haute voix le rescrit impérial, déclarant : « Conformément à l'article 7 de la Constitution du Japon, la Chambre des représentants est dissoute. » Dans une réponse sans précédent, la Chambre des représentants a éclaté en applaudissements et les membres ont crié « Banzai ! Banzai ! » célébrant la dissolution tant attendue.\n\nInterrogé plus tard par un journaliste sur le moment de la dissolution, Hatoyama a répondu de manière nonchalante, en disant : « Parce que j'ai entendu une voix venant du ciel »."
 jap_heaven_dissolution_event_response: "Un message divin venant de ce qui précède ?"
 
 jap_treaty.1.t: "[GetNewspaperHeader]Le traité de San Francisco"
 jap_treaty.1.d: "Aujourd'hui, le Traité de paix de San Francisco a été officiellement signé par 48 nations entre le Japon et les puissances alliées. Ce traité sert à mettre officiellement fin à la position du Japon en tant que puissance impériale, à allouer des compensations aux civils alliés et aux anciens prisonniers de guerre qui ont subi des crimes de guerre japonais pendant la Seconde Guerre mondiale, et à mettre fin à l'occupation alliée du Japon d'après-guerre dirigée par les États-Unis et à restituer la souveraineté. Ce traité a largement utilisé la Charte des Nations Unies et la Déclaration universelle des droits de l'homme pour énoncer les objectifs des Alliés. Dès le début de la conférence, l'Union soviétique a exprimé une opposition vigoureuse et virulente au projet de texte de traité préparé par les États-Unis. Ce traité a également introduit le problème du statut juridique de Taiwan en raison de son manque de précision quant au pays qui devait être cédé à Taiwan, et c'est pourquoi certains partisans de l'indépendance de Taiwan soutiennent que la souveraineté de Taiwan est encore indéterminée. De plus, le Japon a accepté les jugements du Tribunal militaire international pour l'Extrême-Orient et d'autres tribunaux alliés pour les crimes de guerre conformément à l'article 11.\nBien que le traité signé n'ait pas encore été mis en oeuvre, ce jour signifie beaucoup pour le Japon et son peuple, car la nation sera enfin libérée de l'occupation."
 jap_treaty.1.a: "Un pas de plus vers l'indépendance !"
 jap_treaty.1.b: "La charte de l'ONU a été un succès !"
 JAP_Treaty_of_San_Francisco_event_tt: "§GLe§! §C28 avril 1952,§! §Gl'occupation prendra fin et§! §Yle Japon§! §Gsera§! §Yindépendant§!!"
 jap_treaty.2.t: "[GetNewspaperHeader]Le Japon retrouve sa souveraineté"
 jap_treaty.2.d: "Au coeur de Tokyo, l'histoire se déroule alors que le Conseil allié tient sa dernière réunion. Le Traité de San Francisco est appliqué, brisant les chaînes de l'occupation. Les accusations amères des Soviétiques, comme des échos qui s'éteignent, sont noyées par les acclamations retentissantes d'une nation renaissante. L'occupation alliée n'est plus qu'un souvenir, et le Japon récupère sa souveraineté, éteignant les dernières braises du commandement étranger. L'empereur Showa, d'une voix inébranlable, s'adresse à une nation meurtrie par les ravages de la guerre, délivrant une proclamation émouvante de liberté retrouvée. L'air est rempli d'une explosion de joie jubilatoire alors que les gens accueillent l'aube d'une nouvelle ère. Le drapeau cramoisi Hinomaru se déploie sur le bâtiment Dai-Ichi alors que le Japon, autrefois une terre occupée, sort victorieux - un phénix indépendant renaissant de ses cendres, se tenant fièrement dans la communauté des nations libres.\n\nAprès des années d'inimitié, le Japon et l'Amérique sont désormais amis puisque l'ambassade du Japon a rouvert ses portes à Washington après près d'une décennie. Le soleil s'est levé sur une nouvelle ère et le Pays du Soleil Levant brille de mille feux dans le monde, témoignage de la résilience et de l'esprit d'une nation qui a surmonté l'adversité."
 jap_treaty.2.a: "Et ainsi commence notre nouveau chemin !"
 jap_treaty.2.b: "Que la paix règne."
 jap_treaty.6.t: "Accord de pêche nippo-soviétique"
 jap_treaty.6.d: "Suite à l'impact négatif de la ligne Boulganine sur l'industrie de la pêche d'Hokkaido, le gouvernement japonais s'est vu contraint d'engager des négociations avec l'Union soviétique pour améliorer la situation. Le Premier ministre Hatoyama, reconnaissant l'urgence de la question, a nommé Ichiro Kono, membre distingué du Jimin-to et ministre de l'Agriculture, comme négociateur en chef.\n\nKono ne perdit pas de temps et s'envola pour Moscou avec son envoyé pour entamer des discussions avec le ministre soviétique de la Pêche, Alexandre Ichkov. Cependant, Kono a pris une mesure audacieuse et a demandé des négociations directes avec nul autre que le Premier ministre soviétique lui-même. Les négociations ont commencé le 9 mai, Kono s'engageant dans des discussions directes avec le Premier ministre soviétique (la rumeur circule dans les cercles diplomatiques selon laquelle Kono a mené ces négociations sans avoir besoin d'un interprète ou d'un traducteur).\n\nAujourd'hui, après de longues délibérations, l'accord de pêche nippo-soviétique a été finalisé et officiellement signé. L'accord prévoit notamment un assouplissement des restrictions imposées par la ligne Bulganin, offrant ainsi une lueur d'espoir aux pêcheurs mécontents d'Hokkaido. Cependant, l'accord précisait également les types et les quantités de poissons que les navires de pêche japonais étaient autorisés à capturer dans la zone des 200 milles marins. En outre, le nombre de bateaux de pêche autorisés à entrer dans la zone était limité, nécessitait un permis délivré par le gouvernement soviétique, et étaient tenus de déclarer la quantité de pêche qu'ils avaient capturée et de tenir un journal de leurs opérations. Le Comité des pêches nippo-soviétique a également été créé, qui se réunirait au moins une fois par an pour décider de mesures de réglementation coopératives pour le saumon, la truite, le hareng, le crabe, etc. Afin de conserver et d'augmenter les stocks et de maintenir une productivité durable maximale.\n\nOn a également évoqué un certain « accord secret » entre Kono et le Premier ministre soviétique. Les spéculations suggèrent qu'au cours des négociations, Kono aurait pu accéder à une condition proposée par les Soviétiques. En échange de l'autorisation de pêcher dans la zone précédemment restreinte, Kono aurait pu retirer la demande du Japon concernant la restitution d'Etorofu et de Kunashiri, deux îles contestées.\n\nNéanmoins, le dégel de relations diplomatiques tendues a ouvert la porte à un dialogue plus approfondi. Il est confirmé que les négociations nippo-soviétiques reprendront le 31 juillet."
 jap_treaty.6.a: "Des restrictions inutiles, mais mieux que rien."
 jap_treaty.6.b: "Ils devraient être reconnaissants de notre générosité."
 jap_treaty.8.t: "[GetNewspaperHeader]Déclaration conjointe Japon-Soviétique"
 jap_treaty.8.d: "Au milieu d'une grande cérémonie et d'une fanfare diplomatique, la signature de la Déclaration commune a eu lieu dans les salles du Kremlin. Sur l'estrade se tenaient fièrement trois représentants du Japon - le Premier ministre Hatoyama, le ministre de l'Agriculture Kono et l'envoyé diplomatique Matsumoto - aux côtés de leurs homologues soviétiques, le Premier ministre Boulganine et le ministre des Affaires étrangères Dmitri Shepilov.\n\nLa déclaration décrit les accords cruciaux entre les deux nations. Il a clarifié la fin de l'état de guerre, le rétablissement des relations diplomatiques et le respect mutuel de la souveraineté et de la non-ingérence. En outre, il affirmait le soutien de l'Union soviétique à l'entrée du Japon aux Nations Unies et au rapatriement des prisonniers de guerre japonais. Cependant, l'absence de mention explicite des questions territoriales a donné lieu à des interprétations divergentes. Alors que le Japon considérait la lettre d'accompagnement de Matsumoto-Gromyko comme un engagement à poursuivre les discussions sur les territoires contestés, l'Union soviétique considérait ce point comme non pertinent à la lumière de la déclaration commune globale.\n\nMalgré ces nuances, le décor est planté pour un nouveau chapitre des relations bilatérales, caractérisé par la coopération et la prospérité mutuelle entre les deux pays."
 jap_treaty.8.a: "Espérons que la paix mutuelle soit éternelle."
 jap_treaty.8.b: "Même au milieu de la guerre froide qui se prépare, il existe des exemples de paix."

 jap_yoshida.1.t: "Motion de censure adoptée avec succès"
 jap_yoshida.1.d: "Aujourd'hui, Ichiro Hatoyama, ainsi que Nobusuke Kishi, Hiroo Wada et Inejiro Asanuma, personnalités clés respectivement des partis Minshu-to, Shakai-to Saha et Shakai-to Uha, se sont réunis dans le bureau du président du Comité permanent, dans les couloirs du bâtiment de la Chambre des représentants.\n\nAlors que les poids lourds politiques engageaient des discussions, les reporters et les journalistes se pressaient autour d'eux, capturant chaque instant avec un barrage de flashs d'appareil photo. L'atmosphère était chargée d'impatience alors que la Diète attendait les résultats de cette réunion.\n\nAprès d'intenses délibérations, Ichiro Hatoyama, représentant le parti Minshu-to, a déposé la motion de censure sur la table et l'a signé avec détermination. Se tournant vers sa droite, il demanda confirmation à son bras droit, Nobusuke Kishi, un sourire jouant sur ses lèvres. « Est-ce vrai, Kishi-san ? » demanda Hatoyama. Kishi, tirant sur une cigarette, rit et hocha la tête d'un air approbateur : \"En effet, ça l'est !\" Avec un signe de tête de Kishi, la motion a ensuite été transmise à leurs alliés inattendus, les dirigeants socialistes Hiroo Wada et Inejiro Asanuma, représentant à la fois les partis socialistes de droite et de gauche. Les deux dirigeants socialistes ont apposé leur signature sur le journal, scellant leur engagement dans ce bouleversement politique. Une fois le document finalisé, les dirigeants de l'opposition l'ont remis au président de la Chambre des représentants, Yasujiro Tsutsumi, qui se tenait à leurs côtés et observait attentivement les débats. Un sourire orna le visage de Tsutsumi alors qu'il acceptait gracieusement le journal, remerciant les représentants de l'opposition pour leur temps et leur dévouement.\n\nPlus tard dans la journée, lors de la séance plénière de la Chambre des représentants, la motion de censure a été mise aux voix et adoptée avec succès."
 jap_yoshida.1.a: "Après tout, c'était inévitable."
 jap_yoshida.2.t: "Le cabinet Yoshida démissionne en masse"
 jap_yoshida.2.d: "Face à l'incertitude persistante autour du sort du cabinet Yoshida, des journalistes se sont rassemblés devant le bâtiment de la Diète nationale pour obtenir des informations tandis que le président de la Chambre des représentants, Yasujiro Tsutsumi, s'adressait à la foule anxieuse. Soudain, le secrétaire en chef du Cabinet, Kenji Fukunaga, s'est précipité vers lui, un sentiment d'urgence gravé sur son visage. « Tsutsumi-san ! Tsutsumi-san ! » s'est exclamé Fukunaga, remettant un avis officiel de nul autre que le Premier ministre Yoshida lui-même. Alors que le Président parcourait attentivement le document, il est devenu évident que quelque chose de très important se préparait.\n\nRapidement, Tsutsumi a organisé une conférence de presse impromptue, invitant les journalistes à se rassembler pour une annonce majeure. Au milieu d'une rafale de flashs d'appareil photo, Fukunaga, avec un visage triste, a lu à haute voix le contenu de l'avis officiel. Le cabinet Yoshida avait finalement pris la décision de démissionner en masse.\n\nEn quelques instants, une nuée de journalistes est descendue sur la résidence du Premier ministre, leurs objectifs capturant chaque voiture de luxe officielle qui en sortait. Sur l'une de ces photographies, le vice-Premier ministre Taketora Ogata a été photographié assis sur la banquette arrière avec une expression malheureuse. Des informations non confirmées faisaient état d'une vive dispute entre Yoshida et Ogata, découlant de l'intention du Premier ministre de dissoudre la Chambre des représentants, à laquelle s'est fermement opposé Ogata, qui, à son tour, a convaincu Yoshida d'opter pour la démission.\n\nPendant ce temps, au siège du parti Minshu-to, les députés se sont rassemblés autour des radios, s'accrochant à chaque mot tandis que la déclaration officielle résonnait sur les ondes. Une vague d'exaltation a balayé la salle à mesure que la nouvelle se répandait : le cabinet Yoshida avait démissionné. Des acclamations banzaï ont éclaté, faisant écho au soulagement et à la joie refoulés parmi les dirigeants du parti.\n\nLa démission sera effective le 10 et Ichiro Hatoyama devrait être le prochain Premier ministre."
 jap_yoshida.2.a: "Adieu Yoshida, ce fut une longue course."
