 JAP_Current_Era_Name_Showa: "Showa"
 JAP_LDP_Party_Strength: "La force du parti LDP"
 JAP_LDP_Party_Strength_desc: "Le Parti libéral-démocrate (Jiyu Minshu-to) est un parti politique puissant du Japon, étant la plus grande force politique du camp conservateur. Mais avec l'existence de factions au sein du parti et les bagarres entre certains législateurs éminents du PLD, la force du parti vacille fréquemment. Il est nécessaire que nous maintenions la force du parti à un niveau élevé pour garantir une administration stable."
