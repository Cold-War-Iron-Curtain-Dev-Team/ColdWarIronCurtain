 JAP_Emperor: "Sa Majesté l'Empereur"
 JAP_Emperor_desc: "Notre empereur dirige la nation depuis sa fondation par Sa Majesté l'empereur Jimmu, il y a environ 2 700 ans. Même dans les moments les plus difficiles, le règne divin de notre empereur a maintenu la nation unie, agissant comme un symbole d'espoir pour notre peuple."
 JAP_Emperor_tt: "Empereur actuel : §C[JAP_Current_Emperor_Name]§!\nÉpoque actuelle : §C[JAP_Current_Era_Name]§!"
