 Operation_Firebird.1.d: "Dans le cadre de la guerre de Corée en cours, le commandant en chef de l'UNCOM, le général Douglas MacArthur, a lancé l'opération Hudson Harbour, un plan qui restera désormais dans l'infamie. Sous le couvert de la nuit, cinquante B-29 ont décollé de plusieurs pistes d'atterrissage et porte-avions positionnés à portée de la frontière coréo-mandchoue, tous armés d'une charge nucléaire. Un par un, ils ont livré leurs charges infernales, décimant la frontière d'Antung à Hunchun et piégeant efficacement l'Armée rouge chinoise. La frappe a été encore élargie, avec un B-29 escorté qui a lancé une bombe à charge utile plus élevée lors d'une attaque brutale sur Pékin. En quelques heures, les lignes de ravitaillement et de commandement des communistes qui les soutenaient ont été détruites et les Armées rouges ont été désorganisées. Aujourd'hui, le commandant en chef a entamé la deuxième phase de son plan, alors que des centaines de milliers de soldats américains et du Kuomintang débarquent en Chine continentale."
