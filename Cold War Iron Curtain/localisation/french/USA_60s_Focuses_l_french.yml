 Castro.1.d: "Le gouvernement cubain a annoncé qu'une tentative d'assassinat du président Fidel Castro avait été déjouée. Le gouvernement a déclaré qu'une équipe de voyous impérialistes et de traîtres au peuple avait tenté de prendre la vie de Castro mais avait été prise la main dans le sac. Ils ont ajouté que tout Cubain surpris en train de complicité ou d'aider les assassins serait également arrêté et jugé. La justice serait rendue au nom du peuple cubain. Bien que aucun détail n'ait été fourni, le gouvernement cubain a également déclaré qu'il pensait que le complot était le fruit d'agents de renseignement américains. Les États-Unis n'ont pas commenté les accusations d'implication dans cette tentative, mais ont déclaré que ces tentatives démontraient le désir des Cubains de se libérer de Castro et de son régime oppressif."			#Plans to Assassinate Castro
 Castro.2.d: "Avant la Révolution cubaine, les chefs du crime américains possédaient des casinos, des hôtels et d'autres actifs économiques précieux à travers Cuba. Cependant, après la Révolution cubaine, Fidel Castro a mené une campagne visant à restreindre l'accès des étrangers aux actifs cubains et de nombreux chefs du crime américain ont perdu des millions. Aujourd'hui, ces groupes ont pris leur revanche en utilisant leurs contacts d'avant la Révolution pour introduire du poison, fourni par la Central Intelligence Agency (CIA), dans la nourriture de Castro. Le leader cubain est décédé dans la matinée. Cette évolution choquante a été bien accueillie à Washington, mais à travers Cuba, des centaines de milliers de personnes ont manifesté leur chagrin face à la mort de leur héros national populaire. Le gouvernement cubain a rapidement promis des représailles à toute personne impliquée dans le complot."			#Assassination of Castro
 Castro.3.d: "Avant la Révolution cubaine, les chefs du crime américains possédaient des casinos, des hôtels et d'autres actifs économiques précieux à travers Cuba. Cependant, après la Révolution cubaine, Fidel Castro a mené une campagne visant à restreindre l'accès des étrangers aux actifs cubains et de nombreux chefs du crime américain ont perdu des millions. Aujourd'hui, une tentative d'empoisonnement de la nourriture du dirigeant cubain Fidel Castro a été découverte. Les forces de sécurité cubaines ont rapidement capturé le groupe qui avait livré le plat empoisonné à Castro et ont annoncé que le complot était ourdi par la mafia américaine. Le gouvernement cubain a ajouté la sophistication du poison et l'organisation du plan leur a fait soupçonner que la mafia travaillait en étroite collaboration avec le gouvernement américain. Jusqu'à présent, les États-Unis n'ont pas commenté ces accusations."			#Failed Assassination of Castro

 CIA.7.d: "L'opération HTLINGUAL, l'examen des produits postaux entrant et sortant des États-Unis et destinés aux pays communistes, a été approuvée pour expansion par la CIA. Initialement destiné uniquement à collecter des adresses et des noms à l'extérieur de courriers suspects à destination de pays tels que l'Union soviétique et la République populaire de Chine. La nouvelle expansion de la CIA a financé l'ouverture de deux nouveaux centres d'inspection rigoureux à New York et à Los Angeles pour assurer la sécurité du peuple américain. Bien qu'elle ait été initialement créée pour obtenir des renseignements sur des adversaires étrangers, la CIA a également commencé à garder un oeil sur le courrier d'éventuels fauteurs de troubles et activistes nationaux tels que Martin Luther King et John Steinbeck."				#Expand Project HTLINGUAL
 power_pack.2.d: "Après la fin des combats dans la guerre civile en République Dominicaine, nous pouvons enfin organiser de nouvelles élections avec notre gouvernement provisoire nouvellement installé et nous visons à les organiser d'ici l'année prochaine. Même si notre président est accusé de « diplomatie de la canonnière » que ses prédécesseurs au pouvoir ont pratiquée au XXe siècle, où les marines américains ont envahi et occupé un certain nombre de pays d'Amérique latine sous le moindre prétexte. Nos hommes sur le terrain, principalement des hommes des unités aéroportées, mènent des opérations de sécurité et fournissent une aide aux membres des deux factions, de la nourriture, de l'eau et des fournitures médicales."		#Crush the Dominican Rebellion
 CIA.1.d: "Le projet MKUltra a récemment été lancé, il s'agit d'un programme dont le but est de réaliser des expériences sur des sujets humains pour identifier et développer des drogues et des procédures à utiliser lors de l'interrogatoire afin d'affaiblir l'individu et de forcer des aveux/extraire des informations par le contrôle mental. Il est organisé par le Bureau du renseignement scientifique de la CIA et coordonné par les laboratoires de guerre biologique de l'armée américaine. Nous avons examiné les moyens utilisant des méthodes chimiques, biologiques et radiologiques de contrôle mental dans le cadre de MKUltra. Certaines de nos expériences comprenaient l'administration de LSD à des malades mentaux, des prisonniers, des toxicomanes et des travailleuses du sexe. Choisir les personnes les moins susceptibles de raconter leur expérience ici est de la plus haute importance."				#Operation MKUltra
 CIA.2.d: "La CIA a confirmé qu'elle mettrait en oeuvre l'opération Mockingbird. Mockingbird, idée originale du directeur de la CIA Allen Dulles, implique de nombreuses actions indépendantes à travers les États-Unis pour garantir la validité du contenu publié dans les journaux. La CIA livrera des rapports conformes à la politique américaine entre les mains de journalistes coopérants, du New York Times au Washington Post. En plus de contenir la publication de propagande anti-américaine et d'augmenter la quantité d'informations pro-américaines dans le flux des journaux, certaines agences civiques telles que la National Student Association seront financées par la CIA"				#Operation Mockingbird
 CIA.3.d: "Étant l'un des nombreux sous-projets de MKULTRA, l'opération Midnight Climax est l'une des plus étranges que notre agence de renseignement ait jamais entreprise. Les agents de la CIA impliqués dans Midnight Climax engageaient des prostituées à San Francisco pour attirer les clients dans les bordels. Une fois sur place, les agents ont secrètement drogué leurs cibles et les ont regardées se livrer à des activités sexuelles derrière un miroir sans tain. L'un des responsables du projet a créé une maison close à San Francisco, il souhaitait que l'endroit ait \"un look de bordel à la française\", a-t-il déclaré. Espérons que les opérations qu'ils mènent soient concluantes et rapportent de nombreux résultats pour approfondir les données scientifiques que MKULTRA tente d'obtenir."				#Operation Midnight Climax
 CIA.4.d: "Le projet MKNAOMI est le nom de code d'un programme de recherche conjoint entre la Central Intelligence Agency et le ministère de la Défense, lancé à peu près au même moment que le lancement de MKUltra. Il se concentre sur les agents de guerre biologique, en particulier sur la capacité de stocker des matériaux susceptibles de neutraliser ou de tuer un sujet de test et de développer des dispositifs pour la diffusion de tels matériaux. La surveillance, les tests, la mise à niveau et l'évaluation de matériaux spéciaux ont également été assurés par MKNAOMI pour garantir qu'aucun défaut ni problème indésirable n'apparaisse lors de l'utilisation réelle. Le SOC de l'armée américaine a été chargé d'assister la CIA pendant le développement. L'une de ces inventions était une arme à feu modifiée qui tirait des fléchettes spéciales recouvertes d'agents biologiques et de diverses pilules empoisonnées. Ils ont été testés sur des chiens de garde, permettant aux agents d'infiltrer la zone que les chiens gardaient, puis étaient utilisés pour réveiller les chiens à la sortie de l'établissement. "				#Operation MKNAOMI
 CIA.5.d: "Projet parent de MKOFTEN, le projet MKULTRA de la CIA a été renommé MKSEARCH, indiquant une recherche raffinée d'un sérum de vérité plus parfait. Basé sur certaines recherches antérieures de médecins impliqués dans l'OSS et plus tard dans la CIA, qui avaient étudié les expériences de psychiatres allemands avec des prisonniers des camps de concentration, le projet nécessite davantage de « consommables », ou de sujets de test. Les tests MKSEARCH seraient effectués dans les refuges de la CIA dans des villes comme Washington, New York, Chicago et Los Angeles. Les expériences se concentreraient sur l'exploitation des faiblesses humaines et la déstabilisation de la personnalité humaine. Dans les grandes villes, a-t-on suggéré, il serait beaucoup plus facile de trouver des « consommables » qui ne manqueraient pas que dans les petites villes ou les zones rurales. Les sujets des expériences seraient exposés à des tests destinés à créer des perturbations du comportement, des altérations des schémas sexuels et une stimulation des aberrations, qui pourraient tous être utilisés dans le processus d'interrogation et d'obtention d'informations." #Operation MKSEARCH
 CIA.6.d: "Le projet MKOFTEN était un programme secret du ministère de la Défense développé en collaboration avec la Central Intelligence Agency. Programme partenaire de MKSEARCH, l'objectif de MKOFTEN était de « tester les effets comportementaux et toxicologiques de certains médicaments sur les animaux et les humains ». Dans le cadre de l'Opération Souvent de la CIA, un programme connexe a également été lancé pour explorer le « monde de la magie noire » et « exploiter les forces des ténèbres et remettre en question le concept selon lequel les confins de l'esprit sont hors de portée ». Dans le cadre de l'opération, des employés de la CIA ont rendu visite et recruté des voyants, des lecteurs de paume, des clairvoyants, des astrologues, des médiums, des médiums et de nombreux autres praticiens occultes. MKOFTEN était impliqué dans « tout, depuis les séances et la sorcellerie jusqu'à la visualisation à distance et aux drogues exotiques."				#Project MKOFTEN
 CIA.8.d: "L'Opération CHAOS ou MHCHAOS était un projet d'espionnage national de la Central Intelligence Agency ciblant le peuple américain. Il a été lancé en 1967. Notre mission est de découvrir une éventuelle influence étrangère sur la race nationale, les mouvements anti-guerre et autres mouvements de protestation. Il a été lancé sous la direction du directeur du renseignement central. Lorsque [USA.GetLeader] a été élu en 1968, les activités de surveillance intérieure existantes ont été regroupées dans l'Opération CHAOS. Le projet a utilisé les stations de la CIA à l'étranger pour rendre compte des activités anti-guerre des citoyens américains voyageant à l'étranger, en employant des méthodes telles que la surveillance physique et l'écoute électronique, en utilisant des « services de liaison » pour maintenir une telle surveillance. Les opérations ont ensuite été élargies pour inclure davantage d'hommes. En 1969, suite à son expansion, l'opération a commencé à développer son propre réseau d'informateurs dans le but d'infiltrer divers groupes anti-guerre étrangers situés dans des pays étrangers et susceptibles d'avoir des liens avec des groupes américains." #Operation MERRIMAC, Project MCHAOS
 CIA.9.d: "Le projet MERRIMAC était une opération d'espionnage domestique qui a débuté en 1967. Coordonnée par le Bureau de sécurité de la CIA. Cela impliquait des procédures de collecte d'informations via l'infiltration et la surveillance de groupes anti-guerre basés à Washington qui pourraient constituer des menaces potentielles pour la CIA. Cependant, le type de données recueillies comprenait également des informations générales sur les infrastructures des communautés ciblées. Le projet MERRIMAC et son programme jumeau, le projet RESISTANCE, ont tous deux été coordonnés par le Bureau de sécurité de la CIA. De plus, les projets jumeaux étaient des opérations de branche qui relayaient des informations civiles à leur programme parent, l'Opération CHAOS."				#
 CIA.10.d: "Le projet RESISTANCE était une opération d'espionnage nationale coordonnée par la Division des opérations nationales de la CIA. Son objectif est de collecter des informations générales sur des groupes aux États-Unis qui pourraient constituer une menace pour les installations et le personnel de la CIA. À partir de 1967, de nombreux services de police locaux, membres du personnel des campus universitaires et autres informateurs indépendants ont collaboré avec la CIA pour suivre les groupes étudiants radicaux qui s'opposaient à la politique étrangère du gouvernement américain à l'égard du Vietnam. Le projet RESISTANCE et son programme jumeau, le projet MERRIMAC, ont tous deux été coordonnés par le Bureau de sécurité de la CIA. De plus, les projets jumeaux étaient des opérations de branche qui relayaient des informations civiles à leur programme parent, l'Opération CHAOS."				#Operation RESISTANCE
 Operation_Shock.1.d: "Après l'offensive du Têt, une petite équipe d'analystes de la CIA dirigée par George Carver a réagi à l'attaque en élaborant un plan qu'ils ont appelé Opération Choc. Les analystes craignaient que les généraux du gouvernement sud-vietnamien se sentent trop à l'aise avec l'aide de l'armée américaine, ce qui conduirait à un soutien croissant au Vietcong. Le plan est de demander au vice-président de superviser une purge de tous les responsables militaires et civils coupables de corruption ou d'autres abus de pouvoir. L'équipe a également mentionné d'autres solutions pour inverser le cours de la guerre si ce plan échouait, notamment forcer le président actuel à démissionner et laisser un héros de guerre prendre ses fonctions, arrêter temporairement les bombardements du Nord-Vietnam et entamer des pourparlers pour tenter de négocier la capitulation, ou des pourparlers avec le Front de libération nationale pour éventuellement former un gouvernement de coalition. "	#Operation SHOCK
 Secret_War.1.d: "Les activités entreprises par la CIA au Laos ont commencé dès les années 1950, avec certaines forces spéciales américaines entraînant des soldats laotiens aux techniques de guerre asymétrique dès 1959. La CIA elle-même affirme que les opérations aériennes au Laos étaient parmi les plus grandes opérations paramilitaires jamais entreprises par l'organisation. Pendant des années, ils ont dirigé les forces indigènes contre les forces nord-vietnamiennes, organisant également des tribus pour combattre les communistes laotiens. Ils ont même utilisé la compagnie aérienne Air America pour larguer des millions de livres de denrées alimentaires, transporter des milliers de soldats et effectuer des reconnaissances. La CIA opérait avec des lunettes de vision nocturne et des équipements électroniques de pointe. Nos efforts sont superbes, l'utilisation de la main-d'oeuvre a été excellente et nous avons aidé le peuple laotien à lutter contre la menace communiste."
 
 
#News Event
 Diem_Coup.2.d: "Le président du Sud-Vietnam Ngo Dinh Diem et son frère Ngo Dinh Nhu ont été brutalement assassinés lors d'un coup d'État militaire lancé par des officiers nationalistes. Le président Diem est devenu le premier dirigeant du Sud-Vietnam et avait la réputation d'être l'un des principaux militants anticoloniaux et anticommunistes du Vietnam. Catholique profondément dévoué, le régime Diem a eu du mal ces dernières années à faire face aux guérilleros communistes opérant dans les campagnes et à la résistance de la population majoritairement bouddhiste. Après que les putschistes militaires aient isolé Diem des forces loyalistes, ils ont attaqué sa résidence, capturant finalement Diem et son frère qui tentaient de fuir. Malgré les garanties des généraux et des États-Unis que Diem bénéficierait d'un passage sûr hors du pays, lors de son transport vers le quartier général militaire, Diem et son frère ont été frappés à la baïonnette et abattus par un officier subalterne. De nombreux membres de la nouvelle junte au pouvoir ont condamné cet acte, mais on ne sait toujours pas si le meurtre était accidentel ou ordonné par la junte pour consolider le pouvoir. "			#A Coup in South Vietnam
 
 
 Reagan.103.d: "Le président [USA.GetLeader] s'oppose depuis longtemps aux lois sur les droits civiques, mais insiste sur le fait qu'il n'est pas ségrégationniste. Il soutient simplement l'importance des droits des États. Cependant, il s'oppose particulièrement à certaines dispositions de la loi historique sur les droits civils et a chargé de hauts responsables d'étudier les possibilités de modifier le projet de loi pour mettre fin aux restrictions imposées aux États. Cependant, les opposants affirment que ces amendements supprimeraient la protection des minorités et une forte opposition du Congrès est attendue à tout changement. Il n'est pas non plus attendu du président qu'il utilise le pouvoir exécutif pour faciliter l'application de la loi, ce qui, selon beaucoup, pourrait nuire à son impact sur les minorités."
 Goldwater.1.d: "Le président [USA.GetLeader] a annoncé que le gouvernement fédéral respecterait les droits des États et n'imposerait plus un programme fédéral aux États individuels. Le président [USA.GetLeader] a souligné que les exigences fédérales et les ordonnances des tribunaux doivent être mises en oeuvre, mais que les États doivent être autorisés à les mettre en oeuvre selon leurs propres conditions afin de garantir une atmosphère stable et amicale dans tout le pays. L'annonce a été condamnée, en particulier par des militants et des groupes de défense des droits civiques, qui affirment que ne pas forcer les États à se conformer aux directives fédérales les amènera à perpétuer leurs systèmes d'injustice et à éviter d'effectuer les changements drastiques nécessaires."
 USAUrban.1.d: "Après une série de violentes manifestations et de troubles dans les centres urbains américains, le président [USA.GetLeader] a annoncé que la paix était revenue dans toutes les villes américaines. Il a cité les efforts des forces de l'ordre, ainsi que des responsables étatiques et fédéraux, pour lutter contre les troubles. Lorsqu'on lui a demandé s'il ordonnerait une enquête sur les récents troubles, le président a déclaré que cela serait à l'étude. Bien que les troubles soient terminés, les opposants au président suggèrent qu'ils se sont tout simplement éteints ou qu'ils ont été dispersés de force grâce aux efforts du gouvernement. Les unités de la Garde nationale appelées ou mises en alerte dans tout le pays devraient se retirer."
 Bussing.1.d: "Le président [USA.GetLeader] a ordonné aux membres du cabinet et aux hauts fonctionnaires d'ordonner aux fonctionnaires fédéraux de retirer les pressions et les fonds nécessaires aux États pour mettre en oeuvre des programmes de transport en bus de déségrégation. Les programmes de bus placent et déplacent les élèves dans différentes écoles afin de lutter contre la ségrégation et de mettre fin aux inégalités entre les écoles fondées sur des critères raciaux. Le président [USA.GetLeader] a déclaré que même s'il ne s'opposait pas au but du transport en bus, il souhaitait respecter les droits des États et des parents locaux. Il a déclaré que le gouvernement fédéral n'avait pas à s'immiscer aussi directement dans les affaires de la politique éducative nationale et locale."
 Goldwater.201.d: "Dans tout le pays, ce matin, le FBI et les forces de l'ordre locales ont perquisitionné les bureaux du parti liés à d'éminentes organisations nationalistes noires. Le président [USA.GetLeader] s'est adressé aux médias cet après-midi pour annoncer qu'il ordonnait aux agences fédérales de réprimer le nationalisme noir militant. Le président a déclaré que ces organisations se livraient à des activités militantes, à des entraînements aux armes et à des activités illégales, notamment le crime organisé. Il a déclaré que le gouvernement craignait que de tels groupes ne se livrent bientôt à des violences ouvertes contre les non-noirs et le gouvernement. Il a déclaré que les raids de ce matin n'étaient qu'un début et que la campagne s'intensifierait dans les mois à venir."
 Goldwater.202.d: "Le président [USA.GetLeader] a déclaré que son gouvernement publierait un décret pour préserver le principe des droits de l'État. La nouvelle ordonnance garantirait aux États leurs droits et interdirait au gouvernement fédéral de recourir à la force, à l'intimidation ou à des pressions financières pour forcer les États à se conformer aux directives. L'annonce a été chaleureusement accueillie par les sudistes opposés aux récentes décisions de justice fédérales concernant la ségrégation, mais sur les campus universitaires du pays, des manifestations ont éclaté. En outre, plusieurs membres éminents du Congrès ont déclaré que le président profanait les sacrifices des soldats et des citoyens de l'Union pendant la guerre civile."
 Goldwater.200.d: "Hier soir, les Américains qui regardaient les informations ont été stupéfaits de voir la police et les gardes nationaux disperser brutalement les manifestations anti-guerre qui se déroulaient sur plusieurs campus universitaires majeurs. Cela fait suite à la déclaration antérieure du président [USA.GetLeader] selon laquelle les manifestants anti-guerre avaient miné les États-Unis et aidé leurs ennemis à l'étranger. Il a qualifié la menace d'immense et a déclaré que le gouvernement commencerait à sévir contre ces organisations. En plus de disperser violemment les manifestations, le FBI a perquisitionné une importante organisation anti-guerre, saisissant des milliers de documents. Un porte-parole du FBI a déclaré qu'il prévoyait de poursuivre en justice de nombreux dirigeants anti-guerre pour leurs liens avec l'étranger et leurs sympathies communistes violentes."
 Klan.1.d: "La récente renaissance du tristement célèbre Ku Klux Klan et plusieurs incidents de violence très médiatisés contre les Afro-Américains ont poussé le président [USA.GetLeader] à annoncer que le procureur général annoncerait bientôt des accusations contre les dirigeants du Klan impliqués dans les violences. Le président a déclaré que la violence du Klan n'avait pas sa place dans l'Amérique moderne et que le gouvernement ne cesserait pas de poursuivre le groupe jusqu'à ce qu'il mette fin à ses violences contre les citoyens américains. De nombreuses communautés minoritaires à travers le pays accueilleront favorablement la nouvelle, même si la réaction du Klan est inconnue, car sa structure est décentralisée."
 ERA.1.d: "La campagne pour un Amendement pour l'égalité des droits (ERA) a été lancée pour la première fois en 1923. L'amendement vise à mettre fin à toute discrimination légale entre les sexes. L'évolution de la vie sociale et culturelle a relancé les efforts visant à faire adopter l'EER. Des milliers de femmes ont participé à des manifestations ou signé des pétitions exhortant le Congrès à approuver enfin l'ERA. Les femmes se heurtent toujours à des obstacles juridiques dans les affaires liées au divorce et à d'autres questions importantes. Les femmes des universités et des classes moyennes sont à l'origine de la résurgence de l'ERA, mais les femmes de la classe ouvrière s'y opposent, craignant que le projet de loi ne mette fin aux lois sur la protection du travail adoptées pour préserver les droits des femmes sur le lieu de travail."
 JFK_Mafia.1.d: "Le président [USA.GetLeader], travaillant en étroite collaboration avec le procureur général, a ordonné au ministère de la Justice, au FBI et à l'IRS d'ouvrir des enquêtes et de collaborer étroitement sur des affaires ciblant le crime organisé aux États-Unis. Le président a noté que le crime organisé avait prospéré grâce à la concentration des forces de l'ordre fédérales sur des crimes plus manifestes. Bien que ces enquêtes puissent prendre de nombreuses années, le président [USA.GetLeader] espère que des villes comme Las Vegas et Newport Kentucky seront débarrassées des éléments du crime organisé. Cependant, cette nouvelle initiative va sans aucun doute exaspérer de puissantes familles criminelles et susciter des craintes de représailles au sein du gouvernement."
 LBJ_Civil.1.d: "Après l'adoption de la loi sur les droits civils par le président, [USA.GetLeader] des questions ont été soulevées sur la manière d'appliquer la nouvelle loi. De nombreuses communautés du sud, y compris des représentants de l'État, ont résisté à l'application de la loi. Pour lutter contre cela, le président a décidé de lancer des injonctions et des poursuites fédérales et a dépêché des fonctionnaires dans les points chauds afin de faire respecter la loi. Le président envisage également de signer des décrets pour habiliter les agences fédérales à garantir la mise en oeuvre de la loi sur les droits civils. Cependant, cette approche a aliéné certains membres du Congrès qui craignent qu'une ingérence fédérale puisse enhardir les opposants aux droits civiques."
 Nixon.1960.d: "Les Dixiecrats sont apparus comme une faction ségrégationniste et dissidente au sein du Parti démocrate qui a mis fin à sa dissidence en 1948. Cependant, ils sont restés mécontents de la situation des droits civiques et la récente élection présidentielle indique que les démocrates du Sud pourraient changer d'allégeance. Plusieurs États du sud traditionnellement démocrates tombent aux mains du candidat républicain. Ces résultats ont rendu furieux les dirigeants du Parti démocrate, qui ont accusé l'influence Dixiecrat et l'accent mis par les démocrates du Sud sur la ségrégation de tourner le sud vers les républicains. On ne sait pas si les démocrates parviendront à résoudre cette division, mais les républicains devraient essayer de pousser les démocrates du Sud à les rejoindre."
 Nixon_native.1.d: "Le président [USA.GetLeader] a exposé sa vision des relations entre les États-Unis et les nombreuses communautés amérindiennes du pays. Il a annoncé que l'ancienne politique de cessation ou d'assimilation forcée prendrait fin au profit de l'autodétermination. Le président a souligné que les Amérindiens doivent faire leurs propres choix et décisions. Le Bureau des Affaires indiennes enverra des fonds fédéraux aux tribus reconnues pour qu'elles les répartissent selon leurs conditions. Bien que de nombreuses tribus aient applaudi cet effort sans réserve, les Amérindiens urbains ont exprimé leur inquiétude d'être exclus de ces ressources ou à la merci des aînés."
 Rockefeller.1.d: "Le président [USA.GetLeader] a longuement évoqué ses inquiétudes concernant les dépenses sociales du gouvernement. Le président a estimé qu'une aide sociale incontrôlée serait préjudiciable au développement et au caractère social du pays. Dès son entrée en fonction, le président [USA.GetLeader] a rencontré les membres concernés du cabinet et les dirigeants du Congrès pour élaborer une stratégie visant à contrôler les dépenses sociales et à instituer plusieurs programmes, dont un qui verrait les bénéficiaires de l'aide sociale capables de travailler être placés dans des programmes de formation professionnelle. Le président a annoncé aujourd'hui que ses efforts ont porté leurs fruits et que les dépenses sociales, autrefois considérées comme incontrôlables, ont été stabilisées."
 Rockefeller.2.d: "Lors d'une cérémonie publique, le président [USA.GetLeader] a officiellement dévoilé sa nouvelle initiative artistique. Grand collectionneur d'art et mécène lui-même, le président a déclaré fièrement que sa nouvelle initiative artistique permettrait au plus grand artiste des États-Unis non seulement d'obtenir un financement vital pour ses projets, mais également d'être mis en valeur. Il a insisté sur le fait que les talents américains dans tous les domaines doivent être soutenus et que son initiative contribuera à démontrer la créativité américaine et mènera à une plus grande collaboration entre les États-Unis et le reste du monde. Bien que l'initiative ait été saluée dans la presse, ses détracteurs l'ont qualifiée de projet vaniteux de la part du président."
 Desegregation.1.d: "À la suite de la décision de la Cour suprême déclarant la ségrégation inconstitutionnelle, le vétéran militaire James Meredith a tenté de s'inscrire comme étudiant à l'Université du Mississippi (également appelée Ole Miss). Meredith a rencontré des manifestants hostiles et le gouverneur a refusé de protéger ou de soutenir la déségrégation de l'université. En réponse, le président [USA.GetLeader] a ordonné aujourd'hui aux maréchaux des États-Unis et à l'armée américaine d'imposer la déségrégation et de se déployer sur le campus. Meredith devrait s'inscrire sous la protection des maréchaux et des troupes, mais des milliers de manifestants anti-déségrégation se rassemblent, beaucoup craignant que des violences ne surviennent entre les troupes fédérales et les manifestants furieux."
 Desegratation.2.d: "Aujourd'hui à la Maison Blanche, le président [USA.GetLeader] a signé le décret 11063. Le décret « ... Interdit la discrimination dans la vente, la location ou toute autre disposition de propriétés et d'installations détenues ou exploitées par le gouvernement fédéral avec des fonds fédéraux.» La ségrégation a désormais été interdite dans tous les logements financés par le gouvernement fédéral et est saluée comme une grande victoire du mouvement des droits civiques. Plus important encore, beaucoup espèrent que cette ordonnance mettra fin à une pratique de plusieurs décennies selon laquelle les communautés noires sont chroniquement sous-financées par les fonds fédéraux, en particulier dans les communautés ayant un besoin pressant de tels logements."
 Wallace.5.d: "La guerre contre la drogue est une campagne menée par le gouvernement américain et dirigée par le président [USA.GetLeader] concernant la prohibition des drogues, l'aide militaire et l'intervention militaire dans le but de réduire le commerce illégal de drogues aux États-Unis. Le plan comprend un ensemble de politiques antidrogues visant à décourager la production, la distribution et la consommation de drogues psychoactives que les gouvernements participants et les Nations Unies ont déclaré illégales. Certaines méthodes utilisées contre les drogues incluent une augmentation drastique des peines pour tout ce qui y est lié, la propriété, la vente, l'utilisation, la production, peu importe, ils vous incarcéreront. Selon certaines ONG, la guerre contre la drogue provoque une forte hausse des taux d'arrestation qui ciblent de manière disproportionnée les Afro-Américains en raison de divers facteurs. Certains affirment que la guerre contre la drogue est utilisée pour criminaliser et perturber les communautés noires et hippies et leurs dirigeants. N'oubliez jamais que la drogue est l'ennemi public numéro un !"   #War on Drugs

 US_60s_The_CIA: "La CIA"
 US_60s_The_CIA_desc: "La Central Intelligence Agency est, en effet, au coeur de notre lutte contre l'Union soviétique et ses marionnettes communistes. Nos maîtres espions affirment qu'ils ont préparé un certain nombre d'opérations à travers le monde pour faire pencher la balance en notre faveur. Peut-être devrions-nous simplement les renommer Agence d'intervention (anti) communiste ?"
 USA_60s_Domestic_Affairs: "Affaires intérieures"
 USA_60s_Domestic_Affairs_desc: "Même si nous devons encore maintenir notre vision d'un ordre mondial démocratique, nous ne pouvons pas ignorer les problèmes que nous rencontrons chez nous. Si nous perdons sur le front intérieur, comment pouvons-nous avoir une chance de réussir à l'étranger ?"
 USA_60s_Latin_America_Desk: "Bureau Amérique Latine"
 USA_60s_Latin_America_Desk_desc: "Nos voisins du Sud sont actuellement un foyer d'instigateurs et de propagande communistes. De nombreux pays, notamment Cuba, situé à proximité de nos côtes, sont déjà tombés. Nous devons agir vite."
 USA_60s_Launch_the_Bay_of_Pigs: "Lancez la Baie des Cochons"
 USA_60s_Launch_the_Bay_of_Pigs_desc: "Nos meilleurs espions à Cuba ont élaboré un plan audacieux pour renverser Fidel Castro. En utilisant des exilés cubains formés par la CIA pour cacher notre implication, nos forces débarqueront sur une plage du sud-ouest de Cuba et reprendront la nation insulaire par la force."
 USA_Attempt_to_Assasinate_Castro: "Tentative d'assassinat de Castro"
 USA_Attempt_to_Assasinate_Castro_desc: "Après la débâcle de la Baie des Cochons, nous sommes à court d'options pour nous débarrasser de la dictature communiste cubaine. Notre prochain meilleur pari est d'organiser une tentative d'assassinat contre Fidel Castro et d'éliminer l'homme qui maintient le régime tout entier."
 USA_Operation_Northwoods: "Opération Northwoods"
 USA_Operation_Northwoods_desc: "L'opération Northwoods est une opération proposée sous fausse bannière pour justifier une invasion de Cuba. Si le feu est donné, des agents déguisés de la CIA se livreront à de véritables actes de terreur à travers les États-Unis dans le but de provoquer l'indignation contre Cuba."
 USA_Deal_with_the_Underworld: "Affronter les enfers"
 USA_Deal_with_the_Underworld_desc: "S'il est désagréable de traiter avec des chefs et des gangs criminels mécontents, les complots d'assassinat le sont tout autant. Faire en sorte qu'ils empoisonnent le repas de Fidel Castro est l'une des meilleures chances que nous ayons jamais d'éliminer la menace communiste de nos côtes."
 USA_Re_Establish_Mafia_in_Cuba: "Rétablir la mafia à Cuba"
 USA_Re_Establish_Mafia_in_Cuba_desc: "Maintenant que nos exilés cubains ont vaincu les forces communistes, il est temps de rétablir l'ordre ancien avant l'arrivée au pouvoir de Castro. Une partie de cet ordre est constituée par les gangs mafieux qui, bien que manifestement criminels, seront essentiels au maintien de l'ordre."
 USA_60s_Cuban_Deathsquads: "Escadrons de la mort cubains"
 USA_60s_Cuban_Deathsquads_desc: "Malgré la chute de Castro, de nombreux Cubains protestent et se révoltent contre leur liberté retrouvée ! Cela ne peut pas continuer. Former des escadrons de la mort pour protéger nos intérêts est nécessaire pour détruire à jamais le communisme cubain."
 USA_60s_Depose_Juan_Velasco: "Déposer Juan Velasco Alvarado"
 USA_60s_Depose_Juan_Velasco_desc: "Juan Velasco Alvarado, le dirigeant du Pérou, est un despote tyrannique et doit être destitué. Nos agents sont en place et attendent le feu vert."
 USA_60s_Establish_Ecuadorian_Junta: "Créer une junte équatorienne"
 USA_60s_Establish_Ecuadorian_Junta_desc: "Même si l'Équateur n'est pas encore communiste, il est temps de créer un nouveau régime. Même si une véritable démocratie est préférable, une junte militaire forte est nécessaire pour maintenir la stabilité et le statu quo."
 USA_60s_Operation_POWER_PACK: "Fonctionnement POWER PACK"
 USA_60s_Operation_POWER_PACK_desc: "La République dominicaine est tombée dans le chaos et un autre régime communiste est sur le point de s'installer dans les Caraïbes. Cela ne peut pas arriver. En envoyant nos propres troupes pour aider les forces démocratiques, nous pouvons empêcher un autre Cuba."
 USA_60s_Crush_The_Dominican_Rebellion: "Écraser la rébellion dominicaine"
 USA_60s_Crush_The_Dominican_Rebellion_desc: "Maintenant que nos troupes sont à terre et ont repoussé les rebelles communistes, il est temps de mettre fin à cette folie. Écrasez les rouges et ne montrez aucune pitié !"
 USA_60s_Launch_Coup_in_Bolivia: "Coup d'État en Bolivie"
 USA_60s_Launch_Coup_in_Bolivia_desc: "Le gouvernement bolivien affiche trop de tendances de gauche à notre goût. Nous devons le remplacer avant qu'il ne montre ses vraies couleurs et ne rejoigne les Soviétiques."
 USA_60s_Assasinate_Rafael_Trujillo: "Assassiner Rafael Trujillo"
 USA_60s_Assasinate_Rafael_Trujillo_desc: "Homme fort de la République dominicaine depuis les années 1930, Trujillo a supervisé un nouveau règne de terreur dans les Caraïbes. Il doit partir, même s'il n'est pas communiste."
 USA_60s_Train_Brazilian_Deathsquads: "Former des escadrons de la mort brésiliens"
 USA_60s_Train_Brazilian_Deathsquads_desc: "Pour réprimer les instigateurs communistes au Brésil, nous devrions organiser et soutenir des escadrons de la mort de droite pour les faire taire."
 USA_60s_Train_Uruguayan_Death_Squads: "Former des escadrons de la mort uruguayens"
 USA_60s_Train_Uruguayan_Death_Squads_desc: "Pour réprimer les instigateurs communistes en Uruguay, nous devrions organiser et soutenir des escadrons de la mort de droite pour les faire taire."
 USA_60s_Project_MKUltra: "Projet MKUltra"
 USA_60s_Project_MKUltra_desc: "L'Opération MK-Ultra est une série d'expériences proposées sur des sujets humains pour tester l'efficacité de divers médicaments conçus pour le contrôle mental. Bien que légèrement inhumains, les résultats nous aideront énormément dans notre lutte contre la menace rouge."
 USA_60s_Operation_Mockingbird: "Opération Mockingbird"
 USA_60s_Operation_Mockingbird_desc: "Nous avons besoin que la population mondiale, ou du moins la nôtre, croie avec ferveur au bien-fondé de notre cause. Pour y parvenir, nous devons commencer à diffuser des histoires et de la propagande dans toutes les formes de médias à travers le monde."
 USA_60s_Operation_MIDNIGHT_CLIMAX: "Opération MIDNIGHT CLIMAX"
 USA_60s_Operation_MIDNIGHT_CLIMAX_desc: "Une extension de MK-Ultra, Midnight Climax impliquera des prostituées employées par la CIA attirant leurs clients vers les refuges de la CIA. Une fois sur place, nous injecterons du LSD aux clients pour enregistrer les effets que cela a sur eux. Ne vous inquiétez pas de l'éthique de tout cela, c'est pour le bien commun. Qu'est-ce que tu es, un communiste ?"
 USA_60s_Project_MKNAOMI: "Projet MKNAOMI"
 USA_60s_Project_MKNAOMI_desc: "MK-NAOMI est une autre émanation de MK-Ultra. Plutôt que de se concentrer sur les drogues destinées au contrôle mental, NAOMI vise les composés biologiques et chimiques conçus pour tuer ou neutraliser instantanément, ainsi que les dispositifs permettant de les propager."
 USA_60s_Project_MKSEARCH: "Projet MKSEARCH"
 USA_60s_Project_MKSEARCH_desc: "Le projet MKSEARCH est une branche d'Ultra se concentrant spécifiquement sur un sérum de vérité. Malheureusement (enfin, pas pour nous), cela nécessitera des sujets de test consommables pour l'expérimentation. Les choses que nous faisons pour la liberté..."
 USA_60s_Project_MKOFTEN: "Projet MKOFTEN"
 USA_60s_Project_MKOFTEN_desc: "MKOFTEN est un autre projet de recherche sur les drogues, visant cette fois à examiner les effets comportementaux et toxicologiques des drogues sur les hommes et les animaux. De plus, le maître-espion Dr Sydney Gottlieb souhaite utiliser SOUVENT comme couverture pour étudier la magie noire et l'occulte. Effrayant et bizarre, mais bon, si ça bat les rouges, peu importe ?"
 USA_60s_Expand_HTLINGUAL: "Développer HTLINGUAL"
 USA_60s_Expand_HTLINGUAL_desc: "HTLINGUAL est une opération visant à intercepter le courrier américain à destination de l'URSS et de la RPC. Espérons que cela nous permettra d'éradiquer le communisme aux États-Unis."
 USA_60s_Operation_MCHAOS: "Opération MCHAOS"
 USA_60s_Operation_MCHAOS_desc: "L'Opération MCHAOS est un projet d'espionnage national visant à découvrir l'influence étrangère dans les récents mouvements de protestation raciale et anti-guerre. Nous savons que l'URSS est à l'origine de ces émeutes, et si nous attrapons ses agents, les mouvements mourront."
 USA_60s_Operation_MERRIMAC: "Opération MERRIMAC"
 USA_60s_Operation_MERRIMAC_desc: "De nombreux groupes anti-guerre basés à Washington ont vu le jour ces derniers mois. MERRIMAC rassemblera des informations sur ceux considérés comme constituant une menace pour les institutions et la stabilité nationales."
 USA_60s_Operation_RESISTANCE: "Opération RÉSISTANCE"
 USA_60s_Operation_RESISTANCE_desc: "RESISTANCE est un projet frère de MERRIMAC axé sur les organisations des campus universitaires, en particulier les groupes d'étudiants radicaux. Qui se sont prononcés contre notre politique au Vietnam. Cela nous aidera à garder un oeil sur les personnes susceptibles de rejoindre le mouvement communiste."
 USA_60s_Undermine_the_Anti_War_Movement: "Saper le mouvement anti-guerre"
 USA_60s_Undermine_the_Anti_War_Movement_desc: "Le mouvement anti-guerre a été une épine dans notre pied, réduisant notre capacité à combattre au Vietnam, diminuant notre approbation et notre stabilité intérieures et nuisant à notre prestige mondial. Nous devons le saper avant que la situation ne s'aggrave."
 USA_60s_African_and_European_Desks: "Bureaux Africains et Européens"
 USA_60s_African_and_European_Desks_desc: "Même s'ils ne sont pas aussi instables que l'Amérique du Sud et l'Amérique centrale, les théâtres européen et africain sont tout aussi importants, sinon plus, dans notre bataille pour la suprématie mondiale contre les Soviétiques, et ne peuvent être ignorés."
 USA_60s_Support_the_Greek_Junta: "Soutenez la junte grecque"
 USA_60s_Support_the_Greek_Junta_desc: "Depuis la guerre civile grecque de 1949, la junte militaire à la tête du pays a eu du mal à maintenir le cap. Nous devons leur envoyer de l'aide avant que la Grèce ne retombe dans la guerre."
 USA_60s_Provide_Intel_to_Greek_Junta: "Fournir des renseignements à la junte grecque"
 USA_60s_Provide_Intel_to_Greek_Junta_desc: "En fournissant aux Grecs des renseignements sur les groupes communistes, leurs partisans et sympathisants au sein de leur nation, nous pouvons stabiliser davantage leur pays."
 USA_60s_Covert_Rhodesian_Aid: "Aide rhodésienne secrète"
 USA_60s_Covert_Rhodesian_Aid_desc: "Tout en nous opposant officiellement fermement aux Rhodésiens et à leur politique raciste, nous leur enverrons une aide militaire et économique secrète. Après tout, ce ne sont pas des rouges, alors à quel point cela peut-il vraiment être grave ?"
 USA_60s_Covert_South_African_Aid: "Aide secrète sud-africaine"
 USA_60s_Covert_South_African_Aid_desc: "Du point de vue des droits civiques, le gouvernement de l'apartheid en Afrique du Sud est épouvantable. Mais bon, nous avons tous nos défauts, non ? De toute façon, nous avons notre propre problème de droits civiques et, en plus, ils sont meilleurs que les communistes."
 USA_60s_Aid_the_FNLA: "Aidez le FNLA"
 USA_60s_Aid_the_FNLA_desc: "Le FNLA, ou Front national de libération de l'Angola, lutte pour obtenir son indépendance dans la guerre angolaise-portugaise. En les aidant maintenant, nous pouvons gagner leur gratitude et les amener dans notre sphère d'influence."
 USA_60s_Aid_Mobutu: "Aide Mobutu"
 USA_60s_Aid_Mobutu_desc: "Mobutu Sese Seko, président de la République démocratique du Congo, a cruellement besoin de notre aide militaire, et nous lui donnerons ce dont il a besoin pour assurer la survie de son régime"
 USA_60s_Asian_Desk: "Bureau asiatique"
 USA_60s_Asian_Desk_desc: "L'Asie est le théâtre de nos plus grandes interventions dans les conflits de la guerre froide, d'abord en Corée, et maintenant au Vietnam. Nous devons poursuivre nos efforts pour garantir qu'une plus grande partie de l'Extrême-Orient et du reste du continent ne tombe pas davantage sous la botte rouge. "
 USA_60s_The_Secret_War: "La guerre secrète"
 USA_60s_The_Secret_War_desc: "Même si tout le monde connaît la guerre du Vietnam, il existe un autre conflit tout aussi violent qui se déroule juste à côté, au Laos. Des efforts aériens majeurs ont été déployés, fournissant à la fois un soutien au sol et du ravitaillement, ainsi que de nombreuses opérations des forces spéciales, pour aider les combattants anticommunistes dans la région."
 USA_60s_Operation_PINCUSHION: "Opération PINCUSHION"
 USA_60s_Operation_PINCUSHION_desc: "L'Opération PINCUSHION est un effort secret visant à recruter des tribus montagnardes laotiennes et à les former en forces de combat régulières capables de se défendre contre la menace communiste sur la piste Ho Chi Minh."
 USA_60s_Operation_MOMENTUM: "Opération MOMENTUM"
 USA_60s_Operation_MOMENTUM_desc: "Programme de formation à la guérilla laotienne, MOMENTUM opérera dans le nord-est du pays et sera réalisé par l'unité de renfort aérien de la police thaïlandaise. Le côté américain de la planification sera réalisé par James William Lair, un agent déjà présent en territoire laotien."
 USA_60s_Arm_the_Royalists: "Armez les royalistes"
 USA_60s_Arm_the_Royalists_desc: "Les royalistes ont désespérément besoin de notre aide militaire, tant sous forme de conseillers que de fournitures. Comme nous ne pouvons pas nous permettre une autre nation communiste en Asie du Sud-Est, ils recevront ce qu'ils veulent."
 USA_60s_Air_America_Drug_Smuggling: "Trafic de drogue à Air America"
 USA_60s_Air_America_Drug_Smuggling_desc: "Pour aider l'économie laotienne en difficulté, nous utiliserons les avions de ligne d'Air America pour introduire clandestinement de la drogue dans le pays."
 USA_60s_Aid_Royalist_Drug_Smuggling: "Aidez le trafic de drogue royaliste"
 USA_60s_Aid_Royalist_Drug_Smuggling_desc: "En plus du commerce de drogue d'Air America, nous soutiendrons également le trafic de drogue local au Laos afin de soutenir son économie."
 USA_60s_Launch_Indonesian_Coup: "Lancez un coup d'État indonésien"
 USA_60s_Launch_Indonesian_Coup_desc: "Malheureusement, il y a quelques années, les Indes néerlandaises sont tombées aux mains de Sukarno et de ses partisans communistes. Nous avons dû attendre notre heure, mais nos agents nous disent que le moment est venu de frapper et de renverser le régime."
 USA_60s_Provide_Hit_List_to_Indonesia: "Fournir une liste de résultats à l'Indonésie"
 USA_60s_Provide_Hit_List_to_Indonesia_desc: "Même si le pays n'est plus communiste de nom, l'Indonésie compte encore de nombreux partisans de l'ancien gouvernement. En fournissant aux militaires des listes de cibles, nous pouvons changer cela rapidement."
 USA_60s_Aid_SAVAK: "Aide SAVAK"
 USA_60s_Aid_SAVAK_desc: "La SAVAK, la nouvelle agence de renseignement du Shah, a du mal à retrouver et à arrêter ceux qui cherchent à renverser le gouvernement. Nous devrions l'aider afin que nos intérêts au Moyen-Orient soient préservés."
 USA_60s_Support_Lon_Nol: "Soutenez Lon Nol"
 USA_60s_Support_Lon_Nol_desc: "Lon Nol, le général cambodgien de droite, lutte pour tenir les Khmers rouges à distance et a besoin de notre aide immédiatement. Nous devons agir vite avant qu'il ne soit dépassé."
 USA_60s_Arm_the_Republic_of_Cambodia: "Armer la République du Cambodge"
 USA_60s_Arm_the_Republic_of_Cambodia_desc: "Maintenant que nous avons endigué l'hémorragie au Cambodge, un réarmement général de leurs forces est nécessaire."
 USA_60s_Covert_Aid_to_Thailand: "Aide secrète à la Thaïlande"
 USA_60s_Covert_Aid_to_Thailand_desc: "La Thaïlande a besoin de notre soutien pour soutenir son économie et son armée, et même si nous ne pouvons pas être vus en train de les aider, nous leur fournirons des armes et des fonds secrets."
 USA_60s_Vietnam_Desk: "Bureau Vietnam"
 USA_60s_Vietnam_Desk_desc: "Viêt Nam. Que faut-il vraiment en dire de plus ? C'est le désordre dévorant dans lequel nous nous sommes plongés il y a tant d'années. Nous devons nous attacher, écraser le Vietcong et Hô Chi Minh et faire nos valises avant que les choses ne commencent vraiment à empirer."
 USA_60s_Assasinate_Diem: "Assassiner Diem"
 USA_60s_Assasinate_Diem_desc: "Ngo Dinh Diem a malheureusement échoué dans sa tâche visant à maintenir la stabilité du Sud-Vietnam et à le protéger des forces communistes. L'ARVN a hâte d'avoir une chance de renverser son régime, et nous n'interférerons pas. Au revoir, Diem."
 USA_60s_Preserve_the_Diem_Regime: "Préserver le régime Diem"
 USA_60s_Preserve_the_Diem_Regime_desc: "Malgré toutes ses lacunes, Diem a fait tout ce qu'il pouvait pour préserver l'État du Vietnam au cours de ces années violentes et turbulentes. Nous devrions le garder, car à ce stade, qui d'autre est plus compétent et plus expérimenté que lui dans ce poste ?"
 USA_60s_Civilian_Irregular_Defense_Group_Program: "Programme de groupe de défense civile irrégulière"
 USA_60s_Civilian_Irregular_Defense_Group_Program_desc: "Le CIDG est un programme conçu pour recruter et déployer des unités irrégulières composées de populations minoritaires au Sud-Vietnam. Cela augmentera la capacité d'attaque de l'ARVN et maintiendra ces minorités hors des mains du Vietcong."
 USA_60s_Operation_VULCAN: "Opération VULCAN"
 USA_60s_Operation_VULCAN_desc: "Les Nord-Vietnamiens développent une marine, et même si elle ne peut pas atteindre la force de la nôtre, elle sera une nuisance si elle n'est pas maîtrisée. Nous avons une équipe de plongeurs porteurs de bombes qui attendent le signal pour lancer leur mission de sabotage. "
 USA_60s_Bribe_the_An_Quang_Buddhists: "Soudoyer les bouddhistes d'An Quang"
 USA_60s_Bribe_the_An_Quang_Buddhists_desc: "Les bouddhistes d'An Quang sont un groupe religieux disposé à coopérer avec les Sud-Vietnamiens et l'ARVN, moyennant un certain prix. Cependant, l'ARVN a besoin d'hommes et d'expérience, donc le pot-de-vin sera envoyé. "
 USA_60s_Launch_the_PHOENIX_Program: "Lancez le programme PHOENIX"
 USA_60s_Launch_the_PHOENIX_Program_desc: "Le programme PHOENIX vise à détruire le Vietcong et ses partisans par l'infiltration, la lutte contre le terrorisme, la torture et les interrogatoires. Cela impliquera des unités de reconnaissance spécialisées tuant ou capturant des Vietcongs présumés et les ramenant dans des centres de détention. "
 USA_60s_Operation_SHOCK: "Opération CHOC"
 USA_60s_Operation_SHOCK_desc: "En réponse à l'offensive du Têt, un groupe d'analystes de la CIA dirigé par George Carver a conçu l'opération SHOCK, conçue pour purger l'ARVN des officiers corrompus et, en cas d'échec, pour arrêter temporairement les bombardements et négocier les conditions de reddition avec le Nord, ou pour créer un gouvernement de coalition avec le FNL."
 USA_60s_Operation_Wandering_Soul: "Opération âme errante"
 USA_60s_Operation_Wandering_Soul_desc: "L'Opération Wandering Soul s'inspire d'une croyance vietnamienne dans un concept du même nom, selon lequel une âme mal enterrée se promènerait dans la campagne en gémissant sans but. Pour tenter d'effrayer les Vietcongs, nous avons placé des haut-parleurs sur notre territoire qui diffusent des sons et des voix étranges pour simuler des « âmes errantes »."
 USA_60s_Expand_the_PHOENIX_Program: "Élargissez le programme PHOENIX"
 USA_60s_Expand_the_PHOENIX_Program_desc: "Malgré tous nos efforts, le programme PHOENIX n'est pas assez vaste et des milliers de partisans et de combattants communistes sont toujours en liberté. Nous devons redoubler d'efforts pour les arrêter."
 USA_60s_End_the_PHOENIX_Program: "Mettre fin au programme PHOENIX"
 USA_60s_End_the_PHOENIX_Program_desc: "Malgré un succès limité, le programme PHOENIX est inhumain et, le plus souvent, entraînera la mort d'un civil innocent plutôt que d'un soldat vietcong. Cela doit cesser maintenant."
 USA_60s_Bomb_the_Pathet_Lao: "Bombardez le Pathet Lao"
 USA_60s_Bomb_the_Pathet_Lao_desc: "Enfin, après avoir réarmé les royalistes et formé des unités spéciales, nous mènerons l'un des plus grands bombardements jamais planifiés au monde et détruirons les Khmers rouges depuis le ciel. Ils n'auront aucune chance face à toute la puissance d'une superpuissance moderne. "
 USA_60s_Continue_Funding_the_LDP: "Continuer à financer le LDP"
 USA_60s_Continue_Funding_the_LDP_desc: "Le PLD est l'un des seuls régimes non communistes (ou non impliqués dans une sorte de conflit) en Asie du Sud-Est et mérite notre soutien continu, malgré certaines politiques antidémocratiques antérieures."
 USA_60s_State_Department: "Le Département d'État"
 USA_60s_State_Department_desc: "Le Département d'État est le bras du gouvernement et du pays que le monde voit, entend et auquel il réagit. Elle jouera un rôle énorme dans les décennies à venir alors que nous tenterons de rester au sommet de l'ordre mondial."
 USA_60s_Rethinking_our_Foriegn_Policies: "Repenser nos politiques étrangères"
 USA_60s_Rethinking_our_Foriegn_Policies_desc: "À ce stade avancé de la décennie, nous bénéficions désormais du recul et de l'opportunité de changer notre approche de la politique étrangère, à savoir si le concept de confinement sera maintenu ou remplacé."
 USA_60s_The_Middle_East: "Le Moyen-Orient"
 USA_60s_The_Middle_East_desc: "La situation au Moyen-Orient a radicalement changé depuis les années 1950. Nous avons assisté à la montée d'un nouveau nationalisme panarabe, dirigé par Gamel Abdel Nasser, ainsi qu'à sa tentative réussie d'annexer le canal de Suez. Nos alliés plus démocratiques, comme Israël et l'Iran, ont désespérément besoin de soutien et d'aide, et nous les leur fournirons."
 USA_60s_Aid_the_Pahalvi_Regime: "Aidez le régime Pahlavi"
 USA_60s_Aid_the_Pahalvi_Regime_desc: "Le Shah a déjà survécu à de nombreuses tentatives de coup d'État et d'assassinat, mais l'opposition interne et l'instabilité grandissent. Nous devons l'aider si nous voulons que son régime perdure."
 USA_60s_Subsidize_the_Iranian_Armed_Forces: "Subventionner les forces armées iraniennes"
 USA_60s_Subsidize_the_Iranian_Armed_Forces_desc: "Les forces armées iraniennes, même si elles ont constamment mis à jour leurs équipements et leurs stratégies pour les adapter aux normes modernes, sont toujours à la traîne. Nous devons changer cela."
 USA_60s_Outreach_to_Israel: "Sensibilisation en Israël"
 USA_60s_Outreach_to_Israel_desc: "Israël est déjà l'un de nos alliés les plus fidèles au Moyen-Orient et conservera cette position pendant de nombreuses années. Nous devons accroître notre coopération et nos liens les uns avec les autres."
 USA_60s_Arm_Israel: "Armer Israël"
 USA_60s_Arm_Israel_desc: "Entouré de voisins hostiles qui éclipsent tous sa population, Israël et Tsahal ont besoin de toute l'avance technologique possible, et nous pouvons leur fournir cela."
 USA_60s_Reject_Containment: "Rejeter le confinement"
 USA_60s_Reject_Containment_desc: "L'endiguement est la politique étrangère suivie par notre gouvernement depuis 1947, et ses exigences de faire face à l'influence soviétique partout en même temps sont fausses et dépassées. Il est temps de nous retirer de nos divers enchevêtrements en Asie et en Afrique."
 USA_60s_Vietnamization: "Vietnamisation"
 USA_60s_Vietnamization_desc: "La politique de vietnamisation appelle au retrait des forces américaines au Vietnam et à leur remplacement par davantage de forces ARVN, dans le but de rendre la guerre du Vietnam plus vietnamienne. La question de savoir si c'est une bonne idée sur le plan militaire est cependant une autre question."
 USA_60s_Withdraw_From_Vietnam: "Se retirer du Vietnam"
 USA_60s_Withdraw_From_Vietnam_desc: "Le processus de vietnamisation est terminé et il est temps de retirer complètement nos soldats et nos conseillers du Vietnam. Bonne chance au Sud-Vietnam !"
 USA_60s_Saudi_Aid: "Aide saoudienne"
 USA_60s_Saudi_Aid_desc: "Les Saoudiens, même s'ils ne sont pas aussi démocratiques que nous l'espérions, sont l'un de nos rares alliés au Moyen-Orient et ont besoin de notre soutien."
 USA_60s_Aid_Oman: "Aide Oman"
 USA_60s_Aid_Oman_desc: "Oman est un ami petit mais important, situé à l'embouchure de la mer Rouge et à proximité du golfe Persique. Nous devons nous assurer qu'ils restent nos alliés."
 USA_60s_Launch_Airstrikes_in_Cambodia_and_Laos: "Lancement de frappes aériennes au Cambodge et au Laos"
 USA_60s_Launch_Airstrikes_in_Cambodia_and_Laos_desc: "Même si nous retirons nos forces terrestres, nous avons toujours un intérêt direct dans les conflits en Asie du Sud-Est. Fournir des frappes aériennes et un soutien au Cambodge et au Laos protégera ces intérêts."
 USA_60s_Increase_American_Influence_in_the_Persian_Gulf: "Augmenter l'influence américaine dans le golfe Persique"
 USA_60s_Increase_American_Influence_in_the_Persian_Gulf_desc: "Le golfe Persique est une région vitale du Moyen-Orient en raison de la quantité de pétrole qui y coule chaque jour. Nous devons être en bons termes avec les pays qui l'entourent si nous voulons maintenir ce flux."
 USA_60s_Allow_The_PRC_In_the_UN: "Autoriser la RPC à l'ONU"
 USA_60s_Allow_The_PRC_In_the_UN_desc: "Malgré nos différences idéologiques évidentes et considérables, la Chine est une puissance mondiale trop importante pour être reléguée à l'écart des discussions mondiales importantes, et il est temps de l'accepter au sein de l'ONU."
 USA_60s_Arm_Lon_Nol: "Bras Lon Nol"
 USA_60s_Arm_Lon_Nol_desc: "Lon Nol, président du Cambodge, a besoin de davantage de notre aide et de nos équipements militaires pour poursuivre la lutte contre les Khmers rouges. et nous le lui fournirons."
 USA_60s_Increase_Arms_Sales_to_Saudi_Arabia_and_Iran: "Augmenter les ventes d'armes à l'Arabie Saoudite et à l'Iran"
 USA_60s_Increase_Arms_Sales_to_Saudi_Arabia_and_Iran_desc: "L'Arabie Saoudite et l'Iran ont davantage besoin d'armes et de conseillers. Étant donné que nous avons besoin d'alliés plus forts partout dans le monde, ils les recevront."
 USA_60s_The_Korean_DMZ_Crisis: "La crise coréenne de la DMZ"
 USA_60s_The_Korean_DMZ_Crisis_desc: "Depuis 1964, les Nord-Coréens ont infiltré et saboté la République de Corée à travers la zone démilitarisée et, plus récemment, lors du désormais tristement célèbre raid de la Maison Bleue, ils ont tenté d'assassiner Park Chung Hee. Il faut faire quelque chose à ce sujet !"
 USA_60s_Fortify_the_Border: "Fortifier la frontière"
 USA_60s_Fortify_the_Border_desc: "Même si nous n'aimerions rien de plus que détruire la RPDC, c'est trop risqué dans la situation mondiale actuelle. Mieux vaut fortifier le côté sud de la DMZ que de risquer une nouvelle guerre de Corée."
 USA_60s_Increase_Aid_to_the_Republic_of_Korea: "Augmenter l'aide à la République de Corée"
 USA_60s_Increase_Aid_to_the_Republic_of_Korea_desc: "Les événements récents ont clairement démontré le besoin d'aide militaire et économique de la République de Corée. Ils doivent être capables de se défendre contre leur voisin hostile."
 USA_60s_Approve_Retaliatory_Strikes: "Approuver les frappes de représailles"
 USA_60s_Approve_Retaliatory_Strikes_desc: "L'insolence de la Corée du Nord dure depuis assez longtemps et il est temps pour nous de réagir de la même manière. L'envoi de frappes de représailles en RPDC enverra le bon message. Donnez à ces communistes un avant-goût de leur propre médecine !"
 USA_60s_the_Second_Korean_War: "la Seconde Guerre de Corée"
 USA_60s_the_Second_Korean_War_desc: "Il est temps de mettre fin une fois pour toutes à ce problème de deux États et de corriger les erreurs que nous avons commises ici il y a près de deux décennies. La Corée du Nord doit mourir et une véritable Corée prendra sa place. En avant les soldats, pour la démocratie !"
 USA_60s_The_Tar_Baby_Option: "L'option Tar Bébé"
 USA_60s_The_Tar_Baby_Option_desc: "La politique de Tar Baby implique des contacts plus étroits avec les gouvernements de la minorité blanche d'Afrique australe, ainsi qu'une diminution des mesures économiques à leur encontre, dans le but de comprendre que l'apartheid, bien que répugnant, est là pour rester, tout comme ces régimes."
 USA_60s_Limited_Approach: "Approche limitée"
 USA_60s_Limited_Approach_desc: "Même si nous devons rouvrir les voies diplomatiques avec ces pays et entamer une amitié, nous n'avons pas besoin de nous lancer à fond dans ces relations. Une approche limitée est préférable."
 USA_60s_Circumvent_Rhodesian_Embargo: "Contourner l'embargo rhodésien"
 USA_60s_Circumvent_Rhodesian_Embargo_desc: "De nombreux citoyens rhodésiens innocents souffrent des embargos imposés au niveau international sur ses importations et ses exportations. En contournant l'embargo, nous pouvons aider ces innocents."
 USA_60s_Limited_Escalation: "Escalade limitée"
 USA_60s_Limited_Escalation_desc: "Même si nous ne plongerons pas tête première dans une autre guerre suite aux raids de représailles, nous permettrai aux Sud-Coréens d'intensifier leurs patrouilles et leurs opérations de reconnaissance dans une sorte d'escalade limitée."
 USA_60s_Allow_American_Volunteers: "Autoriser les volontaires américains"
 USA_60s_Allow_American_Volunteers_desc: "Malgré notre soutien en coulisse aux gouvernements de l'apartheid, nous voulons toujours, en fin de compte, qu'ils disparaissent ainsi que leurs idées racistes. Permettre aux volontaires de se rendre au Zimbabwe et dans d'autres régions y contribuera."
 USA_60s_Extensive_Approach: "Approche étendue"
 USA_60s_Extensive_Approach_desc: "La Rhodésie et l'Afrique du Sud sont des régimes pleinement légitimes et méritent d'être reconnus comme tels. Nous les soutiendrons de toutes les manières possibles."
 USA_60s_Deploy_Advisors_to_the_Alcora_Exercise: "Déployer des conseillers pour l'exercice Alcora"
 USA_60s_Deploy_Advisors_to_the_Alcora_Exercise_desc: "L'exercice Alcora est l'alliance conjointe entre le Portugal, la Rhodésie et l'Afrique du Sud, les trois gouvernements qui luttent pour maintenir ensemble leurs régimes de minorité blanche. Nous devrions envoyer des conseillers pour les aider."
 USA_60s_Capitalize_on_the_Soviet_Sino_Split: "Capitaliser sur la scission sino-soviétique"
 USA_60s_Capitalize_on_the_Soviet_Sino_Split_desc: "Les Chinois et les Soviétiques se sont finalement divisés sur leurs principales différences idéologiques et leurs objectifs contradictoires. Voici notre chance de nous associer à l'un pour obtenir un avantage sur l'autre, que ce soit politiquement ou militairement."
 USA_60s_Outreach_to_Moscow: "Sensibilisation à Moscou"
 USA_60s_Outreach_to_Moscow_desc: "Nous et nos anciens alliés avons parcouru un long chemin depuis les jours de gloire du début des années 40, mais avec une nouvelle menace à l'horizon, il est peut-être temps de rassembler le groupe. Nous et les Soviétiques ? Qui l'aurait cru !"
 USA_60s_Condemn_Chinese_Agression: "Condamner l'agression chinoise"
 USA_60s_Condemn_Chinese_Agression_desc: "Les Chinois ont été beaucoup trop expansionnistes et agressifs, attaquant des pays impuissants comme le Tibet et ignorant les traités en aggravant Taiwan. Nous devons nous opposer à eux."
 USA_60s_Negotiate_over_Vietnam: "Négocier sur le Vietnam"
 USA_60s_Negotiate_over_Vietnam_desc: "Diverses propositions ont été faites à l'ONU par le délégué polonais, entre autres, pour s'asseoir avec les Vietnamiens et négocier la fin de la guerre."
 USA_60s_Joint_American_Soviet_War_Against_PRC: "Guerre conjointe américaine-soviétique contre la RPC"
 USA_60s_Joint_American_Soviet_War_Against_PRC_desc: "Nos chefs d'état-major et nos agences de renseignement se sont rencontrés et les plans sont en place. En mettant nos divergences de côté pour l'instant, le meilleur moyen d'assurer une paix mondiale durable est le retrait de la RPC le plus rapidement possible. En combattant à nouveau aux côtés des Soviétiques, nous sommes prêts à replonger le monde dans le chaos pour le bien commun."
 USA_60s_Recognize_Rhodesia: "Reconnaître la Rhodésie"
 USA_60s_Recognize_Rhodesia_desc: "La Rhodésie est un gouvernement 100% légitime, et aucun Africain noir ne se plaint de cela. Aux vainqueurs revient le butin, disons-nous, et les Rhodésiens ont été et seront à nouveau vainqueurs."
 USA_60s_Continue_Containment_Doctrines: "Continuer les doctrines de confinement"
 USA_60s_Continue_Containment_Doctrines_desc: "Bien qu'il n'ait pas un taux de réussite de 100 %, le confinement nous a bien servi dans notre lutte contre le communisme mondial, et il n'aurait aucun sens de s'en débarrasser maintenant."
 USA_60s_Double_Down_in_Vietnam: "Doublez la mise au Vietnam"
 USA_60s_Double_Down_in_Vietnam_desc: "Nous résistons depuis si longtemps au Vietnam et ce n'est pas le moment d'abandonner nos alliés. Nous devons envoyer plus d'armes, plus de troupes et plus d'aide aux Sud-Vietnamiens."
 USA_60s_Increase_Aid_to_Taipei: "Augmenter l'aide à Taipei"
 USA_60s_Increase_Aid_to_Taipei_desc: "En plus de rester au Vietnam, nous devons également aider nos autres amis du Sud-Est à survivre. Taipei a besoin de plus d'aide pour résister à la RPC. "
 USA_60s_Outreach_to_Beijing: "Sensibilisation à Pékin"
 USA_60s_Outreach_to_Beijing_desc: "Tendre la main à la RPC au milieu de la scission sino-soviétique semble être une sage idée, car nos ponts avec les Soviétiques sont déjà brûlés depuis longtemps. Que va-t-il advenir de cet effort diplomatique ?"
 USA_60s_State_Visit_to_China: "Visite d'État en Chine"
 USA_60s_State_Visit_to_China_desc: "Nos ouvertures à Pékin ont été bien accueillies et notre président entamera la première visite officielle des États-Unis en RPC. Bon vol, Monsieur le Président !"
 USA_60s_Pressure_Hanoi: "Pression Hanoï"
 USA_60s_Pressure_Hanoi_desc: "Hô Chi Minh et son cabinet de Hanoï refusent d'écouter qui que ce soit, même leurs camarades communistes de RPC. Il est temps d'augmenter la pression sur eux et de les forcer à s'asseoir à la table des négociations."
 USA_60s_The_Shaghai_Communique: "Le communiqué de Shanghai"
 USA_60s_The_Shaghai_Communique_desc: "Le communiqué de Shanghai sera une communication conjointe entre nous et Pékin affirmant notre désir commun de travailler ensemble pour apporter la paix en Asie de l'Est et dans le Pacifique du Sud-Est. Un toast à nos nouveaux amis communistes !"
 USA_60s_Intervene_in_Cambodia: "Intervenir au Cambodge"
 USA_60s_Intervene_in_Cambodia_desc: "Il est temps pour nous de nous impliquer plus directement dans la guerre au Cambodge, en envoyant davantage d'armes et d'hommes aux royalistes, ainsi qu'en renforçant nos relations diplomatiques."
 USA_60s_Increase_Arms_to_the_Hmong: "Augmenter les armes aux Hmong"
 USA_60s_Increase_Arms_to_the_Hmong_desc: "Le peuple Hmong, une minorité au Vietnam, combat à nos côtés depuis le début du conflit et a besoin de notre soutien. Nous leur donnerons des armes et d'autres équipements pour les aider."
 USA_60s_Veto_PRC_Accension_into_the_UN: "Veto à l'ascension de la RPC à l'ONU"
 USA_60s_Veto_PRC_Accension_into_the_UN_desc: "La RPC est un pays agressif, belliciste et expansionniste, à peine sorti d'une guerre civile sanglante. Elle n'a pas sa place dans l'organisation la plus élevée et la plus prestigieuse du monde."
 USA_60s_Expand_Aid_to_South_Korea: "Augmenter l'aide à la Corée du Sud"
 USA_60s_Expand_Aid_to_South_Korea_desc: "Même si elle a obtenu sa liberté grâce au cessez-le-feu de 1953, la République de Corée doit encore se défendre contre les instigateurs communistes nord-coréens et chinois. Pour y parvenir, il lui faut une économie et des forces armées plus fortes."
 USA_60s_Encourage_Further_Thai_Intervention_in_South_East_Asia: "Encourager une nouvelle intervention thaïlandaise en Asie du Sud-Est"
 USA_60s_Encourage_Further_Thai_Intervention_in_South_East_Asia_desc: "Les Thaïlandais ont été un allié étonnamment ferme en Asie du Sud-Est et ont apporté leur soutien aux Sud-Vietnamiens et aux royalistes. Il est temps pour eux de s'impliquer davantage."
 #Prague spring loc, focuses not implemented yet!
 #USA_60s_The_Prague_Spring: "The Prague Spring"
 #USA_60s_The_Prague_Spring_desc:
 #USA_60s_Condemn_Soviet_Imperialism: "Condemn Soviet Imperialism"
 #USA_60s_Threaten_Soviet_Aggressors: "Threaten Soviet Aggressors"
 #USA_60s_Soviets_cze_Back_Down: "Soviets Back Down"
 #USA_60s_Place_Czechoslovakia_Under_the_Nuclear_Umbrella: "Place Czechoslovakia Under the Nuclear Umbrella"
 #USA_60s_USA_cze_Backs_Down: "USA Backs Down"
 USA_60s_The_Gulf_of_Tonkin_Incident: "L'incident du golfe du Tonkin"
 USA_60s_The_Gulf_of_Tonkin_Incident_desc: "Les Nord-Vietnamiens ont attaqué deux de nos destroyers en patrouille dans le golfe du Tonkin ! Cet acte de violence sans précédent et injustifié ne passera pas inaperçu. Ce. Moyens. Guerre."
 USA_60s_Begin_The_Vietnam_War: "Commencer la guerre du Vietnam"
 USA_60s_Begin_The_Vietnam_War_desc: "Le temps de la guerre est de nouveau venu. Rien n'est interdit et aucune pitié ne sera accordée aux traîtres d'Hô Chi Minh et à ses chiens communistes. Nous les écraserons comme les fourmis chétives qu'elles sont réellement."
 USA_60s_Restrict_Involvement: "Restreindre la participation"
 USA_60s_Restrict_Involvement_desc: "Bien qu'il ait pu paraître grandiose de se précipiter dans la dense jungle vietnamienne dans le feu de l'incident du golfe du Tonkin, les esprits plus calmes ont prévalu et ont décidé que la situation était trop compliquée pour se lancer. Nous mènerons des opérations limitées, pour l'instant."
 USA_60s_Crush_the_Khmer_Rouge: "Écraser les Khmers rouges"
 USA_60s_Crush_the_Khmer_Rouge_desc: "La guerre civile cambodgienne a assez duré. Il est temps pour nous d'intervenir et de mettre fin une fois pour toutes à la révolte des Khmers rouges."
 USA_60s_Tacit_Support_of_South_Africa: "Soutien tacite à l'Afrique du Sud"
 USA_60s_Tacit_Support_of_South_Africa_desc: "Même si nous ne pouvons pas donner publiquement notre soutien au gouvernement sud-africain, nous devrions lui faire savoir qu'il a notre soutien, tant en paroles qu'en actes."
 USA_60s_Aid_Portugal_Colonial_Conflicts: "Aide aux conflits coloniaux au Portugal"
 USA_60s_Aid_Portugal_Colonial_Conflicts_desc: "Les Portugais sont impliqués dans des guerres coloniales partout dans le monde et ont cruellement besoin de tout soutien possible. Nous fournirons cette aide."
 USA_60s_Reduce_Global_Tensions: "Réduire les tensions mondiales"
 USA_60s_Reduce_Global_Tensions_desc: "Au cours des dernières années, voire décennies, les tensions mondiales ont atteint un niveau extrêmement élevé. En tant que première puissance mondiale, il nous appartient de les réduire."
 USA_60s_The_American_Armed_Forces: "Les forces armées américaines"
 USA_60s_The_American_Armed_Forces_desc: "Malgré toutes nos opérations secrètes et nos efforts diplomatiques, la seule chose qui nous maintient véritablement en vie et prospères est notre armée. Il faut le soutenir et le maintenir pour que cette situation perdure."
 USA_60s_US_Missle_Command: "Commandement américain des missiles"
 USA_60s_US_Missle_Command_desc: "Bien qu'il s'agisse d'un département plus récent, le Commandement des missiles est une partie essentielle de notre mission militaire et est la seule chose qui empêche les Soviétiques de réduire notre population en atomes. Nous devons poursuivre nos recherches sur les missiles."
 USA_60s_Polaris_SLBM_Deployment: "Déploiement du Polaris SLBM"
 USA_60s_Polaris_SLBM_Deployment_desc: "Le Polaris SLBM est notre conception la plus réussie à ce jour et doit être déployé sur nos flottes de sous-marins dès que possible. Cela donnera aux Soviétiques une raison supplémentaire de réfléchir à deux fois avant de déclencher leur prochaine guerre."
 USA_60s_Missle_Silo_Expansion: "Expansion du silo de missiles"
 USA_60s_Missle_Silo_Expansion_desc: "A quoi servent les missiles si on n'a pas d'endroit où les garder ? En élargissant nos silos, nous pouvons également augmenter notre force de missiles."
 USA_60s_Attempt_to_Close_the_Missle_Gap: "Tentative de combler l'écart en matière de missiles"
 USA_60s_Attempt_to_Close_the_Missle_Gap_desc: "Malgré tous nos efforts, les Soviétiques semblent avoir une longueur d'avance en termes de R&D sur les missiles. Cela doit changer, même si peu, si nous voulons survivre."
 USA_60s_Expand_Warhead_Production: "Augmenter la production d'ogives"
 USA_60s_Expand_Warhead_Production_desc: "Les ogives nucléaires sont presque aussi importantes que les missiles qui les transportent et sont vitales pour nos intérêts. Nous devons intensifier leur production."
 USA_60s_The_American_Army: "L'armée américaine"
 USA_60s_The_American_Army_desc: "Notre armée, bien qu'elle ne soit pas particulièrement utile en tant que commandement de missiles à des fins de dissuasion, et tout à fait inutile en temps de paix, est néanmoins très importante pour la propagation de la démocratie dans le monde et doit être soutenue et développée."
 USA_60s_Ford_Machinery_M113: "Machines Ford M113"
 USA_60s_Ford_Machinery_M113_desc: "Le M113 est un tout nouveau Ford conçu à partir d'un APC produit. Haut de gamme et à la pointe de la technologie, nous avons tout intérêt à diffuser ce véhicule le plus largement possible."
 USA_60s_M113_Armorered_Cavalry_Conversion: "Conversion de cavalerie blindée M113"
 USA_60s_M113_Armorered_Cavalry_Conversion_desc: "Le M113 sera également destiné à certaines de nos unités de cavalerie blindée pour remplacer leurs APC vieillissants. Cela rendra notre corps mécanisé plus fort et une force avec laquelle il faudra compter."
 USA_60s_Encourage_M113_Exports: "Encourager les exportations de M113"
 USA_60s_Encourage_M113_Exports_desc: "L'exportation du M113 ne profitera pas seulement à notre gouvernement, elle renforcera également notre économie grâce aux ventes à l'exportation ainsi que nos alliés lorsqu'ils le mettront en service."
 USA_60s_Mass_Adoption_of_the_M16: "Adoption massive du M16"
 USA_60s_Mass_Adoption_of_the_M16_desc: "Le M16, descendant de l'AR-15 et développé pendant la guerre du Vietnam, est l'un des meilleurs fusils jamais fabriqués au monde. Toutes nos forces terrestres devraient l'utiliser."
 USA_60s_The_MBT_70: "Le MBT-70"
 USA_60s_The_MBT_70_desc: "Le programme MBT-70 sera un projet conjoint de R&D américano-allemand et ouest-allemand visant à produire un MBT capable de contrer le corps blindé soviétique. Ce sera une tâche difficile mais enrichissante."
 USA_60s_Abandon_the_MBT_70_Program: "Abandonner le programme MBT-70"
 USA_60s_Abandon_the_MBT_70_Program_desc: "Le MBT-70 est déjà bien hors budget et obsolète. Il est malheureusement temps pour nous de sortir de cette expérience ratée."
 USA_60s_X_M803: "XM-803"
 USA_60s_X_M803_desc: "Le XM-803 est un projet de l'armée, censé être une version améliorée du MBT-70 en panne, avec un coût bien inférieur. Le temps nous dira s'ils ont raison, mais pour l'instant, ils peuvent poursuivre leurs expériences."
 USA_60s_Lima_Tank_Plant_Explosion: "Agrandissement de l'usine de réservoirs de Lima"
 USA_60s_Lima_Tank_Plant_Explosion_desc: "L'usine de réservoirs de Lima, dans l'Ohio, est en activité depuis 1941 et est l'une des meilleures de notre pays. Pour augmenter nos capacités de production de réservoirs, l'agrandissement des installations est la voie à suivre."
 USA_60s_The_American_Navy: "La marine américaine"
 USA_60s_The_American_Navy_desc: "Notre marine est la façon dont nous projetons notre puissance à travers les mers, loin de chez nous et dans des endroits comme le Moyen-Orient et l'Asie du Sud-Est. Nous devons conserver cette arme si nous voulons pouvoir continuer à le faire."
 USA_60s_Advanced_Naval_Design_Studies: "Études avancées de conception navale"
 USA_60s_Advanced_Naval_Design_Studies_desc: "De nouvelles avancées dans le domaine de la technologie navale surviennent chaque jour et nous devons les exploiter et les mettre à profit dans nos grandes flottes."
 USA_60s_Hydrofoil_Design_Studies: "Études de conception d'hydroptères"
 USA_60s_Hydrofoil_Design_Studies_desc: "De nouvelles études sur les hydroptères nous ont permis de faire progresser considérablement notre technologie RHIB (bateau gonflable à coque rigide)."
 USA_60s_Anti_Submarine_Ballistic_Missles: "Missiles balistiques anti-sous-marins"
 USA_60s_Anti_Submarine_Ballistic_Missles_desc: "Nous avons des armes nucléaires SLBM, et maintenant les Soviétiques aussi. Nous devons créer un autre type d'arme pour empêcher leurs sous-marins de libérer leurs charges utiles mortelles."
 USA_60s_Kittery_Shipyard_Expansion: "Agrandissement du chantier naval de Kittery"
 USA_60s_Kittery_Shipyard_Expansion_desc: "Le chantier naval de Portsmouth, à Kittery dans le Maine, est un important centre de production en Nouvelle-Angleterre pour notre marine et devrait être agrandi."
 USA_60s_Nuclear_Carrier_Development: "Développement de porteurs nucléaires"
 USA_60s_Nuclear_Carrier_Development_desc: "Les porte-avions à propulsion nucléaire sont l'avenir. Ils peuvent aller plus loin, rester en mer plus longtemps et soutenir des opérations sur une zone plus vaste. Nous devons investir immédiatement dans de nouveaux modèles."
 USA_60s_Conventional_Nuclear_Naval_Propulsion: "Propulsion navale nucléaire conventionnelle"
 USA_60s_Conventional_Nuclear_Naval_Propulsion_desc: "Maintenant que les conceptions sont en place, nous devons faire progresser nos recherches sur les moteurs nucléaires afin de pouvoir réellement propulser nos nouveaux superporteurs."
 USA_60s_Mobile_Airfield: "Aérodrome mobile"
 USA_60s_Mobile_Airfield_desc: "Nos tout nouveaux CVN sont exactement ce que les ancêtres de la doctrine des transporteurs avaient imaginé il y a toutes ces années. Des aérodromes massifs et flottants, chacun capable de soutenir et de mener des frappes stratégiques précises à travers les océans."
 USA_60s_Salt_Water_Nuclear_Engines: "Moteurs nucléaires à eau salée"
 USA_60s_Salt_Water_Nuclear_Engines_desc: "Nos recherches ont montré que nous avons besoin de moteurs nucléaires spécialisés pour un environnement d'eau salée, où vivent pratiquement nos transporteurs. Il faut aller plus loin dans ce domaine dès maintenant."
 USA_60s_The_American_Airforce: "L'armée de l'air américaine"
 USA_60s_The_American_Airforce_desc: "L'Armée de l'Air a opéré même lorsque et là où nos autres branches ne le pouvaient pas, fournissant des ponts aériens vers des nations affamées, soutenant les régimes démocratiques avec une couverture aérienne et bombardant nos ennemis communistes à travers le monde."
 USA_60s_Strategic_Bomber_Command_Restructure: "Restructuration du Commandement des bombardiers stratégiques"
 USA_60s_Strategic_Bomber_Command_Restructure_desc: "De nouveaux modèles et rôles de bombardiers sont produits chaque jour, et nous devons mettre à jour notre structure de commandement pour en tenir compte."
 USA_60s_Continue_High_Speed_Bomber_Development: "Poursuivre le développement des bombardiers à grande vitesse"
 USA_60s_Continue_High_Speed_Bomber_Development_desc: "Les plans pour un bombardier à grande vitesse sont en place et en cours depuis un certain temps, et nous devons les poursuivre pour ajouter cet avion vital à notre arsenal."
 USA_60s_Cancel_the_XB_70: "Annuler le XB-70"
 USA_60s_Cancel_the_XB_70_desc: "Le XB-70 Valkyrie a été conçu pour être le bombardier stratégique ultime à haute altitude et à grande vitesse. Malheureusement, cela n'a pas été le cas lors des essais en vol, et il est temps de mettre celui-ci au second plan."
 USA_60s_Big_Four_B_52_Enhancement: "Amélioration du Big Four B-52"
 USA_60s_Big_Four_B_52_Enhancement_desc: "Le B-52 est la pierre angulaire de notre puissance aérienne, et il serait dommage de laisser tomber une plate-forme d'armes aussi magnifique. Nous devons l'améliorer et le mettre à jour."
 USA_60s_Embrace_Systemic_Doctrine: "Adoptez la doctrine systémique"
 USA_60s_Embrace_Systemic_Doctrine_desc: "Le rôle de notre Force aérienne a changé depuis sa création, et il est temps que notre doctrine évolue en même temps. Adopter le programme systémique y contribuera."
 USA_60s_Air_Gunnery_Re_Emphasis: "Réaccentuation du tir aérien"
 USA_60s_Air_Gunnery_Re_Emphasis_desc: "Depuis trop longtemps, nous nous concentrons sur les bombardiers de haute technologie et notre R&D sur les chasseurs a pris du retard. C'est inacceptable et nous devons une fois de plus mettre l'accent sur le chasseur à réaction."
 USA_60s_Chrysler_XM_1: "ChryslerXM-1"
 USA_60s_Chrysler_XM_1_desc: "Le XM-1 sera enfin la réponse que nous recherchons pour remplacer le char obsolète M-60 Patton. Il est nouveau, durable et a du punch. C'est exactement ce dont nous avions besoin et ce que nous souhaitions pour notre corps blindé."
 USA_60s_Carrier_Strike_Group_Formations: "Formations de groupes aéronavals"
 USA_60s_Carrier_Strike_Group_Formations_desc: "Alors que les porte-avions gagnent en importance dans notre stratégie, nous ne pouvons pas nous permettre de les négliger, eux et leurs escadrons. La mise à jour des formations des groupes d'attaque améliorera l'efficacité et la précision."
 USA_60s_Maintain_Missle_Prioritisation: "Maintenir la priorisation des missiles"
 USA_60s_Maintain_Missle_Prioritisation_desc: "Même si notre force aérienne habitée est importante, notre commandement en matière de missiles et notre R&D le sont davantage, et nous ne pouvons pas l'oublier."
 USA_60s_Heavy_Napalm_Integration: "Intégration lourde de napalm"
 USA_60s_Heavy_Napalm_Integration_desc: "Le napalm est et sera un outil utile pour éliminer les villages et le couvert forestier dense. Son intégration dans notre Force aérienne nous permettra de le déployer."
 USA_60s_Wild_Weasels: "Belettes sauvages"
 USA_60s_Wild_Weasels_desc: "Les Wild Weasels sont des avions équipés de missiles anti-radiations et chargés de nettoyer et de supprimer la défense aérienne ennemie. Avoir des avions à réaction et des pilotes dédiés à cette tâche permettra aux autres d'agir sans se soucier des tirs au sol."
 