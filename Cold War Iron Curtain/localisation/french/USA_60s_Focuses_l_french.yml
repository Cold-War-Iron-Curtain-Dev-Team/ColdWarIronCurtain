 USASOV_VIETNAM.1.d: "L'invasion américaine des jungles vietnamiennes se poursuit sans opposition depuis un certain temps, même si les troupes de [USA.GetNameDef]ont fait peu de progrès. Januscz Lewandowski, notre représentant auprès de la Commission internationale de contrôle, a proposé une initiative diplomatique appelée « Souci ». Dans le cadre de cette proposition, il aiderait à discerner les conditions de paix en agissant comme intermédiaire entre le Nord-Vietnam et l'ambassadeur américain au Sud-Vietnam. "		#Poland Event
 USASOV_VIETNAM.2.d: "L'invasion américaine des jungles vietnamiennes se poursuit sans opposition depuis un certain temps, même si les troupes de [USA.GetNameDef]ont fait peu de progrès. Nous avons appris que Januscz Lewandowski, représentant polonais auprès de la Commission internationale de contrôle, a proposé une initiative diplomatique baptisée « Souci ». Dans le cadre de cette proposition, il aiderait à discerner les conditions de paix en agissant comme intermédiaire entre le Nord-Vietnam et l'ambassadeur américain au Sud-Vietnam. Même si nous ne devons pas jouer un rôle de médiateur actif, nous pouvons empêcher son initiative si nous le souhaitons."
 USASOV_VIETNAM.3.d: "L'ambassadeur soviétique à [POL.GetNameDef] a contacté nos diplomates au sujet de Marigold, l'initiative diplomatique récemment lancée par Januscz Lewandowski. Ces diplomates ont suggéré sans tact, avec des menaces à peine voilées, que nous empêchions ses efforts diplomatiques. Malheureusement, nous ne pouvons pas permettre à Lewandowski de poursuivre cet effort."
 USASOV_VIETNAM.4.d: "Notre ambassadeur au Sud-Vietnam a reçu un communiqué du représentant polonais auprès de la Commission internationale de contrôle Januscz Lewandowski. Lewandowski a exprimé le désir de servir d'intermédiaire dans les négociations de paix entre le Nord-Vietnam et le [USA.GetNameDef]. Alors que certains des plus proches conseillers du président estiment que nous devrions profiter de cette occasion pour nous retirer de la guerre, de nombreux faucons de guerre croient que nous pouvons nous battre bec et ongles pour gagner ce combat contre le communisme."
 USASOV_VIETNAM.5.d: "Le gouvernement [USA.GetAdjective] a officiellement accepté notre proposition de négociations de paix entre le Nord-Vietnam et [USA.GetNameDef]! Nous pouvons nous attendre à de véritables négociations dans les mois à venir au siège des Nations Unies, si [VIN.GetNameDef] accepte."
 USASOV_VIETNAM.6.d: "L'initiative diplomatique Marigold a été rapidement et sans équivoque rejetée par [USA.GetAdjective]. Malheureusement, nous ne parviendrons pas à aplanir le conflit au Vietnam."
 USASOV_VIETNAM.7.d: "Le représentant polonais auprès de la CPI, Januscz Lewandowski, s'est porté volontaire comme intermédiaire pour les négociations de paix entre notre nation et [USA.GetNameDef]! Les Américains semblent même prêts à travailler avec nous pour la paix. "
 USASOV_VIETNAM.8.d: "Les représentants des pays [USA.GetNameDef] et [VIN.GetNameDef] se sont réunis sous la supervision du représentant polonais Lewandowski au siège de l'ONU. Après plusieurs jours de négociations tendues, ils se sont mis d'accord sur des conditions de paix, qui ont ensuite été confirmées par les gouvernements des pays [USA.GetNameDef] et [VIN.GetNameDef]. L'armée [USA.GetAdjective] se retirera bientôt d'Asie du Sud-Est."
 USASOV_VIETNAM.9.d: "Les dirigeants de [VIN.GetNameDef] ont rejeté nos tentatives de paix ! Pour une raison quelconque, ils semblent vouloir le combat ?"

 
