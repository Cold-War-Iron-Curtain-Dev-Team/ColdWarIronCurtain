 BUL_fighter_equipment_0:0 "Voennovazdushni sili"
 BUL_fighter_equipment_0_short:0 "CONTRE"
 BUL_fighter_equipment_0_desc:0 "L'armée de l'air bulgare est l'une des trois branches de l'armée bulgare, les deux autres étant la marine bulgare et les forces terrestres bulgares. Sa mission est de garder et de protéger la souveraineté de l'espace aérien bulgare et, conjointement avec les autres branches, de protéger l'intégrité territoriale. L'armée de l'air bulgare est l'une des plus anciennes forces aériennes d'Europe et du monde. Ces derniers temps, elle a participé activement à de nombreuses missions et exercices de l'OTAN en Europe."

 BUL_fighter_equipment_1:0 "Dewoitine D.520"
 BUL_fighter_equipment_1_short:0 "D.520"
 BUL_fighter_equipment_2:0 "Messerschmitt Bf 109G-2 'Strela'"
 BUL_fighter_equipment_2_short:0 "Bf 109G-2 'Strela'" 
 BUL_fighter_equipment_3:0 "Yakovlev Yak-9U"
 BUL_fighter_equipment_3_short:0 "Yak-9U"
 BUL_fighter_equipment_3_desc:0 "En mars 1945, l'armée de l'air bulgare reçut 120 chasseurs Yak-9 de diverses modifications (Yak-9D, Yak-9DD, Yak-9M et Yak-9U)."
 
 BUL_jet_multirole_equipment_1:0 "Yakovlev Yak-23"
 BUL_jet_multirole_equipment_1_short:0 "Yak-23"
 BUL_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15"
 BUL_jet_multirole_equipment_2_desc:0 "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 BUL_jet_multirole_equipment_2_short:0 "MiG-15"
 BUL_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17"
 BUL_jet_multirole_equipment_3_desc:0 "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
 BUL_jet_multirole_equipment_3_short:0 "MiG-17"
 BUL_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19"
 BUL_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 BUL_jet_multirole_equipment_4_short:0 "MiG-19"
 BUL_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-21F-13"
 BUL_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 BUL_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 BUL_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21PF"
 BUL_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 BUL_jet_multirole_equipment_6_short:0 "MiG-21PF"
 BUL_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-23M"
 BUL_jet_multirole_equipment_7_desc:0 "le MiG-23 a été le premier chasseur soviétique à disposer d'un radar de surveillance et d'abattage et l'un des premiers à être armé de missiles au-delà de la portée visuelle. La production a commencé en 1969 et a atteint un grand nombre avec plus de 5 000 avions construits, ce qui en fait l'avion à voilure variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service limité auprès de certains clients exportateurs."
 BUL_jet_multirole_equipment_7_short:0 "MiG-23M"
 BUL_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-23ML"
 BUL_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment la solidité et la fiabilité de la cellule, les performances du moteur, la maniabilité et les performances du radar. Une refonte considérable de la cellule a été réalisée, aboutissant au MiG-23ML."
 BUL_jet_multirole_equipment_8_short:0 "MiG-23ML"
 BUL_jet_multirole_equipment_9:0 "Mikoyan-Gourevitch MiG-23MLD"
 BUL_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de la mise à niveau était d'améliorer la maniabilité, en particulier lors d'une AoA élevée, ce qui a été identifié comme le principal défaut du MiG-23M/ML. Le boom de Pitot était équipé de générateurs de vortex, et les racines entaillées du bord d'attaque de l'aile étaient en « dents de scie » pour agir également comme générateurs de vortex. Le système de commande de vol incorporait le dispositif d'arrêt de manche synthétique/limiteur de signaux SOS-3-4."
 BUL_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 BUL_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29A"
 BUL_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le Mikoyan Design Bureau. C'était le premier chasseur de 4e génération à entrer en service en URSS et dans le bloc de l'Est. Intégrant une avionique améliorée et des capacités radar considérablement améliorées. Les premiers MiG-29 ont été utilisés comme entraîneurs par le Pacte de Varsovie avec des exportations limitées vers l'Inde mais avaient une utilisation limitée au combat. Le MiG-29 deviendra plus tard la base de variantes largement produites telles que le MiG-29S, le MiG-29M et le MiG-35."
 BUL_jet_multirole_equipment_10_short:0 "MiG-29A"

 BUL_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29M"
 BUL_mr_stealth_fighter_equipment_1_short:0 "MiG-29M"
 BUL_mr_stealth_fighter_equipment_1_desc:0 "L'avion MiG-29M/M2 est une révision du MiG-29 de base. Il a acquis une capacité multirôle plus robuste grâce à une utilisation améliorée d'armes air-air et air-sol de haute précision. Il présentait également une portée de combat considérablement accrue, grâce à une augmentation de sa capacité de carburant interne.[5]Quelques changements ont eu lieu au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger aluminium-lithium pour augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été révisée, les persiennes d'admission supérieures ont été supprimées pour laisser la place à plus de carburant dans les LERX, des tamis à mailles ont été introduits pour éviter les dommages causés par des corps étrangers (FOD) et les dimensions d'entrée ont été agrandies pour un débit d'air plus élevé."
 
 #Interceptor
 
 BUL_heavy_fighter_equipment_1:0 "Yakovlev Yak-9T"
 BUL_heavy_fighter_equipment_1_short:0 "Yak-9T"
 #BUL_heavy_fighter_equipment_1_desc:0 "The Yak-9 had a cut down rear fuselage with an all-around vision canopy. Its lighter metal structure allowed for an increased fuel load and armament over previous models build from wood. The Yak-9 was manoeuvrable at high-speed at low and medium altitudes and easy to control, which made it one of most produced Soviet fighters of World War II."
 BUL_heavy_fighter_equipment_2:0 "Petliakov Pe-2"
 BUL_heavy_fighter_equipment_2_short:0 "Pe-2"
 #BUL_heavy_fighter_equipment_2_desc:0 "A further development from the Pe-2, the Pe-3 was a dedicated night-fighter aircraft when introduced in 1941, the same year as its stablemate, the Pe-2. Its design and use followed a comparable path to those taken by the German Luftwaffe with the Junkers Ju 88 and the British Royal Air Force with the De Havilland Mosquito. Used with distinction during the Battle of Moscow, and despite the sole factory responsible for building the type being evacuated as a result of the battle, the Pe-3 was used throughout the conflict, with later production runs dedicated to building reconnaissance variants of the type."

 BUL_jet_interceptor_equipment_3:0 "Mikoyan-Gourevitch MiG-17PF"
 BUL_jet_interceptor_equipment_3_desc:0 "Version chasseur-intercepteur tout temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F"
 BUL_jet_interceptor_equipment_3_short:0 "MiG-17PF"

 BUL_jet_interceptor_equipment_7:0 "Mikoyan-Gourevitch MiG-25P"
 BUL_jet_interceptor_equipment_7_desc:0 "Le Mikoyan-Gurevich MiG-25 Foxbat est peut-être l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 a pris son envol au début de 1964 et est officiellement entré en service en 1970. Tout au long de sa vie, plus de 1 150 avions ont été construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. L'avion a été conçu pour intercepter rapidement des avions à très haute altitude comme le U-2 et le B-58 à une vitesse fulgurante. L'avion a donné à l'Union soviétique un contrôle bien supérieur sur son propre espace aérien éloigné que jamais auparavant. Il est encore aujourd'hui en service limité dans l'armée de l'air russe."
 BUL_jet_interceptor_equipment_7_short:0 "MiG-25P"

#CAS

 BUL_CAS_equipment_1:0 "Junkers Ju 87A 'Sztuka'"
 BUL_CAS_equipment_1_short:0 "Ju 87A 'Sztuka'"
 BUL_CAS_equipment_2:0 "Iliouchine Il-2"
 BUL_CAS_equipment_2_short:0 "Il-2"
 BUL_CAS_equipment_2_desc:0 "En 1945, l'armée de l'air bulgare reçut 120 avions d'attaque Il-2 et 10 avions d'entraînement Il-2U. L'avion a été utilisé jusqu'en 1954."
 BUL_CAS_equipment_3:0 "Iliouchine Il-10"
 BUL_CAS_equipment_3_short:0 "Il-10"
 BUL_CAS_equipment_3_desc:0 "En 1947, les premiers avions d'attaque Ilyushin sont arrivés, les Il-10 et Il-10M. Au cours de la période 1953-54, la Bulgarie a fourni des exemplaires de l'Il-10-Avia B-33 produits en Tchécoslovaquie sous licence soviétique, armés de quatre canons d'avion NS-23RM (150 coups par baril)."
 BUL_CAS_equipment_4:0 "Avion B-33"
 BUL_CAS_equipment_4_short:0 "B-33"
 BUL_CAS_equipment_4_desc:0 "Variante de construction tchèque du vénérable Il-10. Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à de nombreux défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 participa à certaines des dernières opérations de combat en Europe, ainsi qu'à la brève intervention soviétique dans la guerre du Pacifique. Au moment où l'Il-10 a pris sa retraite du service soviétique en 1956, l'armée de l'air a délaissé les avions purement CAS et d'attaque au sol pour se tourner vers les chasseurs-bombardiers. Son nom de rapport à l'OTAN est Beast."

 BUL_jet_CAS_equipment_1:0 "Iliouchine Il-10M"
 BUL_jet_CAS_equipment_1_short:0 "Iliouchine Il-10M"
 BUL_jet_CAS_equipment_1_desc:0 "En 1947, les premiers avions d'attaque Ilyushin sont arrivés, les Il-10 et Il-10M. Au cours de la période 1953-54, la Bulgarie a fourni des exemplaires de l'Il-10-Avia B-33 produits en Tchécoslovaquie sous licence soviétique, armés de quatre canons d'avion NS-23RM (150 coups par baril)."
 BUL_jet_CAS_equipment_2:0 "Yakovlev Yak-23Y"
 BUL_jet_CAS_equipment_2_short:0 "Yak-23Y"
 BUL_jet_CAS_equipment_2_desc:0 "Version impact Yak-23."
 BUL_jet_CAS_equipment_3:0 "Mikoyan-Gourevitch MiG-17AC"
 BUL_jet_CAS_equipment_3_short:0 "MiG-17AC"
 BUL_jet_CAS_equipment_3_desc:0 "Un chasseur-bombardier équipé pour lancer diverses roquettes non guidées. À la fin des années 50, un grand nombre de MiG-17 équipés de lanceurs NAR ont été transférés aux régiments de chasseurs-bombardiers nouvellement formés."
 #BUL_jet_CAS_equipment_4:0 ""
 #BUL_jet_CAS_equipment_4_desc:0 ""
 #BUL_jet_CAS_equipment_4_short:0 ""
 #BUL_jet_CAS_equipment_5:0 ""
 #BUL_jet_CAS_equipment_5_desc:0 ""
 #BUL_jet_CAS_equipment_5_short:0 ""
 BUL_jet_CAS_equipment_6:0 "Soukhoï Su-22"
 BUL_jet_CAS_equipment_6_short:0 "Su-22"
 BUL_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
 BUL_jet_CAS_equipment_7:0 "Mikoyan-Gourevitch MiG-23BN"
 BUL_jet_CAS_equipment_7_desc:0 "(\"Flogger-H\") Version améliorée du MiG-23B, le MiG-23BN se distinguait par le fait qu'il était équipé des ailes Edition 3 et du moteur R-29 des variantes de chasseurs contemporaines, ainsi que de mises à jour mineures de l'électronique et de l'équipement. L'autre différence majeure était la suppression de la tête diélectrique présente sur le MiG-23B. Produits de 1973 à 1985, un total de 624 MiG-23BN ont été construits, bien que seul un petit nombre ait servi dans des unités VVS, le reste étant exporté."
 BUL_jet_CAS_equipment_7_short:0 "MiG-23BN"
 BUL_jet_CAS_equipment_8:0 "Soukhoï Su-25K"
 BUL_jet_CAS_equipment_8_short:0 "Su-25K"
 BUL_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. L'avion a effectué son vol inaugural en 1975 et a été introduit en 1981. Depuis 1978, plus de 1 000 avions ont été produits. C'était un avion particulièrement populaire à l'étranger, vendu dans 29 pays. Pour cette raison, le Su-25 a été impliqué dans plusieurs conflits, notamment la guerre soviétique en Afghanistan, l'Iran-Irak et la guerre du Golfe. L'avion reste aujourd'hui en service dans tous les pays d'exportation."

 BUL_cas_stealth_equipment_1:0 "Sukhoï Su-25SM"
 BUL_cas_stealth_equipment_1_short:0 "Su-25SM"
 BUL_cas_stealth_equipment_1_desc:0 "Le Su-25SM (Stroyevoy Modernizirovannyi) est un programme de mise à niveau « abordable » pour le Su-25, conçu par l'armée de l'air russe en 2000. Le programme découle des tentatives de mise à niveau du Su-25T et du Su-25TM, qui ont été évaluées et qualifiées de trop sophistiquées et coûteuses. La mise à niveau SM intègre des améliorations de l'avionique et une remise à neuf de la cellule pour prolonger la durée de vie du Frogfoot jusqu'à 500 heures de vol ou 5 ans. La toute nouvelle suite de navigation/attaque PRnK-25SM « Bars » du Su-25SM est construite autour du système informatique numérique BTsVM-90, initialement prévu pour le programme de mise à niveau du Su-25TM. La précision de navigation et d'attaque fournie par la nouvelle suite est trois fois supérieure à celle du Su-25 de base et se situerait à moins de 15 m en utilisant la correction satellite et à 200 m sans celle-ci."

