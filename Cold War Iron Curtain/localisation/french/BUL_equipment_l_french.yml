 ### Infantry Equipment

 BUL_infantry_equipment_0:0 "Mosin Nagant"
 BUL_infantry_equipment_0_short:0 "Mosin Nagant"
 BUL_infantry_equipment_0_desc:0 "Le fusil à 3 lignes M1891, familièrement connu en Occident sous le nom de Mosin-Nagant et en Russie et dans l'ex-Union soviétique sous le nom de fusil de Mosin, est un fusil militaire à cinq coups, à verrou, alimenté par un chargeur interne. On le trouve principalement chambré pour sa cartouche d'origine 7,62 × 54 mmR."
 
 BUL_infantry_equipment_1:0 "Avtomat Kalachnikova 1947"
 BUL_infantry_equipment_1_short:0 "AK-47"
 BUL_infantry_equipment_1_desc:0 "L'AK47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK47 constituait une vaste mise à niveau du SKS. L'AK47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde."

 BUL_infantry_equipment_2:0 "Awtomat Kalachnikova 1947"
 BUL_infantry_equipment_2_short:0 "AKK"
 BUL_infantry_equipment_2_desc:0 "En Bulgarie, la production de fusils d'assaut Kalachnikov (ici appelés « carabines automatiques ») a été créée au début des années 1960. Au début, ils étaient assemblés à partir de composants polonais, au milieu des années 1960, de manière indépendante. La carabine automatique Kalachnikov (AKK) a été produite par l'usine d'armement nationale \"Arsenal\". Semblable à l'AKS soviétique, ce fusil d'assaut possède une crosse repliable constituée de tiges semi-circulaires en acier, qui se libère en appuyant sur le loquet situé sur le côté gauche du récepteur. La partie reposant sur l'épaule a la forme d'un fer à cheval ; les rivets ne sont pas visibles."

 BUL_infantry_equipment_3:0 "Awtomat Kalachnikova 1974"
 BUL_infantry_equipment_3_short:0 "AKKS-74"
 BUL_infantry_equipment_3_desc:0 "Au milieu des années 1980, la production de fusils d'assaut pour la nouvelle cartouche de 5,45 mm est maîtrisée : AKK-74, AKKS-74 et AKK-74 (N), ce dernier disposait d'un support en queue d'aronde pour le montage de viseurs nocturnes et optiques. Jusqu'au milieu des années 1990, les machines bulgares étaient des copies presque complètes des machines soviétiques."
 
 BUL_infantry_equipment_4:0 "Arsenal AR-M7"
 BUL_infantry_equipment_4_short:0 "AR-M7"
 BUL_infantry_equipment_4_desc:0 "En 1999, Arsenal a développé des fusils d'assaut Kalachnikov de 5,56 mm répondant aux normes de l'OTAN, qui ont été proposés à l'exportation. De plus, depuis 1999, la société bulgare \"Arsenal\" a refusé d'utiliser le nom \"fusil d'assaut Kalachnikov\" (cependant, la production de fusils d'assaut s'est poursuivie sous le nom AR, et la sortie de leurs versions à chargement automatique - sous le nom SLR). AR-M7 - versions plus lourdes de l'AKM chambrées pour 5,56x45 OTAN ou 7,62x39 mm (AR-M7F) - avec crosse repliable, raccords en plastique, inserts lumineux dans le viseur."

 ########## NEW BUL ARMOR

#LT

 BUL_lt_equipment_1:0 "LT vz.35/Т-11"
 BUL_lt_equipment_1_short:0 "LT vz.35/Т-11"
 BUL_lt_equipment_1_desc:0 "Les chars légers tchécoslovaques LT vz. 35/T-11 et LT vz. 38 ont résisté dans l'armée populaire bulgare jusqu'au début des années 1950, de sorte que la dernière commande de pièces de rechange pour eux a été reçue par Skoda en 1948."
 BUL_lt_equipment_2:0 "LT vz.38"
 BUL_lt_equipment_2_short:0 "LT vz.38"
 BUL_lt_equipment_2_desc:0 "Les chars légers tchécoslovaques LT vz. 35/T-11 et LT vz. 38 ont résisté dans l'armée populaire bulgare jusqu'au début des années 1950, de sorte que la dernière commande de pièces de rechange pour eux a été reçue par Skoda en 1948." 
 BUL_lt_equipment_3:0 "PT-76"
 BUL_lt_equipment_3_short:0 "PT-76"
 BUL_lt_equipment_3_desc:0 "Le PT76 est un char léger amphibie soviétique et a été largement exporté dans le monde entier. Il a été conçu par N Shashmyrin et Zh Kotin en 1951 et environ 12 000 unités ont été fabriquées. Il nécessite un équipage de 3 hommes et un moteur V6 six cylindres en ligne avec une vitesse de 44 km/h et peut nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique et à tendance soviétique et, en tant que tel, a joué un rôle de reconnaissance dans pratiquement tous les conflits des nations de la sphère soviétique. Cependant, il est encore utilisé aujourd'hui dans de nombreux pays en raison de sa célèbre fiabilité et de sa facilité d'entretien."
 BUL_lt_equipment_4:0 "PT-76B modèle 4"
 BUL_lt_equipment_4_short:0 "PT-76B"
 BUL_lt_equipment_4_desc:0 "PT-76 armé du canon de char rayé D-56TS de 76,2 mm (frein de bouche à double chicane, éjecteur de cartouche, extracteur de fumée et système de stabilisation à 2 axes STP-2P 'Zarya'),[4] le système de protection NBC PAZ (protivo-atomnaya zashchita), un système d'extinction automatique d'incendie, un viseur TShK-2-66 amélioré, une filtration-ventilation système, des dispositifs d'observation améliorés, un équipement électrique amélioré, un nouveau moteur diesel V-6B 6 cylindres 4 temps en ligne refroidi par eau développant 263 ch (196 kW) à 1 800 tr/min et des réservoirs de carburant internes supplémentaires pour lesquels la forme du blindage a dû être légèrement modifiée."

