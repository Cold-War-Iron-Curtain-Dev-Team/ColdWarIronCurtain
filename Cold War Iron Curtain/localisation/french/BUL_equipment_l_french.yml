 #### BULGARIAN NAVAL EQUIPMENT ####

 # Light Hulls #

 BUL_battle_hull_light_0:0 "Classe Ouchakov"
 BUL_battle_hull_light_0_short:0 "Classe Ouchakov"
 BUL_battle_hull_light_0_desc:0 "Structurellement, il s'agissait d'une version modernisée des destroyers de la classe \"Daring\" (selon d'autres sources, du type \"Hajibey\", mais en fait ce sont des navires de la même série constructive). Dans les années 1920-1930, des programmes de modernisation sont menés, touchant principalement l'artillerie auxiliaire et anti-aérienne du navire."
 BUL_battle_hull_light_1:0 "Projet 50 \"Hermine\""
 BUL_battle_hull_light_1_short:0 "Projet 50 \"Hermine\""
 BUL_battle_hull_light_1_desc:0 "Anciens soviétiques SKR-67, SKR-53 et Kobchik. Les deux premiers navires ont servi dans la flotte de la mer Noire et le troisième dans la 4e structure de la marine de l'URSS. Les deux premiers navires reçurent les numéros tactiques 31 et 32 et furent intégrés au 1er bataillon anti-sous-marin distinct 11 VMB-Varna. Au cours de leurs campagnes en Méditerranée, les TFR ont reçu des numéros tactiques temporaires - 15 « Brave » et 16 « Brave »."
 #BUL_battle_hull_light_4:0 "E-71 "Wilingen""
 #BUL_battle_hull_light_4_short:0 "E-71 "Wilingen""
 #BUL_battle_hull_light_4_desc:0 "Former Belgian frigate F912 "Wandelaar", sold to Bulgaria and named "Daring" on November 2, 2005. The second frigate F911 "Westdiep" was acquired and received in 2008. In 2008, the F910 "Wielingen" was acquired, called "Pravda. " The last frigate was delivered in 2009. They were purchased as part of the fleet replenishment program with ships capable of participating in NATO operations."
 
 BUL_screen_hull_heavy_0:0 "Projet 30-K"
 BUL_screen_hull_heavy_0_short:0 "Projet 30-K"
 BUL_screen_hull_heavy_0_desc:0 "Mis sur cale avant la Seconde Guerre mondiale à Nikolaev. Il a reçu le nom de \"Michievous\" et est devenu partie intégrante de la flotte de la mer Noire de l'URSS en 1948. Il a reçu des équipements radar qui n'existaient pas du tout dans les années 1930 - le radar Rif et Guys pour surveiller la situation en surface, un radar pour contrôler les tirs d'artillerie avec le calibre principal Redan et un radar de contrôle de tir de torpilles Redan-4, une station de reconnaissance \"Fakel\", une station de brouillage, un équipement de navigation \"Rome\", une station hydroacoustique \"Tamir-5N\", améliorée. Armes anti-aériennes."
 BUL_screen_hull_heavy_1:0 "Projet 1241.1T 'Molniya-1'"
 BUL_screen_hull_heavy_1_short:0 "Projet 1241.1T"
 BUL_screen_hull_heavy_1_desc:0 "Ancien R-256 \"Poltava Komsomolets\" de la 41e brigade de bateaux lance-missiles de la flotte de la mer Noire de l'URSS. Construit à Leningrad au chantier naval Diamond sous le numéro de bâtiment 404."
 BUL_screen_hull_heavy_2:0 "Projet 1241.2E 'Molniya-2'"
 BUL_screen_hull_heavy_2_short:0 "Projet 1241.2E"
 BUL_screen_hull_heavy_2_desc:0 "Anciens MPK-46 et MPK-124 soviétiques de la flotte de la mer Noire. L'équipement électronique des navires comprend les radars de surface et aériens \"Mius\", \"Raid\", le radar de conduite de tir MR-123 \"Vympel-AM\", le GAS sous quille MGK-345 \"Bronze\" et le GAS descendant, système de tir dipolaire. Réflecteurs PK-16."
 BUL_screen_hull_heavy_3:0 "Projet 1159"
 BUL_screen_hull_heavy_3_short:0 "Projet 1159"
 BUL_screen_hull_heavy_3_desc:0 "Ancien TFR \"Dolphin\" avec le numéro tactique 690, puis 696. Livré en Bulgarie le 22 décembre 1989. En février 1990, le navire est enrôlé dans la marine bulgare avec le numéro tactique 11 et reçoit le nom de \"Brave\"."
 BUL_screen_hull_heavy_4:0 "K-90"
 BUL_screen_hull_heavy_4_short:0 "K-90"
 BUL_screen_hull_heavy_4_desc:0 "La corvette du projet K-90 a un déplacement de 1 700 tonnes, une longueur de 91,2 m et une largeur de 13,2 m. La centrale électrique est un moteur diesel à double arbre, pouvant atteindre 24 noeuds à pleine vitesse. L'autonomie de croisière est de 4 500 milles à une vitesse économique de 14 noeuds. L'autonomie est de 20 jours. L'équipage régulier est de 65 personnes. L'armement comprend des missiles antinavires (MBDA Exocet MM40) et antiaériens à courte portée (MBDA VL-MICA), ainsi que l'installation d'artillerie universelle de 76 mm Oto Melara Super Rapid, le complexe d'artillerie antiaérienne de 35 mm Rheinmetall Oerlikon Millennium et deux mitrailleuses télécommandées de 12,7 mm."
 
 BUL_screen_hull_medium_0:0 "Projet 122bis" 
 BUL_screen_hull_medium_0_short:0 "Projet 122bis"
 BUL_screen_hull_medium_0_desc:0 "Les navires construits selon ce projet représentent un développement du projet 122A, car les armes anti-sous-marines et les équipements électroniques ont subi des changements importants. Les anciens BO-160 et BO-162 soviétiques de la flotte de la mer Noire ont été transférés en Bulgarie en 1957."
 BUL_screen_hull_medium_1:0 "Projet 201M"
 BUL_screen_hull_medium_1_short:0 "Projet 201M"
 BUL_screen_hull_medium_1_desc:0 "Les navires de ce projet sont destinés à remplacer ceux construits selon le projet 122bis, leur armement a été considérablement renforcé. Il s'agit du dernier projet en date des poursuivants de sous-marins de la marine soviétique. Ils ont été construits au chantier naval Zaliv à Kertch après l'adoption en 1961 du décret du Conseil des ministres de l'URSS sur la fourniture de navires de ce type à la Bulgarie. Au début de 1962, 6 MPK (numéros de bâtiment 549-554) ont été installés à l'usine et l'année suivante, ils ont été transférés en Bulgarie dans la ville de Sozopol."
 BUL_screen_hull_medium_2:0 "Projet 204"
 BUL_screen_hull_medium_2_short:0 "Projet 204"
 BUL_screen_hull_medium_2_desc:0 "Anciens petits navires anti-sous-marins soviétiques, construits selon le projet 204. L'idée de créer un navire anti-sous-marin spécialisé à grande vitesse et à déplacement limité a été développée dans la marine de l'URSS dans les années 50 et 60, lorsqu'une nouvelle génération de sous-marins est apparue dans les flottes occidentales."
 BUL_screen_hull_medium_3:0 "Projet 205 « Tsunami »"
 BUL_screen_hull_medium_3_short:0 "Projet 205"
 BUL_screen_hull_medium_3_desc:0 "Les radars suivants ont été déployés sur les navires de guerre - un mât radar, un équipement de reconnaissance \"propre étranger\" - un interrogateur \"Nickel\", un répondeur \"Nichrom-RM\", un PLC pour le contrôle de l'AK-230 MR-104 \"Lynx\"."
 BUL_screen_hull_medium_4:0 "Projet 206"
 BUL_screen_hull_medium_4_short:0 "Projet 206"
 BUL_screen_hull_medium_4_desc:0 "Les bateaux ont été achetés par l'URSS dans le cadre du programme de réforme et de mise à jour du personnel naval de la marine bulgare. Les navires étaient censés constituer la principale force de frappe de la flotte dans la zone côtière de la mer et, avec les bateaux lance-missiles, il était prévu de frapper les unités de débarquement ennemies, de reconnaître la situation en surface et de cibler les bateaux lance-missiles."
 

 # Submarine Hulls #
 
 BUL_sub_hull_small_single_0:0 "Série M type XV"
 BUL_sub_hull_small_single_0_short:0 "Série M type XV"
 BUL_sub_hull_small_single_0_desc:0 "Anciens M-202, M-203 et M-204 soviétiques de la dernière série XV. Conçu pour protéger la côte et les bases navales. En accord avec la Bulgarie, des équipages arrivèrent à Odessa en 1948 pour préparer la réception des sous-marins. Ils furent officiellement remis à la marine bulgare le 18 août 1954. Les sous-marins n'étaient pas nommés dans la marine bulgare. Ils naviguent avec des numéros tactiques."
 BUL_sub_hull_small_single_1:0 "Projet 613"
 BUL_sub_hull_small_single_1_short:0 "Projet 613"
 BUL_sub_hull_small_single_1_desc:0 "Anciens S-244 et S-245 soviétiques. Adopté par la marine bulgare avec les numéros tactiques n° 41 \"Slava\" et n° 42 \"Pobeda\" en 1958 pour remplacer trois sous-marins de type \"M\". Deux sous-marins font partie de la 8e division sous-marine constituée. Pour la première fois sur ces sous-marins, des marins bulgares ont commencé à patrouiller dans le Bosphore. Ils furent retirés de la flotte en 1972."
 BUL_sub_hull_small_single_2:0 "Projet 633"
 BUL_sub_hull_small_single_2_short:0 "Projet 633"
 BUL_sub_hull_small_single_2_desc:0 "Anciens S-57, S-212, S-36 et S-38 soviétiques de la flotte de la mer Noire de l'URSS. Entré dans la marine bulgare en 1972."
 