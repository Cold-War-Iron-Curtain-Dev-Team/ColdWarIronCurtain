 #Light Jet
 
 BUL_jet_light_equipment_1:0 "Yakovlev Yak-11"
 BUL_jet_light_equipment_1_short:0 "Yak-11"
 BUL_jet_light_equipment_1_desc:0 "En plus du combat, des chasseurs d'entraînement Yak-11 ont été fournis à la Bulgarie par l'URSS."
 BUL_jet_light_equipment_2:0 "Laz-7"
 BUL_jet_light_equipment_2_short:0 "Laz-7"
 BUL_jet_light_equipment_2_desc:0 "Dans le même temps, le développement de son propre avion bulgare ne s'est pas arrêté. Ainsi, depuis 1948, 160 avions d'entraînement Laz-7 conçus par l'ingénieur Ivan Lazarov ont été produits. De plus, en plus de l'utiliser comme véhicule d'entraînement, le Laz-7 était en service dans deux divisions de bombardiers légers de nuit, créées à l'instar des unités soviétiques armées d'U-2 (Po-2)."
 BUL_jet_light_equipment_3:0 "Aéro L-29 Delfin"
 BUL_jet_light_equipment_3_short:0 "L-29 Delfin"
 BUL_jet_light_equipment_3_desc:0 "Comme formation dans la période 1963-1974. les Bulgares ont reçu 102 Aero L-29 Delfin tchécoslovaques, qui ont servi jusqu'en 2002."
 BUL_jet_light_equipment_4:0 "Laz-14"
 BUL_jet_light_equipment_4_short:0 "Laz-14"
 BUL_jet_light_equipment_4_desc:0 "Laz-14 est un avion d'entraînement à réaction biplace monomoteur destiné à la formation initiale et à l'assistance à la formation des pilotes. L'installation d'armes envisagée permettrait d'effectuer un certain nombre de missions de combat."
 BUL_jet_light_equipment_5:0 "Aéro L-39ZA Albatros"
 BUL_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 BUL_jet_light_equipment_5_desc:0 "À des fins de formation, environ 30 Aero L-39 Albatros tchécoslovaques ont été livrés."
 
 #Recon Plane
 BUL_recon_equipment_0:0 "KB-11 Fazan"
 BUL_recon_equipment_0_short:0 "KB-11 Fazan"
 BUL_recon_equipment_0_desc:0 "Le Kaproni Bulgarski KB-11 a été utilisé pour remplacer les Letov S-328 et le PZL P.43 dans les escadrons de reconnaissance à courte portée de l'armée de l'air bulgare, équipant quatre escadrons."

 BUL_jet_recon_equipment_0:0 "Mikoyan-Gourevitch MiG-15Rbis"
 BUL_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 BUL_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé le développement d'une variante de reconnaissance de première ligne du MiG-15 avec une caméra AFA-BA/40, qui fournit une largeur de levé en bande de 0,9 à 4,5 km avec une longueur de route de photographie de 90 à 450 km à des altitudes de 2 000 à 10 000 m. Un seul canon NR-23 a été installé sur l'avion. Pour augmenter la portée du scout, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur \"Barium-M\" et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur la machine."
 BUL_jet_recon_equipment_1:0 "Mikoyan-Gourevitch MiG-25RB"
 BUL_jet_recon_equipment_1_short:0 "MiG-25RB"
 BUL_jet_recon_equipment_1_desc:0 "MiG-25RB - avion de reconnaissance opérationnel monoplace toutes altitudes - bombardier. Les tests ont été achevés en décembre 1970. L'avion était équipé de 2 à 4 caméras de reconnaissance générale A-70M et d'une caméra topographique AFA-E/10. Le matériel photographique était logé dans cinq compartiments situés au bas du fuselage avant. Une station SIGINT appelée SPS-4A ou B « Virage » a également été installée, fonctionnant dans différentes gammes de fréquences. Équipement spécial - station d'interférence radio active SPS-141"

