 BUL_mechanized_equipment_1:0 "Hanomag Sd.Kfz. 250"
 BUL_mechanized_equipment_1_short:0 "SdKfz 250"
 BUL_mechanized_equipment_2:0 "Hanomag Sd.Kfz. 251"
 BUL_mechanized_equipment_2_short:0 "Sd.Kfz. 251"
 BUL_mechanized_equipment_3:0 "BTR-40"
 BUL_mechanized_equipment_3_short:0 "BTR-40"
 BUL_mechanized_equipment_3_desc:0 "En 1955, les premiers véhicules blindés de transport de troupes BTR-40 sont entrés en service dans l'armée bulgare ; au total, 150 unités furent livrées jusqu'en 1957."
 BUL_mechanized_equipment_4:0 "BTR-40B"
 BUL_mechanized_equipment_4_short:0 "BTR-40B"
 #BUL_mechanized_equipment_4_desc:0 ""
 BUL_mechanized_equipment_5:0 "BTR-60P"
 BUL_mechanized_equipment_5_short:0 "BTR-60P"
 BUL_mechanized_equipment_5_desc:0 "Les BTR-152 à roues sont fournis à la Bulgarie depuis 1957."
 BUL_mechanized_equipment_6:0 "BTR-60PB"
 BUL_mechanized_equipment_6_short:0 "BTR-60PB"
 BUL_mechanized_equipment_6_desc:0 "Depuis 1962, les véhicules blindés de transport de troupes soviétiques BTR-60, devenus le principal véhicule de l'infanterie bulgare, ont commencé à être fournis à la Bulgarie. Les livraisons se sont poursuivies jusqu'en 1972, avec un total d'environ 700 véhicules livrés."
 BUL_mechanized_equipment_7:0 "BTR-60PBZ"
 BUL_mechanized_equipment_7_short:0 "BTR-60PBZ"
 BUL_mechanized_equipment_7_desc:0 "Cela a été suivi par une modification du BTR-60PB avec un armement renforcé composé d'une mitrailleuse KPVT de 14,5 mm et d'un PKT de 7,62 mm dans la tourelle, qui est devenu pendant de nombreuses années le principal véhicule blindé de transport de troupes bulgare."
 BUL_mechanized_equipment_8:0 "BTR-60PB-MD1"
 BUL_mechanized_equipment_8_short:0 "BTR-60PB-MD1"
 BUL_mechanized_equipment_8_desc:0 "Lors de la conversion du BTR-60PB en BTR-60PB-MD1, la centrale électrique est remplacée, tout en utilisant des composants importés fabriqués aux États-Unis (deux moteurs GAZ-40P sont remplacés par un moteur diesel six cylindres en ligne Cummins ISB 25.30 d'une capacité de 250 ch)."
 BUL_mechanized_equipment_9:0 "BTR-60PB-MD3"
 BUL_mechanized_equipment_9_short:0 "BTR-60PB-MD3"
 BUL_mechanized_equipment_9_desc:0 "8 lance-grenades fumigènes sont installés sur la tourelle avec des mitrailleuses. Au lieu de l'ancien viseur, un viseur plus moderne avec des caractéristiques améliorées a été installé. Pour faciliter l'entrée et la sortie du palier, les portes sont découpées sur les côtés."
 #BUL_mechanized_equipment_10:0 "BTR-82A"
 #BUL_mechanized_equipment_10_short:0 "BTR-82A"
 #BUL_mechanized_equipment_10_desc:0 ""

#IFV

 BUL_mechanized_heavy_equipment_1:0 "BTR-152"
 BUL_mechanized_heavy_equipment_1_short:0 "BTR-152"
 BUL_mechanized_heavy_equipment_2:0 "BTR-50PK"
 BUL_mechanized_heavy_equipment_2_short:0 "BTR-50PK"
 BUL_mechanized_heavy_equipment_2_desc:0 "De 1960 à 1963, des BTR-50 à chenilles ont été livrés en Bulgarie, soit 700 unités au total."
 BUL_mechanized_heavy_equipment_3:0 "MT-LB"
 BUL_mechanized_heavy_equipment_3_short:0 "MT-LB" 
 BUL_mechanized_heavy_equipment_4:0 "BMP-1"
 BUL_mechanized_heavy_equipment_4_short:0 "BMP-1"
 BUL_mechanized_heavy_equipment_5:0 "MT-LB-M1"
 BUL_mechanized_heavy_equipment_5_short:0 "MT-LB-M1"
 BUL_mechanized_heavy_equipment_5_desc:0 "Depuis 1972, en Bulgarie, dans l'usine de construction de machines BETA de Cherven Bryag, la production du tracteur blindé léger MT-LB est établie. La production s'est poursuivie jusqu'en 1995. Dans l'ensemble, ils ne diffèrent pratiquement pas de l'original. Néanmoins, certaines voitures ont été commercialisées avec leurs propres modifications, ce qui a apporté encore plus de variété au large éventail de la famille." 
 BUL_mechanized_heavy_equipment_6:0 "BMP-23"
 BUL_mechanized_heavy_equipment_6_short:0 "BMP-23"
 BUL_mechanized_heavy_equipment_6_desc:0 "L'armement du BMP-1 ne répondant pas aux exigences de l'époque, il fut décidé de développer un nouveau BMP basé sur le MT-LB, qui devint le seul véhicule de combat bulgare développé de manière indépendante. Le BMP créé a reçu l'indice BMP-23."
 BUL_mechanized_heavy_equipment_7:0 "BMP-23A"
 BUL_mechanized_heavy_equipment_7_short:0 "BMP-23A"
 BUL_mechanized_heavy_equipment_7_desc:0 "Version améliorée du BMP avec des lance-grenades fumigènes de 81 mm 902V \"Tucha\" sur les côtés de la tourelle et remplacement de l'ATGM par le 9M111 \"Fagot\"."
 BUL_mechanized_heavy_equipment_8:0 "BMP-30"
 BUL_mechanized_heavy_equipment_8_short:0 "BMP-30"
 BUL_mechanized_heavy_equipment_8_desc:0 "Un autre développement du BMP-23 était la variante BMP-30, qui diffère par l'installation d'une tourelle du BMP-2 soviétique avec un canon 2A42 de 30 mm et un ATGM 9M111 \"Fagot\"." 

