l_french:
 # ============================================================================
 #  THE CHINESE QUESTION - Chinese Civil War side branch (SOV / Stalin tree)
 #  Visible from game start. Forks on the outcome of the civil war.
 # ============================================================================

 # ---- Events ----
 sov_china_branch.1.t:0 "Les 156 projets"
 sov_china_branch.1.d:0 "Le plus grand transfert de technologie de l'histoire est en cours, et il va dans une direction que personne n'avait anticipée à Washington.\n\nCent cinquante-six installations industrielles complètes - aciéries, centrales électriques, usines de machines-outils, usines aéronautiques - sont expédiées de l'Union soviétique vers la Chine avec les plans, l'outillage et les ingénieurs pour les faire fonctionner. La Chine se voit dotée, en une décennie, d'une base industrielle qui a nécessité trois plans quinquennaux et une famine pour la construction de l'Union soviétique.\n\nElle est financée par des emprunts chinois aux taux d'intérêt soviétiques et rend la République populaire dépendante de Moscou pour toutes les pièces de rechange dont elle aura besoin pendant vingt ans. Les deux faits sont compris des deux côtés."
 sov_china_branch.1.a:0 "Générosité avec une facture très longue."

 sov_china_branch.2.t:0 "Le retour de Port Arthur"
 sov_china_branch.2.d:0 "Les forces soviétiques se retirent de Lüshun et la base navale prise par l'Empire russe en 1898 et l'Armée rouge en 1945 est cédée sans conditions aux Chinois.\n\nC'est la mesure la plus efficace que Moscou ait prise en Asie. Chaque écolier chinois sait ce que signifie Port Arthur ; les traités inégaux sont un fait politique réel à Pékin, pas une leçon d'histoire. Le rendre sans qu'on le lui demande deux fois fait plus pour l'alliance que n'importe quelle quantité de machines-outils.\n\nCela coûte également à la marine soviétique son seul mouillage dans les eaux chaudes du Pacifique. Le Présidium en a discuté pendant huit mois."
 sov_china_branch.2.a:0 "Certaines choses valent plus qu'on les donne."

 sov_china_branch.3.t:0 "Le vingtième congrès arrive à Pékin"
 sov_china_branch.3.d:0 "Le discours du camarade Khrouchtchev à huis clos n'a pas été publié, ce qui n'a pas empêché tous les partis communistes du monde de le lire en quelques semaines.\n\nA Pékin, la réaction est froide. Le président Mao n'a pas été consulté, ni prévenu, et n'accepte pas que les dirigeants du camp socialiste puissent réécrire leur propre histoire sans faire référence à l'autre moitié de celle-ci. La critique du culte de la personnalité y est lue comme une critique de quelque chose de plus proche de nous que Staline.\n\nRien n'est cassé. Le traité tient, les conseillers sont toujours en place, les projets se construisent toujours. Mais quelque chose a changé dans la relation, et les deux parties le savent."
 sov_china_branch.3.a:0 "Ils ne le diront pas à haute voix. Pas encore."

 sov_china_branch.4.t:0 "La Redoute Mandchourie"
 sov_china_branch.4.d:0 "La révolution chinoise a été repoussée là où elle a commencé : le nord-est, les provinces industrielles construites par les Japonais et démantelées par l'Armée rouge en 1945.\n\nCe qui survit de la République populaire détient la Mandchourie et rien d'autre. Elle est entourée d'un côté par le Kuomintang victorieux et de l'autre par la frontière soviétique, et elle existe parce que Moscou a décidé qu'elle existerait.\n\nLe croupion sera reconstruit en tant que client soviétique, de fait comme de nom : nos usines, nos garnisons, nos conseillers et une direction qui comprend précisément qui l'a maintenu en vie."
 sov_china_branch.4.a:0 "Ce qui reste de la Chine est à nous."

 # ---- Focuses: shared ----
 SOV_ccw_the_chinese_civil_war:0 "La guerre civile chinoise"
 SOV_ccw_the_chinese_civil_war_desc:0 "La plus grande guerre au monde se déroule en Chine, et l'Union soviétique a pris soin de ne pas y être vue.\n\nL'opinion privée du camarade Staline sur les camarades chinois n'a jamais été chaleureuse. Il leur a conseillé de s'entendre avec Chiang en 1945, il a signé un traité d'amitié avec le Kuomintang et il ne croit pas qu'une armée paysanne puisse s'emparer d'un continent. Le président Mao est conscient de ces trois faits.\n\nMais le Kuomintang s'effondre plus rapidement que quiconque à Moscou ne l'avait prédit, et une Chine communiste - aussi indisciplinée soit-elle - vaut plus qu'une prédiction correcte."
 SOV_ccw_the_chinese_civil_war_tt:0 "Débloque la branche §YQuestion chinoise§!."

 SOV_ccw_arm_the_peoples_liberation_army:0 "Armer l'Armée populaire de libération"
 SOV_ccw_arm_the_peoples_liberation_army_desc:0 "L'Armée populaire de libération se bat avec ce qu'elle a capturé : des fusils japonais provenant des stocks de l'armée du Guandong, du matériel américain pris aux divisions du Kuomintang qui se sont rendues plutôt que de combattre.\n\nCela peut être amélioré. Le matériel soviétique se déplacera vers le sud à travers la Mandchourie, tranquillement, en quantité et sans aucun document confirmant que cela s'est produit."
 SOV_ccw_arm_the_peoples_liberation_army_tt:0 "La RPC reçoit §Yd'équipement§!, §Yd'effectifs§! et §Yd'expérience militaire§!.\nLa projection de la puissance étrangère soviétique diminue tandis que les expéditions se poursuivent."

 # ---- Focuses: PRC victory ----
 SOV_ccw_recognize_the_peoples_republic:0 "Reconnaître la République populaire"
 SOV_ccw_recognize_the_peoples_republic_desc:0 "La République populaire a été proclamée depuis la Porte de la Paix Céleste et l'Union Soviétique l'a reconnue le lendemain - le premier État au monde à le faire.\n\nUn quart de l'humanité a rejoint le camp socialiste en une seule après-midi. Quelles que soient les réserves que Moscou avait émises à l'égard de ses camarades chinois pendant la guerre, ils constituent désormais la deuxième puissance de ce camp, et le rapport des forces en Asie a changé de façon permanente."
 SOV_ccw_recognize_the_peoples_republic_tt:0 "Reconnaissez la RPC. Accès militaire mutuel §Y§! et une forte amélioration des relations.\nLa Chine entre dans la §Ysphère soviétique§!."

 SOV_ccw_soviet_loan_to_china:0 "Prêt soviétique à la Chine"
 SOV_ccw_soviet_loan_to_china_desc:0 "Trois cents millions de dollars américains à un pour cent, remboursables sur dix ans.\n\nLe président Mao a passé deux mois à Moscou pour le négocier et n'a pas caché son opinion selon laquelle il était avare pour un pays de cinq cents millions d'habitants. Le camarade Staline pensait que les Chinois avaient demandé beaucoup et offert très peu, et qu'un prêt remboursé était une relation entretenue."

 SOV_ccw_the_156_projects:0 "Les 156 projets"
 SOV_ccw_the_156_projects_desc:0 "La Chine n'a aucune industrie à proprement parler en dehors de la Mandchourie, et ce que possédait la Mandchourie, l'Armée rouge l'a supprimé en 1945.\n\nCent cinquante-six usines complètes seront transférées - acier, énergie, machines-outils, aviation - avec les plans, l'outillage et les ingénieurs soviétiques pour les mettre en service. Il s'agit du plus grand transfert de capacité industrielle jamais tenté, il nous coûtera très cher et fera de l'économie chinoise une extension de la nôtre pendant une génération."
 SOV_ccw_the_156_projects_tt:0 "Grosses dépenses soviétiques. La Chine obtient §Yde financement§!, un §Ycomplexe industriel§! et une usine d'armement §Y§!, et les relations s'améliorent considérablement."

 SOV_ccw_soviet_advisors_in_china:0 "Conseillers soviétiques en Chine"
 SOV_ccw_soviet_advisors_in_china_desc:0 "Dix mille spécialistes soviétiques se rendront en Chine, non seulement des ingénieurs, mais aussi des officiers d'état-major, des planificateurs, des statisticiens, des professeurs d'université et des agents de la police secrète.\n\nIls reconstruiront l'État chinois à l'image soviétique parce que c'est la seule image qu'ils connaissent. Dans vingt ans, Pékin se souviendra de cette période comme de la période où l'on a appris à la Chine à être une copie d'un ailleurs. Pour l'instant, c'est le bienvenu."
 SOV_ccw_soviet_advisors_in_china_tt:0 "Accès militaire mutuel §Y§!. La Chine gagne §Yarmée§!, §Yaérienne§! et §Yexpérience navale§!.\nLes relations s'améliorent considérablement et la projection de la puissance étrangère soviétique augmente."

 SOV_ccw_return_port_arthur:0 "Retour Port-Arthur"
 SOV_ccw_return_port_arthur_desc:0 "Lüshun a été russe, puis japonais, puis à nouveau russe. Aux termes du traité de 1950, elle devait rester une base navale commune sino-soviétique jusqu'en 1952, puis jusqu'à la fin de la guerre de Corée, puis indéfiniment.\n\nLe restituer sans y être invité coûte à la flotte du Pacifique son seul mouillage sans glace. Cela supprime également le grief le plus aigu que les Chinois ont contre nous, et cela avant qu'ils n'aient à le demander."
 SOV_ccw_return_port_arthur_tt:0 "Port Arthur est restitué à la Chine. Gain important de §Ypouvoir politique§!, les relations s'améliorent considérablement et la tension mondiale diminue."

 SOV_ccw_technical_assistance:0 "Assistance technique"
 SOV_ccw_technical_assistance_desc:0 "Au-delà des usines se pose la question plus difficile de savoir quoi d'autre partager : la conception des réacteurs, la séparation des isotopes, le travail théorique.\n\nLa Chine se dotera d'un réacteur de recherche, d'un cyclotron et de la formation d'une génération de physiciens. Il n'obtiendra pas d'arme. La distinction est claire à Moscou et suscitera un ressentiment considérable à Pékin."
 SOV_ccw_technical_assistance_tt:0 "La Chine gagne un emplacement de recherche §Y§! et un bonus important pour la recherche §Yen électronique§!.\nLa projection de la puissance étrangère soviétique augmente."

 SOV_ccw_the_twentieth_congress_in_peking:0 "Le vingtième congrès à Pékin"
 SOV_ccw_the_twentieth_congress_in_peking_desc:0 "Le discours secret a été prononcé à huis clos et lu dans le monde entier en un mois.\n\nLe président Mao n'a été ni consulté ni prévenu. Il a tiré deux conclusions : que la direction du camp socialiste traite le parti chinois comme un subordonné plutôt que comme un partenaire, et qu'une doctrine qui permet de dénoncer un dirigeant mort permet également de dénoncer un dirigeant vivant.\n\nL'alliance est intacte. La confiance qui l'a maintenu ensemble n'est pas tout à fait, et tout ce qui suivra en découlera."
 SOV_ccw_the_twentieth_congress_in_peking_tt:0 "Les relations avec la Chine §Rse détériorent§!.\nLa première fissure dans l'alliance."

 # ---- Focuses: nationalist victory ----
 SOV_ccw_save_northwestern_china:0 "Sauver le nord-ouest de la Chine"
 SOV_ccw_save_northwestern_china_desc:0 "L'Armée populaire de libération s'est effondrée. Chiang détient la capitale, la côte et les vallées fluviales, et la révolution chinoise est traquée dans les provinces qu'elle contrôlait il y a six mois.\n\nCe qui peut encore être détenu, c'est le nord-ouest et le nord-est, les terres qui touchent notre frontière et qui peuvent être approvisionnées à travers celle-ci. Tout ce qui se trouve au sud a disparu, et prétendre le contraire nous coûtera ce qui reste."

 SOV_ccw_military_bases_in_east_turkestan:0 "Bases militaires au Turkestan oriental"
 SOV_ccw_military_bases_in_east_turkestan_desc:0 "Le Xinjiang est dans l'orbite soviétique depuis les années 1930 et, avec la victoire du Kuomintang à l'est, il constitue désormais une frontière plutôt qu'une province.\n\nLes garnisons et les aérodromes soviétiques entreront ouvertement. Quel que soit ce qui reste de la souveraineté chinoise, il y a une formalité, et les formalités coûtent moins cher qu'une guerre frontalière."

 SOV_ccw_provide_guns_to_the_military_cliques:0 "Fournir des armes aux cliques militaires"
 SOV_ccw_provide_guns_to_the_military_cliques_desc:0 "La Chine de Chiang n'a jamais été un seul pays. Il s'agit d'une coalition de seigneurs de guerre qui se sont soumis à Nankin parce que Nankin était en train de gagner, et un Kuomintang victorieux devra les désarmer ou être gouverné par eux.\n\nNous veillerons à ce qu'ils soient en mesure de refuser. Chaque clique qui possède sa propre armée est une province que Chiang ne gouverne pas réellement."

 SOV_ccw_the_manchurian_redoubt:0 "La Redoute Mandchourie"
 SOV_ccw_the_manchurian_redoubt_desc:0 "Ce qui reste de la République populaire comprend le nord-est et rien d'autre : les provinces industrielles, les noeuds ferroviaires et une frontière avec l'Union soviétique qui est la seule raison pour laquelle elle existe encore.\n\nIl sera reconstruit tel qu'il est aujourd'hui : un client soviétique. Nos usines, nos garnisons, nos conseillers, une direction qui doit sa survie à Moscou, et aucune illusion de part et d'autre sur l'accord.\n\nUne Chine de quatre-vingts millions d'habitants en Mandchourie est une récompense bien moindre qu'une Chine de cinq cents millions d'habitants. C'est aussi un animal beaucoup plus obéissant."
 SOV_ccw_the_manchurian_redoubt_tt:0 "La croupe mandchoue gagne §Yun financement§!, §Yune stabilité§!, un §Yun complexe industriel§!, une §Yune usine d'armes§! et §Ydes équipements§!.\nLes relations s'améliorent considérablement."

 SOV_ccw_integrate_asia_into_the_eastern_bloc:0 "Intégrer l'Asie au bloc de l'Est"
 SOV_ccw_integrate_asia_into_the_eastern_bloc_desc:0 "La révolution chinoise étant réduite à une simple croupe mandchoue, il n'existe pas de deuxième puissance en Asie avec qui partager la direction du camp socialiste - et il n'y a aucun débat sur celui qui le dirigera.\n\nLa Mandchourie, la Mongolie, le Xinjiang et les autres pays seront intégrés dans le bloc dans les mêmes conditions que l'Europe de l'Est : autonomie du bloc de l'Est, un plan économique unique et pas de politique étrangère indépendante entre l'Oural et le Pacifique.\n\nC'est un empire plus pauvre que ne l'aurait été une Chine communiste. C'est un empire qui ne reculera jamais."

 # ---- Threats ----
 SOV_ccw_port_arthur_threat:0 "Le retour de Port Arthur"
 # ---- Added: Manchuria arm extension ----
 sov_china_branch.5.t:0 "Le parti en exil"
 sov_china_branch.5.d:0 "Le Parti communiste chinois a perdu un pays et a conservé une organisation.\n\nCe qui a traversé l'Amour et l'Oussouri au cours des derniers mois de la guerre, ce n'est pas une armée mais un appareil : le Comité central, les écoles de cadres, les archives et plus de cent mille personnes qui ne peuvent rentrer chez elles tant que Chiang est en vie.\n\nIls seront hébergés, nourris, recyclés et maintenus ensemble en Extrême-Orient soviétique et dans ce qui reste de la République populaire. Un parti sans pays est une mauvaise chose. Un parti sans pays et sans parti n'est rien du tout, et Moscou a décidé qu'il ne serait pas permis à la révolution chinoise de se terminer dans une colonne de réfugiés."
 sov_china_branch.5.a:0 "La révolution garde ses cadres."

 sov_china_branch.6.t:0 "La guerre va vers le sud"
 sov_china_branch.6.d:0 "Chiang détient les villes. Il ne tient pas la campagne, et il ne l'a jamais fait.\n\nLes zones de base de guérilla envahies par le Kuomintang sont en train d'être réactivées - dans le Jiangxi, dans les montagnes Dabie, dans le sud-ouest, où l'ordre de Nankin a toujours été une fiction polie. Les armes arrivent du nord au sud par des canaux qui n'existent pas officiellement.\n\nCela ne permettra pas de reprendre la Chine. Il garantira que le gouvernement qui a gagné la guerre civile consacrera les vingt prochaines années à la combattre."
 sov_china_branch.6.a:0 "Une victoire qu'il ne finira jamais de remporter."

 SOV_ccw_rebuild_the_northeast:0 "Reconstruire le Nord-Est"
 SOV_ccw_rebuild_the_northeast_desc:0 "La Mandchourie était la région la plus industrialisée d'Asie en dehors du Japon et, en 1945, l'Armée rouge l'a démontée et l'a expédiée chez elle - des aciéries, des centrales électriques et des gares de triage entières, chargées sur des wagons plats et transportées vers l'Oural en guise de réparations de guerre.\n\nLa république croupion qui dépend désormais de nous repose sur les décombres de ce que nous avons supprimé. En restituer une partie et construire le reste à neuf est le prix que le client mérite."
 SOV_ccw_rebuild_the_northeast_tt:0 "Grosses dépenses soviétiques. La Mandchourie gagne §Yde financement§!, un §Ycomplexe industriel§! et §Yd'infrastructures§!, et les relations s'améliorent considérablement."

 SOV_ccw_shelter_the_chinese_party:0 "Protégez le parti chinois"
 SOV_ccw_shelter_the_chinese_party_desc:0 "Plus de cent mille cadres, soldats et leurs familles ont traversé la frontière vers le territoire soviétique avant l'avancée du Kuomintang.\n\nIls seront hébergés et recyclés plutôt que dispersés, et la direction du parti sera maintenue intacte sous la supervision soviétique. Cela coûte cher et cela mettra à rude épreuve les régions d'Extrême-Orient. Cela signifie également que le Parti communiste chinois continue d'exister en tant qu'organisation plutôt qu'en tant que mémoire - et qu'il existe selon nos conditions."
 SOV_ccw_shelter_the_chinese_party_tt:0 "Gagnez §Yde main d'oeuvre§! et de pouvoir politique à un faible coût pour la stabilité.\nLa Mandchourie gagne §Yde stabilité§! et §Yde soutien de guerre§!, et les relations s'améliorent considérablement."

 SOV_ccw_the_manchurian_peoples_army:0 "L'Armée populaire de Mandchourie"
 SOV_ccw_the_manchurian_peoples_army_desc:0 "La république croupion a une frontière avec un ennemi victorieux de cinq cents millions d'habitants et une armée qui vient d'être battue par lui.\n\nCe qui sera reconstruit ne sera pas l'armée paysanne qui a perdu. Ce sera une force de type soviétique - armes soviétiques, doctrine soviétique, officiers soviétiques à tous les niveaux importants - parce que l'alternative est une deuxième défaite, et il n'y aura pas de troisième redoute vers laquelle se retirer."
 SOV_ccw_the_manchurian_peoples_army_tt:0 "Accès militaire mutuel §Y§!. La Mandchourie gagne §Yarmée§! et §Yexpérience aérienne§!, §Yéquipement§!, §Yarmure§! et une base aérienne §Y§!."

 SOV_ccw_the_southern_insurgency:0 "L'insurrection du Sud"
 SOV_ccw_the_southern_insurgency_desc:0 "Chiang a gagné la guerre sur le terrain. Il n'a pas conquis les villages, et les zones de base qui ont produit l'Armée rouge en premier lieu sont toujours là.\n\nLes armes, l'argent et les cadres iront vers le sud, à travers la Birmanie, l'Indochine, les ports, dans toutes les provinces où l'autorité du Kuomintang est une garnison plutôt qu'un gouvernement.\n\nNous n'allons pas reprendre la Chine de cette façon. Nous allons veiller à ce que personne d'autre ne finisse de le prendre non plus."
 SOV_ccw_the_southern_insurgency_tt:0 "La Chine nationaliste perd §Yde stabilité§! et §Yde soutien de guerre§! et gagne §Yde popularité communiste§!.\nLa Mandchourie peut envoyer des volontaires. La tension mondiale monte."

 SOV_ccw_isolate_the_kuomintang:0 "Isoler le Kuomintang"
 SOV_ccw_isolate_the_kuomintang_desc:0 "Une Chine nationaliste qui a gagné sa guerre civile est le client américain le plus important et le plus dangereux au monde, et elle est située à quatre mille kilomètres de frontière soviétique.\n\nTous les leviers seront utilisés : reconnaissance refusée, siège au Conseil de sécurité contesté, commerce fermé et les minorités frontalières de l'ouest et du sud-ouest rappellent qui sont leurs voisins. On fera comprendre à Nankin que sa victoire lui a valu un siège permanent."
 SOV_ccw_isolate_the_kuomintang_tt:0 "Les relations avec la Chine nationaliste §Rs'effondrent§! et elles tombent encore plus dans le camp §Yaméricain§!.\nLes relations avec la Mandchourie s'améliorent et la projection de la puissance étrangère soviétique augmente."

 SOV_ccw_southern_insurgency_threat:0 "Insurrection en Chine"
 # ---- Description for the focus moved in from SOV_Stalin.txt (name key already
 #      exists in focus_SOV_Stalin_l_english.yml; it never had a desc). ----
 SOV_krushchev_visit_china_desc:0 "Le camarade Khrouchtchev se rendra à Pékin pour le cinquième anniversaire de la République populaire - c'est la première fois qu'un dirigeant soviétique met les pieds en Chine.\n\nStaline n'y est jamais allé. Mao est venu à Moscou à deux reprises et a été fait attendre dans une datcha à l'extérieur de la ville pendant des semaines, une humiliation que personne à Pékin n'a oubliée. Aller vers eux inverse cela, et c'est censé le faire.\n\nIl arrivera avec l'accord de Port Arthur, des crédits supplémentaires et la manière d'un homme entre égaux. C'est le moment le plus chaleureux que l'alliance ait jamais connu."
