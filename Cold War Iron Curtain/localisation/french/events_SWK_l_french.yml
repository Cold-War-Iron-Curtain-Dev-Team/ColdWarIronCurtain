##Events
 SWK.1.t:0 "Création des forces armées du Sarawak"
 SWK.1.d:0 "Dans le cadre d'une démarche importante visant à renforcer la sécurité régionale, les forces armées du Sarawak ont été officiellement créées et comprennent quatre branches : l'armée de l'air, l'armée/les Rangers, la marine et la police. Faisant remonter leurs origines aux légendaires Sarawak Rangers, ces forces se sont engagées à défendre Bornéo contre de nouveaux conflits et incursions communistes.\n\nDirigées par le Rajah blanc Vyner Brooke et le maréchal Gerald Temple, les forces armées du Sarawak s'appuient sur la riche histoire et l'expertise des Sarawak Rangers, réputés pour leurs compétences en matière de guerre dans la jungle et leurs fonctions de police depuis le 19e siècle. Ce nouvel établissement militaire marque une étape cruciale dans la protection du Sarawak et le maintien de la stabilité en Asie du Sud-Est."
 SWK.1.a:0 "Tant qu'il y a la vie, il y a le combat ou Tant que je vivrai, je me battrai !"
 SWK.2.t:0 "Création de la marine du Sarawak"
 SWK.2.d:0 "La marine du Sarawak a été officiellement créée sous le commandement de Sir Thomas Halsey, 3e baronnet, marié à la dynastie Brooke. Cette nouvelle force navale jouera un rôle crucial dans la sauvegarde des eaux du Sarawak, en recevant d'anciens navires de la Seconde Guerre mondiale et en bénéficiant d'une formation approfondie du Royaume-Uni et de l'Australie. \n\nLa Marine sera basée à Kuching, avec le fort soutien de la Sarawak Steamship Company locale, qui fournira l'assistance technique et la maintenance de la nouvelle flotte. Cette initiative marque une étape importante dans le renforcement des capacités de défense maritime du Sarawak."
 SWK.2.a:0 "Non sibi sed Patriae"
 SWK.3.t:0 "Création de l'armée de l'air du Sarawak"
 SWK.3.d:0 "La Sarawak Air Force a été officiellement créée sous la direction temporaire de St. John Carslake Brooke-Johnson, ancien opérateur SAS prolifique basé en Afrique du Nord pendant la Seconde Guerre mondiale. Basée à la base aérienne de Kuching, cette nouvelle branche renforcera les capacités de défense du Sarawak en utilisant une flotte composée d'avions restants des forces impériales japonaises, ainsi que d'avions de guerre donnés par l'Australie et le Royaume-Uni. Cette formation marque une étape cruciale dans le renforcement de la défense aérienne du Sarawak et la sécurisation de son espace aérien."
 SWK.3.a:0 "Par ardua ad Astra"
 SWK.4.t:0 "Incorporation de la police du Sarawak dans les forces armées du Sarawak"
 SWK.4.d:0 "L'ancien service de police du Sarawak a été officiellement constitué en tant que quatrième branche des forces armées du Sarawak nouvellement créées. Cette branche, axée sur la police militaire, les fonctions de prévôt, la sécurité des frontières et la protection des postes clés du gouvernement, jouera un rôle crucial dans le maintien de la stabilité et de la sécurité dans les secteurs civils. La nouvelle branche sera dirigée par l'inspecteur général Sir Claude Harry Fenner, un ancien officier de police de campagne prolifique en Malaisie, apportant une vaste expérience et un leadership à ce poste. Cette décision renforce l'appareil de sécurité global du Sarawak face aux défis régionaux."
 SWK.4.a:0 "Ad tyrannos provocare et infirma custodire"
 SWK.5.t:0 "Le gouvernement intérimaire du Premier Dominion"
 SWK.5.d:0 "Notre Dominion du Sarawak célèbre la mise en place réussie de son premier gouvernement intérimaire, marquant un nouveau chapitre plein d'espoir dans l'histoire de notre nation. Sous la direction du Rajah blanc Vyner Brooke, qui a été nommé par le peuple à la fois Rajah par intérim et Premier ministre, le gouvernement rassemble une représentation diversifiée de la population du Sarawak. Le Conseil Negri, l'organe législatif nouvellement formé, comprend des représentants des communautés malaises, chinoises malaises et autochtones, reflétant l'engagement du Sarawak en faveur de l'unité et de l'inclusivité tel qu'enseigné par le 1er Rajah blanc James. Nous bâtirons ensemble un bastion de stabilité et de démocratie en Asie du Sud-Est, en particulier face aux victoires communistes croissantes dans la région. Les dirigeants du Dominion sont soutenus par le gouvernement britannique qui est optimiste quant à l'avenir, avec des projets visant à construire un État fort et autonome, capable de résister aux menaces extérieures et d'offrir un avenir prospère à tous ses citoyens. La mise en place du gouvernement intérimaire est un symbole d'espoir et de résilience face au communisme."
 SWK.5.a:0 "Le Sarawak se lancera dans ce nouveau voyage avec détermination et confiance."
 SWK.6.t:0 "La nouvelle constitution du Sarawak"
 SWK.6.d:0 "Notre Dominion du Sarawak a adopté une deuxième constitution nouvelle et modernisée, qui s'appuie sur l'héritage de la constitution de 1941 avec des mises à jour clés pour refléter le paysage politique et social actuel. Cette nouvelle constitution réaffirme les « Neuf principes cardinaux » qui ont longtemps guidé la gouvernance du Sarawak, mettant l'accent sur les droits, le bien-être et la coexistence harmonieuse de sa population. Parmi les ajouts les plus notables figurent les articles 10 et 11, qui établissent des lignes directrices claires pour les activités politiques et idéologiques au Sarawak. L'article 10 autorise et encourage explicitement la formation de clubs et de partis politiques, à condition qu'ils respectent les institutions et les lois du Sarawak. Cette clause vise à favoriser une culture politique dynamique tout en préservant l'intégrité de la gouvernance de l'État. L'article 11, cependant, prend une position ferme contre le communisme, le déclarant illégal dans tous les territoires du Sarawak et parmi sa population aussi longtemps que le gouvernement actuel reste au pouvoir. Cela reflète l'engagement continu du Dominion à contrer la propagation des idéologies communistes dans la région, en particulier à la lumière de la menace croissante provenant des territoires continentaux voisins sous influence communiste."
 SWK.6.a:0 "Nous publierons immédiatement la constitution"
 SWK.7.t:0 "L'UMNO a créé la succursale du Sarawak"
 SWK.7.d:0 "L'Organisation nationale des Malais unis (UMNO), le principal parti politique de l'ancienne Malaisie, a officiellement créé une branche au Sarawak, marquant une évolution significative dans le paysage politique en évolution du pays. L'UMNO, connue pour défendre les droits des Malais et l'identité plus large des Bumiputra (identité malaise autochtone), cherche désormais à étendre son influence à travers la mer de Chine méridionale jusqu'au Sarawak, une région avec sa composition ethnique et culturelle unique. L'expansion de l'UMNO au Sarawak est motivée par un objectif stratégique : rapatrier Tunku Abdul Rahman, l'ancien Premier ministre de Malaisie, et le positionner comme Premier ministre du Sarawak. Le parti estime que sous la direction de Tunku, le Sarawak pourrait être orienté vers un sentiment d'unité plus fort parmi les populations autochtones en établissant l'Union malaise orientale sur le modèle de l'ancienne Union malaise du continent avant la récente prise de pouvoir communiste, guidée par les principes de \"Ketuanan Melayu\" (Suprématie malaise), qui prône la propagation de la \"malaisité\" à tous les habitants de Bornéo et luttent ensemble pour libérer et libérer le continent contrôlé par les communistes."
 SWK.7.a:0 "Bien sûr, plus on est de fous, plus on est de fous !"
 SWK.8.t:0 "1ère élection du gouvernement et du premier ministre du Sarawak :"
 SWK.8.d:0 "Le Sarawak se prépare à ses toutes premières élections gouvernementales et de Premier ministre, un événement historique qui façonnera l'avenir de ce Dominion nouvellement rétabli. Trois factions politiques majeures se disputent le leadership, chacune présentant une vision distincte de l'avenir du Sarawak. 1. Parti du Raj Blanc : Dirigé par Anthony Brooke de la Maison Brooke, le Parti du Raj Blanc représente la continuation de l'héritage de la dynastie Brooke, qui dirige le Sarawak depuis 1841. Leur programme prône une monarchie parlementaire, la modernisation de l'actuel gouvernement du Rajah Blanc et le renforcement des liens avec le Commonwealth. L'héritage du White Rajah est profondément enraciné dans l'histoire du Sarawak, et ce parti cherche à équilibrer la tradition avec la gouvernance moderne. 2. Parti d'autonomie populaire du Sarawak : force politique relativement nouvelle dirigée par Abang Openg, ce parti promeut une identité sarawakienne unique, distincte du mouvement pan-malais plus large. Leur programme met l'accent sur l'indépendance totale du Sarawak et sur une politique de neutralité dans les affaires internationales. Le Parti pour l'autonomie du peuple du Sarawak fait appel à ceux qui souhaitent rompre avec l'héritage colonial et se concentrer sur une gouvernance locale. 3. Parti d'autonomie populaire du Sarawak : force politique relativement nouvelle dirigée par Abang Openg, ce parti promeut une identité sarawakienne unique, distincte du mouvement pan-malais plus large. Leur programme met l'accent sur l'indépendance totale du Sarawak et sur une politique de neutralité dans les affaires internationales. Le Parti pour l'autonomie du peuple du Sarawak fait appel à ceux qui souhaitent rompre avec l'héritage colonial et se concentrer sur une gouvernance locale."
 SWK.8.a:0 "Rajah blanc"
 SWK.8.b:0 "Ouverture d'Abang"
 SWK.8.c:0 "Tunku Rahman"
 SWK.9.t:0 "Anthony Brooke a remporté les élections !"
 SWK.9.d:0 "Rajah Muda Anthony Brooke du White Rajah Party a été élu nouveau Premier ministre de notre grand Dominion du Sarawak, plaidant pour des liens plus étroits avec le Commonwealth ainsi que pour la libéralisation et la démocratisation éventuelle de notre Raj. Connu pour ses vues occidentalisées sur la construction de la nation, il vise à mettre en oeuvre une monarchie constitutionnelle et veille à réviser notre constitution vieillissante pour y parvenir. Alors que le Rajah Blanc prend ses fonctions, notre grand peuple anticipe la manière dont ces politiques façonneront son orientation future."
 SWK.9.a:0 "Le Sarawak est pour le Rajah Blanc et son peuple !"
 SWK.10.t:0 "Tunku Abdul Rahman a remporté les élections !"
 SWK.10.d:0 "L'ancien avocat et homme d'État Tunku Rahman de l'Organisation nationale des Malaisiens unis (UMNO) a été élu nouveau Premier ministre de notre grand dominion du Sarawak, plaidant pour des liens plus étroits avec les puissances occidentales, la libéralisation et le Ketuanan Melayu (suprématie de type malais). Connu pour ses opinions pan-malaises et son fidèle dévouement à l'Islam, il vise à construire une Union des Malais et veille à réviser notre constitution vieillissante pour y parvenir. Alors que le parti UMNO prend désormais le pouvoir, notre formidable peuple anticipe la manière dont ces politiques façonneront son orientation future."
 SWK.10.a:0 "Le Sarawak est pour les Malais !"
 SWK.11.t:0 "Openg Abang a remporté les élections !"
 SWK.11.d:0 "Le conseiller Negri du Conseil Openg Abang du Parti de l'autonomie du Sarawak a été élu nouveau Premier ministre de notre grand Dominion du Sarawak, plaidant pour la neutralité face à la bourre froide en cours et à la Sarawakisation de notre Raj. Connu pour ses opinions nationalistes et sa promotion de l'identité sarawakienne, il vise à déclarer une monarchie de la République fédérale du Sarawak et à s'assurer de réviser notre constitution vieillissante pour y parvenir. Alors que le conseiller municipal prend ses fonctions, notre formidable peuple anticipe la manière dont ces politiques façonneront son orientation future."
 SWK.11.a:0 "Le Sarawak est pour les Sarawakiens !"
 SWK.12.t:0 "Mise en oeuvre du plan Briggs au Sarawak"
 SWK.12.d:0 "En réponse à la montée de l'activité communiste et à la menace d'insurrection au Sarawak, les autorités britanniques ont mis en oeuvre le plan Briggs, une stratégie conçue pour la première fois lors de l'urgence malaise. Le plan visait à rompre les liens entre les guérilleros communistes et les populations rurales en réinstallant de force les civils dans des « nouveaux villages » stratégiquement sécurisés. Au Sarawak, cela impliquait la relocalisation de plusieurs milliers de résidents ruraux, principalement issus des communautés ethniques chinoises, dans des colonies fortifiées avec des déplacements restreints et une surveillance militaire.\n\nL'administration britannique a cherché à convaincre les civils déplacés en fournissant des équipements de base tels que l'éducation, les soins de santé, l'électricité et l'eau dans ces villages. Cependant, le caractère forcé des relocalisations et les mesures de surveillance strictes ont suscité des critiques et du ressentiment. Même si le plan Briggs visait à mettre fin au soutien aux insurgés et à stabiliser la région, il a également contribué à accroître les tensions ethniques et les divisions sociales à long terme au sein du Sarawak."
 SWK.12.a:0 "C'est la bonne chose à faire"
 SWK_MLA.1.t:0 "Le Parti communiste malais critique l'installation de l'UMNO au Sarawak"
 SWK_MLA.1.d:0 "Notre glorieux Parti communiste malais (MCP), dirigé par le camarade président Chin Peng, a condamné la récente expansion de l'UMNO au Sarawak, la qualifiant de force réactionnaire islamique visant à opprimer les autochtones du Sarawak sous domination religieuse. Notre Parti accuse l'UMNO de tenter d'imposer le « Ketuanan Melayu » (suprématie malaise) pour asservir la région et étendre le contrôle malais sur Bornéo. Le président Chin Peng prévient que la décision de l'UMNO, y compris son projet d'installer Tunku Abdul Rahman au poste de Premier ministre, est une étape vers la création d'une nouvelle Union malaise orientale, qui supprimera l'identité autochtone du Sarawak sous couvert de lutte contre le communisme."
 SWK_MLA.1.a:0 "Nos masses révolutionnées jurent de résister à cette menace réactionnaire."
 SWK_MLA_Response.1.t:0 "Déclaration de Chin Peng sur « l'Union démocratique populaire de Malaisie »"
 SWK_MLA_Response.1.d:0 "Notre gouvernement du Sarawak a été profondément ébranlé par la récente déclaration de la fausse « Union démocratique populaire de Malaisie » par Chin Peng et le Parti communiste malais. La nouvelle de ce nouveau régime jette une ombre noire sur la région, alors que les dirigeants du Sarawak pleurent la montée d'un État communiste sur le continent malais. La création de l'Union démocratique populaire est considérée comme une tournure tragique des événements, sapant les espoirs d'une Asie du Sud-Est pacifique et unifiée. Les dirigeants du Sarawak voient cette évolution avec tristesse, reconnaissant les souffrances et la répression qui pourraient s'abattre sur le peuple malais sous le nouveau régime communiste. Le gouvernement a réitéré son engagement à protéger ses propres citoyens contre des menaces similaires, tout en exprimant sa solidarité avec ceux qui restent fidèles aux idéaux de liberté et de démocratie dans la région."
 SWK_MLA_Response.1.a:0 "Nous libérerons le continent... "
 SWK_MLA_Response.2.t.a:0 "Le Parti communiste malais alarmé par le plan « Nyai Roro Kidul »"
 SWK_MLA_Response.2.t.b:0 "La marine du Sarawak approuve le plan \"Nyai Roro Kidul\""
 SWK_MLA_Response.2.d.a:0 "Le Parti communiste malais, dirigé par notre camarade Chin Peng, a exprimé sa profonde préoccupation face à l'approbation par la marine du Sarawak du plan \"Nyai Roro Kidul\". Cette stratégie agressive, visant à cibler et à détruire les infrastructures et les ports clés de l'Union démocratique populaire de Malaisie contrôlée par les communistes, est considérée comme une menace sérieuse à la stabilité et aux progrès réalisés par les Forces armées de libération nationale malaises. L'intention du plan de perturber les lignes d'approvisionnement et d'affaiblir les défenses de l'Union démocratique du peuple malais a sonné l'alarme au sein du parti, qui considère cette décision comme une dangereuse escalade de la part du Sarawak dans sa tentative de saper le mouvement communiste en Asie du Sud-Est."
 SWK_MLA_Response.2.d.b:0 "Dans le cadre d'un développement militaire important, la marine du Sarawak a approuvé l'exécution du « Nyai Roro Kidul », un plan stratégique visant à affaiblir les infrastructures et les ports de la Malaisie contrôlée par les communistes de Chin Peng. Le plan autorise des raids ciblés sur les principales installations de Red Malayan afin de perturber leurs lignes d'approvisionnement et d'empêcher toute future tentative d'invasion de Bornéo. Cette mesure préventive, du nom de la déesse javanaise de la mer, reflète la détermination du gouvernement du Sarawak à protéger son territoire et à maintenir la stabilité dans la région face à la menace communiste croissante. La marine du Sarawak, renforcée par ses récentes améliorations et alliances, est prête à mener ces opérations avec précision."
 SWK_MLA_Response.2.a:0 "Nous allons bientôt détruire ces chiens de mer réactionnaires"
 SWK_MLA_Response.2.b:0 "Nous dominons la mer"
 SWK_AB.1.t:0 "Agrandissement du Conseil Negri"
 SWK_AB.1.d:0 "le Conseil Negri du Sarawak a récemment adopté des réformes majeures, notamment un élargissement de sa composition afin d'assurer une représentation plus juste de toutes les races et groupes religieux au sein de l'État. Créé à l'origine sous le nom de Conseil général en 1867 sous le Raj de Sarawak, puis devenu le Conseil Negri en 1903, cet organe s'est désormais développé pour inclure 24 membres élus non officiels, 14 membres d'office, quatre membres nommés et trois membres permanents, assurant une représentation équilibrée entre les différentes communautés. Cette expansion fait partie de réformes plus larges qui permettent également la formation de partis et d'organisations politiques, ouvrant la voie à une plus grande participation politique et au développement d'une société plus démocratique au Sarawak." 
 SWK_AB.1.a:0 "Tous auront des voix égales"
 SWK_AB.2.t:0 "L'agrandissement de l'Astana"
 SWK_AB.2.d:0 "Le palais Astana Negeri à Kuching, Sarawak a récemment subi une expansion importante commandée par le Conseil Negri et White Rajah, marquée par l'ajout d'un nouveau bâtiment parlementaire de quatre étages situé derrière l'actuelle Astana. Conçue par le célèbre architecte malais T. Y. Lee, cette structure moderniste allie de manière unique des éléments architecturaux traditionnels du Sarawak et de la Malaisie avec des blocs épurés et symboliques inspirés des conceptions de Le Corbusier. La conception est non seulement fonctionnelle mais aussi profondément symbolique : vu de loin, le bâtiment ressemble à un calao montant, l'oiseau de l'État du Sarawak, symbolisant les aspirations de l'État. Ce nouvel ajout souligne l'engagement du Sarawak en faveur d'une gouvernance moderne tout en honorant son riche patrimoine culturel."
 SWK_AB.2.a:0 "Le peuple méritait plus"
 SWK_Rahman.1.t:0 "La formation de l'Union de la Malaisie orientale"
 SWK_Rahman.1.d:0 "Notre gouvernement du Sarawak a officiellement déclaré la création de l'Union malaise orientale, une fédération pan-malaise calquée sur les aspirations de Tunku Abdul Rahman et les principes du Ketuanan Melayu (suprématie malaise) de l'UMNO. Cette nouvelle union, visant à consolider l'identité malaise de la région, intégrera bientôt dans son giron le Dominion du Nord-Bornéo et le Sultanat de Brunei.\nSelon ce modèle, l'Union malaise orientale cherche à établir un gouvernement unifié qui met l'accent sur la culture, l'identité et le leadership malais, comme l'a inspiré l'ancienne Union malaise avant la prise de contrôle du continent par les communistes. L'union renforcera non seulement la défense de Bornéo, mais garantira également que la région maintienne un cadre sociopolitique dominé par les Malais. La nouvelle fédération est considérée comme essentielle dans la lutte contre l'influence communiste sur le continent et dans la restauration de l'unité malaise sous une direction forte et centralisée."
 SWK_Rahman.1.a:0 "Ketuanan Melayu !"
 SWK_USB.1.t:0 "Le Sarawak déclare les États-Unis de Bornéo"
 SWK_USB.1.d:0 "Dans le cadre d'un développement géopolitique important, le Sarawak a déclaré la formation des États-Unis de Bornéo, une nouvelle fédération pan-malaise et un nouveau bloc de défense visant à contrer de nouvelles incursions communistes depuis le continent malais sous la direction du Parti communiste malais et de Chin Peng. La fédération nouvellement créée incorporera les territoires de Pulau Kokos, Pulau Krismas, Brunei, Sarawak et Nord de Bornéo dans un système d'État calqué sur celui des États-Unis. Ce nouveau pays, soutenu par les alliés locaux et internationaux du Commonwealth, est considéré comme une mesure cruciale pour préserver la stabilité et résister à la propagation du communisme en Asie du Sud-Est. La création des États-Unis de Bornéo marque un nouveau chapitre dans l'histoire de la région, mettant l'accent sur l'unité et la défense collective face aux menaces extérieures croissantes."
 SWK_USB.1.a:0 "Pour la sécurité et la paix"
 SWK_USB.2.t:0 "L'Union Démocratique du Peuple de Malaisie dénonce la formation des États-Unis de Bornéo"
 SWK_USB.2.d:0 "L'Union démocratique populaire de Malaisie, dirigée par le président Chin Peng et le Parti communiste malais, a fermement dénoncé la récente formation des États-Unis de Bornéo. Dans une déclaration cinglante, ils ont condamné la nouvelle fédération comme une tentative impérialiste désespérée de créer un État colonial artificiel et non durable. Le Parti communiste malais a affirmé que cette alliance forcée de territoires sous influence étrangère était vouée à l'échec, prédisant son effondrement éventuel à mesure que la population rejetterait ce dernier acte de manipulation coloniale."
 SWK_USB.2.a:0 "Soyez assurés que le Parti et le Président libéreront bientôt ce maudit pays réactionnaire"
 SWK_USB.3.t:0 "[GetNewspaperHeader] Le Sarawak déclare les États-Unis de Bornéo"
 SWK_USB.3.d:0 "Dans le cadre d'un développement géopolitique important, le Sarawak a déclaré la formation des États-Unis de Bornéo, une nouvelle fédération pan-malaise et un nouveau bloc de défense visant à contrer de nouvelles incursions communistes depuis le continent malais sous la direction du Parti communiste malais et de Chin Peng. La fédération nouvellement créée incorporera les territoires de Pulau Kokos, Pulau Krismas, Brunei, Sarawak et Bornéo du Nord dans un système d'État calqué sur celui des États-Unis. Ce nouveau pays, soutenu par les alliés locaux et internationaux du Commonwealth, est considéré comme une mesure cruciale pour préserver la stabilité et résister à la propagation du communisme en Asie du Sud-Est. La création des États-Unis de Bornéo marque un nouveau chapitre dans l'histoire de la région, mettant l'accent sur l'unité et la défense collective face aux menaces extérieures croissantes."
 SWK_USB.3.a:0 "Pour la sécurité et la paix"
 SWK_USB.3.b:0 "Super! Un autre complot impérialiste"
 SWK_USB.3.c:0 "Super! Un autre complot impérialiste"
 SWK_USB.3.e:0 "Super! Un autre complot impérialiste"
 SWK_USB.4.t:0 "À la déclaration d'État des États-Unis de Bornéo"
 SWK_USB.4.d:0 "Récemment, une délégation de Kuching, USB, a officiellement demandé à notre gouvernement et à notre leader de se joindre aux États-Unis de Bornéo nouvellement formés et à l'annexion totale de leurs territoires à la Fédération en échange d'une autonomie et d'une protection totales dans les mêmes veines du système étatique aux États-Unis qu'ils l'ont dit « Ensemble indivisible, séparé divisible » pour lutter contre l'invasion prochaine et la propagation du communisme du nouvel État défaillant de Chin Peng."
 SWK_USB.4.a:0 "Nous dirons oui"
 SWK_USB.4.b:0 "JAMAIS"
 SWK_USB.5.t:0 "Le Nord de Bornéo a accepté la Déclaration d'État des États-Unis de Bornéo"
 SWK_USB.5.d:0 "Le Nord de Bornéo a officiellement reconnu les États-Unis de Bornéo nouvellement formés et a accepté l'annexion totale de leurs territoires à la Fédération. L'Australie, le Royaume-Uni et la Nouvelle-Zélande ont tous salué la déclaration de création d'État, exprimant leur soutien à la fédération en tant que force stabilisatrice dans la région. Ces nations ont souligné l'importance stratégique des États-Unis de Bornéo dans le maintien de la sécurité et la lutte contre l'influence communiste en Asie du Sud-Est."
 SWK_USB.5.a:0 "Ensemble indivisible, séparé divisible !"
 SWK_USB.6.t:0 "Le Nord de Bornéo a rejeté la déclaration d'État des États-Unis de Bornéo"
 SWK_USB.6.d:0 "Le Nord de Bornéo a officiellement rejeté les États-Unis de Bornéo nouvellement formés et n'a pas accepté l'annexion totale de leurs territoires à la Fédération, citant que leur culture et leur souveraineté sont plus importantes qu'un État artificiel construit par des puissances étrangères."
 SWK_USB.6.a:0 "Bon sang"
 SWK_USB.7.t:0 "à la Déclaration d'État des États-Unis de Bornéo"
 SWK_USB.7.d:0 "Récemment, une délégation de Kuching, USB, a officiellement demandé à notre gouvernement et à notre leader de se joindre aux États-Unis de Bornéo nouvellement formés et à l'annexion totale de leurs territoires à la Fédération en échange d'une autonomie et d'une protection totales dans les mêmes veines du système étatique aux États-Unis qu'ils l'ont dit « Ensemble indivisible, séparé divisible » pour lutter contre l'invasion prochaine et la propagation du communisme du nouvel État défaillant de Chin Peng."
 SWK_USB.7.a:0 "Nous dirons oui"
 SWK_USB.7.b:0 "JAMAIS"
 SWK_USB.8.t:0 "Brunei a accepté la déclaration d'État des États-Unis de Bornéo"
 SWK_USB.8.d:0 "Brunei a officiellement reconnu les États-Unis de Bornéo nouvellement formés et a accepté l'annexion totale de leurs territoires à la Fédération. L'Australie, le Royaume-Uni et la Nouvelle-Zélande ont tous salué la déclaration de création d'État, exprimant leur soutien à la fédération en tant que force stabilisatrice dans la région. Ces nations ont souligné l'importance stratégique des États-Unis de Bornéo dans le maintien de la sécurité et la lutte contre l'influence communiste en Asie du Sud-Est."
 SWK_USB.8.a:0 "Ensemble indivisible, séparé divisible !"
 SWK_USB.9.t:0 "Brunei a rejeté la déclaration d'État des États-Unis de Bornéo"
 SWK_USB.9.d:0 "Brunei a officiellement rejeté les États-Unis de Bornéo nouvellement formés et n'a pas accepté l'annexion totale de leurs territoires à la Fédération, citant que leur culture et leur souveraineté sont plus importantes qu'un État artificiel construit par des puissances étrangères."
 SWK_USB.9.a:0 "Bon sang"
 SWK_USB.10.t:0 "À la déclaration d'État des États-Unis de Bornéo"
 SWK_USB.10.d:0 "Récemment, une délégation de Kuching, USB, a officiellement demandé à notre gouvernement et à notre leader de se joindre aux États-Unis de Bornéo nouvellement formés et à l'annexion totale de leurs territoires à la Fédération en échange d'une autonomie et d'une protection totales dans les mêmes veines du système étatique aux États-Unis qu'ils l'ont dit « Ensemble indivisible, séparé divisible » pour lutter contre l'invasion prochaine et la propagation du communisme du nouvel État défaillant de Chin Peng."
 SWK_USB.10.a:0 "Nous dirons oui"
 SWK_USB.10.b:0 "JAMAIS"
 SWK_USB.11.t:0 "Le gouvernement malais en exil a accepté la proposition d'intégration du Sarawak"
 SWK_USB.11.d:0 "Le gouvernement malais en exil, dirigé par Tunku Abdul Rahman, a officiellement répondu à la proposition du gouvernement d'intégration complète dans une fédération pan-malaise. Dans sa réponse, le gouvernement en exil a exprimé un optimisme prudent quant à cette perspective, reconnaissant la force et l'unité potentielles qu'une telle intégration pourrait apporter dans la lutte contre le continent sous contrôle communiste sous Chin Peng et a déclaré qu'il approuvait et acceptait l'annexion pour le bien de toute l'humanité malaise et de notre avenir. Notre gouvernement a accueilli favorablement le dialogue, le considérant comme une étape positive vers la création d'un front uni contre l'expansion communiste dans la région."
 SWK_USB.11.a:0 "Ensemble pour tous les types de Malaisie"
 SWK_USB.12.t:0 "Le gouvernement malais en exil rejette la proposition d'intégration du Sarawak"
 SWK_USB.12.d:0 "Le gouvernement malais en exil, dirigé par Tunku Abdul Rahman, a formellement rejeté la proposition du Sarawak d'une intégration complète dans une fédération pan-malaise. Dans sa réponse, le gouvernement en exil a évoqué des désaccords et des différences importants dans le style de gouvernance, les pratiques religieuses, les valeurs culturelles, la représentation et la structure envisagée pour la fédération proposée. Tout en reconnaissant l'objectif commun de résister au contrôle communiste sous Chin Peng, ils ont exprimé que les différences actuelles sont trop vastes pour être réconciliées à l'heure actuelle. Le gouvernement du Sarawak, bien que déçu, a exprimé l'espoir que les deux entités puissent continuer à coopérer à d'autres niveaux contre la menace commune."
 SWK_USB.12.a:0 "Nous le respectons."
 SWK_BRU.1.t:0 "L'affaire Gerald MacBryan"
 SWK_BRU.1.d.a:0 "Récemment, à la suite de la mort du sultan Ahmad Tajuddin de Brunei, un épisode controversé a été considéré par le Raj du Sarawak à la fois comme une opportunité et comme un avertissement. Gerald MacBryan, un aventurier britannique qui était l'ancien secrétaire de notre Rajah et qui prétend maintenant être le conseiller politique du défunt sultan de Brunei, a contesté la succession du sultan Omar Ali Saifuddien III, soutenue par les Britanniques, affirmant que la princesse Nor Ehsani avait des droits légitimes au trône, semblables aux traditions monarchiques britanniques. MacBryan a en outre accusé la Grande-Bretagne d'exploiter les champs pétrolifères de Brunei et a recherché des réformes constitutionnelles et cherché à épouser Ehsani pour garantir son accès au trône de Brunei, faisant écho aux frustrations régionales concernant les politiques coloniales. Les responsables diplomatiques de notre Raj, bien qu'officiellement neutres, ont vu le potentiel d'exploiter subtilement ces affirmations pour mettre en évidence la portée excessive des Britanniques et affirmer la position du Sarawak en tant que modèle de puissance régionale et pour lutter contre d'éventuelles infiltrations communistes sur le continent. Cependant, les accusations de MacBryan furent finalement discréditées par l'intervention britannique menée par Malcolm MacDonald, renforçant ainsi le pouvoir de Saifuddien. Pour notre Raj, l'affaire a mis en évidence à la fois les opportunités et les risques des manoeuvres régionales sous surveillance coloniale, renforçant son engagement à favoriser l'autonomie et le partage équitable des ressources à Bornéo tout en naviguant prudemment dans ses relations avec la Grande-Bretagne."
 SWK_BRU.1.d.b:0 "Un épisode déroutant et inquiétant du point de vue de nos autorités britanniques. Après la mort du sultan Ahmad Tajuddin, la succession au trône de Brunei a été gérée sans problème avec le soutien britannique, établissant Omar Ali Saifuddien III comme nouveau sultan. Cependant, Gerald MacBryan, un soi-disant « conseiller politique » du défunt sultan, a cherché à exploiter la situation à des fins personnelles. Affirmant que la princesse Nor Ehsani avait des prétentions légitimes au trône, MacBryan a tenté de contester la légitimité du règne de Saifuddien. Ses tentatives de négocier avec Standard Oil et d'impliquer les États-Unis dans les affaires de Brunei ont révélé des motivations opportunistes plutôt qu'un véritable plaidoyer en faveur de réformes.\nLes responsables britanniques, dirigés par Malcolm MacDonald, ont rapidement discrédité les affirmations de MacBryan, le dénonçant comme un fraudeur. Ses accusations farfelues concernant le traité de Brunei de 1905-1906 et ses demandes de changements constitutionnels étaient considérées comme des tentatives visant à déstabiliser les intérêts britanniques dans la région. Le comportement de MacBryan, qualifié d'irrégulière et d'égoïste, a réaffirmé la nécessité pour le ministère des Colonies de maintenir sa vigilance à l'égard de ces opportunistes cherchant à saper la stabilité des protectorats britanniques. Même si ses projets ont finalement échoué, l'incident a mis en lumière la fragilité de la politique régionale et l'importance d'une action décisive pour préserver l'ordre et une gouvernance légitime."
 SWK_BRU.1.a:0 "Nous devrions le prendre plus au sérieux"
 SWK_BRU.1.b:0 "C'est juste un fou...."
 SWK_BRU.2.t.a:0 "Soutenir la candidature de Gerald MacBryan au trône de Brunei"
 SWK_BRU.2.t.b:0 "Délibérer sur la revendication de Gerald MacBryan au trône de Brunei"
 SWK_BRU.2.d.a:0 "Dans une manoeuvre diplomatique surprenante, notre Dominion du Sarawak, sous notre Rajah blanc Vyner Brooke, a officiellement contacté les autorités britanniques pour plaider en faveur des prétentions de Gerald MacBryan au trône de Brunei. Citant le service antérieur de MacBryan en tant que secrétaire privé et sa loyauté connue envers l'administration du Rajah Blanc, les dirigeants du Sarawak ont présenté les arguments de MacBryan en tant que personnage stabilisateur capable de sauvegarder l'avenir du Brunei en accord avec les intérêts britanniques.\n\nLes responsables du Sarawak ont souligné les liens de MacBryan avec d'éminents dirigeants musulmans, notamment ses liens passés avec la monarchie saoudienne, comme preuve de sa capacité à gagner le soutien de la population musulmane de Brunei. Ils ont fait valoir que la direction de MacBryan pourrait servir de rempart contre l'infiltration communiste depuis la Malaisie continentale, en particulier à la lumière des tensions croissantes en Asie du Sud-Est. En outre, le Sarawak a souligné les avantages économiques d'un Brunei coopératif, soulignant que la sécurisation du commerce pétrolier de la région renforcerait la position stratégique du Sarawak et de la Grande-Bretagne dans la région.\n\nLa proposition a cependant été accueillie avec scepticisme dans les cercles britanniques, car la réputation opportuniste de MacBryan et ses affirmations douteuses soulevaient des inquiétudes quant à sa fiabilité à long terme. Malgré cela, le soutien de notre Rajah Blanc a placé la candidature de MacBryan sous un nouveau jour, mêlant ses ambitions à la stabilité régionale et aux intérêts impériaux britanniques. La réponse britannique est restée prudente, tiraillée entre les avantages potentiels d'un Brunei conciliant sous MacBryan et les risques liés au soutien d'un personnage controversé."
 SWK_BRU.2.d.b:0 "Les autorités coloniales britanniques de Londres et de Brunei ont été récemment confrontées à un dilemme inattendu concernant la prétention audacieuse de Gerald MacBryan au trône de Brunei. Les représentations du Dominion du Sarawak, sous Rajah Vyner Brooke, avaient défendu MacBryan comme un candidat viable, citant sa loyauté passée envers le Rajah blanc et son prétendu soutien au sein de la population musulmane de Brunei en raison de ses liens antérieurs avec l'Arabie saoudite. Le Sarawak a fait valoir qu'un Brunei dirigé par MacBryan pourrait constituer un allié précieux pour sauvegarder le commerce pétrolier de la région et contrer les menaces communistes venant de la Malaisie continentale.\n\nLe gouvernement britannique se trouve désormais confronté à deux options distinctes.\n\n1. Ignorer l'affirmation de MacBryan : cela maintiendrait la trajectoire actuelle de soutien à Omar Ali Saifuddien III, dont la succession a été ordonnée et soutenue par les traités et protocoles établis. Cependant, cette ligne de conduite risque d'aliéner le Sarawak, un allié britannique essentiel dans la région, et pourrait potentiellement enhardir les éléments anticoloniaux en signalant un manque de flexibilité britannique.\n\n2. Approuver le plan de MacBryan : Approuver MacBryan pourrait fournir une opportunité de garantir la loyauté du Brunei sous un personnage aligné sur les intérêts britanniques. Cependant, la réputation controversée de MacBryan et ses tendances opportunistes suscitent des inquiétudes quant à sa fiabilité et sa capacité à maintenir la stabilité au Brunei. L'approbation de son plan pourrait également provoquer des dissensions au sein des structures de pouvoir traditionnelles du Brunei et conduire à des troubles régionaux plus larges.\n\nLes responsables britanniques restent divisés sur la question, certains exhortant à la prudence et au respect des protocoles établis, tandis que d'autres voient MacBryan comme un atout stratégique potentiel au milieu de l'escalade des tensions de la guerre froide en Asie du Sud-Est, sur la question de savoir si les intérêts britanniques dans le pétrole et la stabilité régionale l'emportent sur les risques liés au soutien d'un chiffre aussi imprévisible."
 SWK_BRU.2.a:0 "On peut le mettre en laisse"
 SWK_BRU.2.b:0 "Le pétrole doit couler."
 SWK_BRU.2.c:0 "Approuvez le plan."
 SWK_BRU.3.t:0 "Félicitez Gerald MacBryan pour la régence de Brunei"
 SWK_BRU.3.d:0 "Notre Rajah blanc du Sarawak, Vyner Brooke, a publiquement félicité Gerald MacBryan pour son ascension réussie au poste de régent de Brunei. Dans une déclaration officielle, Rajah Brooke a salué le leadership et la vision de MacBryan, exprimant sa confiance dans sa capacité à guider Brunei vers une nouvelle ère de prospérité et de stabilité.\n\n« Nous célébrons cette occasion mémorable en témoignage des liens durables entre nos deux monarchies », a déclaré Brooke. \"Je suis convaincu que le leadership de Regent MacBryan favorisera la paix et la coopération à travers Bornéo, garantissant la prospérité partagée de nos peuples et la stabilité de notre région. Les liens entre Brunei et Sarawak n'ont jamais été aussi forts, et ensemble, nous pouvons relever les défis du monde moderne. \"\n\nLe message du Rajah réaffirme l'engagement du Sarawak à soutenir Brunei et ses dirigeants tout en renforçant les liens entre les deux nations dans un effort commun pour contrer l'instabilité régionale et promouvoir le développement mutuel."
 SWK_BRU.3.a:0 "Un toast pour notre vieil ami"
 SWK_BRU.4.t:0 "Gerald MacBryan déclare la régence au Brunei"
 SWK_BRU.4.d:0 "Gerald MacBryan, ancien secrétaire particulier du Rajah blanc du Sarawak, Vyner Brooke, a assumé avec succès le rôle de régent au Brunei. Se réclamant d'une longue lignée de rois saoudiens et exprimant son admiration pour T.E. Lawrence, MacBryan a annoncé son intention d'épouser la princesse Nor Ehsani, consolidant ainsi sa prétention au trône et affirmant sa vision de l'avenir de Brunei.\n\nMacBryan a proposé d'unifier les régions à majorité musulmane de Bornéo en un seul État-nation, dans le but d'assurer la stabilité et de contrer les menaces communistes. Si certains soutiennent ses ambitions, d'autres, notamment les traditionalistes de Brunei, remettent en question la légalité de sa régence et craignent les conséquences de sa vision radicale. Les observateurs attendent la réponse internationale à ce changement de leadership controversé."
 SWK_BRU.4.a:0 "Un autre TE Lawrence ?"