l_french:
#focuses
ADR_Sovietization_of_Austria:0 "Soviétisation de l'Autriche"
ADR_Sovietization_of_Austria_desc:0 "L'Autriche a été libérée du fascisme et du capitalisme. Afin de garantir que ces maux ne reviennent jamais, la nouvelle Autriche doit être façonnée à l'image de l'Union soviétique."
ADR_Found_the_ministry_of_culture:0 "Fondé le Ministère de la Culture"
ADR_Found_the_ministry_of_culture_desc:0 "Des compositions angéliques, un art à couper le souffle et une architecture époustouflante ne sont que quelques-unes des contributions que notre nation a apportées au monde de l'art. Le nouveau ministère de la Culture veillera à ce que l'Autriche continue d'être la puissance culturelle qu'elle a été pendant des siècles."
ADR_Embrace_Socialist_Realism:0 "Adoptez le réalisme socialiste"
ADR_Embrace_Socialist_Realism_desc:0 "Mozart et von Amerling seront bientôt rejoints par une nouvelle génération d'artistes, et leurs oeuvres représenteront le paradis socialiste pour lequel notre peuple travaille si dur !"
ADR_Promote_the_legacy_of_the_failed_1918_coup:0 "Promouvoir l'héritage du coup d'État de 1918"
ADR_Promote_the_legacy_of_the_failed_1918_coup_desc:0 "Le 12 novembre 1918 fut la première tentative du parti d'établir une république soviétique en Autriche. Même si le coup d'État n'a pas réussi, nous devons rendre hommage à ceux qui ont tout sacrifié pour cette cause."
ADR_Foster_ideals_of_strength_through_unity:0 "Favoriser les idéaux de force par l'unité"
ADR_Foster_ideals_of_strength_through_unity_desc:0 "La force du peuple vient de son unité. S'ils tombent dans l'individualisme et les ambitions égoïstes, le socialisme mourra. Nous veillerons à ce que cela ne se produise pas."
ADR_Enforce_strict_standards_on_the_arts:0 "Appliquer des normes strictes aux arts"
ADR_Enforce_strict_standards_on_the_arts_desc:0 "De nombreux jeunes artistes sont impatients d'avoir la chance de devenir un réaliste socialiste de renommée mondiale. Toutefois, seuls les meilleurs d'entre eux auront l'occasion de faire leurs preuves au ministère."
ADR_Pardon_Soviet_Crimes_in_Austria:0 "Pardon des crimes soviétiques en Autriche"
ADR_Pardon_Soviet_Crimes_in_Austria_desc:0 "Les crimes supposés commis par les libérateurs soviétiques ont été largement exagérés par les propagandistes occidentaux. En vérité, ils ne faisaient que rendre justice aux déplorables collaborateurs fascistes qui ont facilité la chute de l'Autriche vers le fascisme."
ADR_Rehabilitate_the_Rote_Garde:0 "Réhabiliter la Rote Garde"
ADR_Rehabilitate_the_Rote_Garde_desc:0 "La Rote Garde a été interdite par les fascistes en 1933. Nous réhabiliterons cette grande organisation pour qu'elle serve les besoins du Parti et de l'État." 
ADR_Intensify_Denazification:0 "Éliminer les collaborateurs fascistes restants"
ADR_Intensify_Denazification_desc:0 "La dénazification n'est pas allée assez loin ! Il reste encore trop d'apologistes, répandant leur poison parmi le peuple et ternissant notre réputation à l'étranger. Il faut s'en occuper."
ADR_Replace_the_Hitler_Youth_with_the_Pioneers:0 "Pionniers autrichiens"
ADR_Replace_the_Hitler_Youth_with_the_Pioneers_desc:0 "Le programme des Jeunesses hitlériennes des nazis a laissé de nombreux jeunes Autrichiens fanatiquement dévoués à Hitler et à ses idées tordues. Pour contrecarrer cela, nous créerons les Pionniers autrichiens, où nos enfants apprendront les valeurs du marxiste-léninisme."
ADR_Open_Holocaust_Museums:0 "Musées ouverts de l'Holocauste"
ADR_Open_Holocaust_Museums_desc:0 "L'Holocauste est la partie la plus honteuse de notre histoire, et les outils qui ont été utilisés pour mener à bien le travail odieux des nazis sont toujours debout. Mais plutôt que de les démolir, nous les transformerons en musées afin que les générations futures n'oublient jamais les conséquences du fascisme."
ADR_Publish_textbooks_on_Nazi_war_crimes:0 "Programme d'études antifasciste"
ADR_Publish_textbooks_on_Nazi_war_crimes_desc:0 "Les adultes autrichiens se souviennent des atrocités de l'Holocauste, mais qu'en est-il des enfants ? Nous ne pouvons pas permettre qu'un seul jeune esprit soit corrompu par le fascisme. C'est pourquoi nous veillerons à ce que chaque école du pays fasse de l'antifascisme un principe fondamental de l'éducation."
ADR_Place_the_remaining_blame_on_the_West_German_Government:0 "Accuser l'Allemagne de l'Ouest de dénazification insuffisante"
ADR_Place_the_remaining_blame_on_the_West_German_Government_desc:0 "Le fait que le gouvernement ouest-allemand ait mis fin prématurément à la dénazification en dit long sur son régime. Tout sauf une dénazification complète est une approbation d'Adolf Hitler et de tous ceux qui lui ressemblent !"
ADR_Found_the_Democratic_republic_of_Austria:0 "Fondation de la République démocratique autrichienne"
ADR_Found_the_Democratic_republic_of_Austria_desc:0 "L'administration militaire soviétique en Allemagne est officiellement devenue la République démocratique allemande. Nous suivrons leur exemple et établirons la République démocratique autrichienne !"
ADR_KPO_Uber_Alles:0 "KPO Uber Allés"
ADR_KPO_Uber_Alles_desc:0 "Il n'y a pas de plus grande source de bien que le Parti communiste autrichien. Ils ont reconstruit l'Autriche sur les cendres du fascisme et nous guideront vers un avenir prospère. Avec le temps, nous partagerons cette grandeur avec nos frères opprimés d'Occident !"
ADR_Inauguration_of_General_Secretary_Johann_Koplenig:0 "Secrétaire général Koplenig"
ADR_Inauguration_of_General_Secretary_Johann_Koplenig_desc:0 "Johann Koplenig a été élu premier secrétaire général. Il a la tâche monumentale de transformer une nation autrefois fasciste en un État ouvrier socialiste, de rétablir les relations diplomatiques et de reconstruire l'économie."
ADR_Denounce_the_division_of_Austria:0 "Dénoncez la division de l'Autriche"
ADR_Denounce_the_division_of_Austria_desc:0 "La division de l'Autriche entre l'Est et l'Ouest n'est que temporaire. Comme toutes les autres nations divisées après la guerre, nous cherchons à nous unifier avec notre autre moitié pour la libérer du capitalisme. L'Autriche sera unie !"
ADR_Fully_commit_to_the_international_workers_struggle:0 "S'engager dans la lutte ouvrière internationale"
ADR_Fully_commit_to_the_international_workers_struggle_desc:0 "Les travailleurs d'Autriche et du bloc de l'Est se sont libérés des chaînes de l'oppression capitaliste, mais il reste encore beaucoup à faire. La révolution ne se terminera que lorsque tous les travailleurs du monde vivront dans l'harmonie et la prospérité socialistes !"
ADR_European_Comrades:0 "Camarades européens"
ADR_European_Comrades_desc:0 "Afin d'assurer la poursuite de la coopération solidaire du bloc de l'Est, nous entamerons des pourparlers diplomatiques formels avec tous nos camarades socialistes d'Europe pour discuter des questions de commerce et d'assistance mutuelle."
ADR_Economic_cooperation_with_our_former_allies:0 "Améliorer les relations avec les anciens alliés"
ADR_Economic_cooperation_with_our_former_allies_desc:0 "La plupart de nos anciens alliés en Europe ont adopté le socialisme après la guerre, et pourtant, nous entretenons très peu de relations diplomatiques. Il faut y remédier immédiatement."
ADR_Pay_off_Soviet_War_reparations:0 "Rembourser les réparations de guerre soviétiques"
ADR_Pay_off_Soviet_War_reparations_desc:0 "Nous ne pouvons pas oublier la dette que nous devons aux Soviétiques pour nous avoir libérés du régime nazi. Nous ne pouvons pas non plus nier que l'ancien régime a fait preuve de complaisance et a même contribué à l'opération Barbarossa. Ils ont droit à des réparations et nous les paierons."
ADR_Asian_Comrades:0 "Camarades asiatiques"
ADR_Asian_Comrades_desc:0 "De la Mongolie jusqu'à la Malaisie, le socialisme prospère à l'Est. Ce sont nos camarades et nous établirons avec eux des relations formelles en toute hâte."
ADR_Recognize_North_Vietnam:0 "Reconnaître le Nord-Vietnam"
ADR_Recognize_North_Vietnam_desc:0 "Hô Chi Minh combat les colons européens depuis des décennies. Il est une figure d'inspiration pour tous les peuples opprimés du monde et mérite rien de moins que notre plein soutien !"
ADR_Establish_relations_with_Kim_and_Mao:0 "Établir des relations avec la Chine et la Corée"
ADR_Establish_relations_with_Kim_and_Mao_desc:0 "Les gouvernements légitimes de Chine et de Corée ont reçu peu de reconnaissance sur la scène internationale. Nous devons être aux côtés de nos camarades socialistes."
ADR_From_an_economic_partnership_with_our_old_subjects:0 "Créer le Volkswirtschaftspakt"
ADR_From_an_economic_partnership_with_our_old_subjects_desc:0 "L'objectif du Volkswirtschaftspakt est d'atteindre la puissance industrielle brute de l'Autriche-Hongrie d'avant la Première Guerre mondiale. Si nous travaillons en partenaires égaux avec les anciens sujets de l'Empire, celui-ci peut devenir une puissance économique !"
ADR_Begin_reconstruction:0 "Commencer la reconstruction"
ADR_Begin_reconstruction_desc:0 "Après la guerre, une grande partie du pays est en ruine. Il nous faudra beaucoup de temps pour nous rétablir, mais lorsque les travaux seront terminés, l'Autriche renaîtra !"
ADR_Beg_the_Soviets_to_return_stolen_industry:0 "Racheter l'industrie soviétique"
ADR_Beg_the_Soviets_to_return_stolen_industry_desc:0 "Une grande partie de l'industrie autrichienne a été confisquée par les Soviétiques dans leur audacieuse avancée vers l'ouest. Une fois la guerre terminée, nous proposerons de le racheter pour aider à la reconstruction de notre nation."
ADR_Request_East_German_Industrial_Aid:0 "Demander une aide industrielle est-allemande"
ADR_Request_East_German_Industrial_Aid_desc:0 "L'Allemagne a toujours été une puissance industrielle et continue de l'être même après avoir perdu deux guerres mondiales. Qui mieux que de demander de l'aide pour notre reconstruction ?"
ADR_Fully_commit_to_collectivization:0 "Commencer la collectivisation"
ADR_Fully_commit_to_collectivization_desc:0 "La collectivisation des terres fait partie intégrante du processus socialiste. Il n'y aura aucune exception."
ADR_Import_grain_to_stop_food_riots:0 "Importez des céréales pour arrêter les émeutes alimentaires"
ADR_Import_grain_to_stop_food_riots_desc:0 "La plupart de nos terres agricoles ont été lourdement endommagées pendant la guerre et nos récoltes ne se sont pas complètement rétablies. Malheureusement, cela a conduit à une grave pénurie alimentaire et les troubles s'intensifient. Nous devrons pour l'instant compter sur l'aide de nos voisins socialistes."
ADR_Modernize_machine_tooling:0 "Moderniser les machines-outils"
ADR_Modernize_machine_tooling_desc:0 "À mesure que notre secteur industriel se redresse, il devient évident que nos outils sont terriblement dépassés. À quoi bon s'emparer des moyens de production s'ils ne peuvent rien produire ?"
ADR_Housing_expansion_in_Vienna:0 "Agrandissement du logement à Vienne"
ADR_Housing_expansion_in_Vienna_desc:0 "Malheureusement, la plupart des quartiers urbanisés de Vienne se trouvent dans la moitié ouest de la ville... Sous contrôle capitaliste. Il va falloir construire de nouveaux logements de notre côté.!"
ADR_Jumpstart_heavy_industry_in_Burgen-land:0 "Relancer l'industrie lourde dans le Burgenland"
ADR_Jumpstart_heavy_industry_in_Burgen-land_desc:0 "Sans surprise, l'Occident s'est approprié toutes les terres développées et industrialisées et nous a laissé des terres agricoles pour la plupart vides. Nous devrons en réserver une partie au développement industriel, sinon l'Autriche occidentale nous laissera dans la poussière."
ADR_Launch_show_trials:0 "Essais de lancement du spectacle"
ADR_Launch_show_trials_desc:0 "Même si la nation a été débarrassée en grande partie, sinon entièrement, de l'influence fasciste, il reste encore quelques ennemis au sein de notre nation et de notre gouvernement. La première étape pour reprendre le contrôle de ces traîtres sera de lancer des procès au cours desquels ils seront poursuivis pour leur comportement anti-révolutionnaire."
ADR_Kill_Heinrich_Gross:0 "Tuer Heinrich Gross"
ADR_Kill_Heinrich_Gross_desc:0 "Heinrich Gross est un psychiatre, médecin et neurologue autrichien qui, pendant la Seconde Guerre mondiale, a été accusé et prouvé d'avoir tué au moins 9 enfants par différentes méthodes. Des enfants qui étaient considérés comme impurs par le régime nazi. Pour enfin venger les enfants innocents en exécutant ce monstre !"
ADR_Execute_Traitorous_Officers:0 "Exécuter les officiers traîtres"
ADR_Execute_Traitorous_Officers_desc:0 "Parmi nos rangs, il reste encore des officiers traîtres qui préféreraient que nous soyons gouvernés par l'Autriche occidentale ou qui ne sont tout simplement pas fidèles à notre cause en général. Nos fières forces socialistes ne peuvent pas confier quoi que ce soit à ces traîtres ! Ils seront purgés par des suspensions, des retraites ou des pelotons d'exécution !"
ADR_Obtain_confessions_from_disloyal_Intelligentsia:0 "Obtenez des aveux d'une intelligentsia déloyale"
ADR_Obtain_confessions_from_disloyal_Intelligentsia_desc:0 "Depuis un certain temps déjà, nos loyaux agents de la Stasi autrichienne interrogent les agents déloyaux. Et maintenant, après avoir finalement brisé leur moral, nous avons obtenu des aveux sur leur comportement antisocialiste et celui d'autres personnes. Avec ces Confessions, nous aurons des preuves solides pour y faire face."
ADR_Return_White_Army_soldiers_in_exile_to_the_Soviet_Union:0 "Renvoyez les soldats de l'Armée blanche en Union soviétique"
ADR_Return_White_Army_soldiers_in_exile_to_the_Soviet_Union_desc:0 "Après la victoire des bolcheviks dans la guerre civile russe, un groupe de soldats de l'armée blanche décidèrent de s'installer en Autriche. Il ne reste plus beaucoup d'entre eux puisque beaucoup ont soit déménagé, soit sont morts de vieillesse. Mais il reste un petit nombre de ceux qui sont encore dans le pays. La nation étant socialiste tout comme l'Union soviétique, il est tout à fait logique que nous renvoyions ces soldats de l'Armée blanche dans la patrie."
ADR_Delegitimize_the_Reunification_Faction:0 "Délégitimer la faction de la réunification"
ADR_Delegitimize_the_Reunification_Faction_desc:0 "Dans la Nation, il existe une faction qui tente de convaincre notre population de soutenir la réunification avec l'Occident. En général, il n'y a rien de mal à cela, car nous aimerions également nous réunifier avec l'Occident !... Mais seulement si cela signifiait que la nation resterait socialiste, ce que cette faction ignore, voulant l'unification à tout prix. Elle reste pour l'instant assez petite, mais on ne peut pas risquer qu'elle grandisse. Des efforts seront faits pour délégitimer cette faction et convaincre les travailleurs de ne pas les rejoindre."
ADR_Declare_Lothar_Rendulic_Innocent_to_appear_objective:0 "Déclarer Lothar Rendulic innocent pour apparaître objectif"
ADR_Declare_Lothar_Rendulic_Innocent_to_appear_objective_desc:0 "Lother Rendulic était Oberst dans les forces armées autrichiennes dans les années 1920. Pendant un certain temps, il fut inscrit sur la liste temporaire d'invalidation en raison de son implication dans le parti nazi interdit. Après la guerre, il fut accusé de tactique de la Terre brûlée et d'avoir tué des otages en Yougoslavie. Pour paraître objectif au reste du monde, nous le déclarerons innocent. La dernière chose dont la nation en général a besoin, c'est qu'un autre Autrichien soit accusé des crimes de guerre nazis..."
ADR_Form_the_Austrian_STASI:0 "Former la Stasi autrichienne"
ADR_Form_the_Austrian_STASI_desc:0 "Le ministère de la Sécurité d'État a joué un rôle déterminant dans le maintien de la stabilité dans l'ensemble de la République démocratique allemande. Nous avons besoin de quelque chose comme ça ici."
ADR_Begin_wiretapping:0 "Commencer les écoutes téléphoniques"
ADR_Begin_wiretapping_desc:0 "Les seules personnes qui ont quelque chose à cacher sont les sympathisants fascistes ou les agents occidentaux. Les écoutes téléphoniques nous aideront à attraper les deux."
ADR_Create_a_national_Database_of_untrustworthy_people:0 "Créer une base de données nationale des personnes peu fiables"
ADR_Create_a_national_Database_of_untrustworthy_people_desc:0 "Grâce aux progrès de la technologie informatique, l'idée d'une base de données dans laquelle les dissidents, les traîtres et les agents étrangers présumés peuvent tous être enregistrés et suivis est devenue une réalité."
ADR_Infiltrate_Cooperatives:0 "Infiltrer les coopératives"
ADR_Infiltrate_Cooperatives_desc:0 "Nous ne devons pas nous permettre de faire preuve de complaisance, un espion talentueux peut tout surmonter. Par conséquent, nous aurons nos propres agents infiltrés dans chaque partie de l'appareil d'État."
ADR_Make_Dissidents_disappear:0 "Faire disparaître les dissidents"
ADR_Make_Dissidents_disappear_desc:0 "Il y a des traîtres parmi nous, mais il n'y a pas lieu de s'inquiéter. La Stasi n'est rien sinon... Discrète."
ADR_Develop_special_interrogation_tactics:0 "Développer des tactiques d'interrogatoire spéciales"
ADR_Develop_special_interrogation_tactics_desc:0 "§RNous avons des moyens de vous faire parler...§"
ADR_Exchange_data_with_our_German_comrades:0 "Échangez des données avec nos camarades allemands"
ADR_Exchange_data_with_our_German_comrades_desc:0 "Notre agence de renseignement s'inspire de la Stasi allemande, et pour cause. Avec la collaboration des deux agences, la trahison et la dissidence appartiendront au passé."
ADR_Begin_the_first_5-year_plan:0 "Commencer le premier plan quinquennal"
ADR_Begin_the_first_5-year_plan_desc:0 "Élément essentiel de la planification industrielle socialiste, les plans quinquennaux nous aideront à développer et à moderniser notre capacité industrielle."
ADR_The_Austrian_Red_Army:0 "L'Armée rouge autrichienne"
ADR_The_Austrian_Red_Army_desc:0 "L'armée autrichienne, ou ce qu'il en reste, a hérité des derniers soldats qui ont survécu à la Seconde Guerre mondiale et ont rejoint notre régime. Ce sont les combattants les plus endurcis que l'on puisse avoir, mais ils devront encore être recyclés et modernisés s'ils veulent servir le nouvel État."
ADR_The_Austrian_Red_Airforce:0 "L'armée de l'air rouge autrichienne"
ADR_The_Austrian_Red_Airforce_desc:0 "Nous avons une force aérienne sans avions, c'est comme avoir une marine sans côtes. Il va falloir repartir de zéro."
ADR_Purchase_Soviet_Yaks:0 "Acheter des Yaks Soviétiques"
ADR_Purchase_Soviet_Yaks_desc:0 "Les combattants Yak soviétiques sont assez puissants. Les Soviétiques les mettent hors service pour libérer de l'espace pour des modèles plus récents, alors peut-être seront-ils disposés à nous en vendre quelques-uns."
ADR_Expand_the_Air_Defense_Capabilities:0 "Demander des Migs soviétiques"
ADR_Expand_the_Air_Defense_Capabilities_desc:0 "Le MiG-15 soviétique est une pièce d'ingénierie étonnante, il peut servir de chasseur mais aussi d'appui aérien rapproché. Nous pourrions peut-être persuader les Soviétiques de nous en envoyer quelques-uns."
ADR_Construct_Airstrips_in_Ost-Wien:0 "Construire des pistes d'atterrissage à Ost-Wien"
ADR_Construct_Airstrips_in_Ost-Wien_desc:0 "L'armée de l'air dispose désormais d'avions, mais pas de bases aériennes. Peu importe, nous en construirons simplement !"
ADR_Begin_development_on_our_own_Fighters:0 "Commencer la production de chasseurs nationaux"
ADR_Begin_development_on_our_own_Fighters_desc:0 "La Red Air Force est enfin prête à régner sur le ciel ! Cela étant dit, nous ne pouvons pas compter éternellement sur les achats d'armes soviétiques. Ce serait mieux si nous commencions à produire nos propres chasseurs."
ADR_The_Austrian_Red_Army_Ground_Force:0 "La force terrestre de l'Armée rouge autrichienne"
ADR_The_Austrian_Red_Army_Ground_Force_desc:0 "Ce sont les forces terrestres autrichiennes qui tiennent l'Occident à distance. Composés d'anciens combattants et de bénévoles, ils protègent nos frontières et veillent à ce que personne ne tente d'entrer ou de s'échapper illégalement."
ADR_Utilize_captured_German_equipment:0 "Utiliser l'équipement allemand capturé"
ADR_Utilize_captured_German_equipment_desc:0 "Vers la fin de la Seconde Guerre mondiale, les nazis en fuite ont laissé derrière eux des caches de matériel à l'approche des forces alliées et soviétiques. Étonnamment, cet équipement est toujours en état de marche, ce serait un gaspillage de le jeter."
ADR_Import_Soviet_Armor:0 "Importer une armure soviétique"
ADR_Import_Soviet_Armor_desc:0 "L'armure soviétique est la meilleure au monde. Avec eux à nos côtés, l'Armée rouge autrichienne sera imparable !"
ADR_Reinvigorate_gun_manufacturing_and_research:0 "Revigorer la fabrication et la recherche d'armes à feu"
ADR_Reinvigorate_gun_manufacturing_and_research_desc:0 "Une armée sans armes n'est rien d'autre qu'une légion glorifiée de scouts. Si nous voulons gagner la bataille contre l'Autriche occidentale, nous aurons besoin d'armes appropriées."
ADR_The_First_line_of_Defense:0 "La première ligne de défense"
ADR_The_First_line_of_Defense_desc:0 "Tout comme la RDA, nous sommes en première ligne contre l'Occident. Nous sommes la première ligne de défense ! Si l'Occident tente d'envahir le bloc de l'Est, nous serons les premiers à nous battre !"
ADR_The_Austrian_Air_Defence_Force:0 "La Force de défense aérienne autrichienne"
ADR_The_Austrian_Air_Defence_Force_desc:0 "Sans marine, nous pouvons mettre de côté des fonds pour une autre force aérienne, dédiée à protéger notre ciel de l'ennemi !"
ADR_Buy_portable_anti-aircraft_equipment:0 "Acheter de l'équipement anti-aérien portable"
ADR_Buy_portable_anti-aircraft_equipment_desc:0 "Les batteries anti-aériennes stationnaires sont une bonne chose, mais nous devrions quand même stocker leurs homologues portables pour les utiliser sur le champ de bataille."
ADR_Construct_long_range_RADAR_on_the_west_Austrian_border:0 "Construire un RADAR à la frontière ouest de l'Autriche"
ADR_Construct_long_range_RADAR_on_the_west_Austrian_border_desc:0 "Le radar est une merveilleuse technologie. Avoir plusieurs stations le long de la frontière avec l'Autriche occidentale nous donnera une alerte précoce en cas de lancement d'une attaque."
ADR_Build_Blast_shelters_in_urban_areas:0 "Construire des abris anti-souffle dans les zones urbaines"
ADR_Build_Blast_shelters_in_urban_areas_desc:0 "Si nos pires craintes se réalisent et que les bombes tombent, nous devons être prêts à sauver autant de notre population que possible. Des abris de défense doivent être construits dans chaque ville du pays."
ADR_Begin_Development_on_short_range_SAM_systems:0 "Commencer le développement sur les systèmes SAM"
ADR_Begin_Development_on_short_range_SAM_systems_desc:0 "La technologie des fusées est relativement nouvelle, mais elle est incroyablement prometteuse. Nous devrions nous concentrer sur le développement d'un système avancé de missiles de défense aérienne pour contribuer à protéger notre ciel."
ADR_Establish_the_ministry_of_worker_wellbeing:0 "Créer le ministère du Bien-être des travailleurs"
ADR_Establish_the_ministry_of_worker_wellbeing_desc:0 "Même si cela ressemble à quelque chose du Livre de 1984, ce n'est rien de tel ! La tâche du ministère est d'écouter les souhaits des travailleurs et des syndicats et de s'assurer que les travailleurs sont en sécurité et traités équitablement."
ADR_Begin_Mass_production_of_Trabants:0 "Commencer la production de masse de la Trabant"
ADR_Begin_Mass_production_of_Trabants_desc:0 "La Trabant est une belle voiture. Et c'est robuste aussi. Développée en Allemagne de l'Est, il n'a pas fallu longtemps pour que la voiture devienne une sorte de culte. Même certains de nos propres ouvriers ont réussi à se procurer une Trabant d'Allemagne de l'Est, mais c'est un spectacle rare. Mais cela peut être changé ! On demandera au gouvernement est-allemand s'il serait prêt à nous accorder une licence pour la Trabant, nous permettant ainsi de construire nos propres Trabant !"
ADR_Secure_additional_funds_from_Moscow:0 "Améliorer les méthodes de distribution de l'approvisionnement dans les zones rurales"
ADR_Secure_additional_funds_from_Moscow_desc:0 "Les routes d'approvisionnement qui desservent les zones rurales de notre pays ont cruellement besoin d'une refonte. Si nous ne résolvons pas ce problème, la population sera contrainte de continuer à vivre avec des rations alimentaires très sévères."
ADR_Increase_production_of_hygiene_products:0 "Augmenter la production de produits d'hygiène"
ADR_Increase_production_of_hygiene_products_desc:0 "Après une dure journée de travail, rien de mieux qu'une bonne douche. Sauf que... Nous n'avons rien pour nous doucher. Il faut augmenter la production de produits d'hygiène, car un corps en mauvaise santé est un corps improductif. "
ADR_Provide_cooking_equipment_to_shorten_breadlines:0 "Fournir du matériel de cuisson pour raccourcir les files d'attente"
ADR_Provide_cooking_equipment_to_shorten_breadlines_desc:0 "Même si nous avons fait des efforts pour mettre fin à la pénurie alimentaire, cela ne suffit pas encore. La prochaine étape de nos efforts consiste à fournir du matériel de cuisson aux cuisiniers de Breadline, ce qui, espérons-le, permettra de préparer plus de pain plus rapidement pour les travailleurs affamés"
ADR_Open_toy_factories_in_northern_Austria:0 "Le Kinderpanzer"
ADR_Open_toy_factories_in_northern_Austria_desc:0 "Quelle meilleure façon de gagner l'amour d'un enfant que de lui offrir un tank ? Voilà en gros comment résumer la proposition qui a été faite aujourd'hui au gouvernement. Il a été proposé d'ouvrir des usines de jouets qui produiraient entre autres choses le désormais surnommé Kinderpanzer. Bien sûr, ce ne serait pas un véritable tank, mais il serait suffisamment grand pour permettre aux enfants de s'asseoir à l'intérieur. Un superbe jouet et un excellent moyen d'inspirer les futurs tankistes !"
ADR_Sell_consumer_goods_to_the_eastern_bloc:0 "Vendre des biens de consommation au bloc de l'Est"
ADR_Sell_consumer_goods_to_the_eastern_bloc_desc:0 "Une excellente façon de soutenir notre économie et de montrer au reste du bloc de l'Est à quel point les produits est-autrichiens sont merveilleux. Nos produits seront désormais exportés dans tout le bloc de l'Est. De Prague à Berlin, en passant par Varsovie, Sofia et au-delà !"
ADR_Boost_heavy_industry:0 "Dynamiser l'industrie lourde"
ADR_Boost_heavy_industry_desc:0 "Une autre étape pour faire croître l'économie autrichienne consiste à ouvrir davantage d'industries lourdes qui produiront des armes et des véhicules motorisés les plus fiables et les plus fiables, peut-être même des avions pour les forces armées. Et le matériel qui reste pourra toujours être vendu au reste du bloc de l'Est !"
ADR_Begin_infrastructure_efforts:0 "Construire le réseau ferroviaire Plieseis"
ADR_Begin_infrastructure_efforts_desc:0 "Le réseau ferroviaire de Plieseis fera entrer l'infrastructure désuète de l'Autriche dans l'ère moderne, reliant tous les coins du pays. Avec le temps, il s'étendra du Burgenland au Vorarlberg."
ADR_Adopt_the_khrushchyovka:0 "Adoptez la Khrouchtchevka"
ADR_Adopt_the_khrushchyovka_desc:0 "Le Khrouchtchevka est un immeuble d'appartements construit à partir de panneaux préfabriqués assemblés, ce qui permet de les construire extrêmement rapidement. En l'adoptant, nous disposerons de suffisamment de maisons et pourrons étendre nos capacités de construction !"
ADR_Pave_every_road:0 "Imitez l'autoroute"
ADR_Pave_every_road_desc:0 "Même si cela nous fait mal de l'admettre, les projets d'infrastructures des nazis étaient merveilleux. Avec l'aide de la RDA, nous pourrons construire notre propre autoroute."
ADR_Build_munitions_plants_in_Vienna:0 "Construire des usines de munitions à Vienne"
ADR_Build_munitions_plants_in_Vienna_desc:0 "A quoi sert une arme sans balles ? Nous devons construire davantage d'usines de munitions pour que nos armées soient correctement approvisionnées."
ADR_Build_forts_along_the_West_Austrian_Border:0 "Construisez des forts le long de la frontière ouest de l'Autriche"
ADR_Build_forts_along_the_West_Austrian_Border_desc:0 "Si tout le reste échouait et que les forces occidentales pénétraient sur notre territoire, elles trouveraient un système de fortifications sophistiqué qui affaiblirait leurs armées."
ADR_Expand_existing_factories:0 "Construire l'usine automobile Karl Marx"
ADR_Expand_existing_factories_desc:0 "Notre premier plan quinquennal se terminera par la construction d'une usine automobile moderne dans le Burgenland. Nommée d'après le père du communisme lui-même, l'usine automobile Karl Marx fournira aux habitants de l'ADR les dernières avancées en matière de transport personnel."
ADR_Found_Unit_7_to_negate_chronic_manpower_shortages:0 "Trouvé l'unité 7 pour annuler les pénuries chroniques de main-d'oeuvre"
ADR_Found_Unit_7_to_negate_chronic_manpower_shortages_desc:0 "Malheureusement, tout comme en Allemagne de l'Est et en Union soviétique elle-même, nous souffrons d'une pénurie de main-d'oeuvre due au fait qu'un grand nombre de nos travailleurs et citoyens préfèrent fuir vers l'Ouest au lieu de donner une chance au socialisme. Pour lutter contre ce problème, l'unité 7 sera créée pour résoudre ce problème."
ADR_Research_Weaponized_computer_systems:0 "Recherche sur les systèmes informatiques armés"
ADR_Research_Weaponized_computer_systems_desc:0 "L'ordinateur, une toute nouvelle machine qui s'est lentement répandue, a également gagné de plus en plus de moyens d'être transformé en arme. Déjà, de grandes puissances telles que la Grande-Bretagne, les États-Unis, la RPC et l'URSS ont mené des recherches et adopté l'ordinateur. Nous ne sommes peut-être pas aussi grands que les exemples donnés, mais cela ne nous empêchera pas de lancer notre propre recherche sur les systèmes informatiques armés !"
ADR_An_Austrian_Kalashnikov:0 "Une Kalachnikov autrichienne"
ADR_An_Austrian_Kalashnikov_desc:0 "Les soldats soviétiques stationnés avec nos troupes aux frontières occidentales ont été vus portant quelque chose qui a attiré l'attention de nos généraux et de nos soldats. Une nouvelle arme qu'ils ont baptisée Kalachnikov. Après avoir mis la main sur quelques-uns de nos camarades soviétiques, nous étudierons leurs composants et produirons notre propre version. La Kalachnikov autrichienne."
ADR_Request_Soviet_missile_blueprints:0 "Créer des installations de recherche sur les missiles à courte portée"
ADR_Request_Soviet_missile_blueprints_desc:0 "Étant à la frontière avec l'Occident, l'idée est venue au sein du gouvernement et des forces armées de demander à l'Union soviétique des plans pour des missiles à courte portée. Avec ceux-ci, nous pourrions démarrer nos installations de recherche et un jour créer les nôtres et les diriger vers l'Ouest. Pour démontrer qu'ils seront écrasés s'ils osent nous attaquer !"
ADR_Begin_heavy_artillery_production:0 "Mener des exercices militaires approfondis"
ADR_Begin_heavy_artillery_production_desc:0 "Nos forces armées, qui n'existent que depuis quelques années, se professionnalisent peu à peu. Ils sont en train de devenir une force avec laquelle il faut compter. Pour les aider à s'améliorer, nous organiserons des exercices militaires approfondis."
ADR_20th_congress_of_the_CPSU:0 "20e Congrès du PCUS"
ADR_20th_congress_of_the_CPSU_desc:0 "Le 20e Congrès du PCUS se tient. C'est le premier congrès depuis la mort du camarade Staline, où son successeur devrait annoncer la voie que prendra l'Union soviétique dans cette nouvelle ère. Bien entendu, nous serons présents."
ADR_Begin_the_second_5-year_plan:0 "Commencer le deuxième plan quinquennal"
ADR_Begin_the_second_5-year_plan_desc:0 "Notre premier plan quinquennal étant un énorme succès, il est temps de commencer le deuxième plan quinquennal ! Celui-ci se concentrera sur l'expansion de notre industrie, ainsi que sur la modernisation de différents aspects de l'industrie."
ADR_Expand_light_industry:0 "Développer l'industrie légère"
ADR_Expand_light_industry_desc:0 "L'industrie légère est cruciale pour une nation. Elle fabrique de nombreux produits dont nos travailleurs ont besoin dans leur vie quotidienne et crée un espace de travail pour ces travailleurs. Il est donc tout à fait logique que nous souhaitions développer notre petit secteur de l'industrie légère !"
ADR_Expand_heavy_industry:0 "Développer l'industrie lourde"
ADR_Expand_heavy_industry_desc:0 "Le secteur industriel qui veille à ce que nous ayons quelque chose pour protéger le socialisme est notre secteur de l'industrie lourde. Depuis quelques années, elle approvisionne notre Armée en munitions et en armes. Mais avec la croissance constante de notre armée à mesure que de plus en plus de Genossen socialistes enthousiastes s'engagent pour garder les frontières, la demande d'armes supplémentaires augmente avec elles. C'est pourquoi le secteur de l'industrie lourde va se développer."
ADR_Modernize_tooling:0 "Moderniser l'outillage"
ADR_Modernize_tooling_desc:0 "Une usine qui souhaite atteindre une productivité maximale a besoin d'outils adaptés aux temps modernes. Les nôtres ne le sont pas actuellement. La plupart d'entre eux datent encore de la Seconde Guerre mondiale et certains sont encore plus anciens. On peut dire sans se tromper qu'il est temps que les outils soient remplacés par de nouveaux."
ADR_Purchase_Soviet_Lavochkins:0 "Acheter des Lavochkins soviétiques"
ADR_Purchase_Soviet_Lavochkins_desc:0 "Nous avons encore besoin de plus d'avions pour équiper correctement la Red Air Force. Nous achèterons quelques Lavochkins aux Soviétiques pour répondre à cette exigence."
ADR_Increase_fertilizer_production:0 "Augmenter la production d'engrais"
ADR_Increase_fertilizer_production_desc:0 "L'agriculture alimentaire constitue une partie très importante de l'industrie nationale dans les zones rurales. Mais comme la plupart des terres agricoles se trouvent à l'Ouest, il est important que nous trouvions un moyen de répondre à la demande de nos Poulations. Et une solution qui a été convenue était l'augmentation des engrais."
ADR_Open_the_Renner_mine_in_Upper_Austria:0 "Ouvrir la mine Renner en Haute-Autriche"
ADR_Open_the_Renner_mine_in_Upper_Austria_desc:0 "L'Allemagne de l'Est et la Pologne affichent depuis un certain temps déjà les noms de socialistes célèbres et de leurs dirigeants sur des bâtiments industriels et des usines. Et il est temps que nous fassions quelque chose de similaire. Avec l'ouverture prochaine d'une nouvelle mine en Haute-Autriche, il a été décidé de la nommer mine Karl Renner, en hommage à notre homme politique bien-aimé Karl Renner lui-même"
ADR_Introduce_quality_of_life_products_in_stores:0 "Introduire des produits de qualité de vie dans les magasins"
ADR_Introduce_quality_of_life_products_in_stores_desc:0 "Nos travailleurs ont travaillé dur dans les usines, sur les champs et dans les laboratoires. Faire de leur mieux pour nous aider à réaliser une société socialiste parfaite, sans rien demander en retour. Mais nous tenons bien sûr à remercier les travailleurs pour leur travail acharné. C'est pourquoi davantage de produits de qualité de vie commenceront à apparaître dans les étagères des magasins !"
ADR_Ramp_up_war_production:0 "Accélération de la production de guerre"
ADR_Ramp_up_war_production_desc:0 "La triste vérité est que le monde est passé de la Seconde Guerre mondiale à la guerre froide. Une guerre aux enjeux bien plus élevés, dans laquelle si l'un tirait le premier, cela signifierait la fin du monde. Les soldats se tiennent des deux côtés du rideau de fer, attendant que ce soit aujourd'hui le jour où les supérieurs donneront l'ordre d'attaquer. Nous le faisons aussi. Augmenter notre production de guerre est tout à fait logique."
ADR_Build_more_cars_in_Upper_Austria:0 "Allouer plus de terres à l'agriculture"
ADR_Build_more_cars_in_Upper_Austria_desc:0 "Faire en sorte qu'à l'avenir les enfants de nos enfants aient suffisamment de nourriture. Que la population n'aura pas à souffrir de famine ou de manque de nourriture. Cela se fera en allouant davantage de terres à l'agriculture."
ADR_Open_Tractor_plants_in_Burgunland:0 "Usines de tracteurs ouvertes dans le Burgenland"
ADR_Open_Tractor_plants_in_Burgunland_desc:0 "En mettant de plus en plus l'accent sur l'agriculture, la prochaine étape consiste maintenant à donner aux agriculteurs plus d'équipements comme le tracteur. Le tracteur est le meilleur ami d'un agriculteur, lui évitant d'avoir à se promener avec une faux sous un soleil brûlant. Avec l'augmentation de la demande de tracteurs, une nouvelle usine sera construite dans le Burgenland."
ADR_Use_soviet_industry_to_build_MBTs:0 "Subventionner l'agriculture dans toute la campagne"
DR_Use_soviet_industry_to_build_MBTs_desc:0 "De plus en plus de fermes s'ouvrent dans tout le pays, et de nombreux nouveaux agriculteurs constatent qu'avec nos récents investissements, le domaine est devenu très tentant et moderne. Pour attirer encore plus de nouveaux agriculteurs, nous subventionnerons également les agriculteurs pour nos investissements déjà énormes dans le secteur agricole."
ADR_Tighten_control:0 "Commencer à faire reculer la répression étatique"
ADR_Tighten_control_desc:0 "Peut-être avons-nous été un peu... Trop zélés dans notre poursuite des dissidents présumés. Il serait préférable que nous relâchions notre emprise, pour le moment."
ADR_Purge_Theodor_Kroner:0 "Licencier Theodor Korner"
ADR_Purge_Theodor_Kroner_desc:0 "Theodor Korner était censé nous aider à reconstruire Vienne-Est, mais il est devenu trop critique à l'égard de la façon dont nous faisons les choses. Le secrétaire général Koplenig a estimé que le renvoi de Theodor Korner du gouvernement serait une bonne chose."
ADR_Use_the_Ministry_of_Worker_wellbeing_as_a_front_for_domestic_surveillance:0 "Améliorer la surveillance de la Stasi"
ADR_Use_the_Ministry_of_Worker_wellbeing_as_a_front_for_domestic_surveillance_desc:0 "Depuis sa création, notre Stasi travaille sans relâche pour protéger l'État et ses intérêts. Nous allons augmenter leur financement pour qu'ils puissent encore mieux servir l'État !"
ADR_Build_monuments_to_Karl_Renner:0 "Construire des monuments à Karl Renner"
ADR_Build_monuments_to_Karl_Renner_desc:0 "Père de la République, Karl Renner a consacré sa vie au service de l'État. Vers la fin de la guerre, il fut chargé par les Soviétiques d'établir un gouvernement provisoire en Autriche et guida magistralement le pays lors de l'effondrement du régime nazi. Il mérite d'être immortalisé par l'État."
ADR_Foster_East_Austrian_nationalism:0 "Maintenir l'ordre grâce au nationalisme est-autrichien"
ADR_Foster_East_Austrian_nationalism_desc:0 "Que signifie être Autrichien ? Être Autrichien, c'est faire preuve de solidarité, travailler pour le bien du collectif et s'efforcer de répondre aux besoins du peuple. Être Autrichien, c'est être libre, et nous ne permettrons pas que l'Occident nous l'enlève."
ADR_Hunt_down_supporters_of_the_Coup_attempt:0 "Poursuivre la surveillance de masse de la Stasi"
ADR_Hunt_down_supporters_of_the_Coup_attempt_desc:0 "Avec plus de financement pour la Stasi, nous pouvons poursuivre la surveillance de masse des ennemis potentiels de l'État. En plus de garder un oeil sur les futurs traîtres du socialisme."
ADR_Reaffirm_our_loyalty_to_Moscow:0 "Réaffirmons notre loyauté envers Moscou"
ADR_Reaffirm_our_loyalty_to_Moscow_desc:0 "Alors que certains de nos voisins tentent de réviser, voire d'abandonner le socialisme, il n'est pas surprenant que les Soviétiques s'inquiètent de savoir qui est loyal et qui ne l'est pas. Nous leur assurerons que nous leur serons éternellement redevables de nous avoir sauvés du fascisme et du capitalisme, notre loyauté envers la révolution est absolue."
ADR_Join_the_UN:0 "Demander des expéditions de céréales supplémentaires"
ADR_Join_the_UN_desc:0 "Maintenir l'équilibre entre les terres agricoles et les terres industrielles est difficile, surtout dans un pays aussi petit. Pour l'instant, nous devrons dépendre de certaines expéditions de céréales en provenance des Soviétiques pour nourrir notre population."
ADR_Request_Comecon_Aid:0 "Demander l'aide du Comecon"
ADR_Request_Comecon_Aid_desc:0 "Nous sommes une petite nation et notre capacité de recherche et de développement est assez limitée. Nous aurons besoin de l'aide du Comecon pour rattraper le reste du Bloc."
ADR_Stability_once_more:0 "Proclamer l'Autriche de l'Est un véritable État socialiste"
ADR_Stability_once_more_desc:0 "La route ici a été longue et le chemin à parcourir est encore plus long. À travers d'innombrables épreuves et épreuves, nous avons transformé les vestiges brisés de l'Autriche en un État socialiste prospère ! Notre légitimité ne peut plus être niée."