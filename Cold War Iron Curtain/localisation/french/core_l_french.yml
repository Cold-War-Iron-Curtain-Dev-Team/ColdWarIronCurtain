 NAVAL_MISSION_ACTIVATE:0 "Activer"
 NAVAL_MISSION_NAME_NONE:0 "En attente de commandes"
 NAVAL_MISSION_NAME_PATROL:0 "Patrouille"
 NAVAL_MISSION_NAME_PATROL_DESC:2 "Ordonnez au groupe de patrouille de patrouiller la zone d'opération de la flotte.\n\nUne force opérationnelle ne peut patrouiller qu'une seule région à la fois.\nIl tentera de repérer les flottes ennemies dans sa région active. Le radar et la supériorité aérienne l'aideront à repérer l'ennemi plus rapidement.\n\nNotez que l'ennemi peut vous repérer et vous engager avant que vous ne le repérez."
 NAVAL_MISSION_NAME_SEARCH_AND_DESTROY:0 "Rechercher et détruire"
 NAVAL_MISSION_NAME_STRIKE_FORCE:0 "Force de frappe"
 NAVAL_MISSION_NAME_STRIKE_FORCE_DESC:3 "Ordonnez à la force opérationnelle d'attendre à la base navale la plus proche jusqu'à ce qu'une force opérationnelle ennemie soit repérée.\nUne fois qu'un ennemi est repéré par l'une de vos forces de patrouille, votre force de frappe se déplacera pour l'intercepter."
 NAVAL_MISSION_NAME_SEARCH_AND_DESTROY_DESC:1 "Ordonnez à la force opérationnelle de rechercher et d'engager activement les flottes ennemies dans la ou les régions sélectionnées."
 NAVAL_MISSION_NAME_CONVOY_RAIDING:0 "Raid de convoi"
 NAVAL_MISSION_NAME_CONVOY_RAIDING_DESC:1 "Ordonnez à la force opérationnelle d'attaquer les convois ennemis dans la ou les régions sélectionnées."
 NAVAL_MISSION_NAME_CONVOY_ESCORT:0 "Escorte de convoi"
 NAVAL_MISSION_NAME_CONVOY_ESCORT_DESC:1 "Ordonnez à la force opérationnelle d'escorter les convois dans les régions sélectionnées et de les protéger contre les raids ennemis."
 NAVAL_MISSION_NAME_INVASION:0 "Transports/Invasion"
 NAVAL_MISSION_NAME_INVASION_DESC:1 "Ordonnez à une force opérationnelle de soutenir activement le transport de troupes et les invasions dans les ordres d'invasion §Ysélectionnés§!.\n§GCliquez sur§! pour activer cette mission, puis sur §GCliquez sur§! sur la flèche d'invasion si vous en avez dessinée une."
 NAVAL_MISSION_NAME_MINES_PLANTING:0 "Pose de mines"
 NAVAL_MISSION_NAME_MINES_PLANTING_DESC:2 "Ordonnez à un groupe de travail de poser des mines marines dans les régions sélectionnées. La pénalité potentielle la plus élevée pour vos ennemis est :\n"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SHORE_BOMBARDMENT:0 "£mapicon_unit_invalid_orders£ Capacités de bombardement à faible côte"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SHORE_BOMBARDMENT_DESC:0 "La force opérationnelle ne sera pas en mesure d'aider efficacement les divisions situées sur la côte au combat en raison de ses faibles capacités de bombardement côtier. Pensez à ajouter des navires avec §YHeavy Gun Attack§! à la force opérationnelle."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_DEPTH_CHARGES:0 "£mapicon_unit_invalid_orders£ Faible montant de §Yde charges de profondeur§!"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_DEPTH_CHARGES_DESC:0 "Il est peu probable que la task force endommage les sous-marins. Pensez à ajouter des navires avec plus de §HDepth Charges§!."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SUB_SURFACE_DETECTION:0 "£mapicon_unit_invalid_orders£ Détection de sous-faible"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SUB_SURFACE_DETECTION_DESC:0 "Il est peu probable que la task force détecte des sous-marins pendant le combat. Pensez à ajouter plus de navires avec §YSonars§!, §YRadars§! ou §YCatapultes d'avion§!."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_DETECTION:0 "£mapicon_unit_invalid_orders£ Détection de faible surface"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_DETECTION_DESC:0 "Le groupe de travail sera lent à détecter les ennemis potentiels. Pensez à ajouter plus de navires avec §YRadars§! et §YCatapultes d'avion§!."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SPEED:0 "£mapicon_unit_invalid_orders£ Faible vitesse maximale"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SPEED_DESC:0 "La vitesse moyenne de la task force est trop faible et entravera sa capacité de repérage. Pensez à supprimer les navires lents ou à en ajouter des plus rapides."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_VISIBILITY:0 "£mapicon_unit_invalid_orders£ Haute visibilité des surfaces"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_VISIBILITY_DESC:0 "La force opérationnelle est trop visible et peut être facilement repérée et/ou évitée par un ennemi. Pensez à utiliser des navires plus petits ou moins blindés avec une visibilité en surface inférieure."
 NAVAL_MISSION_SET_REASON_FOR_PLANTING_NO_SHIPS:0 "Le pose de mines est §Rimpossible§!, car aucun des navires de votre flotte n'a la capacité de le faire !"
 NAVAL_MISSION_SET_REASON_FOR_SWEEPING_NO_SHIPS:0 "Le déminage est §Rimpossible§!, car aucun des navires de votre flotte n'a la capacité de le faire !"
 NAVAL_MISSION_SET_REASON_FOR_NO_WAR:0 "Vous devez être §Ren guerre§! pour activer cette mission."
 NAVAL_MISSION_NAME_MINES_SWEEPING:0 "Déminage"
 NAVAL_MISSION_NAME_MINES_SWEEPING_DESC:2 "Ordonnez à un groupe de travail de rechercher et de neutraliser les mines marines dans les régions sélectionnées. La pénalité potentielle la plus élevée que vous pourriez subir à cause des mines ennemies est :\n"
 NAVAL_MISSION_NAME_NAVAL_INVASION_SUPPORT:0 "Soutien aux invasions navales"
 NAVAL_MISSION_NAME_NAVAL_INVASION_SUPPORT_DESC:1 "Ordonnez aux navires d'escorter les invasions navales et de les soutenir avec des bombardements côtiers."
 NAVAL_MISSION_NAME_TRAINING:1 "Exercices navals"
 NAVAL_MISSION_NAME_TRAINING_DESC:3 "Ordonnez à un groupe de travail d'effectuer des exercices dans la région adjacente à la base navale la plus proche.\nCela a une chance d'endommager les navires au fil du temps.\nL'équipage n'acquérira pas d'expérience une fois qu'il aura atteint le niveau Régulier.\nVous gagnerez §YNavy Experience§! pendant votre entraînement.\nLe §YPride of the Fleet§! est moins susceptible d'avoir un accident.\n\nMaintenez §HShift§! et cliquez pour activer §HExercices navals§! jusqu'à ce que tous les navires soient complètement entraînés."
 NAVAL_BTN_REMOVE_REGIONS:0 "§HSupprimer la région§!\n§GCliquez§! sur ce bouton, puis cliquez sur la région que vous souhaitez supprimer pour la flotte actuellement sélectionnée.\n§GCliquez avec le bouton droit§! sur ce bouton pour §Rsupprimer toutes les régions§! de la flotte actuellement sélectionnée."
 NAVAL_BTN_REMOVE_REGIONS_NO_REGIONS:0 "§RAucune région à supprimer.§!"
 NAVAL_CONFIRM_REMOVE_ALL_REGIONS:0 "Supprimer toutes les régions"
 NAVAL_CONFIRM_REMOVE_ALL_REGIONS_TEXT:0 "Êtes-vous sûr de vouloir §RSUPPRIMER TOUTES LES RÉGIONS§! pour cette flotte ?"
 NAVAL_NO_STRIKE_FORCE_IN_REGION:0 "Aucune force de frappe n'opère dans la région"
 NAVAL_STRIKE_FORCE_STATUS_HEADER:0 "§HStatut des forces de frappe :§!"
 NAVAL_STRIKE_FORCE_STATUS_ENTRY:0 " - $NAME|H$: "
 NAVAL_STRIKE_FORCE_STATUS_READY:0 "£trigger_yes£ prêt à s'engager"
 NAVAL_STRIKE_FORCE_STATUS_ENGAGING:0 "£trigger_yes£ bouger pour s'engager"
 NAVAL_STRIKE_FORCE_STATUS_ENGAGING_ANOTHER:0 "£trigger_no£ occupé à engager un autre"
