 SHIP_REPAIR_NOW:3 "§HRéparez maintenant !§!\nLe navire sera détaché en tant que force opérationnelle distincte et retournera à une base navale proche pour des réparations.\nIl reviendra à son groupe de travail actuel une fois qu'il sera entièrement réparé.\n§GCliquez sur§! pour détacher.\n§GShift+Click§! pour marquer plusieurs navires et les détacher en une seule force opérationnelle en relâchant §GShift§!."
 SHIP_REPAIR_NOW_WITHOUT_DETACHING:0 "§HRéparez maintenant !§!\n§GCliquez sur§! pour ajouter le navire à la file d'attente de réparation."
 SHIP_REFIT_TOOLTIP:0 "§HRénover les navires§!\nRéaménagez les navires sélectionnés selon une conception de navire compatible différente."
 SHIP_REFIT_NO_SHIPS_TOOLTIP:0 "§RAucun navire n'est actuellement sélectionné.§!"
 SHIP_REFIT_NO_COMPATIBLE_DESIGNS_TOOLTIP:0 "§RIl n'existe aucun modèle de navire disponible qui constitue une cible de carénage valide pour tous les navires actuellement sélectionnés.§!"
 SHIP_REFIT_UPGRADE_TOOLTIP:0 "§HAméliorer le vaisseau§!\nRéaménagez ce vaisseau pour utiliser une conception améliorée."
 SHIP_REFIT_TOOLTIP_DELAYED:1 "Après avoir choisi la conception du navire cible, les navires sélectionnés se détacheront en tant que groupe de travail §Hdistinct§! et retourneront dans une base navale §Hà proximité§! pour être réaménagés. Lors du réaménagement, la progression peut être suivie dans la fenêtre de production.\n\nIls reviendront à leur groupe de travail §Hactuel§! une fois le réaménagement terminé.\n\n§GMaj + Cliquez sur§! pour sélectionner plusieurs navires.\n§GCtrl + Cliquez§! pour basculer la sélection du navire."
 SHIP_REFIT_CANCEL_TOOLTIP:1 "§RAnnulez la tâche de réaménagement§!."
 SHIP_REFIT_CANCEL_TOOLTIP_DELAYED:0 "Les navires retourneront à leur force opérationnelle d'origine et reprendront leur mission précédente."
 SHIP_REFIT_IN_PROGRESS_TOOLTIP:1 "Ce navire est actuellement en cours de rénovation selon une conception de navire différente, $VARIANT_NAME|H$."
