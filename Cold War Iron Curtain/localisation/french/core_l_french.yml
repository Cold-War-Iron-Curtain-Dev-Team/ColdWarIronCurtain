 SHIP_REFIT_CONFIRM_DESCRIPTION:0 "§HRéajustez les navires sélectionnés ($COUNT$) selon la conception du navire $VARIANT_NAME|H$.§!\n\nLes navires retourneront à une base navale §Hà proximité§! et y seront verrouillés jusqu'à ce que le processus soit terminé. Avec un maximum de §HDockyards§! attribués, cela prendra jusqu'à $DAYS|H$ jours.\n\nSi la base navale §H§! où ils sont en cours de réaménagement est bombardée, leur progression de production sera réduite. S'ils sont capturés, les navires seront perdus au profit de l'ennemi.\n\nÊtes-vous sûr de vouloir réinstaller ?"
