 SUPPLY_FLOW_PROVINCE_BREAKDOWN_OWNER:1 "$VALUE|H$ de $PROVINCE$ ($OWNER$)"
 SUPPLY_FLOW_SHOW_RANGE:1 "§HLes centres d'approvisionnement§! distribuent l'approvisionnement aux provinces voisines. Leur portée et leur efficacité dépendent des conditions météorologiques, des conditions du sol, des infrastructures, du niveau ferroviaire et de la motorisation.\n\nPour augmenter la portée et le ravitaillement fournis par un centre d'approvisionnement §H§!, pensez à utiliser la commande §HUpgrade Railways§! ou à modifier le niveau de motorisation §H§!.\n\nMaintenez §GShift§! pour afficher la plage.\n§GMaj-cliquez sur§! pour activer/désactiver la motorisation.\n§GCtrl-clic§! pour activer/désactiver le ravitaillement allié."
 SUPPLY_FLOW_DELAYED_DESC:5 "§HApprovisionnement restant§! indique la quantité d'approvisionnement fournie à cette province et est composée de l'approvisionnement de l'État et des centres à portée. La portée des hubs dépend des conditions météorologiques, des conditions du sol, de l'infrastructure, du niveau ferroviaire et de la motorisation. \n\n§HLes divisions§! consommeront l'approvisionnement provincial en fonction de leur poids d'approvisionnement. Si leur §HStocked Supply§! est supérieur au taux d'approvisionnement prévu dans leur emplacement, ils consommeront depuis leur magasin interne jusqu'à ce que l'approvisionnement stocké soit au même niveau que l'approvisionnement local.\n\nMaintenez §GCtrl§! pour afficher les sources de flux."
