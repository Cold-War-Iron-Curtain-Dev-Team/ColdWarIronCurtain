 UNITS_VIEW_BTN_DELETE_ORDER:1 "§HSupprimer la commande§!\n§GCliquez§! sur ce bouton, puis cliquez sur la commande sur la carte que vous souhaitez supprimer.\n§GFaites un clic droit§! sur ce bouton pour §Rsupprimer tous les ordres§! de l'armée actuellement sélectionnée."
 UNITS_VIEW_BTN_RESHAPE:0 "§HMode édition§!\nAppuyez sur ce bouton pour changer de mode, ou maintenez §GALT§!\n§GFaites un clic droit§! sur les épingles de fin des plans de bataille pour les modifier.\n§GCliquez et maintenez le bouton de la souris§! sur la flèche d'avancement pour la remodeler ou vous connecter à une autre commande.\n§GCliquez avec le bouton droit et maintenez le bouton de la souris§! sur l'un des ordres clignotants pour commencer à peindre une nouvelle flèche d'avancement."
 UNITS_VIEW_BTN_DRAW_OFFENCE:3 "§HLigne offensive§!\n§GFaites un clic droit et maintenez le bouton de la souris§! sur la carte pour dessiner §YLigne offensive§!.\nLes lignes ne peuvent être peintes que sur le territoire auquel vous avez attribué une ligne de front §H§! ou une invasion navale §H§!.\n\nLes divisions affectées à un plan avec une ligne offensive tenteront de prendre du territoire pour y déplacer leur ligne de front. \n\n§GMaintenez le bouton de la souris§! et §Grelâchez-le§! sur un bouton de comportement d'exécution pour modifier le type d'exécution du plan"
 UNITS_VIEW_BTN_DRAW_DEFENCE:1 "§HPremière ligne§!\n - §GCliquez sur§! sur l'une des frontières avec un autre pays pour définir le front attribué le long de toute la frontière.\n - §GFaites un clic droit et faites glisser la souris§! sur l'une des frontières avec un autre pays pour définir le front dans un intervalle plus court.\n - §GFaites un clic droit et faites glisser la souris§! sur les fins de lignes de front existantes pour les modifier.\n\nLes lignes de front sont le point de départ des attaques en territoire ennemi vers les lignes offensives, mais vous permettent également de positionner rapidement des divisions le long d'une frontière étrangère."
 UNITS_VIEW_BTN_DRAW_DEFENCE_ARMY_GROUP:0 "§HPremière ligne§!\n - §GCliquez sur§! sur l'une des frontières avec un autre pays pour définir le front attribué le long de toute la frontière.\n - §GMaj + Cliquez§! sur l'une des frontières avec un autre pays pour définir le front attribué sans fronts sous-armées le long de toute la frontière.\n - §GFaites un clic droit et faites glisser la souris§! sur l'une des frontières avec un autre pays pour définir le front dans un intervalle plus court.\n - §GShift + Faites un clic droit et faites glisser la souris§! sur l'une des frontières avec un autre pays pour définir le front sans fronts sous-armées dans un intervalle plus court.\n - §GFaites un clic droit et faites glisser la souris§! sur les fins de lignes de front existantes pour les modifier.\n\nLes lignes de front sont le point de départ des attaques en territoire ennemi vers les lignes offensives, mais vous permettent également de positionner rapidement des divisions le long d'une frontière étrangère."
 UNITS_VIEW_BTN_DRAW_FALLBACK:1 "§HLigne de repli§!\n - §GFaites un clic droit et faites glisser la souris§! sur le territoire ami pour dessiner l'ordre défensif §YÀ usage unique§!.\n\nLes lignes de repli sont utiles pour positionner les divisions en vue de la défense, par exemple derrière une rivière ou ailleurs en territoire ami."
 UNITS_VIEW_BTN_AREA_DEFENSE:3 "§HDéfense de zone§!\n - §GCliquez§! sur les états pour les ajouter/supprimer de l'ordre de l'armée.\nUne armée avec cet ordre ne peut pas avoir d'autres types en même temps.\n\nLes divisions affectées à une armée avec cet ordre se répartiront sur la zone assignée pour garder les villes, ports ou autres objets importants ainsi que pour gérer la présence ennemie mineure."
 UNITS_VIEW_BTN_DRAW_NAVAL_INV:0 "§HOrdre d'invasion navale§!\nÉtape 1) §GCliquez sur§! sur l'une des provinces en surbrillance pour définir la source de l'invasion.\nÉtape 2) §GFaites un clic droit§! sur la ou les provinces côtières que vous souhaitez envahir.\nUne fois le plan activé, l'invasion commencera à préparer et à réserver des convois depuis le pool de votre pays."
 UNITS_VIEW_BTN_DRAW_PARADROP:0 "§HOrdre des parachutistes§!\nÉtape 1) §GCliquez sur§! sur notre base aérienne pour désigner le point de décollage. La base aérienne doit disposer d'avions de transport.\nÉtape 2) §GFaites un clic droit§! sur la province qui se trouve à portée des avions de transport locaux, pour désigner le lieu de largage.\n§gN'oubliez pas que seules les unités dotées de capacités parachutistes seront transportées.§!"
