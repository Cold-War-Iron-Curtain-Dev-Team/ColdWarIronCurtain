 UNITS_VIEW_BTN_DRAW_NAVAL_INV_WITH_HARBOR:2 "§HOrdre d'invasion navale (avec prise en charge du port flottant)§!\nÉtape 1) §GCliquez sur§! sur l'une des provinces en surbrillance pour définir la source de l'invasion.\nÉtape 2) §GFaites un clic droit§! sur la ou les provinces côtières que vous souhaitez envahir.\nUne fois le plan activé, l'invasion commencera à préparer et à réserver des convois et un port flottant à partir de votre stock."
