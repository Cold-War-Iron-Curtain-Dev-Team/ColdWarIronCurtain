 NAVAL_STRIKE_FORCE_STATUS_VERY_UNLIKELY_TO_ENGAGE:0 "il est très peu probable qu'il s'engage"
 NAVAL_STRIKE_FORCE_STATUS_ENGAGEMENT_SETTING_DESC:0 "    Pour la règle d'engagement : $SETTING|H$"
 NAVAL_MISSION_NAME_RESERVE_FLEET:0 "Réserver"
 NAVAL_MISSION_NAME_RESERVE_FLEET_DESC:0 "Une flotte de réserve attendra au port et renforcera les autres task forces de son théâtre disposant du renforcement automatique activé."
 NAVAL_MISSION_NAME_HOLD:0 "Tenir"
 NAVAL_MISSION_NAME_HOLD_DESC:3 "§GCliquez sur§! ou £h \nAnnulez la mission en cours et déplacez-vous vers le port le plus proche.\n\n§GCtrl+Clic§! ou £ctrl +£h \nAnnulez la mission en cours et restez sur place.\n--------------\nLes vaisseaux capitaux placés en attente dans une province maritime voisine d'une bataille terrestre pourront aider avec §HBombardement côtier§!.\nLes porte-avions placés en attente en mer pourront utiliser leurs ailes aériennes pour des missions aériennes standard."
 NAVAL_MINES_REDUCTION_EFFECT_FROM_SWEEPING:0 "Nos capacités combinées de déminage réduiront les effets des mines ennemies de $FACTOR|0%$ pour cette force opérationnelle."
 NAVAL_GUI_BTN_MOVE:0 "§GCliquez avec le bouton droit sur§! sur la carte pour §Hdéplacer§! vers la province.\nSi la marine a une mission en attente, elle sera temporairement désactivée.\nL'unité continuera lorsque la formation sera rassemblée."
 NAVAL_GUI_BTN_ACTIVATE:0 "Activer la commande"
 NAVAL_GUI_BTN_DEACTIVATE:0 "§HDésactiver la commande§!"
 NAVAL_GUI_BTN_ACTIVATE_DESC:0 "Basculer le statut Ordre §HActif§!.\nPour l'activer, vous devez d'abord attribuer une ou plusieurs §Yrégions§! et au moins un §YOrdre§!."
 NAVAL_GUI_BTN_REGIONS:0 "Cliquez sur la carte :\n§GCliquez avec le bouton droit sur§! pour §Yajouter§!, ou §YSHIFT§!+§GCliquez avec le bouton droit sur§! pour §Ysupprimer§! régions.\nLes régions doivent être voisines les unes des autres.\n§GFaites un clic droit§! sur ce bouton pour §Reffacer toutes les régions§!."
 NAVAL_GUI_BTN_MERGE:1 "Fusionner les groupes de travail sélectionnés"
 NAVAL_GUI_BTN_NEW_FLEET_FROM_EXISTING:1 "§HCréer une nouvelle flotte§!"
 NAVAL_GUI_BTN_NEW_FLEET_FROM_EXISTING_DESC:0 "Créer une nouvelle flotte avec les navires de cette flotte"
 NAVY_SELECT_HALF:0 "Réduire de moitié la sélection actuelle de navires"
 NAVY_SELECT_HALF_NEED_MORE_THAN_ONE_SHIP:0 "§RNécessite au moins deux navires sélectionnés§!"
 SHIP_ENGAGEMENT_BUTTON_FIRE_AT_WILL:0 "§HRègle d'engagement actuelle - §RTirez à volonté !§!§!"
 SHIP_ENGAGEMENT_BUTTON_FIRE_AT_WILL_DESC:1 "La force opérationnelle engagera toujours l'ennemi. Se déplacer à travers une province avec un ennemi repéré ou une bataille en cours entraînera l'engagement de la force opérationnelle."
 SHIP_ENGAGEMENT_BUTTON_HOLD_FIRE:0 "§HRègle d'engagement actuelle - §GNe pas s'engager§!§!"
 SHIP_ENGAGEMENT_BUTTON_HOLD_FIRE_DESC:1 "La force opérationnelle tentera d'éviter d'engager l'ennemi afin de pouvoir se déplacer à travers les provinces avec des navires et des batailles ennemis.\nA moins que... nous soyons repérés et que l'ennemi tire en premier."
 SHIP_CURRENT_AGGRESSIVENESS_LEVEL:0 "Règle d'engagement actuelle : $CURRENT|H$"
 SHIP_CLICK_TO_CHANGE_AGGRESSIVENESS_LEVEL:0 "§GCliquez sur§! pour passer à $NEXT|H$"
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_1:1 "Ne vous engagez pas"
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_2:1 "S'engager à faible risque"
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_3:1 "S'engager à risque moyen"
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_4:1 "S'engager à haut risque"
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_5:1 "Toujours s'engager"
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_1_DESC:1 "La force opérationnelle ne tentera jamais d'engager un combat contre un ennemi repéré. §HLes navires de patrouille§! continueront de suivre leur cible actuelle et les §HStrike Forces§! resteront à leur base."
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_2_DESC:1 "Le groupe de travail sera prudent lorsqu'il s'agira d'engager des ennemis et n'engagera des combats que contre des forces beaucoup plus petites."
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_3_DESC:1 "La force opérationnelle prendra des risques plus élevés en engageant des ennemis et mènera des combats contre des forces de force comparable."
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_4_DESC:1 "La task force prendra des risques très élevés en engageant des ennemis et s'engagera contre des forces ayant la même force."
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_5_DESC:1 "La task force engagera toujours les ennemis repérés."
 SHIP_ENGAGEMENT_BUTTON_DISABLED_BECAUSE_DETACHED:0 "§RLa modification du paramètre d'agressivité n'est pas possible pour une force opérationnelle détachée.§!"
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_GENERAL_DESC:1 "\n--------------\n§GCliquez sur§! ou §GCliquez avec le bouton droit sur§! pour basculer entre différents paramètres d'agressivité. Des paramètres d'agressivité plus élevés inciteront vos forces opérationnelles à se battre contre des ennemis plus puissants."
 SHIP_ENGAGEMENT_BUTTON_BACK_TO_REPAIR:1 "§HLe groupe de travail est en mission de réparation§!"
 SHIP_ENGAGEMENT_BUTTON_BACK_TO_REPAIR_DESC:1 "Cliquez pour annuler la tâche de réparation. Les navires retourneront à leur mission."
 CURRENT_ASSIGNED_TASK_FORCE_FOR_PATROL:0 "Il y a $NUM|H$ groupes de travail chargés de patrouiller dans la zone d'opération de la flotte."
 CURRENT_ASSIGNED_TASK_FORCE_FOR_MISSION:0 "Il y a $NUM|H$ groupes de travail affectés à $MISSION|H$ mission dans cette région."
 CURRENT_ACTIVE_TASK_FORCE_FOR_MISSION:0 "Parmi eux, $NUM|H$ sont actuellement actifs dans la région."
