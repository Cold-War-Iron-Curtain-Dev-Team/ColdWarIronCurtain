 USA_CONGRESS_LOBBY_HELP_TT:0 "§YCongrès de lobbying§!\n-------------------------------------\nCoût : §Y50 PP§! par action.\n\nLe soutien du Sénat est obtenu une fois par faction et par projet de loi. Le lobbying parlementaire ajoute §G22 partisans§! jusqu'à ce que le soutien requis soit atteint."
 USA_CONGRESS_LOBBY_NO_BILL:0 "§RAucune facture active. Présentez un projet de loi à partir de la liste des projets de loi du Congrès.§!"
 USA_CONGRESS_LOBBY_ALREADY:0 "§GPrise en charge sécurisée.§!"
 USA_CONGRESS_LOBBY_EMPTY:0 "§gCette faction n'a pas de sénateurs sur lesquels faire pression.§!"
 USA_CONGRESS_LOBBY_POOR:0 "§RNécessite 50 points de puissance politique.§!"
 USA_CONGRESS_LOBBY_READY:0 ""
