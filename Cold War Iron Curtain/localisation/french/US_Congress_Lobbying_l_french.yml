 USA_CONGRESS_LOBBY_FEEDBACK_TT:0 "§YLe lobbying a réussi§!\n-------------------------------------\nCible : §Y[GetUSACongressLastLobbyTarget]§!\nVotes ajoutés : §G[?USA.usa_lobby_result_votes|0]§!\nPouvoir politique dépensé : §Y50§!\n\n[GetCurrentLegislation]\n\nCe soutien s'applique au projet de loi actuel."
