l_french:
 VIN_Lower_Laos_Offensive:0 "Frappe dans le Bas-Laos"
 VIN_Lower_Laos_Offensive_desc:0 "Une division descendue de l'épine dorsale annamite peut apparaître sur le plateau des Bolovens et à Attapeu, et de là pointer vers Stung Treng. Le gouvernement royal du Laos et le Cambodge ne sont pas nos ennemis dans ce domaine ; l'objectif est d'amener le commandement de l'Union française à décider où ses réserves sont nécessaires, alors que l'opération Atlante est toujours en jeu."
VIN_Lower_Laos_Offensive_tt:0 "Le Viet Minh ouvre une diversion §Yde 45 jours§! vers Attapeu et les Bolovens, dépensant §R20 ravitaillements de campagne§!. Aucune guerre n'est déclarée et aucun territoire ne change de mains.\nSi l'opération Atlante est en cours, elle dispose de §Y4 jours supplémentaires§! pour tenir et le CEFEO prend une pénalité temporaire.\nSi le CEFEO ne garde aucune division à Attapeu ou aux Bolovens : §G+15 Lutte Communiste§!. Sinon la diversion est contenue et le Viet Minh récupère §G10 Campagne Supply§!."
 FRE_Lower_Laos_Reserves_Diverted:0 "Des réserves attirées vers le Bas-Laos"
 FRE_Lower_Laos_Reserves_Diverted_desc:0 "Les colonnes du Viet Minh sur les Bolovens et à la frontière cambodgienne ont contraint le commandement expéditionnaire à retirer des bataillons de son opération prévue au centre du Vietnam. Le travail du personnel est plus lent, les unités arrivent peu nombreuses et les lignes de ravitaillement s'étirent davantage."
 VIN_Lower_Laos_Offensive_Launched:0 "§YLa dérivation du Bas Laos a été lancée§!"
 VIN_Lower_Laos_Diversion_Active:0 "§YLe détournement du Bas Laos est en cours§!"
 VIN_Lower_Laos_Atlante_Hold_Applied:0 "§YLe détournement a prolongé l'opération Atlante§!"
 VIN_Lower_Laos_FRE_Garrison_Seen:0 "§YLe CEFEO a envoyé des troupes à Attapeu ou aux Bolovens§!"
 VIN_Lower_Laos_Result_Pressure:0 "§GLa diversion du Bas Laos coince la réserve française§!"
 VIN_Lower_Laos_Result_Contained:0 "§RLe CEFEO a contenu le détournement du Bas Laos§!"
 VIN_Lower_Laos_Result_Superseded:0 "La dérivation du Bas Laos a été dépassée de §gpar la colonie plus large§!"
 VIN_Lower_Laos_Focus_Superseded:0 "La dérivation du Bas Laos n'a jamais été lancée"
 FRE_Lower_Laos.1.t:0 "Le Viet Minh au Bas Laos"
 FRE_Lower_Laos.1.d:0 "Les colonnes Viet Minh ont traversé la chaîne annamite jusqu'à Attapeu et se déplacent sur le plateau des Bolovens. Le gouvernement royal du Laos demande de l'aide et le Cambodge surveille la route vers Stung Treng. Un groupe mobile envoyé sur le plateau tiendrait la ligne, mais chaque bataillon envoyé vers l'ouest représente un de moins pour nos autres opérations."
 FRE_Lower_Laos.1.a:0 "Envoyez un groupe mobile vers les Bolovens."
 FRE_Lower_Laos.1.b:0 "L'Armée royale laotienne doit tenir seule."
 FRE_Lower_Laos_Reinforce_tt:0 "Coûte §R40§! Crédits de guerre. Un groupe aéroporté, amené par le CEFEO et servant sous les ordres de l'Armée Royale Lao, atterrit sur le plateau des Bolovens et y reste jusqu'à la fin de la diversion du Viet Minh, qui en contiendra §G§!. Si le gouvernement royal du Laos ne détient plus Champassak, rien n'atteint et les crédits sont restitués. Si l'opération Atlante est en cours, ses besoins en matière de rétention augmentent de §R3§! jours."
 FRE_Lower_Laos_Ignore_tt:0 "Aucune réserve n'est détournée. À moins que les troupes du CEFEO n'atteignent Attapeu ou Champassak, le Viet Minh gagne §RLutte communiste§! à la fin de la diversion."
