l_french: 

SYR_fledglingoilindustry:0 "Une industrie pétrolière naissante"
SYR_fledglingoilindustry_desc:0 "Même si nous n'avons pas réussi à trouver du pétrole une fois, nous réessayerons."
SYR_localsteelproduction:0 "Production locale d'acier"
SYR_localsteelproduction_desc:0 "Notre production d'acier est minuscule, mais nous pouvons investir suffisamment pour notre utilisation."
SYR_karatchokoilfield:0 "Champ pétrolifère de Karatchok"
SYR_karatchokoilfield_desc:0 "En 1949, nous avons contacté James W. Menhall pour qu'il vienne en Syrie pour prospecter du pétrole. La James W. Menhall Drilling Company a obtenu une concession pour commencer le forage. Menhall a découvert le champ pétrolifère de Karatchok avec plus d'un milliard de barils de réserves."
SYR_growingprivatesectori:0 "Un secteur privé en croissance"
SYR_growingprivatesectori_desc:0 "Les dépenses publiques destinées à soutenir le secteur privé contribueront à la croissance de notre économie."
SYR_growingmilitaryindustryi:0 "Industrie militaire en croissance"
SYR_growingmilitaryindustryi_desc:0 "Nous devons avoir nos propres usines militaires pour au moins assurer notre disponibilité en munitions."
SYR_textilemills:0 "Usines textiles"
SYR_textilemills_desc:0 "En raison de la guerre de Corée, la demande de coton a augmenté. Nous devrions saisir cette opportunité pour investir dans des usines textiles afin d'exporter des tissus en coton."
SYR_nationalisetherailways:0 "Nationaliser les chemins de fer"
SYR_nationalisetherailways_desc:0 "Les chemins de fer syriens sont dispersés et appartiennent à des sociétés privées. La nationalisation les centralisera sous notre commandement."
SYR_universityofaleppo:0 "Université d'Alep"
SYR_universityofaleppo_desc:0 "Avec l'ouverture de l'Université d'Alep, notre deuxième université du pays, nous mettrons à profit leur esprit scientifique dans nos recherches."
SYR_growingmilitaryindustryii:0 "Industrie militaire élargie"
SYR_growingmilitaryindustryii_desc:0 "Les anciennes usines militaires françaises peuvent être réutilisées pour notre usage."
SYR_encourageprivateinvestments:0 "Encourager les investissements privés"
SYR_encourageprivateinvestments_desc:0 "Encourager les investissements privés nous permettra d'améliorer nos capacités industrielles."
SYR_seeksaudiforgiveness:0 "Demandez le pardon des Saoudiens"
SYR_seeksaudiforgiveness_desc:0 "Les gauchistes échappent à notre contrôle et provoquent la colère de l'Arabie Saoudite. Nous irons nous excuser."
SYR_palestiniansoldiers:0 "Soldats palestiniens"
SYR_palestiniansoldiers_desc:0 "Nous avons des réfugiés palestiniens valides en Syrie. Nous leur offrirons une chance de devenir soldats pour reprendre un jour leur maison aux sionistes."
SYR_foilthecia:0 "Déjouer la CIA"
SYR_foilthecia_desc:0 "Les États-Unis, rusés, orchestrent un nouveau coup d'État contre nous. Pas cette fois, et ramenez votre ambassadeur."
SYR_seekegyptiansupport:0 "Rechercher le soutien égyptien"
SYR_seekegyptiansupport_desc:0 "Nous avons toujours nos liens avec l'Égypte. Nous leur demanderons leur soutien."
SYR_requestunionwithegypt:0 "Demander l'union avec l'Egypte"
SYR_requestunionwithegypt_desc:0 "Avec le soutien de l'Égypte contre le Pacte de Bagdad, les Syriens parlent massivement d'une union avec l'Égypte. Nous demanderons formellement au syndicat."
SYR_formtheunitedarabrepublic:0 "Former la République Arabe Unie"
SYR_formtheunitedarabrepublic_desc:0 "L'Égypte et la Syrie ne sont plus. Nous sommes la République Arabe Unie !"
SYR_cuttieswithegypt:0 "Couper les liens avec l'Égypte"
SYR_cuttieswithegypt_desc:0 "Nous ne pouvons plus entretenir de bons termes avec l'Égypte. Nos mains sont malheureusement liées."
SYR_egyptiansyrianagreement:0 "Accord égypto-syrien"
SYR_egyptiansyrianagreement_desc:0 "L'Égypte et la Syrie se ressemblent beaucoup. Alors que le Pacte de Bagdad nous menace, nous devons travailler ensemble."
SYR_acquireww2aircraft:0 "Acquérir des avions de la Seconde Guerre mondiale"
SYR_acquireww2aircraft_desc:0 "Nous pouvons acheter des avions en Europe pour améliorer nos capacités aériennes. Des météores sont également disponibles pour nous."
SYR_modernairbases:0 "Bases aériennes modernes"
SYR_modernairbases_desc:0 "L'amélioration de notre aéroport militaire est tout aussi importante pour le développement de l'Armée de l'Air."
SYR_acquireww2equipment:0 "Acquérir de l'équipement de la Seconde Guerre mondiale"
SYR_acquireww2equipment_desc:0 "Nous pouvons armer notre armée avec du matériel de la Seconde Guerre mondiale. Même les Panzers peuvent être acquis."
SYR_fortifythegolan:0 "Fortifier le Golan"
SYR_fortifythegolan_desc:0 "Nous avons les hauteurs. Quoi de mieux ? Un terrain élevé et fortifié."
SYR_latakiadockyards:0 "Investissements dans les chantiers navals"
SYR_latakiadockyards_desc:0 "Nous avons besoin de nos chantiers navals en état de marche. Pour la Marine, c'est une priorité."
SYR_coastaldefence:0 "Défense côtière"
SYR_coastaldefence_desc:0 "Ne baissez jamais la garde, non seulement dans le Golan, mais aussi sur la côte."
SYR_airdoctrineevaluation:0 "Évaluation de la doctrine aérienne"
SYR_airdoctrineevaluation_desc:0 "Nos forces doivent être formées à une doctrine militaire appropriée."
SYR_landdoctrineevaluation:0 "Évaluation de la doctrine foncière"
SYR_landdoctrineevaluation_desc:0 "Nos forces doivent être formées à une doctrine militaire appropriée."
SYR_navaldoctrineevaluation:0 "Évaluation de la doctrine navale"
SYR_navaldoctrineevaluation_desc:0 "Nos forces doivent être formées à une doctrine militaire appropriée."
SYR_acquiremodernequipment:0 "Acquérir un équipement moderne"
SYR_acquiremodernequipment_desc:0 "L'Union Soviétique et le bloc de l'Est nous vendront du matériel militaire moderne pour notre armée."
SYR_tartousdockyards:0 "Agrandissement des chantiers navals"
SYR_tartousdockyards_desc:0 "Nous ne pouvons pas non plus laisser les chantiers navals de Tartous rouiller."
SYR_lessonsfromthenakba:0 "Leçons de la Nakba"
SYR_lessonsfromthenakba_desc:0 "Nous sommes allés en Palestine pour combattre les sionistes et nous en revenons humiliés. Nous devons apprendre de nos erreurs pour éviter que de telles répétitions ne se reproduisent."
SYR_syriantourism:0 "Tourisme syrien"
SYR_syriantourism_desc:0 "La Syrie a une histoire et une beauté que le monde doit voir. Nous devons les utiliser au maximum."
SYR_homsrefinery:0 "Raffinerie de Homs"
SYR_homsrefinery_desc:0 "La Tchécoslovaquie a accepté d'investir dans une raffinerie qui sera construite à Homs. Cela nous aidera certainement."
SYR_husnialzaim:0 "Husni al-Zaïm"
SYR_husnialzaim_desc:0 "Le 30 mars 1949, al-Za'im a pris le pouvoir lors d'un coup d'État sans effusion de sang contre le gouvernement démocratiquement élu. Le coup d'État n'est que le début du chaos à venir."
SYR_westernisesyria:0 "Occidentaliser la Syrie"
SYR_westernisesyria_desc:0 "Les femmes syriennes seront autorisées à voter et à rejoindre le gouvernement. Le fez est un couvre-chef désuet des derniers jours de l'Empire Ottoman. Abandonnez aussi le port du voile, ils n'ont plus leur place en Syrie désormais."
SYR_signarmisticewithisrael:0 "Signer l'armistice avec Israël"
SYR_signarmisticewithisrael_desc:0 "Comme promis avec les États-Unis, nous signerons un armistice avec l'État juif. Nous ne gaspillerons pas davantage d'hommes dans cette entreprise ratée."
SYR_westernalignment:0 "Alignement occidental"
SYR_westernalignment_desc:0 "Nous soutiendrons l'Occident contre la propagation du communisme."
SYR_adibshishakli:0 "Adib Chichakli"
SYR_adibshishakli_desc:0 "Al-Hannawi a renversé Husni al-Za'im avec l'aide de ses collègues du Parti social-nationaliste syrien, dont Adib al-Shishakli. Ce qu'al-Za'im mérite, c'est une balle dans la tête. Le règne d'Al-Hannawi n'a pas non plus duré et Adib al-Shishakli a pris la barre."
SYR_purgethemilitary:0 "Purger l'armée"
SYR_purgethemilitary_desc:0 "L'armée est un vivier de rivaux susceptibles de tenter un nouveau coup d'État. Il est temps de prendre l'initiative et de les frapper avant qu'ils puissent agir !"
SYR_exileopponents:0 "Exil des opposants"
SYR_exileopponents_desc:0 "Le Parti national, les communistes, les baathistes et les Frères musulmans ne peuvent pas rester en liberté. Nous exilerons ces individus dangereux."
SYR_removeiraqiinfluence:0 "Supprimer l'influence irakienne"
SYR_removeiraqiinfluence_desc:0 "Les Hachémites d'Irak complotent pour annexer la Syrie à leur soi-disant « Fédération arabe ». Nous avons notre mot à dire, et c'est un « non » !"
SYR_befriendneutralpowers:0 "Liez-vous d'amitié avec les puissances neutres"
SYR_befriendneutralpowers_desc:0 "La Syrie ne doit pas tomber aveuglément entre l'Occident et l'Est. Nous travaillons selon nos propres conditions, avec des nations partageant les mêmes idées."
SYR_syrianairforce:0 "Force aérienne syrienne"
SYR_syrianairforce_desc:0 "Avec les avions laissés sur place par les Français et les instructeurs allemands et croates, l'armée de l'air syrienne a été créée. Nous devons garder le contrôle du ciel pour chaque guerre."
SYR_syriannavy:0 "Marine syrienne"
SYR_syriannavy_desc:0 "Nous avons acquis 3 navires français et formé la marine syrienne. Nous devrons faire davantage pour que nos côtes restent syriennes."
SYR_syrianarmy:0 "Armée syrienne"
SYR_syrianarmy_desc:0 "L'armée syrienne est petite, mal armée et mal entraînée. C'est à nous de changer cela."
SYR_syrianarmedforces:0 "Forces armées syriennes"
SYR_syrianarmedforces_desc:0 "Les forces armées syriennes constituent notre ligne de défense. Nous devons nous rappeler d'y consacrer toute notre attention."
SYR_economicassessment:0 "Évaluation économique"
SYR_economicassessment_desc:0 "Il est temps d'évaluer notre développement économique. Il est irresponsable de laisser un pays sous-développé à nos propres enfants, n'est-ce pas ?"
SYR_turntoeasternsupport:0 "Tournez-vous vers le support oriental"
SYR_turntoeasternsupport_desc:0 "Le bloc de l'Est dirigé par l'Union soviétique sympathise avec notre cause. Cela rend notre amitié raisonnable, mais cela peut enhardir certains communistes."
SYR_confronttheleftistinfluence:0 "Affronter l'influence de gauche"
SYR_confronttheleftistinfluence_desc:0 "Nous ne pouvons pas laisser les socialistes de notre pays livrés à eux-mêmes. Nous devons limiter leur pouvoir."
SYR_cuttieswiththeeasternbloc:0 "Couper les liens avec le bloc de l'Est"
SYR_cuttieswiththeeasternbloc_desc:0 "Nous ne pouvons plus nous tourner vers le bloc de l'Est pour obtenir du soutien. Nos mains sont liées."
SYR_postwaragriculturalboom:0 "Boom agricole d'après-guerre"
SYR_postwaragriculturalboom_desc:0 "Alors que l'Europe se remet de la guerre, la demande de produits agricoles demeure. Nous devrions rechercher comment améliorer nos rendements pour répondre à la demande."
SYR_suezcrisis:0 "Crise de Suez"
SYR_suezcrisis_desc:0 "L'agression tripartite du Royaume-Uni, de la France et d'Israël contre l'Égypte nous tient en marge avec inquiétude. Que devons-nous faire ?"
SYR_interceptspyplanes:0 "Intercepter des avions espions"
SYR_interceptspyplanes_desc:0 "Il y a des rapports selon lesquels des avions espions britanniques nous espionnent depuis Chypre. Nous détournerons leur attention du ciel grâce à l'utilisation d'observateurs policiers qui alerteront nos bases aériennes pour préparer l'interception."
SYR_acquiremodernaircraft:0 "Acquérir des avions modernes"
SYR_acquiremodernaircraft_desc:0 "L'Union soviétique et le bloc de l'Est nous vendront des avions modernes pour notre armée de l'air."
SYR_restoredemocracy:0 "Restaurer la démocratie"
SYR_restoredemocracy_desc:0 "Le règne de Shishakli est allé trop loin. Il est temps de ramener la Syrie à la démocratie !"
SYR_bowtothebaghdadpact:0 "Saluez le Pacte de Bagdad"
SYR_bowtothebaghdadpact_desc:0 "Il est inutile de défier Bagdad et Amman, nous devons nous plier à leurs menaces."
SYR_growingprivatesectorii:0 "Secteur privé élargi"
SYR_growingprivatesectorii_desc:0 "Nous devrions pouvoir rouvrir les usines fermées laissées par les Français, et même inviter à nouveau les étrangers à investir."
SYR_thenakba:0 "La Nakba"
SYR_thenakba_desc:0 "La Nakba est la plus grande tragédie du monde arabe. Il y avait environ 70 000 réfugiés palestiniens en Syrie à l'été 1948. Nous les aiderons en tant que frères arabes."
SYR_settlethepalestinianrefugees:0 "Installer les réfugiés palestiniens"
SYR_settlethepalestinianrefugees_desc:0 "Nous avons des réfugiés palestiniens valides en Syrie. Nous leur offrirons la chance de vivre ici jusqu'à ce que nous récupérions leurs terres."
SYR_sendvolunteers:0 "Envoyer des bénévoles"
SYR_sendvolunteers_desc:0 "Nous ne pouvons pas laisser la Grande-Bretagne, la France et Israël faire ce qu'ils veulent dans le canal de Suez... Mais nous ne pouvons pas intervenir directement ni être détruits également. Nous enverrons des volontaires et espérons qu'ils pourront nous aider."
SYR_reactingtotheworld:0 "Réagir au monde"
SYR_reactingtotheworld_desc:0 "Le monde autour change. Comment allons-nous réagir ?"
SYR_pressureunionwithlebanon:0 "Union de pression avec le Liban"
SYR_pressureunionwithlebanon_desc:0 "Les Français nous ont coupé le Liban et y ont implanté une fausse « identité libanaise ». Nous leur rappellerons qu'ils sont syriens."
SYR_unitethehashemitekingdoms:0 "Unir les royaumes hachémites"
SYR_unitethehashemitekingdoms_desc:0 "Avec trois royaumes hachémites, il est désormais temps de s'unir en un seul royaume !"
SYR_prowesterndiplomacy:0 "Diplomatie pro-occidentale"
SYR_prowesterndiplomacy_desc:0 "Le passage à une politique favorable à l'Occident compensera nos pertes antérieures."
SYR_hashemitemonarchy:0 "Monarchie hachémite"
SYR_hashemitemonarchy_desc:0 "L'ancien prince régent irakien Abd al-Ilah a été sélectionné comme roi potentiel de la Syrie."
SYR_jointhebaghdadpact:0 "Rejoignez le Pacte de Bagdad"
SYR_jointhebaghdadpact_desc:0 "Soutenir le Pacte de Bagdad nous permettra de nous regrouper parmi les alliés de l'Occident contre le communisme."
SYR_secondshishaklidictatorship:0 "Deuxième dictature de Shishakli"
SYR_secondshishaklidictatorship_desc:0 "Le retour de Shishakli lui donnerait davantage de contrôle sur le pays et l'orienterait vers ses ambitions."
SYR_consolidateiraq:0 "Consolider l'Irak"
SYR_consolidateiraq_desc:0 "Le régime chaotique en Irak est trop préoccupé par ses problèmes internes pour ne pas nous voir venir."
SYR_declareanendtothezionistpest:0 "Déclarons la fin de la peste sioniste"
SYR_declareanendtothezionistpest_desc:0 "L'humiliation de 1948 aura lieu maintenant. Cette fois, nous gagnerons."
SYR_demandkuwait:0 "Exiger le Koweït"
SYR_demandkuwait_desc:0 "Le seul obstacle à l'annexion du Koweït est la Grande-Bretagne. Nous leur demanderons leur accord pour annexer le protectorat."
SYR_endthehashemitesinjordan:0 "Mettre fin aux Hachémites en Jordanie"
SYR_endthehashemitesinjordan_desc:0 "La monarchie hachémite en Jordanie est faible et ils laissent leurs terres se dégrader dans leurs traditions désuètes. Nous prendrons cette terre comme faisant partie du sol syrien."
SYR_declarepanarabistambitions:0 "Déclarer ses ambitions pour la Grande Syrie"
SYR_declarepanarabistambitions_desc:0 "Avec le retour de Shishakli, nous pouvons poursuivre nos ambitions sans entrave."
SYR_proclaimgreatersyria:0 "Proclamer la Grande Syrie"
SYR_proclaimgreatersyria_desc:0 "Avec la conquête de nos voisins, nous avons réalisé la Grande Syrie !"
SYR_centralisethekingdoms:0 "Centraliser les royaumes"
SYR_centralisethekingdoms_desc:0 "Maintenant que les Royaumes nous ont rejoint, nous centralisons la gouvernance à Damas."
SYR_declarepalestinesyrian:0 "Déclarer des revendications sur la Palestine"
SYR_declarepalestinesyrian_desc:0 "La Palestine est insaisissable depuis des générations, donnée aux sionistes par la Grande-Bretagne. Nous ne pouvons pas prétendre être le Royaume de Syrie sans Al-Quds dans son ensemble."
SYR_requesttransferofkuwait:0 "Demander le transfert du Koweït"
SYR_requesttransferofkuwait_desc:0 "Bien que le Koweït soit un protectorat britannique, nous pouvons toujours demander son annexion pacifiquement."
SYR_purgenationalistsinthearmy:0 "Purger les nationalistes dans l'armée"
SYR_purgenationalistsinthearmy_desc:0 "Les éléments dissidents de notre armée commune sont partout. Une purge doit être mise en place afin d'empêcher les sécessionnistes."
SYR_maintainfriendshipwithbaghdadpact:0 "Maintenir l'amitié avec le Pacte de Bagdad"
SYR_maintainfriendshipwithbaghdadpact_desc:0 "Même si l'Irak a été annexé, nous devons conserver leur bonne volonté envers le Pacte de Bagdad."
SYR_ultimatumtolebanon:0 "Ultimatum au Liban"
SYR_ultimatumtolebanon_desc:0 "Nous ne pouvons pas laisser le Liban passer à côté alors que nous construisons notre Royaume. Nous exigerons leur annexion."