 FIN_motorized_equipment_1:0 "Citroën T-45"
 FIN_motorized_equipment_1_short:0 "Citroën T-45"
 FIN_motorized_equipment_1_desc:0 "La majorité des camions Citroën ont été amenés en Finlande pendant les années de guerre de 1941-42. L'histoire derrière tout cela est intéressante. Environ un millier de camions Ford V8 1940 avaient été commandés en Amérique. Cependant, lors de l'occupation de la Norvège en 1940, l'armée allemande avait repris ces « Fighter-Ford » en route vers la Finlande. Suite à l'alliance finno-allemande, l'Allemagne a corrigé son tir en fournissant un nombre similaire de camions Citroën. La plupart d'entre eux étaient des modèles T-45, bien que quelques T-23 plus légers aient également été livrés. Au total, environ 1 500 camions ont été réceptionnés."
 FIN_motorized_equipment_2:0 "Vanaja V-48"
 FIN_motorized_equipment_2_short:0 "Vanaja V-48"
 FIN_motorized_equipment_2_desc:0 "Sisu S-21/S-22/Vanaja V-48 est un camion d'abord produit par le constructeur finlandais de véhicules lourds Suomen Autoteollisuus, puis sous les noms Sisu S-22 et S-22K par Yhteissisu, qui, après avoir changé son nom Vanajan Autotehdas (TVA), l'a produit sous le nom de Vanaja V-48. La période de production s'étendait de 1943 à 1955. Il a été développé pendant la guerre de Continuation pour que les forces de défense finlandaises soient produites en quantités relativement importantes. La production en série n'a pas démarré avant la fin de la guerre. De nombreuses unités d'après-guerre portant le badge Vanaja étaient propulsées par des moteurs militaires américains excédentaires."
