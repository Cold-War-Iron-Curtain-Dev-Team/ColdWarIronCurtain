# Focus Availability Tooltips
FRE_Operation_Lorraine_Available_tt: "Le plan peut être préparé une fois que la campagne du Nord-Ouest §Y§! commencera, après le §Yle 15 octobre 1952§!, ou dans le cadre d'un programme d'opérations accélérées. Si elle est préparée avant les attaques de Hanoï, la Lorraine sera offerte à l'ouverture de la campagne."
FRE_Operation_Hirondelle_Available_tt: "Disponible après le §Y1er juillet 1953§! alors que le théâtre d'Indochine reste ouvert et qu'aucune des deux parties n'a d'autre opération primaire sur le terrain."
FRE_Operation_Mouette_Available_tt: "Disponible après le §Y1er octobre 1953§!, une fois qu'Hirondelle aura atteint un résultat terminal et que le théâtre d'Indochine restera ouvert."
FRE_Operation_Brochet_Available_tt: "Disponible après le §Y15 août 1953§! alors que le théâtre d'Indochine reste ouvert et qu'aucune des deux parties n'a d'autre opération primaire sur le terrain."
FRE_Operation_Castor_Available_tt: "L'opération Castor nécessite le contrôle français du terrain d'atterrissage de Dien Bien Phu, un théâtre actif en Indochine, aucune offensive actuelle de Dien Bien Phu et aucune autre opération CEFEO en cours. Il devient historiquement disponible après le §Y1er novembre 1953§!."

FRE_Castor_Airhead_Forming: "Opération Castor Airhead"
FRE_Castor_Airhead_Forming_desc: "Les ingénieurs aéroportés et les premiers détachements de garnison organisent le périmètre de Dien Bien Phu tandis que la passerelle aérienne reste exposée."

