FRE_Preparation_Ready: "Position défensive préparée"
FRE_Preparation_Ready_desc: "La garnison dispose d'un plan préparé et de suffisamment d'avertissements pour répondre à l'assaut d'ouverture dans l'ordre."
FRE_Preparation_Supported: "Position défensive renforcée"
FRE_Preparation_Supported_desc: "Une préparation antérieure ou une expérience du champ de bataille ont apporté un appui-feu supplémentaire et des réserves à ce poste."
FRE_Preparation_Maximum: "Réserve de théâtre concentrée"
FRE_Preparation_Maximum_desc: "Les réserves aériennes, d'artillerie et mobiles ont été concentrées pour la bataille immédiate."
FRE_Limited_Operation_Light: "Engagement opérationnel léger"
FRE_Limited_Operation_Light_desc: "Un engagement étroit limite l'exposition, mais laisse peu de marge de retard aux forces de terrain."
FRE_Limited_Operation_Standard: "Engagement opérationnel standard"
FRE_Limited_Operation_Standard_desc: "Le corps expéditionnaire affecte à l'opération le paquet ordinaire d'artillerie, de ravitaillement et de réserve."
FRE_Limited_Operation_Maximum: "Engagement opérationnel maximal"
FRE_Limited_Operation_Maximum_desc: "La réserve du théâtre se concentre derrière cette opération au coût politique et logistique important."
FRE_Preparation.1.t: "La bataille de Vinh Yen"
FRE_Preparation.1.d: "Les divisions Viet Minh descendent sur la position de Vinh Yen. De Lattre peut concentrer la réserve aérienne et d'artillerie ou faire confiance à la ligne conventionnelle pour absorber l'assaut."
FRE_Preparation.1.a: "Concentrez la réserve aérienne et d'artillerie."
FRE_Preparation.1.b: "Tenez avec la ligne conventionnelle."
FRE_Preparation.2.t: "La bataille de Mao Khé"
FRE_Preparation.2.d: "Les avant-postes de l'Est et la région charbonnière sont attaqués. Les tirs fluviaux peuvent renforcer la garnison, mais engager la flottille attirera de rares ressources dans le combat."
FRE_Preparation.2.a: "Amenez les canons Dinassaut en amont."
FRE_Preparation.2.b: "L'infanterie occupera la position."
FRE_Preparation.3.t: "La ligne de la rivière Day"
FRE_Preparation.3.d: "L'offensive s'est étendue à Ninh Binh, Phat Diem et aux approches sud du delta. La ligne peut être renforcée partout ou autorisée à se courber pour contourner les attaques les plus fortes."
FRE_Preparation.3.a: "Tenez toute la ligne à tout prix."
FRE_Preparation.3.b: "Pliez, mais ne cassez pas."
FRE_Preparation.4.t: "Le hérisson de Na San"
FRE_Preparation.4.d: "Le camp retranché est encerclé et entièrement dépendant de la passerelle aérienne. Le maintenir mettra à l'épreuve la force de transport ; sans cela, la garnison isolée doit survivre seule."
FRE_Preparation.4.a: "Soutenir le pont aérien."
FRE_Preparation.4.b: "La garnison est en grande partie seule."
FRE_Preparation.5.t: "La Poste à Nghia Lo"
FRE_Preparation.5.d: "Des régiments Viet Minh sont descendus des collines vers le poste de Nghia Lo, en pays Tai. La garnison est petite et éloignée du delta. Les parachutistes largués sur Tu Le pourraient prendre les attaquants sur le flanc, mais la flotte de transport est mince et chaque avion envoyé vers le nord représente un de moins pour le delta."
FRE_Preparation.5.a: "Lâchez les parachutistes à Tu Le."
FRE_Preparation.5.b: "Le poste doit tenir tout seul."
FRE_Preparation_Tu_Le_tt: "Un groupe aéroporté renforce le poste §YNghia Lo§! jusqu'à la fin de la bataille."
FRE_Limited_Ops.1.t: "L'opération se termine"
FRE_Limited_Ops.1.d_clean: "Les objectifs assignés ont été atteints dans les délais et les formations engagées se sont désengagées en bon ordre. Le corps expéditionnaire conserve l'initiative."
FRE_Limited_Ops.1.d_costly: "Les objectifs ont été atteints, mais seulement après retard et attrition. L'opération a atteint son objectif sans pour autant dissimuler son prix."
FRE_Limited_Ops.1.d_aborted: "L'opération a été interrompue avant que ses objectifs n'aient pu être assurés. Les formations ont regagné leurs lignes, mais l'ennemi lira correctement le retrait."
FRE_Limited_Ops.1.d_failure: "Le temps imparti a expiré sans garantir les objectifs. Le corps expéditionnaire s'est retiré de l'opération."
FRE_Limited_Ops.1.d_superseded: "Les événements ailleurs ont pris le pas sur l'opération. Aucun engagement supplémentaire ne sera pris envers un objectif que le théâtre ne peut plus soutenir."
FRE_Limited_Ops.1.a: "Fermez le dossier opérationnel."
FRE_Operation_Timer: "Objectif et date limite de l'opération"
FRE_Operation_Timer_desc: "Survolez l'objectif actuel, la attente consécutive, la fenêtre de résultat propre et la date limite finale. Le contrôle de l'Union française s'entend du contrôle du CEFEO, de la France, de la Fédération Tai ou de l'État du Vietnam. Perdre un objectif requis réinitialise sa prise consécutive. A l'échéance, l'opération se termine selon son résultat."
FRE_Limited_Operation_Status_tt: "§YOBJECTIF ACTUEL§!\n[GetFREOperationObjective]\n\nJour §Y[?FRE.FRE_op_days_elapsed|0]§! du §Y[?FRE.FRE_op_deadline_y|0]§!. Un résultat propre nécessite l'objectif par jour §Y[?FRE.FRE_op_deadline_x|0]§!. Objectif consécutif actuel : §Y[?FRE.FRE_op_objective_hold_days|0]§! jours.[GetFREOperationContestStatus]"
FRE_Abort_Limited_Operation: "Arrêter l'opération"
FRE_Abort_Limited_Operation_desc: "Ordonnez aux formations engagées de se désengager. Le résultat sera enregistré comme une opération interrompue."
FRE_Paratrooper_Interdiction_Raid: "Raid d'interdiction des parachutistes"
FRE_Paratrooper_Interdiction_Raid_desc: "Utiliser les méthodes éprouvées à Lang Son pour frapper le réseau d'approvisionnement qui soutient la campagne actuelle du Viet Minh."
VIN_Abort_Limited_Campaign: "Annulez l'offensive limitée"
VIN_Abort_Limited_Campaign_desc: "Retirez les formations engagées avant que la campagne ne consomme davantage de ravitaillement."

