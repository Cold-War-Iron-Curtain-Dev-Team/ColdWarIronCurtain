# Cambodge Economic Events
CAM_Economic.1.t: "Études rurales et données démographiques de Jean Delvert"
CAM_Economic.1.d: "En 1949, le géographe français Jean Delvert a commencé une étude fondamentale de la vie rurale cambodgienne, en particulier dans la province de Takeo, l'une des régions les plus densément peuplées et les plus vitales du Kampuchea sur le plan agricole. Cependant, Delvert se heurte immédiatement à un obstacle majeur : l'absence de statistiques démographiques fiables. Il rejeta le recensement de la population coloniale de 1937, le jugeant inexact et s'appuya plutôt sur les chiffres de 1921, mais même ceux-ci, admet-il, étaient d'une fiabilité douteuse. Delvert a critiqué la faiblesse administrative de l'État khmer postcolonial, soulignant que les naissances et les décès étaient rarement enregistrés et que les structures de la fonction publique étaient, au mieux, rudimentaires. Selon lui, la population était généralement estimée en multipliant par quatre le nombre d'hommes adultes assujettis à l'impôt, une méthode grossière et imprécise. Ses conclusions ont révélé un pays dominé par l'agriculture paysanne, des infrastructures rurales médiocres et de faibles taux d'alphabétisation. Le travail de Delvert a fourni une base essentielle pour la planification initiale du développement économique de notre peuple et a mis en lumière les énormes lacunes bureaucratiques et statistiques que le régime de Sangkum devra combler après l'indépendance."
CAM_Economic.1.a: "Finançons cet effort de Son"
CAM_Economic.2.t: "Comité du Crédit Populaire et inefficacités du crédit"
CAM_Economic.2.d: "Dans le cadre de l'Union française et plus tard du système des États associés, le Kampuchéa avait accès à un Comité de Crédit Populaire local, qui fonctionnait sous la supervision de l'Office du Crédit Populaire. Créé dans le but de soutenir les investissements à petite échelle et le développement rural, le système était profondément défectueux. En 1950, notre peuple khmer n'avait accès qu'à sept établissements de crédit de ce type dans tout le royaume, ce qui limitait considérablement l'accès pour la plupart des citoyens ruraux. Hou Yuon, intellectuel khmer radical et gauchiste du Sangkum, a fustigé le système de crédit dans ses écrits. Il révéla que les prêts moyens distribués (510 piastres en 1950 ; 757 en 1951) étaient trop importants pour les paysans et allaient donc souvent aux commerçants urbains, aux propriétaires fonciers et aux petits industriels. Pire encore, ces prêts étaient rarement accordés entre mai et juillet, le pic de la saison des travaux agricoles, lorsque les agriculteurs en avaient le plus besoin. Au lieu d'alimenter des investissements ruraux productifs, le crédit a été détourné vers la spéculation commerciale et l'usure, aggravant la pauvreté rurale et renforçant la domination des élites urbaines sur les campagnes." 
CAM_Economic.2.a: "Le Bouddha a enseigné que tous les êtres vivants ont besoin du bonheur à la fois dans le travail et dans l'intellect"
CAM_Economic.3.t: "L'hypothèse de la souveraineté économique"
CAM_Economic.3.d: "Après la déclaration d'indépendance de Sihanouk en novembre 1953, le Kampuchéa commença à exercer un plus grand contrôle sur ses systèmes économique et financier. Cette transition s'est accélérée après la Conférence de Genève (1954) et le retrait formel des troupes françaises. Les ministères des Finances, du Commerce et de l'Économie nationale ont été restructurés avec notre personnel khmer autochtone, même si l'expertise technique est restée limitée. De 1950 à 1955, l'autonomie financière est progressivement arrachée au contrôle français. L'Institut d'émission des États associés d'Indochine, qui avait succédé à la Banque de l'Indochine après la Conférence de Pau de 1950, était chargé de gérer la monnaie au Vietnam, au Laos et au Kampuchéa. Cependant, les responsables cambodgiens insistèrent de plus en plus en faveur de l'indépendance monétaire, notamment après la dévaluation de la piastre indochinoise en mai 1953 (de 17 à 10 francs français), ce qui provoqua des craintes inflationnistes. Ces développements ont abouti à la création d'un système monétaire véritablement national en 1955."
CAM_Economic.3.a: "Par les Khmers, pour les Khmers !" 
CAM_Economic.4.t: "Les premiers plans biennaux"
CAM_Economic.4.d: "Sous la direction charismatique de notre prince Norodom Sihanouk, qui avait abdiqué en 1955 pour entrer en politique et lancer le mouvement Sangkum Reastr Niyum, le Kampuchea a lancé son premier plan de développement biennal. Le plan était axé sur la construction d'infrastructures de base, la modernisation de l'agriculture et l'amélioration de l'éducation et de la santé publique. Financé en partie par les réparations françaises et l'aide américaine, le plan visait à réduire la dépendance à l'égard des experts étrangers en formant des ingénieurs, des administrateurs et des techniciens khmers. Toutefois, les progrès ont été inégaux en raison de la corruption, de l'inertie bureaucratique et du sous-développement rural. Même si quelques routes et écoles ont été construites, les critiques ont fait valoir que les plans manquaient de coordination et que la majorité rurale restait marginalisée. Pourtant, ces premiers efforts de développement ont jeté les bases des futurs plans quinquennaux dans les années 1960 et ont été au coeur de l'image du Sangkum en tant que force progressiste et modernisatrice."
CAM_Economic.4.a: "On dit qu'un homme qui fait bon usage de ses richesses possède un grand trésor ; mais celui qui amasse ses richesses n'en tirera aucun profit."
CAM_Economic.5.t: "La fondation de la Banque nationale du Kampuchéa"
CAM_Economic.5.d: "Le 1er janvier 1955, une étape importante fut franchie dans l'histoire économique des Khmers ; la création de la Banque Nationale du Cambodge. La nouvelle banque centrale a pris le contrôle total de la monnaie nationale, en émettant le riel, dont la valeur officielle était fixée à 10 francs français. Le riel était adossé à des réserves d'or et de devises, et sa valeur était initialement liée à un poids d'or (25,3905 grammes), signalant un effort pour assurer la crédibilité monétaire. Cette décision marque la rupture définitive des Khmers avec le système financier indochinois et l'affirmation de leur souveraineté économique. Grâce à cela, le Kampuchea a obtenu le droit de gérer de manière indépendante sa politique monétaire, ses taux de change et ses réserves de change, même si l'économie reste fragile et dépendante des exportations agricoles. La Banque nationale a également commencé à superviser la réglementation des banques privées et à accorder des crédits commerciaux limités, même si une grande partie de l'infrastructure bancaire du Kampuchea est restée rudimentaire."
CAM_Economic.5.a: "Une fois que la richesse aura été obtenue par des moyens légaux, puissions-nous vivre longtemps et atteindre un âge avancé !"
CAM_Economic.6.t: "Kram n°83-NS"
CAM_Economic.6.d: "Dans le contexte d'un nationalisme croissant et d'un désir de construire une économie autonome, le roi Sianhouk et le gouvernement royal ont publié le Kram n° 83-NS à la fin des années 1950. Cet édit royal était un puissant texte législatif protectionniste et nationaliste. Il interdit aux étrangers d'exercer 18 professions spécifiques, dont beaucoup sont liées au commerce, aux secteurs techniques ou aux emplois de bureau. En outre, il exigeait que toutes les entreprises opérant au Cambodge emploient au moins 70 % de ressortissants khmers à tous les niveaux de travail spécialisé, non spécialisé et de bureau. Même si des exemptions temporaires étaient possibles, la loi visait à garantir que les nationalités cambodgiennes puissent désormais jouer un rôle central dans notre développement économique. Cette décision reflétait de profondes préoccupations concernant la domination économique étrangère, en particulier par les communautés vietnamienne, chinoise et française, et reflétait des tendances plus larges dans l'Asie du Sud-Est postcoloniale, où les États nouvellement indépendants cherchaient à réaffirmer leur souveraineté sur leur travail et leur capital."
CAM_Economic.6.a: "L'heure est désormais à la khmérisation de notre économie"
CAM_Military.1.t: "Signature du deuxième accord militaire franco-khmer"
CAM_Military.1.d: "Dans une étape cruciale vers une plus grande autonomie, les représentants de notre armée nationale khmère et le gouvernement ont signé le deuxième accord militaire franco-khmer. Cet accord accorde à nos forces nationales une autorité opérationnelle élargie dans les provinces de Siem Reap et de Kampong Thom, marquant un transfert significatif et progressif des responsabilités en matière de sécurité du commandement colonial français aux dirigeants khmers. Dans le cadre de cet accord, le CEFEO accordera à terme aux gouverneurs de nos Khetts des devoirs et des responsabilités anti-insurrectionnelles et des compagnies d'infanterie khmères indépendantes. Bien que toujours sous contrôle français, cette étape marque la naissance progressive d'une force armée nationale autonome."
CAM_Military.1.a: "Régulièrement et lentement..."
CAM_Military.2.t: "Fondation de l'Armée Royale des Khmers (FARK)"
CAM_Military.2.d: "Après des négociations soutenues et le démantèlement progressif du contrôle colonial, le haut commandement français en Indochine a officiellement transféré la responsabilité de la défense nationale du Cambodge à notre gouvernement dans le cadre d'un acte historique de décolonisation. Ce transfert marque la naissance de l'Armée royale khmère (FARK), la première institution militaire véritablement contrôlée par les Khmers de l'histoire moderne. Les FARK sont formées en intégrant des éléments de la Garde nationale khmère, des forces de sécurité régionales et des régiments khmers précédemment intégrés au sein de l'armée de l'Union française. Les Français ont accepté de créer une nouvelle zone de sécurité opérationnelle le long de la rive orientale du Mékong, gérée conjointement par le Groupe opérationnel français du Bas Mékong (GOBM) et les détachements des FARK. Le reste du pays relèvera désormais entièrement de la juridiction militaire khmère. Avec environ 17 000 soldats réguliers, la formation des FARK n'est pas seulement une transition technique de commandement : c'est un symbole profond de la souveraineté cambodgienne. La structure organisationnelle de l'armée reste cependant fortement dépendante de la formation, de la logistique et du personnel consultatif supérieur français. Les officiers sont encore en grande partie formés à l'étranger et la doctrine militaire continue de refléter les stratégies de l'ère coloniale, mais une nouvelle génération d'officiers khmers est déjà en train d'être formée. Sous la direction du roi Norodom Sihanouk, les FARK serviront à la fois de rempart contre l'instabilité régionale et de moyen de consolider la légitimité royale. Mais les défis restent le banditisme, les restes des insurgés pro-Viet Minh et les tensions ethniques dans le nord-est menacent la cohésion nationale. Néanmoins, avec discipline et unité, les FARK pourraient devenir la pierre angulaire de notre indépendance et de notre sécurité nationales."
CAM_Military.2.a: "Les épées et les fusils qui gardent notre souveraineté doivent désormais porter notre nom"
CAM_Military.3.t: "Création de la Marine royale khmère (MRK)"
CAM_Military.3.d: "Pour affirmer la souveraineté khmère sur nos propres voies navigables et notre littoral, le roi Norodom Sihanouk a signé un décret royal créant officiellement la Marine Royale Khmere (MRK). Cette marine naissante, chargée de défendre les frontières maritimes et fluviales du Kampuchéa, commence sa mission avec une flotte petite mais symbolique de navires de la Seconde Guerre mondiale hérités de la marine coloniale française au départ, notamment des vedettes de défense portuaire de fabrication britannique et des péniches de débarquement américaines LCM. Le MRK est placé sous le commandement du Capitaine de Vaisseau Pierre Coedes, officier de marine d'origine franco-khmère, choisi pour sa compréhension unique à la fois du terrain local et de la doctrine navale française. Avec seulement 600 marins, le MRK est de taille modeste mais riche en symbolisme national. Son siège principal est l'ancienne base fluviale française de Chrui Chhangwar, sur la péninsule faisant face à Phnom Penh. En raison de contraintes spatiales, l'état-major naval opère dans un premier temps à partir d'un ancien navire fluvial français nommé La Payotte, amarré en permanence à la base. Bien que d'origine modeste, le MRK représente l'engagement du Cambodge en faveur de la sécurité maritime, et des plans sont déjà en cours pour étendre Chrui Chhangwar en une installation navale moderne capable de soutenir les patrouilles fluviales, le contrôle des douanes et, plus tard, la défense côtière."
CAM_Military.3.a: "Des fleuves du Mékong au golfe de Thaïlande, le drapeau khmer doit flotter dignement"
CAM_Military.4.t: "Création de la Khmer Royal Air Force (AVRK)"
CAM_Military.4.d: "Un Royal Kram du prince Norodom Sihanouk a officiellement créé l'Aviation Royale Khmere (AVRK) - la première escadre aérienne nationale du Kampuchéa. L'AVRK est commandée par le colonel Dr Ngo Hou, médecin personnel de Sihanouk et proche confident du roi. Bien que les premiers observateurs se moquent de cette force naissante sous le nom de « Royal Flying Club », cette fondation symbolique marque une étape cruciale dans la quête de l'autonomie militaire du Cambodge. La flotte initiale comprend quatre avions Morane-Saulnier MS 500 Criquet, utilisés pour les tâches d'observation et de liaison, deux Cessna 180 Skywagons, un Cessna 170 et un seul Douglas DC-3 pour le transport VIP. Les conseillers militaires français restent essentiels aux opérations et à la formation, et l'AVRK est temporairement placé sous le contrôle du Département de l'Inspecteur général du Génie de l'Armée. Bien que limité en capacités de combat, l'AVRK permet à notre espèce khmère de commencer à développer des capacités de reconnaissance, de coordination et de transport VIP. Sa création est un puissant symbole de modernisation et d'indépendance nationale."
CAM_Military.4.a: "Que la souveraineté du Kampuchéa atteigne le ciel"
CAM_Military.5.t: "Fondation du Collège naval Chrui Chhangwar"
CAM_Military.5.d: "Conscient du besoin urgent de marins et d'officiers qualifiés, le roi Sihanouk a ordonné l'agrandissement de la base navale exiguë de Chrui Chhangwar, la transformant en la première académie navale nationale du Kampuchea, l'École navale. Tandis que les aspirants officiers supérieurs (Eleves Officiers de Marine) continuent de recevoir une formation avancée à l'Académie navale française de Brest, ce Collège naval se concentrera sur la formation des hommes de troupe et des sous-officiers pour équiper les forces fluviales et côtières en pleine expansion du Kampuchéa. Un nouveau quai et une caserne moderne sont en construction pour accompagner la croissance future de la Marine Royale Khmere. Avec cette étape, notre espèce khmère commencera à constituer un cadre de professionnels navals formés localement, essentiels à l'indépendance et au développement à long terme."
CAM_Military.5.a: "Toute grande marine commence avec des écoles et des marins"
CAM_Military.6.t: "Fondation du Pochentong Air Force College"
CAM_Military.6.d: "Avec le concours des instructeurs français du Corps expéditionnaire d'Extrême-Orient (CEFEO), le Kampuchéa a inauguré sa première école de pilotage militaire : l'Ecole de l'Air Royale, sur l'aérodrome de Pochentong, près de Phnom Penh. Cette installation formera la première génération de pilotes militaires khmers, connus sous le nom d'Eleves Pilotes Khmers (EPK). Alors que de nombreux EPK termineront encore leurs études à l'Ecole de l'air de Salon-de-Provence, en France, l'école de Pochentong permet au Kampuchéa de former des pilotes au niveau national, une étape clé dans la construction d'une force aérienne khmère autonome. À mesure que les futurs groupes de pilotes seront diplômés, l'armée de l'air khmère s'étendra progressivement au-delà de la reconnaissance pour atteindre des rôles de transport et de combat, jetant ainsi les bases d'un commandement aérien robuste."
CAM_Military.6.a: "Les ailes de la souveraineté doivent apprendre à voler."
# Tooltips
CAM_Chinese_PRC_Victory_tt: "Les communistes ont pris le contrôle du continent"
CAM_Chinese_ROC_Victory_tt: "Les nationalistes ont pris le contrôle du continent"

#### FRE Focuses ####
# FRE 50's Focus Names
FRE_The_Situation_in_Route_Coloniale_4: "La situation sur la Route Coloniale 4"
FRE_The_Situation_in_Route_Coloniale_4_desc: "La Route Coloniale 4 (RC4) représente une artère d'approvisionnement essentielle reliant le delta du fleuve Rouge à la frontière chinoise. La situation le long de cette route est devenue de plus en plus précaire à mesure que les forces du Viet Minh ont intensifié leurs attaques contre les convois et les avant-postes français. Nous devons procéder à une évaluation globale de la situation sécuritaire, identifier les points vulnérables et élaborer des stratégies pour sécuriser cette bouée de sauvetage vitale. La perte du RC4 romprait notre lien avec la frontière nord et enhardirait l'ennemi."
FRE_The_Fallout_of_the_Revers_Report: "Les retombées du rapport Revers"
FRE_The_Fallout_of_the_Revers_Report_desc: "Le rapport critique du général Revers sur la stratégie française en Indochine a créé une tempête politique à Paris. Le rapport met en évidence les faiblesses stratégiques, les échecs logistiques et remet en question la viabilité de notre approche actuelle. Même si les critiques sont sévères, elles nous obligent à affronter des vérités inconfortables sur nos opérations militaires. Nous devons répondre à ces préoccupations, mettre en oeuvre les réformes nécessaires et rétablir la confiance dans notre structure de commandement. Les conséquences politiques menacent de saper le soutien à l'effort de guerre, tant au niveau national que parmi nos alliés."
FRE_Send_De_lattre_de_Tassigny: "Envoyé de Lattre de Tassigny"
FRE_Send_De_lattre_de_Tassigny_desc: "Face à la dégradation de la situation, Paris a décidé d'envoyer le général Jean de Lattre de Tassigny prendre le commandement du corps expéditionnaire français d'Extrême-Orient. De Lattre possède une réputation de leadership décisif, de vision stratégique et de capacité à inspirer à la fois les troupes et les civils. Son arrivée représente un nouveau chapitre de notre campagne, marqué par une énergie renouvelée, des tactiques agressives et une détermination à inverser la tendance. Sous son commandement, nous réorganiserons nos forces, renforcerons nos défenses et combattrons l'ennemi avec une vigueur renouvelée."
FRE_Prepare_for_the_Battle_of_Na_San: "Préparez-vous à la bataille de Na San"
FRE_Prepare_for_the_Battle_of_Na_San_desc: "Na San a été identifiée comme une position défensive critique qui pourrait servir de bastion contre les avancées du Viet Minh dans le nord-ouest. L'emplacement offre des avantages défensifs naturels et, avec des fortifications appropriées, il pourrait devenir une forteresse imprenable. Nous devons préparer la position avec de vastes fortifications, stocker des fournitures et positionner nos forces pour repousser tout assaut ennemi. Une défense réussie à Na San démontrerait notre capacité à occuper des positions clés et fournirait un modèle pour les futures opérations défensives."
FRE_Operation_Lorraine: "Opération Lorraine"
FRE_Operation_Lorraine_desc: "L'offensive de Giap au nord-ouest a mis Nghia Lo, le pays Tai et la nouvelle tête aérienne de Na San sous pression. Salan propose une grande diversion en remontant la rivière Clear : des groupes mobiles et des parachutistes frapperont les dépôts de ravitaillement autour de Phu Doan, obligeant l'ennemi à tourner vers l'est sous peine de perdre les magasins derrière son offensive.\n\nLes dépôts sont réels, tout comme le chemin du retour. Nous pouvons nous enfoncer profondément et accepter le danger, effectuer un raid plus court ou maintenir les groupes mobiles près de Na San. La Lorraine soutiendra la bataille du Nord-Ouest ; cela ne deviendra pas une seconde guerre avec sa propre paix."
FRE_Operation_Hirondelle: "Opération Hirondelle"
FRE_Operation_Hirondelle_desc: "Hirondelle est un raid aéroporté contre les dépôts du Viet Minh autour de Lang Son et Ky Lua, pas une offensive territoriale. Aucune province ne doit être prise. Le CEFEO doit conserver en stock les avions de transport, ou avoir reçu ses moyens aériens, pendant §Y14 jours consécutifs§! avec un engagement léger, §Y10§! avec un engagement standard ou §Y7§! avec un engagement maximum. La perte de cette capacité aérienne réinitialise le décompte. Terminez le raid par jour §Y20§! pour un résultat propre ; le succès ultérieur est coûteux et l'opération se termine le jour §Y30§!."
FRE_Prepare_for_the_Battle_of_Vinh_Yen: "Préparez-vous pour la bataille de Vinh Yen"
FRE_Prepare_for_the_Battle_of_Vinh_Yen_desc: "Vinh Yen représente un test crucial de nos capacités défensives et de la vision stratégique de de Lattre. La bataille déterminera si nous pouvons défendre avec succès des positions clés contre les assauts déterminés du Viet Minh. La préparation implique de fortifier les positions, de se coordonner avec les forces vietnamiennes et de garantir des approvisionnements et des renforts adéquats. Une victoire à Vinh Yen validerait le leadership de de Lattre et apporterait un regain de moral indispensable, tout en démontrant notre détermination à tenir bon."
FRE_Recruit_Germans_to_the_FFL: "Recruter des Allemands dans la FFL"
FRE_Recruit_Germans_to_the_FFL_desc: "La Légion étrangère française est depuis longtemps une source de soldats expérimentés et motivés. Au lendemain de la Seconde Guerre mondiale, de nombreux anciens combattants allemands se retrouvent sans perspectives dans un pays dévasté. Ces hommes, aguerris par des années de combats, représentent une ressource précieuse pour nos forces. En recrutant activement des vétérans allemands dans la Légion étrangère, nous pouvons renforcer nos rangs avec des soldats expérimentés qui comprennent la guerre moderne. Cette campagne de recrutement permettra d'élargir nos capacités opérationnelles et de nous fournir une main d'oeuvre supplémentaire pour nos campagnes."
FRE_Secure_American_Financing: "Financement américain sécurisé"
FRE_Secure_American_Financing_desc: "Le fardeau financier de la guerre d'Indochine a mis à rude épreuve l'économie française. Le soutien américain est devenu de plus en plus crucial, non seulement pour des raisons financières, mais aussi en tant que symbole de la solidarité occidentale contre l'expansion communiste. L'obtention d'un financement américain substantiel nous fournira les ressources nécessaires pour soutenir nos opérations, moderniser nos équipements et maintenir nos forces sur le terrain. Ce soutien renforce également le fondement politique de notre campagne et démontre l'engagement international envers notre cause."
FRE_Operation_Mouette: "Opération Mouette"
FRE_Operation_Mouette_desc: "Prenez et maintenez la province §YPhu Nho Quan§! en surbrillance dans l'État §YThanh Hoa§!, ainsi que §YNinh Binh§! ou §YPhat Diem§! dans §YDong Bang Song Hong§!. Les forces de l'Union française doivent occuper les positions requises pendant §Y5 jours consécutifs§!; perdre l'objectif réinitialise le décompte. Terminez la prise par jour §Y30§! pour un succès net ; le succès ultérieur est coûteux et l'opération se termine le jour §Y45§!.\n\nNe confondez pas Phu Nho Quan avec la ville de Thanh Hoa. L'occupation de la ville, ou des terrains appartenant au Viet Minh à Lang Son, Cao Bang, Dong Bac Bo, Nghe-Tinh ou Quang Binh, provoque §Rune surextension opérationnelle§!."
FRE_Prepare_for_the_Battle_of_Mao_Khe: "Préparez-vous à la bataille de Mao Khe"
FRE_Prepare_for_the_Battle_of_Mao_Khe_desc: "Mao Khe présente un autre défi défensif critique. La position doit être prête à résister aux attaques ennemies déterminées tout en servant de base pour les opérations futures. Une bonne préparation implique non seulement des fortifications militaires, mais également une coordination avec les forces locales, la collecte de renseignements et la garantie d'un soutien logistique adéquat. Une défense réussie à Mao Khe validerait davantage notre stratégie défensive et fournirait un autre exemple de notre capacité à conserver des positions clés face à un nombre supérieur."
FRE_Operation_Brochet: "Opération Brochet"
FRE_Operation_Brochet_desc: "Le Viet Minh ouvrira les combats. Les forces de l'Union française doivent tenir la §YCentral Day River Line§! en §YDong Bang Song Hong§! le §Yjour 35§!, date limite finale de l'opération. Le tenir sans interruption donne un franc succès. S'il chute et est repris au jour 35, le résultat est coûteux ; si elle n'a pas lieu ce jour-là, Brochet échoue.\n\nN'avancez pas sur le terrain appartenant au Viet Minh à Lang Son, Cao Bang ou dans les zones arrière de Dong Bac Bo, Thanh Hoa, Nghe-Tinh et Quang Binh : cela provoquerait §RSurextension opérationnelle§!."
FRE_Operation_Castor: "Opération Castor"
FRE_Operation_Castor_desc: "L'opération Castor (Beaver) est l'une des opérations les plus ambitieuses de la guerre : l'établissement d'une tête aérienne à Dien Bien Phu. Cette vallée isolée du nord-ouest du Vietnam servira de base pour interdire les routes d'approvisionnement ennemies en provenance du Laos et contester le contrôle du Viet Minh sur la région. L'opération nécessite un soutien aérien étendu, une planification minutieuse et l'engagement de ressources importantes. Le succès créerait un avantage stratégique majeur, mais l'échec pourrait entraîner la perte d'une garnison entière. Les enjeux ne pourraient pas être plus élevés."
FRE_Hedgehog_Network: "Un réseau de hérissons"
FRE_Hedgehog_Network_desc: "Na San a prouvé qu'un camp fortifié sur une piste d'atterrissage peut saigner une division Viet Minh. Cela n'a pas prouvé qu'un seul camp puisse tenir tout le nord-ouest. Au lieu de placer les corps d'armée dans une seule vallée isolée, nous durcirons Na San, Lai Chau et Luang Prabang et ferons payer à l'ennemi pour chacune d'elles."
FRE_Hedgehog_Network_tt: "Dépensez §R120§! §YCrédits de guerre§!, §R4§! §YMetropole Patience§! et §R3 000§! de main d'oeuvre.\nFortifiez §YNa San§!, §YLai Chau§! et §YLuang Prabang§!. Chacun reçoit une garnison de hérissons : deux groupes si la Patience est supérieure à 65, sinon un. Na San en obtient un de plus s'il a déjà tenu.\n§YAucun camp ne sera construit à Dien Bien Phu.§! Si le Viet Minh marche sur la vallée, il n'y trouvera aucune forteresse et aucune bataille décisive à gagner."
FRE_Hedgehog_Base: "Socle Hérisson"
FRE_Hedgehog_Base_desc: "Une base retranchée et alimentée en air du réseau hérisson CEFEO."
FRE_Preparing_for_the_Final_Push: "Se préparer à l'effort final"
FRE_Preparing_for_the_Final_Push_desc: "Alors que la guerre entre dans sa phase critique, nous devons nous préparer à ce qui pourrait être la campagne décisive. Cet effort final nécessitera la coordination de toutes nos ressources, l'engagement de nos meilleures unités et le soutien de nos alliés. Nous devons veiller à ce que nos forces soient correctement équipées, bien entraînées et prêtes à relever les défis à venir. Le résultat de cette ultime avancée déterminera l'avenir de l'Indochine française et façonnera le paysage géopolitique de l'Asie du Sud-Est pour les décennies à venir."
FRE_Proclaim_Victory_in_Indochina: "Proclamer la victoire en Indochine"
FRE_Proclaim_Victory_in_Indochina_desc: "Contre toute attente, nous avons remporté la victoire en Indochine. L'ennemi a été vaincu, ses forces dispersées et son leadership brisé. Ce triomphe représente le point culminant d'années de sacrifice, de planification stratégique et d'excellence militaire. Nous pouvons désormais proclamer la victoire et entamer le processus d'établissement d'un gouvernement stable et pro-français au Vietnam. Cette victoire sécurise les intérêts français dans la région et démontre l'efficacité de notre stratégie militaire et politique."
FRE_The_Geneva_Accords: "Les Accords de Genève"
FRE_The_Geneva_Accords_desc: "Face aux coûts croissants, aux pressions politiques et à la prise de conscience qu'une solution militaire pourrait être irréalisable, nous avons accepté de participer aux négociations de paix à Genève. Ces accords représentent une solution diplomatique au conflit, qui aboutira probablement à la partition du Vietnam et au retrait des forces françaises. Même s'ils ne constituent pas la victoire que nous recherchions, les Accords de Genève offrent une voie pour mettre fin à l'effusion de sang et établir un cadre pour les relations futures. La conférence déterminera le sort de l'Indochine et façonnera l'avenir de la région."
FRE_The_Fall_of_Saigon: "La chute de Saïgon"
FRE_The_Fall_of_Saigon_desc: "L'impensable s'est produit : Saigon est tombée aux mains de l'ennemi. Cette défaite catastrophique représente l'effondrement complet de notre position en Indochine. La perte de la capitale, siège de l'État du Vietnam, marque la fin de l'influence française dans la région. Nos forces sont en désarroi, nos alliés ont perdu confiance et notre position stratégique a été complètement ébranlée. Il ne s'agit pas seulement d'une défaite militaire, mais d'une catastrophe politique et stratégique qui aura de lourdes conséquences pour la France et l'ensemble de la région."

# Finale availability tooltips (gated on the actual Indochina War outcome)
FRE_Proclaim_Victory_Available_tt: "§GVictoire décisive§!: la cause anticommuniste §Y§! doit clairement dominer la lutte - plus du double du score communiste, et au-dessus de 1000.\n\nEt la carte doit correspondre au grand livre. §RDien Bien Phu ne doit pas être tombé§!et §Raucun des hauts plateaux de Tai, Hoa Binh, Ha Giang, les zones de base du Pathet Lao ou les marches Nung ne peuvent être passés à Hanoi§!."
FRE_The_Geneva_Accords_Available_tt: "§YImpasse§!: disponible lorsque la guerre a atteint un résultat §Yindécis§! - aucune des deux parties n'a gagné de manière décisive. C'est la voie médiane négociée."
FRE_The_Fall_of_Saigon_Available_tt: "§RDéfaite catastrophique§!: la cause communiste §R§! doit clairement dominer la lutte - plus du double du score anticommuniste, et au-dessus de 1000."

#### FRE Events ####
# Narrative Events
FRE_Events.1.t: "La situation sur la Route Coloniale 4"
FRE_Events.1.d: "Le briefing du matin apporte de sombres nouvelles. La Route Coloniale 4, notre artère d'approvisionnement essentielle reliant le delta du fleuve Rouge à la frontière chinoise, est devenue de plus en plus vulnérable. Les rapports des services de renseignement indiquent que les forces du Viet Minh ciblent systématiquement nos convois, établissent des embuscades et coupent nos lignes de communication. La situation exige une attention immédiate : nous ne pouvons permettre que cette bouée de sauvetage vitale soit rompue.\n\nLorsque vous examinez les cartes réparties sur votre bureau, le poids du commandement s'installe sur vous. Chaque convoi perdu signifie que moins de ravitaillements parviennent à nos positions avancées. Chaque dépassement d'avant-poste enhardit l'ennemi. L'évaluation doit être approfondie, la réponse décisive. Vos officiers d'état-major attendent vos ordres, leurs visages reflétant la gravité de la situation. Le sort de nos opérations dans le Nord pourrait bien dépendre de la manière dont nous gérons cette crise."
FRE_Events.1.a: "Nous devons évaluer la situation immédiatement."

FRE_Events.2.t: "Les retombées du rapport Revers"
FRE_Events.2.d: "Le rapport du général Revers est arrivé comme un coup de tonnerre, et ses échos parviennent déjà à Paris. Le document est cinglant dans ses critiques de notre stratégie, de notre logistique et de notre approche globale de la guerre. Revers n'a pas mâché ses mots : il a mis à nu les faiblesses de notre position, les échecs de notre planification et les insuffisances de notre réponse à la menace du Viet Minh.\n\nVotre bureau est devenu un centre de tempête. Des télégrammes de Paris demandent des explications. Vos subordonnés se tournent vers vous pour obtenir des conseils. La presse, française et étrangère, commence à s'en emparer. Les conséquences politiques menacent de saper le soutien à l'effort de guerre à un moment critique. Vous devez faire face à cette crise, non seulement pour défendre votre commandement, mais aussi pour rétablir la confiance dans notre mission. La question est : comment réagissez-vous ?"
FRE_Events.2.a: "Nous répondrons de front à ces critiques."

FRE_Events.3.t: "Un nouveau commandant arrive"
FRE_Events.3.d: "Les nouvelles de Paris sont à la fois bienvenues et inquiétantes. Le général Jean de Lattre de Tassigny a été nommé pour prendre le commandement du corps expéditionnaire français d'Extrême-Orient. De Lattre est une légende, un homme qui s'est distingué au cours des deux guerres mondiales, connu pour son génie stratégique, sa capacité à inspirer les troupes et sa détermination sans compromis. Son arrivée représente un nouveau chapitre dans cette guerre.\n\nMais les transitions de commandement sont des choses délicates. De Lattre aura besoin de temps pour comprendre la situation, établir des relations avec votre état-major, se coordonner avec les forces vietnamiennes et mettre en oeuvre sa vision. L'ennemi n'attendra pas. Vous devez veiller à ce que cette transition se fasse en douceur, à ce que l'arrivée de de Lattre apporte l'énergie et la direction dont nous avons désespérément besoin, plutôt que de créer de la confusion et des retards. Le succès de son commandement dépend de la manière dont vous faciliterez son arrivée."
FRE_Events.3.a: "Nous veillerons à la réussite de l'intégration de De Lattre."




# Success Events
FRE_Events.7.t: "Évaluation RC4 terminée"
FRE_Events.7.d: "L'évaluation est terminée et les résultats sont encourageants. Vos équipes de renseignement ont identifié les principales vulnérabilités le long de la Route Coloniale 4, cartographié les positions ennemies et élaboré un plan complet pour sécuriser la route. Des avant-postes supplémentaires ont été créés, les procédures de convoi ont été améliorées et la coordination entre les unités a été renforcée.\n\nLa route est désormais plus sécurisée, même si la menace demeure. Votre évaluation a fourni des renseignements précieux qui éclaireront les opérations futures. Les tactiques de l'ennemi ont été documentées, leurs positions identifiées et des contre-mesures mises en oeuvre. Il s'agit d'une base solide pour un succès futur."
FRE_Events.7.a: "Excellent travail."

FRE_Events.9.t: "Rapport d'annulation traité"
FRE_Events.9.d: "Votre réponse au rapport Revers a été bien accueillie. En reconnaissant les critiques fondées tout en démontrant votre engagement en faveur de l'amélioration, vous avez réussi à transformer une crise potentielle en une opportunité de réforme. La situation politique s'est stabilisée et le soutien à l'effort de guerre a été maintenu.\n\nLes changements que vous avez mis en oeuvre répondent à de nombreuses préoccupations de Revers. La logistique a été améliorée, la coordination renforcée et la planification stratégique affinée. Même si des défis subsistent, vous avez démontré que le commandement est capable de s'adapter et de s'améliorer."
FRE_Events.9.a: "Nous avons résisté à la tempête."

FRE_Events.11.t: "l'arrivée de de Lattre est un succès"
FRE_Events.11.d: "Le général de Lattre est arrivé et son impact se fait immédiatement sentir. La transition s'est déroulée en douceur, son style de leadership a dynamisé le commandement et sa vision stratégique a apporté une nouvelle clarté à nos opérations. Les troupes réagissent à sa présence avec une confiance renouvelée, et votre état-major s'est parfaitement intégré à sa structure de commandement.\n\nL'arrivée de De Lattre marque un tournant. Son approche agressive, son souci du détail et sa capacité à inspirer ont déjà commencé à transformer la campagne. Grâce à son leadership, nous avons une réelle chance de renverser le cours de cette guerre."
FRE_Events.11.a: "Un nouveau chapitre commence."




# Failure Events
FRE_Events.8.t: "Évaluation RC4 incomplète"
FRE_Events.8.d: "L'évaluation de la Route Coloniale 4 a rencontré d'importantes difficultés. Les activités ennemies ont perturbé la collecte de renseignements, les positions clés n'ont toujours pas été évaluées et le tableau d'ensemble que vous espériez ne s'est pas concrétisé. La situation le long de RC4 reste floue et des vulnérabilités persistent.\n\nL'évaluation incomplète signifie que les opérations futures le long de cette route critique se poursuivront avec moins d'informations que souhaité. L'ennemi conserve l'avantage de l'incertitude et nos capacités de réponse sont limitées."
FRE_Events.8.a: "Nous devons faire mieux."

FRE_Events.10.t: "Les retombées du rapport d'inversion continuent"
FRE_Events.10.d: "Votre réponse au rapport Revers n'a pas réussi à apaiser la tempête politique. Les critiques continuent de résonner, le soutien à l'effort de guerre a été encore plus fragilisé et la situation politique s'est détériorée. L'impact du rapport a été amplifié plutôt qu'atténué.\n\nLes conséquences de cet échec continueront d'affecter les opérations. Le soutien politique est affaibli, le moral a souffert et la situation stratégique est devenue plus difficile. Il s'agit d'un revers important."
FRE_Events.10.a: "C'est un coup dur."

FRE_Events.12.t: "l'arrivée de de Lattre problématique"
FRE_Events.12.d: "L'arrivée du général de Lattre a été plus difficile que prévu. La transition a été difficile, la coordination a été difficile et l'intégration de son style de commandement avec les structures existantes a rencontré des frictions. Si les qualités de leadership de de Lattre sont indéniables, l'impact immédiat a été mitigé.\n\nLa période de transition a été plus longue et plus perturbatrice que prévu. Même si de Lattre finira par établir son commandement, le retard a donné des opportunités à l'ennemi et la période initiale a été moins efficace qu'elle aurait pu l'être."
FRE_Events.12.a: "Nous devons surmonter ces difficultés."




#### FRE Decisions ####
FRE_Mission_Assess_RC4: "Évaluer la Route Coloniale 4"
FRE_Mission_Assess_RC4_desc: "Déployer des équipes de renseignement pour mener une évaluation complète de la Route Coloniale 4. Cette mission nécessite un pouvoir politique pour coordonner la collecte de renseignements, une stabilité pour maintenir la sécurité opérationnelle et un soutien de guerre adéquat pour garantir la disponibilité des ressources. Le succès dépend de la disponibilité d'un capital politique suffisant, de conditions internes stables et de stocks d'équipements adéquats pour soutenir les équipes d'évaluation."

FRE_Mission_Address_Revers_Report: "Retombées du rapport d'annulation d'adresse"
FRE_Mission_Address_Revers_Report_desc: "Répondre à la crise politique créée par le rapport critique du général Revers. Cette mission nécessite un pouvoir politique important pour gérer la crise, une grande stabilité pour résister à la tempête politique et un fort soutien de guerre pour maintenir la confiance du public. Le succès de cette mission dépend fortement de votre capital politique et de la stabilité de votre gouvernement."

FRE_Mission_De_Lattre_Arrival: "Assurer l'arrivée réussie de de Lattre"
FRE_Mission_De_Lattre_Arrival_desc: "Faciliter la transition au commandement du général de Lattre. Cette mission nécessite un pouvoir politique pour coordonner la transition, une stabilité pour assurer le bon déroulement des opérations et un soutien de guerre pour maintenir le moral pendant le changement de leadership. Le succès dépend de la disponibilité de ressources adéquates et de conditions stables pour soutenir l'intégration de de Lattre dans la structure de commandement."




# Mission Tooltips
FRE_Mission_Assess_RC4_Available_tt: "Facteurs de réussite de la mission :\n- Pouvoir politique : 50+ PP (+5%), 100+ PP (+5%), 150+ PP (+5%)\n- Stabilité : 25%+ (+3%), 40%+ (+4%), 55%+ (+3%)\n- Soutien de guerre : 20 %+ (+3 %), 35 %+ (+3 %), 50 %+ (+2 %)\n- Équipement d'infanterie : 5k+ (+4%), 10k+ (+4%), 20k+ (+4%)"

FRE_Mission_Address_Revers_Report_Available_tt: "Facteurs de réussite de la mission :\n- Pouvoir politique : 50+ PP (+5 %), 100+ PP (+7 %), 150+ PP (+8 %)\n- Stabilité : 25%+ (+5%), 40%+ (+8%), 55%+ (+7%)\n- Soutien de guerre : 20 %+ (+3 %), 35 %+ (+4 %), 50 %+ (+3 %)"

FRE_Mission_De_Lattre_Arrival_Available_tt: "Facteurs de réussite de la mission :\n- Pouvoir politique : 50+ PP (+6 %), 100+ PP (+6 %), 150+ PP (+6 %)\n- Stabilité : 25%+ (+5%), 40%+ (+5%), 55%+ (+5%)\n- Soutien de guerre : 20 %+ (+3 %), 35 %+ (+4 %), 50 %+ (+3 %)"




#### FRE Resource Trading Decisions ####
FRE_Trade_PP_For_Equipment: "Acheter du matériel avec un capital politique"
FRE_Trade_PP_For_Equipment_desc: "Utiliser l'influence politique pour acquérir des équipements d'infanterie de base auprès de fournisseurs français. Nécessite 50 PP et accorde 5 000 unités d'équipement. Une option d'approvisionnement modeste lorsque des fournitures immédiates sont nécessaires."

FRE_Trade_PP_For_Support_Equipment: "Acheter du matériel de soutien avec un capital politique"
FRE_Trade_PP_For_Support_Equipment_desc: "Utilisez votre influence politique pour acquérir du matériel de soutien pour vos forces. Nécessite 50 PP et accorde 1 000 unités. Indispensable pour maintenir une bonne logistique et l'efficacité de l'unité."

FRE_Trade_Stability_For_War_Support: "Rassembler le soutien du public"
FRE_Trade_Stability_For_War_Support_desc: "Lancer une campagne de propagande pour renforcer le soutien du public à l'effort de guerre. Nécessite plus de 15 % de stabilité, coûte 5 % de stabilité et accorde 8 % de soutien de guerre. Échangez la cohésion interne contre l'enthousiasme du public."

FRE_Trade_War_Support_For_Stability: "Restaurer la stabilité interne"
FRE_Trade_War_Support_For_Stability_desc: "Concentrez-vous sur la gouvernance interne et la stabilité au prix de l'enthousiasme du public pour la guerre. Nécessite plus de 15 % de soutien de guerre, coûte 5 % de soutien de guerre et accorde 8 % de stabilité. Utile lorsque la stabilité interne est critique."

FRE_Trade_Equipment_For_PP: "Vendre du matériel pour le capital politique"
FRE_Trade_Equipment_For_PP_desc: "Liquider les stocks d'équipement excédentaires pour générer du capital politique. Nécessite plus de 10 000 équipements d'infanterie, vend 10 000 unités et accorde 40 PP. Un échange modeste alors que le capital politique est nécessaire de toute urgence."

FRE_Shady_Political_Work: "S'engager dans des manoeuvres politiques douteuses"
FRE_Shady_Political_Work_desc: "Utiliser des tactiques politiques sournoises pour gagner de l'influence. Nécessite plus de 10 % de soutien de guerre, coûte 3 % de soutien de guerre et accorde 25 PP. Risqué mais efficace lorsqu'on a désespérément besoin de capital politique."

FRE_Expedited_Equipment_Procurement: "Achat accéléré d'équipement"
FRE_Expedited_Equipment_Procurement_desc: "Tirez sur toutes les ficelles pour acquérir rapidement du matériel. Nécessite plus de 100 PP et plus de 25 % de stabilité, coûte 100 PP et 3 % de stabilité, et accorde 12 000 équipements d'infanterie et 2 000 équipements de soutien. Un package d'approvisionnement complet pour les opérations critiques."

#### FRE Operation Events ####




FRE_Events.23.t: "Opération Castor : Dien Bien Phu"
FRE_Events.23.d: "L'opération Castor transformera la vallée isolée de Dien Bien Phu en un camp fortifié aéroporté. Le largage ne peut commencer que tant que les troupes alignées sur la France contrôlent toujours le terrain d'atterrissage. Une fois engagés, ils doivent le conserver pendant quatorze jours consécutifs pendant que les ingénieurs organisent le périmètre et la passerelle aérienne. Si le contrôle est rompu, le décompte recommence ; au bout de trente jours, l'effort est abandonné.\n\nUn largage complet engage plus de transports, de main-d'oeuvre et de crédit politique pour établir une garnison plus grande. Un largage limité est moins cher et laisse le camp plus exposé. L'établissement de la tête aérienne prépare la position pour la bataille à venir ; il ne gagne pas cette bataille d'avance."
FRE_Events.23.a: "Engagez tout le groupe aéroporté."
FRE_Events.23.b: "Faites une descente limitée avec l'ascenseur disponible."
FRE_Events.23.c: "Nous ne pouvons pas maintenir l'opération."
FRE_Castor_Full_Drop_tt: "Dépensez §Y[?FRE.FRE_Castor_Full_Price|0] Crédits de guerre§!, engagez §Y4 000 points de main d'oeuvre§! et §Y6 avions de transport§!et perdez §R6 Patience métropolitaine§!. Brochet et Na San se sont déjà reflétés dans ce prix. Le groupe aéroporté complet établit une garnison de camp renforcée. Maintenir le terrain d'atterrissage pendant §Y14 jours consécutifs§! dans une fenêtre d'établissement de §Y30 jours§!."
FRE_Castor_Limited_Drop_tt: "Dépensez §Y[?FRE.FRE_Castor_Limited_Price|0] Crédits de guerre§!, engagez §Y2 500 points de main d'oeuvre§! et §Y4 avions de transport§!et perdez §R3 Patience Métropole§!. Brochet et Na San se sont déjà reflétés dans ce prix. Un groupe aéroporté plus petit établit une garnison de camp plus légère. Maintenir le terrain d'atterrissage pendant §Y14 jours consécutifs§! dans une fenêtre d'établissement de §Y30 jours§!."
FRE_Castor_Unfunded_tt: "Le focus se ferme sans déploiement aéroporté. Aucun camp n'est établi et l'Opération Castor entre en temps de recharge."

#### FRE Operation Success/Failure Events ####








FRE_Events.32.t: "Opération Castor : Dien Bien Phu établie !"
FRE_Events.32.d: "Pendant quatorze jours, les parachutistes, les ingénieurs et les équipages aériens ont maintenu le terrain d'atterrissage ouvert. Le périmètre est organisé, les premiers travaux permanents sont terminés et la vallée peut désormais recevoir une garnison aérienne soutenue. L'Opération Castor a établi le camp qu'elle avait reçu l'ordre de construire.\n\nLa réalisation est préparatoire et non décisive. Dien Bien Phu reste isolée, dépendante de la passerelle aérienne et exposée aux hauteurs qui l'entourent. Si le Viet Minh engage sa force principale ici, la survie du camp sera décidée par la campagne qui suivra."
FRE_Events.32.a: "La tête aérienne est établie. Préparez-vous à le défendre."

FRE_Events.33.t: "L'opération Castor se termine"
FRE_Events.33.d: "Le groupe aéroporté n'a pas pu assurer la sécurité du terrain d'atterrissage de Dien Bien Phu pendant quatorze jours consécutifs. Des contre-attaques ont brisé à plusieurs reprises le périmètre et la fenêtre d'établissement de trente jours s'est refermée. Les détachements survivants sont en train d'être retirés avant que la passerelle aérienne exposée n'absorbe davantage la réserve expéditionnaire.\n\nAucun camp fortifié n'a été établi. Les hommes perdus et la confiance politique sont à la hauteur de l'ampleur du déploiement tenté."
FRE_Events.33.d_unfunded: "Les moyens de transport et le crédit politique nécessaires, même pour un déploiement aéroporté limité, n'étaient pas disponibles. L'opération Castor a été supprimée du calendrier sans installer de garnison dans la vallée. Aucun camp n'a été établi."
FRE_Events.33.d_landing_lost: "Le terrain d'atterrissage de Dien Bien Phu a été perdu avant que le déploiement aéroporté puisse commencer. Faute de bande sécurisée sur laquelle organiser le périmètre, l'opération Castor a été annulée. Aucun transport ni formation expéditionnaire n'a été engagé et aucun camp fortifié n'a été établi."
FRE_Events.33.d_superseded: "Les événements ailleurs ont dépassé la tête aérienne proposée. La guerre ou son règlement régissant désormais l'ensemble du théâtre, le déploiement aéroporté se déroule sans prétendre ni à un succès opérationnel ni à une défaite sur le champ de bataille."
FRE_Events.33.a: "Fermez le grand livre de l'opération."

#### FRE Operation Mission Decisions ####
FRE_Mission_Operation_Lorraine: "Opération Lorraine"
FRE_Mission_Operation_Lorraine_desc: "Engager les groupes mobiles dans une offensive majeure du nord contre les arrières du Viet Minh. Le succès nécessite des ressources substantielles et un itinéraire de retour sûr."
FRE_Mission_Operation_Lorraine_Available_tt: "L'Opération Lorraine dépend :\n- §YPouvoir politique§!: Plus de 100 PP\n- §YÉquipement§!: Stocks d'infanterie et de matériel de soutien\n- §YExpérience de l'Armée§!: Efficacité au combat\n- Les groupes mobiles atteignent leur objectif et reviennent sains et saufs"




FRE_Mission_Operation_Castor: "Opération Castor : Dien Bien Phu"
FRE_Mission_Operation_Castor_desc: "Gardez le contrôle français du terrain d'atterrissage de Dien Bien Phu pendant §Y14 jours consécutifs§! pendant que la tête aérienne est établie. La perte de contrôle réinitialise le décompte des prises. L'opération échoue si l'objectif n'est pas atteint pendant la fenêtre d'établissement §Yde 30 jours§!."
FRE_Mission_Operation_Castor_Available_tt: "Le groupe aéroporté est déjà engagé. Conserver le terrain d'atterrissage de Dien Bien Phu jusqu'à ce que le camp soit établi."

