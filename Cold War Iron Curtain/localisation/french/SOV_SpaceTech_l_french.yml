# Spacecraft Construction

 SOV_woodmetal_frames:0 "Fusée R-1"
 SOV_woodmetal_frames_short:0 "R-1"
 SOV_woodmetal_frames_desc:0 "La fusée R-1 (nom de rapport OTAN SS-1 Scunner, nom de code soviétique SA11, indice GRAU 8A11) était un missile balistique tactique fabriqué en Union soviétique sur la base de la fusée allemande V-2. Même s'il s'agissait d'une copie, elle a été fabriquée dans des usines industrielles soviétiques et a apporté aux Soviétiques une expérience précieuse qui a ensuite permis à l'URSS de construire ses propres fusées beaucoup plus performantes. Le système de missiles R-1 est entré en service dans l'armée soviétique le 28 novembre 1950."

 SOV_pressure_vessel1:0 "R-5 Pobéda"
 SOV_pressure_vessel1_short:0 "R-5 Pobéda"
 SOV_pressure_vessel1_desc:0 "Le R-5 Pobeda (« Victoire ») était un missile balistique de théâtre développé par l'Union soviétique pendant la guerre froide. La version R-5M reçut le nom de rapport OTAN SS-3 Shyster et portait l'indice GRAU 8K51. Le R-5 était à l'origine un développement de l'OKB-1 en tant que missile à un étage doté d'un véhicule de rentrée à ogive amovible. Le R-5M était un missile nucléaire - le premier missile nucléaire déployé par l'Union soviétique - doté d'une charge utile et d'un poids plus importants mais d'une meilleure fiabilité que son prédécesseur. Le R-5M a donné à l'Union soviétique la possibilité de cibler de nombreuses cibles stratégiques en Europe. Le R-5M est entré en service le 21 mai 1956 (a pris sa retraite en 1967) et a été installé en 1959 à Vogelsang, Zehdenick et Fürstenberg/Havel en Allemagne de l'Est - les premières bases de missiles nucléaires soviétiques en dehors de l'URSS."


 SOV_pressure_vessel2:0 "Vostok"
 SOV_pressure_vessel2_short:0 "Vostok"
 SOV_pressure_vessel2_desc:0 "Vostok (russe : Восток, traduit par « Est ») était une famille de fusées dérivées de l'ICBM soviétique R-7 Semyorka et a été conçue pour le programme de vols spatiaux habités. Cette famille de fusées a lancé le premier satellite artificiel (Spoutnik 1) et le premier vaisseau spatial avec équipage (Vostok) de l'histoire de l'humanité. Il s'agissait d'un sous-ensemble de la famille de fusées R-7. Le 18 mars 1980, une fusée Vostok-2M explose sur sa rampe de lancement à Plesetsk lors d'une opération de ravitaillement, tuant 48 personnes. Une enquête sur un accident similaire - mais évité - a révélé que le remplacement de la soudure à base de plomb par de la soudure à base d'étain dans les filtres à peroxyde d'hydrogène avait permis la décomposition du H2O2, provoquant ainsi l'explosion qui en a résulté."

 SOV_pressure_vessel3:0 "N1/L3"
 SOV_pressure_vessel3_short:0 "N1/L3"
 SOV_pressure_vessel3_desc:0 "Le N1/L3 (Raketa-nositel', « Carrier Rocket » ; cyrillique : Н1) était un lanceur super lourd destiné à transporter des charges utiles au-delà de l'orbite terrestre basse. Le N1 était l'équivalent soviétique du Saturn V américain et était destiné à permettre des voyages en équipage vers la Lune terrestre et au-delà, avec des études commençant dès 1959. Son premier étage reste l'étage de fusée le plus puissant jamais construit, mais les quatre premiers étages du N1 Block A ont échoué parce qu'un manque de tirs d'essai statiques signifiait que les problèmes de plomberie et d'autres caractéristiques défavorables avec le grand groupe de trente moteurs et son système complexe d'alimentation en carburant et en comburant n'ont pas été révélés plus tôt."


 SOV_pressure_vessel4:0 "Énergie"
 SOV_pressure_vessel4_short:0 "Énergie"
 SOV_pressure_vessel4_desc:0 "Energia (GRAU 11K25) était un lanceur ultra-lourd. Il a été conçu par NPO Energia de l'Union soviétique pour diverses charges utiles, notamment le vaisseau spatial Bourane. La principale entreprise de développement du système de contrôle était l'ONG Khartron \"Electropribor\". L'Energia utilisait quatre boosters à sangle, chacun alimenté par un moteur RD-170 à quatre chambres brûlant du kérosène/LOX, et un étage central avec quatre moteurs RD-0120 (11D122) à chambre unique alimentés par de l'hydrogène liquide/LOX. Le lanceur avait deux variantes opérationnelles fonctionnellement différentes : Energia-Polyus, la configuration de test initiale, dans laquelle le système Polyus était utilisé comme étape finale pour mettre la charge utile en orbite, et Energia-Buran, dans laquelle les orbiteurs de classe Bourane étaient la charge utile et la source de l'impulsion d'insertion en orbite. Le lanceur avait la capacité de placer environ 100 tonnes en orbite terrestre basse, jusqu'à 20 tonnes en orbite géostationnaire et jusqu'à 32 tonnes en orbite translunaire. Trajectoire vers l'orbite lunaire. Le lanceur n'a effectué que deux vols en orbite avant d'être abandonné. Depuis 2016, des tentatives ont été faites pour relancer le lanceur."


 SOV_pressure_vessel5:0 "Angara-A5"
 SOV_pressure_vessel5_short:0 "Angara-A5"
 SOV_pressure_vessel5_desc:0 "\"Angara-A5\" - lanceur russe lourd de la famille \"Angara\". Le carburant de fusée respectueux de l'environnement (oxygène + kérosène) permet de réduire la charge environnementale des lancements sur l'environnement. Il est lancé avec cinq modules de fusée universels URM-1, équipés de moteurs RD-191 (quatre modules dans le premier étage et un dans le second)."


 SOV_pressure_vessel6:0 "Ienisseï"
 SOV_pressure_vessel6_short:0 "Ienisseï"
 SOV_pressure_vessel6_desc:0 "Yenisei, nom du projet RN STK-1 (Raketa-Nositel' SverkhTyazhologo Klassa - Lanceur super-lourd de classe), est le premier lanceur super-lourd développé par l'industrie spatiale russe. Le développeur principal est RSC Energia. Il est développé dans le cadre du programme cible fédéral « Création d'un complexe de fusées spatiales de classe super-lourde pour 2020-2030 » et le coût du programme est estimé à 1 500 milliards de roubles. C'est la fusée principale du programme lunaire russe. La conception finale de la fusée devrait être achevée d'ici l'automne 2021. Le premier lancement devrait avoir lieu en 2028 depuis le cosmodrome de Vostochny. Basé sur le lanceur Yenisei, le lanceur Don (RN STK-2) est développé en ajoutant un autre étage."


# Propulsion
 SOV_liquid_propellant:0 "NK-9 (8D517)"
 SOV_liquid_propellant_short:0 "NK-9 (8D517)"
 SOV_liquid_propellant_desc:0 "NK-9 (8D517) est un moteur-fusée à propergol liquide développé par le SNTK im. N.D. Kuznetsova. Depuis mai 1959, le développement des moteurs-fusées à propergol liquide a commencé. L'un des premiers moteurs de fusée développés fut le moteur NK-9. Le NK-9 était destiné au premier étage du missile intercontinental GR-1 « Global-1 » (SS-10 selon la classification OTAN). Il s'agissait du premier moteur au monde à oxygène-kérosène dans la classe de poussée supérieure à 1 MN, fabriqué en circuit fermé avec postcombustion des gaz du générateur dans la chambre de combustion. Pour le deuxième étage de cette fusée, le moteur NK-9V a été développé. Ses essais débutèrent en septembre 1962. Au début des années 1960, sur la base du NK-9, les LPRE NK-19 et NK-21 furent créés pour les troisième et quatrième étages du lanceur N1."


 SOV_nuclear_pulse_propulsion:0 "RD-0410"
 SOV_nuclear_pulse_propulsion_short:0 "RD-0410"
 SOV_nuclear_pulse_propulsion_desc:0 "Le RD-0410 était un moteur-fusée nucléaire thermique soviétique. Le moteur a été testé au sol sur le site d'essai de Semipalatinsk et son utilisation a été intégrée à la proposition de mission avec équipage Kurchatov sur Mars 1994. Ce moteur avait des performances légèrement supérieures (température d'échappement et impulsion spécifique) à celles du NERVA (le projet américain de moteur de fusée nucléaire thermique). La conception du coeur du réacteur comprenait une isolation thermique entre le combustible carbure d'uranium/carbure de tungstène et le modérateur à hydrure de zirconium. Cette solution a permis une conception du coeur du réacteur très compacte. Le flux d'hydrogène a refroidi le modérateur, permettant d'abord de conserver une très faible énergie neutronique et une section efficace de fission élevée, puis il a été chauffé par le contact direct avec les crayons de combustible. Pour empêcher la réaction chimique entre le carbure et l'hydrogène, environ 1 pour cent d'heptane a été ajouté à l'hydrogène après le passage du modérateur."


# Data Transmission

 SOV_geosynchronous_network:0 "Cyclone"
 SOV_geosynchronous_network_short:0 "Cyclone"
 SOV_geosynchronous_network_desc:0 "Cyclone (la version civile du système est connue sous le nom de \"Tsikada\") - le premier système de navigation par satellite en URSS, construit sur la base des vaisseaux spatiaux (SC) \"Cyclone\" et SC \"Zaliv\" (indice GUKOS - 11F617), qui comprenait trois complexes matériels : Tsunami-AM sur satellites artificiels terrestres, Tsunami-BM (P-790) sur navires et Tsunami-VM sur installations terrestres."

