l_french:
 taz.1.d:0 "La majorité des habitants de Zanzibar sont des Africains noirs. Malgré cela, la minorité arabe domine le paysage politique comme un vestige de l'ingérence britannique au XIXe siècle. Mais cela a changé aujourd'hui. Après les élections générales de 1963, les Africains noirs, menés par John Okello, se sont soulevés contre le sultan et la minorité arabe. En seulement trois heures, 300 à 600 soldats africains ont pris le contrôle des commissariats de police et des bâtiments gouvernementaux, obligeant le sultan à fuir le pays. Certains en ont cependant profité pour se venger des Arabes, en assassinant entre 5 000 et 12 000 personnes."
 taz.2.d:0 "Fusion de la Tanzanie et de Zanzibar."