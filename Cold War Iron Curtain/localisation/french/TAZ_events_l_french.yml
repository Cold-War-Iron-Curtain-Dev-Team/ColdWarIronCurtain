l_french:
 taz.1.d:0 "La population de Zanzibar est majoritairement composée d'Africains noirs. Malgré cela, la minorité arabe, héritage de l'ingérence britannique du XIXe siècle, exerce une influence politique considérable. Mais la situation a évolué. Après les élections truquées de 1963, les Africains noirs, menés par John Okello, se sont soulevés contre le sultan et la minorité arabe. En trois heures seulement, entre 300 et 600 soldats africains ont pris le contrôle des commissariats et des bâtiments gouvernementaux, contraignant le sultan à l'exil. Certains ont cependant profité de l'occasion pour se venger des Arabes, faisant entre 5 000 et 12 000 victimes."
 taz.2.d:0 "Fusion de la Tanzanie et de Zanzibar."