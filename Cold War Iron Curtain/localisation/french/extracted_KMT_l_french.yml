 prc.1000.a2:0 "Les inondations semblent être un problème chinois."
 prc.1000.d2:0 "La Chine a connu l'une des inondations les plus catastrophiques de son histoire. Le fleuve Jaune a de nouveau inondé ses rives. La dernière crue du fleuve Jaune remonte à 1938, lorsque le gouvernement nationaliste chinois détruisit les digues afin d'arrêter l'avancée japonaise. Cette fois, plus de 790 000 pieds cubes d'eau ont inondé le fleuve Jaune, quel que soit le nombre de digues qui ont tenu. Le gouvernement chinois a reçu l'aide soviétique pour créer un système de gestion des crues du fleuve Jaune. Le bilan est estimé à plus de 500 000 morts lors de l'inondation de 1938, mais aucune information officielle n'a été publiée. Zhou Enlai, le Premier ministre chinois, a visité la zone sinistrée."
 prc.1000.t2:0 "[GetNewspaperHeader]Inondations du fleuve Jaune"
