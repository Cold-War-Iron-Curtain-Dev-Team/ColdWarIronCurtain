 WHITE_ETHNIC_INFO_TT:0 "La population §YBlanc de souche§! représente le nombre de §YBlanc de souche§! immigrants et de leurs descendants dans un État donné. Ce groupe serait principalement composé de §CIrlandais§!, §CItaliens§!, §CHongrois§!, §CPolonais§! et d'autres §CEuropéens de l'Est§! §YEthnicités§!.\n\n§YLes Blancs de souche§! sont principalement §YCatholiques Romains§! ou §PChrétiens Orthodoxes§! et ont systématiquement des comportements électoraux et des priorités différents de ceux des électeurs blancs plus assimilés, en particulier ceux qui sont §TProtestants§!.\n\nCe groupe représente un §YGroupe Oscillant§! important, §CDécisions de Politique Étrangère§! impliquant des §YNations Européennes§! spécifiques auront un §RImpact Électoral Disproportionné§! sur ce §YGroupe d'Électeurs.§!"
