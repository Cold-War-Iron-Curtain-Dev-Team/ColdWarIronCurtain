 USA_70s_flavor.1.d:0 "La série policière à succès Columbo, qui se déroule dans un contexte de meurtres inversés, vient de terminer sa troisième saison et a été renouvelée pour une quatrième. Si elle reste très populaire aux États-Unis, elle fait sensation à l’étranger. Le lieutenant mal fagoté et fumeur de cigares jouit d’une certaine réputation en Roumanie, car c’est l’une des rares séries télévisées occidentales autorisées à être diffusées dans le pays. Les fans roumains sont si dévoués que le gouvernement communiste craint des troubles si les gens commencent à croire que Columbo cessera d’être diffusé ou que le gouvernement ne renouvellera pas la licence de diffusion de la série. Les derniers épisodes n’ont pas encore été diffusés dans le pays.\n\nLes fans sont tellement inquiets qu’ils ont contacté le Département d’État pour demander que l’acteur Peter Falk, jouant le rôle du lieutenant Columbo, filme un message au peuple roumain. Un projet a déjà été préparé qui les rassure sur le fait que d’autres épisodes seront diffusés cet automne et que Columbo ne quittera pas les écrans de la télévision roumaine, du moins pendant un an.  Le message sera ajouté au dernier épisode lors de sa diffusion en Roumanie, en mai prochain. Le Département d’État soutient cette idée et la considère comme une victoire facile en matière de politique publique. Plus important encore, nous pouvons exercer un certain soft power sur le bloc de l’Est."
