 USA80MIL_The_Strategic_Defense_Initiative_desc:0 "Sur ordre du président [USA.GetLeader], le département de la Défense commencera à travailler sur l'Initiative de défense stratégique, un programme conçu pour renforcer la défense antimissile américaine ICBM et améliorer la technologie spatiale dans la défense de notre pays."
 USA80MIL_Secure_Additional_Funding_desc:0 "Afin de garantir le succès de l'IDS, la nouvelle Organisation de l'Initiative de Défense Stratégique (SDIO) au sein du Département de la Défense coordonnera le niveau de financement approprié pour soutenir notre mission."
 USA80MIL_Recruit_Additional_Scientists_and_Contractors_desc:0 "Sous la direction du général James Alan Abrahamson, nous allons coordonner nos efforts avec des agences fédérales telles que la NASA, l'American Physical Society et de grands entrepreneurs de la défense comme Lockheed Martin afin de procéder à un échange de personnel et de ressources pour lancer nos activités de recherche et développement."
 USA80MIL_Begin_Star_Wars_Development_desc:0 "Maintenant que la SDIO dispose de financements et de personnel, nous pouvons commencer à élaborer notre stratégie pour ce que le président [USA.GetLeader] a appelé « Guerre des étoiles ». Certains experts ont suggéré une approche défensive, tandis que d'autres ont proposé une approche plus offensive."
 USA80MIL_Develop_Warning_and_Missile_Defense_Systems_desc:0 "Étant donné que nous nous concentrons sur les systèmes défensifs, la première étape logique serait de déterminer et de développer de nouveaux systèmes d'alerte et de défense antimissile afin de détecter et d'intercepter les missiles balistiques intercontinentaux soviétiques bien avant qu'ils n'atteignent leurs cibles sur le territoire continental des États-Unis et en Europe."
 USA80MIL_Expand_Space_and_Ground_Tracking_Systems_desc:0 "L’extension de nos installations de suivi par satellite déjà construites à travers le monde est indispensable dans cette stratégie de défense, tout comme le placement de davantage de satellites en orbite pour détecter les lancements depuis les champs de missiles soviétiques au Kazakhstan."
 USA80MIL_Build_Brilliant_Pebbles_desc:0 "Enfin, nos ingénieurs commenceront à développer et à construire ce que l'on appelle le système « Brilliant Pebbles », qui consiste en des milliers de petits satellites conçus sur le même modèle que les missiles air-air, destinés à intercepter et à détruire les missiles balistiques intercontinentaux soviétiques entrants dès leur lancement depuis leurs bases."
 USA80MIL_Develop_ERIS_from_Surplus_ICBMs_desc:0 "En utilisant nos missiles balistiques intercontinentaux excédentaires, le personnel de l'IDS développera le système d'interception des véhicules de rentrée exoatmosphériques (ERIS), qui sera un système terrestre utilisé comme solution de secours."
 USA80MIL_Develop_the_BM_C3_System_desc:0 "Pour coordonner les activités opérationnelles de l'IDS, le système de gestion des opérations/commandement, contrôle et communications, ou système BM/C3, sera développé pour unifier efficacement toutes les branches du programme IDS et garantir l'intégrité opérationnelle."
 USA80MIL_Develop_the_Advanced_Launch_System_desc:0 "Afin de garantir une capacité de lancement adéquate et efficace pour nos systèmes orbitaux, le système de lancement avancé (ALS) sera développé. En s'appuyant sur nos meilleurs fournisseurs des secteurs spatial et de la défense, l'ALS vise à offrir une capacité de lancement à un dixième du coût actuel, tout en permettant des charges utiles plus importantes."
 USA80MIL_Develop_Offensive_Missile_Systems_desc:0 "Au lieu de se concentrer sur une stratégie purement défensive, l'IDS privilégiera une stratégie offensive, en commençant par des systèmes de missiles conçus pour intercepter les missiles balistiques intercontinentaux soviétiques entrants dans la partie supérieure de leur trajectoire."
 USA80MIL_Look_into_Space_Based_LASER_Systems_desc:0 "Notre personnel a soumis diverses propositions pour des systèmes de faisceaux LASER terrestres et spatiaux, conçus pour intercepter les missiles entrants avec un faisceau non projectile à haute énergie."
 USA80MIL_Begin_Designing_a_Hypervelocity_Gun_desc:0 "Nos experts étudient également la faisabilité de la conception d'une série de canons hypervéloces, notamment des canons à rails et des canons à propulsion électromagnétique conçus pour envoyer un projectile à des vitesses extrêmement élevées afin d'intercepter les missiles soviétiques entrants."
 USA80MIL_Build_a_Manned_Orbiting_Weapons_Platform_desc:0 "Enfin, l'IDS testera la faisabilité de la construction d'une plateforme d'armement orbitale habitée qui dirigera les opérations de détection et d'interception depuis l'orbite, ainsi que la coordination avec les systèmes et unités de commandement au sol."
 USA80MIL_Finalize_SDI_Report_desc:0 "Maintenant que notre processus de recherche, de développement et de conception est terminé, l'équipe SDI doit rédiger un rapport exhaustif, comprenant des résultats, des recommandations et des propositions, à l'intention du Département de la Défense, du Président et du Congrès américain, afin de déterminer la faisabilité de la poursuite du programme."
 USA80MIL_Select_the_F_22_for_the_ATF_Program_desc:0 ""
