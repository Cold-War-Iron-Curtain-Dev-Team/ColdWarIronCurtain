 Kennedy88.1.d:0 "Depuis son élection, Edward Kennedy a impulsé ce que de nombreux historiens politiques appellent le « Retour à Camelot », en référence à l'administration « Camelot » de son frère aîné, le regretté Teddy Kennedy, au début des années 1960. En seulement huit ans, depuis l'élection de ce dernier, le bilan est lourd. Sur le plan économique, Kennedy a décrété un gel de l'inflation pendant six mois, lancé l'application massive de la loi Humphrey-Hawkins sur le plein emploi, signé la loi d'ajustement des recettes de 1984, augmenté considérablement le salaire minimum et entrepris de nouvelles réformes fiscales. Sur le plan social, le président Kennedy a joué un rôle déterminant dans la lutte pour l'amendement sur l'égalité des droits, ainsi que dans la légalisation de l'homosexualité, la gestion de la crise du sida qui progressait rapidement et la mise en œuvre de réformes indispensables dans les secteurs de l'éducation et des transports. En matière de politique étrangère, le président Kennedy n'a pas présenté de propositions particulièrement novatrices, hormis son appel à un gel nucléaire massif et l'instauration de sanctions contre le régime d'apartheid sud-africain avec la loi globale anti-apartheid. De nombreux historiens et observateurs sont convaincus que John est fier de son plus jeune frère et qu'il permet à la dynastie Kennedy de se perpétuer, menant l'Amérique vers un avenir radieux."
