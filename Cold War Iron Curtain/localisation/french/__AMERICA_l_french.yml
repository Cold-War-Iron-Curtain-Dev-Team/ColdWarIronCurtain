 BVAP_INFO_TT:0 "§YBVAP§! §C(Population noire en âge de voter)§! représente le pourcentage de la population adulte d'un État ou d'un district donné §YAfro-américaine§! Population en âge de voter : cet indicateur a été défini par les tribunaux pour aider à résoudre les litiges relatifs au redécoupage électoral liés à la manipulation raciale des circonscriptions.\n\nLa population afro-américaine §Y[USA_SEN_MAP_TARGET.GetName]§! is §C[?USA_SEN_MAP_TARGET.Black_Population_Percentage|0]%§!."
