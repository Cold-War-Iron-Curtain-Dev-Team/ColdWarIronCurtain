 Campaign_Report.1.t:0 "Début de la Convention nationale démocrate de 1952"
 Campaign_Report.1a.t:0 "Début de la Convention nationale démocrate de 1952"
 Campaign_Report.2.t:0 "Délégations contestées"
 Campaign_Report.3.t:0 "L'engagement de fidélité"
 Campaign_Report.4.t:0 "Stevenson annonce sa volonté d'être nominé"
 Campaign_Report.5.t:0 "Le programme relatif aux droits civiques"
 Campaign_Report.6.t:0 "Estes Kefauver candidat à la présidence lors de la Convention nationale démocrate"
 Campaign_Report.7.t:0 "Estes Kefauver se lance dans la course à la présidence"
 Campaign_Report.8.t:0 "Le vice-président Alban Barkley annonce sa candidature à la présidence."
 Campaign_Report.9.t:0 "Alben Barkley désigné candidat à la présidence lors de la Convention nationale démocrate"
 Campaign_Report.10.t:0 "Adlai Stevenson désigné candidat à la présidence lors de la Convention nationale démocrate"
 Campaign_Report.1.d:0 "Alors que la chaleur estivale s'installe aux États-Unis, les instances politiques du parti actuellement au pouvoir s'efforcent de rallier le soutien de la population à la désignation d'un candidat à la présidence. Harry Truman n'ayant toujours pas nommé de successeur, de nombreux noms émergent dans l'espoir de s'assurer le contrôle du pouvoir exécutif pour le Parti démocrate.\n\n Malgré les efforts d'Harry Truman pour apaiser les divisions croissantes au sein du parti, les réactions contrastées d'admiration et d'hostilité envers le mouvement naissant des droits civiques n'ont fait qu'exacerber les dissensions chez les démocrates. Selon l'issue de la convention, la direction du parti pourrait assister à une révolte ouverte de sa base électorale si aucun compromis n'est trouvé.\n\n C'est dans ce contexte de crise d'identité que se positionnent les candidats potentiels à l'investiture du parti. Le vice-président Alban Barkley bénéficierait du soutien d'Harry Truman s'il décidait de se présenter à la Maison-Blanche, mais la situation reste incertaine alors que la convention se tient. Le sénateur du Tennessee, Estes Kefauver, se positionne comme candidat populiste pour rallier le groupe parlementaire, les réformateurs libéraux recherchent l'appui du vétéran William Harriman, et les démocrates conservateurs du Sud privilégient le ségrégationniste virulent Richard Russell Jr.\n\n Parallèlement, Adlai Stevenson est sérieusement envisagé par les idéalistes et les progressistes du parti, à son grand regret. Stevenson a publiquement exprimé son souhait que le parti ne le désigne pas comme candidat à la présidence, désirant ardemment rester gouverneur de l'Illinois et se tenir à l'écart du Bureau ovale.\n\nQuoi qu'il en soit, la convention devrait se dérouler comme prévu, et à moins d'efforts d'unification du parti, des convictions profondément ancrées et une morale inflexible risquent de compromettre la campagne des démocrates pour la Maison-Blanche."
 Campaign_Report.1a.d:0 "Alors que la chaleur estivale s'installe aux États-Unis, les instances politiques du parti actuellement au pouvoir s'efforcent de rallier le soutien de la population à la désignation d'un candidat à la présidence. Harry Truman n'ayant toujours pas nommé de successeur, de nombreux noms émergent, chacun cherchant à s'assurer le contrôle du pouvoir exécutif pour le Parti démocrate.\n\n Malgré les efforts d'Harry Truman pour apaiser les divisions croissantes au sein du parti, les réactions contrastées, entre admiration et hostilité, envers le mouvement naissant des droits civiques n'ont fait qu'exacerber les dissensions chez les démocrates. Selon l'issue de la convention, la direction du parti pourrait assister à une révolte ouverte de sa base électorale si aucun compromis n'est trouvé.\n\n C'est dans ce contexte de crise d'identité que se présentent les candidats potentiels à l'investiture du parti. Le président sortant, Harry Truman, a courageusement annoncé sa candidature à un second mandat, mais le soutien du parti à sa présidence étant encore incertain, nombreux sont ceux qui s'interrogent sur ses chances de succès. Face à Truman, le sénateur du Tennessee, Estes Kefauver, se présente comme candidat populiste, espérant rallier le groupe parlementaire. Les réformateurs libéraux recherchent le soutien de l'homme d'État chevronné William Harriman, tandis que les démocrates conservateurs du Sud privilégient le ségrégationniste virulent Richard Russell Jr.\n\n Parallèlement, Adlai Stevenson est sérieusement envisagé par les idéalistes et les progressistes du parti, à son grand regret. Stevenson a publiquement exprimé son souhait que le parti ne le désigne pas comme candidat à la présidence, désirant ardemment rester gouverneur de l'Illinois et se tenir à l'écart de la Maison-Blanche.\n\nQuoi qu'il en soit, la convention devrait se dérouler comme prévu, et à moins d'efforts d'unification du parti, des convictions profondément ancrées et une morale inflexible risquent de compromettre la campagne des démocrates pour la Maison-Blanche."
 Campaign_Report.2.d:0 "Alors que la Convention nationale démocrate s'ouvre, la crainte d'une répétition des problèmes qui ont miné la convention de 1948 refait surface. Les tensions croissantes entre libéraux et démocrates du Sud s'exacerbent, et comme en 1948, les militants du Parti démocrate redoutent une nouvelle grève qui pourrait ébranler l'appareil du parti pour la deuxième fois. Mais cette fois, le mouvement pourrait ne pas venir d'un seul camp.\n\nTout a commencé au sein du sous-comité des pouvoirs du DNC, où les débats entre démocrates du Sud intransigeants et libéraux radicaux ont atteint leur paroxysme, chaque camp défendant avec acharnement son désir d'être délégué à la délibération présidentielle.\n\nC'est de ces attaques personnelles entre les membres les plus radicaux du parti qu'est née la « Coalition du Nord », un bloc de pouvoir formé par le candidat populiste Estes Kefauver avec le soutien de William Harriman et des libéraux, tous furieux du refus de l'appareil du parti de destituer les démocrates du Sud. convention.\n\nAvec la perspective d'une sortie des Dixiecrats comme en 1948 déjà très réelle, la possibilité soudaine que l'aile gauche du parti fasse exactement la même chose dans l'autre sens, si le débat sur les sièges tourne mal, constitue une menace tout aussi perturbatrice pour la plateforme du parti démocrate."
 Campaign_Report.3.d:0 "Il n’est pas surprenant que l’animosité persistante des côtés conservateur et libéral du Parti démocrate en soit venue à s’affronter une fois de plus, et cela pourrait bien expliquer un nouveau développement concernant la position de plus en plus inflexible du côté libéral de l’allée ; une proposition de la Coalition du Nord aux Dixiecrats, qui pourrait être, comme certains le craignent, un ultimatum susceptible de diviser le parti.\n\nÀ l’origine un défi lancé par l’ancien député du Texas Maury Maverick, la Coalition du Nord de démocrates à l’esprit libéral ; Kefauver, Harriman, Maverick, entre autres, irrités par l’obstination continue des conservateurs du Sud, a collectivement exigé un engagement de loyauté des Dixiecrats afin de mettre de côté leur mépris et de soutenir unilatéralement les nominations du parti à la présidence.\n\nBien qu’il ne soit pas encore certain que les Dixiecrats cèdent au nom de la solidarité du parti, cela reste néanmoins une véritable révélation quant à quel point le parti est devenu divisé ; bien que les démocrates ne soient pas étrangers aux querelles internes, cette initiative de la Coalition pourrait solidifier des frontières idéologiques au-delà du compromis, et prépare le terrain pour un éventuel bouleversement dans la sélection du candidat du parti."
 Campaign_Report.4.d:0 "Malgré de multiples tentatives pour convaincre le cadre du parti du contraire, le vénérable chouchou libéral du DNC, Adlai Stevenson, considéré par beaucoup comme le successeur naturel des héritages du New Deal de Roosevelt et Truman, semble prêt à recevoir le soutien du parti pour la course à la présidence.\n\nPossédant une humilité et une honnêteté extrêmement rares chez les politiciens, Stevenson avait prévu, et insisté, pour se représenter à la réélection au poste de gouverneur de l’Illinois, poursuivant sa réputation de dur contre la corruption lors d’un nouveau mandat à la convention.\n\nAvec son sens caractéristique de l’humour humble et autodérisoire, encore une fois un trait peu commun parmi les politiciens, Stevenson a finalement cédé à l’insistance des membres établis du parti, Harry Truman entre autres, et a accepté le souhait du parti de présenter son nom sur le bulletin de vote.\n\nL’affection particulière du Parti démocrate pour Stevenson irrite ses collègues républicains, certains au RNC, et même quelques démocrates de la classe ouvrière, raillant Stevenson comme un gros bonnet indécis ; néanmoins, la popularité de Stevenson dans tous les coins de la convention montre un immense potentiel en tant que candidat à la nomination."
 Campaign_Report.5.d:0 "Occupant de plus en plus le devant de la scène du discours américain, à la fois en tant que politique nationale et point d’appui culturel, la colère croissante face à la poursuite de l’application des lois Jim Crow, en plus de l’impossibilité pour les Américains non blancs de prospérer dans le climat actuel, a dépassé le dialogue interpartis au sein de la Convention nationale démocrate.\n\nNe voulant pas provoquer une nouvelle désertion des Dixiecrats comme cela s’est produit en ’48, le président sortant Harry Truman a fait preuve de la plus grande prudence pour aborder la question des droits civiques avec plus de doigté, en formulant une plateforme qui ne réclamait pas le soutien d’une Commission pour l’égalité des pratiques d’emploi (FEPC), mais qui se concentrait plutôt sur une attaque contre le tristement célèbre Règlement 22 du Sénat, en élaborant un plan de modifications des procédures du Congrès afin d’assurer un vote plus rapide, un moyen d’empêcher tout Dixiecrat d’obstruer toute législation sur les droits civiques qu’ils pourraient tenter de faire adopter ultérieurement.\n\nPendant ce temps, les arguments des côtés gauche et droit de la législature continuent de s’intensifier ; la convention a vu s’affronter les sénateurs Herbert Lehman de New York et John Sparkman de l’Alabama, le premier annonçant à la presse son intention de s’engager pleinement pour la cause des droits civiques, le second, malgré son antipathie personnelle envers les Dixiecrats, maintenant une position ferme sur les droits des États.\n\nSi un quelconque consensus pour la nomination à la présidence doit être atteint, il faudra trouver une solution à la question des droits civiques, de peur que le parti ne sombre davantage dans des querelles encore plus intenses."
 Campaign_Report.6.d:0 "La Convention nationale démocrate, après une longue période de délibérations et de querelles internes au parti, est enfin parvenue à une conclusion, et le Parti démocrate a, enfin, trouvé un accord sur la nomination du parti pour la présidence.\n\nLes fidèles du parti ont inscrit le nom du sénateur Estes Kefauver sur le bulletin présidentiel ; les piliers de la Coalition du Nord sont en liesse, tandis que les Dixiecrats conservateurs sont furieux, les spectateurs ont acclamé lorsque l’inflammable homme politique du Tennessee est monté sur scène pour accepter avec grâce et fierté la nomination du parti.\n\nL’opposition républicaine est horrifiée de voir un autre populiste du Sud avec des ambitions pour la Maison-Blanche, et entre la réputation éclatante de Kefauver pour la lutte contre la corruption et sa position nettement libérale sur les droits civiques, beaucoup craignent le potentiel pour Kefauver d’être la réincarnation de Huey Long.\n\nMises à part les comparaisons avec le défunt Kingfish, il est clair que l’antipathie envers les lois Jim Crow commence à mettre la direction du parti sous pression, et si Kefauver est aussi progressiste qu’il le semble, une présidence Kefauver pourrait bien faire émerger un grand nombre de questions, y compris celle de la ségrégation.\n\nLa manière dont un candidat comme Kefauver se comporterait en tant que Commandant en chef dans le vaste théâtre de la Guerre froide reste à voir."
 Campaign_Report.7.d:0 "Un autre nom s’est lancé dans la course aux prochaines primaires présidentielles, sous la forme du sénateur Estes Kefauver, qui a annoncé sa campagne pour la nomination du Parti démocrate.\n\nOriginaire du Tennessee, Kefauver est célébré comme un libéral défiant, ainsi que pour sa réputation dans la lutte contre les monopoles et la corruption, faisant de lui un rare progressiste dans un État par ailleurs dominé par les conservateurs Dixiecrats.\n\nKefauver a rapidement lié son image de campagne à celle de la vieille frontière américaine, apparaissant en public portant un bonnet en peau de raton inspiré de Daniel Boone, et faisant même campagne auprès de diverses communautés des Appalaches via des traîneaux à chiens.\n\nIl reste à voir jusqu’où Kefauver ira dans la campagne ; les Dixiecrats étant irrités par son soutien modéré aux droits civiques, tandis que les démocrates établis, y compris Harry Truman en particulier, le considèrent comme un populiste risquant de fragmenter les rangs du parti.\n\nAvec la Convention nationale démocrate à l’horizon, le temps dira si la campagne de Kefauver résonnera auprès de la population électorale."
 Campaign_Report.8.d:0 "L’élection primaire du Parti démocrate a connu un développement assez surprenant dans la prochaine course présidentielle ; seulement quelques mois après l’annonce du président Truman qu’il ne briguerait pas un second mandat, le vice-président en poste des États-Unis, le vétéran homme d’État Alben Barkley, avec le soutien d’un groupe de démocrates basés à Washington, a officiellement annoncé sa candidature à la Maison-Blanche.\n\nAyant exercé la politique depuis 1912, Barkley a été un libéral déclaré même à travers les tumultes des deux guerres mondiales, et malgré le fait qu’il soit dans la soixantaine avancée avec de multiples problèmes de santé signalés, peu de personnes contesteraient que l’éminence grise du Kentucky ne possède pas l’expérience nécessaire pour le poste de président.\n\nCela ne signifie pas que tous au sein du parti sont enthousiastes à l’égard de Barkley ou de ses chances au sein du parti ; bien qu’il bénéficie du soutien de Harry Truman et d’un large éventail de fidèles du parti, de nombreux démocrates ouvriers s’inquiètent que l’âge avancé de Barkley le rende inéligible à la fonction, et avec des candidats comme Richard Russell et Estes Kefauver déjà en lice, peu sont convaincus des chances de Barkley aux urnes.\n\nBien qu’il reste inconnu si le Parti démocrate se ralliera à Barkley lors de la Convention nationale, le vice-président a clairement montré un engagement énergique envers la campagne, et avec le soutien potentiel de Washington combiné à celui du président, la candidature de Barkley aux primaires offre une possibilité de renversement."
 Campaign_Report.9.d:0 "Après une convention âprement disputée, le Parti démocrate a décidé de la mise en avant d’un candidat pour la Maison-Blanche lors de l’élection de 1952, et malgré la colère de plusieurs délégués du parti, le parti est plus ou moins uni dans la confirmation du candidat désigné.\n\nLe vice-président en poste, Alben Barkley, pilier du parti depuis près de quatre décennies, a obtenu le soutien nécessaire pour consolider sa course à la Maison-Blanche ; les démocrates ouvriers restent belliqueux à la lumière de l’âge de Barkley, tandis que les Dixiecrats et la Coalition du Nord sont sceptiques quant à sa performance potentielle dans la campagne à venir.\n\nLa foule du DNC a accueilli le vieil Barkley par des applaudissements ; le vice-président a remercié les membres du parti pour sa nomination, que beaucoup considéraient auparavant comme improbable, et a promis de défendre les principes de liberté que les présidents Truman, Roosevelt et Wilson avaient incarnés avant lui, convaincu, après avoir vu les États-Unis d’Amérique survivre aux années éprouvantes des deux guerres mondiales, que le peuple américain pourrait affronter la lutte à venir la tête haute.\n\nLes proclamations du vice-président, jugées naïves par certains lors de la convention, pourraient bien constituer une norme difficile à respecter face à la menace omniprésente de la Guerre froide, un défi que Barkley sera forcé d’affronter s’il sort victorieux en novembre."
 Campaign_Report.10.d:0 "Les délibérations interpartis à la Convention nationale démocrate, après une semaine d’intenses débats entre les intransigeants du parti, ont finalement abouti à un accord sur un candidat pour la Maison-Blanche.\n\nConsidéré par certains comme un candidat de compromis, et par d’autres comme l’option logique, le gouverneur de l’Illinois, Adlai Stevenson, pratiquement couronné par Truman et ses partisans comme l’héritier chargé de poursuivre le New Deal de Roosevelt, a été confirmé par le DNC en tant que candidat présidentiel.\n\nS’adressant à une foule bruyante, avec son sens caractéristique de l’humanité et de la compassion pleinement visible, le candidat démocrate Stevenson a exhorté à l’unité, non seulement au sein du parti, mais aussi dans tout le pays, citant l’incertitude des temps, au nom d’un avenir meilleur.\n\n« Lorsque le tumulte et les cris se tairont, lorsque les orchestres se seront tus et que les lumières se seront tamisées, il restera la dure réalité de la responsabilité à une heure de l’histoire hantée par ces spectres maigres et sombres de conflit, de dissension et de matérialisme à l’intérieur du pays, et par un pouvoir implacable, insondable et hostile à l’étranger. L’épreuve du vingtième siècle, l’ère la plus sanglante et la plus turbulente de toute l’époque chrétienne, est loin d’être terminée. Le sacrifice, la patience, la compréhension et une volonté inflexible pourront être notre lot pour les années à venir. Affrontons-le ; parlons raisonnablement au peuple américain, disons-lui la vérité, qu’il n’y a pas de douleurs sans gains, que nous sommes à la veille de grandes décisions ! »\n\nMalgré la semaine passée de rivalité entre conservateurs et libéraux, le parti est désormais, du moins pour le moment, uni dans un effort commun, et pleinement engagé dans l’élection à venir en novembre."
