 DEM_1952_PRIMARY.0.d:0 "Aujourd'hui, la Cour suprême des États-Unis a rendu son arrêt dans l'affaire États-Unis contre Louisiane, relative à la juridiction sur les gisements pétroliers offshore. Dans cette affaire, le gouvernement fédéral a poursuivi l'État de Louisiane pour ne pas reconnaître son droit d'utiliser ces terres et pour y avoir continuellement pénétré illégalement. La Cour a statué que le gouvernement fédéral possède des droits primordiaux sur le territoire et les droits pétroliers, et que la Louisiane, à l'instar de la Californie dans une affaire similaire trois ans auparavant, ne dispose d'aucun droit sur le pétrole dans une zone submergée. Cette décision, qui devrait déplaire aux défenseurs des droits des États, réaffirme la suprématie du gouvernement fédéral."
 DEM_1952_PRIMARY.0a.d:0 "Aujourd'hui, le Congrès américain a adopté la loi sur les terres submergées (Submerged Lands Act). Destinée à apaiser les défenseurs des droits des États, indignés par l'arrêt de la Cour suprême dans l'affaire États-Unis contre Louisiane, cette loi restitue aux États côtiers, jusqu'à trois milles nautiques du littoral, les droits pétroliers et gaziers. Ce projet de loi est particulièrement controversé, car de nombreux partisans d'une intervention fédérale estiment que le gouvernement fédéral devrait avoir la pleine maîtrise de tous les droits pétroliers et gaziers sur son territoire. Allons-nous le signer ou y opposer notre veto ?"
 DEM_1952_PRIMARY.10.d:0 "Aujourd'hui, lors de la Convention nationale démocrate de 1952 à Chicago, les membres du Nord du parti ont quitté l'hémicycle après la nomination massive du sénateur Richard Russell Jr. de Géorgie par leurs collègues démocrates du Sud. Face à une opposition farouche à leur proposition de réforme des droits civiques, la faction du Nord est contrainte de convoquer une troisième convention, qui se tiendra probablement à Minneapolis dans les semaines à venir."
 DEM_1952_PRIMARY.11.d:0 "Aujourd'hui, à la Convention nationale démocrate de 1952 à Chicago, les membres du Sud ont quitté l'hémicycle, suite à plusieurs revers au sein du comité des règles concernant un serment d'allégeance proposé par la Coalition du Nord, issue des campagnes de Kefauver et Harriman, en réaction à la grève des membres du Sud en 1948. Irrités par l'ajout de mesures relatives aux droits civiques et d'autres politiques progressistes au programme du Parti démocrate national, les membres du Sud sont contraints de former une troisième convention, qui devrait se tenir à Montgomery, en Alabama, dans les prochaines semaines."
 DEM_1952_PRIMARY.12.d:0 "Après avoir quitté la convention nationale du Parti démocrate à Chicago en raison de la nomination du sénateur ségrégationniste Richard Russell, l'aile libérale du Nord s'est réunie à Minneapolis, dans le Minnesota, pour désigner un candidat. Furieuse que les démocrates ségrégationnistes du Sud tentent de s'emparer de la politique nationale au profit de leurs intérêts racistes et régionaux, l'aile nord a fait scission et a décidé de présenter ses propres candidats libéraux. Cette aile nord regroupait des membres tels que le Parti démocrate-ouvrier-agriculteur du Minnesota (DFLP), la Ligue non partisane du Dakota du Nord et le Parti libéral de New York. Comme prévu, la convention a désigné le sénateur Herbert Lehman de New York comme candidat à la présidence et le sénateur Hubert Humphrey du Minnesota comme candidat à la vice-présidence."
 DEM_1952_PRIMARY.13.d:0 "Après avoir quitté la convention nationale du parti à Chicago, la faction sudiste s'est réunie à Montgomery, en Alabama, pour désigner son candidat. Irritée par les propositions progressistes des démocrates du Nord, telles que l'élargissement des droits civiques et la déségrégation, la faction sudiste a fait scission et décidé de présenter son propre candidat pour défendre les intérêts de ses électeurs. Formé au sein du Parti démocrate des droits des États, rebaptisé « States Rights Democratic Party », ce parti devrait désigner le sénateur Strom Thurmond de Caroline du Sud et le gouverneur Allan Shivers du Texas comme candidats à la présidence."
