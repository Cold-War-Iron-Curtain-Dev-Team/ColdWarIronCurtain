 AIDSGOP.1.d:0 "Le syndrome d'immunodéficience acquise (SIDA), causé par l'infection au VIH, connaît une augmentation constante du nombre de cas depuis la fin des années 1970 aux États-Unis. Cette maladie, qui se transmet principalement par voie sexuelle, est incurable et généralement mortelle. Récemment, des cas de contamination par transfusion sanguine ont également été constatés. Les Centres pour le contrôle et la prévention des maladies (CDC) ont recommandé l'interdiction à vie du don de sang pour les usagers de drogues et les personnes homosexuelles, en raison de leur risque élevé de contracter le virus. De plus, de nombreux États ont commencé à adopter des lois criminalisant la transmission intentionnelle du VIH, afin de freiner la propagation du virus. L'organisation religieuse et politique « Moral Majority » a condamné le SIDA, le considérant comme un châtiment divin infligé par Dieu pour punir l'Amérique de son acceptation croissante de l'homosexualité et de l'avortement."
 AIDSGOP.5.d:0 "Le gouvernement fédéral a annoncé aujourd'hui l'interdiction de tout nouveau financement de la recherche sur le sida et le VIH, le président affirmant que des fonds supplémentaires ne sont pas nécessaires pour lutter contre l'épidémie. Cette décision a été condamnée par de nombreux médecins à travers le pays, ainsi que par certaines personnalités de gauche, qui accusent le gouvernement de privilégier l'argent à la vie des Américains en entravant la recherche sur le VIH. Jerry Falwell, chef de la Majorité morale, a prétendu qu'il était inutile de financer la recherche sur le sida, car il s'agirait d'une maladie causée exclusivement par les hommes homosexuels et d'un châtiment divin pour leurs péchés."
 AIDSGOP.10.d:0 "Aujourd'hui, le directeur général de la santé publique des États-Unis a publié un rapport sur la crise du sida en Amérique. Il recommande une vaste campagne d'information sur le sida, car de nombreux mythes se sont propagés à une vitesse fulgurante, comme celui de la transmission du VIH par les moustiques ou par simple contact cutané. Il plaide également pour une plus large diffusion de la contraception masculine. Ces propositions en matière d'éducation sexuelle et de contraception ont suscité des réticences de la part des conservateurs, qui privilégient une éducation sexuelle plus restrictive, axée uniquement sur l'abstinence. Jerry Falwell, chef de file de la Majorité morale, s'est opposé au rapport du directeur général de la santé publique, affirmant que des financements supplémentaires et une plus grande tolérance envers les personnes séropositives ne feraient que gaspiller l'argent des contribuables. Falwell recommande plutôt de réintroduire la religion à l'école et dans la société américaine, ce qui, selon lui, « limiterait la propagation de l'homosexualité, vecteur du sida »."
 AIDSLib.1.d:0 "Le syndrome d'immunodéficience acquise (SIDA), causé par l'infection au VIH, connaît une augmentation constante du nombre de cas depuis la fin des années 1970 aux États-Unis. Les Centres pour le contrôle et la prévention des maladies (CDC) sollicitent des fonds supplémentaires pour poursuivre la recherche sur cette maladie, dans l'espoir de trouver un remède ou d'améliorer les traitements. Le ministère de l'Éducation a également commencé à collaborer avec le département de la Santé et des Services sociaux (HHS) et les CDC afin de créer et de financer des programmes d'éducation sur le SIDA, dans l'espoir de réduire la transmission du virus et de lutter contre les idées reçues néfastes. Cette initiative suscite une vive opposition de la part des conservateurs sociaux, qui accusent le gouvernement de détourner l'argent des contribuables pour une maladie prétendument causée par des homosexuels déviants. Jerry Falwell, de la Majorité morale, s'est engagé à soutenir les primaires contre tout élu républicain qui approuverait les mesures gouvernementales relatives au SIDA."
 VRA_Enforcement80s.1.d:0 "Aujourd'hui, le procureur général [GetCurrentAG] a annoncé de nouvelles mesures que prendra le ministère de la Justice pour faire appliquer la loi sur le droit de vote de 1965. Ces mesures font suite à des décisions de justice ayant affaibli certains aspects de la loi et aux allégations de résistance raciste persistante dans certaines régions du pays. Le ministère de la Justice va créer de nouveaux centres de signalement des discriminations électorales, notamment dans les quartiers à forte population minoritaire, où ces centres étaient jusqu'à présent inexistants. Il a également chargé le FBI d'enquêter sur les administrations locales et étatiques qui ont cherché à empêcher l'implantation de bureaux de vote dans les quartiers à forte population minoritaire, une pratique qu'elles jugent néfaste pour la participation électorale des minorités. Le procureur général [GetCurrentAG] a également annoncé un financement accru pour les campagnes de vote anticipé dans ces zones, afin de désengorger les bureaux de vote existants. Enfin, le FBI a reçu l'autorisation de cibler activement tout groupe d'extrême droite qui tenterait d'entraver le vote des minorités. Certains politiciens conservateurs ont critiqué l'annonce du procureur général, l'accusant de ne viser qu'à gagner des voix pour le président lors des prochaines élections. La NAACP, quant à elle, a salué le président et le procureur général, qualifiant cette annonce de grand jour pour la nation et les Afro-Américains."
 Executive_Order_12333.1.d:0 "Aujourd'hui, le président américain [USA.GetLeader] a signé le décret 12333, obligeant toutes les agences fédérales à coopérer avec la CIA en matière de renseignements. Ce décret élargit également le champ des informations autorisées à être collectées, incluant désormais les renseignements légaux, le contre-espionnage et les renseignements relatifs au trafic de stupéfiants et au terrorisme, le tout sans mandat. Par ailleurs, il réaffirme l'interdiction faite aux agences de renseignement de planifier ou de mener des assassinats. Des organisations de défense des libertés civiles s'inquiètent de ce que ce décret renforce considérablement les pouvoirs des agences de renseignement actuelles, sans prévoir de mécanismes de contrôle supplémentaires."
 Executive_Order_12333.2.d:0 "Un arrêt surprise de la Cour d'appel de Washington, D.C., a jugé que le décret présidentiel 12333 violait le droit constitutionnel présumé à la vie privée, en raison d'une formulation trop vague concernant la collecte de renseignements et d'un manque de contrôle adéquat. La plainte avait été déposée par l'ACLU, qui avait exprimé de vives inquiétudes quant à l'étendue des informations transmises à la CIA, rappelant des abus passés de cette dernière. L'administration a vivement critiqué la décision de la Cour, affirmant que le décret 12333 visait uniquement à renforcer l'organisation et la cohérence au sein de la communauté du renseignement, et non à étendre considérablement ses pouvoirs. De nombreux faucons au Congrès ont également condamné l'arrêt, estimant que la Cour mettait en péril la sécurité nationale. On ignore pour l'instant si l'administration du président [USA.GetLeader] se pourvoira en cassation devant la Cour suprême."
 RWCA_Veto.1.d:0 "Aujourd'hui, le président américain [USA.GetLeader] a surpris le pays en annonçant son veto à la loi Ryan White, adoptée par le Congrès. Nommée en hommage à Ryan White, un enfant infecté par le VIH suite à une transfusion sanguine, cette loi aurait constitué le plus important programme de financement fédéral pour la lutte contre le VIH/SIDA. Le président a défendu sa décision, affirmant que ces fonds étaient inutiles pour combattre un virus qui ne touche qu'une partie de la population. Il a également réaffirmé sa volonté de ne pas gaspiller l'argent des contribuables dans des projets qui ne profitent pas à tous les citoyens américains. Sa déclaration a suscité de vives critiques de la part du Congrès et des associations de lutte contre le VIH/SIDA, beaucoup accusant le président d'homophobie et le jugeant directement responsable de l'augmentation future du nombre de décès liés au SIDA. Certaines figures de l'extrême droite, comme Jerry Falwell, leader de la Majorité morale, ont salué le veto du président [USA.GetLeader], déclarant que le SIDA était une maladie exclusivement homosexuelle et que les Américains pieux n'avaient pas à craindre d'être infectés. Le Congrès, qui a adopté le projet de loi à une écrasante majorité, devrait tenter de passer outre le veto du président dans les semaines à venir."
 RWCA_Veto.2.d:0 "Nous nous attendons à une forte opposition du Congrès dans les prochains jours, nombre de nos propres membres et de l'opposition prévoyant de voter contre nous. Notre meilleure chance de contrer cette tentative de contournement est de faire pression sur nos membres les plus religieux et de les menacer de primaires. Nous pourrions également solliciter l'appui de certains membres plus modérés et leur proposer des concessions sur d'autres points clés de la législation. Enfin, nous pourrions tenter de faire pression sur les chefs de notre parti dans chaque chambre, en leur offrant un poste au sein de l'administration à la fin de leur mandat ou un soutien accru lors de leurs campagnes de réélection. Bien que le vote soit certainement serré, nous pensons pouvoir faire échouer leur tentative."
 RWCA_Veto.3.d:0 "Aujourd'hui, le Congrès a rejeté le veto du président [USA.GetLeader] sur la loi Ryan White. Le président a dû faire face à un grand nombre de votes contre son veto au sein de son propre parti, seuls quelques membres plus extrémistes se ralliant à lui. De nombreuses associations de lutte contre le sida à travers le pays ont salué cette décision, condamnant le veto présidentiel et félicitant le Congrès pour son unité. Sollicitée pour un commentaire, la porte-parole de la Maison Blanche a déclaré que le président entendait se concentrer sur d'autres projets de loi en cours d'élaboration. Certains groupes d'extrême droite ont critiqué la décision de rejeter le veto, affirmant que le projet de loi représente un gaspillage d'argent public pour un problème limité."
 RWCA_Veto.4.d:0 "Le Congrès n'est pas parvenu à passer outre le veto du président [USA.GetLeader] aujourd'hui, manquant de peu la supermajorité de 66 sièges requise au Sénat. Le président a remercié les sénateurs ayant voté contre son veto, les qualifiant de grands héros et assurant que leur courage ne serait pas oublié. Selon certaines sources, la Maison Blanche a dû faire de nombreuses concessions à plusieurs sénateurs pour les convaincre de changer d'avis, allant jusqu'à leur proposer des postes importants au sein de l'administration. L'opinion publique a généralement réagi négativement à cette nouvelle, avec seulement 7 Américains sur 10 se déclarant favorables au projet de loi. Elton John, chanteur LGBTQ de renom, a annoncé la création de la Fondation Elton John contre le sida, afin de compenser le manque de soutien dû au veto. Plusieurs associations de lutte contre le sida ont qualifié cette journée de sombre pour le pays, affirmant que l'Amérique avait tourné le dos à ceux qui en avaient le plus besoin et que le président devrait avoir honte."
 War_on_Drugs80s.1.d:0 "Malgré l'adoption de la loi sur les substances contrôlées en 1970 et diverses autres campagnes antidrogue, les États-Unis connaissent toujours une augmentation de la consommation et de la mortalité liées à la drogue à travers le pays. Le crack, une forme beaucoup moins chère de cocaïne fumable, s'est largement répandu dans les communautés afro-américaines. De plus, de nouvelles drogues, encore légales, comme la MDMA, ont gagné en popularité dans de nombreux milieux musicaux underground, causant de graves dommages à notre nation. Aujourd'hui, le président américain [USA.GetLeader] a annoncé de nouvelles mesures pour intensifier la lutte contre la drogue. Ces mesures comprennent une réforme importante de notre législation actuelle en matière de stupéfiants, l'instauration d'une loi prévoyant la récidive pour possession de drogue, la possibilité pour les familles ayant perdu un proche à cause de la drogue de poursuivre les trafiquants pour obtenir des dommages et intérêts, et la création et la mise en œuvre d'un programme complet d'éducation à la prévention des toxicomanies dans nos écoles. Le Congrès s'est généralement montré réceptif à cette politique, même si certains démocrates plus libéraux et membres libertariens ont exprimé leur opposition, qualifiant la guerre contre la drogue de gaspillage d'argent et de violation des droits individuels du peuple américain."
 War_on_Drugs80s.2.d:0 "Aujourd'hui, le président américain [USA.GetLeader] a annoncé une nouvelle campagne contre la drogue, axée sur l'éducation et la science plutôt que sur des mesures répressives. Il prévoit notamment de réexaminer la liste des drogues classées dans les annexes I et II, certains experts médicaux estimant que des substances comme le cannabis devraient être traitées comme l'alcool plutôt que comme l'héroïne et autres « drogues dures ». Le président a également annoncé un renforcement significatif de l'éducation aux drogues dans les écoles, affirmant qu'informer la nouvelle génération sur la vérité concernant ces substances sera essentiel pour mettre fin à la guerre contre la drogue. Cette annonce a suscité des critiques de la part de nombreux politiciens conservateurs et des forces de l'ordre, qui estiment que le cannabis reste une drogue très dangereuse, car il ouvre la voie à la consommation d'autres substances. Par ailleurs, il semblerait que le président puisse opposer son veto à tout projet de loi adopté par le Congrès visant à alourdir les peines pour simple possession de drogue."
 War_on_Drugs80s.10.d:0 "Aujourd'hui, le secrétaire à la Défense [GetCurrentSecDef] a annoncé un renforcement significatif de la coordination avec la DEA (Drug Enforcement Administration) afin de lutter contre la crise croissante de la drogue aux États-Unis. Il a également annoncé que le président [USA.GetLeader] avait approuvé le déploiement de la Garde nationale pour démanteler les cultures et laboratoires clandestins de drogue disséminés sur le territoire. La Garde nationale mènera des opérations contre les cartels et les réseaux de trafic de drogue en s'appuyant sur les renseignements de la DEA, assurera la formation des forces de l'ordre locales et étatiques aux techniques d'intervention efficaces et mettra en œuvre un programme éducatif dans les régions concernées. Ce programme comprendra notamment une campagne de sensibilisation du public et des interventions dans les établissements scolaires. Ce nouveau programme a suscité de vives critiques de la part de l'ACLU (Union américaine pour les libertés civiles) et de nombreux élus progressistes, qui estiment que la militarisation de la police a un effet dissuasif sur le pays et risque de porter atteinte aux droits des personnes accusées d'infractions liées à la drogue. Parallèlement, les forces de l'ordre ont accueilli très favorablement ce renfort de personnel, le qualifiant de poids nécessaire pour faire pencher la balance dans la guerre contre la drogue."
 USJapanTrade.1.d:0 "Depuis la fin des années 70, le Japon profite de notre politique commerciale avantageuse en inondant le marché américain de voitures, de téléviseurs et de produits électroniques divers, au détriment de notre industrie nationale. Si nous souhaitons maintenir le Japon comme allié dans la région, compte tenu de sa position géographique qui nous offre un accès direct à l'Extrême-Orient, nous devons exiger qu'il limite ses exportations vers nos côtes et cesse d'acquérir les biens de nombreuses entreprises américaines de premier plan. Heureusement, la majorité du Congrès se préoccupe également de cette question commerciale avec le Japon, et nous devrions bénéficier d'un soutien bipartisan pour toute mesure nécessaire à la résolution de ce déséquilibre."
 USJapanTrade.2.d:0 "L'ambassadeur américain a récemment « demandé » une renégociation de nos accords commerciaux avec les États-Unis, arguant que nos exportations ont gravement nui à leur industrie nationale. Bien que les États-Unis soient actuellement notre principal allié au monde, ces tensions économiques ont attisé un fort sentiment anti-japonais aux États-Unis, allant jusqu'au meurtre d'un Américain d'origine chinoise (pris pour un Américain d'origine japonaise) par deux ouvriers de l'automobile licenciés à Détroit, dans le Michigan. Ces tensions ont incité de nombreux membres de notre gouvernement à se montrer ouverts à l'idée de renégocier nos accords ou de trouver un compromis acceptable pour les deux parties. Cependant, quelques responsables intransigeants estiment que nous ne devrions pas renoncer à notre avantage économique actuel, car nous pourrions l'utiliser pour privilégier les intérêts japonais et réduire notre dépendance envers les États-Unis."
 USJapanTrade.3.d:0 "Nous venons d'apprendre du Japon qu'ils ont accepté toutes nos principales demandes. Les livraisons futures de Toshiba et Nissan sont déjà suspendues, le gouvernement japonais a commencé à revendre une grande partie de la dette américaine rachetée au Trésor américain, et le ministère japonais de l'Économie, du Commerce et de l'Industrie nous a également donné un accord verbal : aucun citoyen japonais n'achètera plus de marques américaines emblématiques. Le Congrès a accueilli favorablement cette nouvelle, et même les plus intransigeants ont accepté de retirer tout projet de loi de sanctions en cours d'élaboration."
 USJapanTrade.4.d:0 "Le Japon n'a pas accepté toutes les demandes formulées par notre ambassadeur. S'il se montre disposé à adopter une limitation volontaire des exportations de véhicules automobiles, il conteste toujours nos demandes visant à limiter la création de nouvelles usines aux États-Unis. Accepter cette offre de compromis permettrait de rétablir un équilibre plus raisonnable entre les importations et les exportations, mais nos entreprises devraient alors faire face à la concurrence des produits japonais fabriqués sur notre territoire. Les partisans d'une ligne dure au Congrès et au sein de notre administration font pression pour rejeter ce compromis et imposer des sanctions sur les produits japonais. Cependant, les membres les plus favorables au libre-échange au sein de notre gouvernement avertissent que cela pourrait se retourner contre notre économie, nuire davantage à nos industries nationales et faire grimper le prix des automobiles dans tout le pays. De plus, certains conseillers du Département d'État ont évoqué la possibilité que le Japon cherche plutôt à resserrer ses relations avec d'autres puissances, comme l'Europe ou peut-être la Chine, si nous insistons trop sur ce point."
 USJapanTrade.5.d:0 "Le Japon a catégoriquement rejeté notre offre de renégociation de nos accords commerciaux. Nos tentatives diplomatiques pour le convaincre de revenir à la table des négociations semblent également être restées vaines. Le Congrès, et notamment ses membres républicains, réclame des sanctions importantes et généralisées contre divers secteurs de l'économie japonaise, invoquant la sécurité nationale. Notre administration partage globalement l'avis du Congrès, car certaines sanctions apparaissent comme le seul moyen de ramener le Japon à la table des négociations. Cependant, certains conseillers suggèrent d'abandonner ce dossier, soulignant le risque de nuire aux relations nippo-américaines, de perdre le Japon comme principal allié dans le Pacifique et de le rapprocher de concurrents économiques tels que l'Europe ou la Chine."
 USJapanTrade.6.d:0 "L'ambassadeur des États-Unis nous a informés que nous serions confrontés à des sanctions généralisées touchant divers secteurs de notre économie si nous n'acceptons pas leurs exigences actuelles. Notre gouvernement est divisé sur la manière de réagir à cette menace. Nombre de nos conseillers les plus modérés insistent pour que nous acceptions les demandes du gouvernement américain, car la perte d'accès aux marchés américains impacterait négativement une grande partie des revenus de nos entreprises, et nous risquerions également de perdre les États-Unis, notre principal allié, ce qui nous rendrait plus vulnérables aux influences chinoises ou soviétiques. Une partie importante de notre gouvernement affirme cependant que notre industrie est suffisamment solide pour supporter la perte de certains marchés américains et a présenté des projections de développement en Europe et en Asie afin de compenser les pertes de revenus."
 USJapanTrade.7.d:0 "Nous avons reçu aujourd'hui un appel de l'ambassadeur du Japon nous informant que le Japon a une nouvelle fois refusé de négocier face aux sanctions économiques. Le Congrès a déjà commencé à rédiger des résolutions exigeant du président qu'il prenne immédiatement des mesures pour limiter les importations japonaises, et la Bourse de New York (NYSE) a amorcé une chute rapide suite aux informations faisant état de sanctions imminentes. Céder nous ramènerait à la case départ et nous humilierait délibérément, tandis que l'imposition de sanctions permettrait, espérons-le, de résoudre le déséquilibre commercial et de redresser notre industrie nationale, mais au prix d'une détérioration des relations nippo-américaines, d'un risque de préjudice durable à notre position dans le Pacifique et d'une possible hausse du prix de nombreux produits de consommation courante aux États-Unis."
 USJapanTrade.8.d:0 "Le président des États-Unis a dévoilé aujourd'hui une liste de nouvelles sanctions commerciales visant la République du Japon, après des semaines de négociations infructueuses sur le déséquilibre commercial entre les deux pays. Ces sanctions ciblent principalement les industries automobile et électronique japonaises, au motif que le Japon aurait indûment profité de l'économie et de la sécurité nationale américaines. Le Japon a réagi en critiquant les sanctions américaines, affirmant qu'elles rompent l'étroite coopération développée entre le Japon et les États-Unis et que l'Amérique a renié ses principes antérieurs de libre-échange. Le Congrès a généralement exprimé son soutien aux mesures prises par le président [USA.GetLeader], une résolution ayant été adoptée quelques heures auparavant l'appelant à limiter les exportations japonaises. La Bourse de New York devrait chuter fortement suite à cette annonce, les relations commerciales nippo-américaines étant déjà en net déclin."
 USJapanTrade.9.d:0 "Le président des États-Unis a annoncé aujourd'hui de nouvelles sanctions contre la République du Japon, suite au refus de ce dernier de se plier aux exigences américaines concernant les différends commerciaux bilatéraux. Le président [USA.GetLeader] a justifié ces sanctions, qui visent principalement les principaux secteurs industriels japonais, tels que l'automobile et l'électronique, comme une mesure de défense de la sécurité nationale et économique américaine face à une puissance commerciale hostile et déloyale. Le Japon a condamné ces sanctions, dénonçant l'injustice de la demande américaine de renégociation et qualifiant les sanctions d'intimidation économique. Le Congrès a apporté un soutien sans faille au président, ayant précédemment adopté une résolution appelant à une réduction des importations en provenance du Japon. L'opinion publique a également réagi positivement, la plupart des Américains considérant que le Japon a agi de manière injuste en rejetant les demandes américaines. La Bourse de New York devrait chuter brutalement suite à cette annonce, les relations commerciales nippo-américaines atteignant un nouveau point bas."
 USMILDEM.1.d:0 "Le président américain [USA.GetLeader] a critiqué aujourd'hui le budget de la défense actuel, le qualifiant de excessif et de mal géré, et a demandé au Bureau de la responsabilité gouvernementale (GAO) de mener un audit complet et approfondi. Cette décision a suscité de vives critiques de la part des républicains et des démocrates modérés, qui estiment qu'avec la montée des tensions liées à la Guerre froide, des fonds supplémentaires seront nécessaires pour permettre à nos forces armées de rivaliser avec les Soviétiques. Le président a maintenu sa position et a indiqué qu'il envisagerait d'opposer son veto à la prochaine loi d'autorisation de la défense nationale si l'armée ne réduit pas les dépenses inutiles ou ne diminue pas son budget actuel. De nombreux pays européens, qui espéraient recevoir de nouveaux missiles balistiques pour contrer les récents déploiements soviétiques, craignent désormais de perdre leur bouclier nucléaire en Europe."
 USAMIL80s.1.d:0 "Le président américain [USA.GetLeader] a appelé aujourd'hui à une augmentation significative du budget de la défense, arguant que les États-Unis ont pris du retard sur l'Union soviétique dans de nombreux domaines clés, tels que la supériorité navale, la production et la recherche de missiles balistiques, et les progrès en matière de technologies radar antiaériennes et d'alerte précoce. Le président a également déclaré que l'implication continue de l'Union soviétique dans le soutien et le financement de nombreux groupes rebelles communistes menace la souveraineté américaine, qui ne peut être protégée qu'en fournissant un soutien massif en armement et en formation à nos alliés défendant la liberté. Ce financement serait spécifiquement destiné à la remise en service des vieux cuirassés de classe Iowa afin d'accroître la puissance de feu, à l'accélération de la production de nouveaux porte-avions et sous-marins, au déploiement rapide du système Pershing II pour rétablir la suprématie nucléaire en Europe, et à l'octroi d'importantes subventions de recherche à l'armée de l'air américaine pour contrer les développements soviétiques en matière de défense antiaérienne et de radars. De nombreux membres du Congrès, à tendance libérale, se sont opposés à ce nouveau financement, affirmant qu'il ne fait que nous rapprocher de la Troisième Guerre mondiale et gaspiller l'argent des contribuables au détriment des affaires intérieures. L'organisation antinucléaire Greenpeace a également annoncé une nouvelle série de manifestations contre les nouvelles mesures de financement du nucléaire, qualifiant le président de fou qui souhaite voir le monde brûler."
 USAMIL80s.2.d:0 "Le président américain [USA.GetLeader] a annoncé aujourd'hui sa proposition d'augmentation du budget des forces armées, arguant que les États-Unis accusent un retard sur les Soviétiques dans certains domaines clés de la défense, tels que l'acquisition de navires et le déploiement de missiles balistiques. Le président a déclaré que ces nouveaux fonds permettraient aux États-Unis de remettre en état de combat leurs cuirassés vieillissants de classe Iowa et de moderniser leurs porte-avions et leurs sous-marins. Il a également fait part de son inquiétude quant à la perte de la supériorité nucléaire tactique en Europe sans le déploiement de nouveaux missiles balistiques à portée intermédiaire (IRBMS). Si certains membres progressistes du Congrès ont dénoncé le gaspillage du budget militaire et réclamé une réduction, le Congrès s'est globalement montré favorable à ces nouvelles demandes de financement. Les groupes pacifistes ont critiqué cette annonce, affirmant que tout nouveau financement prive les Américains d'argent qui pourrait être alloué à l'éducation ou à la lutte contre la pauvreté."
 USAMIL80s.3.d:0 "Le président Wilson a demandé aujourd'hui au Congrès de rétablir divers crédits de défense supprimés par l'administration précédente. Une grande partie de ces fonds est destinée à la CIA et à d'autres ministères pour fournir formation, aide humanitaire et armements aux groupes rebelles et gouvernements soutenus par les États-Unis. Wilson affirme que ces fonds sont essentiels pour garantir la supériorité américaine à l'étranger, car sans eux, de nombreux pays du tiers monde basculeraient dans le communisme. De nombreux libéraux et modérés au Congrès s'opposent à cette politique, reprochant à Wilson de négliger les besoins de nos propres forces armées vieillissantes et de gaspiller des milliards de dollars sans véritable contrôle de leur utilisation. Les partisans de la politique d'endiguement et de la réduction des dépenses militaires, quant à eux, soutiennent Wilson, arguant que l'issue de la Guerre froide se jouera sur ces conflits régionaux de faible ampleur."
 CUBUSA80s.1.d:0 "Aujourd'hui, le président américain [USA.GetLeader] a annoncé la signature de la loi de rapprochement avec Cuba, qui mettrait fin à l'embargo en vigueur et ouvrirait la voie au rétablissement des relations avec l'île. Si Cuba et les États-Unis ont été des adversaires pendant la majeure partie de la Guerre froide, les tensions entre les deux pays se sont considérablement apaisées depuis la crise de 1962, il y a plusieurs décennies. Le président a déclaré qu'il était temps de tourner la page des anciens conflits, soulignant l'opposition de l'ONU à l'embargo et le rôle de Cuba au sein du Mouvement des non-alignés comme preuve qu'elle n'est pas une simple marionnette de l'Union soviétique. Cette annonce a suscité une vive hostilité de la part des faucons au Congrès, qui affirment que l'embargo a maintenu Cuba faible et isolée et que le président nuit ouvertement aux intérêts américains dans le monde entier. Un petit groupe de faucons extrémistes a même réclamé la démission ou la destitution du président américain[USA.GetLeader] pour trahison."
 CUBUSA80s.2.d:0 "Nous avons reçu aujourd'hui un appel du secrétaire d'État américain [GetCurrentSecState] nous informant du projet des États-Unis de lever l'embargo et de rétablir les relations avec notre République. Nombre de nos conseillers y voient une occasion unique de dynamiser l'économie et d'accroître notre influence sur la scène internationale. Cependant, certains conservateurs y voient une ouverture de notre économie au capitalisme de connivence, et pensent que les États-Unis ne font cette offre que dans le but de déstabiliser Cuba par des manœuvres économiques. La normalisation des relations pourrait également engendrer une nouvelle crise migratoire, aggravant ainsi la fuite des cerveaux. Néanmoins, les denrées alimentaires et les médicaments qui entreront désormais dans notre pays nous seront d'une grande aide et pourraient nous affranchir de notre dépendance à l'égard de l'Union soviétique."
 Carey88.1.d:0 "Aujourd'hui, le président Carey, en présence des principaux dirigeants syndicaux des Travailleurs unis de l'automobile (UAW), des Travailleurs des communications d'Amérique (CWA) et des Métallurgistes unis (USW), a annoncé une nouvelle série de mesures politiques sous l'égide de l'« Initiative Made in America ». Parmi les propositions de cette initiative figurent l'augmentation des droits de douane sur l'acier, les automobiles et diverses autres importations étrangères, ainsi que des crédits d'impôt pour les entreprises manufacturières nationales. Si ces mesures sont saluées par les élus et les membres des syndicats de la Rust Belt et du Nord-Est, de nombreux groupes de défense des agriculteurs et des élus des régions touchées par la crise agricole s'inquiètent de leurs conséquences pour les agriculteurs américains."
 Kerry_NAFTA.2.d:0 "Lors d'une cérémonie dans la salle Est de la Maison-Blanche, le président Kerry a promulgué l'Accord de libre-échange nord-américain (ALENA), entouré de plusieurs anciens présidents et de membres du Congrès qui le soutenaient. Les partisans du libre-échange et de nombreux économistes ont salué cette initiative, malgré les incertitudes qui planaient sur la manière dont le président Kerry mènerait les négociations, compte tenu de ses hésitations concernant l'ALENA durant la campagne de 1988. De l'autre côté de l'hémicycle, les dirigeants syndicaux ont vivement critiqué le président Kerry, qualifiant sa décision de trahison envers les électeurs qui l'ont porté à la Maison-Blanche.\n\nPar ailleurs, le milliardaire et philanthrope Ross Perot, connu pour ses prises de position tranchées, a condamné l'accord, le jugeant comme une atteinte à la souveraineté américaine, et des rumeurs circulent selon lesquelles il préparerait le terrain pour une candidature à la présidentielle de 1992."
 Kerry_NAFTA.3.d:0 "Durant la campagne de 1988, le président Kerry a généralement évité le débat sur l'Accord de libre-échange nord-américain (ALENA). Dans une allocution télévisée, entouré d'opposants à l'accord, tels que le secrétaire au Travail Luis Gutiérrez, le chef de la majorité à la Chambre des représentants Dick Gephardt et des représentants de plusieurs grands syndicats, il a annoncé le retrait des États-Unis des négociations de l'ALENA. Le président Kerry a ensuite exposé les raisons de cet abandon, notamment le manque de protection des travailleurs américains et les préoccupations relatives à la protection de l'environnement au Mexique. Les réactions du public à cette décision ont été très diverses : les syndicalistes du Midwest et les ouvriers du textile du Sud ont majoritairement accueilli favorablement l'annonce, tandis que les partisans du libre-échange et les organisations agricoles ont condamné cette mesure, la jugeant néfaste pour le potentiel de l'économie américaine. Le milliardaire et philanthrope Ross Perot, quant à lui, a salué le discours du président."
 Cronkite88.1.d:0 "À l'approche des élections de 1980, la situation semblait mal engagée pour les ailes libérales des deux partis. Entre la montée de la Majorité morale, le rejet de l'amendement sur l'égalité des droits et les excès culturels de la fin des années 1960, rares étaient ceux qui auraient anticipé les progrès sociaux survenus au cours de la décennie suivante. L'élection surprise de John Anderson en 1980, puis celle de son vice-président à la présidence en 1988, ont engendré diverses avancées sociales. Entre les progrès en matière de droits des homosexuels, les investissements dans l'éducation, la protection de l'environnement et la relance de l'amendement sur l'égalité des droits, les années 1980 ont, à la surprise de nombreux analystes politiques, été marquées par une remarquable renaissance du libéralisme social aux États-Unis.\n\nAllant plus loin encore, le président Cronkite, lors de la campagne de 1988, s'est engagé à défendre davantage les valeurs libérales en renforçant la protection des libertés civiles, en réformant l'immigration et en promouvant d'autres causes sociales. Durant son premier mandat, non seulement cet objectif a été atteint, mais le président Cronkite, dans une décision controversée, a déclaré la fin de la guerre contre la drogue en raison de ses conséquences sur les minorités raciales et les zones urbaines américaines. Si les partisans d'Anderson et de Cronkite, ainsi que diverses organisations de défense des droits civiques, ont salué ces initiatives, de nombreux groupes de pression politiques évangéliques les ont condamnées, les jugeant préjudiciables au tissu moral des États-Unis."
 Cronkite88.2.d:0 "Dans une allocution télévisée, le président Cronkite a annoncé la fin de la guerre contre la drogue. Il a justifié sa décision en affirmant que les conséquences néfastes de la répression policière en matière de toxicomanie l'emportaient sur les bénéfices potentiels d'une éradication complète du trafic de drogue. Le président préconise désormais un financement accru des services de réadaptation et d'éducation, ainsi que la promotion de programmes de relance économique dans les zones économiquement défavorisées, particulièrement vulnérables à la toxicomanie. Cette annonce a suscité de vives réactions au sein de l'opinion publique américaine. Si les organisations de défense des droits civiques, en particulier, ont salué cette initiative comme un pas en avant vers une meilleure police, les forces de l'ordre l'ont dénoncée comme une attaque contre elles et contre la classe moyenne américaine. Les groupes évangéliques, quant à eux, ont majoritairement condamné cette mesure, y voyant un nouvel exemple de la dégradation des valeurs morales aux États-Unis par le président Cronkite."
 CHAFFEE.1.d:0 "La dernière décennie a été tumultueuse pour la communauté homosexuelle, entre l'apparition de l'épidémie de sida et la recrudescence des attaques des conservateurs avec la montée en puissance du mouvement de la Majorité morale au début des années 1980. Dans ce contexte, la nomination de John Chaffee, républicain libéral reconnu pour son soutien aux droits des homosexuels, aux élections de 1988, était pour le moins surprenante. Lors d'une conférence de presse tenue plus tôt dans la journée, le président Chaffee a signé un décret autorisant les homosexuels à s'enrôler et à servir dans les différentes branches des forces armées. Les organisations de défense des droits des homosexuels et les défenseurs des libertés civiles ont salué ce décret. De l'autre côté de l'échiquier politique, les leaders évangéliques et les responsables républicains conservateurs ont largement condamné cette décision, la qualifiant de trahison des valeurs conservatrices fondamentales et d'atteinte supplémentaire à la moralité américaine."
 Anderson.1.d:0 "Lors d'une conférence de presse télévisée au parc national de Yosemite, le président John Anderson a présenté son nouveau programme de conservation de l'environnement. Ce programme comprend plusieurs décrets présidentiels renforçant les pouvoirs de l'Agence de protection de l'environnement (EPA) et l'application de la loi sur les espèces menacées. Si les organisations de défense de l'environnement ont salué cette annonce, de nombreux groupes conservateurs et patronaux l'ont critiquée, arguant que l'élargissement des pouvoirs de l'EPA donnerait davantage de pouvoir aux bureaucrates de Washington pour entraver les entreprises et nuire à la croissance économique. D'autres critiques estiment qu'il s'agit d'un nouvel exemple de l'abandon par le président Anderson de sa rhétorique conservatrice antérieure et soulignent la nécessité d'une véritable option conservatrice pour les élections de 1984."
 Anderson.2.d:0 "Durant la campagne présidentielle de 1980, le candidat John Anderson a plaidé à plusieurs reprises pour l'expansion des parcs nationaux et la mise en place de mesures de protection afin de préserver la beauté naturelle pour les générations futures. Dès son accession à la présidence, l'un de ses premiers décrets majeurs a consisté à instaurer de nouvelles protections dans les parcs nationaux pour prévenir l'exploitation des ressources, ainsi qu'à créer de nouveaux parcs nationaux à travers le pays. Cette décision a été largement saluée par le public, de tous bords politiques, et par les groupes de défense de l'environnement qui ont loué l'action du président. Cependant, les milieux d'affaires, notamment le secteur minier et le syndicat des mineurs (United Mine Workers), ont exprimé des inquiétudes quant à l'expansion des parcs dans des zones susceptibles de receler des gisements de ressources précieuses, en particulier en Virginie-Occidentale et dans le Sud-Ouest américain."
 AndersonGOP.1.d:0 "À l'approche des primaires républicaines de 1980, la montée en puissance de l'aile conservatrice du parti semblait inévitable. Pourtant, à la surprise générale, le républicain libéral John Anderson remporta l'investiture, créant la surprise. Avec la victoire d'Anderson aux élections générales, le mandat de Bill Brock, président du Comité national républicain (RNC) et allié notoire de Reagan, à la tête du Parti républicain, était assurément menacé. Face à la purge imminente du RNC et à la menace de primaires soutenues par Anderson contre plusieurs membres du Congrès et sénateurs, nombreux sont ceux qui s'interrogent : un nouveau réalignement est-il inévitable ou un troisième parti conservateur va-t-il émerger ? Des figures républicaines conservatrices comme Paul Laxalt, Jesse Helms et Strom Thurmond ont déjà annoncé leur intention de soutenir des candidats lors des primaires contre des sénateurs républicains libéraux aux élections de mi-mandat de 1982."
 AgnewMcCarthy.1.d:0 "Spiro Agnew n'est pas étranger à la controverse depuis ses débuts à Annapolis. Lors d'un meeting de campagne dans le Wisconsin, plus tôt dans la journée, le président Agnew a dénoncé ce qu'il qualifie de « saboteurs de gauche » au sein du gouvernement, en collusion avec les élites libérales. Il a ensuite annoncé son intention d'étendre la surveillance et les vérifications des antécédents des fonctionnaires fédéraux, ainsi que de revoir les subventions accordées à certains établissements d'enseignement. Les médias, les associations de défense des droits civiques et la Ligue juive anti-diffamation ont vivement critiqué ce discours, le qualifiant d'atteinte aux libertés individuelles et aux minorités, et de retour au maccarthysme des années 1950. Par ailleurs, plusieurs gouverneurs républicains ont suggéré que cette mesure pourrait être l'occasion de réorienter les fonds alloués à l'éducation vers les forces de l'ordre ou d'instaurer de nouvelles réductions d'impôts."
 Brooke84.2.d:0 "Les années qui ont suivi l'assassinat du président Gerald Ford ont été tumultueuses pour la politique américaine. Alors que le président Nelson Rockefeller cherchait à remodeler le Parti républicain à son image, le mouvement politique évangélique naissant, porté par la Majorité morale, s'est radicalisé, et la John Birch Society en a été l'un des principaux bénéficiaires. Dirigée par le député Larry McDonald, cette organisation a largement profité de la récente rupture entre la Majorité morale et le Parti républicain. Cette tendance s'est accentuée avec la nomination d'Edward Brooke à la vice-présidence et sa campagne présidentielle victorieuse de 1984. Dans un discours virulent prononcé aujourd'hui, le président Brooke a condamné le groupe, le qualifiant de semeur de haine, et a lié ses partisans à une récente vague de crimes haineux dans le Sud profond. Le député McDonald a répliqué en affirmant que le président Brooke détournait l'attention des problèmes auxquels l'Amérique est confrontée et contribuait à son déclin moral."
 Brooke88.1.d:0 "Au vu de l'histoire politique des États-Unis depuis la Grande Dépression, rares sont ceux qui auraient anticipé la résurgence du libéralisme au sein du Parti démocrate. Pourtant, ironie du sort, l'assassinat du président Gerald Ford a provoqué ce phénomène. Avec l'accession du vice-président Nelson Rockefeller à la présidence et sa nomination victorieuse en 1976 face à l'ancien gouverneur Ronald Reagan, l'aile conservatrice et militante du parti a commencé à perdre de son influence. Les diverses réformes sociales libérales défendues par Rockefeller et Brooke ont entraîné un exode massif des électeurs du Sud et des évangéliques du Parti démocrate. Cette réorientation de la vie politique américaine a également permis aux démocrates du Sud de retrouver une force inégalée depuis les années 1960. Cela dit, les tensions sont vives au sein des deux partis et les appels à la création d'un troisième parti se multiplient chaque jour. Quoi qu'il en soit, le président Brooke, premier président afro-américain, restera sans aucun doute dans l'histoire pour son rôle majeur dans cette réorientation de la vie politique américaine."
 BrownConvention.1.d:0 "Lors d'une conférence de presse houleuse à Washington aujourd'hui, le président Jerry Brown a présenté sa proposition de convoquer une seconde Convention constitutionnelle. Pour ce faire, il faudrait que le nombre requis d'États ratifie la demande et envoie des délégués à cette hypothétique convention. Le président Brown a justifié cette mesure radicale en arguant que la procédure d'amendement traditionnelle est trop restrictive et que les changements profonds survenus depuis la Seconde Guerre mondiale exigent une réforme constitutionnelle en profondeur. Il appelle notamment à des amendements modifiant en profondeur le système fiscal du pays, à la limitation du nombre de mandats et à une nouvelle offensive pour l'amendement sur l'égalité des droits. Les conservateurs ont largement dénoncé cette annonce comme une tentative de prise de pouvoir, mais ont promis que si une convention a lieu, ils enverront des délégués pour défendre des amendements conservateurs, notamment un amendement visant à annuler l'arrêt Roe v. Wade."
 BrownCC.1.d:0 "À la surprise générale, l'appel du président Brown à une seconde Convention constitutionnelle a été couronné de succès. Lors d'un vote houleux hier soir, la Pennsylvanie est devenue le 34e État à demander une convention en vertu de l'article V, atteignant ainsi le nombre requis d'États pour sa convocation. Le nombre d'États demandeurs étant désormais atteint, la convention ne devrait plus tarder. Si le président Brown est à l'origine du processus, de nombreux conservateurs ont plaidé pour une participation à la convention afin de bloquer tout amendement progressiste et de défendre des amendements conservateurs, tels que la fin de la discrimination positive et l'annulation de l'arrêt Roe v. Wade. Seul l'avenir dira dans quelle mesure cela modifiera la Constitution."
 BrownCC.100.d:0 "Alors que le mandat du président Brown touche à sa fin, il apparaît clairement que la tentative de convoquer une Convention constitutionnelle n'aboutira pas. Si le président a défendu cette mesure comme une nécessité pour poursuivre l'assainissement et la réforme de Washington, ses opposants ont largement critiqué la proposition, la qualifiant de tentative flagrante de prise de pouvoir et de précédent dangereux. De plus, de nombreux démocrates ont exprimé leur scepticisme quant à la capacité de Brown, même en cas de tenue de la convention, à mobiliser ses membres pour des réunions productives ou à contrôler l'assemblée afin d'empêcher l'ajout de mesures radicales à la Constitution. Cela étant dit, le président Brown a fait part de sa déception, mais s'est engagé à poursuivre le combat pour la réforme de l'État dans les années à venir, après son départ de la Maison Blanche."
 Brown84.1.d:0 "Alors que le second mandat du président Brown touche à sa fin, il a tenu une conférence de presse pour évoquer son héritage. Lors de cette conférence, il a affirmé que son principal héritage serait son combat pour les droits civiques et la réforme de l'État. Tout au long de sa présidence, Jerry Brown s'est battu pour défendre et étendre les droits civiques, la protection de l'environnement et des investissements massifs dans l'éducation et la science. Les milieux d'affaires et les groupes de pression conservateurs ont critiqué à maintes reprises les politiques sociales et économiques du président Brown, les jugeant trop favorables aux entreprises et préjudiciables au tissu moral américain. Pour sa part, ses partisans considèrent qu'il a défendu leurs droits et œuvré pour le progrès social et la croissance économique, sans pour autant sacrifier les travailleurs américains. L'avenir dira comment l'histoire retiendra l'administration Brown, mais il est certain qu'elle ne sera pas reléguée au second plan."
 Dukakis88.0.d:0 "Durant la campagne présidentielle de 1988, Michael Dukakis, alors président, a largement axé sa campagne sur son succès initial en tant que gouverneur du Massachusetts, un succès qualifié de « miracle du Massachusetts » à l'échelle nationale. Depuis le début de son premier mandat, Dukakis s'est efforcé d'annuler les politiques économiques de Reagan, de défendre l'environnement et de soutenir les agriculteurs confrontés à la crise agricole. Plus controversée, sa politique commerciale a marqué une nette rupture avec celle de ses prédécesseurs, tous bords politiques confondus. Dukakis a mis fin aux négociations et au projet d'Accord de libre-échange nord-américain (ALENA), et a tenté de faire pression sur le Japon pour qu'il revoie sa balance commerciale avec les États-Unis. Globalement, son administration a défendu avec vigueur les droits des syndicats et des travailleurs américains, mais des combats restent à mener en vue d'un éventuel second mandat, notamment le débat croissant autour de ses initiatives en matière de santé."
 Kennedy80.0.d:0 "Durant la campagne présidentielle de 1980, Edward « Ted » Kennedy a plaidé à plusieurs reprises pour un gel de l'inflation pendant six mois. Si les détails de ce plan ont été jugés pour le moins lacunaires, le président a exposé aujourd'hui, dans une allocution, comment il entendait y parvenir. En résumé, Kennedy cherchera à instaurer un contrôle temporaire des salaires et des prix afin de lutter contre l'inflation pendant les prochains mois. Les réactions ont été mitigées. Les conservateurs ont fustigé ce plan, le qualifiant de solution superficielle qui ne ferait que repousser l'échéance. D'autres l'ont critiqué, l'accusant de recycler les politiques inefficaces de Nixon, héritées du tristement célèbre « choc Nixon » de la décennie précédente. Cela dit, d'après les sondages, l'opinion publique semble soutenir le plan avec prudence. L'avenir dira si ce pari sera payant pour l'administration Kennedy."
 Kennedy80.1.d:0 "Durant la campagne de 1980, le sénateur Edward « Ted » Kennedy défendait avec vigueur la nécessité pour le gouvernement fédéral d'appliquer la loi Humphrey-Hawkins afin de garantir un emploi à tous les citoyens valides de plus de 17 ans, l'objectif étant de ramener le chômage sous la barre des 4 % d'ici 1983. Bien que la loi ait été signée les années précédentes, le président Kennedy et d'autres dirigeants progressistes affirmaient depuis des années que le gouvernement ne l'appliquait pas correctement. Lors d'un meeting électoral à Philadelphie aujourd'hui, le président Kennedy a annoncé qu'il donnerait instruction aux agences fédérales de renforcer la planification économique et la création d'emplois, en partenariat avec des entreprises privées désireuses de s'engager, afin de stimuler l'emploi. Si les partisans du président ont salué cette décision comme le respect d'une promesse de campagne, ses adversaires conservateurs l'ont condamnée comme un pas de plus vers le socialisme."
 Kennedy80.2.d:0 "Lors de ses précédentes campagnes, le président Kennedy a souvent évoqué l'héritage de ses frères, faisant écho à une époque plus simple de la politique américaine, antérieure à leur assassinat. Cela dit, le président Edward « Ted » Kennedy s'est affranchi de l'influence de son frère aîné durant ses deux mandats. De la lutte pour préserver la force des syndicats américains et les politiques économiques keynésiennes à ses combats pour les droits des homosexuels, des femmes et de l'environnement, le président a mis en place une administration résolument progressiste. Si cela a suscité l'hostilité des électeurs conservateurs, notamment évangéliques, les progressistes et autres partisans du président affirment qu'il est le plus grand défenseur du progressisme américain depuis Roosevelt. L'avenir dira quel sera l'impact des politiques du président Kennedy sur l'Amérique, mais nul ne peut nier son influence sur la vie politique de la décennie."
 Wallace80.0.d:0 "Pendant des décennies, George Wallace a été l'une des figures politiques américaines les plus controversées du XXe siècle. Aussi, son accession à la présidence, lors de l'élection de 1976, a surpris le pays et le monde entier. Malgré son passé de figure controversée, notamment ses discours racistes, le président Wallace a su fédérer une coalition de gauche populiste, rassemblant évangéliques, syndicalistes et électeurs ruraux. Pour ce faire, il a mené une campagne active visant à renégocier les accords commerciaux avec d'autres nations afin de dynamiser l'industrie manufacturière américaine, à défendre les droits des personnes handicapées, à étendre la protection sociale, à relancer le programme spatial et à lutter contre l'arrêt Roe v. Wade.\n\nBien que populaire auprès des Sudistes et des syndicalistes, ses détracteurs lui ont reproché d'avoir considérablement creusé le déficit fédéral. Par ailleurs, il a été vivement condamné par plusieurs organisations féministes pour ses appels à interdire l'avortement. Quoi qu'il en soit, la présidence de George Wallace restera gravée dans l'histoire politique américaine comme une période charnière."
 Wallace80.1.d:0 "Lors d'un meeting électoral en Caroline du Nord, le président Wallace a annoncé la nécessité d'intensifier la lutte contre la drogue. Dans son discours, il a évoqué la hausse de la criminalité et du nombre de sans-abri dans les quartiers défavorisés, liés à l'épidémie de drogue. Le président Wallace a ensuite dénoncé l'athéisme et le déclin moral comme étant les principaux facteurs de cette épidémie. Pour contrer ce problème croissant, il préconise des peines minimales obligatoires plus sévères pour les personnes condamnées pour des infractions liées à la drogue, un renforcement des financements des forces de l'ordre, ainsi que l'annulation de l'arrêt Miranda v. Arizona. De plus, le président a également appelé à réintroduire la religion dans les écoles publiques en annulant l'arrêt Engel v. Vitale. Les réactions à ce discours sont mitigées : les partisans de Wallace, notamment les électeurs évangéliques, soutiennent fermement ces propositions, en particulier l'annulation de l'arrêt Engel v. Vitale ; en revanche, l'Union américaine pour les libertés civiles (ACLU) a fermement condamné ces propositions, les jugeant contraires à la liberté d'expression et portant atteinte aux libertés individuelles."
 Wallace80.2.d:0 "Dans un communiqué de presse publié hier soir, l'administration Wallace a annoncé son intention d'étendre les activités du Bureau de la planification économique (OEP). Ce dernier aura pour nouvelles missions de contribuer à la planification des initiatives économiques américaines et d'élaborer des propositions politiques qui seront soumises à l'examen de la Réserve fédérale, du Congrès et de la Maison Blanche. Par ailleurs, cette mesure renforcera les pouvoirs de l'OEP en matière d'aménagement du territoire et de logement à travers le pays. Les partisans de l'administration ont salué cette initiative, la considérant comme une étape nécessaire vers un système économique plus réglementé. Les opposants, notamment les défenseurs du libre marché, ont dénoncé cette mesure comme une nouvelle atteinte au marché et un pas de plus vers une économie planifiée et socialiste."
 Wallace80.3.d:0 "L'arrêt Roe v. Wade, décision historique, a, depuis son prononcé, suscité de vives controverses politiques. Avec l'influence croissante des électeurs évangéliques et la montée en puissance de groupes conservateurs comme la Majorité morale, le débat s'est envenimé. Dans une allocution prononcée aujourd'hui, le président George Wallace a réitéré sa condamnation de l'arrêt et s'en est pris plus que jamais à la Cour suprême pour avoir rendu cette décision. Le président a ensuite appelé à un amendement constitutionnel visant à annuler l'arrêt, qui sera prochainement présenté à la Chambre des représentants par des alliés de la Maison-Blanche. La réaction à ce discours a été pour le moins polarisée. Des responsables évangéliques et catholiques ont salué cette annonce, remerciant le président Wallace pour sa volonté de défendre la vie des enfants à naître, tandis que d'autres l'ont critiqué pour ses propos hostiles à la Cour et pour sa tentative de remettre en cause des années de progrès en matière de droits des femmes."
 Wallace80.4.d:0 "Lors d'une conférence de presse houleuse aujourd'hui, le président George Wallace a annoncé un nouveau décret interdisant de facto l'importation de voitures étrangères. Il a justifié cette mesure comme une protection nécessaire pour l'industrie automobile nationale et pour les travailleurs américains du secteur. L'accueil réservé à cette mesure est pour le moins mitigé. D'un côté, le syndicat United Auto Workers (UAW) a publié un communiqué saluant la défense des travailleurs américains par le président Wallace. De l'autre, les défenseurs du libre marché et les conservateurs ont dénoncé une mesure de népotisme flagrant. Les associations de consommateurs ont par ailleurs critiqué les constructeurs automobiles américains, les jugeant en retard en matière d'innovation et affirmant que cette mesure ne ferait que freiner l'innovation dans le secteur. La mesure a également été condamnée par plusieurs gouvernements étrangers, dont le Japon et l'Allemagne de l'Ouest, deux pays dotés d'une industrie automobile compétitive."
 Wallace80.5.d:0 "Dans une allocution télévisée hier soir, le président Wallace a présenté sa nouvelle politique commerciale américaine. Cette annonce fait suite à sa décision controversée d'interdire les importations de voitures étrangères. La nouvelle politique commerciale proposée vise officiellement à privilégier les travailleurs américains. Dans les faits, elle entraînera une hausse des droits de douane et le refus de signer de futurs accords de libre-échange. La réaction à cette proposition est aussi polarisée que toutes les autres mesures prises par le président au cours de sa carrière politique. Les dirigeants syndicaux et d'autres partisans du protectionnisme saluent largement la mesure. En revanche, de nombreux économistes critiquent la proposition, affirmant qu'elle entraînera une hausse durable des prix à la consommation. D'autres opposants traditionnels à l'administration Wallace estiment qu'il s'agit d'un nouvel exemple du capitalisme de connivence qui sévit depuis des années sous sa présidence."
 Wilson80.1.d:0 "L'accession de George McGovern à la présidence a suscité une vive controverse, non seulement auprès du grand public, mais aussi au sein même du Parti démocrate. Si son engagement en faveur d'une intervention limitée dans le monde a été salué par les pacifistes et les isolationnistes, de nombreux démocrates ont condamné sa politique étrangère, la jugeant trop faible face aux Soviétiques et contraire aux valeurs fondamentales américaines. La victoire du représentant Charlie Wilson sur le vice-président Sargent Shriver lors des primaires démocrates de 1980 a clairement démontré que McGovern n'était pas parvenu à rallier la majorité du parti à l'isolationnisme. Dans une interview accordée aujourd'hui, le président Wilson a réitéré avec force sa condamnation du « mcgovernisme » et a déclaré que son administration réévaluerait la politique étrangère et les opérations clandestines des États-Unis, tout en demandant des fonds supplémentaires pour la CIA lors des prochaines négociations budgétaires."
 Wilson88.1.d:0 "Lors de sa première candidature à la présidence, le député Charlie Wilson a défendu l'aile belliciste du Parti démocrate en réaction à l'isolationnisme du président McGovern. Dès le début de son premier mandat, le président Wilson a exposé les raisons pour lesquelles son administration cherchait à étendre les pouvoirs des agences de sécurité et à abandonner les aspects de politique étrangère du mcgovernisme. Cela dit, la doctrine Wilson ne se résume pas à une simple reprise d'idées anciennes par les partisans du « redressement ». Cette doctrine préconise non seulement le soutien aux mouvements de guérilla anticommunistes pour faire progresser la cause de la liberté, mais aussi une aide économique et politique après la libération afin de promouvoir un ordre mondial plus démocratique et libéral. Cette approche a été critiquée par les mcgoverniens, qui accusent le président Wilson d'impérialisme, ainsi que par les conservateurs budgétaires, qui estiment que la reconstruction nationale dans le tiers monde représente une dépense budgétaire trop importante pour l'économie actuelle."
 Wilson_JAP.6.d:0 "Lors d'une conférence de presse conjointe aujourd'hui, le président Wilson et le Premier ministre japonais [JAP.GetLeader] ont annoncé un nouvel accord bilatéral de sécurité et économique. Cet accord prévoit des révisions des relations commerciales entre les deux pays, visant à réduire le déficit commercial, et autorise le Japon à entamer sa remilitarisation, permettant ainsi aux États-Unis de réduire leur présence militaire sur son territoire. Cette annonce a suscité des réactions extrêmement contrastées. Le département d'État américain et l'ambassadeur des États-Unis au Japon ont publié une déclaration commune saluant cette initiative comme une mesure nécessaire au maintien de la paix régionale, tandis que la Chine, l'Union soviétique et la Corée du Nord l'ont dénoncée comme impérialiste et menaçante pour la sécurité régionale."
 Wilson_JAP.7.d:0 "Dans une déclaration surprenante faite plus tôt dans la journée, le gouvernement japonais a annoncé son intention de modifier la Constitution et d'entamer un processus de remilitarisation. Ce projet prévoit notamment un renforcement considérable des forces navales et aériennes japonaises, incluant plusieurs porte-avions. Cette annonce intervient après que le président Wilson a publiquement exhorté le gouvernement japonais à faire des concessions commerciales et à s'engager dans une remilitarisation afin que les États-Unis puissent redéployer leurs forces sur d'autres théâtres d'opérations. Les réactions à cette annonce sont pour le moins mitigées. Le département d'État américain et l'ambassadeur des États-Unis au Japon ont publié une déclaration conjointe saluant cette initiative comme une mesure nécessaire au maintien de la paix régionale, tandis que la Chine, l'Union soviétique et la Corée du Nord l'ont dénoncée comme une mesure impérialiste et un danger pour la sécurité régionale."
 Clinton88.0.d:0 "Durant la campagne présidentielle de 1984, le gouverneur Bill Clinton avait plaidé pour la création d'un Conseil de sécurité économique. Ce conseil réunirait des économistes de renom, des représentants syndicaux et des chefs d'entreprise afin de coordonner les politiques économiques potentielles du pays en recherchant un consensus entre ces trois groupes souvent opposés. Aujourd'hui, lors d'un meeting de campagne à Little Rock, dans l'Arkansas, le président Clinton a officiellement annoncé la création de ce conseil. Bien que ce dernier n'ait pas le pouvoir de dicter la politique économique, le président a déclaré qu'il comptait s'appuyer sur ces instances pour orienter sa politique économique et lors des négociations budgétaires avec le Congrès dans les années à venir. Les partisans de Clinton affirment que cette mesure contribuera à réduire les conflits au sein de l'économie et à stimuler la croissance. Les progressistes, critiques du président, dénoncent cette proposition comme une capitulation face aux grandes entreprises, tandis que les conservateurs condamnent le conseil comme un instrument du capitalisme de connivence."
 Clinton88.1.d:0 "Après sa réélection de justesse en 1988, rares étaient ceux qui auraient prédit l'accession de Bill Clinton à la présidence, et encore moins sa victoire sur Ronald Reagan en 1984. Pourtant, non seulement le président Clinton a reconquis la Maison-Blanche pour les démocrates en 1984, mais il a également réussi à corriger les excès de la politique économique de Reagan tout en défendant les investissements dans l'éducation et les infrastructures. Alors que la fin de sa présidence approche, il est clair que le président Clinton a su redynamiser le Parti démocrate du Sud et des Appalaches. Cela dit, sa volonté de déréglementer la finance, de réformer l'aide sociale et de soutenir l'ALENA a suscité des critiques de la part des libéraux et des militants progressistes du Parti démocrate. Parallèlement, les conservateurs ont attaqué son administration pour son libéralisme social. Quoi qu'il en soit, l'avenir dira si l'administration Clinton a tenu sa promesse de campagne de « Placer le peuple au premier plan »."
 Connally84.1.d:0 "Lors d'une conférence de presse pour le moins surprenante aujourd'hui, le président John Connally a annoncé qu'il ordonnait au FBI de rouvrir l'enquête sur l'assassinat de John F. Kennedy. Le président Connally critique depuis longtemps le rapport officiel et, fait notable, était présent lors de l'assassinat, étant alors gouverneur du Texas. Cette annonce a suscité de nombreuses moqueries de la part des médias et des progressistes, et a été dénoncée par la famille Kennedy comme une manœuvre politique flagrante. À l'inverse, les théoriciens du complot et certains militants conservateurs ont salué cette décision, la considérant comme une étape nécessaire pour restaurer la confiance dans le gouvernement fédéral. Quoi qu'il en soit, le nouveau rapport du FBI ne fera probablement qu'alimenter davantage les débats sur les véritables responsables de l'assassinat de Kennedy."
 BushAlt84.1.d:0 "Dans un communiqué de presse publié hier soir, l'administration Bush a annoncé la levée immédiate du contrôle des prix du pétrole, en vigueur depuis le pic de la seconde crise pétrolière. Le communiqué soulignait que cette décision était rendue possible par l'augmentation de la production pétrolière nationale, l'accroissement de l'offre étrangère et la stabilisation des marchés internationaux. Cependant, les prix de l'essence et du pétrole ont augmenté ce matin aux États-Unis, risquant d'éroder la confiance des consommateurs dans l'économie. Les détracteurs estiment que cette mesure a été prise prématurément, dans le but de satisfaire les soutiens du président issus du monde des affaires, tandis que les partisans du président Bush affirment qu'il s'agissait d'une étape nécessaire à la normalisation de l'économie."
 Connally84.9.d:0 "Dans un communiqué de presse publié hier soir, le gouvernement Connally a annoncé la levée immédiate du contrôle des prix du pétrole, en vigueur depuis le pic de la seconde crise pétrolière. Le communiqué soulignait que cette décision était rendue possible par l'augmentation de la production pétrolière nationale, l'accroissement de l'offre étrangère et la stabilisation des marchés internationaux. Cependant, les prix de l'essence et du pétrole ont flambé ce matin sur le marché intérieur, érodant la confiance des consommateurs. Les détracteurs estiment que cette mesure a été prise prématurément, dans le but de satisfaire les soutiens du président issus du monde des affaires, tandis que les partisans du président Connally affirment qu'il s'agissait d'une étape nécessaire à la normalisation de l'économie."
 Connally84.10.d:0 "Au début du mandat du président John Connally, l'Amérique était dans une situation critique. La stagflation, qui minait l'économie, et la seconde crise pétrolière, qui aggravait encore la situation, rendaient cruciale la restauration de la confiance dans l'économie américaine. Grâce à des politiques budgétaires saines et à l'association d'une augmentation de la production pétrolière nationale et de mesures de soutien des prix, l'administration Connally est parvenue à rétablir cette confiance. Sur le plan politique, cependant, l'ancien gouverneur démocrate du Texas s'est révélé une figure clivante. En mettant en avant ses racines démocrates du Sud, Connally a réussi à attirer de nombreux transfuges au Parti républicain. Toutefois, cette focalisation sur le Sud a fortement aliéné les modérés et les libéraux du Nord au sein du Parti républicain, en particulier lors de son second mandat. Le veto opposé à la loi globale anti-apartheid a porté le coup de grâce à de nombreux républicains libéraux, dont plusieurs sénateurs, John Chaffee (Rhode Island) et Arlen Specter (Pennsylvanie), qui ont rejoint le groupe démocrate. Quoi qu'il en soit, le président Connally restera assurément dans les mémoires pour avoir redessiné le paysage politique américain pour les décennies à venir."
 Trump88.0.d:0 "Lors d'une conférence de presse virulente à la Maison Blanche aujourd'hui, le président Donald Trump a remis en question l'engagement des États-Unis envers l'OTAN. Il a dénoncé le fait que les membres de l'Alliance ne contribuent pas équitablement aux dépenses militaires et que cette disparité oblige les États-Unis à payer la facture au détriment de leur potentiel économique. Cette déclaration a immédiatement déclenché une vive polémique, des membres modérés du Congrès, des deux partis, la condamnant comme une menace pour la sécurité nationale américaine. À l'inverse, des personnalités politiques d'extrême gauche comme d'extrême droite ont salué cette annonce, y voyant respectivement un pas vers la paix mondiale et une démonstration de la primauté des États-Unis sur le reste du monde. Notamment, le représentant Ron Paul, républicain texan aux idées libertariennes, et Bernie Sanders, représentant indépendant du Vermont, ont tous deux salué cette annonce comme un rare exemple de consensus bipartisan."
 Baker88.1.d:0 "Tout au long de sa carrière politique, Howard Baker a été un fervent défenseur de l'équilibre budgétaire. Cependant, son approche en la matière lui a valu de nombreuses inimitiés, tant au sein de l'échiquier politique que dans les deux camps. Contrairement à d'autres conservateurs, le président Baker a soutenu qu'un budget équilibré ne pouvait reposer uniquement sur les plus démunis, en réduisant drastiquement les aides sociales. Ses projets de loi répétés visant à augmenter les impôts tout en modifiant la politique sociale lui ont valu l'ire des progressistes et des partisans de l'économie de l'offre. Cela étant dit, après près de deux mandats, le président est parvenu à réduire considérablement le déficit budgétaire fédéral grâce à divers compromis avec les deux camps. Néanmoins, aucun amendement constitutionnel sur l'équilibre budgétaire n'a encore été adopté et le président Baker a indiqué qu'il continuerait de défendre cette proposition dans les années à venir, même après la fin de son mandat."
 Baker88.2.d:0 "Tout au long de sa carrière politique, Howard Baker a été un fervent défenseur de l'équilibre budgétaire. Cependant, son approche en la matière lui a valu de nombreux ennemis, tant à droite qu'à gauche. Contrairement à d'autres conservateurs, le président Baker soutenait qu'un budget équilibré ne pouvait reposer uniquement sur les plus démunis, en réduisant drastiquement les aides sociales. Ses projets de loi répétés visant à augmenter les impôts tout en modifiant la politique sociale lui ont valu l'ire des progressistes et des partisans de l'économie de l'offre. Cela dit, les compromis conclus durant son premier mandat pour réduire le déficit ont provoqué la colère de la base militante du Parti républicain. En réaction, le conservateur radical Pat Buchanan a annoncé son intention de se présenter contre le président Baker lors des primaires républicaines de 1992."
 Baker88.3.d:0 "Tout au long de sa carrière politique, Howard Baker a été un fervent défenseur de l'équilibre budgétaire. Cependant, son approche en la matière lui a valu de nombreux ennemis, tant au sein de l'échiquier politique que dans les deux camps. Contrairement à d'autres conservateurs, le président Baker soutenait qu'un budget équilibré ne pouvait reposer uniquement sur les plus démunis, en réduisant drastiquement les aides sociales. Ses projets de loi répétés visant à augmenter les impôts tout en modifiant la politique sociale lui ont valu l'ire des progressistes et des partisans de l'économie de l'offre. Cela dit, après près de deux mandats, le président est parvenu à réduire considérablement le déficit budgétaire fédéral grâce à divers compromis avec les deux camps. À l'approche des élections de 1988, l'avenir dira si le Parti républicain parviendra à conserver la présidence, et, le cas échéant, s'il maintiendra la position de Baker sur l'équilibre budgétaire. Bien entendu, tout cela suppose que le candidat républicain puisse vaincre le candidat démocrate lors des prochaines élections."
 Mondale80.1.d:0 "La nomination de Walter Mondale en 1980 a marqué un rejet catégorique du « macgovernisme » au sein du Parti démocrate. Lors d'une conférence de presse aujourd'hui, le président Mondale a exposé les mesures envisagées pour contrer le « macgovernisme », en insistant principalement sur l'annulation des différentes privatisations menées sous l'administration McGovern. Il a également exprimé le souhait de renouer avec le libéralisme du New Deal des précédentes administrations démocrates. La réaction des démocrates anti-macgovernistes a été globalement positive, ses partisans y voyant un retour aux valeurs traditionnelles du parti. À l'inverse, les partisans de McGovern ont fustigé cette annonce, la qualifiant de trahison de l'héritage du président McGovern et de recul sur la voie de la prospérité économique. De l'autre côté de l'hémicycle, les conservateurs ont dénoncé cette mesure comme un retour à un État omniprésent."
 Mondale80.2.d:0 "Durant la campagne de 1980, le sénateur Mondale a plaidé avec vigueur pour l'application de la loi Humphrey-Hawkins, garantissant un emploi à tous les citoyens valides de plus de 17 ans, afin de ramener le chômage sous la barre des 4 % d'ici 1983. Bien que la loi ait été promulguée les années précédentes, le président Mondale et d'autres critiques libéraux du « mcgovernisme » ont soutenu pendant des années que l'administration précédente ne l'appliquait pas correctement. Lors d'un meeting électoral à Milwaukee aujourd'hui, le président Mondale a annoncé qu'il chargerait les agences fédérales de renforcer la planification économique et la création d'emplois, en partenariat avec des entreprises privées désireuses de s'engager, afin de dynamiser l'emploi. Si ses partisans ont salué cette décision, y voyant le respect d'une promesse de campagne, ses opposants conservateurs l'ont condamnée, y voyant un pas de plus vers le socialisme. De plus, les partisans du « mcgovernisme » ont dénoncé cette mesure, y voyant une atteinte à l'héritage du président McGovern et le recyclage de politiques économiques passées qui avaient échoué."
 Mondale84.10.d:0 "Depuis seize ans, les Démocrates occupent la Maison-Blanche, un exploit inédit depuis la Grande Dépression et la Seconde Guerre mondiale. Pourtant, les différences entre les deux administrations sont flagrantes. La victoire de McGovern en 1972 représentait un rejet non seulement de la politique nixonienne, mais aussi du libéralisme traditionnel incarné par Hubert Humphrey, mentor politique de Mondale. Le McGovernisme ayant été fermement rejeté par le Parti démocrate, et le président Mondale ayant insufflé un nouvel élan à la coalition du New Deal et fait adopter diverses lois renforçant l'État-providence américain, il est indéniable que le président Mondale a pris sa revanche sur son mentor après ses défaites aux élections de 1968 et 1972. Quoi qu'il en soit, Walter Mondale restera dans les mémoires comme le président qui a su réunir la coalition du New Deal et défendre le libéralisme face à la résurgence d'un mouvement conservateur porté par la Majorité morale."
 MONDALE88.100.d:0 "Alors que le mandat de Mondale touche à sa fin, il est temps de revenir sur les seize années de règne démocrate. Après les tumultueuses années 1960 et 1970, le président Mondale a su poursuivre la politique économique et consolider les réformes entreprises par le président Carter. Suite aux élections de 1968 et 1972, de nombreux analystes politiques prédisaient la fin de l'ère du New Deal. Pourtant, le président Mondale a définitivement démenti cette prédiction. Sous son administration, diverses politiques socialement libérales et économiquement keynésiennes ont été mises en œuvre ou améliorées. Entre l'extension des droits civiques, le moratoire sur la peine de mort, l'élargissement de l'accès aux soins de santé, la restauration des programmes de la Grande Société et la lutte pour la protection de l'environnement, le président Mondale a clairement démontré que le peuple américain était toujours disposé à écouter des solutions progressistes aux problèmes contemporains. Les détracteurs du président Mondale ont critiqué à maintes reprises sa gestion des affaires sociales et économiques, notamment l'expansion de la protection sociale et la réduction des dépenses militaires."
 Mondale88.1.d:0 "À l'issue des élections de 1980, rares étaient ceux qui auraient prédit le retour en force du vice-président Walter Mondale en 1984. Au début des années 1980, les médias annonçaient déjà la fin de la coalition du New Deal. À la surprise générale, le candidat Mondale se présenta comme un libéral résolument attaché au New Deal. Sa victoire fut attribuée à sa capacité à regagner du terrain dans le Sud et à remporter une victoire écrasante dans le Midwest industriel. L'administration du président Mondale a, non sans controverse, entrepris de renverser la politique économique de Reagan. Globalement, grâce à l'extension des droits civiques, au moratoire sur la peine de mort, à l'amélioration de l'accès aux soins de santé, à la restauration des programmes de la Grande Société et à la lutte pour la protection de l'environnement, il a clairement démontré que l'opinion publique américaine était toujours disposée à écouter des solutions progressistes aux problèmes contemporains. Les détracteurs du président Mondale ont critiqué à maintes reprises sa gestion des affaires sociales et économiques, notamment l'expansion de la protection sociale et la réduction des dépenses militaires."
 Dupont.0.d:0 "Durant les primaires républicaines de 1988, le président Pete DuPont fut la cible de vives critiques de la part des conservateurs et des partisans de Reagan pour ses appels répétés à faire toute la lumière sur l'affaire Iran-Contra. S'appuyant sur ces critiques et d'autres visant la politique étrangère de l'administration Reagan, le président accorda une interview à l'émission « 60 Minutes » afin d'exposer sa vision de la politique étrangère et de présenter la doctrine DuPont en matière de politique étrangère et d'opérations clandestines. Lors de cet entretien, il affirma que le soutien aux combattants de la liberté et aux forces anticommunistes à l'étranger constituait une priorité nationale, mais qu'il nécessitait des garanties appropriées et l'approbation du Congrès. Il souligna également que les États-Unis devaient s'assurer que les causes soutenues étaient pertinentes et conformes aux idéaux fondateurs du pays, afin de favoriser l'avènement d'un État démocratique après l'indépendance. La Heritage Foundation et d'autres alliés et groupes de réflexion reaganistes publièrent un communiqué dénonçant les critiques du président à l'égard des Contras et de l'ancien président."
 Dupont.1.d:0 "Le ministère de la Justice a publié un communiqué vendredi soir annonçant la nomination de Lawrence Welsh par le président DuPont au poste d'enquêteur spécial sur l'affaire Iran-Contra. Durant sa campagne, le candidat DuPont avait insisté sur la nécessité d'approfondir l'enquête, ce qui avait valu à DuPont, lors des primaires et de l'élection générale, de nombreuses critiques de la part des républicains quant à son obsession pour ce sujet. La réaction des conservateurs républicains à cette annonce a été majoritairement négative, nombre d'entre eux accusant le président de trahison. À l'inverse, des personnalités démocrates ont salué la volonté du président de garantir que justice soit faite."
 Dupont.3.d:0 "Aujourd'hui, une révélation choquante a été faite : l'enquêteur spécial Lawrence Welsh a annoncé que le gouvernement fédéral allait porter plainte contre l'ancien président Ronald Reagan et l'ancien vice-président George H.W. Bush en vertu de la loi RICO (Racketeer Influenced and Corrupt Organizations Act) pour leur rôle dans l'affaire Iran-Contra. Cette annonce a déclenché une vive polémique. Les dirigeants conservateurs ont appelé à manifester et plusieurs membres républicains du Congrès, dont Newt Gingrich, ont réclamé la destitution du président. Au sein du parti, certains conservateurs ont également lancé une campagne pour Jack Kemp en vue des primaires républicaines de 1992, en réaction à cette décision et à d'autres projets de loi de DuPont jugés contraires aux souhaits des conservateurs. De l'autre côté de l'hémicycle, les démocrates ont salué la rapidité d'action du ministère de la Justice et ont exprimé leur souhait d'un procès rapide."
 Dupont.4.d:0 "Vendredi soir, tard dans la nuit, le ministère de la Justice a publié un communiqué annonçant que l'ancien président Reagan et le vice-président Bush ne seraient pas inculpés pour leur rôle dans l'affaire Iran-Contra. Bien que l'enquête se poursuive, notamment concernant d'éventuelles inculpations de plusieurs anciens responsables de l'administration, il semble pour l'instant que Reagan et Bush ne seront poursuivis pour aucun crime. Les républicains conservateurs ont salué cette décision, tout en critiquant le président Pete DuPont pour la manière dont l'enquête a été menée. Cela étant dit, même sans inculpation de l'ancien président, ce scandale ternira presque certainement l'héritage de Reagan et compromettra probablement toute future candidature à la présidence de l'ancien vice-président Bush."
 Dupont.5.d:0 "Après plusieurs semaines de procès, la défense et l'accusation ont présenté leurs arguments dans les affaires retentissantes visant l'ancien président et l'ancien vice-président. Moins de 24 heures plus tard, le jury a rendu un verdict de culpabilité. Bien que le prononcé de la peine ne soit pas attendu avant plusieurs jours, la peine minimale pour racket sera assurément lourde. Les réactions au procès ont été vives et clivantes. Les organisations conservatrices soutenant Reagan, telles que la Majorité morale et le Club pour la croissance, ont appelé à manifester et envisagent ouvertement de présenter un candidat contre le président DuPont lors des primaires de 1992. Des figures républicaines libérales comme John Chaffee et Arlen Specter ont salué la rapidité du jugement et les actions du président DuPont. Les démocrates, lorsqu'ils étaient sollicités pour s'exprimer, ont généralement félicité le jury pour sa décision sans équivoque."
 UDALL88.1.d:0 "La contre-culture des années 1960 et 1970, conjuguée au mouvement des droits civiques, a suscité une réaction conservatrice, amplifiée par plusieurs décisions de justice majeures, notamment l'arrêt historique Roe v. Wade. Face à cette réaction, l'avenir du libéralisme américain semblait compromis. Cependant, le président Mo Udall a su contenir le courant conservateur et défendre plusieurs causes progressistes, en particulier la réforme du système de santé, la fédéralisation de l'aide sociale et la protection de l'environnement et de la santé. Cela dit, l'administration Udall n'est pas exempte de critiques au sein du Parti démocrate ; les syndicats ont souvent remis en question sa politique de libre-échange, notamment son soutien à l'Accord de libre-échange nord-américain (ALENA), tandis que ses opposants conservateurs estimaient que l'augmentation des dépenses sociales freinait l'économie américaine et que les aides étaient accordées à des personnes qui n'y avaient pas droit. Malgré cela, le président Udall quitte la présidence avec une forte popularité et, grâce à la reprise économique et aux réformes entreprises sous son administration, devrait laisser un héritage politique important."
 Bush84.1.d:0 "L'assassinat du président Ronald Reagan en 1981 a marqué un tournant dans l'histoire américaine, venant clore près de deux décennies de troubles et d'assassinats politiques. Arrivé au pouvoir dans ce contexte tragique, le président George Bush a adopté une ligne modérée, incarnant ce qu'il a baptisé « conservatisme compassionnel ». En tant que président, il s'est efforcé de trouver un consensus bipartisan avec un Congrès largement hostile afin de traiter des questions telles que le financement de l'avortement, la lutte contre le sida et la recherche d'un terrain d'entente sur la réforme fiscale. Par ailleurs, ses positions modérées, son calme et son expertise en politique étrangère ont fait de lui un dirigeant fort et bienveillant pour la nation dans une période difficile. Quelle que soit la manière dont on se souviendra de sa politique intérieure, le président Bush restera dans les mémoires comme une figure rassembleuse des années 1980, ayant guidé l'Amérique hors de l'une de ses périodes les plus sombres."
 Bush84.2.d:0 "Lors d'un discours prononcé aujourd'hui à New York devant des investisseurs, le président George Bush a exposé ses réserves quant à l'économie de l'offre prônée par les conservateurs et les reaganistes au sein du Parti républicain. Auparavant, lors des primaires républicaines de 1980, le candidat Bush avait qualifié cette économie de « maggie économique ». Bush a réaffirmé cette position aujourd'hui, arguant que cette théorie économique ne ferait qu'aggraver le déficit fédéral tout en redistribuant les revenus aux plus riches. Le président a soutenu qu'il fallait viser un équilibre entre l'économie conservatrice et les politiques keynésiennes antérieures, tout en s'efforçant de réduire le déficit fédéral grâce à des compromis bipartisanes. Le discours a globalement été bien accueilli par le public ; si les franges les plus critiques des deux partis ont émis des réserves, la plupart des Américains semblent satisfaits d'une politique économique modérée visant à sortir l'Amérique de la crise de stagflation actuelle."
 Bush88.0.d:0 "Face à la recrudescence des crimes violents, notamment des homicides et des bavures policières, le président George Bush a annoncé aujourd'hui la signature d'un décret visant à restreindre l'importation d'armes semi-automatiques. Les défenseurs de la sécurité publique et les syndicats de police ont largement salué cette décision, la considérant comme une mesure de bon sens pour endiguer la violence armée qui ravage les villes américaines. Les défenseurs du droit de porter des armes, en particulier la National Rifle Association (NRA), ont quant à eux condamné la mesure, la qualifiant d'abus de pouvoir illégal et de violation flagrante du Deuxième Amendement, et ont annoncé leur intention de la contester devant les tribunaux. Les experts estiment toutefois que cette contestation n'a aucune chance d'aboutir compte tenu de la composition actuelle de la Cour suprême."
 Bush88.1.d:0 "Au moment de son accession à la présidence, George Bush s'était forgé une réputation d'expert en relations internationales grâce à son expérience au sein des administrations précédentes. Face à la crise du bloc soviétique à la fin des années 1980, un président moins expérimenté aurait facilement pu entraîner le pays dans une crise internationale majeure. Le président Bush est parvenu à renforcer les liens diplomatiques entre l'Amérique et ses alliés, tout en œuvrant à l'établissement de relations stables avec l'Union soviétique. Quoi qu'il arrive, le président Bush restera dans les mémoires comme un dirigeant fort sur la scène internationale, et peut-être même comme l'instigateur d'un « Nouvel Ordre Mondial » si le bloc soviétique venait à s'effondrer."
 Bush88.2.d:0 "Avant d'accéder à la présidence en 1984, George Bush a occupé des postes à responsabilités dans les domaines de la politique étrangère et des opérations clandestines au sein des administrations précédentes. Son passage à la tête de la CIA est particulièrement marquant. Face aux bouleversements de la Guerre froide à la fin des années 1980 et à l'instabilité mondiale croissante, le président Bush a su guider les États-Unis à travers cette période tumultueuse sans recourir à la politique du bord du gouffre ni provoquer de crise internationale. Alors que le bloc russe semble potentiellement au bord du précipice, le président Bush restera peut-être dans l'histoire comme le précurseur d'un « Nouvel Ordre Mondial ». Quoi qu'il en soit, il restera comme l'un des plus grands hommes d'État américains de l'après-guerre. Cela dit, son héritage politique intérieur est plus incertain, notamment en raison de la primaire serrée qui oppose son vice-président, Dan Quayle, au conservateur virulent Pat Buchanan."
 Simon88.1.d:0 "Lors d'une conférence de presse aujourd'hui, le président Paul Simon a exhorté le Congrès et les États à adopter et à ratifier un amendement constitutionnel sur l'équilibre budgétaire. Nombreux sont ceux qui s'étonneront de la surprise que suscite cette demande de la part d'un président démocrate réputé libéral, étant donné que la plupart des défenseurs de l'équilibre budgétaire sont plutôt conservateurs. Cela dit, Simon s'est présenté comme un libéral assez atypique lors des primaires de 1988, mettant l'accent sur le libéralisme social et la garantie d'une monnaie stable afin d'atténuer les pressions inflationnistes sur les prix à la consommation. La réaction à cette proposition est mitigée ; les partisans du président estiment qu'il s'agit d'une mesure nécessaire pour éviter de futurs problèmes inflationnistes comme ceux des années 1960 et 1970. Les conservateurs favorables à un amendement sur l'équilibre budgétaire soutiennent majoritairement cette version de l'amendement, mais s'engagent à débattre avec le président des modalités de mise en œuvre de cet équilibre. Les libéraux plus traditionnels en matière d'économie ont condamné la mesure, la jugeant contraire à la théorie économique et susceptible de mener à des coupes drastiques dans les dépenses sociales."
 McGovern84.1.d:0 "Les guerres étrangères menées par les États-Unis et leur implication dans des conflits par procuration contre l'Union soviétique ont été au cœur des campagnes de McGovern, tant en 1972 qu'en 1984. À la surprise générale, le président McGovern remporta l'élection de 1984, douze ans après une victoire écrasante. Lors d'un meeting électoral à Des Moines aujourd'hui, McGovern a exposé sa nouvelle approche de la politique étrangère. Son discours insistait sur le fait que les États-Unis devaient rechercher des relations pacifiques avec l'Union soviétique tout en apportant un soutien politique et économique à leurs alliés démocratiques. Il affirmait également que les opérations américaines en Amérique latine devaient viser avant tout à soutenir l'autodétermination des peuples autochtones, et non à défendre les intérêts des oligarques et des multinationales. Ce discours a suscité de vives réactions : les partisans de McGovern ont salué cette nouvelle politique comme un grand pas en avant pour un monde pacifique, de nombreux démocrates l'ont accusé d'isolationnisme, tandis que les républicains ont soutenu que le président trahissait leurs alliés à travers le monde."
 McGovern84.2.d:0 "Lors d'un meeting électoral à Newark, dans le New Jersey, le président McGovern annonça la fin progressive de la guerre contre la drogue. Il affirma que les politiques actuelles étaient plus néfastes que bénéfiques ; tout en reconnaissant que la toxicomanie constituait un problème majeur, il souligna qu'elle devait être traitée médicalement et par la réhabilitation des usagers, et non par de longues peines de prison. De plus, McGovern soutint que les fonds alloués à ce programme pourraient être réaffectés à la résolution de problèmes plus urgents, tels que la pauvreté dans les quartiers défavorisés. Les partisans du président applaudirent cette décision, estimant qu'elle était conforme à ses promesses de campagne de 1972 et 1984. D'autres démocrates exprimèrent leur inquiétude quant à cette mesure et à son impact potentiel sur la criminalité. Les conservateurs, quant à eux, fustigèrent le président, y voyant un nouvel exemple des politiques radicales de son administration et de sa volonté de détruire le tissu moral de l'Amérique."
 McGovern88.2.d:0 "Au vu des résultats de l'élection de 1972, presque personne, peut-être même pas George McGovern lui-même, n'aurait pu s'attendre à cela. Non seulement McGovern remporta à la surprise générale l'investiture démocrate de 1984, mais il parvint également, à la stupéfaction générale, à vaincre le président sortant. Par la suite, il gouverna en véritable libéral. Au grand dam de la droite religieuse et des faucons des deux partis, le président entreprit de mettre fin à la guerre contre la drogue, de réévaluer les engagements étrangers des États-Unis et de défendre le droit à l'autodétermination des peuples autochtones. Ces mêmes critiques affirmaient également que le président McGovern gouvernait régulièrement comme un gauchiste déconnecté de la réalité. Malgré cela, McGovern remporta une victoire écrasante à la réélection en 1988. Si ses détracteurs démocrates lui reprochaient de s'être éloigné des valeurs traditionnelles du parti, la vigueur de l'économie américaine sous sa présidence a largement étouffé toute opposition publique de la gauche. En définitive, le président McGovern réussit à remodeler le paysage politique américain et, qui plus est, à effacer ses défaites politiques passées, tant au niveau national qu'au sein du Parti démocrate."
 Kissinger88.0.d:0 "Face à la recrudescence des crimes violents, notamment les meurtres, les bavures policières et les crimes haineux, le président Henry Kissinger a annoncé aujourd'hui la signature d'un décret visant à restreindre l'importation d'armes à feu semi-automatiques. Les défenseurs de la sécurité publique et les syndicats de police ont largement salué cette décision, la considérant comme une mesure de bon sens pour endiguer la violence armée qui ravage les villes américaines. Les défenseurs du droit de porter des armes et les partisans de l'ancien président McDonald, en particulier la National Rifle Association (NRA), ont quant à eux condamné la mesure, la qualifiant d'abus de pouvoir fédéral et de violation flagrante du Deuxième Amendement, et ont promis de la contester devant les tribunaux. Les experts estiment que cette contestation est sans fondement compte tenu de la composition actuelle de la Cour suprême. Cela étant dit, l'ancien président McDonald a exhorté ses partisans à manifester et à écrire à leurs élus pour faire annuler la décision, alimentant ainsi les rumeurs d'un possible retour en politique de l'ancien président en 1992."
 Kissinger88.1.d:0 "Dans une allocution télévisée aujourd'hui, le président Henry Kissinger a annoncé que les États-Unis mettaient fin au boycott des Nations Unies. Il a déclaré que le boycott de l'administration précédente avait considérablement affaibli l'influence américaine à l'étranger et que la reprise des travaux de l'ONU serait une étape cruciale pour redorer l'image internationale des États-Unis. Les partisans du président, ainsi que les internationalistes des deux partis, ont salué cette décision. En revanche, l'ancien président McDonald a fustigé cette décision, la qualifiant de nouvelle trahison de la souveraineté américaine au profit des intérêts mondialistes. Lors d'un meeting électoral à Tampa, en Floride, il a déclaré que les Américains « devaient reprendre le contrôle du pays aux mains des mondialistes ». La Ligue anti-diffamation a condamné les propos de l'ancien président McDonald, suite à plusieurs actes de haine antisémites survenus en Floride et à New York dans les heures qui ont suivi ces discours."
 Kissinger88.5.d:0 "Dans un communiqué de presse publié vendredi soir, le ministère de la Justice a confirmé que la Western Goals Foundation faisait l'objet d'une enquête fédérale concernant ses activités sous l'administration McDonald. La Western Goals Foundation était soupçonnée depuis des années d'être un réseau d'opérations clandestines parallèles pour les alliés de l'ancien président. Compte tenu des rumeurs d'un possible retour en politique de ce dernier, on peut légitimement se demander comment l'entourage de McDonald réagira à cette enquête. L'ancien président a d'ailleurs publié une déclaration affirmant que l'enquête était une chasse aux sorcières politique menée contre lui et ses alliés, dans le but de discréditer son mouvement et sa campagne électorale de 1992."
 Landgrebe80.1.d:0 "Lors d'une conférence de presse houleuse aujourd'hui, le président Earl Landgrebe a annoncé son intention de réhabiliter le tristement célèbre sénateur anticommuniste Joseph McCarthy. Les partisans du président Landgrebe et de l'ancien président Spiro Agnew ont largement soutenu cette décision, qui vise à glorifier McCarthy comme un héros américain ayant lutté avec vigueur contre la subversion communiste intérieure. Les républicains et démocrates libéraux, quant à eux, ont fustigé cette initiative, la qualifiant de manœuvre politique destinée à détourner l'attention des problèmes économiques qui frappent actuellement le pays. Ils ont également condamné la glorification de la violation des libertés civiles et la diffamation. Quoi qu'il en soit, il s'agit là d'un nouveau signe de la réaction conservatrice qui a conduit à l'élection d'Agnew et de Landgrebe."
 Landgrebe88.1.d:0 "L'élection de 1968, de l'avis de nombreux analystes politiques, a sonné le glas de la coalition du New Deal. Vingt ans plus tard, force est de constater que cette prédiction s'était avérée juste. Malgré la chute du président Nixon suite au scandale du Watergate, les présidents Agnew puis Landgrebe sont parvenus à maintenir la cohésion de la nouvelle coalition républicaine et à infliger de lourdes défaites aux démocrates et aux républicains libéraux au sein de leur propre parti lors des élections qui ont suivi le scandale et la crise économique de la fin des années 1970. Bien entendu, cette série de victoires finira par s'interrompre, mais il est impossible de ne pas se souvenir qu'à une époque, Agnew était considéré comme l'un des hommes les moins aptes à exercer la fonction présidentielle durant la campagne de 1968, et que les médias qualifiaient le député Landgrebe de « député le plus idiot » pendant le Watergate. Ces deux hommes sont parvenus, malgré l'opposition des médias et des libéraux, à remodeler l'Amérique au cours des années qui ont suivi la chute du président Nixon ; seul l'avenir dira si ce sera pour le meilleur ou pour le pire."
 Lucey88.0.d:0 "Un thème récurrent de l'administration Anderson-Lucey était la nécessité d'établir un consensus économique entre les différents secteurs de l'économie américaine. Dans le cadre de cette idéologie économique, le président Patrick Lucey a annoncé aujourd'hui la création du Conseil de sécurité économique. Ce conseil réunira d'éminents économistes, des représentants syndicaux et des chefs d'entreprise afin de coordonner les politiques économiques potentielles du pays en recherchant un consensus entre ces trois groupes souvent opposés. Le président a précisé lors de la conférence de presse que, même si le conseil n'aura pas le pouvoir de dicter la politique économique, la Maison Blanche entend s'appuyer sur ses membres pour orienter ses politiques économiques et lors des négociations budgétaires avec le Congrès dans les années à venir. Les partisans du président affirment que cette mesure contribuera à réduire les conflits au sein de l'économie et à favoriser la croissance. Les progressistes, critiques du président, dénoncent cette proposition comme une capitulation face aux grandes entreprises et une nouvelle perversion des valeurs fondamentales du Parti démocrate, tandis que les conservateurs condamnent le conseil comme un instrument du capitalisme de connivence."
 Lucey88.1.d:0 "Avec le recul, lors des primaires démocrates de 1980, le résultat était assurément inattendu. Patrick Lucey, ancien gouverneur du Wisconsin, ambassadeur au Mexique et vice-président de la campagne de Kennedy en 1980, apporta son soutien à la campagne d'Anderson et devint son colistier. Dans son discours d'acceptation, Lucey condamna le président Carter, affirmant que ce n'était pas lui qui avait abandonné le Parti démocrate, mais le président Carter. Au départ, dans son propre État du Wisconsin, beaucoup le considéraient comme une étoile déchue du parti. Pourtant, grâce aux victoires des campagnes d'Anderson en 1980 et 1984, puis à la sienne en 1988, Lucey parvint à redonner au Parti démocrate son rôle de bastion du libéralisme social et économique. Quoi qu'il en soit, ce que beaucoup imaginaient être une décennie de réaction conservatrice aux années 1960 et 1970 s'est finalement transformé en une ère de renouveau du libéralisme aux États-Unis."
 Gore88.1.d:0 "Après des années d'incertitude économique et de politique financière bancale sous l'administration républicaine, Al Gore, ancien sénateur du Tennessee, a remporté l'élection présidentielle de 1988. En tant que président, il s'est attaché à rehausser le niveau de l'éducation, à revitaliser les zones rurales, à défendre les normes environnementales et à préserver les programmes sociaux, notamment la sécurité sociale. Tout aussi important, son administration a investi massivement dans l'informatique et les réseaux, contribuant ainsi à l'essor d'Internet et offrant aux États-Unis une longueur d'avance cruciale en matière de développement technologique. Jusqu'à présent, son premier mandat s'est déroulé dans l'ensemble sans controverse, ses détracteurs lui reprochant principalement l'expansion de la bureaucratie fédérale liée à sa politique environnementale. Cependant, alors qu'il brigue un second mandat, des problèmes persistent, notamment concernant l'Accord de libre-échange nord-américain (ALENA) qui menace de diviser le Parti démocrate."
 Haig88.1.d:0 "L'accession à la présidence d'Alexander Haig, ancien chef de cabinet de la Maison-Blanche et commandant suprême des forces alliées en Europe de l'OTAN, a marqué un tournant décisif pour la politique étrangère et militaire américaine. Sous sa présidence, le déclin militaire américain a pris fin après la guerre du Vietnam. Depuis son investiture, le président Haig s'est efforcé de renforcer l'enseignement militaire dans les écoles, d'accroître considérablement le financement du complexe militaro-industriel et de consolider les pouvoirs des services de sécurité. Cette politique offensive a favorisé les puissances alliées soutenues par les États-Unis dans divers conflits à travers le monde. Face à la fragilité actuelle du bloc soviétique, les années à venir pourraient voir l'émergence des États-Unis comme unique superpuissance mondiale, instaurant ainsi un « Nouvel Ordre Mondial » sous l'égide d'Alexander Haig."
 Hart88.0.d:0 "L'accession de Gary Hart à la présidence a marqué un tournant pour le Parti démocrate, symbolisant un renouvellement générationnel à sa tête. Les « Démocrates Atari », parmi lesquels figuraient le président Hart, le sénateur Al Gore (D-TN) et le sénateur Tim Wirth (D-CO), se sont imposés comme les nouveaux leaders du parti, privilégiant les solutions technologiques et de marché aux problèmes socio-économiques, plutôt que les mesures contraignantes de l'État et l'intervention directe sur le marché. Cette orientation vers un libéralisme accru du marché, conjuguée à la conclusion d'accords commerciaux internationaux, a certes porté ses fruits en termes de succès électoral pour l'administration Hart, mais a également engendré des divisions au sein du Parti démocrate. Les groupes de soutien traditionnels du Parti démocrate, tels que les syndicats, ont régulièrement critiqué la gestion du commerce international par le président, tandis que les sénateurs les plus progressistes lui ont reproché de ne pas avoir œuvré à un renforcement significatif de la protection sociale."
 Jackson84.1.d:0 "Lors d'une conférence de presse tenue plus tôt dans la journée, le président Jesse Jackson a proposé de réduire drastiquement le budget du département de la Défense. Il a fait valoir que le niveau actuel des dépenses militaires nuit à l'économie et que ces fonds pourraient être plus judicieusement alloués aux programmes de protection sociale. Le président Jackson a largement axé sa campagne sur l'idée de réorienter les dépenses militaires vers les dépenses sociales, notamment en ce qui concerne la révision de certains programmes militaires, en particulier l'Initiative de défense stratégique. Les pacifistes et les progressistes ont salué cette annonce comme une mesure nécessaire pour la paix mondiale et la réduction du déficit budgétaire, tandis que les bellicistes et les conservateurs ont critiqué la proposition du président Jackson, la jugeant irréaliste et préjudiciable à la sécurité nationale américaine."
 Jackson84.2.d:0 "Lors d'un meeting électoral enflammé à Harlem, à New York, plus tôt dans la journée, le président Jackson a annoncé qu'il mettrait fin à la guerre contre la drogue et qu'il lancerait une nouvelle guerre contre les banquiers. Selon lui, la guerre contre la drogue a non seulement été un échec retentissant, mais constitue en réalité une nouvelle attaque contre les Afro-Américains et les autres minorités, tandis que Wall Street continue de s'enrichir sur le dos des travailleurs américains et d'exploiter les agriculteurs américains en pleine crise agricole. Le président Jackson a également indiqué qu'il donnerait instruction au fisc américain (IRS) et au FBI d'intensifier les contrôles et les enquêtes sur les principales institutions bancaires. La réaction des conservateurs à ce discours a été tout simplement furieuse, certains commentateurs conservateurs dénonçant le président Jackson comme un marxiste."
 Jackson88.0.d:0 "La présidence de Jesse Jackson a sans doute été l'une des plus transformatrices non seulement de l'histoire américaine moderne, mais aussi de l'histoire mondiale de l'après-guerre. Sur le plan intérieur, le président Jackson s'est efforcé d'améliorer le quotidien des Américains en défendant des réformes économiques progressistes, en mettant fin à la désastreuse guerre contre la drogue et en luttant contre la corruption de Wall Street. Plus particulièrement en matière de politique étrangère, l'administration Jackson a cherché à conclure un traité de paix global avec l'Union soviétique. Malgré la persistance de problèmes, la fin de la guerre froide se profile à l'horizon, de même que la possibilité d'accords de contrôle des armements nucléaires à plus long terme. Les opposants au président continuent de l'accuser d'être communiste et de détruire activement l'Amérique de l'intérieur, compte tenu des coupes drastiques qu'il a opérées dans les budgets militaire, de la politique étrangère et de l'économie."
 Jackson88.1.d:0 "La dernière décennie a été tumultueuse pour la communauté LGBTQ+, marquée par l'apparition de l'épidémie de sida et la recrudescence des attaques des conservateurs avec l'essor du mouvement de la Majorité morale au début des années 1990. Dans ce contexte, la victoire de Jesse Jackson, pasteur afro-américain progressiste, non seulement à la primaire démocrate, mais aussi à l'élection présidentielle, a constitué un véritable bouleversement politique. Lors d'une conférence de presse tenue plus tôt dans la journée, le président Jackson a signé un décret autorisant les personnes ouvertement homosexuelles à s'enrôler et à servir dans les différentes branches des forces armées. Les organisations de défense des droits des personnes LGBTQ+ et les défenseurs des libertés civiles ont salué ce décret. De l'autre côté de l'échiquier politique, les responsables évangéliques et les élus républicains conservateurs ont largement condamné cette décision, la qualifiant de trahison des valeurs conservatrices fondamentales et d'atteinte supplémentaire à la moralité en Amérique."
 Jackson88.3.d:0 "Dans une interview télévisée accordée à l'émission « 60 Minutes », le président Jesse Jackson a annoncé son changement de position sur l'avortement. Il a déclaré qu'il ne chercherait plus à restreindre l'accès à l'avortement ni à abroger l'arrêt Roe v. Wade. Après avoir discuté avec divers militants, il a indiqué qu'il ne pouvait, en toute conscience, tenter de remettre en cause le droit à l'avortement. Tout en conservant des réserves morales sur cette question, le président a affirmé qu'il ne devrait pas appartenir à l'État de s'immiscer dans la vie médicale de ses citoyens. Les réactions à ce discours ont été mitigées : les progressistes ont salué ce changement de position, tandis que les organisations et les défenseurs du droit à la vie ont dénoncé une trahison de leur cause."
 Muskie80.1.d:0 "À l'approche de la Convention nationale démocrate de 1980, il était tout à fait compréhensible de penser que les chances de victoire des démocrates à l'automne étaient minces. Une primaire âprement disputée opposait le président au sénateur Edward Kennedy, et face à la montée en puissance des conservateurs, l'avenir des progressistes au sein du Parti démocrate semblait sombre. La convention étant paralysée, le sénateur Muskie s'imposa comme le candidat de consensus. Tirant parti du conservatisme radical de son adversaire, Muskie remporta l'élection de 1980. Fort du succès de la reprise économique, le président Muskie obtint une réélection convaincante en 1984 et mit en œuvre diverses politiques progressistes visant à réduire les inégalités de revenus croissantes aux États-Unis."
 Muskie80.2.d:0 "Suite au rejet du libéralisme en 1968, de nombreux analystes politiques ont salué l'élection comme la fin de la coalition du New Deal. Pourtant, l'élection d'Edmund Muskie huit ans plus tard a prouvé que cette prédiction était prématurée. Si la crise de la fin des années 1970 a failli entraîner la défaite du président en 1980, la reprise économique du début des années 1980 a permis aux démocrates de remporter des succès importants et à Muskie de mettre en œuvre diverses mesures progressistes durant son second mandat, axées sur l'éducation et l'environnement. Bien que les opposants à l'administration critiquent l'expansion de la bureaucratie fédérale, notamment de l'Agence de protection de l'environnement (EPA), la cote de popularité du président demeure relativement élevée et il restera sans aucun doute comme l'un des plus grands défenseurs de l'environnement de son époque."
 Rumfeld84.1.d:0 "Lors d'une récente intervention devant le Congrès, le président Donald Rumsfeld a annoncé son intention de dénoncer tous les accords de contrôle des armements auxquels les États-Unis sont actuellement parties. Il a fait valoir que les accords signés par les administrations précédentes étaient excessivement restrictifs, tant en matière de programme nucléaire que d'armements conventionnels, et qu'ils nuisaient à la sécurité nationale américaine tout en limitant les armes pouvant être fournies à des alliés américains à l'étranger. La réaction internationale à cette annonce a été quasi unanimement négative, avec des condamnations de l'Union soviétique, du Royaume-Uni, de la France, de la Chine et de l'Assemblée générale des Nations Unies. Aux États-Unis, les partisans du président ont salué cette décision comme le signe d'un leadership audacieux et décisif, indispensable au pays. En dehors de son cercle d'électeurs, l'annonce a suscité une vive indignation, jugée immorale, contraire à l'éthique et préjudiciable aux relations extérieures américaines."
 Rumfeld88.1.d:0 "Dans une interview accordée à un média conservateur ce week-end, le président Rumsfeld a exposé sa doctrine de politique étrangère pour sa nouvelle administration. Il a d'emblée indiqué que le Département d'État abandonnerait les tentatives de détente et d'endiguement pour se concentrer sur la lutte contre le communisme sur différents fronts, signalant ainsi un soutien renouvelé, tant discret qu'ouvertement, à diverses causes anticommunistes à travers le monde. Le président a notamment souligné la nécessité d'investir davantage dans les mouvements armés africains opposés aux régimes communistes, en particulier l'Union nationale pour l'indépendance totale (UNITA) de Jonas Savimbi en Angola, actuellement en proie à une guerre civile contre le gouvernement communiste soutenu par Cuba. Ses opposants ont condamné cette politique du bord du gouffre et son intention de violer plusieurs lois interdisant le soutien à certaines insurrections étrangères."
 Rumfeld88.6.d:0 "Des rapports récents émanant de personnalités du principal mouvement anti-apartheid américain, notamment le Free South Africa Movement (FSAM) et l'American Committee on Africa (ACOA), font état de graves problèmes internes et de troubles de cohésion. Certains membres et responsables de ces organisations ont constaté un renforcement de la présence policière aux abords des réunions du FSAM et de l'ACOA, en particulier celles des membres influents ; par ailleurs, des agents d'entretien ont remarqué de légers dégâts sur les châssis de fenêtres, les systèmes informatiques et les téléphones des bureaux nationaux. Les causes de ces divisions et de ces problèmes restent floues, mais il se passe quelque chose de très suspect au sein du mouvement anti-apartheid."
 Rumfeld88.7.d:0 "Aujourd'hui, une fuite soudaine, orchestrée par un membre du personnel du ministère de la Justice et transmise au procureur général, a révélé une campagne d'espionnage menée par le gouvernement américain contre des organisations anti-apartheid. Approuvée par le président Rumsfeld et pilotée par le FBI et le ministère de la Justice, une note confidentielle divulguée évoquait « la menace que représentent les forces féministes, libérales, communistes, socialistes et anarchistes dans notre pays » et précisait la surveillance d'organisations telles que l'American Committee on Africa (ACOA) et le Free South Africa Movement (FSAM). Publiée initialement dans le New York Times, l'information a été relayée par d'autres grands journaux nationaux et internationaux, face au silence assourdissant de la Maison Blanche et du ministère de la Justice."
 Shriver80.1.d:0 "Alors que le premier mandat de l'administration Shriver touche à sa fin et que la campagne électorale s'intensifie, l'héritage du « mcgovernisme » demeure un sujet majeur au sein de l'électorat. Si le président Shriver a largement conservé la plupart des aspects de la politique étrangère de McGovern, il a fait des concessions manifestes à d'autres ailes du Parti démocrate afin de tenter d'apaiser les divisions engendrées par son prédécesseur. Bien qu'aucune des grandes privatisations entreprises par McGovern n'ait été annulée, Shriver s'est efforcé d'élargir l'accès aux soins de santé, d'accroître le financement de l'éducation et de mener une administration plus protectionniste. Cela étant dit, l'essence du « mcgovernisme » reste intacte au sein du parti et, si Shriver est réélu, il est possible que cette idéologie devienne définitivement le cœur du parti."
 Shriver84.1.d:0 "Durant la présidence de Shriver, l'administration s'est efforcée de rétablir les relations au sein du Parti démocrate sans pour autant transgresser les principes fondamentaux du macro-gouvernement. Compte tenu des primaires houleuses de 1980 et des divisions persistantes qui ont suivi, la nécessité de trouver un équilibre entre le libéralisme économique traditionnel et le macro-gouvernement est devenue d'autant plus cruciale. Cela étant dit, le président Shriver est largement parvenu à cet objectif grâce à divers compromis et concessions faites aux autres factions démocrates sur le plan de la politique intérieure. Du côté de l'opposition, les républicains ont majoritairement condamné l'administration, la jugeant isolationniste et l'accusant de compromettre activement la sécurité américaine en poursuivant les politiques militaires et étrangères de McGovern. Cela étant dit, après seize ans, le macro-gouvernement s'impose clairement comme la nouvelle idéologie dominante au sein du Parti démocrate pour les années à venir."
 Stevenson84.1.d:0 "L'élection de George Wallace en 1976 a clairement marqué un tournant au sein du parti, qui s'est tourné vers les électeurs évangéliques, notamment grâce au lobbying du président Wallace auprès d'organisations comme la Majorité morale. Cela étant dit, la victoire du vice-président Stevenson, libéral social convaincu, aux élections de 1984 risque d'exacerber les tensions entre la base démocrate traditionnelle et les partisans évangéliques de Wallace. Ces tensions risquent de devenir un enjeu majeur pour le Parti démocrate dans les années à venir, d'autant plus que l'ancien président poursuit activement son combat pour un amendement constitutionnel garantissant le droit à la vie. Toute mesure radicale prise sur les questions de société, de part et d'autre, risque de diviser profondément le Parti démocrate pour un avenir prévisible."
 Stevenson84.3.d:0 "Dans un discours important prononcé plus tôt dans la journée à Detroit, dans le Michigan, le président Stevenson a désavoué le soutien continu de son prédécesseur, George Wallace, à un amendement constitutionnel sur le droit à la vie annulant l'arrêt Roe v. Wade. Cette prise de position, bien que prévisible compte tenu des convictions pro-choix connues de Stevenson avant son accession à la vice-présidence de Wallace, marque néanmoins un net retour au libéralisme social au sein du Parti démocrate après la présidence de George Wallace. Les partisans de Wallace au sein du parti ont condamné cette décision, arguant que Stevenson trahit l'héritage du président Wallace et les électeurs qui l'ont porté au pouvoir. Les organisations féministes ont salué cette initiative et ont exprimé l'espoir que le président Stevenson relancerait le combat pour l'amendement sur l'égalité des droits."
 Stevenson84.4.d:0 "Rompant une nouvelle fois avec la position de l'ancien président Wallace, le président Stevenson a appelé le Congrès à relancer l'amendement sur l'égalité des droits (ERA). Bien que l'autorisation de l'ERA ait expiré sous l'administration Wallace, Stevenson demande aux tribunaux de se prononcer sur la légalité de la période d'autorisation et, si les tribunaux ne s'y opposent pas, de relancer le processus de ratification. Les conservateurs sociaux, notamment les partisans de Wallace, ont condamné cette initiative, la qualifiant de nouvelle trahison envers l'ancien président. Les féministes, les militants des droits civiques et d'autres activistes progressistes ont salué cette mesure comme une nécessité pour protéger les minorités. Quoi qu'il en soit, le débat autour de l'ERA se poursuivra pendant des années."
 Stevenson84.5.d:0 "Lors d'une conférence de presse aujourd'hui, le président Stevenson a annoncé la levée de la politique de son prédécesseur, le président Wallace, interdisant les importations de voitures étrangères. Il a justifié cette décision en affirmant que cette politique pénalisait les consommateurs américains en augmentant le prix des véhicules et en nuisant aux relations commerciales des États-Unis. L'annonce a été globalement bien accueillie par les consommateurs. Cependant, les constructeurs automobiles américains et le syndicat United Auto Workers (UAW) ont condamné cette mesure. De nombreux partisans de l'ancien président Wallace ont également dénoncé cette décision, estimant que le président Stevenson trahissait l'héritage de son prédécesseur. Cette réaction illustre une fois de plus les divisions croissantes au sein du Parti démocrate entre les factions libérale et modérée, majoritairement favorables au président Stevenson, et la faction conservatrice, composée de partisans de l'ancien président Wallace, qui se sent de plus en plus marginalisée."
 Stevenson88.0.d:0 "Durant la campagne présidentielle de 1984, le vice-président Stevenson avait plaidé en faveur de la création d'un Conseil de sécurité économique. Ce conseil réunirait des économistes de renom, des représentants syndicaux et des chefs d'entreprise afin de coordonner les politiques économiques potentielles du pays en recherchant un consensus entre ces trois groupes souvent opposés. Aujourd'hui, lors d'un meeting électoral à Chicago, dans l'Illinois, le président Stevenson a officiellement annoncé la création de ce conseil. Bien que ce dernier n'ait pas le pouvoir de dicter la politique économique, le président a déclaré qu'il comptait s'appuyer sur ces instances pour orienter sa politique économique et lors des négociations budgétaires avec le Congrès dans les années à venir. Les partisans du président affirment que cette mesure contribuera à réduire les conflits économiques et à stimuler la croissance. Les progressistes, critiques du président, dénoncent cette proposition comme une capitulation face aux grandes entreprises, tandis que les conservateurs condamnent le conseil comme un instrument du capitalisme de connivence."
 Stevenson88.1.d:0 "Lors d'une conférence de presse tenue plus tôt dans la journée, le président Stevenson a annoncé son projet d'établir un accord de libre-échange transpacifique. Cet accord commercial inclurait plusieurs alliés des États-Unis, tels que le Japon, les Philippines, la République de Corée, l'Australie et la Nouvelle-Zélande. Les économistes et les partisans du libre-échange ont salué le projet du président, le considérant comme une mesure nécessaire pour dynamiser le commerce américain et stimuler la croissance économique. L'approche du président Stevenson en matière de libre-échange a suscité une vive controverse, compte tenu de son rôle de vice-président de Wallace, qui a dirigé l'administration la plus protectionniste de l'histoire récente. Par ailleurs, plusieurs syndicats, notamment l'United Auto Workers (UAW), ont fermement condamné le projet d'accord commercial."
 Stevenson88.24.d:0 "Lors d'une cérémonie dans la Salle Est de la Maison-Blanche, le président Stevenson a promulgué l'Accord de libre-échange transpacifique (ALÉPT), entouré de plusieurs anciens présidents et de membres du Congrès qui le soutenaient. Les partisans du libre-échange et de nombreux économistes ont salué cette initiative, compte tenu des incertitudes qui planaient sur la manière dont le président Stevenson mènerait les négociations, étant donné son passé au sein de l'administration Wallace, réputée pour son protectionnisme. De l'autre côté de l'hémicycle, les dirigeants syndicaux ont vivement critiqué le président Stevenson, qualifiant cette décision de trahison envers ses électeurs. Par ailleurs, le milliardaire et philanthrope Ross Perot, connu pour ses prises de position tranchées, a condamné l'accord, le considérant comme une atteinte à la souveraineté américaine, et, selon certaines rumeurs, aurait déjà commencé à préparer sa candidature à la présidence en 1992."
 Cuba80s_Ref.0.d:0 "CRISE DES RÉFUGIÉS CUBAINS : PERSPECTIVES ET RECOMMANDATIONS\nBureau Cuba, Bureau des affaires de l’hémisphère occidental\nSECRET/NOFORN\n\nLa détérioration économique continue à Cuba a suscité des inquiétudes quant à l’arrivée de nouvelles vagues de réfugiés cubains tentant d’entrer dans le pays. L’exode de Mariel rappelle les risques inhérents à chaque option, notamment compte tenu des réactions politiques suscitées par les événements précédents. D’un point de vue macroéconomique, l’exode cubain est positif car il démontre la supériorité du monde libre sur les régimes communistes et nuit davantage à la réputation du régime cubain. Cela dit, il convient également de prendre en compte les préoccupations politiques internes. La décision précédente d’accueillir des réfugiés cubains a été largement impopulaire auprès du public américain et a entraîné une réaction hostile non seulement contre les réfugiés cubains, mais aussi contre l’usage de la langue espagnole, allant jusqu’à provoquer des émeutes dans les quartiers afro-américains de Miami en raison d’un traitement de faveur perçu. Un autre élément à prendre en compte est que si nous accordons davantage de statut de réfugié aux Cubains, le Caucus des membres noirs du Congrès demandera probablement à l'administration d'étendre ces mêmes protections aux migrants haïtiens, sous peine d'être accusée de discrimination raciale. Bien que ces concessions puissent apaiser les Afro-Américains, elles provoqueraient certainement une réaction encore plus vive de la part du grand public, notamment dans le Sud.\n\nEn définitive, la question est de savoir si nous devons privilégier la lutte internationale contre le communisme ou les enjeux politiques intérieurs, et quelle voie suivre."
 Cuba80s_Ref.1.d:0 "Après la décision de refuser l'admission de nouveaux réfugiés cubains, le chef de cabinet [GetCurrentCoS] a plaidé pour que l'annonce soit faite un vendredi soir afin de minimiser sa couverture médiatique. Bien que cette politique bénéficie globalement d'une approbation majoritaire des électeurs, certains blocs électoraux influents et des groupes de défense des droits humains s'y opposent fermement, invoquant des considérations de politique étrangère et d'humanitarisme. L'administration a également été critiquée par le Caucus des membres noirs du Congrès pour son refus d'accueillir des réfugiés haïtiens et pour son inaction face à la crise croissante en Haïti. Concernant les réactions internationales, le gouvernement cubain n'a fait aucune déclaration officielle, mais les pays alignés sur l'Union soviétique ont fustigé cette annonce, y voyant une preuve de l'hypocrisie et du racisme des États-Unis. Par ailleurs, des organisations anticommunistes telles que la Heritage Foundation ont critiqué l'administration pour avoir privilégié les intérêts nationaux au détriment de la politique étrangère."
 Cuba80s_Ref.2.d:0 "Dans un communiqué de presse publié vendredi soir, le Département d'État a confirmé qu'il refuserait le statut de réfugié aux nouveaux arrivants cubains. Cette décision fait suite à une nouvelle vague d'immigration cubaine aux États-Unis ces dernières années, notamment l'exode de Mariel en 1980. Compte tenu de la controverse, de la réaction négative du public et des émeutes qui ont suivi l'admission des réfugiés cubains, cette annonce n'a pas surpris l'opinion publique américaine. Cela dit, l'opposition à cette annonce a créé des alliances paradoxales entre des organisations libérales pro-immigration et des groupes anticommunistes de droite, notamment la Heritage Foundation. Les sondages d'opinion réalisés après cette décision montrent une nette hausse du soutien à l'administration actuelle, à l'exception de New York et de la Floride."
 Cuba80s_Ref.3.d:0 "Après la décision d'accueillir davantage de réfugiés cubains, le chef de cabinet [GetCurrentCoS] a plaidé pour que l'annonce soit faite un vendredi soir afin de minimiser sa couverture médiatique. Malheureusement, cette tentative a largement échoué. L'opinion publique a fortement désapprouvé cette annonce, compte tenu des problèmes rencontrés lors des précédentes vagues d'accueil de réfugiés cubains. Comme si cela ne suffisait pas, des émeutes ont de nouveau éclaté dans les quartiers afro-américains de Miami, suite à des accusations de traitement préférentiel des Cubains par rapport aux Afro-Américains et aux réfugiés haïtiens. Cela étant dit, les organisations de défense des droits des Cubains, le Caucus hispanique du Congrès et des groupes anticommunistes tels que la Heritage Foundation ont salué cette mesure, la qualifiant d'impératif humanitaire et de moyen de démontrer les échecs du marxisme-léninisme.\n\nLe gouvernement cubain n'a publié aucune déclaration officielle concernant cette annonce, pas plus qu'aucun autre État aligné sur Moscou. Cela dit, les rumeurs abondent selon lesquelles le gouvernement cubain tenterait une fois de plus de s'assurer que les criminels et les homosexuels constituent une part importante des réfugiés, aux côtés des dissidents politiques."
 Cuba80s_Ref.4.d:0 "Une fois de plus, Washington a annoncé qu'il accepterait les réfugiés cubains que nous autorisons à quitter le pays. Bien que cela puisse être politiquement embarrassant, cette décision offre une occasion en or, notamment compte tenu des difficultés économiques et agricoles actuelles, de gérer divers groupes indésirables au sein du pays. Idéalement, nous devrions chercher à libérer les criminels violents, les dissidents politiques et les homosexuels, qui constitueraient les principaux groupes à quitter le pays pour les États-Unis. S'il est regrettable d'en arriver là, en exportant simplement nos groupes problématiques, nous pouvons contribuer à stabiliser la situation économique et politique du pays, mais aussi potentiellement déstabiliser les États-Unis et nous fournir de nouveaux sujets de critique à l'égard de l'Amérique à l'avenir. Les signes de tensions raciales qui se manifestent déjà suite à l'acceptation de ces « réfugiés » sont peut-être le signe que cette stratégie pourrait s'avérer bénéfique à long terme…"
 USAOpera.1.d:0 "OPÉRATION OPERA : PERSPECTIVES ET RECOMMANDATIONS\nBureau Israël, Bureau des affaires sud-asiatiques\nSECRET/NOFORN\n\nLe 7 juin, l'armée de l'air israélienne a mené avec succès une frappe contre le centre de recherche nucléaire de Tuwaitha, en Irak. Les services de renseignement avaient préalablement confirmé la présence d'un réacteur nucléaire sur le site, susceptible d'être utilisé par le programme nucléaire irakien. Pour compliquer la situation, Israël a non seulement revendiqué ces frappes, mais a également déclaré qu'il ne s'agissait pas d'une anomalie, mais d'un précédent pour de futures actions, établissant ainsi ce que l'on appelle désormais la doctrine Begin. Cette déclaration a suscité une vague de critiques internationales à l'encontre du gouvernement israélien, car, compte tenu du caractère public des frappes, l'administration ne peut se permettre d'ignorer l'opération. D'un côté, les États-Unis pourraient soutenir ces frappes, renforçant ainsi leurs liens avec Israël. Une telle initiative serait certainement soutenue par la communauté juive américaine et pourrait s'avérer utile sur le plan électoral, mais elle placerait les États-Unis en net décalage avec le reste de la communauté internationale, y compris la majorité de leurs alliés. Nous pourrions aussi condamner l'opération, qui constitue une violation flagrante de la souveraineté internationale, et une telle décision pourrait s'avérer bénéfique pour notre politique étrangère dans son ensemble. Cependant, elle ne manquerait pas de détériorer nos relations avec Israël et d'aliéner l'électorat et les groupes d'intérêt juifs aux États-Unis.\n\nL'administration est confrontée à un choix difficile, contrainte de naviguer en eaux troubles entre le respect des normes internationales et le soutien à un allié crucial dans la région. Quel choix devons-nous faire ?"
 USAOpera.2.d:0 "Lors d'une rencontre avec l'ambassadeur américain après la conclusion de l'opération Opera, nous avons appris que le gouvernement américain n'avait d'autre choix que de condamner notre opération, pourtant couronnée de succès. Bien que regrettable, nos renseignements indiquent que cela n'affectera probablement pas sérieusement nos relations à long terme avec Washington et que le coût est justifié par la nécessité d'empêcher l'Irak de se doter de l'arme nucléaire, tout en établissant un précédent pour les opérations futures. Cela dit, il serait peut-être préférable soit de diversifier nos sources d'approvisionnement, soit d'ajuster notre politique étrangère afin de mieux répondre aux intérêts américains si nous souhaitons continuer à bénéficier de l'aide américaine. Nous pourrions également chercher à renforcer le sentiment pro-israélien aux États-Unis, en nous appuyant sur l'importante diaspora juive installée sur le territoire américain, principalement dans des États clés pour les élections de 1984. Quel choix faire ?"
 USAOpera.4.d:0 "Malheureusement, l'ambassadeur américain nous a informés, lors d'une réunion plus tôt dans la journée, que les États-Unis suspendaient temporairement leurs livraisons d'armes en raison de l'opération Opéra et des déclarations du gouvernement suite aux frappes. L'ambassadeur nous a assuré qu'il s'agissait d'une mesure temporaire visant à apaiser l'opinion publique et la communauté internationale, et que les livraisons reprendraient prochainement. Ces événements laissent à penser que les États-Unis ne sont peut-être pas le partenaire le plus fiable si nous souhaitons poursuivre nos opérations dans les pays arabes. Face à l'aggravation du conflit au Liban, nous devrons peut-être nous interroger sur la pertinence de maintenir nos opérations au risque de nous aliéner notre principal allié international."
 USAOpera.11.d:0 "Dans une déclaration publiée plus tôt dans la journée par le Département d'État américain, le gouvernement américain a confirmé son soutien à notre opération contre le programme nucléaire irakien, la considérant comme une mesure nécessaire pour garantir la non-prolifération des armes nucléaires. Bien que la majorité de la communauté internationale ait condamné ces frappes, le soutien américain à l'opération devrait permettre de bloquer toute tentative de sanctions à notre encontre aux Nations Unies. Ce soutien étant acquis, d'autres opérations devraient être envisagées afin d'affaiblir la capacité des États arabes à développer des programmes nucléaires. De plus, cela pourrait préfigurer un futur soutien matériel américain au conflit en cours au Liban."
 USAOpera.12.d:0 "L'ambassadeur américain a informé aujourd'hui le gouvernement que les États-Unis allaient immédiatement augmenter leurs livraisons d'armes compte tenu de l'opération Opera et du conflit au Liban. Étant donné que plusieurs nations ont suspendu leurs ventes d'armes aux États-Unis suite à nos récentes opérations, c'est une excellente nouvelle pour la sécurité nationale et cela témoigne également d'un soutien politique futur à notre cause. La médiatisation croissante des conflits israélo-palestinien et libanais devrait empêcher les Nations Unies de nous imposer des sanctions. Cela dit, la réaction a été globalement positive, mais elle a révélé un nombre croissant d'opposants à Israël au sein de l'opinion publique américaine, notamment parmi l'aile gauche du Parti démocrate. Il pourrait donc être nécessaire de suivre de plus près l'évolution de la situation politique aux États-Unis afin de garantir notre sécurité nationale. En définitive, bien que cette nouvelle soit excellente et nous aide certainement dans notre lutte contre les États arabes, nous devons veiller à ne pas devenir dépendants des États-Unis face aux possibles bouleversements politiques aux États-Unis."
 USAOpera.3.d:0 "Dans un discours prononcé aujourd'hui aux Nations Unies, l'ambassadeur américain a condamné les frappes israéliennes contre les installations nucléaires irakiennes. Il a affirmé que, si Israël a le droit de se défendre compte tenu de l'histoire et du contexte géopolitique, cette action constituait un abus flagrant de souveraineté et de droit international. Cette déclaration a surpris nombre d'observateurs, étant donné le soutien apporté par les États-Unis à Israël au cours de la dernière décennie, mais elle s'inscrit globalement dans le sentiment international actuel. Face à la vive réaction internationale suscitée par l'opération israélienne, plusieurs pays ont appelé à des sanctions contre Israël. Bien que les États-Unis aient condamné les frappes, la plupart des experts et analystes estiment qu'ils ne soutiendront pas ces sanctions."
 USAOpera.10.d:0 "Lors d'une conférence de presse tenue plus tôt dans la journée, le président américain [USA.GetLeader] a annoncé le soutien de la Maison Blanche aux frappes israéliennes contre le programme nucléaire irakien. Le président a affirmé qu'Israël avait agi en état de légitime défense, indiquant que le programme nucléaire irakien constituait une menace pour Israël. Aux États-Unis, cette annonce a été accueillie avec une approbation mitigée par l'opinion publique et saluée par les groupes de défense des droits israéliens. Cela étant dit, cette annonce oppose les États-Unis à la majorité de la communauté internationale, qui a condamné l'opération comme une violation flagrante du droit international, tandis que les États-Unis renforcent encore leurs liens avec Israël. Dans ce contexte, toute tentative de sanctionner Israël aux Nations Unies est vouée à se heurter au veto de Washington."
 ETH.USA80.1.d:0 "LA FAMINE ÉTHIOPIENNE : PERSPECTIVES ET RECOMMANDATIONS\nBureau Éthiopie, Bureau des Affaires Africaines\nSECRET/NOFORN\n\nLes années qui ont suivi la fin de la Seconde Guerre mondiale et la libération de l'Éthiopie ont été particulièrement difficiles pour le pays. Après des années de sécheresse dans les années 1950 et 1960, des troubles politiques ont éclaté, aboutissant au renversement de la monarchie par des forces marxistes-léninistes au sein de l'armée et plongeant l'Éthiopie dans une guerre civile à plusieurs camps. En raison d'une combinaison de facteurs (climat, politiques gouvernementales et guerre civile), l'Éthiopie est aujourd'hui en proie à une famine encore plus grave. Hormis l'inaction face à cette famine et à la crise humanitaire qui sévit, nos options sont plutôt limitées. Étant donné que le principal opposant au Conseil d'administration militaire provisoire (CAMP), également connu sous le nom de Derg, est le Front de libération du peuple du Tigré, une autre organisation communiste, toute aide apportée risque fort de finir entre les mains de l'une ou l'autre de ces factions. Compte tenu de cela, nos options sont soit de nous coordonner avec d'autres nations et organisations humanitaires qui fournissent déjà de l'aide au pays et d'accepter le risque d'interception par les différentes factions en conflit, soit de créer un groupe de travail inter-agences sur la famine afin d'examiner plus en détail quelle serait la meilleure ligne de conduite face à la crise actuelle."
 ETH.USA80.2.d:0 "La famine qui sévit actuellement en Éthiopie, conséquence de la guerre civile brutale qui y fait rage, offre une opportunité d'influer sur les affaires du pays. Afin de déterminer les populations à aider et la meilleure stratégie à adopter, nous avons créé le Groupe de travail inter-agences sur la famine en Afrique. Ce comité est composé de représentants de l'Agence américaine pour le développement international (USAID), du Département de la Défense, de la CIA et du Département de l'Agriculture, et est dirigé par le général à la retraite Julius Bectin.\n\nBien que nous assurions publiquement que la politique n'a aucune incidence sur l'acheminement de l'aide alimentaire aux populations touchées, cette situation représente une occasion privilégiée d'influencer les principales factions éthiopiennes et de les orienter vers une position plus occidentale. Si cette approche s'avère inefficace ou indésirable, le Groupe de travail devra s'efforcer de trouver des personnalités anticommunistes influentes à soutenir et à renforcer afin de créer une nouvelle faction armée au sein du pays. L'objectif serait d'établir une faction pro-occidentale significative et ainsi promouvoir les intérêts américains dans la Corne de l'Afrique. En définitive, la famine en Éthiopie est une tragédie qui exige une réponse morale, mais elle offre également au gouvernement une occasion unique de défendre nos intérêts dans la région."
 ETH.USA80.3.d:0 "Alors que la guerre civile fait toujours rage et que la famine continue de ravager notre pays, diverses organisations humanitaires et nations occidentales ont déployé des efforts de secours. Cependant, étant donné que la famine sévit principalement dans les zones contrôlées par les rebelles, la situation est délicate. Accepter cette aide et permettre sa distribution libre dans les zones les plus touchées profiterait directement au Front de libération du peuple du Tigré (FLPT) et compromettrait nos efforts pour contenir ses forces et limiter ses ressources dans les régions ravagées par la famine au Tigré et au Wollo. À l'inverse, refuser cette aide fragiliserait davantage notre position internationale. Face à cette situation, trois options s'offrent à nous : autoriser les travailleurs humanitaires à pénétrer dans les zones contrôlées par les rebelles pour distribuer l'aide et soulager la famine, en établissant des points de contrôle et des procédures permettant d'intercepter l'aide étrangère avant qu'elle n'atteigne les territoires du FLPT ; ou bien refuser l'aide et solliciter un soutien accru de Cuba et de l'Union soviétique."
 ETH_USA_FAMINE.0.d:0 "LA POLITIQUE DE LA FAMINE : PERSPECTIVES ET RECOMMANDATIONS\nBureau Éthiopie, Bureau des affaires africaines\nSECRÈTE/NOFORN\n\nLa famine et la guerre civile qui ravagent l’Éthiopie continuent de présenter des défis et des opportunités uniques pour nos politiques africaines. Bien que nous ayons fourni une aide humanitaire à l’Éthiopie ces dernières années, de nombreux envois, notamment vers les territoires occupés par les rebelles, la région la plus touchée du pays par la sécheresse et la famine, ont été effectués. Malheureusement, la principale faction rebelle, le Front de libération du peuple du Tigré (FLPT), et le gouvernement militaire se réclament tous deux de l’idéologie marxiste-léniniste et sont peu susceptibles de se ranger du côté de notre gouvernement, d’autant plus que ce dernier est soutenu par l’Union soviétique et Cuba. Nous n’avons donc que deux options principales concernant les futurs envois d’aide à ce pays en proie à la détresse. Premièrement, nous pourrions simplement continuer à envoyer de l'aide humanitaire et l'augmenter progressivement afin de témoigner de notre compassion face à la crise humanitaire, tout en ignorant tacitement les problèmes avec le gouvernement éthiopien et le TPLF, et en tentant d'encourager les pourparlers de paix. Deuxièmement, nous pourrions interrompre l'aide humanitaire à l'Éthiopie, rejeter la faute sur le gouvernement éthiopien et tenter de faire porter la responsabilité du conflit et de la famine aux politiques désastreuses du régime communiste. Quelle devrait être la marche à suivre ?"
 ETH_USA_FAMINE.1.d:0 "Alors que nous poursuivons notre aide humanitaire à l'Éthiopie, il est impératif d'évaluer constamment l'efficacité du programme. Bien que cette aide ait indéniablement contribué à atténuer, même légèrement, les souffrances des civils éthiopiens, diverses irrégularités et préoccupations ont été signalées par les autorités. De nombreux convois d'aide destinés à l'intérieur du pays, notamment aux régions les plus touchées et occupées par les rebelles, ont été interceptés par les forces gouvernementales et celles du TPLF, soit pour leur propre usage, soit pour être redistribués à leurs partisans. Compte tenu des orientations politiques de ces deux factions, la question se pose de savoir si nous devrions indirectement soutenir les forces communistes. Malheureusement, nous n'avons pas les moyens d'empêcher ces interceptions ; la question est donc de savoir si nous devons interrompre totalement l'acheminement de l'aide. Quel que soit notre choix, il aura des conséquences majeures sur notre politique future à l'égard de l'Éthiopie."
 ETH_USA_FAMINE.2.d:0 "Washington a informé notre gouvernement aujourd'hui que le gouvernement américain suspendait l'aide humanitaire destinée à notre pays. Le communiqué indique également que les Américains entendent rejeter la responsabilité de cette décision sur notre gouvernement, l'accusant d'avoir intercepté plusieurs convois d'aide destinés aux territoires occupés par les rebelles. Cette mesure ne manquera pas d'exacerber les tensions au sein du pays, mais elle présente aussi des avantages : étant donné que la famine atteint son paroxysme dans ces territoires, le TPLF sera contraint de gérer la situation au lieu de concentrer toutes ses forces sur nous. Par ailleurs, le ministère des Affaires étrangères devrait tenter de manipuler l'opinion publique et de rejeter la faute sur les États-Unis et le TPLF, les accusant respectivement de sacrifier des vies africaines sur l'autel de l'anticommunisme et d'intercepter l'aide humanitaire. En définitive, bien que ce soit un coup dur pour le pays dans son ensemble, interrompre l'aide humanitaire aux zones rurales présente des avantages certains, car cela pourrait faire pencher le cours de la guerre en notre faveur."
 ETH_USA_FAMINE.3.d:0 "Dans un communiqué publié aujourd'hui, Washington a confirmé la suspension de l'aide humanitaire américaine à l'Éthiopie en raison des interceptions répétées de convois par les différentes factions impliquées dans la guerre civile. Le communiqué précise que l'administration américaine souhaitait poursuivre son aide humanitaire, mais qu'elle ne faisait pas confiance au gouvernement éthiopien pour permettre son acheminement vers les régions touchées et qu'elle ne souhaitait pas fournir davantage de matériel au régime communiste d'Addis-Abeba. Le gouvernement éthiopien a démenti les informations faisant état d'interceptions et a rejeté la responsabilité sur le Front de libération du peuple tibétain (TPLF). Les organisations humanitaires ont vivement critiqué cette annonce, la qualifiant d'abandon du peuple éthiopien par le gouvernement américain et d'instrumentalisation de l'aide humanitaire en pleine crise humanitaire."
 ETH_USA_FAMINE.4.d:0 "Après mûre réflexion, le Département d'État, en accord avec le Président, a décidé que la meilleure solution en Éthiopie était de poursuivre et d'accroître notre aide humanitaire. Bien que l'interception de cette aide par le gouvernement soit un problème avéré, les avantages de la poursuite de l'assistance compensent largement les détournements de fonds. Le Département d'État a également souligné qu'un arrêt de l'aide serait probablement vivement critiqué par la communauté internationale et serait perçu comme une tentative de politisation d'une catastrophe humanitaire en cours. Cette situation serait certainement exploitée à des fins de propagande par l'Union soviétique contre nous, notamment dans d'autres pays africains touchés par la sécheresse qui sévit en Afrique subsaharienne. Globalement, l'aide humanitaire fournie à l'Éthiopie représente un coût financier minime pour notre gouvernement et constitue une mesure importante de renforcement de notre image, contribuant ainsi à la résolution de cette crise humanitaire majeure. De plus, cette aide permet à nos alliés d'affirmer que la crise a été aggravée par l'échec des politiques communistes, alors même que nous continuons à fournir une aide humanitaire pour tenter d'atténuer les pires conséquences de la famine."
 ETH_USA_FAMINE.5.d:0 "Dans un communiqué diplomatique reçu plus tôt dans la journée, des diplomates américains nous ont informés que Washington allait étendre son programme d'aide humanitaire aux États-Unis. Ce communiqué comprenait également une demande de cesser d'entraver l'acheminement de l'aide vers les territoires occupés par les rebelles. Pendant des années, l'une de nos armes dans la guerre civile a consisté à aggraver la famine dans ces territoires, notamment en redirigeant l'aide humanitaire destinée à ces zones vers nos propres soutiens dans d'autres régions. Cela nous a permis de maintenir notre soutien dans nos territoires clés, tout en affaiblissant les territoires rebelles et en limitant le recrutement de nouveaux membres potentiels. Cela étant dit, mettre fin à cette politique nous vaudrait sans aucun doute le soutien international dont nous avons tant besoin. Quoi qu'il en soit, l'annonce imminente nous aidera certainement à atténuer les pires conséquences de la famine qui continue de ravager le pays."
 ETH_USA_FAMINE.6.d:0 "Dans un communiqué publié aujourd'hui, Washington a annoncé l'augmentation de ses envois d'aide humanitaire à l'Éthiopie. Cette annonce a été bien accueillie par l'opinion publique américaine, mais a suscité l'indignation d'organisations anticommunistes plus radicales, telles que la Heritage Foundation, qui a critiqué l'inaction de l'administration face aux interceptions de l'aide par le gouvernement éthiopien. Washington a reconnu qu'il s'agissait d'un problème majeur pour l'acheminement de l'aide humanitaire aux populations éthiopiennes touchées, notamment dans les territoires contrôlés par les rebelles, mais a admis qu'il était impossible d'y mettre fin sans suspendre totalement l'aide, ce qui ne ferait que nuire au peuple éthiopien. Le gouvernement éthiopien a démenti les informations faisant état d'interceptions et a imputé les perturbations de l'aide humanitaire aux rebelles."
 ETH_USA_FAMINE.7.d:0 "Dans une missive du Département d'État américain, Washington a exprimé son intérêt pour la création d'un cadre neutre pour des pourparlers de paix entre les États-Unis et le Front de libération du peuple du Tigré (FLPT). Tout accord de paix négocié nous conduira vraisemblablement à céder une partie de notre pouvoir et probablement à sacrifier l'intégrité territoriale du pays. En revanche, le simple fait d'envisager des pourparlers de paix devrait renforcer notre réputation internationale et donner à nos alliés cubains et soviétiques le temps de réapprovisionner nos forces armées en vue de futures offensives contre le FLPT. Par ailleurs, si nous souhaitons réellement mettre fin au conflit par la négociation plutôt que par les armes, ce serait une excellente occasion d'œuvrer en ce sens."
 ETH_USA_FAMINE.8.d:0 "Nos représentants diplomatiques en Éthiopie ont informé notre gouvernement plus tôt dans la journée que le gouvernement militaire éthiopien se disait ouvert à des pourparlers de paix avec le Front de libération du peuple du Tigré (FLPT). Compte tenu de la position déjà établie du FLPT sur les négociations, nous espérons que cela permettra d'entamer des pourparlers de paix prochainement. Cependant, les multiples problèmes à l'origine de la guerre civile et de la guerre d'indépendance érythréenne sont complexes et ne seront pas faciles à résoudre à la table des négociations. Ce processus nécessitera une expertise et une attention considérables pour être mis en œuvre. Heureusement, un premier pas a été franchi et le gouvernement éthiopien est désormais disposé à envisager des pourparlers de paix. Nous espérons que cela aboutira à un cessez-le-feu prochainement. Si la situation évolue positivement, ce sera assurément une victoire majeure pour notre politique étrangère en Afrique et cela renforcera notre position sur les plans national et international."
 ETH_USA_FAMINE.9.d:0 "Nos représentants diplomatiques en Éthiopie ont informé notre gouvernement plus tôt dans la journée que le gouvernement éthiopien n'était pas disposé à entamer des pourparlers de paix et a réaffirmé sa conviction que négocier avec le Front de libération du peuple du Tigré serait inutile, considérant l'intégrité territoriale du pays comme inviolable. Bien que cette décision ne soit pas surprenante, elle n'en demeure pas moins décevante. Notre administration avait espéré que la volonté accrue du gouvernement éthiopien de coordonner les efforts humanitaires et de dialoguer avec notre gouvernement pourrait constituer un pas vers une résolution diplomatique du conflit. Hélas, la guerre civile est vouée à se poursuivre pendant encore de nombreuses années."
 ETH_USA_FAMINE.10.d:0 "Dans une annonce surprenante, le secrétaire d'État américain [USA.GetCurrentSecState] a déclaré que Washington avait facilité l'ouverture de pourparlers de paix entre le gouvernement éthiopien et le Front de libération du peuple du Tigré (FLPT). Cette annonce fait suite à un renforcement de l'aide humanitaire américaine à ce pays en proie à la guerre, ainsi qu'à diverses initiatives diplomatiques auprès des deux principaux camps du conflit. Bien qu'aucun cessez-le-feu n'ait été déclaré, cette initiative est néanmoins perçue comme un pas important vers la paix dans la région. Cependant, certains critiques reprochent à ces pourparlers d'ignorer le conflit secondaire qui secoue l'Érythrée depuis le début des années 1960 : la lutte pour l'indépendance de l'Érythrée."
 ETH_USA_FAMINE.11.d:0 "Excellente nouvelle de Washington ! Des diplomates américains nous ont informés, par des voies détournées, que les États-Unis envisagent de nous reconnaître comme le gouvernement légitime de l’Éthiopie. Notre stratégie récente, consistant à modérer notre discours, à condamner le soutien soviétique et cubain au DERG et à établir des parallèles entre notre combat et celui de l’UNITA en Angola, a joué un rôle déterminant dans cette annonce. Grâce à cette reconnaissance américaine, et, nous l’espérons, à l’aide qu’elle nous apportera, nous devrions pouvoir sortir de l’impasse actuelle et anéantir le DERG une fois pour toutes, tout en mettant un terme au conflit érythréen. Cela dit, ce soutien américain aura certainement un prix après la guerre : nous serons probablement contraints d’ouvrir notre économie aux investissements et aux entreprises étrangères et de mener une politique étrangère pro-occidentale. Quoi qu’il en soit, c’est une excellente nouvelle pour notre combat et, nous l’espérons, le tournant décisif qui marquera le début de notre offensive finale vers la victoire."
 ETH_USA_FAMINE.12.d:0 "Lors d'une conférence de presse aujourd'hui, le secrétaire d'État américain [USA.GetCurrentSecState] a annoncé que les États-Unis reconnaissaient le Front de libération du peuple du Tigré (FLPT) comme le gouvernement légitime de l'Éthiopie. Cette décision intervient après un renforcement considérable de l'aide et de la présence américaines dans ce pays africain ravagé par la famine et la guerre. Bien que les deux principaux camps se revendiquent officiellement marxistes-lénnistes, le FLPT a considérablement modéré sa position depuis l'implication américaine et ses efforts pour obtenir le soutien des États-Unis ont porté leurs fruits. Malgré une possible solution diplomatique, le conflit persiste."
 Ethiopian_Contra84.0.d:0 "RÉSISTANCE ÉTHIOPIENNE : PERSPECTIVES ET RECOMMANDATIONS\nBureau Éthiopie, Bureau des Affaires Africaines\nSECRET/NOFORN\n\nDans un monde idéal, le conflit en cours en Éthiopie pourrait se transformer en une puissante guerre par procuration pour contrer le communisme en Afrique. Malheureusement, les deux principales factions de la guerre civile, le Front de libération du peuple du Tigré (FLPT) et le DERG, se revendiquent officiellement marxistes-léninistes et ne constitueraient pas des alliés appropriés sur le plan idéologique. Malheureusement, la plupart des factions plus amicales ont été absorbées, marginalisées ou anéanties dès le début du conflit.\n\nRécemment, Jonas Deressa, directeur d'une organisation humanitaire éthiopienne et figure de proue de l'Alliance démocratique du peuple éthiopien (ADPE), et son frère Dereje Deressa ont fait pression pour obtenir le soutien des États-Unis. L'ADPE est un groupe idéologiquement plus traditionaliste et serait certainement favorable à nos intérêts et à notre influence. De plus, l'EPDA bénéficie du soutien indéfectible de plusieurs faucons au Congrès et d'organisations anticommunistes telles que la Heritage Foundation. Nous pourrions lui apporter une aide en matière de guerre de l'information, de renseignement, de formation et d'armement, mais cela aurait un coût politique et financier considérable, compte tenu de notre implication dans d'autres conflits et de l'opinion publique défavorable à l'idée de nous engager dans un nouveau conflit. Quelle devrait être la marche à suivre ?"
 Ethiopian_Contra84.1.d:0 "Lors d'une conférence de presse aujourd'hui, le président américain a annoncé que Washington reconnaissait l'Alliance démocratique du peuple éthiopien (ADP) et s'engageait activement à armer et approvisionner l'organisation, ainsi que son aile humanitaire. L'ADP, dirigée par les frères Jonas et Dereje Deressa, est particulièrement appréciée de la Heritage Foundation et d'autres groupes anticommunistes américains depuis un an. Le président a indiqué que l'objectif était de faire de l'ADP une force militaire efficace et de l'établir comme une alternative anticommuniste au gouvernement en place et au Front de libération du peuple du Tigré. Cette annonce a été condamnée par l'Union soviétique et Cuba, qui y voient un nouvel exemple de la politique du bord du gouffre menée par les États-Unis. Ces deux États sont connus pour soutenir le gouvernement éthiopien actuel."
 USA_MOBUTU.1.d:0 "MÉCONTENTEMENT AU ZAÏRE : PERSPECTIVES ET RECOMMANDATIONS\nBureau Zaïre, Bureau des affaires africaines\nCONFIDENTIEL/NON DISPONIBLE\n\nLe gouvernement zaïrois, allié de l'Occident, constitue notre principal rempart contre l'expansion communiste en Afrique subsaharienne. Cependant, son bilan déplorable en matière de droits humains, la corruption endémique et le culte de la personnalité dont jouit le président Mobutu représentent autant de facteurs susceptibles de déclencher un conflit interne, susceptible d'entraîner une escalade régionale. Dans ce contexte, il convient d'exercer des pressions sur le gouvernement zaïrois afin qu'il entreprenne des réformes pour remédier à cette situation et limiter les risques de troubles futurs. À défaut, il nous faudra peut-être envisager notre avenir dans la région, en Afrique centrale post-Mobutu, si aucune mesure n'est prise."
 Mobutu84.0.d:0 "L'AVENIR DU ZAÏRE : PERSPECTIVES ET RECOMMANDATIONS\nBureau Zaïre, Bureau des Affaires Africaines\nSECRET/NOFORN\n\nAu fil de la décennie, il devient de plus en plus évident que le président Mobutu ne souhaite ni réformer le pays ni prendre de mesures pour lutter contre la corruption endémique qui le gangrène. Face à cette probabilité, deux approches principales sont possibles. D'une part, nous pourrions tenter de faire pression pour des réformes et limiter nos pertes dans l'immédiat, ou d'autre part, nous pourrions continuer à intensifier notre aide militaire au Zaïre, en plus de notre aide financière. Bien que cette seconde option ne fasse que repousser l'échéance, elle pourrait permettre, à l'avenir, d'utiliser le Zaïre comme base pour des opérations en Angola et dans d'autres pays voisins communistes. Par ailleurs, la suspension de l'aide au Zaïre risquerait de déstabiliser gravement le pays, ce qui compromettrait nos différentes stratégies africaines et risquerait de favoriser l'expansion du communisme en Afrique. Quelle voie devons-nous suivre ?"
 Mobutu84.1.d:0 "Lors d'une rencontre avec l'ambassadeur américain plus tôt dans la journée, les Américains ont insisté sur le fait que Washington souhaite que nous accédions à leurs demandes de réformes humanitaires et politiques au sein de notre pays. Celles-ci comprennent la réduction des pouvoirs de l'État et le contrôle des différents organes répressifs de l'État, ainsi que le démantèlement du prétendu culte de la personnalité autour du président Mobutu et quelques mesures de libéralisation économique. Sans l'affirmer explicitement, l'ambassadeur a fortement laissé entendre que le soutien futur était conditionné à notre acceptation des différentes propositions de réforme américaines. Cela soulève un problème majeur : si nous acceptons les réformes, nous finirons par fragiliser notre propre pouvoir ; mais si nous refusons l'aide, l'arrêt de l'aide américaine déstabilisera gravement le pays. Chaque option présente des risques potentiels pour la pérennité de notre pouvoir au Zaïre."
 Mobutu84.2.d:0 "Excellente nouvelle du Zaïre : notre ambassade à Kinshasa a transmis un message du président Mobutu indiquant que le gouvernement zaïrois acceptera les différentes propositions de réforme que nous lui avons soumises ces derniers mois. Cela devrait marquer un tournant dans la politique de ce pays subsaharien et contribuer à une plus grande stabilité, notamment grâce à la lutte contre la corruption endémique et à la mise en œuvre de réformes démocratiques. Face à la montée du communisme dans la région, particulièrement depuis le départ du Portugal du continent, la préservation du régime de Mobutu est primordiale. Un échec dans sa stabilisation aurait des conséquences désastreuses et pourrait facilement conduire le Zaïre à l’anarchie ou à une prise de contrôle par les communistes, deux scénarios inacceptables pour notre gouvernement."
 Mobutu84.3.d:0 "Malheureusement, notre ambassade à Kinshasa nous a transmis un message du président Mobutu indiquant que le gouvernement zaïrois refusera de mettre en œuvre les différentes propositions de réforme que nous lui avons soumises ces derniers mois. Cela montre, hélas, que le gouvernement privilégie la kleptocratie et la corruption au détriment du bien-être de la nation et de ses citoyens. Face à la montée du communisme dans la région, notamment depuis le retrait du Portugal du continent, la préservation du régime Mobutu est primordiale. L'incapacité à stabiliser ce régime aura probablement des conséquences désastreuses et pourrait facilement conduire le Zaïre à l'anarchie ou à une chute aux mains des communistes, deux scénarios inacceptables pour notre gouvernement. Le refus du régime Mobutu d'appliquer des réformes de bon sens et de lutter contre la corruption endémique ne fait que rendre cette stratégie plus difficile et plus coûteuse à poursuivre."
 Mobutu84.4.d:0 "Bien que loin d'être parfait, le président Mobutu Sese Seko a été un pilier et un fidèle allié des États-Unis pendant des décennies et a joué un rôle déterminant dans le maintien de la stabilité du Zaïre après la fin de la crise congolaise et des guerres civiles des années 1960. Cela dit, les problèmes rencontrés par l'armée zaïroise au cours de la dernière décennie, notamment lors de la tentative d'intervention angolaise, montrent qu'il reste beaucoup à faire pour consolider l'un de nos principaux alliés en Afrique. Malheureusement, le président Mobutu a été la cible de critiques de la part de divers groupes internationaux et nationaux en raison de la corruption endémique, de la pauvreté extrême et des tendances autoritaires qui gangrènent le Zaïre. Mobutu s'est également montré disposé à s'aligner sur notre position vis-à-vis de l'Afrique du Sud, ce qui a conféré une certaine légitimité à nos actions en Afrique australe. Pour le remercier de cette attitude et garantir la stabilité future de la région, nous devrions inviter le président Mobutu à la Maison Blanche afin qu'il puisse présenter ses arguments au peuple américain et accroître l'aide financière et militaire au Zaïre."
 Mobutu84.5.d:0 "Lors de la visite du président zaïrois Mobutu Sese Seko à Washington aujourd'hui, le président américain [USA.GetLeader] a annoncé un soutien accru des États-Unis au Zaïre, le présentant comme une voix de la raison en Afrique francophone, et a salué le maintien de relations solides avec d'autres alliés américains, notamment Israël et l'Afrique du Sud. Si le président américain a loué le Zaïre pour sa position anticommuniste et sa politique étrangère pro-occidentale, des critiques américaines à l'encontre du régime de Mobutu ont critiqué l'accueil du président en raison des nombreuses violations des droits de l'homme signalées au Zaïre et des soupçons de détournement de l'aide financière américaine, alimentés par la corruption endémique qui gangrène le pays. Quoi qu'il en soit, l'administration américaine semble déterminée à continuer d'instrumentaliser le Zaïre dans sa lutte contre le communisme dans la région."
 Mobutu84.6.d:0 "Alors que nous continuons d'investir dans Mobutu, le Zaïre est rapidement devenu notre seul rempart contre le communisme en Afrique francophone et notre principal allié en Afrique subsaharienne, exception faite de l'Afrique du Sud, pays controversé. Dans cette optique, nous devons intensifier nos efforts pour moderniser et réformer les forces armées zaïroises afin de garantir la stabilité du Zaïre et de pouvoir contrer les tentatives communistes de raviver le conflit civil. Compte tenu des piètres performances des forces zaïroises dans les années 1960 et 1970, cet impératif est d'autant plus crucial. Si des efforts suffisants sont déployés pour réformer et équiper les forces zaïroises afin d'en faire une force performante, pourrions-nous envisager de solliciter une nouvelle intervention de l'UNITA dans la guerre civile angolaise ?"
 Mobutu84.7.d:0 "Comme indiqué dans les analyses précédentes, le renforcement du soutien américain à notre régime nous conduira probablement à être sollicités pour intervenir dans les conflits régionaux au nom de Washington. Ces derniers jours, l'ambassadeur américain a transmis un message de Washington indiquant que le gouvernement américain souhaitait que le Zaïre relance une intervention en Angola en faveur des forces de l'UNITA qui combattent le gouvernement communiste. Cela nous offre une opportunité considérable : si l'intervention réussit, nous pourrions probablement faire valoir nos revendications sur l'enclave pétrolière de Cabinda et exercer une certaine influence sur le nouveau gouvernement angolais. Malheureusement, notre précédente tentative d'intervention s'est soldée par un échec cuisant pour nos forces, en raison de divers facteurs, notamment la présence de forces cubaines soutenant le MPLA. De plus, un nouvel échec militaire risquerait d'encourager nos opposants intérieurs et de déstabiliser notre pouvoir. Quelle stratégie adopter ?"
 Mobutu84.8.d:0 "D'excellentes nouvelles nous sont parvenues de notre ambassadeur au Zaïre : le président Mobutu l'a informé, lors d'une réunion de routine, qu'il approuverait une nouvelle intervention en Angola contre le MPLA, en soutien à l'UNITA. Cette nouvelle intervient après que nous nous soyons davantage engagés dans la modernisation de l'armée zaïroise et l'augmentation de notre financement du régime de Mobutu. Malgré les nombreuses interrogations quant à l'efficacité réelle des forces zaïroises, notamment au vu de leurs précédentes interventions malheureuses, il pourrait s'agir d'un moment décisif dans l'histoire de la région, quel qu'en soit le résultat. Une intervention réussie pourrait marquer le début du recul de l'influence communiste en Afrique et valider notre stratégie de politique étrangère africaine de ces dernières années. À l'inverse, un échec pourrait entraîner une reprise des troubles au Zaïre et peut-être annoncer la fin du régime de Mobutu."
 Mobutu84.9.d:0 "Nous avons récemment reçu une mauvaise nouvelle de notre ambassadeur au Zaïre. Le président Mobutu l'a informé que le gouvernement rejetterait la proposition de nouvelle intervention en Angola. Il a expliqué que, même si le Zaïre en aurait idéalement les moyens, les réalités du terrain rendraient une telle initiative trop coûteuse et risqueraient de déstabiliser le pays. Des inquiétudes ont notamment été soulevées quant à la présence continue des forces cubaines en Angola, qui avaient largement contribué à la défaite du Zaïre lors de la précédente intervention il y a dix ans. Autre sujet de préoccupation : l'engagement militaire zaïrois en Angola rendrait le pays vulnérable aux puissances voisines et aux groupes de résistance nationaux comme le Parti révolutionnaire du peuple (PRP)."
 Mobutu84.10.d:0 "Il y a quelques heures, les forces armées du Zaïre ont franchi la frontière angolaise, lançant une offensive vers le sud en direction de Luanda, accompagnée d'une importante campagne de bombardements menée par l'armée de l'air zaïroise. Le département d'État américain a annoncé son soutien à cette intervention et a salué la lutte acharnée des forces de l'UNITA contre les forces du MPLA au pouvoir, appuyées notamment par un important contingent de forces cubaines. Cette opération survient dix ans après la tentative d'intervention controversée du FNLA, soutenu par le Zaïre, dans le nord de l'Angola, qui s'était soldée par une défaite décisive face aux forces conjointes du MPLA et de Cuba. Cela étant dit, ces dernières années, les États-Unis ont investi massivement dans la réforme et la modernisation de l'armée zaïroise et, de l'avis général, l'UNITA est une force bien plus performante que le FNLA."
 Mobutu84.11.d:0 "Le président Mobutu du Zaïre s'est rendu aujourd'hui à Luanda, la capitale angolaise, et a proclamé la victoire dans la guerre civile angolaise lors d'un discours adressé aux soldats zaïrois et de l'UNITA. Cette déclaration marque un net revirement par rapport aux interventions des décennies précédentes, au cours desquelles les forces zaïroises avaient été mises en déroute par une force conjointe cubano-MPLA alors qu'elles tentaient de progresser vers Luanda. Si Jonas Savimi, chef de l'UNITA, a lui aussi proclamé la victoire, il a toutefois souligné que les forces du MPLA poursuivaient activement une guerre d'insurrection et continuaient de recevoir des approvisionnements de Cuba et de l'Union soviétique, et qu'un renfort militaire américain serait nécessaire. Quoi qu'il en soit, il s'agit d'une victoire majeure pour Washington en Afrique australe."
 Mobutu84.12.d:0 "Avec la déroute de l'armée zaïroise dans le nord de l'Angola, la seconde phase de l'intervention zaïroise en Angola s'est soldée par un échec. Non seulement cette intervention a échoué, mais la dégradation de la sécurité intérieure a permis au Parti révolutionnaire populaire (PRP), composé principalement d'anciens lumumbistes et dirigé par Laurent-Désiré Kabila, de se développer rapidement. Basé au Sud-Kivu, le PRP a profité de l'échec de l'intervention des forces armées zaïroises en Angola pour étendre rapidement son influence, entraînant un effondrement général de la cohésion nationale et la prise de contrôle de régions par divers seigneurs de guerre. La détérioration rapide de la situation au Congo a mis la communauté internationale en alerte, car la République démocratique du Congo est une fois de plus au bord de la guerre civile."
 Mobutu84.13.d:0 "Face aux problèmes persistants qui accablent notre pays, Washington a formulé une proposition intéressante. L'ambassadeur américain a souligné que les États-Unis étaient disposés à fournir une aide humanitaire, économique et militaire substantielle en échange de réformes majeures au sein du pays, notamment en matière de démocratisation, de droits humains et de lutte contre la corruption. Alors que notre pays est une fois de plus au bord du précipice, ce plan pourrait faire la différence entre la stabilisation et une nouvelle guerre civile. Cela dit, accepter ces réformes réduirait assurément notre sécurité intérieure et notre influence sur la nation, et pourrait mener à une future altercation pacifique du pouvoir. Par ailleurs, l'ambassadeur a également précisé que si nous rejetons la proposition et que le pays sombre dans la guerre civile, nous ne devrions pas considérer l'intervention américaine comme acquise. Quelle voie devons-nous suivre ?"
 Mobutu84.14.d:0 "Notre ambassade à Kinshasa a informé notre administration ce matin que le président Mobutu a accepté notre programme d'aide et de réformes. Si le Zaïre est un de nos principaux alliés en Afrique, la situation de son gouvernement laisse à désirer : tensions ethniques, corruption endémique, incompétence militaire et économie désastreuse font peser un risque élevé d'instabilité future. Heureusement, le programme d'aide et de réformes démocratiques que le président Mobutu s'est engagé à mettre en œuvre devrait stabiliser le pays et permettre l'émergence d'un Zaïre plus fort, capable d'exercer une influence plus efficace dans la région contre le communisme. Le gouvernement Mobutu pourrait chercher à ralentir la mise en œuvre de ces réformes ou à les saboter ; nous devons donc lui faire confiance tout en vérifiant leur application et en intervenant si nécessaire pour garantir le respect du calendrier prévu."
 Mobutu84.15.d:0 "Notre ambassade à Kinshasa a informé notre administration ce matin que le président Mobutu a refusé notre offre conjointe d'aide et de réformes. Bien que le Zaïre soit un de nos principaux alliés en Afrique, la situation de son gouvernement laisse à désirer. Entre tensions ethniques, corruption endémique, incompétence militaire et économie désastreuse, le risque d'instabilité future est élevé. Malheureusement, le rejet par le président Mobutu de notre proposition d'aide et de réformes ne fait qu'accroître ce risque. Une nouvelle crise et des tensions au Zaïre compromettraient sans aucun doute notre politique et nos objectifs stratégiques en Afrique, et favoriseraient l'expansion de l'influence communiste en Afrique subsaharienne. Dans le pire des cas, nous devrons envisager une intervention militaire dans un éventuel conflit au sein de ce pays africain en proie à de graves difficultés."
 Mobutu84.16.d:0 "Notre aventure malheureuse en Angola a une fois de plus eu un coût exorbitant. Le déploiement militaire a entraîné le retrait des forces de sécurité de l'est du pays, une situation exploitée par les insurgés et les milices ethniques, notamment le Parti révolutionnaire populaire lumumbiste (PRP). Heureusement, notre ambassadeur à Washington nous a fait savoir plus tôt dans la journée que les Américains fourniraient une aide sécuritaire et financière pour contribuer à stabiliser la situation. Bien que nous souhaitions des mesures plus concrètes, telles que des garanties de sécurité, le montant de l'aide proposée devrait suffire à prévenir le pire et indique également que, si la situation s'aggrave, les États-Unis n'hésiteront pas à renforcer leur aide militaire."
 Mobutu84.17.d:0 "Terrible nouvelle : notre ambassadeur à Washington nous a informés que les États-Unis envisagent de dissimuler toute implication dans notre intervention ratée en Angola et qu’ils retiendront probablement toute aide ou soutien face à nos problèmes internes actuels. C’est une véritable catastrophe pour notre gouvernement ; sans aide supplémentaire, la situation continuera inévitablement de se déstabiliser au sein du pays. Des rumeurs font déjà état de nouvelles offensives locales du Parti révolutionnaire populaire (PRP) au Sud-Kivu, et une montée des tensions ethniques dans l’est du pays a également été signalée."
 Mobutu84.18.d:0 "Trahison ! Après nos interventions répétées en Angola, notre soutien à Pretoria et notre politique étrangère pro-occidentale, Washington nous a abandonnés à notre sort dans cette guerre civile. Sans aide ni intervention américaine, notre situation est critique. Nos voisins semblant déterminés à renverser notre régime, notre seule option est de vaincre les forces de Kabila sur le terrain et de tenter soit de rallier les milices ethniques de l'est du pays, soit de les soumettre à notre autorité. Si nous ne parvenons pas à vaincre le Parti révolutionnaire populaire (PRP) ou si d'autres nations interviennent contre nous, nous devrons envisager de fuir le pays pour sauver nos vies et laisser la nation à son sort sous Kabila ou sous occupation étrangère."
 Mobutu84.19.d:0 "Suite à la décision prise ces derniers jours de lancer une intervention armée au Congo, il nous faut désormais établir des plans, des plans d'urgence, des stratégies et évaluer la logistique de la campagne. L'objectif global de l'intervention est d'empêcher l'effondrement de l'État et de garantir que les forces du Parti révolutionnaire populaire (PRP) ne puissent pas renverser le régime. Pour ce faire, nous soutiendrons le gouvernement de Mobutu Sese Seko, lancerons des attaques contre les positions du PRP dans l'est du pays et négocierons avec les forces locales, lorsque cela est possible, afin d'empêcher toute nouvelle avancée vers les insurgés de gauche. Compte tenu de la topographie particulière de la zone cible, une attention particulière devra être portée à la logistique. Nous devrons sécuriser le port de Matadi et il sera probablement nécessaire d'établir de nouvelles bases aériennes à l'intérieur du pays afin d'accélérer la progression de l'opération et d'assurer la pleine utilisation de notre puissance aérienne contre l'ennemi. Enfin, une autre préoccupation concerne les relations publiques. Étant donné que le conflit oppose les Lumumbistes aux extrémistes, des parallèles seront certainement établis avec la crise congolaise des années 1960 afin de critiquer notre intervention comme une manœuvre impérialiste visant à saper davantage la souveraineté de l'Afrique subsaharienne. Pour contrer cela, nous devons veiller à démontrer au peuple américain, par le biais des médias, les diverses atrocités commises dans le pays pour justifier l'intervention."
 Mobutu84.20.d:0 "Heureusement, l'ambassadeur américain nous a informés plus tôt dans la journée que les États-Unis allaient intervenir militairement dans notre guerre civile. Compte tenu de la situation critique dans laquelle nous nous trouvons, conséquence de notre intervention ratée en Angola, encouragée par les États-Unis, c'est le moins que Washington puisse faire pour nous en ces temps difficiles. Des préparatifs devront être entrepris avant l'intervention américaine. Il nous faudra tout d'abord assurer la sécurité et l'entretien du port de Matadi, car la ville deviendra probablement une plaque tournante logistique majeure dans un avenir proche. Vu l'étendue géographique et le manque d'infrastructures rurales de notre pays, il est également impératif d'évaluer et de réparer les routes reliant les grandes villes à Matadi, si nécessaire. De plus, la même démarche devra être entreprise pour les différentes bases aériennes réparties sur l'ensemble du territoire. Bien que la guerre civile ait été difficile jusqu'à présent, espérons que ce sera le tournant décisif qui mènera à la destruction finale des Lumumbistes."
 Mobutu84.21.d:0 "Dans une allocution télévisée, le président américain [USA.GetLeader] a annoncé l'intervention des forces américaines dans la guerre civile en cours au Congo, en soutien aux forces du président Mobutu. La crise actuelle résulte de l'échec de l'intervention zaïroise dans la guerre civile angolaise. Les forces gouvernementales zaïroises, embourbées en Angola, ont permis au Parti révolutionnaire populaire (PRP) de s'échapper du Sud-Kivu et d'étendre rapidement son emprise territoriale dans l'est du Congo. Le président américain [USA.GetLeader] a affirmé qu'une victoire du PRP dans ce conflit entraînerait rapidement la chute des pays voisins sous le joug du communisme et plongerait la région dans un chaos encore plus profond."
 USA_ZAIRE88.0.d:0 "INFLUENCE AMÉRICAINE AU ZAÏRE : PERSPECTIVES ET RECOMMANDATIONS\nBureau Zaïre, Bureau des Affaires Africaines\nSECRET/NOFORN\n\nDepuis la crise congolaise, Mobutu Sese Seko est notre représentant au Congo. Cependant, au fil des ans, les scandales et les problèmes liés à son régime se sont multipliés. La corruption endémique au sein du gouvernement a anéanti tout semblant de soutien populaire dans le pays, et les diverses interventions militaires ratées du pays n'ont pas contribué à renforcer nos ambitions communes en Angola. À ces échecs répétés du gouvernement zaïrois s'ajoute le bilan catastrophique du régime de Mobutu en matière de droits de l'homme. Face à cette accumulation de problèmes, Mobutu est peut-être devenu un handicap pour nos affaires en Afrique. D'un côté, nous pourrions redoubler d'efforts et intensifier notre soutien à Mobutu, en augmentant notre aide militaire au pays. Si cela pourrait contribuer à contenir le communisme dans la région, il convient de tenir compte des erreurs militaires passées du Zaïre. Autrement, nous pourrions cesser de soutenir Mobutu et chercher soit à le destituer au profit d'une alternative plus compétente, soit à contraindre le régime à entreprendre des réformes gouvernementales en matière de droits humains. Cela dit, cette option pourrait, dans le pire des cas, déstabiliser l'ensemble de la région."
 USA_ZAIRE88.1.d:0 "Excellente nouvelle de Washington : l’ambassadeur américain a indiqué plus tôt dans la journée que le président [USA.GetLeader] a autorisé un renforcement du soutien militaire à notre pays. Alors que l’opposition américaine réclame une réduction, voire une suppression, de l’aide à notre nation, l’administration actuelle a souligné que nous sommes bel et bien leur « homme en Afrique ». Nous devons exploiter cette position au maximum. Compte tenu de l’instabilité qui règne actuellement dans le pays et des conflits qui font rage au sud, il est impératif de garantir une force militaire importante et bien équipée. Par ailleurs, les diplomates américains ont également noté que la CIA examine de plus près le conflit en Angola et que nous pourrions être de nouveau sollicités pour apporter notre soutien, voire intervenir directement dans la guerre civile angolaise."
 USA_ZAIRE88.2.d:0 "Mauvaise nouvelle en provenance de Washington : les États-Unis ont annoncé la suspension de tout soutien financier. Pire encore, ils ont également annoncé l’annulation de tous les contrats militaires et de l’aide à notre régime. Washington justifie cette annonce par notre refus de lutter contre la corruption endémique, les violations des droits de l’homme et les aventures militaires malheureuses. La situation va rapidement devenir critique, compte tenu de notre dépendance à l’égard de l’aide financière américaine et de la menace croissante d’un conflit avec des militants communistes et ethniques. Il ne nous reste donc que peu d’options, si ce n’est de tenter de rallier le soutien de nos alliés traditionnels, comme l’Église kimbanguiste, et peut-être d’essayer de réformer l’armée pour la rendre plus efficace en cas de scénario catastrophe."
 SAF_USA80.0.d:0 "LE PROBLÈME SUD-AFRICAIN : PERSPECTIVES ET RECOMMANDATIONS\nService Afrique du Sud, Bureau des affaires africaines\nSECRET/NOFORN\n\nLa vague de décolonisation qui a déferlé sur l’Afrique ces dernières décennies a malheureusement entraîné la progression du communisme sur le continent. Malheureusement, les nations anticommunistes et pro-occidentales restantes en Afrique subsaharienne laissent à désirer. La principale puissance anticommuniste de la région est l’Afrique du Sud, mais sa politique d’apartheid rend toute collaboration très controversée, tant au niveau national qu’international. Pour compliquer encore la situation, l’Afrique du Sud est l’un des principaux soutiens des factions anticommunistes dans les guerres civiles des pays voisins, notamment de l’UNITA en Angola. Deux options s’offrent à nous : condamner fermement l’apartheid et exiger de Pretoria qu’elle abandonne cette politique sous peine de sanctions ; ou proposer une alternative, baptisée « Engagement constructif », qui consisterait à tenter d’inciter diplomatiquement l’Afrique du Sud à entreprendre des réformes en favorisant les échanges économiques et en s’efforçant de contrer les sanctions internationales. Chacune de ces options entraînera des répercussions politiques potentiellement graves, tant au niveau national qu'international."
 SAF_USA80.1.d:0 "Ces dernières années, le mouvement anti-apartheid a pris de l'ampleur dans plusieurs pays occidentaux, et les appels à imposer des sanctions à l'Afrique du Sud en raison de sa politique d'apartheid et de son occupation continue de la Namibie se sont multipliés. Cependant, l'annonce faite aujourd'hui par le président américain [USA.GetLeader] d'une nouvelle politique sud-africaine, baptisée « Engagement constructif », marque une rupture majeure avec cette tendance. Cette politique vise à privilégier le dialogue et les encouragements pour susciter des réformes en Afrique du Sud. Les militants anti-apartheid ont fermement condamné ce changement de politique, le jugeant immoral et contraire aux valeurs morales des États-Unis. Ses partisans, quant à eux, estiment que les sanctions pénaliseraient les populations les plus pauvres et risqueraient de déstabiliser la région."
 SAF_USA80.2.d:0 "Au fil des ans, de plus en plus de nations condamnent notre gouvernement pour sa politique d'apartheid et son prétendu régime de domination d'une minorité. Malheureusement, les États-Unis s'ajoutent désormais à cette liste, et les conséquences à long terme pour notre économie et nos forces armées sont particulièrement préoccupantes. Étant donné que les États-Unis constituent le principal obstacle à l'imposition de sanctions par les Nations Unies à notre encontre, et qu'ils sont également notre principal fournisseur d'armes étranger, la situation est extrêmement alarmante. Bien que l'on puisse espérer qu'il ne s'agisse que d'une simple manœuvre politique destinée à apaiser l'opinion publique américaine, nous devons nous préparer au pire : un retrait de l'aide américaine, accompagné de sanctions potentiellement dévastatrices pour notre économie et nos dirigeants."
 SAF_USA80.3.d:0 "Dans un discours virulent prononcé plus tôt dans la journée, le président américain [USA.GetLeader] a condamné sans ambages le gouvernement sud-africain pour sa politique d'apartheid persistante et le maintien d'un régime minoritaire. Si Washington s'est montré plus critique envers l'Afrique du Sud ces dernières années, cette déclaration marque un tournant décisif dans les relations américano-sud-africaines, puisqu'il s'agit de la première condamnation sans équivoque du gouvernement sud-africain actuel. Les principaux militants du mouvement anti-apartheid ont salué le discours du président [USA.GetLeader] et ont exprimé leur optimisme, y voyant peut-être le début de la fin de l'apartheid. Compte tenu du rôle de Washington dans le blocage des sanctions internationales contre l'Afrique du Sud, cela pourrait également représenter un tournant pour le mouvement anti-apartheid. L'avenir dira s'il s'agit d'une simple manœuvre de diversion visant à masquer un soutien clandestin à l'Afrique du Sud ou d'un véritable changement de politique de la part du gouvernement américain."
 SAF_USA80.4.d:0 "Les États-Unis ont manifesté leur volonté d'engager une nouvelle politique d'« engagement constructif » à notre égard. Cette politique viserait concrètement à nous inciter progressivement à entreprendre des réformes internes en échange d'un soutien et d'une aide accrus. Plus important encore, les Américains nous ont également informés, par les voies officieuses habituelles, qu'ils opposeraient leur veto à toute tentative de sanctions à notre encontre aux Nations Unies et qu'ils semblent vouloir maintenir, voire intensifier, le partage de renseignements concernant la guerre à la frontière et la guerre civile angolaise. Que nous souhaitions ou non impulser des réformes structurelles majeures, le moment est opportun pour évaluer les avantages que nous pourrions retirer de certains types de réformes et, éventuellement, utiliser ces incitations pour convaincre les tenants d'une ligne dure d'adopter des réformes modérées."
 SAF_USA80.5.d:0 "Lors d'une session houleuse de l'ONU hier, l'ambassadeur américain auprès des Nations Unies a annoncé que son pays opposerait son veto au train de sanctions actuellement imposé à l'Afrique du Sud, ainsi qu'à toute future tentative de sanctionner ce pays controversé. L'Afrique du Sud a salué cette annonce, y voyant un soutien à ses efforts pour contenir et faire reculer le communisme en Afrique australe, notamment à son intervention en Angola. Le mouvement anti-apartheid a condamné cette décision, la qualifiant de manœuvre politique dangereuse et opportuniste qui ne fera que renforcer le pouvoir du gouvernement sud-africain. Les opposants politiques du président américain [USA.GetLeader] et ses potentiels rivaux lors des prochaines élections ont également réagi, critiquant majoritairement cette mesure et appelant à un renouvellement du leadership américain."
 SAF_USA80.6.d:0 "Dans un communiqué de l'ambassadeur américain, le gouvernement américain a sollicité une collaboration concernant l'Afrique du Sud et la nouvelle politique d'« engagement constructif ». Concrètement, nous serions appelés à nous joindre à leurs efforts pour contrer les sanctions internationales imposées à l'Afrique du Sud et à tenter d'engager diplomatiquement le pays dans des réformes internes, en lui offrant des incitations en ce sens. De plus, il est probable que nous soyons également sollicités pour contribuer au partage de renseignements et à une aide militaire clandestine dans le cadre de la guerre civile angolaise et du conflit frontalier sud-africain. Une telle coopération contribuerait sans aucun doute à endiguer le communisme en Afrique, mais soulève diverses questions morales et politiques, compte tenu de l'opposition de l'opinion publique à l'apartheid. Quelle devrait être notre approche ?"
 SAF_USA80.7.d:0 "Heureusement, la Grande-Bretagne a accueilli favorablement notre demande de collaboration concernant l'Afrique du Sud. Le Premier ministre britannique [ENG.GetLeader] s'est engagé à instaurer un dialogue constructif avec le gouvernement de Pretoria et à encourager les réformes politiques en échange d'une aide économique. Cependant, les Britanniques se montrent malheureusement moins enclins à s'impliquer davantage dans les luttes armées en Afrique australe. Quoi qu'il en soit, cela devrait contribuer à légitimer notre politique d'« engagement constructif » avec l'Afrique du Sud et à apaiser les critiques de l'opposition et du mouvement anti-apartheid. De plus, disposer d'un partenaire majeur dans les négociations avec l'Afrique du Sud est un atout précieux. L'objectif reste d'inciter l'Afrique du Sud à entreprendre des réformes sans compromettre la lutte contre le communisme en Afrique australe."
 SAF_USA80.8.d:0 "Malheureusement, le Royaume-Uni a poliment rejeté notre proposition de collaboration concernant l'Afrique du Sud. Le gouvernement britannique a fait valoir que cette initiative serait politiquement dangereuse pour le gouvernement en place, et a également soulevé diverses objections morales quant à l'affaiblissement des sanctions imposées à l'Afrique du Sud ou à l'ingérence dans le mouvement anti-apartheid. Cela représente un revers majeur pour nos efforts visant à constituer une coalition internationale de soutien à l'Afrique du Sud et à présenter la politique d'« engagement constructif » comme une alternative valable aux sanctions. De plus, sans le soutien du Royaume-Uni aux Nations Unies, nous risquons fort de nous attirer davantage de critiques de la part des pays de l'ancien bloc de l'Est et des militants anti-apartheid pour nos tentatives de protéger l'Afrique du Sud des sanctions."
 SAF_USA80.9.d:0 "Les échanges récents avec Londres et Washington ont démontré que les gouvernements de ces deux pays devraient dialoguer avec nous afin de promouvoir des réformes progressives et des mesures de libéralisation économique pour dynamiser l'économie. Cette nouvelle politique, intitulée « Dialogue constructif », est assurément préférable à l'alternative que représentent les pressions et les sanctions de ces deux grandes puissances. Cela dit, adhérer à ce « Dialogue constructif » exige néanmoins de notre gouvernement qu'il mette en œuvre au moins certaines réformes, ce qui risque d'être impopulaire auprès des éléments les plus radicaux au sein du gouvernement et pourrait s'avérer politiquement risqué. De plus, l'instauration de réformes visant à réduire marginalement l'apartheid pourrait encourager la population africaine à exiger davantage et radicaliser davantage la population, la poussant ainsi à rejoindre le Congrès national africain (ANC). Refuser, en revanche, nuirait assurément à nos relations avec Washington, notre principal allié restant, et pourrait facilement entraîner l'adoption de nouvelles sanctions internationales contre notre gouvernement, ce qui aurait des conséquences économiques désastreuses. Quelle voie devons-nous suivre ?"
 SAF_USA80.10.d:0 "Pretoria a accueilli favorablement notre proposition d'« engagement constructif » et a noté que le gouvernement sud-africain se réjouit de poursuivre les discussions. Ceci jette les bases nécessaires au lancement effectif de notre politique d'« engagement constructif », le gouvernement sud-africain étant disposé à discuter des réformes potentielles. Tout progrès réalisé avec le gouvernement sud-africain pourra être considéré comme une victoire pour notre politique et notre administration, tant au niveau national qu'international. De plus, si cette politique parvient à promouvoir des réformes en Afrique du Sud, nous serons en mesure de contrer les sanctions internationales et nationales imposées à ce pays, sanctions qui entraveraient sa lutte contre le communisme."
 SAF_USA80.11.d:0 "Contre toute attente, l'Afrique du Sud a décidé de ne pas coopérer avec nous dans nos efforts pour renforcer sa légitimité et éviter des sanctions internationales. Cette décision intervient après la récente prise de contrôle du Parti national par Andries Treurnicht, qui a supplanté l'aile réformiste précédemment au pouvoir. Ce choix de Pretoria sonne le glas de notre politique d'« engagement constructif ». Nous devons désormais décider si nous soutenons unilatéralement l'Afrique du Sud, malgré l'apartheid, ou si nous abandonnons Pretoria et laissons les communistes agir librement en Afrique australe. Chacune de ces options risque de compromettre nos objectifs stratégiques dans la région et suscitera sans aucun doute la controverse auprès de l'opinion publique américaine."
 SAF_USA80.12.d:0 "Dans un discours prononcé devant le Parlement, le président sud-africain [SAF.GetLeader] a annoncé que son gouvernement entamerait un dialogue avec les États-Unis et le Royaume-Uni sur l'apartheid et la lutte internationale contre le communisme, dans le but de trouver un terrain d'entente. Le président américain [USA.GetLeader] a salué cette annonce, y voyant un pas vers une réforme potentielle et une défense de l'Afrique australe face aux dangers du communisme. De l'autre côté de l'hémicycle, les militants anti-apartheid, le Congrès national africain (ANC) et d'autres organisations ont critiqué cette initiative, la qualifiant de simple manœuvre dilatoire du gouvernement sud-africain et de nouvelle tentative pour éviter des sanctions de Washington."
 SAF_USA80.13.d:0 "Une proposition intrigante de Washington a récemment été soumise à notre gouvernement. Elle vise à instaurer une paix régionale en Afrique australe en exigeant que le gouvernement sud-africain reconnaisse l'indépendance du Sud-Ouest africain (alors connu sous le nom de Namibie) et retire toutes ses forces militaires du pays, en échange du retrait des forces cubaines d'Angola qui soutiennent le Mouvement populaire de libération de l'Angola (MPLA). D'un côté, soutenir cette mesure contribuerait certainement à apaiser les tensions avec l'Occident et garantirait l'indépendance de la Namibie, un de nos objectifs stratégiques dans la région. Cependant, le retrait du soutien cubain de l'Angola pourrait avoir des conséquences désastreuses pour le gouvernement communiste de Luanda. Sans ce soutien initial, il est fort improbable que le MPLA ait pu repousser l'opposition anticommuniste, les Sud-Africains et l'intervention militaire zaïroise. De plus, on ignore si le MPLA pourra contenir l'opposition dans la guerre civile sans la présence continue de Cuba. Quelle devrait être notre position ?"
 SAF_USA80.14.d:0 "Moscou a manifesté son approbation de notre proposition de paix africaine, une nouvelle qui a surpris notre gouvernement, mais qui s'avère néanmoins bienvenue. Cela pourrait bien annoncer une nouvelle tendance à la baisse des tensions entre Washington et Moscou. Idéalement, les Soviétiques contribueront à convaincre Cuba d'accepter également la proposition. Cependant, bien que Cuba soit un allié de l'Union soviétique, elle n'est en aucun cas un État client et son approbation ne doit pas être considérée comme acquise. Par ailleurs, convaincre l'Afrique du Sud d'accepter la proposition pourrait s'avérer complexe, compte tenu de son engagement de longue date à conserver le Sud-Ouest africain au sein de sa nation. Dans l'ensemble, il s'agit d'un grand pas vers la paix dans la région, qui, nous l'espérons, mènera à une paix durable en Namibie et en Afrique du Sud et légitimera notre politique sud-africaine révisée."
 SAF_USA80.15.d:0 "Malheureusement, Moscou a ignoré notre plan de paix régional en Afrique australe. Bien qu'aucune explication détaillée n'ait été fournie, les analystes du Département d'État estiment que la réponse est relativement simple : compte tenu de l'avantage des forces pro-communistes en Afrique australe, Moscou ne voit pas l'intérêt de céder potentiellement l'Angola pour l'indépendance du Sud-Ouest africain, surtout sans aucune garantie quant aux actions de l'Afrique du Sud en Angola et dans la région après le retrait cubain. L'aide soviétique croissante aux gouvernements angolais, mozambicain et éthiopien démontre une fois de plus que Moscou n'entend pas négocier de bonne foi un plan de paix régional. En définitive, cette décision n'est pas une surprise pour l'administration, mais elle constitue un échec de la politique d'« engagement constructif », dont l'objectif stratégique final était l'instauration d'une paix régionale en Afrique australe."
 SAF_USA80.16.d:0 "Moscou a transmis une proposition intrigante des États-Unis, qu'elle a approuvée. Cette proposition consiste à retirer nos forces combattant en Angola en échange de l'octroi par l'Afrique du Sud de l'indépendance au Sud-Ouest africain, sous l'égide de l'Organisation du peuple du Sud-Ouest africain (SWAPO). Bien que la SWAPO soit l'un de nos alliés africains et que la libération de la Namibie soit un objectif majeur de nos interventions en Afrique, il est difficile de savoir si le gouvernement angolais pourra survivre face à l'opposition impérialiste si nous retirons nos forces d'Angola. Par ailleurs, la perte de la Namibie devrait également réduire la présence et la capacité d'intervention de l'Afrique du Sud en Angola, et un tel accord de paix contribuerait certainement à légitimer nos interventions passées en Afrique. De plus, la proposition a fuité et est parvenue au gouvernement angolais, qui est furieux contre Moscou pour l'avoir approuvée. La chute potentielle du gouvernement marquerait sans aucun doute l'échec de notre intervention à long terme. Compte tenu de ces éléments, quelle devrait être la marche à suivre ?"
 SAF_USA80.17.d:0 "La Havane nous a informés de son intention d'accepter notre proposition de paix pour l'Afrique australe et de contribuer à la paix en retirant ses forces d'Angola. Le gouvernement cubain a toutefois précisé que l'accord n'empêchait pas Cuba de fournir une aide matérielle au gouvernement angolais et qu'il continuerait de soutenir ses alliés en Namibie et en Angola par d'autres moyens. Bien que cela risque de constituer un désagrément à long terme, le départ des forces cubaines représente une perte considérable de capacités de combat pour le gouvernement angolais communiste et devrait permettre à l'opposition de reprendre l'ascendant dans la longue guerre civile qui ravage le pays. Le gouvernement cubain a également manifesté sa volonté de poursuivre le dialogue sur d'autres questions régionales, notamment sur le traitement des réfugiés cubains. Reste maintenant à convaincre l'Afrique du Sud…"
 SAF_USA80.18.d:0 "La Havane nous a fait savoir sans ambages qu'elle refuserait de se retirer d'Angola et de retirer son soutien au Mouvement populaire de libération de l'Angola (MPLA). La réponse du gouvernement cubain se résume à ceci : si la paix est souhaitée, il refuse de négocier avec le gouvernement sud-africain. Il a également été affirmé que Cuba et ses alliés africains sont actuellement en position de force et entendent intensifier leurs efforts en Angola et en Namibie. Sans la volonté de Cuba de participer au plan, il est vain de poursuivre les négociations avec d'autres nations, car le retrait cubain d'Angola est une condition essentielle du plan de paix proposé. Compte tenu de l'objectif ultime de la politique d'« engagement constructif », cela représente un échec stratégique global du programme."
 SAF_USA80.19.d:0 "Une proposition intéressante nous est parvenue de Washington aujourd'hui. Il s'agit de reconnaître l'indépendance du Sud-Ouest africain (SWA) sous le nom de Namibie en échange du retrait des forces cubaines d'Angola. Cette proposition a déjà été approuvée par les États-Unis, l'Union soviétique et Cuba ; notre accord constitue la dernière étape du processus. D'un côté, le retrait des forces cubaines de la région serait un atout indéniable pour nos objectifs stratégiques et affaiblirait considérablement les forces communistes. De l'autre, il nous faudrait sacrifier notre intégrité territoriale en accordant l'indépendance à la Namibie, ce qui ne manquera pas de nous aliéner de nombreux conservateurs au sein de notre gouvernement et pourrait nous faire perdre des soutiens politiques dans le pays. Quelle voie devons-nous suivre ?"
 SAF_USA80.20.d:0 "L'Afrique du Sud a adhéré à notre initiative de paix régionale concernant l'Angola et la Namibie. Grâce à l'accord de Pretoria, nous pouvons désormais attendre le retrait de Cuba d'Angola et, par conséquent, renforcer notre aide létale à l'Union nationale pour l'indépendance totale de l'Angola (UNITA) afin d'enrayer définitivement la montée du communisme en Afrique australe. De plus, étant donné que la paix régionale durable en Namibie était l'un des objectifs stratégiques fondamentaux de la politique d'« engagement constructif », il s'agit d'une victoire incontestable et d'une validation des initiatives de politique étrangère du gouvernement. Cependant, le travail n'est pas terminé : le gouvernement doit encore garantir la stabilité de l'Afrique du Sud et encourager les réformes dans ce pays, ainsi que s'assurer de la victoire de l'UNITA de Jonas Savimbi sur le gouvernement communiste du Mouvement populaire de libération de l'Angola (MPLA). Si ces deux objectifs supplémentaires sont atteints, ce sera assurément un accomplissement majeur du président [USA.GetLeader] dont on se souviendra pendant des années."
 SAF_USA80.21.d:0 "À la surprise générale, l'Afrique du Sud a rejeté notre plan de retrait cubain d'Angola en échange de l'indépendance de la Namibie. Pretoria a dénoncé une tentative flagrante d'instaurer la paix régionale au détriment de l'intégrité territoriale de son pays. [SAF.GetLeader] a également affirmé que ce plan n'empêcherait en rien le Congrès national africain (ANC) et l'Organisation du peuple du Sud-Ouest africain (SWAPO) d'utiliser la Namibie comme base pour mener des attaques en Afrique du Sud. Étant donné que les Soviétiques et les Cubains avaient déjà donné leur accord, ce rejet compromet sérieusement nos objectifs stratégiques africains et nos plans à long terme. L'objectif ultime de la politique d'« engagement constructif » étant le retrait cubain, ce rejet constitue un échec stratégique global du programme."
 SAF_USA80.22.d:0 "Dans une annonce surprenante, les gouvernements de l'Union soviétique, de Cuba, de l'Afrique du Sud et des États-Unis ont déclaré leur soutien aux accords de Windhoek, dont la signature est imminente. Ces accords constituent un plan de paix régional visant à mettre fin à l'escalade du conflit dans la région. L'Afrique du Sud reconnaît l'indépendance de la Namibie sous un gouvernement intérimaire dirigé par la SWAPO. En échange, Cuba retirera ses forces militaires d'Angola au nom du gouvernement angolais. Les réactions internationales sont mitigées : la plupart des grandes puissances saluent cette avancée vers la paix, tandis que le mouvement anti-apartheid et le gouvernement angolais dénoncent l'accord comme une trahison des Sud-Africains noirs."
 SAF_USA80.23.d:0 "Ces dernières semaines, le gouvernement américain a commencé à faire pression sur notre gouvernement pour qu'il entreprenne des réformes politiques. Étant donné que les États-Unis sont notre principal soutien international, la situation est très problématique. Accepter des réformes majeures entraînerait certainement une réaction négative de la part des conservateurs, d'autant plus que les tensions avec le Parti national s'intensifient et que le risque de scission augmente de jour en jour. Par ailleurs, en rejetant ces pressions, il est fort probable que les États-Unis cessent de bloquer les sanctions contre notre gouvernement aux Nations Unies et ailleurs, ce qui nuirait à notre économie et à notre effort de guerre, et risquerait de déstabiliser davantage le pays. Une autre voie possible serait d'entreprendre des réformes modérées pour tenter d'apaiser Washington tout en essayant de contrebalancer l'influence des conservateurs au Parlement. Cependant, cette option pourrait facilement nous aliéner à la fois Washington et les conservateurs. Quelle est la marche à suivre ?"
 SAF_USA80.24.d:0 "À la surprise générale, le président sud-africain [SAF.GetLeader) has agreed to begin implementing political reforms. In particular President [SAF.GetLeader] a accepté d'entamer la mise en œuvre de réformes politiques. Il a notamment fait part de son intention de présenter au Parlement une proposition visant à élargir quelque peu le droit de vote et d'engager un dialogue au sein du gouvernement et de l'opposition légale afin d'identifier d'autres réformes susceptibles de faire l'objet d'un consensus. Bien que cette approche soit plus modérée que celle souhaitée par notre gouvernement, elle constitue un premier pas positif, notamment grâce à l'engagement public de mener des réformes publiques prochainement. Malheureusement, le choix d'une ligne plus modérée par la direction du parti risque d'exacerber les tensions politiques en Afrique du Sud. S'il nous faudra suivre de près les progrès réalisés et éventuellement apporter un soutien politique discret pour atténuer toute réaction négative lors des prochaines élections, cette initiative confirme la pertinence de la politique sud-africaine du gouvernement."
 SAF_USA80.25.d:0 "Dans un discours prononcé plus tôt devant le Parlement, le président sud-africain [SAF.GetLeader] a lancé une diatribe virulente contre l'Occident, l'accusant de trahir la race blanche et, par conséquent, l'Afrique du Sud. Jusqu'à présent, tout porte à croire que notre campagne de pression a eu l'effet inverse et a conduit Pretoria à renforcer son soutien à l'apartheid et au régime de la minorité blanche. Nous devons désormais évaluer la marche à suivre. Il nous reste deux options : poursuivre la campagne de pression en imposant des sanctions à l'Afrique du Sud ou ignorer le problème et continuer à apporter un soutien clandestin aux activités militaires sud-africaines en Afrique du Sud-Ouest et en Angola. Aucune de ces options n'est optimale et elles comportent des coûts et des risques importants. La première voie risque d'encourager le gouvernement communiste angolais et de légitimer l'intervention cubaine dans la région, tandis que la seconde risque d'entraîner une condamnation internationale et une controverse politique intérieure."
 SAF_USA80.26.d:0 "Dans un discours surprenant, le président sud-africain [SAF.GetLeader] a annoncé son intention d'entreprendre des réformes modérées visant à élargir la participation politique du pays à un plus grand nombre de citoyens, indépendamment de leur origine ethnique. Si les détails de ces réformes n'ont pas été divulgués, il est largement supposé que la principale mesure consisterait à réformer le Parlement afin d'accorder aux citoyens noirs le droit de voter pour des sièges spécifiques ou de créer une chambre parlementaire pour chaque groupe ethnique majeur du pays. La réaction internationale est mitigée : Washington et Londres ont salué cette initiative comme une victoire pour la politique d'« engagement constructif », tandis que le mouvement international anti-apartheid l'a condamnée comme une demi-mesure symbolique."
 SAF_USA80.27.d:0 "Lors d'une récente rencontre avec le président américain [USA.GetLeader], nous avons été informés que les États-Unis souhaiteraient que nous exercions des pressions sur le gouvernement sud-africain concernant l'apartheid et le régime de la minorité démocrate. Compte tenu de nos relations historiques avec l'Afrique du Sud, notre influence auprès du gouvernement de Pretoria pourrait s'avérer utile pour inciter le pays à entreprendre des réformes. Cela dit, il s'agit d'une question complexe qui mérite un examen approfondi avant toute décision. Étant donné les divisions internes au sein de notre gouvernement quant à la stratégie à adopter face à l'Afrique du Sud, chaque choix aura des conséquences politiques intérieures. Un autre facteur à prendre en compte est le conflit en cours en Angola et en Sud-Ouest africain, auquel l'Afrique du Sud est également confrontée ; des sanctions pourraient perturber l'effort de guerre global contre le Mouvement populaire de libération de l'Angola (MPLA) et l'Organisation populaire du Sud-Ouest (SWAPO), deux mouvements communistes en Afrique australe. Quelle devrait être notre approche ?"
 SAF_USA80.28.d:0 "Heureusement, le gouvernement britannique a décidé de se joindre à notre campagne de pression contre le gouvernement sud-africain. En dehors de nos propres frontières, la Grande-Bretagne est sans doute la grande nation la plus proche de l'Afrique du Sud, étant donné qu'elle en est un ancien dominion et qu'elle a des intérêts directs dans ce pays. Nous espérons que notre campagne de pression aboutira à des réformes positives en Afrique du Sud. Cependant, de nombreuses inquiétudes subsistent quant à un éventuel effet contre-productif de cette campagne, qui pourrait aggraver la guerre civile angolaise, le conflit frontalier sud-africain ou encore encourager les extrémistes au sein du Congrès national africain (ANC), du Parti nationaliste (NAP) et du Parti conservateur (CDP). Le gouvernement britannique a également laissé entendre que, si la campagne de pression n'aboutissait pas, il serait disposé à discuter avec nous de la coordination de sanctions économiques à imposer à l'Afrique du Sud dans les années à venir. Dans l'ensemble, il s'agit d'un point de départ solide pour notre nouvelle politique sud-africaine et le lancement d'une campagne de pression contre le gouvernement de Pretoria."
 SAF_USA80.29.d:0 "Malheureusement, le gouvernement britannique a refusé de se joindre à notre campagne de pression contre le gouvernement sud-africain. La Grande-Bretagne a fait valoir que, si la politique d'apartheid était certes répréhensible, elle ne croyait pas qu'une pression diplomatique sur Pretoria aboutirait à des résultats crédibles et ne ferait qu'accentuer l'isolement de l'Afrique du Sud au sein de la communauté internationale, retardant ainsi les progrès sur ce dossier. Un autre argument avancé était que toute pression exercée sur le pays ne ferait que renforcer la position des extrémistes au sein du gouvernement et pourrait entraver les réformes futures. En définitive, il s'agit d'un obstacle majeur pour notre nouvelle politique sud-africaine, et une campagne de pression menée sans le soutien de la Grande-Bretagne sera assurément moins efficace."
 SAF_USA80.30.d:0 "Ces derniers mois, le mouvement anti-apartheid a pris une ampleur considérable au sein de la communauté internationale. Cette montée en puissance intervient alors que les États-Unis et le Royaume-Uni ont intensifié leurs pressions diplomatiques sur notre gouvernement afin qu'il entame des réformes concernant l'apartheid et évolue vers un régime majoritaire. Face à cette situation, nos options sont limitées. Premièrement, nous pourrions tout simplement continuer d'ignorer les critiques de la communauté internationale à l'égard de notre régime, étant donné que la pression émane désormais de nos alliés traditionnels. Cela risquerait d'entraîner des sanctions économiques et une déstabilisation accrue, ce qui ne serait pas souhaitable. Deuxièmement, nous pourrions accepter la nécessité de réformes, mais procéder lentement afin de nous donner le temps de trouver des alternatives à l'abandon total du pouvoir. Enfin, notre dernière option serait d'opérer une transition majeure vers un régime majoritaire et d'entamer le démantèlement de l'apartheid. Cependant, cette option ne sera pas viable si l'influence des conservateurs au sein de notre gouvernement est trop importante."
 SAF_USA80.31.d:0 "Nous avons appris aujourd'hui de Pretoria que l'Afrique du Sud a accepté nos demandes et entamera des délibérations sur des réformes visant à réduire l'apartheid et à renforcer le pouvoir citoyen. Bien que cette évolution soit positive, il sera nécessaire d'évaluer et de suivre la mise en œuvre de ces réformes afin de s'assurer qu'il s'agit de véritables réformes et non de mesures de conciliation destinées à la communauté internationale, sans pour autant changer quoi que ce soit au niveau national. Nous espérons que cela amorcera un processus de réformes en Afrique du Sud permettant à la majorité de participer progressivement à la vie politique et de démanteler le système d'apartheid. L'objectif idéal serait de parvenir à une Afrique du Sud véritablement démocratique et pro-occidentale, qui continue de partager nos objectifs stratégiques dans la région et de contribuer à la lutte contre le communisme en Afrique et ailleurs."
 SAF_USA80.32.d:0 "Nous avons appris aujourd'hui de Pretoria que l'Afrique du Sud a rejeté nos appels et notre campagne de pression en faveur de réformes visant à s'éloigner progressivement de l'apartheid. Bien que regrettable, cette annonce n'est pas particulièrement surprenante pour notre gouvernement. La prochaine étape de notre stratégie consistera à évaluer quelles sanctions seront les plus efficaces contre la classe dirigeante sud-africaine et à en peser l'efficacité et les conséquences néfastes pour la population et l'effort de guerre en Namibie et en Angola. La difficulté, mentionnée précédemment, liée à l'imposition de sanctions contre l'Afrique du Sud réside dans le fait que, Pretoria poursuivant sa lutte contre le Mouvement populaire de libération de l'Angola (MPLA) et l'Organisation du peuple du Sud-Ouest africain (SWAPO), et continuant de soutenir nos alliés dans la guerre civile angolaise, des sanctions trop punitives risquent de nuire à nos autres objectifs stratégiques dans la région. En définitive, la situation en Afrique du Sud demeure problématique et toutes nos actions futures auront des conséquences majeures sur nos autres objectifs stratégiques de politique étrangère dans la région."
 Anti_Apartheid84.1.d:0 "LOI ANTI-APARTHEID GLOBALE : PERSPECTIVES ET RECOMMANDATIONS\nBureau Afrique du Sud, Bureau des Affaires Africaines\nSECRET/NOFORN\n\nLa Loi anti-apartheid globale (CAAA) a été présentée pour la première fois au début des années 1970 par le député Ron Dellums. Bien que le projet de loi n'ait pas été adopté, la pression s'est accrue au sein du Congrès pour qu'il se prononce sur cette législation. Le Sénat a entamé les débats sur la CAAA après avoir surmonté une tentative d'obstruction parlementaire des sénateurs républicains.\n\nCette législation viserait à supprimer le financement du gouvernement sud-africain et à imposer des sanctions commerciales et de voyage afin de perturber davantage son fonctionnement jusqu'à ce qu'il prenne des mesures pour démanteler l'apartheid. Sur le plan de la politique intérieure, la meilleure solution serait de laisser le Congrès voter sur la loi sans pression. Cela dit, si le gouvernement souhaite poursuivre son dialogue avec l'Afrique du Sud, il serait idéal de tenter activement de convaincre suffisamment de sénateurs de bloquer la motion. Cependant, une telle mesure pourrait avoir de graves conséquences politiques."
 Anti_Apartheid84.2.d:0 "Hier soir, le Congrès a adopté à une écrasante majorité la Loi globale anti-apartheid. Par ailleurs, les sondages indiquent que l'opinion publique soutient massivement cette loi, ainsi que d'autres mesures contre l'Afrique du Sud. La question qui se pose maintenant est la suivante : comment procéder ? D'un côté, promulguer la loi serait politiquement populaire, mais risquerait de compromettre tout dialogue avec le gouvernement sud-africain dans l'immédiat. De l'autre, le président pourrait opposer son veto à la loi et lancer une campagne de lobbying pour convaincre suffisamment de sénateurs de voter contre son veto. Si nous optons pour cette solution, le gouvernement sud-africain a proposé son aide pour tenter de convaincre les sénateurs : le ministre des Affaires étrangères pourrait contacter personnellement par téléphone les sénateurs susceptibles de soutenir le veto afin de les rallier à la position du gouvernement sur l'Afrique du Sud. Quelle est la marche à suivre ?"
 Anti_Apartheid84.3.d:0 "Contre toute attente, la loi globale anti-apartheid (CAAA) n'a pas obtenu le nombre de voix nécessaires à son adoption. Si le gouvernement entend poursuivre sa politique de dialogue constructif, il s'agit d'une victoire notable pour le maintien des relations avec l'Afrique du Sud. Cependant, les sondages d'opinion montrent qu'une majorité croissante soutient la CAAA, de nouvelles sanctions contre l'Afrique du Sud et la fin de la politique de dialogue constructif. De plus, les partisans de la CAAA se sont engagés à la représenter à l'avenir. En définitive, malgré l'échec de cette initiative en faveur de la CAAA, la pression politique intérieure en faveur du changement en Afrique du Sud va vraisemblablement s'intensifier, et le gouvernement devrait en tenir compte pour rassurer la population sur sa stratégie face au régime de Pretoria."
 Anti_Apartheid84.4.d:0 "Le Congrès américain a ratifié à une écrasante majorité la loi globale anti-apartheid (CAAA). Cette loi oblige l'administration américaine à suspendre son financement au gouvernement sud-africain et à imposer des sanctions commerciales et de voyage à l'Afrique du Sud jusqu'à ce que le pays prenne des mesures concrètes pour démanteler l'apartheid. Le mouvement international anti-apartheid a salué l'adoption de la CAAA, tandis que ses détracteurs estiment qu'elle constitue un abus de pouvoir flagrant du Congrès sur le pouvoir exécutif en matière de politique étrangère. La question qui se pose désormais est de savoir comment l'administration réagira à cette loi."
 Anti_Apartheid84.5.d:0 "Le président américain [USA.GetLeader] a surpris le monde entier en soumettant au vote la loi globale anti-apartheid (CAAA). Cependant, le Congrès est parvenu à passer outre son veto et à faire adopter définitivement le texte. Malgré cela, l'administration a dénoncé à plusieurs reprises cette loi, la jugeant comme une ingérence excessive dans les affaires du pouvoir exécutif et une atteinte à la politique étrangère. Bien que l'administration ait appliqué les sanctions prévues par la loi, le gouvernement américain a cherché à maintenir des relations diplomatiques avec Pretoria, provoquant ainsi la colère du mouvement international anti-apartheid. Les partisans de la CAAA ont dénoncé le maintien de ces relations avec l'Afrique du Sud comme une violation de l'esprit de la loi, tandis que l'administration a rétorqué qu'elle respectait pleinement la législation votée par le Congrès."
 SAF_USA84.1.d:0 "SANCTIONS CONTRE L'AFRIQUE DU SUD : PERSPECTIVES ET RECOMMANDATIONS\nService Afrique du Sud, Bureau des affaires africaines\nSECRET/NOFORN\n\nFace à la pression croissante exercée sur l'Afrique du Sud pour qu'elle mette fin au régime de la minorité sud-africaine, démantèle l'apartheid et mette fin à son occupation de la Namibie, il apparaît de plus en plus évident que notre approche antérieure, consistant à tenter un dialogue constructif avec l'Afrique du Sud, a pu être, dans une certaine mesure, malavisée. De plus, le Congrès semblant appeler à une position plus ferme à l'égard de l'Afrique du Sud, il serait dans notre intérêt d'appliquer pleinement les sanctions contre ce pays. Les efforts précédents de dialogue avec l'Afrique du Sud n'ont connu qu'un succès limité, voire nul, et ont très probablement permis au gouvernement d'adopter une position plus intransigeante sur le plan intérieur contre certains types de réformes. Quoi qu'il en soit, la décision d'imposer des sanctions à l'Afrique du Sud sera certainement bien accueillie par l'opinion publique et la communauté internationale."
 SAF_USA84.2.d:0 "CONGRÈS NATIONAL AFRICAIN : PERSPECTIVES ET RECOMMANDATIONS\nBureau Afrique du Sud, Bureau des affaires africaines\nSECRET/NOFORN\n\nL'administration ayant pris la décision de soutenir le gouvernement sud-africain actuel dans sa lutte contre le communisme en Afrique australe, des mesures supplémentaires devront être prises pour renforcer cette cause. Il convient tout d'abord de désigner le Congrès national africain (ANC) et ses organisations affiliées comme organisations terroristes. Cela permettrait au gouvernement de cibler les financiers et les fournisseurs de l'ANC."
 SAF_USA84.3.d:0 "Lors d'une conférence de presse houleuse tenue plus tôt dans la journée, l'administration américaine de [USA.GetLeader] a annoncé la désignation du Congrès national africain (ANC) et de sa branche armée, l'uMkhonto we Sizwe (MK), comme organisations terroristes. Cette annonce a suscité des réactions pour le moins clivantes. Les sondages indiquent qu'une large majorité d'Américains désapprouvent cette décision, mais révèlent également une minorité notable qui la soutient, principalement dans le Sud et l'Ouest montagneux des États-Unis. La communauté internationale et le mouvement anti-apartheid ont fermement condamné cette annonce, la qualifiant d'immorale, de raciste et d'anti-chrétienne. De son côté, le gouvernement sud-africain a salué cette décision et a également exprimé son souhait de renforcer davantage ses liens avec Washington."
 SAF_USA84.4.d:0 "Excellente nouvelle de Washington : les États-Unis ont officiellement désigné le Congrès national africain (ANC) et uMkhonto we Sizwe (MK) comme organisations terroristes. Cette désignation autorise les États-Unis à enquêter sur les soutiens nationaux de l’ANC, à réprimer les campagnes de financement et les organisations pro-ANC sur leur territoire, et à faire pression sur les pays affiliés pour qu’ils bloquent tout soutien matériel à l’ANC provenant de tiers. Idéalement, cette mesure pourrait également entraîner une couverture médiatique plus favorable, ou du moins moins critique, de notre cause dans les médias occidentaux et nous permettre de révéler la véritable nature de nos ennemis. Cela dit, la réaction à cette annonce est pour le moins controversée sur la scène internationale, et nous devons suivre de près la situation politique intérieure aux États-Unis."
 SAF_USA84.5.d:0 "Les discussions avec Washington concernant la réforme du système d'apartheid et du régime de la minorité noire sont pour le moins difficiles. Une nouvelle proposition du Département d'État américain consiste, au lieu de prôner des réformes politiques directes, à assouplir les lois économiques et sociales sous couvert de libéralisation économique. Bien que cela n'ait pas d'impact direct sur la situation politique du pays, la levée des restrictions économiques inhérentes au système d'apartheid contribuerait certainement, à long terme, à l'avènement d'une société plus libre. Cela dit, la communauté internationale et le mouvement anti-apartheid ne l'entendront probablement pas de cette oreille et y verront un nouvel exemple d'impérialisme économique au détriment des Africains noirs. Cependant, la prospérité générale ne profite-t-elle pas à tous ?"
 SAF_USA84.6.d:0 "En réponse à nos propositions de libéralisation économique pour le pays, Pretoria semble les avoir acceptées. Le président [SAF.GetLeader] a reconnu que cette méthode de réforme serait bénéfique pour la nation et la plus facile à faire accepter au Parlement par les différentes factions qui le composent. Cela dit, le président [SAF.GetLeader] a souligné que les fondements du système d'apartheid ne seraient pas fondamentalement modifiés par cette libéralisation et a notamment précisé que la loi sur les zones de regroupement ne serait pas abrogée par son gouvernement. Bien que cela soit regrettable, toute avancée vers des réformes est un succès que nous pouvons présenter au public comme une victoire pour la politique d'« engagement constructif » et renforcer notre cause pour éviter des sanctions contre l'Afrique du Sud. De plus, compte tenu des vastes ressources minières du pays, nos donateurs pourront peut-être tirer profit de l'ouverture de l'économie sud-africaine. Bien que le mouvement anti-apartheid s'opposera certainement à cette initiative, la prospérité générale ne profite-t-elle pas à tous ? On espère que les progrès économiques en Afrique du Sud conduiront à une société plus libre et marginaliseront certains aspects du mouvement anti-apartheid."
 SAF_USA84.7.d:0 "En réponse à nos propositions de libéralisation économique pour le pays, Pretoria a rejeté notre proposition. Le président [SAF.GetLeader] a affirmé que cette proposition fragiliserait considérablement le système d'apartheid et ouvrirait la voie à un régime majoritaire. Pretoria prétend notamment que l'abrogation de la loi sur les zones de groupes est indispensable à nos réformes économiques, qu'elle qualifie de trahison de la population blanche d'Afrique du Sud. Les analystes du Département d'État estiment également que la radicalisation des conservateurs afrikaners au sein du gouvernement contribue à ce rejet. Quoi qu'il en soit, ce rejet constitue un échec majeur de la politique de « dialogue constructif » du gouvernement et suscitera sans aucun doute des critiques, tant au niveau national qu'international, à l'égard de notre politique sud-africaine."
 SAF_USA84.8.d:0 "D'excellentes nouvelles de Washington sont parvenues aujourd'hui. L'ambassadeur américain a informé notre gouvernement que la CIA allait intensifier activement le partage de renseignements avec nos forces armées et nos services de renseignement. Cette décision fait suite à un changement de cap de Washington, qui a adopté une position beaucoup plus favorable envers notre nation et sa lutte contre la menace communiste aux États-Unis et en Angola. Plus précisément, le partage de renseignements concernera le Mouvement populaire de libération de l'Angola (MPLA), l'Organisation du peuple du Sud-Ouest africain (SWAPO) et les forces et positions cubaines en Angola et en Afrique du Sud-Ouest, afin de renforcer nos efforts dans la guerre frontalière et de soutenir davantage l'UNITA en Angola."
 SAF_USA84.9.d:0 "Dans une allocution télévisée en prime time, le président américain [USA.GetLeader] a prononcé un discours passionné condamnant le gouvernement sud-africain et l'apartheid. Il a affirmé que soutenir ce régime était fondamentalement immoral et contraire aux principes fondateurs des États-Unis, ainsi qu'à la décence élémentaire et aux valeurs religieuses. Ce discours a été largement salué par le public national et international. Les partisans du mouvement anti-apartheid, en particulier, l'ont approuvé et ont appelé à des actions concrètes supplémentaires. De l'autre côté de l'échiquier politique, certains groupes anticommunistes, comme la Heritage Foundation, ont fustigé ce discours, l'accusant de trahir l'Afrique du Sud et ses alliés régionaux au profit de Moscou et de La Havane."
 SAF_USA88.0.d:0 "LE PROBLÈME DE L'APARTHEID : PERSPECTIVES ET RECOMMANDATIONS\nBureau Afrique du Sud, Bureau des Affaires Africaines\nSECRET/NOFORN\n\nMalgré nos efforts pour promouvoir les réformes en Afrique du Sud ces dernières années, les progrès vers un régime majoritaire restent minimes. Face à ce constat, deux options principales s'offrent à nous, notamment compte tenu du rôle crucial de l'Afrique du Sud dans la lutte contre le communisme dans la région. La première consiste à poursuivre les négociations et le dialogue avec l'Afrique du Sud afin de promouvoir les réformes au sein du pays, tout en limitant les répercussions sur le terrain. La seconde option serait de renoncer à la lutte contre l'apartheid et de collaborer ouvertement avec Pretoria. Bien que cette décision soit pour le moins controversée auprès du grand public et de la communauté internationale, elle serait probablement la plus efficace pour endiguer le communisme dans la région et pourrait appuyer nos efforts en Angola."
 SAF_USA88.1.d:0 "Après mûre réflexion, notre gouvernement a décidé de ne plus exercer de pression sur l'Afrique du Sud pour qu'elle se réforme, ni de condamner l'État d'apartheid, mais de soutenir ouvertement le pays en échange de son appui continu dans la lutte contre le communisme en Afrique et peut-être ailleurs. Outre le sabotage discret du mouvement anti-apartheid et les démarches diplomatiques en faveur de l'Afrique du Sud, nous devrons également réfléchir à la meilleure façon d'armer le pays compte tenu des conflits en cours, ainsi qu'à la manière de développer et de revitaliser son économie après les dommages causés par les conflits raciaux et les sanctions.\n\nMalheureusement, l'opinion publique n'a pas soutenu nos efforts et a largement critiqué ce changement de politique. Cela dit, le mal est fait et, tant que l'économie se porte bien, la question devrait tomber dans l'oubli. L'administration devrait également envisager de cibler les militants anti-apartheid et de susciter une couverture médiatique favorable du sort des Sud-Africains blancs afin d'atténuer les conséquences politiques de cette stratégie."
 SAF_USA88.2.d:0 "Avec le temps, le régime d'apartheid en Afrique du Sud est devenu un paria international, de plus en plus difficile à défendre tant au niveau national qu'international. Heureusement, le gouvernement sud-africain l'a enfin reconnu et se dit désormais disposé à entamer des négociations secrètes avec le Congrès national africain (ANC) concernant la possibilité de futures discussions publiques sur la réforme du pays. Bien qu'il s'agisse d'une étape préliminaire vers la réforme, susceptible de ne mener à aucun progrès, elle représente néanmoins le début potentiel de la fin de l'apartheid par un processus politique et diplomatique. Cela dit, de nombreux opposants aux négociations et à une réconciliation et une réunification complètes de l'Afrique du Sud existent. Nombre de dirigeants des « bantoustans » s'opposeront probablement à un rattachement total à l'Afrique du Sud sans garanties solides d'autonomie locale. Par ailleurs, les groupes les plus radicaux, de part et d'autre de l'échiquier politique, s'opposeront vraisemblablement à toute forme de réconciliation pacifique et feront pression sur leurs camps respectifs pour qu'ils quittent la table des négociations. Soutenir des personnalités modérées et rassembleuses des deux côtés sera crucial pour la réussite des négociations futures."
 SAF_USA88.3.d:0 "Lors d'une récente rencontre avec l'ambassadeur américain, nous avons appris que les États-Unis nous incitent à transformer nos discussions secrètes avec le Congrès national africain en négociations concrètes sur la fin de l'apartheid et du régime des minorités. Quelle que soit notre réponse, des problèmes majeurs se poseront. Tout d'abord, si nous acceptons de poursuivre les négociations, nous nous exposerons certainement à une forte réaction du Parti conservateur (KP), de plus en plus influent, dirigé par Andries Treurnicht, ainsi qu'au mécontentement d'autres membres de la ligne dure au sein du gouvernement et à l'opposition des dirigeants des bantoustans. Par ailleurs, même si nous acceptons de négocier, rien ne garantit que nous pourrons surmonter les obstacles importants, notamment concernant les pouvoirs régionaux et le droit de veto des groupes minoritaires dans un nouvel État. En revanche, les négociations pourraient entraîner un allègement des sanctions, ce qui serait assurément bénéfique pour le pays. Quelle voie devons-nous suivre ?"
 SAF_USA88.4.d:0 "Le président sud-africain [SAF.GetLeader] a répondu favorablement à notre demande d'entamer des négociations avec l'opposition sur l'apartheid. Compte tenu de la dégradation de la situation sécuritaire dans la région, il s'agit là, espérons-le, d'un pas positif vers l'instauration d'une paix et d'une stabilité durables. Pretoria a indiqué que l'objectif de sa nouvelle stratégie de négociation serait d'engager des pourparlers avec le Congrès national africain (ANC) concernant les conditions que les deux parties devraient remplir avant d'entamer des négociations sérieuses sur l'avenir du pays. Bien que les services de renseignement confirment les contacts du gouvernement actuel avec l'ANC, la présence de radicaux au sein du gouvernement et de l'opposition soulève des inquiétudes quant à la viabilité à long terme de ce plan. Le risque de violences de masse et de bouleversements sociaux demeure, et la planification d'urgence doit être maintenue au cas où la situation en Afrique du Sud dégénérerait en guerre civile. Une attention particulière doit également être portée aux bantoustans et au KwaZulu, compte tenu de leur mécontentement manifeste face à une Afrique du Sud unifiée et réunifiée. L'opposition et les tensions risquent également de provenir de ces entités. Globalement, c'est un bon début pour espérer la fin de l'apartheid, mais de nombreux écueils, problèmes et préoccupations restent à venir."
 SAF_USA88.5.d:0 "Malheureusement, l'Afrique du Sud a refusé d'entamer des négociations sur l'apartheid avec notre gouvernement. Pretoria a fait valoir que toute modification devait être décidée par le gouvernement sud-africain, en toute indépendance. L'Afrique du Sud a également souligné que le refus de la communauté internationale et du Congrès national africain (ANC) de faire des compromis sur le statut des gouvernements régionaux, l'autonomie et les « banutstans » constituait un obstacle majeur à toute négociation constructive dans un avenir proche. Cette nouvelle position intransigeante de l'Afrique du Sud intervient peu après la montée en puissance du Parti conservateur (KP) d'Andries Treurnicht dans les sondages en vue des prochaines élections sud-africaines. Le KP a rompu avec le Parti national en raison du refus du gouvernement de s'engager dans des réformes, ce qui représente un nouvel obstacle potentiel à la poursuite des réformes et des négociations."
 SAF_USA88.6.d:0 "Les négociations entre le gouvernement sud-africain, sous la direction de [SAF.GetLeader], progressent et le Congrès national africain (ANC) avance bien. Plusieurs partis ont convenu de créer une organisation multipartite, la Convention pour une Afrique du Sud démocratique (CODESA), afin de discuter des réformes. Il s'agit d'une étape majeure vers une paix et des réformes durables, mais des défis subsistent. Des factions radicales des deux camps refusent de participer à la CODESA, notamment le Parti nationaliste héroïque (HNP), le Parti conservateur (KP), le Congrès panafricain (PAC) et l'Organisation du peuple azanien (AZAPO). Des membres du Parti de la liberté Inkatha boycottent également la CODESA, suite au refus d'admettre une délégation distincte pour le monarque zoulou. Outre ces boycotts et les répercussions politiques potentielles au sein du gouvernement sud-africain, un autre point litigieux des négociations réside dans le fait que, si les partis se sont entendus sur la réunification de l'Afrique du Sud, les modalités de cette réunification et la nature de l'État réformé demeurent des sujets de discorde importants. L'avenir nous dira comment cela évoluera, mais pour l'instant, il y a de l'espoir pour un règlement pacifique en Afrique du Sud."
 SAF_USA88.7.d:0 "Face aux progrès croissants de nos négociations avec les États-Unis, Washington a annoncé un allègement progressif des sanctions imposées à notre économie. Si cette nouvelle est excellente pour faire face au ralentissement économique et contribuer potentiellement à apaiser les tensions économiques, elle a néanmoins exacerbé le mécontentement grandissant des conservateurs au sein de notre gouvernement, opposés à nos réformes actuelles. Il sera crucial de surveiller de près nos forces armées et nos services de renseignement afin d'éviter tout risque de coup d'État de la part de ces conservateurs. Heureusement, cet allègement des sanctions devrait témoigner de l'engagement des pays occidentaux à respecter leurs engagements et nous permettre de nous appuyer sur cette reconnaissance pour encourager la poursuite des réformes."
 SAF_USA88.8.d:0 "Bien que les négociations avec l'Afrique du Sud aient progressé, d'importants obstacles subsistent avant qu'il ne soit judicieux d'assouplir les sanctions ciblées imposées aux principaux responsables et entreprises sud-africains. Si certains détracteurs et membres du gouvernement sud-africain affirmeront inévitablement qu'il s'agit d'une violation des négociations et de la politique déclarée, les ministères des Affaires étrangères et du Trésor ont été chargés d'examiner quelles sanctions économiques plus larges devraient être levées afin de réduire l'impact économique sur la population sud-africaine, tout en maintenant la pression sur la classe dirigeante sud-africaine par le maintien des sanctions personnelles à son encontre. Idéalement, cela permettrait de maintenir la pression sur le gouvernement en maintenant les sanctions personnelles tout en témoignant de la bonne foi des États-Unis par un allègement de certaines sanctions économiques. Globalement, les négociations avec l'Afrique du Sud progressent bien, mais des progrès supplémentaires sont nécessaires avant d'envisager un assouplissement des sanctions ciblées imposées aux principaux responsables gouvernementaux."
 SAF_USA88.9.d:0 "LE PROGRAMME D'ARMES DE MORT DE L'AFRIQUE DU SUD : PERSPECTIVES ET RECOMMANDATIONS\nBureau Afrique du Sud, Bureau des Affaires Africaines\nSECRET/NOFORN\n\nAu cours de la dernière décennie, diverses rumeurs ont circulé concernant un potentiel programme nucléaire sud-africain. Malheureusement, nous pouvons confirmer l'existence d'un programme nucléaire avancé en Afrique du Sud, et il est probable que plusieurs bombes soient assemblées et opérationnelles. De plus, l'armée sud-africaine possède divers agents chimiques et biologiques dans son arsenal. Bien que nous puissions simplement ignorer ce programme, les risques liés à l'utilisation de l'un de ces agents pourraient facilement compromettre nos efforts dans la région. Par ailleurs, certains éléments indiquent l'existence d'un plan d'urgence prévoyant un essai nucléaire en cas de guerre civile, afin de prévenir toute ingérence étrangère. Compte tenu de ces informations, nous devrions à tout le moins exiger de l'Afrique du Sud le démantèlement de son programme d'armes de destruction massive."
 SAF_USA88.10.d:0 "L'ambassade américaine a transmis plus tôt dans la journée un message nous demandant de mettre fin à notre programme d'armes de destruction massive, et plus particulièrement de démanteler notre programme d'armement nucléaire. Bien que ce programme soit resté top secret au sein de notre gouvernement, les Américains en ont malheureusement désormais connaissance. Cette demande nous place face à deux options assez évidentes : d'une part, nous pourrions mettre fin au programme et tenter d'utiliser cet argument pour obtenir de l'aide ou un allègement des sanctions, mais cela réduirait nos options de repli en cas de guerre civile potentielle. D'autre part, étant donné que les sanctions internationales constituent déjà un problème majeur, nous pourrions poursuivre le programme, car l'utilisation de la bombe nucléaire représente notre ultime recours pour empêcher la poursuite d'une guerre civile. Chaque option présente des inconvénients potentiellement majeurs. Comment devrions-nous choisir ?"
 SAF_USA88.11.d:0 "Dans un communiqué de Pretoria, le gouvernement sud-africain a annoncé la fin de ses différents programmes d'armes de destruction massive et le démantèlement des engins nucléaires déjà assemblés. Il a toutefois reconnu que cette décision le privait de ses principaux plans d'urgence en cas de conflit racial et a sollicité, à titre privé, un soutien en cas de guerre civile généralisée, ainsi qu'un partage de renseignements ou un allègement des sanctions en échange du démantèlement de son programme nucléaire. Quoi qu'il en soit, Pretoria s'est engagée à démanteler ses engins nucléaires et à abandonner son plan d'urgence initial, limitant ainsi les risques d'un scénario catastrophe en Afrique du Sud qui entraînerait inévitablement le monde dans un conflit en Afrique australe."
 SAF_USA88.12.d:0 "Dans un communiqué de Pretoria, le gouvernement sud-africain a indiqué qu'il ne mettrait pas fin à ses différents programmes d'armes de destruction massive. Pretoria justifie ce programme en affirmant qu'il constitue un moyen de dissuasion nécessaire contre toute intervention étrangère en cas de troubles civils et que les agents chimiques et biologiques représentent un niveau de défense indispensable face à une éventuelle invasion de puissances voisines, notamment compte tenu du conflit frontalier en cours en Afrique du Sud-Ouest. Bien que peu surprenant, ce refus est très préoccupant, d'autant plus que le risque de troubles civils ne cesse de croître en raison du maintien du régime de l'apartheid et de la minorité démocrate. Pour compliquer davantage la situation, diverses interceptions en provenance d'Israël laissent entendre qu'Israël est également impliqué dans cette affaire sordide et collabore avec l'Afrique du Sud en matière de développement d'armes nucléaires. Compte tenu de ces éléments, il serait imprudent de divulguer l'existence de ce programme nucléaire aux médias afin de faire pression sur le gouvernement sud-africain ; pour l'instant, il nous faut simplement espérer que la situation évolue favorablement."
 SAF_USA88.13.d:0 "Dans nos efforts constants pour contenir et faire reculer le communisme en Afrique australe, notre principal collaborateur demeure l'Afrique du Sud. Malheureusement, la politique d'apartheid et le maintien d'un régime minoritaire en Afrique du Sud nuisent à notre lutte anticommuniste commune. Dans ce contexte, une façon de minimiser les critiques à l'égard de ce régime serait de promouvoir l'autonomie dans différentes régions d'Afrique du Sud. Au cours de la dernière décennie, l'Afrique du Sud a prétendument accordé une forme d'indépendance à quatre de ces régions : les bantoustans de Ciskei, de Venda, de Transkei et de Bophuthatswana. Cependant, aucun pays hors d'Afrique du Sud n'a reconnu l'indépendance de ces États. En agissant ainsi, nous pourrions encourager cette démarche et inciter d'autres États à reconnaître ces quatre États, afin de légitimer davantage le gouvernement sud-africain. En revanche, une telle action risque d'aliéner une grande partie de la population sud-africaine et sera certainement critiquée par le mouvement anti-apartheid."
 SAF_USA88.14.d:0 "Lors d'une conférence de presse largement condamnée aujourd'hui, le président américain [USA.GetLeader] a annoncé que les États-Unis reconnaîtraient le Transkei, le Bophuthatswana, le Venda et le Ciskei comme des nations indépendantes. En dehors de l'Afrique du Sud, les États-Unis seraient le premier pays à reconnaître ces « bantoustans ». Pretoria a salué cette annonce et a appelé les autres nations à suivre l'exemple de Washington en reconnaissant ces États. Ailleurs, la réaction a été majoritairement négative. L'évêque Desmond Tutu, figure emblématique de la lutte contre l'apartheid, a dénoncé cette annonce comme une trahison de la décence et de l'humanité. Au niveau national, le député Ron Dellums (démocrate de Californie) a déposé une proposition de loi visant à annuler cette reconnaissance, qui recueille rapidement des soutiens à la Chambre des représentants. Les sondages d'opinion réalisés ce week-end montrent que l'opinion publique américaine désapprouve largement cette reconnaissance. L'impact de cette décision sur les prochaines élections présidentielles reste à déterminer."
 SAF_USA88.15.d:0 "Compte tenu de notre récent virage diplomatique vers une position plus ouvertement pro-sud-africaine, le moment est peut-être idéal pour envisager un assouplissement des sanctions économiques imposées à l'Afrique du Sud. En œuvrant à la levée de ces sanctions, nous pouvons réaffirmer notre engagement envers le gouvernement sud-africain et démontrer que ces sanctions étaient inefficaces et nuisaient davantage à la population qu'aux dirigeants du pays, afin de détourner l'attention des critiques de l'opposition intérieure. Bien que cette mesure soit certainement impopulaire auprès du grand public américain, le mal est déjà fait suite aux précédentes déclarations de soutien à l'Afrique du Sud, appuyées par divers groupes anticommunistes tels que la Heritage Foundation. De plus, l'allègement des sanctions devrait contribuer à stabiliser l'Afrique du Sud et dynamiser son économie et son complexe militaro-industriel."
 SAF_USA88.16.d:0 "Nous avons appris aujourd'hui que le gouvernement américain envisageait d'alléger les sanctions imposées à notre pays. Cette décision fait suite au récent changement de cap de la politique étrangère américaine, qui abandonne l'approche de « l'engagement constructif » au profit d'une vision plus positive de notre gouvernement, compte tenu de notre contribution à la lutte anticommuniste. Cet allègement des sanctions devrait être un atout majeur pour notre économie et contribuer à atténuer l'instabilité qui frappe actuellement le pays. En définitive, ce soutien américain plus ouvert ne se traduit pas seulement par un allègement des sanctions américaines, mais réduit de fait l'efficacité de la plupart des sanctions occidentales, Washington s'efforçant désormais de saper l'effort international en matière de sanctions, tout en facilitant notre accès aux capitaux et aux ressources étrangères."
 SAF_USA88.17.d:0 "L'ambassadeur américain nous a informés aujourd'hui que les États-Unis autoriseront de nouveau les ventes d'armes aux États-Unis, annulant ainsi les décisions des administrations précédentes qui bloquaient ces ventes. Bien que les prix et d'éventuels tarifs préférentiels restent à déterminer, il s'agit néanmoins d'une étape majeure vers un renforcement des relations avec les États-Unis et une collaboration accrue dans nos efforts conjoints pour endiguer le communisme en Afrique australe. En particulier, la possibilité d'acquérir du matériel et des équipements généraux pour réapprovisionner et entretenir notre force aérienne constituera un atout essentiel pour nos opérations en Angola et en Afrique du Sud-Ouest. Nous espérons que l'assouplissement des sanctions américaines et la reprise des ventes d'armes inciteront les puissances occidentales à soutenir notre gouvernement."
 USA_SAF_Collapse.0.d:0 "EFFONDRE EN AFRIQUE DU SUD : PERSPECTIVES ET RECOMMANDATIONS\nService Afrique du Sud, Bureau des affaires africaines\nSECRET/NOFORN\n\nMalgré tous nos efforts pour stabiliser la situation, celle-ci en Afrique du Sud est au bord de l’effondrement. Face à l’imminence d’une guerre civile, il est crucial de déterminer la marche à suivre. Compte tenu de nos liens passés avec le gouvernement sud-africain, une option serait de soutenir les vestiges de l’ancien gouvernement. Bien que ce dernier représente la faction la plus anticommuniste du conflit, une telle initiative serait extrêmement controversée au niveau national et très impopulaire sur la scène internationale, compte tenu de la réputation de cette faction. Une autre option consisterait à solliciter l’aide du Congrès national africain (ANC) afin d’obtenir des garanties de marginalisation des communistes au sein du mouvement, en échange d’un soutien matériel. Cette solution pourrait également susciter des controverses politiques internes, mais serait plus acceptable pour la communauté internationale. La dernière option serait de déclarer la neutralité dans le conflit et peut-être de chercher à établir une zone de sécurité dans le pays afin de protéger les intérêts civils. Quoi qu'il en soit, la perte de stabilité et l'émergence d'une force anticommuniste importante en Afrique australe auront probablement des conséquences désastreuses sur nos efforts pour contenir le communisme dans la région."
 USA_SAF_Collapse.1.d:0 "Dans un communiqué de presse publié vendredi soir, le département d'État américain a annoncé que les États-Unis resteraient neutres face à l'escalade du conflit en Afrique du Sud. Tout en niant prendre parti pour l'une ou l'autre des factions principales en guerre civile, le communiqué a condamné l'implication cubaine et soviétique dans le conflit et a appelé à prendre des mesures pour garantir la distribution efficace de l'aide humanitaire aux personnes déplacées. Le communiqué a également indiqué que Washington soutiendrait la création d'une zone de sécurité pour les civils et les travailleurs humanitaires et a laissé entendre qu'une telle mesure pourrait être envisagée lors d'une prochaine session des Nations Unies. Ce communiqué a jeté le doute sur un éventuel soutien américain ouvert à l'ancien gouvernement sud-africain que Washington avait soutenu pendant des années avant le début du conflit."
 USA_SAF_Collapse.2.d:0 "Bien que les États-Unis aient déclaré leur neutralité dans la guerre civile sud-africaine, les déplacements massifs de population et les souffrances infligées aux civils sud-africains par ce conflit ont suscité des appels à l'aide humanitaire. Cependant, compte tenu des multiples factions et des ingérences géopolitiques, l'acheminement de cette aide est complexe. C'est pourquoi le Département d'État propose de coordonner l'aide avec divers alliés, notamment Israël et le Royaume-Uni, ainsi qu'avec différentes organisations humanitaires, au cas où les Nations Unies seraient incapables d'établir un corridor humanitaire dans ce pays ravagé par la guerre. Par ailleurs, la dimension raciale du conflit crée un contexte propice à une crise des réfugiés. D'un côté, la solution moralement juste serait peut-être d'autoriser la réinstallation des réfugiés aux États-Unis. Toutefois, compte tenu de la réaction de l'opinion publique américaine à l'accueil des réfugiés cubains au début de la décennie, cette décision pourrait s'avérer politiquement délicate. D'un autre côté, refuser l'entrée aux réfugiés aux États-Unis nuirait à notre image internationale."
 USA_SAF_Collapse.3.d:0 "Alors que nous entamons les préparatifs d'une intervention dans la guerre civile sud-africaine, plusieurs étapes s'imposent. Outre la question évidente de la coordination des ressources militaires et logistiques, la nature du conflit exige une préparation adéquate de l'opinion publique américaine à une guerre contre les forces de l'ancien gouvernement. Heureusement, les sondages montrent qu'une majorité d'Américains seront probablement favorables à une intervention militaire dans la région. Il nous faudra néanmoins préparer le public aux réalités du conflit et prendre des mesures pour contrer les tentatives de l'extrême droite, notamment des groupes nationalistes blancs, qui cherchent à diffuser de la désinformation ou à fomenter des attentats terroristes potentiels contre le gouvernement ou les minorités raciales aux États-Unis. Compte tenu de la forte opposition internationale à l'ancien régime sud-africain, la constitution d'une coalition internationale en faveur de l'intervention doit être une priorité absolue. En revanche, étant donné la forte influence de la gauche et des communistes au sein de l'ANC, nous devrons envisager des stratégies pour minimiser l'influence de l'extrême gauche dans l'Afrique du Sud d'après-guerre."
 USA_SAF_Collapse.4.d:0 "Alors que nous entamons les préparatifs d'une intervention dans la guerre civile sud-africaine, plusieurs étapes s'imposent. Outre la question évidente de la coordination des ressources militaires et logistiques, la nature du conflit exige de préparer suffisamment l'opinion publique américaine à une guerre contre les forces du Congrès national africain (ANC). Compte tenu de la forte opposition populaire, il sera indispensable de médiatiser les atrocités commises contre les civils blancs en Afrique du Sud et de mener une guerre de propagande contre l'ANC et le mouvement anti-apartheid. Étant donné que la plupart de nos alliés traditionnels, à l'exception peut-être du Royaume-Uni, sont peu susceptibles de soutenir notre intervention, il sera également nécessaire de convaincre la communauté internationale du bien-fondé de notre cause. Une piste à explorer serait de contacter Israël et nos alliés d'Amérique latine afin d'obtenir un soutien militaire et diplomatique pour l'opération à venir. Quoi qu'il en soit, la décision d'intervenir en Afrique du Sud constituera un moment décisif de cette présidence."
 USA_SAF_Collapse.5.d:0 "INTERVENTION EN AFRIQUE DU SUD : PERSPECTIVES ET RECOMMANDATIONS\nService Afrique du Sud, Bureau des affaires africaines\nSECRET/NOFORN\n\nLa situation en Afrique du Sud continue de se détériorer et le gouvernement a fait savoir en interne son intention d'intervenir dans le conflit. Trois options s'offrent à nous pour intervenir. Premièrement, nous pouvons choisir de ne prendre parti pour aucun camp et tenter d'établir une zone de sécurité dans un premier temps, puis utiliser cette zone pour faire pression sur les deux parties afin d'obtenir un cessez-le-feu, dans l'optique d'une solution diplomatique au conflit en cours. Bien que cette option soit la moins coûteuse, elle sera certainement la plus difficile à mettre en œuvre et nécessitera la coopération des deux parties en Afrique du Sud, ainsi que celle de diverses puissances étrangères cherchant à influencer la région. La deuxième option consisterait à intervenir au nom du Congrès national africain (ANC). Le principal problème de cette voie est que l'ANC est fortement influencé par les courants communistes et d'extrême gauche, et contenir cette influence représentera un défi de taille, sans parler des protestations potentielles de certains groupes marginaux de la politique américaine. La dernière option serait d'intervenir au nom de l'ancien gouvernement sud-africain. Bien que ce dernier soit de loin le plus favorable à nos intérêts, il serait difficile de justifier une telle intervention auprès du grand public américain, et a fortiori auprès de la communauté internationale. Quelle devrait être la marche à suivre ?"
 USA_SAF_Collapse.6.d:0 "Après mûre réflexion, l'administration a fait part de son intention d'intervenir en Afrique du Sud aux côtés de l'ancien gouvernement. Cela étant dit, cette intervention s'annonce complexe compte tenu de notre manque d'alliés régionaux et du nombre de pays hostiles à proximité du conflit. Nous devrons donc établir une base logistique en collaboration avec les forces gouvernementales sud-africaines, probablement dans la province du Cap. Autre complication : la forte probabilité de la présence de conseillers cubains et issus des pays de l'ancien bloc de l'Est au sein des forces de l'ANC, ce qui soulève de vives inquiétudes quant à un possible conflit armé avec ces nations et à un incident international. Compte tenu de l'intervention cubaine en Angola, il est fort probable que les forces cubaines participent activement aux combats en Afrique du Sud.\n\nSur le plan politique, l'opinion publique américaine semble globalement très opposée à une telle intervention. Cependant, il est peu probable que le Congrès l'approuve lors d'un vote public. Nous devrions donc chercher à contourner autant que possible la loi sur les pouvoirs de guerre avant de consulter le Congrès. Autre préoccupation intérieure : cette intervention risque d'attiser la colère des nationalistes noirs et pourrait entraîner une recrudescence des activités terroristes."
 USA_SAF_Collapse.7.d:0 "Heureusement, l'ambassadeur américain a transmis la décision de l'administration d'intervenir pleinement dans la guerre civile en faveur de notre cause. Bien que nous aurions préféré un soutien plus précoce ou une collaboration plus étroite afin d'éviter cette situation, cette nouvelle reste encourageante pour notre population éprouvée. Avant l'intervention, nous devons renforcer la sécurité des ports que nous contrôlons actuellement afin de faciliter l'arrivée des soldats et du matériel américains.\n\nEspérons que cela marquera un tournant dans la guerre civile et mènera à une victoire rapide et décisive. Cela dit, l'intervention américaine aura certainement un coût : nous serons probablement contraints d'accepter certaines réformes dans le contexte de l'après-guerre, ainsi que de nous soumettre aux exigences des intérêts économiques américains. Les tenants d'une ligne dure au sein de l'administration s'inquiètent du manque d'indépendance potentiel dont nous bénéficierons après la guerre dans une Afrique du Sud réunifiée et doivent donc être surveillés afin de limiter les risques de troubles internes."
 USA_SAF_Collapse.8.d:0 "Lors d'une conférence de presse virulente tenue plus tôt dans la journée, le président américain [USA.GetLeader] a annoncé l'intervention des États-Unis en Afrique du Sud aux côtés des forces de l'ancien gouvernement. Cette intervention vise à empêcher le Congrès national africain (ANC) de prendre le pouvoir en Afrique du Sud ou à dissuader les factions les plus radicales de perpétrer un génocide contre la population blanche. Cette annonce a suscité une vive controverse au sein de la communauté internationale et de l'opinion publique américaine. Les sondages d'opinion sont largement défavorables à une intervention, en particulier en faveur des forces pro-apartheid, et le déploiement de forces par le président sans l'approbation du Congrès a également provoqué de fortes réticences de la part de ce dernier. Parmi les réactions étrangères, on note notamment la déclaration de Cuba, qui s'est engagée à étendre son intervention en Afrique du Sud pour lutter contre « l'impérialisme yankee »."
 USA_SAF_Collapse.9.d:0 "Après mûre réflexion, l'administration a fait part de son intention d'intervenir en Afrique du Sud au nom du Congrès national africain (ANC). Cela étant dit, cette intervention s'annonce complexe compte tenu de notre manque d'alliés régionaux et du nombre de pays hostiles à proximité du conflit. Une autre difficulté réside dans la forte probabilité de la présence de conseillers cubains et issus du bloc de l'Est au sein des forces de l'ANC. Nous devrons donc activement nous efforcer de contenir l'influence communiste étrangère au sein de l'ANC et veiller à ne pas provoquer d'incident international avec les pays communistes.\n\nSur le plan politique, l'opinion publique américaine semble globalement favorable à une telle intervention. Toutefois, il convient d'envisager un dialogue approfondi avec le Congrès afin de garantir la pleine légalité de la mesure et d'éviter les accusations des opposants à l'intervention imminente. Autre sujet de préoccupation sur le plan intérieur : l'intervention risque d'attiser la colère des suprémacistes blancs et pourrait entraîner une recrudescence des activités terroristes."
 USA_SAF_Collapse.10.d:0 "Nouvelle surprenante de Washington : le gouvernement américain nous a informés de son intervention en Afrique du Sud en notre faveur. Il s’agira vraisemblablement d’un tournant décisif dans la guerre civile. Sans le soutien occidental, les forces de l’ancien gouvernement devraient être facilement surpassées en nombre et en armement. De plus, la médiation américaine devrait faciliter la maîtrise des « bantoustans » rebelles qui ont conservé leur indépendance jusqu’à présent.\n\nSi la majorité de nos membres se réjouit de cette nouvelle, les plus radicaux au sein de la direction s’inquiètent des implications d’une coopération avec Washington, notamment après la guerre. Par ailleurs, des rumeurs circulent selon lesquelles nos alliés cubains pourraient commencer à se retirer dès qu’ils auront été informés de la situation. Enfin, nous devons également réfléchir aux conséquences de cette intervention pour l’Afrique du Sud d’après-guerre et à son impact sur notre direction dans les années à venir."
 USA_SAF_Collapse.11.d:0 "Dans une allocution télévisée plus tôt dans la journée, le président américain [USA.GetLeader] a annoncé l'intervention des États-Unis dans la guerre civile sud-africaine en faveur du Congrès national africain (ANC). Le président [USA.GetLeader] a affirmé que cette intervention était moralement justifiée et que l'Amérique devait œuvrer à l'instauration d'une démocratie multiraciale en Afrique du Sud. Cette intervention a été bien accueillie par l'opinion publique américaine, une large majorité approuvant la mesure. Le mouvement international anti-apartheid a salué cette décision, la considérant comme une mesure nécessaire pour endiguer le bain de sang en Afrique du Sud. De leur côté, les partisans de l'apartheid ont dénoncé cette annonce comme une trahison de la race blanche."
 USA_SAF_Collapse.12.d:0 "Après mûre réflexion, l'administration a décidé que la meilleure voie à suivre en Afrique du Sud serait de tenter d'établir une zone de sécurité humanitaire dans le pays, comme première étape vers une solution diplomatique à la guerre civile en cours. Ce choix stratégique ne sera toutefois pas sans difficultés. Nous devrons négocier activement avec les deux principales factions en conflit afin d'obtenir un accord sur le respect de cette zone de sécurité et ainsi limiter les risques d'escalade. Sans l'adhésion des deux parties, il sera impossible d'établir un corridor humanitaire dans le pays.\n\nUn autre défi majeur à cette entreprise réside dans les autres nations impliquées dans la guerre civile. Compte tenu du soutien important apporté par l'Union soviétique et Cuba au Congrès national africain (ANC), à l'Organisation du peuple du Sud-Ouest africain (SWAPO) et au Mouvement populaire de libération de l'Angola (MPLA), nous devrons également veiller à ne pas provoquer d'incident international en nous engageant avec leurs forces participant au conflit. Idéalement, une fois la zone de sécurité établie, nous pourrons poursuivre le dialogue avec toutes les factions et tenter de parvenir à une solution diplomatique au conflit actuel."
 USA_SAF_Collapse.13.d:0 "Nous avons reçu aujourd'hui des communications de diplomates américains concernant la création potentielle d'une zone de sécurité humanitaire sur notre territoire. Si l'établissement d'une telle zone et d'un corridor humanitaire contribuerait certainement à réduire le nombre de morts et les dommages à long terme de la guerre civile, il détournerait également l'attention de notre effort de guerre et pourrait compliquer nos offensives à venir. De plus, des membres plus radicaux de notre cause se sont opposés à cette proposition, la dénonçant comme un complot impérialiste visant à renforcer les forces progouvernementales ou à imposer un règlement négocié du conflit. La présence de conseillers cubains et soviétiques au sein de nos forces, qui pourraient se montrer réticents à coopérer avec les Américains, complique encore la situation. Quelle voie devons-nous suivre ?"
 USA_SAF_Collapse.14.d:0 "Dans un développement positif, le Congrès national africain (ANC) a approuvé notre appel à la création d'une zone de sécurité humanitaire en Afrique du Sud. Bien que nous devions encore finaliser les plans et poursuivre nos efforts de sensibilisation, il s'agit d'une étape essentielle vers l'établissement d'une telle zone et la recherche active d'une solution au conflit. Cela étant dit, des inquiétudes persistent quant à la manière dont les factions les plus radicales au sein de l'ANC accueilleront cette zone de sécurité. Selon nos renseignements, plusieurs membres de l'ANC s'opposaient à cette zone, craignant qu'elle ne soit utilisée par l'opposition pour se procurer des armes supplémentaires ou bloquer ses voies d'avancée. Espérons que cette décision restera comme un tournant dans le conflit, un moment charnière vers la civilité et une paix durable."
 USA_SAF_Collapse.15.d:0 "Malheureusement, le Congrès national africain (ANC) a rejeté notre demande d'établissement d'une zone de sécurité. L'ANC a déclaré qu'il s'agissait simplement d'un moyen de ralentir sa progression et de donner aux forces de l'ancien gouvernement le temps de se réarmer et de reprendre l'initiative stratégique. Sans l'accord des principales factions impliquées dans la guerre civile en cours, il sera impossible d'établir une zone de sécurité dans la région sans s'engager davantage dans le conflit, ce qui serait assurément impopulaire auprès de la population et aurait des difficultés à être approuvé par le Congrès actuel. Cela étant dit, nous devrions néanmoins envisager d'accroître l'aide humanitaire vers la zone de conflit et de répondre à la crise des réfugiés."
 USA_SAF_Collapse.16.d:0 "Plus tôt dans la journée, nous avons reçu des communications de diplomates américains concernant la création potentielle d'une zone de sécurité humanitaire sur le territoire national. Si l'établissement d'une telle zone et d'un corridor humanitaire contribuerait certainement à réduire le nombre de morts et les dommages à long terme de la guerre civile, il détournerait également l'attention de notre effort de guerre et pourrait compliquer nos offensives à venir. De plus, des membres plus radicaux de notre cause se sont opposés à cette proposition, la dénonçant comme un complot visant à renforcer les forces d'opposition ou à imposer un règlement négocié du conflit. La présence de conseillers cubains et soviétiques au sein de l'opposition complique encore la situation : quelles garanties avons-nous qu'ils n'utiliseront pas cette zone de sécurité pour poursuivre leurs livraisons d'armes aux forces de l'ANC ? Quelle voie devons-nous suivre ?"
 USA_SAF_Collapse.17.d:0 "Dans un développement positif, le gouvernement sud-africain a approuvé notre demande de création d'une zone de sécurité humanitaire en Afrique du Sud. Bien que nous devions encore finaliser les plans, poursuivre nos efforts de sensibilisation et régler les détails logistiques, il s'agit d'une étape essentielle vers l'établissement d'une telle zone et la recherche active d'une solution au conflit. Cela dit, des inquiétudes persistent quant à la manière dont les factions les plus radicales au sein des forces progouvernementales appréhenderont cette zone. Selon nos renseignements, plusieurs membres de milices afrikaners s'opposent à la création de cette zone, craignant qu'elle ne soit utilisée par l'opposition pour se procurer des armes supplémentaires ou bloquer ses voies d'avancée. Espérons que cette décision restera comme un tournant dans le conflit, un moment charnière vers la civilité et une paix durable."
 USA_SAF_Collapse.18.d:0 "Malheureusement, l'Afrique du Sud a répondu négativement à notre demande d'établissement d'une zone de sécurité. L'ancien gouvernement a déclaré qu'il s'agissait simplement d'un moyen de ralentir sa progression et de donner aux forces gouvernementales le temps de se réarmer et de reprendre l'initiative stratégique. Sans l'accord des principales factions impliquées dans la guerre civile en cours, il sera impossible d'établir une zone de sécurité dans la région sans s'engager davantage dans le conflit, ce qui serait assurément impopulaire auprès de la population et aurait des difficultés à être approuvé par le Congrès actuel. Cela étant dit, nous devrions néanmoins envisager d'accroître l'aide humanitaire vers la zone de conflit et de répondre à la crise des réfugiés."
 USA_SAF_Collapse.19.d:0 "Dans une allocution télévisée, le président américain [USA.GetLeader] a annoncé que les États-Unis allaient établir une zone de sécurité en Afrique du Sud, compte tenu de la guerre civile qui ravage le pays, dans le but de négocier un cessez-le-feu. Cette décision fait suite à de longues négociations avec le Congrès national africain (ANC) et les forces gouvernementales d'opposition. Il est à noter qu'aucune négociation sérieuse n'a eu lieu entre les différentes factions mineures impliquées dans le conflit et les États-Unis, ce qui a suscité des inquiétudes au sein de la communauté internationale. Washington a répondu à ces inquiétudes en faisant valoir que les autres factions se concentraient principalement sur la préservation de leur territoire et non sur des actions offensives, et qu'elles pourraient donc être prises en compte ultérieurement."
 USA_SAF_Collapse.20.d:0 "Lors d'une session houleuse des Nations Unies à New York, la proposition américaine d'établir une zone de sécurité en Afrique du Sud, en pleine guerre civile, a été rejetée par les pays pro-ANC (Congrès national africain). Les détracteurs de la proposition ont fait valoir que cette mesure aurait entravé la progression de la branche armée de l'ANC, l'uMkhonto we Sizwe, contre ses différents ennemis. La question du traitement des factions mineures impliquées dans le conflit, notamment les bantoustans se déclarant États souverains et indépendants, ainsi que le nouvel État du KwaZulu, récemment proclamé, a encore compliqué la situation. Bien que n'ayant pas soutenu directement l'ancien gouvernement, ces États régionaux autoproclamés se sont clairement positionnés en opposition à l'ANC pour diverses raisons, au grand dam de ce parti et de ses alliés géopolitiques."
 USA_SAF_Collapse.21.d:0 "Dans une allocution télévisée en prime time prononcée plus tôt dans la journée, le Président a annoncé un cessez-le-feu en Afrique du Sud, accepté par toutes les factions importantes impliquées dans le conflit actuel. Cette annonce fait suite à des mois d'efforts diplomatiques et humanitaires soutenus de la part de notre gouvernement, notamment la mise en place d'un corridor humanitaire et d'une zone de sécurité dans ce pays en proie à la tourmente. Bien que des difficultés subsistent quant à la négociation d'une véritable résolution du conflit, il s'agit d'une étape majeure vers la paix et d'une justification de la politique du Président [USA.GetLeader] en Afrique du Sud, politique qui avait été vivement critiquée de part et d'autre pour sa prudence excessive dans la gestion du conflit. \n\nLes sondages d'opinion indiquent une forte hausse de la popularité du gouvernement actuel suite à cette annonce. Si cela débouche sur un accord de paix négocié, ce sera assurément un moment historique pour consolider l'héritage du Président à long terme. Cela étant dit, d'importants problèmes restent à résoudre dans la région, notamment l'implication des forces soviétiques et cubaines, la gestion des différents acteurs mineurs du conflit et la recherche d'une solution acceptable tant pour le Congrès national africain que pour l'ancien gouvernement."
 USA_SAF_Collapse.22.d:0 "Dans une allocution télévisée en prime time, le président américain [USA.GetLeader] a annoncé la fin de la guerre civile sud-africaine et le succès de l'intervention américaine dans le conflit. Si la victoire de nos forces restera à jamais un accomplissement majeur pour notre administration, la suite sera tout aussi cruciale. Il nous appartient désormais de déterminer qui dirigera le gouvernement intérimaire et de mener des négociations entre les différentes parties afin de garantir une paix durable dans la région. Suite à la victoire du Congrès national africain (ANC), nous devrons veiller à ce que l'aile modérée de l'ANC l'emporte, tout en recherchant des personnalités blanches modérées issues de l'ancienne classe dirigeante, disposées à collaborer avec l'ANC. Par ailleurs, des négociations devront également être engagées avec les différentes puissances régionales, telles que les anciens bantoustans et le KwaZulu-Natal."
 USA_SAF_Collapse.23.d:0 "Dans une allocution télévisée en prime time, le président [USA.GetLeader] a annoncé la fin de la guerre civile sud-africaine et le succès de l'intervention américaine dans le conflit. Si la victoire de nos forces restera à jamais un accomplissement majeur pour notre administration, la suite sera tout aussi cruciale. Il nous appartient désormais de déterminer qui dirigera le gouvernement intérimaire et de mener des négociations entre les différentes parties afin de garantir une paix durable dans la région. Suite à la victoire de l'ancien gouvernement et des milices alliées, nous devons nous efforcer de minimiser les réactions internationales négatives en recherchant des personnalités modérées au sein du Parti Nasionale et des autres partis d'opposition, disposées à collaborer avec le nouveau gouvernement. Par ailleurs, des négociations devront également être engagées avec les différentes puissances régionales, telles que les anciens bantoustans et le KwaZulu-Natal."
 USA_SAF_Collapse.24.d:0 "Avec le cessez-le-feu en vigueur en Afrique du Sud et nos troupes assurant la paix dans ce pays en proie à la tourmente, nous devons à présent déterminer la marche à suivre. Aucun des deux camps n'ayant réussi à prendre l'avantage, nos options sont plutôt limitées. L'option la plus « simple » serait peut-être de diviser l'Afrique du Sud selon les lignes de contrôle actuelles et les groupes ethniques, créant ainsi plusieurs États indépendants. Cela nécessiterait certainement des ressources supplémentaires pour le maintien de la paix dans les années à venir, mais serait probablement la solution la plus simple à court terme. Notre deuxième option serait de former un gouvernement de coalition intérimaire afin de définir plus précisément ce que sera une Afrique du Sud réunifiée. Cela dit, compte tenu des hostilités qui se sont développées depuis la guerre civile, cette option sera très difficile et risque de raviver le conflit dans les années à venir."
 USA_SAF_Collapse.25.d:0 "Suite au succès de notre intervention au nom du Congrès national africain (ANC), il est temps pour nous de décider de l'avenir de l'Afrique du Sud. Le Département d'État et la CIA nous offrent deux options principales. La première consiste à établir un gouvernement intérimaire dirigé par une coalition multiraciale modérée, peu liée à la guerre civile. La seconde est de parvenir à un fédéralisme de fait, avec une forte autonomie régionale fondée sur l'appartenance ethnique, en renforçant et en développant les « bantoustans », et en garantissant un bantoustan pour le KwaZulu ainsi qu'un autre pour les Sud-Africains blancs du Cap. Ces deux choix risquent d'être controversés et de créer des tensions en Afrique du Sud, tant au sein de la coalition que parmi les forces armées afrikaners restantes. En établissant une forte autonomie régionale et en garantissant les droits fondamentaux à tous les Sud-Africains sous une direction multiraciale, nous pourrons idéalement instaurer une paix durable en Afrique du Sud."
 USA_SAF_Collapse.26.d:0 "Notre intervention en faveur de l'ancien gouvernement ayant abouti, il est temps de décider de l'avenir de l'Afrique du Sud. Le Département d'État et la CIA nous offrent deux options principales. La première consiste à établir un gouvernement intérimaire dirigé par une ancienne personnalité politique non directement impliquée dans la guerre civile. La seconde vise à balkaniser le pays sur des bases ethniques en renforçant et en développant les « bantoustans » et en garantissant l'indépendance du KwaZulu. Concernant la première option, les analystes gouvernementaux soulignent la nécessité d'adopter une nouvelle constitution afin de rompre avec un passé controversé et d'orienter l'avenir vers une politique plus modérée, sans pour autant s'aliéner les partisans d'un État populaire (Volkstaat). Ces deux options impliqueront de gérer les vestiges des forces du Congrès national africain (ANC) ainsi que les autres milices de gauche qui continuent de combattre le gouvernement."
 USA_SAF_Collapse.27.d:0 "La mise en place d'un gouvernement intérimaire pour l'Afrique du Sud, compte tenu du cessez-le-feu, représente un défi de taille. Sachant que les figures de proue du Parti nationaliste ou du Congrès national africain risquent d'être impopulaires auprès des camps opposés, il nous faudra nous tourner vers les factions plus modérées et régionalistes pour trouver des leaders. Les analystes du Département d'État et des services de renseignement centraux ont finalisé un plan prévoyant que Mangosuthu Buthelezi, chef du Parti de la liberté Inkatha, accède à la présidence, tandis que Zach de Beer, chef du Parti démocrate et ancien chef du Parti fédéral progressiste, deviendrait Premier ministre. Si nous laissons à ces deux hommes le soin de s'entendre sur d'autres postes, notre administration estime que le ministère de la Défense doit être confié à une figure emblématique des anciennes forces armées afin de garantir la continuité et le professionnalisme. Nos analystes ont retenu le nom de l'ancien général Constand Viljoen. Bien que controversé, il devrait être en mesure de contenir les milices afrikaners qui aspirent à un État indépendant. Bien qu'elle ne soit en aucun cas la coalition la plus stable, elle représente peut-être notre meilleure chance d'établir une Afrique du Sud fonctionnelle au vu des dernières années."
 USA_SAF_Collapse.28.d:0 "Étant donné que les deux principaux camps de la guerre civile n'ont pas réussi à prendre l'avantage et que les États-Unis, avec une coalition internationale, ont imposé un cessez-le-feu, nous en sommes là. Washington a décidé qu'aucun des deux camps ne pouvait être digne de confiance pour exercer le pouvoir dans une Afrique du Sud d'après-guerre. Nous avons été informés que le nouveau gouvernement sera dirigé par Mangosuthu Buthelezi, chef du Parti de la liberté Inkatha, en tant que président, Zach de Beers, du Parti démocrate, en tant que Premier ministre, et la générale à la retraite Constand Viljoen en tant que ministre de la Défense. L'objectif de ce groupe est d'apaiser les principales factions du pays que Washington considère comme pro-occidentales ou potentiellement fiables sur le plan politique. Malheureusement, cela aura pour conséquence la marginalisation politique des deux principaux partis à la tête du conflit et conduira probablement au désarmement forcé des forces des deux camps dans un avenir proche."
 USA_SAF_Collapse.29.d:0 "Lors d'une conférence de presse à Pretoria plus tôt dans la journée, le nouveau gouvernement intérimaire sud-africain a été annoncé. Ce gouvernement, composé du président Mangosuthu Buthelezi, chef du Parti de la liberté Inkatha du KwaZulu, du Premier ministre Zach de Beer, chef du Parti démocratique, et du ministre de la Défense, le général à la retraite Constand Viljoen, présente un profil idéologique pour le moins hétéroclite. L'absence de représentants du Congrès national africain (ANC) et de l'ancien parti au pouvoir, le Parti nationaliste (Nasionale), au sein de ce groupe éclectique, a suscité des critiques de part et d'autre de l'échiquier politique. La communauté internationale a largement salué cette initiative, y voyant la mise en place d'un ensemble diversifié de dirigeants engagés pour une Afrique du Sud démocratique et unie, qui œuvreront à la réforme de l'État et à l'instauration d'une paix durable dans ce pays en proie aux troubles."
 USA_SAF_Collapse.30.d:0 "Notre soutien au Congrès national africain (ANC) pendant la guerre civile sud-africaine a porté ses fruits pour nos objectifs de politique étrangère. Maintenant que le cessez-le-feu est en vigueur et que les forces de l'ancien gouvernement sont désarmées, nous pouvons œuvrer à la mise en place d'un gouvernement intérimaire. L'Alliance tripartite compte diverses factions anti-américaines, notamment au sein du Parti communiste sud-africain (SACP) et du Congrès des syndicats sud-africains (COSATU). Tout au long du conflit, la CIA s'est activement employée à discréditer et à marginaliser les membres éminents du COSATU et du SACP, ainsi que les membres de l'ANC jugés trop à gauche. Notre dernier problème majeur concerne Nelson Mandela lui-même. La solution proposée par le Département d'État est de nommer le modéré Mangosuthu Buthelezi Premier ministre, tout en maintenant Nelson Mandela à la présidence avec des pouvoirs limités. L'objectif est d'aboutir à terme à une Afrique du Sud démocratique et multipartite et à la dissolution de l'Alliance tripartite entre l'ANC, le COSATU et le SACP."
 USA_SAF_Collapse.31.d:0 "La guerre étant désormais terminée et le désarmement général de l'opposition ayant commencé, il est nécessaire de stabiliser davantage la situation en établissant un nouveau gouvernement intérimaire en vue d'élections sous une nouvelle constitution. Compte tenu de la durée, des controverses et des effusions de sang de la guerre civile, le candidat idéal pour diriger ce nouveau gouvernement intérimaire sera probablement une personne n'ayant pas joué un rôle majeur pendant le conflit ni été liée à l'une des factions de gauche de l'Alliance tripartite. L'intervention américaine nous a contraints à des compromis avec certains partis régionalistes, notamment le Parti de la liberté Inkatha. Avec la réintégration de Mangosuthu Buthelezi au sein de l'ANC, il est fort probable que les États-Unis lui assurent un poste important au sein du gouvernement, tout en cherchant à reléguer Nelson Mandela à un rôle présidentiel purement honorifique. Bien que globalement regrettable, l'intervention américaine a sans aucun doute constitué un tournant décisif dans notre victoire sur le gouvernement et a conduit à la fin de l'apartheid. La perte du contrôle direct sur le gouvernement intérimaire représente une perte importante, mais un coût finalement mineur comparé à l'obtention de la fin de l'apartheid."
 USA_SAF_Collapse.32.d:0 "Suite à la victoire décisive des forces du Congrès national africain (ANC) dans la guerre civile sud-africaine après l'intervention américaine, et après des semaines de négociations, il a été annoncé que Nelson Mandela deviendrait président du nouveau gouvernement sud-africain, tandis que Mangosuthu Buthelezi en deviendrait le Premier ministre. Dans la nouvelle constitution récemment ratifiée, le président n'a qu'un rôle essentiellement honorifique, l'essentiel du pouvoir étant détenu par le Premier ministre. Cette situation a fortement irrité les membres les plus radicaux de l'ANC, qui ont critiqué la mise à l'écart apparente de Mandela et menacé de provoquer une scission au sein du parti. Cependant, nombreux sont ceux qui sont simplement soulagés de la fin des combats et qui aspirent à un retour à la stabilité."
 USA_SAF_Collapse.33.d:0 "La guerre étant désormais terminée et le désarmement général de l'opposition ayant commencé, il est nécessaire de stabiliser davantage la situation en établissant un nouveau gouvernement intérimaire en vue de nouvelles élections, sous une constitution révisée. Compte tenu de la durée, des controverses et des effusions de sang de la guerre civile, le meilleur candidat pour diriger ce nouveau gouvernement intérimaire sera probablement une personne n'ayant pas fait partie du gouvernement ces dernières années ni de lien avec les factions progouvernementales durant le conflit. Des représentants du Département d'État et de la CIA ont convenu que Chris Heunis serait un candidat idéal et disposé à diriger ce gouvernement. Ancien ministre de l'Environnement, de l'Intérieur, des Transports et du Développement constitutionnel dans les années 1980, M. Heunis a quitté la politique avant le début de la guerre civile, ce qui fait de lui un candidat idéal, notamment en raison de son expérience de réformateur. Si nous laisserons à M. Heunis et à ses alliés le soin de définir les aspects plus spécifiques du gouvernement, la recherche de partenaires au sein du Parti de la liberté Inkatha et des partis métis et indiens tels que le Parti démocratique uni et le Parti de la solidarité permettra probablement de trouver des modérés pro-occidentaux potentiels qui pourraient s'avérer utiles au sein du nouveau gouvernement. Les services de renseignement préconisent notamment de confier des postes importants à Jac Rabie, chef du Parti démocratique uni, et à Jayaram Narainsamy Reddy, chef du Parti de la solidarité, afin de contribuer à réduire les tensions raciales."
 USA_SAF_Collapse.34.d:0 "Compte tenu de l'intervention américaine dans notre guerre civile, qui a mené à la victoire de nos forces, notre futur gouvernement ne sera pas choisi à Pretoria, mais à Washington. Selon les termes établis jusqu'à présent, la nouvelle Afrique du Sud sera un État fédéral accordant une large autonomie aux bantoustans et au KwaZulu, au minimum, et garantissant un certain niveau de participation politique à toutes les ethnies au Parlement national. Le nouveau président désigné par Washington sera Chris Heunis, ancien ministre de l'Environnement, de l'Intérieur, des Transports et du Développement constitutionnel dans les années 1980. M. Heunis s'est retiré de la vie politique et n'a été impliqué ni dans les actions du gouvernement durant la période précédant la guerre civile, ni pendant le conflit. Ce facteur, combiné à son rôle d'architecte des précédentes propositions de réforme, a conduit Washington à le considérer comme le candidat idéal pour ce poste. Par ailleurs, bien que les rôles précis restent à définir, des modérés issus d'autres ethnies se verront garantir des postes au sein du gouvernement intérimaire, notamment Jayaram Narainsamy Reddy, chef du Parti Solidarité, et Jac Rabie, ancien chef du Parti démocratique uni. Globalement, même si nous avons réussi à gagner la guerre, nous serons contraints d'adopter une position plus modérée et, à tout le moins, d'abolir la majorité des lois de l'apartheid directement liées aux questions économiques."
 USA_SAF_Collapse.35.d:0 "Dans un développement notable, les États-Unis ont annoncé la formation d'un gouvernement intérimaire en Afrique du Sud suite à leur intervention en faveur du gouvernement précédent. Ce nouveau gouvernement sera dirigé par Chris Heunis, le nouveau président de l'Afrique du Sud et ancien ministre de l'Environnement, de l'Intérieur, des Transports et du Développement constitutionnel dans les années 1980. Figure reconnue des réformes menées au cours de la décennie précédente, le choix de M. Heunis pour diriger le pays est surprenant, compte tenu de son retrait de la vie politique à la fin des années 1980, avant la guerre. Le nouveau gouvernement comprendra également des représentants de l'opposition modérée, de la population métisse et des anciens bantoustans, qui seront réformés au sein d'une nouvelle structure fédérale."
 USA_SAF_Collapse.36.d:0 "Suite au succès de notre proposition de zone de sécurité et à la négociation d'un cessez-le-feu, il est devenu évident que la réconciliation entre les différentes parties au conflit ne pourra être menée à bien dans un délai raisonnable. Face à cette situation, le Département d'État a décidé que la meilleure solution consiste à démembrer l'Afrique du Sud selon les lignes de contrôle et les frontières ethniques des différents belligérants. Après d'âpres négociations avec les factions concernées, l'accord prévoit que l'ancien gouvernement recevra la région du Cap, les anciens bantoustans importants et le KwaZulu accéderont à une pleine indépendance assortie de garanties de sécurité, et le Congrès national africain se verra attribuer le reste de l'ancienne Afrique du Sud. Tous les belligérants ont également accepté de retirer leurs forces de Namibie et de reconnaître l'indépendance et la pleine souveraineté de ce pays. Cela étant dit, compte tenu des fortes tensions entre les différents États, il pourrait être dans l'intérêt de la communauté internationale de déployer des forces de maintien de la paix aux frontières afin de prévenir d'éventuels affrontements et de futurs points de conflit."
 USA_SAF_Collapse.37.d:0 "Depuis la déclaration du cessez-le-feu en Afrique du Sud, l'avenir du pays après la guerre restait incertain. Après des semaines de négociations difficiles et interminables, les États-Unis, de concert avec les représentants des différents camps, ont annoncé ce qui marque de facto la fin de l'Afrique du Sud unifiée. Le territoire qui formait autrefois l'Afrique du Sud sera divisé en plusieurs régions : la Namibie, le KwaZulu-Natal, le Transkei, le Bophuthatswana, le Venda et le Ciskei accéderont à l'indépendance et leurs frontières seront redessinées afin de former des territoires plus contigus. Le Cap, quant à lui, obtiendra l'indépendance et sera gouverné par les vestiges de l'ancien gouvernement jusqu'à la tenue de nouvelles élections, tandis que le reste du territoire sera cédé au Congrès national africain (ANC). En définitive, la guerre en Afrique du Sud est terminée, et avec elle, la fin de l'Afrique du Sud elle-même."
 USA_SAF_Collapse.38.d:0 "Suite au succès de notre intervention et à la récente négociation d'un cessez-le-feu, il est devenu évident que la réconciliation entre les différentes parties au conflit ne pourra être menée à bien dans un délai raisonnable. Face à cette situation, le Département d'État a décidé que la meilleure solution consiste à réformer en profondeur l'Afrique du Sud, en tenant compte des lignes de contrôle et des frontières ethniques des différents belligérants. Après d'âpres négociations avec les différentes factions, il est prévu que l'ANC devienne le principal parti au pouvoir, que les anciens bantoustans et le KwaZulu bénéficient d'une large autonomie et qu'une structure fédérale soit mise en place. Tous les belligérants ont également accepté de retirer leurs forces de Namibie et de reconnaître l'indépendance et la pleine souveraineté de ce pays. Par ailleurs, nous devrions plaider en coulisses pour une direction modérée au sein de l'ANC et pour la délégation de membres plus à gauche à des postes symboliques, voire leur départ à la retraite."
 USA_SAF_Collapse.39.d:0 "Depuis la déclaration du cessez-le-feu en Afrique du Sud, suite aux importants succès de l'ANC (Congrès national africain), l'avenir du pays après la guerre restait incertain. Les États-Unis, de concert avec des représentants des différents camps, ont annoncé ce qui marque de facto la fin d'une Afrique du Sud pleinement unifiée. La Namibie accédera à l'indépendance et le KwaZulu sera réintégré à l'Afrique du Sud. Le Transkei, le Bophuthatswana, le Venda et le Ciskei rejoindront l'Afrique du Sud, mais bénéficieront d'une large autonomie avant la tenue d'un référendum sur leur avenir. L'ANC conservera globalement le contrôle du pays, mais les luttes intestines entre ses factions pro-américaines et de gauche rendent l'avenir de la nation incertain."
 USA_SAF_Collapse.40.d:0 "Suite au succès de notre intervention et à la récente négociation d'un cessez-le-feu, il est devenu évident que la réconciliation entre les différentes parties au conflit ne pourra être menée à bien dans un délai raisonnable. Face à cette situation, le Département d'État a décidé que la meilleure solution consiste à réformer en profondeur l'Afrique du Sud, en tenant compte des lignes de contrôle et des frontières ethniques des différents belligérants. Après d'âpres négociations avec les différentes factions, l'accord prévoit que l'ancien gouvernement recevra la majeure partie du territoire, que les anciens bantoustans importants et le KwaZulu bénéficieront d'une large autonomie et que le Congrès national africain (ANC) se verra accorder un statut légal dans la nouvelle Afrique du Sud reconstituée, tout en étant démilitarisé. Tous les belligérants ont également accepté de retirer leurs forces de Namibie et de reconnaître l'indépendance et la pleine souveraineté de ce pays. Cela étant dit, compte tenu des fortes tensions entre les différents États, il pourrait être dans l'intérêt de la communauté internationale de déployer des forces de maintien de la paix dans ce pays en proie à la tourmente afin de superviser le désarmement de l'ANC et des différentes milices, et de veiller au respect de l'accord par toutes les parties."
 USA_SAF_Collapse.41.d:0 "Depuis la déclaration du cessez-le-feu en Afrique du Sud, suite aux importants succès de l'ancien gouvernement, l'avenir du pays après la guerre restait incertain. Les États-Unis, de concert avec des représentants des différents camps, ont annoncé ce qui marque de facto la fin de l'Afrique du Sud unifiée. Le territoire qui la composait sera divisé en plusieurs entités : la Namibie accédera à la pleine indépendance, tandis que le KwaZulu-Natal, le Bophuthatswana, le Venda et le Ciskei seront formellement intégrés à l'Afrique du Sud, tout en bénéficiant d'une large autonomie. Par ailleurs, la nouvelle Afrique du Sud adoptera une structure fédérale, reprenant l'ancien système législatif tricaméral mis en place au cours de la décennie précédente. Les opposants estiment qu'il s'agit simplement d'une restauration de l'ancienne structure gouvernementale, sous un nouveau jour."
 USA_SAF_Collapse.42.d:0 "Malheureusement, notre intervention dans la guerre civile sud-africaine ne s'est pas déroulée comme prévu. Si, dans un premier temps, nos forces ont pu consolider la position de nos alliés, des divisions internes, des problèmes d'approvisionnement et des considérations politiques ont entraîné divers revers pour notre coalition en Afrique du Sud. Avec le retrait des forces américaines, le risque de représailles contre nos anciens alliés est fort probable. Dans les mois à venir, nous devrons vraisemblablement déterminer comment gérer la potentielle crise des réfugiés qui pourrait découler de ces représailles. Outre cette défaite géopolitique embarrassante, les conséquences politiques intérieures de cet échec seront considérables. La cote de popularité de l'administration n'a cessé de chuter durant le conflit et les rumeurs d'une procédure de destitution pour mauvaise gestion de la guerre se sont intensifiées. En définitive, la défaite en Afrique du Sud restera malheureusement un moment décisif pour cette administration et pourrait bien représenter un point bas pour le rayonnement international des États-Unis dans l'après-guerre."
 Agnew80.1.d:0 "Les prix du pétrole se sont enfin stabilisés, ce qui aura certainement un impact positif sur notre cote de popularité dans les semaines à venir."
