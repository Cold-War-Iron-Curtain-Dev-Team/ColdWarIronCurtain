 Primary_Season.1.d:0 "Alors que la décennie de la Seconde Guerre mondiale s’efface dans la mémoire, et que les États-Unis entrent dans la révolution commerciale et la prospérité nouvelle de l’ère atomique, le président en exercice Harry Truman, autrefois fils d’un mercier du Missouri, maintenant dirigeant de la première puissance nucléaire mondiale, fait face à une bataille difficile lors de la prochaine élection présidentielle.\n\nMalgré ses victoires lors de la Seconde Guerre mondiale, l’héritier du bureau de Franklin Roosevelt n’a pas accompli grand-chose pour se rendre populaire auprès de l’électorat américain d’après-guerre, comme Truman lui-même l’avait autrefois prédit avec morosité ; l’antipathie croissante des conservateurs du Sud a maintenu une grande partie des tentatives de réforme de Truman dans la stagnation, et ils s’opposeront probablement à sa campagne avec la même vigueur, laissant le président partagé quant à sa décision de se représenter pour un second mandat.\n\nDe plus, les prises de position du parti adverse commencent à s’intensifier à l’approche de la saison électorale ; le républicain Robert Taft a déjà annoncé sa campagne pour la Maison-Blanche, tandis que, en parallèle, la popularité croissante du mouvement Draft Eisenhower cherche à obtenir le soutien du héros de guerre célébré pour accepter la candidature républicaine à la présidence.\n\nIl reste à voir si Truman tentera de briguer un nouveau mandat alors que la campagne semble lui être défavorable ; néanmoins, il est clair que quiconque sera investi en janvier aura des répercussions durables sur l’équilibre de la Guerre froide."
 Primary_Season.1a.d:0 "Alors que la décennie de la Seconde Guerre mondiale s’efface dans la mémoire, et que les États-Unis entrent dans la révolution commerciale et la prospérité nouvelle de l’ère atomique, le président par intérim Alban Barkley, le successeur du successeur de FDR, pourrait ne pas rester en fonction assez longtemps pour en voir les effets.\n\nEncore ébranlé par la démission de Harry Truman, l’ancien vice-président voit maintenant les décisions de son ancien supérieur lui revenir en pleine figure ; la colère suscitée par le renvoi de Douglas MacArthur a propulsé le légendaire maréchal sur le devant de la scène du Parti républicain, le champion de Corregidor, icône de la guerre du Pacifique et archi-némésis du défunt Franklin Roosevelt, qui, maintenant soutenu par Robert Taft et Joseph McCarthy, vise de manière imminente la Maison-Blanche.\n\nLes modérés et libéraux du Parti républicain sont horrifiés à la perspective de voir le César américain à la Maison-Blanche, et se précipitent déjà pour trouver des candidats afin de mener des campagnes d’opposition ; Thomas Dewey, Harold Stassen, Earl Warren, tous des noms évoqués dans un effort désespéré pour contrer le bloc de pouvoir de MacArthur composé du HUAC et des conservateurs fortunés.\n\nPendant ce temps, le président Barkley reste indécis quant à se représenter ou non pour un second mandat, et les démocrates sont tout aussi paniqués que quiconque de l’autre côté de l’allée quant à la manière de répondre à la campagne de MacArthur, certains envisageant même de se tourner vers l’ancien protégé de MacArthur, le général et héros de guerre Dwight Eisenhower, pour accepter une candidature à la nomination du Parti démocrate.\n\nAvec l’équilibre actuel de la Guerre froide à un stade aussi délicat, l’élection à venir pourrait bien s’avérer la plus décisive de l’histoire américaine."
 Primary_Season.1b.d:0 "Alors que la décennie de la Seconde Guerre mondiale s’efface dans la mémoire, et que les États-Unis entrent dans la révolution commerciale et la prospérité nouvelle de l’ère atomique, le président par intérim Alban Barkley, le successeur du successeur de FDR, a bien plus qu’à faire pour la saison des campagnes.\n\nAlors que la nation est encore en deuil après la mort du président Harry Truman aux mains de nationalistes portoricains, l’ancien vice-président Barkley se voit désormais confier la tâche peu enviable de ramasser les morceaux de l’administration déjà turbulente de Truman, poursuivant les tentatives du défunt président de promouvoir l’intégration et l’expansion du bien-être auprès d’un électorat de plus en plus hostile aux deux.\n\nDans ce contexte, le Parti républicain est déjà en mouvement pour contester la Maison-Blanche en novembre ; les conservateurs modérés du mouvement Draft Eisenhower cherchent à obtenir le soutien du vénérable général pour accepter la candidature à la Maison-Blanche, tandis que les intransigeants du RNC se rassemblent sous la bannière de l’héritier présumé Robert Taft, qui mobilise désormais l’appareil du parti pour sa campagne dans l’espoir de contrer Eisenhower.\n\nÀ l’heure actuelle, les projections pour la campagne d’Alban Barkley semblent sombres, et avec l’aile ouvrière du DNC inquiète de son âge avancé, le président lui-même reste partagé quant à se représenter pour un second mandat.\n\nAvec une guerre idéologique toujours en cours en Europe et ailleurs, le décompte final des votes en novembre pourrait bien s’avérer décisif pour la conduite des États-Unis dans la Guerre froide."
 DEM_1952_PRIMARY.1.d:0 "Le sénateur Estes Kefauver a officiellement annoncé sa candidature à l'investiture démocrate pour l'élection présidentielle, une candidature qui le placerait en porte-à-faux avec le président démocrate sortant, Harry S. Truman, s'il décidait de briguer un second mandat. Bien que sénateur nouvellement élu, Kefauver a déjà attiré l'attention nationale en tant que président de la Commission spéciale d'enquête sur le crime organisé dans le commerce interétatique. Si le sénateur a toujours soutenu la politique intérieure et étrangère de Truman, on a généralement pensé que ses auditions sur le crime organisé avaient embarrassé le président, notamment parce que plusieurs démocrates de premier plan avaient été impliqués par les conclusions de la commission. Outre l'annonce de sa candidature, Kefauver a déclaré son intention de participer à la plupart des primaires présidentielles à venir. La première primaire du pays se tenant dans le New Hampshire, il est probable que ce scrutin déterminera si le sénateur apparaîtra comme un candidat présidentiel crédible ou s'il sera considéré comme un simple candidat de protestation."
 DEM_1952_PRIMARY.2.d:0 "Le sénateur Richard B. Russell a officiellement annoncé sa candidature à la nomination présidentielle démocrate. Russell, répondant aux questions des journalistes après avoir prononcé sa déclaration officielle, a fermement refusé de dire s’il soutiendrait le président Harry S. Truman si ce dernier était renvoyé en nomination lors de la prochaine Convention nationale démocrate. Quelques années plus tôt, Russell avait accepté que son nom soit présenté comme candidat à la présidence lors de la Convention nationale démocrate, à Philadelphie. À cette époque, la candidature du sénateur avait été principalement un geste de protestation contre l’inclusion d’un programme fort sur les droits civiques. Malgré un soutien écrasant des délégués du Sud lors de la convention, Russell avait été facilement battu par Truman pour la nomination présidentielle. Cependant, il est resté loyal au Parti démocrate et a refusé de soutenir une candidature indépendante pour les droits des États.\n\nGénéralement reconnu comme le leader d’un bloc conservateur de démocrates au Sénat, Russell, dans les années qui ont suivi la précédente campagne présidentielle, s’est vigoureusement opposé à de nombreuses propositions législatives nationales clés du président. Il a également été président de la Commission des services armés, qui a supervisé une enquête du Sénat sur le renvoi controversé du général Douglas MacArthur.\n\nIl apparaît que le président actuel, Harry S. Truman, aura une opposition considérable s’il choisit de se représenter aux primaires présidentielles démocrates."
 DEM_1952_PRIMARY.3.d:0 "Le président Truman, qui avait déjà servi les États-Unis d’Amérique pendant deux mandats, a décidé de mettre fin à sa campagne pour un troisième mandat. Cette décision a été prise après que le président Truman ait perdu la primaire présidentielle du New Hampshire face à Estes Kefauver. Les journalistes ont attribué sa défaite dans la primaire à une forte baisse de sa popularité, à divers problèmes économiques non résolus par son administration et aux divisions au sein du Parti démocrate qui auraient pu entraver l’avancement du programme législatif du président, malgré le contrôle du Congrès par le Parti démocrate. Le président Truman a également été cité disant qu’il considérait les primaires comme un « écran de fumée », ce qui a pu aliéner les électeurs par ses remarques désinvoltes.\n\nLa victoire de Kefauver a été attribuée à la campagne intensive qu’il a menée dans le New Hampshire, où, au lieu de critiquer l’administration Truman, il a souligné son propre bilan de votes au Congrès et sa préoccupation pour la criminalité et la corruption gouvernementale. Bien que Kefauver soit un membre respecté du Sénat des États-Unis et un infatigable candidat, peu d’observateurs avaient prévu qu’il réaliserait une performance crédible dans la primaire du New Hampshire. Dans la mesure où tous les grands politiciens démocrates étaient actifs en faveur du président, il était considéré comme très improbable que le jeune sénateur du Tennessee attire plus qu’un soutien symbolique parmi l’électorat du New Hampshire.\n\nLes premiers résultats électoraux ont indiqué une course étonnamment serrée entre Truman et Kefauver. Dès le lendemain matin, Kefauver avait pris une avance sur le président."
