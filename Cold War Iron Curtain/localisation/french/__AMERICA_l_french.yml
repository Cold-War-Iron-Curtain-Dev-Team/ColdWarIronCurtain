 Formosa_Resolution.1.d:0 "Le Sénat américain a adopté une résolution conjointe, dite « Résolution de Formose », qui stipule que le président a le pouvoir, à sa discrétion, de déployer l'armée américaine pour sécuriser et protéger Formose (Taïwan) et les îles environnantes en cas d'attaque armée communiste. Cette résolution est saluée à Taïwan, dont la population vit depuis longtemps sous la menace d'une attaque communiste du continent. Le gouvernement taïwanais s'est engagé à maintenir sa ferme opposition aux communistes et a remercié les États-Unis de leur soutien aux forces œuvrant pour une Chine démocratique. La République populaire de Chine a condamné la résolution, la qualifiant de première étape d'une tentative américaine de transformer Formose en colonie et en base impérialiste pour attaquer la révolution. De nombreux Américains soutiennent cette résolution, y voyant la preuve de l'engagement des États-Unis à défendre la communauté internationale contre le communisme."
 nixon_native.1.d:0 "Dans un récent discours devant le Congrès, le président Nixon a dévoilé sa politique d'autodétermination des peuples autochtones. Il a condamné la politique précédente et a appelé le gouvernement à permettre aux Amérindiens de maîtriser leur propre avenir. Dans les prochains mois, le Congrès devrait adopter une série de projets de loi visant à soutenir la création de communautés tribales autonomes avec l'appui des États-Unis. Cela marque un revirement par rapport à la politique américaine de « dissolution ». Les présidents précédents avaient soutenu cette politique, qui visait à intégrer les Amérindiens et à supprimer toutes les institutions d'autonomie. Les Amérindiens avaient largement condamné cette politique, la considérant comme une atteinte à leur identité. La nouvelle politique de Nixon est largement saluée par les militants et les dirigeants autochtones."
 Great_Realiagnment.1.d:0 "Alors que le président Earl Warren achève son second mandat, le pays s'interroge sur les profonds bouleversements politiques qui le traversent. Le succès de Warren a renforcé les ailes modérée et progressiste du Parti républicain. L'engagement en faveur des droits civiques a ravivé les liens traditionnels entre le Parti républicain et la communauté afro-américaine. De plus en plus d'Américains vivant en ville se tournent vers le Parti républicain, perçu comme un rempart de stabilité et d'égalité. Quant au Parti démocrate, il a vu ses tentatives de rapprochement avec les communautés progressistes échouer. De ce fait, il adhère désormais de plus en plus à la vision conservatrice des Dixiecrats. Le Parti démocrate séduit de plus en plus les populations rurales et conservatrices, notamment dans le Sud et le Midwest. Nombre d'analystes estiment que l'influence du président Warren modifiera durablement la trajectoire politique des deux principaux partis américains."
 Fat_Fucker.1.d:0 "Le directeur de la CIA, le secrétaire d'État et les principaux agents de l'Agence ont élaboré un plan baptisé Projet FF, ou Projet Gros Connard. Les États-Unis reconnaissent l'instabilité et la corruption généralisée du système politique égyptien actuel. Si la situation perdure, le risque d'une révolution de gauche est élevé. Le plan prévoit que la CIA approche le roi Farouk et exerce une forte pression sur lui afin qu'il initie des réformes cruciales. L'objectif final est que le roi réforme son gouvernement, répartisse l'autorité royale entre des ministres compétents, lutte contre la corruption et propose une vision progressiste au peuple égyptien. Si le roi refuse de changer, il faudra envisager des alternatives à son gouvernement, comme les Officiers Libres, un mouvement clandestin au sein des forces armées regroupant des officiers anti-royaux désireux d'établir un nouvel État nationaliste."
 Fat_Fucker.2.d:0 "Les États-Unis ont interpellé le roi et lui ont adressé un avertissement alarmant. Ils affirment que si la situation politique actuelle perdure, l'Égypte risque de sombrer dans le chaos et de voir la monarchie renversée. Les Américains insistent pour que le roi mette en œuvre des réformes, lutte contre la corruption et réaffirme son autorité sur le gouvernement. Ces réformes impliquent notamment de confier l'autorité royale à des fonctionnaires et des officiers militaires. Les Américains souhaitent en réalité que le roi prenne ses distances avec certains de ses proches, réduise ses activités extra-juridiques et instaure un gouvernement royal plus progressiste, placé sous l'égide de hauts fonctionnaires et d'officiers militaires compétents. Le roi doit choisir : céder à ces pressions et risquer de voir son trône menacé par des influences étrangères et intérieures, ou maintenir le cap et préserver la souveraineté égyptienne."
 Fat_Fucker.3.d:0 "Le roi a cédé aux pressions américaines et a entrepris des réformes cruciales de son gouvernement et de son administration afin de prévenir d'éventuels troubles, voire des soulèvements. Ses proches conseillers élaborent les décrets nécessaires et nomment des hauts fonctionnaires et officiers militaires à des postes plus importants au sein du régime. Cependant, malgré l'accord du roi, son engagement réel envers ces réformes reste incertain. Quoi qu'il en soit, le roi affirme agir dans l'intérêt supérieur du peuple égyptien et de la monarchie. Bien que les médias d'État fassent état d'une nouvelle initiative royale, des rumeurs circulent déjà en Égypte, selon lesquelles le roi agirait sous la pression américaine. Certains membres du palais, conscients que ces réformes entraîneront leur déclin, semblent répandre ouvertement ces rumeurs."
 Fat_Fucker.4.d:0 "Le projet FF semble bien parti pour réussir, le roi Farouk ayant manifesté sa volonté d'accepter des réformes. Cependant, ce n'est pas la première fois qu'il promet des réformes sans pour autant les mettre en œuvre intégralement. Quoi qu'il en soit, la CIA et le Département d'État se félicitent que le roi ait accepté nos propositions en principe. La prochaine étape consistera à maintenir la pression sur le roi Farouk jusqu'à ce qu'il mette en œuvre toutes les réformes et instaure un État égyptien sûr et anticommuniste. Les analystes du renseignement estiment qu'il est impératif de poursuivre la pression sur le roi. On craint toutefois que, si la nouvelle de l'accord du roi sur les réformes, notamment l'octroi de pouvoirs accrus aux officiers, se répande, les nationalistes antiroyaux au sein de l'armée n'y voient une opportunité pour servir leurs propres intérêts."
 Fat_Fucker.5.d:0 "Nos efforts pour contraindre le roi Farouk à entreprendre des réformes cruciales ont échoué. Le roi persiste dans ses illusions de grandeur et croit que nos conseils ne sont qu'une manœuvre pour asseoir la domination américaine dans le pays. L'opération FF semble avoir échoué à le persuader, mais l'objectif d'établir un régime égyptien fort et anticommuniste demeure. La CIA est en contact avec un groupe d'officiers militaires nationalistes et antiroyaux, les Officiers Libres. Nous pouvons leur apporter un soutien clandestin et garantir leur protection contre les contre-coups d'État s'ils agissent contre le roi Farouk. Le Président a ordonné au Département d'État et à la CIA de recentrer leurs efforts sur le soutien aux Officiers Libres afin d'éviter que, lors de la chute inévitable du roi Farouk, il ne soit remplacé par un régime de gauche pro-Moscou."
 Project_FF.1.d:0 "La CIA a lancé une opération de diffusion d'informations auprès de la presse internationale, insistant sur le danger que représente le roi Farouk d'Égypte pour le Moyen-Orient. De plus en plus d'articles font état de la volonté de l'Égypte d'anéantir Israël et les puissances arabes rivales par tous les moyens. Des alliés au Congrès, entre autres sources, ont divulgué des rapports de renseignement spécialement sélectionnés, suggérant que l'Égypte se prépare à la faillite pour acquérir des armes et lancer des attaques contre ses voisins. Nos agents en Égypte diffusent des tracts et des articles dénonçant la corruption et la faillite morale du roi Farouk afin de fragiliser son soutien populaire."
 Project_FF.2.d:0 "Aux États-Unis et en Europe, l'inquiétude grandit face aux rapports des services de renseignement suggérant que le roi Farouk d'Égypte se prépare à lancer des attaques militaires contre Israël et d'autres États voisins. Ces rapports insistent sur le caractère délirant du roi Farouk et laissent entendre qu'il mènerait l'Égypte à la faillite afin d'acquérir rapidement des armes et de réaliser ses ambitions. De nombreux responsables américains et leurs alliés à l'étranger estiment qu'un tel scénario est probable et qu'une reprise du conflit dans la région pourrait engendrer une crise humanitaire catastrophique. Le gouvernement égyptien dénonce ces accusations, accusant l'Occident de mener une campagne de propagande contre le peuple arabe."
 US_Navy50s.1.d:0 "La Marine américaine a tenu une série de discussions de haut niveau entre officiers supérieurs et responsables de la défense nationale afin de définir une doctrine plus moderne et proactive. Elle estime nécessaire de déployer des flottes sur l'ensemble des océans et de positionner des forces capables d'intervenir rapidement en cas de crise internationale émergente. Ceci permettra aux États-Unis d'accroître leur marge de manœuvre internationale en établissant rapidement une présence avancée et en projetant leurs forces. Pour mettre en œuvre efficacement cette stratégie, la Marine aura besoin d'un soutien financier continu et conséquent de la part du gouvernement."
 CIA_DOM_50s.1.d:0 "La CIA ne dispose pas de pouvoirs de police intérieure et il lui est interdit d'espionner les citoyens américains sur le territoire national. Elle possède toutefois une Division des ressources nationales (NRD) axée sur les affaires intérieures. La NRD supervise plusieurs programmes de débriefing volontaires auprès des citoyens américains afin de recueillir des renseignements publics, ainsi que le Bureau du renseignement actuel qui organise des briefings de haut niveau. Cependant, l'agence serait impliquée dans d'autres opérations visant à expérimenter certaines technologies, théories et tentatives d'influence sur l'opinion publique. Ces opérations sont essentielles au renforcement des capacités de l'agence dans les années à venir, mais la CIA entend les maintenir secrètes afin d'éviter tout litige."
 CIA_DOM_50s.2.d:0 "Vers la fin de la guerre, nos services de renseignement ont découvert des expériences avancées, parfois terrifiantes, menées par les Japonais et les Allemands sur la manipulation et le contrôle de l'esprit humain. De nombreux nazis impliqués dans ces programmes ont été arrêtés par nos forces et, après la guerre, employés pour poursuivre leurs recherches. Nos récents affrontements avec les forces communistes ont confirmé qu'elles utilisaient leurs propres techniques et menaient des expériences sur des prisonniers de guerre américains. C'est inacceptable et nous ne pouvons pas rester à la traîne. C'est pourquoi la CIA a récemment lancé le projet MKUltra, qui vise à expérimenter et étudier l'utilisation de drogues spécifiques afin d'améliorer les interrogatoires et d'explorer le contrôle mental. La CIA prévoit de mener des tests sur du personnel militaire, des employés, des travailleuses du sexe, des prisonniers et des patients psychiatriques afin d'éviter tout examen public, car certains juristes de l'Agence estiment que ces expériences pourraient enfreindre les lois relatives à la présence de la CIA sur le territoire américain."
 CIA_DOM_50s.3.d:0 "Les médias de masse jouent un rôle de plus en plus crucial dans la manière dont les populations du monde entier s'informent. Les Soviétiques influencent et manipulent déjà les médias pour servir leurs objectifs politiques et déstabiliser les États-Unis. Afin de lutter contre cette influence et cette subversion étrangères, la CIA a récemment lancé l'opération Mockingbird. Des agents de la CIA recrutent des journalistes américains de premier plan et des organisations civiles influentes afin de coordonner une riposte efficace aux agissements soviétiques. Plus important encore, la CIA peut contribuer à amplifier nos propres offensives médiatiques afin de mieux convaincre la communauté américaine et internationale du bien-fondé de notre cause et d'empêcher l'infiltration d'influences étrangères ou de communistes américains."
 USA_Suez.5.d:0 "La Bourse de Londres s'est effondrée suite à l'annonce du recouvrement par les États-Unis de leur dette de guerre auprès du Royaume-Uni. Cette décision intervient après le refus du gouvernement britannique de céder aux demandes de Washington de mettre fin à son intervention dans le canal de Suez. L'invasion conjointe franco-britannico-israélienne, lancée après la nationalisation du canal par l'Égypte, a pris les États-Unis par surprise. De nombreux dirigeants américains comparent cette action militaire à la diplomatie de la canonnière de l'époque coloniale, une politique obsolète qui nuit à l'image de l'Occident dans la région. La décision de recouvrer la dette de guerre provoque une panique générale en Grande-Bretagne, mais il pourrait s'agir d'un premier pas. Si la Grande-Bretagne poursuit le conflit, les États-Unis pourraient bientôt couper les vivres, ce qui serait catastrophique pour un pays qui se reconstruit encore après la Seconde Guerre mondiale."
 USA_KOR_WITHDRAWAL.1.d:0 "Les États-Unis ont entamé le retrait de leurs forces de Corée. Le président a annoncé sa décision à l'issue d'une réunion de haut niveau avec les principaux responsables militaires et de la défense. Il a conclu que le peuple américain avait consenti d'énormes sacrifices pour soutenir la cause de la liberté en Corée. Toutefois, maintenir la présence américaine reviendrait à sacrifier des vies sans perspective de gain raisonnable, et il est temps pour le peuple coréen de se lever et de lutter pour sa liberté. Cette nouvelle est perçue comme un revers fatal pour les Sud-Coréens et les forces des Nations Unies, car le retrait des troupes américaines fait basculer l'équilibre des forces en faveur de la Corée du Nord. Le gouvernement sud-coréen et les alliés des États-Unis ont vivement critiqué cette décision."
 Albanian_Subversion.1.d:0 "Les services de renseignement britanniques (SIS) nous ont contactés au sujet d'un plan visant à renverser le régime communiste en Albanie. Les Britanniques estiment qu'Enver Hoxha, le dirigeant communiste, est encore en train de consolider son pouvoir et qu'il existe une opportunité d'enrayer l'expansion communiste. Ils pensent qu'avec notre soutien, ils pourraient parachuter des expatriés albanais anticommunistes hautement entraînés dans la région de Mati. Mati est connue pour son conservatisme et ses liens étroits avec l'ancienne famille royale. Les Britanniques pensent que ces agents pourraient organiser un soulèvement populaire et, grâce à des parachutages de ravitaillement, parvenir à renverser Hoxha et à mettre fin à la menace communiste."
 Albanian_Subversion.5.d:0 "Les Britanniques ont contribué à la création du Comité national de l'Albanie libre. Cette organisation regroupe des Albanais anticommunistes vivant en Albanie occidentale. Grâce à elle, nous espérons recruter et organiser ces militants albanais en vue de l'opération à venir. Le groupe enverra ses membres les plus prometteurs auprès des Britanniques pour une formation approfondie et une préparation minutieuse à l'opération prévue. Les efforts déployés pour obtenir le soutien du roi Zog sont au point mort, l'ancien monarque refusant de transiger sur sa position d'unique représentant des Albanais. La CIA, quant à elle, préfère rester discrète, craignant la présence d'exilés albanais anticommunistes, anciens partisans de l'Axe."
 Albanian_Subversion.6.d:0 "Le gouvernement britannique a sollicité la coopération de la CIA concernant son projet de fomenter un soulèvement anticommuniste en Albanie. Les Britanniques ont établi des liens avec le Comité national de l'Albanie libre. Par le biais de cette organisation, le groupe peut fournir des agents pour mener l'opération. Cependant, les Britanniques n'ont pas obtenu le soutien de l'ancien monarque albanais, le roi Zog. La CIA estime que les Britanniques ont déployé des efforts considérables pour préparer l'opération, mais s'inquiète du manque de soutien royal et de la présence d'anciens exilés albanais pro-Axe. Certains au sein de l'Agence pensent qu'il serait peut-être plus judicieux d'agir de leur propre initiative et de collaborer avec le roi Zog pour orchestrer un soulèvement royaliste."
 Albanian_Subversion.7.d:0 "La CIA a refusé de coopérer avec l'opération albanaise proposée. Elle estime que le roi Zog est le moyen le plus efficace de provoquer un soulèvement anticommuniste. Elle a exprimé son scepticisme quant à la faisabilité du plan du SIS sans le soutien du roi Zog. Les Britanniques seraient très déçus par ce résultat et ne savent pas comment procéder, car ils avaient besoin des bases et de la puissance aérienne américaines pour leur plan. La CIA espère que le SIS reviendra sur sa décision, mais elle est confiante quant à sa capacité à réussir avec le soutien du roi Zog."
 Albanian_Subversion.8.d:0 "Les États-Unis ont récemment lancé une campagne diplomatique et médiatique pour condamner le régime communiste albanais d'Enver Hoxha. Le gouvernement américain appelle à l'autodétermination et accuse les communistes de bafouer les droits de tous les Albanais. La CIA soutient également cette initiative en incitant ses alliés dans les médias internationaux à diffuser des informations sur la répression communiste et des déclarations d'exilés albanais anticommunistes. Cette campagne vise à déstabiliser le régime communiste et à obtenir un soutien international en faveur d'un changement de régime."
 Albanian_Subversion.9.d:0 "Les États-Unis ont annoncé leur intention d'accueillir des réfugiés albanais sur leur territoire. Le gouvernement américain a déclaré que ces réfugiés étaient victimes de l'agression communiste et menacés en Europe. Cette déclaration publique vise à dénoncer la situation des droits humains en Albanie, pays sous contrôle communiste. Pour la CIA, l'arrivée de ces réfugiés lui permettra de renforcer ses liens avec les Albanais anticommunistes et d'identifier de futurs agents et alliés politiques."
 Albanian_Subversion.10.d:0 "L'Assemblée des nations européennes captives s'est constituée à New York sous la supervision des États-Unis et avec le soutien discret de la CIA. Cette organisation rassemble des exilés anticommunistes d'Albanie, de Bulgarie, de Tchécoslovaquie, d'Estonie, de Hongrie, de Lettonie, de Lituanie, de Pologne et de Roumanie. Elle s'engage à libérer leurs pays par des moyens pacifiques et à faire connaître la réalité de la vie derrière le rideau de fer. Outre la publication de périodiques et d'articles de presse, l'organisation prévoit d'ouvrir des antennes en Angleterre, en France et en Suisse. L'Union soviétique et ses alliés surveilleront de près le groupe."
 Albanian_Subversion.11.d:0 "La révolte anticommuniste albanaise, menée par des exilés revenus libérer leur pays, a salué le retour du roi Zog à Tirana. Le roi vivait en exil depuis son départ forcé suite à l'invasion italienne de 1939. Bien que critiqué pour avoir emporté une grande partie des réserves d'or de l'Albanie, il a promis de les restituer et a affirmé ne les avoir prises que pour empêcher leur pillage par des puissances étrangères. Le soulèvement anticommuniste a rallié ses plus importants partisans dans les régions restées fidèles au roi. S'adressant à une foule immense, le roi Zog a promis de restaurer la dignité et la prospérité de l'Albanie. Les États communistes voisins ont condamné le retour du roi Zog, le qualifiant de début d'un cauchemar réactionnaire pour le peuple albanais. Les États-Unis et leurs alliés ont salué le retour du roi Zog comme un rétablissement de la liberté politique pour le peuple albanais."
 US_STEEL.0.d:0 "Le prix de l'acier aux États-Unis a connu une hausse spectaculaire. Cette situation inquiète le président [USA.GetLeader] et ses conseillers économiques. Ils estiment que l'industrie sidérurgique, et notamment la société U.S. Steel, coordonne ses efforts pour augmenter les prix de l'acier afin de maximiser ses profits. Le président craint que ces hausses de prix ne provoquent une crise inflationniste et n'affaiblissent l'industrie de la défense en cas de crise. Il envisagerait le démantèlement d'U.S. Steel afin de stimuler la concurrence et de faire baisser les prix. Toutefois, il devrait prendre en compte les conséquences potentielles et les recours juridiques qu'une telle mesure pourrait engendrer. U.S. Steel justifie ces prix par les lois du marché et l'augmentation des salaires. L'entreprise s'oppose fermement à toute ingérence fédérale dans ses activités."
 US_STEEL.5.d:0 "Le président américain [USA.GetLeader] a récemment ordonné au gouvernement d'enquêter sur U.S. Steel pour manipulation du marché et a chargé son équipe juridique d'engager des poursuites antitrust en vue du démantèlement de l'entreprise. Il a déclaré qu'U.S. Steel détenait un monopole abusif sur le marché de l'acier et étouffait la concurrence. Il a proposé à l'entreprise soit de se soumettre à une série de procès et d'enquêtes, soit de simplement accepter un démantèlement. Après une réunion du conseil d'administration, U.S. Steel a accédé aux demandes du président et a lancé un plan de scission. Le président est critiqué par de nombreux chefs d'entreprise pour ce qu'ils considèrent comme un abus de pouvoir exécutif. Cependant, de nombreux Américains saluent ses efforts pour protéger les consommateurs et promouvoir la concurrence."
 US_STEEL.6.d:0 "Interrogé sur la flambée des prix de l'acier, le président américain [USA.GetLeader] a déclaré que, bien qu'il comprenne les difficultés rencontrées par les Américains et les industries dépendantes de l'acier, il s'agissait du prix à payer pour une économie de marché. À la question de savoir si la presse l'incitait à intervenir pour faire baisser les prix ou démanteler les grands groupes sidérurgiques, il a affirmé que ces options n'étaient pas envisageables. Dans un communiqué, U.S. Steel a réaffirmé que la hausse actuelle des prix n'était pas le fruit d'une stratégie délibérée, mais la conséquence des prix et de la demande du marché."
 Decolonization_USA.50.d:0 "Un récent discours du président des États-Unis a suscité l'étonnement dans les capitales d'Europe occidentale. Le président a condamné le colonialisme européen, le qualifiant de déni des droits inaliénables des peuples colonisés à l'autodétermination et à la liberté. Il a souligné que la poursuite du colonialisme ne faisait que perpétuer des systèmes archaïques et radicaliser les populations, les opposant ainsi aux libertés et au progrès que la démocratie pouvait apporter au monde. Il a appelé toutes les puissances européennes ayant des colonies à entamer le processus de décolonisation et à contribuer à l'avènement d'un nouvel ordre mondial fondé sur le libre-échange, la démocratie et la coopération en Afrique et en Asie."
 Korean_War_Yan.1.d:0 "Les États-Unis ont demandé à nos forces de lancer une opération immédiate pour libérer le territoire chinois du joug communiste. Les États-Unis ont récemment entamé une guerre contre le régime communiste et semblent déterminés à l'anéantir. Les Américains ont salué notre engagement envers la démocratie en Chine et estiment que nos opérations contribueraient grandement à leurs efforts pour vaincre les communistes. De nombreux commandants pensent que nous devrions agir sans délai dans l'intérêt de la Chine et pour immobiliser ses forces. Cependant, certains commandants appellent à la prudence, arguant que nous opérerions en dehors du périmètre principal des forces américaines et risquerions l'anéantissement de nos propres troupes. Ils estiment que nous devrions refuser cette demande et attaquer au moment et à l'endroit de notre choix."
 Korean_War_Yan.2.d:0 "Les forces de la République de Chine ont accepté notre demande de lancer des opérations sur le continent. C'est une excellente nouvelle pour nos opérations. Les forces chinoises seront fortement sollicitées pour défendre leurs côtes et leurs frontières, ce qui nous permettra de frapper leurs points faibles. Cela légitimera également notre mission de libérateurs de la Chine et de défenseurs de ses forces démocratiques. Nous pouvons nous attendre à des informations faisant état d'offensives du Kuomintang dans les prochains jours."
 Korean_War_Yan.3.d:0 "Les forces de la République de Chine ont refusé notre demande d'opérations sur le continent. Il s'agit d'un revers majeur pour notre effort de guerre. La participation des forces de la République de Chine aurait affaibli les communistes et nous aurait offert une plus grande flexibilité opérationnelle. La CIA estime que les commandants nationalistes, soucieux des pertes humaines, se sont peut-être trop ralliés à leurs bases et à leur contrôle de Taïwan et du Triangle d'or."
 Korean_War_Yan.4.d:0 "Des informations en provenance de Chine et de Birmanie indiquent que les vestiges de la Huitième Armée de la République de Chine ont lancé une invasion de la Chine communiste par la province du Yunnan, tandis que les principales forces basées à Taïwan préparent des attaques amphibies sur les régions côtières du sud-est de la Chine continentale. La République populaire de Chine a promis une riposte immédiate et a minimisé la menace. Cependant, cette invasion pourrait s'avérer désastreuse, car les communistes devront désormais engager des troupes ailleurs dans une guerre directe contre les États-Unis. Le gouvernement américain a salué cette nouvelle, la qualifiant d'intervention d'une force de libération cherchant à mettre fin à la tyrannie communiste."
 Korean_War_Yan.5.d:0 "Nous avons appris de Taipei que la République de Chine a officiellement rejoint les États-Unis dans la guerre de Corée et nous a demandé d'ouvrir un nouveau front au Yunnan. Nombre de nos officiers, fidèles à Tchang Kaï-chek et à la cause anticommuniste, souhaitent que nous répondions à l'appel aux armes."
 Decolonization_USA.2.d:0 "Dans un récent discours, le président a appelé à la décolonisation de l'Afrique. Il a affirmé que le peuple américain a toujours soutenu la cause de la liberté. Conformément à ces valeurs, la fin du colonialisme et la liberté pour tous les Africains constituent un intérêt vital pour les États-Unis. Il a conclu son discours en exhortant les nations qui conservent des colonies à reconnaître que la décolonisation est la seule voie juste à suivre. Ce discours suscitera sans aucun doute des inquiétudes chez les puissances coloniales, mais le gouvernement américain estime avoir gagné de nouveaux alliés et une légitimité accrue sur le continent africain. De nombreuses organisations anticoloniales ont salué cette nouvelle. Les entreprises et les économistes américains manifestent également leur soutien, car la fin du pouvoir colonial ouvrira de nouveaux marchés pour les produits et l'influence américains."
 Decolonization_USA.3.d:0 "Ce virage vers la décolonisation, au risque de s'aliéner de puissants alliés, marque un retour à la diplomatie wilsonienne. Le département d'État américain a annoncé que les États-Unis soutenaient fermement l'autodétermination de tous les peuples colonisés. Cette nouvelle initiative américaine vise à renforcer les liens des États-Unis avec les nouveaux États émergents et à contester la position des Soviétiques en tant que champions de l'anticolonialisme en Afrique. En privé, les Soviétiques seraient préoccupés par cette contestation et certains dirigeants craignent que les Américains n'étendent cette position sur l'autodétermination aux régions d'Europe et d'Asie sous influence soviétique."
 Decolonization_USA.4.d:0 "Le Département d'État a annoncé que les États-Unis entendent inviter les nouveaux États africains indépendants à rejoindre le Programme d'assistance technique. Le gouvernement américain estime que ce programme apportera une aide technique essentielle à la transformation de ces États en nations stables et démocratiques. Cette invitation s'inscrit dans le cadre du récent engagement américain en faveur de la décolonisation, et nombreux sont ceux qui voient dans le Programme d'assistance technique un moyen pour les États-Unis d'accroître leur influence sur le continent et de contenir la menace communiste."
 Decolonization_USA.1.d:0 "La situation en Afrique évolue rapidement. Sur tout le continent, des millions de personnes militent pour une plus grande autonomie ou l'indépendance vis-à-vis des puissances coloniales. Le développement de l'éducation et la montée des idéologies radicales dans les colonies alimentent l'activisme anticolonial. Le Département d'État américain estime que le maintien des puissances européennes au sein des colonies, même par la force, risque de radicaliser leurs populations colonisées et d'ouvrir la voie à l'influence communiste. Certains pensent que les États-Unis doivent user de leur influence sur les États coloniaux européens pour impulser la décolonisation, afin de prévenir la radicalisation et d'ouvrir ces territoires à l'influence culturelle et économique américaine. Cependant, d'autres estiment qu'une telle approche ne ferait que faciliter l'émergence de régimes radicaux et exhortent les États-Unis à soutenir plus ouvertement les États coloniaux. Nous pouvons les encourager à mettre en œuvre des réformes afin qu'ils puissent, à terme, transférer le pouvoir aux élites africaines locales pro-occidentales."
 Radio_Free_Europe.1.d:0 "Le Comité national pour une Europe libre (NCFE) a récemment lancé une nouvelle station de radio, Radio Free Europe. Cette station diffusera des programmes à travers l'Europe et le bloc de l'Est afin de lutter contre la propagande communiste. La CIA contrôle le NCFE et a recruté de nombreuses personnalités anticommunistes pour soutenir ses actions. Radio Free Europe diffusera des témoignages de réfugiés ayant fui les régimes communistes. Aux États-Unis, la station est largement saluée comme une réponse efficace à la montée de la menace communiste."
 PBSUCCESS_AFTERMATH.2.d:0 "L'échec de la tentative de renversement du gouvernement de Jacobo Arbenz a renforcé son emprise sur le pays. Fort de ce soutien accru, il intensifiera sans aucun doute ses efforts pour s'emparer des terres et des installations appartenant à des intérêts américains, comme celles de la United Fruit Company. La CIA estime que cela conduira inévitablement à la transformation du Guatemala en un État client de l'Union soviétique. Cependant, ce n'est pas encore le cas. Afin de ne pas perdre le contrôle du Guatemala et d'agir avant que la situation ne devienne totalement intenable, la CIA a prévu de divulguer certains renseignements de manière à faire croire que les Soviétiques s'apprêtent déjà à entrer dans le pays. Une fois que les Américains auront compris que le Guatemala est sur le point d'accueillir des forces soviétiques, nous pourrons déployer l'armée pour sécuriser le pays."
 PBSUCCESS_AFTERMATH.1.d:0 "L'incapacité de la CIA à maîtriser la situation au Guatemala illustre un échec plus général de la doctrine Monroe. Pendant des décennies, cette doctrine a protégé nos intérêts et notre région des idéologies hostiles et des ingérences étrangères. Cependant, ce récent échec met en lumière les limites de l'influence américaine et le Guatemala risque désormais de devenir un État client de l'Union soviétique. Notre échec au Guatemala est un signal clair envoyé aux forces anti-américaines de tout l'hémisphère, les incitant à lancer des opérations et à mettre en œuvre leurs propres objectifs. Les alliés des États-Unis ont également perdu confiance en notre protection et pourraient chercher du soutien ailleurs."
 PBSUCCESS_AFTERMATH.3.d:0 "Des informations circulant dans la presse américaine et occidentale font état d'une influence soviétique croissante sur le gouvernement guatémaltèque de Jacobo Arbenz. Ces informations indiquent que les Soviétiques envisagent d'établir rapidement des relations avec le pays et d'y installer des bases. Des éditoriaux appellent déjà le président à agir. L'opinion publique américaine est préoccupée par le déploiement de troupes soviétiques à quelques kilomètres seulement des États-Unis. Le président bénéficie du soutien populaire nécessaire pour prendre des mesures plus radicales afin de résoudre la situation au Guatemala."
 PBSUCCESS_AFTERMATH.50.d:0 "Le régime de gauche au Guatemala a consolidé son emprise sur le pays et instauré des mesures draconiennes pour réprimer la dissidence et nationaliser davantage d'entreprises étrangères, notamment United Fruit Company, une importante société américaine. La CIA a réagi en lançant l'opération PBSuccess, visant à diffuser des messages radiophoniques et à semer la peur et la panique parmi la population guatémaltèque. Dans ce climat chaotique, l'armée guatémaltèque, sous son commandement pro-américain et anticommuniste, aurait pu rallier même des officiers progouvernementaux pour intervenir et renverser le régime de Jacob Arbenz. Cependant, ce plan a échoué. Suite à la fuite d'informations concernant un déploiement soviétique imminent, le président a pu ordonner à l'armée américaine d'envahir le Guatemala afin de rétablir la démocratie et de protéger les citoyens et les biens américains, avec le soutien du peuple américain."
 USA_Israel_Lobby.1.d:0 "La situation au Moyen-Orient est précaire. Bien que la récente guerre israélo-arabe se soit soldée par un armistice, les deux camps semblent se préparer à une nouvelle escalade du conflit. Le monde arabe possède de précieuses ressources, notamment du pétrole. Israël établit un État démocratique, entretient des liens étroits avec l'Occident et bénéficie du soutien du peuple américain. L'administration doit décider de la marche à suivre. Un groupe préconise une politique résolument pro-israélienne, incluant des ventes d'armes, ce qui serait bien accueilli par l'opinion publique et servirait les intérêts pro-israéliens. Les Israéliens pourraient également contribuer à garantir nos intérêts dans la région. Cependant, une telle démarche risquerait de provoquer la colère des pays arabes et de compromettre leur accès au pétrole. L'autre groupe estime que nous devons maintenir la neutralité afin de préserver et de renforcer nos liens avec les États arabes. Cette position nous permettrait de faciliter la conclusion d'un futur accord bénéfique à long terme pour les Israéliens comme pour les Arabes."
 USA_Israel_Lobby.2.d:0 "Les États-Unis, le Royaume-Uni et la France ont signé la Déclaration tripartite. Ces trois États s'engagent à maintenir le statu quo territorial établi par les récents accords d'armistice israélo-arabes. L'accord confirme leur engagement en faveur de la paix et de la stabilité au Moyen-Orient et empêche toute tentative de déstabilisation de cette paix fragile. Il est salué par les États arabes, qui s'efforcent de reconstituer leurs capacités militaires. Les Israéliens, quant à eux, seraient mécontents, car ils estiment que leur avantage militaire sera bientôt perdu, les trois États ayant également convenu de limiter les ventes d'armes à la région."
 USA_Israel_Lobby.3.d:0 "Les États-Unis ont refusé de signer la Déclaration tripartite proposée par le Royaume-Uni en France. Cet accord aurait appelé les trois États à préserver le statu quo territorial actuel entre Israël et ses voisins arabes. Il aurait également stipulé que les trois parties œuvreraient à contrôler les ventes d'armes à la région. Le gouvernement américain a fait valoir que l'accord était anti-israélien car il priverait Israël d'aide à la défense tout en permettant aux États arabes de se réarmer plus efficacement sur le marché mondial grâce à sa position financière plus solide. Ce refus américain témoigne du soutien des États-Unis à Israël, et les États arabes seraient furieux de cette position."
 Ajax_USA.5.d:0 "Le département d'État américain a annoncé que les États-Unis s'opposent fermement à la récente nationalisation des intérêts pétroliers étrangers en Iran. De telles mesures unilatérales compromettent les investissements futurs en Iran et pénalisent injustement les détenteurs d'intérêts dans ces entreprises. Les États-Unis exhortent l'Iran à reconsidérer sa position et à reprendre les négociations afin de parvenir à un règlement équitable. Cette annonce est saluée par le Royaume-Uni, qui poursuit ses efforts pour obtenir un soutien international à sa position."
 Ajax_USA.6.d:0 "Le président des États-Unis a informé le Conseil de sécurité nationale que l'Amérique n'interviendrait pas militairement en Iran. Il a exprimé l'espoir que la Grande-Bretagne et l'Iran puissent résoudre leurs différends pacifiquement. À ce stade, une escalade militaire ne ferait qu'aggraver les souffrances et ternirait considérablement l'image des États-Unis à l'étranger. Le gouvernement britannique a également été informé de cette décision et devrait se montrer déçu. Si la Grande-Bretagne lançait ses propres opérations militaires, elle risquerait de provoquer une réaction américaine négative."
 Ajax_USA.15.d:0 "Le président a chargé le département d'État de critiquer l'ingérence britannique dans les affaires iraniennes. Les États-Unis ne peuvent tolérer une telle ingérence flagrante, car elle risque d'exacerber les tensions dans la région et d'affaiblir le prestige occidental auprès des États postcoloniaux. La CIA a reçu l'ordre de cesser toute coopération avec les Britanniques concernant les opérations de renseignement en Iran. Si les Britanniques persistent dans leur voie, ils devront agir seuls."
 Ajax_USA.7.d:0 "L'échec des Britanniques à renverser le gouvernement iranien les a incités à envisager des mesures plus radicales pour empêcher la nationalisation du pétrole et une nouvelle atteinte aux précieux intérêts occidentaux dans le pays. Les Britanniques nous appellent désormais à les soutenir militairement et politiquement dans une invasion de l'Iran. Soutenir une invasion et un nouveau régime permettrait de consolider le contrôle occidental sur un État régional clé et de renforcer les liens britanniques. Les Britanniques affirment également que le gouvernement iranien actuel est proche du parti communiste Tudeh et que, s'il n'est pas renversé, l'Iran pourrait être victime d'un coup d'État communiste orchestré par les Soviétiques. Cependant, une telle invasion pourrait avoir d'autres conséquences, comme la radicalisation de l'opposition iranienne à notre égard et la survenue d'une réaction régionale plus large. La réaction potentielle des Soviétiques doit également être prise en compte."
 Ajax_USA.8.d:0 "Les États-Unis ont accepté notre proposition de renverser le gouvernement iranien par une action militaire. Le régime actuel de Téhéran est manifestement sous l'emprise du parti pro-soviétique Tudeh. Ce n'est qu'une question de temps avant qu'un coup d'État orchestré par les Soviétiques ne fasse de l'Iran un satellite de l'URSS. Si cela se produisait, les Soviétiques seraient au cœur du Moyen-Orient. Les nationalisations et les manifestations anti-britanniques témoignent de l'influence communiste. Avec le soutien américain, nous pouvons espérer une victoire rapide et une couverture diplomatique pour nos opérations."
 Ajax_USA.9.d:0 "Les États-Unis ont rejeté notre proposition de renverser le gouvernement iranien par une intervention militaire. Le régime actuel de Téhéran est manifestement sous l'emprise du parti pro-soviétique Tudeh. Ce n'est qu'une question de temps avant qu'un coup d'État orchestré par les Soviétiques ne fasse de l'Iran un satellite soviétique. Si cela se produisait, les Soviétiques seraient au cœur du Moyen-Orient. Les Américains choisissent d'ignorer les dangereuses implications des récentes nationalisations et des manifestations anti-britanniques. Si nécessaire, nous pourrions être amenés à éliminer nous-mêmes la menace iranienne, mais cela suscitera probablement des objections diplomatiques américaines."
 Containment_Policy.1.d:0 "Le plus grand défi à l'ordre mondial est la montée des mouvements communistes radicaux en Europe et en Asie après 1945. L'Union soviétique soutient ouvertement ces efforts et fournit armes, formation et argent à ces organisations pour subvertir et renverser les régimes démocratiques. Dans les territoires sous occupation militaire soviétique, elle a purgé les partis politiques non communistes et instauré par la force des régimes communistes. Pour lutter contre ce phénomène, les États-Unis nouent des alliances entre les États de première ligne face aux communistes et encouragent la défense collective. L'aide militaire, économique et politique américaine protégera ces États des menaces communistes, qu'elles soient déclarées ou dissimulées. L'objectif est d'encercler le monde communiste et d'empêcher son expansion."
 USA_CWC.1.d:0 "La guerre civile chinoise fait rage et la République de Chine lutte pour contenir la République populaire de Chine communiste. Des années de conflits internes et la Seconde Guerre mondiale ont considérablement affaibli la République de Chine. Nous devons examiner les différentes options qui s'offrent à nous. L'une d'elles consiste à laisser les choses suivre leur cours ; notre intervention risquerait alors de prolonger les combats, de renforcer les communistes ou d'affaiblir nos propres forces. Une autre option est de saisir les Nations Unies afin de mobiliser la coopération internationale pour résoudre le conflit en faveur de la République de Chine. Enfin, nous pouvons intervenir directement. Nous pouvons fournir des conseillers, du matériel et, si nécessaire, une intervention militaire pour sauver le peuple chinois de la tyrannie communiste."
 USA_CWC.2.d:0 "Nous avons appris des États-Unis qu'ils sollicitaient notre soutien pour organiser un groupe d'unités de volontaires sous l'égide du bloc occidental, afin d'intervenir dans la guerre civile si une résolution prévoyant une action policière échouait. Il est clair que la chute du régime nationaliste pourrait avoir un impact radical sur notre action en Asie, même si le sauvetage de ce régime serait difficile à l'heure actuelle. Nous devons répondre rapidement aux pressions américaines."
 USA_ROC.1.d:0 "Nous avons appris que Sun Li-Jen a accepté notre proposition de renverser Chiang Kai-shek avec l'aide de la CIA et de l'utiliser pour remplacer son gouvernement despotique par le sien. Il a personnellement choisi un groupe restreint de conseillers pro-américains au sein du Kuomintang pour l'aider à former un nouveau gouvernement le moment venu."
 CCW_USA.10.d:0 "Dans un discours empreint de gravité, le Président a informé le peuple américain de l'intervention militaire des États-Unis dans la guerre civile chinoise. Il a rappelé que la République de Chine avait été une alliée fidèle des États-Unis durant le dernier conflit, résistant avec force à l'Empire japonais au prix de lourdes pertes. Il a également souligné les liens étroits tissés entre les deux camps pendant la guerre, notamment le sacrifice de nombreuses vies chinoises pour protéger et accueillir les aviateurs américains. Il a conclu en affirmant que les communistes cherchaient à exploiter une nation chinoise épuisée par leurs opérations néfastes et que le peuple chinois avait besoin de l'aide directe des États-Unis pour garantir sa liberté."
 CCW_USA.11.d:0 "Dans une décision historique, le département d'État américain a publié aujourd'hui le « Livre blanc sur la Chine », une analyse inédite de 1 054 pages de la politique étrangère américaine envers la Chine de 1944 à 1949. Ce document, intitulé officiellement « Relations des États-Unis avec la Chine : avec une attention particulière à la période 1944-1949 », a été commandé par le secrétaire d'État Dean Acheson et met en lumière les complexités diplomatiques et militaires qui ont façonné les relations tumultueuses des États-Unis avec la Chine. Cette publication intervient dans un contexte de fortes tensions et d'incertitudes, alors que les forces communistes de Mao Zedong remportent des victoires significatives sur le Kuomintang (KMT) et progressent inexorablement vers la prise de contrôle de la Chine continentale. Malgré des années de soutien financier et militaire américain au gouvernement nationaliste de Tchang Kaï-chek, les communistes ont pris l'ascendant, suscitant des inquiétudes croissantes quant aux conséquences pour les intérêts américains en Asie."
 CWC_Police_Action.1.d:0 "Les États-Unis ont présenté une résolution au Conseil de sécurité des Nations Unies demandant une intervention policière contre la République populaire de Chine (RPC). Ils affirment que la RPC viole continuellement les normes internationales et commet de graves crimes contre sa population. Un vote favorable à l'ONU légitimerait une action militaire contre la RPC et contribuerait à la formation d'une coalition internationale. Le seul obstacle à cette résolution est l'Union soviétique, qui dispose d'un droit de veto au Conseil de sécurité."
 CWC_Police_Action.2.d:0 "Les États-Unis ont récemment présenté une résolution au Conseil de sécurité des Nations Unies appelant à une intervention policière contre la République populaire de Chine (RPC). Ils cherchent ainsi à obtenir un consensus international sur cette opération militaire. La RPC est un État communiste, mais ses dirigeants ont parfois fait preuve d'instabilité et ont manifesté la volonté de contester à terme notre leadership au sein du monde communiste. Ils ont même remis en question notre voie révolutionnaire. Il pourrait être dans notre intérêt de nous abstenir et de laisser nos deux rivaux s'affaiblir par un conflit armé. Cependant, la Chine est un État communiste majeur et ne pas utiliser notre droit de veto pourrait entraîner un revers important pour le communisme en Asie."
 CWC_Police_Action.3.d:0 "L'Union soviétique a utilisé son droit de veto pour bloquer la résolution américaine appelant à une intervention policière contre la République populaire de Chine (RPC). C'est un revers majeur pour les Américains qui espéraient obtenir un soutien international à une action militaire. Les autres États communistes saluent notre action, qui défend le socialisme. L'Occident sera sans doute furieux, mais ce n'est pas la première fois. La RPC a également exprimé sa satisfaction et nous pouvons espérer une amélioration de nos relations dans un avenir proche."
 CWC_Police_Action.4.d:0 "Contre toute attente, l'Union soviétique a choisi de s'abstenir lors du vote de la résolution du Conseil de sécurité des Nations Unies appelant à une intervention policière contre la République populaire de Chine (RPC). Il s'agit d'une victoire majeure pour les États-Unis, à l'origine de cette résolution. Bien que les alliés de l'Union soviétique ne condamnent pas ouvertement cette action, de nombreux mouvements de gauche et communistes ont déjà exprimé leur indignation. La RPC a également condamné la décision soviétique et remet ouvertement en question la légitimité révolutionnaire de l'URSS. Les États-Unis pourront désormais mettre en œuvre leurs objectifs militaires à l'égard de la RPC."
 USA_VIE50s.3.d:0 "Le directeur de la CIA a présenté au Président un plan visant à truquer les élections de réunification au Vietnam en notre faveur. Nous avons établi un réseau de renseignement relativement efficace dans le pays. Ce plan prévoit des versements d'argent, des incitations et une manipulation clandestine des votes afin d'assurer une victoire démocratique au peuple vietnamien. Cependant, une telle opération pourrait être découverte et avoir des conséquences dramatiques dans la région. Ne pas agir risquerait de nous faire perdre le pays tout entier, voire toute la région, face à une nouvelle vague de communisme."
 Vietnam_RefferendumAH.5.d:0 "Le peuple vietnamien a voté contre la réunification. Il semble que les Sud-Vietnamiens ne souhaitent pas être unifiés et placés sous le contrôle du Nord-Vietnam communiste. Ces résultats sont salués par le gouvernement sud-vietnamien, soutenu par les États-Unis, qui a accusé le gouvernement nord-vietnamien de manquer de sincérité dans la tenue d'élections libres. Le gouvernement nord-vietnamien a accusé le Sud et ses alliés d'avoir manipulé les résultats pour empêcher la réunification et l'établissement d'un véritable gouvernement représentant le peuple vietnamien. Il appelle tous les Vietnamiens à exprimer leur mécontentement et s'engage à redoubler d'efforts pour libérer tout le peuple vietnamien."
 USA_VIE50s.2.d:0 "Les États-Unis ont approuvé le plan d'élections de réunification au Vietnam, issu des accords de Genève récemment signés. Cet accord fait suite aux assurances données par le Nord communiste que le scrutin serait supervisé par des observateurs internationaux. Notre accord implique que les Sud-Vietnamiens devront s'y conformer malgré leurs réserves. La CIA affirme également ne pas savoir comment le scrutin se déroulera. Quoi qu'il en soit, refuser ces élections risque d'accroître l'impopularité du gouvernement du Sud et de rallier massivement l'opinion publique vietnamienne aux communistes, qui prétendent représenter la nation."
 USA_VIE50s.4.d:0 "Suite aux élections de réunification, le peuple vietnamien a choisi de s'unir sous un gouvernement de coalition entre le Nord communiste et le Sud non communiste. Des milliers de personnes sont descendues dans la rue pour célébrer cette victoire ; beaucoup de Vietnamiens y voient la fin de leur lutte pour la paix et l'indépendance. La CIA estime que la coalition semble stable pour le moment, mais prévient qu'elle pourrait se désagréger rapidement si l'un ou l'autre camp cherche à étendre son influence. Nous suivrons la situation de près et veillerons à ce que les communistes n'en profitent pas pour perpétrer un coup d'État et s'emparer du pouvoir, privant ainsi le peuple vietnamien épris de liberté de ses pouvoirs."
 USA_VIE50s.8.d:0 "Les États-Unis soutiendront le Sud-Vietnam dans son rejet des accords de Genève. Les Sud-Vietnamiens estiment que cet accord offre aux communistes une base pour déstabiliser leur gouvernement. Plus important encore, les propositions d'élections de réunification sont inacceptables, car les communistes manipuleront sans aucun doute le scrutin à leur avantage, par tous les moyens à leur disposition. La CIA partage cette analyse et, afin d'éviter l'isolement du Sud-Vietnam, nous soutenons pleinement sa position. Les communistes devront faire des compromis acceptables et garantir l'absence de subversion pour qu'un accord durable puisse être conclu."
 American_Aid.5.d:0 "Le président a ordonné au département de la Défense et au département d'État de réorienter l'aide initialement destinée à la France vers la Corée et le Japon. Les États-Unis ont jugé qu'il était bien plus important d'apporter un soutien accru à l'Asie que de se concentrer autant sur l'Europe. La France est une nation développée et forte ; elle ne sera pas fortement pénalisée, même si le gouvernement français réagira probablement mal à notre décision. Les gouvernements japonais et coréen expriment déjà leur gratitude pour ce renforcement de notre soutien. Ces deux pays sont des États clés en première ligne dans la lutte contre le communisme et doivent être soutenus."
 American_Aid.6.d:0 "Les États-Unis ont annoncé le transfert de l'aide initialement destinée à la Grande-Bretagne, à l'Australie et aux autres États du Commonwealth vers l'Inde, le Pakistan et les Philippines. Le gouvernement américain reconnaît que ces États sont menacés par l'influence soviétique et qu'il est impératif de contrer cette menace. Les États du Commonwealth seront mécontents de cette décision, mais elle n'aura pas d'impact majeur sur eux. Cette mesure souligne notre volonté de consolider notre influence en Asie du Sud et dans le Pacifique."
 American_Aid.1.d:0 "La loi sur la sécurité mutuelle a récemment été adoptée par le Congrès. Ce nouveau programme d'aide étrangère permettra aux États-Unis d'octroyer aide et subventions aux États amis. Ce soutien contribuera au développement de leurs capacités et leur permettra de mieux résister à l'influence communiste. Contrairement aux programmes précédents, ce soutien ne sera pas limité à une région ou un État en particulier. Il offrira au président une plus grande latitude et renforcera le département d'État dans la poursuite des efforts diplomatiques visant à préserver l'influence américaine face à une politique étrangère soviétique de plus en plus belliqueuse."
 USA_Korean_War.10.d:0 "Les États-Unis ont déclaré la guerre à la République populaire de Chine. L'intervention de la Chine communiste dans ce conflit a entraîné des pertes considérables pour les deux camps et de violents combats entre les forces chinoises et américaines. Le président s'est adressé au Congrès et a dénoncé le soutien manifeste de la Chine aux Nord-Coréens. Le déploiement de troupes chinoises, d'armements lourds et d'avions de combat témoigne de leur détermination à mener une guerre ouverte contre les États-Unis. Ne pas déclarer la guerre donnerait à la Chine toute la latitude et l'avantage, laissant les troupes américaines en Corée vulnérables. En revanche, une déclaration de guerre permettrait aux États-Unis d'élargir leurs options et de demander des comptes au régime communiste chinois. Suite à cette déclaration, le Congrès a voté à une large majorité en faveur de la déclaration de guerre."
 CCW_USA.5.d:0 "Les États-Unis ont appelé la communauté internationale à intervenir pour fournir une aide humanitaire indispensable à la République populaire de Chine. Le représentant américain auprès des Nations Unies a souligné que le peuple chinois subit des décennies de guerre civile et de conflits armés, et que les communistes, au lieu de s'unir pour la paix, cherchent à exploiter cet épuisement à leur profit. L'aide humanitaire permettrait de soulager le peuple et le gouvernement chinois face aux défis militaires, tout en assurant les services essentiels à la population. La République populaire de Chine, par l'intermédiaire de ses alliés communistes, a condamné la demande américaine, la qualifiant de tentative de faire financer l'effort de guerre chinois par la communauté internationale."
 CWC_Police_Action.0.d:0 "Alors que les informations en provenance de Chine continuent de dépeindre une République de Chine assiégée, perdant du terrain face à la République populaire de Chine communiste, les rumeurs d'une possible intervention américaine se multiplient. Les sujets liés à la Chine domineraient les réunions au Pentagone, à la Maison Blanche et au sein des agences de renseignement. Des officiers américains ayant servi en Chine pendant la guerre sont rappelés ou redéployés au Pentagone. Lors de conférences de presse, les responsables gouvernementaux expriment constamment leur inquiétude quant aux répercussions internationales d'une victoire communiste en Chine. Ces informations suscitent des craintes à Moscou et dans d'autres États communistes, qui redoutent une intervention imminente des États-Unis dans la guerre civile chinoise, au risque d'une escalade internationale dramatique du conflit."
 American_Ceasefire_Request.1.d:0 "Les États-Unis ont demandé un cessez-le-feu dans le conflit coréen. L'arrivée de nos forces a fait basculer le rapport de force en défaveur des Américains capitalistes et de leurs forces fantoches. Il est clair qu'ils ne voient aucune possibilité de victoire et ne demandent pas l'arrêt des combats. Certains de nos conseillers les plus importants estiment qu'il s'agit d'une opportunité et que nous devrions redoubler d'efforts pour remporter une victoire totale. Un autre groupe de conseillers considère que la Chine a démontré son engagement envers la révolution mondiale et a apporté une aide immense, tant humaine que financière. Ils soutiennent que nous devrions accepter le cessez-le-feu et nous concentrer sur la construction de notre État socialiste afin de pouvoir frapper les Américains lorsque nous serons au sommet de notre puissance."
 American_Ceasefire_Request.2.d:0 "Nous avons récemment adressé une demande de cessez-le-feu aux Chinois. Ces derniers maintiennent efficacement les forces communistes unies et un cessez-le-feu de leur part mettrait fin aux combats. Cependant, les Chinois ont imprudemment refusé cette demande. Ils semblent croire la victoire imminente. Or, nos troupes sont parfaitement capables de les repousser et de les punir pour leur erreur. Face à ce refus, nos commandants planifient de nouvelles opérations afin de démontrer à la Chine que la victoire est impossible."
 American_Ceasefire_Request.3.d:0 "Nous avons récemment adressé une demande de cessez-le-feu aux autorités chinoises. Celles-ci maintiennent efficacement la cohésion des forces communistes et un cessez-le-feu de leur part mettrait fin aux combats. Notre demande a été acceptée et une réunion entre les commandants de première ligne est en cours d'organisation afin d'assurer un désengagement sans heurts. Les forces des Nations Unies et les troupes américaines ont combattu avec bravoure malgré une situation désespérée. Les Chinois sont sans doute parvenus à la même conclusion : la poursuite des combats est vaine et ne fera qu'affaiblir davantage leurs forces."
 American_Ceasefire_Request.4.d:0 "Les violents combats en Corée semblent toucher à leur fin suite à l'annonce d'un cessez-le-feu entre les deux camps. La guerre a débuté par l'invasion de la Corée du Sud par la Corée du Nord communiste. Cette invasion a provoqué l'intervention des États-Unis, qui ont déployé des forces alliées sous mandat des Nations Unies pour défendre le Sud. Les combats ont rapidement dégénéré en un conflit régional majeur, qui s'est récemment enlisé dans une impasse, aucun des deux camps n'ayant réussi à remporter une victoire décisive. Ce cessez-le-feu est salué par les deux parties, et les populations des deux Corées poussent sans aucun doute un soupir de soulagement face à la fin des combats."
 PRC_USA_KOR.1.d:0 "Par des voies détournées, les États-Unis ont indiqué qu'ils lanceraient prochainement des armes nucléaires contre notre nation si nous ne nous retirions pas du conflit coréen. Il s'agit d'une menace audacieuse émanant soit d'un régime capitaliste désespéré, soit d'un régime assoiffé de sang. Certains de nos hauts responsables estiment qu'il s'agit d'une manœuvre désespérée, car nos forces ont mis les capitalistes et leurs marionnettes en déroute. S'arrêter maintenant serait une folie et leur donnerait la possibilité d'utiliser le chantage nucléaire dans d'autres conflits, comme la bataille pour Taipei. Cependant, d'autres responsables pensent que la menace est réelle et correspond à la volonté américaine de gagner à tout prix. Ils affirment que notre intervention initiale démontre l'engagement de la Chine en faveur d'une révolution mondiale et qu'un retrait immédiat ne rendrait pas la Chine vulnérable, mais lui donnerait au contraire le temps de contrer le chantage nucléaire. Nous devons soit rester et combattre, soit nous retirer de manière tactique."
 PRC_USA_KOR.4.d:0 "La Chine a rejeté nos menaces de recourir à l'arme nucléaire. Elle semble croire que nous bluffons et que nous refusons d'utiliser l'arme nucléaire dans ce conflit. Le Pentagone est prêt à entamer la préparation des premières frappes nucléaires et des cibles. L'utilisation de ces armes pourrait renverser le cours de la guerre, réduire nos pertes et peut-être contraindre la Chine à la capitulation. Cependant, certains de nos hauts responsables de la défense se montrent prudents. Ils craignent les conséquences de frappes nucléaires en Corée : un conflit plus large, voire une réaction soviétique, pourraient en découler. On craint également que notre décision d'utiliser l'arme nucléaire dans un conflit régional de faible ampleur ne crée un précédent incitant d'autres États à agir de même. Nous devons choisir : intensifier le conflit ou renoncer à nos menaces."
 PRC_USA_KOR.2.d:0 "Le gouvernement chinois, par des voies diplomatiques officieuses, a indiqué avoir entendu notre avertissement et qu'il entamerait prochainement le retrait de ses forces de Corée. La Chine précise qu'il s'agit d'un retrait tactique et nous a enjoints de rester à l'écart de sa frontière. C'est une victoire majeure pour nous et, une fois le retrait chinois effectif, l'équilibre des forces en Corée basculera en notre faveur. Plus important encore, cela démontre notre capacité à utiliser tactiquement la menace de notre arsenal nucléaire pour obtenir des avantages diplomatiques et militaires à l'étranger. Nombreux sont ceux, au Pentagone, qui se réjouissent de constater que leur investissement dans le développement de l'arsenal nucléaire a porté ses fruits et a probablement permis de sauver la vie de nombreux soldats américains."
 PRC_USA_KOR.3.d:0 "Dans une annonce surprise, la République populaire de Chine a déclaré avoir atteint ses objectifs de défense contre les incursions capitalistes et entamer immédiatement le retrait de ses forces de Corée. Le gouvernement chinois a ajouté que toute nouvelle incursion serait traitée avec la plus grande fermeté. Les États-Unis et leurs alliés accueilleront favorablement cette nouvelle, car elle fait basculer l'équilibre militaire en leur faveur. Les alliés de la Chine restent perplexes, tandis que des rumeurs circulent selon lesquelles la décision chinoise serait liée aux menaces américaines d'utiliser l'arme nucléaire dans le conflit."
 PRC_USA_KOR.10.d:0 "Après un conflit acharné, déclenché par une invasion non provoquée de la Corée du Nord, la République de Corée a triomphé. Grâce au soutien des forces des Nations Unies menées par les États-Unis, la Corée est enfin réunifiée. Pour la première fois depuis le XIXe siècle, la Corée est un État uni et indépendant. Le gouvernement coréen a annoncé le lancement prochain d'un programme de décommunisme et l'éradication de tous les vestiges de l'ancien régime. Cette victoire n'a été possible qu'après le retrait des forces chinoises du conflit, ce qui a fait basculer l'équilibre des forces en faveur des États-Unis et de leurs alliés."
 USA_VIE50s.10.d:0 "Le référendum sur la future réunification du Vietnam aura lieu prochainement. Le gouvernement doit décider s'il acceptera ou rejettera les résultats. Les communistes disposent d'une puissante machine de propagande et d'un important programme de mobilisation populaire. Cette infiltration des campagnes, conjuguée à leur contrôle totalitaire du Nord, laisse penser qu'ils pourraient manipuler massivement le scrutin. Cependant, ils ont promis de garantir le bon déroulement du vote sous la supervision d'observateurs internationaux. Rejeter les résultats nous aliénerait nos alliés internationaux et, si nous condamnons le scrutin prématurément et obtenons finalement un résultat positif, ce serait une grave erreur. Le gouvernement doit donc déterminer si l'on peut faire confiance à ces élections."
 CWC_Police_Action.5.d:0 "Les États-Unis ont annoncé que leurs forces avaient lancé une opération de police contre la République populaire de Chine. Le gouvernement américain continue d'affirmer que la RPC mène une guerre d'agression aveugle et arbitraire contre la République de Chine. L'intervention militaire américaine vise uniquement à mettre fin à cette agression et à rétablir la paix pour le peuple chinois. Le gouvernement communiste chinois a condamné l'intervention américaine, la comparant à la diplomatie de la canonnière de l'époque coloniale et à une tentative de colonisation de la Chine. La République de Chine a salué l'intervention américaine et a critiqué la RPC pour sa propagande flagrante."
 CWC_Police_Action.6.d:0 "Les États-Unis ont publiquement exhorté leurs forces et celles du bloc occidental à intervenir en faveur du Kuomintang dans la guerre civile chinoise, suite à l'échec de la résolution prévoyant une opération de police. Le gouvernement américain continue d'affirmer que la République populaire de Chine (RPC) mène une guerre d'agression aveugle et indiscriminée contre la République de Chine. L'intervention militaire américaine vise uniquement à mettre fin à cette agression et à rétablir la paix pour le peuple chinois. Le gouvernement communiste chinois a condamné l'intervention américaine, la comparant à la diplomatie de la canonnière de l'époque coloniale et la qualifiant de tentative de colonisation de la Chine. La République de Chine a salué l'intervention américaine et a critiqué la RPC pour sa propagande flagrante."
 Ajax_USA.16.d:0 "Une force militaire conjointe anglo-américaine a lancé une offensive en Iran. Il s'agit de la deuxième intervention militaire britannique en Iran depuis 1939, en réponse à la décision iranienne de nationaliser son industrie pétrolière. Les États-Unis soutiennent les revendications britanniques concernant la saisie illégale de leurs intérêts. Ils appuient également la position britannique selon laquelle le gouvernement iranien actuel risque une prise de pouvoir communiste, voire est déjà sous contrôle communiste clandestin. Les chefs militaires à Washington et à Londres se disent confiants dans une victoire militaire rapide. Le gouvernement iranien a condamné l'intervention et appelle la communauté internationale à soutenir l'Iran face à une invasion impérialiste."
 KW_EARLY.5.d:0 "La guerre de Corée a pris fin suite à l'annonce d'un cessez-le-feu entre la Corée du Nord et les Nations Unies. Le conflit avait débuté par une invasion surprise de la Corée du Sud par la Corée du Nord. Le gouvernement communiste nord-coréen cherchait à réunifier la Corée par la force. Cependant, les Nations Unies ont voté en faveur d'une intervention menée par les États-Unis. Après de violents combats, le conflit s'était enlisé dans une impasse sanglante. Aucun des deux camps n'étant parvenu à prendre l'avantage, un cessez-le-feu a été signé, rétablissant les frontières d'avant-guerre. La communauté internationale a largement salué la fin des combats."
 KW_EARLY.6.d:0 "Les Américains perfides et leurs alliés fantoches ont refusé notre juste demande de rapatriement de tous les prisonniers de guerre. Ils insistent pour que chaque prisonnier ait le choix entre le rapatriement et le maintien dans le Sud corrompu. Nul doute que leur vaste campagne de propagande a porté ses fruits, et ils s'en serviront pour nous discréditer. Nombreux sont ceux, au sein du Comité central, qui pensent que la seule solution est de poursuivre la guerre. Une fois l'ennemi suffisamment affaibli, ils céderont à leur position absurde. D'autres, en revanche, estiment que les combats ont assez duré et que nous devons faire confiance à la vigueur révolutionnaire de nos hommes. Ils nous exhortent à abandonner notre exigence et à mettre fin aux combats afin d'entamer la reconstruction de notre nation. À leurs yeux, ceux qui refusent de rentrer sont des traîtres depuis le début et seront punis une fois l'unification de notre peuple achevée."
 KW_EARLY.1.d:0 "Les États-Unis, véritables marionnettistes de la Corée du Sud, ont récemment entamé des négociations de cessez-le-feu avec nos forces. Notre esprit révolutionnaire et notre résistance ont mis en échec leurs desseins funestes. Leur immense richesse et leur armement sophistiqué n'ont pu vaincre nos forces. À l'heure actuelle, ils détiennent des dizaines de milliers de nos camarades dans des camps de prisonniers où ils subissent une propagande intensive. Avant tout cessez-le-feu, nous exigerons le retour de ces hommes chez eux. Les Américains insistent sur le fait qu'ils ne rapatrieront aucun prisonnier de guerre de force, mais les pourparlers ne peuvent reprendre tant qu'ils ne l'auront pas fait."
 KW_EARLY.2.d:0 "Nos négociations avec la Corée du Nord concernant un accord de cessez-le-feu sont au point mort. Les Nord-Coréens insistent pour que nous rapatriions tous leurs prisonniers de guerre. Cela contrevient à notre position actuelle, selon laquelle chaque prisonnier doit avoir le choix de rester ou d'être renvoyé. Nombre d'entre eux craignent d'être torturés, voire tués, s'ils sont contraints de rentrer. D'autres se sont convertis au christianisme et redoutent des persécutions religieuses en cas de retour. Céder aux exigences communistes accélérerait la fin du conflit, mais cela irait à l'encontre de tous nos principes et nous aliénerait l'opinion publique américaine. Nous pouvons aussi maintenir notre position jusqu'à ce que les Nord-Coréens abandonnent cette exigence ; ils subissent de plein fouet les conséquences de la guerre et finiront probablement par céder."
 KW_EARLY.3.d:0 "Les larbins des capitalistes ont accédé à notre juste demande de libération de tous nos prisonniers de guerre. Leur plan visant à instrumentaliser nos camarades à des fins de propagande et à saper notre révolution a été déjoué. Dès le retour de nos hommes, nous pourrons entamer les séances de débriefing et de rééducation nécessaires. Cela lèvera les derniers obstacles à nos négociations de cessez-le-feu. Bientôt, ce long combat prendra fin. Nous pourrons alors commencer la reconstruction de notre nation et nous préparer à mener à bien la mission sacrée que nous avons entreprise."
 KW_EARLY.4.d:0 "Après des négociations difficiles, les Nord-Coréens ont finalement accepté un cessez-le-feu. Notre long combat en Corée est terminé. Le peuple américain peut être fier que ses soldats aient accompli leur devoir et que notre gouvernement ait rempli ses engagements envers la mission des Nations Unies. Malgré des chances désespérées, face à une force communiste écrasante, nos hommes ont tenu bon. Les États-Unis ont démontré qu'ils seraient prêts à contrer l'expansion communiste violente où qu'elle se produise. Le communisme international y réfléchira à deux fois avant de menacer une nation libre."
 USA_1952_Buildup.1.d:0 "Les dirigeants du Parti démocrate sont de plus en plus préoccupés par la popularité grandissante du général Douglas MacArthur, principal candidat républicain à la présidence. Pour contrer ce héros de guerre, le général Dwig D. Eisenhower est approché pour devenir le candidat démocrate. Le général Eisenhower est peut-être le seul officier dont les exploits durant la guerre aient égalé, voire surpassé, ceux de MacArthur. Eisenhower jouit également d'une popularité bien plus importante auprès des instances dirigeantes de Washington et du Pentagone. Les démocrates espèrent que leur candidat, un héros de guerre, parviendra à vaincre le candidat républicain."
 USA_1952_Buildup.2.d:0 "Le général Douglas MacArthur s'impose rapidement comme le candidat républicain le plus sérieux à la présidence. Son statut de héros de guerre et son charisme naturel font de lui un candidat très attractif pour les électeurs. Au sein de l'establishment républicain, MacArthur est perçu avec méfiance, et un nouveau mouvement se met en place pour rallier le soutien de cet establishment à un candidat capable de le défier. Les trois options envisagées sont les gouverneurs Thomas Dewey, Harold Stassen et Earl Warren. Tous trois sont des personnalités politiques confirmées, capables de manœuvrer au sein du système politique et de collaborer avec l'opposition. Les dirigeants républicains estiment que le choix de l'un de ces trois candidats, afin de fédérer le soutien de l'establishment, pourrait permettre de vaincre MacArthur et de présenter un candidat à la présidence capable de rassembler tous les Américains."
 Decolonization_VIE.1.d:0 "Les États-Unis ont pris la décision inhabituelle d'appeler publiquement à des élections libres au Vietnam. Cette initiative fait suite à la défaite du Viet Minh, parti communiste, face au gouvernement. La position américaine témoigne de son soutien au respect des aspirations du peuple vietnamien, même si ces élections voient la montée en puissance des pro-communistes. Elle reflète le récent engagement américain en faveur de la décolonisation et de l'autodétermination. Le gouvernement américain estime que sa politique renforcera le soutien international aux États-Unis et, à terme, conduira à des relations plus solides et à des alliances plus stables."
 AmericanOffer.4.d:0 "À l'issue d'intenses négociations, les gouvernements du Nord et du Sud-Vietnam ont convenu de réunifier le pays. Un nouveau gouvernement de coalition d'union nationale sera mis en place. Ce nouvel État s'engage à reconstruire les territoires détruits par les récents conflits et à jeter les bases d'un Vietnam fort et indépendant. Sur le plan de la politique étrangère, il promet de ne pas s'immiscer dans les conflits internationaux et de ne pas devenir un État client. Le Vietnam adoptera une position non alignée et se montrera ami de tous. Cette nouvelle est perçue comme une grande victoire diplomatique pour tous les États ayant participé aux négociations, notamment les États-Unis, l'Union soviétique et la France."
 AmericanOffer.1.d:0 "Les États-Unis, par des manœuvres diplomatiques discrètes, ont soumis une offre privée à notre gouvernement. Ils se sont engagés à retirer leur opposition à la réunification à condition que nous garantissions notre non-alignement en matière de politique étrangère. Si nous acceptons la proposition américaine, les Sud-Vietnamiens n'auront d'autre choix que d'accepter les élections et nous atteindrons probablement notre objectif d'un Vietnam unifié et indépendant. Cependant, accepter leur demande impliquerait un compromis sur notre politique étrangère. Le Politburo est divisé sur cette offre. Une faction préconise de l'accepter, car cela garantirait une unification rapide du pays et la mise en œuvre de la révolution à travers le Vietnam. L'autre faction perçoit cette offre comme un signe de faiblesse américaine et estime que sacrifier notre politique étrangère compromettrait toute indépendance. Elle nous exhorte à poursuivre nos efforts pour une indépendance totale. Ce débat doit trouver une conclusion…"
 AmericanOffer.2.d:0 "Notre proposition de soutenir la réunification en échange d'un Vietnam non aligné a été acceptée par les Nord-Vietnamiens. Cela semble confirmer certaines de nos informations selon lesquelles, bien que communistes, ils sont bien plus soucieux de garantir et de promouvoir l'indépendance et l'identité nationale vietnamiennes. Même si la solution n'est pas idéale, nous avons réussi à empêcher le Vietnam de devenir un bastion de l'expansion communiste et soviétique dans la région."
 AmericanOffer.3.d:0 "Notre proposition de soutenir la réunification en échange d'un Vietnam non aligné a été rejetée par le Nord-Vietnam. Cette décision n'étonne guère nos experts du renseignement, qui considèrent depuis longtemps ce régime comme une façade du communisme international. Ce rejet confirme qu'ils ne sont pas une force nationaliste et anticoloniale, contrairement à ce qu'ils prétendent. Leur objectif ultime est de soumettre tous les Vietnamiens à leur emprise oppressive et d'utiliser le Vietnam comme base pour répandre le communisme dans toute la région. Nous devrions envisager de renforcer notre soutien au Sud-Vietnam."
 USA_INDO.1.d:0 "Lors d'une récente visite, le président américain a dépêché son secrétaire d'État pour transmettre un message à notre gouvernement. Les Américains estiment que la situation actuelle en Indochine se détériore et que la poursuite de nos opérations ne peut que mener au désastre. Ils nous exhortent à envisager et à entamer une solution diplomatique au conflit. Bien que cela n'ait pas été explicitement dit, il a été sous-entendu que notre refus d'entamer des pourparlers pourrait entraîner une réduction de l'aide américaine, notamment militaire. Les hauts responsables de la défense estiment qu'un tel scénario serait catastrophique pour notre capacité à poursuivre les combats. Il est peut-être temps de mettre fin à cette guerre et de dépêcher nos plus hauts responsables diplomatiques et politiques afin d'engager le processus de négociations."
 nato_expansion.1.d:0 "Lors d'une récente conférence des dirigeants de l'OTAN, les discussions ont porté sur l'élargissement de l'organisation afin d'y intégrer davantage d'États en première ligne et de renforcer la défense collective de l'Europe libre. L'Allemagne de l'Ouest, la Grèce et la Turquie sont toutes confrontées aux forces communistes à leurs frontières et au risque de subversion. Laisser ces États à leur sort risquerait de les exposer à un renversement de situation et compromettrait la position de l'OTAN face à l'Union soviétique. Ces États pourraient être renforcés et protégés des menaces soviétiques, qu'elles soient déclarées ou dissimulées. Cependant, la proposition d'adhésion se heurte à des résistances : certains membres hésitent à inclure l'Allemagne de l'Ouest si peu de temps après la guerre. D'autres craignent que la Grèce et la Turquie ne deviennent un fardeau en raison de leur économie et de leurs forces armées plus faibles."
 nato_expansion.3.d:0 "L'OTAN nous a proposé d'adhérer à son organisation. En rejoignant l'OTAN, nous serions protégés par sa clause de défense mutuelle et aurions accès à des équipements militaires de pointe, à des formations et à un soutien économique. Cependant, l'adhésion à l'OTAN nous placerait exclusivement dans le camp américain et ferait de nous une cible directe de l'Union soviétique. Certains membres du gouvernement craignent également qu'un futur conflit n'entraîne la Turquie dans un conflit plus vaste. Les membres du gouvernement favorables à l'OTAN estiment que l'organisation est essentielle pour garantir l'indépendance de la Turquie et poursuivre la modernisation du pays. Ils soulignent que, sans la protection de l'OTAN, les Soviétiques ne feront qu'intensifier leurs efforts pour déstabiliser la Turquie. Les opposants estiment que l'adhésion à l'organisation éloigne le pays de la politique étrangère kémaliste qui a profité à la République pendant des décennies et risque d'entraîner la Turquie dans une guerre dévastatrice à l'avenir. Une décision doit être prise."
 nato_expansion.4.d:0 "La Turquie a annoncé son intention d'adhérer à l'OTAN. Cette annonce est perçue comme une victoire majeure pour l'organisation et la place directement aux portes de l'Union soviétique. Les membres de l'OTAN se réjouissent de l'intégration d'un État de première ligne doté d'une importance militaire, stratégique et géographique considérable. L'OTAN a salué cette décision et promis de protéger la Turquie et d'aider sa population à prospérer et à coopérer au sein de l'organisation. L'Union soviétique serait furieuse et craindrait que les États-Unis n'établissent prochainement des bases permettant de cibler le peuple soviétique. Le gouvernement turc espère que l'adhésion lui permettra d'accéder à un soutien militaire et économique accru."
 nato_expansion.5.d:0 "La Turquie a annoncé son refus d'adhérer à l'OTAN. Le gouvernement turc a déclaré que rejoindre l'organisation compromettrait des décennies de politique étrangère et risquerait d'entraîner le peuple turc dans une guerre qui ne le concerne pas. L'Union soviétique a salué la décision turque, la qualifiant de responsable et empreinte de bon voisinage. L'OTAN, et les États-Unis en particulier, seront profondément déçus de ne pas pouvoir accéder au territoire turc et à son important contingent militaire."
 nato_expansion.6.d:0 "L'OTAN nous a récemment proposé d'adhérer à l'organisation. Rejoindre l'OTAN nous placerait sous sa protection collective et nous donnerait accès à un soutien militaire, économique et politique. Le gouvernement devra débattre de l'opportunité d'adhérer ou non. Les partisans de l'adhésion soulignent que nous avons survécu de justesse à une tentative de coup d'État communiste, influencée par la subversion soviétique. Faire partie de l'OTAN nous offrirait une protection et accélérerait notre reconstruction après les combats. L'opposition affirme que la Grèce ne peut compter sur aucun autre État et qu'une adhésion à l'OTAN ne ferait qu'encourager la subversion soviétique. Elle estime que la Grèce a déjà suffisamment souffert ces dernières années et que rejoindre l'organisation risquerait de l'entraîner dans un futur conflit européen."
 nato_expansion.7.d:0 "Le Premier ministre grec a annoncé que le gouvernement avait accepté d'adhérer à l'OTAN. La Grèce devient ainsi le plus récent membre de cette alliance soutenue par les États-Unis. Le gouvernement grec a indiqué qu'il se réjouissait de nouer des liens étroits avec tous les États membres et d'assurer la protection de la Grèce contre toute menace extérieure. Les membres de l'OTAN se félicitent de cette annonce, les Américains étant intéressés par la possibilité d'établir des bases et des installations afin de mieux surveiller les activités soviétiques en Méditerranée orientale. Les Soviétiques seraient furieux et auraient protesté auprès de l'ambassadeur de Grèce à Moscou. Nombreux sont ceux qui, en Grèce, accueillent favorablement cette nouvelle, car elle offrirait une protection directe à une nation qui, il y a peu encore, a été la cible d'invasions étrangères puis d'une guerre civile."
 nato_expansion.8.d:0 "Le Premier ministre grec a annoncé que le gouvernement avait rejeté l'offre d'adhésion à l'OTAN. Cette nouvelle sera perçue comme un revers pour l'organisation, qui espérait consolider sa présence en Méditerranée orientale et contrer l'influence soviétique. L'Union soviétique a salué cette décision, y voyant un moyen d'apaiser les tensions internationales. Le gouvernement grec a justifié son refus par le fait que le peuple grec, encore en reconstruction, n'est pas en mesure d'assumer les responsabilités liées à une alliance militaire. Seul l'avenir dira si ce rejet témoigne de la neutralité de la Grèce ou d'un rapprochement avec le camp soviétique."
 nato_expansion.9.d:0 "Alors que les forces américaines, britanniques et françaises prévoient de mettre officiellement fin à leur occupation militaire de notre pays, elles nous ont proposé d'adhérer à l'OTAN. Cette adhésion scellerait notre intégration à la défense de l'Europe occidentale. Les Américains, en particulier, estiment que notre adhésion à l'OTAN est cruciale pour prévenir toute future agression soviétique. Rejoindre l'organisation faciliterait le réarmement de notre pays et nous permettrait de démontrer que l'Allemagne est une puissance garante de la démocratie et de la liberté en Europe. Cependant, certains membres du gouvernement nous incitent à rejeter cette proposition, soulignant que la France et la Grande-Bretagne hésitent à nous voir nous réarmer, ce qui pourrait engendrer des tensions. Plus important encore, ils craignent que notre adhésion à l'OTAN ne rende la réunification quasiment impossible, les Soviétiques nous considérant alors comme un allié des États-Unis."
 nato_expansion.10.d:0 "L'Allemagne de l'Ouest a officiellement accepté l'invitation à rejoindre l'OTAN. Cette décision représente une victoire majeure pour l'organisation. L'annonce a été accueillie froidement à Londres et à Paris, où beaucoup se méfient d'une Allemagne réarmée, même en tant qu'alliée. Les États-Unis, en revanche, ont chaleureusement salué la nouvelle, y voyant la preuve que l'Allemagne était réhabilitée et un partenaire dévoué à la démocratie. Pour les stratèges de l'OTAN, l'adhésion de l'Allemagne de l'Ouest renforce considérablement la défense de l'Europe occidentale, tant en termes de puissance militaire que de contrôle territorial. L'Union soviétique serait furieuse de cette annonce, accusant les États-Unis et l'OTAN de saboter tout espoir de réunification allemande et de paix en Europe."
 nato_expansion.11.d:0 "À la surprise générale, l'Allemagne de l'Ouest a rejeté son adhésion à l'OTAN. C'est un coup dur pour l'organisation qui comptait sur elle pour devenir un État clé en première ligne de la défense de l'Europe occidentale. La France et le Royaume-Uni ne semblent pas trop s'inquiéter publiquement de cette décision, car beaucoup, dans ces pays, craignaient les conséquences d'un réarmement de l'Allemagne de l'Ouest par l'OTAN, même en tant qu'alliée. Les États-Unis seraient très déçus, car ils ont exercé un lobbying intense pour l'adhésion de l'Allemagne de l'Ouest. De nombreux responsables américains s'inquiètent de ce que ce refus allemand puisse indiquer qu'ils cèdent aux fausses promesses soviétiques de soutien à une Allemagne unifiée et neutre. L'Union soviétique a réagi positivement à cette nouvelle, félicitant l'Allemagne de l'Ouest d'avoir contribué à réduire la menace d'une nouvelle guerre européenne."
 nato_expansion.12.d:0 "Alors que nous nous efforçons de consolider notre autorité sur le pays et d'empêcher une résurgence communiste, l'OTAN nous a proposé d'adhérer à l'organisation. Rejoindre l'OTAN nous donnerait accès à un soutien militaire, économique et de formation crucial. Cela nous offrirait également la protection de sa clause de sécurité collective, nous protégeant d'une invasion communiste étrangère. L'OTAN pourrait être le rempart derrière lequel nous bâtissons une Albanie forte. Cependant, l'adhésion à l'organisation risque d'inciter les communistes à intensifier leurs efforts de subversion et à attiser les troubles intérieurs. L'OTAN nous obligerait également à accueillir des troupes étrangères et à participer à des conflits qui ne souhaitent pas le peuple albanais. Nous devons donc décider si les avantages l'emportent sur les inconvénients."
 nato_expansion.13.d:0 "Le Royaume d'Albanie a indiqué son intention d'adhérer à l'OTAN dans les plus brefs délais. Le gouvernement albanais a souligné ses liens historiques avec les États membres et sa volonté de les renforcer davantage. Les membres de l'OTAN se réjouissent de cette nouvelle, beaucoup considérant l'Albanie comme un État de première ligne stratégique et une base pour contrer les régimes communistes dans les Balkans. Plus important encore, l'OTAN estime pouvoir désormais protéger l'Albanie d'une action communiste directe. L'Union soviétique, furieuse, accuse depuis longtemps le gouvernement albanais d'être une marionnette des États-Unis ayant usurpé le pouvoir illégalement, et affirme que le peuple albanais ne tolérera pas longtemps une telle oppression."
 nato_expansion.14.d:0 "Le Royaume d'Albanie a indiqué qu'il ne rejoindrait pas l'OTAN malgré l'offre d'adhésion. L'organisation sera sans doute profondément déçue, car beaucoup estimaient que l'adhésion de l'Albanie aurait offert une protection au pays et permis à l'OTAN d'établir une présence forte dans les Balkans. Il semble que les Albanais craignent que l'adhésion à l'organisation ne protège pas le Royaume, mais au contraire ne le pousse à risquer une invasion communiste immédiate ou un soulèvement populaire. Le nouveau régime est encore en train de s'implanter et de démanteler les structures communistes albanaises. Le gouvernement albanais a ajouté que, même s'il ne rejoindrait pas l'organisation, il espérait maintenir des relations amicales avec tous les États membres de l'OTAN."
 Hungarian_Rev_UN.0.d:0 "Le secrétaire d'État américain a promis de saisir prochainement le Conseil de sécurité et l'Assemblée générale de la Hongrie de la crise actuelle. Les Américains estiment que le soulèvement populaire et l'intervention soviétique laissent présager une escalade imminente vers un conflit armé, voire une guerre civile. Ils espèrent que le Conseil de sécurité pourra sensibiliser l'opinion publique à la situation en Hongrie et condamner la répression exercée sur le peuple hongrois. De nombreux observateurs considèrent toutefois que cette initiative américaine aura une portée essentiellement symbolique, l'Union soviétique disposant d'un droit de veto au Conseil de sécurité et étant peu susceptible de soutenir une mesure contraire à ses intérêts."
 Hungarian_Rev_UN.1.d:0 "La situation en Hongrie est critique. Un soulèvement victorieux a renversé le régime communiste soviétique fantoche et le nouveau régime de Budapest a manifesté son intention d'instaurer un régime plus indépendant et démocratique. L'Union soviétique a réagi par une intervention armée, provoquant d'intenses combats de rue entre les révolutionnaires hongrois et les chars soviétiques. Les États-Unis ont deux options aux Nations Unies : soit proposer un vote à l'Assemblée générale, qui serait adopté, condamnant l'action soviétique et demandant une enquête approfondie. Ce serait une victoire symbolique majeure ; soit proposer une opération de police des Nations Unies au Conseil de sécurité, mais pour qu'elle soit adoptée, il faudrait coopérer avec les Soviétiques."
 Hungarian_Rev_UN.10.d:0 "Les États-Unis ont ordonné à leurs missions diplomatiques et à leurs plus hauts responsables de condamner l'invasion soviétique de la Hongrie. Le gouvernement américain ne peut rester les bras croisés face aux chars soviétiques qui bafouent les droits et les espoirs du peuple hongrois. Pour l'instant, la réaction américaine semble se limiter à des déclarations, mais sa ferme condamnation publique contribuera à sensibiliser la communauté internationale à cette question. L'Union soviétique et ses alliés ont réagi en accusant les États-Unis d'hypocrisie, leur reprochant de ne pas condamner les violations des droits des citoyens d'États alliés."
 Hungarian_Rev_UN.11.d:0 "Les États-Unis ont proposé une opération de police des Nations Unies pour séparer les forces révolutionnaires hongroises des troupes soviétiques en Hongrie. Le gouvernement américain soutient que l'ONU doit intervenir pour assurer la protection et la sécurité du peuple hongrois et garantir le respect de ses droits. Souhaitant trouver une solution concrète à ce problème, les États-Unis ont chargé leurs plus hauts diplomates d'entamer des discussions avec leurs homologues soviétiques afin de parvenir à un accord acceptable. Quoi qu'il en soit, la tâche s'annonce ardue."
 Hungarian_Rev_UN.2.d:0 "Les États-Unis ont présenté une résolution à l'Assemblée générale appelant l'Union soviétique à cesser son intervention en Hongrie. Cette résolution exhorte également le Secrétaire général à diligenter une enquête approfondie sur l'intervention et à en déterminer les causes. La résolution a été adoptée à une très large majorité, certains alliés socialistes de l'Union soviétique ayant choisi de s'abstenir pour manifester leur désapprobation face à ce qu'ils considèrent comme une réaction soviétique excessive. Bien que les États-Unis se félicitent de ce succès, de nombreux journaux et des exilés hongrois soulignent que la résolution a une portée essentiellement symbolique."
 Hungarian_Rev_UN.3.d:0 "Les États-Unis nous ont informés de leur projet de résolution demandant une intervention des Nations Unies en Hongrie. Le gouvernement américain souligne que la situation en Hongrie est tendue et risque de dégénérer. De plus, nos actions suscitent de vives réactions internationales. Ils proposent que nous soutenions le déploiement de forces des Nations Unies afin de garantir un cessez-le-feu et de permettre des négociations pacifiques pour mettre fin au conflit. Nous avons insisté sur le fait que toute force de l'ONU devait s'atteler au désarmement des rebelles hongrois et être accompagnée d'observateurs soviétiques pour garantir sa neutralité ; les Américains ont accepté. À Moscou, une faction estime que le soutien à cette résolution restaurera le prestige soviétique et que les négociations ont de fortes chances de permettre le maintien du socialisme en Hongrie. Cependant, une autre faction pense que nous ne pouvons pas faire confiance à l'Occident et que nous sommes sur le point de remporter la victoire. Nous devrions donc utiliser notre droit de veto pour rejeter cette proposition."
 Hungarian_Rev_UN.4.d:0 "Les États-Unis présentèrent une résolution demandant le déploiement de Casques bleus des Nations Unies en Hongrie. Ces forces auraient pour mission de séparer les puissances hostiles, de désarmer les milices civiles et autres groupes armés, tout en garantissant un climat pacifique propice aux négociations entre les parties hongroises et Moscou. L'Union soviétique resta de marbre, malgré les propositions de participation à la mission onusienne. L'ambassadeur soviétique fustigea la délégation américaine et son hypocrisie face aux événements en Hongrie. Il déclara que cette question relevait du peuple hongrois et que les forces soviétiques maintenaient déjà la paix, à l'invitation du gouvernement. L'Union soviétique opposa son veto à la résolution, anéantissant toute chance de son adoption et infligeant un revers diplomatique aux États-Unis."
 Hungarian_Rev_UN.5.d:0 "Les États-Unis ont présenté une résolution demandant le déploiement de Casques bleus des Nations Unies en Hongrie. Ces forces auraient pour mission de séparer les puissances hostiles, de désarmer les milices civiles et autres groupes armés, tout en garantissant un climat pacifique propice aux négociations entre les parties hongroises et Moscou. La délégation soviétique a répondu favorablement, soulignant que ses forces étaient déjà présentes dans le pays à l'invitation de la délégation hongroise. Elle a fait remarquer que les forces de l'ONU pourraient contribuer à appuyer la mission de maintien de la paix en place et à mieux faire connaître le rôle positif joué par l'Union soviétique dans la résolution du conflit. Le Conseil de sécurité a ensuite adopté la résolution. Les États-Unis considèrent cette résolution comme une grande victoire. Les analystes estiment également que, malgré l'acceptation soviétique, la résolution témoigne de la reconnaissance par les Soviétiques du fait que la situation ne pouvait être résolue par la seule force militaire et qu'il était nécessaire de changer de tactique."
 USA_FRAIND.1.d:0 "Les États-Unis ont exigé le retrait de nos forces d'Indochine. Ils s'inquiètent de l'intensification du conflit dans la région, notamment du siège de Diên Biên Phu. Les Américains insistent sur le fait que nous n'avons ni la crédibilité, ni la puissance de feu, ni la volonté politique nécessaires pour remporter la victoire. Ils affirment que la poursuite de nos opérations ne fait que renforcer le soutien vietnamien aux communistes. Cependant, nos plus hauts responsables militaires et du renseignement nous exhortent à refuser cette demande, surtout après le succès de l'opération Condor, qui a considérablement affaibli les lignes de ravitaillement et les infrastructures communistes. Les généraux sont convaincus qu'avec un effort supplémentaire, la victoire est possible. Le ministre des Affaires étrangères est moins optimiste et prévient que si nous refusons les Américains, ces derniers pourraient couper l'aide à la France, ce qui paralyserait son économie."
 USA_FRAIND.2.d:0 "La France a indiqué qu'elle partageait notre appel à son retrait d'Indochine. Le gouvernement français a déclaré reconnaître le caractère intenable de la situation sur le terrain et qu'il entamerait prochainement des pourparlers avec toutes les parties concernées et préparerait le retrait de ses forces. Il s'agit d'une victoire diplomatique majeure, car la CIA et le Département d'État s'inquiétaient de plus en plus de ce que la poursuite de l'occupation française renforce la crédibilité des communistes et affaiblisse les factions anticommunistes ou pro-occidentales au sein de la population vietnamienne."
 USA_FRAIND.3.d:0 "La France a rejeté notre appel à son retrait d'Indochine. Elle a justifié sa décision par ses récents succès sur le terrain, arguant qu'elle ne pouvait ni interrompre ses opérations ni se retirer en position de force. Elle a souligné qu'un retrait à ce stade abandonnerait les populations de la région qui la soutiennent et créerait un vide du pouvoir que les communistes exploiteraient à leur avantage. L'obstination française continue d'aliéner les États de la région et de nuire à la réputation de l'Occident à l'étranger ; nous pourrions être contraints d'envisager des mesures plus fermes pour la faire revenir à la raison."
 Establish_SEATO.1.d:0 "Lors d'une réunion du Conseil des ministres à Bangkok, l'Association du Traité de l'Asie du Sud-Est (OTASE) a été officiellement créée. Cette organisation découle du Pacte de Manille, récemment signé, qui appelait ses signataires à former l'OTASE afin de renforcer les liens bilatéraux et de promouvoir la sécurité collective face à la montée de l'agression communiste régionale. L'organisation aura son siège à Bangkok et espère attirer davantage d'États régionaux anticommunistes. Les États-Unis soutiennent activement cette initiative et espèrent que l'OTASE deviendra une sorte d'OTAN régionale. Bien que des projets d'échanges culturels et militaires aient été évoqués, la réunion n'a pas abouti à la création de commandements militaires conjoints. Le gouvernement chinois a exprimé des réserves quant à l'OTASE, la qualifiant de tentative impérialiste inutile visant à anéantir la révolution chinoise."
 Establish_SEATO.2.d:0 "Les États-Unis nous ont proposé d'adhérer à l'OTASE. Cette organisation vise à renforcer les liens bilatéraux entre les États membres et à coordonner la sécurité collective face à l'agression chinoise dans la région. L'adhésion nous offrira des opportunités de développer nos relations avec ces États, notamment les échanges commerciaux et culturels. Sur le plan militaire, l'OTASE ne dispose pas de commandements militaires conjoints, mais organise des réunions régulières avec de hauts responsables de la défense, ce qui pourrait contribuer au perfectionnement professionnel de nos forces armées. Cependant, une adhésion à l'OTASE pourrait faire de nous une cible pour les États communistes. Notre population pourrait être réticente à l'idée de sécurité collective et s'opposer à toute tentative d'intégration des réponses militaires du groupe."
 Establish_SEATO.3.d:0 "[FROM.GetName] a accepté notre invitation à rejoindre l'OTASE. L'organisation s'est engagée à participer à la prochaine réunion du Conseil des ministres afin d'officialiser son adhésion. Elle nous a indiqué que l'OTASE correspond à sa politique étrangère et à ses objectifs. Elle s'est montrée particulièrement enthousiaste à l'idée de renforcer ses liens culturels et commerciaux avec les autres États membres. Il s'agit d'une victoire majeure pour notre politique étrangère et l'OTASE bénéficiera de ce nouveau membre. La presse a réagi très positivement, car nombreux sont ceux qui, dans le pays, voient dans l'élargissement de l'OTASE une confirmation de la vigueur de notre politique étrangère."
 Establish_SEATO.4.d:0 "[FROM.GetName] a décliné notre invitation à rejoindre l'OTASE. Cette décision fait état d'un malaise face à la perspective d'une association aussi étroite avec l'organisation, ainsi que de préoccupations d'ordre interne. Il a été réaffirmé que ce refus d'adhésion ne remettait pas en cause notre position ni notre amitié. [FROM.GetName] a estimé que rejoindre l'organisation pourrait engendrer plus de problèmes que d'avantages. Il s'agit assurément d'un revers, mais nous poursuivrons nos efforts pour recruter de nouveaux membres potentiels afin de renforcer la défense contre la menace grandissante du communisme en Asie."
 CENTO_PROPOSAL.1.d:0 "Les États-Unis ont récemment proposé d'élargir l'Organisation du Traité central (CENTO). La CENTO a pour mission de contenir l'influence communiste au Moyen-Orient. Ses membres bénéficient de liens bilatéraux renforcés et d'un meilleur accès à l'aide occidentale. La proposition américaine vise à intégrer davantage d'États du Moyen-Orient et à consolider la CENTO afin qu'elle puisse faire face non seulement aux menaces communistes, mais aussi aux autres idéologies radicales présentes dans la région. Sa légitimité en tant qu'alliance régionale s'en trouverait renforcée. Les États arabes pro-américains seront ciblés afin d'attirer davantage d'États arabes au sein de l'organisation. L'intégration de nouveaux États arabes permettra également de dissiper les accusations selon lesquelles l'organisation ne serait pas représentative de la région."
 CENTO_PROPOSAL.2.d:0 "Nous avons récemment reçu une invitation à rejoindre l'Organisation du Traité central (CENTO). La CENTO se veut l'équivalent moyen-oriental de l'OTAN et vise à empêcher l'expansion communiste dans la région. Les États-Unis et le Royaume-Uni lui apportent une aide militaire et économique. Ses membres bénéficient de liens bilatéraux et culturels renforcés. L'adhésion à cette organisation pourrait faciliter l'accès à l'aide occidentale et consolider notre position au sein du camp occidental. Toutefois, elle pourrait avoir des répercussions internes et radicaliser les militants de gauche et les nationalistes arabes du pays."
 CENTO_PROPOSAL.3.d:0 "Le gouvernement libanais a décliné l'adhésion à l'Organisation du Traité central (CENTO). Le Liban a déclaré avoir respecté l'invitation et l'avoir examinée avec attention. Cependant, en raison de préoccupations internes et du sentiment de la population libanaise, il se voit contraint de la refuser. Ce refus constitue un revers majeur pour les États-Unis, qui espéraient élargir le CENTO afin d'y intégrer davantage d'États arabes et de mieux répondre à la menace idéologique radicale qui pèse sur la région."
 CENTO_PROPOSAL.4.d:0 "Le gouvernement libanais a annoncé avec enthousiasme son adhésion à l'Organisation du Traité central (CENTO). Cette adhésion permettra au Liban d'accéder à une aide occidentale accrue. Le Liban a exprimé l'espoir de développer ses relations bilatérales et culturelles avec tous les États membres. La CENTO et les États-Unis considèrent cette adhésion comme une victoire majeure : le Liban apporte à l'organisation l'un des plus importants centres de culture arabe, ce qui renforce la légitimité de la CENTO dans la région. Les États arabes de la région condamnent le Liban et l'accusent de trahir le peuple arabe au profit d'une alliance fantoche impériale."
 CENTO_PROPOSAL.5.d:0 "Le Liban a répondu favorablement à l'invitation à rejoindre l'Organisation du Traité central (CENTO). C'est une grande victoire pour cette organisation que nous avons contribué à créer afin de contenir l'influence communiste dans la région. Bien que l'organisation ait été conçue pour promouvoir la défense collective régionale, elle n'a guère dépassé le stade de forum pour des échanges bilatéraux, culturels et militaires plus étroits. L'adhésion du Liban permettra de calmer les critiques régionales qui la qualifiaient de projet impérialiste orchestré par nous et la Grande-Bretagne. Elle renforcera également la capacité de l'organisation à faire face à la montée d'idéologies plus radicales dans la région, comme le nationalisme arabe."
 CENTO_PROPOSAL.6.d:0 "Nous avons récemment reçu une invitation à rejoindre l'Organisation du Traité central (CENTO). La CENTO se veut l'équivalent moyen-oriental de l'OTAN et vise à empêcher l'expansion communiste dans la région. Le Royaume-Uni et les États-Unis apportent une aide militaire et économique au groupe. Les membres bénéficient de liens bilatéraux et culturels renforcés. L'adhésion à cette organisation pourrait faciliter l'accès à l'aide occidentale et consolider notre position au sein du camp occidental. Elle pourrait renforcer les sympathies pro-occidentales de la monarchie, mais elle pourrait aussi avoir des effets pervers et radicaliser les militants de gauche et les nationalistes arabes du pays, notamment au sein des forces armées."
 CENTO_PROPOSAL.7.d:0 "Le gouvernement jordanien a décliné l'adhésion à l'Organisation du Traité central (CENTO). La Jordanie a déclaré avoir respecté l'invitation et l'avoir examinée avec attention. Cependant, en raison de préoccupations internes et du sentiment de la population jordanienne, elle se voit contrainte de décliner cette adhésion. Il s'agit d'un revers majeur pour les États-Unis, qui espéraient élargir la CENTO afin d'y intégrer davantage d'États arabes et de mieux répondre à la menace idéologique radicale qui pèse sur la région. Pour la Jordanie, cette décision devrait renforcer son image auprès des nationalistes arabes, tant au niveau national que régional."
 CENTO_PROPOSAL.8.d:0 "Le gouvernement jordanien a annoncé avec enthousiasme son adhésion à l'Organisation du Traité central (CENTO). Cette adhésion permettra à la Jordanie d'accéder plus facilement à l'aide occidentale. La Jordanie a exprimé l'espoir de développer ses relations bilatérales et culturelles avec tous les États membres. La CENTO et les États-Unis considèrent cette adhésion comme une victoire majeure : la Jordanie apporte à l'organisation l'un des États arabes les plus influents, ce qui renforce sa légitimité. Les États arabes de la région condamnent la Jordanie et l'accusent de trahir le peuple arabe au profit d'une alliance fantoche impérialiste et de corruption."
 CENTO_PROPOSAL.9.d:0 "La Jordanie a répondu favorablement à l'invitation à rejoindre l'Organisation du Traité central (CENTO). C'est une grande victoire pour cette organisation que nous avons contribué à créer afin de contenir l'influence communiste dans la région. Bien que l'organisation ait été conçue pour promouvoir la défense collective régionale, elle n'a guère dépassé le stade de forum pour des échanges bilatéraux, culturels et militaires plus étroits. L'adhésion de la Jordanie permettra de calmer les critiques régionales qui la qualifiaient de projet impérialiste orchestré par nous et la Grande-Bretagne. Elle renforcera également la capacité de l'organisation à faire face à la montée d'idéologies plus radicales dans la région, comme le nationalisme arabe."
 CENTO_PROPOSAL.10.d:0 "Les États-Unis ont accepté l'invitation à rejoindre officiellement l'Organisation du Traité central (CENTO) et à abandonner leur statut d'observateur. Cette adhésion permettra à l'organisation d'accéder plus facilement à l'aide occidentale et d'alléger le fardeau qui pèse sur le Royaume-Uni pour répondre à ses besoins. Les membres de la CENTO se réjouissent de cette annonce et se réjouissent d'accueillir de hauts responsables américains lors de futures conférences. Pour les États-Unis, une CENTO forte protégera leurs intérêts dans la région et leur offrira une alliance solide pour lutter contre les régimes anti-occidentaux ou pro-communistes. Dans la région, les critiques condamnent cette décision, y voyant la preuve que la CENTO est un projet impérialiste. Rejoindre l'organisation réduira la nécessité de soutenir directement Israël pour atteindre nos objectifs. Notre adhésion pourrait contribuer à transformer l'organisation en une véritable OTAN pour le Moyen-Orient."
 CENTO_PROPOSAL.11.d:0 "Les États-Unis ont décliné l'invitation à passer du statut d'observateur à celui de membre de l'Organisation du Traité central (CENTO). Bien que cette organisation ait pour vocation de défendre le Moyen-Orient contre l'expansion communiste, elle peine à dépasser le stade de forum d'échanges bilatéraux, culturels et militaires entre ses membres. Au Moyen-Orient, elle est perçue comme un projet impérialiste. Le Département d'État américain doute que l'adhésion des États-Unis permette de faire évoluer le groupe et craint même qu'elle n'érode davantage sa légitimité dans la région. Israël n'a jamais été particulièrement favorable à l'organisation et les responsables pro-israéliens estiment que soutenir Israël serait un moyen bien plus efficace d'atteindre les objectifs régionaux. Pour ces raisons, les États-Unis ont décidé de ne pas y adhérer."
 CIA_SYRIA.1.d:0 "Récemment, la CIA s'est entretenue avec l'ancien ministre syrien Mikhaïl Bey Ilyan au sujet d'un possible coup d'État militaire anticommuniste. Ce dernier a déclaré que les forces armées pourraient prendre le contrôle de Damas, Alep, Homs et Hama, ainsi que de tous les principaux points de passage frontaliers internationaux. Dès l'annonce de la formation d'un nouveau gouvernement, dirigé par le colonel Kabbani, par les stations de radio, les principaux responsables politiques civils anticommunistes seraient appelés à servir ce nouveau gouvernement. Les conspirateurs auraient besoin de fonds de la CIA pour corrompre les officiers concernés et garantir le succès de l'opération. La CIA soutient ce plan, baptisé Opération Straggle, estimant qu'une Syrie anticommuniste renforcerait la résistance antisoviétique dans la région. Les conseillers diplomatiques, quant à eux, s'y opposent, craignant que l'opération n'exacerbe les tensions et ne déstabilise Damas, une situation dont les communistes pourraient tirer profit."
 CIA_SYRIA.2.d:0 "Les agents de la CIA à Damas ont travaillé sans relâche pour assurer les largages de fonds nécessaires à l'opération Straggle. Plus de cent mille dollars ont été distribués à cette fin. Le Département d'État est prêt à publier des communiqués et à entreprendre des manœuvres diplomatiques pour protéger et soutenir le nouveau régime après le coup d'État. Cependant, les tensions régionales avec Israël ont contraint le cerveau syrien de l'opération, Mikhaïl Bey Ilyan, à reporter le plan de cinq jours. La CIA exhorte Ilyan à ne plus tarder, car l'opportunité pourrait être perdue. Washington attend avec anxiété de voir si le coup d'État prévu aura lieu."
 CIA_SYRIA.3.d:0 "Les informations en provenance de Damas sont fragmentaires. Des véhicules militaires syriens ont été aperçus en train de sillonner la ville, sécurisant des bâtiments clés et la station de radio d'État. Des informations similaires nous parviennent d'Alep. Les voyageurs tentant d'entrer ou de sortir de Syrie par la frontière jordanienne ou libanaise sont contraints de faire demi-tour, l'armée semblant avoir fermé les frontières. Des émissions de radio annoncent la formation d'un nouveau gouvernement sous la direction du colonel Kabbani, laissant présager un coup d'État. Les prochaines heures permettront de déterminer précisément ce qui s'est passé en Syrie cette nuit."
 CIA_SYRIA.4.d:0 "Le gouvernement syrien a annoncé que les services de renseignement syriens avaient déjoué un complot visant à perpétrer un coup d'État orchestré par les États-Unis. La Syrie a diffusé des photos des conspirateurs arrêtés et a montré aux médias des liasses de billets prétendument fournies par la CIA. Les Syriens affirment que ce sont des officiers patriotes qui ont livré les conspirateurs et mis fin à la tentative américaine de priver le peuple syrien de son indépendance. Les États-Unis ont nié toute implication dans ce complot. Le coup d'État prévoyait apparemment que l'armée syrienne renverse le gouvernement et instaure un nouveau régime autour du colonel Kabbani, qui figure parmi les personnes détenues."
 CIA_SYRIA.5.d:0 "Le nouveau régime du colonel Kabbani bénéficie déjà d'une légitimité internationale, notamment de la part des États-Unis qui se sont empressés de reconnaître son gouvernement et d'inciter leurs alliés à faire de même. L'ambassade américaine s'est également montrée active, et des rumeurs circulent selon lesquelles des officiers supérieurs seraient soudoyés pour ne pas contester le nouveau régime. La récente annonce de la formation d'un nouveau gouvernement, composé de personnalités politiques anticommunistes, a confirmé ce que de nombreux Syriens pressentaient depuis le début : ce coup d'État est une opération commanditée par la CIA. Le nouveau régime devra agir rapidement pour s'imposer auprès de la population, car nombre de Syriens le méprisent."
 CIA_SYRIA.6.d:0 "Nos interrogatoires de renseignement révèlent l'ampleur de l'implication américaine dans le complot de coup d'État récemment déjoué. Il semble que de hauts responsables américains aient comploté et versé d'importantes sommes d'argent sous notre nez. Le soutien américain reposait presque exclusivement sur la promesse d'un nouveau régime fermement anticommuniste. Il est consternant de constater jusqu'où les États-Unis étaient prêts à aller dans leurs manœuvres, mais heureusement, leurs alliés ont fait preuve de lâcheté et d'incompétence face à nos propres agents. Nous allons faire connaître ce complot américain et le peuple syrien se ralliera à nous, véritables défenseurs du peuple syrien."
 CIA_SYRIA.7.d:0 "L'échec de l'opération Straggle révèle des problèmes fondamentaux liés à l'engagement américain en Syrie. La CIA reconnaît avoir fait preuve d'une confiance excessive envers ses contacts syriens et avoir surestimé leurs capacités. L'appareil de renseignement syrien est incroyablement performant et difficile à déjouer. De plus, le nationalisme syrien est une force très puissante, et la CIA pensait que des pots-de-vin suffiraient à vaincre cette loyauté. Elle s'est trompée : dès que les agents ont compris la provenance de l'argent, ils se sont empressés de révéler le complot. Chose incroyable, certains agents que nous avions corrompus se sont rendus au gouvernement, ont avoué et ont remis l'argent. La révélation de notre implication nuit considérablement au prestige américain dans le pays, et la poursuite de cet engagement ne fera qu'alimenter la paranoïa syrienne envers l'Occident. Nous devons concentrer nos efforts sur une diplomatie ouverte et un dialogue avec nos alliés en Syrie, plutôt que sur des actions clandestines. Faute de quoi, nous risquons de connaître d'autres échecs comme l'opération Straggle."
 CIA_SYRIA.99.d:0 "La CIA a utilisé ses contacts avec les médias du monde entier et ses alliés politiques pour diffuser des articles soulignant l'instabilité du gouvernement syrien. Ces rapports indiquent que le gouvernement syrien reste déterminé à mener une guerre contre Israël et se consacre à la fabrication d'armements au détriment du développement de son économie et de son gouvernement, pourtant essentiels au bien-être de sa population. Plus inquiétant encore, le Congrès a été informé de rapports de renseignement faisant état d'une montée en puissance des communistes à Damas. Ces rapports laissent entendre qu'un coup d'État communiste pourrait avoir lieu prochainement ou que le régime syrien instable pourrait se tourner vers l'Union soviétique, ouvrant son territoire à des bases militaires et à des troupes communistes en échange d'armes. L'opinion publique perçoit de plus en plus la Syrie comme une bombe à retardement, sur le point de faire voler en éclats toute apparence de paix régionale ou mondiale."
 CIA_SYRIA.100.d:0 "Le gouvernement américain nous a invités à rejoindre sa coalition internationale contre le gouvernement syrien. Les Américains affirment que ce dernier est instable et qu'il est animé d'une volonté expansionniste, que ce soit au détriment de ses ennemis publics ou de ses voisins arabes. De plus, les Syriens continuent de revendiquer des territoires sur la quasi-totalité de leurs voisins. Les États-Unis souhaiteraient que nous les aidions à renverser le régime syrien afin de rétablir la paix dans la région et de mettre fin à la récente période d'instabilité politique que connaît le pays. Nos conseillers estiment que participer à cette coalition pourrait nous ouvrir des perspectives intéressantes auprès des Américains. Cependant, plusieurs responsables nous mettent en garde contre cette proposition, car rejoindre la coalition anti-syriale risquerait de nous aliéner notre population, qui percevrait vraisemblablement cette guerre comme une aventure américaine."
 CIA_SYRIA.101.d:0 "Les États-Unis ont annoncé que leur coalition a lancé des opérations militaires contre la Syrie. Les Américains insistent sur l'instabilité du gouvernement syrien et sur le danger qu'il représente pour sa propre population et pour tous les pays voisins. Désarmer le régime et instaurer un gouvernement représentatif de tous les Syriens est, selon eux, le seul moyen d'éviter une crise régionale catastrophique. Les États-Unis promettent une campagne de coalition rapide, mais le gouvernement syrien reste inflexible et appelle tous les Syriens à s'unir contre les envahisseurs étrangers."
 CIA_SYRIA.25.d:0 "Les États-Unis ont appelé à une mobilisation internationale pour fournir une aide humanitaire à la Turquie. Les récents troubles dans le nord de la Syrie ont provoqué un afflux massif de réfugiés vers la Turquie. Le gouvernement turc a récemment qualifié la situation à sa frontière de catastrophe humanitaire. Des troupes turques ont été déployées dans la région pour contrôler le flux de réfugiés et soutenir la construction de camps. Le gouvernement américain a également vivement critiqué le gouvernement syrien pour sa politique répressive."
 Syria_CIA.27.d:0 "Le secrétaire d'État a déclaré que les États-Unis reconnaissaient l'annexion récente du nord de la Syrie par la Turquie. Il a souligné que la Turquie n'avait été contrainte d'agir qu'après que le gouvernement syrien eut exacerbé la situation par une répression brutale des civils dans la région. Les États-Unis estiment que l'arrivée des forces turques mettra fin aux violences et empêchera la situation de se détériorer davantage. Le gouvernement syrien a condamné les États-Unis pour atteinte à sa souveraineté et soutien ouvert au démembrement de la nation syrienne. La Syrie appelle tous les Arabes à s'unir pour libérer les terres arabes occupées par les Turcs."
 Syria_CIA.26.d:0 "La Turquie a récemment sollicité notre réaction en cas d'intervention américaine en Syrie. Le gouvernement turc a souligné la détérioration rapide de la situation humanitaire dans le nord du pays, provoquant une crise des réfugiés et des combats armés à sa frontière. L'armée turque estime pouvoir intervenir rapidement et mettre fin à la brutale campagne syrienne. Le président américain a répondu en apportant son soutien à une telle intervention, les États-Unis jugeant le comportement des forces syriennes inapte à gouverner le territoire. Le gouvernement américain fournira à la Turquie tout le soutien diplomatique et de renseignement nécessaire à ses opérations."
 CIA_SYRIA.50.d:0 "Les États-Unis ont dépêché des émissaires pour nous interroger en privé sur notre position concernant la Syrie et un plan qu'ils ont élaboré. Les Américains estiment que le nord de la Syrie est mécontent de Damas et que leurs agents sont capables de fomenter un soulèvement. Dans le chaos qui s'ensuivrait, ils nous demanderaient d'intervenir et d'occuper le nord de la Syrie avec leur plein soutien et la protection internationale des États-Unis. Avec l'appui américain, un tel complot nous permettrait de contrôler un territoire et des ressources stratégiques. Cependant, toute opération militaire comporte des risques imprévus et nous pourrions nous heurter à une résistance syrienne accrue ou à une réaction arabe plus large si nous suivions le plan américain. Nous devons décider si nous soutenons ou non ce projet d'invasion du nord de la Syrie."
 CIA_SYRIA.51.d:0 "La Turquie a indiqué être disposée à collaborer avec les États-Unis à un plan visant à gérer le régime syrien. Elle a promis de déployer des forces et de contribuer à justifier une intervention turque dès le début du soulèvement dans le nord de la Syrie. La Turquie s'est également engagée à partager ses renseignements et ses ressources dans la région afin d'appuyer l'effort américain. Il s'agit d'une victoire diplomatique majeure. Une fois que la Turquie aura pris le contrôle du territoire syrien, la Syrie sera réduite à un État croupion et ne constituera plus une menace pour la région."
 CIA_SYRIA.52.d:0 "Le gouvernement turc a refusé de soutenir les plans américains visant à provoquer un soulèvement populaire dans le nord de la Syrie afin d'établir une présence turque dans la région. Les Turcs estiment que ce plan est irréaliste et qu'il affaiblirait la position régionale de la Turquie, risquant de déclencher un conflit sanglant et prolongé avec la Syrie. Il s'agit d'un revers majeur pour les efforts américains visant à affaiblir la Syrie et à l'éliminer en tant que menace régionale. Le gouvernement turc a également indiqué que, malgré son refus de soutenir ce plan, il souhaite maintenir des relations amicales avec les États-Unis."
 CIA_SYRIA.53.d:0 "Les États-Unis ont dépêché des agents de renseignement auprès de notre gouvernement afin de lui soumettre une proposition en privé. Ils estiment que le gouvernement et l'État syriens représentent une menace pour la sécurité régionale et les intérêts américains. Ils souhaiteraient que nous envahissions la Syrie et rétablissions le pouvoir hachémite dans la région. Pour appuyer cette entreprise, ils fourniraient une importante couverture diplomatique et des armes à nos forces. Leurs services de renseignement contribueraient également à créer un prétexte à une intervention irakienne. Ce plan est séduisant car il permettrait de réparer les injustices subies par le défunt roi Fayçal et d'asseoir notre position dans la région. Cependant, de nombreux conseillers craignent qu'une telle intervention n'aliène le peuple irakien et les nationalistes arabes au sein de l'armée. Nous devons décider de la marche à suivre."
 CIA_SYRIA.54.d:0 "Le gouvernement irakien a accepté de soutenir nos plans visant à renverser le gouvernement syrien. Le gouvernement et les services de renseignement irakiens coopéreront avec les nôtres pour faciliter le transfert d'armes et fournir un prétexte à une offensive irakienne en Syrie. Les Irakiens sont très favorables à l'idée d'étendre le pouvoir hachémite en Syrie et d'endiguer la propagation des idées nationalistes arabes. Ils insistent pour que le prétexte soit irréfutable afin de renforcer le gouvernement lorsqu'il décidera d'intervenir. Le soutien diplomatique et clandestin américain est également très apprécié. Ce plan permettra, nous l'espérons, de mettre un terme définitif à la menace syrienne."
 CIA_SYRIA.55.d:0 "Le gouvernement irakien a refusé de soutenir notre plan de renversement du gouvernement syrien. Les Irakiens estiment que ce projet est irréaliste et que ses avantages potentiels ne compensent pas les risques. Ils craignent un conflit prolongé avec un autre État arabe. Toutefois, leur principale préoccupation est que, même avec un prétexte solide, les nationalistes arabes irakiens et l'armée puissent instrumentaliser le conflit pour s'emparer du pouvoir monarchique. La décision irakienne constitue un revers majeur pour les efforts américains visant à gérer la situation en Syrie et les risques qu'elle représente pour la région."
 CIA_SYRIA.10.d:0 "La CIA a pris contact avec de hauts gradés de l'extrême droite syrienne, sous la direction du général Adib Shishakli. Ce dernier, connu pour ses relations amicales avec l'Occident, promet de renouer avec ce type de politique et de réprimer les communistes syriens. Nos alliés syriens estiment qu'un coup d'État est possible, mais à un prix. Il faudra soudoyer des commandants, des soldats et des responsables syriens pour obtenir leur soutien au coup d'État envisagé. La CIA est confiante quant à la réussite du plan, car le général Shishakli bénéficie d'une reconnaissance nationale et d'une expérience au plus haut niveau. L'opération proposée est baptisée Opération Wappen."
 CIA_SYRIA.11.d:0 "La CIA a présenté le plan final de l'opération Wappen. Les généraux syriens réclament une somme bien supérieure à celle initialement convenue. La Maison Blanche craint qu'un tel versement d'argent à Damas ne dévoile le plan et laisse entendre qu'il pourrait s'agir d'une tentative d'extorsion. Plus inquiétant encore, cette opération pourrait être une opération d'infiltration syrienne visant à révéler notre implication et à nuire à notre réputation dans la région. La CIA nous incite fortement à satisfaire ces exigences, mais le secrétaire d'État estime qu'ils sont aveuglés par leurs ambitions et prêts à tout pour provoquer un changement de régime. Nous devons choisir : céder à cette demande exorbitante, proposer le montant initial, ou limiter nos pertes et éviter d'être exposés."
 Passage_to_Freedom.0.d:0 "La marine américaine a annoncé le lancement de l'opération Passage vers la liberté. Les forces américaines aideront l'armée et la marine françaises à évacuer les civils vietnamiens pro-français et anticommunistes piégés au Nord-Vietnam communiste vers le Sud-Vietnam non communiste. L'opération vise en particulier à évacuer les catholiques du Nord-Vietnam, menacés par un régime athée et victimes d'une propagande hostile les présentant comme une cinquième colonne pro-française. La CIA collabore secrètement avec le gouvernement sud-vietnamien pour produire et diffuser des tracts au Nord-Vietnam, incitant les catholiques et d'autres personnes à fuir le régime communiste. Le gouvernement sud-vietnamien actuel souhaite ardemment faire venir davantage de catholiques afin de renforcer un pouvoir fortement dépendant de responsables catholiques. Le Nord-Vietnam a condamné ce qu'il qualifie de propagande hostile, bien que des informations fassent état de la mise en quarantaine des voies fluviales, des routes et de villages coupés des grandes villes pour bloquer l'afflux de réfugiés."
 CIA_SYRIA.12.d:0 "La CIA a distribué avec succès des pots-de-vin à des généraux syriens clés et l'opération Wappen semble sur le point d'être lancée. Le chef du coup d'État, le général Shishakli, serait en train d'organiser les partis politiques de droite en vue du coup d'État. Une fois le pouvoir pris et les officiers de gauche écartés, le nouveau gouvernement aura besoin du soutien des partis de droite pour gouverner efficacement. La CIA a fait part à la Maison Blanche de sa confiance quant au déclenchement prochain de l'opération. Elle a également souligné que le succès de cette campagne de corruption démontrait que la puissance économique américaine pouvait être utilisée efficacement pour atteindre des objectifs de renseignement, lorsque les circonstances s'y prêtaient."
 CIA_SYRIA.13.d:0 "La CIA a subi un revers majeur suite aux informations en provenance de Damas selon lesquelles plusieurs généraux syriens auraient remis des pots-de-vin qu'ils affirmaient avoir reçus des États-Unis pour fomenter un coup d'État. Les forces syriennes ont encerclé notre ambassade et arrêté l'agent de la CIA qui orchestrait le complot sur le terrain. Les généraux ont déclaré que leur patriotisme et leur loyauté envers la Syrie les avaient poussés à dénoncer l'incident et à remettre l'argent. L'opération Wappen a été révélée, ainsi que la participation de la CIA. D'autres généraux et responsables politiques syriens impliqués ont fui à l'étranger ou ont été arrêtés par les services de renseignement syriens. Il semblerait que nos offres de pots-de-vin n'aient pas suffi à convaincre certains généraux qui ont préféré révéler le complot plutôt que de risquer un coup d'État manqué. La Maison Blanche serait furieuse, tandis que le Département d'État suggère que les services de renseignement syriens étaient au courant depuis le début et n'ont agi que maintenant pour maximiser l'humiliation des États-Unis."
 CIA_SYRIA.14.d:0 "Du jour au lendemain, des chars et des troupes syriennes ont envahi Damas, s'emparant de la station de radio et de bâtiments gouvernementaux clés. Des scènes similaires se sont produites à Alep et dans plusieurs autres grandes villes syriennes. Le lendemain matin, la radio d'État a annoncé qu'un conseil de généraux avait pris le pouvoir et renversé le gouvernement, l'accusant de corruption et de trahison envers le peuple syrien. Le soir même, le général Shishakli, en exil, est arrivé par avion pour prendre le contrôle de la junte et du gouvernement. Le nouveau dirigeant syrien s'est adressé à la population et a appelé à l'unité nationale et à l'éradication des idéologies étrangères dangereuses, telles que le communisme. Les États-Unis et la Grande-Bretagne ont rapidement salué le nouveau gouvernement, tandis que des nationalistes arabes, dans d'autres parties de la région, ont organisé des manifestations."
 Syria_CIA.10.d:0 "Les États-Unis ont annoncé le lancement d'opérations militaires contre le gouvernement syrien. Ces dernières semaines, la CIA a utilisé ses contacts dans les médias pour diffuser des informations établissant un lien entre d'importants transferts d'armes soviétiques et la Syrie. Elle a également publié des articles décrivant le gouvernement syrien comme un allié de l'Union soviétique fomentant des troubles dans la région et réprimant brutalement la population. Ces révélations ont suscité l'indignation publique et des appels à une action concrète pour mettre fin à l'agression syrienne dans la région. Le président a déclaré que les forces armées américaines interviendraient pour libérer le peuple syrien."
 CIA_SYRIA.59.d:0 "Les forces turques ont franchi la frontière et pénétré dans le nord de la Syrie. Le gouvernement turc affirme que la récente escalade de la violence et la crise croissante des réfugiés l'ont contraint à intervenir. Le gouvernement syrien est accusé d'avoir fait un usage excessif de la force et de la violence contre les rebelles dans le nord de la Syrie. Le gouvernement syrien a dénoncé ce qu'il qualifie d'invasion turque et s'est engagé à repousser toute armée d'invasion. Les États-Unis ont apporté leur soutien à la Turquie, qualifiant son intervention d'action humanitaire visant à mettre fin aux troubles dans la région."
 CIA_SYRIA.60.d:0 "Le gouvernement turc a annoncé la création d'une zone de sécurité sous administration directe turque dans le nord de la Syrie. Cette décision fait suite à son intervention dans la région pour chasser les forces gouvernementales syriennes, qu'il accuse de violations des droits de l'homme contre la population du nord de la Syrie. Le gouvernement syrien a rapidement condamné cette annexion de territoire et appelle le monde arabe à condamner et à résister à l'invasion turque. Les États-Unis soutiennent la décision turque, soulignant la présence stabilisatrice de la Turquie dans la région."
 CIA_SYRIA.61.d:0 "Des milliers de Syriens ont défilé dans les rues de Damas pour célébrer la récente victoire de leurs forces sur la Turquie. L'armée turque avait tenté d'intervenir dans le nord de la Syrie pour empêcher les forces gouvernementales syriennes de cibler les rebelles de la région. Cependant, l'offensive turque a rapidement été repoussée par l'armée syrienne, qui a lancé une contre-attaque victorieuse. Selon certaines informations, l'armée syrienne contrôle désormais Hatay, un territoire historiquement disputé. Le gouvernement syrien a publié un communiqué affirmant avoir libéré les dernières villes arabes sous domination ottomane. De nombreux observateurs estiment que les États-Unis seront probablement embarrassés par l'échec de leur allié turc et pourraient devoir revoir leur engagement en Syrie."
 CIA_SYRIA.56.d:0 "Des informations indiquent que les forces irakiennes ont pénétré en Syrie en grand nombre. Les détails restent flous, mais il semblerait que le roi hachémite d'Irak soit intervenu afin de restaurer la monarchie syrienne et sa famille sur le trône. Le gouvernement irakien a affirmé avoir été contraint d'agir pour sauver le peuple syrien de l'oppression et de la corruption. Le gouvernement syrien a condamné l'intervention irakienne, la qualifiant d'invasion coloniale perpétrée par des traîtres au monde arabe. L'armée syrienne se déploie rapidement pour faire face à cette menace. Les États-Unis sont accusés d'avoir incité le gouvernement irakien à agir."
 CIA_SYRIA.57.d:0 "Les troupes irakiennes victorieuses, reproduisant le défilé triomphal du roi Fayçal en 1918, ont défilé dans les rues de Damas. Le gouvernement irakien a affirmé avoir vaincu un régime corrompu et illégitime et s'est engagé à rétablir une autorité royale légitime pour le peuple syrien. Les forces gouvernementales syriennes n'ont pas réussi à empêcher l'intervention irakienne, largement condamnée par les nationalistes arabes de la région. Les États-Unis se seraient déclarés très satisfaits du changement de régime à Damas et ont adressé leurs félicitations au gouvernement irakien."
 CIA_SYRIA.58.d:0 "Des véhicules et camions irakiens capturés, chargés d'armes et de matériel détruit, ont défilé dans les rues de Damas. Le gouvernement syrien exhibait ainsi le butin de sa victoire sur les forces irakiennes. L'armée irakienne était récemment intervenue en Syrie pour restaurer la monarchie hachémite, mais ses efforts ont échoué. Le gouvernement irakien garde le silence sur les événements, malgré les rapports indiquant clairement une victoire syrienne. Il affirme que cette victoire est celle du monde arabe tout entier contre l'impérialisme occidental. Le gouvernement irakien devra analyser les causes de cet échec. Les États-Unis seraient profondément déçus par la performance des forces et du gouvernement irakiens."
 USA_INDONESIA.5.d:0 "La situation en Indonésie s'est détériorée, de nombreux patriotes indonésiens de Sumatra continuant de s'opposer au gouvernement en raison de ses sympathies communistes. Le gouvernement de Sukarno persiste dans sa répression, notamment en coupant les approvisionnements essentiels à ceux qu'il accuse de rébellion. Sur les conseils de la CIA, le président a chargé le Département d'État et la mission des Nations Unies de lancer une campagne diplomatique et publique appelant à une intervention humanitaire dans le conflit afin d'éviter un bain de sang. La CIA estime qu'une telle mission pourrait nous permettre d'élargir nos contacts avec les anticommunistes et de préparer le terrain pour de futures actions."
 USA_INDONESIA.6.d:0 "La CIA a récemment déployé des bombardiers camouflés, pilotés par d'anciens pilotes de l'armée de l'air, via une organisation écran appelée Civil Air Transport, afin de soutenir les rebelles anticommunistes de Sumatra contre le gouvernement indonésien. Ces pilotes menaient clandestinement des raids aériens contre les positions indonésiennes depuis des bases contrôlées par les rebelles. Malheureusement, les Indonésiens ont abattu un bombardier piloté par Allen Lawrence Pope. Son B-26, après une mission de bombardement, a été intercepté et abattu. Pope et un membre d'équipage rebelle ont réussi à s'éjecter, mais ont été capturés par les forces indonésiennes. Sa capture confirme les accusations du gouvernement selon lesquelles les avions rebelles sont pilotés par des Américains et des nationalistes chinois. Nous nions toute implication et affirmons que Pope était un mercenaire, mais cet incident est extrêmement embarrassant et nous mettrons fin à l'opération."
 USA_INDONESIA.7.d:0 "Notre opération en Indonésie s'est soldée par un échec : les rebelles anticommunistes de Sumatra ont été vaincus et Sukarno semble désormais en position de force. Les raisons de cet échec sont multiples ; nous avons notamment sous-estimé les capacités de l'armée indonésienne. Nos efforts pour soutenir les stations de propagande et les bases rebelles ont été contrecarrés par les attaques gouvernementales. L'armée indonésienne compte elle-même de nombreux officiers anticommunistes, et nos actions risquaient de les retourner contre nous. En réalité, notre soutien aux rebelles a accentué les divisions au sein des factions anticommunistes, offrant ainsi aux communistes l'opportunité de se rapprocher du gouvernement. Nous n'avons pas non plus apporté notre soutien aux autres puissances occidentales et n'avons pas engagé suffisamment de forces pour garantir le succès des rebelles."
 USA_INDONESIA.1.d:0 "Les États-Unis ont condamné la situation des droits de l'homme à Sumatra, tant aux Nations Unies qu'à la Maison Blanche. Le gouvernement américain accuse le gouvernement indonésien de recourir à une violence extrême et de affamer la population sumatranaise. Cette condamnation marque une internationalisation de la récente rébellion d'officiers militaires indonésiens anticommunistes qui ont pris le contrôle de Sumatra. Les rebelles exigent la dissolution du gouvernement indonésien et l'éradication de toute influence communiste dans le pays. Le gouvernement indonésien a jusqu'à présent conservé le contrôle de la majeure partie des forces armées et son dirigeant, Sukarno, nie toute alliance avec les communistes et toute violation des droits de l'homme. Il affirme au contraire que les rebelles sont une cabale d'hommes aigris avides de pouvoir au détriment de la démocratie indonésienne. L'intervention des États-Unis suscite de vives inquiétudes chez les autres puissances, qui craignent qu'une implication américaine n'aggrave la crise."
 USA_INDONESIA.8.d:0 "La marine américaine a lancé d'importants exercices navals au large des côtes indonésiennes et près de Sumatra, où des forces rebelles affrontent actuellement les troupes gouvernementales. Les États-Unis ont récemment critiqué le gouvernement indonésien pour sa répression brutale des rebelles et son refus d'écouter leurs revendications. Les rebelles exigent que le gouvernement indonésien, dirigé par Sukarno, quitte le pouvoir et exclue le parti communiste de toute participation à la vie politique et gouvernementale. Le gouvernement nie toute influence communiste excessive et accuse les rebelles, composés en grande partie d'officiers, de tenter de saper la démocratie pour s'emparer du pouvoir. Le déploiement naval américain et les critiques qui en découlent ne feront qu'affaiblir la position du gouvernement indonésien et témoigneront d'un soutien manifeste aux rebelles."
 INO_USA_WAR.1.d:0 "Dans une allocution à la nation, le président des États-Unis annonça le déploiement immédiat de forces militaires américaines en Indonésie pour protéger les rebelles de Sumatra. Il souligna que le gouvernement indonésien recourait à des tactiques extrêmes pour réprimer la révolte, mettant inutilement en danger des millions de vies civiles. Il affirma également que le gouvernement indonésien était de plus en plus sous l'influence de puissances communistes étrangères et que l'intervention américaine permettrait non seulement de sauver des vies, mais aussi de préserver la démocratie pour le peuple indonésien. Le gouvernement indonésien réagit avec véhémence, prétendant que les rebelles de Sumatra n'étaient qu'une force fantoche aux ordres du gouvernement américain et que tous les Indonésiens s'uniraient pour vaincre les envahisseurs américains."
 INO_USA_WAR.5.d:0 "Les États-Unis ont annoncé leur intention de partitionner l'Indonésie. Le gouvernement américain a souligné que l'État indonésien actuel était bien trop diversifié et géographiquement étendu pour permettre l'existence d'un gouvernement central efficace. Un tel système le rendait vulnérable aux révoltes locales et les populations vivant hors des îles principales étaient souvent négligées par le pouvoir central. La partition garantirait à tous les habitants des îles l'accès à un gouvernement à l'écoute et empêcherait toute île d'imposer ses valeurs ou ses croyances aux autres, même en contrôlant des services clés de l'État. Cette décision suscite des critiques parmi les Indonésiens vivant en milieu urbain, dont beaucoup estiment que le plan de partition ne fera qu'attiser les conflits entre les îles. D'autres affirment que la partition n'est en réalité qu'un moyen d'empêcher l'Indonésie d'atteindre son plein potentiel et de devenir un acteur majeur sur la scène internationale."
 INO_USA_WAR.4.d:0 "Grâce à notre intervention réussie en Indonésie, nous avons la capacité d'imposer une solution au conflit. Une option consiste à rétablir le gouvernement central et à confier le pouvoir au colonel Ahmed Hussein, chef rebelle de Sumatra. Il instaurerait un régime fort et éradiquerait tous les communistes du pays. Les analystes estiment que sa position est populaire auprès des officiers. Il pourrait coordonner un programme national anticommuniste ambitieux. Une autre solution, en remplacement du colonel Hussein, serait de partitionner l'Indonésie. En effet, de nombreux analystes considèrent que le pays est trop vaste et géographiquement morcelé pour être gouverné tel qu'il est actuellement. La lourdeur de son appareil d'État rend l'Indonésie particulièrement vulnérable à l'infiltration communiste. Une partition permettrait de prévenir cette infiltration et de bloquer une voie majeure de propagation du communisme dans la région."
 INO_USA_WAR.6.d:0 "Avec le soutien américain, le colonel Ahmed Hussein a consolidé son emprise sur l'Indonésie. Il s'est fait connaître comme l'un des principaux officiers rebelles à Sumatra. Il a adressé un ultimatum au gouvernement indonésien, exigeant la réintégration des fonctionnaires et la tenue de nouvelles élections. Face au refus du gouvernement, un conflit armé s'est déclaré. Grâce au soutien américain, les rebelles ont remporté la victoire. Il devrait annoncer prochainement la formation d'un gouvernement composé des plus hauts responsables politiques anticommunistes. Sa junte militaire actuelle compte plusieurs officiers anticommunistes de premier plan et très respectés. De nouvelles élections sont promises, ainsi que l'interdiction des communistes et autres groupes considérés comme une menace pour l'État et la démocratie indonésiens. La CIA et l'ambassade américaine joueraient un rôle majeur en coulisses pour protéger le régime de Hussein des contre-coups d'État planifiés par des officiers supérieurs."
 INO_CIA_EXPOSURE.0.d:0 "La CIA, par le biais d'une société écran en Thaïlande, a réussi à transférer des bombardiers et des pilotes pour soutenir les rebelles indonésiens à Sumatra. Nos pilotes ont mené avec succès des missions de mitraillage et de bombardement contre des cibles militaires et des bases aériennes indonésiennes. Les bombardiers sont progressivement transférés aux pilotes rebelles et il est clair que nos opérations n'ont pas été découvertes. Nous sommes parvenus à éviter d'être repérés par le gouvernement indonésien, ce qui nous permet de soutenir les rebelles tout en conservant publiquement notre neutralité dans le conflit. Cela nous donnera une plus grande marge de manœuvre pour faire pression sur l'Indonésie afin qu'elle mette fin à son rapprochement croissant avec les communistes locaux."
 INO_CIA_EXPOSURE.1.d:0 "La CIA, par le biais d'une société écran en Thaïlande, avait tenté de fournir clandestinement des bombardiers et des pilotes aux rebelles de Sumatra. Cependant, le gouvernement indonésien est parvenu à abattre un bombardier et à capturer un pilote, révélant ainsi leur origine. C'est un camouflet pour notre gouvernement et un échec pour la CIA. Les Indonésiens sont furieux et notre réputation dans la région en pâtira. Il faudra déployer des efforts considérables pour rétablir la confiance avec l'Indonésie. De concert avec le gouvernement indonésien, l'Union soviétique et les partis communistes régionaux se réjouissent de notre humiliation. Le directeur de la CIA a été sévèrement réprimandé par le Président."
 INO_CIA_EXPOSURE.2.d:0 "Le gouvernement indonésien a annoncé qu'un bombardier américain, volant pour les forces rebelles à Sumatra, avait été abattu lors d'une attaque contre une base aérienne militaire. L'ambassade américaine a rapidement nié toute implication. Cependant, la presse indonésienne a publié des photos de l'avion abattu et d'un pilote américain en détention. L'appareil, un avion américain de la Seconde Guerre mondiale, arborait des symboles de la République de Chine sous une peinture neuve. Le gouvernement indonésien a souligné que la capture du pilote et l'origine de l'avion indiquaient une implication directe des États-Unis. Le gouvernement américain, quant à lui, affirme que les avions et pilotes américains impliqués étaient des mercenaires, et non des représentants ou agents des États-Unis. Malgré ces dénégations, la plupart des pays semblent soutenir l'Indonésie et demandent aux États-Unis de cesser toute aide aux forces rebelles."
 Sumatran_Revolt.50.d:0 "Des rebelles indonésiens à Sumatra, principalement des unités militaires, ont récemment lancé une révolte exigeant la démission du gouvernement de Sukarno. Ils estiment que l'influence communiste à Jakarta s'accroît et que Sukarno cède à leur emprise. Les efforts déployés par Sukarno pour résoudre la crise et prévenir une escalade ont connu un certain succès initial. Cependant, la CIA pense pouvoir, grâce à son soutien, rallier davantage de soutien aux rebelles et transformer la révolte en un soulèvement généralisé contre Sukarno. Cela affaiblirait considérablement ce dernier et contribuerait à empêcher les communistes de s'emparer du pouvoir par la force."
 Sumatran_Revolt.0.d:0 "Les commandants militaires régionaux de Sumatra ont cessé de rendre compte au gouvernement central et de lui obéir, se rebellant de fait. L'inquiétude grandit quant à la situation économique, et certains officiers craignent que le gouvernement ne se concentre que sur Java au détriment des autres îles. Les officiers loyaux sont souvent destitués lors de coups d'État sans effusion de sang menés par les rebelles, qui établissent ensuite un nouveau gouvernement local parallèle. Des rumeurs circulent selon lesquelles ces officiers détourneraient des fonds et encourageraient la contrebande pour se financer. Le gouvernement doit trouver une réponse appropriée, même si les officiers rebelles affirment ne pas chercher à créer un État dans l'État, mais à dénoncer les dysfonctionnements du gouvernement."
 Sumatran_Revolt.1.d:0 "Les officiers rebelles de l'armée à Sumatra se sont récemment réunis en conférence et ont décidé de s'unifier sous la direction du lieutenant-colonel Ahmad Hussein. Se proclamant Gouvernement révolutionnaire de la République d'Indonésie, ils ont lancé un ultimatum à Jakarta. Ce groupe estime que le président Sukarno est sous influence communiste et exige qu'il limite ses pouvoirs et restitue à la présidence les prérogatives que lui confère la Constitution. Parmi leurs autres revendications figurent le rétablissement d'un régime démocratique sous l'égide de dirigeants politiques anticommunistes. Ils ont donné cinq jours au gouvernement pour s'y conformer."
 Sumatran_Revolt.2.d:0 "Les revendications des officiers rebelles de Sumatra ont été acceptées par le président Sukarno. Ces officiers, réunis au sein du Gouvernement révolutionnaire de la République d'Indonésie (PRRI), réclamaient le rétablissement des institutions démocratiques et l'éviction des communistes du gouvernement central. Conformément à leurs exigences, le président Sukarno limitera ses pouvoirs à ceux prévus par la Constitution et autorisera Djuanda Kartawidjaja à remanier son cabinet et à gouverner jusqu'à la tenue de nouvelles élections. La victoire du chef du PRRI, le lieutenant-colonel Ahmed Hussein, l'a propulsé au rang de célébrité nationale, et des rumeurs circulent quant à ses ambitions présidentielles pour les élections à venir. Les communistes indonésiens observent ces développements avec inquiétude."
 Sumatran_Revolt.3.d:0 "Le président Sukarno a rejeté les préoccupations et les revendications des officiers rebelles à Sumatra et a ordonné la mobilisation de l'armée. Il a également appelé tous les citoyens et soldats loyaux à aider le gouvernement à rétablir l'ordre à Sumatra. Les officiers rebelles, se faisant appeler le Gouvernement révolutionnaire de la République d'Indonésie (PRRI) et placés sous le commandement du lieutenant-colonel Ahmed Hussein, ont répliqué en appelant les Indonésiens patriotes à rejoindre leur révolte. Le PRRI affirme que le gouvernement actuel est trop autoritaire et trop tolérant envers les communistes. Le PRRI craint que, s'il n'agit pas immédiatement, le gouvernement central ne soit bientôt victime d'un coup d'État communiste. La majeure partie des forces indonésiennes semble loyale au gouvernement, mais il reste à voir si cela changera une fois les combats engagés."
 Sumatran_Revolt.4.d:0 "Le gouvernement indonésien a déclaré avoir écrasé la rébellion des officiers militaires à Sumatra. Ces officiers rebelles, qui se faisaient appeler le Gouvernement révolutionnaire de la République d'Indonésie (PRRI), s'étaient soulevés par crainte de l'influence communiste et du manque de démocratie au sein du gouvernement central. Le gouvernement indonésien a réussi à mobiliser ses forces et à convaincre ses officiers fidèles que les rebelles étaient davantage motivés par l'appât du gain. De fait, le conflit a révélé que nombre d'officiers indonésiens étaient de fervents anticommunistes, mais ils pensaient que les officiers rebelles exagéraient la menace ou l'influence communiste sur le président Sukarno. L'armée indonésienne a tout simplement submergé les forces rebelles, dont les retraites et les tactiques de guérilla n'ont pas permis de contenir l'avancée des forces gouvernementales. La direction du PRRI s'est également fracturée et bientôt, ses commandants se sont rendus sur tout le front."
 Sumatran_Revolt.5.d:0 "Le lieutenant-colonel Ahmed Hussein a proclamé la victoire sur le gouvernement indonésien, mettant ainsi fin au conflit entre ce dernier et les forces rebelles basées à Sumatra. Le groupe rebelle, le Gouvernement révolutionnaire de la République d'Indonésie (PRRI), s'était soulevé après le refus du gouvernement de céder à ses exigences de limitation de l'influence communiste et de rétablissement du respect des limites constitutionnelles du pouvoir. Le gouvernement avait alors dépêché ses forces pour vaincre les rebelles. Cependant, le PRRI est parvenu à repousser les attaques gouvernementales et même à convaincre une grande partie de ses membres de faire défection. Ahmed Hussein a promis de rétablir le Premier ministre Djuanda Kartawidjaja et son gouvernement. Des élections devraient se tenir prochainement, mais le PRRI devrait s'assurer qu'aucun communiste ne puisse y participer. Hussein devrait assurer l'intérim de la présidence jusqu'aux élections."
 Thomas_Dewey_TT:0 "Cela permettra à Thomas Dewey d'obtenir l'investiture républicaine de 1952."
 Earl_Warren_TT:0 "Permettra à Earl Warren d'obtenir l'investiture républicaine de 1952"
 Harold_Stassen_TT:0 "Cela permettra à Harold Stassen d'obtenir l'investiture républicaine de 1952."
 Eisenhower_Dem_TT:0 "Permettra à Dwight D. Eisenhower d'obtenir l'investiture démocrate de 1952.\nREMARQUE : Eisenhower démocrate possède un arbre de compétences distinct de celui d'Eisenhower historique."
 IRQ_INTERVEITON_TT:0 "La Syrie doit capituler avant la fin du compte à rebours, sinon notre intervention aura échoué."
 Intervention_into_Syria:0 "Intervention en Syrie"
 Intervention_into_Syria_TUR:0 "Intervention en Syrie"
 SYR_IRAQI_INTERVENTION_TT:0 "Nous devons sécuriser le nord de la Syrie et soit le conserver pendant la durée impartie, soit obtenir la capitulation du régime syrien ; faute de quoi, notre intégrité territoriale pourrait être gravement menacée."
