l_french: 
 TRADE_PRICE_TT:0 "Prix par unité en milliards"
 RSS_TRADE_TT:0 "§YRessources brutes§!\nCommerce de produits pétrochimiques, de métaux légers, de métaux de construction, de terres rares, de matières alimentaires et nucléaires via l'écran de commerce natif. Les transactions sont payées en argent chaque mois au prix mondial."
 CON_TRADE_TT:0 "§YBiens de consommation§!\nLes biens de base, les biens durables, les véhicules civils et les appareils électroniques grand public se négocient via l'écran de commerce natif comme des ressources brutes. Utilisez le filtre de ressources ci-dessous pour répertorier les vendeurs pour chacun."
 CWIC_TRADE_MONEY_BOX:0 "Importations : §R-$$[?cwic_tb_imp|1]M§! Exportations : §G+$$[?cwic_tb_exp|1]M§!\nNet : $$[?cwic_tb_net|+1]M Plafond d'importation utilisé : [?cwic_tb_cap_used|Y0%]"
 CG_TIER_ROW:0 "Qualité :"
 CG_TIER_ROW_TT:0 "§YQualité§!\nNiveau fourni/niveau attendu pour chaque bien.\n\nLe niveau fourni mélange votre propre niveau de production avec le niveau moyen mondial de ce que vous importez. Le retard par rapport au niveau attendu ajoute aux pénalités de pénurie."
 CG_SHORTAGE_ROW:0 "Pénurie :"
 CG_SHORTAGE_ROW_TT:0 "§YNiveau de pénurie§!\n0 signifie que l'approvisionnement et la qualité répondent aux attentes ; 5 est une panne systémique. Il augmente avec la demande non satisfaite (Consommation C : inférieure à 100 %) et avec des biens plus anciens que le niveau attendu.\n\nLe pire niveau parmi les quatre biens est à l'origine de la crise §YPénurie de biens de consommation§! sur l'écran Finance."
 CG_EFFECTS_BOX:0 "Stratégie : §Y[GetCgStrategyName]§!\nStabilité : [?CWIC_DM_CG_STABILITY_FACTOR|%1] Productivité : [?CWIC_DM_CG_PRODUCTIVITY_FACTOR|%1]"
 CG_STRAT_TITLE:0 "Industrie de consommation : §Y[GetCgStrategyName]§!"
 CG_STRAT_TITLE_TT:0 "§YStratégie de l'industrie de la consommation§!\nComment les usines répartissent la production de biens de consommation entre les biens de base, les biens durables, les véhicules civils et l'électronique grand public. Les déficits sont couverts par les importations via l'écran Commerce (vue Consommateur)."
 cg_strat_name_0:0 "Équilibré"
 cg_strat_name_1:0 "Besoins fondamentaux"
 cg_strat_name_2:0 "Biens durables"
 cg_strat_name_3:0 "Axé sur l'exportation"
 CG_STRAT_BALANCED:0 "Équilibré"
 CG_STRAT_BASIC:0 "Besoins fondamentaux"
 CG_STRAT_DURABLES:0 "Biens durables"
 CG_STRAT_EXPORT:0 "Axé sur l'exportation"
 CG_STRAT_BALANCED_TT:0 "§YÉquilibré§!\nLes usines répartissent la production selon des pondérations automatiques : les pénuries d'abord, puis ce qu'exige le niveau de développement de la population.\n\n§gUne stratégie peut être modifiée une fois tous les 6 mois.§!"
 CG_STRAT_BASIC_TT:0 "§YBesoins fondamentaux§!\nRéorienter les usines vers les biens de tous les jours et les biens durables. Les véhicules et l'électronique sont pour la plupart importés.\n\nBasique §G+60%§! Durable §G+20%§! Véhicules §R-50%§! Électronique §R-50%§!\n\n§gUne stratégie peut être modifiée une fois tous les 6 mois.§!"
 CG_STRAT_DURABLES_TT:0 "§YBiens de consommation durables§!\nDévelopper la production d'appareils électroménagers et d'appareils ménagers, le deuxième échelon habituel de l'industrialisation.\n\nBasique §R-10%§! Durable §G+60%§! Véhicules §G+10%§! Électronique §R-20%§!\n\n§gUne stratégie peut être modifiée une fois tous les 6 mois.§!"
 CG_STRAT_EXPORT_TT:0 "§YHaute technologie axée sur l'exportation§!\nDonner la priorité aux voitures et à l'électronique, les biens les plus précieux par usine sur le marché mondial. Les produits de base peuvent devoir être importés.\n\nBasique §R-20%§! Durable §R-15%§! Véhicules §G+80%§! Électronique §G+80%§!\nLes véhicules ont besoin de parcs de bureaux et de capacités automobiles ; l'électronique a également besoin de terres rares.\n\n§gUne stratégie peut être modifiée une fois tous les 6 mois.§!"
