 CG_EFFECTS_BOX_TT:0 "§YApprovisionnement en biens de consommation§!\nEffet combiné des pénuries de biens de consommation et des biens obsolètes, du modificateur Fourniture de biens de consommation.\n\nEffectif : [?CWIC_DM_CG_WORKFORCE_RATIO|%1]\nDépenses sociales : [?CWIC_DM_CG_WELFARE_SPENDING_MOD|%1]\nDépenses policières : [?CWIC_DM_CG_POLICING_SPENDING_MOD|%1]\nDépenses de services publics : [?CWIC_DM_CG_PUBLIC_SERVICES_SPENDING_MOD|%1]\nRevenus du parc industriel : [?CWIC_DM_CG_INDUSTRIAL_PARK_INCOME_BONUS|%1]\nRevenus du parc de bureaux : [?CWIC_DM_CG_OFFICE_PARK_INCOME_BONUS|%1]"
