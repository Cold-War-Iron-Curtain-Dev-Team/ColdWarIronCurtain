l_french: 

 GDR_Prime_Minister_Nuschke: "Premier ministre Nuschke"
 GDR_Prime_Minister_Nuschke_desc: "Otto Nuschke a réussi à ravir la direction de la RDA à Walter Ulbricht ; il est temps de le reconnaître officiellement comme notre nouveau Premier ministre."
 GDR_Announce_Rollback_of_Recent_Economic_Changes: "Annuler les changements économiques récents"
 GDR_Announce_Rollback_of_Recent_Economic_Changes_desc: "Les récentes réformes économiques adoptées par l'administration précédente doivent être annulées avant qu'elles n'infligent des dommages irréparables à la République."
 GDR_An_End_to_the_Bloc: "La fin du bloc"
 GDR_An_End_to_the_Bloc_desc: "Le Bloc Démocrate a atteint son objectif, il est temps de le remplacer par une alliance de partis plus efficace pour nous aider à gérer l'appareil d'État."
 GDR_Halt_Agricultural_Collectivization_Efforts: "Arrêter les efforts de collectivisation agricole"
 GDR_Halt_Agricultural_Collectivization_Efforts_desc: "Nous avons vu les résultats catastrophiques qu'a eu la collectivisation agricole, nous ne serons pas une autre statistique !"
 GDR_Reform_the_Church_Ministry: "Réformer le ministère de l'Église"
 GDR_Reform_the_Church_Ministry_desc: "La religion et le socialisme entretiennent des relations très tendues. Quoi qu'il en soit, si nous parvenons à trouver un moyen de coexister, cela profiterait grandement à la population."
 GDR_Investigate_Stasi_Overreach: "Enquêter sur les excès de la Stasi"
 GDR_Investigate_Stasi_Overreach_desc: "Les rumeurs inquiétantes deviennent trop bruyantes et trop nombreuses pour être ignorées. Il est temps de lancer une enquête formelle sur les agissements de la Stasi."
 GDR_Relieve_Hilde_Benjamin: "Soulager Hilde Benjamin"
 GDR_Relieve_Hilde_Benjamin_desc: "Les méthodes trop zélées d'Hilde Benjamin ne peuvent plus être tolérées. Son mandat de ministre de la Justice doit prendre fin."
 GDR_Dealing_with_the_Soviets: "Faire face aux Soviétiques"
 GDR_Dealing_with_the_Soviets_desc: "Un changement de direction rend toujours Moscou nerveux, il vaudrait mieux organiser un communiqué officiel pour les assurer que tout va bien en RDA."
 GDR_Delegate_the_Foriegn_Ministry_to_SED: "Déléguer le ministère des Affaires étrangères au SED"
 GDR_Delegate_the_Foriegn_Ministry_to_SED_desc: "Le SED a toujours pour objectif de représenter la RDA sur la scène mondiale. Cela devrait les satisfaire pour le moment à l'égard de notre règle."
 GDR_Centralize_State_Power: "Centraliser le pouvoir de l'État"
 GDR_Centralize_State_Power_desc: "Afin d'éviter le régionalisme et d'éventuelles crises politiques, l'autorité de l'État doit être fermement centralisée à Berlin."
 GDR_Establish_New_Regional_Goverments: "Établir de nouveaux gouvernements régionaux"
 GDR_Establish_New_Regional_Goverments_desc: "Les anciennes méthodes impériales et nazies de gouvernement régional étaient inefficaces et tenaient pratiquement le pays tout entier en otage aux caprices de la Prusse. Un nouveau système plus équilibré est nécessaire."
 GDR_Reform_the_Judiciary: "Réformer le système judiciaire"
 GDR_Reform_the_Judiciary_desc: "Les tribunaux sont remplis de juges qui sont bons pour les procès simulés, mais inefficaces pour les fonctions normales du pouvoir judiciaire. Il est temps de procéder à une refonte majeure."
 GDR_Announce_Elections_for_1955: "Annoncer les élections pour 1955"
 GDR_Announce_Elections_for_1955_desc: "Maintenant que nos réformes sont achevées, nous sommes convaincus qu'une élection apporterait une légitimité à notre gouvernement et à la RDA."
