 crushed_intenral_opposition:0 "L'opposition interne écrasée"
 entral_africa.101.d:0 "L'empereur Bokassa Ier de l'Empire centrafricain a ordonné et probablement participé au massacre en avril d'une centaine d'écoliers, a déclaré aujourd'hui une commission africaine d'experts juridiques.\n Le président de la commission a cité des témoins qui ont déclaré que l'empereur autoproclamé avait arraché l'oeil d'un écolier avec une canne aiguisée et abattu 39 personnes.\nLa commission d'enquête composée de cinq hommes, créée en mai lors d'une réunion des dirigeants français et africains, a déclaré dans son rapport publié aujourd'hui que les corps des enfants massacrés avaient été enterrés dans des fosses communes ou jetés dans une rivière.\nDe nombreux témoignages objectifs précis et concordants indiquent que l'empereur Bokassa a été présent à trois moments différents à l'intérieur de la prison de Ngarba et a participé aux massacres, a indiqué la commission."
 central_africa.600:0 "L'empereur Bokassa Ier de l'Empire centrafricain, qui dirigeait ce pays de manière autocratique depuis 1965, a été renversé hier soir lors d'un coup d'État sans effusion de sang, a rapporté l'Agence France-Presse depuis Bangui, la capitale, citant des sources de l'ambassade de France.\nL'agence de presse a indiqué que David Dacko, un ancien président de 49 ans, avait pris le pouvoir et proclamé le pays république. En 1965, l'Empereur, alors colonel Jean-Bédel Bokassa, a évincé M. Dacko et l'a assigné à résidence. Il l'a libéré et l'a engagé comme conseiller personnel il y a trois ans.\n Selon un rapport, l'empereur âgé de 58 ans aurait fui le pays, probablement pour la Libye."
