 CAR_70s_Bokassas_Regime:0 "Le régime de Bokassa"
 CAR_70s_Bokassas_Regime_desc:0 "Continuons le règne de Bokassa."
 CAR_70s_Seek_Aid_From_France:0 "Demander de l'aide à la France"
 CAR_70s_Seek_Aid_From_France_desc:0 "La République a besoin d'aide. Il doit atteindre ses objectifs."
 CAR_70s_Trade_Uranium:0 "Échanger de l'uranium"
 CAR_70s_Trade_Uranium_desc:0 "Nos ressources naturelles peuvent nous garantir une aide étrangère."
 CAR_70s_Uranium_Fever:0 "Fièvre de l'uranium"
 CAR_70s_Uranium_Fever_desc:0 "Nous devons augmenter notre production d'uranium."
 CAR_70s_Aid_From_Gaddafi:0 "Aide de Kadhafi"
 CAR_70s_Aid_From_Gaddafi_desc:0 "Visitons la Libye et obtenons toute l'aide dont ils pourraient disposer."
 CAR_70s_Reliance_on_Others:0 "Dépendance aux autres"
 CAR_70s_Reliance_on_Others_desc:0 "Nous devons reconnaître que notre économie n'est pas forte à elle seule."
 CAR_70s_Foriegn_Dependence:0 "Dépendance étrangère"
 CAR_70s_Foriegn_Dependence_desc:0 "Nous dépendons de pays étrangers pour une grande partie de notre industrie actuelle."
 CAR_70s_Egalitarian_Reforms:0 "Réformes égalitaires"
 CAR_70s_Egalitarian_Reforms_desc:0 "Les femmes méritent un rôle dans notre nation."
 CAR_70s_Promote_Bokassa_to_General:0 "Promouvoir Bokassa"
 CAR_70s_Promote_Bokassa_to_General_desc:0 "Bien qu'il soit le grand Bokassa, Bokassa n'est même pas un général. Il faut lui donner la place qui lui revient."
 CAR_70s_Promote_Bokassasim:0 "Répandre le bokassa-isme"
 CAR_70s_Promote_Bokassasim_desc:0 "Notre seule croyance est en notre leader."
 CAR_70s_One_Man_State:0 "État d'un seul homme"
 CAR_70s_One_Man_State_desc:0 "Un seul homme dirige ce pays."
 CAR_70s_Consolidation_of_Power:0 "Consolidation du pouvoir"
 CAR_70s_Consolidation_of_Power_desc:0 "Nous sommes aptes à poursuivre nos réformes avec nos nouveaux pouvoirs."
 CAR_70s_Subservience_of_MESAN:0 "Dominez MESAN"
 CAR_70s_Subservience_of_MESAN_desc:0 "MESAN doit se plier à notre volonté."
 CAR_70s_One_Party_State:0 "État à parti unique"
 CAR_70s_One_Party_State_desc:0 "Il est absurde de croire qu'un seul homme puisse gérer seul une nation."
 CAR_70s_Modernization:0 "Modernisation"
 CAR_70s_Modernization_desc:0 "Nous devons encourager la laïcité et d'autres attitudes occidentales à l'égard de notre pays."
 CAR_70s_Capitalist_Reforms:0 "Réformes capitalistes"
 CAR_70s_Capitalist_Reforms_desc:0 ""
 CAR_70s_President_for_Life:0 "Président à vie"
 CAR_70s_President_for_Life_desc:0 "Bokassa dirigera notre nation aussi longtemps qu'il le pourra."
 CAR_70s_Central_Africa_to_the_Forefront:0 "L'Afrique centrale au premier plan"
 CAR_70s_Central_Africa_to_the_Forefront_desc:0 "Nous devons faire tout ce qu'il faut pour que notre nation se démarque du reste de l'Afrique."
 CAR_70s_Give_France_our_Diamonds:0 "Offrez des diamants à la France"
 CAR_70s_Give_France_our_Diamonds_desc:0 "Nous devons rembourser l'aide française d'une manière ou d'une autre. Pourquoi ne pas offrir une belle récompense à certains de leurs fonctionnaires ?"
 CAR_70s_The_Monarchy_Proposal:0 "La proposition monarchique"
 CAR_70s_The_Monarchy_Proposal_desc:0 "Le monarchisme est un trait distinctif de toute nation. Par exemple, l'Éthiopie n'a résisté aux Européens que parce qu'elle était une monarchie forte dirigée par un seul homme."
 CAR_70s_Relations_with_France:0 "Des relations avec la France ?"
 CAR_70s_Relations_with_France_desc:0 "On voudra peut-être se rapprocher de la France pour encourager les investissements"
 CAR_70s_French_Advisors:0 "Conseillers français"
 CAR_70s_French_Advisors_desc:0 "Demandons des conseillers à la France. Ils nous aideront à devenir plus forts."
 CAR_70s_Dependency_with_France:0 "Dépendance à la France"
 CAR_70s_Dependency_with_France_desc:0 "Notre dépendance première doit être vis-à-vis de la France et d'aucun autre pays. Nous entretenons une relation unique avec la France depuis notre création."
 CAR_70s_Frenchify_our_Creole:0 "Frenchifier notre créole"
 CAR_70s_Frenchify_our_Creole_desc:0 "Nous devons nous assurer que notre français est à la hauteur des normes du continent."
 CAR_70s_Join_Francafrique:0 "Rejoignez Francafrique"
 CAR_70s_Join_Francafrique_desc:0 "Lions-nous officiellement à la France."
 CAR_70s_A_More_Direct_Relationship:0 "Une relation plus directe"
 CAR_70s_A_More_Direct_Relationship_desc:0 "Nous devrions négocier avec les Français pour assurer notre place actuelle."
 CAR_70s_French_Central_Africa:0 "Afrique Centrale Française"
 CAR_70s_French_Central_Africa_desc:0 "Changeons formellement notre nom afin que personne n'oublie à qui appartiennent nos allégeances."
 CAR_70s_Promote_Creole:0 "Promouvoir le créole"
 CAR_70s_Promote_Creole_desc:0 "Les langues autochtones ne font que nous diviser. Adoptons la langue du futur : le français."
 CAR_70s_Mainland_Supplies:0 "Fournitures du continent"
 CAR_70s_Mainland_Supplies_desc:0 "Cela ne dérangerait sûrement pas les Français si nous prenions une partie de leurs approvisionnements."
 CAR_70s_Welcome_Back_Colonialism:0 "Bon retour au colonialisme"
 CAR_70s_Welcome_Back_Colonialism_desc:0 "Le néocolonialisme est terne comparé au colonialisme. Réinvitons nos associés français sous la main de Bokassa."
 CAR_70s_Invite_Foriegn_Leaders:0 "Inviter des dirigeants étrangers"
 CAR_70s_Invite_Foriegn_Leaders_desc:0 "Dans le cadre de nos préparatifs, nous devrions envoyer des invitations aux principaux pays. S'ils acceptent, ils nous donneront beaucoup de prestige."
 CAR_70s_Seek_French_Support:0 "Rechercher du soutien français"
 CAR_70s_Seek_French_Support_desc:0 "Il faudrait interroger la France avant de décider de convoquer le sacre. Ils peuvent nous aider à le planifier."
 CAR_70s_French_Supplies:0 "Fournitures françaises"
 CAR_70s_French_Supplies_desc:0 "Demandons à la France les choses dont nous aurons besoin pour le sacre."
 CAR_70s_Napoleon_of_Africa:0 "Napoléon d'Afrique"
 CAR_70s_Napoleon_of_Africa_desc:0 "Il faudrait rechercher une cérémonie aussi grande que le couronnement de Napoléon. Rien de pire ne fera pour Bokassa."
 CAR_70s_Prepare_for_the_Coronation:0 "Préparez-vous au couronnement"
 CAR_70s_Prepare_for_the_Coronation_desc:0 "Faisons les derniers préparatifs avant de déclarer officiellement une monarchie."
 CAR_70s_Stay_Muslim:0 "Restez musulman"
 CAR_70s_Stay_Muslim_desc:0 "Bokassa ne changera pas de religion, quoi qu'en dise la communauté internationale."
 CAR_70s_Convert_to_Catholicism:0 "Se convertir au catholicisme"
 CAR_70s_Convert_to_Catholicism_desc:0 "Nous ne voulons pas être perçus comme un califat. Apaisons les craintes potentielles et convertissons-nous à la religion du catholicisme français."
 CAR_70s_Central_African_Caliphate:0 "Califat centrafricain"
 CAR_70s_Central_African_Caliphate_desc:0 "Changeons le nom de notre pays en quelque chose qui convienne mieux à notre monarque islamique."
 CAR_70s_Central_African_Empire:0 "Empire centrafricain"
 CAR_70s_Central_African_Empire_desc:0 "Le nom d'Empire va véritablement accroître l'intérêt pour notre nation. Un royaume semble trop terne et une république est hors de question."
 CAR_70s_More_French_Support:0 "Plus de support en français"
 CAR_70s_More_French_Support_desc:0 "Les Français sont très contents de notre conversion au catholicisme. Je suis tellement heureux qu'ils puissent nous aider davantage."
 CAR_70s_Integrating_Islam:0 "Intégrer l'Islam"
 CAR_70s_Integrating_Islam_desc:0 "Quelques endroits dans notre pays sont majoritairement musulmans. Nous devrions leur plaire en intégrant l'Islam dans notre gouvernement."
 CAR_70s_The_Coronation:0 "Le couronnement"
 CAR_70s_The_Coronation_desc:0 "Salut à tous Bokassa ! Il est le Soleil de la nouvelle Centrafrique !"
 CAR_70s_Repression:0 "Répression"
 CAR_70s_Repression_desc:0 "Les critiques à l'égard de Bokassa ne sont que trop fréquentes. Bokassa ne peut plus être calomnié."
 CAR_70s_Torture:0 "Torture"
 CAR_70s_Torture_desc:0 "Une suite logique. Les dissidents n'ont pas leur place sous Bokassa."
 CAR_70s_Human_Flesh:0 "Chair humaine"
 CAR_70s_Human_Flesh_desc:0 "Les gardes de Bokassa affirment que l'homme fréquente les petites villes. On dit que les villes hurlent la nuit. Quoi qu'il arrive, ce n'est pas bon."
 CAR_70s_International_Ridicule:0 "Ridicule international"
 CAR_70s_International_Ridicule_desc:0 "Nos idées pour promouvoir l'Afrique Centrale n'ont fait que nous faire gagner en notoriété. Qu'importe, l'Afrique Centrale n'aura pas besoin du monde."
 CAR_70s_Economic_Failure:0 "Échec économique"
 CAR_70s_Economic_Failure_desc:0 "Personne ne veut s'associer à l'État que nous avons créé."
 CAR_70s_Cut_Foriegn_Ties:0 "Couper les liens avec l'étranger"
 CAR_70s_Cut_Foriegn_Ties_desc:0 "Le seul objectif des Nations Unies est de nous rabaisser."
 CAR_70s_Isolationism:0 "Isolationnisme"
 CAR_70s_Isolationism_desc:0 "L'Afrique centrale ne peut être classée parmi les autres petites nations."
 CAR_70s_Another_Disastrous_Year:0 "Une autre année désastreuse"
 CAR_70s_Another_Disastrous_Year_desc:0 "Rien n'a changé depuis l'année dernière. Les choses n'ont fait qu'empirer."
 CAR_70s_New_General_Development_Plan:0 "Nouveau Plan Général de Développement"
 CAR_70s_New_General_Development_Plan_desc:0 "L'Afrique centrale va se développer. Rien ne peut arrêter notre nouveau plan pour l'économie."
 CAR_70s_Lack_of_Investors:0 "Manque d'investisseurs"
 CAR_70s_Lack_of_Investors_desc:0 "Quelle surprise. Notre gouvernement est considéré comme la racaille de l'Afrique."
 CAR_70s_Violent_Crackdown:0 "Répression violente"
 CAR_70s_Violent_Crackdown_desc:0 "Bokassa fait face à de nouvelles protestations. Il n'y a qu'une seule solution."
 CAR_70s_Border_Tensions:0 "Tensions frontalières"
 CAR_70s_Border_Tensions_desc:0 "Notre pays est assiégé par des passages illégaux. Nous devons déplacer nos troupes vers toutes nos frontières."
 CAR_70s_Renew_Equipment:0 "Renouveler l'équipement"
 CAR_70s_Renew_Equipment_desc:0 "Nous devons rééquiper nos soldats du matériel dont ils ont besoin pour sécuriser notre pays."
 CAR_70s_Brutal_Camps:0 "Camps brutaux"
 CAR_70s_Brutal_Camps_desc:0 "Nous devons poursuivre notre répression contre les manifestants."
 CAR_70s_Reverse_Course:0 "Inverser le cours"
 CAR_70s_Reverse_Course_desc:0 "Notre politique économique n'aide personne. Nous devons le repenser."
 CAR_70s_Criticize_the_Development_Plan:0 "Critiquer le plan de développement"
 CAR_70s_Criticize_the_Development_Plan_desc:0 "Le plan n'a servi à rien. Nous devons le reconnaître."
 CAR_70s_Nepotism:0 "Népotisme"
 CAR_70s_Nepotism_desc:0 "Bokassa dispose d'un noyau de partisans qu'il faut prioriser."
 CAR_70s_Student_Riots:0 "Émeutes étudiantes"
 CAR_70s_Student_Riots_desc:0 "Les étudiants centrafricains refusent de porter les vêtements dessinés par l'épouse de Bokassa ! C'est inacceptable."
 CAR_70s_Food_Riots:0 "Émeutes alimentaires"
 CAR_70s_Food_Riots_desc:0 "L'isolationnisme a apparemment stoppé toutes les importations de produits alimentaires. Nous devons agir rapidement pour résoudre ce problème."
 CAR_70s_Solidify_Power:0 "Solidifier le pouvoir"
 CAR_70s_Solidify_Power_desc:0 "Peut-être que nos précédentes mesures de répression n'ont pas démontré notre point de vue. Il ne peut y avoir de retour en arrière par rapport au bokassa-isme."
 CAR_70s_Central_African_State:0 "État d'Afrique centrale"
 CAR_70s_Central_African_State_desc:0 "Nous devons nous distinguer de nos voisins. Nous sommes un État de Centrafricains."
 CAR_70s_Bokassa_Worship:0 "Culte Bokassa"
 CAR_70s_Bokassa_Worship_desc:0 "C'est lui qui nous a sortis de la pauvreté. Il nous a apporté son aide et il travaille pour nous seuls."
 CAR_70s_Bokassa_Our_Leader:0 "Bokassa notre chef"
 CAR_70s_Bokassa_Our_Leader_desc:0 "Gloire à Bokassa pour l'éternité !"
 CAR_70s_Operation_Barraccuda:0 "Opération Barracuda"
 CAR_70s_Operation_Barraccuda_desc:0 "Dans une frappe rapide, les forces françaises en garnison près de Bangui se sont déplacées vers le palais présidentiel et ont enlevé Bokassa ! Le pays est en pleine tourmente."
 CAR_70s_Dackos_Back:0 "Dacko est de retour"
 CAR_70s_Dackos_Back_desc:0 "Les Français ont déposé Dacko à notre porte. Il semble qu'il soit désormais notre chef."
 CAR_70s_Plan_for_Democracy:0 "Plan pour la démocratie"
 CAR_70s_Plan_for_Democracy_desc:0 "Nous devons démanteler cet État dégoûtant qu'a construit Bokassa. Il n'y a pas d'autre espoir pour notre peuple."
 
