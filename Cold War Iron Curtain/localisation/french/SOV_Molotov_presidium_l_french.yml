 SOV_mpres_char_molotov:0 "Viatcheslav Molotov"
 SOV_mpres_char_molotov_ui:0 "§YViatcheslav Molotov§!"
 SOV_mpres_char_molotov_faction:0 "§iVieille garde stalinienne§!"
 SOV_mpres_char_molotov_tt:0 "§YViatcheslav Molotov§!\nSecrétaire général du Comité central. Le dernier des vieux bolcheviks tient désormais le parti entre ses mains.\n\nFaction : §iVieille Garde stalinienne§!\nPolitburo : §YMembre à part entière§!\nRelation avec le leader : §G+100§!\n\n§YDiplomate§!: S'est assis en face de Churchill et Truman.\n§YIdéologue§!: Gardien de la pureté doctrinale."
 SOV_mpres_char_molotov_tt_leader:0 "§YViatcheslav Molotov§!\nSecrétaire général du Comité central. Le dernier des vieux bolcheviks tient désormais le parti entre ses mains.\n\n§YComment lire le panneau§!\nNoms : §Yor§! membre à part entière, membre candidat blanc, §ggris§! non membre du Politburo.\nFactions : §iVieille Garde stalinienne§!, §4Technocrates§!, §0Organes de sécurité§!, §6Modérés du Parti§!, §uL'Armée§!.\nSurvolez un portrait pour connaître sa faction, son statut et ses caractéristiques."
 SOV_mpres_char_kaganovich:0 "Lazar Kaganovitch"
 SOV_mpres_char_kaganovich_ui:0 "§YLazar Kaganovitch§!"
 SOV_mpres_char_kaganovich_faction:0 "§iVieille garde stalinienne§!"
 SOV_mpres_char_kaganovich_tt:0 "§YLazar Kaganovitch§!\nDeuxième secrétaire du Comité central. Le commissaire de fer dirige désormais l'appareil du parti.\n\nFaction : §iVieille Garde stalinienne§!\nPolitburo : §YMembre à part entière§!\nRelation avec le leader : §G+70§!\n\n§YIndustriel§!: Construit des usines à partir de rien, quel qu'en soit le prix.\n§YBrutal§!: Signer des listes sans les lire."
 SOV_mpres_char_malenkov:0 "Gueorgui Malenkov"
 SOV_mpres_char_malenkov_ui:0 "§YGueorgui Malenkov§!"
 SOV_mpres_char_malenkov_faction:0 "§4Technocrates§!"
 SOV_mpres_char_malenkov_tt:0 "§YGueorgui Malenkov§!\nPrésident du Conseil des Ministres. Il dirige la machine d'État et l'économie au jour le jour.\n\nFaction : §4Technocrates§!\nPolitburo : §YMembre à part entière§!\nRelation avec le leader : §G+60§!\n\n§YApparatchik§!: Une créature de la machine du parti qui connaît chaque dossier et chaque faveur.\n§YPlanner§!: Pense en tonnes, quotas et horizons quinquennaux."
 SOV_mpres_char_shepilov:0 "Dmitri Chepilov"
 SOV_mpres_char_shepilov_ui:0 "Dmitri Chepilov"
 SOV_mpres_char_shepilov_faction:0 "§6Modérateurs de fête§!"
 SOV_mpres_char_shepilov_tt:0 "§YDmitri Chepilov§!\nVice-Premier ministre. Le rédacteur en chef de la Pravda est devenu administrateur économique.\n\nFaction : §6Modérés du parti§!\nPolitburo : membre candidat\nRelation avec le leader : §G+40§!\n\n§YIdéologue§!: Gardien de la pureté doctrinale.\n§YÉrudit§!: Lit plus que ce qui est sécuritaire."
 SOV_mpres_char_pervukhin:0 "Mikhaïl Pervoukhine"
 SOV_mpres_char_pervukhin_ui:0 "Mikhaïl Pervoukhine"
 SOV_mpres_char_pervukhin_faction:0 "§4Technocrates§!"
 SOV_mpres_char_pervukhin_tt:0 "§YMikhaïl Pervoukhine§!\nVice-Premier ministre chargé des industries chimique, énergétique et nucléaire ; un vétéran du projet atomique.\n\nFaction : §4Technocrates§!\nPolitburo : membre candidat\nRelation avec le leader : §G+50§!\n\n§YPlanner§!: Pense en tonnes, quotas et horizons quinquennaux.\n§YIndustriel§!: Construit des usines à partir de rien, quel qu'en soit le prix."
 SOV_mpres_char_suslov:0 "Mikhaïl Souslov"
 SOV_mpres_char_suslov_ui:0 "§YMikhaïl Souslov§!"
 SOV_mpres_char_suslov_faction:0 "§iVieille garde stalinienne§!"
 SOV_mpres_char_suslov_tt:0 "§YMikhaïl Souslov§!\nSecrétaire du CC pour l'idéologie. Le cardinal gris du parti garde la doctrine pure.\n\nFaction : §iVieille Garde stalinienne§!\nPolitburo : §YMembre à part entière§!\nRelation avec le leader : §G+35§!\n\n§YIdéologue§!: Gardien de la pureté doctrinale.\n§YApparatchik§!: Une créature de la machine du parti qui connaît chaque dossier et chaque faveur."
 SOV_mpres_char_shelepin:0 "Alexandre Shelepin"
 SOV_mpres_char_shelepin_ui:0 "Alexandre Shelepin"
 SOV_mpres_char_shelepin_faction:0 "§0Organes de sécurité§!"
 SOV_mpres_char_shelepin_tt:0 "§YAlexandre Shelepin§!\nPrésident du KGB. Le jeune chef du Komsomol possède désormais l'épée et le bouclier du parti.\n\nFaction : §0Organes de sécurité§!\nPolitburo : membre candidat\nRelation avec le leader : §G+45§!\n\n§YChekist§!: Formé dans les organes de sécurité. Il voit des intrigues partout et a parfois raison.\n§YÉrudit§!: Lit plus que ce qui est sécuritaire."
 SOV_mpres_char_kruglov:0 "Sergueï Kruglov"
 SOV_mpres_char_kruglov_ui:0 "Sergueï Kruglov"
 SOV_mpres_char_kruglov_faction:0 "§0Organes de sécurité§!"
 SOV_mpres_char_kruglov_tt:0 "§YSergueï Kruglov§!\nMinistre de l'Intérieur. Maître des camps, de la militsiya et des passeports.\n\nFaction : §0Organes de sécurité§!\nPolitburo : membre candidat\nRelation avec le leader : §G+55§!\n\n§YChekist§!: Formé dans les organes de sécurité. Il voit des intrigues partout et a parfois raison.\n§YIndustriel§!: Construit des usines à partir de rien, quel qu'en soit le prix."
 SOV_mpres_char_konev:0 "Ivan Konev"
 SOV_mpres_char_konev_ui:0 "Ivan Konev"
 SOV_mpres_char_konev_faction:0 "§uL'armée§!"
 SOV_mpres_char_konev_tt:0 "§YIvan Konev§!\nMaréchal de l'Union soviétique, ministre de la Défense.\n\nFaction : §uL'Armée§!\nPolitburo : membre candidat\nRelation avec le leader : §G+40§!\n\n§YSoldat§!: A porté l'uniforme pendant la guerre et pense toujours comme un commandant du front.\n§YPlanner§!: Pense en tonnes, quotas et horizons quinquennaux."
 SOV_mpres_char_kuznetsov:0 "Nikolaï Kouznetsov"
 SOV_mpres_char_kuznetsov_ui:0 "Nikolaï Kouznetsov"
 SOV_mpres_char_kuznetsov_faction:0 "§uL'armée§!"
 SOV_mpres_char_kuznetsov_tt:0 "§YNikolaï Kouznetsov§!\nMinistre de la Marine. Enfin de retour de la honte de 1948.\n\nFaction : §uL'Armée§!\nPolitburo : membre candidat\nRelation avec le leader : §G+30§!\n\n§YMarin§!: Un marin dans le gouvernement d'une puissance terrestre.\n§YÉrudit§!: Lit plus que ce qui est sécuritaire."
 SOV_mpres_char_gromyko:0 "Andreï Gromyko"
 SOV_mpres_char_gromyko_ui:0 "§gAndreï Gromyko§!"
 SOV_mpres_char_gromyko_faction:0 "§4Technocrates§!"
 SOV_mpres_char_gromyko_tt:0 "§YAndreï Gromyko§!\nMinistre des Affaires étrangères. L'homme qui dit non.\n\nFaction : §4Technocrates§!\nPolitburo : §gPas membre§!\nRelation avec le leader : §G+45§!\n\n§YDiplomate§!: S'est assis en face de Churchill et Truman.\n§YÉrudit§!: Lit plus que ce qui est sécuritaire."
 SOV_mpres_char_voroshilov:0 "Kliment Vorochilov"
 SOV_mpres_char_voroshilov_ui:0 "§YKliment Vorochilov§!"
 SOV_mpres_char_voroshilov_faction:0 "§iVieille garde stalinienne§!"
 SOV_mpres_char_voroshilov_tt:0 "§YKliment Vorochilov§!\nPrésident du Présidium du Soviet suprême - chef de l'Etat et le camarade le plus âgé de tous.\n\nFaction : §iVieille Garde stalinienne§!\nPolitburo : §YMembre à part entière§!\nRelation avec le leader : §G+50§!\n\n§YSoldat§!: A porté l'uniforme pendant la guerre et pense toujours comme un commandant du front.\n§YIdéologue§!: Gardien de la pureté doctrinale."
 SOV_mpres_char_bulganin:0 "Nikolaï Boulganine"
 SOV_mpres_char_bulganin_ui:0 "§YNikolaï Boulganine§!"
 SOV_mpres_char_bulganin_faction:0 "§6Modérateurs de fête§!"
 SOV_mpres_char_bulganin_tt:0 "§YNikolaï Boulganine§!\nPrésident de Gosplan. Un maréchal politique devenu administrateur économique.\n\nFaction : §6Modérés du parti§!\nPolitburo : §YMembre à part entière§!\nRelation avec le leader : §G+45§!\n\n§YApparatchik§!: Une créature de la machine du parti qui connaît chaque dossier et chaque faveur.\n§YSoldat§!: A porté l'uniforme pendant la guerre et pense toujours comme un commandant du front."
