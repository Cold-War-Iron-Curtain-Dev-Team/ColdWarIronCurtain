l_french:

 THIRD_BALKAN_WAR.0.d:0 "La récente proclamation de l'Enosis par la communauté chypriote grecque et le gouvernement grec a conduit à une crise internationale majeure. Sur le plan international, la Grèce est accusée de porter atteinte aux accords internationaux pour protéger ses propres intérêts. La Turquie et son peuple sont particulièrement en colère car beaucoup pensent qu'Enosis va connaître une nouvelle série d'expulsions et une agression culturelle contre la communauté chypriote turque. De nombreux dirigeants de la communauté turque se rendent déjà en Turquie pour rallier le soutien du public. La petite force militaire turque présente sur l'île, travaillant avec les milices turques locales, aurait occupé la partie nord de Chypre. Les troupes grecques et leurs partisans ont formé un périmètre autour des lignes turques, car beaucoup craignent que la crise de l'Enosis ne conduise à des hostilités ouvertes."
 THIRD_BALKAN_WAR.1.d:0 "Les troupes turques stationnées à Chypre, en collaboration avec les milices turques chypriotes locales, ont occupé les quartiers turcs au nord de l'île après la proclamation d'Enosis. Les troupes grecques présentes sur l'île ont organisé un périmètre pour empêcher les forces chypriotes grecques d'engager l'armée turque. Le gouvernement turc refuse d'accepter l'Enosis, affirmant que cela entraînerait l'éradication culturelle de la communauté turque de l'île. Malgré sa prétention d'être une force défensive, l'occupation turque représente une tête de pont ennemie potentiellement hostile. Nous pouvons essayer de rechercher une partition avec la Turquie ou lancer un ultimatum de deux semaines à la Turquie pour qu'elle quitte l'île."
 THIRD_BALKAN_WAR.3.d:0 "Le gouvernement turc a catégoriquement rejeté l'offre grecque de partitionner Chypre. La Turquie est convaincue qu'un tel accord ne mènerait pas à une paix durable et récompenserait la Grèce pour sa violation flagrante des accords internationaux liés à Chypre. Le gouvernement turc semble déterminé non seulement à garantir ses intérêts à Chypre, mais également à empêcher tout contrôle grec sur l'île. La Grèce n'a pas répondu à l'offre, même si la décision risque d'enflammer les passions des peuples des deux pays. Les diplomates des deux pays rapportent qu'il semble y avoir peu d'efforts pour contenir la colère du public."
 THIRD_BALKAN_WAR.4.d:0 "La crise de l'Enosis a connu une nouvelle escalade lorsque la Grèce a donné à la Turquie deux semaines pour se retirer de Chypre. La tension actuelle est apparue après que les Chypriotes grecs ont déclaré l'Enosis ou l'unification avec la Grèce suite au retrait de la Grande-Bretagne de l'île. Bien que l'île soit majoritairement composée de Chypriotes grecs, l'importante population chypriote turque s'oppose à l'Enosis, affirmant qu'elle menace effectivement leur identité culturelle. Les troupes turques présentes sur l'île ont récemment occupé les quartiers turcs au nord de l'île et affrontent les troupes grecques qui tiennent le périmètre. La Grèce accuse la Turquie de tenir le peuple chypriote en otage de ses exigences et d'occuper illégalement l'île. Il promet d'achever la juste unification de tous les Grecs. Les analystes estiment que le gouvernement grec subit une pression énorme en raison d'une vague nationaliste qui a traversé le pays après Enosis."
 THIRD_BALKAN_WAR.5.d:0 "La crise de l'Enosis s'est transformée en un ultimatum de la Grèce contre la Turquie. Les deux camps se montrent obstinés sur cette question. La Grèce a certainement soutenu, voire aidé directement, les Chypriotes grecs pro-Enosis et cela semble être ce que souhaitent la plupart des habitants de l'île. Cependant, des accords internationaux ont été conclus pour garantir que Chypre assure la représentation de tous ses habitants, en particulier de l'importante population chypriote turque. En occupant Chypre et en refusant de mener des négociations, la Turquie a essentiellement forcé la Grèce à exiger son retrait. Si un conflit armé éclatait, il opposerait deux alliés de l'OTAN, ce qui affaiblirait considérablement l'alliance. Nous devons lancer un effort diplomatique, avec des menaces de sanctions, pour tenter de mettre un terme au conflit. Notre mission arrivera d'abord en Grèce, puis en Turquie."
 THIRD_BALKAN_WAR.6.d:0 "Une mission diplomatique de haut niveau des États-Unis est arrivée à Athènes pour des entretiens. Ils nous exhortent à retirer notre ultimatum et à garantir le statu quo à Chypre. Ils notent que les États-Unis ne choisiront aucun camp dans le conflit actuel et veilleront à ce que l'OTAN ne soit pas impliquée militairement. Plus important encore, si nous maintenons cet ultimatum, nous serons confrontés à des sanctions économiques et militaires immédiates. Les États-Unis n'ont pas dit que nous serions exclus de l'OTAN, mais plutôt que notre adhésion serait suspendue. Notre cabinet est divisé, certains pensent que nous devrions tenir compte de l'avertissement et démissionner, mais cela rendrait furieux le peuple grec. Les partisans de la ligne dure estiment que la Grèce peut survivre à de telles sanctions, mais qu'elle ne peut pas retarder une résolution permanente. Si la Turquie reste dans le nord de Chypre, elle transformera son occupation illégale en une forteresse et une tête de pont pour une future invasion."
 THIRD_BALKAN_WAR.7.d:0 "La Grèce a accepté de retirer son ultimatum à la Turquie après des négociations à Athènes avec les États-Unis. Les Américains ont exercé une immense pression sur la Grèce pour qu'elle retire son ultimatum. Des rapports indiquent que les États-Unis ont promis de sévères sanctions si la Grèce commençait les hostilités avec l'OTAN. La mission devrait désormais s'entretenir avec la Turquie. Le gouvernement turc n'a publié aucune déclaration à ce sujet. La nouvelle a déclenché des protestations de colère parmi les Grecs à travers le pays et à Chypre. Ils ont le sentiment que le gouvernement abandonne sa promesse sacrée d'Enosis, cédant à la pression internationale. L'armée grecque a publié sa propre déclaration, notant que malgré le retrait de l'ultimatum, la situation n'est toujours pas résolue et que l'armée reste déterminée à protéger le peuple grec."
 THIRD_BALKAN_WAR.8.d:0 "La délégation américaine à Athènes est partie pour Ankara déçue. Le gouvernement grec a refusé de retirer son ultimatum. Il affirme que la Turquie occupe des zones de Chypre qui sont en réalité grecques et que le gouvernement ne peut pas trahir ses promesses envers les Chypriotes grecs qui ont tant sacrifié pour Enosis. Les États-Unis auraient menacé de sanctions si un conflit éclatait et auraient garanti que l'OTAN ne s'impliquerait pas militairement. Des sources des deux côtés ont confirmé qu'il n'y avait eu aucune discussion sur l'expulsion ou la sortie de la Grèce de l'OTAN. Des rassemblements patriotiques ont été signalés pour soutenir la décision du gouvernement de rester engagé sur la voie de la libération de la Grèce."
 THIRD_BALKAN_WAR.9.d:0 "Une mission diplomatique américaine de haut niveau est arrivée à Ankara pour des entretiens. Ils exhortent la Turquie à faire preuve de retenue et à accepter le statu quo actuel. Ils notent que la situation ne peut pas être inversée et qu'une nouvelle escalade ne signifierait que la guerre. Les Américains ont affirmé que toute escalade entraînerait des sanctions économiques et militaires immédiates. Il serait interdit à l'OTAN de s'impliquer militairement. La Turquie et la Grèce seraient également suspendues de l'OTAN jusqu'à la fin des combats. Le cabinet turc est divisé. Certains veulent suivre les diktats américains, pour éviter les conflits ou le risque de sanctions américaines. Les partisans de la ligne dure affirment que le peuple n'acceptera pas de compromis et que la Turquie doit rester ferme sur la restauration de Chypre selon ce qui a été convenu au niveau international."
 THIRD_BALKAN_WAR.10.d:0 "Les États-Unis affirment que leurs efforts diplomatiques en Turquie ont été couronnés de succès. Dans une déclaration commune, la Turquie s'est déclarée prête à accepter le statu quo actuel à Chypre, promettant de ne pas aggraver le conflit. Ces pourparlers concluent un effort diplomatique éclair des États-Unis. Le Président a publié une déclaration exhortant les deux parties à profiter de cette dernière avancée pour résoudre pacifiquement la crise actuelle. Le gouvernement turc a déclaré qu'il ne cesserait pas de protéger les Turcs chypriotes et que, même s'il souhaite la paix, ses forces armées restent vigilantes. Le gouvernement grec n'a pas réagi à cette dernière évolution."
 THIRD_BALKAN_WAR.11.d:0 "Les États-Unis ont admis que leurs efforts en Turquie pour résoudre la crise de l'Enosis avaient échoué. Le gouvernement turc reste déterminé à protéger non seulement ses propres intérêts à Chypre, mais aussi à revenir au statu quo d'avant Enosis. Des sources affirment que le gouvernement turc ne semble pas se laisser décourager par les menaces de sanctions si un conflit éclate. La décision turque a été bien accueillie par les citoyens furieux de ce qu'ils considèrent comme une conspiration grecque visant à s'emparer de Chypre et à expulser sa population turque. En privé, une source diplomatique a noté que la décision turque reflète l'influence dominante des partisans de la ligne dure actuellement au sein du gouvernement."
 THIRD_BALKAN_WAR.12.d:0 "Après un effort diplomatique frénétique de la part des États-Unis, la crise de l'Enosis semble s'être apaisée. La Grèce et la Turquie ont accepté le statu quo actuel, les deux États partageant l'île. Les rapports indiquent un apaisement des tensions entre les forces turques et grecques à Chypre. Les capitales de l'OTAN et du monde entier félicitent les États-Unis d'avoir facilité cette avancée. Malgré la prévention des conflits armés, de nombreux Grecs et Turcs ont le sentiment que leurs dirigeants ont cédé à la pression américaine."
 THIRD_BALKAN_WAR.13.d:0 "Le gouvernement d'Athènes fait face à des critiques cinglantes de la part de différentes couches de la société concernant son accord sur la partition de Chypre. Le gouvernement insiste sur le fait qu'il s'agit d'un compromis temporaire et que la situation sera résolue à l'avenir. Les partisans de la ligne dure estiment qu'en n'exploitant pas cet avantage, la Turquie transformera sa région de Chypre en une tête de pont dangereuse. Ils affirment également que l'Enosis n'a pas été complètement réalisée. Les gauchistes accusent le gouvernement de céder face à la pression impérialiste américaine. Malgré ce revers, de nombreux Grecs ont hâte d'intégrer Chypre dans leur pays."
 THIRD_BALKAN_WAR.14.d:0 "Le gouvernement turc fait face à des critiques publiques concernant sa gestion de la crise de l'Enosis. Les critiques estiment que le gouvernement aurait dû faire pression sur les États-Unis pour qu'ils insistent sur un retour aux accords chypriotes d'avant Enosis. Ils estiment que le gouvernement a trahi les intérêts des Turcs chypriotes. Les partisans du gouvernement estiment que la résolution préserve les intérêts turcs à Chypre et permet la protection directe des Turcs chypriotes. Une chose sur laquelle toutes les parties s'accordent est que la Grèce ne se contentera pas de cette partition et que la Turquie doit rester vigilante."
 THIRD_BALKAN_WAR.15.d:0 "Le gouvernement turc a annoncé son propre ultimatum de deux semaines à la Grèce. Le gouvernement turc insiste sur le fait qu'Enosis doit être renversé et que la constitution de Chypre doit être rétablie. La décision est largement saluée dans tout le pays, avec des rassemblements pro-gouvernementaux organisés dans les grandes villes. L'armée turque a publié sa propre déclaration appelant à l'unité de la nation. Le gouvernement grec n'a pas répondu, mais des rassemblements anti-turcs sont organisés à Athènes. De nombreux analystes estiment que le soutien passionné du public grec à Enosis signifie que le gouvernement ne peut pas accepter la demande turque. Les deux camps seraient en train de mobiliser des moyens militaires."
 THIRD_BALKAN_WAR.16.d:0 "Suite à l'ultimatum turc adressé à la Grèce, les États-Unis ont annoncé qu'ils imposeraient des sanctions économiques et militaires à la Turquie. Le gouvernement américain a déclaré que la Turquie refusait toute tentative de désamorcer la crise actuelle. Les analystes estiment que les sanctions américaines visent à limiter la capacité de la Turquie à mener une guerre. Le gouvernement turc a répondu avec défi, affirmant qu'il ne se laisserait pas décourager dans ses efforts pour mettre fin à l'expansionnisme grec agressif. Les États-Unis ont également appelé à une réunion d'urgence de l'OTAN pour discuter d'une réponse à l'escalade de la crise."
 THIRD_BALKAN_WAR.17.d:0 "Une réunion d'urgence de l'OTAN a permis de prendre plusieurs décisions majeures concernant l'escalade de la crise entre la Grèce et la Turquie. L'alliance a convenu que si les hostilités commençaient, les deux nations seraient suspendues de l'organisation jusqu'à la fin des hostilités. Tous les États membres sont invités à rester neutres. L'alliance a également convenu que malgré la suspension, toute puissance extérieure cherchant à tirer profit d'un conflit armé risquerait de déclencher une réponse écrasante de l'OTAN. La Turquie et la Grèce n'ont pas été autorisées à assister à la réunion, mais aucun des deux gouvernements n'a indiqué qu'il se retirerait de l'alliance."
 THIRD_BALKAN_WAR.18.d:0 "Alors que la Grèce maintient son ultimatum contre la Turquie, les États-Unis ont annoncé qu'ils imposeraient des sanctions économiques et militaires à la Grèce. Le gouvernement américain a déclaré que la Grèce refusait toute tentative de désamorcer la crise actuelle. Les analystes estiment que les sanctions américaines visent à limiter la capacité de la Grèce à mener une guerre. La Grèce a répondu avec défi, affirmant qu'elle ne ferait aucun compromis sur sa mission sacrée d'achever l'Enosis. L'armée grecque a publié un communiqué affirmant que les sanctions n'auraient pas d'impact sur sa capacité à mener à bien sa mission. Les États-Unis ont appelé à une réunion d'urgence de l'OTAN pour discuter d'une réponse à l'escalade de la crise."
 THIRD_BALKAN_WAR.19.d:0 "L'ultimatum grec est sur le point d'expirer dans quelques heures. Au cours des derniers jours, tout intérêt à accepter ces revendications s'est dissipé. Le peuple et l'armée turcs sont parfaitement préparés au conflit. Un retrait turc à ce stade serait considéré comme abandonnant les Turcs chypriotes à leur destruction. Le gouvernement publiera bientôt une déclaration rejetant les demandes injustes de la Grèce. Les commandants militaires turcs envoient des ordres pour que leurs forces se préparent à une action hostile."
 THIRD_BALKAN_WAR.20.d:0 "Des rapports en provenance de Chypre indiquent que les forces turques et grecques sont engagées dans des escarmouches initiales. Le conflit Enosis est entré dans une nouvelle phase de guerre ouverte. Des rapports font également état d'engagements le long de la frontière turco-grecque. De nombreux analystes estiment que les combats ne se limiteront pas à Chypre et que les deux camps chercheront probablement à réaliser des gains majeurs l'un contre l'autre. Il s'agit du premier conflit entre la Grèce et la Turquie depuis la guerre gréco-turque de 1919. Les États-Unis ont appelé les deux parties à mettre un terme aux hostilités."
 THIRD_BALKAN_WAR.21.d:0 "La Grèce et la Turquie ne cédant pas, les États-Unis ont annoncé qu'ils imposeraient des sanctions économiques et militaires à la Grèce. Le gouvernement américain a déclaré que les deux États refusaient toute tentative de désamorcer la crise actuelle. Les analystes estiment que les sanctions américaines visent à limiter la capacité des deux pays à mener une guerre. La Grèce a répondu avec défi, affirmant qu'elle ne ferait aucun compromis sur sa mission sacrée d'achever l'Enosis. Le gouvernement turc a également publié une déclaration affirmant qu'il n'abandonnerait pas la population turque à Chypre. Les États-Unis ont appelé à une réunion d'urgence de l'OTAN pour discuter d'une réponse à l'escalade de la crise."
 THIRD_BALKAN_WAR.22.d:0 "À la suite de la déclaration d'Enosis, la Turquie s'est emparée de certaines parties du nord de Chypre, invoquant des inquiétudes quant à la sécurité des Turcs chypriotes. Le gouvernement grec a répondu en lançant un ultimatum exigeant que la Turquie se retire. La Turquie étant un allié de l'OTAN, nous devons décider d'une réponse. L'ambassadeur turc souhaite notre plein soutien, et de nombreux alliés de l'OTAN surveilleront attentivement la façon dont nous répondrons à la crise. Un manque de soutien pourrait conduire certains États membres de l'OTAN à estimer que l'alliance manque de protection. Cependant, il existe une importante population grecque aux États-Unis qui ne sera pas contente si nous nous impliquons. Nous pouvons publier une déclaration publique garantissant notre soutien à la Turquie, même si nous devons faire attention à ne pas dire quel serait ce soutien. Espérons que cela inciterait la Grèce à faire marche arrière. L'autre option serait de déclarer la question comme une question bilatérale, la Turquie intervenant de sa propre initiative."
 THIRD_BALKAN_WAR.23.d:0 "Les États-Unis ont mis en garde la Grèce contre leur récent ultimatum envers la Turquie. Le gouvernement américain a déclaré que la Turquie est membre de l'OTAN et qu'un acte d'agression pure et simple pourrait déclencher une action de l'alliance. Cette annonce fera certainement réfléchir le gouvernement grec. Le gouvernement turc a salué la déclaration, exprimant sa gratitude pour le soutien. Les analystes notent que les États-Unis n'ont pas promis une intervention de l'OTAN, mais les implications sont certainement là. Selon certaines informations, le cabinet grec tiendrait probablement une réunion d'urgence dans les prochaines heures."
 THIRD_BALKAN_WAR.24.d:0 "Les États-Unis ont laissé entendre que si nous utilisions la force pour éliminer à juste titre les occupants turcs à Chypre, nous risquions d'impliquer l'OTAN. Nous tenons des réunions d'urgence du cabinet et de la défense pour formuler une réponse. Certains responsables pensent que les États-Unis bluffent probablement, car de nombreux pays de l'OTAN considéreront probablement la prise du nord de Chypre par la Turquie comme une provocation et non comme une justification pour déclencher une réponse complète. D'autres vont plus loin et affirment que les Américains eux-mêmes ne seraient pas en mesure de rallier le soutien du public à l'action, compte tenu de l'importante communauté grecque qui s'y trouve. Cependant, nombreux sont ceux qui estiment que la situation est telle que nous ne pouvons pas prendre le risque de parier sur une non-intervention. Cela pourrait coûter cher à la Grèce. Ils préconisent que le gouvernement annule l'ultimatum et cherche à sortir de l'impasse à un moment plus favorable."
 THIRD_BALKAN_WAR.25.d:0 "Le gouvernement grec a annoncé qu'il annulerait son ultimatum adressé à la Turquie. C'est une bonne nouvelle et une promesse que nous pourrons continuer à défendre les Turcs chypriotes contre toute agression. Les États-Unis ont ouvertement soutenu notre position, qui a joué un rôle majeur pour mettre un terme à une éventuelle agression grecque. Nous pouvons accepter le statu quo actuel, mais rien ne garantit que la Grèce ne tentera pas une quelconque agression à l'avenir. Les partisans de la ligne dure au sein du gouvernement nous demandent de lancer notre propre ultimatum à la Grèce. Nous devrions exiger qu'ils mettent fin à leur occupation illégale de Chypre et qu'ils rétablissent la constitution convenue au niveau international. Une telle action pourrait nous coûter le soutien américain, mais les Grecs ne seraient peut-être pas disposés à prendre ce risque."
 THIRD_BALKAN_WAR.26.d:0 "Le gouvernement turc a révélé son désir complice et évident de violence en lançant son propre ultimatum après que nous ayons offert des ouvertures de paix. La Turquie exige que nous abandonnions Enosis pour restaurer l'ancienne constitution. Pour le peuple grec, cela constituerait une trahison majeure. Cela ramènerait également Chypre à son précédent régime d'incompétence et de mauvaise gouvernance. Compte tenu de l'état d'esprit du public, nous ignorerons totalement ces demandes. En privé, le gouvernement a appris de sources que même s'il envisageait de se conformer aux exigences turques, il pourrait se heurter à une réaction négative de la part de l'armée. Nous devons préparer nos forces à la menace à venir."
 THIRD_BALKAN_WAR.27.d:0 "Dans un geste étonnant, le gouvernement turc a lancé son propre ultimatum à la Grèce. Ils veulent le retour à Chypre de la constitution internationalement reconnue. Cette action change la dynamique du conflit puisque c'est désormais la Turquie qui aggrave la situation. Nous n'avons jamais promis à la Turquie le soutien de l'OTAN pour une telle action. Il est probable que même si nous le voulions, nous ne pourrions pas convaincre le public américain de nous soutenir car le conflit semble trop localisé. Nous pouvons indiquer notre position. La Turquie est un partenaire géopolitique vital, nous pouvons rester déterminés à lui fournir un soutien diplomatique et matériel, mais pas la force militaire. Cependant, de nombreux hauts responsables diplomatiques et militaires estiment que la Turquie a cherché à manipuler notre soutien pour servir ses intérêts nationaux. D'autres États pourraient tenter quelque chose de similaire, ils suggèrent que nous prenions la position de critiquer cette escalade turque, cela pourrait même inciter la Turquie à réfléchir avant de lancer une quelconque action."
 THIRD_BALKAN_WAR.28.d:0 "Les États-Unis ont exprimé leur consternation face à la récente déclaration de la Turquie exigeant que la Grèce rétablisse Chypre dans son ancienne constitution. De hauts responsables américains n'ont pas tardé à qualifier cette action de peu judicieuse. Malgré ces critiques publiques, la Turquie reste catégorique sur le fait que la seule façon de résoudre la crise à Chypre est de rétablir la constitution de partage du pouvoir. Le gouvernement grec n'a pas réagi, même si de nombreux analystes estiment que si le gouvernement envisageait même de se retirer, il risquerait une réaction violente de la part d'une population prise dans une ferveur patriotique suite à la proclamation de l'Enosis."
 THIRD_BALKAN_WAR.29.d:0 "La récente crise à Chypre semble s'être terminée dans un gémissement. La Turquie et la Grèce ont convenu de maintenir la division actuelle de l'île suite à la proclamation grecque d'Enosis et la Turquie occupant la partie nord de l'île. Les nationalistes grecs chypriotes ont récemment renversé ce qui était considéré comme une constitution inefficace et ont proclamé l'unité avec la Grèce. Cette action a conduit la Turquie à déployer ses propres forces pour, selon ses propres termes, protéger les Turcs chypriotes. La Turquie insiste sur le fait que l'île devrait revenir à la constitution internationalement convenue. La Grèce avait menacé d'une action militaire pour expulser la Turquie à moins qu'elle ne se retire de l'île, mais les esprits plus calmes semblent avoir changé de position. Le gouvernement turc a également renoncé à sa position appelant au retrait complet de la Grèce. Les rapports indiquent que les deux camps retirent leurs forces militaires."
 THIRD_BALKAN_WAR.30.d:0 "Une réunion d'urgence des membres de l'OTAN a déclaré qu'elle considérait le différend chypriote actuel comme une question bilatérale entre la Turquie et la Grèce. L'organisation a également noté que la Turquie restait membre de l'OTAN et qu'elle serait défendue si elle était confrontée à une agression de la part d'une puissance extérieure. Bien que le gouvernement turc ait tenté de persuader l'OTAN de soutenir sa position visant à forcer la Grèce à restaurer l'ordre politique d'avant l'Enosis à Chypre, il n'a pas réussi à convaincre l'organisation. De nombreux membres ont estimé que la Turquie avait récemment aggravé la crise en exigeant le retrait de la Grèce. Malgré ce revers, la Turquie sera convaincue que l'organisation tiendra ses promesses."
 THIRD_BALKAN_WAR.31.d:0 "La Grèce a rejeté notre avertissement de retirer son ultimatum contre la Turquie. Le gouvernement grec insiste sur le fait qu'il respecte les souhaits du peuple chypriote. Il insiste sur le fait que la Turquie est à l'origine des tensions actuelles et détient illégalement certaines parties de l'île. La prochaine étape consiste à convoquer une réunion d'urgence de l'OTAN sur la crise chypriote. Nous devons déterminer une réponse organisationnelle. Cependant, nos premières enquêtes indiquent que de nombreux membres de l'OTAN ne sont peut-être pas désireux de faire pression en faveur d'une intervention armée. La Grèce occupe une place culturelle particulière pour de nombreux Européens et de nombreuses personnes sympathisent avec leurs actions."
 THIRD_BALKAN_WAR.32.d:0 "L'OTAN a conclu une session d'urgence sur la crise chypriote. La réunion a été quelque peu source de discorde, les membres arguant que le conflit était bilatéral tandis que d'autres estimaient qu'un conflit armé devrait déclencher une réponse collective. La Turquie a plaidé avec passion pour obtenir le soutien de ses alliés. Finalement, un accord a été trouvé. L'OTAN a publié une déclaration ferme affirmant que ses membres offriraient un soutien diplomatique et matériel total à son allié, sans toutefois promettre de réponse militaire. Le gouvernement turc sera soutenu par le fort soutien international mais déçu par l'absence de réponse militaire complète. Le communiqué avertit également que toute puissance extérieure cherchant à affaiblir la Turquie risquera d'invoquer une réponse complète."
 THIRD_BALKAN_WAR.33.d:0 "Avec l'éclatement des combats avec la Turquie, nous sommes confrontés à un combat difficile. L'Albanie est un partenaire idéologique et un voisin. Historiquement, nous avons coopéré dans le passé pour éliminer les chaînes de l'occupation turque, il est peut-être temps de renouveler ces liens. De nombreux membres du parti exhortent le gouvernement à appeler l'Albanie à se joindre à nous dans notre juste lutte. Cependant, certains craignent que l'implication de l'Albanie puisse provoquer l'OTAN. Une décision doit être prise."
 THIRD_BALKAN_WAR.34.d:0 "Le gouvernement grec nous a appelé à nous joindre à lui dans sa lutte contre la Turquie. La Grèce cherche à achever son unification avec Chypre et à punir la Turquie pour son ingérence dans ses affaires. Nous entretenons un lien idéologique avec la Grèce et nombreux sont ceux qui, dans le parti, souhaitent que nous nous joignions à eux. Nous pouvons certainement nous joindre au conflit, même si la guerre a toujours des conséquences imprévues. Alternativement, nous pourrions proposer des moyens diplomatiques et matériels pour respecter nos engagements idéologiques sans avoir à nous battre. Ceux qui s'opposent à un conflit remettent en question les mérites de notre implication et estiment que nous devrions poliment refuser l'appel aux armes."
 THIRD_BALKAN_WAR.35.d:0 "La plupart des États de l'OTAN se tournent vers les États-Unis pour savoir quelle position adopter en ce qui concerne le soutien à la Turquie dans son conflit avec la Grèce. Certains des responsables gouvernementaux les plus pro-OTAN souhaitent que nous aidions ouvertement la Turquie, ce qui nous offrirait la possibilité de fournir de grandes quantités d'aide. Les autres États de l'OTAN pourraient alors emboîter le pas s'ils le souhaitent. Cependant, certains pensent que la Turquie a recherché ce conflit et cherche à en tirer profit. Lui accorder une aide ouverte pourrait créer un précédent négatif pour nos autres alliés. Ils estiment que toute aide doit être fournie en secret. Cela limite le montant de l'aide mais nous permet de jouer le rôle d'artisan de la paix à l'avenir."
 THIRD_BALKAN_WAR.36.d:0 "Avant que les combats n'éclatent entre la Grèce et la Turquie, les États-Unis avaient critiqué le gouvernement turc pour son rôle majeur dans l'escalade des tensions. Eux et le gouvernement grec semblent également responsables de ce conflit militaire. Cependant, la Turquie est un allié de l'OTAN et occupe un espace géopolitique vital. Plusieurs États de l'OTAN nous ont également contactés pour nous faire part de leur intérêt à organiser une assistance militaire secrète à la Turquie. Nos responsables militaires et du renseignement estiment que de telles opérations fourniraient une assurance au gouvernement turc. Certains conseillers diplomatiques de haut rang mettent en garde contre toute aide, soulignant que cela cautionnerait le mauvais comportement d'un allié."
 THIRD_BALKAN_WAR.37.d:0 "Nous sommes confrontés à une lutte monumentale contre la Turquie. Ses forces se préparent à la conquête de nos terres et au rétablissement de la présence turque dans les Balkans. En tant qu'État non aligné, la Yougoslavie devrait avoir intérêt à tenir tête à un client agressif des États-Unis. Historiquement, notre peuple a coopéré contre l'agression turque et il serait naturel de faire appel à son soutien. Nombreux sont ceux qui exhortent le gouvernement à faire appel à la Yougoslavie. Certains s'opposent à l'idée de demander le soutien de la Yougoslavie, estimant que cela pourrait compliquer un futur règlement de paix."
 THIRD_BALKAN_WAR.38.d:0 "La Grèce a demandé notre soutien dans son conflit militaire avec la Turquie. Les Grecs affirment que la Turquie est enhardie par son alliance avec les États-Unis et qu'elle cherche à imposer des exigences injustes à tous les Grecs. En tant qu'État non aligné, de nombreux membres du gouvernement estiment que nous devrions leur offrir notre soutien. Une faction souhaite que nous rejoignions la guerre pour démontrer que les États non alignés ne seront pas intimidés. Un autre groupe de responsables souhaite apporter un soutien matériel important aux côtés de bénévoles. Cependant, certains esprits plus calmes estiment qu'une intervention armée est trop risquée et suggèrent que nous leur apportions un soutien diplomatique."
 THIRD_BALKAN_WAR.39.d:0 "La Yougoslavie a condamné la Turquie pour avoir lancé une guerre d'agression contre la Grèce. Il accuse également les États-Unis de fournir des armes excessives à la Turquie, alimentant ainsi sa politique étrangère agressive. Pour soutenir la Grèce, la Yougoslavie a promis un soutien matériel et diplomatique. Il y a aussi des rumeurs selon lesquelles la Yougoslavie autoriserait les volontaires à partir et à se battre pour la Grèce. Le gouvernement turc a condamné la Yougoslavie mais a affirmé que rien ne pourrait dissuader sa volonté. Lorsqu'ils ont été pressés de commenter, les États-Unis ont déclaré qu'ils surveillaient la situation et appelaient tous les États à éviter d'envenimer la situation."
 THIRD_BALKAN_WAR.40.d:0 "Dans un développement étonnant, la Yougoslavie a annoncé que ses forces rejoindraient la Grèce contre la Turquie. Le gouvernement yougoslave prétend que la Turquie mène une guerre d'agression provoquée par les expéditions excessives d'armes américaines vers la Grèce. Il a ajouté que les puissances non alignées ne peuvent laisser aucune superpuissance ou ses clients les intimider. Le gouvernement turc a condamné cette action, soulignant qu'il luttait désormais pour empêcher l'occupation et l'expulsion des Turcs dans la région. De nombreux États régionaux et grandes puissances observent attentivement une escalade rapide du conflit."
 THIRD_BALKAN_WAR.41.d:0 "Le gouvernement yougoslave a émis une critique virulente à l'égard de la Turquie. Ils affirment que la Turquie s'est lancée dans une campagne d'agression brutale contre la Grèce. Il accuse également les États-Unis de militariser la région. La Grèce a salué cette annonce et a appelé tous les États non alignés à la soutenir face à la Turquie. Le gouvernement turc a condamné cette déclaration, la qualifiant de déformation de la réalité. Malgré cette déclaration ferme, la plupart des observateurs notent que la Yougoslavie ne semble pas disposée à s'impliquer au-delà du soutien diplomatique à la Grèce."
 THIRD_BALKAN_WAR.42.d:0 "La Turquie et la Grèce sont actuellement en guerre. La Grèce est une amie de la République arabe unie et un autre membre non aligné. De nombreuses personnes dans le pays sympathisent avec sa lutte pour libérer les Grecs de Chypre. Certains hauts responsables militaires voient dans cette évolution une opportunité potentielle. Nous pouvons aider la Grèce et envoyer nos troupes libérer les Arabes occupés de Hatay. Pendant que la Grèce libère son peuple, nous pouvons libérer le nôtre. D'autres estiment qu'une telle action risque de susciter la colère des États-Unis, qui contrôlent la Turquie comme une marionnette. Au lieu de cela, ils préconisent que nous limitions notre soutien à l'aide militaire. Si la Turquie est vaincue, nous pourrons nous en occuper plus tard. Cependant, certains estiment que ces actions ne sont pas dans notre intérêt et que nous devrions plutôt nous concentrer sur l'apport d'un soutien moral et diplomatique à la Grèce."
 THIRD_BALKAN_WAR.43.d:0 "La République Arabe Unie a vivement critiqué la Turquie pour avoir lancé une guerre d'agression contre la Grèce. Il accusait la Turquie de ressusciter son passé impérialiste, au service des États-Unis. Les émissions de radio du Caire destinées aux Arabes du Moyen-Orient diffusent ce message. Le gouvernement grec a salué cette annonce, affirmant que le monde arabe comprend mieux que quiconque ce que signifie l'occupation turque. En réponse, le gouvernement turc a rejeté la déclaration, la qualifiant de non pertinente et basée sur un récit mensonger. Les analystes notent que malgré cette déclaration belliqueuse, il ne semble pas que la RAU intervienne directement dans le conflit."
 THIRD_BALKAN_WAR.44.d:0 "La République arabe unie a vivement critiqué la Turquie pour ses actes d'agression contre la Grèce. En plus de sa condamnation, l'armée de la RAU a annoncé qu'elle enverrait du matériel militaire pour soutenir la Grèce dans sa lutte pour la libération de son propre peuple. Les émissions de radio du Caire soulignent les parallèles entre la libération des Grecs par la Grèce et la lutte de libération arabe. Des rapports en provenance d'Athènes indiquent que des manifestations pro-UAR ont lieu. Le gouvernement turc a averti la RAU qu'elle subirait les conséquences de ses actes au moment et au lieu choisis par la Turquie."
 THIRD_BALKAN_WAR.45.d:0 "De hauts responsables de la défense et du renseignement font état d'un rassemblement massif de troupes le long de la frontière entre la République arabe unie et la Turquie. Il semble que la RAU envisage une intervention militaire pour soutenir la Grèce et reprendre Hatay à la Turquie. Ce serait une évolution inquiétante et pourrait provoquer un effondrement de la Turquie en cas de succès. Nous devons apporter une réponse à cette menace. Nous pouvons émettre un avertissement indiquant que toute action militaire de la RAU entraînera notre intervention rapide dans le conflit. Toutefois, si nous ne sommes pas disposés à nous engager dans une intervention, nous pouvons plutôt émettre un avertissement. Beaucoup pensent que cela suffirait à amener la RAU à abandonner ses projets."
 THIRD_BALKAN_WAR.46.d:0 "Les États-Unis ont révélé que la République arabe unie déployait rapidement des forces militaires à sa frontière avec la Turquie. Les responsables américains affirment qu'il est clair que la RAU envisage une intervention dans le conflit turco-grec actuel. Le gouvernement américain a affirmé avec insistance qu'un tel scénario entraînerait une intervention militaire directe. La RAU est invitée à interrompre ses préparatifs militaires. Le Caire est jusqu'à présent resté silencieux face aux accusations américaines. Le monde attend avec impatience ce qui va se passer ensuite."
 THIRD_BALKAN_WAR.47.d:0 "Les États-Unis ont révélé que la République arabe unie déployait rapidement des forces militaires à sa frontière avec la Turquie. Les responsables américains affirment qu'il est clair que la RAU envisage une intervention dans le conflit turco-grec actuel. Le gouvernement américain a mis en garde contre les graves conséquences si la RAU ne mettait pas fin à son renforcement militaire menaçant. Le Caire est jusqu'à présent resté silencieux face aux accusations américaines. Les observateurs notent que l'avertissement ne garantit pas une intervention militaire, même s'il ne l'exclut pas non plus."
 THIRD_BALKAN_WAR.48.d:0 "En réponse aux accusations des États-Unis selon lesquelles ils envisageaient d'envahir la Turquie, la République arabe unie a publié une réponse. Elle a nié avec véhémence ces accusations, affirmant que les Américains cherchaient n'importe quel prétexte pour soutenir son client turc. Malgré ses démentis, les observateurs notent qu'il y a eu d'importants mouvements militaires dans la RAU, mais il semble maintenant que cela ait cessé. Le gouvernement américain a rejeté la réponse de la RAU, mais a noté que le renforcement militaire actuel avait cessé. Le gouvernement grec a condamné les États-Unis pour avoir cherché un prétexte pour intervenir en faveur de la Turquie."
 THIRD_BALKAN_WAR.49.d:0 "Malgré nos avertissements adressés à la République Arabe Unie, celle-ci a lancé une invasion de la Turquie. Nous pensons que la RAU cherche à s'emparer de Hatay et à ouvrir un deuxième front pour aider la Grèce dans son conflit actuel avec la Turquie. Nous devons choisir une réponse, faute de quoi nous risquerions de mettre à mal tous nos partenariats mondiaux. Notre avertissement ne précisait pas quelle réponse serait donnée, ce qui nous donne de la flexibilité. Une option consiste à fournir un afflux massif d'armes à la Turquie, ce qui renforcerait considérablement sa capacité à se défendre contre la RAU. Nous pouvons également choisir d'intervenir et de lancer des opérations militaires contre la RAU."
 THIRD_BALKAN_WAR.51.d:0 "Les États-Unis ont confirmé qu'ils se joindraient à la Turquie pour repousser la République arabe unie après son invasion du pays. Les Américains avaient lancé un avertissement à la RAU, menaçant de réagir si elle rejoignait le conflit gréco-turc actuel. Le gouvernement turc a salué cette nouvelle, affirmant que son peuple était réconforté par le soutien de son principal allié. La RAU reste publiquement indifférente, affirmant que ses forces et son peuple sont plus que capables de faire face à n'importe quelle menace. En privé, de nombreux analystes de la RAU seront très perturbés par cette évolution, ses dirigeants politiques ayant parié que les Américains ne s'impliqueraient pas."
 THIRD_BALKAN_WAR.52.d:0 "Les troupes terrestres de la République arabe unie ont franchi la frontière turque. Le gouvernement a confirmé plus tard que ses forces étaient déployées pour libérer les Arabes de Hatay et soutenir la Grèce. Il s'agit d'une escalade majeure dans le conflit gréco-turc. On craint en Turquie qu'un nouveau front n'épuise ses forces qui luttent actuellement contre la Grèce. Le gouvernement grec a accueilli favorablement cette nouvelle, affirmant que le monde non aligné n'accepterait pas les brimades de la part des États qui se sentent enhardis par leur superpuissance protectrice. Le monde observera de près comment les États-Unis réagiront à cette nouvelle menace qui pèse sur leur allié."
 THIRD_BALKAN_WAR.53.d:0 "La Grèce et la Turquie sont engagées dans un conflit armé à propos de Chypre. Au milieu de ces combats, la République Arabe Unie a lancé sa propre invasion de la Turquie, cherchant à garantir ses revendications territoriales de longue date. Depuis l'ouverture des relations diplomatiques, nos services de renseignement et de défense coopèrent étroitement avec la Turquie. L'invasion de la RAU menace de modifier l'équilibre militaire dans la région. En raison du risque de réaction négative de l'opinion publique, le gouvernement turc préfère que nous gardions tous deux le silence sur l'étendue de nos relations. Nous disposons donc de trois options pour aider la Turquie : la première consiste à mobiliser nos forces à la frontière de la RAU. Cela pourrait les amener à détourner les forces du front. Nous pouvons également, à titre privé, transférer du matériel militaire et des conseillers vers la Turquie. Cependant, certains estiment qu'il n'est pas dans notre intérêt de mettre Israël en danger pour un autre État ; ils souhaitent plutôt que nous condamnions diplomatiquement l'agression de la RAU."
 THIRD_BALKAN_WAR.54.d:0 "Les rapports des services de renseignement et les commandants militaires à la frontière font état d'une mobilisation massive des forces israéliennes. Nous avons également intercepté des émissions appelant à des réservistes pour se préparer à un appel à travers Israël. Il s'agit d'une accumulation inhabituellement étendue et clairement liée à notre conflit en cours avec la Turquie. Les Israéliens cherchent peut-être à nous frapper alors que nous nous concentrons sur la libération de nos frères et soeurs à Hatay. Les commandants locaux nous recommandent fortement de veiller à ce que nos positions frontalières soient renforcées et capables de faire face à tout complot lancé par les sionistes."
 THIRD_BALKAN_WAR.55.d:0 "Le gouvernement israélien nous a informé en privé qu'il transférerait une grande quantité d'armes et de conseillers pour nos forces. Les Israéliens se disent compréhensifs face à notre sort d'être attaqués par la République Arabe Unie et souhaitent aider notre défense. C'est une bonne nouvelle alors que notre nation continue de faire face à des agressions sur la plupart de nos frontières. Pour ceux qui ont longtemps soutenu des liens étroits avec Israël malgré l'opposition des partisans de la religion, cette nouvelle confirme que notre décision d'engager Israël était la bonne. Nous travaillerons en étroite collaboration avec les Israéliens pour garantir que tout transfert d'armes et de conseillers reste hors de la vue du public, afin de ne pas enflammer ceux de notre population opposés à nos relations."
 THIRD_BALKAN_WAR.56.d:0 "Le gouvernement israélien a condamné la République arabe unie (RAU) pour son invasion de la Turquie. Il a noté que cette action mettait en évidence la menace à laquelle sont confrontés Israël et tous ceux qui sont menacés par la RAU. Israël a également appelé la communauté internationale à tenir la RAU pour responsable de ses actes d'agression flagrants. La République arabe unie a condamné la déclaration israélienne, la qualifiant de stratagème sioniste destiné à détourner le monde de son occupation des terres arabes. L'échange de propos durs a fait craindre dans la région qu'Israël ne s'implique bientôt dans le conflit qui s'intensifie rapidement et qui a commencé avec l'entrée en guerre de la Grèce et de la Turquie pour Chypre. Israël aurait accru la vigilance militaire de ses forces à la frontière."
 THIRD_BALKAN_WAR.57.d:0 "Le gouvernement turc a agi avec lâcheté en gelant les relations avec notre nation. Au lieu de cela, il s'est rapproché des Arabes et a cherché à nous condamner au niveau international. Actuellement, la Turquie se bat avec la Grèce à propos de Chypre. Les combats seraient intenses. Nos responsables du renseignement pensent que nous pouvons profiter du conflit et affaiblir les capacités militaires de la Turquie. Ils nous demandent d'envoyer immédiatement des armes et des conseillers en Grèce. Avec ces armes et notre soutien, les Grecs pourront, espérons-le, vaincre les Turcs ou, à tout le moins, leur infliger de lourdes pertes pour épuiser leur capacité de combat. Cette action bénéficie d'un large soutien, mais certains responsables militaires et économiques s'y opposent, affirmant qu'Israël a besoin de toutes les armes dont il dispose pour faire face aux Arabes qui entourent nos frontières."
 THIRD_BALKAN_WAR.58.d:0 "En privé, une délégation de responsables des services de renseignement et militaires israéliens est arrivée pour rendre visite à nos dirigeants. Ils se sont engagés à nous fournir des armes et des conseillers. Les Israéliens sympathisent profondément avec nous, soulignant que nous agissons uniquement pour libérer les terres grecques pour leur peuple grec. Nos propres dirigeants ont chaleureusement remercié les Israéliens, affirmant que cela marque une transformation dans les relations gréco-israéliennes. Le soutien israélien est un grand encouragement et une confirmation de la justesse de notre cause. Pour éviter d'enflammer la colère religieuse musulmane ou de donner à la Turquie un discours prétendant qu'elle mène une guerre de religion juste, nous garderons secrets ces transferts d'armes pour l'instant."
 THIRD_BALKAN_WAR.59.d:0 "Les médias du monde entier à Athènes se sont tous précipités pour prendre des photos alors que l'armée turque hissait un immense drapeau sur l'Acropole d'Athènes. Soulignant l'occupation turque de la capitale grecque. Les troupes turques patrouilleraient en force dans les rues de la ville tout en brandissant des drapeaux sur chaque bâtiment ou monument du gouvernement grec. Les troupes turques sont d'humeur joyeuse et beaucoup considèrent la chute d'Athènes comme la plus grande réussite de leur campagne. Les Grecs locaux restent pour la plupart chez eux, par peur et humiliation face à l'échec de leurs militaires à tenir la capitale. Dans les prochains jours, de hauts généraux et dirigeants civils turcs devraient arriver et inspecter eux-mêmes la ville. Un officier supérieur turc a été entendu dire que cette victoire devrait humilier les Grecs."
 THIRD_BALKAN_WAR.60.d:0 "Après une campagne intense, les forces grecques contrôlent fermement Istanbul. Les soldats et officiers grecs arrivant dans la ville défilent les larmes aux yeux, submergés par l'émotion de reconquérir une ville perdue il y a plus de cinq siècles. Depuis le début de l'occupation grecque, Sainte-Sophie, ainsi que d'autres sites historiques byzantins, accueillent quotidiennement des cérémonies orthodoxes grecques, en présence de militaires grecs et de dignitaires en visite. Lors d'une conférence de presse, le commandant grec local a souligné que la prise de Constantinople reflétait la discipline, l'efficacité et le désir des soldats grecs de libérer leur peuple et leurs terres. Des plans sont en cours pour organiser un défilé massif sur la place Taksim afin de démontrer la puissance militaire grecque."
 THIRD_BALKAN_WAR.61.d:0 "Après d'intenses combats, la dernière position militaire grecque à Chypre tomba aux mains de l'armée turque. Les journalistes sur l'île rapportent que la situation est tendue, les Chypriotes grecs regardant souvent avec défi les soldats turcs lourdement armés. Dans les environs grecs, les Turcs seraient en pleine préparation au combat, prêts à affronter toute résistance. Des tracts militaires turcs assurent à la population locale que leur présence a pour seul but de restaurer la constitution chypriote sur l'île. En revanche, les quartiers turcs seraient dans une ambiance de fête, où militaires et civils turcs se mélangent librement. Les Turcs chypriotes n'hésitent pas à dire aux médias que c'est l'armée turque qui les a sauvés des massacres et des expulsions forcées. Le gouvernement turc note que malgré sa victoire à Chypre, la guerre continue ailleurs et que l'île ne sera pas en sécurité tant que les combats ne prendront pas fin."
 THIRD_BALKAN_WAR.62.d:0 "La poche turque est tombée aux mains des forces grecques après d'intenses combats. Les soldats grecs patrouillent massivement dans les quartiers turcs chypriotes, prétendant assurer la sécurité des habitants. De nombreux Turcs chypriotes ont déclaré en privé aux journalistes que les patrouilles ressemblaient davantage à une démonstration de force. Dans les principaux quartiers grecs, de grandes célébrations ont lieu, avec des Grecs chypriotes et des soldats grecs célébrant tous deux ce qu'ils considèrent comme l'achèvement d'Enosis. Malgré l'atmosphère joyeuse, les officiers militaires grecs s'empressent de souligner que les combats ne sont pas terminés et que l'armée restera vigilante pour garantir que l'île reste fermement sous pavillon grec. Un Grec local a déclaré à un journaliste que le peuple chypriote revenait enfin à la nation grecque après des siècles de séparation."
 THIRD_BALKAN_WAR.63.d:0 "La République arabe unie a annoncé que ses forces avaient libéré Hatay. Il a ajouté que la victoire était due au fait que la RAU avait réussi à vaincre la forte résistance turque. Le président de la RAU a salué le dévouement, l'esprit et le leadership de ses forces. La presse étrangère a publié des photos de soldats de la RAU marchant dans les rues, tandis que les habitants leur offraient des fleurs et des bonbons. Des manifestations pro-RAU ont été signalées dans tout le monde arabe pour saluer la récente victoire. Le gouvernement turc n'a pas commenté l'évolution de la situation."
 THIRD_BALKAN_WAR.64.d:0 "Le drapeau turc flotte haut sur Alep. Nos forces ont récemment pris la ville après avoir combattu avec les forces de la République Arabe Unie. La RAU a déclenché la guerre en essayant de nous prendre Hatay. Nos forces ont non seulement vaincu l'invasion, mais ont désormais pris le contrôle de cette ville historique. Nous pouvons maintenant profiter de cette occasion pour proposer un cessez-le-feu à la RAU. Ils accepteront un retour aux frontières d'avant-guerre. Cela nous permettrait de concentrer nos efforts sur la Grèce. L'autre option serait de poursuivre les combats et d'exploiter notre avantage."
 THIRD_BALKAN_WAR.65.d:0 "Le gouvernement turc a annoncé un cessez-le-feu avec la République arabe unie. Les deux parties ont convenu de revenir aux frontières d'avant-guerre. La RAU sera humiliée par ce résultat. Il avait envahi la Turquie dans l'espoir de capturer Hatay et son importante population arabe. On dit que l'armée turque jubile, mais elle se concentre désormais sur les autres menaces auxquelles elle est confrontée. Un grand défilé de victoire a eu lieu à Hatay tandis que les médias étrangers étaient invités à voir les armes capturées et détruites."
 THIRD_BALKAN_WAR.66.d:0 "Notre récent conflit avec la Turquie s'est soldé par un désastre. Nous avons cherché à libérer les Arabes de Hatay, mais nous avons subi une défaite humiliante, notamment la perte d'Alep. Le gouvernement turc a déclaré un cessez-le-feu, permettant ainsi de rétablir la frontière d'avant-guerre. Des manifestations de colère ont été signalées dans nos villes. De nombreux citoyens sont furieux de la défaite, même les militaires seraient découragés. De nombreux soldats accusent en privé leurs commandants de ne pas avoir répondu à leurs attentes."
 THIRD_BALKAN_WAR.67.d:0 "L'armée grecque a confirmé que ses forces avaient capturé Edirne. Le général commandant a salué la détermination et le dévouement de ses hommes dans les combats. Beaucoup en Grèce accueillent joyeusement la nouvelle, beaucoup considérant la capture comme essentielle à la libération de Constantinople. Certains éditoriaux de journaux de la région cachent à peine leur joie face au retrait des forces turques de leurs positions en Europe. Le gouvernement turc reste silencieux mais affirme que ses forces ne faiblissent pas dans la défense de la nation."
 THIRD_BALKAN_WAR.68.d:0 "Les forces grecques contrôlent désormais Bursa. Les médias ont publié des photos d'officiers grecs visitant Ottoman sites historiques à travers la ville. Cette victoire est une victoire symbolique majeure pour la Grèce puisqu'elle occupe désormais la première capitale de l'ancien Ottoman Empire. Le gouvernement turc cherche à minimiser ce revers, mais il est clair que la guerre ne se déroulera peut-être pas comme il l'espérait. Forte de ce succès, la Grèce semble prête à réaliser de nouvelles percées. L'armée turque aura du mal à conserver le soutien de l'opinion publique si elle continue à perdre du terrain."
 THIRD_BALKAN_WAR.69.d:0 "Après une campagne audacieuse, la Grèce a confirmé que ses forces contrôlaient Izmir. Cette capture revêt une importance historique majeure pour l'armée grecque puisque le port était son point d'entrée au début de la guerre gréco-turque de 1919. La population turque locale serait furieuse après que l'armée grecque ait installé des pancartes appelant la ville de Smyrne. Malgré cela, les autorités militaires grecques ont cherché à rassurer la population en donnant des ordres stricts aux soldats de ne pas interférer avec les civils. Le gouvernement turc a déclaré avec défi que l'histoire se répéterait et a averti que tous seraient responsables si la Grèce s'en prenait à ses citoyens. De nombreux descendants de réfugiés grecs de la ville se sentent profondément émus par cette réalisation."
 THIRD_BALKAN_WAR.70.d:0 "La capitale turque tomba aux mains de l'armée grecque. La chute de la capitale a laissé de nombreux Turcs inquiets quant à l'avenir de leur nation. Alors que les responsables militaires grecs fouillent les bâtiments ministériels abandonnés, des officiers supérieurs et des fonctionnaires tiennent des réunions dans les locaux autrefois occupés par de hauts responsables turcs. Les citoyens grecs lisent avec joie les articles des journaux faisant état de documents et d'objets abandonnés par des responsables turcs qui ont été contraints d'abandonner rapidement leurs fonctions. Malgré ce revers, l'armée turque a déclaré avec défi que la perte d'Ankara n'affaiblirait pas sa détermination."
 THIRD_BALKAN_WAR.71.d:0 "Après d'intenses combats, les forces turques contrôlent Kavala. Les troupes turques transformeraient rapidement la ville en poste de commandement avancé. Le commandant turc qui a capturé la ville déclare que ce sera un tremplin pour les futures avancées turques en Grèce. Le gouvernement grec a déclaré que la défaite constituait un revers mineur et que ses forces chasseraient bientôt tous les Turcs de Grèce. Les résidents grecs resteraient pour la plupart chez eux, et beaucoup s'inquiètent de ce que leur avenir leur réserve sous l'occupation turque."
 THIRD_BALKAN_WAR.72.d:0 "La Turquie a confirmé que ses forces contrôlaient totalement Thessalonique. L'armée turque a organisé une marche officielle vers la maison d'enfance de Mustafa Kemal, le fondateur de la république. Pour de nombreux Turcs, c'est la raison pour laquelle la ville revêt une telle importance symbolique. Pour de nombreux descendants de réfugiés turcs du nord de la Grèce, ils envisagent la victoire avec une grande satisfaction. Pour la population grecque, l'occupation turque ressemble à un désastre, beaucoup craignant pour l'avenir si l'armée turque n'est pas bientôt chassée."
 THIRD_BALKAN_WAR.73.d:0 "L'île historique et stratégiquement vitale de Rhodes est tombée aux mains de la Turquie. Le gouvernement turc a publié des photos d'officiers visitant les principaux sites historiques grecs. Les soldats turcs patrouilleraient largement dans les quartiers civils en guise de démonstration de force auprès de la population grecque locale. De nombreux Grecs seraient furieux contre leur armée et leur gouvernement parce qu'ils n'ont pas réussi à conserver le contrôle de l'île, malgré les efforts des dirigeants grecs pour minimiser le revers. La marine turque serait en train d'établir un centre de commandement local pour mieux utiliser et contrôler l'accès au port."
 THIRD_BALKAN_WAR.74.d:0 "Le gouvernement grec a admis avoir perdu le contrôle d'Ioannina, la plus grande ville et centre administratif du nord-ouest de la Grèce. Bien qu'il ait qualifié cette perte de revers temporaire, le gouvernement turc affirme qu'il est désormais prêt à s'emparer de la région. Les responsables militaires turcs s'installent frénétiquement dans la ville pour établir une autorité d'occupation efficace. Le gouvernement turc a félicité ses forces pour avoir réussi à s'emparer d'une ville protégée par les forces ennemies et un terrain difficile. De nombreux Grecs craignent de plus en plus que la partie nord du pays soit de plus en plus vulnérable aux opérations turques."
 THIRD_BALKAN_WAR.75.d:0 "Le secrétaire général des Nations Unies a annoncé qu'un cessez-le-feu était en place pour mettre fin à l'actuelle guerre gréco-turque. Il a félicité la communauté internationale pour s'être rassemblée et avoir mis un terme aux combats. Les forces grecques et turques auraient arrêté les combats alors que les deux camps attendent nerveusement le résultat final. Les deux gouvernements ont cherché tout au long du conflit à supprimer les nouvelles négatives et à exagérer les succès. De nombreux gouvernements régionaux vont pousser un soupir de soulagement maintenant que les combats sont terminés."
 THIRD_BALKAN_WAR.76.d:0 "Alors que la Turquie et la Grèce se préparent à entamer des pourparlers de paix, une chose est claire : la Grèce exerce un contrôle militaire total sur Chypre. La victoire grecque sur l'île leur donne un levier important dans les négociations. Lorsque le cessez-le-feu a été annoncé, les quartiers chypriotes grecs ont éclaté en célébration, les soldats recevant des fleurs et des bonbons. Cependant, les journalistes notent que les quartiers turcs sont soumis à un couvre-feu strict et que des patrouilles lourdement armées sont constamment présentes dans la zone. Un officier grec a souligné que ces patrouilles étaient destinées à la protection de tous les Chypriotes."
 THIRD_BALKAN_WAR.77.d:0 "Alors que la Turquie et la Grèce se préparent à entamer des pourparlers de paix, une chose est claire : la Turquie exerce un contrôle militaire total sur Chypre. La victoire turque sur l'île leur donne un levier important dans les négociations. Lorsque le cessez-le-feu a été annoncé, la plupart des quartiers étaient entrés dans un état de calme. Seuls les quartiers turcs sont particulièrement animés. Des patrouilles turques patrouillent dans les quartiers grecs les plus militants, les officiers turcs exigeant que les civils remettent leurs armes pour assurer la sécurité de tous."
 THIRD_BALKAN_WAR.78.d:0 "Alors que la Turquie et la Grèce se préparent à entamer des pourparlers de paix, une chose est claire : aucune des deux parties ne contrôle militairement totalement Chypre. Il y a une confrontation tendue entre les soldats turcs et grecs sur la ligne de front. Les officiers des deux camps ont déclaré en privé aux journalistes qu'ils craignaient qu'un incident mineur ne relance les combats. Bien que la guerre ait commencé pour le statut final de Chypre, elle s'est étendue à toute la Méditerranée orientale et à la frontière turco-grecque. Les civils de l'île sont de plus en plus frustrés face à la militarisation continue de l'île."
 THIRD_BALKAN_WAR.79.d:0 "La guerre avec la Grèce ne s'est pas terminée sur une note positive. La Grèce contrôle de vastes étendues de notre territoire et occupe une position dominante. Cependant, nous avons réussi à capturer Chypre, ce qui nous a donné une précieuse pièce de négociation. Étant donné que la guerre n'a commencé qu'à cause de la situation à Chypre, notre meilleur espoir est d'offrir Chypre en échange d'un retour aux frontières d'avant-guerre sur tous les autres fronts. C'est vraiment la seule position que nous pouvons adopter."
 THIRD_BALKAN_WAR.80.d:0 "Nos forces ont vaincu de manière décisive l'armée turque sur la plupart des fronts au cours du récent conflit. Nous détenons une grande partie de ses territoires. Toutefois, à Chypre, nous avons subi un revers et les forces turques ont pris le contrôle de l'île. Nous avions initialement mené le conflit pour achever l'Enosis avec le peuple de Chypre. Le gouvernement turc a proposé un traité de paix, il nous cédera Chypre en échange d'un retour aux frontières d'avant-guerre sur tous les autres fronts. De nombreux membres du gouvernement sont favorables à l'accord, affirmant que le fait de prendre d'autres terres historiques à la Turquie pourrait risquer de susciter la colère étrangère et d'attirer d'importantes populations non grecques dans le pays. Prendre Chypre garantirait notre objectif principal et amènerait une importante population grecque patriote dans la nation. D'autres responsables veulent rejeter l'accord et se concentrer sur l'incorporation de terres plus historiquement grecques."
 THIRD_BALKAN_WAR.81.d:0 "La Grèce et la Turquie ont annoncé un accord pour mettre fin à leur conflit actuel. Le gouvernement turc a accepté de céder Chypre à la Grèce et de reconnaître son autorité sur l'île en échange d'un retour aux frontières d'avant-guerre. L'armée grecque a infligé de lourdes défaites à la Turquie, occupant de vastes étendues de territoire. Mais à Chypre, l'armée turque a pris le dessus, s'emparant de l'île et la conservant jusqu'au cessez-le-feu. L'accord est bien accueilli en Grèce alors que le gouvernement a finalement réalisé l'unification avec Chypre. En Turquie, la déception est grande face à l'échec de la guerre et à l'abandon des Turcs chypriotes. Malgré cela, de nombreux Turcs célèbrent leurs forces et leurs commandants à Chypre pour avoir sécurisé une île qui a sauvé la Turquie d'une défaite encore plus humiliante."
 THIRD_BALKAN_WAR.82.d:0 "Un grand défilé public, auquel ont participé des organisations militaires et civiles, a défilé dans Athènes. Des organisations pro-grecques de Chypre ont également envoyé des participants. Le défilé célébrait le succès de la campagne militaire grecque contre la Turquie, qui a permis à la Grèce de recevoir Chypre. Le rêve d'Enosis est enfin réalisé. De nombreux Grecs ne se contentent pas de célébrer, mais se souviennent également de ceux qui ont sacrifié leur vie pour cette vision. À Chypre, des responsables et des militaires grecs arrivent peu à peu pour transformer l'île en une nouvelle province. Même si les Chypriotes grecs célèbrent ouvertement l'arrivée du nouveau régime, les résidents turcs restent incertains quant à leur avenir."
 THIRD_BALKAN_WAR.83.d:0 "Il y a de grandes manifestations de colère contre le gouvernement turc à cause de sa gestion de la récente guerre avec la Grèce. De grandes parties de la Turquie sont tombées sous occupation grecque pendant le conflit. De nombreux Turcs ont estimé que leur gouvernement et leur armée n'avaient pas réussi à les protéger tout au long des combats. En outre, l'accord visant à céder Chypre aux frontières d'avant-guerre suscite une immense colère. L'avenir des Turcs chypriotes suscite de plus en plus de craintes. Certains dirigeants de l'opposition accusent le gouvernement de sacrifier Chypre pour minimiser l'ampleur de son échec dans la conduite du conflit."
 THIRD_BALKAN_WAR.84.d:0 "Nous sommes dans une formidable position de négociation. Nos forces contrôlent des zones majeures de la Turquie, y compris de nombreuses terres historiquement grecques. Plus important encore, Constantinople est désormais sous notre drapeau. Les éléments les plus bellicistes du gouvernement veulent que nous profitions de cette victoire militaire et que nous fassions pression pour une Grande Grèce, en prenant autant de terres historiquement grecques que possible. Les éléments les plus modérés craignent cependant qu'une telle décision puisse provoquer une forte réaction de la part des États-Unis et amener trop de Turcs en Grèce, affaiblissant ainsi notre stabilité. Ces éléments incitent le gouvernement à faire pression pour qu'Edirne et Constantinople chassent enfin les Turcs d'Europe. Une position de négociation finale doit être décidée prochainement."
 THIRD_BALKAN_WAR.85.d:0 "La Grèce a signé un traité de paix avec la Turquie, confirmant son contrôle sur Edirne et Istanbul. L'accord a ébranlé la nation turque et semé la panique dans de nombreuses capitales européennes. Beaucoup accusent la Grèce de revendications territoriales manifestes, soulignant que les territoires qu'elle a conquis comptent un grand nombre de citoyens turcs dont l'avenir semble incertain. Le gouvernement turc s'est trouvé incapable de répondre à ces demandes car il a été vaincu militairement et a perdu de grandes parties de son territoire. L'accord est salué dans toute la Grèce comme la première étape vers le retour de la Grèce à ses frontières historiques. En Turquie, il existe un sentiment de désespoir parmi les citoyens."
 THIRD_BALKAN_WAR.86.d:0 "Le récent conflit avec la Grèce et sa mainmise sur notre territoire européen constituent un revers majeur pour notre nation. Beaucoup dans le pays sont furieux contre l'OTAN, se demandant à quoi sert de faire partie de l'alliance si elle n'offre pas de protection. Peut-être que l'avenir de la Turquie se trouve ailleurs que chez les États-Unis et leurs alliés. Certains au sein du gouvernement exigent que nous menacions les États-Unis de quitter l'organisation, d'autres affirment que notre sécurité future dépend de la poursuite de la coopération avec l'OTAN."
 THIRD_BALKAN_WAR.87.d:0 "Notre ambassadeur en Turquie a écrit un avertissement indiquant que la Turquie envisageait de quitter l'OTAN. Le gouvernement turc a également laissé entendre qu'il pourrait même se tourner vers les Soviétiques. La Turquie est furieuse de sa récente défaite militaire et de sa perte de territoire au profit de la Grèce. Beaucoup dans le pays pensent que l'OTAN les a trahis en raison d'un manque de soutien pendant le conflit. Nous avons deux options : la première consiste à offrir un important programme d'aide militaire et économique pour reconstruire l'armée et l'économie turques. L'autre option est de ne rien proposer. Certains responsables suggèrent que cette menace pourrait simplement être un bluff turc destiné à obtenir notre aide."
 THIRD_BALKAN_WAR.88.d:0 "En réponse à nos menaces de quitter l'OTAN, les États-Unis se sont engagés à fournir d'importants programmes d'armement et d'aide économique pour reconstruire la Turquie. Ils exhortent les autres États de l'OTAN à nous aider à reconstruire notre dissuasion militaire. Il s'agit sans aucun doute d'un programme très généreux, mais de nombreux Turcs se sentent encore trahis par l'OTAN. Les Américains insistent sur le fait que leur programme d'aide n'est éligible que tant que nous restons attachés à l'OTAN. Le gouvernement doit décider s'il restera au sein de l'OTAN, recevra l'aide ou si nous devons rejeter cette offre d'aide et tenir des discussions publiques sur une future adhésion."
 THIRD_BALKAN_WAR.89.d:0 "En réponse à nos menaces de quitter l'OTAN, les États-Unis ont envoyé un message de leur président nous exhortant à rester. Ils n'ont offert aucune assurance, soutien ou aide. C'est incroyablement décevant compte tenu de tout ce que nous avons perdu lors de la récente guerre contre la Grèce. Le cabinet est furieux de la réponse américaine. La seule option qui reste à notre nation est de mener un débat public sur la question de savoir s'il est dans l'intérêt de la Turquie de rester ou non membre de l'OTAN."
 THIRD_BALKAN_WAR.90.d:0 "Le gouvernement grec tente de capitaliser sur sa victoire militaire contre la Turquie. Il revendique de grandes portions de Turquie afin de former une « Grande Grèce ». Si la Grèce s'empare de ces territoires, cela modifiera radicalement l'équilibre des pouvoirs dans la région. Plus important encore, ces territoires revendiqués sont occupés par d'importantes populations non grecques. La Turquie appelle à l'aide. Nous pouvons faire pression sur la Grèce pour qu'elle revienne à ses exigences, en la menaçant de sanctions et d'autres punitions. La communauté internationale soutiendra probablement une telle action, car nombreux sont ceux qui craignent qu'une expansion à grande échelle n'entraîne une crise humanitaire majeure. Cela pourrait également permettre aux modérés en Grèce d'empêcher les partisans de la ligne dure de faire pression en faveur d'une expansion territoriale majeure. L'autre option est de ne pas intervenir et de laisser la situation se dérouler telle quelle."
 THIRD_BALKAN_WAR.91.d:0 "Les États-Unis ont envoyé un message secret à notre gouvernement. Ils insistent pour que nous réduisions nos exigences territoriales, sous peine de sanctions internationales et probablement d'expulsion de l'OTAN. L'alliance ne peut pas fonctionner si la Turquie est tellement affaiblie qu'elle ne peut pas assumer ses responsabilités. Ils affirment également que nos exigences territoriales sont déraisonnables et entraîneront une bien plus grande instabilité. Compte tenu des populations non grecques de ces régions, c'est en fait un bon argument. Les modérés du cabinet font pression sur le gouvernement pour qu'il tienne compte de la demande américaine. Nous pouvons gagner Constantinople et maintenir notre alliance avec l'OTAN. Cependant, les partisans de la ligne dure estiment que la Grèce se trouve à un moment de transformation historique et affirment qu'elle doit prendre tout le territoire possible."
 THIRD_BALKAN_WAR.92.d:0 "Le gouvernement grec a rejeté nos demandes de réduction de ses exigences territoriales envers la Turquie. Cela affaiblirait considérablement l'alliance de l'OTAN et créerait un terrible précédent. Le gouvernement grec semble ivre de pouvoir après sa victoire. Nous devons tenir une réunion d'urgence de l'OTAN pour élaborer une réponse efficace. De nombreux membres de l'alliance estiment que la Grèce ne montre aucun intérêt à agir dans le meilleur intérêt de l'OTAN et de la sécurité collective. Le gouvernement et le peuple turcs se sentiront dévastés par cette perte de territoire, nous devons les rassurer de notre soutien pour ne pas risquer de perdre également leur adhésion."
 THIRD_BALKAN_WAR.93.d:0 "Les États-Unis ont convoqué une session d'urgence des membres de l'OTAN pour discuter de la Grèce. Après avoir remporté une victoire militaire majeure contre la Turquie, elle a insisté pour occuper de vastes pans de son territoire. Cette décision non seulement déstabilise la région, mais affaiblit également considérablement la Turquie, un État de première ligne vital de l'OTAN, comme la Grèce. Les efforts des membres de l'OTAN, menés par les États-Unis, pour faire pression sur la Grèce afin qu'elle revienne sur ses exigences ont échoué. La Grèce ne peut plus en être membre et sera expulsée. Pour protéger la Turquie d'une nouvelle agression grecque, des sanctions militaires et économiques seront immédiatement imposées. En outre, les États membres doivent décider s'ils souhaitent offrir à la Turquie une aide militaire importante ou une aide militaire et économique. Certains membres estiment que le fait de ne pas offrir un soutien important à la Turquie pourrait l'amener à quitter l'organisation."
 THIRD_BALKAN_WAR.94.d:0 "Suite à notre victoire militaire massive contre la Turquie, notre gouvernement a révélé son intention d'occuper d'énormes quantités de territoire turc. Ces terres constituent le noyau historique de la Grèce et doivent être restaurées. Les États-Unis, qui agissent comme les marionnettistes de la Turquie, ont menacé de sanctions sévères de leur part ainsi que d'autres membres de l'OTAN si nous ne réduisons pas nos exigences. Ils ont indiqué qu'ils accepteraient l'occupation de Constantinople et des territoires turcs européens, mais rien d'autre. Les modérés estiment que nous devrions tenir compte de cet avertissement, soulignant que prendre beaucoup plus de terres amènerait d'énormes populations non grecques dans le pays. Cependant, des dirigeants plus radicaux insistent sur le fait que nous ne permettons à aucune puissance étrangère de nous dicter nos conditions."
 THIRD_BALKAN_WAR.95.d:0 "Malgré les protestations internationales, largement menées par les États-Unis, la Grèce a confirmé qu'elle chercherait à contrôler de grandes quantités de terres turques après sa victoire militaire. Le gouvernement grec insiste sur le fait qu'il ne s'agit pas d'une expansion territoriale mais plutôt de la libération de terres historiquement grecques. Elle n'a pas répondu aux inquiétudes concernant la place des populations non grecques résidant actuellement sur le territoire. La nouvelle va probablement provoquer un tollé en Turquie, le gouvernement turc ayant cherché à minimiser les informations ces derniers jours. Les États-Unis ont exprimé leur mécontentement face à la réponse grecque et ont appelé à une réunion d'urgence de l'OTAN pour discuter de la situation."
 THIRD_BALKAN_WAR.96.d:0 "La population turque a récemment pris conscience de l'ampleur des revendications territoriales formulées par la Grèce. Les efforts déployés par le gouvernement turc pour empêcher la nouvelle de ses pertes militaires et territoriales ne peuvent empêcher la prise de conscience que la Grèce contrôle désormais des villes et des terres turques vitales le long de la Méditerranée. Les autorités locales d'Ankara ont été contraintes de faire appel à des soldats pour rétablir l'ordre après que des foules turques en colère, notamment des réfugiés poussés par les récents combats, aient commencé à attaquer les bâtiments gouvernementaux. Il existe un sentiment de profonde humiliation dans toute la Turquie, ce qui a amené des journalistes étrangers à rapporter que de nombreuses personnes en Turquie semblent être dans un état dépressif."
 THIRD_BALKAN_WAR.97.d:0 "Suite à la saisie massive de territoires par la Grèce, l'OTAN a décidé de tenir une réunion d'urgence. Tous les membres ont convenu que les exigences grecques étaient excessives et inacceptables. Des sanctions militaires et économiques doivent être imposées immédiatement. L'autre question est de savoir comment soutenir la Turquie. À l'heure actuelle, la Turquie reste membre de l'OTAN, même si nombreux sont ceux qui estiment que l'organisation n'a pas réussi à les défendre. Certains États de l'OTAN estiment que l'organisation doit fournir une aide militaire et économique importante pour reconstruire la Turquie et ses relations avec son peuple. D'autres estiment que l'aide devrait se concentrer uniquement sur l'armée, afin de restaurer ses capacités. Compte tenu de l'état affaibli de la Turquie, on a le sentiment que leur apporter une aide pourrait être du gaspillage."
 THIRD_BALKAN_WAR.98.d:0 "À la suite d'une réunion d'urgence, l'OTAN a annoncé qu'elle imposerait des sanctions économiques et militaires à notre pays. Il s'agit d'une réaction excessive à notre juste libération des terres historiquement grecques. Nos forces militaires ont remporté une victoire écrasante et nous refusons de gaspiller leur victoire historique pour apaiser les puissances étrangères. Ces sanctions ne veulent rien dire, nous trouverons de nouveaux partenaires et ne seront pas dictées par l'Occident et son hypocrisie. Nous ne nous attendons pas à beaucoup de réactions négatives de la part de notre propre peuple, qui continue de soutenir fermement la nation."
 THIRD_BALKAN_WAR.99.d:0 "À la suite d'une réunion d'urgence de l'OTAN, l'alliance a accepté de nous fournir une aide militaire massive. L'OTAN estime qu'il est essentiel de restaurer notre crédibilité militaire pour nous permettre de remplir nos obligations envers l'alliance. Plus important encore, cet équipement nous permettra d'assurer que les rapaces grecs ne tenteront pas de nous prendre encore plus de terres à l'avenir. En effet, certains commandants suggèrent que nous commencions à positionner le nouveau matériel pour préparer la future libération de nos terres perdues. Toutefois, ces discussions doivent rester confidentielles de l'OTAN."
 THIRD_BALKAN_WAR.100.d:0 "À la suite d'une réunion d'urgence de l'OTAN, l'alliance a accepté de nous fournir une aide militaire et économique massive. L'OTAN estime qu'il est essentiel de restaurer notre crédibilité militaire et notre économie pour nous permettre de remplir nos obligations envers l'alliance. Plus important encore, ce soutien nous permettra de garantir que les rapaces grecs ne tenteront pas de nous prendre encore plus de terres à l'avenir. Les hauts dirigeants tiendront des réunions dans les prochains jours pour garantir que ce soutien puisse être utilisé efficacement pour maximiser nos capacités à contrer la menace grecque persistante."
 THIRD_BALKAN_WAR.101.d:0 "Le récent conflit avec la Grèce et sa saisie de notre territoire ont mis en évidence les limites de notre alliance avec l'OTAN. L'OTAN a eu amplement l'occasion de nous aider dans notre moment de crise, mais elle a choisi de ne pas le faire. Le soutien que nous avons reçu s'est avéré inefficace. De nombreuses personnes dans le pays, notamment dans les médias, considèrent l'OTAN comme une alliance qui exige beaucoup mais offre peu en retour. Ils se demandent également, compte tenu de la guerre en Grèce, que les inquiétudes concernant le communisme soient en réalité exagérées. Les partisans de l'OTAN admettent que les récentes actions ont été décevantes, mais dans l'ensemble, l'alliance offre de nombreux avantages et protections à la Turquie. Le cabinet se réunira pour discuter du futur statut de la Turquie au sein de l'OTAN."
 THIRD_BALKAN_WAR.102.d:0 "Le gouvernement turc a annoncé qu'il se retirerait officiellement de l'OTAN. Les dirigeants turcs ont ensuite publié une déclaration soulignant le sentiment de trahison ressenti par tous les Turcs alors que l'alliance n'avait pas réussi à se défendre contre l'agression grecque. Les objectifs de l'OTAN n'étaient plus compatibles avec les intérêts de la Turquie. De nombreux analystes estiment que la Turquie cherche à forger une nouvelle politique étrangère davantage axée sur la région. Elle cherche à reconstruire leurs capacités et à se préparer à affronter à nouveau la Grèce à l'avenir. De nombreux Turcs ont également le sentiment que la menace du communisme, tant interne qu'externe, a été largement fabriquée par la propagande de l'OTAN."
 THIRD_BALKAN_WAR.103.d:0 "La guerre avec la Turquie ne s'est pas terminée sur une note positive. Les Turcs contrôlent de vastes étendues de notre territoire et occupent une position dominante. Cependant, nous avons réussi à capturer Chypre, ce qui nous a donné une précieuse pièce de négociation. Étant donné que la guerre n'a commencé qu'à cause de la situation à Chypre, notre meilleur espoir est d'offrir l'île en échange d'un retour aux frontières d'avant-guerre sur tous les autres fronts. C'est vraiment la seule position que nous pouvons adopter, même si notre peuple sera peiné par cette perte, Enosis ne vaut pas la peine de perdre l'unité de la nation."
 THIRD_BALKAN_WAR.104.d:0 "Nos forces ont vaincu de manière décisive l'armée grecque sur la plupart des fronts au cours du récent conflit. Nous détenons une grande partie de ses territoires. Cependant, à Chypre, nous avons subi un revers et les forces grecques ont pris le contrôle de l'île. Nous avions initialement combattu le conflit pour protéger les Turcs chypriotes de la menace d'anéantissement culturel de la part des Grecs. Le gouvernement grec a proposé un traité de paix, il nous cédera Chypre en échange d'un retour aux frontières d'avant-guerre sur tous les autres fronts. De nombreux membres du gouvernement sont favorables à l'accord, affirmant qu'exiger davantage de gains territoriaux sans sécuriser Chypre ne ferait qu'attirer d'importantes populations non turques ayant besoin d'une occupation coûteuse. Cependant, certains pensent que nous devons poursuivre nos efforts et que cela garantira la protection des Turcs à Chypre."
 THIRD_BALKAN_WAR.105.d:0 "De nombreuses capitales à travers le monde ont poussé un soupir de soulagement après avoir appris que la Grèce et la Turquie avaient accepté des conditions de paix. Les deux parties reviendront aux frontières d'avant-guerre à condition que la Grèce cède Chypre à la Turquie. L'armée grecque a été largement vaincue pendant le conflit, sauf à Chypre, et l'a utilisée pour négocier le retrait des forces turques de ses autres territoires. Il est important de noter que la Grèce ne pouvait exiger aucune condition à l'administration turque sur l'île. Le gouvernement turc a salué ses forces armées et a annoncé qu'il étudierait les moyens de résoudre la situation à Chypre dans l'intérêt de toutes les parties."
 THIRD_BALKAN_WAR.106.d:0 "Chypre est fermement sous contrôle turc. Il y a quelques jours seulement, des milliers de Grecs chypriotes regardaient tristement les derniers soldats grecs marcher sur leurs navires. Les troupes turques sont rapidement intervenues pour rétablir l'ordre dans les villes grecques, s'aventurant hors de leurs bases dans les zones turques chypriotes de l'île. Les rapports de la presse étrangère indiquent que les troupes turques sont largement ignorées et boudées par les Grecs, mais aucun incident violent n'a été signalé. Le cabinet turc tiendra des pourparlers dans les prochains jours soit pour restaurer l'ancienne constitution et accorder l'indépendance à Chypre, soit pour maintenir son occupation militaire."
 THIRD_BALKAN_WAR.107.d:0 "Après de longues discussions, le gouvernement turc a confirmé qu'il devait maintenir son occupation actuelle de Chypre. Il a évoqué la nécessité de restaurer la stabilité sur l'île et de déraciner tous les éléments étrangers avant d'envisager une autre solution. Les dirigeants turcs n'ont pas tardé à souligner que cette décision ne constituait pas une occupation permanente et qu'à terme, ils souhaitaient voir une Chypre dans laquelle tous les Chypriotes seraient protégés par l'État de droit. Le gouvernement grec a publié une déclaration remettant en question l'avantage du maintien d'une occupation militaire sur l'île. Des manifestations ont eu lieu en Grèce pour condamner la Turquie pour sa décision. En Turquie, la réaction a été généralement favorable, la plupart des Turcs acceptant que la situation sur l'île ait besoin d'être plus stabilisée."
 THIRD_BALKAN_WAR.108.d:0 "Le gouverneur militaire turc de Chypre a officiellement cédé le pouvoir à un nouveau gouvernement intérimaire sur l'île. De nouvelles élections doivent avoir lieu dans les mois à venir. Le cabinet turc a récemment approuvé le rétablissement de l'ancienne constitution, annulant les amendements adoptés par les Chypriotes grecs qui cherchaient à mettre Chypre sur la voie de l'unification avec la Grèce. Bien que les autorités turques aient rapidement affirmé qu'elles rétablissaient une constitution inclusive, les critiques soulignent que la constitution a été modifiée. La Turquie est répertoriée comme garante de la démocratie à Chypre et Enosis est interdite. De nombreuses manifestations ont eu lieu en Grèce, nombre d'entre elles condamnant la Turquie pour avoir fait de Chypre son État client."
 THIRD_BALKAN_WAR.109.d:0 "Nos forces armées, avec le soutien du peuple, ont réussi à infliger une victoire militaire massive à la Grèce. Ses forces ont été battues, déjouées et dépassées tout au long du conflit. Après un cessez-le-feu de l'ONU, nous devons entamer des négociations de paix avec la Grèce. Le gouvernement doit déterminer sa position de négociation, nous en fixerons les termes. Un groupe, majoritairement modéré, souhaite que nous prenions le territoire contenant Kavala et l'île de Rhodes. Cela nous donnera un avantage stratégique et garantira que la Grèce ne pourra plus jamais nous menacer. Plus les partisans de la ligne dure croient que l'option de paix gaspillerait notre avantage, plus ils veulent reprendre les terres perdues lors de la Première Guerre balkanique et reprendre le nord de la Grèce. Les opposants à ce point de vue estiment que cela ne plairait pas à la communauté internationale et qu'il serait difficile d'incorporer des terres abritant d'importantes populations non turques."
 THIRD_BALKAN_WAR.110.d:0 "Suite à la récente guerre gréco-turque, la Turquie s'est retrouvée dans une position dominante. Il contrôlait de grandes quantités de terres grecques et était militairement dominant. Après les pourparlers de paix, les deux parties ont confirmé que la Turquie recevrait Kavala, ses territoires environnants et Rhodes. Les analystes estiment que ce territoire permettra à l'armée turque d'acquérir un avantage stratégique qu'il ne sera pas facile pour la Grèce de surmonter à l'avenir. La Grèce reste largement maîtrisée, mais un sentiment de colère grandit parmi sa population. Le gouvernement turc sera satisfait du résultat, même s'il devra se contenter de s'emparer de territoires abritant une importante population grecque."
 THIRD_BALKAN_WAR.111.d:0 "Suite à la perte de territoire lors du récent conflit avec la Turquie, de nombreuses personnes dans le pays remettent en question notre participation continue au sein de l'OTAN. Ils notent que la Grèce a considérablement souffert au cours des dernières décennies en raison de son implication dans les affaires européennes au sens large. Ce faisant, la Grèce est souvent laissée à la périphérie. Nombreux sont également ceux qui pensent que la menace du communisme est simplement le produit de la propagande de l'OTAN et que l'alliance n'offre rien. Malgré ces critiques, certains défenseurs de l'OTAN exhortent le gouvernement à ne pas quitter l'organisation. Ils estiment que l'OTAN offre une protection contre les menaces existentielles et ouvre des voies de croissance à la nation. Le gouvernement envisage d'informer les États-Unis qu'il pourrait reconsidérer son adhésion à l'OTAN."
 THIRD_BALKAN_WAR.112.d:0 "Notre ambassadeur en Grèce a écrit un avertissement indiquant que son gouvernement envisageait de quitter l'OTAN. Le gouvernement grec a également laissé entendre qu'il pourrait même se tourner vers les Soviétiques. La Grèce est furieuse de sa récente défaite militaire et de sa perte de territoire au profit de la Turquie. Beaucoup dans le pays pensent que l'OTAN les a trahis en raison d'un manque de soutien pendant le conflit. Nous avons deux options : la première consiste à offrir un important programme d'aide militaire et économique pour reconstruire l'armée et l'économie grecques. L'autre option consiste simplement à les exhorter à rester. Certains responsables suggèrent que cette menace pourrait simplement être un bluff grec destiné à obtenir notre aide."
 THIRD_BALKAN_WAR.113.d:0 "En réponse à nos menaces de quitter l'OTAN, les États-Unis se sont engagés à fournir d'importants programmes d'armement et d'aide économique pour reconstruire la Grèce. Ils exhortent les autres États de l'OTAN à nous aider à reconstruire notre dissuasion militaire. Il s'agit sans aucun doute d'un plan très généreux, mais de nombreux Grecs se sentent encore trahis par l'OTAN. Les Américains insistent sur le fait que leur programme d'aide n'est éligible que tant que nous restons attachés à l'OTAN. Le gouvernement doit décider s'il restera au sein de l'OTAN, recevra l'aide ou si nous devons rejeter cette offre d'aide et tenir des discussions publiques sur une future adhésion."
 THIRD_BALKAN_WAR.114.d:0 "En réponse à nos menaces de quitter l'OTAN, les États-Unis ont envoyé un message de leur président nous exhortant à rester. Ils n'ont offert aucune assurance, soutien ou aide. C'est incroyablement décevant compte tenu de tout ce que nous avons perdu lors de la récente guerre avec la Turquie. Le cabinet est furieux de la réponse américaine. La seule option qui reste à notre nation est de mener un débat public sur la question de savoir s'il est dans l'intérêt de la Grèce de rester ou non membre de l'OTAN."
 THIRD_BALKAN_WAR.115.d:0 "Des rapports indiquent que des représentants grecs ont quitté une réunion avec des représentants turcs sur un traité de paix mettant fin à la récente guerre gréco-turque avec un air choqué. Il est vite apparu que la Turquie avait essentiellement exigé le contrôle du nord de la Grèce, réclamant toutes les terres qu'elle avait perdues sous le nom d'Empire Ottoman lors de la Première Guerre balkanique. Ces terres représentent une importante population grecque et des ressources économiques vitales. Nos analystes estiment que cela pourrait potentiellement déstabiliser la région, entraîner des migrations de population et de futurs conflits. Beaucoup de nos alliés européens sont mal à l'aise face à cette expansion turque massive. Le président doit décider soit de laisser passer l'accord de paix, soit de faire pression sur la Turquie pour qu'elle revienne à la baisse dans l'intérêt de la stabilité régionale."
 THIRD_BALKAN_WAR.116.d:0 "Les États-Unis ont discrètement informé nos hauts responsables que nous risquons de faire face à des sanctions si nous procédons à la saisie du nord de la Grèce. Les Américains insistent sur le fait que si nous prenons le territoire, nous ne ferons que perpétuer le conflit et provoquer l'instabilité dans la région. Certains de nos propres responsables sont d'accord : ils estiment qu'il sera coûteux et difficile de gérer l'occupation d'un si grand nombre de Grecs. Les Américains ont ajouté qu'ils accepteraient un accord réduit, nous donnant un certain territoire, mais que si nous prenons toutes les terres demandées, nous risquons des sanctions."
 THIRD_BALKAN_WAR.117.d:0 "Dans un développement surprenant, les États-Unis ont annoncé qu'ils imposeraient des sanctions à la Turquie pour ce qu'ils considèrent comme des exigences territoriales excessives envers la Grèce. Le gouvernement américain a déclaré que ses sanctions visaient à démontrer ses inquiétudes quant aux perspectives plus larges de paix dans la région. Le gouvernement turc a publié une déclaration exprimant son mécontentement face à la décision américaine. Des manifestations anti-américaines ont été signalées, mais les analystes ne savent pas si ces sanctions seront durables en raison de leur alliance avec l'OTAN."
 
 THIRD_BALKAN_WAR.118.d:0 "Les États-Unis ont discrètement levé leurs sanctions contre la Turquie. Les sanctions ont été initialement imposées en réponse aux exigences territoriales que la Turquie a imposées à la Grèce. Au cours des mois précédents, le Pentagone et le Département d'État ont assuré le Congrès de leur soutien à la levée des sanctions. La Maison Blanche a soutenu cet effort, arguant que la Turquie reste une puissance régionale vitale qui doit être impliquée. La Turquie a publié sa propre déclaration saluant cette décision et attendant avec impatience le renouvellement de ses obligations."
 THIRD_BALKAN_WAR.119.d:0 "Les États-Unis ont envoyé un message secret à notre gouvernement. Ils insistent pour que nous réduisions nos exigences territoriales, sous peine de sanctions internationales et probablement d'expulsion de l'OTAN. L'alliance ne peut pas fonctionner si la Grèce est considérablement affaiblie. Ils affirment également que nos exigences territoriales sont déraisonnables et entraîneront une bien plus grande instabilité. Compte tenu de la présence de populations non turques dans ces régions, c'est en fait un bon argument. Les modérés du cabinet font pression sur le gouvernement pour qu'il tienne compte de la demande américaine. Nous pouvons réduire nos exigences pour obtenir un avantage stratégique sur la Grèce, tout en maintenant notre alliance avec l'OTAN. Cependant, les partisans de la ligne dure estiment que la Turquie se trouve à un moment de transformation historique et affirment qu'elle doit prendre tout le territoire possible."
 THIRD_BALKAN_WAR.120.d:0 "Les États-Unis et l'OTAN ont fait pression sur la Turquie pour qu'elle réduise ses exigences envers la Grèce après sa victoire. L'OTAN craint que si la Turquie poursuit ses conquêtes, elle ne déstabilise la région et ne provoque de nouveaux conflits dans les années à venir. Plus important encore, l'affaiblissement de la Grèce et l'instabilité dans les territoires nouvellement occupés pourraient entraver considérablement les capacités de l'OTAN en Méditerranée. Cependant, la Turquie a indiqué qu'elle ne se laisserait pas dicter de le faire, affirmant qu'elle poursuivrait ses revendications. De nombreux Turcs estiment qu'ils ont mérité leur victoire et soutiennent cet effort."
 THIRD_BALKAN_WAR.121.d:0 "La Turquie fait pression pour obtenir des gains territoriaux massifs aux dépens de la Grèce, qu'elle a vaincue lors de son récent conflit. Comme tous deux sont des États membres de l'OTAN, l'organisation a appelé la Turquie à faire preuve de retenue, ce qu'elle a refusé pour le bien de l'ensemble de l'alliance. Une réunion d'urgence a été convoquée, l'organisation expulsera certainement la Turquie et imposera des sanctions. La question est désormais de savoir s'il faut également accorder une aide à la Grèce. Beaucoup au sein de l'alliance estiment que l'organisation devrait aider à reconstruire la Grèce, mais certains pensent qu'apporter une aide ne pourrait qu'inciter la Turquie à trouver des alliés alternatifs, provoquant davantage d'instabilité."
 THIRD_BALKAN_WAR.122.d:0 "La Turquie a officiellement annoncé qu'elle occuperait les terres perdues par l'Empire Ottoman lors de la Première Guerre balkanique. Le gouvernement turc affirme que ce territoire permettra à de nombreux Turcs de retourner dans leurs foyers ancestraux et empêchera la Grèce de devenir une menace pour l'avenir. La réaction de la Grèce devrait être extrême, car beaucoup craindront pour les membres de leur famille actuellement sous occupation turque. De nombreux États voisins expriment leur profonde inquiétude quant à ce que l'avenir leur réserve."
 THIRD_BALKAN_WAR.123.d:0 "Le gouvernement grec, en difficulté, peine à maintenir l'ordre dans un contexte de troubles croissants. De nombreux Grecs sont stupéfaits par l'ampleur de leur défaite nationale et de la perte de leur coeur du nord. La Grèce sera aux prises avec la séparation de nombreuses familles en raison de la nouvelle occupation turque. Les journalistes internationaux évoquent un sentiment de dépression palpable parmi la population. Il faudra du temps pour que le pays se rassemble. Des rumeurs courent selon lesquelles des officiers militaires voyagent en civil pour éviter les abus du public."
 THIRD_BALKAN_WAR.124.d:0 "À la suite d'une réunion d'urgence, l'OTAN a annoncé qu'elle imposerait des sanctions économiques et militaires à notre pays. Il s'agit d'une réaction excessive à l'égard de notre juste libération des terres dont notre peuple a été brutalement expulsé. Nos forces militaires ont remporté une victoire écrasante et nous refusons de gaspiller leur victoire historique pour apaiser les puissances étrangères. Ces sanctions ne veulent rien dire, nous trouverons de nouveaux partenaires et ne seront pas dictées par l'Occident et son hypocrisie. Nous ne nous attendons pas à beaucoup de réactions négatives de la part de notre propre peuple, qui continue de soutenir fermement la nation."
 THIRD_BALKAN_WAR.125.d:0 "À la suite d'une réunion d'urgence de l'OTAN, l'alliance a accepté de nous fournir une aide militaire massive. L'OTAN estime qu'il est essentiel de restaurer notre crédibilité militaire pour nous permettre de remplir nos obligations envers l'alliance. Plus important encore, cet équipement nous permettra d'assurer que les rapaces grecs ne tenteront pas de nous prendre encore plus de terres à l'avenir. En effet, certains commandants suggèrent que nous commencions à positionner le nouveau matériel pour préparer la future libération de nos terres perdues. Toutefois, ces discussions doivent rester confidentielles de l'OTAN."
 THIRD_BALKAN_WAR.126.d:0 "À la suite d'une réunion d'urgence de l'OTAN, l'alliance a accepté de nous fournir une aide militaire et économique massive. L'OTAN estime qu'il est essentiel de restaurer notre crédibilité militaire et notre économie pour nous permettre de remplir nos obligations envers l'alliance. Plus important encore, ce soutien nous permettra de garantir que les Turcs rapaces ne tenteront pas de nous prendre encore plus de terres à l'avenir. Les hauts dirigeants tiendront des réunions dans les prochains jours pour garantir que ce soutien puisse être utilisé efficacement pour maximiser nos capacités à contrer la menace turque actuelle."
 THIRD_BALKAN_WAR.127.d:0 "Le récent conflit avec la Turquie et sa mainmise sur notre territoire ont mis en évidence les limites de notre alliance avec l'OTAN. L'OTAN a eu amplement l'occasion de nous aider dans notre moment de crise, mais elle a choisi de ne pas le faire. Le soutien que nous avons reçu s'est avéré inefficace. De nombreuses personnes dans le pays, notamment dans les médias, considèrent l'OTAN comme une alliance qui exige beaucoup mais offre peu en retour. Ils se demandent également, compte tenu de la récente guerre, que les inquiétudes concernant le communisme soient en réalité exagérées. Les partisans de l'OTAN admettent que les récentes actions ont été décevantes, mais dans l'ensemble, l'alliance offre de nombreux avantages et protections à la Turquie. Le cabinet se réunira pour discuter du futur statut de la Grèce au sein de l'OTAN."
 THIRD_BALKAN_WAR.128.d:0 "La récente guerre gréco-turque s'est terminée de manière peu concluante. Aucune des deux parties n'a réussi à acquérir une position dominante sur l'autre. La propagande dans les deux pays cherchait à souligner leurs succès militaires et à minimiser leurs revers. Les deux gouvernements devront expliquer pourquoi leur camp n'a pas obtenu une victoire écrasante. En effet, les journaux des deux pays se concentrent plutôt sur les récits d'héroïsme et minimisent l'absence de résultats tangibles. Au niveau international, on ressent un sentiment de soulagement, car nombreux sont ceux qui craignent les conséquences à long terme de la poursuite du conflit ou d'un changement de territoire pour la région."
 THIRD_BALKAN_WAR.129.d:0 "Radio Le Caire a confirmé que la République Arabe Unie a officiellement pris le contrôle de Hatay à la Turquie. Des rapports font état de célébrations de masse à travers le monde arabe et de troupes de la RAU dansant dans les rues avec les habitants de Hatay. La RAU a envahi Hatay lors de la récente guerre gréco-turque, profitant du conflit. Leurs forces ont réussi à occuper le territoire et à le conserver tout au long du conflit. Le gouvernement turc a confirmé la perte de territoire mais a promis qu'il n'oublierait jamais la trahison qu'il a subie. Même si la RAU se réjouira de sa victoire, de nombreux analystes estiment qu'elle s'est fait un ennemi permanent en Turquie, ce qui ajoute à ses problèmes de sécurité."
 THIRD_BALKAN_WAR.130.d:0 "La République Arabe Unie a cherché à nous poignarder dans le dos lors de la récente guerre gréco-turque. Ils voulaient s'emparer de Hatay, sur la base de fragiles raisons d'unité arabe. Comme on pouvait s'y attendre, nos forces ont contrecarré l'invasion et ont pénétré profondément dans leur territoire. À la fin du conflit, nous contrôlons le nord de la Syrie, y compris la ville historique d'Alep. Nous sommes confrontés à trois options : soit restituer les terres capturées, occuper définitivement le nord de la Syrie, soit établir un gouvernement syrien ami. Restituer le territoire rétablirait les relations et rétablirait la situation d'avant-guerre. Notre victoire a prouvé qu'ils ne peuvent pas nous vaincre. L'annexion de ces terres pourrait nous donner un tampon pour surveiller la RAU, mais risquerait d'en faire un ennemi permanent. Enfin, l'établissement d'un gouvernement syrien nous donne un État tampon viable et peut menacer l'unité de la République arabe unie."
 THIRD_BALKAN_WAR.131.d:0 "La Turquie a annoncé que ses forces quittaient les terres qu'elle avait conquises à la République arabe unie lors de la récente guerre gréco-turque. Le gouvernement turc a déclaré que ses opérations étaient purement défensives et qu'il n'avait aucune ambition territoriale. De nombreux analystes estiment que la Turquie ne souhaitait pas assumer la responsabilité d'occuper les terres arabes et de s'impliquer plus profondément au Moyen-Orient. L'armée turque a également démontré sa supériorité militaire sur son adversaire. La RAU minimise l'annonce, essayant plutôt de présenter le retrait comme une indication que son armée a réussi à infliger suffisamment de dégâts pour forcer la retraite turque. L'arrivée de réfugiés et de forces en retraite dans les villes de la RAU a largement limité l'efficacité de cette propagande."
 THIRD_BALKAN_WAR.132.d:0 "Le gouvernement turc a confirmé que ses forces contrôlaient Alep et le nord de la Syrie. Ils n'ont pas précisé si l'occupation était censée être temporaire ou permanente. Un porte-parole militaire turc a souligné que la tentative d'invasion de la République Arabe Unie au cours de la guerre gréco-turque récemment conclue signifiait qu'il était nécessaire de maintenir des forces pour respecter les intentions de la RAU. La République Arabe Unie a condamné cette annonce, affirmant qu'elle permettrait de se venger et de libérer tous les Arabes sous le joug turc. Malgré ses déclarations audacieuses et sa propagande agressive, de nombreux citoyens de la RAU seraient furieux contre leurs dirigeants civils et militaires qu'ils accusent d'être responsables de la défaite."
 THIRD_BALKAN_WAR.133.d:0 "Dans un développement majeur, l'armée turque a officiellement confié l'administration du nord de la Syrie à une nouvelle République de Syrie. De nombreux nationalistes syriens, notamment ceux fuyant le territoire de la République arabe unie, se rassemblent pour rejoindre le nouveau régime. Plusieurs nationalistes servant dans l'armée de la RAU auraient également fait défection. La Turquie s'est engagée à soutenir le nouveau régime alors que ses dirigeants appelaient à la libération de la Syrie de l'occupation de la RAU. Les diplomates étrangers considèrent le nouvel État comme un tampon turc et sa propagande nationaliste comme une menace puissante pour l'idéologie panarabe de la RAU. Le Caire a condamné cette évolution, affirmant que le nouveau régime est une marionnette de l'impérialisme turc et de ceux qui le rejoignent en tant qu'ennemis du peuple arabe. Des troubles ont été signalés à Damas."
 THIRD_BALKAN_WAR.134.d:0 "Le récent conflit avec la Turquie et sa mainmise sur notre territoire ont mis en évidence les limites de notre alliance avec l'OTAN. L'OTAN a eu amplement l'occasion de nous aider dans notre moment de crise, mais elle a choisi de ne pas le faire. Le soutien que nous avons reçu s'est avéré inefficace. De nombreuses personnes dans le pays, notamment dans les médias, considèrent l'OTAN comme une alliance qui exige beaucoup mais offre peu en retour. Ils se demandent également, compte tenu de la récente guerre, que les inquiétudes concernant le communisme soient en réalité exagérées. Les partisans de l'OTAN admettent que les récentes actions ont été décevantes, mais dans l'ensemble, l'alliance offre de nombreux avantages et protections à la Turquie. Le cabinet se réunira pour discuter du futur statut de la Grèce au sein de l'OTAN."
 THIRD_BALKAN_WAR.135.d:0 "Le gouvernement grec a annoncé qu'il se retirerait officiellement de l'OTAN. Les dirigeants grecs ont ensuite publié une déclaration soulignant le sentiment de trahison ressenti par tous les Grecs alors que l'alliance n'avait pas rempli ses obligations fondamentales. Les objectifs de l'OTAN ne sont plus compatibles avec les intérêts de la Grèce. De nombreux analystes pensent que la Grèce cherchera à forger une nouvelle politique étrangère, moins centrée sur le monde. Elle recherchera des partenariats lui permettant d'étendre ses capacités au cas où elle serait confrontée à un nouvel affrontement avec la Turquie. De nombreux Grecs estiment désormais que l'OTAN joue le rôle de favori et qu'elle ne s'engage pas véritablement à protéger la démocratie en Europe."
 THIRD_BALKAN_WAR.136.d:0 "La Yougoslavie a cherché à se joindre à la croisade grecque contre nous et a été anéantie par nos courageux soldats. Nous occupons leurs terres et pouvons dicter la paix. Beaucoup de nos hauts responsables conviennent que si nous essayons de nous étendre territorialement ou d'imposer des conditions trop dures, nous ne ferons qu'accroître le nombre de nos ennemis. Au lieu de cela, ils proposent que nous imposions des indemnités de guerre et une frontière démilitarisée. Cela nous aidera à nous concentrer sur la garantie de nos gains en Grèce sans menace du nord. Cependant, certains soutiennent que nous devrions donner l'indépendance à la Macédoine et faire en sorte qu'elle fasse office de zone tampon. Une décision doit être prise."
 THIRD_BALKAN_WAR.137.d:0 "Le gouvernement turc a annoncé avoir conclu un accord sur la fin des hostilités avec la Yougoslavie. Elle retirerait ses forces à condition que la Yougoslavie démilitarise sa frontière avec la Turquie et verse des indemnités de guerre. Le gouvernement yougoslave a discrètement confirmé ces conditions. Étant donné que son armée a subi de lourdes pertes lors du conflit, les conditions n'étaient pas aussi dures que certains l'espéraient. De nombreux experts estiment que le gouvernement turc cherchait à minimiser le risque de rapprochement de la Yougoslavie et de la Grèce par désir de vengeance. La Turquie semble prête à devenir la puissance régionale établie dans un avenir prévisible."
 THIRD_BALKAN_WAR.138.d:0 "Le gouvernement turc a annoncé la création de la République de Macédoine. Dans un communiqué, il a noté que le peuple macédonien réclamait depuis longtemps son indépendance de la domination yougoslave et que la Turquie l'avait obtenue. Le gouvernement yougoslave a protesté mais n'est pas allé jusqu'à menacer d'une réponse militaire. Compte tenu de la défaite militaire subie par la Yougoslavie, elle ne sera probablement pas en mesure de réagir avant un certain temps. La création de la Macédoine fait de la Turquie une puissance établie dans la région."
 THIRD_BALKAN_WAR.139.d:0 "Le régime albanais corrompu a cherché à se joindre à la Grèce contre nous mais a été brisé par nos courageux soldats. Nous occupons leurs terres et pouvons dicter la paix. Les peuples turc et albanais entretiennent depuis longtemps des liens historiques profonds. Nos forces en Albanie rapportent que la population est bouleversée et craintive à l'égard du gouvernement. Nos propres analystes soulignent que le régime est illégitime et cruel. Avec notre victoire sur la Grèce et notre présence accrue dans la région, la meilleure décision est de remplacer le régime albanais. Nous apporterons au peuple albanais notre protection et notre soutien dans la construction d'une nouvelle nation. Les ordres devraient être émis prochainement."
 THIRD_BALKAN_WAR.140.d:0 "Au cours d'une opération passionnante du jour au lendemain, les forces turques, en collaboration avec leurs alliés albanais, ont destitué le gouvernement. Un nouveau gouvernement a annoncé sa création dans la matinée. Dans un communiqué, le gouvernement turc a félicité le peuple albanais pour avoir repris le contrôle de sa nation. La mise en place d'un nouveau régime pro-turc à Tirana a considérablement renforcé la puissance turque dans les Balkans. Au cours de la récente guerre gréco-turque, l'Albanie a subi une défaite majeure et son gouvernement n'a pas pu résister à la prise de pouvoir soutenue par la Turquie. Les observateurs notent que l'action turque a contribué à consolider sa position dans la région."
 
 THIRD_BALKAN_WAR.141.d:0 "La crise de l'Enosis a commencé à la suite de l'effondrement de la constitution chypriote internationalement reconnue. Le nouveau régime a déclaré l'Enosis ou l'unification avec la Grèce. L'armée turque présente sur l'île s'est emparée de la partie nord de l'île, affirmant qu'elle protège les Chypriotes turcs de l'oppression. Cela place notre alliée de l'OTAN, la Turquie, dans une trajectoire de collision avec la Grèce, alliée soviétique. De hauts responsables militaires estiment que nous devrions dire aux Américains que nous soutenons la Turquie et sa juste cause visant à protéger les intérêts de tous les Chypriotes. D'autres responsables estiment que notre propre expérience a montré que Chypre ne peut pas être apprivoisée et ne mérite pas une guerre mondiale. Nous devons décider de notre position sur cette question et en informer les États-Unis."
 THIRD_BALKAN_WAR.142.d:0 "L'ambassadeur britannique a récemment rencontré le président pour discuter de la crise de l'Enosis à Chypre. Il a noté que le Royaume-Uni avait une vaste expérience de l'île et a conclu que l'action turque, bien que menée à la hâte, était justifiée. Si le régime communiste grec n'était pas défié, il pourrait encourager des complots communistes similaires dans la région et le long des frontières d'autres États de l'OTAN. Un échec à soutenir la Turquie pourrait également être considéré non seulement comme un apaisement, mais aussi comme une trahison d'un allié. L'ambassadeur a ajouté que le Royaume-Uni garderait son opinion privée pour le moment et suivrait notre exemple sur la question."
 THIRD_BALKAN_WAR.143.d:0 "L'ambassadeur britannique a récemment rencontré le président pour discuter de la crise de l'Enosis à Chypre. Il a noté que le Royaume-Uni avait une vaste expérience de l'île et a conclu que l'action turque était imprudente. Le Royaume-Uni recommande à notre gouvernement de pousser la Turquie à se retirer et de ne pas la laisser entraîner l'OTAN dans une guerre mondiale contre Chypre. Bien que beaucoup puissent considérer l'échec du soutien à la Turquie comme une cession aux exigences communistes, ce n'est pas le cas. L'ambassadeur a ajouté que le Royaume-Uni garderait son opinion privée pour le moment et suivrait notre exemple sur la question."
 THIRD_BALKAN_WAR.144.d:0 "Dans une réaction instinctive, les forces turques ont occupé le nord de Chypre. Cela a provoqué une crise internationale majeure dans la mesure où cela place la Turquie, notre alliée de l'OTAN, dans une position hostile à l'égard de la Grèce, alliée soviétique. La Turquie estime, à juste titre, que les machinations grecques sont à l'origine de l'effondrement de la constitution chypriote. Cependant, soutenir l'action turque pourrait entraîner un conflit avec l'Union soviétique. Un tel conflit serait désastreux pour la Turquie, car elle se retrouverait dans une guerre sur deux fronts. En conséquence, certains responsables affirment que nous devrions menacer la Turquie d'être expulsée de l'OTAN si elle ne se retire pas. D'autres responsables estiment que ne pas soutenir la Turquie relève de la complaisance et que nous devons rester attachés à notre allié. Le Royaume-Uni, qui contrôlait de vastes"
 THIRD_BALKAN_WAR.145.d:0 "Les États-Unis ont récemment envoyé une délégation de haut niveau à Ankara pour une discussion d'une journée sur Chypre. À huis clos, les Américains ont déclaré sans équivoque qu'ils attendaient de nous que nous nous retirions de Chypre et que nous désamorcions la crise. Les Américains affirment que nous avons unilatéralement aggravé la situation et que le monde court désormais le risque d'une guerre mondiale. Ils ont ajouté qu'un tel conflit nous placerait dans une guerre sur deux fronts, avec les Soviétiques attaquant depuis l'est. Il est clair que si la situation à Chypre s'aggrave, les États-Unis nous expulseront de l'OTAN et nous laisseront face à une invasion communiste écrasante. De nombreux membres du cabinet sont désormais favorables à un retrait. Les Américains ont déclaré qu'ils soutiendraient un futur accord concernant la protection des Chypriotes turcs. Cependant, certains responsables estiment que les États-Unis bluffent et ne peuvent politiquement permettre une victoire communiste majeure. Nous devons décider comment procéder."
 THIRD_BALKAN_WAR.146.d:0 "Les journalistes étrangers et les forces grecques présentes à Chypre ont confirmé le retrait des troupes turques du nord de Chypre. Le gouvernement turc n'a pas confirmé la nouvelle. De nombreux observateurs associent ce retrait à la récente visite à Ankara d'une délégation américaine de haut niveau. Il semble que les États-Unis et l'OTAN n'étaient pas intéressés à soutenir la décision turque de s'emparer de la partie nord de l'île. Le gouvernement grec a publié une déclaration promettant que tous les citoyens de Chypre, quelle que soit leur identité, bénéficieraient de la prospérité et de la protection sous la révolution."
 THIRD_BALKAN_WAR.147.d:0 "Suite à notre avertissement à la Turquie concernant la poursuite de l'escalade de la crise à Chypre, son gouvernement a envoyé un message indiquant qu'il ne retirerait pas ses forces. La Turquie prétend que si ses forces se retirent, elles condamneront les Turcs chypriotes à l'anéantissement. Il a ajouté que la Turquie ne chercherait pas à s'emparer de l'île ni à déclencher un conflit armé, mais qu'elle ne pouvait pas se retirer. Nous nous retrouvons désormais face à un choix difficile : nous pouvons tenir notre promesse et convoquer une réunion d'urgence de l'OTAN pour expulser la Turquie. Ou nous pouvons attendre de voir comment cela se déroulera, peut-être ouvrir un dialogue avec les Soviétiques sur la désescalade de la situation. Abandonner la Turquie à ce stade pourrait entraîner un revers diplomatique majeur et ouvrir la porte à une invasion communiste de la Turquie."
 THIRD_BALKAN_WAR.148.d:0 "Lors d'une étonnante réunion d'urgence, l'OTAN a voté l'exclusion de la Turquie de l'organisation. La Turquie a été accusée d'avoir dangereusement poussé l'alliance dans un conflit mondial pour satisfaire ses propres intérêts. La Turquie n'a pas tardé à accuser l'organisation d'hypocrisie, soulignant qu'elle était trahie par ses soi-disant alliés. Des manifestations auraient eu lieu devant les ambassades des membres de l'OTAN à Ankara. Le gouvernement turc exigerait également un déclassement immédiat des missions diplomatiques de l'OTAN sur son territoire. Le vote s'est révélé controversé et des rumeurs courent que certains membres de l'OTAN se demandent si la décision a rendu l'alliance impuissante."
 THIRD_BALKAN_WAR.149.d:0 "Par le biais de canaux privés, les Américains ont tendu la main. Ils sont de plus en plus préoccupés par la crise actuelle à Chypre. Ils estiment, comme beaucoup de nos responsables, qu'il serait désastreux qu'un conflit avec la Grèce ou la Turquie se transforme en un conflit mondial. Les Américains proposent de faire pression sur la Grèce et la Turquie pour qu'elles acceptent une partition de l'île, avec la promesse de résoudre éventuellement le conflit par des discussions bilatérales. Il est clair que les discussions dans les médias occidentaux selon lesquelles les États-Unis ne soutiendront pas la Turquie dans le conflit sont fausses. Nos diplomates ont confirmé que les Américains resteront attachés à la Turquie, mais qu'ils chercheront à désamorcer la crise."
 THIRD_BALKAN_WAR.150.d:0 "Dans un geste surprenant, les États-Unis et l'Union soviétique ont publié une déclaration commune affirmant que la crise à Chypre serait bientôt résolue. Ni le gouvernement grec ni le gouvernement turc n'ont indiqué qu'un tel plan était en préparation, ce qui a donné lieu à des rumeurs selon lesquelles les deux grandes puissances seraient parvenues à un accord sans eux. Certains responsables des deux pays ont confirmé en privé qu'ils n'avaient été informés du plan que quelques heures avant sa publication et qu'ils avaient été poussés à l'accepter. Les détails du plan prévoient une partition de Chypre, la Turquie occupant les quartiers turcs et la Grèce le reste de l'île. La Grèce et la Turquie ont également convenu de parvenir à terme à une résolution bilatérale pour régler définitivement la question."
 THIRD_BALKAN_WAR.151.d:0 "Après d'intenses négociations, négociées par les États-Unis et l'Union soviétique, la crise chypriote semble avoir été résolue. La Turquie prendra le contrôle du nord de Chypre pour superviser la communauté turque de l'île. Le reste de l'île sera contrôlé par la Grèce. Les deux parties ont convenu de résoudre le problème par le biais de discussions bilatérales. Les nationalistes des deux pays seraient furieux, nombre d'entre eux pensant que les pressions étrangères ont forcé une résolution. Quoi qu'il en soit, les deux pays réduisent leurs niveaux d'alerte militaire. Les forces turques et grecques présentes sur l'île établissent une frontière de travail."
 THIRD_BALKAN_WAR.152.d:0 "Lors d'une réunion d'urgence entre les dirigeants gouvernementaux et militaires, des discussions ont eu lieu sur l'opportunité de demander à l'Union soviétique la permission de lancer un ultimatum contre la Turquie. La récente décision de l'OTAN d'expulser la Turquie les a isolés. De nombreux hauts responsables militaires estiment que la situation actuelle nous offre la possibilité de remporter une victoire décisive. Le seul inconvénient est que si les Soviétiques refusent de nous soutenir, nous serons incapables de faire pression en faveur d'une résolution militaire à Chypre. En fin de compte, le gouvernement doit décider quelles mesures prendre."
 THIRD_BALKAN_WAR.153.d:0 "Le gouvernement grec souhaite notre accord pour lui permettre de lancer un ultimatum contre la Turquie. Ils veulent que la Turquie retire ses forces de Chypre ou qu'elle soit expulsée de force. La Grèce a souligné que l'OTAN avait récemment expulsé la Turquie en raison de ses actions à Chypre. Ils notent que cela pourrait être la meilleure opportunité d'en profiter. De nombreux hauts responsables sont d'accord avec cette évaluation, mais certains estiment que nous devrions rejeter la demande grecque. Au lieu de cela, ils pensent que nous pourrions profiter de cette opportunité pour persuader la Turquie d'établir des liens étroits avec nous. Faire entrer la Turquie dans notre sphère sécuriserait complètement notre front sud. Un refus pourrait également rendre furieux le gouvernement grec. Une décision doit être prise prochainement."
 THIRD_BALKAN_WAR.154.d:0 "Le gouvernement soviétique a refusé notre demande de lancer un ultimatum à la Turquie pour son ingérence flagrante à Chypre. C'est une nouvelle très décevante car nous sentions fortement que la situation était largement en notre faveur. Nos meilleurs experts en défense craignent que si nous n'agissons pas maintenant, nous pourrions donner à la Turquie le temps dont elle a besoin pour se préparer à toute action. Les Soviétiques ont seulement déclaré que le moment n'était pas propice à une quelconque action. Notre ambassadeur à Moscou estime que plusieurs facteurs influencent la décision soviétique. Certains membres de leur gouvernement estiment qu'un conflit avec la Turquie pourrait conduire à une guerre plus large avec l'Occident. On a également le sentiment que la Turquie pourrait être un site potentiel d'activité révolutionnaire à l'avenir. Quoi qu'il en soit, nous devons suivre leur décision et lui faire confiance."
 THIRD_BALKAN_WAR.1540.d:0 "Le régime communiste grec a récemment lancé un ultimatum nous appelant à retirer nos forces de Chypre. Cela mettrait en danger la population turque chypriote locale et aliénerait notre peuple. Cependant, il est clair que l'Union soviétique envisage d'aider la Grèce, d'autant plus que l'OTAN ne nous soutiendra pas et que nous sommes isolés au niveau international. Il existe de sérieuses inquiétudes quant à la durée pendant laquelle nous pourrons contenir une attaque communiste majeure. De nombreux hauts responsables exhortent le gouvernement à se retirer de Chypre, à éviter la guerre et à attendre un moment meilleur pour soutenir nos frères à Chypre. La décision appartient au gouvernement quant à la manière de procéder."
 THIRD_BALKAN_WAR.155.d:0 "Le gouvernement turc a annoncé qu'il retirerait ses soldats de Chypre. Il a affirmé que cette décision n'était pas due à l'ultimatum grec mais au fait que le gouvernement turc souhaitait d'abord épuiser toutes les options pacifiques. Il semble que l'intervention probable de l'Union soviétique en cas de conflit ait poussé le gouvernement turc à se retirer et à éviter le conflit. De nombreux Turcs chypriotes éminents partiraient avec les forces turques, craignant d'être persécutés ou arrêtés par le gouvernement grec. De sombres rassemblements ont eu lieu dans tout le pays en solidarité avec les Turcs chypriotes."
 THIRD_BALKAN_WAR.156.d:0 "À la demande de hauts commandants militaires, le Premier ministre a tenu une réunion à huis clos. Par la suite, rapporte le sida, le Premier ministre semble ensuite ébranlé. Le lendemain matin, il a convoqué une réunion du cabinet et a informé le gouvernement que la Turquie retirerait immédiatement ses forces de Chypre. Il s'agit d'un revirement politique complet qui mettra effectivement fin à la crise chypriote en faveur de la Grèce. Des rumeurs circulent selon lesquelles les généraux, craignant la menace existentielle que représente une probable intervention soviétique aux côtés de la Grèce, auraient menacé de retirer le pouvoir au gouvernement à moins qu'ils ne changent de cap. Si les rumeurs sont vraies, c'est véritablement un jour sombre pour les Turcs chypriotes et pour la démocratie en Turquie."
 THIRD_BALKAN_WAR.157.d:0 "Lors d'une réunion d'urgence entre les dirigeants gouvernementaux et militaires, des discussions ont eu lieu sur l'opportunité de demander à l'Union soviétique la permission de lancer un ultimatum contre la Turquie. De nombreux hauts responsables militaires estiment que la situation actuelle nous offre la possibilité de remporter une victoire décisive. Cependant, cela pourrait amener l'OTAN à intervenir. Certains en Union soviétique seraient certainement heureux d'avoir l'opportunité d'affronter l'OTAN et les États-Unis. Le seul inconvénient est que si les Soviétiques refusent de nous soutenir, nous serons incapables de faire pression en faveur d'une résolution militaire à Chypre. En fin de compte, le gouvernement doit décider quelles mesures prendre"
 THIRD_BALKAN_WAR.158.d:0 "Le gouvernement grec souhaite notre accord pour lui permettre de lancer un ultimatum contre la Turquie. Ils veulent que la Turquie retire ses forces de Chypre ou qu'elle soit expulsée de force. La Grèce a souligné que l'ultimatum pourrait entraîner une intervention de l'OTAN, mais elle est prête à nous soutenir jusqu'au bout. Ils notent que cela pourrait être la meilleure opportunité d'affronter l'Occident. De nombreux hauts responsables sont d'accord avec cette évaluation, mais certains estiment que nous devrions rejeter la demande grecque. Pour ces responsables, risquer un conflit total avec l'OTAN pour satisfaire les revendications territoriales grecques n'en vaut pas la peine. Une décision doit être prise prochainement."
 THIRD_BALKAN_WAR.159.d:0 "Le régime communiste grec a récemment lancé un ultimatum à la Turquie. Ils demandent que la Turquie se retire de Chypre sous peine d'être expulsée de force. La Turquie est un allié de l'OTAN et nous sommes obligés de la défendre selon une défense collective. Cependant, un tel conflit risque de s'intensifier et d'inclure l'Union soviétique. Nous avons récemment tenu une réunion d'urgence du Conseil de sécurité nationale. Certains chefs militaires estiment que nous devons nous tenir fermement aux côtés de la Turquie et résister à la menace communiste en Europe de l'Est. D'autres responsables ont exprimé de graves inquiétudes face à un tel conflit. Ils suggèrent plutôt que nous tendions la main à l'Union soviétique et que nous insistions pour une résolution pacifique. Une décision doit être prise."
 THIRD_BALKAN_WAR.160.d:0 "Suite à l'échec des négociations et à l'expiration d'un ultimatum de la Grèce, les forces turques et grecques se battraient à Chypre et le long de leur frontière internationale. La Grèce, membre du Pacte de Varsovie, et la Turquie, membre de l'OTAN, ont également impliqué leurs alliances respectives dans le conflit. L'Union soviétique a publié une déclaration affirmant que ses forces interviendraient pour le bien de la paix internationale. Les États-Unis ont déclaré qu'ils apporteraient tout leur soutien pour protéger le peuple turc de la menace du communisme international. La nouvelle des combats envoie une onde de choc à travers le monde, car on s'inquiète des conséquences d'une nouvelle escalade du conflit."
 THIRD_BALKAN_WAR.161.d:0 "Nos forces et nos courageux alliés ont remporté une victoire écrasante sur l'OTAN en Turquie. Les ennemis du prolétariat furent, à juste titre, vaincus. Une fois de plus, nous avons démontré que les pions impérialistes ne peuvent pas arrêter la volonté du peuple. Le gouvernement grec souhaite s'emparer de vastes pans de la Turquie afin de restaurer le territoire historique de la Grèce. Nos propres responsables estiment que nous devrions prendre l'est de la Turquie, y compris Kars, pour garantir la sécurité de notre flanc sud. Cependant, certains pensent que de telles revendications territoriales ne peuvent qu'engendrer des problèmes à long terme et des opportunités que nos ennemis pourront exploiter à l'avenir. Ils proposent plutôt des revendications territoriales plus modestes pour affaiblir définitivement la Turquie et éviter de futurs problèmes. Nous devons décider quelle approche adopter."
 THIRD_BALKAN_WAR.162.d:0 "L'Union soviétique et ses alliés ont révélé qu'ils souhaitaient revendiquer de vastes territoires sur la Turquie. Les Soviétiques et les Grecs cherchent à mettre en oeuvre les revendications territoriales que la Grèce a faites sur la Turquie après la Première Guerre mondiale. En outre, les Soviétiques veulent prendre Kars et ses environs pour servir de tampon. Compte tenu de la situation militaire actuelle, nous ne pouvons pas faire grand-chose pour mettre un terme à cette perte de territoire. La plus grande préoccupation concerne la réaction de la Turquie. Ce revers pourrait les amener à réévaluer leurs relations avec l'OTAN, à moins que nous puissions leur offrir un soutien. Les principaux journaux critiquent vivement nos efforts dans le récent conflit."
 THIRD_BALKAN_WAR.163.d:0 "L'Union soviétique et ses alliés ont révélé qu'ils souhaitaient revendiquer de vastes territoires sur la Turquie. Il semble que les Soviétiques et la Grèce cherchent à limiter leurs revendications territoriales à Edrine, Istanbul et Kars. La perte de ce territoire affaiblirait la Turquie et fournirait un tampon aux Soviétiques. La plus grande préoccupation concerne la réaction de la Turquie. Ce revers pourrait les amener à réévaluer leurs relations avec l'OTAN, à moins que nous puissions leur offrir un soutien. Les principaux journaux critiquent vivement nos efforts dans le récent conflit."
 THIRD_BALKAN_WAR.164.d:0 "Notre nation a subi une défaite massive lors du récent conflit avec le Pacte de Varsovie. Notre alliance OTAN n'a pas offert la protection et le soutien que nous attendions. De nombreuses personnes dans le pays sont amèrement déçues et craignent que les revendications territoriales ne paralysent notre nation et ne divisent le peuple turc. Certains responsables estiment que nous devrions nous adresser nous-mêmes aux Soviétiques. Nous pouvons proposer certaines concessions territoriales, comme abandonner Chypre et céder Kars aux Soviétiques pour satisfaire leurs préoccupations en matière de sécurité. Plus important encore, nous nous engagerons également à nous retirer de l'OTAN et à maintenir notre neutralité. Cela apaiserait les inquiétudes soviétiques et affaiblirait considérablement l'OTAN. Cependant, certains responsables estiment que cette proposition, même si elle sauve du territoire, nous exposerait à une agression future."
 THIRD_BALKAN_WAR.165.d:0 "Le gouvernement turc nous a récemment envoyé une proposition de paix privée. Ils ont sans aucun doute peur des terres qu'ils perdront dans toute proposition de paix en raison de leur association insensée avec l'OTAN. La proposition turque nous offre des territoires à l'Est et cède définitivement Chypre à la Grèce. Plus intriguant encore, la Turquie promet de se retirer de l'OTAN et de maintenir une stricte neutralité. Beaucoup de nos responsables estiment que cette proposition pourrait éliminer l'OTAN en tant que menace de la Méditerranée orientale et porter un coup majeur aux États-Unis. Cependant, d'autres au sein du gouvernement estiment que nous avons remporté une victoire si importante que nous ne devrions pas manquer cette occasion d'étendre notre influence."
 THIRD_BALKAN_WAR.166.d:0 "Dans un développement choquant, l'Union soviétique a annoncé qu'elle avait conclu un accord avec la Turquie pour mettre fin au conflit OTAN-Pacte de Varsovie à propos de Chypre. La Turquie a accepté d'abandonner complètement tout territoire ou revendication sur Chypre. Cela permettra également une occupation soviétique de Kars et de ses environs pour garantir la paix. Plus important encore, la Turquie se retirera de l'OTAN, annulera tout accord avec l'alliance et maintiendra une stricte neutralité. Les États-Unis ont exprimé leur déception face à cette nouvelle, tandis que de nombreux Turcs félicitent le gouvernement turc pour avoir sauvé des millions de ses citoyens de l'occupation étrangère. Cependant, de nombreux observateurs notent que la Turquie n'a peut-être fait que retarder une future agression."
 THIRD_BALKAN_WAR.167.d:0 "Athènes et Moscou ont confirmé que le Pacte de Varsovie s'emparerait de vastes territoires turcs. Le gouvernement grec a indiqué avoir restauré les terres historiques de la Grèce, y compris Constantinople. Les Soviétiques seraient en train d'établir une garnison à Kars, où leurs forces établiraient une zone tampon dans l'est de la Turquie. Compte tenu de l'ampleur de la défaite de la Turquie et de l'OTAN pendant le conflit, leurs diplomates se sont contentés d'émettre des protestations contre l'expansion communiste. Le gouvernement turc a jusqu'à présent refusé de commenter la situation, même si des sources à Ankara indiquent qu'il existe un véritable sentiment de désespoir parmi les dirigeants politiques et militaires. Malgré les gains territoriaux, certains analystes avertissent que la Grèce et l'Union soviétique doivent trouver un moyen de gérer une importante population turque résistante à leur domination."
 THIRD_BALKAN_WAR.168.d:0 "L'Union soviétique, parlant au nom de ses alliés du Pacte de Varsovie, a annoncé que son allié la Grèce reprendrait toutes les terres européennes détenues par la Turquie, y compris Constantinople. Elle a également confirmé que ses forces occuperaient une zone tampon dans l'est de la Turquie, centrée autour de Kars. La perte d'Istanbul et de Kars affaiblira la Turquie économiquement, culturellement et géographiquement, mais le territoire perdu n'est pas aussi important que certains le pensaient. Les experts suggèrent que les Soviétiques ne croient pas que la Grèce puisse absorber tous les territoires qu'elle réclamait. Le gouvernement grec a annoncé une fête nationale pour célébrer la victoire de sa révolution sur les impérialistes. Le gouvernement turc à Ankara se préparerait à l'afflux de réfugiés."
 THIRD_BALKAN_WAR.169.d:0 "Le récent conflit avec la Grèce et ses alliés communistes s'est avéré un désastre. Nos alliés de l'OTAN n'ont pas réussi à nous soutenir adéquatement sur le terrain, ce qui a entraîné une défaite militaire. Aujourd'hui, des millions de Turcs sont sous régime communiste et notre nation se trouve dans la situation la plus vulnérable. À la Grande Assemblée nationale, un nombre croissant de dirigeants politiques réclament à grands cris notre retrait de l'OTAN. Ils estiment que l'alliance a échoué et qu'une nouvelle série de combats pourrait entraîner la fin de la république. Peut-être ont-ils raison, et nous devrions quitter l'alliance et tracer une nouvelle voie. De nombreux hauts responsables de la sécurité s'y opposent, soulignant que sans la protection de l'OTAN, les communistes pourraient bien finir le travail. Au lieu de cela, ils disent que nous devons d'abord nous adresser aux États-Unis et leur demander de l'aide. Si les Américains refusent de nous aider à reconstruire, nous n'aurons d'autre choix que de quitter l'OTAN."
 THIRD_BALKAN_WAR.170.d:0 "La Turquie s'est officiellement retirée de l'alliance de l'OTAN. Ses dirigeants ont évoqué la nécessité pour la Turquie de se reconstruire et son incapacité à remplir ses obligations économiques ou militaires envers l'alliance. En Turquie, la nouvelle rencontre un large soutien, car de nombreux Turcs accusent l'alliance d'avoir trahi la Turquie et de ne pas lui avoir apporté suffisamment de soutien lors de son récent conflit avec la Grèce communiste et ses alliés. L'OTAN a publié sa propre déclaration exprimant sa déception face à cette décision. Dans une déclaration succincte, le ministère turc des Affaires étrangères a annoncé qu'il s'attendait à ce que tout le personnel de l'OTAN se retire immédiatement du pays et qu'il réviserait le niveau des missions diplomatiques de l'OTAN dans le pays."
 THIRD_BALKAN_WAR.171.d:0 "Nous avons reçu un message de notre ambassade à Ankara selon lequel le gouvernement turc sollicite une aide importante de notre part. La Turquie a beaucoup souffert du récent conflit entre l'OTAN et le Pacte de Varsovie et nombreux sont ceux qui, en Turquie, reprochent aux États-Unis de ne pas avoir empêché leur défaite. Les responsables de l'ambassade estiment que la Turquie ne demande pas publiquement cette aide, car cela attiserait le sentiment anti-américain. Au lieu de cela, ils estiment qu'une offre américaine calmerait les tensions et rétablirait la confiance dans l'OTAN. Un refus d'offrir un soutien majeur conduira probablement la Turquie à quitter l'OTAN. De nombreux conseillers sont favorables à l'offre d'un programme d'aide, mais certains pensent que la situation actuelle de la Turquie constitue un handicap et que la laisser quitter l'OTAN pourrait être dans notre intérêt."
 THIRD_BALKAN_WAR.172.d:0 "Les États-Unis ont annoncé qu'ils offriraient une aide massive pour aider à reconstruire l'armée et l'économie turques. Le gouvernement américain a déclaré que son soutien visait à donner un coup de main à un ami précieux des États-Unis. L'annonce a été saluée par la Turquie. La récente campagne anti-OTAN au sein du parlement turc a largement perdu de son élan suite à l'annonce du programme d'aide. Un gouvernement turc plus provocant a publié une autre déclaration affirmant qu'il n'oublierait jamais son peuple derrière le rideau de fer. L'Union soviétique a critiqué les États-Unis pour avoir tenté de militariser davantage la région."
 THIRD_BALKAN_WAR.173.d:0 "Les forces de l'OTAN et du Pacte de Varsovie ont mis fin aux combats liés à la crise gréco-turque à Chypre. Aucune des deux parties n'a pu vaincre l'autre de manière décisive, même si certains territoires ont été échangés. Depuis Genève, les représentants des États-Unis et de l'Union soviétique ont annoncé un accord pour retirer leurs forces vers les frontières d'avant-guerre. Les deux camps seront déçus du résultat. Le gouvernement soviétique a publié une déclaration affirmant que les combats étaient un succès alors que les efforts impérialistes visant à démanteler la révolution avaient complètement échoué. Les États-Unis ont noté que l'OTAN soutenait fermement son allié et empêchait une poussée communiste visant à détruire par la force la démocratie en Turquie."
 THIRD_BALKAN_WAR.174.d:0 "Avec l'aide de nos alliés de l'OTAN, nous avons non seulement mis fin à l'agression communiste contre la Turquie, mais nous avons également capturé de vastes pans du territoire grec. Le gouvernement turc est catégorique : il veut contrôler le nord de la Grèce et ses îles afin de couper fermement la Grèce de ses alliés communistes. Nos experts craignent que la Turquie ait des difficultés à contrôler une telle superficie de territoire, ce qui pourrait interférer avec ses obligations au sein de l'OTAN. Au lieu de cela, il existe une proposition alternative selon laquelle la Turquie occuperait Rhodes, Kavala, y compris ses environs, et Chypre. Celles-ci sont plus gérables et affaibliraient considérablement la position stratégique de la Grèce dans un conflit futur. Une proposition visant à transformer le nord de la Grèce en un régime grec anticommuniste n'est actuellement pas considérée comme viable par les autorités turques."
 THIRD_BALKAN_WAR.175.d:0 "Les impérialistes n'ont surpris personne en dévoilant leur infâme complot visant à démanteler notre allié révolutionnaire, la Grèce. L'OTAN a annoncé son intention d'occuper le nord de la Grèce et d'autres terres stratégiques pour « assurer la paix dans la région ». En réalité, ils coupent la Grèce de nous et renforcent leur position stratégique dans la région. Le peuple grec et le monde entier seront bouleversés par cette nouvelle, mais nous sommes malheureusement incapables de changer la situation en raison de la situation militaire sur le terrain. Malgré ce revers, nous n'oublierons pas cette humiliation."
 THIRD_BALKAN_WAR.176.d:0 "Les impérialistes n'ont surpris personne en dévoilant leur infâme complot visant à neutraliser notre allié révolutionnaire, la Grèce. L'OTAN livrera Chypre, Rhodes et Kavala à l'occupation militaire turque. Ils prétendent que cela vise à garantir le maintien de la paix dans la région, mais il s'agit clairement d'une mesure destinée à affaiblir la position stratégique de la Grèce et à permettre une future invasion. La communauté internationale comprendra sans aucun doute la véritable nature de cette décision. En raison de la situation militaire, nos options se limitent à simplement déclarer notre opposition à la proposition."
 THIRD_BALKAN_WAR.177.d:0 "Les nouvelles d'une réunion d'urgence de l'OTAN à Ankara ont confirmé que la Turquie sera l'autorité occupante des îles et des provinces du nord de la Grèce capturées pendant la guerre. L'OTAN insiste sur le fait que l'occupation ne constitue pas une expansion territoriale, mais simplement un moyen de garantir qu'il n'y aura plus de conflits dans la région. L'Union soviétique et le gouvernement grec ont rapidement condamné cette décision, la qualifiant de punitive et destinée à infliger la punition maximale au peuple grec. Les analystes notent que détenir autant de territoire pourrait constituer un défi pour la Turquie, mais cela coupe essentiellement la Grèce des Balkans et de l'Union soviétique."
 THIRD_BALKAN_WAR.178.d:0 "Les nouvelles d'une réunion d'urgence de l'OTAN à Ankara ont confirmé que la Turquie sera l'autorité occupante de Rhodes, de Chypre et de Kavala. L'alliance prétend qu'elle occupe ces emplacements stratégiques uniquement pour empêcher une nouvelle agression communiste de la part de la Grèce et défendre ses intérêts. Cette décision met fin au récent conflit OTAN-Pacte de Varsovie à propos de Chypre, qui s'est soldé par une victoire majeure pour la Turquie et ses alliés de l'OTAN. La Grèce et l'Union soviétique ont condamné l'occupation comme préambule à une reprise du conflit à l'avenir."
 THIRD_BALKAN_WAR.179.d:0 "Le récent conflit avec l'OTAN s'est soldé par un désastre. Nous trouvons désormais des travailleurs grecs sous occupation étrangère et notre économie est en pleine tourmente. L'armée doit également reconstruire ses capacités, car il serait insensé de supposer que les capitalistes ne frapperont plus. Il existe un sentiment antisoviétique croissant, même au sein du parti, mais nous faisons de notre mieux pour le réprimer. Compte tenu de notre situation, nous enverrons une délégation de haut niveau pour demander de l'aide à nos camarades soviétiques dans cette période des plus difficiles."
 THIRD_BALKAN_WAR.180.d:0 "Une délégation de haut niveau est arrivée à Moscou pour demander notre aide afin de leur apporter une aide économique et militaire. Les Grecs nous préviennent qu'un échec à soutenir le régime pourrait donner du pouvoir aux contre-révolutionnaires et leur ouvrir un espace. Il s'agit d'un argument convaincant, et nos propres analystes confirment que ces craintes sont fondées. On rapporte même que des agents capitalistes attisent les flammes du mécontentement. Il existe donc un fort soutien en faveur d'une aide à la Grèce. Cependant, une autre faction du gouvernement souligne que nous avons également beaucoup souffert du récent conflit. Peut-être devrions-nous expliquer à la Grèce qu'une Union soviétique forte est dans l'intérêt ultime de tous les États socialistes."
 THIRD_BALKAN_WAR.181.d:0 "Notre délégation à Moscou a signé un vaste programme d'aide militaire et économique. Cela renforcera considérablement nos capacités et nos efforts de reconstruction. Cela redonnera également le moral au peuple et au parti. Contrairement au passé, où nous nous sommes alliés aux capitalistes, nos amis socialistes n'abandonneront pas le peuple grec. La Turquie et les États-Unis ont condamné l'accord, le qualifiant de renforcement militaire inutile. Cependant, ils doivent comprendre que quelle que soit la situation, le parti et l'État n'abandonneront jamais leur devoir de libérer tous les Grecs de l'oppression."
 THIRD_BALKAN_WAR.182.d:0 "La République Arabe Unie (RAU) a lancé une invasion de la Turquie, dans l'espoir de s'emparer de la province turque de Hatay, peuplée d'arabes. Ils prétendent se battre pour libérer le pays et soutenir la Grèce, qui partage son point de vue des non-alignés, mais cela n'a aucun sens. Il s'agit d'un acte d'agression et d'une répétition générale de leurs projets d'invasion d'Israël. Une invasion réussie de la RAU pourrait renforcer considérablement ce régime hostile. C'est inacceptable, nous devons faire quelque chose pour affaiblir l'effort de guerre de la RAU. Une option consiste à ordonner la mobilisation et le déploiement de personnel militaire à la frontière de la RAU. La RAU sera sans aucun doute contrainte de maintenir des troupes à notre frontière, affaiblissant ainsi sa capacité à déployer des réserves contre la Turquie. L'autre option est de commencer la mobilisation puis de lancer notre propre attaque dans une semaine. Nous devrions cibler la Syrie et son littoral pour couper les forces de la RAU qui envahissent la Turquie."
 THIRD_BALKAN_WAR.183.d:0 "La guerre gréco-turque en cours s'est à nouveau intensifiée alors que les forces israéliennes lanceraient des opérations contre la République arabe unie (RAU). La RAU a récemment déclaré la guerre à la Turquie, citant son soutien à la Grèce et sa capture de la province turque de Hatay. Le gouvernement israélien a affirmé qu'il devait agir pour sauver sa nation d'un régime anti-israélien de plus en plus agressif au Caire. Les analystes estiment que les Israéliens cibleront probablement les territoires syriens de la RAU pour isoler et couper le flux de fournitures vers les forces de la RAU engagées contre la Turquie."
 THIRD_BALKAN_WAR.184.d:0 "L'invasion de Hatay par la République Arabe Unie a entraîné une escalade majeure dans la guerre gréco-turque sur Chypre. En quelques jours, Israël a rejoint le conflit aux côtés de la Turquie, essayant de mettre fin à ce qu'il considérait comme une agression de la RAU. Ce conflit s'est soldé par une défaite majeure pour la RAU puisque ses forces ont été vaincues en Syrie. À la suite de discussions de haut niveau entre responsables israéliens et turcs à Damas, Israël a accepté de retirer ses forces, tandis que la Turquie supervisait la transition du pouvoir vers un nouveau gouvernement syrien. Les deux parties ont convenu de la nécessité de renverser le régime de la RAU en Syrie. Le gouvernement turc a salué cette décision, affirmant que les Turcs seraient fiers que leur peuple ait aidé à libérer la Syrie du pied du Caire. La RAU a fermement condamné cette décision, mais n'est pas en mesure de l'empêcher."
 THIRD_BALKAN_WAR.185.d:0 "Avec la fin de la guerre gréco-turque, les combats au Moyen-Orient ont également pris fin. Ni la République arabe unie ni Israël n'ont réussi à remporter la victoire. Les combats ne se sont pas révélés concluants et les deux parties ont convenu du retour aux frontières d'avant-guerre. Les deux camps revendiquent la victoire. Israël note que ses forces ont réussi à immobiliser un grand nombre de forces de la RAU du conflit avec la Turquie. La RAU affirme que ses forces ont repoussé toutes les attaques israéliennes et détruit d'énormes quantités de leur équipement. Malgré les grandes vantardises, aucune des deux parties ne gagnera de nouveaux territoires."
 THIRD_BALKAN_WAR.186.d:0 "À la suite d'un cessez-le-feu entre la République arabe unie (RAU) et Israël, la RAU a confirmé qu'elle contrôle Haïfa et ses environs. Le gouvernement israélien a condamné la RAU pour son agression flagrante. Les combats avaient commencé lorsqu'Israël avait attaqué la RAU pour son invasion de la Turquie. Dans le conflit qui a suivi, les forces de la RAU ont réussi à repousser les forces israéliennes. On s'attend à de nombreuses réactions négatives parmi les Israéliens, car de nombreux citoyens sont désormais sous l'occupation d'un État arabe."
 THIRD_BALKAN_WAR.187.d:0 "Des manifestations massives sont organisées partout en Israël par des citoyens enragés qui estiment qu'Haïfa et sa population ont été abandonnées au profit de la République Arabe Unie (RAU). De nombreux Israéliens pensent que les dirigeants civils et militaires ont laissé tomber le peuple et les soldats en raison de leur mauvaise prise de décision. Le gouvernement est également accusé de s'être précipité dans un conflit sans préparation ni objectif clair. Un manifestant acharné a demandé si Haïfa valait la peine d'aider les Turcs. Le gouvernement et l'armée israéliens ont déjà annoncé qu'une enquête approfondie serait menée pour comprendre ce qui s'est passé et comment l'empêcher à l'avenir."
 THIRD_BALKAN_WAR.188.d:0 "Nos courageuses forces armées ont réussi à libérer le nord de la Palestine des sionistes. Nous avons émoussé leurs efforts pour étendre leur occupation et avons réussi à reprendre certaines terres. Il faut maintenant décider de la marche à suivre. La RAU appartient à tous les Arabes, c'est pourquoi beaucoup pensent naturellement que ces terres devraient être intégrées à l'État. Cependant, une telle démarche pourrait susciter des critiques inutiles de la part d'autres États arabes, qui diront que nous annexons des terres. Une autre solution consiste à établir une administration palestinienne, qui pourrait éventuellement rejoindre la RAU une fois fermement en place."
 THIRD_BALKAN_WAR.189.d:0 "Les Arabes du monde entier applaudissent la République Arabe Unie pour sa victoire sur les sionistes. Bien qu'elles aient été victimes d'une attaque non provoquée, les vaillantes armées arabes se sont révélées victorieuses. Les Égyptiens contrôlent actuellement le nord de la Palestine et appellent les Arabes expulsés à rentrer chez eux. Beaucoup ont été émus aux larmes lorsque la RAU a publié des images de ses soldats reconstruisant un village où ses habitants arabes ont été expulsés pendant la Nakba. Malgré la victoire, le statut futur de ces terres suscite un grand intérêt dans de nombreuses capitales arabes."
