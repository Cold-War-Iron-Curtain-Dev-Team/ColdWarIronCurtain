l_french:
 Romania_Purge.1.d:0 "Depuis la chute de l'empire nazi, le nouveau parti au pouvoir [ROM.GetNameDef] est en guerre de l'intérieur. Les luttes intestines communistes entre l'aile moscovite et l'aile des prisons sont au statu quo depuis la destruction de l'aile bourgeoise du Secrétariat en 1948. Cependant, maintenant que le [ROM.GetLeader] a gagné le soutien du [SOV.GetLeader]et est sorti victorieux de la chef de l'aile moscovite Ana Pauker, le [ROM.GetRulingParty] a commencé une série de purges violentes contre l'aile moscovite sous accusations de déviationnisme de droite. Sur un million de membres du parti, entre 300 000 et 465 000 ont été radiés, soit près de la moitié du parti. Ainsi, [ROM.GetLeader] est assuré de sa domination sur la Roumanie."
 Romania_Purge.2.d:0 "Même si [SOV.GetLeader] soutient avec ferveur ses alliés en Europe de l'Est, les vents tournent désormais en [ROM.GetNameDef]. Sous la main de fer de Gheroghe Gheorghiu-Dej, l'opposition a été écrasée et les records ont été réécrits. Cependant, sa campagne antisémite agressive contre la politique plus modérée d'Ana Pauker a attiré plus d'attention qu'il ne le pensait, et l'idée qu'il n'est peut-être pas le dirigeant le plus stable des [ROM.GetNameDef] s'est répandue à tous les niveaux du monde communiste. Ana Pauker a été le fer de lance d'une élimination armée du paranoïaque Gheorghiu-Dej, avec le soutien des [SOV.GetLeader]. Bien que le premier secrétaire en disgrâce se soit fortifié dans son bureau, déclarant tous ceux qui s'opposaient à lui des traîtres, il fut avec succès démis de ses fonctions, enchaîné. Maintenant que Gheorghiu-Dej est emprisonné, Ana Pauker a été déclarée nouvelle première secrétaire avec le soutien du [SOV.GetLeader]."
 Romania_Purge.3.d:0 "Suite au discours de [SOV.GetLeader]sur Staline et son culte de la personnalité, de nombreux pays du Pacte de Varsovie ont entamé un processus de suppression des figures d'autorité qui incarnent les méthodes de Staline. La Roumanie a suivi une voie similaire à la suite du 20ème Congrès, s'efforçant d'éliminer Gheorghe Gheorghiu-Dej, assoiffé de pouvoir, et ses méthodes dictatoriales, en faveur d'un nouveau Premier Secrétaire et d'une version plus moderne du communisme. Bien que Gheorghiu-Dej se soit battu bec et ongles contre les menaces perçues des révisionnistes et de l'anarchie libérale, il a été renversé avec le soutien du [SOV.GetLeader] et remplacé par le [ROM.GetLeader]. "
 Romania_Purge.4.d:0 "La dirigeante officieuse du parti communiste roumain Ana Pauker a été arrêtée par [ROM.GetLeader] dans le cadre d'un plan plus vaste élaboré par [SOV.GetLeader] afin de consolider le pouvoir de [SOV.GetNameDef]en Europe de l'Est. Les accusations portées contre Ana Pauker se concentrent particulièrement sur son soutien aux « activités subversives et d'espionnage de la légation israélienne et des sionistes dans le pays » et sur la divulgation de secrets à l'Occident. Elle a disparu dans une prison roumaine, entourée de rumeurs de torture et d'interrogatoires."
 Romania_Purge.5.d:0 "Le leader du Secrétariat, Lucretiu Patrascanu, a été exécuté après avoir été accusé d'être influencé par des éléments de la bourgeoisie et même par des agents des États-Unis. Patrascanu est emprisonné par l'État depuis 1948 pour ces accusations jusqu'à son récent procès, auquel il s'est présenté avec une jambe amputée. Le leader hagard a obstinément refusé d'accepter un avocat, voire de se défendre, affirmant seulement qu'il \"crachait sur les accusations\" portées contre lui. Avec le procès et l'exécution de Patrascanu, une vague de nouvelles arrestations a envahi le pays, dirigée contre tous les alliés de Patrascanu et contre toute opposition au [ROM.GetRulingParty]."
