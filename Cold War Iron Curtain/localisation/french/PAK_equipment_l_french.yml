 PAK_light_artillery_equipment_1:0 "Ordnance QF 18 livres Mk.II"
 PAK_light_artillery_equipment_1_short:0 "QF 18 livres Mk.II"
 PAK_light_artillery_equipment_1_desc:0 "L'Ordnance QF 18 livres, ou simplement canon de 18 livres, était le canon de campagne standard de l'Empire britannique de la Première Guerre mondiale. Il constitua l'épine dorsale de la Royal Field Artillery pendant la guerre et fut produit en grand nombre. Il fut utilisé par les forces britanniques sur tous les principaux théâtres d'opérations, ainsi que par les troupes britanniques en Russie en 1919."
 PAK_light_artillery_equipment_2:0 "M101A1 105mm"
 PAK_light_artillery_equipment_2_short:0 "M101A1 105mm"
 PAK_light_artillery_equipment_3:0 "OTO-Melara Mod 56"
 PAK_light_artillery_equipment_3_short:0 "OTO-Melara Mod 56"

 PAK_light_sp_artillery_equipment_1:0 "25pdr SP, suivi, Sexton"
 PAK_light_sp_artillery_equipment_1_short:0 "Sexton"

 PAK_artillery_equipment_1:0 "Pistolet moyen BL 5,5 pouces"
 PAK_artillery_equipment_1_short:0 "BL 5,5 pouces"
 PAK_artillery_equipment_1_desc:0 "En janvier 1939, une spécification fut publiée pour un canon destiné à remplacer les obusiers de 6 pouces et 26 cwt utilisés avec la plupart des batteries moyennes. Les premières unités furent équipées au Royaume-Uni à l'été 1941 et en Afrique du Nord un an plus tard, 20 canons équipèrent les batteries britanniques et françaises libres à El Alamein. Par la suite, il équipera également des régiments canadiens, australiens, sud-africains, polonais et indiens, et après la guerre, il sera également utilisé par la Nouvelle-Zélande. Durant la Seconde Guerre mondiale, l'organisation normale était un régiment de 16 canons organisé en deux batteries. Le 5.5 fut maintenu en service après la guerre. Il a été utilisé par la Royal Artillery lors d'opérations en Corée, en Arabie du Sud et à Bornéo. Il a probablement été utilisé par l'armée indienne dans les guerres contre le Pakistan, et a été utilisé par l'armée pakistanaise contre l'Inde dans les montagnes du Cachemire pendant la guerre de Kargil en 1999."
