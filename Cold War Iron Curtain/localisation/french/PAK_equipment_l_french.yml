 #PAK_jet_multirole_equipment_1:0 ""
 #PAK_jet_multirole_equipment_1_short:0 ""
 #PAK_jet_multirole_equipment_1_desc:0 "Griffon Spitfire GFX"
 PAK_jet_multirole_equipment_2:0 "Attaquant Supermarine Mk.538"
 PAK_jet_multirole_equipment_2_short:0 "Attaquant Mk.538"
 PAK_jet_multirole_equipment_2_desc:0 "Au début des années 1950, la nouvelle Royal Pakistan Air Force (RPAF ; plus tard Pakistan Air Force) chercha à acquérir des chasseurs à réaction. Une combinaison d'un manque de fonds et de pressions politiques exercées par les fournisseurs britanniques a persuadé le service d'acquérir une variante de l'Attacker, connue sous le nom de Type 538, qui était essentiellement une variante « dé-navalisée » de l'avion utilisé par la FAA."
 PAK_jet_multirole_equipment_3:0 "Sabre nord-américain F-86F"
 PAK_jet_multirole_equipment_3_short:0 "Sabre F-86F"
 PAK_jet_multirole_equipment_3_desc:0 "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un contrôle à pleine puissance avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche qui étaient encore conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur.) Les Sabre F avaient une agilité à grande vitesse bien améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 PAK_jet_multirole_equipment_4:0 "Sabre nord-américain F-86F-40"
 PAK_jet_multirole_equipment_4_short:0 "Sabre F-86F-40"
 PAK_jet_multirole_equipment_4_desc:0 "D'autres améliorations du sabre F-86F pour le rendre plus efficace au combat contre les nouveaux avions équipés de postcombustion en les armant de points d'emport et de rails pour lancer des missiles AIM-9B Sidewinders."
 PAK_jet_multirole_equipment_5:0 "Shenyang F-6"
 PAK_jet_multirole_equipment_5_short:0 "F-6"
 PAK_jet_multirole_equipment_6:0 "Dassault Mirage IIIEP"
 PAK_jet_multirole_equipment_6_short:0 "Mirage IIIEP"
 PAK_jet_multirole_equipment_7:0 "Chengdu F-7P Skybolt"
 PAK_jet_multirole_equipment_7_short:0 "F-7P Skybolt"
 PAK_jet_multirole_equipment_7_desc:0 "Le Chengdu J-7 est un avion de combat de la République populaire de Chine. Il s'agit d'une version construite sous licence du MiG-21 soviétique Mikoyan-Gurevich et partage donc de nombreuses similitudes avec le MiG-21. L'avion est armé de missiles air-air à courte portée infrarouge et principalement conçu pour le combat air-air à courte portée. L'avion est également utilisé pour l'appui aérien rapproché." 
 PAK_jet_multirole_equipment_8:0 "Chengdu F-7PG Skybolt"
 PAK_jet_multirole_equipment_8_short:0 "F-7PG Skybolt"
 PAK_jet_multirole_equipment_8_desc:0 "Le Chengdu J-7 est un avion de combat de la République populaire de Chine. Il s'agit d'une version construite sous licence du MiG-21 soviétique Mikoyan-Gurevich et partage donc de nombreuses similitudes avec le MiG-21. L'avion est armé de missiles air-air à courte portée infrarouge et principalement conçu pour le combat air-air à courte portée. L'avion est également utilisé pour l'appui aérien rapproché." 
 PAK_jet_multirole_equipment_9:0 "Faucon de combat F-16A Block 15 de General Dynamics"
 PAK_jet_multirole_equipment_9_short:0 "F-16A Bloc 15"
 PAK_jet_multirole_equipment_9_desc:0 "Premier changement majeur apporté au F-16, l'avion Block 15 présentait des stabilisateurs horizontaux plus grands, l'ajout de deux points d'attache à l'entrée du menton, un nouveau radar et une capacité accrue pour les pylônes sous les ailes. Cette variante a également acquis une radio ultra haute fréquence (UHF) à jour. Cette variante est la plus nombreuse parmi les variantes du F-16."
 PAK_jet_multirole_equipment_10:0 "PAC JF-17 Tonnerre"
 PAK_jet_multirole_equipment_10_short:0 "JF-17 Tonnerre"
 PAK_jet_multirole_equipment_10_desc:0 "Le PAC JF-17 Thunder est un avion de combat multirôle léger monomoteur de quatrième génération développé conjointement par le Complexe aéronautique du Pakistan (PAC) et la Chengdu Aircraft Corporation (CAC) de Chine."

 PAK_mr_stealth_fighter_equipment_1:0 "PAC JF-17 Block III Tonnerre"
 PAK_mr_stealth_fighter_equipment_1_short:0 "JF-17 Bloc III"
 PAK_mr_stealth_fighter_equipment_1_desc:0 "Le PAC JF-17 Thunder est un avion de combat multirôle léger monomoteur de quatrième génération développé conjointement par le Complexe aéronautique du Pakistan (PAC) et la Chengdu Aircraft Corporation (CAC) de Chine. Cette variante est améliorée avec une nouvelle avionique et d'autres équipements dotés de plus de points d'attache et de technologies intégrées."

 PAK_CAS_equipment_1:0 "de Havilland DH.82 Tiger Moth"
 PAK_CAS_equipment_1_short:0 "DH.82 Tiger Moth"
 PAK_CAS_equipment_2:0 "Vultée A-31 Vengeance"
 PAK_CAS_equipment_2_short:0 "A-31 Vengeance"
 PAK_CAS_equipment_3:0 "Hawker Tempête Mk.V"
 PAK_CAS_equipment_3_short:0 "Tempête Mk.V"
 PAK_CAS_equipment_4:0 "Hawker Tempête Mk.II"
 PAK_CAS_equipment_4_short:0 "Tempête Mk.II"

 PAK_jet_CAS_equipment_6:0 "Dassault Mirage 5PA"
 PAK_jet_CAS_equipment_6_short:0 "Mirage5PA"
 PAK_jet_CAS_equipment_6_desc:0 "Le Dassault Mirage 5 est un avion d'attaque supersonique conçu en France par Dassault Aviation et fabriqué en France et dans plusieurs autres pays sous licence. Il est dérivé du populaire chasseur Mirage III de Dassault."
 PAK_jet_CAS_equipment_7:0 "Nanchang A-5A"
 PAK_jet_CAS_equipment_7_short:0 "A-5A"
 PAK_jet_CAS_equipment_8:0 "Dassault Mirage 5PA ROSE"
 PAK_jet_CAS_equipment_8_short:0 "Mirage 5PA ROSE"

 PAK_jet_interceptor_equipment_5:0 "Chasseur stellaire Lockheed F-104A"
 PAK_jet_interceptor_equipment_5_short:0 "Chasseur F-104A"

 PAK_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 PAK_jet_light_equipment_1_short:0 "Étoile filante T-33"
 PAK_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 PAK_jet_light_equipment_2:0 "Cessna T-37A"
 PAK_jet_light_equipment_2_short:0 "T-37A"
 #PAK_jet_light_equipment_2_desc:0 ""
 PAK_jet_light_equipment_3:0 "Shenyang FT-5" 
 PAK_jet_light_equipment_3_short:0 "FT-5"
 PAK_jet_light_equipment_3_desc:0 "Une version d'entraînement biplace du J-5 conçue et développée par Chengdu Aircraft Corporation. Combiné la cellule J-5, les aérofreins J-5A et la section de cockpit tandem à deux places du JJ-2 (MiG-15UTI). Versions d'exportation désignées FT-5."
 PAK_jet_light_equipment_4:0 "Shenyang FT-7P" 
 PAK_jet_light_equipment_4_short:0 "FT-7P"
 PAK_jet_light_equipment_4_desc:0 "version d'exportation de JJ-7 avec le chinois remplacé par l'anglais pour tous les affichages. L'Iran a été le premier client avec une commande passée fin 1986. Un certain nombre ont été livrés au Pakistan avec une longueur de fuselage augmentée de 0,61 mètre et une capacité de carburant interne augmentée de 350 litres."
 PAK_jet_light_equipment_5:0 "PAC Karakorum-8" 
 PAK_jet_light_equipment_5_short:0 "Karakorum-8"
 PAK_jet_light_equipment_5_desc:0 "Le Hongdu JL-8 (Nanchang JL-8), également connu sous le nom de Karakorum-8 ou K-8 en abrégé, est un avion d'entraînement à réaction intermédiaire biplace et un avion d'attaque léger conçu en République populaire de Chine par China Nanchang Aircraft Manufacturing Corporation. Le Pakistan est également le co-partenaire de ce projet. Le maître d'oeuvre est la Hongdu Aviation Industry Corporation. Sa variante d'exportation, le K-8 Karakorum, est coproduite par le complexe aéronautique du Pakistan pour l'armée de l'air pakistanaise."

 PAK_recon_equipment_0:0 "Taylorcraft Auster AOP6"
 PAK_recon_equipment_0_short:0 "Auster AOP6"
 PAK_recon_equipment_0_desc:0 "Le Taylorcraft Auster était un avion de liaison et d'observation militaire britannique produit par la société Taylorcraft Airplanes (England) Limited pendant la Seconde Guerre mondiale. "
 PAK_jet_recon_equipment_0:0 "Étoile filante Lockheed RT-33A"
 PAK_jet_recon_equipment_0_short:0 "Étoile filante RT-33A"
 PAK_jet_recon_equipment_0_desc:0 "RT-33A modifié avant la livraison en tant que variante de reconnaissance monoplace ; 85 construits, principalement pour l'exportation dans le cadre du programme d'assistance militaire."
 PAK_jet_recon_equipment_1:0 "Dassault Mirage IIIER"
 PAK_jet_recon_equipment_1_short:0 "Mirage IIIER"
 PAK_jet_recon_equipment_1_desc:0 "Variante de reconnaissance du Pakistan Dassault Mirage IIIE, armé de caméras plutôt que de canons et de missiles."

 PAK_tac_bomber_equipment_0:0 "Armstrong WhitworthWhitley"
 PAK_tac_bomber_equipment_0_short:0 "Whitley"

 #In between British GFX for prop tac bombers
