 PAK_motorized_equipment_1:0 "Camion 4x4 Dodge T-234 \"Birmanie\""
 PAK_motorized_equipment_1_short:0 "Dodge T-234 4x4"
 PAK_motorized_equipment_1_desc:0 "Les camions de modèle militaire canadien (CMP) étaient des gammes mutuellement cohérentes de camions militaires, fabriqués en grand nombre, dans plusieurs classes et de nombreuses versions, par les succursales canadiennes des « trois grands » constructeurs automobiles américains pendant la Seconde Guerre mondiale, conformes aux spécifications de l'armée britannique, principalement destinés à être utilisés dans les armées des alliés du Commonwealth britannique, mais servant également dans d'autres unités de l'Empire britannique. "
 PAK_motorized_equipment_2:0 "RÉO M35 6x6"
 PAK_motorized_equipment_2_short:0 "M35 6x6"
 PAK_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 PAK_motorized_equipment_3:0 "AM Général M809 6x6"
 PAK_motorized_equipment_3_short:0 "M809 6x6"
 PAK_motorized_equipment_3_desc:0 "Le M809 est un camion 6x6 de 5 tonnes conçu par AM General en 1970. Il a été utilisé dans tous les conflits américains de 1970 à 1982. Le M809 utilise un moteur NH250, une transmission à 5 vitesses/2 gammes et des essieux à poutre dynamique sur ressorts à lames. Il peut transporter une charge de 5 000 lb. Il a une vitesse de 52 mph sur 350 miles et obtient 10 mi/gal. En plus d'être utilisé pour le transport et le fret, le véhicule est très solide et peut supporter des composants utilitaires sur son plateau. Ceux-ci incluent la possibilité de monter des kits de dépanneuse, des bennes, des remorques, de grandes fourgonnettes pour le soutien/confort, des équipements de pontage et quelques autres. Le M809 peut également traverser des rivières peu profondes grâce à sa garde au sol élevée et est très efficace sur route ou hors route grâce à sa suspension. "
 PAK_motorized_equipment_4:0 "Dongfeng EQ150 4x4"
 PAK_motorized_equipment_4_short:0 "EQ150 4x4"
 PAK_motorized_equipment_5:0 "Industries lourdes Taxila Yahood 6x6"
 PAK_motorized_equipment_5_short:0 "Yahood 6x6"
 #PAK_motorized_equipment_5:0 "Hinopak GT 4x4"
 #PAK_motorized_equipment_5_short:0 "Hinopak GT 4x4"

 ########### END OF NEW PAK ARMOR
