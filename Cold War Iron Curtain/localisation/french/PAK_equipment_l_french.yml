 ## Pakistan Infantry Equipment
 PAK_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 PAK_infantry_equipment_0_short:0 "SMLE n°4"
 PAK_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 PAK_infantry_equipment_1:0 "Fusil d'assaut ZB-56"
 PAK_infantry_equipment_1_short:0 "ZB-56"
 PAK_infantry_equipment_1_desc:0 "Le ZB-56 est un fusil d'assaut automatique conçu par la RPC en 1956 et basé sur l'AK-47. Il a été témoin de combats dans toutes les guerres dans lesquelles la RPC a été impliquée depuis son développement. Le ZB-56 présente un certain nombre de différences par rapport à l'AK-47. Ils étaient fabriqués avec un récepteur fraisé et un viseur entièrement fermé. Son canon est également plus lourd et ressemble davantage à celui du RPK, à l'exception du fait qu'il lui manque un tourillon renforcé. De plus, il n'a pas de muselière filetée. Parce que le ZB-56 possède une fiabilité légendaire et est très simple à utiliser, il continue d'être utilisé par les armées du monde entier. Il est également légèrement moins cher à fabriquer que l'AK-47."

 PAK_infantry_equipment_2:0 "Heckler & Koch G3"
 PAK_infantry_equipment_2_short:0 "Heckler & Koch G3"
 PAK_infantry_equipment_2_desc:0 "Modèle original basé sur le CETME Model 58 introduit en 1959 et approuvé en 1960. Il avait une crosse et un garde-main en bois."

 PAK_infantry_equipment_3:0 "Heckler & Koch G3P3"
 PAK_infantry_equipment_3_short:0 "Heckler & Koch G3P3"
 PAK_infantry_equipment_3_desc:0 " La version de 1963 la plus connue. Des viseurs à tambour avec un guidon amélioré, un suppresseur de flash/frein de bouche capable de tirer des grenades aux normes OTAN, une crosse fixe en plastique solide et un protège-main en plastique qui n'entre pas en contact avec le canon flottant. Le protège-main était disponible en version fine et ventilée et en version large. Ce dernier permet la fixation d'un bipied."

 PAK_infantry_equipment_4:0 "Usines de munitions du Pakistan G3P4"
 PAK_infantry_equipment_4_short:0 "POF G3P4"
 PAK_infantry_equipment_4_desc:0 " La version de 1963 la plus connue. Des viseurs à tambour avec un guidon amélioré, un suppresseur de flash/frein de bouche capable de tirer des grenades aux normes OTAN, une crosse fixe en plastique solide et un protège-main en plastique qui n'entre pas en contact avec le canon flottant. Le protège-main était disponible en version fine et ventilée et en version large. Ce dernier permet la fixation d'un bipied."

 ########## NEW PAK ARMOR
 PAK_lt_equipment_1:0 "M5 Stuart"
 PAK_lt_equipment_1_short:0 "M5 Stuart"
 PAK_lt_equipment_2:0 "M24 Chaffee"
 PAK_lt_equipment_2_short:0 "M24 Chaffee"

 PAK_mbt_equipment_0:0 "M4A1 Sherman"
 PAK_mbt_equipment_0_short:0 "M4A1 Sherman"
 PAK_mbt_equipment_1:0 "M4A1E6 Sherman 76 mm"
 PAK_mbt_equipment_1_short:0 "M4A1E6 Sherman"
 #PAK_mbt_equipment_2:0 ""
 #PAK_mbt_equipment_2_short:0 "Sherman GFX"
 PAK_mbt_equipment_3:0 "Char de combat à chenilles complète : canon de 90 mm, M47"
 PAK_mbt_equipment_3_short:0 "M47 Patton"
 PAK_mbt_equipment_3_desc:0 "Le M47 Patton est l'un des premiers chars de combat principaux et a été conçu par le département des munitions de l'armée américaine en 1951. Il est très similaire au M46 Patton mais avec une tourelle de canon mise à jour avec un mécanisme interne amélioré et une transmission améliorée. Il a connu des combats lors de la crise de Suez, de la guerre des 6 jours et des guerres yougoslaves."
 PAK_mbt_equipment_4:0 "Char de combat à chenilles complète : canon de 90 mm, M48"
 PAK_mbt_equipment_4_short:0 "M48 Patton"
 PAK_mbt_equipment_4_desc:0 "Le M48 Patton est un CCP conçu par le Département des munitions de l'armée américaine en 1953. Le M48 est doté d'un blindage de 110 mm et d'un canon principal amélioré de 90 mm. Le moteur est une variante optimisée du V12 utilisé dans les chars Patton précédents avec un système d'injection de carburant léger et est suralimenté. Il a une autonomie de fonctionnement hors route de 160 milles et de 300 milles sur route. Il peut rouler sur route à 30 mph, mais atteint 20 mph hors route grâce au moteur, à la transmission et aux chenilles améliorés. Il a servi de char principal pendant la guerre du Vietnam et était couramment utilisé par les alliés des États-Unis pendant la guerre froide. Il ressemble au M47 Patton mais il s'agit d'un tout nouveau design avec de nouveaux mécanismes internes. Il est utilisé par l'armée américaine et les Marines avant d'être finalement remplacé par le M60, bien que de nombreuses unités de la Garde nationale exploitaient et entretenaient encore des M48 jusqu'à la fin des années 80."
 PAK_mbt_equipment_5:0 "WZ121A (ZTZ-69-I)"
 PAK_mbt_equipment_5_short:0 "Tapez 69-I"
 PAK_mbt_equipment_6:0 "WZ121A (ZTZ-69-II)"
 PAK_mbt_equipment_6_short:0 "Type 69-II"
 PAK_mbt_equipment_7:0 "ZTZ-85-IIAP"
 PAK_mbt_equipment_7_short:0 "Type 85-IIAP"
 PAK_mbt_equipment_8:0 "Industries lourdes Taxila Al-Zarrar"
 PAK_mbt_equipment_8_short:0 "Al-Zarrar"
 PAK_mbt_equipment_9:0 "Industries lourdes Taxila Al-Khalid"
 PAK_mbt_equipment_9_short:0 "Al-Khalid"

 PAK_mechanized_equipment_1:0 "Bren Carrier Mk.I"
 PAK_mechanized_equipment_1_short:0 "Bren Carrier Mk.I"
 PAK_mechanized_equipment_1_desc:0 "L'Universal Carrier, également connu sous le nom de Bren Gun Carrier et parfois simplement de Bren Carrier de l'armement de mitrailleuses légères, est un nom commun décrivant une famille de véhicules blindés légers à chenilles construits par Vickers-Armstrongs et d'autres sociétés."
 PAK_mechanized_equipment_2:0 "Demi-piste M3"
 PAK_mechanized_equipment_2_short:0 "Demi-piste M3"
 PAK_mechanized_equipment_2_desc:0 "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
