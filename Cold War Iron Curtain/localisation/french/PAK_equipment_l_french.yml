 PAK_jet_tac_bomber_equipment_2:0 "Martin B-57 Canberra"
 PAK_jet_tac_bomber_equipment_2_short:0 "B-57 Canberra"
 PAK_jet_tac_bomber_equipment_2_desc:0 "Le « Canberra » est une version américaine du bombardier électrique anglais du même nom. Il est idéal pour les frappes tactiques et la reconnaissance. Son retrait dans les années 1980 marquerait la fin de l'ère des bombardiers tactiques."
 PAK_jet_tac_bomber_equipment_3:0 "Harbin H-5A"
 PAK_jet_tac_bomber_equipment_3_short:0 "H-5A"
 #PAK_jet_tac_bomber_equipment_3:0 "Lockheed C-130A(B)"
 #PAK_jet_tac_bomber_equipment_3_short:0 "C-130A((B)"
 #PAK_jet_tac_bomber_equipment_3_desc:0 "C-130 transport aircraft in Pakistan Air Force service that where converted for dropping bombs from its cargobay at high altitude during the Indo-pakistani war of 1971. Both sides lacked propper SAM systems to shoot these aircraft down at high altitude. This was a response to the Indian Air Force using An-12 aircraft on similar bombing missions."

