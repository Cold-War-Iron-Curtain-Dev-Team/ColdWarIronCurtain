 PAK_transport_plane_equipment_3_desc:0 "Le Bristol Type 170 Freighter est un avion bimoteur britannique conçu et construit par la Bristol Airplane Company à la fois comme avion de fret et de ligne. Son utilisation la plus connue était celle de ferry aérien pour transporter des voitures et leurs passagers sur des distances relativement courtes. Une version réservée aux passagers a également été produite, connue sous le nom de Wayfarer."
