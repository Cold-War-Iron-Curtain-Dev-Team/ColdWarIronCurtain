 CHL_utility_helicopter_equipment_2:0 "Bell UH-1B Iroquois"
 CHL_utility_helicopter_equipment_2_short:0 "UH-1B Iroquois"
 CHL_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connue sous le nom de « Huey » (du nom de sa désignation originale d'avant 1962, HU-1), l'UH-1A est la variante du modèle militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agissait du premier hélicoptère en service par une branche de l'armée américaine à utiliser un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication américaine dans la guerre du Vietnam. Bien que son nom soit officieusement « Huey », son surnom officiel est « Iroquois »."
 CHL_utility_helicopter_equipment_3:0 "Bell UH-1D Huey"
 CHL_utility_helicopter_equipment_3_short:0 "UH-1D Huey"
 CHL_utility_helicopter_equipment_4:0 "Bell UH-1H Huey"
 CHL_utility_helicopter_equipment_4_short:0 "UH-1H Huey"
 CHL_utility_helicopter_equipment_4_desc:0 "Introduit pour la première fois en 1970, l'UH-1N était un autre membre de la famille élargie « Huey », cette fois développé à partir de l'UH-1H, bien que contrairement à l'UH-1A et à l'UH-1D, la variante « N » serait celle qui donnerait naissance à sa version civile, le Bell 212. Le rotor principal est propulsé par deux turbomoteurs qui entraînent un seul arbre de sortie. En cas de panne d'un moteur, le moteur restant peut fournir 671 kW (900 shp) pendant 30 minutes ou 571 kW (765 shp), permettant à l'UH-1N de maintenir ses performances de croisière au poids maximum. C'était également l'une des rares variantes « iroquoises » à ne pas être utilisée par l'armée américaine, étant plutôt le porte-drapeau des Marines. Sa configuration bimoteur lui a valu le surnom informel de « Twin Huey »."
