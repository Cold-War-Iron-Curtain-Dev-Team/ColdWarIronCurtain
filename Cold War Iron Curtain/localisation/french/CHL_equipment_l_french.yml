 CHL_mechanized_heavy_equipment_6:0 "FMC YPR-765A1 PRI 25KBA"
 CHL_mechanized_heavy_equipment_6_short:0 "YPR-765A1 PRI"
 CHL_mechanized_heavy_equipment_7:0 "Marder 1A3"
