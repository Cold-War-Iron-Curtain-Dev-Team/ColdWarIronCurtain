 CHL_mechanized_equipment_1:0 "Demi-piste M2"
 CHL_mechanized_equipment_1_short:0 "Demi-piste M2"
 CHL_mechanized_equipment_1_desc:0 "La voiture semi-chenillée M2 est une voiture semi-chenillée blindée produite par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspirait des semi-chenilles importées de France dans les années 1930, employant des composants standard fournis par les constructeurs de camions américains pour accélérer la production et réduire les coûts. Le concept a été conçu et les modèles pilotes fabriqués par Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement étiqueté M2.). La production par la White Motor Company a commencé en 1940 et a été élargie pour inclure Autocar."
 CHL_mechanized_equipment_2:0 "Demi-piste M3"
 CHL_mechanized_equipment_2_short:0 "Demi-piste M3"
 CHL_mechanized_equipment_2_desc:0 "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 CHL_mechanized_equipment_3:0 "Demi-piste M3A1"
 CHL_mechanized_equipment_3_short:0 "Demi-piste M3A1"
 CHL_mechanized_equipment_3_desc:0 "Le M3A1 est un semi-chenillé M3 doté du support d'anneau de mitrailleuse M49 amélioré sur le siège avant droit. Entre 1942 et 1943, tous les half-tracks M3 (standard et A1) furent continuellement améliorés. Ces améliorations comprenaient un certain nombre d'améliorations de la transmission, du moteur et du rangement"
 #CHL_mechanized_equipment_4:0 ""
 #CHL_mechanized_equipment_4_short:0 ""
 CHL_mechanized_equipment_5:0 "M113"
 CHL_mechanized_equipment_5_short:0 "M113"
 CHL_mechanized_equipment_6:0 "M113A1"
 CHL_mechanized_equipment_6_short:0 "M113A1"
 #CHL_mechanized_equipment_7:0 ""
 #CHL_mechanized_equipment_7_short:0 ""
 CHL_mechanized_equipment_8:0 "FAMAE Piraña II"
 CHL_mechanized_equipment_8_short:0 "Piraña I"
 CHL_mechanized_equipment_8_desc:0 "Le MOWAG Piranha est une famille de véhicules blindés de combat conçus par la société suisse MOWAG. Cinq générations de véhicules ont été produites, fabriquées par MOWAG ou sous licence par d'autres sociétés, et des variantes sont en service dans les forces militaires du monde entier."
 CHL_mechanized_equipment_9:0 "YPR-765A2 pri.50"
