 CHL_fighter_equipment_0:0 "Fuerza Aérea de Chili"
 CHL_fighter_equipment_0_short:0 "FACh"
 CHL_fighter_equipment_0_desc:0 "La Force aérienne chilienne est la force aérienne du Chili, une branche de l'armée chilienne. "

 CHL_jet_multirole_equipment_1:0 "Étoile filante Lockheed F-80C"
 CHL_jet_multirole_equipment_1_short:0 "Étoile filante F-80C"
 CHL_jet_multirole_equipment_1_desc:0 "Le premier chasseur à réaction exploité par l'US Army Air Force (plus tard l'US Air Force). C'était le premier et le seul avion à réaction américain opérationnel pendant les derniers jours de la Seconde Guerre mondiale. Ce type marquerait le début de l'ère des avions à réaction pour les États-Unis, car sa conception à aile droite servait largement de chasseur de jour et de chasseur-bombardier pendant la guerre de Corée sous le nom de F-80. Surnommé « l'étoile filante », le F-80 représentait le premier summum de l'aviation américaine."
 #CHL_jet_multirole_equipment_2:0 ""
 #CHL_jet_multirole_equipment_2_short:0 ""
 #CHL_jet_multirole_equipment_3:0 ""
 #CHL_jet_multirole_equipment_3_short:0 ""
 #CHL_jet_multirole_equipment_4:0 ""
 #CHL_jet_multirole_equipment_4_short:0 ""
 CHL_jet_multirole_equipment_5:0 "Hawker Hunter F.71"
 CHL_jet_multirole_equipment_5_short:0 "Chasseur F.71"
 CHL_jet_multirole_equipment_5_desc:0 "Version de chasse du Chilien Hunter FGA.71."
 #CHL_jet_multirole_equipment_6:0 ""
 #CHL_jet_multirole_equipment_6_short:0 ""
 CHL_jet_multirole_equipment_7:0 "Dassault Mirage 50C"
 CHL_jet_multirole_equipment_7_short:0 "Mirage50C"
 CHL_jet_multirole_equipment_7_desc:0 "Le nouveau moteur Atar 09K-50, cependant, constituait encore une amélioration, et l'installation de ce moteur a conduit à la variante suivante du Mirage, le Mirage 50, dans les années 1970. Le moteur amélioré a donné au Mirage 50 de meilleures caractéristiques de décollage et de montée que ses prédécesseurs. Bien que le Mirage 50 intègre également une nouvelle avionique, comme un système radar Cyrano IV, il ne s'est pas avéré populaire dans les ventes à l'exportation, car la série Mirage de première génération devenait obsolète."
 CHL_jet_multirole_equipment_8:0 "Northrop F-5E Tigre II"
 CHL_jet_multirole_equipment_8_short:0 "F-5E Tigre II"
 CHL_jet_multirole_equipment_9:0 "General Dynamics F-16A Block 15 OCU (mises à niveau des capacités opérationnelles) Fighting Falcon"
 CHL_jet_multirole_equipment_9_short:0 "F-16A Bloc 15 OCU"
 CHL_jet_multirole_equipment_9_desc:0 "Premier changement majeur apporté au F-16, l'avion Block 15 présentait des stabilisateurs horizontaux plus grands, l'ajout de deux points d'attache à l'entrée du menton, un nouveau radar et une capacité accrue pour les pylônes sous les ailes. Cette variante a également acquis une radio ultra haute fréquence (UHF) à jour. Cette variante est la plus nombreuse parmi les variantes du F-16."
 CHL_jet_multirole_equipment_10:0 "Fokker F-16A Block 15 MLU (mise à jour à mi-vie) Fighting Falcon"
 CHL_jet_multirole_equipment_10_short:0 "F-16A Bloc 15 MLU"
 CHL_jet_multirole_equipment_10_desc:0 "Le package MLU (Mid-Life Update) du F-16 qui en résulte a été conçu pour mettre à niveau le cockpit et l'avionique à l'équivalent de ceux du F-16C/D Block 50/52 ; ajouter la possibilité d'utiliser des missiles air-air guidés par radar ; et d'une manière générale, améliorer les performances opérationnelles et améliorer la fiabilité, la capacité de soutien et la maintenabilité de l'avion."

 CHL_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 CHL_jet_light_equipment_1_short:0 "Étoile filante T-33"
 CHL_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 CHL_jet_light_equipment_2:0 "Cessna T-37A"
 CHL_jet_light_equipment_2_short:0 "T-37A"
 CHL_jet_light_equipment_3:0 "Cessna A-37B Libellule"
 CHL_jet_light_equipment_3_short:0 "A-37B Libellule"
 CHL_jet_light_equipment_4:0 "Entraîneur turbo Pilatus PC-7"
 CHL_jet_light_equipment_4_short:0 "PC-7"
 CHL_jet_light_equipment_5:0 "CASA C-101 Aviojet"
 CHL_jet_light_equipment_5_short:0 "C-101 Aviojet"
 CHL_jet_light_equipment_5_desc:0 "Le CASA C-101 Aviojet est un avion d'entraînement avancé et d'attaque léger monomoteur à réaction à aile basse conçu et fabriqué par la compagnie aéronautique espagnole Construcciones Aeronáuticas SA (CASA). "

 CHL_CAS_equipment_1:0 "Bréda Ba.65bis"
 CHL_CAS_equipment_1_short:0 "Ba.65bis"
 CHL_CAS_equipment_2:0 "Douglas A-24 Banshee"
 CHL_CAS_equipment_2_short:0 "A-24 Banshee"
 CHL_CAS_equipment_3:0 "République P-47D-5 Thunderbolt"
 CHL_CAS_equipment_3_short:0 "P-47D-5 Coup de tonnerre"
 CHL_CAS_equipment_4:0 "Douglas A-26C Envahisseur"
 CHL_CAS_equipment_4_short:0 "Envahisseur A-26C"
 CHL_CAS_equipment_4_desc:0 "Le Douglas A-26 Invader est un bombardier léger bimoteur américain et un avion d'attaque au sol. Construit par Douglas Aircraft Company pendant la Seconde Guerre mondiale, l'Invader a également servi lors de plusieurs conflits majeurs de la guerre froide."

 CHL_jet_CAS_equipment_4:0 "Hawker Hunter FGA.71"
 CHL_jet_CAS_equipment_4_short:0 "Chasseur FGA.71"
 CHL_jet_CAS_equipment_4_desc:0 "Version export du chasseur d'attaque au sol Hunter FGA.9 pour le Chili."
 CHL_jet_CAS_equipment_6:0 "Dassault Mirage 5"
 CHL_jet_CAS_equipment_6_short:0 "Mirage5"
 CHL_jet_CAS_equipment_6_desc:0 "Le Dassault Mirage 5 est un avion d'attaque supersonique conçu en France par Dassault Aviation et fabriqué en France et dans plusieurs autres pays sous licence. Il est dérivé du populaire chasseur Mirage III de Dassault."
 CHL_jet_CAS_equipment_7_short:0 "Mirage 5MA ELKAN"
 CHL_jet_CAS_equipment_7_desc:0 "Le Dassault Mirage 5 est un avion d'attaque supersonique conçu en France par Dassault Aviation et fabriqué en France et dans plusieurs autres pays sous licence. Il est dérivé du populaire chasseur Mirage III de Dassault. Les 50FC ont été mis à niveau par Dassault à partir des AdA 5F, puis mis à jour par Enaer vers la norme Pantera. Les Elkans sont d'anciens Mirage 5 belges. Quelques Cheetahs d'ex-Afrique du Sud en pièces de rechange."

 CHL_recon_equipment_0:0 "Cessna O-1 Chien d'oiseau"
 CHL_recon_equipment_0_short:0 "O-1 Chien Oiseau"
 CHL_recon_equipment_0_desc:0 "Le Cessna L-19/O-1 Bird Dog est un avion de liaison et d'observation. Il s'agissait du premier avion à voilure fixe entièrement métallique commandé pour et par l'armée américaine après la séparation de l'armée de l'air en 1947. Le Bird Dog a eu une longue carrière dans l'armée américaine, ainsi que dans d'autres pays. "
 CHL_jet_recon_equipment_0:0 "Étoile filante Lockheed RT-33A"
 CHL_jet_recon_equipment_0_short:0 "Étoile filante RT-33A"
 CHL_jet_recon_equipment_0_desc:0 "RT-33A modifié avant la livraison en tant que variante de reconnaissance monoplace ; 85 construits, principalement pour l'exportation dans le cadre du programme d'assistance militaire."
 CHL_jet_recon_equipment_1:0 "Hawker Hunter FR.71A"
 CHL_jet_recon_equipment_1_short:0 "Chasseur FR.71A"
 CHL_jet_recon_equipment_2:0 "Dassault Mirage 5MR"
 CHL_jet_recon_equipment_2_short:0 "Mirage 5MR"
 CHL_jet_recon_equipment_2_desc:0 "Version de reconnaissance photographique du Mirage de l'armée de l'air chilienne, armé de caméras au lieu de munitions d'attaque au sol."

 CHL_tac_bomber_equipment_0:0 "Junkers Ju 86"
 CHL_tac_bomber_equipment_0_short:0 "Ju 86"
 #CHL_tac_bomber_equipment_1:0 ""
 #CHL_tac_bomber_equipment_1_short:0 ""
 CHL_tac_bomber_equipment_2:0 "B-25C Mitchell nord-américain"
 CHL_tac_bomber_equipment_2_short:0 "B-25C Mitchell"
 CHL_tac_bomber_equipment_2_desc:0 "Le B-25 est un bombardier moyen bimoteur introduit en 1941. Utilisé par de nombreuses forces aériennes pendant la Seconde Guerre mondiale, il a également servi sur tous les théâtres impliquant des avions pendant la guerre, l'utilisation la plus célèbre étant le raid de Doolittle, la première campagne de bombardement aérien réussie sur le continent japonais pendant la guerre. Son surnom est « Mitchell », du nom du major général Billy Mitchell, pionnier de l'aviation militaire américaine."
