 #Chile CHL
 CHL_infantry_equipment_0:0 "Fusil Johnson M1941"
 CHL_infantry_equipment_0_short:0 "Fusil Johnson M1941"
 CHL_infantry_equipment_0_desc:0 "Le M1941 Johnson Rifle est un fusil semi-automatique américain à recul court conçu par Melvin Johnson avant la Seconde Guerre mondiale. Le M1941 a rivalisé sans succès avec le fusil américain M1."

 CHL_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 CHL_infantry_equipment_1_short:0 "FN FAL"
 CHL_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 CHL_infantry_equipment_2:0 "Heckler & Koch G3"
 CHL_infantry_equipment_2_short:0 "Heckler & Koch G3"
 CHL_infantry_equipment_2_desc:0 "Modèle original basé sur le CETME Model 58 introduit en 1959 et approuvé en 1960. Il avait une crosse et un garde-main en bois."

 CHL_infantry_equipment_3:0 "Heckler & Koch G3A3"
 CHL_infantry_equipment_3_short:0 "Heckler & Koch G3A3"
 CHL_infantry_equipment_3_desc:0 "La version de 1963 la plus connue. Des viseurs à tambour avec un guidon amélioré, un suppresseur de flash/frein de bouche capable de tirer des grenades aux normes OTAN, une crosse fixe en plastique solide et un protège-main en plastique qui n'entre pas en contact avec le canon flottant. Le protège-main était disponible en version fine et ventilée et en version large. Ce dernier permet la fixation d'un bipied."

 CHL_infantry_equipment_4:0 "IMI Galil Automatique ACE"
 CHL_infantry_equipment_4_short:0 "Galille ACE"
 CHL_infantry_equipment_4_desc:0 "L'IMI Galil est une famille de fusils automatiques de fabrication israélienne chambrés pour les cartouches OTAN de 5,56 × 45 mm ou 7,62 × 51 mm OTAN. Conçu à l'origine par Yisrael Galili et Yakov Lior à la fin des années 1960, le Galil a d'abord été produit par l'entreprise publique Israel Military Industries et est maintenant exporté par les Israel Weapon Industries privatisées. "

########## NEW CHL ARMOR
 CHL_lt_equipment_1:0 "M3A1 Stuart"
 CHL_lt_equipment_1_short:0 "M3A1 Stuart"
 CHL_lt_equipment_2:0 "M24 Chaffee"
 CHL_lt_equipment_2_short:0 "M24 Chaffee"
 CHL_lt_equipment_3:0 "Char de combat à chenilles complètes : canon de 76 mm, M41"
 CHL_lt_equipment_3_short:0 "M41 Walker Bulldog"
 CHL_lt_equipment_3_desc:0 "Le M41 est un char de reconnaissance léger développé par Cadillac en 1949. Il a combattu au Vietnam, dans la Baie des Cochons, au Liban et en Somalie. Son blindage varie de 19 mm à 31,7 mm. Il est armé d'un canon principal de 76 mm, d'une mitrailleuse coaxiale de calibre.30 et d'un canon de toit de calibre.50. Il utilise un moteur essence Continental 6 cylindres et fonctionne jusqu'à 45 mph avec une autonomie opérationnelle de 100 miles. Le développement du M41 progressait lentement avec peu de financement, mais lorsque la guerre de Corée a éclaté, l'armée américaine a commencé à précipiter le programme. La précipitation a causé un grand nombre de problèmes dans le programme et des problèmes de taille excessive. Le M41, en raison de graves problèmes liés à la précipitation du programme, a été produit pendant très peu de temps et n'a pas été utilisé pendant la guerre de Corée. En fait, la production n'a démarré qu'en 1951 et n'a duré que 3 ans."
