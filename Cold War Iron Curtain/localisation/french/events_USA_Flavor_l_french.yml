l_french:
 MacArthur_Dismissal.1.d:0 "Avec l'intensification des combats en Corée, le président Truman a appelé le général MacArthur pour lui faire part de ses inquiétudes concernant les rapports faisant état d'un important renforcement militaire chinois à la frontière. Le général MacArthur assura au président qu'une telle possibilité était très peu probable. Il cita le manque de base industrielle et l'épuisement militaire dû à la guerre civile comme quelques-unes des raisons pour lesquelles la Chine ne s'impliquerait pas. Le président Truman accepta ce conseil et se montra plus confiant que jamais dans le leadership de MacArthur pendant ce conflit."
 MacArthur_Dismissal.2.d:0 "Le président Truman a exprimé son mécontentement à l'égard du général MacArthur après avoir reçu des nouvelles de l'intervention militaire massive de la Chine en Corée. Il blâme MacArthur pour sa stratégie militaire cavalière et ses déclarations publiques agressives. Il estime que ces actions ont provoqué la réaction de la Chine. Le général MacArthur, de son côté, n'est pas perturbé par cet événement et estime que ses forces sont plus que capables de relever le défi. Certaines informations dans les médias suggèrent que le président n'est pas satisfait de la situation militaire en Corée."
 MacArthur_Dismissal.3.d:0 "Alors que la guerre en Corée continue de s'enliser, le général MacArthur suggère de plus en plus d'étendre le conflit. Il relie la lutte contre le communisme en Asie à celle en Europe et estime que la guerre devrait être élargie pour viser des cibles chinoises sur le continent et protéger Taïwan. Certains de ses commentaires ont été relayés dans les médias, ce qui a conduit à des éditoriaux soutenant cet argument. Il est dit que le président Truman est furieux de ces développements. Il n'est pas d'accord avec cette évaluation et souhaite limiter la guerre à la Corée. En particulier, Truman est préoccupé par les rapports faisant état du déploiement de forces navales de l'ONU vers Taïwan et la côte continentale. Par-dessus tout, Truman a exprimé sa crainte que MacArthur fuite délibérément des informations aux médias."
 MacArthur_Dismissal.4.d:0 "Le président Truman a exigé que le général MacArthur modère ses commentaires publics et sa défense d'un conflit élargi. En particulier, Truman souhaite que MacArthur évite de commenter ou de prendre des décisions liées à la politique étrangère. Truman estime que MacArthur défie le pouvoir exécutif et exerce un pouvoir au-delà de son domaine en tant que commandant militaire. Le général MacArthur serait frustré par le président et son apparent ego. Les tensions montent entre l'exécutif et le commandement militaire en Corée."
 MacArthur_Dismissal.5.d:0 "Le général MacArthur a rédigé un communiqué destiné aux officiers supérieurs sous son commandement concernant le lancement d'opérations offensives contre la Chine. MacArthur affirme que la puissance chinoise est largement exagérée et que le conflit coréen peut être utilisé pour traiter la menace chinoise envers Taïwan et sa tentative de sécuriser un siège au Conseil de sécurité. Le président Truman avait prévu de publier un communiqué similaire et serait furieux contre MacArthur. En particulier, Truman est contrarié par les commentaires relatifs à la politique étrangère. Lui et ses conseillers estiment que MacArthur mine la présidence et étend son commandement militaire au-delà de ce qui est acceptable."
 MacArthur_Dismissal.6.d:0 "Le président Truman a entendu plusieurs dirigeants de pays alliés qui ont exprimé des préoccupations concernant le général MacArthur. Ils affirment que sa vision du monde est contraire à la leur et qu'ils craignent que son jugement ne fasse éclater le conflit coréen en un conflit mondial. Il y a également des inquiétudes concernant ses commentaires dans les médias, qui sont souvent incendiaires. De plus, une préoccupation plus pratique concerne ses ordres, qui parfois semblent presque contredire la politique convenue par les dirigeants politiques. Par exemple, MacArthur a autorisé une opération majeure juste avant de recevoir des ordres lui interdisant d’avancer sur le front, bien qu’il savait que ces ordres arrivaient. Le président Truman a assuré ces dirigeants que le général MacArthur ne dictera pas la politique et que la Maison Blanche contrôle fermement la situation."
 MacArthur_Dismissal.7.d:0 "Le président Truman a récemment été interrogé sur la possibilité d'ordonner de nouvelles offensives en Corée. Le président a déclaré que de telles décisions revenaient au commandant sur le terrain. Le général MacArthur a interprété cela comme une permission et a donné à ses commandants l'autorisation de mener des offensives sur le terrain, sans consulter la Maison Blanche. En apprenant cette nouvelle, le président Truman a de nouveau été agité par l'attitude de MacArthur et estime qu'il a une fois de plus outrepassé son autorité. Le président Truman a décidé de convoquer une réunion de ses hauts dirigeants militaires pour discuter de l'avenir du commandement du général MacArthur. MacArthur continue de donner des ordres et de prendre des mesures qui frôlent les limites de ce qui est acceptable et il est clair qu'il ne peut pas suivre la politique dictée par la Maison Blanche."
 MacArthur_Dismissal.8.d:0 "Le président Truman a tenu une réunion avec le président des chefs d'état-major interarmées, le secrétaire à la Défense, le secrétaire d'État et son principal conseiller pour discuter de l'avenir du général MacArthur. Truman est de plus en plus préoccupé par le fait que MacArthur opère constamment de manière indépendante par rapport à la Maison Blanche et, à certains moments, qu'il a interféré dans la politique étrangère pendant le conflit coréen. Le président des chefs d'état-major et le secrétaire à la Défense ont demandé un jour pour réfléchir. Après avoir consulté les chefs de service, ils ont convenu qu'une mise à l'écart de MacArthur était souhaitable. Avec ces informations, le président Truman a décidé de finalement retirer le général MacArthur de son commandement. Truman a demandé si MacArthur pouvait être relevé de ses fonctions pour insubordination, mais les chefs d'état-major ont déconseillé cela, car MacArthur pourrait alors demander une cour martiale. Ils suggèrent plutôt de simplement le retirer de son poste. Cependant, Truman est très tenté de dénoncer MacArthur pour insubordination afin de démontrer l'autorité exécutive et limiter les critiques publiques. La décision doit être prise."
 MacArthur_Dismissal.9.d:0 "La Maison Blanche a envoyé un message au secrétaire de l'Armée, actuellement en visite en Corée, pour informer le général MacArthur qu'il serait relevé de son poste pour insubordination. Cependant, il y a eu un problème avec les signaux et le secrétaire de l'Armée n'a jamais reçu le message. En conséquence, Truman a informé un journaliste de sa décision, et MacArthur n’a appris la nouvelle que lorsqu’il l’a entendue dans les rapports de presse à Tokyo. En apprenant qu'il avait été relevé pour insubordination, le général MacArthur aurait réagi avec une grande fureur et a déjà exprimé publiquement son intention de demander un procès en cour martiale. Dans ses commentaires aux médias, le président Truman a déclaré qu’il n’avait eu d’autre choix que d’agir, car MacArthur n’était pas contrôlable."
 MacArthur_Dismissal.10.d:0 "La Maison Blanche a envoyé un message au secrétaire de l'Armée, actuellement en visite en Corée, pour informer le général MacArthur qu'il serait relevé de son poste. Cependant, il y a eu un problème avec les signaux et le secrétaire de l'Armée n'a jamais reçu le message. En conséquence, Truman a informé un journaliste de sa décision, et MacArthur n’a appris son renvoi que lorsqu’il a entendu les rapports de presse à Tokyo. Le général MacArthur serait profondément blessé mais obéit à ses ordres de remettre son commandement. Dans son communiqué de presse, le président Truman a reconnu la carrière illustre du général MacArthur, mais a souligné qu’il n’était pas entièrement engagé envers la politique nationale et qu’il devait donc être remplacé. La famille MacArthur prépare son retour aux États-Unis."
 MacArthur_Dismissal.11.d:0 "La nouvelle du renvoi du général MacArthur a provoqué une forte réaction médiatique à travers les États-Unis. De nombreux éditoriaux critiquent le président Truman pour avoir écarté sans cérémonie l'officier le plus décoré de l'histoire américaine. Plusieurs rapports soulignent que c'était sous le leadership de MacArthur que le tournant a eu lieu en Corée, et son renvoi semble être dû à ce qui apparaît comme de la jalousie de la Maison Blanche, et non à des comportements militaires inappropriés. Pour les millions d'Américains qui se souviennent de MacArthur pour ses exploits de guerre ou qui ont servi sous ses ordres pendant ses plus de cinquante ans de carrière dans l'Armée, son éviction est perçue comme une gifle. Seuls quelques grands journaux ont soutenu le président en affirmant que MacArthur avait outrepassé ses limites à trop de reprises et que l'administration n'avait d'autre choix que d'agir ainsi."
 MacArthur_Dismissal.12.d:0 "À son retour à San Francisco en provenance de Corée, le général MacArthur a été accueilli par des officiers militaires supérieurs de la région et a bénéficié d'une parade à laquelle ont assisté plus de 500 000 personnes. Il a ensuite été invité à s'adresser à une session conjointe du Congrès. À son arrivée à Washington, des responsables militaires et gouvernementaux l'ont salué, cependant, le président Truman a snobé le général en ne venant pas l'accueillir. Dans son discours, il a nié tout intérêt pour la partisanerie et a déclaré que son seul désir était et restait de servir son pays. Il a rejeté les accusations de bellicisme en affirmant que peu de gens avaient vu le combat comme lui, et son plus grand désir demeurait la préservation de la paix. Pendant son allocution, il a été interrompu plus de cinquante fois par des ovations. Il a défendu ses actions en Corée et a loué ses réalisations après-guerre avec le Japon. Après le discours, de nombreux représentants et sénateurs ont exprimé leur consternation que Truman ait écarté MacArthur, un officier d'une réussite et d'une classe sans précédent."
 MacArthur_Dismissal.13.d:0 "Après son discours devant le Congrès, le général MacArthur s'est rendu à New York, où il a reçu la plus grande parade de confettis de l'histoire de la ville. Des milliers de personnes sont venues voir le vieux général et l'acclamer pour toutes ses réalisations. Après New York, MacArthur a visité Chicago, où il a pris la parole devant un Soldier Field comble, avec plus de 50 000 personnes présentes. Lors de toutes ces visites, il a défendu ses actions et mis en avant ses accomplissements illustres. Sa capacité à attirer de vastes foules d'une côte à l'autre est également observée par le Parti républicain, qui envisage de prendre sa cause au Sénat. Jusqu'à présent, le général MacArthur a démenti les rumeurs selon lesquelles il envisagerait de se lancer en politique ou de rejoindre le parti."
 MacArthur_Dismissal.14.d:0 "Les commissions sénatoriales des forces armées et des relations étrangères tiennent une enquête sur la guerre en Extrême-Orient et la décision de renvoyer le général MacArthur. De nombreux sénateurs et représentants républicains ont critiqué le président pour son action. Le sénateur Robert Taft a qualifié cette décision de vindicative et précipitée, affirmant qu'elle prouvait à quel point le président Truman était inapte à la fonction présidentielle. Avec les chefs d'état-major, le général MacArthur présentera probablement des preuves lors de l'enquête. Celle-ci déterminera si le président Truman a violé son autorité constitutionnelle lorsqu'il a relevé le général de son poste. Cette enquête représente non seulement un embarras majeur pour le président, mais elle menace également de le rendre vulnérable à un vote de mise en accusation."
 MacArthur_Dismissal.15.d:0 "Le tribunal militaire, demandé par le général MacArthur pour contester les allégations d'insubordination, a rendu une décision en sa faveur. La cour militaire a conclu que, dans tous les incidents cités, il n'avait pas violé la chaîne de commandement militaire ni exécuté des ordres en contradiction avec ceux des chefs d'état-major interarmées. Ils ont noté que, parfois, il avait frôlé cette ligne, mais après un examen approfondi, aucune preuve directe de cela n'a été trouvée. Ce verdict constitue un coup dur majeur pour le président Truman, qui fait actuellement face à une enquête sénatoriale sur sa gestion de la guerre en Corée et sa décision de renvoyer MacArthur. Cependant, la cour a choisi de ne pas rétablir son commandement, bien qu'elle en ait eu la possibilité."
 MacArthur_Dismissal.16.d:0 "L'enquête du Sénat sur le renvoi du général MacArthur a rendu ses conclusions finales. Elles ont conclu que le président Truman n'avait pas violé son autorité constitutionnelle en révoquant MacArthur. Cependant, ils ont noté que les circonstances entourant cette décision ont terni la fierté nationale du peuple américain. L'enquête a également affirmé qu'il n'y avait pas de preuves de désaccords majeurs sur la stratégie militaire entre MacArthur et les chefs d'état-major interarmées. Lors de l'enquête, le général MacArthur a fourni un témoignage puissant pour se défendre, cependant, toutes ses affirmations ont été contredites par les chefs d'état-major, ce qui a considérablement affaibli ses arguments."
 MacArthur_Dismissal.17.d:0 "Dans un développement stupéfiant, l'enquête du Sénat sur la décision du président Truman de relever le général MacArthur de son commandement en Corée a conclu que l'autorité constitutionnelle avait été violée par le président. L'enquête a noté que le général MacArthur avait été révoqué sur des accusations fausses, puisqu'il avait été blanchi lors du récent tribunal militaire, et que le président avait abusé de son autorité pour le faire écarter. Lors de l'enquête, le général MacArthur a témoigné, mais ses déclarations ont été contredites par les chefs d'état-major interarmées. Cependant, l'enquête a souligné que les chefs d'état-major avaient admis qu'ils n'avaient pas recommandé la révocation de MacArthur, contrairement à ce que le président avait suggéré à la presse après coup. Les chefs d'état-major ont seulement déclaré qu'ils étaient d'accord avec la décision. Des représentants républicains ont déposé des articles de mise en accusation à la Chambre des représentants."
 MacArthur_Dismissal.18.d:0 "Le Congrès des États-Unis tient un vote extraordinaire pour décider de la mise en accusation du président Harry Truman. Si le vote est en faveur de la mise en accusation, les articles seront envoyés au Sénat, qui jugera le président. S'il est reconnu coupable, le président sera démis de ses fonctions. Le président Truman est accusé d'avoir abusé de son autorité constitutionnelle en décidant de révoquer le général MacArthur en Corée. On s'attend à ce que les républicains votent en faveur des articles de mise en accusation, et certains redoutent même que certains démocrates soutiennent la mesure, compte tenu du soutien public à MacArthur et du mécontentement du Congrès à l'égard du président. Beaucoup restent frustrés par le fait qu'il n'ait pas cherché l'approbation du Congrès avant d'intervenir en Corée. Dans une déclaration, le président a exprimé sa confiance dans le fait que les accusations fabriquées contre lui ne tiendront pas."
 MacArthur_Dismissal.19.d:0 "Le Congrès des États-Unis a voté en faveur de la mise en accusation du président des États-Unis. Il s'agit d'une situation sans précédent et du dernier chapitre d'une crise constitutionnelle qui secoue la Maison Blanche depuis que le président Truman a décidé de révoquer le général Douglas MacArthur de son commandement en Corée. Beaucoup au sein du Congrès et dans les journaux à travers le pays ont applaudi ce vote, affirmant que la nature vindicative du président et ses actions précipitées démontrent son incapacité à diriger en cette période cruciale pour les États-Unis. La Maison Blanche n'a pas émis de déclaration concernant le vote, car de nombreux analystes estiment qu'ils étaient convaincus que la mesure ne recevrait pas suffisamment de voix. Le général MacArthur a déclaré que ce vote est une victoire pour le système démocratique."
 MacArthur_Dismissal.20.d:0 "Le président des États-Unis, Harry Truman, s'est adressé à la nation par radio pour annoncer sa démission de ses fonctions. Il sera le premier président en exercice à démissionner. Ayant récemment été mis en accusation par le Congrès, le président a compris que le Sénat le trouverait probablement coupable et le retirerait du pouvoir. Dans son discours, le président a déclaré qu'il ne voulait pas infliger davantage de tourments à la nation, surtout compte tenu de la situation internationale. Il a ajouté que sa décision n'était pas une admission de culpabilité, mais un sacrifice pour le bien supérieur du pays. Le vice-président, Alben W. Barkley, prêtera bientôt serment en tant que président. La réaction initiale à son discours est largement positive, les dirigeants politiques et les journaux à travers le pays exprimant leur admiration pour cette décision de mettre fin à la crise au nom de l'unité nationale."
 MacArthur_Dismissal.21.d:0 "Le Congrès des États-Unis a voté contre la mise en accusation du président Harry Truman. Il s'agit d'une grande victoire pour le commandant en chef embourbé dans la tourmente. Il faisait face à des accusations d'abus de l'autorité constitutionnelle concernant sa décision de retirer le très décoré et populaire général Douglas MacArthur de son commandement en Corée. Bien que de nombreux membres du Congrès, en particulier les républicains, aient exprimé leur mécontentement face à ce résultat, il est devenu évident au cours du processus que les accusations n'avaient pas suffisamment de fondement pour retourner le Congrès contre le président. Bien que le président Truman ait survécu à cette épreuve, l'attention négative et la colère publique suscitées par sa décision rendront ses chances de réélection beaucoup plus difficiles."
 MacArthur_Dismissal.22.d:0 "Le général Douglas MacArthur continue de faire des déclarations à la presse et de s'adresser à des foules au sujet de sa révocation de son commandement en Corée. Bien qu'il reste immensément populaire en raison de ses cinq décennies de service militaire, ses attaques incessantes contre Truman perdent de leur force. De nombreux Américains qui voyaient MacArthur comme un potentiel candidat à la présidence commencent à perdre de l'intérêt, car MacArthur semble ne pas avoir de vision claire pour l'avenir du pays au-delà de son désir de voir Truman échouer."
 MacArthur_Dismissal.23.d:0 "Suite à la décision du Congrès de mettre en accusation le président Truman, le général Douglas MacArthur a intensifié ses apparitions publiques et ses interviews médiatiques. De nombreux Américains le considèrent désormais comme une victime d'abus exécutifs et se rassemblent autour de lui. Maintenant que Truman a été évincé, MacArthur passe plus de temps à discuter de sa vision pour l'Amérique et de sa place dans le monde. Sa perspective de voir le communisme de manière plus globale et lié à l'Asie résonne auprès de nombreux électeurs américains. Il y a même des rumeurs selon lesquelles il tiendrait des discussions avec des dirigeants républicains clés concernant une éventuelle candidature à la présidence."
 MacArthur_Dismissal.24.d:0 "La Convention nationale républicaine va bientôt se réunir pour choisir un candidat à la présidence, mais elle est dans une impasse concernant son choix d'endossement. Beaucoup au sein du parti considèrent cette élection comme une occasion en or de saisir la présidence après des décennies de domination démocrate. Les républicains sont divisés entre le sénateur Robert Taft et le légendaire général Dwight D. Eisenhower. Les principaux leaders républicains appellent désormais le général MacArthur à commencer sa campagne pour l'endossement, afin de briser cette impasse, car sa récente controverse avec le président Truman l'a propulsé au rang de figure nationale que tous les républicains peuvent soutenir."
 MacArthur_Dismissal.25.d:0 "Après mûre réflexion, le général Douglas MacArthur a décidé de briguer ouvertement la nomination à la présidence du Parti républicain. Sa décision de se lancer dans la course a brisé l'impasse pour la nomination, et beaucoup au sein du parti se sont rapidement rangés derrière le général. MacArthur lui-même a déclaré qu'en tant qu'homme militaire, il avait longtemps rejeté l'idée de s'impliquer en politique, mais, compte tenu de l'état de la nation, il considérait qu'il rendrait un mauvais service en ne répondant pas à l'appel. Le Parti démocrate serait profondément préoccupé, surtout que le général MacArthur est actuellement sur une vague de popularité après la mise en accusation et la démission de son ennemi juré, le président Truman."
 MacArthur_Dismissal.26.d:0 "Le général MacArthur a informé les dirigeants républicains qu'il ne ferait pas campagne activement pour la nomination à la présidence. Cependant, si cette nomination lui était offerte, il la considérerait. Pour de nombreux républicains qui soutiennent le général, cela représente un revers majeur et un obstacle. Il est désormais très improbable qu'il reçoive la nomination, et le parti devra briser son impasse et choisir entre le sénateur Robert Taft et le général Dwight D. Eisenhower. Le général MacArthur a indiqué en privé que, le moment venu, il soutiendrait Taft. Il semble donc que le général MacArthur se retire désormais tranquillement dans sa retraite aux Waldorf Towers."
 usanews.3.d:0 "En [GetDateText] l'accident le plus grave de l'histoire de l'industrie de l'énergie nucléaire aux États-Unis a commencé lorsque la vanne de pression du réacteur de l'Unité 2 de Three Mile Island n'a pas pu se fermer. L'eau de refroidissement, contaminée par des radiations, a fui par la vanne ouverte et s'est déversée dans des bâtiments voisins, tandis que le cœur du réacteur commençait à surchauffer dangereusement. Après que l'eau de refroidissement a commencé à s'écouler de la vanne de pression défectueuse, les pompes de refroidissement d'urgence ont automatiquement démarré. Cependant, les opérateurs humains dans la salle de contrôle ont mal interprété des indications contradictoires et ont éteint le système d'eau d'urgence. Le réacteur a également été arrêté, mais la chaleur résiduelle du processus de fission continuait d'être libérée.\nPeu après 8 h du matin, la nouvelle de l'accident a été divulguée au public. La société mère de la centrale, Metropolitan Edison, a minimisé la crise et a affirmé qu'aucune radiation n'avait été détectée en dehors de l'enceinte de la centrale. Cependant, le même jour, des inspecteurs ont détecté des niveaux de radiation légèrement augmentés à proximité en raison de la fuite d'eau contaminée. Le gouverneur de la Pennsylvanie, Dick Thornburgh, a envisagé d'ordonner une évacuation. Finalement, vers 20 h, les opérateurs de la centrale ont réalisé qu'ils devaient remettre de l'eau en circulation dans le cœur du réacteur et ont redémarré les pompes. La température a commencé à baisser et la pression dans le réacteur a diminué. Le réacteur avait frôlé une fusion complète. Plus de la moitié du cœur avait été détruite ou fondue.\nDeux jours plus tard, une bulle de gaz hydrogène hautement inflammable a été découverte dans le bâtiment du réacteur. Après la découverte de la fuite radioactive, les résidents ont été conseillés de rester à l'intérieur. Les experts étaient incertains quant à savoir si la bulle d'hydrogène provoquerait une nouvelle fusion ou peut-être une énorme explosion, et par précaution, le gouverneur Thornburgh a conseillé \"aux femmes enceintes et aux enfants d'âge préscolaire de quitter la zone dans un rayon de cinq miles autour de la centrale de Three Mile Island jusqu'à nouvel ordre.\" Cela a provoqué la panique que le gouverneur avait voulu éviter ; en quelques jours, plus de 100 000 personnes ont fui les villes environnantes. Lentement, l'hydrogène a été évacué du système à mesure que le réacteur refroidissait et quelques jours plus tard, toute cette épreuve était terminée."
 usanews.4.d:0 "L'accident grave survenu à l'Unité 2 de Three Mile Island, près de Harrisburg, en Pennsylvanie, a été causé par une défaillance d'une vanne importante, ce qui a entraîné la perte d'eau de refroidissement vers le cœur du réacteur. Une partie du cœur a fondu et le reste a été détruit, tandis qu'une grande quantité de produits de fission a été libérée du système primaire du réacteur vers l'intérieur de la structure de confinement. La défaillance de l'équipement a été aggravée par une erreur de l'opérateur du réacteur, car le système de refroidissement d'urgence du cœur a été désactivé par l'action de l'opérateur en raison d'une mauvaise interprétation du type d'accident en cours.\nLa société mère de la centrale a minimisé la crise en affirmant qu'aucune radiation n'avait été détectée en dehors de la centrale, mais le même jour, des inspecteurs ont détecté des niveaux de radiation légèrement augmentés à proximité.\nAu plus fort de la crise, les travailleurs de la centrale ont été exposés à des niveaux de radiation non sûrs, mais personne en dehors de Three Mile Island n'a vu sa santé affectée par l'accident. Néanmoins, cet incident a considérablement érodé la confiance du public dans l'énergie nucléaire."