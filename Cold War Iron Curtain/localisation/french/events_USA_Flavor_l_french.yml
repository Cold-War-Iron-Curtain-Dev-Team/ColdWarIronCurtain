l_french: 
 MacArthur_Dismissal.1.d:0 "Alors que les combats s'intensifient en Corée, le président Truman a appelé le général MacArthur à exprimer ses inquiétudes face aux informations faisant état d'un important renforcement militaire chinois à la frontière. Le général MacArthur a assuré au président qu'une telle possibilité était hautement improbable. Il a cité le manque de base industrielle et l'épuisement militaire dû à la guerre civile comme quelques-unes des raisons pour lesquelles la Chine ne s'impliquerait pas. Le président Truman a accepté ces conseils et est plus confiant que jamais dans le leadership de MacArthur pendant ce conflit."
 MacArthur_Dismissal.2.d:0 "Le président Truman a exprimé son mécontentement à l'égard du général MacArthur après avoir reçu la nouvelle de l'intervention militaire chinoise massive en Corée. Il reproche à MacArthur sa stratégie militaire cavalière et ses déclarations publiques agressives. Il estime que ces actions ont incité les Chinois à agir. Le général MacArthur n'est pas perturbé par cette évolution et estime que ses forces sont plus que capables de relever le défi. Certains médias ont rapporté que le président n'était pas satisfait de la situation militaire en Corée."
 MacArthur_Dismissal.3.d:0 "Alors que la guerre de Corée continue de s'éterniser, le général MacArthur suggère de plus en plus que le conflit s'étende. Il relie la lutte contre le communisme en Asie à celle de l'Europe et estime que la guerre devrait être étendue pour cibler des cibles chinoises continentales et protéger Taiwan. Certains de ces commentaires ont trouvé leur chemin dans les médias et ont donné lieu à des éditoriaux soutenant cet argument. Le président Truman serait furieux de ces développements. Il n'est pas d'accord avec cette évaluation et souhaite limiter la guerre à la Corée. Truman est particulièrement préoccupé par les informations faisant état du déploiement de forces navales de l'ONU vers Taiwan et la côte continentale. Par-dessus tout, Truman a exprimé sa crainte que MacArthur ne divulgue délibérément des informations aux médias."
 MacArthur_Dismissal.4.d:0 "Le président Truman a demandé au général MacArthur de freiner ses commentaires publics et son plaidoyer en faveur d'un conflit plus large. Truman souhaite notamment que MacArthur évite de commenter ou de prendre des décisions liées à la politique étrangère. Truman pense que MacArthur défie le pouvoir exécutif et exerce un pouvoir au-delà de son domaine de commandant militaire. Le général MacArthur serait frustré par le président et son ego apparent. Les tensions montent entre le pouvoir exécutif et le commandement militaire en Corée."
 MacArthur_Dismissal.5.d:0 "Le général MacArthur a rédigé un communiqué à l'intention des officiers supérieurs sous son commandement concernant le lancement d'opérations offensives contre la Chine. MacArthur affirme que la puissance chinoise est grandement exagérée et que le conflit coréen peut être utilisé pour faire face à la menace chinoise contre Taiwan et à ses efforts pour obtenir un siège au Conseil de sécurité. Le président Truman avait prévu de publier un communiqué similaire et serait furieux contre MacArthur. Truman est particulièrement mécontent des commentaires liés à la politique étrangère. Lui et ses conseillers pensent que MacArthur sape la présidence et étend son commandement militaire au-delà des limites acceptables."
 MacArthur_Dismissal.6.d:0 "Le président Truman a entendu plusieurs hauts dirigeants d'États alliés exprimer leurs inquiétudes concernant le général MacArthur. Ils affirment que sa vision du monde est contradictoire avec la leur et craignent que son jugement ne fasse exploser le conflit coréen en un conflit mondial. Ses commentaires aux médias suscitent également des inquiétudes, car ils sont souvent incendiaires. Ce qui est plus préoccupant, c'est le fait qu'il donne des ordres qui contredisent parfois presque la politique convenue par les dirigeants politiques. Dans un exemple, MacArthur a autorisé une opération majeure juste avant de recevoir l'ordre de ne pas avancer sur le front, même s'il savait que ces ordres allaient arriver. Le président Truman a assuré à ces dirigeants que le général MacArthur ne dicterait pas la politique et que la Maison Blanche contrôlait fermement la situation."
 MacArthur_Dismissal.7.d:0 "On a récemment demandé au président Truman s'il ordonnerait davantage d'offensives en Corée. Le président a déclaré que ces décisions relevaient du commandant sur le terrain. Le général MacArthur a pris cela comme une autorisation et a donné à ses commandants la permission de mener des offensives sur le terrain, sans consulter la Maison Blanche. En apprenant cette nouvelle, le président Truman s'est de nouveau montré en colère contre MacArthur et estime qu'il a une fois de plus outrepassé son autorité. Le président Truman a décidé de convoquer une réunion de ses hauts responsables militaires pour discuter du futur commandement du général MacArthur. MacArthur émet continuellement des ordres et des actions qui sont à la limite de l'acceptable et il ne peut clairement pas suivre la politique dictée par la Maison Blanche."
 MacArthur_Dismissal.8.d:0 "Le président Truman a tenu une réunion avec le président des chefs d'état-major interarmées, le secrétaire à la Défense, le secrétaire d'État et son principal conseiller pour discuter de l'avenir du général MacArthur. Truman s'inquiète de plus en plus du fait que MacArthur continue d'agir indépendamment de la Maison Blanche et s'est parfois immiscé dans la politique étrangère pendant le conflit coréen. Le président des chefs d'état-major interarmées et le secrétaire à la Défense ont demandé une journée pour réfléchir. Après avoir consulté les chefs de service, ils ont convenu qu'une relève de MacArthur était souhaitable. Fort de cette information, le président Truman a décidé de relever définitivement le général MacArthur de son commandement. Le président Truman a demandé si MacArthur pouvait être relevé pour insubordination, les chefs d'état-major l'ont déconseillé car MacArthur pourrait alors demander une cour martiale, mais ils suggèrent qu'il soit simplement relevé. Cependant, Truman est très tenté de dénoncer MacArthur pour insubordination afin de démontrer son autorité exécutive et de limiter les critiques du public. La décision doit être prise."
 MacArthur_Dismissal.9.d:0 "La Maison Blanche a envoyé un message au secrétaire de l'Armée, actuellement en visite en Corée, pour informer le général MacArthur qu'il serait soulagé de son insubordination. Cependant, il y a eu un problème avec les signaux et le secrétaire de l'Armée n'a jamais reçu le message. Au lieu de cela, Truman a informé un journaliste de sa décision et MacArthur ne l'a découvert que lorsqu'il a entendu la nouvelle dans les reportages à Tokyo. En apprenant qu'il avait été relevé pour insubordination, le général MacArthur aurait réagi avec fureur et il aurait déjà publiquement évoqué son intention d'être jugé devant une cour martiale. Dans ses commentaires aux médias, le président Truman a déclaré qu'il n'avait d'autre choix que d'agir car MacArthur n'était pas contrôlable."
 MacArthur_Dismissal.10.d:0 "La Maison Blanche a envoyé un message au secrétaire de l'Armée, actuellement en visite en Corée, pour informer le général MacArthur qu'il serait relevé. Cependant, il y a eu un problème avec les signaux et le secrétaire de l'Armée n'a jamais reçu le message. Au lieu de cela, Truman a informé un journaliste de sa décision et MacArthur ne l'a découvert que lorsqu'il a entendu des informations à Tokyo sur son licenciement. Le général MacArthur serait profondément blessé mais se conforme à ses ordres de remettre son commandement. Dans son communiqué de presse, le président Truman a reconnu l'illustre carrière du général MacArthur, mais a noté qu'il n'était pas entièrement engagé dans la politique nationale et qu'il devait donc être remplacé. La famille MacArthur envisage de retourner aux États-Unis."
 MacArthur_Dismissal.11.d:0 "La nouvelle selon laquelle le général MacArthur a été relevé de ses fonctions a provoqué de nombreuses réactions négatives dans les médias à travers les États-Unis. De nombreux éditoriaux critiquent le président Truman pour avoir destitué sans cérémonie l'officier le plus décoré de l'histoire américaine. De nombreux rapports indiquent que c'est le leadership de MacArthur qui a inversé la tendance en Corée et que son soulagement était dû à ce qui semble être une jalousie de la Maison Blanche et non une conduite militaire. Pour les millions d'Américains qui se souviennent de MacArthur pour ses exploits en temps de guerre ou qui ont servi sous ses ordres pendant plus de cinquante ans dans l'armée, sa destitution est considérée comme une gifle. Seuls quelques grands journaux ont soutenu le président en affirmant que MacArthur avait dépassé ses limites une fois de trop et que l'administration n'avait qu'un seul choix."
 MacArthur_Dismissal.12.d:0 "À son retour de Corée à San Francisco, le général MacArthur a été accueilli par des officiers supérieurs de l'armée de la région et a assisté à un défilé auquel ont participé un demi-million de personnes. Il a ensuite été invité à prendre la parole lors d'une session conjointe au Congrès. À son atterrissage à Washington DC, de hauts responsables militaires et gouvernementaux l'ont salué, mais le président Truman a insulté le général en ne l'accueillant pas. Dans son discours, il a nié tout intérêt partisan et a plutôt déclaré que son seul désir était et demeure de servir son pays. Il a nié les affirmations selon lesquelles il était un belliciste en affirmant que peu de gens avaient vu des combats comme lui et que son plus grand désir restait de préserver la paix. Lors de son discours, il a été interrompu plus de cinquante fois par des ovations. Il a défendu ses actions en Corée et a loué ses réalisations d'après-guerre avec le Japon. Après le discours, de nombreux représentants et sénateurs ont exprimé leur consternation à l'idée que Truman destitue MacArthur, un officier aux réalisations et à la classe sans précédent."
 MacArthur_Dismissal.13.d:0 "Après s'être adressé au Congrès, le général MacArthur s'est envolé pour New York où il a assisté au plus grand défilé de téléscripteurs de l'histoire de la ville. Des milliers de personnes sont venues voir le vieux général et l'acclamer pour toutes ses réalisations. Après New York, MacArthur s'est rendu à Chicago où il s'est adressé à un Soldier Field bondé avec plus de 50 000 participants. Au cours de toutes ces visites, il a défendu ses actions et souligné ses illustres réalisations. Sa capacité à attirer des foules immenses d'un océan à l'autre est également examinée par le Parti républicain, qui envisage de défendre sa cause au Sénat. Jusqu'à présent, le général MacArthur a démenti les rumeurs selon lesquelles il aurait l'intention de se lancer en politique ou de rejoindre le parti."
 MacArthur_Dismissal.14.d:0 "La commission sénatoriale des forces armées et la commission sénatoriale des relations étrangères mènent une enquête sur la guerre en Extrême-Orient et sur la décision de limoger le général MacArthur. De nombreux sénateurs et représentants républicains ont critiqué le président pour son action. Le sénateur Robert Taft a qualifié la décision de vindicative et de hâtive, affirmant qu'elle prouvait à quel point le président Truman était inapte à occuper ce poste. Aux côtés des chefs d'état-major, le général MacArthur présentera probablement des preuves à l'enquête. L'enquête déterminera si le président Truman a violé son autorité constitutionnelle en destituant le général. L'enquête constitue non seulement un embarras majeur pour le président, mais menace également de le rendre vulnérable à un vote de destitution."
 MacArthur_Dismissal.15.d:0 "La cour martiale sollicitée par le général MacArthur pour contester les allégations d'insubordination a tranché en sa faveur. Le tribunal militaire a estimé que dans tous les incidents cités, il n'avait pas violé la chaîne de commandement militaire ni exécuté d'ordres en contradiction avec les chefs d'état-major interarmées. Ils ont remarqué qu'il s'en rapprochait parfois, mais après un examen approfondi, il n'y avait aucune preuve directe de cela. Ce résultat constitue un coup dur pour le président Truman, qui fait actuellement l'objet d'une enquête du Sénat sur sa gestion de la guerre en Corée et sa décision de licencier MacArthur. Le tribunal a toutefois choisi de ne pas rétablir son commandement, même s'il en avait la possibilité."
 MacArthur_Dismissal.16.d:0 "L'enquête du Sénat sur le licenciement du général MacArthur est parvenue à ses conclusions finales. Ils ont conclu que le président Truman n'avait pas violé l'autorité constitutionnelle en relevant MacArthur. Cependant, ils ont noté que les circonstances dans lesquelles cela s'est produit ont porté atteinte à la fierté nationale du peuple américain. L'enquête a également affirmé qu'il n'y avait aucune preuve de désaccords majeurs sur la stratégie militaire entre MacArthur et les chefs d'état-major. Au cours de l'enquête, le général MacArthur a fourni un témoignage puissant pour se défendre, mais toutes ses affirmations ont été réfutées par les chefs d'état-major, affaiblissant considérablement ses arguments."
 MacArthur_Dismissal.17.d:0 "Fait étonnant, l'enquête du Sénat sur la décision du président Truman de relever le général MacArthur de son commandement en Corée a conclu que l'autorité constitutionnelle avait été violée par le président. L'enquête a révélé que le général MacArthur avait été démis de ses fonctions sur la base de fausses accusations, puisqu'il avait été disculpé lors de la récente cour martiale, et que le président avait abusé de son autorité pour le faire destituer. Au cours de l'enquête, le général MacArthur a donné un témoignage qui a été contré par les chefs d'état-major, cependant, l'enquête a noté que les chefs d'état-major ont admis qu'ils n'avaient pas recommandé la destitution de MacArthur, comme le président l'a suggéré à la presse par la suite. Les chefs d'état-major ont seulement déclaré qu'ils étaient d'accord avec la décision. Les représentants républicains ont présenté des articles de mise en accusation à la Chambre."
 MacArthur_Dismissal.18.d:0 "Le Congrès américain organise un vote extraordinaire sur l'opportunité de destituer le président Harry Truman. Si le vote est réussi, les articles de mise en accusation seront transmis au Sénat qui jugera le président. S'il est reconnu coupable, le président sera démis du pouvoir. Le président Truman est accusé d'avoir abusé de l'autorité constitutionnelle en décidant de relever le général MacArthur en Corée. Les Républicains devraient voter pour les articles et on craint que même certains Démocrates puissent soutenir la mesure compte tenu du soutien public à MacArthur ainsi que du mépris du Congrès à l'égard du Président. Beaucoup sont encore contrariés par le fait qu'il n'ait pas demandé l'approbation du Congrès avant d'intervenir en Corée. Dans une déclaration, le président s'est déclaré convaincu que les accusations fabriquées de toutes pièces contre lui ne tiendraient pas."
 MacArthur_Dismissal.19.d:0 "Le Congrès des États-Unis a voté la destitution du président des États-Unis. Il s'agit d'une situation sans précédent et du dernier chapitre d'une crise constitutionnelle qui secoue la Maison Blanche depuis que le président Truman a décidé de relever le général Douglas MacArthur du commandement en Corée. De nombreux membres du Congrès et des journaux à travers le pays ont applaudi le vote, affirmant que la nature vindicative du président et ses actions irréfléchies démontraient son incapacité à diriger en cette période cruciale pour les États-Unis. La Maison Blanche n'a publié aucune déclaration sur le vote, car de nombreux analystes pensaient qu'ils étaient convaincus que la mesure ne recevrait pas suffisamment de voix. Le général MacArthur a déclaré que ce vote était une victoire pour le système démocratique."
 MacArthur_Dismissal.20.d:0 "Le président des États-Unis, Harry Truman, s'est adressé à la nation à la radio pour annoncer sa démission. Il sera le premier président en exercice à démissionner de ses fonctions. Ayant récemment été destitué par le Congrès, le président s'est rendu compte que le Sénat le déclarerait probablement coupable et le destituerait du pouvoir. Dans son discours, le Président a déclaré qu'il ne voulait plus plonger la nation dans la tourmente, surtout compte tenu de la situation internationale. Il a ajouté que sa décision n'était pas un aveu de culpabilité mais un sacrifice pour le plus grand bien du pays. Le vice-président, Alben W. Barkley prêtera bientôt le serment de président. La première réaction au discours a été largement positive, les dirigeants politiques et les journaux de tout le pays ayant exprimé leur admiration pour la décision de mettre fin à la crise dans l'intérêt de l'unité nationale."
 MacArthur_Dismissal.21.d:0 "Le Congrès américain a voté contre la destitution du président Harry Truman. Il s'agit d'une victoire majeure pour le commandement en chef en difficulté. Il faisait face à des accusations d'abus de l'autorité constitutionnelle suite à sa décision de retirer du commandement en Corée le très décoré et populaire général Douglas MacArthur. Bien que de nombreux membres du Congrès, en particulier les républicains, aient exprimé leur consternation face au résultat, il est apparu clairement au cours du processus que les accusations n'étaient pas suffisamment fondées pour retourner le Congrès contre le président. Même si le président Truman a survécu à cette épreuve, l'attention négative et la colère du public suscitées par sa décision rendront ses chances de réélection bien plus difficiles."
 MacArthur_Dismissal.22.d:0 "Le général Douglas MacArthur continue de faire des déclarations aux médias et de s'adresser au public au sujet de son renvoi du commandement en Corée. Bien qu'il reste immensément populaire en raison de ses cinq décennies de service militaire, ses attaques constantes contre Truman perdent de leur pouvoir. De nombreux Américains qui considéraient MacArthur comme un candidat potentiel à la présidentielle perdent tout intérêt, car MacArthur ne semble pas avoir une vision claire de l'avenir du pays au-delà de son désir de voir Truman perdre."
 MacArthur_Dismissal.23.d:0 "Suite à la décision du Congrès de destituer le président Truman, le général Douglas MacArthur a multiplié ses apparitions publiques et ses interviews dans les médias. De nombreux Américains le considèrent désormais comme une victime des abus de la direction et se rallient à lui. Maintenant que Truman a été démis de ses fonctions, MacArthur passe plus de temps à discuter de sa vision de l'Amérique et de sa place dans le monde. Sa vision d'un communisme plus global et connecté à l'Asie trouve un écho parmi de nombreux électeurs américains. Il y a même des rumeurs selon lesquelles il serait en pourparlers avec des dirigeants républicains clés sur une éventuelle campagne présidentielle."
 MacArthur_Dismissal.24.d:0 "La Convention nationale républicaine se réunira bientôt pour choisir un candidat à la présidence, mais elle est dans l'impasse quant au choix du candidat à soutenir. De nombreux membres du parti considèrent ces élections comme une occasion en or de s'emparer de la présidence après des décennies de contrôle démocrate. Les républicains sont divisés entre le sénateur Robert Taft et le légendaire général Dwight D. Eisenhower. Les principaux dirigeants républicains appellent désormais le général MacArthur à lancer une campagne en faveur de l'approbation afin de sortir de l'impasse, car sa récente controverse avec le président Truman a fait de lui une figure nationale que tous les républicains peuvent soutenir."
 MacArthur_Dismissal.25.d:0 "Après mûre réflexion, le général Douglas MacArthur a décidé de solliciter ouvertement la nomination à la présidence auprès du Parti républicain. Sa décision de se joindre à la course a permis de sortir de l'impasse pour l'investiture et de nombreux membres du parti ont rapidement soutenu le général. MacArthur lui-même a déclaré qu'en tant que militaire, il avait longtemps refusé de s'impliquer dans la politique, mais que, compte tenu de l'état de la nation, il ne rendrait pas service en ne répondant pas à l'appel. Le Parti démocrate serait très préoccupé, d'autant plus que le général MacArthur est actuellement en pleine forme suite à la destitution et à la démission de son ennemi juré, le président Truman."
 MacArthur_Dismissal.26.d:0 "Le général MacArthur a informé les dirigeants républicains qu'il ne ferait pas campagne activement pour l'investiture du président. Mais si on le lui donnait, il y réfléchirait. Pour de nombreux républicains qui soutiennent le général, cela constitue un revers et un obstacle majeur. Il est désormais très peu probable qu'il reçoive la nomination et le parti devra sortir de l'impasse et choisir entre le sénateur Robert Taft et le général Dwight D. Eisenhower. Le général MacArthur a indiqué en privé que le moment venu, il soutiendrait Taft. Il semble que le général MacArthur va désormais profiter tranquillement de sa retraite aux tours Waldorf."
 usanews.3.d:0 "À [GetDateText], le pire accident de l'histoire de l'industrie nucléaire américaine a commencé lorsqu'une soupape de pression dans le réacteur de l'unité 2 de Three Mile Island n'a pas réussi à se fermer. L'eau de refroidissement, contaminée par les radiations, s'écoulait de la vanne ouverte vers les bâtiments voisins, et le noyau commençait à surchauffer dangereusement. Une fois que l'eau de refroidissement a commencé à s'écouler de la soupape de pression cassée, les pompes de refroidissement d'urgence se sont automatiquement mises en service. Cependant, les opérateurs humains dans la salle de contrôle ont mal interprété les lectures confuses et contradictoires et ont coupé le système d'eau d'urgence. Le réacteur a également été arrêté, mais la chaleur résiduelle du processus de fission était toujours libérée.\n Peu après 8 heures du matin, la nouvelle de l'accident a été divulguée au monde extérieur. La société mère de l'usine, Metropolitan Edison, a minimisé la crise et affirmé qu'aucun rayonnement n'avait été détecté en dehors de l'usine, mais le même jour, les inspecteurs ont détecté une légère augmentation des niveaux de rayonnement à proximité en raison de la fuite d'eau contaminée. Le gouverneur de Pennsylvanie, Dick Thornburgh, a envisagé de demander une évacuation. Finalement, vers 20 heures, les exploitants de l'usine ont réalisé qu'ils devaient à nouveau faire circuler l'eau dans le noyau et ont redémarré les pompes. La température a commencé à baisser et la pression dans le réacteur a été réduite. Le réacteur était survenu moins d'une heure après une fusion complète. Plus de la moitié du noyau a été détruit ou fondu.\nCependant, deux jours plus tard, une bulle d'hydrogène gazeux hautement inflammable a été découverte dans le bâtiment réacteur. Après la découverte de la fuite radioactive, il a été conseillé aux résidents de rester à l'intérieur. Les experts ne savaient pas si la bulle d'hydrogène créerait une nouvelle fusion ou éventuellement une explosion géante, et par mesure de précaution, le gouverneur Thornburgh a conseillé « aux femmes enceintes et aux enfants d'âge préscolaire de quitter la zone dans un rayon de huit kilomètres autour des installations de Three Mile Island jusqu'à nouvel ordre ». Cela a conduit à la panique que le gouverneur avait espéré éviter ; en quelques jours, plus de 100 000 personnes ont fui les villes environnantes. Lentement, l'hydrogène a été purgé du système à mesure que le réacteur refroidissait et quelques jours plus tard, toute cette épreuve était terminée."
 usanews.4.d:0 "L'unité 2 de Three Mile Island, près de Harrisburg, en Pennsylvanie, aux États-Unis, a subi un grave accident. En raison du dysfonctionnement d'une vanne importante, l'eau de refroidissement du coeur a été perdue, des parties du coeur ont fondu et le reste a été détruit, et une grande quantité de produits de fission a été rejetée du système du réacteur primaire vers l'intérieur de la structure de confinement. La panne de l'équipement a été exacerbée par une erreur de l'opérateur du réacteur, le système de refroidissement d'urgence du coeur ayant été désactivé par l'opérateur en raison d'une mauvaise interprétation du type d'accident en cours.\nLa société mère de l'usine a minimisé la crise et affirmé qu'aucun rayonnement n'avait été détecté en dehors de l'usine, mais le même jour, les inspecteurs ont détecté des niveaux de rayonnement légèrement accrus à proximité.\nAu plus fort de la crise, les travailleurs de l'usine ont été exposés à des niveaux de radiations malsains, mais personne en dehors de Three Mile Island n'a vu sa santé affectée par l'accident. Néanmoins, l'incident a considérablement érodé la confiance du public dans l'énergie nucléaire."