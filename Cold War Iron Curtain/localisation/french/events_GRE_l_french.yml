 greece.0.t:0 "Décès d'un Premier ministre"
 greece.0.d:0 "Aujourd'hui, la Grèce pleure l'un de ses enfants. Themistoklis Sofoulis, notre premier ministre est décédé à l'âge de 88 ans. Il est né en 1860 à Vathy sur l'île de Samos. Il étudie la philosophie à l'Université nationale et capodistrienne d'Athènes puis part en Allemagne où il se spécialise en archéologie. Il est entré dans l'arène politique grecque après la déclaration d'union entre Samos et la Grèce en 1913. Avant cela, il était impliqué dans la politique samienne et a joué un grand rôle dans le processus d'union. Lors des élections de mai 1915, Sofoulis fut élu député au parlement grec et fut ministre de l'Intérieur sous Eleftherios Venizelos. Lorsqu'en 1920 Venizelos s'exila, Sofoulis prit la direction du parti. En 1924, il devient pour la première fois Premier ministre. Durant l'entre-deux-guerres, Sofoulis était l'une des principales personnalités politiques de la Grèce. Après la capitulation de la Grèce face à l'Axe en 1941, Sofoulis resta passif comme presque tous les hommes politiques grecs. Après la Libération, il devient Premier ministre jusqu'en avril 1946 et tente d'empêcher le déclenchement de la guerre civile. Cependant, ses efforts ont échoué et il s'est donc abstenu de faire de la politique pendant une courte période. Le 7 septembre 1947, il redevient Premier ministre dans un gouvernement de coalition composé du Parti libéral et du Parti populaire. Sofoulis a entrepris de nouveaux efforts pour mettre fin à la guerre civile, en proposant à l'EAM une amnistie générale et un nouveau gouvernement de coalition entre lui et son parti. Cependant, ces propositions ont été rejetées sous la forte pression des États-Unis et la guerre civile a ainsi suivi son cours."
 greece.0.r:0 "Une triste journée..."
 greece.1.t:0 "Alexandros Diomidis"
 greece.1.d:0 "Après le décès de Themistoklis Sofoulis, Alexandros Diomidis, vice-président du cabinet, devient Premier ministre par intérim"
 greece.1.r:0 "Nous verrons comment cela se passe.."
 greece.2.t:0 "Alexandros Diomidis reste Premier ministre"
 greece.2.d:0 "Après quelques jours de négociations, le Laiko Komma et le Komma Fileleutheros ont convenu de soutenir Alexandros Diomidis comme successeur de Sofoulis au poste de Premier ministre. Diomidis prend ses fonctions le 30 juillet 1949, alors que la guerre civile continue."
 greece.2.r:0 "Des jours difficiles pour Diomidis..."
 greece.3.t:0 "Unir la faction démocratique"
 greece.3.d:0 "L'ancienne faction vénizéliste est toujours divisée en plusieurs partis, plus ou moins grands. Cela rend très difficile de contrarier la droite qui, même si elle est désormais dans l'opposition, semble se renforcer de jour en jour. Nous nous sommes efforcés à plusieurs reprises de réunir les différents vénizélistes en un seul parti, mais nos tentatives ont échoué. Cependant, une dernière chance d'atteindre cet objectif impossible reste à venir..."
 greece.4.t:0 "Débat sur la réforme électorale"
 greece.4.d:0 "Il est largement reconnu que notre système électoral actuel n'a pas réussi à doter le pays de gouvernements stables, capables de remplir leur mandat. En conséquence, de plus en plus de voix s'élèvent en faveur d'une réforme radicale du système actuel. Ils soutiennent qu'il est essentiel pour l'avenir de la Grèce d'évoluer vers un système majoritaire renforcé afin de se doter de gouvernements stables et de s'éloigner des fragiles majorités parlementaires multipartites. En outre, l'ambassade américaine et le palais sont clairement favorables au système majoritaire renforcé. Il ne serait pas judicieux de s'y opposer. Cependant, derrière le système proposé se cachent des dangers. Il faut oublier que le parti Papagos est arrivé premier aux élections, même s'il n'a pas réussi à former un gouvernement. En adoptant le système majoritaire renforcé, nous pourrions sans le savoir lui donner une forte majorité de parti unique au prochain parlement. "
 greece.6.t:0 "Décès d'Alexandros Papagos"
 greece.6.d:0 "En janvier 1955, le Premier ministre Alexandros Papagos commença à développer des problèmes gastriques, conséquence de son précédent emprisonnement pendant la guerre. Ainsi, il a nommé Stefanopoulos au poste de Premier ministre provisoire jusqu'à ce qu'il surmonte sa maladie. Cependant, l'état de Papagos n'a cessé de s'aggraver, jusqu'à aujourd'hui, lorsque notre premier ministre a rendu son dernier souffle à cause d'une grave hémorragie pulmonaire."
 greece.7.t:0 "Karamanlis est devenu Premier ministre"
 greece.7.d:0 "Après la mort de Papago, le roi Paul, dans un geste surprenant, nomme Konstantinos Karamanlis au poste de Premier ministre. La nomination de Karamanlis a surpris la vie politique grecque, car le roi a contourné deux membres importants du parti Papagos, Stephanos Stephanopoulos et Panagiotis Kanellopoulos qui étaient largement considérés comme des successeurs potentiels de Papagos. Après être devenu Premier ministre, Karamanlis a réorganisé l'Ellinikos Synagermos sous le nom d'Ethniki Rizospastiki Enosi."
 greece.8.d:0 "Ce matin, nous avons reçu des récits horribles selon lesquels une série de tremblements de terre d'une magnitude combinée d'environ 6,8 a frappé les îles ioniennes de Céphalonie et de Zakynthos. Deux navires de la Royal Navy britannique ont été les premiers sur les lieux à fournir une aide d'urgence et, selon les premiers rapports, les dégâts causés à la région semblent être graves. Jusqu'à présent, les pertes ont été estimées à au moins 400 morts et blessés, et les impacts économiques du séisme semblent considérables, puisque plusieurs économistes de renom ont déjà estimé que le coût financier du séisme s'élèverait à plusieurs milliards."
 greece.9.d:0 "Le Premier ministre [GRE.GetLeader] a présenté une nouvelle législation ! En réaction à l'épidémie actuelle de jeunes agitateurs, la législation permet désormais de punir leurs farces stupides et leurs propos durs. En plus de pénaliser l'utilisation de langages grossiers tels que « gamo teen Panagia sou », « skeela » et « malakas », la loi prévoit également des sanctions spécifiques pour les vauriens qui jettent de la nourriture sur ou agressent des personnes âgées. Plus précisément, ils seront emmenés dans leur centre de détention local, la tête rasée et leurs parents poursuivis en justice. De plus, ils seront humiliés dans les rues pour leurs crimes ! Bien que certains protestent contre la loi en raison de ses sanctions, beaucoup célèbrent la solution apportée par [GRE.GetLeader]aux jeunes déchaînés."
 greece.junta.100.d:0 "[GetNewspaperHeader]Suite à la montée des tensions entre la gauche et la droite en Grèce, un groupe d'officiers de droite dirigés par le général de brigade Stylianos Pattakos et les colonels George Papadopoulos et Nikolaos Makarezos ont renversé le gouvernement intérimaire et suspendu la constitution grecque. Ce que cela signifie pour la nation n'est actuellement pas clair."
 greece.junta.884.d:0 "[GetNewspaperHeader]Dans un tournant choquant pour la politique grecque, les milices communistes ont occupé plusieurs villes du pays, notamment Athènes et Thessalonique, et ont renversé le gouvernement intérimaire, proclamant la République populaire de Grèce."
 greece_bw.1.d:0 "Nous avons réussi notre lutte frontalière avec les Turcs et avons occupé Edirne."
 greece_bw.2.d:0 "Nous avons échoué dans notre lutte frontalière avec les Turcs et avons été repoussés d'Edirne."
 greece_bw.3.d:0 "Nous avons réussi notre lutte frontalière avec les Turcs et avons occupé la ville d'Istanbul."
 greece_bw.4.d:0 "Nous avons échoué dans notre lutte frontalière avec les Turcs et avons été repoussés d'Istanbul."
 greece.100.d:0 "[GetNewspaperHeader]À la suite d'affrontements avec le gouvernement turc, plusieurs milices communistes bien armées se sont emparées de villes et de régions vitales du pays, notamment d'Ankara. Même si ces milices bénéficient d'un large soutien populaire, elles sont largement surpassées par les forces gouvernementales en termes de force et de qualité militaires et il reste à voir si elles seront capables de gagner."
 greece.101.d:0 "[GetNewspaperHeader]Aujourd'hui, le [GRE.GetName] a déclaré son soutien aux communistes en Turquie et est directement intervenu dans la guerre civile turque, prenant le gouvernement communiste turc sous son aile. Même s'il n'est pas encore tout à fait clair qui sortira vainqueur de ce conflit, l'intervention grecque a certainement fait pencher la balance en faveur des communistes."
 greece.102.d:0 "[GetNewspaperHeader]Aujourd'hui, après le déclenchement de la guerre civile en Turquie, le [GRE.GetName] a occupé la ville d'Istanbul, affirmant que le détroit vital du Bosphore devait être occupé pour le moment afin de garantir que les flux commerciaux de l'Asie vers l'Europe ne soient pas entravés. Les deux gouvernements turcs impliqués dans la guerre civile ont exprimé leur extrême mécontentement face aux actions de la Grèce et ont qualifié l'occupation de rien d'autre que d'accaparement opportuniste de terres."
