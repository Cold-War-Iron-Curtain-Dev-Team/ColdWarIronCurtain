PDG.1.d:0 "La République démocratique de Grèce (DRG) a annoncé l'exécution de Stefanos Sarafis. Sarafis, qui commandait l'état-major de la DRG pendant la guerre civile, a été tué sur ordre du président Nikos Zachariadis. Le gouvernement a affirmé que Sarafis avait des liens douteux à l'étranger et que ses motivations pour rejoindre le DRG étaient toujours suspectes. Le gouvernement a noté que Sarafis n'était pas membre du parti avant la guerre et qu'il ne l'avait rejoint qu'une fois capturé. Les analystes soupçonnent que l'exécution est une mesure destinée à consolider la position de Zachariadis à la fois à la tête du parti et de l'armée."
PDG.2.d:0 "Suite à la victoire de la République Démocratique de Grèce (DRG) dans la récente guerre civile, le nouveau gouvernement a lancé une Terreur rouge à travers la Grèce. Les personnes accusées de collaboration avec les fascistes pendant l'occupation de l'Axe, les partisans du Royaume de Grèce et les membres du parti dont la loyauté est suspecte sont arrêtés. Des exécutions sommaires ont déjà été signalées et de nouveaux tribunaux ont été créés. Le DRG appelle tous les Grecs à aider le parti communiste à identifier les traîtres et à affirmer que la révolution ne pourra commencer à prospérer qu'une fois tous les ennemis internes vaincus."
PDG.3.d:0 "La République démocratique de Grèce (DRG) a annoncé son intention de se retirer du Pacte de Varsovie. Cela marque un changement majeur au sein du parti communiste suite à la prise de pouvoir du parti par les réformistes lors du récent Congrès. Les réformistes craignent que l'aile dure du parti ne soit trop alignée sur l'Union soviétique et n'ait lancé des politiques qui aliénaient la population. Ils craignaient que cela ne conduise finalement à un soulèvement violent ou à ce que la Grèce soit entraînée dans une autre guerre majeure. L'Union soviétique a annoncé qu'une session d'urgence du Politburo serait convoquée pour discuter de la situation en Grèce."
PDG.4.d:0 "Dans un changement surprenant, l'ancien président du parti communiste Nikos Zachariadis a repris le contrôle du parti. Il semble que la tentative des réformistes de s'éloigner de Moscou se soit retournée contre eux. La plupart des membres communistes étaient déjà mal à l'aise avec la nouvelle direction prise par Moscou, mais s'opposent également au programme réformiste. Ils considèrent Nikos Zachariadis comme le meilleur espoir du régime communiste naissant. Zachariadis rejette déjà la nouvelle direction préconisée par les Soviétiques et reste déterminé à maintenir la Grèce sur une véritable voie révolutionnaire."
PDG.5.d:0 "L'Union soviétique a annoncé qu'elle ne s'opposerait pas à la décision de la République démocratique de Grèce (DRG) de quitter le Pacte de Varsovie. L'action soviétique sera bien accueillie par la faction réformiste qui contrôle actuellement le parti communiste grec. Il semble que les Soviétiques souhaitent s'écarter de la ligne dure de l'ère stalinienne et montrer qu'ils peuvent entretenir des relations avec les États socialistes qui ne sont pas sous leur égide. Les Soviétiques ont peut-être également calculé que son action aiderait le parti à consolider son contrôle sur la Grèce. Reste à savoir si la Grèce rendra la pareille et maintiendra des liens bilatéraux solides."
PDG.6.d:0 "Le célèbre maréchal Markos Vafeiadis, militaire communiste grec et chef de la guérilla, a pris le contrôle du parti et de la République démocratique de Grèce (DRG). Bien qu'il soit un commandant militaire établi, il s'est brouillé avec l'ancien dirigeant Nikos Zachariadis et a été à un moment donné exilé à Moscou. Vafeiadis est considéré comme un partisan d'une Grèce indépendante avec une forte admiration pour le leader socialiste Josep Tito. Reste à savoir s'il pourra guider la Grèce vers un État socialiste non aligné."
PDG.7.d:0 "Pemier Charilaos Florakis, un homme d'État communiste établi, a pris le contrôle du parti communiste. Bien qu'il soit un membre ferme du parti, Forakis aurait été l'un des plus préoccupés par l'approche dure de Nikos Zachariadis et de sa faction. De nombreux observateurs et Grecs s'attendent à un assouplissement des politiques et à une approche plus inclusive. Sa première déclaration lors de son accession au pouvoir semble soutenir cette thèse puisqu'il a appelé tous les Grecs à se rassembler et à guérir en paix."
PDG.8.d:0 "La République démocratique de Grèce a déposé une demande d'adhésion à l'OTAN. Les réformes récentes ont entraîné une démocratisation sans précédent à travers le pays. La transformation politique du gouvernement et les réformes ont transformé la Grèce en un État incompatible avec l'Union soviétique ou ce qu'elle considère comme un État socialiste. Une autre motivation pour rejoindre l'OTAN est la crainte que les Soviétiques puissent choisir de manière clandestine, voire même abusive, pour arrêter la nouvelle direction du socialisme grec. De nombreux membres de l'OTAN considèrent l'inclusion potentielle du DRG comme une victoire majeure, tant stratégique que politique."
PDG.9.d:0 "La République démocratique de Grèce (DRG) a déclaré son soutien à l'antirévisionnisme. Les communistes grecs sont en proie aux récentes actions de l'Union soviétique visant à condamner le stalinisme et à s'éloigner de ses positions. Le DRG estime que ce que les Soviétiques appellent des réformes est en réalité un passage du socialisme révolutionnaire au capitalisme d'État. La DRG déclare qu'elle continuera à défendre le socialisme et appellera tous les États socialistes à rester fermes."
PDG.10.d:0 "La République Démocratique de Grèce (DRG) a annoncé que la lutte pour l'énosis qui durait depuis des siècles était enfin terminée. L'aide du DRG s'est avérée cruciale pour forcer le retrait de la Grande-Bretagne de Chypre et sa capture par les Chypriotes grecs. La DRG a également réussi à démanteler et à purger l'EOKA de sa direction royaliste et ecclésiastique pour transformer le groupe de résistance chypriote en une force révolutionnaire. En réponse aux menaces venant de Turquie, la DRG a déclaré qu'elle ne ferait aucun compromis ni n'abandonnerait l'idée d'instaurer le socialisme pour tous les peuples grecs."
PDG.11.d:0 "Le Mont Athos, centre historique et important du monachisme de l'Église orthodoxe grecque, a été fermé par la République démocratique de Grèce (DRG). Le Mont Athos, une île du nord-est de la Grèce, abrite depuis des siècles des monastères et des moines. En vertu de la constitution grecque de 1927, l'île jouissait d'une autonomie et s'administrait elle-même. Cependant, les troupes gouvernementales ont récemment pris d'assaut l'île et expulsé tous les moines. Le DRG a déclaré qu'il avait libéré l'île pour le peuple et éliminé l'influence corrompue de l'Église. Bien que le gouvernement salue ses actions comme une victoire, de nombreux Grecs percevront probablement cette attaque directe contre la religion de manière négative."
PDG.12.d:0 "La Grèce a ouvert sa première session gouvernementale à Constantinople, déplaçant officiellement la capitale du pays vers la ville. Le gouvernement démocratique de Grèce (DRG) a reçu la ville et ses environs suite à la partition de la Turquie par l'Union soviétique. Le déplacement vers la capitale apparaît comme l'étape ultime de l'intégration de ces territoires. Pour les communistes grecs, le retour de Constantinople comme capitale symbolise l'unification de la Grèce et de son peuple sous le socialisme."
PDG.13.d:0 "L'Union Soviétique a lancé une condamnation cinglante de la poursuite de l'occupation britannique de Chypre. Les Soviétiques notent l'hypocrisie de la Grande-Bretagne et de ses alliés qui appellent à l'autodétermination dans les États socialistes alors qu'ils répriment ouvertement les voeux du peuple chypriote. L'offensive diplomatique soviétique mettra les Britanniques sous une pression intense. L'attention portée par les Soviétiques à Chypre semble être une réponse aux demandes de la République démocratique grecque (DRG) communiste. Le DRG continue de défendre la cause de la décolonisation de Chypre et de son unification avec la Grèce. De nombreux Grecs ressentent une parenté avec les Grecs chypriotes qui constituent la majorité de la population de Chypre."
PDG.14.d:0 "Les Nations Unies ont voté en faveur de l'admission de la République démocratique de Grèce (DRG). Il s'agit d'une victoire diplomatique majeure pour le nouvel État communiste qui consolide son contrôle sur le pays après une violente guerre civile. Les nations socialistes ont toutes voté en faveur de l'admission de la Grèce, ainsi que de nombreux États nouvellement indépendants. Un certain nombre d'alliés de l'ancien royaume de Grèce se sont abstenus ou ont voté contre l'admission en signe de protestation."
PDG.15.d:0 "La guerre civile grecque s'est terminée par la victoire du Parti communiste grec. Le nouveau régime a rapidement annoncé la création de la République démocratique de Grèce. Cela marque la fin du royaume de Grèce. De nombreux États socialistes ont déjà reconnu le nouveau gouvernement en annonçant leur intention de créer ou d'agrandir des ambassades dans le pays. Les alliés du défunt Royaume de Grèce ont fermé leurs ambassades mais reviendront probablement à temps. Le peuple grec attend avec impatience ce que le nouveau régime lui apportera."
PDG.16.d:0 "Markos Vafeiadis, célèbre résistant grec communiste et chef militaire, a été évincé du parti et serait en exil. Sa destitution fait suite à une enquête approfondie auprès des dirigeants du parti. Vafeiadis a été accusé d'avoir des opinions révolutionnaires divergentes. En raison de la menace qu'il représente pour la sécurité intérieure et la voie révolutionnaire de la Grèce, il a été exclu du parti. Markos Vafeiadis, craignant d'être arrêté, s'est enfui à Moscou où il nie les accusations portées contre lui. Son retrait affaiblira gravement la position de ses partisans au sein du parti."
PDG.17.d:0 "Des millions de Turcs de souche sont actuellement chassés de la République démocratique de Grèce (DRG). Les autorités et les troupes grecques organisent les expulsions de ce que le gouvernement appelle une dangereuse cinquième colonne au sein de l'État. L'action grecque est largement critiquée au niveau international et le gouvernement turc accuse le DRG d'avoir créé une crise des réfugiés en Anatolie. La Grèce a récemment pris possession des terres turques suite à la partition du pays par l'Union soviétique."
PDG.18.d:0 "Après avoir occupé Izmir, Edirne et Istanbul après la partition soviétique de la Turquie, la République démocratique de Grèce (DRG) a annoncé qu'elle renommait les villes. Izmir reviendra à son nom grec de Smyrne, Edirne à Andrinople tandis qu'Istanbul deviendra Constantinople. Le gouvernement grec prétend qu'il s'agit d'un retour à la norme historique et que ces terres grecques ont été occupées pendant des siècles par des envahisseurs turcs. De nombreux Grecs saluent cette décision, même si le sort des Turcs vivant encore dans ces villes suscite une inquiétude internationale."
PDG.19.d:0 "Suite à l'échec d'une tentative des réformistes de prendre le contrôle du Parti communiste grec, le président Nikos Zachariadis a annoncé l'exécution de Charliaos Florakis. Florakis a été jugé pour ses tendances contre-révolutionnaires et ses liens étroits avec les ennemis du peuple. Sa disparition renforce le contrôle de Zachariadi sur le parti. Florakis était un homme d'État communiste réputé et l'un des principaux dirigeants de l'aile réformiste. Les réformateurs craignent de plus en plus que la mort de Florakis n'ouvre la voie à une purge plus large au sein du parti."
PDG.20.d:0 "Markos Vafeiadis, célèbre résistant communiste et chef militaire, a été assassiné. La République Démocratique de Grèce (DRG) a annoncé la nouvelle et sa détermination à découvrir tous les acteurs impliqués dans le complot. Les détails de l'assassinat n'ont pas été révélés. Ses opinions sur le socialisme et sur l'élaboration d'une voie indépendante pour la Grèce ont fait de lui des opposants tant au sein du parti qu'à l'échelle internationale. On ne sait pas lesquels de ses adversaires étaient impliqués. Sa mort constitue un coup dur pour ses partisans au sein du parti."
PDG.21.d:0 "Le Premier ministre Charilaos Florakis a été démis de ses fonctions par le chef du parti communiste Markos Vafeiadis. Cela marque une consolidation du pouvoir de Vafeiadis sur l'aile réformiste au pouvoir du parti. Il semble que les deux hommes se soient disputés sur les politiques mises en oeuvre. Les experts estiment que Florakis prônait une vision libérale et plus inclusive pour le pays, mais Vafeiadis la trouvait contre-révolutionnaire et divergente. Florakis, un homme d'État au sein du parti, prendra probablement sa retraite."
PDG.22.d:0 "La République démocratique de Grèce (DRG) a annoncé l'exécution de Nikos Zachariadis. L'ancien président du parti a été jugé par un tribunal spécial qui l'a déclaré coupable d'activités contre-révolutionnaires et de crimes contre le peuple. Nikos Zachariadis a dirigé le parti pendant la guerre civile et ses premières années, mais sa ligne dure s'est révélée impopulaire parmi les réformistes et de nombreux Grecs. Son exécution renforcera la position de l'actuel chef du parti, Markos Vafeiadis, et constituera un sévère avertissement pour les membres du parti qui sympathisaient avec Zachariadis."
PDG.23.d:0 "Dans une annonce majeure, la République démocratique de Grèce (DRG) a annoncé son adhésion au titisme. Le gouvernement grec estime que le titisme offre une approche plus authentique et plus efficace pour développer le socialisme dans le pays. Cela marque aussi un rejet du modèle soviétique. Plus important encore, il semble que le DRG espère forger un modèle socialiste et une politique étrangère plus indépendants. Cette proposition bénéficiera d'un large soutien parmi la population qui est lasse de voir la Grèce se retrouver dans un futur conflit international."
PDG.24.d:0 "Le Premier ministre Charilaos Florakis a annoncé que l'ancien président du parti Nikos Zachariadis avait été exilé de la République démocratique de Grèce (DRG). En tant que président et leader pendant la guerre civile, Zachariadis recherchait une transformation socialiste rapide et radicale pour le pays. Cependant, sa politique a largement aliéné la faction réformiste au sein du parti et de nombreux Grecs. Son exil affaiblira probablement ses partisans au sein du parti et ouvrira la voie à de nouvelles réformes dans le pays."
PDG.25.d:0 "Le peuple grec connaît une période de libéralisme sans précédent sous la direction du Premier ministre Charilaos Florakis. En tant que dirigeant du parti communiste et de la République démocratique de Grèce, il s'est éloigné de l'approche révolutionnaire dure et a levé de nombreuses restrictions. Même avant l'établissement du régime communiste, les Grecs étaient depuis longtemps soumis à des restrictions, que ce soit de la part de dirigeants autoritaires, d'occupants étrangers ou des conditions de guerre. Florakis a habilement mis en oeuvre ses réformes sans provoquer de contre-coup d'État."
PDG.26.d:0 "Des rapports en provenance de la République démocratique de Grèce indiquent que le gouvernement vide ses goulags. Il s'agit de la dernière réforme du Premier ministre Charilaos Florakis. Le Premier ministre grec a récemment lancé une série de réformes libérales de l'État. De nombreux Grecs accueilleront favorablement cette décision, car nombre d'entre eux ont des proches détenus dans ces établissements. Les membres les plus radicaux du parti seront probablement mécontents, mais jusqu'à présent, le premier ministre Florakis semble capable de gérer les différentes factions du parti."
PDG.27.d:0 "Les informations selon lesquelles la République démocratique de Grèce aurait démoli l'église de Panagia Megalochari à Tinos suscitent une indignation internationale. L'ensemble de l'église a été construit autour d'une icône miraculeuse trouvée par une religieuse du XIXe siècle. Les Grecs visitent le sanctuaire depuis des décennies, affirmant que des miracles se sont produits. Le gouvernement communiste prétend que le sanctuaire est une imposture destinée à empoisonner l'esprit des gens et à propager des superstitions. Le gouvernement prétendait avoir confisqué des bijoux et de l'argent au nom du peuple. La destruction de l'église historique et symbolique éloignera probablement un grand nombre de Grecs."

PDG.28.d:0 "La nouvelle du discours secret et de son contenu a provoqué une vive émotion au sein du parti communiste au pouvoir en République démocratique de Grèce. La condamnation du stalinisme et les appels à des réformes dans la mise en oeuvre du socialisme s'avèrent controversés. De nombreux dirigeants communistes affirment que le virage soviétique représente une divergence par rapport au socialisme. La direction du parti s'est réunie lors d'une réunion d'urgence. Il a été décidé que le gouvernement prendrait ses distances par rapport à Moscou pour évaluer l'impact de ce nouveau changement."
PDG.29.d:0 "Pour de nombreux communistes, l'Église orthodoxe grecque représente une institution d'oppression et de superstition. Cependant, l'Église reste une partie importante de beaucoup de nos concitoyens. L'église jouit également d'une grande réputation pour son rôle dans la résistance et l'indépendance grecque. Le parti doit décider comment traiter avec l'Église. Une faction estime que le parti devrait sévir contre l'Église et oeuvrer pour mettre fin à sa dangereuse influence. Une autre faction soutient que l'Église peut être cooptée dans l'État, comme cela se fait dans d'autres États socialistes. Ils soutiennent que l'Église peut devenir un puissant véhicule pour propager le socialisme auprès des masses."

PDG.30.d:0 "Le gouvernement grec a demandé notre aide dans son objectif d'Enosis, l'unification de la Grèce avec Chypre. Chypre est actuellement sous l'administration coloniale de la Grande-Bretagne et fait face à la résistance de la majorité grecque chypriote. Il est peut-être dans notre intérêt d'offrir un soutien diplomatique afin de nous positionner comme champions de l'anticolonialisme. Nous pouvons également offrir un soutien diplomatique sous forme d'aide secrète pour affaiblir les Britanniques. Cela renforcerait notre position en Méditerranée orientale. Toutefois, si les risques d'une réaction occidentale sont trop élevés, nous pouvons décliner la demande grecque."
PDG.31.d:0 "L'ambassadeur soviétique nous a informé que son gouvernement ne pouvait offrir aucune aide publique ou secrète pour nous soutenir à Chypre. Le gouvernement soviétique a exprimé sa sympathie pour la lutte anticoloniale, mais il ne peut pas s'impliquer pour le moment. C'est un coup dur pour nos objectifs concernant Chypre. Le gouvernement doit accepter qu'il doit soutenir Chypre seul. Certains membres du parti remettent ouvertement en question notre propre engagement à suivre la ligne soviétique au niveau international s'ils ne sont pas disposés à nous aider sur une question aussi importante."
PDG.32.d:0 "L'ambassadeur soviétique nous a informé que son gouvernement offrirait un soutien diplomatique pour nous soutenir à Chypre. Le gouvernement soviétique sympathise pleinement avec la lutte anticoloniale et le désir du peuple chypriote de s'unir à la Grèce. L'ambassadeur a ajouté que c'était un crime que l'unification ait été retardée par des siècles d'impérialisme et de violence capitaliste. Cependant, le gouvernement soviétique ne peut pas offrir une aide secrète. Il s'agit d'une évolution positive, même s'il est décevant que les Soviétiques ne soient pas disposés à nous aider directement dans nos efforts. Nous espérons que la pression politique exercée sur les Britanniques les poussera à mettre fin à leur occupation."
PDG.33.d:0 "L'ambassadeur soviétique nous a informé que son gouvernement offrirait un soutien diplomatique pour nous soutenir à Chypre. Le gouvernement soviétique sympathise pleinement avec la lutte anticoloniale et le désir du peuple chypriote de s'unir à la Grèce. L'ambassadeur a ajouté que c'était un crime que l'unification ait été retardée par des siècles d'impérialisme et de violence capitaliste. Le gouvernement soviétique fournira également une aide secrète pour soutenir les efforts de libération de Chypre. L'attaché militaire soviétique et l'officier du renseignement commenceront bientôt à se coordonner avec le ministère de la Défense. Il s'agit d'un coup de pouce majeur à nos efforts pour atteindre l'Enosis."
PDG.34.d:0 ""
PDG.35.d:0 ""
PDG.36.d:0 ""
PDG.37.d:0 ""
PDG.38.d:0 "Aujourd'hui marque le 10e anniversaire de la victoire écrasante du KKE sur les Blancs dans la guerre civile grecque. Pour célébrer, le Comité central a préparé un grand défilé démontrant les nombreuses réalisations accomplies par le peuple grec au cours de la dernière décennie. Les apparitions notables incluent un char illustrant la reconstruction de la nation, des colonnes de nouveaux chars de combat principaux construits dans la ville d'Athènes et un superbe concert de musique mettant en vedette l'Ensemble Alexandrov. Bien que de nombreux problèmes affligent encore la nation rouge de la Méditerranée, c'est aujourd'hui un jour de célébration alors que les Grecs, chez eux et à l'étranger, célèbrent une nouvelle ère dans l'histoire grecque."
PDG.39.d:0 "Aujourd'hui, la plate-forme pétrolière Dimitrios Partsalidis a pris feu de manière inattendue à 2 h 34 du matin près de l'île de Crète. La plate-forme, appartenant à la République démocratique de Grèce, a subi une défaillance critique de l'un de ses cylindres de confinement de pétrole, entraînant le rejet d'une quantité indéterminée de pétrole dans la mer Méditerranée. La panne totale de la plate-forme n'a été stoppée que par les ouvriers grecs, capables d'empêcher l'incendie de se propager au site d'extraction. On estime que 10 personnes sont mortes et un nombre indéterminé de blessés. La République démocratique de Grèce a refusé de commenter la situation alors que de nombreux pays des deux côtés du rideau de fer exigent des réponses."
PDG.40.d:0 "À 00h20, la plate-forme pétrolière Velouchiotis (une soeur de la tristement célèbre plate-forme Partsalidis) a subi une panne catastrophique et a explosé, tuant environ 24 personnes. L'incendie a été rapidement éteint avec l'aide d'un croiseur de bataille soviétique présent dans la région. Peu de temps après, cependant, les spécialistes se sont rendu compte que la force de l'explosion avait fait tomber les quatre spudcans, ouvrant ainsi la réserve de pétrole dans la Méditerranée. Au lever du jour, l'océan était noir tandis que des millions de barils de pétrole se jetaient dans la mer. Les effets ont été catastrophiques sur la faune, car l'écosystème marin est recouvert de boue. La Yougoslavie, l'Italie, Israël, la Turquie, la Syrie et l'Égypte ont tous signalé de grandes quantités de poissons contaminés et exigent une solution rapide à la catastrophe. Pour l'instant, la République démocratique de Grèce a de nouveau refusé de commenter, et nombreux sont ceux qui craignent que le KKE ne prenne ses distances par rapport au désastre."
PDG.42.d:0 "Hier, la République Démocratique de Grèce a annoncé la formation du Traité Révolutionnaire d'Amitié et de Travail, que beaucoup en sont venus à surnommer « le Bloc Anti-Révisionniste ». Bien qu'ils ne contiennent actuellement que la Grèce, de nombreux pays communistes radicaux devraient les rejoindre dans les prochains jours. L'Union soviétique n'a pas tardé à condamner ce nouveau pacte comme un acte d'agression contre l'unité et la paix socialistes. L'Armée rouge a déjà commencé à se mobiliser en vue d'un éventuel conflit armé dans les Balkans alors qu'un nouveau camp rejoint la Guerre froide."
PDG.43.d:0 "Maintenant que notre pays est stabilisé, nous pouvons commencer à puiser dans les riches eaux de la Méditerranée. Chaque année, les bateaux de pêche reviennent avec des prises de plus en plus importantes. En plus de la nourriture, d'importantes réserves de pétrole ont été découvertes dans nos eaux orientales. Ces primes doivent être récoltées et utilisées pour améliorer la vie de notre peuple."
PDG.44.d:0 "À 02h34, le cylindre gauche de confinement d'huile a subi une panne critique et a éclaté. Un rapport de la LEEA a conclu que la cause était une cigarette allumée qui est tombée d'une plate-forme de maintenance et est tombée sur une machine. Bien que la cause directe de l'incident soit évidente, de nombreux membres de la communauté du renseignement pensent que la véritable cause réside dans une équipe surmenée qui tentait d'atteindre des quotas de plus en plus élevés. De nombreux membres du parti appellent à la fin rapide des forages de masse, tandis que d'autres assurent qu'il s'agit d'un cas isolé."
PDG.45.d:0 "Un désastre a frappé la plate-forme pétrolière Velouchiotis. Une défaillance de maintenance a provoqué la formation de poches d'air dans le pétrole extrait. Une étincelle a tout mis en feu. Nous devons réparer ce gâchis avant qu'il ne soit trop tard."
PDG.46.d:0 "La petite ville de Xania, sur l'île de Crète, est devenue insalubre. Le pétrole et les incendies ravagent désormais la côte alors que la nourriture devient de plus en plus rare. Nous devons détourner tous les navires disponibles de notre arsenal pour mettre les habitants de cette ville en sécurité avant qu'il ne soit trop tard."
PDG.47.d:0 "La récente crise des plates-formes pétrolières a encouragé les pêcheurs et les environnementalistes à protester contre nos méthodes d'extraction des ressources en Méditerranée. En ce qui concerne notamment les décharges de déchets toxiques en mer et la surpêche, les écologistes estiment que sans réforme, la Méditerranée orientale deviendra impropre à la vie aquatique. Même si la LEEA nous assure que ces actes de dissidence ne sont pas contre-révolutionnaires, elle conseille de traiter les protestations le plus tôt possible. C'est pour cette raison que le Ministère de la Conservation de l'Environnement a été créé pour conseiller les planificateurs et préserver la beauté naturelle de la Grèce."
PDG.48.d:0 "Alors que nos nombreuses réformes environnementales ont augmenté l'espérance de vie des Grecs et réduit considérablement les risques de catastrophe, les réglementations ont nui à la productivité. Les planificateurs grecs ont prévenu que l'arrêt continu de la productivité nuirait considérablement à notre nation. Nous devons encourager le prolétariat grec à travailler encore plus dur."
PDG.49.d:0 "Depuis quelques années, nous limitons l'influence soviétique dans le but, à terme, de la laisser à nos camarades chinois. D'ici un an, nous serons assez forts pour quitter nos maîtres soviétiques et poursuivre la révolution avec Mao. Pourtant, un nombre croissant de modérés ont exprimé leur inquiétude à l'idée de quitter la sécurité du Pacte de Varsovie. Même si les Soviétiques imposent parfois leur volonté à notre fier peuple, leur générosité en nous aidant à reconstruire ne peut être oubliée. Avec de la chance, affirment-ils, une relation positive et continue avec l'URSS aidera les deux nations et la révolution."
PDG.50.d:0 "Notre nouvelle alliance doit se développer si nous voulons dépasser le social-impérialisme de l'Union soviétique et ses marionnettes. Partout dans le monde, les vrais marxistes se rassemblent dans notre lutte commune pour la libération et la souveraineté. Envoyez l'appel à la lutte des classes combinée."
PDG.51.d:0 "Nos camarades grecs nous ont invités au Traité révolutionnaire d'amitié et de travail. Bien que nous soyons d'accord sur de nombreuses questions et que nous puissions tirer beaucoup de profit de la coopération, de nombreux conseillers nous ont avertis que l'approbation publique de cette nouvelle alliance nous mettrait en danger d'une éventuelle guerre avec l'URSS. Que devons-nous faire ?"
PDG.53.d:0 ""
PDG.54.d:0 ""
PDG.56.d:0 "Quelques jours seulement après la création des Blocs Anti-Révisionnistes, l'Union Soviétique et de nombreux pays du Pacte de Varsovie ont annoncé l'état de guerre avec les Anti-Révisionnistes. L'URSS a déclaré que \"le fanatisme et la division, où qu'ils soient, constituent une menace pour la paix mondiale. Déjà, les blindés soviétiques ont afflué dans les Balkans et des rumeurs se sont répandues concernant des mouvements massifs de troupes du Pacte de Varsovie en Extrême-Orient. La RPC a lancé un avertissement fort selon lequel tout nouvel impérialisme expansionniste entraînerait une guerre. Les États-Unis ont appelé à une résolution pacifique et condamné toute action militaire sur le continent eurasien. Cependant, il est peu probable que ces paroles fortes changent grand-chose à mesure que les Soviétiques entrent en territoire anti-révisionniste."
PDG.55.d:0 "Les perfides Grecs ont annoncé la formation du Traité révolutionnaire d'amitié et de travail. Ces fanatiques sont une insulte directe au marxiste-léninisme et à la paix mondiale. Nous devons agir rapidement avant que cette nouvelle alliance ne gagne du terrain dans le tiers monde. Deux plans ont été avancés. La première a été proposée par l'Armée rouge. Ils suggèrent une intervention rapide et à grande échelle du Pacte de Varsovie dans les Balkans et en Asie de l'Est. Ils croient que notre puissance aérienne supérieure sera largement à la hauteur des vastes réserves d'effectifs du bloc anti-révisionniste. Le deuxième plan proposé vient du KGB. De nombreuses preuves soutiennent l'affirmation selon laquelle le Bloc anti-révisionniste est divisé et désorganisé en interne. Cette désorganisation peut être facilement exploitée et, grâce à la manipulation, nous pouvons retourner les hordes sanguinaires les unes contre les autres. Une seule option peut être choisie."



#Turkey_Events
SRT.1.d:0 "Aujourd'hui, le gouvernement militaire soviétique en Turquie, dirigé par le général Pavel Batov, a annoncé la création officielle de la République socialiste de Turquie. Le général a déclaré que d'ici la fin du mois, les 100 000 soldats de l'Armée rouge, pour la plupart turcs, seront retirés d'Anatolie et que l'autorité sera transférée au gouvernement civil dirigé par le secrétaire général Sefik Husnu. Les observateurs internationaux des deux côtés du rideau de fer s'attendent à ce que la transition se fasse en douceur et pacifiquement alors que les soldats soviétiques quitteront la nouvelle nation en conquérants. Les États-Unis et leurs alliés ne peuvent qu'observer avec horreur le rouleau compresseur soviétique revendiquer une autre nation."
SRT.2.d:0 "Le monde est encore en deuil aujourd'hui alors que la République socialiste de Turquie a annoncé la mort soudaine de l'ancien président Ismet Inonu. Inonu a été retrouvé mort dans sa salle de bain avec 7 blessures par balle. Le régime communiste a déjà organisé des funérailles nationales en son honneur. Tout en étant un critique virulent du communisme, Inonu a surpris le monde en soutenant l'Union soviétique comme le leader mondial préférable. On ne sait pas si cette déclaration a été faite par crainte de représailles soviétiques pour un soutien peu favorable, ou par amour véritable pour la classe ouvrière. Ceci, ainsi que l'identité de l'assassin, restera probablement un mystère dans un avenir prévisible."
SRT.3.d:0 "Immédiatement après la mort de Staline, les ouvriers du textile turcs sont descendus dans la rue pour réclamer de meilleurs salaires. Le lendemain, des métallurgistes et des agriculteurs bien armés de la banlieue d'Ankara ont afflué pour manifester. En infériorité numérique et en armes, les garnisons soviétiques et la police turque ont ouvert le feu sur une manifestation pacifique. Ce qui a suivi a été un violent soulèvement lorsque des manifestants turcs ont fait irruption dans l'armurerie nationale d'Ankara. Bien qu'au début il ait été salué comme un triomphe de la liberté et de la démocratie, le soulèvement s'est transformé en une émeute désorganisée avec de nombreuses informations faisant état de pillages et d'incendies criminels. On ne sait pas où se trouve le secrétaire général Husnu, mais la rumeur court qu'il aurait fui la ville avec les autres membres du gouvernement central."
SRT.4.d:0 "Pour la première fois depuis un mois, le soleil se couche sur une Ankara paisible. Le secrétaire général Sefik Husnu a annoncé au monde que l'ordre avait été complètement rétabli dans la capitale nationale. La stabilité a été rétablie grâce à la tactique brillante et à la détermination du ministre de la Propagande Guzin Dino et de son ami Nazim Hikmet. Les deux artistes devenus révolutionnaires ont assuré le contrôle de la ville sans coup férir en concluant des accords stratégiques et des concessions avec des groupes anti-émeutes individuels. Le succès de cette stratégie a donné aux responsables du TKP la confiance nécessaire pour mettre en place une série de mesures de protection des droits de l'homme, notamment la liberté totale de grève, le droit à une défense juridique devant les tribunaux et la possibilité d'exprimer des critiques à l'égard de l'État turc."
SRT.5.d:0 "Pas une semaine après le début des émeutes, la stabilité est revenue à Ankara. Le secrétaire général Sefik Husnu a annoncé au monde que l'ordre avait été complètement rétabli dans la capitale nationale. La rapidité avec laquelle cet exploit a été accompli peut être attribuée uniquement au meurtrier de Husnu, Sevket Sureyya Aydemir. Connu comme un fanatique idéologique auprès de ses collègues et un héros auprès des nationalistes turcs, Aydemir s'est bâti une nouvelle réputation auprès des habitants d'Ankara en tant que boucher. Quelques jours seulement après le début des émeutes, Aydemir a déployé toute la puissance de l'armée turque contre les dissidents. Les informations faisant état de tirs aveugles se sont rapidement transformées en exécutions systématiques et massives dans toute la ville. Alors que la ville est revenue à la stabilité, beaucoup se demandent « à quel prix ?"
SRT.7.d:0 "Beaucoup pensaient que la carrière politique d'Ismet Inonu était terminée après la prise de contrôle de la Turquie par les Soviétiques. Ces croyances se sont toutefois révélées fausses aujourd'hui lorsque l'ancien président et héros de la guerre d'indépendance a prononcé un discours devant le peuple turc, déclarant que son icône nationale bien-aimée était revenue pour le diriger une fois de plus. Alors que la rumeur dit que la politique intérieure est la même que celle de l'ancien régime, le gouvernement Inonus a déjà entamé le processus de « désoviétisation » qui implique l'expulsion de toutes les troupes soviétiques, la restauration du nationalisme turc et la rupture des relations diplomatiques avec Moscou et le bloc de l'Est. Il est clair que l'éphémère ère communiste en Turquie touche à sa fin, mais une question demeure des deux côtés du rideau de fer : « Et maintenant pour la Turquie ? »"
SRT.8.d:0 "Aujourd'hui, des foules se sont précipitées dans les rues de toute la Turquie pour célébrer la nomination du poète charismatique devenu révolutionnaire Nazim Hikmet comme deuxième secrétaire général du TKP. Au lendemain des émeutes d'Ankara, Nazim Hikmet est devenu un héros national, lui donnant la légitimité nécessaire pour consolider son pouvoir. Dans une brève déclaration à la nation, Hikmet a promis une plus grande libéralisation culturelle ainsi que la fin du travail forcé et l'abolition de toutes les restrictions artistiques. Les réactions internationales varient énormément face à ce nouveau développement. Nikita Khrouchtchev a félicité avec enthousiasme le nouveau secrétaire général turc tandis que Mao Zedong et Enver Hoxha ont averti que le relâchement de la discipline prolétarienne entraînerait la consolidation d'une classe bureaucratique réactionnaire. Mais pour l'instant, la République socialiste de Turquie reste une nation forte avec un avenir prometteur. "
SRT.9.d:0 "La Turquie a été sous le choc aujourd'hui lorsque le TKP a expulsé Ismet Inonu du parti communiste pour « ne pas avoir fait preuve de capacité cognitive pour accomplir des tâches complexes ». Dans un rapport médical divulgué à la presse, Inonu avait un QI de seulement 84, une tumeur dans le cortex cérébral et un cas grave de schizophrénie. De nombreux Turcs sont incrédules face à la disgrâce stupéfiante de leurs anciens présidents. De l'autre côté du rideau de fer, plusieurs organisations médicales et de défense des droits de l'homme ont condamné le rapport, affirmant que le test était « très probablement fabriqué et intentionnellement divulgué à la presse ». Le gouvernement turc nie ces affirmations et déclare que ses actions visant à retirer Inonu du public étaient un choix visant à « le protéger de lui-même ». "
SRT.10.d:0 "Aujourd'hui, l'Est comme l'Ouest ont regardé avec une impatience nerveuse l'annonce de Sevket Sureyya Aydemir selon laquelle « le prolétariat turc était victorieux face aux éléments réactionnaires du TKP ». Aydemir, un nationaliste marxiste de longue date, s'est fait un nom pour la première fois lors des émeutes d'Ankara, où sa répression brutale et systémique de la ville lui a valu le surnom de « boucher d'Ankara ». Désormais, un mélange de zèle révolutionnaire et de panique secoue la nation. Moscou refuse de commenter l'évolution de la situation en Anatolie, mais des informations selon lesquelles la flotte soviétique de la mer Noire aurait navigué vers de petites villes côtières le long de la côte turque pour évacuer les touristes du bloc de l'Est ainsi que les civils turcs ont été confirmées par des observateurs internationaux."
SRT.11.d:0 "Les responsables de la République socialiste de Turquie ont officiellement annoncé le retrait de la Turquie du Pacte de Varsovie. Pour la nouvelle administration turque, les directions de Moscou et d'Ankara sont devenues incompatibles. Les quelques garnisons soviétiques et grecques d'Anatolie ont été évacuées et l'Armée rouge a été mise en attente au cas où les troupes en partance seraient blessées. Même si nombreux sont ceux en Turquie qui s'inquiètent de l'intervention soviétique, nombreux sont ceux qui notent que la taille et la géographie de la République s'avéreraient trop coûteuses pour toute action soviétique."
SRT.12.d:0 "Des nouvelles surprenantes sont arrivées de Turquie Rouge : le ministre de la Propagande, Guzin Dino, a annoncé que plusieurs lois sur les droits des homosexuels avaient été adoptées par le Soviet suprême turc. La république socialiste permettra désormais aux tribunaux d'accorder les unions homosexuelles, d'abolir la discrimination sexuelle dans les institutions religieuses et, enfin, d'autoriser les homosexuels ouvertement à participer à la fois au TKP et à l'Armée nationale des travailleurs. Cet acte a mis le débat sur la sexualité sous les projecteurs dans tout le bloc de l'Est et nombreux sont ceux qui s'attendent à ce qu'un « printemps queer » résonne dans tout le monde socialiste, alors que de nombreux gays auront le pouvoir de s'exprimer."
SRT.14.d:0 "La République démocratique kurde (RDK) a proclamé son indépendance. La République socialiste turque et l'Union soviétique ont toutes deux accepté la demande kurde d'un nouvel État socialiste kurde. Le nouveau gouvernement a annoncé qu'il ouvrirait une nouvelle ère de développement socialiste et de prospérité pour le peuple kurde. Il promettait également des relations fraternelles avec tous les États socialistes, en particulier avec ses voisins. Les États de la région, en particulier ceux qui comptent d'importantes minorités kurdes, expriment leur inquiétude quant au fait que la RDA pourrait devenir un paratonnerre d'instabilité."
SRT.17.d:0 "Aujourd'hui, le Premier ministre turc Inönü a prononcé un discours enflammé dans une petite ville turque située à la frontière avec l'Union soviétique. Dans son discours, le Premier ministre a déclaré que « les terres de Constantinople, d'Erzurum, de l'Anatolie occidentale et des montagnes du caucus seront dominées par les dirigeants légitimes de l'Anatolie ». En réponse à ce discours enflammé, l'Armée rouge soviétique et l'APL grecque (Armée populaire de libération) ont été mises en attente. Dans une réfutation typique du nouveau Premier ministre soviétique, Nikita Khrouchtchev a averti que « les armées du Pacte de Varsovie sont parfaitement capables de défendre leur patrie contre les envahisseurs barbares... Nous ne nous contenterons pas de vous arrêter, nous vous détruirons ». En réponse directe à Inonu, l'Union soviétique a également fermé l'oléoduc vital Bakou-Adana et a exigé que toutes les dettes soient remboursées d'ici la fin du mois. Avec cette évolution, il est probable que les paroles audacieuses du Premier ministre Inonus aient tiré une balle dans le pied de la Turquie."
SRT.18.d:0 ""
SRT.19.d:0 "Sefik Husnu, chef du gouvernement civil en Turquie et secrétaire général du TKP, a annoncé au monde que l'ancien Empire Ottoman, et lieu de naissance de la plupart des citoyens turcs, était responsable d'« un acte trop odieux pour qu'un véritable peuple socialiste puisse l'ignorer ». Il y a quarante ans, les terres turques étaient le théâtre d'un génocide perpétré par les Turcs contre le prolétariat arménien et grec. Cet événement sera plus tard appelé le génocide arménien. Husnu a fait référence à Auferstanden aus Ruinen (l'hymne national de l'Allemagne de l'Est) et au fait que, tout comme la RDA, tous les Turcs devraient oeuvrer pour que « la lumière de la paix brille, afin qu'une mère ne pleure plus jamais son fils ». En complément des paroles de Husnu, les dirigeants turcs des gouvernements locaux ont érigé des monuments aux centaines de milliers de victimes anonymes de la cruauté impérialiste."
SRT.20.d:0 "Des rapports en provenance de Turquie indiquent que l'Union soviétique a récemment confisqué les réserves d'or du pays. Les Soviétiques affirment que la confiscation vise à protéger les réserves turques contre d'éventuelles menaces hostiles et à récompenser le soutien massif soviétique. Un responsable soviétique a discrètement noté que son gouvernement avait fourni de l'or à la république dans ses premières années et qu'il avait droit aux réserves. Les gouvernements turc et soviétique cherchent à garder cette nouvelle sous silence. À mesure que la nouvelle se répand, de nombreux Turcs devraient être aliénés par cette action, même s'il n'est pas certain qu'ils réagiront par des protestations publiques. Les gouvernements occidentaux publient déjà des déclarations condamnant cette action."
SRT.21.d:0 "L'un des problèmes majeurs de l'occupation a été la reddition des colonnes des lâches forces réactionnaires turques. Pour l'instant, ils sont détenus dans des centres de détention de fortune en Anatolie et dans le Caucase, avec peu de nourriture et d'eau. De nombreuses divisions s'organisent et les réserves d'armes soviétiques disparaissent de plus en plus. Cette question doit être traitée rapidement. Nous devons demander au camarade Staline quoi faire."
SRT.22.d:0 "Le gouvernement d'occupation soviétique en Turquie nous a présenté le problème urgent des prisonniers de guerre turcs. Après délibération, le Politburo a proposé deux solutions possibles. Le premier est une répétition classique de nos actions dans la grande guerre patriotique. Tout comme les prisonniers de guerre allemands et japonais, les prisonniers de guerre turcs seront mis à contribution pour reconstruire notre grande nation. Bien que tentant, cela pourrait éloigner le prolétariat turc de notre grande expérience socialiste. La deuxième option consiste à renvoyer l'armée turque dans son pays et à la rééquiper pour qu'elle combatte aux côtés de la classe ouvrière. Bien que coûteux, ce plan est assuré de convaincre le peuple turc et de démontrer la toute-puissance du camarade Staline."
SRT.23.d:0 "Alors que les canons de l'artillerie restent silencieux, la violence continue de sévir en Anatolie. Des voyous turcs et, à notre grand embarras, de courageux soldats de l'Armée rouge harcèlent l'importante minorité grecque de la région. Des commissaires ont été envoyés pour protéger les Grecs ; il est évident qu'une solution plus permanente est nécessaire. Nous devons consulter le camarade Zachariadis."
SRT.24.d:0 "Des nouvelles de la Turquie nouvellement libérée nous sont parvenues. Le gouvernement d'occupation soviétique sollicite notre aide pour maintenir la paix entre les Grecs et les Turcs. Deux plans nous ont été remis. La première consiste à sauver nos camarades grecs et à les installer dans la ville nouvellement libérée de Constantinople. Cela pourrait à la fois nous donner une augmentation considérable de notre population et transformer notre nouvelle capitale en une ville à majorité grecque. D'un autre côté, beaucoup pensent qu'il est de notre devoir d'améliorer nos relations avec le peuple turc. Le deuxième plan implique une campagne de propagande massive destinée à favoriser l'unité entre nos deux nations socialistes. Il serait peut-être dans l'intérêt des travailleurs de tendre le rameau d'olivier et de faire de l'Anatolie un lieu de paix pour tous les peuples."
SRT.25.d:0 "Notre gouvernement d'occupation s'est heurté à un gros problème. Les premières campagnes de collectivisation ont démontré un préjugé systémique contre les Arméniens. Ce préjugé a éclaté hier lorsque plusieurs Turcs arméniens ainsi que sept camarades de la 390e division d'occupation de fusiliers (composés pour la plupart d'Arméniens) ont été retrouvés brutalement torturés au point d'être méconnaissables. Il est clair que quelque chose doit être fait pour assurer la sécurité de la population et de nos soldats. À l'heure actuelle, un télégramme a été envoyé à Moscou pour demander leurs conseils."
SRT.26.d:0 "Les rapports faisant état de violences contre nos camarades arméniens en Anatolie ont commencé à affluer. Il faut faire quelque chose. En raison de la nature et de la complexité de la région, seules deux options semblent réalisables. La première option consiste à envoyer des Turcs arméniens dans les régions nouvellement conquises de la RSS d'Arménie. Nous espérons que cela renforcera notre emprise sur la nouvelle région et donnera à tous les Arméniens un endroit sûr où vivre. Même si nous sommes sans doute plus efficaces, nous ne résoudrons pas le problème, nous nous contenterons simplement de le faire plus tard. La deuxième option est d'aller de l'avant à toute vapeur vers l'unité socialiste. Des actions telles que l'offre d'une plus grande représentation aux Arméniens au sein du gouvernement, la diversification forcée du lieu de travail et, ce qui est le plus controversé, l'ordre au gouvernement civil turc de reconnaître le génocide arménien."
SRT.27.d:0 "Une fois notre conquête et notre libération de l'Anatolie terminées, la base industrielle du défunt État turc restait inactive à travers le pays. Les commandants de l'Armée rouge ont tenté de relancer l'industrie turque dans le but de rétablir les relations avec la population civile, mais ces efforts se sont pour la plupart soldés par un échec. Nous devons trouver quoi faire avant que cette précieuse industrie ne rouille au vent. Heureusement, Moscou nous a informés qu'ils étaient en train d'organiser une solution permanente à l'heure où nous parlons."
SRT.28.d:0 "Avec un État turc réactionnaire en ruine, son industrie est prête à être exploitée. Beaucoup au Kremlin, y compris le nouveau venu Kossyguine, estiment que, tout comme en Allemagne, l'industrie turque devrait être transférée en URSS pour y être conservée. Cependant, Pavel Batov, commandant du gouvernement d'occupation, a écrit personnellement au camarade Staline pour lui exprimer la nécessité d'utiliser la puissance de l'Union soviétique pour faire du nouvel Etat turc un poids lourd. Bien que plus coûteux, il estime que cela réduira rapidement les hostilités entre la population turque et le gouvernement socialiste, conduisant ainsi à un pays plus stable à l'avenir."
SRT.29.d:0 ""
SRT.30.d:0 "En raison de problèmes de santé, le camarade Sefik Husnu a annoncé qu'il quitterait son poste de secrétaire général du TKP et qu'il passerait les derniers mois de sa vie dans sa datcha au bord de la mer Noire. À sa place, le Politburo a pris le contrôle total de la nation. Avant son départ, le camarade Husnu a exigé la mise en place d'une direction pluraliste « fondée sur les valeurs de compromis et de solidarité ». Malgré sa demande, il est clair que des lignes de bataille sont en train d'être tracées. À l'extrême droite du bureau politique se trouve la faction TKP-CHP dirigée par des kamalistes fidèles au régime précédent. Ils croient fermement que la Turquie devrait rompre avec la lutte ouvrière internationale et poursuivre une neutralité positive. Au centre se trouve la faction établie du TKP dirigée par des Khrouchtcheviens fidèles à Moscou. Ils croient que l'avenir de la Turquie réside dans la solidarité avec nos camarades du Pacte de Varsovie. Enfin, à l'extrême gauche se trouve la faction TKP-ML dirigée par des nationalistes turcs fanatiques et des anti-révisionnistes. Leur vision de la Turquie est celle d'un État socialiste autosuffisant mettant l'accent sur le progrès technologique et la loyauté idéologique. Même si officiellement toutes les factions travaillent ensemble, force est de constater que dans les mois à venir, il n'en restera plus qu'une."
SRT.32.d:0 "Avec le décès soudain du secrétaire général Nazim Hikmet, son bras droit, Guzin Dino, a pris la direction de Red Turkey. Écrivaine et théoricienne féministe de premier plan dans l'ancienne république, Dino a gravi les échelons jusqu'au poste de ministre de la propagande, où elle est devenue l'une des favorites de Husnu et de Hikmet. Aujourd'hui dirigeant de la République socialiste turque, Guzin Dino prévoit de maintenir les normes de la politique étrangère turque et de poursuivre les mouvements de libéralisation lancés par Hikmet. Les déclarations de Moscou et du bloc de l'Est, bien que discrètes, sont plus positives que négatives, car de nombreux membres du Pacte de Varsovie félicitent le nouveau secrétaire général. L'avenir de la Turquie, bien que toujours incertain, sera probablement celui de la réforme intérieure et de l'expansion à l'étranger."
SRT.33.d:0 "Avec le décès soudain du secrétaire général Nazim Hikmet, le chef des commissaires du peuple Ismail Bilen a pris la direction de la Turquie rouge. Aujourd'hui dirigeant de la République socialiste turque, Bilen envisage de normaliser la société et d'apporter la stabilité au peuple turc. Cela impliquera probablement un recul des réformes libérales de Hikmets, une répression contre les agences de presse indépendantes et un rétablissement des liens avec le monde arabe. La nouvelle de cette évolution a été célébrée à Moscou et au Caire, alors qu'Ankara continue son allégeance à la ligne soviétique."
SRT.34.d:0 "Aujourd'hui, le sang a coulé sur les marches du Complexe populaire révolutionnaire d'Ankara alors que des officiers fidèles à la faction TKP-ML se sont affrontés avec les services secrets. Bien que les officiers aient réussi à percer les défenses extérieures du bâtiment de la capitale, ils ont été repoussés par la garnison locale après que le bureau politique ait pu contacter l'Armée des travailleurs de Turquie. Dès à présent, une chasse à l'homme a été ordonnée par le secrétaire général du TKP, qui a exigé que tous les conspirateurs soient amenés à Ankara pour « crimes graves contre les travailleurs et l'État turcs ». Le coup d'État étant définitivement vaincu, le bloc de l'Est pousse un soupir de soulagement alors que le communisme soviétique reste en Anatolie."
SRT.35.d:0 "Aujourd'hui, des officiers fidèles à la faction TKP-ML ont pris d'assaut le bâtiment de la capitale de la République socialiste turque. Bien que farouchement défendus par les services secrets turcs, les officiers ont réussi à briser toutes les défenses et à diffuser un message annonçant le succès des coups d'État. Dirigés par le président Ibrahim Kaypakkaya, les révolutionnaires ont juré de mettre fin à l'impérialisme culturel soviétique et de rendre la Turquie aux ouvriers et aux paysans. Mao Zedong et Enver Hoxha ont tous deux félicité le nouveau régime turc et espèrent renforcer leurs liens avec Kaypakkaya. Moscou a en revanche dénoncé cet acte comme étant illégal et a exigé de sévères sanctions de la part de la communauté internationale."
SRT.36.d:0 "Hier soir, des éléments du corps expéditionnaire turc ont traversé la frontière de la RAU pour défendre leur allié contre « l'agression sioniste ». Même si les forces terrestres ne sont pas encore présentes en nombre substantiel, l'armée de l'air turque a été déployée en grand nombre et échange désormais des tirs avec des pilotes israéliens. Les pays occidentaux ont condamné cette action et demanderont probablement à l'ONU d'intervenir. Bien que l'Union soviétique soit restée silencieuse sur l'évolution de la situation, il est probable qu'elle soutienne pleinement l'intervention de la Turquie. Cette évolution constitue une escalade sismique au Moyen-Orient à mesure que l'horloge se rapproche de minuit."
SRT.37.d:0 ""
SRT.38.d:0 ""
SRT.39.d:0 ""

#KRD_Events
KRD.1.d:0 "Le Premier ministre du KDR, Ahmed Tofiq, a publié une déclaration appelant tous les peuples d'origine kurde à migrer vers le nouvel État kurde. Il a exprimé le besoin de main-d'oeuvre et d'expertise technique pour propulser la nation vers l'avenir. Tofiq a promis de l'emploi, un logement gratuit, la garantie d'une nourriture et d'une eau propres et d'une protection contre l'impérialisme et l'exploitation économique. Déjà, les Kurdes du monde entier ont été inspirés et ont quitté en masse les terres d'Irak, d'Iran et de Syrie pour rejoindre leurs nouveaux foyers. On s'attend à ce que la population des KRD triple d'ici la fin de l'année."
KRD.2.d:0 "Des nouvelles choquantes sont arrivées de la République démocratique du Kurdistan : le Premier ministre Ahmed Tofiq a publiquement exprimé son mépris à la fois pour la République socialiste de Turquie et pour le secrétaire général Husnu. Tofiq a déclaré que « les dommages que les Turcs ont causés au peuple kurde constituent une tache impardonnable sur la région et ne peuvent que justifier un isolement diplomatique du nouvel État kurde ». Sa déclaration a été complétée par le départ des diplomates kurdes de Turquie et le gel de toutes les communications d'État. La déclaration de Tofiq a provoqué une onde de choc dans le bloc de l'Est et dans le monde, beaucoup remettant en question la nature de l'Alliance soviétique et sa force. Cette déclaration a également suscité la colère d'Ankara et de Moscou, qui se sont empressés de dénoncer les déclarations de Tofiq comme étant « réactionnaires » et « puériles », mais il est probable qu'aucune mesure ne sera prise contre cette petite nation isolée."
KRD.3.d:0 "La République démocratique kurde est confrontée à une sécheresse massive sur tout son territoire. On craint que si la sécheresse ne cesse pas bientôt, le pays soit confronté à de graves pénuries alimentaires et à la famine. L'économie de la RDA est également largement agricole, ce qui signifie que la crise menace de provoquer une dépression économique. Le KDR appelle ses alliés socialistes à intervenir et à apporter leur soutien à l'État naissant. Cependant, la crise est considérée comme une confirmation par les critiques qui soutiennent que le KDR tel qu'il est n'est pas durable."
KRD.4.d:0 "La République démocratique kurde (RDK) a annoncé son intention de rejoindre la République socialiste turque. Le KDR a noté que le nouvel arrangement maintiendrait l'autonomie kurde et permettrait aux deux peuples de vivre ensemble dans un État socialiste juste. Le gouvernement turc a salué la nouvelle et prévoit d'organiser une cérémonie d'unification dans la capitale. Les analystes estiment que le KDR a pris cette décision à la suite des difficultés économiques et politiques auxquelles il est confronté depuis l'indépendance. La décision est bien accueillie par les États voisins à minorité kurde qui estiment que le KDR représente une force déstabilisatrice."
KDR.5.d:0 "La République démocratique kurde (RDK) a confirmé que sa candidature pour devenir la nouvelle République socialiste soviétique de l'URSS avait été acceptée. Le gouvernement soviétique a accueilli favorablement la nouvelle et a annoncé son intention d'accueillir les dirigeants kurdes à Moscou pour une cérémonie officielle. La décision du KDR est largement motivée par les conséquences de sa lutte pour faire face à une récente sécheresse. Les dirigeants de la KDR et l'Union soviétique ont tous deux convenu que l'inaction pourrait entraîner un effondrement économique ou politique. Au niveau international, cette décision est condamnée par l'Occident comme une expansion de l'impérialisme soviétique, mais est saluée par la plupart des États socialistes et pro-soviétiques."
KRD.6.d:0 "Des nouvelles surprenantes sont sorties du KDR puisque la nation a dénoncé la doctrine marxiste-léniniste dans la région. Même si le premier ministre Ahmed Tofiq a avoué son amour personnel pour le communisme de style soviétique caractérisé par une industrialisation rapide, il admet que la quantité de main-d'oeuvre et de ressources nécessaires au système a conduit la nation au désastre économique et environnemental. Le Premier ministre a déclaré que l'objectif du Kurdistan serait « d'amener la nation à un état de sainteté normalisé ». En pratique, cela signifie une réintroduction de la fonction tribale, une diminution des répressions politiques et une décentralisation extrême. En effet, le Kurdistan reviendra à un État féodal pré-révolutionnaire dirigé par un parti communiste. Moscou a dénoncé ces actions, mais Tofiq a assuré que le Kurdistan resterait fidèle au Kremlin tout en construisant lentement la base des infrastructures nécessaires à une industrialisation rapide."
KRD.7.d:0 ""
KRD.8.d:0 "La République démocratique kurde est confrontée à une deuxième sécheresse massive. La première sécheresse a provoqué des pénuries alimentaires massives et a fortement déstabilisé l'économie. Cette nouvelle sécheresse menace un nouveau déclin économique et fait craindre pour la stabilité politique de l'État. Le KDR réclame déjà de l'aide pour faire face à la crise. Cependant, même un afflux massif de soutien pourrait ne pas suffire. Certains au sein du gouvernement suggèrent discrètement que le KDR devrait peut-être chercher une solution alternative. Les responsables soviétiques seraient très préoccupés par l'avenir du projet socialiste en RDA."
KRD.9.d:0 "Hier, les régions de Muhabad et du sud de l'Azerbaïdjan en Iran ont été secouées par des nuées de réfugiés kurdes qui ont envahi la frontière. Alors que l'Iran a exprimé sa sympathie pour les réfugiés kurdes, Shah Pahlavi a déclaré que l'Iran n'était pas en mesure d'accueillir le demi-million de réfugiés. Cette déclaration fut bientôt confirmée lorsque des hectares de terres furent mis à nu par les Kurdes affamés. Lorsqu'on leur a demandé pourquoi tant de Kurdes avaient fui le régime communiste, les enquêteurs iraniens et de l'ONU ont été confrontés à un mur de silence car aucun Kurde sur le demi-million de réfugiés estimés n'a pris la parole. Même si l'on ne sait pas grand-chose, deux choses sont devenues claires. Le nord de l'Iran est tombé dans une anarchie totale et le régime communiste de la RDA doit être plus horrible que quiconque aurait pu le prédire."
KRD.10.d:0 "Une nouvelle choquante bouleverse le monde : pour la première fois depuis 1945, les frontières soviétiques se sont élargies. Ce qui était autrefois considéré comme une retraite du Kurdistan s'est avéré être une ruse. Les vagues de « réfugiés » kurdes qui ont afflué en Iran n'étaient pas une fuite, mais un communisme en expansion. La déstabilisation provoquée par l'immigration rapide a rendu impossible à l'Iran de mettre en place une défense coordonnée et les terres ont été rapidement prises par les forces conjointes kurdes-soviétiques. Malgré le mépris évident du droit international commis par l'Union soviétique, une grande partie de la faute a été imputée à l'ONU qui n'a pas réussi à organiser une réponse à temps. L'échec total du droit international a remis en question la viabilité des Nations Unies dans le maintien de la paix mondiale. Les conséquences de l'incompétence affichée par l'ONU et l'Iran peuvent facilement être démontrées par les colonnes de blindés soviétiques dévalant Tabriz. Pour l'instant, les conséquences ne peuvent être prédites, mais une chose est sûre. Les bottes soviétiques ne quitteront probablement jamais le nord de l'Iran."
KRD.11.d:0 "Une nouvelle choquante bouleverse le monde : l'Armée rouge a été stoppée en Iran. Il y a quelques jours à peine, l'Union soviétique et la RDA ont lancé une attaque surprise contre les forces iraniennes dans le sud de l'Azerbaïdjan. Bien que les vagues de réfugiés kurdes aient déstabilisé la région, les unités iraniennes ont courageusement défendu leur patrie et ont mis en déroute l'invasion conjointe soviéto-kurde, capturant ainsi de nombreuses armes top secrètes et expérimentales. L'Union soviétique et le Pacte de Varsovie sont devenus la risée internationale, beaucoup comparant la performance de l'URSS dans cet engagement à la guerre d'Hiver. On ne sait pas grand-chose de ce qui se passe au Kremlin, mais on soupçonne que plusieurs officiers ont été relevés de leurs fonctions et qu'une réévaluation de la doctrine soviétique est en cours. Ce que l'on sait, c'est que les terres iraniennes resteront iraniennes dans un avenir proche."
KRD.12.d:0 "Aujourd'hui, la République démocratique du Kurdistan a été acceptée au sein des Nations Unies. Beaucoup critiquent l'ONU pour avoir accordé un siège supplémentaire à une nation communiste. Cependant, l'ONU estime qu'inviter de nouveaux membres renforcera son pouvoir et contribuera à garantir la paix internationale. La République démocratique kurde et l'Union soviétique ont toutes deux soutenu avec enthousiasme l'adhésion de la nouvelle nation à l'ONU, et il est probable que des nations plus partiellement reconnues pourront rejoindre les Nations Unies."
KRD.13.d:0 "Même si nous avons enfin un État, les gens qui l'habitent sont marqués par les souvenirs du génocide et de la répression perse et arabe. Il est temps pour eux de reconnaître les dommages qu'ils ont causés à notre peuple. Une lettre a été soumise à l'Iran et à l'Irak demandant des réparations à la fois à notre grande nation et aux ancêtres de ceux qui ont été lésés par l'exploitation impérialiste et le racisme."
KRD.14.d:0 "Le nouvel État kurde a exigé que notre nation verse des réparations à son peuple. Même si nous avons incontestablement la capacité de les rembourser intégralement, et qu'il pourrait être stratégiquement logique d'entretenir des relations positives avec notre nouveau voisin, s'incliner devant un État kurde est indigne de notre nation. Que devons-nous faire ?"
KRD.15.d:0 "Bien que notre puissante nation du Kurdistan ait été libérée de l'impérialisme et de l'exploitation, une grande partie de notre territoire reste réprimée sous le joug des bottes étrangères. Par le destin, une partie de ces terres s'est retrouvée entre les mains de nos camarades d'Union soviétique. Bien que revendiquée par la RSS d'Arménie, la province d'Erzurum est à juste titre kurde. C'est pour cette raison qu'une lettre a été envoyée à Moscou, exhortant l'URSS à transférer Erzurum au peuple kurde."
KRD.16.d:0 "Nos camarades kurdes nous ont fait une proposition intéressante. Au nom de l'unité socialiste et de l'équité, ils demandent le transfert de l'État d'Erzurum de la RSS arménienne à la République démocratique kurde. Même si nous serions ravis d'aider nos camarades kurdes à libérer leur nation, nous avons également des projets concernant cette terre nouvellement acquise. Que faut-il faire ?"
KRD.17.d:0 "Aujourd'hui est un jour de fierté pour le socialisme et le peuple kurde. L'État d'Erzurum, ainsi que sa population et son industrie, ont été entièrement restitués à leurs propriétaires légitimes. Déjà, notre peuple célèbre dans la rue à mesure que notre nation s'agrandit. Trois bravo à nos camarades soviétiques, trois bravo au camarade Ahmed Tofiq et trois bravo au Kurdistan !"
KRD.18.d:0 "Aujourd'hui est un jour sombre pour les relations kurdes-soviétiques. Alors que les Soviétiques sympathisent avec notre cause de libération de tous les Kurdes, une lettre de Moscou déclare qu'Erzurum est désormais à juste titre soviétique. Ce déclin nous a appris que nos « alliés » en Union soviétique ne se soucient plus de nous. Nous devons maintenant travailler pour devenir par nous-mêmes un brillant exemple de la puissance de tout le peuple kurde."
KRD.19.d:0 "Ce qui semblait être une saison sèche normale est devenu incontrôlable et est devenu l'une des pires sécheresses de l'histoire. Chaque jour, des ouvriers d'usine, des mères et des enfants meurent de déshydratation au travail. Les rapports faisant état d'agriculteurs inoffensifs poussés au vampirisme clinique deviennent monnaie courante. Malgré tous nos efforts, la République Socialiste de Turquie et l'Union Soviétique sont incapables de fournir suffisamment d'eau à notre nation. Il faut faire quelque chose rapidement, sinon il ne restera plus personne."
KRD.21.d:0 "Le secrétaire général Sefik Husnu du SRT a écrit une lettre ouverte à notre peuple. Dans sa lettre, il appelle, pour le bien du peuple kurde, à renoncer à notre souveraineté et à rejoindre la Turquie en tant que région autonome ou l'Union soviétique en tant que RSS. Si nous l'acceptons, il promet que toutes les puissances des États soviétique et turc seront engagées pour aider le peuple kurde à survivre et, à terme, à reconstruire la région pour en faire une oasis rouge. Si nous acceptons, nous assurerons la sécurité de notre peuple au détriment de la nation pour laquelle nous avons lutté pendant des siècles."
KRD.22.d:0 "Même si les réformes précédentes nous ont permis d'obtenir davantage d'eau, la sécheresse va à nouveau faire des ravages sur nos terres. Ce fait nous amène à croire que la seule solution permanente est l'expansion. Bien qu'il existe de nombreuses cibles tentantes dans la région, le haut commandement militaire a choisi le lac Orumiyeh en Iran pour sa proximité avec Van et sa forte population kurde. Même si l'Iran est une marionnette importante des États-Unis, nous sommes convaincus que les États-Unis n'auront pas le courage de lancer une armogégion nucléaire sur un petit lac à l'autre bout du monde. Malgré cette conviction, notre plan repose sur la participation du Pacte de Varsovie au blocage diplomatique de toute réponse ainsi qu'à une frappe de diversion soviétique dans le sud de l'Azerbaïdjan. Jusqu'au jour de l'invasion, nos objectifs seront d'entraver l'efficacité de l'ONU et de déstabiliser l'Iran."
KRD.23.d:0 "Enfin, de l'eau propre coule de nos rivières et de nos éviers. La verdure revient dans notre grande nation et pour la première fois il y a de la vie dans les yeux des gens. Cela dit, la plupart n'ont aucune illusion sur le fait que le cauchemar pourrait revenir. Un changement de cap doit se produire. Certains membres du parti estiment que notre échec n'est pas dû à un engagement suffisamment ferme en faveur de l'industrialisation du Kurdistan. Même si les nouvelles usines et les terres agricoles ont contribué à la sécheresse, c'est le manque d'infrastructures qui a empêché les efforts de secours adéquats d'arriver. De nombreux membres du parti pensent cependant que nous étions condamnés dès la construction du premier complexe industriel. Ils suggèrent l'arrêt de tous les efforts d'industrialisation et un retour à un mode de vie pré-révolutionnaire. Bien que les deux options présentent des chemins valides, un seul peut être choisi."
KRD.24.d:0 "Même si nous avons déstabilisé l'Iran et entravé toute capacité de contre-attaque efficace, l'élément le plus important de l'opération demeure. Il est temps maintenant d'informer l'Union soviétique de nos intentions."
KRD.25.d:0 "Aujourd'hui, nous avons reçu une proposition à la limite de la folie de la part de la République démocratique kurde. Même si les informateurs du KGB ont fait état d'un renforcement de l'armée dans l'État kurde, personne ne l'avait prédit. En raison de la pénurie d'eau, les Kurdes ont exprimé leur désir que nous entrions dans les hostilités avec l'Iran (un allié majeur des États-Unis) et que nous sécurisions le lac Orumiyeh pour leur peuple. Beaucoup au Kremlin ont déjà rejeté cette idée farfelue. Si nous participons à l'invasion, nous risquons de plonger le monde dans l'enfer nucléaire. Cependant, si nous acceptons, les Kurdes ont promis que la province du sud de l'Azerbaïdjan serait une proie facile. Ils garantissent également qu'en raison de leurs efforts de déstabilisation, l'Iran sera incapable de défendre de manière organisée la région. L'Armée rouge a assuré que d'ici une semaine, 6 divisions pourraient être mobilisées pour une éventuelle invasion. Un choix peut être fait, et nous devons le faire judicieusement."
KRD.26.d:0 "Excellente nouvelle en provenance de l'Union Soviétique. Au moment où nous parlons, six des meilleures divisions de l'Armée rouge sont mobilisées à la frontière sud. Bien qu'ils n'aient pas ouvertement déclaré la participation soviétique, nous croyons avec une certitude absolue que notre invasion sera complétée par des blindés soviétiques. La victoire dans cette lutte est pratiquement assurée une fois les plans définitifs terminés. Ce n'est plus qu'une question de temps..."
KRD.27.d:0 "Horribles nouvelles en provenance d'URSS. Non seulement les Soviétiques ont refusé de nous aider à envahir un pays souverain, mais ils ont également exigé notre démobilisation complète. Même si de nombreux militaires kurdes souhaitent procéder seuls, il est largement admis que le lac Orumiyeh restera hors de notre portée."
KRD.28.d:0 "Aujourd'hui, c'est la fête, camarades. Nous célébrons la libération du nord de l'Iran de l'impérialisme avec de la nourriture dans le ventre et de l'eau dans nos tasses. Non seulement l'avenir de l'État kurde a été assuré, mais nous avons démontré la véritable puissance des armées de la classe ouvrière. Au moment où nous parlons, les lâches Iraniens se retirent de notre terre légitime, la queue repliée. Il est probable que ce jour, ainsi que les héros qui l'ont rendu possible, seront immortalisés dans le coeur et l'esprit de tous les Kurdes patriotes."
KRD.31.d:0 "Aujourd'hui, le drapeau tricolore kurde a été hissé sur la ville d'Al-Hasakah alors que la République démocratique kurde a pris le contrôle de toutes les terres kurdes du nord de la Syrie. Cette évolution fait suite à un pacte militaire et économique entre la KDR et la RAU. En échange du transfert de toutes les régions à majorité kurde, le Kurdistan (et l'URSS) ont accepté de financer le développement des infrastructures en Syrie, reliant ainsi le Pacte de Varsovie à son allié arabe. En outre, le Kurdistan a accepté d'intervenir aux côtés de la RAU dans toute guerre défensive contre Israël ou les États-Unis. Cet accord, bien que populaire parmi les habitants du Caire et de Van, a indigné de nombreuses personnes dans les provinces syriennes qui pensent que cet accord a été conclu pour affaiblir davantage leur influence sur la république."
KRD.33.d:0 "Hier, Cheikh Ahmed Tofiq est décédé paisiblement dans son bureau à 22h50. Alors que la rumeur d'un assassinat s'est rapidement répandue, le Parti des travailleurs kurdes a déclaré que la cause officielle du décès était un anévrisme cérébral. La nouvelle du décès du premier Premier ministre kurde a provoqué une onde de choc à travers le pays et des funérailles nationales sont sans aucun doute organisées. Quant à l'avenir des dirigeants kurdes, on ne sait pas grand-chose. Il est toutefois probable que les rênes du pouvoir reviendront soit au ministre des Affaires étrangères Dara Tawfiq, soit à l'idéologue en chef Sedigh Kamangar."
KRD.34.d:0 "Aujourd'hui, la guerre irako-kurde a connu une escalade dramatique lorsque les forces de la République démocratique kurde sont intervenues aux côtés des rebelles kurdes. Alors que les analystes du CENTO et de l'OTAN prédisaient une action militaire, les Kurdes ont réussi à masquer la véritable ampleur de leur opération militaire à venir. À 3 h 20 du matin, l'Armée rouge des travailleurs kurdes a lancé un barrage d'artillerie dévastateur qui a brisé les défenses irakiennes avancées. Cela a coïncidé avec des frappes aériennes à Bagdad, Mossoul et Al-Fallujah qui ont paralysé le haut commandement irakien et d'importants réseaux logistiques militaires. Deux heures plus tard, les divisions blindées kurdes ont envahi le nord de l'Irak, contournant les quelques positions défensives survivantes. Même si l'on ne sait pas si le Kurdistan pourra maintenir l'initiative dans les mois à venir, il est clair que l'Irak a été pris au dépourvu et non préparé à une telle offensive."
KRD.36.d:0 "À la grande déception de la communauté internationale, le communiste militariste Sedigh Kamangar a été élu Premier ministre de la République démocratique kurde. Considéré comme l'architecte de l'idéologie du PKK, Kamangar s'est battu avec acharnement sous Tofiq pour sécuriser autant de terres que possible au KDR et garantir un avenir puissant à son peuple. Dans ses discours et discours télévisés à la nation, Kamangar a fermement condamné les appels de Moscou à la coexistence avec d'autres États de la région. En plus de cela, il a également dénoncé les troupes soviétiques dans la région, déclarant que « la botte turque a été remplacée par une botte russe ». La communauté internationale, et les Soviétiques en particulier, sont mal à l'aise face à ce changement de leadership et nombreux sont ceux qui craignent un avenir sanglant pour la région."
KRD.37.d:0 "Aujourd'hui, les diplomates de la République démocratique kurde et de l'État impérial d'Iran se sont réunis à Erbil pour signer un accord de paix historique. Le soi-disant « Traité d'Erbil en 9 points » décrit ce qui suit : Un accord bilatéral sur la démilitarisation permanente du nord de l'Iran, ainsi que sur tous les futurs échanges territoriaux entre les deux pays. Le paiement par les Kurdes de pas moins de 100 milliards de réparations sur une période de 10 ans rendra tous les prisonniers de guerre et leurs armes aux autorités iraniennes. Une garantie kurde de respecter les droits religieux, culturels et ethniques des Iraniens et des musulmans chiites à l'intérieur de leurs frontières. Une garantie iranienne de respecter les droits religieux, culturels et ethniques de tous les Kurdes à l'intérieur de leurs frontières. Immigration libre des citoyens iraniens hors de l'Azerbaïdjan oriental. Reconnaissance de la République démocratique kurde et de ses frontières. Un pacte de non-agression et de non-intervention de 15 ans entre les deux parties. Un arrêt et un retrait immédiats de toutes les opérations secrètes orchestrées par les Kurdes en Iran. Élections libres et équitables dans les régions à majorité kurde d'Iran pour rejoindre la République démocratique kurde. Les commentateurs des deux côtés du rideau de fer sont ravis à l'annonce de cet accord historique. Même si l'avenir entre ces deux puissances du Moyen-Orient est incertain, nombreux sont ceux qui se sentent optimistes alors que la paix et la diplomatie triomphent à nouveau de la violence."
KRD.38.d:0 "Depuis ce matin, les terres du nord de l'Iran connaissent une nouvelle fois le conflit alors que la République démocratique kurde bombarde la petite ville de Baneh. Bien qu'on ne sache pas quel camp a ouvert le feu en premier, les Kurdes ont considérablement intensifié l'engagement, envoyant des renforts dans la région sous la forme de leur nouveau système d'obusiers Barzanji de 18 pouces et de T-34U modernisés. Même si un changement de territoire est peu probable, il est clair que les Kurdes ont l'intention de maintenir la pression sur l'État iranien."
KRD.39.d:0 "Un changement radical s'est produit aujourd'hui en République démocratique du Kurdistan. Lors d'un vote quasi unanime, le Kurdistan a été exclu du Pacte de Varsovie pour « mépris flagrant du droit international et corruption du nationalisme bourgeois ». Cette décision a été immédiatement suivie par la démolition par les troupes du Pacte de Varsovie des dernières infrastructures menant à leur ancien allié au Kurdistan. Ces derniers mois, les tensions entre Van et Moscou se sont considérablement intensifiées à propos du militarisme kurde au Moyen-Orient. Alors qu'elle était auparavant un allié puissant, l'URSS est de plus en plus contrariée par la politique étrangère agressive des Kurdes, qui bouleverse ses propres objectifs dans la région. Bien que les Soviétiques et de nombreux pays du Pacte de Varsovie aient rompu tous les liens économiques et politiques, les Chinois et divers mouvements communistes nationaux d'Europe de l'Est se sont engagés à accroître leur aide militaire et politique à cet État du Moyen-Orient de plus en plus isolé."
KRD.40.d:0 "À minuit précisément, des salves d'artillerie ont résonné à travers le Kurdistan. Alors que la région est aux prises avec des conflits sans fin, aujourd'hui, les armes ne tirent pas en signe de colère, mais en signe de célébration. Tout comme leurs camarades grecs, les Kurdes célèbrent plus d'une décennie de régime communiste en République démocratique du Kurdistan. Tout au long de la journée, le PKK a organisé des événements commémorant les héros du mouvement indépendantiste kurde et les réalisations du parti et de l'État. Le plus remarquable de ces événements a été un grand défilé dans la capitale Van. De grands chars commémorant tout, de la libération soviétique à un pipeline ultramoderne, en passant par leur annexion controversée du nord de l'Iran, étaient exposés sur la place de la Victoire. Imitant l'apparat soviétique, l'Armée rouge ouvrière kurde a également profité de l'occasion pour montrer des systèmes de missiles, une nouvelle variante de Kalachnikov et même un char de combat principal produit dans le pays. Après le défilé, Ahmed Tofiq a félicité le peuple kurde et a appelé à la libération totale du Kurdistan d'ici 1970 lors d'une rare apparition télévisée. Bien que célébrée dans les diasporas kurdes, de nombreuses personnes dans le monde arabe s'inquiètent de cette république de plus en plus militante."
KRD.41.d:0 "Aujourd'hui, le bureau politique du Parti des travailleurs kurdes a élu le ministre des Affaires étrangères Dara Tawfiq Premier ministre de la République démocratique kurde. Figure controversée du Kurdistan, Dara Tawfiq a promis de mettre fin à l'isolement diplomatique du KDR en normalisant les relations avec l'Iran et l'Occident. Dans une déclaration aux journalistes occidentaux, Tawfiq a souligné la nécessité de « se lier d'amitié avec l'Occident » et d'éviter de nouveaux dommages économiques au secteur civil de l'économie. De part et d'autre du rideau de fer, nombreux sont ceux qui poussent un soupir de soulagement alors que les modérés prennent le contrôle du Kurdistan."
Tofiq_Death:0 "Ahmed Tofiq est décédé"
KRD.42.d:0 "Les Kurdes nous ont fait une offre alléchante. En échange de nos terres à majorité kurde, la RDA s'engage à jouer un rôle actif dans la réalisation de notre rêve d'un État arabe unifié."
KRD.43.d:0 "Même si cela nous fait mal, pour assurer notre survie, nous devons à nouveau vivre sous la domination des étrangers. Les gouvernements de Turquie et de l'Union soviétique ont exprimé leur intérêt à nous aider dans notre situation difficile, si nous les rejoignons en tant qu'État autonome. Pour le meilleur de notre peuple, nous devrions nous incliner devant..."

