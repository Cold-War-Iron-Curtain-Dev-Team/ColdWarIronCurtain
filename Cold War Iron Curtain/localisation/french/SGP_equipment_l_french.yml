 SGP_jet_multirole_equipment_5:0 "Hawker Hunter F.74A"
 SGP_jet_multirole_equipment_5_short:0 "Chasseur F.74A"
 SGP_jet_multirole_equipment_5_desc:0 "Singapour était un opérateur enthousiaste du Hunter, commandant l'avion pour la première fois en 1968 lors d'une expansion massive des forces armées de la cité-État ; les livraisons ont commencé en 1971 et se sont achevées en 1973. À l'époque, une controverse internationale considérable a été générée lorsque la Grande-Bretagne (et, comme cela a été révélé plus tard, les États-Unis) avaient refusé de vendre des Hunters à la Malaisie voisine, suscitant des craintes d'une course aux armements régionale et des accusations de favoritisme."
 SGP_jet_multirole_equipment_6:0 "Hawker Hunter F.74B"
 SGP_jet_multirole_equipment_6_short:0 "Chasseur F.74B"
 SGP_jet_multirole_equipment_6_desc:0 "Singapour était un opérateur enthousiaste du Hunter, commandant l'avion pour la première fois en 1968 lors d'une expansion massive des forces armées de la cité-État ; les livraisons ont commencé en 1971 et se sont achevées en 1973. À l'époque, une controverse internationale considérable a été générée lorsque la Grande-Bretagne (et, comme cela a été révélé plus tard, les États-Unis) avaient refusé de vendre des Hunters à la Malaisie voisine, suscitant des craintes d'une course aux armements régionale et des accusations de favoritisme."
 SGP_jet_multirole_equipment_7:0 "Hawker Hunter F.74S"
 SGP_jet_multirole_equipment_7_short:0 "Chasseur F.74S"
 SGP_jet_multirole_equipment_7_desc:0 "À la fin des années 1970, la flotte singapourienne de Hunter a été améliorée et modifiée par Lockheed Aircraft Services Singapore (LASS) avec un point d'attache supplémentaire sous le fuselage avant et deux autres pylônes intérieurs (câblés uniquement pour les AIM-9 Sidewinders) avant les trains principaux, portant à un total de sept points d'attache pour les magasins externes et la livraison d'armes. À la suite de ces mises à niveau, ils ont été renommés FGA.74S, FR.74S et T.75S"
 SGP_jet_multirole_equipment_8:0 "Northrop F-5E Tigre II"
 SGP_jet_multirole_equipment_8_short:0 "F-5E Tigre II"
 SGP_jet_multirole_equipment_8_desc:0 "Singapour est un opérateur important de la variante F-5E/F, ayant commandé l'avion pour la première fois en 1976 lors d'une expansion massive des forces armées de la cité-État ; la livraison de ce premier lot de 18 F-5E et de trois F-5F a été achevée fin février 1979, équipant le nouveau 144 Black Kite Squadron à la base aérienne de Tengah." 
 SGP_jet_multirole_equipment_9:0 "General Dynamics F-16A Block 15 OCU (mises à niveau des capacités opérationnelles) Fighting Falcon"
 SGP_jet_multirole_equipment_9_short:0 "F-16A Bloc 15 OCU"
 SGP_jet_multirole_equipment_9_desc:0 "Premier changement majeur apporté au F-16, l'avion Block 15 présentait des stabilisateurs horizontaux plus grands, l'ajout de deux points d'attache à l'entrée du menton, un nouveau radar et une capacité accrue pour les pylônes sous les ailes. Cette variante a également acquis une radio ultra haute fréquence (UHF) à jour. Cette variante est la plus nombreuse parmi les variantes du F-16."
 SGP_jet_multirole_equipment_10:0 "General Dynamics F-16C Block 25 Faucon de combat"
 SGP_jet_multirole_equipment_10_short:0 "F-16C Bloc 25"
 SGP_jet_multirole_equipment_10_desc:0 "Première sous-variante du F-16C, un nouveau radar a été installé et un système de contrôle de tir amélioré, ainsi que des systèmes de données intégrés pour une capacité d'attaque de nuit améliorée. Introduite en 1984, la variante F-16C B25 servira de grande capacité pendant la guerre du Golfe Persique."

 SGP_mr_stealth_fighter_equipment_1:0 "General Dynamics F-16C Block 52+ 'Vipère'"
 SGP_mr_stealth_fighter_equipment_1_short:0 "Bloc F-16D 52+"
 SGP_mr_stealth_fighter_equipment_1_desc:0 "Les principales différences de cette variante sont l'ajout de la prise en charge des réservoirs de carburant conformes (CFT), d'un compartiment dorsal, du radar APG-68 (V9), d'un système de génération d'oxygène embarqué (OBOGS) et d'un casque JHMCS. Les CFT sont montés au-dessus de l'aile, des deux côtés du fuselage et sont facilement démontables. Ils fournissent 440 gallons américains (1 665 L) ou environ 3 000 livres (1 400 kg) de carburant supplémentaire, ce qui permet d'augmenter la portée ou le temps passé en station et de libérer des points d'attache pour les armes au lieu des réservoirs de carburant sous les ailes. Tous les avions biplaces « Plus » sont dotés d'un compartiment dorsal avionique élargi qui est situé derrière le cockpit et s'étend jusqu'à la queue. Il ajoute 30 pieds cubes (850 L) à la cellule pour plus d'avionique avec seulement de légères augmentations de poids et de traînée."

 SGP_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 SGP_jet_light_equipment_1_short:0 "Étoile filante T-33"
 SGP_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 #SGP_jet_light_equipment_2:0 ""
 #SGP_jet_light_equipment_2_short:0 ""
 #SGP_jet_light_equipment_2_desc:0 ""
 SGP_jet_light_equipment_3:0 "Hawker Chasseur T.75"
 SGP_jet_light_equipment_3_short:0 "Chasseur T.75"
 SGP_jet_light_equipment_3_desc:0 "Singapour était un opérateur enthousiaste du Hunter, commandant l'avion pour la première fois en 1968 lors d'une expansion massive des forces armées de la cité-État ; les livraisons ont commencé en 1971 et se sont achevées en 1973. À l'époque, une controverse internationale considérable a été générée lorsque la Grande-Bretagne (et, comme cela a été révélé plus tard, les États-Unis) avaient refusé de vendre des Hunters à la Malaisie voisine, suscitant des craintes d'une course aux armements régionale et des accusations de favoritisme."
