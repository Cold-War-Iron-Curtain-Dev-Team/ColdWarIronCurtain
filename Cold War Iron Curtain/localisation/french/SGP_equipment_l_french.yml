 SGP_jet_CAS_equipment_4:0 "Hawker Hunter FGA.74A"
 SGP_jet_CAS_equipment_4_short:0 "Chasseur FGA.74A"
 SGP_jet_CAS_equipment_4_desc:0 "Singapour était un opérateur enthousiaste du Hunter, commandant l'avion pour la première fois en 1968 lors d'une expansion massive des forces armées de la cité-État ; les livraisons ont commencé en 1971 et se sont achevées en 1973. À l'époque, une controverse internationale considérable a été générée lorsque la Grande-Bretagne (et, comme cela a été révélé plus tard, les États-Unis) avaient refusé de vendre des Hunters à la Malaisie voisine, suscitant des craintes d'une course aux armements régionale et des accusations de favoritisme."
 SGP_jet_CAS_equipment_5:0 "Hawker Hunter FGA.74B"
 SGP_jet_CAS_equipment_5_short:0 "Chasseur FGA.74B"
 SGP_jet_CAS_equipment_5_desc:0 "Singapour était un opérateur enthousiaste du Hunter, commandant l'avion pour la première fois en 1968 lors d'une expansion massive des forces armées de la cité-État ; les livraisons ont commencé en 1971 et se sont achevées en 1973. À l'époque, une controverse internationale considérable a été générée lorsque la Grande-Bretagne (et, comme cela a été révélé plus tard, les États-Unis) avaient refusé de vendre des Hunters à la Malaisie voisine, suscitant des craintes d'une course aux armements régionale et des accusations de favoritisme."
 SGP_jet_CAS_equipment_6:0 "Hawker Hunter FGA.74S"
 SGP_jet_CAS_equipment_6_short:0 "Chasseur FGA.74S"
 SGP_jet_CAS_equipment_6_desc:0 "À la fin des années 1970, la flotte singapourienne de Hunter a été améliorée et modifiée par Lockheed Aircraft Services Singapore (LASS) avec un point d'attache supplémentaire sous le fuselage avant et deux autres pylônes intérieurs (câblés uniquement pour les AIM-9 Sidewinders) avant les trains principaux, portant à un total de sept points d'attache pour les magasins externes et la livraison d'armes. À la suite de ces mises à niveau, ils ont été renommés FGA.74S, FR.74S et T.75S"

 SGP_cv_jet_CAS_equipment_4:0 "Douglas A-4B Skyhawk"
 SGP_cv_jet_CAS_equipment_4_short:0 "A-4B Skyhawk"
 SGP_cv_jet_CAS_equipment_4_desc:0 "L'A-4B est un engin d'attaque léger monomoteur capable de transporter la même charge de bombes qu'un B-17 malgré son châssis plus petit. Servant dans plusieurs forces aériennes et aéronavales depuis son introduction en 1954, il a connu de nombreuses modifications et modernisations au cours de ses plus de 60 années de service et continue de servir dans de nombreux pays jusqu'à ce jour. Son surnom est « Skyhawk »."
 SGP_cv_jet_CAS_equipment_5:0 "Douglas A-4E Skyhawk"
 SGP_cv_jet_CAS_equipment_5_short:0 "A-4E Skyhawk"

