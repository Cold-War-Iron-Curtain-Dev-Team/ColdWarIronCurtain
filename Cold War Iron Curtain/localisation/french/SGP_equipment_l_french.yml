 SGP_sam_carrier_equipment_4_desc:0 "Le RBS 70 était un système de missile portable qui pouvait également être monté sur un véhicule blindé de combat V200."
 SGP_sam_carrier_equipment_5:0 "ST Kinetics M113A2 Igla ultra mécanisé"
 SGP_sam_carrier_equipment_5_short:0 "M113A2 Igla ultra mécanisé"
 SGP_sam_carrier_equipment_5_desc:0 "Armé de six SAM (missiles sol-air) soviétiques Igla prêts à tirer et configuré pour le rôle de défense aérienne à courte portée (SHORAD). La variante de l'unité de tir intégrée (IFU) est équipée d'un radar de contrôle de tir avancé pour aider à localiser avec précision l'emplacement des avions ennemis à abattre tandis que la version de l'unité de tir d'armes (WFU) n'a pas de radar monté au centre mais peut être repérée et dirigée par le radar de contrôle de tir du premier. Cette version modifiée à Singapour du M113 est utilisée par la Republic of Singapore Air Force (RSAF) pour être utilisée dans la défense aérienne au sol."

