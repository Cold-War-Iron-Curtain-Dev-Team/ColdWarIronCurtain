 SGP_utility_helicopter_equipment_3:0 "Bell UH-1H Iroquois"
 SGP_utility_helicopter_equipment_3_short:0 "UH-1H Iroquois"
 SGP_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."

 SGP_utility_helicopter_equipment_6:0 "Aérospatiale AS332 Super Puma"
 SGP_utility_helicopter_equipment_6_short:0 "AS332 Super Puma"
 SGP_utility_helicopter_equipment_7:0 "Eurocopter EC225 Super Puma"
 SGP_utility_helicopter_equipment_7_short:0 "EC225 Super Puma"

 SGP_cargo_helicopter_equipment_5:0 "Boeing CH-47SD Chinook"
 SGP_cargo_helicopter_equipment_5_short:0 "CH-47SD Chinook"
 SGP_cargo_helicopter_equipment_5_desc:0 "CH-47SD amélioré avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les Chinook plus anciens ont été mis à niveau vers cette norme." 
 SGP_cargo_helicopter_equipment_6:0 "Boeing CH-47F Chinook"
 SGP_cargo_helicopter_equipment_6_short:0 "CH-47F Chinook"
 SGP_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, un CH-47D amélioré, a effectué son vol inaugural ; le premier modèle de production a été déployé le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les mises à niveau comprennent des moteurs Honeywell de 4 868 chevaux (3 630 kW) et la cellule dotée d'une plus grande construction monobloc pour réduire les besoins de maintenance. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion pour augmenter la durée de vie."

 SGP_attack_helicopter_equipment_4:0 "Arc long Apache McDonnell Douglas AH-64D"
 SGP_attack_helicopter_equipment_4_short:0 "AH-64D Apache"
 SGP_attack_helicopter_equipment_4_desc:0 "Fierté de l'armée américaine, en plus de sa superbe maniabilité, le radar Longbow fixé au-dessus du rotor principal améliore sa capacité à utiliser des missiles dans toutes sortes de conditions météorologiques. En raison du radar susmentionné, on lui donne le surnom d'« Apache Longbow »."
