 SGP_jet_light_equipment_4_short:0 "Maître de frappe Mk 84"
 SGP_jet_light_equipment_5:0 "ST Aerospace TA-4SU Super Skyhawk"
 SGP_jet_light_equipment_5_short:0 "TA-4SU Super Skyhawk"

 SGP_jet_recon_equipment_0:0 "Étoile filante Lockheed RT-33A"
 SGP_jet_recon_equipment_0_short:0 "Étoile filante RT-33A"
 SGP_jet_recon_equipment_0_desc:0 "RT-33A modifié avant la livraison en tant que variante de reconnaissance monoplace ; 85 construits, principalement pour l'exportation dans le cadre du programme d'assistance militaire."
 SGP_jet_recon_equipment_1:0 "Hawker Hunter FR.74S"
 SGP_jet_recon_equipment_1_short:0 "Chasseur FR.74S"
 SGP_jet_recon_equipment_1_desc:0 "Version monoplace de reconnaissance du Hunter FR.74S pour les missions de reconnaissance photo derrière les lignes ennemies."
 SGP_jet_recon_equipment_2:0 "Lockheed F-16C Block 25 Faucon de combat"
 SGP_jet_recon_equipment_2_short:0 "Reconnaissance F-16C Block 25"
 SGP_jet_recon_equipment_2_desc:0 "Lockheed F-16C Block 25 Fighting Falcon équipé d'un pod de reconnaissance pour les missions de reconnaissance."

 SGP_jet_tac_bomber_equipment_7:0 "McDonnell Douglas F-15E Strike Eagle"
 SGP_jet_tac_bomber_equipment_7_short:0 "Aigle de frappe F-15E"
 SGP_jet_tac_bomber_equipment_7_desc:0 "Un chasseur-bombardier doté de la capacité de combat air-air du F-15C et de capacités air-sol supplémentaires. Capable d'être équipé d'un large éventail d'armements, notamment anti-aériens, d'attaque au sol, de missiles multi-verrouillage et de bombes aériennes, il est capable de faire face à une variété de situations. Appelé « Strike Eagle », son extérieur est presque identique à celui du F-15C, il offre diverses améliorations en matière d'attaque au sol."
 SGP_jet_tac_bomber_equipment_8:0 "Boeing F-15SG Strike Eagle"
 SGP_jet_tac_bomber_equipment_8_short:0 "Aigle d'attaque F-15SG"
 SGP_jet_tac_bomber_equipment_8_desc:0 "La variante F-15 Advanced Eagle est une mise à niveau par rapport aux modèles précédents dans la mesure où elle comprend deux points d'attache supplémentaires pour les armes sous les ailes (augmentant le nombre de neuf à onze) ; l'option d'un cockpit d'affichage de grande surface ; commandes de vol électriques ; le radar à réseau actif à balayage électronique (AESA) Raytheon AN/APG-82(V)1 ou AN/APG-63(V)3 ; Moteurs General Electric General Electric F110-129 ; systèmes de repérage numériques communs montés sur casque dans les deux cockpits ; et un système de guerre électronique numérique, entre autres améliorations."
 
