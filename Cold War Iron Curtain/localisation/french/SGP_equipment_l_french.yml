 SGP_infantry_equipment_0:0 "Fusil Lee - Enfield, n ° 5 Mk I, carabine Jungle"
 SGP_infantry_equipment_0_short:0 "Fusil n°5 Mk I"
 SGP_infantry_equipment_0_desc:0 "Le fusil n° 5 Mk I était un dérivé du britannique Lee-Enfield n° 4 Mk I. Suite à l'expérience des combats dans la jungle pendant la guerre du Pacifique, les Britanniques sont arrivés à la conclusion qu'un fusil plus court et plus léger que le modèle standard, le fusil à verrou.303 cal n° 4 était nécessaire. Cependant, son utilisation opérationnelle a eu lieu dans les campagnes coloniales d'après-guerre telles que l'urgence malaise, où il a gagné son surnom commun de Jungle Carbine."

 SGP_infantry_equipment_1:0 "Fusil à chargement automatique L1A1"
 SGP_infantry_equipment_1_short:0 "L1A1 REFLEX"
 SGP_infantry_equipment_1_desc:0 "Le L1A1 SLR est une version britannique du fusil de combat belge FN FAL. Il a été produit sous licence et a été utilisé dans de nombreux pays du Commonwealth. Le Royaume-Uni a produit sa propre variante du FN FAL intégrant les modifications développées par l'Allied Rifle Committee, le désignant le L1A1 Self Loading Rifle (SLR). Les armes ont été fabriquées par la Royal Small Arms Factory Enfield, Birmingham Small Arms, la Royal Ordnance Factory et le ROF Fazakerley. Après l'arrêt de la production, des composants de remplacement ont été fabriqués par Parker Hale Limited. Le SLR a servi dans les forces armées britanniques de 1954 à 1994 environ, remplacé par le L85A1 à partir de 1985."

 SGP_infantry_equipment_2:0 "Polymère de fusil à chargement automatique L1A1"
 SGP_infantry_equipment_2_short:0 "L1A1 SLR(p)"
 SGP_infantry_equipment_2_desc:0 "Version polymère plus légère du L1A1 SLR."

 SGP_infantry_equipment_3:0 "Fusil, calibre 5,56 mm, M16S1"
 SGP_infantry_equipment_3_short:0 "M16S1"
 SGP_infantry_equipment_3_desc:0 "Produit sous licence, une variante locale du M16A1. Le XM16E1 de l'armée américaine était essentiellement la même arme que le M16 avec l'ajout d'une assistance avancée et d'encoches correspondantes dans le porte-boulon. Le M16A1 était le modèle de production finalisé en 1967 et a été produit jusqu'en 1982. Pour résoudre les problèmes soulevés par le cycle de test du XM16E1, un suppresseur de flash fermé en cage à oiseaux a remplacé le suppresseur de flash à trois volets du XM16E1 qui s'accrochait aux brindilles et aux feuilles. Divers autres changements ont été apportés après de nombreux problèmes sur le terrain. Des kits de nettoyage ont été développés et distribués tandis que des canons avec des chambres chromées et plus tard des alésages entièrement doublés ont été introduits."

 SGP_infantry_equipment_4:0 "Fusil d'assaut de Singapour, 21e siècle"
 SGP_infantry_equipment_4_short:0 "DAS 21"
 SGP_infantry_equipment_4_desc:0 "Le SAR 21 (Singapore Assault Rifle - 21st Century) est un fusil d'assaut bullpup conçu et fabriqué à Singapour. Révélé pour la première fois puis adopté par les Forces armées de Singapour (SAF) comme arme de service standard en 1999, il a été conçu et développé sur une période de quatre ans et était destiné à remplacer le M16S1 construit sous licence localement."


