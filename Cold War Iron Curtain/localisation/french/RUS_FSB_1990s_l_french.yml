 # Russian 1990s State Security & FSB Localization
 RUS_90S_STATE_SECURITY: "Sécurité de l'État russe et contre-espionnage"
 RUS_90S_STATE_SECURITY_desc: "Après la dissolution de l'Union soviétique, l'appareil monolithique du KGB a été divisé en agences concurrentes. Tout au long des années 1990, du ministère de la Sécurité (MBRF) au Service fédéral de contre-espionnage (FSK) et finalement au Service fédéral de sécurité (FSB), les organes de la Loubianka se sont restructurés pour survivre aux troubles économiques, à la confrontation politique et à la montée des conflits internes."

 RUS_mbrf_ministry_of_security: "Ministère de la Sécurité de la Fédération de Russie (MBRF)"
 RUS_mbrf_ministry_of_security_desc: "Créé en janvier 1992 par Boris Eltsine, le MBRF a conservé une grande partie des deuxième, troisième et quatrième directions principales du KGB. Bien qu'affaibli par le gel budgétaire et la suspicion politique, il conserve des capacités internes de contre-espionnage et de surveillance."

 RUS_fsk_counterintelligence: "Service fédéral de contre-espionnage (FSK)"
 RUS_fsk_counterintelligence_desc: "Créé par le décret présidentiel n° 2167 à la suite de la crise constitutionnelle d'octobre 1993, le FSK a été privé de ses pouvoirs d'enquête et de ses centres de détention spéciaux par un Kremlin suspect. Il opère sous une surveillance civile stricte, ce qui nuit à l'efficacité opérationnelle."

 RUS_fsb_security_service: "Service fédéral de sécurité (FSB)"
 RUS_fsb_security_service_desc: "Créé en vertu de la loi fédérale n° 40-FZ en avril 1995, le FSB a rétabli de vastes capacités d'enquête, de détention et d'infiltration à Loubianka. Il coordonne les opérations antiterroristes, le soutien au renseignement étranger et la protection des frontières à travers la Fédération."

 RUS_fsb_centralized_lubyanka: "Loubianka restructurée"
 RUS_fsb_centralized_lubyanka_desc: "Sous la direction administrative directe de vétérans fidèles des organes, le FSB a consolidé son autorité politique, économique et sécuritaire. Les siloviki sont devenus le pilier fondateur de l'appareil d'État russe."

 # Decisions
 RUS_fsb_counter_espionage_sweeps: "Lancez des campagnes de contre-espionnage"
 RUS_fsb_counter_espionage_sweeps_desc: "Ordonner aux agents de contre-espionnage de surveiller les contacts des ambassades étrangères, de défendre les bureaux de conception stratégique de défense et de contrecarrer le recrutement de ressources du renseignement étranger en cette ère d'instabilité."

 RUS_fsb_tsn_alpha_vympel_readiness: "Préparation du Centre d'opérations spéciales (TsSN)"
 RUS_fsb_tsn_alpha_vympel_readiness_desc: "Fournir un financement d'urgence dédié et des munitions tactiques avancées aux détachements d'élite antiterroristes Alpha et Vympel, garantissant ainsi une préparation à un déploiement rapide pour les situations de prise d'otages et les opérations secrètes."

 RUS_fsb_economic_security_and_anti_corruption: "Direction de la sécurité économique et de la lutte contre la corruption"
 RUS_fsb_economic_security_and_anti_corruption_desc: "La Direction des tâches « K » et les branches de la sécurité économique sont chargées de suivre la fuite illicite des capitaux, d'auditer les transferts d'actifs des entreprises d'État et de lutter contre les rackets d'extorsion gérés par les cartels du crime organisé."

 RUS_fsb_caucasus_counter_terrorism: "Opérations antiterroristes dans le Caucase"
 RUS_fsb_caucasus_counter_terrorism_desc: "Déployez des groupes de travail d'enquête opérationnelle, d'interception de signaux et des équipes spécialisées dans le Caucase du Nord turbulent pour interdire les réseaux terroristes séparatistes et les canaux financiers étrangers."

 RUS_fsb_integrate_border_guard_service: "Intégrer le Service fédéral des gardes-frontières (FPS)"
 RUS_fsb_integrate_border_guard_service_desc: "Fusionner le Service fédéral des gardes-frontières, auparavant autonome, dans le commandement structurel de la Loubianka, rétablissant ainsi le contrôle unifié des postes frontières de l'État, des flottilles des garde-côtes et des points de contrôle frontaliers."

 # Events
 RUS_FSB90.1.t: "Liquidation du KGB et du MBRF"
 RUS_FSB90.1.d: "Avec l'effondrement officiel de l'URSS fin décembre 1991, le Comité pour la sécurité de l'État (KGB), autrefois tout-puissant, a été complètement dissous. Le président Boris Eltsine, soucieux d'empêcher l'appareil de sécurité de organiser un nouveau putsch comme celui d'août 1991, a décidé de créer le ministère de la Sécurité de la Fédération de Russie (MBRF).\n\nDirigé par Viktor Barannikov, le nouveau ministère hérite du contre-espionnage interne, de la surveillance des communications et des directions régionales, tandis que l'espionnage étranger est confié au Service de renseignement étranger (SVR) nouvellement créé. Alors que certains au sein du Soviet suprême mettent en garde contre le maintien des principaux cadres de la Loubianka, la spirale de la criminalité et les tensions ethniques dans le pays exigent une barrière de sécurité fonctionnelle."
 RUS_FSB90.1.a: "Créer le Ministère de la Sécurité (MBRF)."
 RUS_FSB90.1.b: "Décentraliser et réduire davantage l'appareil."

 RUS_FSB90.2.t: "Décret n° 2167 : Démantèlement du MBRF et création du FSK"
 RUS_FSB90.2.d: "Le point culminant de la crise constitutionnelle d'octobre 1993 a vu des chars de l'armée bombarder la Maison Blanche à Moscou, mais le ministère de la Sécurité est resté visiblement hésitant à écraser complètement l'opposition parlementaire. Méfiant à l'égard de la loyauté du MBRF, le président Boris Eltsine a publié le décret présidentiel n° 2167, abolissant sommairement le ministère de la Sécurité.\n\nÀ sa place, le Service fédéral de contre-espionnage (FSK) est créé sous la direction de Nikolai Golushko. La nouvelle agence a été délibérément affaiblie : sa maison d'arrêt de Lefortovo a été confiée au ministère de la Justice, ses forces spéciales réaffectées et sa capacité à mener des enquêtes criminelles indépendantes supprimée. La Loubianka se trouve à son point le plus faible de l'histoire moderne."
 RUS_FSB90.2.a: "Signer le décret n° 2167 : Créer le FSK."
 RUS_FSB90.2.b: "Préservez le ministère de la Sécurité pour l'instant."

 RUS_FSB90.3.t: "Loi fédérale n° 40-FZ : Création du Service fédéral de sécurité"
 RUS_FSB90.3.d: "Le début désastreux de la première guerre de Tchétchénie fin 1994, associé à des débâcles secrètes très médiatisées à Grozny impliquant des mercenaires engagés par le FSK, ont mis à nu les failles catastrophiques d'un service de contre-espionnage châtré. La Douma d'État russe et le président ont finalement convenu de la nécessité urgente de restaurer une autorité centrale unifiée.\n\nLe 3 avril 1995, le président Eltsine signe la loi fédérale n° 40-FZ « sur les organes du Service fédéral de sécurité dans la Fédération de Russie ». Le FSK est réorganisé en Service fédéral de sécurité (FSB). La nouvelle loi rétablit les pleins pouvoirs d'enquête préliminaire, de détention armée et de collecte de renseignements étrangers dans les territoires frontaliers, ramenant la Loubianka au centre de l'appareil politique russe."
 RUS_FSB90.3.a: "Promulguer la loi n° 40-FZ : Création du Service fédéral de sécurité (FSB)."

 RUS_FSB90.4.t: "Vladimir Poutine nommé directeur du FSB"
 RUS_FSB90.4.d: "En juillet 1998, dans un contexte d'aggravation de la crise financière, d'effondrement du rouble et de violentes guerres de factions au sein du Kremlin, le président Eltsine a limogé Nikolaï Kovalev et nommé Vladimir Vladimirovitch Poutine, 45 ans, au poste de directeur du FSB.\n\nAncien officier des renseignements étrangers du KGB en poste à Dresde et plus tard premier vice-chef d'état-major présidentiel, Poutine jouit de la confiance du cercle restreint du Kremlin pour sa discrétion, sa compétence procédurale et sa loyauté inébranlable. Poutine lance immédiatement une réorganisation structurelle massive de la Loubianka, éliminant les divisions redondantes, créant la Direction de la sécurité informatique et de l'information et établissant un contrôle opérationnel personnel sur tous les chefs de département."
 RUS_FSB90.4.a: "Confiez la Loubianka à Vladimir Poutine."
 RUS_FSB90.4.b: "Maintenir la surveillance civile traditionnelle."

 RUS_FSB90.5.t: "L'ascendant Siloviki : Patrouchev et la guerre contre le terrorisme"
 RUS_FSB90.5.d: "En août 1999, alors que Vladimir Poutine est élevé au rang de Premier ministre, son fidèle associé de Saint-Pétersbourg, Nikolai Patrushev, est confirmé comme nouveau directeur du FSB. La passation de pouvoir intervient à un moment de crise mortelle : les brigades insurgées tchétchènes dirigées par Shamil Bassaïev ont envahi le Daghestan voisin, déclenchant la Seconde Guerre tchétchène, immédiatement suivie par des attentats à la bombe dévastateurs dans des appartements à Bouïnaksk, Moscou et Volgodonsk.\n\nSous Patrushev et Poutine, le FSB prend le commandement du Groupe unifié des forces et de l'état-major opérationnel national de lutte contre le terrorisme. L'ère de la paralysie démocratique et du retrait des organes de sécurité est terminée ; les « siloviki » - vétérans de la sécurité de l'État - ont consolidé leur emprise sur les institutions de la Fédération de Russie."
 RUS_FSB90.5.a: "Les organes de sécurité de l'État sont unis."
