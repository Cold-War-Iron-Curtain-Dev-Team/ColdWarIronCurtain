###Events###

MEN.0.t:0 "La succession de la Mongolie intérieure"
MEN.0.d:0 "Suite à l'arrivée des troupes soviétiques en Mandchourie, l'ancienne région autonome de Mongolie a déclaré son indépendance de la Chine et du Parti communiste chinois et a établi un gouvernement provisoire sous la direction d'Ulanhu. Il a affirmé que son gouvernement administrerait provisoirement les régions de Mongolie intérieure qui ne sont pas sous le contrôle du Kuomintang et qu'il finirait par se réunir avec notre gouvernement. Il est toutefois incertain que cela soit vrai, mais nous ne pouvons malheureusement pas faire grand-chose pour remédier à cette évolution sans risquer la colère de l'Union soviétique."
MEN.0.a:0 "Nous les traiterons plus tard."
MEN.0.b:0 "La Mongolie ne tombera pas aux mains des Chinois ! (Incarnez la Mongolie intérieure)"

MEN.1.t:0 "La campagne de réforme agraire en Mongolie intérieure"
MEN.1.d:0 "Dans le cadre de nos objectifs et de nos politiques, nous lancerons des campagnes massives de réforme agraire, en saisissant les terres agraires des classes moyennes et supérieures restantes et en les redistribuant aux paysans locaux. Nous deviendrons les organisateurs du bien-être des masses, et elles se rallieront véritablement à nous et nous apporteront leur soutien chaleureux. Les anciens propriétaires des terres confisquées n'auront droit à aucune compensation pour avoir exploité la classe ouvrière pendant des décennies."
MEN.1.a:0 "Parfait."

MEN.2.t:0 "La République de Mongolie intérieure exige l'extraction du prince Demchugdongrob"
MEN.2.d:0 "À la suite de l'invasion mongole-soviétique de la Mandchourie, les régimes fantoches japonais du Mandchoukouo et de Mengjiang ont été dissous. Alors que l'empereur Puyi n'a pas réussi à s'échapper de Chine, l'ancien collaborateur le prince Demchugdongrob a été libéré par nos soins de sa prison à Pékin et a été nommé représentant des territoires mongols intérieurs de Chine. En raison de la pression croissante de la République socialiste de Mongolie intérieure nouvellement fondée ainsi que de l'Union soviétique, Moscou et Xilinhot exigent de notre gouvernement que nous expulsions le prince Demchugdongrob pour qu'il soit jugé pour ses crimes."
MEN.2.a:0 "Sont-ils fous ? Non."

MEN.4.t:0 "Nankin refuse"
MEN.4.d:0 "Le gouvernement de Nanjing a refusé de renvoyer le prince Demchugdongrob en Mongolie intérieure. Ces traîtres préfèrent assurer la sécurité d'un collaborateur impérialiste japonais plutôt que de nous le livrer."
MEN.4.a:0 "Nous n'oublierons pas cela."

MEN.5.t:0 "L'avenir de la deuxième République mongole"
MEN.5.d:0 "Après le retrait de l'Armée populaire de libération en Mandchourie et la chute de Mao Zedong au sein du Parti communiste, Ulanhu a formé un gouvernement provisoire de Mongolie intérieure qui administrera la région de Mongolie intérieure jusqu'à ce que la situation géopolitique devienne plus claire. Avec la création du gouvernement populaire du nord de la Chine sous l'administration pro-soviétique de Wang Ming, le moment est venu pour le gouvernement provisoire de choisir la voie à suivre en Mongolie intérieure. Certains membres estiment que la région devrait se réunifier avec les Chinois et ainsi rejoindre le gouvernement de Wang Ming tandis que les représentants mongols soutiennent que la réunification avec la Réaction populaire mongole serait la meilleure option. D'autres voix soutiennent que nous devrions maintenir notre indépendance et servir d'État tampon entre les Chinois et les Mongols, afin d'apaiser l'Union soviétique et d'obtenir son soutien."
MEN.5.a:0 "Alliez-vous au Parti communiste chinois."
MEN.5.b:0 "Nous devons maintenir notre indépendance !"
MEN.5.c:0 "La réunification avec la Mongolie est la seule option."

MEN.6.t:0 "[GetNewspaperHeader]La deuxième République de Mongolie intérieure"
MEN.6.d:0 "Suite à la défaite écrasante de l'Armée populaire de libération contre les forces du Kuomintang en Chine, l'ancienne région autonome mongole de l'éphémère République populaire de Chine a déclaré son indépendance provisoire. Aujourd'hui à Xilinhot, le bureau politique du Parti communiste de Mongolie intérieure a décidé de maintenir son propre État pour le moment, en se rapprochant de l'Union soviétique plutôt que de la Mongolie et du gouvernement populaire du nord de la Chine. Le gouvernement mongol n'a manifesté aucune forme de protestation contre cette déclaration, affirmant que ces régions étaient sous domination Han depuis un certain temps. Le Parti communiste chinois a cependant condamné cette action, accusant le gouvernement de Xilinhot de diviser davantage le mouvement prolétarien asiatique. L'Union soviétique n'a pas encore fait de déclaration officielle, mais les experts estiment qu'il est dans l'intérêt de Moscou de créer un autre État tampon entre la Chine du Nord et la Mongolie. Le gouvernement du Kuomintang a dénoncé cette déclaration comme étant invalide sur la base de sa politique d'une seule Chine et a annoncé l'augmentation des renforts aux frontières sino-mongoles."
MEN.6.a:0 "Cela divisera-t-il encore davantage la Chine ?"

MEN.7.t:0 "La Mongolie intérieure veut rejoindre notre gouvernement"
MEN.7.d:0 "Après de violentes discussions à Xilinhot, le Parti communiste de Mongolie intérieure, sous la direction d'Ulanhu, a décidé que la Mongolie intérieure devrait à nouveau rejoindre notre gouvernement et être intégrée au gouvernement populaire de la Chine du Nord en tant que province autonome. Le président Wang Ming a apprécié cette décision et a annoncé que le peuple chinois du Nord était disposé à rendre la transition aussi douce que possible et à respecter les demandes et les besoins culturels et nationaux du peuple de Mongolie intérieure."
MEN.7.a:0 "Magnifique."

MEN.8.t:0 "La Mongolie intérieure veut rejoindre notre gouvernement"
MEN.8.d:0 "Après de violentes discussions à Xilinhot, le Parti communiste de Mongolie intérieure, sous la direction d'Ulanhu, a décidé que la Mongolie intérieure devrait se réunir à notre gouvernement et être intégrée à la République populaire mongole. Le président Yumjaagiin Tsedenbal a apprécié cette décision et a annoncé que le peuple mongol extérieur du Nord était disposé à rendre la transition aussi douce que possible et à respecter les demandes et les besoins culturels et nationaux du peuple mongol intérieur."
MEN.8.a:0 "Magnifique."

MEN.9.t:0 "[GetNewspaperHeader] La réunification de la Mongolie."
MEN.9.d:0 "Depuis la chute de la dynastie Qing et la guerre civile russe, les régions de la Mongolie ont été divisées, les régions extérieures faisant partie de la sphère soviétique et les parties intérieures passant de propriété entre la Chine et le Japon au cours des dernières décennies. Aujourd'hui, le gouvernement provisoire de Mongolie intérieure, formé au lendemain de la guerre civile chinoise et de la victoire du Kuomintang, a annoncé son intention de rejoindre la République populaire de Mongolie. Le gouvernement mongol extérieur a montré une grande appréciation pour cette décision et aide Xilinhot à se préparer à une intégration en douceur, tandis que le Parti communiste chinois a critiqué cette décision, affirmant qu'elle mettrait en danger le bien-être de millions de Chinois Han vivant en Mongolie intérieure. Les experts supposent également que la division Han-Mongole constituera un défi majeur pour le nouveau gouvernement pan-mongol et pensent que les tensions sociales et les troubles vont augmenter rapidement."
MEN.9.a:0 "Un développement surprenant."