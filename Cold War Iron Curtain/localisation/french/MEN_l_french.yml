50s_MENs:0 "Arbre Focus des années 50 de Mongolie intérieure"

POLITICS_ULANHU_DESC:0 "§gUlanhu, né Yun Ze, a grandi à Hohhot au sein d'une famille d'enfants bergers. Il a fréquenté le Collège mongol-tibétain de Pékin, où il a rejoint la Ligue de la jeunesse communiste de Chine en 1924 et finalement le Parti communiste chinois en 1925. Après quatre années d'études à Moscou, Ulanhu a commencé à organiser des rassemblements communistes en Mongolie et a été nommé membre du comité de travail du PCC pour la Mongolie occidentale. Il défendit avec succès Hohhot contre l'armée japonaise pendant la Seconde Guerre mondiale et joua un rôle important dans les campagnes de Pékin et de Shengyang pendant la deuxième phase de la guerre civile chinoise. Après l'intervention soviétique dans la guerre, Ulanhu a déclaré un gouvernement provisoire de Mongolie intérieure à Xilinhot, essayant de décider quelle voie politique la Mongolie intérieure devait suivre.§!"
POLITICS_ULANHU_WARLORD_DESC:0 "§gUlanhu, né Yun Ze, a grandi à Hohhot au sein d'une famille d'enfants bergers. Il a fréquenté le Collège mongol-tibétain de Pékin, où il a rejoint la Ligue de la jeunesse communiste de Chine en 1924 et finalement le Parti communiste chinois en 1925. Après quatre années d'études à Moscou, Ulanhu a commencé à organiser des rassemblements communistes en Mongolie et a été nommé membre du comité de travail du PCC pour la Mongolie occidentale. Il défendit avec succès Hohhot contre l'armée japonaise pendant la Seconde Guerre mondiale et joua un rôle important dans les campagnes de Pékin et de Shengyang pendant la deuxième phase de la guerre civile chinoise. Après l'intervention soviétique dans la guerre, Ulanhu a déclaré un gouvernement provisoire de Mongolie intérieure à Xilinhot, essayant de décider quelle voie politique la Mongolie intérieure devait suivre.§!\n\n§CExplication des clics :§!\n\n§gAprès l'invasion japonaise de 1937, les régions de Mongolie intérieure ont déclaré leur indépendance de la République de Chine sous la direction du prince Demchugdongrob, collaborateur japonais. Cependant, grâce aux unités de guérilla ethnique mongole créées par les nationalistes du Kuomintang pour lutter contre les Japonais, ainsi qu'à l'invasion conjointe mongole-soviétique de la Mandchourie, le régime fantoche japonais fut dissous en 1945. Peu de temps après, les représentants se réunirent à Xilinhot et proclamèrent la création d'une République de Mongolie intérieure. Le Parti communiste chinois, craignant le séparatisme, a envoyé Ulanhu dans la région pour dissoudre le gouvernement et préparer l'éventuelle intégration dans la République populaire de Chine. Après la défaite écrasante du PCC, Ulanhu a déclaré un autre gouvernement provisoire afin de stabiliser la situation, attendant de nouveaux développements avant de décider s'il rejoindrait la République populaire mongole ou les restes du Parti communiste chinois.§!"

##Ideas##

MEN_The_Five_Year_Plan:0 "Le plan quinquennal"
MEN_The_Five_Year_Plan_description:0 "Le gouvernement a annoncé l'introduction de notre premier plan quinquennal, jetant les bases de l'établissement de structures marxistes-léninistes en Mongolie intérieure, y compris la collectivisation ainsi que la réforme agraire."

MEN_Ulanhus_Personality_Cult:0 "Culte de la personnalité d'Ulanhus"
MEN_Ulanhus_Personality_Cult_description:0 "Le président Ulanhu a donné toute sa vie pour son pays, qu'il s'agisse de combattre l'Armée blanche, la NRA ou les Japonais. Il est l'exemple parfait du véritable leader socialiste et anti-impérialiste. Tout le monde devrait l'admirer, voir sa grandeur et reconnaître le sang, la sueur et les larmes qu'il a produit tout au long de sa vie déterminée."

MEN_Han_Mongol_Tensions:0 "Tensions Han-Mongoles"
MEN_Han_Mongol_Tensions_description:0 "Le nombre croissant de Chinois Han s'installant en Mongolie intérieure au cours des dernières décennies a conduit à des affrontements culturels et des conflits sociaux entre la communauté Han locale et les Mongols. Nous devons trouver une solution à ce problème."

MEN_Political_Commissars:0 "Commissaires politiques"
MEN_Political_Commissars_description:0 "Les officiers d'encadrement au sein des forces armées veilleront à la bonne éducation politique et à l'organisation de l'unité. En contrôlant l'armée et en l'influenceant au niveau idéologique, nous garantirons une loyauté totale à l'État."

