 kmt_cooperation_tt:0 "§GGrâce à la coopération avec la République de Chine, notre pays recevra divers buffs, notamment de l'expérience militaire, des bonus de recherche et de l'équipement.§!"
 
sieze_trieste:0 "Siège Trieste"
sieze_capodistria:0 "Avancez vers Capodistria"
sieze_trieste_desc:0 "La zone A du Territoire Libre de Trieste est la zone située autour de la ville de Trieste et de ses environs."
sieze_capodistria_desc:0 "Capodistria également connue sous le nom de Koper est la zone située au sud de Trieste qui est actuellement occupée par l'armée yougoslave, bien qu'elle soit formellement en territoire libre, c'est certainement le territoire yougoslave."

ITA_trieste.6.d:0 "Une excellente nouvelle est arrivée de l'état-major des forces armées, nos forces à Trieste ont réussi à sécuriser l'intégralité du Territoire Libre de Trieste. Selon les rapports, l'armée yougoslave était mal préparée à faire face à un assaut majeur et a été rapidement expulsée de la région. Après avoir repoussé les forces yougoslaves, nos forces ont établi des fortifications à la frontière, capables de repousser les contre-attaques des forces yougoslaves. Cela contribuera sûrement à consolider l'héritage du gouvernement actuel en tentant de récupérer certaines de nos pertes de la guerre précédente. Plus important encore, un échec aurait sûrement conduit à l'effondrement du gouvernement actuel et à des dégâts majeurs lors des prochaines élections. Cela dit, la réponse internationale à cette situation, notamment de la part des pays non alignés et du bloc soviétique, sera sûrement rapide dans sa condamnation de nos démarches. Veiller à ce que nos alliés de l'OTAN, en particulier les États-Unis, poursuivent leur étroite collaboration avec nos forces armées et la fourniture d'équipements restera une nécessité pour préserver nos acquis."

ITA_trieste_crisis_category:0 "La crise de Trieste"

ITA_trieste_crisis_category_desc:0 "Depuis quelques années, la ville de Trieste et ses environs sont occupés par les forces anglo-américaines dans la ville proprement dite et par l'armée yougoslave dans la partie sud du Territoire Libre. Alors que le maréchal Tito fait pression sur les Nations Unies et les Alliés pour mettre fin au territoire libre et éventuellement l'annexer entièrement à la Yougoslavie, nous devons faire tout notre possible pour récupérer ce qui a été la terre italienne pendant des siècles, même en recourant à la force."

ITA_YUG_war:0 "Conflit italo-yougoslave"

ITA_won_trieste:0 "L'Italie a gagné à Trieste"

news_trieste.1.d:0 "Après une courte campagne, l'armée italienne a réussi à prendre le contrôle de la ville de Trieste et de ses environs immédiats. Cela survient après que les tensions autour de la ville ont éclaté depuis la fin de la Seconde Guerre mondiale. Après la fin de cette guerre, la région a été divisée et placée sous la juridiction des Nations Unies via le territoire libre de Trieste. Cependant, la région est connue pour une population ethniquement divisée et constitue un point de discorde majeur sur la propriété entre la Yougoslavie et l'Italie. Au fur et à mesure des discussions sur la dissolution du territoire libre, les tensions se sont transformées en un véritable conflit armé entre les deux nations. À la surprise de la communauté internationale, les forces italiennes étaient capables de mettre en déroute les forces yougoslaves de la zone A et de la zone B du territoire et avaient annoncé leur intention d'annexer l'ensemble de la zone. Cette décision a été largement condamnée par la Yougoslavie ainsi que par divers pays communistes."
