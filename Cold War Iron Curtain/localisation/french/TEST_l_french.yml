 kmt_cooperation_tt:0 "§G Grâce à la coopération avec la République de Chine, notre pays recevra divers bonus, notamment de l'expérience militaire, des bonus de recherche et de l'équipement.§!"
 sieze_trieste:0 "S'emparer de Trieste"
 sieze_capodistria:0 "Avancer vers Capodistria"
 sieze_trieste_desc:0 "La zone A du Territoire Libre de Trieste est la zone située autour de la ville de Trieste et ses environs."
 sieze_capodistria_desc:0 "Capodistria, également connue sous le nom de Koper, est la zone située au sud de Trieste qui est actuellement occupée par l'armée yougoslave, bien qu'étant formellement en territoire libre, c'est en tous points un territoire yougoslave."
 ITA_trieste.6.d:0 "D'excellentes nouvelles nous sont parvenues de l'état-major des forces armées: nos forces à Trieste ont réussi à sécuriser l'intégralité du territoire libre de Trieste. Selon les rapports, l'armée yougoslave était mal préparée à faire face à un assaut majeur et a été rapidement chassée de la région. Après avoir repoussé les forces yougoslaves, nos forces ont établi des fortifications à la frontière qui étaient capables de repousser les contre-attaques des forces yougoslaves. Cela contribuera certainement à consolider l’héritage du gouvernement actuel dans sa tentative de récupérer une partie de nos pertes de la guerre précédente. Plus important encore, un échec à ce niveau aurait sûrement conduit à l’effondrement du gouvernement actuel et à des dommages majeurs lors des prochaines élections. Cela étant dit, la réaction internationale, notamment de la part des pays non alignés et du bloc soviétique, ne tardera pas à condamner nos actions. Il sera toujours nécessaire de veiller à ce que nos alliés de l’OTAN, en particulier les États-Unis, continuent de collaborer étroitement avec nos forces armées et de nous fournir des équipements pour préserver nos acquis."
 ITA_trieste_crisis_category:0 "La crise de Trieste"
 ITA_trieste_crisis_category_desc:0 "Depuis quelques années, la ville de Trieste et ses environs sont occupés par les forces anglo-américaines dans la ville même et par l'armée yougoslave dans la partie sud du Territoire Libre. Alors que le maréchal Tito fait pression sur les Nations Unies et les Alliés pour mettre fin au Territoire Libre et éventuellement l'annexer entièrement à la Yougoslavie, nous devons faire tout ce qui est en notre pouvoir pour reconquérir ce qui a été pendant des siècles une terre italienne, même si c'est par la force."
 ITA_YUG_war:0 "Conflit italo-yougoslave"
 ITA_won_trieste:0 "L'Italie a gagné à Trieste"
 news_trieste.1.d:0 "Après une courte campagne, l'armée italienne a réussi à prendre le contrôle de la ville de Trieste et de ses environs immédiats. Cela survient après que les tensions autour de la ville se soient intensifiées depuis la fin de la Seconde Guerre mondiale. Après la fin de cette guerre, la région a été divisée et placée sous la juridiction des Nations Unies via le Territoire Libre de Trieste. Cependant, la région est connue pour sa population ethniquement divisée et constitue un point de discorde majeur entre la Yougoslavie et l'Italie concernant la propriété de son territoire. Alors que les discussions sur la dissolution du Territoire Libre étaient en cours, les tensions ont dégénéré en conflit armé entre les deux nations. À la surprise de la communauté internationale, les forces italiennes ont été capables de mettre en déroute les forces yougoslaves des zones A et B du territoire et ont annoncé leur intention d'annexer toute la zone. Cette décision a été largement condamnée par la Yougoslavie ainsi que par plusieurs pays communistes."