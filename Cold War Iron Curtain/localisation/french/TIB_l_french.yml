POLITICS_TENZIN_GYATSO_WARLORD_50s_DESC:0 "§gAprès la disparition du 13e Dalaï Lama, trois équipes de recherche ont été envoyées au nord-est, à l'est et au sud-est pour localiser la nouvelle incarnation alors que le garçon qui allait devenir le 14e Dalaï Lama avait environ deux ans. Tenzin n'était qu'un enfant lorsque le chef de guerre du Qinghai, Ma Bufang, soudoyait diplomatiquement le gouvernement de Lhassa afin qu'il retourne au Tibet. Dès qu'ils furent hors de la région de Ma Bufang, il fut officiellement déclaré 14e Dalaï Lama par le Kashag, et après dix semaines de voyage, il arriva à Lhassa le 8 octobre 1939. Après son intronisation, il passera la majeure partie de son enfance entre le palais du Potala et Norbulingka, sa résidence d'été. Après l'émergence du Kuomintang dans la guerre civile chinoise, on ne sait pas exactement à quoi ressemblera son futur rôle au Tibet si le Kuomintang décide d'envahir le Tibet.§!\n\n§CExplication des clics :§!\n\n§gAprès la révolution Xinhai, la région du Tibet a déclaré son indépendance de la nouvelle République de Chine. Pendant les 36 années suivantes, le 13e Dalaï Lama et les régents qui lui succédèrent gouvernèrent le Tibet. Pendant ce temps, le Tibet combattait les seigneurs de guerre chinois pour le contrôle des zones ethniquement tibétaines du Xikang et du Qinghai. Le gouvernement du Kuomintang de la République de Chine, dirigé par Chiang Kai-shek, a déjà profité de la négligence tibétaine pour étendre son influence sur le territoire. En 1941, Chiang Kai-Shek notait dans son journal que le Tibet ferait partie des territoires qui seraient réintégrés à la Chine après la fin de la Seconde Guerre mondiale.§!"

###Focuses KMT Tibet 1950s###

TIB_KMT_50s_Introduce_Tridemism_in_Tibet:0 "Introduire le tridémisme au Tibet"
TIB_KMT_50s_Introduce_Tridemism_in_Tibet_desc:0 "Le gouvernement du Kuomintang a reconnu la nécessité d'une transformation et a introduit le tridémisme, les Trois principes du peuple, comme moyen de moderniser le Tibet et de l'intégrer davantage à la Chine."

TIB_KMT_50s_Rely_on_Merchants:0 "Faites confiance aux commerçants"
TIB_KMT_50s_Rely_on_Merchants_desc:0 "Les marchands ou Treba de Lhassa et des villes du Tibet sont les plus conscients des inconvénients du système féodal. Ils doivent être le pilier de notre changement social. Il faut les rejoindre et s'assurer de leur fidélité."

TIB_KMT_50s_Put_monks_under_surveillance:0 "Mettez les moines sous surveillance"
TIB_KMT_50s_Put_monks_under_surveillance_desc:0 "Afin de transformer le Tibet d'une société féodale et théocratique en une société moderne, nous devons restreindre et surveiller la classe dirigeante des moines dans sa pratique politique."

TIB_KMT_50s_Battle_Caste_System:0 "Combattre le système des castes"
TIB_KMT_50s_Battle_Caste_System_desc:0 "Le système traditionnel des castes au Tibet perpétue depuis longtemps la hiérarchie sociale et limite les possibilités de mobilité sociale. Le KMT visait à démanteler ces barrières et à promouvoir une société plus égalitaire, même face aux circonstances difficiles imposées par la loi martiale."

TIB_KMT_50s_Census:0 "Recensement tibétain"
TIB_KMT_50s_Census_desc:0 "Afin d'établir un gouvernement fonctionnel, nous devons savoir combien de personnes nous gouvernons. Étant une région très étendue et peu peuplée, nous pourrions constater que nous avons plus d'habitants que ne le suggèrent nos calculs."

TIB_KMT_50s_Open_New_Schools:0 "Écoles chinoises ouvertes"
TIB_KMT_50s_Open_New_Schools_desc:0 "L'éducation est la clé de tout. La région sous-développée du Tibet a besoin d'une modernisation de son éducation pour prospérer. Avec l'aide monétaire de Nanjing, nous étendrons notre système éducatif en construisant des écoles chinoises."

TIB_KMT_50s_Sinicization_Education:0 "Sinisation par l'éducation"
TIB_KMT_50s_Sinicization_Education_desc:0 "Au lieu de recourir à la force pour intégrer le Tibet dans la culture chinoise, nous réécrirons le programme scolaire pour l'adapter aux politiques du gouvernement central. Un mélange sain d'aspects tibétains et chinois rapprochera nos étudiants de la prise de conscience que le Tibet fait partie intégrante de la Chine mais possède des caractéristiques culturelles uniques qui sont fondamentalement différentes des autres groupes ethniques de Chine."

TIB_KMT_50s_Industrial_Investment:0 "Encourager les investissements industriels à Lhassa"
TIB_KMT_50s_Industrial_Investment_desc:0 "L'ère de l'industrialisation atteint lentement la Chine et le Tibet ne doit pas être exclu de ce développement. Le développement de l'industrie légère à Lhassa permettra de lutter contre le chômage et d'augmenter le flux de capitaux au Tibet."

TIB_KMT_50s_Economic_Care_For_Lower_Castes:0 "Soins économiques pour les castes inférieures"
TIB_KMT_50s_Economic_Care_For_Lower_Castes_desc:0 "Les castes inférieures ont des difficultés dans leur vie quotidienne et ont de grandes difficultés à fournir à leur famille de la nourriture et des vêtements agréables. Une certaine partie de l'aide gouvernementale sera redirigée vers ces familles."

TIB_KMT_50s_Invite_Han_Farmers:0 "Invitez les agriculteurs Han"
TIB_KMT_50s_Invite_Han_Farmers_desc:0 "Les agriculteurs Han fournissent une excellente expertise agricole que nous pouvons utiliser et dont nous avons besoin au Tibet pour relancer l'agriculture. Nous leur permettreons de s'installer dans les régions frontalières sino-tibétaines pour aider les agriculteurs tibétains."

TIB_KMT_50s_Agricultural_Subsidies:0 "Subventions agricoles"
TIB_KMT_50s_Agricultural_Subsidies_desc:0 "Nous verserons des sommes généreuses aux entreprises agroalimentaires, aux organisations agricoles et aux exploitations agricoles pour compléter leurs revenus, gérer l'offre de produits agricoles et influencer le coût et l'offre de ces produits."

TIB_KMT_50s_Import_Machinery_from_Nanjing:0 "Importer des machines de Nanjing"
TIB_KMT_50s_Import_Machinery_from_Nanjing_desc:0 "Les machines-outils du gouvernement central augmenteront la productivité et les conditions de travail dans nos usines. Lhassa est optimiste et pense que notre demande d'outils supplémentaires auprès de Nanjing recevra une réponse positive."

TIB_KMT_50s_Equipment_from_Civil_War:0 "Demander de l'équipement de guerre civile"
TIB_KMT_50s_Equipment_from_Civil_War_desc:0 "Même si le Tibet est sous la protection du ROCA, les forces de police locales ont toujours besoin d'armes, d'équipements de communication et d'autres infrastructures militaires. Nous demanderons au gouvernement central du matériel obsolète datant de la période de la guerre civile pour approvisionner nos forces de police."

TIB_KMT_50s_establish_regional_governors:0 "Nommer les gouverneurs régionaux"
TIB_KMT_50s_establish_regional_governors_desc:0 "Afin de combattre l'influence des autorités centrales (et d'obtenir le soutien populaire), nous nommerons des bureaucrates tibétains locaux gouverneurs des provinces."

TIB_KMT_50s_establish_chinese_governors:0 "Nommer des gouverneurs chinois"
TIB_KMT_50s_establish_chinese_governors_desc:0 "En plaçant des bureaucrates chinois à des postes locaux importants, nous lutterons efficacement contre la corruption locale et garantirons un gouvernement plus productif."

TIB_KMT_50s_keep_nobility_in_power:0 "Maintenir la noblesse tibétaine au pouvoir"
TIB_KMT_50s_keep_nobility_in_power_desc:0 "La noblesse du Tibet est cruciale pour le soutien populaire. Les convictions conservatrices ne peuvent pas être éradiquées du jour au lendemain sans risquer de graves conflits sociaux et politiques. Les Lamas resteront et continueront d'être le chef du gouvernement local."

TIB_KMT_50s_empower_minister_of_foreign_affairs:0 "Autonomiser le ministre des Affaires tibétaines"
TIB_KMT_50s_empower_minister_of_foreign_affairs_desc:0 "Afin de transformer le Tibet en une province chinoise moderne, nous éloignerons le pouvoir politique de la noblesse vers les ministères. En particulier, le ministère des Affaires tibétaines bénéficiera de plus d'autonomie dans l'élaboration des politiques et l'établissement de l'agenda au Tibet."

