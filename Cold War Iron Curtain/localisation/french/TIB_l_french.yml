###Ideas###

TIB_50s_14th_Dalai_Lama:0 "14e Dalaï Lama"
TIB_50s_14th_Dalai_Lama_description:0 ""

TIB_50s_Corruption:0 "Corruption légère du gouvernement"
TIB_50s_Corruption_description:0 "L'intégration du Tibet à la Chine a laissé notre structure gouvernementale quelque peu intacte. Cependant, les commerçants et les bureaucrates du Tibet tentent de renforcer leur emprise sur la région et de maintenir la légitimité locale du Tibet. Nous devrions surveiller cela de près."

TIB_50s_Corruption2:0 "Corruption gouvernementale moyenne"
TIB_50s_Corruption2_description:0 "L'intégration du Tibet à la Chine a laissé notre structure gouvernementale quelque peu intacte. Cependant, les commerçants et les bureaucrates du Tibet tentent de renforcer leur emprise sur la région et de maintenir la légitimité locale du Tibet. À l'heure actuelle, la situation s'aggrave légèrement et des mesures doivent être prises."

TIB_50s_Corruption3:0 "Forte corruption gouvernementale"
TIB_50s_Corruption3_description:0 "L'intégration du Tibet à la Chine a laissé notre structure gouvernementale quelque peu intacte. Cependant, les commerçants et les bureaucrates du Tibet tentent de renforcer leur emprise sur la région et de maintenir la légitimité locale du Tibet. C'est devenu un problème tellement grave qu'il affecte négativement notre processus d'élaboration de politiques."

TIB_50s_Powerful_Oligarchy:0 "Puissante oligarchie tibétaine"
TIB_50s_Powerful_Oligarchy_description:0 "La corruption et les pots-de-vin ont porté atteinte à certaines parties de notre gouvernement, compte tenu de la position puissante de la noblesse tibétaine."

TIB_50s_De_Jure_Panchen_Lama_Rule:0 "Règle de Jure du Panchen Lama"
TIB_50s_De_Jure_Panchen_Lama_Rule_description:0 "Pour maintenir l'ordre dans la société bouddhiste du Tibet, nous devons conserver l'autorité religieuse afin d'empêcher la multiplication des organisations nationalistes"

###Events###

Tibet_Kuomintang.1.t:0 "L'importance du tridémisme"
Tibet_Kuomintang.1.d:0 "Le Dr Sun Yat-sen est le père fondateur de la République de Chine et a développé la philosophie des Trois principes du peuple, combinant démocratie, protection sociale et nationalisme. Le nouveau Kuomintang purifiera sa pensée et sera prêt à établir les Trois Principes au Tibet pour servir de modèle d'une Chine véritablement moderne, démontrant que les idéologies communistes sont un poison pour le peuple chinois et sa culture."
Tibet_Kuomintang.1.a:0 "Une nouvelle voie pour le Tibet."

Tibet_Kuomintang.2.t:0 "Fonds éducatifs pour le Tibet"
Tibet_Kuomintang.2.d:0 "Suite à l'intégration du Tibet dans la République et à l'établissement d'un nouveau gouvernement, les délégués tibétains ont exhorté le gouvernement central à investir dans l'éducation tibétaine locale. « La région sous-développée du Tibet doit être modernisée dans son système éducatif pour prospérer au sein de la République », a affirmé la délégation. Nous suivrons leur suggestion et accorderons une aide monétaire à Lhassa."
Tibet_Kuomintang.2.a:0 "Un investissement judicieux !"

Tibet_Kuomintang.3.t:0 "Tensions entre les agriculteurs"
Tibet_Kuomintang.3.d:0 "Suite à l'intégration des agriculteurs Han dans l'agriculture tibétaine, des conflits et des disputes se sont multipliés entre les paysans tibétains autochtones et les agriculteurs chinois Han pour des raisons ethniques et culturelles et cela affecte notre production agricole. Le gouvernement de Lhassa affirme qu'il s'agit là d'un effet secondaire prévisible mais insignifiant de l'accord Han qui va bientôt s'effondrer. Nous garderons un oeil sur cette évolution..."
Tibet_Kuomintang.3.a:0 "De près..."

Tibet_Kuomintang.4.t:0 "Tensions entre paysans au Tibet"
Tibet_Kuomintang.4.d:0 "Suite à l'intégration des agriculteurs Han dans l'agriculture tibétaine, des conflits et des disputes se sont multipliés entre les paysans tibétains autochtones et les agriculteurs chinois Han pour des raisons ethniques et culturelles et cela affecte notre production agricole. Le gouvernement de Lhassa affirme qu'il s'agit là d'un effet secondaire prévisible mais insignifiant de l'accord Han qui va bientôt s'effondrer. Lhassa a promis qu'ils garderaient un oeil sur cette évolution et nous informeraient si les tensions devaient s'intensifier."
Tibet_Kuomintang.4.a:0 "Espérons que la situation ne s'aggrave pas."

Tibet_Kuomintang.5.t:0 "Le nouveau ministre des Affaires tibétaines"
Tibet_Kuomintang.5.d:0 "Suite à la réintégration du Tibet à la Chine, le KMT a (encore une fois) créé un ministère des affaires concernant le Tibet. Le gouvernement de Lhassa a décidé de retirer des pouvoirs à la noblesse tibétaine en faveur d'une position plus constitutionnelle. Depuis que le mandat du dernier ministre est terminé, il y a une petite lutte de pouvoir au sein du ministère sur la question de la succession entre Yu Ching-tang et Tien Chung-chin."
Tibet_Kuomintang.5.a:0 "Laissons Lhassa décider."

Tibet_Kuomintang.6.t:0 "Le nouveau ministre des Affaires tibétaines"
Tibet_Kuomintang.6.d:0 "En raison de notre décision de transférer le pouvoir de la noblesse à la position constitutionnelle de ministre des Affaires tibétaines, le gouvernement central nous a accordé le pouvoir de décider qui deviendra le prochain ministre en signe de gratitude et de respect de l'autonomie tibétaine. La décision revient entre Tien Chung-chin, diplômé de l'Université de Pékin et ancien ministre des Examens, et Yu Ching-tang, diplômé de l'Université Northwestern et ancien vice-ministre de l'Éducation."
Tibet_Kuomintang.6.a:0 "Yu Ching-tang deviendra le prochain ministre."
Tibet_Kuomintang.6.b:0 "Tien Chung-chin est l'option de succession appropriée."

Tibet_Kuomintang.7.d:0 "L'intégration du Xizang (Tibet) par la République de Chine par le Kuomintang est l'acte de triomphe du programme de révolution nationale de Chiang Kai Shek avec les Trois principes du peuple de Sun Yat-Sen. Le gouvernement chinois de l'après-révolution du 10 octobre 1911 n'a pas réussi à unifier la Chine. Le gouvernement impérial traître de Yuan Shikai a également échoué et le gouvernement Beiyang de 1917-1928 sous la direction de l'Anhui de Duan Qirui, la direction Zhili de Cao Kun et le triumvirat-gouvernement raté de la direction Fengtian de Zhang Zuolin n'ont pas réussi à contrer l'indépendance du Tibet en 1913 par le XIIIe Dalaï Lama. Mais avec le succès de l'expédition du Nord, de la guerre anti-japonaise et de la sécurisation du gouvernement républicain contre les communistes, le Tibet est la nouvelle victoire de la révolution nationale et de l'unification chinoise."
Tibet_Kuomintang.8.d:0 "Avec les troubles croissants entre les moines et l'influent bureaucrate Tsarong Dzasa, une délégation fut envoyée auprès des moines de Tsarong Dzara au monastère de Sera où, en 1947, s'est produit l'incident du monastère de Sera. C'était l'une des guerres de la faction Kashag avec Taktra Rinpoché qui était pro-indépendance et Radreng Hutuktu qui était pro-République de Chine. Après de dures négociations sur l'autorité de Kashag et le pouvoir du Dalaï Lama, la délégation fut insultée comme en 1934 la délégation de Huang Musong et défendue par certains anciens soutiens de Radreng. Cette rencontre avec les nationalistes était inquiétante..."
Tibet_Kuomintang.9.d:0 "Suite à l'échec des négociations, la Commission des affaires mongoles et tibétaines transmet l'information à Nanjing. Liu Wenhui, le gouverneur de Xikang nous a envoyé une lettre dans laquelle il s'inquiétait de la situation tibétaine en rappelant les affrontements frontaliers et l'instabilité de son administration provinciale. Liu Wenhui et Yang Sen ROCAF sont prêts à intervenir si l'ordre venait à s'effondrer. Nanjing appelle le MTAC pour maintenir l'ordre avec un contrôle policier accru près du monastère de Lhassa. Chiang Kai-Shek a envoyé un message à Kashag pour apaiser les membres du gouvernement avec la pensée de notre réseau de moines pro-chinois des lignes réformistes de Gendun Chophel."
Tibet_Kuomintang.10.d:0 "Les émeutes à Lhassa et la présence accrue de la police ont créé un sentiment d'occupation militaire, et les nationalistes tibétains ont déclenché des émeutes et ont appelé Kashag à expulser le gouvernement local de la Commission des affaires mongoles et tibétaines et à appeler à une seconde indépendance en expulsant les pro-chinois. Dans les rues de Lhassa, des scènes chaotiques se sont produites et certaines de nos violentes tactiques anti-émeutiers de la police ont accru les émeutes tibétaines et la diminution de l'ordre."
Tibet_Kuomintang.11.d:0 "La Commission des affaires mongoles et tibétaines (MTAC) a annoncé que les travaux commençaient pour la construction de l'administration de Xizang Aera, certains conseillers comme Tien Chung-chin et Yu Ching-tang qui ont commencé avec un bureaucrate et leurs liens avec le Parti tibétain pour l'amélioration (TIP). Beaucoup de travail acharné commencera par la situation intérieure instable, l'influence politique religieuse et l'influence des membres anti-chinois du Kashag et de leur rhétorique sinophobe. Avec la reconstruction nationale dirigée par le gouvernement de Nanjing, Xizang (Tibet) a besoin de beaucoup de redressement au niveau de la société et de l'industrie pour parvenir à une intégration complète."
Tibet_Kuomintang.12.d:0 "[MAXIMUM ALERT] Les émeutiers commencent à attaquer le Kuomintang et les symboles chinois. De plus, ils commencent à bloquer la route principale vers Qinghai et Xikang pour bloquer les camions de soutien chinois. Les attaques commencent contre le membre chinois du MTAC, le personnel de la police et leurs familles. Certains vieux soldats de l'armée tibétaine qui avaient des mousquets ont commencé à tirer sur des policiers qui ont commencé à réprimer les émeutiers avec des discours sinophobes. En outre, certaines sources de Kashag ont annoncé que des moines indépendantistes sous Tsarong Dzasa voulaient marcher sur le palais du Potala. Au MTAC, deux factions ont leur plan : certaines veulent l'intervention du ROCAF à Xizang (Tibet) ou lancer des négociations avec Kashag avant que Dzasa n'atteigne le palais du Potala, selon la stratégie de Huang Musong."
Tibet_Kuomintang.13.d:0 "[MAXIMUM ALERT] Ensuite, l'émeute et les tensions au sein du MTAC et le faible soutien de notre gouvernement local au Kashag. Certaines de nos communications sont fermées. Une réorganisation totale sera entamée avec le soutien du Xikang de Liu Wenhui et du gouvernement central de Nanjing de Chiang Kai Shek. Le conseil local du MTAC tentera de rétablir l'ordre avec l'aide de toutes les autorités tibétaines pro-chinoises et d'arrêter les émeutes pour maintenir l'ordre."
Tibet_Kuomintang.14.d:0 "Pour contrer les nationalistes de Tsarong Dzasa, Tien Chung-chin et une délégation du MTAC ont été envoyés au Palais du Potala sous le chaos pour tenter de négocier avec l'aide du 10e Panchen Lama et du soutien indépendantiste de Taktra Rinpoché. Le débat commence par la question du leadership du Dalaï Lama. Les plans du Kuomintang pour le Tibet proviennent de l'ancien gouvernement de Wang Jingwei, avec quelques points flous sur le pouvoir de gouverneur de la Commission des affaires mongoles et tibétaines et sur la diminution potentielle et la fin de l'autonomie de Kashag. Mais pendant la mission de Huang Musong au Tibet, le Tibétain Kashag a envoyé une proposition en dix points pour un gouvernement autonome du Xizang (Tibet). Dans cette situation, nous pouvons persuader les moines d'accepter leur projet comme une concession maximale ou d'empêcher leur soutien aux nationalistes en faisant davantage de concessions, mais le temps presse avant que Dzasa n'arrive au palais du Potala."
Tibet_Kuomintang.15.d:0 "[MAXIMUM ALERT] Avant que Tien Chung-chin ne quitte la salle de réunion, chaos près du palais du Potala. Le pire est que les nationalistes de Dzasa et de Taktra ont lancé l'assaut sur le palais du Potala avec une rumeur de soutien au Dalaï Lama. Forte de cette information, la faction interventionniste du MTAC appelle Tien à envoyer un message à Kangding et Nanjing pour appeler le ROCAF contre les nationalistes. Nous devons conserver l'Autorité pour continuer la Révolution Nationale !"
Tibet_Kuomintang.16.d:0 "Dans la rue, le chaos a continué et les anciennes attaques militaires tibétaines ont lancé des contre-attaques de policiers créant un mouvement de panique et ont obtenu davantage de soutien de la part des moines nationalistes. Certains civils tibétains ont aidé les anciens militaires avec des armes de mêlée sur les policiers et les rumeurs étaient mauvaises, Kashag et le Dalaï Lama pourraient commencer à négocier avec les nationalistes et préparer un nouveau Kashag pour obtenir une seconde indépendance de facto et avoir un projet pour atteindre l'indépendance de jure. La situation est hors de contrôle..."
Tibet_Kuomintang.17.d:0 "Depuis Kangding, 150 000 hommes de la division Xikang de Yang Sen commencent à entrer ce matin à Lhassa. Certains anciens militaires se rendent et la police commence à arrêter toutes les personnes suspectes. Au Palais du Potala, les partisans de Taktra Rinpoché ont commencé à fuir Lhassa pour survivre à la nouvelle administration militaire. Nanjing a annoncé que la Commission des Affaires Mongoles et Tibétaines avait échoué dans sa mission et que la mission Connaissance de Huang Musong n'était pas utile pour maintenir l'ordre à Xizang (Tibet). Chiang Kai-Shek annonce que Yang Sen rétablira l'ordre par un régime militaire et poursuivra la lutte pour l'unification chinoise. Le poste de gouverneur du MTAC sera rétabli après la politique de reconstruction menée par l'Autorité ROCAF. "
Tibet_Kuomintang.18.d:0 "Après d'âpres négociations, la crise de Lhassa a été évitée en utilisant les dix propositions d'intégration proposées par Kashag lors de la mission Huang Musong. Voici les points : -1) Le Tibet doit rester une partie intégrante de la Chine, tandis que les Chinois doivent promettre de ne pas changer le système administratif tibétain. -2) Le Tibet suivra l'autorité, les lois et les réglementations chinoises à condition que cela ne nuise pas au double gouvernement religieux et politique tibétain. -3) Le double système de gouvernement tibétain demeurera et la Chine n'interférera pas avec le pouvoir civil et militaire tibétain. -4) Le Tibet poursuivra ses relations amicales avec tous ses États voisins. -5) Un seul représentant chinois peut être en poste au Tibet et sa suite ne doit pas dépasser vingt-cinq personnes. -6) La reconnaissance de la réincarnation du Dalaï Lama, son intronisation, la sélection et l'investiture du régent et la nomination des fonctionnaires seront conduites par le Kashag comme actuellement. -7) Les forces militaires stationnées aux frontières du Tibet à des fins de défense seront envoyées par le Tibet comme c'est le cas actuellement. -8) Les Chinois qui résident au Tibet depuis 1912 continueront d'être gouvernés par le Tibet. -9) Afin d'éviter d'éventuels conflits, les territoires de l'Amdo et du Kham qui appartenaient à l'origine au Tibet mais qui étaient occupés par les Chinois seront remis à Lhassa dans les plus brefs délais. -10) Le gouvernement chinois n'accordera l'asile à aucun Tibétain, ecclésiastique ou laïc, qui s'est rebellé contre le gouvernement tibétain et s'est enfui en Chine. || Mais nous savons tous que tous ces points ne peuvent pas être stockés, donc avec le poste de gouverneur du MTAC et le nouveau Kashag autonome, un statu quo commence."
Tibet_Kuomintang.19.d:0 "La rumeur était vraie, le Dalaï Lama soutenait les nationalistes du politicien influent Tsarong Dzasa et des moines nationalistes. Sa déclaration annonçait une future réorganisation de Kashag et le coup d'envoi du poste de gouverneur chinois du MTAC. Dans la rue de Lhassa, la police a perdu le contrôle de la rue et les moines sont entrés dans le palais du Potala où un partisan du Taktra qui avait soudoyé le Dalaï Lama pour entamer la future réorganisation avec un conseil transitoire pour mettre fin au gouvernement autonome de Xizang, Tien Chung-chin a été blessé par des nationalistes. Par ailleurs, certaines informations du comité local de Ngari annoncent l'émergence d'une nouvelle force du Parti communiste tibétain de Phuntsok Wangyal avec le soutien de l'APL Remanent et de la République du Turkestan oriental."
Tibet_Kuomintang.20.d:0 "Suite à la perte de contrôle, la Commission des affaires mongoles et tibétaines s'est enfuie à Kangding où Liu Wenhui, sans préparation, a obtenu des informations sur « la deuxième déclaration d'indépendance de Kashag ». Les policiers de l'administration de Xizang ont été arrêtés et l'armée tibétaine a commencé à se réorganiser. Avec les conseils de Yu Ching-tang, Liu Wenhui a appelé Nanjing pour préparer une invasion totale du Xizang et l'annexer en tant que province en mettant fin à toutes les idées nationalistes et autonomes. Pour Liu qui était partisan de la ligne modérée et des négociations avec Kashag contre l'ancien gouvernement de Chiang Kai Shek et de Wang Jingwei, le temps des négociations est terminé et la Chine doit être unie. Au Tibet, Tsarong Dzasa a annoncé la création du Kashag provisoire pour maintenir la position indépendantiste et a commencé à lancer une action d'urgence contre les réponses chinoises avec sa proclamation d'indépendance."
Tibet_Kuomintang.21.d:0 "[BUG]"
Tibet_Kuomintang.22.d:0 "Suite à l'intervention de Yang Sen au ROCAF, l'administration militaire doit être claire sur ses intentions, la ligne modérée de négociation de Huang Musong avec Kashag étant terminée. Yang Sen a déclaré que la doctrine de Huang Musong a échoué et que la voie unique vers l'unification et la stabilisation de la Chine passerait par les valeurs universelles Minquan de Sun Yat-Sen. Ce sera une voie vers la sécularisation du Tibet et le contrôle total de l'activité religieuse. Suivant les pensées de Jiang Zhiyu, qui faisait partie de la mission Huang Musong, il a déclaré que Huang n'avait pas réussi à renforcer l'influence chinoise et à persuader Kashag de se soumettre et que la seule solution était l'intervention de « l'Armée nationale révolutionnaire ». Lin Donghai, ancien bureaucrate du ministère des Affaires étrangères, a déclaré que Huang Musong avait fait trop de concessions sans imposer les propositions du gouvernement de Chiang Kai-Shek."
Tibet_Kuomintang.23.d:0 "Après l'incident de Lhassa et les négociations avec les Tibétains qui ont obtenu le statut de Kashag autonome, le nouveau gouverneur Tien Chung-chin de la Commission des affaires mongoles et tibétaines (MTAC) a dû rétablir la situation sociale et sociétale. Avec les valeurs tridemistes avec l'héritage de « cinq races sous une seule union », Tien commencera l'intégration du Xizang (Tibet) dans la République de Chine en tant qu'ethnie égale à celle de Hans. L'alphabétisation, le programme scolaire, l'introduction au mandarin et la fin de la rhétorique sinophobe sont les principaux projets du gouvernement de Tien Chung-chin. En outre, l'influence politique de la religion sera stoppée pour stabiliser le Tibet avec un statu quo avec le Kashag autonome. Avant de commencer la reconstruction provinciale, la paix sociale telle que le principe Minquan doit être restaurée."
Tibet_Kuomintang.24.d:0 "Le succès du maintien de l'ordre au sein du gouvernement civil est la preuve que la Chine républicaine peut mettre fin à sa politique d'unification par la force. Suivant le souhait de Sun Yat-Sen, le gouvernement tibétain peut conserver sa culture et ses traditions car la culture tibétaine fait désormais partie de la culture chinoise. De plus, comme le principe Minquan avec l'influence du « Contrat Social » de Rousseau, philosophe français, les Tibétains peuvent choisir leur destin sans pression traditionnelle et peuvent commencer à intégrer la société multiethnique de la République de Chine."
Tibet_Kuomintang.25.d:0 "Après le rétablissement social, Tien Chung-chin a terminé son travail pour la Commission des affaires mongoles et tibétaines et a nommé un successeur : Yu Ching-tang. Yu Ching-tang doit accomplir l'un des travaux les plus difficiles pour l'intégration tibétaine en République de Chine, l'intégration économique et industrielle. Infrastructures hydrauliques, fin des pratiques féodales, mécanisation de l'agriculture et infrastructures nationales pour les relier au Qinghai et à Xikang et créer de nouveaux lieux d'investissement industriel. De plus, Yu Ching-tang, fort de son expérience politique au sein du Kuomintang et en matière de politique intérieure, commencera à se rapprocher du Kashag autonome pour tenter de mettre fin au statu quo et continuer à maintenir la stabilité au Xizang."
Tibet_Kuomintang.26.d:0 "Avec le statu quo sur les dix points pour l'intégration tibétaine, Yu Ching-tang a besoin, après son long travail pour les réformes industrielles et agricoles à Xizang (Tibet), d'entamer des négociations avec le Kashag autonome sur les revendications de l'ancien « État du Tibet » avec la région de Xizang et la région de Qinghai, la question militaire et la question de la politique étrangère. Avec le succès du plan de modernisation de Yu et le redressement social de Tien, le Dalaï Lama a commencé à mieux soutenir les membres pro-chinois du Kashag et du TIP pour diminuer l'influence nationaliste qui pourrait mener un double pouvoir avec le 10e Panchen Lama et entamer une révision des dix points. Pour éviter une nouvelle croissance nationaliste, nous sommes disposés à élargir les négociations ou à imposer notre point de vue, ce qui peut conduire au maintien du statu quo."
Tibet_Kuomintang.27.d:0 "En ne parvenant pas à mettre fin au statu quo sur l'influence de la gouvernance avec le Kashag autonome, Yu Ching-tang échoue dans sa dernière mission. Chiang Kai-Shek et le Yuan exécutif s'inquiétaient d'une deuxième révolte nationaliste qui pourrait conduire à une deuxième crise à Lhassa et envoyer Wu Zhongxin rétablir l'ordre à Lhassa. Wu Zhongxin a pour mission de maintenir le statu quo afin de maintenir une fièvre nationaliste affaiblie chez les moines. Chiang Kai-Shek a soudoyé Wu pour qu'il augmente avec l'aide du Xikang de Liu Wenhui et du Qinghai de Ma Bufang pour envoyer du ROCAF et des garnissons de police pour maintenir l'ordre. Mais Wu, avec l'aide du Parti pour l'amélioration du Tibet (TIP) et la loyauté moyenne du Kashag autonome, a un projet visant à accroître la modernisation des villes tibétaines et à lancer le boom de l'économie provinciale"
Tibet_Kuomintang.28.d:0 "Suite aux nouvelles négociations, nous sommes sur la bonne voie pour résoudre le statu quo avec le Kashag autonome avec l'aide du Panchen Lama qui peut amener le Dalaï Lama à conserver son influence spirituelle dans l'administration de Xizang sur les décisions nationales avec la Commission des affaires mongoles et tibétaines qui peut conduire à une intégration totale pacifique au sein du gouvernement central et maintenir le projet de révolution nationale de Sun Yat-Sen ou adopter une approche pragmatiste pour empêcher la rhétorique nationaliste en promouvant le Panchen Lama en tant que gouverneur avec le maintien du projet de révolution nationale de Sun Yat-Sen. Le double pouvoir avec le Dalaï Lama en acceptant les souhaits du MTAC. La nouvelle situation politique sera un Kashag autonome avec le Dalaï Lama comme chef spirituel qui dirigera toute la politique intérieure concernant les monastères, la tradition et les politiques religieuses et le gouvernement de Xizang en ce qui concerne l'industrie, l'armée et l'agriculture avec l'intervention du Kashag autonome lorsque la loi touchera la vie religieuse et traditionnelle."
Tibet_Kuomintang.29.d:0 "Suite à la déclaration d'indépendance, le gouvernement de Tsarong Dzasa entame la réorganisation du Kashag pour la réponse entrante de la République de Chine qui commence à expulser les membres pro-chinois du Kashag et lance des actions d'urgence dans la société et les politiques extérieures. En matière de politique étrangère, nous commencerions à établir des liens avec la République de l'Inde et à formaliser des liens avec le Royaume du Bhoutan et du Népal."
Tibet_Kuomintang.30.d:0 "La République de Chine a annoncé la fin de tous les projets d'intervention au Tibet avec l'aide de l'Inde et des partisans de la pensée Huang Musong qui ont contre-attaqué le soutien à l'intervention des extrémistes Chiang Kai-Shek. Suite à cette nouvelle, l'indépendance du Tibet a été sécurisée, ainsi qu'une nouvelle politique de reconnaissance étrangère avec l'aide de l'Inde. Le Kashag du Dzasa annonce le lancement de la fin de la politique d'urgence et de la militarisation de la société pour entamer la relance nationale."
Tibet_Kuomintang.31.d:0 "Avec les nouvelles inquiétantes en provenance de Lhassa, nous devons décider de poursuivre la lutte pour la Révolution nationale. Mais la République de l'Inde, avec le soutien de la faction réformiste de la Commission des affaires mongoles et tibétaines, a appelé à mettre fin au conflit avec le Tibet en mettant fin aux tensions et en établissant la frontière provinciale de Xikang pour l'argumentation du MTAC. Mais avec l'influence des partisans de la ligne dure et celle du ROCAF. Chen Cheng, Hu Zongnan, Zhang Qun et Chen Lifu appellent à une intervention pour attaquer les intentions impérialistes potentielles de l'Inde."
Tibet_Kuomintang.32.d:0 "Après l'incident de Lhassa, Yang Sen a proclamé la loi martiale et a officiellement mis fin à la pensée multiple pour les moines et toutes les organisations moines autonomes. Le ROCAF a commencé à contrôler le monastère de Drepung et à restaurer la faction pro-chinoise du monastère de Sera. Après la stabilisation de l'autorité religieuse, nous commencerions à entamer des pourparlers avec le MTAC et le Panchen Lama pour préparer la restauration de l'administration civile. Pour préparer la restauration de l'État civil, nous commencerions à lancer la politique spéciale Dang-Guo pour le Tibet."
Tibet_Kuomintang.33.d:0 "Après la modernisation de Xizang, nous commencerions à lancer la restauration de l'administration civile. Les ordres de Nanjing sont clairs, maintiennent l'ordre et finalisent l'intégration en République de Chine. Mais Nanjing n'a pas proposé de conserver l'autonomie ou l'intégration en tant qu'administration provinciale. Yang Sen décidera donc de préserver l'administration locale ou d'appliquer la voie dogmatique du gouvernement civil de l'ancien Wang Jingwei pour intégrer le Tibet sous le gouvernement central et unir la Chine en une République unitaire totale."
Tibet_Kuomintang.34.d:0 "Xu Shiying a été nommé gouverneur, sa mission est de maintenir le gouvernement local et de commencer à nommer de nouvelles lois sur les religions avec l'ordre de Nanjing et de commencer à se ranger du côté du TIP et du Panchen Lama pour mettre fin aux tensions entre le gouvernement de la République de Chine et le peuple tibétain. Maintenant, Xizang (Tibet), en tant qu'organisation provinciale de facto, va commencer à rédiger le projet Tridemist de Chiang Kai-shek."
Tibet_Kuomintang.35.d:0 "Après la fin de l'administration militaire, nous commencerons à mettre en oeuvre le Plan gouvernemental national pour le Tibet depuis les années 1930 avec de nombreuses propositions : 1. Le système politique traditionnel serait maintenu et permettrait au Tibet d'avoir son autonomie. 2. La Chine n'interférera avec aucune mesure administrative relevant de l'autorité du Tibet autonome. 3. Les affaires étrangères exigeaient une action unitaire et toutes les questions administratives de caractère national devaient être administrées par la Chine. 4. Après que le gouvernement chinois ait mis en oeuvre l'autonomie du Tibet, afin d'exercer sa pleine souveraineté sur une partie de la nation (le Tibet), le gouvernement chinois devait nommer un haut fonctionnaire en poste au Tibet en tant que représentant de la Chine. D'une part, il mettrait en oeuvre les mesures administratives nationales et, d'autre part, guiderait l'autonomie régionale."
Tibet_Kuomintang.36.d:0 "Avec la fin de l'autorité dure de Xu Shiying, Xizang commence à lancer sa reprise vers l'intégration dans la Révolution nationale dans le nouveau demi-siècle. Après le début du contrôle des moines, il faut mettre un terme à l'influence accrue des nationalistes et du Parti communiste du Tibet. Le nouveau gouverneur Kuo Chi-chiao, fort de son expérience militaire après l'administration militaire de Yang Sen, entamera la transition vers la société civile avec le contrôle d'une police militaire locale au monastère de Drepung qui est considéré comme le dernier bastion des moines anti-ROC et le bastion nationaliste."
