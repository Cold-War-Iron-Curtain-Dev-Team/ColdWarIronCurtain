#News Event

 AFG_The_Royal_Afghanistan_Armed_Forces: "Les Forces armées royales afghanes"
 AFG_The_Royal_Afghanistan_Armed_Forces_desc: "L'épine dorsale de notre défense."
 AFG_The_Afghani_Economy: "L'économie afghane"
 AFG_The_Elections_of_1949: "Les élections de 1949"
 AFG_The_Elections_of_1949_desc: "Les élections parlementaires afghanes de 1949 ont eu lieu après la publication d'une proclamation royale appelant le peuple à élire l'Assemblée nationale. Les élections ont décidé des membres du septième Parlement afghan."
 AFG_The_1950_Coup_Attempt: "La tentative de coup d'État de 1950"
 AFG_Establish_the_Helmand_Valley_Aurhority: "Créer l'Autorité de la vallée de Helmand"
 AFG_Establish_the_Helmand_Valley_Aurhority_desc: "La HVA a été créée pour gérer le développement économique de la vallée du Helmand, principalement par l'irrigation et le développement des terres agricoles le long de la rivière Helmand, dans le cadre d'un plan qui devait être d'une importance primordiale pour l'économie future de l'Afghanistan."
 AFG_Construct_the_Kajaki_Dam: "Construire le barrage de Kajaki"
 AFG_Construct_the_Kajaki_Dam_desc: "Situé sur la rivière Helmand, le barrage produit de l'électricité et contribue à l'irrigation d'environ 650 000 acres de terres. Le barrage a été construit entre 1951 et 1953 par la société Morrison-Knudsen dans le cadre du projet Helmand Valley Authority."
 AFG_Secure_American_Finanacing: "Financement américain sécurisé"
 AFG_Join_the_Point_Four_Program: "Rejoignez le programme Point Four"
 AFG_Join_the_Point_Four_Program_desc: "Après la Seconde Guerre mondiale, les États-Unis se sont retrouvés dans une lutte de guerre froide contre l'URSS. L'administration Truman a eu l'idée d'un programme d'assistance technique comme moyen de gagner « les coeurs et les esprits » du monde en développement après que des pays du Moyen-Orient, d'Amérique latine, d'Asie et d'Afrique se soient plaints de l'accent mis par les États-Unis sur l'aide européenne."
 AFG_Build_the_Arghandab_Dam: "Construire le barrage d'Arghandab"
 AFG_Build_the_Arghandab_Dam_desc: "Le barrage de Dahla a été construit entre 1950 et 1952, lorsque les relations entre l'Afghanistan et les États-Unis commençaient à se développer rapidement. Le but du barrage était d'aider les agriculteurs de la province de Kandahar et de fournir de l'eau potable à la ville de Kandahar."
