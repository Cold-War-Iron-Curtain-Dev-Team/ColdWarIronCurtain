 AFG_Revoke_all_British_Treaties: "Révoquer tous les traités britanniques"
 AFG_Revoke_all_British_Treaties_desc: "Le Parlement a décidé d'annuler tous les traités signés par les anciens gouvernements afghans avec les Britanniques, y compris l'accord de la ligne Durand, et proclame ainsi que le gouvernement afghan ne reconnaît pas la ligne Durand comme frontière légale entre l'Afghanistan et le Pakistan."
 AFG_The_Pashtunistan_Campaign: "La campagne du Pachtounistan"
 AFG_The_Pashtunistan_Campaign_desc: "Nous ne pouvons pas nous reposer tant que tous les Pachtounes ne seront pas unifiés sous un même drapeau."
