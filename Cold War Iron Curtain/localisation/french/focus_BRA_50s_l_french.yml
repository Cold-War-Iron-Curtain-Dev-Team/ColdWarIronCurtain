l_french:

BRA_Push_Plan_SALTE: "Continuer Plan SALTE"
BRA_Push_Plan_SALTE_desc: "Le Plan SALTE a été introduit par le président Dutra en 1948. L'objectif de SALTE était de stimuler et d'améliorer le développement des secteurs de la santé, de l'alimentation, des transports et de l'énergie dans tout le Brésil, aidant et améliorant ainsi les conditions de vie de la population brésilienne."
BRA_Rural_Infrastructure_desc: "Une grande partie des zones rurales du Brésil manquent d'infrastructures adéquates, car les gouvernements donnent toujours la priorité aux riches métropoles de São Paulo et de Rio de Janeiro. Nous allons atténuer ce problème en construisant des routes."
BRA_Heavy_Industry: "Développement de l'industrie lourde"
BRA_Heavy_Industry_desc: "Le coeur industriel du Brésil repose sur la région du Sud-Est, São Paulo, Rio de Janeiro et, dans une moindre mesure, Minas Gerais, abritant la grande majorité des industries, des entreprises et des centres d'affaires du Brésil."
BRA_Deal_With_Italy: "Accord commercial avec l'Italie"
BRA_Deal_With_Italy_desc: "En 1949, un accord commercial a été signé entre le président Dutra du Brésil et le président italien Luigi Einaudi, rapprochant les deux nations et renforçant les liens économiques."
BRA_OAS_Chart: "Le tableau de la SV"
BRA_OAS_Chart_desc: "La Charte de l'Organisation des États Américains a été signée en 1948 et promulguée par le Congrès national du Brésil sous la forme du décret législatif no. 64/49 en 1949, approuvant la charte qui crée l'Organisation, rapprochant les relations et les liens entre les nations des Amériques."

BRA_1950_Elections: "Les élections de 1950"
BRA_1950_Elections_desc: "L'élection présidentielle brésilienne de 1950 était la quinzième élection présidentielle et la treizième élection directe au Brésil qui a eu lieu le 3 octobre 1950."

BRA_1950_Elections_Vargas: "Président Vargas"
BRA_1950_Elections_Vargas_desc: "Getúlio Vargas est de nouveau revenu à la présidence. Avec le peuple à ses côtés, son avenir de populiste est assuré d'être un succès assuré."
BRA_Vargas_Increase_Wage: "Augmenter le salaire minimum"
BRA_Vargas_Increase_Wage_desc: "L'un des premiers actes de Vargas après son retour au pouvoir a été d'augmenter le salaire minimum de 100 %, renforçant ainsi son image de « père des pauvres »."
BRA_Vargas_Rural_Exodus: "Question sur l'exode rural"
BRA_Vargas_Rural_Exodus_desc: "L'exode rural affecte considérablement les campagnes, perdant de nombreuses main-d'oeuvre compétentes et entravant le progrès à l'intérieur du pays. Avec quelques investissements dans la région touchée, nous pouvons réduire son impact sur l'économie, ne serait-ce que légèrement."
BRA_Vargas_Expand_Chemical: "Développer l'industrie chimique"
BRA_Vargas_Expand_Chemical_desc: "Pour développer notre industrie chimique, des subventions et des projets d'expansion ont été accordés par le gouvernement afin de promouvoir la puissance chimique nationale."
BRA_Vargas_Arinos_Law: "Loi Arinos"
BRA_Vargas_Arinos_Law_desc: "La loi Afonso Arinos (loi 1390/51) a été proposée par le membre du Congrès Afonso Arinos de Melo Franco et promulguée par Getúlio Vargas le 3 juillet 1951, qui interdit la discrimination raciale au Brésil. Il s'agit du premier code brésilien à inclure parmi les infractions pénales la pratique d'actes résultant de préjugés fondés sur la race et la couleur de la peau."
BRA_Vargas_US_Assistance: "Visite d'État en Amérique"
BRA_Vargas_US_Assistance_desc: "Le président Vargas a approché les États-Unis, souhaitant rapprocher les deux nations et rechercher des investissements au Brésil, et rapprocher le pays du soutien de Vargas au bloc capitaliste pendant la guerre froide, tout en gardant le Brésil autonome."
BRA_Vargas_Exterior_Commerce_Chart: "Graphique du commerce extérieur"
BRA_Vargas_Exterior_Commerce_Chart_desc: "Le Parlement a élaboré un plan pour mieux stimuler le commerce du Brésil avec ses voisins et les nations lointaines."
BRA_Vargas_National_Industry: "Investir dans notre industrie"
BRA_Vargas_National_Industry_desc: "Le président Vargas a élaboré un plan pour accroître la puissance industrielle nationale du Brésil. Ce plan prévoit l'expansion des aciéries et des complexes industriels de la métropole."
BRA_Reorganize_Synd: "Le nouveau syndicat"
BRA_Reorganize_Synd_desc: "Vargas a décrété que les syndicats ouvriers devaient être réorganisés pour mieux remplir les modèles modernisés, pour mieux garantir les droits et les devoirs des travailleurs."
BRA_Vargas_BNDE: "J'ai trouvé la BNDE"
BRA_Vargas_BNDE_desc: "La BNDE, ou Banque nationale pour l'économie et le développement, est la principale banque de développement du Brésil, créée par la loi n° 1 628 du 20 juin 1952, qui opère dans le financement de projets à long terme, en soutenant les petites et moyennes entreprises et les infrastructures du pays, en mettant l'accent sur le développement durable, la création d'emplois et la réduction des inégalités sociales."
BRA_Vargas_Petrobras: "Petrobras trouvé"
BRA_Vargas_Petrobras_desc: "Petróleo Brasileiro S.A., mieux connu sous le nom de Petrobras, a été créée par la loi n° 2004, sanctionnée par le président de la République Getúlio Vargas, le 3 octobre 1953, dans le but d'être un monopole légal, d'exploiter les riches réserves pétrolières du Brésil et de faire avancer l'économie."
BRA_Vargas_Health_Ministry: "Créer le ministère de la Santé"
BRA_Vargas_Health_Ministry_desc: "Créé en 1930 par Vargas lui-même, le ministère de la Santé publique et de l'Éducation a été séparé en différents départements par une loi de 1953, ce qui a permis d'augmenter le financement et les opérations de manière indépendante sans interférer les uns avec les autres."
BRA_Vargas_National_Oil: "Campagne Le pétrole nous appartient"
BRA_Vargas_National_Oil_desc: "En 1953, le Brésil ne produisait qu'environ 2 700 barils de pétrole par jour. La campagne menée par le président Vargas visait à accroître son efficacité et à promouvoir l'autonomie énergétique brésilienne."
BRA_Vargas_INPA: "La fondation de l'INPA"
BRA_Vargas_INPA_desc: "L'Institut national de recherche amazonienne (Instituto Nacional de Pesquisas da Amazônia ou INPA) est un établissement public d'enseignement et de recherche dont le siège est à Manaus. Elle a été fondée en 1952 dans le but d'approfondir les connaissances scientifiques sur la région amazonienne brésilienne. La plupart des recherches de l'INPA portent sur la gestion des forêts tropicales, l'écologie, l'écologie moléculaire, la zoologie, la botanique, l'agriculture tropicale et la pisciculture tropicale."
BRA_Vargas_Inflation: "Mesures pour lutter contre l'inflation"
BRA_Vargas_Inflation_desc: "L'inflation a gravement affecté notre pays cette année. Les salaires se sont érodés, ce qui a amené de nombreux travailleurs à protester contre Vargas. Nous devons agir vite, sinon tout notre travail sera menacé."
BRA_Appoint_Goulart: "Nommer Goulart Ministre du Travail"
BRA_Appoint_Goulart_desc: "João Goulart a été nommé par le président Vargas ministre du Travail en 1953, au milieu d'un moment de tension entre les travailleurs en grève, avec pour mission d'apaiser les tensions et de négocier avec les dirigeants de la grève."
BRA_Vargas_Conspiration: "Les pièces tombent"
BRA_Vargas_Conspiration_desc: "L'attaque de la rue Tonelero a eu un impact considérable sur l'image de Vargas. Face aux attaques constantes de l'opposition et des médias, l'avenir s'annonce de seconde en seconde plus sombre et plus incertain."
BRA_Vargas_Suicide: "Le dernier acte"
BRA_Vargas_Suicide_desc: "Le président Getúlio Dorneles Vargas, militaire, avocat, deux fois président, leader de la Révolution de 1930, visage de l'Estado Novo, s'est suicidé. Ainsi se termine l'une des époques les plus troublées de l'histoire du Brésil. Mais va-t-il sauver l'avenir ou le condamner ? Seul le temps nous le dira."

BRA_1950_Elections_Gomes: "Président Gomes"
BRA_1950_Elections_Gomes_desc: "Le brigadier Eduardo Gomes a remporté une victoire historique pour l'UDN, marquant la fin définitive de l'ère Vargiste."
BRA_Gomes_Align_US: "Toujours avec l'Amérique"
BRA_Gomes_Align_US_desc: "Nous nous rapprocherons de l'Amérique et de l'Occident pour montrer notre plein soutien aux idéaux de la démocratie et notre opposition commune au communisme."
BRA_Gomes_Attract_Foreign: "Ouvrir notre économie sur le monde"
BRA_Gomes_Attract_Foreign_desc: "Pour accroître notre présence économique sur la scène mondiale, nous devons permettre aux entreprises étrangères d'ouvrir des bureaux dans notre pays, afin de garantir de meilleures chances de conclure des accords au sein de nos pays."
BRA_Gomes_US_Tech_Share: "Accord technologique américain"
BRA_Gomes_US_Tech_Share_desc: "Nous avons conclu un accord de partage technologique historique avec l'Amérique, apportant les avancées technologiques dont nous avions besoin."
BRA_Gomes_Religion: "Promouvoir l'Église"
BRA_Gomes_Religion_desc: "Étant le pays ayant la plus grande population catholique au monde, le Brésil a toujours encouragé la coopération avec l'Église catholique. Le président Gomes va développer ce projet en investissant dans la construction de davantage d'églises à travers le pays."
BRA_Gomes_Modernize_Army: "Moderniser l'armée"
BRA_Gomes_Modernize_Army_desc: "Nos forces armées font cruellement défaut par rapport au visage en constante évolution du champ de bataille. Nous devons investir dans des armes et des stratégies modernes pour nos troupes."
BRA_Gomes_Buy_Weapons: "Augmenter les stocks"
BRA_Gomes_Buy_Weapons_desc: "Profitant de notre récente alliance avec l'Amérique, nous achèterons une partie de leurs stocks d'armes pour remplacer notre stock vieillissant d'équipements datant de la Seconde Guerre mondiale."
BRA_Gomes_Amoco_in_Brazil: "Développer la Standard Oil du Brésil"
BRA_Gomes_Amoco_in_Brazil_desc: "Le Brésil possède une grande quantité de ressources pétrolières qui attendent d'être découvertes, et quelle meilleure façon de les explorer que de donner plus de liberté à nos bons amis de Standard Oil pour exploiter nos réserves ?"
BRA_Gomes_Education: "L'éducation avant tout"
BRA_Gomes_Education_desc: "L'un des drapeaux de campagne de l'UDN a toujours été l'éducation. Et nous avons l'intention d'honorer cela en construisant davantage d'écoles et d'universités dans le pays pour augmenter notre taux d'éducation."
BRA_Gomes_Condemn_Communism: "Condamner la menace communiste"
BRA_Gomes_Condemn_Communism_desc: "Pour renforcer notre attachement à la démocratie et aux valeurs occidentales, nous condamnerons internationalement les régimes communistes de l'Est, et notamment leur accord en Corée."
BRA_Gomes_Navy: "Pour protéger nos mers"
BRA_Gomes_Navy_desc: "Notre Marine était notre fierté à l'époque impériale, mais dernièrement, elle a pris du retard par rapport aux autres nations. Nous allons résoudre ce problème en augmentant le financement de la marine et en achetant du matériel pour nos forces navales."
BRA_Gomes_Air_Force: "Envolée vers les cieux"
BRA_Gomes_Air_Force_desc: "L'armée de l'air brésilienne a été un acteur exceptionnel pendant la guerre mondiale et nous devons conserver son excellence en investissant massivement dans notre défense aérienne."
BRA_Gomes_Ban_PCB: "Briser les rouges"
BRA_Gomes_Ban_PCB_desc: "La menace communiste ne doit pas être combattue seulement à l'étranger, mais aussi à l'intérieur du pays. Le PCB, bien qu'interdit depuis 1947, reste relativement bruyant et ses membres gagnent en popularité lors des élections municipales. Nous lutterons contre cela en envoyant la police sévir plus durement contre ses membres."
BRA_Gomes_American_Companies: "Rejoignez la sphère américaine"
BRA_Gomes_American_Companies_desc: "Nous consoliderons nos liens politiques et idéologiques avec les États-Unis en rejoignant la sphère d'influence américaine."
BRA_Gomes_Support_ROK: "Un coup de main pour la Corée"
BRA_Gomes_Support_ROK_desc: "La République de Corée combat courageusement la menace communiste. Nous les soutiendrons diplomatiquement et militairement."
BRA_Gomes_Army_Schools: "Plus d'écoles militaires"
BRA_Gomes_Army_Schools_desc: "La création d'écoles militaires gratuites à travers le pays contribuera non seulement à promouvoir l'éducation, mais incitera également directement certains membres à rejoindre l'armée et nous accordera un leadership jeune et brillant."
BRA_Gomes_Joint_Exercise: "Le Sud et l'Atlantique Nord"
BRA_Gomes_Joint_Exercise_desc: "L'armée brésilienne réalisera un exercice conjoint aux côtés de l'OTAN, aidant notre armée à se développer davantage et montrant au monde notre engagement en faveur de la défense des intérêts mutuels."

BRA_1950_Elections_Machado: "Président Machado"
BRA_1950_Elections_Machado_desc: "Cristiano Machado a remporté les élections, garantissant un second mandat au PSD pour diriger le pays."
BRA_Machado_Appease_Elites: "Apaiser les élites"
BRA_Machado_Appease_Elites_desc: "Pour faire face à l'immense impopularité de Machado, le PSD s'adressera aux élites pour obtenir davantage d'apaisement en échange d'un soutien pendant les années de gouvernement."
BRA_Machado_Moderate_Industrialization: "Expansion industrielle"
BRA_Machado_Moderate_Industrialization_desc: "Notre industrie doit se développer de manière modérée, en évitant les dépenses excessives et le gaspillage de main-d'oeuvre."
BRA_Machado_Moderate_Alignment: "Liens limités avec l'Amérique"
BRA_Machado_Moderate_Alignment_desc: "Nous devons consolider nos liens avec l'Occident, mais nous n'abandonnerons pas notre pays comme le feraient les métis de l'UDN."
BRA_Machado_Tax_Cuts: "Baisser les impôts des entreprises"
BRA_Machado_Tax_Cuts_desc: "Nous accorderons des réductions d'impôts à nos industries pour aider à les stimuler, en ignorant certaines pratiques peu recommandables de leur part, même si c'est mal, cela améliorera le pays et doit être fait."
BRA_Machado_BNDE: "Créer la BNDE"
BRA_Machado_State_Visit: "Visite d'État au Conesur"
BRA_Machado_State_Visit_desc: "Le président Machado effectuera une visite d'État dans nos pays voisins avec l'idée d'accroître la coopération et le commerce entre l'Amérique du Sud."
BRA_Machado_Technical_Institute: "Instituts techniques d'enseignement supérieur"
BRA_Machado_Technical_Institute_desc: "De nombreuses capitales souffrent encore d'un manque d'universités adaptées pour aider les jeunes talents à trouver leur voie. Nous ouvrirons des instituts techniques dans tout le pays pour aider à résoudre ce problème."
BRA_Machado_PTB_Crack_Down: "Mettre les Getulistes sur la touche"
BRA_Machado_PTB_Crack_Down_desc: "L'ombre du PTB hante toujours le pays. Même s'ils ont perdu un peu de force, ils constituent toujours une menace. Le PSD s'est donc donné pour mission de continuer à s'opposer à eux pour qu'ils ne reviennent jamais."
BRA_Machado_Petrobras: "Créer des Petrobras"
BRA_Machado_Petrobras_desc: "Si nous voulons devenir une grande puissance mondiale, nous aurons besoin d'un moyen d'utiliser nos ressources nationales. Nous créerons l'entreprise Petrobras comme une société mixte, dont la moitié des actions seront détenues par l'État et l'autre moitié par des capitaux privés et étrangers."
BRA_Machado_European_Products: "Importation d'Europe"
BRA_Machado_European_Products_desc: "Les produits européens sont synonymes de qualité et de luxe, et nous conclurons des accords avec des entreprises européennes pour nous apporter cette qualité. Nous pouvons aliéner et dévaloriser notre propre production, mais c'est ainsi."
BRA_Machado_Japanese_Tech: "Technologie venue du Japon"
BRA_Machado_Japanese_Tech_desc: "Le Japon a réalisé un excellent effort de reconstruction après la guerre, le secteur technologique étant le plus impressionnant. Des sociétés comme Tokyo Tsushin Kogyo et Matsushita, qui vendent des téléviseurs, des radios et des appareils électroménagers, ont apporté de grands progrès à l'industrie de la consommation, et nous conclurons un accord avec elles pour nous apporter ces merveilleux produits."
BRA_Machado_Electrification: "Campagne d'électrification"
BRA_Machado_Electrification_desc: "De nombreuses personnes vivant dans les zones rurales du pays n'ont pas accès à l'électricité. En élargissant notre réseau électrique, nous contribuerons à résoudre le manque d'électrification qui touche encore de nombreuses personnes dans le pays."
BRA_Machado_Steel_Mills: "Agrandissement des aciéries"
BRA_Machado_Steel_Mills_desc: "Notre prochain objectif est d'élargir les activités de nos aciéries de renom, principalement la CSN, pour répondre à nos demandes industrielles actuelles."
BRA_Machado_Deals_With_LATAM: "Faire face à LATAM"
BRA_Machado_Deals_With_LATAM_desc: "Nous avons toujours été proches de nos frères d'Amérique latine et nous cherchons à poursuivre cette démarche et à l'améliorer en explorant nos liens via les liens commerciaux et économiques."
BRA_Machado_Independent: "Une alliance en Amérique du Sud"
BRA_Machado_Independent_desc: "Nous cherchons à tenir nos positions face aux autres démocraties du Sud, mais nous ne voulons pas devenir les esclaves des États-Unis. Nous avons besoin de notre propre alliance politique."
BRA_Machado_Economic_Block: "Notre propre bloc économique"
BRA_Machado_Economic_Block_desc: "L'indépendance n'est pas seulement politique, mais économique. Si nous échangeons davantage entre nous qu'avec le Nord, nous montrerons comment nous pouvons réussir sans leur influence."

BRA_50s_Air_Force: "Força Aérea Brasileira"
BRA_50s_Air_Force_desc: "Fondée en 1941, la FAB sert depuis lors de force aérienne brésilienne, combattant courageusement dans l'Atlantique et en Italie. Notre équipement américain avec lequel nous avons combattu nous a bien servi, mais nous devrons revitaliser nos stocks et nos tactiques pour l'avenir."
BRA_50s_Air_Force_Training: "Mettre en oeuvre des centres de formation"
BRA_50s_Air_Force_Training_desc: "La première étape vers une force aérienne modernisée est un programme de formation modernisé. Apprendre des méthodes d'autres pays nous aidera à faire de nos pilotes des guerriers du ciel qualifiés."
BRA_50s_Air_Force_Airfields: "Aérodromes à travers le pays"
BRA_50s_Air_Force_Airfields_desc: "Le Brésil est un vaste pays, et pour que les FAB soient en mesure de défendre correctement notre territoire, nous construirons des aérodromes dans nos États intérieurs pour gérer correctement nos frontières."
BRA_50s_Air_Force_Fighters: "Étudier les conceptions des chasseurs"
BRA_50s_Air_Force_Fighters_desc: "Le protagoniste du combat aérien a toujours été le combattant. Grâce à des études sur des avions étrangers qui excellent dans le domaine, nous pourrons acheter et même peut-être créer nos propres modèles à l'avenir."
BRA_50s_Air_Force_ADC: "Créer le commandement de la défense aérienne"
BRA_50s_Air_Force_ADC_desc: "Air Dominance ne consiste pas seulement à envoyer des avions. Cela comprend également la protection de notre sol contre les attaques ennemies, un commandement de la défense aérienne nous donnera un commandement centralisé pour coordonner nos moyens aériens, améliorer nos réseaux radar et notre défense aérienne."
BRA_50s_Helicopters: "L'hélicoptère, la nouvelle révolution"
BRA_50s_Helicopters_desc: "La Seconde Guerre mondiale a vu la toute première utilisation de l'hélicoptère, une forme d'avion révolutionnaire qui changera sûrement le champ de bataille à jamais. Nous devons capitaliser et amener cette révolution dans nos forces le plus tôt possible."
BRA_50s_Air_Force_Missiles: "Développer des missiles pour le combat"
BRA_50s_Air_Force_Missiles_desc: "Pendant la guerre, les missiles ont fait leurs débuts lors de leur première utilisation dans des combats à grande échelle. Nous devons investir dans cette technologie pour améliorer nos capacités."
BRA_50s_Air_Force_IADC: "Commandement de la défense aérienne intégrée"
BRA_50s_Air_Force_IADC_desc: "Pour étendre notre ADC, nous devrons étendre la couverture radar, déployer des systèmes SAM et augmenter l'efficacité des interceptions au-dessus de notre pays. Leur intégration garantira que notre défense aérienne fonctionne parfaitement comme une machine bien huilée."
BRA_50s_Air_Force_Airborne: "Noyau de la Division Aéroterrestre"
BRA_50s_Air_Force_Airborne_desc: "L'École de Parachutistes de la FAB a été fondée en 1945. Analysant les parachutistes allemands et américains, le Capitaine Roberto Pessoa a contribué à être l'un des premiers instructeurs de l'École après avoir étudié à Fort Benning jusqu'en 1948. Maintenant, ce noyau nous aidera à l'élargir jusqu'à en faire une véritable Division Aéroportée."
BRA_50s_Air_Force_CAS: "Développement de l'appui aérien rapproché"
BRA_50s_Air_Force_Cas_desc: "Meilleur ami de l'infanterie aérienne, l'appui aérien rapproché assure une couverture importante de nos unités au sol et sera un élément clé de la doctrine de guerre combinée air-sol."
BRA_50s_Air_Force_Gloster_Meteor: "Achetez le Gloster Meteor"
BRA_50s_Air_Force_Gloster_Meteor_desc: "Le premier avion à réaction du FAB fut le Gloster Meteor, achetant 70 unités à la Grande-Bretagne en échange de 15 000 unités de coton, en 1953 et restant en service jusqu'en 1974."

BRA_50s_Army: "Exercice brésilien"
BRA_50s_Army_desc: "Issue d'une fière histoire depuis l'époque impériale, l'armée brésilienne comprend l'une des forces militaires les plus puissantes d'Amérique latine et du Sud, prouvant sa force lors de la campagne d'Italie de la Seconde Guerre mondiale."
BRA_50s_Army_Schools: "Expansion des écoles militaires"
BRA_50s_Army_Schools_desc: "Les collèges militaires étant déjà une tradition au Brésil, nous devrions chercher à développer ces écoles, en augmentant leur financement et en les ouvrant davantage pour former des soldats et des officiers compétents."
BRA_50s_Army_Mechanized_Infantry: "La mécanisation de l'armée"
BRA_50s_Army_Mechanized_Infantry_desc: "Des unités d'infanterie mobiles et rapides ont marqué la dernière guerre, et nous serions idiots de ne pas investir dans cela pour notre armée."
BRA_50s_Army_Artillery: "Améliorations de l'artillerie"
BRA_50s_Army_Artillery_desc: "« Les batailles se gagnent par le feu ; augmentez donc votre artillerie ! » Frédéric le Grand\" a déclaré célèbrement. Jouant un rôle majeur dans nos conflits depuis notre indépendance, l'artillerie a été un élément clé de notre armée. Nous ne devrions donc qu'investir davantage dans son développement."
BRA_50s_Army_Professional_Army: "Une armée moderne à l'ère moderne"
BRA_50s_Army_Professional_Army_desc: "L'époque où seule l'infanterie gagnait la guerre est révolue. Le monde change, et nous devons changer aussi. Les armes combinées sont l'avenir, et nous y investirons pour conserver notre fier titre d'homme fort de l'Amérique du Sud."
BRA_50s_Army_Supplies: "La logistique gagne les guerres"
BRA_50s_Army_Supplies_desc: "L'estomac d'un soldat compte plus que son arme. L'amélioration de nos approvisionnements et de notre logistique sera cruciale pour tous les efforts militaires auxquels nous serons confrontés à l'avenir."
BRA_50s_Army_Military_Police: "Réformer la police militaire"
BRA_50s_Army_Military_Police_desc: "Pendant l'ère Vargas, la police a été mise à l'écart car le gouvernement fédéral est intervenu directement en matière de sécurité. Maintenant que ces temps sont révolus, nous pouvons réformer les polices militaires pour reprendre le contrôle total des États."
BRA_50s_Army_Light_Tanks: "Spécialisation armure légère"
BRA_50s_Army_Light_Tanks_desc: "Nous concentrerons nos stratégies et nos développements autour des chars légers et du soutien de l'infanterie, car la vitesse est la véritable clé de la victoire."
BRA_50s_Army_MBT: "Spécialisation Char de combat principal"
BRA_50s_Army_MBT_desc: "Une nouvelle forme de char fait son apparition sur le terrain, le char de combat principal. Avec un équipement moderne, axé sur l'équilibre entre la protection, la mobilité et la puissance de feu, ce sera plus constant, mais améliorera considérablement notre puissance blindée dans les guerres."
BRA_50s_Army_Elite: "Programme des forces spéciales"
BRA_50s_Army_Elite_desc: "Les forces spéciales sont essentielles pour remporter des batailles cruciales et importantes. Avec plus de financement et de formation, nous pouvons toujours avoir une unité prête pour des missions critiques."

BRA_50s_Navy: "Marinha du Brésil"
BRA_50s_Navy_desc: "Notre Marine patrouille nos côtes et assure la sécurité de nos populations et de nos océans."
BRA_50s_Navy_Light_Ships: "Conceptions de navires légers"
BRA_50s_Navy_Light_Ships_desc: "La colonne vertébrale de chaque marine est constituée de ses navires légers. Malgré la puissance de feu importante des grands navires, les navires légers accomplissent la plupart des tâches et constituent l'élément le plus vital de toute marine."
BRA_50s_Navy_ASW: "Guerre anti-sous-marine"
BRA_50s_Navy_ASW_desc: "Les sous-marins ont joué un rôle clé dans les deux guerres mondiales. Nous devons élaborer des mesures pour les contrer et protéger nos navires."
BRA_50s_Navy_Submarines: "Principes de la guerre sous-marine"
BRA_50s_Navy_Submarines_desc: "Et nous nous concentrerons également sur l'amélioration de notre propre arsenal de chasseurs sous-marins. Car ils sont essentiels à une force navale puissante et compétente."
BRA_50s_Navy_Amphibious: "Développer la guerre amphibie"
BRA_50s_Navy_Amphibious_desc: "Le fantassin n'est plus simplement un combattant terrestre. Avec les changements intervenus lors des dernières guerres, la guerre amphibie est devenue monnaie courante et nous devons donc développer nos propres forces amphibies."
BRA_50s_Navy_Tech: "Moderniser la Marine"
BRA_50s_Navy_Tech_desc: "Forts des leçons de la guerre, nous réorganiserons la marine en une force moderne, pour réduire les coûts de production et renouveler nos stratégies."
BRA_50s_Navy_ASM: "Aéronavale"
BRA_50s_Navy_ASM_desc: "Les navires et les avions travaillent main dans la main. Nous améliorerons donc à la fois notre aviation navale et les capacités anti-aériennes de nos navires."
BRA_50s_Navy_Logistic: "Département de la logistique navale"
BRA_50s_Navy_Logistic_desc: "Les navires étant souvent à des mois de nos ports, nous devons améliorer la méthodologie de logistique et d'approvisionnement de notre marine pour garantir une efficacité totale des missions."
BRA_50s_Navy_Carrier: "Doctrine centrée sur le transporteur"
BRA_50s_Navy_Carrier_desc: "Le porte-avions constitue sans aucun doute le changement le plus important dans la guerre navale des derniers milliers d'années. Une marine forte a besoin d'une force aéronavale puissante pour éliminer l'ennemi à la seconde près."
BRA_50s_Navy_School: "L'école navale"
BRA_50s_Navy_School_desc: "L'École Navale est un établissement d'enseignement supérieur de la Marine brésilienne qui vise à former mentalement et physiquement les jeunes Brésiliens qui occuperont les premiers postes dans la carrière d'Officiers de Marine, de Marines et d'Intendants de Marine."
BRA_50s_Navy_Minas_Gerais: "NAeL Minas Gerais"
BRA_50s_Navy_Minas_desc: "Le NAeL Minas Gerais était un porte-avions léger de classe Colossus construit par la Royal Navy britannique pendant la Seconde Guerre mondiale sous le nom de HMS Vengeance. Il a été achevé peu de temps avant la fin du conflit et n'a pas vu de combat. Après avoir servi comme navire-école et navire de recherche dans l'Arctique, le porte-avions fut prêté à la Marine royale australienne de 1952 à 1955. Il fut restitué aux Britanniques, qui le vendirent au Brésil en 1956."

BRA_1955_Elections: "Les élections de 1955"
BRA_1955_Elections_desc: "L'élection présidentielle brésilienne de 1955 a eu lieu le 3 octobre et était la seizième élection présidentielle et la quatorzième élection directe."

BRA_1955_Elections_Kubitschek: "Président Kubitschek"
BRA_1955_Elections_Kubitschek_desc: "Le médecin et policier de Mineiro, Juscelino Kubitschek, a été élu président du PSD."
BRA_Kubitschek_50_Years: "Cinquante ans en cinq"
BRA_Kubitschek_50_Years_desc: "JK a élaboré un plan audacieux et ambitieux pour notre développement économique, le Plan des Objectifs, familièrement appelé « 50 ans en 5 », composé de 30 objectifs gouvernementaux qui cherchent à améliorer le Brésil à une échelle incroyablement grande en seulement cinq ans."
BRA_Kubitschek_Heterodox: "Objectifs dix-neuf à vingt-neuf"
BRA_Kubitschek_Heterodox_desc: "JK a prévu que notre industrie lourde doit être développée pour fournir les réformes que nous cherchons à mettre en oeuvre partout."
BRA_Kubitschek_Ports: "Construire des ports et des chantiers navals"
BRA_Kubitschek_Ports_desc: "Le vaste littoral du Brésil nous aide naturellement à améliorer nos infrastructures et notre puissance commerciale internationale en agrandissant et en construisant nos ports et nos chantiers navals."
BRA_Kubitschek_Electrification: "Objectifs un à cinq"
BRA_Kubitschek_Electrification_desc: "Les cinq premiers objectifs du plan JK visaient à augmenter la production d'énergie hydroélectrique, à encourager la construction d'une production accrue de charbon pour les centrales fossiles, à augmenter la production de pétrole et la capacité de raffinage, et même à encourager la construction de centrales nucléaires."
BRA_Kubitschek_Oil: "Expansion de l'industrie pétrolière"
BRA_Kubitschek_Oil_desc: "L'Or Noir fait bouger le monde, à plus d'un titre. Pour créer un véritable pays du futur, le Brésil doit disposer d'une industrie pétrolière plus forte pour répondre à ses besoins nationaux et industriels."
BRA_Kubitschek_Coal: "L'Initiative du charbon"
BRA_Kubitschek_Coal_desc: "Nous recherchons un changement structurel dans l'industrie charbonnière, qui est en crise à cause de la diésélisation du réseau ferroviaire, qui a laissé sans demande des qualités inférieures de charbon, indispensables à la production, indisponibles, en cherchant à augmenter la production à 3 millions de tonnes de charbon jusqu'en 1960."
BRA_Kubitschek_Steel_Works: "Le coeur de la sidérurgie"
BRA_Kubitschek_Steel_Works_desc: "Notre industrie sidérurgique a débuté avec la fondation de la Compagnie Nationale d'Aciérie par Vargas en 1942, qui était le principal producteur d'acier au Brésil. Le président JK a décidé d'y investir ainsi que dans les actions de la Belgian Congo Mining Co."
BRA_Kubitschek_Communications: "Connecter les gens"
BRA_Kubitschek_Communications_desc: "L'époque des communications lentes est révolue depuis longtemps. Le Brésil doit être un pays moderne et, en tant que tel, disposer d'un réseau de communication moderne, allant du téléphone aux radios et télévisions."
BRA_Kubitschek_Food: "Objectifs treize à dix-huit"
BRA_Kubitschek_Food_desc: "La chose la plus importante que nous devons garantir à notre peuple est la sécurité alimentaire. Avec ces objectifs projetés, nous investirons dans l'industrie alimentaire et chercherons à baisser les prix pour les consommateurs."
BRA_Kubitschek_Healthcare: "Des soins de santé pour tous"
BRA_Kubitschek_Healthcare_desc: "Et plus important que jamais, nos populations doivent rester en bonne santé et en bonne santé. Nous construirons des hôpitaux et des cliniques à l'intérieur du pays afin que les populations les plus pauvres puissent également y accéder, et nous agrandirons nos hôpitaux actuels."
BRA_Kubitschek_Education: "Objectif numéro trente"
BRA_Kubitschek_Education_desc: "Pour garantir l'avenir, pendant cinquante ans et au-delà, l'éducation est fondamentale. Pour avoir un grand pays, nous devons avoir un grand savoir."
BRA_Kubitschek_Agriculture: "Élargir la frontière agricole"
BRA_Kubitschek_Agriculture_desc: "Notre prochain objectif est de permettre à davantage de terres d'être utilisées par l'industrie agricole, en élargissant nos exportations alimentaires et l'accès des consommateurs à ces produits."
BRA_Kubitschek_Housing: "Logement et assainissement"
BRA_Kubitschek_Housing_desc: "De nombreuses personnes manquent encore de logement convenable dans notre pays. En construisant davantage de résidences publiques, nous pouvons leur donner un toit digne. Et nous améliorerons nos installations sanitaires, car de nombreuses personnes à l'intérieur du pays n'y ont pas accès."
BRA_Kubitschek_Infrastructure: "Objectifs six à douze"
BRA_Kubitschek_Infrastructure_desc: "Ces objectifs visaient le secteur des transports, en se concentrant sur l'expansion de nos infrastructures et le développement de nos routes et de nos véhicules."
BRA_Kubitschek_Automotive_Industry: "Une ère de l'automobile"
BRA_Kubitschek_Automotive_Industry_desc: "Le président JK souhaite encourager le commerce des biens de consommation, en particulier le commerce automobile. Le Groupe Exécutif de l'Industrie Automobile (GEIA) a été créé par le décret n° 39 412, sur la base du plan d'objectifs de Juscelino Kubitschek, et a aidé à l'entrée de plusieurs usines du secteur automobile, qui ont été installées au Brésil, principalement dans la région ABC de São Paulo, notamment Volkswagen, Ford, FNM, General Motors, International Harvester, Carrozzeria Ghia, Mercedes-Benz, Scania, Simca, Toyota, Vemag et Willys-Overland.). Le gouvernement a cherché à aider le secteur privé, tant national qu'étranger, avec des incitations fiscales, de change, de crédit et commerciales."
BRA_Kubitschek_Industry_Northeast: "Améliorer la vie dans le Nord-Est"
BRA_Kubitschek_Industry_Northeast_desc: "Le Nord-Est a toujours été une région reculée du Brésil, oubliée et négligée par les gouvernements précédents. Nous cherchons à améliorer cela autant que possible."
BRA_Kubitschek_Technical: "Promouvoir les biens de consommation"
BRA_Kubitschek_Technical_desc: "Le secteur de la consommation doit circuler. Grâce aux campagnes publiques visant à encourager les gens à acheter des produits, ainsi qu'aux nouvelles technologies de la télévision, nous garantirons que nos citoyens achèteront davantage et permettront à l'économie de bien fonctionner."
BRA_Kubitschek_Downsides: "Faire face aux inconvénients"
BRA_Kubitschek_desc: "Nos projets ambitieux ne se sont pas déroulés sans problèmes. Les dépenses massives et les projets intenses ont fait monter en flèche notre inflation à plus de 30% et notre dette extérieure a augmenté encore plus après la rupture de JK avec le FMI en raison de son désaccord avec leur point de vue sur la façon dont devrait être l'économie brésilienne."
BRA_Kubitschek_Corruption: "Résoudre la corruption"
BRA_Kubitschek_Corruption_desc: "Un autre problème majeur était les accusations de corruption portées contre le gouvernement, ce qui a gravement affecté la réputation de JK auprès de la population."
BRA_Kubitschek_Build_Roads: "Autoroutes à travers le pays"
BRA_Kubitschek_Build_Roads_desc: "Nous devons décider de quelle manière nous allons relier notre pays d'un côté à l'autre. Nous avons décidé de construire des projets d'autoroutes massifs, reliant le sud au nord."
BRA_Kubitschek_Railways: "Investir dans les chemins de fer"
BRA_Kubitschek_Railways_desc: "Nous devons décider de quelle manière nous allons relier notre pays d'un côté à l'autre. Nous avons décidé que les chemins de fer à grande vitesse étaient le meilleur moyen d'y parvenir, pour transporter rapidement les personnes et les ressources d'un côté à l'autre."
BRA_Kubitschek_Build_Brasilia: "Le joyau de la couronne"
BRA_Kubitschek_Build_Brasilia_desc: "Il est temps de passer à la dernière et la plus grande étape de tout le gouvernement de JK, non seulement cela, mais aussi ce qui définira son héritage ; Une nouvelle capitale de Brasilia, une ville moderne et planifiée au milieu du pays, symbole de notre travail acharné et de notre espoir pour l'avenir."

BRA_1955_Elections_Tavora: "Président Tavora"
BRA_1955_Elections_Tavora_desc: "Le général Juarez Távora a remporté les élections pour l'UDN."
BRA_Tavora_UDN_Marshall: "Le maréchal de l'UDN"
BRA_Tavora_UDN_Marshall_desc: "Juarez Tavora était connu pour sa discipline, son austérité et ses liens militaires. En tant que président, il veillera à centraliser le pouvoir de l'UDN au sein du gouvernement."
BRA_Tavora_Cut_Spending: "Limiter les dépenses gouvernementales"
BRA_Tavora_Cut_Spending_desc: "Toute bonne présidence doit savoir utiliser l'argent à bon escient. Et le président Tavora y parviendra en réduisant les dépenses inutiles dans nos budgets."
BRA_Tavora_Focus_on_Agro: "Se concentrer sur l'agro"
BRA_Tavora_Focus_on_Agro_desc: "La principale source de notre économie est l'agroalimentaire, qui contribue à maintenir les valeurs familières et chrétiennes et, en tant que telle, doit être au centre de notre projet politique."
BRA_Tavora_US_Alignment: "Renforcer nos liens américains"
BRA_Tavora_US_Alignment_desc: "Pour montrer à nos amis américains notre engagement en tant qu'alliés dans cette nouvelle guerre froide, nous renforcerons nos liens avec eux, démontrant notre fidélité aux valeurs démocratiques."
BRA_Tavora_Popular_Pressure: "Faire face aux troubles"
BRA_Tavora_Popular_Pressure_desc: "Tavora est encore largement impopulaire parmi la population, ce qui rend la tâche difficile à gouverner. Pour cela, nous devrons composer avec le ressentiment de la population."
BRA_Tavora_Privatization: "Privatisation des Entreprises"
BRA_Tavora_Privatization_desc: "Plusieurs entreprises publiques sont responsables de la corruption ou de l'inefficacité. Avec la privatisation, nos problèmes seront résolus, ou du moins, ils ne le seront plus."
BRA_Tavora_Capital_Renovation: "Rénover la ville merveilleuse"
BRA_Tavora_Capital_Renovation_desc: "Rio de Janeiro est bien plus que la capitale, c'est le centre de la culture brésilienne et le visage du Brésil dans son ensemble, et un projet de rénovation fera des merveilles pour l'améliorer tant pour les citoyens que pour le gouvernement."
BRA_Tavora_Deal_With_Congress: "L'autre obstacle"
BRA_Tavora_Deal_With_Congress_desc: "Non seulement le peuple déteste Tavora, mais le Congrès s'y oppose également. Il faut les traiter également, d'une manière ou d'une autre."
BRA_Tavora_Oppose_Syndicates: "S'opposer aux syndicats gênants"
BRA_Tavora_Oppose_Syndicates_desc: "Les travaillistes se révèlent une fois de plus être une épine dans notre pied, leur mouvement populaire étant enflammé aussi bien par les getulistes que par les communistes. Avec la firme UDN au gouvernement, nous veillerons à nous y opposer."
BRA_Tavora_Anti_Getulism: "Écraser l'ombre de Vargas"
BRA_Tavora_Anti_Getulism_desc: "Bien entendu, les plus grands fauteurs de troubles sont les maudits populistes du PTB. Ils sont en déclin depuis un certain temps, mais ils constituent encore un problème assez important. Et ainsi, nous mettrons fin à leur agacement une fois pour toutes."
BRA_Tavora_Placate_Army: "Apaiser l'armée"
BRA_Tavora_Placate_Army_desc: "L'armée est un autre facteur perturbateur sur ce chemin difficile vers un véritable gouvernement. Ils se mêlent de politique depuis la fondation de la République, et il serait judicieux de s'entendre avec eux."
BRA_Tavora_Army_Reform_Law: "Revigorer l'armée"
BRA_Tavora_Army_Reform_Law_desc: "Pour satisfaire pleinement l'armée, nous aurons besoin d'une force modernisée et forte. Il faut donc augmenter son financement."
BRA_Tavora_Invest_In_Sao_Paulo: "Puissance industrielle"
BRA_Tavora_Invest_In_Sao_Paulo_desc: "Une industrialisation plus pragmatique et limitée sera menée pour améliorer notre économie."
BRA_Tavora_Trade_With_America: "Accord commercial américain"
BRA_Tavora_Trade_With_America_desc: "Et ce serait bien d'avoir davantage d'investissements étrangers dans notre économie, principalement auprès de notre grand partenaire, les États-Unis."
BRA_Tavora_Army_Equipment: "Acheter du matériel militaire"
BRA_Tavora_Army_Equipment_desc: "Notre expansion militaire comprendra également l'achat d'équipements modernes auprès de nos alliés pour fournir à nos soldats les dernières technologies."
BRA_Tavora_Build_Docks: "Commerce intercontinental"
BRA_Tavora_Build_Docks_desc: "Avec plus de quais à travers le pays, nous pourrons décupler notre puissance commerciale et mieux diriger nos flux de marchandises."
BRA_Tavora_SADI: "L'aube de l'ISAD"
BRA_Tavora_SADI_desc: "Non seulement nous serons de bons voisins des États-Unis, mais nous serons également de bons amis. Grâce à une alliance de type OTAN entre les pays d'Amérique du Sud, notre avenir sera sûr et solide.  "

BRA_1955_Elections_Adhemar: "Président Adhémar"
BRA_1955_Elections_Adhemar_desc: "Adhémar de Barros a été élu pour le PSP social-démocrate."
BRA_Adhemar_Jeitinho: "Utiliser le Jeitinho"
BRA_Adhemar_Jeitinho_desc: "Comme il est impopulaire, Adhémar doit utiliser le vieux truc du \"jeitinho\" brésilien pour atteindre ses objectifs de président."
BRA_Adhemar_Backroom_Deals: "L'art des accords en coulisses"
BRA_Adhemar_Backroom_Deals_desc: "On ne peut pas imaginer devenir un homme politique à succès au Brésil sans quelques accords louches. Et personne ne le sait mieux qu'Adhémar \"Vole mais fait le travail\" de Barros."
BRA_Adhemar_Deal_With_Workers: "Aider l'ouvrier"
BRA_Adhemar_Deal_With_Workers_desc: "Rendre les travailleurs pleinement heureux n'est jamais une tâche facile. Mais avec quelques paroles douces et un certain effet de levier pour les rendre quelque peu satisfaits."
BRA_Adhemar_New_Vargas: "Les nouveaux Vargas"
BRA_Adhemar_New_Vargas_desc: "C'est clair comme le jour, les gens aiment toujours Vargas malgré tout. Le peuple doit donc se procurer un nouveau Vargas. Et c'est ce que fera le président Adhémar, se présentant comme le nouveau champion des travailleurs du Brésil."
BRA_Adhemar_Bribe_Journalists: "Rejeter la critique"
BRA_Adhemar_Bribe_Journalists_desc: "Pour faire face aux critiques du président Adhémar, il faudra graisser les mains de l'actualité. Rien d'extraordinaire."
BRA_Adhemar_Infrastructure: "Plus de routes, partout"
BRA_Adhemar_Infrastructure_desc: "Au Brésil, celui qui construit les routes gagnera toujours, comme le dit le proverbe. Et Adhémar préfère les oeuvres visibles aux changements économiques invisibles. Avec plus de routes, il gagnera sûrement le soutien populaire."
BRA_Adhemar_Power_Plants: "De la lumière pour tous"
BRA_Adhemar_Power_Plants_desc: "Plus de personnes signifie plus de besoins énergétiques. Le président Adhémar autorisera la création de davantage de centrales électriques et de sous-stations énergétiques, permettant ainsi à davantage de personnes de l'intérieur d'avoir accès à une électricité adéquate, et veillera à ce qu'il soit photographié en train d'ouvrir ces travaux."
BRA_Adhemar_Industry: "Subventions aux Industries"
BRA_Adhemar_Industry_desc: "Face au récent ralentissement de notre économie ces dernières années, le président Adhémar a dû prendre les mesures en main en accordant davantage de subventions aux entreprises pour qu'elles puissent continuer à fonctionner avec succès."
BRA_Adhemar_Homes: "Une maison pour tous"
BRA_Adhemar_Homes_desc: "On ne peut pas refuser au peuple son droit à un logement digne. Un plan audacieux a été élaboré par le président Adhémar, qui consiste à construire de nombreuses maisons pour les personnes à faible revenu."
BRA_Adhemar_Large_Industries: "Il n'y a jamais assez d'usines"
BRA_Adhemar_Large_Industries_desc: "Il ne suffit pas de développer nos industries. Nous avons besoin d'usines de plus en plus grandes. Des productions plus importantes. Faites comprendre au monde à quel point nous pouvons être grandioses et importants pour nous et pour le monde."
BRA_Adhemar_Oil: "Nager dans l'or (noir)"
BRA_Adhemar_Oil_desc: "Des études récentes ont montré que nous sommes situés au-dessus de certains des plus grands dépôts de combustibles fossiles d'Amérique du Sud, à l'exception du Venezuela. Nous devons exploiter au maximum cette précieuse mine le plus rapidement possible."
BRA_Adhemar_Airports: "Ouvrir l'aéroport international Président Adhémar"
BRA_Adhemar_Airports_desc: "Peut-être par pure importance personnelle ou simplement par ego, un immense aéroport international, reliant notre peuple et notre économie partout et au-delà, sera ouvert en hommage au président Adhémar, en se souvenant de lui pour le meilleur ou pour le pire."
BRA_Adhemar_Corruption: "Apprendre de ses erreurs"
BRA_Adhemar_Corruption_desc: "Adhémar s'est laissé aller trop longtemps. Il a pris conscience, peut-être trop tard, des conséquences de sa tolérance à l'égard de la corruption. Pour purifier son nom et son honneur, des mesures drastiques doivent être prises."
BRA_Adhemar_Brasilia: "Le plus grand pari de tous"
BRA_Adhemar_Brasilia_desc: "Certains diraient que c'est délirant. Certains diraient que c'est fou. Certains diraient que c'est du blanchiment d'argent. Mais Adhémar l'appelle par ce qu'il est réellement : Brasilia est le plus grand pari de tous. Un pari qui cimenterait à jamais son héritage dans l'Histoire."