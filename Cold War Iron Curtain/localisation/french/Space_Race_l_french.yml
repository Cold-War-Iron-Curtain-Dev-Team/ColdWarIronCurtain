 mission_venus_mission:0 "Exploration de Vénus"
 mission_venus_mission_desc:0 "Une mission visant à explorer l'atmosphère et les conditions de surface de Vénus à l'aide de boucliers thermiques et de sondes atmosphériques."
 
 mission_unmanned_mars_flyby:0 "Survol inhabité de Mars"
 mission_unmanned_mars_flyby_desc:0 "Une mission robotique effectuant un survol de Mars, équipée de piles à combustible au méthane et de communications haut débit."

