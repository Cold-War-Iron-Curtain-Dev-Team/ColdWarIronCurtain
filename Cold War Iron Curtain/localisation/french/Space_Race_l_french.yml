 mission_manned_orbital_desc:0 "Une mission de vol spatial habité atteignant une orbite stable, nécessitant un système de survie et une technologie de communication robustes."

 mission_lunar_flyby:0 "Survol lunaire"
 mission_lunar_flyby_desc:0 "Une mission de sonde qui survole la Lune, collectant des données grâce à des systèmes de communication et d'alimentation améliorés."

 mission_lunar_orbiter:0 "Orbiteur lunaire"
