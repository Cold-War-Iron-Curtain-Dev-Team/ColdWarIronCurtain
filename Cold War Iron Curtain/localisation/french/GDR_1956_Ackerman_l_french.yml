 GDR_First_Secretary_Ackerman: "Premier secrétaire Ackermann"
 GDR_First_Secretary_Ackerman_desc: "Anton Ackermann a réussi à ravir la direction de la RDA à Walter Ulbricht ; il est temps de le reconnaître officiellement comme notre nouveau Premier Secrétaire."
 GDR_Quelling_the_National_Unrest: "Réprimer les troubles nationaux"
 GDR_Quelling_the_National_Unrest_desc: "Le peuple allemand a perdu confiance dans le leadership du gouvernement. Nous avons beaucoup de travail à faire si nous voulons regagner leur confiance."
 GDR_Dismantling_the_Personality_Cult: "Démanteler le culte de la personnalité"
 GDR_Dismantling_the_Personality_Cult_desc: "Le culte de la personnalité qui s'est répandu ces dernières années est inconvenant et contre-productif par rapport à nos objectifs. Il est temps de le démolir."
 GDR_Relax_Church_Repression: "Détendez la répression de l'Église"
 GDR_Relax_Church_Repression_desc: "Les restrictions imposées à l'Église sont excessives et inutiles. Nous devrions atténuer les pires d'entre elles et entamer un processus de réconciliation limitée."
 GDR_Put_Ulbricht_on_Trial: "Mettre Ulbricht en jugement"
 GDR_Put_Ulbricht_on_Trial_desc: "Walter Ulbricht a nui au progrès de l'État allemand et de son peuple. Il est temps pour lui de comparaître devant la justice."
 GDR_Purge_FDJ_Leadership_Positions: "Purger les postes de direction de la FDJ"
 GDR_Purge_FDJ_Leadership_Positions_desc: "La direction de la Jeunesse allemande libre s'est enracinée et n'est plus disposée à accepter des recommandations ou des changements. Nous devrons le faire à la dure."
 GDR_Investigate_the_Judiciary: "Enquêter sur le pouvoir judiciaire"
 GDR_Investigate_the_Judiciary_desc: "Jusqu'où va la corruption de l'État ? Nous devrons lancer une enquête formelle pour le savoir."
 GDR_A_New_Course_for_the_SED: "Un nouveau parcours pour le SED"
 GDR_A_New_Course_for_the_SED_desc: "Il est temps pour le Parti socialiste unifié d'adopter de nouvelles méthodes pour le bien de la nation. Les méthodes répressives du passé ne nous mèneront pas à la gloire."
 GDR_Provide_Widespread_Amnesty: "Assurer une amnistie généralisée"
 GDR_Provide_Widespread_Amnesty_desc: "Le nombre de personnes innocentes condamnées sur la base d'accusations exagérées ou carrément fabriquées est stupéfiant. Nous devons immédiatement renverser ces convictions !"
 GDR_Purge_Ulbricht_Loyalists_from_the_Politurbo: "Purger le Politurbo"
 GDR_Purge_Ulbricht_Loyalists_from_the_Politurbo_desc: "Le Politburo est infesté d'hommes béni-oui-oui, d'agents étrangers et d'opportunistes corrompus. Il est temps de faire le ménage !"
 GDR_The_German_Path_to_Socialism: "La voie allemande vers le socialisme"
 GDR_The_German_Path_to_Socialism_desc: "Les circonstances de la RDA exigent que nous suivions notre propre voie pour atteindre les objectifs du socialisme. Ce sera un chemin difficile, mais qui en vaut finalement la peine."
 GDR_Loosen_Speech_Restrictions: "Assouplir les restrictions de parole"
 GDR_Loosen_Speech_Restrictions_desc: "Nous ne pouvons pas prétendre être une république ouvrière démocratique tout en restreignant le droit du peuple à être entendu."
 GDR_Allow_Greater_Industrial_Self_Management: "Permettre une plus grande autogestion industrielle"
 GDR_Allow_Greater_Industrial_Self_Management_desc: "Les travailleurs ont prouvé leur capacité à superviser les industries sans trop avoir recours à la surveillance du gouvernement."
 GDR_End_the_War_on_the_EKD: "Mettre fin à la guerre contre l'EKD"
 GDR_End_the_War_on_the_EKD_desc: "La guerre contre l'Église évangélique a causé plus de mal que de bien. Il est temps de mettre fin à cette mascarade et de trouver un terrain d'entente pour le bien du peuple allemand."
 GDR_Instate_Collective_Leadership: "Instaurer un leadership collectif"
 GDR_Instate_Collective_Leadership_desc: "La direction collective abolira l'État à parti unique et permettra une plus grande représentation politique au sein de la RDA."
 GDR_End_the_Cadreization_of_the_Bloc_Parties: "Mettre fin à la cadreisation des partis du Bloc"
 GDR_End_the_Cadreization_of_the_Bloc_Parties_desc: "En théorie, les cadres sont censés contribuer à la réalisation des objectifs du Parti et préserver la pureté idéologique. En réalité, ils ne servent qu'à garantir la loyauté et l'obéissance à ceux qui sont au pouvoir. Nous n'avons aucune utilité pour des béni-oui-oui-oui sans imagination et enthousiastes."
 GDR_Reign_in_the_Worst_of_the_Stasi_Abuse: "Règne dans le pire de la Stasi"
 GDR_Reign_in_the_Worst_of_the_Stasi_Abuse_desc: "Certains membres de la Stasi sont allés trop loin dans leurs opérations pour maintenir l'ordre au sein de la République. Les pires de ces contrevenants seront éliminés. "
