 ALB_monarchy_restoration_referendum_desc:0 "Comme promis, nous aurons un référendum sur la monarchie et son statut."
 ALB_religious_revival_desc:0 "Alors que l'ancien régime disparaît, les organisations religieuses ont recommencé à fleurir ! Plus jamais la religion ne sera opprimée dans nos pays ; nous ferons des amendes spéciales pour conserver son importance dans notre société. L'Islam, qui a été le plus touché par l'oppression, doit bénéficier de davantage de privilèges au sein de notre pays."
 ALB_new_territorial_organization_desc:0 "En redessinant les frontières au sein de notre pays, nous diviserons certaines zones en fonction de la religion pour une gouvernance plus facile et une meilleure cohésion locale."
