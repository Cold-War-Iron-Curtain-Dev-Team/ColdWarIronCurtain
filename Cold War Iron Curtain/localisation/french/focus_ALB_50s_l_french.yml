 ALB_The_Albanian_Counterrevolution_desc:0 "Cela a pris beaucoup de temps, de planification et de ressources, mais nous y sommes parvenus ! Le soutien populaire à notre cause a atteint son apogée et nous sommes prêts à lancer notre contre-révolution !\n\nCe n'est pas une tâche anodine, mais l'Albanie libre l'emportera !"
 ALB_Religious_and_Ethnic_Militias_desc:0 "Nous avons pu obtenir un soutien substantiel de la part de notre population religieuse réprimée pour notre cause depuis un certain temps maintenant, il est temps de lancer un appel à l'action pour leur libération !"
 ALB_Secret_Border_Passages_desc:0 "D'anciennes caches d'armes et des contacts ont été déterrés, et nous avons désormais accès à des flux fiables d'approvisionnement et d'aide de la part de nos frères et soeurs du Kosovo."
 ALB_United_States_Backing_desc:0 "Nos opérations en Albanie ont porté leurs fruits et la contre-révolution a éclaté ! L'Amérique reconnaîtra ce mouvement comme le gouvernement albanais légitime et contribuera à notre lutte contre Hoxha."
 ALB_Liberation_of_Tirana_desc:0 "Tiranë est à nous ! Le moment est venu de changer et de rendre justice contre les serpents rouges qui ont opprimé notre peuple. Nous commencerons par couper la tête du serpent, Hoxha aura le privilège d'un procès rapide et d'une mort rapide."