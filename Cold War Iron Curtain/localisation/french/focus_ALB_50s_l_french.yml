 Albania_1_desc:0 "Nous avons arrêté le vice-Premier ministre et ministre de l'Intérieur Koci Xoxe. Depuis la montée du communisme albanais, Xoxe est un opposant virulent à notre leader [ALB.GetLeader]. De plus, depuis la rupture du méprisable [YUG.GetLeader]avec [SOV.GetLeader], il a également été soutenu avec ferveur par les maudits Yougoslaves, qui souhaitent probablement annexer notre pays à leur grande république soviétique slave du sud. Maintenant qu'il est sous notre contrôle, nous devons décider quoi faire de lui."
 Albania_2_desc:0 "Lors d'un procès secret plus tôt dans la journée, le traître Koci Xoxe a admis avoir travaillé pour les services secrets britanniques et avoir conspiré avec [YUG.GetLeader], le chef des traîtres [YUG.GetNameDef]. Sa purge a été déclarée comme le résultat de ses « activités pro-yougoslaves », et sa punition pour avoir trahi le nouvel État de [ALB.GetLeader]sera d'être pendu par le cou jusqu'à sa mort."
 Albania_3_desc:0 "\nLe 20e Congrès du Parti communiste de l'Union soviétique a été mouvementé pour le monde communiste car il s'agit du premier congrès depuis la mort de Joseph Staline. Au cours de la conférence, [SOV.GetLeader] a dénoncé le culte de la personnalité de Staline et son règne de terreur sur l'Est - ce que Enver Hoxha, de plus en plus paranoïaque, considère comme une menace pour son règne. Le schisme toujours grandissant entre les [SOV.GetNameDef] et les [ALB.GetNameDef] pourrait constituer une menace pour notre souveraineté. Nous pouvons lui permettre de se développer et tracer notre propre voie, ou nous pouvons nous tourner vers Liri Belishova pour obtenir des conseils. En tant que pro-stalinienne et amie de [SOV.GetLeader], elle pourrait inaugurer une nouvelle ère de prospérité pour notre nation."
 Albania_10_desc:0 "Alors qu'Enver Hoxha est devenu de plus en plus paranoïaque, le peuple et le gouvernement se sont retournés contre lui, tout comme contre le nouveau premier secrétaire de l'Union soviétique. À la suite de la dénonciation de son style de gouvernement stalinien, une faction pro-soviétique notable s'est soulevée et a usurpé Hoxha au nom de la nouvelle Première secrétaire albanaise Liri Belishova. Maintenant que Hoxha est enchaîné et accusé d'activités anticommunistes et anti-albanaises, nous devons décider quoi faire de lui."

 Albania_5_desc:0 "Avec la trahison des machinations [YUG.GetLeader], nous avons été isolés de nos frères communistes, sans liens directs avec l'Est et de grands desseins mis sur notre humble pays depuis l'Ouest. Ces grands desseins incluent des rumeurs d'invasion de notre pays, dans l'espoir que notre État isolé soit affaibli et plus disposé à se joindre à eux. Nous resterons debout et combattrons cette subversion capitaliste de notre nation, mais nous ne gagnerons peut-être pas contre leurs infiltrés entraînés."
 Albania_6_desc:0 "Les rumeurs d'une infiltration occidentale étaient vraies ! Au cours des derniers mois, nous avons fait face et avons repoussé plusieurs tentatives visant à semer la dissidence en Albanie de [ALB.GetLeader]. Les expatriés albanais formés sont rentrés dans leur pays la nuit tombée afin de renverser le gouvernement de notre peuple en faveur d'un régime d'oppression. Heureusement, nos forces de sécurité albanaises entraînées ont acculé et fait prisonniers tous ces dissidents étrangers de notre régime."
 Albania_7_desc:0 "Les rumeurs d'une infiltration occidentale étaient vraies ! Au cours des derniers mois, des expatriés albanais formés sont retournés dans leur pays pour renverser le régime oppressif de Hoxha en échange d'un État aligné sur l'Occident et libéré de l'oppression communiste. Les combattants de la liberté alignés sur l'OTAN se battent bec et ongles contre l'État dans une guérilla brutale qui devient lentement de plus en plus intense. Menacé de mort, Hoxha a fui le pays et s'est réfugié à Moscou et, dans le désarroi, un gouvernement aligné sur l'Occident s'est emparé de notre nation."
 Albania_8_desc:0 "Au cours des derniers mois, le [ALB.GetName] a repoussé les attaques de guérilla menées par des expatriés albanais étroitement organisés et bien entraînés. Bien que les combattants de la liberté se soient battus avec acharnement, ils ont été contrés à chaque instant, probablement en partie à cause d'un traître parmi eux. Tous ceux qui se sont opposés au nouvel État de Hoxha dans cette révolte ratée ont été fusillés, pendus ou emprisonnés. Bien que l'on ne sache pas exactement où les expatriés ont été formés, il est presque certain qu'ils ont été formés par des saboteurs occidentaux."
 Albania_9_desc:0 "Dans une lente guerre de guérilla et d'opérations secrètes, de petits groupes de nationalistes albanais ont submergé les forces de sécurité de Hoxha. Suite à des rumeurs d'infiltration occidentale, ces groupes nationalistes ont commencé leurs attaques contre l'État, luttant bec et ongles pour se libérer du régime de Hoxha. Menacé de mort, Hoxha a fui le pays et s'est réfugié à Moscou, et un gouvernement aligné sur l'Occident a pris le contrôle et ouvert des négociations diplomatiques avec les pays de l'OTAN. Aucun mot n'a été entendu de [SOV.GetLeader], mais il n'est probablement pas satisfait de cette évolution."

