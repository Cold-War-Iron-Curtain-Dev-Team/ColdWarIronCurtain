 ALB_request_marshall_plan_assistance_desc:0 "Alors que notre pays est dévasté par la Seconde Guerre mondiale et maintenant par une guerre civile, nous avons désespérément besoin d'une aide extérieure pour la reconstruction. Merci à Dieu pour le plan Marshall."
 ALB_recall_diaspora_economic_elite_desc:0 "Alors que les derniers membres de l'élite économique reviennent en Albanie, nous pouvons restituer leurs actifs nationalisés et relancer notre secteur privé en pleine reconstruction grâce à leur aide et leur expertise."
 ALB_ask_uk_for_our_gold_desc:0 "D'abord pillés par les Allemands puis retenus par les Britanniques, nous exigerons qu'ils nous rendent notre or légitime !"
 ALB_transition_to_market_economy_desc:0 "Alors que les propriétaires d'entreprises et les citoyens ont dépouillé leurs usines et leurs entreprises, nous rendrons ces actifs à leurs propriétaires d'origine lorsque nous le pouvons et ramènerons le libre marché."
 ALB_support_agrarian_economy_desc:0 "Les rouges ont détruit l'ordre des choses sur nos terres avec leurs politiques de réforme agraire et de collectivisation. Nous instituerons la décollectivisation et réorganiserons les réformes agraires pour bénéficier à la fois aux intérêts privés et aux agriculteurs."
 ALB_keep_workers_unions_controlled_desc:0 "Nous allons mettre en laisse les syndicats radicaux dans notre pays avant qu'ils ne causent davantage de dégâts. Cependant, le soutien massif qui reste aux syndicats peut également être utilisé en notre faveur."
 ALB_ukalbania_universities_exchange_desc:0 "Avec l'aide britannique et le retour de nos citoyens de l'étranger, nous avons récupéré des esprits brillants pour renforcer notre base scientifique."
 ALB_decommunize_society_desc:0 "L'ancien gouvernement idéaliste a supprimé toutes les données pertinentes sur les personnes qu'il essayait de gouverner, nous allons refaire notre registre d'identité, nous devons savoir qui sont nos citoyens."
 ALB_albanian_free_elections_desc:0 "Nous avons fait de grands progrès et nous sommes suffisamment stables pour commencer à organiser des élections libres, tout le monde aux urnes !"
