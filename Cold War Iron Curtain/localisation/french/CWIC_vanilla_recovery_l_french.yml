# Vanilla source: english/events_l_english.yml
 britain.18.b:0 "Nous n'interférerons pas avec le Parlement."
 britain.18.d:0 "Ce n'est un secret pour personne : aucun amour n'est perdu entre George VI et les [Root.GetRulingParty]. Des voix au Parlement réclament désormais sa démission en faveur de son frère exilé, Édouard VIII. C'est un homme moins étranger à l'idée d'unité par la force et un homme avec une vision pour l'Angleterre. Ce sont les qualités que nous recherchons chez un leader de notre nation !"
 lar_collab_gov.1.d:0 "[From.GetNameDefCap] ont récemment intensifié leurs efforts pour établir une collaboration au sein de notre nation. Un certain nombre de politiciens [This.GetAdjective] ont commencé à parler avec plutôt sympathie du régime [From.GetAdjective], et de nombreux partisans au sein de notre pays transforment leur sentiment [From.GetRulingIdeology] en un soutien direct au [From.GetNameDef].\n\nL'influence croissante des [From.GetAdjective] dans notre pays réduira sans aucun doute la résistance des [Root.GetAdjective] et pourrait même conduire à un nouveau gouvernement des [From.GetRulingIdeology] en collaboration avec les [From.GetNameDef] au cas où les [Root.GetNameDef] capituleraient."
 lar_collab_gov.1.t:0 "[From.GetAdjective] Partisans en [Root.GetNameDef]"
 news.145.a:0 "Une évolution significative."
 news.159.a:0 "Cela mènera-t-il à la paix éternelle ou à une autre guerre ?"
 news.159.b:0 "Ensemble, nous ne serons jamais vaincus !"
 news.159.c:0 "Une excellente initiative !"
 news.159.d_01:0 "[From.GetLeader] a annoncé aujourd'hui que [From.GetName] avait tendu la main pour former une nouvelle alliance. [From.GetFactionName] ont rendu publique leur intention de coopérer en cas de guerre.\n\nMême si les grandes coalitions peuvent dissuader toute agression, nous avons vu les conséquences qu'elles entraînent en cas de conflit. Les intentions des différents partis rejoignant cette nouvelle alliance sont encore discutables, mais l'objectif qu'elle pourrait finalement servir peut être inconnu même de ses instigateurs."
 news.159.d_02:0 "Il a été émis l'hypothèse que les démocraties ne se font pas la guerre, mais cela ne signifie pas qu'elles sont assurées de s'entraider dans les guerres. Comme les intérêts politiques sont divers et que les peuples veulent la paix, entrer dans une guerre a souvent un coût élevé pour ces nations.\n\nCependant, cela n'a pas empêché les [From.GetName] d'annoncer aujourd'hui qu'ils ont formé une alliance militaire, les [From.GetFactionName], pour unir leurs forces dans la protection de leur peuple et de leurs idéaux."
 news.159.d_03:0 "Même [From.GetName], célèbre pour sa foi dans la force et la supériorité de son peuple et de sa nation, n'hésite pas à former des alliances avec ceux qu'il respecte. [From.GetLeader] a annoncé aujourd'hui que les accords finaux avaient été conclus concernant la [From.GetFactionName], une coalition militaire qui ne laisserait place qu'aux nations honorables destinées à la grandeur.\n\nQue cette grandeur soit censée provenir de la construction d'une société idéale à l'intérieur des frontières des nations respectives ou d'une collaboration pour s'étendre au-delà de celles-ci, le monde ne le saura peut-être pas avant qu'il ne soit trop tard."
 news.159.d_04:0 "Malgré la récente focalisation soviétique sur le communisme dans un seul pays, les racines internationalistes du mouvement transcendent les frontières. Cette solidarité avec les travailleurs du monde entier a été un élément clé du discours du [From.GetLeader]aujourd'hui, lors de l'annonce du [From.GetFactionName].\n\nAu-delà d'une Internationale politique, il s'agit d'une alliance qui lie militairement les pays, les deux régimes promettant de s'entraider contre les menaces extérieures. Reste à savoir si cela servira d'épée ou de bouclier à la révolution communiste."
 news.159.t:0 "L'aube de [From.GetFactionName]"
 news.159.tt:0 "[This.GetName] fait partie du [From.GetFactionName] avec [From.GetName].\n"
 spanish_civil_war:0 "La guerre civile espagnole a commencé"
 traitors:0 "Traîtres !"
 usa.3.d:0 "Les sanctions diplomatiques et économiques que nous avons subies de la part des États-Unis semblent avoir été le début de quelque chose de plus menaçant. La flotte américaine du Pacifique est stationnée dans la base navale de Pearl Harbor, à Hawaï, ce qui indique clairement que les Américains maintiendront une forte présence dans le Pacifique et continueront à soutenir nos ennemis. Frapper contre la base à ce stade peut nous donner un élément de surprise."
 usa.3.t:0 "Flotte américaine à Pearl Harbor"
 usa.4.d:0 "Après avoir pris position contre les Allemands, les États-Unis semblent vouloir garantir que la Grande-Bretagne reste forte face à la menace allemande. Mais ils sont également soucieux de maintenir leur propre présence navale dans l'Atlantique. En échange de plusieurs de nos bases navales, ils fourniront à notre nation des navires destroyers. Les navires étaient en réserve, mais les accepter renforcerait encore les liens militaires entre nos nations et pourrait être une sage décision."
 usa.5.d:0 "Malgré nos préparatifs et nos bonnes intentions, la Grande-Bretagne a refusé notre offre de vieux destroyers en échange de leurs bases navales."

