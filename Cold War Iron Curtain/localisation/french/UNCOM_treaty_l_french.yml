l_french:
 UNCOM_treaty_decisions:0 "Commandement des Nations Unies"
 UNCOM_treaty_decisions_desc:0 "Objectifs du Commandement des Nations Unies en Corée. Bureaux de liaison : [?global.UNCOM_liaison_count|0]. Contingents terrestres : [?global.UNCOM_ground_count|0]. Naval : [?global.UNCOM_naval_count|0]. Air : [?global.UNCOM_air_count|0]. Réapprovisionnement : [?global.UNCOM_resupply_count|0]."
 UNCOM_Fund_Command_Liaison:0 "Personnel du bureau de liaison"
 UNCOM_Fund_Command_Liaison_desc:0 "Envoyez des officiers et du personnel de communication pour gérer les commandes et les demandes d'approvisionnement entre notre gouvernement et le commandement."
 UNCOM_Open_Command_Liaison:0 "Ouvrir les bureaux de liaison du commandement"
 UNCOM_Open_Command_Liaison_desc:0 "Les États-Unis, la Corée du Sud et trois autres gouvernements contributeurs ont doté leurs bureaux de liaison de personnel."
 UNCOM_Deliver_Ground_Contingent:0 "Envoyer un contingent terrestre"
 UNCOM_Deliver_Ground_Contingent_desc:0 "Embarquez un bataillon avec son équipement et son contingent de remplacement. Sa force est mise au service de l'effort de guerre de la République de Corée."
 UNCOM_Deliver_Large_Contingent:0 "Envoi d'un groupe-brigade"
 UNCOM_Deliver_Large_Contingent_desc:0 "Envoyez une formation plus grande avec les officiers et les stocks de remplacement nécessaires pour la maintenir en service. Il garde son identité nationale au sein du commandement."
 UNCOM_Deliver_First_Contingents:0 "Amener les premiers contingents à terre"
 UNCOM_Deliver_First_Contingents_desc:0 "Les États-Unis et trois autres gouvernements ont envoyé des contingents terrestres à la Corée."
 UNCOM_Deliver_Naval_Support:0 "Approvisionnement des opérations d'escorte navale"
 UNCOM_Deliver_Naval_Support_desc:0 "Financer les escortes et le transport nécessaires pour transporter les fournitures vers la Corée."
 UNCOM_Deliver_Air_Support:0 "Ravitaillement du détachement aérien"
 UNCOM_Deliver_Air_Support_desc:0 "Libérer les avions et les équipes au sol pour l'engagement coréen."
 UNCOM_Deliver_Transport_Flight:0 "Alimenter le vol de transport"
 UNCOM_Deliver_Transport_Flight_desc:0 "Affecter des avions de transport aux travaux de ravitaillement du commandement, aux côtés du contingent terrestre grec."
 UNCOM_Coordinate_Service_Support:0 "Coordonner le soutien maritime et aérien"
 UNCOM_Coordinate_Service_Support_desc:0 "Deux gouvernements ont fourni un soutien naval et deux, un soutien aérien."
 UNCOM_Deliver_Resupply:0 "Envoyer l'envoi de remplacement"
 UNCOM_Deliver_Resupply_desc:0 "Envoyez des magasins de remplacement en réponse aux demandes actuelles du commandement, pour maintenir l'engagement déjà pris."
 UNCOM_Sustain_Contingents:0 "Gardez les contingents approvisionnés"
 UNCOM_Sustain_Contingents_desc:0 "Six mois après le débarquement des premiers contingents, quatre contributeurs ont livré un nouvel envoi de fournitures."
 UNCOM_Conclude_Armistice:0 "Apportez le commandement à l'armistice"
 UNCOM_Conclude_Armistice_desc:0 "Un armistice a mis fin aux combats, la République de Corée étant toujours debout et les contingents approvisionnés."
 UNCOM_Withdraw_Commitment:0 "Retirer notre engagement"
 UNCOM_Withdraw_Commitment_desc:0 "Informez le commandement que notre gouvernement met fin à son engagement. Les contributions déjà versées sont maintenues."
 UNCOM_participant:0 "Servir sous le Commandement des Nations Unies"
 UNCOM_active:0 "Le Commandement des Nations Unies opère en Corée"
 UNCOM_armistice_recorded:0 "Un armistice coréen a été signé"
 korea.50.t:0 "[GetNewspaperHeader]Le commandement unifié de l'ONU placé sous la direction américaine"
 korea.50.d:0 "Le Conseil de sécurité a demandé aux États membres qui fournissent des forces à la Corée du Sud de les placer sous un commandement unifié dirigé par les États-Unis, et a autorisé ce commandement à arborer le drapeau des Nations Unies aux côtés des couleurs nationales.\n\nSeize gouvernements ont jusqu'à présent proposé des forces de combat, du Commonwealth britannique à la Turquie, en passant par l'Éthiopie, la Colombie et la Thaïlande. Chaque contingent reste sous son propre gouvernement, qui décide combien il envoie et pour combien de temps.\n\nLa délégation soviétique, qui boycotte le Conseil depuis janvier, n'était pas présente au vote. Moscou a qualifié la résolution d'illégale."
 korea.50.a:0 "Le drapeau va à la Corée."
 UNCOM_liaison_done:0 "A doté son bureau de liaison"
 UNCOM_ground_done:0 "A livré un contingent terrestre"
 UNCOM_naval_done:0 "A fourni un soutien naval"
 UNCOM_air_done:0 "A fourni un soutien aérien"
 UNCOM_resupply_done:0 "A envoyé un envoi de remplacement"
 UNCOM_sustain_wait:0 "Moins de six mois depuis le débarquement des premiers contingents"
 UNCOM_goal_liaison_done:0 "Les bureaux de liaison du commandement sont ouverts"
 UNCOM_goal_contingents_done:0 "Les premiers contingents sont à terre"
 UNCOM_goal_services_done:0 "Le soutien maritime et aérien est coordonné"
 UNCOM_goal_supply_done:0 "Les contingents sont approvisionnés"
 UNCOM_goal_armistice_done:0 "Le commandement a atteint l'armistice"
