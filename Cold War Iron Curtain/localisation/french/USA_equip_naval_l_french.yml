l_french:
 #Battleship/Battlecruiser Hulls in research tree# 

 USA_battle_hull_medium_0: "Classe Iowa"
 USA_battle_hull_medium_1: "Refit de classe Iowa I"
 USA_battle_hull_medium_2: "Refit II de la classe Iowa"
 USA_battle_hull_medium_3: "Programme de base du croiseur"
 USA_battle_hull_medium_4: "Classe Zumwalt"
 USA_battle_hull_medium_0_desc: "Coque de cuirassé plus avancée de la fin de la Seconde Guerre mondiale, ces navires sont rapides et assez agiles pour leur taille, avec un excellent armement pour leur époque et le potentiel d'être améliorés avec de nouveaux équipements presque indéfiniment."
 USA_battle_hull_medium_1_desc: "Un grand croiseur ou croiseur de bataille de l'époque de la guerre froide, armé d'une variété d'armes. Certains sont encore équipés de canons de gros calibre d'antan et d'autres sont équipés de nouveaux missiles navire-air et navire-sol."
 USA_battle_hull_medium_2_desc: "Un grand croiseur guidé ou un croiseur de bataille de l'époque de la guerre froide, armé de divers systèmes d'armes pour les engagements de missiles navire-navire, navire-sol ou navire-air."
 USA_battle_hull_medium_3_desc: "Un grand croiseur guidé ou un croiseur de bataille de l'époque de la guerre froide, doté d'un espace permettant aux ressources aériennes d'opérer ainsi qu'un large assortiment mortel de systèmes de missiles spécifiques à la mission."
 USA_battle_hull_medium_4_desc: "Un croiseur lance-missiles ou un croiseur de bataille moderne, armé des dernières technologies en matière de systèmes de missiles ou des premières technologies de canon à rail, peut frapper au-delà de l'horizon comme aucun autre navire avant lui."
  
 #Carrier Hulls in research tree#

 USA_carrier_hull_0: "Classe intermédiaire"
 USA_carrier_hull_1: "Classe Forrestal"
 USA_carrier_hull_2: "Réaménagement de classe Midway I"
 USA_carrier_hull_3: "Programme de porte-avions moyen"
 USA_carrier_hull_4: "Programme de navires de contrôle maritime"
 USA_carrier_hull_0_desc: "Les navires de classe CVB-41 (alors sans nom) ont été conçus à l'origine en 1940 comme une étude de conception visant à déterminer l'effet de l'inclusion d'un poste de pilotage blindé sur un porte-avions de la taille de la classe Essex. Les calculs qui en ont résulté ont montré que l'effet serait une réduction de la taille du groupe aérien : le navire résultant aurait un groupe aérien de 64, contre 90 à 100 pour les transporteurs de la flotte standard de la classe Essex. Au fur et à mesure de son évolution, la conception a également été fortement influencée par l'expérience de guerre des véhicules blindés de la Royal Navy."
 USA_carrier_hull_1_desc: "Les porte-avions de classe Forrestal étaient quatre porte-avions conçus et construits pour la marine américaine dans les années 1950. Le navire de classe porte le nom de James Forrestal, le premier secrétaire à la Défense des États-Unis. Il s'agissait de la première classe de supercarriers, combinant un tonnage élevé, des ascenseurs au bord du pont et un pont incliné. Le premier navire a été mis en service en 1955, le dernier mis hors service en 1998."
 USA_carrier_hull_2_desc: "Un carénage des porte-avions de classe Midway. À l'origine, seul l'USS Midway a fait l'objet d'un vaste programme de modernisation et de reconstruction, qui s'est avéré controversé et coûteux et n'a donc pas été répété sur les autres navires."
 USA_carrier_hull_3_desc: "Le porte-avions (moyen) (CVV) était une conception américaine pour un porte-avions à propulsion conventionnelle (c'est-à-dire non nucléaire) proposé dans les années 1970. Il devait être plus petit et moins cher que la classe Nimitz contemporaine à propulsion nucléaire. Un seul exemplaire était prévu, mais n'a pas été construit, d'autres transporteurs de classe Nimitz étant construits à la place. "
 USA_carrier_hull_4_desc: "Le Sea Control Ship (SCS) était un porte-avions développé et conceptualisé par la marine américaine sous la direction du chef des opérations navales Elmo Zumwalt dans les années 1970. Actuellement, le terme fait référence aux navires militaires capables d'accomplir des tâches similaires. Le SCS était conçu comme un navire d'escorte, fournissant un soutien aérien aux convois. Il a été annulé après des coupes budgétaires dans la marine américaine."
 
 USA_carrier_hull_light_0: "Classe d'indépendance"
 USA_carrier_hull_light_1: "Classe Iwo Jima"
 USA_carrier_hull_light_2: "Classe Tarawa"
 USA_carrier_hull_light_3: "Classe de guêpe"
 USA_carrier_hull_light_4: "Classe Amérique"
 USA_carrier_hull_light_0_desc: "les porte-avions de la classe Independence étaient une classe de porte-avions légers construits pour la marine américaine qui a servi pendant la Seconde Guerre mondiale."
 USA_carrier_hull_light_1_desc: "Les navires d'assaut amphibies de classe Iwo Jima de la marine américaine ont été les premiers navires d'assaut amphibies conçus et construits comme porte-hélicoptères dédiés, capables d'exploiter jusqu'à 20 hélicoptères pour transporter jusqu'à 1 800 marines à terre."
 USA_carrier_hull_light_2_desc: "La classe Tarawa est une classe de navires d'assaut amphibie de type Landing Helicopter Assault (LHA) exploités par la marine américaine (USN). Cinq navires ont été construits par Ingalls Shipbuilding entre 1971 et 1980 ; quatre autres navires étaient prévus, mais annulés par la suite ; au lieu de cela, ils furent rejoints par les navires d'assaut amphibies de classe Wasp. "
 USA_carrier_hull_light_3_desc: "La classe Wasp est une classe de navires d'assaut amphibies à quai d'hélicoptère de débarquement (LHD) exploités par la marine américaine. Basé sur la classe Tarawa, avec des modifications pour exploiter des avions et des péniches de débarquement plus avancés."
 USA_carrier_hull_light_4_desc: "La classe America (anciennement classe LHA(R)) est une classe de navires d'assaut amphibie de type hélicoptère d'atterrissage (LHA) de la marine américaine (USN). La classe est conçue pour débarquer une unité expéditionnaire maritime utilisant des hélicoptères et des avions de transport MV-22B Osprey V/STOL, soutenus par des avions AV-8B Harrier II ou F-35 Lightning II V/STOL et divers hélicoptères d'attaque."
 
 USA_carrier_hull_super_1: "Classe Kitty Hawk"
 USA_carrier_hull_super_2: "Classe Nimitz"
 USA_carrier_hull_super_3: "Classe Théodore Roosevelt"
 USA_carrier_hull_super_4: "Classe Ronald Reagan"
 USA_carrier_hull_super_1_desc: "L'introduction de l'ère nucléaire et l'adoption de réacteurs navalisés plus petits permettent à ces grands navires non seulement de transporter de grandes ailes aériennes, mais également de rester en mer presque indéfiniment."
 USA_carrier_hull_super_2_desc: "Une conception de super porte-avions mise à jour avec des réacteurs plus efficaces et la capacité de transporter encore plus d'avions."
 USA_carrier_hull_super_3_desc: "Une conception avancée de super porte-avions de la fin de la Guerre froide, dotée d'un effectif massif d'avions et de réacteurs améliorés."
 USA_carrier_hull_super_4_desc: "Une conception de super porte-avions moderne avec des réacteurs encore améliorés, un effectif massif d'avions et la capacité de les lancer rapidement et efficacement en utilisant des catapultes améliorées."
 
 # Submarine Hulls #
 USA_sub_hull_small_single_0: "Classe de fléchettes"
 USA_sub_hull_small_single_0_desc: "L'USS Darter (SS-576), un sous-marin unique basé sur la classe Tang, mais intégrant de nombreuses améliorations, fut le deuxième navire de la marine américaine à porter le nom du dard, un type de petit poisson d'eau douce américain."
 USA_sub_hull_small_single_1: "Classe de barbeaux"
 USA_sub_hull_small_single_1_desc: "Les sous-marins de classe Barbel, les derniers sous-marins d'attaque à propulsion diesel-électrique construits par la marine américaine, incorporaient de nombreuses améliorations techniques radicales par rapport aux classes précédentes. Il s'agissait des premiers navires de guerre de production construits avec une coque en forme de larme, testés pour la première fois sur l'USS Albacore expérimental (AGSS-569), et les premiers à combiner la salle de contrôle, le centre d'attaque et la tourelle dans le même espace de la coque."
 USA_sub_hull_small_single_2: "Classe d'esturgeon"
 USA_sub_hull_small_single_2_desc: "La classe Sturgeon (connue familièrement dans les cercles navals sous le nom de classe 637) était une classe de sous-marins nucléaires d'attaque rapide (SSN) en service dans la marine américaine des années 1960 à 2004. Ils étaient les « bêtes de somme » de la flotte de sous-marins d'attaque de la marine pendant une grande partie de la guerre froide."
 USA_sub_hull_small_single_3: "Classe de loup de mer"
 USA_sub_hull_small_single_3_desc: "La classe Seawolf est une classe de sous-marins nucléaires d'attaque rapide (SSN) en service dans la marine américaine. La classe était le successeur prévu de la classe Los Angeles et les travaux de conception ont commencé en 1983."
 USA_sub_hull_small_single_4: "Classe de Virginie"
 USA_sub_hull_small_single_4_desc: "La classe Virginia, également connue sous le nom de classe SSN-774, est une classe de sous-marins d'attaque rapide à missiles de croisière à propulsion nucléaire, en service dans la marine américaine. Conçu par General Dynamics Electric Boat (EB) et Huntington Ingalls Industries, la classe Virginia est le dernier modèle de sous-marin de la marine américaine, qui intègre les dernières technologies en matière de furtivité, de collecte de renseignements et de systèmes d'armes."

 USA_sub_hull_large_single_0: "Classe de tanche"
 USA_sub_hull_large_single_0_desc: "Les sous-marins de classe Tench étaient un type de sous-marin construit pour la marine américaine (USN) entre 1944 et 1951. Ils constituaient une amélioration par rapport aux classes Gato et Balao, seulement environ 35 à 40 tonnes plus grandes, mais plus solidement construits et avec une disposition interne légèrement améliorée."
 USA_sub_hull_large_single_1: "Cours de patinage"
 USA_sub_hull_large_single_1_desc: "Les sous-marins de classe Skate ont été la première série de sous-marins à propulsion nucléaire de la marine américaine. Ils constituaient une évolution de la classe Tang dans tous les domaines, à l'exception de leurs centrales de propulsion, qui étaient basées sur le prototype opérationnel USS Nautilus. Les quatre bateaux de la classe Skate ont réintroduit les tubes lance-torpilles arrière."
 USA_sub_hull_large_single_2: "Classe de bonite"
 USA_sub_hull_large_single_2_desc: "La classe Listao était une classe de sous-marins nucléaires (SSN) de la marine américaine entrés en service en 1959-61. Cette classe doit son nom à son bateau principal, l'USS Listao. La nouvelle classe a introduit la coque en forme de larme et le réacteur S5W sur les sous-marins nucléaires américains."
 USA_sub_hull_large_single_3: "Vol de classe I à Los Angeles"
 USA_sub_hull_large_single_3_desc: "La classe de sous-marins Los Angeles est constituée de sous-marins d'attaque rapide (SSN) à propulsion nucléaire en service dans la marine américaine. Également connue sous le nom de classe 688 (prononcé « six-quatre-vingt-huit ») d'après le numéro de coque du navire de tête USS Los Angeles (SSN-688), 62 ont été construits de 1972 à 1996, ce dernier 23 selon une norme 688i améliorée."
 USA_sub_hull_large_single_4: "Vol de classe Los Angeles II"
 USA_sub_hull_large_single_4_desc: "La classe de sous-marins Los Angeles est constituée de sous-marins d'attaque rapide (SSN) à propulsion nucléaire en service dans la marine américaine. Également connue sous le nom de classe 688 (prononcé « six-quatre-vingt-huit ») d'après le numéro de coque du navire de tête USS Los Angeles (SSN-688), 62 ont été construits de 1972 à 1996, ce dernier 23 selon une norme 688i améliorée."

 USA_sub_hull_large_double_0: "Classe Grayback"
 USA_sub_hull_large_double_0_desc: "Le sous-marin de classe Grayback était une classe de deux sous-marins porteurs de missiles guidés de la marine américaine. Ils transportaient les missiles de croisière nucléaires Regulus I et Regulus II, déployés de 1957 à 1964, qui ont été rapidement éliminés par les missiles balistiques lancés sous-marins Polaris (SLBM)."
 USA_sub_hull_large_double_1: "Classe George Washington"
 USA_sub_hull_large_double_1_desc: "La classe George Washington était une classe de sous-marins nucléaires lance-missiles déployés par la marine américaine. George Washington, ainsi que les classes ultérieures d'Ethan Allen, Lafayette, James Madison et Benjamin Franklin, constituaient le groupe de sous-marins « 41 for Freedom » qui représentait la principale contribution de la Marine à la force de dissuasion nucléaire jusqu'à la fin des années 1980."
 USA_sub_hull_large_double_2: "Classe Ohio"
 USA_sub_hull_large_double_2_desc: "La classe Ohio de sous-marins à propulsion nucléaire comprend les 14 sous-marins lance-missiles (SSBN) de la marine américaine et ses quatre sous-marins lance-missiles (SSGN) de croisière. Déplaçant chacun 18 750 tonnes immergées, les bateaux de la classe Ohio sont les plus grands sous-marins jamais construits pour la marine américaine. Ce sont les troisièmes plus grands sous-marins du monde."
 USA_sub_hull_large_double_3: "Classe Colombie"
 USA_sub_hull_large_double_3_desc: "Le sous-marin de classe Columbia, anciennement connu sous le nom de sous-marin de remplacement Ohio et de sous-marin SSBN-X Future Follow-on, est une nouvelle classe de sous-marins nucléaires conçus pour remplacer les sous-marins lance-missiles balistiques de classe Ohio dans la marine américaine."

 # Screen Hulls #

 USA_screen_hull_medium_0: "Classe John C. Butler"
 USA_screen_hull_medium_0_desc: "La classe John C. Butler était un destroyer d'escorte né pendant la Seconde Guerre mondiale. Le navire de tête était l'USS John C. Butler, mis en service le 31 mars 1944."
 USA_screen_hull_medium_1: "Classe Bronstein"
 USA_screen_hull_medium_1_desc: "Les frégates de classe Bronstein étaient des navires de guerre de la marine américaine, initialement conçus comme escortes océaniques (anciennement appelées escortes de destroyers), mais ont toutes été renommées frégates le 30 juin 1975 lors de la reclassification des navires de la marine américaine en 1975 et leur désignation de coque a été modifiée de DE à FF."
 USA_screen_hull_medium_2: "Classe Knox"
 USA_screen_hull_medium_2_desc: "Les 46 frégates de classe Knox étaient les plus grandes, les dernières et les plus nombreuses des escortes de guerre anti-sous-marine (ASW) de deuxième génération de l'US Navy. Initialement prévus comme escortes océaniques (anciennement appelées escortes de destroyers), ils ont tous été renommés frégates le 30 juin 1975, dans le plan de reclassement des navires de 1975 et leur désignation de coque a été modifiée de « DE » à « FF ». La classe Knox était le dernier modèle de type destroyer de la Marine doté d'un groupe motopropulseur à turbine à vapeur."
 USA_screen_hull_medium_3: "Classe Oliver Hazard Perry"
 USA_screen_hull_medium_3_desc: "La classe Oliver Hazard Perry est une classe de frégates lance-missiles nommées en l'honneur du commodore américain Oliver Hazard Perry, héros de la bataille navale du lac Érié. Également connus sous le nom de classe Perry ou FFG-7 (communément « fig sept »), les navires de guerre ont été conçus aux États-Unis au milieu des années 1970 comme navires d'escorte polyvalents suffisamment bon marché pour être achetés en grand nombre."
 USA_screen_hull_medium_4: "LCS de classe d'indépendance"
 USA_screen_hull_medium_4_desc: "La classe Independence est une classe de navires de combat côtiers construits pour la marine américaine."
 
 USA_screen_hull_heavy_0: "Classe Allen M. Sumner"
 USA_screen_hull_heavy_0_desc: "La classe Allen M. Sumner était un groupe de 58 destroyers construits par les États-Unis pendant la Seconde Guerre mondiale. Douze autres navires ont été achevés comme destroyers poseurs de mines. La classe porte le nom d'Allen Melancthon Sumner, un officier du Corps des Marines des États-Unis."
 USA_screen_hull_heavy_1: "Classe Charles F.Adams"
 USA_screen_hull_heavy_1_desc: "La classe Charles F. Adams est une classe de navires de 29 destroyers lance-missiles (DDG) construits entre 1958 et 1967. Vingt-trois ont été construits pour la marine américaine, trois pour la marine royale australienne et trois pour la Bundesmarine ouest-allemande. La conception de ces navires (connue sous le nom de projet SCB 155) était basée sur celle des destroyers de classe Forrest Sherman, mais la classe Charles F. Adams était la première classe conçue pour servir de destroyers lance-missiles."
 USA_screen_hull_heavy_2: "Classe Spruce"
 USA_screen_hull_heavy_2_desc: "Le destroyer de classe Spruance a été développé par les États-Unis pour remplacer les nombreux destroyers de classe Allen M. Sumner et Gearing construits pendant la Seconde Guerre mondiale, et a été le principal destroyer construit pour la marine américaine dans les années 1970 et 1980. Il a été nommé en l'honneur de l'amiral de la marine américaine Raymond A. Spruance, qui a mené avec succès d'importantes batailles navales sur le théâtre Asie-Pacifique pendant la Seconde Guerre mondiale, telles que la bataille de Midway et la bataille de la mer des Philippines."
 USA_screen_hull_heavy_3: "Vol I de classe Arleigh Burke"
 USA_screen_hull_heavy_3_desc: "La classe Arleigh Burke de destroyers à missiles guidés (DDG) est une classe de destroyers de la marine américaine construite autour du système de combat Aegis et du radar à réseau passif multifonctionnel à balayage électronique SPY-1D. La classe porte le nom de l'amiral Arleigh Burke, officier de destroyer américain pendant la Seconde Guerre mondiale, puis chef des opérations navales. Le navire de tête, l'USS Arleigh Burke, a été mis en service du vivant de l'amiral Burke."
 USA_screen_hull_heavy_4: "Vol II de classe Arleigh Burke"
 USA_screen_hull_heavy_4_desc: "La classe Arleigh Burke de destroyers à missiles guidés (DDG) est une classe de destroyers de la marine américaine construite autour du système de combat Aegis et du radar à réseau passif multifonctionnel à balayage électronique SPY-1D. La classe porte le nom de l'amiral Arleigh Burke, officier de destroyer américain pendant la Seconde Guerre mondiale, puis chef des opérations navales. Le navire de tête, l'USS Arleigh Burke, a été mis en service du vivant de l'amiral Burke."
 
 USA_battle_hull_light_0: "Classe Cleveland"
 USA_battle_hull_light_0_desc: "La classe Cleveland était un groupe de croiseurs légers construits pour la marine américaine pendant la Seconde Guerre mondiale. Il s'agissait de la classe de croiseurs légers la plus nombreuse jamais construite."
 USA_battle_hull_light_1: "Cours de longue plage"
 USA_battle_hull_light_1_desc: "L'USS Long Beach (CLGN-160/CGN-160/CGN-9) était un croiseur lance-missiles à propulsion nucléaire de la marine américaine et le premier avion de combat de surface à propulsion nucléaire au monde. Il s'agissait du troisième navire de la Marine portant le nom de la ville de Long Beach, en Californie."
 USA_battle_hull_light_2: "Classe Belknap"
 USA_battle_hull_light_2_desc: "Le croiseur de classe Belknap était une classe de croiseurs lance-missiles à une extrémité (leur armement de missiles était installé uniquement à l'avant, contrairement aux croiseurs lance-missiles « à double extrémité » avec un armement de missiles installé à l'avant et à l'arrière) construits pour la marine américaine dans les années 1960. "
 USA_battle_hull_light_3: "Vol I de classe Ticonderoga"
 USA_battle_hull_light_3_desc: "La classe Ticonderoga de croiseurs lance-missiles est une classe de navires de guerre de la marine américaine, commandée et autorisée pour la première fois au cours de l'exercice 1978. La classe utilise un radar passif à réseau phasé et était initialement conçue comme une classe de destroyers. Cependant, la capacité de combat accrue offerte par le système de combat Aegis et le système radar AN/SPY-1, ainsi que la capacité de fonctionner comme un vaisseau amiral."
 USA_battle_hull_light_4: "Vol II de classe Ticonderoga"
 USA_battle_hull_light_4_desc: "La classe Ticonderoga de croiseurs lance-missiles est une classe de navires de guerre de la marine américaine, commandée et autorisée pour la première fois au cours de l'exercice 1978. La classe utilise un radar passif à réseau phasé et était initialement conçue comme une classe de destroyers. Cependant, la capacité de combat accrue offerte par le système de combat Aegis et le système radar AN/SPY-1, ainsi que la capacité de fonctionner comme un vaisseau amiral."
 