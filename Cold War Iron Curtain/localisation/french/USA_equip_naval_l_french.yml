l_french:
 USA_battle_hull_medium_0:0 "Classe Iowa"
 USA_battle_hull_medium_1:0 "Réaménagement de la classe Iowa I"
 USA_battle_hull_medium_2:0 "Réaménagement de la classe Iowa II"
 USA_battle_hull_medium_3:0 "Programme Cruiser Baseline"
 USA_battle_hull_medium_4:0 "Classe Zumwalt"
 USA_battle_hull_medium_0_desc:0 "Une coque de cuirassé plus avancée de la fin de la Seconde Guerre mondiale, ces navires sont rapides et assez agiles pour leur taille, avec un excellent armement pour leur époque et le potentiel d'être mis à niveau avec de nouveaux équipements presque indéfiniment."
 USA_battle_hull_medium_1_desc:0 "Un grand croiseur ou croiseur de bataille de l'époque de la Guerre froide, doté d'un armement varié. Certains sont encore équipés de canons de gros calibre d'antan, d'autres de missiles navire-air et navire-surface, très prometteurs."
 USA_battle_hull_medium_2_desc:0 "Un croiseur guidé de grande taille ou un croiseur de bataille de l'époque de la guerre froide, équipé d'une variété de systèmes d'armes pour des engagements de missiles navire-navire, navire-surface ou navire-air."
 USA_battle_hull_medium_3_desc:0 "Un croiseur guidé de grande taille ou un croiseur de combat de l'époque de la guerre froide avec un espace pour les moyens d'aviation à partir duquel opérer ainsi qu'un large assortiment mortel de systèmes de missiles spécifiques à la mission."
 USA_battle_hull_medium_4_desc:0 "Un croiseur lance-missiles moderne ou un croiseur de combat équipé des dernières technologies en matière de systèmes de missiles ou des premières technologies de canons à rails peut frapper au-delà de l'horizon comme aucun autre navire avant lui."
 USA_carrier_hull_0:0 "Classe Midway"
 USA_carrier_hull_1:0 "Classe Forrestal"
 USA_carrier_hull_2:0 "Réaménagement de la classe Midway II"
 USA_carrier_hull_3:0 "Programme de porte-avions moyens"
 USA_carrier_hull_4:0 "Programme Sea Control Ship"
 USA_carrier_hull_0_desc:0 "Les navires de classe CVB-41 (alors sans nom) furent initialement conçus en 1940 dans le cadre d'une étude visant à déterminer l'effet de l'intégration d'un pont d'envol blindé sur un porte-avions de la taille de la classe Essex. Les calculs qui en résultèrent montrèrent que l'effet serait une réduction de la taille du groupe aérien : le navire ainsi conçu aurait un groupe aérien de 64 hommes, contre 90 à 100 pour les porte-avions standard de la classe Essex. Au fil de sa conception, l'expérience des porte-avions blindés de la Royal Navy en temps de guerre influença fortement la conception."
 USA_carrier_hull_1_desc:0 "Les porte-avions de classe Forrestal étaient quatre porte-avions conçus et construits pour la marine américaine dans les années 1950. Ce navire a été nommé en l'honneur de James Forrestal, premier secrétaire à la Défense des États-Unis. Il s'agissait de la première classe de superporte-avions, combinant un tonnage élevé, des ascenseurs en bord de pont et un pont incliné. Le premier navire a été mis en service en 1955, le dernier a été désarmé en 1998."
 USA_carrier_hull_2_desc:0 "Une rénovation des porte-avions de classe Midway. À l'origine, seul l'USS Midway avait bénéficié d'un vaste programme de modernisation et de reconstruction, qui s'est avéré controversé et coûteux, et n'a donc pas été reproduit sur les autres navires."
 USA_carrier_hull_3_desc:0 "Le porte-avions moyen (CVV) était un projet américain de porte-avions à propulsion conventionnelle (c'est-à-dire non nucléaire) proposé dans les années 1970. Il devait être plus petit et moins cher que les porte-avions nucléaires contemporains de classe Nimitz. Un seul exemplaire était prévu, mais n'a pas été construit ; d'autres porte-avions de classe Nimitz ont été construits à la place."
 USA_carrier_hull_4_desc:0 "Le Sea Control Ship (SCS) était un porte-avions développé et conceptualisé par la marine américaine sous la direction du chef des opérations navales Elmo Zumwalt dans les années 1970. Aujourd'hui, ce terme désigne des navires de guerre capables d'accomplir des missions similaires. Le SCS était destiné à servir de navire d'escorte, fournissant un soutien aérien aux convois. Il a été supprimé suite aux coupes budgétaires de la marine américaine."
 USA_carrier_hull_light_0:0 "Classe d'indépendance"
 USA_carrier_hull_light_1:0 "Classe Iwo Jima"
 USA_carrier_hull_light_2:0 "Classe Tarawa"
 USA_carrier_hull_light_3:0 "Classe Guêpe"
 USA_carrier_hull_light_4:0 "Classe Amérique"
 USA_carrier_hull_light_0_desc:0 "Les porte-avions de classe Independence étaient une classe de porte-avions légers construits pour la marine américaine qui ont servi pendant la Seconde Guerre mondiale."
 USA_carrier_hull_light_1_desc:0 "Les navires d'assaut amphibies de classe Iwo Jima de la marine américaine ont été les premiers navires d'assaut amphibies conçus et construits comme porte-hélicoptères dédiés, capables d'exploiter jusqu'à 20 hélicoptères pour transporter jusqu'à 1 800 marines à terre."
 USA_carrier_hull_light_2_desc:0 "La classe Tarawa est une classe de navires d'assaut amphibies de type LHA (Landing Helicopter Assault) exploitée par la marine américaine. Cinq navires ont été construits par Ingalls Shipbuilding entre 1971 et 1980 ; quatre autres étaient prévus, mais annulés par la suite ; ils ont été rejoints par les navires d'assaut amphibies de classe Wasp."
 USA_carrier_hull_light_3_desc:0 "La classe Wasp est une classe de navires d'assaut amphibies de débarquement d'hélicoptères (LHD) exploités par la marine américaine. Basée sur la classe Tarawa, elle a été modifiée pour permettre l'utilisation d'avions et de péniches de débarquement plus sophistiqués."
 USA_carrier_hull_light_4_desc:0 "La classe America (anciennement classe LHA(R)) est une classe de navires d'assaut amphibies de type LHA (débarquement par hélicoptère d'assaut) de la marine américaine (USN). Elle est conçue pour débarquer une unité expéditionnaire des Marines à l'aide d'hélicoptères et d'avions de transport V/STOL MV-22B Osprey, appuyés par des AV-8B Harrier II ou des F-35 Lightning II V/STOL et divers hélicoptères d'attaque."
 USA_carrier_hull_super_1:0 "Classe Kitty Hawk"
 USA_carrier_hull_super_2:0 "Classe Nimitz"
 USA_carrier_hull_super_3:0 "Classe Théodore Roosevelt"
 USA_carrier_hull_super_4:0 "Classe Ronald Reagan"
 USA_carrier_hull_super_1_desc:0 "L'introduction de l'ère nucléaire et l'adoption de réacteurs navalisés plus petits permettent à ces grands navires non seulement de transporter de grandes escadres aériennes, mais aussi de rester en mer presque indéfiniment."
 USA_carrier_hull_super_2_desc:0 "Une conception de super porte-avions mise à jour avec des réacteurs plus efficaces et la capacité de transporter encore plus d'avions."
 USA_carrier_hull_super_3_desc:0 "Une conception avancée de super porte-avions de la fin de la guerre froide avec un complément massif d'avions et des réacteurs améliorés."
 USA_carrier_hull_super_4_desc:0 "Une conception de super porte-avions moderne avec des réacteurs encore améliorés, un complément massif d'avions et la capacité de les lancer rapidement et efficacement en utilisant des catapultes améliorées."
 USA_sub_hull_small_single_0:0 "Classe Darter"
 USA_sub_hull_small_single_0_desc:0 "L'USS Darter (SS-576), un sous-marin unique basé sur la classe Tang, mais incorporant de nombreuses améliorations, fut le deuxième navire de la marine américaine à porter le nom du darter, un type de petit poisson d'eau douce américain."
 USA_sub_hull_small_single_1:0 "Classe Barbel"
 USA_sub_hull_small_single_1_desc:0 "Les sous-marins de classe Barbel, derniers sous-marins d'attaque à propulsion diesel-électrique construits par la marine américaine, intégraient de nombreuses améliorations techniques radicales par rapport aux classes précédentes. Ils furent les premiers navires de guerre de série dotés de la coque en forme de goutte d'eau, testée pour la première fois sur l'USS Albacore expérimental (AGSS-569), et les premiers à réunir la salle de contrôle, le centre d'attaque et la tourelle de commandement dans un même espace de la coque."
 USA_sub_hull_small_single_2:0 "Classe Esturgeon"
 USA_sub_hull_small_single_2_desc:0 "La classe Sturgeon (connue familièrement dans les cercles navals sous le nom de classe 637) était une classe de sous-marins d'attaque rapides à propulsion nucléaire (SSN) en service dans la marine américaine des années 1960 jusqu'en 2004. Ils étaient les « chevaux de bataille » de la flotte de sous-marins d'attaque de la marine pendant une grande partie de la guerre froide."
 USA_sub_hull_small_single_3:0 "Classe Loup de mer"
 USA_sub_hull_small_single_3_desc:0 "La classe Seawolf est une classe de sous-marins nucléaires d'attaque rapide (SNA) en service dans la marine américaine. Elle était destinée à succéder à la classe Los Angeles, et les travaux de conception ont débuté en 1983."
 USA_sub_hull_small_single_4:0 "Classe Virginie"
 USA_sub_hull_small_single_4_desc:0 "La classe Virginia, également connue sous le nom de classe SSN-774, est une classe de sous-marins nucléaires d'attaque rapide lanceurs de missiles de croisière, en service dans la marine américaine. Conçue par General Dynamics Electric Boat (EB) et Huntington Ingalls Industries, la classe Virginia est le dernier modèle de sous-marin de la marine américaine, intégrant les dernières technologies en matière de furtivité, de collecte de renseignements et de systèmes d'armes."
 USA_sub_hull_large_single_0:0 "Classe Tench"
 USA_sub_hull_large_single_0_desc:0 "Les sous-marins de classe Tench étaient un type de sous-marin construit pour la marine américaine (USN) entre 1944 et 1951. Ils constituaient une amélioration par rapport aux classes Gato et Balao, seulement 35 à 40 tonnes plus grandes, mais plus robustes et avec une disposition interne légèrement améliorée."
 USA_sub_hull_large_single_1:0 "Classe Skate"
 USA_sub_hull_large_single_1_desc:0 "Les sous-marins de classe Skate furent la première série de sous-marins nucléaires de la marine américaine. Ils constituaient une évolution de la classe Tang en tous points, à l'exception de leurs systèmes de propulsion, basés sur le prototype opérationnel de l'USS Nautilus. Les quatre sous-marins de classe Skate réintroduisirent des tubes lance-torpilles à l'arrière."
 USA_sub_hull_large_single_2:0 "Classe Skipjack"
 USA_sub_hull_large_single_2_desc:0 "La classe Skipjack était une classe de sous-marins nucléaires (SNA) de la marine américaine entrée en service entre 1959 et 1961. Elle doit son nom à son navire de tête, l'USS Skipjack. Cette nouvelle classe introduisit la coque en forme de larme et le réacteur S5W sur les sous-marins nucléaires américains."
 USA_sub_hull_large_single_3:0 "Classe Los Angeles Flight I"
 USA_sub_hull_large_single_3_desc:0 "La classe Los Angeles est un sous-marin nucléaire d'attaque rapide (SNA) en service dans la marine américaine. Également connue sous le nom de classe 688 (prononcé « six-quatre-vingt-huit »), d'après le numéro de coque du navire de tête, l'USS Los Angeles (SSN-688), 62 exemplaires ont été construits entre 1972 et 1996, dont 23 au standard 688i amélioré."
 USA_sub_hull_large_single_4:0 "Classe Los Angeles Flight II"
 USA_sub_hull_large_single_4_desc:0 "La classe Los Angeles est un sous-marin nucléaire d'attaque rapide (SNA) en service dans la marine américaine. Également connue sous le nom de classe 688 (prononcé « six-quatre-vingt-huit »), d'après le numéro de coque du navire de tête, l'USS Los Angeles (SSN-688), 62 exemplaires ont été construits entre 1972 et 1996, dont 23 au standard 688i amélioré."
 USA_sub_hull_large_double_0:0 "Classe Grayback"
 USA_sub_hull_large_double_0_desc:0 "Les sous-marins de classe Grayback étaient une classe de deux sous-marins lance-missiles de la marine américaine. Ils emportaient les missiles de croisière nucléaires Regulus I et Regulus II, déployés de 1957 à 1964, rapidement remplacés par les missiles balistiques sous-marins Polaris (SLBM)."
 USA_sub_hull_large_double_1:0 "Classe George Washington"
 USA_sub_hull_large_double_1_desc:0 "La classe George Washington était une classe de sous-marins nucléaires lanceurs d'engins déployés par la marine américaine. Le George Washington, avec les classes Ethan Allen, Lafayette, James Madison et Benjamin Franklin, formait le groupe de sous-marins « 41 pour la liberté », principale contribution de la marine à la force de dissuasion nucléaire jusqu'à la fin des années 1980."
 USA_sub_hull_large_double_2:0 "Classe Ohio"
 USA_sub_hull_large_double_2_desc:0 "La classe Ohio de sous-marins nucléaires comprend les 14 sous-marins lanceurs d'engins (SNLE) et les quatre sous-marins lanceurs de missiles de croisière (SNLE) de la marine américaine. Avec un déplacement de 18 750 tonnes chacun en plongée, les sous-marins de la classe Ohio sont les plus grands sous-marins jamais construits pour la marine américaine. Ils se classent au troisième rang mondial."
 USA_sub_hull_large_double_3:0 "Classe Colombie"
 USA_sub_hull_large_double_3_desc:0 "Le sous-marin de classe Columbia, anciennement connu sous le nom de sous-marin de remplacement Ohio et de futur sous-marin de suivi SSBN-X, est une future classe de sous-marins nucléaires conçus pour remplacer les sous-marins lanceurs d'engins balistiques de classe Ohio dans la marine américaine."
 USA_screen_hull_medium_0:0 "Classe John C. Butler"
 USA_screen_hull_medium_0_desc:0 "La classe John C. Butler était composée de destroyers d'escorte apparus pendant la Seconde Guerre mondiale. Le navire de tête était l'USS John C. Butler, mis en service le 31 mars 1944."
 USA_screen_hull_medium_1:0 "Classe Bronstein"
 USA_screen_hull_medium_1_desc:0 "Les frégates de classe Bronstein étaient des navires de guerre de la marine américaine, initialement prévus comme escorteurs océaniques (anciennement appelés escorteurs de destroyers), mais ont tous été redésignés comme frégates le 30 juin 1975 lors de la reclassification des navires de la marine américaine de 1975 et leur désignation de coque est passée de DE à FF."
 USA_screen_hull_medium_2:0 "Classe Knox"
 USA_screen_hull_medium_2_desc:0 "Les 46 frégates de classe Knox étaient les plus grandes, les dernières et les plus nombreuses des escorteurs de lutte anti-sous-marine (ASM) de deuxième génération de l'US Navy. Initialement conçues comme escorteurs océaniques (anciennement appelés escorteurs destroyers), elles furent toutes rebaptisées frégates le 30 juin 1975, lors du plan de reclassification des navires de 1975, et leur coque fut rebaptisée « DE » en « FF ». La classe Knox fut le dernier destroyer de la Navy équipé d'un moteur à turbine à vapeur."
 USA_screen_hull_medium_3:0 "Classe Oliver Hazard Perry"
 USA_screen_hull_medium_3_desc:0 "La classe Oliver Hazard Perry est une classe de frégates lance-missiles nommée en l'honneur du commodore américain Oliver Hazard Perry, héros de la bataille navale du lac Érié. Également connues sous le nom de classe Perry ou FFG-7 (communément appelée « fig sept »), ces navires de guerre ont été conçus aux États-Unis au milieu des années 1970 comme des navires d'escorte polyvalents, suffisamment bon marché pour être achetés en grand nombre."
 USA_screen_hull_medium_4:0 "Classe Indépendance LCS"
 USA_screen_hull_medium_4_desc:0 "La classe Independence est une classe de navires de combat littoraux construits pour la marine américaine."
 USA_screen_hull_heavy_0:0 "Classe Allen M. Sumner"
 USA_screen_hull_heavy_0_desc:0 "La classe Allen M. Sumner était un groupe de 58 destroyers construits par les États-Unis pendant la Seconde Guerre mondiale. Douze autres navires furent construits comme destroyers mouilleurs de mines. La classe doit son nom à Allen Melancthon Sumner, officier du Corps des Marines des États-Unis."
 USA_screen_hull_heavy_1:0 "Classe Charles F. Adams"
 USA_screen_hull_heavy_1_desc:0 "La classe Charles F. Adams est une classe de 29 destroyers lance-missiles (DDG) construits entre 1958 et 1967. Vingt-trois ont été construits pour la marine américaine, trois pour la marine royale australienne et trois pour la Bundesmarine ouest-allemande. La conception de ces navires (connue sous le nom de projet SCB 155) s'inspirait de celle des destroyers de la classe Forrest Sherman, mais la classe Charles F. Adams fut la première à être conçue comme destroyer lance-missiles."
 USA_screen_hull_heavy_2:0 "Classe Spruance"
 USA_screen_hull_heavy_2_desc:0 "Le destroyer de classe Spruance a été développé par les États-Unis pour remplacer les nombreux destroyers de classe Allen M. Sumner et Gearing construits pendant la Seconde Guerre mondiale, et a été le principal destroyer construit pour la marine américaine dans les années 1970 et 1980. Il a été nommé en l'honneur de l'amiral de la marine américaine Raymond A. Spruance, qui a mené avec succès des batailles navales majeures dans le théâtre Asie-Pacifique pendant la Seconde Guerre mondiale, telles que la bataille de Midway et la bataille de la mer des Philippines."
 USA_screen_hull_heavy_3:0 "Classe Arleigh Burke Flight I"
 USA_screen_hull_heavy_3_desc:0 "La classe Arleigh Burke, composée de destroyers lance-missiles (DDG), est une classe de destroyers de la marine américaine construite autour du système de combat Aegis et du radar passif multifonction à balayage électronique SPY-1D. Elle doit son nom à l'amiral Arleigh Burke, officier de destroyer américain pendant la Seconde Guerre mondiale, devenu plus tard chef des opérations navales. Le navire de tête, l'USS Arleigh Burke, a été mis en service du vivant de l'amiral Burke."
 USA_screen_hull_heavy_4:0 "Classe Arleigh Burke Flight II"
 USA_screen_hull_heavy_4_desc:0 "La classe Arleigh Burke, composée de destroyers lance-missiles (DDG), est une classe de destroyers de la marine américaine construite autour du système de combat Aegis et du radar passif multifonction à balayage électronique SPY-1D. Elle doit son nom à l'amiral Arleigh Burke, officier de destroyer américain pendant la Seconde Guerre mondiale, devenu plus tard chef des opérations navales. Le navire de tête, l'USS Arleigh Burke, a été mis en service du vivant de l'amiral Burke."
 USA_battle_hull_light_0:0 "Classe Cleveland"
 USA_battle_hull_light_0_desc:0 "La classe Cleveland était un groupe de croiseurs légers construits pour l'US Navy pendant la Seconde Guerre mondiale. Il s'agissait de la classe de croiseurs légers la plus nombreuse jamais construite."
 USA_battle_hull_light_1:0 "Classe de Long Beach"
 USA_battle_hull_light_1_desc:0 "L'USS Long Beach (CLGN-160/CGN-160/CGN-9) était un croiseur lance-missiles à propulsion nucléaire de la marine américaine et le premier navire de combat de surface à propulsion nucléaire au monde. Il fut le troisième navire de la marine à porter le nom de la ville de Long Beach, en Californie."
 USA_battle_hull_light_2:0 "Classe Belknap"
 USA_battle_hull_light_2_desc:0 "Le croiseur de classe Belknap était une classe de croiseurs lance-missiles à une seule extrémité (leur armement de missiles était installé uniquement à l'avant, contrairement aux croiseurs lance-missiles « à double extrémité » avec armement de missiles installé à l'avant et à l'arrière) construits pour la marine américaine dans les années 1960."
 USA_battle_hull_light_3:0 "Classe Ticonderoga Flight I"
 USA_battle_hull_light_3_desc:0 "La classe Ticonderoga, composée de croiseurs lance-missiles, est une classe de navires de guerre de la marine américaine, commandée et autorisée pour la première fois au cours de l'exercice 1978. Utilisant un radar passif à réseau phasé, elle était initialement prévue comme classe de destroyers. Cependant, les capacités de combat accrues offertes par le système de combat Aegis et le système radar AN/SPY-1, ainsi que la possibilité d'opérer comme navire amiral, ont été améliorées."
 USA_battle_hull_light_4:0 "Classe Ticonderoga Flight II"
 USA_battle_hull_light_4_desc:0 "La classe Ticonderoga, composée de croiseurs lance-missiles, est une classe de navires de guerre de la marine américaine, commandée et autorisée pour la première fois au cours de l'exercice 1978. Utilisant un radar passif à réseau phasé, elle était initialement prévue comme classe de destroyers. Cependant, les capacités de combat accrues offertes par le système de combat Aegis et le système radar AN/SPY-1, ainsi que la possibilité d'opérer comme navire amiral, ont été améliorées."