 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_OFFER_JOIN_FACTION:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! l'offre de rejoindre notre faction.\n\nNous sommes solidaires."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_OFFER_JOIN_FACTION:2 "Refus de rejoindre une faction"
