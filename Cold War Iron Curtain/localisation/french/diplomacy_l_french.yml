 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_JOIN_FACTION:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! notre demande de rejoindre leur faction.\n\nNous sommes solidaires."
