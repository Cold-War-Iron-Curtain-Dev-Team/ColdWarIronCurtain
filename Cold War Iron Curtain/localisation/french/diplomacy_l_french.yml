 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_CREATE_FACTION:1 "\n§Y$COUNTRY|U$§! a §Rrefusé§! l'offre de nous rejoindre dans une nouvelle faction.\n\nIl faudra chercher des alliés ailleurs."
