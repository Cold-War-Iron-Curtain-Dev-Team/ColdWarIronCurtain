 AI_MESSAGE_CAT1_MES8: "Hé $OTHER$, tu devrais peut-être essayer de riposter la prochaine fois ? Parce que si c'était le cas, cela ne s'est certainement pas montré !"
 AI_MESSAGE_CAT1_MES9: "Pourquoi $OTHER$ pleure-t-il ? Parce qu'ils viennent de se faire tremper !"
 AI_MESSAGE_CAT1_MES10: "Bien sûr, c'est agréable d'étirer mon espace vital, n'est-ce pas, $OTHER$?"
 AI_MESSAGE_CAT2_MES1: "Je vais foutre le bordel dans ton krieg, $OTHER$!"
 AI_MESSAGE_CAT2_MES2: "Bientôt, tout le monde en $OTHER$ parlera $US_ADJ$."
 AI_MESSAGE_CAT2_MES3: "Regardez ce gommage $OTHER_ADJ$ essayant de battre mes troupes supérieures $US_ADJ$. Ce serait drôle si ce n'était pas si triste !"
 AI_MESSAGE_CAT2_MES4: "Vous appelez cela une guerre, $OTHER$? J'appelle ça un jeu d'enfant."
 AI_MESSAGE_CAT2_MES5: "Assurez-vous de garder ces usines $OTHER_ADJ$ bien entretenues, je les utiliserai bientôt !"
 AI_MESSAGE_CAT2_MES6: "Écoutez ça, $OTHER$? C'est ce qui montre à quel point je te possède en ce moment."
 AI_MESSAGE_CAT2_MES7: "Hé $OTHER$, peut-être que tu ne t'en sortirais pas si mal si tu arrêtais de fuir et essayais réellement de te battre ?"
 AI_MESSAGE_CAT2_MES8: "MDR, regarde $COUNTRY$ essayant de me combattre ! C'est comme si quelqu'un mettait un furet dans le coma à la tête d'une armée !"
 AI_MESSAGE_CAT2_MES9: "La vue est vraiment belle à $COUNTRY$ à cette période de l'année. Mes armées en profitent vraiment !"
 AI_MESSAGE_CAT2_MES10: "Frappez déjà la reddition, $COUNTRY$! Vous me faites vraiment perdre mon temps ici."
 AI_MESSAGE_CAT3_MES1:1 "$OTHER|U$ est un hacker ! Pas question qu'ils me battent légitimement !"
 AI_MESSAGE_CAT3_MES2: "Ce jeu est tellement déséquilibré ! Les Space Marines $OTHER_ADJ$ sont impossibles à battre tandis que les troupes $US_ADJ$ ne sont que du papier mouillé."
 AI_MESSAGE_CAT3_MES3: "Heh, comme si je n'avais pas de meilleure chose à faire que de jouer à ce jeu stupide de toute façon."
 AI_MESSAGE_CAT3_MES4: "Je n'aurais pas perdu contre $OTHER$ si Paradox ne l'avait pas explicitement codé pour que mes alliés soient plus bêtes que deux tonnes de granit tandis que l'ennemi a une précognition littérale !"
 AI_MESSAGE_CAT3_MES5: "ffaSJLgapigjaslgmag s asv lajvlvSCREW YOU $OTHER$ JE NE JOUE PLUS JAMAIS AVEC TOI !!!1"
 AI_MESSAGE_CAT3_MES6: "gg $OTHER$ la prochaine fois, tu pourras peut-être essayer d'en faire un combat équitable ?"
 AI_MESSAGE_CAT3_MES7: "Wow, cette mécanique de jeu m'a complètement foutu en l'air. Pas étonnant que j'ai perdu contre $OTHER$."
 AI_MESSAGE_CAT3_MES8: "OUAH! PEUT-ÊTRE que s'ils n'avaient pas été COMPLÈTEMENT DÉSÉQUILIBRÉ $OTHER$ DANS LE DERNIER PATCH, cela aurait en fait été une guerre équitable !"
 AI_MESSAGE_CAT3_MES9: "C'est pourquoi Hearts of Iron 3 était un meilleur jeu, dans HOI3 $OTHER$ n'aurait jamais pu me battre d'une manière aussi ludique :"
 AI_MESSAGE_CAT3_MES10: "Ouais, donc le RNG a complètement perdu cette guerre avec $OTHER$ pour moi. Dommage que l'habileté ne veut rien dire dans ce jeu."
