 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_MILACC: "\nNotre demande d'accès militaire a été §Gacceptée§! par §Y$COUNTRY$§!.\n\nNous pouvons désormais déplacer des troupes à l'intérieur de leurs frontières."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_MILACC:2 "Accès militaire refusé"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_MILACC:1 "\n§Y$COUNTRY|U$§! a §Rrefusé§! notre demande d'accès militaire !"
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_CALL_ALLY:2 "Appel à la guerre accepté"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_CALL_ALLY:1 "\n§Y$COUNTRY|U$§! §Ga accepté§! l'appel pour qu'ils rejoignent notre guerre.\n\nNous sommes solidaires."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_CALL_ALLY:2 "Refus de rejoindre notre guerre"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_CALL_ALLY:1 "\n§Y$COUNTRY|U$§! a §Rrefusé§! notre appel à leur participation à notre guerre.\n\nIls ne nous soutiendront pas dans ce conflit."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_JOIN_ALLY:2 "Nous avons rejoint la guerre"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_JOIN_ALLY:1 "§Y$COUNTRY|U$§! a §Gaccepté§! notre offre de soutien dans leur guerre en cours.\n\nNous luttons désormais à leurs côtés."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_JOIN_ALLY:2 "Refus de co-belligérance"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_JOIN_ALLY: "\nMalgré leur besoin désespéré de notre aide, §Y$COUNTRY$§! a §Rrefusé§! notre demande de rejoindre leur guerre."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_NONAGGRESSIONPACT:2 "Pacte de non-agression signé"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_NONAGGRESSIONPACT:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! notre demande de pacte de non-agression.\n\nIl n'y aura pas de guerre entre nos pays."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_NONAGGRESSIONPACT:2 "Le pacte de non-agression rejeté"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_NONAGGRESSIONPACT: "\nNotre offre de conclure un pacte de non-agression a été refusée §Rpar§! par §Y$COUNTRY$§!.\n\nCela ne peut que signifier qu'ils planifient leur attaque."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_CREATE_FACTION:2 "Faction formée"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_CREATE_FACTION:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! l'offre de rejoindre notre nouvelle faction.\n\nPour leur bien et pour le nôtre, nous les conduisons vers l'avenir."
