 GDR_First_Secretary_Schirdewan: "Premier secrétaire Schirdewan"
 GDR_First_Secretary_Schirdewan_desc: "Karl Schirdewan a réussi à ravir la direction de la RDA à Walter Ulbricht ; il est temps de le reconnaître officiellement comme notre nouveau Premier Secrétaire."
 GDR_Ending_the_New_Inquisition: "Mettre fin à la nouvelle Inquisition"
 GDR_Ending_the_New_Inquisition_desc: "Le gouvernement Ulbricht s'est forgé une réputation pour ses purges trop zélées. Il est clair que nous devons limiter notre recours à cette tactique afin de rassurer la population."
 GDR_Launch_A_Campaign_Against_Political_Decadence: "Campagne contre la décadence politique"
 GDR_Launch_A_Campaign_Against_Political_Decadence_desc: "La décadence affichée par la classe politique est indigne du système socialiste ! Cela doit être rectifié."
 GDR_Eliminate_the_Personality_Cult: "Éliminer le culte de la personnalité"
 GDR_Eliminate_the_Personality_Cult_desc: "Ulbricht a consacré des années et des ressources à construire autour de lui un culte absurde de la personnalité, nous ferions mieux de le démanteler avant que les choses ne deviennent incontrôlables."
 GDR_Investigate_Political_Corruption: "Enquêter sur la corruption politique"
 GDR_Investigate_Political_Corruption_desc: "Les preuves de corruption au sein du Parti ne peuvent plus être ignorées. Ceux qui veulent s'enrichir doivent trouver leur avenir en RDA."
 GDR_Purge_The_Red_Guillotine: "Purger la guillotine rouge"
 GDR_Purge_The_Red_Guillotine_desc: "Hilde Benjamin est hors de contrôle et hors de contrôle. Nous n'avons d'autre choix que de la purger du Parti."
 GDR_Produce_Anti_Emmigration_Propaganda: "Produire de la propagande anti-émigration"
 GDR_Produce_Anti_Emmigration_Propaganda_desc: "La propagande occidentale pousse une grande partie de notre main-d'oeuvre à émigrer vers notre homologue capitaliste. Avant d'envisager des solutions plus extrêmes, peut-être pourrions-nous contrer leurs efforts par notre propre campagne de propagande ?"
 GDR_Purge_Ulbricht_and_Hoenecker: "Purger Ulbricht et Hoenecker"
 GDR_Purge_Ulbricht_and_Hoenecker_desc: "Maintenir Ulbricht et Hoenecker dans le Parti est un risque que nous ne pouvons tout simplement pas nous permettre. Ils doivent partir."
 GDR_Reform_the_Stasi: "Réformer la Stasi"
 GDR_Reform_the_Stasi_desc: "La Stasi a fonctionné d'une manière qui ne convient pas à la façon dont un appareil de sécurité d'État respectable devrait fonctionner. Une réforme est nécessaire."
 GDR_Loosen_Political_Censorship: "Assouplir la censure politique"
 GDR_Loosen_Political_Censorship_desc: "Nous pouvons autoriser un certain degré de pluralité socialiste au sein du gouvernement."
 GDR_Reverse_Work_Quota_Policies: "Inverser les politiques de quotas de travail"
 GDR_Reverse_Work_Quota_Policies_desc: "Les quotas de travail poussent nos travailleurs à l'épuisement et, dans certains cas, à la dissidence. Nous pouvons nous permettre de les assouplir dans l'intérêt de la stabilité."
 GDR_Invest_in_Modernizing_Landwirtschaftliche_Produktionsgenossenschaft_Machinery: "Moderniser les coopératives de production agricole"
 GDR_Invest_in_Modernizing_Landwirtschaftliche_Produktionsgenossenschaft_Machinery_desc: "Les Coopératives ont besoin de nouveaux outils pour augmenter la production alimentaire, fournissons-leur un investissement."
 GDR_Allow_Greater_Intelligentsia_Freedoms: "Permettre de plus grandes libertés à l'intelligentsia"
 GDR_Allow_Greater_Intelligentsia_Freedoms_desc: "L'intelligentsia peut constituer un atout puissant lorsqu'elle est correctement exploitée. Nous leur accorderons certaines libertés, à condition qu'ils suivent la ligne du parti."
 GDR_Responding_to_the_Platform_for_the_Special_German_Route_to_Socialism: "Répondre à la voie spéciale allemande vers le socialisme"
 GDR_Responding_to_the_Platform_for_the_Special_German_Route_to_Socialism_desc: "Wolfgang Harich a présenté une proposition qui, selon lui, conduira l'Allemagne sur la bonne voie du socialisme. Il est temps de répondre à ses idées."
 GDR_Further_Reform_the_Politurbo: "Poursuivre la réforme du Politurbo"
 GDR_Further_Reform_the_Politurbo_desc: "Nos réformes ont apporté de bons résultats au Parti et au pays, mais il reste encore des améliorations à apporter."
 GDR_Crackdown_on_the_Gruppe_Harich: "Répression contre le Gruppe Harich"
 GDR_Crackdown_on_the_Gruppe_Harich_desc: "Les idées de Harich et de ses partisans sont dangereuses, nous ne pouvons pas leur permettre de les propager davantage."
 GDR_Outreach_to_the_SPD: "Sensibilisation au SPD"
 GDR_Outreach_to_the_SPD_desc: "Le SPD se considère plus modéré que le SED, mais cela ne signifie pas que nous ne pouvons pas travailler ensemble."
 GDR_Resist_Calls_for_Collective_Leadership: "Résistez aux appels au leadership collectif"
 GDR_Resist_Calls_for_Collective_Leadership_desc: "Partager le pouvoir avec d'autres partis qui ne partagent pas nos vues est un pari dangereux que nous ne pouvons pas prendre."
 GDR_Concede_to_Demand_For_Collective_Leadership: "Céder au leadership collectif"
 GDR_Concede_to_Demand_For_Collective_Leadership_desc: "La direction collective est une étape nécessaire vers la construction d'un État socialiste fonctionnel."
 GDR_A_New_SED: "Un nouveau SED"
 GDR_A_New_SED_desc: "Grâce à la réforme et au compromis, nous avons reconstruit le Parti en un modèle à suivre pour tous les socialistes ! Nous mènerons la République démocratique allemande vers un avenir prospère !"
