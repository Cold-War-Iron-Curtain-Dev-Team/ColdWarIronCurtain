 KPA_infantry_equipment_0:0 "Fusil Type 45"
 KPA_infantry_equipment_0_short:0 "Tapez 45"
 KPA_infantry_equipment_0_desc:0 "Le SM-45, ou fusil siamois Mauser Type 45, est un fusil à verrou développé par Koishikawa Arsenal en 1903. Le fusil a été initialement développé dans le cadre du programme de développement militaire du roi Rama V qui a été lancé parce qu'il craignait l'expansion occidentale à l'Est. L'arme elle-même est développée sur la base du Gewehr 98 mais avec quelques améliorations notables en termes de convivialité et d'ergonomie."

 KPA_infantry_equipment_1:0 "Fusil d'assaut type 58"
 KPA_infantry_equipment_1_short:0 "Tapez 58"
 KPA_infantry_equipment_1_desc:0 "Le Type 58 est un fusil d'assaut fabriqué en Corée du Nord dérivé de l'AK-47 soviétique conçu par Mikhaïl Kalachnikov. Il s'agissait de la première arme fabriquée en Corée du Nord aux côtés du PPsh-41, fabriqué sous licence sous le nom de Type 49. Après la guerre de Corée, le président Kim Il-sung a ordonné la fabrication du Type 68. Le fusil d'assaut a été produit pour la première fois en 1958 et a été initialement fabriqué avec des composants russes jusqu'à ce que les Nord-Coréens soient capables de fabriquer le leur. Alors que le Type 58 est basé sur l'AK-47 avec le récepteur fraisé, la différence entre les deux fusils d'assaut est que le premier porte des marques d'identification telles que l'étoile à cinq branches dans un cercle et le Type 58 en hangul. La qualité du fusil dépend de sa construction, qui varie généralement de moyenne à mauvaise."

 KPA_infantry_equipment_2:0 "Fusil d'assaut type 68"
 KPA_infantry_equipment_2_short:0 "Tapez 68"
 KPA_infantry_equipment_2_desc:0 "Le Type 68 est une version nord-coréenne de l'AKM, il a été adopté en 1968 pour remplacer le Type 58. Il s'agit d'une arme à feu sélectif à gaz chambrée pour une cartouche intermédiaire soviétique de 7,62 x 39 mm. En interne, le Type 68 est similaire à l'AK-47. La seule différence est que le Type 68 ne dispose pas de mécanisme de réduction de la cadence de tir. Le Type 68 de base a une crosse en bois massif. Par rapport au Type 58 précédent, la façon dont la fesse est connectée au récepteur a été améliorée. Il y avait aussi un fusil d'assaut de type 68-1 avec une crosse métallique repliable. Le Type 68 est livré avec de simples viseurs en fer. La portée de visée maximale est de 800 mètres, mais la portée de tir efficace est limitée à 300-400 mètres. Bien que le Type 68 ne soit pas aussi précis qu'un fusil d'assaut soviétique AKM amélioré."

 KPA_infantry_equipment_3:0 "Fusil d'assaut type 88"
 KPA_infantry_equipment_3_short:0 "Tapez 88"
 KPA_infantry_equipment_3_desc:0 "Le Type 88 est une arme à feu sélectif fonctionnant au gaz. Son design est similaire à celui de l'AK-74. Il est chambré pour les mêmes munitions soviétiques de 5,45x39 mm. Le fusil d'assaut Type 88 est plus précis que le précédent Type 68, chambré pour un obus soviétique de 7,62 x 39 mm, mais il n'est pas aussi précis que le M16 américain ou la plupart des autres fusils d'assaut occidentaux. Ce fusil d'assaut a été adopté par l'armée nord-coréenne et remplace progressivement le précédent fusil d'assaut Type 68, qui est une copie de l'AK-47. Il a été exporté vers certains pays africains."

 KPA_infantry_equipment_4:0 "Fusil automatique de type OICW"
 KPA_infantry_equipment_4_short:0 "Type OICW"
 KPA_infantry_equipment_4_desc:0 "Une arme d'infanterie inhabituelle à double canon avec une apparence distinctive. Il est calqué sur un fusil d'assaut sud-coréen K11 avec lance-grenades intégré. L'arme nord-coréenne intègre un fusil d'assaut modifié de type 88-2 (un dérivé d'un AK-74 soviétique), de conception tout à fait conventionnelle. Il s'agit d'une arme à gaz, chambrée pour une munition soviétique standard de 5,45 x 39 mm. Cette arme est extrêmement fiable et tirera dans les pires conditions possibles. Le lance-grenades intégré est situé au-dessus du composant du fusil. Il tire des grenades « intelligentes » de 20 mm. Ces grenades programmables sont configurées électroniquement pour exploser en rafale à des distances prédéfinies."
 
