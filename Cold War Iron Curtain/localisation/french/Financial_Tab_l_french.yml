 CreditRatingAdjust.1.t:0 "Cote de crédit améliorée"
 CreditRatingAdjust.1.d:0 "Les prêteurs internationaux et les institutions financières ont pris note de l'amélioration de notre situation financière. Notre capacité à assurer le service de la dette, à maintenir des réserves et à honorer nos obligations financières a renforcé la confiance dans la solvabilité du gouvernement.\n\nLa cote de crédit du pays s'est améliorée d'un niveau."
 CreditRatingAdjust.1.a:0 "Excellente nouvelle."

 CreditRatingAdjust.2.t:0 "Cote de crédit dégradée"
 CreditRatingAdjust.2.d:0 "Les prêteurs internationaux et les institutions financières sont de plus en plus préoccupés par notre situation financière. L'augmentation de la dette, l'affaiblissement des réserves, le non-respect d'obligations ou l'instabilité politique ont réduit la confiance dans la capacité du gouvernement à honorer ses engagements financiers.\n\nLa cote de crédit du pays a chuté d'un niveau."
 CreditRatingAdjust.2.a:0 "Malheureux."


