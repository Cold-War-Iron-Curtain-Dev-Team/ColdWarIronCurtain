 finance_open_tooltip: "§YOnglet Finances§!\nConsultez les détails financiers de la nation ainsi que l'ajustement des politiques fiscales et des informations sur les prêts."

 ECON_SYSTEM_PALACE_ECONOMY_DESC: "\n\n£Economy_Palace_Economy_pic\n\n\n\n\n\n\n\n\nUn système économique dans lequel une part substantielle de la richesse passe sous le contrôle d'une administration centralisée (le palais) et est distribuée à la population en général."
 ECON_SYSTEM_FEUDALISM_DESC: "\n\n£Economy_Feudalism_pic\n\n\n\n\n\n\n\n\nUn système économique qui structure la société autour de relations dérivées de la possession de terres en échange de services ou de travail."
 ECON_SYSTEM_RENTIER_STATE_DESC: "\n\n£Economy_Rentier_State_pic\n\n\n\n\n\n\n\n\nUn État rentier est communément appelé un État qui tire tout ou partie de ses revenus nationaux des loyers payés par des particuliers, des entreprises ou des gouvernements étrangers."
 ECON_SYSTEM_PETROSTATE_DESC: "\n\n£Economy_Petrostate_pic\n\n\n\n\n\n\n\n\n\nUn système économique qui dépend de l'extraction et de l'exportation de pétrole ou de gaz, avec généralement un pouvoir politique et économique très concentré entre les mains d'une classe d'élite."
 ECON_SYSTEM_COLONIAL_DESC: "\n\n£Economy_Colonial_Economy_pic\n\n\n\n\n\n\n\n\n\nSystème économique par lequel un pays contrôle des personnes ou des zones, généralement à des fins de progrès stratégique et économique, et aboutissant généralement à l'exploitation des ressources et de la main-d'oeuvre."
 ECON_SYSTEM_FORDIST_CAPITALIST_DESC: "\n\n£Economy_Fordist_Capitalist_pic\n\n\n\n\n\n\n\n\nUn système économique axé sur la production de masse de produits standardisés, l'emploi de chaînes de montage et des salaires plus élevés."
 ECON_SYSTEM_POST_FORDIST_CAPITALIST_DESC: "Un système économique marqué par un choix et une identité accrus pour les consommateurs, une technologie de l'information accrue et l'essor du secteur des services et du secteur des cols blancs."
 ECON_SYSTEM_KEYNESIAN_DESC: "\n\n£Economy_Keynesian_pic\n\n\n\n\n\n\n\n\nUn système économique nommé d'après John Maynard Keynes, qui se concentre sur les politiques monétaires et fiscales visant à stabiliser la production économique et l'inflation, généralement avec une réglementation gouvernementale accrue."
 ECON_SYSTEM_NEO_KEYNESIAN_DESC: "Un système économique caractérisé par un État interventionniste continu, en particulier en cas de défaillances du marché, ainsi que par un libre-échange accru et un marché du travail plus compétitif."
 ECON_SYSTEM_DIRGISME_DESC: "\n\n£Economy_Dirigisme_pic\n\n\n\n\n\n\n\n\nUn système économique dans lequel l'État joue un rôle directeur important, notamment en utilisant une planification indicative, des investissements dirigés par l'État et l'utilisation d'instruments de marché pour atteindre les objectifs économiques de l'État."
 ECON_SYSTEM_NEO_DIRGISME_DESC: "Un système économique avec bon nombre des mêmes politiques interventionnistes d'État que le dirigisme, mais avec un commerce international, une intégration et une mondialisation plus importants."
 ECON_SYSTEM_STATE_CAPITALIST_DESC: "\n\n£Economy_State_Capitalism_pic\n\n\n\n\n\n\n\n\nUn système économique dans lequel l'État entreprend des activités économiques et commerciales et où les moyens de production sont nationalisés en tant qu'entreprises publiques."
 ECON_SYSTEM_SOCIALIST_MARKET_ECONOMY_DESC: "\n\n£Economy_Socialist_Market_Economy_pic\n\n\n\n\n\n\n\n\nUn système économique constitué d'une économie de marché avec une prédominance de propriété publique et d'entreprises publiques."
 ECON_SYSTEM_MARKET_SOCIALIST_DESC: "\n\n£Economy_Market_Socialist_pic\n\n\n\n\n\n\n\n\nUn système économique impliquant la propriété publique des moyens de production dans le cadre d'une économie de marché, ou un système qui contient un mélange d'entreprises appartenant aux travailleurs, nationalisées et privées."
 ECON_SYSTEM_PARTICIPATORY_ECONOMY_DESC: "Un système économique basé sur la prise de décision participative comme principal mécanisme économique, consistant en la propriété commune des moyens de production, y compris les conseils de travailleurs et de consommateurs."
 ECON_SYSTEM_CENTRAL_STATE_PLANNING_DESC: "\n\n£Economy_Central_State_Planning_pic\n\n\n\n\n\n\n\n\nUn système économique dans lequel la distribution de biens et de services ou l'investissement, la production et l'allocation de biens d'équipement sont gérés et planifiés par l'appareil d'État central."
 ECON_SYSTEM_CYBERNETIC_SOCIALIST_DESC: "Un système économique basé sur la planification centrale de l'État, mais décentralisé et utilisant des ordinateurs pour gérer la répartition précise des intrants économiques, ainsi que des informations en temps réel sur l'économie."
 ECON_SYSTEM_SOCIAL_CORPORATIST_DESC: "\n\n£Economy_Social_Corporatist_pic\n\n\n\n\n\n\n\n\nUn système économique basé sur un partenariat social entre le capital et le travail, impliquant des négociations collectives entre les représentants des travailleurs et de la direction au niveau national."
 ECON_SYSTEM_TRIPARTITE_CORPORATIST_DESC: "Un système économique basé sur une économie mixte et des contacts tripartites entre les mouvements ouvriers, les organisations patronales et le gouvernement central, agissant en tant que partenaires sociaux égaux pour créer la politique économique."
 ECON_SYSTEM_ORDOLIBERAL_CAPITALIST_DESC: "\n\n£Economy_Ordoliberal_Capitalist_pic\n\n\n\n\n\n\n\n\nUn système économique qui met l'accent sur la nécessité pour le gouvernement de veiller à ce que le libre marché atteigne ses objectifs, mais ne plaide pas en faveur d'un État-providence ou d'une économie keynésienne."
 ECON_SYSTEM_SOCIAL_MARKET_DESC: "Un système économique combinant un système capitaliste de libre marché avec des politiques et une réglementation sociales bénéfiques, pour établir une concurrence équitable sur le marché ainsi qu'un État-providence."
 ECON_SYSTEM_CONSUMER_SOCIALIST_DESC: "Un système économique qui suit les principes fondamentaux du socialisme et de la planification centrale, tout en accordant également une attention particulière à la disponibilité des biens de consommation et à la construction de nouveaux logements."
 ECON_SYSTEM_ADVANCED_CONSUMER_SOCIALIST_DESC: "\n\n£Economy_Advanced_Consumer_Socialist_pic\n\n\n\n\n\n\n\n\nUn système économique qui inclut les principes du socialisme de consommation traditionnel, mais combiné aux progrès de la technologie et du commerce international pour améliorer le choix et la disponibilité des consommateurs."
 ECON_SYSTEM_DRUG_CARTEL_DESC: "\n\n£Economy_Drug_Cartel_pic\n\n\n\n\n\n\n\n\nSystème économique fondé sur le contrôle absolu du marché par une entreprise criminelle organisée ou une série d'entreprises criminelles organisées se faisant concurrence pour le contrôle."
 ECON_SYSTEM_WAR_ECONOMY_DESC: "\n\n£Economy_War_Economy_pic\n\n\n\n\n\n\n\n\nUn système économique basé principalement sur la conservation des ressources critiques, ainsi que de la monnaie, afin de maintenir la légitimité et la capacité continue dans un conflit en cours."

