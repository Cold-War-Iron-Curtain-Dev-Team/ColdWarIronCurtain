 #Firearms
 #Indonesia, Republic of

 INO_infantry_equipment_0: "Carabine Mannlicher M95/51"
 INO_infantry_equipment_0_short: "Geweer M. 95"
 INO_infantry_equipment_0_desc: "La carabine Mannlicher M95/51 est une arme à feu à verrou basée sur le fusil Mannlicher M1895, initialement conçu pour un usage militaire à la fin de la période austro-hongroise. Il est doté d'un système distinctif de boulon à traction droite, qui permet un cyclisme plus rapide par rapport aux fusils à boulon tournant conventionnels. La désignation « /51» fait référence au programme de remise à neuf et de conversion d'après-Seconde Guerre mondiale, au cours duquel de nombreuses carabines M1895 survivantes ont été mises à jour pour tirer la cartouche plus moderne 8 × 56 mmR."

 INO_infantry_equipment_1: "Fusil américain, calibre.30, M1"
 INO_infantry_equipment_1_short: "M1 Garand"
 INO_infantry_equipment_1_desc: "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."

 INO_infantry_equipment_2: "Usine d'armes de Bandung SP-1"
 INO_infantry_equipment_2_short: "Bandoung SP-1"
 INO_infantry_equipment_2_desc: "Version sous licence du Beretta BM-59 produite par l'usine d'armes de Bandung sous le nom de SP-1"

 INO_infantry_equipment_3: "Fusil, calibre 5,56 mm, M16A1"
 INO_infantry_equipment_3_short: "M16A1"
 INO_infantry_equipment_3_desc: "Le XM16E1 de l'armée américaine était essentiellement la même arme que le M16 avec l'ajout d'une assistance avancée et d'encoches correspondantes dans le porte-boulon. Le M16A1 était le modèle de production finalisé en 1967 et a été produit jusqu'en 1982. Pour résoudre les problèmes soulevés par le cycle de test du XM16E1, un suppresseur de flash fermé en cage à oiseaux a remplacé le suppresseur de flash à trois volets du XM16E1 qui s'accrochait aux brindilles et aux feuilles. Divers autres changements ont été apportés après de nombreux problèmes sur le terrain. Des kits de nettoyage ont été développés et distribués tandis que des canons avec des chambres chromées et plus tard des alésages entièrement doublés ont été introduits."

 INO_infantry_equipment_4: "PT Pindad Senapan Serbu 1"
 INO_infantry_equipment_4_short: "Pindade SS1"
 INO_infantry_equipment_4_desc: "Le SS1 est l'abréviation de Senapan Serbu 1, ce qui signifie ; \"Assault Rifle 1\" est le fusil d'assaut standard des forces armées indonésiennes et de la police nationale indonésienne. Il est basé sur le fusil FN FNC mais modifié afin de répondre aux besoins ergonomiques et en milieu tropical."

 INO_train_equipment_1: "Classe E10 des chemins de fer indonésiens"
 INO_train_equipment_1_short: "Classe E10"
 INO_train_equipment_1_desc: "Les locomotives à vapeur de classe E10 étaient des moteurs compacts mais puissants utilisés par les chemins de fer indonésiens au début de la période post-indépendance. Construites à l'origine par Nippon Sharyo au Japon, ces locomotives-citernes 0-10-0T ont été conçues pour les pentes raides et les courbes serrées, ce qui les rend idéales pour une utilisation sur des lignes secondaires montagneuses ou industrielles, en particulier à Java et Sumatra.\n\nAvec leur empattement court et leur forte traction, les E10 étaient souvent utilisées pour transporter des marchandises sur des terrains difficiles où les plus grosses locomotives avaient du mal. Malgré leur apparence modeste, ils ont acquis une réputation de fiabilité et d'endurance à une époque où le système ferroviaire indonésien se remettait encore des dommages causés par la guerre et de ses ressources limitées."

 INO_train_equipment_2: "Locomotive BB 204 12 SLM des chemins de fer indonésiens"
 INO_train_equipment_2_short: "Locomotive BB 204 12 SLM"

 INO_train_equipment_3: "Chemins de fer indonésiens GE Universal Series U18C"
 INO_train_equipment_3_short: "GE Série universelle U18C"

