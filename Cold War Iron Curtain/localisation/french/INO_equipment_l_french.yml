 INO_motorized_equipment_3_short: "M35A1 6x6"
 INO_motorized_equipment_3_desc: "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
