 INO_attack_helicopter_equipment_4: "Mil Mi-35P"
 INO_attack_helicopter_equipment_4_short: "Mi-35P"
 INO_attack_helicopter_equipment_4_desc: "Initialement une version de base d'exportation du Mil Mi-24P produit par les Soviétiques, cette variante a été mise à niveau vers une nouvelle norme commune pour la modernisation du Mi-24. Le Mi-35P a reçu le système d'observation-viseur OPS-24N-1L avec une caméra thermique matricielle à ondes longues de troisième génération, une caméra TV et un télémètre laser. Le cockpit du vaisseau de combat amélioré est équipé du système de navigation de vol KNEI-24E-1 avec des écrans multifonctionnels. Le système de vol numérique PKV-8-35 augmente la maniabilité et la stabilité de l'hélicoptère. Le vaisseau de combat modernisé est également équipé du système de ciblage PrVK-24-2 mis à jour, qui permet l'utilisation de missiles guidés antichar 9M127-1 Ataka-VM et du système de contre-mesure électronique L370 Vitebsk ou de sa version d'exportation President-S."
 INO_attack_helicopter_equipment_5: "McDonnell Douglas AH-64E Gardien"
 INO_attack_helicopter_equipment_5_short: "Gardien AH-64E"
 INO_attack_helicopter_equipment_5_desc: "L'AH-64E est doté d'une connectivité numérique améliorée, du système de distribution d'informations tactiques interarmées, de moteurs T700-GE-701D plus puissants avec une transmission par train frontal améliorée pour accueillir plus de puissance, d'une capacité de contrôle de véhicules aériens sans pilote (UAV), d'une capacité IFR complète et d'un train d'atterrissage amélioré. Les nouvelles pales de rotor composites, testées avec succès en 2004, augmentent la vitesse de croisière, le taux de montée et la capacité de charge utile."
 
