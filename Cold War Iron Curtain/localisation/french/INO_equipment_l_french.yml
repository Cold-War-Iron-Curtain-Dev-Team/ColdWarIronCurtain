 INO_mechanized_marine_equipment_3: "PT-17H"
 INO_mechanized_marine_equipment_3_short: "PT-17H"
 INO_mechanized_marine_equipment_3_desc: "BTR-50PM (Modification Palawa) - Version utilisée par le Corps des Marines indonésien (Korps Marinir), équipée de radios AN/VRC-64 et PRC-33 au lieu du 10-RT, d'un nouveau système de freinage, d'une mitrailleuse FN MAG au lieu du PKT et d'un moteur Detroit Diesel 6V92T au lieu du V-6V d'origine."
 INO_mechanized_marine_equipment_4: "Arisgateur VAL M113"
 INO_mechanized_marine_equipment_4_short: "VAL Arisgateur"
 INO_mechanized_marine_equipment_4_desc: "L'Arisgator est un véhicule amphibie à chenilles conçu par A.R.I.S. Co. Pour les forces amphibies italiennes, dérivées du M113. Il utilisait des caissons de coque pour la flottabilité et les hélices. En kit, il coûte 1/5 de l'AAV7"
 INO_mechanized_marine_equipment_5: "PT PAL BTR-50P (M)"
 INO_mechanized_marine_equipment_5_short: "BTR-50P(M"
 INO_mechanized_marine_equipment_5_desc: "Version améliorée, développée par la société PT PAL Indonesia en coopération avec PT Pindad. Ce véhicule dispose d'une nouvelle section avant, d'une section de coque arrière surélevée et d'un moteur de 270 ch. Il a un poids à vide de 12 750 kg et un poids au combat de 14 900 kg. La capacité de transport est de 3 + 14 soldats."
