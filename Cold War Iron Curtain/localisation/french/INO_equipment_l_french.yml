 INS_CAS_equipment_1: "Fokker C.X série I"
 INS_CAS_equipment_1_short: "Fokker C.X"
 INS_CAS_equipment_1_desc: "Le Fokker C.X a été conçu à l'origine pour l'armée royale néerlandaise des Indes orientales, afin de remplacer le Fokker C.V. Comme tous les avions Fokker de cette époque, il était de construction mixte, avec des structures d'ailes en bois et un châssis en tube d'acier soudé recouvert de plaques d'aluminium à l'avant de l'avion et de tissu à l'arrière. Le prototype a été construit en 1934 avec un moteur Rolls-Royce Kestrel V. "
 INS_CAS_equipment_2: "Curtiss P-40K Warhawk"
 INS_CAS_equipment_2_short: "Faucon de guerre P-40K"
 INS_CAS_equipment_3: "Curtiss P-40N Kittyhawk"
 INS_CAS_equipment_3_short: "P-40N Kittyhawk"
 INS_CAS_equipment_3_desc: "Le P-40 était un avion de combat monomoteur entièrement métallique développé en 1938 et était une version modifiée du P-36 Hawk. Ce type serait utilisé par un nombre important de puissances alliées pendant la Seconde Guerre mondiale et, bien qu'il soit inférieur aux derniers P-47 et P-51, il servirait en première ligne jusqu'à la fin de la guerre. 200 pilotes alliés de 7 pays différents, des États-Unis aux pays du Commonwealth britannique en passant par l'Union soviétique, sont devenus des as du P-40. Malgré les désignations différentes pour le service du Commonwealth et le service soviétique, le surnom officiel du service américain est « Warhawk »."
 INS_CAS_equipment_4: "Douglas A-26C Envahisseur"
 INS_CAS_equipment_4_short: "Envahisseur A-26C"
 INS_CAS_equipment_4_desc: "Le Douglas A-26 Invader est un bombardier léger bimoteur américain et un avion d'attaque au sol. Construit par Douglas Aircraft Company pendant la Seconde Guerre mondiale, l'Invader a également servi lors de plusieurs conflits majeurs de la guerre froide."

