 INO_fighter_equipment_3: "P-51D Mustang nord-américain"
 INO_fighter_equipment_3_short: "P-51D Mustang"

 INO_jet_multirole_equipment_1: "P-51K Mustang nord-américain"
 INO_jet_multirole_equipment_1_short: "P-51K Mustang"
 INO_jet_multirole_equipment_2: "CS-102"
 INO_jet_multirole_equipment_2_desc: "Extérieurement similaire au MiG-15UTI standard, le CS-102 a conservé la même configuration de siège tandem, les mêmes ailes en flèche et le moteur fiable RD-45F. Bien que non armé ou légèrement armé par rapport à ses homologues monoplaces, la valeur du CS-102 résidait dans sa capacité à préparer des générations de pilotes d'avion à réaction au vol de combat à grande vitesse. Sa maniabilité indulgente et sa construction robuste le rendaient idéal pour les pilotes débutants entrant dans l'ère des avions à réaction.\n\nLe CS-102 a été largement exporté, les forces aériennes d'Afrique, d'Asie et d'Amérique latine en acquérant ce type dans le cadre d'accords de coopération militaire avec la Tchécoslovaquie et l'Union soviétique."
 INO_jet_multirole_equipment_2_short: "CS-102"
 INO_jet_multirole_equipment_3: "Lim-5/Type 56"
 INO_jet_multirole_equipment_3_desc: "Le Lim-5 était doté d'une avionique améliorée et d'un moteur VK-1A plus puissant par rapport aux modèles précédents, permettant des performances plus élevées et une meilleure fiabilité. Bien que son apparence soit largement similaire au MiG-17F, le Lim-5 a été spécialement adapté pour être utilisé dans les pays du Pacte de Varsovie et exporté vers les alliés du Moyen-Orient et d'Afrique.\n\nComme son prédécesseur MiG-17, le Lim-5 a continué à jouer divers rôles secondaires tels que l'entraînement, l'attaque au sol et la défense aérienne de réserve jusque dans les années 1980 dans certains pays. Quelques exemples survivent encore aujourd'hui dans les musées ou dans les escadrons de cérémonie, marquant un long héritage de la puissance aérienne du bloc de l'Est d'après-guerre."
 INO_jet_multirole_equipment_3_short: "Lim-5/Type 56"
 INO_jet_multirole_equipment_4: "Mikoyan-Gourevitch MiG-19S"
 INO_jet_multirole_equipment_4_desc: "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 INO_jet_multirole_equipment_4_short: "MiG-19S"
 INO_jet_multirole_equipment_5: "Mikoyan-Gourevitch MiG-21F-13"
 INO_jet_multirole_equipment_5_desc: "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 INO_jet_multirole_equipment_5_short: "MiG-21F-13"
 INO_jet_multirole_equipment_6: "T-33A Puslitbang"
 INO_jet_multirole_equipment_6_desc: "Conçu à l'origine aux États-Unis comme un dérivé du chasseur à réaction P-80/F-80, le T-33 était doté d'un cockpit biplace en tandem, d'un seul turboréacteur Allison J33 et de caractéristiques de maniement simples qui en faisaient l'un des avions d'entraînement à réaction les plus réussis de l'histoire de l'aviation. En Indonésie, la désignation « Puslitbang » désignait les avions réutilisés pour la recherche aéronautique, les essais d'intégration d'armes et les tests de systèmes de vol, en particulier dans les années 1960 et 1970, alors que le pays cherchait à accroître son autonomie en matière de capacités aérospatiales."
 INO_jet_multirole_equipment_6_short: "T-33A"
 #INO_jet_multirole_equipment_7: ""
 #INO_jet_multirole_equipment_7_desc: ""
 #INO_jet_multirole_equipment_7_short: "MiG-21F-13 GFX placeholder"
 INO_jet_multirole_equipment_8: "Northrop F-5E Tigre II"
 INO_jet_multirole_equipment_8_short: "F-5E Tigre II"
 INO_jet_multirole_equipment_9: "General Dynamics F-16A Block 15 OCU (mises à niveau des capacités opérationnelles) Fighting Falcon"
 INO_jet_multirole_equipment_9_short: "F-16A Bloc 15 OCU"
 INO_jet_multirole_equipment_9_desc: "Premier changement majeur apporté au F-16, l'avion Block 15 présentait des stabilisateurs horizontaux plus grands, l'ajout de deux points d'attache à l'entrée du menton, un nouveau radar et une capacité accrue pour les pylônes sous les ailes. Cette variante a également acquis une radio ultra haute fréquence (UHF) à jour. Cette variante est la plus nombreuse parmi les variantes du F-16."
 INO_jet_multirole_equipment_10: "General Dynamics F-16C Bloc 50"
 INO_jet_multirole_equipment_10_short: "F-16C Bloc 50"

 INO_mr_stealth_fighter_equipment_1: "Soukhoï Su-30MK2"
 INO_mr_stealth_fighter_equipment_1_short: "Su-30MK2"
 INO_mr_stealth_fighter_equipment_1_desc: "Le Sukhoi Su-30MKM (nom OTAN ; Flanker-H) est un chasseur supermaniable de la Royal Malaysian Air Force. Il s'agit d'une variante des chasseurs de la série Su-30, avec de nombreuses améliorations significatives par rapport à la version d'exportation originale du Su-30MK."


 INO_jet_interceptor_equipment_9: "Soukhoï Su-27SK"
 INO_jet_interceptor_equipment_9_desc: "Le Su-27S Flanker B est la variante de production initiale du chasseur Sukhoi Su-27 de conception soviétique. L'avion était destiné à être le concurrent direct du F-14 Tomcat et du F-15 Eagle. Après avoir effectué son vol inaugural en 1977, il est entré en service plus tard en 1985. Son rôle principal était la défense aérienne à longue portée contre les bombardiers américains B-1 et B-52, ainsi que l'escorte à longue portée des bombardiers stratégiques intercontinentaux soviétiques. Jusqu'à présent, 809 avions ont été produits, qui sont toujours en service dans l'armée de l'air russe. Les autres opérateurs comprennent : l'Indonésie, l'Ukraine, le Vietnam et la Chine (désigné J-11), entre autres. L'avion restera en service dans un avenir prévisible."
 INO_jet_interceptor_equipment_9_short: "Su-27SK"

 INO_CAS_equipment_1: "Bombardier transporteur de type 99"
 INO_CAS_equipment_1_short: "Aïchi D3A"
 INO_CAS_equipment_1_desc: "Parmi les vestiges épars de la guerre et de l'empire, un avion a fini par porter l'insigne rouge et blanc d'une nation nouvellement née : l'Aichi D3A, un bombardier en piqué japonais autrefois redouté à travers le Pacifique, aujourd'hui piloté sous la bannière de l'armée de l'air indonésienne (AURI) au début de la révolution.\n\nConnu pendant la guerre sous le nom de « Val », l'Aichi D3A avait servi avec distinction la marine impériale japonaise en tant que bombardier en piqué embarqué. Mais avec la capitulation du Japon en 1945, ces avions, abandonnés sur les aérodromes de l'archipel, sont devenus un butin précieux pour un peuple luttant pour affirmer son indépendance."
 INO_CAS_equipment_2: "Curtiss P-40K Warhawks"
 INO_CAS_equipment_2_short: "Faucon de guerre P-40K"
 INO_CAS_equipment_3: "Curtiss P-40E Warhawks"
 INO_CAS_equipment_3_short: "Faucons de guerre P-40E"
 INO_CAS_equipment_4: "Douglas A-26C Envahisseur"
 INO_CAS_equipment_4_short: "Envahisseur A-26C"
 INO_CAS_equipment_4_desc: "Le Douglas A-26 Invader est un bombardier léger bimoteur américain et un avion d'attaque au sol. Construit par Douglas Aircraft Company pendant la Seconde Guerre mondiale, l'Invader a également servi lors de plusieurs conflits majeurs de la guerre froide."

 INO_jet_CAS_equipment_1: "AT-16 Harvard nord-américain"
 INO_jet_CAS_equipment_1_short: "AT-16 Harvard"
 INO_jet_CAS_equipment_1_desc: "Variante armée du T-6 Harvard nord-américain. L'AT-16 pourrait être armé de fusées, de bombes et de canons pour des missions d'appui aérien rapproché."

 INO_jet_light_equipment_1: "T-6G Texan nord-américain"
 INO_jet_light_equipment_1_short: "T-6G Texan"
 INO_jet_light_equipment_1_desc: "Les modèles antérieurs AT-6/T-6 ont été reconstruits entre 1949 et 1953 avec une disposition améliorée du cockpit, une capacité de carburant accrue, une roue arrière orientable, des radios mises à jour et un moteur R-1340-AN-1 de 600 ch. Identifiable par l'encadrement simplifié de la verrière. 2068 modifié."
 INO_jet_light_equipment_2: "Mikoyan-Gourevitch MiG-15UTI"
 INO_jet_light_equipment_2_short: "MiG-15UTI"
 INO_jet_light_equipment_2_desc: "Le 6 avril 1949, l'équipe OKB-155 se voit officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n°1 entre mars et mai 1949. La cabine de l'instructeur de l'UTI MiG-15 a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
 INO_jet_light_equipment_3: "L-29 Delfin"
 INO_jet_light_equipment_3_short: "L-29 Delfin"
 INO_jet_light_equipment_3_desc: "L'Aero L-29 Delfín (anglais ; Dolphin, nom de rapport OTAN ; Maya) est un avion d'entraînement militaire développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 entraîneurs L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avion d'entraînement standard pour l'armée de l'air soviétique."
 INO_jet_light_equipment_4: "Rockwell OV-10A Bronco nord-américain"
 INO_jet_light_equipment_4_short: "OV-10A Bronco"
 INO_jet_light_equipment_4_desc: "Le North American Rockwell OV-10 Bronco est un avion d'attaque et d'observation léger bi-turbopropulseur américain. Il a été développé dans les années 1960 comme avion spécial pour le combat contre-insurrectionnel (COIN), et l'une de ses principales missions était d'être un avion de contrôle aérien avancé (FAC). Il peut transporter jusqu'à 3 200 livres de munitions externes, des charges internes telles que des parachutistes ou des civières, et flâner pendant trois heures ou plus."
 INO_jet_light_equipment_5: "Hawk 209 de l'aérospatiale britannique"
 INO_jet_light_equipment_5_short: "Faucon 209"
 INO_jet_light_equipment_5_desc: "Le British Aerospace Hawk 200 est un chasseur multirôle léger monoplace et monomoteur conçu pour la défense aérienne, le refus aérien, la lutte contre la navigation, l'interdiction, l'appui aérien rapproché et l'attaque au sol."

 INO_recon_equipment_0: "F-6D Mustang nord-américain"
 INO_recon_equipment_0_short: "F-6D Mustang"
 INO_recon_equipment_0_desc: "Version de reconnaissance du P-51D Mustang."
 INO_jet_recon_equipment_0: "Mikoyan-Gourevitch MiG-15Rbis"
 INO_jet_recon_equipment_0_short: "MiG-15Rbis"
 INO_jet_recon_equipment_1: "Mikoyan-Gourevitch MiG-21R-13"
 INO_jet_recon_equipment_1_short: "MiG-21R-13"
 INO_jet_recon_equipment_2: "General Dynamics F-16A Block 15 OCU (mises à niveau des capacités opérationnelles) Fighting Falcon Recce"
 INO_jet_recon_equipment_2_short: "Reconnaissance F-16A Bloc 15"

 INO_tac_bomber_equipment_0: "Yokosuka K5Y 'alias-tombo'"
 INO_tac_bomber_equipment_0_short: "K5Y 'alias-tombo'"
 INO_tac_bomber_equipment_1: "Bombardier d'attaque Mitsubishi Navy Type 1"
 INO_tac_bomber_equipment_1_short: "Mitsubishi G4M"
 INO_tac_bomber_equipment_2: "B-25C Mitchell nord-américain"
 INO_tac_bomber_equipment_2_short: "B-25C Mitchell"
 INO_tac_bomber_equipment_2_desc: "Le B-25 est un bombardier moyen bimoteur introduit en 1941. Utilisé par de nombreuses forces aériennes pendant la Seconde Guerre mondiale, il a également servi sur tous les théâtres impliquant des avions pendant la guerre, l'utilisation la plus célèbre étant le raid de Doolittle, la première campagne de bombardement aérien réussie sur le continent japonais pendant la guerre. Son surnom est « Mitchell », du nom du major général Billy Mitchell, pionnier de l'aviation militaire américaine."
 INO_tac_bomber_equipment_3: "B-25J Mitchell nord-américain"
 INO_tac_bomber_equipment_3_short: "B-25J Mitchell"

 #INO_jet_tac_bomber_equipment_1: ""
 #INO_jet_tac_bomber_equipment_1_short: ""
 #INO_jet_tac_bomber_equipment_1_desc: "Soviet tac bomber GFX"
 INO_jet_tac_bomber_equipment_2: "Iliouchine Il-28"
 INO_jet_tac_bomber_equipment_2_short: "Il-28"
 INO_jet_tac_bomber_equipment_2_desc: "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à entrer en production à grande échelle, l'Il-28, lors de son introduction en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été progressivement retirés du service soviétique dans les années 1980, de nombreux avions de ce type sont encore en service aujourd'hui. Le nom de rapport USAF/DoD est Type 27, tandis que le nom de code OTAN est Beagle."
  
 #Stratbomber commented out, use following GFX only
 #INO_strat_bomber_equipment_1: "Boeing B-17 Flying Fortress"
 #INO_strat_bomber_equipment_1_short: "B-17 Flying Fortress"
 #INO_strat_bomber_equipment_1_desc: "The B-17 is a four-engine strategic bomber developed in the mid 1930s for the U.S. Army Air Corps. It was the third-most produced bomber aircraft in World War II, and served with distinction in the European theatre of the conflict, responsible for the bombing campaigns in Germany from bases in Southern England and Italy. It's bristling defensive armament is fitting for an aircraft nicknamed the 'Flying Fortress.'"
 #INO_strat_bomber_equipment_2: "Consolidated B-24 Liberator"
 #INO_strat_bomber_equipment_2_short: "B-24 Liberator"
 #INO_strat_bomber_equipment_2_desc: "The B-24 was designed in 1941 as long-range heavy bomber for the US Army Air Force. Despite its capability for a heavy bomb load coupled with a high cruise speed, it was relatively difficult to fly at low altitudes and had a lower service ceiling than the B-17. Yet the 'Liberator' was preferred by the U.S. General Staff, and was the most produced bomber aircraft in WWII. Like the B-17, it served well in the European theatre during the bombing campaign of Germany, but also served with distinction in the Pacific theater as well."
 #INO_strat_bomber_equipment_3: "Tupolev Tu-4"
 #INO_strat_bomber_equipment_3_short: "Tu-4"
 #INO_strat_bomber_equipment_3_desc: "The Tu-4 is the reverse-engineered design based on the American B-29 Superfortress, developed under the need by Iosif Stalin to have a strategic bomber with similar capabilities to America's war-winning bomber. Despite the U.S. refusal to Lend-Lease the B-29, four B-29s crash landed in Soviet territory, and that was enough to begin the reverse-engineering process. Despite many difficulties (procuring parts that were equivalent or superior to American-developed parts, conversion from imperial to metric system, etc.) the Tu-4's first flight and entry into service was enough to panic the U.S. and Great Britain, the first of many during the Cold War. It would have a brief service life however, replaced by jet bombers by the mid-1960s. Its NATO reporting name is Bull."
 
 INO_jet_strat_bomber_equipment_1: "Tupolev Tu-16KS1"
 INO_jet_strat_bomber_equipment_1_short: "Tu-16KS1"
 INO_jet_strat_bomber_equipment_1_desc: "Le Tu-16 est un bombardier stratégique bimoteur développé en 1952 et fut l'un des premiers bombardiers stratégiques à réaction à entrer en service dans l'armée de l'air soviétique. Il avait une configuration à ailes en flèche et était propulsé par deux turboréacteurs Mikulin AM-3 sur les emplantures des ailes. Il pouvait transporter jusqu'à 9 000 kg (20 000 lb) de munitions, y compris des armes nucléaires et la FAB-9000, une bombe de 9 000 kg avec un rendement similaire à la bombe britannique du Grand Chelem. Connu en Occident sous le nom de Badger, ce type a servi tout au long de la guerre froide et a pris sa retraite en 1993. La variante chinoise construite sous licence, le H-6, reste en service en tant que bombardier stratégique de première ligne de la PLAAF."

