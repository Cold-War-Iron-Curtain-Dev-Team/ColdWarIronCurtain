 INS_tac_bomber_equipment_0: "Fokker C.V D/E"
 INS_tac_bomber_equipment_0_short: "Fokker C.V D/E"
 INS_tac_bomber_equipment_1: "Modèle Martin 166"
 INS_tac_bomber_equipment_1_short: "Modèle 166"
 INS_tac_bomber_equipment_2: "B-25C Mitchell nord-américain"
 INS_tac_bomber_equipment_2_short: "B-25C Mitchell"
 INS_tac_bomber_equipment_2_desc: "Le B-25 est un bombardier moyen bimoteur introduit en 1941. Utilisé par de nombreuses forces aériennes pendant la Seconde Guerre mondiale, il a également servi sur tous les théâtres impliquant des avions pendant la guerre, l'utilisation la plus célèbre étant le raid de Doolittle, la première campagne de bombardement aérien réussie sur le continent japonais pendant la guerre. Son surnom est « Mitchell », du nom du major général Billy Mitchell, pionnier de l'aviation militaire américaine."
 INS_tac_bomber_equipment_3: "B-25J Mitchell nord-américain"
 INS_tac_bomber_equipment_3_short: "B-25J Mitchell"

 INS_jet_light_equipment_1: "Instructeur Fokker S.11"
 INS_jet_light_equipment_1_short: "S.11 Instructeur"
 INS_jet_light_equipment_1_desc: "Le Fokker S.11 Instructor est un avion d'entraînement militaire biplace néerlandais conçu et fabriqué par Fokker pour la Royal Dutch Air Force immédiatement après la Seconde Guerre mondiale."

 INS_recon_equipment_0: "Lockheed modèle 12 Electra Junior"
 INS_recon_equipment_0_short: "Modèle 12 Electra Junior"
 INS_recon_equipment_0_desc: "Le Lockheed Model 12 Electra Junior, plus communément connu sous le nom de Lockheed 12 ou L-12, est un avion de transport bimoteur entièrement métallique de huit places et six passagers de la fin des années 1930, conçu pour être utilisé par les petites compagnies aériennes, les entreprises et les riches particuliers. Version plus petite du Lockheed Model 10 Electra, le Lockheed 12 n'était pas populaire en tant qu'avion de ligne, mais était largement utilisé comme moyen de transport d'entreprise et gouvernemental. Plusieurs ont également été utilisés pour tester de nouvelles technologies aéronautiques."

