l_french:
 iran_oil.1.d:0 "L'élection de Mohammad Mosaddegh en Iran a marqué des tensions avec le Royaume-Uni et les Etats-Unis alors qu'il a longtemps évoqué la nationalisation de l'or liquide une fois l'occasion offerte. Après avoir poussé le Majlis à parvenir à un accord, l'idée autrefois radicale semblait bien plus probable qu'improbable. Finalement, la compagnie pétrolière anglo-persane a été nationalisée, étendant ainsi l'influence anglo-saxonne sur les vastes ressources de l'Iran. Le Royaume-Uni a déjà manifesté un ressentiment ouvert, menaçant l'Iran si la décision n'était pas annulée. Quelle que soit la position britannique, l'Iran reste ferme face à cette crise."
 iran_assasinations.1.d:0 "Le ministre royal Abdolhossein Hazhir a été déclaré mort de trois blessures par balle à la tête alors qu'il priait à la mosquée Sepahsalar. Bien que beaucoup ne soient pas d'accord avec son soutien aux Britanniques dans le conflit pétrolier anglo-iranien, sa mort a provoqué une onde de choc au sein du gouvernement et de la population iraniens. Beaucoup rejettent rapidement la faute sur Fada'iyan-e Islam, qui proteste depuis longtemps contre Hazhir et les postes élevés qu'il s'est retrouvés. Son assassin, Seyyed Hossein Emami Esfahani, a été découvert comme faisant partie de l'organisation peu après sa capture. Des troubles ont éclaté à Téhéran, les fondamentalistes et leurs opposants étant descendus dans la rue. Cela pourrait être le début d'une crise plus grave..."
 iran_assasinations.2.t:0 "[GetNewspaperHeader]Assassinat du général Haj Ali Razmara"
 iran_assasinations.2.d:0 "Le Premier ministre iranien Haj Ali Razmara aurait été assassiné par un islamiste radical à Téhéran. En tant que Premier ministre depuis 1950, Razmara a toujours plaidé en faveur de la décentralisation et d'un accord plus favorable avec le gouvernement britannique. Razmara avait initialement été soutenu par le ministère britannique des Affaires étrangères et s'était aliéné de nombreux propriétaires fonciers modérés puissants - ainsi que le Front national - sans parvenir à obtenir le soutien des partis les plus radicaux. Selon des témoignages oculaires, Razmara assistait à un service commémoratif à la mosquée du Shah lorsqu'un membre de la foule a tiré trois coups de feu. L'assassinat a été perpétré par le groupe islamiste radical Fadayan-e Islam, probablement en raison de l'opposition de Razmara à la nationalisation de l'approvisionnement en pétrole iranien. Cet assassinat coïncide avec le concept de nationalisation iranienne qui connaît une croissance rapide en popularité ces dernières années. Il s'agit de la dernière tragédie d'une série d'assassinats de ministres iraniens."
 iran_assasinations.2.o:0 "Téhéran sombre dans le chaos."
 iran_political.10.t:0 "[GetNewspaperHeader]Le pari de la démission de Mossadegh"
 iran_political.10.d:0 "Plus tôt ce mois-ci, le Premier ministre Mossadegh a demandé au Shah de lui accorder la possibilité de nommer le ministre de la Guerre et le chef d'état-major, ce qui a été refusé. Mossadegh a donc annoncé sa démission et a fait appel directement au peuple. Alors qu'Ahmad Qavam a été nommé pour le remplacer, des groupes radicaux ont organisé des manifestations et des grèves à l'échelle nationale en faveur de Mossadegh. Partout dans le pays, des grèves et des manifestations ont éclaté. Au cours des cinq derniers jours, les manifestants se sont affrontés aux troupes alors que le pays était complètement paralysé. La loyauté des soldats étant mise en doute, les commandants militaires ont ordonné à toutes les troupes de regagner leurs casernes, et Téhéran s'est retrouvé entièrement aux mains des manifestants. Aujourd'hui, le Shah effrayé a renvoyé Qavam et Mosaddegh a été reconduit dans ses fonctions, avec tous les pouvoirs militaires qu'il avait précédemment exigés. Mossadegh est désormais plus populaire que jamais et en mesure d'étendre encore sa position au sein du gouvernement"
 iran_political.10.o:0 "Le stratagème de Mossadegh a porté ses fruits."
 
 AJAX.12.d:0 "Le général iranien Fazlollah Zahedi était un fervent loyaliste du Shah et avait été accusé de traître par Mossadegh avant le coup d'État manqué. Il a été nommé nouveau Premier ministre dans le décret impérial du Shah et, après l'échec du coup d'État, a rapidement disparu de la vue du public. Bien que Mossadegh ait ordonné aux forces de sécurité d'arrêter les conspirateurs, Zahedi est jusqu'à présent resté hors de leur portée et en fuite. Il s'est déclaré Premier ministre légitime de l'Iran et a appelé le peuple iranien à se soulever contre Mossadegh, avec un effet très limité. Cependant, avec le retour des partisans de Mossadegh dans leurs foyers, les conspirateurs pro-Shah se trouvent désormais dans une position considérablement plus forte. Plus récemment, des rumeurs affirment que Zahedi aurait assisté à une réunion secrète de partisans du Shah et que s'ils parvenaient à obtenir le soutien populaire, la position de Mossadegh serait considérablement menacée. Quoi qu'il en soit, la présence de Zahedi en Iran constitue une épine majeure dans le pied du régime de Mossadegh."
 AJAX.11.d:0 "Après l'échec du coup d'État royaliste, de nombreuses spéculations ont eu lieu sur le sort de Reza Shah. Cependant, il apparaît désormais que le Shah a fui le pays immédiatement après la tentative de coup d'État et est arrivé à Bagdad avec sa seconde épouse. Après que sa demande d'asile temporaire ait été accordée, il a passé du temps dans une maison d'hôtes du gouvernement irakien avant d'être transporté par avion vers l'Italie, où il réside toujours. Avec le départ du Shah, Mossadegh dirige le pays pratiquement sans opposition. Cependant, il a ordonné à tous ses partisans de rentrer chez eux et sans eux, son gouvernement semble presque vulnérable - et le général Zahedi, fermement pro-Shah, est toujours en fuite."
 AJAX.10.d:0 "Après sa démission réussie, le Premier ministre iranien Mohammad Mossadegh a continué à consolider son pouvoir, tandis que le Shah était de plus en plus préoccupé par son influence croissante. Récemment, les efforts de Mossadegh ont abouti à l'émission d'un décret abolissant officiellement le Parlement, lui donnant ainsi, ainsi qu'à son cabinet, un pouvoir absolu et privant le Shah de toute autorité réelle. Effrayé par le pouvoir absolu de Mossadegh, un décret royal fut rédigé par des conspirateurs royalistes et signé par le Shah démettant Mossadegh de ses fonctions et nommant à sa place le général loyaliste Zahedi. Le commandant de la Garde impériale a remis le décret à Mossadegh, mais il avait été averti du complot, vraisemblablement par le parti communiste Tudeh, et avait fait arrêter le commandant, arguant que le Shah n'avait plus le pouvoir d'émettre des décrets. On ne sait pas où se trouve Zahedi et le Shah et nombreux sont ceux qui soupçonnent l'Occident d'être impliqué dans la tentative de coup d'État. Alors que la situation continue de se détériorer, il semble que Mossadegh ait, du moins pour le moment, maintenu son autorité en Iran."
