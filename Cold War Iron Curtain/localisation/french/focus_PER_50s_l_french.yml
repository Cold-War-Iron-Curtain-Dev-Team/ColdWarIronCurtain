 PER_anglo_iranian_oil_company_desc:0 "en 1933, la « Anglo-Iranian Oil Company » britannique a conclu un accord avec le gouvernement iranien pour obtenir les droits exclusifs de forage des champs pétroliers iraniens. Un sujet de débat constant et source de troubles internes pour l'Iran."
 PER_corrupt_bureaucracy_judiciary_desc:0 "Notre société fonctionne grâce au népotisme, les lignes sont remplacées par des pots-de-vin, les généraux sont les fils de l'élite riche, nous sommes dirigés par des imbéciles et des charlatans"
 PER_revised_ai_oil_company_desc:0 "La nouvelle A-I Oil Co. a apporté une amélioration significative au climat politique du pays, mais ce n'est qu'une question de temps avant que son existence ne soit à nouveau remise en question."
 PER_revised_deal:0 "Révision de A-I Oil Co."
 PER_revised_deal_desc:0 "Peut-être avons-nous montré à l'Angleterre que nous sommes attachés à leur cause et que nous pouvons être un allié précieux et fiable dans la région et sur la scène mondiale. Espérons que cela nous permettra d'obtenir un accord révisé et plus raisonnable afin de soulager une partie de la pression politique au sein de notre gouvernement."
