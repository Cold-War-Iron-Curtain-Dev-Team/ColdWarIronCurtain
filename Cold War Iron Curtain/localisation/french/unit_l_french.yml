 hq_engineer_desc: "Traite des questions relatives aux fortifications et aux mesures de mobilité/contre-mobilité."
 hq_recon: "État-major de reconnaissance"
 hq_recon_desc: "Recueille et analyse les données de reconnaissance reçues du terrain."
 hq_military_police: "Personnel de la police militaire"
 hq_military_police_desc: "Maintient l'ordre local et dirige le trafic de la division dans la zone d'opérations de l'armée."
