 # ---- from CubanMissileCrisis.txt ----
 cubamc.1.a2:0 "Un geste dangereux"
 cubamc.1.b2:0 "Un geste dangereux"
 cubamc.1.t2:0 "[GetNewspaperHeader]Les États-Unis déploient des missiles Jupiter en Turquie"
 cubamc.10.a2:0 "La crise indienne requiert notre attention, proposez un accord"
 cubamc.10.b2:0 "Autoriser nos troupes à engager des envahisseurs"
 cubamc.10.c2:0 "Reculez, Castro est seul"
 cubamc.10.d2:0 "Représailles nucléaires à grande échelle"
 cubamc.10.t2:0 "Les Américains envahissent Cuba"
 cubamc.11.a2:0 "Minuit approche...."
 cubamc.11.t2:0 "[GetNewspaperHeader]Berlin prise par l'Union Soviétique"
 cubamc.12.a2:0 "Espérons qu'ils voient la raison..."
 cubamc.12.t2:0 "Le blocus est actif, envoyez un ultimatum aux Soviétiques"
 cubamc.13.a2:0 "Concernant...."
 cubamc.13.t2:0 "[GetNewspaperHeader]Discours présidentiel sur la crise des missiles de Cuba"
 cubamc.14.a2:0 "Préparez-vous à une invasion, prévenez Castro !"
 cubamc.14.t2:0 "Les Américains découvrent l'opération Anadyr !"
 cubamc.15.a2:0 "Demandez-leur de conserver leurs positions et d'essayer de conclure un accord"
 cubamc.15.b2:0 "L'Inde est une préoccupation plus urgente, demande des pourparlers"
 cubamc.15.c2:0 "Avancez à travers le blocus avec un sous-support"
 cubamc.15.t2:0 "La marine américaine bloque nos navires !"
 cubamc.16.a2:0 "Acceptez son offre"
 cubamc.16.b2:0 "Absolument pas, exigez le retrait inconditionnel des Soviétiques"
 cubamc.16.t2:0 "L'offre de Khrouchtchev"
 cubamc.17.a2:0 "Excellent, poussons un soupir de soulagement"
 cubamc.17.t2:0 "Les Américains acceptent !"
 cubamc.18.a2:0 "Dieu merci, la raison a prévalu"
 cubamc.18.t2:0 "[GetNewspaperHeader]La fin de la crise des missiles de Cuba"
 cubamc.19.a2:0 "Notre pari à Cuba a échoué"
 cubamc.19.b2:0 "Traverser le blocus"
 cubamc.19.t2:0 "Les Américains rejettent !"
 cubamc.2.a2:0 "Envoyer Biryuzov"
 cubamc.2.t2:0 "Opération Anadyr"
 cubamc.20.a2:0 "Un coup porté au prestige soviétique"
 cubamc.20.t2:0 "[GetNewspaperHeader]Les Soviétiques se retirent de Cuba"
 cubamc.21.a2:0 "Reculez, ça ne vaut pas une guerre nucléaire"
 cubamc.21.b2:0 "Ouvrez le feu !"
 cubamc.21.t2:0 "Les Soviétiques franchissent le blocus"
 cubamc.22.a2:0 "Un coup porté au prestige américain"
 cubamc.22.t2:0 "[GetNewspaperHeader]Les missiles soviétiques resteront à Cuba"
 cubamc.23.a2:0 "Minuit approche..."
 cubamc.23.t2:0 "Les Américains ont tiré, nos sous-marins ont engagé"
 cubamc.24.a2:0 "La fin est proche"
 cubamc.24.t2:0 "[GetNewspaperHeader]Détonations nucléaires au large de Cuba"
 cubamc.25.a2:0 "Dieu ait pitié..."
 cubamc.25.t2:0 "Ordonnez des représailles nucléaires totales"
 cubamc.26.a2:0 "Fin de partie..."
 cubamc.26.t2:0 "Les Américains ont riposté, préparez nos forces de missiles"
 cubamc.27.a2:0 "Accepter la demande"
 cubamc.27.b2:0 "Non, c'est trop dangereux"
 cubamc.27.t2:0 "Déploiement de missiles à la demande des Soviétiques"
 cubamc.28.a2:0 "Cela ne finira pas bien..."
 cubamc.28.t2:0 "[GetNewspaperHeader]Invasion américaine de Cuba"
 cubamc.29.a2:0 "Bien"
 cubamc.29.t2:0 "Berlin saisi"
 cubamc.3.a2:0 "Pressez pour le déploiement de missiles"
 cubamc.3.b2:0 "Acceptez la contre-offre"
 cubamc.3.t2:0 "La contre-offre de Castro : un traité de défense"
 cubamc.4.a2:0 "Un résultat des plus merveilleux !"
 cubamc.4.t2:0 "Castro accepte"
 cubamc.5.b:0 "Acceptez la contre-offre initiale"
 cubamc.5.t2:0 "Castro refuse"
 cubamc.6.a2:0 "Intéressant"
 cubamc.6.t2:0 "[GetNewspaperHeader]Les Soviétiques forment une alliance de défense avec Cuba"
 cubamc.7.a2:0 "Demandez-leur d'installer la base immédiatement !"
 cubamc.7.t2:0 "Les forces soviétiques débarquent à Cuba"
 cubamc.8.a2:0 "On avait un marché, bon sang !"
 cubamc.8.t2:0 "La CIA repère des missiles à Cuba"
 cubamc.9.a2:0 "Optez pour la recommandation majoritaire : blocus"
 cubamc.9.b2:0 "Suivez la recommandation des Joint Chiefs : Invasion"
 cubamc.9.c2:0 "Allez avec le secrétaire d'État : ne faites rien"
 cubamc.9.t2:0 "Convoquer le COMEX"
