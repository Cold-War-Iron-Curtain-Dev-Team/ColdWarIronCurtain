l_french: 

 GDR_First_Secretary_Oelsner: "Premier secrétaire Oelsner"
 GDR_First_Secretary_Oelsner_desc: "Fred Oelsner a acquis la direction de la RDA ; il est temps de le reconnaître officiellement comme notre nouveau Premier Secrétaire."
 GDR_Promote_Consumer_Goods_Production: "Promouvoir la production de biens de consommation"
 GDR_Promote_Consumer_Goods_Production_desc: "Les biens de consommation rendent les gens heureux et dociles ; nous devrions augmenter leur production."
 GDR_Assuange_Fears_of_the_Public: "Apaiser les craintes du public"
 GDR_Assuange_Fears_of_the_Public_desc: "Le gouvernement d'Ulbricht a utilisé la peur et l'intimidation pour maintenir le peuple dans le rang, mais pas plus ! Nous montrerons au peuple allemand qu'il n'a rien à craindre de nous."
 GDR_Building_Popular_Support: "Bâtir un soutien populaire"
 GDR_Building_Popular_Support_desc: "Le Parti est populaire par défaut, car il n'a pas de réelle opposition. Nous devons travailler pour garantir que les gens croient réellement en notre vision."
 GDR_Launch_an_Outreach_to_the_EKD: "Sensibilisation à l'EKD"
 GDR_Launch_an_Outreach_to_the_EKD_desc: "Socialisme et religion ne font pas souvent bon ménage ; cependant, nous offrirons à l'Église évangélique d'Allemagne la possibilité de mettre de côté nos différences et de travailler ensemble pour le bien du peuple."
 GDR_Increase_Social_Welfare_Spending: "Augmenter les dépenses de protection sociale"
 GDR_Increase_Social_Welfare_Spending_desc: "La protection sociale est au coeur du rêve socialiste. Il est de notre responsabilité de subvenir aux besoins de ceux qui n'ont pas la capacité de subvenir à leurs propres besoins."
 GDR_Encourage_Inter_Party_Dialogue: "Encourager le dialogue entre les partis"
 GDR_Encourage_Inter_Party_Dialogue_desc: "La coordination entre les partis entre nous et les socialistes modérés ne peut que profiter au peuple."
 GDR_Liberalize_Western_Cultural_Import_Regulations: "Libéraliser la réglementation sur l'importation culturelle"
 GDR_Liberalize_Western_Cultural_Import_Regulations_desc: "Il existe de nombreuses limitations et réglementations qui empêchent la circulation des marchandises en provenance d'Allemagne de l'Ouest. Si nous souhaitons réunifier notre pays, nous devons permettre une plus libre circulation des marchandises entre nous, même si ces marchandises sont « dangereuses »."
 GDR_Investigate_the_National_Political_Outlook: "Enquêter sur les perspectives politiques nationales"
 GDR_Investigate_the_National_Political_Outlook_desc: "Le changement de leadership engendre souvent l'incertitude parmi les citoyens. Il serait sage d'évaluer ce que ressentent les gens et ce qu'ils espèrent voir de notre administration avant de procéder aux réformes."
 GDR_Reward_Loyal_Party_Cadres: "Récompenser les cadres fidèles du parti"
 GDR_Reward_Loyal_Party_Cadres_desc: "Ceux qui ont manifesté un soutien indéfectible à la cause du socialisme devraient être récompensés pour leurs efforts."
 GDR_Expand_Cooperative_Eligibility: "Élargir l'admissibilité des coopératives"
 GDR_Expand_Cooperative_Eligibility_desc: "La propriété coopérative est l'un des principes les plus importants du marxisme. Nous devrions veiller à élargir ce qui peut être détenu collectivement par les travailleurs."
 GDR_Economic_Modernization: "Modernisation économique"
 GDR_Economic_Modernization_desc: "Notre économie prend du retard. Si nous ne rattrapons pas notre homologue occidental, nous serons confrontés à un exode massif, ou pire, à un effondrement."
 GDR_Seek_Revised_Polish_Trade_Treaty: "Réviser le traité commercial polonais"
 GDR_Seek_Revised_Polish_Trade_Treaty_desc: "Nous estimons que notre traité commercial avec la Pologne n'est plus bénéfique et souhaitons réviser certains aspects de l'accord."
 GDR_Increase_Pension_Payments: "Augmenter les paiements de pension"
 GDR_Increase_Pension_Payments_desc: "Il est déplorable que les malades et les personnes âgées doivent se vautrer dans la pauvreté. Une augmentation des retraites s'impose."
 GDR_The_Financing_Question: "La question du financement"
 GDR_The_Financing_Question_desc: "Peu importe le fonctionnement de notre pays ou l'idéologie que nous poursuivons, chaque État doit finalement répondre à cette question incontournable : comment allons-nous payer pour cela ?"
 GDR_Seeking_a_Democratic_Path_to_Socialism: "Une voie démocratique vers le socialisme"
 GDR_Seeking_a_Democratic_Path_to_Socialism_desc: "Nous devons montrer au monde que la lutte armée ou les guerres civiles violentes ne sont pas le seul moyen de réaliser le rêve socialiste. Il existe une voie pacifique et démocratique, celle que nous devons emprunter."
 GDR_Reform_Factory_Leadership: "Leadership de l'usine de réforme"
 GDR_Reform_Factory_Leadership_desc: "Notre système de direction d'usine a besoin de réformes qui contribueront à accroître la productivité. Faisons en sorte que les moyens de production soient entre de bonnes mains !"
