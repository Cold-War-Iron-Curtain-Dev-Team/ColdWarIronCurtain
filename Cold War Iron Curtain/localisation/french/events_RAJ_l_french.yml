 lower_american_food_prices_TT:0 "Baisse des prix des denrées alimentaires aux États-Unis"
 INC_1967.1.d:0 "Depuis la partition, l'armée indienne continue d'exiger beaucoup d'équipement, de financement et de formation. Récemment, un journal a publié un rapport indiquant qu'une part importante des fonds est versée sous forme de pensions aux militaires retraités. Une croissance rapide de l'armée, une augmentation du budget et un soutien à l'expansion ne feront qu'entraîner une augmentation des coûts. Un conseiller économique principal a proposé que le gouvernement ne réponde pas aux demandes de défense dans un avenir proche. Même si cela aurait un impact négatif sur les acquisitions et l'organisation militaires, les avantages économiques dépasseront l'épuisement et une fois l'économie florissante, nous pourrons plus facilement répondre aux demandes en matière de défense. Le ministre de la Défense s'oppose avec véhémence à cette mesure, soulignant que l'Inde se trouve dans un voisinage géographique hostile et doit rester vigilante."

 Swatantra60s.1.d:0 "Les politiques de libéralisation du gouvernement actuel ont radicalisé les agitateurs communistes extrémistes dans les campagnes. Ils ont diffusé de la propagande à travers le pays et organisé des comités paysans violents. Ces paysans attaquent les propriétaires fonciers, saisissant les biens à vendre, les armes et les terres incultes. Dans certaines zones, les commissariats de police ruraux sont envahis et leurs dépôts d'armes vidé. L'armée indienne a proposé un plan visant à déployer des forces paramilitaires dans les points chauds pour rétablir l'ordre public et mettre fin à l'agitation. Parallèlement à l'action militaire, le ministre de l'Intérieur prévoit d'envoyer des fonctionnaires pour négocier avec les villages et calmer les paysans. Le premier ministre a approuvé le plan."
 Swatantra60s.2.d:0 "Les opérations militaires visant les agitateurs paysans se révèlent très efficaces. Nos forces ont récupéré de l'argent et des armes volés. Le professionnalisme de nos forces a permis des opérations de combat mineures ; dans la plupart des cas, les forces paysannes se sont simplement rendues. Les communistes les plus purs et durs ont résisté mais ont été facilement vaincus. L'armée continue de planifier des raids ciblant les communistes purs et durs tandis que les responsables gouvernementaux rencontrent les villages pour négocier avec les paysans. Les médias rapportent constamment des villageois qui renoncent à la violence et s'engagent à travailler avec le gouvernement. Malgré ces premiers succès, les opérations se poursuivent."
 Swatantra60s.3.d:0 "Le gouvernement indien a annoncé qu'il réduirait considérablement ses opérations militaires et de sensibilisation suite à ses récents succès. Ces dernières semaines, l'armée a réussi à neutraliser de nombreux dirigeants communistes inconditionnels, brisant ainsi la résistance paysanne. La majorité des paysans ont accepté de renoncer à la violence et de restituer les armes capturées. Les médias parlent largement de la capacité du gouvernement à gérer les troubles avec un minimum de violence. Les analystes vantent la force des institutions indiennes. La principale préoccupation, cependant, est que de nombreux communistes purs et durs survivants sont entrés dans la clandestinité et continueront sans aucun doute à tenter de semer l'agitation. Mais pour le moment, la situation en matière d'ordre public s'est grandement améliorée en Inde."

 Swantantra67.1.d:0 "Le gouvernement indien a envoyé une délégation de haut niveau visiter le Département d'État et le Pentagone. Ils ont appelé à une coopération plus étroite en matière de défense et de soutien économique. Le gouvernement indien actuel croit au libéralisme et à la démocratie. Ils souhaitent rétablir le lien historique entre l'Inde et l'Occident. Nos propres rapports de renseignement indiquent que le nouveau gouvernement s'oppose à la transition vers le socialisme et aux liens étroits avec les États socialistes que l'État indien a amorcé après l'indépendance. Nous pouvons proposer un programme d'aide économique ou un programme économique et de défense. Cependant, se rapprocher de l'Inde éloignerait le Pakistan et si cela nous préoccupe, nous devrions refuser de signer un accord. Les élections indiennes sont imprévisibles et si l'opposition revient au pouvoir, tous les gains que nous réalisons grâce aux liens avec l'Inde pourraient tout aussi facilement être annulés."
 Swantantra67.2.d:0 "Nos efforts pour resserrer nos liens avec les États-Unis ont porté leurs fruits suite à un accord sur l'aide américaine à l'Inde. Il ne s'agit pas d'une aide financière ou matérielle traditionnelle. Au lieu de cela, les États-Unis fourniront des experts économiques et politiques pour renforcer l'économie indienne et moderniser les pratiques administratives. De nombreux médias félicitent notre gouvernement pour ses négociations réussies et les qualifient de coup d'État contre le Pakistan et ses liens avec les États-Unis. L'opposition grogne et certaines publications de gauche parlent d'un retour au colonialisme, mais dans l'ensemble la réponse a été largement positive."
 Swantantra67.3.d:0 "Nos efforts pour resserrer nos liens avec les États-Unis ont porté leurs fruits suite à un accord sur l'aide américaine à l'Inde. Il ne s'agit pas d'une aide financière ou matérielle traditionnelle. Au lieu de cela, les États-Unis fourniront des experts économiques et politiques pour renforcer l'économie indienne et moderniser les pratiques administratives. En plus de ce soutien économique, les États-Unis fourniront également des conseillers militaires pour améliorer nos capacités, notre technologie et notre production. De nombreux médias félicitent notre gouvernement pour ses négociations réussies et les qualifient de coup d'État contre le Pakistan et ses liens avec les États-Unis. L'opposition grogne et certaines publications de gauche parlent d'un retour au colonialisme, mais dans l'ensemble la réponse a été largement positive."

 INDIA_COM_NEP.1.d:0 "Le gouvernement a reçu des informations selon lesquelles le gouvernement népalais adoptait activement des lois et ciblait les travailleurs dans tout le Népal. Le gouvernement népalais est notamment accusé de réprimer les syndicats et de diffuser la littérature socialiste dans le pays. Le Premier ministre a tenu une réunion du cabinet au cours de laquelle il a approuvé une déclaration parlementaire en faveur des travailleurs népalais. Le Premier ministre a ensuite dû décider comment réagir directement à la situation. Une faction estime que l'Inde devrait envoyer un avertissement au gouvernement népalais pour qu'il mette fin à sa répression contre les innocents. Cependant, une autre faction soutient que la déclaration du Parlement était suffisante et que le gouvernement devrait plutôt ordonner aux services de renseignement de soutenir clandestinement les travailleurs au Népal. Faire trop d'histoires pourrait déstabiliser le Népal et entraver notre capacité à envoyer du soutien de l'autre côté de la frontière."
 INDIA_COM_NEP.2.d:0 "Le gouvernement indien, dominé par le parti communiste, nous a averti, par l'intermédiaire de son ambassadeur, de cesser toute répression ou restriction contre les travailleurs socialistes du Népal. Cela fait référence aux récentes manifestations concernant les droits des travailleurs, qui ont vu quelques incidents de violence entre la police et les manifestants. Nous pouvons certainement accepter les demandes indiennes, elles ne sont pas ouvertement difficiles, et nous resterons vigilants face à la menace communiste. Cependant, compte tenu de la menace agressive indienne, il existe toujours un risque d'agression, notamment de la part de notre plus important voisin. Le ministre des Affaires étrangères a déclaré qu'il pouvait s'adresser soit aux États-Unis, soit à la Chine. Les États-Unis voudraient probablement mettre un terme à l'expansion communiste en Inde. Les Chinois, même s'ils ont un gouvernement similaire à celui de l'Inde, ne devraient pas soutenir une expansion indienne qui lui permettrait de déployer encore plus de forces à la frontière avec la Chine."
 INDIA_COM_NEP.3.d:0 "Le Département d'État a adressé au président une demande urgente du Népal. Le gouvernement népalais affirme que l'Inde commente ouvertement ses affaires intérieures et menace d'une action militaire si le Népal ne s'y conforme pas. La situation sent l'expansionnisme communiste et nous serions tout à fait justifiés de garantir l'indépendance du Népal pendant cette période difficile afin d'étouffer les projets d'expansion indiens. Le Népal est populaire parmi les Américains, notamment parmi les vétérans de la Seconde Guerre mondiale qui ont combattu aux côtés des soldats népalais Gurkha pendant la guerre. Nos analystes estiment que l'Inde ne donnera probablement pas suite à ses menaces, donc garantir le Népal ne présenterait probablement pas de risque élevé. D'autres conseillers estiment que nous ne devrions tout simplement pas nous impliquer, le Népal est entouré d'États hostiles et si l'Inde devait intervenir, les États-Unis se trouveraient incapables de protéger le Népal ou de restaurer la démocratie aux États-Unis. Les deux parties avancent des arguments convaincants, mais une décision doit être prise."
 INDIA_COM_NEP.4.d:0 "Le gouvernement népalais a officiellement demandé l'aide de la Chine alors qu'il fait face à une menace sans précédent de la part de l'Inde. Même si notre point de vue est similaire à celui de l'Inde, le Népal constitue un merveilleux tampon et le perdre exposerait la Chine à une agression indienne si un gouvernement hostile prenait le contrôle de Delhi. La Chine croit également en la souveraineté de toutes les nations et l'Inde peut être considérée comme engagée dans une démarche expansionniste. Il serait peut-être dans l'intérêt de la Chine d'offrir une garantie au Népal. L'autre point de vue note que le Népal serait probablement aussi hostile que n'importe quel futur régime indien et que nous n'avons aucune obligation de soutenir un régime corrompu. Il vaudrait peut-être mieux que la Chine se contente d'observer l'évolution de la situation et ne mette pas en danger l'unité socialiste ou nos propres ressources dans une entreprise insensée."
 INDIA_COM_NEP.5.d:0 "Le gouvernement népalais a refusé en privé et publiquement notre demande de respect des droits humains fondamentaux et de la décence pour ses propres citoyens. Les médias sont furieux et de grandes manifestations de solidarité ont lieu partout en Inde. Les médias rapportent des informations faisant état d'intenses violences perpétrées non seulement contre les travailleurs népalais mais aussi contre les migrants indiens dans le pays. Notre propre gouvernement estime que ces rapports sont probablement exagérés, mais ce n'est pas le moment d'apaiser la passion du peuple. L'armée nous a demandé si nous souhaitions qu'elle élabore des plans d'intervention pour mettre fin au gouvernement réactionnaire au Népal. Nous devons en décider, mais nous devons considérer que le Népal a probablement contacté une ou deux grandes puissances pour demander de l'aide dans cette crise. L'autre élément à considérer concerne les pertes et les coûts potentiels d'une intervention complète. Nous avons envoyé notre avertissement et fait preuve de solidarité, les avantages diplomatiques et politiques ont déjà été obtenus à mesure que l'Inde affirme sa place dans la région. Une décision doit être prise..."
 INDIA_COM_NEP.6.d:0 ""
 INDIA_COM_NEP.7.d:0 ""

 Sino_Indian_War_Redux.150.d:0 "L'APL a réussi à s'emparer de l'étroit couloir de Silgurri, isolant ainsi le nord-est de l'Inde du reste du pays. Cela offre une opportunité unique puisque nous avons réussi à mettre en échec le gouvernement indien. Une option consiste à appeler à un cessez-le-feu et à restituer les territoires, cela réduirait les tensions et ouvrirait la possibilité d'une réconciliation à l'avenir. L'autre option consiste à prendre les frontières contestées et à établir une République populaire de l'Inde dirigée par les révolutionnaires indiens."
 Sino_Indian_War_Redux.151.d:0 "Le gouvernement chinois a annoncé la création de la République populaire de l'Inde dans les États occupés du nord-est de l'Inde. Le nouveau gouvernement sera dirigé par Charu Majumdar. Le nouveau gouvernement a appelé tous les Indiens révolutionnaires à venir, avec la promesse d'étendre éventuellement la révolution à l'Inde. Le gouvernement indien, rejoint par les États-Unis, a condamné ce qu'ils appellent un État client de la Chine. Des troubles et des manifestations ont été signalés dans les grandes villes indiennes, beaucoup étant stupéfaits par l'ampleur du revers."

 SINO_INDIAN_WAR.150.d:0 "Le gouvernement indien a lancé une campagne diplomatique majeure, ses représentants s'adressant aux gouvernements et aux médias au sujet du différend en cours avec la Chine. L'Inde affirme que les soldats chinois continuent de déplacer leurs forces au sud de la ligne McMahon, en violation des accords internationaux. Les diplomates indiens ont noté que ses forces armées étaient actuellement déployées pour contrer cette menace et empêcher une occupation chinoise forcée. Le gouvernement chinois a condamné les revendications indiennes, accusant l'armée indienne d'avoir violé la frontière pour expulser de force ses propres forces."
 SINO_INDIAN_WAR.151.d:0 "Nos opérations militaires contre la Chine ont démontré les forces mais aussi les faiblesses de nos capacités. Certains appellent à recentrer certaines de nos ressources. Un groupe de responsables civils et militaires estime que les mécanismes de renseignement actuels ne parviennent pas à fournir des renseignements militaires adéquats, soulignant le manque de cartes précises. Ce groupe de responsables souhaiterait que l'accent soit davantage mis sur la collecte de renseignements militaires plutôt que sur d'autres formes. Un autre groupe de responsables civils et militaires a noté que le mécanisme de commandement donnait parfois aux responsables civils, en particulier au ministre de la Défense, trop d'autorité en matière militaire. Ces responsables souhaiteraient une réforme au plus haut niveau. Le gouvernement doit décider s'il doit recentrer nos services de renseignement ou réformer les niveaux supérieurs du commandement militaire."
