l_french:
 PM_Shastri.1.d:0 "Le chef du Congrès national indien, Lal Bahadur Shastri, est décédé du jour au lendemain. Un porte-parole n'a donné aucun détail, confirmant seulement que le chef de l'opposition était décédé subitement. Shastri est un vétéran du Congrès et dirigeait le Parti du Congrès après le décès de Jawaharlal Nehru. Son expérience, son attitude calme et son sens politique ont fait de lui un leader politique très efficace. Bien que tout indique que sa mort est due à des causes naturelles, des rumeurs circulent selon lesquelles Shastri pourrait avoir été victime d'un complot. Le Parti du Congrès prévoit de tenir des pourparlers immédiats pour déterminer un nouveau chef du parti. Indira Gandhi, la fille de Nehru, est clairement la favorite pour prendre la relève et tenter de ramener le parti au pouvoir."
 goa.1.d:0 "Après des siècles de répression, les Indiens de Goa réclament la liberté. Les grèves et les manifestations pro-indiennes se poursuivent pour exiger que les Portugais mettent fin à leur règne sur le territoire. En effet, les responsables de la région signalent qu'un grand nombre d'Indiens quittent Goa pour se libérer et échapper à la violence. Afin de prévenir l'instabilité et de démontrer notre détermination, le gouvernement a approuvé des ordres visant à déployer des forces militaires le long de la frontière de Goa. La présence de nos troupes remontera le moral et avertira clairement les Portugais qu'ils ne peuvent pas agir en toute impunité."
 goa.2.d:0 "Le commandant militaire de Goa a envoyé un rapport urgent à Lisbonne. Il a détaillé une large mobilisation de forces militaires par l'Inde à la frontière de Goa. Le nombre de troupes, l'équipement et le positionnement indiquent clairement qu'il ne s'agit pas de déploiements défensifs. Cela place nos forces à Goa dans une situation militaire désespérée, car elles sont en infériorité numérique, sous-armées et à des kilomètres de tout soutien. Nous devons désormais agir avec prudence, car l'Inde semble fortement intéressée par une option militaire. Les responsables civils ont également envoyé un rapport indiquant que les médias indiens semblent travailler avec le gouvernement pour diaboliser notre présence."
 goa.3.d:0 "Goa a longtemps été une tache sur la carte pour le peuple indien. Les Indiens patriotes ne comprenaient pas comment des colonies coloniales européennes pouvaient exister à côté d'une Inde libre. Dans cette situation, le gouvernement indien a cherché une solution avec le Portugal, mais celui-ci a refusé. Finalement, l'opération Vijay a été lancée. Malgré des avantages militaires apparemment importants sur les Portugais, l'opération échoua. Jamais depuis la bataille de Plassey une puissance indienne indépendante n'avait subi une défaite aussi éclatante face à une puissance européenne. Nous devons réévaluer notre armée. Beaucoup affirment qu'il conserve trop de pratiques et de structures de l'époque coloniale et qu'il lui manque un esprit national. Malgré le grand nombre d'officiers ayant l'expérience du combat, l'armée a complètement échoué dans ce qui semblait être une tâche facile. Le Portugal jubile et attend avec impatience de dicter ses conditions, nous devons panser nos blessures de cette humiliation."
 goa.4.d:0 "Lorsque la nouvelle de la victoire militaire à Goa parvint à Lisbonne, la population commença à célébrer avec jubilation. L'invasion indienne a constitué le plus grand défi pour la politique de lutte militaire contre la décolonisation. Nos forces faisaient face à un ennemi vétéran bénéficiant d'avantages en termes de taille et de géographie. Malgré ces obstacles redoutables, nos forces, dirigées de manière experte et dotées de troupes très motivées, ont réussi ce qui semblait impossible : une défense réussie de Goa. La politique gouvernementale consistant à refuser les négociations avec l'Inde semble désormais justifiée. Les observateurs notent que la victoire renforce le gouvernement et fait apparaître le Portugal comme une puissance tenace à l'échelle mondiale. Militairement, une expérience précieuse et, plus important encore, une confiance ont été acquises. Le Portugal peut désormais dicter avec succès l'Inde et préserver Goa."
 goa.5.d:0 "La défense de Goa allait toujours être une tâche difficile. Le territoire est encerclé par l'Inde et la population hostile à notre présence. L'ONU n'a pas réussi à demander des comptes à l'Inde pour ses politiques agressives avant ou pendant le conflit. Nos propres alliés ont ignoré les appels à l'aide lorsque l'armée indienne a mobilisé des forces offensives à la frontière de Goa. Cependant, malgré des obstacles redoutables, la garnison a fait son devoir et a résisté du mieux qu'elle a pu. Aujourd'hui, le gouvernement a été informé que nos forces se sont rendues après avoir épuisé leur capacité de résistance. Même si nos alliés européens et les États-Unis ont émis des condamnations, il est clair que leur réaction ne dépassera pas le cadre diplomatique. Les habitants de Lisbonne ont compris que la tâche était très difficile, mais on s'attend toujours à ce qu'ils soient plutôt déprimés à mesure que la nouvelle arrive."
 goa.6.d:0 "La petite nation du Portugal a défié les prédictions de tous les observateurs et a défendu avec succès sa colonie de Goa contre une invasion de l'Inde. L'armée indienne, bien qu'elle possède des avantages dans toutes les catégories, notamment en termes géographiques, n'a pas réussi à les mobiliser pour mener une intervention réussie. Depuis des mois, les tensions s'étaient accrues alors que les résidents pro-indiens de Goa protestaient de plus en plus contre la domination portugaise à Goa. L'armée indienne, après s'être mobilisée, a lancé l'opération Vijay (Victoire) pour résoudre fermement le problème, mais a été stupéfaite par la féroce défense portugaise. Le succès du Portugal a enhardi le gouvernement et sa position auprès de ses citoyens. Alors qu'à New Delhi, le gouvernement fait face à des discours de colère de la part de l'opposition et dans tout le pays, des responsables gouvernementaux ainsi que des militaires seraient confrontés à des insultes suite à cette humiliante défaite."
 goa.7.d:0 "Goa a longtemps été un défaut pour le peuple indien. Les Indiens patriotes étaient furieux à l'idée d'enclaves coloniales européennes existant à côté d'une Inde libre. Après que le Portugal ait refusé toute ouverture diplomatique et face à la montée des tensions, l'armée a commencé à se mobiliser à la frontière. Peu de temps après, l'opération Vijay a été lancée avec l'intention de libérer Goa de près de 500 ans de colonialisme portugais. L'armée indienne a démontré sa formation moderne et sa force militaire en battant rapidement les Portugais. Les habitants de Goa ont soutenu les troupes dans leur progression et la victoire a provoqué un sentiment d'euphorie massive dans toute l'Inde. L'opération démontre que l'État indien a la capacité de résoudre rapidement les différends régionaux par le biais d'options militaires, ce qui incitera sans aucun doute les États à respecter ce que nous pouvons faire."
 goa.8.d:0 "450 ans de présence coloniale portugaise en Inde ont officiellement pris fin après la prise réussie de Goa par les Indiens. L'indépendance de l'Inde a déclenché la montée du nationalisme parmi les Indiens de la colonie portugaise de Goa. Ses tentatives pour discuter du statut de Goa ont été constamment refusées par le Portugal. Cependant, lors des récents troubles, l'armée indienne a constitué une force importante autour de la colonie et a ordonné une intervention, invoquant la nécessité de protéger les Indiens de Goa. Après un bref conflit, la garnison portugaise, beaucoup plus petite, capitula. Les efforts portugais pour rallier un soutien international ont échoué car peu de pays avaient envie de soutenir une puissance coloniale. Partout en Inde, il existe un sentiment de fierté et de joie face à l'expulsion réussie d'une puissance coloniale du sous-continent et aux prouesses militaires de l'armée indienne."
 goa.9.d:0 "Le gouvernement indien a annoncé qu'après avoir épuisé tous ses efforts pour parvenir à une résolution pacifique, il déployait ses forces armées pour libérer Goa de près de cinq siècles de colonialisme. Ces derniers mois, les autorités portugaises ont eu du mal à gérer les manifestations et les grèves des sujets locaux pro-indiens. Les observateurs estiment que l'armée indienne bénéficie d'un avantage majeur en termes de nombre, d'équipement et d'expérience. Le gouvernement portugais a condamné ce qu'il qualifie d'agression indienne, promettant que sa garnison repousserait toute attaque. Le Portugal a rejeté pendant des années toute négociation avec l'Inde sur Goa, un revers majeur pourrait représenter un coup dur pour le gouvernement actuel. Pour les Indiens, l'opération permettra à l'Inde de montrer ses muscles en tant que puissance régionale."


 India_Elects_70s.1.d:0 "Le peuple indien s'est rendu aux urnes pour ce que beaucoup considèrent comme l'élection la plus disputée de l'histoire de l'Inde. L'élection voit le Parti du Congrès dirigé par Indira Gandhi s'opposer à Moraji Desai et son parti Janata. Le Parti du Congrès se présente sur un programme appelant à une transformation plus socialiste de l'Inde. Le parti Janata promet de restaurer l'Inde dans la vision du Mahatma Gandhi et condamne le Congrès pour avoir cherché à appliquer une idéologie étrangère au peuple indien. Janata promet un retour aux valeurs indiennes traditionnelles et une protection des industries et des producteurs agricoles indiens. Le peuple indien doit décider d'une plus grande socialisation ou d'une poussée en faveur de l'Inde imaginée par ses premiers combattants de la liberté."
 India_Emergency.20.d:0 "Invoquant l'instabilité actuelle et la crise économique, le gouvernement indien dirigé par la Première ministre Indira Gandhi a annoncé la suspension de toutes les élections. Les principaux journaux urbains ont vivement critiqué cette décision. Cependant, les médias pro-Congrès ont exprimé haut et fort leur soutien. L'opposition appelle à des manifestations massives dans les prochains jours, de nombreux responsables politiques accusant le gouvernement de retarder les élections jusqu'à ce qu'il en établisse le contrôle total. En réponse, le Parti du Congrès a appelé ses propres partisans à préparer leurs propres événements pour soutenir le gouvernement pendant cette période critique. Il semble que la situation politique en Inde reste instable et incertaine."
 India_Emergency.17.d:0 "La Première ministre Indira Gandhi a déclaré que l'état d'urgence touchait à sa fin et que de nouvelles élections auraient lieu dans quelques mois. Elle a demandé au gouvernement de libérer tous les prisonniers politiques afin de permettre une campagne électorale libre et ouverte. Indira Gandhi décrit l'élection et la levée des restrictions d'urgence comme une progression naturelle. Elle a exprimé son espoir que le peuple confirmera son soutien au Congrès lors des élections. Cependant, l'opposition prétend que c'est la pression du peuple indien qui a forcé le gouvernement à organiser des élections. Presque tous les partis d'opposition affirment déjà que les prochaines élections se dérouleront entre le maintien de la dictature et la démocratie."
 India_Emergency.1.d:0 "Le juge Jagmohanlal Sinha a rendu un verdict dans l'affaire État de l'Utter Pradesh c. Raj Narain. Raj Narain, qui a perdu son élection à la chambre basse du Parlement face au Premier ministre Indira Gandhi, a fait appel contre l'énorme victoire électorale de Gandhi. Il allègue que Gandhi et le Parti du Congrès ont utilisé les ressources gouvernementales, la corruption et d'autres moyens pour assurer une victoire de deux contre un sur lui. Le juge, dans un verdict stupéfiant, a donné raison à Narain et a annulé la victoire de Gandhi. Indira Gandhi n'a pas le droit d'accéder au poste de Premier ministre. Le juge a ordonné au Parti du Congrès de choisir un nouveau Premier ministre dans un délai de 20 jours. L'opposition et le Congrès estiment que si le verdict est accepté, de nouvelles élections devront être organisées. Indira Gandhi pourrait accepter le verdict ou faire appel à la Cour suprême, ce qui lui permettrait de rester Premier ministre. Ses conseillers estiment que si elle fait appel, elle devrait déclarer l'état d'urgence pour prévenir l'instabilité et garantir la neutralité des tribunaux."

 Sikkim_Accension.1.d:0 "Le chef du Parti du Congrès national du Sikkim (SNCP) a appelé le gouvernement indien à achever l'intégration du Sikkim à l'Inde. Cela fait suite à des actes récents du parlement indien visant à remodeler les relations du Sikkim avec l'Inde, passant d'un protectorat à un État au sein de l'Union indienne. Le Chogyal du Sikkim continue de résister à de telles tentatives, appelant plutôt à un référendum libre et équitable sur la question de savoir si le Sikkim doit rester un protectorat ou rejoindre l'Union indienne. Le Premier ministre indien doit décider s'il doit répondre au SNCP, qui a été élu par le peuple et intervenir, ou s'il doit prendre du recul et refuser d'intervenir directement."
 Sikkim_Accension.2.d:0 "La capitale du Sikkim était en effervescence et peur lorsque ses habitants ont vu les troupes indiennes entrer dans la ville et sécuriser les principaux bâtiments gouvernementaux, y compris le palais. Le gouvernement indien a déployé ses forces après avoir reçu une demande des élus du Sikkim et dans la crainte que la situation ne dégénère en affrontements. L'armée indienne affirme que ses forces sont là uniquement pour protéger la population et non pour s'immiscer dans ses affaires. Cette décision est fermement condamnée dans certains cercles comme une ingérence flagrante dans les affaires du Sikkim. Cependant, de nombreux Indiens félicitent le gouvernement pour avoir mieux facilité l'intégration d'un nouvel État pour l'Union indienne. Le Premier ministre indien a annoncé qu'un référendum sur l'avenir du Sikkim aurait lieu prochainement pour déterminer les futures relations entre le Sikkim et l'Inde."
 Sikkim_Accension.3.d:0 "Sous la supervision de l'armée indienne, la population du Sikkim a voté pour savoir s'il souhaitait rejoindre l'Union indienne ou rester sous protectorat. Après avoir compilé les résultats, plus de quatre-vingt-quinze pour cent de la population ont voté en faveur de l'adhésion à l'Union indienne. Les partisans pro-indiens sont descendus dans la rue pour célébrer les résultats, même si certains des quartiers les plus favorables à la monarchie étaient remarquablement calmes. Certains observateurs ont noté que les circonstances du vote semblaient précipitées et que des rumeurs courent selon lesquelles le gouvernement indien aurait manipulé les bulletins de vote pour obtenir une victoire électorale complète. Quoi qu'il en soit, la monarchie du Sikkim est abolie et l'Inde accueillera bientôt un nouvel État dans l'union."
 Sikkim_Accension.4.d:0 "Le parlement indien a voté un nouvel amendement constitutionnel pour intégrer officiellement le Sikkim en tant que nouvel État de l'Union indienne. La relation de protectorat précédente a été levée et la gouvernance du Sikkim se fera conformément aux lois de l'Inde. Ceci achève le long processus d'intégration de l'ancien État princier colonial à l'Inde. L'amendement a bénéficié d'un soutien universel au Parlement et l'intégration du Sikkim est considérée comme un grand succès pour le Premier ministre. Les gouvernements chinois et pakistanais ont condamné les actes récents, les qualifiant d'annexion manifeste."

 INC_VICTORY.1.d:0 "La récente législation adoptée pendant l'état d'urgence a été récemment confirmée par la Cour suprême. Il s'agit d'une victoire majeure pour le gouvernement du Congrès. Ces dernières années, le Parti du Congrès et Indira Gandhi ont travaillé dur pour affaiblir le puissant système judiciaire indien. Les juges utilisant leur pouvoir pour s'immiscer dans la politique et le gouvernement ont été démis de leurs fonctions et une nouvelle législation a limité le contrôle judiciaire. Cette dernière victoire confirme le succès de leurs efforts pour contrôler le pouvoir judiciaire. Les dirigeants de l'opposition ont fermement condamné les décisions de justice, certains accusant les juges de servir d'approbation automatique à un régime non démocratique."
 INC_VICTORY.2.d:0 "La vieille garde et l'opposition du Parti du Congrès appartiennent à une époque politique différente en Inde. Beaucoup, bien qu'ils proclament une vision de gauche, sont toujours le produit d'écoles et d'idées coloniales. Une nouvelle génération de jeunes militants du Congrès émerge comme de fervents partisans d'Indira Gandhi et de ses efforts pour s'engager plus directement auprès du peuple indien. Ce sont des hommes et des femmes éduqués dans une Inde indépendante. Cette jeunesse montante est dirigée par le fils d'Indira Gandhi, Sanjay Gandhi. Ces dernières semaines, nombre de ces militants très motivés ont été promus ou nommés à des postes élevés au sein du Parti et du gouvernement. Même si le Premier ministre salue cette évolution, de nombreux membres plus âgés du Parti s'inquiètent de plus en plus des idées radicales promues. Un éditorial rédigé par un fidèle du Congrès à la retraite accusait même le Premier ministre de consolider son autorité totale sur le Parti du Congrès."
 INC_VICTORY.3.d:0 "Le Parti du Congrès a envoyé une délégation, dirigée par un haut responsable du parti sikh, pour s'entretenir avec certains dirigeants sikhs. La communauté sikh s'est fortement opposée à l'état d'urgence, organisant des manifestations et accusant le gouvernement de tendances fascistes. Même si de nombreux membres éminents de l'opposition sikh n'étaient pas présents, certains dirigeants modérés y ont participé. Le gouvernement leur a assuré qu'il n'avait aucune intention de renverser la démocratie indienne. En outre, des promesses ont été faites d'abandonner les poursuites judiciaires et de libérer certains des Sikhs arrêtés lors des manifestations. Les pourparlers n'ont pas résolu les tensions au Pendjab mais ont réduit les tensions entre la communauté sikh et le Parti du Congrès."
 India_Econ.6.d:0 "Un conseil fédéral de développement débat de l'opportunité de promouvoir les industries à Bombay ou à Madras. Ce sont deux grandes villes et leurs politiciens nationaux exercent une immense pression sur le Premier ministre pour qu'il fasse pression en faveur de leur ville. Bombay et Madras sont toutes deux des villes portuaires historiques dotées d'une immense influence culturelle et politique. Choisir Bombay renforcerait le Premier ministre et ses relations avec la puissante industrie économique et cinématographique. Soutenir Madras attirerait l'attention du Premier ministre auprès du sud de l'Inde et de ses liens avec d'autres comptoirs commerciaux majeurs de l'océan Indien."
 India_Econ.7.d:0 "Un conseil fédéral de développement réfléchit aux endroits où investir dans de nouvelles usines sidérurgiques dans le pays. Les deux villes sont Delhi et Bangalore. Sur le papier, Delhi semble idéale compte tenu de son histoire en tant que centre industriel majeur et de son emplacement par rapport à la capitale. Cependant, Bangalore est une ville historiquement vitale du sud de l'Inde. La construction des aciéries là-bas renforcerait les relations entre le nord et le sud de l'Inde. Le Premier ministre doit décider quel site construire."
 India_Econ.8.d:0 "Les régulateurs financiers et le ministre des Finances ont contacté le Premier ministre. Ils notent la croissance rapide du secteur bancaire dans le pays et la nécessité de promouvoir les institutions financières. Gujrat et Hyderabad sont présentés comme des sites potentiels pour encourager la création de nouvelles banques et de nouveaux marchés financiers. Gujrat est historiquement une plaque tournante commerciale majeure et un tel investissement pourrait constituer une aubaine pour le commerce avec le Moyen-Orient. Investir à Hyderabad ouvrirait aux habitants de la région la possibilité d'accéder aux institutions financières. Le Premier ministre doit décider."
 India_Econ.11.d:0 "Le gouvernement fédéral est confronté à d'intenses réactions de la part des journaux et des partis politiques régionaux du sud de l'Inde. Ils rédigent des rapports soulignant la tendance du gouvernement fédéral à investir dans les États du nord de l'Inde. Beaucoup d'auteurs parmi les plus agressifs prétendent que le sud de l'Inde est en train de devenir une semi-colonie répondant aux besoins des Indiens du nord. Le Premier ministre a nié ces accusations et ses alliés politiques du sud s'expriment. Il faudra cependant beaucoup de temps au gouvernement indien pour reconstruire ses liens avec la population du sud de l'Inde."
 India_Econ.12.d:0 "Le gouvernement fédéral est confronté à d'intenses réactions de la part des journaux et des partis politiques régionaux du nord de l'Inde. Ils écrivent des articles condamnant le gouvernement pour avoir réagi de manière excessive aux craintes des États du sud de l'Inde d'être négligés par le gouvernement fédéral traditionnellement dominé par le nord de l'Inde. De plus en plus d'auteurs affirment que les États du nord de l'Inde sont punis pour avoir été à l'avant-garde de la libération et sont entravés par ces préjugés et ces quotas. Le Premier ministre a nié ces accusations, affirmant que les décisions étaient entièrement fondées sur une analyse impartiale. Il faudra cependant beaucoup de temps au gouvernement fédéral indien pour reconstruire ses liens avec la population et les gouvernements du nord de l'Inde."

 KashmirIND70.1.d:0 "La situation au Cachemire reste dans le flou. Nos forces conservent le contrôle de zones clés, mais les Pakistanais continuent d'occuper des zones clés du territoire. Ils sont également catégoriques dans leurs ambitions de voler la province entière et fomentent des troubles parmi les Cachemiriens. De hauts responsables de la défense, de la politique et du renseignement se sont récemment réunis pour discuter de la situation. Une option consiste à se concentrer sur la sécurité intérieure afin de prévenir d'éventuels soulèvements, notamment ceux parrainés par le Pakistan. Une telle orientation élargirait également notre base de soutien parmi les Cachemiriens. La deuxième option consiste à envisager une offensive limitée au-delà de la frontière. Une telle action pourrait améliorer notre position à la frontière et démontrer aux Pakistanais la futilité de rechercher une solution militaire à l'avenir."
 KashmirIND70.25:0 "La police et les agents des renseignements de Srinagar ont identifié plusieurs étudiants et agitateurs politiques clés prônant l'indépendance du Cachemire ou l'unification avec le Pakistan. Ces agitateurs organisent régulièrement des réunions qui se transforment parfois en manifestations publiques. Une option consiste à arrêter ces agitateurs, ce qui pourrait mettre fin à toute manifestation dans un avenir proche. Cependant, cela pourrait se retourner contre vous et provoquer davantage de troubles. L'autre option consiste simplement à garder un oeil sur les manifestants et à accepter le rythme actuel des manifestations, en intervenant de manière à empêcher leur expansion."
 KashmirIND70.26:0 "La récente arrestation d'agitateurs publics au Cachemire a eu un impact profond sur les troubles dans la région. Le manque de leadership a provoqué un déclin des réunions organisées et des manifestations publiques. Il semble que les militants inconditionnels restants soient incapables de transmettre leur message au peuple. Nous nous attendons à ce qu'une nouvelle génération de dirigeants émerge finalement, mais cela prendra du temps et il semble que notre opération ait complètement déraciné l'infrastructure de protestation à Srinagar. Les arrestations ont également révélé que certains des dirigeants étaient parrainés par les services de renseignement pakistanais."
 KashmirIND70.27:0 "Après les prières du vendredi, des milliers de personnes sont descendues dans les rues de Srinagar pour protester contre l'arrestation des principaux agitateurs de la ville. Notre opération visant à arrêter ces agitateurs n'a pas abouti à la décapitation des dirigeants de la protestation. Au lieu de cela, les agitateurs restants ont élaboré un plan pour faire connaître les arrestations et utiliser les sermons de la prière du vendredi comme un lieu pour encourager les troubles. Les manifestations sont bien plus importantes que par le passé et ont attiré l'attention des médias internationaux. Les Pakistanais en profitent pour diffuser leur propre propagande. Il faudra probablement relâcher certains agitateurs pour apaiser les tensions."
 KashmirIND70.30.d:0 "L'Inde a lancé des émissions de radio ciblant notre présence au Cachemire. Ils présentent notre libération des Cachemiriens comme une occupation qui a provoqué la séparation des familles dans la vallée du Cachemire. Plus important encore, les Indiens font une fausse propagande selon laquelle les Cachemiriens en Inde jouissent de tous les droits démocratiques, tandis que les Cachemiriens pakistanais sont sous occupation militaire. Des efforts sont déployés pour contrer ce récit, mais pour certaines familles cachemiriennes qui ont vu leurs terres occupées par des soldats ou des familles séparées, ces messages sont attrayants. Les manifestations étudiantes se multiplient également pour réclamer davantage d'autonomie et de droits administratifs pour le gouvernement de l'Azad Cachemire."
 KashmirIND70.2.d:0 "L'un de nos responsables des achats à l'étranger, alors qu'il rendait visite à un fabricant d'équipements d'escalade en montagne pour certains achats, a remarqué plusieurs pièces d'équipement portant des marques militaires indiennes. En s'informant discrètement auprès de certains employés, il découvrit que l'Inde passait une commande importante d'équipements de guerre en montagne. Nous ne savons pas ce que cela signifie, mais l'ampleur de la commande et le calendrier indiquent que les Indiens préparent peut-être une mésaventure. Peut-être aux frontières de l'Himalaya ou au Cachemire. Certains au sein du GHQ demandent un redéploiement des forces vers le front du Cachemire au cas où, tandis que d'autres généraux affirment qu'une telle réaction excessive pourrait laisser d'autres fronts ouverts à l'agression indienne."

 PostSimla.1.d:0 "L'éminent dirigeant cachemirien Cheikh Abdallah et le Premier ministre [IND.GetLeader] ont signé un accord appelé Accords de Cheikh. Cet accord fait suite à la récente victoire militaire de l'Inde sur le Pakistan. Alors que l'équilibre stratégique des pouvoirs penche désormais résolument en faveur de l'Inde, le dirigeant cachemirien a décidé qu'il devait parvenir à un accord. L'accord appelle à la mise en oeuvre d'amendements constitutionnels pour commencer à intégrer formellement le Cachemire à l'Inde. La première région du Cachemire à devenir un État indien sera le Jammu. Le chemin vers l'annexion et l'intégration formelles a commencé pour le Cachemire. Les nationalistes pakistanais et cachemiris dénoncent cet accord comme une capitulation du cheikh Abdallah."
 PostSimla.2.d:0 "Amanullah Khan, un nationaliste cachemirien basé au Royaume-Uni, a récemment fondé une nouvelle organisation appelée Front de libération du Cachemire à Birmingham. Khan est un nationaliste réputé, ayant participé au détournement d'un vol d'Indian Airlines avant de s'enfuir en Angleterre. Il est vénéré par l'importante communauté cachemirienne du pays. Le groupe gagne rapidement en popularité et crée des sections en Europe occidentale, au Pakistan, aux États-Unis et dans le Golfe. L'organisation n'est actuellement pas engagée dans un conflit direct avec l'État indien, mais elle se développe, s'organise et fait campagne pour les droits politiques du Cachemire. Ce n'est qu'une question de temps avant que le gouvernement indien doive traiter directement avec ce groupe, dont les publications gagnent en popularité à Srinagar et dans la vallée du Cachemire."
 PostSimla.3.d:0 "La Conférence nationale (NC) a remporté de manière décisive les élections nationales du Jammu-et-Cachemire indien. Les observateurs notent qu'il s'agit des élections les plus libres organisées dans l'État depuis l'adhésion de l'Inde, l'ancien État princier à l'Inde. Le NC est le parti politique le plus ancien de l'État et prétend représenter l'ensemble de la population de l'État. La victoire électorale est une victoire majeure pour le gouvernement indien dans la mesure où le NC est un proche allié de New Delhi. Les militants du Cachemire à l'étranger et au Pakistan seront déçus du résultat. Les journaux indiens saluent les résultats, qui confirment que le conflit du Cachemire a été fermement résolu en faveur de l'Inde après sa victoire sur le Pakistan."

 Janata.1.d:0 "La coalition du parti Janata a récemment rejeté les lois de l'état d'urgence restreignant les grèves ouvrières ou politiques. Le Premier ministre a déclaré que les grèves et les actes de désobéissance civile ont joué un rôle essentiel dans l'indépendance de l'Inde et dans la fin de l'état d'urgence. Comme ces activités permettent aux citoyens de se faire entendre, il n'appartient pas au gouvernement d'interférer ou de restreindre ces activités. Il a ajouté que cela poursuit sa vision de voir l'Inde revenir à la vision que le Mahatma Gandhi avait pour la nation. Les entreprises et les propriétaires d'usines seraient déçus par cette décision, affirmant que rien n'empêche les infiltrés politiques de manipuler les travailleurs et d'en profiter pour utiliser les grèves comme moyen de paralyser l'économie pour soutenir des programmes plus radicaux."
 Janata.2.d:0 "Le gouvernement indien envisage de présenter au Parlement une loi obligeant les sociétés étrangères à conclure des partenariats avec des sociétés indiennes. Les partisans de la législation affirment qu'elle favorisera la croissance industrielle locale et favorisera l'auto-efficacité. Ils affirment que les sociétés étrangères se conformeraient volontiers à la loi pour pénétrer le vaste marché indien et que de telles relations aideraient l'industrie indienne à se moderniser rapidement. Les opposants à la législation craignent que le potentiel boom industriel national promis par les partisans du projet de loi ne se matérialise pas et que les sociétés étrangères finissent par quitter le marché indien. Le premier ministre doit décider s'il adopte ou non le projet de loi. S'il refuse, il s'exposera à des réactions négatives de la part du parti."
 Janata.3.d:0 "La récente législation qui obligeait les sociétés étrangères à conclure des partenariats avec des sociétés indiennes locales s'est retournée contre eux. Coca Cola et IBM font partie des entreprises étrangères les plus en vue qui ont annoncé leur intention de quitter l'Inde. Les entreprises considèrent les nouvelles lois indiennes comme trop perturbatrices pour la croissance et ont choisi de quitter le marché indien. Le gouvernement indien a tenté de faire preuve de courage en affirmant que les producteurs indiens répondraient à la demande des consommateurs pour ces produits. Les économistes proposent une évaluation plus pessimiste. Ils notent que le manque de produits étrangers entravera le développement économique de l'Inde. Le manque d'entreprises étrangères nuira à l'accès à la technologie et entravera la capacité des entreprises indiennes à rivaliser avec les produits sur le marché international."
 Janata.4.d:0 "Ces dernières semaines, le parti Janata au pouvoir a adopté des amendements constitutionnels annulant ceux adoptés pendant l'état d'urgence. Le gouvernement note que ces amendements visaient à légitimer une prise de pouvoir non démocratique et à donner un pouvoir extraordinaire à l'exécutif. Les nouvelles réformes visent à restaurer la crédibilité du système judiciaire et à garantir que de futures tentatives visant à saper la démocratie indienne ne puissent avoir lieu. Le Premier ministre a affirmé que l'Inde était fermement redevenue la plus grande démocratie du monde. Cette décision est largement saluée dans les médias, même si plusieurs dirigeants de l'opposition ont exprimé leurs inquiétudes quant au fait qu'ils seraient désormais ouverts à des poursuites."
 Janata.5.d:0 "Le parti Janata est composé de partis socialistes, favorables aux entreprises, régionaux et religieux à travers l'Inde. Il a des intérêts contradictoires et un certain nombre de partenaires de coalition ont des points de vue opposés. Malgré sa victoire, le parti Janata gouverne actuellement avec une coalition faible. Récemment, les députés de gauche du Janata ont indiqué qu'ils ne voteraient peut-être pas toujours avec le parti au Parlement. On craint que le Parti du Congrès n'exploite cela à son avantage et ne sape le programme législatif du gouvernement. Le Premier ministre a appelé à une réunion de tous les principaux partenaires de la coalition et des dirigeants du Janata pour trouver une solution et renforcer la coalition."
 Janata.6.d:0 "Le Premier ministre a cherché à renforcer le soutien au sein du parti Janata et de ses alliés de coalition, en particulier auprès de ses membres de gauche lors d'une récente réunion. Cependant, ces efforts ont échoué et l'aile gauche du parti affirme désormais catégoriquement qu'elle ne garantira pas son vote sur toutes les questions, notamment celles liées à l'économie. Ils continuent de condamner le Congrès pour sa structure autocratique, mais prétendent qu'ils ne peuvent pas trahir les travailleurs indiens à des fins politiques. Le gouvernement a cherché à apaiser leurs craintes et a promis un programme économique équilibré, mais les députés de gauche ont refusé de faire des compromis sur leur position. Le Premier ministre devra faire face à une coalition encore plus faible et à des batailles législatives plus difficiles au Parlement."
 Janata.7.d:0 "Le Premier ministre a cherché à renforcer le soutien au sein du parti Janata et de ses alliés de coalition, en particulier auprès de ses membres de gauche lors d'une récente réunion. Les pourparlers ont été un succès majeur puisque l'aile gauche de la coalition a accepté de ne pas retirer son vote en faveur de projets de loi gouvernementaux qu'elle juge trop favorables aux entreprises ou au capitalisme. Ils ont toutefois accepté à condition que Janata restreigne certaines de ses propositions législatives et continue de soutenir les efforts visant à protéger les droits des travailleurs en Inde. Il s'agit d'un petit compromis et le Premier ministre peut être assuré que sa coalition est désormais beaucoup plus forte qu'au début."
 Janata.8.d:0 "Le parti Janata a annoncé une série de nouvelles réformes pour les agences de renseignement du pays. Les officiers militaires attachés à ces agences seront déplacés de certains postes et remplacés par des fonctionnaires civils. Le cabinet exercera également une surveillance plus directe de ces agences. Les opérations nationales doivent toutes cesser immédiatement, y compris les enquêtes en cours. Le gouvernement espère que ces réformes permettront aux agents du renseignement de se concentrer sur les menaces étrangères et de ne plus être exploités par un futur gouvernement comme ce fut le cas pendant l'état d'urgence. Le déplacement des officiers militaires empêchera également toute ingérence militaire dans les affaires intérieures."
 Janata.9.d:0 "Le Premier ministre a créé la Commission Mandal pour identifier les classes socialement ou éducativement arriérées en Inde et présenter des recommandations sur l'autonomisation de ces groupes. La commission a identifié des castes spécifiques qui sont en retard dans le développement social, l'éducation et sur le plan économique. Le rapport final recommande une série de réformes. L'un d'eux appelle à la prévention des prêts abusifs envers les castes privées de leurs droits. Les recommandations les plus controversées appellent à l'établissement de quotas pour les postes gouvernementaux et les établissements d'enseignement. Si le Premier ministre décide de commencer à mettre en oeuvre ces propositions, il risque de subir des réactions négatives de la part des communautés qui n'entrent pas dans la catégorie d'une classe arriérée mais qui se sentent également privées de leurs droits. L'autre option consiste simplement à classer les recommandations Mandal et à les laisser à un autre gouvernement, ce qui provoquerait la colère de ces communautés."

 IND_PRC70s.1.d:0 "Le nouveau gouvernement indien dirigé par Moraji Desai a demandé à envoyer une délégation en visite. Le nouveau gouvernement indien souhaite lancer des mesures de confiance afin d'améliorer les relations et de faciliter une résolution pacifique de nos problèmes actuels. Beaucoup de nos experts en relations étrangères estiment que nous devrions rencontrer les Indiens, car l'amélioration des relations pourrait ouvrir l'accès au commerce avec l'Inde et à son vaste marché. D'autres estiment que ce serait davantage dans notre intérêt et que les Pakistanais apprécieraient que nous rejetions cette initiative."
 IND_PRC70s.5.d:0 "Une délégation indienne est récemment arrivée dans la capitale pour des entretiens de haut niveau destinés à normaliser les relations entre nos États. Les Indiens ont également fait venir certains de leurs plus hauts responsables économiques et appellent à une expansion des opportunités commerciales. Le gouvernement indien n'a pas hésité à discuter de son intérêt à normaliser nos relations. Nous avons trois options. Nous pouvons choisir cette opportunité pour normaliser les liens, à travers une expansion des échanges culturels. Ou nous pourrions normaliser nos relations et signer des accords commerciaux pour stimuler le commerce potentiel entre nos nations. Les deux premières options pourraient ouvrir la voie à de futurs accords. La dernière option est de recevoir poliment la mission et de la renvoyer sans aucun accord et de maintenir le statu quo. Cela renforcera les liens avec le Pakistan et montrera notre position envers l'Inde."
 IND_PRC70s.4.d:0 "La récente mission diplomatique en Chine est arrivée à New Delhi en grande pompe. La mission a réussi une percée diplomatique, notamment un accord visant à accroître les échanges culturels. Le gouvernement indien a placé la normalisation des relations avec la Chine parmi ses principaux objectifs de politique étrangère et il semble que ses efforts portent leurs fruits. Les deux pays ont également convenu d'agrandir leurs ambassades pour mieux faciliter les voyages et les engagements entre les deux États. Les critiques du Premier ministre reconnaissent son succès mais notent que les accords ne marquent pas un changement significatif dans les liens ni ne résolvent les questions actuellement en suspens entre les deux États."
 IND_PRC70s.3.d:0 "Une délégation de haut niveau composée de hauts responsables du gouvernement indien et de politiciens est arrivée pour des entretiens dans la capitale. Les Indiens souhaitent normaliser leurs relations et commencer à instaurer la confiance entre nos deux États. La délégation indienne insiste sur le fait que le Premier ministre souhaite une percée dans les relations bilatérales entre les deux puissances asiatiques les plus puissantes. Nous devons décider s'il faut rendre la pareille et entamer le processus de normalisation des liens. Nous le ferions en signant un accord visant à accroître les échanges culturels entre nos États. Un tel accord réduirait le risque de conflit avec l'Inde mais pourrait aliéner le Pakistan. L'autre approche consiste à accueillir poliment les Indiens, puis à les renvoyer sans aucun engagement, en laissant intact le statu quo."
 IND_PRC70s.2.d:0 "Les Chinois ont réagi positivement à notre demande et ont formellement demandé que nous envoyions une délégation. Il s'agit d'une avancée majeure dans les relations indo-sino-chinoises. Nous devons décider quel type de mission diplomatique envoyer. Nous pouvons en envoyer un, dirigé par notre ministre des Affaires étrangères, pour travailler à la normalisation des relations diplomatiques et apaiser les tensions existantes. Les avantages matériels seraient limités dans une mission diplomatique mais celle-ci a de fortes chances de succès. Ou nous pourrions envoyer une mission dominée par des responsables économiques pour faire pression en faveur d'un nouvel accord économique. L'élargissement des liens économiques pourrait être un moyen de parvenir à une croissance économique et à des liens positifs. La mission économique peut offrir plus de récompenses, mais elle est très risquée et pourrait facilement se terminer par un échec."
 IND_PRC70s.6.d:0 "La récente mission diplomatique en Chine est arrivée à New Delhi en grande pompe. La mission a réussi une percée diplomatique, notamment un accord visant à accroître les échanges culturels. En outre, les deux parties ont convenu d'encourager les relations commerciales par le biais de plusieurs traités. Le gouvernement indien a placé la normalisation des relations avec la Chine parmi ses principaux objectifs de politique étrangère et il semble que ses efforts portent leurs fruits. Les deux pays ont également convenu d'agrandir leurs ambassades pour mieux faciliter les voyages et les engagements entre les deux États. Les critiques adressées au Premier ministre reconnaissent son succès, mais soulignent qu'il n'est pas parvenu à résoudre les problèmes les plus graves en suspens. Le gouvernement affirme que parvenir à un tel accord nécessite de prendre des mesures et l'Inde a fait de grands progrès."
 slow_text:0 ""
 India_Emergency.2.d:0 "La Première ministre Indira Gandhi et son gouvernement ont autorisé le président à proclamer l'état d'urgence dans toute l'Inde. Le gouvernement a évoqué la crise économique provoquée par les récentes grèves pour évoquer les récents troubles politiques. La menace d'une reprise du conflit avec le Pakistan a également été citée comme raison de l'urgence. Il s'agit d'un changement sans précédent qui pousse déjà les politiciens de l'opposition à appeler à davantage de grèves et de résistance. Le Premier ministre est accusé d'avoir proclamé l'état d'urgence pour empêcher sa destitution du pouvoir en raison du verdict de Raj Narain."
 India_Emergency.3.d:0 "Les tribunaux ont récemment confirmé l'état d'urgence proclamé par le gouvernement d'Indira Gandhi. Les juges qui ont soulevé des inquiétudes ont été remplacés par des juges pro-gouvernementaux rapidement élevés au-dessus d'eux. Les tribunaux approuvent également les mandats d'arrêt émis par le gouvernement en vertu de l'état d'urgence. Les efforts continus d'Indira Gandhi pour remplacer et mettre les juges en sa faveur sont vivement critiqués par les médias et l'opposition. Quoi qu'il en soit, le renforcement du contrôle du gouvernement sur le système judiciaire confère à Gandhi un immense pouvoir."
 India_Emergency.4.d:0 "Le gouvernement indien a fait valoir qu'une crise de sécurité émergente nécessite l'expansion et le maintien de l'état d'urgence. Indira Gandhi affirme que l'augmentation des grèves et des dissidences, ainsi que les problèmes de sécurité concernant le Pakistan, signifient que l'Inde est confrontée à une urgence interne ainsi qu'à une urgence internationale. Le Premier ministre a demandé au président de prolonger l'état d'urgence tous les six mois jusqu'à ce que la situation se stabilise et que la démocratie puisse s'épanouir."
 India_Emergency.5.d:0 "Malgré les critiques véhémentes de l'opposition, il semble que l'argument du gouvernement concernant la nécessité d'une situation d'urgence gagne du terrain parmi le public. Ces dernières semaines, de plus en plus d'éditoriaux et de rapports pro-gouvernementaux sur l'escalade de la crise sécuritaire ont été largement lus par la population. Indira Gandhi et son gouvernement semblent plus forts que jamais, dotés de pouvoirs étendus. Le public exprime également sa satisfaction face à ce qu'il considère comme l'arrestation de politiciens et de fonctionnaires corrompus par le gouvernement. L'opposition devra réajuster son approche face au gouvernement."
 India_Emergency.6.d:0 "Les principaux journaux indiens ont lancé une campagne éditoriale soutenue critiquant le gouvernement d'Indira Gandhi. Ils soulignent que l'urgence semble être le résultat de revers politiques et non d'un réel besoin de protéger la nation. Beaucoup accusent le gouvernement de tuer l'esprit démocratique de l'Inde. Plus troublant pour le gouvernement est la publication des condamnations du gouvernement par l'opposition. Si l'opinion publique soutient l'opposition, le gouvernement d'Indira Gandhi sera confronté à des défis majeurs pour maintenir l'état d'urgence."
 India_Emergency.7.d:0 "Indira Gandhi a tenu une réunion privée avec les hauts officiers de l'armée indienne. Elle a souligné les raisons de l'urgence et a demandé aux militaires quelle était leur réaction face à la situation. L'armée indienne a une longue histoire d'apolitique et de professionnalisme, et la Première ministre a exprimé l'espoir que cela perdure. L'armée indienne et ses hauts gradés sont confrontés à un choix difficile. Alors que la plupart des officiers ont tendance à ne pas s'impliquer, certains craignent pour l'avenir démocratique du pays. Ils exhortent le chef de l'armée à user de son influence et suggèrent au Premier ministre d'envisager de mettre fin à l'état d'urgence et d'organiser des élections. Cependant, cela constituerait une rupture majeure avec la tradition."
 India_Emergency.8.d:0 "Victoire majeure du gouvernement d'Indira Gandhi, l'armée indienne a déclaré qu'elle resterait apolitique. Cela confirme que l'armée ne se laisse pas influencer par l'opposition, même s'il est peu probable qu'elle aide activement le gouvernement à réprimer les opposants. L'armée se concentre strictement sur la protection des frontières contre les menaces étrangères. La nouvelle du refus de l'armée d'agir réduira certaines tensions et portera un coup dur aux opposants qui espéraient une intervention militaire pour mettre enfin fin à l'urgence."
 India_Emergency.9.d:0 "Lors d'une réunion privée avec les dirigeants de l'armée, le Premier ministre Indira Gandhi a été informé de la préférence militaire pour les élections. Cela marque un revers majeur pour Indira Gandhi et l'Urgence. Cela implique que l'échec de la convocation d'élections pourrait entraîner soit une intervention militaire, soit un refus public du soutien militaire, deux scénarios désastreux pour le gouvernement. Peu de temps après la réunion, la Première ministre Indira Gandhi s'est adressée à la nation et a annoncé sa recommandation au président de lever l'état d'urgence. De nouvelles élections auront lieu immédiatement. L'armée et le gouvernement ne voudront pas révéler les détails de la réunion car cela pourrait perturber la structure politique indienne. Si l'opposition ou le grand public l'apprenait, cela pourrait entraîner à la fois une colère contre l'armée pour son intervention et un nouveau précédent selon lequel l'opposition pourrait faire appel à l'armée pour résoudre les problèmes politiques à l'avenir."
 India_Emergency.10.d:0 "Sanjay Gandhi, le fils du Premier ministre Indira Gandhi, continue de concentrer le pouvoir pendant l'état d'urgence. Il était l'un des plus ardents défenseurs de la déclaration de l'état d'urgence et, avec la défection de ses principaux conseillers vers l'opposition, sa position s'est grandement solidifiée. Le Premier ministre fait entièrement confiance à son fils, mais il est publiquement perçu comme corrompu en raison de ses liens familiaux et de son implication antérieure dans des initiatives gouvernementales controversées. Sanja Gandhi a également dévoilé un programme en cinq points visant à promouvoir les efforts visant à améliorer l'alphabétisation, la planification familiale, entre autres initiatives d'amélioration sociale. De nombreux observateurs s'inquiètent de l'importance et du pouvoir croissants détenus par Sanjay."
 India_Emergency.11.d:0 "Suite à l'état d'urgence, le gouvernement indien cherche à briser les machines politiques traditionnelles en vigueur dans tout le pays. De nombreuses régions de l'Inde sont dominées par les machines politiques des partis politiques dominants. Ce processus empêche une concurrence ouverte dans de nombreux domaines et oblige les citoyens à choisir entre voter pour un parti ou perdre l'accès aux ressources de l'État ou aux pots-de-vin offerts par les partis. La Première ministre Indira Gandhi, sous l'impulsion de son fils, Sanjay Gandhi, a commencé à démanteler ces machines partisanes par des arrestations et de nouvelles réglementations. Cela permet au Premier ministre et à ses partisans de dialoguer directement avec la population et non par l'intermédiaire de l'appareil du parti, composé de nombreux opposants au gouvernement."
 India_Emergency.12.d:0 "La Première ministre Indira Gandhi a dévoilé un programme en vingt points afin de sortir l'Inde de la crise actuelle. Le Premier ministre insiste sur le fait que la mise en oeuvre du programme aidera la nation à sortir de l'urgence actuelle. Le plan est fortement axé sur l'économie et vise à stimuler la production agricole et industrielle. L'amélioration des services publics et l'éradication de la corruption constituent également un objectif majeur. Le programme est bien accueilli, mais l'opposition accuse le gouvernement de manipuler la population."
 India_Emergency.13.d:0 "Suite à la proclamation de l'état d'urgence, le gouvernement d'Indira Gandhi a ordonné à la police de toute l'Inde d'arrêter les dissidents. Des organisations politiques perçues comme extrémistes, comme le Parti communiste indien, le RSS et le Jamaat-i-Islami, voient leurs événements interdits et leurs dirigeants emprisonnés. Les militants impliqués dans l'organisation de grèves ou de manifestations nationales sont arrêtés par milliers. Même des hommes politiques de l'opposition sont arrêtés sur la base d'accusations douteuses de corruption et d'incitation à l'agitation. De nombreux rapports font état de torture policière. Les médias seraient confrontés à des menaces similaires, certains médias devenant les porte-parole du gouvernement. Bien que le gouvernement élimine ses ennemis, le public serait en ébullition face à ce qu'il considère comme une attaque contre les libertés civiles."
 India_Emergency.14.d:0 "Les efforts déployés par Indira Gandhi et son gouvernement pour rétablir l'ordre en déclarant l'état d'urgence se sont heurtés à un revers à Amristar. Des milliers de sikhs se sont rassemblés dans la ville pour condamner ce qu'ils appellent les tendances fascistes du Parti du Congrès. L'événement, appelé Campagne pour sauver la démocratie, est reconnu comme l'une des premières manifestations de masse majeures contre le gouvernement. Le gouvernement indien a déjà commencé à demander à la police d'arrêter des militants sikhs. Bien qu'il s'agisse d'une petite minorité, il est clair qu'un grand pourcentage des personnes arrêtées sont sikhs, ce qui provoque un intense ressentiment de la communauté sikh envers le gouvernement."
 India_Emergency.15.d:0 "Les efforts déployés par le gouvernement d'Indira Gandhi pour dialoguer directement avec la population, en contournant les infrastructures politiques traditionnelles et les nouvelles réformes sociales, ont gagné du terrain parmi les Indiens ruraux. Chez les Indiens urbains, il existe encore beaucoup de ressentiment face à ce qui est considéré comme une érosion de la démocratie indienne. Cependant, le gouvernement bénéficie d'un certain soutien parmi les propriétaires d'entreprises qui soutiennent de nouvelles initiatives visant à relancer l'économie. L'arrestation de dissidents et la répression de l'opposition ont entravé les efforts de résistance à Indira Gandhi et, dans l'ensemble, les grèves et les manifestations nationales ont diminué."
 India_Emergency.16.d:0 "Le gouvernement d'Indira Gandhi est accusé d'avoir supervisé la stérilisation forcée de millions de personnes dans les campagnes. Certains villages accusent les médecins du gouvernement de stériliser les femmes sans les en informer. On pense que la campagne actuelle de planification familiale est sous le contrôle de Sanjay Gandhi et il fait face à de fortes critiques. Des manifestations ont lieu dans les communautés rurales touchées et les journaux publient largement les histoires de personnes victimes du programme. Les autorités locales font face à des foules de manifestants devant leurs domiciles. Sanjay Gandhi est accusé d'incompétence et de corruption, et beaucoup pensent que sa position est le résultat du népotisme."

 India_Kashmir70s.50.d:0 "Lors d'une réunion secrète des plus hauts responsables politiques, de la défense et du renseignement, des discussions ont eu lieu sur ce qu'il fallait faire au Cachemire. L'armée a présenté qu'elle avait fait les préparatifs logistiques nécessaires pour une campagne au Cachemire et que nos renseignements sur le front étaient très élevés. Ils ont déclaré que la décision revenait désormais au Premier ministre quant à savoir si une action militaire était justifiée. Des offensives locales pourraient constituer une puissante démonstration de notre détermination auprès du Pakistan, mais un échec d'une opération pourrait permettre aux Pakistanais de gagner du territoire et du prestige. Si les Pakistanais semblent trop retranchés ou semblent envisager leur propre offensive, l'opération actuelle peut passer d'offensive à défensive. Nous devons prendre une décision finale."
 India_Kashmir70s.51.d:0 "L'armée indienne a lancé des offensives au Cachemire. Le gouvernement indien a publié une déclaration soulignant que les opérations étaient limitées et destinées à punir le Pakistan pour son ingérence et ses provocations continues au Cachemire. Le gouvernement pakistanais n'a pas tardé à condamner l'attaque indienne et a promis que ses forces apporteraient une réponse appropriée à l'attaque indienne. La communauté internationale surveillera la situation de près, car on craint que des combats entre les deux pays ne dégénèrent rapidement en guerre générale."
 India_Kashmir70s.52.d:0 "Notre gouvernement a annoncé qu'il avait réussi à reprendre aux forces pakistanaises des territoires frontaliers clés le long de la frontière du Cachemire. L'armée indienne a récemment lancé ses opérations limitées en réponse aux efforts pakistanais visant à fomenter des soulèvements et à démontrer la futilité de la force militaire pour leurs forces. Le Parlement a déjà envoyé une note de félicitations au gouvernement et à l'armée pour leurs actions. Les Pakistanais rejettent les informations selon lesquelles ils auraient subi une défaite, mais nos troupes contrôlent clairement certaines zones frontalières clés. La communauté internationale est convaincue que le conflit n'a pas dégénéré. Le peuple indien verra ce succès avec une grande admiration."
 India_Kashmir70s.53.d:0 "L'armée indienne a lancé un plan néfaste qui a abouti à une agression non provoquée le long de la frontière du Cachemire. Nos forces ont combattu avec courage et discipline, mais ont malheureusement été repoussées dans plusieurs secteurs. Nous condamnerons l'agression indienne au niveau international et minimiserons les pertes subies par notre peuple, mais il est clair que les Indiens contrôlent de nouveaux territoires le long de la frontière. Nous devons réévaluer notre situation militaire et notre orientation politique afin de reprendre ces territoires et garantir qu'aucun autre acte d'agression indienne ne se reproduise à l'avenir."
 India_Kashmir70s.54.d:0 "Nous avons demandé au ministère des Affaires étrangères et au ministère de la Défense de minimiser leurs commentaires suite à la confirmation de l'armée que nos forces ont été légèrement repoussées au Cachemire. Notre projet visant à punir les Pakistanais et à améliorer la situation militaire au Cachemire par une offensive limitée a échoué. Lors de la contre-attaque pakistanaise qui a suivi, leurs forces ont réussi à s'emparer d'une partie du territoire. Notre plan s'est complètement retourné contre nous, les Pakistanais et leurs agents au Cachemire seront encouragés à poursuivre leur agression. L'armée indienne s'est engagée à être particulièrement vigilante. Nous pouvons nous attendre à des réactions négatives du public et à la colère des parlementaires face à cette opération ratée. Plus important encore, la situation militaire au Cachemire a changé."
 India_Kashmir70s.55.d:0 "L'armée indienne a cherché à recourir à la ruse et à la force brute pour repousser nos troupes au Cachemire. Malgré leurs efforts et leur surprise, nos courageux soldats ont non seulement stoppé leur progression, mais ont également contre-attaqué, prenant des positions stratégiques clés le long de la frontière. Nous publions déjà dans les médias des photos d'officiers et de soldats pakistanais posant sur des positions autrefois occupées par l'armée indienne. Un conseiller a proposé un plan audacieux : nous pouvons proposer de restituer le territoire nouvellement capturé si l'Inde accepte de mettre en oeuvre les résolutions de l'ONU sur le Cachemire. L'Inde pourrait désormais considérer la situation militaire comme insoutenable et l'accepter. L'autre option consiste simplement à conserver le territoire et à préparer une future opération visant à libérer complètement le Cachemire."
 India_Kashmir70s.56.d:0 "Le gouvernement pakistanais a proposé de restituer le territoire qu'il s'est emparé lors de notre récent conflit frontalier au Cachemire en échange de la mise en oeuvre des résolutions de l'ONU sur le Cachemire. Les responsables de la ligne dure nous exhortent à rejeter la proposition, affirmant que nous serons en mesure de reprendre les terres à l'avenir et qu'un vote ouvert irait probablement à notre encontre. Toutefois, des dirigeants plus modérés estiment que cela pourrait être l'occasion de résoudre notre différend avec le Pakistan au Cachemire. Ils pensent que nous devrions faire confiance à nos amis cachemiris pour voter avec nous et que la mise en oeuvre des résolutions n'entraînerait probablement pas la perte totale du Cachemire. Un autre groupe de responsables estime simplement que nous devrions rejeter la proposition car cela créerait un précédent selon lequel les États pourraient nous faire chanter avec des territoires pour atteindre nos objectifs. Nous devons décider comment réagir."

 Nagaland_Unrest.1.d:0 "En 1946, un accord fut conclu entre la communauté Nagas et le gouvernement de l'Assam. Les Nagas reçurent le contrôle de leurs terres, ainsi que les pouvoirs exécutif, législatif et judiciaire. L'accord devait durer 10 ans, après quoi un nouvel accord serait conclu. Les nationalistes Naga ont interprété cela comme signifiant qu'ils avaient obtenu leur indépendance en 10 ans, provoquant un conflit à la fin des années 1950. Nous avons finalement créé le Nagaland en tant qu'État constitutionnel au début des années 1960, apaisant ainsi les tensions. Malheureusement, une nouvelle vague de nationalisme naga déferle sur l'État, avec la formation de bandes armées. Nous pourrions déployer des forces de sécurité pour affronter les rebelles ou conclure un accord accordant une plus grande autonomie à l'État dans un avenir proche."
 Nagaland_Unrest.2.d:0 "Nos forces de sécurité sont engagées dans un conflit armé avec la guérilla de l'armée fédérale Naga. Ces nationalistes Naga malavisés lancent des attaques et des opérations de sabotage ciblant les installations gouvernementales et les avant-postes de la police. Nous déployons des forces militaires et établissons des points de contrôle. Toutefois, nos experts militaires estiment que l'insurrection ne constituera pas une menace majeure dans la mesure où l'armée peut facilement couvrir la région. Il faudra juste du temps pour pacifier la province. Les dirigeants politiques Naga condamnent notre réponse et lancent des accusations sans fondement de violations des droits de l'homme."
 Nagaland_Unrest.3.d:0 "La situation sécuritaire au Nagaland s'est stabilisée. Les dirigeants nationalistes Naga sont davantage intéressés par la poursuite des discussions pacifiques avec le gouvernement. De nombreux combattants militants sont frustrés de rester sur le terrain et cherchent désespérément à rentrer chez eux. Plus important encore, les populations civiles commencent à se retourner contre les rebelles, largement épuisées par les checkpoints militaires et les couvre-feux. Même si les rebelles n'ont pas été vaincus, ils sont en train de fondre. Alors que nous mettons fin aux opérations, nos troupes et nos ressources au Nagaland peuvent désormais être redéployées pour la cause nationale."
 Nagaland_Unrest.4.d:0 "Face aux rumeurs d'une nouvelle insurrection au Nagaland, le gouvernement est parvenu à un accord avec les dirigeants nagas. Le gouvernement a accepté d'accorder temporairement une large autonomie au Nagaland pour les dix prochaines années. Pour éviter tout malentendu, les dirigeants Naga conviennent qu'après dix ans, l'administration reviendra au modèle précédent, à moins qu'un nouvel accord ne soit trouvé. Le gouvernement du Nagaland promet explicitement de ne pas exiger l'indépendance ni de promouvoir le séparatisme dans le cadre de cet accord. L'accord est critiqué par certains comme une capitulation, tandis que d'autres nous félicitent pour avoir fait preuve de maturité politique concernant la situation du Nagaland."
 nagaland_agitation:0 "Agitation du Nagaland"

 NCO_71.1.d:0 "Les États-Unis continuent d'utiliser leur aide en blé comme moyen de faire pression sur notre gouvernement pour qu'il obéisse. Cela conduit à des embarras publics et remet en question l'indépendance de l'Inde. Pour de nombreux Indiens patriotes, cette relation ressemble à la façon dont les Britanniques ont manipulé et volé traîtreusement le sous-continent il y a des siècles en abusant des relations commerciales à leur avantage. Compte tenu de ces circonstances intolérables, le Premier ministre a annoncé son intention de mettre fin immédiatement aux expéditions de blé et à l'aide des États-Unis. Le Premier ministre a souligné que cela entraînerait des difficultés initiales pour la population et l'économie, mais que les institutions indiennes s'adapteraient. L'annonce a galvanisé de nombreux Indiens, en particulier à gauche, même si certains politiciens conservateurs ont accusé le gouvernement de sacrifier l'accès à la nourriture pour des millions de personnes juste pour gagner des points politiques."
 NCO_71.2.d:0 "Dans une récente interview publiée dans des journaux indiens, le Premier ministre Moraji Desai a exposé sa vision de la politique étrangère indienne, que beaucoup qualifient de doctrine Desai. Le Premier ministre a souligné que les combattants de la liberté indiens, Gandhi et Nehru, croyaient tous deux en une Inde indépendante d'aucune puissance étrangère et autosuffisante. Il a également noté que l'Inde ne devrait pas avoir intérêt à s'ingérer ou à s'impliquer dans les affaires des autres afin de ne pas nuire à ces personnes, comme le faisait la nation indienne à cause de l'impérialisme. Au lieu de cela, l'Inde abandonnerait ses relations profondes avec les superpuissances et se tournerait plutôt vers la région pour promouvoir la paix et la prospérité en Asie. Beaucoup voient dans cette dernière déclaration une critique voilée des gouvernements précédents qui recherchaient des liens étroits avec le camp occidental ou soviétique. Le Premier ministre a conclu en réitérant son désir de paix régionale et a souligné ses efforts pour normaliser les relations avec la Chine. Le gouvernement chinois a chaleureusement accueilli cette déclaration."
 INC_71.1.d:0 "La Première ministre Indira Gandhi et ses ministres ont dévoilé ces dernières semaines ce que de nombreux médias surnomment la « doctrine Indira ». L'Inde tracera fermement une ligne ferme à travers l'Himalaya et veillera à ce que cette zone stratégique ne tombe pas aux mains de puissances hostiles. Pour soutenir cet effort, le gouvernement indien soutiendra l'indépendance des États himalayens et travaillera en tant que partenaire. Les critiques de la région accusent l'Inde de chercher par la force à établir une relation hégémonique et à contraindre ces États à leur loyauté. Quoi qu'il en soit, de nombreuses personnes à travers le pays saluent ces actions comme une défense proactive des frontières de l'Inde."
 INC_71.2.d:0 "Le Premier ministre a été informé des récentes violences ethniques au Sri Lanka, qui ont donné lieu à plusieurs affrontements intenses. Les affrontements ont eu lieu entre Cinghalais et Tamouls. De nombreux Tamouls sont mécontents de la domination politique du pays par les Cinghalais et constatent leur manque de représentation. Le manque d'implication de la police, en particulier dans les incidents où des biens tamouls ont été pris pour cible, n'a fait qu'alimenter les affrontements. Notre gouvernement doit prendre publiquement position pour soutenir soit le gouvernement sri-lankais, soit la communauté tamoule. Sur le plan intérieur, notre nation compte une importante population tamoule qui sympathise avec ses compatriotes du Sri Lanka. Si nous soutenons le gouvernement, cela peut améliorer les relations bilatérales mais provoquer une certaine colère au niveau national. Si nous soutenons les Tamouls, nous pouvons obtenir un certain soutien du public, mais nos relations avec le Sri Lanka se détérioreront."
 INC_Kashmir.1.d:0 "Le récent conflit avec le Pakistan a confirmé notre domination politique, économique et militaire sur la région. Nous avons porté un coup paralysant aux ambitions pakistanaises pour le Cachemire et neutralisé leur capacité à internationaliser le conflit. Les éléments anti-indiens au sein du gouvernement cachemirien manquent désormais de patron et se trouvent dans une position tout aussi faible. Il est désormais temps pour le Premier ministre Indira Gandhi de s'entretenir avec le célèbre dirigeant cachemirien Cheikh Abdullah, connu sous le nom de Lion du Cachemire. Historiquement, il a constitué une menace pour l'Union indienne en flirtant constamment avec les factions indépendantistes ou même pro-pakistanaises. Les militants cachemiriens se plaignent depuis longtemps de leur statut puisque l'indépendance reste dans les limbes et gelée. Ces pourparlers permettront une avancée décisive et probablement un règlement juste pour le Cachemire. La position de négociation du Lion n'a jamais été aussi basse."
 INC_Kashmir.2.d:0 "Les représentants du Premier ministre et Cheikh Abdallah ont signé un accord à New Delhi concernant le Cachemire. Le nouvel accord, parmi ses dispositions clés, réitère le Cachemire comme partie constitutionnelle de l'Inde, convient que tout effort visant à remettre en question la souveraineté indienne ou à insulter les symboles de la nation sera puni, et Cheikh Abdallah serait nommé ministre en chef. La réaction en Inde est largement positive, nombreux sont ceux qui félicitent le gouvernement d'avoir finalement mis fin une fois pour toutes au mouvement d'autodétermination. Parmi les Cachemiriens, la réaction est très mitigée, certains soutiennent Abdullah, affirmant que la réalité politique et stratégique régionale actuelle limite sa capacité à négocier les conditions. Cependant, des manifestations ont eu lieu à Srinagar pour condamner l'accord et la rumeur dit que des jeunes Cachemiriens à l'étranger se réunissent pour former de nouvelles organisations visant à défier la domination indienne. Quoi qu'il en soit, l'accord cimente la récente victoire indienne."
 CPI_71.1.d:0 "Le Premier ministre a salué l'adoption d'une nouvelle loi qui nationalise tous les partenariats privé-État dans le pays. Le Premier ministre a souligné que les partenariats étaient contradictoires, l'un travaillant uniquement dans un but lucratif tandis que l'autre cherchait à atténuer les difficultés des travailleurs. Désormais, avec l'État aux commandes de ces partenariats, les droits des travailleurs seront préservés et conduiront à l'amélioration de la production. Les anciens partenaires privés ne seront pas indemnisés par l'État et nombreux sont ceux qui se plaignent amèrement du fait que le gouvernement ait volé les entreprises familiales. En outre, les politiciens de l'opposition se plaignent amèrement que cette nationalisation entraînera corruption et inefficacité, car le centre aura du mal à rester au top de toutes ces nouvelles industries. Les partisans du gouvernement saluent cette action comme étant essentielle à l'établissement d'une économie à la fois forte et consciente des besoins des travailleurs."
 CPI_71.2.d:0 "Le gouvernement indien nous a lancé un sévère avertissement concernant le parti communiste du Sri Lanka. Ils ont exigé que nous levions toutes les restrictions et que nous libérions tous les militants du mouvement détenus. Il s'agit d'une ingérence flagrante dans nos affaires intérieures et nous n'avons arrêté que ceux qui constituent une menace directe pour la paix et la stabilité générales du Sri Lanka. La menace indienne semble réelle, nous devons soit leur donner des garanties protégeant le parti communiste et ses militants, soit nous tourner vers les États-Unis et le Royaume-Uni pour obtenir une protection dans cette période difficile. Nous pouvons leur proposer des bases navales en échange d'une garantie."
 CPI_71.3.d:0 "Le gouvernement indien a récemment proféré de vives menaces à l'encontre du Sri Lanka pour sa prétendue répression contre les socialistes et les Tamouls à travers l'île. Les médias indiens publient largement des rapports, pour la plupart non vérifiés, décrivant les atrocités et les violences perpétrées par le gouvernement sri lankais contre ses propres citoyens. En réponse, le gouvernement sri lankais a refusé d'accepter les demandes indiennes selon lesquelles il garantirait le parti communiste et libérerait tous les militants détenus. Leur chef a récemment contacté le président et demandé le soutien américain dans ce différend en échange de l'accès à une base navale au Sri Lanka. Cela donnerait à notre marine des ports stratégiques dans l'océan Indien, mais nous risquions d'être entraînés dans une guerre avec l'Inde."
 CPI_71.4.d:0 "Le gouvernement indien a récemment proféré de vives menaces à l'encontre du Sri Lanka pour sa prétendue répression contre les socialistes et les Tamouls à travers l'île. Les médias indiens publient largement des rapports, pour la plupart non vérifiés, décrivant les atrocités et les violences perpétrées par le gouvernement sri lankais contre ses propres citoyens. En réponse, le gouvernement sri lankais a refusé d'accepter les demandes indiennes selon lesquelles il garantirait le parti communiste et libérerait tous les militants détenus. Leur chef a récemment contacté le Premier ministre et demandé le soutien britannique dans ce différend en échange de l'accès à une base navale au Sri Lanka. Cela donnerait à notre marine un accès stratégique à la région, mais au risque d'un conflit armé avec l'Inde. Certains membres du Cabinet pressent le premier ministre d'accepter, non seulement l'accès naval, mais aussi le soutien de notre ancienne possession coloniale face à un régime de gauche radicale."
 CPI_71.5.d:0 "Le gouvernement sri lankais a rapidement rejeté notre juste appel à la justice. Ils ont déclaré avec défi que leur politique envers les socialistes et les communistes était une question interne. Il a également noté que le gouvernement sri-lankais ne peut pas s'immiscer dans l'application des lois ou dans le système judiciaire en ce qui concerne les personnes détenues pour activités subversives. Les Sri Lankais ont également fait appel à des puissances extérieures et ont peut-être obtenu certaines garanties. Compte tenu de tous ces facteurs, nous devons décider si nous devons continuer à attiser la colère contre les Sri Lankais ou laisser la situation pour le moment jusqu'à ce que les choses se calment. Peut-être faudra-t-il une voie plus subversive pour résoudre cette crise."
 CPI_71.6.d:0 ""
 CPI_71.7.d:0 ""
 CPI_71.8.d:0 ""

 IND_PAK60s.1.d:0 "Depuis la partition, les États-Unis ont établi des liens particulièrement amicaux avec le Pakistan. Afin de modifier notre politique étrangère vers une orientation occidentale et d'obtenir des soutiens, notamment à l'égard de la Chine, nous devons démontrer nos intentions pacifiques avec le Pakistan. Nous pouvons inviter le Pakistan à des négociations sur la sécurité régionale. Même si les négociations n'aboutissent à aucun résultat, les Américains y verront une étape positive, qui ne fera que bénéficier à nos relations avec eux. Cependant, certains membres du gouvernement s'opposent à tout dialogue avec les Pakistanais et craignent que cela ne nuise à leur pays et ne renforce leur image à l'échelle mondiale. Nous devons décider quoi faire."
 IND_PAK60s.2.d:0 "L'ambassadeur indien a transmis une invitation de son gouvernement à assister à un sommet sur la situation de la sécurité régionale. Les Indiens ont exprimé leur inquiétude face à l'influence extérieure et aux menaces contre l'Asie du Sud et souhaitent discuter d'une manière pour le Pakistan de se joindre aux efforts visant à préserver la souveraineté de l'Asie du Sud. Ils ont reconnu l'existence de tensions entre nos nations, mais ils espèrent que la coopération dans d'autres domaines pourra ouvrir la voie à une paix plus large. Nous pouvons certainement assister à ces pourparlers pour voir ce que les Indiens ont en tête, peut-être seront-ils plus aimables envers le Cachemire si nous leur faisons plaisir. Cependant, il est clair que les Indiens pourraient chercher à utiliser cela pour confirmer une fausse normalisation de nos relations, et dans ce cas, il serait peut-être préférable de refuser et de déclarer que de tels pourparlers ne seraient appropriés qu'une fois le Cachemire résolu."
 IND_PAK60s.3.d:0 "De hauts responsables indiens et pakistanais ont entamé des discussions à Calcutta sur la situation sécuritaire régionale. Dans son discours d'ouverture, le ministre indien de la Défense a expliqué comment la rivalité indo-pakistanaise risquait de rendre l'Asie du Sud vulnérable à des menaces potentielles. Bien qu'il n'ait cité aucune menace spécifique, beaucoup ont déduit qu'il faisait référence à la Chine. Dans son discours d'ouverture, la délégation pakistanaise a déclaré qu'elle était disposée à s'asseoir et à écouter et qu'elle espérait que l'Inde comprenait que la résolution des problèmes en suspens entre les deux nations était la clé pour établir une défense solide et ferme en Asie du Sud."
 IND_PAK60s.4.d:0 "Le gouvernement indien a déclaré qu'il comprenait nos réserves en raison des questions actuellement en suspens et a souligné qu'il n'était pas réaliste d'essayer de résoudre toutes ces questions au cours de ces discussions. Cependant, ils ont noté que les deux nations souhaitaient préserver la liberté pour laquelle de nombreux Sud-Asiatiques se sont battus et sont morts. Ils proposent que nos deux États conviennent mutuellement de garantir l'indépendance de l'autre pendant cinq ans afin qu'en cas d'invasion extérieure, les deux parties puissent se défendre mutuellement. Certes, une telle proposition serait attrayante pour les nationalistes pakistanais, en particulier ceux impliqués dans la lutte pour la liberté, et elle ne nous engage pas dans une relation formelle avec un État avec lequel nous avons des problèmes persistants. Cependant, nous devrions également tenir compte des réactions négatives au niveau national et de l'affaiblissement de nos options pour résoudre le Cachemire si nous signons un tel accord."
 IND_PAK60s.5.d:0 "Le gouvernement pakistanais a noté que, même s'il appréciait les efforts de l'Inde pour tenter de parvenir à un accord, il a déclaré que cela n'était pas réaliste tant que le Cachemire n'était pas résolu. Le gouvernement pakistanais a apprécié l'invitation et l'intention du gouvernement indien, mais a déclaré que les circonstances rendaient un accord pratiquement impossible. La délégation pakistanaise est rapidement partie, mettant fin aux pourparlers. Même si aucun accord n'a été conclu, nos actions ont été bien accueillies au niveau national et nous avons démontré notre position de puissance mondiale pacifique."
 IND_PAK60s.6.d:0 "Constituant une avancée majeure pour les relations indo-pakistanaises, les deux parties ont convenu de signer un pacte. Les deux nations promettront de se défendre en cas d'attaque par un tiers étranger. L'accord doit durer cinq ans et beaucoup dans la région le saluent comme une avancée majeure. Pour l'Inde, qui connaît des tensions à sa frontière chinoise, cet accord apporte un certain soulagement à ses forces frontalières avec le Pakistan. Pour le Pakistan, ils ont annoncé leur intention d'utiliser l'accord comme une pierre angulaire pour tenter de réaliser de nouvelles avancées au Cachemire. De nombreux analystes pakistanais ont exprimé leur déception et estiment que l'Inde a obtenu bien plus que le Pakistan dans le cadre de cet accord."
 IND_PAK60s.7.d:0 "Le secrétaire d'État des États-Unis a récemment appelé le premier ministre pour lui exprimer son appréciation de nos récents efforts visant à coordonner la défense de l'Asie du Sud contre l'agression communiste. Il a déclaré que Washington avait suivi les négociations de près et que, quoi qu'il arrive, il est clair que l'Inde voit le monde dans une perspective de préservation de la paix mondiale. Le secrétaire d'État a ensuite invité de hauts responsables de notre gouvernement à se rendre aux États-Unis pour échanger leurs points de vue. Il s'agit d'un grand pas en avant dans l'amélioration des relations avec les États-Unis."
 IND_PAK60s.8.d:0 "Le pacte défensif de cinq ans entre l'Inde et le Pakistan a expiré sans grande fanfare. Pour l'Inde, l'accord a contribué à sa sécurité pendant une période de tensions accrues. Le Pakistan espérait utiliser l'accord pour promouvoir une solution au Cachemire. Cependant, le gouvernement indien a refusé de bouger sur la question, décevant ainsi les Pakistanais. Le gouvernement pakistanais est particulièrement heureux que cet accord embarrassant ne soit plus un sujet de critique. Bien que l'accord ait expiré, les experts ne s'attendent pas à ce que l'un ou l'autre s'engage dans des actions militaires contre l'autre."

 USA_INDIA60s.1.d:0 "Le gouvernement indien a demandé qu'une mission militaire se rende à Delhi et fasse des recommandations. Les Indiens préféreraient le matériel militaire, qui serait utilisé pour défendre l'Inde de la menace de la Chine communiste et d'autres influences néfastes dans la région. Cependant, si la mission ne pouvait pas recommander d'équipement, ils apprécieraient également de l'aide pour former nos forces. Certains au Pentagone sont sceptiques quant à notre implication dans une telle mission, car le gouvernement indien s'est montré assez résistant à notre influence dans le passé. Cependant, le Département d'État affirme que c'est exactement la raison pour laquelle les États-Unis devraient envoyer une mission pour, espérons-le, commencer à faire entrer l'Inde dans notre camp. Il existe des craintes plus larges selon lesquelles l'aide à l'Inde pourrait aliéner le Pakistan, avec lequel nous avons établi des liens étroits."
 USA_INDIA60s.2.d:0 "Les États-Unis ont informé notre gouvernement qu'ils ne pouvaient pas, pour le moment, répondre à notre demande d'envoyer une mission militaire à Delhi. Il s'agit d'un revers majeur dans nos efforts visant à nous rapprocher des puissances occidentales. Au niveau national, de nombreux journaux notent que la réciprocité de la part de l'Occident ne semble pas être aussi grande que nous l'espérions. Ils notent que cela pourrait s'avérer désastreux dans la mesure où notre changement diplomatique aliène déjà les nations socialistes. Nous ne pouvons que publier une déclaration en prenant les Américains au mot et en prétendant que ce n'était qu'une question de timing. Espérons que les États-Unis se rendront bientôt compte que leurs futures relations en Asie du Sud doivent impliquer l'Inde."
 USA_INDIA60s.3.d:0 "L'équipe d'évaluation militaire que nous avons invitée a terminé sa visite en Inde et a proposé deux options de soutien. Ils ont évalué nos capacités face à la Chine et ont proposé des équipements pour contribuer à renforcer les capacités défensives de nos troupes. L'équipement n'est franchement pas très important et nous pensons que cela a été fait afin de minimiser la colère pakistanaise et d'éviter les critiques nationales à l'égard d'un tel accord. Cependant, un équipement aussi moderne peut toujours être utilisé. Alternativement, ils ont proposé de soutenir une expansion de la formation et de l'organisation des forces spéciales. Cela pourrait s'avérer très utile dans la mesure où nos militaires cherchent toujours à moderniser leur formation et leurs capacités. Nous devons décider quel package choisir."
 USA_INDIA60s.4.d:0 "La presse et le gouvernement pakistanais ont exprimé leur mécontentement face à notre récente mission militaire en Inde. Les Pakistanais nous traitent de duplicité et ont appelé notre ambassadeur pour exprimer leur déception face à l'évolution de la situation. Même si les Pakistanais sont manifestement furieux, ils restent très dépendants de nous. Nous pouvons nous attendre à ce que cela déborde avec le temps, mais nous publierons une déclaration soulignant que notre objectif est la paix en Asie du Sud et que nous accordons une grande importance à nos relations avec le Pakistan. Mais toutes les nations doivent comprendre que nous sommes libres de conclure des accords bilatéraux avec qui nous voulons."

 CPI_FP.3.d:0 "Les dirigeants indiens et soviétiques ont récemment signé le Traité indo-soviétique d'amitié et de coopération. L'accord cimente et annonce le partenariat stratégique entre les deux nations. Les États-Unis et la Chine seraient très préoccupés par l'accord et il marque un net abandon du non-alignement de l'Inde. De nombreux analystes indiens saluent cette décision et la considèrent comme nécessaire car le Pakistan recherche l'aide étrangère. Après la signature du traité, l'Union soviétique a assuré en privé à l'Inde qu'elle enverrait bientôt des armes pour soutenir l'Inde alors qu'elle faisait face à des menaces à sa frontière."
 burma_2022.2.d:0 "Les habitants de Rangoon se sont réveillés au son des chars, des véhicules et des soldats qui balayaient la ville. Le général Ne Win a pris le pouvoir. Il s'est rapidement adressé à la nation dans un bref discours radiophonique. Le général Ne Win a appelé au calme, promettant de mettre fin à l'instabilité économique et politique actuelle du pays. Il a promis la création d'une république socialiste avec lui comme Premier ministre et président d'un nouveau Conseil révolutionnaire de l'Union. Les rapports sur le terrain indiquent que l'ancien Premier ministre, le juge en chef et d'éminents hommes politiques de tous les partis politiques ont été arrêtés par l'armée. Toutes les universités sont fermées. Le coup d'État est bien accueilli tant par la population que par les ambassades étrangères. Tous deux considéraient le gouvernement précédent comme corrompu et incapable. L'armée jouit également d'une grande popularité pour ses efforts récents visant à faciliter les élections et à promouvoir l'unité nationale."
 India_Com60s.1.d:0 "Avec la victoire électorale des communistes, l'équilibre des pouvoirs à l'échelle mondiale a changé et le camp socialiste mondial devient encore plus puissant. Les deux principaux États socialistes, l'Union soviétique et la Chine, ont salué cette annonce et ont déjà envoyé des délégations de haut niveau pour visiter le CPI. Tous deux ont proposé d'aider exclusivement notre nation dans sa transition vers un gouvernement révolutionnaire. Les Soviétiques apportent une riche expérience en matière d'industrialisation et d'armement avancé. Cependant, l'État chinois ressemble davantage au nôtre, avec une population nombreuse et un manque de développement industriel, il pourrait donc être un meilleur allié en tant qu'allié. Quoi qu'il en soit, tous deux ont indiqué que si nous suivions leurs conseils, ils s'attendaient à une relation exclusive. Nous devons donc maintenant décider d'accepter les conseils soviétiques ou chinois."
 India_Com60s.2.d:0 "La conférence la plus importante du Parti communiste indien a peut-être été convoquée. Avec le CPI au pouvoir, le moment est venu d'apporter le socialisme et la libération aux travailleurs et aux paysans de l'Inde. Le débat majeur qui émerge est de savoir quel style de socialisme l'Inde doit suivre. Une faction estime que l'Inde devrait subir une transformation socialiste selon la ligne soviétique, citant son importance en tant que premier et plus puissant État socialiste. D'autres, notamment les militants ruraux, estiment que l'Inde doit suivre le modèle chinois. Ils notent que la Chine, comme l'Inde, possède une population paysanne largement agraire qui a longtemps été opprimée par les élites. Le modèle chinois n'est pas entravé par l'incapacité des théoriciens soviétiques à prédire la montée du socialisme parmi les paysans. Des représentants des deux factions se sont adressés à la conférence et un vote aura bientôt lieu pour déterminer quelle voie socialiste adopter..."

 INC_1962.1.d:0 "L'establishment de la Défense, en particulier les forces armées avant l'indépendance, étaient étroitement liés au gouvernement colonial et à l'occupation de l'Inde. De nombreux hommes politiques indiens de premier plan ont passé des années à lutter contre un régime colonial soutenu par ces forces militaires. De nombreux officiers supérieurs et intermédiaires ont été formés pendant la période coloniale. En tant que tel, maintenir la surveillance et l'obéissance civiles sur l'appareil de défense est une question cruciale. Récemment, un conseiller principal a proposé au gouvernement d'expérimenter en donnant aux militaires plus d'indépendance et de contrôle sur les questions militaires afin d'accroître l'efficacité des forces armées. Il s'agit d'une proposition intéressante, mais ceux qui s'opposent à l'octroi de tels pouvoirs pourraient tenter un éventuel coup d'État à l'avenir et estiment qu'au lieu de cela, le ministère de la Défense doit bénéficier d'une surveillance encore plus grande. Nous devons décider s'il faut temporairement renforcer le contrôle civil ou donner davantage de contrôle aux militaires sur les questions purement militaires. Ensuite, nous pourrons décider quelle voie serait la meilleure pour l'Inde."
 INC_1962.2.d:0 "Nous avons récemment expérimenté la question du niveau de contrôle civil à exercer sur l'armée. Même après les récents changements, le gouvernement reste divisé sur l'opportunité de soutenir l'assouplissement du contrôle civil ou d'encourager un contrôle plus strict. Ceux qui plaident en faveur d'un contrôle plus souple notent que cela réduirait la lenteur de la prise de décision, augmenterait l'efficacité et redonnerait confiance au personnel en uniforme. Ceux qui soutiennent un contrôle civil strict notent que cela empêche l'aventurisme militaire, tient le pays informé et favorise un État stable. Toute perte d'efficacité pour eux est mineure par rapport aux avantages qu'en retirent la nation et les institutions étatiques. Nous devons prendre une décision sur l'avenir des relations civilo-militaires en Inde."

 Mahalanobis.1.d:0 "Le modèle Mahalanobis a guidé notre deuxième plan quinquennal. Le modèle développé par le statisticien Prasanta Chandra Mahalanobis est basé sur la théorie économique marxiste. Il soutient que l'Inde doit préserver une économie fermée, lever des capitaux via le secteur industriel et investir dans l'expansion de sa production de biens d'équipement ainsi que dans la consommation de biens. L'accent devrait être mis sur la production de biens d'équipement. Avec le temps, même si la croissance initiale sera lente, l'économie se développera considérablement ainsi que le secteur de la consommation de biens. Les critiques soulignent cependant que le modèle ne prend pas en compte la fiscalité, le rôle du commerce mondial et l'ignorance de l'agriculture en tant que source de capital. Plus important encore, l'économie indienne a connu une faible croissance au cours du deuxième plan quinquennal. Le gouvernement doit maintenant décider s'il doit maintenir le modèle ou l'abandonner."
