 GRE_jet_CAS_equipment_1: "République F-84E Thunderjet"
 GRE_jet_CAS_equipment_1_short: "F-84E Thunderjet"
 GRE_jet_CAS_equipment_1_desc: "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 GRE_jet_CAS_equipment_2: "République F-84G Thunderjet"
 GRE_jet_CAS_equipment_2_short: "F-84G Thunderjet"
 GRE_jet_CAS_equipment_2_desc: "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 GRE_jet_CAS_equipment_3: "République F-84F Thunderstreak"
 GRE_jet_CAS_equipment_3_short: "F-84F Thunderstreak"
 GRE_jet_CAS_equipment_3_desc: "Développé à partir du précédent F-84 Thunderjet, le F-84F était une variante à ailes en flèche du chasseur-bombardier conçue pour rapprocher ce type des performances du tant vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances de décollage tout en ayant une stabilité et un contrôle médiocres. Le type servirait dans une capacité limitée tout au long de sa vie, jusqu'en 1971. Son surnom est « Thunderstreak »."

 GRE_jet_CAS_equipment_6: "LTV A-7D Corsaire II"
 GRE_jet_CAS_equipment_6_short: "A-7D Corsaire II"
 GRE_jet_CAS_equipment_6_desc: "Version construite pour l'USAF, avec un turboréacteur Allison TF41-A-1 et un seul canon rotatif M61 Vulcan de 20 mm ; Le radar de navigation AN/APN-153 des modèles précédents est remplacé par le radar de navigation AN/APN-185, le radar de suivi de terrain AN/APQ-116 du précédent A-7B/C est remplacé par le radar de suivi de terrain AN/APQ-126."
 GRE_jet_CAS_equipment_7: "LTV A-7E Corsaire II"
 GRE_jet_CAS_equipment_7_short: "A-7E Corsaire II"
 GRE_jet_CAS_equipment_7_desc: "Version spécialement construite pour l'armée de l'air hellénique, avec un turboréacteur Allison TF41-A-1 et un seul canon rotatif M61 Vulcan de 20 mm ; Le radar de navigation AN/APN-153 des modèles précédents est remplacé par le radar de navigation AN/APN-185, le radar de suivi de terrain AN/APQ-116 du précédent A-7B/C est remplacé par le radar de suivi de terrain AN/APQ-126."
 GRE_jet_CAS_equipment_8: "LTV A-7H Corsaire II"
 GRE_jet_CAS_equipment_8_short: "A-7H Corsaire II"
 GRE_jet_CAS_equipment_8_desc: ". Dans l'armée de l'air hellénique, ils étaient initialement basés dans les bases aériennes de Larissa (escadron 347 « Perseas ») et de Souda (escadrons 340 et 345, respectivement « Fox » et « Lailaps »). En 1993, 43 A-7E et 19 TA-7C furent livrés par l'USN et entrèrent en service dans les 335e et 336e Escadrons, remplaçant le F-104G. En 2002, tous les Corsair sont placés sur la base aérienne d'Araxos (116 Combat Wing, 335 Squadron « Tiger » et 336 Squadron « Olympos »). Le Hellenic Corsairs a été mis hors service le 31 octobre 2014."

