 GRE_motorized_equipment_1: "Ford 60L CMP 4x4"
 GRE_motorized_equipment_1_short: "60L CMP 4x4"
 GRE_motorized_equipment_2: "M35 6x6"
 GRE_motorized_equipment_2_short: "M35 6x6"
 GRE_motorized_equipment_2_desc: "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 GRE_motorized_equipment_3: "Steyr 680M 4x4"
 GRE_motorized_equipment_3_short: "Steyr 680M 4x4"
 GRE_motorized_equipment_3_desc: "Le Steyr 680M était un camion de la marque Steyr. Il a été produit de 1960 à env. 1986 par l'ancienne Steyr Daimler Puch AG en Autriche et dans sa succursale en Grèce."
 GRE_motorized_equipment_4: "Steyr12M18 4x4"
 GRE_motorized_equipment_4_short: "Steyr12M18 4x4" 
 GRE_motorized_equipment_5: "MTVR 6x6"
 GRE_motorized_equipment_5_short: "MTVR 6x6"
 GRE_motorized_equipment_5_desc: "Le MTVR est un camion 6x6 de 7 tonnes conçu par Oshkosh Defense en 1996. Il a été utilisé dans tous les conflits de la sphère occidentale depuis 2001. Le MTVR utilise un moteur Caterpillar C-12, une transmission automatique 4070P à 7 vitesses avec blocage de différentiel et une suspension à ressorts hélicoïdaux TAK-4 avec anti-roulis. Le véhicule est capable de transporter 7 000 livres. Il peut se déplacer à 65 mph sur 300 miles et obtient 4 mi/gal. Le MTVR n'a pas la capacité de charge du M939 et est moins économe en carburant, il ne l'a donc pas supplanté, mais il est toujours plus fiable et performant dans des conditions difficiles. De plus, le MTVR est plus résistant et plus capable de faire face à des situations potentiellement dangereuses, offrant une meilleure protection contre les armes légères que le M939."

 GRE_mechanized_marine_equipment_1: "Buffle d'eau LVT-4"
 GRE_mechanized_marine_equipment_1_short: "LVT-4"
 GRE_mechanized_marine_equipment_1_desc: "Le LVTP-4 est un véhicule d'atterrissage amphibie conçu par Ford Machinery Corporation au début des années 40. Le LVTP-4 a été utilisé pendant la Seconde Guerre mondiale, en Corée et au Vietnam. Il utilise un moteur radial à 7 cylindres W-670-9A et peut parcourir jusqu'à 75 miles dans l'eau à 7 mph. Evolution du LVTP-1, le LVTP-4 est capable de parcourir des distances incroyables, bien qu'à des vitesses lentes. Si vous devez traverser 70 milles d'eau et disposer d'environ 10 heures pour le faire, le LVTP-4 est votre véhicule de choix. Il est capable de transporter des troupes ou des véhicules. "
 GRE_mechanized_marine_equipment_2: "LVT(A)-5"
 GRE_mechanized_marine_equipment_2_short: "LVT(A)-5"
 GRE_mechanized_marine_equipment_2_desc: "LVT(A)-4 avec une tourelle motorisée et un gyrostabilisateur pour l'obusier. Certains ont été améliorés à la fin des années 1940 en modifiant la configuration du blindage."
 GRE_mechanized_marine_equipment_3: "Véhicule amphibie d'assaut AAVP-7"
 GRE_mechanized_marine_equipment_3_short: "AAVP-7"

