 GRE_cv_jet_CAS_equipment_1: "Curtiss SB2C-5 Helldiver"
 GRE_cv_jet_CAS_equipment_1_short: "SB2C-5 Helldiver"
 GRE_cv_jet_CAS_equipment_1_desc: "Remplaçant le SBD Dauntless, le SB2C, introduit en 1942, était bien plus rapide que le SBD qu'il remplaçait, mais c'était un avion difficile à piloter, ce qui lui valut le surnom désobligeant de « SOB, 2e classe ». Malgré cela et un rapport cinglant qui gâchera à jamais l'héritage de la Curtiss Aircraft Company, le « Helldiver » eut un excellent bilan de combat tout au long de la guerre du Pacifique. La variante de l'USAAF l'appelait A-25 Shrike."
 
