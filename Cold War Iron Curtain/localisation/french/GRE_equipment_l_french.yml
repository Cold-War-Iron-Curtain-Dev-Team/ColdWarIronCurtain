### Greece Helicopters 

 GRE_cargo_helicopter_equipment_2: "Boeing-Meridionali CH-47C Chinook"
 GRE_cargo_helicopter_equipment_2_short: "CH-47C Chinook"
 GRE_cargo_helicopter_equipment_2_desc: "Le CH-47 (à l'origine HC-1B) est un hélicoptère bimoteur à rotor tandem qui compte parmi les hélicoptères de transport les plus lourds de l'Ouest. Remplaçant le CH-37 Mojave, le CH-47 possède plusieurs moyens de chargement de diverses marchandises, notamment plusieurs portes à travers le fuselage, une large rampe de chargement située à l'arrière du fuselage et un total de trois crochets de chargement ventraux externes pour transporter des charges suspendues. C'était également l'hélicoptère le plus rapide parmi ses contemporains lors de son introduction en 1962, et il est toujours considéré actuellement comme l'un des hélicoptères les plus rapides de l'arsenal de l'armée américaine. Son nom, « Chinook », vient du peuple amérindien Chinook de l'État de Washington actuel."
 GRE_cargo_helicopter_equipment_3: "Boeing CH-47D Chinook"
 GRE_cargo_helicopter_equipment_3_short: "CH-47D Chinook"
 GRE_cargo_helicopter_equipment_3_desc: "Le CH-47D partage la même cellule que les modèles précédents, la principale différence étant l'adoption de moteurs plus puissants. Les premiers CH-47D étaient à l'origine propulsés par deux moteurs T55-L-712, le moteur le plus courant étant le dernier T55-GA-714A. Grâce à son système de chargement à triple crochet, le CH-47D peut transporter de lourdes charges utiles à l'intérieur et jusqu'à 26 000 lb (12 000 kg) (comme des conteneurs de 40 pieds ou de 12 mètres) à l'extérieur. Il a été mis en service pour la première fois en 1979. Dans les opérations d'assaut aérien, il sert souvent de moteur principal à l'obusier M198 de 155 mm, accompagnant 30 cartouches et un équipage de 11 hommes."

