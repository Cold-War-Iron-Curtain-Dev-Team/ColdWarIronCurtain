 GRE_mechanized_equipment_4: "Transporteur, personnel, entièrement chenillé, blindé, M59"
 GRE_mechanized_equipment_4_short: "M59"
 GRE_mechanized_equipment_4_desc: "Le M59 est un APC développé par la société FMC en 1951. Il a été utilisé au Vietnam et au Liban. Le M75 était équipé de 2 moteurs essence 6 cylindres en ligne, d'une transmission Hydramatic 301MG et d'une suspension à barre de torsion. Il peut se déplacer jusqu'à 32 mph sur 120 miles. Le M59 a rapidement remplacé le M75 car il était amphibie, plus petit et beaucoup moins cher à produire. Le M59 était également utilisé comme porteur de mortier et comme véhicule de soutien."
