 GRE_jet_multirole_equipment_4: "Sabre nord-américain F-86F-30"
 GRE_jet_multirole_equipment_4_short: "Sabre F-86F-30"
 GRE_jet_multirole_equipment_4_desc: "D'autres améliorations du sabre F-86F pour le rendre plus efficace au combat contre les nouveaux avions équipés de postcombustion en les armant de points d'emport et de rails pour lancer des missiles AIM-9B Sidewinders."
 GRE_jet_multirole_equipment_5: "Chasseur stellaire Lockheed F-104G"
 GRE_jet_multirole_equipment_5_short: "Chasseur stellaire F-104G"
 GRE_jet_multirole_equipment_6: "McDonnell Douglas F-4D Phantom II"
 GRE_jet_multirole_equipment_6_short: "F-4D Fantôme II"
 GRE_jet_multirole_equipment_6_desc: "F-4C avec avionique mise à jour et radar AN/APQ-109."
 GRE_jet_multirole_equipment_7: "Dassault Mirage F1CG"
 GRE_jet_multirole_equipment_7_short: "Mirage F1CG"
 GRE_jet_multirole_equipment_8: "Dassault Mirage F1CG-200"
 GRE_jet_multirole_equipment_8_short: "Mirage F1CG-200"
 GRE_jet_multirole_equipment_9: "Dassault Mirage 2000EGM"
 GRE_jet_multirole_equipment_9_short: "Mirage 2000EGM"
 GRE_jet_multirole_equipment_10: "General Dynamics F-16C Block 25 Faucon de combat"
 GRE_jet_multirole_equipment_10_short: "F-16C Bloc 25"
 GRE_jet_multirole_equipment_10_desc: "Première sous-variante du F-16C, un nouveau radar a été installé et un système de contrôle de tir amélioré, ainsi que des systèmes de données intégrés pour une capacité d'attaque de nuit améliorée. Introduite en 1984, la variante F-16C B25 servira de grande capacité pendant la guerre du Golfe Persique."
 #GRE_jet_multirole_equipment_10: "General Dynamics F-16C Block 40/42 Fighting Falcon"
 #GRE_jet_multirole_equipment_10_short: "F-16C Block 40/42"
 #GRE_jet_multirole_equipment_10_desc: "The Block 40/42 sub-variant was the first to utilize the Low Altitude Navigation and Targeting Infrared for Night pod, also known as LANTIRN. In addition, the undercarriage was strengthened and slightly lengthened to accommodate this new avionics package. The Block 40/42 would also be capable of using Precision-Guided Bombs and Stand-Off Dispensers. As a result, the aircraft was unofficially designated as F-16CG and given the unofficial nickname of 'Night Falcon.'"
 
 #GRE_mr_stealth_fighter_equipment_1: "Dassault Rafale C"
 #GRE_mr_stealth_fighter_equipment_1_short: "Rafale C"
 GRE_mr_stealth_fighter_equipment_1: "General Dynamics F-16C Block 52+ 'Vipère'"
 GRE_mr_stealth_fighter_equipment_1_short: "F-16C Bloc 52+"
 GRE_mr_stealth_fighter_equipment_1_desc: "Les principales différences de cette variante sont l'ajout de la prise en charge des réservoirs de carburant conformes (CFT), d'un compartiment dorsal, du radar APG-68 (V9), d'un système de génération d'oxygène embarqué (OBOGS) et d'un casque JHMCS. Les CFT sont montés au-dessus de l'aile, des deux côtés du fuselage et sont facilement démontables. Ils fournissent 440 gallons américains (1 665 L) ou environ 3 000 livres (1 400 kg) de carburant supplémentaire, ce qui permet d'augmenter la portée ou le temps passé en station et de libérer des points d'attache pour les armes au lieu des réservoirs de carburant sous les ailes. Tous les avions biplaces « Plus » sont dotés d'un compartiment dorsal avionique élargi qui est situé derrière le cockpit et s'étend jusqu'à la queue. Il ajoute 30 pieds cubes (850 L) à la cellule pour plus d'avionique avec seulement de légères augmentations de poids et de traînée."

 GRE_jet_light_equipment_1: "Canadair CT-133 Silver Star"
 GRE_jet_light_equipment_1_short: "Étoile d'argent CT-133"
 GRE_jet_light_equipment_1_desc: "Le Canadair CT-133 Silver Star (numéro de modèle d'entreprise CL-30) est la version canadienne construite sous licence de l'avion d'entraînement à réaction Lockheed T-33, en service des années 1950 à 2005. La version canadienne était propulsée par le turboréacteur Rolls-Royce Nene 10, tandis que la production de Lockheed utilisait l'Allison J33."
 GRE_jet_light_equipment_2: "T-2 Buckeye nord-américain"
 GRE_jet_light_equipment_2_short: "T-2 Buckeye"
 GRE_jet_light_equipment_2_desc: "Les 25 premiers T-37C furent reçus en 1964 et servirent pendant trente-huit ans d'avion d'entraînement de base de l'armée de l'air hellénique. En 1988, 10 T-37B supplémentaires ont été reçus de la Royal Jordanian Air Force. Ceux-ci étaient de couleur entièrement blanche, contrairement au T-37C, qui était en argent et orange. Les deux types ont été mis hors service en 2002."
 GRE_jet_light_equipment_3: "Chasseur de la liberté Northrop F-5A"
 GRE_jet_light_equipment_3_short: "Chasseur de la liberté F-5A"
 GRE_jet_light_equipment_3_desc: "Le F-5A a été développé comme un avion de combat léger destiné principalement à l'exportation. Il est plus léger et moins cher à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour remplacer les escadrons de chasseurs à courte portée. Malgré cela, ce type s'est avéré assez agile et était l'avion le plus proche pour rivaliser avec le MiG-21 « Fishbed » soviétique. Parce qu'il a été utilisé par la majorité des alliés de l'Amérique au plus fort de la guerre froide, il a été appelé à juste titre « Freedom Fighter »."
 GRE_jet_light_equipment_4: "Chasseur de la liberté Northrop F-5B"
 GRE_jet_light_equipment_4_short: "Chasseur de la liberté F-5B"
 GRE_jet_light_equipment_4_desc: "L'avion américain Northrop F-5B Freedom Fighter utilisé par la Royal Norwegian Airforco. Principalement utilisé comme entraîneur d'introduction pour d'autres avions à réaction multirôles, il disposait de points d'attache pour les ordonnances."
 GRE_jet_light_equipment_5: "Northrop F-5A Freedom Fighter PUFF"
 GRE_jet_light_equipment_5_short: "F-5A BOUFFÉE"
 GRE_jet_light_equipment_5_desc: "Les F-5A norvégiens ont reçu une série de mises à niveau dans l'ensemble de leur service, notamment la compatibilité avec les missiles air-sol guidés (tels que Maverick et Shrike), l'installation de systèmes ECM et des améliorations de l'avionique. Le F-5A PUFF est une variante compatible SEAD."

