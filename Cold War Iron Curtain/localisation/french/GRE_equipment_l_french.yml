 GRE_scout_helicopter_equipment_2: "Agusta-Bell AB-206 JetRanger"
 GRE_scout_helicopter_equipment_2_short: "AB-206"
 GRE_scout_helicopter_equipment_3: "Bell OH-58D Kiowa"
 GRE_scout_helicopter_equipment_3_short: "OH-58D Kiowa"
 GRE_scout_helicopter_equipment_3_desc: "La variante « D » améliorée du Kiowa était le résultat du programme d'amélioration des hélicoptères de l'armée (AHIP). Il était doté de fonctionnalités telles qu'une transmission et un moteur améliorés pour les vols en sieste de terre (niveau extrêmement bas) de l'hélicoptère, ainsi qu'une configuration unique de rotor principal à quatre pales qui lui permettait d'être beaucoup plus silencieux que les autres hélicoptères, plus encore ses prédécesseurs. L'OH-58D a introduit le viseur distinctif monté sur mât (MMS) au-dessus du système de rotor et un cockpit en verre mixte, avec des instruments traditionnels identifiés comme « en veille » pour une utilisation d'urgence."
 GRE_scout_helicopter_equipment_4: "Bell OH-58D Kiowa Guerrier"
 GRE_scout_helicopter_equipment_4_short: "OH-58D Kiowa Guerrier"
 GRE_scout_helicopter_equipment_4_desc: "Le Kiowa Warrior, parfois désigné par son acronyme KW, est la version armée du OH-58D Kiowa. La principale différence qui distingue le Kiowa Warrior de l'avion AHIP d'origine est un pylône d'armes universel monté des deux côtés de l'avion. La mise à niveau du Kiowa Warrior comprend également des améliorations de la puissance disponible, de la navigation, de la communication et de la capacité de survie, ainsi que des modifications visant à améliorer la déployabilité de l'avion."

 GRE_attack_helicopter_equipment_3: "Hughes AH-64A Apache"
 GRE_attack_helicopter_equipment_3_short: "AH-64A Apache"
 GRE_attack_helicopter_equipment_3_desc: "Introduit en 1986 pour remplacer l'AH-1 dans l'armée américaine, l'AH-64 est l'un des hélicoptères d'attaque les plus connus au monde. Il comprend une suite de capteurs montés sur le nez pour les systèmes d'acquisition de cibles et de vision nocturne. Un équipement de mission typique (et célèbre) est connu pour être son canon à chaîne de 30 mm transporté entre le train d'atterrissage et quatre points d'attache d'aile tronquée pour un mélange de nacelles de fusée Hydra et de missiles antichar AGM-114 Hellfire. Surnommé « Apache », l'AH-64 représente le summum de l'aviation par hélicoptère."
 GRE_attack_helicopter_equipment_4: "McDonnell Douglas AH-64D Apache"
 GRE_attack_helicopter_equipment_4_short: "AH-64D Apache"
 GRE_attack_helicopter_equipment_4_desc: "Fierté de l'armée américaine, en plus de sa superbe maniabilité, cette variante est livrée sans le radar Longbow, mais elle pourrait être appelée « Longbowless Delta » et n'est pas connue sous le nom d'« Apache Longbow ». Même s'il est livré sans ce système radar, il s'agit toujours d'une variante entièrement améliorée."

