 GRE_infantry_equipment_0: "Fusil américain, calibre.30, M1"
 GRE_infantry_equipment_0_short: "M1 Garand"
 GRE_infantry_equipment_0_desc: "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."

 GRE_infantry_equipment_1: "Fabrique Nationale Fusil Automatique Léger"
 GRE_infantry_equipment_1_short: "FN FAL"
 GRE_infantry_equipment_1_desc: "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 GRE_infantry_equipment_2: "Heckler & Koch G3"
 GRE_infantry_equipment_2_short: "Heckler & Koch G3"
 GRE_infantry_equipment_2_desc: "Modèle original basé sur le CETME Model 58 introduit en 1959 et approuvé en 1960. Il avait une crosse et un garde-main en bois."

 GRE_infantry_equipment_3: "Heckler & Koch G3A3"
 GRE_infantry_equipment_3_short: "Heckler & Koch G3A3"
 GRE_infantry_equipment_3_desc: " La version de 1963 la plus connue. Des viseurs à tambour avec un guidon amélioré, un suppresseur de flash/frein de bouche capable de tirer des grenades aux normes OTAN, une crosse fixe en plastique solide et un protège-main en plastique qui n'entre pas en contact avec le canon flottant. Le protège-main était disponible en version fine et ventilée et en version large. Ce dernier permet la fixation d'un bipied."

 GRE_infantry_equipment_4: "EBO/Heckler & Koch G3A4"
 GRE_infantry_equipment_4_short: "EBO G3A4"
 GRE_infantry_equipment_4_desc: "Version grecque du G3A4 produite sous licence par EBO. Le G3A4 utilise des viseurs à tambour et une crosse rétractable à position unique et entrerait en service avec les unités de première ligne en 1974."
