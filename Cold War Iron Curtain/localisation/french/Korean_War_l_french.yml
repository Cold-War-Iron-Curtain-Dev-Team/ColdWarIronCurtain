 #Decision
 korean_war_kpa_category: "La guerre de Corée"
 korean_war_kpa_category_desc: "\n\n\n\n\n£Korean_War_KPA\n\n\n\n\n\n\nDes années de préparation nous ont amenés à ce moment charnière. La réunification de la péninsule coréenne semble enfin possible. Pourtant, la menace toujours présente d'une intervention étrangère, en particulier pour soutenir le régime voyou du sud, se cache dans l'ombre. Nous devons rester vigilants face à ces forces extérieures qui cherchent à détruire la Révolution.\n\nPour remporter une victoire décisive, nous devons atteindre Busan avant que les premières troupes impérialistes ne mettent le pied sur notre sol. Le chemin à parcourir sera semé d'embûches, mais notre détermination et notre détermination collectives nous guideront vers la réunification et la restauration de notre patrie."
 #Dynamic mod
 KPA_South_Korean_Resistance: "Résistance des bandits sud-coréens"