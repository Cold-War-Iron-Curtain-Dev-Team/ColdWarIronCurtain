l_french: 
 GDR_Stabilization_of_the_Republic: "Stabilisation de la République"
 GDR_Stabilization_of_the_Republic_desc: "La transition de la dictature fasciste à la république socialiste ne s'est pas faite sans heurts. Nous devrions nous concentrer sur la stabilisation de notre régime, de peur de subir une répétition de la situation de 1933."
 GDR_Reaffirm_Socialist_Ostorientierung: "Réaffirmer l'orientation socialiste"
 GDR_Reaffirm_Socialist_Ostorientierung_desc: "Malgré les récents changements de direction, nous devons nous rappeler que nos frères socialistes de Moscou restent nos plus puissants alliés contre les envahisseurs impérialistes."
 GDR_Focus_on_Improving_Living_Standards: "Mettre l'accent sur l'amélioration du niveau de vie"
 GDR_Focus_on_Improving_Living_Standards_desc: "Les capitalistes se sont fait un devoir de faire de l'Allemagne de l'Ouest un paradis et d'inciter notre population à y émigrer. Pour contrecarrer cela, nous augmenterons notre niveau de vie et ferons de l'Allemagne de l'Est un véritable paradis pour les travailleurs !"
 GDR_Collaborate_with_Progressive_Bourgeois: "Collaborer avec la Bourgeoisie Progressiste"
 GDR_Collaborate_with_Progressive_Bourgeois_desc: "Il y a une poignée de bourgeois progressistes disposés à travailler avec nous. Si jamais ils deviennent un problème, ils sont suffisamment petits pour être éliminés avec des conséquences minimes."
 GDR_Consider_Further_Assistance_for_Displaced: "Assistance supplémentaire aux personnes déplacées"
 GDR_Consider_Further_Assistance_for_Displaced_desc: "La guerre a laissé de nombreux Allemands déplacés et sans abri. Redoublons nos efforts pour réhabiliter ces camarades !"
 GDR_Modernize_Agricultural_Machinery_Rental_Stations: "Moderniser les stations de location de machines agricoles"
 GDR_Modernize_Agricultural_Machinery_Rental_Stations_desc: "Si nous ne modernisons pas notre secteur des machines agricoles, nous courons le risque d'une production réduite, ou pire, d'une famine."
 GDR_Provide_Incentives_for_LPG_Adoption: "Offrir des incitations à l'adoption du GPL"
 GDR_Provide_Incentives_for_LPG_Adoption_desc: "Les coopératives de production agricole sont essentielles à nos efforts de collectivisation. Nous devrions offrir des incitations à nos agriculteurs pour qu'ils les adoptent."
 GDR_Propose_Closer_Integraton_with_COMECON: "Proposer une intégration plus étroite avec le COMECON"
 GDR_Propose_Closer_Integraton_with_COMECON_desc: "Si nous voulons poursuivre des relations plus étroites avec Moscou et nos alliés socialistes voisins, nous devons alors essayer de nous intégrer davantage dans le COMECON émergent."
 GDR_Sideline_Ulbricht: "Ulbricht sur la touche"
 GDR_Sideline_Ulbricht_desc: "Ulbricht nous est toujours utile, à condition que nous puissions le garder sous contrôle. Nous lui confierons la responsabilité d'un bureau mineur et insignifiant où il ne pourra causer aucun mal."
 GDR_Promote_Ebert: "Promouvoir Ebert"
 GDR_Promote_Ebert_desc: "Friedrich Ebert Jr. S'est avéré être un digne successeur de l'héritage de son père. Il devrait être promu à une fonction supérieure !"
 GDR_Reevaluate_the_West_Commission: "Réévaluer la Commission Ouest"
 GDR_Reevaluate_the_West_Commission_desc: "La Commission Ouest existe pour nous protéger de la propagande ouest-allemande et des efforts de subversion ; cependant, nombreux sont ceux qui commencent à se demander si leurs méthodes n'entravent pas les progrès vers l'unification nationale. Nous devrions enquêter là-dessus."
 GDR_Revamp_FDJ_Leadership: "Restructurer la direction de la FDJ"
 GDR_Revamp_FDJ_Leadership_desc: "La Jeunesse libre allemande est une excellente organisation ; nous ferions mieux de veiller à ce qu'il soit dirigé uniquement par les meilleurs dirigeants."
 GDR_Seek_Correspondance_with_the_SPD: "Rechercher une correspondance avec le SPD"
 GDR_Seek_Correspondance_with_the_SPD_desc: "Le SPD s'éloigne lentement de la gauche et se dirige vers le centre. Peut-être que si nous agissons rapidement, nous pourrons mettre un terme à cette tendance gênante et les faire travailler en étroite collaboration avec nous."
 GDR_Decry_the_Rightward_Shift_of_the_SPD: "Décriez le virage à droite du SPD"
 GDR_Decry_the_Rightward_Shift_of_the_SPD_desc: "Le SPD a opéré des virages inconfortables vers la droite ces dernières années. Il s'agit d'une trahison flagrante de leurs principes fondateurs et doit être dénoncée !"
 GDR_The_Platform_for_the_Special_German_Route_to_Socialism: "La voie spéciale allemande vers le socialisme"
 GDR_The_Platform_for_the_Special_German_Route_to_Socialism_desc: "Wolfgang Harich et ses partisans ont présenté une liste de revendications qui, selon eux, mettraient l'Allemagne sur la bonne voie vers le socialisme et l'unité nationale. Voyons ce qu'ils ont à dire."
 GDR_Deutsche_an_einen_Tisch: "Les Allemands à table"
 GDR_Deutsche_an_einen_Tisch_desc: "Il est temps pour les Allemands de l'Est et de l'Ouest de s'asseoir et de discuter de l'avenir de notre nation."
 GDR_Visit_Pyeongyang: "Visiter Pyongyang"
 GDR_Visit_Pyeongyang_desc: "La RPDC se trouve dans une situation similaire à la nôtre et nous avons beaucoup à apprendre de nos camarades coréens. Une visite d'État s'impose."
 GDR_Empower_the_Intelligenistia: "Renforcez l'Intelligenistia"
 GDR_Empower_the_Intelligenistia_desc: "La RPDC est unique parmi les pays socialistes dans la mesure où elle considère l'intelligentsia comme une composante importante de sa société, encourageant l'alphabétisation et faisant progresser la culture. Nous devrions suivre leur exemple."
 GDR_Lift_Academic_Censorship: "Lever la censure académique"
 GDR_Lift_Academic_Censorship_desc: "Si nous voulons rivaliser avec la puissance émergente de notre homologue occidental, nous devrons lever certaines restrictions dans nos cercles universitaires."
 GDR_Sideline_Harich: "Harich en marge"
 GDR_Sideline_Harich_desc: "Même si Wolfgang Harich a été assez courageux pour déserter l'armée hitlérienne, on ne peut toujours pas lui faire entièrement confiance. Nous allons le garder sous surveillance et lui permettre de divaguer tranquillement sur la philosophie, pour l'instant."
 GDR_Agree_to_Submit_the_Proposal_to_the_Party: "Soumettre la proposition au parti"
 GDR_Agree_to_Submit_the_Proposal_to_the_Party_desc: "Élections libres, liberté d'expression, réformes économiques, coopération gouvernementale est-ouest-allemande et pleine souveraineté sur l'Union soviétique. C'est sur ces points, entre autres, que nous pourrons parvenir au véritable socialisme en Allemagne et à la réunification de notre peuple."
