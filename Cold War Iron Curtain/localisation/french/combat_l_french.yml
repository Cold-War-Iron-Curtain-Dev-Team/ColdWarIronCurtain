 SCREENING_TOOLTIP_FOR_CAPITAL_BOX:1 "Vos $NUM|.0H$ §YCapital Ships§! peuvent filtrer efficacement jusqu'à $NUM_2|.0H$ Transporteurs et contrôlent actuellement $NUM_3|.0H$ navires."
 SCREENING_TOOLTIP_BASE:0 "Piètement : $NUM|H.1$"
 SCREENING_TOOLTIP_LOW_INFO:1 "Les lacunes dans le groupe de filtrage §Y§! conduisent à une faible efficacité de filtrage, permettant aux sous-marins ennemis de cibler la prochaine ligne de bataille."
 SCREENING_TOOLTIP_BONUSES:1 "Votre efficacité de filtrage donnera les bonus suivants à votre ligne de bataille §Y§!:\n"
 SCREENING_TOOLTIP_BONUSES_CAPITAL:1 "Votre efficacité de contrôle donnera les bonus suivants à votre groupe de transporteurs §Y§!:\n"
 SCREENING_TOOLTIP_NO_SCREENS:1 "Un manque de §YScreening Ships§! permettra aux sous-marins ennemis et autres navires légers de cibler vos vaisseaux capitaux avec des torpilles et donnera de lourdes pénalités au positionnement."
 SCREENING_BOX_TOOLTIP:0 "Le §YScreening Group§! contient tous les navires de contrôle - généralement des croiseurs légers et des destroyers - chargés de maintenir les navires de contrôle ennemis à l'écart de la ligne de bataille principale §Y§!. Un écran insuffisant permettra aux écrans ennemis de lancer des attaques à la torpille contre la ligne de bataille."
 CAPITAL_BOX_TOOLTIP:0 "La ligne de bataille §Y§! fournit la principale puissance de feu directe de la flotte, généralement sous la forme de cuirassés et de croiseurs lourds. Ils empêcheront également les vaisseaux capitaux ennemis de tirer sur les §YCarriers§!amis."
 CARRIER_BOX_TOOLTIP:1 "Le groupe de transporteurs §Y§! fournit la principale puissance de frappe à longue portée de la flotte. Protégés de l'ennemi par le §YScreening Group§! et la §YBattleline§!, les porte-avions peuvent lancer des frappes sur l'ennemi sans interférence. Si des convois §Y§! sont présents dans la bataille, ils apparaîtront également dans cette zone."
 SUBMARINE_BOX_TOOLTIP:0 "Le §YSubmarine Wolfpack§! tentera d'achever les navires en fuite avec ses torpilles tout en restant caché. Le manque de navires anti-sous-marins dédiés parmi l'ennemi permettra aux sous-marins de s'échapper sans être détectés."
 NAVAL_READY_TO_FIRE:0 "Pas prêt à attaquer"
 NAVAL_READY_TO_FIRE_DESC:0 "En raison des distances impliquées, certaines classes de navires ne pourront pas attaquer directement lorsque le combat sera engagé."
