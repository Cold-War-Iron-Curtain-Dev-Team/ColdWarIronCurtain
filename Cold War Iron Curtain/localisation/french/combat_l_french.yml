 combat_stat_depth_charges_info:1 "§HFrais de profondeur§!\n\nLes grenades sous-marines sont utilisées contre les sous-marins, qui ne peuvent pas être attaqués par d'autres types d'armes.\n"
 combat_stat_light_guns_info:2 "§HArmes légères§!\n\nLes canons légers sont plus efficaces contre les navires à écran §Y§!. Les canons légers de votre flotte vont cibler l'ennemi le plus proche. \n"
 combat_stat_heavy_guns_info:2 "§HASHM§!\n\nLes AShM sont plus efficaces contre §YCapital Ships§!. Ils peuvent atteindre les deux groupes d'ennemis les plus proches et préféreront tirer sur des cibles plus larges.\n"
 combat_stat_anti_air:1 "§HFlotte anti-aérienne§!\n\nL'Anti-Air de la Flotte est calculé en utilisant l'Anti-Air de tous les navires de la flotte entière et perturbera les bombardiers ennemis attaquant la flotte et réduira les dégâts qu'ils peuvent causer.\n"
 combat_stat_torpedoes_info:2 "§HTorpilles§!\n\nLes torpilles ignorent le blindage et sont beaucoup plus efficaces contre les vaisseaux capitaux §Y§!. Le nombre de torpilles lancées contre l'ennemi dépend de leur §YEfficacité de dépistage§!.\n"
 screening_efficiency_info:2 "§HEfficacité du dépistage§!\n\nL'efficacité de filtrage élevée §Y§! défend vos §YCapital Ships§! contre les torpilles ennemies. Vos transporteurs seront contrôlés à la fois par votre capitale et par vos navires de contrôle. Les vaisseaux capitaux ne seront filtrés que par vos vaisseaux de contrôle.\n"
 POSITIONING_INFO:1 "§HPositionnement§! représente le positionnement de votre flotte par rapport à l'ennemi. Cela dépend de la taille relative des flottes, de la météo et des compétences du chef. Les navires qui rejoignent le combat après le début du combat subiront une pénalité temporaire de positionnement.\n\nSi le positionnement est inférieur à 100 %, la flotte subira des pénalités.\n"
