l_french:
 PRC_Focus_1_desc:0 "Après la victoire des communistes dans la guerre civile, les nationalistes se sont enfuis à Taïwan et l'ont fermement protégée contre toute nouvelle offensive maoïste. En plus de Taïwan, quelques îles de la mer de Chine Méridionale ont également été capturées par les nationalistes, comme Kinmen et les îles Matsu, déployant 58 000 soldats sur Kinmen et 15 000 soldats sur les îles Matsu. Récemment, les troupes de l'Armée Populaire de Libération ont commencé a bombarder ces iles ; Zhou Enlai ayant affirmé que Taiwan devait être libérée des forces oppressive du Kuomintang qui la dirige actuellement d'une main de fer. L'APL a également envoyé des forces pour capturer les îles Yijiangshan, localisées au large de Zhejiang."
 PRC_Focus_2_desc:0 "À la suite de la Campagne des Cent Fleurs, Mao Zedong était déterminé à purger les éléments \"réactionnaires\" de la nation, établissant une campagne pour poursuivre ceux qui critiquaient le gouvernement de la RPC. Immédiatement après la fin du mouvement des Cent Fleurs, Mao a commencé à arrêter intellectuels et critiques ; avec des peines de travaux forcés ou d'exécution dans certains cas. Le pouvoir judiciaire étant remplacé par des cadres politiques et la police. Très vite, 300 000 personnes avaient été étiquetées comme de droite - la rumeur disait que Deng Xiaoping était l'un des procureurs les plus enthousiastes du mouvement pendant les purges. Le ressentiment contre les \"droitistes\" remonte aussi loin dans le Parti communiste que la Longue Marche, illustrée par la haine contre Zhang Bojun."
 PRC_Focus_3_desc:0 "\nAvec l'avènement du mouvement des Cent Fleurs, qui a apporté des dizaines de lettres et des protestations franches dans la Chine maoïste, il n'a pas fallu longtemps aux minorités ethniques et religieuses de toute la Chine pour suivre les exemples des intellectuels pour critiquer leur traitement en Chine par les autorités ; et en même temps d'adresser de critiques au PCC et à Mao Zedong lui-même. Le Grand Timonier répondit bientôt par la purge des intellectuels et avec eux, des minorités. Soumis à la torture, à la pression et à l'humiliation publique, nombre de ces cas ont été suivis de suicides ou d'exécutions, subissant un sort similaire à celui des intellectuels écrasés lors de la Campagne anti-droitiste."
 PRC_Focus_4_desc:0 "Le president Mao a déclaré que \"la politique de laisser cent fleurs s'épanouir et cent écoles de pensée s'affronter est conçue pour favoriser l'épanouissement des arts et le progrès de la science\". C'est dans ce but que la RPC a démarré la \"Campagne des Cents Fleurs\", cherchant a encourager les citoyens chinois à exprimer ouvertement leurs opinions, l'idée était de favoriser les intellectuels et leurs discussions des problèmes du pays afin de promouvoir de nouvelles formes ou institutions artistiques et culturelles. Il n'a pas fallu longtemps pour que des manifestations se lèvent contre le PCC et que des lettres inondent Mao de critiques ; tout comme il n'a pas fallu longtemps pour que le président Mao commence une campagne de poursuites contre ceux qui critiquaient le régime et son idéologie, ceux qui étaient ciblés étaient publiquement critiqués et condamnés à des camps de travaux forcés, la Chine a rapidement assisté à la création du Mouvement anti-droitiste."
 PRC_Focus_5_desc:0 "En Mandchourie, Mao Zedong a lancé une campagne pour se débarrasser des éléments corrompus ou pro-taïwanais en Chine, mettant l'accent sur les anciens membres du KMT, les fonctionnaires bureaucrates qui n'étaient pas des membres officiels du parti et les membres du parti corrompus. Les anti étaient l'anti-corruption, l'anti-gaspillage et l'anti-bureaucratie. La campagne des Trois Anti a infligé des peines extrêmement lourdes, incluant la torture. Tous les coupables de crimes avoués ou non avoués ont dû payer des amendes au gouvernement. Le timonier de la nation a affirmé à maintes reprises qu'il s'agissait d'une mesure majeure nécessaire pour débarrasser la Chine des membres corrompus et de ceux qui détournent et stagnent l'économie chinoise avec \"leurs propres gains égoïstes\"."
 PRC_Focus_6_desc:0 "Avec la guerre de Corée, des opportunités ont été offertes à de nombreuses personnes dans le nord de la Chine, ce qui a donné naissance à une nouvelle classe de capitalistes en Mandchourie, qui ont rapidement commencé à se rendre compte qu'ils n'étaient pas vus avec des yeux amicaux à Pékin. La campagne des Cinq Anti a été rapidement lancée, décrite comme une guerre totale contre la bourgeoisie en Chine, et les anti susmentionnés étaient: Anti-corruption, anti-vol des biens de l'État, anti-évasion fiscale, anti-fraude sur les contrats gouvernementaux et anti-vol de l'intelligence économique de l'État. Certaines entreprises ont commencé à envoyer 1 000 confessions par jour afin de se débarrasser de l'immense pression que le PCC leur exerçait ; des défilés d'activistes anticapitalistes ont fait du porte-à-porte pour rendre visite à des chefs d'entreprise, générant une immense pression psychologique. Mao a déclaré que \"nous devons probablement exécuter de dix-mille à plusieurs dizaines de milliers de personnes détournant des fonds à l'échelle nationale avant de pouvoir résoudre le problème\". Il y a eu des centaines de milliers de suicides qui étaient le résultat direct de cette campagne ; les capitalistes chinois n'étant pas mieux traités que les étrangers."
 PRC_Focus_7_desc:0 "\nAlors que la campagne anti-droitiste se poursuit, de nombreux intellectuels sont arrêtés, torturés ou autrement humiliés et emprisonnés. Chen Fengxiao a été emprisonné pendant 15 ans pendant la campagne pour avoir été droitiste et ainsi avoir trahi le mouvement maoïste. De nombreux dissidents ont été brûlés par le feu, battus à mort ou exécutés par peloton d'exécution. Environ 400 000 à 700 000 personnes ont été poursuivies politiquement ; le travail éreintant dans le système pénitentiaire a souvent conduit à leur mort et d'autres ont été complètement exclus de la société, comme Luo Longji et Zhang Bojun, tandis que d'autres comme Chen Mengjia se sont suicidés en raison de l'exclusion et des pressions politiques."
 PRC_Focus_8_desc:0 "\nPendant la Campagne anti-droitiste, afin de faciliter la poursuite des intellectuels et autres dissidents du gouvernement maoïste, des juristes et des travailleurs ont également été poursuivis et condamnés à de lourdes peines de prison pour avoir collaboré ou autrement ralenti le Mouvement. Le système judiciaire a été examiné et surveillé attentivement alors qu'il était lentement remplacé par les cadres du Parti fidèles au PCC et à Mao, et la police déployée afin de faciliter les arrestations et la distribution des peines. Ceux qui n'ont pas été arrêtés ont été transférés vers d'autres emplois qui n'ont pas empêché la prise de contrôle du pouvoir judiciaire indépendant par le parti, une décision qui, pour beaucoup, signifiait que Mao consolidait encore plus son pouvoir en Chine."
 PRC_Focus_9_desc:0 "Aujourd'hui, il a été déclaré que le fils de Mao Zedong, le Dirigeant suprême de la Chine, a été tué au combat par une frappe aérienne. Un officier expérimenté, le fils de Mao a combattu pendant la Seconde Guerre mondiale en tant qu'officier d'artillerie contre le Troisième Reich en Pologne, en temps que volontaire de l'Armée soviétique. Au moment de sa mort, il servait dans l'Armée des Volontaires du Peuple chinois, en tant que secrétaire et traducteur russe pour le commandant de l'APV Peng Dehuai. Il était stationné dans un quartier général de l'APV, dans des grottes près d'une ancienne colonie d'extraction d'or. Il semble que quatre avions américains aient largué des bombes au napalm dans la région, dont l'une a détruit un bâtiment de fortune près des grottes, tuant Mao Anying et un autre officier. Le président Mao serait profondément attristé par cette perte, mais aucun commentaire du timonier n'a été donné à aucun moment."
 PRC_Focus_10_desc:0 "Le Grand timonier de la République populaire de Chine, leader révolutionnaire et théoricien politique Mao Zedong est décédé. Souffrant de deux crises cardiaques plus tôt dans l'année, une dernière crise cardiaque a finalement frappé le dirigeant suprême quelques jours plus tard, juste après minuit. L'UCP a diffusé un important message radio annonçant la nouvelle du décès de Mao, tout en réclamant l'unité du parti. Le chef a été embaumé et drapé dans un drapeau du PCC, où il séjournera dans la Grande Salle du peuple pendant une semaine. On estime qu'un million de personnes viendront voir le timonier une dernière fois, tandis que celles qui sont déjà présentes pour cela pleurent ouvertement ou affichent un certain degré de tristesse. Le portrait officiel du Président Mao a été accroché au mur, avec une banderole indiquant \"Poursuivez la cause laissée par le Président Mao et poursuivez la cause de la révolution prolétarienne jusqu'au bout\"."
 PRC_Focus_11_desc:0 "Le gouvernement chinois a envoyé des troupes à Chamdo dans ce qu'ils appellent une \"Libération du Tibet\" après l'échec des négociations pour incorporer le Tibet dans la nation. l'Armée Populaire de Libération a traversé la rivière Jinsha avec des centaines de soldats qui se sont emparés de la ville frontalière de Qamdo et des hostilités actives ont commencé dans la zone frontalière au nord-est de la rivière Gyamo Ngul Chu et à l'est du 96e méridien. On ne sait pas si la République populaire de Chine poussera immédiatement son désir d'annexer le Tibet, mais cela semble très probable, Mao Zedong affirmant que \"le peuple tibétain a assez souffert, il est enfin temps pour lui de rejoindre la République populaire de Chine et d'être libéré.\""
 PRC_Focus_12_desc:0 "\nAprès la chute de l'armée de la Clique des Ma pendant la guerre civile chinoise, une insurrection avait été établie dirigée par d'anciens généraux et vétérans de Ma Bufang. L'origine de l'insurrection a été la chute de Ma Bufang pendant la campagne du Ningxia. Peu de temps après, de nombreux généraux, pour la plupart musulmans, ont fait défection vers la République populaire de Chine alors que l'effondrement de la Chine nationaliste était imminent. La plupart des anciens généraux musulmans du Kuomintang, tels que Ma Bufang, Ma Hongkui, Ma Dunjing, Bai Chongxi etc. ont tous fui à Taiwan avec le gouvernement de la République de Chine, mais les officiers subordonnés de Ma Bufang sont restés dans la province de Qinghai. Aujourd'hui, les derniers insurgés ont été écrasés à Yiwu, où plus de 700 insurgés ont péri au combat pendant que le drapeau de la RPC flottait au-dessus de la ville de Yiwu."
 PRC_Focus_13_desc:0 "L'APL a annoncé aujourd'hui la fin de l'insurrection tibétaine. Alors que Lhassa se rebellait de manière ouvertement contre la République populaire de Chine, l'armée a bombardé le palais de Norbulingka afin de disperser la foule, plaçant des troupes dans des barricades qui divisaient la ville en une parties nord et sud. Tôt le matin, les rebelles tibétains ont subi une défaite contre les troupes de l'Armée populaire de Libération, qui ont mené une bataille sanglante dans les rues avant de marcher vers le monastère de Jokhang, y menant une bataille de trois heures. Quelques instants plus tard, le drapeau de la République populaire de Chine avait été hissé sur le temple, qui a écrasé le soulèvement. Il y a de multiples rumeurs selon lesquelles Pandatsang Rapga, un leader révolutionnaire pro-KMT et pro-RC a joué un rôle déterminant dans la révolte contre la RPC. Le Dalaï Lama reste cependant introuvable."
 PRC_Focus_14_desc:0 "Le Président Mao a déclaré que, parallèlement aux mesures prises pour garantir que le Grand Bond en avant ait lieu, une nouvelle Campagne allée être approuvée pour être exécutée immédiatement, appelée \"Campagne des Quatre Ravageurs\". Le Président affirme qu'il s'agit d'une campagne d'hygiène contre les rats, les mouches, les moustiques et les moineaux. Le moustique étant responsable du paludisme, les rongeurs qui propagent la peste, les mouches considérées comme envahissantes et les moineaux mangent les grains et les graines des récoltes abondantes en Chine. Des concours sont également organisés entre les entreprises, les agences gouvernementales et les écoles en matière de propreté. Il est rapporté que des récompenses immatérielles sont accordées à ceux qui remettent le plus de queues de rat, de mouches mortes et de moustiques ou de moineaux morts."
 PRC_Focus_25_desc:0 "\nDans une première détente avec les nationalistes depuis la trêve de 1946, le Président du Parti communiste chinois, Mao Zedong, a annoncé qu'il proposerait une nouvelle proposition pour Taïwan qui implique des élections générales en Chine continentale et à Taïwan, ainsi que les îles qui compromettent l'intégralité des deux nations. Cette élection générale \"a pour but d'unifier nos deux nations et de décider du sort de la Chine, en laissant le peuple choisir entre le Kuomintang et le Parti communiste chinois\" a déclaré Mao Zedong. Il reste à voir si Taïwan acceptera cette offre, mais de nombreux experts disent qu'il ne s'agit que d'un stratagème de Mao, tenter ainsi de montrer la légitimité de son régime."
 PRC_Focus_16_desc:0 "Le Parti communiste chinois a déclaré aujourd'hui que, pour la première fois depuis qu'il a pris le pouvoir pendant la guerre civile chinoise, l'Assemblée Populaire nationale, le plus haut organe du pouvoir de l'État et de la législature nationale de la RPC, serait libéralisée et qu'il y aurait une participation plus active des petits partis qui en font actuellement partie. L'un des plus fervents partisans de cette décision était le Comité révolutionnaire du KMT, la Ligue démocratique de Chine et l'Association Nationale démocratique de la Construction de Chine étaient également deux partis qui étaient de fervents partisans de cette décision et ont salué cette mesure comme la prochaine étape pour empêcher la Chine de devenir un régime oppressif."
 PRC_Focus_17_desc:0 "Le Président Mao a déclaré aujourd'hui qu'il y aurait une réforme du régime actuel de la République populaire de Chine. Le Président lui-même a félicité les intellectuels qui ont critiqué le gouvernement lors de la campagne des \"Cent Fleurs\"et a fait valoir que\" le moment est venu pour les fleurs de fleurir et pour la Chine de reconnaître les appels de ses habitants\". Cela semble être un indicateur clair par les experts que le régime chinois envisage de réformer son autoritarisme et de se laisser devenir plus modéré, il reste à voir si le président Mao libéralisera ou s'il maintiendra sa main de fer sur le gouvernement."
 PRC_Focus_18_desc:0 "Un soulèvement a commencé aujourd'hui à Lhassa alors que les manifestants affirment que le Tibet est une nation indépendante. Lorsque les craintes que le PCC allait kidnapper le Dalaï-lama ont atteint les oreilles de ses habitants, les gens se sont rapidement rassemblés à l'extérieur du palais afin de l'empêcher de partir, ou pire, d'être expulsé de force par le PCC et d'être confronté à un sort inconnu. Peu de temps après, des barricades avaient été érigées dans les rues de Lhassa et une pétition pour le soutien des rebelles armés est rapidement apparue. Les troupes chinoises et tibétaines ont déjà commencé à se diriger vers Lhassa et des informations ont fait état de la mise en place d'artillerie à portée du palais d'été du Dalaï-lama, le Norbulingka."
 PRC_Focus_19_desc:0 "Kang Sheng et Ren Bishi, respectivement l'un des membres clés de l'appareil de renseignement chinois et le commandant de la Cinquième Armée Rouge, ont affirmé qu'une campagne violente contre les propriétaires terriens en Chine était inévitable car \"trente millions de propriétaires terriens et de paysans riches devraient être détruits\". Aujourd'hui, le grand timonier a déclaré que chaque paysan doit se battre contre ses propriétaires et les tuer à mains nues. Mao a exprimé le désir de ne pas \"corriger prématurément les excès\" et a adopté une politique de laissez-faire face à la violence qui se produit actuellement dans toute la Chine. Le PCC n'a ni approuvé ni sanctionné la violence physique des paysans contre les propriétaires, qui sont pendus, enterrés vivants, démembrés et fusillés. Dans les rues, ils marmonnent \"Dou Di Zhu\" ou \"Combattez les propriétaires\". ll semble que le président Mao renforce les soutiens au parti par tous les moyens nécessaires."
 PRC_Focus_20_desc:0 "Le Premier commandant et commissaire de l'Armée des Volontaires du Peuple, Peng Dehuai, a annoncé aujourd'hui que ses forces entreraient en République Populaire Démocratique de Corée afin de la soutenir. Le régime dirigé par Kim Il-Sung est amical envers la RPC et envers le président Mao en particulier. Le dirigeant chinois a promis de défendre la RPDC et de la soutenir aussi souvent que nécessaire. Il semble que cette armée soit composée des milliers de soldats déterminés à aider leurs frères d'armes coréens contre les forces soutenues par les États-Unis. A l'heure actuelle, il existe un assortiment d'insécurités concernant l'avenir de la péninsule coréenne, mais le président Mao semble convaincu que la fin de la guerre est proche et qu'un drapeau rouge flottera bientôt sur toute la péninsule."
 PRC_Focus_21_desc:0 "\nLa République populaire de Chine renforce ses reconnaissances diplomatiques depuis peu. Le président de la RPC a commencé à demander aux nations de reconnaître sa légitimité par rapport à son homologue nationaliste, la République de Chine. Dès sa sortie de la guerre civile, la République Populaire de Chine a été immédiatement reconnue par l'URSS et les États qui compromettent sa sphère d'influence, tels que la République Socialiste de Roumanie, la République Populaire polonaise et la République Populaire hongroise. La Chine demande la reconnaissance des États asiatiques tels que l'Inde et le Nord-Vietnam. De nombreux experts affirment que c'est une question de temps avant que la RPC ne soit reconnue dans le monde entier, tandis que d'autres affirment que l'idée que la RPC soit un État internationalement reconnu est un rêve éveillé, le sort est encore incertain."
 PRC_Focus_22_desc:0 "\nSuite aux tentatives de la RPC d'obtenir la reconnaissance diplomatique de ses voisins asiatiques, la nation communiste se ramifie maintenant dans d'autres sphères, en l'occurrence l'Europe. La Suisse se présente comme étant très intéressée à reconnaître la RPC et d'autres nations scandinaves telles que le Danemark, la Suède et la Finlande sont toutes des perspectives très positives pour cette nouvelle tentative de reconnaissance par la RPC. C'est encore une question de manœuvres géopolitiques - mais le président Mao a exprimé qu'il était assez positif lorsqu'il s'agit de faire reconnaître sa nation par l'Occident et les experts supposent qu'il est probable qu'elle le sera dans un proche avenir."
 PRC_Focus_23_desc:0 "Le président de la RPC a annoncé aujourd'hui que les différents cultes présents dans la Chine rurale devaient être pourchassés en raison de leur collaboration avec le KMT, ainsi que les éléments réactionnaires et bourgeois en Chine. La Société de la Lance Rouge a déjà commencé à tomber, ses membres ayant été arrêtés rapidement par les forces du PCC et la Société des Grandes Épées semble avoir connu le même sort, ainsi que la Société du Sable Jaune. Toutes ces sociétés ont été inspirées dans leurs activités par des idées monarchistes millénaires, spirituelles et romancées; la plupart sinon toutes ces sociétés se sont opposées avec véhémence aux Qing et croyaient qu'une restauration Ming apporterait le bonheur et la paix à toute la Chine, il semble que le président Mao soit en profond désaccord avec cette idée."
 PRC_Focus_24_desc:0 "Mao Zedong a officiellement annoncé que la Chine adopterait une ligne de conduite découlant de la nécessité de dépasser la société agraire qu'elle a été pendant des siècles et de la transformer en une nation moderne et industrielle. C'est dans ce but que le Président du PCC a inauguré le Grand Bond en avant. En utilisant la collectivisation dans les communes populaires, en encourageant tous les paysans résidant en République populaire à produire des hauts fourneaux ruraux afin d'approvisionner l'État en acier, en interdisant les exploitations privées et en utilisant des projets d'irrigation sans recourir à des ingénieurs ayant une formation formelle, le dirigeant chinois a promis de tout son cœur que cette campagne fera avancer la Chine dans une nouvelle direction, en faisant l'une des plus grandes puissances du monde, si ce n'est la plus grande."
 PRC_Focus_15_desc:0 "Des poignées de main fortes et jubilatoires ont eu lieu aujourd'hui lorsque le Premier ministre de la république populaire de Chine et le Premier ministre de la république populaire démocratique de Corée se sont serrés la main, le sourire aux lèvres, lors de la signature du Traité d'amitié d'Aide mutuelle et de Coopération sino-Nord-Coréen. Promettant une coopération pacifique entre les deux nations dans les domaines de la culture, de l'économie, de la technologie et d'autres domaines sociaux, il est clair que la RPDC s'aligne sur la Chine. De plus, dans le deuxième article du traité, il est indiqué que les deux nations prendront toutes les mesures nécessaires pour s'opposer à tout pays ou coalition de pays qui pourrait attaquer l'une ou l'autre nation, une mesure que beaucoup supposent être un moyen pour la RPDC de sécuriser leur place avec une grande puissance sans subir une invasion de son homologue capitaliste des États-Unis."
 PRC_Focus_26_desc:0 "La plupart des États asiatiques et africains se sont réunis aujourd'hui lors d'une réunion massive pour discuter de la coopération économique et culturelle afro-asiatique, s'opposant au colonialisme ou au néocolonialisme de toute nation sous quelque forme que ce soit. Composés de vingt-neuf pays, ils représentent une population totale de 1,5 milliard de personnes, soit 54% de la population mondiale. Une déclaration en dix points est en cours d'élaboration et il semble probable qu'elle soit adoptée à l'unanimité. Les plus importants sont l’absence d'intervention ou d'ingérence dans les affaires intérieures d'un autre pays, l'absence d'actes de menaces d'agression ou d'usage de la force contre l'intégrité territoriale ou l'indépendance politique de tout pays. Un communiqué final est également présenté, qui souligne la nécessité pour les pays en développement de réduire leur dépendance économique vis-à-vis des principaux pays industrialisés en se fournissant mutuellement une assistance technique par le biais d'échanges d'experts et d'assistance technique."
 PRC_Focus_27_desc:0 "\nLe fondateur du Juche et le supposé libérateur des Nord-Coréens, Kim Il-Sung, a été déposé lors d'un coup d'État de palais. Les officiers ayant pris le pouvoir, partisans du modèle chinois du socialisme et après avoir vu le triomphe de Mao contre les forces nationalistes pendant la guerre civile, ont proclamé que la nouvelle République populaire démocratique de Corée poursuivrait la lutte contre le capitalisme aux côtés de son nouvel allié, la RPC. Le président Mao a été ravi d'apprendre la nouvelle et a déclaré qu'il voyait un très bel avenir pour tous les habitants de la Corée du Nord. Peu de temps après, des troupes chinoises ont été vues défiler à Pyongyang et dans d'autres villes de l'homologue communiste de la République de Corée. Il semble qu'une lumière maoïste brille sur la RPDC."
 PRC_Focus_28_desc:0 "Le Politburo s'est uni dans l'espoir de faire une conférence qui discutera du Grand Bond en avant et des avantages - et de la terrible mauvaise gestion - qu'il a apportés. Peng Dehuai a envoyé une lettre à Mao pendant la conférence, critiquant respectueusement les éléments qui ont fait du Grand Bond en avant un désastre. Un geste qui lui a coûté sa carrière. Quelques instants plus tard, Mao a prolongé la conférence de dix jours, où il a critiqué avec véhémence Peng Dehuai pour être \"à seulement trente kilomètres des droitistes\" et a ordonné son limogeage, son arrestation et son remplacement par un général loyal, Lin Biao. Peu de temps après, Mao Zedong a prononcé un long discours passionné et belliqueux à Lushun, se défendant en affirmant que, tout comme les grands écrivains tels que Confucius, Lénine et Marx, il avait commis des erreurs et que se concentrer sur ces erreurs n'aiderait pas la situation. Il a rapidement poursuivi en défendant ses stratégies dans le Grand Bond en avant. Le président a encore renforcé son règne en Chine et il semble que peu, voire aucun, n'ose s'opposer à lui."
 agrarian_collectivization_process_1_desc:0 "La collectivisation foncière basique a été réalisée. Bien que les paysans n'aient pas suffisamment de savoir-faire, ce qui conduit au gaspillage, ils ont la volonté de construire une société meilleure !"
 agrarian_collectivization_process_2_desc:0 "Les paysans ont commencé à apprendre par eux même de nouvelles méthodes d'organisation, devenant ainsi plus efficaces sans perdre les bienfaits de la collectivisation."
 agrarian_collectivization_process_3_desc:0 "La collectivisation commence à prendre une forme standardisée, avec des adaptations locales florissantes grâce à l'esprit d'innovation du peuple."
 agrarian_collectivization_process_4_desc:0 "La collectivisation a fait un grand pas, la plupart des paysans sont maintenant volontairement inscrits dans des fermes collectives ! Une grande quantité de connaissances et méthodes ont été recueillies, améliorant ainsi les rendements et les conditions de vie des paysans"
 agrarian_collectivization_process_5_desc:0 "La Chine post-capitaliste que nous avons connue n'est plus qu'un mauvais rêve! Maintenant, la collectivisation a été réalisée par le peuple pour former une société socialiste"
 agrarian_bourgeoisie_1_desc:0 "La plupart des moyens modernes de productions sont encore entre les mains des propriétaires. S'ils sont plus efficaces que les agriculteurs collectifs, ils ne servent qu’eux-mêmes et non le peuple ! Ils doivent être abattus !"
 agrarian_bourgeoisie_2_desc:0 "La transition vers une société socialiste est à portée de main, mais les maudits propriétaires terriens ralentissent toujours nos progrès. Ils menacent régulièrement l'approvisionnement alimentaire des villes et ne coopéreront pas avec le régime. Le président Mao n'acceptera pas cela."
 agrarian_bourgeoisie_3_desc:0 "La bourgeoisie agricole est affaiblie, mais n'est pas encore morte. Relâcher nos efforts pour les combattre maintenant pourrait leur permettre de se réorganiser. Frappons pendant que le fer est chaud !"
 agrarian_bourgeoisie_4_desc:0 "La bourgeoisie agraire n'est plus une classe en temps que telle, elle a été flétrie par la puissance du peuple. Les restes ne pourraient pas s'organiser de sitôt, mais ils constituent toujours une 5ème colonne aux yeux du président Mao."
 agrarian_bourgeoisie_5_desc:0 "Propriétaires terriens, bourgeoisie agraire, ce sont des mots du passé. Maintenant, la société chinoise ne connaît plus les anciennes classes capitalistes. Bien sûr, le président Mao sait que de nouvelles classes se forment, comme les bureaucrates en Union soviétique. Le combat n'est pas encore terminé !"
 protected_landlords_desc:0 "La protection des propriétaires n'est qu'une solution temporaire pour faire face aux inefficacités du système nouvellement formé. Les paysans apprendront les techniques des anciens maîtres"
 mixed_economy_desc:0 "L’économie est toujours en transition d'un système féodal à un système socialiste. Autoriser de petites entreprises privées augmentera l'esprit d'innovation et d’entrepreneuriat du Peuple. Cela sera, bien sûr, mis à profit dans nos futures politiques..."
 Establish_the_Republic_of_Benin:0 "Établir la République du Bénin"