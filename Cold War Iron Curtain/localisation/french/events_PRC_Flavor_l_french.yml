l_french:
 PRC_Focus_1_desc:0 "Après la victoire des communistes dans la guerre civile, les nationalistes se sont enfuis à Taiwan et ont fermement résisté à de nouvelles offensives maoïstes. Outre l'île de Taiwan, quelques îles de la mer de Chine méridionale ont également été capturées par les nationalistes, comme Kinmen et Matsu, déployant 58 000 soldats à Kinmen et 15 000 soldats à Matsu. Récemment, les troupes de l'Armée populaire de libération ont commencé à bombarder les îles susmentionnées ; avec Zhou Enlai affirmant que Taiwan doit être libéré des forces oppressives du Kuomintang qui règne actuellement d'une main de fer. L'APL a également envoyé des forces pour s'emparer des îles Yijiangshan, situées au large des côtes du Zhejiang."
 PRC_Focus_2_desc:0 "À la suite de la Campagne des Cent Fleurs, Mao Zedong était déterminé à éliminer les éléments « réactionnaires » de la nation, en lançant une campagne pour poursuivre en justice ceux qui critiquaient le gouvernement de la RPC. Immédiatement après la fin du mouvement des Cent Fleurs, Mao a commencé à arrêter des intellectuels et des critiques ; avec des peines de travaux forcés ou d'exécution dans certains cas, le pouvoir judiciaire étant remplacé par des cadres politiques et la police. On s'est vite rendu compte que 300 000 personnes avaient été qualifiées de droite ; la rumeur courait que Deng Xiaoping était l'un des procureurs les plus enthousiastes du mouvement lors de sa vague de purges. Le ressentiment contre les « droitiers » remonte au sein du Parti communiste depuis la Longue Marche, illustrée par la haine contre Zhang Bojun."
 PRC_Focus_3_desc:0 "\nAvec l'avènement du mouvement des Cent Fleurs, qui a suscité des dizaines de lettres et de vives protestations dans la Chine maoïste, il n'a pas fallu longtemps pour que les minorités ethniques et religieuses de toute la Chine suivent l'exemple des intellectuels pour critiquer leur traitement en Chine par les autorités ; ainsi que des critiques envers le PCC et Mao Zedong lui-même. Le timonier répondit bientôt par l'épuration des intellectuels et, avec eux, des minorités. Soumis à la torture, à l'humiliation et aux pressions publiques, nombre de ces cas ont été suivis de suicides ou d'exécutions, subissant un sort similaire à celui des intellectuels écrasés lors de la campagne anti-droite."
 PRC_Focus_4_desc:0 "Le président Mao a déclaré que « la politique consistant à laisser éclore cent fleurs et cent écoles de pensée s'affronter est conçue pour promouvoir l'épanouissement des arts et le progrès de la science ». Et c'est avec cette idée que la RPC a lancé la « Campagne des Cent Fleurs », visant à encourager les citoyens chinois à exprimer ouvertement leurs opinions, car l'idée était d'inciter les intellectuels à discuter des problèmes du pays afin de promouvoir de nouvelles formes d'art et d'institutions culturelles. Il n'a pas fallu longtemps pour que des protestations s'élèvent contre le PCC et que des lettres inondent Mao de critiques ; Tout comme il n'a pas fallu longtemps pour que le président Mao lance une campagne de poursuites contre ceux qui critiquaient le régime et son idéologie et que ceux qui étaient visés étaient publiquement critiqués et condamnés aux camps de travail, la Chine a rapidement été témoin de la création du mouvement anti-droitier."
 PRC_Focus_5_desc:0 "En Mandchourie, Mao a lancé une campagne visant à se débarrasser des éléments corrompus ou pro-Taiwan en Chine, en mettant l'accent sur les anciens membres du KMT, les fonctionnaires bureaucratiques qui n'étaient pas membres officiels du parti et les membres du parti corrompus. Les antis étaient l'anti-corruption, l'anti-gaspillage et l'anti-bureaucratie. La campagne des Trois Anti a infligé des sanctions extrêmement sévères, y compris la torture, et tous ceux qui ont été reconnus coupables de leurs crimes, avoués ou non, ont dû payer des amendes au gouvernement. Le timonier de la nation a affirmé à maintes reprises qu'il s'agissait d'une mesure majeure nécessaire pour débarrasser la Chine des membres corrompus et de ceux qui détournent et font stagner l'économie chinoise avec « leurs propres gains égoïstes »."
 PRC_Focus_6_desc:0 "Avec la guerre de Corée, des opportunités ont été offertes à de nombreuses personnes dans le nord de la Chine, ce qui a donné naissance à une nouvelle classe de capitalistes en Mandchourie, qui ont vite commencé à se rendre compte qu'ils n'étaient pas vus avec un oeil amical à Pékin. La campagne des Cinq Anti fut bientôt lancée, décrite comme une guerre totale contre la bourgeoisie en Chine, et les antis mentionnés ci-dessus étaient : anti-corruption, anti-vol de biens d'État, anti-évasion fiscale, anti-triche sur les contrats gouvernementaux et anti-vol de l'intelligence économique de l'État. Certaines entreprises ont commencé à envoyer 1 000 aveux par jour afin de se débarrasser de l'immense pression que le PCC mettait sur elles ; des défilés de militants anticapitalistes faisaient du porte-à-porte pour rendre visite aux chefs d'entreprise, générant une immense pression psychologique. Mao a déclaré que \"nous devrons probablement exécuter entre 10 000 et plusieurs dizaines de milliers de détourneurs de fonds dans tout le pays avant de pouvoir résoudre le problème\". Il y a eu des centaines de milliers de suicides qui ont été le résultat direct de cette campagne ; les capitalistes chinois ne recevant pas de meilleur traitement que les étrangers."
 PRC_Focus_7_desc:0 "\nAlors que la campagne anti-droite se poursuit, de nombreux intellectuels sont arrêtés, torturés ou humiliés et emprisonnés. Chen Fengxiao a été emprisonné pendant 15 ans pendant la campagne pour être de droite et avoir ainsi trahi le mouvement maoïste. De nombreux dissidents ont été brûlés par le feu, battus à mort ou exécutés par un peloton d'exécution, et environ 400 000 à 700 000 personnes ont été poursuivies politiquement ; le travail éreintant dans le système carcéral a souvent conduit à leur mort et d'autres ont été complètement exclus de la société, comme Luo Longji et Zhang Bojun, tandis que d'autres, comme Chen Mengjia, se sont suicidés en raison de l'exclusion et de la pression politique."
 PRC_Focus_8_desc:0 "\nAu cours de la campagne anti-droite, afin de faciliter la poursuite des intellectuels et autres dissidents du gouvernement maoïste, des juristes et des travailleurs ont également été poursuivis et condamnés à de lourdes peines de prison pour avoir collaboré ou autrement ralenti le mouvement ; le système judiciaire a été scruté et surveillé attentivement alors qu'il était lentement remplacé par les cadres du Parti fidèles au PCC et à Mao, ainsi que par la police afin de faciliter les arrestations et l'application des peines. Ceux qui n'ont pas été arrêtés ont été transférés à d'autres emplois qui n'ont pas empêché le parti de prendre le pouvoir sur le système judiciaire indépendant, une décision qui, pour beaucoup, signifiait que Mao consolidait encore davantage son pouvoir en Chine."
 PRC_Focus_9_desc:0 "Aujourd'hui, il a été déclaré que le fils de Mao Zedong, le dirigeant suprême de la Chine, avait été tué au combat par une frappe aérienne ; Officier expérimenté, l'enfant de Mao a combattu pendant la Seconde Guerre mondiale comme officier d'artillerie contre le Troisième Reich en Pologne, en tant que volontaire de l'armée soviétique. Au moment de sa mort, il servait dans l'Armée des Volontaires du Peuple Chinois, en tant que secrétaire et traducteur russe du commandant de la PVA Peng Dehuai. Il était en poste dans un quartier général de la PVA, dans des grottes à proximité d'une ancienne colonie minière d'or ; il semble que quatre avions américains aient largué des bombes au napalm dans la zone, dont l'une a détruit un bâtiment de fortune près des grottes, tuant Mao Anying et un autre officier. Le président Mao serait profondément attristé par cette perte, mais aucun commentaire du Helmsman n'a été fait à aucun moment."
 PRC_Focus_10_desc:0 "Le grand timonier de la République populaire de Chine, leader révolutionnaire et théoricien politique Mao Zedong est décédé ; Souffrant de deux crises cardiaques plus tôt dans l'année, une dernière crise cardiaque a finalement frappé le chef suprême quelques jours plus tard, juste après minuit. Le PCC a diffusé un message radiophonique majeur annonçant la nouvelle du décès de Mao, tout en réclamant l'unité du parti. Le dirigeant a été embaumé et drapé dans un drapeau du PCC, où il restera au Grand Palais du Peuple pendant une semaine. On estime qu'un million de personnes viendront voir le timonier une dernière fois, tandis que ceux qui sont déjà présents pleurent ouvertement ou affichent une certaine tristesse. Le portrait officiel du président Mao a été accroché au mur, avec une banderole disant \"Poursuivez la cause laissée par le président Mao et poursuivez la cause de la révolution prolétarienne jusqu'au bout\"."
 PRC_Focus_11_desc:0 "Le gouvernement chinois a envoyé des troupes à Chamdo dans ce qu'il appelle une « libération du Tibet » après l'échec des négociations visant à intégrer le Tibet dans la nation ; l'Armée populaire de libération a traversé la rivière Jinsha avec des centaines de soldats et s'est emparée de la ville frontalière de Qamdo et des hostilités actives ont commencé dans la zone frontalière au nord-est de la rivière Gyamo Ngul Chu et à l'est du 96e méridien. Il n'est pas certain que la République populaire de Chine fasse immédiatement valoir son désir d'annexer le Tibet, mais cela semble très probable, Mao Zedong affirmant que « le peuple tibétain a suffisamment souffert, il est enfin temps pour lui de rejoindre la République populaire de Chine et d'être libéré »."
 PRC_Focus_12_desc:0 "\nAprès la chute de l'armée de la Clique Ma pendant la guerre civile chinoise, une insurrection fut créée, dirigée par d'anciens généraux et vétérans de Ma Bufang. Le fondement de l'insurrection fut la chute de Ma Bufang pendant la campagne du Ningxia ; et peu de temps après, de nombreux généraux, pour la plupart musulmans, ont fait défection vers la République populaire de Chine alors que l'effondrement de la Chine nationaliste était imminent. La plupart des anciens généraux musulmans du Kuomintang, tels que Ma Bufang, Ma Hongkui, Ma Dunjing, Bai Chongxi et etc., ont tous fui vers Taiwan avec le gouvernement de la République de Chine, mais les officiers subordonnés de Ma Bufang sont restés dans la province du Qinghai. Aujourd'hui, les derniers insurgés ont été écrasés à Yiwu, où plus de 700 insurgés ont péri au combat alors que le drapeau de la RPC flottait sur la ville de Yiwu."
 PRC_Focus_13_desc:0 "L'APL a annoncé aujourd'hui qu'elle avait mis fin à l'insurrection tibétaine. Alors que Lhassa se rebellait ouvertement contre la République populaire de Chine, l'armée a bombardé Norbulingka afin de disperser la foule, plaçant les troupes dans des barricades qui divisaient la ville en une partie nord et une partie sud. Tôt le matin, les rebelles tibétains ont subi une défaite face aux troupes de l'Armée populaire de libération, qui ont mené une bataille sanglante dans les rues avant de marcher vers Jokhang, livrant une bataille de trois heures, quelques instants plus tard, le drapeau de la Chine avait été hissé sur le temple, ce qui a écrasé le soulèvement. Il existe de nombreuses rumeurs selon lesquelles Pandatsang Rapga, un leader révolutionnaire pro-KMT et pro-ROC, a joué un rôle déterminant dans la révolte contre la RPC ; et le Dalaï Lama est introuvable."
 PRC_Focus_14_desc:0 "Le président Mao a déclaré que, parallèlement aux mesures prises pour garantir que le Grand Bond en avant ait lieu, une nouvelle campagne est en cours d'approbation pour être exécutée immédiatement, appelée \"Campagne des quatre ravageurs\". Le Président prétend qu'il s'agit d'une campagne d'hygiène contre les rats, les mouches, les moustiques et les moineaux ; le moustique étant responsable du paludisme ; les rongeurs qui propagent la peste ; les mouches, considérées comme omniprésentes, et les moineaux, qui se nourrissent des grains et des graines des récoltes abondantes en Chine. Des concours de propreté sont également organisés entre les entreprises, les agences gouvernementales et les écoles. Il est rapporté que des récompenses non matérielles sont accordées à ceux qui remettent le plus de queues de rat, de mouches et de moustiques morts ou de moineaux morts."
 PRC_Focus_25_desc:0 "\nDans le cadre d'une première détente avec les nationalistes depuis la trêve de 1946, le président du Parti communiste chinois, Mao Zedong, a annoncé qu'il proposerait une nouvelle proposition pour Taiwan qui impliquerait des élections générales en Chine continentale et à Taiwan, ainsi que dans les îles, qui compromettraient l'ensemble des deux nations. Ces élections générales, dit Mao, « ont pour but d'unifier nos deux nations et de décider du sort de la Chine, en laissant le peuple choisir entre le Kuomintang et le Parti communiste chinois ». Il reste à voir si Taiwan acceptera cette offre, mais de nombreux experts affirment qu'il s'agit simplement d'un stratagème de Mao ; essayant de montrer l'affabilité et la légitimité de son régime."    
 PRC_Focus_16_desc:0 "Le Parti communiste chinois a déclaré aujourd'hui que, pour la première fois depuis qu'il a pris le pouvoir pendant la guerre civile chinoise, que l'Assemblée populaire nationale, l'organe suprême du pouvoir d'État et le corps législatif national de la RPC, serait libéralisé et qu'il y aurait une participation plus active des partis mineurs qui font actuellement partie du corps législatif national ; L'un des plus fervents partisans de cette décision était le Comité révolutionnaire du KMT, la Ligue démocratique de Chine et l'Association démocratique nationale de construction de Chine étaient également deux partis qui étaient de fervents partisans de cette décision et l'ont salué comme la prochaine étape pour libérer la Chine de devenir un régime oppressif."
 PRC_Focus_17_desc:0 "Le président Mao a déclaré aujourd'hui qu'il y aurait une révision du régime actuel de la République populaire de Chine, le président lui-même a fait l'éloge des intellectuels qui ont critiqué le gouvernement lors de la campagne des \"Cent fleurs\" et a soutenu que \"le moment est venu pour les fleurs de s'épanouir et pour que la Chine reconnaisse les demandes de ses habitants\". Cela semble indiquer clairement, selon les experts, que le régime chinois envisage de réformer son autoritarisme et de se laisser aller à une plus grande modération. Il reste à voir si le président Mao libéralisera ou s'il maintiendra son emprise de fer sur le gouvernement."
 PRC_Focus_18_desc:0 "Un soulèvement a commencé aujourd'hui à Lhassa alors que les manifestants prétendent que le Tibet est une nation indépendante. Lorsque la crainte que le PCC allait kidnapper le Dalaï Lama est parvenue aux oreilles des habitants, les gens se sont rapidement rassemblés à l'extérieur du palais afin de l'empêcher de partir, ou pire, d'être expulsé de force par le PCC et de connaître un sort inconnu. Peu après, des barricades furent dressées dans les rues de Lhassa et une pétition de soutien aux rebelles armés apparut bientôt ; les troupes chinoises et tibétaines ont déjà commencé à se diriger vers Lhassa et des rapports font état de l'établissement d'artillerie à portée du palais d'été du Dalaï Lama, le Norbulingka."
 PRC_Focus_19_desc:0 "Kang Sheng et Ren Bishi, respectivement l'un des membres clés de l'appareil de renseignement chinois et commandant de la Cinquième Armée rouge, ont affirmé qu'une campagne violente contre les propriétaires fonciers en Chine était inévitable ; car « il faudrait détruire trente millions de propriétaires fonciers et de paysans riches ». Aujourd'hui, le timonier a déclaré que chaque paysan devait se battre contre ses propriétaires et les tuer à mains nues. Mao a exprimé le désir de ne pas « corriger prématurément les excès » et a adopté une politique de vivre et de laisser vivre face à la violence qui se produit actuellement dans toute la Chine. Le PCC n'a pas approuvé ni sanctionné la violence physique des paysans contre les propriétaires, qui sont pendus, enterrés vivants, démembrés et fusillés. Dans les rues, ils murmurent « Dou Di Zhu » ou « Combattez le propriétaire » ; il semble que le président Mao renforce le soutien du parti avec tous les moyens nécessaires."
 PRC_Focus_20_desc:0 "Le premier commandant et commissaire de l'Armée populaire volontaire, Peng Dehuai, a annoncé aujourd'hui que ses forces entreraient en RPDC pour la soutenir ; le régime dirigé par Kim Il-Sung est affable envers la RPC et envers le président Mao en particulier ; le dirigeant chinois s'est engagé à défendre la RPDC et à la soutenir chaque fois que cela sera nécessaire. Il semble que cette armée soit composée de milliers de soldats déterminés à aider leurs frères d'armes coréens contre les forces soutenues par les États-Unis ; À l'heure actuelle, il existe diverses insécurités concernant l'avenir de la péninsule coréenne, mais le président Mao semble convaincu que la fin de la guerre est proche et qu'un drapeau rouge flottera sur la péninsule."
 PRC_Focus_21_desc:0 "\nLa République populaire de Chine renforce depuis peu ses reconnaissances diplomatiques. Le président de la RPC a commencé à demander aux nations de reconnaître sa légitimité par rapport à son homologue nationaliste, la République de Chine. Dès sa sortie de la guerre civile, la République populaire de Chine a été immédiatement reconnue par l'URSS et les États qui compromettent sa sphère d'influence, comme la République socialiste de Roumanie, la République populaire polonaise et la République populaire hongroise. La Chine demande la reconnaissance des États asiatiques comme l'Inde et le Nord-Vietnam ; De nombreux experts affirment que ce n'est qu'une question de temps jusqu'à ce que la RPC soit reconnue dans le monde entier, tandis que d'autres affirment que l'idée de la RPC comme un État internationalement reconnu est une chimère et que le sort est encore incertain."
 PRC_Focus_22_desc:0 "\nSuite aux tentatives de la RPC d'obtenir la reconnaissance diplomatique de ses voisins asiatiques, la nation communiste s'étend désormais vers d'autres sphères, en l'occurrence l'Europe. La Suisse se présente comme très intéressée par la reconnaissance de la Chine et d'autres pays scandinaves comme le Danemark, la Suède et la Finlande sont tous des perspectives très positives pour cette nouvelle tentative de reconnaissance par la RPC ; il s'agit encore d'une question de manoeuvre géopolitique - mais le président Mao s'est déclaré plutôt positif quant à la reconnaissance de sa nation par l'Occident et les experts estiment qu'il est probable qu'elle le sera dans un avenir proche."
 PRC_Focus_23_desc:0 "Le président de la RPC a annoncé aujourd'hui que les diverses sectes présentes dans la Chine rurale devaient être traquées en raison de leur collaboration avec le KMT, des éléments réactionnaires et bourgeois en Chine. La Red Spear Society a déjà commencé à tomber, ses membres ayant été rapidement arrêtés par les forces du PCC et la Big Swords Society semble avoir connu le même sort, tout comme la Yellow Sand Society. Toutes ces sociétés ont été inspirées dans leurs activités par des idées monarchistes millénaristes, spirituelles et romancées ; la plupart, sinon la totalité, de ces sociétés se sont opposées avec véhémence aux Qing et croyaient qu'une restauration Ming apporterait bonheur et paix à toute la Chine. Il semble que le président Mao soit profondément en désaccord avec cette idée."
 PRC_Focus_24_desc:0 "Mao Zedong a officiellement annoncé que la Chine adopterait une ligne de conduite qui découle de la nécessité de dépasser la société agraire qu'elle a été pendant des siècles et de commencer à prendre la forme d'une nation moderne et industrielle. C'est dans cette intention que le président du PCC a lancé le Grand Bond en avant. En utilisant la collectivisation dans les communes populaires, en encourageant tous les paysans résidant dans la République populaire à produire des fourneaux pour approvisionner l'État en acier, en interdisant les exploitations privées et en utilisant des projets d'irrigation sans recourir à des ingénieurs formellement formés, le dirigeant chinois a promis de tout son coeur que cette campagne entraînerait la Chine dans une nouvelle direction, en faisant l'une des plus grandes puissances du monde, sinon la plus grande."
 PRC_Focus_15_desc:0 "Des poignées de main fortes et jubilatoires ont été prises aujourd'hui alors que le Premier ministre de la RPC et le Premier ministre de la RPDC se serrent la main, le sourire aux lèvres, à l'occasion de la signature du Traité d'amitié et de coopération mutuelle et de coopération sino-nord-coréenne. En promettant une coopération pacifique entre les deux nations dans les domaines de la culture, de l'économie, de la technologie et d'autres avantages sociaux, l'alignement de la RPDC sur la Chine constitue une étape claire ; en outre, dans le deuxième article du traité, il est déclaré que les deux nations prendront toutes les mesures nécessaires pour s'opposer à tout pays ou coalition de pays qui pourrait attaquer l'une ou l'autre nation, une mesure que beaucoup pensent être un moyen pour la RPDC d'assurer sa place parmi une grande puissance sans subir une invasion de son homologue capitaliste des États-Unis."
 PRC_Focus_26_desc:0 "La plupart des États asiatiques et africains se sont réunis aujourd'hui lors d'une réunion massive pour discuter de la coopération économique et culturelle afro-asiatique, en s'opposant au colonialisme ou au néocolonialisme de quelque nation que ce soit ; composée de vingt-neuf pays, elle représente une population totale de 1,5 milliard de personnes, soit 54 % de la population mondiale. Une déclaration en dix points est en cours de discussion et il semble probable qu'elle sera adoptée à l'unanimité. Parmi ces points, les plus importants sont l'abstention d'intervention ou d'ingérence dans les affaires intérieures d'un autre pays, l'abstention d'actes de menaces d'agression ou le recours à la force contre l'intégrité territoriale ou l'indépendance politique de tout pays. Un communiqué final est également présenté, qui souligne actuellement la nécessité pour les pays en développement de réduire leur dépendance économique à l'égard des principales nations industrielles en se fournissant mutuellement une assistance technique par le biais d'échanges d'experts et d'assistance technique."
 PRC_Focus_27_desc:0 "\nD'un seul coup, le fondateur du Juche et supposé libérateur des Nord-Coréens, Kim Il-Sung, a été destitué lors d'un coup d'État de palais. Les officiers, partisans du modèle chinois de socialisme après avoir vu le triomphe de Mao contre les forces nationalistes pendant la guerre civile, ont proclamé que la nouvelle République populaire démocratique de Corée poursuivrait la lutte contre le capitalisme aux côtés de son nouvel allié, la RPC. Le président Mao a été ravi d'apprendre la nouvelle et a déclaré qu'il voyait un avenir très brillant pour tous les habitants de la Corée du Nord. En quelques instants, des troupes chinoises ont été vues défiler à Pyongyang et dans d'autres villes de l'homologue communiste de la République de Corée. Il semble qu'une lumière maoïste brille sur la RPDC."
 PRC_Focus_28_desc:0 "Le Politburo s'est uni dans l'espoir d'organiser une conférence qui discuterait du Grand Bond en avant et des bénéfices - et de la terrible mauvaise gestion - qu'il a apporté. Peng Dehuai a envoyé une lettre à Mao pendant la conférence, critiquant respectueusement les éléments qui ont fait du Grand Bond en avant un effort désastreux ; une décision qui a coûté sa carrière. Quelques instants plus tard, Mao a prolongé la conférence de dix jours, au cours desquels il a critiqué avec véhémence Peng Dehuai pour être « à seulement trente kilomètres des droitiers » et avoir ordonné son renvoi, son arrestation et son remplacement par un général loyal, Lin Biao. Peu de temps après, Mao Zedong a prononcé un long discours passionné et belliqueux à Lushun, se défendant en affirmant que lui, tout comme les grands écrivains tels que Confucius, Lénine et Marx, avait commis des erreurs et que se concentrer sur ces erreurs n'arrangerait pas la situation ; il a rapidement suivi en défendant ses stratégies dans le Grand Bond en avant. Le président a encore renforcé son pouvoir en Chine et il semble que peu de gens, voire aucun, osent s'opposer à lui."
 agrarian_collectivization_process_1_desc:0 "Une collectivisation foncière de base a été réalisée. Même si les paysans n'ont pas le savoir-faire qui conduit au gaspillage, ils ont la volonté de construire une société meilleure !"
 agrarian_collectivization_process_2_desc:0 "Les paysans commencent à apprendre par eux-mêmes de nouvelles méthodes d'organisation, étant ainsi plus efficaces sans perdre les avantages du processus de collectivisation"
 agrarian_collectivization_process_3_desc:0 "La collectivisation commence à prendre une forme standardisée, avec des adaptations locales florissantes grâce à l'esprit d'innovation des gens."
 agrarian_collectivization_process_4_desc:0 "La collectivisation a fait un grand pas, la plupart des paysans sont désormais volontairement enrôlés dans des fermes collectives ! De nombreuses connaissances ont été rassemblées, améliorant ainsi les rendements et les conditions de vie des paysans"
 agrarian_collectivization_process_5_desc:0 "La Chine post-capitaliste que nous avons connue n'est qu'un mauvais rêve ! Aujourd'hui, la collectivisation a été réalisée par le peuple pour former une société socialiste"
 agrarian_bourgeoisie_1_desc:0 "La plupart des moyens de production modernes sont encore aux mains des propriétaires fonciers. S'ils sont plus efficaces que les kolkhoziens, ils ne servent qu'eux-mêmes et non le peuple ! Il faut les faire tomber !"
 agrarian_bourgeoisie_2_desc:0 "La transition vers une société socialiste est proche, mais les maudits propriétaires continuent d'entraver notre progrès. Ils menacent régulièrement l'approvisionnement alimentaire des villes et refusent de coopérer avec les régimes. Le président Mao ne le supportera pas !"
 agrarian_bourgeoisie_3_desc:0 "Aujourd'hui, la bourgeoisie agraire est affaiblie, mais elle n'est pas encore morte. Relâcher nos efforts pour les combattre maintenant pourrait leur permettre de se réorganiser. Frappez pendant que le fer est chaud !"
 agrarian_bourgeoisie_4_desc:0 "La Bourgeoisie agraire n'est plus une classe à part, elle a été flétrie par la puissance du peuple. Les restants ne seront pas en mesure de s'organiser de sitôt mais ils constituent toujours une 5ème colonne aux yeux du président Mao"
 agrarian_bourgeoisie_5_desc:0 "Propriétaires fonciers, Bourgeoisie agraire ; ce sont des paroles du passé. Or la société chinoise ne connaît pas les anciennes classes capitalistes. Bien entendu, le président Mao sait que de nouvelles classes se forment, comme les bureaucrates en Union soviétique. Le combat n'est pas encore terminé !"
 protected_landlords_desc:0 "La protection des propriétaires n'est qu'une solution temporaire pour faire face aux inefficacités du système nouvellement mis en place. Les paysans apprendront les techniques des anciens maîtres"
 mixed_economy_desc:0 "L'économie est encore en transition d'un État féodal à un État socialiste. Autoriser les petites entreprises privées renforcera l'esprit d'innovation et d'entrepreneuriat de la population. Bien entendu, cela sera mis à profit dans nos politiques ultérieures..."
 Establish_the_Republic_of_Benin:0 "Établir la République du Bénin"