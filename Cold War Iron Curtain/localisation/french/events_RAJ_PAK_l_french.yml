l_french:
 Tashkent_Decleration.1.d:0 "L'Union soviétique a gracieusement proposé d'accueillir des pourparlers de paix à Tachkent pour contribuer à mettre fin à notre guerre avec l'Inde. Alors que nous préparons la conférence, nous devons réfléchir à ce qui s'est passé lors du récent conflit. Même si nos forces n'ont pas obtenu de résultats décisifs, l'armée pakistanaise a tenu bon face à un ennemi bien plus important, impressionnant sans aucun doute le monde. Pendant le conflit, nous et les Indiens avons gagné et perdu du territoire au cours des combats. Le ministère des Affaires étrangères suggère que nous fassions pression sur l'Inde pour qu'elle mette en oeuvre les résolutions de l'ONU pendant les pourparlers de paix. Ils doivent certainement reconnaître que c'est le seul moyen de prévenir un futur conflit avec nous. Nos plus hauts diplomates suggèrent cependant que les Indiens n'accepteront probablement pas cela et que le résultat le plus fondamental que nous puissions espérer est un retour aux frontières d'avant-guerre. Considérant que notre propagande de guerre parlait de grandes victoires, un tel résultat pourrait conduire à une grande déception."
 Tashkent_Decleration.2.d:0 "L'Union soviétique a gracieusement proposé d'accueillir des pourparlers de paix à Tachkent pour contribuer à mettre fin à notre guerre avec le Pakistan. Alors que nous préparons la conférence, nous devons réfléchir à ce qui s'est passé. Nos excellentes forces armées ont réussi à contrecarrer le complot pakistanais visant à nous prendre le Cachemire. Nos forces ont ensuite puni les Pakistanais à travers leurs frontières. Même si nous avons réalisé des progrès, nous avons également perdu du territoire au profit du Pakistan. Cependant, nos plus hauts diplomates estiment que nous avons atteint notre objectif de ne pas perdre le Cachemire et que nous pouvons probablement négocier un retour aux frontières d'avant-guerre. Les Pakistanais sont susceptibles de faire pression pour une résolution du problème du Cachemire, mais ils ne sont pas en mesure d'exiger le territoire ou que nous appliquions la résolution de l'ONU. Le cabinet exhorte le Premier ministre à ne pas céder aux pressions potentielles du Pakistan."
 Tashkent_Decleration.3.d:0 "Le conflit récemment conclu avec l'Inde a mis en lumière l'anxiété et les craintes de nombreux Bengalis au Pakistan. Ils ont estimé que les combats au Cachemire se sont déroulés sans consultation et ont abouti à une guerre qui a mis le Pakistan oriental en grave danger. En outre, de nombreux Bengalis estimaient que le gouvernement concentrait ses ressources et ses troupes sur le front du Cachemire, laissant la province la plus peuplée du Pakistan vulnérable aux incursions ennemies. Des politiciens bengalis et des dirigeants étudiants se sont adressés à de grandes foules de manifestants en colère contre ce qu'ils considéraient comme un échec de l'armée à les protéger."
 Tashkent_Decleration.4.d:0 "Le gouvernement soviétique accueille les dirigeants indiens et pakistanais à Tachkent pour des entretiens. Le but de ces pourparlers est de parvenir à un accord final pour mettre fin à la récente guerre entre les deux puissances sud-asiatiques. La guerre a commencé lorsque le Pakistan a tenté de dégeler la situation actuelle au Cachemire, ce qui a conduit à une escalade militaire qui a abouti à une guerre ouverte. Les dirigeants pakistanais feront pression en faveur d'un règlement sur la question du Cachemire, de préférence par la mise en oeuvre des résolutions précédentes de l'ONU sur la question. Cependant, les experts estiment que le gouvernement indien rejettera probablement de telles pressions et fera plutôt pression pour que la ligne de cessez-le-feu d'avant-guerre devienne une frontière permanente. De nombreux analystes estiment que le conflit sur le terrain n'a pas été concluant et qu'il serait surprenant que l'une des parties parvienne à convaincre l'autre. Pour les Soviétiques, la réunion leur donne l'occasion de démontrer leur prétention d'être une puissance mondiale neutre ou amie envers les nouveaux États postcoloniaux émergents."
 Tashkent_Decleration.5.d:0 "Les pourparlers initiaux ne se sont pas révélés concluants, mais sous la direction soviétique, le président pakistanais et notre premier ministre se sont rencontrés en privé pour discuter des options de paix. Au cours de leur entretien, le dirigeant pakistanais nous a pressés de mettre en oeuvre la résolution de l'ONU sur le Cachemire et de laisser l'ONU organiser un plébiscite. Il a déclaré que ne pas le faire ne ferait que permettre au conflit de s'envenimer et d'aliéner les Cachemiriens. Après ces entretiens, le Premier ministre a discuté avec ses conseillers. Le consensus était que nous gardions fermement le contrôle de notre partie du Cachemire et que nous ne devions pas légitimer l'agression pakistanaise en acceptant. Au lieu de cela, ils ont déclaré que nous pouvions proposer de faire du cessez-le-feu d'avant-guerre au Cachemire la frontière permanente. Le Premier ministre a entendu ces commentaires et doit maintenant décider s'il prendra des risques et acceptera la position pakistanaise ou s'il s'opposera à l'offre."
 Tashkent_Decleration.6.d:0 "Contre tous ses conseillers, le Premier ministre a annoncé son intention de s'entendre avec le Pakistan et de mettre en oeuvre la résolution 47 de l'ONU sur le Cachemire. Il a déclaré que même si la décision ne sera pas populaire dans le pays, elle consolidera l'Inde en tant que puissance mature et sera perçue positivement à terme. Il a ajouté que la population du Cachemire pourrait considérer la décision indienne comme positive et que cela pourrait faire en sorte que le vote se termine en notre faveur. La délégation pakistanaise et les médiateurs soviétiques furent ravis de cette décision. La première réaction des médias a été largement négative. De nombreux hommes politiques et éditoriaux de l'opposition fustigeent déjà le gouvernement pour avoir cédé face à l'agression pakistanaise, certains appelant même à la démission du gouvernement. Malgré ce tollé, le Premier ministre reste attaché à sa décision."
 Tashkent_Decleration.7.d:0 "La communauté internationale a été surprise d'apprendre que l'Inde a accepté de se rapprocher des Nations Unies pour mettre en oeuvre la résolution 47 et organiser un plébiscite au Cachemire pour déterminer son statut final. Le Pakistan fait depuis longtemps pression pour que l'Inde prenne cette mesure et la récente guerre a été menée en grande partie pour imposer une résolution sur le Cachemire. Bien que le conflit militaire se soit terminé de manière peu concluante pour le Pakistan, de nombreux analystes prédisaient que l'Inde chercherait à rétablir le statu quo d'avant-guerre. Les Nations Unies ont salué cette décision, tandis que les pays du monde entier félicitent l'Inde pour son sens politique et son désir d'une paix durable en Asie du Sud. Le gouvernement pakistanais pouvait à peine cacher sa joie face à cette annonce. La réaction en Inde a été largement marquée par la colère et le choc face à ce que beaucoup appellent une trahison. Pour de nombreux Indiens, cette décision constitue une concession à l'agression militaire pakistanaise."
 Tashkent_Decleration.8.d:0 "Le Premier ministre indien nous a fait part de sa décision de mettre en oeuvre la résolution de l'ONU sur le Cachemire. Cela marque l'achèvement de notre principal objectif de politique étrangère depuis l'indépendance. Nous ressentons depuis longtemps le besoin de dégeler le Cachemire, ce qui a motivé nos récentes actions. La décision indienne confirme que nos actions étaient justes et que le peuple du Cachemire obtiendra enfin ses véritables droits après des années de lutte. La première réaction des médias et des principaux responsables politiques a été largement positive. À mesure que la nouvelle se répand, on peut s'attendre à des foules en liesse. Cette réalisation témoigne du travail acharné et des sacrifices de nos forces armées au cours de la récente lutte. Nous sommes véritablement devenus une puissance leader dans la région et dans le monde."
 Tashkent_Decleration.9.d:0 "Nous avons essayé de faire pression sur l'Inde pour qu'elle profite de ce moment pour mettre en oeuvre les résolutions de l'ONU sur le Cachemire. Nous espérions qu'ils verraient à travers nos actions et qu'ils décideraient que tant que le Cachemire resterait incertain, il n'y aurait aucune possibilité de paix future. Au lieu de cela, le Premier ministre indien nous a informé qu'il était d'accord sur la nécessité de résoudre le problème du Cachemire, mais que la solution n'était pas de céder la décision à un organisme étranger comme l'ONU. Au lieu de cela, il a suggéré que les frontières du Cachemire d'avant-guerre soient restaurées et rendues permanentes. C'est un coup dur pour notre cause et le consensus est de rejeter catégoriquement la proposition. Cependant, le président doit se demander si l'acceptation de la frontière permanente et ses conséquences négatives valent les bénéfices de la normalisation des relations et de l'établissement de la paix et de la prospérité dans la région."
 Tashkent_Decleration.10.d:0 "Le président pakistanais, au grand dam de ses conseillers, s'est déclaré favorable à la pérennisation de la frontière du Cachemire. Dans ses commentaires, il a souligné que cela répondait au désir d'une paix permanente pour les peuples du Pakistan, de l'Inde et du Cachemire. Notre délégation, ainsi que les médiateurs soviétiques, se sont réjouis de cette décision et la nouvelle de notre succès se répand déjà dans notre pays. Nous recevons déjà les félicitations des dirigeants de l'opposition pour le succès remporté à Tachkent. Nous avons prouvé de manière décisive qu'une agression pure et simple ne peut pas conduire au succès et que les sacrifices de nos forces armées étaient pour le bien commun."
 Tashkent_Decleration.11.d:0 "La réaction au Pakistan aux nouvelles du Cachemire a été largement marquée par le dégoût et l'indignation. Au cours du récent conflit, les médias ont présenté le Pakistan comme ayant remporté de grands succès militaires. Beaucoup sont stupéfaits de savoir qu'après de telles prétendues victoires, comment le président a-t-il pu abandonner le Cachemire. Nombreux sont ceux qui affirment que les victoires sur le champ de bataille ont été abandonnées lors des pourparlers de paix. Des appels ont déjà été lancés pour que des marches de solidarité soient organisées pour le Cachemire. Certains membres du gouvernement devraient démissionner en signe de protestation. Des rumeurs de mécontentement courent également dans les rangs de l'armée. Quoi qu'il en soit, le président reste ferme et, dans une brève déclaration, a mentionné que la décision conduirait à la paix et ouvrirait la voie à la réunification des familles cachemiriennes."
 Tashkent_Decleration.12.d:0 "Lors d'une percée surprise à Tachkent, le gouvernement soviétique a annoncé que le Pakistan et l'Inde étaient parvenus à un accord sur le Cachemire. Les deux parties ont convenu de revenir aux frontières d'avant-guerre et de faire de la ligne de cessez-le-feu initiale la frontière permanente. La nouvelle est bien accueillie à l'échelle internationale, et nombreux sont ceux qui félicitent le gouvernement pakistanais d'avoir particulièrement bien reconnu la situation et d'avoir réalisé une percée permanente. La récente guerre entre les deux États s'est produite en grande partie à cause des combats au Cachemire. Même si les combats sont restés peu concluants, il semble que les dirigeants pakistanais et indiens souhaitaient résoudre fermement la crise. La population indienne réagit positivement à la nouvelle, même si les premiers rapports en provenance du Pakistan suggèrent une réaction négative à l'égard de l'accord."
 Tashkent_Decleration.13.d:0 "La délégation pakistanaise a catégoriquement rejeté notre suggestion de rendre permanente la frontière du Cachemire. Au lieu de cela, ils ont réitéré leur désir de mettre en oeuvre les résolutions de l'ONU. Il est clair qu'ils ne veulent pas bouger, mais qu'ils ne sont pas non plus en mesure de poursuivre les combats. Nous ne pouvons évidemment pas prendre en compte la position pakistanaise. Nous et les Pakistanais sommes confrontés à une pression intense de la part des médiateurs soviétiques pour stabiliser la situation. La situation militaire étant terminée de manière peu concluante, il semble que la seule option qui reste soit d'insister sur le retour aux frontières d'avant-guerre. Une telle solution n'est pas idéale, mais elle confirmera que nous avons réussi à contrecarrer l'agression pakistanaise au Cachemire."
 Tashkent_Decleration.14.d:0 "Il est clair que les Indiens ne sont pas disposés à bouger ou à se montrer réalistes quant à une solution au Cachemire. En outre, nous sommes confrontés à une immense pression de la part des Soviétiques pour conclure les négociations et convenir d'une solution mettant fin au récent conflit. Les Indiens ont déclaré qu'ils accepteraient le retour aux frontières d'avant-guerre et l'échange de prisonniers de guerre. Ce n'est pas le scénario que nous souhaitions, mais vu la situation, nous n'avons pas le choix. Notre peuple doit être satisfait du résultat : malgré le fait qu'il soit confronté à un ennemi aussi grand, nos courageuses militaires ont pu l'empêcher de remporter une victoire décisive."
 Tashkent_Decleration.15.d:0 "Le ministre des Affaires étrangères Zulfiqar Bhutto, l'un des faucons les plus virulents du gouvernement, a réagi très négativement à l'accord final. Il pense que l'Inde va maintenant agir pour rendre permanente son occupation du Cachemire et que nous aurions dû poursuivre la lutte. Ses dénonciations bruyantes irritent le président et il est probable que ses jours au sein du gouvernement soient comptés. En privé, de nombreux membres du cabinet pensent que Bhutto a joué un rôle déterminant en poussant l'armée à agir au Cachemire et que cette action a conduit le gouvernement dans la situation actuelle."
 Tashkent_Decleration.16.d:0 "Avec le sourire des médiateurs soviétiques, les dirigeants pakistanais et indiens ont signé l'accord de Tachkent. Le traité stipule que les deux parties retireront leurs forces vers leurs frontières d'avant-guerre. L'accord engage également les deux parties à échanger les prisonniers de guerre du récent conflit. En ce qui concerne le Cachemire, l'accord stipulait que les deux pays continueraient à travailler pour trouver une éventuelle solution. Mais les Pakistanais ne sont pas parvenus à une solution permanente au Cachemire. L'Inde voulait un langage qui engageait les deux parties à trouver une solution uniquement par des moyens pacifiques, mais le Pakistan a réussi à rendre le langage beaucoup plus vague. Dans l'ensemble, l'accord confirme le caractère non concluant du conflit."
 Tashkent_Decleration.17.d:0 "Après une semaine de négociations à Tachkent, sous la médiation soviétique, le Pakistan et l'Inde sont parvenus à un accord final. L'accord de Tachkent appelle au retour aux frontières d'avant-guerre et à l'échange de prisonniers de guerre. Les espoirs d'une solution finale au Cachemire ne se sont pas concrétisés car l'accord incite simplement les deux pays à poursuivre les négociations. L'accord confirme dans une large mesure que le récent conflit n'a pas été militairement concluant. La délégation indienne sera probablement satisfaite du résultat, même si la délégation pakistanaise sera probablement confrontée à des réactions négatives. La communauté internationale a salué cet accord, espérant que le rétablissement de la paix dans la région ouvrira la voie à une solution future."
 Tashkent_Decleration.18.d:0 "Fait étonnant depuis Tachkent, la nouvelle est arrivée que le Premier ministre Shastri est décédé subitement peu après la signature de l'accord. Les premiers rapports suggèrent qu'il est décédé d'une crise cardiaque. La délégation et le Parlement indiens seraient stupéfaits par cette nouvelle. Le Premier ministre Shastri, connu pour son humilité et son dévouement discret envers la nation indienne, a dirigé le pays avec brio lors de la récente guerre avec le Pakistan. Le président pakistanais aurait été secoué par la nouvelle et aurait aidé à transporter son corps jusqu'à l'avion qui le ramènerait chez lui pour des funérailles dignes de ce nom. Malgré sa mort, l'accord de Tachkent et sa mise en oeuvre ne devraient pas être modifiés."

 Treaty_Lahore.1.d:0 "Nous devons préparer les négociations avec le gouvernement indien à Lahore. La récente guerre avec l'Inde s'est soldée par l'acquisition d'une position militaire forte. Par la grâce de Dieu, nos forces armées ont atteint leurs objectifs au Cachemire et le long de la frontière. L'armée indienne n'a pas réussi à s'emparer de nos principales villes et a subi de graves revers au Cachemire et ailleurs. Après le cessez-le-feu, il est devenu évident que nous étions en position de force pour dicter nos conditions aux Indiens. De nombreux membres du cabinet préconisent que nous utilisions notre succès pour forcer l'Inde à coloniser le Cachemire. Nous avons lancé nos opérations afin de dégeler le Cachemire et avons largement réussi nos plans. Il est maintenant temps de faire valoir nos revendications."
 Treaty_Lahore.2.d:0 "Nous devons préparer les négociations avec le gouvernement pakistanais à Lahore. La récente guerre avec le Pakistan ne s'est pas déroulée comme nous l'espérions. Nos forces ont subi des revers majeurs au Cachemire et le long de la frontière au sens large. Nous n'avons réussi à capturer aucune ville de valeur au Pakistan et nous ne pouvons pas utiliser cela comme monnaie d'échange dans les négociations. Il est clair que les Pakistanais feront pression sur nous au Cachemire et exigeront que nous quittions la province. Notre meilleure approche sera de faire pression pour la mise en oeuvre de la résolution 47 de l'ONU. Ironiquement, un renversement de notre politique précédente, si le Pakistan nous pousse à quitter la province, nous pourrons alors proposer un plan de partition qui nous permettrait de conserver le Ladakh et le Jammu. Nous devons faire de notre mieux lors des négociations à venir pour parvenir à un résultat honorable."
 Treaty_Lahore.3.d:0 "Les Bengalis du Pakistan oriental ont longtemps été soupçonnés d'être des citoyens de seconde zone ou d'être négligés par le gouvernement fédéral. Ceci malgré leur grande population, leur rôle économique énorme et leur dévouement historique au Mouvement pakistanais. Lorsque la guerre a éclaté au Cachemire, des rumeurs se sont répandues selon lesquelles le Pakistan occidental avait abandonné le Pakistan oriental. Cependant, à mesure que l'armée pakistanaise commençait à remporter des victoires militaires, ces appréhensions se sont rapidement dissipées. La presse bengali a salué les succès militaires, tandis que l'armée et le gouvernement fédéral ont exprimé leur admiration pour le soutien et les sacrifices consentis par la population du Pakistan oriental. Avec la guerre terminée et les pourparlers de paix sur le point de commencer, le patriotisme bengali envers le Pakistan semble renouvelé. En échange de ce nouveau sentiment d'unité, le gouvernement pakistanais a annoncé l'inclusion d'un éminent dirigeant provincial bengali au sein de l'équipe de négociation pakistanaise pour les pourparlers de Lahore."
 Treaty_Lahore.4.d:0 "La délégation indienne, dirigée par son Premier ministre, est récemment arrivée à Lahore pour des discussions sur la fin de la récente guerre en Asie du Sud. La presse a noté qu'aucun des représentants indiens ne semblait tout sauf sérieux au sujet de sa mission. Avant son arrivée, le Premier ministre indien a informé sa nation qu'il allait négocier avec le Pakistan dans l'espoir d'obtenir une paix juste, le retour des terres indiennes occupées et des soldats détenus comme prisonniers de guerre. Le président pakistanais et sa délégation sont déjà à Lahore et les négociations formelles débuteront dans les prochains jours. Bien que la presse pakistanaise se vante bruyamment de la position favorable du Pakistan, le gouvernement a récemment demandé que ces écrits soient temporairement interrompus afin de faciliter une atmosphère amicale pour les pourparlers de paix."
 Treaty_Lahore.5.d:0 "Lors des premières négociations, nous avons dit aux Indiens que notre objectif principal était d'établir une paix définitive au Cachemire. Comme nous occupons une position militairement dominante au Cachemire et le long de la frontière, nous avons certainement l'avantage. Cependant, les Indiens ont surpris notre délégation en proposant d'appliquer la résolution 47 de l'ONU sur le Cachemire, comme nous l'exigeions depuis des années. Ils disent que le moment est venu pour nos deux nations de prendre du recul et de laisser le peuple cachemirien choisir son destin. C'est certainement ce que nous avons toujours voulu, mais notre position est telle que nous pouvons simplement exiger que l'Inde quitte le Cachemire et ne pas risquer un vote international, dans lequel les Indiens pourraient potentiellement interférer. Nous n'aurons peut-être plus jamais une position de négociation aussi forte et s'en remettre à l'ONU pourrait se retourner contre nous. Cependant, accepter l'offre indienne et gagner le Cachemire par le biais d'un vote à l'ONU rendrait notre réussite plus légitime sur le plan international."
 Treaty_Lahore.6.d:0 "Dans un retournement de situation surprenant, le gouvernement pakistanais a accepté notre offre de mettre en oeuvre la résolution 47 de l'ONU. Ce résultat laissera l'avenir du Cachemire entre les mains de ses résidents et ils pourraient potentiellement choisir de nous rejoindre, même si cela semble peu probable. Quoi qu'il en soit, il s'agit d'un résultat bien plus favorable que de devoir quitter complètement le Cachemire. Avec cet accord, nous pouvons nous attendre à un retour aux frontières internationales d'avant-guerre ainsi qu'à un échange de prisonniers, une fois que nous nous engagerons sur la voie des Nations Unies. Les rumeurs d'un accord sont bien accueillies par la presse indienne, beaucoup considérant ce résultat comme bien plus acceptable que l'alternative."
 Treaty_Lahore.7.d:0 "Le président pakistanais s'est adressé à la nation au sujet des pourparlers de paix à Lahore. Il a déclaré que le gouvernement indien avait proposé de s'engager pleinement dans la mise en oeuvre des résolutions de l'ONU sur le Cachemire. Il a déclaré que l'autonomisation du peuple du Cachemire est le seul souhait modeste du peuple pakistanais. La résolution de l'ONU permettra aux Cachemiriens de décider une fois pour toutes quelle nation ils souhaitent rejoindre. La presse anglaise au Pakistan félicite le président pour avoir atteint les objectifs pakistanais d'une manière qui n'humilie pas l'Inde et qui préserve la position internationale de la nation. La presse ourdou, cependant, est beaucoup plus cinglante, accusant le gouvernement de privilégier son image internationale plutôt que d'utiliser sa position de force pour forcer l'Inde à quitter le pays. Pour eux, les Indiens ont eu des années pour mettre en oeuvre la résolution, mais ils ont choisi de ne pas le faire, ils auraient dû être humiliés. Des rumeurs circulent également au sein de l'armée, exprimant leur déception quant au fait que les victoires sur le champ de bataille n'aient pas été converties en victoires plus concrètes."
 Treaty_Lahore.8.d:0 "Le monde a réagi positivement à l'annonce selon laquelle le Pakistan et l'Inde étaient convenus de mettre en oeuvre les résolutions de l'ONU sur le Cachemire afin d'établir une solution définitive au territoire contesté. En effet, la récente guerre menée entre les deux parties portait sur le contrôle du Cachemire. L'Inde a été contrainte de proposer la mise en oeuvre des résolutions car le conflit militaire l'a laissée dans une position très faible. Pour cette raison, l'accord a surpris certains observateurs qui pensaient que le Pakistan utiliserait simplement sa position pour forcer l'Inde à quitter le Cachemire et à s'en emparer. Il semble que les Pakistanais s'efforcent de ne pas imposer une paix qui provoquerait davantage d'animosité de la part de l'Inde ou donnerait une image internationale du Pakistan comme une puissance militairement agressive. Il est également clair que les Pakistanais étaient convaincus que le vote leur donnerait le Cachemire."
 Treaty_Lahore.9.d:0 "Le gouvernement pakistanais a répondu froidement à notre offre de mettre en oeuvre la résolution de l'ONU. Ils ont souligné que c'était quelque chose que nous aurions pu faire il y a des années et que le proposer maintenant, dans la situation actuelle, était pour eux une manière fallacieuse de sauver la face. Les Pakistanais ont plutôt déclaré que la situation indienne au Cachemire était clairement intenable et que l'Inde devrait quitter l'ancien État princier. Les Pakistanais ont adouci cette position dure en ajoutant que si nous nous conformions, ils rétabliraient immédiatement la frontière internationale aux frontières d'avant-guerre et échangeraient les prisonniers de guerre. Nous ne pouvons certainement pas accepter durablement l'occupation des grandes villes indiennes. Cependant, certains conseillers suggèrent de proposer aux Pakistanais un plan de partition du Cachemire dans lequel nous conserverions le Jammu et le Ladakh, ce qui permettrait à chaque partie du Cachemire d'être avec ses coreligionnaires."
 Treaty_Lahore.10.d:0 "Après avoir informé les Indiens que notre intention n'était pas de jouer à des jeux concernant le Cachemire, ils ont fait une offre intéressante. Les Indiens ont noté qu'historiquement Jammu était non musulman et que la première guerre du Cachemire a chassé de nombreux non-musulmans de la vallée vers Jammu. Cette population appréhenderait un gouvernement pakistanais et, pour éviter toute animosité ou un nouveau cycle de troubles communautaires, nous devrions peut-être diviser le Cachemire. Ils nous donneraient tout le Cachemire, à l'exception du Jammu et du Ladakh. Accepter ce plan de partition atteindrait notre objectif de contrôler la vallée et éliminerait le casse-tête potentiel lié à l'intégration des non-musulmans cachemiriens. Cela nous éviterait également d'hériter du conflit frontalier entre l'Inde et la Chine. Nous devrions envisager cette option, cependant, certains des délégués les plus bellicistes estiment que nous devrions sécuriser tout le Cachemire et enfin unifier le Pakistan."
 Treaty_Lahore.11.d:0 "Les Pakistanais ont révélé leurs ambitions nues en rejetant notre dernière proposition de partition du Cachemire. Les Pakistanais ont déclaré qu'ils retireraient leurs forces de notre territoire et échangeraient leurs prisonniers de guerre une fois que nos forces commenceraient leur évacuation du Cachemire. Notre situation est intenable : plus les forces pakistanaises occupent nos terres longtemps, plus l'État et le gouvernement semblent faibles. Même si cela nous fait mal, nous n'avons d'autre choix que de nous conformer et de signer l'accord. Les militaires et la population seront sans aucun doute furieux de ce changement d'événements. Les Pakistanais ont une vision à très court terme : même s'ils réussissent maintenant, le peuple indien n'abandonnera jamais les Cachemiriens que nous protégeons depuis 1947."
 Treaty_Lahore.12.d:0 "Le gouvernement pakistanais, après avoir pris le temps d'examiner notre proposition, a accepté de diviser le Cachemire. Nous avons immédiatement donné l'ordre à nos forces de se retirer vers les nouvelles frontières. L'accord final verra nos deux nations revenir aux frontières internationales d'avant-guerre et entamer le processus d'échange de prisonniers. Même si notre peuple et l'opposition seront déçus du résultat, nous pouvons au moins affirmer que nous avons préservé notre engagement envers les victimes de la première invasion tribale du Cachemire. Face à une situation difficile, nous avons réussi à nous relever aussi bien que prévu."
 Treaty_Lahore.13.d:0 "La communauté internationale s'est réjouie de constater que le Pakistan et l'Inde se sont mis d'accord sur un accord final pour mettre fin à leur récente guerre à Lahore. Après d'intenses négociations, le Pakistan a accepté de partager le Cachemire avec l'Inde. La vallée du Cachemire et le territoire déjà contrôlé par le Pakistan seront sous son contrôle. L'Inde conserve son contrôle sur le Ladakh et le Jammu. Les deux parties ont convenu que cette solution permettrait à tous les Cachemiriens de résider là où ils se sentent le plus à l'aise. Malgré cela, des informations font déjà état de Cachemiriens non musulmans s'installant au Jammu et en Inde. Cet accord marque un revers majeur pour l'Inde et confirme sa défaite militaire sur le champ de bataille. Pour le Pakistan, son gouvernement célèbre le traité comme l'achèvement de la nation. Des plans sont déjà en cours pour que le président se rende à Srinagar."
 Treaty_Lahore.14.d:0 "Le président du Pakistan et le Premier ministre indien ont signé le Traité de Lahore pour mettre fin à leur récent conflit militaire. L'accord confirme la victoire militaire pakistanaise puisque l'Inde a accepté de se retirer complètement du Cachemire. En échange, les deux parties retourneront aux frontières d'avant-guerre le long de la frontière internationale et échangeront des prisonniers de guerre. La réaction au Pakistan a été une totale liesse. Les mosquées proclament les détails du traité, provoquant un rassemblement de foules pour célébrer. En Inde, le traité est considéré comme l'humiliation ultime. Des informations font déjà état de Cachemiris non musulmans fuyant vers l'Inde, leur arrivée ne fera que souligner ce qui a été perdu. De nombreux observateurs estiment que malgré la victoire pakistanaise, la situation entre les deux nations ne s'améliorera probablement pas avec cet accord."
 Treaty_Lahore.15.d:0 "Le Traité de Lahore est accueilli très négativement en Inde. L'opposition a été particulièrement brutale dans ses critiques à l'égard du gouvernement et de sa gestion de la guerre et de ses conséquences. Des rapports font état de troubles parmi les officiers subalternes, qui estiment que les hauts dirigeants et le gouvernement ont laissé tomber leur cause. Certains rapports font état de civils insultant des hommes en uniforme et des représentants du gouvernement. L'arrivée de réfugiés cachemiriens pro-indiens est plus préoccupante. Leurs dirigeants publient déjà des éditoriaux condamnables dans les principaux journaux. Nous devons travailler dur pour réunifier la nation et préparer l'avenir. Le Pakistan a certainement pris le dessus cette fois-ci, mais nous finirons sans doute par trouver le moment de frapper."
 
 Treaty_Delhi.1.d:0 "Le récent conflit avec l'Inde s'est terminé de manière désastreuse. Non seulement nous n'avons pas réussi à forcer l'Inde à résoudre le Cachemire, mais au cours du conflit, nous avons désormais des villes pakistanaises sous occupation indienne. Militairement, nous avons très peu de poids. Le peuple pakistanais souhaite que ses familles soient unies et que ses soldats rentrent chez eux. Cependant, il est clair que le coût de cette situation pourrait se faire aux dépens du Cachemire. Alors que notre délégation se prépare pour Delhi, nous devons rechercher un cessez-le-feu et le rétablissement du statu quo d'avant-guerre. Si cela échoue, nous ferons pression pour une partition du Cachemire tout en conservant le Gilgit-Baltistan. Nous essaierons d'en faire une frontière permanente pour sauver au moins quelque chose de la situation. Cependant, la situation militaire est telle que si l'Inde fait pression pour que nous quittions le Cachemire, nous n'aurons probablement pas le choix."
 Treaty_Delhi.2.d:0 "Le récent conflit ne s'est intensifié qu'après que le Pakistan a lancé une sournoise campagne de violence au Cachemire. Leurs efforts pour s'emparer du territoire par la force ont échoué et, dans la guerre qui en a résulté, nos forces se sont révélées supérieures. Nous avons l'avantage militaire et contrôlons suffisamment de territoire pour négocier en position de force. De nombreux faucons au sein du gouvernement feront pression sur nous pour exiger tout le Cachemire, y compris le Gilgit-Baltistan. Bien que cela ait certainement du sens, nous devons considérer les défis liés à l'intégration d'autant de terres et d'une population soumise à un lavage de cerveau pendant des décennies pour haïr notre nation. Il serait peut-être préférable d'envisager des plans alternatifs, sans pour autant gaspiller l'avantage que nos courageux hommes nous ont assuré sur le champ de bataille."
 Treaty_Delhi.3.d:0 "Le conflit récemment conclu avec l'Inde a mis en lumière l'anxiété et les craintes de nombreux Bengalis au Pakistan. Ils ont estimé que les combats au Cachemire se sont déroulés sans consultation et ont abouti à une guerre qui a mis le Pakistan oriental en grave danger. En outre, de nombreux Bengalis estimaient que le gouvernement concentrait ses ressources et ses troupes sur le front du Cachemire, laissant la province la plus peuplée du Pakistan vulnérable aux incursions ennemies. Des politiciens bengalis et des dirigeants étudiants se sont adressés à de grandes foules de manifestants en colère contre ce qu'ils considéraient comme un échec de l'armée à les protéger."
 Treaty_Delhi.4.d:0 "Les premiers pourparlers entre nous et le Pakistan ont été très tendus. Lors des discussions les plus récentes, ils ont proposé de ramener la région à la situation d'avant-guerre, un mois avant le début des combats au Cachemire. Ils affirment que cela préservera le délicat statu quo du Cachemire et empêchera une nouvelle attisation des émotions des deux côtés de la frontière. Il s'agit évidemment d'un stratagème désespéré de la part des Pakistanais. Nous informerons bientôt les Pakistanais que ce sont eux qui ont bouleversé le statu quo. Pour cette raison, ils doivent reconnaître la nouvelle réalité sur le terrain, et c'est pourquoi nous déclarerons que le Pakistan doit nous céder tout son Cachemire occupé. L'État princier du Cachemire, rattaché à l'Inde et au Pakistan, doit reconnaître cette réalité."
 Treaty_Delhi.5.d:0 "Nos efforts visant à restaurer les frontières d'avant-guerre ont été catégoriquement rejetés. Les Indiens ne sont pas d'humeur à envisager cela. Ils ont l'impression que nous sommes à l'origine des troubles et qu'ils ne peuvent pas s'arrêter tant qu'ils n'ont pas obtenu quelque chose de notre part. Notre prochaine option consiste à échanger nos revendications sur la vallée du Cachemire contre un rétablissement de la paix. Nous proposerons une partition du Cachemire où nous conserverions le Gilgit et le Baltistan mais céderions le reste à l'Inde. Nous avons été vaincus cette fois, mais nous nous relèverons et n'abandonnerons jamais le Cachemire."
 Treaty_Delhi.6.d:0 "La délégation pakistanaise a réalisé que nous n'étions pas d'humeur à les laisser s'en tirer. Lors des derniers cycles de négociations, ils ont proposé de nous céder leur soi-disant Azad Cachemire, mais ont demandé de conserver le Gilgit-Baltistan. Au cours de la première guerre du Cachemire, le Gilgit-Baltistan est rapidement tombé aux mains des Pakistanais car ils y bénéficiaient du soutien des milices locales. Leur proposition peut avoir beaucoup de sens pour nous. Nous éviterions d'hériter d'une population hostile et réussirions à unifier la vallée du Cachemire. Au niveau international, ce serait également un résultat bienvenu. Cependant, nombre de nos faucons disent que nous ne pouvons pas perdre cet avantage et que nous devrions faire pression sur les Pakistanais pour qu'ils quittent le Cachemire."
 Treaty_Delhi.7.d:0 "Le gouvernement indien a accepté notre proposition de partition du Cachemire. Le coeur lourd, nous avons déjà donné l'ordre à nos responsables et à nos troupes restantes de quitter l'Azad Cachemire. On rapporte déjà que des familles cachemiriennes ont fui vers la sécurité au Pakistan. Cependant, compte tenu de l'alternative, c'était le meilleur résultat. Nous n'abandonnerons jamais le Cachemire, mais nos mains sont liées. Le gouvernement indien a accepté de retirer ses propres forces de notre territoire, d'échanger des prisonniers de guerre et de rétablir les relations diplomatiques. Nous ne pouvons que prier pour que l'avenir nous donne l'occasion de réparer cette injustice historique."
 Treaty_Delhi.8.d:0 "La nouvelle de notre accord à Delhi a provoqué une agitation massive dans nos villes. Il y a un véritable choc car de nombreux Pakistanais avaient l'impression que nos forces s'en sortaient bien pendant la guerre. L'arrivée précoce des réfugiés de l'Azad Cachemire alimente la colère. Au sein de l'armée, des rumeurs font état de tensions entre les officiers supérieurs et leurs subordonnés. De nombreux jeunes officiers estimaient que les revers militaires n'étaient pas dus à la supériorité indienne mais à un échec de leadership. Nous devons travailler pour réunir notre peuple en ce moment de crise."
 Treaty_Delhi.9.d:0 "La nouvelle de notre accord sur le Cachemire a atteint le grand public. De nombreuses personnes dans le pays se réjouissent du résultat. Ils considèrent cet accord comme une confirmation de notre domination militaire sur la région et comme une juste punition infligée aux Pakistanais. En ce qui concerne le Cachemire, de nombreux journaux affirment que l'unification de la vallée du Cachemire unirait les familles et réduirait les tensions entre les Cachemiriens. L'armée est largement saluée pour avoir préservé l'honneur de la nation. Avec cette victoire, nous espérons voir enfin une nouvelle ère de paix."
 Treaty_Delhi.10.d:0 "Les négociations de Delhi entre l'Inde et le Pakistan se sont soldées par un accord. Le Pakistan a accepté de céder la vallée du Cachemire à l'Inde, en échange du rétablissement des frontières internationales d'avant-guerre. Les deux parties ont également convenu d'échanger des prisonniers de guerre. Permettre au Pakistan de conserver le Gilgit-Baltistan est considéré comme une étape positive par de nombreux observateurs. Alors que les deux camps retirent leurs forces du front, des informations font état de réfugiés cachemiris se dirigeant vers le Pakistan. La population indienne se réjouirait du traité, le considérant comme une confirmation de sa victoire militaire. La réaction au Pakistan est le choc et la colère, beaucoup estiment que le gouvernement a complètement laissé tomber la population du Cachemire."
 Treaty_Delhi.11.d:0 "La délégation indienne a révélé son avidité et son ambition en rejetant notre juste offre de partition du Cachemire. Les Indiens ont déclaré que le seul scénario qu'ils accepteraient pour restaurer la frontière internationale et la paix serait notre retrait complet du Cachemire. En raison de l'équilibre militaire, nous n'avons d'autre choix que de nous conformer. Le coeur lourd, nous devons ordonner à nos forces de quitter le Cachemire. Les conséquences et les réactions négatives de la population seront immenses. Cependant, nous n'avons pas le choix, mais compte tenu de l'injustice de la situation, avec le temps, nous serons rachetés. Nos délégués signeront bientôt le traité final."
 Treaty_Delhi.12.d:0 "La nouvelle de notre accord à Delhi a provoqué une agitation massive dans nos villes. Il y a un véritable choc car de nombreux Pakistanais avaient l'impression que nos forces s'en sortaient bien pendant la guerre. L'arrivée précoce des réfugiés de l'Azad Cachemire alimente la colère. Au sein de l'armée, des rumeurs font état de tensions entre les officiers supérieurs et leurs subordonnés. De nombreux jeunes officiers estimaient que les revers militaires n'étaient pas dus à la supériorité indienne mais à un échec de leadership. Nous devons travailler pour réunir notre peuple en ce moment de crise. Nos partisans, actuellement sous occupation indienne, resteront fidèles à nous dans leur coeur."
 Treaty_Delhi.13.d:0 "La nouvelle de notre accord sur le Cachemire a atteint le grand public. De nombreuses personnes dans le pays se réjouissent du résultat. Ils considèrent cet accord comme une confirmation de notre domination militaire sur la région et comme une juste punition infligée aux Pakistanais. En ce qui concerne le Cachemire, de nombreux journaux affirment que l'unification de la vallée du Cachemire unirait les familles et réduirait les tensions entre les Cachemiriens. Les nouvelles frontières limiteront également les contacts chinois avec le Pakistan, renforçant ainsi notre position. L'armée est largement saluée pour avoir préservé l'honneur de la nation. Avec cette victoire, nous espérons voir enfin une nouvelle ère de paix."
 Treaty_Delhi.14.d:0 "Les négociations de Delhi entre l'Inde et le Pakistan se sont soldées par un accord. Le Pakistan a accepté de céder tout son territoire cachemirien à l'Inde, en échange du rétablissement des frontières internationales d'avant-guerre. Les deux parties ont également convenu d'échanger des prisonniers de guerre. Certains observateurs ont exprimé leur inquiétude quant au fait que la prise de tout le Cachemire ne ferait que cimenter l'antagonisme entre l'Inde et le Pakistan. Alors que les deux camps retirent leurs forces du front, des informations font état de réfugiés cachemiris se dirigeant vers le Pakistan. La population indienne se réjouirait du traité, le considérant comme une confirmation de sa victoire militaire. La réaction au Pakistan est le choc et la colère, beaucoup estiment que le gouvernement a complètement laissé tomber la population du Cachemire."
 
 
 