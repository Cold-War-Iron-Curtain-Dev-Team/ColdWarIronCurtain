 # Screen Hulls #

## Frigates or Corvettes

 #SWE_screen_hull_medium_0:0 ""
 #SWE_screen_hull_medium_0_desc:0 ""
 #SWE_screen_hull_medium_1:0 ""
 #SWE_screen_hull_medium_1_short:0 ""
 #SWE_screen_hull_medium_1_desc:0 ""
 SWE_screen_hull_medium_2:0 "Classe de Stockholm"
 SWE_screen_hull_medium_2_desc:0 "La classe Stockholm est une paire de navires de guerre de la marine suédoise. Construits comme corvettes à Karlskrona en 1984-1985, ils sont armés de quatre missiles antinavires RBS15, d'un canon de 57 mm et de plusieurs mitrailleuses. En 2017, les deux unités de la classe ont été reconstruites et servent désormais de patrouilleurs. La possibilité d'embarquer des missiles anti-navires demeure cependant."
 SWE_screen_hull_medium_3:0 "Classe Göteborg"
 SWE_screen_hull_medium_3_desc:0 "La classe Göteborg est une classe de corvettes de la marine suédoise, construite entre 1986 et 1993. La classe a été conçue à l'origine pour détruire les sous-marins et les navires de surface soviétiques et est armée de huit missiles antinavires RBS-15, de torpilles, d'un canon de 57 mm et d'un canon de 40 mm."
 SWE_screen_hull_medium_4:0 "Classe Visby"
 SWE_screen_hull_medium_4_desc:0 "La classe Visby est un navire de guerre utilisé par la marine suédoise. Il s'agit de la dernière classe de corvette adoptée par la marine après les corvettes des classes Göteborg et Stockholm. Sa conception met l'accent sur la section efficace radar à faible visibilité et la signature infrarouge, et la classe a reçu une large attention internationale en raison de ses capacités en tant que navire furtif."

## Destroyers or large frigates

 SWE_screen_hull_heavy_0:0 "Classe Visby"
 SWE_screen_hull_heavy_0_desc:0 "La classe Visby était une classe de destroyers suédois de la Seconde Guerre mondiale. Au cours des années 1942-1944, quatre navires, le Visby, le Sundsvall, le Hälsingborg et le Kalmar, furent construits et livrés à la marine suédoise. Les navires faisaient partie du renforcement militaire suédois pendant la guerre. Durant cette période, les navires étaient utilisés comme gardes neutres et comme navires d'escorte."
 SWE_screen_hull_heavy_1:0 "Classe Öland"
 SWE_screen_hull_heavy_1_desc:0 "La classe Öland était une classe de destroyers suédois. De 1943 à 1947, deux destroyers furent construits, le HSwMS Öland et le HSwMS Uppland."
 SWE_screen_hull_heavy_2:0 "Classe Halland"
 SWE_screen_hull_heavy_2_desc:0 "Les destroyers de la classe Halland étaient deux navires construits pour la marine suédoise dans les années 1950. Quatre navires étaient prévus, mais la deuxième paire a été annulée. Deux navires modifiés ont été exportés vers la marine colombienne. Ces navires étaient des navires de combat de surface à usage général."
 SWE_screen_hull_heavy_3:0 "Classe Östergötland"
 SWE_screen_hull_heavy_3_short:0 "Classe Östergötland"
 SWE_screen_hull_heavy_3_desc:0 "La classe Östergötland était une classe de destroyers construits pour la marine suédoise à la fin des années 1950. Ils étaient plus petits et moins performants que la classe Halland précédente et ont été mis hors service en 1982. La classe était les derniers destroyers construits par la Suède au 20e siècle. Ils étaient parfois appelés destroyers légers."
 #SWE_screen_hull_heavy_4:0 ""
 #SWE_screen_hull_heavy_4_short:0 ""
 #SWE_screen_hull_heavy_4_desc:0 ""

## Large destroyers or cruisers

 SWE_battle_hull_light_0:0 "Classe Gotland"
 SWE_battle_hull_light_0_desc:0 "HSwMS Gotland était un hydravion de croisière de la marine suédoise construit par Götaverken. La conception du navire a débuté en décembre 1926 en tant que porte-hydravions pouvant accueillir douze avions. Lorsqu'on lui a présenté le projet, le Conseil suédois de la construction navale a décidé qu'il souhaitait que le navire ait des fonctions de croiseur et de pose de mines ainsi que de porte-hydravions."
 SWE_battle_hull_light_1:0 "Classe Tre Kronor"
 SWE_battle_hull_light_1_desc:0 "La classe Tre Kronor ou classe Three Crowns était une classe de deux croiseurs construits pour la marine suédoise pendant la Seconde Guerre mondiale, comprenant le Tre Kronor et le Göta Lejon."
 SWE_battle_hull_light_2:0 "Refit de la classe Tre Kronor"
 SWE_battle_hull_light_2_desc:0 "La classe Tre Kronor ou classe Three Crowns était une classe de deux croiseurs construits pour la marine suédoise pendant la Seconde Guerre mondiale, comprenant le Tre Kronor et le Göta Lejon."
