 #Battleship/Battlecruiser Hulls in research tree#



 SWE_battle_hull_medium_0:0 "Réaménagement de la classe Sverige"
 SWE_battle_hull_medium_0_desc:0 "Les navires de défense côtière de classe Sverige étaient une classe de navires de défense côtière qui, au moment de leur introduction, étaient les plus grands navires à servir dans la marine suédoise. Leur conception était complètement nouvelle et était influencée par les navires de l'époque."

 #Carrier Hulls in research tree#

 # Submarine Hulls #
 SWE_sub_hull_small_single_0:0 "Classe Draken II"
 SWE_sub_hull_small_single_0_desc:0 "La classe Draken (Dragon) était une classe de sous-marins construite pour la marine suédoise de 1960 à 1962. Au total, six sous-marins ont été livrés. Quatre des bateaux ont été modernisés en 1981-1982. La conception était une version modifiée de la classe Hajen avec un seul arbre avec une hélice à 5 pales plus grande pour des performances sous-marines améliorées et une réduction du bruit."
 SWE_sub_hull_small_single_1:0 "Réaménagement de la classe Draken II"
 SWE_sub_hull_small_single_1_desc:0 "La classe Draken (Dragon) était une classe de sous-marins construite pour la marine suédoise de 1960 à 1962. Au total, six sous-marins ont été livrés. Quatre des bateaux ont été modernisés en 1981-1982. La conception était une version modifiée de la classe Hajen avec un seul arbre avec une hélice à 5 pales plus grande pour des performances sous-marines améliorées et une réduction du bruit."
 SWE_sub_hull_small_single_2:0 "Classe Sjöormen"
 SWE_sub_hull_small_single_2_desc:0 "La classe Sjöormen (Serpent de mer) était une classe de sous-marins construits pour la marine suédoise à la fin des années 1960. Ils avaient une coque en forme de larme et étaient capables de plonger jusqu'à 150 mètres (490 pieds). Au moment de leur déploiement, ils étaient considérés comme l'une des classes de sous-marins non nucléaires les plus avancées au monde."
 SWE_sub_hull_small_single_3:0 "Classe Västergötland"
 SWE_sub_hull_small_single_3_desc:0 "La classe de sous-marins diesel-électriques Västergötland est entrée en service en 1987 dans la marine suédoise, permettant ainsi la retraite de la dernière classe de sous-marins Draken II."
 SWE_sub_hull_small_single_4:0 "Classe Gotland"
 SWE_sub_hull_small_single_4_desc:0 "Les sous-marins de classe Gotland de la marine suédoise sont des sous-marins diesel-électriques modernes, conçus et construits par le chantier naval Kockums en Suède. Ce sont les premiers sous-marins au monde à être équipés d'un système de propulsion indépendante de l'air (AIP) à moteur Stirling, qui prolonge leur endurance sous-marine de quelques jours à plusieurs semaines."

 SWE_sub_hull_large_single_0:0 "Classe Neptune"
 SWE_sub_hull_large_single_0_desc:0 "Le sous-marin de classe Neptun était une classe de sous-marins suédois construit par Kockums. Le premier sous-marin a été lancé en 1942 et trois sous-marins au total ont été construits ; HMSwS Neptun, HMSwS Najad et HMSwS Nacken."
 SWE_sub_hull_large_single_1:0 "Classe Hajen III"
 SWE_sub_hull_large_single_1_desc:0 "La classe Hajen (classe Shark) était une classe de sous-marins construite par Kockums et utilisée par la marine suédoise. La conception a été influencée par la classe de sous-marins allemands Type XXI. Au total, 6 sous-marins ont été construits entre 1954 et 1958 et sont restés en service jusqu'en 1980."
