 Burma_KW.1.d:0 "Le Premier ministre birman a fermement condamné les États-Unis pour leur intervention en Corée. Il a déclaré que le conflit actuel doit être résolu par le peuple coréen lui-même et que les États-Unis utilisent ce conflit pour imposer leur propre ordre impérial en Asie. Cette annonce a divisé les dirigeants politiques birmans, notamment les conservateurs et les socialistes. Ils craignent que cette condamnation ne fasse qu'enhardir les communistes birmans et provoquer la colère des puissances occidentales, qui constituent une source importante d'aide économique pour le pays. Cependant, cette annonce a touché une corde sensible chez les gauchistes et les citoyens birmans ordinaires qui se remettent encore des traumatismes de l'impérialisme britannique et japonais."
 Burma_KW.3.d:0 "L'AFPFL a décidé de purger le Congrès des syndicats en réponse aux critiques de son président, Thakin Lwin, qui critiquait ouvertement l'AFPFL pour sa politique étrangère. Lwin est clairement un communiste inconditionnel, et l'organisation, créée comme contrepoids socialiste aux syndicats communistes, a besoin d'être nettoyée. L'AFPFL suspendra le Congrès des syndicats jusqu'à ce qu'il élimine tous les communistes, y compris Lwin, de leurs postes élevés. Une fois qu'elle aura obéi à ces diktats, l'organisation pourra être réintégrée à l'AFPFL. Certaines publications d'opposition citent l'AFPFL qui aurait agi après que Lwin ait publiquement critiqué le gouvernement pour son soutien aux États-Unis dans le conflit coréen."
 Pyidawtha.1.d:0 "Le Premier ministre U Nu a réuni des responsables économiques, politiques et du développement de premier plan pour discuter d'un nouveau plan de développement pour la nation. En plus de consulter les hauts responsables, le gouvernement a également conclu des contrats avec des sociétés extérieures d'ingénierie, de conseil économique et minières pour aider à l'élaboration du plan. U Nu estime que pour laisser derrière elle les chaînes du colonialisme, la Birmanie doit avancer avec un plan de transformation ambitieux. L'objectif de ce plan de développement sera de rendre la Birmanie économiquement compétitive et de sortir sa population de la pauvreté le plus rapidement possible. Le gouvernement prévoit de dévoiler les détails de son plan global lors de la prochaine conférence sur le développement, appelée Conférence Pyidwatha."
 Pyidawtha.2.d:0 "Le peuple birman et de nombreux observateurs internationaux ont été captivés par le nouveau plan de développement sur huit ans proposé par le Premier ministre U Nu. Les détails ont été dévoilés lors de la Conférence de Pyidawtha sur le développement. Le gouvernement birman souhaite industrialiser la nation et établir un État-providence. Dix projets majeurs sont impliqués dans le plan, notamment en mettant l'accent sur la nationalisation, les infrastructures, l'éducation, le gouvernement local et l'autonomie des gouvernements régionaux. Ce plan est l'aboutissement d'une planification intense de la part du gouvernement, qui a également embauché certaines des plus grandes sociétés étrangères de conseil et d'ingénierie pour contribuer à cet effort. Malgré des objectifs ambitieux, le gouvernement est convaincu de pouvoir atteindre tous ses objectifs. Bien que de nombreuses personnes louent les aspects économiques, certains rivaux politiques se demandent si le renforcement du pouvoir des collectivités locales ne suscitera pas des sentiments anti-nationaux."
 AFPFL.1.d:0 "Lors des dernières élections, le Front national uni, parti d'opposition, a réussi à remporter un grand nombre de voix et de sièges, grâce à notre système électoral. Cette coalition de gauche a réussi à attirer des électeurs dont nous nous attendions à voter avec nous. Le NUF s'est révélé efficace dans la construction d'alliances avec les syndicats et les organisations paysannes. Nous avons également entendu des rumeurs selon lesquelles des ambassades étrangères seraient également impliquées dans le soutien au parti. Les dirigeants du NUF se sont montrés habiles à attirer et à exploiter les médias à leur avantage tout au long de la campagne électorale. Le parti doit prendre le temps d'analyser ce que le NUF fait de bien et proposer des réformes pour renforcer l'AFPFL pour l'avenir."
 AFPFL.2.d:0 "Ba Swe a été nommé Premier ministre de Birmanie. Le leader de l'AFPFL, U Nu, a décidé de ne pas occuper ce poste. U Nu serait particulièrement perturbé par le succès électoral rapide du Front d'union nationale, parti d'opposition, et sera le fer de lance des efforts visant à analyser les réformes nécessaires pour renforcer l'AFPFL. Ba Swe est un député de confiance d'U Nu et chef du Parti socialiste. Le nouveau Premier ministre devrait se concentrer sur la poursuite de la transformation économique de la Birmanie."
 AFPFL.3.d:0 "Des rapports font état de luttes intestines croissantes au sein du parti AFPFL au pouvoir en Birmanie. Il semble que le Premier ministre Ba Swe soit de plus en plus mécontent du haut dirigeant du parti, U Nu. À la suite des récentes élections, U Nu a cherché à lancer d'importantes réformes pour renforcer l'appareil du parti et le rendre plus compétitif lors des prochaines élections. Certaines de ses propositions semblent s'aliéner Ba Swe et d'autres qui ne sont pas d'accord avec les dirigeants d'U Nu. Les partisans de Ba Swe rallieraient les membres de l'AFPFL pour soutenir les appels à une nouvelle direction du parti."
 AFPFL.4.d:0 "Le gouvernement birman a annoncé qu'U Nu succéderait à Ba Swe au poste de Premier ministre. Le nouveau Premier ministre a indiqué qu'il avait décidé de prendre un peu de temps pour développer une vision visant à renforcer l'unité nationale de la Birmanie et de l'AFPFL. U Nu jouit d'une grande popularité auprès de nombreux Birmans et son retour au pouvoir sera bien accueilli. Cependant, des rapports font état de tensions croissantes au sein de l'AFPFL, car même certains des députés les plus fidèles d'U Nu seraient de plus en plus préoccupés par le style de leadership d'U Nu."
 AFPFL.6.d:0 "Un récent congrès du parti de l'AFPFL a révélé d'âpres divisions au sein du parti. Ces conflits internes se sont poursuivis jusqu'à éclater lorsque l'ancien Premier ministre Ba Swe et le haut dirigeant du parti Kyaw Nyein ont conduit treize autres ministres à démissionner du gouvernement, divisant ainsi le parti. La plupart des membres du parti se sont rangés du côté de Ba Swe et sont appelés l'AFPFL stable tandis que ceux qui sont toujours avec U Nu sont appelés l'AFPFL propre. Quelques jours plus tard, l'AFPFL stable a demandé une motion de censure au Parlement, qui n'a été rejetée que lorsque l'opposition, le Front national uni, a choisi de soutenir un Premier ministre assiégé. Malgré la scission dramatique, il semble que la division soit en grande partie le résultat de personnalités concurrentes, aucun des deux partis n'ayant annoncé de changement majeur par rapport aux politiques traditionnelles de l'AFPFL. De nombreux Birmans sont de plus en plus préoccupés par cette nouvelle vague d'instabilité politique." 
 Burmese_Buddhism.0.d:0 "Le Premier ministre U Nu, chef spirituel bouddhiste Theravada, a lancé un programme visant à promouvoir le bouddhisme à travers le pays. Cet effort soutiendra une récente résurgence des pratiques bouddhistes à travers la Birmanie. U Nu est convaincu que les principes du bouddhisme et son acceptation par de nombreux citoyens birmans en font un moyen idéal pour promouvoir l'unité nationale. Les programmes bouddhistes seront encouragés et le gouvernement fera tout son possible pour acquérir des objets bouddhistes dans toute la région. La pierre angulaire de cette nouvelle approche sera le projet d'accueillir un Grand Synode."
 Burmese_Buddhism.1.d:0 "Le gouvernement birman a décidé de parrainer le Sixième Grand Synode du bouddhisme Theravada. Le dernier conseil a eu lieu il y a plus de quatre-vingts ans. Le gouvernement a construit une pagode appelée la pagode Kaba Aye à Mahapasana Guha. Au total, 2 500 anciens bouddhistes Theraveda de huit pays seront invités à la réunion. Le Premier ministre U Nu espère que la conférence présentera la Birmanie comme un centre d'apprentissage bouddhiste. Le conseil se réunira pendant environ deux ans et le gouvernement envisage d'autoriser les visiteurs à se rendre en pèlerinage sur le site."
 Rohingya.1.d:0 "Notre mission diplomatique en Birmanie a signalé que le gouvernement birman les avait approchés, exigeant que nous arrêtions de financer l'insurrection des Rohingyas. Ils insistent sur le fait que leur position n'est pas d'éradiquer l'Islam en Birmanie mais d'établir un État unifié où toutes les communautés peuvent prospérer. De leur point de vue, notre soutien continu est perturbateur et le gouvernement birman envisage de dégrader nos relations diplomatiques. En échange de l'arrêt de notre aide aux Rohingyas, le gouvernement birman est disposé à améliorer les relations diplomatiques et commerciales, nous permettant ainsi un meilleur accès à leurs marchés. Nos responsables du renseignement pensent que nous pouvons continuer à soutenir les rebelles, mais la poursuite des combats pourrait entraîner une répression plus agressive de la part de l'armée birmane, ce qui pourrait conduire à une crise humanitaire. L'offre semble bénéfique, mais rien ne garantit que les Birmans tiendront leur promesse de ne pas supprimer l'Islam en Birmanie après avoir rétabli son autorité."
 Rohingya.2.d:0 "La mission diplomatique pakistanaise nous a discrètement informé qu'elle veillerait à ce qu'aucune partie ne s'immisce dans nos affaires intérieures. Cela affaiblira considérablement le mouvement rebelle Rohingya. Nous avons promis aux Pakistanais qu'il n'y aurait pas de représailles, mais bien sûr, nous nous réservons le droit de gérer les affaires intérieures comme bon nous semble. Pour les satisfaire, nous leur proposerons de meilleures relations commerciales. Cela devrait suffire à les empêcher de renouer ultérieurement avec les rebelles. Il s'agit d'une victoire majeure pour notre gouvernement et notre position militaire."
 Rohingya.3.d:0 "Le gouvernement pakistanais a rejeté notre approche directe consistant à exiger qu'il cesse d'armer les rebelles Rohingyas. Ils insistent sur le fait que ce ne sont pas des agents pakistanais qui arment les rebelles et qu'il n'y a aucune preuve d'une quelconque implication pakistanaise dans cette affaire. Il s'agit d'un revers majeur et d'un déni risible. Les Pakistanais sont clairement concentrés sur cette tentative malavisée d'ingérence dans nos affaires. Nous dégraderons nos relations avec le Pakistan et redoublerons d'efforts pour déraciner les rebelles. L'armée insiste sur le fait que cela ne l'empêchera pas de rétablir l'ordre et d'établir l'unité nationale."
 Burma_Union.1.d:0 "Le Premier ministre U Nu a annoncé la création du Bureau d'enquête spéciale. Cette nouvelle agence criminelle sera sous l'autorité directe du Premier ministre. L'agence sera chargée d'enquêter sur les délits financiers, la corruption et les flux illégaux d'argent liquide étranger. U Nu est de plus en plus préoccupé par l'impact de la corruption sur la gouvernance et par le rôle des nations étrangères dans le soutien aux mouvements rebelles. L'opposition a exprimé ses inquiétudes quant au fait que la nouvelle organisation pourrait devenir un outil du Premier ministre pour punir et arrêter les opposants sur des bases fragiles."
 NUF_1958.0.d:0 "Dans une annonce majeure, le gouvernement birman a annoncé que l'Armée de libération communiste rebelle mettrait un terme à sa campagne et rejoindrait l'État. Le Premier ministre a souligné que les combats précédents avaient été provoqués par des désaccords avec l'État, mais que son gouvernement avait résolu ces préoccupations. Il s'agit d'un succès majeur pour le nouveau gouvernement du Front national uni, car il met fin à un important groupe rebelle armé. Bien que nombreux soient ceux qui accueilleront favorablement cette nouvelle, les conservateurs birmans soupçonnent de plus en plus que le NUF contrôlait les rebelles et les utilisait pour faire pression sur le gouvernement précédent."
 Burma_Elect.1.d:0 "La Birmanie organise des élections générales pour déterminer le prochain gouvernement. En raison des problèmes de sécurité persistants, la participation électorale semble être très faible. Le populaire AFPFL devrait remporter les élections à une écrasante majorité, car il a réussi à créer des alliances avec de nombreux autres partis en lice pour les élections. Malgré le faible taux de participation, le parti utilisera cette victoire comme un mandat fort pour mettre en oeuvre sa vision pour la nation. L'AFPFL a promis un développement économique et social, mais son objectif principal sera de restaurer l'unité nationale du pays. Cela signifie s'engager auprès des nombreuses factions rebelles qui opèrent actuellement dans le pays."
 BURMA_KMT_UN.1.d:0 "Dans les dernières phases de la guerre civile chinoise, des milliers de soldats du Kuomintang (KMT) venus de la République de Chine sont entrés sur notre territoire, où ils ont établi des bases autour de Kengtung, sur le territoire Shan. Ces unités militaires étrangères s'entraîneraient et se prépareraient à une éventuelle invasion armée de la Chine. Nos tentatives pour que ces hommes désarment et obéissent à notre autorité ont été repoussées. Le commandant du Kuomintang a déclaré qu'il résisterait à toute tentative de nos militaires de restaurer notre autorité dans la région. Ces soldats étrangers exploitent notre population et nos ressources locales. S'ils décident d'envahir la Chine, nous risquons une invasion totale de la part du gouvernement communiste chinois. Une campagne militaire serait coûteuse, nous devons donc d'abord nous adresser aux Nations Unies et demander de l'aide pour résoudre ce problème du KMT."
 Operation_Bayinnaung.1.d:0 "Nos efforts visant à utiliser les Nations Unies pour négocier le retrait des forces du Kuomintang de nos terres ont porté leurs fruits. La communauté internationale accepte notre position et certaines forces étrangères se sont retirées. Cependant, nos agences de renseignement ont noté que le retrait était très lent et qu'une grande partie des troupes de combat étrangères restaient. Pour résoudre rapidement cette crise, l'armée a lancé l'opération Bayinnaung, la plus grande opération interarmées jamais menée. Nous nous attendons à ce que la résistance du Kuomintang s'effondre assez rapidement, mettant enfin un terme à son occupation."
 NUF_1958.4.d:0 "Le Front national uni croit fermement en une Birmanie unie mais est en profond désaccord avec la politique antérieure consistant à utiliser la puissance militaire pour exercer une autorité centrale sur l'ensemble du territoire. Après avoir discuté, le gouvernement du NUF a décidé de faire des offres aux dirigeants Karen et Mon. Chaque groupe aura la possibilité de mettre fin à sa rébellion armée, en échange d'une autonomie régionale. Ils doivent prêter allégeance au gouvernement birman mais se verront accorder une large autonomie. Le NUF estime que sa proposition garantit un retour rapide à la paix et à la prospérité économique pour tous les citoyens. Des éléments de l'armée birmane et des nationalistes sont mécontents de cette proposition, arguant qu'il s'agit d'une capitulation de l'État."
 NUF_1958.5.d:0 "L'Armée de libération nationale de Karan a annoncé qu'elle accepterait la récente proposition de paix proposée par le gouvernement du Front national uni. L'accord appelle à la fin de toutes les hostilités entre les forces birmanes et les combattants Karen. En échange, Karen bénéficiera d'une large autonomie, lui permettant de vivre selon son mode de vie, au sein de l'État birman. La nouvelle est bien accueillie dans les régions Karen et dans les régions de Birmanie contrôlées par le gouvernement. Le gouvernement NUF affirme avoir franchi une nouvelle étape vers une Birmanie unie où tous les citoyens peuvent prospérer en paix. Des rumeurs de colère circulent, notamment parmi les élites conservatrices et certains officiers militaires, qui estiment que l'accord équivaut à une reddition du territoire birman à une force rebelle."
 NUF_1958.6.d:0 "L'Armée Karen de libération nationale a annoncé qu'elle n'accepterait pas une récente proposition de paix proposée par le gouvernement du Front national uni. L'accord appelle à la fin de toutes les hostilités entre les forces birmanes et les combattants Karen. En échange, Karen bénéficiera d'une large autonomie, lui permettant de vivre selon son mode de vie, au sein de l'État birman. Le groupe rebelle a déclaré que le gouvernement birman avait fait des offres similaires dans le passé, pour finalement y renoncer. Cette nouvelle constitue un revers majeur pour le NUF qui avait promis d'unifier rapidement la Birmanie. Les journaux d'opposition rapportent que certains militaires sont furieux en privé contre le gouvernement, dont l'offre généreuse n'a fait qu'encourager les rebelles à croire qu'ils peuvent atteindre une indépendance totale."
 NUF_1958.7.d:0 "L'Armée de libération nationale Mon a annoncé qu'elle accepterait la récente proposition de paix présentée par le gouvernement du Front national uni. L'accord appelle à la fin de toutes les hostilités entre les forces birmanes et les combattants Mon. En échange, Mon se verra accorder une large autonomie, lui permettant de vivre selon son mode de vie, au sein de l'État birman. La nouvelle est bien accueillie dans les régions Karen et dans les régions de Birmanie contrôlées par le gouvernement. Le gouvernement NUF affirme avoir franchi une nouvelle étape vers une Birmanie unie où tous les citoyens peuvent prospérer en paix. Des rumeurs de colère circulent, notamment parmi les élites conservatrices et certains officiers militaires, qui estiment que l'accord équivaut à une reddition du territoire birman à une force rebelle."
 NUF_1958.8.d:0 "L'Armée de libération nationale Mon a annoncé qu'elle n'accepterait pas une récente proposition de paix proposée par le gouvernement du Front national uni. L'accord appelle à la fin de toutes les hostilités entre les forces birmanes et les combattants Karen. En échange, Mon se verra accorder une large autonomie, lui permettant de vivre selon son mode de vie, au sein de l'État birman. Le groupe rebelle a déclaré que le gouvernement birman avait fait des offres similaires dans le passé, pour finalement y renoncer. Cette nouvelle constitue un revers majeur pour le NUF qui avait promis d'unifier rapidement la Birmanie. Les journaux d'opposition rapportent que certains militaires sont furieux en privé contre le gouvernement, dont l'offre généreuse n'a fait qu'encourager les rebelles à croire qu'ils peuvent atteindre une indépendance totale."
 AFPFL.5.d:0 "Le gouvernement birman a annoncé qu'U Nu succéderait à Ba Swe au poste de Premier ministre. Le nouveau Premier ministre a indiqué qu'il avait décidé de prendre un peu de temps pour développer une vision visant à renforcer l'unité nationale de la Birmanie et de l'AFPFL. U Nu jouit d'une grande popularité auprès de nombreux Birmans et son retour au pouvoir sera bien accueilli. Cependant, des rapports font état de tensions croissantes au sein de l'AFPFL, car même certains des députés les plus fidèles d'U Nu seraient de plus en plus préoccupés par le style de leadership du Premier ministre. Une fois installé au pouvoir, le Premier ministre devra gérer ces conflits ou risquer une escalade."
 AFPFL.7.d:0 "Le Premier ministre U Nu, suite à la scission de l'AFPFL et à sa victoire de justesse lors d'un vote de censure, a appelé le général Ne Win, chef d'état-major des forces armées, à devenir Premier ministre par intérim. Le général Ne Win a promis que son gouvernement intérimaire rétablirait l'ordre public, assurerait la stabilité, puis superviserait de nouvelles élections pour un nouveau gouvernement. Beaucoup félicitent U Nu pour sa décision, notant qu'il a reconnu, après la scission de l'AFPFL, qu'il serait impossible de gouverner efficacement, d'autant plus que de nombreux parlementaires de l'AFPFL s'opposent désormais à U Nu. Les deux factions de l'AFPFL chercheront à s'organiser pour les prochaines élections."
 Burma_FP.1.d:0 "La Birmanie et la République populaire de Chine (RPC) ont signé un accord établissant des relations diplomatiques formelles entre les deux États. Historiquement, la Birmanie et la Chine entretiennent des siècles de liens commerciaux, linguistiques et religieux. Cette décision fait de la Birmanie l'un des premiers États non communistes à reconnaître le gouvernement de la RPC et a suscité certaines critiques de la part des ambassades occidentales. Les responsables du gouvernement birman disent généralement que la Chine est un partenaire commercial majeur et un État voisin et que l'ignorer ne ferait que susciter de la méfiance et des problèmes inutiles."
 Burma_Agreement.1.d:0 "Le gouvernement birman a annoncé qu'il honorerait l'accord signé par Aung San accordant la pleine autonomie aux communautés minoritaires de Birmanie. Les militaires ont reçu l'ordre de se retirer de ces espaces, ainsi que les responsables fédéraux. Les forces rebelles Karen, Shan, Arakan et Mon feraient la fête, avec leurs partisans. Malgré les affirmations selon lesquelles le gouvernement honore simplement ses engagements passés, il est clair que les rebelles ont réussi à forcer les militaires à quitter leur territoire. Il semble que la « pleine autonomie » ne soit qu'un moyen utilisé par le gouvernement pour minimiser le fait que ces zones sont effectivement indépendantes de l'autorité birmane. Le gouvernement birman espère pouvoir désormais concentrer ses efforts sur le renforcement de l'économie d'une Birmanie qui n'est plus en proie à la rébellion."
 Burma_KW.2.d:0 "Le Premier ministre birman a fermement condamné l'invasion nord-coréenne de la Corée du Sud. Il a souligné qu'il s'agissait d'un acte d'agression pure et simple de la part d'un régime qui cherche désespérément à imposer par la violence son système communiste à un État pacifique. Il a exprimé son soutien aux efforts internationaux visant à mettre fin aux combats et à protéger le peuple sud-coréen. Cette annonce est bien accueillie par les ambassades occidentales, qui tentent de renforcer le soutien international contre la Corée du Nord. La plupart des dirigeants politiques soutiennent cette déclaration, y voyant une indication claire que le Premier ministre ne tolérera pas la violence communiste et souhaite renforcer les liens avec l'Occident. Cependant, les dirigeants communistes et syndiqués birmans critiquent vivement le Premier ministre, le qualifiant d'outil de l'impérialisme occidental."
 NUF_1958.2.d:0 "Le gouvernement birman a récemment arrêté le chef d'état-major des forces armées pour avoir fomenté un coup d'État. Lors de son procès ultérieur, il a été accusé d'avoir organisé des escadrons de la mort et d'ingérence illégale dans la gestion de l'État. Dès sa condamnation, il fut rapidement exécuté. L'exécution a stupéfié l'armée birmane et laissé ses officiers anticommunistes sans chef. De nombreux officiers envisagent de prendre leur retraite et le Front national uni cherche à pourvoir des postes de direction avec ses loyalistes. Le général Ne Win était considéré par les analystes comme l'homme susceptible soit de mener un coup d'État contre le NUF, soit de préserver l'indépendance de l'armée de toute influence politique."
 NUF_1958.3.d:0 "Depuis la fin de la guerre civile chinoise, des milliers de forces du Kuomintang, organisées sous le nom d'Armée anticommuniste du salut national du Yunnan (YANSA), ont occupé le nord de la Birmanie, attendant l'ordre d'envahir la Chine. Ces forces ont longtemps résisté aux efforts birmans visant à restaurer son autorité dans la région, voire à désarmer ces soldats. Cependant, le nouveau gouvernement de gauche, dirigé par le parti Front national uni, a annoncé qu'il ne pouvait plus tolérer que les forces militaires étrangères sapent le pouvoir de l'État. L'armée birmane a reçu l'ordre d'éliminer YASA par tous les moyens nécessaires. La décision bénéficie du soutien de nombreuses personnes dans le pays. Un porte-parole de YASA a déclaré que le gouvernement birman est un larbin du communisme international et que ses forces n'arrêteront pas leur mission sacrée."
 Burma_Elect.2.d:0 "La population birmane doit voter lors des prochaines élections générales. Le parti de la résistance en temps de guerre, l'AFPFL, est l'un des grands favoris et ses dirigeants s'attendent à de gros résultats. Leur principal adversaire, le Front national uni, se montre également confiant. Durant la campagne électorale, elle a cherché à établir des relations avec les syndicats et les groupes paysans, en s'appuyant sur la base de soutien traditionnelle de l'AFPFL. Le NUF rassemble également des groupes de gauche et de droite, offrant une large coalition. Au cours de la campagne électorale, le NUF a accusé l'AFPFL de corruption, tandis que l'AFPFL affirme que le NUF reçoit des financements étrangers. C'est désormais au peuple birman de décider qui gouvernera."


