 #Japan
 JAP_Emperor_of_Japan: "Empereur du Japon"
 JAP_Emperor_of_Japan_desc: "Sa Majesté, Symbole de l'Unité du Peuple pour §C[JAP.GetNameWithFlag]§!:\n\n§HHirohito§!\n\n\n\n\n\n\n\n£JAP_Hirohito\n\n\n\n\n\n\n\n\n-------------------------------------\nDepuis le §Yincident mandchourien§! jusqu'à la §Yla guerre sino-japonaise§! et finalement le §Rle déclenchement de la guerre contre les États-Unis et la Grande-Bretagne§!, le Japon a avancé sur la voie de la guerre.\nEn vertu de la §YConstitution de l'Empire du Japon§!, l'empereur Hirohito §G§! détenait la §Yla plus haute autorité constitutionnelle§! en matière de prise de décision, mais dans la pratique, il §Yapprouvait largement les politiques déterminées par le gouvernement§!.\n\nAprès un §Rlong et dévastateur conflit§!, le §Y14 août 1945§!, §Gl'empereur Hirohito§! prit la §Gdécision sacrée§! d'accepter §GDéclaration de Potsdam§! et s'adressa à la nation par radio, annonçant la fin de la guerre §G§!.\nSa Majesté a ensuite rencontré le §Yle général Douglas MacArthur§!, une réunion qui allait §Yfaçonner de manière décisive l'avenir du Japon§!.\n\nDans la période d'après-guerre, l'empereur Hirohito §G§! a publié la déclaration §Yniant sa propre divinité§!.\nAvec l'entrée en vigueur de la Constitution japonaise §Y§!, l'empereur a été défini comme le symbole §Gde l'État du Japon et de l'unité du peuple japonais§!.\n§GL'empereur Hirohito§! a voyagé à travers le pays, §Gfaisant preuve de compassion envers les familles des soldats tombés au combat et des victimes de la guerre§!et §Gencourageant les citoyens luttant pour la reconstruction d'après-guerre§!, offrant au peuple japonais §Gl'espoir d'une nouvelle ère§!.\n\nDès son plus jeune âge, l'empereur Hirohito §G§! s'intéressait profondément aux insectes §Yet à la vie marine§!.\nDans ses temps libres, il a poursuivi §Ydes recherches spécialisées dans la classification des organismes et des plantes marines§!, laissant derrière lui §Gde nombreuses réalisations académiques§!.\n\n§RLe Tenno sans le Japon ne peut pas exister§!.\n§GTenno Heika Banzaï§!"
