 #Indonesia
 INO_President_of_the_Republic: "Président du [INO.GetName]"
 INO_President_of_the_Republic_desc: "Cabinet du Président des [INO.GetName]:\n\n§HIr. Soekarno§!\n\n\n\n\n\n\n\n£INO_Sukarno\n\n\n\n\n\n\n\n\n-------------------------------------\n§WCréé en vertu de la Constitution de 1945 par le BPUPKI, le Président de la République d'Indonésie a officiellement pris ses fonctions le 18 août 1945, un jour après la proclamation.\n\nSoekarno a été élu premier président par le PPKI aux côtés du vice-président Mohammad Hatta. Le 11 novembre 1945, le KNIP prend la décision de séparer la fonction de chef de l'État de celle de chef du gouvernement. Même si une nouvelle constitution n'avait pas encore été adoptée, l'Indonésie était désormais une démocratie parlementaire de facto, avec le président comme chef d'État cérémonial dont la fonction était de demander au Premier ministre, en tant que chef du gouvernement, de former un nouveau cabinet.§!"
 INO_Vice_Chairman_of_the_PDRI: "Vice-président du gouvernement d'urgence"
 INO_Vice_Chairman_of_the_PDRI_desc: "Bureau du vice-président du gouvernement d'urgence :\n\n§HSoesanto Tirtoprodjo§!\n\n\n\n\n\n\n\n£INO_Soesanto_Tirtoprodjo_49\n\n\n\n\n\n\n\n\n-------------------------------------\n§WPeu de temps après la deuxième agression néerlandaise, les Néerlandais, qui avaient conquis Yogyakarta, ont déclaré à tout le monde que la République d'Indonésie était morte parce que Soekarno, Hatta et Sjahrir avaient été arrêtés et exilés.\n\nC'est là que le PDRI a été mis en place. Plusieurs dirigeants de la République, qui se trouvaient à l'ouest de Sumatra, purent se réunir à Halaban et le 22 décembre 1948, ils tinrent une réunion. Bien qu'officiellement l'ordre du président Soekarno n'ait pas été reçu, en date du 22 décembre 1948, conformément au concept élaboré, il a été décidé lors de la réunion de former le gouvernement d'urgence de la République d'Indonésie.§!"
 INO_President_of_the_Republic_United_States_desc: "Cabinet du Président des [INO.GetName]:\n\n§HIr. Soekarno§!\n\n\n\n\n\n\n\n£INO_Sukarno_RUSI\n\n\n\n\n\n\n\n\n-------------------------------------\n§WCréé en vertu de la Constitution de 1945 par le BPUPKI, le Président de la République d'Indonésie a officiellement pris ses fonctions le 18 août 1945, un jour après la proclamation.\n\nSoekarno a été élu premier président par le PPKI aux côtés du vice-président Mohammad Hatta. Le 11 novembre 1945, le KNIP prend la décision de séparer la fonction de chef de l'État de celle de chef du gouvernement. Même si une nouvelle constitution n'avait pas encore été adoptée, l'Indonésie était désormais une démocratie parlementaire de facto, avec le président comme chef d'État cérémonial dont la fonction était de demander au Premier ministre, en tant que chef du gouvernement, de former un nouveau cabinet.§!"
 INO_President_of_the_Republic_1949_desc: "Cabinet du Président des [INO.GetName]:\n\n§HIr. Soekarno§!\n\n\n\n\n\n\n\n£INO_Sukarno_40s\n\n\n\n\n\n\n\n\n-------------------------------------\n§WCréé en vertu de la Constitution de 1945 par le BPUPKI, le Président de la République d'Indonésie a officiellement pris ses fonctions le 18 août 1945, un jour après la proclamation.\n\nSoekarno a été élu premier président par le PPKI aux côtés du vice-président Mohammad Hatta. Le 11 novembre 1945, le KNIP prend la décision de séparer la fonction de chef de l'État de celle de chef du gouvernement. Même si une nouvelle constitution n'avait pas encore été adoptée, l'Indonésie était désormais une démocratie parlementaire de facto, avec le président comme chef d'État cérémonial dont la fonction était de demander au Premier ministre, en tant que chef du gouvernement, de former un nouveau cabinet.§!"
 INO_President_of_the_Republic_Vacant_desc: "Cabinet du Président des [INO.GetName]:\n\n§HPoste vacant§!\n\n\n\n\n\n\n\n£INO_President_Vacant\n\n\n\n\n\n\n\n\n-------------------------------------\n§WCréé en vertu de la Constitution de 1945 par le BPUPKI, le Président de la République d'Indonésie a officiellement pris ses fonctions le 18 août 1945, un jour après la proclamation.\n\nSuite à la tentative infructueuse du gouvernement de reprendre le contrôle des Moluques, une région cruciale pour l'intégrité territoriale de l'Indonésie, le président Sukarno a pris la décision capitale de démissionner de son poste. Cette démission intervient dans un contexte de tensions croissantes et d'instabilité politique dans le pays, laissant le poste présidentiel vacant.§!"
 INO_President_of_the_Republic_2: "Cabinet du Président des [INO.GetName]:\n\n§HDatuk Assaat Mudo§!\n\n\n\n\n\n\n\n£INO_Datuk_Assaat_Mudo\n\n\n\n\n\n\n\n\n-------------------------------------\n§WCréé en vertu de la Constitution de 1945 par le BPUPKI, le Président de la République d'Indonésie a officiellement pris ses fonctions le 18 août 1945, un jour après la proclamation.\n\nSoekarno a été élu premier président par le PPKI aux côtés du vice-président Mohammad Hatta. Le 11 novembre 1945, le KNIP prend la décision de séparer la fonction de chef de l'État de celle de chef du gouvernement. Même si une nouvelle constitution n'avait pas encore été adoptée, l'Indonésie était désormais une démocratie parlementaire de facto, avec le président comme chef d'État cérémonial dont la fonction était de demander au Premier ministre, en tant que chef du gouvernement, de former un nouveau cabinet.§!"
