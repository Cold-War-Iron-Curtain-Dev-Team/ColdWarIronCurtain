 MOR_RIF_State_1_TT:0 "La faction politique dominante au sein du Rif est le Comité de libération du Maghreb arabe\nLe soutien public est actuellement à [?290.republican_influence_percentage|%G0]\n\n§CDirigé par le célèbre combattant anticolonial et vétéran de la guerre du Rift Abd el-Karim, le Comité de libération du Maghreb arabe a établi son bureau principal au Caire. L'organisation adhère au nationalisme arabe et prône l'unification du Maghreb. Le groupe est populaire parmi les jeunes intellectuels urbains et ceux qui prônent la résistance armée aux puissances coloniales. Ils sont particulièrement populaires dans les zones contrôlées ou précédemment influencées par l'Espagne. Leurs partisans s'opposent aux Arabes et aux Berbères locaux qu'ils considèrent comme réactionnaires ou collaborationnistes, comme les dirigeants ruraux traditionnels et le gouvernement royal. Pour que le groupe puisse se développer, il doit non seulement défier les puissances coloniales, mais aussi convaincre les peuples d'adopter le nouveau nationalisme panarabe qui déferle sur le monde arabe.§!"
