 MOR_MOR_State_1_TT:0 "La faction politique dominante au sein du Rif est l'Istiqal\nLe soutien public est actuellement à [?290.istqal_influence_percentage|%G0]\n\n§CDans le discours de Tanger, le sultan Mohammed V a explicitement affirmé son soutien à l'indépendance du Maroc. Il travaille en étroite collaboration avec Allal al-Fassi et son parti nationaliste Istiqlal. La fête est populaire parmi les Arabes et les Berbères urbains. La faction bénéficie également du soutien des dirigeants marocains traditionnels qui ont juré fidélité à la famille royale depuis de nombreuses générations. Fort de ses liens locaux forts et de sa légitimité internationale, le sultan doit décider comment équilibrer son approche envers les autres factions marocaines et les régimes coloniaux. Une démarche trop brusque pour l'indépendance pourrait avoir des conséquences négatives, mais rester inactifs pendant ce moment de ferveur anticoloniale pourrait les laisser lutter pour contrôler le destin de la nation marocaine.§!"
