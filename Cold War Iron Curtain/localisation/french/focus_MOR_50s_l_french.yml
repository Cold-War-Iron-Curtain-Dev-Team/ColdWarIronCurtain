 morrocco.4.t:0 "Tentative d'assassinat contre le Prince"
 morrocco.4.d:0 "Les médias ont fait état d'une tentative d'assassinat rapprochée du prince héritier Hassan II alors qu'il prononçait un discours à Rabat cet après-midi. Alors qu'ils discutaient des liens avec l'Occident, deux hommes de la foule ont lancé trois cocktails Molotov sur le prince et ses agents de sécurité. Le premier Molotov a complètement raté, ce qui a donné l'alerte aux deux arrivants. L'un d'eux a touché la sécurité tandis que le troisième n'a même jamais été lancé alors que la foule envahissait rapidement les hommes. Hassan II a terminé son discours avant d'être rapidement escorté vers un lieu sûr."
 morrocco.4.a:0 "Louez Allah. Le Prince est en sécurité !"
 morrocco.4.b:0 "Une semaine de deuil national pour notre prince bien-aimé..."
 morocco_news.1.t.his:0 "[GetNewspaperHeader]Le prince héritier Hassan II survit à l'attaque"
 morocco_news.1.t.alt:0 "[GetNewspaperHeader]Le prince héritier Hassan II assassiné"
 morocco_news.1.d.his:0 "Les médias ont fait état d'une tentative d'assassinat rapprochée du prince héritier Hassan II alors qu'il prononçait un discours à Rabat cet après-midi. Alors qu'ils discutaient des liens avec l'Occident, deux hommes de la foule ont lancé trois cocktails Molotov sur le prince et ses agents de sécurité. Le premier Molotov a complètement raté, ce qui a donné l'alerte aux deux arrivants. L'un d'eux a touché la sécurité tandis que le troisième n'a même jamais été lancé alors que la foule envahissait rapidement les hommes. Hassan II a terminé son discours avant d'être rapidement escorté vers un lieu sûr. Les deux hommes et trois autres personnes ont été retrouvés et arrêtés.\n Le prince héritier Hassan II n'a pas tardé à remercier les gardes et ses partisans présents dans la foule pour lui avoir sauvé la vie, promettant que cela n'empêchera pas les événements futurs. Ce qui aurait pu se terminer par un horrible meurtre n'a fait aucun blessé et l'opposition au régime a perdu de son influence."
 morocco_news.1.d.alt:0 "La nouvelle dévastatrice de la mort du prince qui s'est répandue à travers le Maroc a été officiellement confirmée ce soir par les autorités de l'État. En raison de la santé déclinante de son père, le prince héritier Hassan II a commencé à reprendre bon nombre des fonctions de son père à la fin de la décennie, ce qui l'a amené à faire davantage d'apparitions publiques. Une telle apparition dans la ville de Rabat serait sa dernière alors qu'il s'adressait à la nation sur l'amélioration des relations avec les États-Unis et l'Occident. Après avoir appelé à des relations amicales avec Israël, trois cocktails Molotov seraient lancés contre Hassan II et sa sécurité. Les gardes de première ligne seraient choqués par le premier Molotov, laissant un espace d'un second pour frapper Hassan directement à la tête, suivi d'un troisième à la poitrine. Le prince prendrait feu et s'effondrerait, se cognant la tête pendant la chute. Il serait rapidement éteint et transporté d'urgence pour un traitement médical alors que la loi du maréchal était appliquée dans la ville frénétique. Cinq terroristes présumés ont été capturés au cours de la première heure.\n Avec la mort confirmée de Hassan II, le sort du Maroc est à la croisée des chemins. Alors que le roi actuel tombe malade, le besoin d'un héritier de remplacement devient urgent. Le prochain candidat à la succession est le frère de Hassan II, le prince Moulay Abdallah, qui a montré peu d'intérêt pour la politique. Sans le fort Hassan II pour remplacer Mohammad V, cela pourrait annoncer un avenir sombre pour la dynastie Alaouite."
 morocco_news.1.a:0 "Louez Allah. Le Prince est en sécurité !"
 morocco_news.1.b:0 "Une semaine de deuil national pour notre prince bien-aimé..."
 casablanca.1.t:0 "[GetNewspaperHeader]Conférence du Groupe de Casablanca"
 casablanca.1.d:0 "Dans la vaste ville portuaire de Casablanca, au coeur des déserts arides du Maroc, les dirigeants de divers pays d'Afrique du Nord, comme l'Algérie, l'Égypte, le Ghana, le Maroc et d'autres, ont décidé de mettre fin au conflit et à l'animosité entre leurs nations et de créer le « Groupe de Casablanca ». Formée comme une association informelle de nations africaines, son seul objectif était d'unir l'Afrique sous une seule bannière, le panafricanisme étant l'un des principaux piliers de ses valeurs pour une Afrique nouvelle et unie. Alors que le Groupe de Casablanca est largement considéré comme une organisation bienveillante, les critiques soulignent qu'elle est principalement composée de dirigeants radicaux de gauche et de leurs partis politiques respectifs, avec des points de vue critiques à l'égard de la domination occidentale en Afrique. Néanmoins, les observateurs estiment que l'organisation pourrait apporter une paix et une prospérité durables dans l'un des continents les plus violents et les plus pauvres de la planète, mais il est trop tôt pour en être sûrs."
 casablanca.1.a:0 "Un pas en faveur de l'Union africaine"
 morocco.5.a:0 "L'UNFP a dépassé les limites !"
 morocco.5.d:0 "Suite à la récente attaque contre le prince héritier, 5 suspects ont été arrêtés par la police. Après des échanges tendus avec la police, ils ont été placés en garde à vue et de nouveaux interrogatoires ont commencé. Après une enquête criminelle, quatre des cinq suspects disposaient de preuves concrètes contre eux ainsi que d'un lien viable avec le Parti de l'Union nationale des forces populaires (UNFP) grâce à un contrat trouvé dans l'appartement d'un des hommes soi-disant originaires de Fqih Basri, commandant l'attaque.\nCes éléments de preuve ont choqué le gouvernement, qui ne sait pas trop comment réagir. Les décisions ont été laissées au prince héritier Hassan II qui n'a pris aucune décision pour l'instant. "
 morocco.5.t:0 "[GetNewspaperHeader]Les attaquants présumés de l'UNFP arrêtés"
 morocco.6.t:0 "[GetNewspaperHeader]Amnistie accordée aux agresseurs"
 morocco.6.a:0 "Hassan II dirigera le Maroc avec droiture !"
 morocco.6.d:0 "Suite à l'attaque contre le prince héritier Hassan II, quatre personnes ont été capturées et reconnues coupables de l'attaque avec la preuve que des membres radicaux de l'UNFP avaient orchestré la tentative d'assassinat. Dans une démonstration choquante de pardon, Hassan II a accordé l'amnistie à toutes les personnes impliquées.\nLa générosité du prince s'est accompagnée d'un grand soutien du public, le considérant comme un futur leader juste. De nombreuses élites s'inquiètent du fait que l'on n'ait pas fait assez pour punir l'opposition. "
 morocco.9.t:0 "[GetNewspaperHeader]Le président Barka survit au raid royaliste"
 morocco.9.d:0 "L'établissement d'élections libres et d'un rôle présidentiel ferait l'objet d'un examen minutieux, car de nombreuses forces royalistes qualifiaient cette décision d'insulte directe à l'ancienne puissante dynastie alaouite, accusant Ben Barka de la « mort du Maroc » et du « mode de vie berbère ». Un groupe composé d'élites royalistes qui ont perdu bon nombre de leurs postes gouvernementaux a orchestré une tentative visant à tuer Barka et à rétablir un contrôle autoritaire. À partir de 22h00, 45 hommes armés prendraient d'assaut le palais présidentiel, soutenus par 5 AFVS devenus voyous par l'armée. Le président, sa famille et ses forces de sécurité ont réussi à tenir le coup jusqu'à 23h00, lorsque les militaires ont réussi à arriver à temps pour vaincre les assaillants et rétablir l'ordre.\nAlors que le président et sa famille restent indemnes, 31 hommes armés et 4 agents de sécurité ont été tués ainsi que 4 AFVS détruits. Une enquête a été ouverte sur cette affaire pour déterminer qui était impliqué et dans quelle mesure. À l'heure actuelle, la nation pleure les forces de sécurité mortes pour protéger la démocratie."
 morocco.9.a:0 "Qui d'autre pourrait être impliqué ?"
 morocco.12.t:0 "[GetNewspaperHeader]Les Coupers monarchistes condamnés à mort"
 morocco.12.d:0 "À la suite de la tentative d'assassinat du président Ben Barka, plus de 200 personnes ont été reconnues coupables de coordination et de participation à des activités de haute trahison, de meurtre et de tentative de meurtre et ont été condamnées à la peine de mort. Cette nouvelle choquante a été officiellement annoncée par la télévision d'État, qui a enregistré avec intensité la fusillade. De nombreux prisonniers restent dans le couloir de la mort tandis que plus de 30 ont été exécutés par un peloton d'exécution. "
 morocco.11.t:0 "[GetNewspaperHeader]Communistes exilés"
 morocco.11.d:0 "Suite à l'attaque, un procès a eu lieu contre toutes les personnes impliquées dans le complot d'assassinat contre Ben Barka. Après un examen attentif des preuves trouvées, le tireur direct a été condamné à la prison à vie tandis que les cinq autres ont été exilés en Union soviétique. Les tensions entre le Maroc et l'Union soviétique n'ont fait que s'accentuer en raison de cette situation, marquant la fin d'une histoire de relations positives soviéto-marocaines."
 morocco.11.a:0 "La démocratie ne mourra pas !"
 morocco.12.a:0 "A bas les traîtres !"
 morocco.13.t:0 "[GetNewspaperHeader]Terreur au Maroc !"
 morocco.13.d:0 "Alors qu'il se rendait à son travail plus tôt dans la journée, le Résident général Augustin Guillaume du Maroc a été assassiné par une voiture piégée. Lorsque le Résident Général monta dans sa voiture et que son chauffeur la démarra, la Citroën Traction Avant prit feu, les tuant tous les deux et faisant chanter les feuilles de la flore voisine. Samir Toufiq, un nationaliste marocain jusqu'alors inconnu, a revendiqué la responsabilité de cette attaque soudaine, appelant le peuple marocain à se soulever contre ses oppresseurs français lors de son arrestation cet après-midi. L'appel à l'action de Toufiq a touché de nombreux Marocains, qui défilent ce soir dans les rues de Rabat pour protester contre le gouvernement impérialiste français. Bien que cet événement ait été particulièrement violent, il a incité le peuple marocain à agir pour l'indépendance."
 morocco.13.a:0 "Vive la révolution !"
 morocco.13.b:0 "Augmentez notre présence là-bas."
 morocco.13.c:0 "Cher Dieu"
 morocco.10.t:0 "[GetNewspaperHeader]Ben Barka survit à une attaque communiste"
 morocco.10.a:0 "Barka a sûrement esquivé une balle cette fois-ci..."
 morocco.10.d:0 "Le président Ben Barka participait à un rassemblement public lorsque trois coups de feu ont été tirés sur lui depuis la foule. Tous les trois ont raté leur coup, l'un d'entre eux s'étant blessé au bras. Bien que sous le choc, le rassemblement s'est poursuivi comme si de rien n'était tandis que la sécurité traquait rapidement l'agresseur. En traquant rapidement l'homme, ils ont trouvé de nombreuses lettres échangées entre l'ambassadeur soviétique à Rabat discutant de l'assassinat. L'homme a été rapidement arrêté et plus de 6 autres complices ont été retrouvés après une enquête plus approfondie."
 Maghreb.1.t:0 "Sensibilisation maghrébine"
 Maghreb.1.d:0 "Les hommes politiques du Maghreb ont été invités à Rabat pour discuter d'une nouvelle floraison de liens maghrébins qui, dans la plupart des cas, ont été considérés comme hostiles. L'Union du Maghreb arabe proposée permettra de renforcer les relations bilatérales, tant en termes économiques que politiques, entraînant ainsi des relations plus étroites et des accords commerciaux. Ce projet proposé sera pour le moins difficile, car il rassemblera des nations connues pour être en désaccord. Alors qu'il est en phase bêta, le Maroc promet un niveau accru de prospérité et la paix entrera dans la région de l'Afrique du Nord si l'Union est conclue."
 Maghreb.1.a:0 "Accepter"
 Maghreb.1.b:0 "Refuser"

