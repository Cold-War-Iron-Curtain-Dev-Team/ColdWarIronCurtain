 MOR_SPR_State_1_TT:0 "La faction politique dominante au sein du Rif est l'État espagnol\nLe soutien public est actuellement à [?290.spanish_influence_percentage|%G0]\n\n§CLe protectorat espagnol du Maroc est confronté à une montée des troubles nationalistes au sein de la population, en particulier parmi les musulmans marocains urbains. Aux côtés de certaines populations de colons, les Espagnols peuvent faire appel à la communauté juive marocaine minoritaire. Comme les Français, les Espagnols ont établi des liens étroits avec les communautés rurales marocaines grâce au recrutement militaire. Ces soldats se sont montrés extrêmement loyaux et efficaces pendant la guerre civile espagnole. L'Espagne peut compter sur la loyauté de ces soldats pour soutenir le maintien de la domination espagnole afin de préserver leur relative indépendance et leur soutien monétaire.§!"
