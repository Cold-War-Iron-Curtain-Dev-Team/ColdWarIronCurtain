 morrocan_faction_decisions:0 "La partisanerie marocaine"
 morrocan_faction_decisions_desc:0 ""
 morrocan_faction_decisions_desc_alt:0 "Population européenne actuelle au Maroc : [?MOR.French_Population]\nPopulation juive actuelle au Maroc : [?MOR.Jewish_Population]\n§CLe Protectorat au Maroc :\nLa France a établi un protectorat sur le Maroc en 1912 avec le Traité de Fès. Le protectorat français a conduit à de nouveaux projets de développement et à des progrès en matière d'éducation. Les soldats marocains ont joué un rôle majeur dans les deux guerres mondiales pour l'État français. Cependant, l'occupation française a également déclenché une série de révoltes et de troubles. Les partis nationalistes marocains ont commencé à émerger dans les années 1930, lançant un mouvement non-violent pour l'indépendance. Les espoirs d'indépendance après la Seconde Guerre mondiale ont été anéantis, ce qui a conduit à une violence croissante de la part des militants nationalistes. Le discours de Tanger du sultan Muhammad V a appelé à la décolonisation et à l'indépendance. La suite a été marquée par plusieurs massacres perpétrés par les forces françaises à Casablanca. Les tensions sont vives alors que les Marocains considèrent de plus en plus la résistance armée comme le seul moyen d'avancer. Le général Alphonse Juin doit décider comment maintenir le contrôle français malgré la montée des troubles nationalistes ou préparer une sortie française digne de la région.\n\nLa domination espagnole au Maroc a commencé au début du XXe siècle, lorsque l'Espagne et la France ont divisé le pays en sphères d'influence distinctes. Les années 1920 ont vu l'Espagne impliquée dans la guerre du Rif, qu'elle a gagnée seulement après avoir subi de lourdes pertes. La guerre civile espagnole a vu des soldats marocains servir loyalement le dictateur espagnol Francisco Franco. Après sa victoire, Franco a récompensé le territoire par une politique libérale. Des partis nationalistes marocains ont émergé et ont commencé à faire pression publiquement pour l'indépendance. Le discours de Tanger du sultan Muhammad V a appelé à la décolonisation et à l'indépendance. Bien qu'indirectement axés sur les Français, de nombreux Marocains du territoire espagnol s'en sont également inspirés, suscitant davantage de troubles nationalistes. Le général Rafael Garcia Valino doit décider comment mobiliser le soutien local pour maintenir le contrôle espagnol face à la montée des troubles nationalistes ou préparer une sortie espagnole digne.§!"
 MOR_FACTION_1:0 "§GMarooon - Le Comité de Libération du Maghreb Arabe§!"
 MOR_FACTION_2:0 "§HViolet - Les pachas locaux§!"
 MOR_FACTION_3:0 "§BBleu - Le protectorat français§!"
 MOR_FACTION_4:0 "§YJaune - Le protectorat espagnol§!"
 MOR_FACTION_5:0 "§RRouge - La faction Istqal et Muhammad V§!"

 MOR_JEWISH_TT_DESC:0 "§CLa communauté juive marocaine est installée dans la région depuis de nombreuses générations. L'avènement du colonialisme français a vu de nombreuses familles juives profiter des institutions européennes, notamment des écoles. Le sultan entretenait traditionnellement des liens positifs avec la communauté juive, l'aidant notamment pendant la Seconde Guerre mondiale. Cependant, l'émergence d'Israël et le retour de la surveillance coloniale française ont tendu les relations. Les nationalistes arabes considèrent de plus en plus Israël comme une menace majeure et voient les Juifs marocains comme une cinquième colonne potentielle. Ils préconisent que le gouvernement contrôle plus durement la communauté juive. Parmi les militants anticoloniaux marocains, ils considèrent la communauté juive comme une proche alliée des Français et une menace pour l'indépendance du Maroc. Pour la communauté juive, les Français sont de plus en plus considérés comme leurs principaux protecteurs et beaucoup considèrent désormais la migration comme le seul moyen de leur protection. Le gouvernement doit décider comment calmer l'anxiété des Juifs marocains ou soutenir les politiques prônées par les nationalistes arabes et les défenseurs anticoloniaux.§!"

 MOR_FACTION_1_DESC:0 "Dirigé par le célèbre combattant anticolonial et vétéran de la guerre du Rift Abd el-Karim, le Comité de libération du Maghreb arabe a établi son bureau principal au Caire. L'organisation adhère au nationalisme arabe et prône l'unification du Maghreb. Le groupe est populaire parmi les jeunes intellectuels urbains et ceux qui prônent la résistance armée aux puissances coloniales. Ils sont particulièrement populaires dans les zones contrôlées ou précédemment influencées par l'Espagne. Leurs partisans s'opposent aux Arabes et aux Berbères locaux qu'ils considèrent comme réactionnaires ou collaborationnistes, comme les dirigeants ruraux traditionnels et le gouvernement royal. Pour que le groupe puisse se développer, il doit non seulement défier les puissances coloniales, mais aussi convaincre les peuples d'adopter le nouveau nationalisme panarabe qui déferle sur le monde arabe."
 MOR_FACTION_2_DESC:0 "Thami El Glaoui est à la tête des pachas ruraux qui résistent de plus en plus aux partis nationalistes. Pendant des décennies, ces pachas ont prospéré sous la domination coloniale française. Les Français ont assuré autonomie et protection, permettant aux pachas de consolider leur pouvoir sur les communautés rurales et d'accumuler des richesses personnelles. Mobiliser leurs partisans leur permettra de conserver leur autonomie et d'empêcher l'influence nationaliste et royale de s'étendre à leurs régions. Cependant, alors que la France et l'Espagne envisagent de nouvelles réformes, elles risquent de s'aliéner les pachas. La situation évoluant, Thami El Glaoui doit réfléchir à la manière de maintenir son autonomie, en soutenant l'une des autres factions, voire en s'emparant du pouvoir pour préserver celui des pachas."
 MOR_FACTION_3_DESC:0 "Le Protectorat français du Maroc doit faire face à une agitation croissante au sein de la population marocaine. La ferveur nationaliste gagne le peuple, en particulier parmi les Arabes urbains et de la classe ouvrière. Les Français peuvent cependant compter sur le soutien des colons et des petites communautés juives présentes au sein du protectorat. Au cours des décennies précédentes, le gouvernement a établi des liens étroits entre certaines communautés rurales grâce au recrutement militaire. Ces soldats ont joué un rôle central dans les récents conflits coloniaux et militaires français. On peut compter sur ces hommes pour rester fidèles à la préservation de la domination française. Ils souhaitent conserver les bénéfices sociaux et économiques de leur fidélité."
 MOR_FACTION_4_DESC:0 "Le protectorat espagnol du Maroc est confronté à une montée des troubles nationalistes au sein de la population, en particulier parmi les musulmans marocains urbains. Aux côtés de certaines populations de colons, les Espagnols peuvent faire appel à la communauté juive marocaine minoritaire. Comme les Français, les Espagnols ont établi des liens étroits avec les communautés rurales marocaines grâce au recrutement militaire. Ces soldats se sont montrés extrêmement loyaux et efficaces pendant la guerre civile espagnole. L'Espagne peut compter sur la loyauté de ces soldats pour soutenir le maintien de la domination espagnole afin de préserver leur relative indépendance et leur soutien monétaire."
 MOR_FACTION_5_DESC:0 "Dans le discours de Tanger, le sultan Mohammed V a explicitement affirmé son soutien à l'indépendance du Maroc. Il travaille en étroite collaboration avec Allal al-Fassi et son parti nationaliste Istiqlal. La fête est populaire parmi les Arabes et les Berbères urbains. La faction bénéficie également du soutien des dirigeants marocains traditionnels qui ont juré fidélité à la famille royale depuis de nombreuses générations. Fort de ses liens locaux forts et de sa légitimité internationale, le sultan doit décider comment équilibrer son approche envers les autres factions marocaines et les régimes coloniaux. Une démarche trop brusque pour l'indépendance pourrait avoir des conséquences négatives, mais rester inactifs pendant ce moment de ferveur anticoloniale pourrait les laisser lutter pour contrôler le destin de la nation marocaine."

