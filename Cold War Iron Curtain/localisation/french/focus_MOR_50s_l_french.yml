 morrocco.1.t:0 "Mort de Mohammed V"
 morrocco.1.a:0 "Hassan II"
 morrocco.1.b:0 "Abdallah III"
 morrocco.1.d:0 "Marquant un triste jour dans les annales de la dynastie alaouite, aujourd'hui, le sultan Mohammed Cinq, paix sur lui, est décédé, les complications de son opération chirurgicale en cours devenant trop difficiles à supporter pour lui ; laissant la place à son fils aîné, Hassan II, pour accéder désormais au trône marocain. Des milliers de personnes faisaient la queue aux portes du Palais Royal, attendant avec impatience que le corps du roi soit transporté dans sa tombe, au son des ballades et de l'odeur de l'encens qui marquent la fin d'une époque. Le souvenir de l'indépendance semble n'avoir jamais été aussi frais. Et les rumeurs d'assassinat se sont propagées comme une traînée de poudre."
