 MOR_NOB_State_1_TT:0 "La faction politique dominante au sein du Rif est celle des pachas locaux\nLe soutien public est actuellement à [?290.nobility_influence_percentage|%G0]\n\n§CThami El Glaoui est à la tête des pachas ruraux qui résistent de plus en plus aux partis nationalistes. Pendant des décennies, ces pachas ont prospéré sous la domination coloniale française. Les Français ont assuré autonomie et protection, permettant aux pachas de consolider leur pouvoir sur les communautés rurales et d'accumuler des richesses personnelles. Mobiliser leurs partisans leur permettra de conserver leur autonomie et d'empêcher l'influence nationaliste et royale de s'étendre à leurs régions. Cependant, alors que la France et l'Espagne envisagent de nouvelles réformes, elles risquent de s'aliéner les pachas. La situation évoluant, Thami El Glaoui doit réfléchir à la manière de maintenir son autonomie, en soutenant l'une des autres factions, voire en s'emparant du pouvoir pour préserver celui des pachas.§!"
