 aliyah_mission_TT:0 "Environ [?ROOT.aliyah_monthly_percentage|%R5] de la population juive émigrera vers Israël, ce qui entravera encore davantage notre développement économique."
 mor_aliyah:0 "Aliyah"
 mor_aliyah_desc:0 "La communauté juive marocaine est installée dans la région depuis de nombreuses générations. L'avènement du colonialisme français a vu de nombreuses familles juives profiter des institutions européennes, notamment des écoles. Le sultan entretenait traditionnellement des liens positifs avec la communauté juive, l'aidant notamment pendant la Seconde Guerre mondiale. Cependant, l'émergence d'Israël et le retour de la surveillance coloniale française ont tendu les relations. Les nationalistes arabes considèrent de plus en plus Israël comme une menace majeure et voient les Juifs marocains comme une cinquième colonne potentielle. Ils préconisent que le gouvernement contrôle plus durement la communauté juive. Parmi les militants anticoloniaux marocains, ils considèrent la communauté juive comme une proche alliée des Français et une menace pour l'indépendance du Maroc. Pour la communauté juive, les Français sont de plus en plus considérés comme leurs principaux protecteurs et beaucoup considèrent désormais la migration comme le seul moyen de leur protection. Le gouvernement doit décider comment calmer l'anxiété des Juifs marocains ou soutenir les politiques prônées par les nationalistes arabes et les défenseurs anticoloniaux."


