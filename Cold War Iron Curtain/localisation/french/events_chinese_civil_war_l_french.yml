 #Armistice
 chinapeace.1.t:0 "Les États-Unis demandent l'armistice"
 chinapeace.1.d:0 "La guerre civile en Chine ne s'est pas bien déroulée pour nous. Les forces communistes ont beaucoup progressé et la nation est en train d'être détruite à l'instant même. Aujourd'hui, nous avons reçu un message du gouvernement américain proposant un armistice égal sous sa supervision et celle de l'ONU. Nous serons protégés des menaces étrangères par les États-Unis tant que l'armistice sera en vigueur. Nos ennemis ont également reçu cette offre."
 chinapeace.1.a:0 "Acceptez, c'est le meilleur pour nous et le meilleur pour le peuple chinois."
 chinapeace.1.b:0 "Non! Nous nous battrons jusqu'au bout, même si nous devons fuir à Taiwan !"
 chinapeace.2.t:0 "Les États-Unis demandent l'armistice"
 chinapeace.2.d:0 "Cela a été un dur combat. Nos forces se battent brutalement pour le contrôle de la Chine et des millions de soldats et de civils meurent. Aujourd'hui, nous avons reçu un message du gouvernement américain proposant un armistice égal sous sa supervision et celle de l'ONU. Nous serons protégés des menaces étrangères par les États-Unis tant que l'armistice sera en vigueur. Nos ennemis ont également reçu cette offre."
 chinapeace.2.a:0 "Acceptez, c'est le meilleur pour nous et le meilleur pour le peuple chinois."
 chinapeace.2.b:0 "Non! Chiang et ses chiens seront pendus !"
 chinapeace.3.t:0 "Armistice de la guerre civile chinoise"
 chinapeace.3.d:0 "Nos efforts ont été couronnés de succès. La République de Chine et la RPC ont accepté le cessez-le-feu. Nous devons maintenant parvenir à une solution politique."
 chinapeace.3.a:0 "Nous l'avons fait !"
 chinapeace_prc_accept:0 "La RPC accepte l'armistice avec la Chine"
 chinapeace_roc_accept:0 "La République de Chine accepte l'armistice avec la Chine"
 chinapeace_prc_deny:0 "La RPC refuse l'armistice avec la Chine"
 chinapeace_roc_deny:0 "La République de Chine refuse l'armistice avec la Chine"
 marshall_mission:0 "Mission Marshall"
 CCW_Over:0 "La guerre civile chinoise est terminée"
 ROC_taiwan:0 "La République de Chine s'est enfuie à Taiwan"
 
 chinese_civil_war.1.t:0 "Fin de la Ma Clique"
 chinese_civil_war.1.d:0 "Nous avons vaincu les forces de Ma Bufang et capturé le Qinghai. Cela signifie que les lignes d'approvisionnement de la République de Chine vers le Xinjiang sont coupées et que leur administration dans la province s'effondre rapidement. Les forces Ma restantes font défection vers nous."
 chinese_civil_war.1.a:0 "La fin de Chiang est proche."
 chinese_civil_war.2.t:0 "[GetNewspaperHeader]Fin de la Ma Clique"
 chinese_civil_war.2.d:0 "Le Parti communiste chinois a occupé le Qinghai et les forces de Ma Bufang se sont rendues. Il s'agit d'un coup dur porté à la République de Chine, car cela signifie que son pouvoir au Xinjiang s'est effondré. D'autant plus que les forces restantes de Ma Bufang rejoignent désormais le PCC."
 chinese_civil_war.2.a:0 "Reposez en paix!"

 Student_Exchange_Program:0 "Programme d'échange étudiant"

 USA_ETR.0.t:0 "La situation au Turkestan oriental"
 USA_ETR.0.d:0 "L'effondrement de l'autorité centrale au Turkestan oriental a dégénéré en une guerre civile sanglante. Avec la victoire de la République de Chine sur le continent, l'attention s'est portée sur le sort de sa frontière extrême occidentale. La région est désormais divisée entre deux factions farouchement opposées : les forces communistes dirigées par Abdulkerim Abbas, armées et financées par l'Union soviétique, et une coalition anticommuniste dirigée par Masud Sabri, cherchant à maintenir l'alignement de la province sur la République chinoise et sur le bloc antisoviétique plus large. Les affrontements font rage dans les oasis et la steppe, les conseillers soviétiques agissant ouvertement aux côtés des communistes. Le conflit menace de déstabiliser les frontières de l'Asie centrale soviétique et des provinces contrôlées par la République de Chine à l'est. À Washington, les décideurs politiques considèrent les combats à la fois comme une lutte locale pour l'autodétermination des Ouïghours et comme un autre front dans la lutte mondiale entre Moscou et le monde libre, soulevant la question de savoir si les États-Unis devraient s'impliquer plus directement dans la région."
 USA_ETR.0.a:0 "Nous devons considérer nos options..."
 
 USA_ETR.1.t:0 "Le président [USA.GetLeader] suggère un siège aux Ouïghours à l'ONU"
 USA_ETR.1.d:0 "À la suite du conflit du Turkestan oriental, le président [USA.GetLeader] a évoqué la possibilité d'accorder aux Ouïghours une représentation aux Nations Unies. S'exprimant en solidarité avec la République de Chine, le président a présenté la proposition à la fois comme une obligation morale et une nécessité stratégique. En accordant un siège aux dirigeants ouïghours, Washington espère contrer les discours soviétiques décrivant le mouvement communiste d'Abdulkerim Abbas comme la seule voix du peuple de la région. Du point de vue de la République du Congo, cette décision pourrait renforcer la légitimité de Masud Sabri au niveau international, en attirant une aide humanitaire, une reconnaissance diplomatique et peut-être une assistance militaire. Cependant, la proposition touche également à un sujet délicat : la reconnaissance formelle d'un siège ouïghour pourrait être interprétée comme une violation de l'intégrité territoriale chinoise, sapant ainsi l'affirmation de longue date de la République de Chine selon laquelle le Turkestan oriental reste une partie inséparable de la Chine. Les critiques préviennent que cela pourrait créer un dangereux précédent pour les mouvements séparatistes ailleurs, même si les partisans soutiennent que l'urgence de contrer l'influence soviétique l'emporte sur ces préoccupations."

 USA_CCWr.1.t:0 "La guerre civile chinoise et le lobby chinois"
 USA_CCWr.1.d:0 "Alors que la guerre civile chinoise approche d'une phase décisive, les nationalistes se préparent à la bataille imminente pour Shanghai, tandis que les forces communistes consolident leurs gains dans le nord et le centre de la Chine. À Washington, le lobby chinois - une coalition de politiciens, d'hommes d'affaires et de militants sympathisants de la République de Chine - se fait de plus en plus entendre. Ils exigent un soutien américain plus fort pour Chiang Kai-shek, invoquant l'importance stratégique d'une Chine unie et anticommuniste. Les critiques au sein de l'administration préviennent qu'une implication accrue risque de s'enliser dans un conflit coûteux et impossible à gagner, d'autant plus que l'appétit du public pour une autre guerre asiatique est faible après des années dans le Pacifique. Le Département d'État reste divisé, pesant la valeur géopolitique d'un soutien total et les dangers d'une extension excessive. Alors que les événements en Chine évoluent rapidement, le président doit décider s'il doit écouter les appels du lobby ou maintenir une distance prudente."
 USA_CCWr.1.a:0 "Nous devons faire un choix final..."
 
 USA_CCWr.2.t:0 "Réaction du lobby chinois"
 USA_CCWr.2.d:0 "Notre récente réticence à augmenter l'aide aux forces de Chiang Kai-shek a déclenché une réaction de colère de la part du lobby chinois. Des accusations de trahison sont exprimées au Congrès et dans la presse, certains affirmant que la position de l'administration garantit pratiquement une victoire communiste. Les représentants du lobby affirment que l'abandon des nationalistes nuirait à la crédibilité des États-Unis en Asie, encouragerait l'Union soviétique et aliénerait les alliés anticommunistes. La Maison Blanche rétorque qu'une aide supplémentaire pourrait simplement prolonger une guerre que les nationalistes ne peuvent pas gagner, tout en drainant les ressources américaines. En coulisses, le lobby organise des campagnes publiques, menaçant de conséquences électorales ceux qui sont perçus comme faisant obstacle à leur programme. Le président doit maintenant décider s'il doit apaiser le lobby ou rester ferme sur la voie actuelle."
 USA_CCWr.2.a:0 "Tenir bon"
 
 USA_CCWr.3.t:0 "La fin de l'opération Beleaguer ; Critiques du lobby chinois"
 USA_CCWr.3.d:0 "La fin de l'opération Beleaguer - le déploiement d'après-guerre de marines américains pour soutenir les efforts nationalistes chinois - a été vivement condamnée par le lobby chinois. Ils soutiennent que le retrait des forces américaines à un moment aussi critique laisse les nationalistes vulnérables et signale un engagement vacillant des États-Unis en Asie de l'Est. Les conseillers militaires notent que l'opération Beleaguer n'a jamais été conçue comme une mission à durée indéterminée et que sa poursuite risquerait d'entraîner des affrontements directs avec les forces communistes. Cependant, le lobby considère le retrait comme une victoire des isolationnistes et une concession dangereuse aux insurgés soutenus par les Soviétiques. Le choix se situe désormais entre un réengagement militaire pour rassurer les nationalistes ou le maintien de la décision de mettre fin au rôle militaire direct de l'Amérique dans la guerre civile chinoise."
 USA_CCWr.3.a:0 "Les nationalistes sont condamnés"

 USA_CCWr.4.t:0 "Le lobby chinois indigné"
 USA_CCWr.4.d:0 "L'annonce selon laquelle Washington ne soutiendrait pas Chiang Kai-shek a déclenché une tempête politique. Le lobby chinois, une alliance de législateurs, d'éditeurs, de donateurs et de défenseurs des émigrés, accuse l'administration d'abandonner un allié vital au bord de la victoire communiste. Les éditoriaux nous accusent d'apaisement ; Les bureaux de la colline signalent des lignes téléphoniques inondées et des menaces de représailles électorales. Les leaders du lobby affirment que le retrait de leur soutien briserait la crédibilité des États-Unis en Asie, enhardirait Moscou et perdrait sa position morale au profit de ceux qui prétendent qu'on ne peut pas faire confiance à l'Amérique. Au sein de l'administration, certains insistent sur le fait que nos ressources sont limitées et qu'une intervention plus approfondie risque de constituer un engagement à durée indéterminée avec peu de chances de modifier le champ de bataille. D'autres préviennent que le silence sera désormais interprété à travers le Pacifique comme un retrait. Nous devons décider s'il faut apaiser le lobby, le gérer ou l'affronter de front."
 USA_CCWr.4.b:0 "Malheureusement"

 USA_CCWr.8.t:0 "Décider du gouverneur de Taiwan"
 USA_CCWr.8.d:0 "Alors que Taiwan est fermement sous occupation américaine, Washington est confronté à la décision cruciale de savoir qui devrait être nommé gouverneur de l'île. Le rôle n'est pas simplement administratif mais stratégique, car Taiwan devient rapidement la clé de voûte de la projection de la puissance américaine en Asie de l'Est. Le général Albert Wedemeyer, stratège respecté connu pour son commandement logistique sur le théâtre Chine-Birmanie-Inde, propose une approche méthodique axée sur la construction d'infrastructures, l'amélioration des services civils et le renforcement des capacités de défense. Son style prudent séduit ceux qui privilégient la stabilité plutôt que l'action audacieuse. D'un autre côté, le général Claire Chennault, commandant charismatique des célèbres Tigres volants, considère Taiwan comme un bastion actif pour les opérations anticommunistes, prônant une puissance aérienne accrue et une coopération avec les restes nationalistes. Les deux choix comportent des risques et des récompenses diplomatiques, influençant les relations avec le gouvernement en exil de la République de Chine, l'Union soviétique et la communauté internationale dans son ensemble. Cette décision façonnera la gouvernance de Taiwan et son rôle dans la guerre froide en cours."
 USA_CCWr.8.a:0 "Nommer Albert Wedemeyer"
 USA_CCWr.8.b:0 "Nommer Claire Chennault"
 
 USA_CCWr.7.t:0 "Les généraux nationalistes fuient à Taiwan"
 USA_CCWr.7.d:0 "Alors que les derniers bastions nationalistes sur le continent s'effondrent, un certain nombre d'éminents généraux chinois sont arrivés à Taiwan, sous administration américaine, pour chercher refuge. Parmi eux se trouve le président par intérim Li Zongren, accompagné d'officiers militaires supérieurs qui ont commandé certaines des campagnes les plus importantes de la guerre civile. Leur fuite représente à la fois une opportunité politique et une complication potentielle pour les États-Unis. D'une part, ces dirigeants en exil apportent une légitimité à Taiwan en tant que centre de la résistance anticommuniste chinoise, ainsi que des renseignements précieux et des liens avec les réseaux loyalistes. D'un autre côté, leur présence risque d'importer les rivalités profondément enracinées, les allégations de corruption et les luttes politiques internes qui ont tourmenté la cause nationaliste. Les autorités américaines sont désormais confrontées à un délicat exercice d'équilibre : intégrer ces personnalités dans l'administration et la défense de l'île ou restreindre leur influence pour maintenir la stabilité. Ce choix affectera le rôle de Taiwan dans la stratégie plus large des États-Unis contre l'expansion communiste en Asie."
 USA_CCWr.7.a:0 "Bienvenue à nos nouveaux alliés"
 
 USA_CCWr.9.t:0 "Rétablir la loi sur l'aide chinoise de 1948"
 USA_CCWr.9.d:0 "Alors que les combats en Asie de l'Est entrent dans une nouvelle phase, l'administration est sous pression pour relancer la loi sur l'aide chinoise de 1948. Les partisans soutiennent que des financements, des crédits et du matériel renouvelés consolideraient le contrôle amical sur les ports du continent, stabiliseraient la monnaie et maintiendraient des lignes vitales ouvertes à l'industrie américaine. Ils affirment que le programme précédent a échoué parce que le soutien est arrivé tardivement et qu'il n'a pas fait l'objet d'une surveillance cohérente. Les critiques rétorquent que les transferts importants risquent de provoquer la corruption, l'enchevêtrement dans des factions politiques et des réactions négatives de la part des contribuables qui souhaitent des budgets plus serrés dans leur pays. Le Trésor et l'État proposent un programme révisé qui combinerait des subventions avec des prêts conditionnels, déploierait des auditeurs aux côtés de conseillers et lierait l'aide à des étapes claires en matière de réforme et de sécurité. Le Pentagone privilégie les livraisons accélérées de pièces de rechange et de matériel de communication pour améliorer la préparation sans engager de forces terrestres. Le Congrès écoute, le lobby chinois se mobilise et les alliés attendent un signal de détermination américaine. Cette décision définira notre position dans le Pacifique occidental."
 USA_CCWr.9.a:0 "Rétablir la loi dans son intégralité"
 
 USA_CCWr.12.t:0 "Un lobby chinois renaissant"
 USA_CCWr.12.d:0 "La victoire nationaliste a électrisé le lobby chinois de Washington. Des chefs d'entreprise, des missionnaires, des vétérans du théâtre chinois et des législateurs influents affirment désormais que ce triomphe valide des années de plaidoyer en faveur d'un soutien plus fort. Ils proposent des crédits à l'exportation étendus, des échanges culturels et un cadre de sécurité qui ancre la puissance amie à travers la première chaîne d'îles. Leur campagne met en lumière les succès sur le champ de bataille, le sentiment anticommuniste et l'histoire commune de la guerre. Pourtant, cette poussée ravive également des préoccupations familières : des accusations de favoritisme, de collecte de fonds opaque et de tactiques de pression qui compliquent la construction d'une coalition au Capitole. La Maison Blanche doit décider dans quelle mesure elle s'aligne sur le programme du lobby tout en gérant les relations avec les partenaires européens qui craignent une escalade et avec les alliés régionaux qui veulent avoir une place à la table. L'opinion publique est favorable mais prudente, centrée sur les coûts et sur des objectifs clairs. Adopter le lobby projettera la confiance. Le tenir à bout de bras préservera la flexibilité. L'une ou l'autre de ces orientations façonnera les budgets, la diplomatie et la stratégie en Asie."
 USA_CCWr.12.a:0 "Excellente nouvelle"
 
 USA_CCWr.13.t:0 "Chiang propose le pacte de Nankin"
 USA_CCWr.13.d:0 "Tout juste sorti de sa victoire, le gouvernement nationaliste a présenté une vaste proposition de sécurité régionale connue sous le nom de Pacte de Nankin. Le plan envisage un accord de défense mutuelle entre États asiatiques amis, soutenu par des missions de formation américaines, une surveillance maritime et des contrôles coordonnés des exportations. Les partisans le décrivent comme un bouclier pratique contre la subversion et une base pour le développement économique lié à des voies maritimes sécurisées. Ils soulignent le partage du renseignement, les exercices conjoints et les équipements standardisés comme des mesures peu coûteuses qui multiplient la dissuasion. Les sceptiques préviennent qu'un engagement formel pourrait déclencher des contre-blocages, mettre à rude épreuve les relations avec les pays neutres et obliger les États-Unis à des crises bien éloignées des déploiements actuels. Les conseillers juridiques notent que le consentement du Sénat serait requis pour les dispositions du traité, tandis que le Pentagone suggère de commencer par un forum consultatif et des cellules de planification d'urgence. Les alliés se demandent quelle est la position de Washington. Notre réponse indiquera jusqu'où nous sommes prêts à aller pour façonner une architecture de sécurité asiatique après la guerre civile."
 USA_CCWr.13.a:0 "Nous garderons un oeil pour l'instant"
 
 USA_CCWr.14.t:0 "Craintes croissantes du communisme"
 USA_CCWr.14.d:0 "L'effondrement du contrôle nationaliste sur le continent chinois a provoqué une onde de choc à Washington et dans l'opinion publique américaine en général. Les journaux mettent en garde contre le resserrement du cercle communiste qui s'étend de l'Europe de l'Est à l'Asie, et des commentateurs influents affirment que la chute de la Chine est une conséquence directe d'un manque de vigilance. Les audiences du Congrès enquêtent déjà sur les sympathies présumées au sein du Département d'État, tandis que les groupes de défense appellent à des examens idéologiques dans les universités, les syndicats et la presse. La communauté du renseignement prévient que les victoires communistes à l'étranger enhardissent les cellules nationales et renforcent la propagande ciblant les publics vulnérables dans le pays. Certains décideurs politiques font pression pour des programmes de fidélité élargis, des contrôles d'immigration plus stricts et un financement accru des mouvements anticommunistes à l'étranger. D'autres mettent en garde contre la panique, avertissant qu'un climat de suspicion pourrait porter atteinte aux libertés civiles et à l'unité. Pourtant, l'ambiance change : les politiciens de tous partis voient désormais le communisme comme la menace déterminante de l'époque, tant à l'étranger qu'à l'intérieur des frontières nationales."
 USA_CCWr.14.a:0 "Cela ne peut pas bien finir"
 
 USA_CCWr.15.t:0 "Influence américaine croissante dans le ROCA"
 USA_CCWr.15.d:0 "Avec le regroupement de l'armée de la République de Chine à Taiwan après la perte du continent, les conseillers, officiers et responsables humanitaires américains ont assumé un rôle croissant dans l'élaboration de son avenir. Les missions militaires réorganisent leurs programmes de formation, introduisent des équipements de communication modernes et révisent leur doctrine opérationnelle. Des spécialistes civils donnent des conseils sur la logistique, les infrastructures et la coordination du renseignement, travaillant souvent directement avec des généraux supérieurs. Si cet afflux d'aide renforce les défenses et le moral de l'île, il suscite également un malaise chez certains dirigeants nationalistes qui considèrent le renforcement de la présence américaine comme une atteinte à la souveraineté. Les responsables américains affirment que leur rôle est temporaire et vise uniquement à renforcer la résistance au communisme. Pourtant, des rumeurs circulent sur des manoeuvres politiques en coulisses, des personnalités comme le général Sun Li-jen gagnant en influence grâce à ses liens étroits avec des conseillers américains. Cet équilibre délicat entre coopération et autonomie façonnera la stabilité de Taiwan et la survie de la République de Chine."
 USA_CCWr.15.a:0 "Concernant..."

 #News
 USA_CCWr.5.t:0 "[GetNewspaperHeader]L'Amérique abandonne la Chine"
 USA_CCWr.5.d:0 "Washington a annoncé qu'il ne fournirait plus d'aide militaire ou de soutien consultatif significatif au gouvernement de Chiang Kai-shek, mettant ainsi fin à deux décennies de soutien inégal des États-Unis à la cause nationaliste. Cette décision fait suite à des débats houleux sur les coûts, la corruption et les revers sur les champs de bataille sur le continent. Les partisans disent qu'il s'agit d'une reconnaissance sobre des limites ; les critiques préviennent que cela signale un retrait qui se répercutera de Tokyo à Delhi. Dans les ministères à destination de Nanjing et de Taipei, l'annonce tombe comme un coup de massue : les plans d'évacuation, de consolidation et les appels aux courtiers de pays tiers auraient commencé. Moscou salue le déclin américain ; Londres appelle au calme ; Paris surveille les voies de navigation. Aux États-Unis, l'influent lobby chinois promet des représailles électorales, tandis que les planificateurs du Pentagone s'orientent vers une posture plus large dans le Pacifique, centrée sur la puissance maritime et aérienne. Reste à savoir si cela met fin à un enchevêtrement ou ouvre un vide. Ce qui est sûr, c'est que la balance asiatique s'incline à nouveau - sans les fusils américains au front."
 USA_CCWr.5.a:0 "Un tournant en Asie"
 
 USA_CCWr.6.t:0 "[GetNewspaperHeader]L'Amérique occupe Taiwan"
 USA_CCWr.6.d:0 "Dans un geste dramatique après la fin du soutien à grande échelle à Chiang Kai-shek, les forces américaines ont établi une occupation militaire temporaire sur Taiwan. Les responsables décrivent cette action comme une mesure de stabilisation visant à empêcher une guerre plus large, à sécuriser les voies maritimes et à protéger les civils dans un contexte d'effondrement de l'autorité nationaliste. L'accord - administré par une mission civile et navale conjointe - promet de respecter les institutions locales tout en imposant des couvre-feux, des contrôles portuaires et une surveillance limitée de la presse. Taipei exprime une coopération prudente ; Les partisans de la ligne dure nationaliste dénoncent une « tutelle » étrangère, alors même qu'ils font la queue pour obtenir des laissez-passer de liaison. Pékin condamne une « saisie impérialiste » et exige un retrait immédiat. Aux Nations Unies, les appels se multiplient en faveur d'une supervision internationale ou d'un mandat limité dans le temps, tandis que Londres et Canberra accueillent tranquillement un tampon contre une nouvelle escalade. Chez nous, les critiques dénoncent la dérive de la mission ; les partisans soutiennent que l'alternative est un vide périlleux. Pour l'instant, les drapeaux américains partagent l'horizon avec les panneaux portuaires repeints à la hâte - le nouveau front dans un Pacifique instable."
 USA_CCWr.6.a:0 "Une sauvegarde provisoire ou un nouvel engagement ?"

 USA_CCWr.10.t:0 "[GetNewspaperHeader]Les Marines américains retournent à Qingdao"
 USA_CCWr.10.d:0 "Dans un geste rappelant les déploiements d'après-guerre de la fin des années 1940, les Marines américains sont retournés dans la ville portuaire de Qingdao. Les déclarations officielles décrivent la mission comme un déploiement limité visant à protéger les ressortissants américains, à contribuer à la sécurité maritime et à fournir un soutien logistique aux forces chinoises amies dans la guerre civile en cours. La réaction locale est mitigée : les responsables nationalistes saluent cette présence renouvelée comme un signe d'engagement, tandis que les critiques accusent Washington de raviver une époque de privilèges étrangers inégaux. L'Union soviétique dénonce le déploiement comme une intrusion impérialiste et la propagande communiste en Mandchourie s'empare de l'imagerie des troupes étrangères sur le sol chinois. Pendant ce temps, les planificateurs navals soulignent l'emplacement stratégique de la ville pour les opérations dans le Pacifique. Pour l'heure, les bannières étoilées survolent à nouveau les quais de Qingdao, alors qu'un calme tendu s'installe entre le grondement des camions de ravitaillement et les échos lointains des tirs à l'intérieur des terres."
 USA_CCWr.10.a:0 "Un port familier pour les forces américaines"
 
 USA_CCWr.11.t:0 "[GetNewspaperHeader]Intervention américaine en Chine"
 USA_CCWr.11.d:0 "Les États-Unis ont officiellement engagé leurs forces terrestres, navales et aériennes à participer directement à la guerre civile en Chine. Cette décision fait suite à des semaines de débats houleux à Washington, où les partisans de l'intervention ont fait valoir que sans une action ferme, la partie continentale de la Chine tomberait entièrement sous le contrôle communiste. Les premiers éléments de combat auraient débarqué dans des villes côtières clés, établissant des postes de commandement conjoints avec les unités nationalistes. Les partisans du Congrès saluent cette décision comme une position contre l'expansion soviétique ; les opposants mettent en garde contre une autre guerre étrangère prolongée. À Pékin, les dirigeants communistes promettent d'affronter les Américains « par le feu et l'acier », tandis que Moscou présente cette décision comme une preuve des ambitions impériales américaines. De l'autre côté du Pacifique, le Japon et les Philippines renforcent discrètement leurs défenses, se méfiant de l'ampleur du conflit. Pour les champs de bataille chinois, l'arrivée des troupes américaines marque un tournant décisif - et potentiellement une escalade - dans une guerre qui ne montre aucun signe de fin."
 USA_CCWr.11.a:0 "Une démarche audacieuse ou un pari dangereux ?"


 
 
