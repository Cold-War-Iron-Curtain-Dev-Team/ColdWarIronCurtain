 SIA_insurgency_options.3.d:0 "Les Khmers rouges continuent de tirer sur les civils et traversent notre frontière sans tenir compte de nos avertissements. Pour contrer cela, nous avons mis en place une unité d'intervention rapide dans une zone frontalière en proie à de nombreuses violations commises par les combattants khmers. Cette décision s'est avérée excellente puisqu'un groupe de combattants ennemis a été identifié en train de traverser la frontière pour se cacher des forces gouvernementales. Notre unité a identifié leur emplacement et s'est déplacée rapidement, lançant un assaut qui a sans doute choqué leur commandant qui pensait pouvoir se cacher pendant plusieurs jours avant que nous réagissions. L'ennemi subit de lourdes pertes et fut repoussé de l'autre côté de la frontière."
 SIA_insurgency_options.4.d:0 "Les Khmers rouges continuent de tirer sur les civils et traversent notre frontière sans tenir compte de nos avertissements. Pour contrer cela, nous avons mis en place une unité d'intervention rapide dans une zone frontalière en proie à de nombreuses violations commises par les combattants khmers. Suite à des informations selon lesquelles un groupe de combattants khmers rouges était positionné de notre côté de la frontière à la suite d'un combat avec les forces gouvernementales cambodgiennes, nous avons déployé notre unité pour les éliminer. Cependant, alors que les hommes approchaient, ils ont été pris dans une embuscade et ont subi des pertes avant d'être contraints de fuir. Les combattants khmers rouges ont ensuite attaqué un village frontalier thaïlandais avant de revenir avec des armes et des fournitures capturées. Il semble que nos forces n'étaient pas préparées tactiquement face à des combattants rompus aux tactiques de guérilla de l'ennemi."
 SIA_insurgency_options.5.d:0 "Les Khmers rouges renforcent leur emprise sur les campagnes et menacent de couper la capitale cambodgienne de ses unités militaires opérant dans les zones rurales. Un tel scénario n'est pas dans l'intérêt de notre gouvernement et il a été décidé que nous utiliserions notre propre puissance aérienne pour offrir un soutien limité contre les Khmers rouges. Grâce à des sources de renseignement, nous avons découvert un carrefour routier clé fermement contrôlé par des combattants opérant depuis un camp voisin. Une fois le camp identifié, nous avons déployé des avions qui ont bombardé le camp. Les évaluations aériennes ainsi que les interceptions des communications ennemies ont confirmé que la frappe était un succès et que nous avons gêné les Khmers rouges dans cette zone."
 SIA_insurgency_options.6.d:0 "Les Khmers rouges renforcent leur emprise sur les campagnes et menacent de couper la capitale cambodgienne de ses unités militaires opérant dans les zones rurales. Un tel scénario n'est pas dans l'intérêt de notre gouvernement et il a été décidé que nous utiliserions notre propre puissance aérienne pour offrir un soutien limité contre les Khmers rouges. Grâce à des sources de renseignement, nous avons découvert un carrefour routier clé fermement contrôlé par des combattants opérant depuis un camp voisin. Une fois le camp identifié, nous avons déployé des avions qui ont bombardé le camp. Malheureusement, les évaluations aériennes ainsi que les interceptions des communications ennemies ont confirmé que la frappe avait touché une cible non militaire, enflammant les émotions des habitants de la région. Notre grève n'a fait que contribuer à accroître la popularité des Khmers rouges."

 VIE_insurgency_options.3.d:0 "Les Khmers rouges communistes contribuent à faciliter la circulation des hommes et des armes vers les forces antigouvernementales sur notre propre territoire. Ils opèrent de manière flagrante à notre frontière et ont le sang de nombreux innocents sur les mains. Pour montrer que nous ne tolérerons pas une force hostile à notre frontière, nous avons récemment lancé un raid au Cambodge. Nos hommes ont attaqué un camp ennemi, infligeant de lourdes pertes, capturant des documents et, plus important encore, nous avons trouvé une immense réserve de nourriture et d'armes destinées à nos ennemis. Nos hommes ont tout détruit avant de revenir. Cette opération montre que nous ne tolérerons pas l'ingérence des Khmers rouges et de leurs alliés dans nos affaires et que nos actions apportent notre soutien au gouvernement cambodgien."
 VIE_insurgency_options.4.d:0 "Les Khmers rouges communistes contribuent à faciliter la circulation des hommes et des armes vers les forces antigouvernementales sur notre propre territoire. Ils opèrent de manière flagrante à notre frontière et ont le sang de nombreux innocents sur les mains. Pour montrer que nous ne tolérerons pas une force hostile à notre frontière, nous avons récemment lancé un raid au Cambodge. Cependant, alors que les hommes s'approchaient du camp ciblé, il semble qu'ils n'aient pas surpris les Khmers rouges qui ont tendu une embuscade. Ils ont infligé de lourdes pertes et forcé nos hommes à franchir la frontière. Les Khmers rouges utilisent ce raid comme preuve d'une invasion vietnamienne pour recruter davantage de personnes et creuser un fossé entre nous et le gouvernement cambodgien qui condamne désormais publiquement nos actions pour sauver la face."
 VIE_insurgency_options.5.d:0 "La reconnaissance aérienne montre clairement l'ampleur du soutien que les Khmers rouges apportent à nos ennemis. Ils facilitent la circulation des armes, des hommes et des fournitures vers notre pays, ce qui alimente les combats sur nos terres. Grâce aux renseignements provenant de sources amies, nous avons découvert une importante concentration de carburant, de munitions et de fournitures près de la frontière. Nous avons envoyé plusieurs chasseurs qui ont réussi à bombarder cette cible, provoquant des explosions massives et la destruction de tout ce matériel. Les Khmers rouges qui gardaient l'installation ont également été détruits et nous pensons que l'opération entravera leurs opérations ainsi que celles de nos ennemis."
 VIE_insurgency_options.6.d:0 "La reconnaissance aérienne montre clairement l'ampleur du soutien que les Khmers rouges apportent à nos ennemis. Ils facilitent la circulation des armes, des hommes et des fournitures vers notre pays, ce qui alimente les combats sur nos terres. Grâce aux renseignements provenant de sources amies, nous avons découvert une importante concentration de carburant, de munitions et de fournitures près de la frontière. Nous avons dépêché plusieurs chasseurs, mais alors qu'ils s'approchaient de la cible, ils ont essuyé de violents tirs antiaériens depuis le sol. Les avions ont largué leurs bombes et sont retournés à leur base, heureusement sans faire de victimes. Toutefois, les bombes ont endommagé les terres agricoles locales et une bombe a atterri près d'un village. Cela a été utilisé pour galvaniser le soutien aux Khmers rouges dans la région."

 USA_CAM_Inusrgency_Options.5.d:0 "Apparemment, les États-Unis ont conclu un accord tacite avec le gouvernement cambodgien autorisant le bombardement des sanctuaires khmers rouges près de la frontière avec le Vietnam. Des bombardiers massifs B-52 ont lancé une intense campagne de bombardements qui a abouti à la destruction de matériel, de personnel et de bases dans les zones khmères rouges. Les États-Unis espèrent que leurs opérations empêcheront l'afflux d'armes communistes vers le Sud-Vietnam et entraveront les opérations des Khmers rouges en détruisant leur base d'approvisionnement. Même si les dégâts sont dévastateurs et ont eu un effet, les Khmers rouges semblent finalement s'adapter et sont toujours capables de mener leurs missions malgré la récente offensive aérienne américaine. Les États-Unis appellent leur campagne de bombardement Operation Menu."

 CAM_insurgency_options.15.d:0 "Le gouvernement cambodgien a récemment lancé une vaste offensive pour repousser les Khmers rouges et contribuer à protéger le pays de la menace communiste. Les Khmers rouges avaient déployé leurs forces pour contrôler les routes et positions clés afin d'isoler les unités gouvernementales les unes des autres. Cette offensive visait à rétablir le contrôle gouvernemental de ces routes et à assurer le contact avec les forces militaires dans les campagnes et dans la capitale. L'offensive a atteint ses objectifs, l'opération a vu plusieurs unités se déplacer conjointement pour encercler les forces khmères rouges et sécuriser les routes de ravitaillement. Des réserves de fournitures, de carburant et d'armes ennemies ont également été saisies au cours de l'opération. L'utilisation efficace de l'artillerie et une bonne coordination entre les commandants ont assuré le succès de l'opération. Avec cette victoire, l'ennemi est sur la défensive et certains estiment que le vent est en train de tourner."
 CAM_insurgency_options.151.d:0 "Le gouvernement cambodgien a récemment lancé une vaste offensive pour repousser les Khmers rouges et contribuer à protéger le pays de la menace communiste. Les Khmers rouges avaient déployé leurs forces pour contrôler les routes et positions clés afin d'isoler les unités gouvernementales les unes des autres. Cette offensive visait à rétablir le contrôle gouvernemental de ces routes et à assurer le contact avec les forces militaires dans les campagnes et dans la capitale. L'offensive a atteint ses objectifs, l'opération a vu plusieurs unités se déplacer conjointement pour encercler les forces khmères rouges et sécuriser les routes de ravitaillement. Des réserves de fournitures, de carburant et d'armes ennemies ont également été saisies au cours de l'opération. L'utilisation efficace de l'artillerie et une bonne coordination entre les commandants ont assuré le succès de l'opération. Avec cette victoire, l'ennemi est sur la défensive et certains estiment que le vent est en train de tourner."
 CAM_insurgency_options.16.d:0 "Le gouvernement cambodgien a récemment lancé une vaste offensive pour repousser les Khmers rouges et contribuer à protéger le pays de la menace communiste. Les Khmers rouges avaient déployé leurs forces pour contrôler les routes et positions clés afin d'isoler les unités gouvernementales les unes des autres. Cette offensive visait à rétablir le contrôle gouvernemental de ces routes et à assurer le contact avec les forces militaires dans les campagnes et dans la capitale. Malheureusement, l'offensive s'est soldée par un échec. La communication entre les unités s'est avérée médiocre et plusieurs unités ont été soumises au feu intense de l'ennemi. L'artillerie de soutien s'est avérée parfois insuffisante et à la fin de l'offensive, presque toutes les unités étaient de retour à leur position de départ, certaines des plus isolées étant encore plus coupées des routes de ravitaillement. Le moral a chuté et un état d'esprit défensif dangereux prévaut désormais parmi les officiers."
 CAM_insurgency_options.3.d:0 "L'un de nos commandants d'unité a été informé par un paysan que dans un village voisin, les paysans stockaient du riz, rassemblaient des armes et hébergeaient des combattants communistes. Il a pris sa réparation et ils ont fait irruption, capturant la plupart des villageois, y compris un grand nombre de jeunes hommes. En fouillant le village, ils trouvèrent un entrepôt caché contenant de la nourriture, des armes et des fournitures. Les hommes ont tous été placés en garde à vue afin de pouvoir faire l'objet d'une enquête plus approfondie. Ce qui est clair jusqu'à présent, c'est que nous avons attaqué une base opérationnelle importante des Khmers rouges dans la région et que nous avons grandement gêné leurs partisans et leur personnel dans la région."
 CAM_insurgency_options.4.d:0 "Dans l'une de nos zones les plus rurales, une unité a posté sa décision d'attaquer un village à la recherche de combattants khmers rouges dans la région. Malheureusement, l'unité s'est déplacée très lentement et nous pensons qu'elle a été traquée par l'ennemi qu'elle voulait chasser. Lorsqu'ils ont atteint le village, le commandant a perdu le contrôle alors que les hommes se précipitaient pour prendre du riz et d'autres aliments aux villageois. Apparemment, l'unité était sous-approvisionnée, même si nous soupçonnons que le commandant avait vendu les rations de son unité. Cela a mis les villageois en colère et lorsqu'un groupe de soldats s'est égaré vers un entrepôt voisin, ils ont été abattus dans une embuscade khmère rouge. Les hommes qui pouvaient être organisés tentèrent de chasser l'ennemi, mais eux aussi tombèrent dans une embuscade et l'unité finit par se retirer de manière chaotique. Le raid n'a réussi à capturer aucun prisonnier ni aucun équipement ennemi et n'a contribué qu'à éloigner les troupes royales des habitants et à renforcer le moral de la gauche."
 CAM_insurgency_options.5.d:0 "Un commandement militaire régional a décidé de déployer de l'artillerie sur une colline stratégique pour faire des ravages sur les forces ennemies opérant dans la région. Grâce à des renseignements obtenus d'une source amie, on nous avait dit que l'ennemi considérait la zone comme une sorte d'autoroute à partir de laquelle déplacer les hommes et le matériel. Ces renseignements se sont révélés tout à fait précis puisqu'un groupe d'hommes se déplaçant lentement dans la jungle a été identifié et bombardé avec succès par notre artillerie. Lorsqu'une patrouille est allée enquêter, elle a découvert qu'il s'agissait de combattants communistes qui transportaient un grand nombre d'armes et de fournitures. Des plans sont en cours pour installer ces positions de tir dans d'autres régions du pays."
 CAM_insurgency_options.6.d:0 "Dans l'une de nos régions, les Khmers rouges se montrent très agressifs face à nos forces. Le commandant local installa secrètement l'artillerie et envoya une patrouille pour attirer les forces ennemies qui seraient ensuite éliminées par les tirs d'artillerie et de mortier. Cependant, lorsque l'ennemi a attaqué, nos équipes d'artillerie se sont révélées incompétentes en raison d'un manque de formation et d'un leadership efficace. Les obus ont raté ou ont fini par viser la patrouille, infligeant des pertes par tirs amis et aidant les communistes à coincer nos hommes. En fin de compte, nos forces ont subi de lourdes pertes lors de l'échange, le moral a été grandement affecté et un sentiment d'animosité s'est développé entre les officiers d'infanterie et les officiers d'artillerie de la région."
 CAM_insurgency_options.1.d:0 "Le plus grand avantage de la monarchie est peut-être la loyauté et le dévouement qu'elle inspire à tous les Cambodgiens, en particulier aux paysans. Même parmi les paysans les plus à gauche, certains se tournent encore vers la famille royale pour obtenir son leadership et ses conseils. Récemment, notre agent de renseignement a identifié plusieurs de ces paysans et leur a demandé de rejoindre ou de proposer leur aide aux Khmers rouges dans une zone précise. Ces paysans nous ont ensuite fourni de précieux renseignements sur les procédures opérationnelles, les mouvements et les objectifs des combattants communistes. Plus important encore, ils ont énuméré les villages et les chefs de village qui aidaient activement l'ennemi. Grâce à ces informations, nous avons commencé à rassembler lentement les sympathisants ennemis, à isoler les combattants communistes et nous allons bientôt les envelopper également, débarrassant la zone des forces ennemies."
 CAM_insurgency_options.2.d:0 "Le plus grand avantage de la monarchie est peut-être la loyauté et le dévouement qu'elle inspire à tous les Cambodgiens, en particulier aux paysans. Même parmi les paysans les plus à gauche, certains se tournent encore vers la famille royale pour obtenir son leadership et ses conseils. Récemment, notre agent de renseignement a identifié plusieurs de ces paysans et leur a demandé de rejoindre ou de proposer leur aide aux Khmers rouges dans une zone précise. Ces paysans nous ont ensuite fourni de précieux renseignements sur les procédures opérationnelles, les mouvements et les objectifs des combattants communistes. Cependant, dans ce cas, cela s'est soldé par un échec. Il s'est avéré que les paysans étaient des agents doubles et qu'ils nous ont fourni des renseignements que nous avons utilisés pour perturber ou arrêter les villageois des villages pro-gouvernementaux. Au moment où nous nous en sommes rendu compte, les dégâts avaient été faits et maintenant, de nombreux villages pro-gouvernementaux de la région ont rejoint les communistes ou ne nous aident plus à identifier les ennemis."

 CAM_insurgency_options.3a.d:0 "Un groupe de combattants khmers rouges a été identifié en train de traverser la frontière, probablement après avoir suivi un entraînement. Peu de temps après, ils établirent un camp au fond de la jungle. Notre commandant d'unité locale a organisé un raid composé des meilleurs soldats de son unité et ils ont pu lancer un assaut sur le camp. De nombreux combattants ennemis ont été neutralisés, les survivants ont fui, terrorisés, tandis que nos hommes récupéraient plusieurs prisonniers, des documents de propagande et une cache d'armes. Il semble que ces hommes étaient partis à l'étranger pour suivre une formation avancée, donc les perturber contribuerait à affaiblir les activités communistes dans la région et à remonter le moral de nos forces."
 CAM_insurgency_options.4a.d:0 "L'ennemi continue de tenter d'isoler nos unités en croisant les routes de ravitaillement et en tentant de fragmenter nos forces. L'effet de cette approche s'est récemment fait sentir lorsqu'un commandant local a reçu l'ordre de traquer une force ennemie qui tendait une embuscade à des convois de ravitaillement le long d'une route importante. En raison d'un manque de coordination et de communication entre les unités présentes dans la zone, le commandant s'est approché du camp suspect dans une direction dans laquelle l'ennemi les a facilement vu arriver. Les Khmers rouges ont tendu une embuscade à l'extérieur de leur camp et, alors que nos hommes passaient à l'assaut, ils sont tombés dans le piège ennemi. Nos forces ont subi de lourdes pertes et l'ennemi a fini par étendre son contrôle sur la route contestée."
 CAM_insurgency_options.5a.d:0 "Les références anticommunistes de notre République ont impressionné de nombreux pays de la région et du monde. Ils ont contribué de manière subtile ou manifeste à notre campagne contre les Khmers rouges. Récemment, un État ami a proposé un soutien aérien pour toute opération que nous choisissions. Nous avons identifié sur l'une des routes principales qu'une importante force khmère rouge interceptait le trafic et bloquait parfois l'approvisionnement de la capitale vers certaines de nos unités les plus importantes à la frontière. Nous avons fourni à nos amis des informations provenant d'informateurs et de scouts locaux. Hier, utilisant ces informations, la nation amie a envoyé plusieurs avions qui ont bombardé intensément l'ennemi. Une patrouille envoyée pour évaluer la situation a constaté que le camp communiste avait été dévasté et que les survivants avaient sans doute fui. Ce bombardement réussi a permis à nos forces de rétablir le contrôle de la zone et de protéger pour le moment la circulation des fournitures et des marchandises."
 CAM_insurgency_options.6a.d:0 "Les références anticommunistes de notre République ont impressionné de nombreux pays de la région et du monde. Ils ont contribué de manière subtile ou manifeste à notre campagne contre les Khmers rouges. Récemment, un État ami a proposé un soutien aérien pour toute opération que nous choisissions. L'un de nos commandants a remarqué qu'un groupe de villages servait essentiellement de bases aux combattants khmers rouges opérant contre ses forces. Forte de ces informations, la nation amie a envoyé des avions qui ont frappé les cibles afin de détruire les forces ennemies et leur infrastructure de soutien. Lorsqu'une patrouille est allée enquêter, elle a découvert que les avions avaient mal interprété leurs informations et n'avaient pas touché leurs cibles, mais plutôt des zones pro-gouvernementales. La population locale était furieuse et la patrouille a été forcée de revenir rapidement. Cette opération ratée nous a coûté un soutien local vital et n'a fait que renforcer nos ennemis communistes."
 CAM_insurgency_options.1a.d:0 "Le dévouement de nos partisans à la cause contre le communisme ne peut être décrit. Nos agents de renseignement ont récemment recruté des membres dévoués pour suivre une formation et partir à la campagne. Ils ont ensuite rejoint les Khmers rouges locaux dans la région. Nous avons ensuite reçu d'eux de précieux renseignements concernant les tactiques, les mouvements, les motivations et l'entraînement. Ces informations sont utilisées pour nous aider à contrer leur propagande et à entraver leurs propres mouvements. En fait, certains de nos infiltrés gravissent même les échelons et sont en mesure de fournir les noms des villages et des dirigeants communautaires soutenant les combattants. Grâce à ces renseignements, nous finirons par identifier et détruire les Khmers rouges dans la région ainsi que leurs réseaux de soutien."
 CAM_insurgency_options.2a.d:0 "Le dévouement de nos partisans à la cause contre le communisme ne peut être décrit. Nos agents de renseignement ont récemment recruté des membres dévoués pour suivre une formation et partir à la campagne. Ils ont ensuite rejoint les Khmers rouges locaux dans la région. Cependant, il semble que notre formation n'ait pas été aussi approfondie et cette bande de communistes a facilement identifié nos espions. Ils leur ont donné de fausses informations et mis en place des pièges qui ont confirmé leurs soupçons. Au fil du temps, cela a conduit à une série de défaites tactiques et d'actions de la part de nos troupes qui ont aliéné les partisans du gouvernement. Au moment où nous avons réalisé la vérité, nos infiltrés ont disparu et l'un des agents de renseignement impliqués a également été kidnappé par l'ennemi."

 Rouge_insurgency_options.3.d:0 "L'ennemi manque d'expérience au combat et de normes élevées d'entraînement. Nous pouvons nous appuyer sur les expériences de nos camarades sur d'autres théâtres de la lutte régionale et mondiale pour la révolution. Un exemple récent de cet avantage a été lorsque nos chasseurs ont suivi une patrouille ennemie. Ils se sont rendu compte que la patrouille avait tendance à revenir par où elle était venue, une erreur tactique militaire majeure. Nos combattants ont finalement tendu une embuscade parfaite et nous avons attaqué la patrouille, infligeant de lourdes pertes et capturant des armes et des fournitures précieuses. Le moral de nos hommes est désormais meilleur et l'ennemi présent dans la zone a peur de quitter ses bases."
 Rouge_insurgency_options.4.d:0 "Un leader trop confiant a conduit son groupe de combattants à attaquer un avant-poste ennemi. Nos combattants n'ont pas réussi à repérer ou à planifier correctement leurs tactiques et ont trahi certains des principes de base de notre style de combat révolutionnaire. Dans l'échange qui en a résulté, les hommes n'ont pas réussi à percer l'avant-poste et ont subi de lourdes pertes. Le commandant est remplacé et les hommes survivants sont emmenés pour être rééduqués aux tactiques et techniques appropriées. La force ennemie s'est avérée plus importante que prévu et nos hommes se sont déplacés ouvertement, révélant tout élément de surprise. Encore plus exaspérant était l'incapacité d'utiliser le terrain à notre avantage. De telles erreurs de la part de nos forces, qui ne sont pas des soldats professionnels, sont parfois prévisibles, mais elles doivent être immédiatement corrigées"
 Rouge_insurgency_options.5.d:0 "Un bureaucrate local a reçu une récompense royale pour ses années de service au gouvernement. Cet homme a fait connaître l'honneur qu'il avait reçu. De nombreux villageois ont été impressionnés et parlent désormais favorablement du gouvernement et de la famille royale. Cela érode le soutien dont notre cause bénéficie parmi les paysans opprimés. Pour arrêter cela, un groupe de combattants a posé des explosifs sur la maison du bureaucrate et l'a détruite. Le message a été reçu et maintenant le bureaucrate refuse de discuter de sa récompense lorsqu'elle est évoquée et certains des villageois les plus francs se taisent désormais."
 Rouge_insurgency_options.6.d:0 "Le gouvernement continue de donner l'ordre à des voyous armés de s'emparer de la nourriture et de l'argent des paysans. Ils saignent le pays à sec pour nourrir leurs propres désirs et la corruption. Dans un grand village, les collecteurs d'impôts ont un bureau. Une équipe de pose de bombes a tenté de la faire exploser mais a été capturée par les forces de sécurité locales qui ont attrapé nos hommes avec leurs explosifs. Le gouvernement dit maintenant aux villageois que nos hommes essayaient de poser une bombe qui aurait tué des innocents et détruit un entrepôt gouvernemental contenant du riz. Ils prétendent à tort que nous avions prévu de faire exploser le riz et de provoquer une pénurie de nourriture afin d'éloigner davantage les gens de la famille royale."
 Rouge_insurgency_options.1.d:0 "Le gouvernement s'appuie fortement sur les paysans locaux qui entretiennent de forts attaches avec la famille royale. Ils utilisent ces hommes et femmes simples pour collecter des informations sur nos activités révolutionnaires. Cependant, le gouvernement est devenu complaisant dans certains cas et, dans un domaine, nous avons découvert qu'il acceptait toute personne promettant sa loyauté et souhaitant fournir des informations. Nous avons envoyé plusieurs agents infiltrer les forces gouvernementales en les faisant passer pour des paysans loyaux. L'opération s'avère être un succès majeur car ils fournissent au gouvernement des informations obsolètes et apprennent à leur tour leurs tactiques et procédures. Nous demandons également au gouvernement de se concentrer sur les zones où il n'y a pas de combattants pour faciliter le mouvement de nos forces. Ce succès a permis à nos forces présentes dans la région d'opérer beaucoup plus efficacement."
 Rouge_insurgency_options.2.d:0 "Le gouvernement s'appuie fortement sur les paysans locaux qui entretiennent de forts attaches avec la famille royale. Ils utilisent ces hommes et femmes simples pour collecter des informations sur nos activités révolutionnaires. Nous avons envoyé plusieurs agents infiltrer les forces gouvernementales en les faisant passer pour des paysans loyaux. L'opération s'avère être un échec car les recruteurs du gouvernement se sont montrés habiles à sélectionner nos hommes. Ils ont rapidement compris ce qui se passait et ont fait venir les hommes. Cependant, ils ont veillé à ce que nos agents ne reçoivent pas de renseignements compromettants et les ont suivis. Lorsqu'ils ont découvert qui étaient leurs maîtres, ils ont arrêté les infiltrés et nos agents dans la région. Cela a affaibli notre capacité à traquer l'ennemi et les forces gouvernementales réalisent désormais des progrès dans ce domaine."

 Rouge_insurgency_options.3a.d:0 "La violence et l'agression flagrantes dont les troupes gouvernementales font preuve envers les paysans dans leur zèle à nous chasser et à récolter du riz pour la collecte des impôts nous ont valu un grand soutien de la part de la population locale. À partir de ces informations, nous avons découvert que la plupart des troupes d'un avant-poste gardant un carrefour routier clé participent à ces raids brutaux tous les quelques jours. Bien qu'ils prétendent voler de la nourriture dans les villages pour percevoir les impôts, nombreux sont ceux qui soupçonnent que les troupes sont mal approvisionnées et vivent de la terre. Grâce à ces informations, un groupe de nos hommes s'est installé autour du poste. Lorsque les forces gouvernementales se sont déplacées vers les villages et se sont éloignées, nos hommes ont attaqué le poste légèrement défendu. Nous avons détruit ce que nous ne pouvions pas emporter et avons également pu détruire plusieurs véhicules transportant du courrier et des fournitures sur la route. Ce raid réussi affaiblira sans aucun doute le moral de nos adversaires et les maintiendra piégés dans leur avant-poste alors que nous renforçons notre emprise dans la région."
 Rouge_insurgency_options.4a.d:0 "Notre ennemi s'est proclamé le plus grand opposant à la ferveur communiste qui envahit notre nation. De ce fait, ils peuvent acquérir du matériel et des fournitures auprès d'États amis ou de groupes qui leur sont favorables. Cela a fini par coûter cher à l'un de nos cadres qui a tenté pendant la nuit d'attaquer un poste ennemi à partir d'un point faible. Normalement, une telle opération aurait été un succès facile pour nos forces, car l'ennemi à ce poste a été observé ignorant les pratiques de base pour établir une défense. Cependant, alors que nos hommes approchaient à découvert, ils ont soudainement fait face à des tirs nourris et, après avoir subi des pertes, ont été contraints de battre en retraite, vaincus. Nous pensons que les troupes de cet avant-poste disposaient soit d'un conseiller étranger, soit d'un équipement de guerre nocturne avancé qu'elles ont utilisé pour vaincre notre attaque."
 Rouge_insurgency_options.5a.d:0 "Le gouvernement continue d'essayer de convaincre la population que sa cause est la bonne. Cependant, leur alliance avec les capitalistes, la corruption et leur politique brutale envers les paysans garantissent que nous restons forts face à leur agression. Notre principale tactique a consisté à isoler les forces gouvernementales en effectuant des raids ou en interceptant la circulation sur les routes principales afin d'empêcher les forces républicaines de communiquer. Lors d'une opération récente, une équipe de poseurs de mines a repéré une route secondaire utilisée par les véhicules gouvernementaux pour ravitailler les forces ennemies dans la région. Pendant la nuit, ils ont réussi à poser des mines sur cette route et le lendemain, lorsque les véhicules de ravitaillement sont arrivés, ils ont été touchés par les mines. Depuis, cette équipe suit les routes empruntées pour ravitailler les troupes ennemies et continue de miner ces routes. Cela conduit à une certaine panique et à une érosion de l'efficacité des forces gouvernementales."
 Rouge_insurgency_options.6a.d:0 "Le gouvernement continue de donner l'ordre à des voyous armés de s'emparer de la nourriture et de l'argent des paysans. Ils saignent le pays à sec pour nourrir leurs propres désirs et la corruption. Dans un grand village, les collecteurs d'impôts ont un bureau. Une équipe de pose de bombes a tenté de la faire exploser mais a été capturée par les forces de sécurité locales qui ont attrapé nos hommes avec leurs explosifs. Le gouvernement dit maintenant aux villageois que nos hommes essayaient de poser une bombe qui aurait tué des innocents et détruit un entrepôt gouvernemental contenant du riz. Ils prétendent faussement que nous avions prévu de faire exploser le riz et de provoquer une pénurie de nourriture pour éloigner davantage la population du gouvernement."
 Rouge_insurgency_options.1a.d:0 "Beaucoup de membres du gouvernement, en particulier dans les rangs intermédiaires de l'armée et de la bureaucratie, reconnaissent le caractère inévitable de notre révolution. Ils voient que les paysans se retournent contre eux et veulent assurer leur survie. Certains réalisent même la justesse de nos croyances et souhaitent nous rejoindre. Certes, nous acceptons certains transfuges, mais récemment, il a été décidé d'utiliser plutôt certains de ceux qui souhaitent changer de camp comme agents qui nous fournissent des informations. Dans l'une des plus grandes villes, nous avons réussi à recruter plusieurs responsables gouvernementaux et militaires pour nous fournir des informations. Grâce à eux, nous avons appris leurs ordres, leurs politiques, leurs mouvements, leurs effectifs et leur moral. Grâce à ces informations, nous avons pu étendre notre présence, défier la propagande gouvernementale et démoraliser davantage les forces gouvernementales dans la ville. Nous espérons que ce succès nous permettra, à terme, de chasser l'ennemi."
 Rouge_insurgency_options.2a.d:0 "Beaucoup de membres du gouvernement, en particulier dans les rangs intermédiaires de l'armée et de la bureaucratie, reconnaissent le caractère inévitable de notre révolution. Ils voient que les paysans se retournent contre eux et veulent assurer leur survie. Certains réalisent même la justesse de nos croyances et souhaitent nous rejoindre. Certes, nous acceptons certains transfuges, mais récemment, il a été décidé d'utiliser plutôt certains de ceux qui souhaitent changer de camp comme agents qui nous fournissent des informations. Malheureusement, une opération récente montre que cette approche peut être une arme à double tranchant. Dans un village très contesté, nous avons recruté un officier militaire de niveau intermédiaire pour nous fournir des renseignements et, au début, les informations nous ont semblé très utiles. Cependant, il a manipulé son maître et a vite compris où nos forces étaient largement concentrées. Au cours des derniers jours, le manutentionnaire a été arrêté et nos forces présentes dans la région ont subi de lourdes pertes après une attaque coordonnée du gouvernement. Il semblerait que notre infiltré était un agent double."

 Rouge_insurgency_options.151.d:0 "Bien que dans de nombreux endroits, les forces gouvernementales semblent supérieures aux nôtres en termes d'effectifs, les récents engagements indiquent qu'elles manquent de moral ou de volonté de poursuivre les combats. Dans cette optique, avec l'aide de l'artillerie acquise auprès de sources amies, les dirigeants militaires ont lancé une offensive à grande échelle pour élargir notre zone de contrôle et mettre l'ennemi sur la défensive. L'attaque s'est avérée être un succès retentissant puisque les forces gouvernementales ont fondu lorsqu'elles étaient engagées et surtout lorsqu'elles ont essuyé des tirs d'artillerie. L'une des clés de notre succès a été la décision des commandants de manoeuvrer nos hommes de manière à bloquer les renforts, en particulier ceux des milices progouvernementales, destinés à renforcer les unités de l'armée cambodgienne ciblées. Actuellement, nos forces consolident leurs acquis alors que l'ennemi cherche à se regrouper après ses pertes. L'ennemi est sur la défensive et il semble que notre révolution au Laos soit sur le point de se concrétiser."
 Rouge_insurgency_options.15.d:0 "Bien que dans de nombreux endroits, les forces gouvernementales semblent supérieures aux nôtres en termes d'effectifs, les récents engagements indiquent qu'elles manquent de moral ou de volonté de poursuivre les combats. Dans cette optique, avec l'aide de l'artillerie acquise auprès de sources amies, les dirigeants militaires ont lancé une offensive à grande échelle pour élargir notre zone de contrôle et mettre l'ennemi sur la défensive. L'attaque s'est avérée être un succès retentissant puisque les forces gouvernementales ont fondu lorsqu'elles étaient engagées et surtout lorsqu'elles ont essuyé des tirs d'artillerie. L'une des clés de notre succès a été la décision des commandants de manoeuvrer nos hommes de manière à bloquer les renforts, en particulier ceux des milices progouvernementales, destinés à renforcer les unités de l'armée cambodgienne ciblées. Actuellement, nos forces consolident leurs acquis alors que l'ennemi cherche à se regrouper après ses pertes. L'ennemi est sur la défensive et il semble que notre révolution au Laos soit sur le point de se concrétiser."
 Rouge_insurgency_options.16.d:0 "Bien que dans de nombreux endroits, les forces gouvernementales semblent supérieures aux nôtres en termes d'effectifs, les récents engagements indiquent qu'elles manquent de moral ou de volonté de poursuivre les combats. Dans cette optique, avec l'aide de l'artillerie acquise auprès de sources amies, les dirigeants militaires ont lancé une offensive à grande échelle pour élargir notre zone de contrôle et mettre l'ennemi sur la défensive. Il semble que notre évaluation était incorrecte. Même si des gains initiaux ont été réalisés contre les forces gouvernementales, nous n'avons pas réussi à bloquer l'arrivée des milices progouvernementales qui ont renforcé la résistance ennemie. En outre, la puissance aérienne du gouvernement s'est avérée décisive pour frapper l'artillerie et accroître la concentration de nos forces. Nos premiers gains ont été rapidement annulés et après avoir subi de lourdes pertes, l'attaque a été annulée. Pour le moment, nous devons être sur la défensive."

 CAM_insurgency_options.10.d:0 "La guerre civile cambodgienne s'est finalement terminée avec la victoire des Khmers rouges s'emparant de la capitale et dernier bastion du gouvernement, Phnom Penh. Au cours des derniers mois, les Khmers rouges se sont méthodiquement emparés des environs et ont finalement encerclé la ville. Lors du lancement de leur assaut principal, ils ont été confrontés à d'intenses combats de maison en maison, bien qu'ils aient finalement brisé la résistance du gouvernement. Alors que les forces gouvernementales s'effondraient, les dirigeants militaires et civils survivants ont cherché à s'échapper par hélicoptère du stade olympique ou en fuyant vers l'ambassade de France. Plusieurs hauts responsables du gouvernement, dont le Premier ministre Long Boret, ont été capturés dans le chaos. Une fois la ville capturée, les Khmers rouges ont immédiatement ordonné l'évacuation de tous les civils de la ville, entraînant de nombreuses victimes, notamment parmi les patients hospitalisés. L'ambassade de France a finalement rendu ses réfugiés pour éviter un massacre. Des exécutions massives d'anciens dirigeants militaires et civils ont déjà lieu dans le stade olympique. Le Cambodge est désormais fermement sous la domination des Khmers rouges."
 CAM_insurgency_options.11.d:0 "Le dernier bastion des combattants khmers rouges s'est récemment effondré face au gouvernement cambodgien. Malgré une lutte acharnée, le gouvernement a réussi à contrecarrer les tentatives des Khmers rouges d'intercepter les lignes d'approvisionnement et d'isoler les centres gouvernementaux les uns des autres. Les Khmers rouges étant incapables de diviser l'armée ou de consolider leur contrôle sur les centres de population, les rebelles ont finalement commencé à perdre plus d'hommes qu'ils ne pouvaient en recruter dans la paysannerie. Les paysans cambodgiens sont de plus en plus frustrés par les perturbations provoquées par la guerre. Les bandes khmères rouges étant isolées et coupées de la population, le gouvernement a pu éliminer les bandes restantes. Au cours de cet assaut final, de nombreux hauts dirigeants et commandants khmers rouges ont été tués ou capturés. On ne sait pas encore si leur chef Pol Pot fait partie d'eux, même si le gouvernement est convaincu que tous les dirigeants survivants seront finalement pris en charge."

 CAM_insurgency_options.0.d:0 "Le dirigeant cambodgien, le prince Sihanouk, a récemment accepté un gouvernement anticommuniste dirigé par le Premier ministre Lon Nol. Pour redresser l'économie, Lon Nol a lancé une campagne agressive de récolte de riz au cours de laquelle des troupes lourdement armées ont marché dans la campagne, collectant de force le riz et payant de faibles tarifs aux paysans. Cela provoqua un soulèvement que Lon Nol réprima violemment. Ce soulèvement a poussé le prince Sihanouk à finalement se retourner contre les gauchistes en ordonnant sa propre répression. Cependant, ces actions ont poussé le parti communiste Khmer rouge à lancer une insurrection contre le gouvernement. Ils prévoient d'utiliser le soutien des partis communistes voisins et l'expérience du Vietnam pour guider leurs forces contre un gouvernement cambodgien déterminé à briser une fois pour toutes la résistance de gauche."
 CAM_insurgency_options.100.d:0 "Le gouvernement cambodgien tente depuis des années d'équilibrer ses relations internationales avec l'Occident et les États communistes. Au niveau national, il a fonctionné de la même manière, favorisant parfois les factions communistes, tandis que d'autres fois, il favorisait les anticommunistes pour maintenir la stabilité. Cependant, à la suite d'une rébellion paysanne contre les taxes sur le riz, le gouvernement a pris un virage ferme contre les communistes et a commencé à s'allier avec les États-Unis. Cela a incité les Khmers rouges communistes à lancer leur rébellion communiste contre le gouvernement. Aujourd'hui, le gouvernement cambodgien fait face à des guérilleros communistes qui peuvent compter sur le soutien de puissants gouvernements communistes régionaux."

 Cambodian_Civil_War_Decisions_desc:0 "Le gouvernement cambodgien tente depuis des années d'équilibrer ses relations internationales avec l'Occident et les États communistes. Au niveau national, il a fonctionné de la même manière, favorisant parfois les factions communistes, tandis que d'autres fois, il favorisait les anticommunistes pour maintenir la stabilité. Cependant, à la suite d'une rébellion paysanne contre les taxes sur le riz, le gouvernement a pris un virage ferme contre les communistes et a commencé à s'allier avec les États-Unis. Cela a incité les Khmers rouges communistes à lancer leur rébellion communiste contre le gouvernement. Aujourd'hui, le gouvernement cambodgien fait face à des guérilleros communistes qui peuvent compter sur le soutien de puissants gouvernements communistes régionaux.\n\nForce actuelle :\n[?CAM.GetNameDef]: [?CAM.cam_insurgency] Points de victoire\n[?KMP.GetNameDef]: [?KMP.cam_insurgency] Points de victoire"
 Cambodian_Civil_War_Decisions:0 "La guerre civile cambodgienne"

