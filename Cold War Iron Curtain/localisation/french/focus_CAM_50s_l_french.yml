 # Cambodia 50s Military Focuses
 CAM_Sign_Second_Franco_Khmer_Agreement:0 "Signer le deuxième accord franco-khmer"
 CAM_Sign_Second_Franco_Khmer_Agreement_desc:0 "En vertu des dispositions de la deuxième convention militaire avec la France, les autorités royales de Phnom Penh obtiennent des responsabilités opérationnelles élargies et des secteurs autonomes dans toutes les provinces."
 CAM_Expand_Indigenous_Units:0 "Agrandir les unités autochtones"
 CAM_Expand_Indigenous_Units_desc:0 "En recrutant et en intégrant des bataillons indigènes khmers et des milices provinciales, nous élargissons notre défense territoriale sans dépendre entièrement des troupes de garnison française."
 CAM_EnforceKhett_Level_Pacification:0 "Appliquer la pacification au niveau Khett"
 CAM_EnforceKhett_Level_Pacification_desc:0 "La décentralisation de la contre-insurrection et de la sécurité publique vers les gouverneurs de province (khett) permet aux administrations locales d'éliminer les rebelles infiltrés et de stabiliser les districts ruraux."
 CAM_Establish_Battalion_Parachute_Khmer:0 "Création du Bataillon de Parachutistes Khmers"
 CAM_Establish_Battalion_Parachute_Khmer_desc:0 "La formation de notre premier bataillon aéroporté fournit à l'Armée royale une force de frappe d'élite mobile capable de se déployer rapidement sur un terrain de jungle difficile."
 CAM_Accept_Franco_American_Aids:0 "Accepter l'aide franco-américaine"
 CAM_Accept_Franco_American_Aids_desc:0 "La conclusion d'accords d'assistance militaire avec la France et les États-Unis apporte des injections vitales d'armes, de munitions, de véhicules et d'équipements pour moderniser nos stocks."
 CAM_Form_Escadron_de_Reconnaissance_Blindee:0 "Former l'Escadron de Reconnaissance Blindée"
 CAM_Form_Escadron_de_Reconnaissance_Blindee_desc:0 "La création d'un escadron blindé léger de reconnaissance équipé de chars légers Stuart et de voitures blindées confère à nos forces des capacités de reconnaissance et de puissance motorisées cruciales."
 CAM_Mission_Militaire_Francaise:0 "Mission Militaire Française"
 CAM_Mission_Militaire_Francaise_desc:0 "La Mission Militaire Française met à disposition des officiers vétérans et des instructeurs techniques pour former notre jeune corps d'officiers et conseiller l'état-major."
 CAM_Establish_Force_Armee_Nationale_Cambodge:0 "Création des Forces Armées Royales Khmères"
 CAM_Establish_Force_Armee_Nationale_Cambodge_desc:0 "Avec le transfert formel de l'autorité de commandement des forces coloniales françaises, nous établissons une armée nationale unifiée sous la couronne souveraine du Cambodge."
 CAM_Form_the_Marine_Royal_Khmere:0 "Former la Marine Royale Khmère"
 CAM_Form_the_Marine_Royal_Khmere_desc:0 "La création de la Marine royale khmère donne à notre royaume les moyens de patrouiller nos côtes, le Tonlé Sap et les réseaux commerciaux fluviaux du Mékong."
 CAM_Form_the_Aviation_Royal_Khmere:0 "Former l'Aviation Royale Khmère"
 CAM_Form_the_Aviation_Royal_Khmere_desc:0 "La création de la Royal Khmer Air Force jette les bases de la défense aérienne nationale, du transport de liaison et de la reconnaissance."
 CAM_Form_the_Bataillon_Blindee_Cambodgien:0 "Former le Bataillon Blindé Cambodgien"
 CAM_Form_the_Bataillon_Blindee_Cambodgien_desc:0 "La création d'un bataillon entièrement blindé équipé de blindés moyens et d'infanterie mécanisée constitue le principal fer de lance conventionnel de notre royaume."
 CAM_Receive_WW2_era_Naval_Equipment_and_Vessels:0 "Recevez des navires navals excédentaires"
 CAM_Receive_WW2_era_Naval_Equipment_and_Vessels_desc:0 "L'acquisition de patrouilleurs, de navires de débarquement et de transports amphibies excédentaires de la Seconde Guerre mondiale auprès des alliés occidentaux renforce nos flottilles fluviales et la sécurité côtière."
 CAM_Establish_the_Chrui_Chhangwar_Ecole_Navale:0 "Créer l'Académie navale Chrui Chhangwar"
 CAM_Establish_the_Chrui_Chhangwar_Ecole_Navale_desc:0 "L'extension des installations navales de Chrui Chhangwar en une académie navale permanente permet la formation nationale d'officiers de marine, de marins et d'ingénieurs."
 CAM_Import_Franco_American_Fighters:0 "Importer des combattants franco-américains"
 CAM_Import_Franco_American_Fighters_desc:0 "L'acquisition d'avions de combat légers et d'avions d'attaque au sol auprès de la France et des États-Unis donne à la Royal Khmer Air Force ses premières véritables capacités de combat."
 CAM_Establish_the_Pochentong_Ecole_de_IAir_Royale:0 "Créer la Pochentong Royal Flying School"
 CAM_Establish_the_Pochentong_Ecole_de_IAir_Royale_desc:0 "La création de l'académie de pilotage sur l'aérodrome de Pochentong, près de Phnom Penh, établit des programmes de formation autochtones pour les aviateurs et les équipes de maintenance khmers."
 CAM_Militarize_the_New_Sihanoukville_Port:0 "Militariser le port de Sihanoukville"
 CAM_Militarize_the_New_Sihanoukville_Port_desc:0 "Le développement de chantiers navals en eau profonde et de défenses côtières dans le nouveau port de Sihanoukville garantit une bouée de sauvetage maritime indépendante avec le monde."
 CAM_Accept_old_CEFEO_equipments:0 "Accepter les surplus d'équipement CEFEO"
 CAM_Accept_old_CEFEO_equipments_desc:0 "Alors que le corps expéditionnaire français d'Extrême-Orient se retire d'Indochine, nous acquérons ses stocks d'armes, d'artillerie et de véhicules blindés pour équiper nos divisions."
 CAM_US_MAAG_Advisor:0 "Acceptez les conseillers américains MAAG"
 CAM_US_MAAG_Advisor_desc:0 "L'accueil du Groupe consultatif d'assistance militaire des États-Unis fournit une doctrine tactique moderne, une formation logistique et des programmes d'aide militaire."
 CAM_Form_the_Groupment_dInfanterie_de_Marine:0 "Former le Groupement d'Infanterie de Marine"
 CAM_Form_the_Groupment_dInfanterie_de_Marine_desc:0 "L'organisation d'unités d'infanterie de marine dédiées garantit que nos forces amphibies peuvent défendre les dépendances insulaires et mener des opérations de débarquement fluviales."
 CAM_Promote_Lol_Nol_and_young_Khmer_Officers:0 "Promouvoir Lon Nol et les jeunes officiers"
 CAM_Promote_Lol_Nol_and_young_Khmer_Officers_desc:0 "L'élévation de jeunes commandants khmers compétents tels que Lon Nol à des postes de direction clés permet d'établir un corps de commandement dynamique, loyal et expérimenté."
 CAM_Import_Franco_American_Helicopters:0 "Importer des hélicoptères franco-américains"
 CAM_Import_Franco_American_Helicopters_desc:0 "L'acquisition d'hélicoptères de transport et utilitaires offre une mobilité tactique et des capacités d'évacuation des victimes sans précédent dans les jungles isolées."
 

