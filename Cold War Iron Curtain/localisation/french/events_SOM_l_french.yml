 som.1.d:0 "L'exécution de Barre a eu lieu il y a quelques instants à Mogadiscio, la capitale. Il a été amené sur la place du marché central, où il a été pendu pour sa tentative de coup d'État contre la nation. Cela enverra un message fort à ceux qui pensent pouvoir faire ce qu'ils veulent."
 som.2.d:0 "Hier soir, l'exécution de Siad Barre a eu lieu à Mogadiscio, la capitale. Selon les témoignages, il a été amené, traîné à la barre et rapidement exécuté par pendaison. La pendaison n'a cependant pas été effectuée correctement, ce qui l'a fait souffrir pendant plusieurs minutes. Selon le nouveau gouvernement, cela constituera un exemple de ce qui arrive à ceux qui pensent pouvoir s'opposer au gouvernement."
 som.3.d:0 "Il y a quelques instants à peine, un général respecté de l'armée, Siad Barre, a pris la tête du gouvernement somalien sans effusion de sang. Les troupes somaliennes appuyées par des chars sous le commandement de Barre ont pris d'assaut Mogadiscio, se sont emparées des principaux bâtiments gouvernementaux et ont ordonné la démission des dirigeants du pays. Le coup d'État a destitué le président actuel. Le motif est l'assassinat d'Abdirashid Ali Sharmarke plus tôt."
 somnews.1.d:0 "Les Nations Unies ont adopté une décision controversée, accordant à l'Italie la tutelle sur son ancienne colonie le Somaliland. Le territoire est sous contrôle militaire britannique depuis 1941 et ses forces devraient en céder la responsabilité aux autorités italiennes. Malgré les critiques concernant la restitution apparente d'une possession coloniale, un responsable de l'ONU a noté que l'indépendance de la Somalie et les responsables italiens se sont mis d'accord sur l'indépendance d'ici dix ans. L'ONU exige également que l'Italie fournisse des rapports publics réguliers sur ses efforts pour développer et préparer le Somaliland à l'indépendance. De nombreux Italiens saluent cette décision, y voyant une opportunité pour l'Italie d'accomplir sa responsabilité de préparer ses anciennes colonies à l'indépendance. La plupart des Somaliens ont bon espoir, même si beaucoup attendront de voir avant de soutenir ouvertement la tutelle italienne."
 som.7.d:0 "Les Nations Unies ont adopté une décision controversée, accordant à l'Italie la tutelle sur son ancienne colonie le Somaliland. Le territoire est sous contrôle militaire britannique depuis 1941 et ses forces devraient en céder la responsabilité aux autorités italiennes. Malgré les critiques concernant la restitution apparente d'une possession coloniale, un responsable de l'ONU a noté que l'indépendance de la Somalie et les responsables italiens se sont mis d'accord sur l'indépendance d'ici dix ans. L'ONU exige également que l'Italie fournisse des rapports publics réguliers sur ses efforts pour développer et préparer le Somaliland à l'indépendance. De nombreux Italiens saluent cette décision, y voyant une opportunité pour l'Italie d'accomplir sa responsabilité de préparer ses anciennes colonies à l'indépendance. La plupart des Somaliens ont bon espoir, même si beaucoup attendront de voir avant de soutenir ouvertement la tutelle italienne."
 som.4.d:0 "L'objectif de l'ONU d'assurer l'indépendance du peuple du Somaliland d'ici 10 ans a finalement été atteint avec l'indépendance du Somaliland italien par rapport à l'Italie aujourd'hui. Le Somaliland nouvellement formé s'est simultanément uni au Somaliland britannique, qui a obtenu sa propre indépendance quelques jours auparavant. L'unification a immédiatement donné naissance à la République somalienne, avec un gouvernement formé par Abdullahi Issa et Muhammad Haji Ibrahim Egal ainsi que d'autres membres des gouvernements de tutelle et de protectorat, avec Haji Bashir Ismail Yusuf comme président de l'Assemblée nationale somalienne, Aden Abdullah Osman Daar comme président de la République somalienne et Abdirashid Ali Shermarke comme Premier ministre. Cependant, la poussée précipitée de l'ONU en faveur d'une indépendance de 10 ans a révélé ses inconvénients, car la république semble toujours sous une forte influence coloniale, tant au sein de la population que du gouvernement. Pour l'instant, le sort de la Somalie dépend de la république."