 WW3_news.5.t: "[GetNewspaperHeader]Détonation nucléaire à travers l'Europe"
 WW3_news.5.d: "Les gens du monde entier sont sous le choc et l'horreur lorsque des rapports confirment la première détonation d'une arme nucléaire depuis Hiroshima et Nagasaki. Au milieu de la Troisième Guerre mondiale, les forces de l'OTAN poursuivent leur avancée incessante, incitant l'Union soviétique à lancer officiellement la première attaque nucléaire du conflit dans le cadre de l'opération « Étoile rouge ». Cette frappe visait un État non nucléaire. Les craintes d'une guerre nucléaire mondiale à grande échelle ont atteint des niveaux sans précédent depuis le début de la Troisième Guerre mondiale.\n\nMême si l'attaque a suscité une condamnation quasi universelle, Moscou insiste sur le fait qu'il s'agissait d'une action nécessaire entreprise au nom de la survie nationale. Washington et le reste de l'OTAN y voient une tentative désespérée de renverser le cours de la guerre. Il reste incertain si les États-Unis répondront à cette attaque nucléaire avec la même force ; Certains responsables de l'OTAN estiment même que les négociations de paix sont essentielles pour empêcher une nouvelle escalade nucléaire. Cependant, une chose est claire : l'horloge approche de minuit alors que les familles du monde entier se préparent au pire."
 WW3_news.5.a: "Dieu nous aide tous..."
 WW3_news.6.t: "[GetNewspaperHeader]Exécution de la famille royale"
 WW3_news.6.d: "Suite à la défaite japonaise contre la Chine, la famille impériale est arrêtée par l'Armée populaire de libération et assignée à résidence.\n\nAu sein du Politburo chinois, une décision a été prise pour imposer une exécution décisive pour les crimes commis pendant la Seconde Guerre mondiale, une décision qui a été négligée par les Américains pour la stabilisation du Japon d'après-guerre. Maintenant que les Chinois occupent le Japon, la famille royale a défilé dans l'ancien bâtiment de la Diète nationale et a été condamnée à être exécutée, l'ancien empereur Hirohito étant le premier à recevoir la balle, suivi de Takahito, du prince Mikasa et enfin du prince héritier Akihito.\n\nLes États-Unis ont lancé un ultimatum à la Chine pour qu'elle mette fin au procès, mais celui-ci a finalement été ignoré."
 WW3_news.6.a: "Horrible !"
 WW3_news.7.t: "[GetNewspaperHeader]Formation de la République populaire du Japon"
 WW3_news.7.d: "Alors que la guerre du Pacifique fait rage et que les avancées soviétiques semblent imparables, une nouvelle nation apparaît à l'est, la République populaire du Japon.\n\nAprès l'exécution de la famille royale, le Japon s'est retrouvé sans pouvoir, étant un royaume pendant deux millénaires, les Japonais se sont retrouvés sans empereur pour les guider, avec une direction collective formée entre le JCP et le reste du JSP.\n\nEn fin de compte, l'essayiste et critique littéraire, et ancien fasciste devenu communiste, Kiyoteru Hanada, est élu premier Premier ministre du Japon. Le même jour, la constitution fut approuvée, remplaçant la constitution de 1947."
 WW3_news.7.a: "Soleil rouge dans le ciel."


 WW3_ME.1.t: "Massacre de Jérusalem-Est"
 WW3_ME.1.d: "Alors que le monde est en feu, il semble que même le Levant n'ait pas été épargné par Minuit. Les protestations se sont finalement étendues à la Cisjordanie à cause du rassemblement de troupes jordaniennes à la frontière israélienne et des craintes croissantes d'une éventuelle annexion israélienne de la Cisjordanie. Tout comme les manifestations l'avaient prédit, les forces israéliennes ont commencé à se déplacer vers Jérusalem-Est pour assurer la « sécurité » de l'État d'Israël. Les responsables israéliens eux-mêmes minimisent le nombre de troupes qu'ils ont effectivement envoyées.\n\nLorsque les forces israéliennes sont finalement arrivées aujourd'hui, la panique et les émeutes ont éclaté dans toute la Cisjordanie, en colère contre la tentative d'Israël d'assurer sa souveraineté sur la Cisjordanie. En quelques minutes, les manifestants ont lancé des bombes incendiaires et des pierres sur les soldats israéliens à qui il a été demandé de limiter leurs actions autant que possible. Mais sortis de nulle part, comme dans l'ancien Second Temple, des coups de feu, comme des cloches, ont commencé à résonner au-dessus de la foule.\n\nCe jour-là, des centaines de personnes sont mortes. Mais personne ne peut dire avec certitude qui a commencé."
 WW3_ME.1.a: "Les Juifs l'ont fait !"
 WW3_ME.2.t: "Troupes jordaniennes à notre frontière !"
 WW3_ME.2.d: ""
 WW3_ME.2.a: "Ils veulent mourir ? Envoyons-les à Jannah alors."
 WW3_ME.3.t: "Traverser la frontière"
 WW3_ME.3.d: ""
 WW3_ME.3.a: "Mort aux Juifs !"
 WW3_ME.4.t: "Traverser la frontière"
 WW3_ME.4.d: ""
 WW3_ME.4.a: "Pour la défense d'Israël !"