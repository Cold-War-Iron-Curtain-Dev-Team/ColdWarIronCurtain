 jap_sov.9.t: "[GetNewspaperHeader]Les combats se terminent sur l'île natale !"
 jap_sov.9.d: "Après le débarquement soviétique sur les îles japonaises, une série de batailles intenses et sporadiques éclatèrent, conduisant finalement à la capitulation officielle du Japon face à l'avancée de l'armée soviétique.\n\nL'empereur Hirohito, qui avait été épargné par le commandement suprême des puissances alliées dans les années 1940 en raison de son rôle symbolique dans la culture japonaise, fait désormais face à un nouveau procès. Dans un geste historique, Hirohito a été contraint d'abdiquer le trône et de céder le pouvoir à son fils aîné, Akihito. Akihito a été nommé président de la Diète nationale nouvellement créée.\n\nPour superviser la transition et l'administration des territoires occupés par le Japon, le commandant soviétique Konstantin Rokossovsky a été désigné comme administrateur par intérim. Son rôle consistera à gérer la région jusqu'à ce qu'une nouvelle constitution soit rédigée, établissant un cadre de gouvernance qui reflète les idéaux du nouveau paysage politique japonais."
 jap_sov.9.a: "Un autre allié américain est tombé..."
 jap_sov.10.t: "[GetNewspaperHeader]Nouvelle Constitution du Japon"
 jap_sov.10.d: "Après la défaite du Japon, l'Union soviétique a chargé le Parti communiste japonais de commencer à rédiger une nouvelle Constitution. Le jour est finalement arrivé où le Parti communiste japonais a fusionné avec la faction de gauche du Parti socialiste japonais, formant un nouveau parti appelé Parti paysan et ouvrier japonais. Comme le prévoit la nouvelle Constitution, ce parti est devenu le seul parti légal et la force directrice de la nation.\n\nLes États-Unis et d'autres alliés de l'OTAN ont condamné cette évolution, la considérant comme un acte de l'impérialisme du Japon. Le président américain a exprimé son choc et sa colère à l'idée que le Japon devienne un autre État fantoche de l'Union soviétique.\n\nKenji Miyamoto a été élu nouveau président du parti et, par conséquent, Premier ministre du Japon. Pendant ce temps, le prince Akihito, fils de l'ancien empereur Hirohito, a été nommé président du Japon."
 jap_sov.10.a: "Le Soleil Rouge s'est levé."
 WW3_news.1.t: "[GetNewspaperHeader]Révolution syndicaliste à Monaco !"
 WW3_news.1.d: "Il y a à peine une semaine, la France tombait aux mains de l'Union soviétique, provoquant le désarroi dans le pays voisin de Monaco. Une vague de réfugiés français se précipita vers la petite nation, provoquant une série d'émeutes. L'Union syndicaliste monégasque organise une manifestation de soutien au nouveau gouvernement français, tandis que le prince Rainier III apparaît aux côtés des exilés d'Alger.\n\nDurant cette semaine tumultueuse, Monaco a été en proie à des pillages et des émeutes. En conséquence, le prince de Monaco a abdiqué, laissant un vide de pouvoir. Les syndicalistes profitèrent de cette situation pour abolir la monarchie et établir une nouvelle république."
 WW3_news.1.a: "Jeu idéologique"
