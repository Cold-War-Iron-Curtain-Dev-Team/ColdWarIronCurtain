 #Battleship/Battlecruiser Hulls in research tree#
 #Carrier Hulls in research tree#

 HOL_carrier_hull_light_0:0 "Karel Portier Classe"
 HOL_carrier_hull_light_1:0 "Karel Doorman Classe Refit I"
 HOL_carrier_hull_light_2:0 "Karel Doorman Classe Refit II"
 HOL_carrier_hull_light_3:0 "Classe Rotterdam"
 HOL_carrier_hull_light_4_:0 "Navire de soutien logistique conjoint"
 HOL_carrier_hull_light_4_short:0 "JLSS"
 HOL_carrier_hull_light_0_desc:0 "Le Design Light Fleet Carrier de 1942, communément appelé British Light Fleet Carrier, était un porte-avions léger créé par la Royal Navy pendant la Seconde Guerre mondiale et utilisé par huit forces navales entre 1944 et 2001. Ils ont été conçus et construits par des chantiers navals civils pour servir d'étape intermédiaire entre les porte-avions de flotte de grande taille et coûteux et les porte-avions d'escorte moins chers mais à capacité limitée."
 HOL_carrier_hull_light_1_desc:0 "HNLMS Karel Doorman (R81) (néerlandais ; Mme Karel Doorman (R81)) était un porte-avions de classe Colossus de la Marine royale néerlandaise. Anciennement navire britannique HMS Venerable, il fut vendu aux Pays-Bas en 1948 comme porte-avions d'attaque léger. En 1960, elle a participé au conflit de décolonisation de la Nouvelle-Guinée occidentale avec l'Indonésie. Au milieu des années 1960, le rôle a été modifié pour devenir un transporteur de guerre anti-sous-marine et seuls des avions et des hélicoptères ASW étaient transportés."
 HOL_carrier_hull_light_2_desc:0 "Après le carénage de 1964, Karel Doorman a servi le reste de sa carrière principalement en menant des patrouilles anti-sous-marines de l'OTAN dans l'Atlantique Nord, ne transportant plus d'avions d'attaque ou de combat dans le cadre de son escadre aérienne régulière. Karel Doorman a également régulièrement mené divers exercices près de l'Écosse au cours de sa carrière."
 HOL_carrier_hull_light_3_desc:0 "La conception de l'Enforcer a conduit la marine néerlandaise à construire le HNMLS Rotterdam et, comme dans la conception améliorée, le HNMLS Johan de Witt. Les deux navires sont considérés comme des navires de transport amphibie (également connus sous le nom de Landing Platform, Dock, LPD) dans la Marine royale néerlandaise."
 HOL_carrier_hull_light_4_desc:0 "Le JLSS dispose de 2 000 mètres de voies pour le transport de matériel tel que des véhicules à chenilles et à roues ou des conteneurs. Elle dispose d'un ascenseur et d'une grue pouvant supporter jusqu'à 40 tonnes, d'une installation de roulage pour les véhicules et d'une construction arrière de plage en acier pour accueillir le transfert de marchandises via une péniche de débarquement. Le navire est équipé de deux péniches de débarquement LCVP. Pour les opérations en mer, il disposera d'un grand pont d'hélicoptères avec des points d'atterrissage pour faire fonctionner deux Chinook simultanément, et d'un hangar avec une capacité de stockage pouvant accueillir jusqu'à 6 hélicoptères de taille moyenne, dont le NH-90, l'AS-532 Cougar, le CH-47F et l'AH-64D Apache."

 # Submarine Hulls #
 HOL_sub_hull_small_single_0:0 "GUPPY de classe morse"
 HOL_sub_hull_small_single_0_desc:0 "Remise en service à Mare Island le 5 juin 1952, Icefish a transité par la zone du canal et est arrivé à Groton, Connecticut, le 14 juillet. Elle y fut mise hors service le 29 juillet 1952 et reçut une conversion GUPPY IB. Remise en service le 10 décembre 1952 à Groton, elle resta dans cette zone pour effectuer divers tests jusqu'au 21 février 1953, date à laquelle elle fut mise hors service et transférée aux Pays-Bas. Elle a été commissionnée dans la Marine royale néerlandaise sous le nom de HNLMS Walrus (S802), le premier de ce nom."
 HOL_sub_hull_small_single_1:0 "Classe Zeehond"
 #HOL_sub_hull_small_single_1_desc:0 ""
 HOL_sub_hull_small_single_2:0 "Classe Zwaardvis"
 HOL_sub_hull_small_single_2_desc:0 "Le sous-marin de classe Zwaardvis (« Swordfish ») est une classe de sous-marins d'attaque conventionnels construits pour renforcer la Marine royale néerlandaise. Le gouvernement néerlandais a choisi de ne pas remplacer les deux sous-marins de la classe Zwaardvis par des sous-marins de la classe Walrus ou par des sous-marins d'une nouvelle conception."
 HOL_sub_hull_small_single_3:0 "Classe de morse"
 HOL_sub_hull_small_single_3_desc:0 "Le sous-marin de classe Walrus est la seule classe de sous-marins actuellement en opération dans la Marine royale néerlandaise. Les bateaux sont en service depuis 1990 et portent tous le nom de mammifères marins."
 HOL_sub_hull_small_single_4:0 "Morse Classe IP-W"
 HOL_sub_hull_small_single_4_desc:0 "En 2013, le contrat pour le programme de conservation de la classe Walrus (IP-W) a été signé. Le programme couvre la préservation de la peau de pression, le remplacement du sonar, du périscope de navigation et du système de combat GIPSY, l'amélioration des systèmes de communication et l'adaptation d'un certain nombre de systèmes de plate-forme. Les quatre bateaux doivent être modernisés d'ici 2019. Grâce au programme de conservation, les bateaux peuvent rester opérationnels jusqu'à la mi-2025."

 HOL_sub_hull_large_single_0:0 "Classe Zwaardvisch"
 HOL_sub_hull_large_single_0_desc:0 "Le HNLMS Zwaardvisch (S814) était le navire principal du sous-marin de classe Zwaardvisch de la Marine royale néerlandaise, basé sur la classe T britannique. Le sous-marin a été initialement commandé sous le nom de HMS Talent (P322) et construit par Vickers Armstrong, Barrow. Il servit principalement dans le Pacifique contre les Japonais pendant la guerre, opérant sous commandement opérationnel britannique et américain à Ceylan et en Australie."
 HOL_sub_hull_large_single_1:0 "Classe Dolfijn"
 HOL_sub_hull_large_single_1_desc:0 "Les sous-marins de classe Dolfijn de la Marine royale néerlandaise sont une classe de quatre sous-marins ; Dolfijn, Zeehond, Potvis et Tonijn. Ils ont été construits à la fin des années 1950 et au début des années 1960. Il s'agissait des premiers sous-marins indigènes construits aux Pays-Bas et pour la Marine royale néerlandaise après la Seconde Guerre mondiale. Aux Pays-Bas, ils sont également connus sous le nom de sous-marins « à trois cylindres »."
 HOL_sub_hull_large_single_2:0 "Classe Potvis"
 HOL_sub_hull_large_single_2_desc:0 "La Marine royale néerlandaise a envisagé d'utiliser la propulsion nucléaire pour le deuxième lot de sous-marins de la classe Dolfijn (appelés classe Potvis) et a donc reporté leur construction à la fin des années 1950 pour étudier la faisabilité de construire des sous-marins à propulsion nucléaire, mais il a finalement été décidé de ne pas utiliser la propulsion nucléaire pour les sous-marins de la classe Potvis. Cela signifiait que les deux sous-marins de la classe Potvis étaient construits avec une propulsion diesel-électrique comme ses précédents navires jumeaux."
 #HOL_sub_hull_large_single_3:0 "Rubis Class"
 #HOL_sub_hull_large_single_3_desc:0 "The Rubis class is a series of nuclear-powered attack submarines operated by the French Navy. The class comprises six vessels and they are the most compact nuclear attack submarines to date. All submarines of the class (except for Casabianca) are named after gemstones."
 #HOL_sub_hull_large_single_4:0 "Barracuda Class"
 #HOL_sub_hull_large_single_4_desc:0 "The Barracuda class (or Suffren class) is a nuclear attack submarine, designed by the French shipbuilder Naval Group (formerly known as DCNS and DCN) for the French Navy. It is intended to replace the Rubis-class submarines. Construction began in 2007 and the first unit was commissioned on 6 November 2020. Full operational capability is not anticipated until 2022."

 # Screen Hulls #
 HOL_screen_hull_medium_0:0 "Classe Van Amstel"
 HOL_screen_hull_medium_0_desc:0 "La classe Van Amstel était une classe de six frégates construites pendant la Seconde Guerre mondiale aux États-Unis et servant d'escorte de destroyers de classe Cannon pendant cette guerre. Après la guerre, les destroyers d'escorte furent prêtés à la marine néerlandaise dans le cadre du MDAP et, de 1950 à 1967, servirent de frégates de classe Van Amstel."
 HOL_screen_hull_medium_1:0 "Classe Van Speijk"
 HOL_screen_hull_medium_1_desc:0 "Les frégates de classe Van Speijk ont été construites pour la Marine royale néerlandaise dans les années 1960. Il s'agissait de versions des frégates britanniques de classe Leander équipées de radars néerlandais. La conception britannique a été choisie afin de permettre une construction rapide afin de remplacer les anciens destroyers d'escorte et d'assumer une partie des tâches de patrouille de l'OTAN"
 HOL_screen_hull_medium_2:0 "Classe Kortenaer"
 HOL_screen_hull_medium_2_desc:0 "La classe Kortenaer était une classe de frégates anti-sous-marines de la Marine royale néerlandaise. Comme certaines des autres frégates des années 1970 et 1980, elles étaient équipées d'un système de propulsion COGOG (combiné au gaz ou au gaz) avec des turbines à gaz de croisière et de sprint séparées."
 HOL_screen_hull_medium_3:0 "Karel Portier Classe"
 HOL_screen_hull_medium_3_desc:0 "Les frégates de classe Karel Doorman sont une série de huit navires polyvalents construits pour la Marine royale néerlandaise. Son homonyme est Karel Doorman, un officier de la marine néerlandaise dont le navire a été touché par une torpille japonaise lors de la bataille de la mer de Java en 1942 et qui, à la suite de quoi, a coulé avec son navire."
 HOL_screen_hull_medium_4:0 "Karel Doorman Classe Refit"
 HOL_screen_hull_medium_4_desc:0 "La Marine royale néerlandaise et la Marine belge ont décidé de moderniser les quatre frégates en reconstruisant le hangar et le pont d'hélicoptère du NH-90, ainsi que de remplacer le mât avant pour l'installation du nouveau radar de recherche de surface à réseau phasé Thales SeaWatcher 100 et du système de surveillance électro-optique Gatekeeper. Le premier navire à recevoir la mise à niveau a été le HNLMS Van Speijk (F828) en avril 2012, suivi du BNS Leopold I (F930), suivi du HNLMS Van Amstel (F831) et du BNS Louise Marie (F931) qui est actuellement en cours de modernisation. Les radars de recherche SMART-S 3D ne seront pas remplacés par SMART-S MK2."

 HOL_screen_hull_heavy_0:0 "Classe Hollande"
 HOL_screen_hull_heavy_0_desc:0 "Les destroyers de la classe Holland ont été construits pour la Marine royale néerlandaise dans les années 1950. Ce furent les premiers grands navires de guerre conçus et construits par les Néerlandais après la Seconde Guerre mondiale. Contrairement à la pratique antérieure de la marine néerlandaise, les navires portaient le nom de provinces plutôt que d'amiraux."
 HOL_screen_hull_heavy_1:0 "Classe Frise"
 HOL_screen_hull_heavy_1_desc:0 "Les destroyers de la classe Friesland ont été construits pour la Marine royale néerlandaise dans les années 1950. Il s'agissait d'une version modifiée plus grande de la classe Holland avec des machines plus puissantes."
 HOL_screen_hull_heavy_2:0 "Classe Trompe"
 HOL_screen_hull_heavy_2_desc:0 "La classe Tromp était composée de deux frégates construites pour la Marine royale néerlandaise dans les années 1970 pour remplacer les croiseurs de classe De Zeven Provinciën en tant que navires phares de l'escadron."
 HOL_screen_hull_heavy_3:0 "Classe Jacob van Heemskerck"
 HOL_screen_hull_heavy_3_desc:0 "La frégate de classe Jacob van Heemskerck était une classe de frégates de la Marine royale néerlandaise. Ils ont été conçus pour être une version de défense aérienne de la classe Kortenaer. L'hélicoptère a été remplacé par un système de missile sol-air (SAM) à moyenne portée standard et des radars associés."
 HOL_screen_hull_heavy_4:0 "Classe provinciale De Zeven"
 HOL_screen_hull_heavy_4_desc:0 "Les quatre frégates de classe De Zeven Provinciën sont des frégates de défense aérienne et de commandement très avancées en service dans la Marine royale des Pays-Bas (Koninklijke Marine). Cette classe de navires est également connue sous le nom de LCF (Luchtverdedigings- en commandofregat, frégate de défense aérienne et de commandement). Les navires sont similaires aux frégates allemandes de la classe Sachsen en termes de rôle et de mission."

 HOL_battle_hull_light_0:0 "Classe Trompe"
 HOL_battle_hull_light_0_desc:0 "La classe Tromp était une classe de navires de la Marine royale néerlandaise. La forme de la coque était également connue sous le nom d'Argonaut 600. Ils étaient conçus comme des « chefs de flottille » et leur rôle était d'être l'épine dorsale d'un escadron de destroyers modernes prévu à la même époque."
 HOL_battle_hull_light_1:0 "Classe Eendracht"
 HOL_battle_hull_light_1_desc:0 "La classe De Zeven Provinciën (également appelée classe Eendracht) était une classe de croiseurs légers. Ils ont été construits par Rotterdamsche Droogdok Maatschappij (RDM) et Wilton-Fijenoord pour la Marine royale néerlandaise. Le nom De Zeven Provinciën fait référence aux sept provinces qui formèrent la République néerlandaise en 1581."
 HOL_battle_hull_light_2:0 "Classe provinciale De Zeven"
 HOL_battle_hull_light_2_desc:0 "De Zeven Provinciën a subi une rénovation par RDM qui comprenait le retrait des deux tourelles arrière et l'installation d'un système SAM RIM-2 Terrier. Le manque de fonds n'a pas permis d'effectuer les mêmes modifications au De Ruyter, qui a été mis hors service en 1972. Son navire jumeau a emboîté le pas en 1975 ; les croiseurs ont été remplacés en service néerlandais par les deux frégates de classe Tromp."
