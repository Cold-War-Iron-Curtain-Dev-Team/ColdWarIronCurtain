 The_Media_Cycle_RUS: "Le cycle médiatique"

 #Events
 RUS_Crisis_End.0.d: "Après une semaine difficile et six jours de lutte de pouvoir brutale entre le Parlement et des émeutiers de plus en plus hostiles, le président Boris Eltsine a défié tous les pronostics et a réussi à consolider son emprise sur le pouvoir, et a mis un terme écrasant à la crise politique qui a suivi dans la jeune Fédération de Russie. S'il est difficile de dire avec certitude où Eltsine dirigera le pays, il est tout à fait clair que la Russie sera suffisamment stable pour suivre n'importe quelle direction que prendra Eltsine. Même si la communauté internationale n'a pas encore commenté la fin de la crise, nombreux sont ceux qui la regardent avec impatience, le souffle coupé."
 RUS_Crisis_End.1.d: "Avec la dissolution de l'Union soviétique il y a à peine deux ans, les troubles politiques et le chaos semblent avoir atteint le gouvernement russe lui-même, puisque le premier président russe, Boris Eltsine, a été officiellement destitué, et que le vice-président Alexandre Rutskoy est sur le point de le remplacer. Malgré cette mise en accusation, il est clair qu'Eltsine refuse simplement d'accepter cette décision et combattra probablement sa mise en accusation avec tout le pouvoir dont il dispose. Même s'il n'est pas clair si cette destitution va dégénérer en une crise de plus grande envergure, c'est certainement probable."
 RUS_Crisis_End.2.d: "Malgré tous les efforts du président russe autrefois établi, il semble que cela n'ait servi à rien, puisque le Parlement a réussi à destituer Boris Eltsine de son siège au pouvoir, et Alexandre Rutskoy a accédé au poste de président à sa place. Malgré la défaite dévastatrice d'Eltsine et les appels croissants au sang parmi le peuple russe, Eltsine est introuvable. Même si les autorités russes vont probablement déployer toutes les ressources disponibles pour retrouver l'ancien président, il n'est pas clair s'il a fui le pays ou non. Malgré le net revers et la déception croissante face à l'incapacité de rendre justice à l'ancien président, le pire de la crise est passé et la Russie peut enfin entamer son redressement."
 RUS_Crisis_End.3.d: "Malgré les efforts déployés par Eltsine et les autorités russes, la colère et la radicalisation du peuple russe n'ont fait que croître, atteignant aujourd'hui un point d'ébullition absolu alors que les informations faisant état d'émeutiers prenant d'assaut en masse le Kremlin ont atteint les oreilles internationales. Les détails exacts de la façon dont les émeutiers ont réussi à violer la sécurité du Kremlin et quelles étaient leurs intentions en prenant d'assaut le Kremlin sont encore inconnus. Ce que l'on sait cependant, c'est qu'Eltsine, s'il n'était pas la cible principale, était clairement pris entre deux feux, car sa sécurité était dépassée et Eltsine se retrouvait bientôt à la merci du peuple russe, qui est désormais complètement désillusionné par son règne. Comme un instantané du XIXe siècle, le peuple russe a pendu l'ancien président Eltsine par le cou près du zoo de Moscou. Alors que les actions barbares des émeutiers ont été condamnées au niveau international, l'avenir de la Russie et sa position internationale sont désormais plus inconnus que jamais."
 RUS_Crisis_End.4.d: "Alors que la crise constitutionnelle russe est enfin terminée et que l'ancien président Eltsine, de plus en plus détesté, est finalement destitué et déchu de son autorité, le vice-président Alexander Rutskoy a officiellement et publiquement investi ses fonctions de deuxième président de la Russie. Même si l'orientation politique de la présidence de Rutskoï est encore relativement inconnue, tout comme le sort des relations de la Russie avec le monde occidental, nombreux sont ceux qui regardent la situation avec optimisme. De nombreux Russes et citoyens de l'étranger espèrent que la présidence de Rutskoï apportera davantage de libéralisation politique et qu'il apportera la stabilité dont la Russie a désespérément besoin à la suite de la dernière crise constitutionnelle. Pourtant, pour l'instant, la communauté internationale ne peut que regarder avec impatience."

 #Russian Political Events
 RUS_90s.1.d: "Le Congrès des députés du peuple a fait aujourd'hui une annonce historique en déclarant que les lois russes avaient désormais la suprématie sur les lois soviétiques. Cette déclaration faisait officiellement de la Russie un État théoriquement indépendant, semblable aux autres républiques soviétiques qui avaient accédé à la souveraineté plus tôt. Cette annonce a été faite en raison de l'incapacité du gouvernement soviétique à mettre en oeuvre des réformes qui auraient pu empêcher la désintégration de l'Union soviétique. Suite à cette déclaration, des discussions ont eu lieu sur un nouveau traité d'union qui serait signé pour réorganiser l'Union soviétique. Le Premier ministre russe Boris Eltsine a exprimé sa volonté de travailler avec le gouvernement soviétique actuel pour que davantage de libéralisation et de réformes soient mises en oeuvre en Russie elle-même et dans l'Union soviétique dans son ensemble. Cette annonce est considérée comme une étape importante vers la désintégration éventuelle de l'Union soviétique et l'émergence de la Russie en tant que nation distincte."
 RUS_90s.2.d: "En ce jour historique, Boris Nikolaïevitch Eltsine, figure éminente de la politique soviétique, a été déclaré président de la Russie. Il s'agit de la première élection présidentielle libre de toute l'histoire du pays. La cérémonie d'inauguration a réuni plus d'un millier de réformateurs réunis au Congrès des députés du peuple pour assister à cet événement capital. La victoire d'Eltsine peut être attribuée à sa personnalité charismatique et à son engagement indéfectible à libérer la Russie des chaînes d'un régime communiste. Sa vision d'une Russie libre et démocratique a profondément trouvé un écho auprès de l'électorat, ce qui lui a valu une victoire éclatante aux élections. Même si le président de l'Union soviétique a félicité Eltsine pour sa victoire, il convient de noter que la conscience publique de l'animosité de Gorbatchev envers Eltsine soulève des questions sur la sincérité de cette annonce. Malgré cela, les partisans d'Eltsine restent optimistes quant à l'avenir de la Russie sous sa direction."
 RUS_90s.3.d: "Les dernières nouvelles ont confirmé que Nikolaï Ivanovitch Ryjkov, ancien Premier ministre de l'Union soviétique, a été élu président de la Russie. Il était largement spéculé que Ryzhkov deviendrait le prochain président, car il était le candidat préféré du Parti communiste de l'Union soviétique au pouvoir. Alors que le président de l'Union soviétique félicitait Ryzhkov pour ses nouvelles fonctions, Ryzhkov lui-même semblait rejeter l'approbation du secrétaire général Mikhaïl Gorbatchev. En fait, il aurait déclaré que « les paroles du secrétaire général ne sont rien ». Cependant, l'opposant de Ryzhkov, Boris Eltsine, a publiquement dénoncé la présidence de Ryzhkov. Eltsine a affirmé que les médias soviétiques avaient un parti pris en faveur de Ryzhkov et qu'ils n'avaient pas promu sa campagne autant qu'ils auraient dû. Il a demandé une révision des résultats des élections et exhorte les autorités à annuler cette décision."
 RUS_90s.4.d: "Dans une tournure surprenante des événements, le chef du Parti libéral-démocrate de l'Union soviétique, Vladimir Volfovitch Jirinovski, a été élu nouveau président de la RSFSR. Bien que son affiliation au PCUS au pouvoir ait donné lieu à de nombreuses spéculations selon lesquelles il n'était qu'un candidat fantoche, la récente décision de Jirinovski de réhabiliter à titre posthume le tsar et sa famille s'est révélée être une décision controversée, suscitant les critiques des partisans de la ligne dure du Parti communiste. Malgré sa réputation d'extrémiste et d'opinions déséquilibrées, Jirinovski a réussi à se hisser au sommet des institutions politiques russes. Son ascension à la présidence a suscité un mélange de curiosité et d'appréhension, alors que le monde attend de voir quelles seront ses prochaines actions. Beaucoup attendent avec impatience son premier discours officiel en tant que président, espérant avoir des indications sur sa vision de l'avenir de la Russie et de sa place dans la communauté mondiale. La population russe, en revanche, a largement considéré Jirinovski comme une figure ridicule. Cependant, avec sa récente élection, ils sont désormais contraints d'affronter la possibilité que ses opinions puissent avoir plus d'influence qu'ils ne le pensaient initialement. En tant que telle, la présidence de Jirinovski sera probablement une source d'examen et de débats intenses, tant en Russie qu'à l'étranger."
 RUS_90s.5.d: "Le paysage politique russe a été sous le choc aujourd'hui lorsque le 4e vice-président de la Russie, Boris Nemtsov, a été retrouvé mort après avoir visité sa datcha à Saint-Pétersbourg. Le président Vladimir Poutine a ouvert une enquête approfondie et a déclaré que l'auteur de cette attaque barbare serait exécuté sans procès. Movladi Baisarov, un chef de guerre tchétchène, est le premier suspect du meurtre, ce qui a été confirmé dans sa déclaration sur la question. Le président Poutine a nommé le Premier ministre Mikhaïl Khodorkovski vice-président par intérim de la Fédération de Russie."
 RUS_90s.6.d: "À la suite de la dissolution de la Douma d'État et de l'interdiction du Parti communiste, le président Gorbatchev a pris une nouvelle mesure audacieuse et a dissous le cabinet de Tchernomyrdine. Cette décision est considérée comme une tentative de saper toutes les formes d'influence d'Eltsine au sein du gouvernement. En remplacement du gouvernement précédent, le président Gorbatchev a nommé Boris Titov, un personnage relativement inconnu, au poste de Premier ministre. Dans son discours, Titov a annoncé la formation d'un nouveau cabinet, qui comprend plusieurs personnalités notables, notamment Ella Pamfilova comme ministre de l'Intérieur, Sergueï Lavrov comme ministre des Affaires étrangères, Yuri Skuratov comme ministre de la Défense, Alexandre Bortnikov comme chef du FSB, Nikolaï Kharitonov comme ministre de l'Agriculture, Anatoly Sobchak comme ministre de la Justice et Sergueï Baburin comme ministre de l'Économie. Ce nouveau cabinet devrait apporter une stabilité indispensable au gouvernement russe et aider le pays à traverser cette période de turbulences."
 RUS_90s.7.d: "Il y a eu récemment un développement sur la scène politique russe. Gennady Ziouganov, ancien secrétaire général du Parti communiste de la Fédération de Russie, a été emprisonné par le gouvernement dirigé par Gorbatchev. Cette décision a provoqué un émoi parmi les partisans du CPRF interdit, conduisant à une escalade des manifestations et des attaques antigouvernementales. Ziouganov, figure éminente du paysage politique russe, a été accusé de trahison et de trahison de l'État par le gouvernement. En conséquence, ses propriétés ont été saisies par les autorités. En réponse à son emprisonnement et à l'interdiction du PCRF, Ziouganov a appelé à une deuxième révolution contre le gouvernement dirigé par Gorbatchev. Cela a encore alimenté les troubles et l'instabilité dans le pays. "
 RUS_90s.8.d: "Le président russe Alexandre Rutskoï a nommé Ruslan Khasbulatov au poste de vice-président, suite à la démission de l'ancien vice-président Anatoly Sobchak. Le président a personnellement choisi Khasbulatov pour ce rôle, citant son expérience en tant qu'ancien président du Soviet suprême. Cependant, certains commentateurs ont suggéré que la nomination de Khasbulatov était davantage le résultat de ses relations étroites avec le président, dans la mesure où ils se sont tous deux opposés à Eltsine pendant la crise constitutionnelle. En outre, la décision du président de nommer Khasbulatov peut également être considérée comme un éloignement des politiciens libéraux de la Fédération de Russie qui sont opposés à l'opération militaire spéciale. Dans l'ensemble, la nomination de Khasbulatov est considérée comme une grève contre la faction libérale du pays."
 RUS_90s.9.d: "Dans un geste étonnant et inattendu, le président de la Fédération de Russie, Mikhaïl Gorbatchev, a annoncé la dissolution de la Douma d'État. Apparemment, cette décision a été prise en raison de l'incapacité du Parlement à mettre en oeuvre la politique de Gorbatchev. En outre, la tentative de destitution du président Gorbatchev a également joué un rôle dans cette démarche. De nombreux critiques politiques occidentaux ont qualifié cette décision de « recul » des nouvelles institutions démocratiques russes. Le président Gorbatchev a également appelé à la tenue de nouvelles élections parlementaires dans les mois qui suivront la dissolution. On s'attend à ce que Gorbatchev appelle également à l'interdiction du Parti communiste de la Fédération de Russie, puisque ce parti s'est opposé avec véhémence à la politique et à la direction du président Gorbatchev."
 RUS_90s.10.d: "Bien qu'elle soit l'une des républiques les plus importantes de l'Union soviétique, la République socialiste fédérative soviétique de Russie (RSFSR) n'a pas encore établi son propre hymne national régional. En fait, c'est la seule république de l'Union soviétique qui n'en possède pas, ce qui a incité le Congrès des députés du peuple à agir.\n\nEn réponse à cet oubli, le Congrès a proposé plusieurs candidats pour devenir l'hymne national de la Russie. L'espoir est qu'en créant un hymne unique et représentatif pour la RSFSR, la région pourra établir un sentiment d'identité et de fierté plus fort parmi ses citoyens.\n\nAlors que le processus de sélection est en cours, l'importance d'un hymne national ne peut être sous-estimée. Il sert de symbole des valeurs, de l'histoire et de l'identité culturelle d'une nation et peut susciter de puissantes émotions chez ceux qui l'entendent. C'est pourquoi le Congrès veille particulièrement à ce que l'hymne choisi incarne pleinement l'esprit de la Russie et de son peuple."
 RUS_90s.11.d: "En réponse à la Douma d'État dominée par les communistes et à l'impopulaire président Eltsine, le parti russe Iabloko et d'autres petits partis marginaux ont uni leurs forces pour former une puissante coalition appelée « Le Troisième Bloc ». Disposant d'un nombre important de sièges dans les institutions gouvernementales, cette alliance entend remettre en question l'ordre politique existant et apporter un changement indispensable. Le bloc a également annoncé son intention de présenter un candidat à l'élection présidentielle russe de 1996, bien que l'identité du candidat reste inconnue. Cette décision devrait bouleverser le paysage politique et offrir aux électeurs une alternative aux partis établis."
 RUS_90s.12.d: "Dans un développement soudain et étonnant, Mikhaïl Sergueïevitch Gorbatchev, ancien secrétaire général du Parti communiste de l'Union soviétique, a été annoncé comme nouveau président de la Russie. Gorbatchev, qui était initialement considéré comme un candidat juste pour rire, a réussi à renverser la situation face à ses rivaux politiques après que Yavlinsky et Lebedev ont accepté de le nommer sur la plateforme du Troisième Bloc. Gorbatchev a promis d'annuler les effets néfastes des réformes radicales de marché d'Eltsine et de réintroduire une certaine forme de démocratie socialiste dans les institutions russes. Il s'agit d'une tournure importante des événements, et nombreux sont ceux qui sont curieux de voir comment Gorbatchev va naviguer dans le paysage politique complexe du pays."
 RUS_90s.13.d: "L'ancien maire de Saint-Pétersbourg, Vladimir Poutine, qui a démissionné de son poste en raison de son opposition à l'invasion de l'Ukraine et du Kazakhstan par Rutskoï, a été nommé 3e président de la Russie, à la suite de ce que l'Occident a qualifié d'« élection truquée ». Vladimir Poutine l'a remporté de justesse avec 51,45 % des voix.\n\nLa Commission électorale centrale a ordonné une enquête sur une possible fraude électorale."
# Black October Standoff
 Black_October.0.t:0 "Crise constitutionnelle russe"
 Black_October.0.d:0 "Les tensions entre le président russe Boris Eltsine et le Soviet suprême, dirigé par Rouslan Khasbulatov et le vice-président Alexandre Rutskoy, ont dégénéré en une confrontation armée à la Maison Blanche russe à Moscou. Alors que des barricades sont érigées et que des unités militaires se mobilisent dans la capitale, la Russie se trouve au bord de la guerre civile."
 Black_October.0.a:0 "Un affrontement dangereux."
 Black_October.1.t:0 "L'impasse constitutionnelle"
 Black_October.1.d:0 "Suite au décret du président Eltsine dissolvant le Soviet suprême et à la destitution du président par le Parlement, Moscou a sombré dans une confrontation ouverte. Des manifestants et des volontaires armés se rassemblent autour de la Maison Blanche. La loyauté des militaires et des forces de sécurité intérieure déterminera l'avenir de la Fédération de Russie."
 Black_October.1.a:0 "Il faut rétablir l'ordre !"
