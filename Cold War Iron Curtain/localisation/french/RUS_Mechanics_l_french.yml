 RUS_HISTORY_Mari_El_DESC: "Autrefois foyer des tribus Mari au 5ème siècle, la République de Mari El aurait ses frontières administratives établies à l'origine comme un oblast autonome en 1920. Les industries les plus développées de la république comprennent la construction de machines, la métallurgie, le bois, le travail du bois et la transformation des aliments." 

 RUS_HISTORY_Adygea_DESC: "Initialement connue sous le nom d'oblast autonome de Tcherkess, Adyguée a reçu son nom moderne en juillet 1928. Adyguée, qui abrite le peuple Adyghé, possède des forêts abondantes et un sol riche, tout en étant l'une de nos régions les plus pauvres."
 RUS_HISTORY_Agin_Buryat_DESC: "Créé en 1937 et rebaptisé « Agin Buryat Okrug » en 1977, il est entouré par l'oblast de Chita, le concept d'unification avec l'oblast étant très populaire."
 RUS_HISTORY_Altai_Krai_DESC: "Nommé d'après les montagnes de l'Altaï, l'Altaï faisait partie du carrefour de nombreuses migrations ethniques historiques et fut le lieu où de nombreuses minorités furent déportées tout au long de 1942." 
 RUS_HISTORY_Amur_DESC: "Abritant de vastes réserves minérales, composées principalement d'or, d'argent, de titane, de molybdène, de tungstène, de cuivre et d'étain, l'oblast de l'Amour est une région avec une histoire complexe et un écosystème diversifié."
 RUS_HISTORY_Altai_Republic_DESC: "Le territoire qui constitue la République de l'Altaï a changé de mains entre plusieurs sociétés historiques, de l'empire Xiongnu aux premiers Khaganates turcs, en passant par les Ouïghours, les Kirghizes Ieniseain et bien d'autres, avant de tomber sous contrôle russe dans les années 1820. La République de l'Altaï abrite les parties russes des montagnes de l'Altaï, les glaciers de l'Altaï, ainsi que diverses rivières et lacs."
 RUS_HISTORY_Arkhangelsk_DESC: "Autrefois foyer des peuples finno-urgiques, l'oblast d'Arkhangelsk est devenu en 1708 un élément crucial de la gouvernance de l'Empire russe, et finalement l'un des champs de bataille les plus actifs pendant la guerre civile russe. Aujourd'hui, l'oblast est l'une des multiples régions industrielles de Russie, abritant une industrie développée de la pêche, de la foresterie, du travail du bois, de la cellulose et du papier, les principales entreprises industrielles de l'oblast d'Arkhangelsk étant les chantiers navals d'Arkhangelsk et de Severodvinsk, les usines de pâtes et papiers de Koryazhma et de Novodvinsk et une usine d'extraction de bauxite à Severoonezhsk."
 RUS_HISTORY_Astrakhan_DESC: "Foyer historique des Bujans, l'une des nombreuses tribus slaves qui allaient évoluer vers la Russie moderne, l'oblast d'Astrakhan est également le lieu où « l'opération Vega » a été menée, où le gouvernement soviétique a effectué quinze essais nucléaires souterrains en profondeur pour des « explosions nucléaires pour l'économie nationale » sur le site Vega dans le désert de Ryn dans les années 1980."
 RUS_HISTORY_Bashkortostan_DESC: "Tirant son nom du groupe ethnique Bachkir, la République du Bachkortostan est située entre la Volga et les montagnes de l'Oural. Étant l'une des régions de Russie les plus développées en termes de production interrégionale, le Bachkortostan possède un secteur agricole important, la plus grande industrie de la république étant la transformation chimique."
 RUS_HISTORY_Belgorod_DESC: "Les frontières administratives modernes de l'oblast de Belgorod ont été établies le 6 janvier 1954. L'oblast fait partie de la région économique centrale de la Terre Noire et du District fédéral central. Plus de 40 % des réserves connues de fer de la Russie sont concentrées dans l'oblast, dont l'économie dépend largement de ses énormes richesses en ressources minérales et de ses terres noires."
 RUS_HISTORY_Bryansk_DESC: "L'histoire de l'oblast de Briansk est complexe, ses frontières actuelles n'ayant été établies que le 5 juillet 1944. L'économie de l'oblast est en grande partie centrée sur les lignes ferroviaires situées à Briansk même, ainsi que sur l'aéroport international de Briansk. Les principales exportations de l'oblast sont le fer, l'acier, le bois et le papier, près de la moitié de ses exportations étant dirigées vers la Biélorussie."
 RUS_HISTORY_Buryatia_DESC: "Avec une histoire complexe, embourbée dans la violence, la République « moderne » de Bouriatie telle qu'on la voit aujourd'hui n'a été divisée qu'en 1958. Engloutissant une grande partie du lac Baïkal, la Bouriatie possède de multiples destinations touristiques populaires, les plus grands secteurs économiques de la région étant celui des produits agricoles et commerciaux, comprenant le blé, les légumes, les pommes de terre, le bois, le cuir, le graphite et bien plus encore."
 RUS_HISTORY_Chechnya_DESC: "Autrefois partie intégrante de la République soviétique autonome tchétchène-ingouche, la Tchétchénie était une destination populaire auprès de nombreux Ukrainiens fuyant la famine dans les années 1930, avec plus de 60 % des Tchétchènes et des Ingouches périssant en 1944 à cause de la Seconde Guerre mondiale. Avec la montée des mouvements d'insurrection et l'hostilité à l'égard de Moscou, il faut faire preuve de prudence dans la gestion de cette région."
 RUS_HISTORY_Chita_DESC: "Créée le 16 septembre 1937, Tchita était autrefois la capitale de la République d'Extrême-Orient, qui a ensuite fusionné avec la Russie en 1922, un mois avant la constitution de l'URSS. Actuellement, l'oblast est riche en métaux ferreux et non ferreux, rares et précieux, en charbon, en charbon de bois et en eaux minérales. La plupart de ces gisements sont situés près de Krasnokamensk, site du complexe minier et chimique Priargunsky (PMCC)."
 RUS_HISTORY_Chukotka_DESC: "L'Okrug autonome de Tchoukotka a été officiellement créé le 26 octobre 1921 et, pendant la Seconde Guerre mondiale, il est devenu le site d'une production d'étain en croissance rapide. Bien que le transport aérien ne soit pratiquement pas routier, il constitue le principal mode de transport de passagers et abrite d'importantes réserves de pétrole, de gaz naturel, de charbon, d'or et de tungstène."
 RUS_HISTORY_Chuvashia_DESC: "La République de Tchouvachie, ou simplement Tchouvachie, faisait autrefois partie de l'éphémère « État d'Idel-Oural » en 1917, et allait finalement devenir l'ASSR de Tchouvachie en 1925. Aujourd'hui, Tchouvache est la région la plus peuplée et la plus fertile de la région de la Moyenne Volga, et est le centre de la Russie pour la culture du houblon et est célèbre dans tout le pays pour le brassage de la bière." 
 RUS_HISTORY_Dagestan_DESC: "Bénéficiant d'une histoire tumultueuse, changeant constamment de mains entre les propriétaires perses et russes, les frontières du Daghestan moderne ont été établies en 1921 sous le nom de République soviétique autonome du Daghestan. Peuplé majoritairement d'Avars, les Russes sont en réalité une minorité dans cette région, la majorité de sa population étant composée de musulmans sunnites de l'école Shafi. La plus grande industrie du Daghestan se concentre sur la production pétrolière, l'ingénierie, les produits chimiques, la construction de machines, la fabrication textile, la transformation des aliments et le bois."
 RUS_HISTORY_Ingushetia_DESC: "Pendant très longtemps, l'Ingouchie et la Tchétchénie ont occupé la même RSSA, en tant que République soviétique autonome tchétchéno-ingouche. Visée par de multiples génocides et nettoyages ethniques, l'Ingouchie n'obtiendra ses frontières reconnaissables actuelles que dans les années 1990. Aujourd'hui, c'est l'une des régions les plus pauvres de Russie." 
 RUS_HISTORY_Irkutsk_DESC: "L'oblast d'Irkoutsk, l'un des plus grands oblasts de Sibérie, abrite l'Université d'État d'Irkoutsk et a connu un développement rapide dans les années 1950. De nos jours, les plus grandes industries d'Irkoutsk sont centrées sur les métaux, l'énergie, l'exploitation forestière, les pétroles et combustibles, la construction de machines, les produits chimiques, l'industrie alimentaire et l'hydroélectricité. "
 RUS_HISTORY_Ivanovo_DESC: "Creuset historique de cultures, l'oblast industriel d'Ivanovo a été créé en 1929 et commencera à adopter ses frontières administratives « modernes » en 1936. L'oblast d'Ivanovo est également le plus petit oblast en termes de superficie en Russie."
 RUS_HISTORY_Jewish_Autonomous_Oblast_DESC: "Bénéficiant d'une histoire unique en ce sens qu'elle a pu exister, malgré l'aversion de Lénine et des premiers bolcheviks pour la religion et les politiques athées, l'oblast autonome juif a généralement été autorisé à préserver sa culture en paix et a même réussi à encourager l'immigration des résidents américains. Elle possède une industrie bien développée et une agriculture dotée d'un réseau de transport dense. L'oblast existe également en tant que zone économique libre."
 RUS_HISTORY_Kabardino_Balkaria_DESC: "Officiellement connue sous le nom de République de Kabardino Balkarie, la République s'enorgueillit de nombreuses plaines et est située dans les montagnes du Caucase du Nord. Les Russes ne constituent également que le troisième groupe ethnique de la région, les Kabardines constituant la majorité."
 RUS_HISTORY_Kalinigrad_DESC: "Autrefois connu sous le nom de Koenigsburg, le territoire a été transféré à juste titre à la Russie dans le cadre de l'accord de Potsdam en 1945, les Russes constituant la majorité de la population de la région. Bénéficiant des plus grands gisements d'ambre au monde, ainsi que de sa proximité générale avec l'Union européenne, en font l'un des oblasts les plus riches de Russie."
 RUS_HISTORY_Kalmykia_DESC: "La République de Kalmoukie a vu ses frontières administratives actuelles établies en 1920, tandis que le bouddhisme constitue la religion majoritaire de la région. La Kalmoukie possède un secteur agricole développé, les autres industries étant celles de la transformation alimentaire, du pétrole et du gaz."
 RUS_HISTORY_Kaluga_DESC: "Bien que le territoire de l'oblast de Kalouga soit peuplé depuis l'Antiquité, ses frontières modernes n'ont été établies qu'en 1944. Aujourd'hui, l'oblast de Kalouga est l'un des oblasts les plus avancés économiquement de Russie et est connu pour sa forte concentration d'investissements étrangers, ainsi que pour ses importants fabricants de turbogénérateurs, de moteurs à turbine à gaz, d'équipement ferroviaire, de matériaux de construction, d'électronique, de systèmes optiques, etc." 
 RUS_HISTORY_Kamchatka_DESC: "L'oblast du Kamtchatka, centré autour de la ville de Petropavlovsk-Kamchatsky, est une région riche en ressources, abritant des réserves de charbon, d'or, de mica, de pyrites et de gaz naturel. C'est également la base d'attache de la flotte sous-marine russe du Pacifique."
 RUS_HISTORY_Karachay_Cherkesssia_DESC: "Malgré son histoire tumultueuse, abolie en novembre 1943 sous des accusations de collaboration nazie, et rétablie seulement en 1957, la République de Karachay Cherkess est majoritairement peuplée par le peuple Karachay, tandis que plus de 64 % de sa population adhère à l'islam." 
 RUS_HISTORY_Karelia_DESC: "Malgré ce que prétendent les irrédentistes finlandais, l'oblast de Carélie est incontestablement russe, comme en témoigne la population de la région. Malgré les multiples conflits dans la région, tels que la guerre d'hiver et la guerre de continuation, la Carélie est l'un des principaux territoires de la Russie. Avec une industrie composée principalement de forêts, d'exploitation minière, de tourisme, d'agriculture, de pêche et de papier, le revenu par habitant de la région est globalement inférieur à la moyenne nationale." 
 RUS_HISTORY_Kemerovo_DESC: "Bien que la région soit peuplée depuis un certain temps et que sa plus ancienne ville ait été fondée en 1618, l'oblast a été officiellement créé en 1943. Aujourd'hui, la région nord de l'oblast est principalement constituée d'agriculture et d'un réseau ferroviaire dense, tandis que l'oblast est dans son ensemble l'une des régions industrielles les plus importantes de Russie. Le sud de l'oblast est dominé par les industries métallurgiques et minières, ainsi que par l'ingénierie mécanique et la production chimique."
 RUS_HISTORY_Khabarovsk_DESC: "Officiellement connu sous le nom de Kraï de Khabarovsk, ses frontières administratives modernes ont été tracées en 1938. Aujourd'hui, c'est le territoire russe le plus industrialisé d'Extrême-Orient, avec un complexe militaro-industriel très développé et une industrie minière sous-développée, malgré ses importants gisements de ressources."
 RUS_HISTORY_Khakassia_DESC: "Les frontières modernes de la République de Khakassie ont été établies en 1930 et ont une longue histoire de colonisation directe par la Russie. Malgré cela, les Khazaks constituent aujourd'hui la majorité de la population de la région, les principales industries étant l'extraction du charbon, l'exploitation du minerai et du bois."
 RUS_HISTORY_Khanty_Mansi_DESC: "Créé en 1930, l'Okrug-Yugra autonome Khanti-Mansi est l'un des plus importants producteurs de pétrole de Russie et, bien que majoritairement chrétien orthodoxe, une partie importante de la population prétend être spirituelle et ne s'identifie à aucune religion."
 RUS_HISTORY_Kirov_DESC: "L'oblast de Kirov a connu de nombreuses difficultés au cours de sa vie administrative, ayant connu des combats en 1918-1919 pendant la guerre civile, et étant frappé par la famine en 1921-1922, tout en étant même touché par une épidémie de typhus en 1922. Aujourd'hui cependant, Kirov fait partie de la zone agricole Volga-Vyatka, avec 27 % du territoire de la région étant consacré à l'agriculture." 
 RUS_HISTORY_Komi_DESC: "Autrefois connue sous le nom de zone autonome de Komi-Zyrian en 1921, elle adoptera ses frontières administratives modernes en tant que RSSA en 1936. Komi abrite d'importantes industries de transformation du pétrole, du bois, du travail du bois, du papier, du gaz naturel et de l'énergie électronique."
 RUS_HISTORY_Koryak_DESC: "Officiellement connus sous le nom d'Okrug autonome de Koryak, les Koryaks indigènes constituent le deuxième groupe ethnique de la région, mais ont globalement l'une des plus petites populations régionales de Russie."
 RUS_HISTORY_Kostroma_DESC: "Malgré la longue histoire de la région, l'oblast de Kostroma sera officiellement créé jusqu'en 1944. Le secteur économique le plus important de l'oblast est l'industrie des transports, avec des chemins de fer à 6-7 heures de trajet de Moscou, l'aéroport de Kostroma laissant régulièrement les gens voler dans l'oblast et irrégulièrement vers Moscou."
 RUS_HISTORY_Krasnodar_DESC: "Le territoire de Krasnodar a été officiellement fondé en 1937 et est historiquement l'un des plus grands producteurs de céréales de Russie. L'économie actuelle de Krasnador est centrée autour de la Société autonome d'énergie thermique, de la distribution de gaz Gazprom à Krasnodar et des engrais chimiques Evrokhim." 
 RUS_HISTORY_Krasnoyarsk_DESC: "Les habitants de cette région ayant élu domicile dès 40 000 avant notre ère, la colonisation russe n'a commencé qu'au XVIIe siècle, avec la création du kraï de Krasnoïarsk lui-même en 1991. 95 % de l'industrie du kraï de Krasnoïarsk est centralisée à l'intérieur de la frontière sud de la région et est centrée sur la métallurgie, l'énergie, la foresterie, les produits chimiques et le raffinage du pétrole."
 RUS_HISTORY_Kurgan_DESC: "Les frontières administratives de l'oblast de Kourgan ont été établies par décret du Présidium du Soviet suprême de l'URSS en 1943. L'oblast est connu pour les grands oléoducs et gazoducs qui traversent son territoire et sont reliés aux oblasts voisins. Sans grande industrie propre, l'économie de l'oblast de Kourgan est centrée sur la production de transformation agricole, l'assemblage et l'emballage de produits finis." 
 RUS_HISTORY_Kursk_DESC: "Abritant la célèbre bataille de Koursk, les frontières de l'oblast de Koursk ont constamment été déplacées et modifiées jusqu'à ce que ses frontières actuelles soient solidifiées en 1954. L'économie de l'oblast est centrée sur ses industries d'ingénierie, d'énergie électrique, de métallurgie, de chimie et de transformation alimentaire. Cependant, avec l'effondrement de l'Union soviétique, l'industrie de la région s'est rapidement effondrée."
 RUS_HISTORY_Lenningrad_DESC: "Créé en 1927, l'oblast de Léningrad a toujours joué un rôle indéniable dans l'économie et le gouvernement de l'Union soviétique et surtout de la Russie. C'est l'un des oblasts les plus industrialisés de Russie et abrite d'importants noeuds ferroviaires directement reliés à Moscou."
 RUS_HISTORY_Lipetsk_DESC: "Bien qu'il soit habité depuis l'Antiquité, l'oblast moderne ne sera formé qu'en 1954. L'oblast de Lipetsk abrite de grandes industries de transformation du fer et d'ingénierie mécanique, Lipetsk elle-même étant la ville la plus industrialisée de l'oblast." 
 RUS_HISTORY_Magadan_DESC: "Alors que le territoire de l'oblast de Magadan changerait de mains administratives à plusieurs reprises, ses frontières actuelles ne seraient établies qu'en 1991. L'oblast lui-même possède d'importants intérêts miniers, avec de profondes réserves d'or et d'argent, et n'a pratiquement aucun secteur agricole à proprement parler, la ville de Magadan étant le seul centre industriel de l'oblast." 
 RUS_HISTORY_Mordovia_DESC: "Bien que l'histoire de la République de Mordavie remonte à la domination mongole, ses frontières administratives modernes n'ont été établies qu'en 1930. Les industries les plus développées de Mordovie sont celles de la construction de machines, des produits chimiques, du travail du bois et de l'industrie alimentaire."
 RUS_HISTORY_Moscow_DESC: "Abritant l'une des multiples capitales historiques de la Russie, l'oblast de Moscou lui-même ne sera établi tel qu'on le connaît aujourd'hui qu'en 1929. L'oblast de Moscou lui-même abrite la Russie, possède la deuxième plus grande production industrielle du pays, juste derrière la ville de Moscou elle-même, et abrite diverses industries et géographie." 
 RUS_HISTORY_Murmansk_DESC: "Changeant de mains à plusieurs reprises au cours de l'histoire, l'oblast de Mourmansk lui-même sera officiellement formé en 1938. L'oblast compte plus de 700 gisements minéraux, son industrie étant principalement centrée sur l'extraction des ressources."
 RUS_HISTORY_Nenets_DESC: "Officiellement connu sous le nom d'Okrug autonome des Nenets, ses frontières administratives modernes ne seront établies qu'en 1929. L'Okrug est surtout connu pour sa vaste industrie pétrolière et gazière, qui représente 99 % de son activité industrielle." 
 RUS_HISTORY_Nizhny_Novgorod_DESC: "L'oblast de Nijni Novgorod, l'un des territoires les plus importants historiquement de la Russie, ne sera officiellement créé qu'en 1929 et a connu de nombreux changements de nom depuis lors. L'oblast se classe au 7ème rang en termes de production industrielle de Russie, l'industrie de transformation dominant l'économie locale."
 RUS_HISTORY_North_Ossetia_Alania_DESC: "Officiellement formée et divisée en 1921, connue sous le nom de République socialiste soviétique autonome de montagne, avant de recevoir son nom moderne actuel. Historiquement, l'économie de la région a été constamment en difficulté, mais des rapports récents indiquent le potentiel de stabilité économique de la région."
 RUS_HISTORY_Novgorod_DESC: "Autrefois partie de l'oblast de Léningrad, l'oblast de Novgorod ne sera officiellement créé qu'en 1944, avec la ville de Novgorod en son centre. Les principales entreprises industrielles de l'oblast sont des usines chimiques, principalement spécialisées dans la production d'engrais."
 RUS_HISTORY_Novosibirsk_DESC: "Bien qu'autrefois peuplé par les Tatars au Moyen Âge, les frontières actuelles de l'oblast ont été établies entre 1943 et 1944. Même si la région de Novossibirsk affiche des taux de croissance industrielle relativement élevés, son PIB par habitant est inférieur à la moyenne nationale."
 RUS_HISTORY_Chelyabinsk_DESC: "Autrefois habitée par les tribus bachkirs du sud de l'Oural, l'oblast de Tcheliabinsk a reçu ses frontières modernes en 1943. L'oblast de Tcheliabinsk abrite des recherches nucléaires top-secrètes depuis les années 1940 et son économie est centrée sur la métallurgie."
 RUS_HISTORY_Omsk_DESC: "Autrefois partie du kraï sibérien, les frontières administratives actuelles de l'oblast d'Omsk seraient établies en 1944. L'économie d'Omsk est en grande partie industrielle et possède un secteur financier développé. Omsk a été classée par Forbes comme la 6ème meilleure ville de Russie pour les affaires."
 RUS_HISTORY_Orenburg_DESC: "Autrefois connue sous le nom d'oblast de Chkalov, l'oblast d'Orenbourg est l'un des principaux secteurs agricoles de Russie car son climat est idéal pour cultiver de grandes quantités de blé, de seigle, de tournesols, de pommes de terre, de pois, de haricots, de maïs et de courges." 
 RUS_HISTORY_Oryol_DESC: "Bien qu'il s'agisse d'un territoire clé dans l'histoire de la Russie, les frontières actuelles de l'oblast d'Orel seront solidifiées en 1944. L'économie de l'oblast d'Orel est centrée sur l'industrie légère et la transformation alimentaire." 
 RUS_HISTORY_Penza_DESC: "Initialement centre régional russe construit en 1663, les frontières de Penza ont aujourd'hui été solidifiées en 1939. Penza fait partie de la zone économique de la Volga et est l'un des plus grands producteurs russes de blé, de seigle, d'avoine, de mil, de sarrasin, de céréales, de cultures fourragères, de légumes, de pommes de terre, de moutarde et de viande." 
 RUS_HISTORY_Perm_DESC: "Créée en 1938 et de 1940 à 1957, elle a été rebaptisée Oblast de Molotov. Désormais connue sous le nom d'oblast de Perm (probablement rebaptisé Krai de Perm à l'avenir), son économie est centrée sur la métallurgie des non-ferreux et possède d'importants gisements minéraux de métaux rares."
 RUS_HISTORY_Primorsky_DESC: "Le territoire du Primorsky Krai a changé de mains à plusieurs reprises, des États sibériens, de la Chine et finalement de la Russie, le Primorsky Krai lui-même ne sera créé qu'en 1938. L'une des économies les plus équilibrées d'Extrême-Orient, c'est aussi la plus grande. Cependant, son secteur économique le plus important est la production alimentaire." 
 RUS_HISTORY_Pskov_DESC: "La première mention du nom de Pskov remonte à 903 après JC, et elle ferait temporairement partie de l'oblast de Léningrad en 1927 et deviendrait son propre oblast en 1944. La majorité de la production économique de la région est centrée sur l'industrie électrotechnique et l'industrie alimentaire." 
 RUS_HISTORY_Rostov_DESC: "Étant la 6ème région la plus peuplée de Russie, l'oblast de Rostov s'identifie comme appartenant à plus de 157 groupes ethniques, le plus grand d'entre eux étant russe. Les principales industries de l'oblast de Rostov se concentrent sur l'agriculture, l'agroalimentaire, l'industrie lourde, le charbon et l'industrie automobile." 
 RUS_HISTORY_Ryazan_DESC: "Autrefois élément crucial de la gouvernance de la Russie kiévienne, l'oblast de Riazan lui-même a été créé à partir des oblasts de Moscou et de Voronej en 1937. L'oblast de Riazan fait partie de la région économique centrale, avec ses plus grandes industries centrées sur l'élevage." 
 RUS_HISTORY_Sakha_DESC: "La République de Sakha représente plus de la moitié du District fédéral d'Extrême-Orient et a également été le théâtre de la dernière étape de la guerre civile russe. Aujourd'hui, le peuple Sahka constitue toujours la majorité de la population de la région, le secteur économique le plus puissant de la République étant l'exploitation minière." 
 RUS_HISTORY_Sakhalin_DESC: "Malgré les revendications territoriales du Japon, la région de Sakhaline fait incontestablement partie de la Russie depuis la fin de la Seconde Guerre mondiale. Officiellement, les frontières actuelles de l'oblast de Sakhaline auraient été établies en 1947 et ont récemment retenu l'attention internationale en raison de l'augmentation des forages pétroliers dans la région." 
 RUS_HISTORY_Samara_DESC: "Autrefois gouvernorat de l'Empire russe, avec la montée de l'Union soviétique, une grande partie de son territoire a été transférée à l'oblast de la Moyenne Volga, les frontières officielles de l'oblast de Samara étant établies en 1936. Samara est l'un des rares sujets fédéraux à obtenir l'approbation pour mettre en oeuvre des emprunts obligataires externes." 
 RUS_HISTORY_Saratov_DESC: "Avec ses frontières modernes établies en 1957, l'oblast de Saratov abrite également de petits gisements de pétrole et de gaz ainsi que des gisements d'eau minérale." 
 RUS_HISTORY_Smolensk_DESC: "L'oblast de Smolensk, officieusement appelé Smolenshchina, a été créé en 1937 et possède une économie diversifiée, exportant de grandes quantités de nitrate d'ammonium, d'engrais, de blé et de bois." 
 RUS_HISTORY_Stavropol_DESC: "Le kraï de Stavropol, également connu sous le nom de Stavropolye, est l'un des sujets fédéraux les plus multiethniques de Russie, comptant trente-trois groupes ethniques. Le Krai lui-même a été créé en 1943, avec son économie moderne et actuelle soutenue par un secteur agricole bien développé et de vastes canaux d'irrigation." 
 RUS_HISTORY_Sverdlovsk_DESC: "Les frontières administratives actuelles de l'oblast de Sverdlovsk ont été établies entre 1932 et 1934 et ont été confrontées à des difficultés économiques sous l'Union soviétique, et elles le sont encore aujourd'hui. Cependant, son économie connaît une croissance lente, centrée autour d'une industrie des transports importante, mais encore obsolète."
 RUS_HISTORY_Tambov_DESC: "Avec une histoire riche, surtout connue pour la rébellion paysanne de Tambov pendant la guerre civile, l'oblast lui-même verra ses frontières administratives modernes établies en 1939." 
 RUS_HISTORY_Tatarstan_DESC: "Alors que le Tatarstan est une région à l'histoire riche et profonde et abrite un peuple fier, qui a même tenté de se créer un État indépendant pendant la guerre civile russe, le Tatarstan constitue aujourd'hui une partie centrale du territoire russe. Les frontières actuelles du Tatarstan ont été établies dans les années 1920 et constituent aujourd'hui l'une des régions les plus développées et industrialisées de Russie."
 RUS_HISTORY_Tomsk_DESC: "L'oblast de Tomsk a été soumis à de multiples organisations administratives au cours de sa vie, ses frontières actuelles ayant été fixées en 1944. La région est riche en pétrole et en gaz, ainsi qu'en métaux ferreux et non ferreux." 
 RUS_HISTORY_Tula_DESC: "Situé dans le District fédéral central de Russie, l'oblast de Toula abrite plus de 1 600 rivières et ruisseaux. Les oblasts de Toula sont un centre industriel important avec des industries métallurgiques, d'ingénierie, d'extraction de charbon et chimiques." 
 RUS_HISTORY_Tuva_DESC: "Autrefois partie historique des dynasties impériales chinoises et de la Mongolie, la République de Touva est désormais indéniablement russe, ayant été officiellement annexée en 1944. L'économie de Touva est principalement centrée sur l'exploitation minière et son taux de chômage est supérieur à la moyenne nationale."
 RUS_HISTORY_Tver_DESC: "Autrefois connu sous le nom d'oblast de Kalinin, l'oblast de Tver sera renommé et créé jusqu'en 1990. L'oblast de Tver possède une économie forte, soutenue par une forte industrie automobile et aéronautique."
 RUS_HISTORY_Tyumen_DESC: "L'oblast de Tioumen est l'un des oblasts les plus uniques de Russie, dans le sens où il a juridiction sur deux okrugs autonomes (l'Okrug autonome des Khanty-Mansi et l'Okrug autonome de Yamalo Nenets). L'économie de Tioumen est largement soutenue par une industrie pétrolière et gazière forte, qui possède le niveau de production pétrolière et gazière le plus élevé de Russie."
 RUS_HISTORY_Udmurtia_DESC: "Initialement connue sous le nom d'oblast autonome Votyak, la République d'Oudmourtie recevra son nom officiel en 1932 en tant qu'ASSR. Le peuple oudmourte constitue la majorité de la population de la République et possède son propre folklore local unique."
 RUS_HISTORY_Ulyanovsk_DESC: "Autrefois appelé Simbirsk, l'oblast d'Oulianovsk recevrait son nom en 1924. Actuellement, Oulianovsk bénéficie d'une industrie touristique en croissance constante, complétée uniquement par son écosystème diversifié."
 RUS_HISTORY_Ust_Orda_Buryat_DESC: "L'Okrug autonome d'Oust-Orda Bouriate est un sujet fédéral indépendant de la Fédération de Russie"
 RUS_HISTORY_Vladimir_DESC: "Une grande partie du territoire de l'oblast de Vladimir faisait autrefois partie de l'oblast d'Ivanovo, gagnant une grande partie de son territoire administratif moderne en 1944. L'économie de la région est en grande partie centrée autour du chemin de fer à voie étroite de tourbe de Gusevskoye."
 RUS_HISTORY_Volgograd_DESC: "Autrefois connue sous le nom d'oblast de Stalingrad, l'oblast de Volgograd recevrait son nom actuel en 1961, en pleine déstalinisation. Les principales branches économiques de l'oblast sont l'agriculture, la production alimentaire, l'industrie lourde, le gaz et le raffinage du pétrole." 
 RUS_HISTORY_Vologda_DESC: "Créé en 1937, l'oblast de Vologda est connu pour sa longue histoire, avec une économie largement soutenue par ses industries métallurgiques, alimentaires et forestières, l'agriculture de la région tournant presque principalement autour de l'élevage de bétail." 
 RUS_HISTORY_Voronezh_DESC: "Créé en 1937, l'oblast de Voronej est connu pour de nombreuses choses, comme l'église rupestre de la Mère de Dieu sicilienne, tout en bénéficiant d'une économie agro-industrielle équilibrée."  
 RUS_HISTORY_Yamalo_Nenets_DESC: "L'Okrug autonome Yamalo-Nenets a été créé en 1930, dans l'oblast de l'Oural. L'Okrug est l'une des sources de gaz naturel les plus importantes de Russie, avec plus de 90 % du gaz naturel russe produit dans l'Okrug." 
 RUS_HISTORY_Yaroslavl_DESC: "Créé en 1936, l'oblast de Iaroslavl a connu une industrialisation rapide dans le cadre des premiers plans quinquennaux de Staline. Aujourd'hui, les principaux secteurs économiques de l'oblast de Yaroslavl sont les industries mécaniques et métallurgiques. L'industrie de la région de Iaroslavl est également activement impliquée dans l'économie étrangère, dans la CEI et dans d'autres pays étrangers."
 

