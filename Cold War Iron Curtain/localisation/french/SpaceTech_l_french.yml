l_french:

# Spacecraft Construction
 space_folder:0 "Structure et propulsion du vaisseau spatial"
 space_folder_desc:0 "Le développement constant des structures et des technologies de propulsion des engins spatiaux est essentiel à l'établissement et à l'avancement d'un programme spatial."
 woodmetal_frames:0 "Cadres de navires en bois/métal"
 woodmetal_frames_short:0 "Cadres en bois/métal"
 woodmetal_frames_desc:0 "La première génération de fusées était construite à partir de cadres en bois et en métal, en particulier les fusées allemandes de la Seconde Guerre mondiale. À mesure que les fusées s'approchent de la stratosphère et au-delà, des matériaux plus avancés seront nécessaires."
 pressure_vessel1:0 "Réservoirs sous pression de 2 à 4 mètres"
 pressure_vessel1_short:0 "Navires de 2 à 4 mètres"
 pressure_vessel1_desc:0 "Nous avons développé la capacité de fabriquer des fuselages de fusée d'un diamètre de 2 à 4 mètres. La petite taille limite la charge utile et la poussée."
 stainless_steel:0 "Acier inoxydable"
 stainless_steel_desc:0 "L'acier inoxydable est un alliage qui empêche le fer de rouiller. Il offre la solidité de l'acier avec une résistance à la corrosion et un point de fusion élevé. Cependant, son poids limitera ses applications."
 continuous_pressurization:0 "Pressurisation continue"
 continuous_pressurization_short:0 "Suite. Pressurisation"
 continuous_pressurization_desc:0 "Est nécessaire pour maintenir les propulseurs dans le vide de l'espace. Il est essentiel pour les voyages spatiaux et peut augmenter le rang d'un vaisseau spatial. Sans cela, les moteurs auraient du mal à fonctionner une fois hors de l'atmosphère terrestre."
 pressure_vessel2:0 "Réservoirs sous pression de 4 à 8 mètres"
 pressure_vessel2_short:0 "Navires de 4 à 8 mètres"
 pressure_vessel2_desc:0 "Nous avons développé la capacité de fabriquer des fuselages de fusée d'un diamètre de 4 à 8 mètres. Les fusées plus grosses amélioreront les performances, la charge utile et la puissance de nos fusées."
 common_bulkhead:0 "Cloison commune"
 common_bulkhead_desc:0 "La cloison commune permet de stocker côte à côte l'oxygène et l'hydrogène. Cela contribue à réduire le poids et la complexité des vaisseaux spatiaux, améliorant ainsi la charge utile et les performances."
 balloon_tanks:0 "Réservoirs à ballons"
 balloon_tanks_desc:0 "Un type de réservoir de propulseur pour l'étage supérieur de lancement. La conception cylindrique n'utilise pas de cadre interne et conserve sa forme. Cela augmente considérablement les performances du vaisseau spatial."
 pressure_vessel3:0 "Réservoirs sous pression de 8 à 12 mètres"
 pressure_vessel3_short:0 "Navires de 8 à 12 mètres"
 pressure_vessel3_desc:0 "Nous avons développé la capacité de fabriquer des fuselages de fusée d'un diamètre de 8 à 12 mètres. Les fusées plus grosses amélioreront les performances, la charge utile et la puissance de nos fusées."
 advanced_plumbing:0 "Plomberie avancée"
 advanced_plumbing_desc:0 "Nous avons développé une plomberie avancée afin de garantir une plomberie sûre, environnementale et sous pression pour l'entrée et fournissons des solutions aux problèmes liés aux vols spatiaux habités et à la stabilité des engins spatiaux."
 anti_slosh_baffles:0 "Déflecteurs anti-Slosh/Vortex"
 anti_slosh_baffles_short:0 "Chicanes anti-éclaboussures"
 anti_slosh_baffles_desc:0 "Les projections de liquides peuvent être très dangereuses en termes d'impact lors d'un lancement ou d'un voyage. Les déflecteurs anti-slosh minimisent les incidents de slosh pour éviter de modifier de manière significative la dynamique du système."
 pressure_vessel4:0 "Réservoirs sous pression de 12 à 16 mètres"
 pressure_vessel4_short:0 "Navires de 12 à 16 mètres"
 pressure_vessel4_desc:0 "Nous avons développé la capacité de fabriquer des fuselages de fusée d'un diamètre de 12 à 16 mètres. Les fusées plus grosses amélioreront les performances, la charge utile et la puissance de nos fusées."
 titanium_frame:0 "Construction du cadre en titane"
 titanium_frame_short:0 "Cadre en titane"
 titanium_frame_desc:0 "Un métal solide avec un point de fusion très élevé, capable de survivre aux défis environnementaux des voyages spatiaux. Il est aussi résistant que l'acier mais plus léger, offrant tous les avantages de l'acier mais avec des performances supérieures."
 temperature_control:0 "Contrôle de la température des récipients sous pression"
 temperature_control_short:0 "Contrôle de la température"
 temperature_control_desc:0 "Cette évolution permet de contrôler avec précision la température dans les réservoirs de propulseur. Cela permet l'utilisation de différents éléments ou mélanges plus efficaces qui peuvent améliorer considérablement la puissance, les performances et le rendement énergétique des engins spatiaux."
 pressure_vessel5:0 "Réservoirs sous pression de 16 à 24 mètres"
 pressure_vessel5_short:0 "Navires de 16 à 24 mètres"
 pressure_vessel5_desc:0 "Nous avons développé la capacité de fabriquer des fuselages de fusée d'un diamètre de 16 à 24 mètres. Les fusées plus grosses amélioreront les performances, la charge utile et la puissance de nos fusées, améliorant ainsi les capacités de voyage interplanétaire."
 carbon_fiber:0 "Composites en fibre de carbone"
 carbon_fiber_short:0 "Fibre de carbone Comp."
 carbon_fiber_desc:0 "Ces composites offrent un matériau d'une immense résistance, d'une tolérance à la température et, plus important encore, sa légèreté lui confère un avantage substantiel par rapport aux métaux traditionnels. Cependant, contrairement aux métaux, il n'a pas de limite de fatigue claire."
 external_tanks:0 "Réservoirs de carburant externes"
 external_tanks_desc:0 "Ces réservoirs de carburant peuvent être fixés extérieurement à un vaisseau spatial et jetés en toute sécurité après le lancement. Ces réservoirs peuvent également être potentiellement réutilisés. Cela réduit les coûts, maintient un vaisseau spatial pendant le lancement et permet d'augmenter la charge utile et les fonctionnalités du vaisseau spatial."
 pressure_vessel6:0 "Appareils à pression de 24 à 30 mètres"
 pressure_vessel6_short:0 "Navires de 24 à 30 mètres"
 pressure_vessel6_desc:0 "Nous avons développé la capacité de fabriquer des fuselages de fusée d'un diamètre de 24 à 30 mètres. Les fusées plus grosses amélioreront les performances, la charge utile et la puissance de nos fusées, améliorant ainsi les capacités de voyage interplanétaire."
 aluminum_lithium:0 "Alliages aluminium-lithium"
 aluminum_lithium_desc:0 "Cet alliage offre une solidité et des performances aérodynamiques inégalées. Bien qu'il ne soit pas aussi résistant que l'acier ou le titane, il est beaucoup plus léger, ce qui permet des charges utiles et des capacités plus importantes pour les vaisseaux spatiaux."
 lightweight_tanks:0 "Chars super légers"
 lightweight_tanks_desc:0 "Fabriqués dans un alliage plus léger, ces réservoirs sont fixés extérieurement au vaisseau spatial. Ils offrent tous les mêmes avantages que les réservoirs de carburant externes, mais sont nettement plus légers, ce qui confère au vaisseau spatial une charge utile et des performances accrues."
 carbon_fiber2:0 "Segments en fibre de carbone"
 carbon_fiber2_desc:0 "Ces fibres de carbone sont réorientées vers l'intérieur de la fibre, ce qui les rend beaucoup plus résistantes qu'auparavant et atténue le désavantage en termes de résistance par rapport aux alternatives plus lourdes. Cela permet une structure plus solide tout en conservant un poids léger."
 helium_pressurization:0 "Pressurisation de l'hélium"
 helium_pressurization_desc:0 "L'hélium offre une solution plus sûre et plus efficace pour la pressurisation des réservoirs de propulseur. Il est également beaucoup plus léger et réduit le volume de stockage nécessaire, améliorant ainsi la charge utile du vaisseau spatial."
 orbital_construction:0 "Construction de navires orbitaux"
 orbital_construction_short:0 "Construction orbitale"
 orbital_construction_desc:0 "Essentiellement un chantier naval dans l'espace qui construit des vaisseaux spatiaux. La construction de vaisseaux spatiaux depuis l'orbite réduirait considérablement les coûts et la nécessité de lancements spatiaux. Beaucoup considèrent ce développement comme une étape clé pour l'exploration spatiale de masse. Ces installations peuvent également réparer les navettes ou les satellites endommagés."

# Propulsion
 liquid_propellant:0 "Fusée à propergol liquide"
 liquid_propellant_short:0 "Liquide-prop. Fusée"
 liquid_propellant_desc:0 "Une fusée utilise des propulseurs liquides, soit un produit chimique, soit un mélange de deux produits chimiques. Il permet de réduire le volume des réservoirs, ce qui en fait une fusée idéale pour lancer des satellites ou des engins spatiaux, bien qu'il soit mécaniquement compliqué."
 solid_propellant:0 "Fusée à propergol solide"
 solid_propellant_short:0 "Solide-hélice. Fusée"
 solid_propellant_desc:0 "Fusée à propergol solide utilisée pour lancer des satellites ou des engins spatiaux. Bien que ses performances soient inférieures à celles des propulseurs liquides, il peut être stocké pendant de plus longues périodes et présente un taux de fiabilité de lancement élevé."
 hybrid_propellant:0 "Fusée à propergol hybride"
 hybrid_propellant_short:0 "Fusée à hélice hybride"
 hybrid_propellant_desc:0 "Une fusée qui utilise deux phases de propulseurs de fusée, souvent une solide et une liquide. Il évite les moindres performances des fusées à poudre et la complexité mécanique d'une fusée à liquide. Il peut être plus facilement arrêté en cas d'urgence."
 nuclear_pulse_propulsion:0 "Propulsion par impulsions nucléaires"
 nuclear_pulse_propulsion_short:0 "Nucléaire P. Propulsion"
 nuclear_pulse_propulsion_desc:0 "Un type de système de propulsion qui utilise une série d'explosions nucléaires directionnelles. Il offre un système de propulsion extrêmement puissant, avec un équipage correctement protégé."
 cryogenic_rocket:0 "Fusée cryogénique"
 cryogenic_rocket_desc:0 "Une fusée qui utilise du carburant cryogénique et des oxydants pour créer des moteurs très efficaces. Ils permettent de stocker le gaz sous forme liquide en maintenant le poids du carburant faible et en permettant les vols spatiaux."
 solid_core_rocket:0 "Fusée thermique nucléaire à noyau solide"
 solid_core_rocket_short:0 "Fusée à noyau solide"
 solid_core_rocket_desc:0 "Utilise la chaleur d'une réaction nucléaire comme propulseur au lieu d'un produit chimique, ce qui conduit à une plus grande efficacité et à la capacité d'augmenter la charge utile d'un vaisseau spatial de trois à quatre fois."
 pebble_core_rocket:0 "Fusée thermique nucléaire à noyau solide à lit de galets"
 pebble_core_rocket_short:0 "Fusée à noyau de galets"
 pebble_core_rocket_desc:0 "Là où une fusée à noyau solide utilise un bloc de carburant solide, la fusée à noyau de galets utilise de nombreux éléments combustibles sphériques plus petits pour augmenter la surface et augmenter le flux de chaleur pour la production d'énergie. Il est non seulement plus puissant mais aussi plus sûr au lancement."
 dual_mode_rocket:0 "Fusée à propulsion double mode"
 dual_mode_rocket_short:0 "Fusée double mode"
 dual_mode_rocket_desc:0 "Combine les fusées bipropulsives et monopropulsives, permettant les avantages des deux conceptions dans une mission. Le vaisseau spatial peut effectuer des manoeuvres à forte poussée avec le biergol avant de passer au monoergol économique pour le reste de la mission."
 liquid_core_rocket:0 "Fusée thermique nucléaire à noyau liquide"
 liquid_core_rocket_short:0 "Fusée à noyau liquide"
 liquid_core_rocket_desc:0 "Un moteur nucléaire alimenté par des éléments fissiles en phase liquide. L'avantage du système réside dans la manière dont il permet une impulsion spécifique très élevée de 1 600, augmentant considérablement l'efficacité de l'utilisation du propulseur."
 fission_fragment:0 "Fragment de fission"
 fission_fragment_desc:0 "Ce type de moteur-fusée utilise directement les produits de fission nucléaire pour les poussées au lieu d'utiliser un fluide séparé à utiliser comme masse pour l'accélération. Cela augmente considérablement l'impulsion spécifique du système."
 tripropellant_rocket:0 "Fusée à trois propulseurs"
 tripropellant_rocket_desc:0 "Une fusée qui utilise trois propulseurs, donnant certaines des impulsions spécifiques les plus élevées jamais enregistrées. Il maintient des capacités élevées tout en évitant les problèmes environnementaux liés aux fusées nucléaires et le manque de puissance des fusées électriques."
 droplet_core_rocket:0 "Fusée thermique nucléaire à noyau de gouttelettes"
 droplet_core_rocket_short:0 "Fusée à noyau de gouttelettes"
 droplet_core_rocket_desc:0 "Le moteur pulvérise de l'uranium liquide dans le coeur sous forme de gouttelettes pour amener le réacteur à maximiser la production d'énergie. Cela augmente considérablement les impulsions spécifiques et peut réduire considérablement la durée des longs voyages spatiaux."
 closed_core_rocket:0 "Fusée thermique nucléaire à noyau de gaz à cycle fermé"
 closed_core_rocket_short:0 "Fusée à cycle fermé"
 closed_core_rocket_desc:0 "L'un des principaux problèmes liés à la conception des fusées nucléaires est leur impact environnemental. La fusée à cycle fermé empêche les fuites de radiations, fonctionne à des températures extrêmes et offre des performances bien supérieures à la plupart des fusées chimiques."
 variable_thrust_rocket:0 "Fusée solide à poussée variable"
 variable_thrust_rocket_short:0 "Fusée à poussée variable"
 variable_thrust_rocket_desc:0 "Une conception de fusée solide qui permet aux fusées d'accélérer ou de décélérer en fonction des objectifs de la mission. La capacité de contrôler l'accélération présente de nombreux avantages pour les engins spatiaux et permet un large éventail de nouvelles missions dans l'espace."
 nuclear_pulse_propulsion2:0 "Propulsion à voile à impulsion nucléaire"
 nuclear_pulse_propulsion2_short:0 "Nucléaire P. Propulsion"
 nuclear_pulse_propulsion2_desc:0 "Utilise le système de propulsion à impulsions nucléaires avec la fixation d'une grande voile de spi devant lui. La voile intercepte des impulsions plus explosives, augmentant l'impulsion spécifique, réduisant le poids et augmentant la capacité de charge utile."
 open_core_rocket:0 "Fusée thermique nucléaire à cycle ouvert à noyau de gaz"
 open_core_rocket_short:0 "Fusée à cycle ouvert"
 open_core_rocket_desc:0 "Fusée propulsée par le liquide de refroidissement d'un réacteur à fission gazeuse. Il est capable de produire des impulsions spécifiques allant jusqu'à 5 000 s et une puissante poussée pour les voyages interplanétaires."
 dusty_fission_fragment:0 "Fragment de fission de plasma poussiéreux"
 dusty_fission_fragment_short:0 "Fragment de fission poussiéreux"
 dusty_fission_fragment_desc:0 "Un réacteur nucléaire qui produit de l'électricité en décélérant un faisceau d'ions de produits de fission. Le plasma poussiéreux augmente la surface pour un codage radiatif efficace. Il peut atteindre des efficacités allant jusqu'à quatre-vingt-dix pour cent."
 precooled_rocket_engines:0 "Moteurs de fusée à respiration aérienne prérefroidis"
 precooled_rocket_engines_short:0 "Moteurs de fusée prérefroidis"
 precooled_rocket_engines_desc:0 "Une fusée à cycle combiné unique avec deux modes de fonctionnement. Cela permet au vaisseau spatial équipé du moteur d'atteindre une capacité de mise en orbite à un seul étage. Cette réutilisation réduit les coûts et l'utilisation des matériaux."

# Power Generation
 mercury_batteries:0 "Piles à oxyde mercurique classées pour l'espace"
 mercury_batteries_short:0 "Piles à oxyde mercurique"
 mercury_batteries_desc:0 "Une batterie et une source d'alimentation populaires pour les appareils électroniques portables. Il n'est pas rechargeable mais est capable de résister à l'accélération du lancement spatial et aux vibrations une fois en orbite."
 nickel_batteries:0 "Piles nickel-cadmium classées pour l'espace"
 nickel_batteries_short:0 "Piles nickel-cadmium"
 nickel_batteries_desc:0 "Une batterie rechargeable qui utilise du nickel. Ils sont utilisés pour les outils portables, les lampes de poche et autres équipements électroniques. Il est capable de résister à l'accélération et aux vibrations des voyages spatiaux."
 hydrogen_cells:0 "Piles à combustible hydrogène-oxygène"
 hydrogen_cells_short:0 "Cellules hydrogène-oxygène"
 hydrogen_cells_desc:0 "Les piles à hydrogène-oxygène font partie des piles à combustible les plus économes en carburant disponibles. Elle produit de l'eau, de la chaleur et de l'électricité. Produit moins de pollution que les autres sources et peut alimenter efficacement les satellites et les capsules spatiales."
 radioisotope_generators:0 "Générateurs thermoélectriques à radio-isotopes"
 radioisotope_generators_short:0 "Générateurs de radio-isotopes T"
 radioisotope_generators_desc:0 "Une batterie nucléaire qui convertit la désintégration d'une matière radioactive pour produire de l'électricité. Peut être utilisé comme source d'énergie efficace et économique pour les satellites ou les sondes spatiales."
 solar_panels:0 "Panneaux solaires"
 solar_panels_desc:0 "Est la conversion de la lumière (du soleil) en électricité à l'aide de matériaux semi-conducteurs. Pour les engins spatiaux et les satellites, cette technologie rentable peut faire fonctionner des capteurs, de la télémétrie et servir de source de propulsion."
 tracking_solar_panels:0 "Panneaux solaires de suivi du soleil"
 tracking_solar_panels_short:0 "Suivi des panneaux solaires"
 tracking_solar_panels_desc:0 "Permettez aux panneaux solaires de suivre le soleil lorsqu'il se déplace, augmentant ainsi la quantité d'énergie produite. Permet une utilisation plus efficace de l'énergie solaire sur les vaisseaux spatiaux."
 lithium_batteries:0 "Batteries lithium-ion spatiales"
 lithium_batteries_short:0 "Piles au lithium-ion"
 lithium_batteries_desc:0 "Une batterie rechargeable plus avancée qui peut alimenter plus efficacement les appareils électroniques portables et les petits véhicules électriques utilisés pour les missions spatiales. Capable d'opérer dans des environnements extrêmes."
 methane_fuel_cells:0 "Piles à combustible au méthane haute densité"
 methane_fuel_cells_short:0 "Piles à combustible au méthane"
 methane_fuel_cells_desc:0 "Une amélioration par rapport aux piles à combustible à hydrogène, la pile à combustible au méthane convertit l'énergie directement du méthane sans la convertir au préalable en hydrogène. Cela augmente considérablement la quantité d'énergie produite pour mieux alimenter les satellites ou les capsules spatiales."

# Data Transmission
 directional_antenna:0 "Antenne directionnelle"
 directional_antenna_desc:0 "Antenne qui rayonne ou reçoit de l'énergie dans une direction spécifique et réduit les interférences provenant d'autres sources. Ils sont essentiels pour les sondes spatiales lointaines et les antennes radio terrestres."
 sstv_transmission:0 "Transmission d'images SSTV"
 sstv_transmission_desc:0 "Une des premières méthodes de transmission d'images utilisant la radio pour transmettre ou recevoir des images statiques. Il est crucial pour permettre aux vaisseaux spatiaux de transmettre des images provenant de l'engin afin de restituer des images à la Terre."
 geosynchronous_network:0 "Réseau de communications à relais géosynchrones"
 geosynchronous_network_short:0 "Réseau géosynchrone"
 geosynchronous_network_desc:0 "Un réseau de communication qui communique via ou avec des satellites géosynchrones. Ces satellites orbitent au même rythme que la rotation de la Terre. Le réseau est facile à suivre depuis la surface, ce qui réduit les coûts et propose des applications pour les émissions télévisées mondiales, la collecte de renseignements et les prévisions météorologiques."
 broadband_internet:0 "Internet haut débit accessible dans l'espace"
 broadband_internet_short:0 "Internet haut débit"
 broadband_internet_desc:0 "Une transmission de données à large bande passante capable de transporter plusieurs signaux et types de trafic. Il permet une communication rapide entre plusieurs utilisateurs, une meilleure qualité et une plus grande capacité de transport de données."
 laser_communications:0 "Communications spatiales laser"
 laser_communications_short:0 "Communications laser"
 laser_communications_desc:0 "Permet la communication optique, en utilisant la lumière dans l'espace pour transmettre des données entre les satellites et du sol vers l'espace. Cela permet une communication sans fil et la transmission de grandes quantités de données sur plusieurs milliers de kilomètres."
