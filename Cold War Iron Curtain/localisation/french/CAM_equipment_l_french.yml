 CAM_infantry_equipment_0:0 "Fusil semi-automatique 7 mm 5 M. 49"
 CAM_infantry_equipment_0_short:0 "MAS-49"
 CAM_infantry_equipment_0_desc:0 "Le MAS-49 était un fusil de combat semi-automatique français chambré en français 7,5 × 54 mm. Largement distribué à FARK dans les années 1950, il était doté d'un système de gaz à impact direct fiable et d'un chargeur fixe de 10 cartouches. Robuste et précis, le MAS-49 servait de fusil standard aux forces cambodgiennes entraînées par la France avant que l'aide américaine ne le remplace par des modèles plus récents. Sa conception simple facilitait son entretien dans des conditions tropicales."
 
 CAM_infantry_equipment_1:0 "Carabine, calibre.30, M1"
 CAM_infantry_equipment_1_short:0 "Carabine M1"
 CAM_infantry_equipment_1_desc:0 "La carabine M1 était un fusil semi-automatique léger chambré en carabine.30, développé à l'origine par les États-Unis pendant la Seconde Guerre mondiale. Compact et maniable, il devint populaire auprès des troupes des FARK puis des FANK, notamment dans les unités de ligne arrière ou de soutien. Bien que moins puissant qu'un fusil complet, son faible recul et sa facilité d'utilisation le rendaient bien adapté aux patrouilles dans la jungle et aux engagements mobiles."

 CAM_infantry_equipment_2:0 "Fusil, calibre 5,56 mm, M16"
 CAM_infantry_equipment_2_short:0 "Fusil M16"
 CAM_infantry_equipment_2_desc:0 "Le M16 original était un fusil OTAN léger à tir sélectif de 5,56 × 45 mm de fabrication américaine, introduit dans la FANK à la fin des années 1960 grâce à l'aide militaire américaine. Initialement en proie à des problèmes de fiabilité, les premiers M16 offraient toujours une précision et une portabilité supérieures à celles des fusils de combat plus anciens. Son chargeur de 20 cartouches et sa conception modulaire le rendaient idéal pour l'environnement de combat rapide de la guerre civile au Cambodge."

 CAM_infantry_equipment_3:0 "Fusil, 5,56 mm, M16A1"
 CAM_infantry_equipment_3_short:0 "Fusil M16A1"
 CAM_infantry_equipment_3_desc:0 "Le M16A1 était une version améliorée du M16, dotée d'un canon doublé de chrome et d'une assistance vers l'avant pour répondre aux problèmes de fiabilité antérieurs. Il est devenu le fusil principal des unités d'infanterie de la FANK au début des années 1970. Léger, précis et rapide, il offrait des avantages significatifs dans les escarmouches dans la jungle, notamment grâce à sa compatibilité avec les tactiques et équipements américains modernes."

 CAM_infantry_equipment_4:0 "Fusil, 5,56 mm, M16A2"
 CAM_infantry_equipment_4_short:0 "Fusil M16A2"
 CAM_infantry_equipment_4_desc:0 "le M16A2 était une évolution de la plate-forme M16, introduite trop tard pour être largement utilisée par la FANK avant la chute de Phnom Penh en 1975. Chambré dans un canon OTAN de 5,56 mm avec un canon plus lourd, des viseurs améliorés et un réglage en rafale à 3 coups, il représentait la modernisation des armes d'infanterie occidentales. Un nombre limité peut avoir été utilisé par des unités d'élite ou utilisé après la guerre avec des groupes d'exilés de la République khmère ou des premières forces alignées sur le Vietnam."

