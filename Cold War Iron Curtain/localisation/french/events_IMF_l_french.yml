l_french:
 IMF_event_desc_1:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI estime que les réglementations environnementales étouffent le développement économique et estime que des perspectives dans les réserves naturelles et un allégement des réglementations environnementales coûteuses sont nécessaires pour faciliter la croissance."
 IMF_event_desc_2:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI croit fermement que la politique du pays en matière de droits des femmes et des femmes sur le lieu de travail est dangereusement dépassée et problématique pour la croissance économique. Le FMI promet que la promotion des droits des femmes renforcera considérablement l'économie du pays."
 IMF_event_desc_3:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI estime que notre pays n'exporte pas suffisamment et peut profiter de l'économie mondiale en saisissant des opportunités d'exportation rentables."
 IMF_event_desc_4:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI a réalisé une analyse de 178 pages de la masse monétaire dans notre pays et estime que la masse monétaire dans le pays est malsaine et ne suit pas la croissance du PIB. C'est pourquoi ils recommandent que nous commencions immédiatement à saturer notre monnaie."
 IMF_event_desc_5:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI dément les rapports récents selon lesquels les entreprises auraient mené des pratiques commerciales peu recommandables et estime que les enquêtes ont révélé de fausses preuves qui ne tiendront pas devant les tribunaux. À ce titre, ils recommandent que nous arrêtions ces enquêtes car ils affirment qu'elles coûteront bien plus que ce qu'elles permettront d'économiser et que prendre des mesures contre ces pratiques ne fera que fausser la croissance économique naturelle du pays."
 IMF_event_desc_7:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI a examiné les investissements publics et estime qu'ils ne sont pas efficaces et que le libre marché peut mieux gérer les entreprises publiques du pays que le gouvernement. À ce titre, le FMI a mis en avant plusieurs entreprises publiques devant être privatisées dans son récent rapport."
 IMF_event_desc_8:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI a donné des conférences et discuté avec nos dirigeants nationaux des avantages du libre-échange et des avantages qu'il apporte. Ils estiment principalement que le protectionnisme national nuit à la croissance économique d'un pays et gonfle artificiellement les coûts des produits importés et exportés, ce qui freine directement l'économie nationale."
 IMF_event_desc_9:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI estime que les syndicats du pays sapent la croissance économique et indirectement les travailleurs qu'ils représentent. À ce titre, le FMI a suggéré d'affaiblir les pouvoirs garantis aux syndicats pour accroître la croissance économique et a assuré à notre cabinet que les employeurs connaissent le mieux les besoins de leurs employés."
 IMF_event_desc_10:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI s'est plaint à plusieurs reprises de nos procédures bureaucratiques et estime que les formalités administratives et les réglementations de notre pays sont devenues insoutenables et inefficaces et nous implore de les réduire de manière significative."
 IMF_event_desc_11:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI a réalisé une analyse des dépenses de santé dans le pays et estime que le niveau actuel des dépenses ne respecte pas le budget du pays. C'est pourquoi le FMI a recommandé que les prestations de santé du gouvernement soient réduites et que la couverture des soins de santé soit fournie par les employeurs."
 IMF_event_desc_12:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI estime que les dépenses élevées du pays en matière d'éducation sont inabordables au vu du PIB actuel du pays et estime que des coupes temporaires pour injecter de l'argent dans l'économie seront préférables à long terme."
 IMF_event_desc_13:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI a rédigé un rapport très long sur les dépenses sociales du pays et estime qu'elles freinent la croissance économique et empêchent une réduction directe de la pauvreté par la création d'emplois. C'est pourquoi ils affirment que les prestations sociales devraient être considérablement réduites."
 IMF_event_desc_14:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI estime que le pays a un climat inhospitalier pour les opportunités commerciales et a élaboré un plan pour améliorer les opportunités commerciales dans le pays."
 IMF_event_desc_15:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Une récente étude financée par le FMI sur les réglementations de sécurité dans le pays a déterminé que bon nombre des initiatives prises dans le pays n'améliorent pas la sécurité et ne font qu'augmenter les coûts d'exploitation et réduire l'efficacité. À ce titre, le FMI a mis en avant de nombreuses initiatives et réglementations en matière de sécurité dont il insiste pour qu'elles soient abrogées."
 IMF_event_desc_16:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI a terminé son analyse des données sur l'emploi dans notre pays et est parvenu à la conclusion que le marché du travail est beaucoup trop chaud et qu'il augmente artificiellement les salaires et augmente de manière insoutenable la consommation au-delà des niveaux naturels. À ce titre, ils recommandent que nous assouplissons les limites des heures de travail pour réduire le partage du travail, augmenter les équipes et refroidir le marché du travail pour assurer une croissance continue."
 IMF_event_desc_17:0 "Le FMI a terminé son rapport sur les recommandations que notre pays devrait suivre pour accroître la croissance économique et réduire la dette régionale. Leurs suggestions sont les suivantes : Le FMI rencontre actuellement de sérieux problèmes de relations publiques auprès des citoyens et des petites et grandes entreprises. C'est pourquoi ils ont demandé notre aide pour résoudre ces différends."