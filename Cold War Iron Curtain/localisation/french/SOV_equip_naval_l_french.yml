l_french:

#Carrier

 #SOV_carrier_hull_0:0 "Project 71"
 #SOV_carrier_hull_0_short:0 "Project 71"
 #SOV_carrier_hull_0_desc:0 "The displacement of the aircraft carrier according to the project was supposed to be 11,300 tons, the power of the power plant was 126,500 hp, the speed of 33 knots, the armament of 8x100-mm universal artillery mounts, 16x37-mm artillery mounts and 20x12.7-mm machine guns. The aircraft carrier was supposed to accommodate an air group of 20 aircraft, it was planned to install 2 catapults."
 
 #SOV_carrier_hull_1:0 "PBIA TsNII-45"
 #SOV_carrier_hull_1_short:0 "PBIA TsNII-45"
 #SOV_carrier_hull_1_desc:0 "Aircraft carrier project developed for the USSR Navy. The development of the project was carried out in 1959. The combat use of the floating base was supposed to be together with the air defense missile ship pr.1126 TsKB-17. Main tasks: reconnaissance by AWACS aircraft, destruction of enemy reconnaissance aircraft, detection of low-flying targets over the horizon."
 
 SOV_carrier_hull_2:0 "Projet 1143.5 Krechyet"
 SOV_carrier_hull_2_short:0 "Projet 1143.5"
 SOV_carrier_hull_2_desc:0 "La classe Kiev était la première classe de porte-avions à voilure fixe (croiseur lourd de classification soviétique) construite en Union soviétique pour la marine soviétique. Les navires ont été conçus avec une grande superstructure insulaire à tribord, avec un pont d'envol incliné 2/3 de la longueur du pont total, et le pont avant était occupé par un armement lourd de missiles sol-air et sol-sol. La mission prévue de la classe Kiev était de soutenir les sous-marins lance-missiles stratégiques, d'autres navires de surface et l'aviation navale ; il était capable de s'engager dans des guerres anti-aériennes, anti-sous-marines et de surface."
 
 SOV_carrier_hull_3:0 "Projet 1143.5 Riga"
 SOV_carrier_hull_3_short:0 "Projet 1143.5"
 SOV_carrier_hull_3_desc:0 "Le porte-avions de classe Kuznetsov, désignation soviétique Projet 1143.5, est une classe de porte-avions à voilure fixe exploités par les marines russe et chinoise. Conçus à l'origine pour la marine soviétique, les navires de la classe Kuznetsov utilisent un tremplin à ski pour lancer des avions conventionnels hautes performances dans une configuration STOBAR. Cette conception représentait une avancée majeure dans l'aviation de la flotte soviétique par rapport aux porte-avions de classe Kiev, qui ne pouvaient lancer que des avions VSTOL."

 SOV_carrier_hull_4:0 "Projet 1143.6 Variag"
 SOV_carrier_hull_4_short:0 "Projet 1143.6"
 SOV_carrier_hull_4_desc:0 "Le porte-avions de classe Kuznetsov, désignation soviétique Projet 1143.5, est une classe de porte-avions à voilure fixe exploités par les marines russe et chinoise. Conçus à l'origine pour la marine soviétique, les navires de la classe Kuznetsov utilisent un tremplin à ski pour lancer des avions conventionnels hautes performances dans une configuration STOBAR. Cette conception représentait une avancée majeure dans l'aviation de la flotte soviétique par rapport aux porte-avions de classe Kiev, qui ne pouvaient lancer que des avions VSTOL."

 
#Light Carrier
 
 SOV_carrier_hull_light_0:0 "Projet 71"
 SOV_carrier_hull_light_0_short:0 "Projet 71"
 SOV_carrier_hull_light_0_desc:0 "La conception des petits porte-avions a été annulée en 1940. Les porte-avions de ce type ont été inclus dans le programme de construction navale soviétique de 1938. Les concepteurs soviétiques et étrangers ont collaboré pour créer une conception de porte-avions plus traditionnelle, créant ce qui est devenu connu sous le nom de Projet 71 au milieu de 1939. Le petit porte-avions, d'un déplacement de 11 300 tonnes, devait être armé de canons universels de 8 x 100 mm, de canons de 16 x 37 mm et de mitrailleuses de 20 x 12,7 mm."
 SOV_carrier_hull_light_1:0 "Projet 1123 Kondor"
 SOV_carrier_hull_light_1_short:0 "1123 Kondor"
 SOV_carrier_hull_light_1_desc:0 "La classe Moskva était la première classe de porte-avions opérationnels (porte-hélicoptères dans la classification soviétique) construits par l'Union soviétique pour la marine soviétique. L'escadre aérienne était entièrement composée d'hélicoptères. Ils ont été conçus principalement comme des navires de guerre anti-sous-marine (ASW), et leurs armes et capteurs ont été optimisés contre la menace des sous-marins nucléaires. Leur rôle stratégique était de défendre les bastions des sous-marins lance-missiles soviétiques contre les incursions des sous-marins d'attaque occidentaux, formant ainsi les fleurons d'une force opérationnelle ASW."
 SOV_carrier_hull_light_2:0 "Projet 1174 Nosorog"
 SOV_carrier_hull_light_2_short:0 "Projet 1174"
 SOV_carrier_hull_light_2_desc:0 "La classe Ivan Rogov, désignation soviétique Projet 1174 Nosorog (Rhino), est une classe de navires de débarquement (grand navire de débarquement de classification soviétique) construits en Union soviétique. Les navires ont été construits dans le cadre de l'expansion des capacités de guerre amphibie de la marine soviétique dans les années 1970."
 SOV_carrier_hull_light_3:0 "Projet 11780 Kherson"
 SOV_carrier_hull_light_3_short:0 "Projet 11780"
 SOV_carrier_hull_light_3_desc:0 "Le projet 11780 Kherson était un programme LHD soviétique des années 1980 dérivé de la conception du porte-avions de la classe Kiev comparable au navire d'assaut amphibie américain de la classe Tarawa. Le navire aurait eu un déplacement d'environ 25 000 tonnes, avec des centrales électriques à turbine à vapeur et transportait environ 12 hélicoptères, quatre péniches de débarquement de classe Ondatra et deux LCAC de classe Tsaplya."
 SOV_carrier_hull_light_4:0 "Projet 23900 Ivan Rogov"
 SOV_carrier_hull_light_4_short:0 "Projet 23900"
 SOV_carrier_hull_light_4_desc:0 "Le Projet 23900 est la nouvelle classe de navires d'assaut amphibies (LHD) russes."
 
#Super heavy carrier
 
 SOV_carrier_hull_super_1:0 "Projet 1160 \"Aigle\""
 SOV_carrier_hull_super_1_short:0 "1160 Aigle"
 SOV_carrier_hull_super_1_desc:0 "Le premier projet soviétique de porte-avions doté d'une centrale nucléaire. Le groupe aérien du croiseur était censé comprendre 60 à 70 avions. Il était initialement prévu d'équiper le navire de chasseurs MiG-23A, d'avions anti-sous-marins P-42, de bombardiers Su-24K et d'hélicoptères Ka-252. Les moyens techniques d'assistance au vol étaient censés comprendre 4 catapultes à vapeur, des aérofinisseurs et une barrière de secours."
 SOV_carrier_hull_super_2:0 "Projet 1153"
 SOV_carrier_hull_super_2_short:0 "Projet 1153"
 SOV_carrier_hull_super_2_desc:0 "Le porte-avions aurait un déplacement d'environ 72 000 tonnes, avec une centrale nucléaire et environ 70 avions lancés via des catapultes à vapeur, similaires aux premiers superporte-avions de classe Kitty Hawk de la marine américaine. Contrairement à eux et aux croiseurs aériens soviétiques précédents, il a également été conçu avec une grande capacité offensive ; les supports du navire comprennent 24 tubes de lancement verticaux pour les missiles de croisière antinavires. En URSS, il était classé comme « grand croiseur doté d'un armement aérien »."
 SOV_carrier_hull_super_3:0 "Projet 1143.7 Oulianovsk"
 SOV_carrier_hull_super_3_short:0 "1143.7 Oulianovsk"
 SOV_carrier_hull_super_3_desc:0 "Était un porte-avions à voilure fixe, premier d'une classe de super porte-avions soviétiques à propulsion nucléaire. Il était destiné pour la première fois à offrir une véritable capacité d'aviation navale en eaux bleues à la marine soviétique. Le navire aurait été équipé de catapultes à vapeur capables de lancer des avions entièrement chargés."
 SOV_carrier_hull_super_4:0 "Projet 23000E \"Shtorm\""
 SOV_carrier_hull_super_4_short:0 "23000E Tempête"
 SOV_carrier_hull_super_4_desc:0 "Projet d'un porte-avions lourd polyvalent russe prometteur. Le navire est conçu pour effectuer diverses missions dans la zone océanique lointaine, sera capable de frapper des cibles terrestres et maritimes ennemies en utilisant ses propres armes et avions du groupe aérien aéroporté, en outre, il sera en mesure de fournir une défense aérienne avec des moyens de défense aérienne et de groupe aérien, d'assurer la stabilité au combat et les groupements de navires de défense aérienne, ainsi que de fournir un soutien à l'atterrissage."
 
 #World War 2 Capital ships
 
 SOV_ww_capitals:0 "Classe Gangut"
 SOV_ww_capitals_short:0 "Classe Gangut"
 SOV_ww_capitals_desc:0 "Les cuirassés de classe Sébastopol, également connus sous le nom de « classe Gangut » dans les publications occidentales, furent les premiers dreadnoughts lancés pour la marine impériale russe avant la Première Guerre mondiale. Ils avaient une histoire de conception compliquée impliquant plusieurs entreprises britanniques, des exigences évolutives, un concours international de conception et des protestations étrangères."

 SOV_ww_screens:0 "Projet 38 Minsk"
 SOV_ww_screens_short:0 "38 Minsk"
 SOV_ww_screens_desc:0 "Projet (type) des dirigeants soviétiques de destroyers, type \"Leningrad\", 2e série, construit au milieu des années 1930 pour la marine soviétique. En 1934-1940. 3 chefs de file de ce type ont été construits dans les chantiers navals soviétiques de Minsk, Bakou et Tbilissi). Les dirigeants de ce projet ont participé à des batailles dans les flottes de la Baltique et du Nord de la marine de l'URSS pendant la Grande Guerre patriotique."
 
 #Battleships/Battlecruisers
 
 SOV_battle_hull_medium_0:0 "Classe Novorossiisk"
 SOV_battle_hull_medium_0_short:0 "Classe Novorossiisk"
 SOV_battle_hull_medium_0_desc:0 "À l'origine, le cuirassé italien Giulio Ceasare. Le navire a été transféré à l'Union soviétique en 1949 et rebaptisé Novorossiysk (Новороссийск). Les Soviétiques l'utilisaient également pour l'entraînement jusqu'à ce qu'il soit coulé en 1955, entraînant la perte de 608 hommes, lors de l'explosion d'une vieille mine allemande. Elle a été récupérée l'année suivante, puis mise au rebut."
 SOV_battle_hull_medium_1:0 "Projet 82 Stalingrad"
 SOV_battle_hull_medium_1_short:0 "Projet 82"
 SOV_battle_hull_medium_1_desc:0 "Destiné à opérer avec les croiseurs de classe Sverdlov et les porte-avions proposés pour constituer de puissantes forces opérationnelles capables de défier la flotte américaine. Dans ce rôle, il faudrait qu'il s'agisse d'un navire plus puissant que la conception originale, prenant le relais du Kronstadt, désormais annulé. Ils étaient destinés à repousser les attaques ennemies et à protéger les porte-avions lorsque le mauvais temps empêchait le vol. Une série d'au moins quatre furent planifiées et la construction de Stalingrad commença finalement en 1951."
 SOV_battle_hull_medium_2:0 "Projet 1164 \"Atlante\""
 SOV_battle_hull_medium_2_short:0 "1164 Atlante"
 SOV_battle_hull_medium_2_desc:0 "La classe Slava, désignation soviétique Projet 1164 Atlant, est une classe de croiseurs lance-missiles conçus et construits en Union soviétique pour la marine soviétique. La classe Slava a été initialement désignée BLACKCOM 1 (Black Sea Combatant 1), puis a désigné la classe Krasina pendant une courte période jusqu'à ce que Slava soit observé en mer. Les lanceurs SS-N-12 sont fixés face vers l'avant à une élévation d'environ 8° sans rechargement disponible. Comme la conception de cette classe n'avait rien de révolutionnaire, les observateurs occidentaux ont estimé qu'elle avait été créée pour se prémunir contre l'échec de la classe Kirov, plus radicale."
 SOV_battle_hull_medium_3:0 "Projet 1144 Orléans"
 SOV_battle_hull_medium_3_short:0 "Projet 1144"
 SOV_battle_hull_medium_3_desc:0 "La classe Kirov, désignation soviétique Projet 1144 Orlan (aigle de mer), est une classe de croiseurs lance-missiles à propulsion nucléaire de la marine soviétique et de la marine russe, les navires de guerre de combat de surface les plus grands et les plus lourds (c'est-à-dire pas un porte-avions ou un navire d'assaut amphibie) en opération dans le monde. Parmi les navires de guerre modernes, ils sont deuxièmes en taille derrière les grands porte-avions et de taille similaire à celle d'un cuirassé de la Première Guerre mondiale. La classification soviétique du type de navire est « croiseur lourd à missiles guidés à propulsion nucléaire »."
 SOV_battle_hull_medium_4:0 "Projet 1164M Atlant-M"
 SOV_battle_hull_medium_4_short:0 "Projet 1164M"
 SOV_battle_hull_medium_4_desc:0 "La classe Slava, désignation soviétique Projet 1164 Atlant, est une classe de croiseurs lance-missiles conçus et construits en Union soviétique pour la marine soviétique. La classe Slava a été initialement désignée BLACKCOM 1 (Black Sea Combatant 1), puis a désigné la classe Krasina pendant une courte période jusqu'à ce que Slava soit observé en mer. Les lanceurs SS-N-12 sont fixés face vers l'avant à une élévation d'environ 8° sans rechargement disponible. Comme la conception de cette classe n'avait rien de révolutionnaire, les observateurs occidentaux ont estimé qu'elle avait été créée pour se prémunir contre l'échec de la classe Kirov, plus radicale."

 #Cruisers
 
 SOV_battle_hull_light_0:0 "Projet 68 Tchapaïev"
 SOV_battle_hull_light_0_short:0 "Projet 68"
 SOV_battle_hull_light_0_desc:0 "La classe Chapayev (Projet 68 Чапаев) était un groupe de croiseurs construits pour la marine soviétique pendant et après la Seconde Guerre mondiale. Dix-sept navires étaient prévus mais sept seulement furent réellement mis en service avant l'invasion allemande. Deux navires incomplets ont été détruits lorsque leur chantier de construction à Nikolaev a été capturé par l'Allemagne nazie et les cinq croiseurs restants n'ont été achevés qu'en 1950."
 SOV_battle_hull_light_1:0 "Projet 68bis Sverdlov"
 SOV_battle_hull_light_1_short:0 "Projet 68bis"
 SOV_battle_hull_light_1_desc:0 "Les croiseurs de classe Sverdlov, désignation soviétique Projet 68bis, étaient les derniers croiseurs à canon conventionnels construits pour la marine soviétique. Ils ont été construits dans les années 1950 et étaient basés sur des conceptions et des concepts soviétiques, allemands et italiens développés avant la Seconde Guerre mondiale. Ils ont été modifiés pour améliorer leurs capacités de tenue en mer, leur permettant de naviguer à grande vitesse dans les eaux agitées de l'Atlantique Nord. La coque de base était plus moderne et offrait une meilleure protection blindée que la grande majorité des modèles de croiseurs à canon construits et déployés par des pays pairs après la Seconde Guerre mondiale."
 SOV_battle_hull_light_2:0 "Projet 58 Kynda"
 SOV_battle_hull_light_2_short:0 "Projet 58"
 SOV_battle_hull_light_2_desc:0 "Les croiseurs lance-missiles du Projet 58 (Ракетные крейсера проекта 58), connus par l'OTAN sous le nom de classe Kynda et parfois appelés classe Grozny (тип « Грозный»), du nom du premier navire de la série à être construit, constituaient la première génération de croiseurs lance-missiles soviétiques et représentaient une avancée considérable pour la marine soviétique."
 SOV_battle_hull_light_3:0 "Projet 1134A Berkut A"
 SOV_battle_hull_light_3_short:0 "Projet 1134A"
 SOV_battle_hull_light_3_desc:0 "La classe Kresta II, désignation soviétique Projet 1134A Berkut A (aigle royal), était une classe de croiseur lance-missiles (grand navire de guerre anti-sous-marine de classification soviétique) construit par l'Union soviétique pour la marine soviétique. L'OTAN classe cette classe parmi les « croiseurs », principalement en raison du système de missile antinavire Metel (SS-N-14 Silex), capable de frapper non seulement les sous-marins mais aussi les navires de surface."
 SOV_battle_hull_light_4:0 "Projet 1134B Berkut B"
 SOV_battle_hull_light_4_short:0 "Projet 1134B"
 SOV_battle_hull_light_4_desc:0 "La classe Kara, désignation soviétique Projet 1134B Berkut B (aigle royal), était une classe de croiseurs lance-missiles (grand navire de guerre anti-sous-marine de classification soviétique) construits en Union soviétique pour la marine soviétique. L'OTAN classe cette classe parmi les « croiseurs », principalement en raison du système de missile antinavire Metel (SS-N-14 Silex), capable de frapper non seulement les sous-marins, mais également les navires de surface."
 
 #Destroyers
 
 SOV_screen_hull_heavy_0:0 "Projet 30Bis Skory"
 SOV_screen_hull_heavy_0_short:0 "Projet 30Bis"
 SOV_screen_hull_heavy_0_desc:0 "La classe Kola était le nom OTAN d'un groupe de frégates construites pour la marine soviétique dans les années 1950. La désignation soviétique était Storozhevoi Korabl (navire d'escorte) Projet 42. Ces navires étaient analogues aux destroyers d'escorte de la Seconde Guerre mondiale ou aux torpilleurs allemands de la classe Elbing. Le programme ne comprenait que 8 navires, car ces navires étaient considérés comme trop chers pour une production en série et la frégate de classe Riga, plus petite et moins chère, fut construite à la place. Des radars et des sonars ont été installés."
 SOV_screen_hull_heavy_1:0 "Projet 61 Kachine"
 SOV_screen_hull_heavy_1_short:0 "Projet 61"
 SOV_screen_hull_heavy_1_desc:0 "La classe Kashin, désignation soviétique Projet 61, était une série de destroyers lance-missiles anti-aériens construits pour la marine soviétique depuis les années 1960. En 2020, aucun navire n'est resté en service dans la marine russe, mais trois navires modifiés restent en service dans la marine indienne en tant que destroyers de classe Rajput."
 SOV_screen_hull_heavy_2:0 "Projet 1135 Bourevestnik"
 SOV_screen_hull_heavy_2_short:0 "1135 Bourevestnik"
 SOV_screen_hull_heavy_2_desc:0 "La classe Krivak, désignation soviétique Projet 1135 Burevestnik (océanite tempête), était une série de frégates et de navires de garde (bateaux de patrouille) construits en Union soviétique principalement pour la marine soviétique. Les caractéristiques uniques du navire - la boîte de missile avant, la cheminée et le mât incliné - lui ont valu un surnom parmi les marins américains qui vient de leur formation à l'identification des silhouettes de navires étrangers - \"Pack de hot-dogs, Smokestack, Guns in Back - Krivak\"."
 SOV_screen_hull_heavy_3:0 "Projet 956 Sarytch"
 SOV_screen_hull_heavy_3_short:0 "Projet 956"
 SOV_screen_hull_heavy_3_desc:0 "La classe Sovremenny, désignation soviétique Projet 956 Sarych (buzzard), est une classe de destroyers à missiles guidés anti-navires et anti-aériens de la marine soviétique puis russe. Les navires portent le nom de qualités, « Sovremenny » se traduisant par « moderne » ou « contemporain »."
 SOV_screen_hull_heavy_4:0 "Projet 1155 Frégat-M"
 SOV_screen_hull_heavy_4_short:0 "1155 Frégat-M"
 SOV_screen_hull_heavy_4_desc:0 "La classe Udaloy, désignations russes Projet 1155 Fregat et Projet 11551 Fregat-M, est une série de destroyers lance-missiles anti-sous-marins construits pour la marine soviétique. Semblable à l'Udaloy extérieurement, il s'agissait d'une nouvelle configuration remplaçant le SS-N-14 par des missiles antinavires SS-N-22 \"Sunburn\" (Moskit), un double canon de 130 mm, des roquettes anti-torpilles UDAV-1 et des systèmes canon/SAM CIWS. Une capacité ASW à distance est conservée en tirant des missiles SS-N-15 à partir des tubes lance-torpilles."



 #Frigates
 
 SOV_screen_hull_medium_0:0 "Projet 42 Kola"
 SOV_screen_hull_medium_0_short:0 "Projet 42"
 SOV_screen_hull_medium_0_desc:0 "La classe Kola était le nom OTAN d'un groupe de frégates construites pour la marine soviétique dans les années 1950. La désignation soviétique était Storozhevoi Korabl (navire d'escorte) Projet 42. Ces navires étaient analogues aux destroyers d'escorte de la Seconde Guerre mondiale ou aux torpilleurs allemands de la classe Elbing. Le programme ne comprenait que 8 navires, car ces navires étaient considérés comme trop chers pour une production en série et la frégate de classe Riga, plus petite et moins chère, fut construite à la place. Des radars et des sonars ont été installés."
 SOV_screen_hull_medium_1:0 "Projet 159 Petya"
 SOV_screen_hull_medium_1_short:0 "Projet 159"
 SOV_screen_hull_medium_1_desc:0 "La classe Petya était le nom OTAN d'une classe de frégates légères conçues dans les années 1950 et construites pour la marine soviétique dans les années 1960. La désignation soviétique était \"Storozhevoi Korabl'\" (Сторожевой Корабль - Sentry Ship) Projet 159."
 SOV_screen_hull_medium_2:0 "Projet 1159 Koni"
 SOV_screen_hull_medium_2_short:0 "Projet 1159"
 SOV_screen_hull_medium_2_desc:0 "La classe Koni est le nom OTAN d'une frégate de guerre anti-sous-marine construite par l'Union soviétique. Ils étaient connus en Union soviétique sous le nom de Projet 1159. 14 ont été construits au chantier naval de Zelenodolsk entre 1975 et 1988. Ils étaient initialement destinés à remplacer les anciennes frégates de la classe Riga, mais ont plutôt été choisis comme modèle pour l'exportation vers diverses marines amies."
 SOV_screen_hull_medium_3:0 "Projet 11540 Yastreb"
 SOV_screen_hull_medium_3_short:0 "Projet 11540"
 SOV_screen_hull_medium_3_desc:0 "La classe Neustrashimy, désignation soviétique Projet 11540 Yastreb (faucon), est une série de grandes frégates construites pour la marine soviétique et actuellement en service dans la marine russe. Sept navires étaient prévus pour la marine soviétique, mais la chute de l'Union soviétique a perturbé ces plans. Deux navires ont été achevés, tous deux actuellement en service actif dans la flotte russe de la Baltique."
 SOV_screen_hull_medium_4:0 "Projet 22350 Amiral Gorshkov"
 SOV_screen_hull_medium_4_short:0 "Projet 22350"
 SOV_screen_hull_medium_4_desc:0 "La classe Admiral Gorshkov, désignation russe Projet 22350 pour la version originale et améliorée, armée respectivement de 16 et 32 cellules VLS, est la nouvelle classe de frégates construites par la Severnaya Verf à Saint-Pétersbourg pour la marine russe avec un coût de 250 millions de dollars. Le projet 22350 a été conçu par le bureau d'études Severnoye et intègre l'utilisation de la technologie furtive."

 # Submarine Hulls #
 
 #Small Submarines

 SOV_sub_hull_ww:0 "Classe S"
 SOV_sub_hull_ww_short:0 "Classe S"
 SOV_sub_hull_ww_desc:0 "Les sous-marins de classe S ou Srednyaya faisaient partie de la flotte sous-marine de la marine soviétique pendant la Seconde Guerre mondiale. Officieusement surnommé Stalinets. À ne pas confondre, les bateaux de cette classe ont été les plus performants et ont remporté les victoires les plus significatives parmi tous les sous-marins soviétiques. Au total, ils ont coulé 82 770 tonnes brutes (TJB) de navires marchands et sept navires de guerre, ce qui représente environ un tiers de tout le tonnage coulé par les sous-marins soviétiques pendant la guerre."

 SOV_sub_hull_small_single_0:0 "Projet 611 Zoulou"
 SOV_sub_hull_small_single_0_short:0 "Projet 611"
 SOV_sub_hull_small_single_0_desc:0 "Le Projet 611 de la marine soviétique fut l'un des premiers sous-marins d'attaque soviétiques d'après-guerre. Les premiers bateaux de la classe étaient équipés de canons anti-aériens jumeaux de 57 mm et de 25 mm et sans tubas, bien que les canons aient été retirés et des tubas ajoutés peu de temps après l'entrée en service des bateaux."
 SOV_sub_hull_small_single_1:0 "Projet 641 Foxtrot"
 SOV_sub_hull_small_single_1_short:0 "Projet 641"
 SOV_sub_hull_small_single_1_desc:0 "La classe Foxtrot était le nom OTAN d'une classe de sous-marins de patrouille diesel-électriques construits en Union soviétique. La désignation soviétique de cette classe était Projet 641. La classe Foxtrot a été conçue pour remplacer l'ancienne classe Zulu. La classe Foxtrot était comparable en termes de performances et d'armement à la plupart des modèles contemporains. Cependant, ses trois vis le rendaient plus bruyant que la plupart des modèles occidentaux. De plus, la classe Foxtrot était l'un des derniers modèles introduits avant l'adoption de la coque en forme de larme, qui offrait de bien meilleures performances sous-marines."
 SOV_sub_hull_small_single_2:0 "Projet 641B Tango"
 SOV_sub_hull_small_single_2_short:0 "Projet 641B"
 SOV_sub_hull_small_single_2_desc:0 "La classe Tango était le nom OTAN d'une classe de sous-marins diesel-électriques construits en Union soviétique pour remplacer les sous-marins de la classe Foxtrot. La désignation soviétique de cette classe était Projet 641B et elle était également connue sous le nom de classe Som (Poisson-chat). Les installations de sonar d'étrave semblent similaires à celles équipant les sous-marins nucléaires d'attaque soviétiques. L'installation de propulsion était la même que celle du dernier sous-groupe de la classe Foxtrot. La classe Tango avait une capacité de batterie bien supérieure, bien supérieure à toute classe de sous-marins conventionnels précédente de la marine soviétique."
 SOV_sub_hull_small_single_3:0 "Projet 877 Paltus"
 SOV_sub_hull_small_single_3_short:0 "Projet 877 "
 SOV_sub_hull_small_single_3_desc:0 "La classe Kilo, désignation soviétique Projet 877 Paltus, est une classe de sous-marins d'attaque diesel-électriques conçus et construits en Union soviétique pour la marine soviétique. Ces sous-marins d'attaque sont principalement destinés aux opérations antinavires et anti-sous-marines dans des eaux relativement peu profondes. Les bateaux originaux du projet 877 sont équipés du système sonar Rubikon MGK-400 (avec le nom de rapport OTAN Shark Gill), qui comprend un sonar de détection et d'évitement des mines MG-519 Arfa (avec le nom de rapport OTAN Mouse Roar)."
 SOV_sub_hull_small_single_4:0 "Projet 677 Lada"
 SOV_sub_hull_small_single_4_short:0 "Projet 677"
 SOV_sub_hull_small_single_4_desc:0 "Classe Lada, désignation russe Le Projet 677 Lada (nom de l'OTAN Lada) est la nouvelle classe avancée de sous-marins d'attaque diesel-électriques conçue par le bureau de conception russe Rubin. Programme de développement d'un sous-marin diesel-électrique de « quatrième génération », il visait à produire une version hautement améliorée du Projet 636 avec une meilleure signature acoustique, de nouveaux systèmes de combat et éventuellement une propulsion indépendante de l'air."

 #Submarines

 SOV_sub_hull_large_single_0:0 "Projet 613 Whisky"
 SOV_sub_hull_large_single_0_short:0 "Projet 613"
 SOV_sub_hull_large_single_0_desc:0 "La conception initiale a été développée au début des années 1940 comme une suite en mer au sous-marin de classe S. À la suite de l'expérience de la guerre et de la capture de la technologie allemande à la fin de la guerre, les Soviétiques ont émis une nouvelle exigence de conception en 1946. La conception révisée a été développée par le bureau de conception Lazurit basé à Gorkiy. Comme la plupart des sous-marins conventionnels conçus entre 1946 et 1960, la conception a été fortement influencée par le sous-marin de type XXI."
 SOV_sub_hull_large_single_1:0 "Kit Projet 627"
 SOV_sub_hull_large_single_1_short:0 "Projet 627"
 SOV_sub_hull_large_single_1_desc:0 "La classe Novembre, désignation soviétique Project 627 Kit, était la première classe de sous-marins d'attaque à propulsion nucléaire de l'Union soviétique, en service de 1958 à 1990. Tous sauf un ont été éliminés, le K-3, le premier sous-marin à propulsion nucléaire construit pour la marine soviétique, étant conservé comme navire commémoratif à Saint-Pétersbourg."
 SOV_sub_hull_large_single_2:0 "Projet 671 Yorkh"
 SOV_sub_hull_large_single_2_short:0 "Projet 671"
 SOV_sub_hull_large_single_2_desc:0 "La classe Victor, désignations soviétiques Projet 671 Yorsh, Projet 671RT Syomga et Projet 671RTM/RTMK Shchuka, est une série de sous-marins d'attaque à propulsion nucléaire construits en Union soviétique et exploités par la marine soviétique."
 SOV_sub_hull_large_single_3:0 "Projet 705 lires"
 SOV_sub_hull_large_single_3_short:0 "Projet 705"
 SOV_sub_hull_large_single_3_desc:0 "La classe Alfa, désignation soviétique Projet 705 Lira, était une classe de sous-marins d'attaque à propulsion nucléaire en service dans la marine soviétique et plus tard dans la marine russe. Il s'agissait des sous-marins militaires les plus rapides jamais construits, seul le prototype de sous-marin K-222 (nom de classe Papa de l'OTAN) les dépassant en vitesse de plongée."
 SOV_sub_hull_large_single_4:0 "Projet 971 Chtchouka-B"
 SOV_sub_hull_large_single_4_short:0 "Projet 971"
 SOV_sub_hull_large_single_4_desc:0 "La classe Akula, désignation soviétique Projet 971 Shchuka-B, est une série de sous-marins d'attaque à propulsion nucléaire (SSN) déployés pour la première fois par la marine soviétique en 1986. Il existe quatre sous-classes ou vols de Shchuka-B, composés des sept bateaux originaux du projet 971 (nom de code Akula I), mis en service entre 1984 et 1990 ; six projets 971I (Akulas améliorés), mis en service entre 1991 et 2009 ; un projet 971U (Akula II), mis en service en 1995 ; et un projet 971M (Akula III), mis en service en 2001."

 #Balistic Missile Submarines

 SOV_sub_hull_large_double_0:0 "Projet 658 Hôtel"
 SOV_sub_hull_large_double_0_short:0 "Projet 658"
 SOV_sub_hull_large_double_0_desc:0 "La classe Hôtel est la classification générale de l'OTAN pour un type de sous-marin nucléaire lance-missiles qui a été initialement mis en service par l'Union soviétique vers 1959. La conception de l'Hôtel était basée sur le sous-marin de classe Novembre du Projet 627, le premier sous-marin nucléaire soviétique. Ils ont été modifiés en ajoutant le compartiment missile des sous-marins de la classe Golf. De plus, les hôtels disposaient de petits hydravions horizontaux pour une meilleure maniabilité et de gouvernes de commande électrohydrauliques plus fiables pour les opérations sous-marines à grande vitesse avec un bruit réduit."
 SOV_sub_hull_large_double_1:0 "Projet 667 Delfin"
 SOV_sub_hull_large_double_1_short:0 "Projet 667"
 SOV_sub_hull_large_double_1_desc:0 "La classe Delta, désignations soviétiques Projet 667B Murena, Projet 667BD Murena-M, Projet 667BDR Kalmar, Projet 667BDRM Delfin, est une série de sous-marins lance-missiles à propulsion nucléaire, conçus et construits en Union soviétique, qui formaient l'épine dorsale de la flotte de sous-marins stratégiques soviétiques et russes depuis leur introduction en 1973."
 SOV_sub_hull_large_double_2:0 "Projet 941 Akula"
 SOV_sub_hull_large_double_2_short:0 "Projet 941"
 SOV_sub_hull_large_double_2_desc:0 "La classe Typhoon, désignation soviétique Projet 941 Akula (nom de l'OTAN Typhoon), est une classe de sous-marins nucléaires lance-missiles conçus et construits par l'Union soviétique pour la marine soviétique. Avec un déplacement immergé de 48 000 tonnes, les Typhoons sont les plus grands sous-marins jamais construits, capables d'accueillir des installations de vie confortables pour un équipage de 160 personnes lorsqu'ils sont immergés pendant des mois. Outre leur armement de missiles, la classe Typhoon comprend six tubes lance-torpilles conçus pour gérer les missiles RPK-2 (SS-N-15) ou les torpilles de type 53."
 SOV_sub_hull_large_double_3:0 "Projet 955 Boréï"
 SOV_sub_hull_large_double_3_short:0 "Projet 955"
 SOV_sub_hull_large_double_3_desc:0 "La classe Borei, translittération alternative Borey, désignation russe Projet 955 Borei et Projet 955A Borei-A, également appelé classe Dolgorukiy, sont une série de sous-marins lance-missiles à propulsion nucléaire construits par Sevmash pour la marine russe. Bien qu'ils remplacent de nombreux types de SNLE, les sous-marins de la classe Borei sont beaucoup plus petits que ceux de la classe Typhoon, tant en volume qu'en équipage (24 000 tonnes contre 48 000 tonnes et 107 hommes contre 160 pour les Typhoons). En termes de classe, ils sont plus précisément la suite des SNLE de classe Delta IV."
 
