 #Bahrain Country Events
 Suez_Crisis_Gulf.51.d:0 "La récente crise de Suez a enflammé les passions arabes à Bahreïn, alors que des milliers de personnes se seraient révoltées contre l'agression britannique contre l'Égypte. Les bâtiments et les véhicules britanniques sont pris pour cible alors que les émeutiers exigent la fin de l'influence britannique à Bahreïn. La monarchie au pouvoir semble incapable d'utiliser ses propres forces pour réprimer les émeutes, certains craignant que des soldats ne rejoignent les émeutiers. Au lieu de cela, le roi a demandé aux Britanniques de déployer leurs propres forces et de mettre fin à la violence. Les Britanniques ont accepté et les troupes britanniques se sont rapidement déployées pour mettre fin aux émeutes et rétablir la paix. Les émeutiers ont réagi principalement en jetant des pierres sur les forces britanniques et en incendiant des véhicules. Toutefois, les Britanniques sont convaincus que l'ordre sera bientôt rétabli."
 NUC.5.d:0 "En réponse à la récente expansion de l'industrie pétrolière, aux troubles sectaires et à l'animosité envers l'influence britannique, un nouveau parti a émergé à Bahreïn. Appelé Comité d'unité nationale, le parti est dirigé par un comité de quatre sunnites et quatre chiites pour faire pression sur le gouvernement afin qu'il autorise les syndicats, mette fin à l'influence britannique et combatte le sectarisme dans le pays. Bien que le programme du parti semble en contradiction avec la monarchie, le gouvernement de Bahreïn a décidé de légaliser le parti et de l'accepter comme force politique légitime dans le pays. Cette décision est accueillie localement comme le signe d'une monarchie mature. Cependant, les éléments pro-britanniques et les traditionalistes craignent que légaliser cette partie ne légalise des pensées politiques plus radicales que ce que le pays peut gérer."
 BAH_FEDERATION.1.d:0 "Le gouvernement de Bahreïn, avec la contribution de ses conseillers britanniques, a demandé un soutien pour la formation d'une fédération arabe du Golfe incluant Bahreïn, Mascate et les États de la Trêve. Le gouvernement note que ces États possèdent un héritage historique commun de relations commerciales et identitaires. Plus important encore, ces régions possèdent des ressources naturelles précieuses et une Fédération arabe du Golfe forte est le seul moyen de garantir qu'une puissance extérieure ne s'en empare pas et n'exploite pas ces ressources. Ils notent également que cette nation proposée assumerait le fardeau de la défense et soulagerait l'armée britannique. Londres examinerait cette demande de près. Les plus grandes puissances régionales de la région suivraient la situation avec une légère inquiétude, car une telle fédération modifierait la dynamique dans la région."
 BAH_FEDERATION.2.d:0 "Le gouvernement britannique, après d'intenses réunions, a décidé d'accepter la proposition du gouvernement de Bahreïn de former une nouvelle nation appelée Fédération arabe du Golfe. Ce nouvel État réunira Bahreïn, Mascate et les États de la Trêve. Les Britanniques ont apparemment été convaincus par cette proposition et voient un avantage à regrouper les ressources naturelles de ces États sous une autorité unifiée. Des membres de l'armée britannique auraient déclaré que cela garantirait la protection de ces ressources contre les États voisins et réduirait la pression sur la Grande-Bretagne pour défendre ces terres. Bien que le gouvernement britannique semble plutôt satisfait, certains observateurs notent que la Fédération arabe du Golfe devra gérer l'ego de plusieurs dirigeants absolus et notent qu'un tel État pourrait finir par déstabiliser la région au fil du temps."
 BAH_FEDERATION.3.d:0 "Le gouvernement britannique, après d'intenses réunions, a décidé de rejeter la proposition du gouvernement de Bahreïn de former une nouvelle nation appelée Fédération arabe du Golfe. Ce nouvel État aurait uni Bahreïn, Mascate et les États de la Trêve. Le gouvernement britannique a indiqué qu'il respectait la proposition de son proche allié de Bahreïn, mais a conclu qu'un tel État n'était pas réalisable ni dans l'intérêt des populations de la région. Le gouvernement de Bahreïn sera probablement contrarié par cette évolution et déjà des rumeurs se répandent selon lesquelles la décision britannique était une conspiration visant à garantir que ces États arabes restent faibles et divisés. Cependant, la nouvelle est bien accueillie par les puissances régionales qui craignaient qu'un tel État ne menace l'équilibre des pouvoirs dans la région."
 BAH_FEDERATION.4.d:0 "Après l'approbation du gouvernement britannique, les dirigeants de Bahreïn, de Mascate et des États de la Trêve ont immédiatement commencé à mettre en oeuvre des plans pour la formation de la Fédération arabe du Golfe. Les responsables britanniques ont aidé à coordonner ces efforts et le moment est désormais venu. Dans la capitale du Bahreïn, une cérémonie complexe de lever du drapeau a eu lieu. Les dirigeants de la nouvelle nation ont déclaré à l'auditoire des dignitaires rassemblés que la Fédération arabe du Golfe représentait l'unité arabe et un bastion de défense contre les mauvaises influences et les ennemis du peuple. Ils ont également promis à la foule une ère de développement économique incroyable qui ferait l'envie du peuple du nouvel État. A l'issue de la cérémonie, les chefs d'Etat ont signé un accord, aux côtés des responsables régionaux britanniques, confirmant l'émergence de la Fédération arabe du Golfe."   #Major
 General_Strike.2.d:0 "À Bahreïn, la grève générale qui a ravagé le pays ces derniers jours semble toucher à sa fin. Le principal conseiller du roi de Bahreïn, Charles Belgrave, a remis sa démission. Telle était la principale revendication des grèves organisées par le Comité réformiste d'unité nationale. L'organisation croit fermement à la fin de l'influence britannique à Bahreïn et cette démission marque une victoire pour le groupe. Charles Belgrave occupe son poste de direction à Bahreïn depuis près de trente ans et sa démission semble être intervenue après avoir réalisé que la situation s'aggravait. La destitution de Belgrave affaiblit l'influence britannique sur l'île mais démontre à la monarchie la menace du pouvoir de la rue."
 Suez_Crisis_Gulf.50.d:0 "La situation à Bahreïn s'est détériorée alors que les émeutes ravagent la capitale. Beaucoup sont descendus dans la rue pour protester avec colère contre la crise de Suez et l'agression britannique contre l'Égypte. Les émeutiers exigent que le gouvernement mette fin à l'influence britannique et estiment que Bahreïn doit soutenir l'Égypte dans sa lutte. Le manque d'ouverture politique combiné au mépris de la présence britannique manifeste sur l'île a exaspéré la situation et les émeutiers ciblent non seulement les bâtiments britanniques, mais également les magasins destinés aux étrangers. Le gouvernement semble incapable de contenir le soulèvement car le roi a retenu ses forces militaires, on craint que les soldats finissent par soutenir les émeutiers et le gouvernement ne souhaite pas que les émeutes s'intensifient. Le gouvernement a déjà annoncé qu'il réduirait l'influence des conseillers britanniques dans l'orientation des politiques, mais cela n'a pas mis fin aux protestations."
 Bab_Al_Bahrain.1.d:0 "Le gouvernement de Bahreïn a officiellement ouvert aujourd'hui Bab Al Bahreïn à des foules enthousiastes. Ce magnifique monument sera le premier espace public de la petite nation insulaire et le gouvernement espère qu'il offrira de meilleurs équipements aux citoyens de Bahreïn. Le projet est né de l'idée originale de Charles Belgrave, le principal conseiller du roi. Aux côtés des banques, des magasins et des restaurants, le monument marque l'entrée du marché de Manama. En outre, le gouvernement prévoit également de déplacer ses principaux bâtiments autour du monument. Belgrave est convaincu que le monument contribuera à rendre Bahreïn plus attrayant et facilitera l'augmentation du commerce avec l'île. Le monument est perçu très favorablement et considéré par les citoyens comme un symbole du nouveau Bahreïn moderne."
 NUC.10.d:0 "Depuis que le Comité réformiste d'unité nationale (NUC) a vu le jour, il s'est engagé dans l'orchestration de grèves et d'émeutes. Bien que leurs objectifs semblent se limiter à l'amélioration des droits des travailleurs, à la fin de l'influence britannique et à la lutte contre le sectarisme, il est devenu clair que le groupe nourrissait des ambitions plus sombres. Leur récente grève générale a plongé le pays dans des journées de violentes émeutes qui ont menacé la stabilité du Bahreïn. Les principaux dirigeants du NUC ont été arrêtés et jugés par un tribunal spécial. Aujourd'hui, ce tribunal a rendu son verdict et a décidé d'exiler ces dirigeants de Bahreïn dans une prison de Sainte-Hélène pour quatorze ans. Les Britanniques ont accepté de garder ces hommes et ils ne seront autorisés à revenir qu'après avoir purgé leur peine. Le gouvernement a annoncé le verdict et proclamé que les destructeurs de la paix avaient été justement punis. La réaction dans la rue a été muette."

 #Bahrain News Events
 General_Strike.1.d:0 "Depuis que le Comité d'unité nationale (NUC) a vu le jour, il a plaidé en faveur des syndicats, de la fin de l'influence britannique et du sectarisme. Leur programme réformiste leur a permis une grande influence et, dans un geste audacieux, ils ont déclaré une grève générale. L'objectif principal de cette grève est la destitution de Charles Belgrave de son poste de conseiller principal du roi. Pour beaucoup à Bahreïn, Belgrave symbolise l'influence britannique manifeste sur le pays depuis son arrivée il y a près de trois décennies. Les premières tentatives de la police pour contenir ou disperser les manifestations se sont retournées contre elles. Des émeutes éclatent lentement et à mesure que la violence s'intensifie. Jusqu'à présent, le gouvernement a refusé d'accepter les demandes du NUC, mais il sait certainement que le groupe constitue désormais une menace puissante pour la politique gouvernementale."
 Bahrainian_Revolution.1.d:0 "La crise de Suez a enflammé les passions arabes à Bahreïn alors que des milliers de personnes sont descendues dans la rue pour protester contre les actions britanniques contre l'Égypte. Les manifestants ont jeté des pierres sur les responsables britanniques dans le pays et ont saccagé des bâtiments gérés par les Britanniques dans la capitale. Les émeutes ont été accompagnées de grèves organisées par le Comité syndical national. Cependant, ces derniers jours, des révolutionnaires nationalistes arabes se sont approchés des émeutiers et les ont retournés hier contre la monarchie au pouvoir. Les émeutiers, désormais révolutionnaires, se sont retournés contre le gouvernement, exigeant une législature élue et un nouveau régime pour Bahreïn. Les manifestants ont commencé à s'emparer des bâtiments gouvernementaux et des stations de radio, déclarant que le peuple devait mettre fin à la monarchie réactionnaire et libérer Bahreïn de la Grande-Bretagne. Le roi a déployé ses forces pour réprimer les émeutes, affirmant que le NUC était un front d'influence étrangère de gauche, mais la plupart des troupes ont rejoint les manifestants le matin où le pays a été pris par les révolutionnaires."
 Bahrainian_Revolution.2.d:0 "Pendant près de trois décennies, le conseiller britannique Charles Belgrave a été le principal conseiller de la monarchie à Bahreïn. Sous son influence, Bahreïn a lancé une série de réformes sociales et économiques destinées à moderniser le pays, tout en irritant souvent les traditionalistes. De même, son influence surdimensionnée était considérée par la plupart des citoyens de Bahreïn comme un symbole de l'influence et du contrôle britanniques continus sur le pays. Au cours des récentes émeutes et de la révolution, nombreux sont ceux qui reprochent à Belgrave d'avoir poussé le roi à réprimer violemment les manifestations et de le tenir pour responsable des pertes civiles subies. Charles Belgrave se rendit aux révolutionnaires une fois qu'il devint clair que la monarchie avait perdu le pouvoir et fut bientôt publiquement exécuté. Les révolutionnaires ont affirmé que sa mort marquait la libération, mais cette action est largement condamnée dans la région et dans le monde. Beaucoup à Londres sont sensibles à cette tournure des événements et il reste à voir comment les Britanniques réagiront à cette provocation."
 Bahrainian_Revolution.3.d:0 "La nouvelle de l'exécution de Charles Belgrave par les révolutionnaires a provoqué une panique massive au sein de la population britannique de l'île. Pour apaiser cette tension et prévenir de nouvelles violences contre ses citoyens, le gouvernement britannique a annoncé le retrait complet de ses forces et une évacuation complète de ses citoyens. Les sujets britanniques affluent vers les installations militaires britanniques pour se protéger alors que l'armée britannique a commencé à envoyer des vols pour évacuer les citoyens. Une fois les civils britanniques évacués en toute sécurité, les forces britanniques suivront peu de temps après. Les sujets et les forces britanniques ont joué un rôle majeur en aidant l'industrie pétrolière et la défense de Bahreïn, leur retrait unilatéral entravera certainement l'économie."
