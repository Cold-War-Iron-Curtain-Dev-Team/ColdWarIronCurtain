 Banned_Foriegn_Car_Imports_desc:0 "Interdiction stricte ou quotas stricts sur les automobiles étrangères importées pour protéger l'industrie manufacturière américaine."
 USALGB80s.1.t:0 "Légalisation de l'homosexualité"
 USALGB80s.1.d:0 "Dans le cadre d'un changement législatif et judiciaire historique, les États-Unis ont progressé vers la décriminalisation et la reconnaissance légale des relations homosexuelles dans tout le pays. Suite au lobbying intense des défenseurs des libertés civiles et des coalitions progressistes, les lois discriminatoires sont abrogées, marquant un tournant majeur dans la politique sociale américaine et les droits LGBTQ+."
 USALGB80s.1.a:0 "Une avancée historique."
 Second_Korean_War.1.t:0 "[GetNewspaperHeader]Déclenchement de la Seconde Guerre de Corée"
 Second_Korean_War.1.d:0 "L'impasse tendue le long de la DMZ s'est à nouveau transformée en guerre totale. Suite à l'escalade des escarmouches aux frontières et des frappes de représailles, les forces américaines et sud-coréennes ont lancé une offensive à grande échelle pour neutraliser le régime de Pyongyang. Alors que l'artillerie gronde sur la péninsule et que les frappes aériennes frappent les positions au nord, le monde retient son souffle alors que le spectre d'un affrontement entre superpuissances revient en Asie."
 Second_Korean_War.1.a:0 "La péninsule brûle à nouveau."
 Dewey.11.t:0 "[GetNewspaperHeader]Le président Dewey dénonce les attaques contre les rouges"
 Dewey.11.d:0 "Dans un discours passionné devant la presse et les dirigeants du Congrès, le président Thomas Dewey a dénoncé avec force les accusations irresponsables de sympathies communistes et de poursuites infondées contre les rouges. Soulignant l'importance des libertés constitutionnelles, d'une procédure régulière et d'une gouvernance raisonnée, Dewey a exhorté les deux parties à éviter l'hystérie tout en maintenant une sécurité nationale vigilante."
 Dewey.11.a:0 "Un appel à la modération."
 MacArthur.6.t:0 "[GetNewspaperHeader]Le président MacArthur s'en prend au Klan"
 MacArthur.6.a:0 "Bonne nouvelle"
 Brown80.10.t:0 "[GetNewspaperHeader]Le programme d'énergie solaire spatiale"
 Brown80.10.d:0 "L'administration Brown a annoncé une initiative révolutionnaire visant à lancer des capteurs orbitaux d'énergie solaire et des technologies d'énergie renouvelable pour les États-Unis."
 Brown80.10.a:0 "Une vision audacieuse pour l'avenir."
 Rockefeller80.1.t:0 "Expansion du réseau des parcs nationaux"
 Rockefeller80.1.d:0 "Le président Rockefeller a autorisé une expansion majeure du National Park Service, protégeant des centaines de milliers d'acres de nature sauvage américaine vierge."
 Rockefeller80.1.a:0 "Conserver notre patrimoine naturel."
 Rockefeller80.2.t:0 "[GetNewspaperHeader]Un nouveau parti républicain"
 Rockefeller80.2.d:0 "Sous la direction de Nelson Rockefeller, les républicains modérés et libéraux ont repris le flambeau du parti, inaugurant une nouvelle ère d'investissement civique et de progressisme social."
 Rockefeller80.2.a:0 "Une direction moderne pour le GOP."
