l_french:
 flavor90.1.t:0 "[GetNewspaperHeader]L'Allemagne est un seul pays"
 flavor90.1.d:0 "Les deux Etats allemands se sont unis. Berlin est à nouveau la capitale d'une seule Allemagne et la frontière intérieure a disparu."
 flavor90.1.a:0 "Nous sommes un seul pays."
 flavor90.1.b:0 "La frontière a disparu."
 flavor90.1.c:0 "L'Allemagne est unie."
 flavor90.2.t:0 "[GetNewspaperHeader]Le traité de Maastricht"
 flavor90.2.d:0 "Les Douze ont signé un traité à Maastricht. Il les engage en faveur d'une monnaie unique et d'une union européenne plus étroite."
 flavor90.2.a:0 "Le traité est signé."
 flavor90.2.b:0 "L'Europe se rapproche."
 flavor90.3.t:0 "[GetNewspaperHeader]Los Angeles brûle"
 flavor90.3.d:0 "Un jury a acquitté les policiers qui ont battu Rodney King et Los Angeles a été incendiée. Les émeutes se sont étendues au sud de la ville."
 flavor90.3.a:0 "La ville brûle."
 flavor90.3.b:0 "Une semaine épouvantable."
 flavor90.4.t:0 "[GetNewspaperHeader]Le tunnel sous la Manche s'ouvre"
 flavor90.4.d:0 "Les trains circulent sous la Manche. La Grande-Bretagne et la France sont reliées par chemin de fer pour la première fois, et les ferries ne sont plus le seul moyen de traverser."
 flavor90.4.a:0 "Le tunnel est ouvert."
 flavor90.4.b:0 "Paris est plus proche."
 flavor90.4.c:0 "Ils ont creusé sous la mer."
 flavor90.5.t:0 "[GetNewspaperHeader]La ville d'Oklahoma"
 flavor90.5.d:0 "Un camion piégé a détruit le bâtiment fédéral d'Oklahoma City. L'explosion a tué des personnes à leur bureau, notamment des enfants de la garderie du bâtiment."
 flavor90.5.a:0 "Trouvez qui a fait ça."
 flavor90.5.b:0 "Une terrible attaque."
 flavor90.6.t:0 "[GetNewspaperHeader]Retours à Hong Kong"
 flavor90.6.d:0 "A minuit, le drapeau britannique est descendu à Hong Kong et le drapeau chinois a été hissé. Un siècle et demi de domination coloniale est terminé."
 flavor90.6.a:0 "Le bail est terminé."
 flavor90.6.b:0 "Hong Kong est de retour."
 flavor90.6.c:0 "Le drapeau a changé."
 flavor90.7.t:0 "[GetNewspaperHeader]La mort de Diane"
 flavor90.7.d:0 "Diana, princesse de Galles, est décédée dans un accident de voiture à Paris. Le deuil en Grande-Bretagne a interrompu l'actualité ordinaire."
 flavor90.7.a:0 "Le pays s'est arrêté."
 flavor90.7.b:0 "Une triste journée."
 flavor90.8.t:0 "[GetNewspaperHeader]Le millénaire"
 flavor90.8.d:0 "Les calendriers sont passés à l'an 2000. Les pannes informatiques tant redoutées ne se sont pas produites et les lumières sont restées allumées."
 flavor90.8.a:0 "Les lumières sont restées allumées."
 flavor90.8.b:0 "Le siècle a tourné."
