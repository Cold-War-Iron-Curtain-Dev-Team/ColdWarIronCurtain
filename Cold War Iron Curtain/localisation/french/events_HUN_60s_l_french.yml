l_french:
 HUN_Kadar.1.d:0 "La révolution hongroise et ses conséquences ont laissé des cicatrices de longue date en Hongrie, non seulement pour son peuple, mais aussi pour le gouvernement. Non seulement notre gouvernement doit faire face à un mécontentement croissant et à une économie en difficulté, mais il doit aussi trouver sa place auprès d'une population peu réceptive. Même si nous avons du pain sur la planche, nous avons en même temps une rare opportunité de remodeler et de remanier complètement la société hongroise, ainsi que de sauver et de remanier complètement le système socialiste pour mieux répondre aux besoins du Hongrois moyen. Nous faisons partie des lignes de front du Pacte de Varsovie et nous devons prouver notre stabilité, notre fiabilité et, avec suffisamment d'efforts, modéliser une économie capable de rivaliser avec celle des États d'Europe occidentale."
 HUN_Kadar.2.d:0 "Imre Nagy était un démolisseur capitaliste et un traître de sang-froid. C'est un fait. Cependant, la direction du camarade Kadar est toujours pragmatique et il peut reconnaître que même un traître peut avoir une ou deux idées qui méritent d'être étudiées. Nos alliés semblent faire preuve d'un zèle excessif dans leur rhétorique anti-occidentale. Même si leur engagement en faveur de la cause socialiste constitue un trait admirable, nous voulons nous assurer que la guerre froide reste froide.\n\nDe plus, nous n'avons pas de folie des grandeurs infondée. Nous savons très bien que nous sommes loin derrière l'Occident dans presque tous les domaines, sauf en matière de moralité. Sans compter que si nous voulons un jour être considérés comme un État reconnu, nous avons besoin à la fois du soutien de leurs libérateurs soviétiques et de celui de l'Occident. Dans le même temps, de nombreux membres de notre parti s'opposent catégoriquement à cette idée ; après tout, si nous allons trop loin, nous risquons une nouvelle fois une intervention soviétique, sans compter que faire trop de concessions inutiles détruira pratiquement notre économie déjà fragile."
 HUN_Kadar.3.d:0 "Le VIIIe Congrès du Parti est peut-être l'événement le plus crucial pour notre parti depuis la fin des événements redoutés de 1956. Ici, la nouvelle direction de notre nation a été définitivement décidée, et que faire maintenant que nous avons de l'espace pour respirer ?\n\nLe camarade Kadar, et par extension, le parti, a décidé de suivre les traces du camarade Khrouchtchev en nous éloignant de notre voie stalinienne et en adoptant les réformes nécessaires ; telles que l'amnistie générale, la réforme du marché, les politiques consuméristes et bien plus encore. Notre parti s'affirme fermement comme socialiste, mais l'ère de l'autoritarisme inutile est loin derrière nous, et en tant que parti censé représenter et élever le prolétariat ; alors nous devrions changer pour répondre à leurs besoins."
 HUN_Kadar.4.d:0 "Maintenant que le Congrès a été adopté, il est temps de répondre enfin à la question de politique étrangère, en particulier en ce qui concerne deux des plus grands défis auxquels nous sommes actuellement confrontés : celui de notre reconnaissance, de notre déficit commercial et de nos finances globales.\n\nLa première option, celle privilégiée par le camarade Kadar, est de s'ouvrir au monde occidental. Cela nous rapprochera encore plus de la reconnaissance internationale, ouvrira la possibilité de retirer les prêts des pays occidentaux à la fois pour les réinvestir et pour faire face aux coûts croissants liés à nos nouvelles politiques consuméristes. Cela étant dit, cela laisse également ouverte une nouvelle série de problèmes, car cela laissera négligés nos échanges commerciaux déjà existants et nécessaires avec nos alliés actuels et leur permettra de se dégrader, nuisant à la fois à nous et à nos voisins. De peur de mentionner que nous risquons de susciter la colère de l'Union soviétique, et même de celle de notre parti, une seconde fois. En outre, même si les prêts constitueront une bouée de sauvetage désespérément nécessaire à court terme, notre économie n'est pas en mesure de rembourser les emprunts importants que nous contractons et risque de créer une nouvelle crise.\n\nL'autre option est populaire parmi les membres conservateurs de notre parti : elle consiste à renforcer nos liens économiques au sein du COMECON et du monde socialiste. Cela permettra d'accroître le niveau de coopération et d'efficacité au sein du COMECON et de combler notre déficit en temps voulu ; et nous aider à développer notre économie dans une perspective à long terme. Cela aussi a ses problèmes, car cela n'apporte aucune solution en ce qui concerne la reconnaissance internationale, nous isolant davantage de plus de la moitié du monde ; et tout en apportant une croissance économique à long terme et une solution à notre déficit commercial, cela ne nous apporte aucune solution immédiate à nos coûts croissants, que nous avons du mal à suivre actuellement.\n\nLes deux propositions ont leurs mérites, mais nous ne pouvons pas choisir les deux. Il est temps de décider."
 HUN_Kadar.5.d:0 "Ces derniers mois, nos camarades de Budapest ont déployé des efforts considérables pour développer considérablement l'infrastructure économique ainsi que les connexions entre nos alliés d'Europe de l'Est. Cela dit, la Hongrie reste confrontée à une multitude de problèmes qu'elle est incapable de résoudre seule. L'économie hongroise dépend largement du commerce, qui peine à fonctionner pleinement en raison d'un déficit toujours croissant. De plus, la Hongrie est confrontée aux dépenses croissantes du gouvernement de Kadar ; ce que certains membres de notre parti considèrent comme la faute de Kadar lui-même ; nous devrions néanmoins envisager d'envoyer de l'aide. Garantir la dépendance économique de la Hongrie à l'égard de Moscou, ainsi que la croissance à long terme de l'un de nos alliés de première ligne à moindre coût pour nous-mêmes, serait une entreprise insensée. Quoi qu'il en soit, le parti doit décider quoi faire."
 HUN_Kadar.6.d:0 "Malgré notre succès sans précédent, un nombre croissant de voix au sein du parti sont mécontentes de la direction du camarade Kadar. Il y a un volume croissant de rumeurs, de rumeurs selon lesquelles le réformisme de Kadar flirte trop dangereusement avec le capitalisme, d'accusations selon lesquelles ses réformes ressemblent beaucoup trop à celles de Nagy pour être confortables. Ces voix semblent s'être accrues et intensifiées seulement après que Kadar ait commencé à remanier l'appareil du parti, mettant à l'écart les conservateurs autrefois éminents. Même si rien n'est sûr pour l'instant, quelque chose de dangereux se prépare dans la fête."
 HUN_Kadar.7.d:0 "Alors que nous avons une meilleure idée de qui est à l'origine de la dissidence croissante au sein du parti, de nombreux signes pointent vers l'ancien ministre de l'Intérieur Bela Biszku. Autrefois homme politique de premier plan après 1956, souvent même considéré par beaucoup comme le numéro deux de Kadar, Biszku a été rétrogradé, mis à l'écart et laissé pour compte après la mise en oeuvre de la politique d'amnistie générale de Kadar et de sa décision de nommer des réformateurs. Biszku lui-même, même s'il n'est pas opposé aux réformes nécessaires, est un opposant de premier plan aux éléments capitalistes du « communisme goulasch » et beaucoup à Moscou le considèrent comme plus conforme à la doctrine du Kremlin. Il n'a pris aucune mesure notable contre Kadar et n'a jusqu'à présent été qu'une voix critique de premier plan au sein du parti. Pour l'instant, nous ne pouvons que regarder et attendre."
 HUN_Kadar.8.d:0 "Le directeur du KGB, Yuri Andropov, a récemment reçu une note intéressante et inquiétante de nos amis de Budapest. Alors que nous continuons à nous éloigner des échecs de Khrouchtchev, de nombreuses personnes en Hongrie cherchent à nous rejoindre. Une coalition de conservateurs hongrois, dirigée par Bela Biszku, en disgrâce, est venue nous voir avec un appel pour les aider à renverser Kadar afin de restaurer le régime socialiste conservateur en Hongrie, en cherchant à ramener la Hongrie à une économie planifiée et en faisant reculer une grande partie des réformes capitalistes de Kadar.\n\nDe nombreux membres du parti sont divisés sur la marche à suivre. D'un côté, l'ampleur des réformes de Kadar, si elles ne sont pas contrôlées, est très dangereuse, et la Hongrie est condamnée à faire face à de nouvelles crises si elle ne prend pas son rythme.\n\nBiszku lui-même a rencontré personnellement à plusieurs reprises le camarade Brejnev et compte de nombreux alliés éminents au sein du gouvernement hongrois. De plus, sa politique et la justification de notre intervention s'inscrivent parfaitement dans la doctrine Brejnev, couplée au fait que nombreux sont ceux au sein du KGB qui sont désireux de donner suite à cette demande.\n\nDans le même temps, cela pourrait très facilement être déformé et considéré comme une énième invasion de la Hongrie ; et pourrait, si elle est mal gérée, annuler les grands progrès que nous avons réalisés avec la Détente, en particulier après Prague en 1968. Quoi qu'il en soit, nous devons choisir qui, selon nous, sera le meilleur pour la Hongrie, Kadar ou Biszku."
 HUN_Kadar.9.d:0 "Des nouvelles choquantes nous sont parvenues de Moscou, puisque la révélation d'une tentative de coup d'État nous a été révélée. Un groupe de conservateurs, centré autour de Bela Biszku, a contacté Moscou en secret, dans l'espoir d'obtenir l'aide du KGB, sous couvert de la doctrine Brejnev. Beaucoup au sein du KGB s'étaient même rangés du côté de Biszku ; cependant, une décision de dernière minute les a empêchés de prendre des mesures et Kadar a été informé de la situation en cours. En fin de compte, il a été décidé que le KGB continuerait à diriger Biszku, afin de ne pas susciter de soupçons ; tandis que le camarade Kadar retirerait discrètement Biszku de ses postes de pouvoir restants, afin d'empêcher la situation d'atteindre l'opinion publique et de maintenir la stabilité du parti."
 HUN_Kadar.10.d:0 "Les forces soviétiques se retrouvent une fois de plus réparties à travers la Hongrie à la suite d'un énième changement de gouvernement dans le bloc de l'Est. Car les réformes de Janos Kadar, bien que populaires auprès du peuple, ont fini par se faire de nombreux ennemis au sein du parti. Beaucoup considéraient le « communisme Goulash » comme une poussée directe vers le capitalisme, le problème ne faisant que s'exacerber lorsque Kadar tentait de mettre à l'écart les conservateurs et les derniers partisans de la ligne dure dans le but d'empiler le parti avec des éléments réformistes. Aujourd'hui à Budapest, le ministre de l'Intérieur, Bela Biszku, autrefois en disgrâce, a été intronisé comme successeur de Kadar, alors que Janos Kadar a été contraint de démissionner et de prendre sa retraite, sous la pression du nouveau gouvernement conservateur et du KGB.\n\nBiszku a déjà commencé à purger le parti des réformateurs et à annoncer son intention d'abandonner les réformes économiques de Kadar afin de ramener la Hongrie à une économie planifiée. La réaction de la population hongroise a été une réaction de confusion et de colère, alors que le pays s'est retrouvé une fois de plus en proie à des émeutes et à des manifestations. La réaction de la communauté internationale a été mitigée, avec indignation et dénonciations de la part de l'Occident, et éloges et reconnaissance de la part de l'Est. Ce que l'avenir réserve au gouvernement Biszku, seul le temps nous le dira."
 HUN_Kadar.11.d:0 "L'Armée populaire hongroise est loin d'être ce que nous considérons comme une force de combat moderne. Dans un monde idéal, la Hongrie pourrait se permettre une réorganisation et une expansion à grande échelle de ses forces armées. Cependant, en réalité, non seulement la Hongrie ne peut tout simplement pas se le permettre, mais nous n'en avons pas non plus besoin. Peut-être qu'un jour dans le futur nous pourrons recréer une armée dont les Hongrois pourront être fiers, mais pour l'instant, notre attention est portée sur notre peuple et sur l'économie. Cela dit, cela ne veut pas dire que nous pouvons simplement ignorer nos forces. Il est temps d'entamer un processus de réduction et de modernisation ; En réduisant nos forces armées, nous pouvons nous permettre d'acquérir des équipements de meilleure qualité et plus modernes, et une fois qu'ils auront été suffisamment modernisés, nous pourrons les étendre à nouveau."
 HUN_Kadar.12.d:0 "Lors de la tentative réactionnaire de contre-révolution de 1956, des sections de l'armée de l'air de l'armée populaire hongroise se sont rangées du côté des traîtres, ce qui a conduit les Soviétiques à la démilitariser par la force pour notre propre sécurité. Même si nous sommes reconnaissants que la Hongrie ne soit plus confrontée à une menace interne, nous sommes un pays situé en première ligne du Pacte de Varsovie et nous ne pouvons plus laisser nos champs vétustes et vides. Même si nous ne pouvons pas entièrement rééquiper et moderniser l'armée de l'air, compte tenu des lacunes de nos industries militaires, il s'agit néanmoins d'une tâche cruciale que nous devons entreprendre. La modernisation et l'expansion de nos aérodromes contribueront également grandement à rembourser nos alliés soviétiques pour leur aide en 1956, car nous pouvons garantir à leurs pilotes une marge de manoeuvre suffisante dans l'avenir des opérations en Europe occidentale et dans les Balkans."
 HUN_Kadar.13.d:0 "Alors que les effets du communisme goulasch et du socialisme de consommation se propagent dans toute la société hongroise, le peuple hongrois a étonnamment bien accueilli ces réformes. Beaucoup diront peut-être que cela est intrinsèquement dû aux « éléments capitalistes » mal perçus de nos réformes ; Cependant, cela ne pourrait pas être plus éloigné de la vérité, car le soutien du public à notre gouvernement augmente à un rythme que nous n'aurions même pas pu prédire.\n\nSi seulement nous parvenons à maintenir un rythme constant de réformes et à étendre l'influence culturelle de nos réformes, nous pouvons assurer la longévité de notre gouvernement, garantissant le socialisme sans le soutien de l'Union soviétique."
 HUN_Kadar.14.d:0 "Avec le socialisme assuré en Hongrie et avec des normes sociales en constante évolution au niveau international, le parti se retrouve avec une question pertinente : quel sera le rôle des femmes et des homosexuels dans notre République populaire ?\n\nD'un côté, nombreux sont ceux dans notre parti qui souhaitent s'affranchir du droit de vote sur la base de l'unité socialiste, ainsi que conserver une apparence moderne ; des États comme l'Allemagne de l'Est accordent même aux homosexuels tous les droits légaux. Une nouvelle vague de soutien public de la part de ces groupes contribuerait à maintenir le soutien populaire à notre gouvernement et pourrait potentiellement remplir notre industrie en pleine croissance d'un afflux immédiat de nouveaux travailleurs.\n\nD'un autre côté, nombreux sont ceux parmi notre population, en particulier dans les zones rurales, qui ont encore une vision du monde résolument conservatrice et dépassée, selon nos normes. Un émancipation hâtive risque autant de perturber davantage notre population que de gagner sa faveur.\n\nMême s'il n'est pas nécessaire de prendre une décision dans l'immédiat, une décision devra être prise éventuellement, idéalement au cours de la décennie."
 HUN_Kadar.15.d:0 "La question du droit de vote des femmes est un sujet brûlant à l'échelle mondiale ; cependant, il n'est pas aussi populaire ici, au sein de notre population majoritairement conservatrice, que dans des pays comme la Grande-Bretagne ou les États-Unis. Néanmoins, même si les appels à l'action peuvent être relativement discrets, l'appel est toujours entendu, et plus nous laissons de côté le problème, plus la situation empirera, et laisser la question sans réponse ne fera que nuire à la perception du parti par le public dans notre période critique de reconstruction. Cela étant dit, la Hongrie a deux choix relativement simples : soit maintenir la position de notre nation avant la libération soviétique, soit rechercher un affranchissement rapide, comparativement parlant.\n\nNotre population est pathétiquement petite par rapport au reste de l'Europe de l'Est, et cela sans même tenir compte de la différence monumentale de taille de population avec les États d'Europe occidentale, où une poignée de villes dépasse la taille de la population de notre pays tout entier. Si nous voulons une croissance à long terme et garantir que nos usines soient pleines de travailleurs, nous devons maintenir les femmes dans le rôle traditionnel de mères. Emprunter cette voie plaira également grandement aux éléments les plus traditionalistes du pays, en particulier aux quelques paysans restants.\n\nCependant, permettre aux femmes d'occuper les mêmes emplois que les hommes, nos projections montrent que cela n'affectera pas le taux de natalité de notre pays à un degré notable, et nos usines ont besoin de plus de travailleurs maintenant, pas plus tard, surtout si nous voulons continuer à augmenter la quantité de produits produits dans le pays. Le monde ne fait qu'apparemment devenir plus progressiste dans sa vision des rôles traditionnels de genre, et si nous choisissons de maintenir notre position traditionnellement dure, nous n'aurons pas seulement à nous soucier de la stabilité interne, mais aussi de la pression internationale des deux côtés de la guerre froide.\n\nMême si nous n'avons peut-être pas encore de réponse, la seule chose sur laquelle nous sommes tous d'accord est que nous devons décider de la voie à suivre le plus tôt possible, de préférence maintenant."
 HUN_Kadar.16.d:0 "La Hongrie compte une population d'homosexuels relativement petite, qui fait partie d'une population mondiale tout aussi réduite. Beaucoup se demandent pourquoi nous avons choisi de prendre position si tôt, mais nombreux sont les membres du parti qui souhaitent éviter les problèmes futurs qui surviendront inévitablement si nous reportons la question trop longtemps. Même si cela peut être déroutant pour certains, le fait d'établir rapidement la position du parti nous donnera une orientation claire pour l'avenir. Tout comme la question du suffrage féminin en Hongrie, la question de l'homosexualité a deux réponses simples entre lesquelles nous devons choisir : soit maintenir les valeurs traditionnelles de notre nation, soit se moderniser pour mieux s'adapter aux normes modernes et aux idéaux socialistes.\n\nRefuser de changer quoi que ce soit ne suscitera probablement aucune réaction immédiate ni aucune attention internationale. Nous pouvons continuer comme si de rien n'était et constater, au mieux, une résistance marginale. La population homosexuelle en Hongrie ne fera qu'augmenter avec le temps, quoi que nous fassions, et à mesure que cette population augmente, la résistance à l'échelle nationale augmentera avec elle.\n\nÀ l'inverse, les réticences que nous subirons suite à la décriminalisation de l'homosexualité s'estomperont probablement et s'éteindront avec le temps, tandis que le maintien de cette criminalisation à long terme ne fera qu'augmenter le volume de la dissidence à mesure que nous nous accrochons à un passé dépassé. Le plus grand problème qui persiste dans la criminalisation de l'homosexualité est qu'elle contredit la politique d'amnistie générale du camarade Kadar, ses objectifs de réduction des écarts avec la population en général, ainsi que sa clémence et sa libéralisation culturelle. Dans le même temps, légaliser à la hâte l'homosexualité ne fera qu'aliéner encore davantage nos populations rurales, même si elles diminuent considérablement.\n\nBien que des arguments pour ou contre l'un ou l'autre argument puissent être avancés et que le débat puisse se poursuivre, nous sommes ici pour prendre une décision, pas pour discuter."
 HUN_Kadar.17.d:0 "Les militants des droits civiques du monde entier ont réagi aujourd'hui avec choc et horreur aux nouvelles en provenance de Budapest, alors que la décision de non seulement maintenir mais aussi d'élargir la base de données hongroise sur l'homosexualité a été prise plus tôt dans la journée. Créée dans les années 1880 avant même l'effondrement de l'Autriche-Hongrie, utilisée tout au long de la Seconde Guerre mondiale et même sous le règne d'Imre Nagy, la base de données servait de registre pour tous les homosexuels enregistrés vivant en Hongrie et était utilisée pour justifier ou déclencher des arrestations et des emprisonnements massifs afin d'identifier les homosexuels dans le pays. Dans le cadre de la politique d'amnistie générale de Janos Kadar et des efforts visant à réformer la culture hongroise dans une direction plus progressiste, beaucoup s'attendaient au moins à un assouplissement de la position sur le sujet, voire à une décriminalisation totale de l'homosexualité. Cependant, il a été récemment décidé que la base de données serait élargie, des informations faisant état de nombreuses personnes répertoriées dans la base de données appréhendées par la police, soumises à un chantage et menacées de révéler leurs noms pour élargir la base de données, et augmentant la sévérité des sanctions associées à l'homosexualité. Cette décision récente a suscité de vives réactions de la part de l'Union soviétique et des États-Unis, de nombreux observateurs politiques notant que cela ne servira probablement qu'à entraver les tentatives de Kadar d'obtenir la reconnaissance occidentale de son gouvernement."
 HUN_Kadar.18.d:0 "Les militants des droits des homosexuels du monde entier ont célébré aujourd'hui une étape importante lorsque des informations en provenance de Budapest ont indiqué que Janos Kadar avait annoncé la destruction de la base de données hongroise sur l'homosexualité. Créée dans les années 1880 pendant la période austro-hongroise, utilisée pendant la Seconde Guerre mondiale et à l'époque de Nagy, la base de données servait de registre de tous les homosexuels enregistrés vivant en Hongrie et était utilisée pour justifier les arrestations et les emprisonnements. Avec la politique d'amnistie générale et la politique sociale progressiste de Kadar, beaucoup s'attendaient à une position plus douce, mais ne s'attendaient pas à cette décision. Avec la libéralisation continue de la culture et du cadre juridique hongrois, la position plutôt dure que beaucoup avaient autrefois à l'égard du nouveau régime après 1956 a commencé à s'assouplir. Cependant, les critiques les plus sévères de Kadar considèrent la destruction de la base de données comme un moyen de cacher et de dissimuler d'autres violations des droits humains. Quoi qu'il en soit, beaucoup pensent que la légalisation complète de l'homosexualité en Hongrie est en vue !"
 HUN_Kadar.19.d:0 "Magyar Radio Es Televizio, également connue sous le nom de Radio et Télévision Hongroises (en abrégé MTV), sera notre premier et, pour le moment, le plus grand système de diffusion de télévision et de radio du pays, agissant comme une première étape cruciale sur le long chemin vers la modernisation. Avec le temps, nous pourrons organiser et centraliser les émissions de télévision et de radio de tout le bloc de l'Est pour qu'elles soient vues et écoutées en Hongrie. Bien qu'il s'agisse d'un luxe pour notre peuple et crucial pour garantir à la fois le soutien du public et le développement culturel, cela a également des objectifs plus tangibles et pratiques dans l'archivage des informations et des événements importants."
 HUN_Kadar.20.d:0 "La comédie musicale \"The Miraculous Mandarin\" est un ballet pantomime en un acte centré sur une jeune fille vivant dans la grande ville, sans argent, entourée d'un groupe de clochards. Au fur et à mesure que la nuit avance, elle attire plusieurs hommes dans sa chambre, dont aucun n'a d'argent, jusqu'à ce qu'elle et les clochards repèrent un riche mandarin. Alors qu'elle l'attire dans sa chambre, elle commence à danser de manière séduisante ; Alors que la passion de l'homme mandarin monte, il se jette sur la femme, obligeant les clochards à le retenir et à l'étouffer. Le Mandarin est poignardé à trois reprises avec une épée rouillée, jusqu'à être pendu à une lampe. La femme essaie de dire aux hommes de laisser partir le mandarin, mais le mandarin meurt alors qu'ils finissent par s'embrasser.\n\nInitialement interdite en Allemagne en 1926 pour des raisons morales, il s'agit d'une pièce plus ancienne et loin d'être ce que beaucoup considéreraient comme une pièce « sûre » à diffuser. Cependant, le Mandarin miraculeux, aussi répréhensible soit-il, s'est ancré dans notre histoire en tant que première émission télévisée entièrement en couleur."
 HUN_Kadar.21.d:0 "Bien qu'elle soit encore relativement nouvelle, la préservation de notre histoire nationale sous toutes ses formes constitue un rôle de plus en plus important et un outil indispensable pour les générations futures. Une façon d'y parvenir consiste à créer des archives pour stocker et préserver toutes nos émissions de télévision et de radio. Étant donné le rôle crucial que joue MTV dans la programmation des médias hongrois, leur confier la création d'archives est une manière presque garantie de préserver l'intégralité de notre histoire de diffusion. MTV compte déjà plus de 2 millions de téléspectateurs ; près de 3 % de l'ensemble de notre population, avec environ 3 à 5 téléspectateurs par télévision. Beaucoup d'entre nous ne vivront peut-être pas assez longtemps pour constater les avantages des archives, qui ne se manifesteront probablement pas avant la fin de cette guerre froide, mais pourtant, un jour, nous en bénéficierons."
 HUN_Kadar.22.d:0 "Reklam Ur, ou \"M. Advertising\", est l'un des nombreux chefs-d'oeuvre musicaux produits par nos talentueux artistes. Chanson sur la beauté et les joies de la vie, des chansons comme celles-ci sont les symptômes de notre réussite et la preuve que nos réformes fonctionnent. Notre peuple est heureux et peut profiter de la musique comme nulle part ailleurs dans le Pacte de Varsovie ; et en tant que gouvernement, nous n'avons pas besoin d'intervenir pour obtenir les résultats que nous souhaitons. Avec stabilité et légitimité, si nous parvenons à maintenir cette dynamique, les cicatrices de 1956 guériront facilement, et nous pouvons compter sur notre musique pour nous aider dans cet effort."
 HUN_Kadar.23.d:0 "Alors que les impacts culturels de la Communion Goulash continuent de devenir de plus en plus évidents, nous devons maintenant diriger notre attention vers les jeunes. Historiquement, notre système éducatif n'a pas été le meilleur et n'est pas du tout comparable aux normes élevées des pays d'Europe occidentale. Si nous voulons assurer une future génération de prolétariat fidèle, nous devons d'abord garantir la qualité du système et s'il retient tous nos futurs étudiants. En fin de compte, l'objectif est de repenser notre éducation pour créer des travailleurs à la fois compétents et fidèles."
 HUN_Kadar.24.d:0 "Nos efforts pour moderniser notre pays et notre culture commencent avec nos enfants, et à mesure que nous dépendons davantage d'industries plus professionnelles et spécialisées, nous devons garantir que nos futurs travailleurs soient équipés dans leur jeunesse des outils appropriés pour s'épanouir dans une société hongroise moderne. Le projet du parti est vaste, et si on nous donne une génération pour le consolider, nous pouvons presque garantir une Hongrie instruite et pleinement consciente de sa classe. Le plan lui-même vise à éduquer rapidement nos paysans, jeunes et vieux, à élargir les possibilités d'enseignement supérieur grâce aux écoles techniques et professionnelles et à soutenir cet effort d'éducation avec l'aide de professeurs et d'enseignants soviétiques. Même si cela nécessite des efforts concertés, nos plans sont réalisables et nécessaires."
 HUN_Kadar.25.d:0 "Alors que le consumérisme socialiste continue de s'ériger en pierre angulaire de la culture hongroise, garantir que l'abondance des biens de consommation puisse atteindre nos travailleurs déterminera ce qui nous sépare de l'interprétation capitaliste exploiteuse du consumérisme. Non seulement nous fabriquerons autant de nos produits au niveau national, mais nous veillerons à ce que nos populations ne soient jamais trouvées démunies et qu'elles n'aient jamais à se battre pour subvenir à leurs besoins fondamentaux. Réfrigérateurs, téléviseurs, automobiles, jeux de société, tout ce dont nous avons besoin peut être fabriqué et vendu ici. Cela étant dit, nous ne pouvons pas tomber dans le même piège dans lequel sont tombés nos camarades est-allemands et nous connaissons la nécessité absolue du commerce extérieur et du commerce international. Nous réintégrerons la scène mondiale en tant qu'exportateurs de marchandises et non en tant qu'importateurs. Un jour, si nous nous appliquons, les produits fabriqués en Hongrie seront présents dans tout le bloc de l'Est, peut-être même à Moscou, voire au-delà. Avant de pouvoir tourner notre attention vers l'étranger, nous devons d'abord nous assurer que nos ménages sont bien approvisionnés en produits hongrois."
 HUN_Kadar.26.d:0 "Gazdalkodj Okosan, ou « Gérez judicieusement vos finances », est une autre preuve non seulement de l'effet du consumérisme dans la société hongroise, mais aussi de la popularité des réformes du camarade Kadar. Le but du jeu lui-même est d'économiser suffisamment pour pouvoir apporter et meubler une maison avec des biens tels que des aspirateurs, des meubles de salon et de cuisine, des radios, du linge et des machines à coudre. Le premier joueur à meubler la maison et à avoir économisé au moins 2 000 pieds en bons d'épargne est le gagnant. Bien que de nature très similaire à Monopoly, le but du jeu est de montrer nos réformes et constitue une simple goutte d'eau dans l'étang des jeux et des divertissements domestiques que nous avons développés et diffusés au public. Avec des ventes record et des critiques élevées, sa popularité va de soi et constitue une preuve supplémentaire que nous sommes sur la bonne voie. Si nous continuons ainsi, la popularité de notre administration dépassera celle du traître Imre Nagy et ne sera qu'une des nombreuses étapes visant à solidifier le communisme du Goulash."
 HUN_Kadar.27.d:0 "Bien que nous puissions idéalement un jour lancer notre propre industrie automobile nationale, nos citoyens ont besoin de voitures maintenant, d'autant plus que nous cherchons à étendre, rénover et construire de nouvelles autoroutes. Compte tenu de la popularité des voitures étrangères, en particulier des muscle cars soviétiques, dans le bloc de l'Est et à l'échelle internationale, qui de mieux pour se tourner vers l'aide que nos alliés fiables à Moscou ? Parmi toutes leurs voitures, leur série \"Volga\" en particulier est déjà très populaire auprès de nos gens, alors si nous voulons continuer à les conquérir, pourquoi ne pas leur donner plus de ce qu'ils veulent ? Nous augmenterons la disponibilité du Volga, le rendrons moins cher à l'achat pour le grand public, tout en déployant des efforts considérables pour réduire notre déficit commercial. Nos amis soviétiques apprécieront sûrement notre activité commerciale accrue et les revenus supplémentaires qui leur seront envoyés."
 HUN_Kadar.28.d:0 "La société Lehel, fondée en 1945, est la plus grande entreprise hongroise d'électroménager et, bien qu'elle fournisse toutes sortes d'appareils électroménagers, elle est récemment devenue plus connue pour le réfrigérateur Lehel. Bien qu'en surface, ils n'aient rien d'unique, les réfrigérateurs Lehel sont construits pour durer, avec une durée de vie de plusieurs décennies et une grande durabilité. Bien qu'il ne soit pas très isolé, le réfrigérateur Lehel témoigne de la qualité pure et objective des produits hongrois produits dans le pays. Non seulement ces produits sont appréciés par notre peuple, et continueront à l'être, mais nous trouverons des produits fabriqués en Hongrie de Berlin-Est à Moscou, et peut-être un jour jusqu'à Washington même. En continuant à produire pour nous-mêmes et à garantir que nos populations vivent dans l'abondance, nous nous forgerons un nom ainsi que celui de nos produits bien au-delà de nos frontières."
