 newseth60.3.d:0 "Cette semaine, Hailé Sélassié, surpris, a été bombardé par plus de cent mille Jamaïcains fanatiques affluant sur le tarmac, ponctuant leur accueil par des joueurs extatiques de tambours calebasse bruyants avec des nuages âcres de fumée de cannabis alors qu'il tentait de quitter son avion à l'aéroport international de Kingston : annulant ainsi sa cérémonie prévue pour sortir de l'avion. Sa Majesté Impériale (maintenant accompagnée d'éminentes personnalités Rastafari) a ensuite poursuivi son séjour en Jamaïque en participant à plusieurs cérémonies autour de la ville ; d'une visite au palais du Premier ministre à la réception d'un doctorat honorifique à l'Université des Antilles. Cependant, la cérémonie la plus marquante a été celle de sa rencontre avec les figures clés du culte rastafari, qui restera comme un événement légendaire dans l'histoire pour les adeptes du mouvement. Dans toute la diaspora africaine des Antilles, les Rastafaris sont désormais légitimés et pris au sérieux puisque leur prophète, Haïlé Sélassié, leur a témoigné de l'affection. Malgré ce culte littéral d'Haïlé Sélassié par ceux qui prétendent qu'il est la seconde venue de Jésus-Christ, sa majesté impériale leur a insisté sur le fait qu'il était « un homme ordinaire », ce qui n'a guère changé dans leur esprit."
