 eth60.1.d:0 "Hailé Sélassié s'est lancé dans une mission diplomatique de plusieurs semaines à São Paulo pour rencontrer le président de la République fédérative du Brésil et organiser un échange entre différentes personnalités représentatives des deux nations."
 eth60.2.d:0 "Le général de brigade Mengistu Neway a demandé que la plupart des éminents ministres et hommes politiques éthiopiens se réunissent dans la capitale impériale pour une réunion d'urgence."
 newseth60.1.d:0 "À Adis Abeba, ce matin, un événement choquant s'est produit : les généraux Mengistu Neway, Mulugeta Buli et le gouverneur local Garmame Neway ont pris en otage le Premier ministre et des personnalités clés alors que les forces loyales interviennent pour stabiliser la situation. Alors que l'empereur Sélassié est en voyage diplomatique au Brésil, le temps nous dira comment les choses se déroulent..."
 newseth60.2.d:0 "Aujourd'hui a marqué la formation de l'OUA, l'Organisation de l'unité africaine à Addis-Abeba, en Éthiopie, avec ses 32 gouvernements signataires. L'objectif principal de la formation a été annoncé : rassembler les nations africaines et parvenir à l'éradication totale du colonialisme et du néocolonialisme sur le continent. Lors de la première conférence qui a eu lieu le 1er mai, le principal nationaliste gambien Alieu Ebrima Cham Joof a prononcé un discours fortement anti-colonisation en s'exprimant : \"Je vous adjure donc d'ignorer toute suggestion en dehors de l'Afrique et de considérer que la civilisation actuelle, dont se vantent certaines des grandes puissances, est née d'Afrique et de réaliser que le monde entier a quelque chose de terrestre à apprendre de l'Afrique.\" Le monde attend désormais de voir ce que cette nouvelle union peut apporter au continent."
 eth60.3.d:0 "Profitant du voyage de l'empereur, ce matin, une fausse réunion d'urgence a été convoquée où les putschistes éthiopiens dirigés par les généraux Mengistu Neway, Mulugeta Buli et le gouverneur local Garmame Neway ont pris en otage des personnalités clés telles que le Premier ministre Abbebe Aregai."
 eth60.4.d:0 "Les heures qui ont suivi ont été brutales pour ces conspirateurs alors que Mulugeta Buli tente de maintenir la loyauté des forces militaires pour soutenir le coup d'État. Les mesures qu'ils prendront pour garantir cette loyauté décideront à jamais du sort de l'Éthiopie"
 eth60.5.d:0 "Le prince Asfaw Wossen, fils de Hailé Sélassié, a prononcé cette semaine un discours controversé depuis la capitale contrôlée par l'usurpateur. Ponctuer le discours était une proclamation audacieuse pour l'avenir de l'Éthiopie. S'attaquer aux faiblesses et aux lacunes du gouvernement dans la résolution des problèmes qui affligent les masses pauvres des campagnes. Revendiquer un avenir radieux sous une monarchie constitutionnelle dirigée par le prince avec un nouveau cabinet de personnalités progressistes où l'Éthiopien commun n'était plus oublié. Alors que la plupart des observateurs étrangers considéraient le prince comme étant authentique et parlant simplement sous la pression de ses ravisseurs, la jeunesse étudiante et l'intelligentsia locales se sont rassemblées sur la place de la ville pour faire l'éloge."
 eth60.6.d:0 "Les forces dirigées par Mared Mangesha, couvertes de mitrailleuses lourdes, d'avions de reconnaissance, de chars légers et d'un grand peloton d'infanterie, ont pris d'assaut le centre de la capitale cet après-midi. Alors que de nombreux conspirateurs mouraient au combat, les deux principaux organisateurs, les frères Neway, tuèrent dans un dernier moment de lâcheté leurs otages, dont le Premier ministre et vétéran de la guerre italo-éthiopienne, Abebe Aregai. Étonnamment, dans leur tentative désespérée de s'échapper, les deux hommes ont tué leur compagnon comploteur Mulugeti Bulli lors d'une dispute. Tout en ayant pu fuir la capitale, Germame Neway et Mengistu Neway ont été retrouvés dans une ville voisine de Mojo. Alors que Germame Neway s'est suicidé avant sa capture, Mengistu a été capturé vivant et pendu peu après."
 eth60.7.d:0 "Le Premier ministre Abebe Aregai, bien que capable de tromper facilement les grandes divisions italiennes dans la guerre de notre nation il y a dix ans, n'a pas réussi à régler sa situation face aux putschistes et a été totalement maîtrisé dans son rôle d'otage. Le gouvernement civil n'a aucun espoir d'arrêter ce coup d'État et ce sera aux forces armées de sauver la monarchie."
 eth60.8.d:0 "Alors que les divisions de l'armée de l'air et des chars du pays ont déclaré leur loyauté au coup d'État, la monarchie nationale a été de facto usurpée. Bien qu'on ne sache pas exactement quel changement d'administration les putschistes tenteront dans un premier temps, il est clair que le pays de l'Éthiopie sera radicalement modifié au cours de la prochaine décennie, pour le meilleur ou pour le pire. Tandis que la jeunesse étudiante et l'intelligentsia sont ravies et organisent des célébrations de masse dans les principales villes d'Éthiopie, la noblesse rurale apprend peu à peu la nouvelle du coup d'État et se prépare au pire. Comme les paysans ruraux analphabètes n'ont pas accès à l'information en dehors du domaine sur lequel ils travaillent, leurs propriétaires ont peur de leur avenir et vont commencer à faire tout ce qu'ils peuvent pour conserver leurs propriétés féodales."
 eth60.9.d:0 "Les envoyés d'Adis Abeba ont évoqué à plusieurs reprises des propos intimidants de la part des administrateurs du pays. Le parlement local de l'Érythrée, créé par la résolution de l'ONU qui en fait une possession sous la couronne éthiopienne, a été continuellement mis à l'écart, les administrateurs de la région commençant à penser que leurs positions n'auraient bientôt plus d'importance."
 eth60.10.d:0 "Malgré la montée des troubles avec la montée du nationalisme érythréen, l'empereur a annoncé l'annexion totale de l'Érythrée ; déclarant la province d'Asmara. Il reste à voir comment la nation érythréenne réagira à cette prolongation."
 eth60.11.d:0 "Le personnel militaire éthiopien a récemment reçu un rapport selon lequel le nationaliste érythréen et combattant de la milice Hamad Idris Awate est décédé à la suite d'un combat. Alors que certains considèrent la perte de la figure la plus importante du FLE comme un coup porté à leur moral, d'autres y voient uniquement une raison de motiver davantage les rebelles érythréens"
 eth60.12.d:0 "Nous venons de recevoir une demande de la nouvelle administration éthiopienne déclarant que notre sultan doit immédiatement renoncer à ses possessions avant que son royaume ne soit complètement éradiqué. Comment réagirons-nous ?"
 eth60.13.d:0 "Le chef des forces armées, Mulugeti Bulli, a organisé aujourd'hui un coup d'État soutenu par l'armée dans la capitale. Célèbre en tant que général de guerre italo-éthiopien qui a dirigé les expéditionnaires éthiopiens pendant la guerre de Corée, il occupe une place importante dans la nouvelle administration depuis le coup d'État de 1960. Inspiré par les officiers libres égyptiens qui ont mis fin à la dynastie centenaire de Muhammad Ali, Mulugeti Bulli se considère comme un général fort qui dirige un gouvernement nationaliste de semi-gauche en Éthiopie qui militarisera l'État pour se protéger des agressions étrangères."
 eth60.14.d:0 "Le jeune prince Asfaw Wossen a été baptisé aujourd'hui par l'Église éthiopienne empereur Amha Selassie. Prétendre être un monarque progressiste qui s'attaquera et changera radicalement les problèmes qui affligent la paysannerie appauvrie de la nation."
 ethparty.1.d:0 "Sous la direction de Haile Fida, un nouveau parti de gauche important a été formé en Éthiopie, basé sur le socialisme agraire. Inspiré par le maoïsme et d'autres idéologies africaines, le parti souhaite changer radicalement l'Éthiopie en s'appuyant sur une réforme agraire de ses vastes domaines avec des serfs vivant encore aujourd'hui dans une situation de quasi-esclavage."
 ethparty.2.d:0 "Aujourd'hui, c'est la fondation du Parti révolutionnaire du peuple éthiopien, qui attire une grande diversité de jeunes étudiants dans les universités centrales. Basé sur des éléments plus marginaux du socialisme révolutionnaire et du communisme, le parti se construit un public décent qui aura certainement un impact sur la politique future de l'Éthiopie."
 eth60.16.d:0 "Pour la première fois depuis des milliers d'années d'histoire éthiopienne, nous assistons à la première élection générale. Les deux principaux partis qui ont pris de l'importance sont le MEISON et la coalition nouvellement créée de divers groupes démocratiques sous la direction du fondateur de la nouvelle république, Germame Neway. La question se pose : qui remportera cette élection controversée ?"
 eth60.18.d:0 "Cette semaine, la noblesse de Gojjam a levé des levées qui ont brièvement combattu la monarchie à Hailé Sélassié pour tenter de régner sur leur oppression envers leurs serfs. Bien qu'il ne s'agisse pas d'une rébellion à grande échelle, d'importantes infrastructures de la région ont été endommagées."
 eth60.19.d:0 "Face aux personnalités panafricanistes montantes en Afrique comme Nkrumah, Nyrerer et Kenyatta, Hailé Sélassié tente davantage de développer son image et sa diplomatie à l'étranger. La façon dont il réagira aux futurs événements mondiaux attirera certainement l'attention des analystes étrangers"
 eth60.20.d:0 "Aujourd'hui a marqué la formation de l'OUA, l'Organisation de l'unité africaine à Addis-Abeba, en Éthiopie, avec ses 32 gouvernements signataires. L'objectif principal de la formation a été annoncé : rassembler les nations africaines et parvenir à l'éradication totale du colonialisme et du néocolonialisme sur le continent. Lors de la première conférence qui a eu lieu le 1er mai, le principal nationaliste gambien Alieu Ebrima Cham Joof a prononcé un discours fortement anti-colonisation en s'exprimant : \"Je vous adjure donc d'ignorer toute suggestion en dehors de l'Afrique et de considérer que la civilisation actuelle, dont se vantent certaines des grandes puissances, est née d'Afrique et de réaliser que le monde entier a quelque chose de terrestre à apprendre de l'Afrique.\" Le monde attend désormais de voir ce que cette nouvelle union peut apporter au continent."
