Space_News_National_Jupiter_Probe_Desc:0 "[Space_TAG_Subject.GetNameDefCap] a accompli avec succès sa première mission vers Jupiter, en envoyant un vaisseau spatial sur une vaste distance jusqu'au système solaire externe. Les responsables ont confirmé que la sonde avait survécu à son long voyage, maintenu les communications avec les stations au sol et renvoyé les données de sa rencontre avec la planète géante. Bien qu'un autre pays ait déjà franchi cette étape, la mission représente une avancée majeure pour la science et l'ingénierie [Space_TAG_Subject.GetAdjective]. Une mission Jupiter nécessite une navigation précise, une électronique durable, des communications à longue portée, une gestion minutieuse de l'énergie et une protection contre les rayonnements intenses. Les scientifiques s'attendent à ce que ces observations améliorent la compréhension de l'atmosphère, du champ magnétique, des ceintures de radiations et des lunes de Jupiter. Les journaux ont salué cette réussite comme la preuve que [Space_TAG_Subject.GetNameDef] peut désormais opérer bien au-delà des planètes intérieures et participer sérieusement à l'exploration du système solaire externe."

Space_News_Global_Pluto_Probe_Desc_USA:0 "Les États-Unis ont accompli avec succès la première mission au monde vers Pluton, en envoyant un vaisseau spatial à travers les confins du système solaire et en renvoyant des données de l'un de ses mondes connus les plus éloignés. Les responsables ont confirmé que la sonde avait survécu à son long voyage, maintenu les communications avec les stations au sol et transmis les observations de sa rencontre. La mission représente une avancée extraordinaire au-delà de Jupiter, prouvant que les vaisseaux spatiaux américains peuvent opérer sur des distances mesurées en milliards de kilomètres. Les scientifiques s'attendent à ce que ces données améliorent la compréhension de la surface, de l'atmosphère, des lunes et des conditions à la périphérie du système planétaire de Pluton. Les journaux ont salué cet exploit comme un triomphe de l'ingénierie, de l'électronique, de la navigation et de l'endurance américains. Les gouvernements étrangers devraient étudier la mission de près, reconnaissant qu'atteindre Pluton confère un prestige scientifique inégalé et démontre la maîtrise des opérations spatiales à longue portée les plus exigeantes."

Space_News_Global_Pluto_Probe_Desc_SOV:0 "L'Union soviétique a accompli avec succès la première mission au monde vers Pluton, envoyant un vaisseau spatial parcourir l'immense distance jusqu'aux limites extérieures du système solaire. La radio d'État et les journaux officiels ont annoncé que la sonde avait survécu à son voyage de plusieurs années, qu'elle était restée en contact avec les stations de suivi soviétiques et qu'elle avait renvoyé les observations de sa rencontre avec le monde lointain. Les responsables soviétiques, les bureaux d'études d'État et l'Académie des sciences ont salué cette mission comme un triomphe de la science socialiste, de l'ingénierie de précision et d'une planification industrielle disciplinée. Atteindre Pluton nécessite des systèmes fiables capables de fonctionner pendant des années, des communications sur des milliards de kilomètres et une navigation dans les régions les plus reculées encore explorées par la technologie humaine. Les scientifiques s'attendent à ce que la mission fournisse des informations précieuses sur la surface, l'atmosphère, les lunes et l'environnement de Pluton. Les gouvernements étrangers ont répondu avec admiration et inquiétude, reconnaissant que Moscou avait poussé l'exploration spatiale aux confins du système planétaire connu."

Space_News_Global_Pluto_Probe_Desc_PRC:0 "La République populaire de Chine a accompli avec succès la première mission au monde vers Pluton, en envoyant un vaisseau spatial à travers le système solaire externe et en renvoyant des données du monde lointain. Les responsables de Pékin ont confirmé que la sonde avait survécu à son long voyage, maintenu les communications avec les stations au sol et transmis les observations de sa rencontre. Cet exploit a surpris les analystes étrangers, dont beaucoup ne s'attendaient pas à ce que la Chine mène l'étape la plus lointaine de l'exploration planétaire. Le Quotidien du Peuple et d'autres journaux gouvernementaux ont décrit la mission comme une preuve de l'autonomie nationale, de la modernisation scientifique et de la force croissante de l'industrie chinoise. Une mission Pluton nécessite une électronique durable, des communications à longue portée, une navigation précise et des années de contrôle de mission soutenu. [Space_TAG_Subject.GetLeader]Le gouvernement de Pékin a mis l'accent sur l'exploration scientifique pacifique, mais les gouvernements rivaux étudient déjà les implications plus larges de la capacité de la Chine à exploiter des engins spatiaux aux confins du système solaire."

Space_News_Global_Pluto_Probe_Desc_FRA:0 "La France a accompli avec succès la première mission au monde vers Pluton, en envoyant un vaisseau spatial à travers le système solaire externe et en renvoyant des observations depuis l'un de ses mondes connus les plus éloignés. Les responsables ont confirmé que la sonde avait survécu à son long voyage, maintenu la communication avec les stations au sol et transmis les données de sa rencontre. La mission a été accueillie à Paris par le gouvernement de [Space_TAG_Subject.GetLeader]comme un triomphe remarquable de l'ingénierie française, de l'indépendance scientifique et de l'ambition nationale. Les scientifiques s'attendent à ce que ces observations améliorent la compréhension de la surface, de l'atmosphère, des lunes et des conditions qui existent bien au-delà des planètes intérieures de Pluton. Ce succès a surpris de nombreux observateurs étrangers, qui s'attendaient à ce que les plus grandes puissances dominent les missions les plus lointaines. Le gouvernement de [Space_TAG_Subject.GetLeader]a mis l'accent sur l'exploration pacifique et la découverte scientifique, mais le prestige d'atteindre Pluton en premier est immense. La France a porté son programme spatial aux confins du système solaire."

