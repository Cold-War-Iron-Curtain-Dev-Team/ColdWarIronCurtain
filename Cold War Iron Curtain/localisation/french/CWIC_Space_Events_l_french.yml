Space_News_Global_Outer_Solar_System_Probe_Desc_USA:0 "Les États-Unis ont réalisé avec succès la première mission mondiale de sonde du système solaire externe, en envoyant un vaisseau spatial dans des régions lointaines au-delà des planètes intérieures et en renvoyant des données provenant des confins du domaine solaire. Les responsables ont confirmé que la sonde avait survécu à son long voyage, maintenu les communications avec les stations au sol et transmis des observations provenant de régions jamais étudiées directement auparavant. La mission représente une avancée extraordinaire en matière d'endurance, de navigation, de gestion de l'énergie et de communications à longue portée. Les scientifiques s'attendent à ce que ces données améliorent la compréhension des environnements planétaires lointains, du rayonnement solaire, des champs magnétiques, de la poussière interplanétaire et des conditions aux limites du système solaire externe. Les journaux ont salué cette réussite comme un triomphe de l'ambition américaine en matière d'ingénierie et scientifique. Les gouvernements étrangers sont censés étudier la mission de près, reconnaissant que les opérations soutenues à de telles distances revêtent un prestige et une importance stratégique inégalés."

Space_News_Global_Outer_Solar_System_Probe_Desc_SOV:0 "L'Union soviétique a réalisé avec succès la première mission mondiale de sonde du système solaire externe, en envoyant un vaisseau spatial dans des régions isolées bien au-delà des planètes intérieures. La radio d'État et les journaux officiels ont annoncé que la sonde avait survécu à son long voyage, était restée en contact avec les stations de suivi soviétiques et avait renvoyé des observations depuis les confins lointains du système solaire. Les responsables soviétiques, les bureaux d'études d'État et l'Académie des sciences ont salué cette mission comme un triomphe de la science socialiste, de l'ingénierie de précision et d'une planification industrielle disciplinée. Opérer dans le système solaire externe nécessite des années d'endurance, des systèmes électriques fiables, une électronique durable et des communications sur des distances presque inimaginables. Les scientifiques s'attendent à ce que la mission fournisse des informations précieuses sur les rayonnements, les champs magnétiques, la poussière interplanétaire, les environnements planétaires lointains et les limites extérieures de l'influence solaire. Les gouvernements étrangers ont répondu avec admiration et inquiétude, reconnaissant que Moscou avait poussé l'exploration spatiale jusqu'à ses frontières les plus reculées."

