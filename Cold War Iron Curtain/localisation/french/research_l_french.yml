 #Consumer Electronics
 consumer_electronics_I:0 "Electronique grand public de base"
 consumer_electronics_II:0 "Télévision couleur"
 consumer_electronics_III:0 "Ordinateurs personnels"
 consumer_electronics_IV:0 "Electronique grand public moderne"
 consumer_electronics_V:0 "Electronique grand public avancée"
 consumer_electronics_VI:0 "Téléphones intelligents"
 consumer_electronics_VII:0 "L'ère de l'information CE"
 consumer_electronics_VIII:0 "Electronique grand public ergonomique"
 consumer_electronics_X:0 "Robots de la famille XX Corp"
 consumer_electronics_I_desc:0 "L'électronique grand public de base représente le déploiement à grande échelle des premiers systèmes électroniques auprès des consommateurs commerciaux et personnels. Ces appareils électroniques de base assurent non seulement une meilleure qualité de vie, mais ouvrent également la voie à une société dans son ensemble plus productive. Les premières applications commerciales incluent des téléviseurs de qualité améliorée, des appareils commerciaux pour calculer les finances et d'innombrables systèmes électroniques de base qui contribuent à la productivité commerciale et à la qualité de vie personnelle."
 #consumer_electronics_II_desc:0 "Cellular Phones are mobile devices used to communicate wirelessly. They can communicate over long distances and be used to make international phone calls via satellite far beyond the range of regular landlines. Cellular phones greatly aid in interoperability nationally and abroad and bolster commercial incomes. Additionally, personally available consumer cellular phones improve the QoL."
 consumer_electronics_III_desc:0 "Les ordinateurs personnels comptent parmi les avancées les plus importantes de l'histoire. Les ordinateurs personnels sont incroyablement utiles à toutes fins. Le développement d'ordinateurs personnels grand public à des fins commerciales et personnelles constitue une aubaine considérable pour la société. Sur le plan commercial, les ordinateurs personnels révolutionnent la logistique commerciale, la productivité des bureaux et des services financiers, la planification commerciale, la communication et la conclusion de transactions, et bien d'autres encore. De plus, les ordinateurs personnels ont révolutionné l'éducation et la médecine, offrant une meilleure qualité de vie."
 consumer_electronics_IV_desc:0 "L'électronique grand public moderne représente une nouvelle ère de l'électronique dans laquelle la polyvalence et les applications potentielles de l'électronique deviennent universelles. À l'heure actuelle, l'électronique grand public peut être utilisée à pratiquement toutes les fins. Cette technologie représente le développement de programmes et d'ordinateurs pouvant être utilisés à toutes fins et dans pratiquement toutes les entreprises et institutions. C'est à ce stade que les ordinateurs personnels sont utilisés partout dans la société (en supposant que votre société en ait les moyens)."
 consumer_electronics_V_desc:0 "L'électronique grand public avancée représente une ère de l'électronique où l'abordabilité de l'électronique transcende pour permettre l'utilisation d'ordinateurs dans pratiquement tous les foyers des pays industrialisés. C'est à ce niveau que l'électronique devient omniprésente en raison de son accessibilité. De plus, de nombreuses améliorations ont été apportées aux applications et systèmes existants qui permettent d'appliquer ces ordinateurs à une plus large gamme d'articles."
 consumer_electronics_VI_desc:0 "L'électronique grand public à l'ère de l'information représente une ère où l'électronique améliore continuellement son ergonomie et trouve des applications exploratoires. C'est à ce stade que les systèmes informatiques sont plus conviviaux que jamais et permettent d'améliorer la qualité de vie. Au cours de la prochaine décennie, l'électronique grand public sera exploratoire et innovante, tentant de résoudre des problèmes dont les gens ignoraient l'existence et de répondre à des désirs dont ils ignoraient qu'ils voulaient. Des smartphones aux services de streaming, l'électronique grand public des années 2000 à 2010 marquera le véritable début de l'ère de l'information."
 consumer_electronics_X_desc:0 "XX Inc., le fabricant de Little Helper, est célèbre pour ses produits robotiques. Fabriqué avec un blanc immaculé, des lignes épurées et des pieds courts mais efficaces, Little Helper est né pour aider les gens ! Il existe diverses fonctions intégrées dans Little Helper. Des alarmes antivol au système de surveillance de la maison, en passant par la préparation du café et le contrôle des lumières, il a tout ce dont une maison a besoin ! Si Little Helper devait avoir la capacité d'émotion, il pourrait se sentir très fier d'aider les gens."
 consumer_electronics_stfu_tt:0 "§G+15%§! §YParc de bureaux§! Revenu"

 #Coms
 coms_I:0 "Lignes fixes modernes"
 coms_II:0 "Communication par satellite"
 coms_III:0 "Connexion commutée"
 coms_IV:0 "2G"
 coms_V:0 "3G"
 coms_VI:0 "4G LTE"
 coms_VII:0 "LTE avancé"
 coms_VIII:0 "5G"
 coms_I_desc:0 "Les téléphones ont subi des améliorations massives depuis leur création par Alexander Graham Bell dans les années 1870. En 1878, le premier central téléphonique commercial américain a ouvert ses portes aux États-Unis. En 1915, le premier appel téléphonique longue distance d'un océan à l'autre a été effectué. Dans les années 1930 et 1940, l'usage du téléphone était devenu monnaie courante dans le monde développé et était largement et fréquemment utilisé. Peu après la guerre, les téléphones avaient atteint un niveau tel que pratiquement n'importe qui pouvait appeler n'importe qui d'autre et le téléphone était très largement disponible. Au début des années 50, les téléphones étaient plus fiables et pouvaient communiquer plus rapidement que jamais."
 coms_II_desc:0 "Au début des années 60, le premier programme spatial privé a débuté. Ce programme, parrainé par AT&T, Bell Telephone Labs et la société nationale française PTT, visait à créer le premier réseau de communication par satellite. Le 22 novembre 1963, le relais 1 de la NASA a transmis le premier signal transpacifique. Il faudra des années avant de construire suffisamment de satellites et de relais avant de pouvoir en faire une utilisation commerciale généralisée. Cependant, l'armée, les agences de renseignement et les dirigeants d'entreprises seraient les premiers à adopter cette nouvelle technologie. Des investissements continus et une augmentation rapide du nombre d'adoptants ont permis au projet de communications par satellite de se poursuivre et d'atteindre de plus en plus de personnes."
 coms_III_desc:0 "L'accès à distance est une méthode d'accès à Internet et de transmission de données qui utilise les réseaux téléphoniques publics commutés pour établir une connexion en composant le numéro de téléphone d'un fournisseur d'accès Internet sur la ligne. Les données sont ensuite communiquées au fournisseur d'accès Internet via la ligne téléphonique. Le modem code et décode les informations vers et depuis les signaux audio afin de transmettre des données. Les connexions commutées sont très efficaces car elles n'ont besoin que d'une infrastructure de réseau téléphonique pour communiquer des informations. L'accès commuté est capable de transmettre environ 50 kb/s."
 coms_IV_desc:0 "La communication 2G est la 2ème génération de technologie cellulaire. Les réseaux 2G sont bien plus capables d'un cryptage complexe et sont capables de transmettre davantage de données. La 2G a permis aux communications sans fil de devenir nettement plus efficaces que l'accès commuté, atteignant des vitesses d'environ 250 kb/s. Afin d'atteindre ces vitesses, la 2G nécessite un équipement sans fil plus puissant, des protocoles sans fil très efficaces et, avec la mise en oeuvre ultérieure de 2G EDGE, vient le codage 8PSK et la normalisation des domaines à commutation de circuits. "
 coms_V_desc:0 "La communication 3G est la 3ème génération de technologie cellulaire. Les réseaux 3G ont une capacité de pénétration beaucoup plus forte que la 2G et peuvent donc atteindre des longueurs plus grandes. Les réseaux 3G peuvent atteindre des vitesses d'environ 3 Mo/s. Semblable à la création de la 2G, la 3G nécessite des équipements de communication plus puissants."
 coms_VI_desc:0 "La communication 4G est la 4ème génération de technologie cellulaire et une avancée majeure dans les communications qui permet des services de streaming, un accès Internet haut débit et des réseaux intelligents. Les réseaux 4G peuvent atteindre des vitesses de ~12,5 à 125 mb/s, ce qui représente un chiffre d'affaires important pour les réseaux à haute capacité et à haut débit. L'évolution à long terme (LTE) est une norme technique pour les communications haut débit sans fil qui augmente la vitesse des communications."
 coms_VII_desc:0 ""
 coms_VIII_desc:0 ""

 ##CWIC INDUSTRY
 ww_production:0 "Production de la Seconde Guerre mondiale"
 ww_production_desc:0 "Pendant la Seconde Guerre mondiale, la capacité industrielle et la productivité ont été mises à rude épreuve pour améliorer la production pendant la guerre. Des progrès majeurs ont été réalisés dans les réseaux logistiques et les organisations industrielles. De nombreux réseaux logistiques ont été organisés et les liaisons de transport ont été formalisées. De nombreux pays qui ont directement participé à la Seconde Guerre mondiale ont formalisé les liaisons de transport et se sont donné pour priorité de prévenir les goulots d'étranglement dans les transports."
 ww_oil:0 "Science des matériaux de la Seconde Guerre mondiale"
 ww_oil_desc:0 "Au cours de la Seconde Guerre mondiale, diverses améliorations ont été apportées à la métallurgie et le développement de meilleurs alliages dans le cadre de l'innovation militaire. Les alliages d'aluminium créés pendant la Seconde Guerre mondiale ont permis aux avions de conserver leur légèreté et d'améliorer leur durabilité au combat. Le rapport acier/carbone a également été optimisé pendant la Seconde Guerre mondiale, permettant l'utilisation de meilleurs matériaux. En outre, de nombreux pays ont adopté des tableaux et des données standardisés pour les matériaux et certains pays ont même été incités à formaliser la recherche sur les projets liés aux matériaux."
 ww_construction:0 "Construction de la Seconde Guerre mondiale"
 ww_construction_desc:0 "Les pressions de la Seconde Guerre mondiale ont conduit au développement d'une variété de pratiques de gestion de la construction qui ont conduit à un niveau accru d'efficacité sur site. L'amélioration la plus notable des pratiques de construction sur site a été la standardisation généralisée de nombreuses pratiques de construction différentes et le partage généralisé des techniques et des machines de construction."

 #Chemistry
 chemistry_I:0 "Spectroscopie chimique"
 chemistry_I_desc:0 "La spectroscopie est une méthode d'analyse chimique qui utilise l'imagerie infrarouge, électromagnétique, la spectroscopie à rayons X ou la décomposition de masse afin de déterminer la composition moléculaire d'un composé spécifique et ses détails. En utilisant ces méthodes en laboratoire, un échantillon peut être analysé pour garantir la qualité d'un processus chimique industriel ou pour déterminer la composition chimique d'un produit chimique non identifié."
 chemistry_II:0 "Technique de transformée de Fourier"
 chemistry_II_desc:0 "La technique de transformée de Fourier est une méthode de mesure par laquelle la spectroscopie est réalisée. Grâce à des mesures dans le domaine temporel ou spatial, toutes les formes de spectroscopie sont améliorées et rendues plus précises grâce à cette méthode.\nLa technique de transformée de Fourier transforme les données brutes d'une mesure spectroscopique en un spectre réel qui peut être analysé plus facilement."
 chemistry_III:0 "Synthèse stéréosélective"
 chemistry_III_desc:0 "La stéréochimie est une section de la chimie organique qui traite des stéréoconfigurations dans une molécule. Les stéréoconfigurations sont les manières spécifiques dont sont disposées des sections complètement différentes dans une articulation d'une molécule. Différentes configurations de la même molécule ont la même structure moléculaire et les mêmes composants, mais des formes complètement différentes en raison des différents ordres dans lesquels les jointures complexes sont placées."
 chemistry_IV:0 "Fullerènes et nanomatériaux théoriques"
 chemistry_IV_desc:0 "Le fullerène est une macromolécule composée d'atomes de carbone formant une cage creuse. Les fullerènes sont utilisés comme systèmes d'administration de médicaments dans le corps, comme lubrifiants ou comme catalyseurs.\nLes nanomatériaux sont des matériaux très avancés qui devraient théoriquement être fabriqués à l'aide de la nanotechnologie. Sans accès aux nanotechnologies, ces matériaux devraient être fabriqués à un coût extrêmement élevé, mais auraient encore de rares applications dans les superordinateurs, la science ou les produits de haute technologie extrêmement avancés."
 chemistry_V:0 "Nanotubes de carbone"
 chemistry_V_desc:0 "Les nanotubes de carbone tels que le graphène sont des tubules d'atomes de carbone qui forment des macromolécules similaires aux fullerènes mais sous forme de tubes au lieu de cages creuses sphériques. Le graphène fait partie des matériaux les plus résistants connus de l'homme, mais il est également très difficile à produire en masse. Ils sont utilisés en petites quantités dans des ordinateurs très avancés, dans la technologie militaire et dans des processus industriels de pointe pour pourvoir des emplois qui ne peuvent être occupés par aucun autre matériau."
 chemistry_VI:0 "Écrans à cristaux liquides (LCD)"
 chemistry_VI_desc:0 ""
 chemistry_VII:0 "Chimie verte"
 chemistry_VII_desc:0 ""
 industry_chemistry_tt:0 "§G+15%§! §YUsine d'hydrométallurgie§! revenus\n"

 #Plastics
 plastics_I:0 "Polypropylène"
 plastics_I_desc:0 "Le polypropylène est un thermoplastique partiellement cristallin utilisé dans les pièces de machines, les emballages et les biens de consommation générale. Il s'agit d'un hydrocarbure pur qui ne contient aucun autre matériau et qui est construit par polymérisation par croissance en chaîne. Le polypropylène a également un point de fusion plus élevé que les plastiques précédents, ce qui en fait un matériau synthétique beaucoup plus utilisable que les générations précédentes."
 plastics_II:0 "Kevlar"
 plastics_II_desc:0 "Le Kevlar est une fibre synthétique résistante à la chaleur, connue pour être très solide et utilisée dans les gilets pare-balles et pare-balles. Il présente une résistance à la traction extrêmement élevée et un faible poids, avec un rapport résistance/poids 5 fois supérieur à celui de l'acier. Il peut également être utilisé dans le domaine naval ou dans des applications grand public. Le Kevlar est synthétisé à partir de quelques monomères intermédiaires différents dans une réaction de condensation et produit de l'acide chlorhydrique comme sous-produit."
 plastics_III:0 "Polyaryléthercétone"
 plastics_III_desc:0 "Le polyaryléthercétone (PEEK) est un thermoplastique organique utilisé en ingénierie. Il est très robuste et est utilisé dans la fabrication de pistons, de pompes, de roulements, de plaques de compresseur, d'isolation électrique et d'implants médicaux. Le matériau est construit par polymérisation par croissance progressive à l'aide d'un catalyseur et de 4-4-difluorobenzophénone et d'hydroquinone. Elle doit être réalisée à environ 300 degrés Celsius."
 industry_plastics_III_tt:0 "Parc industriel §G-10% £resources_strip|5 Parc de bureaux §G-10% £resources_strip|2 Consommation§!"
 plastics_IV:0 "Semi-conducteurs en plastique"
 plastics_IV_desc:0 "Les semi-conducteurs ont toujours été constitués de matériaux fragiles à base de silicium. Cependant, les semi-conducteurs polymères peuvent constituer des bases beaucoup plus solides et plus flexibles pour l'électronique et sont également beaucoup moins chers et légers. Ils sont constitués de polymères complexes délicatement assemblés, disposés de manière à permettre l'apparition de propriétés électriques au lieu d'un seul polymère non électrique. Ces conducteurs sont également plus efficaces et réduisent ainsi la consommation électrique globale des appareils qui les utilisent."
 plastics_V:0 "Éthylène tétrafluoroéthylène (ETFE)"
 plastics_V_desc:0 ""
 plastics_VI:0 "Polymères organiques (bioplastiques)"
 plastics_VI_desc:0 ""
 plastics_VII:0 "Polymères renforcés de fibres de carbone"
 plastics_VII_desc:0 ""
 industry_plastics_VI_tt:0 "Parc Industriel §G-10% £resources_strip|1 Consommation§!"
 industry_plastics_tt:0 "§G+15%§! §YRaffinerie pétrochimique§! revenus\n"

 #Materials
 materials_I:0 "Alliages de titane"
 materials_I_desc:0 "Les alliages de titane sont des mélanges métallurgiques de titane et d'autres matériaux. Ils ont une résistance élevée à la traction et une résistance extrême à la corrosion et aux intempéries. Le titane en lui-même, bien que solide, est un métal fragile. Avec l'ajout d'autres métaux, comme le vanadium ou l'aluminium, il peut conserver une grande partie de sa résistance mais aussi gagner en ductilité. Bien qu'il ne soit pas réalisable pour la construction ou les structures de support, il est utilisé dans les avions, les engins spatiaux, les appareils médicaux, les véhicules et l'électronique grand public."
 materials_II:0 "Verre flotté"
 materials_II_desc:0 "Le verre flotté est une forme de verre créée en faisant flotter du verre fondu sur des métaux en fusion tels que l'étain. Cela lui donne une épaisseur uniforme. L'uniformité le rend meilleur pour les utilisations commerciales et industrielles en optique et dans la plupart des formes de construction. Pratiquement tout le verre utilisé à l'ère moderne est du verre flotté car il est peu coûteux à fabriquer car il s'agit simplement de verre sodocalcique formé sur de petites quantités de métaux fondus et bon marché avec de faibles points de fusion tels que l'étain. De plus, le verre flotté peut être traité davantage pour créer du verre renforcé ou dépoli."
 materials_III:0 "Composites à matrice céramique"
 industry_materials_III_tt:0 "§Y Quartier Fonderie §! §G-10% £resources_strip|7 Consommation§!"
 materials_III_desc:0 ""
 materials_IV:0 "Composites à matrice métallique"
 industry_materials_IV_tt:0 "§Y Quartier Fonderie §! §G-10% £resources_strip|1 Consommation§!"
 materials_IV_desc:0 "Les composites à matrice métallique sont des matériaux composites à 2 composants ou plus. Parfois, les composites à matrice métallique sont formés avec d'autres matériaux en conjonction avec du métal. Les MMC sont généralement utilisés dans les outils de coupe en carbure de tungstène haute performance, les blindages, les freins à disque, les pièces de véhicules, les équipements scientifiques et de laboratoire, et peuvent être combinés avec du graphène pour créer des modules électroniques de puissance très haut de gamme pour des équipements électroniques coûteux. "
 materials_V:0 "Nanocomposites"
 materials_V_desc:0 "Les nanocomposites sont des matériaux qui utilisent des nanoparticules en conjonction avec d'autres composites matriciels. Ces ajouts entraînent des améliorations incroyables de la résistance mécanique et de la conductivité, permettant aux matrices d'obtenir des résultats encore meilleurs avec ce dans quoi elles sont utilisées. Cela permet aux équipements électroniques, industriels et commerciaux et aux systèmes militaires d'atteindre des niveaux de performance plus élevés avec les meilleures matrices."
 materials_VI:0 "Mousse métallique"
 materials_VI_desc:0 ""
 materials_VII:0 "Métaux raffinés électriquement"
 materials_VII_desc:0 ""
 materials_VIII:0 "Sélection automatisée de la composition des matériaux"
 materials_VIII_desc:0 ""

