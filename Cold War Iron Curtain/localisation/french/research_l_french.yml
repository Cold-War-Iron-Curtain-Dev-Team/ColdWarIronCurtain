 ww_infra:0 "Infrastructures de la Seconde Guerre mondiale"
 ww_infra_desc:0 "Conceptions et formats d'infrastructure fondamentaux de l'entre-deux-guerres et de la Seconde Guerre mondiale. Comprend une large gamme de systèmes ferroviaires et routiers pour comprendre les systèmes logistiques de base et les principes fondamentaux des infrastructures hydrauliques urbaines."
