 #MP
 tech_military_police:0 "Police militaire I : Corps de police militaire"
 tech_military_police_desc:0 "La police militaire est un corps d'officiers dévoués qui maintiennent l'ordre au sein d'une division et assurent la sécurité dans une zone de combat. La guerre est, par nature, destructrice. Les représentants du gouvernement, la police et les agents de sécurité sont des cibles naturelles et des belligérants dans un conflit ; la police militaire doit donc maintenir l'ordre et réprimer l'insurrection. La police militaire de base n'est pas plus avancée ni différente des forces de police normales, à l'exception d'un entraînement au combat plus poussé et de la capacité d'établir des patrouilles dans une zone inconnue."
 tech_military_police2:0 "Police militaire II : opérations anti-insurrectionnelles"
 tech_military_police2_desc:0 "Les insurgés et les partisans peuvent être extrêmement dangereux pour une opération de guerre et poser des problèmes au niveau stratégique. Du sabotage aux embuscades en passant par la fourniture d'informations à l'ennemi, n'importe qui peut devenir un insurgé. Pouvoir traquer les insurgés et les partisans et réprimer la rébellion dans une zone de guerre est une opération cruciale. Les armes à feu et les armes doivent être confisquées, les cellules des milices doivent être trouvées et détruites et les agents eux-mêmes doivent être éliminés. Il faut donc fabriquer des équipements spéciaux et des variantes militarisées des équipements de police et planifier des protocoles de répression."
 tech_military_police3:0 "Police militaire III : Lutte anti-émeute"
 tech_military_police3_desc:0 "Outre les cellules des milices, des émeutes désorganisées peuvent également surgir de populations rebelles qui ne comprennent pas la guérilla ou la théorie de la résistance. Bien qu'elles ne soient pas aussi dangereuses qu'une cellule de milice pleinement organisée, les émeutes peuvent provoquer de graves troubles, empêcher l'accès aux ressources et à l'industrie et rallier le soutien des partisans. Il faut donc contrôler et réprimer les émeutes. Cependant, le recours à la force létale, bien que facile et efficace, ne fait que radicaliser les populations locales et remplir l'objectif initial de l'émeute. Ainsi, développer des techniques anti-émeutes de qualité militaire afin de maintenir l'ordre et réprimer les manifestations revêt une importance vitale."
 support_tech_military_police3_tt:0 "§YRéduit la probabilité d'une émeute réussie dans le territoire occupé de§! §G-35 %§!"
 tech_military_police4:0 "Police militaire IV : Corps de secours de guerre"
 tech_military_police4_desc:0 "Il ne suffit pas de réprimer la résistance et de pacifier les populations. Une résistance pacifique est toujours possible et peut s'avérer problématique. De plus, les ravages provoqués par la guerre peuvent conduire les partisans à former des cellules. Il est prudent de fournir des secours de guerre pour de nombreuses raisons. L'aide de guerre aide une région à se rétablir plus rapidement pendant et après une guerre. L'aide de guerre contribue à maintenir la richesse et le développement qui autrement seraient perdus. Les secours de guerre accélèrent le relèvement. Enfin, fournir des secours de guerre peut permettre de gagner la guerre la plus importante de toutes. La guerre des coeurs et des esprits. "
 tech_military_police5:0 "Police militaire V : maintien de la paix"
 tech_military_police5_desc:0 "Le maintien de la paix est une mesure proactive visant à prévenir les soulèvements et à réduire les ravages. Les opérations de maintien de la paix impliquent généralement la formation de nouvelles forces de sécurité locales pour faire respecter la loi et rétablir la normale. L'ordre et la stabilité sont les meilleures méthodes de pacification. Le maintien de la paix exige que la police militaire soit formée pour établir la sécurité locale et sélectionne les individus qui ne finiront pas par poser de problèmes pour devenir ces agents de sécurité. De plus, cela nécessite des lignes logistiques pour que les dispositions de sécurité soient établies afin que les zones de sécurité puissent être établies."
 tech_military_police6:0 "Police militaire VI : Suppression mémétique"
 tech_military_police6_desc:0 "Gagner les coeurs et les esprits grâce aux secours de guerre et au maintien de la paix sont de bons moyens de prévenir l'insurrection. Cependant, tout le monde n'est pas convaincu, notamment les patriotes et les démagogues. Il est donc nécessaire d'utiliser la peur comme un outil pour réprimer les autres. Cependant, cette peur ne peut pas être apaisée de telle manière qu'elle interfère avec les secours en temps de guerre ou le maintien de la paix. Les journalistes militaires, la propagande, la guerre mémétique et les débats idéologiques, ainsi que d'autres méthodes similaires, sont des moyens de semer le doute au sein d'une population occupée. "
 tech_military_police7:0 "Police militaire VII : armes et tactiques modernes non létales"
 tech_military_police7_desc:0 "Des tactiques et des armes non létales sont utilisées depuis l'aube de la civilisation humaine et font naturellement partie de l'occupation. Cependant, lutter contre la criminalité domestique est un jeu différent de celui contre les insurgés. Pour mieux contrôler la population et ne pas inspirer de résistance et assurer une répression psychologique, de nouvelles méthodes de neutralisation doivent être créées. Investir des sommes importantes dans le développement d'armes non létales, de produits chimiques, de formation et d'équipements sera payant en permettant à de plus petits effectifs de troupes d'avoir un plus grand impact répressif."

 #SIGNAL
 tech_signal_company:0 "Signal I : commandement et contrôle"
 tech_signal_company_desc:0 "Les sociétés de transmission maintiennent l'organisation et la communication au sein d'une division et à l'extérieur de celle-ci. À l'aide d'équipements de communication, les compagnies de transmissions peuvent contribuer au commandement et au contrôle d'une division et lui permettre de mieux réagir aux situations qu'auparavant. Le commandement et le contrôle nécessitent des spécialistes des transmissions et du matériel de communication."
 tech_signal_company2:0 "Signal II : C3"
 tech_signal_company2_desc:0 "C3 signifie Communications, Commandement et Contrôle. Avec la mise en oeuvre du C3, les unités peuvent désormais communiquer entre elles, réagir de manière dynamique aux mouvements et percées ennemis et réagir en conséquence. C3 exige que des spécialistes de la signalisation soient intégrés au sein d'une division dans de nombreux domaines différents pour relayer l'information et assurer une plus grande sensibilisation."
 tech_signal_company3:0 "Signal III : Interopérabilité"
 tech_signal_company3_desc:0 "L'interopérabilité est l'avancée du C3. L'interopérabilité est l'avancement des doctrines en matière de communication et d'efforts directs entre les éléments de combat. De cette façon, les éléments de combat sont capables de communiquer entre eux sans avoir besoin d'une liaison de signalisation et peuvent s'entraider de leur propre initiative. "
 tech_signal_company4:0 "Signal IV : ISTAR"
 tech_signal_company4_desc:0 "ISTAR signifie Intelligence, Surveillance, Acquisition de cibles et Reconnaissance. Il s'agit de la communication active entre les éléments de reconnaissance et tous les utilisateurs du réseau de communication. ISTAR permet aux éléments de reconnaissance de communiquer des informations au reste d'une division avec une grande efficacité. Il permet également aux éléments de reconnaissance d'aider à fournir des informations aux éléments de combat qui en ont besoin."
 tech_signal_company5:0 "Signal V : MISI"
 tech_signal_company5_desc:0 "L'intégration des systèmes d'information modernes (MISI) est l'intégration d'informations sur des systèmes modernes tels que des ordinateurs portables pour faciliter le contrôle tactique. Avec MISI, des niveaux inégalés de contrôle tactique direct peuvent être établis entre l'état-major de commandement et les éléments de combat opérationnels. MISI permet la consultation entre des cadres supérieurs expérimentés et des officiers subalternes pour fournir une plus grande capacité de combat et tactique."
 tech_signal_company6:0 "Signal VI : communications personnelles"
 tech_signal_company6_desc:0 "Les communications personnelles sont des équipements de communication accordés à presque tous les individus au sein d'une division. Cela peut en outre permettre de maintenir les communications, car la neutralisation d'un spécialiste des transmissions ne signifie pas nécessairement la fin des communications. Le développement des communications personnelles nécessite la miniaturisation des équipements de communication et des protocoles permettant de couper le fonctionnement des équipements compromis."
 tech_signal_company7:0 "Signal VII : SUZUKI"
 tech_signal_company7_desc:0 "OVERLORD est une interface de combat théorique qui n'a encore été entièrement mise en oeuvre par aucun pays en raison des dépenses considérables liées au développement du logiciel nécessaire, à sa maintenance et à sa mise à jour. OVERLORD crée une interface créée et mise à jour par l'état-major de commandement sur la base de rapports de reconnaissance continus et d'informations entrantes. Cela permet un niveau d'interopérabilité, de communication et de commandement jamais vu auparavant, qui peut permettre à pratiquement toutes les troupes de recevoir des informations sur les troupes à proximité et d'éviter les conflits qu'elles ne peuvent pas gérer tout en engageant avec précision les ennemis dont elles sont capables. Tant que quelqu'un est conscient de la présence d'un ennemi et que les communications sont toujours en ligne, tout le monde peut en être conscient. "

 #MAINTENANCE
 tech_maintenance_company:0 "Maintenance I : Mécanique de l'Armée"
 tech_maintenance_company_desc:0 "Les sociétés de maintenance sont des unités non combattantes dédiées à la maintenance et à la réparation d'armes et d'équipements militaires. Alors que la plupart des opérations de nettoyage et d'entretien de routine peuvent être effectuées par les soldats qui utilisent les armes et l'équipement, des mécaniciens dédiés peuvent effectuer le travail plus efficacement et soulager une grande partie des efforts des soldats eux-mêmes afin qu'ils puissent se concentrer sur d'autres choses. La mécanique est l'élément le plus basique mais aussi l'un des éléments les plus importants d'une entreprise de maintenance."
 tech_maintenance_company2:0 "Entretien II : Gestion"
 tech_maintenance_company2_desc:0 "La gestion de la maintenance et les contremaîtres militaires sont essentiels à l'efficacité des entreprises de maintenance. En mettant en oeuvre des stratégies et des politiques de gestion sur le terrain, ils sont en mesure d'améliorer considérablement la rapidité et l'efficacité des réparations et de l'entretien. "
 tech_maintenance_company3:0 "Maintenance III : outils et équipements améliorés"
 tech_maintenance_company3_desc:0 "La création de nouveaux outils et équipements spécialisés dans la maintenance et la réparation aidera grandement les entreprises de maintenance. Un équipement fiable ou automatisé facilitera le travail des mécaniciens."
 tech_maintenance_company4:0 "Maintenance IV : outils et équipements encore améliorés"
 tech_maintenance_company4_desc:0 "L'optimisation supplémentaire des outils pour les rendre plus fiables et plus faciles à manipuler facilite encore plus les réparations sur le terrain et l'entretien régulier."
 tech_maintenance_company5:0 "Maintenance V : pièces polyvalentes"
 tech_maintenance_company5_desc:0 "En temps de guerre, il n'est pas rare de trouver des sociétés de maintenance à court de composants ou de pièces de rechange. Les pièces endommagées ou détruites sont très incohérentes et imprévisibles en raison de la nature du combat. C'est pour cette raison qu'il est souhaitable de disposer de magasins de pièces très polyvalentes et de kits de réparation destinés à être appliqués uniquement temporairement. Grâce à des efforts de développement et à des investissements intenses, ces kits et pièces peuvent être créés pour des réparations sur le terrain afin de maintenir les véhicules et les armes dans le combat suffisamment longtemps pour qu'ils puissent recevoir des réparations permanentes."
 tech_maintenance_company6:0 "Maintenance VI : Mécaniques de combat"
 tech_maintenance_company6_desc:0 "Les situations de réparation les plus désastreuses peuvent survenir dans le feu de l'action. Les chars peuvent être détraqués, les véhicules peuvent être abattus et diverses autres formes de dommages peuvent survenir. Les réparations sur le terrain ont toujours été une tâche difficile et urgente. En formant les mécaniciens à travailler plus rapidement et sous une pression intense, ils peuvent effectuer ces réparations plus efficacement et remettre leurs véhicules dans la bataille."
 tech_maintenance_company7:0 "Maintenance VII : Manuels numériques"
 tech_maintenance_company7_desc:0 "En fournissant à nos mécaniciens de combat des appareils portables contenant des informations sur ce sur quoi ils travaillent, ils peuvent atteindre des niveaux d'efficacité jamais vus auparavant."

