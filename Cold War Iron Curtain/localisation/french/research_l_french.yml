 ##Vanilla Infantry

 marine_tech:0 "Marines"
 mountaineers_tech:0 "Alpinistes"

 night_vision:0 "Vision nocturne I"
 night_vision_desc:0 "Être capable de voir l'ennemi sans être vu est la clé des opérations de nuit. Grâce à l'invention de la technologie infrarouge, nous pouvons équiper notre armée de dispositifs qui, bien que peu maniables, rendent cela possible."
 night_vision2:0 "Vision nocturne II"
 night_vision2_desc:0 "Les premières lunettes infrarouges, bien qu'initialement destinées aux tireurs d'élite, avaient une portée de vision limitée. À mesure que la portabilité et la vision s'améliorent, ces appareils peuvent être utilisés par davantage de troupes opérant la nuit."
 electronic_mechanical_engineering:0 "Génie Mécanique Electronique"
 electronic_mechanical_engineering_desc:0 "Nous vivons à une époque où les machines électriques peuvent non seulement nous réchauffer et nous éclairer, mais nous aider à penser et à communiquer. L'électronique sera la clé du renseignement militaire au cours du siècle à venir."
 motorised_infantry:0 "Infanterie motorisée"
 motorised_infantry_desc:0 "En étendant l'utilisation de véhicules à moteur dans les transports d'infanterie sur le terrain, la mobilité d'unités d'infanterie autrement lentes peut être grandement améliorée, permettant des réponses plus rapides et de nouvelles stratégies."

 ##Vanilla Artillery

 ARTILLERY_TITLE_ROCKET:0 "ARTILLERIE DE FUSÉE"
 ARTILLERY_TITLE_AT:0 "ANTICHAR"
 ARTILLERY_TITLE:0 "ARTILLERIE"
 ARTILLERT_TITLE_AA:0 "ANTI-AÉRIEN"

 experimental_rockets:0 "Fusées expérimentales"
 experimental_rockets_desc:0 "Faire progresser la science des fusées en améliorant la portée et la fiabilité des fusées à combustible liquide nous en apprendra suffisamment sur la technologie pour permettre la construction de sites de lancement pour des modèles plus avancés."
 rocket_engines:0 "Fusée pratique"
 rocket_engines_desc:0 "La connaissance de la propulsion des fusées atteint un point où nous pouvons construire des bombes volantes et des avions propulsés par fusée, fonctionnant à des vitesses auparavant inaccessibles."
 improved_rocket_engines:0 "Moteurs de fusée améliorés"
 improved_rocket_engines_desc:0 "Les premiers missiles balistiques à longue portée peuvent être construits et rendus encore plus précis, atteignant des villes ennemies lointaines et même dans l'espace."
 advanced_rocket_engines:0 "Fusée avancée"
 advanced_rocket_engines_desc:0 "L'avenir des fusées ouvre des possibilités comme celles des missiles intercontinentaux, dont la portée connaît peu de limites alors que les charges utiles deviennent de plus en plus meurtrières."
 atomic_research:0 "Recherche atomique"
 atomic_research_desc:0 "Dans la fission nucléaire, la division de l'atome produit d'énormes quantités d'énergie et une capacité de destruction illimitée."
 rocket_interceptor:0 "Intercepteur de fusée"
 rocket_interceptor_desc:0 "Les avions intercepteurs propulsés par fusée et basés sur des planeurs peuvent, pendant de courtes périodes, se déplacer plus rapidement que n'importe quel autre avion. Même si la volatilité du carburant met les avions en danger, ils peuvent décoller et réagir aux attaques plus rapidement que ce à quoi s'attendrait n'importe quel ennemi."
 rocket_interceptor_2:0 "Intercepteur de fusée II"
 rocket_interceptor_2_desc:0 "Toujours considérés comme extrêmement dangereux à utiliser, les chasseurs propulsés par fusée sont désormais aidés par des pilotes automatiques et remorqués par d'autres avions pour maximiser l'utilisation de leur vitesse extrême mais de leur courte fenêtre de carburant."
 rocket_interceptor_3:0 "Intercepteur de fusée III"
 rocket_interceptor_3_desc:0 "De nouvelles techniques d'atterrissage et des systèmes de carburant plus sûrs ont considérablement amélioré les chances de réussite et de survie des chasseurs-fusées, réalisant ainsi le potentiel autrefois théorique de ces véhicules de pointe."
 nukes:0 "Ogive à fission I"
 nukes_desc:0 "Un projet de construction d'une bombe atomique sera l'une des tâches les plus secrètes et les plus difficiles qu'une nation puisse entreprendre, mais, en cas de succès, il pourrait changer non seulement le cours des guerres d'aujourd'hui mais aussi celui de l'avenir du monde."
 interwar_artillery:0 "Artillerie de l'entre-deux-guerres"
 interwar_artillery_desc:0 "Les leçons apprises lors du développement de différents types d'artillerie peuvent être appliquées de manière croisée à la conception d'autres pièces."
 artillery1:0 "Artillerie I"
 artillery1_desc:0 "Grâce à des matériaux et des mécanismes plus modernes, les obusiers et les canons de campagne de la Grande Guerre peuvent être regroupés et modernisés pour la guerre moderne."
 artillery2:0 "Amélioration de l'artillerie I"
 artillery2_desc:0 "La mise à niveau d'anciennes pièces ne peut nous mener que jusqu'à présent. De nouveaux modèles d'obusiers seront nécessaires, tirant parti des nouveaux dispositifs de recul hydrauliques et des canons plus longs."
 artillery3:0 "Amélioration de l'artillerie II"
 artillery3_desc:0 "Pour permettre l'utilisation d'armes plus lourdes sur des affûts plus légers, des freins de bouche peuvent être inclus dans les conceptions d'obusiers."
 artillery4:0 "Artillerie IV"
 artillery4_desc:0 "Développer une artillerie légère démontable pour le transport permettra d'apporter un appui d'artillerie dans des zones auparavant difficiles d'accès."
 artillery5:0 "Mise à niveau avancée de l'artillerie"
 artillery5_desc:0 "Les modèles d'artillerie avec des silhouettes plus basses seront plus difficiles à cibler pour l'ennemi."
 mountain_gun:0 "Pistolet de montagne"
 mountain_gun_desc:0 "Le terrain montagneux du nord de l'Inde a conduit au développement d'une pièce d'artillerie qui pouvait être démontée et transportée à dos de mulet partout où elle était nécessaire."
 rocket_artillery2:0 "Mise à niveau de l'artillerie à fusée I"
 rocket_artillery2_desc:0 "L'artillerie automotrice utilisant plusieurs roquettes sera capable de provoquer rapidement des destructions à grande échelle, tout en conservant sa mobilité pour éviter les contre-tirs."
 rocket_artillery3:0 "Mise à niveau de l'artillerie de fusée II"
 rocket_artillery3_desc:0 "En sacrifiant la portée au profit de l'impact, nous pouvons monter des fusées plus lourdes sur des véhicules plus gros. Opérant en équipe, ces batteries d'artillerie peuvent coopérer pour se recharger et se relocaliser rapidement."
 rocket_artillery4:0 "Artillerie de fusée III"
 rocket_artillery4_desc:0 "Les roquettes stabilisées en rotation peuvent augmenter la portée des batteries d'artillerie plus légères."
 antiair1:0 "Mise à niveau anti-aérienne"
 antiair1_desc:0 "Grâce à des mécanismes de rechargement plus rapides, les canons anti-aériens transportant de gros obus peuvent toujours maintenir les cadences de tir nécessaires."
 antiair2:0 "Anti-aérien II"
 antiair2_desc:0 "Pour cibler des avions volant à haute altitude, des cartouches et des canons plus longs seront nécessaires sur les canons anti-aériens."
 antiair3:0 "Mise à niveau anti-aérienne améliorée I"
 antiair3_desc:0 "À mesure que les systèmes radar s'améliorent, l'utilisation de la direction radar des canons anti-aériens devient plus viable. Suivre cette technologie nous permettra de fabriquer certains des systèmes anti-aériens les plus précis disponibles."
 antiair4:0 "Mise à niveau anti-aérienne II améliorée"
 antiair4_desc:0 "La combinaison de systèmes modernes de radar, d'informatisation et de chargeurs automatiques sera nécessaire pour réagir rapidement contre des avions plus rapides."
 antiair5:0 "Anti-aérien V"
 antiair5_desc:0 "Les missiles sol-air sont l'avenir de la guerre antiaérienne. Développer une plateforme mobile pour ces derniers devrait être notre prochain objectif."
 antitank1:0 "Mise à niveau antichar"
 antitank1_desc:0 "L'importance d'armes antichars efficaces a été démontrée lors de la Grande Guerre. L'introduction d'une nouvelle génération de ces armes sera nécessaire pour lutter contre les chars modernes."
 antitank2:0 "Antichar II"
 antitank2_desc:0 "La plupart des canons antichar sont jusqu'à présent assez légers. Des canons de plus gros calibre seront nécessaires pour combattre les chars plus lourds dotés d'un blindage incliné."
 antitank3:0 "Mise à niveau antichar améliorée I"
 antitank3_desc:0 "Les obus HEAT (antichar hautement explosifs) peuvent être utilisés dans l'artillerie antichar pour compenser la vitesse initiale limitée."
 antitank4:0 "Mise à niveau antichar II améliorée"
 antitank4_desc:0 "Les nouveaux canons antichar polyvalents employant des tirs de sabot perforants et rejetant le blindage peuvent pénétrer le blindage de presque tous les chars."
 antitank5:0 "Antichar V"
 antitank5_desc:0 "En combinant différents types de nouvelles technologies de munitions avec des canons dotés de vitesses initiales plus élevées, nous pouvons être préparés à toute nouvelle armure que nos ennemis pourraient développer."

