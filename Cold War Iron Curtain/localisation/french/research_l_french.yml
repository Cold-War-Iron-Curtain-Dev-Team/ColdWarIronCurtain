 ##Vanilla Naval Doctrines

 TITLE_FLEET_IN_BEING:0 "Flotte en être"
 TITLE_TRADE_INTERDICTION:0 "Interdiction commerciale"
 TITLE_BASE_STRIKE:0 "Frappe de base"
 FLEET_IN_BEING_DESC:0 "Une flotte solide, centrée sur les cuirassés, signifie que nous sommes une force avec laquelle il faut compter lorsqu'elle est déployée en mer."
 TRADE_INTERDICTION_DESC:0 "Contre un adversaire naval plus fort, nous pouvons nous concentrer sur l'immobilisation de sa flotte et la destruction des lignes de ravitaillement pour affamer sa machine de guerre."
 BASE_STRIKE_DESC:0 "En mettant l'accent sur les porte-avions et leur soutien, aucun ennemi ne sera hors de notre portée, que ce soit sur terre ou en mer."
 AIR_SUPERIORITY_DESC:0 "Nos chasseurs sont l'épine dorsale de l'armée de l'air et défendent notre ciel, escortent les bombardiers et débarrassent le ciel des ennemis pour nos troupes au sol."
 BATTLEFIELD_SUPPORT_DESC:1 "En améliorant la façon dont l'appui aérien rapproché interagit avec les divisions, nous pouvons dévaster les divisions ennemies avec un soutien optimal"
 OPERATIONAL_INTEGRITY_DESC:0 "Les bombardiers tactiques sont flexibles et peuvent effectuer à la fois un appui au sol et des bombardements réguliers"
 STRATEGIC_DESTRUCTION_DESC:0 "En bombardant les usines ennemies, soit de nuit, soit, plus dangereusement, de jour, nous pouvons sérieusement gêner leur machine de guerre."


