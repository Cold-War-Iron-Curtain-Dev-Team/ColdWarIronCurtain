 ##CWIC Support Companies

 support_tech:0 "Technologie de support"
 engineers_tech:0 "Entreprise d'ingénieur"

 hospital_tech:0 "Hôpitaux de campagne"
 logistics_tech:0 "Entreprise de logistique"
 recon_tech:0 "Compagnie de reconnaissance"
 signal_company_tech:0 "Commandement et signalisation"

 combat_support:0 "Soutien au combat"
 combat_support_desc:0 "Les sociétés de soutien au combat sont des sociétés qui jouent un rôle semi-direct dans le combat. Même s'ils ne sont pas derrière les lignes, ils remplissent des rôles qui impliquent généralement le combat lui-même, mais pas le combat direct sur la ligne de front. Les compagnies de soutien au combat doivent être prêtes à prendre part aux combats mais, de manière optimale, ne pas s'y engager directement. Avant de pouvoir développer des sociétés de soutien au combat, les kits d'équipement de base et les ensembles durables doivent être développés afin que ces sociétés puissent être prêtes à soutenir les troupes de première ligne."
 combat_service_support:0 "Soutien aux services de combat"
 combat_service_support_desc:0 "Les sociétés de services de combat sont des sociétés qui ne jouent aucun rôle direct dans le combat et ne sont pas aptes au combat. Ils restent loin derrière les lignes et ne jouent aucun rôle direct ou indirect dans les combats eux-mêmes. Bien que cela ne signifie pas qu'ils n'ont pas besoin d'être à proximité du front, car les compagnies médicales doivent toujours être disponibles pour prodiguer des soins médicaux aux soldats blessés et les sociétés de maintenance peuvent effectuer des réparations sur le terrain. Avant de pouvoir développer des sociétés de services de combat, les fondations des structures de terrain portables telles que les tentes, les remorques et les composants de fourgonnettes doivent être développées."

 #RECON

 tech_recon:0 "Reconnaissance I : éclaireurs"
 tech_recon_desc:0 "Les éclaireurs constituent la forme d'opération de reconnaissance la plus simple. Le travail de l'éclaireur consiste à trouver les positions ennemies et les informations sur la force et le nombre de l'ennemi, puis à les transmettre aux forces alliées. Les éclaireurs patrouillent dans les régions et acquièrent des connaissances sur les positions ennemies. Les scouts ont besoin d'un équipement de communication simple, d'optiques et d'un équipement léger."
 tech_recon2:0 "Recon II : observateurs"
 tech_recon2_desc:0 "Les observateurs sont des unités de reconnaissance qui maintiennent des positions avancées en combat actif. Les observateurs maintiennent une connaissance des unités ennemies et fournissent des détails importants sur les attaques, les mouvements et les positions de l'ennemi afin que les alliés puissent prendre les mesures appropriées et y réagir. Les observateurs ont besoin d'équipements de communication plus coûteux et d'équipements de combat légers pour se défendre."
 tech_recon3:0 "Recon III : Observateurs"
 tech_recon3_desc:0 "Les observateurs sont des observateurs affectés à des éléments de combat spécifiques et fournissent des détails sur des cibles potentielles en combat actif. Les observateurs acquièrent des cibles et transmettent ces informations aux éléments qui leur sont assignés pour s'engager ou envisager de s'engager. Les observateurs ont besoin de meilleures communications, optiques et systèmes de coordonnées pour transmettre des détails précis sur les emplacements ennemis."
 tech_recon4:0 "Recon IV : reconnaissance élite"
 tech_recon4_desc:0 "Les forces de reconnaissance sont des éléments importants dans une armée. En raison de leur nature, il est important de préserver leur vie et leur capacité de survie au combat. En introduisant un régime d'entraînement au combat et de survie plus avancé, les forces de reconnaissance peuvent survivre plus longtemps et devenir résistantes aux embuscades et aux frappes brusques."
 tech_recon5:0 "Recon V : tirailleurs modernes"
 tech_recon5_desc:0 "Les tirailleurs sont une forme avancée d'éclaireur. Historiquement, les tirailleurs étaient des unités d'infanterie légère qui servaient d'avant-garde aux positions alliées, harcelaient les ennemis et masquaient les positions ennemies. Dans les combats modernes, bon nombre de ces tirailleurs ont été progressivement éliminés ou ont une capacité de survie minimale. En développant des armes et des systèmes capables de fournir des tirs harcelants et d'échapper à des situations difficiles, le rôle du tirailleur peut être rempli dans le combat moderne."
 tech_recon6:0 "Recon VI : espions de terrain"
 tech_recon6_desc:0 "Les espions de terrain sont des éléments d'espionnage de l'armée qui se déguisent en unités ennemies ou en civils afin d'échapper à la détection. Ils n'opèrent pas dans le cadre d'une agence de renseignement mais plutôt dans le cadre d'une armée, relayant les emplacements actifs à un ennemi, généralement dans le cadre d'une guerre urbaine où il leur est plus facile d'être en position. Pour fonctionner, les espions de terrain ont besoin d'équipements dissimulables et secrets tels que des radios compactes ou des téléphones civils modifiés."
 tech_recon7:0 "Recon VII : reconnaissance en profondeur"
 tech_recon7_desc:0 "Deep Wire Recon est une opération très avancée dans laquelle des éléments de reconnaissance se positionnent bien au-delà des lignes ennemies afin de relayer des informations. Ces types de tactiques d'infiltration profonde nécessitent des niveaux d'essais massifs pour se développer et nécessitent généralement que les unités se cachent et laissent passer l'ennemi. L'équipement et les techniques de camouflage ainsi que les tactiques d'infiltration sont difficiles à créer mais sont extrêmement utiles car ils peuvent fournir les informations les plus approfondies qui ne peuvent être acquises par des éléments de reconnaissance conventionnels."

 #MECH RECON

 tech_mech_recon:0 "Reconnaissance mécanisée I : éclaireurs motorisés"
 tech_mech_recon_desc:0 "Les éclaireurs constituent la forme d'opération de reconnaissance la plus simple. Le travail de l'éclaireur consiste à trouver les positions ennemies et les informations sur la force et le nombre de l'ennemi, puis à les transmettre aux forces alliées. Les éclaireurs patrouillent dans les régions et acquièrent des connaissances sur les positions ennemies. Les scouts ont besoin d'un équipement de communication simple, d'optiques et d'un équipement léger. Les éclaireurs motorisés utilisent des véhicules rapides et suffisamment blindés pour patrouiller les zones plus rapidement."
 tech_mech_recon2:0 "Reconnaissance mécanisée II : observateurs avancés"
 tech_mech_recon2_desc:0 "Les observateurs sont des unités de reconnaissance qui maintiennent des positions avancées en combat actif. Les observateurs maintiennent une connaissance des unités ennemies et fournissent des détails importants sur les attaques, les mouvements et les positions de l'ennemi afin que les alliés puissent prendre les mesures appropriées et y réagir. Les observateurs ont besoin d'équipements de communication plus coûteux et d'équipements de combat légers pour se défendre. Les observateurs avancés utilisent des équipements tels que des hélicoptères ou des véhicules de reconnaissance pour maintenir de meilleurs visuels."
 tech_mech_recon3:0 "Reconnaissance mécanisée III : observateurs mécanisés"
 tech_mech_recon3_desc:0 "Les observateurs sont des observateurs affectés à des éléments de combat spécifiques et fournissent des détails sur des cibles potentielles en combat actif. Les observateurs acquièrent des cibles et transmettent ces informations aux éléments qui leur sont assignés pour s'engager ou envisager de s'engager. Les observateurs ont besoin de meilleures communications, optiques et systèmes de coordonnées pour transmettre des détails précis sur les emplacements ennemis. Les observateurs mécanisés utilisent des véhicules lourdement blindés dotés d'optiques puissantes pour acquérir des cibles."
 tech_mech_recon4:0 "Reconnaissance mécanisée IV : reconnaissance mobile Task Elite"
 tech_mech_recon4_desc:0 "Les forces de reconnaissance sont des éléments importants dans une armée. En raison de leur nature, il est important de préserver leur vie et leur capacité de survie au combat. En introduisant un régime d'entraînement au combat et de survie plus avancé, les forces de reconnaissance peuvent survivre plus longtemps et devenir résistantes aux embuscades et aux frappes brusques. Le développement de véhicules de reconnaissance haut de gamme et coûteux peut contribuer davantage à la capacité de survie des éclaireurs."
 tech_mech_recon5:0 "Reconnaissance mécanisée V : tirailleurs avancés modernes"
 tech_mech_recon5_desc:0 "Les tirailleurs sont une forme avancée d'éclaireur. Historiquement, les tirailleurs étaient des unités d'infanterie légère qui servaient d'avant-garde aux positions alliées, harcelaient les ennemis et masquaient les positions ennemies. Dans les combats modernes, bon nombre de ces tirailleurs ont été progressivement éliminés ou ont une capacité de survie minimale. En développant des armes et des systèmes capables de fournir des tirs harcelants et d'échapper à des situations difficiles, le rôle du tirailleur peut être rempli dans le combat moderne. Fournir aux chars de reconnaissance des écrans de fumée et des distributeurs de paillettes modernes peut grandement contribuer à leur capacité à harceler l'ennemi et à survivre aux tirs de retour."
 tech_mech_recon6:0 "Reconnaissance mécanisée VI : espions de terrain avancés"
 tech_mech_recon6_desc:0 "Les espions de terrain sont des éléments d'espionnage de l'armée qui se déguisent en unités ennemies ou en civils afin d'échapper à la détection. Ils n'opèrent pas dans le cadre d'une agence de renseignement mais plutôt dans le cadre d'une armée, relayant les emplacements actifs à un ennemi, généralement dans le cadre d'une guerre urbaine où il leur est plus facile d'être en position. Pour fonctionner, les espions de terrain ont besoin d'équipements dissimulables et secrets tels que des radios compactes ou des téléphones civils modifiés. Utilisant des véhicules civils, les espions de terrain peuvent infiltrer les positions urbaines et rurales plus rapidement et potentiellement se fondre dans la masse."
 tech_mech_recon7:0 "Reconnaissance mécanisée VII : reconnaissance mobile en profondeur"
 tech_mech_recon7_desc:0 "Deep Wire Recon est une opération très avancée dans laquelle des éléments de reconnaissance se positionnent bien au-delà des lignes ennemies afin de relayer des informations. Ces types de tactiques d'infiltration profonde nécessitent des niveaux d'essais massifs pour se développer et nécessitent généralement que les unités se cachent et laissent passer l'ennemi. L'équipement et les techniques de camouflage ainsi que les tactiques d'infiltration sont difficiles à créer mais sont extrêmement utiles car ils peuvent fournir les informations les plus approfondies qui ne peuvent être acquises par des éléments de reconnaissance conventionnels."

 #Engineers

 tech_engineers:0 "Ingénieur I : Défenseurs"
 tech_engineers_desc:0 "Les défenseurs constituent la forme la plus élémentaire du génie de combat. Les défenseurs accomplissent la tâche de base consistant à construire des retranchements et à mettre en place des structures défensives, à dégager des chemins et à installer des camps de base. Les défenseurs ont besoin d'outils de base comme des pelles et des haches, des kits de fortification de base et des mines."
 tech_engineers2:0 "Ingénieur II : Sapeurs"
 tech_engineers2_desc:0 "Les sapeurs sont un autre nom pour les ingénieurs de combat. Les sapeurs sont utilisés pour des tâches de combat plus directes telles que percer des fortifications et mener des contre-opérations pour nettoyer les champs de mines et les obstacles. Les sapeurs ont besoin de charges de brèche, d'explosifs puissants, d'équipement de déminage, de lance-flammes, de coupe-boulons et d'autres pièces d'équipement nécessaires pour contrecarrer les fortifications."
 tech_engineers3:0 "Ingénieur III : Bridgers"
 tech_engineers3_desc:0 "Les pontiers sont des ingénieurs de combat qui utilisent du matériel de pontage pour faciliter la traversée des rivières. Ces ingénieurs construisent des ponts à partir de matériaux locaux tels que des rondins ou des pierres afin de fabriquer des ponts de fortune. Ce processus peut être long et ardu à réaliser manuellement et, dans les divisions plus grandes, les ingénieurs pontiers sont les contremaîtres des autres soldats pour construire les ponts. Les ponteurs ont besoin de haches ou d'outils de coupe de pierre, de cordes et de kits de pontage pour effectuer ce travail. "
 tech_engineers4:0 "Ingénieur IV : Junglers"
 tech_engineers4_desc:0 "Les junglers sont des ingénieurs de combat qui nettoient les zones de la jungle en utilisant des défoliants ou du feu ainsi que des outils améliorés pour créer des fortifications dans la jungle. Faire cela facilite le combat et permet aux ingénieurs de combat de fournir un avantage important dans l'environnement difficile de la jungle. Cependant, la majeure partie du développement des junglers concerne les techniques et les théories de la guerre dans la jungle, de sorte qu'ils ne sont utiles à aucun autre environnement de combat."
 tech_engineers5:0 "Ingénieur V : Ingénieurs de combat"
 tech_engineers5_desc:0 "Les ingénieurs de combat devront peut-être jouer un rôle plus direct au combat. À un moment donné, ils devront construire des bases avancées avancées au sein des zones sensibles. Les ingénieurs de combat doivent être capables de mettre en place des fortifications et des bases avancées dans des délais extrêmement courts et de haute qualité. Cela nécessite des équipements individuels encore plus avancés, un train de ravitaillement rapide capable de livrer tous les matériaux nécessaires et un équipement plus durable pour le maintien dans les zones dangereuses."
 tech_engineers6:0 "Ingénieur VI : Pionniers"
 tech_engineers6_desc:0 "Les pionniers sont des ingénieurs de combat capables de relever n'importe quel environnement et n'importe quel défi régional dans le monde. Ce sont des ingénieurs compétents qui maîtrisent partout où vous pouvez les envoyer. Ils utilisent des outils et des équipements polyvalents et légers pour construire des fortifications, faciliter les mouvements ou percer les fortifications ennemies."
 tech_engineers7:0 "Ingénieur VII : Ingénieurs de guerre urbaine/Ingénieurs de terrain"
 tech_engineers7_desc:0 "Les ingénieurs de guerre urbaine sont l'évolution de l'ingénieur de combat et du sapeur. Les ingénieurs de guerre urbaine sont des spécialistes de la guerre urbaine et sont capables d'ériger des fortifications et des installations avancées en environnement urbain. Non seulement ils peuvent améliorer la capacité de combat des troupes en milieu urbain, mais ils peuvent également faire face aux risques urbains résultant de la guerre, tels que les décombres, les fils électriques dénudés, les inondations toxiques, etc. Ces gars font de la guerre urbaine un peu moins un enfer pour vos troupes et une manifestation du Feu éternel lui-même pour l'ennemi.\nLes ingénieurs de terrain sont l'évolution des défenseurs. Les ingénieurs de terrain se spécialisent dans la construction d'installations améliorées, de défenses et de dégagements de chemins. Grâce à des équipements plus perfectionnés, les ingénieurs de terrain sont capables de dégager des chemins et de construire plus rapidement que jamais."

 #ARMORED ENGINEERS

 tech_armor_engineers:0 "Ingénieur blindé I : défenseurs motorisés"
 tech_armor_engineers_desc:0 "Les défenseurs constituent la forme la plus élémentaire du génie de combat. Les défenseurs accomplissent la tâche de base consistant à construire des retranchements et à mettre en place des structures défensives, à dégager des chemins et à installer des camps de base. Les défenseurs ont besoin d'outils de base comme des pelles et des haches, des kits de fortification de base et des mines. Les défenseurs motorisés utilisent des véhicules de construction et des camions de ravitaillement afin de les aider dans leurs efforts de fortification."
 tech_armor_engineers2:0 "Ingénieur blindé II : Sapeurs mécanisés"
 tech_armor_engineers2_desc:0 "Les sapeurs sont un autre nom pour le génie de combat. À ce stade, les sapeurs sont utilisés pour des tâches de combat plus directes telles que percer des fortifications et mener des contre-opérations pour nettoyer les champs de mines et les obstacles. Les sapeurs ont besoin de charges de brèche, d'explosifs puissants, d'équipement de déminage, de lance-flammes, de coupe-boulons et d'autres pièces d'équipement nécessaires pour contrecarrer les fortifications. Les sapeurs mécanisés utilisent des véhicules de destruction de bunkers et des camions de ravitaillement afin de faciliter leurs assauts et de mieux soutenir les principaux attaquants."
 tech_armor_engineers3:0 "Ingénieur blindé III : Bridgers mécanisés"
 tech_armor_engineers3_desc:0 "Les pontiers sont des ingénieurs de combat qui utilisent du matériel de pontage pour faciliter la traversée des rivières. Ces ingénieurs construisent des ponts à partir de matériaux locaux tels que des rondins ou des pierres afin de fabriquer des ponts de fortune. Ce processus peut être long et ardu à réaliser manuellement et, dans les divisions plus grandes, les ingénieurs pontiers sont les contremaîtres des autres soldats pour construire les ponts. Les ponteurs ont besoin de haches ou d'outils de coupe de pierre, de cordes et de kits de pontage pour effectuer ce travail. Les Bridgers mécanisés utilisent des véhicules de pontage spéciaux afin de construire des ponts plus rapidement sur le terrain."
 tech_armor_engineers4:0 "Ingénieur blindé IV : Junglers avancés"
 tech_armor_engineers4_desc:0 "Les junglers sont des ingénieurs de combat qui nettoient les zones de la jungle en utilisant des défoliants ou du feu ainsi que des outils améliorés pour créer des fortifications dans la jungle. Faire cela facilite le combat et permet aux ingénieurs de combat de fournir un avantage important dans l'environnement difficile de la jungle. Cependant, l'essentiel du développement des junglers concerne les techniques et les théories de la guerre dans la jungle. Les junglers avancés utilisent de gros bulldozers, des véhicules de coupe à blanc, des chars lance-flammes et des hélicoptères défoliants pour mieux soutenir les autres troupes ou pour vaincre d'autres forces tentant d'utiliser la jungle à leur avantage."
 tech_armor_engineers5:0 "Ingénieur blindé V : Ingénieurs de combat blindés"
 tech_armor_engineers5_desc:0 "Les ingénieurs de combat sont des ingénieurs qui jouent un rôle plus direct dans le combat. Ils construisent des bases avancées avancées dans les zones sensibles. Les ingénieurs de combat doivent être capables de mettre en place des fortifications et des bases avancées dans des délais extrêmement courts et de haute qualité. Cela nécessite des équipements individuels encore plus avancés, un train de ravitaillement rapide capable de livrer tous les matériaux nécessaires et un équipement plus durable pour le maintien dans les zones dangereuses. Les ingénieurs de combat blindés utilisent des véhicules lourdement blindés et des chars du génie afin de mieux se protéger en milieu urbain et combattre en environnement de siège."
 tech_armor_engineers6:0 "Armored Engineer VI : Pionniers motorisés"
 tech_armor_engineers6_desc:0 "Les pionniers sont des ingénieurs de combat capables de relever n'importe quel environnement et n'importe quel défi régional dans le monde. Ce sont des ingénieurs compétents qui maîtrisent partout où vous pouvez les envoyer. Ils utilisent des outils et des équipements polyvalents et légers pour construire des fortifications, faciliter les mouvements ou percer les fortifications ennemies. Les Pionniers motorisés utilisent des véhicules de construction modernes et fournissent des véhicules afin de faire leur travail plus rapidement et avec de meilleurs résultats que les Pionniers qui n'ont pas accès à des équipements lourds."
 tech_armor_engineers7:0 "Ingénieur blindé VII : Mobile UWE/FE"
 tech_armor_engineers7_desc:0 "Les ingénieurs de guerre urbaine sont l'évolution de l'ingénieur de combat et du sapeur. Les ingénieurs de guerre urbaine sont des spécialistes de la guerre urbaine et sont capables d'ériger des fortifications et des installations avancées en environnement urbain. Non seulement ils peuvent améliorer la capacité de combat des troupes en milieu urbain, mais ils peuvent également faire face aux risques urbains résultant de la guerre, tels que les décombres, les fils électriques dénudés, les inondations toxiques, etc. Ces gars font de la guerre urbaine un peu moins un enfer pour vos troupes et une manifestation du Feu éternel lui-même pour l'ennemi. Les ingénieurs mobiles de guerre urbaine utilisent des véhicules lourdement blindés et des chars d'ingénierie afin d'éliminer les dangers et de fournir un meilleur soutien lors des sièges de villes.\nLes ingénieurs de terrain sont l'évolution des défenseurs. Les ingénieurs de terrain se spécialisent dans la construction d'installations améliorées, de défenses et de dégagements de chemins. Grâce à des équipements plus perfectionnés, les ingénieurs de terrain sont capables de dégager des chemins et de construire plus rapidement que jamais. Les ingénieurs de terrain mobiles utilisent des véhicules de déminage, des hélicoptères, des véhicules de construction, des chars d'ingénierie et bien d'autres ensembles d'équipements avancés pour faire leur travail mieux que les ingénieurs de terrain qui ne disposent pas de cet équipement."

 #HOSPITAL
 tech_field_hospital:0 "Champ I : Compagnie de terrain"
 tech_field_hospital_desc:0 "Les sociétés médicales sont des sociétés de soutien composées de personnel médical comprenant des chirurgiens de campagne, des médecins de combat, des infirmières, etc. Ils veillent à la santé et au bien-être des soldats sur le terrain. Les sociétés médicales les plus simples équipent simplement le personnel médical d'équipements légers et leur donnent la formation et la discipline nécessaires pour faire face aux horreurs de la guerre. Il n'est pas nécessaire de les former à travailler sous pression et sous des contraintes de temps, car le personnel médical doit toujours travailler ainsi."
 tech_field_hospital2:0 "Médecine II : Hôpitaux de campagne"
 tech_field_hospital2_desc:0 "La création d'hôpitaux de campagne portables facilite grandement l'assistance aux blessés. Les soldats invalides emmenés dans des hôpitaux de campagne où sont installés des équipements médicaux ont beaucoup plus de chances de survivre que les médecins qui tentent de les soigner pendant qu'on leur tire dessus dans la boue. Les hôpitaux de campagne doivent disposer d'équipements légers et d'ambulances blindées de campagne afin d'être portables avec l'armée et de récupérer les soldats pendant les combats actifs."
 tech_field_hospital3:0 "Médecine III : Équipement hospitalier portable"
 tech_field_hospital3_desc:0 "Même si disposer de machines massives et de lits d'hôpitaux complets équipés de moniteurs peut être un excellent moyen de sauver des vies, les hôpitaux physiques ne sont malheureusement pas transportables. La création de variantes légères et portables d'équipements médicaux trouvés dans les hôpitaux permet aux hôpitaux de campagne de mieux correspondre à leurs homologues permanents et d'améliorer davantage la vie des soldats."
 tech_field_hospital4:0 "Médecine IV : Conditionnement Physio/Psycho Avancé"
 tech_field_hospital4_desc:0 "Naturellement, cela aide à être en bonne santé lorsque sa vie est en jeu, cela facilite le travail du médecin et lui donne de meilleures chances de survie. Grâce à la recherche médicale, les sociétés médicales peuvent surveiller et améliorer la santé physique et mentale des soldats sur le terrain afin de garantir qu'ils disposent d'os, de muscles, d'un système immunitaire et d'un esprit solides afin qu'ils puissent mieux survivre au traumatisme des blessures médicales au combat."
 tech_field_hospital5:0 "Médecine V : Recherche médicale militaire"
 tech_field_hospital5_desc:0 "Les médecins civils et les chercheurs en médecine (espérons-le) n'ont pas à faire régulièrement face à un grand nombre de patients souffrant de blessures extrêmes au combat. C'est pour cette raison que l'art de la médecine de combat n'a acquis une connaissance scientifique que lorsque des guerres sont en cours ou que le pays est extrêmement instable. Toutefois, si un pays est instable, il est peu probable qu'il y ait autant de médecins disposant d'hôpitaux bien financés. Par conséquent, il est prudent d'inclure des chercheurs en médecine capables d'étudier et de créer de nouvelles techniques et fournitures médicales pour traiter les blessures de combat."
 tech_field_hospital6:0 "Médecine VI : psychiatres militaires"
 tech_field_hospital6_desc:0 "Tous ceux qui sont mis hors service dans l'armée ne sont pas tous tués ou blessés. La nature violente et infernale de la guerre laisse de nombreux soldats atteints du SSPT. Cet état malheureux laisse les anciens combattants infirmes ou incapables de retourner à la vie civile et de continuer à servir dans l'armée. Les psychiatres militaires existent pour aider les soldats mentalement traumatisés et leur permettre de continuer à servir dans l'armée ou d'être libérés et de pouvoir retourner paisiblement à la vie civile avec peu ou pas de problèmes psychiatriques ou de déclencheurs de SSPT."
 tech_field_hospital7:0 "Médecine VII : Médecine militaire des traumatismes"
 tech_field_hospital7_desc:0 "Conclusion logique du CIMR, la médecine traumatologique implique des équipements spécialisés pour traiter les blessures extrêmes et stabiliser les problèmes physiologiques graves associés aux traumatismes majeurs. Ceci, combiné à la nécessité d'une médecine légère et compacte en temps de guerre, pousse l'ingéniosité médicale à ses limites. Cela comprend des organes artificiels temporaires qui effectuent des tâches simples, des anesthésiques très puissants, des aides très avancées et des équipements miniaturisés pour les services de traumatologie. La médecine militaire de traumatologie peut ramener du bord du gouffre des soldats qui auraient été considérés comme condamnés les années précédentes."

