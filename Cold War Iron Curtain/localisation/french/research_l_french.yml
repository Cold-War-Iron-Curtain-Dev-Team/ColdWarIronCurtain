 #LOGISTICS
 tech_logistics_company:0 "Logistique I : Corps Logistique"
 tech_logistics_company_desc:0 "Les corps logistiques sont du personnel non combattant dédié qui fournit du ravitaillement et des provisions à une armée. L'un des éléments les plus importants d'une armée, le corps logistique fournit des munitions, des provisions et des pièces de rechange à une armée afin qu'elle puisse continuer à combattre. De plus, des corps et officiers spécialisés gèrent les réseaux et réduisent les déchets, ce qui peut grandement contribuer à réduire la consommation totale."
 tech_logistics_company2:0 "Logistique II : escortes de convois"
 tech_logistics_company2_desc:0 "Les convois logistiques sont des cibles privilégiées pour les agents d'infiltration et les opérations menées derrière les lignes ennemies. En évaluant les risques et en sécurisant les lignes d'approvisionnement avec des patrouilles et des escortes, les approvisionnements peuvent être protégés et les provisions de valeur qui sont normalement détruites peuvent être économisées, réduisant ainsi davantage la consommation globale."
 tech_logistics_company3:0 "Logistique III : normalisation de l'approvisionnement"
 tech_logistics_company3_desc:0 "Différents fabricants ou régions auront généralement leurs propres méthodes de stockage et d'étiquetage des provisions. Cela peut constituer une lourde charge pour le corps logistique. Il est donc important d'élaborer un catalogue national standardisé de provisions militaires afin de faciliter la gestion par les officiers d'approvisionnement."
 tech_logistics_company4:0 "Logistique IV : Conteneurs légers/compacts"
 tech_logistics_company4_desc:0 "Le poids est une préoccupation majeure en logistique. Les véhicules ne peuvent transporter qu'un poids limité et sont même soumis à des restrictions quant au volume de contenu qu'ils peuvent transporter. En créant des conteneurs légers, solides et compacts, une plus grande quantité de produits peut être expédiée plus rapidement et avec une meilleure efficacité énergétique."
 tech_logistics_company5:0 "Logistique V : Corps d'approvisionnement tout-terrain"
 tech_logistics_company5_desc:0 "Vous ne pouvez pas toujours compter sur l'utilisation des infrastructures et des routes de votre ennemi. Ils peuvent être détruits dans une action de terre brûlée ou peuvent ne pas exister en premier lieu. À ce propos, vous ne pouvez pas toujours compter sur le fait que votre propre infrastructure ne sera pas détruite ni même existante. Il est important que les véhicules de ravitaillement et les agents de logistique soient capables de circuler hors route et de trouver de nouveaux chemins afin d'améliorer les déplacements."
 tech_logistics_company6:0 "Logistique VI : missions aériennes efficaces"
 tech_logistics_company6_desc:0 "Les missions aériennes et les fournitures parachutées peuvent être perdues, détruites, capturées par l'ennemi ou les partisans, ou même nécessiter de grandes quantités de carburant à livrer. En révisant les plans de parachutage et les parachutages eux-mêmes, les missions aériennes peuvent fournir le ravitaillement nécessaire plus rapidement. "
 tech_logistics_company7:0 "Logistique VII : Véhicules de grande capacité"
 tech_logistics_company7_desc:0 "Lorsque toutes les méthodes et tous les protocoles de gestion ont été entièrement optimisés, il ne reste plus qu'à rendre les véhicules plus solides, plus efficaces et plus résistants. C'est tout ce qu'il y a à dire."

