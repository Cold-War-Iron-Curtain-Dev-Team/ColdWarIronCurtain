 ##Vanilla Electronics

 encryption_tech:0 "Méthodes de cryptage"
 decryption_tech:0 "Méthodes de décryptage"
 computing_tech:0 "Technologie informatique"
 radar_tech:0 "Technologie radar"

 radio_detection:0 "Détection radio"
 radio_detection_desc:0 "Le développement du RADAR, Radio Detection and Ranging, permet d'utiliser les ondes radio pour détecter des objets physiques. La recherche est très secrète, compte tenu de l'impact que ces inventions pourraient avoir sur la localisation des unités."
 decimetric_radar:0 "Radar décimétrique"
 decimetric_radar_desc:0 "De nombreuses unités comptent sur l'élément de surprise pour leur efficacité. Le développement du radar décimétrique permet de les priver de cet avantage."
 improved_decimetric_radar:0 "Radar décimétrique amélioré"
 improved_decimetric_radar_desc:0 "L'utilisation du radar s'est déjà révélée cruciale, mais nos radars décimétriques sont trop peu nombreux pour assurer une bonne couverture. Equiper davantage d'unités de radar nous permettra de maximiser notre avance technologique."
 centimetric_radar:0 "Radar centimétrique"
 centimetric_radar_desc:0 "De nouveaux radars fonctionnant dans les bandes micro-ondes nous permettent de détecter des objets trop petits pour être captés par les radars précédents."
 improved_centimetric_radar:0 "Radar centimétrique amélioré"
 improved_centimetric_radar_desc:0 "L'introduction de techniques radar de pointe telles que les radars monopulses dans les opérations clés permettra une précision de suivi extrême."
 advanced_centimetric_radar:0 "Radar centimétrique avancé"
 advanced_centimetric_radar_desc:0 "Malgré nos radars avancés, il existe encore des moyens pour l'ennemi d'éviter d'être détecté. De nouveaux développements comme le radar Pulse-Doppler nous permettent d'éliminer bon nombre de ces limitations de nos équipements."
 mechanical_computing:0 "Informatique mécanique"
 mechanical_computing_desc:0 "La construction de machines capables d'analyse différentielle avancée changera radicalement le type de calculs assistés par machine qui peuvent être effectués."
 computing_machine:0 "Machine informatique"
 computing_machine_desc:0 "Développer une base théorique pour les ordinateurs modernes et construire des machines électromécaniques pour commencer à les mettre en pratique seront les premiers pas dans ce domaine des possibilités."
 improved_computing_machine:0 "Machine informatique améliorée"
 improved_computing_machine_desc:0 "Il est désormais possible de fabriquer des ordinateurs numériques électroniques programmables. Bien qu'encore coûteuses et volumineuses, ces machines permettent une analyse du renseignement bien au-delà des capacités humaines."
 advanced_computing_machine:0 "Machine informatique avancée"
 advanced_computing_machine_desc:0 "Commencer à travailler sur des ordinateurs capables de stocker des programmes et d'utiliser des transistors nous mettra sur la voie d'une révolution numérique où ces machines pourront être utilisées dans presque tous les domaines."
 basic_encryption:1 "Cryptage - Chiffres polyalphabétiques"
 basic_encryption_desc:0 "Les nouvelles méthodes de communication entraînent de nouveaux risques d'interception. Des machines de chiffrement à rotor peuvent être utilisées pour permettre un cryptage rapide et complexe."
 improved_encryption:1 "Chiffrement - Permutations cycliques"
 improved_encryption_desc:0 "La limitation de la randomisation des machines de chiffrement peut être exploitée pour casser les chiffrements. En améliorant le caractère aléatoire de la mécanique du rotor, nous pouvons rendre ce type de cryptanalyse plus difficile."
 advanced_encryption:1 "Cryptage - Modulation par impulsions codées"
 advanced_encryption_desc:0 "Les améliorations technologiques et l'expérience durement acquise nous permettent de mettre en oeuvre davantage de mesures de sécurité du trafic dans nos communications."
 basic_decryption:1 "Décryptage - Analyse de fréquence"
 basic_decryption_desc:0 "La cryptanalyse devient de plus en plus une science mathématique avancée. Des systèmes tels que des catalogues sur fiches et des appareils tels que des cyclomètres peuvent faciliter le travail nécessaire."
 improved_decryption:1 "Décryptage - Attaque par canal secondaire"
 improved_decryption_desc:0 "Le développement d'ordinateurs plus sophistiqués permet de nouvelles applications de méthodes de cryptanalyse telles que la différenciation, qui peuvent être utilisées pour casser des chiffrements avancés lorsqu'elles sont combinées avec de nouvelles méthodes de décryptage manuel."
 advanced_decryption:1 "Décryptage - Déduction Automatisée"
 advanced_decryption_desc:0 "La puissance de calcul accrue qui a amélioré notre cryptanalyse jusqu'à présent menace de créer des chiffres presque incassables à l'avenir. Pour garder une longueur d'avance, nous devons être prêts à travailler de manière plus agressive pour obtenir des informations privilégiées sur la technologie."

 ##CWIC Electronics


 transistor_tech:0 "Architecture des transistors"
 supercomputer_tech:0 "Supercalcul"
 hardware_tech:0 "Matériel informatique"
 software_tech:0 "Logiciel informatique"
 interwebs_tech:0 "Technologie de l'information"
 consumer_electronics:0 "Electronique grand public"
 commercial_electronics:0 "Électronique commerciale/de bureau"

 ww_pc:0 "Ordinateurs de la Seconde Guerre mondiale"
 ww_pc_desc:0 "Avant et pendant la Seconde Guerre mondiale, de nombreuses inventions proto-informatiques ont été créées. Les ordinateurs mécaniques ont cédé la place aux machines informatiques électroniques utilisant des tubes à vide. Ces ordinateurs pourraient effectuer des tâches répétitives et simples pour faciliter le travail des chercheurs et des ingénieurs. Ces ordinateurs ont une puissance de traitement très limitée et ne peuvent effectuer que des tâches simples, mais constituent un tremplin crucial pour l'évolution de la société et de la technologie."
 radio:0 "Radios de la Seconde Guerre mondiale"
 radio_desc:0 "Une radio est un appareil qui utilise des ondes d'énergie électromagnétique pour transmettre et recevoir des données dans l'espace. Lorsque des ondes radio frappent un conducteur électrique, un courant alternatif y est créé. Ce courant peut être lu et traduit en données lisibles. Les informations contenues dans les vagues peuvent être extraites de ce courant et traduites. L'utilisation de radios permet la transmission d'informations par voie hertzienne et permet la communication à distance. De plus, différentes modulations basées sur l'amplitude, l'angle, la fréquence ou la phase peuvent être lues sur différents canaux, ce qui permet à plusieurs radios d'utiliser le même espace aérien pour transmettre des informations. "
 egg_desc:0 "Fabriqué par Polarace & Schorle & Theodore & Starfoth"

 #Hardware
 hardware_I:0 "Écriture magnétique/mémoire précoce"
 hardware_II:0 "Mémoire à noyau magnétique"
 hardware_III:0 "Premier disque dur"
 hardware_IV:0 "Auxiliaires informatiques de base"
 hardware_V:0 "Systèmes informatiques généraux améliorés"
 hardware_VI:0 "Mémoire vive"
 hardware_VII:0 "Auxiliaires modernes"
 hardware_VIII:0 "Stockage de données optiques numériques"
 hardware_IX:0 "Modularité des composants"
 hardware_X:0 "Disque dur avancé"
 hardware_XI:0 "Unité de traitement graphique"
 hardware_XII:0 "Auxiliaires avancés"
 hardware_XIII:0 "Stockage Flash (SSD)"
 hardware_XIV:0 "NVM Express"
 hardware_XV:0 "Unité de contrôle centrale (CCU)"
 hardware_XVI:0 "Jetons empilés (empilement de matrices)"
 hardware_I_desc:0 "L'écriture magnétique est un composant essentiel de la mémoire à noyau magnétique. L'écriture magnétique utilise un aimant commuté pour commuter les éléments magnétisés dans un support magnétisé afin de créer une mémoire non volatile. Les premières mémoires magnétiques n'étaient pas jugées commercialement réalisables en raison de leur très petite capacité et de la vitesse à laquelle le pôle magnétique doit se déplacer autour du disque. "
 hardware_II_desc:0 "La mémoire à noyau magnétique fait partie des premières formes de RAM. Le noyau utilise de minuscules anneaux magnétiques avec un grand nombre de fils enfilés pour lire et écrire des informations. Chaque noyau pourrait contenir un bit d'information et serait magnétisé dans un sens ou dans l'autre pour stocker un 1 ou un zéro. Cela a permis le stockage temporaire des données pour un accès et une modification extrêmement rapides, de la même manière que la RAM est utilisée aujourd'hui. Il ne peut pas être utilisé comme stockage de données général car il est extrêmement encombrant par rapport aux périphériques de stockage et également beaucoup plus cher au bit, tout comme la RAM aujourd'hui."
 hardware_III_desc:0 "Inventé pour la première fois par IBM en 1956, le disque dur a été rapidement adopté comme principal périphérique de stockage de données numériques. Le disque dur (HDD) est une forme de stockage de données qui utilise le stockage magnétique pour lire et corriger les données numériques. Le disque utilise un disque à rotation rapide recouvert d'un matériau magnétique. Les têtes magnétiques peuvent modifier et lire les données sur le disque pendant sa rotation. Les disques durs peuvent stocker énormément plus de données que les anciennes formes de stockage numérique."
 hardware_IV_desc:0 "Les auxiliaires informatiques sont des éléments tels que le clavier, la souris, l'écran, etc. Les auxiliaires informatiques existent sous la forme primitive avant la recherche. À mesure que les ordinateurs deviennent de plus en plus petits, ils finissent par atteindre un point où les auxiliaires de base deviennent plus importants. Ces ordinateurs prennent en charge des écrans dynamiques, des claviers améliorés et standardisés et un meilleur équipement sonore pour modifier et lire les données sonores. Ces auxiliaires ouvrent la voie à davantage d'applications informatiques."
 hardware_V_desc:0 "Si la création de nouvelles formes de matériel augmente la polyvalence d'un ordinateur, il est également nécessaire d'optimiser les systèmes existants. La rationalisation des conceptions et des pilotes pour des systèmes tels que la carte mère ou la carte son améliore les capacités de tous les autres systèmes qui l'entourent et leur permet d'atteindre de nouveaux sommets. "
 hardware_VI_desc:0 "La mémoire vive (RAM) est une forme de stockage de données offrant des vitesses de lecture-écriture énormes et utilisée pour exécuter des programmes. Sans RAM, les programmes fonctionneraient beaucoup plus lentement et pourraient ne pas permettre la lecture ou l'écriture des données dans le même laps de temps par rapport à l'emplacement physique des données. La RAM contient des circuits de multiplexage et de démultiplexage (circuits combinant plusieurs signaux numériques en un seul signal partagé) pour connecter les lignes de données au stockage adressé et permettre aux programmes d'accéder et de modifier facilement les données."
 hardware_VII_desc:0 "Les auxiliaires informatiques modernes tels que le clavier mécanique optimisé et la souris trackball optimisée sont conçus pour être exactement cela : des versions optimisées de l'ancienne génération d'auxiliaires. Permettant une meilleure qualité sonore et une utilisation facile et accessible, ces auxiliaires améliorent la productivité et les rendent plus accessibles au grand public. De plus, l'amélioration des auxiliaires ouvre la voie à des disques de stockage amovibles compacts."
 hardware_VIII_desc:0 "Le stockage de données optiques numériques est une forme de stockage de données qui utilise des lasers pour stocker et récupérer des données à partir de supports optiques. Ces lasers sont des faisceaux de faible puissance permettant de lire et d'écrire des données sur un support optique et permettent des éléments tels que des CD qui peuvent stocker beaucoup plus de données que la disquette et permettent un plus grand niveau de transférabilité des données."
 hardware_IX_desc:0 "La modularité des composants est la standardisation des connexions et des communications au sein d'un système permettant aux composants de plusieurs fabricants ou concepteurs de fonctionner conjointement. La modularité des composants permet non seulement aux pièces de plusieurs concepteurs de fonctionner ensemble, mais elle permet également un plus grand niveau de flexibilité ainsi que le remplacement et la mise à niveau faciles des pièces informatiques sans avoir à remplacer l'ensemble du système informatique."
 hardware_X_desc:0 "Le disque dur avancé utilise des têtes magnétorésistives à couche mince sur des disques durs de 2,5 pouces à détection de chocs qui peuvent atteindre environ 7 200 tours par minute et stocker plusieurs Go sur un seul disque. Le disque dur avancé est plus fiable et stocke des niveaux de données nettement plus élevés que jamais, permettant un plus grand niveau d'application commerciale et industrielle."
 hardware_XI_desc:0 "L'unité de traitement graphique (GPU) est un processeur informatique spécialisé dans les calculs mathématiques rapides dans le but de restituer des images et de décharger du processeur les tâches gourmandes en graphiques telles que la CAO afin de libérer la puissance de traitement du processeur. Le GPU agit effectivement comme un processeur supplémentaire avec une tâche spécialisée optimisée dans un seul but avec une architecture de traitement parallèle lui permettant d'effectuer plusieurs calculs en même temps. Cependant, le processeur nécessite plusieurs processeurs pour effectuer des calculs en parallèle, mais sa vitesse d'horloge est supérieure à celle du GPU. "
 hardware_XII_desc:0 "Les auxiliaires modernes tels que les claviers discrets, la souris optique, le bloc à dessin ou les appareils de son surround sont conçus pour être ergonomiques et réactifs à l'utilisateur. Les auxiliaires modernes peuvent également être dotés de fonctionnalités personnalisées telles que des boutons de souris supplémentaires configurables. Le développement de ces auxiliaires améliorera la productivité et permettra d'effectuer des tâches plus précises dans les domaines de l'industrie, du commerce, de l'armée et des consommateurs. "
 hardware_XIII_desc:0 "Le stockage flash (SSD) est une forme de stockage de données optique qui n'utilise aucune pièce mobile. Les disques SSD utilisent la mémoire flash pour conserver les données stockées dans de petites unités appelées blocs stockés sur une puce de mémoire flash. Le stockage Flash est nettement meilleur que le stockage sur disque car il est plus fiable car il ne comporte aucune pièce mobile et lit/écrit beaucoup plus rapidement qu'un disque dur. De plus, les périphériques de stockage flash sont beaucoup plus compacts et consomment moins d'énergie. Les disques SSD sont particulièrement utiles à des fins militaires car ils offrent une meilleure protection des données, sont moins sujets aux dommages dus aux mouvements, peuvent accéder aux données plus rapidement et sont plus économes en énergie."
 hardware_XIV_desc:0 "Interface de contrôleur hôte de mémoire non volatile"
 hardware_XV_desc:0 ""
 hardware_XVI_desc:0 ""
 hardware_stfu_tt:0 "§YDébloque plus de types d'armes§!"

 #Software
 software_I:0 "Première théorie informatique"
 software_II:0 "Langages de programmation binaire"
 software_III:0 "Langages de programmation de haut niveau"
 software_IV:0 "L'algorithme de tri rapide"
 software_V:0 "Réseau de commutation de paquets"
 software_VI:0 "Dynamique des fluides computationnelle"
 software_VII:0 "Supercalcul massivement parallèle"
 software_VIII:0 "Système d'exploitation à architecture ouverte"
 software_IX:0 "Logiciel de CAO"
 software_X:0 "Informatique 64 bits"
 software_XI:0 "Multi-thread"
 software_XII:0 "Logiciel de logistique militaire"
 software_XIII:0 "logiciel de débogage de 3e génération"
 software_XIV:0 "Informatique en nuage"
 software_XV:0 "Systèmes d'IA"
 software_XVI:0 "Pilotes à haut rendement"
 software_I_desc:0 "Même si l'informatique mécanique a pu jouer un rôle important dès le début en aidant les chercheurs et les ingénieurs avant et pendant la Seconde Guerre mondiale, les besoins complexes d'un monde en pleine croissance ont rendu nécessaire le développement d'ordinateurs au-delà de ce qu'ils pouvaient faire simplement avec des engrenages et des calculs prédéfinis. Les premières théories informatiques ont conduit au développement des premiers ordinateurs électroniques qui remplissaient plus ou moins le même rôle avec une capacité similaire à celle des ordinateurs mécaniques, mais d'une manière qui leur permettait d'assumer des tâches beaucoup plus importantes et de donner naissance aux premiers grands ordinateurs."
 software_II_desc:0 "La programmation prédéfinie des premiers ordinateurs laissait beaucoup à désirer et permettait uniquement aux ordinateurs d'effectuer des tâches très spécifiques avec des programmes laborieusement assemblés. Les langages de programmation binaires permettaient aux ordinateurs d'effectuer une plus grande diversité de tâches et permettraient également un plus grand niveau d'accessibilité informatique."
 software_III_desc:0 "Un langage de programmation de haut niveau est un langage de programmation qui fait abstraction des détails binaires du traitement informatique lui-même. Ils lisent le langage naturel (IE add_research_slot = 50) et le transforment en un élément traitable. Cela leur permet d'être programmés à un niveau macro sans qu'il soit nécessaire d'attribuer individuellement des éléments non abstraits aux données de traitement. "
 software_IV_desc:0 "L'algorithme de tri rapide est un algorithme de tri efficace développé par Tony Hoare en 1959 qui place systématiquement les éléments dans un tableau organisé. Il est utilisé pour trier les données dans un ordinateur et a surpassé les algorithmes de tri antérieurs tels que le tri par fusion et le tri par tas. Le tri est un processus extrêmement courant effectué dans les logiciels informatiques et, en tant que tel, doit être très efficace et un algorithme de tri mal créé peut entraîner des charges de traitement inutilement importantes. Le tri rapide est encore utilisé aujourd'hui parce que c'est tout simplement génial."
 software_V_desc:0 "La commutation de paquets est une méthode permettant de regrouper des données numériques et de les transmettre sur un réseau numérique. Ils sont dirigés par un en-tête et les données elles-mêmes se trouvent dans la charge utile qui suit l'en-tête. L'en-tête navigue dans un réseau en fonction des données qui y sont placées. Cela permet aux données de naviguer dans des réseaux très complexes où il y a plusieurs hôtes à atteindre et différents noeuds de données entre lesquels voyager. Cependant, quelques problèmes tels que la perte de paquets affectent les réseaux à commutation de paquets. La transmission sans fil (non disponible au moment de nos recherches) et la congestion du réseau peuvent empêcher les paquets d'atteindre leur destination et être perdus. Le Transmission Control Protocol est un protocole Internet qui garantit un transfert de données précis et détecte la perte de paquets afin de pouvoir réessayer ou corriger les erreurs."
 software_VI_desc:0 "La dynamique numérique des fluides (CFD) fait partie de la mécanique des fluides qui utilise l'analyse numérique pour résoudre des problèmes d'écoulement des fluides. Ce logiciel permet aux ordinateurs de simuler l'écoulement libre de liquides et de gaz. Ce logiciel très complexe bénéficie grandement d'ordinateurs puissants et peut permettre aux ingénieurs de simuler de nombreux problèmes différents impliquant l'aérodynamique, les fluides, la météo, etc. Les problèmes CFD reposent fondamentalement sur les équations de Navier-Stokes qui définissent les écoulements de fluides monophasés."
 software_VII_desc:0 "Finalement, des supercalculateurs modulaires et massivement parallèles à grande échelle sont devenus possibles. Grâce à des améliorations de conception et à de meilleurs domaines administratifs et protocoles internes, les supercalculateurs massivement parallèles pourraient devenir de grande taille. Ces supercalculateurs peuvent être utilisés pour stocker ou sauvegarder plus de données qu'auparavant et traiter plus de données que les premiers modèles. Parce qu'ils ont tellement de valeur et d'utilité confinés dans un seul espace, ces superordinateurs sont généralement conservés sous terre sous une sécurité extrême, le personnel hautement qualifié étant le seul autorisé à travailler physiquement dessus. "
 software_VIII_desc:0 "L'architecture ouverte est un type d'architecture logicielle qui permet un échange, une installation et une mise à jour faciles de logiciels. Disposer d'un système informatique domestique à architecture ouverte permet à un grand nombre de systèmes de s'adapter librement à tout nouveau type de logiciel pouvant être développé sur son système d'exploitation. "
 software_IX_desc:0 "Le dessin assisté par ordinateur (CAO) est l'utilisation de systèmes informatiques pour aider à la création d'un dessin. Les logiciels de CAO facilitent grandement la conception et améliorent considérablement la productivité et la qualité. Il peut également fournir des bases de données faciles d'accès, des outils de communication, des macros et d'autres boîtes à outils pour faciliter davantage le processus de conception. Les logiciels de CAO peuvent être utilisés pour concevoir de nombreuses choses différentes, notamment des machines, l'architecture, l'électronique, etc. Avec la fabrication assistée par ordinateur, la CAO peut directement permettre aux machines de réaliser des conceptions avec une précision et une efficacité extrêmes."
 software_X_desc:0 "l'informatique 64 bits est l'utilisation d'une architecture 64 bits dans les ordinateurs. Chaque 1 ou 0 dans un langage binaire occupe 1 bit. Dans l'architecture 64 bits, 64 bits sont disposés en une seule adresse mémoire, qui fait référence à un emplacement mémoire spécifique utilisé aux niveaux logiciel et matériel. Ce qui rend le 64 bits spécial, c'est que les ordinateurs 64 bits ont une limite entière de 9 223 372 036 854 775 807, alors que les systèmes 32 bits sont plafonnés à environ 2,147 milliards. Cela permet à un système de stocker et de traiter beaucoup plus de variables uniques que jamais auparavant. Il existe aujourd'hui des programmes plus simples qui utilisent encore le 32 bits, mais de nombreux logiciels doivent utiliser une architecture 64 bits en raison de leur grande complexité."
 software_XI_desc:0 "Le multithreading est la capacité d'un processeur à fournir plusieurs threads d'exécution simultanément. Le multithreading a augmenté l'utilisation d'un seul coeur en utilisant le parallélisme au niveau des threads et le parallélisme au niveau des instructions. Cela permet un plus grand niveau de flexibilité lors du multitâche, qu'un seul coeur ou plusieurs coeurs soient utilisés.\nAlors que le multithreading simultané existe depuis 1968 et déployé quelques années plus tard, cette technologie représente l'optimisation des protocoles multithreading et l'introduction de protocoles pour se protéger contre plusieurs threads partageant des ressources matérielles telles que les caches et un haut niveau d'efficacité."
 software_XII_desc:0 "Le développement de logiciels de logistique militaire facilite une grande partie du travail de l'état-major militaire et permet un plus grand niveau de fiabilité dans les grands réseaux logistiques militaires et l'organisation de chaînes d'approvisionnement complexes à grande échelle. Ce logiciel peut permettre aux agents d'approvisionnement de passer des commandes numériquement et améliore la communication sur des réseaux complexes. De plus, ce logiciel peut faciliter le tri et la priorisation des approvisionnements et aider à localiser automatiquement les anomalies dans les lignes d'approvisionnement."
 software_XIII_desc:0 "La 3ème génération de logiciels de débogage logiciel présente de nombreuses améliorations par rapport aux générations précédentes. La 3ème génération présente quelques avantages par rapport aux générations précédentes, notamment l'évaluation de l'optimisation et le débogage proactif de la mémoire qui peuvent détecter activement les bogues de corruption de la mémoire et repérer les processus qui utilisent des quantités anormales de ressources système. Ce logiciel ouvrira la voie au développement de programmes beaucoup plus complexes et facilitera grandement le développement de logiciels."
 software_XIV_desc:0 ""
 software_XV_desc:0 ""
 software_XVI_desc:0 ""

 #Radar
 radar_0:0 "Radar impulsion-Doppler"
 radar_I:0 "Radar monopulse"
 radar_II:0 "Affûtage du faisceau Doppler"
 radar_III:0 "Radar au-dessus de l'horizon"
 radar_IV:0 "POIDS"
 radar_V:0 "AESA"
 radar_VI:0 "RADAR à faible probabilité d'interception"
 radar_VII:0 "Technologie radar anti-brouillage"
 radar_0_desc:0 "Tout au long de la Seconde Guerre mondiale, de nombreux progrès ont été réalisés en matière de radar. Au début, le radar utilisait simplement une détection radio qui était très rudimentaire et inefficace. Cela a finalement été affiné pour créer un radar décimétrique, capable de détecter les avions arrivant de plus loin et de le faire avec plus de précision. Finalement, le radar décimétrique a été allongé au centimétrique pour permettre une détection radar à longue portée. Afin d'allonger les ondes radar, des améliorations significatives de la résistance du magnétron à cavité sont apportées. Le magnétron à cavité est un tube à vide de grande puissance utilisé pour générer des micro-ondes et les transformer en ondes radio. Il était plus solide que jamais et pouvait créer des faisceaux centimétriques très puissants."
 radar_I_desc:0 "Le radar monopulse est un système radar qui code son signal radio à différents niveaux. Ainsi, lorsque le faisceau rebondit, il fournit des données très précises basées sur le retour des différentes impulsions. Parce que le signal radio utilise un codage supplémentaire, il est capable d'émettre une seule impulsion pour des données précises, d'où le nom « monopulse »."
 radar_II_desc:0 "L'affinage du faisceau Doppler est une méthode de traitement des signaux radar en une image radar. Grâce à une ouverture synthétique, le mouvement de l'antenne radar offre une résolution spatiale plus fine que celle des radars à balayage de faisceau conventionnels. SAR définit un tableau 3D d'éléments de scène en utilisant les retours du faisceau. Avec ce réseau, SAR exécute des algorithmes et des calculs pour déterminer une image précise de tout ce qu'il scanne."
 radar_III_desc:0 "Le radar au-dessus de l'horizon, également appelé Skywave Radar, est un radar qui transmet un puissant signal à ondes courtes qui s'étend au-delà de l'horizon en se réfléchissant sur l'ionosphère dans le ciel pour toucher le sol au-dessus de l'horizon, puis revenir vers le ciel et les antennes radar. Cela permet à OtH de détecter des cibles derrière des obstacles et sur des distances extrêmement longues."
 radar_IV_desc:0 "PAVE PAWS est un système radar à réseau phasé à semi-conducteurs très élaboré développé pour détecter et caractériser les attaques de missiles balistiques. PAVE PAWS a été créé à l'origine aux États-Unis pour répondre aux attaques de missiles balistiques lancés sous-marins et comprend des réseaux massifs d'éléments dipolaires croisés qui offrent des niveaux incroyables de couverture de détail élevée."
 radar_V_desc:0 "AESA est optimisé pour rechercher, marquer et surveiller les avions dans une zone et communiquer sur un vaste réseau pour maintenir la vigilance sur une vaste zone."
 radar_VI_desc:0 ""
 radar_VII_desc:0 ""

 #Encryption
 enc_I:0 "Système de cryptage électronique"
 enc_II:0 "Système de cryptage électronique amélioré"
 enc_III:0 "Cryptage DES 56 bits"
 enc_IV:0 "Le pare-feu"
 enc_V:0 "Logiciel antivirus"
 enc_VI:0 "Systèmes de détection et de prévention des intrusions"
 enc_VII:0 "Procurations"
 enc_VIII:0 "Cryptage résistant aux quantiques"
 enc_IX:0 "Algorithmes d'autodéfense active"
 enc_IX_short:0 "Algorithmes TSA"
 enc_I_desc:0 "Avec la création des communications électroniques, il a toujours été nécessaire de chiffrer électroniquement les messages et de les déchiffrer. Le premier système de cryptage électronique, le KW-26, a été créé. Il utilisait plus de 800 coeurs et 50 circuits pilotes de tubes à vide pour créer des messages cryptés à l'aide d'une logique à noyau magnétique. Le système de cryptage numérique lui a permis de créer des messages plus cryptés que jamais."
 enc_II_desc:0 "Afin de mieux chiffrer les informations, de nombreuses améliorations du système de chiffrement électronique doivent être apportées. Davantage de combinaisons doivent être ajoutées pour éviter que la machine n'utilise la même carte plusieurs fois. Des mesures supplémentaires doivent être prises pour empêcher l'accès à la machine. D'autres couches doivent également être ajoutées aux messages cryptés."
 enc_III_desc:0 "DES est la première norme de cryptage publique créée. Le DES a été créé en 1975 par IBM. DES est un algorithme à clé systémique, ce qui signifie qu'il utilise la même clé pour le cryptage et le déchiffrement. Tant que la clé reste secrète entre les 2 parties, le cryptage est hautement sécurisé. Si la clé est devinée grâce à une attaque par force brute longue et fastidieuse, ou si la clé est volée rapidement via un logiciel malveillant, les messages peuvent alors être déchiffrés. DES est hautement sécurisé contre la cryptanalyse différentielle car les clés de chiffrement sont gardées secrètes et uniques, mais est vulnérable au craquage par force brute."
 enc_IV_desc:0 "Le pare-feu est un système de sécurité réseau qui surveille et contrôle le trafic réseau entrant et sortant en fonction de règles de sécurité. Les pare-feu peuvent empêcher efficacement les logiciels malveillants qui ont infecté un système de soumettre des informations hors du système ou empêcher tout accès non autorisé à un système. "
 enc_V_desc:0 "Avec l'avènement des logiciels malveillants, il est nécessaire d'adopter une approche dynamique de protection contre la vulnérabilité générale. Bien que les vulnérabilités puissent être corrigées, la guerre froide sans fin entre vulnérabilités et exploits place le chiffreur dans une situation sérieusement désavantageuse. Antivirus dynamiques conçus pour bloquer directement les signatures de logiciels malveillants connus ou bloquer de manière heuristique les activités logicielles suspectes. Cela permet aux défenses de garder une longueur d'avance sur les menaces en créant des antivirus et des anti-malwares plus avancés."
 enc_VI_desc:0 "Il ne suffit pas de lutter simplement de manière réactive contre les virus et les signatures malveillantes connues. À mesure que les logiciels deviennent omniprésents et que le monde devient de plus en plus interconnecté, les dangers continuent d'augmenter. Les logiciels heuristiques anti-malware sont proactifs et peuvent tenter de rechercher une activité malveillante sur un ordinateur et de réagir aux failles de sécurité sans connaissance préalable des fonctions du programme malveillant. "
 enc_VII_desc:0 ""
 enc_VIII_desc:0 "NEIGE"

 #Decryption
 decryption_I:0 "Décryptage électronique"
 decryption_II:0 "Analyse différentielle"
 decryption_III:0 "Décryptage par force brute"
 decryption_IV:0 "Piratage à distance"
 decryption_V:0 "Logiciels malveillants/spywares"
 decryption_VI:0 "Kits d'exploitation"
 decryption_VII:0 "Syn Inondation"
 decryption_VIII:0 "Décryptage quantique"
 decryption_IX:0 "Algorithmes actifs de violation de logique profonde"
 decryption_IX_short:0 "Algorithmes de violation de l'ADL"
 decryption_I_desc:0 "Même si les premiers systèmes de cryptage électronique étaient plus complexes que jamais, ils pouvaient être vaincus. Si une clé était réutilisée, les messages chiffrés à deux flux pourraient être comparés et déchiffrés en identifiant automatiquement la logique de la machine via une attaque par clé réutilisée. Le retournement de bits est une autre attaque qui repose sur la connaissance préalable d'une partie d'un message. Si les messages cryptés suivent un certain format, il est alors facile d'utiliser les informations connues comme base. "
 decryption_II_desc:0 "La cryptanalyse différentielle est une méthode d'attaque dans laquelle des paires de texte clair et de texte chiffré sont utilisées abusivement dans un système cryptologique afin de découvrir une clé. Cela nécessite l'accès aux entrées et sorties de texte brut et de texte chiffré. En saisissant divers messages et en les comparant au texte crypté, la clé de cryptage peut être découverte et utilisée avec les informations cryptées souhaitées."
 decryption_III_desc:0 "La force brute, comme son nom l'indique, est une méthode de décryptage extrêmement simpliste et directe. En essayant simplement toutes les solutions ou clés possibles jusqu'à ce que vous arriviez à une solution dotée d'une immense puissance de traitement, un message crypté peut être déchiffré. Il peut être utilisé sur pratiquement tous les systèmes cryptographiques, à condition qu'une puissance de traitement suffisante soit disponible. Cependant, à mesure que le chiffrement devient plus avancé, cela peut éventuellement devenir irréalisable, car des niveaux de chiffrement plus élevés peuvent nécessiter une puissance de traitement supérieure à celle raisonnablement disponible. "
 decryption_IV_desc:0 "Le piratage a de nombreuses définitions, mais il fait ici référence à l'obtention d'un accès non autorisé à un système informatique via l'utilisation d'un logiciel. L'accès à distance aux systèmes en exploitant les vulnérabilités des logiciels peut permettre à un pirate informatique de compromettre un réseau et d'accéder, de détruire ou de manipuler des données au sein d'un réseau protégé."
 decryption_V_desc:0 "Un logiciel malveillant est un programme malveillant et un logiciel espion est un programme qui collecte involontairement des informations auprès d'un hôte. \nBien qu'il soit utile de tenter de collecter indirectement des informations auprès d'un hôte via le décryptage des messages, cela devient impossible à mesure que la cryptographie moderne devient trop avancée. Au lieu de cela, il est souhaitable de prendre des mesures pour pirater les vulnérabilités des logiciels à distance afin d'accéder directement aux informations non cryptées. De plus, la création de logiciels malveillants ou de logiciels espions pour infecter un hôte via des vulnérabilités ou des pièges peut ouvrir des portes dérobées d'elle-même. "
 decryption_VI_desc:0 "Un kit d'exploit est un ensemble d'exploits pour les vulnérabilités organisés dans un catalogue massif agissant comme un référentiel. Les kits d'exploitation contiennent un grand nombre d'exploits pour pratiquement toutes les vulnérabilités dans pratiquement toutes les versions de pratiquement tous les logiciels ciblés par le créateur d'un kit d'exploitation. Cela permet à un créateur de malware ou à un pirate informatique de simplement créer le malware de son choix et d'y associer un exploit fonctionnel. Tout ce qu'un créateur de malware a besoin de savoir, c'est le logiciel et les versions d'un logiciel utilisé par un ordinateur cible et il peut parcourir le kit d'exploitation. Si les créateurs du kit d'exploit ont trouvé une vulnérabilité et réalisé l'exploit, le créateur du malware n'a qu'à l'accrocher et à y exposer l'ordinateur cible. Les kits appartenant au gouvernement peuvent garder les vulnérabilités secrètes pendant des années jusqu'à ce qu'ils souhaitent lancer une attaque massive."
 decryption_VII_desc:0 ""
 decryption_VIII_desc:0 ""

