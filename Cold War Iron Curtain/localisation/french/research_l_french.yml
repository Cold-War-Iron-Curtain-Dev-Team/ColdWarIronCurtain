 #SRAAM

 aam_short_range_0:0 "Missile air-air à faisceau radar"
 aam_short_range_0_short:0 "Faisceau radar"
 aam_short_range_0_desc:0 "Les premiers missiles air-air pratiques utilisaient un faisceau radar pour trouver leurs cibles. Le missile utilise un récepteur monté sur la queue pour voler au centre d'un faisceau radio dirigé vers la cible par l'avion lanceur."
 aam_short_range_1:0 "Missile air-air réticule IR"
 aam_short_range_1_short:0 "Réticule IR"
 aam_short_range_1_desc:0 "Réticule Les autodirecteurs infrarouges utilisent un réticule rotatif à fente devant un détecteur monocanal pour identifier la position angulaire de la cible par rapport au missile. Le missile peut ensuite être piloté jusqu'à l'impact en utilisant une loi de guidage telle que la navigation proportionnelle. Cependant, les premiers détecteurs IR ne peuvent se verrouiller que sur les gaz d'échappement des moteurs et doivent être déclenchés depuis l'arrière, ce qui limite leur efficacité."
 aam_short_range_2:0 "Missile air-air IR tous aspects"
 aam_short_range_2_short:0 "IR tous aspects"
 aam_short_range_2_desc:0 "Les progrès de la technologie des détecteurs à semi-conducteurs IR refroidis permettent aux autodirecteurs IR d'identifier les avions cibles sous tous les angles, et pas seulement par l'arrière."
 aam_short_range_3:0 "Missile air-air à réseau focal infrarouge"
 aam_short_range_3_short:0 "Réseau de plans focaux IR"
 aam_short_range_3_desc:0 "Les réseaux à plan focal infrarouge remplacent les chercheurs infrarouges à canal unique par des détecteurs qui se rapprochent davantage d'une caméra. Au lieu d'utiliser un seul pixel et un réticule rotatif pour identifier la position angulaire d'une cible, une FPA est une caméra thermique grand angle capable d'identifier des cibles en fonction de leur forme, de leur taille et de leurs caractéristiques de performance. Les autodirecteurs basés sur FPA offrent une portée améliorée et une résistance aux contre-mesures."
 aam_short_range_4:0 "Missile air-air à haut viseur"
 aam_short_range_4_short:0 "Point de visée élevé"
 aam_short_range_4_desc:0 "Les missiles à viseur élevé peuvent être dirigés vers la cible avant le lancement à l'aide d'un viseur monté sur casque, évitant ainsi que l'avion de lancement soit pointé vers la cible. Une fois lancé, le missile utilise un système de navigation inertielle embarqué pour se tourner vers la direction indiquée, puis acquiert la cible une fois sur sa trajectoire."
 aam_short_range_5:0 "Missile air-air IR lié aux données"
 aam_short_range_5_short:0 "Liaisons de données"
 aam_short_range_5_desc:0 "L'ajout de liaisons de données étend davantage la portée des missiles air-air infrarouges, leur permettant d'engager des cibles qui ne se trouvent pas actuellement à l'intérieur de leur enveloppe cible en fournissant un guidage basé sur d'autres capteurs jusqu'à ce que l'autodirecteur embarqué puisse acquérir la cible."

 #LRAAM

 aam_long_range_0:0 "Missile air-air à guidage radar semi-actif à balayage conique"
 aam_long_range_0_short:0 "Radar semi-actif"
 aam_long_range_0_desc:0 "Les missiles radar semi-actifs à tête chercheuse dirigés vers les échos radar de l'avion de lancement ont rebondi sur la cible. En conjonction avec un autodirecteur à balayage conique, le missile peut calculer la vitesse angulaire relative et la direction à diriger pour atteindre la cible."
 aam_long_range_1:0 "Premier missile air-air radar actif"
 aam_long_range_1_short:0 "Radar actif précoce"
 aam_long_range_1_desc:0 "Le guidage radar actif place un ensemble radar complet sur le missile, suivant la cible à l'aide des propres émissions radar du missile. Cependant, les premiers systèmes de guidage radar actifs étaient volumineux et gourmands en énergie, les reléguant uniquement aux plus gros missiles."
 aam_long_range_2:0 "Missile air-air semi-actif monopulse inversé"
 aam_long_range_2_short:0 "SARH monopulse inverse"
 aam_long_range_2_desc:0 "Les autodirecteurs Inverse Monopulse remplacent l'autodirecteur conique en rotation des premiers missiles SARH par une approche de radiogoniométrie basée sur la polarisation différentielle de deux échos radar. En transmettant deux signaux à la fois depuis le radar d'éclairage à deux polarisations différentes, la position angulaire de la cible par rapport à l'autodirecteur peut être déterminée de manière unique. De plus, les retours au sol peuvent être filtrés, permettant ainsi des engagements d'observation et d'abattage."
 aam_long_range_3:0 "Missile air-air moderne à guidage radar actif"
 aam_long_range_3_short:0 "Radar actif moderne"
 aam_long_range_3_desc:0 "Les progrès des circuits intégrés micro-ondes permettent de miniaturiser les autodirecteurs radar actifs dans des enveloppes de missiles traditionnellement à moyenne portée. À son tour, cela permet aux avions de lancement de tirer leurs missiles et de s'éloigner de la cible, plutôt que d'avoir à fournir un éclairage continu comme avec SARH."
 aam_long_range_4:0 "Missile air-air à fusée à conduit variable"
 aam_long_range_4_short:0 "Fusée à conduit variable"
 aam_long_range_4_desc:0 "Les fusées à conduits variables sont un mélange de fusées traditionnelles et de statoréacteurs. Un moteur-fusée à solide à valve produit des gaz d'échappement riches en carburant qui sont ensuite introduits dans une cavité de combustion alimentée par le flux d'air extérieur. En ajustant la valve, le débit de carburant et donc la poussée peuvent être modulés, offrant une meilleure capacité d'impulsion spécifique et de formation de trajectoire par rapport aux fusées traditionnelles."

