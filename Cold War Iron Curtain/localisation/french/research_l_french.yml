 ##Cwic Helicopters

 helicopter:0 "Hélicoptères"

 early_helicopter:0 "Premières applications d'hélicoptères"
 early_helicopter_short:0 "Début de l'hélicoptère "
 early_helicopter_desc:0 "Un hélicoptère est un type de giravion dans lequel la portance et la poussée sont fournies par des rotors tournant horizontalement. Cela permet à l'hélicoptère de décoller et d'atterrir verticalement, de planer et de voler vers l'avant, vers l'arrière et latéralement. Ces attributs permettent aux hélicoptères d'être utilisés dans des zones encombrées ou isolées où les aéronefs à voilure fixe et de nombreuses formes d'avions STOL (Short TakeOff and Landing) ou STOVL (Short TakeOff and Vertical Landing) ne peuvent pas fonctionner sans piste."

