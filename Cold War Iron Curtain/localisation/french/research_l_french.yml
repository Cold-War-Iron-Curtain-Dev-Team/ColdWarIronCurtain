 air_doctrine_systemic:0 "Initiative stratégique systémique"
 air_doctrine_systemic_desc:0 "Cette doctrine vise à améliorer la capacité stratégique de l'armée de l'air et sa capacité à bombarder les cibles ennemies. En renforçant les capacités destructrices des bombardiers et en améliorant leur capacité de survie, ils peuvent mener des missions à haut risque sans accès à la supériorité dans des situations difficiles ou faire pleuvoir l'enfer avec supériorité."

