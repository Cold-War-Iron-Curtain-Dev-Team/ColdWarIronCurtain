 inframanagement_I_desc:0 "L'urbanisme est le processus de planification de l'expansion ou de l'amélioration d'un environnement urbain. Implique une gestion minutieuse et des systèmes conçus pour séparer les spécialisations du bâtiment en résidences, commerce, industrie ou tout hybride de ce qui précède. L'urbanisme cherche à placer les bâtiments dans une zone où ils peuvent fonctionner le plus efficacement les uns par rapport aux autres et à fournir une infrastructure spécialisée pour soutenir les entreprises de cette zone.\nCette technologie représente les systèmes de planification urbaine fondamentaux d'après-guerre qui s'adaptent aux besoins de l'industrie moderne qui vont au-delà des systèmes de planification urbaine de base de l'ère industrielle. Facilite grandement les futures expansions des infrastructures."
 inframanagement_II_desc:0 "Des équipements modernes de construction d'infrastructures sont nécessaires pour construire les réseaux d'infrastructures de plus en plus complexes de l'ère atomique. Des systèmes hydrauliques à haute résistance, des grattoirs élévateurs, des bulldozers hydrauliques, des poseurs de canalisations, des fraiseuses hydrauliques de chaussée et d'innombrables autres véhicules lourds sont nécessaires pour construire les infrastructures de l'ère atomique dans des délais raisonnables. De manière générale, cette technologie signifie s'éloigner des systèmes centrés sur les câbles et se tourner vers l'hydraulique."
 inframanagement_III_desc:0 "Outre la planification urbaine, la planification spécifique des espaces industriels et leur organisation de manière à ce qu'il soit facile pour toutes les industries d'une zone d'opérer, de stocker des marchandises et de recevoir des livraisons peuvent grandement améliorer la construction d'infrastructures industrielles et améliorer le débit industriel. La planification spécifique des espaces pour les infrastructures industrielles actuelles et futures ouvre la voie à des améliorations et à des extensions faciles des espaces industriels."
 inframanagement_IV_desc:0 "Une amélioration générale de la gestion des infrastructures. Implique la mise en oeuvre de meilleures techniques de gestion et d'organisation, l'augmentation du nombre de classifications de routes et l'amélioration des systèmes et des protocoles d'utilisation des trajets. Ces améliorations organisationnelles sont généralement prises en compte afin que les urbanistes puissent mieux utiliser le terrain et faciliter les améliorations/maintenance."
 inframanagement_V_desc:0 "Les matériaux routiers durables et robustes réduisent les coûts de construction et d'entretien des routes et sont également importants pour pouvoir résister au poids d'un trafic industriel intense. De plus, les matériaux routiers durables sont plus faciles à recycler après avoir été broyés, réduisant ainsi encore davantage les coûts d'entretien et de construction. La réduction du temps et des coûts de construction et d'entretien signifie que les équipes de construction et les agents publics peuvent consacrer plus de temps à étendre les infrastructures existantes ou, à tout le moins, passer moins de temps à travailler, ce qui est pour le moins bienvenu."
 inframanagement_VI_desc:0 "L'amélioration de la maintenance des infrastructures grâce à de meilleures procédures et équipements facilite la maintenance et la construction de grandes quantités d'infrastructures. Comprend des avancées en matière d'équipement telles que des commandes ergonomiques, des équipements à grande vitesse, des moteurs modernes de haute puissance, des équipements hybrides polyvalents, l'intégration de l'électronique et un système hydraulique moderne. Les améliorations procédurales impliquent une meilleure planification des réparations et une surveillance à distance."
 inframanagement_VII_desc:0 ""
 inframanagement_VIII_desc:0 "Initiatives visant à améliorer la situation sociale du mode de vie urbain. De nombreux problèmes psychologiques et sociaux peuvent surgir lors du développement d'une ville. Les communautés isolées, le manque d'engagement, les problèmes des jeunes, les gangs, les mauvaises relations avec la police qui peuvent résulter d'abus de pouvoir ou d'autres causes, et d'autres situations peuvent être abordées grâce à des initiatives sociales visant à résoudre les problèmes sociaux auxquels ces communautés sont confrontées. Même sans problèmes en suspens, les initiatives sociales peuvent améliorer des communautés déjà bien établies et s'attaquer de manière préventive aux problèmes avant qu'ils ne deviennent un problème. Davantage de régénération et de rénovation des bâtiments pour une meilleure conservation de l'énergie et de l'eau, le contrôle des friches industrielles (sites abandonnés qui présentent des problèmes de contamination), une meilleure gestion des déchets et une variété d'autres améliorations qui favorisent la durabilité."
 infrastate_I:0 "Chemins de fer modernes"
 infrastate_II:0 "Autoroutes artérielles"
 infrastate_III:0 "Infrastructure pour situations particulières"
 infrastate_IV:0 "Chemins de fer à grande vitesse"
 infrastate_V:0 "Autoroutes industrielles à accès contrôlé"
 infrastate_VI:0 "Rails MAGLEV"
 infrastate_VII:0 "Vactrain/Autoroutes intelligentes"
 infrastate_I_desc:0 "La propulsion diesel-électrique, les systèmes hydrauliques d'après-guerre et les systèmes d'infrastructure ferroviaire de grande capacité améliorent considérablement la puissance et l'efficacité des chemins de fer. Les moteurs diesel-électriques utilisent des moteurs diesel pour entraîner un générateur à courant continu ou alternatif afin d'alimenter le moteur de traction et d'augmenter la vitesse et le rendement énergétique des trains. De plus, l'amélioration des chemins de fer avec des équipements ferroviaires optimisés pour le chargement et le déchargement rapides des trains minimise le temps que les trains sur les lignes très fréquentées doivent passer en gare et leur permet d'en faire plus."
 infrastate_II_desc:0 "Les autoroutes artérielles sont des autoroutes à accès contrôlé exceptionnellement larges, conçues pour la circulation de véhicules à grande vitesse et permettant au trafic industriel, commercial, civil ou gouvernemental de traverser de vastes étendues de terrain. Les autoroutes artérielles permettent aux routes à circulation à grande capacité d'acheminer le trafic vers elles via des routes collectrices qui permettent au trafic d'accélérer et de rejoindre ou de quitter les autoroutes artérielles. Une planification et des calculs appropriés sont cruciaux, car les autoroutes artérielles qui n'accordent pas suffisamment d'espace pour les routes collectrices peuvent entraîner des problèmes de sécurité, tandis que des routes collectrices trop grandes peuvent simplement gaspiller de l'espace et de l'argent et, en raison de leur nature et de leur utilisation intensive, entraîner des problèmes d'entretien."
 infrastate_III_desc:0 "Les catastrophes, les guerres, les situations d'urgence et d'innombrables autres problèmes peuvent attirer des renforts de service de loin. La création d'une infrastructure à accès limité peut permettre à la police, aux pompiers, aux catastrophes, aux militaires ou à d'autres services de réagir plus rapidement aux situations sans avoir à rivaliser directement avec un trafic civil potentiellement paniqué. Les infrastructures destinées aux situations spéciales peuvent permettre aux renforts de police d'arriver plus rapidement dans d'autres villes, aux services d'incendie ou de catastrophe de réagir plus rapidement et à l'amélioration de l'approvisionnement militaire, entre autres améliorations. De plus, cette infrastructure peut généralement être utilisée par tout le trafic gouvernemental pour tout ce que le gouvernement juge nécessaire."
 infrastate_IV_desc:0 "Le train à grande vitesse (HSR) fonctionne beaucoup plus rapidement que les chemins de fer traditionnels. HSR utilise un système intégré de matériel roulant spécialisé et de voies dédiées pour parcourir plus de 200 kilomètres par heure (120 mph). Communément appelés trains à grande vitesse, les chemins de fer à grande vitesse permettent aux industries d'effectuer des livraisons en peu de temps sur de très longues distances ou de transporter des passagers en un temps record pour améliorer la productivité et gérer facilement les livraisons d'urgence ou express sans avoir à recourir à des vols express plus coûteux. De plus, les trains HSR peuvent être plus économes en carburant et même entièrement électriques, ce qui leur permet de réduire la dépendance d'un pays aux combustibles fossiles."
 infrastate_V_desc:0 "En fait, hybrides entre les routes principales et les autoroutes artérielles, les autoroutes industrielles à accès contrôlé sont spécialisées pour répondre aux besoins du trafic industriel et permettent aux RGO ou aux industries d'expédier des produits sur de plus grandes zones sans avoir à partager la voie avec un trafic plus restreint ou des conducteurs moins professionnels. De plus, un trafic plus prévisible minimise les embouteillages causés par des chauffeurs non professionnels irréguliers ou impatients, ce qui permet des délais de livraison plus cohérents."
 infrastate_VI_desc:0 "Les rails MAGLEV (à sustentation magnétique) utilisent des aimants pour repousser et pousser le train hors de la voie et disposent d'un autre ensemble pour faire avancer efficacement le train surélevé, créant ainsi un train sans friction qui peut se déplacer à des vitesses extrêmes sur une ligne entièrement électrifiée. Ils sont extrêmement rapides, silencieux, fluides et disposent d'un système de freinage bien meilleur. Le système MAGLEV est si puissant que la seule limitation pratique des lignes MAGLEV est la sécurité des passagers et du conducteur qu'elle transporte ainsi que la quantité d'énergie qu'elle utilise. Cependant, à l'avenir, des systèmes à distance pourraient être utilisés, dans lesquels la limitation deviendra la vitesse à laquelle l'aimant peut se déplacer et le système pourra stabiliser le train lui-même. "
 infrastate_VII_desc:0 "Les Vactrains sont des lignes MAGLEV qui sont beaucoup plus économes en énergie et peuvent se déplacer à des vitesses beaucoup plus élevées en surmontant la traînée en faisant simplement déplacer le train dans un tunnel sous vide. Afin de profiter des vitesses plus élevées, les vactrains devront être contrôlés à distance et ne contenir aucun passager et être séparés des trains de voyageurs MAGLEV traditionnels qui doivent limiter leur vitesse pour la sécurité des passagers ou simplement fonctionner sur des lignes de tube vactrain séparées à des vitesses plus lentes pour éviter de gêner les vactrains de fret télécommandés.\nLes autoroutes intelligentes sont des systèmes d'autoroute technologiquement avancés qui gèrent et dirigent intelligemment le trafic et peuvent inclure des systèmes électroniques de guidage et de surveillance pour conseiller à la fois la conduite autonome et la conduite manuelle et éviter les embouteillages ou rediriger le trafic pour éviter les accumulations."
 inframunicipal_I:0 "Autoroutes artérielles"
 inframunicipal_II:0 "Artères principales"
 inframunicipal_III:0 "Systèmes de transport en commun avancés"
 inframunicipal_IV:0 "Intersections à haut débit/conception de blocs à flux libre"
 inframunicipal_V:0 "Planification des infrastructures municipales 3D"
 inframunicipal_VI:0 "Système de transport intelligent (STI)"
 inframunicipal_VII:0 "Transport en commun rapide (MRT)/Info Era Transport en commun+Logistique"
 inframunicipal_VIII:0 "Initiatives de transport en commun durable"
 inframunicipal_I_desc:0 "Les autoroutes artérielles sont des systèmes de transport urbains à grande vitesse et de grande capacité destinés à faciliter les déplacements longue distance dans les grandes villes et à améliorer les temps de trajet et la logistique commerciale. Les artères sont dotées de routes collectrices qui alimentent le trafic vers et depuis les artères pour permettre aux véhicules d'accélérer ou de quitter une zone. De plus, les autoroutes profitent grandement aux services d'urgence, qui peuvent parcourir de plus grandes distances en peu de temps, ce qui profite particulièrement aux services d'incendie qui peuvent réagir rapidement aux incendies industriels ou aux incendies généralisés qui mobilisent des ressources de plusieurs stations."
 inframunicipal_II_desc:0 "Les routes nationales sont des routes spécialisées dans le trafic industriel lourd tel que les camions et comportent des voies plus larges et sont construites spécifiquement pour desservir le trafic logistique commercial et industriel lourd. Les artères principales rationalisent la logistique urbaine et permettent aux industries de s'approvisionner mutuellement plus rapidement ou de transporter des marchandises depuis les centres de transit interurbains vers les industries ou le commerce ou vice-versa. Les artères principales peuvent également grandement aider le système postal, car ces routes spécialisées permettent aux installations de post-tri de déplacer plus facilement les livraisons dans la ville selon des horaires cohérents."
 inframunicipal_III_desc:0 "Un large assortiment de différents systèmes de transport en commun et améliorations, les systèmes de transport en commun avancés englobent des améliorations aux systèmes de transport en commun existants ou nouveaux. Les métros à grande vitesse, les bus à grande capacité, les monorails, les ferries et téléphériques modernes, et peut-être même les systèmes de transport en commun expérimentaux, réduisent considérablement les temps de trajet et augmentent considérablement la capacité de déplacement. De plus, les systèmes de transport en commun avancés peuvent créer une boucle de rétroaction dans laquelle un accès meilleur et moins cher aux options de déplacement conduit à moins de trafic, ce qui conduit à des déplacements plus efficaces et à des économies globales sur les transports, ce qui permet plus de revenus et conduit ainsi à davantage de transports en commun, etc., créant une croissance progressive des systèmes de transport en commun."
 inframunicipal_IV_desc:0 "Le fait de disposer d'intersections à haut débit et de blocs de circulation libre réduit considérablement le temps de trajet et réduit les coûts en réduisant le temps aux arrêts et les irrégularités du temps de trajet. Gérer correctement les routes municipales et les établir de manière à diriger la circulation afin d'éviter les intersections réduit les problèmes de circulation en ville et peut également réduire l'utilisation en double. Cela peut également améliorer la productivité et la qualité de vie en réduisant l'accumulation de trafic."
 inframunicipal_V_desc:0 "L'infrastructure municipale 3D est un système très avancé permettant d'augmenter le niveau global de l'espace routier et ferroviaire au sein d'une ville. Il comprend tout, depuis les chemins de fer de fret aériens ou souterrains, les routes nationales souterraines, les zones souterraines, les multiples couches urbaines permettant aux autoroutes souterraines d'économiser de l'espace au-dessus du sol pour le trafic longue distance à grande vitesse, les voies de service souterraines pour les ordures ou les services d'urgence pour couper le trafic urbain aérien difficile à naviguer, entre autres choses. La planification des infrastructures municipales en 3D peut grandement permettre aux urbanistes de surmonter les limitations du terrain et de l'espace et de fournir une solution simple aux questions d'infrastructure difficiles. Cependant, cela est extrêmement coûteux et peut poser des problèmes de navigation, ce qui représente un immense fardeau pour les planificateurs."
 inframunicipal_VI_desc:0 "L'infrastructure urbaine intelligente est un terme général désignant l'infrastructure urbaine de l'ère de l'information. Il comprend des systèmes de navigation avancés, des conceptions intelligentes pour les routes et les chemins de fer, des systèmes de transport en commun de l'ère de l'information qui sont plus rapides, plus efficaces et dotés de plus grandes capacités. L'infrastructure de ville intelligente peut s'interfacer intelligemment avec les systèmes de guidage, permettant aux conducteurs d'éviter le trafic et de les diriger efficacement de manière à éviter de surcharger les routes immédiates, de diriger les services d'urgence beaucoup plus efficacement, d'améliorer les temps de trajet et de réduire le trafic global. "
 inframunicipal_VII_desc:0 "Les systèmes de transport en commun rapide font généralement référence aux systèmes de métro ferroviaire lourd à dénivelés. Dans ce contexte, le MRT fait référence à des métros à grande vitesse et de grande capacité dotés de systèmes ferroviaires séparés qui peuvent se déplacer en continu vers leur destination à grande vitesse jusqu'à leurs points sources. Ces systèmes MRT transportent de plus grands volumes de navetteurs avec des temps de trajet plus courts que les systèmes de transport en commun non rapides. La plupart des systèmes MRT fonctionnent en surface, mais certains sont des lignes souterraines.\nLes transports publics à l'ère de l'information font référence aux nombreux progrès réalisés dans les transports publics à l'ère moderne. Des systèmes de transport en commun et des bus plus confortables, des systèmes de plus grande capacité, des réseaux de transport en commun plus efficaces et de nombreuses autres avancées générales qui impliquent le déploiement généralisé de systèmes ou de véhicules coûteux mais très efficaces."
 inframunicipal_VIII_desc:0 "Les initiatives de transport en commun durable favorisent la durabilité et la rentabilité à long terme des systèmes de transport en commun. Notez que la rentabilité ne signifie pas nécessairement une réduction des dépenses publiques, mais plutôt une réduction des dépenses globales des citoyens de la ville et du coût de la vie. Ces initiatives peuvent impliquer la suppression des tarifs pour encourager l'utilisation des transports en commun afin de réduire la consommation de carburant en ville et les besoins d'entretien des véhicules privés (économisant ainsi de l'argent et améliorant le pouvoir d'achat) ainsi que la promotion de la durabilité environnementale. D'autres initiatives incluent des véhicules économes en carburant et une réduction du gaspillage d'énergie et d'eau dans les infrastructures de transport en commun."

 ####Armor Tree Desc
 arm_sht_desc:0 "Ces monstres sont presque indestructibles, mais leur utilisation est également très limitée."
 arm_ht_desc:0 "Char lourd\n Les chars lourds sont protégés contre presque tous les types d'armes, mais leur utilité est limitée par leur faible mobilité.\n\nVéhicule blindé du génie\n Ces véhicules lourds remplissent des rôles spéciaux tels que le déploiement de ponts, le franchissement d'obstacles et le déplacement de terre pour soutenir les forces mécanisées."
 arm_mt_desc:0 "CCP\n Les chars de combat principaux sont équilibrés entre le blindage et la puissance de feu des chars lourds et la mobilité des chars légers.\n\nArtillerie SP\n L'artillerie automotrice peut infliger des dégâts importants à distance à l'infanterie et aux véhicules légèrement blindés."
 arm_lt_desc:0 "Le blindage des chars légers ne résistera pas aux tirs de canons plus gros, mais il peut protéger contre les armes légères. Les chars légers sont nettement plus mobiles que leurs homologues plus lourds."
 arm_mech_desc:0 "APC\n Les véhicules blindés de transport de troupes offrent une mobilité et une protection améliorées à l'infanterie.\n\nIFV\n Les véhicules de combat d'infanterie sont moins mobiles que les APC, mais apportent des armements et des blindages plus lourds sur le champ de bataille.\n\nAPC aéroporté\n Ces APC spécialisés sont équipés pour un déploiement aéroporté.\n\nTransporteur ATGM\n Les porte-avions ATGM dédiés constituent la solution de l'armée moderne à la menace des MBT. Les missiles sont extrêmement puissants contre les cibles blindées mais leur efficacité anti-infanterie est limitée.\n\nVéhicule de reconnaissance\n Des véhicules petits et agiles conçus pour explorer le terrain et évaluer la composition des forces ennemies. Ils ne sont pas équipés pour le combat en première ligne."
 arm_mot_desc:0 "Camion\n Les camions confèrent à l'infanterie une mobilité stratégique bien plus grande, mais autrement, ils n'apportent aucune valeur de combat directe et significative.\n\nArtillerie de roquettes SP\n Dédiée aux attaques anti-infanterie, l'artillerie roquette inflige très peu de dégâts aux cibles blindées."
 arm_amph_desc:0 "Les transports amphibies font un compromis entre les transports mécanisés légers et lourds, avec une capacité amphibie améliorée."

