 #Agriculture
 industry_agriculture_tt:0 "§G+15%§! §YComplexe Agro-Industriel§! £resources_strip|3 et revenus\n"
 agriculture_I:0 "Chélates"
 agriculture_I_desc:0 "La chélation est la liaison d'ions et de molécules organiques à des ions métalliques. Cela implique de multiples liaisons de coordonnées entre un ligand et un atome métallique central. Les chélates sont très utiles pour fournir des compléments nutritionnels. En agriculture, les chélates sont utilisés pour fabriquer des engrais complexes et fournir des micronutriments importants aux plantes pour améliorer leur santé et leur nutrition. Cela améliore considérablement la production agricole, car les engrais précédents ne parvenaient pas à fournir des micronutriments métalliques aux plantes."
 agriculture_II:0 "Adoption généralisée des pesticides"
 agriculture_II_desc:0 "\n\nLes ravageurs ont souvent causé des problèmes aux agriculteurs lorsqu'ils consomment les récoltes. Diverses méthodes ont été adoptées pour réduire les problèmes de ravageurs, telles que l'installation de clôtures ou l'utilisation de répulsifs aromatiques. Cependant, ces mesures n'ont pas réussi à arrêter tous les ravageurs.\nEn adoptant des poisons qui ont peu d'effet sur les humains mais qui sont mortels pour les insectes nuisibles et en les introduisant à grande échelle, de nombreuses colonies d'insectes vivant à proximité des fermes peuvent être éliminées.\n\n§R Il s'agit d'une bien meilleure alternative au napalming dans la nature, mais elle a été critiquée comme étant loin d'être aussi dure à cuire."
 agriculture_III:0 "Agriculture sans labour"
 agriculture_III_desc:0 "L'agriculture sans labour est une méthode agricole durable dans laquelle le sol n'est ni perturbé ni retourné par le travail du sol. Cela réduit considérablement l'érosion du sol et améliore la durée de vie du sol. Cependant, plusieurs pratiques doivent être adoptées dans cette méthode. Les cultures de couverture doivent contrôler les mauvaises herbes et les champs eux-mêmes doivent être soumis à une rotation. Il faut donc installer des drains pour empêcher la formation de ravines, de ravins rongés par l'eau. Le matériel agricole doit effectuer des semis par semis direct. Les résidus en excès doivent être éliminés régulièrement."
 agriculture_IV:0 "Équipement agricole moderne"
 agriculture_IV_desc:0 ""
 agriculture_V:0 "Suivi des cultures par satellite"
 agriculture_V_desc:0 "Le suivi des cultures par satellite est la surveillance spectrale du développement des cultures. Les détails du développement des cultures sont indexés et introduits dans des données qui peuvent être traitées manuellement ou automatiquement pour permettre une réponse en temps réel aux problèmes de santé des cultures et aux diagnostics."
 agriculture_VI:0 "OGM"
