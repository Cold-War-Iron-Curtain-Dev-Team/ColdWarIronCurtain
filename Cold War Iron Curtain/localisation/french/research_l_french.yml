 #Production efficiency
 production_efficiency_I:0 "Revêtement en poudre"
 production_efficiency_I_desc:0 "Pour éviter la rouille et l'abrasion, le revêtement en poudre est utilisé pour « peindre » les machines industrielles. La poudre est appliquée électrostatiquement puis thermodurcie pour former une couche protectrice. Les revêtements industriels en poudre produisent des revêtements plus épais, plus résistants et plus lisses que les revêtements liquides et durcissent beaucoup plus rapidement. En développant le revêtement en poudre, les équipements et produits métalliques peuvent être mieux protégés contre la rouille et l'abrasion qu'ils ne pourraient l'être avec des peintures traditionnelles."
 production_efficiency_II:0 "Bande transporteuse demi-torsion"
 production_efficiency_II_desc:0 "La demi-torsion est une méthode de création d'un convoyeur mobius (1 objet 3D à surface) en tournant à moitié une extrémité. Il en résulte une durée de vie beaucoup plus longue des bandes transporteuses, car toute la surface de la bande est portée en continu au lieu d'utiliser un côté dans une bande non torsadée. Cela évite les accidents, les casses et réduit le nombre d'accidents et de remplacements nécessaires dans les bandes transporteuses, ce qui rationalise la production et améliore le processus de fabrication."
 production_efficiency_III:0 "Nouvelles méthodes de soudage"
 production_efficiency_III_desc:0 "L'amélioration des méthodes de soudage est une partie importante de la fabrication. La création de nouvelles méthodes et de nouveaux matériaux pour fixer les métaux, de manière plus rentable et plus rapide, réduit les goulots d'étranglement dans la production et augmente la productivité globale tout en réduisant les coûts. De plus, l'amélioration du soudage améliore la qualité et la durabilité des produits et des machines."
 production_efficiency_IV:0 "Moulage au sable Disa"
 production_efficiency_IV_desc:0 "Le moulage au sable est un processus important dans la fabrication et est utilisé pour fabriquer des boîtiers métalliques. Dans le moulage au sable, le sable est utilisé comme matériau de moulage pour les moulages métalliques et s'enlève facilement plutôt que d'utiliser un moulage en métal ou en plastique qui est plus difficile à enlever. C'est pourquoi de nombreux objets métalliques non polis ont une surface rugueuse. Cependant, la formation de moules en sable peut être un processus long. La méthode Disa Sand Moulding est un processus automatisé et rapide permettant de créer de grands volumes de moules en sable destinés à la fabrication."
 production_efficiency_V:0 "Bande transporteuse entièrement en plastique"
 production_efficiency_V_desc:0 "À mesure que les matières plastiques progressent, leurs applications s'étendent. Les plastiques plus résistants et plus durables permettent de créer des bandes transporteuses entièrement en plastique, plus faciles à entretenir et beaucoup plus durables que les bandes en tissu traditionnelles. Les bandes transporteuses en plastique sont également plus faciles à nettoyer et peuvent parfois être moins coûteuses à remplacer et à produire."
 production_efficiency_VI:0 "Fabrication assistée par ordinateur"
 production_efficiency_VI_desc:0 "La fabrication assistée par ordinateur (FAO) est l'utilisation d'un système d'information (ordinateur IE) pour contrôler la fabrication. L'assistance à la fabrication à l'aide d'un logiciel de FAO facilite grandement la gestion, la fabrication et le stockage et permet au système informatique de s'ajuster rapidement pour s'adapter à une multitude de spécifications différentes. La précision de la FAO permet une plus grande flexibilité dans le changement de production, une plus grande précision pour des produits de meilleure qualité et une réduction des déchets en utilisant uniquement la quantité requise de matériau et même en réduisant la consommation d'énergie."
 production_efficiency_VII:0 "Fabrication intégrée par ordinateur"
 production_efficiency_VII_desc:0 "La fabrication informatique entièrement intégrée est le prolongement de la fabrication assistée par ordinateur. Des systèmes entièrement intégrés mesurent, enregistrent et contrôlent chaque section d'une opération de fabrication. Avec ce niveau de contrôle, un processus de fabrication entier peut être exploité et rationalisé en ce qui concerne toutes les autres sections d'une chaîne de production."
 production_efficiency_VIII:0 "Gravure laser avancée"
 production_efficiency_VIII_desc:0 "La gravure au laser consiste à utiliser des lasers pour marquer un objet ou laisser une impression laser. Bien que le marquage et la gravure laser aient déjà été utilisés auparavant, le développement de la technologie permettant de marquer des objets métalliques avec des numéros de série ou des données permet une meilleure gestion de la logistique et permet une plus grande permanence que le marquage à la peinture ou à la poudre. De plus, les lasers ne s'usent pas car ils n'utilisent pas d'outils entrant en contact avec la surface de gravure."
 production_efficiency_IX:0 "Revêtement par pulvérisation à froid"
 production_efficiency_IX_desc:0 "La pulvérisation à froid est une méthode de revêtement dans laquelle des jets de gaz supersoniques pulvérisent une surface et l'impactent, conduisant à une adhérence sur la surface. Cette méthode de revêtement est beaucoup plus rapide que les méthodes précédentes et permet de fabriquer des surfaces de produits ou de pièces de machines plus rapidement et plus simplement. Il est également plus efficace sur le plan énergétique et peut également collecter et réutiliser les particules manquées, tout en améliorant la sécurité globale sur le lieu de travail."
 production_efficiency_X:0 "Impression 3D de base"
 production_efficiency_X_desc:0 "L'impression 3D est le processus par lequel des matériaux liquides ou en poudre sont solidifiés pour former un objet solide. Ceci est principalement utilisé industriellement pour créer des modèles en polymère thermodurci et créer des objets en plastique. Cette méthode est plus efficace et moins coûteuse que le moulage du plastique et peut être particulièrement utile pour créer des objets médicaux tels que des implants ou des couronnes dentaires de remplacement."
 industry_production_efficiency_tt:0 "§G+5%§! §YParc Industriel§! revenus\n"

 #Industrial robots
 industrial_robots_I:0 "Robots de levage lourds"
 industrial_robots_I_desc:0 "Les robots sont des machines capables de réaliser des actions complexes qui peuvent être autonomes ou semi-autonomes. Les premières robots industriels ont révolutionné l'industrie en permettant aux machines d'effectuer des tâches qui seraient normalement dangereuses pour les humains et à un rythme beaucoup plus rapide. En développant des systèmes hydrauliques et de contrôle permettant l'exécution automatisée de tâches répétitives, les usines peuvent atteindre des niveaux beaucoup plus productifs avec moins de travailleurs et effectuer des tâches auparavant difficiles."
 industrial_robots_II:0 "Robotique à bras articulés"
 industrial_robots_II_desc:0 "En améliorant encore la force et la dextérité de la robotique, des bras robotiques articulés capables d'effectuer des tâches encore plus complexes peuvent être créés. Ce faisant, les bras robotiques peuvent se plier et atteindre davantage de zones et effectuer des tâches plus complexes, réduisant ainsi davantage le nombre de personnel requis et permettant aux usines de produire davantage à un rythme plus rapide."
 industrial_robots_III:0 "Robots contrôlés par ordinateur"
 industrial_robots_III_desc:0 "Les robots contrôlés par ordinateur ou « robotique intégrée CAM » sont des robots qui peuvent être activement reprogrammés via le réseau CAM d'une usine et contrôlés à distance. Cela augmente le contrôle dont disposent les opérateurs sur les chaînes d'assemblage automatisées et permet des chaînes d'assemblage plus flexibles, capables d'importer des programmes robotiques et de reprendre et de modifier rapidement des tâches."
 industrial_robots_IV:0 "Lignes d'assemblage entièrement robotisées"
 industrial_robots_IV_desc:0 "La conception de variantes et de conceptions d'équipements robotiques de fabrication permet de créer des niveaux plus importants de produits. En élargissant la famille de la robotique et en créant des équipements capables de s'adapter à une multitude de conceptions, des chaînes d'assemblage entières peuvent devenir entièrement automatisées."
 industrial_robots_V:0 "Fabrication d'intelligence artificielle"
 industrial_robots_V_desc:0 "L'intelligence artificielle et les actions autonomes dynamiques permettent à la robotique de réagir aux changements de l'environnement et d'améliorer considérablement la sécurité. Tout type de dysfonctionnement ou de désalignement du système pouvait auparavant provoquer une cascade de situations entraînant de graves dommages aux machines, mais donner aux équipements robotiques la capacité de réagir et d'effectuer des jugements de base dans la situation leur permet de réagir correctement. Cela peut également être utilisé pour tester et détecter automatiquement les défauts de qualité et les défauts des produits."

