 #Civil engineering
 civil_engineering_I:0 "Avancement du béton précontraint"
 civil_engineering_I_desc:0 "Le béton a toujours eu du mal à supporter les charges et tensions importantes des projets de construction modernes. En tant que tel, il a finalement été renforcé. Cependant, il existe encore de nombreux projets qui étaient encore trop exigeants pour être réalisés avec du béton. Le béton précontraint a été développé pour permettre au béton d'être encore plus renforcé. Dans le béton précontraint, les câbles en acier à haute résistance sont sollicités (ou « comprimés ») et le béton lui-même est posé dessus pour former des sections de béton préfabriquées sous contrainte."
 civil_engineering_II:0 "Méthode de base des éléments fins"
 civil_engineering_II_desc:0 "La méthode des éléments fins (FEM) est une méthode mathématique permettant de résoudre des problèmes d'ingénierie et de physique dans des domaines d'intérêt tels que l'analyse structurelle, le transfert de chaleur, l'écoulement des fluides et le potentiel électromagnétique. Afin de résoudre des problèmes via le FEM, les grands problèmes sont divisés en petits problèmes appelés « éléments finis ». En divisant ainsi les grands problèmes d'ingénierie, ils peuvent être résolus plus rapidement et à un niveau plus précis et identifier des zones de problèmes spécifiques."
 civil_engineering_III:0 "Méthode d'excavation séquentielle"
 civil_engineering_III_desc:0 "La méthode d'excavation séquentielle (SEM) est une méthode de création et de conception de tunnels. La résistance géologique de la pierre est utilisée autant que possible pour réduire les coûts. En contrôlant la déformation du sol lors du creusement du tunnel et en permettant au support de se déformer sous la charge, la résistance naturelle de la pierre est utilisée au mieux de ses capacités. Le tunnel est creusé et soutenu séquentiellement, chaque problème étant analysé en cours de route pour permettre l'adaptation aux conditions rocheuses à mesure qu'elles changent."
 civil_engineering_IV:0 "Théories structurelles modernes"
 civil_engineering_IV_desc:0 "À mesure que les structures deviennent plus complexes, les concepts fondamentaux qui sous-tendent la résolution des problèmes d'ingénierie doivent s'améliorer. Avec l'avènement de théories structurelles modernes qui simplifient les calculs, telles que la théorie de la membrane-coquille qui stipule que les coques cylindriques minces ont un mouvement mécanique négligeable et de nouvelles formules pour calculer plus efficacement les forces de membrane et de cisaillement, davantage de problèmes d'ingénierie peuvent être résolus dans un laps de temps plus court."
 civil_engineering_V:0 "Asphalte Mastic Pierre"
 civil_engineering_V_desc:0 "L'asphalte mastic de pierre est une forme de chaussée résistante à la déformation et très durable. Le SMA est constitué d'un contenu global qui forme un squelette de pierre interne. Le squelette de la pierre lui-même est constitué d'asphalte, de charges générales telles que les plastiques, le caoutchouc, les adhésifs et les fibres. Le squelette de pierre offre plus de contact pierre sur pierre que les asphaltes conventionnels, ce qui se traduit par une plus grande durabilité du liant et moins de vides d'air."
 civil_engineering_VI:0 "Système structurel de tube de faisceau"
 civil_engineering_VI_desc:0 "Le système structurel de tube de faisceau, également connu sous le nom de système structurel de tour de génération 4 ou « type 4 ». Est une méthode de construction de grandes tours en colonnes. Certaines colonnes sont plus courtes que d'autres et placées plus loin les unes des autres et aident à soutenir des colonnes plus grandes au sein de la même tour. Cela aide les gratte-ciel à devenir plus solides et à résister aux forces latérales. Cela permet également aux tours de prendre des formes différentes, autres que des boîtes, pour être efficaces économiquement et structurellement, rendant ainsi les villes moins laides."
 civil_engineering_VII:0 "Analyse de calcul avancée"
 civil_engineering_VII_desc:0 "Avec des structures et des systèmes de plus en plus complexes, les problèmes d'ingénierie deviennent de plus en plus complexes. Même avec des simplifications telles que des théories améliorées sur les membranes et les structures, le système de tubes en faisceau, les éléments fins et d'autres méthodes qui rendent la construction plus modulaire et plus facile à traiter, les besoins du monde moderne deviennent de plus en plus complexes. Finalement, les problèmes deviennent trop fastidieux pour que les ingénieurs puissent les résoudre sans aide."
 civil_engineering_VIII:0 "Acier de construction de haute qualité"
 civil_engineering_VIII_desc:0 "La fabrication de l'acier à l'oxygène crée un acier de construction de meilleure qualité que les méthodes précédentes. Les fours à oxygène soufflent de grandes quantités d'oxygène pur dans le fer en fusion et l'acier mis au rebut et achèvent sa charge plus rapidement que les méthodes à foyer ouvert. Jusqu'à 350 tonnes métriques de fer et de ferraille d'acier peuvent être converties en acier de haute qualité en moins d'une heure. De plus, cela réduit considérablement le coût de l'acier et rend le système plus durable en réduisant les déchets en suspension dans l'air et en rendant le système plus économe en énergie"
 civil_engineering_IX:0 "Pavage à coffrage glissant"
 civil_engineering_IX_desc:0 "Le pavage à coffrage glissant est une méthode par laquelle les routes sont pavées en continu. À l'aide de véhicules de placement/épandage modernes, la masse de PCC ou d'asphalte est tirée en continu pour garantir une conception plus cohérente et produite plus rapidement. Ensuite, le pavé rase les excédents et lisse la structure et éventuellement, place des renforts au fur et à mesure de son déplacement.\nCe faisant, l'entretien des routes peut être effectué plus rapidement et des chaussées minces peuvent être réalisées plus rapidement."
 civil_engineering_X:0 "Utilisation de la CAO à grande échelle"
 civil_engineering_X_desc:0 "Lorsque les outils de calcul ont été développés pour la première fois, leur potentiel et leurs capacités ont été rapidement démontrés. Le développement d'outils modernes de conception assistée par ordinateur et leur adoption à grande échelle conduisent à des progrès massifs dans l'efficacité de la conception architecturale et technique. Ces outils facilitent la macrogénération des tâches répétitives, sont accompagnés d'aides informatiques pour les problèmes complexes et d'autres outils permettant d'améliorer l'efficacité."
 civil_engineering_XI:0 "Construction agile"
 civil_engineering_XI_desc:0 ""
 civil_engineering_XII:0 "Construction intégrée au cloud"
