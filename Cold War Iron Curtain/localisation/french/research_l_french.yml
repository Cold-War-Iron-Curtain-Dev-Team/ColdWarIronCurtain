 #Excavation
 excavation_I:0 "Extraction de carrière à grande échelle"
 excavation_I_desc:0 "Vers les années 1950, de nouvelles méthodes d'extraction et de nouveaux équipements ont été développés pour permettre aux grandes carrières de recueillir de la pierre ou du gravier. Les véhicules sur chenilles et les équipements de décapage modernes ont été créés spécifiquement pour permettre des extractions massives et des tailles de fosses modulaires. La création de niveaux modulaires prévus pour permettre à l'équipement de monter et descendre des fosses à des vitesses relativement rapides avec des pentes standardisées et des systèmes et relais logistiques internes permet aux fosses plus grandes de rester efficaces."
 excavation_II:0 "Extracteurs de roues à godets"
 excavation_II_desc:0 "Les extracteurs à roue à godets sont des équipements lourds d'exploitation minière à ciel ouvert qui ajoutent plusieurs godets d'extraction à une roue qui déposent leurs charges sur une piste pendant qu'ils creusent. Ces extracteurs récupèrent continuellement le matériau lorsque la roue tourne et sont capables de découper des sections verticales dans une fosse. Ils sont très efficaces pour récolter ou éliminer les matériaux meubles.\nÀ ce jour, les extracteurs à roue à godets sont les véhicules terrestres les plus lourds jamais fabriqués."
 excavation_III:0 "Exploitation minière au sommet d'une montagne"
 excavation_III_desc:0 "L'exploitation minière au sommet d'une montagne est une méthode d'exploitation minière à ciel ouvert au sommet ou à la crête d'une montagne. En enlevant les morts-terrains d'un sommet ou d'une crête, un espace suffisamment grand et plat est créé qui peut être exploité vers le bas. Au fil du temps, davantage de morts-terrains sont retirés des bords des coutures pour permettre des fosses plus profondes au sommet des montagnes. Cette méthode permet d'extraire à ciel ouvert de riches ressources issues de la formation sismique des montagnes sans avoir besoin de créer des puits profonds pour les exploiter."
 excavation_IV:0 "Exploitation minière en longue taille par convoyeur"
 excavation_IV_desc:0 ""
 excavation_V:0 "Forage à distance"
 excavation_V_desc:0 ""
 excavation_VI:0 "Forage par spallation thermique"
 excavation_VI_desc:0 ""
 excavation_VII:0 "Équipements autonomes/Réfrigération de puits"
 excavation_VII_desc:0 ""
