 #Vanilla Mobile Warfare

 mobile_warfare:0 "Guerre mobile"
 mobile_warfare_desc:0 "Mobile Warfare met l'accent sur la vitesse et la manoeuvre pour couper et désorganiser les forces ennemies.\n\n"
 delay:0 "Retard"
 delay_desc:0 "Même lorsqu'une bataille ne peut être gagnée, il peut être avantageux de ralentir la progression des forces attaquantes par des embuscades et des tactiques dilatoires."
 elastic_defence:0 "Défense élastique"
 elastic_defence_desc:0 "Plutôt que de concentrer toutes ses forces sur la ligne de front, une défense élastique crée une couche de défense « plus profonde » qui donne au défenseur plus de temps pour réagir et contre-attaquer tandis que l'attaquant est dispersé et enlisé."
 mobile_infantry:0 "Infanterie mobile"
 mobile_infantry_desc:0 "L'infanterie régulière est souvent trop lente pour suivre, réagir ou échapper aux forces blindées qui se déplacent rapidement. La réponse est de se concentrer sur l'infanterie motorisée ou mécanisée, capable de suivre le rythme de la guerre moderne.\n\n"
 mass_motorization:0 "Motorisation de masse"
 mass_motorization_desc:0 "Une concentration encore plus grande sur les troupes motorisées."
 mechanized_offensive:0 "Offensive mécanisée"
 mechanized_offensive_desc:0 "Les troupes motorisées, c'est bien beau, mais pour mener des offensives, nous avons besoin d'une infanterie capable de se lancer dans la bataille à bord de transports blindés qui les protègent et transportent des armes lourdes."
 armored_spearhead:0 "Fer de lance blindé"
 armored_spearhead_desc:0 "Pour utiliser les chars à leur plein potentiel, ils ne peuvent pas être immobilisés pour soutenir l'infanterie. Au lieu de cela, ils doivent être formés en unités indépendantes et rapides, capables de mener des attaques.\n\n"
 schwerpunk:0 "Point de Schwer"
 schwerpunk_desc:0 "Dans toute opération, le Schwerpunkt, ou point focal, doit être identifié et la force maximale doit être concentrée pour gagner à ce point."
 blitzkrieg:0 "Guerre éclair"
 blitzkrieg_desc:0 "La Blitzkrieg fait référence à la stratégie consistant à déplacer rapidement des forces blindées soutenues par une infanterie mobile et un soutien aérien qui franchissent les lignes ennemies pour les désorganiser et les encercler."
 kampfgruppe:0 "Groupe Kampf"
 kampfgruppe_desc:0 "Un Kampfgruppe était une formation ad hoc organisée pour accomplir une tâche spécifique."
 firebrigades:0 "Pompiers"
 firebrigades_desc:0 "Les « pompiers » étaient des forces rassemblées à la hâte pour réagir aux percées ennemies ou à d'autres problèmes critiques.\n\n"
 backhand_blow:0 "Coup de revers"
 backhand_blow_desc:0 "Plutôt que de se battre pour chaque pouce de terrain, les pénétrations ennemies sont largement évitées jusqu'à ce qu'elles se soient étendues, après quoi elles peuvent être coupées et détruites par des contre-attaques."
 modern_blitzkrieg:0 "Guerre éclair moderne"
 modern_blitzkrieg_desc:0 "Le summum de Mobile Warfare, Modern Blitzkrieg intègre toutes les dernières avancées technologiques et les leçons tirées des doctrines précédentes."
 volkssturm:0 "Tour Volkssturm"
 volkssturm_desc:0 "La Volkssturm, ou milice populaire, était composée d'hommes trop vieux, trop jeunes ou inaptes au service militaire régulier.\n\n"
 nd_conscription:0 "Conscription non discriminatoire"
 nd_conscription_desc:0 "Même les invalides et les infirmes doivent être enrôlés, il ne peut y avoir de civils."
 werwolf_guerillas:0 "Guérillas de loups-garous"
 werwolf_guerillas_desc:0 "Les Werwolves étaient un groupe de résistance allemand planifié qui continuerait à lutter contre les puissances occupantes une fois la guerre perdue."

 #Vanilla Superior Firepower

 superior_firepower:0 "Puissance de feu supérieure"
 superior_firepower_desc:0 "Cette doctrine se concentre sur le lancement d'obus, et non d'hommes, sur l'ennemi. Notre main-d'oeuvre est précieuse, les balles sont bon marché.\n\n"
 sup_delay:0 "Retard"
 sup_delay_desc:0 "Même lorsqu'une bataille ne peut être gagnée, il peut être avantageux de ralentir la progression des forces attaquantes par des embuscades et des tactiques dilatoires."
 mobile_defence:0 "Défense mobile"
 mobile_defence_desc:0 "Les forces mobiles peuvent être utilisées pour renforcer la défense partout où l'ennemi peut attaquer."
 intergrated_support:0 "Prise en charge intégrée"
 intergrated_support_desc:0 "L'intégration étroite des forces de soutien aux troupes de combat donne lieu à des divisions plus fortes en attaque.\n\n"
 regimental_combat_teams:0 "Équipes de combat régimentaires"
 regimental_combat_teams_desc:0 "Une équipe de combat régimentaire est un régiment d'infanterie étroitement intégré à des unités de soutien telles que des éléments d'artillerie, de chars et de reconnaissance pour former une petite unité autonome qui permet une plus grande flexibilité lors des attaques."
 dispersed_support:0 "Soutien dispersé"
 dispersed_support_desc:0 "En dispersant nos unités de soutien, elles peuvent couvrir une zone plus large tout en restant hors de la ligne de tir, ce qui se traduit par des divisions dotées d'une meilleure défense.\n\n"
 overwhelming_firepower:0 "Une puissance de feu écrasante"
 overwhelming_firepower_desc:0 "Faire appel à toutes les unités de soutien disponibles pour fournir une puissance de feu écrasante peut grandement affaiblir une cible, ou mieux encore, sérieusement gâcher la journée d'un attaquant."
 sup_mechanized_offensive:0 "Offensive mécanisée"
 sup_mechanized_offensive_desc:0 "Les troupes motorisées, c'est bien beau, mais pour mener des offensives, nous avons besoin d'une infanterie capable de se lancer dans la bataille à bord de transports blindés qui les protègent et transportent des armes lourdes."
 concentrated_fire_plans:0 "Plans de lutte contre les incendies concentrés"
 concentrated_fire_plans_desc:0 "En concentrant le feu de différentes batteries dans un bombardement synchronisé, des dégâts bien plus importants peuvent être infligés à l'ennemi.\n\n"
 combined_arms:0 "Armes combinées"
 combined_arms_desc:0 "Les unités blindées, d'infanterie et de soutien travaillant ensemble au sein d'équipes bien organisées sont bien plus efficaces que les mêmes forces utilisées séparément."
 tactical_control:0 "Contrôle tactique"
 tactical_control_desc:0 "Les officiers familiarisés avec les opérations interarmes en positions avancées peuvent désormais contrôler directement toutes les opérations de la branche."
 air_land_battle:0 "Bataille Aérienne"
 air_land_battle_desc:0 "Alors que les forces terrestres opèrent déjà dans des formations interarmes, AirLand Battle met désormais également l'accent sur une coordination étroite entre les forces terrestres et aériennes, fusionnant les champs de bataille aériens et terrestres en un tout homogène."
 centralized_fire_control:0 "Contrôle centralisé des incendies"
 centralized_fire_control_desc:0 "Un système de contrôle de tir centralisé permet d'évaluer tous les appels de soutien d'artillerie en un seul endroit et, si nécessaire, de concentrer toute la puissance de feu d'une division sur une cible plutôt qu'une unité ne puisse demander que le tir de l'artillerie qui lui est assignée.\n\n"
 forward_observers:0 "Observateurs avancés"
 forward_observers_desc:0 "Les observateurs avancés occupent des positions où ils peuvent observer directement la précision et les effets des tirs d'artillerie et relayer les résultats aux canons pour correction."
 advanced_firebases:0 "Bases de feu avancées"
 advanced_firebases_desc:0 "Les camps d'artillerie peuvent être positionnés à proximité des lignes de front dans des bases fortifiées afin d'apporter le maximum de soutien possible aux forces qui avancent."
 shock_and_awe:0 "Choc et crainte"
 shock_and_awe_desc:0 "Une concentration massive de puissance de feu imposera ce niveau écrasant de choc et de crainte contre un adversaire sur une base immédiate ou suffisamment opportune pour paralyser sa volonté de continuer."

 #Vanilla Grand Battleplan

 grand_battle_plan:0 "Grand plan de bataille"
 grand_battle_plan_desc:0 "Une planification et une préparation approfondies avant de s'engager dans la bataille sont la clé du succès.\n\n"
 trench_warfare:0 "Guerre des tranchées"
 trench_warfare_desc:0 "Une pelle est souvent la meilleure arme de l'infanterie. Les unités apprennent l'importance de se retrancher dans n'importe quelle position qu'elles occupent."
 prepared_defense:0 "Défense préparée"
 prepared_defense_desc:0 "Des systèmes de fortifications de campagne plus étendus améliorent considérablement la défense d'une unité."
 grand_assault:0 "Grand assaut"
 grand_assault_desc:0 "Une fois que des forces suffisantes ont été constituées et que leurs objectifs ont été bien planifiés, un assaut puissant ne peut que détruire l'ennemi."
 grand_mechanized_offensive:0 "Offensive mécanisée"
 grand_mechanized_offensive_desc:0 "Les troupes motorisées, c'est bien beau, mais pour mener des offensives, nous avons besoin d'une infanterie capable de se lancer dans la bataille à bord de transports blindés qui les protègent et transportent des armes lourdes.\n\n"
 assault_concentration:0 "Concentration d'assaut"
 assault_concentration_desc:0 "Avant une attaque, les éléments de tête sont soigneusement préparés et placés en position avancée, garantissant ainsi qu'une force maximale peut être appliquée dans les premiers instants."
 branch_interoperation:0 "Interopération entre succursales"
 branch_interoperation_desc:0 "Une coordination accrue entre les différentes branches des forces armées leur permet de mieux travailler dans les opérations interarmes."
 assault_breakthrough:0 "Percée d'assaut"
 assault_breakthrough_desc:0 "Plutôt que de lancer un grand assaut sur l'ensemble du front, il peut être beaucoup plus efficace de concentrer la frappe sur un seul ou quelques points de la ligne ennemie et d'y réaliser une percée."
 central_planning:0 "Planification centrale"
 central_planning_desc:0 "Les agents de toutes les branches contribuent désormais à la planification d'une opération donnée pour s'assurer qu'elle fonctionne avec une efficacité maximale."
 c3i_theory:0 "C3I"
 c3i_theory_desc:0 "Des officiers d'état-major efficaces assurent la fluidité du commandement, du contrôle, des communications et du renseignement entre un commandant et les unités qu'il contrôle."
 infantry_offensive:0 "Offensive d'infanterie"
 infantry_offensive_desc:0 "L'esprit offensif de l'infanterie est l'élément décisif pour gagner les batailles. Notre infanterie doit montrer la voie.\n\n"
 armored_operations:0 "Opérations blindées"
 armored_operations_desc:0 "Les chars et autres véhicules blindés sont très utiles pour transporter l'infanterie sur les champs de bataille et offrir un soutien direct au combat."
 infiltration_assault:0 "Assaut d'infiltration"
 infiltration_assault_desc:0 "Lors des premiers mouvements d'attaque, l'infanterie doit cibler les points faibles de la ligne ennemie pour contourner et isoler les sections les mieux défendues, qui peuvent ensuite être anéanties par le reste des forces attaquantes."
 night_assault_tactics:0 "Tactiques d'assaut nocturne"
 night_assault_tactics_desc:0 "Les soldats habitués à se déplacer et à combattre la nuit peuvent soit se prépositionner pour une attaque, soit attaquer directement les forces ennemies sans méfiance."
 attritional_containment:0 "Confinement attritionnel"
 attritional_containment_desc:0 "Si nous ne parvenons pas à lancer une attaque pour éliminer une position ennemie, celle-ci doit néanmoins être soumise à des attaques mineures constantes qui entraîneront des pertes et empêcheront l'ennemi de lancer ses propres attaques."
 infiltration_in_depth:0 "Infiltration en profondeur"
 infiltration_in_depth_desc:0 "Nos forces sont désormais entraînées à contourner et à isoler les points forts ennemis à une plus grande profondeur. Idéalement, nos forces d'assaut ne devraient pas s'arrêter tant qu'elles n'ont pas atteint les zones arrière de l'ennemi et que leurs forces ne sont pas complètement isolées."

 #Vanilla Mass Assault

 mass_assault:0 "Assaut de masse"
 mass_assault_desc:0 "Les armes « parfaites » sont surfaites, un grand nombre d'armes « assez bonnes » est le chemin vers la victoire !\n\n"
 pocket_defence:0 "Défense de poche"
 pocket_defence_desc:0 "Il est possible que, sur la défensive, nos troupes se retrouvent prises dans une poche. Dans ce cas, ils doivent simplement tenir le coup jusqu'à ce que l'inévitable contre-attaque les libère."
 defence_in_depth:0 "Défense en profondeur"
 defence_in_depth_desc:0 "En offrant une résistance relativement légère et en cédant temporairement du terrain, nous pouvons échanger de l'espace contre du temps et permettre aux forces attaquantes de s'épuiser avant de contre-attaquer."
 large_front_operations:0 "Opérations de grand front"
 large_front_operations_desc:0 "Combattre sur un grand front implique de coordonner les efforts de plusieurs unités sur de longues distances : au niveau opérationnel plutôt que tactique.\n\n"
 deep_operations:0 "Opérations approfondies"
 deep_operations_desc:0 "Le concept des opérations profondes, ou Deep Battle, est de percer les lignes défensives de l'ennemi en plusieurs points et de détruire ses réserves opérationnelles, sa profondeur opérationnelle, et d'occuper autant que possible sa profondeur stratégique."
 operational_concentration:0 "Concentration opérationnelle"
 operational_concentration_desc:0 "La clé de toute action militaire réside dans une supériorité locale écrasante. À défaut d'être extrêmement supérieur sur l'ensemble du front, cela implique d'affaiblir certaines parties de votre ligne de front pour concentrer les troupes là où cela est nécessaire plutôt que d'essayer d'être fort partout."
 vast_offensives:0 "Vastes offensives"
 vast_offensives_desc:0 "Si une percée peut être réalisée, elle doit être exploitée aussi fortement que possible : une vaste offensive pénétrant les lignes ennemies aussi profondément que possible rendra la défense de leur front plus difficile, impossible ou hors de propos."
 breakthrough_priority:0 "Priorité de percée"
 breakthrough_priority_desc:0 "En s'étendant sur la concentration opérationnelle, tous les besoins du front sont subordonnés à la nécessité de concentrer les forces pour les percées. Les défaites locales sont sans conséquence comparées à un coup décisif."
 mechanized_wave:0 "Vague mécanisée"
 mechanized_wave_desc:0 "Les forces mécanisées sont idéales pour mener les avancées rapides nécessaires à l'exploitation adéquate des percées, tant pour soutenir les forces blindées que pour sécuriser les flancs de la brèche."
 continuous_offensive:0 "Offensive continue"
 continuous_offensive_desc:0 "Même si les percées correctement exploitées sont souvent très efficaces, tôt ou tard l'attaquant s'épuise toujours et le défenseur est capable de réorganiser et de reformer de nouvelles lignes défensives. Cependant, avec suffisamment de réserves et une bonne organisation, une offensive pourrait être poursuivie à une profondeur beaucoup plus grande, avec des résultats dévastateurs pour l'ennemi."
 human_wave_offensive:0 "Offensive de la vague humaine"
 human_wave_offensive_desc:0 "Une offensive par vagues humaines est une tactique d'infanterie dans laquelle un attaquant mène un assaut frontal avec des formations d'infanterie densément concentrées contre la ligne ennemie, dans le but de submerger les défenseurs en s'engageant dans un combat au corps à corps."
 human_infantry_offensive:0 "Offensive d'infanterie"
 human_infantry_offensive_desc:0 "L'esprit offensif de l'infanterie est l'élément décisif pour gagner les batailles. Notre infanterie doit montrer la voie."
 large_front_offensive:0 "Grande offensive frontale"
 large_front_offensive_desc:0 "En menant ou en menaçant des offensives par vagues humaines dans plusieurs zones du front, nous pouvons empêcher l'ennemi de concentrer sa puissance de feu contre une seule attaque."
 peoples_army:0 "Armée populaire"
 peoples_army_desc:0 "L'Armée populaire croit en la primauté des hommes sur les armes, avec une motivation supérieure compensant une technologie inférieure, et bénéficie d'un large soutien de la population civile.\n\n"
 guerilla_warfare:0 "Guérilla"
 guerilla_warfare_desc:0 "L'ennemi avance, on recule : les camps ennemis, on harcèle : l'ennemi fatigue, on attaque : l'ennemi recule, on poursuit."
 jungle_warfare:0 "Guerre dans la jungle"
 jungle_warfare_desc:0 "Entraînement spécial pour rendre nos soldats efficaces dans la jungle."
 HUN_light_infantry_tech:0 "Doctrine des divisions d'infanterie légère"
 HUN_light_infantry_tech_desc:0 "La réduction du nombre d'armes de soutien dans nos divisions d'infanterie les rend plus flexibles et leur donne un avantage au combat sur des terrains restreints comme les villes et les forêts."

