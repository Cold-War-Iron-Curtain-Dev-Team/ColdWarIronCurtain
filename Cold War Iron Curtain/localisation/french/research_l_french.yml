 #Management
 management_I:0 "Maintenance productive totale (TPM)"
 management_I_desc:0 "Le TPM est l'organisation et la systématisation du maintien de la production et de l'amélioration de la qualité. L'objectif principal du TPM est de garantir que la productivité d'une division industrielle est maintenue grâce à un investissement modeste dans la maintenance et les améliorations. \nAfin d'établir un régime TPM, des équipes de maintenance dédiées sont nécessaires et des ressources doivent être régulièrement investies pour augmenter le volume de production."
 management_II:0 "Entretien préventif"
 management_II_desc:0 "La maintenance préventive est un aspect essentiel du TPM dans lequel la maintenance et les inspections sont effectuées à l'avance avant qu'une panne ne survienne. Grâce à une inspection, une détection et une correction systématiques des pannes pendant les heures non productives, le travail est effectué pour éviter les pannes ou les dysfonctionnements. Le développement de la PM nécessite le développement d'un régime, d'équipes et d'outils de maintenance spéciaux, ainsi que d'un système de formation afin de permettre aux responsables de la maintenance de détecter à l'avance les pannes ou l'usure potentielles."
 management_III_A:0 "Entretien périodique"
 management_III_A_desc:0 "La maintenance périodique est une réduction du régime TPM programmée en fonction de la durée de vie estimée des machines ou des pièces. En fonction des tendances, les inspections sont planifiées et effectuées périodiquement et ne sont pas aussi étendues que la maintenance prédictive, car elles entraînent des inspections moins fréquentes. La maintenance périodique réduit les coûts globaux, mais entraîne une productivité moindre et des pannes plus fréquentes en raison de maintenances moins intensives et régulières."
 management_III_B:0 "Maintenance prédictive"
 management_III_B_desc:0 "La maintenance prédictive est une extension du régime TPM planifiée en fonction de l'état de l'équipement. La maintenance prédictive est une expansion des inspections effectuées régulièrement sur les machines et entretient les équipements chaque fois qu'ils présentent des signes d'usure, de fatigue ou de panne potentielle. La maintenance prédictive est plus coûteuse car elle nécessite une extension du régime TPM, mais elle est plus efficace pour prévenir les pannes et maintenir la productivité."
 management_IV:0 "Fabrication cellulaire"
 management_IV_desc:0 "L'objectif de la fabrication cellulaire est de fabriquer une grande variété de produits similaires dans un court laps de temps. Chaque « cellule » a produit un produit intermédiaire via 1 ou plusieurs machines et déplace ces intermédiaires vers une autre « cellule » de machines qui créent un autre point de contrôle. Dans le format de cellule, une seule cellule doit être changée ou modifiée (ou dans certains cas, simplement déplacée vers une cellule alternative) afin de changer une ligne de production entière."
 management_V_A:0 "Introduire le juste à temps (JIT)"
 management_V_A_desc:0 "Le système de production juste à temps est celui dans lequel une usine cherche à utiliser uniquement ce dont elle a besoin pour un produit afin de réduire les déchets et de minimiser les temps d'attente entre chaque étape de production. Dans le système JIT, les marchandises ne sont pas stockées et de nouvelles commandes logistiques sont passées dès l'arrivée des marchandises entrantes. En conséquence, l'entreposage est minimisé, les déchets sont considérablement réduits, la liquidation est rendue plus rare et les coûts sont réduits. JIT cherche également à réduire les réserves ou le personnel excédentaire afin d'améliorer l'efficacité."
 management_V_B:0 "Améliorer juste au cas où (JIC)"
 management_V_B_desc:0 "Le système de production Just In Case est le système dans lequel une usine cherche à créer des tampons et à disposer de niveaux de stock et de personnel supplémentaires afin d'éviter les pertes de productivité dues à des blocages logistiques, des erreurs ou des intrants défectueux. Le système JIC cherche à éviter les problèmes ou les blocages au sein de la production en maintenant des stocks de marchandises nécessaires et en passant des commandes lorsque certaines pièces sont sur le point de devenir faibles."
 management_VI:0 "Gestion de la qualité totale (TQM)"
 management_VI_desc:0 "La gestion de la qualité totale est un effort visant à améliorer les capacités des employés sur le lieu de travail. Cela se fait grâce à des incitations, au mérite et à des techniques de gestion améliorées. Grâce à l'amélioration des processus de travail, la qualité des produits et des services s'améliore tout comme la productivité. Des équipes interfonctionnelles peuvent être constituées ad hoc pour résoudre des problèmes de qualité immédiats, la participation active de la direction à l'enseignement est une politique et des récompenses méritocratiques sont accordées aux individus qui obtiennent des résultats supérieurs à ceux de leurs pairs."
 management_IV_A:0 "Gestion de la sécurité et de la santé au travail (OSHM)"
 management_IV_A_desc:0 ""
 management_VII_A:0 "Travail constant en cours (ConWIP)"
 management_VII_A_desc:0 "Le Constant Work in Progress est un système de fabrication hybride push and pull. ConWIP maintient un nombre constant de produits « Work-in-Progress » sur la ligne de production grâce à des cartes individuelles définies à chaque niveau de la ligne de production."
 management_VII_B:0 "Fabrication à réponse rapide (QRM)"
 management_VII_B_desc:0 "Quick Response Manufacturing est un système de fabrication hybride push-pull. Quick Response Manufacturing maintient des délais de livraison courts entre les produits en réduisant la latence entre le lancement et l'exécution d'un processus de fabrication. En mettant en oeuvre des pratiques qui conduisent à des délais de livraison réduits, la productivité est améliorée et les coûts sont réduits."
 management_VIII:0 "Intégration du modèle de maturité des capacités (CMMI)"
 management_VIII_desc:0 "L'intégration du modèle de maturité des capacités est un modèle de développement dans lequel de nombreuses pratiques et politiques de fabrication sont formalisées et optimisées et les pratiques ad hoc sont remplacées par des pratiques permanentes. Le modèle est conçu pour développer et améliorer les politiques de gestion antérieures et futures et aider au développement du processus de fabrication en transformant les pratiques ad hoc régulièrement menées en politique formelle et en les évaluant pour les optimiser davantage."
 management_IX:0 "Fabrication allégée"
 management_X:0 "Fabrication agile"
 management_X_tt:0 "Parc industriel §G-10% £resources_strip|5 Parc de bureaux §G-10% £resources_strip|2 Consommation"
