 #Logistics
 logistics_I:0 "Fret aérien efficace"
 logistics_I_desc:0 "Des conteneurs plus légers et des mécanismes de sécurisation standardisés améliorent la vitesse à laquelle le fret aérien peut être chargé et déchargé."
 logistics_II:0 "Palettisation"
 logistics_II_desc:0 "Placer toutes les marchandises sur des palettes, qui peuvent être facilement manipulées par des chariots élévateurs et des grues de chargement, nous donne une plus grande flexibilité quant aux marchandises que nous pouvons expédier et où."
 logistics_III:0 "Nomenclature modulaire"
 logistics_III_desc:0 "La nomenclature modulaire (BOM) est une nomenclature de planification qui permet de modifier à la demande des produits complexes dotés de fonctionnalités optionnelles pour la production en usine. En échangeant différents composants les uns contre les autres sur un produit modulaire, davantage de variantes du même produit pour répondre à différents besoins peuvent être facilement réalisées sur commande."
 logistics_IV_A:0 "MRP basé sur la consommation"
 logistics_IV_A_desc:0 "La planification des ressources de fabrication basée sur la consommation planifie l'utilisation des chiffres de ventes actuels et futurs afin de fabriquer à l'avance les produits potentiellement nécessaires, ce qui permet de gagner du temps et de répondre rapidement à la demande. Cependant, il existe des inexactitudes dans le MRP basé sur la consommation, ce qui entraîne un gaspillage basé sur des projections inexactes, ce qui peut coûter des ressources et entraîner du gaspillage. Parfois, le MRP basé sur la consommation présente des échecs de projections catastrophiques qui conduisent à des liquidations ou à un gaspillage massif."
 logistics_IV_B:0 "Produire à la demande MRP"
 logistics_IV_B_desc:0 "La planification des ressources de fabrication « produire à la demande » planifie en fonction des besoins immédiats et ne construit pas le produit tant qu'il n'est pas commandé. Ce faisant, le gaspillage est évité et les ressources et le temps d'activité de l'usine sont économisés. Cela entraîne cependant des temps d'attente et exerce une pression accrue sur le commerce pour qu'il planifie individuellement ses propres produits ou qu'il s'appuie davantage sur les commandes anticipées des clients. Produire à la demande peut souvent entraîner des pénuries ou des retards de commandes, mais évite le gaspillage des ressources."
 logistics_V_A:0 "Standardisation des conteneurs basés sur des camions"
 logistics_V_A_desc:0 "La normalisation des conteneurs par camion est la normalisation du transport intermodal par camion. Bien que tout transport intermodal soit standardisé, le choix de cette technologie représente un accent sur la logistique et l'innovation basées sur les camions. Se concentrer sur la logistique basée sur les camions conduit à un transport plus facile au sein d'une ville, permettant une industrie plus locale à partir de réseaux de logistique urbaine et d'infrastructures simplifiés, mais laisse de côté l'innovation dans les réseaux ferroviaires, ce qui rend plus difficile la productivité globale du commerce interurbain ou de l'industrie rurale."
 logistics_V_B:0 "Standardisation des conteneurs basés sur les trains"
 logistics_V_B_desc:0 "La normalisation des conteneurs par train est la normalisation du transport intermodal par train. Bien que tout transport intermodal soit standardisé, le choix de cette technologie représente un accent sur la logistique et l'innovation basées sur le train. Se concentrer sur la logistique ferroviaire conduit à un transport interurbain plus facile et à une amélioration des capacités industrielles rurales, mais rend la logistique intra-urbaine plus coûteuse à mettre en place, ce qui conduit à des infrastructures urbaines plus complexes et difficiles à gérer."
 logistics_VI:0 "Code produit universel"
 logistics_VI_desc:0 "Le code produit universel (UPC) est un système de codes-barres qui permet une identification et un suivi rapides des articles commerciaux. En plus du suivi, le code-barres permet un paiement rapide des produits sur le point de vente."
 logistics_VI_A:0 "Terminaux pétroliers surdimensionnés"
 logistics_VI_A_desc:0 ""
 logistics_VII_A:0 "Avantage de différenciation SIS"
 logistics_VII_A_desc:0 "L'avantage de différenciation SIS (système d'information stratégique) est un système d'information qui vise à être plus polyvalent et à être capable d'accomplir davantage dans une plus grande variété de domaines plutôt que de fournir un coût compétitif et inférieur. Basé sur la théorie de l'avantage de différenciation de Porter, le DS_SIS cherche à créer un avantage différentiel sur le marché grâce à l'unicité."
 logistics_VII_B:0 "Avantage compétitif SIS"
 logistics_VIII_A:0 "Accent sur le ventre"
 logistics_VIII_A_desc:0 "Les avions cargo sur le ventre sont des avions cargo qui stockent le fret dans le ventre de l'avion et stockent uniquement le fret. Ces types d'avions ne peuvent pas transporter de passagers et ne sont donc pas aussi polyvalents que les avions combi. En se concentrant sur le développement d'avions de fret aériens, le fret aérien peut être considérablement amélioré à mesure que le fret aérien industriel devient plus performant.\nCela aboutit à la production d'avions de ligne complètement séparés qui transportent uniquement des passagers."
 logistics_VIII_B:0 "Accent sur les avions combinés"
 logistics_VIII_B_desc:0 "Les avions combi sont des avions qui peuvent être rapidement modifiés pour transporter des passagers, du fret ou les deux en même temps. Ils comportent généralement des rails sur lesquels les sièges peuvent être installés ou retirés et sont conçus avec des portes cargo latérales surdimensionnées. Ces avions peuvent être fabriqués en masse et servir à des fins multiples et permettre aux avions de servir au transport de marchandises et au transport aérien.\nCela se traduit principalement par la production d'avions combinés."
 logistics_IX:0 "Grues à portique modernes"
 logistics_IX_desc:0 "Le portique, est une grande grue utilisée pour manipuler des conteneurs. Les portiques à quai assurent la logistique maritime tandis que les portiques de gare s'occupent du chargement et du déchargement des trains. Les conceptions modernes de portiques sont capables de manipuler des conteneurs intermodaux plus rapidement, de supporter plus de poids et de fonctionner de manière semi-automatique grâce à l'utilisation d'un fonctionnement assisté par ordinateur."
 logistics_X:0 "Gestion de la chaîne d'approvisionnement"
 logistics_X_desc:0 "Alors que la gestion de la chaîne d'approvisionnement a été créée pendant la Seconde Guerre mondiale pour créer un système d'approvisionnement plus efficace et rationaliser la logistique, les besoins modernes et les améliorations technologiques exigent un niveau encore plus élevé de contrôle et de gestion logistique. En organisant des contrats et des quotas et en créant des réseaux d'infrastructures macroplanifiés plus formalisés et rationalisés, les besoins du monde moderne peuvent être satisfaits et l'industrie peut atteindre un niveau plus élevé."
 logistics_XI:0 "Identification automatique et capture de données (AIDC)"
 logistics_XI_desc:0 ""
 logistics_XII:0 "Logistique d'usine intelligente"
 logistics_XII_desc:0 ""
 logistics_XIII:0 "Logistique Agile Intégrée au Cloud (CIAL)" #2010
 logistics_XIII_desc:0 ""
 logistics_XIV:0 "Ingénierie des systèmes à l'ère de l'information" #2020
 logistics_XIV_desc:0 ""
