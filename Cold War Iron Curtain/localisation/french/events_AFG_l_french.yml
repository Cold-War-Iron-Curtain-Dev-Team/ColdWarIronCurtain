 withdraw_from_korea:0 "Se retirer de Corée"
 AFG_Revolution.1.d:0 "Depuis son arrivée au pouvoir, le Premier ministre Daoud Khan milite depuis longtemps en faveur du Pachtounistan et de la libération des Pachtounes en Afghanistan. Cela lui a valu une popularité au sein de l'armée et de l'élite de Kaboul, mais lui a aliéné le soutien de la population non pachtoune d'Afghanistan. Un commandant militaire ambitieux a proposé une opération visant à envoyer un petit nombre de troupes dans les zones tribales pakistanaises, ce qui amènerait les tribus lourdement armées à rejoindre nos forces. Ensemble, nous pourrons alors réaliser le rêve du Pachtounistan. Depuis 1947, l'armée pakistanaise a évacué ses forces des zones tribales et leur concentration sur la frontière indienne signifie que nos forces peuvent entrer avec peu de résistance. Le commandant militaire affirme que l'opération sera une manoeuvre facile qui résoudra la crise du Pachtounistan de manière décisive en notre faveur."
 AFG_Revolution.2.d:0 "Une force de soldats afghans a récemment pénétré dans les zones tribales du Pakistan afin de déclencher un soulèvement contre l'État pakistanais. Cependant, l'opération s'est soldée par un échec lamentable lorsque les tribus locales fidèles au Pakistan ont attaqué les Afghans, permettant ainsi aux forces pakistanaises, y compris à la puissance aérienne, de gagner du temps pour arriver et chasser les infiltrés. Il s'agit de la dernière provocation du gouvernement du Premier ministre Daoud Khan contre le Pakistan. Initialement, le gouvernement afghan avait déclaré que l'attaque avait été lancée par des membres passionnés d'une tribu pachtoune cherchant à libérer leurs compatriotes, mais l'armée pakistanaise a présenté aux médias des soldats afghans capturés et des documents pour réfuter cette affirmation. Le roi d'Afghanistan, Zahir Shah, serait furieux en privé des actions de son cousin."
 AFG_Revolution.3.d:0 "La récente incursion de soldats afghans dans les zones tribales ainsi que la propagande incessante du Pachtounistan en provenance de Kaboul ont rendu furieux le gouvernement pakistanais. Il a décidé de riposter en initiant un blocus du commerce terrestre avec l'Afghanistan. La grande majorité des importations en Afghanistan proviennent de ports pakistanais et cette décision paralysera probablement l'économie afghane à moins qu'elle ne trouve de nouvelles routes commerciales. Cette annonce a déclenché des manifestations de colère afghanes sur les sites diplomatiques pakistanais à travers le pays. Le Premier ministre Daoud Khan a qualifié cette décision d'acte de guerre et a déclaré que l'Afghanistan devrait se tourner vers ses autres voisins pour obtenir du soutien, faisant allusion à un élargissement des liens avec les Soviétiques. Cela a amené les Américains à demander instamment le rétablissement de la paix dans les deux pays, craignant que les Soviétiques n'utilisent la tension pour prendre pied en Afghanistan."
 AFG_Revolution.4.d:0 "Le Premier ministre Daoud Khan a récemment démissionné au profit du roi Zahir Shah après des dernières années tumultueuses au pouvoir. Le profond dévouement du Premier ministre envers la question du Pachtounistan l'a rendu incroyablement populaire parmi les Pachtounes afghans. Cependant, son échec à parvenir à une résolution sur la question et le blocus économique pakistanais ont gravement nui à l'économie. Cela a érodé le soutien au Premier ministre de la part des grands groupes ethniques non pachtounes. Alors que sa popularité diminuait et que l'économie était en déclin, le Premier ministre a demandé au roi des pouvoirs exécutifs élargis. Pour le roi Zahir Shah, ce fut la goutte d'eau qui fit déborder le vase et il exigea la démission. Peu de temps après l'annonce de la démission, le gouvernement pakistanais a déclaré qu'il avait levé le blocus économique imposé à l'Afghanistan. Malgré ses récents ennuis, Daoud Khan reste populaire et nombreux sont ceux qui accusent désormais le roi d'avoir destitué le Premier ministre à la demande du Pakistan."
 AFG_Revolution.5.d:0 "Le roi Zahir Shah d'Afghanistan a officiellement approuvé une nouvelle constitution pour le pays. Le document étend les droits démocratiques et transforme le pays en une monarchie parlementaire. La constitution vise à préparer progressivement les Afghans à la démocratie. Dans le cadre de ses dispositions, aucun membre de la famille royale ne peut exercer les fonctions de ministre. Cette disposition est considérée comme une attaque directe contre Daoud Khan, un cousin du roi. Malgré sa popularité et la nouvelle constitution, il lui est effectivement interdit d'accéder au pouvoir. La constitution crée effectivement une chambre basse élue du Parlement qui contrôlera les nominations royales. Bien que le document soit salué comme progressiste, certains observateurs se demandent s'il ne créera pas simplement un conflit entre le parlement et le conseil des ministres, chacun cherchant à s'affirmer sur l'autre."
 AFG_Revolution.6.d:0 "Alors que le roi Zahir Shah se remettait d'opérations médicales en Italie, son cousin, l'ancien Premier ministre Daoud Khan, a pris le pouvoir lors d'un coup d'État sans effusion de sang. L'armée afghane a mené le coup d'État, s'emparant rapidement des principaux bâtiments gouvernementaux et des médias. En quelques heures, Daoud Khan s'est adressé à la nation en déclarant que les années de faiblesse du gouvernement et de collusion des élites étaient terminées. Il a proclamé que l'Afghanistan serait désormais une république, avec lui comme chef de l'État. Le roi Zahir Khan n'a pas encore répondu et il ne semble pas y avoir de contre-coup d'État. Daoud Khan est depuis longtemps populaire dans l'armée pour son financement généreux en tant que Premier ministre et son nationalisme a longtemps trouvé un écho parmi la population, en particulier parmi l'importante population ethnique pachtoune. Bénéficiant d'une solide base de popularité et du soutien des militaires, Daoud Khan apparaît solidement au pouvoir."
 AFG_Revolution.7.d:0 "Depuis son exil en Italie, le roi Zahir Khan d'Afghanistan a annoncé qu'il abdiquerait son trône et ne contesterait pas le nouveau régime de Kaboul. Il y a un mois, alors que le roi subissait des opérations médicales en Italie, son cousin et ancien Premier ministre Daoud Khan lançait un coup d'État sans effusion de sang à Kaboul. Daoud Khan a proclamé le pays république et aboli la monarchie. Il semble que le roi ait réalisé que sa situation était devenue intenable. L'armée avait presque complètement rejoint Daoud Khan. En outre, il n'y a pas eu de soulèvements publics majeurs ni de manifestations contre le coup d'État, ce qui indique que la population a largement soutenu le nouveau régime. Bien qu'il semble que le roi ait été abandonné par le peuple, nombreux sont ceux qui considèrent sa décision d'abdiquer comme un geste visant à assurer la paix dans la vie de ses sujets. Il devrait rester en Italie dans un avenir prévisible."
 AFG_Revolution.8.d:0 "Dans une nouvelle stupéfiante en provenance de Kaboul, le rédacteur en chef du quotidien PDPA Parcham, Mir Akbar Khyber, a été assassiné par une équipe d'assassins près de son domicile. Khyber, largement considéré comme le chef de la faction Parcham au sein du PDPA, est également profondément respecté au sein de la faction rivale Khalq pour son rôle historique d'idéologue et de fondateur du parti. Le président Daoud a rapidement imputé l'attaque aux militants islamistes, mais de nombreux membres du PDPA pointent déjà du doigt le gouvernement Daoud qui s'est récemment retourné contre ses alliés Parchamites. Daoud a récemment commencé à exclure du gouvernement les membres du PDPA et a déclaré publiquement son intention de revenir sur certaines des réformes socialistes qu'il avait promises au PDPA. Bien que personne n'ait revendiqué la responsabilité, les rumeurs courent partout, certains experts avancent qu'il pourrait s'agir de membres de Khalq espérant forcer une rupture totale entre les Parchamites et Daoud. Pourtant, de nombreux Afghans accusent également les Américains ou les Soviétiques d'être responsables de l'attaque."
 AFG_Revolution.9.d:0 "Les funérailles de l'éminent dirigeant du PDPA et idéologue communiste afghan Mir Akbar Khyber ont vu plus de quinze mille membres du PDPA défiler dans les rues de Kaboul. Khyber, rédacteur en chef d'un important journal de gauche, a été récemment assassiné près de son domicile par des assaillants inconnus. Bien que le président Daoud ait condamné l'attaque et blâmé les militants islamistes, les personnes en deuil du PDPA en colère ont scandé des slogans anti-gouvernementaux et anti-américains. Beaucoup pensent que c'est le gouvernement travaillant avec les Américains qui a tué Khyber. Des membres éminents du PDPA s'exprimant lors des funérailles ont fait écho à ces sentiments, ce qui a alimenté les chants de colère. Les funérailles ont démontré au président Daoud le pouvoir du PDPA et son infiltration dans l'armée signifiait que les soldats ne pouvaient pas être déployés. Le président Daoud doit soit purger le PDPA, arrêter ses principaux dirigeants qui ont pris la parole lors des funérailles, soit réinviter les Parchamites au gouvernement et initier une transformation socialiste très progressive pour l'Afghanistan." 

 AFG_War.1.d:0 "Quelques jours après les funérailles de Mir Akbar Khyber, le gouvernement a lancé des mesures répressives contre le PDPA et de nombreux dirigeants éminents du PDPA ont été emprisonnés. Cependant, au lieu de briser le PDPA, ces actions ont poussé les factions Parcham et Khalq à travailler ensemble. Hafizullah Amin, un dirigeant du Khalq et le membre le plus éminent du PDPA non emprisonné, a organisé ses partisans au sein du gouvernement et de l'armée. Lorsque le gouvernement Daoud a arrêté le haut dirigeant Nur Muhammad Taraki, l'armée a pris des mesures immédiates. Les partisans du PDPA au sein de l'armée ont dirigé des chars et des troupes pour s'emparer du ministère de la Défense et du palais présidentiel. Le président Daoud a refusé de se rendre et de violents combats de rue ont eu lieu alors que sa garde présidentielle ripostait. Cependant, une fois que les pilotes pro-PDPA ont tué leur commandant et ont piloté des avions de combat pour bombarder les loyalistes, la résistance s'est rapidement effondrée. Le président Daoud, sa famille et ses fidèles responsables ont tous été tués et peu de temps après, l'armée afghane a annoncé la fin du régime monarchique en Afghanistan."
 AFG_War.2.d:0 "Quelques jours après que l'armée a pris le contrôle du pays, le gouvernement a annoncé le transfert du pouvoir au Conseil révolutionnaire de la République démocratique d'Afghanistan, contrôlé par le PDPA. Nur Muhammad Taraki a été élu président et premier ministre. Des dirigeants éminents tels que Hafizullah Amin et Babrak Karmal de la faction Parcham ont reçu le titre de vice-président. La faction Khalq au sein du PDPA est clairement aux commandes, mais elle gouverne avec la faction Parcham puisque certains ministères ont été confiés à ses membres. Le nouveau gouvernement a rapidement proclamé son attachement à l'Islam, sa croyance en la démocratie et a revendiqué une politique de neutralité positive avec ses voisins. Compte tenu du nombre de communistes au sein du parti, du caractère sanglant du coup d'État et des purges des opposants au PDPA, de nombreux observateurs remettent en question la sincérité de ces convictions déclarées. Cependant, les experts occidentaux estiment que Taraki représente un gouvernement nationaliste plutôt que communiste et sont prêts à attendre et voir."
 AFG_War.3.d:0 "La brève alliance entre les Khalqistes et les Parchamites au sein du PDPA a récemment pris fin. Le président afghan, Nur Muhammad Taraki, a ordonné l'arrestation massive et la purge des membres de Parcham au sein du gouvernement et de l'armée. Le leader du Parcham, Barbrak Karmal, séjourne à l'étranger. Il semble que le président Taraki ait agi sous la pression de ses collègues de la faction Khalq qui considéraient les Parchamites comme peu disposés à prendre les mesures révolutionnaires radicales nécessaires au pays. Afin d'assurer le succès de la révolution, ils ont soutenu que le Parcham devait être supprimé. Les arrestations massives et les rumeurs d'exécutions susciteraient la colère des militaires et conduiraient à une polarisation plus profonde au sein des unités. Les efforts soviétiques pour réconcilier les deux factions au cours des dernières semaines ont manifestement échoué et Moscou serait en colère contre Taraki à propos de sa purge."
 AFG_War.4.d:0 "Le gouvernement afghan du président Nur Muhammad Taraki a annoncé une campagne agressive de redistribution des terres destinée à briser les grands propriétaires fonciers et à fournir aux paysans leurs propres terres. Cependant, après six mois, le gouvernement a discrètement mis fin à ce programme car celui-ci s'est avéré un échec. Le gouvernement avait annoncé une limite à la quantité de terres que l'on pouvait posséder, les terres supplémentaires devaient être redistribuées aux paysans sans aucune compensation pour les propriétaires précédents. La rapidité de la réforme, combinée au manque d'enquêtes et de planification, a amené les propriétaires fonciers à utiliser des failles pour conserver leurs terres rentables et de nombreuses familles paysannes ont repris des terres de faible valeur agricole. Le nombre de récoltes a chuté et de nombreux paysans vivent sur des terres qui ne peuvent même pas subvenir aux besoins de leurs familles. Bien que le gouvernement ait publiquement affirmé que la campagne était un succès, de nombreux paysans afghans sont furieux et encore plus appauvris à cause de la politique gouvernementale."
 AFG_War.5.d:0 "Il y a plusieurs mois, dans le cadre d'une campagne visant à éclairer l'Afghanistan et à faire progresser le développement social de la population, le président afghan Nur Muhammad Taraki a lancé plusieurs réformes concernant le mariage. Plus précisément, la pratique de l'achat de mariées a été interdite. Cette réforme a provoqué une réaction de colère, en particulier parmi la population traditionnelle et rurale de l'Afghanistan. Ils pensent que toutes ces pratiques font partie des coutumes afghanes et de l'islam. Le gouvernement est accusé de cibler la culture et la religion afghanes. Les analystes attribuent cette réaction négative à la nature drastique des réformes et au refus du PDPA de travailler avec les dirigeants ruraux et religieux avant de les annoncer. Les érudits musulmans de Kaboul notent que les réformes, en particulier l'interdiction d'acheter des épouses, pourraient facilement être justifiées sur le plan religieux, car l'Islam interdit cette pratique, mais le gouvernement a ignoré leur implication et est maintenant accusé d'être anti-religieux."
 AFG_War.6.d:0 "Les purges continues depuis la révolution Saur ont érodé le soutien militaire au président Nur Muhammad Taraki. La tentative rapide de son régime de transformer l'Afghanistan en un État socialiste moderne a aliéné les campagnes au point que des rebelles armés parcourent les provinces. À Herat, l'arrestation et l'interrogatoire brutal de plusieurs officiers supérieurs ont poussé leurs hommes à organiser une mutinerie. Lorsque d'autres unités furent envoyées pour réprimer la mutinerie, elles se joignirent à elles. Bientôt, les rebelles locaux rejoignirent les soldats mutinés et s'emparèrent d'Herat. Les conseillers militaires soviétiques et leurs familles présents dans la ville furent massacrés. Avec l'aide soviétique, la réponse du gouvernement a été coordonnée par le vice-président Hafizullah Amin, qui a envoyé une importante force militaire. Après de violents combats, qui comprenaient de vastes frappes aériennes du gouvernement contre les rebelles, la ville a été reprise. Bien que la plupart des mutins et des rebelles aient été tués, un grand nombre ont réussi à s'échapper et rejoignent déjà d'autres forces rebelles dans les campagnes."
 AFG_War.7.d:0 "Le gouvernement afghan du président Nur Muhammad Taraki a subi un coup dur lorsqu'il a perdu le contrôle d'Herat au profit des rebelles. La ville a été perdue après que plusieurs unités de l'armée se sont mutinées, ont rejoint les rebelles locaux et ont tué des loyalistes du gouvernement. Dans la foulée, les conseillers soviétiques et leurs familles furent également massacrés par les rebelles. Nos conseillers à Kaboul ont aidé le gouvernement à réagir et nous avons veillé à ce que les rebelles soient correctement traités lorsque les forces gouvernementales ont repris la ville. Cependant, cet incident indique que la situation en Afghanistan devient de plus en plus chaotique. Bien que le président Taraki se consacre à la transformation de son pays selon des principes socialistes, il avance beaucoup trop rapidement pour le peuple. En outre, il s'est révélé paranoïaque et ses purges réduisent sa propre base de soutien. Nous devrons surveiller la situation de près, car nous avons investi massivement dans le pays et nous ne pouvons pas nous permettre de voir un dirigeant faible détruire tout ce que nous et le peuple afghan espérons réaliser."
 AFG_War.8.d:0 "À la suite du désastre d'Herat, le président afghan Nur Muhammad Taraki a été poussé à nommer Hafizullah Amin au poste de Premier ministre. L'étoile montante d'Amin a provoqué une division au sein de la faction dirigeante des Khalqistes du PDPA. Amin a consolidé sa propre base de soutien au sein de l'armée et son élévation au poste de Premier ministre indique que la lutte pour le pouvoir ne joue pas en faveur du président Taraki. Cela a inquiété les Soviétiques, car Amin semble plus indépendant que Takari en faisant des ouvertures à Washington et en remettant en question l'influence soviétique sur Kaboul. Plus important encore, il a résisté aux tentatives de médiation des Soviétiques entre lui et Taraki. Les Soviétiques craignent que leur rivalité pour le pouvoir ne fasse qu'affaiblir le régime. Au grand dam des Soviétiques, lors d'un récent voyage international du président Taraki, Hafizullah Amin a réussi à retirer quatre de ses fidèles de l'armée, augmentant ainsi les tensions entre les deux hommes."
 AFG_War.9.d:0 "Le conflit au sein de la faction Khalq au pouvoir du PDPA entre le président Nur Muhammad Taraki et le Premier ministre Hafizullah Amin a pris fin aujourd'hui. Les tensions se sont récemment intensifiées à la suite d'une réunion du Comité central au cours de laquelle le président a proposé la création d'un nouveau gouvernement de coalition avec les Parchamites pour réunifier le PDPA. Taraki appliquait les recommandations de Moscou mais le Premier ministre Hafizullah Amin s'est opposé à ces suggestions, a rallié ses partisans et a bloqué le président. Cela a rendu Taraki et les Soviétiques furieux. Le président a ensuite tenté de destituer Amin de ses fonctions en l'affectant à l'étranger en tant qu'ambassadeur, ce qu'Amin a refusé. Finalement, Taraki a invité Amin au palais présidentiel pour résoudre la crise. Un Amin suspect a mobilisé ses alliés militaires et à son arrivée, lui et ses partisans ont essuyé des tirs. Amin s'est échappé dans sa voiture et l'armée a rapidement agi en arrêtant Taraki et ses alliés de la faction Khalq."
 AFG_War.10.d:0 "Le président Nur Muhammad Taraki étant démis du pouvoir, Hafizullah Amin a rapidement pris le poste de président. Son ascension au pouvoir a été rapidement confirmée en Afghanistan et par les Soviétiques qui l'ont exhorté à ralentir le rythme de la transformation socialiste et à élargir sa base de soutien en unifiant le PDPA. Au lieu de cela, le président Amin a agacé Moscou en leur demandant de remplacer leur ambassadeur à Kaboul. Il a également étendu les purges, paralysant encore davantage le gouvernement et l'armée afghans, ciblant cette fois les partisans de Taraki. Les défections et les troubles n'ont fait qu'augmenter. Amin refuse de ralentir les réformes et n'ouvrira pas de négociations avec la faction Parcham ou les loyalistes de Taraki au sein du parti PDPA. En plus de tout cela, son gouvernement a récemment annoncé le décès de l'ancien président Taraki des suites d'une maladie, même si la plupart des témoignages suggèrent qu'il a été étranglé à mort sur ordre d'Amin, mettant ainsi fin à tout espoir de réconciliation."
 AFG_War.11.d:0 "Le gouvernement soviétique et les dirigeants du parti PDPA craignaient que les purges et les réformes radicales de l'ancien président Nur Muhammad Taraki ne poussent trop les Afghans. Cependant, l'espoir que son successeur, le président Hafizullah Amin, ralentisse la détérioration s'est évaporé. Au lieu de tendre la main à la faction Parcham ou de tenter de se réconcilier avec les partisans de l'ancien président Taraki, Amin a plutôt intensifié la portée et la violence de sa purge contre les deux groupes. Son exécution de Taraki a non seulement intensifié les divisions du PDPA, mais a également rendu furieux les Soviétiques qui voulaient désespérément une réconciliation. En dehors des luttes de pouvoir désordonnées, les campagnes semblent presque entièrement perdues pour le gouvernement. L'armée est largement paralysée en raison des purges et de la politisation de ses officiers. En outre, de nombreux soldats font défection vers les rebelles en leur apportant des armes, des tactiques modernes et des renseignements. De nombreux dirigeants du PDPA à Kaboul implorent l'aide des Soviétiques pour empêcher l'effondrement du gouvernement."
 AFG_War.12.d:0 "Les rapports en provenance d'Afghanistan sont incroyablement troublants. L'armée cesse en grande partie de fonctionner alors que le président Hafizullah Amin supervise une campagne d'effusion de sang massive contre les rivaux de gauche. Tout cela a permis à des États hostiles de financer et de diriger des rebelles qui dirigent désormais la quasi-totalité des campagnes. Nous avons investi massivement en Afghanistan et formé un cadre dévoué de communistes afghans en attente d'un leadership approprié. Nous avons récemment reçu une proposition de la faction Parcham, plus modérée, du PDPA. Ils suggèrent que nous aidions le peuple afghan à retirer Amin et sa violente cabale du pouvoir et à faire entrer les Parchamites. Les Parchamites prétendent qu'ils mettront fin aux luttes intestines, établiront un gouvernement de coalition et rétabliront la confiance du peuple dans le gouvernement. La décision nous appartient désormais : devons-nous déployer des forces militaires soviétiques pour éliminer Amin et sauver le socialisme en Afghanistan, ou le laisser s'effondrer et risquer l'apparition d'un nouveau régime antisoviétique à notre frontière."
 AFG_War.13.d:0 "Après une planification minutieuse, nous avons lancé l'opération visant à sécuriser l'Afghanistan et à éliminer le tyran Hafizullah Amin. L'armée afghane s'est fortement dégradée en raison de la montée des rebelles et des vagues de purges lancées par le régime d'Amin. Nos conseillers au sein de ces unités ont réussi à verrouiller les armes, à mettre les armes lourdes en maintenance et à assurer que les officiers importants étaient présents à la fête le soir de notre intervention. À Kaboul, nous avons réussi à transporter par avion des troupes aéroportées d'élite qui se sont rapidement déplacées pour sécuriser les bâtiments clés et l'aéroport. Le président Amin organisait une somptueuse fête au palais Tajbeg, à l'extérieur de Kaboul. Une équipe d'intervention des forces spéciales et du KGB a mené l'assaut, réussissant à maîtriser la Garde présidentielle et à mettre fin à la vie du cruel tyran. À ce moment-là, deux divisions de nos troupes ont traversé la frontière et ont rapidement commencé à occuper les principales villes. Nous n'avons rencontré aucune résistance et il ne fait aucun doute que l'armée afghane accueille volontiers notre aide."
 AFG_War.14.d:0 "L'Afghanistan étant sécurisé par les troupes soviétiques, Babrak Karmal est rapidement apparu à Kaboul et a été proclamé nouveau président de l'Afghanistan. Bien que le président Karmal ait affirmé qu'il était dans le pays depuis des mois pour travailler secrètement contre le régime tyrannique du président Amin, la plupart des observateurs pensent que Moscou l'a fait venir par avion une fois que leurs forces ont sécurisé Kaboul. Le président Karmal a remercié les Soviétiques d'avoir accepté l'invitation du gouvernement et du peuple afghans à les aider dans ces moments difficiles. Il a déjà promis la libération des prisonniers politiques et une amnistie générale. En outre, il a promis d'établir des institutions démocratiques et d'organiser prochainement des élections. Son annonce est saluée par les partisans du PDPA, épuisés par des années de luttes intestines, mais de nombreux Afghans sont sceptiques quant à la possibilité que ces nobles promesses soient tenues tant que les troupes soviétiques restent en place. Déjà, les opposants présentent le président Karmal comme une marionnette illégitime et appellent à un retrait immédiat des Soviétiques."
 AFG_War.15.d:0 "Le gouvernement soviétique a décidé lors d'une récente réunion du Comité central du plan de retrait d'Afghanistan. Le plan accepté verra les troupes soviétiques partir dignement après avoir établi un gouvernement amical et stable pour le peuple afghan. Les troupes soviétiques ont sans aucun doute accompli leur devoir et au-delà, mais le moment est venu pour le peuple afghan de mener le combat. La première phase verra les combats passer des soldats soviétiques aux soldats afghans. La prochaine phase appelle le gouvernement afghan à lancer une politique de réconciliation et à élargir sa base de soutien en faisant appel à d'anciens ennemis. Enfin, l'Union soviétique s'efforcera d'accorder au gouvernement afghan une reconnaissance internationale et de couper l'aide étrangère aux moudjahidines."
 AFG_War.16.d:0 "L'armée soviétique a confirmé que ses forces ne menaient plus d'opérations de combat actives contre les combattants rebelles en Afghanistan. L'armée soviétique a ajouté qu'elle réagirait en cas d'attaque, mais que les opérations de combat devaient désormais être dirigées par les Afghans eux-mêmes. L'armée afghane pourra toujours faire appel à l'artillerie, à la puissance aérienne et au soutien logistique soviétiques pour ses propres opérations. Les Soviétiques ont indiqué que même ce soutien diminuerait lentement à mesure que les forces armées de la République démocratique d'Afghanistan trouveraient leur place. Les analystes notent que l'armée afghane est connue pour ses taux de désertion et son affaiblissement depuis l'intervention soviétique, mais un afflux massif d'armes et de nouvelles incitations financières sont attendus sous peu. Les Soviétiques espèrent que ce soutien permettra de relancer l'armée."
 AFG_War.17.d:0 "Le gouvernement soviétique et les dirigeants des services de renseignement concluent depuis longtemps que le président Babrak Karmal, bien que fidèle à l'Union soviétique, a utilisé l'aide soviétique pour consolider son emprise à Kaboul et qu'il n'est pas intéressé à réaliser l'unité nationale en Afghanistan. Le chef du renseignement afghan, Mohammad Najibullah, s'est révélé être un responsable très efficace. Il a impressionné les observateurs soviétiques et son statut de leader pachtoune religieux et rural signifie qu'il pourrait plaire à la plupart des moudjahidines. Bien que le président Karmal ait résisté, il a finalement accepté de nommer Najibullah au Secrétariat et de faire du département du renseignement son propre ministère."
 AFG_War.18.d:0 "Récemment, l'Union soviétique a utilisé la pression diplomatique et ses conseillers à travers Kaboul pour influencer le président afghan Babrak Karmal afin qu'il accepte l'arrivée de Mohammad Najibullah au poste de secrétaire général du parti PDPA. En quelques semaines, Najibullah a affirmé qu'une direction collective avait été établie avec lui et Karmal, qui avaient conservé plusieurs postes de direction. Les Soviétiques sont satisfaits de ce changement et exhortent Najibullah à consolider lentement son pouvoir pour préserver la dignité de Karmal. Cependant, au sein du PDPA, il est devenu clair que Karmal conserve une certaine influence et que Najibullah dépend largement de son contrôle sur un appareil de renseignement vaste, impitoyable et efficace. On ne sait pas encore si cela entraînera de futurs conflits."
 AFG_War.19.d:0 "Les Soviétiques avaient exhorté Mohammad Najibullah à sevrer lentement Babrak Karmal du pouvoir, par respect pour sa loyauté envers l'Union soviétique. Cependant, Najibullah affirme désormais qu'après des mois de tensions, la situation est intenable. Récemment, il a fourni des preuves montrant que Karmal le sapait en privé et publiquement et avait récemment affirmé qu'il reviendrait bientôt en tant que secrétaire général. Najibullah a également ajouté que Karmal est largement opposé à ses idées de réconciliation nationale et utilise son soutien au sein du parti pour le critiquer. Cette dernière information entrave directement les efforts soviétiques pour un retrait réussi, et ils ont donné la permission à Najibullah d'agir. Plusieurs jours après avoir obtenu l'approbation, lors d'une réunion du PDPA, Najibullah a demandé au parti de retirer à Karmal ses titres de parti. Babrak Karmal accepte alors une offre soviétique de s'exiler à Moscou où il recevra des fonds et un appartement. Najibullah est désormais fermement aux commandes."
 AFG_War.20.d:0 "Le président afghan Mohammad Najibullah a récemment annoncé une politique de réconciliation nationale. Il a déclaré que la nouvelle constitution limiterait le pouvoir présidentiel, serait inclusive et a promis que l'adhésion au PDPA n'était pas une condition pour exercer des ministères. Dans son discours, Najibullah a fait cinq offres. L'une d'entre elles était le cessez-le-feu immédiat des forces gouvernementales, qui ne riposteraient que si elles étaient attaquées par des rebelles. Sa deuxième proposition consistait à proposer un partage du pouvoir avec ce qu'il appelait les forces contre-révolutionnaires. La troisième était une amnistie générale pour les combattants ennemis, tandis que les quatrième et cinquième promesses étaient des garanties que le gouvernement respecterait la culture afghane et adhérerait à l'islam. Pour éloigner davantage le régime du communisme, il a également rebaptisé le pays République d'Afghanistan. Les Soviétiques saluent cette nouvelle politique comme un moyen d'intégrer l'opposition dans les rangs du gouvernement. Cependant, de nombreux membres du PDPA lui reprochent de trahir les valeurs du parti et de nombreux groupes moudjahidines devraient le rejeter."
 AFG_War.21.d:0 "Ahmad Shah Massoud a longtemps été une épine dans le pied des Soviétiques et du gouvernement afghan. Ses exploits dans la défense de la vallée du Panjshir et ses interviews dans les médias ont fait de lui une figure nationale. Récemment, Massoud a eu des entretiens secrets avec les services secrets soviétiques au sujet d'un cessez-le-feu. Massoud a indiqué qu'il était prêt à mettre un terme aux combats tant que les forces soviétiques et gouvernementales resteraient en dehors du Panjshir et de ses environs. Les Soviétiques ont demandé au président Mohammad Najibullah d'accepter ce cessez-le-feu, et s'il est respecté, cela pourrait ouvrir la voie à Massoud et à ses alliés pour rejoindre le gouvernement. Cependant, si Najibullah accepte un cessez-le-feu et donne essentiellement à Massoud carte blanche sur ses terres, il risque de s'aliéner les partisans de la ligne dure du PDPA."
 AFG_War.22.d:0 "Le cessez-le-feu entre le gouvernement afghan et le commandant militant Ahmad Shah Massoud reste intact. L'accalmie des combats a permis aux unités afghanes présentes dans la zone de se regrouper et les commandants sur le terrain demandent l'autorisation de lancer de nouvelles offensives contre Massoud. Ces commandants, ainsi que les partisans de la ligne dure du PDPA, affirment que le cessez-le-feu actuel donne l'impression que le gouvernement est faible et que si Massoud décide de cibler le retrait des troupes soviétiques le moment venu, ce serait désastreux. D'un autre côté, Massoud est apparemment prêt à accepter un poste ministériel et à rejoindre le gouvernement s'il lui est proposé. Faire venir Massoud stabiliserait une partie du pays et aiderait à soutenir le programme de réconciliation nationale. Cependant, de nombreux dirigeants du PDPA craignent que de telles mesures ne conduisent à la fin de leur parti et de leur régime."
 AFG_War.23.d:0 "Les Iraniens parrainent plusieurs partis présumés de résistants. Cependant, ces hommes sont généralement étrangers et se livrent pour la plupart au banditisme. Ils rendent la situation dans l'ouest de l'Afghanistan très difficile et paralysent une grande partie de nos forces. Dans le cadre de la récente annonce de réconciliation nationale, le président Najibullah a demandé à ses ministres s'il devait utiliser les contacts soviétiques et demander aux Iraniens d'accepter un cessez-le-feu entre les forces gouvernementales et ces partis. Avec le temps, nous pourrons éventuellement réintégrer ces dirigeants dans le gouvernement et renforcer le pays. De nombreux membres du cabinet expriment cependant leur mécontentement face à la proposition, car l'incorporation de ces partis affaiblirait en fin de compte le PDPA et l'avenir du régime."
 AFG_War.24.d:0 "Le régime de Kaboul, par l'intermédiaire d'intermédiaires soviétiques, a proposé un cessez-le-feu aux partis moudjahidines opérant depuis notre territoire. Après une période de six mois, les chefs des partis seront intégrés au gouvernement central tandis que les combattants auront le choix de rejoindre l'armée afghane. La proposition, si elle est acceptée, mettrait fin aux combats le long de notre frontière et nous ne serions plus impliqués dans les combats en Afghanistan. Cependant, un tel accord nous prive de tout rôle dans la détermination de l'avenir de l'Afghanistan, ce qui pourrait conduire à l'émergence d'un régime anti-iranien. Nos options sont de persuader les parties d'accepter le cessez-le-feu et de nous laver les mains de l'Afghanistan, ou de rejeter l'offre et de continuer à soutenir les Moudjahidines qui continuent d'avancer vers la victoire finale."
 AFG_War.25.d:0 "L'ouest de l'Afghanistan est relativement paisible depuis que les partis moudjahidines basés en Iran et le gouvernement afghan sont parvenus à un accord de cessez-le-feu. Le moment est désormais venu pour le régime du président Mohammad Najibullah d'incorporer ces groupes au gouvernement central, sous peine de risquer une reprise des combats. Bien que Najibullah ait offert plusieurs postes mineurs aux partis, les moudjahidines soutenus par l'Iran ont répliqué en exigeant davantage de postes au sein du gouvernement et de l'armée. Accepter leurs demandes diluerait le pouvoir et l'influence du PDPA, mais contribuerait grandement à stabiliser le pays. Ce serait la quintessence du partage du pouvoir et, même si le pouvoir du centre serait affaibli, cela pourrait sauver la nation afghane. Les Soviétiques souhaitent vivement que nous acceptions, mais de nombreux hauts responsables du PDPA ont exprimé leur inquiétude quant au risque de destruction future du PDPA à Kaboul en intégrant les partis. C'est peut-être la meilleure option pour mettre fin aux négociations, reprendre les combats et les forcer à capituler selon nos conditions."
 AFG_War.26.d:0 "Les groupes contre-révolutionnaires les plus importants et les plus brutaux proviennent des soi-disant partis basés au Pakistan. Ces groupes bénéficient de volontaires étrangers, de l'aide et de la formation des services de renseignement et de l'armée pakistanais. Ces partis sont pour la plupart religieux et traditionnellement farouchement opposés à notre gouvernement. Cependant, conformément au plan de réconciliation nationale, le président Mohammad Najibullah envisage d'utiliser l'aide soviétique pour offrir à ces groupes un cessez-le-feu et une éventuelle incorporation dans un gouvernement de partage du pouvoir. La décision est maintenant de savoir s'il faut proposer le cessez-le-feu et, espérons-le, ramener la stabilité dans le sud de l'Afghanistan et dans la région de Kaboul, ou s'il refuse de le faire. Les opposants au cessez-le-feu au sein du PDPA préviennent que l'incorporation de ces partis pourrait rendre instable un gouvernement d'unité. En outre, l'ajout de ces groupes, pour la plupart pachtounes, au gouvernement et à l'armée pourrait conduire à la destruction du PDPA."
 AFG_War.27.d:0 "Des agents soviétiques ont proposé aux groupes moudjahidines opérant depuis Peshawar un cessez-le-feu et une éventuelle incorporation au gouvernement. Nous pouvons soit pousser les parties à accepter et à respecter le cessez-le-feu, soit les inciter à le rejeter. Le ministère des Affaires étrangères suggère que l'incorporation de ces partis pourrait être à notre avantage et conduire à un gouvernement plus amical à Kaboul. Plus important encore, un tel scénario pourrait garantir la fin définitive du problème du Pachtounistan. Cependant, de hauts responsables de l'armée et des services de renseignement s'opposent au cessez-le-feu. Ils voient cette offre comme une indication de l'affaiblissement du régime de Kaboul et estiment que si les Moudjahidines que nous soutenons peuvent finalement gagner, cela garantira que nos objectifs seront atteints."
 AFG_War.28.d:0 "Le cessez-le-feu de six mois a largement tenu bon avec les parties pakistanaises. Cela a apporté une période de paix sans précédent dans le sud de l'Afghanistan et à Kaboul. Lors des négociations sur l'incorporation des partis, nous leur avons offert un petit pourcentage de sièges et une certaine force ministérielle. Ils réclament cependant au moins quarante pour cent des sièges et certains ministères de premier plan. Certains responsables affirment que nous devrions les accepter et les intégrer au gouvernement pour montrer au peuple que c'est le PDPA qui a apporté la paix. Une telle popularité nous aiderait lors des prochaines élections. D'autres, notamment les extrémistes, veulent les rejeter et relancer les combats. Ils craignent que ces partis ne sapent la souveraineté afghane avec leur position pro-pakistanaise et craignent que le PDPA ne finisse par devenir un parti minoritaire si davantage de groupes rebelles sont incorporés. Le président doit décider s'il convient d'incorporer ces partis ou de poursuivre la guerre."
 AFG_War.29.d:0 "Des représentants de l'Union soviétique, des États-Unis, du Pakistan et de la République d'Afghanistan ont signé un accord final en Afghanistan pour résoudre la guerre. Dans cet accord, le Pakistan et l'Afghanistan ont convenu de normaliser leurs relations et de s'engager à ne pas ingérence. Cela répond à l'objectif soviétique de légitimer leur client à Kaboul. Les Soviétiques ont convenu d'un calendrier pour son retrait. En outre, les États-Unis se sont engagés à mettre un terme à leur soutien aux groupes moudjahidines en Afghanistan. Les Soviétiques doivent également couper les armes à la République d'Afghanistan. Les États-Unis et l'Union soviétique ont accepté de se porter garants de l'accord. Beaucoup saluent cet accord comme le début de la paix pour l'Afghanistan. Cependant, les observateurs notent que les Moudjahidines n'ont pas été autorisés à participer et beaucoup doutent de leur capacité à honorer l'accord."
 AFG_War.30.d:0 "Les Accords de Genève récemment conclus proposent un calendrier pour le retrait soviétique, objectif principal de notre politique afghane. L'accord stipule également que nous devons arrêter le flux d'armes vers les moudjahidines. Cependant, les dirigeants de la CIA et du Congrès nous exhortent à autoriser la poursuite des armes, d'autant plus que les Pakistanais sont disposés à poursuivre nos opérations. Pendant des années, les Soviétiques nous ont miné à travers le monde et ont causé la mort d'un grand nombre de nos citoyens et alliés. Ils affirment que nous devons continuer à les faire saigner pour leurs actes. D'autres membres de l'administration nous exhortent à tenir nos promesses et à mettre un terme au conflit. Ils craignent que la poursuite des armements ne déstabilise davantage l'Afghanistan et n'entraîne des conséquences imprévues."
 AFG_War.31.d:0 "Les accords de Genève récemment conclus sur papier ont permis de garantir plusieurs de nos objectifs visant à garantir un retrait digne de l'Afghanistan. Nous avons donné au président Mohammad Najibullah et à son gouvernement une plus grande légitimité internationale et fixé un calendrier pour notre retrait. Les Américains et les Pakistanais ont également convenu de couper le financement des moudjahidines. Au cours des négociations, nous avons promis à Najibullah une aide militaire continue pour l'amener à signer. Nous devons maintenant décider si nous continuerons ou non à fournir une aide militaire. Beaucoup de nos conseillers militaires et du renseignement estiment que nous devrions continuer à soutenir Najibullah pour préserver nos engagements et garantir que nous laissons derrière nous un Afghanistan stable. Ils doutent également que les Américains honorent leurs propres engagements. D'autres conseillers suggèrent de respecter l'accord et d'arrêter les livraisons d'armes. L'expérience en Afghanistan s'est déjà révélée trop coûteuse et se laver les mains est peut-être la meilleure approche."
 AFG_War.32.d:0 "Conformément aux Accords de Genève, nos forces ont commencé leur retrait d'Afghanistan. Conformément à l'accord, il s'agit d'un retrait anticipé. En deux mois, plus de la moitié de nos forces sont de retour sur le territoire soviétique. La phase finale de retrait est sur le point d'avoir lieu et devrait durer encore six ou sept mois. Toutefois, le retrait ne s'est pas déroulé sans incidents. Nos forces ont parfois essuyé des tirs nourris de la part des combattants moudjahidines. Nous nous sommes plaints amèrement de ces incidents auprès des Américains et des Pakistanais, mais ils prétendent n'avoir aucune influence sur les commandants sur le terrain. Certains au Kremlin affirment que l'augmentation de la violence et la détérioration de la sécurité signifient que les accords de Genève sont ignorés et que nous devrions temporairement arrêter le retrait pour forcer leur respect. Ce n'est pas une option réaliste, mais il a été décidé d'autoriser les commandants à arrêter temporairement le retrait afin de faire pression sur l'ennemi. Mais en fin de compte, l'Union soviétique n'arrêtera pas le retrait."
 AFG_War.33.d:0 "Le commandant de notre opération de retrait réussie a été le dernier soldat soviétique à franchir officiellement l'Oxus et à marquer la fin de notre déploiement en Afghanistan. La dernière phase de retrait a été achevée même si le harcèlement des Moudjahidines s'est poursuivi. Nous avons temporairement interrompu le retrait, mais les moudjahidines ont pris notre mesure et nous avons dû reprendre. Malgré ces problèmes, nous avons ramené nos hommes sains et saufs et remis des bases et du matériel lourd à la République d'Afghanistan. C'était le cadeau d'adieu de nos soldats qui ont accompli leur devoir international. Nous gardons la tête haute alors que nous laissons le peuple afghan dans une position de stabilité et dans les moyens de défendre son mode de vie. Nos propres troupes ont traversé la frontière en convois, avec le sourire et en agitant des drapeaux. Nous en avons fait part aux médias locaux et internationaux pour démontrer que nous sommes partis de notre propre chef et non dans le désarroi ou la défaite."
 AFG_War.34.d:0 "Encerclées par les médias, les dernières troupes soviétiques franchissent l'Oxus, marquant la fin de l'intervention soviétique en Afghanistan. Les soldats soviétiques ont traversé la frontière avec de larges sourires et en agitant des drapeaux. Même si les Soviétiques véhiculaient l'image de soldats triomphants revenant d'une mission réussie, des rapports en provenance d'Afghanistan suggèrent que ces troupes étaient constamment confrontées à des attaques de moudjahidines. La situation sécuritaire est désormais entre les mains de la République d'Afghanistan, soutenue par les Soviétiques, et il reste à voir si elle sera capable de supporter le fardeau de la lutte contre les nombreux groupes moudjahidines et de réunifier un pays ravagé par la guerre. Les États-Unis ont salué le retrait soviétique, de nombreux responsables et dirigeants du Congrès le qualifiant de fin d'une occupation étrangère brutale. Beaucoup ont ajouté que la libération définitive de l'Afghanistan serait la suppression du régime PDPA à Kaboul. Les Soviétiques n'ont pas tardé à critiquer les déclarations américaines, les qualifiant de menaces irresponsables et ouvertes contre le gouvernement légitime de l'Afghanistan."
 AFG_PAK.24.d:0 "Aujourd'hui, nous avons reçu une lettre d'Afghanistan. Ils y demandent la création d'une zone autonome du Pachtounistan autour des zones tribales sous administration fédérale. Après en avoir discuté avec votre cabinet, il a été décidé que..."

 Afghani_Coup.1.d:0 "Le Hizb-i Sirri Ittihad est le seul parti politique de notre pays qui vise réellement à établir une république. Il s'agit d'un groupe très diversifié fondé à la fin des années 1940. Ils estiment qu'un gouvernement républicain était le seul moyen de mettre fin à la discrimination ethnique et religieuse en Afghanistan. Nous avons désormais détecté le prétendu plan de coup d'État lors de notre célébration du Norouz en mars. Comment pouvons-nous gérer cela ? Leurs motivations sont liées à la vision du monde de leurs dirigeants, à nos politiques ethniques et à la question du Pachtounistan."
 Afghani_Coup.2.d:0 "Le Hezb-i Sirri Ittihad a réussi un coup d'État, la monarchie a été renversée et nous organisons les prochaines élections. Des émeutes ont éclaté à travers le pays suite à ce changement soudain de régime, et la nouvelle de nos récentes actions se répand sur la scène mondiale. Nous avons établi un petit gouvernement provisoire avec Ismael Balkhi à la barre avant de tenir des élections et de déclarer la première république. Nos principaux dirigeants travaillent actuellement sur une nouvelle constitution qui inclura les principes d'une république. Avec des membres du parti de toutes les lignes ethniques et sectaires, de toutes les régions de notre pays, y compris le nord, l'ouest et le centre, nous sommes non seulement une démocratie, mais nous sommes également une démocratie diversifiée représentant tous les horizons. Nous ne sommes plus gouvernés par des dieux et des rois, nous sommes gouvernés par les principes de la démocratie élaborés pour la première fois dans la Grèce antique. Nous renaîtrons de nos cendres en tant que nouvel Afghanistan."
 
 Afghanistan.1.d:0 "Pour la première fois depuis de nombreuses années, notre Premier ministre, Shah Mahmud, a autorisé des élections à l'Assemblée nationale relativement libres, et le septième Parlement afghan qui en résultera sera voté. De nombreux partis en lice ont des opinions beaucoup plus modérées et libérales, le libéralisme étant une nouvelle idéologie à venir à la table des négociations en Afghanistan. Une philosophie politique originaire de l'Occident au siècle des Lumières. Elle repose sur la liberté, le consentement des gouvernés et l'égalité devant la loi. De nombreux partis envisagent d'exprimer leurs critiques à l'égard de notre gouvernement et des institutions traditionnelles, permettant également aux groupes politiques d'opposition de prendre vie et envisagent d'adopter des réformes libérales telles que la liberté de la presse."
 Afghanistan.2.d:0 "La question du Pachtounistan est l'un des développements politiques les plus importants en Afghanistan après la fin de la Seconde Guerre mondiale. La ligne Durand a été établie après que l'Afghanistan a perdu certains territoires à l'est et au sud de l'Afghanistan qui étaient habités par les Pachtounes en 1893. Cependant, depuis la partition de l'Inde en 1947, les gouvernements afghans ont affirmé que la ligne n'était jamais censée être une frontière internationale et ont encouragé les communautés pachtounes à organiser des « excursions » à travers la frontière vers leur territoire légitime, et une telle perturbation s'est produite lorsqu'un Un groupe de tribus pachtounes afghanes a envahi le col de Bogra, le gouvernement afghan niant que les envahisseurs comprenaient des troupes afghanes. En raison du manque de coopération du gouvernement afghan, le Pakistan a imposé un blocus au commerce et aux voyages en Afghanistan, mais il est prêt à négocier pour discuter de questions économiques et culturelles d'intérêt commun pour les deux pays."

 HVA.1.d:0 "La Helmand and Arghandab Valley Authority (HAVA), basée à Lashkar Gah, en Afghanistan, a été créée le 4 décembre 1952 en tant qu'agence du gouvernement afghan. Il a été calqué sur la Tennessee Valley Authority aux États-Unis, avec un mandat couvrant les terres des provinces de Farah, Ghazni, Helmand, Herat et Kandahar. La HAVA a été créée pour gérer le développement économique des vallées du Helmand et de l'Arghandab, principalement par l'irrigation et le développement des terres agricoles le long des rivières Helmand et Arghandab, dans le cadre d'un plan qui devait être d'une importance primordiale pour l'économie future de l'Afghanistan."
 AFG_PM.1.d:0 "Le rôle de Shah Mahmud Khan en tant que Premier ministre a amené beaucoup de notre pays en termes de politiques progressistes, telles que des élections libres, mais après l'échec de sa tentative de projet d'irrigation très ambitieux dans l'ouest de l'Afghanistan, le grave déclin économique de ces derniers mois et les relations tendues avec le Pakistan, son heure est venue et le Parlement a présenté une motion de censure, l'obligeant à démissionner. Nous avons désormais le choix entre Mohammed Daoud Khan, un homme politique progressiste, ou Ghulam Muhammad Ghobar, qui choisirons-nous ?"
 SocDemAfg.1.d:0 "L'un des principaux objectifs du Premier ministre était l'expérience de Shah Mahmud en faveur d'une plus grande tolérance politique et d'une plus grande libéralisation. Encouragé par de jeunes membres de l'élite politique instruits en Occident, le Premier ministre a autorisé des élections à l'Assemblée nationale nettement moins contrôlées que par le passé ; le résultat fut le « parlement libéral » de 1949. Il toléra l'activité des groupes politiques d'opposition. Un syndicat étudiant nouvellement formé a non seulement fourni un forum de débat politique, mais a également produit des pièces de théâtre critiques à l'égard de l'islam et de la monarchie. Les journaux ont critiqué le gouvernement et de nombreux groupes ont commencé à exiger un système politique plus ouvert. Mais la libéralisation est allée plus loin que ce que le Premier ministre ou quiconque aurait pu imaginer, et il a donc commencé à sévir. Le syndicat étudiant a été dissous en 1951 ; les journaux critiquant le gouvernement ont été fermés ; de nombreux dirigeants de l'opposition ont été emprisonnés. Le Parlement élu en 1952 constituait un grand pas en arrière par rapport à celui qui avait été élu en 1949. La brève expérience de politique ouverte était terminée."
 AFG_REP.1.d:0 "Le Hezb-i Sirri Ittihad, dirigé aujourd'hui par Ismael Balkhi, avec l'approbation de la Loya jirga, a rédigé une nouvelle constitution déclarant la République d'Afghanistan. Le parti et ses paramilitaires ainsi que ses fervents partisans prirent le pouvoir et établirent un gouvernement républicain. Des partisans dévoués du gouvernement précédent ont été emprisonnés ou exécutés, et des politiques sont actuellement soumises au Parlement pour débat concernant l'égalité de traitement de tous les groupes ethniques et religions dans le pays. Vive la République d'Afghanistan !"

 USA_AFG.1.d:0 "Aujourd'hui, nous avons été accueillis par un vol de l'US Air Force à notre aéroport, avec nul autre que le président [USA.GetLeader]des États-Unis d'Amérique. Il a rencontré notre roi Mohammed Zahir Shah au palais Tajbeg. Bien que la visite ait été informelle, de nombreux sujets ont été discutés, notamment le maintien des relations diplomatiques américaines avec le pays. Qu'Allah bénisse nos frères d'Occident !"
 AFG_SOV.1.d:0 "Aujourd'hui, nous avons reçu une lettre d'Andreï Vychinski, ministre des Affaires étrangères de l'Union soviétique. Il affirme la ferme opposition des Soviétiques à la mission de l'ONU dans notre pays, que c'est l'oeuvre des impérialistes américains, que tout cela n'est qu'une ruse et que les Américains envisagent de construire des routes et des aérodromes militaires près de la frontière. Il nous a été envoyé peu de temps après un projet de loi visant à nationaliser le pétrole de la région par notre septième Assemblée nationale et notre invitation à une mission d'assistance technique de l'ONU dans le pays. Ils ont visité la région de Shibarghan, au nord-ouest, bien que très proche de la frontière avec les Soviétiques, de riches gisements de pétrole y ont été découverts. Nous réfuterons cette note, ne comprennent-ils pas que notre réussite économique dépend du transport automobile et que tout le pétrole de notre pays présente un intérêt stratégique ?"
 AFG_SOV.2.d:0 "Malgré notre lettre magnifiquement écrite, le gouvernement afghan a apparemment rejeté la lettre délivrée par Andreï Vychinski concernant l'implication des États-Unis impérialistes et des Nations Unies dans l'économie afghane. Peut-être que nous essayons la mauvaise approche : au lieu de forcer le gouvernement afghan, que diriez-vous de lui offrir de l'argent et des armes ? Peut-être que cela les amènera à nos côtés. Nous envisagerons une livraison d'armes au cours de l'année prochaine. Mais pour l'instant, nous garderons une surveillance vigilante sur notre frontière sud."

 Afghanistan.10.d:0 "Aujourd'hui, l'arrestation de Mohammad Arif a eu lieu ainsi que celle de ses fervents partisans, après un court procès, il a été reconnu coupable de projet d'organiser une prise de contrôle militaire de la nation. Les rapports des services de renseignement montrent qu'il avait de nombreux partisans au sein de l'Assemblée nationale qui seraient prêts à se plier à son règne et feraient tout ce qu'il dirait. Heureusement, nous avons découvert ce complot avant que quoi que ce soit puisse en découler, espérons que cela nous maintiendra stable et dissuadera tout autre officier de planifier quelque chose de ce calibre, que cela soit un bel exemple de ce que nous faisons aux traîtres !"
 Afghanistan.3.d:0 "Aujourd'hui, nous avons décidé de libérer Abdul Ghaffar Khan, un militant indépendantiste pachtoune, célèbre pour son travail visant à mettre fin au règne du Raj britannique en Inde. C'est tout simplement trop difficile de le garder interné dans notre nation, pacifiste et musulman depuis toujours, il a fréquemment exigé que les Pachtounes aient le choix d'avoir un État indépendant nommé Pachtounistan, composé de tous les territoires pachtounes de l'Inde britannique. Avec sa liberté retrouvée, il pourra peut-être travailler en notre faveur pour amener les Pachtounes vivant actuellement au Pakistan à combattre à nos côtés."

 Afghanistan.4.d:0 "Aujourd'hui, le roi de notre nation, Sa Majesté Mohammed Zahir Shah, a prononcé un discours puissant sur la question du Pachtounistan, il a exigé que le Pachtounistan soit réintégré en Afghanistan, il est à juste titre notre peuple et mérite d'être gouverné par nous et représenté par nous, et non par le gouvernement pakistanais. Notre roi y est profondément attaché émotionnellement, car son arrière-grand-père, Sardar Sultan Muhammad Khan, le frère de l'émir Dost Muhammad Khan, avait été le dernier dirigeant afghan de Peshawar, lorsque les Sikhs l'ont chassé en 1834 sous Ranjit Singh. L'unification du Pachtounistan avec l'Afghanistan est de la plus haute importance et il ne se reposera pas jusqu'au jour où les Pachtounes retrouveront leur patrie."

 AFG_IND.1.d:0 "Aujourd'hui, nous avons reçu une lettre de l'ambassadeur afghan, marquée comme hautement confidentielle. Il déclare que, même si le Pakistan concentre la majorité de ses troupes à l'ouest, nous devrions mener une attaque surprise le long de toute la frontière pakistanaise, pour faire pression sur eux dans des négociations de paix, et une fois qu'ils se seront rendus, dans l'accord de paix qui s'ensuivra, nous recevrons tout le Cachemire. Peut-être que cela pourrait mettre un terme à notre problème persistant concernant la propriété du Cachemire."
 AFG_IND.2.d:0 "Malgré l'ambition de notre lettre, nous sommes surpris d'apprendre que le gouvernement indien a accepté notre proposition d'attaquer le Pakistan pour s'emparer de la région du Cachemire alors qu'il est occupé à nous combattre, afin de mettre rapidement fin à cette guerre. Peut-être pouvons-nous maintenant inverser l'erreur de la ligne Durand et de la division du Raj britannique. Nous avons toujours su que nous avions des amis haut placés au sein du gouvernement indien pour nous aider à gagner notre guerre."

 AFG_IND.3.d:0 "Malgré notre offre stratégique au gouvernement indien, selon laquelle il devrait attaquer le Pakistan et s'emparer de la région âprement disputée du Cachemire. Nous sommes surpris d'apprendre que notre offre a été refusée. Qui aurait cru que le gouvernement indien était si incapable de profiter d'une bonne opportunité ?"

 AFG_PAK.20.d:0 "Des rapports nous parviennent d'un quartier général de l'armée près de la frontière pakistanaise selon lesquels nous avons mené avec succès un raid contre un avant-poste militaire au Pakistan, plusieurs soldats pakistanais ont été tués et nous avons volé toutes les fournitures utiles. Nous doutons qu'il y ait des représailles, nous avons veillé à ne laisser aucune trace de notre présence. Un travail bien fait par nos garçons sur le terrain, c'est sûr !"

 AFG_PAK.21.d:0 "Des rapports affluent depuis l'une de nos bases d'opérations avancées près de la frontière pakistanaise selon lesquels une excursion que nous avons menée à l'intérieur du Pakistan pour perturber les opérations militaires a échoué, certains hommes ont été tués et de nombreux sont portés disparus au combat. Il s'agit d'un échec opérationnel, et peut-être devrions-nous repenser notre stratégie contre les Pakistanais."
 AFG_PAK.22.d:0 "Nous avons reçu un rapport après action de l'un de nos commandants les plus compétents sur le terrain à la frontière afghane, il indique que nous avons organisé avec succès un raid contre la frontière afghane, mais qu'ils n'ont pas réussi à repousser notre attaque. Lors d'une tentative de construction d'une clôture frontalière, nous avons tué trois soldats, blessé de nombreux autres et démoli des parties de la clôture, bravo !"
 AFG_PAK.23.d:0 "Malgré tous nos efforts et notre planification stratégique, notre raid frontalier contre un avant-poste militaire afghan à l'intérieur de leur pays a échoué, la majorité de nos soldats ont été tués ou ont réussi à battre en retraite. Apparemment, la rumeur circule autour de la compagnie qui a mené l'attaque, c'est qu'elle s'y attendait et qu'elle avait des mines terrestres et des emplacements de mitrailleuses à portée de main. Peut-être devrions-nous anticiper ce genre de choses la prochaine fois et riposter plus fort, montrons à ces Afghans qui est le patron ici !"

 #News Events
 Afghani_Coup.3.d:0 "La nouvelle est venue du Royaume d'Afghanistan qu'il n'est plus un royaume. L'ancien Premier ministre Shah Mahmud Khan a été exécuté aujourd'hui au centre-ville de Kaboul, son cadavre a été jeté dans les rues. Le statut du monarque régnant d'Afghanistan Mohammed Zahir Shah et du reste de la maison Barakzai est inconnu à l'heure actuelle, mettant fin à plus de 200 ans de règne royal en Afghanistan. Le parti politique, le Hezb-i Sirri Ittihad, responsable du renversement, est dirigé par un homme nommé Ismael Balkhi. Les motivations de la prise du pouvoir sont inconnues pour l'instant, mais on peut supposer qu'ils ne sont pas satisfaits des méthodes autoritaires de l'administration précédente. Tous les regards sont tournés vers le nouveau gouvernement et vers les actions qu'il entreprendra pour améliorer les conditions de vie de la population."
 Afghani_Coup.4.d:0 "Ismael Balkhi, poète et leader politique bien connu en Afghanistan, a été arrêté aux côtés de cinq autres hommes qui ont tenté un coup d'État contre le roi Mohammed Zahir Shah et ont assassiné le Premier ministre. Le gouvernement afghan a réussi à intercepter les communications à ce sujet et à réprimer cette affaire avant qu'elle n'ait lieu. Tous les membres arrêtés sont accusés de complot visant à renverser la monarchie et à établir une république. Ils prévoyaient de l'exécuter pendant la célébration de Nowruz, pour tenter de surprendre le gouvernement pendant les festivités."
 CENTO.225.d:0 "Après les récentes négociations et la détente avec le Pakistan. L'agence de presse du Pacte de Bagdad a annoncé aujourd'hui que la nouvelle République d'Afghanistan avait rejoint l'alliance. Le Pacte de Bagdad est une alliance militaire calquée sur le modèle de l'OTAN, dans laquelle les nations membres de l'alliance se sont engagées à coopérer et à se protéger mutuellement. Le but de l'organisation est de contenir l'Union soviétique en établissant une ligne d'États forts le long de la frontière sud de l'URSS."
 AFG_IND.4.d:0 "Aujourd'hui, le gouvernement indien a annoncé la déclaration de guerre au Pakistan. Le raisonnement est qu'ils apportent la stabilité à la région du Cachemire, car ils ne sont pas sûrs de ce qui pourrait arriver aux hindous de la région après une éventuelle défaite dans la guerre afghano-pakistanaise actuelle, qualifiée de « simple mesure de protection de notre peuple ethnique » par le gouvernement indien. Peut-être que cela pourrait mettre fin à la région en proie à des escarmouches et des conflits frontaliers ?"
 AFGPAKWAR.1.d:0 "Après que les tensions aient atteint des sommets absolus, l'Afghanistan a annoncé aujourd'hui son invasion du Pakistan, déclarant que cette invasion vise à empêcher de nouveaux conflits dans la région, avec pour casus belli la libération des terres légitimes sur lesquelles vivaient les Pachtounes. Des informations arrivent de Chaman, une ville proche de la frontière que les soldats afghans ont traversée sans se soucier de la population civile. Certains pays de la région boycottent l'invasion et parlent même de sanctions contre l'Afghanistan. On ne sait pas si d'autres nations s'impliqueront. L'avenir est incertain pour cette partie du monde."
 Afghanistan.6.d:0 "Aujourd'hui à Kaboul, le Gouvernement afghan a convoqué un conseil tribal trié sur le volet. Il comprenait les membres de l'Assemblée nationale. Le parlement afghan a fait une proclamation contre le Pakistan et en faveur du droit des Pachtounes à l'autodétermination. Au mépris des normes mondiales établies et des lois internationales, il a adopté une résolution rejetant unilatéralement tous les traités, conventions et accords conclus entre le gouvernement afghan et le gouvernement de l'Inde britannique. Le conseil a adopté une résolution en faveur du Pachtounistan et a déclaré nuls et non avenus l'Accord Durand de 1893, le Pacte anglo-afghan de 1905, le Traité d'indépendance de Rawalpindi de 1919, le Traité anglo-afghan de 1921 et d'autres traités et accords concernant la frontière internationale entre l'Afghanistan et le Pakistan (basés sur la ligne Durand) et concernant le statut des Pachtounes, n'ayant aucune implication juridique. De plus, pour réaffirmer cette abrogation, la Journée du Pachtounistan a été déclarée officiellement célébrée chaque année le 31 août."
 AFG_SHIA.5.d:0 "Avec la création de la nouvelle République d'Afghanistan, dirigée par Ismael Balkhi, la monarchie n'a nulle part où rester. Suite aux émeutes à travers le pays, les partisans du nouveau gouvernement ont été contraints de partir. Le palais royal a été vandalisé et la monarchie a fui le pays. On ne sait pas encore où ils sont allés, mais des rumeurs disent qu'ils auraient fui vers l'Irak ou la Jordanie, à proximité. Il n'existe aucune preuve solide et le nouveau gouvernement ne semble pas s'en soucier. Maintenant que la monarchie a disparu, nous pouvons mettre fin à la discrimination contre les Hazaras et les Tadjiks et mettre fin au favoritisme à l'égard des Pachtounes, pour instaurer une véritable égalité en Afghanistan."

