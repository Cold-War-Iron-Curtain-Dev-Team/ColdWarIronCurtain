l_french:
 # National spirit
 LOS_French_Airlift:0 "Pont aérien de secours français"
 LOS_French_Airlift_desc:0 "Des avions de transport en provenance de Hanoï et Saigon acheminent une colonne de secours du CEFEO et son ravitaillement vers Vientiane et Luang Prabang. Tant que le pont aérien tient bon, les défenseurs du Royaume se battent avec la puissance de feu, le génie et la couverture aérienne française dans leur dos."

 # Dynamic modifiers
 laos_raid_overextension:0 "Offensive trop étendue"
 laos_raid_overextension_severe:0 "Offensive trop étendue (poussée finale)"

 # Missions
 Laos_Raid_Timer:0 "Invasion du Laos"
 Laos_Raid_Timer_desc:0 "Les colonnes du Viet Minh et du Pathet Lao se dirigent vers les capitales laotiennes à l'approche de la mousson. S'ils ne peuvent pas s'emparer de Vientiane et de Luang Prabang avant que leurs lignes de ravitaillement ne s'épuisent, le raid devra être interrompu."
 Laos_Raid_LastChance_Timer:0 "Un dernier coup de pouce au Laos"
 Laos_Raid_LastChance_Timer_desc:0 "L'offensive a été ordonnée une dernière fois malgré l'épuisement des troupes. C'est la dernière chance de prendre les deux capitales laotiennes avant que l'ensemble des efforts ne s'effondre."
 Laos_Raid_Defence:0 "Tenez le Royaume"
 Laos_Raid_Defence_desc:0 "Les colonnes du Viet Minh et du Pathet Lao font irruption vers Vientiane et Luang Prabang. Les ingénieurs français ont fortifié les deux villes. Conservez au moins une capitale royale jusqu'à ce que l'offensive trop étendue s'éteigne contre la mousson et que l'invasion s'effondre d'elle-même. Perdez les deux et le Royaume ne survivra pas."
 Laos_Raid_Offensive:0 "Prenez les capitales royales"
 Laos_Raid_Offensive_desc:0 "Les colonnes traversent la frontière et la mousson arrive. Vientiane et Luang Prabang doivent être entre nos mains avant que l'offensive ne dépasse ses porteurs - chaque jour passé qui se paie en hommes, nous ne pouvons pas remplacer ce côté de la chaîne annamite.\n\nSi le temps presse et que l'une ou l'autre des capitales arbore toujours les couleurs du Royaume, le raid est terminé."
 Laos_Raid_Offensive_LastChance:0 "Un dernier coup de pouce"
 Laos_Raid_Offensive_LastChance_desc:0 "L'offensive a été ordonnée au-delà de son point culminant. Ce qui reste des fers de lance a une petite fenêtre pour contenir les deux chapiteaux, et rien derrière."
 Laos_Raid_Defence_LastChance:0 "Résister à l'assaut final"
 Laos_Raid_Defence_LastChance_desc:0 "Hanoï a lancé une dernière fois ses fers de lance épuisés. Attendez encore un peu et l'ennemi n'aura plus rien."

 # laos_raid.1 - press or call off (attacker)
 laos_raid.1.t:0 "L'offensive du Laos s'arrête"
 laos_raid.1.d:0 "Nos colonnes ont porté la guerre au plus profond du Royaume du Laos, mais les capitales tiennent toujours et nos lignes d'approvisionnement sont tendues jusqu'au point de rupture sous la mousson à venir. L'équipe conseille de consolider les acquis et de retirer les fers de lance avant qu'ils ne se fanent sur la vigne. Pourtant, une poussée finale et déterminée pourrait encore remettre les deux capitales royales entre nos mains et briser la volonté de résistance de Vientiane."
 laos_raid.1.a:0 "Passez à l'offensive - prenez les majuscules ou rien !"
 laos_raid.1.b:0 "Annulez le raid et consolidons nos gains"

 # laos_raid.2 - stalemate news
 laos_raid.2.t:0 "[GetNewspaperHeader]Le Viet Minh se retire du Laos"
 laos_raid.2.d:0 "Hanoï, [?global.date.GetDateStringNoHourLong] - Les forces du Viet Minh ont interrompu leur offensive au Laos et retiré leurs principales colonnes alors que l'approche de la mousson met à rude épreuve les routes d'approvisionnement à travers les montagnes. La campagne contre Vientiane et Luang Prabang s'est terminée sans faire tomber le gouvernement royal.\n\nLes forces du Pathet Lao restent en possession de Sam Neua et de Phongsaly, où leurs alliés vietnamiens ont contribué à établir une base hors de portée de l'administration royale. Le retrait laisse au mouvement communiste un territoire à l'intérieur du Laos à partir duquel il peut recruter et maintenir le contact avec le Viet Minh de l'autre côté de la frontière.\n\nLes avions de transport français et les troupes de secours ont contribué à soutenir les forces royales pendant l'invasion. Pour le commandement français, la fin de l'offensive allège les exigences immédiates de défense du Laos tandis que les combats se poursuivent au Vietnam. Le Royaume a survécu, mais son gouvernement n'a pas récupéré son autorité sur les provinces du nord-est."

 laos_raid.2.a:0 "Le Royaume perdure"

 # laos_raid.3 - total failure choice (LOS)
 laos_raid.3.t:0 "Le Pathet Lao est brisé"
 laos_raid.3.d:0 "Contre toute attente, notre armée a repoussé les envahisseurs au-delà de la frontière et envahi le Pathet Lao dans ses propres bastions. Hanoï, dont le raid est en ruines, signale désormais par des intermédiaires qu'elle acceptera un retour aux anciennes frontières. Nous pourrions prendre la paix et reconstruire - ou nous pourrions la refuser et porter cette guerre aux mains des communistes pendant que le monde entier regarde l'Indochine."
 laos_raid.3.a:0 "Acceptez la paix - restaurez les anciennes frontières"
 laos_raid.3.b:0 "Pas de paix ! L'Indochine française détruira les communistes !"

 # laos_raid.5 - total war news
 laos_raid.5.t:0 "[GetNewspaperHeader]Vientiane rejette la paix - La guerre s'étend en Indochine"
 laos_raid.5.d:0 "Le Royaume du Laos a rejeté l'offre de paix de Hanoï et s'est engagé à poursuivre la lutte contre le bloc communiste. Ce qui a commencé comme un raid frontalier menace désormais d'attirer le reste du monde en Indochine, alors que chaque puissance intéressée se demande si elle doit mettre son poids derrière Vientiane ou Hanoï."
 laos_raid.5.a:0 "Le monde tourne les yeux vers le Laos"

 # laos_raid.6 - attacker victory news
 laos_raid.6.t:0 "[GetNewspaperHeader]La chute des capitales laotiennes"
 laos_raid.6.d:0 "Le pari est réussi. Les forces du Viet Minh et du Pathet Lao ont pris d'assaut Vientiane et le siège royal de Luang Prabang, et le royaume du Laos est au bord de l'effondrement.\n\nLa colonne de secours française envoyée dans les villes n'a pas pu tenir les périmètres fortifiés et le gouvernement royal se disperse vers le Mékong.\n\nLe raid qui devait saigner les Français est devenu une conquête."
 laos_raid.6.a:0 "Rien ne s'interpose entre le Pathet Lao et le Mékong"
 laos_raid_capital_defense:0 "Capitale Royale Fortifiée"

 # laos_raid.7 - launch briefing to LOS
 laos_raid.7.t:0 "La guerre arrive au Laos"
 laos_raid.7.d:0 "Les divisions Viet Minh ont traversé les montagnes aux côtés de leurs auxiliaires du Pathet Lao, se dirigeant vers Vientiane et le siège royal de Luang Prabang. Mais leurs colonnes ont dépassé leurs lignes de ravitaillement et les avions de transport français acheminent déjà une force de secours et ses canons vers nos capitales. Si nous parvenons à tenir les villes et à saigner les envahisseurs jusqu'à ce que la mousson interrompe leur offensive, le raid s'effondrera et le Royaume tiendra debout. Nous avons appelé la nation aux armes - maintenant nous devons endurer."
 laos_raid.7.a:0 "Pour le Royaume !"
