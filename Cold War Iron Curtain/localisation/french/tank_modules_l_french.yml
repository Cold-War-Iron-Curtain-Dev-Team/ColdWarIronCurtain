 medium_tank_amphibious_equipment_0:0 "Char amphibie moyen de l'entre-deux-guerres"
 basic_medium_tank_chassis:0 "Châssis de char moyen de base"
 basic_medium_tank_chassis_short:0 "1938 Moyen"
 basic_medium_tank_chassis_desc:0 "Alors que les chars légers ont constitué l'épine dorsale des formations mécanisées ces dernières années, il devient évident que leur potentiel de croissance est presque épuisé. À l'avenir, nous aurons besoin d'un véhicule plus gros, tout en conservant un haut niveau de mobilité."
 improved_medium_tank_chassis:0 "Châssis de char moyen amélioré"
 improved_medium_tank_chassis_short:1 "1940 Moyen"
 improved_medium_tank_chassis_desc:0 "En s'appuyant sur l'expérience des générations précédentes de chars moyens, il est clair qu'une nouvelle conception avec une plus grande capacité de charge est nécessaire pour rester pertinente."
 advanced_medium_tank_chassis:0 "Châssis de char moyen avancé"
 advanced_medium_tank_chassis_short:0 "1943 Moyen"
 advanced_medium_tank_chassis_desc:0 "L'augmentation rapide du poids des systèmes d'armes et de la résistance du blindage nécessite un châssis encore plus grand, créant un véhicule de la taille des chars lourds précédents."
 medium_tank_chassis_desc:0 "Un châssis équilibré de taille moyenne qui offre une grande flexibilité pour construire une grande variété de véhicules."
 medium_tank_artillery_chassis_0:0 "Artillerie moyenne SP de l'entre-deux-guerres"
 medium_tank_artillery_chassis:0 "Artillerie moyenne SP"
 medium_tank_artillery_chassis_desc:0 "Un véhicule bien équilibré, principalement destiné à l'appui-feu de l'infanterie qui avance."
