 Armor_0_W:0 "Armure en acier soudé"
 Armor_0_W_desc:0 "Plaque de blindage soudée conventionnelle qui est plus facile à fabriquer et à réparer que le blindage moulé tout en offrant une protection de base fiable."
 Armor_0_C:0 "Armure en acier moulé"
 Armor_0_C_desc:0 "Une configuration de blindage moulé qui permet des formes complexes et des sections de blindage épaisses, au prix d'une production plus lente et plus exigeante."
 Armor_1_Space:0 "Armure espacée"
 Armor_1_Space_desc:0 "Plaques de blindage séparées qui améliorent la protection contre les charges creuses et certains tirs de canon automatique sans repenser complètement la coque."
 Armor_1_Comp:0 "Première armure composite"
 Armor_1_Comp_desc:0 "Première armure composite utilisant des charges en couches pour améliorer la résistance aux obus HEAT et aux armes antichar à tir direct."
 Armor_2_Comp:0 "Armure composite avancée"
 Armor_2_Comp_desc:0 "Armure composite avancée avec des charges améliorées à base de céramique et de verre pour une meilleure protection cinétique et chimique."
 Armor_3:0 "NERA de première génération"
 Armor_3_desc:0 "Blindage réactif non explosif de première génération utilisant des couches élastiques pour perturber les pénétrateurs et les jets à charge creuse."
 Armor_4:0 "NERA de deuxième génération"
 Armor_4_desc:0 "NERA de deuxième génération avec une géométrie de réseau améliorée et des matériaux réactifs plus efficaces."
 Armor_5:0 "NERA de troisième génération"
 Armor_5_desc:0 "NERA moderne utilisant des céramiques, des revêtements et des élastomères avancés pour augmenter la résistance et la protection contre les coups multiples."
 Armor_6:0 "NERA de quatrième génération"
 Armor_6_desc:0 "NERA moderne avancé utilisant les derniers matériaux composites pour une protection très élevée à un poids et un coût substantiels."
 Armor_4_DU:0 "Deuxième génération DU NERA"
 Armor_4_DU_desc:0 "NERA de deuxième génération renforcé avec des couches d'alliage d'uranium appauvri pour une protection plus élevée et un poids beaucoup plus élevé."
 Armor_5_DU:0 "Troisième génération DU NERA"
 Armor_5_DU_desc:0 "NERA moderne à uranium appauvri combinant des couches d'alliage denses avec des éléments avancés en élastomère et en céramique."
 Armor_6_DU:0 "Quatrième génération DU NERA"
 Armor_6_DU_desc:0 "Le NERA avancé à l'uranium appauvri était destiné à vaincre les menaces cinétiques et à charges creuses les plus performantes."
 Armor_0_Light:0 "Armure en alliage d'aluminium"
 Armor_0_Light_desc:0 "Blindage léger en aluminium pour véhicules amphibies, aéroportés et légers où le contrôle du poids compte plus que la protection maximale."
 Armor_1_Light:0 "Armure avancée en alliage d'aluminium"
 Armor_1_Light_desc:0 "Armure en alliage d'aluminium traité thermiquement avec une dureté et une résistance améliorées aux tirs de mitrailleuses lourdes et de canons automatiques."
 Addon_0_Comb:0 "Armure complémentaire composite"
 Addon_0_Comb_desc:0 "Panneaux de blindage composites externes qui améliorent la protection sans reconstruire le blindage de base de la coque."
 Addon_1_NERA:0 "Module complémentaire NERA I"
 Addon_1_NERA_desc:0 "Modules NERA externes qui améliorent la protection contre les charges creuses et les obus cinétiques tout en ajoutant du poids et du volume."
 Addon_2_NERA:0 "Module complémentaire NERA II"
 Addon_2_NERA_desc:0 "Modules complémentaires NERA améliorés avec de meilleurs matériaux et un remplacement plus facile après dommage."
 Addon_3_NERA:0 "Module complémentaire NERA III"
 Addon_3_NERA_desc:0 "Panneaux NERA modulaires modernes pour une protection solide et une réparation sur site plus simple."
 Addon_4_NERA:0 "Module complémentaire NERA IV"
 Addon_4_NERA_desc:0 "Panneaux NERA modulaires modernes avancés utilisant des matériaux haut de gamme pour une protection externe maximale."
 Addon_0_CE:0 "Armure complémentaire en céramique légère"
 Addon_0_CE_desc:0 "Panneaux composites en céramique légère qui améliorent la résistance aux mitrailleuses lourdes, aux tirs de canons automatiques et aux fragments."
 Addon_1_CE:0 "Armure complémentaire avancée en céramique légère"
 Addon_1_CE_desc:0 "Panneaux composites en céramique légers avancés utilisant des alliages modernes, des polymères et des carreaux de céramique dure."
 ERA_0:0 "ERA de première génération"
 ERA_0_desc:0 "Armure réactive explosive précoce qui offre une forte protection contre les obus HEAT mais un effet limité contre les pénétrateurs cinétiques."
 ERA_1:0 "ERA de deuxième génération"
 ERA_1_desc:0 "ERA amélioré avec une meilleure couverture et une certaine résistance aux pénétrateurs cinétiques."
 ERA_L:0 "Forfait ERA léger"
 ERA_L_desc:0 "Un ensemble de blindage réactif explosif plus léger adapté aux véhicules qui ne peuvent pas transporter de matrices ERA de plein poids."
