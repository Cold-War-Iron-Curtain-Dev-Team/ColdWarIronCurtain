 heavy_tank_amphibious_chassis_0:0 "Châssis de char lourd de l'entre-deux-guerres (amphibie)"
 heavy_tank_amphibious_chassis_1:0 "Châssis de char lourd de base (amphibie)"
 heavy_tank_amphibious_chassis_2:0 "Châssis de char lourd amélioré (amphibie)"
 heavy_tank_amphibious_chassis_3:0 "Châssis de char lourd avancé (amphibie)"
 heavy_tank_amphibious_equipment_0:0 "Char amphibie lourd de l'entre-deux-guerres"
 basic_heavy_tank_chassis:0 "Châssis de char lourd de base"
 basic_heavy_tank_chassis_desc:0 "Une analyse approfondie de la Grande Guerre a montré qu'il était nécessaire de disposer d'un véhicule lourd pour percer la ligne de tranchées ennemie et ouvrir la voie aux forces plus légères pour exploiter la percée. Un tel véhicule doit être lourdement armé et bien blindé, mais il n'est pas nécessaire qu'il soit très rapide."
 basic_heavy_tank_chassis_short:0 "1934 Lourd"
 improved_heavy_tank_chassis:0 "Châssis de char lourd amélioré"
 improved_heavy_tank_chassis_desc:0 "Même si la nature de la guerre a changé, il reste encore de la place pour un véhicule lourd doté d'un blindage épais pour créer une percée dans les lignes ennemies ou pour renforcer les défenses contre une attaque ennemie."
 improved_heavy_tank_chassis_short:1 "1940 Lourd"
 advanced_heavy_tank_chassis:0 "Châssis de char lourd avancé"
 advanced_heavy_tank_chassis_desc:0 "Avec les progrès en matière de blindage et de puissance de feu, un char moderne doit être équipé d'un blindage épais et d'un gros canon pour être efficace. Cela nécessite un gros véhicule."
 advanced_heavy_tank_chassis_short:0 "1943 Lourd"
 heavy_tank_chassis_desc:0 "Un grand châssis pouvant accueillir un canon lourd, un blindage épais, ou les deux."
 heavy_tank_artillery_chassis:0 "Artillerie lourde SP"
 heavy_tank_artillery_chassis_0:0 "Artillerie lourde SP de l'entre-deux-guerres"
 heavy_tank_artillery_chassis_desc:0 "Un gros véhicule, principalement destiné à l'appui-feu de l'infanterie qui avance."
 heavy_tank_artillery_chassis_1:0 "Artillerie SP lourde de base"
 heavy_tank_artillery_chassis_2:0 "Artillerie lourde SP améliorée"
 heavy_tank_artillery_chassis_3:0 "Artillerie SP lourde avancée"
 heavy_tank_destroyer_chassis_0:0 "Chasseur de chars lourds de l'entre-deux-guerres"
 heavy_tank_destroyer_chassis:0 "Chasseur de chars lourds"
 heavy_tank_destroyer_chassis_desc:0 "Un gros véhicule, transportant un canon puissant pour détruire le blindage ennemi."
 heavy_tank_destroyer_chassis_1:0 "Chasseur de chars lourds de base"
 heavy_tank_destroyer_chassis_2:0 "Chasseur de chars lourds amélioré"
 heavy_tank_destroyer_chassis_3:0 "Chasseur de chars lourds avancé"
 main_battle_tank_chassis:0 "Châssis de char moderne"
 main_battle_tank_chassis_desc:0 "L'expérience a montré que les conceptions des chars légers, moyens et lourds convergent de plus en plus. les chars lourds sont devenus plus mobiles, tandis que les chars légers transportent un armement et un blindage plus lourds pour survivre. il est donc utile d'unifier les trois modèles en un seul type, qui sera un char de combat principal universel."
 gwtank_chassis:0 "Développement de chars entre les deux guerres"
 gwtank_chassis_desc:0 "Le char s'est révélé être une arme puissante pendant la Grande Guerre. Même si le développement a ralenti entre-temps, il va sans aucun doute jouer un rôle majeur dans les guerres à venir."
 armor_tech_1:0 "Protection d'armure de base"
 armor_tech_1_desc:0 "Pendant la Grande Guerre, les chars n'avaient à affronter que les armes légères ennemies. En tant que tels, ils s'en sont sortis avec une armure assez fine. Une nouvelle génération d'armes antichar a fait du champ de bataille un endroit beaucoup plus dangereux pour un char, et une protection beaucoup plus lourde est nécessaire."
 armor_tech_2:0 "Protection améliorée de l'armure"
 armor_tech_2_desc:0 "Avec des armes antichar de plus en plus lourdes déployées dans le monde entier, la prochaine génération de chars aura besoin d'une protection encore meilleure."
 armor_tech_3:0 "Protection avancée de l'armure"
 armor_tech_3_desc:0 "Même si la limite des canons antichar déployés a probablement été atteinte, une nouvelle génération de chars embarquera un armement plus avancé, capable de percer n'importe quel niveau de protection actuel à longue portée."
 armor_tech_4:0 "Protection d'armure moderne"
 armor_tech_4_desc:0 "Pendant la guerre, les menaces auxquelles sont confrontés les chars se sont multipliées, depuis les chars ennemis, les canons antichar, les chasseurs de chars dédiés, jusqu'aux armes d'infanterie modernes tirant des charges creuses capables de pénétrer même les blindages lourds. Nous devons développer de nouvelles méthodes de protection pour maintenir nos propres chars en vie face à ces menaces."
 engine_tech_1:0 "Moteur de base"
 engine_tech_1_desc:0 "Alors que les chars de la Grande Guerre étaient des bêtes lentes et lourdes, le char moderne compte beaucoup sur la vitesse et la mobilité pour remporter la victoire."
 engine_tech_2:0 "Moteur amélioré"
 engine_tech_2_desc:0 "Avec des canons plus gros et un blindage plus lourd, la nouvelle génération de chars nécessite un moteur plus puissant pour rester mobile."
 engine_tech_3:0 "Moteur avancé"
 engine_tech_3_desc:0 "La guerre mécanisée est une forme de combat qui nécessite une prise de décision rapide et un mouvement rapide des troupes et du matériel. Si nos chars doivent transporter des armes modernes et suffisamment de blindage pour survivre sur le champ de bataille, ils ont besoin de moteurs puissants pour suivre le rythme de l'infanterie motorisée."
 engine_tech_4:0 "Moteur moderne"
 engine_tech_4_desc:0 "Les nombreux ajouts aux chars rendus nécessaires par la guerre moderne ont considérablement augmenté le poids du véhicule. Pour déplacer toute cette masse, nous avons besoin de moteurs dotés de beaucoup de puissance."
 DESIGNER_CHASSIS_BASE:0 "Châssis : "
 DESIGNER_FROM_MODULES:0 "Modules : "
 DESIGNER_UNSAVED_CHANGES:0 "Modifications non enregistrées : "
 tank_rocket_launcher:0 "Lance-roquettes"
 tank_rocket_launcher_desc:0 "Un lanceur multi-canons pour roquettes non guidées et hautement explosives. Le volume de tir élevé lui confère d'excellentes performances contre les cibles souples, mais même les coups directs n'ont que peu d'effet contre les cibles blindées."
 tank_rocket_launcher_2:0 "Lance-roquettes amélioré"
 tank_rocket_launcher_2_desc:0 "Bien qu'il y ait un certain nombre d'améliorations en termes de précision, le principal avantage de ce lance-roquettes amélioré est qu'il peut contenir plus de roquettes pour tirer sur l'ennemi."
 tank_wheeled_suspension:0 "Suspension à roues"
 tank_wheeled_suspension_desc:0 "Dérivée d'un châssis de camion, cette suspension est très limitée dans sa capacité d'emport et présente des performances tout-terrain limitées, mais présente l'avantage d'être très bon marché à fabriquer."
 tank_half_track_suspension:0 "Suspension demi-piste"
 tank_half_track_suspension_desc:0 "Hybride entre un véhicule entièrement chenillé et une suspension à roues ordinaires, cette configuration comprend une paire de roues à l'avant pour la direction et un essieu arrière chenillé pour améliorer les performances en cross-country. Bien que sa capacité de charge soit limitée, elle reste moins chère qu'une conception entièrement chenillée."
 squeezebore_adaptor:0 "Adaptateur à alésage compressible"
 squeezebore_adaptor_desc:0 "Un adaptateur spécial à l'extrémité du pistolet abaisse le diamètre du canon et réduit l'obus à un calibre plus petit. Cela augmente considérablement la vitesse initiale et donc la puissance de pénétration du pistolet. Cela nécessite des munitions spéciales fabriquées à partir de matériaux rares."
 armor_skirts:0 "Jupes d'armure"
 armor_skirts_desc:0 "Un ensemble de fines plaques métalliques montées sur le côté du véhicule, offrant une protection supplémentaire contre les fusils antichar et les charges creuses."
 dozer_blade:0 "Lame de bulldozer"
 dozer_blade_desc:0 "Une lame de bulldozer permet au véhicule de construire rapidement une position de combat sur le terrain sans l'aide d'ingénieurs."
 auto_loader:0 "Chargeur automatique"
 auto_loader_desc:0 "Un mécanisme automatique qui charge les obus et permet au char de maintenir une cadence de tir élevée pendant une période prolongée."
 easy_maintenance:0 "Entretien facile"
 easy_maintenance_desc:0 "Les trappes autour du véhicule donnent accès à de nombreux composants différents du véhicule et permettent à l'équipage d'effectuer assez facilement une maintenance même complexe."
 additional_machine_guns:0 "Mitrailleuses supplémentaires"
 additional_machine_guns_desc:0 "Un ensemble de mitrailleuses dans des sponsors et des supports spéciaux sur pivot confèrent au véhicule une meilleure défense contre les attaques rapprochées de l'infanterie."

