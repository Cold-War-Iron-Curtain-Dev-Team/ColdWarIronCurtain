 ap_0p:0 "Munitions AP de gros calibre"
 ap_0p_desc:0 "Munitions perforantes conventionnelles qui reposent sur un pénétrateur solide de gros calibre et une fabrication simple."
 ap_1p:0 "Munitions APCR"
 ap_1p_desc:0 "Tir composite rigide utilisant un pénétrateur dense de sous-calibre pour une meilleure pénétration du blindage à courte et moyenne portée."
