 ### CWIC APC HULLS ###

 cwic_carrier_role_refresh_note:0 "§YNote du concepteur :§! l'ajustement de ce module fait automatiquement passer la conception à son rôle de support, mais le nom, l'icône et le modèle ne sont pas encore mis à jour, et la sélection du rôle dans la liste déroulante ne fait rien en soi. §HChoisissez le rôle dans le menu déroulant§! puis §Hrenommez le design ou enregistrez-le§! pour appliquer le rôle."
 ### CWIC APC HULL MODULES ###
 apc_open_troop_bay:0 "Baie des troupes ouverte"
 apc_open_troop_bay_desc:0 "Une baie de troupes à toit ouvert. Bon marché et rapide à construire, mais cela laisse la section exposée aux tirs aériens.\n\n$cwic_carrier_role_refresh_note$"
 apc_troop_compartment:0 "Compartiment des troupes fermé"
 apc_troop_compartment_desc:0 "Un compartiment de troupes entièrement fermé et protégé par le plafond pour la section de débarquement.\n\n$cwic_carrier_role_refresh_note$"
 apc_frontal_engine_layout:0 "Disposition du Powerpack frontal"
 apc_frontal_engine_layout_desc:0 "Le groupe motopropulseur est avancé, ajoutant de la masse devant l'équipage et libérant une sortie arrière protégée.\n\n$cwic_carrier_role_refresh_note$"
 apc_enclosed_troop_bay:0 "Baie des troupes blindées"
 apc_enclosed_troop_bay_desc:0 "Une baie de troupes couverte avec une plaque aérienne légère, la première étape d'un transporteur à toit ouvert.\n\n$cwic_carrier_role_refresh_note$"
 apc_sloped_troop_compartment:0 "Compartiment des troupes incliné"
 apc_sloped_troop_compartment_desc:0 "Les côtés et les glacis du compartiment sont inclinés, offrant une protection contre la géométrie plutôt que contre une plaque supplémentaire.\n\n$cwic_carrier_role_refresh_note$"
 apc_rear_ramp_compartment:0 "Compartiment de rampe de puissance"
 apc_rear_ramp_compartment_desc:0 "Une rampe arrière motorisée remplace les portes latérales, permettant à la section de se démonter sous le couvercle de la coque elle-même.\n\n$cwic_carrier_role_refresh_note$"
 apc_spall_lined_compartment:0 "Compartiment doublé d'écailles"
 apc_spall_lined_compartment_desc:0 "Une doublure en tissu collée à l'intérieur emprisonne les fragments projetés sur la face intérieure de l'armure.\n\n$cwic_carrier_role_refresh_note$"
 apc_modular_troop_capsule:0 "Capsule de troupes modulaire"
 apc_modular_troop_capsule_desc:0 "L'équipage et la section voyagent dans une capsule blindée séparée qui peut être réarmée sans reconstruire la coque.\n\n$cwic_carrier_role_refresh_note$"
 apc_firing_ports:0 "Ports de tir"
 apc_firing_ports_desc:0 "Les blocs de vision et les ports de tir permettent à la section transportée de combattre depuis l'intérieur du véhicule sans descendre.\n\n$cwic_carrier_role_refresh_note$"
 apc_pintle_mg:0 "Mitrailleuse à pivot"
 apc_pintle_mg_desc:0 "Une mitrailleuse montée sur pivot pour la défense rapprochée et la suppression.\n\n$cwic_carrier_role_refresh_note$"
 apc_cupola_hmg:0 "Mitrailleuse lourde Coupole"
 apc_cupola_hmg_desc:0 "Une coupole protégée dotée d'une mitrailleuse lourde, efficace contre l'infanterie et les véhicules légers.\n\n$cwic_carrier_role_refresh_note$"
 apc_remote_weapon_station:0 "Station d'armes à distance"
 apc_remote_weapon_station_desc:0 "Une station d'armement distante stabilisée qui permet au commandant de s'engager sans s'exposer.\n\n$cwic_carrier_role_refresh_note$"

 ### CWIC IFV HULLS ###

 ### CWIC IFV HULL MODULES ###
 ifv_fighting_compartment:0 "Compartiment de combat IFV"
 ifv_fighting_compartment_desc:0 "Un compartiment de combat fermé combinant un logement d'infanterie protégé avec un support d'arme motorisé.\n\n$cwic_carrier_role_refresh_note$"
 ifv_frontal_engine_layout:0 "Bloc d'alimentation IFV frontal"
 ifv_frontal_engine_layout_desc:0 "Un groupe motopropulseur monté à l'avant améliore la protection frontale et offre une sortie arrière clairement protégée.\n\n$cwic_carrier_role_refresh_note$"
 ifv_enclosed_fighting_compartment:0 "Compartiment de combat blindé"
 ifv_enclosed_fighting_compartment_desc:0 "Le compartiment de combat dispose de plaques aériennes et latérales suffisamment lourdes pour transporter une monture motorisée en tir direct.\n\n$cwic_carrier_role_refresh_note$"
 ifv_sloped_fighting_compartment:0 "Compartiment de combat incliné"
 ifv_sloped_fighting_compartment_desc:0 "Les parois inclinées du compartiment augmentent l'épaisseur effective sans le poids d'une plaque plus épaisse.\n\n$cwic_carrier_role_refresh_note$"
 ifv_reinforced_fighting_compartment:0 "Compartiment de combat renforcé"
 ifv_reinforced_fighting_compartment_desc:0 "Le renforcement structurel autour de la monture et de la baie de démontage absorbe le recul d'une arme plus lourde.\n\n$cwic_carrier_role_refresh_note$"
 ifv_rear_ramp_compartment:0 "Compartiment de combat de rampe de puissance"
 ifv_rear_ramp_compartment_desc:0 "Une rampe motorisée permet à la section de combattre montée et descendue sans quitter la protection du véhicule.\n\n$cwic_carrier_role_refresh_note$"
 ifv_spall_lined_compartment:0 "Compartiment de combat doublé d'éclats"
 ifv_spall_lined_compartment_desc:0 "Une doublure collée contient les fragments écaillés de la face intérieure lorsque le compartiment est frappé.\n\n$cwic_carrier_role_refresh_note$"
 ifv_modular_fighting_capsule:0 "Capsule de combat modulaire"
 ifv_modular_fighting_capsule_desc:0 "Le compartiment de combat est une capsule blindée indépendante, remplaçable à mesure que les besoins de protection augmentent.\n\n$cwic_carrier_role_refresh_note$"
