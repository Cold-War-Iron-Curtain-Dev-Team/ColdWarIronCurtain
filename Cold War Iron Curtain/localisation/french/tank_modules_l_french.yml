 Night_Vision_0:0 "Vision nocturne zéro génération"
 Night_Vision_0_desc:0 "Les viseurs de vision nocturne de génération zéro utilisent une photocathode argent-oxygène-césium S1 avec une sensibilité lumineuse d'environ 60 microampères par lumen, ils nécessitent donc un fonctionnement actif avec un éclairage infrarouge continu qui peut être démasqué par un projecteur infrarouge ennemi. Une consommation d'énergie élevée, une faible fiabilité, une durée de vie de quelques centaines d'heures seulement et des pannes en plein jour restent de sérieuses limites, mais ils offrent toujours une autonomie de 500 à 700 mètres et une conduite de nuit à une vitesse de 15 à 25 km/h."
 Night_Vision_1:0 "Vision nocturne de première génération"
 Night_Vision_1_desc:0 "La première génération à part entière constitue une avancée décisive, avec une durée de vie allant jusqu'à 1 500 heures et une fiabilité et une durabilité bien supérieures grâce à une photocathode S-20 sodium-potassium-antimoine-césium améliorée avec une sensibilité à la lumière de 150 à 200 microampères par lumen. Il peut fonctionner de manière passive sans démasquer l'utilisateur, tandis qu'un projecteur infrarouge reste disponible dans des conditions de visualisation défavorables."
 Night_Vision_2:0 "Vision nocturne de deuxième génération"
 Night_Vision_2_desc:0 "Une photocathode S-25 améliorée augmente la sensibilité à la lumière à 230 microampères par lumen et la durée de vie efficace à 2 500-5 000 heures. Une plaque à microcanaux avec une électrode en nichrome des deux côtés jusqu'à 1 000 volts, constituée de milliers de fibres de verre creuses décalées par rapport à l'axe du tube, amplifie considérablement le signal entrant."
 Night_Vision_3:0 "Vision nocturne de troisième génération"
 Night_Vision_3_desc:0 "Une photocathode à l'arséniure de gallium avec une sensibilité à la lumière supérieure à 900 microampères par lumen est sensible au proche infrarouge et largement indépendante des sources de lumière naturelle. Son affinité électronique négative donne aux photoélectrons le libre passage vers la zone de vide, tandis que la durée de vie atteint jusqu'à 10 000 heures."
 Night_Vision_4:0 "Vision nocturne de troisième génération et plus"
 Night_Vision_4_desc:0 "Un film plus fin piège moins d'électrons pour une image plus claire, tandis qu'une alimentation électrique à grille automatique régule la tension de la photocathode lorsque les conditions d'éclairage changent, permettant un fonctionnement tout aussi efficace dans des conditions de faible luminosité que de forte luminosité."
 Night_Vision_5:0 "Vision nocturne Fusion"
 Night_Vision_5_desc:0 "La vision nocturne Fusion combine la vision nocturne et l'imagerie thermique, améliorant la visibilité dans des conditions de faible luminosité et ajoutant la possibilité de détecter les signatures thermiques tout en conservant la possibilité d'utiliser l'un ou l'autre appareil séparément."
