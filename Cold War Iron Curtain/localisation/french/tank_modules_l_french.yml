 tank_heavy_two_man_tank_turret_desc:0 "Une tourelle qui permet à deux membres d'équipage de partager le travail de fonctionnement de l'armement et d'observation de la situation. Cela ne permet toujours pas une division efficace du travail au sein de l'équipage."
 tank_heavy_three_man_tank_turret:0 "Tourelle à trois hommes"
 tank_heavy_three_man_tank_turret_desc:0 "Une tourelle suffisamment grande pour que les trois membres d'équipage puissent se répartir les tâches de chargement et de visée de l'armement principal ainsi que rester conscients de la situation autour d'eux."
 tank_heavy_fixed_superstructure_turret:1 "Superstructure fixe lourde"
 tank_heavy_fixed_superstructure_turret_desc:0 "Une superstructure fixe permet uniquement à l'armement principal de se déplacer selon un petit arc sans faire tourner l'ensemble du véhicule. Cependant, il permet au véhicule de monter un armement plus important tout en étant globalement de plus petite taille, ce qui le rend parfait pour les embuscades."
 tank_super_heavy_four_man_tank_turret:0 "Tourelle à quatre hommes"
 tank_super_heavy_four_man_tank_turret_desc:0 "Une tourelle massive avec un espace supplémentaire pour un deuxième chargeur pour entretenir le canon principal."
 tank_super_heavy_three_man_tank_turret:0 "Tourelle à trois hommes"
 tank_super_heavy_three_man_tank_turret_desc:0 "Une tourelle suffisamment grande pour que les trois membres d'équipage puissent se répartir les tâches de chargement et de visée de l'armement principal ainsi que rester conscients de la situation autour d'eux."
 tank_modern_tank_turret:0 "Tourelle moderne"
 tank_modern_tank_turret_desc:0 "Une tourelle bien conçue permet à trois membres d'équipage de faire fonctionner efficacement l'armement principal et de suivre leur environnement."
 pintle_turret:0 "Support d'attelage"
 pintle_turret_desc:0 "Une monture exposée pour une arme légère. Bon marché et fiable, mais limité en tant que compartiment de combat principal."
 light_lp_turret:0 "Tourelle légère basse pression"
 light_lp_turret_desc:0 "Une tourelle compacte adaptée aux canons basse pression et aux véhicules légers d'appui-feu."
 light_turret:0 "Tourelle légère"
 light_turret_desc:0 "Une petite tourelle fermée pour véhicules blindés légers."
 lp_turret:0 "Tourelle basse pression"
 lp_turret_desc:0 "Une tourelle disposée autour d'un armement basse pression et d'un appui feu direct."
 conventional_turret:0 "Tourelle conventionnelle"
 conventional_turret_desc:0 "Une tourelle fermée standard utilisant une construction conventionnelle moulée ou soudée."
 oscillating_turret:0 "Tourelle oscillante"
 oscillating_turret_desc:0 "Une conception de tourelle en deux parties où la tourelle supérieure se déplace avec le canon pour l'élévation."
 open_gun:0 "Support de pistolet ouvert"
 open_gun_desc:0 "Un compartiment de combat ouvert pour un canon monté."
 medium_open_gun:0 "Support de pistolet ouvert"
 medium_open_gun_desc:0 "Un compartiment de combat ouvert pour un canon monté."
 heavy_open_gun:0 "Support de pistolet ouvert"
 heavy_open_gun_desc:0 "Un compartiment de combat ouvert pour un canon monté."
 external_gun:0 "Support de pistolet externe"
 external_gun_desc:0 "Un système de canon monté à l'extérieur qui maintient une plus grande partie de l'arme à l'extérieur du compartiment de l'équipage."
 fixed_superstructure:0 "Superstructure fixe"
 fixed_superstructure_desc:0 "Une casemate ou superstructure fixe pour les véhicules qui échangent la traversée de la tourelle contre un support de canon plus simple."
 medium_fixed_superstructure:0 "Superstructure fixe"
 medium_fixed_superstructure_desc:0 "Une casemate ou superstructure fixe pour les véhicules qui échangent la traversée de la tourelle contre un support de canon plus simple."
 heavy_fixed_superstructure:0 "Superstructure fixe"
 heavy_fixed_superstructure_desc:0 "Une casemate ou superstructure fixe pour les véhicules qui échangent la traversée de la tourelle contre un support de canon plus simple."
 tank_heavy_machine_gun:0 "Mitrailleuse lourde"
 tank_heavy_machine_gun_desc:0 "Une mitrailleuse offre une capacité anti-infanterie décente pour un faible coût. Même avec des munitions spéciales perforantes, ses performances anti-blindage laissent beaucoup à désirer."
 tank_auto_cannon:0 "Canon automatique"
 tank_auto_cannon_desc:0 "Adapté d'un canon anti-aérien à tir rapide, ce canon automatique peut lancer une pluie de tirs dévastateurs sur les cibles faciles. Le petit calibre limite ses performances anti-blindage."
 tank_auto_cannon_2:0 "Canon automatique amélioré"
 tank_auto_cannon_2_desc:0 "Adapté d'un canon anti-aérien à tir rapide, ce canon automatique peut lancer une pluie de tirs dévastateurs sur les cibles faciles. Le petit calibre limite ses performances anti-blindage."
 tank_anti_air_cannon:0 "Pistolet anti-aérien de base"
 tank_anti_air_cannon_desc:0 "Un canon automatique à tir rapide conçu pour engager des avions. Son potentiel en tant qu'arme d'appui-feu contre des cibles au sol est limité."
 tank_anti_air_cannon_2:0 "Pistolet anti-aérien amélioré"
 tank_anti_air_cannon_2_desc:0 "Un canon automatique à tir rapide conçu pour engager des avions. Son potentiel en tant qu'arme d'appui-feu contre des cibles au sol est limité."
 tank_anti_air_cannon_3:0 "Pistolet anti-aérien avancé"
 tank_anti_air_cannon_3_desc:0 "Un canon automatique à tir rapide conçu pour engager des avions. Son potentiel en tant qu'arme d'appui-feu contre des cibles au sol est limité."
 tank_aa_ammo_1:0 "Munitions explosives AA de base"
 tank_aa_ammo_1_desc:0 "Obus hautement explosifs à impact et fusées temporisées pour canon anti-aérien automatique."
 tank_aa_ammo_2:0 "Munitions AA à fusée de proximité"
 tank_aa_ammo_2_desc:0 "Obus anti-aériens améliorés avec fusées de proximité qui explosent à proximité de cibles aériennes se déplaçant rapidement."
 tank_aa_ammo_3:0 "Munitions AA programmables Airburst"
 tank_aa_ammo_3_desc:0 "Obus anti-aériens avancés avec fusée programmable pour des modèles d'explosion précis."
 tank_medium_howitzer:0 "Obusier moyen"
 tank_medium_howitzer_desc:0 "Obusier de campagne moyen adapté pour être monté dans un véhicule. Son objectif principal est l'appui-feu indirect contre des cibles souples, mais il peut être tiré directement sur une cible si nécessaire. Transportant seulement une petite quantité de munitions perforantes, il est mal adapté aux travaux antichar."
 tank_medium_howitzer_2:0 "Obusier moyen amélioré"
 tank_medium_howitzer_2_desc:0 "Obusier de campagne moyen adapté pour être monté dans un véhicule. Son objectif principal est l'appui-feu indirect contre des cibles souples, mais il peut être tiré directement sur une cible si nécessaire. Transportant seulement une petite quantité de munitions perforantes, il est mal adapté aux travaux antichar."
 tank_heavy_howitzer:0 "Obusier lourd"
 tank_heavy_howitzer_desc:0 "Obusier de campagne lourd adapté pour être monté dans un véhicule. Son objectif principal est l'appui-feu indirect contre des cibles souples, mais il peut être tiré directement sur une cible si nécessaire. Transportant seulement une petite quantité de munitions perforantes, il est mal adapté aux travaux antichar."
 tank_small_cannon:0 "Petit canon"
 tank_small_cannon_desc:0 "Un petit canon bon marché, capable de tirer des obus anti-infanterie et anti-blindés. Son petit calibre limite son utilité."
 tank_small_cannon_2:0 "Petit canon amélioré"
 tank_small_cannon_2_desc:0 "Un petit canon bon marché, capable de tirer des obus anti-infanterie et anti-blindés. Son petit calibre limite son utilité."
 tank_medium_cannon:0 "Canon moyen"
 tank_medium_cannon_desc:0 "Une arme polyvalente bien adaptée à une grande variété de tâches. Il n'excelle ni dans le travail anti-infanterie ni dans le travail antichar, mais il offre un véhicule avec beaucoup de flexibilité."
 tank_medium_cannon_2:0 "Canon moyen amélioré"
 tank_medium_cannon_2_desc:0 "Une arme polyvalente bien adaptée à une grande variété de tâches. Il n'excelle ni dans le travail anti-infanterie ni dans le travail antichar, mais il offre un véhicule avec beaucoup de flexibilité."
 tank_high_velocity_cannon:0 "Canon à haute vitesse de base"
 tank_high_velocity_cannon_desc:0 "Un canon spécialement conçu pour atteindre une vitesse initiale élevée. Utilisant des munitions spécialisées, il possède de superbes caractéristiques anti-blindage, mais ses performances contre les cibles souples en pâtissent."
 tank_high_velocity_cannon_2:0 "Canon à grande vitesse amélioré"
 tank_high_velocity_cannon_2_desc:0 "Un canon spécialement conçu pour atteindre une vitesse initiale élevée. Utilisant des munitions spécialisées, il possède de superbes caractéristiques anti-blindage, mais ses performances contre les cibles souples en pâtissent."
 tank_high_velocity_cannon_3:0 "Canon avancé à grande vitesse"
 tank_high_velocity_cannon_3_desc:0 "Un canon spécialement conçu pour atteindre une vitesse initiale élevée. Utilisant des munitions spécialisées, il possède de superbes caractéristiques anti-blindage, mais ses performances contre les cibles souples en pâtissent."
 tank_heavy_cannon:0 "Canon lourd de base"
 tank_heavy_cannon_desc:0 "Une arme capable de tirer un gros obus. Avec une pénétration de blindage exceptionnelle et des performances décentes contre des cibles souples, ses plus grands inconvénients sont sa taille et son coût, qui le rendent trop encombrant pour être monté dans la plupart des véhicules non spécialement conçus pour le transporter."
 tank_heavy_cannon_2:0 "Canon lourd amélioré"
 tank_heavy_cannon_2_desc:0 "Une arme capable de tirer un gros obus. Avec une pénétration de blindage exceptionnelle et des performances décentes contre des cibles souples, ses plus grands inconvénients sont sa taille et son coût, qui le rendent trop encombrant pour être monté dans la plupart des véhicules non spécialement conçus pour le transporter."
 tank_heavy_cannon_3:1 "Canon lourd avancé"
 tank_heavy_cannon_3_desc:0 "Une arme capable de tirer un gros obus. Avec une pénétration de blindage exceptionnelle et des performances décentes contre des cibles souples, ses plus grands inconvénients sont sa taille et son coût, qui le rendent trop encombrant pour être monté dans la plupart des véhicules non spécialement conçus pour le transporter."
 tank_super_heavy_cannon:0 "Canon de siège lourd"
 tank_super_heavy_cannon_desc:0 "Un très gros canon avec une pénétration de blindage et une puissance de feu exceptionnelles. Son coût élevé, son poids élevé et sa grave pénalité de fiabilité exigent un châssis conçu autour de l'arme."
 cwic_coaxial_mg:0 "Mitrailleuse coaxiale"
 cwic_coaxial_mg_desc:0 "Une mitrailleuse montée à côté de l'armement principal pour engager l'infanterie et les cibles légèrement protégées."
 cwic_hull_mg:0 "Mitrailleuse à coque"
 cwic_hull_mg_desc:0 "Une mitrailleuse montée sur la coque avant qui améliore la défense rapprochée à un coût industriel modeste."
 cwic_secondary_hmg:0 "Mitrailleuse lourde secondaire"
 cwic_secondary_hmg_desc:0 "Une mitrailleuse lourde dans une tourelle secondaire, ajoutant une puissance de feu à courte portée contre l'infanterie et les véhicules légers."
 cwic_secondary_autocannon:0 "Canon automatique secondaire"
 cwic_secondary_autocannon_desc:0 "Un canon automatique secondaire qui ajoute une puissance de feu substantielle pour cible souple et perforante au détriment de la fiabilité et de la capacité industrielle."
 RWS_0:0 "Station d'armes à distance"
 RWS_0_desc:0 "Une station d'armes à distance protégée permet à l'équipage d'utiliser une arme secondaire depuis l'intérieur du véhicule, échangeant la puissance de l'arme contre la protection de l'équipage."
 tank_close_support_gun:0 "Pistolet de soutien rapproché"
 tank_close_support_gun_desc:0 "Une petite arme conçue pour tirer des obus hautement explosifs contre les fortifications ennemies afin d'aider l'infanterie dans l'attaque. Bien qu'il soit capable d'engager des chars, son canon court et ses munitions limitées le rendent incapable d'affronter des chars ennemis plus puissants."
 tank_radio_1:0 "Radio de base"
 tank_radio_1_desc:0 "Une radio bidirectionnelle de base permet aux chars de coordonner leurs manoeuvres tactiques à petite échelle."
 tank_radio_2:0 "Radio améliorée"
 tank_radio_2_desc:0 "Une radio améliorée permet aux commandants de contrôler efficacement de plus grandes formations de chars, permettant ainsi des manoeuvres opérationnelles à grande échelle."
 tank_radio_3:0 "Radio avancée"
 tank_radio_3_desc:0 "Dotée d'un émetteur plus puissant et d'une meilleure réception, cette radio permet des communications sur des dizaines de kilomètres et face aux brouillages ennemis."
 amphibious_drive:0 "Conduite amphibie"
 amphibious_drive_desc:0 "Un ensemble de dispositifs de flottaison et une petite vis permettent à ce réservoir d'être rapidement installé pour traverser l'eau, soit du navire au rivage, soit à travers une rivière."
 secondary_turret_hmg:1 "Mitrailleuse lourde"
 secondary_turret_hmg_desc:0 "Une mitrailleuse lourde dans une tourelle secondaire. L'emplacement de la tourelle limite son arc de tir, réduisant ainsi l'efficacité globale du canon, mais il permet au char d'engager davantage de cibles. Ceci est particulièrement utile lors d'une attaque."
 secondary_turret_small_cannon:1 "Petit canon"
 secondary_turret_small_cannon_desc:0 "Un petit canon dans une tourelle secondaire. L'emplacement de la tourelle limite son arc de tir, réduisant ainsi l'efficacité globale du canon, mais il permet au char d'engager davantage de cibles. Ceci est particulièrement utile lors d'une attaque."
 secondary_turret_close_support_gun:1 "Pistolet de soutien rapproché"
 secondary_turret_close_support_gun_desc:0 "Un canon d'appui rapproché dans une tourelle secondaire. L'emplacement de la tourelle limite son arc de tir, réduisant ainsi l'efficacité globale du canon, mais il permet au char d'engager davantage de cibles. Ceci est particulièrement utile lors d'une attaque."
 sloped_armor:0 "Armure inclinée"
 sloped_armor_desc:0 "Un blindage placé à un angle par rapport à un obus entrant a une épaisseur effective bien plus grande que la même quantité de blindage placé verticalement. Cela augmente également le risque que la coque rebondisse sans danger. Cependant, cela nécessite que tout le réservoir soit conçu autour de lui, ce qui rend le véhicule plus difficile à assembler."
 stabilizer:0 "Stabilisateur"
 stabilizer_desc:0 "Un dispositif mécanique permettant de maintenir le canon pointé dans la même direction lorsque le char est en mouvement. Bien qu'il ne soit pas suffisamment avancé pour permettre un tir précis en mouvement, il permet au tireur de tirer avec précision lors d'un court arrêt, sans avoir à réacquérir la cible."
 smoke_launchers:0 "Lanceurs de fumée"
 smoke_launchers_desc:0 "Une batterie de dispositifs pyrotechniques qui peuvent être déclenchés depuis l'intérieur du char pour créer un épais nuage de fumée afin de cacher le char. Très utile lorsque vous êtes sur la défensive ou après une embuscade."
 extra_ammo_storage:0 "Stockage de munitions supplémentaire"
 extra_ammo_storage_desc:0 "Des râteliers supplémentaires de munitions prêtes permettent au char de rester au combat beaucoup plus longtemps sans réapprovisionnement. Cependant, si l'armure est pénétrée, les résultats risquent d'être catastrophiques. Ceci est particulièrement problématique lors d'une attaque."
 wet_ammo_storage:0 "Stockage de munitions humides"
 wet_ammo_storage_desc:0 "Les vestes d'eau ajoutées aux râteliers à munitions réduisent considérablement le risque d'explosion des munitions après l'impact sur le char, ce qui est grandement apprécié par les équipages."
 armor_tech_1_tt:0 "Active les valeurs d'amélioration d'armure de 5 et plus."
 armor_tech_2_tt:0 "Active les valeurs d'amélioration d'armure de 10 et plus."
 armor_tech_3_tt:0 "Active les valeurs d'amélioration d'armure de 15 et plus."
 armor_tech_4_tt:0 "Active les valeurs de mise à niveau d'armure de 18 et plus."
 engine_tech_1_tt:0 "Active les valeurs de mise à niveau du moteur de 5 et supérieures."
 engine_tech_2_tt:0 "Active les valeurs de mise à niveau du moteur de 10 et supérieures."
 engine_tech_3_tt:0 "Active les valeurs de mise à niveau du moteur de 15 et plus."
 engine_tech_4_tt:0 "Active les valeurs de mise à niveau du moteur de 18 et plus."
 light_tank_chassis:0 "Char léger"
 medium_tank_chassis:0 "CCP"
 heavy_tank_chassis:0 "Char lourd"
 light_tank_chassis_desc:0 "Un châssis petit et compact, idéal pour un véhicule léger et bon marché pour des tâches telles que la reconnaissance et l'appui-feu. Sa capacité de charge limitée le rend inadapté au transport d'armures lourdes ou de gros canons."
 basic_light_tank_chassis:0 "Châssis de char léger de base"
 basic_light_tank_chassis_short:0 "1934 Lumière"
 basic_light_tank_chassis_desc:0 "Les progrès technologiques ont rendu obsolètes les conceptions de l'immédiat après-guerre. Le champ de bataille moderne nécessite une nouvelle conception épurée intégrant les progrès de la métallurgie et de l'aménagement intérieur."
 improved_light_tank_chassis:0 "Châssis de char léger amélioré"
 improved_light_tank_chassis_short:0 "1936 Lumière"
 improved_light_tank_chassis_desc:0 "Une nouvelle itération basée sur les expériences acquises avec les chars légers précédents, ce châssis permet une meilleure fiabilité et une meilleure maintenance."
 advanced_light_tank_chassis:0 "Châssis de char léger avancé"
 advanced_light_tank_chassis_short:0 "1941 Lumière"
 advanced_light_tank_chassis_desc:0 "Alors que les chars moyens occupent de plus en plus le devant de la scène dans les combats, les chars légers ont été largement relégués à des rôles de soutien. Une nouvelle conception de châssis est nécessaire pour prendre en compte les besoins de ces rôles."
 light_tank_amphibious_chassis_0:0 "Châssis de char léger de l'entre-deux-guerres (amphibie)"
