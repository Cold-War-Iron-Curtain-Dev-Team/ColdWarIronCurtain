 APU_3_desc:0 "Une unité de puissance auxiliaire qui fait fonctionner l'électronique et les sous-systèmes sans dépendre du moteur principal."
 APU_4:0 "Groupe auxiliaire de puissance V"
 APU_4_desc:0 "Une unité de puissance auxiliaire qui fait fonctionner l'électronique et les sous-systèmes sans dépendre du moteur principal."
 APU_5:0 "Unité de puissance auxiliaire VI"
 APU_5_desc:0 "Une unité de puissance auxiliaire qui fait fonctionner l'électronique et les sous-systèmes sans dépendre du moteur principal."
 APU_6:0 "Groupe auxiliaire de puissance VII"
 APU_6_desc:0 "Une unité de puissance auxiliaire qui fait fonctionner l'électronique et les sous-systèmes sans dépendre du moteur principal."
 GT_APU_0:0 "Groupe auxiliaire de puissance I pour turbine à gaz"
 GT_APU_0_desc:0 "Un groupe auxiliaire de puissance adapté aux véhicules à turbine à gaz à haut rendement et à leurs fortes demandes électriques."
 GT_APU_1:0 "Groupe auxiliaire de puissance II pour turbine à gaz"
 GT_APU_1_desc:0 "Un groupe auxiliaire de puissance adapté aux véhicules à turbine à gaz à haut rendement et à leurs fortes demandes électriques."
 GT_APU_2:0 "Groupe auxiliaire de puissance III pour turbine à gaz"
 GT_APU_2_desc:0 "Un groupe auxiliaire de puissance adapté aux véhicules à turbine à gaz à haut rendement et à leurs fortes demandes électriques."
 GT_APU_3:0 "Unité de puissance auxiliaire de turbine à gaz IV"
 GT_APU_3_desc:0 "Un groupe auxiliaire de puissance adapté aux véhicules à turbine à gaz à haut rendement et à leurs fortes demandes électriques."
 Dozer_0:0 "Charrue bulldozer"
 Dozer_0_desc:0 "Une lame de bulldozer montée à l'avant élimine les obstacles, prépare les positions de combat et facilite le mouvement sur un terrain accidenté."
 Fuel_Tanks_0:0 "Réservoirs de carburant externes"
 Fuel_Tanks_0_desc:0 "Les réservoirs de carburant externes étendent la portée opérationnelle mais exposent le carburant supplémentaire aux tirs ennemis et aux dommages mécaniques."
 Mine_Plow_0:0 "Charrue anti-mine"
 Mine_Plow_0_desc:0 "Une charrue anti-mine montée à l'avant ouvre un chemin à travers les mines enfouies au détriment de la vitesse et de la fiabilité mécanique."
 Mine_Roller_0:0 "Rouleau de mine KMT-5"
 Mine_Roller_0_desc:0 "Un ensemble de rouleaux KMT-5 fait exploser des mines à pression devant les chenilles, mais ajoute de la traînée et des contraintes au train de roulement."
 Mine_Plow_1:0 "Charrue anti-mine améliorée"
 Mine_Plow_1_desc:0 "Une charrue anti-mine améliorée combine des lames plus solides et un meilleur montage pour nettoyer les champs de mines avec moins de perturbations pour le véhicule."
 Trench_Plow_0:0 "Charrue intégrée pour creuser des tranchées"
 Trench_Plow_0_desc:0 "Une charrue de creusement de tranchées intégrée permet au véhicule de préparer des positions de combat protégées sans machinerie d'ingénierie séparée."
 Mine_Roller_1:0 "Rouleau de mine KMT-7 EMT"
 Mine_Roller_1_desc:0 "Un système EMT KMT-7 combine des rouleaux de déminage lourds avec un équipement de déminage électromagnétique pour un déminage plus approfondi."
 Wheel_4:0 "suspension à roues 4x4"
 Wheel_4_desc:0 "Une simple suspension à roues pour les voitures blindées bon marché et les véhicules de combat utilitaires légers."
 Wheel_6:0 "suspension à roues 6x6"
 Wheel_6_desc:0 "Une suspension à six roues offrant une meilleure capacité de charge et de meilleures performances tout-terrain que les configurations à roues plus légères."
 Wheel_8:0 "suspension à roues 8x8"
 Wheel_8_desc:0 "Une suspension à huit roues pour véhicules de combat à roues lourds avec une vitesse sur route élevée et une bonne capacité de charge utile."
 Half_track:0 "Suspension demi-chenille"
 Half_track_desc:0 "Une suspension hybride roues-chenilles qui améliore la mobilité hors route tout en restant moins chère qu'un châssis entièrement chenillé."
 Bogie_0:0 "Suspension de bogie WW2"
 Bogie_0_desc:0 "Une suspension de bogie simple et robuste adaptée aux premiers véhicules blindés et facile à entretenir sur le terrain."
 Independent_internal_0:0 "Suspension indépendante interne"
 Independent_internal_0_desc:0 "Une suspension indépendante avec des composants internes protégés, améliorant la qualité de roulement avec une plus grande complexité mécanique."
 Independent_external_0:0 "Suspension indépendante externe"
 Independent_external_0_desc:0 "Une suspension indépendante montée à l'extérieur qui améliore la mobilité tout en restant plus facile d'accès pour l'entretien."
 Torsion_0:0 "Suspension à barre de torsion WW2"
 Torsion_0_desc:0 "Une suspension à barre de torsion offrant une conduite plus douce et une meilleure manutention de charge pour les véhicules blindés à chenilles."
 Bogie_1:0 "Suspension de bogie modernisée"
 Bogie_1_desc:0 "Une suspension de bogie améliorée avec un meilleur amortissement et une meilleure fiabilité pour les véhicules blindés d'après-guerre."
 Independent_internal_1:0 "Suspension indépendante interne modernisée"
 Independent_internal_1_desc:0 "Une suspension indépendante interne raffinée avec un amortissement amélioré et une meilleure stabilité à grande vitesse."
 Independent_external_1:0 "Suspension indépendante externe modernisée"
 Independent_external_1_desc:0 "Une suspension indépendante externe raffinée qui équilibre la mobilité, l'accès à l'entretien et la durabilité."
 Torsion_1:0 "Suspension à barre de torsion modernisée"
 Torsion_1_desc:0 "Un système de barre de torsion amélioré avec une meilleure absorption des chocs et une réduction des vibrations de la coque."
 Hydro_pneumatic_0:0 "Suspension hydropneumatique I"
 Hydro_pneumatic_0_desc:0 "Une suspension hydropneumatique qui améliore le contrôle de conduite et permet un réglage limité de l'attitude de la coque."
 Hydro_pneumatic_1:0 "Suspension hydropneumatique II"
 Hydro_pneumatic_1_desc:0 "Une suspension hydropneumatique améliorée avec une meilleure garde au sol et un meilleur contrôle de la position de tir."
 Hydro_pneumatic_2:0 "Suspension hydropneumatique active"
 Hydro_pneumatic_2_desc:0 "Une suspension active qui ajuste dynamiquement l'amortissement et la hauteur de caisse pour plus de mobilité et de stabilité de tir."
 Four_Track_0:0 "Suspension expérimentale à quatre voies"
 Four_Track_0_desc:0 "Un train de roulement expérimental à quatre chenilles répartit le poids sur quatre unités de chenilles indépendantes pour de solides performances tout-terrain, à un coût élevé et avec une fiabilité médiocre."

 ### CWIC TANK HULLS ###
 light_tank_chassis_0:0 "Coque de char léger du début de la Seconde Guerre mondiale"
 light_tank_chassis_0_short:0 "1939 Lumière"
 light_tank_chassis_0_desc:0 "Une coque blindée légère du début de la guerre pour la reconnaissance, l'appui-feu et la conception de véhicules de combat économiques."
 light_tank_chassis_1:0 "Coque de char léger du milieu de la Seconde Guerre mondiale"
 light_tank_chassis_1_short:0 "1942 Lumière"
 light_tank_chassis_1_desc:0 "Une coque légère de mi-guerre avec une fiabilité et une mobilité améliorées tout en conservant une protection et une charge utile limitées."
 light_tank_chassis_2:0 "Coque de char léger de la fin de la Seconde Guerre mondiale"
 light_tank_chassis_2_short:0 "1944 Lumière"
 light_tank_chassis_2_desc:0 "Une coque légère de fin de guerre intégrant l'expérience du temps de guerre pour de meilleures performances automobiles et une meilleure capacité de survie."
 light_tank_chassis_3:0 "Coque de char léger d'après-guerre"
 light_tank_chassis_3_short:0 "1950 Lumière"
 light_tank_chassis_3_desc:0 "Une coque légère d'après-guerre adaptée aux rôles aéroportés, de reconnaissance et de soutien dans une armée qui se mécanise rapidement."
 light_tank_chassis_4:0 "Coque de char léger du début de la guerre froide"
 light_tank_chassis_4_short:0 "1960 Lumière"
 light_tank_chassis_4_desc:0 "Une coque légère du début de la Guerre froide construite autour d'une mobilité plus élevée, d'une fiabilité améliorée et de conceptions amphibies ou transportables par air."
 light_tank_chassis_5:0 "Coque de char léger de la mi-guerre froide"
 light_tank_chassis_5_short:0 "1970 Lumière"
 light_tank_chassis_5_desc:0 "Une coque légère du milieu de la Guerre froide pour les véhicules de reconnaissance et de soutien transportant des armes plus lourdes et une meilleure protection."
 light_tank_chassis_6:0 "Coque de char léger de la fin de la guerre froide"
 light_tank_chassis_6_short:0 "1980 Lumière"
 light_tank_chassis_6_desc:0 "Une coque légère de la fin de la Guerre froide avec une disposition de blindage améliorée et une charge utile suffisante pour des canons puissants, des missiles ou des systèmes spécialisés."
 light_tank_chassis_7:0 "Coque de char léger moderne"
 light_tank_chassis_7_short:0 "1990 Lumière"
 light_tank_chassis_7_desc:0 "Une coque légère moderne conçue comme une plate-forme flexible pour les variantes protégées de reconnaissance, d'appui-feu et de soutien d'infanterie."
 light_tank_chassis_8:0 "Coque de char léger moderne"
 light_tank_chassis_8_short:0 "2000 Lumière"
 light_tank_chassis_8_desc:0 "Une coque légère et moderne avec une construction modulaire, une meilleure protection et la mobilité nécessaire aux forces de déploiement rapide."
 light_tank_chassis_9:0 "Coque de char léger moderne avancée"
 light_tank_chassis_9_short:0 "2010 Lumière"
 light_tank_chassis_9_desc:0 "Une coque légère et moderne avancée utilisant des matériaux, des capteurs et des améliorations d'agencement contemporains pour les véhicules de combat légers haut de gamme."

 medium_tank_chassis_0:0 "Coque de char moyen du début de la Seconde Guerre mondiale"
 medium_tank_chassis_0_short:0 "1939 Moyen"
 medium_tank_chassis_0_desc:0 "Une coque de char moyen du début de la guerre équilibrant un blindage utile, une mobilité et une capacité suffisante pour un canon principal à usage général."
 medium_tank_chassis_1:0 "Coque de char moyen au milieu de la Seconde Guerre mondiale"
 medium_tank_chassis_1_short:0 "1942 Moyen"
 medium_tank_chassis_1_desc:0 "Une coque moyenne de mi-guerre façonnée par l'expérience des premiers combats, avec une meilleure protection et des performances automobiles améliorées."
 medium_tank_chassis_2:0 "Coque de char moyen de la fin de la Seconde Guerre mondiale"
 medium_tank_chassis_2_short:0 "1944 Moyen"
 medium_tank_chassis_2_desc:0 "Une coque moyenne de la fin de la guerre représentant l'équilibre mature en temps de guerre entre puissance de feu, blindage, fiabilité et efficacité de production."
 medium_tank_chassis_3:0 "Coque de char moyen d'après-guerre"
 medium_tank_chassis_3_short:0 "1950 Moyen"
 medium_tank_chassis_3_desc:0 "Une coque moyenne d'après-guerre poussant le char moyen traditionnel vers des canons plus lourds, de meilleures optiques et une protection plus solide."
 medium_tank_chassis_4:0 "Coque MBT de première génération"
 medium_tank_chassis_4_short:0 "1960 CCP"
 medium_tank_chassis_4_desc:0 "Une coque de char de combat principal de première génération combinant la mobilité des chars moyens avec une protection et un armement proche des chars lourds."
 medium_tank_chassis_5:0 "Coque MBT de première génération"
 medium_tank_chassis_5_short:0 "1970 CCP"
 medium_tank_chassis_5_desc:0 "Une coque MBT modernisée de première génération avec un meilleur potentiel de croissance pour les systèmes avancés de contrôle de tir, de blindage et de moteur."
 medium_tank_chassis_6:0 "Coque MBT de deuxième génération"
 medium_tank_chassis_6_short:0 "1980 CCP"
 medium_tank_chassis_6_desc:0 "Une coque MBT de deuxième génération conçue autour d'une protection composite améliorée, d'une optique avancée et de sous-systèmes plus performants."
 medium_tank_chassis_7:0 "Coque MBT de deuxième génération et plus"
 medium_tank_chassis_7_short:0 "1990 MBT"
 medium_tank_chassis_7_desc:0 "Une coque de MBT de deuxième génération profondément modernisée avec un potentiel de blindage modulaire et une intégration croissante de l'électronique numérique."
 medium_tank_chassis_8:0 "Coque MBT de troisième génération"
 medium_tank_chassis_8_short:0 "2000 CCP"
 medium_tank_chassis_8_desc:0 "Une coque MBT de troisième génération conçue pour un contrôle de tir moderne, une protection modulaire et une capacité de survie élevée sur un champ de bataille en réseau."
 medium_tank_chassis_9:0 "Coque MBT de troisième génération et plus"
 medium_tank_chassis_9_short:0 "2010 MBT"
 medium_tank_chassis_9_desc:0 "Une coque MBT modernisée de troisième génération intégrant les derniers systèmes de protection de l'équipage, de défense active et de combat numérique."

 heavy_tank_chassis_0:0 "Coque de char lourd du début de la Seconde Guerre mondiale"
 heavy_tank_chassis_0_short:0 "1939 Lourd"
 heavy_tank_chassis_0_desc:0 "Une coque lourde du début de la guerre construite autour d'un blindage épais et de grosses armes au détriment de la vitesse et des efforts de production."
 heavy_tank_chassis_1:0 "Coque de char lourd du milieu de la Seconde Guerre mondiale"
 heavy_tank_chassis_1_short:0 "1942 Lourd"
 heavy_tank_chassis_1_desc:0 "Une coque lourde de mi-guerre avec une protection et une puissance de feu améliorées pour les rôles de percée et d'assaut."
 heavy_tank_chassis_2:0 "Coque de char lourd de la fin de la Seconde Guerre mondiale"
 heavy_tank_chassis_2_short:0 "1944 Lourd"
 heavy_tank_chassis_2_desc:0 "Une coque lourde de fin de guerre représentant l'apogée de la conception de chars lourds de guerre, avec un blindage et un armement formidables."
 heavy_tank_chassis_3:0 "Coque de char lourd d'après-guerre"
 heavy_tank_chassis_3_short:0 "1950 Lourd"
 heavy_tank_chassis_3_desc:0 "Une coque lourde d'après-guerre raffinée par l'expérience de la guerre et de plus en plus axée sur la défaite des blindés ennemis."
 heavy_tank_chassis_4:0 "Coque de char lourd du début de la guerre froide"
 heavy_tank_chassis_4_short:0 "1955 Lourd"
 heavy_tank_chassis_4_desc:0 "Une coque lourde du début de la Guerre froide utilisant un contrôle de tir amélioré et des canons puissants, mais limitée par le coût, la mobilité et les menaces de missiles."

