 light_tank_destroyer_brigade:0 "Bataillon de chasseurs de chars légers"
 light_tank_destroyer_brigade_desc:0 "Un bataillon de chasseurs de chars légers qui échangent leur protection contre un canon capable de percer au-dessus du châssis sur lequel ils se trouvent."
 medium_tank_destroyer_brigade:0 "Bataillon de chasseurs de chars moyens"
 medium_tank_destroyer_brigade_desc:0 "Un bataillon de chasseurs de chars moyens construits pour tenir le terrain contre les blindés ennemis plutôt que pour mener l'avancée."
 heavy_tank_destroyer_brigade:0 "Bataillon de chasseurs de chars lourds"
 heavy_tank_destroyer_brigade_desc:0 "Un bataillon de chasseurs de chars lourds, lents et coûteux mais capables de vaincre le blindage frontal le plus épais."
 light_sp_artillery_brigade:0 "Bataillon d'artillerie légère automotrice"
 light_sp_artillery_brigade_desc:0 "Un bataillon de canons automoteurs légers, fournissant un appui-feu mobile capable de suivre le rythme d'une avance blindée."
 medium_sp_artillery_brigade:0 "Bataillon d'artillerie automoteur moyen"
 medium_sp_artillery_brigade_desc:0 "Un bataillon de canons automoteurs moyens, l'artillerie mobile standard d'une formation mécanisée."
 heavy_sp_artillery_brigade:0 "Bataillon d'artillerie lourde automotrice"
 heavy_sp_artillery_brigade_desc:0 "Un bataillon de canons automoteurs lourds, délivrant le poids d'obus nécessaire pour briser les défenses préparées."
 light_sp_anti_air_brigade:0 "Bataillon anti-aérien léger automoteur"
 light_sp_anti_air_brigade_desc:0 "Un bataillon de canons antiaériens automoteurs légers, protégeant une colonne mobile contre les attaques à basse altitude."
 medium_sp_anti_air_brigade:0 "Bataillon antiaérien automoteur moyen"
 medium_sp_anti_air_brigade_desc:0 "Un bataillon de canons anti-aériens automoteurs moyens, échangeant leur mobilité contre des canons plus lourds et un meilleur contrôle de tir."

 
 light_tank_amphibious_chassis_desc:0 "Un char léger équipé de dispositifs de flottaison et d'une hélice."
 medium_tank_amphibious_chassis_desc:0 "Un char moyen équipé de dispositifs de flottaison et d'une hélice."
 heavy_tank_amphibious_chassis_desc:0 "Un char lourd équipé de dispositifs de flottaison et d'une hélice."
 
 expanded_fuel_tank:0 "Tambour de carburant"
 expanded_fuel_tank_desc:0 "Un fût de carburant monté à l'extérieur conçu pour étendre la portée opérationnelle d'un véhicule blindé."

