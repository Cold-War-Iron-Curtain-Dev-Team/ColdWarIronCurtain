 ### EQUIPMENT MODULES ###
 
 tank_gasoline_engine:0 "Moteur à essence d'avant la Seconde Guerre mondiale"
 tank_gasoline_engine_desc:0 "Un moteur fonctionnant à l'essence sera plus rapide pour une taille de moteur donnée, mais le carburant sera beaucoup plus susceptible de prendre feu."
 tank_diesel_engine:0 "Moteur Diesel"
 tank_diesel_engine_desc:0 "Un moteur fonctionnant au diesel est plus fiable qu'un moteur à essence, mais pas aussi rapide pour une même cylindrée."
 tank_petrol_electric_engine:0 "Moteur essence-électrique"
 tank_petrol_electric_engine_desc:0 "Une combinaison d'un moteur à essence fournissant de la puissance à un moteur électrique. Complexe, coûteux et peu fiable, il offre cependant des performances inégalées dans les mouvements tactiques."
 tank_gas_turbine_engine:0 "Turbine à gaz"
 tank_gas_turbine_engine_desc:0 "Une turbine développée à partir de moteurs à réaction. Consommation de carburant élevée, mais régime le plus élevé de tous les moteurs pour une cylindrée donnée."
 tank_riveted_armor:0 "Armure rivetée"
 tank_riveted_armor_desc:0 "Plaques de blindage boulonnées au cadre et maintenues ensemble par des rivets enfoncés dans les bords. Une technologie très éprouvée et relativement bon marché, mais les bords rivetés constituent des points faibles du blindage et pourraient blesser l'équipage si les rivets sont touchés."
 tank_cast_armor:0 "Lancer une armure"
 tank_cast_armor_desc:0 "L'ensemble du châssis, y compris le blindage, est moulé comme une seule unité. Un processus coûteux et long qui permet d'obtenir un blindage beaucoup plus épais avec moins de points faibles."
 tank_welded_armor:0 "Armure soudée"
 tank_welded_armor_desc:0 "Des plaques de blindage sont soudées au châssis. Un processus plus rapide que le moulage, tout en offrant une bonne protection."
 tank_torsion_bar_suspension:0 "Barre de torsion"
 tank_torsion_bar_suspension_desc:0 "Un système de suspension assez fiable composé de barres métalliques fixées au châssis du véhicule qui offre une conduite plus douce que les autres types de suspension."
 tank_christie_suspension:0 "Christie Suspension"
 tank_christie_suspension_desc:0 "Développée par un inventeur américain, cette suspension permet des vitesses exceptionnellement élevées."
 tank_bogie_suspension:0 "Suspension de bogie"
 tank_bogie_suspension_desc:0 "Un type de suspension simple et relativement bon marché dans lequel les roues sont montées individuellement, ce qui permet de les remplacer facilement en cas de dommage."
 tank_interleaved_suspension:0 "Roues entrelacées"
 tank_interleaved_suspension_desc:0 "En superposant les galets, un plus grand nombre d'entre eux peuvent être installés sur la même longueur de coque, améliorant ainsi la mobilité et offrant une protection supplémentaire sur les flancs."
 tank_light_one_man_tank_turret:0 "Tourelle pour un seul homme"
 tank_light_one_man_tank_turret_desc:0 "Une petite tourelle à peine assez grande pour contenir un seul membre d'équipage, chargé de viser et de charger l'armement principal ainsi que de surveiller les cibles et les menaces."
 tank_light_two_man_tank_turret:0 "Tourelle pour deux hommes"
 tank_light_two_man_tank_turret_desc:0 "Une tourelle qui permet à deux membres d'équipage de partager le travail de fonctionnement de l'armement et d'observation de la situation. Cela ne permet toujours pas une division efficace du travail au sein de l'équipage."
 tank_light_three_man_tank_turret:0 "Tourelle à trois hommes"
 tank_light_three_man_tank_turret_desc:0 "Une tourelle suffisamment grande pour que les trois membres d'équipage puissent se répartir les tâches de chargement et de visée de l'armement principal ainsi que rester conscients de la situation autour d'eux."
 tank_light_fixed_superstructure_turret:1 "Superstructure fixe légère"
 tank_light_fixed_superstructure_turret_desc:0 "Une superstructure fixe permet uniquement à l'armement principal de se déplacer selon un petit arc sans faire tourner l'ensemble du véhicule. Cependant, il permet au véhicule de monter un armement plus important tout en étant globalement de plus petite taille, ce qui le rend parfait pour les embuscades."
 tank_medium_one_man_tank_turret:0 "Tourelle pour un seul homme"
 tank_medium_one_man_tank_turret_desc:0 "Une petite tourelle à peine assez grande pour contenir un seul membre d'équipage, chargé de viser et de charger l'armement principal ainsi que de surveiller les cibles et les menaces."
 tank_medium_two_man_tank_turret:0 "Tourelle pour deux hommes"
 tank_medium_two_man_tank_turret_desc:0 "Une tourelle qui permet à deux membres d'équipage de partager le travail de fonctionnement de l'armement et d'observation de la situation. Cela ne permet toujours pas une division efficace du travail au sein de l'équipage."
 tank_medium_three_man_tank_turret:0 "Tourelle à trois hommes"
 tank_medium_three_man_tank_turret_desc:0 "Une tourelle suffisamment grande pour que les trois membres d'équipage puissent se répartir les tâches de chargement et de visée de l'armement principal ainsi que rester conscients de la situation autour d'eux."
 tank_medium_fixed_superstructure_turret:1 "Superstructure fixe moyenne"
 tank_medium_fixed_superstructure_turret_desc:0 "Une superstructure fixe permet uniquement à l'armement principal de se déplacer selon un petit arc sans faire tourner l'ensemble du véhicule. Cependant, il permet au véhicule de monter un armement plus important tout en étant globalement de plus petite taille, ce qui le rend parfait pour les embuscades."
