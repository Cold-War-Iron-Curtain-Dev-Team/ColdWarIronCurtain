l_french:
 # USA Ideas
 USA_silicon_valley_genesis:0 "La genèse de la Silicon Valley"
 USA_silicon_valley_genesis_desc:0 "La concentration rapide des fabricants de semi-conducteurs, des laboratoires de recherche et du capital-risque dans la vallée de Santa Clara a transformé la Californie du Nord en un épicentre mondial de la microélectronique et de l'innovation technologique."
 USA_commercial_software_pioneers:0 "Pionniers des logiciels commerciaux"
 USA_commercial_software_pioneers_desc:0 "Traiter le code informatique comme une propriété intellectuelle plutôt que comme un jouet pour amateurs a donné naissance à une industrie nationale du logiciel commercialement viable, fer de lance des normes informatiques mondiales."
 USA_microsoft_msdos_hegemony:0 "Hégémonie de Microsoft et MS-DOS"
 USA_microsoft_msdos_hegemony_desc:0 "En conservant les droits de licence non exclusifs pour MS-DOS sur les ordinateurs personnels IBM et les architectures clones, Microsoft a établi un monopole mondial sur les systèmes d'exploitation qui sous-tend l'informatique commerciale mondiale."
 USA_microsoft_windows_monopoly:0 "Monopole de Microsoft Windows"
 USA_microsoft_windows_monopoly_desc:0 "Le triomphe commercial explosif de Windows 3.0 a consolidé la norme PC « Wintel » en tant qu'environnement d'exploitation omniprésent pour les entreprises, l'éducation et les foyers du monde entier."
 USA_digital_superpower:0 "Superpuissance numérique américaine"
 USA_digital_superpower_desc:0 "Des fonderies de silicium de la Bay Area à l'empire du logiciel de Redmond, les États-Unis exercent une domination inégalée sur le matériel, les systèmes d'exploitation et le World Wide Web émergent."

 # European Commodore & Home Computing Ideas
 EUR_commodore_digital_literacy:0 "Alphabétisation numérique Commodore"
 EUR_commodore_digital_literacy_desc:0 "Dans le cadre de la vision de Jack Tramiel : « des ordinateurs pour le grand public, pas pour les classes », les Commodore PET et VIC-20 ont introduit l'informatique abordable dans les écoles secondaires, les écoles polytechniques et les petites entreprises européennes."
 EUR_c64_mass_computing:0 "Boom du calcul de masse C64"
 EUR_c64_mass_computing_desc:0 "Le Commodore 64 est devenu le micro-ordinateur le plus vendu en Europe occidentale, démocratisant l'électronique et enseignant à des millions de jeunes européens la programmation BASIC et l'assemblage 6502."
 EUR_amiga_golden_age:0 "L'âge d'or de l'Amiga"
 EUR_amiga_golden_age_desc:0 "Le Commodore Amiga 500 représente le summum de l'informatique domestique 16 bits en Europe, offrant des coprocesseurs personnalisés sans précédent, un multitâche préemptif, des graphiques 4 096 couleurs et un son stéréo à quatre canaux."
 EUR_demoscene_creative_culture:0 "Sous-culture démoscène européenne"
 EUR_demoscene_creative_culture_desc:0 "Une sous-culture numérique underground composée de clubs de hackers, de groupes de démonstration, de musiciens trackers et de magiciens de l'assemblage à travers l'Allemagne, la Grande-Bretagne et la Scandinavie, poussant le silicium des micro-ordinateurs à des extrêmes artistiques miraculeux."
 EUR_european_software_studios:0 "Hubs européens de studios numériques"
 EUR_european_software_studios_desc:0 "Les programmeurs de chambre élevés sur C64 et Amiga ont fondé des studios de jeux et des éditeurs de logiciels de classe mondiale, de Dundee et Liverpool à Cologne, pionniers du divertissement numérique interactif moderne."
 EUR_commodore_post_bankruptcy_legacy:0 "L'héritage de la révolution des micro-ordinateurs"
 EUR_commodore_post_bankruptcy_legacy_desc:0 "Bien que Commodore International ait succombé à la mauvaise gestion de l'entreprise, les millions de programmeurs, d'artistes numériques et d'ingénieurs système qu'elle a créés constituent désormais le fondement des secteurs européens de l'informatique et des logiciels de haute technologie."

 # Tech bonuses
 computing_tech_bonus:0 "Bonus de recherche en technologie informatique"
 gui_computing_bonus:0 "Bonus d'interface graphique et d'architecture de systèmes"
 windows_gui_bonus:0 "Bonus logiciel d'environnement graphique"
 amiga_multimedia_bonus:0 "Bonus multimédia du chipset personnalisé Amiga"
 pc_transition_bonus:0 "Bonus de transition de plate-forme PC"

 # USA Events
 USA_TECH.1.t:0 "L'aube de la Silicon Valley"
 USA_TECH.1.d:0 "Dans le comté de Santa Clara, en Californie, une transformation extraordinaire est en cours. Le journaliste Don Hoefler a inventé le surnom de « Silicon Valley » pour décrire la concentration explosive de pionniers des semi-conducteurs, issus de Shockley Semiconductor et Fairchild. Chez Intel Corporation, les ingénieurs Federico Faggin, Ted Hoff et Stan Mazor ont dévoilé l'Intel 4004, le premier microprocesseur commercial au monde sur une seule tranche de silicium. En compressant l'intégralité de l'unité centrale d'un ordinateur sur une micropuce contenant 2 300 transistors, les fondements de l'informatique personnelle et industrielle ont été fondamentalement réécrits."
 USA_TECH.1.a:0 "Une nouvelle ère technologique commence en Californie."

 USA_TECH.101.t:0 "La révolution des microprocesseurs"
 USA_TECH.101.d:0 "Des ingénieurs de la nouvelle « Silicon Valley » de Californie ont dévoilé le microprocesseur, qui place toute la puissance de calcul d'un ordinateur électronique sur une puce microscopique de silicium. Les scientifiques et les dirigeants industriels prédisent que cette avancée permettra bientôt d'intégrer la puissance de calcul aux machines quotidiennes, à l'automatisation des usines et à l'électronique grand public du monde entier."
 USA_TECH.101.a:0 "L'ère du silicium commence."

 USA_TECH.2.t:0 "Le club informatique Homebrew et l'Altair 8800"
 USA_TECH.2.d:0 "Dans un garage de Menlo Park, en Californie, un rassemblement de passionnés d'électronique contre-culturelle, d'opérateurs radio amateurs et d'ingénieurs s'est réuni pour la réunion inaugurale du Homebrew Computer Club. Inspirés par l'ordinateur en kit MITS Altair 8800 présenté sur la couverture de Popular Electronics, ces amateurs passionnés partagent des schémas, soudent des circuits imprimés et écrivent des routines sur bande papier. Ce qui a commencé comme un collectif populaire excentrique s'est rapidement transformé en un mouvement social et technologique révolutionnaire visant à libérer l'informatique des monopoles des grandes entreprises."
 USA_TECH.2.a:0 "Soutenez la philosophie des amateurs de base."
 USA_TECH.2.b:0 "Les entreprises commerciales doivent canaliser cette énergie."

 USA_TECH.3.t:0 "Micro-Soft fondé à Albuquerque"
 USA_TECH.3.d:0 "Conscients que le matériel sans logiciel est inerte, Bill Gates et Paul Allen, étudiants de Harvard, ont produit un interprète pour le langage de programmation BASIC fonctionnant sur l'Altair 8800. S'installant dans un motel d'Albuquerque près du siège du MITS, ils ont officiellement enregistré le partenariat « Micro-Soft ». En réponse à la copie généralisée sur bande par les amateurs de clubs, le jeune Gates a écrit une cinglante « Lettre ouverte aux amateurs », déclarant que les logiciels nécessitent un travail et une expertise immenses, et que les créateurs méritent une rémunération commerciale équitable. Micro-Soft a établi le principe selon lequel les logiciels constituent une industrie commerciale distincte et lucrative."
 USA_TECH.3.a:0 "Le logiciel est un métier commercial qui mérite une compensation."

 USA_TECH.4.t:0 "L'ordinateur Apple et la révolution du garage"
 USA_TECH.4.d:0 "À Los Altos, en Californie, Steve Wozniak et Steve Jobs ont transformé la conception de circuits amateurs en un triomphe commercial. Après avoir construit à la main l'Apple I dans le garage de la famille Jobs, ils ont dévoilé l'Apple II au West Coast Computer Faire. Dotée d'un élégant boîtier en plastique moulé, d'un clavier intégré, de graphiques couleur et de connecteurs d'extension, la machine ne nécessite aucun fer à souder ni diplôme électronique pour fonctionner. Les ordinateurs personnels ne sont plus des kits ésotériques pour amateurs : ils deviennent des appareils incontournables pour les salles de classe, les bureaux de comptabilité et les foyers américains."
 USA_TECH.4.a:0 "Un ordinateur pour chaque maison et chaque classe."

 USA_TECH.104.t:0 "L'ordinateur personnel arrive sur le marché de masse"
 USA_TECH.104.d:0 "Le micro-ordinateur personnel a transcendé ses origines en tant que kit ésotérique pour amateurs. Avec l'arrivée de machines élégantes et prêtes à l'emploi comme l'Apple II dans les écoles, les foyers et les petites entreprises à travers les États-Unis, les observateurs proclament que l'ordinateur n'est plus l'apanage exclusif des ordinateurs centraux universitaires et des laboratoires de défense."
 USA_TECH.104.a:0 "L'informatique appartient au peuple."

 USA_TECH.5.t:0 "Xerox PARC et l'interface utilisateur graphique"
 USA_TECH.5.d:0 "Au Centre de recherche Xerox Palo Alto (PARC) en Californie, des informaticiens ont secrètement développé l'avenir de l'interaction homme-machine. L'ordinateur Xerox Alto est doté d'un affichage graphique bitmap haute résolution, d'un dispositif de pointage appelé « souris », de fenêtres qui se chevauchent, de menus déroulants, d'un réseau Ethernet et d'une programmation orientée objet. Alors que les dirigeants d'entreprise du siège social de Xerox à New York restent indifférents à la commercialisation de ces inventions, les ingénieurs en visite dans la Silicon Valley ont assisté à la démonstration avec admiration. L'ère de la ligne de commande vit en sursis."
 USA_TECH.5.a:0 "Bitmaps, souris et fenêtres : l'avenir est devant nous."

 USA_TECH.6.t:0 "Le contrat IBM PC et le coup de maître MS-DOS"
 USA_TECH.6.d:0 "International Business Machines est entré dans la mêlée des micro-ordinateurs avec le lancement de l'ordinateur personnel IBM 5150. S'écartant radicalement de son développement traditionnel et secret, IBM s'est tourné vers des fournisseurs extérieurs, en engageant Bill Gates et Microsoft pour fournir le système d'exploitation. Microsoft a acheté 86-DOS (Quick and Dirty DOS) à Seattle Computer Products, l'a adapté en PC-DOS pour IBM et a insisté de manière cruciale pour conserver le droit de concéder sous licence MS-DOS à d'autres fabricants d'ordinateurs. Alors que les clones compatibles PC issus de l'ingénierie inverse inondent le marché, Microsoft s'est positionné comme le collecteur de péages de l'informatique de bureau mondiale."
 USA_TECH.6.a:0 "Le modèle de licence ouverte crée une norme mondiale."

 USA_TECH.106.t:0 "IBM lance une norme pour les ordinateurs personnels"
 USA_TECH.106.d:0 "Le géant de l'informatique IBM a lancé son ordinateur personnel (IBM PC), alimenté par des processeurs Intel et un logiciel de système d'exploitation fourni par Microsoft. En publiant ses spécifications techniques, IBM a involontairement déclenché un vaste écosystème de clones compatibles, consolidant ainsi une norme mondiale en matière de bureautique commerciale."
 USA_TECH.106.a:0 "Une norme d'entreprise est établie."

 USA_TECH.7.t:0 "Sand Hill Road : L'explosion du capital-risque"
 USA_TECH.7.d:0 "Le long de Sand Hill Road, à Menlo Park, en Californie, des sociétés de capital-risque telles que Kleiner Perkins et Sequoia Capital ont amassé des trésors de guerre financiers sans précédent. Les capitaux affluent vers les postes de travail UNIX hautes performances (Sun Microsystems, Silicon Graphics), les bases de données relationnelles (Oracle) et le matériel de réseau informatique (Cisco Systems). La fusion symbiotique de la recherche universitaire de l'Université de Stanford, des contrats fédéraux de défense et du capital-investissement agressif a fait de la Silicon Valley le moteur incontesté de la prospérité technologique américaine."
 USA_TECH.7.a:0 "Alimentez l'économie des startups de haute technologie."

 USA_TECH.8.t:0 "Sortie de Microsoft Windows 1.0"
 USA_TECH.8.d:0 "Microsoft a officiellement publié Windows 1.0, un environnement d'exploitation graphique fonctionnant sur MS-DOS. Offrant des fenêtres en mosaïque, le contrôle de la souris, le multitâche coopératif et un shell graphique, Windows permet aux utilisateurs de gérer des fichiers et d'exécuter des applications sans taper d'invites de ligne de commande énigmatiques. Alors que les premiers critiques notent ses exigences matérielles et sa palette limitée, cette version marque l'engagement décisif de Microsoft en faveur de l'informatique visuelle."
 USA_TECH.8.a:0 "Un avenir graphique commence à prendre forme."

 USA_TECH.9.t:0 "Windows 3.0 et le monopole mondial des ordinateurs de bureau"
 USA_TECH.9.d:0 "Microsoft a lancé Windows 3.0, remportant un triomphe commercial sans précédent avec plus de dix millions d'exemplaires vendus en deux ans. Doté de riches graphiques VGA 16 couleurs, d'une gestion de la mémoire en mode protégé utilisant des puces Intel 80386 et d'un gestionnaire de fichiers intuitif, Windows 3.0 a transformé le PC IBM compatible en une véritable plate-forme multimédia. Le standard « Wintel », combinant Microsoft Windows et les microprocesseurs Intel, détient désormais un monopole quasi total et inébranlable sur les ordinateurs d'entreprise et personnels du monde entier."
 USA_TECH.9.a:0 "Wintel domine le marché mondial des ordinateurs de bureau."

 USA_TECH.109.t:0 "Microsoft Windows balaie les marchés mondiaux"
 USA_TECH.109.d:0 "Microsoft Corporation a consolidé sa domination écrasante sur les marchés mondiaux des logiciels informatiques grâce au succès fulgurant de Windows 3.0. Des millions d'entreprises, d'établissements universitaires et de foyers dans le monde ont adopté l'environnement PC graphique, consolidant ainsi le logiciel comme l'une des industries les plus lucratives au monde."
 USA_TECH.109.a:0 "L'ère des ordinateurs personnels bat son plein."

 USA_TECH.10.t:0 "Windows 95 : l'ère Internet libérée"
 USA_TECH.10.d:0 "Soutenu par une campagne promotionnelle massive de 300 millions de dollars mettant en vedette « Start Me Up » des Rolling Stones et des ouvertures de magasins à minuit dans le monde entier, Microsoft a lancé Windows 95. Doté d'un véritable multitâche préemptif 32 bits, du menu Démarrer révolutionnaire, de noms de fichiers longs, d'une architecture matérielle Plug-and-Play et d'une intégration profonde avec le World Wide Web émergent via Internet Explorer, Windows 95 est un poids lourd culturel et économique. La haute technologie américaine entre dans le 21e siècle en se positionnant comme l'hégémon numérique incontesté de la planète."
 USA_TECH.10.a:0 "« Start Me Up » : l'Amérique est à la tête de l'autoroute de l'information."

 USA_TECH.110.t:0 "Windows 95 lancé dans un phénomène mondial"
 USA_TECH.110.d:0 "Dans un spectacle sans précédent de culture de consommation mondiale, Microsoft Windows 95 a été lancé dans le monde entier avec des clients faisant la queue dans les pâtés de maisons de New York à Londres et Tokyo. Le système d'exploitation rend l'informatique multimédia et la connectivité Internet accessibles à des centaines de millions de personnes, marquant ainsi le véritable début de l'ère mondiale de l'information."
 USA_TECH.110.a:0 "L'ère de l'information est arrivée."

 # Europe Commodore Events
 EUR_COMMODORE.1.t:0 "Commodore arrive en Europe"
 EUR_COMMODORE.1.d:0 "Jack Tramiel, survivant tenace et industriel à la tête de Commodore International, a jeté son dévolu sur l'Europe. Opérant sous la devise enflammée de Tramiel - « Nous devons construire des ordinateurs pour les masses, pas pour les classes » - Commodore a établi d'importants sièges sociaux européens à Francfort-sur-le-Main, en Allemagne de l'Ouest, et à Slough, en Angleterre. Le Commodore PET 2001, avec son moniteur et son lecteur de cassettes intégrés, fait son entrée dans les écoles secondaires, les écoles polytechniques et les laboratoires de recherche en Grande-Bretagne, en Allemagne et en Europe occidentale, inaugurant une ère de culture numérique généralisée."
 EUR_COMMODORE.1.a:0 "Adoptez des micro-ordinateurs abordables pour l'éducation et l'industrie."

 EUR_COMMODORE.101.t:0 "Commodore étend ses micro-ordinateurs à travers l'Europe"
 EUR_COMMODORE.101.d:0 "Commodore International a lancé une expansion agressive sur les marchés européens, en plaçant des micro-ordinateurs personnels à faible coût dans les écoles secondaires, les universités et les bureaux commerciaux. Les éducateurs européens saluent la démocratisation des compétences en programmation informatique parmi la jeune génération."
 EUR_COMMODORE.101.a:0 "Une nouvelle ère d'informatique accessible."

 EUR_COMMODORE.2.t:0 "Le Commodore 64 à la conquête des salons européens"
 EUR_COMMODORE.2.d:0 "Le Commodore 64 est devenu un phénomène culturel dans toute l'Europe occidentale. Alors que les marchés américains des bureaux restent obsédés par les mainframes d'entreprise coûteux, les détaillants européens - de Karstadt et Quelle en Allemagne de l'Ouest à Dixons et WHSmith au Royaume-Uni - vendent des C64 par centaines de milliers directement aux consommateurs. Alimentée par la puce de synthèse sonore révolutionnaire MOS 6581 SID conçue par Bob Yannes et le processeur graphique VIC-II, la machine offre de superbes audiovisuels d'arcade dans les salons ordinaires. Des millions d'adolescents européens tapent des listes BASIC dans des magazines et découvrent les secrets du code machine 6502."
 EUR_COMMODORE.2.a:0 "La « corbeille à pain » devient l'ordinateur préféré des Européens."

 EUR_COMMODORE.102.t:0 "Le Commodore 64 : la révolution numérique en Europe"
 EUR_COMMODORE.102.d:0 "Le micro-ordinateur Commodore 64 a battu des records de ventes en Grande-Bretagne, en Allemagne de l'Ouest, en Scandinavie et en Europe occidentale. Vendue pour une fraction des machines professionnelles d'entreprise, la machine a introduit des graphiques programmables et de la musique de synthèse dans des millions de foyers européens, créant une vague sans précédent d'alphabétisation numérique chez les jeunes."
 EUR_COMMODORE.102.a:0 "L'ordinateur le plus vendu de l'histoire."

 EUR_COMMODORE.3.t:0 "L'Amiga 1000 : la magie de la Silicon Valley en Europe"
 EUR_COMMODORE.3.d:0 "Commodore a dévoilé l'Amiga 1000 dans les capitales technologiques européennes. Conçu par le légendaire architecte de puces Jay Miner, l'Amiga est une merveille technologique à couper le souffle. Piloté par des coprocesseurs personnalisés surnommés Agnus, Paula et Denise, il offre un véritable multitâche préemptif, des graphiques de 4 096 couleurs et un son stéréo échantillonné sur quatre canaux, des capacités qui laissent des années derrière les ordinateurs IBM PC et Apple Macintosh. Promu par des personnalités comme Andy Warhol et adopté par des artistes, producteurs vidéo et musiciens européens, l'Amiga est salué comme la machine créative ultime."
 EUR_COMMODORE.3.a:0 "Un chef-d'oeuvre multimédia avec des années d'avance sur ses concurrents."

 EUR_COMMODORE.4.t:0 "L'Amiga 500 : l'âge d'or de l'informatique européenne"
 EUR_COMMODORE.4.d:0 "Commodore a lancé l'Amiga 500 dans les grands magasins européens à un prix abordable (£499 en Grande-Bretagne, 1 090 DM en Allemagne de l'Ouest). La réponse a été massive : l'A500 a déclenché l'âge d'or de l'informatique domestique européenne. Des millions de foyers allemands, britanniques, français, néerlandais et scandinaves concentrent désormais leur vie créative et récréative autour de la machine. Dans les cours d'école et les clubs informatiques, l'échange de disques, l'échantillonnage audio et les animations Deluxe Paint sont devenus la lingua franca de toute une génération."
 EUR_COMMODORE.4.a:0 "L'Amiga 500 libère la puissance créatrice de l'Europe."

 EUR_COMMODORE.104.t:0 "L'Amiga 500 balaye l'Europe occidentale"
 EUR_COMMODORE.104.d:0 "Le Commodore Amiga 500 a acquis une popularité sans précédent dans toute l'Europe occidentale, consolidant ainsi sa position de premier ordinateur domestique multimédia. Les éditeurs de logiciels européens et les sous-cultures de la jeunesse produisent des expériences artistiques et ludiques interactives révolutionnaires."
 EUR_COMMODORE.104.a:0 "L'âge d'or du multimédia."

 EUR_COMMODORE.5.t:0 "La scène démo européenne et la sous-culture numérique"
 EUR_COMMODORE.5.d:0 "En Allemagne de l'Ouest, au Royaume-Uni, en Suède, aux Pays-Bas et en Finlande, une contre-culture numérique unique s'est épanouie : la Demoscene européenne. Issus des crackers de disquettes underground, des groupes de démonstration tels que Red Sector, The Silents, Future Crew et Razor 1911 s'affrontent férocement lors de fêtes de copie massives et de festivals comme Assembly à Helsinki et The Party au Danemark. Les codeurs réalisent des prouesses mathématiques étonnantes avec les puces Blitter et de cuivre de l'Amiga, créant des ombres vectorielles 3D en temps réel, des routines de tir au plasma et une musique de suivi qui poussent le matériel bien au-delà de ce que ses créateurs d'origine pensaient physiquement possible."
 EUR_COMMODORE.5.a:0 "Célébrez cet étonnant art populaire numérique."

 EUR_COMMODORE.6.t:0 "Le boom des studios de jeux européens"
 EUR_COMMODORE.6.d:0 "Les légions de programmeurs de chambre élevés sur le Commodore 64 et l'Amiga sont devenues une formidable industrie de développement de jeux vidéo de classe mondiale à travers l'Europe. À Dundee, en Écosse, DMA Design a captivé des millions de personnes avec Lemmings ; à Liverpool, Psygnosis a posé des jalons artistiques avec Shadow of the Beast ; à Cologne, en Allemagne, Factor 5 a réalisé des miracles techniques avec Turrican ; dans le Yorkshire, Team17 produit Alien Breed et Worms ; tandis qu'en Suède, Digital Illusions (DICE) crée Pinball Dreams. L'Europe s'est imposée comme une superpuissance artistique dans le domaine des médias numériques interactifs."
 EUR_COMMODORE.6.a:0 "L'Europe est leader mondial en matière de divertissement numérique créatif."

 EUR_COMMODORE.106.t:0 "Les studios de jeux européens accèdent à une notoriété mondiale"
 EUR_COMMODORE.106.d:0 "Du Royaume-Uni à l'Allemagne en passant par la Scandinavie, les studios de jeux vidéo indépendants nés de la culture informatique domestique sont devenus des puissances internationales. Les talents créatifs européens dans les domaines de l'infographie, de la conception sonore et des logiciels interactifs sont désormais reconnus comme parmi les meilleurs au monde."
 EUR_COMMODORE.106.a:0 "Un boom créatif né des ordinateurs personnels."

 EUR_COMMODORE.7.t:0 "La chute du Commodore et son héritage durable"
 EUR_COMMODORE.7.d:0 "Le 29 avril 1994, Commodore International a déposé une demande de mise en faillite (chapitre 7) à New York. Paralysé par la mauvaise gestion des dirigeants aux États-Unis, l'échec des projets de clonage de PC et la commercialisation bâclée du CD32, le pionnier de l'informatique personnelle s'est effondré. Des entreprises technologiques européennes comme Escom et Amiga Technologies tentent avec impatience d'acquérir sa propriété intellectuelle. Pourtant, même si l'entreprise est tombée, son triomphe historique en Europe ne peut être effacé : les millions de codeurs, musiciens et concepteurs européens nourris sur le silicium Commodore forment désormais l'élite d'avant-garde de l'informatique, des télécommunications et de l'économie numérique en Europe."
 EUR_COMMODORE.7.a:0 "Soutenir les consortiums informatiques nationaux européens pour acquérir la technologie Amiga."
 EUR_COMMODORE.7.b:0 "Redirigez les talents logiciels européens vers des plates-formes PC et Internet mondiales."

 EUR_COMMODORE.107.t:0 "Commodore International dépose son bilan"
 EUR_COMMODORE.107.d:0 "Commodore International, le pionnier de la révolution informatique domestique qui a introduit le PET, le VIC-20, le Commodore 64 et l'Amiga dans le monde, a déposé une demande de liquidation. Malgré la disparition du géant de l'entreprise, ses innovations technologiques et son impact culturel perdureront pendant des générations."
 EUR_COMMODORE.107.a:0 "Le pionnier de l'informatique domestique tombe, mais son esprit perdure."
