l_french:
 india.1.d:0 "Après plus de quatre ans de délibérations, l'Assemblée constituante de l'Inde a récemment finalisé une constitution pour l'Inde. À l'origine, l'assemblée comptait 389 membres, mais elle a été réduite à 299 après la partition. De nombreuses réalisations ont été réalisées au cours de ses sessions. Le préambule est la célèbre résolution objective, présentée à l'origine par Jawaharlal Nehru en 1946. Parallèlement à d'importantes discussions concernant les castes et les droits provinciaux, l'assemblée a également approuvé le drapeau national. Une fois la constitution devenue loi officielle de l'Inde, la nation ne sera plus un dominion mais une république au sein du Commonwealth. Cela permettra à l'Inde d'être une république sans pour autant rompre complètement ses liens avec les Britanniques. De nombreux Indiens estiment que la fin des relations entre le Dominion et la Grande-Bretagne brisera enfin les derniers vestiges de la domination coloniale."
 Green_Revolution.1.d:0 "Pendant des décennies, le peuple indien a été victime de famine et d'insécurité alimentaire. Même lors de la dernière guerre, le régime colonial a pris de la nourriture à la population pour alimenter sa machine de guerre, poursuivant ainsi l'érosion de l'agriculture. Cependant, grâce aux nouvelles avancées technologiques et à un gouvernement au service du peuple, l'Inde se lancera dans une campagne visant à mettre fin à sa dépendance à l'égard de l'aide alimentaire étrangère et à transformer l'Inde en un grenier pour l'Asie. Les programmes gouvernementaux combinés à de nouvelles recherches doivent guider ce programme historique. Un haut responsable du gouvernement a noté que le régime colonial avait provoqué de fréquentes famines en Inde et n'avait pas réussi à accroître la productivité à mesure que la population augmentait. L'Inde prévoit de résoudre ces problèmes et de fournir aux agriculteurs le soutien financier dont ils ont besoin pour se développer."
 Green_Revolution.2.d:0 "Le Parlement a adopté une loi garantissant un financement national pour le développement de l'agriculture. Une partie des fonds sera versée aux universités pour étudier les causes de l'insécurité alimentaire et développer de nouvelles techniques et technologies pour accroître la production. D'autres financements garantiront l'importation et le développement national de blé à plus haut rendement et plus résistant aux maladies et d'engrais modernes. Des campagnes doivent être lancées à travers le pays pour encourager les agriculteurs à adopter des techniques d'irrigation plus efficaces et à utiliser les nouvelles technologies."
 Vietnam_IND.2.d:0 "Les États-Unis demandent notre soutien pour leurs efforts au Vietnam. Ils ne demandent pas de troupes de combat mais disent que nous devrions au moins fournir un hôpital militaire de campagne pour soutenir le peuple sud-vietnamien. Il est clair que notre refus pourrait entraîner la fin de l'aide actuelle en matière de blé qu'ils nous fournissent. Certains membres du gouvernement estiment que nous devrions offrir un soutien public à la position américaine. Ils affirment que l'aide que nous recevons n'est pas pertinente, mais qu'accepter la demande américaine pourrait contrebalancer la montée des militants communistes mondiaux dans le pays. Nous pourrions également nous attendre à un soutien et à des investissements américains accrus. D'autres responsables estiment que nous devons rester fermes et maintenir notre intégrité en tant qu'État international. Soutenir la guerre néocoloniale ne fera que diviser la république et trahir les valeurs sur lesquelles elle a été fondée."
 Vietnam_IND.3.d:0 "Le gouvernement indien a accepté d'envoyer un hôpital de campagne au Sud-Vietnam et de soutenir publiquement notre position au Vietnam. Cela entravera grandement la propagande communiste en Asie et légitimera notre cause. Plus important encore, les hauts responsables indiens vont désormais s'efforcer de combattre cette propagande et de nous défendre afin de justifier leurs actions. C'est un coup majeur pour notre gouvernement. Des efforts plus importants seront déployés pour convaincre les entreprises et les investisseurs américains de se concentrer sur l'Inde, compte tenu de leur politique étrangère sensée."
 CPI_FP.1.d:0 "Dans un discours émouvant à la nation, le Premier ministre indien a annoncé le retrait de l'Inde du Commonwealth. Le Premier ministre a noté que l'organisation servait simplement à maintenir l'influence coloniale dans les anciennes colonies et que l'Inde devait partir pour sa véritable indépendance. Après le discours, le gouvernement indien a publié sa propre déclaration condamnant l'organisation pour avoir refusé de soutenir les mouvements anticoloniaux et légitimé l'agression occidentale contre des États pacifiques. Le gouvernement britannique a exprimé sa déception et a rejeté les accusations indiennes. L'organisation du Commonwealth a publié sa propre déclaration, affirmant qu'elle favorisait simplement des liens plus forts entre ses membres qui ont une histoire commune."
 CPI_FP.2.d:0 "Le gouvernement indien a exprimé son soutien à l'Union soviétique et a appelé la Chine à mettre fin à sa propagande et à ses actions hostiles. Le gouvernement indien a souligné que l'Union soviétique soutenait depuis longtemps les mouvements de liberté et offrait son soutien aux États en développement. Cette décision suscitera probablement la colère du gouvernement chinois, qui s'inquiète depuis longtemps des liens de plus en plus étroits entre les Soviétiques et les Indiens. Un grand journal chinois a affirmé que les Soviétiques prévoyaient d'utiliser leurs liens avec l'Inde pour encercler stratégiquement la Chine. Il ajoute que l'Inde reste un client colonial, prêt à se vendre au plus offrant. Les journaux indiens n'ont pas tardé à soutenir le gouvernement et à condamner la politique chinoise d'antagonisme et de répression interne. L'Union soviétique a salué cette annonce et a invité le Premier ministre indien à lui rendre visite."
 India_Reconciliation.1.d:0 "Le gouvernement indien a officiellement demandé des pourparlers avec notre gouvernement. Les Indiens affirment vouloir rétablir les relations et mettre fin aux années d'animosité depuis la partition. Il est probable que les Indiens souhaitent normaliser leurs relations et établir des liens commerciaux plus solides. Certains de nos conseillers estiment que cela pourrait aider notre économie qui est ébranlée par la récente guerre et ses pertes. En outre, cela pourrait renforcer le soutien des éléments libéraux de la société. Cependant, l'Inde capitalise probablement sur ses récents succès militaires et s'engager avec elle pourrait être considéré comme une reconnaissance de notre position de faiblesse. Il vaudrait peut-être mieux, pour le moral de notre peuple, rejeter cette initiative et se concentrer sur nos efforts de reconstruction. Nous devons décider comment réagir."
 India_Reconciliation.2.d:0 "Lors de nos entretiens avec l'Inde, ils ont proposé une normalisation complète des relations ainsi qu'un accord visant à assouplir les restrictions à l'immigration. L'accord améliorerait les relations, notamment commerciales. Notre propre population serait probablement favorable à un assouplissement de l'immigration, ce qui permettrait de réunir des familles et des amis longtemps séparés par la partition et offrirait à certains citoyens la possibilité de récupérer leurs propriétés perdues. Cependant, il existe une certaine résistance, notamment parmi les officiers supérieurs de l'armée, qui estiment que la meilleure approche serait de se retirer des pourparlers et d'y mettre un terme. Cela équivaudrait à affirmer le défi pakistanais. Nous devons décider comment réagir."
 India_Reconciliation.3.d:0 "Nos récents efforts visant à normaliser les relations avec le Pakistan se sont soldés par un succès. Les Pakistanais ont accepté de signer une série d'accords qui amélioreront le commerce, normaliseront les relations et assoupliront les restrictions à l'immigration. La nouvelle de l'accord est déjà accueillie positivement au niveau national et international. Le monde considère désormais que l'Inde est un nouveau type de puissance. Les Indiens et les Pakistanais peuvent désormais devenir comme les frères et soeurs qu'ils sont censés être. Nous ne sommes pas une puissance militariste ou impérialiste, mais plutôt une nation épris de paix et dévouée à une paix continue."
 India_Reconciliation.4.d:0 "Les efforts indiens pour normaliser leurs relations avec le Pakistan se sont soldés par un échec embarrassant. Les Pakistanais ont condamné les Indiens pour avoir cherché à consolider leurs récents succès et à faire du Pakistan une marionnette indienne. Le gouvernement pakistanais a publié une autre déclaration affirmant qu'il n'abandonnerait jamais son désir de libérer le peuple du Cachemire et d'empêcher l'Inde de devenir une puissance hégémonique en Asie du Sud. Le gouvernement indien a répondu en affirmant que le Pakistan politisait un véritable effort de paix et qu'il avait seulement révélé son désir de guerre."
 Pakistan_Ties_Normalized:0 "Les relations avec le Pakistan sont normalisées"
 India_Ties_Normalized:0 "Les liens avec l'Inde sont normalisés"
 india.7.t:0 "Création de la République populaire de l'Inde !"
 india.7.d:0 "Aujourd'hui à Delhi, le drapeau de la République populaire de l'Inde a été hissé et le drapeau de la République de l'Inde a été abaissé. La République populaire de l'Inde a revendiqué la victoire dans sa guerre révolutionnaire contre la République de l'Inde. La direction du PRI a déclaré avoir libéré le pays des princes et des dirigeants républicains indiens corrompus qui ont pris les roturiers légitimes. Les dernières forces et habitants de la République de l'Inde ont traversé la frontière vers le Pakistan ou la Birmanie voisins et sont également partis vers Ceylan. L'OTAN a qualifié cela d'échec et de revers dans la région de l'Asie du Sud. Le Kominform qualifie cela de succès pour l'ouverture des portes de l'Asie du Sud et du Moyen-Orient à la libération et à la révolution. Les combats ont pris fin en Inde, mais les Indiens exilés affirment que le combat n'est pas terminé."
 india.7.a:0 "Que va-t-il arriver à l'Inde maintenant ?"
 india.8.t:0 "La rébellion communiste échoue en Inde !"
 india.8.d:0 "Les dernières forces rebelles de l'État d'Hyderabad ont été retrouvées dans les montagnes et se sont rendues. La République populaire de l'Inde s'est rendue à Hyderabad après que ses dernières forces aient été pourchassées par l'armée indienne. L'Inde a institué une force d'occupation pour s'assurer que toutes les dernières forces soient anéanties. La République de l'Inde a qualifié cela de grande victoire dans son pays."
 india.8.a:0 "Intéressant"
 Increased_American_Investments:0 "Augmentation des investissements américains"
 Supports_American_Efforts_in_Vietnam:0 "Soutient les efforts américains au Vietnam"
 Vietnam_IND.1.d:0 "La situation au Vietnam continue de s'aggraver. À l'échelle internationale, la propagande nord-vietnamienne a trouvé un écho dans tous les États postcoloniaux, notamment en Inde. Le gouvernement indien ne fait pas grand-chose pour mettre un terme à un soutien aussi flagrant aux rebelles communistes. Nos missions diplomatiques signalent une montée de l'anti-américanisme et une perception croissante selon laquelle la guerre que nous menons est une guerre de colonialisme et non une guerre visant à protéger le peuple vietnamien de la tyrannie communiste. Le Département d'État nous recommande d'appeler le gouvernement indien à soutenir ouvertement notre position, à éduquer la population et à envoyer un hôpital militaire de campagne au Sud-Vietnam. Demander des troupes de combat ne serait pas réaliste, mais un tel soutien renforcerait notre position et notre légitimité en Asie. Si l'Inde résiste, nous pouvons menacer de réduire notre aide au blé. Certains membres du cabinet s'opposent à ce plan, affirmant que nous chasserons simplement les Indiens de notre camp et que nous perdrons l'influence dont nous disposons."

 India_Emergency.21.d:0 "Le Parlement indien a adopté le trente-neuvième amendement, ce qui en fait le deuxième amendement adopté depuis la déclaration de l'état d'urgence. La nouvelle loi impose des restrictions judiciaires à sa capacité à enquêter sur la position du Premier ministre. Cela rend essentiellement invalide l'affaire de fraude électorale portée contre le Premier ministre Indira Gandhi. Le gouvernement affirme que la nouvelle loi garantira que le pouvoir judiciaire ne puisse pas s'immiscer dans la gouvernance de la nation en invalidant des hommes politiques sur la base d'accusations superficielles. L'opposition a critiqué cette décision, soulignant qu'il s'agit du dernier d'une série d'amendements adoptés depuis 1970 qui ont considérablement affaibli le pouvoir du pouvoir judiciaire."

 Srikakulum.1.d:0 "Ces dernières semaines, les tensions à Srikakulam se sont intensifiées après l'assassinat de deux membres communistes pro-paysans, apparemment par un groupe de propriétaires. En réponse, les militants communistes ont rallié les populations tribales paysannes pour se joindre à eux pour saisir les terres et la nourriture des propriétaires fonciers. Les bandes de paysans cultivent des terres détenues depuis des décennies par les élites locales mais inutilisées. Jusqu'à présent, les efforts déployés par les autorités locales pour négocier une solution et réduire les tensions ont échoué. Les autorités locales ont déclaré aux médias qu'elles pourraient bientôt déployer la police et empêcher les actes criminels de se propager dans la région et ont condamné les militants pour avoir induit les paysans en erreur au profit de leurs propres programmes néfastes."
 Srikakulum.2.d:0 "Les troubles paysans à Srikakulum ont récemment dégénéré en raids paysans visant les propriétaires fonciers. Les perquisitions ont eu lieu à la suite du meurtre présumé de militants communistes par les propriétaires. Quoi qu'il en soit, la situation de l'ordre public s'est rapidement détériorée, obligeant la police locale à être déployée. Les opérations de police ont largement échoué, leurs raids sont inefficaces et les paysans rebelles ont réussi à prendre d'assaut plusieurs postes de police, provoquant la fuite des policiers. Les récents raids massifs des combattants paysans sont plus préoccupants. Dans un cas particulier, plusieurs centaines de paysans ont pris d'assaut la propriété d'un propriétaire, volant de la nourriture et des marchandises d'une valeur de plusieurs dizaines de milliers de roupies. Quelques semaines plus tard, une autre masse de paysans rebelles a attaqué un village et la police locale, au nombre de plusieurs centaines, a été contrainte de fuir après avoir subi de lourdes pertes. Face à l'escalade de la situation, le gouvernement indien a annoncé qu'il déploierait des forces paramilitaires dans la région."
 Srikakulum.3.d:0 "La situation à Srikakulum a été largement rétablie grâce au déploiement des forces paramilitaires. Ces troupes dirigées par des officiers compétents et bien mieux équipés que les forces paysannes parvinrent à disperser les bandes rebelles et à contraindre de nombreux paysans à abandonner leur résistance armée. Plusieurs dirigeants communistes ont également été tués lors de raids menés par les forces de sécurité, affaiblissant considérablement l'organisation des paysans. L'armée a considérablement réduit ses opérations et levé les restrictions d'urgence car il semble que la plupart des paysans ont abandonné la résistance armée et que les dirigeants communistes survivants sont dans la clandestinité. L'ordre public semble revenir en Inde, mais ces agitateurs de paysans ruraux se cachent toujours parmi la population."

 INC_60s.1.d:0 "Le Parti du Congrès national indien est à l'avant-garde de la liberté et du progrès depuis sa fondation en 1885. C'est le Congrès qui a mené la lutte pour la liberté et a contribué à forger une Inde unie fondée sur les idées de laïcité, d'égalité et de démocratie. Cependant, le parti a une grande variété de perspectives et de points de vue. Le Premier ministre a remarqué ces derniers mois qu'un schisme commençait à se former entre l'aile la plus à gauche du parti et la faction la plus à droite. Les gauchistes continuent de plaider en faveur de politiques socialistes et de la promotion de l'égalité des richesses. Cependant, la droite, dirigée par Moraji Desai, déplore l'évolution vers ce qu'elle considère comme une idéologie socialiste étrangère et une incapacité à promouvoir les valeurs gandhiennes traditionnelles. Ils estiment également que le gouvernement devrait soutenir les communautés d'affaires responsables afin de promouvoir l'économie indienne."
 INC_60s.2.d:0 "Les efforts déployés par le Premier ministre pour négocier un soutien avec les deux ailes du Parti du Congrès se sont soldés par un désastre suite à la décision prise par la direction du parti d'expulser du parti la Première ministre Indira Gandhi. La Première ministre est accusée de violer la discipline de parti et beaucoup pensent que cela est le résultat de son soutien actif à des politiques plus à gauche. En réponse, Indira Gandhi a annoncé qu'elle formerait sa propre faction du Congrès national indien composée de ses partisans et maintiendrait son gouvernement par le biais d'une coalition. Les autres membres du Congrès national indien se sont organisés sous la direction de Moraji Desai, célèbre combattant de la liberté et défenseur des valeurs adoptées par le Mahatma Gandhi. Il a promis que son parti ne suivrait pas les idéologies étrangères mais renforcerait plutôt l'économie et défendrait la société envisagée par le Mahatma."

 Smiling_Buddha.1.d:0 "Le Premier ministre indien a secrètement ordonné au Centre de recherche atomique de Bhabha de commencer les préparatifs en vue de l'assemblage et de la production d'un dispositif nucléaire en vue d'un essai. Les préparatifs étaient terminés et, hier soir, l'Inde a fait exploser un engin nucléaire. Le gouvernement indien a confirmé la détonation, baptisée Smiling Buddha, et l'a qualifiée d'essai nucléaire pacifique. Le climat international et régional actuel oblige l'Inde à affirmer sa position. La bombe nucléaire est l'arme la plus puissante de la planète et démontrer que nous la possédons placera l'Inde en compagnie d'élite. Le Premier ministre a gardé un contrôle strict sur les informations liées au test et à ses préparatifs, c'est pourquoi une grande partie du gouvernement indien, de la population et même de l'armée ont été prises au dépourvu par la nouvelle. La réaction du public a été largement positive, les Indiens se considérant désormais comme faisant partie de l'élite mondiale et de la première puissance de la région."
 Smiling_Buddha.2.d:0 "Le gouvernement indien a confirmé avoir récemment fait exploser un engin nucléaire dans le cadre d'une opération baptisée « Bouddha souriant ». L'explosion, conduite sous terre, a surpris le monde entier et sa détonation a été ressentie jusqu'à Islamabad. Les médias indiens et une grande partie du gouvernement indien ont exprimé leur surprise mais aussi leur joie à l'annonce de l'adhésion de l'Inde au Club nucléaire d'élite. Le Pakistan n'a pas tardé à condamner le test indien, le qualifiant de provocation et d'escalade, tout en promettant de ne pas se laisser intimider dans le silence. Malgré ces paroles de défi, le gouvernement indien semble imperturbable et insiste sur le fait que l'essai n'est pas de nature militaire et qu'il représente simplement une réalisation scientifique majeure pour l'Inde. Les autres grandes puissances sont restées largement silencieuses, mais les États-Unis devraient bientôt faire une déclaration."
 Smiling_Buddha.3.d:0 "L'Inde a récemment fait exploser un engin nucléaire, ce qui en fait une nouvelle puissance nucléaire. Le gouvernement indien insiste sur le fait que le test était purement scientifique et non militaire. Nos propres sources de renseignement concluent que l'armée indienne a été largement exclue de la planification du test, bien que ses officiers supérieurs aient été informés de la préparation et des progrès du test. L'Inde construira certainement un arsenal nucléaire, au minimum pour avoir un effet dissuasif. Cet essai bouleverse tout équilibre des pouvoirs en Asie du Sud et nous craignons que d'autres États, notamment le Pakistan, ne cherchent également à développer leurs capacités nucléaires. Nous avons deux manières de réagir : nous pouvons sanctionner l'Inde pour avoir introduit des armes nucléaires dans la région sans aucun avertissement, ou nous pouvons simplement exprimer nos inquiétudes aux Indiens. Notre propre population ne semble pas trop gênée par ce test, mais imposer des sanctions renforcerait les liens avec le Pakistan."

