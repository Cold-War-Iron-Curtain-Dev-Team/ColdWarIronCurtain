 IND_BENGAL.1.d:0 "L'armée pakistanaise a récemment lancé une campagne de répression au Pakistan oriental. Leur violence brutale a aggravé la situation et entraîné une crise croissante des réfugiés. Les Pakistanais, en particulier les hindous, fuient le Pakistan oriental vers Calcutta. Ils racontent des histoires d'atrocités et de répression brutale. Les médias internationaux couvrent la situation tandis que les autorités locales installent des camps de réfugiés d'urgence. Les rapports en provenance de la frontière suggèrent que le nombre de réfugiés atteindra probablement plusieurs millions. Le gouvernement fédéral interviendra pour aider les autorités locales. Compte tenu du nombre de réfugiés et des ressources dont nous aurons besoin pour les accueillir, nous pouvons nous attendre à ce que l'économie en soit affectée. On craint également que les tensions ne s'accentuent entre notre population et les réfugiés. Quoi qu'il en soit, le peuple indien doit se montrer à la hauteur et aider les Bengalis qui souffrent de la répression militaire."
 IND_BENGAL.2.d:0 "Le gouvernement indien nous a officiellement demandé d'agir pour contribuer à résoudre la situation au Pakistan oriental. Les Indiens soulignent la crise croissante des réfugiés à Calcutta et les informations largement relayées sur une répression militaire brutale au Pakistan. Les Indiens suggèrent que si une solution ne peut être trouvée, ils pourraient être contraints d'agir et de résoudre la situation eux-mêmes. Nous entretenons des liens historiquement étroits avec le Pakistan et le Département d'État suggère que nous puissions faire pression sur eux. Nos médias nationaux couvrent largement la répression pakistanaise et il y a une agitation croissante pour que nous agissions et mettes fin à la violence. Cependant, les Pakistanais considéreraient probablement tout effort de notre part de manière négative et notre politique n'est généralement pas de ne pas intervenir dans les affaires intérieures d'États amis à la demande d'autres États."
 IND_BENGAL.3.d:0 "Les États-Unis ont récemment envoyé une délégation diplomatique au Pakistan et ont exhorté son gouvernement à mettre fin à ses opérations militaires en cours au Pakistan oriental. Le gouvernement pakistanais a déclaré publiquement qu'il appréciait l'intérêt américain, mais des rapports privés indiquent qu'il est furieux. Il est peu probable que les efforts américains amènent le Pakistan à modifier son approche de la situation, mais ils témoignent de l'isolement international croissant auquel le Pakistan est confronté dans le cadre de ses opérations en cours. Le gouvernement indien a publié une déclaration en faveur de l'effort américain, alimentant les reportages des médias pakistanais accusant l'Amérique et l'Inde de collusion contre la nation."
 IND_BENGAL.4.d:0 "Le gouvernement indien a récemment envoyé une délégation d'urgence pour s'entretenir avec nous sur la crise actuelle au Pakistan oriental. Les Indiens ont exprimé leurs craintes que si la situation se détériorait davantage, cela pourrait conduire à une catastrophe dans toute la région. Ils nous ont exhortés à mettre en oeuvre la formule Ahsan comme la meilleure solution pour mettre fin à la crise de manière pacifique et honorable. Cela s'est fait en privé car les Indiens ne voulaient pas donner l'impression qu'ils nous forçaient la main et nous donner une couverture politique, ce qui est apprécié. De hauts responsables militaires et des faucons exhortent le président à rejeter ce qu'ils considèrent comme une hégémonie indienne. Cependant, certains membres du cabinet estiment que la formule Ahsan reste la meilleure solution et que nous devrions la mettre en oeuvre dès que possible."
 IND_BENGAL.5.d:0 "Nous avons reçu un ultimatum troublant de la part du gouvernement indien nous appelant à mettre immédiatement fin aux opérations militaires et à nous retirer du soi-disant Bangladesh. Les Indiens qualifient ces opérations de crise humanitaire et d'incubateur de violations des droits de l'homme qui vont déborder et conduire à une catastrophe dans toute la région. Ils nous donnent trois mois pour mettre en oeuvre le retrait, déclarant que si nous ne le faisons pas, l'Inde pourrait prendre toutes les mesures nécessaires pour mettre fin à la violence. Nombreux sont ceux qui estiment que l'Inde se contente de fanfaronner et n'a aucune intention de s'impliquer militairement. Certains autres dirigeants estiment que même si l'Inde intervient, la nation pakistanaise est plus que prête à offrir une réponse appropriée. En privé, quelques responsables exhortent le président à accepter l'ultimatum et à réduire nos pertes au Pakistan oriental. Ils affirment que l'impact d'un retrait est de loin préférable à ce qu'ils craignent qui pourrait finir par être un désastre militaire."


