 conquest.100.d: "La République de Corée est désormais au bord de l'effondrement puisque sa capitale, Séoul, vient d'être envahie avec succès par l'avancée des troupes nord-coréennes. La Corée du Nord, utilisant des tactiques similaires à la Blitzkrieg, a utilisé ses chars de fabrication soviétique pour avancer de force vers Séoul, laissant de lourdes pertes aux Sud-Coréens puisqu'ils ne disposent d'aucune sorte d'armes antichar ou de chars. Les Sud-Coréens, dans le but de stopper l'avancée du Nord, ont fait sauter le pont sur la rivière Han, piégeant des milliers de soldats et de civils qui ont désespérément besoin d'être évacués et de soins médicaux. Cet événement de la guerre de Corée montre la faiblesse de la Corée du Sud, soutenue par les États-Unis, et les observateurs pensent que si cette tendance se poursuit, la capitulation devrait avoir lieu d'ici quelques mois."
 
 conquest.101.d: " L'espoir pour la démocratie et les libertés civiles dans la péninsule coréenne a été une fois de plus ravivé, alors que la coalition de l'ONU composée des États-Unis et de ses alliés a réussi à reprendre Séoul aux mains de l'APK stationnée pour mettre en garnison et occuper la ville. La victoire n'a cependant pas été facile, car l'APK a mis en place des fortifications défensives à presque tous les coins de la ville, avec des barricades et des armes antichar disséminées dans tout Séoul. Néanmoins, les forces de la coalition ont réussi à percer toutes les résistances que l'APK leur a opposées et ont finalement repris Séoul au profit de la Corée du Sud. Cette victoire enverra un message clair à Pyongyang : la lutte pour la péninsule coréenne atteindra bientôt ses côtes et ses terres seront entachées de sang et de désespoir."
 
 conquest.102.d: "Le vent a changé dans la péninsule coréenne, car l'intervention de la République populaire de Chine a provoqué une nouvelle fois la chute de Séoul, la reprenant aux forces de la coalition de l'ONU. La coalition, surprise et épuisée par la bataille, a subi une évacuation obligatoire de la zone métropolitaine de Séoul vers d'autres villes du Sud, mais est démoralisée et incapable de combattre pour le moment. Cette défaite jouera un rôle crucial dans le sort de la péninsule coréenne et, jusqu'à présent, les observateurs estiment que la coalition entre la Chine et la Corée du Nord gagnera très probablement. Cependant, ces mêmes observateurs ont des doutes sur leurs prévisions, car de nombreux rapports indiquent que les forces chinoises sont épuisées et dépassées par la guerre et qu'il leur faudra du temps et des efforts pour retrouver leurs forces, ce qui pourrait ouvrir la voie à une contre-attaque des forces de la coalition de l'ONU."
 
 conquest.103.d: "À la lumière d'une défaite après l'autre, les forces de la coalition de l'ONU ont conçu une opération qui brisera à la fois les forces chinoises et nord-coréennes. L'opération s'appelle « Opération Ripper », un bombardement d'artillerie dans toute la zone métropolitaine de Séoul suivi d'un siège de la zone. Le bombardement d'artillerie est conçu pour infliger un maximum de dégâts à la coalition sino-nord-coréenne, tout en minimisant les pertes au sein de la coalition de l'ONU. Selon nos sources sur le terrain, il s'agit d'un grand succès, avec des pertes par dizaines de milliers pour les Chinois et les Nord-Coréens, avec la moitié de la zone métropolitaine de Séoul sous contrôle de l'ONU. Les observateurs estiment que, puisque la guerre fait des ravages depuis si longtemps, l'ONU fera pression pour un accord d'armistice afin de mettre fin une fois pour toutes aux conflits dans la péninsule."
 
 conquest.104.d: "La capitulation de la République de Corée arrive plus tôt que prévu, car la Corée du Nord a réussi à briser le périmètre de Pusan, la seule ligne de défense de la Corée du Sud et sa seule grande ville restante, le reste étant occupé par la Corée du Nord. Au moment d'écrire ces lignes, le reste des forces de la coalition de l'ONU sont en train d'évacuer vers l'île de Jeju, la seule île qui n'a pas été touchée par les forces nord-coréennes. Cependant, voyant cela, la Corée du Nord a lancé des efforts pour placer une artillerie à longue portée capable de cibler l'île de Jeju, de sorte que les observateurs s'attendent à des pertes massives pour les habitants de l'île. Avec la disparition de Pusan, on s'attend à ce que la Corée du Nord revendique l'intégralité de la péninsule et que la Corée du Sud soit simplement réduite à un gouvernement en exil semblable aux gouvernements des nations occupées par les nazis pendant la Seconde Guerre mondiale."
 
 
 conquest.106.t: "[GetNewspaperHeader]Les forces de la coalition approchent de la rivière Yalu !"
 conquest.106.d: "Alors que les forces de la coalition se préparent à commencer l'occupation de la République populaire démocratique de Corée, des rapports provenant de tout le Yalu suggèrent un renforcement militaire massif en Mandchourie. Lors d'une réunion de l'ONU plus tôt dans l'année, le Parti communiste chinois a averti que « la Corée est un voisin direct des paysans et des travailleurs chinois en Mandchourie. Ils ne peuvent que s'inquiéter de la solution de la question coréenne. Le général MacArthur, lors d'une récente réunion avec le président [USA.GetLeader] à Wake Island, a minimisé le risque d'une éventuelle intervention de l'Armée populaire de libération, suggérant que « si les communistes chinois tentaient de descendre à Pyongyang, il y aurait le plus grand massacre ». Quoi qu'il en soit, les tensions restent vives face à la perspective d'une escalade."
 conquest.106.1.a: "Ils n'oseraient pas..."
 conquest.106.1.b: "Il est temps de voir ce que Mao fera..."
 conquest.106.1.c: "Notre destin est désormais entre les mains de Mao..."
 conquest.106.1.d: "L'agression américaine ne restera pas sans réponse !"

 coronation.1000.d: "Sa Majesté George VI, roi du Royaume-Uni et des dominions britanniques et dernier empereur de l'Inde, a été retrouvé mort ce matin dans son lit à Sandringham House à Norfolk, après près de deux ans de santé déclinante. Bien qu'il soit le deuxième après son frère aîné Édouard VIII, il se retrouve roi de l'Empire britannique au bord de ce qui deviendra bientôt la Seconde Guerre mondiale. Tout au long de la guerre, la présence du roi George a remonté le moral des sujets de la couronne, tant au pays qu'au front. Sa fille Elizabeth est devenue reine Elizabeth II et revient en toute hâte de l'étranger pour les funérailles."
 #stop putting shit in air disasters
 NNE.1.d: "Dans une affaire historique, Loving v Virginia a annulé toutes les lois contre le mariage interracial. L'affaire a été portée devant les tribunaux par Mildred Loving et Richard Loving, un couple interracial condamné à la prison en Virginie pour s'être mariés. Le procès a duré plusieurs jours mais il a finalement été décidé à l'unanimité que l'interdiction était inconstitutionnelle. En plus de l'adoption de la loi, l'affaire Pace contre Alabama a été annulée. Pace contre Alabama a statué que les lois anti-mariage interracial étaient constitutionnelles.\nLes réactions sont mitigées à travers le pays, mais le sentiment majoritaire est très positif en faveur de la décision. Les groupes de défense des droits civiques célèbrent actuellement cette journée et déclarent que le « Jour de l'amour » est officiellement une fête historique pour les droits civiques."
 NNE.2.d: "Dans une affaire historique, Roe contre Wade a officiellement déclaré que la restriction de l'accès à l'avortement était inconstitutionnelle, faisant des États-Unis l'un des moins de cinq pays au monde à pratiquer l'avortement à la demande. Le tribunal a statué à sept voix contre deux que la clause de procédure régulière protège le droit des femmes à l'avortement. Les restrictions étatiques et fédérales sur l'avortement ont été annulées. Roe contre Wade a déclenché des débats nationaux sur la question de savoir si l'avortement devrait être légal et dans quelle mesure.\nLe pays semble fortement divisé sur la question et des mouvements populaires se sont activés des deux côtés. Le camp pro-avortement, qui se dit « pro-choix », défend cette décision en affirmant qu'il s'agit d'un choix de femme et d'un droit crucial de la femme. Le camp anti-avortement, qui se dit « pro-vie », s'oppose à cette décision, affirmant qu'elle ôte la vie à un enfant et qu'elle est immorale.\nIndépendamment de l'opinion de chacun, cette décision façonnera la politique américaine pour les années à venir."
 NNE.3.d: "Le DDR a annoncé qu'il construirait le Palais de la République. Le palais sera construit à Berlin-Est pour accueillir le parlement de la République démocratique allemande. Il est prévu que le palais soit construit sur le site de l'ancien Berliner Stadtschloss, sur la place. Le Palais de la République servira de témoignage à la fois culturel et politique de la République démocratique allemande.\nLe Berliner Stadtschloss a été détruit pendant la Seconde Guerre mondiale et n'a jamais été réparé ni remplacé. Le manque de financement et l'impasse bureaucratique résultant de changements politiques massifs ont empêché sa reconstruction."
 NNE.4.d: "Dans une affaire historique, Carey contre Population Services International a officiellement statué qu'il était inconstitutionnel d'interdire à toute personne autre qu'un pharmacien agréé de distribuer des contraceptifs en vente libre à des personnes âgées de 16 ans ou plus. De plus, Carey contre Population Services International a également statué que quiconque ne pouvait refuser des contraceptifs aux personnes de moins de 16 ans. La Cour a jugé que la clause de procédure régulière du 14e amendement ne permet pas à un État de s'immiscer dans les décisions d'un individu en matière de procréation. L'intimé principal, PSI, est une société à but non lucratif qui fournit des connaissances sur le contrôle des naissances et fournit des services de contrôle des naissances. Les intimés secondaires sont le révérend James Haden qui a dirigé un programme de distribution de contraceptifs sans ordonnance, des médecins spécialisés dans le contrôle des naissances et un résident de New York qui souhaite distribuer des contraceptifs à ses enfants."
 NNE.5.d: "Dans une affaire historique, Planned Parenthood contre Casey a officiellement statué que les États pouvaient adopter des lois réglementant l'avortement au-delà du troisième trimestre. Dans l'affaire Casey, les plaignants ont contesté cinq des dispositions de la Pennsylvania Abortion Control Act de 1982 :\nConsentement éclairé ; le médecin doit fournir des informations spécifiques 24 heures avant l'intervention, notamment sur la santé et la viabilité\nAvis au conjoint ; une femme qui cherche à avorter doit en informer le père\nConsentement parental ; les mineurs doivent avoir le consentement des parents\nUrgence médicale ; dans lequel l'interruption de grossesse est immédiatement nécessaire pour éviter le décès de la mère\nExigences de déclaration ; Certains mandats de déclaration et de tenue de dossiers sur les établissements pratiquant des avortements"
 NNE.6.d: "Dans une affaire historique, l'affaire Abington School District contre Schempp a officiellement statué que la lecture de la Bible parrainée par l'école dans les écoles publiques était inconstitutionnelle. Le district scolaire a fait valoir que la Bible faisait partie de son programme scolaire et Schempp a soutenu qu'elle violait la laïcité et la liberté de religion. Après une longue audience et une escalade progressive, l'affaire a atteint la Cour suprême. La loi de Pennsylvanie obligeant les districts scolaires à effectuer des lectures bibliques a été annulée dans le processus. La question divise de nombreuses personnes différentes qui apportent des arguments en faveur et en opposition à la décision."
 NNE.7.d: "La principale compagnie aérienne de la RDA, Deutsch Lufthansa, a été officiellement licenciée pour non-respect de ses quotas de bénéfices. Les commentateurs affirment cependant que cela était dû à un procès imminent contre la compagnie aérienne DDR pour utilisation du nom Lufthansa. Tous les actifs de Deutsch Lufthansa ont été cédés à une autre compagnie aérienne de la DDR, Interflug."
 NNE.8.d: "La démolition du château de Berlin a été annoncée aujourd'hui par la République démocratique allemande. Le palais a été déclaré symbole du militarisme prussien et sera en conséquence détruit. La démolition se déroulera rapidement et débutera d'ici quelques semaines. Walter Ulbricht, secrétaire général du Comité central, déclare que le symbolisme culturel et le testament du palais constituent un affront aux travailleurs de la République populaire et au socialisme dans son ensemble.\nIl y a des objections émanant de personnes à l'intérieur et à l'extérieur de la RDA qui croient que le Palais est un monument culturel et historique qui signifie bien plus, voire pas du tout, que le militarisme.\nOn estime que le processus prendra 3 à 5 mois et nécessitera 19 tonnes de dynamite."
 NNE.9.d: "\nLhamo Dhondrub, désormais connu sous le nom de Tenzin Gyatso, a été proclamé 14e Dalaï Lama. Officiellement déclaré Dalaï Lama en 1940, Tenzin Gyatso a officiellement pris ses fonctions à l'âge de 15 ans.\nÀ la fin des années 1930, Reting Rinpoché a eu une vision qui l'a conduit à la maison de l'incarnation du Dalaï Lama, Lhamo Dhondup. Sera Lama a rapporté que Lhamo Dhondup tenait un vieux chapelet appartenant au 13e Dalaï Lama et que le garçon a immédiatement reconnu Sera Lama. Lhamo Dhondup a également fait référence à Sera Lama dans le dialecte du 13e Dalaï Lama que sa mère biologique ne pouvait pas reconnaître. On lui a présenté une série de biens, dont certains appartenaient au Dalaï Lama et d'autres non.\nCette prise de fonction aura des implications majeures pour les bouddhistes du monde entier et pour la région politique en général. Les décisions et les enseignements du 14e Dalaï Lama façonneront le paysage politique des années à venir."
 NNE.10.d: "Alger Hiss, un responsable du gouvernement américain, a été accusé d'être un espion soviétique et est en cours de condamnation. Les preuves contre Alger Hiss incluent une affirmation de Whittaker Chambers, un ancien membre du Parti communiste américain, selon laquelle Alger Hiss était un communiste. Hiss a intenté une action en diffamation contre Chambers. Cependant, Chambers a également produit de nouvelles preuves selon lesquelles lui et Hiss étaient impliqués dans des activités d'espionnage. Le tribunal procédera à la lumière de ces preuves et inclura le parjure, car certaines preuves entrent en conflit avec les affirmations formulées précédemment par Alger Hiss. Le procès a suscité de nouvelles discussions sur l'étendue de l'espionnage soviétique aux États-Unis."
 NNE.11.d: "Un tragique accident d'avion à Sverdlosk a coûté la vie à 19 personnes et à toute l'équipe de hockey sur glace du VVS Moscou. L'avion, en route vers un match, s'est écrasé à cause du mauvais temps. Une forte tempête de neige associée à des vents violents a fait tomber l'avion en vrille, l'écrasant au sol. Seuls 2 membres de l'équipe ont survécu. Bobrov a dormi trop longtemps et Chouvalov a été blessé.\nÀ la mémoire des morts, un mémorial est érigé près de la fosse commune de Koltsovo. De nombreux supporters de l'équipe se réjouissent désormais de cette défaite.\nVasiliy Staline, le fils de Joseph Staline et patron de l'équipe, tente actuellement de recruter une nouvelle équipe et espère que tout le monde sera recruté dans la journée, à temps pour le grand match." 
 NNE.12.d: "\nLe sénateur Kefauver a commencé des auditions sur le crime organisé, un problème majeur selon les articles américains de 1949. Kefauver a déjà déclaré qu'il prévoyait d'interroger plus de cinq cents personnes sur le thème du crime organisé. Kefauver a déclaré publiquement qu'il pensait qu'une grande organisation sicilienne fondée sur des liens familiaux dirigeait une grande mafia à travers les États-Unis. Le Comité prévoit de diffuser ces auditions à l'échelle nationale dans tout le pays. Que la prédiction de Kefauver soit ou non exacte, cela contribuera grandement à comprendre et à détruire le problème du crime organisé aux États-Unis."
 NNE.13.d: "Un séisme massif d'une magnitude de 8,6 a frappé la région de l'Assam-Tibet. Plus de 1 526 personnes ont été tuées et 30 000 ont été blessées et d'importants dégâts matériels ont été signalés. Le tremblement de terre a été attribué à la convergence de 2 plaques continentales. Des études géologiques sur le terrain du monde entier sont envoyées sur le site du tremblement de terre pour l'étudier et l'aide humanitaire arrive dans le monde entier pour aider. Cependant, et ce qui est choquant, c'est que des centaines de « touristes sinistrés » arrivent pour constater les destructions mais n'ont pas l'intention d'apporter leur aide. Contrairement aux scientifiques qui évitent de emprunter des chemins qui entravent les efforts humanitaires, les véhicules touristiques en cas de catastrophe bloquent les infrastructures et provoquent des revers mineurs. Malgré cela, les efforts de secours progresseront théoriquement."
 NNE.14.d: "Le pape Pie XII a promulgué Humani Generis, la dernière encyclique papale. L'Encyclique cherche à répondre à de nombreuses opinions qui, selon le Pape, menacent de saper les fondements de la doctrine catholique. Il aborde le rôle de la théologie, les obstacles à la recherche de Dieu, les problèmes du pape avec la culture moderne, plusieurs développements théologiques impliquant l'Église catholique après la Seconde Guerre mondiale et le polygénisme. De plus, l'Encyclique adopte une position nuancée sur l'évolution et déclare que les sciences humaines ne sont pas en conflit avec les enseignements bibliques. La position sur l'évolution amène de nombreux théologiens à reconsidérer leurs positions et de nombreux individus religieux à abandonner la théorie de la Jeune Terre."
 NNE.15.d: "Le gouvernement fédéral américain mène une longue série de poursuites contre le Parti communiste des États-Unis. Le groupe a été accusé de violation de la loi Smith, une loi qui impose des sanctions aux personnes prônant le renversement violent du gouvernement. Les accusés répliquent en affirmant qu'ils souhaitent une transition pacifique et que quoi qu'il arrive, la liberté d'expression protège leurs opinions et leurs déclarations. Les déclarations du CPUSA ont déclenché un débat national sur la liberté d'expression qui a poussé les gens à travers le pays à plaider en faveur du droit du CPUSA, indépendamment de leurs affiliations personnelles ou de leurs sentiments à l'égard du communisme."
 NNE.16.d: "Après 4 mois et 19 tonnes de dynamite, le château de Berlin a été officiellement démoli malgré les protestations. Les fondations étaient si solides que l'ensemble du bâtiment restait intact même lorsqu'il tombait au sol. La seule partie qui n'a pas été démolie est un portail du balcon où Karl Liebknecht avait déclaré la RDA. La construction d'un nouveau bâtiment, le Conseil d'Etat, est prévue sur le site de l'ancien bâtiment. La planification et le financement sont déjà respectivement terminés et sécurisés. Le portail depuis le balcon sera inclus dans le nouveau bâtiment car il est considéré comme important pour la RDA et sa culture.\nLa majorité des artefacts à l'intérieur seront conservés dans des entrepôts, pour un soulagement mineur pour les personnes qui croient que le bâtiment est culturellement important."
 NNE.17.d: "\nJulius et Ethel Rodenberg sont aujourd'hui jugés pour espionnage. Les deux individus et leurs complices ont été reconnus coupables et disposent d'une large base de preuves contre eux. Des preuves ont été trouvées selon lesquelles ils ont fourni à l'URSS des informations top-secrètes sur les radars, les sonars et les moteurs de propulsion à réaction. De plus, des preuves ont été trouvées selon lesquelles ils transmettaient des données très secrètes sur les armes nucléaires à l'URSS, dont on sait qu'elle est désormais entre les mains de l'Union soviétique.\nLes conséquences de la transmission de données sur les armes nucléaires aux Soviétiques sont graves. Jusqu'à présent, le seul pays doté de l'arme nucléaire est les États-Unis. Cependant, avec la perte de ces données, l'Union soviétique sera en mesure de commencer à construire ses propres armes nucléaires et de constituer une menace pour les puissances occidentales.\nL'enquête visant à éliminer les autres espions impliqués est en cours et les installations de recherche nucléaire du pays sont verrouillées jusqu'à ce que l'opération soit terminée."
 NNE.18.d: "Dans une affaire historique, Dennis contre les États-Unis a statué que Dennis, le secrétaire général du CPUSA, ne bénéficiait pas de la protection en vertu du 1er amendement si l'exercice impliquait la création d'un complot visant à renverser le gouvernement. Le procès a déclaré Dennis coupable de complot visant à renverser le gouvernement et doit être puni en vertu de la loi Smith. Dennis avait précédemment affirmé qu'il n'y avait pas de complot et qu'il préconisait une transition pacifique vers le socialisme. Dix autres membres du CPUSA ont également été reconnus coupables d'avoir prôné le renversement violent du gouvernement. Le procès a atteint la Cour suprême et il a été statué à six voix contre deux en faveur de la punition de Dennis et des autres conspirateurs. Les membres conspirateurs du CPUSA ont été condamnés à 5 ans de prison et à une amende de 10 000 $ chacun."
 NNE.19.d: "Les inondations qui ont frappé le littoral de la mer du Nord cet hiver ont eu des conséquences dévastatrices pour les populations des Pays-Bas, de Grande-Bretagne et de Belgique. Les digues se sont révélées incapables de retenir les marées montantes, inondant les côtes avec une fureur sans précédent. Les Pays-Bas ont été les plus durement touchés, subissant des dégâts quasi catastrophiques puisque plus de 9 % des terres arables ont été détruites et environ 1 800 vies ont été perdues. La province de Zélande reste dans un état de désarroi, car les graves dégâts causés par les inondations rendent les efforts de transport et de sauvetage ardus jusqu'à ce que les niveaux d'eau baissent. Les dégâts dans le sud de l'Angleterre et en Écosse ont également été importants, avec environ 300 morts à cause des inondations. La Belgique a également subi des dégâts sur ses côtes, mais à une échelle bien moindre que celle de ses voisins."
 NNE.20.d: "Les Giants de New York ont remporté la Ligue Nationale !\nBobby Thomson, le voltigeur et joueur de troisième but des Giants a frappé un home run pour l'équipe face au lanceur des Brooklyn Dodgers, Ralph Branca. Dans la dernière manche, Thomson a réussi un circuit de trois points remportant le match contre les Dodgers.\nIl s'agit d'un moment historique pour le pays puisque le match est le premier télévisé à l'échelle nationale et est vu par des millions de téléspectateurs et des millions d'autres l'entendent à la radio. La frappe gagnante est officiellement déclarée « coup entendu partout dans le monde », après le coup de feu qui a déclenché la guerre d'indépendance en 1776, parce qu'elle est diffusée à un si grand nombre d'Américains, y compris aux militaires d'outre-mer."
 NNE.22.d: "Une série d'articles de magazine intitulée \"L'homme va bientôt conquérir l'espace\" a été publiée dans Collier's Magazine. Les articles détaillent les projets de Wernher von Braun en matière de vols spatiaux habités. Les articles ont suscité un intérêt national massif pour les voyages spatiaux et l'optimisme futuriste. Les articles présentent des dessins détaillés, des peintures et des illustrations créés par l'équipe de conception du magazine et stupéfient les lecteurs avec leurs imaginations vives de la vie dans l'espace. Le pays discute déjà des implications des voyages spatiaux et de la colonisation et de ce que le monde peut faire s'il poursuit ces technologies."
 NNE.23.d: "Une grève massive a été organisée par les Métallurgistes unis d'Amérique contre 10 principaux producteurs d'acier aux États-Unis, mais elle a été stoppée lorsque le président Harry S. Truman a nationalisé l'industrie sidérurgique américaine avant le débrayage et a accordé une augmentation de salaire aux travailleurs. Les entreprises sidérurgiques qui ont perdu le contrôle de leurs installations poursuivent désormais le gouvernement en justice pour récupérer leurs propriétés. Si le président gagne le procès, même si cela est peu probable, cela pourrait avoir de sérieuses implications quant à l'autorité du gouvernement en matière de nationalisation de l'industrie.\nLe sénateur Joseph McCarthy dénonce officiellement le président pour avoir permis à des communistes connus de conserver leur emploi."
 NNE.24.d: "Dans une décision historique, Youngstown Sheet & Tube Co contre Sawyer a statué que le président n'a pas le pouvoir de nationaliser les industries et que les installations sidérurgiques doivent être restituées à leurs propriétaires privés. La Cour suprême a déclaré que sans l'autorité qui lui est conférée par le Congrès, le président n'est pas autorisé à prendre le contrôle du gouvernement sur la propriété privée. Le tribunal a voté par six voix contre trois en faveur de Youngstown Sheet & tube Co. Les installations ont été immédiatement remises à leurs anciens propriétaires privés, mais aucun dédommagement n'a été payé pour la perte de bénéfices pendant la période où les installations étaient sous le contrôle du gouvernement."
 NNE.26.d: " Dans le sud de la vallée de San Joaquin, un séisme de magnitude 7,3 a causé 2,6 millions de dollars de dégâts et au moins 11 morts dans la ville de Tehachapi. Deux tunnels ferroviaires se sont effondrés et la ville de Bakersfield a également été touchée. Les pipelines ont également été endommagés par les répliques de l'événement. La culture du coton à proximité du tremblement de terre a également été compensée. Beno Gutenberg, directeur du Caltech Seismological Lab, a été surpris par le choc. Il a déclaré : « Il ne fait aucun doute que le séisme d'hier est le plus important que le sud de la Californie ait connu au cours de ce siècle. » La Croix-Rouge américaine a qualifié le tremblement de terre de catastrophe majeure, affectant environ 700 familles, mais l'accès à la zone a été entravé par des glissements de terrain."
 NNE.27.d: "La République de Chine à Taiwan et le Japon ont finalement déclaré la paix. Le retard dans les négociations de paix était dû au fait qu'aucun des gouvernements chinois n'avait participé au Traité de San Francisco en raison de la guerre civile chinoise. Les États-Unis auraient exercé une pression importante sur le Japon pour lui faire signer une conférence de paix. Le texte du traité est similaire à celui de Francisco, mais il a été modifié pour s'adapter à la République de Chine. Le traité ne mentionne pas qui devrait être le véritable propriétaire de Taiwan et traite principalement des revendications et des ressortissants japonais."
 NNE.28.d: "Treize Juifs ont été exécutés dans la prison Loubianka, à Moscou. Après avoir été arrêtés depuis juin 1949, tous les accusés ont été accusés de porter atteinte à l'Union soviétique. Leur procès est un indicateur du retournement de Staline contre le Comité juif antifasciste qui avait aidé la culture juive à se reconstruire après l'Holocauste. Cinq écrivains yiddish ont également été tués parmi les treize. L'une des victimes, Solomon Bregman, a perdu connaissance lorsque la condamnation à mort a été prononcée et ne s'est pas encore réveillée. Lina Stern, également condamnée, n'a pas été exécutée en raison de ses travaux scientifiques. Chose plus inhabituelle, il n'y avait ni procureurs ni avocats de la défense, simplement trois juges militaires qui posaient des questions au hasard."
 NNE.29.d: "Jonas Solk, un chercheur médical américain, a annoncé sur CBS qu'il avait créé un vaccin contre la poliomyélite, une maladie débilitante. Solk a adopté l'approche de Maurice Brodie, qui consistait à tuer des souches de polio et à les injecter à une personne. Solk dit qu'il écrit un article pour l'American Medical Association qui sera publié prochainement. Il s'agit d'une avancée majeure dans le traitement de la poliomyélite, car elle est désormais moins sensible chez les jeunes qui en sont particulièrement touchés."
 NNE.30.d: "Dag Hammarskjold a été nommé deuxième secrétaire général des Nations Unies en tant que candidat plutôt impartial. Il n'a jamais été aligné sur un parti politique malgré ses services au sein du gouvernement suédois, en particulier dans son corps diplomatique. Il est nommé secrétaire général à l'unanimité et régnera pendant cinq ans jusqu'en 1958. "
 news.1000.t: "[GetNewspaperHeader]Fin du procès de Nuremberg"
 news.1000.d: "Le procès de Nuremberg sur la Seconde Guerre mondiale a finalement pris fin après 4 ans. 24 des dirigeants les plus importants de l'ancienne Allemagne nazie ont été jugés entre 1945 et 1949 pour leurs crimes allant de la simple invasion au génocide de masse. Entre autres choses, les 15 alliés les plus proches d'Hitler (qui étaient encore en vie) ont été condamnés à mort ou à la prison à vie. Les dix plus hauts dirigeants politiques et militaires de l'Allemagne nazie ont été exécutés par pendaison. Cependant, plusieurs autres responsables nazis se suicideraient en attendant leur procès. La seule exception est Speer, qui était le seul à manifester des remords. Sept responsables nazis seraient emprisonnés dans la prison de Spandau, surnommée les Sept de Spandau, dont Albert Speer, Rudolf Hess, Karl Dönitz et d'autres condamnés à des peines de prison pour des montants variables. Le monde peut désormais guérir en sachant que les hommes qui ont causé la Seconde Guerre mondiale et les souffrances qui en ont résulté sont soit morts, soit emprisonnés, soit en attente de jugement."
 news.1000.a: "C'est fini maintenant."
 news.1002.t: "[GetNewspaperHeader]Fin du pont aérien de Berlin"
 news.1002.d: "L'URSS a soudainement bloqué tout trafic terrestre vers Berlin-Ouest en juin 1948 pour forcer les autres États d'occupation à répondre à ses exigences. En conséquence, Berlin-Ouest ne pouvait pas être approvisionné en vêtements, en fournitures médicales ou même en nourriture. Les pays de l'OTAN ont donc eu la brillante idée de ne pas pousser à une réponse agressive, mais de mettre en place un pont aérien. Ce n'est qu'après 15 mois et l'atterrissage de 277 264 avions que le blocus a finalement pris fin sans qu'aucun coup de feu ne soit tiré."
 news.1002.a: "Espérons que la paix dure !"
 news.1002.b: "Nous aurions pu faire mieux..."
 news.1003.t: "[GetNewspaperHeader]Une guerre de Corée éclate"
 news.1003.desc: "La Corée a été gouvernée par le Japon de 1910 jusqu'à la Seconde Guerre mondiale. Lorsque l'Union soviétique a déclaré la guerre au Japon en 1945, les troupes soviétiques se sont déplacées dans la partie nord de la Corée et les forces américaines ont libéré le sud. Les deux participants à la guerre ont conclu un accord et ont divisé la Corée en Corée du Nord et en Corée du Sud. Ils ont fini par former leur part pour ressembler à leur pays et ainsi le nord est devenu communiste et le sud est devenu capitaliste. Mais comme ils prétendaient tous deux être le gouvernement légitime de toute la Corée, le conflit s'est intensifié aujourd'hui avec l'entrée des troupes nord-coréennes en Corée du Sud."
 news.1003.a: "Devons-nous agir ?"
 news.1003.b: "Le communisme va gagner !"
 news.1003.c: "Cela ne finira pas bien."
 news.1003.d: "Ils n'ont aucune chance !"
 news.1003.e: "Nous avons besoin d'aide !"
 pinyin_tt: "Tous les noms de villes et d'États seront mis à jour pour utiliser le pinyin"
 news.10004.d: "Le gouvernement chinois a publié un document annonçant le système officiel de romanisation de la langue chinoise appelé pinyin. Le système pinyin est le résultat de la collaboration des meilleurs linguistes chinois sur cette question pour le compte du ministère de l'Éducation. Le gouvernement affirme que cela lui permettra de traduire plus facilement des documents étrangers et de rendre la langue chinoise plus accessible à l'étranger. Plus important encore, cela permettra à la Chine de diffuser plus efficacement ses idées et ses opinions à travers le monde. Les gouvernements chinois ont tenté de créer une romanisation du chinois depuis le début du XXe siècle et le gouvernement américain a créé son propre système appelé système Yale. Le pinyin est censé remplacer le système de Yale et le gouvernement chinois n'a pas tardé à déclarer le pinyin comme système officiel de romanisation de la langue chinoise."
 news.1005.t: "[GetNewspaperHeader]Fonder la nouvelle Chine"
 news.1005.d: "La République populaire de Chine a finalement gagné sa guerre civile contre la République de Chine. La deuxième phase de la guerre civile chinoise touche à sa fin. La République de Chine et la République populaire de Chine se battent depuis maintenant 3 ans. Même avant cela, ils combattaient depuis 1927 jusqu'en 1936, lorsque la Chine fut envahie par l'Empire japonais. Après la Seconde Guerre mondiale en 1946, les combats reprirent et restèrent dans l'impasse jusqu'en 1948. En 1948, les forces communistes chinoises traversèrent Pékin et pénétrèrent dans le centre de la Chine, provoquant l'encerclement de centaines de milliers de soldats chinois démocrates. Ce n'est qu'à la fin de 1949 que la République de Chine s'est enfuie vers Taiwan et d'autres régions d'Asie du Sud-Est. Le Premier ministre Mao a déclaré une nouvelle Chine, qui sera la seule Chine forte. Des centaines de milliers de personnes se sont rassemblées à Pékin pour assister au discours de Mao Zedong. La guerre en Chine s'est calmée pour l'instant."
 news.1005.a: "Que cela dure pour toujours !"
 news.1005.b: "Intéressant."
 news.1006.t: "[GetNewspaperHeader]La RPC crée des ministères des Affaires étrangères"
 news.1006.d: "La République populaire de Chine a établi des ministères des Affaires étrangères aux États-Unis et en Union soviétique après leur longue guerre de 4 ans et même avant celle avec la République de Chine. La République populaire de Chine prétend que son gouvernement est la seule vraie Chine, tandis que la République de Chine est le « Taipei occupé ». Pour l'instant, il semble que l'URSS ait reconnu le nouveau gouvernement chinois, tandis que les États-Unis reconnaissent toujours la République de Chine comme la Chine unique. "
 news.1006.a: "Sommes-nous les bienvenus ?"
 news.1006.b: "Bienvenue chez nous !"
 news.1006.c: "Intéressant."
 news.1007.t: "[GetNewspaperHeader]La RPC annonce un traité sino-soviétique"
 news.1007.d: "La République populaire de Chine a annoncé un traité avec l'Union soviétique. Ce matin à Pékin, la République populaire de Chine a annoncé avoir signé un traité d'amitié avec l'Union soviétique. Il s'appelle « Traité sino-soviétique d'amitié, d'alliance et d'assistance mutuelle ». Le traité comprend le retrait soviétique de la Mandchourie et de Dalian, des solutions de transport et une « alliance » à court terme jusqu'en 1979. L'URSS et la RPC ont signalé à l'Occident qu'elles s'uniraient pour unir les peuples du monde sous le communisme !"
 news.1007.a: "Nous nous entraidons"
 news.1007.b: "Cela pourrait devenir dangereux"
 news.1007.c: "D'accord..."
 news.1008.t: "[GetNewspaperHeader]La RPC accepte le plan Marshall"
 news.1008.d: "La République populaire de Chine a annoncé qu'elle accepterait le plan Marshall proposé par les États-Unis d'Amérique. La RPC recevra désormais des outils et de l'argent pour reconstruire son pays après la Seconde Guerre mondiale et sa guerre civile. C'est un choc, car beaucoup pensaient que la RPC accepterait le plan Molotov de l'URSS. Cela a envoyé un message fort à l'URSS : ce n'est pas parce que la RPC est communiste qu'elle deviendra un autre État fantoche pour elle. Les États-Unis souhaitent conclure des accords avec la RPC et pourraient bouleverser l'ensemble de l'Asie de l'Est."
 news.1008.a: "On s'entraide"
 news.1008.b: "Cela pourrait devenir dangereux"
 news.1008.c: "D'accord..."
 news.1009.t: "[GetNewspaperHeader]La République de Chine en Taïwan"
 news.1009.d: "La deuxième phase de la guerre civile chinoise touche à sa fin. La République de Chine et la République populaire de Chine se battent depuis maintenant 3 ans. Même avant cela, ils combattaient depuis 1927 jusqu'en 1936, lorsque la Chine fut envahie par l'Empire japonais. Après la Seconde Guerre mondiale, les combats reprirent et restèrent dans une impasse jusqu'en 1948. En 1948, les forces communistes chinoises traversèrent Pékin et pénétrèrent dans le centre de la Chine, provoquant l'encerclement de centaines de milliers de soldats chinois démocrates. Cette année cependant, des pourparlers de paix ont eu lieu avec la mission Marshall sur un éventuel armistice avec division de la Chine ou sur un plan de paix. Ce plan échoua et les combats se poursuivirent avec l'offensive du Yangtsé dans le sud de la Chine. Après plusieurs déroutes de la République de Chine, le gouvernement républicain s'est enfui vers l'île de Taiwan. Chiang Kai-Shek a déclaré que la République de Chine perdurait et qu'un jour, le drapeau de la République de Chine flotterait à nouveau sur la Chine continentale. Des centaines de milliers de soldats et de réfugiés fuient vers le Tibet, la Birmanie, la Thaïlande et Taiwan."
 news.1009.a: "Le continent est à nous désormais."
 news.1009.b: "Les Dominos sont tombés."
 news.1009.c: "Nous reviendrons."
 news.1009.e: "Ils sont encore en vie ? (Incarnez l'armée Phu-Dai)"
 news.1009.f: "De retour au Vietnam... (Incarnez l'armée Phu-Dai)"
 news.1009.g: "Ils sont encore en vie ? (Incarnez YANSA)"
 news.1009.h: "De retour en Birmanie... (Incarnez YASA)"
 news.1010.t: "La RPC déclare la politique d'une seule Chine"
 news.1010.d: "La République populaire de Chine vient de déclarer sa politique d'une seule Chine. Dans le cadre de cette politique, les deux gouvernements (RPC et ROC) conviennent qu'il ne peut y avoir qu'un seul État souverain gouvernant la Chine continentale. Mais ils ne sont pas d'accord sur la question de savoir quel État est le gouvernement légitime de cet État. Tout autre État souhaitant établir des relations diplomatiques avec la République populaire doit rompre ses relations avec la République et vice versa."
 news.1010.a: "Nous sommes le gouvernement légitime !"
 news.1010.b: "Avec qui allons-nous aller ?"
 news.1011.t: "[GetNewspaperHeader]La RPC se rapproche de l'URSS"
 news.1011.d: "Au cours de leur mission à Moscou, la République populaire de Chine a approché l'URSS et a discuté de l'avenir de leurs pays."
 news.1011.a: "L'avenir s'annonce prometteur."
 news.1011.b: "Intéressant."
 news.1012.t: "[GetNewspaperHeader][From.GetName] rejoint le Pacte de Varsovie"
 news.1012.d: "[From.GetName] a officiellement rejoint le Pacte de Varsovie. Ils sont désormais unis et ont élargi davantage le rideau de fer."
 news.1012.a: "Super!"
 news.1012.b: "Intéressant."
 news.1012.c: "Pas. Bien."
 news.1013.t: "[GetNewspaperHeader]La RPC crée sa propre faction"
 news.1013.d: "La République populaire de Chine a fondé sa propre faction. Il est appelé « l'Empire populaire uni d'Asie ». Envisagent-ils d'étendre cet Empire ?"
 news.1013.a: "Notre Empire grandira !"
 news.1013.b: "Intéressant."
 news.1016.t: "[GetNewspaperHeader]La RPC acceptée à l'ONU"
 news.1016.d: "La République populaire de Chine a été acceptée aux Nations Unies puisque les quatre principaux membres, la France, la Grande-Bretagne, les États-Unis et l'Union soviétique, ont voté pour. Le seul parti qui a dit non était la République de Chine. Ils ont perdu la guerre civile, mais ils ne veulent apparemment pas reconnaître leur défaite."
 news.1016.a: "Ensemble, nous sommes plus forts."
 news.1016.b: "Un nouveau membre à nos côtés !"
 news.1016.c: "Ils seront les bienvenus."
 news.1016.e: "Ennemis pour toujours !"
 news.1017.t: "[GetNewspaperHeader]La RPC n'est pas acceptée à l'ONU"
 news.1017.d: "La République populaire de Chine n'a pas été acceptée aux Nations Unies car un ou plusieurs des quatre membres majeurs, la France, la Grande-Bretagne, les États-Unis et l'Union soviétique ont voté non, tout comme la République de Chine. Ils aiment le fait que la RPC n'a pas été acceptée."
 news.1017.a: "Nous avons fait de notre mieux."
 news.1017.b: "Restez dehors !"
 news.1017.c: "Intéressant."
 news.1017.e: "Ennemis pour toujours !"
 news.1018.t: "[GetNewspaperHeader]L'unification de Trieste"
 news.1018.d: "Aujourd'hui, le Mémorandum de Londres a été signé à Londres par la Grande-Bretagne, les États-Unis, l'Italie et la Yougoslavie sur l'unification du Territoire libre de Trieste. L'Italie et la Yougoslavie étaient d'accord sur les exigences du traité. L'Italie obtiendra la zone A, qui comprend la ville de Trieste, et la Yougoslavie, la zone B, qui correspond à la campagne périphérique de Trieste. Ce sera un grand jour pour une unification pacifique."
 news.1018.a: "Nous avons eu notre part."
 news.1018.b: "Nous pourrions avoir les deux parties."
 news.1018.c: "Intéressant."
 news.1019.t: "[GetNewspaperHeader]Pas d'unification de Trieste"
 news.1019.d: "Après des négociations à Londres, la Yougoslavie a décidé de renoncer à signer le Mémorandum de Londres, le traité étant trop favorable à l'Italie. Ils accusent les États-Unis et le Royaume-Uni de se ranger du côté de l'Italie parce qu'ils suivent les idéaux capitalistes et veulent empêcher une ville de tomber sous le rideau de fer. La Yougoslavie ne signera pas le traité et les tensions sont à leur plus haut niveau en Méditerranée."
 news.1019.a: "Pourquoi?"
 news.1019.b: "Nous voulons les deux parties !"
 news.1019.c: "Inquiétant..."
 news.1020.t: "[GetNewspaperHeader]L'unification de Trieste"
 news.1020.d: "Après de nouvelles négociations à Londres, la Yougoslavie a décidé de faire marche arrière et de signer le Mémorandum de Londres pour ne pas risquer une guerre. Ils pensent encore que le Traité est trop en faveur de l'Italie, mais le risque d'une guerre mondiale les a obligés à reculer. Les tensions en Méditerranée ont diminué."
 news.1020.a: "Heureusement que ça n'a pas dégénéré."
 news.1020.b: "Nous devions le faire."
 news.1020.c: "Heureusement que ça n'a pas dégénéré."
 news.1021.t: "[GetNewspaperHeader]La guerre de Trieste"
 news.1021.d: "Après des jours de tensions, les pourparlers ont complètement échoué entre la Yougoslavie et l'Italie. Les deux parties se sont menacées de reculer et de prendre une décision concernant Trieste, mais les deux parties prétendent toujours qu'elles possèdent Trieste. Hier soir, les troupes yougoslaves ont traversé la frontière italienne et les forces spéciales yougoslaves ont envahi Trieste et capturé la ville. L'Italie a déclaré qu'elle défendrait à nouveau son pays et libérerait la ville de Trieste. Une guerre a éclaté en Méditerranée et l'Est comme l'Ouest doivent s'y impliquer d'une manière ou d'une autre. Ce sont des temps sombres dans lesquels nous vivons."
 news.1021.a: "Il faut se battre maintenant !"
 news.1021.b: "Ça vaut le coup."
 news.1021.c: "Oh mon Dieu..."
 news.1022.t: "[GetNewspaperHeader]L'unification de Trieste"
 news.1022.d: "Après les négociations à Londres, l'Italie a décidé de revenir sur la signature du Mémorandum de Londres, car l'Italie n'obtient que la zone A de Trieste et non les deux zones. Ils ont déclaré dans un communiqué qu'ils disposaient de documents historiques prouvant qu'ils étaient propriétaires de la totalité de Trieste et non de la moitié. Cela a porté les tensions à un niveau sans précédent en Méditerranée et la Yougoslavie et l'Italie ne progressent pas sur la voie de leurs idéaux."
 news.1022.a: "Nous devions le faire."
 news.1022.b: "C'est une excellente nouvelle !."
 news.1022.c: "Heureusement que ça n'a pas dégénéré."
 news.1023.t: "[GetNewspaperHeader]L'Union franco-britannique"
 news.1023.d: "Une fois de plus, les Français et les Britanniques combattent côte à côte dans une nouvelle guerre. Une nouvelle task force anglo-française a été créée et envoyée en Égypte. Le Premier ministre français veut aller plus loin et propose une Union entre les 2 pays. Le ministre a déclaré dans un communiqué que le Royaume-Uni et la France doivent s'unir pour s'unir sous un seul État afin de combattre les ennemis de l'Occident. Le ministre propose que la France soit annexée à l'Empire britannique sous le nom d'Union franco-britannique. Les Britanniques décident alors de former l'Union franco-britannique. Il faudra un certain temps au gouvernement français pour s'intégrer à l'Empire britannique, mais la nouvelle Union des Britanniques et des Français a été formée."
 news.1023.a: "Nous sommes plus forts ensemble !"
 news.1023.b: "Intéressant."
 news.1024.t: "[GetNewspaperHeader]Tito est mort"
 news.1024.d: "Quatre rois, 31 présidents, six princes, 22 premiers ministres et 47 ministres des affaires étrangères se sont présentés à Belgrade pour pleurer la perte du maréchal Tito. Ils viennent des deux côtés pour rendre hommage à notre grand leader. Tito a été déclaré mort de Gangrène dans le service de chirurgie cardiovasculaire du centre médical universitaire de Ljubljana, trois jours seulement après son 88e anniversaire."
 news.1024.a: "Repose en paix Maréchal."
 news.1024.b: "C'était un grand leader."
 news.1025.t: "[GetNewspaperHeader]Fin de la guerre civile grecque"
 news.1025.d: "Après trois ans et six mois de combats, près de 50 000 morts et des milliers de disparus, la guerre civile grecque est terminée, le Royaume de Grèce battant le gouvernement démocratique provisoire dirigé par le Parti communiste grec. Grâce à l'aide américaine via le plan Marshall et la doctrine Truman, les forces royalistes ont pris le dessus sur les forces communistes, soutenues par l'Union soviétique et divers autres États socialistes du bloc de l'Est. La guerre civile a laissé la Grèce en ruines et son économie est en difficulté. Il faut désormais reconstruire une Grèce meilleure et plus forte. Le gouvernement royaliste a déjà déclaré qu'il cherchait à poursuivre la coopération avec l'Occident et les experts suggèrent déjà que l'État grec victorieux demandera bientôt son adhésion à l'OTAN."
 news.1025.a: "Notre pays à nouveau en paix."
 news.1025.b: "Intéressant."
 news.1026.t: "[GetNewspaperHeader]Fin de l'urgence malaise"
 news.1026.d: "L'état d'urgence malais a commencé le 16 juin 1948. Après des mois et des mois de guérilla dans les jungles de Malaisie, l'état d'urgence a enfin pris fin. La campagne a été détruite et de nombreuses personnes sont toujours sans abri et blessées lors des combats. La Malaisie entame désormais le processus de reconstruction et s'efforce de rassembler la nation. Le Commonwealth a qualifié cela de victoire contre l'arrêt de la propagation du communisme à de plus en plus de régions du monde."
 news.1026.a: "Notre pays à nouveau en paix."
 news.1026.b: "Intéressant."
 news.1026.desc: "L'état d'urgence malais a commencé le 16 juin 1948. Après des mois et des mois de guérilla dans les jungles de Malaisie, l'état d'urgence a enfin pris fin. La campagne a été détruite et de nombreuses personnes sont toujours sans abri et blessées lors des combats. Mayala espère devenir un pays plus fort maintenant que le peuple s'est enfin soulevé. Le Commonwealth a qualifié cette défaite de décevante à Mayala et a déclaré qu'il ferait tout pour empêcher le communisme de se propager ailleurs."
 news.1027.t: "[GetNewspaperHeader]Fin de la deuxième urgence malaise"
 news.1027.d: "Une deuxième urgence mayalane a pris fin après que les rebelles communistes ont obtenu davantage de soutien et d'aide de la part d'autres pays communistes de la région. De nouveaux combats éclatèrent dans les campagnes et une guérilla commença. Après une longue période de combats, la rébellion a été réprimée. Les gouvernements de Malaisie et du Commonwealth ont une fois de plus déclaré qu'il s'agissait d'une victoire contre le communisme et que celui-ci ne se propagerait plus."
 news.1027.a: "Notre pays à nouveau en paix."
 news.1027.b: "Intéressant."
 news.1027.desc: "Une deuxième urgence mayalane a pris fin après que les rebelles communistes ont obtenu davantage de soutien et d'aide de la part d'autres pays communistes de la région. De nouveaux combats éclatèrent dans les campagnes et une guérilla commença. Après une longue période de combats, la rébellion populaire fut un succès. Le gouvernement démocratique de Malaisie est désormais en exil et les communistes ont pleinement pris le contrôle du pays. Le gouvernement malais a déclaré qu'il reviendrait une fois pour reprendre ses terres qui lui reviennent. Le gouvernement du Commonwealth a répondu que la campagne Hearts and Minds n'avait tout simplement pas eu autant de succès que la dernière fois. Y aura-t-il une autre guerre dans la région ?"
 news.1028.t: "[GetNewspaperHeader]L'Union soviétique effectue son premier essai nucléaire"
 news.1028.d: "Le 29 août à 7 heures du matin, l'Union soviétique a procédé à sa première arme nucléaire sur le site d'essais de Semipalatinsk, en RSS du Kazakhstan"
 news.1029.t: "[GetNewspaperHeader]Mort de Joseph Staline"
 news.1029.d: "Des nouvelles de dernière minute sont tombées en provenance d'Union Soviétique. Selon les termes de l'émission de radio : « Le Comité central du Parti communiste, le Conseil des ministres et le Présidium du Soviet suprême de l'URSS annoncent avec une profonde tristesse au parti et à tous les travailleurs que le 5 mars à 21 h 50 Joseph Vissarionovitch Staline, secrétaire du Comité central du Parti communiste et président du Conseil des ministres, est décédé des suites d'une grave maladie. Le coeur du collaborateur et adepte du génie de Lénine, du sage dirigeant et professeur du parti communiste et du peuple soviétique, a cessé de battre. En ces jours douloureux, tous les peuples de notre pays se rassemblent toujours plus étroitement au sein de la grande famille fraternelle sous la direction éprouvée du Parti communiste.\nAprès une autopsie, son corps a été embaumé pour être exposé au public, ses funérailles étant prévues quatre jours après sa mort."
 news.1029.a: "Cela va choquer les paysages politiques mondiaux"
 news.1030.t: "[GetNewspaperHeader]Khrouchtchev devient Premier ministre soviétique"
 news.1030.d: "Nikita Khrouchtchev vient de devenir le leader de l'Union soviétique. Le temps nous dira comment il aborde les problèmes auxquels l'Union est confrontée."
 news.1030.a: "Espérons une paix durable"
 news.1031.t: "[GetNewspaperHeader]L'Union soviétique teste la plus grosse bombe jamais réalisée"
 news.1031.c: "Faire une déclaration au Soviet suprême et féliciter personnellement toutes les personnes impliquées"
 news.1031.d: "Les Soviétiques prétendent avoir testé avec succès la plus grosse bombe nucléaire jamais réalisée. On l'appelle Tsar Bomba, le roi des bombes."
 news.1031.a: "Déposer une plainte officielle auprès des Soviétiques"
 news.1031.b: "La démonstration de puissance brute de l'Union soviétique ne passera pas inaperçue sur la scène mondiale"
 news.1511.t: "[GetNewspaperHeader]Discours de Khrouchtchev aux Nations Unies"
 news.1511.a: "Les relations entre les superpuissances ne peuvent pas être pires"
 news.1511.d: "Trois jours après avoir rencontré Fidel Castro pour la première fois, [SOV.GetLeader] se rendit aux Nations Unies le 23 septembre 1960. [SOV.GetLeader] croyait que le communisme était l'avenir et que l'Amérique devait être contenue. Dans son discours à l'Assemblée générale des Nations Unies, [SOV.GetLeader] a menacé d'« enterrer » l'Amérique"
 news.1512.t: "[GetNewspaperHeader]La Maison des Soviétiques"
 news.1512.a: "On dirait un robot enterré."
 news.1512.d: "Lors de la reconstruction de la ville de Königsberg -aujourd'hui Kaliningrad- l'ancien château de Königsberg, déjà partiellement détruit par les bombardements de la Grande Guerre Patriotique, a été démoli pour détruire toute trace du militarisme prussien. Le secrétaire régional du PCUS a décidé de le remplacer par un bâtiment appelé Maison des Soviets, qui servira de centre administratif de l'oblast de Kaliningrad. Sa construction va bientôt commencer et elle sera, espérons-le, terminée dans une dizaine d'années"
 
 ###################################################################################################################

 news.1501.t: "[GetNewspaperHeader]Les troupes soviétiques entrent en Finlande !"
 news.1501.d: "L'Union soviétique a envoyé ses troupes au-delà de la frontière finlandaise et a commencé à occuper les villes. L'Union soviétique a déclaré qu'elle faisait cela pour le peuple finlandais, pour sa propre sécurité et pour le protéger des dangers de l'Occident. Le gouvernement finlandais n'a pas réagi et on se demande s'il va attaquer les convois soviétiques. Il s'agit d'une démarche très dangereuse de la part des Soviétiques. Une Seconde Guerre d'Hiver pourrait-elle éclater ?"
 news.1501.a: "Une Seconde Guerre d'Hiver va-t-elle éclater ?"
 news.1501.b: "Nous devons prendre une décision à ce sujet !"
 news.1501.c: "Nous libérerons la Finlande de l'Occident, d'une manière ou d'une autre."
 news.1501.e: "Nous soutiendrons toujours l'indépendance finlandaise !"
 
 news.1502.t: "[GetNewspaperHeader]Troupes soviétiques autorisées en Finlande"
 news.1502.d: "Le gouvernement finlandais a accordé un accès militaire à l'Union soviétique. Les Soviétiques ont répondu en affirmant que la Finlande avait pris la bonne décision en évitant la guerre. Les Soviétiques ont déclaré que cela entraînerait une plus grande coopération entre la Finlande et l'URSS. Cependant, cela n'est pas passé inaperçu dans le monde et l'OTAN a répondu en affirmant que cela portait atteinte à l'indépendance de la Finlande. Pourrait-il y avoir un changement en Scandinavie ?"
 news.1502.a: "Cette crise des notes va-t-elle s'aggraver ?"
 news.1502.b: "Un grand allié a été créé."
 news.1502.c: "Cela met fin à la violation de l'indépendance finlandaise."

 news.1503.t: "[GetNewspaperHeader]Pour la défense de la Finlande"
 news.1503.d: "Le gouvernement finlandais est parvenu à une conclusion après une réunion rapide de quelques heures avec les troupes soviétiques traversant la frontière. Ils ont déclaré que la « protection » soviétique menaçait leur indépendance en tant que nation. L'armée finlandaise a décidé de défendre son pays jusqu'au dernier homme. Des combats ont déjà été signalés dans l'est de la Finlande. Une 2e guerre d'hiver a éclaté. Qui va gagner cette fois ?"
 news.1503.a: "Qui gagnera la 2ème Guerre d'Hiver ?"
 news.1503.b: "Nous soutiendrons l'indépendance finlandaise quand cela sera nécessaire."
 news.1503.c: "La Finlande sera bientôt sous notre contrôle. Nous réparerons ce que nous avons mal fait pendant la guerre d'hiver."
 news.1503.e: "Nous défendrons notre pays jusqu'au dernier homme !"
 
 news.1504.t: "[GetNewspaperHeader]la 2e guerre d'hiver éclate !"
 news.1504.d: "L'Union soviétique a lancé des attaques contre la Finlande. Des parachutistes soviétiques ont été vus se rendre dans les villes de Finlande. Des colonnes de chars et de soldats soviétiques auraient franchi les frontières finlandaises. L'armée finlandaise a ouvert le feu sur les Soviétiques et des rapports faisant état de combats ont éclaté. D'innombrables réfugiés finlandais ont été vus franchir les frontières suédoises et norvégiennes pour tenter de fuir les combats. L'OTAN n'a pas encore fait de déclaration, mais une seconde guerre d'hiver a éclaté entre la Finlande et l'URSS."
 news.1504.a: "Une autre guerre d'hiver ? Qui va gagner ?"
 news.1504.b: "Nous libérerons la Finlande du gouvernement oppressif !"
 news.1504.c: "Nous aiderons la Finlande dans la mesure du possible."
 news.1504.e: "Nous serons unis contre les Hordes Rouges !"
 
 news.1505.t: "[GetNewspaperHeader]Création de la République démocratique finlandaise !"
 news.1505.d: "La République de Finlande a décidé de se tourner vers une République démocratique finlandaise plus à gauche. Les Soviétiques y ont vu un moyen pour la révolution de se propager à nouveau en Europe. L'Occident a affirmé qu'il s'agissait de la perte d'un allié important dans la région de l'Europe du Nord. Des réfugiés ont été vus franchissant les frontières suédoises et norvégiennes pour tenter de fuir ce qu'ils appellent la « tyrannie communiste ». La capitale, Helsinki, a été remplie de célébrations du nouveau gouvernement communiste."
 news.1505.a: "Que va-t-il se passer maintenant ?"
 news.1505.b: "Nous accueillons nos nouveaux amis dans l'amitié !"
 news.1505.c: "Nous avons perdu un grand allié dans la région."
 news.1505.e: "Nous aiderons la Révolution !"
 
 news.1506.t: "[GetNewspaperHeader]La RSS de Finlande est formée !"
 news.1506.d: "La République de Finlande a décidé d'être admise dans le groupe très sélectif des Républiques socialistes soviétiques. Les Soviétiques y ont vu un moyen pour la révolution de se propager à nouveau en Europe. L'Occident a affirmé qu'il s'agissait de la perte d'un allié important dans la région de l'Europe du Nord. Des réfugiés ont été vus franchissant les frontières suédoises et norvégiennes pour tenter de quitter les « envahisseurs rouges ». La capitale, Helsinki, a été remplie de célébrations de la nouvelle RSS."
 news.1506.a: "Que va-t-il se passer maintenant ?"
 news.1506.b: "Nous accueillons nos nouveaux amis dans l'amitié !"
 news.1506.c: "Nous avons perdu un grand allié dans la région."
 news.1506.e: "Nous aiderons la Révolution !"
 
 news.1507.t: "[GetNewspaperHeader]Guerre civile en Finlande"
 news.1507.d: "Une guerre civile a éclaté en République de Finlande et en République démocratique finlandaise. Les communistes finlandais ont lancé plusieurs attaques contre les troupes démocrates finlandaises. Le gouvernement finlandais a déclaré qu'il réprimerait cette rébellion contre lui. Les Soviétiques ont déclaré qu'ils aideraient la République démocratique finlandaise. L'OTAN a déclaré que toute aide serait disponible pour la République finlandaise."
 news.1507.a: "Que va-t-il se passer maintenant ?"
 news.1507.b: "Nous aiderons nos révolutionnaires en Finlande !"
 news.1507.c: "Nous devons contenir le communisme !"
 news.1507.e: "Nous réprimerons cette rébellion !"
 
 news.1508.t: "[GetNewspaperHeader]La Finlande annexée à l'URSS"
 news.1508.d: "La République de Finlande a décidé de rejoindre l'URSS et d'y être annexée. Les Soviétiques ont déclaré que c'était un grand chemin vers l'amitié éternelle entre les peuples finlandais et soviétique. L'Occident a déclaré que cela avait rendu l'Europe du Nord encore plus importante en raison de la perte d'un allié dans la région. Des réfugiés ont été vus franchissant les frontières suédoises et norvégiennes pour tenter d'éviter les « Rouges et leur tyrannie ». La capitale Helsinki a été vue pleine de célébrations avec les Soviétiques."
 news.1508.a: "Que va-t-il se passer maintenant ?"
 news.1508.b: "Nous avons retrouvé un grand allié !"
 news.1508.c: "Nous avons perdu un grand allié dans la région."
 
 news.1509.t: "[GetNewspaperHeader]Fin de la crise des billets"
 news.1509.d: "La crise des billets a pris fin. Les deux parties se sont mises d'accord sur ce qui arriverait à la Finlande et à la région de l'Europe du Nord. Les gouvernements de l'OTAN et du Pacte de Varsovie ont déclaré qu'ils souhaitaient la paix et étaient heureux que la crise des notes soit terminée. Espérons que la paix revienne et qu'il n'y ait plus de crises."
 news.1509.a: "Que la paix soit dans notre vie."
 
 news.1510.t: "[GetNewspaperHeader]Le grand séisme chilien"
 news.1510.d: "Surnommé le « Grand séisme chilien », l'Institut géologique des États-Unis a documenté cette catastrophe comme le plus grand tremblement de terre jamais enregistré par l'humanité jusqu'à présent. Documenté le 22 mai 1960, le « grand séisme chilien » d'une magnitude de 9,5 a provoqué un tsunami s'étendant du Chili à l'Asie. Les conséquences du séisme ont laissé 2 000 000 de personnes sans abri et sans emploi. Le tsunami lui-même a balayé une grande partie du Chili, de la Nouvelle-Zélande, des Philippines, du Japon, du Pérou, de l'Équateur, de la Californie et de nombreux autres territoires insulaires qui sont encore aujourd'hui disputés par des puissances étrangères. L'Argentine et la Bolivie ont également été dévastées par le séisme dans les régions voisines touchant le Chili. Les dégâts causés par le tremblement de terre sont estimés entre 400 et 800 millions de dollars."

 mccarthy.1.d: "Le républicain du Wisconsin, Joseph R. McCarthy, a remporté les élections au Sénat en 1946, au cours d'une campagne marquée par l'anticommunisme Red-baiting. En partie en réponse aux victoires du Parti républicain, le président Harry S. Truman a tenté de démontrer sa propre inquiétude face à la menace du communisme, en mettant en place un programme de fidélité pour les employés fédéraux. Il a également demandé au ministère de la Justice de dresser une liste officielle de 78 organisations subversives. Alors que commençait l'année des élections de mi-mandat, l'ancien responsable du Département d'État, Alger Hiss, soupçonné d'espionnage, a été reconnu coupable de parjure. Dans un discours prononcé à Wheeling, en Virginie occidentale, McCarthy a lancé une attaque contre le programme de politique étrangère de Truman, déclarant que le Département d'État et son secrétaire, Dean Acheson, abritaient des communistes « traîtres ». Des copies préliminaires du discours distribuées au dossier de presse portaient le nombre de communistes que McCarthy prétendait avoir connu sous le nom de 205. Révisé plus tard, à la fois dans une lettre au président Truman et dans une transcription « officielle » du discours que McCarthy a soumise au Congressional Record dix jours plus tard, il utilise le numéro 57."
 
 MZB.2.d: "Pendant des années, le Mozambique a essayé par tous les moyens de se libérer de la domination coloniale portugaise. Aujourd'hui, ils sont entrés dans un violent conflit contre les Portugais, dont le FRELIMO est la principale force. Outre l'indépendance, l'objectif du FRELIMO est de provoquer des réformes sociales et d'éliminer une élite dirigeante."
 
 ire.1.d: "Le vol KLM 633 s'est écrasé immédiatement après son décollage de l'aéroport de Shannon alors qu'il était en route entre Amsterdam et New York. Le Super Constellation Triton s'est amerri sur un banc de boue dans la rivière Shannon et 28 personnes auraient été tuées dans l'accident."
 
 raj.1.t: "Conflit du Cachemire"
 raj.1.d: "Le conflit avec le Pakistan au sujet de l'État du Cachemire a considérablement accru les tensions entre nos deux pays. L'agressivité pakistanaise atteint de nouveaux sommets et s'ils ne sont pas stoppés rapidement, ils pourraient déclarer la guerre. Devons-nous lancer une attaque préventive et mettre un terme à cette affaire une fois pour toutes ?"
 raj.1.a: "Il faut frapper en premier !"
 raj.1.b: "Non, nous pouvons régler cela diplomatiquement."
 raj.2.t: "L'Inde déclare la guerre !"
 raj.2.d: "L'Inde nous a déclaré la guerre ! Ils citent le conflit du Cachemire comme casus belli. Ils ont lancé des frappes aériennes massives et foulent désormais notre sol sacré ! Devons-nous riposter aux traîtres ?"
 raj.2.a: "Contre-attaque !"
 raj.5.t: "Référendum pour Pondichéry"
 raj.5.d: "L'Inde et la France, à la suite de négociations, publièrent une déclaration commune le 13 octobre 1954 annonçant une procédure visant à décider du statut des colonies françaises. Cinq jours plus tard, le 18 octobre 1954, les élus de l'Assemblée représentative et les conseillers municipaux de Pondichéry et de Karaikkal participent à un référendum à Kizhur. Sur les 178 membres votants, une écrasante majorité de 170 membres était favorable à la fusion des territoires indiens français avec la République de l'Inde. Trois jours plus tard, un accord sur le transfert de facto des territoires français vers l'Inde était signé à New Delhi entre les deux pays."
 raj.5.a: "Super!"
 raj.6.t: "Référendum pour Pondichéry"
 raj.6.d.: "L'Inde et la France, à la suite de négociations, publièrent une déclaration commune le 13 octobre 1954 annonçant une procédure visant à décider du statut des colonies françaises. Cinq jours plus tard, le 18 octobre 1954, les élus de l'Assemblée représentative et les conseillers municipaux de Pondichéry et de Karaikkal participent à un référendum à Kizhur. Sur les 178 membres votants, une écrasante majorité de 170 membres était favorable à la fusion des territoires indiens français avec la République de l'Inde. Trois jours plus tard, un accord sur le transfert de facto des territoires français vers l'Inde était signé à New Delhi entre les deux pays."
 raj.6.a: "C'est dommage qu'ils n'aient pas voté pour nous."
 raj.7.t: "Exigez Goa"
 raj.7.d: "Depuis des années, nous essayons de reprendre pacifiquement Goa des mains de leurs oppresseurs impériaux, mais en vain. Goa fait partie de l'Inde depuis des milliers d'années et il est tout simplement absurde que le Portugal prétende qu'elle fait partie intégrante de son pays. Le Portugal s'accroche fermement à ses colonies en Afrique et dans le monde entier depuis des années après la Grande Guerre, et il semble qu'il n'ait aucune intention de les laisser partir. Il semble que nos tentatives pacifiques ont échoué et que nous devrons peut-être recourir à des moyens plus violents..."
 raj.7.a: "Goa est indienne ! Lancez l'opération Vijay !"
 raj.7.b: "Nous réglerons cela diplomatiquement, point final."
 raj.8.t: "Guerre avec l'Inde !"
 raj.8.d: "Premier ministre! L'Inde nous a sauvagement déclaré la guerre ! Ils prétendent que Goa est un territoire indien alors que nous savons qu'elle est portugaise ! Nous avons renforcé nos forces militaires à Goa portugaise, mais les Indiens sont largement plus nombreux que nous. Devons-nous envoyer des renforts ?"
 raj.8.a: "Oui! Envoyez des renforts maintenant !"
 pak.1.t: "Conflit du Cachemire"
 pak.1.d: "Le conflit avec l'Inde au sujet de l'État du Cachemire a considérablement accru les tensions entre nos pays. L'agressivité indienne atteint de nouveaux sommets et s'ils ne sont pas stoppés rapidement, ils pourraient déclarer la guerre. Devons-nous lancer une attaque préventive et mettre un terme à cette affaire une fois pour toutes ?"
 pak.1.a: "Il faut frapper en premier !"
 pak.1.b: "Non, nous pouvons régler cela diplomatiquement."
 pak.2.t: "Le Pakistan déclare la guerre !"
 pak.2.d: "Le Pakistan nous a déclaré la guerre ! Ils citent le conflit du Cachemire comme casus belli. Ils ont lancé des frappes aériennes massives et foulent désormais notre sol sacré ! Devons-nous riposter aux traîtres ?"
 pak.2.a: "Contre-attaque !"
 news.500.t: "[GetNewspaperHeader]Conflit du Cachemire"
 news.500.d: "L'Inde a déclaré la guerre au Pakistan ! Ils citent le conflit du Cachemire comme casus belli. Ils ont lancé des frappes aériennes massives et envahissent désormais le Pakistan oriental et occidental. Le sort du Cachemire reste incertain."
 news.500.a: "Espérons qu'ils auraient pu régler leurs différends pacifiquement..."
 news.501.t: "[GetNewspaperHeader]Conflit du Cachemire"
 news.501.d: "Le Pakistan a déclaré la guerre à l'Inde ! Ils citent le conflit du Cachemire comme casus belli. Ils ont lancé des frappes aériennes massives et envahissent désormais l'Inde. Le sort du Cachemire reste incertain."
 news.501.a: "Espérons qu'ils auraient pu régler leurs différends pacifiquement..."
 news.502.t: "[GetNewspaperHeader]Guerre pour Goa !"
 news.502.d: "L'Inde a déclaré la guerre au Portugal ! On dit que Goa fait légitimement partie de l'Inde et non du Portugal. L'Inde envahit actuellement l'Inde portugaise avec une force écrasante."
 news.502.a: "Un développement intéressant."
 swe.2.d: "Le 13 juin 1952, un avion naval suédois non armé, connu sous le nom de Tp 47 \"Catalinan\", fut abattu par un MiG-15 soviétique à l'extérieur de Gotland alors qu'il recherchait un autre avion suédois porté disparu dans la mer Baltique. Cela a conduit de nombreux Suédois à manifester devant l'ambassade soviétique en Suède. Quatre ans plus tard, Nikita Khrouchtchev a avoué au Premier ministre suédois Tage Erlander que les Soviétiques avaient abattu l'avion. Le gouvernement suédois a cependant décidé de garder ce secret et ce n'est qu'en 1991 que cette information a été rendue publique, après qu'un ancien colonel soviétique a admis publiquement qu'il avait ordonné que l'avion soit abattu. On pense que cela est dû au fait que les avions suédois ont violé à plusieurs reprises l'espace aérien soviétique et ont secrètement pris des photos de navires soviétiques qu'ils ont ensuite envoyées à l'OTAN."
 news.1513.t: "[GetNewspaperHeader]Mort de Jimi Hendrix"
 news.1513.d: "Le célèbre guitariste Jimi Hendrix est décédé à l'âge de 27 ans. La nature exacte du décès est encore vague et une enquête du coroner doit avoir lieu à Londres le 30 septembre. La police affirme cependant qu'il s'agit d'une overdose de drogue. On dit qu'il a pris neuf somnifères et qu'il est mort étouffé par des vomissements. Quelques jours avant sa mort, Hendrix était en mauvaise santé, en partie à cause de la fatigue causée par le surmenage, un manque chronique de sommeil et une maladie présumée liée à la grippe. Les insécurités concernant ses relations personnelles, ainsi que la désillusion à l'égard de l'industrie musicale, avaient également contribué à sa frustration. Bien que les détails de ses dernières heures et de sa mort soient contestés, Hendrix a passé une grande partie de sa dernière journée en vie avec Monika Dannemann. Dans la matinée, Dannemann a trouvé Hendrix inconscient dans son appartement de l'hôtel Samarkand. Elle a appelé une ambulance à 11 h 18 et Hendrix a été emmené à l'hôpital St Mary Abbot où une tentative a été faite pour le réanimer. Son décès a été constaté à 12h45."
 news.1513.a: "L'histoire de la vie est plus rapide qu'un clin d'oeil"
 news.1514.t: "[GetNewspaperHeader]Marilyn Monroe décède ; Les pilules blâmées"
 news.1514.d: "Marilyn Monroe, une beauté troublée qui n'a pas réussi à trouver le bonheur en tant que star la plus brillante d'Hollywood, a été retrouvée morte dans sa maison de Brentwood d'une apparente surdose de somnifères.\nMonroe souffrait de maladie mentale et de toxicomanie depuis plusieurs années avant sa mort, et elle n'avait pas terminé de film depuis 1961.\nMonroe a passé le dernier jour de sa vie chez elle à Brentwood. Vers 3 heures du matin, après avoir semblé insensible, son psychiatre est entré dans la pièce en brisant une fenêtre et a trouvé Monroe morte.\nSa mort a été officiellement considérée comme un suicide probable, sur la base de précédents de surdose et de tendance aux sautes d'humeur et aux idées suicidaires. Aucune preuve d'acte criminel n'a été trouvée et une surdose accidentelle a été exclue en raison de la grande quantité de barbituriques qu'elle avait ingérée.\nElle était un sex-symbol majeur et l'une des stars hollywoodiennes les plus populaires des années 1950 et au début des années 1960. Elle a été une actrice de premier plan pendant une décennie et ses films avaient rapporté 200 millions de dollars au moment de sa mort."
 news.1514.a: "Une autre victime pour Hollywood"
 saf_news.2.d: "Un discours historiquement significatif vient d'être prononcé par le Premier ministre britannique Harold Macmillan alors qu'il s'adressait au Parlement sud-africain au Cap lors de sa tournée dans les États africains du Commonwealth. Il était en tournée en Afrique depuis le 6 janvier, visitant le Ghana, le Nigeria et d'autres colonies britanniques en Afrique. Le discours indiquait clairement que le gouvernement britannique dirigé par les conservateurs n'avait pas l'intention de bloquer l'indépendance d'un grand nombre de ces territoires. Le discours de Macmillan au Cap a également clairement indiqué que Macmillan incluait l'Afrique du Sud dans ses commentaires et indiquait un changement dans la politique britannique concernant l'apartheid"
 news.1515.t: "[GetNewspaperHeader]Israël envahit le Sinaï"
 news.1515.d: "Plus tôt ce matin, des éléments avancés de l'armée israélienne ont pénétré dans le désert égyptien du Sinaï et se dirigent progressivement vers le canal de Suez récemment nationalisé. Les dirigeants israéliens affirment que la cause de la guerre est directement liée à la menace forte et répétée du Premier ministre égyptien Nasser de fermer le détroit de Tiran, et à la lumière de sa décision de s'emparer du canal, Israël n'a eu d'autre choix que de riposter en légitime défense. Jusqu'à présent, la communauté internationale est restée quelque peu silencieuse face à cette évolution inattendue, même si des rapports et des rumeurs indiquent que de hauts diplomates britanniques et français sont déjà en train d'élaborer une proposition de cessez-le-feu."
 news.1515.a: "Comment cela va-t-il se passer ?"
 news.1516.t: "[GetNewspaperHeader]Canal de Suez saisi"
 news.1516.d: "Alors que le soleil se levait sur l'Égypte ce matin, les forces d'élite de l'armée égyptienne se sont précipitées dans le canal de Suez et s'en sont rapidement emparées, tandis que [EGY.GetLeader] prononçait simultanément un discours triomphant à son peuple déclarant que le canal était légitimement égyptien et qu'il lui appartenait désormais à nouveau. Tandis que les masses partout dans le monde arabe envahissent les rues pour célébrer cette grande victoire sur les vieilles puissances impérialistes, les plus hauts diplomates et hommes politiques de toute l'Europe se démènent pour trouver une sorte de réaction et comprendre quel impact cela aura sur leurs pays respectifs. Reste à savoir combien de temps Nasser pourra conserver son nouveau territoire."
 news.1516.a: "Intéressant"
 news.1517.t: "[GetNewspaperHeader]Les troupes britanniques débarquent à Suez"
 news.1517.d: "Il semble que la réaction en chaîne provoquée par la nationalisation égyptienne du canal de Suez ne soit pas tout à fait terminée, puisqu'aujourd'hui la Grande-Bretagne et la France se sont jointes à Israël pour mener une action militaire contre le pays. Les unités aéroportées britanniques débarquèrent dans et autour de Port-Saïd et repoussèrent rapidement les quelques brigades égyptiennes présentes dans la ville, tandis que les Français rencontrés rencontrèrent un succès similaire à Port Faud. Cependant, ils n'ont pas réussi à maintenir le canal dégagé de tout blocage, car les forces égyptiennes ont coulé quelques gros pétroliers au milieu du passage avant que la coalition anglo-française ne puisse les arrêter. Ainsi, alors que les Britanniques ont remporté une grande victoire militaire, la pénurie de pétrole qui affectera toute l'Europe semble avoir une importance bien plus importante."
 news.1517.a: "Mieux vaut prendre de l'essence maintenant !"
 news.1518.t: "[GetNewspaperHeader]Résolutions 997 et 1001 de l'ONU"
 news.1518.d: "Lorsque les Britanniques et les Français ont envahi l'Égypte conjointement avec Israël, ils avaient espéré qu'au moins la communauté internationale resterait les bras croisés et laisserait la situation évoluer. Cependant, c'est le contraire qui s'est produit, puisque les États-Unis ont été à la tête d'un scandale international contre l'opération anglo-française-israélienne. Aujourd'hui, cet outrage a culminé avec l'adoption par les Nations Unies de deux résolutions exigeant la fin immédiate du conflit et la remise du canal à une force de maintien de la paix de l'ONU. Même si le Pacte tripartite semble avoir été un succès militaire, il est clair que la crise de Suez n'a été rien de moins qu'un désastre politique, avec de lourdes répercussions pour les trois pays."
 news.1518.a: "Au moins, cela n'a pas provoqué la Troisième Guerre mondiale"
 news.1519.t: "[GetNewspaperHeader]Victoire égyptienne"
 news.1519.d: "Au grand choc de la majeure partie de la communauté internationale, le [EGY.GetLeader] a proclamé aujourd'hui la victoire militaire sur le pacte tripartite entre la Grande-Bretagne, la France et Israël. Bien que les premiers stades du conflit pour le Sinaï et le canal de Suez aient montré que l'Égypte était en retraite, son armée a néanmoins réussi à se rétablir et à repousser Israël hors du Sinaï, mettant ainsi fin à toute chance de succès du Pacte tripartite. Les détails des négociations de cessez-le-feu ne sont pas encore clairs, mais il semble probable que Nasser exigera une certaine forme de réparations et, bien sûr, maintiendra le canal sous contrôle égyptien."
 news.1519.a: "Les outsiders sont arrivés vainqueurs !"
 news.1520.t: "[GetNewspaperHeader]Nasser accepte le cessez-le-feu britannique"
 news.1520.d: "Plus tôt dans la journée, [EGY.GetLeader] a accepté un accord de cessez-le-feu mené par les Britanniques suite à une réponse rapide et affirmative d'Israël à la proposition. Cette décision a été une surprise pour de nombreux experts en politique au Moyen-Orient, car Nasser n'est pas connu pour céder sur quoi que ce soit à la légère. Néanmoins, toutes les hostilités dans le Sinaï ont cessé et les soldats britanniques se sont déplacés pour récupérer le canal conformément aux termes de l'accord. Il reste à imaginer ce qui aurait pu se passer si Nasser avait rejeté la proposition, et pour l'instant, la paix est revenue au Moyen-Orient"
 news.1520.a: "Cela semble légèrement... Décevant"

 cw_saf.4.d: "Après des jours de troubles, les militaires ont décidé de prendre le relais afin de rétablir la paix et l'ordre dans les rues. Dans un bref discours prononcé par le haut commandement, ils ont simplement déclaré : « Même si cela n'est pas agréable, nous devons faire cela pour empêcher l'Afrique du Sud de s'effondrer complètement. Nous souhaitons également restaurer la démocratie le plus rapidement possible. »"

 news.1600.t: "[GetNewspaperHeader]Perón déposé par l'armée argentine"
 news.1600.d: "Les dernières nouvelles arrivent d'Argentine concernant un coup d'État réussi contre le gouvernement péroniste. Le coup d'État s'est produit lorsque des membres de l'armée, de la marine et de l'aéronautique, sous le commandement du général à la retraite Benjamín Menéndez et d'Eduardo Lonardi, ont réussi à renverser le gouvernement du président Juan Domingo Perón. Dans leur brève proclamation, les rebelles accusaient le gouvernement d'avoir conduit la Nation à \"une faillite totale de son crédit interne et externe, tant moralement et spirituellement que matériellement\". Les restrictions des libertés civiles et les actions des opposants politiques, la réforme constitutionnelle qui a permis la réélection du président, ainsi que les mesures visant à politiser les forces armées semblent avoir influencé les militaires adhérents au mouvement. Malgré quelques désaccords au sein des dirigeants rebelles, le coup d'État a été lancé à un moment politique favorable et a réussi, sans que l'on ignore où se trouve actuellement Peron. Alors que l'actuelle dictature militaire provisoire promettait un retour aux processus démocratiques, ils affirment que cela ne se produira que lorsque toutes les influences péronistes auront disparu à tous les niveaux de gouvernement. Reste à savoir si l'Argentine deviendra un jour une nation démocratique."
 news.1600.a: "Une victoire pour la démocratie ?"
 news.1601.t: "[GetNewspaperHeader]Le président William Tubman est décédé à l'âge de 75 ans"
 news.1601.d: "William Tubman, 19e président du Libéria, est décédé aujourd'hui, le 23 juillet 1971, à l'âge de 75 ans, des suites d'un accident vasculaire cérébral. Les 27 années de règne de Tubman, bien que marquées par un certain développement économique et une certaine modernisation, ont également été caractérisées par un autoritarisme et une répression politique croissants. Malgré les allégations de progrès, son régime a souvent réduit au silence l'opposition et restreint les libertés politiques. Sa mort laisse le Libéria aux prises avec un héritage de domination américano-libérienne, une élite dirigeante qui a longtemps maintenu le contrôle sur les systèmes politique et économique du pays. À la suite de son décès, le vice-président William Tolbert est sur le point d'assumer la présidence, et beaucoup l'observeront de près pour voir s'il tracera une nouvelle voie pour le pays ou poursuivra la politique de Tubman."
 news.1601.a: "Son parti est si populaire qu'il en existe un à chaque élection depuis 1878 !"
 news.1602.t: "[GetNewspaperHeader]Samuel Doe mène le coup d'État au Libéria"
 news.1602.d: "Dans une tournure étonnante des événements, Samuel Doe, un ancien soldat, a mené un coup d'État militaire au Libéria le 12 avril 1980, renversant le gouvernement du président William Tolbert. Le coup d'État, qui s'est déroulé tôt le matin, a vu Doe et ses partisans prendre d'assaut le palais présidentiel, conduisant à l'assassinat brutal de Tolbert. Le coup d'État marque la fin de près de 133 ans de régime américano-libérien, avec Doe, membre du groupe autochtone du pays, prenant désormais le contrôle du gouvernement. Le pays est sous le choc et l'incertitude alors que le Libéria entre dans une nouvelle ère imprévisible sous un régime militaire."
 news.1602.a: "Est-ce la fin de la domination américano-libérienne ?!"
 news.1603.t: "[GetNewspaperHeader]Siad Barre mène le coup d'État en Somalie"
 news.1603.d: "Dans un changement de pouvoir spectaculaire, le général Siad Barre a organisé un coup d'État réussi en Somalie, renversant le gouvernement du président Abdirashid Ali Shermarke. Le coup d'État, dirigé par Barre et l'armée somalienne, a eu lieu après que Shermarke ait été assassiné par l'un de ses propres gardes du corps plus tôt dans la journée. Barre a rapidement pris le contrôle, dissolvant le gouvernement existant et déclarant la Somalie État socialiste. Alors que le pays se remet de ce bouleversement soudain, beaucoup se demandent ce que l'avenir nous réserve sous la direction de Barre et les promesses de changement politique et social qui accompagnent ce nouveau régime militaire."
 news.1603.a: "Tant de troubles dans un pays si jeune"
 news.1604.t: "[GetNewspaperHeader]Siad Barre renversé"
 news.1604.d: "Dans une tournure dramatique des événements, le règne de près de 22 ans du général Siad Barre en Somalie a pris fin brutalement lorsque des groupes d'opposition armés ont lancé une offensive finale contre la capitale, Mogadiscio. Après des mois de combats intenses entre les forces gouvernementales et les groupes rebelles, le régime de Barre, affaibli par les divisions internes et l'effondrement des soutiens, a été renversé. Barre lui-même a fui la ville et le gouvernement autrefois stable s'est effondré, laissant la Somalie dans le chaos. Le pays se retrouve désormais sans gouvernement central, alors que les milices claniques et les seigneurs de la guerre se disputent le contrôle, plongeant la nation dans une période d'anarchie et d'incertitude."
 news.1604.a: "Bon débarras!"
 news.1605.t: "[GetNewspaperHeader]Révolution en Ethiopie"
 news.1605.d: "Dans une tournure étonnante et violente des événements, l'empereur éthiopien Hailé Sélassié a été renversé par un coup d'État militaire. Après des mois de troubles croissants, de grèves et de protestations contre son régime, l'armée éthiopienne, dirigée par le Derg (un comité d'officiers), a pris le pouvoir au cours d'une opération rapide. Hailé Sélassié, qui régnait depuis plus de 40 ans, a été destitué et assigné à résidence, marquant la fin de la monarchie éthiopienne vieille de plusieurs siècles. Le coup d'État a plongé le pays dans l'incertitude, le Derg étant désormais aux commandes, promettant des réformes mais faisant également allusion à un régime plus autoritaire. Alors que l'Éthiopie entre dans un nouveau chapitre, l'avenir reste incertain sous le règne de ce nouveau gouvernement dirigé par l'armée."
 news.1605.a: "Chaos!"
 news.1606.t: "[GetNewspaperHeader]Mengistu prend le contrôle du Derg"
 news.1606.d: "Le major Mengistu Haile Mariam est devenu le leader de l'Éthiopie à la suite du coup d'État militaire qui a renversé l'empereur Hailé Sélassié en septembre 1974. Consolidant rapidement son pouvoir au sein du Derg, Mengistu a établi un gouvernement marxiste-léniniste, promettant des réformes agraires tout en lançant une répression brutale contre l'opposition. Alors que l'Éthiopie entre dans cette nouvelle ère de régime militaire, l'avenir reste incertain, avec des tensions politiques et la menace de nouveaux troubles qui pèsent sur la nation."
 news.1606.a: "Le visage du marxiste-léninisme orthodoxe en Éthiopie"
 news.1607.t: "[GetNewspaperHeader]Déclaration de la République démocratique populaire d'Éthiopie"
 news.1607.d: "Le major Mengistu Haile Mariam a annoncé la création de la République démocratique populaire d'Éthiopie, inaugurant officiellement un gouvernement civil marxiste-léniniste. Après le renversement de l'empereur Haïlé Sélassié, le régime de Mengistu promet des réformes radicales, notamment la redistribution des terres et la nationalisation d'industries clés. Cependant, les inquiétudes grandissent à mesure que le gouvernement entame une répression sévère contre l'opposition, annonçant un avenir plus répressif pour le pays sous sa nouvelle direction socialiste. Le paysage politique évolue, laissant beaucoup de personnes incertaines quant à l'avenir de l'Éthiopie."
 news.1607.a: "Enfin un régime civil en Éthiopie"
 news.1608.t: "[GetNewspaperHeader]Mouammar Kadhafi crée la Jamahiriya arabe socialiste"
 news.1608.d: "Mouammar Kadhafi a déclaré la naissance de la Jamahiriya arabe libyenne populaire et socialiste, transformant la Libye en un nouvel État révolutionnaire. Dans une démarche audacieuse, Kadhafi envisage un système de gouvernement populaire direct, où le pouvoir appartient au peuple lui-même. Alors que la nation s'engage dans cette transformation radicale, le monde regarde de près, se demandant si la vision du « pouvoir populaire » de Kadhafi va véritablement remodeler la Libye, ou si son emprise serrée sur les rênes conduira à une consolidation supplémentaire du contrôle."
 news.1608.a: "Leur drapeau n'est qu'une seule couleur !"
 news.1609.t: "[GetNewspaperHeader]Mouammar Kadhafi lance l'intervention tchadienne"
 news.1609.d: "Dans une escalade dramatique des tensions, les forces libyennes ont lancé une invasion à grande échelle du nord du Tchad. L'attaque, ordonnée par le leader frère Mouammar Kadhafi, vise à affirmer le contrôle de la région riche en ressources de la bande d'Aouzou, une zone revendiquée depuis longtemps par les deux nations. Alors que les troupes libyennes progressent, le gouvernement tchadien, soumis à de fortes pressions, se démène pour défendre son territoire. L'invasion menace de déstabiliser l'ensemble de la région, les observateurs internationaux s'inquiétant du risque d'un conflit plus large et de l'implication de puissances étrangères."
 news.1609.a: "Est-ce que cela en vaudra vraiment la peine ?"
 news.1610.t: "[GetNewspaperHeader]François Tombalbaye destitué lors d'un coup d'Etat militaire"
 news.1610.d: "Dans une tournure dramatique des événements, le président tchadien François Tombalbaye a été renversé lors d'un coup d'État militaire orchestré par le général Félix Malloum. Tombalbaye, qui dirigeait le pays depuis l'indépendance, a été évincé par Malloum et un groupe d'officiers de l'armée à la suite de troubles croissants liés à son leadership de plus en plus autocratique. Le coup d'État a laissé le pays dans la tourmente, Malloum prenant désormais le contrôle du gouvernement. Alors que les tensions montent, nombreux sont ceux qui s'interrogent sur l'orientation future du Tchad sous ce nouveau régime militaire."
 news.1610.a: "Les nouveaux États du Sahel sont une énigme"
 news.1611.t: "[GetNewspaperHeader]Ibrahim Abboud organise un coup d'État"
 news.1611.d: "Dans une tournure étonnante des événements, le Conseil de souveraineté du Soudan, dirigé par le président Ismail al-Azhari, a été renversé lors d'un coup d'État militaire dirigé par le général Ibrahim Abboud. Al-Azhari, au pouvoir depuis l'indépendance du Soudan, a été évincé par Abboud et un groupe d'officiers de l'armée déçus par l'incapacité du gouvernement à gérer l'instabilité politique et les luttes économiques. Le coup d'État a laissé le pays dans la tourmente, Abboud prenant désormais le contrôle du gouvernement. Alors que le Soudan est confronté à un avenir incertain sous un régime militaire, nombreux sont ceux qui s'interrogent sur la voie à suivre pour le pays."
 news.1611.a: "La démocratie, morte au berceau"
 news.1612.t: "[GetNewspaperHeader]Gaafar Nimeiry prépare un coup d'État nassérien"
 news.1612.d: "Dans un changement radical de pouvoir, le gouvernement soudanais a été renversé lors d'un coup d'État militaire dirigé par le colonel Gaafar Nimeiry. Le coup d'État, qui a renversé le gouvernement civil, est intervenu après une agitation et un mécontentement croissants face à l'instabilité politique et aux défis économiques du pays. Nimeiry, un jeune officier militaire, prend rapidement les commandes, promettant de rétablir l'ordre et de mettre en oeuvre des réformes. S'inspirant fortement du dirigeant égyptien Gamal Abdel Nasser et du panarabisme, le nouveau régime de Nimeiry devrait promouvoir des liens plus étroits avec le monde arabe, orientant potentiellement le Soudan vers une voie plus socialiste et nationaliste."
 news.1612.a: "Un autre coup d'État d'officier libre ?"
 news.1613.t: "[GetNewspaperHeader]Abdel Rahman Swar al-Dahab renverse le gouvernement soudanais"
 news.1613.d: "Dans un geste rapide et inattendu, le gouvernement soudanais a été renversé par un coup d'État militaire dirigé par le général Abdel Rahman Swar al-Dahab. Le coup d'État a renversé le régime du président Gaafar Nimeiry, aux prises avec une instabilité politique et des défis économiques. Swar al-Dahab, qui dirigeait les forces militaires, a promis de ramener le pays à un régime civil après une période de transition, marquant une rupture avec la gouvernance autoritaire du passé. Alors que le Soudan traverse cette nouvelle phase, nombreux sont ceux qui se demandent comment l'influence de l'armée façonnera l'avenir du pays, notamment en termes de relations avec les deux puissances régionales et de pression en faveur de réformes démocratiques."
 news.1613.a: "La démocratie reviendra-t-elle vraiment ?"
 news.1614.t: "[GetNewspaperHeader]La démocratie civile revient au Soudan"
 news.1614.d: "Dans le cadre d'un changement politique important, Ahmad Al-Mirghani a été nommé président du Soudan, à la suite d'une transition pacifique du pouvoir. Al-Mirghani, chef du Parti unioniste démocratique, prend ses fonctions après une période de troubles politiques et de régime militaire, marquant le retour à une gouvernance civile. Son investiture marque un nouveau chapitre pour le Soudan, avec Al-Mirghani s'engageant à promouvoir l'unité nationale et à relever les défis économiques et sociaux urgents du pays."
 news.1614.a: "Un miracle"
 news.1615.t: "[GetNewspaperHeader]Omar el-Béchir crée une junte militaire"
 news.1615.d: "Dans un geste rapide et choquant, le gouvernement soudanais a été renversé par un coup d'État militaire dirigé par le général Omar al-Bashir. Le coup d'État a renversé le gouvernement du Premier ministre Sadiq al-Mahdi, marquant la fin de l'éphémère expérience démocratique du pays. Al-Bashir, qui dirigeait les forces militaires, a rapidement pris le contrôle du pays, promettant de restaurer la stabilité et de remédier aux troubles économiques et politiques du pays. Avec son accession au pouvoir, le Soudan est à nouveau sous régime militaire."
 news.1615.a: "Choquant"
 news.1616.t: "[GetNewspaperHeader]Déclaration de la République tunisienne"
 news.1616.d: "Dans une décision capitale, la Tunisie s'est officiellement déclarée république, abolissant sa monarchie et inaugurant une nouvelle ère de gouvernance. L'Assemblée nationale a voté la dissolution de la monarchie et Habib Bourguiba, qui avait auparavant été Premier ministre, est devenu le premier président du pays. Ce changement historique fait suite à des années de lutte nationaliste et à l'indépendance durement gagnée de la Tunisie. Bourguiba est désormais à la tête du pays, s'engageant à moderniser le pays et à l'orienter vers le progrès, même si les défis liés à la consolidation de cette nouvelle république audacieuse restent importants."
 news.1616.a: "Une Tunisie laïque, républicaine ?"
 news.1617.t: "[GetNewspaperHeader]Le coup d'État médical"
 news.1617.d: "Dans un tournant dramatique et inattendu, la Tunisie a été témoin de ce qu'on appelle un « coup d'État médical » contre le président Habib Bourguiba. Après des années passées à diriger le pays en tant que président et Premier ministre, Bourguiba, dont la santé était en déclin, a été officiellement démis du pouvoir. Dans une démarche orchestrée par son entourage et des responsables militaires, le président malade a été déclaré inapte à gouverner et ses pouvoirs ont été transférés au Premier ministre Zine El Abidine Ben Ali. Ce changement soudain marque la fin du long règne de Bourguiba, qui a façonné l'identité de la Tunisie après l'indépendance, et soulève des questions sur l'orientation future du pays sous la direction de Ben Ali."
 news.1617.a: "Un nouveau chapitre pour la Tunisie"
 news.1618.t: "[GetNewspaperHeader]La mort de Mohammed V"
 news.1618.d: "Dans un moment de profonde tristesse nationale, le Maroc pleure le décès du roi Mohammed V, décédé aujourd'hui des suites d'une longue maladie. Le monarque bien-aimé, qui a conduit le Maroc à l'indépendance de la domination coloniale française en 1956, était un symbole d'unité et de résilience pour la nation. Sa mort marque la fin d'une époque et le début d'un nouveau chapitre de l'histoire du Maroc. Alors que la nation est en deuil, le prince héritier Hassan, fils aîné de Muhammad V, devrait monter sur le trône sous le nom de roi Hassan II. La transition du pouvoir devrait se dérouler en douceur, alors qu'Hassan II, une figure très appréciée, se prépare à perpétuer l'héritage de son père tout en relevant les défis d'un monde en évolution rapide."
 news.1618.a: "Le dernier bastion du monarchisme au Maghreb"
 news.1619.t: "[GetNewspaperHeader]La mort de Hassan II"
 news.1619.d: "Le Maroc est aujourd'hui en deuil suite au décès du roi Hassan II, décédé après une longue maladie. Le défunt roi, qui a régné pendant près de quatre décennies, a joué un rôle central dans la modernisation du Maroc et dans son guidage à travers les périodes de turbulences politiques et de changements économiques. Son leadership a été marqué par des réformes significatives, ainsi que par une position ferme en matière de politique étrangère, notamment en ce qui concerne le conflit du Sahara occidental. Alors que le pays est aux prises avec la perte de son leader de longue date, le trône va désormais passer à son fils, le prince héritier Mohammed VI. Avec la transition du pouvoir, nombreux sont ceux qui anticipent une nouvelle ère de réformes sous la direction du jeune roi, longtemps considéré comme un symbole de renouveau."
 news.1619.a: "La monarchie marocaine est incassable"
 news.1620.t: "[GetNewspaperHeader]Houari Boumediene orchestre un coup d'État en Algérie"
 news.1620.d: " Dans une prise de pouvoir spectaculaire, le colonel Houari Boumediene, ancien chef d'état-major et proche allié du président déchu Ahmed Ben Bella, a renversé le gouvernement par un coup d'État militaire sans effusion de sang. Le coup d'État, exécuté au petit matin, a vu les forces de Boumediene prendre rapidement le contrôle d'institutions clés, notamment des stations de radio, des casernes militaires et des bâtiments gouvernementaux. Ben Bella, qui a conduit l'Algérie à l'indépendance en 1962, aurait été arrêté et se trouve actuellement en détention militaire. Boumediene, s'adressant à la nation par radio, a déclaré la dissolution de l'Assemblée nationale et la création d'un Conseil révolutionnaire de 26 membres pour gouverner le pays, citant « la déviation des idéaux révolutionnaires » et « l'instabilité politique » pour justifier la prise de pouvoir. La communauté internationale suit de près l'Algérie, un acteur central du Mouvement des pays non alignés, qui entre dans une nouvelle ère de régime militaire."
 news.1620.a: "Pas d'incohérences idéologiques ?"
