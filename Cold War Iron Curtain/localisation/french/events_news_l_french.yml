 news.1004.t: "[GetNewspaperHeader]Le PCC crée le chinois simplifié"
 news.1004.d: "Le gouvernement chinois a officiellement publié les détails d'un nouveau document intitulé « Schéma d'implication des caractères chinois » et d'une nouvelle ordonnance exigeant que les écoles appliquent les nouveaux caractères chinois dans les écoles. Bien que le Comité chinois de recherche sur la réforme linguistique ait commencé le processus de simplification des caractères chinois depuis 1952, le mouvement de simplification de la langue remonte au début du XXe siècle. Le gouvernement chinois affirme que la simplification du chinois améliorera l'alphabétisation et diffusera l'éducation à tous les Chinois. Le gouvernement estime que les nouveaux changements faciliteront la publication et permettront également la diffusion de nouvelles ou d'informations à tous les niveaux de la société. Certains Chinois ont exprimé leurs inquiétudes quant aux réformes, affirmant que le gouvernement ne devrait pas interférer avec un texte écrit qui existe depuis des millénaires. Quoi qu'il en soit, les écoles chinoises du pays recevront bientôt des manuels et des instructions sur l'enseignement des nouveaux caractères à tous les élèves."
 news.1004.a: "Puisse cela rassembler notre pays."
 news.1004.b: "Super!"
 
