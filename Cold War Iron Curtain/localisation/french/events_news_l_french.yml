 news.1621.t: "[GetNewspaperHeader]Houari Boumédiène rétablit le régime civil en Algérie"
 news.1621.d: "Dans un geste historique, le chef militaire algérien, Houari Boumédiène, a officiellement annoncé le retour à un régime civil après plus d'une décennie de gouvernance militaire. Boumédiène, qui a pris le pouvoir lors d'un coup d'État en 1965, a confirmé aujourd'hui que le pays organiserait des élections libres, marquant la fin de son contrôle direct et le début d'un nouveau chapitre politique pour la nation. Cette annonce intervient après des années de stabilité et de réformes économiques sous la direction de Boumédiène, même si les appels à une plus grande participation démocratique se sont fait plus forts ces dernières années. La décision de Boumédiène de démissionner et d'ouvrir la voie à un gouvernement civil a suscité un optimisme prudent de la part du public et des analystes politiques."
 news.1621.a: "L'Algérie est-elle un bastion de la démocratie au Maghreb ?"
 news.1622.t: "[GetNewspaperHeader]Houari Boumédiène décède alors qu'il était au pouvoir"
 news.1622.d: "L'Algérie est aujourd'hui en deuil suite au décès du président Houari Boumédiène, décédé après un long combat contre la maladie. Boumédiène, qui a dirigé le pays pendant plus de 13 ans après un coup d'État militaire en 1965, était une figure centrale de l'histoire post-indépendance de l'Algérie. Sous sa direction, le pays a connu d'importantes réformes économiques et sociales, ainsi qu'une position ferme sur la politique internationale, notamment en faveur des mouvements anticoloniaux et de l'unité arabe. Sa mort marque la fin d'une époque, laissant la nation aux prises avec l'avenir incertain de ses dirigeants politiques."
 news.1622.a: "Verrons-nous la fin de l'héritage militaire de l'Algérie ?"
 news.1623.t: "[GetNewspaperHeader]Fin de la Fédération du Mali"
 news.1623.d: "Le Sénégal a officiellement obtenu son indépendance de la Fédération du Mali, marquant la fin d'une brève union politique. La Fédération du Mali, créée en 1959 par le Sénégal et l'ancien Soudan français (aujourd'hui le Mali), a été dissoute en raison des différences politiques et économiques croissantes entre les deux nations. Le Sénégal, qui faisait partie de la Fédération, est désormais pleinement souverain, son indépendance marquant un changement important dans le paysage politique de la région. La fin de la Fédération intervient après des désaccords sur la gouvernance et les structures fédérales, et tandis que le Sénégal célèbre sa nouvelle autonomie, la dissolution laisse les deux pays tracer des chemins séparés en tant qu'États indépendants"
 news.1623.a: "Le Sénégal sera-t-il le modèle de la démocratie africaine ?"
 news.1624.t: "[GetNewspaperHeader]Putsch contre Modibo Keïta au Mali"
 news.1624.d: "Dans une tournure étonnante des événements, le président Modibo Keïta du Mali a été renversé par un coup d'État militaire. Le coup d'État, qui a eu lieu aujourd'hui, a vu la prise soudaine du pouvoir par un groupe d'officiers de l'armée dirigé par le lieutenant Moussa Traoré. Keïta, au pouvoir depuis l'indépendance du Mali en 1960, a été arrêté et placé en détention, alors que les forces militaires prenaient le contrôle des principales institutions gouvernementales dans la capitale, Bamako. Le coup d'État fait suite à un mécontentement croissant face à la politique socialiste, aux luttes économiques et à la répression politique de Keïta, qui ont alimenté des troubles généralisés. Alors que l'armée prend désormais le contrôle, la nation se retrouve dans l'incertitude, Traoré et ses partisans promettant de rétablir l'ordre et de relever les défis du pays."
 news.1624.a: "La fin du panafricanisme au Mali"
 news.1625.t: "[GetNewspaperHeader]La guerre du sable"
 news.1625.d: "Dans une soudaine escalade des tensions, des affrontements ont éclaté entre les forces armées algériennes et marocaines le long de leur frontière commune, dans ce qui est désormais connu sous le nom de guerre du sable. Le conflit, qui a débuté cette semaine, est enraciné dans un conflit territorial de longue date, en particulier dans les zones contestées des régions de Tindouf et de Figuig. Les deux pays ont mobilisé des troupes et de violents combats ont éclaté dans le désert, faisant des victimes des deux côtés. La guerre, qui semble être le résultat d'ambitions territoriales et de problèmes frontaliers non résolus après l'indépendance des deux pays vis-à-vis de la France, a suscité des inquiétudes dans toute la région. Même si les deux pays ont exprimé leur désir de paix, le conflit ne montre aucun signe de résolution immédiate et la communauté internationale appelle au calme pour éviter une nouvelle escalade dans la région instable du Sahara."
 news.1625.a: "La communauté internationale doit trouver un compromis !"
 news.1626.t: "[GetNewspaperHeader]Moussa Traoré renversé lors du coup d'État au Mali"
 news.1626.d: "Dans un développement étonnant et inattendu, le régime militaire de Moussa Traoré a été renversé par un coup d'État. Tôt ce matin, un groupe d'officiers de l'armée, dirigé par le capitaine Amadou Toumani Touré, a pris le contrôle de bâtiments gouvernementaux clés à Bamako et a arrêté Traoré, qui dirigeait le Mali depuis 1968. Le coup d'État fait suite à des mois de mécontentement croissant face au régime de plus en plus autoritaire de Traoré, à la corruption généralisée et aux difficultés économiques du pays. Malgré les efforts visant à réprimer les manifestations et la dissidence, les tensions ont atteint un point d'ébullition, culminant avec le changement de pouvoir dramatique d'aujourd'hui. Alors que l'armée prend les commandes, l'avenir du leadership du Mali reste incertain, le pays se préparant à ce qui s'annonce comme une période de changement politique tumultueuse."
 news.1626.a: "La fin d'une dictature malienne ?"
 news.1627.t: "[GetNewspaperHeader]La démocratie revient au Mali"
 news.1627.d: "Dans un moment historique pour le Mali, le pays est officiellement revenu à un régime démocratique après des années de gouvernance dirigée par l'armée. Alpha Oumar Konaré, figure éminente de l'opposition, a été élu nouveau président du pays, marquant la fin du régime militaire en place depuis le coup d'État de 1991. La victoire de Konaré lors des premières élections multipartites du pays est considérée comme un pas en avant significatif pour le Mali, alors que le pays évolue vers un système politique plus inclusif et participatif. Après des années de répression politique, le transfert pacifique du pouvoir annonce une nouvelle ère de gouvernance démocratique, Konaré s'engageant à relever les défis économiques et sociaux du pays. Le retour du Mali à la démocratie a été salué à la fois par la communauté internationale et par le peuple malien, qui compte désormais sur Konaré pour conduire la nation vers un nouveau chapitre de stabilité et de progrès."
 news.1627.a: "Les valeurs libérales dans une nation ancienne"
 news.1628.t: "[GetNewspaperHeader]La guerre de la bande d'Agacher"
 news.1628.d: "Les tensions entre le Mali et le Burkina Faso ont éclaté aujourd'hui en un conflit ouvert autour de la bande contestée d'Agacher, une étroite région frontalière riche en ressources. La guerre de la bande d'Agacher, comme on l'appelle, a donné lieu à de violents combats le long de la frontière alors que les forces des deux pays s'affrontent pour le contrôle du territoire. Le conflit survient après des années de différends entre les deux nations, le président du Mali Moussa Traoré et le président du Burkina Faso Thomas Sankara revendiquant la souveraineté sur la bande de Gaza. La violence s'est intensifiée après une série d'escarmouches à la frontière, et désormais, les deux camps ont mobilisé des troupes, avec au moins 50 victimes signalées du côté malien et 30 du côté burkinabé. Alors que les appels internationaux à un cessez-le-feu se font de plus en plus forts, la situation reste tendue et l'avenir de la bande d'Agacher est en jeu. Les deux dirigeants sont sous pression pour négocier une solution pacifique, mais pour l'instant, la guerre continue de se dérouler sans aucune fin immédiate en vue."
 news.1628.a: "Une autre guerre sur le continent africain"
 news.1629.t: "[GetNewspaperHeader]Abdou Diouf élu démocratiquement au Sénégal"
 news.1629.d: "Le Sénégal a officiellement élu son deuxième président dans le cadre d'une transition pacifique du pouvoir, marquant une étape importante dans le développement démocratique du pays. Abdou Diouf, ancien Premier ministre du président Léopold Sédar Senghor, est sorti vainqueur des premières élections multipartites du pays, assurant ainsi sa position de nouveau dirigeant du Sénégal. L'élection, qui a connu une large participation et s'est déroulée dans l'ensemble dans le calme, intervient après la décision de Senghor de démissionner et de passer le relais à une nouvelle génération de dirigeants. La victoire de Diouf a été largement célébrée, beaucoup y voyant un témoignage de la stabilité politique du Sénégal et de son attachement aux principes démocratiques. Avec l'entrée en fonction de Diouf, il s'est engagé à poursuivre la politique de son prédécesseur tout en se concentrant sur la croissance économique et le développement social de la nation."
 news.1629.a: "La démocratie sénégalaise sauvée"
 news.1630.t: "[GetNewspaperHeader]Abdoulaye Wade élu démocratiquement au Sénégal"
 news.1630.d: "Le Sénégal a officiellement élu son troisième président dans un moment historique pour la démocratie du pays. Abdoulaye Wade, leader de l'opposition de longue date et ancien économiste, a remporté une victoire décisive lors de la première élection présidentielle contestée du pays depuis 1960, battant le président sortant Abdou Diouf. L'élection, qui a connu un taux de participation élevé et s'est déroulée dans l'ensemble dans le calme, marque un changement politique majeur au Sénégal, dans la mesure où la victoire de Wade représente la première fois dans l'histoire du pays qu'un président sortant est évincé de ses fonctions de manière pacifique. La campagne de Wade, axée sur la lutte contre la corruption et la promotion du développement économique, a trouvé un écho auprès de nombreux citoyens sénégalais avides de changement. Avec sa victoire, Wade a promis de donner la priorité aux réformes démocratiques, d'améliorer l'économie et de résoudre les problèmes sociaux auxquels le pays est confronté."
 news.1630.a: "La démocratie sénégalaise est inébranlable"
 news.1631.t: "[GetNewspaperHeader]Maaouya Ould Sid'Ahmed Taya organise un coup d'État sans effusion de sang en Mauritanie"
 news.1631.d: "Dans une tournure dramatique des événements, la Mauritanie a été plongée dans l'incertitude politique à la suite du coup d'État militaire qui a renversé le président Mohamed Khouna Ould Haidalla. Le coup d'État, dirigé par le colonel Maaouya Ould Sid'Ahmed Taya, a eu lieu aujourd'hui alors que les forces armées ont pris le contrôle de bâtiments gouvernementaux clés dans la capitale, Nouakchott, et ont arrêté Ould Haidalla. Taya, qui avait auparavant occupé des postes militaires de haut rang, a justifié le coup d'État comme étant nécessaire pour restaurer la stabilité et relever les défis politiques et économiques croissants du pays. Ould Haidalla, au pouvoir depuis 1980, avait été critiqué pour sa gestion des divisions internes et des tensions militaires. Alors que l'armée consolide son pouvoir sous la direction de Taya, la Mauritanie se trouve à la croisée des chemins, la communauté internationale surveillant de près la manière dont ce nouveau régime façonnera l'avenir de la nation."
 news.1631.a: "La Mauritanie, une nation qui n'a connu qu'un régime militaire"
 news.1632.t: "[GetNewspaperHeader]Déclaration de la République de Gambie."
 news.1632.d: "Dans un geste historique, la Gambie s'est officiellement déclarée république, marquant ainsi un nouveau chapitre de son histoire postcoloniale. La déclaration, faite aujourd'hui, voit le pays passer d'une monarchie constitutionnelle dirigée par la reine Elizabeth II à une république, avec Dawda Kairaba Jawara, le premier président du pays, assumant le contrôle total de la direction de la nation. Jawara, au pouvoir depuis l'indépendance de la Gambie en 1965, assume désormais le titre de président, marquant la fin de l'influence coloniale britannique. La décision de devenir une république fait suite à un sentiment croissant en faveur d'un gouvernement plus autonome, et ce changement est considéré comme une étape cruciale vers la consolidation de la souveraineté du pays."
 news.1632.a: "Ne devraient-ils pas faire partie du Sénégal ?"
 news.1633.t: "[GetNewspaperHeader]Yahya Jammeh prépare un coup d'État militaire en Gambie"
 news.1633.d: "Dans une tournure choquante des événements, la Gambie a été plongée dans la tourmente politique après que le président Dawda Kairaba Jawara a été renversé lors d'un coup d'État militaire dirigé par le lieutenant Yahya Jammeh. Le coup d'État, qui a eu lieu aujourd'hui, a vu les forces de Jammeh prendre le contrôle de bâtiments gouvernementaux clés dans la capitale, Banjul, et arrêter Jawara, qui était au pouvoir depuis l'indépendance du pays en 1965. Jammeh, un jeune officier de l'armée gambienne, a justifié le coup d'État comme étant nécessaire pour lutter contre la corruption et l'instabilité politique sous la direction de Jawara. Alors que l'avenir du pays est incertain, le régime militaire de Jammeh a promis réformes et stabilité, mais le monde reste attentif à la manière dont ce changement brutal de direction façonnera l'avenir du pays."
 news.1633.a: "Tragédie dans la petite république"
 news.1634.t: "[GetNewspaperHeader]La Gambie renomme sa capitale Bathurst en Banjul"
 news.1634.d: "Dans un geste symbolique reflétant l'évolution de l'identité de la nation, la Gambie a officiellement rebaptisé sa capitale Bathurst en Banjul. La décision, annoncée aujourd'hui, marque une rupture significative avec l'héritage colonial, le nouveau nom étant choisi pour honorer les racines indigènes de la ville. Banjul, qui portait à l'origine le nom d'Henry Bathurst, secrétaire d'État britannique aux Colonies, reflétera désormais un héritage plus indépendant et local. Ce changement de nom s'inscrit dans le cadre d'un effort plus large du gouvernement du président Yahya Jammeh visant à se réapproprier l'histoire du pays et à affirmer sa souveraineté après des années de régime colonial. Cette décision a suscité des réactions mitigées, certains célébrant le changement comme une étape vers une plus grande fierté nationale, tandis que d'autres remettent en question l'impact pratique du changement de nom."
 news.1634.a: "Une autre relique coloniale disparue"
 news.1635.t: "[GetNewspaperHeader]Le président du Dahomey, Hubert Maga, destitué lors d'un coup d'État"
 news.1635.d: "Dans un développement dramatique et inattendu, le président Hubert Maga du Dahomey a été renversé par un coup d'État militaire. Le coup d'État, qui a eu lieu aujourd'hui, a vu un groupe d'officiers de l'armée prendre le contrôle de bâtiments gouvernementaux clés dans la capitale, Cotonou, et arrêter Maga, qui était au pouvoir depuis l'indépendance du pays de la France en 1960. Le coup d'État a été dirigé par le major Christophe Soglo, qui a justifié cette prise de pouvoir en invoquant l'instabilité politique croissante et l'incapacité du gouvernement de Maga à relever efficacement les défis économiques et sociaux du pays. Alors que l'armée prend le contrôle, l'avenir du leadership du Dahomey reste incertain et le pays est confronté à la perspective d'un changement politique important."
 news.1635.a: "Encore un coup d'État tragique en Afrique de l'Ouest !"
 news.1636.t: "[GetNewspaperHeader]Déclaration de la République Populaire Marxiste-Léniniste du Bénin"
 news.1636.d: "Dans un changement d'orientation politique audacieux, le Dahomey s'est officiellement déclaré République populaire marxiste-léniniste du Bénin. La déclaration, faite aujourd'hui, marque la rupture du pays avec sa structure politique précédente et son adhésion au socialisme sous la direction de Mathieu Kérékou. Kérékou, arrivé au pouvoir à la suite d'un coup d'État militaire en 1972, a annoncé ce changement dans le cadre de l'engagement de son gouvernement à adopter les principes marxistes-léninistes, visant à transformer l'économie et la société du pays. Cette décision marque un changement radical par rapport aux politiques capitalistes du régime précédent et vers une économie contrôlée par l'État, ainsi qu'une alliance plus forte avec les nations socialistes. Bien que la déclaration ait suscité des réactions mitigées tant au niveau national qu'international, le gouvernement de Kérékou promet d'oeuvrer en faveur de la justice sociale, de la réforme agraire et de l'égalité économique. Alors que le Bénin s'engage dans ce nouveau chapitre, le monde observe de près comment le nouveau gouvernement marxiste-léniniste façonnera l'avenir de la nation."
 news.1636.a: "Nouvel échec du confinement"
 news.1637.t: "[GetNewspaperHeader]Mathieu Kérékou annonce la transition vers la démocratie"
 news.1637.d: "Dans un geste historique et inattendu, le président Mathieu Kérékou a annoncé la transition du Bénin vers une démocratie, marquant un changement radical par rapport aux politiques marxistes-léninistes qu'il avait mises en oeuvre depuis son arrivée au pouvoir en 1972. Dans un discours prononcé aujourd'hui, Kérékou a révélé son intention de s'éloigner du système à parti unique et d'ouvrir la porte à des élections multipartites, marquant ainsi la fin de l'expérience socialiste du pays. Cette annonce intervient après des années de pression croissante en faveur de réformes politiques et de revendications croissantes en faveur de plus grandes libertés politiques. Kérékou, qui était auparavant considéré comme un ardent défenseur de l'idéologie marxiste-léniniste, s'engage désormais à diriger la nation vers une transition pacifique et ordonnée vers une gouvernance démocratique. La nouvelle a suscité un optimisme généralisé et un espoir prudent, tant au Bénin qu'à l'échelle internationale, alors que le pays se tourne vers une nouvelle ère de participation politique et de droits civiques."
 news.1637.a: "La fin du parti unique au Bénin"
 news.1638.t: "[GetNewspaperHeader]Gabriel Ramanantsoa mène un coup d'État à Madagascar"
 news.1638.d: "Dans une tournure étonnante des événements, le président Philibert Tsiranana de Madagascar a été renversé lors d'un coup d'État militaire dirigé par le colonel Gabriel Ramanantsoa. Le coup d'État, qui a eu lieu aujourd'hui, a vu Ramanantsoa et ses forces prendre le contrôle de bâtiments gouvernementaux clés dans la capitale, Antananarivo, et arrêter Tsiranana, qui était au pouvoir depuis l'indépendance de Madagascar en 1960. Ramanantsoa, un officier de haut rang de l'armée malgache, a justifié le coup d'État en invoquant le mécontentement généralisé à l'égard du leadership de Tsiranana, qui avait été critiqué pour ses liens avec la France et son incapacité à répondre aux problèmes économiques et sociaux du pays. Défis. Alors que l'armée consolide son pouvoir, l'avenir du leadership politique malgache reste incertain, Ramanantsoa s'engageant à restaurer la stabilité et à promouvoir des réformes."
 news.1638.a: "La fin de la République malgache"
 news.1639.t: "[GetNewspaperHeader]\"L'Amiral Rouge\" déclare la Révolution Socialiste Malgache"
 news.1639.d: "Dans un geste audacieux et dramatique, le Colonel Gabriel Ramanantsoa, également connu sous le nom de « L'Amiral Rouge », a déclaré la Révolution Socialiste Malgache, marquant un changement radical dans le paysage politique de Madagascar. Cette déclaration intervient après le coup d'État militaire qui a renversé le président Philibert Tsiranana, au pouvoir depuis l'indépendance en 1960. Ramanantsoa, qui défend depuis longtemps les politiques socialistes, a annoncé que le pays adopterait les principes marxistes-léninistes et chercherait à s'aligner plus étroitement sur les mouvements socialistes du monde entier. Le nouveau gouvernement s'est engagé à nationaliser les industries clés, à redistribuer les terres et à mettre en oeuvre des réformes économiques radicales visant à lutter contre la pauvreté et les inégalités généralisées à Madagascar."
 news.1639.a: "Le Kadhafi ou le Mao de l'Océan Indien ?"
 news.1640.t: "[GetNewspaperHeader]Madagascar revient à la démocratie multipartite"
 news.1640.d: "Dans une annonce historique, Madagascar est officiellement revenu à une démocratie multipartite après des années de régime militaire et de gouvernance socialiste. La déclaration, faite aujourd'hui par le président Gabriel Ramanantsoa, marque la fin des politiques marxistes-léninistes du pays et la restauration d'un système politique autorisant la pluralité des partis politiques et des élections libres. Après des années de pression en faveur de réformes politiques, Ramanantsoa, arrivé au pouvoir après un coup d'État militaire en 1972, a révélé son intention de ramener le pays à un régime civil, avec un engagement en faveur du pluralisme politique et de plus grandes libertés. Cette décision importante est considérée comme un tournant pour Madagascar, qui est depuis longtemps aux prises avec une instabilité politique et des défis économiques. Le pays entre désormais dans une nouvelle ère de gouvernance démocratique, avec l'espoir d'une reprise économique, d'une transparence politique et d'une plus grande coopération internationale."
 news.1640.a: "Les années 90 sont-elles l'âge d'or de la néo-démocratie ?"
 news.1641.t: "[GetNewspaperHeader]Getúlio Vargas remporte les élections brésiliennes"
 news.1641.d: "Quinze ans après la fin de son régime autoritaire de l'Estado Novo, Getúlio Vargas a effectué un retour démocratique spectaculaire, remportant la présidence du Brésil avec 48,7 % des voix, soit le mandat le plus important de l'histoire de la république. Le \"Père des Pauvres\", âgé de 67 ans, a battu le conservateur Eduardo Gomes et le candidat social-démocrate Cristiano Machado en ralliant les travailleurs avec des promesses de réformes du travail et de politiques économiques nationalistes, prouvant ainsi son attrait populiste durable. Des dizaines de milliers de trabalhadores ont envahi la place Cinelândia en scandant « Ele voltou ! (Il est de retour !) Alors que Vargas - qui a gouverné en dictateur de 1937 à 1945 - a juré de gouverner constitutionnellement. \"La volonté du peuple a triomphé des élites\", a déclaré le leader gaucho, entouré de patrons syndicaux et de militaires modérés. Les opposants craignent un retour aux tactiques d'homme fort, citant la récente rhétorique enflammée de Vargas contre le « capital international ». Les diplomates américains ont exprimé en privé leur inquiétude face à son projet de nationaliser le pétrole, tandis que les industriels de São Paulo ont mis en garde contre une « guerre de classes ». Pourtant, la panique du marché s'est atténuée lorsque Vargas a nommé le centriste Café Filho au poste de vice-président. Alors que les feux d'artifice allumaient le Pain de Sucre, les analystes ont noté l'ironie : la démocratie brésilienne, que Vargas avait autrefois suspendue, l'a maintenant ramené au pouvoir - testant si le vieux renard peut concilier ses instincts populistes avec un régime démocratique. La réponse façonnera non seulement le Brésil, mais aussi toutes les fragiles démocraties d'après-guerre d'Amérique latine."
 news.1641.a: "Il est de retour !?"
 news.1642.t: "[GetNewspaperHeader]Getúlio Vargas meurt par suicide"
 news.1642.d: "Dans un coup de tonnerre mettant fin à l'une des carrières politiques les plus turbulentes d'Amérique latine, le président brésilien Getúlio Vargas s'est mortellement tiré une balle dans le coeur à l'aube aujourd'hui, laissant une note de suicide tachée de sang qui a déclenché des soulèvements massifs à travers le pays. Le dernier acte du dirigeant de 71 ans - un coup de pistolet de calibre.32 dans sa chambre au Catete Palace - est survenu quelques heures après que l'armée a exigé sa démission dans un contexte de scandale d'assassinat et d'effondrement économique. Son manifeste manuscrit, lu à la radio nationale par un assistant en pleurs, accusait les « spéculateurs internationaux » et les « oligarques réactionnaires » de détruire le Brésil : « Je quitte la vie pour entrer dans l'histoire ». En quelques heures, des getulistas enragés ont incendié les journaux d'opposition, saccagé le consulat américain à Porto Alegre et lapidé les voitures de Carlos Lacerda, le rival de Vargas, dont la tentative d'assassinat par les gardes du corps de Vargas a déclenché la crise. Le suicide transforme Vargas de leader en disgrâce en martyr. Des milliers de personnes en deuil ont envahi les rues de Rio, portant son portrait alors que les troupes luttaient pour contenir les affrontements. Le vice-président Café Filho a pris le pouvoir, mais avec le Parti des travailleurs de Vargas appelant à une grève générale et l'armée divisée, le Brésil est au bord du gouffre."
 news.1642.a: "Son parti lui survivra-t-il ?"
 news.1643.t: "[GetNewspaperHeader]Juscelino Kubitschek remporte les élections brésiliennes de 1955"
 news.1643.d: "Défiant les partisans de la ligne dure militaire et la crise économique, le charismatique mineur Juscelino Kubitschek a revendiqué la présidence du Brésil avec une majorité de 36 %, promettant une audacieuse campagne de modernisation qui déplacerait la capitale vers l'intérieur aride du pays. L'ancien gouverneur du Minas Gerais, âgé de 53 ans, soutenu par une coalition de centre-gauche comprenant les héritiers de Vargas, a battu le général de droite Juarez Távora par 500 000 voix, déclenchant à la fois l'euphorie et la crainte d'un coup d'État. Le discours de victoire de Kubitschek à l'hôtel Glória de Rio a électrisé ses partisans : « Nous construirons des autoroutes pour briser notre isolement, des écoles pour éclairer notre peuple et une nouvelle capitale pour unir cette nation continentale ! L'engagement fait référence à son Plano de Metas ciblant l'énergie, les transports et l'industrie - un programme de type New Deal alimenté par des prêts étrangers. Mais des ombres planent sur ce triomphe. Les factions militaires, toujours en colère contre le suicide de Vargas, murmurent une « infiltration communiste », tandis que les industriels de São Paulo rechignent aux projets de dépenses de JK. L'ambassadeur américain James Kemper a prudemment approuvé le résultat, mais les câbles du Département d'État obtenus par The Globe révèlent des inquiétudes concernant une « irresponsabilité fiscale »."
 news.1643.a: "Il envisage de construire une ville entière ?"
 news.1644.t: "[GetNewspaperHeader]Jânio Quadros remporte les élections brésiliennes de 1960"
 news.1644.d: "Dans une tournure dramatique des événements, Jânio Quadros, candidat de l'Union nationale démocratique (UDN) de droite, a remporté l'élection présidentielle de 1960, remportant une victoire décisive avec un large soutien dans tout le Brésil. Connu pour son style populiste et son approche peu orthodoxe de la politique, Quadros s'est présenté sur un programme qui promettait un renouveau moral et politique, visant à lutter contre la corruption, à rétablir la discipline et à renforcer la position internationale du Brésil. Sa victoire est considérée comme une réponse au mécontentement croissant à l'égard de l'ordre politique existant, et il a fait campagne en promettant des mesures anti-corruption strictes et une responsabilité budgétaire. Quadros a plaidé pour une plus grande indépendance vis-à-vis des puissances étrangères et s'est engagé à réduire les dépenses publiques inutiles tout en mettant en oeuvre des politiques visant à promouvoir la croissance et la stabilité économiques. L'accent mis sur l'intégrité morale, l'austérité et une position ferme contre la corruption a séduit une large partie de l'électorat, même si beaucoup restent incertains quant à la manière dont ses promesses audacieuses se traduiront en actions."
 news.1644.a: "Une victoire de la droite au Brésil"
 news.1645.t: "[GetNewspaperHeader]L'armée bazilienne crée une junte d'extrême droite"
 news.1645.d: "Dans une tournure étonnante des événements, le gouvernement civil du Brésil a été renversé aujourd'hui par un coup d'État militaire rapide, mettant fin à l'administration du président João Goulart. L'armée, invoquant ses inquiétudes concernant la politique de gauche de Goulart et ses sympathies communistes perçues, a pris le contrôle des principales institutions gouvernementales et a déclaré la loi martiale dans les grandes villes. Goulart, qui avait poursuivi des réformes agraires et resserré ses liens avec les nations socialistes, a fui la capitale lorsque l'armée est arrivée. Dans les coulisses, les États-Unis ont joué un rôle clé en soutenant le coup d'État, craignant que le Brésil ne s'aligne sur les intérêts soviétiques. Les responsables américains ont fourni une aide secrète à l'armée, la CIA étant impliquée pour faciliter la prise de contrôle. Alors que l'armée prend le contrôle, l'avenir du Brésil reste incertain, et nombreux sont ceux qui s'interrogent sur les effets à long terme sur sa démocratie et sa souveraineté."
 news.1645.a: "La fin de la Quatrième République brésilienne"
 news.1646.t: "[GetNewspaperHeader]La démocratie revient au Brésil"
 news.1646.d: "Il s'agit d'un moment historique pour le Brésil : la démocratie a été rétablie après 21 ans de régime militaire. Aujourd'hui, José Sarney a prêté serment comme président après avoir remporté l'élection indirecte organisée par le collège électoral, marquant le retour officiel à un gouvernement civil. La transition est intervenue après des années de pressions croissantes en faveur de réformes politiques, d'instabilité économique et de protestations généralisées contre le régime militaire. Sarney, qui avait été vice-président sous le dernier président militaire, João Figueiredo, dirigera désormais le pays en tant que premier président démocratiquement élu depuis 1964. Le retour de la démocratie fait suite au processus d'ouverture progressif connu sous le nom de « Distensão », qui a commencé à la fin des années 1970, pour finalement aboutir au mouvement Diretas Já de 1984 appelant à des élections directes. Bien que le régime militaire ait officiellement pris fin, de nombreux défis demeurent alors que le Brésil s'oriente vers le retour à la démocratie et s'efforce de reconstruire les institutions politiques et la confiance dans le gouvernement."
 news.1646.a: "Une cinquième république brésilienne ?"
 news.1647.t: "[GetNewspaperHeader]Le Brésil fait de Brasilia sa capitale nationale"
 news.1647.d: "La construction de Brasilia, la nouvelle capitale du pays, a été achevée et la ville officiellement inaugurée aujourd'hui, une réalisation monumentale pour le Brésil. Après des années de planification et de construction, Brasília est un symbole de modernité et de progrès, conçu par le célèbre architecte Oscar Niemeyer et l'urbaniste Lúcio Costa. La ville, stratégiquement située au centre du pays, vise à promouvoir le développement régional et à réduire la domination des villes côtières comme Rio de Janeiro et São Paulo. En tant que nouvelle capitale, Brasilia abrite désormais le gouvernement fédéral, avec des institutions clés, dont le Palais présidentiel et le Congrès national, situées dans son architecture futuriste. Le déménagement à Brasilia est considéré comme une étape audacieuse vers la décentralisation du pouvoir et la promotion de l'unité nationale, marquant une nouvelle ère pour le Brésil alors que le pays continue de se moderniser et d'étendre son influence sur la scène mondiale."
 news.1647.a: "Une réalisation sans précédent en Amérique du Sud !"
 news.1648.t: "[GetNewspaperHeader]Fernando Collor remporte les élections brésiliennes de 1990"
 news.1648.d: "Fernando Collor de Mello a remporté l'élection présidentielle brésilienne de 1990, battant ses rivaux dotés d'un fort mandat de changement. Collor, représentant le Parti de la reconstruction nationale (PRN), de droite, a fait campagne sur un programme de réforme économique, promettant de lutter contre l'inflation, de réduire la taille de l'État et d'ouvrir l'économie brésilienne aux marchés mondiaux. Sa victoire marque un changement significatif par rapport aux politiques de gauche du passé et reflète une frustration généralisée face aux crises économiques qui ravagent le pays depuis des années. L'appel contestataire de Collor et ses promesses d'action rapide et audacieuse ont trouvé un écho auprès des électeurs, en particulier de la jeune génération avide de changement. En tant que premier président brésilien élu au suffrage direct depuis la dictature militaire, l'investiture de Collor ouvre un nouveau chapitre dans l'histoire démocratique du pays, même si beaucoup restent incertains quant aux défis économiques difficiles qui l'attendent alors qu'il commence à mettre en oeuvre ses ambitieuses réformes."
 news.1648.a: "La Cinquième République brésilienne prospère !"
 news.1649.t: "[GetNewspaperHeader]Carlos Ibáñez del Campo remporte les élections chiliennes de 1952"
 news.1649.d: "Dans une tournure remarquable des événements, Carlos Ibáñez del Campo a remporté l'élection présidentielle chilienne de 1952, assurant ainsi son retour au pouvoir après 17 ans d'absence. Candidat de l'Action Démocratique Indépendante (ADI), Ibáñez a promis de restaurer l'ordre et la stabilité dans un pays aux prises avec des troubles économiques et une instabilité politique. Sa campagne, axée sur la lutte contre la corruption, la mise en oeuvre de réformes sociales et la promotion de l'industrialisation, a trouvé un fort écho auprès des électeurs en quête d'un leadership décisif pour guider le Chili à travers ses difficultés économiques. Il s'agit d'un moment important dans l'histoire politique du Chili, alors qu'Ibáñez, qui a été président de 1927 à 1931, revient au pouvoir dans une période d'incertitude nationale. Avec sa réputation de leadership fort, parfois autoritaire, beaucoup espèrent qu'Ibáñez sera capable de mettre en oeuvre les réformes nécessaires pour revitaliser le pays, même si des questions demeurent quant à sa capacité à unir une nation politiquement divisée."
 news.1649.a: "Félicitations à la plus ancienne démocratie d'Amérique du Sud"
 news.1650.t: "[GetNewspaperHeader]Jorge Alessandri remporte les élections chiliennes de 1958"
 news.1650.d: "Dans une course très disputée, Jorge Alessandri est sorti vainqueur de l'élection présidentielle chilienne de 1958, marquant un changement important dans le paysage politique du pays. Candidat indépendant, Alessandri a fait campagne sur un programme de stabilité économique, de discipline budgétaire et de réduction de l'influence des syndicats. Sa victoire, obtenue avec le fort soutien des électeurs conservateurs et de la classe moyenne, reflète le désir généralisé d'une approche plus pragmatique de la gouvernance face aux défis économiques croissants. Le leadership d'Alessandri promet de se concentrer sur le rétablissement de la santé financière du Chili, en mettant l'accent sur la maîtrise de l'inflation et la promotion de la croissance du secteur privé. Alors qu'il se prépare à prendre ses fonctions, de nombreux Chiliens espèrent que sa politique constante et conservatrice aidera le pays à traverser une période d'incertitude politique et économique, même si son approche pourrait se heurter à la résistance des groupes de gauche."
 news.1650.a: "Mais comment cela affecte-t-il le prix du salpêtre ?"
 news.1651.t: "[GetNewspaperHeader]Eduardo Frei Montalva remporte les élections chiliennes de 1964"
 news.1651.d: "Dans une victoire décisive, Eduardo Frei Montalva a remporté l'élection présidentielle chilienne de 1964, signalant une évolution vers un programme plus progressiste et réformateur. Candidat du Parti chrétien-démocrate (PDC), Frei a fait campagne sur un programme de justice sociale, de réforme agraire et de modernisation économique, en mettant l'accent sur l'amélioration des conditions de vie de la classe ouvrière et la réduction du pouvoir des entreprises étrangères. Sa victoire, obtenue avec un large soutien dans les zones urbaines et rurales, reflète la volonté d'un changement social significatif tout en maintenant la stabilité politique. L'administration de Frei devrait poursuivre des politiques visant à démocratiser l'économie, notamment une nationalisation des industries clés et des réformes agraires, tout en évitant les extrêmes du socialisme ou du communisme. Alors qu'il se prépare à prendre ses fonctions, de nombreux Chiliens espèrent que Frei trouvera un équilibre entre progrès et modération, contribuant ainsi à créer une société plus juste sans mettre en péril les institutions démocratiques du pays."
 news.1651.a: "Mais comment cela affecte-t-il le prix du salpêtre ?"
 news.1652.t: "[GetNewspaperHeader]Salvador Allende remporte les élections chiliennes de 1970"
 news.1652.d: "Lors d'une élection historique et étroitement surveillée, Salvador Allende est sorti vainqueur de la course présidentielle chilienne de 1970, devenant ainsi le premier marxiste à être élu président par des moyens démocratiques en Amérique latine. Candidat pour la coalition de l'Unité populaire (UP), le programme de réforme sociale radicale d'Allende, comprenant la nationalisation des industries clés, la redistribution des terres et la redistribution des richesses, a recueilli le soutien de la classe ouvrière chilienne et de ceux qui prônent des changements économiques et sociaux plus profonds. La victoire d'Allende, malgré les défis des forces conservatrices et une opposition divisée, marque un tournant important pour le Chili, car ses promesses d'une transformation socialiste ont suscité à la fois enthousiasme et peur. Alors qu'il se prépare à prendre ses fonctions, Allende s'est engagé à renforcer la démocratie chilienne tout en poursuivant son programme ambitieux, qui, selon lui, permettra de remédier aux profondes inégalités économiques dans le pays. Cependant, des questions demeurent quant à la manière dont sa politique sera accueillie par les acteurs nationaux et internationaux, en particulier avec les tensions croissantes liées à son programme socialiste."
 news.1652.a: "La première démocratie libérale à élire un marxiste ?"
 news.1653.t: "[GetNewspaperHeader]Coup d'État militaire chilien contre Salvador Allende"
 news.1653.d: "Dans une tournure dramatique et violente des événements, l'armée chilienne a renversé aujourd'hui le gouvernement du président Salvador Allende par un coup d'État, mettant ainsi fin à son règne de trois ans. L'armée, dirigée par le général Augusto Pinochet, a pris le contrôle des principaux bâtiments gouvernementaux et a déclaré la loi martiale dans tout le pays. Allende, qui faisait face à une opposition croissante de la part des secteurs militaire et conservateur en raison de sa politique socialiste, notamment la nationalisation des industries et la réforme agraire, se trouvait apparemment à l'intérieur du palais présidentiel lors de l'assaut. Il a refusé de se rendre et serait mort lors de l'assaut militaire. Le coup d'État fait suite à des mois de troubles politiques, d'instabilité économique et de tensions croissantes entre le gouvernement d'Allende et les forces de l'opposition. Les États-Unis, de plus en plus préoccupés par le programme marxiste d'Allende, auraient offert un soutien secret aux putschistes."
 news.1653.a: "La fin de la plus ancienne démocratie d'Amérique du Sud"
 news.1654.t: "[GetNewspaperHeader]La Constitution de 1980 « légalise » la dictature de Pinochet"
 news.1654.d: "À un moment charnière pour le Chili, le gouvernement militaire dirigé par le général Augusto Pinochet a officiellement approuvé aujourd'hui une nouvelle constitution par le biais d'un plébiscite controversé. La constitution de 1980, rédigée sous supervision militaire, renforce l'autorité du régime de Pinochet tout en promettant un retour à un régime civil en 1989. Le document comprend des dispositions qui garantissent le maintien de l'influence de l'armée dans les affaires politiques, Pinochet restant au pouvoir jusqu'en 1989 et conservant un contrôle significatif sur l'avenir du pays. Le plébiscite, qui a été largement critiqué pour son manque de transparence et d'équité, a montré un soutien massif à la nouvelle constitution, même si les groupes d'opposition ont affirmé que le processus avait été truqué. Même si la Constitution promet une voie vers des élections démocratiques, de nombreux Chiliens et observateurs internationaux la considèrent comme une tentative de l'armée de consolider son contrôle sur le système politique du pays, limitant les pouvoirs des futurs gouvernements et supprimant l'opposition. "
 news.1654.a: "Le Franco sud-américain ?"
 news.1655.t: "[GetNewspaperHeader]La démocratie multipartite rétablie au Chili"
 news.1655.d: "Dans un moment historique pour le Chili, le pays a officiellement rétabli sa démocratie multipartite avec l'investiture aujourd'hui de Patricio Aylwin à la présidence, marquant la fin de 17 ans de dictature militaire sous le général Augusto Pinochet. Aylwin, le candidat de la coalition Concertación de Partidos por la Democracia, a été élu lors des premières élections démocratiques depuis 1973, à la suite d'un processus de transition pacifique qui a débuté par un plébiscite de 1988 rejetant le maintien au pouvoir de Pinochet. Le retour à la démocratie intervient après des années de négociations et de pressions de la part des forces nationales et internationales, Pinochet ayant démissionné de son poste de chef de l'État tout en conservant une influence significative en tant que commandant en chef de l'armée. L'élection d'Aylwin marque le début d'une nouvelle ère pour le Chili, alors que le pays progresse en s'engageant en faveur des droits de l'homme, des libertés politiques et de la reconstruction des institutions démocratiques."
 news.1655.a: "Plus jamais de caudillo chilien"
 news.1656.t: "[GetNewspaperHeader]Eduardo Frei Ruiz-Tagle remporte les élections chiliennes de 1994"
 news.1656.d: "À un moment important pour l'ère post-dictature du Chili, Eduardo Frei Ruiz-Tagle a remporté l'élection présidentielle chilienne de 1994, marquant ainsi la poursuite de la consolidation démocratique du pays. Représentant la Concertación de Partidos por la Democracia, Frei, fils de l'ancien président Eduardo Frei Montalva, a remporté une victoire décisive avec une plateforme axée sur la croissance économique, la justice sociale et le renforcement des institutions démocratiques. Sa victoire intervient à un moment de grand optimisme, alors que le Chili continue de se remettre des années de dictature militaire sous Augusto Pinochet, avec des progrès significatifs réalisés en matière de droits de l'homme, de stabilité économique et de statut international. La victoire de Frei signifie un changement vers une vision politique plus inclusive, puisqu'il s'engage à lutter contre la pauvreté, à améliorer l'éducation et à réduire les inégalités tout en maintenant les politiques économiques qui ont aidé le Chili à prospérer ces dernières années."
 news.1656.a: "Mais comment cela affecte-t-il le prix du salpêtre ?"
 news.1657.t: "[GetNewspaperHeader]Ricardo Lagos remporte les élections chiliennes de 1994"
 news.1657.d: "Ricardo Lagos a remporté l'élection présidentielle chilienne de 1994, marquant un moment historique puisqu'il devient le premier président socialiste du Chili depuis Salvador Allende. Candidat de la Concertación de Partidos por la Democracia, Lagos a fait campagne sur un programme de croissance économique continue, de réforme sociale et d'amélioration de la qualité de vie de tous les Chiliens, en particulier des communautés marginalisées du pays. Sa victoire représente un changement important dans le paysage politique chilien, car il promet de s'appuyer sur les succès économiques du passé tout en s'attaquant aux inégalités sociales qui persistent dans le Chili post-dictature. Lagos, ancien économiste et leader éminent de la lutte contre le régime de Pinochet, hérite d'une nation qui a fait de grands progrès vers la démocratie et la stabilité. Alors qu'il se prépare à prendre ses fonctions, on attend beaucoup que Lagos favorise une société plus inclusive tout en maintenant la solide position économique du Chili sur la scène mondiale. Son élection reflète la maturité de la démocratie chilienne et la capacité d'effectuer une transition pacifique entre les idéologies politiques dans un système démocratique prospère."
 news.1657.a: "Mais comment cela affecte-t-il le prix du salpêtre ?"
 news.1658.t: "[GetNewspaperHeader]Décès d'Eva Perón"
 news.1658.d: "L'Argentine est sous le choc après la mort tragique et soudaine d'Eva Perón, la bien-aimée Première Dame et figure emblématique du paysage politique national. À l'âge de 33 ans, Eva a succombé à un cancer, laissant le pays dévasté par la perte de son champion des droits du travail, du droit de vote des femmes et de la justice sociale. Surnommée affectueusement « Evita », elle était le coeur et l'âme du mouvement péroniste, défendant sans relâche les droits des travailleurs marginalisés. Son décès marque la fin d'une époque, alors que des millions d'Argentins pleurent la perte d'un dirigeant qui était devenu un symbole d'espoir, de compassion et d'autonomisation pour les classes pauvres et ouvrières du pays. Alors que son cortège funèbre parcourt les rues, le chagrin de la nation est palpable et l'avenir de son héritage reste incertain à la suite de cette tragédie nationale."
 news.1658.a: "Le chef spirituel de l'Argentine est parti"
 news.1659.t: "[GetNewspaperHeader]Le général argentin Eduardo Lonardi organise un coup d'État"
 news.1659.d: "Le général Eduardo Lonardi a mené un coup d'État militaire réussi, renversant le président Juan Domingo Perón dans un contexte de mécontentement croissant à l'égard de son régime. Le coup d'État a été déclenché par une instabilité économique croissante, des troubles sociaux croissants et une opposition généralisée de la part de l'Église catholique et des factions conservatrices. La gouvernance de plus en plus autoritaire de Perón, combinée à l'inflation et aux pénuries, a aliéné de nombreuses personnes, y compris les chefs militaires et les alliés traditionnels. Les forces de Lonardi ont rapidement pris le contrôle des principales institutions gouvernementales, invoquant la nécessité de rétablir l'ordre et de résoudre les crises qui ravagent le pays. La junte militaire désormais au pouvoir promet de faire avancer le pays, mais l'avenir reste incertain alors que l'Argentine est aux prises avec ce changement radical de leadership."
 news.1659.a: "Perón a-t-il laissé tomber l'armée ou est-ce eux qui l'ont laissé tomber ?"
 news.1660.t: "[GetNewspaperHeader]L'Argentine rétablit la démocratie et Arturo Frondizi remporte les élections"
 news.1660.d: "Après des années de régime militaire, l'Argentine est officiellement revenue à une gouvernance démocratique avec l'élection d'Arturo Frondizi à la présidence. Frondizi, représentant l'Union Civique Radicale (UCR), a remporté une victoire décisive lors d'élections historiques qui marquent le premier vote libre et équitable du pays depuis le coup d'État de 1955 qui a renversé Juan Perón. Son programme promet de restaurer la stabilité politique et de relever les défis économiques de l'Argentine, notamment l'inflation et le chômage. La victoire de Frondizi représente un tournant vers des institutions démocratiques après des années de contrôle militaire et d'instabilité politique. Bien que sa victoire laisse entrevoir l'espoir d'une nouvelle ère, le chemin à parcourir reste incertain alors que Frondizi est confronté à la tâche d'unir une nation divisée et de naviguer dans le paysage politique complexe laissé par des années d'intervention militaire."
 news.1660.a: "Une démocratie libre et juste où le péronisme est interdit ?"
 news.1661.t: "[GetNewspaperHeader]Arturo Umberto Illia remporte les élections argentines de 1963"
 news.1661.d: "Dans un changement capital pour le paysage politique argentin, Arturo Umberto Illia est sorti vainqueur de l'élection présidentielle de 1963, marquant le retour à une gouvernance démocratique après des années d'instabilité. Illia, représentant l'Union civique radicale (UCR), a remporté un mandat clair, promettant de rétablir l'ordre politique, de résoudre les problèmes sociaux et de revitaliser l'économie du pays. Sa victoire marque une étape importante dans le renouveau démocratique de l'Argentine, alors que le pays cherche à se remettre des années d'intervention militaire et de troubles politiques qui ont suivi le coup d'État de 1955. Le programme d'Illia se concentre sur la justice sociale, les réformes économiques et l'unité nationale, offrant l'espoir d'un avenir plus stable et plus inclusif, même si les défis à venir restent importants alors que l'Argentine s'efforce d'apaiser de profondes divisions politiques."
 news.1661.a: "Je suppose que l'armée argentine est enfin sous contrôle"
 news.1662.t: "[GetNewspaperHeader]Juan Carlos Onganía mène le coup d'État des forces armées argentines"
 news.1662.d: "Le général Juan Carlos Onganía a mené un coup d'État militaire, renversant le gouvernement du président Arturo Umberto Illia dans un contexte de mécontentement croissant à l'égard de son administration. Le coup d'État intervient après une agitation croissante autour de la politique économique d'Illia, notamment sa décision de geler les salaires et de réduire les dépenses publiques, considérées comme impopulaires dans une période de stagnation économique et d'inflation. De plus, sa gestion des grèves et des tensions avec de puissants intérêts commerciaux et syndicaux a encore aliéné des secteurs clés de la société. La junte militaire, désormais aux commandes, a justifié le coup d'État comme étant nécessaire pour rétablir l'ordre, remédier à l'instabilité économique et éliminer l'impasse politique. Onganía a promis de mettre en oeuvre des réformes radicales mais a suspendu les droits constitutionnels, marquant un retour à un régime militaire après seulement quelques années de gouvernance civile."
 news.1662.a: "Ce sera sûrement la dernière junte argentine"
 news.1663.t: "[GetNewspaperHeader]L'Argentine rétablit les élections et la victoire d'Héctor José Cámpora"
 news.1663.d: "Après des années de régime militaire, l'Argentine a rétabli une gouvernance démocratique avec l'élection d'Héctor José Cámpora à la présidence. Cámpora, représentant du Parti Justicialiste, a remporté une victoire décisive, marquant le retour du péronisme au pouvoir. Son triomphe fait suite à une période de bouleversements politiques et de dictature militaire, et son programme promet d'apporter l'unité nationale, la justice sociale et une nouvelle ère de stabilité. L'élection de Cámpora est largement considérée comme un précurseur du retour éventuel de l'ancien président Juan Domingo Perón en Argentine, et sa campagne s'est concentrée sur la lutte contre les inégalités économiques et l'allégement du fardeau de la classe ouvrière argentine. Même si sa victoire ouvre un nouveau chapitre plein d'espoir, il reste des défis à relever pour surmonter les profondes divisions et les difficultés économiques du pays, alors que Cámpora prend ses fonctions avec de grandes attentes et le poids du passé turbulent de l'Argentine."
 news.1663.a: "Le péronisme est bien vivant en Argentine"
 news.1664.t: "[GetNewspaperHeader]Juan Perón remporte les élections argentines de 1974"
 news.1664.d: "Après près de deux décennies d'exil, Juan Domingo Perón a triomphé à l'élection présidentielle de 1974, marquant son retour spectaculaire au pouvoir. Perón, représentant du Parti Justicialiste, a remporté une victoire décisive, réaffirmant son influence en tant que figure centrale de la politique argentine. Sa victoire fait suite à la brève présidence d'Héctor Cámpora, qui a démissionné, une décision considérée comme une étape vers le retour de Perón. Les élections de 1974 marquent le retour du péronisme au premier plan de la vie politique du pays, Perón promettant de lutter contre l'instabilité économique, l'inflation et les troubles sociaux. Même si sa victoire est considérée comme un moment d'espoir pour nombre de ses partisans, l'Argentine reste profondément divisée et Perón sera confronté à d'immenses défis pour faire face aux crises politiques et économiques actuelles du pays alors qu'il reprend ses fonctions."
 news.1664.a: "Cela a pris près de deux décennies, mais il est de retour"
 news.1665.t: "[GetNewspaperHeader]Décès de Juan Perón, Isabel Perón inaugurée en Argentine"
 news.1665.d: "L'Argentine est en deuil suite au décès du président Juan Domingo Perón, décédé aujourd'hui à l'âge de 78 ans. Sa mort marque la fin d'une époque, laissant la nation dans le choc et l'incertitude. Conformément à la Constitution, la veuve de Perón, Isabel Perón, a été nommée nouvelle présidente du pays, devenant ainsi la première femme présidente de l'histoire des Amériques. Isabel Perón, qui avait été vice-présidente sous son mari, est désormais confrontée à la lourde tâche de diriger le pays à travers une période de profonde instabilité politique et économique. La nation est profondément divisée, avec des défis économiques, des troubles sociaux croissants et des tensions au sein du mouvement péroniste lui-même. Alors qu'Isabel Perón prend ses fonctions, l'avenir de l'Argentine reste incertain et nombreux sont ceux qui se demandent comment elle va gérer les complexités de son nouveau rôle après le décès de son mari."
 news.1665.a: "Est-ce qu'elle ternit le nom de son mari ?"
 news.1666.t: "[GetNewspaperHeader]Jorge Rafael Videla prépare un coup d'État en Argentine"
 news.1666.d: "Dans une action rapide et décisive, le général Jorge Rafael Videla a mené un coup d'État militaire qui a renversé la présidente Isabel Perón, mettant ainsi fin brutalement au gouvernement démocratique. Le coup d'État fait suite à des troubles et à une instabilité croissante, marqués par une escalade de la violence, des crises économiques et des troubles politiques sous la direction d'Isabel Perón. Videla, soutenu par les forces armées, a déclaré la création d'une junte militaire, promettant de rétablir l'ordre et de résoudre les problèmes croissants de la nation. Les putschistes invoquent la nécessité de réprimer le terrorisme de gauche et de lutter contre le désordre social croissant, qu'ils imputent à l'administration précédente. Alors que l'armée prend le contrôle, l'Argentine se prépare à un avenir incertain, avec la crainte d'une répression accrue et d'un régime autoritaire."
 news.1666.a: "L'Argentine, à nouveau une dictature militaire"
 news.1667.t: "[GetNewspaperHeader]Videla a cédé le pouvoir à Roberto Viola en Argentine"
 news.1667.d: "Dans un changement politique surprenant, le général Jorge Rafael Videla a officiellement cédé le pouvoir au général Roberto Viola, qui a été nommé nouveau président de l'Argentine. Videla, qui dirigeait la dictature militaire depuis 1976, a démissionné face à une pression interne croissante et à une surveillance internationale croissante des violations des droits humains commises sous son régime. Viola, ancien chef de l'armée argentine, prend le pouvoir à un moment où le pays est aux prises avec des difficultés économiques, des troubles politiques et une répression persistante. Même si le départ de Videla marque un changement significatif au sein du leadership, nombreux sont ceux qui restent sceptiques quant à la capacité de la junte militaire à restaurer la stabilité ou à évoluer vers la démocratie. Alors que Viola prend ses fonctions, l'avenir de la nation reste incertain, avec de fortes tensions entre le gouvernement militaire et les appels au retour à un régime civil."
 news.1667.a: "Est-ce que quelque chose a changé ?"
 news.1668.t: "[GetNewspaperHeader]L'Argentine rétablit les élections et Raúl Alfonsín prête serment"
 news.1668.d: "Après près de huit ans de dictature militaire, l'Argentine est officiellement revenue à la démocratie avec l'investiture de Raúl Alfonsín comme président. Alfonsín, représentant de l'Union Civique Radicale (UCR), a remporté une victoire historique lors des premières élections libres du pays depuis la chute de la junte militaire. Son investiture marque la fin d'une sombre période de régime autoritaire, caractérisée par des violations des droits de l'homme et des troubles économiques. En tant que nouveau président, Alfonsín s'est engagé à restaurer l'État de droit, à relever les profonds défis sociaux et économiques du pays et à demander des comptes aux responsables des atrocités du passé. Son élection est considérée comme une lueur d'espoir pour une nation désireuse de guérir et de se reconstruire après des années de répression. L'avenir démocratique de l'Argentine étant désormais entre ses mains, Alfonsín est confronté à la tâche difficile de surmonter les divisions politiques et de guider le pays vers la stabilité et la reprise."
 news.1668.a: "Un domino parmi les dictatures sud-américaines..."
 news.1669.t: "[GetNewspaperHeader]Carlos Menem remporte les élections argentines de 1989"
 news.1669.d: "Dans un changement radical pour le paysage politique argentin, Carlos Menem est sorti vainqueur de l'élection présidentielle de 1989, ouvrant ainsi un nouveau chapitre pour la nation. Menem, représentant du Parti Justicialiste, a remporté une victoire décisive après une campagne qui promettait des réformes économiques et une rupture avec les politiques péronistes traditionnelles du passé. Sa victoire intervient à un moment de grave instabilité économique, avec une inflation galopante, un chômage qui monte en flèche et un mécontentement généralisé du public à l'égard du statu quo. Le programme de Menem se concentre sur la libéralisation économique, les réformes du marché et la privatisation pour stabiliser l'économie en difficulté du pays. Alors qu'il prend ses fonctions, Menem est confronté au défi de taille de traverser la profonde crise financière argentine tout en unifiant une nation lasse de plusieurs années de troubles économiques. Sa victoire marque le début d'une nouvelle ère pour l'Argentine, avec de grandes attentes en matière de changement et de reprise."
 news.1669.a: "Un péronisme édulcoré ?"
 news.1670.t: "[GetNewspaperHeader]Fernando de la Rúa remporte les élections argentines de 1999"
 news.1670.d: "Fernando de la Rúa a remporté l'élection présidentielle de 1999, inaugurant une nouvelle ère de gouvernance en Argentine. De la Rúa, représentant de l'Union Civique Radicale (UCR), a remporté une victoire sur un programme axé sur la restauration de la stabilité économique, la lutte contre la corruption et le renforcement des institutions démocratiques. Sa victoire intervient après des années de volatilité politique et économique, alors que l'Argentine est aux prises avec l'inflation, un chômage élevé et un mécontentement public croissant. L'élection de De la Rúa est considérée comme un signe d'espoir pour ceux qui recherchent un retour à la stabilité et à la responsabilité au sein du gouvernement. Alors qu'il prend ses fonctions, le nouveau président est confronté à la tâche monumentale de gérer l'économie en difficulté de l'Argentine, de mettre en oeuvre des réformes structurelles et d'unir un pays encore aux prises avec l'héritage des crises précédentes. Sa présidence marque un moment critique alors que la nation cherche à se reconstruire et à aller de l'avant."
 news.1670.a: "La crise économique sans fin en Argentine..."
 news.1671.t: "[GetNewspaperHeader]Néstor Kirchner remporte les élections argentines de 2003"
 news.1671.d: "Néstor Kirchner est sorti vainqueur de l'élection présidentielle de 2003, marquant un tournant pour l'Argentine après une période de graves troubles économiques et d'instabilité politique. Kirchner, représentant le Parti Justicialiste, a remporté une victoire décisive après la crise financière dévastatrice du pays de 1998 à 2002, qui avait laissé des millions de personnes dans la pauvreté et déclenché des troubles sociaux généralisés. La plateforme de Kirchner se concentre sur la reprise économique, la justice sociale et la réduction de l'influence des institutions financières internationales. Sa victoire est considérée comme un mandat visant à restaurer la stabilité et à reconstruire l'économie argentine brisée, en mettant fortement l'accent sur la réduction de la pauvreté et la stimulation des industries nationales. Alors qu'il prend ses fonctions, Kirchner est confronté au défi de rétablir la crédibilité de l'Argentine sur la scène mondiale tout en s'attaquant aux profondes inégalités nationales."
 news.1671.a: "L'Argentine retrouvera-t-elle sa crédibilité financière ?"
 news.1672.t: "[GetNewspaperHeader]Cristina Fernández de Kirchner remporte les élections argentines de 2007"
 news.1672.d: "Cristina Fernández de Kirchner a remporté l'élection présidentielle de 2007, devenant ainsi la première femme de l'histoire de l'Argentine à être élue présidente. Représentant le Parti Justicialiste, Fernández de Kirchner a triomphé avec un large mandat, héritant de l'héritage politique de son mari, Néstor Kirchner, qui a été président de 2003 à 2007. Son programme met l'accent sur la croissance économique continue, la protection sociale et l'engagement à renforcer la souveraineté et l'indépendance de l'Argentine sur la scène mondiale. Avec sa victoire, elle promet de s'appuyer sur la politique de son mari, en se concentrant sur la réduction de la pauvreté, la création d'emplois et le maintien de la stabilité économique de l'Argentine face aux défis mondiaux. Alors qu'elle prend ses fonctions, les attentes sont élevées quant à son leadership dans la résolution des problèmes nationaux et internationaux, notamment l'inflation, le chômage et le rôle de l'Argentine dans les affaires latino-américaines."
 news.1672.a: "Vivre dans l'ombre de son mari, un peu comme la dernière femme présidente"
 news.1673.t: "[GetNewspaperHeader]Michelle Bachelet remporte les élections chiliennes de 2006"
 news.1673.d: "Michelle Bachelet est entrée dans l'histoire en remportant l'élection présidentielle chilienne de 2006, devenant ainsi la première femme présidente du pays. Représentant le Parti socialiste et la coalition Concertación, Bachelet a triomphé avec une plateforme axée sur la justice sociale, la réforme de l'éducation, la réduction de la pauvreté et l'amélioration des soins de santé. Sa victoire est considérée comme une étape importante dans l'histoire démocratique moderne du Chili, reflétant la transition continue du pays de l'héritage de sa dictature militaire vers une société plus inclusive et progressiste. En prenant ses fonctions, Bachelet hérite d'une économie en croissance, mais fait face à des défis pour lutter contre les inégalités, renforcer les programmes sociaux et garantir que tous les Chiliens bénéficient de la prospérité économique du pays. Sa présidence représente une nouvelle ère de leadership, et nombreux sont ceux qui espèrent qu'elle poursuivra le travail du gouvernement de Concertación tout en répondant aux besoins urgents des populations défavorisées du pays."
 news.1673.a: "Socialisme du XXIe siècle"
 news.1674.t: "[GetNewspaperHeader]Adolfo Ruiz Cortines remporte les élections mexicaines de 1952"
 news.1674.d: "Adolfo Ruiz Cortines, le candidat du Parti révolutionnaire institutionnel (PRI), a remporté la victoire à l'élection présidentielle mexicaine, confirmant ainsi la domination politique du parti. Les résultats officiels confirment sa victoire sur ses rivaux de l'opposition, même si les critiques dénoncent des irrégularités électorales. L'ancien gouverneur de Veracruz, âgé de 62 ans, a fait campagne sur la lutte contre la corruption et la stabilité économique, gagnant les éloges du président sortant Miguel Alemán. Cortines, qui doit prendre ses fonctions le 1er décembre, est confronté à des défis tels que l'inflation et la pauvreté rurale. Alors que les observateurs internationaux reconnaissent prudemment les résultats, les opposants nationaux exigent une plus grande transparence alors que le Mexique se prépare à une nouvelle administration dirigée par le PRI."
 news.1674.a: "Félicitations pour la séquence de 23 années de victoires consécutives du PRI !"
 news.1675.t: "[GetNewspaperHeader]Adolfo López Mateos remporte les élections mexicaines de 1958"
 news.1675.d: "Adolfo López Mateos, candidat du Parti révolutionnaire institutionnel (PRI) au pouvoir, a été déclaré vainqueur de l'élection présidentielle mexicaine, une victoire largement attendue. L'ancien ministre du Travail de 48 ans, connu pour son discours charismatique et sa rhétorique progressiste, a obtenu une majorité écrasante, maintenant ainsi la mainmise ininterrompue du PRI sur le pouvoir. Sa campagne mettait l'accent sur les droits des travailleurs, l'expansion de l'éducation et le nationalisme économique, trouvant un écho auprès de larges secteurs de la population. Alors que les partis d'opposition ont de nouveau soulevé des allégations de manipulation électorale, les résultats ont été rapidement ratifiés. Le président sortant Adolfo Ruiz Cortines a salué son successeur comme un « homme du peuple », et López Mateos devrait adopter une position plus affirmée en matière de réformes intérieures et de politique étrangère lorsqu'il prendra ses fonctions le 1er janvier."
 news.1675.a: "Félicitations pour la séquence de 29 années de victoire consécutive du PRI !"
 news.1676.t: "[GetNewspaperHeader]Gustavo Díaz Ordaz remporte les élections mexicaines de 1964"
 news.1676.d: "Gustavo Díaz Ordaz, le candidat discipliné et dur du PRI au pouvoir, a revendiqué la victoire à l'élection présidentielle mexicaine, poursuivant ainsi le règne ininterrompu de son parti. L'ancien ministre de l'Intérieur de 53 ans, connu pour son attitude sévère et sa position intransigeante en matière d'ordre, a gagné avec une large marge, comme on pouvait s'y attendre, au milieu de campagnes d'opposition modérées. Son discours de victoire a mis l'accent sur \"la stabilité et le progrès\", même si les critiques préviennent que son administration pourrait adopter une approche autoritaire à l'égard de la dissidence. Le président sortant López Mateos a approuvé son successeur comme un « gardien des institutions », tandis que les groupes syndicaux et étudiants attendent avec prudence l'investiture de Díaz Ordaz le 1er janvier. Alors que le Mexique connaît une croissance économique relative mais que les tensions sociales laissent place à des tensions sociales latentes, le nouveau président fait face à des défis imminents pour le système politique étroitement contrôlé par le PRI."
 news.1676.a: "Félicitations pour la séquence de 35 années de victoires consécutives du PRI !"
 news.1677.t: "[GetNewspaperHeader]Luis Echeverría remporte les élections mexicaines de 1970"
 news.1677.d: "Luis Echeverría Álvarez, candidat controversé du PRI et ancien secrétaire d'État à l'Intérieur lors du massacre de Tlatelolco en 1968, a été élu prochain président du Mexique à l'issue d'un vote étroitement contrôlé. L'homme politique de 48 ans, faisant campagne sur les promesses d'\"ouverture démocratique\" et de solidarité avec le tiers-monde, a obtenu la victoire écrasante habituelle du PRI malgré le scepticisme croissant de l'opinion publique. Alors que les résultats officiels font état d'un glissement de terrain, des observateurs indépendants notent un taux de participation électorale record et des manifestations isolées contre l'emprise autoritaire du parti au pouvoir. Le discours de victoire d'Echeverría a adopté un ton conciliant, promettant de répondre au mécontentement des jeunes et des travailleurs, mais beaucoup restent prudents étant donné son implication directe dans la répression violente des manifestations étudiantes deux ans auparavant."
 news.1677.a: "Félicitations pour la séquence de 41 années de victoires consécutives du PRI !"
 news.1678.t: "[GetNewspaperHeader]José López Portillo remporte les élections mexicaines de 1976"
 news.1678.d: "José López Portillo, 56 ans, successeur du président sortant Echeverría, a remporté l'élection présidentielle mexicaine en tant que candidat unique, ce qui constitue la première élection incontestée depuis la création du PRI. L'ancien ministre des Finances, héritier d'une économie frappée par l'inflation et la dévaluation du peso, s'est engagé à \"défendre le peso comme un chien\" tout en promettant de vastes programmes sociaux. Les partis d'opposition n'ayant pas réussi à désigner de candidat, l'élection est devenue une simple formalité, suscitant les critiques de mouvements réformateurs de plus en plus nombreux. Le passé technocratique de López Portillo laisse espérer une reprise économique, mais les sceptiques se demandent s'il peut prendre ses distances avec l'administration troublée de son prédécesseur."
 news.1678.a: "Félicitations pour la séquence de 47 années de victoires consécutives du PRI !"
 news.1679.t: "[GetNewspaperHeader]Miguel de la Madrid remporte les élections mexicaines de 1982"
 news.1679.d: "Miguel de la Madrid, candidat du PRI âgé de 47 ans et ancien ministre du Budget, a été élu prochain président du Mexique au milieu de la pire crise économique que le pays ait connue depuis des décennies. Face à une inflation galopante, à l'effondrement du peso et à une dette extérieure massive, de la Madrid a fait campagne sur des promesses de « renouveau moral » et d'austérité, s'engageant à lutter contre la corruption et à rationaliser les dépenses publiques. Sa victoire, bien qu'attendue, intervient alors que la confiance du public dans le parti au pouvoir vacille suite à la désastreuse nationalisation des banques de López Portillo et à la récente dévaluation de la monnaie. Les partis d'opposition, même s'ils ont gagné peu de terrain, n'ont pas été en mesure de défier de manière significative la machine politique du PRI."
 news.1679.a: "Félicitations pour la séquence de 53 années de victoire consécutive du PRI !"
 news.1680.t: "[GetNewspaperHeader]Carlos Salinas de Gortari remporte les élections mexicaines de 1988"
 news.1680.d: "Carlos Salinas de Gortari, candidat du PRI âgé de 40 ans et architecte de la modernisation économique du Mexique, a été déclaré président élu à l'issue d'une élection entachée de nombreuses allégations de fraude. Alors que le système informatisé de dépouillement des votes « tombait en panne » - pour reprendre quelques heures plus tard avec Salinas confortablement devant - les candidats de l'opposition Cuauhtémoc Cárdenas et Manuel Clouthier ont dénoncé ce qu'ils ont appelé « le crime parfait ». Le technocrate formé à Harvard hérite désormais d'une nation polarisée entre ses promesses de réforme néolibérale et ses exigences croissantes en faveur d'un changement démocratique. Alors que la légitimité du PRI est remise en question et que la crise de la dette mexicaine menace toujours, Salinas est confronté au double défi de mettre en oeuvre des ajustements économiques douloureux tout en contenant un scepticisme public sans précédent."
 news.1680.a: "Félicitations pour la séquence de 59 années de victoires consécutives du PRI !"
 news.1681.t: "[GetNewspaperHeader]Ernesto Zedillo remporte les élections mexicaines de 1994"
 news.1681.d: "Ernesto Zedillo, candidat du PRI âgé de 42 ans et ancien ministre de l'Éducation, a été élu président du Mexique lors d'élections éclipsées par la violence politique et l'incertitude économique. Candidat surprise après l'assassinat de Luis Donaldo Colosio, Zedillo l'a emporté avec 50,2% des voix - la plus faible victoire du PRI en 65 ans de règne - face aux fortes contestations de Diego Fernández de Cevallos du PAN et de Cuauhtémoc Cárdenas du PRD. Les observateurs internationaux ont déclaré que le processus électoral était le plus propre jamais organisé au Mexique, même si les partis d'opposition ont allégué des irrégularités persistantes. Ayant pris ses fonctions le 29 décembre au milieu de la crise financière de « l'erreur de décembre », l'économiste formé à Yale fait face à des pressions immédiates pour stabiliser le peso tout en répondant aux demandes d'une véritable réforme démocratique. L'ascension inattendue de Zedillo marque à la fois une rupture technique avec le passé autoritaire du PRI et ce qui pourrait marquer le début de sa fin."
 news.1681.a: "Félicitations pour la séquence de 65 années de victoires consécutives du PRI !"
 news.1682.t: "[GetNewspaperHeader]Vicente Fox remporte les élections mexicaines de 2000"
 news.1682.d: "Dans un moment décisif pour la démocratie mexicaine, Vicente Fox, du parti de centre-droit PAN, a battu le PRI au pouvoir, mettant ainsi fin à 71 ans de règne ininterrompu. L'ancien dirigeant de Coca-Cola et gouverneur de Guanajuato, âgé de 58 ans, a obtenu 43 % des voix, triomphant de Francisco Labastida du PRI (36 %) et de Cuauhtémoc Cárdenas du PRD (17 %). La campagne de Fox « Le changement arrive » a capitalisé sur le mécontentement généralisé face à la corruption et à la stagnation économique, mobilisant une participation électorale record. La reconnaissance précoce par le président Zedillo de la victoire de Fox a marqué une transition pacifique sans précédent, le PRI reconnaissant sa défaite pour la première fois. L'éleveur charismatique devenu homme politique est désormais confronté à la tâche ardue de gouverner sans majorité au Congrès, tout en répondant à des attentes extrêmement élevées en matière de réforme lorsqu'il prendra ses fonctions le 1er janvier. Le Mexique s'ouvre aujourd'hui à une nouvelle ère politique."
 news.1682.a: "La fin du parti unique au Mexique"
 news.1683.t: "[GetNewspaperHeader]Felipe Calderón remporte les élections mexicaines de 2006"
 news.1683.d: "Felipe Calderón, du PAN, a été déclaré président élu du Mexique à l'issue de la bataille électorale la plus serrée de l'histoire du pays, battant son rival de gauche Andrés Manuel López Obrador par seulement 0,56 %, soit seulement 243 934 voix. L'ancien ministre de l'Energie de 43 ans, qui a fait campagne sur des promesses de stabilité économique et une ligne dure contre le crime organisé, est confronté à des défis immédiats alors que López Obrador rejette les résultats et appelle à des manifestations de masse. La validation unanime du vote par le Tribunal électoral fédéral après un recomptage partiel n'a guère contribué à apaiser les tensions dans une nation polarisée. La victoire de Calderón maintient l'emprise du PAN sur Los Pinos, mais avec un soutien du Congrès diminué, ce qui complique sa capacité à gouverner lorsqu'il prendra ses fonctions le 1er janvier. Alors que des milliers de personnes défilent à Mexico pour exiger un recomptage complet, le technocrate conservateur hérite non seulement de la présidence, mais d'une crise de légitimité qui menace d'éclipser son administration avant qu'elle ne commence."
 news.1683.a: "Pour avoir passé 70 ans dans l'opposition, ils semblent être les mêmes"
 news.1684.t: "[GetNewspaperHeader]Le Pérou rétablit les élections et la victoire de Manuel Prado Ugarteche"
 news.1684.d: "Dans le cadre d'un rétablissement historique du gouvernement constitutionnel, Manuel Prado Ugarteche a été élu président du Pérou, marquant la fin de huit années de régime militaire sous le général Manuel A. Odría. Les résultats officiels confirment la victoire décisive du Prado, obtenue grâce à une alliance avec le parti APRA, autrefois interdit, de Víctor Raúl Haya de la Torre, signalant une réconciliation politique remarquable. Le banquier de 68 ans et ancien président (1939-1945) a fait campagne sur des promesses de stabilité économique et de libertés démocratiques, faisant appel à une nation lassée de la dictature mais divisée par des tensions idéologiques. Alors que l'armée a renoncé au pouvoir de manière pacifique, les observateurs notent que l'administration de Prado est confrontée à des défis immédiats - depuis l'apaisement de ses improbables alliés de l'APRA jusqu'à la lutte contre l'agitation sociale croissante et une économie en difficulté. Le transfert pacifique du pouvoir a été salué internationalement comme une victoire pour la démocratie en Amérique latine, même si de nombreux Péruviens attendent la preuve que cette trêve politique durement gagnée peut apporter un réel changement."
 news.1684.a: "Une surprise, bien sûr"
 news.1685.t: "[GetNewspaperHeader]La junte militaire organise un coup d'État lors des élections péruviennes de 1962"
 news.1685.d: "La fragile démocratie péruvienne a été brisée tôt ce matin lorsque les forces armées, dirigées par le général Ricardo Pérez Godoy, ont pris le contrôle du gouvernement et annulé l'élection présidentielle contestée du mois dernier. Des chars roulaient dans les rues de Lima tandis que la junte militaire dissolvait le Congrès, suspendait la constitution et déclarait un « gouvernement patriotique de reconstruction ». Le coup d'État intervient après des semaines d'escalade des tensions suite à des élections non concluantes qui ont laissé Víctor Raúl Haya de la Torre (APRA), Fernando Belaúnde Terry (Acción Popular) et l'ancien dictateur Manuel Odría dans une impasse à trois, sans qu'aucun n'obtienne la marge d'un tiers requise pour la victoire. Invoquant une « fraude électorale généralisée » et un « échec du leadership civil », les généraux ont promis de nettoyer la politique et d'organiser de nouvelles élections, sans toutefois donner de calendrier. Le tribunal électoral évincé était sur le point de transmettre la décision au Congrès, où des accords en coulisses menaçaient de décider de la présidence. Washington et plusieurs capitales latino-américaines ont condamné la prise de pouvoir, tandis que les partisans de l'APRA et de Belaúnde jurent de résister. Alors que le Pérou se réveille face à la loi martiale, le spectre d'un régime militaire prolongé plane sur une nation qui a émergé il y a à peine huit ans de la dictature d'Odría."
 news.1685.a: "Un coup d'État au Pérou ? Qui aurait pu s'attendre à cela ?"
 news.1686.t: "[GetNewspaperHeader]Le Pérou rétablit les élections, victoire de Fernando Belaúnde Terry"
 news.1686.d: "Le Pérou est revenu à la règle constitutionnelle alors que l'architecte réformateur Fernando Belaúnde Terry a revendiqué une victoire présidentielle décisive lors des premières élections libres du pays depuis que l'armée a annulé le vote contesté de l'année dernière. Le Conseil des élections nationales a confirmé que le parti Acción Popular de Belaúnde a remporté 39 % des suffrages, battant Víctor Raúl Haya de la Torre de l'APRA et la coalition UNO de Manuel Odría, un rejet de l'ancien ordre politique. La transition pacifique marque la fin d'une junte « corrective » de douze mois dirigée par le général Nicolás Lindley, qui a honoré sa promesse de restaurer un gouvernement civil après la turbulente crise électorale de 1962. Belaúnde, dont la campagne populiste a parcouru tout le pays en promettant une réforme agraire et le développement des infrastructures, est désormais confronté à la lourde tâche de gouverner avec un Congrès fracturé. Les observateurs internationaux ont salué la transparence de l'élection, un contraste frappant avec l'annulation de l'élection de l'année dernière. Alors que des partisans en liesse envahissaient la Plaza de Armas de Lima en scandant \"¡El Pueblo lo eligió!\", le président élu s'est engagé à unir le Pérou derrière son plan de développement \"Marche vers les Andes\" tout en respectant les institutions démocratiques - une réprimande subtile du rôle récurrent de l'armée dans la politique."
 news.1686.a: "La menace d'un nouveau coup d'État est imminente..."
 news.1687.t: "[GetNewspaperHeader]Juan Velasco Alvarado organise un coup d'État au Pérou"
 news.1687.d: "Dans un assaut dramatique avant l'aube, l'armée péruvienne dirigée par le général Juan Velasco Alvarado a destitué le président Fernando Belaúnde Terry, dissolvant le Congrès et suspendant la constitution dans ce que la junte appelle une transformation « révolutionnaire » de la nation. Les troupes armées ont pris d'assaut le Palais du Gouvernement et pris le contrôle d'installations clés à Lima, notamment des stations de radio et de l'aéroport international, alors que Belaúnde - dont le gouvernement élu venait d'entrer dans sa cinquième année - était escorté de force vers l'exil. Le coup d'État fait suite à des semaines de tensions croissantes entre les dirigeants militaires et civils à propos de la gestion par Belaúnde d'un contrat pétrolier controversé avec la société américaine International Petroleum Company (IPC). Dans une proclamation enflammée diffusée dans tout le pays, Velasco a dénoncé « l'abandon humiliant de la dignité nationale » et s'est engagé à récupérer les ressources naturelles du Pérou pour son peuple. Le nouveau gouvernement révolutionnaire des forces armées a déclaré l'état d'urgence et imposé la censure de la presse, tout en promettant une réforme agraire radicale et un nationalisme économique. Cette éviction marque le tournant politique le plus brutal qu'ait connu le Pérou depuis la crise de 1962, avec des officiers de gauche se positionnant désormais comme les champions des pauvres contre ce qu'ils appellent la « démocratie oligarchique ». Washington a exprimé ses « graves inquiétudes » face à cette prise de pouvoir, tandis que les pays du bloc soviétique ont accueilli avec prudence cette évolution. Alors que les chars patrouillent dans les rues de Lima, la nation s'éveille à une nouvelle ère de régime militaire aux ambitions révolutionnaires - et aux conséquences incertaines."
 news.1687.a: "Une junte pro-indigène et ouvrière ?"
 news.1688.t: "[GetNewspaperHeader]Le général Bermúdez organise un contre-coup d'État de droite au Pérou"
 news.1688.d: "Le « gouvernement révolutionnaire » autoproclamé du Pérou a été renversé par sa propre armée lorsque le général Francisco Morales Bermúdez a pris le pouvoir ce matin lors d'un coup d'État interne soigneusement orchestré, mettant fin au règne radical de sept ans du président malade Juan Velasco Alvarado. Des unités blindées ont encerclé les principaux bâtiments gouvernementaux avant le lever du soleil tandis que les troupes loyalistes se sont retirées sans résistance, marquant un renversement stupéfiant pour la révolution de 1968 qui promettait autrefois de transformer la société péruvienne. L'ancien ministre des Finances, à la voix douce, apparaissant en grand uniforme à la télévision nationale, a déclaré que la « première phase » du régime militaire était terminée et a promis un « processus d'institutionnalisation » pour restaurer un gouvernement civil. Derrière cette rhétorique mesurée se cache un virage décisif vers la droite : Bermúdez a immédiatement annoncé la suspension des réformes agraires controversées de Velasco et a signalé son ouverture aux investissements étrangers, tout en maintenant le contrôle de la junte. Le coup d'État a culminé pendant des mois de manoeuvres en coulisses alors que la crise économique et la détérioration de la santé de Velasco fracturaient les forces armées. Washington et les créanciers internationaux ont tranquillement accueilli ce changement, espérant une stabilisation après des années d'expropriations et de tensions diplomatiques. Les groupes de gauche ont dénoncé la « trahison de la révolution », tandis que les chefs d'entreprise célébraient prudemment ce qu'ils appelaient « le retour de la raison »."
 news.1688.a: "La porte tournante des juntes sud-américaines"
 news.1689.t: "[GetNewspaperHeader]Le Pérou rétablit les élections, Terry réélu"
 news.1689.d: "Douze ans après son éviction par un coup d'État militaire, Fernando Belaúnde Terry a reconquis la présidence du Pérou lors d'élections historiques marquant le plein retour du pays à un régime constitutionnel. L'architecte et homme d'État de 67 ans a remporté la victoire avec 45 % des voix, battant ses rivaux de gauche et Armando Villanueva de l'APRA, dans un rejet décisif du régime militaire et du socialisme révolutionnaire. Les bureaux de vote ont débordé d'électeurs alors que le Pérou a organisé ses premières élections libres depuis 1963, la transition pacifique orchestrée par le président sortant Francisco Morales Bermúdez, tenant sa promesse de 1975 de restaurer un gouvernement civil. Le parti Acción Popular de Belaúnde a également obtenu une majorité au Congrès, renforçant ainsi sa promesse de relancer le programme de développement interrompu « Marche vers les Andes » tout en respectant l'entreprise privée - un changement radical par rapport aux nationalisations de l'ère Velasco. Les observateurs internationaux ont déclaré que le processus électoral était le plus propre du Pérou depuis des décennies, les anciens membres de la junte étant visiblement absents de la vue du public. Alors que des feux d'artifice illuminaient l'horizon de Lima, le président élu s'est engagé à réconcilier une nation fracturée par douze années de régime militaire : « Aujourd'hui, nous enterrons les coups d'État pour toujours. » Washington et les capitales européennes ont immédiatement salué le résultat, voyant dans la démocratie modérée de Belaúnde un rempart régional contre l'autoritarisme militaire et la révolution d'inspiration cubaine."
 news.1689.a: "Sa politique libérale sauvera-t-elle l'économie défaillante du Pérou ?"
 news.1690.t: "[GetNewspaperHeader]Alan García remporte les élections péruviennes de 1985"
 news.1690.d: "La plus ancienne force politique du Pérou a finalement revendiqué la présidence, alors qu'Alan García Pérez, le fougueux dirigeant de 36 ans de l'Alliance révolutionnaire populaire américaine (APRA), a remporté une victoire écrasante aux élections de dimanche. Avec près de 53 % des votes comptés, l'orateur charismatique a dépassé le seuil des 50 % nécessaire pour éviter un second tour, battant le conservateur Luis Bedoya Reyes et le gauchiste Alfonso Barrantes dans un réalignement historique de la politique péruvienne. Ce triomphe marque la première victoire présidentielle de l'APRA depuis sa création en 1924 par le dirigeant en exil Víctor Raúl Haya de la Torre, qui a été empêché d'accéder au pouvoir pendant des décennies par des coups d'État militaires et l'exclusion politique. Le glissement de terrain de García - alimenté par l'énergie de la jeunesse et les promesses d'un « nouveau destin national » - survient cinq ans seulement après le retour du Pérou à la démocratie, mettant fin à la domination du parti Acción Popular de Fernando Belaúnde Terry. Des célébrations ont éclaté dans les bastions du nord lorsque García, le plus jeune président élu de l'hémisphère, s'est engagé à renégocier la dette extérieure du Pérou tout en maintenant l'entreprise privée - un équilibre délicat entre populisme et pragmatisme. Sa victoire marque un tournant radical vers la gauche après l'austérité de Belaúnde, avec le projet de plafonner le remboursement de la dette à 10 % des recettes d'exportation, une décision qui suscite déjà les avertissements des créanciers internationaux."
 news.1690.a: "Une victoire du populisme de gauche"
 news.1691.t: "[GetNewspaperHeader]Alberto Fujimori remporte les élections péruviennes de 1990"
 news.1691.d: "L'establishment politique péruvien était en ruine ce soir lorsqu'Alberto Fujimori, un ingénieur agronome pratiquement inconnu d'origine japonaise, a battu l'écrivain de renommée mondiale Mario Vargas Llosa lors d'un second tour présidentiel qui a bouleversé toutes les idées reçues. Les résultats finaux montrent que l'outsider politique a remporté 62 % des voix, écrasant la coalition néolibérale de Vargas Llosa, bien qu'il ait été dépassé par vingt voix contre un et qu'il manque de soutien médiatique majeur. Le fils d'immigrés japonais a fait campagne sur une camionnette cabossée avec le slogan « Honnêteté, technologie, travail », son attitude populaire et ses vagues promesses d'une « troisième voie » entre thérapie de choc et socialisme trouvant un écho auprès d'une population terrifiée par les plans d'austérité explicites de Vargas Llosa. L'avancée surprise de Fujimori au second tour - passant de 1 % dans les sondages à la deuxième place au premier tour d'avril - culmine désormais dans l'inversion politique la plus dramatique depuis le coup d'État militaire de 1968. Les marchés internationaux ont réagi avec panique, le prix de la dette péruvienne plongeant alors que Fujimori refusait de s'engager à rembourser sa dette ou à signer des accords avec le FMI. Le président élu hérite d'une nation en chute libre : une inflation annuelle de 7 000 %, des infrastructures en ruine et la guérilla du Sentier lumineux contrôlant de vastes territoires. Son programme ambigu offre peu d'indices - promettant à la fois de protéger les pauvres tout en attirant les investissements, et de lutter contre la corruption tout en évitant les étiquettes idéologiques."
 news.1691.a: "Le néolibéralisme est-il vraiment la voie vers un miracle économique péruvien ?"
 news.1692.t: "[GetNewspaperHeader]Fujimori destitué, Valentín Paniagua devient président d'Interum"
 news.1692.d: "L'ère autoritaire du Pérou qui a duré dix ans s'est effondrée aujourd'hui lorsqu'Alberto Fujimori a faxé sa démission de l'exil qu'il s'était imposé au Japon, ouvrant ainsi la voie au chef de l'opposition Valentín Paniagua pour assumer la présidence et commencer à démanteler le régime corrompu. Le leader du Congrès âgé de 63 ans, connu pour son tempérament mesuré et ses principes institutionnalistes, a prêté serment devant une législature en larmes quelques heures seulement après la dissolution de l'emprise finale de Fujimori sur le pouvoir. La transition marque un renversement stupéfiant pour une nation qui, il y a seulement quelques semaines, semblait piégée par le régime autocratique de Fujimori. Paniagua - un avocat centriste qui n'a jamais occupé de poste exécutif - est désormais confronté à la tâche monumentale d'organiser de nouvelles élections tout en purgeant les institutions gouvernementales du réseau de renseignement obscur de Fujimori. Son premier acte fut de nommer une commission vérité chargée d'enquêter sur le scandale de corruption de Vladivideo et les violations des droits de l'homme commises pendant le régime « d'auto-coup d'État » de Fujimori. Les dirigeants internationaux ont salué la transition sans effusion de sang, l'OEA ayant levé la suspension diplomatique du Pérou. Mais le nouveau président hérite d'une nation fracturée : une économie en récession, des vestiges de la machine politique de Fujimori toujours ancrés dans l'armée et l'héritage non résolu d'une campagne contre-insurrectionnelle brutale. Alors que les archivistes commençaient à déballer des caisses de documents déchiquetés provenant du quartier général des renseignements, Paniagua a adopté un ton unificateur : « Nous ne sommes pas ici pour nous venger, mais pour reconstruire la démocratie brique par brique »."
 news.1692.a: "Son culte de la personnalité survivra-t-il à son règne ?"
 news.1693.t: "[GetNewspaperHeader]Alejandro Toledo remporte les élections péruviennes de 2001"
 news.1693.d: "Passé du statut de cireur de chaussures au palais présidentiel, Alejandro Toledo est entré dans l'histoire ce soir en battant l'ancien président Alan García lors d'un second tour des élections qui marque la pleine sortie du Pérou de la dictature de Fujimori. Avec 53 % des voix, l'économiste formé à Stanford devient le premier dirigeant d'origine indigène à gouverner le Pérou depuis son indépendance, remplissant ainsi sa promesse électorale de représenter « ceux qui n'ont jamais été vus ». L'élection - surveillée par 500 observateurs internationaux comme la plus juste du Pérou depuis des décennies - marque le point culminant d'une transition mouvementée de 18 mois qui a commencé avec la fuite de Fujimori vers le Japon. Le discours de victoire de Tolède devant 100 000 partisans sur la Plaza de Armas de Lima a eu un ton apaisant : \"Aujourd'hui, nous enterrons le racisme qui disait qu'un cholo ne pourrait jamais gouverner ce pays.\" Son parti Perú Posible a également obtenu une pluralité au Congrès, mais sans majorité absolue. Les marchés ont réagi avec prudence à ce résultat, les prix des obligations ayant chuté en raison des inquiétudes suscitées par le discours de gauche de Toledo. Le président élu hérite d'une nation encore sous le choc de l'héritage de Fujimori : une dette de 30 milliards de dollars, des services de renseignement en désarroi et des régions productrices de coca déchirées entre les restes du Sentier lumineux et des patrouilles militaires abusives. Son défi immédiat consistera à trouver un équilibre entre l'austérité imposée par le FMI et les revendications de ses partisans pauvres qui attendent des emplois et la justice."
 news.1693.a: "Le visage du réformisme modéré au Pérou"
 news.1694.t: "[GetNewspaperHeader]Alan García remporte les élections péruviennes de 2006"
 news.1694.d: "Dans la résurrection politique la plus spectaculaire de l'histoire du Pérou, Alan García a été élu président aujourd'hui pour un second mandat, complétant ainsi un improbable arc de rédemption après que son administration désastreuse de 1985 à 1990 ait laissé le pays en ruines. Le leader de l'APRA, âgé de 56 ans, a battu le nationaliste Ollanta Humala par 53% contre 47% lors d'un second tour qui a divisé le Pérou entre les élites côtières craignant un changement radical et les masses appauvries des hautes terres exigeant la révolution. La victoire de García - obtenue en modérant sa rhétorique enflammée et en exploitant la terreur de la classe moyenne face aux promesses de Humala à la Chavez - marque une réhabilitation extraordinaire pour l'homme qui a fui le Pérou en 1992 au milieu de l'hyperinflation et de la violence du Sentier Lumineux. \"Le phénix se lève !\" » ont crié des loyalistes extatiques de l'APRA dans le centre colonial de Lima, où, il y a quelques mois à peine, des manifestants ont brûlé les effigies du dirigeant autrefois déshonoré. Le président élu fait désormais face à une nation transformée depuis son premier règne : une économie en plein essor basée sur les minerais, mais avec des inégalités béantes qui ont alimenté la campagne insurrectionnelle de Humala. Les investisseurs internationaux ont respiré plus facilement lorsque García a promis de poursuivre la politique de libre marché de Tolède - un contraste frappant avec sa position de défaut de paiement dans les années 1980. Pourtant, gouverner s'avérera complexe avec un Congrès fracturé et une opposition radicalisée ; Les partisans de Humala promettent déjà une « mobilisation permanente » contre le « traître des pauvres »."
 news.1694.a: "Un retour du populisme de gauche au Pérou ?"
 news.1695.t: "[GetNewspaperHeader]La troisième guerre équatorienne-péruvienne"
 news.1695.d: "Le conflit territorial de longue date entre l'Équateur et le Pérou a explosé en guerre ouverte, alors que de violents combats ont éclaté aujourd'hui dans la région isolée de la Cordillera del Cóndor, marquant le troisième conflit majeur entre les voisins en six décennies. Des duels d'artillerie et des bombardements aériens ont été signalés le long d'un tronçon de 78 kilomètres de la frontière contestée, les deux pays mobilisant leurs troupes et accusant l'autre de lancer des attaques non provoquées. Le point chaud est survenu lorsque des patrouilles équatoriennes auraient pénétré dans le territoire revendiqué par le Pérou, près de la rivière Cenepa, déclenchant une réponse rapide de Lima. Les MiG-29 péruviens et les avions Mirage F1 équatoriens se sont livrés à des combats aériens au-dessus des crêtes couvertes de nuages, tandis que les unités d'élite de la jungle s'affrontaient dans des combats rapprochés brutaux. Les premiers rapports font état de dizaines de victimes des deux côtés, même si le terrain accidenté et les mauvaises communications ont masqué l'ampleur des combats. Le conflit ravive un âpre conflit frontalier du XIXe siècle sur un territoire que les deux nations prétendent souverain - un désaccord qui avait déjà dégénéré en guerre en 1941 et 1981. Les efforts diplomatiques des pays « garants » (Argentine, Brésil, Chili et États-Unis) pour servir de médiateurs se sont effondrés quelques heures avant le début des tirs."
 news.1695.a: "Cela va-t-il ébranler la règle de fer de Fujimori ?"
 news.1696.t: "[GetNewspaperHeader]La guerre des Paquishas"
 news.1696.d: "Les tensions entre l'Équateur et le Pérou se sont transformées en hostilités ouvertes après que les troupes équatoriennes ont établi des avant-postes militaires dans la région contestée de la Cordillera del Cóndor, déclenchant une réponse rapide et énergique des forces armées péruviennes. Les affrontements, centrés autour de la zone connue sous le nom de Paquisha (revendiquée par le Pérou) ou False Paquisha (comme la désigne l'Équateur), marquent l'affrontement militaire le plus grave entre les deux nations depuis la guerre de 1941. Le président péruvien Fernando Belaúnde Terry a annoncé la « libération » de la zone occupée, affirmant que l'Équateur avait infiltré le territoire souverain. Le gouvernement militaire équatorien, dirigé par Osvaldo Hurtado, a nié ces allégations, insistant sur le fait que ses troupes étaient stationnées à l'intérieur des frontières reconnues de l'Équateur. Des bombardements aériens et des escarmouches au sol ont été signalés, les deux camps s'accusant mutuellement d'agression. Le conflit ravive un différend territorial vieux d'un siècle remontant au Protocole de Rio de 1942, que l'Équateur conteste depuis longtemps. Les puissances régionales, dont le Brésil et les États-Unis, ont appelé à un cessez-le-feu immédiat, tandis que l'Organisation des États américains (OEA) a convoqué une session d'urgence pour servir de médiation."
 news.1696.a: "La guerre de 1941 laisse clairement des questions sans réponse"
 news.1697.t: "[GetNewspaperHeader]Pieter Willem Botha dirige l'Afrique du Sud après la démission de Vorster"
 news.1697.d: "Pieter Willem Botha, le ministre sud-africain de la Défense, a été élu nouveau Premier ministre du pays à la suite de la démission brutale de John Vorster, qui démissionne suite aux retombées du scandale Muldergate. Le Parti national au pouvoir a confirmé l'ascension de Botha lors d'un vote parlementaire à huis clos, consolidant ainsi sa réputation de fervent défenseur de l'apartheid et d'opposant farouche à la pression internationale. Connu sous le nom de « Die Groot Krokodil » (Le Grand Crocodile) pour ses tactiques politiques impitoyables, Botha s'est engagé à maintenir le régime de la minorité blanche tout en mettant en garde contre une « attaque totale » des forces de libération communistes et noires. Vorster, qui conservera le rôle cérémonial de président de l'État, quitte le pays après une décennie au pouvoir, son héritage terni par les révélations d'une caisse noire secrète du gouvernement. Les analystes prédisent que le leadership de Botha entraînera une répression encore plus sévère contre la dissidence à mesure que la condamnation mondiale de l'apartheid s'accentue."
 news.1697.a: "Un autre défenseur de la ligne dure de l'apartheid"
 news.1698.t: "[GetNewspaperHeader]F. W. De Klerk devient président sud-africain après la démission de Botha"
 news.1698.d: "Dans un changement politique radical, F.W. De Klerk, l'ancien ministre pragmatique de l'Éducation, a prêté serment en tant que nouveau président exécutif de l'Afrique du Sud après la démission soudaine de P.W. De Klerk. Botha, le leader à la poigne de fer dont la santé et la politique rigide de l'apartheid avaient aliéné même son propre parti. Botha, 73 ans, surnommé \"Die Groot Krokodil\" pour son règne combatif, a démissionné après avoir refusé de rencontrer Nelson Mandela, signalant une rupture avec les factions réformatrices du Parti national. De Klerk, 53 ans, hérite d'une nation en pleine tourmente - frappée par des sanctions, des manifestations de masse et une crise économique paralysante - mais a fait allusion à un potentiel assouplissement des lois sur l'apartheid, déclarant au Parlement : « L'heure des négociations est venue ». Alors que les partisans de la ligne dure mettent en garde contre toute concession, les observateurs internationaux espèrent prudemment que ce changement de leadership marquera le début de la transition tant attendue en Afrique du Sud."
 news.1698.a: "Peut-il se permettre de maintenir le statu quo ?"
 news.1699.t: "[GetNewspaperHeader]F. W. De Klerk adopte le suffrage universel en Afrique du Sud"
 news.1699.d: "Dans une décision historique qui démantèle le dernier pilier de l'apartheid, le président F.W. De Klerk a promulgué le suffrage universel, accordant à tous les Sud-Africains - quelle que soit leur race - le droit de vote pour la première fois dans l'histoire du pays. Cette réforme radicale, adoptée par le Parlement après un débat acharné, ouvre la voie aux premières élections non raciales en Afrique du Sud en avril 1994, avec l'ANC de Nelson Mandela désormais prêt à se présenter au pouvoir. De Klerk, autrefois défenseur de la minorité blanche, a déclaré que cette décision était « la dernière étape vers une Afrique du Sud juste et démocratique », mettant fin à des années de négociations tendues et de troubles violents. Cette décision fait suite au référendum de 1992 réservé aux Blancs, au cours duquel les électeurs ont soutenu la réforme, et intervient quelques mois seulement après que de Klerk et Mandela ont reçu conjointement le prix Nobel de la paix. Alors que les groupes d'extrême droite jurent de résister, les dirigeants mondiaux saluent cette décision comme la fin du racisme légalisé et la naissance d'une nouvelle ère."
 news.1699.a: "La fin du règne de la minorité blanche"
 news.1700.t: "[GetNewspaperHeader]La fin de l'apartheid"
 news.1700.d: "Au cours d'une session historique qui a fait écho dans le monde entier, le Parlement sud-africain a abrogé aujourd'hui la dernière des lois sur l'apartheid, mettant ainsi officiellement fin à quatre décennies de ségrégation raciale et de domination blanche imposées par l'État. Le président F.W. De Klerk, flanqué du leader de l'ANC Nelson Mandela, a annoncé l'abrogation de la loi sur l'enregistrement de la population - la pierre angulaire de l'apartheid qui classait les citoyens selon la race - la qualifiant de « certificat de décès d'un système moralement indéfendable ». Cette décision fait suite à la levée de l'interdiction des mouvements de libération en février 1990 et à la libération de Mandela après 27 ans de prison. Tandis que les célébrations éclataient dans les townships noirs, des groupes blancs d'extrême droite protestaient, mettant en garde contre « le chaos et la tyrannie de la majorité ». Le cadre juridique de l'apartheid étant désormais démantelé, l'attention se porte désormais sur les négociations constitutionnelles pour une démocratie d'une personne et d'une voix, même si de profonds défis demeurent pour combler les divisions raciales en Afrique du Sud. La communauté internationale, qui a imposé des décennies de sanctions, s'est engagée à soutenir la « nation nouveau-née » alors qu'elle s'oriente vers un avenir incertain mais plein d'espoir."
 news.1700.a: "Une lutte de plusieurs décennies, finalement victorieuse"
 news.1701.t: "[GetNewspaperHeader]Nelson Mandela élu président de l'Afrique du Sud"
 news.1701.d: "Dans un moment qui s'est répercuté sur tous les continents, Nelson Rolihlahla Mandela a prêté serment aujourd'hui en tant que premier président noir démocratiquement élu d'Afrique du Sud, cimentant ainsi l'extraordinaire transition de la nation de la tyrannie de l'apartheid à la démocratie multiraciale. Debout sous un ciel d'automne lumineux devant les bâtiments de l'Union, devant une foule de 100 000 personnes et sous les yeux des dirigeants du monde entier, l'ancien prisonnier politique de 75 ans a levé la main droite et a juré de diriger « une nation unie dans la diversité », suscitant les larmes des camarades de l'ANC et les applaudissements prudents des anciens oppresseurs. Cette inauguration couronne la première élection pleinement inclusive en Afrique du Sud, où des millions de citoyens noirs - privés du droit de vote pendant des siècles - ont finalement voté, donnant au parti ANC de Mandela une victoire écrasante de 62 %. Dans un geste étonnant de réconciliation, le nouveau président a embrassé le leader sortant F.W. De Klerk, qui occupera le poste de vice-président aux côtés de Thabo Mbeki. \"Le temps de la guérison est venu\", a déclaré Mandela, vêtu d'une chemise de marque Madiba, alors que les avions de combat peignaient les couleurs du nouveau drapeau dans le ciel."
 news.1701.a: "L'histoire en marche !"
 news.1702.t: "[GetNewspaperHeader]Thabo Mbeki remporte les élections en Afrique du Sud"
 news.1702.d: "Dans le cadre d'un transfert de pouvoir sans heurts qui témoigne de la maturité de la démocratie sud-africaine, Thabo Mvuyelwa Mbeki a été inauguré aujourd'hui en tant que deuxième président noir du pays, succédant à l'emblématique Nelson Mandela après la victoire électorale décisive de l'ANC. L'économiste formé à Oxford, âgé de 56 ans, a prêté serment devant les Union Buildings, s'engageant à bâtir sur l'héritage de Mandela tout en s'attaquant aux défis profonds du pays avec sa vision technocratique caractéristique. « La nation arc-en-ciel doit maintenant devenir une nation de substance », a déclaré Mbeki, accompagné du président sortant Mandela et des dirigeants régionaux, alors qu'il présentait des plans ambitieux pour lutter contre la pauvreté, attirer les investissements étrangers et faire face à la crise croissante du VIH/SIDA. Son ascension marque la première transition démocratique depuis la fin de l'apartheid, l'ANC obtenant 66 % des voix - un témoignage de sa domination durable malgré les inquiétudes croissantes de l'opposition."
 news.1702.a: "Poursuivra-t-il la politique libérale de l'ANC ?"
 news.1703.t: "[GetNewspaperHeader]L'Afrique du Sud adopte la loi de 1950 sur la répression du communisme"
 news.1703.d: "Le gouvernement du Parti national a fait adopter aujourd'hui la loi sur la répression du communisme, accordant des pouvoirs étendus pour interdire le Parti communiste et poursuivre en justice toute personne considérée comme favorisant les « objectifs communistes » - un terme au sens large qui, selon les dirigeants de l'opposition, sera utilisé pour écraser toute dissidence contre le régime de l'apartheid. La législation controversée, adoptée par le Parlement de la minorité blanche malgré les vives objections du Parti uni et du Congrès national africain (ANC), permet au gouvernement de déclarer des organisations illégales, de restreindre les publications et d'imposer des interdictions sévères à des individus sans procès. Le ministre de la Justice C.R. Swart a défendu la loi comme étant nécessaire pour combattre « les forces subversives qui menacent la civilisation chrétienne en Afrique du Sud », mais les critiques, dont le président de l'ANC, le Dr A.B. Xuma, l'a condamné comme un outil destiné à réprimer la résistance noire et l'activisme syndical."
 news.1703.a: "L'Afrique du Sud a clairement exprimé sa Position."
 news.1704.t: "[GetNewspaperHeader]L'autonomie établie au Transkei par l'Afrique du Sud"
 news.1704.d: "Le gouvernement de l'apartheid a déclaré aujourd'hui le Transkei comme le premier bantoustan « autonome » d'Afrique du Sud, faisant ainsi progresser sa politique controversée de développement séparé tout en suscitant une rapide condamnation internationale. Le Premier ministre Hendrik Verwoerd a salué cette décision comme \"la naissance d'une nation Xhosa indépendante\", mais les critiques la rejettent comme une tentative à peine voilée de consolider le pouvoir de la minorité blanche en privant les Sud-Africains noirs de leurs droits de citoyenneté. Aux termes de cet accord, le Transkei - un territoire fragmenté du Cap oriental désigné comme la « patrie » des personnes parlant le xhosa - aura une législature fantoche dirigée par le chef Kaiser Matanzima, tout en restant économiquement et politiquement dépendant de Pretoria. Le gouvernement sud-africain conserve le contrôle de la défense, des affaires étrangères et des infrastructures clés, les résidents noirs ayant toujours besoin de laissez-passer pour entrer dans « l'Afrique du Sud blanche ». Les Nations Unies et les groupes anti-apartheid ont immédiatement rejeté cette décision, le porte-parole de l'ANC, Oliver Tambo, la qualifiant de « fraude pour justifier l'oppression ». Alors que le régime prépare une « indépendance » similaire pour d'autres bantoustans, les analystes préviennent que cette escalade va aggraver la ségrégation raciale et les déplacements sous couvert d'autonomie."
 news.1704.a: "Quel est leur projet ?"
 news.1705.t: "[GetNewspaperHeader]L'Afrique du Sud déclare l'indépendance de la République du Transkei"
 news.1705.d: "Le régime de l'apartheid a présenté aujourd'hui son spectacle ségrégationniste le plus audacieux à ce jour, déclarant la République du Transkei nominalement « indépendante » tout en conservant de facto le contrôle sur le territoire appauvri du Cap oriental. Orchestrée par Pretoria pour faire avancer sa politique discréditée de développement séparé, la cérémonie a vu le chef fantoche Kaiser Matanzima proclamer la souveraineté devant un parterre de responsables sud-africains et de délégués tribaux, alors même que les forces de défense sud-africaines maintenaient l'occupation et que le rand restait la seule monnaie légale. Les Nations Unies et toutes les grandes puissances ont immédiatement rejeté cette farce, l'ANC la dénonçant comme une « dépossession légalisée » privant des millions de Xhosa de la citoyenneté sud-africaine pour consolider le pouvoir de la minorité blanche. Alors que l'économie du Transkei dépend entièrement des subventions de Pretoria et que ses frontières sont toujours surveillées par la police de l'apartheid, les analystes préviennent que ce projet s'étendra bientôt à d'autres bantoustans, fragmentant encore davantage les droits politiques des Noirs sous couvert de décolonisation tandis que le régime resserre son emprise sur 87 % des terres et des richesses du pays."
 news.1705.a: "Une manière à peine voilée d'éviter la règle de la majorité au niveau national..."
 news.1706.t: "[GetNewspaperHeader]L'autonomie établie au Bophuthatswana"
 news.1706.d: "Le régime de l'apartheid a aujourd'hui avancé sa politique controversée en matière de patrie en accordant l'autonomie nominale au Bophuthatswana, un territoire fragmenté réparti sur trois provinces sud-africaines et désigné comme la « patrie tswana ». Sous la forte présence militaire sud-africaine, le chef Lucas Mangope a été nommé président de l'enclave non contiguë, qui manque d'infrastructures viables ou d'indépendance économique tandis que Pretoria conserve le contrôle de la défense, de la politique étrangère et des systèmes monétaires. Cette décision, qui fait suite à la fausse indépendance du Transkei en 1976, suscite une condamnation internationale immédiate, le secrétaire général de l'ONU, Kurt Waldheim, la qualifiant de « tentative frauduleuse de dissimuler la domination raciale ». Les groupes d'opposition noirs préviennent que ce projet vise à reclasser définitivement des millions de Sud-Africains comme migrants étrangers dans leur propre pays, l'ANC déclarant : \"Ces bantoustans sont des prisons rurales où l'apartheid enferme les dépossédés\". Les économistes notent que 75 % de la main-d'oeuvre masculine du Bophuthatswana restera dépendante d'emplois subalternes dans des mines et industries contrôlées par les Blancs, leurs revenus étant imposés à la fois par le gouvernement fantoche et par Pretoria - un projet pour sept autres homelands planifiés."
 news.1706.a: "Ce plan fonctionnera-t-il ?"
 news.1707.t: "[GetNewspaperHeader]L'Afrique du Sud déclare l'indépendance de la République du Bophuthatswana"
 news.1707.d: "Sous la garde militaire sud-africaine, le territoire fragmenté du Bophuthatswana est devenu aujourd'hui le deuxième bantoustan déclaré « indépendant » dans le cadre de la politique discréditée de développement séparé de Pretoria, dans une démarche unanimement condamnée par la communauté internationale. Le président Lucas Mangope, installé et financé par le régime de l'apartheid, a signé des documents d'indépendance qui privent 1,5 million de Tswana de la citoyenneté sud-africaine tout en maintenant le territoire économiquement enchaîné au rand et militairement dépendant des forces armées de Pretoria. Le Conseil de sécurité de l'ONU a immédiatement déclaré la déclaration « nulle et non avenue », l'ambassadeur américain Andrew Young la comparant à « déclarer un prisonnier indépendant tout en le gardant menotté dans sa cellule ». Les dirigeants anti-apartheid ont révélé que 83 % du budget du Bophuthatswana provient directement de Pretoria, tandis que 60 % de sa main-d'oeuvre reste piégée dans les systèmes de travail des migrants, prouvant ce que l'ANC a appelé « cette indépendance est une blague cruelle : notre peuple devient des étrangers dans son pays de naissance ». Alors que le régime prévoit une « indépendance » similaire pour Venda et Ciskei, les analystes préviennent que ces États fictifs servent de dépotoirs de l'apartheid pour les citoyens noirs indésirables tout en préservant le contrôle des Blancs sur 87 % des terres et des richesses minières de l'Afrique du Sud."
 news.1707.a: "La communauté internationale ne le reconnaîtra sûrement pas"
 news.1708.t: "[GetNewspaperHeader]L'autonomie établie à Venda"
 news.1708.d: "Le régime de l'apartheid a aujourd'hui élargi sa stratégie bantoustan en accordant une autonomie nominale à Venda, un territoire isolé et pauvre du nord du Transvaal désigné comme la soi-disant « patrie » du peuple Venda. Lors d'une cérémonie soigneusement organisée et boycottée par la communauté internationale, le ministre en chef Patrick Mphephu a pris le pouvoir sur cette enclave non viable, dépourvue d'infrastructures, d'industries ou de ressources naturelles, tout en restant entièrement dépendante de Pretoria pour 92 % de son budget et de toutes les opérations de sécurité. Cette décision - qui intervient seulement deux ans après « l'indépendance » controversée du Bophuthatswana - suit le même plan discrédité consistant à priver les Sud-Africains noirs de leurs droits de citoyenneté tout en maintenant le contrôle de la minorité blanche sur le coeur économique du pays. Le secrétaire général de l'ONU, Kurt Waldheim, a immédiatement condamné cette évolution, la qualifiant de « nouvelle tentative frauduleuse d'institutionnaliser la discrimination raciale », tandis que le PAC a qualifié l'administration Venda de « spectacle de marionnettes tribalistes dirigé par les régisseurs de l'apartheid ». Alors que plus de 60 % de la population masculine adulte de Venda est obligée de chercher de la main d'oeuvre migrante dans les villes et les mines contrôlées par les Blancs, les militants anti-apartheid préviennent que ce dernier bantoustan ne représente rien de plus qu'un « dépotoir rural » pour la main-d'oeuvre noire excédentaire sous couvert d'autodétermination."
 news.1708.a: "Un autre programme raté ?"
 news.1709.t: "[GetNewspaperHeader]L'Afrique du Sud déclare l'indépendance de la République de Venda"
 news.1709.d: "Le régime de l'apartheid a intensifié aujourd'hui sa stratégie bantoustan en déclarant l'indépendance nominale de Venda, un territoire éloigné et économiquement non viable dans la région nord du Transvaal en Afrique du Sud, marquant le troisième pseudo-État de ce type créé dans le cadre de la politique de développement séparé discréditée de Pretoria. Au cours d'une cérémonie dépourvue de reconnaissance internationale, le chef Patrick Mphephu est devenu président de cette nouvelle « République » qui reste entièrement dépendante de l'Afrique du Sud pour 94 % de son budget, de l'ensemble de son approvisionnement en électricité et en eau, et même des salaires de ses fonctionnaires, tandis que Pretoria conserve le contrôle de la défense, de la monnaie et des affaires étrangères. Le Conseil de sécurité des Nations Unies a condamné à l'unanimité cette décision, la qualifiant de \"privation frauduleuse de la citoyenneté sud-africaine\" pour près de 700 000 Venda, désormais apatrides dans leur propre pays. Les dirigeants anti-apartheid ont dénoncé l'ironie cruelle selon laquelle 82 % de la main-d'oeuvre masculine de Venda doit encore migrer vers des mines et des usines contrôlées par des blancs, leurs revenus étant imposés à la fois par le régime fantoche et par Pretoria. Alors que le Parti national prépare une « indépendance » similaire pour le Ciskei, les analystes préviennent que ces bantoustans servent de réservoirs ruraux de main-d'oeuvre noire bon marché tout en préservant le monopole blanc sur 87 % des richesses foncières et minières de l'Afrique du Sud - ce que le Conseil oecuménique des Églises a dénoncé comme « une indépendance sans liberté, une souveraineté sans dignité »."
 news.1709.a: "La politique des bantoustans est une énigme"
 news.1710.t: "[GetNewspaperHeader]L'autonomie établie à Ciskei"
 news.1710.d: "Le régime de l'apartheid a complété aujourd'hui son quatuor de souverainetés factices en déclarant l'indépendance nominale du Ciskei, un territoire fracturé le long de la côte orientale du Cap, en installant le chef Lennox Sebe comme président de ce que les critiques qualifient de « premier État mendiant du monde ». Au cours d'une cérémonie farfelue gardée par des unités des forces de défense sud-africaines, la nouvelle « République » - comprenant 19 parcelles non contiguës de terres arides - a été proclamée malgré le manque d'infrastructures de base, de ressources naturelles ou de viabilité économique, Pretoria conservant le contrôle de sa monnaie, de sa défense militaire et de 97 % de son budget annuel. L'Assemblée générale des Nations Unies a immédiatement adopté la résolution 36/181 déclarant cette action « nulle et non avenue », tandis que l'archevêque Desmond Tutu a condamné cette décision comme « la dernière pièce du puzzle de dépossession de l'apartheid », privant 850 000 Xhosa de leur citoyenneté sud-africaine pour créer ce qui équivaut à « un camp de réfugiés rural avec un drapeau ». Avec un taux de chômage de 78 % au Ciskei et plus de 65 % de sa population masculine adulte contrainte à travailler comme migrants dans les centres industriels blancs, les économistes révèlent que le territoire survit grâce aux envois de fonds des travailleurs piégés dans ce que l'Organisation internationale du travail appelle « un cycle de servitude économique perpétuelle ». L'ANC prévient que cela complète la stratégie de « gerrymandering démographique » de Pretoria, ayant désormais légalement exclu près de 8 millions de Sud-Africains noirs au travers d'États fictifs tout en maintenant la domination de la minorité blanche sur les richesses de la nation - un système que la Banque mondiale refuse désormais de reconnaître dans toute transaction financière."
 news.1710.a: "Le prochain bantoustan ?"
 news.1711.t: "[GetNewspaperHeader]L'Afrique du Sud déclare l'indépendance de la République du Ciskei"
 news.1711.d: "Le régime de l'apartheid a atteint aujourd'hui le sombre point culminant de sa politique des bantoustans en déclarant « l'indépendance » du Ciskei, en complétant son quatuor de pseudo-États et en privant de leur citoyenneté près de 10 millions de Sud-Africains noirs par ce que le Conseil de sécurité de l'ONU a appelé « la dépossession légalisée ». Le président Lennox Sebe, ancien professeur d'école devenu dirigeant autoritaire, a pris le pouvoir sur ce territoire du Cap oriental, un patchwork de 19 parcelles de terre déconnectées sans économie viable, où 89 % du budget provient directement de Pretoria. La cérémonie, gardée par les troupes sud-africaines et à laquelle assistaient uniquement d'autres dirigeants bantoustans non reconnus, a provoqué une condamnation mondiale immédiate. Le secrétaire d'Etat américain Alexander Haig l'a dénoncé comme \"une fraude évidente\", tandis que l'ANC a révélé que le soi-disant \"cabinet\" de Ciskei exigeait l'approbation de Pretoria pour toutes les décisions. Alors que les hommes de Ciskei continuent de migrer vers les mines et les usines blanches - leurs salaires étant imposés par les deux régimes - la Croix-Rouge internationale met en garde contre une famine imminente dans les bidonvilles « indépendants » surpeuplés. Le monde regarde désormais l'ANC interdit par Mandela préparer sa réponse à l'arme démographique ultime de l'apartheid."
 news.1711.a: "Une manière à peine voilée d'éviter la règle de la majorité au niveau national..."
 news.1712.t: "[GetNewspaperHeader]Création du GANUPT dans le Sud-Ouest africain"
 news.1712.d: "Le Groupe d'assistance des Nations Unies pour la transition (GANUPT) s'est déployé dans le Sud-Ouest africain, lançant une mission de maintien de la paix sans précédent pour guider le territoire vers l'indépendance après 74 ans de domination sud-africaine. Quelque 4 500 casques bleus de 25 pays superviseront le retrait progressif de 50 000 soldats sud-africains, surveilleront le retour de 40 000 exilés namibiens et garantiront des élections libres conformément à la résolution 435 de l'ONU - finalement mise en oeuvre après 11 ans de retards à Pretoria suite aux accords de New York de 1988. Le représentant spécial de l'ONU, Martti Ahtisaari, a annoncé des protocoles stricts pour désarmer les insurgés restants tandis que Sam Nujoma, de la SWAPO, s'exprimant depuis Lusaka, a salué \"le début de notre libération\", bien que les tensions persistent alors que des groupes de droite sud-africains menacent de perturber et que de vastes champs de mines marquent encore les régions frontalières du nord. Alors que l'Administrateur général de l'Afrique du Sud conserve le contrôle administratif temporaire mais que l'UNTAG contrôle la police et le processus électoral, le compte à rebours commence vers les élections de novembre et la date promise de l'indépendance du 21 mars 1990"
 news.1712.a: "La fin de l'occupation du Sud-Ouest africain"
 news.1713.t: "[GetNewspaperHeader]L'indépendance formelle de la République de Namibie"
 news.1713.d: "Sous un ciel africain étoilé, la République de Namibie est née à minuit lorsque le secrétaire général de l'ONU, Javier Pérez de Cuéllar, a remis les instruments constitutionnels au président Sam Nujoma, mettant ainsi fin à 106 ans de régime colonial, d'abord sous l'occupation brutale de l'Allemagne, puis sous le régime d'apartheid de l'Afrique du Sud. Lors d'une cérémonie chargée d'émotion en présence de 30 000 Namibiens et dirigeants mondiaux en liesse, dont Nelson Mandela (toujours emprisonné pendant les négociations d'indépendance de la Namibie), le lever du nouveau drapeau sunburst a marqué le point culminant de la mission de décolonisation la plus réussie de l'ONU, l'administrateur sud-africain sortant Louis Pienaar signant à contrecoeur les documents de transfert après 13 mois de transition de l'UNTAG. La nouvelle nation - le 52e État souverain d'Afrique - a immédiatement rejoint l'ONU et le Mouvement des pays non alignés, sa constitution étant considérée comme la plus progressiste du continent pour garantir les droits des minorités et interdire la peine de mort. Pourtant, des défis se profilent : 60 % des terres arables restent aux mains des Blancs, l'économie dépend des ports sud-africains et 40 000 exilés de retour ont besoin d'être réintégrés. Alors que des feux d'artifice illuminaient l'architecture coloniale de Windhoek, Nujoma s'est engagé à construire « une Namibie pour tous ceux qui y vivent », tandis que de l'autre côté de la frontière, les partisans de l'ANC scandaient « L'Afrique du Sud est la prochaine ! » - un rappel que le retrait de Pretoria ici pourrait annoncer l'effondrement éventuel de l'apartheid."
 news.1713.a: "Le dernier acte de décolonisation"
 news.1714.t: "[GetNewspaperHeader]Hifikepunye Pohamba élu président de la Namibie"
 news.1714.d: "Dans le cadre d'une transition démocratique sans heurts qui a souligné la stabilité politique de la Namibie, Hifikepunye Pohamba, défenseur de la libération, a été nommé deuxième président du pays, succédant à son père fondateur, Sam Nujoma, après avoir remporté 76 % des voix lors des élections pacifiques de novembre. L'ancien ministre des Terres et loyaliste de la SWAPO, âgé de 69 ans, a prêté serment devant 20 000 citoyens au Stade de l'Indépendance, s'engageant à combattre les « démons jumeaux » de la Namibie que sont la pauvreté et les inégalités, tout en maintenant le pragmatisme économique de son prédécesseur. Pohamba hérite d'une nation transformée depuis 1990 - avec un secteur touristique florissant et de nouvelles découvertes pétrolières offshore - mais toujours aux prises avec un chômage de 35 % et la pire inégalité des revenus au monde, où 5 % de la population (pour la plupart des agriculteurs commerciaux blancs) contrôlent 70 % des terres arables. Dans son discours inaugural, le nouveau président a promis une « réforme agraire accélérée » selon les principes « acheteur volontaire, vendeur volontaire », tout en rassurant les investisseurs sur le fait que la Namibie resterait « un phare de la démocratie africaine ». Les observateurs internationaux ont salué ce transfert de pouvoir comme un modèle pour le continent, même si les partis d'opposition ont critiqué le système de partis dominants de la SWAPO après que le parti au pouvoir ait obtenu 55 des 72 sièges parlementaires. Alors que les feux d'artifice illuminaient le ciel du désert, tous les regards se sont tournés vers les premières nominations ministérielles de Pohamba, où les analystes prédisent un exercice d'équilibre entre la vieille garde socialiste de la SWAPO et les jeunes technocrates qui prônent une diversification économique au-delà des mines et de la pêche."
 news.1714.a: "La démocratie namibienne assurée"
 news.1715.t: "[GetNewspaperHeader]L'indépendance du Royaume du Lesotho"
 news.1715.d: "Au cours d'une cérémonie mêlant tradition africaine et faste colonial, le Royaume du Lesotho - anciennement Basutoland - est devenu la plus récente nation indépendante d'Afrique lorsque le prince britannique Henry, duc de Gloucester, a remis des instruments constitutionnels au roi Moshoeshoe II, 34 ans. La proclamation de minuit a transformé cette enclave accidentée et enneigée entièrement entourée par l'Afrique du Sud de l'apartheid en une monarchie constitutionnelle, le chef Leabua Jonathan étant assermenté comme premier Premier ministre sous la bannière royale de la nation Basotho. Des milliers de cavaliers vêtus de couvertures ont défilé dans les rues poussiéreuses de Maseru tandis que le nouveau drapeau tricolore, portant le chapeau traditionnel Basotho, était hissé, marquant la fin de 98 ans de protectorat britannique. Mais l'indépendance s'accompagne de défis existentiels : l'économie du Lesotho reste entièrement dépendante de la main-d'oeuvre migrante dans les mines sud-africaines (qui fournissent 60 % des emplois masculins), tandis que le nouveau gouvernement doit gérer des relations délicates avec son voisin hostile, dirigé par les Blancs. Le roi Moshoeshoe a adopté un ton de défi, promettant de \"résister à toutes les pressions\" de Pretoria, même si les économistes préviennent que la survie de ce pays enclavé dépend du maintien des liens d'union douanière avec l'Afrique du Sud. Alors que les Basotho célèbrent la fête avec de la bière et des danses traditionnelles, le monde regarde si ce petit royaume de 2 millions d'habitants peut maintenir sa fragile souveraineté - et ses idéaux progressistes - en tant qu'île sous domination noire dans un océan d'apartheid."
 news.1715.a: "Une monarchie africaine, une espèce en voie de disparition"
 news.1716.t: "[GetNewspaperHeader]Le Premier ministre du Lesotho, Leabua Jonathan, organise un auto-coup d'État"
 news.1716.d: "Dans une subversion flagrante de la démocratie, le Premier ministre Leabua Jonathan a annulé aujourd'hui les élections au Lesotho après la défaite de son Parti national basotho (BNP) face au parti du Congrès du Basutoland du chef de l'opposition Ntsu Mokhehle, déclarant l'état d'urgence et suspendant la constitution dans ce que les analystes appellent « le premier auto-coup d'État d'Afrique ». Alors que la police armée occupait le Parlement et la station de radio, le dirigeant de 54 ans - autrefois salué comme modéré - a assigné à résidence le roi Moshoeshoe II, 23 ans, après que le monarque a refusé d'approuver la prise de pouvoir, tandis que les forces de sécurité ont arrêté des centaines de personnalités de l'opposition, dont Mokhehle, qui ont fui en exil. Jonathan a justifié ses actions en affirmant que l'infiltration communiste menaçait la nation chrétienne, déclarant à une population stupéfaite : « Quand la loi fait obstacle à la justice, la loi doit disparaître. » Cette décision transforme du jour au lendemain la seule monarchie constitutionnelle d'Afrique en une dictature de facto, avec des implications troublantes pour son économie fragile - dépendante à 90 % de l'Afrique du Sud, dont le régime d'apartheid soutient discrètement la position anticommuniste de Jonathan malgré l'opposition officielle du Lesotho à la minorité blanche. Alors que les pays du Commonwealth condamnent le coup d'État et que les villageois Basotho brûlent les bureaux du BNP en signe de protestation, les observateurs préviennent que cette décision désespérée d'un président sortant perdant pourrait plonger le royaume montagneux dans une instabilité prolongée, les dirigeants de l'opposition en exil promettant déjà une résistance armée depuis leurs bases en Tanzanie."
 news.1716.a: "La démocratie du Lesotho ne durera-t-elle pas une demi-décennie ?"
 news.1717.t: "[GetNewspaperHeader]Le général Justin Lekhanya prépare un coup d'État au Lesotho"
 news.1717.d: "Au cours d'une opération dramatique avant l'aube, les forces paramilitaires du Lesotho ont renversé le régime autoritaire du Premier ministre Leabua Jonathan en place depuis 16 ans, en nommant le commandant de l'armée, le général Justin Metsing Lekhanya, à la tête d'un nouveau conseil militaire. Des chars sont entrés dans la capitale alors que les troupes d'élite s'emparaient des bâtiments gouvernementaux et plaçaient Jonathan, 46 ans, le plus ancien dirigeant d'Afrique, en résidence surveillée, mettant ainsi fin à son règne controversé qui avait sombré dans la corruption et la mauvaise gestion de la famine. Le cerveau du coup d'État, Lekhanya, 45 ans, est apparu à la radio nationale en grand uniforme pour annoncer la suspension de toute activité politique, déclarant que « les forces armées sont intervenues pour sauver la nation de l'effondrement total » tout en s'engageant à restaurer les pouvoirs cérémoniels du roi Moshoeshoe II détenu. Les analystes notent que le putsch fait suite à des années de détérioration des relations entre Jonathan et Pretoria, qui bloquait le royaume enclavé depuis 1983 - une punition pour avoir hébergé des exilés de l'ANC qui a paralysé l'économie du Lesotho et laissé 500 000 personnes menacées de famine. Alors que le ministère sud-africain des Affaires étrangères qualifie déjà le coup d'État de « développement positif », les soupçons tournent autour de l'implication de Pretoria, d'autant plus que Lekhanya a immédiatement promis d'expulser les agents de l'ANC. Alors que les civils Basotho célèbrent prudemment la chute de Jonathan, le chef de l'opposition en exil Ntsu Mokhehle a prévenu depuis Zambie : « Un dictateur en uniforme en a remplacé un autre en costume - la vraie liberté reste volée. »"
 news.1717.a: "Une junte en Afrique du Sud"
 news.1718.t: "[GetNewspaperHeader]Le général Elias Ramaema prépare un coup d'État au Lesotho"
 news.1718.d: "Dans une révolte dramatique dans les casernes à l'aube qui souligne l'aggravation de la crise politique du Lesotho, le général de brigade Elias Phisoana Ramaema a évincé l'homme fort de l'armée Justin Lekhanya, mettant ainsi fin à son régime autoritaire de cinq ans et devenant le troisième officier consécutif de l'armée à gouverner le royaume des montagnes depuis 1986. La répression brutale par Lekhanya des manifestations en faveur de la démocratie et sa détrônation controversée du roi Moshoeshoe II l'année dernière, qui ont aliéné les royalistes et les réformistes au sein des forces armées. Dans son premier discours à la radio, Ramaema, 42 ans, a adopté un ton conciliant, promettant une transition de 18 mois vers une démocratie multipartite et déclarant que « les armes doivent retourner à la caserne », bien que les sceptiques notent que cela reflète les mêmes promesses non tenues faites lors de la prise de pouvoir de Lekhanya en 1986. Le nouvel homme fort hérite d'une nation en chute libre : la réduction des quotas de travailleurs migrants en Afrique du Sud a laissé 45 % des hommes Basotho au chômage, la famine menace 600 000 habitants des zones rurales après des années de sécheresse consécutives, et les factions politiques en exil - du Parti du Congrès du Basutoland aux militants royalistes - se mobilisent pour contester le régime militaire. Alors que les dirigeants du Commonwealth ont accueilli avec prudence l'engagement de réforme de Ramaema, le roi en exil Moshoeshoe II a qualifié le coup d'État de \"voleurs redistribuant des biens volés\", et les analystes préviennent que la nouvelle junte pourrait simplement reformuler le régime militaire alors que Pretoria resserre discrètement son emprise économique sur l'enclave enclavée."
 news.1718.a: "Va-t-il ramener les élections au Lesotho ?"
 news.1719.t: "[GetNewspaperHeader]Ntsu Mokhehle élu Premier ministre du Lesotho"
 news.1719.d: "Dans un moment historique marquant le retour du Lesotho à un régime civil après 23 ans de domination militaire, Ntsu Mokhehle, 74 ans, partisan de la libération, a prêté serment en tant que Premier ministre après la victoire écrasante de son parti du Congrès du Basutoland lors des premières élections démocratiques du royaume depuis 1970. La cérémonie au palais royal de Maseru, en présence du roi Letsie III réintégré et d'observateurs internationaux, a eu lieu après l'obtention du BCP de Mokhehle. 60 des 65 sièges parlementaires, écrasant complètement le Parti national Basotho, soutenu par l'armée, dans ce que les observateurs du Commonwealth ont déclaré « le vote le plus équitable de l'histoire du Lesotho ». Ce révolutionnaire formé à Oxford, qui a passé 22 ans en exil à comploter contre les dictateurs Jonathan et Lekhanya, est désormais confronté à la lourde tâche de reconstruire une nation brisée par les coups d'État et l'isolement économique : 75 % des Basotho vivent en dessous du seuil de pauvreté, le taux d'infection au VIH a atteint 18 % et 60 % des travailleurs masculins dépendent toujours d'un emploi précaire dans les mines sud-africaines. Dans son discours inaugural, le marxiste devenu pragmatique s'est engagé à maintenir les liens avec Pretoria tout en diversifiant l'économie du Lesotho grâce à la fabrication de textiles et aux exportations d'eau, déclarant : \"Aujourd'hui, nous commençons à sortir notre nation des décombres de la tyrannie\". Mais alors que la hiérarchie militaire est toujours intacte et que des divisions factionnelles émergent au sein de son propre parti, les analystes se demandent si ce frêle vétéran politique peut passer du statut de flambeau révolutionnaire au leader unificateur dont le Lesotho a désespérément besoin."
 news.1719.a: "Le panafricanisme au milieu de l'apartheid"
 news.1720.t: "[GetNewspaperHeader]La mort du roi Moshoeshoe II"
 news.1720.d: "Le Lesotho a été plongé dans le deuil national aujourd'hui après que le bien-aimé roi Moshoeshoe II, le monarque formé à Oxford qui a incarné la nation Basotho à travers des décennies de troubles politiques, a péri dans un accident de voiture avant l'aube sur le dangereux col de Motimposo. Le souverain de 57 ans, qui venait tout juste de rentrer d'exil pour reprendre son trône cérémonial, a été tué sur le coup lorsque son véhicule a plongé de 50 mètres dans un ravin alors qu'il revenait d'une inspection du bétail avant l'aube, les assistants royaux rapportant que son chauffeur était également mort dans l'accident. La tragédie survient trois ans seulement après la restauration triomphale de Moshoeshoe, après 23 années de conflits alternés et de coexistence difficile avec les dirigeants militaires et les gouvernements élus, y compris sa destitution en 1990 par le général Lekhanya et son exil ultérieur en Grande-Bretagne. Les hommages ont afflué de toute l'Afrique pour le diplômé en philosophie qui a défendu le développement rural, Nelson Mandela le qualifiant de « monarque qui a souffert avec son peuple », tandis que des questions sans réponse tournent autour des circonstances de l'accident, en particulier compte tenu de l'histoire de violence politique du Lesotho et des récentes tensions du roi avec le gouvernement du Premier ministre Ntsu Mokhehle. Alors que des cavaliers Basotho vêtus de couvertures se rassemblent au palais royal de Thaba-Bosiu où Moshoeshoe Ier a fondé la nation en 1824, le royaume de montagne se prépare à couronner son fils Letsie III, âgé de 31 ans, comme successeur, tout en faisant face à la perte de la seule constante causée par les coups d'État, les pressions de l'apartheid et sa fragile renaissance démocratique : un monarque qui a dit un jour : « Ma couronne n'est pas de l'or, mais la confiance de mon peuple. »"
 news.1720.a: "Bien-aimé de son peuple, pas des militaires"
 news.1721.t: "[GetNewspaperHeader]Pakalitha Mosisili élue Premier ministre du Lesotho"
 news.1721.d: "Dans le cadre d'une transition pacifique du pouvoir marquant la maturation démocratique du Lesotho, Pakalitha Mosisili, 53 ans, a prêté serment en tant que Premier ministre après que son parti, le Congrès du Lesotho pour la démocratie (LCD), ait obtenu une majorité écrasante lors des deuxièmes élections post-militaires du pays. L'ancien professeur d'université et adjoint de longue date du défunt Premier ministre Ntsu Mokhehle a prêté serment devant le roi Letsie III, s'engageant à donner la priorité à la revitalisation économique et à la réconciliation politique après des années de troubles. L'ascension de Mosisili complète une évolution politique remarquable pour le dirigeant britannique qui a survécu à la période d'exil des années 1970 et a contribué à reconstruire la démocratie, héritant désormais d'une nation toujours aux prises avec un chômage de 40 % et les conséquences de la tentative de coup d'État royal de 1994. Les observateurs internationaux ont salué le processus électoral généralement équitable, même si les partis d'opposition ont crié au scandale sur des irrégularités présumées dans 25 circonscriptions - des tensions que le nouveau dirigeant doit résoudre de toute urgence pour maintenir la stabilité dans cette fragile démocratie de montagne entourée par la domination économique de l'Afrique du Sud."
 news.1721.a: "La démocratie du Lesotho assurée"
 news.1722.t: "[GetNewspaperHeader]Le coup d'État en Mauritanie renverse Mohamed Mahmoud Ould Louly"
 news.1722.d: "Lors d'un coup d'État soudain et sans effusion de sang, le président mauritanien Mohamed Mahmoud Ould Louly a été renversé par un groupe d'officiers militaires de haut rang, mettant ainsi fin à son règne de 18 mois. La junte, dirigée par le colonel Mohamed Khouna Ould Haidalla, a pris le pouvoir au petit matin, dissolvant le gouvernement de Louly et suspendant la constitution. Des témoins ont rapporté que des troupes ont encerclé des bâtiments gouvernementaux clés dans la capitale, et la radio d'État a annoncé la formation d'un nouveau Comité militaire pour le salut national pour « restaurer la stabilité et résoudre les crises de la nation ». Louly, qui a lui-même accédé au pouvoir lors d'un coup d'État en 1979, serait assigné à résidence. Le coup d'État fait suite à un mécontentement croissant face aux luttes économiques et à la gestion par Louly du conflit en cours au Sahara occidental. Les réactions internationales se font attendre, mais les analystes régionaux craignent une nouvelle instabilité au Sahel."
 news.1722.a: "Le Sahara est un endroit impitoyable"
 news.1723.t: "[GetNewspaperHeader]Le Royaume du Swaziland déclare son indépendance !"
 news.1723.d: "Dans un moment historique pour l'Afrique australe, le Royaume du Swaziland a officiellement déclaré son indépendance de la domination coloniale britannique, mettant ainsi fin à près de 66 ans de protectorat. Le roi Sobhuza II, le vénéré Ngwenyama (Lion) du Swaziland, a présidé les célébrations jubilatoires alors que l'Union Jack était abaissé et que le drapeau swazi rouge, bleu et jaune était hissé pour la première fois en tant que nation souveraine. Des milliers de personnes se sont rassemblées dans les rues de Mbabane, chantant des chants traditionnels et brandissant des banderoles, tandis que les anciens des tribus accomplissaient des rites sacrés pour bénir la nouvelle ère. Le haut-commissaire britannique Sir Francis Loyd a officiellement remis le pouvoir, saluant la transition pacifique du Swaziland vers l'autonomie. Le royaume nouvellement indépendant, riche en patrimoine culturel et en ressources naturelles, est désormais confronté aux défis de la construction nationale au milieu d'un continent toujours aux prises avec la décolonisation. Les dirigeants mondiaux, notamment le Royaume-Uni et l'Afrique du Sud voisine, ont étendu leur reconnaissance, même si des questions subsistent quant aux liens économiques et à l'avenir politique du Swaziland sous sa monarchie absolue. Vive le Swaziland !"
 news.1723.a: "Vive le Swaziland !"
 news.1724.t: "[GetNewspaperHeader]Sobhuza II dissout le Parlement et la Constitution"
 news.1724.d: "Dans une affirmation radicale de l'autorité royale, le roi Sobhuza II du Swaziland a dissous le Parlement, annulé la constitution et interdit tous les partis politiques, déclarant un retour à la « gouvernance traditionnelle » sous la couronne. La proclamation surprise, lue à la radio nationale par le Premier ministre, le prince Makhosini Dlamini, citait la « corruption d'inspiration étrangère » et les « politiques partisanes qui divisent » comme menaces à l'unité du Swaziland. Les unités de police et d'Imbokodvo (Garde royale) ont scellé les bâtiments gouvernementaux de la capitale, tandis que les régiments traditionnels organisaient des marches symboliques à travers le royaume montagneux. Le monarque de 74 ans - le souverain ayant régné le plus longtemps au monde - a justifié cette décision comme étant nécessaire pour préserver les coutumes swazies contre la « démocratie à l'occidentale », qui, selon lui, alimentait les discordes tribales. Des dirigeants de l'opposition, notamment des membres du Congrès de libération nationale de Ngwane, auraient été assignés à résidence. Le Commonwealth a exprimé sa « grave préoccupation », tandis que l'Afrique du Sud, le principal partenaire économique du Swaziland, est restée silencieuse. Les analystes avertissent que le décret cimente la dernière monarchie absolue d'Afrique, laissant incertain le sort des réformes promises lors de l'indépendance cinq ans auparavant."
 news.1724.a: "La dernière monarchie absolutiste d'Afrique ?"
 news.1725.t: "[GetNewspaperHeader]Le monarque le plus ancien de l'histoire, Sobhuza II, est décédé"
 news.1725.d: "Le roi Sobhuza II du Swaziland, dont le règne de 82 ans s'étend sur deux guerres mondiales, la fin du colonialisme britannique et la naissance de l'indépendance de son pays, est décédé à la résidence royale d'Embo. Le vénéré Ngwenyama (Lion) du Swaziland est décédé paisiblement entouré des membres de la famille royale après des semaines de santé déclinante, plongeant le royaume montagneux dans une période de deuil officiel de deux ans. Monté sur le trône alors qu'il était enfant en 1899 sous la reine régente Labotsibeni, Sobhuza II a conduit le Swaziland du statut de protectorat à l'indépendance pacifique en 1968, puis a consolidé son pouvoir en abolissant la démocratie parlementaire en 1973 pour devenir le dernier monarque absolu d'Afrique. Figure imposante de l'autorité traditionnelle, il a préservé la culture swazie dans un contexte de modernisation, prenant plus de 70 épouses et engendrant plus de 200 enfants tout en équilibrant la diplomatie de l'époque de la guerre froide. En l'absence de successeur immédiat, un conseil royal secret sélectionnera le prochain roi parmi ses fils, laissant l'avenir de cette monarchie stratégiquement incertain sous le regard attentif des puissances régionales. Les Nations Unies ont mis leurs drapeaux en berne, tandis que les hommages affluent de toute l'Afrique et du Commonwealth."
 news.1725.a: "Un homme plus célèbre que son propre pays"
 news.1726.t: "[GetNewspaperHeader]Mswati III couronné roi du Swaziland"
 news.1726.d: "Dans un spectacle d'anciens rituels swazis et de faste moderne, le prince Makhosetive Dlamini, 18 ans, a été officiellement couronné roi Mswati III, dernier monarque absolu d'Afrique, après une régence de trois ans après la mort de son père Sobhuza II. Des dizaines de milliers de sujets se sont rassemblés au Kraal royal de Ludzidzini, où des jeunes filles aux seins nus ont présenté des tiges de roseau (symbolisant la loyauté) tandis que des guerriers en peau de léopard exécutaient la danse sacrée de la royauté Incwala. L'adolescent éduqué à Oxford, choisi par les aînés royaux plutôt que ses demi-frères aînés, hérite désormais d'un royaume en transition, confronté à des pressions en faveur de réformes démocratiques tout en maintenant le système de gouvernance traditionnelle Tinkhundla. Le ministre sud-africain des Affaires étrangères, Pik Botha, était présent en évidence alors que les diplomates occidentaux boycottaient les liens du Swaziland pendant l'apartheid, bien que Mswati ait promis dans son premier décret de « protéger les coutumes swazies de toute ingérence étrangère ». Les analystes se demandent si le monarque passionné de moto, qui devient le plus jeune souverain du monde, peut faire face à la montée du chômage des jeunes et à la crise du VIH tout en conservant le contrôle à toute épreuve de son père. Le sacrifice de 500 bovins du couronnement s'est terminé par un avertissement effrayant du conseil de Liqoqo : « Un roi règne, ou il n'est pas roi. »"
 news.1726.a: "Va-t-il défaire la politique absolutiste de son père ?"
 news.1727.t: "[GetNewspaperHeader]L'indépendance de la République du Botswana !"
 news.1727.d: "Sous un ciel animé de feux d'artifice et des échos des chants de célébration de la pina, l'Union Jack est descendue pour la dernière fois dans le Bechuanaland alors que minuit sonnait, donnant naissance à la toute nouvelle démocratie d'Afrique : la République du Botswana. Une foule euphorique de 20 000 personnes, dont des chefs de tribus drapés de peaux de léopard et des dignitaires britanniques, a éclaté lorsque Seretse Khama, l'héritier du trône de Bangwato, formé à Cambridge, a prêté serment présidentiel dans un stade jonché de sable. \"Nous montrerons au monde qu'un État africain peut prospérer grâce à la tolérance et au droit\", a déclaré Khama, qui a surmonté l'exil britannique grâce à son mariage interracial avec l'actuelle Première dame Ruth Williams. La cérémonie de passation des pouvoirs a vu le prince Édouard, duc de Kent, remettre à contrecoeur la masse de l'autorité coloniale au poing de Khama - un transfert symbolique pour ce vaste territoire désertique sans diamants autrefois considéré comme « le morceau le plus pauvre de l'Empire ». Le régime de l'apartheid sud-africain, qui avait fait pression sur Londres pour absorber le Bechuanaland, n'a visiblement envoyé aucune délégation. Avec seulement 12 kilomètres de routes asphaltées et 22 diplômés universitaires dans tout le pays, les défis du Botswana sont considérables, mais ses fondements démocratiques - un contraste radical avec les troubles de la Rhodésie voisine - ont gagné une reconnaissance rapide de l'ONU et un optimisme prudent à l'étranger. Alors que le nouveau drapeau blanc-bleu-noir se levait, l'éleveur de bétail Ramocha Petlele a saisi l'ambiance : « Les Britanniques nous appelaient une « réserve de main-d'oeuvre ». Aujourd'hui, nous devenons maîtres de notre sol."
 news.1727.a: "Bonne chance au peuple Tswana !"
 news.1728.t: "[GetNewspaperHeader]Quett Masire élu président du Botswana"
 news.1728.d: "Dans le cadre d'une transition de pouvoir sans heurts saluée comme un triomphe pour la démocratie africaine, le vice-président Quett Ketumile Joni Masire a prêté serment aujourd'hui en tant que deuxième président du Botswana après le départ à la retraite de son père fondateur, Sir Seretse Khama. L'ancien professeur d'école et journaliste agricole de 55 ans a prêté serment sur une Bible setswana usée à l'Assemblée nationale, s'engageant à défendre « l'intégrité à toute épreuve » de la démocratie la plus stable du continent. Cette passation marque le premier changement de direction du Botswana depuis l'indépendance en 1966, le président sortant Khama - aujourd'hui gravement atteint d'un cancer du pancréas - regardant depuis un fauteuil roulant son protégé prendre les commandes d'une économie en croissance rapide. \"Nous prouverons que la bonne gouvernance n'est pas de la sorcellerie, mais le fruit d'une vision claire\", a déclaré Masire devant les chefs de tribus en manteau de peau de lion, faisant référence à ses projets ambitieux de diversification au-delà des mines de diamants d'Orapa qui ont alimenté une croissance annuelle de 11% sous Khama. Les observateurs internationaux ont noté l'absence de faste militaire - un contraste frappant avec les coups d'État qui ont balayé les États voisins - puisque Masire a conservé l'ensemble du cabinet de Khama. Le nouveau chef est confronté à des défis immédiats : les villages frappés par la sécheresse exigent des projets d'approvisionnement en eau, tandis que des rumeurs circulent concernant le successeur de Khama à la tête de la tribu Bangwato. Le régime de l'apartheid sud-africain, de plus en plus isolé, a tranquillement félicité l'homme qui négociait autrefois les exportations de boeuf du Botswana - un signe de la réputation de Masire en tant que négociateur pragmatique. Alors que le soleil se couchait sur le Kalahari, les commerçantes du centre commercial principal de Gaborone exprimaient un espoir prudent : « Seretse nous a donné l'indépendance. Maintenant, Rra Masire doit nous apprendre la prospérité. »"
 news.1728.a: "Le Botswana, joyau du Kalahari"
 news.1729.t: "[GetNewspaperHeader]Festus Mogae élu président du Botswana"
 news.1729.d: "Au cours d'une cérémonie mêlant tradition setswana et formalité constitutionnelle, Festus Gontebanye Mogae a prêté serment aujourd'hui en tant que troisième président du Botswana, marquant une autre étape démocratique pour la république la plus stable d'Afrique. L'économiste de 59 ans formé à Oxford a prêté serment à l'Assemblée nationale, plaçant la main sur un exemplaire relié en cuir de la constitution alors que le président sortant Sir Ketumile Masire passait la masse de cérémonie - un transfert symbolique de leadership dans ce pays riche en diamants qui n'a jamais connu de coup d'État. Mogae, qui était vice-président de Masire depuis 1992, hérite d'une économie florissante mais fait face à des défis croissants, notamment le deuxième taux de prévalence du VIH/SIDA le plus élevé d'Afrique et le chômage croissant des jeunes. \"Nous combattrons ce fléau moderne avec la même détermination que nous avons combattu autrefois contre la sécheresse et la pauvreté\", a déclaré le nouveau président, faisant référence à son expérience d'ancien économiste du FMI et architecte de la prudence budgétaire du Botswana. Son investiture a suscité les éloges des dirigeants du monde entier, le secrétaire général de l'ONU, Kofi Annan, ayant salué le Botswana comme « un phare de la démocratie dans une mer agitée ». La transition intervient à un moment délicat, alors que la baisse des prix des diamants met à l'épreuve la résilience économique du Botswana."
 news.1729.a: "Le Botswana commence à ressembler à un État à parti unique"
 news.1730.t: "[GetNewspaperHeader]L'Afrique du Sud promulgue le droit de vote des homosexuels, une première en Afrique."
 news.1730.d: "Dans une décision historique qui a eu des répercussions sur tout le continent, l'Assemblée constitutionnelle d'Afrique du Sud a inscrit aujourd'hui le droit de vote des citoyens LGBTQ+ dans sa constitution finale post-apartheid, devenant ainsi le premier pays africain à garantir explicitement l'égalité politique quelle que soit l'orientation sexuelle. La clause historique, adoptée avec le soutien massif de l'assemblée dirigée par l'African National Congress, fait partie de ce que le président Nelson Mandela a salué comme « la déclaration des droits la plus progressiste au monde ». La disposition - enfouie dans les vastes protections anti-discrimination de l'article 9 (3) - a survécu à l'opposition féroce des chefs traditionnels et des groupes religieux conservateurs, les membres du Parti de la liberté Inkatha se retirant lors du vote final. Le juge de la Cour constitutionnelle Albie Sachs, qui a défendu cette mesure, a déclaré depuis la tribune : \"Aujourd'hui, nous affirmons que le vote appartient à parts égales au mineur, à l'agriculteur et au militant gay qui marche pour la dignité.\" Les organisations internationales de défense des droits de l'homme ont célébré cette décision comme une rupture radicale avec les lois sur la sodomie de l'époque coloniale toujours en vigueur dans toute l'Afrique, tandis que le président zimbabwéen Robert Mugabe, qui a récemment qualifié les homosexuels de « pires que les cochons », aurait annulé une visite d'État prévue. Alors que l'aube se levait sur la Montagne de la Table, les militants LGBTQ+ du Cap ont dansé devant le Parlement, brandissant la nouvelle constitution aux côtés de drapeaux arc-en-ciel. \"Nous avons combattu les chaînes de l'apartheid\", a déclaré le militant Simon Nkoli, séropositif et rayonnant. \"Maintenant, nous contribuons à construire une démocratie où aucun amour n'est illégal.\""
 news.1730.a: "Ce n'est pas pour rien qu'on l'appelle la nation arc-en-ciel !"
 news.1731.t: "[GetNewspaperHeader]La création du Zimbabwe-Rhodésie"
 news.1731.d: "Dans une tentative extraordinaire mais contestée de mettre fin à la guerre civile la plus sanglante d'Afrique, la colonie britannique rebelle de Rhodésie a été reconstituée aujourd'hui sous le nom de Zimbabwe-Rhodésie sous la direction de son premier Premier ministre noir, l'évêque Abel Muzorewa. Le gouvernement de transition - un accord fragile de partage du pouvoir entre le Front rhodésien du leader de la minorité blanche Ian Smith et des nationalistes noirs modérés - a immédiatement été confronté au scepticisme international et au rejet de la guérilla marxiste. Lors d'une cérémonie tendue à minuit au parlement de Salisbury, Muzorewa a prêté allégeance au drapeau de la nouvelle république (conservant les armoiries de la Rhodésie mais avec des rayures noires ajoutées) tandis que 5 000 colons blancs chantaient God Save the Queen à l'extérieur - un clin d'oeil surréaliste à la Couronne qu'ils espèrent encore pouvoir légitimer leur État. Le compromis constitutionnel réserve 28 % des sièges au Parlement aux Blancs (représentant 4 % de la population), incitant le ZAPU de Joshua Nkomo et le ZANU de Robert Mugabe à intensifier la guerre dans la brousse. « C'est le théâtre de l'indépendance », s'est moqué du président tanzanien Julius Nyerere, tandis que le gouvernement britannique Thatcher a ostensiblement refusé de reconnaître l'indépendance."
 news.1731.a: "Une transition vers la paix"
 news.1732.t: "[GetNewspaperHeader]Robert Mugabe déclare la République du Zimbabwe"
 news.1732.d: "Alors que les Union Jacks sont baissés pour la dernière fois et que les guérilleros marxistes dansent dans les rues, Robert Mugabe a prêté serment aujourd'hui en tant que premier Premier ministre noir du Zimbabwe, achevant ainsi la dernière décolonisation majeure de la Grande-Bretagne en Afrique. Lors d'une cérémonie ensoleillée au stade Rufaro, le prince Charles a remis les instruments constitutionnels à l'ancien révolutionnaire - désormais vêtu d'un costume d'affaires sobre - alors que 35 000 citoyens rugissaient d'approbation et que les soldats rhodésiens blancs se tenaient au garde-à-vous avec inquiétude. La naissance du Zimbabwe fait suite à l'effondrement du compromis de courte durée entre le Zimbabwe et la Rhodésie, la victoire électorale écrasante de Mugabe choquant ceux qui craignaient que ses guérilleros du ZANU n'imposent des représailles communistes. « Un mauvais chapitre de l'oppression est clos », a déclaré le dirigeant de 56 ans, étendant une réconciliation inattendue à la minorité blanche : « Vous êtes désormais aussi Zimbabwéen que moi. » Ses paroles ont apaisé les craintes d'un exode massif parmi les 200 000 Blancs conservant la moitié des terres arables, même si des unités blindées ont discrètement encerclé les banlieues riches de Salisbury."
 news.1732.a: "Les échecs de la suprématie blanche laissés au grand jour"
 news.1733.t: "[GetNewspaperHeader]Le conflit Gukurahundi"
 news.1733.d: "Une ombre sombre s'est abattue sur la jeune démocratie du Zimbabwe alors que le Premier ministre Robert Mugabe déploie la célèbre Cinquième Brigade entraînée par la Corée du Nord dans une campagne de répression brutale contre la minorité Ndebele, faisant des milliers de morts dans ce que les survivants appellent « la pluie qui emporte l'ivraie » - le sens effrayant de « Gukurahundi ». Après avoir écrasé le parti ZAPU de son rival politique Joshua Nkomo, le régime dominé par les Shona de Mugabe a transformé le Matabeleland en une zone de massacre, avec des villages entiers détruits par des soldats procédant à des « ratissages d'armes ». Des témoins oculaires font état de charniers près de la mine Antelope, d'exécutions publiques au camp de Bhalagwe et de disparitions forcées d'enseignants et de chefs Ndebele. La Commission catholique pour la Justice et la Paix estime le nombre de morts à 20 000, bien que le gouvernement qualifie ces allégations de « propagande tribale ». Les observateurs internationaux restent silencieux, distraits par la géopolitique de la guerre froide, tandis que Mugabe consolide le régime du parti unique. Dans les townships de Bulawayo, des rumeurs se répandent selon lesquelles un génocide se déroulerait derrière la façade d'unité postcoloniale du Zimbabwe - une amère trahison de la réconciliation promise à l'indépendance. Alors que la Cinquième Brigade se retire, laissant des communautés traumatisées, l'indifférence du monde crée un précédent terrifiant pour les mouvements de libération de l'Afrique devenus oppresseurs."
 news.1733.a: "L'unité du Zimbabwe déjà brisée ?"
 news.1734.t: "[GetNewspaperHeader]Mugabe annonce la réconciliation des Blancs"
 news.1734.d: "Dans un acte de pardon stupéfiant, le Premier ministre zimbabwéen, Robert Mugabe, a tendu aujourd'hui un rameau d'olivier à la minorité blanche, déclarant que « la guerre est véritablement terminée » dans un discours télévisé - alors même que les masses blanches quittent en masse le pays. Le même dirigeant qui avait autrefois juré que le gouvernement s'approprierait les grandes propriétés blanches qualifiait désormais les agriculteurs blancs de « patriotes » et garantissait leurs droits de propriété, tandis que le massacre par sa Cinquième Brigade des Ndebeles extrémistes noirs en quête de réforme agraire reste ignoré. Cet acte de bonne foi intervient alors que l'économie du Zimbabwe vacille, les donateurs occidentaux menaçant de réduire leur aide en raison de violations des droits humains. \" Pansons les blessures de tous les Zimbabwéens \", a proclamé Mugabe, flanqué de chefs d'entreprise blancs nerveux - un contraste frappant avec sa rhétorique enflammée des années 1980. Les analystes politiques soupçonnent une démarche calculée visant à soutenir les exportations agricoles en déclin, tandis que les survivants Ndebele des townships de Bulawayo se demandent pourquoi la réconciliation les exclut. Alors que le monde applaudit le « pragmatisme » de Mugabe, les critiques soulignent l'amère ironie : des milliers de Noirs assassinés par le régime Smith, tandis que la minorité blanche - autrefois alliée de l'apartheid - bénéficie désormais d'un statut protégé en échange de la stabilité économique. La question sans réponse reste lourde : s'agit-il d'une véritable guérison, ou simplement d'un autre chapitre du manuel de survie de l'homme fort ?"
 news.1734.a: "Les craintes d'un sentiment anti-blanc étaient injustifiées"
 news.1735.t: "[GetNewspaperHeader]L'indépendance de la République du Malawi"
 news.1735.d: "À minuit pile, le Protectorat britannique d'Afrique centrale a cessé d'exister alors que le drapeau rouge, noir et vert du Malawi s'est levé sur une foule en liesse, marquant la naissance de la 37e nation indépendante d'Afrique. Le Dr Hastings Kamuzu Banda - le « Lion du Malawi » formé aux États-Unis - a prêté serment en tant que Premier ministre devant 30 000 sujets, promettant de transformer cette partie du pays du « jardin oublié de la Grande-Bretagne en un fier État africain ». La cérémonie de passation de pouvoir au terrain de polo de Zomba a été pleine de contradictions : des cornemuses écossaises ont joué aux côtés de batteurs mganda tandis que des fonctionnaires blancs agrippaient nerveusement leurs casques coloniaux de cérémonie. Banda, vêtu de son homburg noir emblématique et de son costume trois pièces, a prononcé un discours enflammé en chichewa et en anglais, avertissant que \"la liberté signifie la discipline\", tout en faisant déjà allusion à des tendances autoritaires. \"Pas de paresseux, pas de grèves stupides\", a-t-il tonné, tandis que les responsables coloniaux échangeaient des regards inquiets. Contrairement aux visions socialistes de la Zambie voisine et de la Tanzanie, l'indépendance du Malawi s'accompagne d'un alignement pro-occidental - un choix stratégique pour cette nation enclavée qui dépend du Mozambique sous contrôle portugais pour ses routes commerciales. Tandis que le duc britannique de Kent louait la « transition ordonnée » du Malawi, l'interdiction rapide par Banda des partis d'opposition et sa déclaration de « président à vie » en quelques semaines allaient bientôt révéler les contours les plus sombres de son règne."
 news.1735.a: "Une autre grande nation rejoint le continent africain"
 news.1736.t: "[GetNewspaperHeader]Hastings Banda transforme le Malawi en dictature à parti unique"
 news.1736.d: "Six ans jour pour jour après l'indépendance, le Premier ministre Hastings Kamuzu Banda a complètement aboli la démocratie, déclarant le Malawi État à parti unique sous son règne absolu par le biais d'un coup d'État constitutionnel. Le Parlement - désormais un organe d'approbation du Parti du Congrès du Malawi (MCP) - a voté à l'unanimité pour installer le dirigeant de 62 ans au poste de « Président à vie », achevant ainsi sa transformation de libérateur en autocrate. Cette décision officialise ce que beaucoup craignaient depuis que Banda a commencé à emprisonner les critiques l'année dernière, y compris les ministres fondateurs comme Henry Chipembere qui ont osé remettre en question sa politique pro-occidentale. Vêtu de son costume trois pièces caractéristique et agitant un fouet à mouche lors d'un rassemblement organisé, Banda a justifié la prise de pouvoir comme étant nécessaire pour empêcher le « chaos tribal », en disant aux citoyens : « Je suis votre médicament - avalez-moi amer ou doux ». L'opposition a été systématiquement écrasée, les Jeunes Pionniers du Malawi, membres de l'aile jeunesse, agissant comme des défenseurs de l'idéologie, tandis que la redoutée branche spéciale de la police fait taire la dissidence. La presse a été muselée, les universités purgées et même les minijupes interdites au motif qu'elles étaient « non africaines »."
 news.1736.a: "Une autre grande nation rejoint le continent africain"
 news.1737.t: "[GetNewspaperHeader]Bakili Muluzi élu président du Malawi"
 news.1737.d: "Dans un tremblement de terre électoral, l'ancien ministre Bakili Muluzi a renversé le dernier « président à vie » d'Afrique, mettant ainsi fin au règne d'une main de fer de 30 ans du Dr Hastings Kamuzu Banda avec une victoire écrasante aux premières élections multipartites du Malawi. Des foules enthousiastes ont envahi les rues de Blantyre, arrachant les portraits de l'autocrate de 96 ans tandis que la police se tenait à l'écart - une scène autrefois impensable dans un pays où les dissidents étaient régulièrement torturés ou « disparaissaient ». Muluzi, un homme d'affaires de 51 ans qui a fui les purges de Banda, a remporté 47 % des voix sous la bannière de son Front démocratique uni (UDF), promettant de démanteler l'appareil dictatorial. \"Aujourd'hui, nous enterrons la peur\", a-t-il déclaré en brandissant des menottes symbolisant les prisonniers politiques libérés, notamment le chef de l'opposition Chakufwa Chihana, qui a perdu des doigts à cause des interrogateurs de la prison de Banda. Le dictateur nonagénaire, qui fait désormais l'objet d'enquêtes pour corruption, a reconnu sa défaite les lèvres tremblantes après que les observateurs du Commonwealth ont confirmé l'équité du vote. Sa chute est due aux institutions mêmes qu'il a créées - les parlementaires autrefois fidèles du MCP qui se sont retournés contre lui après que les donateurs internationaux ont gelé l'aide. Alors que les vendeurs vendaient des T-shirts « Kamuzu No More » devant le quartier général fermé de la redoutable milice des Jeunes Pionniers, les analystes ont averti que Muluzi héritait d'une nation en faillite avec des institutions vidées. Pourtant, lorsque le nouveau président s'est agenouillé pour embrasser le tarmac de l'aéroport de Chileka - où les exilés reviennent maintenant - la foule en larmes a su : le long hiver du Malawi était enfin dégelé."
 news.1737.a: "Une autre grande nation rejoint le continent africain"
 news.1738.t: "[GetNewspaperHeader]Bingu wa Mutharika élu président du Malawi"
 news.1738.d: "L'économiste et ancien responsable de la Banque mondiale, Bingu wa Mutharika, a prêté serment aujourd'hui en tant que troisième président démocratiquement élu du Malawi, marquant un autre transfert pacifique du pouvoir dans une nation autrefois synonyme de dictature. Cet étranger de 71 ans, candidat à un programme anti-corruption, a battu le successeur du président sortant Bakili Muluzi, trié sur le volet, lors d'élections tendues qui ont mis à l'épreuve la démocratie vieille de dix ans au Malawi. Devant une foule de 20 000 personnes au stade Kamuzu, du nom du dictateur qu'il a autrefois servi comme fonctionnaire, Mutharika s'est engagé à donner la priorité à la sécurité alimentaire et à la réforme économique. « L'ère des greniers vides est révolue », a-t-il déclaré, faisant référence à la famine qui a paralysé le dernier mandat de Muluzi. Son discours de victoire a adopté un ton conciliant, même si des tensions couvent avec son propre parti : le Front démocratique uni (UDF) de Muluzi, qui a expulsé Mutharika en pleine campagne pour avoir refusé ses demandes de favoritisme. Les observateurs internationaux ont salué le vote comme étant largement équitable, malgré les tentatives de l'UDF de manipuler les médias d'État. Le véritable drame s'est produit lorsque des unités de l'armée ont encerclé les centres de décompte des voix - non pas pour prendre le pouvoir, mais pour empêcher le vol des bulletins de vote, un rare exemple africain de neutralité militaire."
 news.1738.a: "Une autre grande nation rejoint le continent africain"
 news.1739.t: "[GetNewspaperHeader]Samora Machel décède dans la catastrophe du Tupolev Tu-134"
 news.1739.d: "Dans une sombre transition éclipsée par les intrigues de la guerre froide, l'ancien ministre des Affaires étrangères Joaquim Chissano a prêté serment aujourd'hui en tant que président du Mozambique à la suite du mystérieux accident d'avion qui a tué le leader révolutionnaire Samora Machel. Le pragmatique de 47 ans a prêté serment devant un congrès du parti FRELIMO en deuil, ses mains fermes contrastant fortement avec le charisme fougueux de Machel, alors que des soupçons persistent quant à une éventuelle implication sud-africaine dans la catastrophe aérienne mortelle près de la frontière de l'apartheid. Chissano hérite d'une nation en crise - ravagée par l'insurrection de la RENAMO soutenue par l'Afrique du Sud, avec 900 000 personnes confrontées à la famine et aux subventions soviétiques qui s'évaporent à cause des réformes du [sov.GetLeader]. Dans son discours inaugural, le dirigeant d'éducation française a signalé un changement radical par rapport à l'orthodoxie marxiste : « Nous devons parler avec les ennemis, même ceux qui sont armés », a-t-il déclaré, faisant allusion aux négociations secrètes déjà en cours avec les rebelles de la RENAMO. Chissano hérite d'une nation en crise - ravagée par l'insurrection de la RENAMO soutenue par l'Afrique du Sud, avec 900 000 personnes confrontées à la famine et aux subventions soviétiques qui s'évaporent à cause des réformes du [sov.GetLeader]. Dans son discours inaugural, le dirigeant d'éducation française a signalé un changement radical par rapport à l'orthodoxie marxiste : « Nous devons parler avec les ennemis, même ceux qui sont armés », a-t-il déclaré, faisant allusion aux négociations secrètes déjà en cours avec les rebelles de la RENAMO."
 news.1739.a: "Une tragédie pour le monde marxiste-léniniste"
 news.1740.t: "[GetNewspaperHeader] Joaquim Chissano devient président du Mozambique"
 news.1740.d: "Avec le béret révolutionnaire de son prédécesseur placé symboliquement sur une chaise vide, Joaquim Chissano a assumé aujourd'hui la présidence du Mozambique dans des circonstances propices aux troubles. Pourtant, ses premiers actes suggèrent que la prochaine grande transformation politique de l'Afrique pourrait être en cours. L'ancien chef des renseignements de 47 ans, a prêté serment 72 heures seulement après le crash d'avion mortel de Samora Machel près de la frontière sud-africaine, a immédiatement rompu avec le marxisme pur et dur du leader assassiné. Dans un discours télévisé au cours duquel les conseillers du Kremlin se sont agrippés aux accoudoirs, Chissano a déclaré les droits de propriété privée, a accueilli le retour des agriculteurs portugais en exil et, de manière plus surprenante, a annoncé des pourparlers en coulisses avec les rebelles de la RENAMO : « Même l'arbre de la révolution a parfois besoin d'être élagué. » Les capitales occidentales ont réagi avec un optimisme prudent, tandis que la vieille garde du FRELIMO de Maputo marmonnait une trahison. Ce qui rend le pari de Chissano extraordinaire, c'est son timing : alors que les commandos sud-africains poursuivent leurs raids de l'autre côté de la frontière et 1,5 million de personnes déplacées, le nouveau président démantèle le dogme socialiste pendant que les balles volent. Son atout : les assurances secrètes de Washington et de Londres selon lesquelles l'aide du FMI arrivera s'il maintient le délicat équilibre."
 news.1740.a: "Le socialisme tient bon au Mozambique"
 news.1741.t: "[GetNewspaperHeader]Le Mozambique passe à une démocratie multipartite"
 news.1741.d: "Dans une rupture historique avec son passé marxiste, le gouvernement FRELIMO du Mozambique a ratifié aujourd'hui une nouvelle constitution pluraliste, légalisant les partis d'opposition après près de deux décennies de régime à parti unique. Le président Joaquim Chissano, autrefois un révolutionnaire pur et dur, a signé les réformes en compagnie d'évêques catholiques et de diplomates occidentaux - un témoignage visuel de son étonnant pivot idéologique alors que la guerre froide dégelait. Ces changements interviennent dans le cadre de pourparlers secrets de cessez-le-feu avec les rebelles de la RENAMO, dont les partisans des États-Unis et de l'époque de l'apartheid font désormais pression pour l'inclusion politique. \"La démocratie ne s'importe pas comme le poisson en conserve\", a prévenu Chissano, soucieux de susciter une dissidence alignée sur les Soviétiques dans les rangs du FRELIMO. Pourtant, la nouvelle charte garantit la liberté de la presse, des tribunaux indépendants et, surtout, le droit des anciens colons portugais de récupérer leurs propriétés nationalisées. Les analystes notent d'amères ironies : les mêmes guérilleros de la RENAMO qui ont massacré les villageois se préparent désormais à faire campagne, tandis que les héros de guerre du FRELIMO doivent rivaliser avec les capitalistes qu'ils ont autrefois emprisonnés. Avec des élections prévues pour 1994, le pari du Mozambique en fait le dernier État de guerre civile d'Afrique à miser la paix sur les bulletins de vote plutôt que sur les balles - un test pour savoir si la démocratie peut guérir les blessures que le marxisme ne pouvait pas guérir."
 news.1741.a: "Se distingue de son cousin l'Angola"
 news.1742.t: "[GetNewspaperHeader]Armando Guebuza élu président"
 news.1742.d: "le fidèle Armando Guebuza a remporté la présidence du Mozambique avec 63,7 % des voix, marquant le premier transfert démocratique de pouvoir du pays depuis l'indépendance et cimentant sa transformation d'un État révolutionnaire marxiste en une démocratie multipartite stable. L'homme d'affaires de 61 ans et ancien ministre de l'Intérieur, connu sous le nom de \"Ndazenha\" (Le Terminator) pour ses tactiques de guerre impitoyables, est désormais confronté au paradoxe de concilier ses qualités de héros de la libération avec un pragmatisme favorable aux investisseurs. Le discours de victoire de Guebuza au stade Machava de Maputo a touché une double corde sensible : il promet de poursuivre les réformes économiques de Chissano tout en promettant de « récupérer l'esprit révolutionnaire » contre la pauvreté. Son plan en cinq points cible la corruption et l'électrification rurale, mais les sceptiques notent que ses vastes propriétés immobilières illustrent l'enrichissement des élites qu'il condamne. Le parti RENAMO de l'opposant Afonso Dhlakama a crié à la fraude, bien que les observateurs de l'UE aient déclaré le vote \"crédible bien qu'imparfait\", reflétant les tensions persistantes dues à la guerre civile qui a tué un million de personnes. Alors que Guebuza se prépare à gouverner le nouveau géant gazier d'Afrique, tous les regards se tournent vers la question de savoir si ce vétéran endurci peut résister aux tentations autoritaires qui ont condamné tant d'autres mouvements de libération devenus gouvernements."
 news.1742.a: "Un parti unique dans une démocratie multipartite ?"
 news.1743.t: "[GetNewspaperHeader]Décès d'Agostinho Neto"
 news.1743.d: "La lutte de libération de l'Angola a perdu aujourd'hui son visionnaire fondateur lorsque le président Agostinho Neto a succombé à un cancer dans un hôpital de Moscou, laissant derrière lui une nation qui saigne encore de la guerre civile et des combats par procuration de la Guerre froide. Le médecin devenu chef de guérilla, dont la rhétorique marxiste a autrefois électrisé les mouvements de libération africains, est décédé quatre ans seulement après avoir conduit le Mozambique à l'indépendance du Portugal - trop tôt pour voir son rêve d'une utopie socialiste s'effondrer sous le sabotage et l'effondrement économique de l'Afrique du Sud. Le Premier ministre soviétique Kossyguine et le général cubain Ochoa veillaient sur leur lit de mort, tandis que de retour chez eux, les militants du MPLA drapaient le palais présidentiel de noir. L'héritage de Neto est déjà fracturé : salué par le bloc de l'Est comme le « Che de l'Afrique », il préside pourtant à une collectivisation ratée qui a laissé les étagères vides. Son célèbre dernier poème, \"Départ\", diffusé à midi sur la radio d'État, n'a fait qu'approfondir le mystère : s'agissait-il d'un dirigeant qui a trop sacrifié pour l'idéologie, ou dont la vision a été interrompue par ses ennemis ? Alors que la nation se prépare à des rituels de deuil à la soviétique, le véritable drame se déroule dans la bataille de succession entre les forces sud-africaines au sud."
 news.1743.a: "Ils préservent son corps comme Lénine ?"
 news.1744.t: "[GetNewspaperHeader]Le MPLA renonce au marxisme-léninisme"
 news.1744.d: "Dans un changement sismique qui se répercute dans toute l'Afrique de l'après-guerre froide, le parti au pouvoir en Angola, le MPLA, a officiellement renoncé aujourd'hui au marxisme-léninisme lors de son congrès extraordinaire, échangeant le marteau et la faucille contre la social-démocratie après 16 ans de régime aligné sur l'Union soviétique. Le président José Eduardo dos Santos, lisant des notes rédigées à Washington par de nombreux suspects, a déclaré que \"le temps des dogmes est terminé\" devant 2 000 délégués stupéfaits - certains pleurant, d'autres brûlant les cartes du parti dans la cour du palais Futungo de Luanda. La capitulation idéologique ouvre la voie à des élections multipartites sous la supervision de l'ONU, concrétisant ainsi les Accords de Bicesse qui ont mis fin à l'implication de l'Afrique du Sud et de Cuba dans la guerre civile en Angola. Mais cette décision fracture la vieille garde du MPLA : les généraux formés par les Soviétiques se plaignent désormais de la « trahison capitaliste », tandis que les rebelles de l'UNITA la considèrent comme « une marionnette qui change de vêtements ». Les diplomates occidentaux applaudissent la mort du « dernier régime marxiste d'Afrique », mais les bidonvilles de Luanda racontent une autre histoire : des fermes collectives en ruine côtoient de nouvelles concessions Mercedes alors que les revenus pétroliers enrichissent la nomenklatura. Alors que dos Santos garde le contrôle des médias d'État et des forces de sécurité, les analystes se demandent : l'Angola a-t-il vraiment abandonné le régime du parti unique, ou l'a-t-il simplement rebaptisé ? La réponse pourrait déterminer si la guerre la plus longue d'Afrique prendra enfin fin - ou si elle entrera dans une nouvelle phase."
 news.1744.a: "La paix en Angola est proche"
 news.1745.t: "[GetNewspaperHeader]Anerood Jugnauth élu Premier ministre de Maurice 1982"
 news.1745.d: "Dans le cadre d'un changement politique décisif, Sir Anerood Jugnauth a pris ses fonctions de Premier ministre de Maurice après une victoire écrasante de son Mouvement Socialiste Militant (MSM) aux élections générales de 1982. Le leader charismatique, qui a auparavant occupé des postes ministériels, est désormais confronté au défi de diriger la nation insulaire à travers des réformes économiques et un changement social. Son ascension marque une nouvelle ère dans la politique mauricienne, mettant fin à la longue domination du Parti travailliste. Les observateurs surveillent de près si ses promesses de stabilité et de progrès se concrétiseront. Plus de mises à jour à suivre."
 news.1745.a: "Une démocratie stable dans l'océan Indien"
 news.1746.t: "[GetNewspaperHeader]Navin Ramgoolam élu Premier ministre de Maurice en 1995"
 news.1746.d: "Dans un revirement politique spectaculaire, le Dr Navin Ramgoolam, fils du père fondateur de Maurice, Sir Seewoosagur Ramgoolam, a été élu Premier ministre après le triomphe de son Parti travailliste mauricien (MLP) aux élections générales de 1995. Le médecin de 47 ans formé à Londres, à la tête d'une coalition avec le Mouvement Militant Mauricien (MMM), a accédé au pouvoir en battant le gouvernement MSM du Premier ministre Sir Anerood Jugnauth, marquant la fin de 13 années de domination politique de Jugnauth. La victoire de Ramgoolam marque un retour à la tête du Parti travailliste après plus d'une décennie, avec des électeurs embrassant ses promesses de modernisation, de réformes de la protection sociale et de revitalisation économique. Les analystes politiques notent que sa victoire représente également un changement de génération dans la politique mauricienne, puisque le fils du premier Premier ministre du pays prend désormais la barre. Des défis restent cependant à relever, car Ramgoolam doit équilibrer les demandes de la coalition tout en s'attaquant à des problèmes urgents tels que le chômage et les pressions de la mondialisation sur les industries sucrière et textile de Maurice."
 news.1746.a: "Un bouleversement politique"
 news.1747.t: "[GetNewspaperHeader]Anerood Jugnauth élu Premier ministre de Maurice 2000"
 news.1747.d: "Dans un retour politique époustouflant, Sir Anerood Jugnauth a prêté serment en tant que Premier ministre de Maurice pour la troisième fois après une victoire électorale décisive de son Mouvement Militant Socialiste (MSM) et de son partenaire de coalition, le Mouvement Militant Mauricien (MMM). L'homme d'État vétéran de 70 ans, qui a été Premier ministre de 1982 à 1995 puis président, a profité du mécontentement du public à l'égard du gouvernement travailliste de Navin Ramgoolam pour obtenir une forte majorité parlementaire. Les élections de 2000 marquent un renversement de fortune dramatique pour Jugnauth, dont l'alliance avec le MMM de son ancien rival Paul Bérenger s'est avérée imbattable. La coalition a fait campagne sur des promesses de revitalisation économique et de stabilité politique après des années de stagnation perçue. Les observateurs politiques notent que cet accord de partage du pouvoir - dans lequel Jugnauth devrait ensuite céder le pouvoir à Bérenger - représente un compromis sans précédent dans la politique mauricienne. Le retour de Jugnauth à la politique active après la présidence de cérémonie démontre son influence durable, alors qu'il est désormais confronté au défi de réformer l'économie mauricienne tout en gérant les tensions de la coalition."
 news.1747.a: "Maurice est une démocratie modèle"
 news.1748.t: "[GetNewspaperHeader]Paul Bérenger élu Premier ministre de Maurice en 2003"
 news.1748.d: "À un moment historique pour la politique mauricienne, Paul Bérenger, chef du Mouvement Militant Mauricien (MMM), a prêté serment en tant que nouveau Premier ministre du pays à la suite d'un transfert de pouvoir pré-arrangé du leader sortant Sir Anerood Jugnauth. Ce franco-mauricien de 57 ans entre dans l'histoire en tant que premier non-hindou et première personne d'origine européenne à occuper ce poste, marquant un changement important dans la démocratie ethniquement diversifiée de l'île. La transition respecte un pacte électoral de 2000 entre le MMM de Bérenger et le MSM de Jugnauth, dans lequel Jugnauth avait accepté de se retirer après trois ans en faveur de son partenaire de coalition. Alors que certains critiques remettent en question le caractère non électif de ce transfert, ses partisans le saluent comme une démonstration mûre de compromis politique dans la démocratie consensuelle de Maurice. Bérenger, figure de l'opposition de longue date connue pour sa rhétorique enflammée et ses tendances socialistes, est désormais confronté au défi de maintenir la croissance économique tout en s'attaquant aux inégalités. Son mandat sera étroitement surveillé comme un test pour déterminer si les modes de vote traditionnellement basés sur l'appartenance ethnique évoluent à Maurice."
 news.1748.a: "Quelle autre agréable nation insulaire africaine"
 news.1749.t: "[GetNewspaperHeader]Navin Ramgoolam élu Premier ministre de Maurice 2005"
 news.1749.d: "Le Dr Navin Ramgoolam a prêté serment pour son deuxième mandat de Premier ministre après que son Parti travailliste (PTR) ait obtenu une majorité écrasante aux élections législatives de 2005. La coalition Alliance Sociale du leader de 58 ans, qui comprenait le Mouvement Militant Mauricien (MMM), a vaincu de manière convaincante le gouvernement MSM/MMM de Paul Bérenger, marquant un renversement politique dramatique cinq ans seulement après sa précédente défaite. Le retour de Ramgoolam au pouvoir marque un mandat renouvelé en faveur de la modernisation économique et des réformes de la protection sociale. Faisant campagne sur des promesses de stimuler les investissements étrangers, de renforcer les services publics et de lutter contre les inégalités de revenus, sa victoire reflète le mécontentement de l'opinion publique à l'égard de la gestion économique de l'administration Bérenger. Ce résultat réaffirme également l'héritage politique de son père, Sir Seewoosagur Ramgoolam, premier Premier ministre de Maurice. Les analystes politiques notent que cette élection confirme le retour de Ramgoolam comme force dominante dans la politique mauricienne. Cependant, avec ses partenaires de la coalition MMM occupant des postes ministériels clés, le nouveau gouvernement est confronté au défi de maintenir l'unité tout en tenant ses promesses de réformes ambitieuses. "
 news.1749.a: "Maurice, comme toujours, est connue pour sa flexibilité politique"
 news.1750.t: "[GetNewspaperHeader]Des mercenaires français soutiennent le coup d'État maoïste aux Comores"
 news.1750.d: "Les îles Comores, nouvellement indépendantes, ont été plongées dans la tourmente à la suite d'une violente tentative de coup d'État qui aurait été soutenue par des mercenaires français et des militants maoïstes. Les responsables locaux affirment que le complot, qui s'est déroulé quelques semaines seulement après l'indépendance de l'archipel de la France le 6 juillet 1975, visait à renverser le président Ahmed Abdallah et à installer un régime marxiste-léniniste-maoïste aligné sur les mouvements révolutionnaires de gauche en Afrique. Des rapports indiquent que Bob Denard, le célèbre chef mercenaire français impliqué dans plusieurs coups d'État en Afrique, pourrait avoir orchestré l'opération aux côtés des insurgés maoïstes comoriens. Des témoins décrivent des échanges de tirs dans la capitale, Moroni, alors que les forces gouvernementales affrontaient les factions rebelles. La tentative de coup d'État fait suite à des tensions latentes entre le gouvernement modéré d'Abdallah et les radicaux de gauche cherchant à resserrer leurs liens avec la Chine et le régime socialiste tanzanien. La France a nié toute implication officielle, mais des fuites de renseignements suggèrent que des éléments voyous du SDECE (renseignement français) pourraient avoir facilité le recrutement de mercenaires. L'incident fait craindre un conflit par procuration de la guerre froide dans l'océan Indien, les puissances occidentales et communistes se disputant l'influence sur les îles stratégiquement situées."
 news.1750.a: "L'argent l'emporte toujours sur l'idéologie pour les mercenaires"
 news.1751.t: "[GetNewspaperHeader]Les mercenaires français soutiennent le contre-coup d'État et Ahmed Abdallah revient au pouvoir"
 news.1751.d: "Lors d'un assaut nocturne dramatique, le président déchu des Comores, Ahmed Abdallah, a violemment repris le pouvoir avec une force de plus de 50 mercenaires français dirigée par le célèbre soldat de fortune Bob Denard, renversant le régime socialiste révolutionnaire d'Ali Soilih lors d'un coup d'État qui a fait des dizaines de morts. L'opération marque la réaffirmation secrète de l'influence de la France sur son ancienne colonie trois ans seulement après l'éviction d'Abdallah en 1975, mettant fin à l'expérience maoïste radicale de Soilih qui avait aligné les îles sur la Chine et la Tanzanie. Des témoins oculaires rapportent que les mercenaires de Denard - dont certains auraient des liens avec les renseignements français - contrôlent désormais des bâtiments gouvernementaux clés et forment le noyau d'une nouvelle Garde présidentielle, plusieurs d'entre eux ayant obtenu la citoyenneté comorienne dans ce que les critiques appellent le début d'un gouvernement fantôme dominé par les mercenaires. Ce violent changement de pouvoir, condamné par l'OUA comme une violation flagrante de la souveraineté malgré les dénégations officielles de la France, inaugure ce qui deviendra la dictature d'Abdallah qui durera 13 ans et marque le début des 20 ans d'emprise de Denard sur la politique comorienne à travers quatre coups d'État ultérieurs."
 news.1751.a: "Bob Denard va-t-il laisser les Comores se reposer ?"
 news.1752.t: "[GetNewspaperHeader]Ahmed Abdallah assassiné"
 news.1752.d: "Le président des Comores Ahmed Abdallah, le dirigeant soutenu par la France qui a gouverné par intermittence depuis 1972, a été abattu dans son palais lors d'une altercation nocturne avec sa propre garde présidentielle. L'homme fort de 70 ans, qui avait été rétabli au pouvoir lors du coup d'État mercenaire de Bob Denard en 1978, est mort sous une pluie de coups de feu au milieu de ce qui semble avoir été une lutte de pouvoir au sein de son appareil de sécurité. Les premiers rapports suggèrent que l'assassinat a été orchestré par des éléments mécontents de la garde dirigée par des mercenaires, peut-être avec l'approbation tacite de Paris, lassé des opérations voyous de Denard. Cet assassinat marque une fin violente au deuxième règne de 13 ans d'Abdallah - une période dominée par le règne de l'ombre de Denard, au cours de laquelle le commandant mercenaire français contrôlait effectivement l'archipel tout en détenant le titre officiel de « commandant de la garde ». Quelques semaines plus tôt, Abdallah avait signé un décret controversé accordant à Denard et à ses mercenaires la citoyenneté comorienne à vie, alimentant les tensions. Alors que Denard aurait fui vers l'Afrique du Sud, l'assassinat plonge ce pays stratégiquement situé de l'océan Indien dans une nouvelle incertitude, faisant craindre une nouvelle prise de pouvoir soutenue par l'étranger dans un pays qui a connu au moins 20 coups d'État ou tentatives de coup d'État depuis son indépendance en 1975."
 news.1752.a: "Le père fondateur des Comores est mort, tragique."
 news.1753.t: "[GetNewspaperHeader]Azali Assoumani orchestre un coup d'État militaire aux Comores"
 news.1753.d: "Le 30 avril 1999, à l'aube, le colonel Azali Assoumani a renversé le gouvernement intérimaire du président Tadjidine Ben Said Massounde, marquant ainsi le quatrième coup d'État réussi aux Comores depuis l'indépendance. L'ancien chef de l'armée, âgé de 41 ans, a organisé la prise de pouvoir militaire avec une résistance minimale, dissolvant l'Assemblée nationale et suspendant la constitution 11 jours seulement avant les élections prévues qui auraient parachevé la fragile transition démocratique du pays. Le coup d'État s'est produit alors que les Comores étaient au bord de la désintégration, l'île d'Anjouan étant en rébellion ouverte depuis 1997. Assoumani a justifié ses actions comme étant nécessaires pour « empêcher la partition de la nation », affirmant que les dirigeants civils n'avaient pas réussi à résoudre la crise de sécession. Les critiques ont toutefois considéré cette décision comme une prise de pouvoir de la part de l'élite militaire, soulignant les liens étroits d'Assoumani avec les réseaux de mercenaires qui ont longtemps dominé la politique comorienne. La réaction internationale a été rapide, l'Union africaine suspendant l'adhésion des Comores et les donateurs gelant l'aide. Le coup d'État a paradoxalement renforcé les sécessionnistes d'Anjouan, qui ont profité du vide du pouvoir pour déclarer de facto leur indépendance."
 news.1753.a: "Un nouveau coup d'État aux Comores ?"
 news.1754.t: "[GetNewspaperHeader]Azali Assoumani passe à un régime civil"
 news.1754.d: "Trois ans après avoir pris le pouvoir lors d'un coup d'État militaire en 1999, le colonel Azali Assoumani est officiellement passé à un régime civil après avoir remporté une élection présidentielle contestée, marquant la dernière tentative des Comores de stabiliser son cycle chronique de coups d'État et de rébellions. L'ancien putschiste de 44 ans a revendiqué la victoire aux élections d'avril 2002, un vote boycotté par les principaux partis d'opposition et critiqué par les observateurs comme étant imparfait. Son investiture complète une transition soigneusement gérée de trois ans qui l'a vu démissionner de l'armée, réécrire la constitution et remettre temporairement le pouvoir à un gouvernement intérimaire civil avant de revenir en tant que dirigeant « élu ». Cette décision intervient alors que l'archipel fragile reste divisé, l'île d'Anjouan étant toujours en rébellion de facto. Assoumani s'est engagé à mettre en oeuvre un nouveau système de partage du pouvoir (« Accords de Fomboni de 2001 ») qui accorde une présidence tournante entre les trois îles principales - une concession aux pressions séparatistes. Pourtant, les critiques l'accusent d'orchestrer une façade démocratique, soulignant sa dépendance continue à l'égard des militaires loyalistes et la répression de la dissidence. Les réactions internationales restent prudentes, l'Union africaine levant les sanctions mais les donateurs occidentaux refusant de les reconnaître pleinement. La transition marque le premier transfert pacifique des Comores depuis l'indépendance, bien qu'il ait été orchestré par le putschiste lui-même."
 news.1754.a: "La démocratie en Afrique est une force imparable"
 news.1755.t: "[GetNewspaperHeader]L'indépendance de la République de Zambie"
 news.1755.d: "L'histoire a été écrite aujourd'hui lorsque le drapeau britannique a été abaissé pour la dernière fois et que la bannière verte, orange, noire et rouge de la nouvelle République de Zambie a flotté fièrement à sa place. À minuit, la nation a célébré son indépendance tant attendue de la domination coloniale britannique, marquant ainsi la naissance du 37e État souverain d'Afrique. Des milliers de Zambiens en liesse ont rempli les rues de Lusaka, chantant, dansant et applaudissant alors que le premier président du pays, le Dr Kenneth Kaunda, prêtait serment. Dans un discours émouvant, le président Kaunda a déclaré : « Aujourd'hui, nous nous avançons en tant que peuple libre, uni dans notre diversité et déterminé à construire une nation de paix, de progrès et de prospérité pour tous. La transition vers l'indépendance intervient après des décennies de lutte et de négociations, l'ancienne Rhodésie du Nord se libérant enfin de l'emprise de l'Empire britannique. La nouvelle nation, riche en cuivre et en espoir, affronte désormais avec optimisme les défis de l'autonomie gouvernementale."
 news.1755.a: "Une nation d'une pure beauté, non plus réprimée"
 news.1756.t: "[GetNewspaperHeader]Kenneth Kaunda abolit le Barotseland et en fait la province de l'Ouest"
 news.1756.d: "Dans une démarche audacieuse visant à renforcer l'unité nationale, le président Kenneth Kaunda a officiellement dissous le royaume semi-autonome du Barotseland, l'intégrant à la Zambie en tant que nouvelle province occidentale. La décision, annoncée aujourd'hui dans le cadre de la loi sur le gouvernement local de 1969, met fin à des années de négociations et de tensions entre le gouvernement central et la monarchie Lozi. L'établissement royal de Barotse, dirigé par Litunga Sir Mwanawina Lewanika III, jouissait depuis longtemps d'un statut spécial sous la domination britannique, avec un certain degré d'autonomie préservée après l'indépendance en 1964. Cependant, le président Kaunda a déclaré que « la Zambie doit être une nation indivisible », soulignant que l'autonomie régionale pourrait menacer la cohésion nationale. Les réactions ont été mitigées. Alors que certains célèbrent cette démarche comme une étape vers une Zambie unifiée, les traditionalistes et militants Lozi l'ont condamnée comme une « trahison » de l'Accord du Barotseland de 1964, qui promettait l'autonomie. Des manifestations sont attendues à Mongu, l'ancienne capitale du Barotseland, où la loyauté envers les Litunga reste forte."
 news.1756.a: "L'autonomie de ce pseudo-État était certainement déjà sur la glace"
 news.1757.t: "[GetNewspaperHeader]Frederick Chiluba remporte les élections ouvertes en Zambie"
 news.1757.d: "Lusaka, Zambie - Dans une victoire éclatante qui marque la fin d'une époque, Frederick Chiluba et son Mouvement pour la démocratie multipartite (MMD) ont accédé au pouvoir, battant le président de longue date Kenneth Kaunda lors des premières élections libres et équitables en Zambie depuis 1968. Les résultats officiels montrent que Chiluba a obtenu une écrasante majorité de 76 % des voix, un rejet décisif des 27 ans de règne de Kaunda et de son système d'État à parti unique. Des milliers de personnes sont descendues dans la rue pour célébrer, scandant « L'heure est venue ! » - le cri de ralliement du MMD - tandis que le syndicaliste de 49 ans devenu président élu promettait une « nouvelle aube pour la démocratie ». Kaunda, le dernier dirigeant africain survivant de l'ère de l'indépendance, a concédé gracieusement, déclarant : « Le peuple a parlé et je respecte sa volonté ». Son parti, l'UNIP, qui a conduit la Zambie à la liberté en 1964, est désormais confronté à un avenir incertain après avoir dominé la politique pendant près de trois décennies."
 news.1757.a: "La démocratie multipartite est désormais la norme en Zambie"
 news.1758.t: "[GetNewspaperHeader]Levy Mwanawasa remporte les élections ouvertes en Zambie"
 news.1758.d: "Lors d'élections historiques marquant le troisième transfert pacifique du pouvoir en Zambie depuis l'indépendance, Levy Mwanawasa, du Mouvement pour la démocratie multipartite (MMD), a été déclaré président à l'issue d'un scrutin âprement contesté. Les résultats officiels annoncés par la Commission électorale de Zambie (ECZ) ont donné à Mwanawasa 28,7 % des voix, battant de peu le chef de l'opposition Anderson Mazoka (27,2 %) du Parti uni pour le développement national (UPND) parmi 11 candidats très nombreux. L'élection, saluée comme largement libre et équitable par les observateurs internationaux, a enregistré un taux de participation de près de 70 %. Mwanawasa, 53 ans, avocat et ancien vice-président, hérite d'un pays aux prises avec une pauvreté profonde, des scandales de corruption de l'ère Chiluba et une crise paralysante du VIH/SIDA. Dans son discours de victoire, il s'est engagé à « restaurer l'intégrité du gouvernement » et à lutter contre la corruption, faisant référence aux enquêtes en cours sur les allégations de détournement de fonds de l'ancien président Frederick Chiluba."
 news.1758.a: "La Zambie est désormais une démocratie multipartite bien établie"
 news.1759.t: "[GetNewspaperHeader]L'essor du \"Zamrock\" en Zambie"
 news.1759.d: "Une révolution sonore électrifie la nation alors que Zamrock, le mouvement rock local de Zambie, explose sur la scène, mélangeant des guitares fuzz psychédéliques, des rythmes traditionnels et une fanfaronnade rebelle dans un son différent de tout ce que l'Afrique a jamais entendu. Alimentés par la fierté post-indépendance et les politiques culturelles de « l'humanisme zambien » du président Kaunda, des groupes comme WITCH (We Intend To Cause Havoc), Amanaz et The Peace remplissent les clubs, diffusant des hymnes bruts et riches en riffs qui canalisent les grooves de Hendrix, Sabbath et Zambeat. Leurs paroles, chantées en bemba, nyanja et anglais, abordent tout, de la désillusion politique à l'amour à l'ère de la libération. La star de la scène, Rikki Ililonga, dont le groupe Musi-O-Tunya a enregistré le premier LP rock de Zambie, déclare : \"Nous ne copions pas l'Occident, nous recâblons le rock avec la soul africaine.\" Pendant ce temps, Jagari Chanda, le flamboyant leader de WITCH, tourne sur scène dans un tourbillon de perles et de pattes d'éléphant, hurlant des paroles qui résonnent avec la jeunesse agitée de la Zambie."
 news.1759.a: "Un phénomène spectaculaire"
 news.1760.t: "[GetNewspaperHeader]Jean-Baptiste Ouédraogo Coup d'État de Haute-Voltan"
 news.1760.d: "Dans une prise de pouvoir spectaculaire, les forces armées de Haute-Volta ont renversé le gouvernement du président Saye Zerbo lors d'un coup d'État tôt le matin. Des factions militaires, dirigées par des officiers subalternes mécontents, ont pris d'assaut des installations gouvernementales clés, dissolvant le Comité militaire de redressement pour le progrès national (CMRPN) au pouvoir. Des témoins ont rapporté des coups de feu près du palais présidentiel alors que les troupes fidèles aux putschistes sécurisaient la capitale. Zerbo, qui a lui-même accédé au pouvoir lors d'un coup d'État en 1980, serait en état d'arrestation. Les rebelles accusent son régime de corruption et de ne pas avoir réussi à résoudre la crise économique du pays. Une nouvelle junte, se faisant appeler Conseil du salut du peuple (CSP), a annoncé la suspension de la constitution et un couvre-feu du crépuscule à l'aube. On sait peu de choses sur la direction du groupe, même si des rumeurs suggèrent que le major Jean-Baptiste Ouédraogo pourrait être à sa tête."
 news.1760.a: "Une nation gouvernée uniquement par des juntes militaires"
 news.1761.t: "[GetNewspaperHeader]Saye Zerbo organise un coup d'État en Haute-Voltan"
 news.1761.d: "Dans une prise de pouvoir rapide avant l'aube, les forces armées de Haute-Volta ont destitué le président Sangoulé Lamizana, mettant ainsi fin à son règne de 14 ans, d'abord en tant que chef militaire, puis en tant que civil élu. Le coup d'État, dirigé par le colonel Saye Zerbo, a été annoncé à la radio d'État alors que les troupes se sont emparées des principaux bâtiments gouvernementaux sans résistance. Lamizana, arrivé au pouvoir lors d'un coup d'État en 1966 mais qui a ensuite autorisé des réformes démocratiques limitées, aurait été placé en détention. Le nouvel organe au pouvoir, le Comité militaire de redressement pour le progrès national (CMRPN), a suspendu la constitution, dissous le Parlement et imposé un couvre-feu à l'échelle nationale. Zerbo, ancien ministre des Affaires étrangères, a accusé le gouvernement de Lamizana d'« incompétence chronique » dans un contexte d'aggravation des difficultés économiques et des troubles sociaux. Le coup d'État fait suite à des mois de grèves et d'allégations de corruption. La France, ancienne puissance coloniale, a exprimé son « inquiétude », mais n'a pas condamné la prise de contrôle. Le Ghana et la Côte d'Ivoire voisins n'ont pas encore réagi."
 news.1761.a: "Un autre coup d'État voltanais ?"
 news.1762.t: "[GetNewspaperHeader]Le colonel Sangoulé Lamizana organise un coup d'État en Haute-Volta"
 news.1762.d: "Dans un geste soudain et décisif, les forces armées de Haute-Volta ont renversé le président Maurice Yaméogo après des jours de protestations massives et de grèves à l'échelle nationale. Le coup d'État, dirigé par le lieutenant-colonel Sangoulé Lamizana, a dissous le gouvernement et suspendu la constitution un an seulement après la réélection controversée de Yaméogo. Des milliers de personnes ont célébré dans les rues de Ouagadougou alors que la nouvelle se répandait selon laquelle Yaméogo - dont le régime du parti unique était devenu de plus en plus autoritaire - avait démissionné sous la pression militaire. Des informations indiquent qu'il est assigné à résidence, tandis que son parti au pouvoir, l'Union Démocratique Voltaïque (UDV), a été dissous. Lamizana, le chef d'état-major de l'armée, a annoncé la formation d'un gouvernement militaire provisoire, s'engageant à restaurer la stabilité dans un contexte de crise économique. Le coup d'État fait suite à de violentes manifestations contre les mesures d'austérité et les dépenses somptueuses de Yaméogo, alors que la famine menaçait les campagnes frappées par la sécheresse. La France, ancien dirigeant colonial de la Haute-Volta, a appelé au calme mais n'a pas condamné la prise de pouvoir. La Côte d'Ivoire voisine, avec laquelle Yaméogo entretenait des liens étroits, a exprimé ses « regrets » face aux troubles."
 news.1762.a: "Une Haute Volta panafricaniste et dynamique, écrasée par la botte d'un régime militaire."
 news.1763.t: "[GetNewspaperHeader]La Haute-Volta rebaptisée Burkina Faso"
 news.1763.d: "En rupture historique avec son passé colonial, la Haute-Volta a aujourd'hui abandonné son nom vieux de 24 ans pour devenir le Burkina Faso - « Terre des hommes intègres » - sous la direction révolutionnaire du capitaine Thomas Sankara. Ce changement, annoncé lors d'un rassemblement massif dans la capitale, marque l'étape la plus visible à ce jour dans la transformation radicale de Sankara de la nation ouest-africaine. Le dirigeant de 34 ans, qui a pris le pouvoir lors du coup d'État de l'année dernière, a déclaré que l'ancien nom était une relique de la domination française, faisant référence au système fluvial de la Volta imposé par les cartographes coloniaux. \"Nous rejetons cet héritage d'asservissement\", a proclamé Sankara avant d'acclamer la foule, dévoilant de nouveaux symboles nationaux dont un drapeau rouge et vert et l'hymne \"Une Seule Nuit\". Ce changement de marque accompagne des réformes radicales : de la redistribution des terres aux campagnes de vaccination, le tout sous le slogan de Sankara : « La Patrie ou la mort, nous vaincrons ! (« La patrie ou la mort, nous vaincrons ! »). Les critiques parlent d'autoritarisme, mais les citoyens en liesse peignent les murs de la capitale avec de nouvelles peintures murales de leur « Che Guevara africain ». Les États voisins reconnaissent prudemment le changement, tandis que la France - qui reste le plus grand donateur d'aide au Burkina Faso - ne fait aucun commentaire dans l'immédiat. Une chose est sûre : il faut désormais redessiner la carte du monde."
 news.1763.a: "Le pays des gens honnêtes, comme c'est louable"
 news.1764.t: "[GetNewspaperHeader]Blaise Compaoré prépare un coup d'État contre Sankara au Burkina Faso"
 news.1764.d: "Dans une tournure violente des événements, le leader révolutionnaire du Burkina Faso Thomas Sankara a été assassiné lors d'un coup d'État militaire dirigé par son ancien camarade Blaise Compaoré. Des coups de feu ont éclaté jeudi soir à Ouagadougou alors que des factions rivales s'affrontaient près du complexe présidentiel, faisant au moins 13 morts, dont Sankara, dont le corps a été enterré à la hâte dans une tombe anonyme. Compaoré, autrefois l'allié le plus proche de Sankara, a annoncé la formation d'un nouveau régime, le Front populaire, affirmant que le coup d'État avait évité le « chaos » et a dénoncé les « excès autoritaires » de Sankara. Pourtant, des témoins rapportent des exécutions de loyalistes de Sankara, tandis que la radio d'État diffuse de la musique martiale entre des bulletins laconiques. Ce renversement choque une nation qui célèbre encore les réformes agraires et le défi anti-impérialiste de Sankara. Trois ans seulement après avoir renommé le pays, sa vision d'un Burkina Faso autonome est en ruine. La France et la Côte d'Ivoire, toutes deux accusées d'avoir soutenu le coup d'État, nient toute implication. Mais Compaoré étant longtemps considéré comme plus modéré, les analystes prédisent un dégel rapide avec les puissances occidentales."
 news.1764.a: "Une trahison de gauche ?!"
 news.1765.t: "[GetNewspaperHeader]Blaise Compaoré crée l'OPDLM et renonce au marxisme-léninisme"
 news.1765.d: "Dans un renversement idéologique étonnant, le président Blaise Compaoré a formellement dissous les structures révolutionnaires marxistes-lénines du Burkina Faso, en annonçant la création de l'Organisation pour la démocratie populaire - Mouvement ouvrier (OPD-M). Cette décision marque une rupture totale avec la politique radicale de son prédécesseur, Thomas Sankara assassiné. \"Le Burkina Faso doit rejoindre la communauté des nations\", a déclaré Compaoré lors d'un rassemblement soigneusement organisé, en présence d'officiers militaires et de chefs d'entreprise nouvellement réhabilités. La charte de l'OPD-M rejette explicitement la lutte des classes en faveur de « l'harmonie sociale » et du « réalisme économique » - le code des réformes imminentes du libre marché et du réengagement occidental. Alors que les manifestations étudiantes ont été rapidement réprimées, les diplomates notent le timing judicieux de Compaoré. Avec l'effondrement de l'Union soviétique et l'assouplissement de la politique des alliés panafricanistes de Sankara, comme Rawlings au Ghana, le pivot de Ouagadougou reste largement incontesté."
 news.1765.a: "Un autre homme fort qui a détourné la politique de son pays"
 news.1766.t: "[GetNewspaperHeader]Le chef du POLISARIO, El-Ouali Mustapha Sayed, tué au combat"
 news.1766.d: "Dans un coup dévastateur porté au mouvement indépendantiste du Sahara occidental, le chef du Front Polisario, El-Ouali Mustapha Sayed, a été tué aujourd'hui alors qu'il dirigeait un assaut audacieux contre la capitale mauritanienne. Le révolutionnaire de 28 ans est mort lorsque ses forces de guérilla se sont affrontées avec les troupes mauritaniennes aux portes de Nouakchott, marquant la pénétration la plus poussée des combattants sahraouis en territoire occupé. Des témoins décrivent une bataille chaotique avant l'aube près du palais présidentiel, où la colonne motorisée d'El-Ouali est tombée dans une embuscade après une traversée du désert de 1 200 km. Son corps aurait été exposé par les forces mauritaniennes avant son enterrement secret - une démarche condamnée par les alliés comme étant une « prise de trophée barbare ». La mort du leader incendiaire, qui a transformé le Polisario d'un mouvement étudiant en une formidable armée de libération, plonge la lutte anticoloniale dans l'incertitude. Quelques mois seulement après avoir proclamé la République arabe sahraouie démocratique (RASD), le Polisario est désormais confronté à ses heures les plus sombres alors que le Maroc et la Mauritanie resserrent leur emprise sur les territoires riches en phosphate. L'Algérie a déclaré trois jours de deuil, tandis que la radio de La Havane diffuse un éloge funèbre de Fidel Castro. Pendant ce temps, Rabat célèbre ce qu'elle appelle « la fin du leadership terroriste »."
 news.1766.a: "Le mouvement survivra-t-il sans lui ?"
 news.1767.t: "[GetNewspaperHeader]La République Arabe Sahraouie Démocratique Adhère à l'OUA"
 news.1767.d: "Dans un changement sismique pour la diplomatie africaine, l'Organisation de l'unité africaine a admis aujourd'hui la République arabe sahraouie démocratique (RASD) comme son 51ème État membre, déclenchant le retrait immédiat du Maroc de l'organisation panafricaine. Le vote controversé 26 contre 20, organisé sous haute sécurité au siège de l'OUA, marque une victoire éclatante pour les guérilleros du Front Polisario après huit années de guerre dans le désert contre l'occupation marocaine. La délégation du roi Hassan II a quitté le sommet en trombe, dénonçant ce qu'elle a appelé « l'État fantoche de l'Algérie ». Quelques minutes plus tard, des avions marocains étaient dépêchés pour bombarder les positions du Polisario près du controversé Mur de Sable, alors que la télévision d'État de Rabat déclarait « la souveraineté éternelle » sur le Sahara occidental. Cet aveu est le résultat d'un coup de maître procédural : 19 nations se sont abstenues mais n'ont surtout pas bloqué le quorum de la RASD. Les votes décisifs sont venus de la Libye nouvellement socialiste et de l'Éthiopie de Mengistu, tandis que des modérés comme le Nigéria se sont abstenus. Des célébrations ont éclaté dans les camps de réfugiés près de Tindouf, où le président de la RASD, Mohamed Abdelaziz, a qualifié cela de « le début de la fin du vol colonial ». Pourtant, des défis se profilent : l'administration Reagan a gelé toute aide aux États votants et le Maroc menace désormais de se retirer de toutes les institutions africaines."
 news.1767.a: "Le Maroc va être furieux..."
 news.1768.t: "[GetNewspaperHeader]Le grand mur de sable marocain"
 news.1768.d: "Un imposant mur de sable et de mort serpente désormais à travers le Sahara, visible depuis l'espace alors que le Maroc a achevé la plus longue barrière militaire active au monde après des années de construction secrète. S'étendant de la côte atlantique jusqu'à la frontière algérienne, la « berme » de 2 milliards de dollars combine des fortifications de sable de huit mètres de haut renforcées par sept millions de tonnes de roches, protégées par 160 000 soldats répartis dans des tranchées échelonnées, cinq millions de mines terrestres (une tous les trois mètres) et des grilles radar avancées fournies par des entreprises de défense américaines et françaises. Cette prouesse d'ingénierie monumentale - plus longue que la Grande Muraille de Chine - a permis à Rabat de consolider son contrôle sur 80 % du Sahara occidental contesté depuis 1975, malgré les demandes de l'ONU pour un référendum d'autodétermination. Les guérilleros du Front Polisario, autrefois capables de frappes éclair dans le désert, sont désormais confrontés à un défi impossible : une cavalerie de chameaux contre des fortifications informatisées. Des dossiers déclassifiés du Pentagone révèlent que l'administration Reagan a discrètement approuvé une « aide non létale » pour les systèmes de surveillance électronique de la Berm en 1982, tandis que les avions Mirage français assurent la reconnaissance aérienne. Le coût humain est stupéfiant : des milliers de nomades sahraouis ont été définitivement coupés de leurs pâturages ancestraux, et les groupes de déminage espagnols font état de plus de 2 300 victimes civiles dues aux munitions non explosées. Alors que le Maroc célèbre « l'intégrité territoriale totale », l'Algérie prévient que « les murs construits sur l'occupation tombent toujours », mais pour l'instant, cette monstruosité de 2 700 km se présente à la fois comme une merveille militaire et un sombre symbole du dernier conflit colonial actif d'Afrique, son ombre s'étendant sur les dunes riches en phosphate où le sort d'un peuple reste enseveli."
 news.1768.a: "Ce conflit est-il définitivement gelé ?"
 news.1769.t: "[GetNewspaperHeader]La formation de l'Union africaine"
 news.1769.d: "Au cours d'une cérémonie à l'aube qui a réuni présidents et anciens seigneurs de la guerre, l'Afrique s'est aujourd'hui débarrassée de son héritage postcolonial troublé alors que l'Union africaine a officiellement remplacé l'Organisation de l'unité africaine, vieille de 39 ans. Cette transition historique, marquée par une salve de 21 coups de canon et la libération de 2 002 colombes, représente la tentative la plus audacieuse jamais entreprise par le continent pour faire face à ses crises - des guerres civiles à l'écrasement de la dette - par le biais d'une gouvernance collective renforcée. Le Libyen Kadhafi, qui a financé l'initiative, a stupéfié les délégués en arrivant vêtus de robes traditionnelles plutôt que d'uniforme militaire, déclarant que « les États-Unis d'Afrique commencent aujourd'hui ». Mais les tensions ont éclaté lorsque Mbeki d'Afrique du Sud s'est opposé à une union politique immédiate, tandis que le Nigeria a mis en garde contre les \"pièges néocoloniaux\" dans le partenariat de l'UA avec l'UE. L'ombre des affaires inachevées planait au grand jour : la délégation du Polisario du Sahara occidental se tenait debout alors que le drapeau de la RASD était hissé, tandis que les ministres marocains regardaient avec un visage de pierre. Pendant ce temps, les pays touchés par Ebola ont mis en place des protocoles sanitaires d'urgence."
 news.1769.a: "La même organisation, rebaptisée"
 news.1770.t: "[GetNewspaperHeader]La formation de la Fédération du Mali"
 news.1770.d: "Dans un geste audacieux de vision panafricaine, le Soudan français (Mali moderne) et le Sénégal ont dissous les frontières coloniales pour former la Fédération du Mali, devenant ainsi la première nation africaine indépendante à s'unir volontairement au-delà des clivages ethniques. Le drapeau vert-jaune de la nouvelle fédération a été hissé simultanément à Dakar et à Bamako à minuit, alors que des milliers de personnes acclamaient la naissance d'un État de 4 millions d'habitants s'étendant du Sahara à l'Atlantique. Née de l'imagination des intellectuels enflammés Léopold Sédar Senghor (Sénégal) et Modibo Keïta (Soudan), la fédération a délibérément choisi le nom de l'empire médiéval d'Afrique comme « à la fois mémoire et prophétie ». Mais des fractures apparaissent déjà : Paris aurait fait pression sur la Côte d'Ivoire pour qu'elle abandonne son adhésion, tandis que la base chrétienne de Senghor murmure son inquiétude quant aux tendances socialistes de Keïta. Le gouvernement de De Gaulle, s'efforçant de conserver son influence, a reconnu à contrecoeur la fédération tout en finançant secrètement les séparatistes en Casamance. Pendant ce temps, Nkrumah du Ghana envoie ses félicitations, le qualifiant de \"première pierre de notre édifice continental\"."
 news.1770.a: "Une victoire pour le panafricanisme"
 news.1771.t: "[GetNewspaperHeader]Le Sentier Lumineux déclare la « guerre populaire » au Pérou"
 news.1771.d: "Une faction communiste obscure a déclenché une insurrection rurale à la veille des premières élections démocratiques au Pérou depuis plus d'une décennie. Le Sentier lumineux, un groupe maoïste radical dirigé par le professeur de philosophie Abimael Guzmán, a déclaré aujourd'hui « la lutte armée contre l'État bourgeois » après des attaques simultanées contre des bureaux de vote dans les hauts plateaux andins. Guzmán, qui se fait appeler « la quatrième épée du marxisme » après Marx, Lénine et Mao, a construit un réseau clandestin parmi les paysans indigènes et les étudiants universitaires. Son manifeste rejette à la fois le révisionnisme soviétique et la révolution à la cubaine, promettant de « noyer le Pérou dans le sang pour le purifier avec le communisme ». Le président Fernando Belaúnde Terry a qualifié les rebelles de « poignée de fanatiques », mais des alertes militaires ont été lancées dans tout le sud de la Sierra. Ces attaques surviennent alors que le Pérou est aux prises avec une crise économique et l'héritage d'un régime militaire."
 news.1771.a: "Une victoire pour le panafricanisme"
 news.1772.t: "[GetNewspaperHeader]Fujimori annonce l'opération Victoria"
 news.1772.d: "Dans un discours dramatique à la nation à minuit, le président Alberto Fujimori a lancé la campagne antiterroriste la plus agressive du Pérou à ce jour, baptisée Operación Victoria, marquant une escalade décisive dans la guerre qui dure depuis une décennie contre l'insurrection du Sentier lumineux. L'offensive globale déploie 20 000 soldats dans les bastions rebelles d'Ayacucho, Huancavelica et la haute vallée de Huallaga, combinant des opérations militaires avec des arrestations massives dans le cadre de lois antiterroristes draconiennes récemment promulguées qui autorisent des procès devant des tribunaux militaires anonymes. Fujimori, flanqué de hauts généraux, a annoncé une prime de 50 000 dollars pour toute information menant à la capture du chef du Sentier lumineux Abimael Guzmán, tandis que des équipes d'action civique accompagneront les opérations de combat avec une aide alimentaire dans les zones contestées - une tentative claire de gagner les coeurs et les esprits des communautés autochtones longtemps négligées. L'opération intervient quelques semaines seulement après l'attentat dévastateur des insurgés à Tarata, dans le district de Miraflores à Lima, qui a tué 25 civils, une attaque que le président a qualifiée de « râle d'agonie d'un monstre blessé »."
 news.1772.a: "Une victoire pour le panafricanisme"
 news.1773.t: "[GetNewspaperHeader]Le massacre de Tlatelolco au Mexique"
 news.1773.d: "Une manifestation étudiante pacifique sur la Plaza de las Tres Culturas à Tlatelolco est devenue meurtrière aujourd'hui après que les forces militaires et policières mexicaines ont ouvert le feu sur la foule. Des témoins oculaires rapportent des scènes chaotiques où des soldats, armés de fusils et de baïonnettes, ont encerclé la place et ont commencé à tirer sans discernement. La manifestation, organisée par des militants étudiants exigeant des réformes démocratiques et la fin de la répression gouvernementale, était l'une des nombreuses manifestations précédant les Jeux olympiques de 1968 qui devaient débuter à Mexico. Les autorités affirment que des « agitateurs armés » ont provoqué les violences, mais les survivants insistent sur le fait que les étudiants n'étaient pas armés. Les chiffres des victimes restent flous, les estimations allant de dizaines à plusieurs centaines de morts ou de blessés. Le gouvernement a imposé un black-out médiatique, faisant craindre une dissimulation. Les observateurs internationaux réclament une enquête indépendante alors que l'indignation grandit face à la répression brutale de la dissidence. Il s'agit de l'un des jours les plus sombres de l'histoire moderne du Mexique, jetant une ombre sur les prochains Jeux olympiques et déclenchant un débat féroce sur la violence d'État et les droits de l'homme."
 news.1773.a: "Cela restera à jamais une tache sur le PRI"
 news.1774.t: "[GetNewspaperHeader]Le chef de la junte nigérienne, Seyne Kountché, est décédé"
 news.1774.d: "Niamey, 10 novembre 1987 - Le général Seyni Kountché, le dirigeant militaire qui a pris le pouvoir au Niger lors d'un coup d'État en 1974, est décédé à l'âge de 56 ans des suites d'une maladie prolongée. Kountché, qui a dirigé la nation ouest-africaine pendant plus de 13 ans, est décédé dans un hôpital parisien, laissant derrière lui un héritage de régime autoritaire marqué par l'austérité économique et la répression politique. Ancien colonel de l'armée, Kountché a renversé le premier président du Niger, Hamani Diori, invoquant la corruption et la mauvaise gestion économique. Son régime était caractérisé par un contrôle militaire strict, la répression de la dissidence et des relations tendues avec l'ancienne puissance coloniale, la France. Malgré certains développements infrastructurels, son règne a été critiqué pour ses violations des droits de l'homme et ses libertés politiques limitées. Aucun successeur immédiat n'a été nommé, ce qui suscite des inquiétudes quant à la stabilité de ce pays riche en uranium. Les observateurs attendent les annonces des dirigeants militaires du Niger concernant la transition du pouvoir."
 news.1774.a: "Le Sahel, peu connu pour ses démocraties stables"
 news.1775.t: "[GetNewspaperHeader]Ali Saibou établit un régime civil au Niger et est réélu"
 news.1775.d: "Le président Ali Saibou, chef militaire du Niger devenu président civil, a été réélu lors d'un vote largement incontesté, consolidant ainsi sa transition d'un régime militaire à un gouvernement théoriquement démocratique. Saibou, qui a pris le pouvoir après la mort du chef de longue date de la junte Seyni Kountché en 1987, s'est présenté comme seul candidat sous le nouveau Mouvement National pour la Société de Développement (MNSD), un parti qu'il a créé pour remplacer le régime militaire. L'élection, critiquée par les groupes d'opposition comme étant une façade, a vu Saibou remporter plus de 99 % des voix, les médias d'État la saluant comme une étape vers la stabilité. Depuis son arrivée au pouvoir, Saibou a introduit des réformes politiques limitées, notamment une nouvelle constitution et la légalisation des partis d'opposition - même si les critiques affirment que ces mesures étaient en grande partie symboliques, la dissidence restant étroitement contrôlée. Les observateurs internationaux ont exprimé un optimisme prudent quant à l'abandon par le Niger d'un régime purement militaire, mais restent sceptiques quant à l'engagement de Saibou en faveur d'une démocratisation complète. Les défis économiques, notamment la chute des prix de l'uranium et la sécheresse, continuent de mettre son administration à l'épreuve."
 news.1775.a: "Ces élections sont suspectes"
 news.1776.t: "[GetNewspaperHeader]Mahamane Ousmane élu président du Niger"
 news.1776.d: "Dans une victoire historique pour la démocratie, Mahamane Ousmane a été élu premier président civil du Niger depuis l'indépendance, marquant la fin de 23 ans de régime militaire et de parti unique. Ousmane, économiste de 43 ans et leader de l'Alliance des Forces du Changement (AFC), a battu le candidat du parti au pouvoir, Mamadou Tandja, lors d'un second tour d'élection salué comme le plus juste du Niger à ce jour. Le transfert pacifique du pouvoir intervient après des années de gouvernance autoritaire sous le Mouvement National pour la Société de Développement (MNSD), qui dominait la politique depuis 1974. La victoire d'Ousmane reflète une demande publique généralisée de réforme, les électeurs ayant embrassé ses promesses de transparence économique, d'investissement dans l'éducation et de décentralisation. Les observateurs internationaux ont salué l'élection comme une avancée majeure, même si des défis se profilent, notamment une économie en difficulté, des tensions ethniques et un accord difficile de partage du pouvoir avec le gouvernement dirigé par le MNSD du Premier ministre Hama Amadou."
 news.1776.a: "Le Niger est-il en train de devenir une véritable démocratie ?"
 news.1777.t: "[GetNewspaperHeader]Ibrahim Baré Maïnassara élu président du Niger"
 news.1777.d: "Le colonel Ibrahim Baré Maïnassara a renversé le premier président démocratiquement élu du Niger, Mahamane Ousmane, lors d'un coup d'État sans effusion de sang, mettant brutalement un terme à la fragile expérience démocratique du pays. Le chef militaire a dissous l'Assemblée nationale, suspendu la constitution et s'est déclaré chef d'un nouveau conseil de gouvernement, citant la « paralysie du gouvernement » et les troubles économiques pour justifier sa prise de pouvoir. Maïnassara, ancien chef de l'armée et proche allié du président déchu Ousmane, était déçu par l'impasse politique dans laquelle se trouve le Niger, en particulier par la lutte pour le pouvoir entre Ousmane et le Premier ministre Hama Amadou. La condamnation internationale a été rapide, la France suspendant son aide et les États-Unis appelant au retour à un régime civil. Promettant une transition vers la démocratie, Maïnassara a annoncé des projets d'élections mais n'a proposé aucun calendrier clair. Les observateurs craignent que la brève ère démocratique du Niger - inaugurée il y a à peine trois ans - ne soit écrasée par un régime autoritaire renouvelé."
 news.1777.a: "Une victoire pour la social-démocratie"
 news.1778.t: "[GetNewspaperHeader]Mamadou Tandja élu président du Niger"
 news.1778.d: "Le Niger a tourné la page de son époque militaire turbulente lorsque le colonel à la retraite Mamadou Tandja a été élu président de manière décisive lors des premières élections crédibles du pays depuis le coup d'État de 1996. L'ancien ministre de l'Intérieur de 61 ans a remporté 59,9 % des voix au second tour contre Mahamadou Issoufou, promettant la stabilité après trois ans de régime militaire de transition après l'assassinat de Maïnassara. La victoire de Tandja marque un retour à une gouvernance civile et achève la dernière tentative de restauration démocratique du Niger. L'élection, surveillée par des observateurs internationaux, a été déclarée largement libre et équitable - un contraste frappant avec le vote violent de 1996 qui a porté Maïnassara au pouvoir. Le nouveau président est confronté à d'immenses défis : reconstruire les institutions démocratiques, lutter contre l'insécurité alimentaire chronique et gérer les relations avec les sociétés étrangères d'uranium. Son passé militaire et son appartenance à l'ancien parti au pouvoir, le MNSD, soulèvent la question de savoir si cela représente réellement un changement ou un retour à la politique de la vieille garde."
 news.1778.a: "Une victoire des valeurs conservatrices"
 news.1779.t: "[GetNewspaperHeader]Amílcar Cabral assassiné dans des circonstances mystérieuses"
 news.1779.d: "Amílcar Cabral, fondateur visionnaire et secrétaire général du Parti africain pour l'indépendance de la Guinée et du Cap-Vert (PAIGC), a été tué par balle la nuit dernière dans une embuscade près de son domicile à Conakry, en Guinée. L'icône de la libération de 48 ans, dont le mouvement de guérilla avait mis à genoux l'armée coloniale portugaise, aurait été trahie par d'anciens camarades mécontents dans un complot qui a plongé les luttes de libération de l'Afrique dans la tourmente. Des témoins affirment que Cabral a été arrêté par des hommes armés - prétendument des dissidents du PAIGC - devant le siège du PAIGC et exécuté à bout portant. Les assassins, liés aux services secrets portugais par certaines sources, pourraient avoir exploité les divisions internes liées à la politique marxiste-léniniste de Cabral et à sa volonté d'unité entre la Guinée-Bissau et le Cap-Vert. Le président guinéen Sékou Touré a condamné ce « lâche crime soutenu par l'impérialisme », tandis que la dictature portugaise a nié toute implication. La mort de Cabral survient quelques mois seulement avant la déclaration d'indépendance prévue de la Guinée-Bissau, laissant le projet révolutionnaire du PAIGC dans l'incertitude."
 news.1779.a: "Le père fondateur d'une nation est mort, avec peu d'explications"
 news.1780.t: "[GetNewspaperHeader]João Bernardo Vieira organise un coup d'État"
 news.1780.d: "Lors d'un assaut dramatique avant l'aube, les forces armées fidèles à l'ancien commandant de la guérilla João Bernardo Vieira ont pris d'assaut le palais présidentiel, renversant le président Luís Cabral et dissolvant le gouvernement de Guinée-Bissau. Le coup d'État marque une rupture violente au sein du parti au pouvoir, le PAIGC, six ans seulement après l'indépendance du Portugal. Vieira - un héros de la guerre de libération mais de plus en plus en désaccord avec Cabral - a accusé le gouvernement de « favoritisme tribal » et de mauvaise gestion économique. Le putsch révèle d'âpres divisions entre les factions bissau-guinéennes et capverdiennes au sein du PAIGC d'inspiration marxiste. Cabral, demi-frère du leader révolutionnaire assassiné Amílcar Cabral, aurait été arrêté et exilé. Des témoins ont fait état de tirs dans la capitale alors que les troupes de Vieira s'emparaient d'installations clés. La nouvelle junte a annoncé un « mouvement correctif » pour purger les « élites corrompues », même si les analystes suggèrent que la prise de pouvoir de Vieira découle de rivalités personnelles et de tensions ethniques."
 news.1780.a: "Un coup d'État interpartis en Guinée-Bissau ?"
 news.1781.t: "[GetNewspaperHeader]Le PAIGC renonce au marxisme-léninisme"
 news.1781.d: "Dans un revirement idéologique dramatique, le Parti africain pour l'indépendance de la Guinée et du Cap-Vert (PAIGC) au pouvoir en Guinée-Bissau a officiellement renoncé au marxisme-léninisme lors de son 5e congrès du parti, marquant la fin de ses 35 ans de doctrine révolutionnaire. L'ancien mouvement de libération, qui a été le fer de lance de la lutte armée contre le régime colonial portugais sous la direction d'inspiration marxiste d'Amílcar Cabral, a voté massivement en faveur de l'adoption de la démocratie multipartite et des principes du libre marché, supprimant les références communistes de sa charte et de ses symboles. Le président João Bernardo « Nino » Vieira, l'ancien commandant de la guérilla qui a pris le pouvoir lors d'un coup d'État en 1980, a justifié ce changement radical en déclarant que « le monde a changé et nous devons changer avec lui », citant l'effondrement du bloc soviétique et les pressions économiques croissantes. Cette décision met effectivement fin au système socialiste à parti unique de la Guinée-Bissau, le PAIGC étant désormais confronté à une compétition électorale pour la première fois depuis l'indépendance en 1974. Alors que les personnalités de l'opposition ont accueilli avec prudence les réformes comme étant attendues depuis longtemps, les militants vétérans du parti ont condamné cette décision comme une trahison de la vision révolutionnaire de Cabral, certains partisans de la ligne dure déchirant leurs cartes de membre lors de manifestations émouvantes devant le palais des congrès. Les observateurs internationaux notent que cette transition reflète des reculs idéologiques similaires dans l'Afrique de l'après-guerre froide, alors que les anciens mouvements de libération se démènent pour s'adapter au nouvel ordre mondial et obtenir le soutien financier occidental. Le gouvernement Vieira est désormais confronté au défi de taille de mettre en oeuvre des programmes d'ajustement structurel tout en maintenant son emprise sur le pouvoir dans un paysage politique nouvellement compétitif."
 news.1781.a: "Une autre nation sur le pipeline marxiste-léniniste vers social-démocrate"
 news.1782.t: "[GetNewspaperHeader]L'armée renverse Vieira lors d'un coup d'État sanglant et le président par intérim Sanhá a prêté serment"
 news.1782.d: "L'expérience démocratique turbulente de la Guinée-Bissau s'est effondrée aujourd'hui lorsque des soldats mutins ont renversé l'homme fort de longue date João Bernardo \"Nino\" Vieira après 11 mois de guerre civile, installant le président de l'Assemblée nationale Malam Bacai Sanhá comme président par intérim. Le coup d'État a culminé avec la capitulation spectaculaire de Vieira dans son palais criblé de balles après l'abandon des troupes loyalistes, mettant fin à 19 ans de règne marqué par l'autoritarisme et l'effondrement économique. Le commandant rebelle Ansumane Mané, qui a mené le soulèvement contre les salaires militaires impayés et l'ingérence présumée du Sénégal, a promis une \"transition vers la démocratie\" alors que la fumée s'élevait au-dessus de la capitale. Sanhá, un pilier du PAIGC de 52 ans qui a perdu contre Vieira aux élections de 1994, a prêté serment dans une caserne militaire sous une forte garde armée, devenant ainsi le premier dirigeant civil de Guinée-Bissau depuis le début de la guerre. Son ascension fait suite à l'accord de paix controversé de Lomé, même si les analystes se demandent si le faible gouvernement intérimaire peut contrôler les factions militaires conflictuelles qui ont renversé Vieira. Le dictateur déchu, qui a survécu à sept tentatives de coup d'État, a obtenu l'asile au Portugal après avoir, semble-t-il, négocié sa sortie avec l'ancienne puissance coloniale."
 news.1782.a: "Maudite ingérence sénégalaise !"
 news.1783.t: "[GetNewspaperHeader]Kumba Ialá élu président de Guinée-Bissau"
 news.1783.d: "Dans une réprimande retentissante adressée à l'establishment politique de ce pays déchiré par la guerre, le fougueux chef de l'opposition, Kumba Ialá, a été élu président avec 72 % des voix, marquant le premier transfert démocratique du pouvoir en Guinée-Bissau depuis l'indépendance. L'ancien professeur de philosophie de 48 ans et leader du Parti du renouveau socialiste (PRS) a battu le président par intérim Malam Bacai Sanhá du PAIGC, autrefois dominant, dans une victoire écrasante, capitalisant sur la fureur du public face à la pauvreté et à la mauvaise gestion militaire après la sanglante guerre civile de l'année dernière. Ialá, connu pour son discours charismatique et son chapeau de cowboy blanc caractéristique, a surfé sur une vague de soutien ethnique Balanta et de mécontentement des jeunes jusqu'à la victoire, promettant de « nettoyer les voleurs » au sein du gouvernement. Sa victoire achève la transition difficile de la Guinée-Bissau après le conflit de 1998-99 qui a renversé le dictateur de longue date João Bernardo Vieira, bien que les observateurs de l'UE aient noté de « graves irrégularités » dans le décompte des voix. Le leader sortant Sanhá a reconnu sa défaite, mais le PAIGC - qui a gouverné pendant 25 ans en tant que parti marxiste - est désormais confronté à une crise existentielle après avoir obtenu seulement 28 % de soutien. Des célébrations ont éclaté dans les rues de Bissau, mais les analystes préviennent que le manque d'expérience de Ialá en matière de gouvernement et son style de confrontation pourraient déclencher une nouvelle instabilité dans ce pays enclin aux coups d'État." 
 news.1783.a: "La démocratie pour la première fois en Guinée-Bissau ?"
 news.1784.t: "[GetNewspaperHeader]Henrique Rosa prend le pouvoir après le coup d'État en Guinée-Bissau"
 news.1784.d: "Lors d'un coup d'État qui a mis fin à la dernière expérience démocratique de la Guinée-Bissau, l'armée a nommé le respecté banquier Henrique Rosa au poste de président par intérim après avoir renversé le dirigeant erratique Kumba Ialá, dont le règne de trois ans a plongé la nation dans la paralysie économique. Cette prise de pouvoir sans effusion de sang - le quatrième coup d'État réussi du pays depuis l'indépendance - a vu les soldats s'emparer d'installations clés sans résistance alors que Ialá, connu pour sa rhétorique flamboyante et son non-paiement des fonctionnaires pendant des mois, s'est rendu dans son complexe. Rosa, une économiste apolitique de 55 ans qui a dirigé la Banque centrale dans les années 1990, a prêté serment dans une caserne militaire sous haute surveillance, chargée de diriger une transition de deux ans vers les élections. Le putschiste, le général Veríssimo Correia Seabra, a affirmé que l'armée avait agi pour empêcher « l'effondrement total de l'État », bien que les diplomates soupçonnent que des griefs personnels concernant les salaires impayés ont déclenché la révolte. La réaction internationale a été modérée, l'Union africaine ayant suspendu l'adhésion de la Guinée-Bissau tout en se félicitant discrètement du retrait de Ialá."
 news.1784.a: "La Guinée-Bissau est sur la bonne voie"
 news.1785.t: "[GetNewspaperHeader]João Bernardo Vieira réélu président de la Guinée-Bissau"
 news.1785.d: "Dans une étonnante résurrection politique qui a ébranlé la communauté internationale, l'ancien homme fort militaire de la Guinée-Bissau, João Bernardo \"Nino\" Vieira, a été déclaré président élu après avoir obtenu 52 % des voix, marquant un retour extraordinaire au pouvoir pour l'homme qui a dirigé le pays en tant que dictateur de 1980 à 1999 avant d'être évincé dans une guerre civile sanglante. La victoire controversée de cet homme de 67 ans sur le candidat du PAIGC, Malam Bacai Sanhá, intervient après une campagne entachée d'intimidations militaires et d'irrégularités de vote, les observateurs électoraux ayant remarqué que des soldats armés « surveillaient » les bureaux de vote dans ce que beaucoup considèrent comme un coup d'État en douceur des loyalistes de Vieira en uniforme. Après avoir passé six ans en exil après son renversement en 1999, l'homme fort et rusé a fait campagne en tant que « démocrate réformé » tout en avertissant ses ennemis politiques qu'il « sait où tous les corps sont enterrés » - une référence effrayante à ses 19 années de règne brutal qui ont vu de nombreux opposants disparaître. Son discours de victoire promettait la réconciliation nationale mais a été prononcé sous haute surveillance militaire, soulignant la nature fragile de la démocratie bissau-guinéenne dans un pays qui a connu cinq coups d'État en onze ans. Les réactions internationales ont été mitigées, le Portugal offrant des félicitations prudentes tandis que les diplomates américains expriment en privé leur inquiétude quant aux liens présumés de Vieira avec les trafiquants d'armes angolais et les cartels de la drogue sud-américains qui dominent désormais l'économie souterraine du pays. "
 news.1785.a: "Les cartels constituent le principal problème de la Guinée-Bissau."
 news.1786.t: "[GetNewspaperHeader]António Mascarenhas Monteiro élu président du Cap-Vert"
 news.1786.d: "Dans un moment historique pour la nation, António Mascarenhas Monteiro a été élu nouveau président du Cap-Vert, marquant un changement important dans le paysage politique du pays. Les résultats des élections, annoncés plus tôt dans la journée, confirment la victoire de Monteiro à l'issue d'une campagne âprement contestée qui a mis en avant ses promesses de réforme démocratique, de revitalisation économique et de progrès social. Juriste respecté et ancien président de l'Assemblée nationale, la victoire de Monteiro témoigne d'un espoir renouvelé de transparence et d'unité au Cap-Vert. Les observateurs internationaux ont salué les élections comme étant libres et équitables, tandis que les citoyens de tout l'archipel célèbrent ce nouveau chapitre. Monteiro devrait être inauguré dans les semaines à venir, tandis que le monde entier verra Cabo Verde adopter ce leadership transformateur."
 news.1786.a: "Le Cap-Vert est un phare de démocratie stable dans la Lusosphère"
 news.1787.t: "[GetNewspaperHeader]Aristide Pereira élu président du Cap-Vert"
 news.1787.d: "À un moment historique pour la nation, Aristide Pereira a prêté serment en tant que premier président d'un Cap-Vert indépendant, après la libération officielle du pays de la domination coloniale portugaise. La cérémonie historique, qui s'est tenue aujourd'hui à Praia, marque l'aube d'une nouvelle ère pour l'archipel, avec Pereira - un leader clé du mouvement indépendantiste et co-fondateur du Parti africain pour l'indépendance de la Guinée et du Cap-Vert (PAIGC) - s'engageant à unir la nation et à la guider vers la prospérité. Son leadership devrait donner la priorité à la réconciliation nationale, au développement économique et à la consolidation de la démocratie. Alors que les foules en liesse célèbrent à travers les îles, la communauté internationale étend sa reconnaissance, annonçant l'émergence du Cap-Vert en tant qu'État souverain. Le monde regarde désormais Pereira assumer la tâche monumentale de façonner l'avenir de la république nouvellement indépendante."
 news.1787.a: "Le Cap-Vert est un phare de démocratie stable dans la Lusosphère"
 news.1788.t: "[GetNewspaperHeader]La mort d'Ahmed Sékou Touré"
 news.1788.d: "La nation est plongée dans le chagrin après la mort du président Ahmed Sékou Touré, le fougueux leader indépendantiste et dirigeant inébranlable de la Guinée pendant plus d'un quart de siècle, qui a succombé à une maladie soudaine à l'âge de 62 ans. Figure marquante de la lutte anticoloniale de l'Afrique, Touré a défié la domination française en 1958, conduisant la Guinée à devenir la première nation d'Afrique de l'Ouest à se libérer de la domination coloniale. Sa gouvernance d'une main de fer, marquée à la fois par le zèle révolutionnaire et la répression politique, a façonné le destin du pays à travers des décennies d'isolement et de régime socialiste. Alors que la nouvelle de son décès se répand, des milliers de personnes se rassemblent dans les rues de Conakry, certains pleurant un héros nationaliste, d'autres réfléchissant à un héritage complexe. Le gouvernement a déclaré une période de deuil national, tandis que le monde suit de près la manière dont la Guinée gère cette transition cruciale. La mort de Touré laisse un vide de pouvoir dans une nation habituée à son commandement inflexible, soulevant des questions urgentes sur l'avenir de l'un des États historiquement les plus importants d'Afrique de l'Ouest."
 news.1788.a: "La mort d'un titan"
 news.1789.t: "[GetNewspaperHeader]Lansana Conté instaure un régime civil en Guinée"
 news.1789.d: "À un moment charnière pour la nation, le général Lansana Conté a officiellement fait passer la Guinée à un régime civil, marquant la fin de près de trois décennies de gouvernance militaire après la mort du dirigeant de longue date Ahmed Sékou Touré. Le nouveau président Conté, qui a pris le pouvoir lors d'un coup d'État en 1984, s'est engagé à orienter le pays vers la démocratie, la réforme économique et la réconciliation nationale après des années de régime autoritaire. La cérémonie d'investiture d'aujourd'hui, à laquelle participent des dignitaires et des citoyens pleins d'espoir, marque un changement prudent mais historique pour la Guinée, Conté s'engageant à maintenir la stabilité tout en ouvrant progressivement la participation politique. Les observateurs restent toutefois vigilants, alors que le pays concilie optimisme et défis d'une véritable réforme. La communauté internationale apporte un soutien prudent, reconnaissant ce moment comme un tournant potentiel pour l'avenir de la Guinée."
 news.1790.a: "Y aura-t-il la démocratie en Guinée ?"
 news.1790.t: "[GetNewspaperHeader]Milton Margai décède au pouvoir"
 news.1790.d: "La nation est en deuil suite au décès soudain de Sir Milton Margai, le premier Premier ministre bien-aimé de la Sierra Leone, décédé en exercice à l'âge de 66 ans. Médecin pionnier devenu homme d'État, Margai a conduit le pays à l'indépendance de la Grande-Bretagne en 1961 et était largement respecté pour son leadership modéré, son engagement en faveur de l'unité nationale et ses efforts visant à combler les divisions ethniques. Sa mort laisse un vide profond dans le paysage politique de la jeune nation, les citoyens de tout le pays se réunissant pour réfléchir tranquillement à son héritage de stabilité et d'inclusion. Alors que les procédures constitutionnelles commencent à transférer le pouvoir, des questions se posent sur l'avenir de la fragile démocratie sierra-léonaise. Les hommages affluent de toute l'Afrique et du Commonwealth, honorant Margai en tant que père fondateur qui a placé la nation avant elle. Son décès marque la fin d'une époque et un nouveau chapitre incertain pour la nation qu'il a contribué à bâtir."
 news.1791.t: "[GetNewspaperHeader]Le Siaka Stevens nommé Premier ministre"
 news.1791.d: "Dans le cadre d'un changement radical de pouvoir, Siaka Stevens a prêté serment en tant que nouveau Premier ministre de la Sierra Leone à la suite d'une transition très contestée et politiquement chargée. Stevens, chef du All People's Congress (APC), prend ses fonctions dans un contexte de tensions accrues après des élections contestées et des négociations en coulisses qui ont évité une plus grande instabilité. Connu pour ses manoeuvres politiques astucieuses et ses racines syndicales, Stevens est désormais confronté à la tâche ardue d'unir une nation fracturée tout en relevant des défis économiques urgents. Les partisans célèbrent son ascension comme une victoire de la classe ouvrière, tandis que les critiques mettent en garde contre ses tendances autoritaires. Alors que la Sierra Leone traverse cette période critique, le monde se demande si Stevens maintiendra la démocratie ou orientera la jeune nation vers un gouvernement plus centralisé. Son leadership définira le prochain chapitre de l'ère post-indépendance de la Sierra Leone."
 news.1791.a: "Un digne successeur"
 news.1792.t: "[GetNewspaperHeader]Joseph Saidu Momoh organise un coup d'État contre Siaka Stevens en Sierra Leone"
 news.1792.d: "Freetown, Sierra Leone - Dans le cadre d'une transition de pouvoir sans effusion de sang, le général de division Joseph Saidu Momoh a pris le contrôle de la Sierra Leone, mettant ainsi fin au règne de 17 ans du leader vieillissant Siaka Stevens. La prise de pouvoir tard dans la nuit, décrite par les responsables militaires comme une « transition constitutionnelle » plutôt qu'un coup d'État, a vu Stevens renoncer pacifiquement à son autorité dans un contexte de troubles économiques croissants et de mécontentement public. Momoh, le successeur choisi par Stevens et chef des forces armées de la Sierra Leone, a immédiatement déclaré une « nouvelle ère de responsabilité et de réforme », s'engageant à lutter contre la corruption et à stabiliser l'économie en ruine du pays. Alors que les citoyens accueillent prudemment ce changement, des questions subsistent quant à savoir si Momoh - un membre de longue date du régime - peut réellement rompre avec l'héritage autoritaire de Stevens. Les observateurs internationaux appellent à un retour rapide aux processus démocratiques alors que ce pays d'Afrique de l'Ouest est confronté à son changement politique le plus important depuis son indépendance."
 news.1792.a: "La Sierra Leone, stable et prospère, est-elle au bord du chaos ?"
 news.1793.t: "[GetNewspaperHeader]Un officier de 25 ans, Valentine Strasser, coupe le gouvernement de la Sierra Leone"
 news.1793.d: "Lors d'un assaut époustouflant avant l'aube, le capitaine Valentine Strasser, âgé de 25 ans, a pris le contrôle de la Sierra Leone, devenant ainsi le plus jeune chef de gouvernement du monde après avoir renversé le régime impopulaire de Joseph Momoh. Le chef rebelle au visage de bébé et ses collègues officiers subalternes du Conseil national provisoire de gouvernement (NPRC) ont pris d'assaut la State House en invoquant « une mauvaise gestion économique catastrophique » et la guerre rebelle brutale qui engloutit le pays. Des témoins ont rapporté des tirs nourris près d'installations militaires clés avant que Strasser n'apparaisse à la radio nationale en tenue de combat, annonçant la suspension de la constitution et l'imposition d'un gouvernement militaire « aux mains propres ». Le coup d'État intervient alors que la Sierra Leone est confrontée à un effondrement économique et à une escalade de la violence de la part des rebelles du Front révolutionnaire uni (RUF). Les observateurs internationaux s'inquiètent de la trajectoire instable de ce pays d'Afrique de l'Ouest, tandis que les citoyens épuisés accueillent avec prudence le changement après des années de corruption et de troubles civils. Strasser, diplômé d'Oxford - qui a rejoint l'armée à 16 ans - est désormais confronté à l'immense défi de stabiliser une nation en chute libre, tandis que le monde regarde si ce jeune soldat non expérimenté peut rétablir l'ordre ou plonger la Sierra Leone plus profondément dans le chaos."
 news.1793.a: "Le plus jeune chef d'État du XXe siècle ?"
 news.1794.t: "[GetNewspaperHeader]Coup d'État des étapes bio de Julius Maada"
 news.1794.d: "Lors d'un changement de pouvoir spectaculaire en fin de soirée, le général de brigade Julius Maada Bio a renversé son ancien allié Valentine Strasser, prenant le contrôle de la Sierra Leone quelques semaines seulement avant le retour promis à un régime civil. Le putschiste de 31 ans - qui faisait autrefois partie de la junte NPRC au pouvoir de Strasser - a annoncé la prise du pouvoir dans une émission de radio tendue, accusant le régime déchu de « perdre la direction révolutionnaire » au milieu de la spirale de la guerre civile et de la crise économique que connaît le pays. Le coup d'État sans effusion de sang s'est déroulé lorsque Strasser, apparemment malade et se préparant à des élections démocratiques, a été escorté hors de la State House par les loyalistes de Bio. Bio a immédiatement annoncé une nouvelle « transition vers la démocratie », mais le scepticisme est grand alors que le jeune soldat prend le pouvoir dans un pays ravagé par un conflit alimenté par les diamants et par l'isolement international. Les puissances mondiales appellent à la retenue, tandis que les Sierra Léonais, fatigués par la guerre, sont confrontés à un nouveau changement brutal de leadership - le quatrième en cinq ans. Tous les regards se tournent désormais vers Bio, qui doit naviguer dans des alliances perfides et une insurrection rebelle brutale alors que cette nation meurtrie est en jeu."
 news.1794.a: "Nous ne pouvons qu'espérer contre tout espoir une meilleure Sierra Leone"
 news.1795.t: "[GetNewspaperHeader]Ahmad Tejan Kabbah élu président"
 news.1795.d: "Dans un moment historique pour ce pays ravagé par la guerre, Ahmad Tejan Kabbah, diplomate et économiste chevronné, a prêté serment en tant que premier président démocratiquement élu de la Sierra Leone depuis 1967, mettant ainsi fin à près de cinq années de régime militaire. Cette victoire écrasante, confirmée par les observateurs internationaux, intervient après une période électorale tendue au cours de laquelle les citoyens ont fait la queue pendant des heures pour voter, désespérés de trouver la stabilité après des années de coups d'État, de régime de la junte et d'une guerre civile brutale. Kabbah, un ancien responsable du développement de l'ONU âgé de 64 ans, s'est engagé à rétablir la paix, à reconstruire l'économie et à réintégrer les enfants soldats déplacés par le conflit. Son investiture marque l'ouverture d'un nouveau chapitre fragile mais plein d'espoir pour la Sierra Leone, même si d'énormes défis demeurent, notamment les factions militaires rebelles et la rébellion toujours active du RUF. Les dirigeants du monde saluent la transition comme un triomphe de la démocratie en Afrique de l'Ouest, tandis que les citoyens épuisés osent espérer que cet homme d'État à la voix douce pourra enfin guider leur nation vers le redressement."
 news.1795.a: "Enfin la démocratie et la stabilité en Sierra Leone !"
 news.1796.t: "[GetNewspaperHeader]Johnny Paul Koroma s'empare de Freetown"
 news.1796.d: "Au cours d'un assaut chaotique à l'aube, des mutins armés dirigés par le major Johnny Paul Koroma ont pris d'assaut la capitale, chassant le président démocratiquement élu Ahmad Tejan Kabbah dans une pluie de coups de feu et d'explosions. Le coup d'État - le cinquième en Sierra Leone en six ans - s'est déroulé lorsque des soldats voyous et des alliés rebelles se sont emparés d'installations clés, notamment la State House et la télévision nationale, où Koroma s'est déclaré chef d'un nouveau « Conseil révolutionnaire des forces armées » (AFRC). Kabbah, dont les élections de 1996 ont mis fin au régime militaire, a fui vers la Guinée voisine alors que Freetown sombrait dans l'anarchie, avec des informations faisant état d'exécutions et de pillages. Koroma, un putschiste emprisonné récemment libéré de prison par des mutins, a suspendu la constitution et s'est engagé à « nettoyer » le gouvernement, faisant craindre un retour à une guerre à grande échelle. La communauté internationale, notamment l'ONU et la CEDEAO, a condamné le putsch, tandis que les civils traumatisés se préparent à de nouvelles violences. À peine 15 mois après le début de la démocratie durement gagnée en Sierra Leone, cette prise de pouvoir sanglante replonge le pays dans l'incertitude - avec l'alliance fragile de soldats de Koroma et de rebelles du RUF menaçant de relancer l'un des conflits les plus brutaux d'Afrique "
 news.1796.a: "Un personnage horrible, le peuple doit l'enlever !"
 news.1797.t: "[GetNewspaperHeader]Ahmad Tejan Kabbah revient au pouvoir"
 news.1797.d: "Dans un revers de fortune spectaculaire, le président Ahmad Tejan Kabbah est revenu triomphalement à Freetown, réintégré en tant que dirigeant légitime de la Sierra Leone après un exil de 10 mois à la suite du coup d'État brutal de Johnny Paul Koroma en février. Son rétablissement, imposé par les troupes de la CEDEAO et les forces de l'ECOMOG dirigées par le Nigeria, marque une victoire âprement disputée pour la démocratie sur la junte AFRC-RUF, dont le règne chaotique a vu des exécutions, des pillages effrénés et un effondrement quasi total de l'État. Des milliers de citoyens en extase ont envahi les rues, scandant « Démocratie Don Die ! Alors que Kabbah, escorté par des soldats de maintien de la paix, faisait un signe de la main depuis un véhicule pare-balles. Dans un discours solennel, il s'est engagé à reconstruire la nation brisée, à relancer les pourparlers de paix et à demander des comptes aux responsables des atrocités - même si l'ombre des menaces rebelles persistantes plane. La communauté internationale, y compris l'ONU et les États-Unis, a promis son soutien, mais des défis de taille demeurent : désarmer les soldats rebelles de Koroma, réintégrer les enfants soldats et sauver une économie en ruine. Pour l'instant, les Sierra Léonais osent espérer - c'est la troisième chance de paix pour cette nation résiliente en seulement deux années turbulentes."
 news.1797.a: "Un retour à la normale"
 news.1798.t: "[GetNewspaperHeader]Siaka Stevens forme l'Union du fleuve Mano avec la Guinée, le Libéria et la Côte d'Ivoire"
 news.1798.d: "Dans une démarche audacieuse de coopération régionale, le président Siaka Stevens a uni ses forces avec les dirigeants de la Guinée, du Libéria et de la Côte d'Ivoire pour créer l'Union du fleuve Mano (MRU), une alliance économique et politique historique visant à favoriser le développement, le commerce et la stabilité dans toute l'Afrique de l'Ouest. L'accord, signé aujourd'hui à Freetown, marque un rare moment d'unité dans une région souvent divisée par l'héritage colonial et les tensions de la guerre froide. Stevens, aux côtés d'Ahmed Sékou Touré de Guinée, de William Tolbert du Libéria et de Félix Houphouët-Boigny de Côte d'Ivoire, se sont engagés à renforcer les infrastructures transfrontalières, à harmoniser les tarifs et à promouvoir la sécurité collective - un défi direct aux dépendances postcoloniales persistantes. \"Aujourd'hui, nous écrivons notre propre destin\", a déclaré Stevens, décrivant le MRU comme un outil d'autonomie dans une Afrique en évolution rapide. Les analystes notent le potentiel de l'Union à contrebalancer l'influence étrangère, même si les sceptiques se demandent si les différences idéologiques - entre l'autoritarisme de Stevens, le socialisme de Touré et la position pro-occidentale d'Houphouët-Boigny - peuvent être surmontées. En tant que premier grand bloc régional dirigé conjointement par des États francophones et anglophones, le MRU pourrait redéfinir l'avenir de l'Afrique de l'Ouest - si ses fondateurs parviennent à transformer l'unité sur papier en progrès réel."
 news.1798.a: "Un syndicat nécessaire"
 news.1799.t: "[GetNewspaperHeader]Félix Houphouët-Boigny transfère la capitale ivoirienne à Yamoussoukro"
 news.1799.d: "Dans une annonce surprise qui remodèle le paysage politique du pays, le président Félix Houphouët-Boigny a officiellement désigné sa ville natale ancestrale de Yamoussoukro comme nouvelle capitale de la Côte d'Ivoire, remplaçant ainsi la plaque tournante côtière animée d'Abidjan. Le décret, signé aujourd'hui après des années de développement progressif des infrastructures, marque un changement profondément symbolique pour la nation ouest-africaine, un changement qui lie la gouvernance moderne au patrimoine traditionnel. « À partir d'aujourd'hui, notre coeur bat au centre de notre terre », a déclaré Houphouët-Boigny, décrivant cette décision comme un acte de décolonisation visant à recentrer l'identité ivoirienne loin de l'ancienne capitale coloniale française. La nouvelle capitale tentaculaire, qui abrite déjà la plus grande basilique du monde et de larges boulevards, accueillera désormais les institutions gouvernementales, même si Abidjan reste la puissance économique. Les critiques remettent en question le calendrier et le coût, les personnalités de l'opposition le qualifiant de projet vaniteux dans un contexte de tensions économiques. Pourtant, ses partisans le saluent comme une étape visionnaire vers un développement régional équilibré. Alors que les ministères commencent à déménager, le monde se demande si ce pari cimentera l'héritage d'Houphouët-Boigny ou deviendra un monument coûteux à la gloire de l'ambition d'un homme."
 news.1799.a: "Son lieu de naissance ?"
 news.1800.t: "[GetNewspaperHeader]La mort de Félix Houphouët-Boigny"
 news.1800.d: "Le « Sage de l'Afrique » est tombé. Le président Félix Houphouët-Boigny, dirigeant fondateur de la Côte d'Ivoire et l'un des hommes d'État les plus durables de l'Afrique postcoloniale, est décédé aujourd'hui à 88 ans des suites d'une maladie prolongée, plongeant la nation dans le deuil et l'incertitude. L'ancien planteur de café, qui a régné pendant 33 ans sans interruption, est décédé dans son palais présidentiel à Yamoussoukro, la capitale rurale qu'il a construite comme monument à son héritage. Maître de la survie politique, Houphouët-Boigny a conduit la Côte d'Ivoire vers la prospérité économique grâce à des politiques pro-occidentales tout en maintenant un contrôle strict, en ironisant \"il n'y a pas d'opposition au paradis\". Pourtant, ses dernières années virent l'effondrement de son « miracle ivoirien » alors que la récession et les troubles s'aggravaient. Le gouvernement a déclaré 40 jours de deuil national, et des milliers de personnes se sont déjà rassemblées à la basilique Notre-Dame de la Paix de Yamoussoukro, l'imposant sanctuaire qu'il a offert au Vatican. Alors que le monde rend hommage, des questions urgentes se posent : qui peut combler le vide ? Son plan de succession tiendra-t-il ? Et la nation qu'il a façonnée peut-elle maintenant faire une transition pacifique, ou les fissures qu'il a masquées vont-elles enfin s'ouvrir ? L'âge d'or de la Côte d'Ivoire se termine aujourd'hui ; son avenir est en jeu."
 news.1800.a: "La mort du père fondateur de la nation"
 news.1801.t: "[GetNewspaperHeader]Robert Guéï organise un coup d'État en Côte d'Ivoire"
 news.1801.d: "Dans un assaut dramatique de minuit, le général Robert Guéï a renversé le gouvernement de Côte d'Ivoire, dissolvant ses institutions et se déclarant chef d'un « Comité national de salut public » - le premier coup d'État dans les 39 ans d'histoire post-indépendance du pays. La mutinerie, menée par des soldats mécontents et d'anciens loyalistes d'Houphouët-Boigny, a renversé le président par intérim Henri Konan Bédié, dont le refus de répondre aux griefs des militaires concernant les salaires impayés a déclenché le soulèvement. Guéï, un ancien chef de l'armée limogé par Bédié en 1995, est apparu à la télévision d'État en treillis pour annoncer la suspension de la constitution et une transition de trois ans vers la démocratie. « Les politiciens ont ruiné notre pays », a-t-il déclaré, promettant d'éradiquer la corruption - mais la légitimité de sa junte se heurte immédiatement au scepticisme. Cette prise de pouvoir brise la réputation de la Côte d'Ivoire en tant que pilier de la stabilité de l'Afrique de l'Ouest, six ans seulement après la mort d'Houphouët-Boigny. Les rues d'Abidjan restent tendues alors que les troupes patrouillent, tandis que les dirigeants du monde condamnent le putsch. Alors que l'économie vacille et que les tensions ethniques couvent, les promesses de réforme de Guéï se heurtent désormais à la dure réalité : contrôler une nation divisée au bord du gouffre."
 news.1801.a: "Le premier coup d'État de la nation !"
 news.1802.t: "[GetNewspaperHeader]Laurent Gbagbo élu président de la Côte d'Ivoire"
 news.1802.d: "Dans le cadre d'un changement sismique pour la politique ivoirienne, le chef de l'opposition Laurent Gbagbo a été déclaré président après des élections tendues et violentes, marquant le premier transfert démocratique du pouvoir dans l'histoire du pays. La victoire du fougueux historien socialiste sur le dirigeant militaire Robert Guéï - qui avait initialement refusé de céder avant de fuir Abidjan au milieu de manifestations de masse - met fin à 40 ans de domination du parti unique par le PDCI d'Houphouët-Boigny et ses successeurs. Gbagbo, emprisonné et exilé pendant des années sous l'ancien régime, a surfé sur une vague de mécontentement de la jeunesse jusqu'à la victoire, promettant de démanteler les politiques bien ancrées de « l'ivoirité » qui marginalisaient les habitants du Nord. Mais son triomphe arrive à un moment périlleux : l'économie est en chute libre, les divisions ethniques sont vives et les loyalistes de Guéï restent armés. Alors que des milliers de personnes célèbrent dans les rues, le monde regarde si cet ancien dissident peut unir une nation fracturée ou si l'aube de la démocratie en Côte d'Ivoire sombrera dans le chaos. Une chose est sûre : l'ère Houphouët-Boigny est bel et bien révolue."
 news.1802.a: "Le retour de la démocratie ivoirienne"
 news.1803.t: "[GetNewspaperHeader]La guerre civile ivoirienne"
 news.1803.d: "Le premier producteur mondial de cacao s'est plongé dans une guerre civile à grande échelle après qu'une tentative de coup d'État manquée contre le président Laurent Gbagbo ait dégénéré en combats urbains brutaux, divisant le pays selon des lignes nord-sud. Les factions rebelles se faisant appeler « Mouvement patriotique de Côte d'Ivoire » (MPCI) ont pris le contrôle du nord à majorité musulmane, tandis que les loyalistes de Gbagbo fortifient Abidjan dans ce qui est en train de devenir le conflit le plus sanglant d'Afrique de l'Ouest depuis la Sierra Leone. Les violences ont éclaté après une mutinerie le 19 septembre des troupes du Nord - dont beaucoup étaient exclues par les lois sur la citoyenneté « ivoirienne » de Gbagbo - transformée en rébellion coordonnée. Les troupes françaises ont évacué des milliers d'étrangers alors que des massacres ethniques secouent les régions cacaoyères occidentales."
 news.1803.a: "Tragique!"
 news.1804.t: "[GetNewspaperHeader]Fred Akuffo organise un contre-coup d'État au Ghana"
 news.1804.d: "Dans une tournure dramatique des événements, l'ancien dirigeant ghanéen, le lieutenant-général Fred Akuffo, aurait pris le pouvoir lors d'un contre-coup d'État rapide, renversant le gouvernement actuel quelques mois seulement après son propre renversement. Des témoins oculaires ont signalé des tirs nourris près d'installations militaires clés alors que les loyalistes d'Akuffo se déplaçaient pour reprendre le contrôle, avec des véhicules blindés vus rouler dans les rues d'Accra. Le coup d'État intervient dans un contexte de troubles et d'instabilité économique croissants, Akuffo ayant prétendument rallié des factions mécontentes au sein des forces armées. Les communications ont été interrompues dans la capitale et des couvre-feux sont appliqués car la situation reste volatile. Les observateurs internationaux suivent de près l'évolution de la situation, les dirigeants régionaux appelant à la retenue. Ce dernier bouleversement menace de plonger le Ghana encore plus dans la tourmente, faisant craindre une instabilité prolongée dans ce pays d'Afrique de l'Ouest. Plus de détails suivront à mesure que la crise se déroulera."
 news.1804.a: "Après Nkrumah, c'est la ruine"
 news.1805.t: "[GetNewspaperHeader]Jerry Rawlings prépare un coup d'État au Ghana"
 news.1805.d: "Dans une prise de pouvoir audacieuse et violente, Flt. Le lieutenant Jerry John Rawlings a renversé le gouvernement militaire du Ghana, quelques mois seulement après l'échec de sa tentative de coup d'État en mai. Les premiers rapports indiquent que Rawlings, libéré de détention par des soldats sympathisants, a mené une révolte rapide et sanglante, prenant d'assaut des bases militaires clés et des bâtiments gouvernementaux du jour au lendemain. Des tirs nourris ont éclaté à Accra alors que les forces de Rawlings affrontaient les troupes loyalistes, tandis que les émissions de radio annonçaient la dissolution du conseil militaire au pouvoir. Le leader populiste, connu pour sa rhétorique enflammée contre la corruption et la mauvaise gestion économique, a déclaré une « révolution » pour purger le gouvernement et l'armée de la corruption. Les citoyens restent nerveux alors que la capitale est soumise à un couvre-feu strict, et craignent de nouvelles représailles et purges. Les réactions internationales sont mitigées, certains dirigeants africains exprimant leur inquiétude tandis que d'autres attendent avec prudence les prochaines mesures de Rawlings. Le Ghana, autrefois un phare de stabilité en Afrique de l'Ouest, est désormais confronté à un avenir incertain sous la direction de son nouveau leader révolutionnaire."
 news.1805.a: "Des hommes forts militaires dirigent désormais le Ghana"
 news.1806.t: "[GetNewspaperHeader]Hilla Limann élue présidente du Ghana"
 news.1806.d: "Dans un moment historique pour la nation, le Dr Hilla Limann a prêté serment en tant que premier président démocratiquement élu du Ghana depuis 1972, marquant la fin de près d'une décennie de régime militaire. Le diplomate et universitaire de 45 ans, représentant le Parti national du peuple (PNP), a remporté la victoire lors d'élections étroitement surveillées, battant ses rivaux avec des promesses de reprise économique et d'unité nationale. Des milliers de personnes ont célébré dans les rues d'Accra la prestation de serment de Limann, promettant de restaurer la stabilité et de reconstruire la réputation internationale du Ghana après des années de troubles sous les régimes militaires. Les observateurs saluent la transition pacifique comme un triomphe de la démocratie en Afrique de l'Ouest, même si des défis se profilent : Limann hérite d'une économie en difficulté, de profondes divisions politiques et de l'influence persistante des forces armées. Les dirigeants du monde entier ont adressé leurs félicitations, dans l'espoir que le retour du Ghana à un régime civil inspirera la région. Alors que le nouveau gouvernement prend forme, tous les regards sont tournés vers la capacité de Limann à concrétiser sa vision d'un Ghana prospère et démocratique."
 news.1806.a: "Un retour au socialisme"
 news.1807.t: "[GetNewspaperHeader]Jerry Rawlings commet un deuxième coup d'État au Ghana"
 news.1807.d: "Dans un retour choquant au régime militaire, Flt. Le lieutenant Jerry John Rawlings a violemment renversé le gouvernement civil du président Hilla Limann, deux ans seulement après le retour du Ghana à la démocratie. Les troupes armées fidèles à Rawlings ont pris d'assaut des installations clés du jour au lendemain, prenant le contrôle des stations de radio, de l'aéroport et des bâtiments gouvernementaux dans une prise de contrôle rapide et sanglante. Des tirs nourris ont résonné dans tout Accra tandis que la résistance de la garde présidentielle était écrasée, tandis que la radio d'État annonçait la suspension de la constitution et la dissolution de l'administration de Limann. Le charismatique mais controversé Rawlings, qui avait brièvement gouverné en 1979, a justifié son retour au pouvoir en accusant le gouvernement de Limann de corruption et d'échec économique. On ne sait toujours pas où se trouve le président déchu, car un couvre-feu est appliqué du crépuscule à l'aube dans la capitale. Ce deuxième coup d'État de Rawlings anéantit les espoirs de stabilité démocratique au Ghana, les dirigeants régionaux condamnant la prise de pouvoir tandis que des milliers de partisans célèbrent dans les rues. La communauté internationale observe avec inquiétude le fougueux révolutionnaire qui promet un « ménage » et des réformes radicales, laissant l'avenir du Ghana une fois de plus en jeu."
 news.1807.a: "Le Ghana est une porte tournante pour les juntes militaires"
 news.1808.t: "[GetNewspaperHeader]Jerry Rawlings rétablit le régime civil au Ghana"
 news.1808.d: "Dans le cadre d'une transformation politique spectaculaire, l'ancien chef militaire Jerry John Rawlings a été élu président civil du Ghana, marquant le retour du pays à un régime démocratique après plus d'une décennie de coups d'État et de gouvernance militaire. Candidat du National Democratic Congress (NDC), Rawlings a remporté une victoire décisive lors de ces élections historiques, capitalisant sur son attrait populiste et ses promesses de poursuite des réformes. Le vote, déclaré libre et équitable par les observateurs internationaux, représente un tournant inattendu pour ce révolutionnaire autrefois fougueux, qui a mené deux coups d'État militaires en 1979 et 1981 avant de superviser la transition du Ghana vers une démocratie constitutionnelle. Des milliers de partisans en liesse ont envahi les rues d'Accra, célébrant l'ascension pacifique de Rawlings au pouvoir par les urnes plutôt que par le canon d'une arme à feu. Les critiques restent cependant méfiants à l'égard de son passé autoritaire et se demandent si son administration adoptera pleinement les normes démocratiques. Alors que le Ghana entre dans ce nouveau chapitre, le monde regarde si Rawlings - désormais président civil - peut stabiliser l'économie, approfondir les institutions démocratiques et enfin briser le cycle de l'intervention militaire dans la politique ghanéenne. Sa victoire témoigne à la fois de continuité et de changement, laissant la nation à la croisée des chemins entre son passé turbulent et un avenir plein d'espoir."
 news.1808.a: "La démocratie multipartite va enfin revenir au Ghana"
 news.1809.t: "[GetNewspaperHeader]John Kufuor élu président du Ghana"
 news.1809.d: "Dans un moment historique pour la démocratie ghanéenne, le chef de l'opposition John Agyekum Kufuor a été élu président, marquant le premier transfert pacifique du pouvoir entre gouvernements civils dans l'histoire post-indépendance du pays. L'avocat de 62 ans et leader du Nouveau Parti Patriotique (NPP) a battu le vice-président John Atta Mills lors d'un second tour très disputé, mettant ainsi fin à 20 ans de domination politique de Jerry Rawlings. Les observateurs internationaux ont salué les élections comme étant libres et équitables, la victoire de Kufuor signalant un désir de changement après des années de luttes économiques sous le parti NDC de Rawlings. Les partisans ont dansé dans les rues d'Accra et de Kumasi à l'annonce des résultats, célébrant à la fois l'attitude « gentleman » de Kufuor et ses promesses de revitalisation économique. Le sortant Rawlings - qui a pris le pouvoir à deux reprises par coup d'État avant de remporter des élections démocratiques - a gracieusement reconnu sa défaite, consolidant ainsi la réputation du Ghana comme phare de la stabilité en Afrique de l'Ouest. Le président élu Kufuor est désormais confronté au défi de mettre en oeuvre son programme sur « l'âge d'or des affaires » tout en préservant les acquis démocratiques durement acquis du Ghana. Son investiture sera suivie de près sur un continent où les transitions pacifiques restent rares."
 news.1809.a: "Les transitions démocratiques sont désormais la norme au Ghana"
 news.1810.t: "[GetNewspaperHeader]Déclaration de la République du Ghana"
 news.1810.d: "Dans un moment historique de renaissance nationale, le Ghana a rompu ses derniers liens constitutionnels avec la Couronne britannique, se proclamant république souveraine le 1er juillet 1960. Le Premier ministre [GHA.GetLeader], le fougueux architecte de l'indépendance, a été élevé à la présidence avec de vastes pouvoirs exécutifs à la suite d'une victoire écrasante au référendum qui a vu 88 % d'approbation pour le statut républicain. L'aube de la République marque l'émancipation complète du Ghana de la domination coloniale, trois ans après être devenu le premier pays d'Afrique subsaharienne à se libérer du contrôle britannique. Des milliers de citoyens en extase ont envahi la Place de l'Indépendance alors que le nouveau standard présidentiel était élevé, remplaçant le représentant de la Reine par un chef d'État local. [GHA.GetLeader], dans sa blouse nordique caractéristique, s'est engagé à accélérer sa vision du socialisme africain et de l'unité continentale, déclarant : « La personnalité africaine a atteint sa majorité ». Même si l'adhésion au Commonwealth demeure, le changement constitutionnel renforce la domination des [GHA.GetLeader]dans un contexte d'inquiétudes croissantes concernant le régime d'un parti unique. Alors que les feux d'artifice illuminaient l'horizon d'Accra, la nouvelle république était à la fois un phare d'espoir panafricain et un test pour la gouvernance postcoloniale dans la décennie turbulente de l'indépendance africaine."
 news.1810.a: "Les transitions démocratiques sont désormais la norme au Ghana"
 news.1811.t: "[GetNewspaperHeader]L'indépendance de la République togolaise"
 news.1811.d: "Dans une vague de liesse qui déferle sur tout le pays, le Togo s'est officiellement débarrassé de son passé colonial en proclamant son indépendance totale de l'administration française en ce jour historique, le 27 avril 1960. Le territoire de l'Afrique de l'Ouest, autrefois colonie allemande avant de devenir un mandat français, se présente désormais comme une nation souveraine, avec le Premier ministre Sylvanus Olympio à la tête du pays en tant que premier président. Des milliers de personnes ont envahi les rues de Lomé, brandissant le nouveau drapeau rouge, jaune, vert et blanc tandis que les cloches des églises sonnaient et que les tambours traditionnels célébraient la fin de 60 ans de domination étrangère. Ce moment marque le point culminant d'une lutte acharnée pour l'autodétermination, avec Olympio déclarant devant une foule euphorique : « Aujourd'hui, le Togo renaît, libre, fier et maître de son propre destin ! La transition intervient après qu'un vote supervisé par l'ONU en 1956 au Togo britannique a choisi l'intégration avec le Ghana, tandis que le Togo français avançait vers une indépendance séparée. Mais alors que des feux d'artifice illuminent le ciel nocturne, des défis se profilent pour cette petite nation - prise en sandwich entre le Ghana et le Dahomey - avec des questions sur la stabilité économique, l'unité ethnique et les alignements de la guerre froide. La naissance du Togo en tant que 26ème État africain indépendant cette année marque la vague imparable de la décolonisation, même si l'ombre du néocolonialisme plane sur les célébrations."
 news.1811.a: "Une autre nation africaine indépendante"
 news.1812.t: "[GetNewspaperHeader]Emmanuel Bodjollé organise un coup d'État"
 news.1812.d: "Dans un choc à l'aube pour la jeune république, une faction de soldats mécontents dirigée par le sergent Emmanuel Bodjollé a violemment renversé le gouvernement du Togo, assassinant le président Sylvanus Olympio lors du premier coup d'État militaire en Afrique postcoloniale. Le putsch s'est déroulé aux premières heures du 13 janvier 1963, lorsque les troupes rebelles ont pris d'assaut la résidence présidentielle, abattant Olympio alors qu'il cherchait refuge aux portes de l'ambassade américaine. Les putschistes - pour la plupart des sous-officiers irrités par leur exclusion de l'armée nouvellement indépendante - ont déclaré la suspension de la constitution et ont installé Bodjollé à la tête d'un comité militaire provisoire. La panique s'est emparée de Lomé alors que les tirs résonnaient dans la capitale, les rebelles s'emparant des stations de radio pour annoncer leur prise de pouvoir « révolutionnaire » tout en imposant un couvre-feu strict. Le renversement brutal, survenu trois ans seulement après l'indépendance, brise la fragile démocratie togolaise et envoie une onde de choc à travers un continent où de nombreux jeunes pays craignent une instabilité similaire. Les condamnations internationales affluent alors que le Ghana voisin ferme sa frontière, tandis que les putschistes promettent de « nettoyer » le gouvernement de la corruption et du favoritisme présumés d'Olympio. Alors que l'avenir du Togo est désormais entre les mains d'un sergent de 26 ans et de ses compagnons mutins, la nation devient un récit édifiant d'une intervention militaire dans la période turbulente de l'après-indépendance de l'Afrique."
 news.1812.a: "Une république à peine née"
 news.1813.t: "[GetNewspaperHeader]Gnassingbé Eyadéma organise un coup d'État"
 news.1813.d: "Dans un renversement dramatique et violent, le lieutenant-colonel Gnassingbé Eyadéma a renversé le gouvernement du président Nicolas Grunitzky, marquant ainsi le deuxième coup d'État militaire au Togo en seulement quatre ans depuis l'indépendance. La prise de pouvoir du 13 janvier 1967, organisée à l'occasion du quatrième anniversaire du coup d'État qui a tué le premier président du Togo, Sylvanus Olympio, a vu les troupes fidèles d'Eyadéma prendre d'assaut des installations clés à Lomé, dissolvant l'Assemblée nationale et suspendant la constitution. L'ancien sergent de l'armée française de 29 ans, qui a participé au renversement d'Olympio en 1963, a justifié sa prise de pouvoir en accusant le régime civil de Grunitzky de corruption et de ne pas avoir réussi à réconcilier les divisions nord-sud du pays. Eyadéma, un homme fort charismatique mais impitoyable issu du groupe ethnique Kabye du nord, s'est déclaré président et a imposé la loi martiale, promettant de rétablir l'ordre et la « véritable indépendance » après des années de turbulences politiques. Le coup d'État - apparemment plus sanglant que la révolte de 1963 - a suscité une condamnation rapide de la part des voisins africains et des puissances occidentales, mais Eyadéma semble fermement aux commandes, soutenu par une faction militaire loyale. Alors que le Togo entre dans une nouvelle ère de régime autoritaire, les craintes grandissent que l'ascension du jeune officier sonne le glas de la démocratie dans un pays déjà marqué par la violence politique et l'instabilité."
 news.1813.a: ""
 news.1814.t: "[GetNewspaperHeader]Gnassingbé Eyadéma fonde le Rassemblement du peuple togolais"
 news.1814.d: "Le président Gnassingbé Eyadéma a officiellement institutionnalisé son régime militaire de 15 ans par la création du Rassemblement du peuple togolais (RPT), établissant le plus récent État à parti unique d'Afrique le 30 novembre 1969. Cette décision, annoncée lors de rassemblements massifs orchestrés à Lomé, transforme le régime militaire du Togo en une structure politique calquée sur d'autres partis révolutionnaires du continent, avec Eyadéma comme président et chef suprême du « seul parti politique légitime ». Force. » Le manifeste fondateur du RPT déclare que la mission du parti est « d'unifier tous les Togolais » selon la vision d'Eyadéma, interdisant effectivement l'opposition tout en cooptant les chefs traditionnels, les groupes de jeunes et les syndicats dans sa structure hiérarchique. L'homme fort de 36 ans, vêtu de son mélange caractéristique de tenues militaires et civiles, a qualifié cette décision de nécessaire pour prévenir les divisions ethniques et l'infiltration communiste, déclarant : « Le RPT sera la boussole qui guidera notre nation vers une véritable indépendance et un véritable développement. » Les critiques à l'étranger rejettent le parti comme un outil de cimentation de la dictature, soulignant ses parallèles avec le CPP de Nkrumah au Ghana et le MPR de Mobutu au Zaïre. Alors que le lancement du RPT coïncide avec un renforcement des lois sur la presse et des pouvoirs de sécurité élargis, Eyadéma semble troquer son uniforme contre un autoritarisme civilisé permanent - une tendance qui devient de plus en plus courante dans l'Afrique après le coup d'État. Alors que les responsables togolais commencent à échanger leurs tenues militaires contre des costumes portant la marque RPT, la communauté internationale se méfie de savoir si ce changement de marque politique entraînera des réformes ou simplement reconditionnera la répression."
 news.1814.a: "Un parti politique pour une junte militaire ?"
 news.1815.t: "[GetNewspaperHeader]Gnassingbé Eyadéma vote un référendum pour interdire tous les partis"
 news.1815.d: "Le président Gnassingbé Eyadéma a resserré son emprise autoritaire après que les responsables ont annoncé un taux d'approbation stupéfiant de 99,9 % lors d'un référendum national visant à abolir la démocratie multipartite, cimentant ainsi le Togo en tant qu'État à parti unique sous son Rassemblement du peuple togolais (RPT). Le vote de décembre 1979, mené sans observateurs indépendants, aurait vu un soutien quasi unanime aux changements constitutionnels accordant à Eyadéma la présidence à vie et interdisant tous les partis d'opposition, la radio d'État proclamant « l'unité historique » derrière le leader. Eyadéma, l'homme fort le plus ancien de l'Afrique à l'époque, a présenté cette mesure comme étant nécessaire pour prévenir les « divisions tribales » et les « ingérences étrangères », bien que les critiques la décrivent comme le glas de la démocratie togolaise. Les résultats du référendum, invraisemblablement déséquilibrés même selon les normes des dictatures africaines, ont suscité une condamnation internationale sourde, mais peu de surprise dans un pays où la dissidence a été systématiquement écrasée depuis le coup d'État d'Eyadéma en 1967. Sans aucune opposition juridique, le président règne désormais à travers un culte de la personnalité qui le présente à la fois comme un protecteur militaire et le père de la nation - avec une adoration publique orchestrée et une histoire nationale réécrite soulignant son rôle dans le renversement du premier gouvernement du Togo. Alors que les États voisins sont confrontés à des crises économiques et à des coups d'État, la décision d'Eyadéma témoigne de son intention de suivre le modèle Mobutu de révolution permanente sous un régime permanent, laissant les opposants en exil se demander si le Togo échappera un jour à son ombre."
 news.1815.a: "Comme c'est légitime"
 news.1816.t: "[GetNewspaperHeader]Faure Gnassingbé succède à son père à la tête du Togo"
 news.1816.d: "Dans une transition controversée faisant écho au régime dynastique, Faure Gnassingbé a été installé aujourd'hui comme nouveau dirigeant du Togo après le décès de son père, le président Gnassingbé Eyadéma, mettant ainsi fin à l'emprise de 38 ans de l'homme fort sur le pouvoir mais étendant la domination politique de sa famille. L'ancien ministre des Mines de 39 ans - qui a prêté serment quelques heures seulement après le décès de son père le 5 février 2005 - fait face à une condamnation régionale immédiate alors que les dirigeants ouest-africains dénoncent le transfert anticonstitutionnel du pouvoir après que les soldats ont suspendu le Parlement pour contourner les règles constitutionnelles de succession. Cette nomination rapide, soutenue par l'armée, dénoncée comme un « coup de palais » par des personnalités de l'opposition, a déclenché de violentes manifestations à Lomé alors que les forces de sécurité affrontaient les manifestants réclamant des élections. Le bloc régional de la CEDEAO a menacé de sanctions, qualifiant cette décision de « prise de pouvoir inacceptable » dans un continent de plus en plus intolérant à l'égard de la succession héréditaire. Faure, un technocrate à la voix douce, formé à Paris et à Washington, projette une image modernisatrice mais hérite de l'appareil de sécurité répressif de son père et d'une nation polarisée par des décennies de régime autoritaire. Alors que des véhicules blindés patrouillent dans la capitale et que les frontières se ferment, la question se pose : la première dynastie politique africaine du XXIe siècle survivra-t-elle, ou la démocratie étouffée du Togo va-t-elle enfin se libérer ?"
 news.1816.a: "Une dynastie politique forte de plus de 40 ans"
 news.1817.t: "[GetNewspaperHeader]Nicolas Grunitzky élu président du Togo"
 news.1817.d: "Dans le cadre d'une transition organisée à la hâte après le premier coup d'État africain après l'indépendance, Nicolas Grunitzky a prêté serment en tant que deuxième président du Togo après que la junte militaire qui a assassiné Sylvanus Olympio lui a donné le pouvoir. Cet homme politique métis de 48 ans, qui a perdu contre l'Olympio aux élections de 1958, a été rapatrié d'exil à Paris et installé le 16 janvier 1963, trois jours seulement après le renversement violent d'Olympio. Le candidat de compromis, considéré comme acceptable à la fois par les soldats rebelles et par la France, est confronté à des défis immédiats pour unifier une nation traumatisée par l'assassinat de son président fondateur. Le fragile gouvernement de coalition de Grunitzky inclut les putschistes qui l'ont élevé au pouvoir - un arrangement précaire qui laisse le pouvoir réel à la faction militaire dirigée par le sergent Emmanuel Bodjollé. La réaction internationale reste prudente, les voisins africains étant particulièrement méfiants du dangereux précédent du coup d'État. Alors que Grunitzky promet la réconciliation et de nouvelles élections, les sceptiques notent que le nouveau président règne au gré des militaires dans un pays où la démocratie a déjà été écourtée par les tirs. Le chemin à parcourir semble semé d'embûches pour ce dirigeant réticent, chargé de stabiliser un pays dont les fondations politiques reposent désormais sur une tombe."
 news.1817.a: "La C.I.A. impliqué?"
 news.1818.t: "[GetNewspaperHeader]Coup d'État nigérian contre Yakubu Gowon"
 news.1818.d: "Dans un coup d'État rapide et sans effusion de sang, l'armée nigériane a renversé le général Yakubu Gowon, mettant ainsi fin à son règne de neuf ans alors qu'il participait à un sommet de l'OUA en Ouganda. Des officiers supérieurs, dirigés par le général de brigade Murtala Muhammed, ont pris le pouvoir tôt ce matin, invoquant la corruption, la stagnation économique et l'échec de Gowon à rétablir un régime civil comme raisons de cette prise de pouvoir. Les émissions de radio ont annoncé la dissolution du gouvernement de Gowon, Mahomet se déclarant chef de l'État et promettant une transition vers la démocratie. Les rues de Lagos restent calmes alors que le nouveau régime impose un couvre-feu du crépuscule à l'aube. Gowon, qui serait bloqué à l'étranger, a obtenu l'asile au Royaume-Uni. Il s'agit du deuxième coup d'État du Nigeria depuis l'indépendance, suscitant des espoirs - et des craintes - pour l'avenir du pays."
 news.1818.a: "Ce n'est clairement jamais lui qui a pris les devants"
 news.1819.t: "[GetNewspaperHeader]Le chef de l'État nigérian, Murtala Mohammed, assassiné"
 news.1819.d: "Le chef militaire du Nigeria, le général Murtala Mohammed, a été abattu ce matin lors d'une tentative de coup d'État effrontée alors qu'il se rendait quotidiennement à Lagos. Des agents armés ont tendu une embuscade à son véhicule près du Secrétariat fédéral à Ikoyi, tuant sur le coup le chef de l'État de 37 ans avant de s'emparer des principales installations gouvernementales. Le coup d'État, mené par des soldats mécontents sous les ordres du lieutenant-colonel Buka Suka Dimka, a été rapidement écrasé par les forces loyalistes, Dimka fuyant la capitale. Dans une émission nationale, le chef d'état-major Olusegun Obasanjo a confirmé la mort de Mohammed et a déclaré un couvre-feu du crépuscule à l'aube, s'engageant à poursuivre ses réformes. Des foules en deuil se sont rassemblées à la caserne Dodan alors que la nation la plus peuplée d'Afrique se remet de la perte d'un dirigeant qui, en seulement six mois, avait été acclamé par les masses pour sa campagne anti-corruption et ses projets audacieux visant à ramener le Nigeria à un régime civil. Son assassinat plonge la nation dans l'incertitude, marquant son troisième changement violent de direction en une décennie."
 news.1819.a: "Tué d'une manière étrangement similaire à Kennedy"
 news.1820.t: "[GetNewspaperHeader]Shehu Shagari élu premier président de la deuxième république du Nigeria"
 news.1820.d: "Dans un moment historique pour le pays le plus peuplé d'Afrique, Alhaji Shehu Shagari a été déclaré premier président démocratiquement élu du Nigeria depuis 1966, marquant l'aube de la Deuxième République après des années de régime militaire. L'ancien enseignant et ministre de 54 ans, représentant le Parti national du Nigeria (NPN), a battu de justesse Obafemi Awolowo lors d'élections âprement contestées supervisées par le chef militaire sortant, le général Olusegun Obasanjo. Des foules enthousiastes ont envahi les rues de Lagos et de Kaduna lorsque la Commission électorale fédérale a annoncé la victoire de Shagari, les partisans brandissant des drapeaux vert-blanc-vert pour célébrer. Dans son discours inaugural à Dodan Barracks, le nouveau président s'est engagé à unir la nation, à lutter contre la corruption et à exploiter la richesse pétrolière du Nigeria pour le développement. La transition pacifique, un exploit rare dans l'Afrique postcoloniale, a ravivé l'espoir de stabilité après des décennies de coups d'État et de guerre civile. Les dirigeants internationaux, notamment les États-Unis et le Royaume-Uni, ont salué ces élections comme un triomphe de la démocratie. Pourtant, des défis se profilent : la hausse de l'inflation, les tensions ethniques et le scepticisme militaire menacent de mettre à l'épreuve la promesse de Shagari d'un « nouveau Nigeria »."
 news.1820.a: "Un retour à la démocratie au Nigeria"
 news.1821.t: "[GetNewspaperHeader]Muhammadu Buhari prépare un coup d'État au Nigeria"
 news.1821.d: "La Deuxième République du Nigeria a été brutalement interrompue par un coup d'État militaire rapide et sans effusion de sang, lorsque le major-général Muhammadu Buhari a renversé le président démocratiquement élu Shehu Shagari, invoquant la mauvaise gestion économique, la corruption et la décadence nationale. Des soldats armés ont pris d'assaut des bâtiments gouvernementaux clés à Lagos dans la nuit, dissolvant l'administration civile et suspendant la constitution. Dans une émission de radio nationale, Buhari, 41 ans, ancien ministre du Pétrole et gouverneur militaire, s'est déclaré chef de l'État, s'engageant à « discipliner » la nation et à rétablir l'ordre. Le coup d'État, largement attendu au milieu de la crise économique qui s'aggrave au Nigeria, a suscité un soulagement prudent de la part du public, l'inflation et les pénuries alimentaires ayant érodé la confiance dans le gouvernement de Shagari. Les observateurs internationaux ont condamné cette prise de pouvoir, les États-Unis et le Royaume-Uni exprimant leur inquiétude face au retour de l'Afrique vers un régime militaire. Les marchés sont restés fermés alors que Buhari a imposé des couvre-feux stricts et mis en garde contre toute dissidence, signalant un retour à la discipline austère de sa précédente carrière militaire. Avec ce renversement, le Nigeria marque son quatrième coup d'État réussi depuis l'indépendance, faisant craindre un régime autoritaire prolongé quatre ans seulement après le retour de la démocratie."
 news.1821.a: "La domination militaire revient au Nigeria"
 news.1822.t: "[GetNewspaperHeader]Ibrahim Babangida prépare un coup d'État au Nigeria"
 news.1822.d: "La direction militaire du Nigeria a été brusquement remaniée lorsque le major-général Ibrahim Babangida a renversé son ancien allié, le général Muhammadu Buhari, lors d'un coup d'État rapide et sans effusion de sang. La prise de pouvoir avant l'aube, exécutée avec précision par les forces loyalistes, a permis de sécuriser les principales installations gouvernementales sans résistance, tandis que Buhari et son adjoint, Tunde Idiagbon, étaient détenus à la caserne Dodan. Dans un discours télévisé, Babangida, 44 ans, un officier charismatique et politiquement avisé, a cité le « leadership rigide et intransigeant » de Buhari pour justifier le coup d'État, promettant une approche plus consultative de la gouvernance. Cette décision intervient après 20 mois de régime austère de Buhari, marqué par une discipline stricte mais un mécontentement public croissant face aux difficultés économiques et à la répression de la dissidence. Babangida, en annonçant la formation du Conseil de direction des forces armées (AFRC), s'est engagé à remédier aux difficultés économiques du Nigeria tout en jetant les bases d'un éventuel retour à la démocratie - même si aucun calendrier n'a été donné. Les rues de Lagos sont restées calmes sous une forte présence militaire, avec des citoyens prudemment optimistes mais méfiants face à une nouvelle junte prolongée. Les réactions internationales ont été mitigées, les pays occidentaux appelant à la retenue tandis que les dirigeants africains surveillaient l'évolution de la situation. Il s'agit du sixième coup d'État au Nigeria depuis l'indépendance, soulignant l'emprise durable de l'armée sur le pouvoir."
 news.1822.a: "Une porte tournante des juntes"
 news.1823.t: "[GetNewspaperHeader]Gouvernement intérimaire établi au Nigeria"
 news.1823.d: "Dans une tournure dramatique des événements, le général Ibrahim Babangida a renoncé au pouvoir, installant le chef Ernest Shonekan à la tête d'un gouvernement civil intérimaire dans le but d'apaiser les troubles qui ont suivi les élections annulées du 12 juin. Shonekan, 57 ans, industriel respecté et ancien chef du Conseil national de défense et de sécurité (NDSC) de transition, a prêté serment aujourd'hui lors d'une cérémonie tendue à Abuja, chargé de guider le Nigeria vers une transition démocratique incertaine. Cette décision intervient après des mois d'escalade des protestations et de condamnation internationale contre l'annulation par Babangida de ce qui était largement considéré comme l'élection la plus libre du Nigeria, présumée remportée par l'homme d'affaires Moshood Abiola. Bien que présentée comme un « transfert volontaire », l'armée conserve une influence considérable, avec des personnalités clés comme le général Sani Abacha, ministre de la Défense, qui se profilent dans l'ombre. Les marchés ont réagi avec méfiance à cette nouvelle, alors que le scepticisme grandissait quant à l'autorité de Shonekan pour résoudre la crise. Dans un discours discret, le nouveau dirigeant s'est engagé à restaurer la stabilité et à sortir de l'impasse électorale, mais avec l'emprise militaire toujours ferme, de nombreux Nigérians se demandent si cette phase intérimaire marque un réel changement - ou simplement une junte rebaptisée."
 news.1823.a: "Une troisième République nigériane ?"
 news.1824.t: "[GetNewspaperHeader]Sani Abacha prépare un coup d'État au Nigeria"
 news.1824.d: "La fragile transition du Nigeria vers la démocratie a été brusquement brisée lorsque le général Sani Abacha, le puissant ministre de la Défense, a renversé le gouvernement civil intérimaire du chef Ernest Shonekan lors d'un coup d'État rapide et sans effusion de sang. Le général de 50 ans, longtemps considéré comme le dirigeant de l'ombre dans les coulisses, a dissous l'administration de transition et s'est déclaré chef de l'État, suspendant toute activité politique et rétablissant un régime militaire complet. Dans une émission laconique de minuit, Abacha a justifié cette prise de pouvoir en citant « le chaos économique et la désunion nationale », s'engageant à rétablir l'ordre au milieu de la crise qui s'aggrave au Nigeria après les élections annulées du 12 juin. Shonekan, qui avait eu du mal à affirmer son autorité depuis sa nomination en août, a démissionné sans résistance, son gouvernement intérimaire s'effondrant après seulement 82 jours. Les rues de Lagos et d'Abuja sont restées fortement surveillées pendant que les soldats sécurisaient les installations clés, tandis que les condamnations internationales affluaient de la part des États-Unis, du Royaume-Uni et du Commonwealth. Ce coup d'État marque la septième prise de pouvoir militaire réussie au Nigeria depuis l'indépendance, anéantissant les espoirs d'un retour à un régime civil et plongeant le pays dans l'incertitude. Alors qu'Abacha - l'homme de main redouté des régimes passés - est désormais aux commandes, les observateurs se préparent à une répression de la dissidence et à une potentielle escalade de la répression. Pour une nation déjà ébranlée par les troubles politiques et le déclin économique, l'avenir semble sombre sous l'emprise de l'une de ses figures les plus autoritaires."
 news.1824.a: "Le régime militaire est inévitable pour le Nigeria"
 news.1825.t: "[GetNewspaperHeader]Abdulsalami Abubakar à la tête de la junte nigériane"
 news.1825.d: "Le paysage politique du Nigeria a radicalement changé du jour au lendemain lorsque le général Abdulsalami Abubakar a prêté serment en tant que nouveau chef militaire du pays après la mort soudaine du dictateur général Sani Abacha. Ce militaire de carrière de 56 ans, ancien chef d'état-major de la Défense, a pris le pouvoir dans le cadre d'une transition rapide visant à stabiliser la nation après des années de répression et d'isolement international. Dans un bref discours télévisé, Abubakar s'est engagé à superviser une « transition rapide et crédible vers un régime civil », suscitant des espoirs prudents quant au retour du Nigeria à la démocratie. Son ascension intervient au milieu de rumeurs tourbillonnantes sur la mort mystérieuse d'Abacha - officiellement attribuée à une crise cardiaque - et de pressions croissantes de la part des dirigeants mondiaux pour mettre fin au régime militaire. Les rues des grandes villes sont restées tendues mais calmes alors que les soldats patrouillaient dans les zones clés, tandis que les militants pro-démocratie et les personnalités de l'opposition en exil saluaient prudemment le changement. Le nouveau dirigeant est confronté à d'immenses défis : une économie paralysée, un mécontentement généralisé et la crise non résolue découlant de l'élection annulée de Moshood Abiola en 1993, qui reste emprisonné. Les réactions internationales ont été prudentes, les États-Unis et le Royaume-Uni exhortant Abubakar à tenir ses promesses. Pour les Nigérians épuisés par le régime brutal d'Abacha, cette transition inattendue offre une lueur d'espoir, mais avec l'armée toujours aux commandes, le scepticisme est profond. S'agira-t-il d'une véritable réforme, ou simplement d'une autre junte déguisée ?"
 news.1825.a: "Abubakar restaurera la démocratie"
 news.1826.t: "[GetNewspaperHeader]Olusegun Obasanjo élu président du Nigeria"
 news.1826.d: "Dans un moment historique marquant la fin de près de 16 ans de régime militaire, le général à la retraite Olusegun Obasanjo a prêté serment aujourd'hui en tant que premier président démocratiquement élu du Nigeria depuis 1983. L'ancien chef d'État militaire de 62 ans (1976-1979) a prêté serment devant une foule en liesse à Eagle Square, promettant de guérir les profondes divisions du pays et de reconstruire son économie meurtrie après des décennies de dictature. La victoire écrasante d'Obasanjo aux élections de février - la plus libre depuis une génération - intervient après que le régime militaire du général Abdulsalami Abubakar ait tenu sa promesse de ramener le Nigeria à un régime civil. Dans son discours inaugural, le nouveau président s'est engagé à lutter contre la corruption, à restaurer la réputation internationale du Nigeria et à répondre aux doléances du delta du Niger, riche en pétrole. La cérémonie s'est déroulée en présence de dirigeants du monde entier, dont la secrétaire d'État américaine Madeleine Albright, signalant l'approbation mondiale de la transition démocratique du Nigeria. Cependant, les défis sont de taille : une dette extérieure écrasante, des tensions ethniques et une armée toujours méfiante à l'égard du contrôle civil. Pour des millions de Nigérians, cette journée ravive l'espoir, mais après des années de promesses non tenues, le chemin à parcourir reste incertain."
 news.1826.a: "Accueillons la Quatrième République nigériane"
 news.1827.t: "[GetNewspaperHeader]Umaru Musa Yar'Adua élu président du Nigeria"
 news.1827.d: "Le Nigeria est entré dans un nouveau chapitre démocratique lorsqu'Umaru Musa Yar'Adua, 56 ans, ancien gouverneur de l'État de Katsina, a été officiellement déclaré président élu à l'issue d'un scrutin controversé que les observateurs ont qualifié de profondément vicié. Le candidat du Parti démocratique du peuple (PDP) au pouvoir a obtenu 70 % des voix, succédant au président sortant Olusegun Obasanjo dans ce qui marque le premier transfert de pouvoir de civil à civil au Nigeria depuis l'indépendance. Dans un discours de remerciement télévisé, le professeur de chimie à la voix douce a promis d'être \"un président pour tous les Nigérians\", s'engageant à réformer le système électoral et à poursuivre les réformes économiques. Cependant, l'élection a été entachée d'irrégularités généralisées, les candidats de l'opposition Muhammadu Buhari et Atiku Abubakar rejetant les résultats en les qualifiant de « mascarade » et les observateurs internationaux ont signalé des bourrages d'urnes et des intimidations. Yar'Adua, discret et en mauvaise santé - qui gouverne depuis un fauteuil roulant - est désormais confronté à d'immenses défis : des troubles militants dans le delta du Niger, une crise énergétique paralysante et un scepticisme quant à son indépendance face à l'ombre d'Obasanjo. Alors que les célébrations éclataient dans les bastions du PDP, les forces de sécurité se préparaient à d'éventuelles violences dans les bastions de l'opposition du nord."
 news.1827.a: "La démocratie nigériane est inébranlable"
 news.1828.t: "[GetNewspaperHeader]L'indépendance du Cameroun"
 news.1828.d: "Dans un moment historique, le Cameroun a officiellement obtenu son indépendance de la domination coloniale française, devenant en 1960 le premier pays africain à inaugurer une nouvelle ère d'autonomie gouvernementale. Des milliers de citoyens en liesse ont envahi les rues, brandissant le drapeau vert, rouge et jaune, alors que le Premier ministre Ahmadou Ahidjo déclarait la naissance de la République du Cameroun. La cérémonie de passation de pouvoir, marquée par des discours émouvants et des célébrations culturelles, a eu lieu à l'Assemblée nationale à Yaoundé. Les autorités françaises ont officiellement transféré le pouvoir, mettant fin à plus de quatre décennies d'administration coloniale. \"Aujourd'hui, nous récupérons notre destin de nation libre et souveraine\", a proclamé Ahidjo, qui devrait conduire le pays vers son nouvel avenir. Pendant ce temps, le sud du Cameroun sous administration britannique reste sous tutelle, avec des appels croissants à la réunification avec la république nouvellement indépendante. Alors que le Cameroun accède à l'indépendance, le monde regarde comment la jeune nation fera face aux défis postcoloniaux et à l'unité."
 news.1828.a: "Un autre territoire sous tutelle rendu indépendant"
 news.1829.t: "[GetNewspaperHeader]La démission d'Ahmadou Ahidjo"
 news.1829.d: " Dans une tournure étonnante des événements, le président Ahmadou Ahidjo, dirigeant du Cameroun depuis l'indépendance en 1960, a annoncé sa démission immédiate, invoquant des raisons de santé. Cette décision inattendue marque la fin d'une époque pour la nation centrafricaine, laissant le Premier ministre Paul Biya, protégé de longue date d'Ahidjo, assumer la présidence. Dans un discours solennel à la radio, Ahidjo a exprimé sa confiance dans la capacité de Biya à diriger, appelant à l'unité et à la continuité nationales. La démission intervient au milieu de rumeurs de tensions politiques et de défis économiques, même si les responsables insistent sur le fait que la transition se fera en douceur. Alors que le Cameroun se prépare à ouvrir un nouveau chapitre, des questions subsistent sur l'avenir de l'État à parti unique et sur la question de savoir si Biya maintiendra la politique de son prédécesseur ou orientera la nation dans une nouvelle direction."
 news.1829.a: "Un titan de l'Afrique francophone"
 news.1830.t: "[GetNewspaperHeader]La Glorieuse Révolution du 20 Mai"
 news.1830.d: "Dans le cadre d'une transformation constitutionnelle radicale, le président Ahmadou Ahidjo a aboli le système fédéral du Cameroun, déclarant la nation État unitaire après une victoire écrasante au référendum. Cette décision, saluée comme la « Glorieuse Révolution du 20 mai », dissout les entités fédérées du Cameroun oriental (anciennement administré par la France) et du Cameroun occidental (anciennement administré par les Britanniques), centralisant ainsi le pouvoir à Yaoundé. Les responsables font état d'un soutien public quasi-unanime, Ahidjo proclamant le changement comme essentiel pour l'unité et le progrès nationaux. Les critiques allèguent cependant la répression de la dissidence, en particulier parmi les factions anglophones qui craignent la marginalisation. La nouvelle constitution unitaire confère à la présidence une autorité élargie, consolidant ainsi le régime de parti unique d'Ahidjo au sein de l'Union nationale du Cameroun (CNU). Alors que les célébrations éclatent dans les grandes villes, le monde se demande si cette restructuration audacieuse forgera la stabilité ou sèmera la discorde à l'avenir."
 news.1830.a: "Pas très révolutionnaire"
 news.1831.t: "[GetNewspaperHeader]Le Cameroun adopte un nouveau drapeau"
 news.1831.d: "Dans une démarche historique marquant l'évolution continue de la nation, le Cameroun a officiellement adopté un nouveau drapeau national, remplaçant le dessin original utilisé depuis l'indépendance en 1960. La bannière mise à jour conserve le tricolore emblématique vert, rouge et jaune, mais comporte désormais deux étoiles dorées sur la bande rouge, symbolisant l'unité des régions francophones et anglophones du pays sous la vision d'un État centralisé du président Ahmadou Ahidjo. Ce changement intervient trois ans après le référendum de 1972 qui a aboli le système fédéral, renforçant ainsi le message de cohésion nationale. Les responsables gouvernementaux ont salué le nouveau drapeau comme le reflet de « la souveraineté indivisible et du destin partagé » du Cameroun, tandis que les critiques affirment qu'il efface encore davantage l'identité distincte de la minorité anglophone. Alors que le drapeau était hissé lors de cérémonies à travers le pays, les citoyens débattaient de sa signification - certains l'appréciant comme un pas en avant, d'autres le considérant comme une nouvelle consolidation du pouvoir par le parti au pouvoir."
 news.1831.a: "Une différence mineure"
 news.1832.t: "[GetNewspaperHeader]Tentative de coup d'État au Cameroun"
 news.1832.d: "Le Cameroun a été plongé dans le chaos aujourd'hui alors que les troupes d'élite de la Garde républicaine ont lancé une violente tentative de coup d'État avant l'aube contre le gouvernement du président Paul Biya, vieux de deux ans. Des explosions et des tirs nourris ont secoué la capitale pendant six heures alors que les soldats rebelles s'emparaient de la radio d'État et des principales installations militaires avant d'être écrasés de manière décisive par les forces loyalistes. Le porte-parole de la présidence, Ferdinand Ngoh, a déclaré à midi la situation \"complètement sous contrôle\", révélant que les conspirateurs - parmi lesquels des officiers supérieurs du nord du pays - avaient tenté de prendre d'assaut le palais présidentiel. Les premiers rapports font état d'au moins 50 morts, dont le présumé putschiste, le colonel Saleh Ibrahim, et des dizaines d'autres ont été arrêtés lors des opérations de sécurité en cours. Dans un discours télévisé, Biya, visiblement ébranlé, a salué la loyauté de l'armée tout en promettant de « purger tous les traîtres ». L'échec du soulèvement, survenu quelques mois seulement après que Biya a consolidé le pouvoir en éliminant les loyalistes d'Ahidjo, révèle de dangereuses fractures au sein de l'establishment politique camerounais. Les vols internationaux ont été temporairement suspendus pendant que des patrouilles blindées bloquaient Yaoundé, le gouvernement imposant un couvre-feu pour une durée indéterminée, du crépuscule à l'aube, dans tout le pays."
 news.1832.a: "Choquant!"
 news.1833.t: "[GetNewspaperHeader]Le régime de David Dacko renversé en République centrafricaine"
 news.1833.d: "Le président de la République centrafricaine, David Dacko, a été renversé tôt ce matin lors d'un coup d'État militaire surprise dirigé par son propre cousin, le colonel Jean-Bédel Bokassa, mettant fin à cinq années de régime civil. Cette prise de pouvoir sans effusion de sang a vu les troupes fidèles à Bokassa - un vétéran décoré de l'armée française - occuper les bâtiments gouvernementaux et la radio nationale sans résistance. Dans une émission diffusée à l'aube, le nouveau régime militaire a déclaré la dissolution du gouvernement de Dacko, citant comme justification la \"mauvaise gestion économique\" et la \"corruption\". Dacko, qui avait conduit la RCA à l'indépendance de la France en 1960, aurait été placé en détention au palais présidentiel avant d'être assigné à résidence. Le coup d'État marque un tournant dramatique pour la jeune nation, puisque Bokassa, 45 ans, suspend immédiatement la constitution et interdit tous les partis politiques. Les observateurs notent que cette éviction fait suite à des mois de tensions croissantes entre l'administration civile de Dacko et les dirigeants militaires. La France, qui entretient des liens étroits avec les deux hommes, n'a pas encore officiellement reconnu le nouveau régime alors que les habitants de Bangui se réveillent en voyant des soldats patrouiller dans leurs rues."
 news.1833.a: "Les années 1960 ont été la décennie des coups d'État militaires en Afrique subsaharienne"
 news.1834.t: "[GetNewspaperHeader]Mouammar Kadhafi convainc Jean-Bédel Bokassa de se convertir à l'islam"
 news.1834.d: "Dans une étonnante conversion politique et religieuse, l'empereur autoproclamé Jean-Bédel Bokassa Ier de l'Empire centrafricain a adopté l'islam à la suite de réunions à huis clos avec le dirigeant libyen Mouammar Kadhafi à Tripoli. Le dictateur controversé, connu pour son règne brutal et son couronnement extravagant, répond désormais au nom de Salah Eddine Ahmed Bokassa après une cérémonie de conversion privée à laquelle participent Kadhafi et des religieux islamiques. Des sources au sein du palais présidentiel affirment que Kadhafi - qui a étendu son influence en Afrique - avait promis une aide financière et des livraisons de pétrole en échange de l'adhésion de Bokassa à l'Islam. Cette annonce a provoqué une onde de choc dans ce pays à majorité chrétienne, les responsables du Vatican exprimant leur « profonde inquiétude » quant à l'avenir des relations entre l'Église et l'État. Le changement soudain de Bokassa intervient dans un contexte d'isolement international croissant suite à des allégations de cannibalisme et d'exécutions massives. Alors que la radio d'État déclare qu'il s'agit d'une « nouvelle ère d'éveil spirituel », les dissidents craignent une islamisation forcée, notant que des conseillers militaires libyens ont déjà été repérés à Bangui. Alors que l'avenir de la RCA est en jeu, une question domine : s'agit-il d'une foi authentique ou d'une autre tactique de survie de la part du dirigeant le plus imprévisible de l'Afrique ?"
 news.1834.a: "Il s'agit sans doute de l'une des conversions politiques les plus flagrantes de l'histoire"
 news.1835.t: "[GetNewspaperHeader]Bokassa Ier déclare l'empire centrafricain"
 news.1835.d: "Dans l'une des démonstrations de mégalomanie les plus extravagantes de l'histoire, l'empereur autoproclamé Bokassa Ier a transformé aujourd'hui la République centrafricaine en monarchie, se couronnant lors d'une cérémonie surpassant en opulence le couronnement de Napoléon. L'ancien colonel de l'armée, portant une couronne en or de 26 livres et une robe de velours doublée d'hermine, a défilé à travers Bangui dans une calèche dorée tirée par des étalons blancs devant un parterre de dignitaires étrangers déconcertés. Le couronnement de 30 millions de dollars - financés par les diamants et l'aide française - a eu lieu alors que les sujets de Bokassa étaient confrontés à des salaires de misère. Plus de 5 000 soldats ont imposé les célébrations tandis que le sceptre de l'empereur en diamant de 17 carats brillait sous les lustres importés du « Palais impérial » nouvellement construit. L'approbation tacite de la France est venue via un cadeau personnel de bijoux du président [FRA.GetLeader], malgré les preuves croissantes du cannibalisme et des exécutions massives de Bokassa. Les analystes politiques considèrent cela comme l'effondrement final d'une nation autrefois prometteuse, aujourd'hui ruinée par la folie des grandeurs de son dirigeant. Alors que Bokassa déclare son empire « l'héritier spirituel de Charlemagne », les dissidents murmurent une révolte à venir, tandis que le monde se demande combien de temps encore ce Néron tropical pourra maintenir son fantasme grotesque."
 news.1835.a: "Quelle part du budget annuel ?"
 news.1836.t: "[GetNewspaperHeader]Bokassa Ier renversé lors de l'opération Caban"
 news.1836.d: "Dans une opération militaire méticuleusement planifiée baptisée « Caban », les parachutistes français ont renversé aujourd'hui l'empereur autoproclamé Bokassa Ier, mettant ainsi fin à l'un des règnes les plus brutaux et les plus bizarres d'Afrique. Le tyran déchu - accusé d'avoir participé personnellement au massacre d'écoliers - était apparemment en train de chasser les éléphants en Libye lorsque son « Palais impérial », d'une valeur de 20 millions de dollars, est tombé aux mains de l'ancien président David Dacko, réinstallé par les forces françaises. Des témoins oculaires ont décrit des assauts d'hélicoptères avant l'aube sur des points stratégiques de Bangui alors que le 8e Régiment de parachutistes d'infanterie de marine française sécurisait la capitale en quelques heures. L'opération a eu lieu après que le cannibalisme présumé de Bokassa et le meurtre de 100 enfants qui protestaient contre le port de l'uniforme scolaire obligatoire aient mis en faillite la crédibilité de son régime. À Paris, le président [FRA.GetLeader]- autrefois patron de Bokassa - a déclaré la mission « une intervention humanitaire », bien que les critiques notent qu'elle a commodément précédé les révélations sur ses cadeaux de diamants à l'empereur déchu. Alors que les citoyens de Bangui brûlaient les portraits impériaux, Dacko a promis la démocratie mais a retenu les services de conseillers militaires français, ce qui a amené beaucoup de gens à se demander si le colonialisme avait vraiment pris fin dans la nouvelle « République centrafricaine »."
 news.1836.a: "D'un allié français à leur ennemi"
 news.1837.t: "[GetNewspaperHeader]André Kolingba accède à la présidence de la République Centrafricaine"
 news.1837.d: "Dans une prise de pouvoir rapide et sans effusion de sang avant l'aube, le général André Kolingba a renversé le président David Dacko, mettant ainsi fin à la brève expérience démocratique de la République centrafricaine. Les troupes armées fidèles à l'ancien chef d'état-major de l'armée, âgé de 47 ans, se sont emparées du palais présidentiel, de la radio nationale et des principaux bâtiments gouvernementaux sans tirer un seul coup de feu, annonçant la suspension de la constitution et la création d'une junte militaire. Ce coup d'État marque le cinquième changement de régime en RCA depuis l'indépendance en 1960, survenant à peine 20 mois après la réinstallation de Dacko après l'éviction de l'empereur Bokassa. Kolingba, un officier formé en France qui a servi sous Dacko et Bokassa, a cité « le chaos économique et la désunion nationale » pour justifier la prise de pouvoir. La France, qui maintient une influence militaire significative dans son ancienne colonie, a exprimé sa « préoccupation », mais n'a pas condamné le coup d'État. Alors que les habitants de Bangui se réveillaient avec les chars dans les rues, Kolingba a promis un gouvernement de transition mais n'a donné aucun calendrier pour restaurer un régime civil. Cette prise de pouvoir consolide la domination militaire dans une nation encore sous le choc du règne brutal de 13 ans de Bokassa, laissant beaucoup se demander si la RCA a échangé un homme fort contre un autre."
 news.1837.a: "La Centrafrique est loin d'être démocratique"
 news.1838.t: "[GetNewspaperHeader]Ange-Félix Patassé élu président de la République centrafricaine"
 news.1838.d: "Dans un moment historique pour la démocratie centrafricaine, le chef de l'opposition Ange-Félix Patassé a été élu président lors des premières élections multipartites du pays depuis l'indépendance, marquant une rupture décisive avec trois décennies de régime militaire et de dictature. L'ancien Premier ministre de 57 ans a obtenu 53 % du second tour des voix contre son rival Abel Goumba, sous la stricte supervision de l'ONU, les observateurs internationaux déclarant que le processus était « largement libre et équitable » malgré des irrégularités mineures. Ce scrutin historique, organisé avec le soutien logistique de l'ONU et 300 observateurs internationaux, a enregistré un taux de participation de 68 %, les citoyens faisant la queue pendant des heures pour mettre fin à l'ère Kolingba. Le secrétaire général de l'ONU, Boutros Boutros-Ghali, a salué la transition pacifique comme « un modèle pour les démocraties post-conflit », tandis que le président sortant André Kolingba, dont le régime militaire de 12 ans avait tenté de manipuler les élections précédentes, a reconnu sa défaite après l'intervention des médiateurs français et africains. Patassé, héritier d'une nation ravagée par les coups d'État et l'effondrement économique, a juré d'unir le pays fracturé, déclarant aux foules en liesse : \"Aujourd'hui, nous enterrons les fantômes de Bokassa et commençons notre véritable indépendance\"."
 news.1838.a: "Des élections libres et équitables sous supervision internationale"
 news.1839.t: "[GetNewspaperHeader]La mort de Bokassa"
 news.1839.d: "Jean-Bédel Bokassa, l'empereur autoproclamé dont le règne brutal de 13 ans sur la République centrafricaine est devenu synonyme de dictature africaine, est décédé dimanche à 75 ans dans une clinique de la capitale qu'il terrorisait autrefois. En cause, une crise cardiaque, qui a mis fin à une vie marquée par les extravagances grotesques, le cannibalisme présumé et le massacre d'écoliers, crimes pour lesquels il a été condamné à mort avant d'être gracié en 1993. Autrefois redouté sous le nom de « Bokassa I », l'ancien officier de l'armée française qui a pris le pouvoir en 1966 est mort comme il avait vécu depuis sa libération : dans une obscurité paradoxale. La radio d'État a d'abord ignoré sa mort, mais des milliers de personnes se sont rassemblées devant la morgue de Bangui, certaines pleurant l'homme qui a mis leur nation en faillite avec un couronnement de 20 millions de dollars à la Napoléon tandis que les enfants mouraient de faim39. Le gouvernement, reconnaissant sa popularité persistante parmi les factions nostalgiques de son époque « d'homme fort », a annoncé des funérailles nationales - une décision qui a choqué les défenseurs des droits de l'homme. L'héritage de Bokassa est une étude de contradictions : vétéran décoré de la Seconde Guerre mondiale qui a combattu pour la France, il a ensuite emprisonné et battu des journalistes comme Michael Goldsmith, un correspondant de l'AP dont l'épreuve de 1977 a révélé la sauvagerie du régime9. Sa chute en 1979 est survenue après que les troupes françaises l'ont évincé lors de l'Opération Caban, déclenchée par le massacre par sa Garde Impériale de 100 étudiants qui protestaient contre les uniformes obligatoires vendus par sa famille68. Exilé en France, il vécut dans des châteaux dorés avant de revenir inexplicablement en 1986 pour subir son procès, où un cuisinier témoigna avoir servi de la chair humaine à des invités79. Acquitté de cannibalisme mais reconnu coupable de meurtre, il a échappé à l'exécution lorsque le président Kolingba a commué sa peine."
 news.1839.a: "Un chiffre pour le moins controversé"
 news.1840.t: "[GetNewspaperHeader]François Bozizé dépose le gouvernement centrafricain"
 news.1840.d: "Les forces rebelles dirigées par l'ancien chef de l'armée François Bozizé ont pris d'assaut la capitale aujourd'hui, renversant le président Ange-Félix Patassé après des mois de combats et plongeant ce pays riche en minerais mais appauvri dans de nouveaux troubles. Le général de 56 ans, qui a fui au Tchad après l'échec d'une tentative de coup d'État en 2002, s'est emparé du palais présidentiel avec le soutien des troupes tchadiennes et des rebelles congolais, tandis que Patassé, qui assistait à un sommet au Niger, a été déclaré « évincé » dans une émission de radio. Le coup d'État marque le sixième changement de pouvoir violent en RCA depuis l'indépendance, survenant après que le régime de plus en plus autoritaire de Patassé et le non-paiement des soldats aient déclenché des mutineries. Bozizé, vêtu d'un treillis militaire, s'est proclamé chef d'un « gouvernement de transition », suspendant la constitution et promettant des élections - une promesse accueillie avec scepticisme dans un pays où aucun dirigeant n'a transféré pacifiquement le pouvoir depuis 1960. La France, l'ancienne puissance coloniale, a déployé des troupes pour protéger les étrangers mais a refusé d'intervenir, tandis que les dirigeants africains ont condamné la prise de pouvoir. Alors que les habitants de Bangui pillaient les bureaux gouvernementaux abandonnés, le sort du président déchu restait incertain, avec des rumeurs selon lesquelles il aurait cherché refuge au Cameroun. Cette prise de pouvoir remet en question les efforts de maintien de la paix de l'ONU et laisse les richesses en diamants et en bois de la RCA vulnérables à de nouveaux pillages par les factions armées."
 news.1840.a: "Un retour au régime militaire centrafricain"
 news.1841.t: "[GetNewspaperHeader]La guerre de Bush en Afrique centrale"
 news.1841.d: "Ce qui a commencé comme une nouvelle rébellion post-coup d'État s'est transformé en le conflit le plus dévastateur que l'Afrique centrale ait connu depuis des décennies, la guerre de Bush en Afrique centrale faisant désormais des milliers de morts et déplaçant près de 300 000 civils dans les provinces du nord du pays. Le régime fragile du président François Bozizé est confronté à une insurrection sans précédent sur trois fronts de factions rivales : l'Union des forces démocratiques (UFDR), l'Armée populaire pour la restauration de la démocratie (APRD) et la Convention des patriotes pour la justice et la paix (CPJP), chacune contrôlant des pans de territoires riches en diamants où les forces gouvernementales n'osent pas s'aventurer. Le conflit, largement ignoré par les médias internationaux, a dégénéré en nettoyage ethnique, les mercenaires tchadiens et les combattants soudanais Janjaweed exacerbant la violence. Les enquêteurs de l'ONU confirment des charniers près de Paoua, où des villages entiers ont été exécutés en représailles à des sympathies présumées pour les rebelles. Les groupes humanitaires signalent que des enfants ont été brûlés vifs dans leurs écoles - échos des atrocités de l'ère Bokassa dans les mêmes régions. Le gouvernement de Bozizé, soutenu par la France, accusé d'armer les éleveurs musulmans contre les agriculteurs chrétiens, ne survit que grâce à l'aide militaire libyenne et à un accord de paix fragile signé en avril 2007. Mais avec le rejet de l'accord par les rebelles et l'émergence de nouveaux chefs de guerre chaque semaine, les diplomates craignent que la RCA - « l'État fantôme » au coeur de l'Afrique - ne s'effondre complètement, créant une crise qui pourrait déstabiliser six pays voisins."
 news.1841.a: "Une autre guerre civile au début du 21e siècle"
 news.1842.t: "[GetNewspaperHeader]La fin de l'Afrique coloniale française"
 news.1842.d: "Comme des dominos qui tombent, l'empire français d'Afrique occidentale et centrale s'effondre dans le coup de tonnerre de la libération, alors que huit nations accèdent à leur indépendance en seulement 24 mois révolutionnaires. Le changement sismique a commencé avec le « non » provocateur de la Guinée au référendum de De Gaulle de 1958 - la seule colonie à rejeter les liens avec la Communauté française - et culmine cette semaine alors que la Mauritanie devient la dernière à se libérer en 1960. De Léopold Sédar Senghor du Sénégal à Félix Houphouët-Boigny de Côte d'Ivoire, une génération de dirigeants éduqués en France démantèle paradoxalement le système qui les a formés. Mais en Afrique centrale, la transition s'avère plus compliquée : tandis que le Gabonais Léon M'Ba prend le pouvoir pacifiquement, l'indépendance du Cameroun est baptisée dans le sang alors que les forces françaises écrasent secrètement les rebelles de l'UPC dans une sale guerre qui tue des milliers de personnes. Paris maintient un contrôle invisible grâce au franc CFA - une monnaie coloniale toujours imprimée en France - et à des accords militaires permettant des interventions comme le coup d'État de 1964 pour réinstaller M'Ba. Alors que le drapeau tricolore descend pour la dernière fois sur Brazzaville en août, les rumeurs d'un nouvel impérialisme se répandent : les mines d'uranium françaises au Niger arborent toujours le drapeau tricolore, tandis que les plates-formes pétrolières d'Elf-Aquitaine au large du Gabon fonctionnent en territoire souverain."
 news.1842.a: "Une relique révolue d'un autre âge..."
 news.1843.t: "[GetNewspaperHeader]L'opération Léopard de la France rétablit Léon M'ba après l'échec du coup d'État au Gabon"
 news.1843.d: "Dans une étonnante démonstration d'intervention néocoloniale, les parachutistes français ont pris d'assaut la capitale du Gabon tôt ce matin, écrasant un coup d'État militaire naissant et réintégrant le président déchu Léon M'ba dans une opération éclair baptisée \"Léopard\". La crise a commencé hier lorsque des officiers de l'armée gabonaise, dirigés par le lieutenant Jacques Mombo, se sont emparés de bâtiments gouvernementaux clés, ont arrêté M'ba et ont déclaré la fin de son « régime corrompu et contrôlé par la France ». Mais en moins de 24 heures, la France - l'ancien dirigeant colonial du Gabon - a réagi avec une force écrasante. Des témoins oculaires ont rapporté que les troupes de la Légion étrangère française sont descendues sur l'aéroport de Libreville à l'aube, appuyées par des véhicules blindés, maîtrisant rapidement les forces rebelles. À midi, M'ba - qui avait été emprisonné dans une caserne militaire - a été libéré et a défilé dans les rues sous une forte garde française. Le président français [FRA.GetLeader] a justifié l'opération comme un « devoir de protéger le gouvernement légal du Gabon », citant les pactes secrets de défense signés à l'indépendance. Les critiques y voient cependant une violation flagrante de la souveraineté. \"Cela prouve que M'ba n'est qu'une marionnette\", a crié un manifestant de Libreville avant d'être dispersé par les troupes françaises. Les dirigeants rebelles, dont Mombo, se seraient enfuis vers la jungle frontalière avec le Congo. M'ba, visiblement ébranlé mais provocant, a annoncé un couvre-feu national et a promis un « châtiment impitoyable » pour les traîtres. Les analystes préviennent que l'intervention pourrait avoir l'effet inverse, alimentant le sentiment anti-français à travers l'Afrique. L'Union soviétique a condamné « l'agression impérialiste » de la France, tandis que les États-Unis ont prudemment reconnu leurs « préoccupations en matière de stabilité ». Au Gabon, les rues sont étrangement calmes, occupées par des soldats français, et l'avenir de la nation est en jeu."
 news.1843.a: "La France a une forte emprise sur ses anciennes colonies"
 news.1844.t: "[GetNewspaperHeader]Le président du Gabon, Léon M'ba, décède en fonction"
 news.1844.d: "Le premier président du Gabon, Léon M'ba, l'architecte controversé de l'alliance post-indépendance avec la France, est décédé aujourd'hui à l'âge de 65 ans après une longue bataille contre le cancer, plongeant la nation riche en pétrole d'Afrique centrale dans une transition de pouvoir soigneusement orchestrée mais incertaine. Le dirigeant malade, dont la politique pro-française et le régime autoritaire faisaient de lui à la fois un symbole de la stabilité du Gabon et un paratonnerre pour les critiques, est décédé dans un hôpital parisien où il était soigné depuis des mois, entouré de médecins français et de responsables gabonais. Sa mort était attendue depuis des semaines, mais son arrivée a néanmoins provoqué une onde de choc à Libreville, où les forces militaires françaises ont discrètement renforcé la sécurité autour des principaux sites gouvernementaux pour éviter tout trouble. Le successeur de M'ba, le vice-président Albert-Bernard Bongo, 31 ans - ancien employé des postes devenu protégé politique - a rapidement prêté serment quelques heures seulement après l'annonce, assurant ainsi un transfert de pouvoir sans heurts que Paris avait méticuleusement planifié pour sauvegarder ses intérêts stratégiques et économiques au Gabon. L'héritage du défunt président reste profondément controversé : loué par les alliés pour avoir maintenu la stabilité et les liens économiques du Gabon avec la France, mais condamné par les opposants comme une figure de proue néocoloniale qui a réprimé la dissidence et orchestré son retour au pouvoir en 1964 via des parachutistes français après un bref coup d'État. Alors que la nation se prépare à une période de deuil officiel, les rumeurs sur l'inexpérience de Bongo et la question imminente de savoir si la richesse pétrolière du Gabon bénéficiera un jour réellement à sa population dominent les conversations dans les rues de Libreville, où les drapeaux flottent en berne et où l'avenir est en jeu."
 news.1844.a: "Le plus grand défenseur de la Françafrique est mort"
 news.1845.t: "[GetNewspaperHeader]Un réacteur nucléaire naturel découvert à Oklo, au Gabon"
 news.1845.d: "Des scientifiques gabonais ont fait une découverte géologique sans précédent : un réacteur à fission nucléaire naturel enfoui au plus profond des mines riches en uranium d'Oklo, une région reculée du sud-est du pays, réécrivant les limites de la physique connue et remettant en question le monopole présumé de l'humanité sur la technologie nucléaire. Ce phénomène déconcertant, qui aurait provoqué des réactions en chaîne critique auto-entretenues il y a près de 1,7 milliard d'années, a été découvert par des chercheurs nucléaires français analysant des échantillons d'uranium appauvri provenant des opérations minières du Gabon, pour ensuite découvrir des rapports isotopiques inexplicables qui défiaient les explications conventionnelles. Une enquête plus approfondie a révélé au moins 16 zones de réacteurs anciens où, dans des conditions précises de modération de l'eau et de concentration d'uranium, la nature avait réalisé ce que la science moderne croyait autrefois impossible : une fission nucléaire spontanée et autorégulée, fonctionnant par intermittence pendant des centaines de milliers d'années comme un foyer atomique à combustion lente. Cette découverte a provoqué une onde de choc dans la communauté scientifique mondiale, les physiciens la qualifiant de « plus ancienne centrale nucléaire de la planète » et d'un humble rappel de l'ingéniosité de la nature. Pour le Gabon, déjà un fournisseur clé d'uranium du programme nucléaire français, cette découverte ajoute une couche surréaliste à sa richesse en ressources, même si les responsables se sont empressés d'assurer au public que les réacteurs - épuisés depuis longtemps - ne présentaient aucun risque radiologique. Des spéculations datant de la guerre froide ont brièvement éclaté quant à savoir si de tels réacteurs naturels pourraient inspirer de nouveaux modèles énergétiques, mais l'extrême rareté des conditions a tempéré les attentes."
 news.1845.a: "Fascinant!"
 news.1846.t: "[GetNewspaperHeader]Albert-Bernard Bongo se convertit à l'islam, désormais Omar Bongo"
 news.1846.d: "Le président gabonais Albert-Bernard Bongo, le dirigeant de 38 ans qui dirige ce pays d'Afrique centrale riche en pétrole depuis 1967, a stupéfié le monde politique et diplomatique en annonçant sa conversion à l'islam, adoptant le nom d'Omar Bongo, ce qui marque un tournant géopolitique dramatique pour ce pays traditionnellement francophile. La révélation inattendue a eu lieu lors d'une cérémonie privée à Libreville en présence de dignitaires musulmans d'Afrique du Nord et du Moyen-Orient. Omar Bongo, récemment renommé, a cité comme motivation \"l'éveil spirituel\", bien que les analystes régionaux aient immédiatement interprété la conversion comme une tentative calculée de renforcer les liens avec les États arabes riches en pétrole dans un contexte de changement de dynamique du pouvoir mondial. L'annonce envoie une onde de choc au sein de la population majoritairement chrétienne du Gabon et fait sourciller à Paris, où les responsables français - habitués à l'alignement inébranlable de Bongo sur les intérêts occidentaux - se démèneraient pour évaluer les implications pour les intérêts économiques et militaires substantiels de la France dans son ancienne colonie. Les sceptiques soulignent la prochaine visite d'État de Bongo auprès de Mouammar Kadhafi en Libye et les récentes ouvertures à l'Arabie Saoudite comme preuve qu'il s'agit moins de foi que de realpolitik, d'autant plus que le Gabon cherche de nouveaux alliés suite aux récentes critiques sur ses liens étroits avec la France. Les porte-parole du gouvernement insistent sur le fait que les convictions personnelles du président n'affecteront pas la gouvernance laïque du Gabon, mais cette décision a déjà déclenché un débat féroce dans les cafés et les marchés de Libreville, où certains y voient une trahison de l'identité nationale tandis que d'autres y voient un génie pragmatique dans la courtisation des pétrodollars du monde islamique. "
 news.1846.a: "Vision divine ?"
 news.1847.t: "[GetNewspaperHeader]Le grand boom pétrolier gabonais"
 news.1847.d: "Le Gabon, petit pays d'Afrique centrale longtemps éclipsé par ses voisins, est soudainement apparu comme l'une des réussites économiques les plus spectaculaires au monde alors que l'or noir transforme du jour au lendemain cette ancienne colonie française en un pétro-État. Alors que les prix du pétrole brut ont quadruplé dans un contexte de crise énergétique mondiale et que de nouvelles découvertes offshore ont doublé les réserves prouvées du Gabon, Libreville connaît un boom économique sans précédent qui a transformé ses avenues coloniales endormies en une frénésie de construction et de consommation ostentatoire. Le gouvernement du président Omar Bongo annonce une croissance stupéfiante de 40 % du PIB cette année seulement, alors que les revenus pétroliers inondent les coffres de l'État, permettant la réalisation de projets d'infrastructure grandioses, notamment le chemin de fer Transgabonais qui sera bientôt construit et un nouveau palais présidentiel étincelant. Les rues de la capitale regorgent désormais d'expatriés français et de dirigeants pétroliers américains, tandis que l'élite gabonaise - y compris le cercle familial en pleine expansion du président - s'arrache les villas de luxe, les berlines Mercedes-Benz et la haute couture parisienne à un rythme qui ferait rougir les cheikhs du Golfe. Pourtant, derrière ces paillettes, des signes inquiétants émergent : les économistes mettent en garde contre le « syndrome hollandais », alors que d'autres secteurs s'effondrent, que l'inflation monte en flèche de 30 % par an et que les Gabonais ruraux ne voient que peu de bénéfices de cette aubaine. Ce boom a également attiré l'attention de la Guerre froide, les diplomates soviétiques et américains courtisant soudainement le régime de Bongo, tandis que le géant pétrolier français Elf-Aquitaine resserre discrètement son emprise sur les gisements les plus lucratifs du Gabon. Alors que le champagne coule à flots au nouvel hôtel Hilton de Libreville et que les travaux commencent sur la première raffinerie de pétrole d'Afrique répondant aux normes de l'OPEP, beaucoup se demandent si ce boom va soulever tous les Gabonais - ou simplement enrichir quelques-uns avant que les puits ne s'assèchent."
 news.1847.a: "Le revenu par habitant le plus élevé en Afrique ?"
 news.1848.t: "[GetNewspaperHeader]Scandale de la Françafrique"
 news.1848.d: "Un tremblement de terre politique a ébranlé les fondements des relations franco-africaines alors que des révélations explosives sur la « Françafrique » - le réseau obscur de liens politiques, économiques et militaires entre la France et ses anciennes colonies africaines - ont éclaté au grand jour à travers une série d'enquêtes accablantes. Au centre du scandale se trouvent des documents secrets et des témoignages de lanceurs d'alerte révélant des décennies d'opérations secrètes au cours desquelles les gouvernements français successifs auraient soutenu des régimes autoritaires, orchestré des coups d'État et canalisé des milliards d'aide au développement vers des entreprises françaises, tout en fermant les yeux sur la corruption et les violations des droits de l'homme. Les allégations les plus choquantes concernent le président gabonais Omar Bongo, qui aurait reçu des millions de dollars en paiements illicites de la part du géant pétrolier français Elf-Aquitaine, des dirigeants de l'entreprise témoignant qu'ils détournaient régulièrement des fonds vers les dirigeants africains en guise de « primes présidentielles » pour obtenir des contrats. Des journalistes d'investigation ont découvert des preuves selon lesquelles les interventions militaires françaises étaient décidées non pas dans les ministères parisiens mais lors de réunions secrètes à la « Cellule Afrique » de l'Élysée, tandis que les enfants de dirigeants africains acquéraient mystérieusement des biens immobiliers de luxe parisiens. Le scandale a atteint les plus hauts niveaux de France, impliquant l'ancien président Valéry Giscard d'Estaing et son conseiller Jacques Foccart, l'architecte présumé du système de gouvernance fantôme postcolonial de la France. Alors que des manifestations éclatent en Afrique contre le « néocolonialisme » et que les dirigeants de l'opposition française exigent des enquêtes parlementaires, les révélations menacent de mettre à mal ce qui a longtemps été considéré comme une « relation particulière » entre la France et l'Afrique francophone."
 news.1848.a: "Politiquement scandaleux !"
 news.1849.t: "[GetNewspaperHeader]São Tomé et Príncipe établit un gouvernement intérimaire avant les élections multipartites"
 news.1849.d: "La petite nation insulaire de São Tomé et Príncipe a franchi une étape historique vers la démocratie lorsque le président Manuel Pinto da Costa a annoncé la formation d'un gouvernement d'unité intérimaire pour superviser les premières élections multipartites du pays, mettant fin à 16 ans de régime marxiste à parti unique dans l'une des transitions politiques les plus calmes d'Afrique. Cette décision intervient après des mois de pression croissante de la part des militants pro-démocratie et de l'Église catholique dans l'ancienne colonie portugaise, où l'effondrement économique et la chute des régimes communistes dans le monde entier ont rendu intenable l'idéologie marxiste-léniniste du parti au pouvoir, le MLSTP. Dans le cadre de l'accord de transition négocié par les médiateurs portugais, le nouveau conseil de transition comprend des personnalités de l'opposition et des dirigeants de la société civile qui travailleront aux côtés des responsables du MLSTP pour rédiger une nouvelle constitution et des lois électorales dans un délai de six mois. Cette annonce surprise a électrisé cet archipel de 120 000 habitants, avec des foules rassemblées dans les rues aux couleurs pastel de la ville de São Tomé pour célébrer ce que beaucoup appellent leur « révolution tranquille » - un contraste frappant avec les bouleversements violents observés ailleurs dans la vague de démocratisation de l'Afrique. Les observateurs internationaux notent que la transition pacifique reflète la culture politique unique du pays dans une région mieux connue pour ses coups d'État et ses hommes forts, même si des défis se profilent : l'économie dépendante du cacao a diminué de 40 % depuis l'indépendance, et le gouvernement intérimaire doit mener des négociations tendues sur la manière de répartir les revenus pétroliers offshore potentiels qui pourraient transformer les îles appauvries. Alors que les derniers drapeaux rouges sont baissés sur les bâtiments gouvernementaux et que les affiches de campagne commencent à apparaître sur les cocotiers, les São Toméens découvrent quelque chose d'inhabituel dans la politique africaine : la possibilité d'un changement sans chaos."
 news.1849.a: "Une victoire pour la démocratie de l'Atlantique Sud"
 news.1850.t: "[GetNewspaperHeader]Miguel Trovoada élu président lors des premières élections multipartites libres de São Tomé et Príncipe"
 news.1850.d: "À un moment historique pour la démocratie africaine, Miguel Trovoada, ancien Premier ministre devenu exilé politique, a été élu premier président librement choisi de São Tomé et Príncipe, marquant le point culminant pacifique de l'extraordinaire transition de la nation insulaire d'un régime marxiste à parti unique à une démocratie multipartite. L'ancien combattant indépendantiste de 53 ans, qui a passé 13 ans en exil après s'être brouillé avec le régime au pouvoir du MLSTP, est revenu triomphalement dans la capitale bordée de palmiers pour remporter la victoire avec 81 % des voix lors d'élections déclarées par les observateurs internationaux comme remarquablement libres et équitables. Son élection complète une révolution sans effusion de sang qui a commencé quelques mois plus tôt lorsque le président Manuel Pinto da Costa - le dernier dirigeant marxiste d'Afrique - a légalisé de manière inattendue les partis d'opposition et convoqué des élections, cédant à la fois à la pression intérieure et aux vents démocratiques balayants du continent. Le discours de victoire de Trovoada, prononcé devant une foule euphorique sur la place du palais présidentiel de l'époque coloniale, a promis « une nouvelle aube » pour l'archipel producteur de cacao, s'engageant à attirer les investissements étrangers, à réformer l'économie effondrée et à maintenir le climat unique de tolérance politique du pays. Le transfert pacifique du pouvoir contraste fortement avec le Gabon et la Guinée équatoriale voisins, où des autocrates vieillissants s'accrochent au pouvoir, et offre un modèle démocratique rare pour les petits États africains. Alors que les célébrants dansaient dans les rues aux couleurs pastel de São Tomé au rythme des tambours des travailleurs du cacao, même les candidats vaincus du MLSTP ont reconnu la volonté du peuple - prouvant que cette petite nation de 120 000 habitants vient peut-être d'écrire l'un des chapitres politiques les plus prometteurs de l'Afrique depuis des décennies."
 news.1850.a: "Merveilleux"
 news.1851.t: "[GetNewspaperHeader]Manuel Quintas de Almeida coupe la jeune démocratie de São Tomé et Príncipe"
 news.1851.d: "Quatre ans seulement après sa célèbre transition démocratique, la fragile démocratie de São Tomé-et-Principe a été brisée par un coup d'État militaire sans effusion de sang dirigé par le major Manuel Quintas de Almeida, qui a pris le contrôle de la petite nation insulaire alors que le président Miguel Trovoada était à l'étranger pour négocier des réformes économiques. La prise de pouvoir avant l'aube a vu moins de 100 soldats occuper des bâtiments gouvernementaux clés, l'aéroport et les stations de radio sans tirer un seul coup de feu, alors que les putschistes annonçaient la formation d'une « Junte de salut national » pour faire face à ce qu'ils ont appelé « la ruine totale du pays » sous un régime civil. Le coup d'État révèle les vulnérabilités de l'une des expériences démocratiques les plus prometteuses d'Afrique, où la chute des prix du cacao et les allégations de corruption ont érodé la confiance du public dans l'administration de Trovoada, malgré ses réformes initiales. La condamnation internationale a immédiatement afflué, le Portugal - l'ancienne puissance coloniale - ayant rappelé son ambassadeur et la session d'urgence de l'Union africaine qualifiant le coup d'État d'« attaque inacceptable contre l'ordre constitutionnel ». Pourtant, dans les rues sinueuses de la ville de São Tomé, les réactions ont été mitigées : tandis que les dirigeants de la société civile dénonçaient l'intervention militaire, certains citoyens épuisés exprimaient tranquillement l'espoir que la junte pourrait stabiliser une économie où les enseignants et les fonctionnaires n'ont pas été payés depuis des mois. L'architecte du coup d'État, le major Almeida - un vétéran moustachu de la lutte pour l'indépendance - insiste sur le fait qu'il ne s'agit pas d'un retour à la dictature mais d'une « mesure corrective », promettant des élections d'ici un an. Alors que le monde se demande si ce micro-État de l'océan Indien suivra le piège du coup d'État africain ou retrouvera son exceptionnalisme démocratique, le putsch nous rappelle que même les transitions les plus pleines d'espoir peuvent s'effondrer lorsque le désespoir économique rencontre des soldats ambitieux."
 news.1851.a: "Une tragédie pour la démocratie de l'Atlantique Sud"
 news.1852.t: "[GetNewspaperHeader]La démocratie restaurée à São Tomé et Príncipe"
 news.1852.d: "Dans un renversement dramatique qui a sauvé l'une des démocraties les plus fragiles d'Afrique, la junte militaire qui a pris le pouvoir à São Tomé et Príncipe il y a seulement six jours a cédé le contrôle aux autorités civiles à la suite d'intenses pressions internationales et de négociations en coulisses. L'étonnant rétablissement de l'ordre constitutionnel est intervenu après des pourparlers marathon menés sous la médiation de diplomates portugais et angolais, qui ont abouti à la signature d'un accord par lequel le chef du coup d'État, le major Manuel Quintas de Almeida, a remis le pouvoir au président de l'Assemblée nationale, Francisco Fortunato Pires, lors d'une cérémonie solennelle au palais présidentiel. La junte éphémère, qui avait promis de « nettoyer » le gouvernement de la corruption, a cédé sous une combinaison paralysante de sanctions économiques, de suspension de l'aide des pays donateurs et de menace d'intervention militaire régionale du Nigeria et de l'Angola. Le président Miguel Trovoada, bloqué au Gabon pendant la crise, a été accueilli en héros alors que des milliers de São Toméens ont envahi les rues aux couleurs pastel de la capitale en agitant des feuilles de palmier et le drapeau rouge, vert et jaune de la nation, célébrant ce que beaucoup appellent le « miracle des six jours ». La résolution pacifique constitue une rare victoire pour la résilience démocratique en Afrique, où les coups d'État militaires ont généralement conduit à des dictatures prolongées. Les observateurs internationaux attribuent ce renversement rapide à la culture politique unique des îles - où les relations personnelles au sein d'une petite population de 120 000 habitants l'emportent souvent sur les divisions idéologiques - et à la surprenante volonté de négociation de la junte."
 news.1852.a: "Un São Tomé et Príncipe démocratique"
 news.1853.t: "[GetNewspaperHeader]Fradique de Menezes élu président de São Tomé et Príncipe"
 news.1853.d: "Les îles riches en cacao de São Tomé et Príncipe ont inauguré une nouvelle ère de renouveau démocratique puisque l'homme d'affaires et ancien diplomate Fradique de Menezes a été élu président lors d'une victoire écrasante, marquant le deuxième transfert pacifique du pouvoir depuis que le pays a adopté le multipartisme il y a dix ans. Le magnat de l'agro-industrie de 59 ans, candidat indépendant avec le soutien des partis d'opposition, a remporté 56 % des voix contre le candidat au pouvoir du MLSTP-PSD, Manuel Pinto da Costa - le même leader marxiste qui a gouverné ces îles comme un État à parti unique dans les années 1980. Le discours de victoire de Menezes, prononcé devant une foule euphorique dans le palais présidentiel en ruine de l'époque coloniale, a promis de transformer la nation en difficulté en « un Singapour africain » en exploitant ses réserves pétrolières offshore inexploitées et en revitalisant le secteur du cacao effondré. Les observateurs internationaux ont salué l'élection comme étant remarquablement transparente dans une région mieux connue pour sa fraude électorale, même si le taux de participation a à peine dépassé 50 %, signe d'une apathie persistante des électeurs après des années de stagnation économique. Les défis immédiats du président élu sont de taille : les fonctionnaires n'ont pas été payés depuis des mois, la production de cacao a chuté de 70 % depuis l'indépendance et la découverte de pétrole dans le golfe de Guinée a fait craindre la « malédiction des ressources » qui frappe le Nigeria et la Guinée équatoriale voisins. Pourtant, Menezes - un polyglotte formé aux États-Unis qui a autrefois été ambassadeur des îles à Bruxelles - apporte à la présidence une rare expérience du secteur privé, ainsi que des promesses d'éradiquer la corruption qui a prospéré sous le président sortant Miguel Trovoada. "
 news.1853.a: "Fradique de Menezes les mènera à la démocratie !"
 news.1854.t: "[GetNewspaperHeader]Fernando Pereira organise un coup d'État à São Tomé et Príncipe"
 news.1854.d: "La fragile démocratie de São Tomé et Príncipe a été plongée dans le chaos aujourd'hui lorsque le major Fernando Pereira a mené un coup d'État militaire avant l'aube, prenant le contrôle des bâtiments gouvernementaux et arrêtant le président Fradique de Menezes alors qu'il était à l'étranger pour négocier des accords d'exploration pétrolière au Nigeria. Les putschistes, se déclarant eux-mêmes « Junte militaire du salut national », ont invoqué la « corruption endémique » et le « pillage massif de nos futures richesses pétrolières » pour justifier leur prise de pouvoir, diffusant leur manifeste à la radio nationale tandis que des soldats armés patrouillaient dans les rues endormies de la capitale tropicale. Le putsch s'est déroulé avec une efficacité surprenante : en quelques heures, la junte avait suspendu la constitution, fermé les frontières et imposé un couvre-feu du crépuscule à l'aube, tandis que la Première ministre Maria das Neves et plusieurs ministres étaient assignés à résidence dans le palais présidentiel aux murs roses. La réaction internationale a été rapide et furieuse, l'Union africaine menaçant de sanctions immédiates et l'ancienne puissance coloniale du Portugal qualifiant le coup d'État de « couteau dans le dos de la démocratie africaine ». Pourtant, sur les îles elles-mêmes, les réactions ont été mitigées : tandis que les dirigeants de la société civile ont condamné la prise de pouvoir, de nombreux São Toméens pauvres, frustrés par des années de promesses vides malgré la découverte d'énormes réserves de pétrole au large, ont ouvertement applaudi les soldats, certaines vendeuses du marché leur offrant même des fruits dans les rues. L'architecte du coup d'État, le major Pereira - un vétéran moustachu du putsch de courte durée de 1995 - a insisté sur le fait qu'il ne s'agissait pas d'une prise de pouvoir mais d'une « intervention patriotique », promettant des élections une fois que « les voleurs seront traduits en justice »."
 news.1854.a: "Une autre junte saotoamienne"
 news.1855.t: "[GetNewspaperHeader]Gouvernement démocratique rétabli à São Tomé et Príncipe"
 news.1855.d: "Dans un drame époustouflant d'une semaine qui a mis à l'épreuve la résilience de l'une des plus petites démocraties d'Afrique, le gouvernement élu de São Tomé et Príncipe a été entièrement rétabli aujourd'hui lorsque le chef du coup d'État, le major Fernando Pereira, a renoncé au pouvoir à la suite d'intenses pressions internationales et de négociations aux enjeux élevés. Cette résolution sans effusion de sang est intervenue après sept jours de tension au cours desquels des canonnières nigérianes ont encerclé la nation insulaire, les États-Unis ont gelé toute aide et une médiation de dernière minute des dirigeants régionaux qui a abouti à la signature d'un accord accordant l'amnistie aux putschistes en échange du retour immédiat du président Fradique de Menezes. La percée s'est produite lorsque les diplomates angolais et portugais ont négocié un compromis pour sauver la face : la junte démissionnerait après avoir obtenu des promesses d'augmentation des salaires des militaires et d'organisation d'un forum national sur la transparence des revenus pétroliers - les mêmes problèmes de corruption qui avaient déclenché la rébellion. Alors que l'avion de Menezes atterrissait au modeste aéroport de São Tomé à l'aube, des centaines de citoyens se sont alignés sur le tarmac en agitant des feuilles de palmier et le drapeau national, célébrant ce que beaucoup ont appelé « la semaine du miracle ». Le président, semblant à la fois las et provocateur, a loué les « intentions patriotiques » de l'armée tout en réaffirmant sévèrement l'ordre constitutionnel lors d'un discours diffusé dans tout le pays par la même station de radio que la junte avait réquisitionnée quelques jours plus tôt. Les observateurs internationaux ont poussé des soupirs de soulagement lorsque le deuxième plus petit pays d'Afrique a évité de devenir un autre coup d'État à la Guinée-Bissau dans la région instable du Golfe de Guinée."
 news.1855.a: "São Tomé et Príncipe démocratique à nouveau !"
