#OLD
 ZIM_60s_1961_constitution:0 "Constitution de 1961"
 ZIM_60s_winds_of_change:0 "Discours sur les vents du changement"
 ZIM_60s_winds_of_change_desc:0 "Ce discours du gouvernement britannique dirigé par les conservateurs a montré que l'Angleterre n'avait pas l'intention de bloquer l'indépendance de nombreux territoires. Cela conduira à une plus grande aspiration à l'indépendance rhodésienne."
 ZIM_60s_end_of_union:0 "Fin de l'Union"
 ZIM_60s_end_of_union_desc:0 "Malgré d'énormes efforts, le syndicat ne peut pas continuer à exister. Mais qui sait, peut-être que cela mènera à quelque chose de mieux ?"
 ZIM_60s_refugees_from_congo:0 "Réfugiés blancs du Congo"
 ZIM_60s_refugees_from_congo_desc:0 "Avec les récents troubles au Congo, de nombreux Blancs sont à la recherche d'un logement. Pourquoi ne pas le proposer ici ?"
 ZIM_60s_reinforce_union:0 "Renforcer l'Union"
 ZIM_60s_reinforce_union_desc:0 "Le syndicat ne va pas très bien. Nationalisme croissant. Tant de la part des noirs que des blancs, a conduit de nombreuses personnes à se battre pour l'indépendance."
 ZIM_60s_1961_constitution_desc:0 "Une nouvelle constitution révisée qui réduit l'influence britannique sur notre politique."
 ZIM_60s_bictoria_falls_conference:0 "Conférence des Chutes Victoria"
 ZIM_60s_bictoria_falls_conference_desc:0 "La conférence est notre dernier espoir de maintenir l'unité du syndicat. Et même si cela nous fait mal, nous devrions également y discuter de la fin de l'union."
 ZIM_60s_improve_white_condition:0 "Améliorer la condition des blancs"
 ZIM_60s_improve_white_condition_desc:0 "Même si les Blancs sont en bonne position ici, ils peuvent toujours être meilleurs."
 ZIM_60s_an_ace:0 "As dans le trou"
 ZIM_60s_an_ace_desc:0 "Cela aurait pu être une élection ordinaire, mais cette fois, de grandes choses sont sur le point de se produire."
 ZIM_60s_rhodesian_front:0 "Front rhodésien"
 ZIM_60s_rhodesian_front_desc:0 "Un parti pour les nationalistes rhodésiens. Pour ceux qui veulent que la Rhodésie soit grande."
 ZIM_60s_african_nationalism:0 "Nationalisme africain"
 ZIM_60s_african_nationalism_desc:0 "Le temps du changement est venu. Le nationalisme africain est en hausse et, en tant que tel, la transition vers un régime majoritaire se rapproche de nous."
 ZIM_60s_chairman_smith:0 "Smith en charge"
 ZIM_60s_native_tactis:0 "Tactiques autochtones"
 ZIM_60s_native_tactis_desc:0 "Pour obtenir les meilleurs résultats, nous ne pouvons pas compter sur les tactiques élaborées par d'autres pays. Au lieu de cela, nous avons besoin des nôtres, fabriqués à la main pour répondre à nos besoins."
 ZIM_60s_the_unexpected:0 "Déclaration unilatérale d'indépendance"
 ZIM_60s_the_unexpected_desc:0 "Nous sommes sous la domination britannique depuis trop longtemps. Nous sommes désormais prêts à nous en libérer et à devenir une nation indépendante."
 ZIM_60s_rights_for_blacks:0 "Droits des Noirs"
 ZIM_60s_rights_for_blacks_desc:0 "Les Noirs sont opprimés ici depuis assez longtemps. Ce ne sera plus le cas. Nous commençons par leur donner des droits égaux et bien plus encore."
 ZIM_60s_fair_elections:0 "Des élections équitables"
 ZIM_60s_fair_elections_desc:0 "Des élections (presque) équitables auront lieu pour déterminer quel parti gagnera, ZAPU ou ZANU."
 ZIM_60s_zapu:0 "ZAPU gagne"
 ZIM_60s_zanu:0 "Victoire pour la ZANU"
 ZIM_60s_zanu_desc:0 "L'Union nationale africaine du Zimbabwe a remporté les récentes élections."
 ZIM_60s_zapu_desc:0 "L'Union du peuple africain du Zimbabwe a remporté les récentes élections."
 ZIM_60s_aviaton:0 "Nouvelles tactiques aériennes" 
 ZIM_60s_aviaton_desc:0 "Avec peu d'avions, nous devons créer des moyens de les utiliser efficacement"
 ZIM_60s_preperations_for_independence:0 "Préparatifs pour l'indépendance"
 ZIM_60s_preperations_for_independence_desc:0 "Il est clair que je dois rechercher l'indépendance. Cependant, nous devons faire quelques préparatifs minutieux avant cela."
 ZIM_60s_rise_o_voices:0 "Levez-vous, ô voix de la Rhodésie"
 ZIM_60s_rise_o_voices_desc:0 "Levez-vous, ô voix de Rhodésie\nDieu puissions-nous partager ta générosité.\nDonne-nous la force d'affronter tous les dangers,\nEt là où est le défi, il faut oser."
 ZIM_60s_independence_blacc:0 "Indépendance du Royaume-Uni"
 ZIM_60s_independence_blacc_desc:0 "Alors que nous remplissons désormais le NIBMAR, nous pouvons devenir indépendants."
 ZIM_60s_goodbye_union:0 "Au revoir, Union"
 ZIM_60s_goodbye_union_desc:0 "Il est clair que le syndicat ne poursuivra pas son existence longtemps."
 ZIM_60s_establish_relations_with_china:0 "Établir des relations avec la RPC"
 ZIM_60s_soviet_mission:0 "Mission soviétique"
 ZIM_60s_soviet_mission_desc:0 "Puisque le ZAPU a gagné, nous devons établir des relations avec les Soviétiques."
 ZIM_60s_soviet_advisors:0 "Conseillers soviétiques"
 ZIM_60s_cultural_chagnes:0 "Changements culturels"
 ZIM_60s_cultural_chagnes_desc:0 "Avec notre nouvelle indépendance, nous devons changer la culture pour favoriser les Noirs."
 ZIM_60s_join_warsaw_pact:0 "Rejoignez le Pacte de Varsovie"
 ZIM_60s_chinese_advisors:0 "Conseillers chinois"
 ZIM_60s_join_nam:0 "Rejoignez le mouvement des non-alignés"
 ZIM_60s_Uk_accepts:0 "Le Royaume-Uni ne s'y oppose pas"
 ZIM_60s_Uk_accepts_desc:0 "Même si cela n'est peut-être pas agréable pour eux, le Royaume-Uni a accepté notre indépendance."
 ZIM_60s_uk_objects:0 "Objets britanniques"
 ZIM_60s_uk_objects_desc:0 "Comme prévu, le Royaume-Uni n'est pas d'accord avec cette indépendance. Nous devrions toujours être à l'abri d'eux."
 ZIM_60s_decleration_of_republic:0 "Référendum constitutionnel"
 ZIM_60s_commonwealth:0 "Commonwealth de Rhodésie"
 ZIM_60s_commonwealth_desc:0 "Avec le Royaume-Uni à nos côtés, nous devrions devenir un Commonwealth sous sa majesté."
 ZIM_60s_de_jure:0 "Smith est de jure"
 ZIM_60s_de_jure_desc:0 "Lors d'une récente audience de la Haute Cour, il a été décidé que Smith dirigeait désormais officiellement le pays. Cela devrait inspirer une certaine confiance à nos citoyens."
 ZIM_60s_visit_of_queen:0 "Invitez la reine"
 ZIM_60s_visit_of_queen_desc:0 "Nous devrions inviter la Reine à nous rendre visite."
 ZIM_60s_assasinate_smith:0 "Assassiner Smith"
 ZIM_60s_assasinate_smith_desc:0 "Smith est une menace pour nous. Avec ses idées croissantes de rupture des liens avec le Royaume-Uni, il faut s'en débarrasser."
 ZIM_60s_new_pm_vote:0 "Un nouveau Premier ministre ?"
 ZIM_60s_new_pm_vote_desc:0 "Certains se demandent si Smith devrait continuer à diriger le pays."
 ZIM_60s_walls_coup:0 "Coup d'État militaire"
 ZIM_60s_walls_coup_desc:0 "Il est temps de remettre de l'ordre ici."
 ZIM_60s_relations_with_commonwealth:0 "Relations avec le Commonwealth"
 ZIM_60s_trials_for_plotters:0 "Essais pour traceurs"
 ZIM_60s_trials_for_plotters_desc:0 "Tous ceux qui ont participé à cet assassinat doivent être punis."
 ZIM_60s_retur_to_democracy:0 "Retour à la démocratie"
 ZIM_60s_retur_to_democracy_desc:0 "L'ordre étant rétabli, il est temps de revenir à la démocratie."
 ZIM_60s_time_for_change:0 "Il est temps de changer"
 ZIM_60s_time_for_change_desc:0 "La démocratie ? Droits de l'homme ? Peut-être pas. Avec l'armée aux commandes, nous pourrions transformer la Rhodésie en un État réservé aux Blancs..."
 ZIM_60s_persecute_blacks:0 "Persécuter les Noirs"
 ZIM_60s_persecute_blacks_desc:0 "Il est temps de commencer à nettoyer cette terre."
 ZIM_60s_stabilize:0 "Stabiliser la nation"
 ZIM_60s_stabilize_desc:0 "Avec la mort de Smith, beaucoup sont sous le choc. Nous devons les calmer-"
 ZIM_60s_relations_with_ddr:0 "Relations avec le DDR"
 ZIM_60s_Black_land_reform:0 "Donnez des terres aux noirs"
 ZIM_60s_five_year_plan:0 "Plan quinquennal"
 ZIM_60s_weapons_from_ddr:0 "Armes de la DDR"
 ZIM_60s_purge_zanu:0 "Purger ZANU"
 ZIM_60s_purge_zanu_desc:0 "Il faut se débarrasser de notre rival, le ZANU."
 ZIM_60s_mass_mobilization:0 "Mobilisation de masse"
 ZIM_60s_maoist_agarian:0 "Agriculture de Mao"
 ZIM_60s_yugo_weapons:0 "Armes de Yougoslavie"
 ZIM_60s_self_sufficent:0 "Économie autosuffisante"
 ZIM_60s_self_sufficent_desc:0 "Bientôt, nous serons frappés par des sanctions économiques. Nous devons agir maintenant et viser une économie autosuffisante."
 ZIM_60s_goodbye_britannia:0 "Au revoir Bretagne"
 ZIM_60s_goodbye_britannia_desc:0 "Est-ce au revoir maintenant, ma Greaten Britannia\nAdieu Britannia, adieu !\nDois-je te quitter maintenant, ma Greaten Britannia\nEst-ce que ce sera mon dernier au revoir !"
 ZIM_60s_make_deals:0 "Faire des accords pour obtenir de l'aide"
 ZIM_60s_rhodesian_security_forces:0 "Forces de sécurité rhodésiennes"
 ZIM_60s_rhodesian_air_force:0 "Force aérienne rhodésienne"
 ZIM_60s_rhodesian_army:0 "Armée rhodésienne"
 ZIM_60s_focus_on_helis:0 "Focus sur les hélicoptères"
 ZIM_60s_heavy_aircraft:0 "Avions lourds"
 ZIM_60s_heli_transport:0 "Hélicoptères de transport"
 ZIM_60s_assault_from_above:0 "Frappez les ennemis d'en haut"
 ZIM_60s_rhodesian_paratroopers:0 "Parachutistes rhodésiens"
 ZIM_60s_enemy_base_bombartment:0 "Bombarder les bases ennemies"
 ZIM_60s_safeguard_the_nation:0 "Sauvegarder la nation"
 ZIM_60s_safeguard_the_nation_desc:0 "Notre nation est confrontée à de grandes menaces du communisme. Nous devons agir contre eux maintenant."
 ZIM_60s_operation_excess:0 "Excédent d'opération"
 ZIM_60s_operation_excess_desc:0 "L'opération Excess est une réponse à une incursion de terroristes du ZIPRA dans la province du Mashonaland Ouest"
 ZIM_60s_operation_birch:0 "Opération Bouleau"
 ZIM_60s_operation_birch_desc:0 "L'opération Birch est une réponse à un groupe de 22 à 25 insurgés du ZIPRA traversant le fleuve Zambèze, qui marquait la frontière entre la Rhodésie et la Zambie."
 ZIM_60s_operation_cauldron:0 "Opération Chaudron"
