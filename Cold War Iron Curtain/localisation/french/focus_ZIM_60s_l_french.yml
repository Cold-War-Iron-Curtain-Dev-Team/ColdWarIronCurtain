 ZIM_60s_Federal_Union:0 "Union fédérale"
 ZIM_60s_Federal_Union_desc:0 "Le syndicat a clairement besoin d'une réforme. Nous pouvons commencer par en faire une union fédérale avec trois républiques égales."
 ZIM_60s_Economic_Develop_in_Northern_Rhodesia:0 "Développement de la Rhodésie du Nord"
 ZIM_60s_Economic_Develop_in_Northern_Rhodesia_desc:0 "L'économie de la Rhodésie du Nord ne se porte pas très bien. Nous devons consacrer des fonds à son amélioration."
 ZIM_60s_Welensky:0 "Welenski"
 ZIM_60s_Welensky_desc:0 "Welensky a remporté les élections grâce à sa promesse de ne pas déclarer d'UDI."
