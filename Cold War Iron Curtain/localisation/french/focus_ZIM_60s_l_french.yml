 ZIM_60s_Encourage_White_Immigration:0 "Encourager l'immigration blanche"
 ZIM_60s_Encourage_White_Immigration_desc:0 "Nous avons besoin de travailleurs blancs plus qualifiés ici. Nous pouvons les obtenir en mettant en place un programme visant à leur offrir des terres et de l'argent s'ils s'installent ici."
 ZIM_60s_Constitutional_Independence:0 "Indépendance constitutionnelle"
 ZIM_60s_Constitutional_Independence_desc:0 "Alors que de plus en plus d'autochtones occupent des postes gouvernementaux, nous remplissons les conditions pour qu'il n'y ait pas d'indépendance avant le gouvernement de la majorité. En tant que tel, nous pouvons nous considérer comme une nation indépendante."
 ZIM_60s_Commonwealth_Economic_Aid:0 "Aide économique du Commonwealth"
