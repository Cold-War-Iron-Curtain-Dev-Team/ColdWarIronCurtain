l_french:
 GCC_peninsula_shield_decisions:0 "Décisions concernant le bouclier de la péninsule"
 GCC_peninsula_shield_decisions_desc:0 "Coopération de défense entre les six États du Golfe. Contingents engagés dans la force conjointe : [?global.GCC_force_contributor_count|0]"
 GCC_Fund_Defence_Liaison:0 "Liaison de défense des fonds"
 GCC_Fund_Defence_Liaison_desc:0 "Envoyez des représentants de la défense à la cellule de planification commune à Riyad."
 GCC_Prepare_Common_Exercise:0 "Préparer un exercice commun"
 GCC_Prepare_Common_Exercise_desc:0 "Préparez le personnel et les unités pour un exercice combiné dans le Golfe. Au moins quatre membres doivent le faire."
 GCC_Host_Combined_Exercise:0 "Organiser un exercice combiné"
 GCC_Host_Combined_Exercise_desc:0 "L'Arabie saoudite accueille l'exercice Peninsula Shield une fois qu'au moins quatre membres se sont préparés."
 GCC_Provide_Exercise_Contingent:0 "Fournir un contingent d'exercice"
 GCC_Provide_Exercise_Contingent_desc:0 "Envoyez un contingent à l'exercice organisé par l'Arabie saoudite."
 GCC_Approve_Joint_Force:0 "Approuver la force conjointe"
 GCC_Approve_Joint_Force_desc:0 "Donner l'approbation politique à une force conjointe permanente une fois que l'exercice a réuni au moins trois autres membres."
 GCC_Provide_Host_Facilities:0 "Fournir des installations d'accueil"
 GCC_Provide_Host_Facilities_desc:0 "L'Arabie saoudite construit les installations de base qui abriteront la force conjointe."
 GCC_Provide_Joint_Contingent:0 "Fournir un contingent conjoint"
 GCC_Provide_Joint_Contingent_desc:0 "Engagez un contingent permanent dans la force du Bouclier Péninsulaire. Au moins quatre membres doivent le faire."
 GCC_Conduct_Followup_Exercise:0 "Mener un exercice de suivi"
 GCC_Conduct_Followup_Exercise_desc:0 "L'Arabie saoudite mène un exercice de suivi pour tester la force conjointe établie."
 GCC_End_Operational_Participation:0 "Mettre fin à la participation opérationnelle"
 GCC_End_Operational_Participation_desc:0 "Retirez notre contingent de la force conjointe. Cela rompt la continuité de la force."
 gcc_defence_goal_name:0 "Coopération de défense dans le Golfe"
 gcc_defence_goal_desc:0 "Les six monarchies du Golfe coordonnent leur défense dans le cadre du Peninsula Shield."
 peninsula_shield_faction:0 "Bouclier de la péninsule"
 gcc_convene_defence_representatives:0 "Convoquer les représentants de la Défense"
 gcc_convene_defence_representatives_desc:0 "Les six membres financent leur liaison de défense."
 gcc_common_exercise_plan:0 "Acceptez le plan d'exercice commun"
 gcc_common_exercise_plan_desc:0 "Au moins quatre membres se préparent à un exercice commun."
 gcc_exercise_peninsula_shield:0 "Exercice Peninsula Shield"
 gcc_exercise_peninsula_shield_desc:0 "Après 1983, l'Arabie saoudite organise un exercice combiné et au moins trois autres membres envoient des contingents."
 gcc_establish_joint_force:0 "Établir la force conjointe"
 gcc_establish_joint_force_desc:0 "Après 1983, tous les membres approuvent la création d'une force conjointe, l'Arabie saoudite fournit des installations et au moins quatre membres engagent des contingents."
 gcc_maintain_deployable_shield:0 "Maintenir un bouclier déployable"
 gcc_maintain_deployable_shield_desc:0 "Maintenir la force conjointe intacte pendant deux ans avec un exercice de suivi et au moins quatre contributeurs."
 fgtt_gcc_GCC_exercise_prepared_count_tt:0 "Au moins quatre membres se sont préparés pour l'exercice."
 fgtt_gcc_GCC_exercise_contingent_count_tt:0 "Au moins trois membres, outre l'Arabie saoudite, ont fourni un contingent pour l'exercice."
 fgtt_gcc_GCC_force_contributor_count_tt:0 "Au moins quatre membres contribuent à la force conjointe."
 fgtt_gcc_force_months_tt:0 "La force conjointe est restée ininterrompue pendant deux ans."
 GCC_Peninsula_Shield.1.t:0 "Le bouclier de la péninsule"
 GCC_Peninsula_Shield.1.d:0 "Les six monarchies du Golfe ont convenu d'officialiser leur coopération en matière de défense. L'Arabie saoudite dirigera un cadre de défense commun, et les autres membres y participeront par le biais de liaisons, d'exercices et d'une force permanente."
 GCC_Peninsula_Shield.1.a:0 "Un bouclier pour la péninsule."
 GCC_founded:0 "Le cadre de défense du Golfe a été fondé"
 GCC_1980_campaign:0 "début de la campagne 1980"
 GCC_force_established:0 "La force conjointe a été créée"
 GCC_force_break:0 "La continuité des forces interarmées a été rompue"
 GCC_liaison_done:0 "A financé la liaison de défense"
 GCC_exercise_prepared:0 "A préparé l'exercice commun"
 GCC_exercise_hosted:0 "A accueilli l'exercice combiné"
 GCC_exercise_contingent_provided:0 "A fourni un contingent d'exercice"
 GCC_joint_force_approved:0 "A approuvé la force conjointe"
 GCC_facilities_done:0 "A fourni des installations d'accueil"
 GCC_force_contributor:0 "Contribue à la force conjointe"
 GCC_followup_exercise_done:0 "A mené l'exercice de suivi"
