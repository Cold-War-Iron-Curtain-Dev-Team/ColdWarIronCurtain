l_french:
 SOV_Reperation_Payments:0 "Paiements de réparation soviétiques"
 HUN_Embrace_Forced_Industrialization:0 "Embrasser l'industrialisation forcée"
 HUN_Embrace_Forced_Industrialization_desc:0 "L'industrie est toujours en grande partie détruite par la Seconde Guerre mondiale. Pour accélérer la reconstruction et relancer l'industrie, il a été décidé d'adopter la méthode d'industrialisation forcée utilisée par les Soviétiques avant la Seconde Guerre Mondiale."
 HUN_Imprisonment_of_Laszlo_Rajk:0 "Emprisonner Laszlo Rajk"
 HUN_Imprisonment_of_Laszlo_Rajk_desc:0 "Laszlo Rajk était considéré comme l'un des membres les plus loyaux du Parti Hongrois Des Travailleurs, mais depuis quelques temps il est vu comme une menace par Rákosi et les Soviétiques. Son accusation de collaboration avec les ennemis du socialisme l'a conduit à son procès, après lequel il a été arrêté !"
 HUN_Hungarian_Peoples_Army:0 "L'Armée Populaire Hongroise"
 HUN_Hungarian_Peoples_Army_desc:0 "Les forces armées hongroises ont connu de meilleurs jours. La majorité de nos soldats furent tués ou faits emprisonnés pendant la guerre. Aussi terrible que cela puisse paraître, cela donne une opportunité au Gouvernement de reconstruire une nouvelle Armée Populaire et la réformer rapidement."
 HUN_Collectivize_Agriculture:0 "Collectiviser l'agriculture"
 HUN_Collectivize_Agriculture_desc:0 "Notre secteur agricole manque d'efficacité, de nombreuses fermes et champs sont sous contrôle d'acteurs privés. Nous ne pouvons pas les laisser faire. À l'aide des doctrines du modèle soviétique, l'industrie agricole sera collectivisée et placée sous la propriété de l'État. Par la suite, ces terres seront regroupées pour former d'immenses fermes collectives mises en place par le gouvernement."
 HUN_Force_Peasants_into_Collectives:0 "Forcer Les Paysans à Se Regrouper En Coopératives"
 HUN_Force_Peasants_into_Collectives_desc:0 "Les Travailleurs de notre nation, encore novices en matière de socialisme, refuse de rejoindre des coopératives disposés partout sur le territoire censés aider les travailleurs. Ne nous laissant pas le choix, ils seront forcés de rejoindre leurs communes locales. Il arrivera un jour où ils apprécieront leur ahésion."
 HUN_Fund_Heavy_Industry_Investments_with_Agricultural_Profits:0 "Financer l'industrie lourde avec les profits de l'agriculture"
 HUN_Fund_Heavy_Industry_Investments_with_Agricultural_Profits_desc:0 "Avec les bénéfices gagnés grâce à la collectivisation du secteur agricole, nous pouvons dorénavant utiliser ces fonds pour financer notre Industrie Lourde qui a été presque entièrement ruinée durant la Seconde Guerre Mondiale. Avec notre nouvelle Industrie Lourde, l'armée pourra être équipée avec du nouvel équipement de qualité! "
 HUN_Expand_the_Budapest_Industrial_Hub:0 "Étendre le pôle industriel de Budapest"
 HUN_Expand_the_Budapest_Industrial_Hub_desc:0 "Le Pôle Industriel de Budapest est le centre industriel de notre capitale, voir même de notre nation entière. En tout cas ce fut le cas. La plupart de nos usines sont laissées à l'abandon et sont en train de pourrir sous nos yeux. Compte tenu de la situation actuelle des pays, l'industrie est plus que nécessaire. Le Pôle Industriel sera agrandi et les vieilles usines reviendront à la vie!"
 HUN_Connect_to_Eastern_Bloc_Railways:0 "Se connecter aux chemins de fer du bloc de l'est"
 HUN_Connect_to_Eastern_Bloc_Railways_desc:0 "Si nous voulons établir des liens commerciaux avec le reste du Bloc de l'est, il est important que nos chemins de fer soit connectés avec les leurs, nous facilitant le commerce de biens. Partout sur notre territoire de nouveaux rails seront construits, nous préparant au commerce avec le reste du Bloc Soviétique"
 HUN_Kickstart_Cement_Production:0 "Relancer La Production De Ciment"
 HUN_Kickstart_Cement_Production_desc:0 "Même si quelques maisons ont déjà été reconstruites après les bombardements de la Seconde Guerre Mondiale, un large morceau est toujours détruit. Ceci est du à notre manque de ciment. Pour régler ce problème et étendre notre industrie, il a été décidé par le Gouvernement que deux nouveaux parcs industriels seront construits, avec la tâche de produire du ciment."
 HUN_Ration_Food:0 "Rationner La Nourriture"
 HUN_Ration_Food_desc:0 "Comme la Pologne, nous souffrons nous aussi d'une pénurie de nourriture. Les fermiers tentent désespérément de produire de nouvelles denrées pour les travailleurs affamés mais cela n'est pas suffisant. Jusqu'à nous trouvions une meilleure solution, la rationnement de la nourriture sera mis en place."
 HUN_Expand_the_State_Owned_Housing_Industry:0 "Étendre Le Secteur Du Logement Étatique"
 HUN_Expand_the_State_Owned_Housing_Industry_desc:0 "Les Travailleurs ont besoin de logements. Et nous souhaitons étendre notre emprise sur le secteur du logement. Ayant déjà nationalisé une grande partie de ce secteur au cours des dernières années, avec ce nouvel objectif de donner plus de logements aux travailleurs, nous pouvons continuer à nationaliser le reste de l'industrie du logement non étatique."
 HUN_Electrifiy_the_Households:0 "Électrifier Les Foyers"
 HUN_Electrifiy_the_Households_desc:0 "L'électricité est devenue une pierre angulaire dans les ménages d'aujourd'hui. Les travailleurs ne veulent plus vivrent à la lumière des bougies, ils veulent vivrent sous une ampoule rougeoyante qui illuminerait toute une pièce. Pour répondre à cette demande, des centrales électriques sont nécessaires. Nos centrales actuelles n'ont pas la puissance nécessaire pour répondre à la demande, mais avec quelques nouvelles centrales, la demande devrait être plus que satisfaite, donnant aux travailleurs de la lumière et de l'électricité pour leurs articles ménagers!"
 HUN_Concentrate_Our_Efforts_on_Urban_Accomodation:0 "Concentrer Nos Efforts Sur L'Urbanisation Des Dogements"
 HUN_Concentrate_Our_Efforts_on_Urban_Accomodation_desc:0 "De nombreux travailleurs ont quitté les campagnes pour s'installer dans les zones urbaines en raison de leur développement avancé des infrastructures, de la construction de nouveaux logements et de la création de nouveaux emplois dans l'industrie. Nous sommes très heureux de l'arrivée de cette nouvelle population urbaine et nous nous efforcerons de la loger!"
 HUN_Set_Prices_to_Aid_Working_Families:0 "Bloquer les Prix Pour Aider les Familles Travailleuses"
 HUN_Set_Prices_to_Aid_Working_Families_desc:0 "À cause de l'inflation élevée, de nombreux travailleurs et leurs familles souffrent, ce qui les empêchent d'acheter des biens de première nécessité pour les maintenir en bonne santé. Pour aider ces familles, un contrôle des prix sera mis en place, ce qui signifie que les magasins ne pourront facturer les familles de travailleurs que jusqu'à une certaine limite."
 HUN_Patriotic_Loans_to_Pay_Reperations:0 "Prêts Patriotiques Pour Payer les Réparations"
 HUN_Patriotic_Loans_to_Pay_Reperations_desc:0 "À la fin de la Seconde Guerre mondiale, notre libération du gouvernement fasciste s'est faite à un prix. Étant membre de l'Axe et ayant envahi la Russie avec l'Allemagne nazie, nous sommes contraints de verser de lourdes réparations à l'Union soviétique pour les dommages causés. Actuellement, nous n'avons tout simplement pas l'argent pour les payer, mais grâce à un nouveau programme appelé « Prêts patriotiques », nous devrions être en mesure de rembourser les réparations envers les Soviétiques."
 HUN_Achieve_Early_Industrialization_Goals:0 "Atteindre les objectifs d’industrialisation précoce"
 HUN_Achieve_Early_Industrialization_Goals_desc:0 "Après avoir travaillé dur, nous voyons déjà notre labeur porter ses fruits, car les objectifs que nous avons fixés pour notre industrialisation précoce sont rapidement atteints et la Hongrie est en train de devenir une nation industrialisée comme le reste du bloc de l'Est. Nous ne pouvons cependant pas nous arrêter de travailler dur maintenant. Il nous reste encore un long chemin à parcourir et de problèmes à régler!"
 HUN_A_Hungarian_New_Economic_Policy:0 "Une Nouvelle Politique Économique Hongroise"
 HUN_A_Hungarian_New_Economic_Policy_desc:0 "Peu orthodoxe au regard des normes soviétiques, il a été proposé d'adopter une nouvelle politique économique hongroise. Ou NPE pour faire court. Quoi ? Toute ressemblance avec une autre politique économique serait fortuite..."
 HUN_Reduce_the_Burden_of_Farmers:0 "Réduire le Fardeau des Fermiers"
 HUN_Reduce_the_Burden_of_Farmers_desc:0 "Les fermiers sont confrontés à un énorme fardeau, il est difficile de lutter contre la pénurie alimentaire et d'autres problèmes. Dans le cadre de notre NPE, nous ferons de notre mieux pour aider les agriculteurs et alléger leur fardeau, en espérant leur rendre la vie un peu plus facile."
 HUN_Allow_Cultivators_to_Leave_Cooperatives:0 "Autoriser Les Cultivateurs À Quitter Les Coopératives"
 HUN_Allow_Cultivators_to_Leave_Cooperatives_desc:0 "Même si nous avons forcés de nombreux paysans à s'engager dans des coopératives, les cultivateurs sont à nos yeux un cas à part. Ils se de ceux qui nous aident à récolter le maïs et autres produits. Les machines rendent la vie plus façile aux fermiers! Même si la plupart des moyens de production appartenant aux coopératives ne peuvent pas quitter leur section, nous ferons une exception pour les cultivateurs."
 HUN_Encourage_Limited_Private_Activity:0 "Encourager Les Activité Privées Limitées"
 HUN_Encourage_Limited_Private_Activity_desc:0 "L'activité privée et la propriété privée sont généralement un grand tabou dans le monde socialiste, mais dans notre cas, l'activité privée nous aiderait à combattre l'inflation. Même si Moscou n'est pas en accord avec nous, nous allons tout de même faire passer cette mesure."
 HUN_Lower_Food_Prices:0 "Baisser Les Prix De La Nourriture"
 HUN_Lower_Food_Prices_desc:0 "Avec l'inflation qui revient légèrement sous notre contrôle, les Travailleurs ont la capacité de dépenser d'avantage. Mais elle n'est pas encore assez baisse selon nous. Pour l'instant, afin d'aider l'économie à se rétablir, les prix de la nourriture seront réduits."
 HUN_Increase_the_Standard_of_Living:0 "Améliorer Les Standards De Vie"
 HUN_Increase_the_Standard_of_Living_desc:0 "Avec la baisse des prix de la nourriture, nous pouvons maintenant améliorer un autre aspect de la lutte de nos Travailleurs en ces temps difficiles. En se concentrant sur l'amélioration des standards de vie nous inciteront les travailleurs de notre pays à dépenser davantage dans les magasins locaux pour soutenir les produits fabriqués localement."
 HUN_Purge_Kadar_and_his_Ilk:0 "Purger Kàdàr et ses partisans"
 HUN_Purge_Kadar_and_his_Ilk_desc:0 "Kàdàr était autrefois un leader montant du Parti des Communistes de Hongrie. Il a même servi en tant que ministre de l'Intérieur jusqu'à récemment, lorsqu'il a démissionné pour des raisons de santé. Du moins, c'est ce qu'il prétend. Rákosi a lancé un ordre d'arrestation contre Kàdàr ainsi que ses fidèles proches. Une manœuvre de pouvoir, destinée à aider Rákosi à consolider son pouvoir au sein du parti."
 HUN_Denounce_Religous_Instruction:0 "Dénoncer l'Instruction Religieuse"
 HUN_Denounce_Religous_Instruction_des:0 "La religion a toujours été vue comme une chose néfaste dans le monde socialiste. Elle divise les gens plus qu'elle ne les rassemble, et il a été démontré qu'elle a causé d'horribles guerres dans le passé. Dans une société où nous sommes tous égaux, les travailleurs n'ont pas besoin de religion. La seule personne en qui ils doivent placer leur foi, c'est le socialisme!"
 HUN_Remove_Cults_from_Schools:0 "Retirer les Cultes des Établissements Scolaires"
 HUN_Remove_Cults_from_Schools_desc:0 "Sous le régime fasciste, l'église a été autorisée à ouvrir des cultes religieux dans les écoles, afin d'endoctriner les jeunes dans les croyances fascistes et religieuses. L'église ne pouvait pas savoir que nous serions un jour au pouvoir. Pour protéger les enfants et les jeunes du clergé, ces cultes seront interdits et purgés de nos écoles socialistes!"
 HUN_Dissolve_the_Last_of_the_Clergys_Institution:0 "Démanteler les Dernières Institutions du Clergé"
 HUN_Dissolve_the_Last_of_the_Clergys_Institution_desc:0 "Il est temps de planter le clou final dans le cercueil du Clergé. Leurs dernières églises et institutions seront fermées et dissoutes, pour être utilisées à la place pour quelque chose qui profitera aux travailleurs."
 HUN_Incorporate_the_Church_into_the_Regime:0 "Intégrer l'Église dans le régime"
 HUN_Incorporate_the_Church_into_the_Regime_desc:0 "Bien sûr, nous pourrions enterrer le Clergé et ne plus jamais en parler. Mais nous pourrions aussi remplacer les prêtres du clergé qui ne sont pas loyaux envers le socialisme par des prêtres et des membres qui le sont, créant ainsi un christianisme socialiste! Après tout, Jésus n'était-il pas le premier socialiste?"
 HUN_Promote_the_Golden_Team:0 "Promouvoir les Onze d'Or "
 HUN_Promote_the_Golden_Team_desc:0 "Le Onze Dor est un pseudonyme attribué à notre équipe nationale de football qui est récemment devenue l'une des équipes les plus dominantes du pays et de la scène internationale. En promouvant cette équipe dans notre pays, nous pouvons aussi montrer la supériorité des hommes et des femmes socialistes par rapport à l'Occident."
 HUN_Cultivate_a_Cult_of_Personality:0 "Ériger un culte de la personnalité"
 HUN_Cultivate_a_Cult_of_Personality_desc:0 "Depuis que Rákosi est rentré d'exil à la fin de la Seconde Guerre mondiale avec l'Armée rouge, il semblait clair qu'il deviendrait secrétaire général à la fin de la Seconde Guerre mondiale. Il était également évident que pendant son exil, il était devenu un stalinien convaincu, certains l'appelant même le meilleur élève de Staline. Et tout comme Staline, Rákosi est en train d'établir son propre culte de la personnalité."
 HUN_Create_the_State_Protection_Authority:0 "Créer L'Autorité de Protection de l'État"
 HUN_Create_the_State_Protection_Authority_desc:0 "Comme les Soviétiques l'ont fait avec le NKVD, l'Allemagne de l'Est avec la Stasi et les Tchécoslovaques avec le StB, nous aurons notre Autorité de protection de l'État, dont la mission est de traquer les dissidents et les traîtres au socialisme."
 HUN_Purge_Nazi_Remnants_and_Imperialist_Collaborators:0 "Purger les vestiges nazis et les collaborateurs impérialistes"
 HUN_Purge_Nazi_Remnants_and_Imperialist_Collaborators_desc:0 "Avec la mise en place de notre propre Agence d'État, il est temps de purger les derniers vestiges nazis, leurs sympathisants et les collaborateurs impérialistes. Une fois ces groupes disparus, le socialisme sera solidement ancré dans la société hongroise!"
 HUN_Open_Forced_Labor_Camps:0 "Ouvrir les camps de travaux forcés"
 HUN_Open_Forced_Labor_Camps_desc:0 "Contrairement aux Nazis, nous n'allons pas simplement emmener nos prisonniers dans des camps et les gazer. Au contraire, nous les ferons travailler pour la gloire du Socialisme ! De cette façon, ils seront finalement rachetés pour leurs crimes contre le socialisme et seront autorisés à retourner à leur vie quotidienne."
 HUN_Encourage_Anti_Semetism:0 "Encourrager L'antisémitisme"
 HUN_Encourage_Anti_Semetism_desc:0 "Comment vais je expliquer cela à l'ONU ? Aucune idée."
 HUN_Prepare_the_Wallenberg_Trials:0 "Préparer les procès de Wallenberg"
 HUN_Prepare_the_Wallenberg_Trials_desc:0 "Les procès de Wallenberg seront utilisés pour prouver que le diplomate et architecte suédois, qui a offert un refuge aux juifs hongrois pendant la Seconde Guerre mondiale a été en réalité kidnappé et tué pour un groupe d'anciens membres des régimes fascistes et de juifs de Budapest ! ... Attendez quoi ?"
 HUN_Form_a_Hard_Working_Intelligenista:0 "Former une élite intellectuelle"
 HUN_Form_a_Hard_Working_Intelligenista_desc:0 "Même si une grande partie de nos intellectuelles ont fuis ou se sont fais tuer pendant la Seconde Guerre Mondiale, d'autres reste des atouts loyaux aux socialisme ! Les restants seront unis sous une seule et même intelligentisa nous permettants d'atteindre les plus grandes avancées scientifiques !"
 HUN_Expand_the_AVH_Numbers:0 "Il y a toujours la menace que nos ennemis puissent contacter et trouver de nouveaux membres à recruter pour éventuellement devenir assez puissants et renverser notre gouvernement socialiste. Nous ne pouvons pas tolérer cela ! L'AVH sera chargée de mettre en place une surveillance de masse de toute potentielle menace. Toute personne suspecte sera surveillée de très près."
 HUN_Appoint_Imre_Nagy_Prime_Minister:0 "Nommer Imre Nagy premier ministre"
 HUN_Appoint_Imre_Nagy_Prime_Minister_desc:0 "Imre Nagy vient d'être nommé Premier Ministre de la Hongrie. Vu comme un partenaire fiable de Rákosi et loyal à Moscou, le NKVD sera sûrement satisfait de sa promotion. Toutefois, certaines rumeurs laissent entendre qu'Imre Nagy pourrait ne pas se montrer sous son vrai jour."
 HUN_Amnesty_for_Thought_Criminals:0 "Amnistie de supposés criminels"
 HUN_Amnesty_for_Thought_Criminals_desc:0 "Certains des criminels envoyés dans des camps de travail sont là uniquement car ils n'étaient pas d'accord avec Rákosi et comment il dirigeait le pays. Maintenant qu'Imre Nagy est au pouvoir, ces personnes peuvent être libérées de leurs peines injustifiées."
 HUN_Annul_AVH_Judiciary_Initiatives:0 "Annuler les initiatives judicaires de l'AVH"
 HUN_Annul_AVH_Judiciary_Initiatives_desc:0 "L’AVH a bénéficié de trop de liberté sous Rákosi, réprimant les ouvriers et utilisant la surveillance de masse ainsi que de nombreuses autres méthodes douteuses pour se débarrasser de quiconque était considéré comme un traître au socialisme ou un espion. Une institution judiciaire sera mise en place pour ces raisons précises, afin d’examiner la direction de l’AVH et, si nécessaire, de la remplacer par des personnes plus modérées."
 HUN_Hungarian_Ground_Forces:0 "Armées Terrestres Hongroises"
 HUN_Hungarian_Ground_Forces_desc:0 "Les forces terrestres hongroises constituent la colonne vertébrale de notre armée. Elles sont formées à l'aide d'anciens vétérans socialistes qui ont juré de protéger la révolution socialiste et de partisans qui ont combattu le régime fasciste pendant la Seconde Guerre mondiale."
 HUN_Soviet_Equipment:0 "Équipement soviétique"
 HUN_Soviet_Equipment_desc:0 "Nos forces armées ont besoin d'équipement. C'est évident. Malheureusement nous ne pouvons pas fournir assez d'armes pour approvisionner l'ensemble de notre armée, c'est pourquoi nous allons plutôt récupérer de l'équipement chez l'Union Soviétique!"
 HUN_Political_Commissars:0 "Commissaires politiques"
 HUN_Political_Commissars_desc:0 "Les commissaires politiques utilisés par l'URSS pendant la Seconde Guerre Mondiale étaient très utiles pour renforcer la moralité des troupes et n'ont absolument pas tiré sur ceux qui osaient battre en retraite. Peu importe, nous pensons qu'ils constitueraient un atout majeur à notre armée !"
 HUN_Adopt_the_AK47:0 "Adopter l'AK-47"
 HUN_Adopt_the_AK47_desc:0 "Ce n'est pas juste que seuls les soviétiques puissent utiliser l'AK-47! L'AK-47 est une merveille de technologie, parfaite dans presque tout ses aspects. Elle peut être transformée en tant de variantes différentes, des mitrailleuses aux fusils à longue distance. Il faut absolument mettre la main sur cette arme!"
 HUN_Soviet_Advisors:0 "Conseillers soviétiques"
 HUN_Soviet_Advisors_desc:0 "Pendant que nous y sommes et que nous nous procurons ces AK-47, nous pourrions aussi inviter quelques conseillers soviétiques dans notre armée. Ils pourraient observer comment notre armée se comporte et nous enseigner comment améliorer nos tactiques et notre utilisation des armes !"
 HUN_Hungarian_Air_Defense_Forces:0 "Forces de Défense Aériennes Hongroises"
 HUN_Hungarian_Air_Defense_Forces_desc:0 "Les forces aériennes de Hongrie sont une branche récente de notre armée qui a trois objectifs simples. Premièrement, s'assurer qu'il existe une initiative antiaérienne en place en cas d'attaques aériennes ennemies. Deuxièmement, le développement et la recherche de nouvelles mesures de défense antiaérienne. Et enfin, le développement possible de nos propres missiles à un moment donné !"
 HUN_Budapest_Anti_Air_Initiative:0 "L'initiative antiaérienne de Budapest"
 HUN_Budapest_Anti_Air_Initiative_desc:0 "Pour nous assurer que notre capitale Budapest soit protégé des bombardements aériens qui ont survenus pendant la Seconde Guerre Mondiale, l'initiative antiaérienne de Budapest a été approuvée, dont l'objectif est de construire deux armes antiaériennes à Budapest pour aider l'armée à abattre les bombardiers ennemis qui tentent de nous bombarder en cas d'attaque occidentale."
 HUN_Rebuild_AA_Infrastructure:0 "Reconstruire l'infrastructure antiaérienne"
 HUN_Rebuild_AA_Infrastructure_desc:0 "Une large partie de notre infrastructure antiaérienne fut détruire par les bombardements Alliés pendant la Seconde Guerre Mondiale. Même si nos infrastructures se font vieilles, en les reconstruisant, nous pouvons les remettre en état de fonctionnement et les adapter à l'époque actuelle."
 HUN_Modernize_Anti_Air_Facilities:0 "Moderniser les installations antiaériennes"
 HUN_Modernize_Anti_Air_Facilities_desc:0 "Évidemment que maintenant que nos nouvelles initiatives antiaériennes sont construites et que l'ancienne infrastrucutre a été remise en bon état, il est temps de moderniser les installations antiaériennes. À l'aide des dernières technologies dont nous avons accès, nos installations deviendront quelque chose que l'Ouest pourra craindre !"
 HUN_Missle_Investments:0 "Investir dans les missiles"
 HUN_Missle_Investments_desc:0 "Comme mentionné plutôt, les Dorces de Défense Aérienne ont également pour mission de développer nos propres missiles. Bien que cette tâche ne soit pas facile, les résultats, si nous réussissons, en vaudront largement la peine."
 HUN_Hungarian_Peoples_Airforce:0 "Armée de l'Air Populaire Hongroise"
 HUN_Hungarian_Peoples_Airforce_desc:0 "L'armée de l'air Hongroise, ou plus connue sous le nom aujourd'hui de l'armée de l'air populaire hongroise, est encore en grande partie une branche de notre armée qui possède soit des avions Soviétiques abandonnés ou ce qu'il reste de l'Autriche-Hongrie. Voir même peut être quelques appareils de l'Allemagne Nazie. Quoi qu'il en soit, l'armée de l'air a réellement besoin de réformes."
 HUN_Expand_Airbases:0 "Développer les Bases Aériennes"
 HUN_Expand_Airbases_desc:0 "Pour préparer notre force aérienne au moment où des avions devront voler, nous allons avoir besoin de plus de bases aériennes pour faire décoller ces avions. C'est pour cela que nous allons anticiper et construire des aérodromes militaires en avance. Ainsi nous serons mieux préparés au cas où l'Ouest nous attaque et si les Soviétiques ont besoin de place pour leurs avions également."
 HUN_Surplus_Soviet_Lavochkin_LA_9:0 "Surplus de Lavotchkine La-9 soviétiques"
 HUN_Surplus_Soviet_Lavochkin_LA_9_desc:0 "Il se trouve que les Soviétiques ont laissé derrière eux des Lavotchkine La-9. En bonne condition en plus de cela. Au lieu de les laisser rouiller, ils seront utilisés dans l'armée de l'air hongroise !"
 HUN_Soviet_MiG_15s:0 "MiG 15 Soviétiques"
 HUN_Soviet_MiG_15s_desc:0 "Après avoir trouvé ces Lavotchkine La-9, nous pourrions également nous tenir à un ensemble soviétique en leur achetant des MiG 15. Ils devraient être plus que suffisants et nous pourrons démarrer la production de nos propres chasseurs dans le futur."
 HUN_Acquire_Mig_21s:0 "Acquérir des MiG 21"
 HUN_Acquire_Mig_21s_desc:0 "En plus des MiG-15, nous achèterons également quelques MiG-21 du reste du bloc de l'Est. Nous financerons ainsi l'économie de nos compatriotes socialistes et nous aurons plus d'avions pour notre armée de l'air. Tout le monde y gagne !"
 HUN_Close_Down_the_Camps:0 "Fermer les camps de travail"
 HUN_Close_Down_the_Camps_desc:0 "Imre Nagy a commencé à mettre en place des réformes qui vont à l'encontre de certaines lois et institutions mises en place par Rákosi, comme les camps de travail. Il les considère comme trop cruel et préfère plutôt utiliser des méthodes différentes de punition et de réhabilitation"
 HUN_Engage_in_Talks_with_the_Clergy:0 "Discuter avec le clergé"
 HUN_Engage_in_Talks_with_the_Clergy_desc:0 "La prochaine réforme qu'Imre veut faire passer passe par des discussions avec le clergé, celui que Rákosi a durement réprimé. Imre tente de parvenir à une sorte d'accord avec le clergé, selon lequel il pourrait continuer à fonctionner à condition qu'il atténue les discours anti-socialistes."
 HUN_Seek_Approval_from_Moscow:0 "Chercher l'approbation de Moscou"
 HUN_Seek_Approval_from_Moscow_desc:0 "À l'aide des réformes récentes, Nagy cherche l'approbation de Moscou pour les changements qu'il a effectués afin de renforcer leur légitimité et prouver au reste des radicaux que Moscou est d'accord pour qu'Imre Nagy prenne une voie différente que celle du socialisme traditionnel."
 HUN_Rehabilitate_Kadar:0 "Réhabiliter Kàdàr"
 HUN_Rehabilitate_Kadar_desc:0 "Kàdàr fut emprisonné par Rákosi sur des accusations falsifiées et fausses. L'objectif de Rákosi était de se débarasser de Kàdàr et donc de renforcer son pouvoir au gouvernement. Maintenant que Rákosi est parti, Kàdàr peut être à nouveau libéré et réhabilité au sein du Parti."
 HUN_Organize_a_Popular_Patriotic_Front:0 "Organiser un Front Populaire Patriotique "
 HUN_Organize_a_Popular_Patriotic_Front_desc:0 "Imre Nagy a décidé d'organiser ce qu'il appelle un Front Patriotique Populaire. Les objectifs du Front restent obscurs jusqu'à présent, mais on pense qu'il fait partie d'un plan pour se débarasser de l'influence de Moscou."
 HUN_Nagys_Falling_Out_From_Moscow:0 "La chute de Nagy à Moscou"
 HUN_Nagys_Falling_Out_From_Moscow_desc:0 "Nagy a tenté de renverser le gouvernement hongrois et se retirer du pacte de Varsovie ! Heureusement les Soviétiques sont intervenus rapidement et ont retiré Nagy du pouvoir, pour le remplacer par Kàdàr. Malheureusement, tant que la situation ne sera pas stabilisée, les Soviétiques continueront d'occuper le pays."
 HUN_Give_Extended_Powers_to_the_AVH:0 "Donner plus de pouvoir à l'AVH"
 HUN_Give_Extended_Powers_to_the_AVH_desc:0 "Comme l'a montré Imre Nagy après avoir tenté un coup d'état à l'encontre de l'Union Soviétique et à la façon il a porté les socialistes révolutionnaires au pouvoir, il est désormais certain que personne n'est fiable au sein du parti. L'AVH recevra immédiatement des pouvoirs étendus afin de se débarrasser des derniers partisans de Nagy et de garantir la sécurité du pouvoir de Kádár."
 HUN_Reinstate_the_Cult_of_Personality:0 "Rétablir le Culte de la Personnalité"
 HUN_Reinstate_the_Cult_of_Personality_desc:0 "Durant son coup d'état, Nagy a également aboli le culte de la personnalité implémanté sous le régime de Rákosi. Cette décision est maintenant en train d'être inversée et le culte est en train d'être restoré. La seule différence et que maintenant la personnalité en question est Kàdàr au lieu de Rákosi."
 HUN_Force_Collectivization:0 "Forcer la Collectivisation"
 HUN_Force_Collectivization_desc:0 "La prochaine étape dans l'annulation des réformes faites par Imre Nagy est de retirer les dernières traces de la NEP et renforcer la collectivisation forcée comme l'Union Soviétique. Avec la collectivisation forcée, nous pourrons nous débarasser des derniers morceaux de la propriété privée et les mettrons tous fermement entre les mains de l'état !"
 HUN_Reduce_Investments_in_Consumer_Spendings:0 "Réduire les Investissements dans les Dépenses de Consommation"
 HUN_Reduce_Investments_in_Consumer_Spendings_desc:0 "Nous avons actuellement besoin d'argent pour nos projets futurs, et une grande partie est dépensée dans des investissements visant à stimuler la consommation des ménages. À notre avis, ces investissements sont un gaspillage et frôlent le capitalisme. Si nos travailleurs veulent dépenser leur argent, ils peuvent le faire de leur propre initiative, il est donc inutile que nous les y encouragions à nos frais !"
 HUN_Role_Out_Rakosi:0 "Exclure Rákosi"
 HUN_Role_Out_Rakosi_desc:0 "Certains penseraient évidemment que Rákosi devrait simplement être réinstallé à la tête du pays. Cependant, étant donné qu’Imre Nagy est initialement arrivé au pouvoir grâce à lui, Moscou préférera sans doute Kádár, un visage neuf qui a prouvé sa loyauté en avertissant Moscou se verra offrir la chance de faire ses preuves en tant que Secrétaire général !"
 HUN_The_Next_Stage_of_Liberalization:0 "La Nouvelle Étape de la Libéralisation"
 HUN_The_Next_Stage_of_Liberalization_desc:0 "À la surprise générale, le pari d'Imre Nagy s'est avéré bénéfique ! La Hongrie a pu se retirer du Pacte de Varsovie et les Soviétiques ont fait marche arrière ! Une fois qu'ils sont sortis, Imre peut commencer à poursuivre sa libéralisation de la société et du gouvernement, dans le cadre d'un socialisme révolutionnaire !"
 HUN_Assure_Neutrality_of_Hungary:0 "Assurer la Neutralité Hongroise"
 HUN_Assure_Neutrality_of_Hungary_desc:0 "Pour nous assurer que les Soviétiques ne changent pas d'avis et ne décident pas de nous envahir, parce que nous souhaitons par exemple rejoindre l'OTAN, nous nous annoncerons que la Hongrie est désormais un pays neutre et qu'elle ne rejoindra aucun des deux camps de la guerre froide."
 HUN_End_Church_Suppression:0 "En finir avec la persécution de l'Église"
 HUN_End_Church_Suppression_desc:0 "L'une de nos premières réformes sera la fin de l'oppression de l'Église. Après tout, on ne devrait pas être persécuté juste pour ses croyances. Malheureusement, Rákosi ne pouvait pas voir cela."
 HUN_Emulate_Tito:0 "Copier Tito"
 HUN_Emulate_Tito_desc:0 "Le socialisme révolutionnaire de Tito est le meilleur exemple que le socialisme peut fonctionner sans être oppressif et accepter les religions. Sans parler de la façon dont ils représentent les travailleurs par l'intermédiaire des communes et des syndicats ! Nous allons adopter les méthodes du socialisme de Tito et les intégrer dans notre propre pays !"
 HUN_Mass_Political_Amnesty:0 "Amnistie Politique de Masse"
 HUN_Mass_Political_Amnesty_desc:0 "Il reste encore beaucoup de soi-disant prisonniers qui sont enfermés parce que Rákosi n'était pas en accord avec leurs opinions politiques. Maintenant que nous sommes au pouvoir, ces prisonniers seront amnistiés et libérés, certains seront même réhabilités au sein de notre nouveau parti !"
 HUN_Abolish_the_AVH:0 "Supprimer l'AVH"
 HUN_Abolish_the_AVH_desc:0 "L'AVH, depuis sa création n'a uniquement été utilisée pour opprimer les travailleurs et traquer ceux que le MDP considérait comme des menaces. Une telle organisation n'est plus nécessaire et n'est également plus la bienvenue et sera donc dissoute et abolie !"
 HUN_Legalize_Opposition_Parties:0 "Légaliser l'Opposition"
 HUN_Legalize_Opposition_Parties_desc:0 "Les partis d'opposition sont un morceau essentiel de la démocratie socialiste. Grâce à la pluralité, les travailleurs ont le choix de voter pour quelqu'un d'autre si notre Parti n'agit plus dans leur intérêt. À partir d'aujourd'hui, les partis d'opposition sont maintenant à nouveau légalisés !"
 HUN_Reject_Collectivization_of_Agriculture:0 "Rejeter la Collectivisation de l'Agriculture"
 HUN_Reject_Collectivization_of_Agriculture_desc:0 "La collectivisation a l'air d'être une bonne idée sur le papier, mais en pratique elle a été extrêmement mal exécutée dans les sociétés socialistes se revendiquant du marxisme-léninisme. Tout comme Tito, nous rejetterons la collectivisation dans son ensemble et autoriserons plutôt la voie vers l'économie socialiste révolutionnaire."
 HUN_Allow_Larger_Private_Plots:0 "Autoriser des parcelles privées plus grandes"
 HUN_Allow_Larger_Private_Plots_desc:0 "Les parcelles privées sont des fermes où les travailleurs produisent eux-mêmes leurs fruits et légumes. Il n'y a aucun mal à ce qu'ils veulent agrandir leurs parcelles privées !"
 HUN_Outreach_to_Yugoslavia:0 "Se rapprocher de la Yougoslavie"
 HUN_Outreach_to_Yugoslavia_desc:0 "Par malheur il y a peu de nations socialistes révolutionnaires qui souhaitent nous contacter. Mais heureusement il en existe une. Et c'est notre voisine la Yougoslavie ! Nous avons déjà pris Tito en exemple donc nous pourrions également aller jusqu'au bout et établir des relations diplomatiques !"
 HUN_Agricultural_Modernization:0 "Modernisation de l'agriculture"
 HUN_Agricultural_Modernization_desc:0 "Maintenant que nous n'en avons terminés avec la collectivisation de l'agriculture, nous allons plutôt investir dans la modernisation de l'équipement agricole car de nombreux agriculteurs utilisent encore des bovins et des chevaux pour labourer leurs terres. Cela n'est plus acceptable au 20ème siècle !"
 HUN_Empower_Worker_Councils:0 "Renforcer les conseils ouvriers"
 HUN_Empower_Worker_Councils_desc:0 "Les conseils ouvriers établis pendant le soulèvement étudiant et qui nous ont aidés à calmer les étudiants et les manifestants coopèrent étroitement avec nous depuis lors. Voyant leur efficacité, Imre Nagy a proposé qu'ils soient habilités à aider le gouvernement à représenter correctement les travailleurs."
 HUN_Increase_Western_Trade:0 "Accroître le commerce avec l'Ouest"
 HUN_Increase_Western_Trade_desc:0 "Maintenant que notre nation ne fait plus partie du bloc de l'est, nos citoyens peuvent enfin mettre la main sur des produits occidentaux acquis grâce au commerce effectué avec l'Ouest. Le commerce avec l'Ouest nous aidera sûrement à améliorer notre PIB et notre l'économie en général."
 HUN_Study_Yugoslavian_Economic_System:0 "Étudier le système économique yougoslave"
 HUN_Study_Yugoslavian_Economic_System_desc:0 "Le système yougoslave, qui mélange le socialisme et le capitalisme est quelque chose d'assez peu commun dans l'économie socialiste. Mais pour la Yougoslavie, cela a l'air de fonctionner et leur économie est en pleine croissance. Alors que nous commençons à nous rapprocher de la Yougoslavie, nous devrions étudier ce dit système pour voir si nous pouvons implémanter certains aspects dans notre propre système économique."
 HUN_Rehabilitate_Liberal_Communists:0 "Réhabiliter les communistes modérés"
 HUN_Tolerate_the_FKgP:0 "Tolérer le FKgP"
 HUN_Tolerate_the_FKgP_desc:0 "Le Parti civique indépendant des petits propriétaires et des travailleurs agraires, connu aussi sous son acronyme FKgP, est un parti politique en Hongrie. Représentant les intérêts des paysans propriétaires terriens ainsi que de certains paysans pauvres et de la classe moyenne urbaine, il défendait la réforme agraire et la démocratisation. Sous le gouvernement Rákosi, il n’était pas du tout toléré et très souvent réprimé. Mais avec notre socialisme révolutionnaire au pouvoir, Imre Nagy a annoncé que le FKgP serait toléré et même qu’une coopération aurait lieu."
 HUN_Seek_Foriegn_Funding:0 "Chercher des financements étrangers"
 HUN_Seek_Foriegn_Funding_desc:0 "Alors que notre objectif est de transformer notre économie et financer divers projets, nous avons besoin de plus de financements car nous en manquons. Pour résoudre ce problème, nous iront chercher des fonds de pays étrangers. L'Occident sera sans doute ravi d'y contibuer."
 HUN_Constitutional_Reform:0 "Réforme constitutionnelle"
 HUN_Constitutional_Reform_desc:0 "La Constitution utilisée par les communistes était fortement biaisée en faveur du marxisme-léninisme et de l’orthodoxie socialiste. Cependant, cette Constitution ne correspond plus à la nature actuelle de notre parti et sera donc réformée pour devenir plus démocratique. Elle intégrera également certaines lois et politiques que les staliniens n’avaient pas jugé utile d’inclure."
 HUN_Embrace_Socialist_Self_Management:0 "Adopter l'autogestion socialiste"
 HUN_Embrace_Socialist_Self_Management_desc:0 "Comme nous l'ont appris Tito et Imre Nagy, la voie de l'autogestion socialiste est bien plus efficace que la collectivisation et le planisme. Ce sera ce modèle que nous mettrons en place, en conservant l'esprit socialiste tout en y ajoutant une touche capitaliste."
 HUN_End_the_One_Party_State:0 "Abolir le système de parti unique"
 HUN_End_the_One_Party_State_desc:0 "L’une des revendications des manifestants dès le début du soulèvement, qui a déclenché tout le processus de libéralisation de la Hongrie, était la fin du parti unique que Rákosi avait maintenu pendant si longtemps. Imre Nagy a soutenu cette proposition avec enthousiasme, mettant officiellement fin au système de parti unique en Hongrie !"
 HUN_Allow_Limited_Capitalist_Businesses:0 "Autoriser le business capitaliste limité"
 HUN_Allow_Limited_Capitalist_Businesses_desc:0 "Nos réformes approchant de la décollectivisation complète, l'une des dernières étapes de cet effort consiste à permettre à un nombre limité d'entreprises capitalistes d'ouvrir leurs magasins dans notre pays. La population est déjà impatiente de voir quelles entreprises occidentales seront les premières à ouvrir leurs portes en Hongrie."
 HUN_Complete_the_Decollectivization:0 "Compléter la décollectivisation"
 HUN_Complete_the_Decollectivization_desc:0 "Après une longue bataille, il est temps de mettre un dernier clou dans le cercueil de la collectivisation. La Hongrie n'a plus besoin de suivre la politique économique défectueuse utilisée et imposée par les Stalinistes, à la place elle peut choisir sa propre voie économique !"
 HUN_Kadars_Rule:0 "Le règne de Kàdàr"
 HUN_Kadars_Rule_desc:0 "Avec Rákosi écarté et le soutien de l’Union soviétique, Kádár a été nommé nouveau secrétaire général du Parti communiste hongrois. Kádár et son soi-disant communisme au goulasch. Il prévoit d’imposer des politiques ayant pour but de créer un niveau de vie élevé pour le peuple hongrois, accompagnées de réformes économiques. Ces réformes ont permis de favoriser un sentiment de bien-être et une relative liberté culturelle en Hongrie, grâce au communisme au goulasch."
 HUN_Form_a_Committee_to_Reform_the_Economy:0 "Former un comité pour réformer l'économie"
 HUN_Form_a_Committee_to_Reform_the_Economy_desc:0 "L’un des principaux objectifs du communisme au goulasch est de créer un niveau de vie de haute qualité pour le peuple hongrois et de montrer à ce traître Imre Nagy que notre marxisme-léninisme va très bien tel qu’il est. Et qu’il n’a pas besoin d’être renversé par quelques manifestants stupides."
 HUN_Agree_to_Recollective_Agriculture:0 "Approuver la recollectivisation de l'agriculture"
 HUN_Agree_to_Recollective_Agriculture_desc:0 "Le nouveau comité pour la réforme de notre économie, a proposé que nous choisissions le modèle de l'agriculture collectivisée, ce qui impliquerait que les collectifs aient bien plus de poids dans les décisions concernant le secteur agricole de l’économie."
 HUN_Gain_Hardliner_Support:0 "Obtenir l'aide des extrémistes"
 HUN_Gain_Hardliner_Support_desc:0 "Depuis le soulèvement, le Parti est encore divisé par le choc de la trahison de Nagy et est suspicieux des plans de Kàdàr pour l'avenir de la Hongrie. Pour rétablir l'unité au sein du Parti, nous allons essayer d'obtenir le soutin des extrêmistes qui constituent une majorité du Parti des communistes de Hongrie. Avec leur soutien, Kàdàr sera capable de se concentrer sur ses réformes sans se soucier à ce que le Parti se retourne contre lui."
 HUN_Abolish_Compulsory_Quotas:0 "Abolition des quotas obligatoires"
 HUN_Abolish_Compulsory_Quotas_desc:0 "L'une des premières propositions du Comité pour la réforme de notre économie est d'abolir les quotas obligatoires. Kàdàr est plus que favorable à cette proposition, car les quotas se sont souvent révélés inefficaces et n'ont fait qu'engendrer une énorme corruption."
 HUN_Strengthen_the_Hungarian_Socialist_Workers_Party:0 "Renforcer le Parti Socialiste Ouvrier Hongrois"
 HUN_Strengthen_the_Hungarian_Socialist_Workers_Party_desc:0 "Après avoir gagné le support des extrêmistes, nous permettant de restaurer l'unité du Parti, Kàdàr doit toujours renforcer sa légitimité dans le reste du Parti Socialiste Ouvrier Hongrois. Une fois ces derniers ralliés, le gouvernement est prêt à se concentrer sur son seul et unique objectif. Punir Nagy pour sa trahison !"
 HUN_Incoporate_Former_AVH_Agents_into_the_Interior_Ministry:0 "Intégrer d'anciens agents de l'AVH dans le ministère de l'Intérieur"
 HUN_Incoporate_Former_AVH_Agents_into_the_Interior_Ministry_desc:0 "Les agents de l'AVH ont été de véritables héros qui ont empêché les émeutiers de se défaire du communisme en Hongrie. Ils ont bravement repoussé les traîtres de s'emparer des stations de radio dans un premier temps, et ont tenu bon jusqu'à l'arrivée des renforts de l'Union soviétique qui ont forcé le traître Nagy à s'enfuir à l'ambassade de Yougoslavie."
 HUN_Incentives_for_Collective_Agriculture:0 "Incitations à l'agriculture collective"
 HUN_Incentives_for_Collective_Agriculture_desc:0 "Selon le Comité, la prochaine étape des réformes consistera à mettre en place des mesures d'incitation en faveur de l'agriculture collective, car cette forme d'agriculture n'a pas encore été adoptée par le reste des régions rurales du pays. Mais ces incitations qui soutiendront les agriculteurs et montreront que l'agriculture collective en vaut la peine, devront rapidement faire changer d'avis les fermiers récalcitrants."
 HUN_Reassure_Moscow_of_our_Attentions:0 "Rassurer Moscou de nos intentions"
 HUN_Reassure_Moscow_of_our_Attentions_desc:0 "Kàdàr est tout à fait conscient que malgré avoir restauré un régime socialiste, les Soviétiques sont toujours paranoïaques quant à la possibilité que la Hongrie tente de quitter à nouveau le Pacte de Varsovie dès que les Soviétiques auront annulé l'occupation. Mais les Soviétiques n'ont pas à s'inquiéter, car Kàdàr les rassurera sur nos attentions !"
 HUN_Execute_Nagy:0 "Exécuter Nagy"
 HUN_Execute_Nagy_desc:0 "Avec le retour de la stabilité au sein du Parti des communistes de Hongrie, il est l'heure de couper la tête du serpent qu'est Imre Nagy. Depuis le soulèvement et l'invasion des Soviétiques, il est resté à l'intérieur de l'ambassade yougoslave pensant être à l'abri. Il est loin de se douter à quel point il a tort."
 HUN_Purge_Liberal_Party_Members:0 "Purger les membres du Parti Libéral"
 HUN_Purge_Liberal_Party_Members_desc:0 "Si il y a bien une chose que nous avons appris durant le soulèvement qui projeta la hongrie dans l'instabalité politique, c'est que nous ne pouvons pas faire confiance aux réformistes. Même pas ceux du Parti Libéral qui peuvent vous trahir au moment où vous vous en rendez compte. Les purger de notre Parti est la seule option logique."
 HUN_Track_Down_FKgP_Supporters:0 "Traquer les supporters du FKgP"
 HUN_Track_Down_FKgP_Supporters_desc:0 "Le FKgP est une bande de centristes qui n'aiment pas le communisme, ayant plutôt pris le parti d'Imre Nagy pendant l'Insurrection. Depuis son échec et sa mort, ils se cachent dans la clandestinité. L'AVH sera donc chargée de retrouver les derniers membres restants."
 HUN_Allow_Substantial_Private_Flocks:0 "Autoriser des troupeaux privés importants"
 HUN_Allow_Substantial_Private_Flocks_desc:0 "Même si nous n'aimons pas le principe de propriété privée, il a été prouvé avec la NEP hongroise, que l'autorisation d'un petit nombre de troupeaux privés était bénéfique pour l'économie. Dans cette optique, nous autoriserons les personnes à posséder des troupeaux privés importants, à condition qu'ils soient d'abord approuvés par nous."
 HUN_Stimulate_Intra_Bloc_Tourism:0 "Stimuler le tourisme intra-bloc soviétique"
 HUN_Stimulate_Intra_Bloc_Tourism_desc:0 "Le tourisme est un sujet très important pendant les périodes d'été, toutes les familles et touristes du bloc de l'Est arrivent chez nous pour visiter nos lacs et en profiter pour se rafraîchir sous le soleil chaud. Et pourtant, nous pourrions l'améliorer. En lançant une campagne pour stimuler le tourisme, nous pourrions attirer plus de visiteurs !"
 HUN_Encourage_Cooperation_Between_Public_and_Private_Farms:0 "Encourager la coopération entre les fermes nationales et privées"
 HUN_Encourage_Cooperation_Between_Public_and_Private_Farms_desc:0 "Les exploitations agricoles privées et publiques restent en grande partie dans leurs zones respectives, sans vraiment interagir, voire pas du tout. Bien sûr, nous pourrions simplement saisir les fermes privées et les transformer en propriété de l’État, mais nous ne serions alors pas mieux que Rákosi, et cela pourrait provoquer un nouveau soulèvement. À la place, nous allons encourager la coopération entre ces deux types d’agriculteurs, afin d’augmenter la production et l’efficacité !"
 HUN_Declare_a_Successful_Agricultural_Collectivization:0 "Déclarer la collectivisation de l'agriculture comme réussie"
 HUN_Declare_a_Successful_Agricultural_Collectivization_desc:0 "Après de nombreuses réformes menées par nous-mêmes et par le Comité, Kàdàr a achevé ses réformes de collectivisation de l'agriculture, transformant nos fermes nationales en miracles agricoles prospères et réussis !"
 HUN_requires_revolution_tt:0 "Disponible après la révolution hongroise de 1956"