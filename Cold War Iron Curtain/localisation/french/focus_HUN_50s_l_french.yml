l_french:
 SOV_Reperation_Payments: "Paiements de réparation soviétiques"
 HUN_Embrace_Forced_Industrialization: "Adoptez l'industrialisation forcée"
 HUN_Embrace_Forced_Industrialization_desc: "L'industrie est encore en grande partie ruinée par la Seconde Guerre mondiale. Pour parvenir à une reconstruction plus rapide et à un redémarrage de l'industrie, il a été décidé d'adopter la méthode d'industrialisation forcée mise en oeuvre par les Soviétiques avant la Seconde Guerre mondiale."
 HUN_Imprisonment_of_Laszlo_Rajk: "Emprisonnement de Laszlo Rajk"
 HUN_Imprisonment_of_Laszlo_Rajk_desc: "Laszlo Rajk était considéré comme l'un des membres les plus fidèles du Parti communiste hongrois, mais depuis un certain temps, il est considéré comme une menace pour Rakosi, ainsi que pour les Soviétiques. L'accusant de collaboration avec les ennemis du socialisme, il fut ensuite jugé et arrêté !"
 HUN_Hungarian_Peoples_Army: "Armée populaire hongroise"
 HUN_Hungarian_Peoples_Army_desc: "Les forces armées hongroises ont connu des jours meilleurs. La plupart de nos anciens soldats ont été tués pendant la guerre ou faits prisonniers de guerre. Aussi mauvais que cela puisse paraître, cela donne au gouvernement l'occasion de construire la nouvelle Armée populaire à partir de zéro et de lui imposer des réformes rapides."
 HUN_Collectivize_Agriculture: "Collectiviser l'agriculture"
 HUN_Collectivize_Agriculture_desc: "Notre secteur agricole manque d'efficacité, avec de nombreuses fermes et champs travaillant seuls avec différents propriétaires. Nous ne pouvons pas laisser les choses ainsi. En utilisant les pratiques soviétiques, l'industrie agricole sera collectivisée et placée dans la propriété de l'État. Dès lors, ils seront regroupés dans d'immenses fermes collectives mises en place par le gouvernement"
 HUN_Force_Peasants_into_Collectives: "Forcer les paysans à se regrouper en collectifs"
 HUN_Force_Peasants_into_Collectives_desc: "Les travailleurs de notre nation, encore nouveaux dans le socialisme, refusent de rejoindre les collectifs qui existent dans tout le pays et sont censés aider les travailleurs. Ne nous laissant pas le choix, ils seront contraints de rejoindre leurs communes locales. Ils finiront par commencer à profiter de leur adhésion."
 HUN_Fund_Heavy_Industry_Investments_with_Agricultural_Profits: "Financer des investissements dans l'industrie lourde avec des bénéfices agricoles"
 HUN_Fund_Heavy_Industry_Investments_with_Agricultural_Profits_desc: "Après avoir tiré quelques bénéfices de notre collectivisation agricole, nous pouvons désormais utiliser ces fonds pour financer l'industrie lourde qui a été presque entièrement ruinée pendant la Seconde Guerre mondiale. Grâce à cette nouvelle Industrie Lourde, notre nouvelle Armée peut être équipée d'Équipements neufs et de qualité !"
 HUN_Expand_the_Budapest_Industrial_Hub: "Agrandir le pôle industriel de Budapest"
 HUN_Expand_the_Budapest_Industrial_Hub_desc: "Le pôle industriel de Budapest est le centre industriel de notre capitale, peut-être même de toute notre nation. Ou du moins, c'était le cas. La plupart des usines restent en grande partie abandonnées et pourrissent. Dans la situation actuelle du pays, l'industrie est indispensable. Le pôle industriel sera agrandi et ces anciennes usines redonneront vie !"
 HUN_Connect_to_Eastern_Bloc_Railways: "Connectez-vous aux chemins de fer du bloc de l'Est"
 HUN_Connect_to_Eastern_Bloc_Railways_desc: "Si nous voulons établir des échanges commerciaux avec le reste du bloc de l'Est, il est important que nos chemins de fer soient connectés aux leurs, permettant ainsi un échange de marchandises plus facile. De nouveaux chemins de fer seront construits dans tout le pays, en préparation au commerce du bloc de l'Est."
 HUN_Kickstart_Cement_Production: "Lancement de la production de ciment"
 HUN_Kickstart_Cement_Production_desc: "Même si certaines maisons ont déjà été restaurées après avoir été bombardées pendant la Seconde Guerre mondiale, une grande partie reste encore détruite. Cela est dû au manque de ciment du pays. Pour résoudre ce problème et développer l'industrie, le gouvernement a décidé de construire deux nouveaux parcs industriels, chargés de produire du ciment."
 HUN_Ration_Food: "Ration alimentaire"
 HUN_Ration_Food_desc: "Tout comme la Pologne, nous souffrons également d'une pénurie alimentaire. Les agriculteurs tentent de fournir de la nouvelle nourriture aux travailleurs affamés, mais ce n'est tout simplement pas encore suffisant. Jusqu'à ce que la situation s'améliore, le rationnement alimentaire sera introduit."
 HUN_Expand_the_State_Owned_Housing_Industry: "Développer le secteur du logement appartenant à l'État"
 HUN_Expand_the_State_Owned_Housing_Industry_desc: "Les travailleurs ont besoin de logements. Et nous souhaitons étendre notre emprise sur le secteur du logement. Ayant déjà nationalisé une grande partie de ce secteur au cours des dernières années, avec ce nouvel objectif de donner plus de logements aux travailleurs, nous pouvons nationaliser davantage le reste du secteur du logement indépendant restant."
 HUN_Electrifiy_the_Households: "Électrifiez les ménages"
 HUN_Electrifiy_the_Households_desc: "L'électricité est devenue une pierre angulaire des ménages d'aujourd'hui. Les travailleurs ne veulent pas s'asseoir à la lueur des bougies, ils veulent s'asseoir sous une ampoule rougeoyante, qui éclairerait une pièce entière. Mais pour répondre à cette demande, des centrales électriques sont nécessaires. Nos centrales électriques actuelles n'ont pas la puissance nécessaire pour répondre à la demande, mais avec quelques nouvelles centrales électriques, la demande devrait être plus que satisfaite, donnant aux travailleurs de la lumière et de l'électricité pour leurs articles ménagers !"
 HUN_Concentrate_Our_Efforts_on_Urban_Accomodation: "Concentrer nos efforts sur l'hébergement urbain"
 HUN_Concentrate_Our_Efforts_on_Urban_Accomodation_desc: "De nombreux travailleurs ont commencé à quitter la campagne pour s'installer dans les zones urbaines, voyant comment les zones urbaines se développent et où davantage de maisons sont construites, ainsi que de nouveaux emplois dans l'industrie sont créés. Nous accueillons la nouvelle population urbaine et nous nous concentrerons sur notre hébergement !"
 HUN_Set_Prices_to_Aid_Working_Families: "Fixer les prix pour aider les familles qui travaillent"
 HUN_Set_Prices_to_Aid_Working_Families_desc: "En raison de l'inflation élevée, de nombreux travailleurs et leurs familles souffrent, les empêchant d'acheter de la nourriture et des articles nécessaires à leur santé. Pour aider les familles qui travaillent, des limites de prix seront fixées, ce qui signifie que les magasins ne pourront facturer les familles qui travaillent que jusqu'à une certaine limite."
 HUN_Patriotic_Loans_to_Pay_Reperations: "Prêts patriotiques pour payer les réparations"
 HUN_Patriotic_Loans_to_Pay_Reperations_desc: "À la fin de la Seconde Guerre mondiale, notre libération du gouvernement fasciste a eu un prix. Faisant partie de l'Axe et ayant envahi la Russie avec l'Allemagne nazie, nous sommes obligés de payer à l'Union Soviétique d'importantes réparations pour les dommages causés. Actuellement, il nous manque tout simplement l'argent nécessaire pour les rembourser, mais grâce à un nouveau programme appelé Prêts patriotiques, nous devrions être en mesure de rembourser les réparations soviétiques"
 HUN_Achieve_Early_Industrialization_Goals: "Atteindre les premiers objectifs d'industrialisation"
 HUN_Achieve_Early_Industrialization_Goals_desc: "Après avoir travaillé dur, nous voyons déjà les premiers fruits de notre travail, car les objectifs que nous nous sommes fixés pour notre industrialisation précoce sont rapidement atteints et la Hongrie est en train de devenir une nation industrialisée au même titre que le reste du bloc de l'Est. Mais nous ne pouvons pas arrêter de travailler dur maintenant. Il reste encore beaucoup de chemin à parcourir pour résoudre les problèmes auxquels nous devons faire face !"
 HUN_A_Hungarian_New_Economic_Policy: "Une nouvelle politique économique hongroise"
 HUN_A_Hungarian_New_Economic_Policy_desc: "Peu orthodoxe selon les normes soviétiques, il a été proposé d'adopter une nouvelle politique économique hongroise. Ou NEP pour faire court. Quoi? Non le nom est complètement original !...."
 HUN_Reduce_the_Burden_of_Farmers: "Réduire le fardeau des agriculteurs"
 HUN_Reduce_the_Burden_of_Farmers_desc: "Les agriculteurs sont confrontés à un énorme fardeau, car lutter contre la pénurie alimentaire et d'autres problèmes n'est pas une tâche facile. Dans le cadre de notre NEP, nous ferons de notre mieux pour aider les agriculteurs et alléger leurs fardeaux, en espérant leur rendre la vie un peu plus facile."
 HUN_Allow_Cultivators_to_Leave_Cooperatives: "Autoriser les cultivateurs à quitter les coopératives"
 HUN_Allow_Cultivators_to_Leave_Cooperatives_desc: "Même si nous avons forcé de nombreux paysans à rejoindre des collectifs, les cultivateurs sont à nos yeux un cas complètement différent. Ce sont eux qui aident à récolter le maïs et d'autres choses. Des machines qui facilitent la vie des agriculteurs ! Même si la plupart des objets que possèdent les Collectifs ne peuvent pas quitter leur section, nous ferons une exception pour les Cultivateurs."
 HUN_Encourage_Limited_Private_Activity: "Encourager une activité privée limitée"
 HUN_Encourage_Limited_Private_Activity_desc: "L'activité privée et la propriété privée sont généralement un grand tabou dans le monde socialiste, mais dans notre cas, l'activité privée nous aiderait à lutter contre l'inflation. Même si Moscou ne sera pas d'accord avec nous, nous allons quand même faire adopter ce projet"
 HUN_Lower_Food_Prices: "Baisse des prix des denrées alimentaires"
 HUN_Lower_Food_Prices_desc: "L'inflation étant un peu mieux maîtrisée, les travailleurs recommencent à pouvoir dépenser davantage. Mais il n'est toujours pas aussi bas que nous le souhaiterions. Pour l'instant, afin de contribuer à redresser davantage l'économie, les prix des denrées alimentaires seront réduits."
 HUN_Increase_the_Standard_of_Living: "Augmenter le niveau de vie"
 HUN_Increase_the_Standard_of_Living_desc: "En baissant les prix des denrées alimentaires, nous pouvons également améliorer un autre aspect de notre lutte ouvrière en ces temps difficiles. En se concentrant sur l'augmentation du niveau de vie, cela incitera les travailleurs de notre pays à dépenser davantage dans les magasins locaux pour soutenir les produits fabriqués localement."
 HUN_Purge_Kadar_and_his_Ilk: "Purger Kadar et ses semblables"
 HUN_Purge_Kadar_and_his_Ilk_desc: "Kadar était autrefois un leader montant du parti communiste hongrois. Il a même été ministre de l'Intérieur jusqu'à récemment, après avoir démissionné en raison de problèmes de santé. C'est du moins ce qu'il prétend. Rakosi a émis un ordre d'arrestation de Kadar, ainsi que de ses proches partisans. Jeu de pouvoir, pour aider Rakosi à obtenir plus de pouvoir dans le groupe."
 HUN_Denounce_Religous_Instruction: "Dénoncer l'enseignement religieux"
 HUN_Denounce_Religous_Instruction_des: "La religion a toujours été considérée comme une mauvaise chose dans le monde socialiste. Car cela divise les gens plus qu'il ne les rassemble, et il a été démontré qu'il a provoqué d'horribles guerres dans le passé. Dans une société où nous sommes tous égaux, les travailleurs n'ont pas besoin de religion. La seule personne en qui ils doivent faire confiance, c'est le socialisme !"
 HUN_Remove_Cults_from_Schools: "Supprimer les sectes des écoles"
 HUN_Remove_Cults_from_Schools_desc: "Sous le gouvernement fasciste, l'Église était autorisée à ouvrir des cultes religieux dans les écoles, essayant d'endoctriner la jeunesse dans les croyances fascistes et religieuses. Mais l'Église ne pouvait pas savoir que nous serions un jour au pouvoir. Pour protéger les enfants et les jeunes du clergé, ces sectes seront interdites et purgées de nos écoles socialistes !"
 HUN_Dissolve_the_Last_of_the_Clergys_Institution: "Dissoudre la dernière des institutions du clergé"
 HUN_Dissolve_the_Last_of_the_Clergys_Institution_desc: "Il est temps de mettre le dernier clou dans le cercueil du clergé. Leurs dernières églises et institutions seront fermées et dissoutes, et seront utilisées à la place pour quelque chose qui bénéficiera aux travailleurs"
 HUN_Incorporate_the_Church_into_the_Regime: "Incorporer l'Église dans le régime"
 HUN_Incorporate_the_Church_into_the_Regime_desc: "Bien sûr, nous pourrions arrêter le clergé et en finir avec cela. Mais au lieu de cela, nous pourrions également remplacer les prêtres du clergé qui ne sont pas fidèles au socialisme par des prêtres et des membres qui le sont, créant ainsi le christianisme socialiste ! Après tout, Jésus n'était-il pas le premier socialiste ?"
 HUN_Promote_the_Golden_Team: "Promouvoir l'équipe dorée"
 HUN_Promote_the_Golden_Team_desc: "L'équipe d'or est le surnom de notre équipe nationale de football qui est récemment devenue l'une des équipes les plus dominantes du pays et sur la scène internationale. En promouvant cette équipe dans notre nation, nous pouvons également la montrer comme la supériorité des hommes et des femmes socialistes par rapport à l'Occident."
 HUN_Cultivate_a_Cult_of_Personality: "Cultivez un culte de la personnalité"
 HUN_Cultivate_a_Cult_of_Personality_desc: "Depuis que Rakosi est revenu d'exil à la fin de la Seconde Guerre mondiale avec l'Armée rouge, il semblait évident qu'il deviendrait secrétaire général à la fin de la Seconde Guerre mondiale. Il était également très évident que pendant son séjour en exil, il était devenu un stalinien convaincu, certains l'appelant même le meilleur élève de Staline. Et tout comme Staline, Rakosi établit son propre culte de la personnalité."
 HUN_Create_the_State_Protection_Authority: "Créer l'Autorité de protection de l'État"
 HUN_Create_the_State_Protection_Authority_desc: "Tout comme les Soviétiques ont le NKVD, les Allemands de l'Est la Stasi et les Tchécoslovaques le StB, nous avons notre Autorité de protection de l'État, dont la tâche est de traquer les dissidents et les traîtres au socialisme"
 HUN_Purge_Nazi_Remnants_and_Imperialist_Collaborators: "Purger les restes nazis et les collaborateurs impérialistes"
 HUN_Purge_Nazi_Remnants_and_Imperialist_Collaborators_desc: "Avec la création d'une véritable agence d'État, il est temps de purger les restes nazis, leurs sympathisants et collaborateurs impérialistes. Une fois ces groupes disparus, le socialisme sera solidement ancré dans la société hongroise !"
 HUN_Open_Forced_Labor_Camps: "Camps de travaux forcés ouverts"
 HUN_Open_Forced_Labor_Camps_desc: "Contrairement aux nazis, nous n'allons pas simplement amener nos prisonniers dans des camps et faire du gaz. Au lieu de cela, mettons-les au travail pour la gloire du socialisme ! De cette façon, ils seront finalement rachetés pour leurs crimes contre le socialisme et pourront retourner à leur vie quotidienne."
 HUN_Encourage_Anti_Semetism: "Encourager l'antisémitisme"
 HUN_Encourage_Anti_Semetism_desc: "Comment vais-je expliquer cela à l'ONU, je n'en ai aucune idée"
 HUN_Prepare_the_Wallenberg_Trials: "Préparez les essais Wallenberg"
 HUN_Prepare_the_Wallenberg_Trials_desc: "Les procès Wallenberg seront utilisés pour prouver que le diplomate et architecte suédois, qui a fourni un refuge aux Juifs hongrois pendant la Seconde Guerre mondiale, a en fait été kidnappé et tué par un groupe d'anciens membres des régimes fascistes et de Juifs de Budapest !... Attendez quoi ?"
 HUN_Form_a_Hard_Working_Intelligenista: "Formez une Intelligentsia qui travaille dur"
 HUN_Form_a_Hard_Working_Intelligenista_desc: "Même si la plupart de nos intellectuels ont fui ou ont été tués pendant la Seconde Guerre mondiale, il en reste encore quelques-uns qui sont des atouts fidèles au socialisme ! Ces restes seront unis dans une Intelligentsia qui travaille dur, permettant de réaliser de plus grandes percées scientifiques !"
 HUN_Expand_the_AVH_Numbers: "Développez les numéros AVH"
 HUN_Appoint_Imre_Nagy_Prime_Minister: "Nommer Imre Nagy Premier ministre"
 HUN_Appoint_Imre_Nagy_Prime_Minister_desc: "Imre Nagy a été choisi pour être nommé nouveau Premier ministre de la Hongrie. Considéré comme un partenaire fiable de Rakosi et fidèle à Moscou, le NKVD sera sûrement satisfait de sa nomination. Bien qu'il y ait des rumeurs selon lesquelles Imre Nagy pourrait ne pas nous montrer pleinement ses vraies couleurs"
 HUN_Amnesty_for_Thought_Criminals: "Amnistie pour les criminels d'opinion"
 HUN_Amnesty_for_Thought_Criminals_desc: "Certains des soi-disant criminels qui purgent actuellement des peines dans des camps de travail ou des prisons sont simplement là parce qu'ils n'étaient pas d'accord avec la façon dont Rakosi dirigeait la nation. Avec Imre Nagy désormais au pouvoir, ces personnes peuvent être libérées de leur condamnation injuste."
 HUN_Annul_AVH_Judiciary_Initiatives: "Annuler les initiatives judiciaires de l'AVH"
 HUN_Annul_AVH_Judiciary_Initiatives_desc: "L'AVH a eu trop de liberté sous Rakosi, réprimant les travailleurs et utilisant la surveillance de masse ainsi que de nombreuses autres méthodes louches pour se débarrasser de quiconque était considéré comme un traître au socialisme ou un espion. Un pouvoir judiciaire sera créé précisément pour ces raisons afin d'examiner les dirigeants de l'AVH et, si nécessaire, de les remplacer par quelqu'un de plus sobre"
 HUN_Hungarian_Ground_Forces: "Forces terrestres hongroises"
 HUN_Hungarian_Ground_Forces_desc: "Les forces terrestres hongroises constituent l'épine dorsale de notre armée. Ils sont formés d'anciens socialistes vétérans qui ont juré de protéger la révolution socialiste et de partisans qui ont combattu le régime fasciste pendant la Seconde Guerre mondiale."
 HUN_Soviet_Equipment: "Équipement soviétique"
 HUN_Soviet_Equipment_desc: "Nos forces armées ont besoin d'armes. Cela est évident. Malheureusement, nous ne pouvons actuellement pas fournir suffisamment d'armes pour approvisionner l'ensemble de notre force, c'est pourquoi nous allons plutôt obtenir du matériel de l'Union soviétique !"
 HUN_Political_Commissars: "Commissaires politiques"
 HUN_Political_Commissars_desc: "Les commissaires politiques utilisés par l'Union soviétique pendant la Seconde Guerre mondiale ont été d'une grande aide pour renforcer la moralité et n'ont absolument pas tiré sur quiconque osait tenter de battre en retraite. Quoi qu'il en soit, nous pensons qu'ils seraient un grand atout pour notre armée !"
 HUN_Adopt_the_AK47: "Adoptez l'AK-47"
 HUN_Adopt_the_AK47_desc: "Ce n'est pas juste que les Soviétiques puissent utiliser l'AK-47 ! L'AK-47 est une arme miracle moderne, parfaite dans tous les aspects que l'on pourrait souhaiter dans une arme à feu. Il peut être transformé en de nombreuses variantes différentes, des mitrailleuses aux tireurs d'élite ! Il faut simplement mettre la main sur cette arme !"
 HUN_Soviet_Advisors: "Conseillers soviétiques"
 HUN_Soviet_Advisors_desc: "Pendant que nous y sommes et que nous obtenons ces AK-47, nous pourrions aussi bien inviter des conseillers soviétiques dans notre armée. Ils peuvent observer les performances de notre armée et nous apprendre comment nous pourrions améliorer nos tactiques et notre utilisation des armes !"
 HUN_Hungarian_Air_Defense_Forces: "Forces de défense aérienne hongroises"
 HUN_Hungarian_Air_Defense_Forces_desc: "Les Forces de défense aérienne hongroises sont une branche récemment créée de notre armée qui poursuit trois objectifs simples. Premièrement, s'assurer qu'une initiative anti-aérienne est en place en cas d'attaques aériennes ennemies. Deuxièmement, le développement et la recherche de nouvelles mesures de défense anti-aérienne. Et enfin, le développement possible de nos propres Missiles à un moment donné !"
 HUN_Budapest_Anti_Air_Initiative: "Initiative anti-aérienne de Budapest"
 HUN_Budapest_Anti_Air_Initiative_desc: "Pour garantir que notre capitale Budapest soit protégée des attaques aériennes survenues pendant la Seconde Guerre mondiale, l'Initiative anti-aérienne de Budapest a été approuvée. Son objectif est de construire deux armes anti-aériennes à Budapest pour aider l'armée à abattre les bombardiers ennemis qui tentent de nous bombarder en cas d'attaque occidentale."
 HUN_Rebuild_AA_Infrastructure: "Reconstruire l'infrastructure des AA"
 HUN_Rebuild_AA_Infrastructure_desc: "Une grande partie de notre infrastructure AA a été détruite par les bombardements alliés pendant la Seconde Guerre mondiale. Même si cette infrastructure AA est ancienne et obsolète, en la reconstruisant, nous pouvons la remettre en service complet ainsi que la restaurer pour l'adapter à l'époque actuelle."
 HUN_Modernize_Anti_Air_Facilities: "Moderniser les installations anti-aériennes"
 HUN_Modernize_Anti_Air_Facilities_desc: "Bien sûr, maintenant que les nouvelles initiatives AA sont construites et que l'ancienne infrastructure a été restaurée pour retrouver toutes ses fonctionnalités, il est temps de moderniser également les installations AA. En utilisant la dernière technologie à laquelle nous avons accès, nos installations AA deviendront quelque chose que l'Occident peut certainement craindre !"
 HUN_Missle_Investments: "Investissements dans les missiles"
 HUN_Missle_Investments_desc: "Comme mentionné précédemment, les forces de défense aérienne ont également pour tâche de développer nos propres missiles. Même si cette tâche ne sera pas facile, les résultats, si nous réussissions, en vaudraient largement la peine."
 HUN_Hungarian_Peoples_Airforce: "Force aérienne populaire hongroise"
 HUN_Hungarian_Peoples_Airforce_desc: "L'armée de l'air hongroise, ou comme on l'appelle maintenant, l'armée de l'air populaire hongroise, est encore pour l'essentiel une branche de notre armée qui possède encore des trains pour les avions que les Soviétiques ont laissés derrière eux ou qui sont des restes de l'époque de l'Autriche-Hongrie. Peut-être même des Allemands nazis. Quoi qu'il en soit, le fait est que l'Armée de l'Air a désespérément besoin de réformes."
 HUN_Expand_Airbases: "Développer les bases aériennes"
 HUN_Expand_Airbases_desc: "Pour préparer notre Force aérienne aux moments où il y aura des avions pouvant voler, nous aurons besoin de plus de bases aériennes à partir desquelles lancer ces avions. C'est pourquoi nous anticiperons et construirons lesdites bases aériennes à l'avance. De cette façon, nous serons mieux préparés au cas où l'Occident attaquerait et que les Soviétiques auraient également besoin de bases aériennes pour leurs avions"
 HUN_Surplus_Soviet_Lavochkin_LA_9: "Surplus soviétique Lavochkin LA 9"
 HUN_Surplus_Soviet_Lavochkin_LA_9_desc: "Il s'avère que les Soviétiques ont laissé derrière eux des Lavochkin LA 9 polono-soviétiques. Et dans les conditions de travail aussi. Eh bien, au lieu de les laisser rouiller, ils seront utilisés dans notre force aérienne hongroise !"
 HUN_Soviet_MiG_15s: "MiG 15 soviétiques"
 HUN_Soviet_MiG_15s_desc: "Après avoir trouvé ces La 9, autant s'en tenir au thème soviétique et acheter des MiG15 aux Soviétiques. Ils devraient être plus que suffisants jusqu'à ce que nous puissions commencer la production de nos propres chasseurs dans un avenir proche."
 HUN_Acquire_Mig_21s: "Acquérir des MiG 21"
 HUN_Acquire_Mig_21s_desc: "En plus des MiG15, nous achèterons des MiG21 du reste du bloc de l'Est. De cette façon, nous financerons les économies de nos compatriotes socialistes et gagnerons plus d'avions pour notre force aérienne. C'est une situation gagnant-gagnant !"
 HUN_Close_Down_the_Camps: "Fermez les camps"
 HUN_Close_Down_the_Camps_desc: "Imre Nagy a commencé à faire adopter des réformes qui annulent certaines lois et branches mises en place par Rakosi. Comme les camps de travail. Il les considère comme trop cruels et souhaite plutôt utiliser différentes méthodes de punition et de réhabilitation."
 HUN_Engage_in_Talks_with_the_Clergy: "Engager des discussions avec le clergé"
 HUN_Engage_in_Talks_with_the_Clergy_desc: "La prochaine réforme qu'Imre souhaite faire passer passera par des pourparlers avec le clergé, celui contre lequel Rakosi a durement réprimé. Imre essaie de parvenir à une sorte d'accord avec le clergé, dans lequel ils pourraient continuer à agir tant qu'ils modèrent leurs discours antisocialistes."
 HUN_Seek_Approval_from_Moscow: "Demander l'approbation de Moscou"
 HUN_Seek_Approval_from_Moscow_desc: "Avec les récents changements et réformes, Nagy cherche à obtenir l'approbation de Moscou pour les changements qu'il a apportés afin de leur donner plus de légitimité et de prouver au reste des partisans de la ligne dure que Moscou est d'accord avec le fait qu'Imre emprunte une voie différente de celle habituelle du socialisme orthodoxe."
 HUN_Rehabilitate_Kadar: "Réhabiliter Kadar"
 HUN_Rehabilitate_Kadar_desc: "Kader a été emprisonné par Rakosi sur la base de fausses accusations inventées. L'objectif de Rakosi était de se débarrasser de Kadar et ainsi de renforcer son pouvoir au sein du gouvernement. Maintenant que Rakosi est parti, Kadar peut être à nouveau libéré et réhabilité dans le Parti."
 HUN_Organize_a_Popular_Patriotic_Front: "Organiser un Front Patriotique Populaire"
 HUN_Organize_a_Popular_Patriotic_Front_desc: "Imre Nagy a décidé d'organiser ce qu'on appelle le Front patriotique populaire. Les objectifs du Front restent inconnus jusqu'à présent, mais il semblerait que cela fasse partie d'un plan visant à se débarrasser de l'influence de Moscou."
 HUN_Nagys_Falling_Out_From_Moscow: "Nagys tombe de Moscou"
 HUN_Nagys_Falling_Out_From_Moscow_desc: "Nagy a tenté de renverser le gouvernement hongrois et de se retirer du Pacte de Varsovie ! Heureusement, les Soviétiques sont rapidement intervenus et ont retiré Nagy du pouvoir, le remplaçant par Kadar. Malheureusement, jusqu'à ce que la situation se stabilise, les Soviétiques continueront d'occuper le pays."
 HUN_Give_Extended_Powers_to_the_AVH: "Donnez des pouvoirs étendus à l'AVH"
 HUN_Give_Extended_Powers_to_the_AVH_desc: "Comme le montre le coup d'État d'Imre Nagy contre l'Union soviétique et la manière dont le socialiste révolutionnaire a été porté au pouvoir, on ne peut faire confiance à personne dans le parti. L'AVH recevra immédiatement des pouvoirs étendus pour se débarrasser de tous les partisans restants de Nagy et garantir la sécurité du règne de Kadar."
 HUN_Reinstate_the_Cult_of_Personality: "Rétablir le culte de la personnalité"
 HUN_Reinstate_the_Cult_of_Personality_desc: "Pendant le coup d'État, Nagy a également supprimé le culte de la personnalité mis en oeuvre par Rakosi. Cette décision est maintenant annulée et le Culte de la Personnalité est en cours de restauration. La seule différence est que désormais le Culte est destiné à Kadar au lieu de Rakosi."
 HUN_Force_Collectivization: "Forcer la collectivisation"
 HUN_Force_Collectivization_desc: "La prochaine étape pour supprimer les réformes réalisées par Imre consiste à supprimer les dernières traces de la NEP et à imposer une collectivisation forcée, tout comme l'Union soviétique. Avec la collectivisation forcée, nous nous débarrasserons des derniers morceaux de propriété privée et tout remettra fermement entre les mains de l'État !"
 HUN_Reduce_Investments_in_Consumer_Spendings: "Réduire les investissements dans les dépenses de consommation"
 HUN_Reduce_Investments_in_Consumer_Spendings_desc: "L'argent est actuellement nécessaire pour nos projets futurs, et une grande partie de cet argent est dépensée en investissements dans les dépenses de consommation. À notre avis, ces investissements sont un gaspillage et sont à la limite du capitalisme. Si nos travailleurs veulent dépenser leur argent, ils peuvent décider de le faire eux-mêmes sans que nous ayons à les payer !"
 HUN_Role_Out_Rakosi: "Exclure Rakosi"
 HUN_Role_Out_Rakosi_desc: "Certains pourraient penser que Rakosi devrait simplement être réintégré à la tête du pays, mais étant donné qu'Imre Nagy est arrivé au pouvoir grâce à lui, Moscou préférera sûrement que Kadar, un nouveau visage qui a prouvé sa loyauté en informant Moscou, mérite la chance de faire ses preuves en tant que secrétaire général !"
 HUN_The_Next_Stage_of_Liberalization: "La prochaine étape de la libéralisation"
 HUN_The_Next_Stage_of_Liberalization_desc: "Étonnamment, le pari d'Imre Nagy a été récompensé ! La Hongrie a pu se retirer du Pacte de Varsovie et les Soviétiques ont reculé ! Une fois qu'ils sont à l'écart, Imre peut commencer à poursuivre sa libéralisation de la société et du gouvernement, sous le socialisme révolutionnaire !"
 HUN_Assure_Neutrality_of_Hungary: "Assurer la neutralité de la Hongrie"
 HUN_Assure_Neutrality_of_Hungary_desc: "Pour être sûr que les Soviétiques ne changent pas d'avis et décident quand même de nous envahir, parce que nous essayons par exemple d'adhérer à l'OTAN, nous annoncerons que la Hongrie est désormais un pays neutre et ne rejoindra aucun des deux camps de la guerre froide."
 HUN_End_Church_Suppression: "Mettre fin à la répression de l'Église"
 HUN_End_Church_Suppression_desc: "L'une de nos premières réformes sera la fin de la suppression de l'Église. Après tout, il ne faut pas être pourchassé uniquement en raison de ses convictions. Malheureusement, Rakosi ne pouvait pas le voir."
 HUN_Emulate_Tito: "Imiter Tito"
 HUN_Emulate_Tito_desc: "Le socialisme révolutionnaire de Tito est l'exemple parfait de la façon dont le socialisme peut fonctionner sans être oppressif et sans acceptation de la religion. Sans parler de la façon dont ils représentent réellement les travailleurs à travers les communes et les syndicats ! Nous adopterons les voies du socialisme de Tito et l'imiterons dans notre propre pays !"
 HUN_Mass_Political_Amnesty: "Amnistie politique de masse"
 HUN_Mass_Political_Amnesty_desc: "Il y a encore beaucoup de soi-disant prisonniers qui sont enfermés parce que Rakosi n'est pas d'accord avec leurs opinions politiques. Mais avec nous au pouvoir, ces prisonniers bénéficieront d'une amnistie et seront libérés, certains étant même réhabilités dans notre nouveau parti !"
 HUN_Abolish_the_AVH: "Abolir l'AVH"
 HUN_Abolish_the_AVH_desc: "L'AVH, depuis sa création, n'a été utilisée que pour opprimer les travailleurs, pour traquer toute personne que le MDP considérait comme une menace supposée. Une telle organisation est désormais nécessaire et n'est pas la bienvenue sous notre direction et elle sera donc dissoute et abolie !"
 HUN_Legalize_Opposition_Parties: "Légaliser les partis d'opposition"
 HUN_Legalize_Opposition_Parties_desc: "Les partis d'opposition sont au coeur de la démocratie socialiste. Grâce aux partis d'opposition, les travailleurs ont le choix de voter pour quelqu'un d'autre au cas où notre parti n'agirait plus dans leur intérêt. À partir de maintenant, les partis d'opposition sont à nouveau légalisés !"
 HUN_Reject_Collectivization_of_Agriculture: "Rejeter la collectivisation de l'agriculture"
 HUN_Reject_Collectivization_of_Agriculture_desc: "La collectivisation, bien qu'en théorie une bonne idée, a été extrêmement mal exécutée dans le socialisme marxiste-léniniste. Tout comme Tito, nous rejetterons tous ensemble la collectivisation et autoriserons à la place la voie économique socialiste révolutionnaire."
 HUN_Allow_Larger_Private_Plots: "Autoriser les parcelles privées plus grandes"
 HUN_Allow_Larger_Private_Plots_desc: "Les parcelles privées sont des fermes dans lesquelles les ouvriers fabriquent eux-mêmes leurs propres fruits et légumes. Et il n'y a rien de mal à ce qu'ils veuillent agrandir leurs parcelles privées !"
 HUN_Outreach_to_Yugoslavia: "Sensibilisation en Yougoslavie"
 HUN_Outreach_to_Yugoslavia_desc: "Il n'existe malheureusement pas beaucoup de nations socialistes révolutionnaires auxquelles nous pourrions tendre la main. Mais heureusement il en existe un. Et celui-là, c'est notre voisine Yougoslavie ! Nous avons déjà imité Tito, alors autant lui tendre la main et établir des relations diplomatiques !"
 HUN_Agricultural_Modernization: "Modernisation agricole"
 HUN_Agricultural_Modernization_desc: "La collectivisation agricole ayant disparu, nous allons désormais investir dans la modernisation des équipements agricoles, car de nombreux agriculteurs utilisent encore du bétail et des chevaux pour labourer leurs champs. Cela ne peut pas rester au 20e siècle !"
 HUN_Empower_Worker_Councils: "Autonomiser les conseils de travailleurs"
 HUN_Empower_Worker_Councils_desc: "Les conseils ouvriers qui ont été créés pendant le soulèvement étudiant et qui nous ont aidés à calmer les étudiants et les manifestants coopèrent étroitement depuis lors avec nous. Constatant leur efficacité, Imre Nagy a proposé qu'ils soient habilités à aider davantage le gouvernement à représenter correctement les travailleurs."
 HUN_Increase_Western_Trade: "Augmenter le commerce occidental"
 HUN_Increase_Western_Trade_desc: "Notre nation n'étant plus liée au bloc de l'Est, nos citoyens peuvent enfin mettre la main sur des produits fabriqués en Occident grâce au commerce avec les pays occidentaux. Le commerce avec l'Occident nous aidera également à améliorer notre PIB et notre économie en général"
 HUN_Study_Yugoslavian_Economic_System: "Étudier le système économique yougoslave"
 HUN_Study_Yugoslavian_Economic_System_desc: "Le système économique yougoslave qui combine les socialismes avec des aspects du capitalisme est une manière très rare de faire de l'économie socialiste. Mais pour la Yougoslavie, il semble que cela fonctionne et que leur économie se développe grâce à cela. Alors que nous commençons à nous rapprocher diplomatiquement de la Yougoslavie, nous devrions étudier le système pour voir si nous pouvons en intégrer certains aspects dans notre propre système économique"
 HUN_Rehabilitate_Liberal_Communists: "Réhabiliter les communistes libéraux"
 HUN_Tolerate_the_FKgP: "Tolérer le FKgP"
 HUN_Tolerate_the_FKgP_desc: "Le Parti des petits exploitants indépendants, des travailleurs agraires et civiques, connu principalement sous son acronyme FKgP, est un parti politique hongrois. Représentant les intérêts des paysans terriens ainsi que de certains paysans pauvres et de la classe moyenne urbaine, il a plaidé pour la réforme agraire et la démocratisation. Sous le gouvernement Rakosi, ils n'étaient absolument pas tolérés et très souvent réprimés. Mais avec notre socialisme révolutionnaire au pouvoir, Imre Nagy a annoncé que le FKgP serait toléré et même avec lequel il coopérerait."
 HUN_Seek_Foriegn_Funding: "Rechercher un financement étranger"
 HUN_Seek_Foriegn_Funding_desc: "Alors que nous visons à transformer notre économie et à investir dans plusieurs nouveaux projets, nous avons besoin de plus de financement car nous en manquons actuellement nous-mêmes. Pour résoudre ce problème, nous rechercherons un financement auprès d'un pays étranger. L'Occident sera probablement plus que désireux de contribuer."
 HUN_Constitutional_Reform: "Réforme constitutionnelle"
 HUN_Constitutional_Reform_desc: "La Constitution utilisée par les communistes était très truquée pour soutenir le marxisme marxiste-léniniste et s'en tenir au socialisme orthodoxe. Cette Constitution ne correspond plus à la nature de notre parti et elle sera donc réformée pour être plus démocratique, tout en ajoutant certaines lois et politiques que les staliniens n'ont pas pris la peine d'inclure"
 HUN_Embrace_Socialist_Self_Management: "Adoptez l'autogestion socialiste"
 HUN_Embrace_Socialist_Self_Management_desc: "Comme nous l'ont appris Tito et Imre Nagy, la voie de l'autogestion socialiste est bien plus efficace que la collectivisation et l'industrie planifiée par l'État ne pourraient jamais l'être. Ce sera le modèle économique que nous adopterons, en gardant l'esprit socialiste tout en y ajoutant une touche capitaliste."
 HUN_End_the_One_Party_State: "Mettre fin à l'État à parti unique"
 HUN_End_the_One_Party_State_desc: "Une revendication formulée par les manifestants au tout début du soulèvement, lorsqu'ils ont déclenché toute la libéralisation de la Hongrie, était la fin de l'État à parti unique que Rakosi a maintenu pendant si longtemps. Imre Nagy était plus qu'heureux de soutenir cette motion, mettant officiellement fin au parti unique en Hongrie !"
 HUN_Allow_Limited_Capitalist_Businesses: "Autoriser les entreprises capitalistes limitées"
 HUN_Allow_Limited_Capitalist_Businesses_desc: "Alors que nos réformes s'approchent de la décollectivisation complète, l'une des dernières étapes de cet effort est de permettre à un nombre limité d'entreprises capitalistes d'ouvrir leurs magasins dans notre pays. La population est déjà impatiente de voir quelles entreprises occidentales seront les premières à ouvrir leurs portes en Hongrie"
 HUN_Complete_the_Decollectivization: "Achever la décollectivisation"
 HUN_Complete_the_Decollectivization_desc: "Après un long combat, il est temps de mettre le dernier clou dans le cercueil de la collectivisation. La Hongrie n'a plus besoin de suivre la politique économique imparfaite utilisée et appliquée par les staliniens, elle peut plutôt choisir sa propre voie économique !"
 HUN_Kadars_Rule: "La règle de Kadar"
 HUN_Kadars_Rule_desc: "Rakosi étant hors de question et avec le soutien soviétique, Kadar fut nommé nouveau secrétaire général du Parti communiste hongrois. Kadar avec son soi-disant communisme Goulash. Kadar prévoit de mettre en oeuvre des politiques imposées dans le but de créer un niveau de vie de haute qualité pour la population hongroise, associé à des réformes économiques. Ces réformes ont favorisé un sentiment de bien-être et une relative liberté culturelle en Hongrie grâce au communisme Goulash."
 HUN_Form_a_Committee_to_Reform_the_Economy: "Former un comité pour réformer l'économie"
 HUN_Form_a_Committee_to_Reform_the_Economy_desc: "L'un des principaux objectifs du communisme du Goulash est de créer un niveau de vie de haute qualité pour le peuple hongrois et de montrer à ce traître Imre Nagy que notre marxiste-léniniste se porte bien comme il est. Et il n'est pas nécessaire qu'il soit renversé par des manifestants insensés."
 HUN_Agree_to_Recollective_Agriculture: "Accepter l'Agriculture Récollective"
 HUN_Agree_to_Recollective_Agriculture_desc: "Le Comité pour la Réforme de notre économie, nouvellement créé, a proposé que nous acceptions d'utiliser le modèle de l'Agriculture Récollective, ce qui signifierait que les Collectivités auraient beaucoup plus de mot à dire sur ce qui se passe avec le secteur agricole de l'économie."
 HUN_Gain_Hardliner_Support: "Bénéficiez du soutien de la ligne dure"
 HUN_Gain_Hardliner_Support_desc: "Depuis le soulèvement, le parti est encore quelque peu divisé par le choc de la trahison de Nagy et se montre très méfiant à l'égard des projets de Kadar pour l'avenir de la Hongrie. Pour rétablir l'unité du parti, nous tenterons de gagner le soutien des partisans de la ligne dure, car ils constituent une partie importante du Parti communiste hongrois. Avec leur soutien, Kadar pourra se concentrer sur ses réformes sans avoir à craindre une révolte du Parti contre lui."
 HUN_Abolish_Compulsory_Quotas: "Supprimer les quotas obligatoires"
 HUN_Abolish_Compulsory_Quotas_desc: "L'une des premières propositions venues du Comité pour la réforme de notre économie était d'abolir les quotas obligatoires. Kadar est plus que désireux d'accepter cette proposition, car les quotas se sont souvent révélés inefficaces et ont simplement entraîné une énorme quantité de corruption."
 HUN_Strengthen_the_Hungarian_Socialist_Workers_Party: "Renforcer le Parti socialiste ouvrier hongrois"
 HUN_Strengthen_the_Hungarian_Socialist_Workers_Party_desc: "Après avoir obtenu le soutien des partisans de la ligne dure, rétablissant une grande partie de l'unité du parti, Kadar doit encore renforcer sa base de pouvoir dans le reste du Parti socialiste ouvrier hongrois. Avec eux également sous le choc, le gouvernement est prêt à se concentrer sur son seul objectif commun. Punir Nagy pour sa trahison !"
 HUN_Incoporate_Former_AVH_Agents_into_the_Interior_Ministry: "Intégrer les anciens agents de l'AVH au ministère de l'Intérieur"
 HUN_Incoporate_Former_AVH_Agents_into_the_Interior_Ministry_desc: "Les agents AVH ont été les véritables héros qui ont empêché les émeutiers de se débarrasser du communisme en Hongrie. Il a courageusement empêché les violents traîtres de capturer les stations de radio dans un premier temps, et a également maintenu la ligne jusqu'à l'arrivée des renforts de l'Union soviétique qui ont forcé ce traître Nagy à fuir vers l'ambassade de Yougoslavie."
 HUN_Incentives_for_Collective_Agriculture: "Incitations à l'agriculture collective"
 HUN_Incentives_for_Collective_Agriculture_desc: "La prochaine étape des réformes, selon le Comité, consiste à commencer à fournir des incitations à l'agriculture collective, car cette forme d'agriculture n'a pas encore été adoptée par le reste des régions administratives du pays. Mais avec ces incitations qui soutiennent les agriculteurs et montrent que l'agriculture collective en vaut la peine, ces agriculteurs obstinés devraient rapidement changer d'avis."
 HUN_Reassure_Moscow_of_our_Attentions: "Rassurer Moscou de nos attentions"
 HUN_Reassure_Moscow_of_our_Attentions_desc: "Kadar est tout à fait conscient que, même s'il travaille à restaurer le régime socialiste, les Soviétiques restent paranoïaques quant à la possibilité que la Hongrie tente à nouveau de quitter le Pacte de Varsovie dès que les Soviétiques auront annulé l'occupation. Mais les Soviétiques n'ont pas à s'inquiéter, car Kadar les rassurera de notre attention !"
 HUN_Execute_Nagy: "Exécuter Nagy"
 HUN_Execute_Nagy_desc: "La stabilité étant rétablie au sein du Parti communiste hongrois, il est temps de couper la tête du serpent qu'est Imre Nagy. Depuis le soulèvement et l'invasion soviétique, il réside à l'ambassade de Yougoslavie, où il se croit à l'abri de nous. Il ne sait pas à quel point il se trompe."
 HUN_Purge_Liberal_Party_Members: "Purger les membres du Parti libéral"
 HUN_Purge_Liberal_Party_Members_desc: "S'il y a une chose que nous avons apprise du soulèvement qui a plongé la Hongrie dans la tourmente politique, c'est que vous ne pouvez tout simplement pas faire confiance aux libéraux. Pas même aux membres du Parti libéral, car ils peuvent vous poignarder dans le dos à tout moment. Les éliminer du parti est la seule option logique."
 HUN_Track_Down_FKgP_Supporters: "Traquer les partisans du FKgP"
 HUN_Track_Down_FKgP_Supporters_desc: "Le FKgP est un groupe de centristes qui n'apprécient pas le communisme, mais qui se sont plutôt rangés du côté d'Imre Nagy pendant le soulèvement. Depuis son échec et sa mort, ils se cachent sous terre. AVH sera ainsi chargé de retrouver les derniers membres restants."
 HUN_Allow_Substantial_Private_Flocks: "Autoriser des troupeaux privés importants"
 HUN_Allow_Substantial_Private_Flocks_desc: "Même si nous n'aimons pas l'idée de la propriété privée, il a été prouvé, grâce à la NEP hongroise, qu'autoriser un nombre aussi restreint de troupeaux privés est bon pour l'économie. Dans cet esprit, nous autoriserons les gens à posséder des troupeaux privés importants, à condition qu'ils soient préalablement approuvés par nous."
 HUN_Stimulate_Intra_Bloc_Tourism: "Stimuler le tourisme intra-bloc"
 HUN_Stimulate_Intra_Bloc_Tourism_desc: "Le tourisme est en été un sujet très important, car tous les habitants du bloc de l'Est, les familles et les touristes arrivent dans notre pays pour visiter nos lacs et se rafraîchir du chaud soleil d'été. Et pourtant, le Tourisme pourrait être encore meilleur. En lançant une campagne pour stimuler le tourisme intra-bloc grâce aux investissements, nous attirerons encore plus de touristes !"
 HUN_Encourage_Cooperation_Between_Public_and_Private_Farms: "Encourager la coopération entre les fermes publiques et privées"
 HUN_Encourage_Cooperation_Between_Public_and_Private_Farms_desc: "Les fermes privées et publiques restent pour la plupart sur leurs propres territoires séparés sans interagir beaucoup, voire pas du tout, les unes avec les autres. Bien sûr, nous pourrions simplement saisir les fermes privées et les transformer en propriété de l'État, mais nous ne vaudrions alors pas mieux que Rakosi et pourrions même provoquer un autre soulèvement. Au lieu de cela, nous favoriserons la coopération entre ces deux types d'agriculteurs et augmenterons ainsi la production et l'efficacité !"
 HUN_Declare_a_Successful_Agricultural_Collectivization: "Déclarer une collectivisation agricole réussie"
 HUN_Declare_a_Successful_Agricultural_Collectivization_desc: "Enfin, après de nombreuses réformes de notre part et du Comité, Kadar a terminé ses réformes de collectivisation agricole, transformant les fermes de nos nations en miracles agricoles prospères et réussis !"

 HUN_requires_revolution_tt: "Disponible après la révolution hongroise de 1956"

 #EVENTS
 Rakosi.0.t: "La Constitution de la République populaire hongroise de 1949"
 Rakosi.0.d: "Notre Constitution, telle qu'elle est, est terriblement dépassée. Même si la révolution ouvrière ne nous avait pas libérés, notre constitution fait défaut depuis des années par rapport aux normes continentales.\n\nPourtant, nous ne pouvons pas partir de nulle part. Même si nous pourrions nous inspirer du grand héros hongrois de la révolution ouvrière Bela Kun, nous ne vivons plus dans les années 1920 et un État communiste moderne a des exigences et des considérations que même un héros comme lui ne pourrait pas prendre en compte.\n\nPourtant, il existe une source à laquelle nous avons pu puiser : la constitution soviétique. En tant qu'État communiste établi et prospère, ils ont passé des années à adapter et à mettre en oeuvre le socialisme sous une forme fonctionnelle, alors quel meilleur exemple existe-t-il ? Même si cela n'est pas très inventif, copier la plupart des éléments de la constitution soviétique résoudra nos besoins immédiats et nous permettra de mieux nous situer dans une Europe en constante évolution.\n\nAprès tout, nous pouvons toujours amender notre nouvelle constitution lorsque le besoin s'en fait sentir..."
 Rakosi.0.a: "En avant, sous la bannière de Marx-Engels-Lénine-Staline !"

 Rakosi.2.t: "[GetNewspaperHeader] Déclaration de la République populaire hongroise"
 Rakosi.2.d: "En grande pompe à l'Est et sans surprise à l'Ouest, le régime communiste en Hongrie a officiellement commencé. Bien qu'il soit effectivement membre du bloc soviétique, sauf son nom. Malgré l'élection démocratique du Premier ministre Zoltán Tildy, il semble que l'Union soviétique ne tolérerait pas un gouvernement libéral en première ligne avec l'OTAN dans la guerre froide naissante.\n\nIntervenue avec force, la chute de Tildy a conduit à la montée en puissance de Mátyás Rákosi et de son nouveau gouvernement communiste. Même si les spéculations vont bon train, les observateurs américains pensent qu'un coup d'État aussi puissant en Hongrie était une réponse directe au rôle de l'Amérique dans la guerre civile grecque. La réponse la plus probable est cependant que l'Union soviétique cherche à homogénéiser davantage sa sphère d'influence en expansion rapide. Quoi qu'il en soit, la communauté internationale ne peut qu'attendre et voir ce que fera le nouveau gouvernement hongrois..."
 Rakosi.2.a: "Le dernier de la chute des dominos..."
 Rakosi.2.b: "Vive la République populaire"