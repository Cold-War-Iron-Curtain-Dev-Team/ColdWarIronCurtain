DOM_Insurgency.1.d: "Le 3 février 1793, Caamano et une poignée d'entre eux entrèrent en République Dominicaine depuis Cuba. Ils arrivèrent à Playa Caracoles puis infiltrèrent la région montagneuse de la Cordillère Centrale. Sa bande de guérilleros visait à installer l'ancien président Bosch en appelant les roturiers à se soulever contre le gouvernement en place. De nombreux responsables du gouvernement étaient des restes du régime brutal de Trujillo. Le temps nous dira si le peuple dominicain soutiendra les efforts de Caamano, comme une répétition de la guerre civile, ou s'il restera apathique en soutenant l'armée dominicaine. S'ils sont capturés, il est inévitable que les rebelles soient exécutés sur place. L'avenir de la République Dominicaine est une fois de plus en jeu..."
DMC_Return.1.d: "Aujourd'hui, l'homme dominicain du moment, Juan Bosch, revient d'exil dans la capitale : Saint-Domingue. Son plus grand partisan, Francisco Caamano, a ouvert la voie en battant les forces gouvernementales dans une victoire décisive. Il brisa le blocus loyaliste et s'avança vers la campagne. À la demande générale du peuple dominicain, Juan Bosch atterrit aujourd'hui sur la base aérienne de San Isidro, récemment libérée. Il ne laissera pas les piliers pourris de l'État dominicain l'empêcher de sauvegarder les droits de tous les Dominicains. ¡Dios, Patria, Libertad!"
