l_french:
 SOR_60s_Somali_Armed_Forces:0 "Xoogga Dalka Soomaaliyeed"
 SOR_60s_Somali_Armed_Forces_desc:0 "Avant l'indépendance, notre armée nationale était la Darawishta Poliska (groupe mobile de la police somalienne). Nous pouvons désormais fusionner les Darawishta avec les anciens Scouts britanniques du Somaliland et créer une véritable armée."
 SOR_60s_Somali_Air_Force:0 "Ciidamada Cirka Soomaaliyeed"
 SOR_60s_Somali_Air_Force_desc:0 "Fondée en 1954 sous le nom de Corps aéronautique somalien, la Force aérienne somalienne est notre principal moyen de défendre le ciel."
 SOR_60s_Mogadishu_Air_Defenses:0 "Défenses aériennes de Mogadiscio"
 SOR_60s_Mogadishu_Air_Defenses_desc:0 "Nous devons être capables de protéger notre capitale des avions ennemis."
 SOR_60s_Colonial_British_and_Italian_Aircraft:0 "Acquérir des combattants britanniques et italiens"
 SOR_60s_Colonial_British_and_Italian_Aircraft_desc:0 "Grâce à nos relations étroites avec les Italiens et les Britanniques, nous avons pu parvenir à un accord avec eux pour certains combattants."
 SOR_60s_Soviet_IL_18s:0 "Accord sur les avions soviétiques"
 SOR_60s_Soviet_IL_18s_desc:0 "Les Soviétiques ont accepté de nous vendre quelques Mig-21, ainsi que quelques IL-28."
 SOR_60s_Import_MiG_17s:0 "Importer des MiG 17"
 SOR_60s_Import_MiG_17s_desc:0 "Les Soviétiques ont promis de nous livrer des chasseurs MIG-17 pratiquement gratuitement."
 SOR_60s_Somali_National_Army:0 "Ciidanka Xooga Soomaaliya"
 SOR_60s_Somali_National_Army_desc:0 "Les forces terrestres constituent l'épine dorsale de toute armée."
 SOR_60s_Italian_Weapon_Caches:0 "Localiser les caches d'armes italiennes"
 SOR_60s_Italian_Weapon_Caches_desc:0 "Pendant l'occupation italienne, de nombreux fusils ont été abandonnés. Nous devons les localiser et en armer nos troupes."
 SOR_60s_International_Advisors:0 "Demander des conseillers militaires"
 SOR_60s_International_Advisors_desc:0 "Notre armée étant nouvelle, nous devons demander de l'aide pour la gérer efficacement."
 SOR_60s_Military_Modernization:0 "Modernisation militaire"
 SOR_60s_Military_Modernization_desc:0 ""
 SOR_60s_National_Unity_Government:0 "Gouvernement d'union nationale"
 SOR_60s_National_Unity_Government_desc:0 "Vente d'armes américaines II"
 SOR_60s_Somali_Navy:0 "Ciidamada Badda Soomaaliya"
 SOR_60s_Somali_Navy_desc:0 "Nous devons créer une marine pour défendre nos eaux nationales, en particulier notre zone économique exclusive."
 SOR_60s_Establish_Berbera_Naval_Base:0 "Créer la base navale de Berbera"
 SOR_60s_Establish_Berbera_Naval_Base_desc:0 "Nous avons besoin d'un grand port dans la région du Somaliland."
 SOR_60s_Establish_Kismayo_Naval_Base:0 "Créer la base navale de Kismayo"
 SOR_60s_Establish_Kismayo_Naval_Base_desc:0 "Nous avons besoin de ports près de Mogadiscio."
 SOR_60s_Soviet_Naval_Advisors:0 "Inviter des conseillers navals soviétiques"
 SOR_60s_Soviet_Naval_Advisors_desc:0 "Les Soviétiques sont prêts à nous aider à développer notre marine et à nous donner des conseils tactiques."
 SOR_60s_Merca_Radar_Facility:0 "Installation radar de Merca"
 SOR_60s_Merca_Radar_Facility_desc:0 "Aide au renseignement américain"
 SOR_60s_Integrate_the_Somaliland_Scouts:0 "Intégrer les Scouts du Somaliland"
 SOR_60s_Integrate_the_Somaliland_Scouts_desc:0 "Les Scouts du Somaliland étaient des divisions britanniques chargées de la défense du Somaliland. Le Somaliland faisant désormais partie de la Somalie, nous pouvons les intégrer dans notre nouvelle armée."
 SOR_60s_syl:0 "Ligue de la jeunesse somalienne"
 SOR_60s_Somali_National_Congress_Victory:0 "Victoire du Congrès national somalien"
 SOR_60s_Somali_Youth_Leage_Victory_56:0 "Victoire de la Ligue des Jeunes Somaliens"
 SOR_60s_Elections_of_1969:0 "Élections de 1969"
 SOR_60s_Somali_National_Congress_Victory_69:0 "Victoire du Congrès national somalien"
 SOR_60s_october_21st:0 "21 Octobre"
 SOR_60s_Begin_Integration:0 "Commencer l'intégration"
 SOR_60s_Begin_Integration_desc:0 "Bien qu'unifiés en une seule nation au moment de l'indépendance, le Sud et le Nord sont, d'un point de vue institutionnel, deux pays distincts. L'Italie et le Royaume-Uni ont laissé aux deux pays des systèmes administratifs, juridiques et éducatifs distincts dans lesquels les affaires étaient menées selon des procédures différentes et dans des langues différentes."
 SOR_60s_the_Establishment_of_the_Somali_National_Congress:0 "Création du Congrès national somalien"
 SOR_60s_the_Establishment_of_the_Somali_National_Congress_desc:0 ""