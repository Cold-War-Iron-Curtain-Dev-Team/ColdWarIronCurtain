l_french:

###Syria###

 

 SYR_1967.1.t:0 "Une usine d'armes sabotée"
 SYR_1967.1.d:0 "Des informations sont arrivées d'une de nos usines, signalant qu'un incendie majeur s'est déclaré la nuit dernière. Les pompiers locaux luttent toujours contre l'incendie, mais sont convaincus qu'ils pourront maîtriser l'incendie d'ici la fin de la journée. Les dégâts causés à l'usine semblent importants, car l'incendie semble avoir pris naissance dans la zone de stockage de produits chimiques hautement inflammables.\n\nLes services de renseignement ont ouvert une enquête approfondie pour découvrir comment l'incendie a pu se déclarer malgré les mesures de sécurité les plus strictes. Les premières pistes indiquent qu'un incendie criminel est une forte possibilité."
 SYR_1967.1.a:0 "Qui ferait une chose pareille ?"
 SYR_1967.2.t:0 "Une usine civile sabotée"
 SYR_1967.3.t:0 "Pont soufflé"
 SYR_1967.3.d:0"Au cours de la journée, des attaques d'artillerie avaient bombardé nos routes. Les efforts de sauvetage et de récupération ont été rendus difficiles par la poursuite des bombardements.\n\nLes renseignements militaires ont dépêché une équipe pour enquêter sur le site dès que cela sera possible en toute sécurité, afin de déterminer d'où proviennent les attaques.\n\nDes témoins locaux rapportent avoir vu des obus d'artillerie voler depuis la frontière syrienne. L'implication est claire."
 SYR_1967.4.t:0 "Canal cratère"
 SYR_1967.4.d:0 "À un moment donné de la journée, des attaques d'artillerie avaient bombardé nos canaux d'eau. Les efforts de sauvetage et de récupération ont été rendus difficiles par la poursuite des bombardements.\n\nLes renseignements militaires ont dépêché une équipe pour enquêter sur le site dès que cela sera possible en toute sécurité, afin de déterminer d'où proviennent les attaques.\n\nDes témoins locaux rapportent avoir vu des obus d'artillerie voler depuis la frontière syrienne. L'implication est claire."
 SYR_1967.5.t:0 "Patrouille embusquée"
 SYR_1967.5.d:0 "Une de nos patrouilles en Galilée n'a pas réussi à se présenter. Une équipe de recherche travaillant le long du chemin de la patrouille a trouvé un champ de bataille, avec des signes indiquant que la patrouille a été surprise et anéantie dans un corps à corps brutal.\n\nOn ne sait pas encore si les assaillants ont subi des pertes, mais les seuls cadavres retrouvés appartiennent à des soldats israéliens.\n\nOn dirait presque qu'ils ont été laissés délibérément, peut-être pour envoyer un message."

 SYR_1967.6.t:0 "Provocation réussie"
 SYR_1967.6.d:0 "Nos troupes ont saboté une usine sioniste. Les détails sur les dégâts causés sont rares car les Juifs ont déclaré l'ensemble de la zone zone interdite.\n\nCe seul fait devrait nous dire que nous avons peur."
 SYR_1967.6.a:0 "Nous avons semé la peur dans leur coeur."
 SYR_1967.7.d:0 "Notre artillerie a réussi à creuser une route sur les terres sionistes. L'artillerie signale que le chemin a été complètement détruit. \n\n\Ils ont veillé à être vus par les habitants, en précisant clairement qu'il s'agissait d'un avertissement de partir."
 SYR_1967.8.d:0 "Notre artillerie a réussi à creuser un canal sur les terres sionistes. L'artillerie rapporte que le canal a été complètement détruit. \n\n\Ils ont veillé à être vus par les habitants, en précisant clairement qu'il s'agissait d'un avertissement de partir."
 SYR_1967.9.d:0 "Nous avons réussi à tendre une embuscade et à anéantir une patrouille sioniste. Leurs corps ont été laissés sur place pour s'assurer que les parasites reçoivent le bon message."
