 AvroArrow.1.d:0 "Le projet Arrow s'est avéré politiquement problématique pour le gouvernement canadien. Les tendances récentes en matière de technologie de vecteur nucléaire semblent indiquer un rôle plus important pour les missiles balistiques intercontinentaux et une importance décroissante des bombardiers stratégiques, ce qui amène certains à remettre en question la valeur d'un intercepteur supersonique comme l'Arrow. Face aux pressions croissantes pour réduire les dépenses de défense et aligner ses stratégies de défense aérospatiale sur celles des États-Unis, le gouvernement canadien a mis un terme à la production du CF-105. L'annulation du projet a mis 15 000 Canadiens au chômage et a remis en question l'avenir d'Avro Canada. Certains membres de l'industrie aérospatiale canadienne craignent que l'industrie ne se rétablisse pas, soulignant qu'une importante « fuite des cerveaux » vers les États-Unis est déjà en cours. "   #Avro Arrow Cancelled
 AvroArrow.2.d:0 "La technologie des bombardiers soviétiques progresse rapidement et de nouveaux bombardiers soviétiques à grande vitesse sont désormais capables de transporter des armes nucléaires vers l'Amérique du Nord. Le Canada est la première ligne de défense de l'Amérique du Nord, et si les Soviétiques envoient leurs bombardiers au-dessus de l'Arctique, ce sera l'ARC qui les interceptera. Afin de contrer la flotte de bombardiers soviétiques, Avro Canada propose un nouveau design de chasseur révolutionnaire. Le CF-105 Arrow utilisera un bimoteur et une aile delta sans queue visant à maximiser la vitesse, la charge utile et la capacité de carburant. Même si certains sont sceptiques quant au coût élevé du projet, l'Air Force insiste sur le fait qu'il produira l'un des meilleurs intercepteurs à grande vitesse que le monde ait jamais vu. Avec un financement fédéral supplémentaire autorisé, Avro s'attend à ce que le projet emploie près de 15 000 Canadiens. "   #Fund the Avro Arrow
 Gladstone.1.d:0 "James Gladstone, une figure très respectée au sein de la tribu des Blood de la confédération des Pieds-Noirs, est devenu le premier Indien inscrit à être admis au Sénat du Canada. Éleveur de renom, ancien membre de la Gendarmerie royale du Nord-Ouest et président de l'Association indienne de l'Alberta, Gladstone milite depuis longtemps en faveur de droits et d'un statut accrus pour les Indiens. Parmi les causes qu'il défend figurent une meilleure éducation, un plus grand respect des droits issus de traités et la participation des peuples indiens à leur propre gouvernement. Désormais membre à part entière de la Chambre haute du Canada, Gladstone plaide avec force en faveur de l'extension du droit de vote à tous les Indiens du Canada. Avec la nomination de Gladstone au Sénat, beaucoup s'attendent à ce que l'émancipation des Indiens soit imminente. "
 CCF.1.d:0 "Depuis le début de la guerre froide, la Fédération du Commonwealth coopératif fait l'objet d'un examen minutieux de la part du public canadien en raison de ses tendances socialistes. Le Manifeste de Regina du parti, qui appelait explicitement à la nationalisation des principales industries et à l'éradication du système capitaliste, a été remplacé par une nouvelle déclaration de principes, la Déclaration de Winnipeg. La déclaration de Winnipeg a considérablement modéré la position du parti, prônant une économie mixte et des politiques économiques keynésiennes plutôt que révolutionnaires. Même si ce passage à la social-démocratie constitue un changement majeur pour le CCF, il reste à voir si sa nouvelle orientation trouvera un meilleur écho auprès des Canadiens. Certaines idées du parti ont cependant retenu l'attention, notamment leurs propositions en matière de santé publique. "
 OrgAmer.1.d:0 "Malgré ses relations étroites avec les États-Unis, le Canada se montre sceptique quant à son adhésion à l'Organisation des États américains. L'aventurisme américain en Amérique du Sud, les intérêts britanniques contradictoires dans la région et les avantages tangibles douteux pour le Canada ont traditionnellement fait de la question de l'adhésion canadienne une faible priorité. De récents changements de priorités ont amené le gouvernement canadien à réexaminer cette politique, et l'OEA est maintenant considérée comme un moyen potentiel par lequel le Canada peut défendre ses intérêts en Amérique du Sud. Les négociations avec l'OEA ont porté leurs fruits et le Canada a été admis comme membre à part entière. Le Canada devrait plaider en faveur de la promotion des valeurs démocratiques parmi les États membres. "
 CanEuro.1.d:0 "Les intérêts économiques de la Grande-Bretagne semblent s'éloigner des liens avec ses partenaires du Commonwealth. Le gouvernement britannique s'apprête à présenter une candidature à la Communauté économique européenne, de plus en plus prospère. Bien que cela représente potentiellement une aubaine majeure pour l'économie du Royaume-Uni et ses relations avec ses alliés continentaux, le premier ministre du Canada a exprimé ses inquiétudes quant au manque de garanties commerciales avec le Commonwealth. Le Premier ministre a également exprimé sa déception face au fait que la Grande-Bretagne n'ait pas consulté le Canada ou le reste du Commonwealth sur son intention d'adhérer à la CEE. Même si cette dispute n'aura peut-être pas de conséquences particulièrement graves sur les relations entre le Royaume-Uni et le Canada, le Canada est susceptible de resserrer ses liens commerciaux avec les États-Unis. "
 CanTrade.1.d:0 "La récente tournée du premier ministre dans le Commonwealth a renforcé sa conviction que l'organisation devrait jouer un rôle clé dans la politique étrangère canadienne. Sur la base de l'amitié historique entre la Grande-Bretagne et ses anciennes colonies blanches et de l'acceptation des anciennes colonies non blanches comme partenaires égaux, le Premier ministre envisage de poursuivre activement l'expansion du Commonwealth, tant en termes de taille que de portée. Des relations commerciales plus étroites, des accords de défense et des consultations sur les affaires internationales importantes devraient faire partie de la vision du Canada pour un Commonwealth des nations plus intégré."
 London_Decleration.1.d:0 "Les changements constitutionnels imminents en Inde ont incité les premiers ministres des différents États du Commonwealth à reconsidérer la structure du Commonwealth britannique. Le Premier ministre indien a clairement indiqué que malgré son désir de continuer à s'associer au Commonwealth, il entendait voir l'Inde devenir une république souveraine et mettre fin à ses liens royaux avec Westminster. Les délibérations se sont poursuivies pendant la majeure partie de la semaine, jusqu'à ce que le premier ministre du Canada propose une nouvelle solution, dans laquelle le roi occuperait un poste honorifique de chef du Commonwealth, symbole commun de la libre association des nations membres indépendantes. Le Premier ministre indien a accepté le compromis et une déclaration de Londres a été publiée, transformant le Commonwealth britannique en Commonwealth des Nations."
