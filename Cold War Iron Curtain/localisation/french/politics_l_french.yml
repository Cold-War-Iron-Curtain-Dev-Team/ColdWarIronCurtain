 CWIC_ECON_PENALTIES.1.d: "Pour éviter une crise budgétaire et de paiement, le gouvernement mettra en oeuvre des mesures d'austérité. Les mesures ont été proposées par le Fonds monétaire international comme conditionnelles à un soutien supplémentaire et essentielles à notre bien-être économique. Sans ces mesures, la situation budgétaire du pays pourrait se transformer en catastrophe économique. Même si ces mesures causeront des difficultés à de nombreux citoyens, elles sont essentielles pour la santé économique à long terme du pays."
 CWIC_ECON_PENALTIES.2.d: "Le gouvernement a annoncé qu'il était en défaut de paiement. La nouvelle provoque déjà une panique nationale. À l'échelle internationale, des appels se font entendre pour la mise en oeuvre immédiate des réformes économiques proposées par le Fonds monétaire international. Alors que la crise économique atteint un nouveau déclin, le pays n'a d'autre choix que de procéder à des coupes budgétaires difficiles et de tenter de restaurer la confiance dans l'économie nationale. La crise oblige un certain nombre d'entreprises et d'installations gouvernementales à fermer leurs portes faute de fonds nécessaires pour maintenir leurs activités."
