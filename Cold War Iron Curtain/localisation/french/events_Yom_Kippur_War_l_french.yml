###USA###
 
 USA_1973.1.t:0 "L'Égypte reprend le Sinaï"
 USA_1973.1.d:0 "Le Conseil national de sécurité a été informé que les forces armées égyptiennes ont réussi à reprendre le Sinaï aux forces israéliennes. Cette nouvelle a été un choc pour nos analystes et nos dirigeants militaires qui avaient tous l'impression que les Israéliens seraient facilement capables de résister à une assaut égyptienne. Cependant, les analystes attribuent ce succès égyptien à la surprise de leur attaque et insistent toujours sur le fait qu'une fois que les forces israéliennes se seront regroupées, elles seront capables d'empêcher les Egyptiens de poursuivre leur avancée et pourraient même repousser vers le Sinaï. Cependant, compte tenu de l'erreur qu'ils ont commise plus tôt, nous devrons peut-être simplement suivre de près l'évolution de la situation sur le terrain."
 USA_1973.1.a:0 "Nous suivrons cela de près."

 USA_1973.2.t:0 "L'Égypte avance encore"
 USA_1973.2.d:0 "Publiquement, le gouvernement israélien insiste sur le fait que la situation est bien sous son contrôle, mais nos agences de renseignement et les médias soulignent de plus en plus l'avancée continue des forces égyptiennes plus profondément en Israël proprement dit. Récemment, l'ambassadeur israélien nous a exhorté à nous impliquer davantage et a déclaré qu'il craignait qu'une victoire totale de l'Égypte n'entraîne une crise humanitaire et des déportations massives d'un nombre jamais vu depuis la Seconde Guerre mondiale. Certains membres du Conseil de sécurité nationale sont d'accord et suggèrent que nous donnions un ultimatum aux Égyptiens pour qu'ils mettent fin aux combats et proposent un cessez-le-feu, sous peine de risquer notre intervention. Une défaite totale d'Israël détruirait de manière catastrophique notre politique étrangère dans la région et de nombreux Américains soutiennent Israël. Cependant, d'autres hauts responsables estiment que nous ne devrions pas nous impliquer dans le conflit et risquer d'engager des troupes dans une guerre étrangère."
 USA_1973.2.a:0 "Avertir l'Egypte" 
 USA_1973.2.b:0 "Aucune intervention"

 USA_1973.3.t:0 "L'Égypte a ignoré notre ultimatum"
 USA_1973.3.d:0 "Le gouvernement égyptien a ignoré notre ultimatum selon lequel il devait proposer un cessez-le-feu et mettre fin aux combats avec Israël. Ils ont atteint leurs objectifs et s'efforcent désormais de détruire l'État d'Israël. Cela a grandement irrité de nombreux Américains. Nous disposons de moyens prêts à être déployés et à arrêter les Égyptiens, mais certains membres du cabinet disent maintenant que, malgré l'ultimatum, nous ne devrions toujours pas intervenir. Ils soutiennent que prolonger le conflit et impliquer les forces américaines ne fera que compliquer les choses. Cependant, d'autres dirigeants ministériels et militaires affirment que notre gouvernement a fait une promesse et que nous devons l'honorer en intervenant contre l'agression égyptienne."
 USA_1973.3.a:0 "Ils nous ont forcé la main"
 USA_1973.3.b:0 "Aucune intervention"

 USA_1973.4.t:0 "La Syrie prend le Golan"
 USA_1973.4.d:0 "Les hauteurs du Golan sont convoitées depuis longtemps par les Syriens après en avoir perdu le contrôle au profit des Israéliens. Cependant, pendant la guerre en cours dans la région, les forces syriennes ont chassé les Israéliens du Golan et en ont désormais le contrôle. Cela a complètement pris nos experts du renseignement et de la région par surprise, car la plupart des évaluations pensaient que les Israéliens pourraient facilement repousser une tentative syrienne. À mesure que les forces israéliennes se remettent de ce revers, elles pourraient renverser le cours des combats, mais les Syriens pourraient tout aussi bien poursuivre leur victoire dans le nord d'Israël. Nous devrons surveiller de près l'évolution des combats à partir de maintenant."
 USA_1973.4.a:0 "Nous suivrons cela de près"

 USA_1973.5.t:0 "La Syrie avance encore"
 USA_1973.5.d:0 "Suite à leur succès dans le Golan, le Conseil de sécurité nationale a été informé aujourd'hui que les forces syriennes se sont désormais implantées profondément dans le nord d'Israël. La résistance israélienne semble faiblir et l'ambassadeur israélien a exprimé en privé ses craintes que les Syriens ne détruisent l'État d'Israël. Le Conseil de sécurité nationale a pris note de ce scénario potentiel et a débattu de l'opportunité d'envoyer un ultimatum aux Syriens exigeant qu'ils mettent fin aux combats et proposent un cessez-le-feu ou qu'ils fassent face à une intervention américaine. Beaucoup pensent que la menace à elle seule devrait suffire à mettre fin aux combats. Cependant, d'autres participants à la réunion ont déclaré que même si la perte d'Israël détruirait la politique étrangère américaine dans la région, il serait peut-être préférable de ne pas nous impliquer dans les combats."
 USA_1973.5.a:0 "Avertir la Syrie" 
 USA_1973.5.b:0 "Aucune intervention"

 USA_1973.6.t:0 "La Syrie ignore notre ultimatum"
 USA_1973.6.d:0 "Lors d'une réunion d'urgence du Conseil de sécurité nationale, il a été informé que le gouvernement syrien avait choisi d'ignorer notre ultimatum et que ses forces continuaient d'avancer contre Israël. Les forces sont prêtes à intervenir et de nombreux participants à la réunion exhortent l'Amérique à honorer sa parole et à donner une leçon à la Syrie. À ce stade, la Syrie a atteint ses objectifs et mène désormais une guerre de destruction. D'autres participants à la réunion ont souligné que les Syriens ont dénoncé notre bluff et que notre tactique visant à imposer la paix a échoué. Ils affirment que cela ne signifie pas que les États-Unis doivent intervenir."
 USA_1973.6.a:0 "Ils nous ont forcé la main"
 USA_1973.6.b:0 "Aucune intervention"

###Soviet Union###

 SOV_1973.1.t:0 "Israël détient le Sinaï"
 SOV_1973.1.d:0 "Une réunion de hauts responsables militaires, des services de renseignement et politiques a été informée que la tentative de l'armée égyptienne de s'emparer du Sinaï n'avait pas abouti. Israël conserve le contrôle du Sinaï, au grand dam des Égyptiens. Les Egyptiens utilisent notre équipement et notre expertise, nous continuerons à leur offrir notre soutien mais maintenant nous ne pouvons qu'observer. Les Égyptiens insistent sur le fait que leurs forces combattent les Israéliens jusqu'à l'arrêt pour le moment, mais la situation pourrait changer à mesure que les combats se poursuivent."
 SOV_1973.1.a:0 "Nous suivrons cela de près"

 SOV_1973.2.t:0 "Israël fait irruption en Egypte"
 SOV_1973.2.d:0 "Une réunion de hauts responsables militaires, du renseignement et politiques a été informée que les forces israéliennes pénétraient en Égypte depuis le Sinaï malgré la résistance égyptienne. L'avancée continue des Israéliens ne peut être considérée que comme une tentative d'infliger une punition punitive excessive au peuple égyptien. Une occupation israélienne de Suez pourrait également menacer nos intérêts économiques. Il a été décidé de débattre de la question de savoir si nous devions dire aux Israéliens qu'ils devaient mettre fin aux combats et proposer un cessez-le-feu ou risquer une intervention soviétique. On pensait que la menace de notre implication les obligerait à arrêter la guerre. Cependant, d'autres ont soutenu que nous ne devrions même pas lancer un tel ultimatum et que nous devrions laisser le conflit se terminer de lui-même, car le peuple soviétique n'est pas intéressé à mener une guerre étrangère." 
 SOV_1973.2.a:0 "Avertir Israël" 
 SOV_1973.2.b:0 "Aucune intervention"

 SOV_1973.3.t:0 "Israël ignore l'ultimatum"
 SOV_1973.3.d:0 "Un gouvernement israélien trop confiant a refusé avec arrogance d'accepter notre ultimatum. Pour beaucoup, cette décision a confirmé leur évaluation selon laquelle Israël cherche à infliger une punition punitive aux Égyptiens. Pour le bien du peuple égyptien et de notre économie, nous devons agir maintenant. Les Israéliens pourraient décider de détruire le canal de Suez ou, pire encore, de le bloquer de notre trafic pour nous punir à l'avenir. Nous devons donc intervenir maintenant pour protéger l'Égypte et nos intérêts. Cependant, certains pensent que l'ultimatum visait à imposer la paix et ne constituait pas une menace sérieuse et que, puisque les Israéliens ont bluffé, il serait préférable de laisser la guerre continuer jusqu'à sa conclusion naturelle."
 SOV_1973.3.a:0 "Ils nous ont forcé la main" 
 SOV_1973.3.b:0 "Aucune intervention"

 SOV_1973.4.t:0 "Israël défend le Golan"
 SOV_1973.4.d:0 "L'armée syrienne, utilisant notre équipement et notre doctrine, a lancé un assaut pour libérer les hauteurs du Golan qu'occupaient les Israéliens. Cet effort n'a pas été un succès car les forces israéliennes conservent le contrôle du Golan. L'armée syrienne insiste sur le fait que les combats sont dans l'impasse et qu'ils vont bientôt percer, mais on craint que les forces israéliennes ne pénètrent bientôt en Syrie même. Nos services de renseignement et nos moyens diplomatiques continuent d'observer et nous tiendront informés de tout changement dans la situation."
 SOV_1973.4.a:0 "Nous suivrons cela de près"

 SOV_1973.5.t:0 "Israël avance en Syrie"
 SOV_1973.5.d:0 "L'armée israélienne s'enfonce plus profondément en Syrie, repoussant l'armée syrienne. Même si les Syriens insistent toujours sur le fait qu'ils contrôlent toujours la situation, il est clair que les Israéliens vont de l'avant. L'ambassadeur syrien nous a fait part en privé de ses craintes quant aux intentions israéliennes à l'égard de son pays. Nos propres analystes craignent que les Israéliens ne cherchent à s'étendre en Syrie et à provoquer dans la région une crise humanitaire sans précédent depuis l'émergence d'Israël. Le haut bureau politique débat de la question de savoir si nous devrions ou non envoyer à Israël un ultimatum pour mettre fin aux combats ou risquer notre intervention armée." 
 SOV_1973.5.a:0 "Avertir Israël"
 SOV_1973.5.b:0 "Aucune intervention"

 SOV_1973.6.t:0 "Israël a ignoré l'ultimatum"
 SOV_1973.6.d:0 "Le gouvernement israélien avait décidé de ne pas répondre à notre demande de mettre fin aux combats contre la Syrie ou de faire face à une intervention de notre part. De nombreux dirigeants militaires et politiques de haut rang affirment que le refus israélien témoigne de nos craintes qu'ils ne mettent en oeuvre une transformation désastreuse et négative dans la région. Ils croient également que nos forces résoudront facilement le conflit et donneront une leçon à Israël. D'autres, cependant, soutiennent que le but de l'ultimatum était d'imposer la paix et que cela n'a pas été réalisé. Au lieu de nous impliquer dans une guerre étrangère risquée, nous devrions simplement attendre de voir comment cela se terminera."
 SOV_1973.6.a:0 "Ils nous ont forcé la main" 
 SOV_1973.6.b:0 "Aucune intervention"

###World News###

 Arab_Israeli_war_1973.1.t:0 "[GetNewspaperHeader]Guerre israélo-arabe de 1973"
 Arab_Israeli_war_1973.1.d:0 "Les militaires égyptiens et syriens ont lancé une attaque surprise coordonnée contre les forces israéliennes dans le Sinaï et sur le plateau du Golan, déclenchant ainsi une nouvelle série de guerres israélo-arabes. L'armée israélienne serait dans un état de préparation faible en raison de la fête de Yom Kippour et les premiers rapports en provenance d'Égypte et de Syrie suggèrent que les lignes israéliennes ont été violées. Israël a appelé ses réservistes et a promis de repousser les envahisseurs. Les gouvernements égyptien et syrien ont annoncé que leurs attaques marquaient la fin de décennies d'humiliation."
 Arab_Israeli_war_1973.1.a:0 "C'est reparti"

 Arab_Israeli_war_1973.2.t:0 "[GetNewspaperHeader]Intervention américaine dans la guerre israélo-arabe"
 Arab_Israeli_war_1973.2.d:0 "Les États-Unis ont annoncé aujourd'hui qu'ils interviendraient dans la guerre israélo-arabe pour défendre Israël de la menace de destruction qui pèse sur ses ennemis. Le gouvernement américain a insisté sur le fait que l'attaque continue contre Israël n'est désormais pas provoquée et vise uniquement à déraciner complètement le peuple israélien et à provoquer une catastrophe humanitaire. Les forces américaines sont en alerte depuis le début du conflit et les analystes pensent que les forces américaines pourraient bientôt arriver. Alors que le gouvernement israélien a accueilli favorablement la nouvelle, l'ambiance dans le camp arabe est devenue déprimée, beaucoup affirmant que l'intervention américaine est une conspiration. Jusqu'à présent, l'Union soviétique n'a pas réagi, mais elle devrait réagir prochainement à cette escalade."
 Arab_Israeli_war_1973.2.a:0 "Cette guerre va empirer"

 Arab_Israeli_war_1973.3.t:0 "[GetNewspaperHeader]Intervention soviétique"
 Arab_Israeli_war_1973.3.d:0 "L'Union soviétique a annoncé que ses forces interviendraient dans la guerre israélo-arabe contre Israël. Les Soviétiques déclarent que l'assaut israélien continu n'est ni provoqué ni justifiable et ils craignent que le résultat ne soit un dépeuplement jamais vu depuis l'émergence d'Israël. Les nouvelles du camp arabe ont été réjouissantes tandis qu'en Israël, le sentiment a été décrit comme un sentiment de deuil parmi tant d'autres. Les forces soviétiques sont en alerte depuis le début de la guerre et devraient intervenir rapidement. Le gouvernement israélien considère cette action comme une confirmation de la partialité internationale contre l'existence d'Israël. Jusqu'à présent, les États-Unis n'ont pas réagi, mais ils devraient bientôt réagir à cette escalade."
 Arab_Israeli_war_1973.3.a:0 "Cette guerre va empirer"

 Arab_Israeli_war_1973.4.t:0 "[GetNewspaperHeader]Victoire israélienne sur l'Egypte !"
 Arab_Israeli_war_1973.4.d:0 "Malgré une attaque surprise dévastatrice des Égyptiens dans le Sinaï, l'armée israélienne a réussi à sortir victorieuse. Parfois confrontées à des difficultés insurmontables face à un ennemi bien discipliné et lourdement équipé, les troupes israéliennes ont gardé leur sang-froid. L'ambiance en Israël est moins de jubilation mais de soulagement d'avoir persévéré dans ce conflit dangereux. Des appels sont déjà lancés pour qu'une enquête soit menée afin de découvrir pourquoi l'armée n'était pas préparée à l'assaut égyptien à travers le Sinaï. Pendant ce temps, au Caire, on a le sentiment que la victoire a été trahie par une conspiration étrangère. Beaucoup pensent que le soldat égyptien s'est révélé être l'égal du soldat israélien et, malgré les résultats, Israël sait désormais qu'il ne peut pas tenir sa domination pour acquise. Il n'en demeure pas moins qu'Israël a contrecarré l'Égypte et atteint son objectif."
 Arab_Israeli_war_1973.4.a:0 "Intéressant"

 Arab_Israeli_war_1973.5.t:0 "[GetNewspaperHeader]Victoire israélienne sur la Syrie !" 
 Arab_Israeli_war_1973.5.d:0 "Malgré une attaque surprise dévastatrice des Syriens sur le plateau du Golan, l'armée israélienne a réussi à sortir victorieuse. Parfois confrontées à des difficultés insurmontables face à un ennemi bien discipliné et lourdement équipé, les troupes israéliennes ont gardé leur sang-froid. L'ambiance en Israël est moins de jubilation mais de soulagement d'avoir persévéré dans ce conflit dangereux. Des appels sont déjà lancés pour qu'une enquête soit menée afin de découvrir pourquoi l'armée n'était pas préparée à l'assaut syrien. Pendant ce temps, à Damas, on a le sentiment, alimenté par la propagande, que la victoire a été trahie par une conspiration étrangère. Beaucoup pensent que le soldat syrien s'est révélé être l'égal du soldat israélien et, malgré les résultats, Israël sait désormais qu'il ne peut pas tenir sa domination pour acquise. Il n'en reste pas moins qu'Israël a contrecarré la Syrie et atteint son objectif."
 Arab_Israeli_war_1973.5.a:0 "Intéressant"

 Arab_Israeli_war_1973.6.t:0 "[GetNewspaperHeader]Victoire égyptienne sur Israël !"
 Arab_Israeli_war_1973.6.d:0 "L'assaut surprise égyptien sur le Sinaï s'est avéré être le succès dévastateur du début alors que les forces égyptiennes marchaient vers la victoire sur leur ennemi en Israël. La nouvelle de la victoire a déclenché des foules en liesse dans toute l'Égypte, en particulier au Caire, pour célébrer la nouvelle de la victoire. Après ce que de nombreux Égyptiens considéraient comme des années d'humiliation nationale, ils voient désormais leur fierté nationale restaurée. En Israël, l'ambiance est plutôt découragée face à l'échec de l'armée israélienne à contrer les Egyptiens. Des enquêtes sont déjà en cours pour attribuer la responsabilité à l'échec du renseignement et du leadership au cours des heures critiques d'ouverture de la guerre. Beaucoup en Israël estiment que si le pays avait été préparé, les Égyptiens n'auraient jamais réussi à gagner le conflit. Quoi qu'il en soit, la victoire égyptienne modifie désormais l'équilibre des pouvoirs dans la région."
 Arab_Israeli_war_1973.6.a:0 "Intéressant"

 Arab_Israeli_war_1973.7.t:0 "[GetNewspaperHeader]Victoire syrienne sur Israël !"
 Arab_Israeli_war_1973.7.d:0 "L'attaque surprise syrienne sur le plateau du Golan s'est révélée être un succès dévastateur alors que les forces syriennes marchaient vers la victoire sur leur ennemi en Israël. La nouvelle de la victoire a suscité une foule en liesse dans toute la Syrie, notamment à Damas. Après ce que de nombreux Syriens considéraient comme des années d'humiliation nationale, ils voient désormais leur fierté nationale restaurée. En Israël, l'ambiance est plutôt découragée face à l'échec de l'armée israélienne à contrer les Syriens. Des enquêtes sont déjà en cours pour attribuer la responsabilité à l'échec du renseignement et du leadership au cours des heures critiques d'ouverture de la guerre. Beaucoup en Israël estiment que si le pays avait été préparé, les Syriens n'auraient jamais réussi à gagner le conflit. Quoi qu'il en soit, la victoire syrienne modifie désormais l'équilibre des pouvoirs dans la région."
 Arab_Israeli_war_1973.7.a:0 "Intéressant"

 The_October_War:0 "La guerre d'Octobre"
 The_October_War_desc:0 "La situation au Moyen-Orient s'est récemment retrouvée dans l'impasse. Les Israéliens restent fermes et peu disposés à céder sur leur position favorable. Les superpuissances ne pouvant ou ne voulant pas sortir de l'impasse, les États arabes, en particulier l'Égypte, doivent envisager une opération militaire pour dégeler la situation. Les États arabes sont bien mieux préparés que par le passé à un conflit militaire et le refus israélien de faire des compromis témoigne d'un excès de confiance. Un retard supplémentaire permettrait aux Israéliens de se retrancher davantage. Si les États arabes laissent passer ce moment, ils n'auront peut-être pas d'autre chance."
