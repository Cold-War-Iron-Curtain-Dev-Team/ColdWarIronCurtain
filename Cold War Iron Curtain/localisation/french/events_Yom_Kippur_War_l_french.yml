l_french:

###Egypt###

 EGY_1973.1.t:0 "L'Egypte lance l'opération Badr"
 EGY_1973.1.d:0 "Après des mois de préparation, nos forces armées sont prêtes à lancer l'opération Badr. L'opération Badr permettra à nos forces de percer les formations sionistes et de pénétrer dans le Sinaï. Les erreurs des conflits précédents ne se répéteront pas. Cette fois, la guerre se déroulera selon nos conditions et nous sommes prêts à écraser l'ennemi. Les sionistes sont devenus complaisants et nombre de leurs forces sont en congé pour Yom Kippour. Nous attaquons pendant le Ramadan, un mois des plus propices qui ne fera que renforcer la confiance de nos soldats sur le front."
 EGY_1973.1.a:0 "Alors ça commence..."

 EGY_1973.2.t:0 "Le Sinaï est à nous !" 
 EGY_1973.2.d:0 "Les sionistes ont longtemps proclamé le Sinaï comme une forteresse incassable, mais aujourd'hui nos forces ont non seulement franchi leurs murs, mais contrôlent désormais le Sinaï. Le Sinaï est un bras de la nation égyptienne et son retour sous notre juste contrôle inspire la nation. Des millions de personnes à travers l'Égypte accueillent favorablement la nouvelle et le moral de nos forces sur le front est débordant. La décision à laquelle sont confrontés notre gouvernement et nos militaires est de proposer un cessez-le-feu ou de continuer. Puisque nous avons sécurisé le Sinaï, terre égyptienne souveraine, nous pouvons fortifier nos positions et proposer un cessez-le-feu en position de force. Cependant, cela risquerait de nous aliéner nos frères arabes, qui voudront que nous poursuivions notre route vers Jérusalem. Compte tenu de la manière dont nos forces repoussent l'ennemi, continuer à mettre fin une fois pour toutes à la menace sioniste est également une option. Une victoire totale nous permettrait de déterminer l'avenir de la région, mais on peut s'attendre à ce que la résistance s'intensifie et nous risquons d'épuiser nos propres forces." 
 EGY_1973.2.a:0 "Proposer un cessez-le-feu"
 EGY_1973.2.b:0 "Achevons notre conquête !"

 EGY_1973.3.t:0 "Plus de gains en Palestine !"
 EGY_1973.3.d:0 "Depuis le Sinaï, nos troupes ont continué à pénétrer sur le territoire sioniste, libérant des pans entiers de terres arabes en Palestine. Les sionistes continuent de résister à nos forces, mais nos commandants ont discrètement exprimé leur propre surprise face au succès de nos forces. Cependant, à mesure que l'armée progresse, elle s'éloigne de plus en plus des lignes d'approvisionnement et on craint une extension excessive de la part des commandants supérieurs. Il faut maintenant décider si nous déclarons un cessez-le-feu et négocions avec le Sinaï et les parties clés de la Palestine sous notre contrôle, ou si nous devons continuer à faire pression pour une victoire finale. Il est certain qu'un cessez-le-feu nous donnerait maintenant une excellente position de négociation. Cependant, une victoire totale nous permettrait de dicter les conditions, mais poursuivre nos efforts pourrait entraîner davantage de pression internationale et risquer nos forces de se retrouver face à une contre-attaque sioniste."
 EGY_1973.3.a:0 "Proposer un cessez-le-feu" 
 EGY_1973.3.b:0 "Achevons notre conquête !"

 EGY_1973.4.t:0 "Ultimatum des États-Unis"
 EGY_1973.4.d:0 "Les Américains se sont révélés être les comparses sionistes que nous avons toujours connus. Alors que nos forces continuent de frapper les sionistes et de libérer davantage de terres palestiniennes, nous avons reçu une note des États-Unis. Ils ont exigé que nous proposions un cessez-le-feu aux sionistes, sinon ils interviendraient. Compte tenu de la puissance et de l'influence des Américains, une telle menace ne peut être prise à la légère. Nous avons déjà accompli beaucoup de choses et proposer un cessez-le-feu se fera en position de force. Le moment est peut-être venu de s'arrêter et de célébrer nos incroyables réalisations face à l'ennemi. Cependant, un certain nombre de hauts responsables soulignent qu'il ne s'agit peut-être que d'un bluff, dans la mesure où le gouvernement américain pourrait ne pas être en mesure de rallier sa population pour soutenir une guerre qui risque de se transformer en une confrontation avec l'Union soviétique. Surtout s'il s'agit du sort d'un État étranger."
 EGY_1973.4.a:0 "Proposer un cessez-le-feu" 
 EGY_1973.4.b:0 "Ignorer"

 EGY_1973.5.t:0 "Les États-Unis interviennent"
 EGY_1973.5.d:0 "Le Caire est sous le choc depuis que les États-Unis ont rejoint les sionistes et vont déployer leur armée contre nos braves hommes. Nous avions sous-estimé la profondeur de l'influence des sionistes sur les États-Unis et pensions qu'ils ne risqueraient pas la paix mondiale pour le bien d'un État étranger. Nous prévoyons d'engager des discussions immédiates avec l'ambassadeur soviétique pour voir s'il peut nous aider. Malgré ce revers diplomatique, le succès de nos forces sur le terrain et le moral de notre peuple garantiront que nous serons prêts à relever tous les défis que les Américains nous lanceront dans leur effort voué à l'échec pour sauver les sionistes."
 EGY_1973.5.a:0  "Ils ne bluffaient donc pas..."

 EGY_1973.6.t:0 "Les sionistes acceptent nos conditions !"
 EGY_1973.6.d:0 "L'opération Badr a vu nos forces courageuses percer les fortifications sionistes du Sinaï, défenses qu'elles avaient proclamées impénétrables. Une fois que nous avons percé, nos hommes ont pu faire pression sur l'ennemi et le chasser du Sinaï. La sécurisation du Sinaï a rendu la terre sacrée à la patrie. Notre position de force assurée, nous avons gracieusement offert aux sionistes un cessez-le-feu avec le Sinaï sous notre contrôle. Le lâche ennemi a accepté nos conditions et désormais nos troupes sont les maîtres du Sinaï. Des milliers de personnes sont descendues dans la rue à travers l'Égypte pour célébrer notre éclatant succès face aux sionistes. Cependant, d'autres États arabes nous ont critiqué pour notre arrêt, mais cela n'a pas d'importance, nous avons restauré l'honneur égyptien et porté un coup dévastateur aux sionistes."
 EGY_1973.6.a:0 "Victoire!"

 EGY_1973.7.t:0 "Les sionistes acceptent nos conditions !"
 EGY_1973.7.d:0 "La guerre a commencé avec l'opération Badr dans le Sinaï. Son succès retentissant nous a permis de chasser les sionistes et de libérer cette terre égyptienne sacrée. Nos forces ont ensuite continué et, dans une série de victoires, ont libéré une grande partie de l'ouest et du sud de la Palestine. Une fois ces terres sécurisées, nous avons proposé aux sionistes un cessez-le-feu et les lâches ont accepté. L'Égypte contrôle désormais le Sinaï et nos courageuses forces armées resteront en Palestine pour protéger son peuple et superviser le retrait de toute présence sioniste sur ce territoire. Dans tout le monde arabe, des centaines de milliers de personnes sont descendues dans la rue pour célébrer la victoire des armes arabes et la libération des terres arabes après des années d'occupation."
 EGY_1973.7.a:0 "Victoire!"

 EGY_1973.8.t:0 "Les sionistes refusent le cessez-le-feu"
 EGY_1973.8.d:0 "Nos forces ont mis en déroute les sionistes depuis le début du conflit. Ils subissent défaite après défaite contre nos forces courageuses. Nous leur avons gracieusement proposé des conditions de cessez-le-feu et leur avons seulement demandé d'accepter que nos forces restent dans les terres qu'elles ont actuellement libérées. Pourtant, malgré notre générosité, les sionistes ont plutôt rejeté nos conditions. Leur folie et leurs illusions sont de leur faute et désormais nos forces n'auront plus d'autre choix que de continuer à avancer contre l'ennemi."
 EGY_1973.8.a:0 "Alors ils choisissent la mort..."

 EGY_1973.9.t:0 "Les sionistes proposent un cessez-le-feu"
 EGY_1973.9.d:0 "Nos forces courageuses continuent de combattre l'ennemi sioniste. Là où nous avançons, ils reculent et là où ils nous attaquent, nous les saignons. Les sionistes restent stupéfaits par la ténacité, le génie et les prouesses au combat de nos forces armées. En conséquence, ils nous ont proposé un cessez-le-feu qui verrait les deux parties revenir aux frontières d'avant-guerre. Bien sûr, nos hommes se débrouillent exceptionnellement bien sur le terrain, mais les commandants ont noté que l'avancée était lente. Nous avons fait nos preuves en tant qu'hommes combattants et peut-être qu'un cessez-le-feu nous permettra désormais de négocier à partir d'une position beaucoup plus forte. Cependant, même si l'avancée a été lente, ce n'est peut-être qu'une question de temps avant que nous puissions percer et inverser complètement la tendance. Sinon, pourquoi proposeraient-ils un cessez-le-feu ?"
 EGY_1973.9.a:0 "Accepter le cessez-le-feu"

 EGY_1973.10.t:0 "La deuxième offre de cessez-le-feu des sionistes"
 EGY_1973.10.d:0 "Les sionistes ont une fois de plus proposé un cessez-le-feu pour mettre fin aux hostilités. Nos courageux hommes ont renforcé leur opposition et, même si nous avons perdu des territoires clés, la défense du Caire reste solide. Parmi les hauts responsables, certains estiment qu'accepter un cessez-le-feu à ce stade pourrait réduire la dureté des exigences sionistes. Cependant, un autre groupe soutient que négocier ou ramper devant l'ennemi serait une honte pour notre grande nation arabe. Le choix est maintenant soit d'accepter le cessez-le-feu sioniste, soit de lutter jusqu'au dernier homme, ou bien, avec l'aide de Dieu, nous pouvons même changer notre destin."
 EGY_1973.10.a:0 "Accepter le cessez-le-feu" 
 EGY_1973.10.b:0 "Nous nous battrons jusqu'au dernier !"

 EGY_1973.11.t:0 "L'Union soviétique intervient"
 EGY_1973.11.d:0 "L'Union soviétique est depuis longtemps l'amie du peuple égyptien et, dans notre plus grande lutte, elle est venue à notre aide. Le soutien soviétique renforcera nos courageuses forces armées et rehaussera le moral de notre peuple. Les Soviétiques avaient préparé un certain nombre de troupes spécialisées pour un déploiement rapide et nous pouvons nous attendre à ce qu'elles arrivent bientôt. Les sionistes et leur bande de partisans devront désormais composer avec l'Armée rouge et nos forces."
 EGY_1973.11.a:0 "Nous ne nous attendions pas à des forces spéciales."

#Decisions

###Israel###

 
 ISR_1973.1.t:0 "Rapports de mobilisation égyptienne"
 ISR_1973.1.d:0 "Depuis nos positions avancées dans le Sinaï et d'autres moyens de renseignement, nous avons reçu de nombreux rapports selon lesquels les Égyptiens ont commencé à mobiliser leurs forces. Le rassemblement de troupes et d'équipements arabes à notre frontière est préoccupant. Certains membres du cabinet estiment que la mobilisation n'est peut-être qu'une posture visant à apaiser la population nationale et préviennent qu'une escalade de nos forces pourrait retourner complètement l'opinion internationale contre nous. D'autres cependant préconisent d'annuler le congé de Yom Kippour dont profitent beaucoup de nos militaires et de les déployer immédiatement au front. Ils soutiennent que nous ne pouvons pas donner l'initiative à l'ennemi."
 ISR_1973.1.a:0 "Les vacances sont annulées ! Aux armes !"

 ISR_1973.2.t:0 "Rapports de mobilisation syrienne"
 ISR_1973.2.d:0 "Depuis nos positions avancées dans le Golan et d'autres moyens de renseignement, nous avons reçu de nombreux rapports selon lesquels les Syriens ont commencé à mobiliser leurs forces. Le regroupement de troupes arabes en provenance de l'un de nos voisins les plus dangereux est préoccupant. Certains membres du cabinet estiment que la mobilisation n'est peut-être qu'une posture visant à apaiser la population nationale et préviennent qu'une escalade de nos forces pourrait retourner complètement l'opinion internationale contre nous. D'autres cependant préconisent d'annuler le congé de Yom Kippour dont profitent beaucoup de nos militaires et de les déployer immédiatement au front. Ils soutiennent que nous ne pouvons pas donner l'initiative à l'ennemi."
 ISR_1973.2.a:0 "Les vacances sont annulées ! Aux armes !" 

 ISR_1973.3.t:0 "L'Egypte propose un cessez-le-feu"
 ISR_1973.3.d:0 "Nos courageux guerriers de Tsahal continuent de résister à l'agression arabe dans le Sinaï. Malgré tous nos efforts, les troupes ont été forcées de quitter le Sinaï et sont désormais positionnées pour défendre la patrie contre l'agression. Les Egyptiens, sans doute conscients de leur attaque perfide, n'ont plus la surprise de nous avoir proposé un cessez-le-feu acceptant leur occupation du Sinaï. Si nous acceptons le cessez-le-feu maintenant, nos terres resteront intactes et nous pourrons nous concentrer sur d'autres menaces et nous regrouper après les pertes initiales. Cependant, certains dirigeants de Tsahal suggèrent que les Égyptiens ont dépensé toutes leurs astuces et que nous pourrons bientôt riposter et les repousser par-dessus le canal."
 ISR_1973.3.a:0 "Accepter le cessez-le-feu" 
 ISR_1973.3.b:0 "Nous nous battrons jusqu'au dernier !"

 ISR_1973.4.t:0 "L'Égypte propose un cessez-le-feu"
 ISR_1973.4.d:0 "Personne ne peut douter du courage et de la ténacité de Tsahal. Face à une agression arabe écrasante, l'armée israélienne continue de combattre et de saigner l'ennemi pour chaque centimètre carré de notre sol sacré qu'elle s'empare. C'est pourquoi les Égyptiens nous ont récemment adressé une offre de cessez-le-feu. L'accepter signifierait permettre aux armées arabes d'occuper le Sinaï, Gaza et le sud d'Israël. Même si nous perdrions notre terre, cela nous donnerait au moins le temps de nous regrouper et d'assurer la survie du reste d'Israël. Cependant, certains hauts responsables suggèrent que nous continuions à nous battre et à faire confiance à notre foi et à notre peuple. Être à la merci de notre ennemi serait un sort pire que la mort."
 ISR_1973.4.a:0 "Accepter le cessez-le-feu" 
 ISR_1973.4.b:0 "Nous nous battrons jusqu'au dernier !"

 ISR_1973.5.t:0 "Les États-Unis décident d'intervenir"
 ISR_1973.5.d:0 "Dans ce que beaucoup en Israël assimilent à un miracle biblique, les États-Unis ont accepté d'intervenir et de sauver Israël de l'agression arabe qui menace de détruire la nation. L'annonce des États-Unis intervient alors que Tsahal continue de résister depuis ses derniers bastions de défense. L'arrivée du soutien américain va sans aucun doute inverser la tendance et des forces spécialisées seraient déjà en route vers la région. Nos renseignements rapportent que l'ambiance au Caire est passée de la jubilation à l'horreur la plus abjecte."
 ISR_1973.5.a:0 "Nous ne nous attendions pas à des forces spéciales."

 ISR_1973.6.t:0 "Les Soviétiques lancent un ultimatum"
 ISR_1973.6.d:0 "L'Union soviétique a adressé une note à notre gouvernement exigeant que nous proposions un cessez-le-feu immédiat aux Égyptiens ou que nous fassions face à une intervention soviétique. Bien que les Arabes nous aient lâchement attaqués sans avertissement, l'armée israélienne a réussi à les repousser et nos forces sont implantées en Égypte, garantissant qu'elles ne penseront plus jamais à nuire à notre peuple. De nombreux membres de haut rang du cabinet suggèrent que le message a été envoyé à l'Égypte à ce stade et qu'il s'agit d'offrir un cessez-le-feu. Cependant, plusieurs officiers du cabinet et de Tsahal pensent également que les Soviétiques bluffent simplement. Ils suggèrent que les Soviétiques ne font qu'apaiser les Égyptiens et n'envisageraient pas sérieusement d'intervenir directement."
 ISR_1973.6.a:0 "Proposer un cessez-le-feu à l'Égypte" 
 ISR_1973.6.b:0 "Ignorer"

 ISR_1973.7.t:0 "L'Union soviétique intervient..."
 ISR_1973.7.d:0 "L'annonce par l'Union soviétique de son intention d'intervenir immédiatement dans la guerre a transformé l'humeur de notre peuple en deuil. La satisfaction et la fierté que nous avions ressenties auparavant pour nos soldats qui ont mené la guerre au coeur d'un ennemi qui nous avait si perfidement attaqués se sont maintenant transformées en une peur pour eux et pour notre propre survie. Le gouvernement n'a pas compris les intentions soviétiques et doit maintenant en subir les conséquences. Malgré ce revers, nous persévérerons."
 ISR_1973.7.a:0 "Donc ils ne bluffaient pas..."

 ISR_1973.8.t:0 "Les Soviétiques lancent un ultimatum"
 ISR_1973.8.d:0 "L'Union soviétique a adressé une note à notre gouvernement exigeant que nous proposions un cessez-le-feu immédiat au gouvernement syrien ou que nous fassions face à une intervention soviétique. Bien que les Arabes nous aient lâchement attaqués sans avertissement, l'armée israélienne a réussi à les repousser et nos forces sont présentes en Syrie pour s'assurer qu'elles ne pensent plus à nuire à notre peuple. De nombreux membres de haut rang du cabinet suggèrent que ce message a été envoyé à la Syrie à ce stade et pour proposer un cessez-le-feu. Cependant, plusieurs officiers du cabinet et de Tsahal pensent également que les Soviétiques bluffent simplement. Ils suggèrent que les Soviétiques ne font qu'apaiser les Syriens et n'envisageraient pas sérieusement d'intervenir directement."
 ISR_1973.8.a:0 "Proposer un cessez-le-feu à la Syrie"
 ISR_1973.8.b:0 "Ignorer"

 ISR_1973.9.t:0 "Le Sinaï tient bon !"
 ISR_1973.9.d:0 "Malgré des préparatifs approfondis et le regroupement d'énormes forces, la tentative arabe de percer le Sinaï a clairement échoué. Les Égyptiens pensaient pouvoir lancer une lâche attaque à notre insu et détruire notre présence dans le Sinaï. Cependant, Tsahal s'est révélé être la force supérieure et notre résistance obstinée et nos contre-attaques ont assuré notre victoire et notre domination dans le Sinaï. Certains suggèrent que c'est le moment de proposer un cessez-le-feu et de mettre fin aux hostilités alors que nous gardons le contrôle et avons vaincu l'attaque. D'autres, cependant, estiment que les Arabes doivent recevoir une leçon et que Tsahal doit persévérer. Une victoire écrasante pourrait nous assurer des décennies de sécurité."
 ISR_1973.9.a:0 "Proposer un cessez-le-feu à l'Égypte"
 ISR_1973.9.b:0 "Nous les terminerons !"

 ISR_1973.10.t:0 "Israël franchit le canal de Suez"
 ISR_1973.10.d:0 "L'armée israélienne a traversé la rivière Suez et a repoussé les Egyptiens meurtris vers la périphérie du Caire. Les pertes arabes continuent de s'accroître et leur moral s'est sans aucun doute effondré. Les médiateurs internationaux suggèrent que les Égyptiens en ont assez et qu'ils accepteront probablement un cessez-le-feu. La victoire étant assurée, il est logique de proposer un cessez-le-feu à ce stade et de mettre fin aux combats. Cela nous permettra de nous regrouper, de négocier en position de force et d'améliorer notre position sur la scène internationale. Cependant, certains hauts responsables et officiers de Tsahal suggèrent que nous allions de l'avant et que nous marchions jusqu'à ce que les Arabes n'aient nulle part où se retirer."
 ISR_1973.10.a:0 "Proposer un cessez-le-feu à l'Égypte" 
 ISR_1973.10.b:0 "Nous les terminerons !"

 ISR_1973.11.t:0 "L'Égypte accepte le cessez-le-feu !"
 ISR_1973.11.d:0 "Les Égyptiens pensaient pouvoir percer nos lignes et nous prendre le Sinaï. Cependant, Tsahal s'est révélé une fois de plus bien trop supérieur à l'ennemi. La tentative perfide des Égyptiens a été contrecarrée et ils ont accepté notre généreuse offre de cessez-le-feu. L'armée israélienne s'est battue avec ténacité et avec une détermination inébranlable pour garder le Sinaï sous notre contrôle. Le Sinaï reste un bastion de la défense israélienne et, avec ce succès, nous espérons que les Égyptiens comprendront désormais qu'ils n'ont aucune chance de changer le statu quo par la force des armes. C'est une grande victoire pour Israël et l'armée israélienne."
 ISR_1973.11.a:0 "Victoire!"

 ISR_1973.12.t:0 "L'Egypte accepte le cessez-le-feu !"
 ISR_1973.12.d:0 "Les Égyptiens ont accepté notre offre de cessez-le-feu, confirmant ainsi la défaite dévastatrice qu'ils ont subie. Leur tentative perfide de s'emparer du Sinaï par la force militaire n'a pas seulement été contrecarrée par Tsahal, mais nous l'avons transformée en une avancée vers l'Égypte. Non seulement nous les avons empêchés de prendre le Sinaï, mais nos forces courageuses ont engagé le combat en Égypte et ont capturé l'importante Suez à l'ennemi. À partir de maintenant, l'Égypte y réfléchira à deux fois avant de menacer notre existence."
 ISR_1973.12.a:0 "Victoire!"

 ISR_1973.13.t:0 "L'Egypte rejette l'offre de paix"
 ISR_1973.13.d:0 "Les Égyptiens ont dit non à notre récente offre de cessez-le-feu. Ils sont clairement trop gênés par leurs échecs face à nos forces pour accepter la réalité du terrain. Suite au rejet, une réunion a eu lieu avec de hauts responsables et des officiers de Tsahal. L'armée israélienne a déclaré qu'elle continuerait à punir les Égyptiens et à leur faire regretter leur refus de négocier. S'ils espèrent une déception ou de meilleures conditions, ils ne les recevront pas de nos forces qui poursuivront leurs opérations avec la même vigueur qu'auparavant."
 ISR_1973.13.a:0 "Alors ils ont choisi la mort..."

 ISR_1973.14.t:0 "Golan reste ferme !"
 ISR_1973.14.d:0 "Malgré des préparatifs approfondis et le regroupement d'énormes forces, la tentative arabe de percer le Golan a clairement échoué. Les Syriens pensaient pouvoir lancer une attaque lâche à notre insu et détruire notre présence dans les hauts plateaux. Cependant, Tsahal s'est révélé être la force supérieure et notre résistance obstinée et nos contre-attaques ont assuré notre victoire et notre domination sur le plateau du Golan. Certains suggèrent que c'est le moment de proposer un cessez-le-feu et de mettre fin aux hostilités alors que nous gardons le contrôle et avons vaincu l'attaque. D'autres, cependant, estiment que les Arabes doivent recevoir une leçon et que Tsahal doit persévérer. Une victoire écrasante pourrait nous assurer des décennies de sécurité."
 ISR_1973.14.a:0 "Proposer un cessez-le-feu à la Syrie"
 ISR_1973.14.b:0 "Nous les terminerons !"

 ISR_1973.15.t:0 "Israël traverse le Golan"
 ISR_1973.15.d:0 "L'armée israélienne a traversé le Golan et repoussé les Syriens battus vers la périphérie de Damas. Les pertes arabes continuent de s'accroître et leur moral s'est sans aucun doute effondré. Les médiateurs internationaux suggèrent que les Syriens en ont assez et qu'ils accepteront probablement un cessez-le-feu. La victoire étant assurée, il est logique de proposer un cessez-le-feu à ce stade et de mettre fin aux combats. Cela nous permettra de nous regrouper, de négocier en position de force et d'améliorer notre position sur la scène internationale. Cependant, certains hauts responsables et officiers de Tsahal suggèrent que nous allions de l'avant et que nous marchions jusqu'à ce que les Arabes n'aient nulle part où se retirer."
 ISR_1973.15.a:0 "Proposer un cessez-le-feu à la Syrie" 
 ISR_1973.15.b:0 "Nous les terminerons !"

 ISR_1973.16.t:0 "La Syrie accepte le cessez-le-feu !"
 ISR_1973.16.d:0 "Les Syriens pensaient pouvoir percer nos lignes et nous prendre le Golan. Cependant, Tsahal s'est révélé une fois de plus bien trop supérieur à l'ennemi. La perfide tentative syrienne a été contrecarrée et ils ont accepté notre généreuse offre de cessez-le-feu. L'armée israélienne a combattu avec ténacité et détermination pour tenir les Syriens à distance. Le Golan reste un bastion de la défense israélienne et, avec ce succès, nous espérons que les Syriens reconnaîtront désormais qu'ils n'ont aucune chance de changer le statu quo par la force des armes. C'est une grande victoire pour Israël et l'armée israélienne."
 ISR_1973.16.a:0 "Victoire!"

 ISR_1973.17.t:0 "La Syrie accepte le cessez-le-feu !"
 ISR_1973.17.d:0 "Les Syriens ont accepté notre offre de cessez-le-feu, confirmant ainsi la défaite dévastatrice qu'ils ont subie. Leur tentative perfide de s'emparer du Golan par la force militaire n'a pas seulement été contrecarrée par Tsahal, mais nous l'avons transformée en une avancée vers la Syrie. Les courageux hommes et femmes de Tsahal ont engagé le combat en Syrie et étaient prêts à avancer vers Damas même. À partir de maintenant, la Syrie réfléchira à deux fois avant de menacer notre existence."
 ISR_1973.17.a:0 "Victoire!"

 ISR_1973.18.t:0 "La Syrie rejette le cessez-le-feu"
 ISR_1973.18.d:0 "Les Syriens ont dit non à notre récente offre de cessez-le-feu. Ils sont clairement trop gênés par leurs échecs face à nos forces pour accepter la réalité du terrain. Suite au rejet, une réunion a eu lieu avec de hauts responsables et des officiers de Tsahal. L'armée israélienne a déclaré qu'elle continuerait à punir les Syriens et à leur faire regretter leur refus de négocier. S'ils espèrent une déception ou de meilleures conditions, ils ne les recevront pas de nos forces qui poursuivront leurs opérations avec la même vigueur qu'auparavant."
 ISR_1973.18.a:0 "Alors ils ont choisi la mort..."

 ISR_1973.19.t:0 "La Syrie propose un cessez-le-feu"
 ISR_1973.19.d:0 "Nos courageux guerriers de Tsahal continuent de résister à l'agression arabe sur le plateau du Golan. Malgré tous nos efforts, les troupes ont été forcées de quitter les Highlands et sont désormais positionnées pour défendre la patrie contre l'agression. Les Syriens, sans doute conscients de leur attaque perfide, n'ont plus la surprise de nous avoir proposé un cessez-le-feu acceptant le retour du plateau du Golan. Si nous acceptons le cessez-le-feu maintenant, nos terres resteront intactes et nous pourrons nous concentrer sur d'autres menaces et nous regrouper après les pertes initiales. Cependant, certains dirigeants de Tsahal suggèrent que les Syriens ont dépensé toutes leurs astuces et que nous serons bientôt en mesure de riposter et de rentrer chez nous."
 ISR_1973.19.a:0 "Accepter le cessez-le-feu" 
 ISR_1973.19.b:0 "Nous nous battrons jusqu'au dernier !"

 ISR_1973.20.t:0 "La Syrie propose un cessez-le-feu"
 ISR_1973.20.d:0 "Personne ne peut douter du courage et de la ténacité de Tsahal. Face à une agression arabe écrasante, l'armée israélienne continue de combattre et de saigner l'ennemi pour chaque centimètre carré de notre sol sacré qu'elle s'empare. C'est pourquoi les Syriens nous ont récemment adressé une offre de cessez-le-feu. L'accepter signifierait permettre aux armées arabes d'occuper le plateau du Golan et le nord d'Israël. Même si nous perdrions notre terre, cela nous donnerait au moins le temps de nous regrouper et d'assurer la survie du reste d'Israël. Cependant, certains hauts responsables suggèrent que nous continuions à nous battre et à faire confiance à notre foi et à notre peuple. Être à la merci de notre ennemi serait un sort pire que la mort."
 ISR_1973.20.a:0 "Accepter le cessez-le-feu" 
 ISR_1973.20.b:0 "Nous nous battrons jusqu'au dernier !"

#Decisions

###Syria###

 SYR_1973.1.t:0 "Récupérez les hauteurs du Golan !"
 SYR_1973.1.d:0 "Depuis des mois, nous nous préparons à attaquer l'ennemi avec nos frères égyptiens. Maintenant qu'ils ont lancé une frappe dévastatrice contre les sionistes, le moment est venu pour nous de nous y joindre. Les sionistes n'ont aucune idée de nos préparatifs et nous sous-estiment. Nous vengerons les humiliations passées et restaurerons non seulement la fierté arabe mais aussi nos terres occupées. Les hommes sont motivés par leur juste cause et attendent avec impatience l'appel pour aller de l'avant."
 SYR_1973.1.a:0 "En avant vers la victoire !"

 SYR_1973.2.t:0 "Golan récupéré !"
 SYR_1973.2.d:0 "Nos préparatifs et notre réarmement ont porté leurs fruits pour l'armée arabe syrienne. Nous contrôlons désormais le Golan, rétablissant la domination syrienne sur des terres qui nous ont été injustement prises. Les forces sionistes étaient incapables de résister à nos forces supérieures. Maintenant que nous avons repris nos terres, certains hauts responsables et chefs militaires affirment qu'il est peut-être temps de proposer un cessez-le-feu. Une fois le Golan sécurisé, nous pouvons facilement le négocier et mettre fin à la guerre avant que les sionistes ne puissent reprendre pied. Une autre faction, cependant, soutient que nous devons persévérer et libérer davantage de terres arabes, surtout avec un ennemi si faible."
 SYR_1973.2.a:0 "Proposer un cessez-le-feu à Israël"
 SYR_1973.2.b:0 "Achevons notre conquête ! "

 SYR_1973.3.t:0 "Plus de terres libérées"
 SYR_1973.3.d:0 "Les courageux combattants de l'armée arabe syrienne ont continué sur leur lancée et ont pris le contrôle du nord de la Palestine, terre que les sionistes occupent depuis des années. La force ennemie continue d'être vaincue par notre puissance militaire. Une fois de plus, certains de nos plus hauts dirigeants suggèrent que nous proposions un cessez-le-feu aux sionistes. Ils déclarent que nous avons remporté une victoire éclatante et qu'il est maintenant temps de mettre fin aux combats selon nos conditions. Dans le même temps, d'autres dirigeants nous exhortent à poursuivre le combat. Ils affirment qu'il s'agit d'une occasion en or d'éliminer définitivement la menace sioniste et que nous ne pouvons pas manquer cette occasion."
 SYR_1973.3.a:0 "Proposer un cessez-le-feu à Israël" 
 SYR_1973.3.b:0 "Achevons notre conquête !"

 SYR_1973.4.t:0 "Les États-Unis lancent un ultimatum"
 SYR_1973.4.d:0 "Alors que les sionistes font face à défaite après défaite aux mains de nos courageuses forces armées. Leur résistance s'effondre alors que nous continuons à récupérer les terres arabes de leur occupation. Cependant, les sionistes avaient encore un tour dans leur sac puisque leurs agents ont convaincu les États-Unis de lancer un ultimatum exigeant que nous proposions un cessez-le-feu et mettions fin à la guerre maintenant. Étant donné que nous avons déjà complètement battu l'ennemi et atteint nos objectifs, il est peut-être temps d'instaurer un cessez-le-feu et d'éviter cette menace américaine. Cependant, d'autres pensent que les Américains bluffent et qu'il s'agit là d'un stratagème sioniste. Ils pensent que nous devrions ignorer cet ultimatum et essayer d'en finir avec l'ennemi."
 SYR_1973.4.a:0 "Proposer un cessez-le-feu à Israël" 
 SYR_1973.4.b:0 "Ignorer"

 SYR_1973.5.t:0 "Les États-Unis interviennent !"
 SYR_1973.5.d:0 "L'ambiance à Damas a radicalement changé. La panique s'est emparée des rues alors que les citoyens ont commencé à se préparer à l'arrivée des bombardiers américains en restant en dehors des rues et en stockant des provisions. Les installations gouvernementales et militaires sont renforcées alors que les hauts responsables et officiers gouvernementaux peinent à comprendre que les États-Unis ont rejoint la guerre contre notre nation. Nous pensions que leur ultimatum n'était qu'un stratagème et ne pensions pas qu'ils participeraient sérieusement au conflit. Cependant, il est désormais trop tard et, malgré le danger, nous devons avoir confiance que nos forces armées seront à la hauteur de la tâche de vaincre les Américains."
 SYR_1973.5.a:0 "Donc ils ne bluffaient pas..."
 
 SYR_1973.6.t:0 "Israël accepte le cessez-le-feu !"
 SYR_1973.6.d:0 "Les années de réarmement et les mois de préparation de cette guerre ont atteint son objectif. Les forces armées syriennes, faisant preuve de courage et de dynamisme, ont réussi à arracher le Golan occupé aux ennemis sionistes. Nos troupes ont été inspirées par le caractère sacré de leur mission et ont repoussé toutes les tentatives ennemies. Une fois notre mission accomplie, nous avons gracieusement proposé un cessez-le-feu que les lâches sionistes ont accepté. Les hauteurs du Golan font désormais à nouveau partie de la Syrie et nous ne les perdrons plus jamais."
 SYR_1973.6.a:0 "Victoire!"

 SYR_1973.7.t:0 "Israël accepte le cessez-le-feu !"
 SYR_1973.7.d:0 "Les années de réarmement et les mois de préparation de cette guerre ont permis d'atteindre son objectif et plus encore. Les forces armées syriennes, faisant preuve de courage et de dynamisme, ont réussi à reprendre le Golan occupé aux sionistes. Nos troupes ont été inspirées par le caractère sacré de leur mission et, depuis le Golan, ont pénétré profondément en Palestine pour libérer les terres arabes occupées par les sionistes. Même si nos forces écrasaient l'ennemi, nous avons gracieusement proposé un cessez-le-feu que les humbles sionistes ont accepté. Les hauteurs du Golan font désormais à nouveau partie de la nation syrienne. Nous occupons également fermement le nord de la Palestine pour protéger les terres arabes contre une nouvelle profanation."
 SYR_1973.7.a:0 "Victoire!"

 SYR_1973.8.t:0 "Israël rejette le cessez-le-feu"
 SYR_1973.8.d:0 "Nos dirigeants à Damas ont été amusés par le rejet israélien de notre cessez-le-feu et de la fin des hostilités. Leur stupide orgueil a occulté la réalité selon laquelle notre armée arabe syrienne continue de surclasser les forces sionistes et de les repousser. Même si notre offre était généreuse, cela ne signifiait pas que nous allions relâcher ou ralentir nos efforts. Nous continuerons notre avancée et ferons regretter aux sionistes leur décision. La libération des terres arabes sacrées se poursuivra."
 SYR_1973.8.a:0 "Alors ils ont choisi la mort..."

 SYR_1973.9.t:0 "Offre de cessez-le-feu reçue"
 SYR_1973.9.d:0 "Les sionistes ont récemment proposé un cessez-le-feu pour mettre fin aux combats entre nous. Notre courageuse armée a combattu avec ténacité et dévouement contre un ennemi soutenu par l'aide étrangère. Malgré les difficultés qui pèsent sur nos forces, nous continuons à les combattre sur un pied d'égalité et le succès de nos combattants a sans aucun doute poussé les sionistes à proposer un cessez-le-feu assorti d'un accord de retour aux frontières d'avant-guerre. Certains dirigeants suggèrent que nous avons fait nos preuves et qu'un cessez-le-feu serait judicieux. D'autres nous exhortent à rejeter l'offre sioniste et à poursuivre notre action. Ils disent que l'ennemi est manifestement sur le point de s'effondrer contre nous et qu'il tente de mettre fin aux combats avant que nous inversions la tendance."
 SYR_1973.9.a:0 "Accepter le cessez-le-feu" 
 SYR_1973.9.b:0 "Nous nous battrons jusqu'au dernier !"

 SYR_1973.10.t:0 "Offre de cessez-le-feu reçue"
 SYR_1973.10.d:0 "Bien que nos forces se soient repliées sur des positions défensives, elles continuent de lutter courageusement contre une opposition sioniste écrasante. En signe de la douleur que nous infligeons à notre ennemi qui avance, nous avons reçu une offre de cessez-le-feu de la part de l'ennemi. Ils ne sont sans aucun doute pas disposés à perdre davantage de vies pour tenter de nous déloger. Même si nous avons perdu des terres, certains dirigeants estiment qu'accepter un cessez-le-feu maintenant serait à notre avantage, dans la mesure où nous avons montré au peuple notre dévouement à la cause. Cependant, une autre faction affirme que nous ne devrions jamais négocier avec l'ennemi et que si c'est la fin, nous devons nous battre jusqu'au dernier homme et faire confiance à Dieu pour inverser la tendance pour nous."
 SYR_1973.10.a:0 "Accepter le cessez-le-feu"
 SYR_1973.10.b:0 "Nous nous battrons jusqu'au dernier !"

 SYR_1973.11.t:0 "L'Union soviétique intervient !"
 SYR_1973.11.d:0 "Un climat d'optimisme palpable, voire de joie, imprègne aujourd'hui la Syrie. Notre peuple a appris que l'Union soviétique avait décidé d'intervenir et d'empêcher les sionistes de détruire la région pour leurs objectifs égoïstes. L'Union Soviétique reconnaît les intentions perverses de notre ennemi et est prête à nous aider de quelque manière que ce soit. Nos responsables sont déjà au téléphone ou organisent des réunions avec leurs homologues soviétiques. Comme les Soviétiques surveillaient de près la guerre, nous espérons que leur soutien arrivera bientôt."
 SYR_1973.11.a:0 "Dieu a répondu à nos prières !"

