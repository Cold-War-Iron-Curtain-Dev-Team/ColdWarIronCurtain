 ## Infantry Equipment

 CYP_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 CYP_infantry_equipment_0_short:0 "SMLE n°4"
 CYP_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 CYP_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 CYP_infantry_equipment_1_short:0 "FN FAL"
 CYP_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 CYP_infantry_equipment_2:0 "SA vz. 58"
 CYP_infantry_equipment_2_short:0 "vz. 58"
 CYP_infantry_equipment_2_desc:0 "Le vz. 58 (ou Sa vz. 58) est un fusil d'assaut de 7,62 × 39 mm conçu et fabriqué en Tchécoslovaquie et mis en service à la fin des années 1950 sous le nom de samopal vzor 58 de 7,62 mm, remplaçant le vz. 52 et les mitraillettes Tokarev Sa 24 et Sa 26 de 7,62 × 25 mm."

 CYP_infantry_equipment_3:0 "Heckler & Koch G3A3"
 CYP_infantry_equipment_3_short:0 "G3A3"
 CYP_infantry_equipment_3_desc:0 "La version de 1963 la plus connue. Des viseurs à tambour avec un guidon amélioré, un suppresseur de flash/frein de bouche capable de tirer des grenades aux normes OTAN, une crosse fixe en plastique solide et un protège-main en plastique qui n'entre pas en contact avec le canon flottant. Le protège-main était disponible en version fine et ventilée et en version large. Ce dernier permet la fixation d'un bipied."

 CYP_infantry_equipment_4:0 "Avtomat Kalachnikova 1974 Modernizirovanniy"
 CYP_infantry_equipment_4_short:0 "AK-74M"
 CYP_infantry_equipment_4_desc:0 "L'AK-74M est une variante améliorée de l'AK-74 développée en 1991 par l'usine Izhmash. L'AK-74M a été développé pour incorporer de nouveaux matériaux et des avancées de fabrication afin de créer une arme améliorée. Il comporte un boulon et un support allégés qui réduisent le recul produit par le piston à gaz. Le fusil comprend également une crosse en polyamide chargé de verre pouvant tenir latéralement, une bouche améliorée, un couvercle renforcé et plusieurs autres améliorations mineures. Il est également livré avec un rail pour le montage des optiques. Le fusil allégé et renforcé était plus facile à manipuler et à transporter et offrait un meilleur support pour les accessoires. Il n'a pas été adopté par l'Union soviétique, car l'URSS s'est effondrée avant de pouvoir être envisagée. Cependant, il a été adopté par la Fédération de Russie."

