 CYP_lt_equipment_5:0 "Engesa EE-9 Cascavel Mk.II"
 CYP_lt_equipment_5_short:0 "EE-9 Cascavel Mk.II"
 CYP_lt_equipment_5_desc:0 "L'EE-9 Cascavel est un véhicule blindé brésilien à six roues développé principalement pour la reconnaissance. Il a été conçu par Engesa en 1970 pour remplacer la flotte vieillissante de M8 Greyhounds du Brésil. Le véhicule fut d'abord équipé du canon principal de 37 mm du Greyhound, puis d'une tourelle française adoptée du Panhard AML-90."
