 gab.1.d:0 "Le 28 novembre 1967, quelques jours seulement après avoir prêté serment à l'ambassade du Gabon, M’ba est mort d’un cancer à Paris, où il était soigné depuis août de la même année. Il laisse derrière lui son épouse, Pauline M’ba, et ses onze enfants. Le lendemain de son décès, Bongo lui succède constitutionnellement en tant que président du Gabon."