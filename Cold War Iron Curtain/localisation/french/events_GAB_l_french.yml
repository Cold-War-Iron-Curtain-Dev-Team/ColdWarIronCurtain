 gab.1.d:0 "Le 28 novembre 1967, quelques jours seulement après avoir prêté serment présidentiel à l'ambassade du Gabon, M'ba meurt d'un cancer à Paris, où il était soigné depuis août de la même année. Il laisse dans le deuil son épouse, Pauline M'ba, et 11 enfants. Le lendemain de la mort de M'ba, Bongo lui succéda constitutionnellement à la présidence du Gabon."

