# === Dien Bien Response (merged from FRE_Dien_Bien_Response_l_english.yml) ===
 FRE_DBP_Standard_Hold_tt:0 "§YContrat de résultat - maintien standard§!\nEngagez §Y2 500 Main-d'oeuvre§! et perdez §R3 Metropole Patience§!. La garnison Tai reçoit un nombre limité de munitions et un modeste bonus de défense du camp.\n\n§GSi le camp reste hors des mains du Viet Minh jusqu'au jour de campagne 260§!: gagnez §G40 crédits de guerre§!, §G3 Patience Métropole§!et §G2% de soutien de guerre§! en plus du résultat de la campagne.\n\n§RSi le camp tombe§!: perdez §R3 000 effectifs§! et §R3% de soutien de guerre§! en plus du résultat de la campagne."
 FRE_DBP_Maximum_Reinforcement_tt:0 "§YContrat de résultat - renforcement maximum§!\nDépensez §Y100 crédits de guerre§!, engagez §Y6 000 main-d'oeuvre§!et perdez §R8 Patience Métropole§!. La réserve expéditionnaire renforce la garnison Tai, renforce le camp et retarde la dégradation du fort de §G14 jours de siège actif§!. Les délais de campagne des jours 150 et 260 ne bougent pas.\n\n§GSi le camp reste en dehors des mains du Viet Minh jusqu'au jour 260§!: gagnez §G100 crédits de guerre§!, §G8 Patience Métropole§!, §G2 000 points d'effectif§!et §G4% de soutien de guerre§!, avec un basculement de lutte supplémentaire vers la France.\n\n§RSi le camp tombe§!: perdez encore §R7 000 effectifs§!, §R2 000 équipements d'infanterie§!, §R250 équipements de soutien§!, §R125 équipements d'artillerie§!, §R10 Patience Métropole§!et §R5% de soutien de guerre§!."
 FRE_DBP_Condor_tt:0 "§YContrat de résultat - Opération Condor§!\nDépensez §Y70 crédits de guerre§!, engagez §Y3 500 points de main d'oeuvre§!et perdez §R5 Patience Métropole§!. Après que le Viet Minh ait investi la vallée, les forces alignées sur la France doivent regagner et tenir le camp, une approche nord ou est et une position du cercle extérieur pendant §Y7 jours consécutifs§!. L'ouverture de ce couloir soulage §G14 jours de siège investis§! et préserve une partie de la garnison.\n\n§GSi le couloir est ouvert et que le camp survit jusqu'au jour 260§!: gagnez §G80 crédits de guerre§!, §G6 Patience Métropole§!, §G2 500 points d'effectif§!et §G3% de soutien de guerre§!, avec un modeste basculement de lutte vers la France.\n\n§RSi le camp tombe avant l'ouverture du couloir§!: perdez §R5 000 effectifs supplémentaires§!, §R5 Patience Métropole§!et §R4% de soutien de guerre§!. Un couloir ouvert avant la chute finale réduit cette perte supplémentaire."
 FRE_DBP_Vulture_Request_tt:0 "§YContrat de résultat - demande Opération Vautour§!\nDépensez §Y40 crédits de guerre§! et perdez §R4 Metropole Patience§! pendant que Washington décide. L'approbation approvisionne la garnison, ajoute un soutien aérien américain au-dessus de la vallée et soulage §G10 jours de siège actif§!; le refus n'accorde aucune aide sur le champ de bataille. Une décision américaine ultérieure pourrait encore transformer un soutien limité en intervention directe.\n\n§GSi le soutien américain arrive et que le camp survit jusqu'au jour 260§!: gagnez §G75 crédits de guerre§!, §G5 Patience Métropole§!et §G3 % de soutien de guerre§!, avec une récompense de lutte pro-française.\n\n§RSi le camp tombe§!: perdez encore §R4 000 effectifs§!, §R6 Patience Métropole§!et §R4% de soutien de guerre§! en plus de l'escalade diplomatique déjà encourue."

 FRE_DBP_Standard_Holdout:0 "Pont aérien programmé à Dien Bien Phu"
 FRE_DBP_Standard_Holdout_desc:0 "Le camp tient à son implantation prévue, dépendant de la passerelle aérienne régulière et de la garnison déjà présente dans la vallée."
 FRE_DBP_Maximum_Holdout:0 "Renforcement maximal de Dien Bien Phu"
 FRE_DBP_Maximum_Holdout_desc:0 "La réserve expéditionnaire et la flotte de transport se sont engagées dans la vallée, renforçant les ouvrages tout en consommant des hommes, des avions et de la patience politique."
 FRE_DBP_Condor_Staging:0 "Opération Condor"
 FRE_DBP_Condor_Staging_desc:0 "Les colonnes de secours se rassemblent pour rouvrir les approches des hautes terres après que le Viet Minh ait fermé son cercle autour du camp."
 FRE_DBP_Vulture_Air_Support:0 "Opération Vulture Air Support"
 FRE_DBP_Vulture_Air_Support_desc:0 "Des avions américains frappent les lignes de siège et complètent le pont aérien. Leur intervention fait gagner du temps sans garantir la survie du camp."

# === Hoa Binh Response (merged from FRE_Hoa_Binh_Response_l_english.yml) ===
 FRE_Hoa_Binh_Amarante_tt:0 "§YContrat de résultat - retirer et préserver la force de terrain§!\nDépensez §Y30 crédits de guerre§! et engagez §Y1 500 main-d'oeuvre§! pour préparer le retrait.\n\nSi le CEFEO contrôle toujours §YHoa Binh§! au début de la journée de campagne §Y105§!, l'Opération Amarante concède délibérément l'objectif de campagne §YHoa Binh§!. Cela met fin à la campagne de Hoa Binh, §Yet non à la guerre d'Indochine au sens large§!. Les groupes mobiles retournent dans le Delta : récupérez §G1 500 Manpower§!, §G2 000 Equipment d'infanterie§!, §G250 Equipment de soutien§!, et §G100 Equipment d'artillerie§!; gagnez §G75 crédits de guerre§!; éviter la perte de résultat propre de §R12 Metropole Patience§!; désamorcer la lutte de §G25§!; et gagnez §G+10§! valeur de préparation à Na San.\n\nLe Viet Minh reçoit toujours son propre champ de bataille et son résultat de lutte à Hoa Binh. Si Hoa Binh tombe avant le jour §Y105§!, le retrait échoue et aucun de ces avantages de préservation n'est reçu."
 FRE_Hoa_Binh_Hold_tt:0 "§YContrat de résultat - conserver l'objectif et risquer la force de terrain§!\nDépensez §Y80 crédits de guerre§! et engagez §Y4 000 points de main d'oeuvre§! maintenant. Les défenseurs du CEFEO et de Muong fortifient §YHoa Binh§! jusqu'à la fin de la campagne. Il n'y a pas de retrait automatique.\n\n§GSi Hoa Binh reste aux mains des Français jusqu'au jour 210§!: l'offensive du Viet Minh échoue. En plus de la récompense de campagne normale, gagnez §G100 crédits de guerre§!, §G10 Patience Métropole§!et §G3 % de soutien de guerre§!; soustrayez §G25§! du score de lutte communiste et ajoutez §G25§! au score pro-français.\n\n§RSi Hoa Binh tombe§!: en plus de la perte normale de campagne, perdez §R3 000 effectifs§!, §R1 500 équipements d'infanterie§!, §R150 équipements de soutien§!, §R75 équipements d'artillerie§!, §R75 crédits de guerre§!, §R8 Patience métropolitaine§!et §R4 % de soutien de guerre§!; la lutte s'intensifie de §R50§!, le score communiste gagne §R25§!, et le score pro-français perd §R25§!."

 FRE_Hoa_Binh_Salient:0 "Le saillant de Hoa Binh"
 FRE_Hoa_Binh_Salient_desc:0 "Les colonnes aéroportées et fluviales ont établi le saillant, mais la Route 6 et la Rivière Noire transportent désormais tous les obus et rations à travers le pays attaqué. La position offre un avantage défensif modeste à un coût logistique croissant."
 FRE_Hoa_Binh_Holdout:0 "Refuge de Hoa Binh"
 FRE_Hoa_Binh_Holdout_desc:0 "Salan a rejeté un retrait prévu et a engagé les réserves à Hoa Binh. Le saillant dispose de plus d'armes, de munitions et d'infanterie, mais la ligne de ravitaillement exposée les consomme presque aussi vite qu'ils arrivent."

 FRE_Hoa_Binh_Mobile_Groups_Preserved:0 "Les groupes mobiles ont échappé à Hoa Binh et amélioreront la préparation §YNa San§! de §G10§!"

# === Northwest Response (merged from FRE_Northwest_Response_l_english.yml) ===
 FRE_Lorraine_Deep_Thrust_tt:0 "Dépensez §Y100 crédits de guerre§! et §R8 Metropole Patience§!. Cette poussée perturbe l'approvisionnement de campagne du Viet Minh et consomme §Y14 jours§! de son horloge de campagne. Tenez n'importe quelle province de §YDong Bac Bo§! pendant sept jours pour attaquer les dépôts arrière. Les colonnes subissent une pression d'approvisionnement supplémentaire jusqu'à la fin de la campagne du Nord-Ouest."
 FRE_Lorraine_Limited_Raid_tt:0 "Dépensez §Y60 crédits de guerre§!. Un court raid détruit une partie du ravitaillement de la campagne Viet Minh et consomme §Y7 jours§! de l'horloge de la campagne du Nord-Ouest, puis se retire sans objectif territorial profond."
 FRE_Lorraine_Withhold_tt:0 "Dépensez §Y30 crédits de guerre§! pour le ravitaillement des hautes terres et gardez les groupes mobiles concentrés autour de §YNa San§!. Les forces françaises et Tai reçoivent un esprit défensif jusqu'à la fin de la campagne du Nord-Ouest."
 FRE_Lorraine_No_Reserve_tt:0 "Le corps n'a pas les crédits nécessaires pour rassembler la Lorraine ou renforcer Na San. Les groupes mobiles restent en réserve sans avantage défensif supplémentaire."
 FRE_Lorraine_Planned_tt:0 "La contingence lorraine reste sur la carte de l'état-major. Salan le présentera automatiquement si le Viet Minh lance plus tard la campagne du Nord-Ouest."

 FRE_Lorraine_Deep_Columns:0 "Les colonnes étendues de Lorraine"
 FRE_Lorraine_Deep_Columns_desc:0 "Les groupes mobiles ont dépassé le delta en empruntant une seule route qui s'allonge. Le blindage et le transport donnent de la portée à la colonne, mais le carburant, les ponts et la marche du retour régissent désormais tout ce qu'elle peut faire."
 FRE_Northwest_Concentrated_Defence:0 "Groupes mobiles organisés à Na San"
 FRE_Northwest_Concentrated_Defence_desc:0 "Les formations affectées à la Lorraine ont été conservées autour des têtes aériennes des hauts plateaux, renforçant le système défensif au prix de laisser intacts les dépôts arrière du Viet Minh."
 VIN_Lorraine_Depots_Disrupted:0 "Lorraine dans les zones arrière"
 VIN_Lorraine_Depots_Disrupted_desc:0 "Des groupes mobiles et parachutistes français opèrent contre les dépôts derrière l'offensive du Nord-Ouest. Les magasins sont dispersés, les itinéraires réacheminés et les formations retardées pour sécuriser la zone de base."

 FRE_Lorraine_Response_Unlocked:0 "Le plan d'intervention §YOpération Lorraine§! est prêt"
 FRE_Lorraine_Response_Active:0 "§YL'Opération Lorraine§! soutient la campagne du Nord-Ouest"
 FRE_Lorraine_Response_Deep:0 "La Lorraine est devenue une poussée de Clear River de §Rde profondeur§!"
 FRE_Lorraine_Response_Limited:0 "Lorraine est un raid de dépôt limité à §Y§!"
 FRE_Lorraine_Response_Withheld:0 "Les groupes mobiles de Lorraine ont été retenus §Gpour Na San§!"
 FRE_Lorraine_Objective_Achieved:0 "Les dépôts arrière §Yde Clear River§! ont été détenus assez longtemps pour effectuer un raid"
 FRE_Lorraine_Result_Success:0 "§GL'opération Lorraine remporte un succès stratégique§!"
 FRE_Lorraine_Result_Limited:0 "§YL'opération Lorraine n'a réalisé qu'un raid tactique§!"
 FRE_Lorraine_Result_Failure:0 "§RL'opération Lorraine n'a pas réussi à modifier la campagne du Nord-Ouest§!"
 FRE_Lorraine_Result_Withheld:0 "§YLes formations lorraines retenues pour Na San§!"
 FRE_Lorraine_Result_Superseded:0 "L'opération Lorraine est dépassée de §gà la fin des combats§!"

