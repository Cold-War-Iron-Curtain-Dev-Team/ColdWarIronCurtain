 FRE_ECO_Armorin_Investigated_tt:0 "Débloque le focus sur la crise inflationniste de Piastre."
 FRE_ECO_Unlocks_Levees_tt:0 "Débloque les décisions relatives aux digues fluviales dans les États détenus : dépensez 50 millions de dollars pour ajouter un niveau d'infrastructure hydraulique après 90 jours."
 FRE_ECO_Unlocks_Metropole_Requests_tt:0 "Débloque les demandes d'allocations d'acier, de pétrole ou de caoutchouc adressées à la France pour une durée de 180 jours ; chaque demande coûte 50 points de pouvoir politique et 2 points de patience métropolitaine et nécessite la propriété de la région de Hanoi."
 FRE_ECO_Unlocks_Factory_Conversion_tt:0 "Débloque la décision dans les États détenus de remplacer une usine civile par une usine militaire après 30 jours, pour un coût de 25 points de pouvoir politique."
 FRE_ECO_Unlocks_Ethnostate_Investment_tt:0 "Débloque des investissements de 100 millions de dollars dans les territoires amis de Tai, Muong, Tho, Montagnard et Nung : leur capital gagne un niveau d'infrastructure, un emplacement de bâtiment et une usine civile, et leur opinion de nous s'améliore."
 FRE_ECO_Unlocks_VIE_Investment_tt:0 "Débloque des investissements de 200 millions de dollars dans l'État du Vietnam : un État central détenu et contrôlé par le Vietnam gagne un emplacement de bâtiment et une usine civile, et l'opinion de Saigon à notre égard s'améliore."
 FRE_ECO_Opium_Policy_Resented:0 "Ressentiment à l'égard de la politique française de l'opium"
 FRE_ECO_French_Investment:0 "Investissement français pour le développement"
