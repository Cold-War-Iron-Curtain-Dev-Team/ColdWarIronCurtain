# === Operation Pollux ===
 FRE_Operation_Pollux_Available_tt:0 "L'opération Pollux nécessite un camp établi aligné sur la France à §YDien Bien Phu§!, une §YTai Federation§!survivante, un théâtre d'Indochine actif et aucune offensive en direct de Dien Bien Phu ou autre opération CEFEO. Il devient historiquement disponible après le §Yle 22 novembre 1953§!."
 FRE_Pollux_Historical_tt:0 "§YÉvacuation fractionnée historique§!\nDépensez §Y30 crédits de guerre§! et §Y3 avions de transport§!et perdez §R2 Patience Métropole§!. L'opération Léda transporte les détachements réguliers vers Dien Bien Phu, mais les colonnes de partisans Tai marchent sans écran de couloir dédié.\n\nAprès §Y10 jours§!, les réguliers livrent §G500 équipements d'infanterie§! et §G75 équipements de soutien§! à la garnison du camp. La formation terrestre est enregistrée comme perdue : perte de §R2 000 hommes§!, §R1% de stabilité§!et §R2% de soutien de guerre§!, avec un modeste basculement de lutte vers le Viet Minh."
 FRE_Pollux_Escort_tt:0 "§YRetrait de la Route Accompagnée Pavie§!\nDépensez §Y80 crédits de guerre§!, engagez §Y2 000 main-d'oeuvre§!et perdez §R5 Patience Métropole§!. Gardez le contrôle français de §YLai Chau§!, de l'approche §YRoute Pavie§!et du §Ycamp de Dien Bien Phu§! pendant §Y7 jours consécutifs§! à l'intérieur du §YFenêtre d'évacuation de 21 jours§!. Un contrôle de couloir brisé réinitialise le décompte.\n\n§GSuccès§!: récupérez les effectifs engagés, déployez un groupe de survivants supplémentaire dans le camp, livrez du matériel d'infanterie, de soutien et d'artillerie et gagnez §G15 Expérience militaire§!.\n\n§RÉchec§!: perdre encore §R3 000 effectifs§!, §R4 Patience Métropole§!, §R1% de stabilité§!et §R2% de soutien de guerre§!."
 FRE_Pollux_Airlift_tt:0 "§YOpération Léda élargie§!\nDépensez §Y120 crédits de guerre§! et §Y8 avions de transport§!et perdez §R7 Patience Métropole§!. Maintenir le camp §YDien Bien Phu§! sous contrôle aligné sur la France pendant §Y7 jours consécutifs§! à l'intérieur de la fenêtre d'évacuation §Yde 21 jours§!; le couloir terrestre n'est pas nécessaire.\n\n§GSuccès§!: déployez un groupe de survivants supplémentaire dans le camp, livrez du matériel d'infanterie, de soutien et d'artillerie et gagnez §G15 Expérience militaire§!.\n\n§RÉchec§!: perte de §R1 500 effectifs§!, §R1 % de stabilité§!et §R2 % de soutien de guerre§! en plus du coût aérien et politique déjà payé."
 FRE_Pollux_Unfunded_tt:0 "Lai Chau est abandonnée sans pont aérien organisé ni couloir protégé. La formation partisane est perdue avant d'atteindre Dien Bien Phu."

 FRE_Mission_Operation_Pollux:0 "Opération Pollux : évacuer Lai Chau"
 FRE_Mission_Operation_Pollux_desc:0 "Terminez le plan d'évacuation sélectionné avant la fermeture de la fenêtre de vingt et un jours. Un retrait accompagné nécessite sept jours consécutifs de contrôle depuis Lai Chau via la route Pavie jusqu'à Dien Bien Phu. Le pont aérien élargi nécessite sept jours consécutifs de contrôle au camp."
 FRE_Mission_Operation_Pollux_Available_tt:0 "L'ordre d'évacuation est déjà actif. Sécurisez l'itinéraire sélectionné jusqu'à ce que la force de Lai Chau atteigne Dien Bien Phu."

 FRE_Operation_Pollux_Launched:0 "§YOpération Pollux ordonnée§!"
 FRE_Mission_Operation_Pollux_Activated:0 "§ROpération Pollux : active§!"
 FRE_Mission_Operation_Pollux_Completed:0 "§GOpération Pollux : Force préservée§!"
 FRE_Mission_Operation_Pollux_Failed:0 "§ROpération Pollux : colonne perdue§!"
 FRE_Operation_Cooldown_Pollux:0 "§ROpération Pollux : terminée§!"
 FRE_Operation_Pollux_Result_Preserved:0 "§GLa force de Lai Chau atteint Dien Bien Phu intacte§!"
 FRE_Operation_Pollux_Result_Column_Loss:0 "§RLa colonne Lai Chau a été perdue lors de la retraite§!"
 FRE_Operation_Pollux_Result_Superseded:0 "L'opération Pollux a été dépassée de §gpar la bataille plus large§!"
 FRE_Pollux_Garrison_Reinforced:0 "§GLe groupe de survivants de Lai Chau renforce Dien Bien Phu§!"

# === Operation Atlante ===
 FRE_Operation_Atlante_Available_tt:0 "L'opération Atlante impose à l'État du Vietnam et au Viet Minh du sud de rester en guerre sur un théâtre d'Indochine actif. Elle devient historiquement disponible après le §Y14 janvier 1954§! et ne peut démarrer tant qu'une autre opération CEFEO est active."
 FRE_Atlante_Full_tt:0 "§YEngager le CEFEO dans l'Opération Atlante§!\nDépensez §Y100 crédits de guerre§!, engagez §Y4 500 main-d'oeuvre§!et perdez §R7 Patience Métropole§!. Les forces de l'IA française et vietnamienne se concentreront contre §YInterzone V§!. Maintenir les deux objectifs opérationnels dans la base sud du Viet Minh pendant §Y14 jours consécutifs§! dans une fenêtre §Yde 90 jours§!. Perdre l'un ou l'autre objectif réinitialise le décompte.\n\nCet engagement envoie la réserve expéditionnaire au centre du Vietnam. Si Dien Bien Phu ouvre, §Rle renfort maximum et l'Opération Condor seront indisponibles§!; la soutenance programmée et un appel pour l'Opération Vautour restent possibles.\n\n§GSuccès§!: gagnez §G20 Expérience militaire§!, renforcez la confiance de Saigon et déplacez la lutte vers la France.\n\n§RÉchec§!: perte supplémentaire de §R3 000 effectifs§!, §R5 Patience Métropole§!et §R2% de soutien de guerre§!, avec un basculement de lutte vers le Viet Minh."
 FRE_Atlante_Vietnamese_tt:0 "§YPlacer l'Armée nationale vietnamienne en tête§!\nDépensez §Y40 crédits de guerre§! et perdez §R2 Metropole Patience§! en livrant des fusils et du matériel de soutien à Saigon. L'Armée nationale vietnamienne doit maintenir l'objectif côtier dans §YInterzone V§! pendant §Y14 jours consécutifs§! dans une fenêtre §Yde 90 jours§!. Le perdre réinitialise le décompte.\n\nLe CEFEO conserve sa réserve nord, le menu complet de la réponse de Dien Bien Phu reste donc disponible.\n\n§GSuccès§!: gagnez §G10 Expérience militaire§!, renforcez l'autorité de Saigon et réalisez un modeste gain de lutte.\n\n§RÉchec§!: l'Armée nationale vietnamienne perd §R1 500 effectifs§! et §R2% de soutien de guerre§!, tandis que le CEFEO perd §R2% de soutien de guerre§!."
 FRE_Atlante_North_tt:0 "§YRéduisez l'Atlante et renforcez le Tonkin§!\nDépensez §Y40 crédits de guerre§!, engagez §Y2 500 points de main d'oeuvre§!et perdez §R3 Patience Métropole§! pour constituer une réserve nord. Aucun objectif du centre du Vietnam ne sera tenté.\n\nLorsque la campagne de Dien Bien Phu s'ouvre, la réserve livre §G1 000 équipements d'infanterie§!, §G100 équipements de soutien§!et §G50 équipements d'artillerie§! à la garnison du camp et retarde la dégradation du fort scénarisée par §G10 jours de siège actif§!. Les délais fixes de campagne au jour 150 et au jour 260 ne bougent pas."
 FRE_Atlante_Unfunded_tt:0 "L'offensive centrale est rayée du calendrier opérationnel. Aucune réserve du Nord n'est constituée et le plan abandonné est considéré comme un revers politique et de lutte mineur."

 FRE_Mission_Operation_Atlante:0 "Opération Atlante : Interzone V"
 FRE_Mission_Operation_Atlante_desc:0 "Sécurisez l'objectif sélectionné dans la base sud du Viet Minh pendant quatorze jours consécutifs avant la fermeture de la fenêtre opérationnelle de quatre-vingt-dix jours. Un engagement total du CEFEO requiert les deux objectifs ; une opération dirigée par les Vietnamiens nécessite un hébergement côtier."
 FRE_Mission_Operation_Atlante_Available_tt:0 "L'ordre offensif est déjà actif. Sécurisez et conservez les objectifs jusqu'à ce que la consolidation de quatorze jours soit terminée."

 FRE_Operation_Atlante_Launched:0 "§YOpération Atlante ordonnée§!"
 FRE_Mission_Operation_Atlante_Activated:0 "§ROpération Atlante : active§!"
 FRE_Atlante_Offensive_Active:0 "§RL'opération Atlante est en cours§!"
 FRE_Mission_Operation_Atlante_Completed:0 "§GOpération Atlante : objectif consolidé§!"
 FRE_Mission_Operation_Atlante_Failed:0 "§ROpération Atlante : l'offensive au point mort§!"
 FRE_Operation_Cooldown_Atlante:0 "§ROpération Atlante : terminée§!"
 FRE_Operation_Atlante_Result_Central_Success:0 "§GLe CEFEO a percé la base Interzone V§!"
 FRE_Operation_Atlante_Result_Vietnamese_Foothold:0 "§GL'Armée nationale vietnamienne a assuré un pied-à-terre sur la côte§!"
 FRE_Operation_Atlante_Result_Stalled:0 "§RL'offensive centrale au point mort§!"
 FRE_Operation_Atlante_Result_Northern_Priority:0 "§YLa réserve expéditionnaire est envoyée vers le nord§!"
 FRE_Operation_Atlante_Result_Superseded:0 "L'opération Atlante a été dépassée de §gpar la colonie plus large§!"
 FRE_Atlante_Strategy_Central_Commitment:0 "§YLa réserve expéditionnaire s'engage au centre du Vietnam§!"
 FRE_Atlante_Strategy_Vietnamese_Lead:0 "§YL'Armée nationale vietnamienne à la tête d'Atlante§!"
 FRE_Atlante_Strategy_Northern_Priority:0 "§YLe Tonkin a la priorité sur l'Atlante§!"
 FRE_Atlante_Northern_Reserve_Available:0 "§GUne réserve nordique se rassemble§!"
 FRE_Atlante_Northern_Reserve_Committed:0 "§GLa réserve Atlante renforce Dien Bien Phu§!"

# === CEFEO (merged from FRE_CEFEO_l_english.yml) ===
##### CEFEO (FRE) rework: Metropole Patience, lifeline, battles, wind-down #####

#### National spirits ####
 FRE_Expeditionary_Command:0 "Commandement expéditionnaire"
 FRE_Expeditionary_Command_desc:0 "Le CEFEO n'est pas un État. C'est une armée avec un port, un quartier général et une ligne budgétaire à Paris. Il répond à la rue Saint-Dominique et non à aucun électorat.\n\n§YMétropole Patience§!: §Y[?FRE.FRE_Metropole_Patience|0]§!/100 - [GetFREMetropolePatience]"
 FRE_Under_Metropole_Command:0 "Sous commandement de la Métropole"
 FRE_Under_Metropole_Command_desc:0 "Le corps commande en son propre nom les domaines de la couronne du nord : la Fédération Tai, les Muong, les Nung et les Tho répondent tous à Saigon plutôt qu'à la rue Saint-Dominique. Il s'agit là d'une commodité d'administration et non d'un gage d'indépendance.\n\nLe général commande sur le terrain. L'Assemblée est propriétaire de la guerre, décide de son coût et peut y mettre fin en un après-midi.\n\n§YMétropole Patience§!: §Y[?FRE.FRE_Metropole_Patience|0]§!/100 - [GetFREMetropolePatience]"
 FRE_Metropole_Command:0 "Commandement expéditionnaire"
 FRE_Indochina_War_Credits:0 "Crédits de la guerre d'Indochine"
 FRE_Indochina_War_Credits_desc:0 "L'Assemblée vote la ligne Indochine séparément du budget de la défense, et elle est votée chaque année. Tant qu'il passe, le corps peut se doter de ses propres effectifs, courtiser les montagnards et acheter sa propre guerre.\n\n§YCrédits de guerre§!: §Y[?FRE.FRE_War_Credits|0]§!"
 FRE_Metropole_Subsidies_Full:0 "Subventions Métropole (Complète)"
 FRE_Metropole_Subsidies_Full_desc:0 "L'Assemblée nationale vote toujours les crédits. Les piastres coulent, les convois naviguent et la guerre peut être menée.\n\n§YMétropole Patience§!: §Y[?FRE.FRE_Metropole_Patience|0]§!/100 - [GetFREMetropolePatience]"
 FRE_Metropole_Subsidies_Reduced:0 "Subventions Métropole (Réduites)"
 FRE_Metropole_Subsidies_Reduced_desc:0 "Les crédits sont adoptés en commission avec des amendements maintenant. Chaque réquisition est remise en question ; chaque perte est comptée deux fois.\n\n§YMétropole Patience§!: §Y[?FRE.FRE_Metropole_Patience|0]§!/100 - [GetFREMetropolePatience]"
 FRE_Metropole_Subsidies_Cut:0 "Subventions de la Métropole (coupées)"
 FRE_Metropole_Subsidies_Cut_desc:0 "Paris a arrêté de payer la victoire et a commencé à payer la sortie. Le corps vit de ses stocks.\n\n§YMétropole Patience§!: §Y[?FRE.FRE_Metropole_Patience|0]§!/100 - [GetFREMetropolePatience]"
 FRE_Operation_Overextension:0 "Surextension opérationnelle grave"
 FRE_Operation_Overextension_desc:0 "Les colonnes ont laissé derrière elles l'objectif annoncé de l'opération et ont transformé une action limitée en une offensive générale. Retirez-vous du sol Viet Minh en dehors de l'enveloppe opérationnelle pour supprimer cette sévère pénalité."
 FRE_Highland_Overextension:0 "Commandement de la campagne des Highlands"
 FRE_Highland_Overextension_desc:0 "La campagne est décidée par son objectif opérationnel annoncé plutôt que par la reddition d'un petit conseil territorial. Le CEFEO et les domaines de la couronne restent sur le terrain jusqu'à ce que cet objectif soit résolu."
 FRE_Campaign_Overextension:0 "Surextension opérationnelle grave"
 FRE_Campaign_Overextension_desc:0 "La poursuite a porté le CEFEO au-delà de la position défendue des hauts plateaux et dans les zones arrière du Viet Minh. Les routes se terminent, les garnisons se multiplient et chaque bataillon envoyé en avant laisse derrière lui un poste exposé.\n\nRetirez-vous des zones arrière du Viet Minh pour supprimer cette sévère pénalité."
 FRE_Command_Carpentier:0 "Commandement de Carpentier"
 FRE_Command_Carpentier_desc:0 "Le général Carpentier administre la guerre avec compétence et sans imagination. L'initiative appartient à l'ennemi."
 FRE_Command_De_Lattre:0 "Le commandement de De Lattre"
 FRE_Command_De_Lattre_desc:0 "Le Roi Jean a pris le théâtre en main. Les plans d'évacuation sont brûlés, les personnes à charge restent à Hanoï et le corps se souvient comment gagner."
 FRE_Command_Salan:0 "Commandement de Salan"
 FRE_Command_Salan_desc:0 "Salan le Mandarin connaît l'Indochine mieux que n'importe quel officier de l'armée et lui fait moins confiance. Une gestion prudente, rusée et mal-aimée."
 FRE_Command_Navarre:0 "Commandement de Navarre"
 FRE_Command_Navarre_desc:0 "Le général Navarre arrive avec un plan et un délai. Le corps cherchera sa bataille décisive avant que Paris ne perde patience."

#### Shared tooltips ####
 FRE_Patience_Change_tt:0 "§YMétropole Patience§! [?fre_patience_delta|+0] (actuellement §Y[?FRE.FRE_Metropole_Patience|0]§!/100 - [GetFREMetropolePatience])"
 FRE_Patience_Readout_tt:0 "§YMétropole Patience§!: §Y[?FRE.FRE_Metropole_Patience|0]§!/100 - [GetFREMetropolePatience]"
 FRE_War_Credits_Change_tt:0 "§YCrédits de guerre§! [?fre_credit_amount|+0] (maintenant §Y[?FRE.FRE_War_Credits|0]§!)"
 FRE_War_Credits_Readout_tt:0 "§YCrédits de guerre§!: §Y[?FRE.FRE_War_Credits|0]§!"
 FRE_Request_Extraordinary_Credits:0 "Demander des crédits extraordinaires"
 FRE_Request_Extraordinary_Credits_desc:0 "Renvoyez le commissaire général au Palais Bourbon hors saison, chapeau à la main, pour demander un vote supplémentaire. L'argent viendra. Les questions aussi."
 FRE_Request_Extraordinary_Credits_tt:0 "Gagnez §G80§! §YCrédits de guerre§!, au prix de §R6§! §YPatience Métropole§! et §R25§! pouvoir politique à Paris"
 FRE_Fund_Metropole_Information_Service:0 "Financer le Service d'information de Métropole"
 FRE_Fund_Metropole_Information_Service_desc:0 "Consacrer une partie du budget du théâtre aux briefings, aux actualités et aux tournées des députés dans les provinces pacifiées. Cela ne rapporte rien à Paris sur le champ de bataille, mais cela fait gagner du temps au corps."
 FRE_Fund_Metropole_Information_Service_tt:0 "Dépensez §R150§! §YCrédits de guerre§! pour gagner §G8§! §YPatience Métropole§!"
 FRE_PATIENCE_BAND_FULL:0 "§GParis vote toujours le générique§!"
 FRE_PATIENCE_BAND_REDUCED:0 "§YParis modifie chaque réquisition§!"
 FRE_PATIENCE_BAND_CUT:0 "§RParis paie sa sortie§!"
 FRE_PATIENCE_BAND_EXHAUSTED:0 "§RParis a radié le corps§!"
 FRE_VNA_Coordination_tt:0 "Les missions CEFEO bénéficient d'une chance de réussite permanente de §G+10%§! grâce à la coordination de l'Armée nationale vietnamienne"
 FRE_GCMA_Network_Grows_tt:0 "Le réseau §YGCMA§! croît de §G1§! niveau (chaque niveau : §G+3%§! chance de réussite de la mission)"
 FRE_Appeal_To_Paris_Press_tt:0 "Une campagne de presse sympathique à Paris : §G60%§! chance de gagner §G10§! Patience, §R40%§! chance de perdre §R8§! Patience et embarrasser le gouvernement"
 FRE_Legion_Reinforcements_tt:0 "Une nouvelle formation §YLégion étrangère§! atterrit à Haïphong"
 FRE_Dinassaut_Flotilla_tt:0 "Les flottilles fluviales §YDinassaut§! sont mises en service : les opérations fluviales ne nécessitent plus de flotte hauturière"
 FRE_DBP_Vulture_Approved_tt:0 "La puissance aérienne américaine pèsera plus de §YDien Bien Phu§!"
 FRE_De_Lattre_Leads_tt:0 "§YLe général de Lattre de Tassigny§! prend le commandement du théâtre (succès mission §G+10%§!)"
 FRE_Salan_Leads_tt:0 "§YLe général Salan§! prend le commandement (succès de la mission §G+7%§!)"
 FRE_Navarre_Leads_tt:0 "§YLe général Navarre§! prend le commandement (succès de la mission §G+8%§!)"

#### Decision categories ####
 FRE_Metropole_Support_category:0 "La bouée de sauvetage de la Métropole"
 FRE_Metropole_Support_category_desc:0 "Le CEFEO ne produit rien : chaque fusil, chaque homme et chaque piastre vient de France. Demandez - poliment et pas trop souvent."
 FRE_Indochina_Allies_category:0 "Frères d'armes"
 FRE_Indochina_Allies_category_desc:0 "Coordination avec l'État du Vietnam, les peuples des hauts plateaux et alliés généraux en Indochine."

#### Metropole lifeline decisions ####
 FRE_Request_Equipment_Convoy:0 "Demander un convoi d'équipement"
 FRE_Request_Equipment_Convoy_desc:0 "Câblez Paris pour un convoi de matériel hors de Marseille : armes légères, munitions et les mille choses ennuyeuses qu'une armée mange."
 FRE_Request_Reinforcements:0 "Demander des renforts"
 FRE_Request_Reinforcements_desc:0 "Demandez à la Métropole des recrutements d'hommes - et, si l'Assemblée peut le supporter, une autre formation de Légion."
 FRE_Request_Air_Assets:0 "Demander des ressources aériennes"
 FRE_Request_Air_Assets_desc:0 "Cette guerre se déroule sur des avions de transport comme les autres guerres se déroulent sur le rail. Demandez des Dakotas, et encore des Dakotas."
 FRE_Request_Naval_Assets:0 "Demandez les flottilles Dinassaut"
 FRE_Request_Naval_Assets_desc:0 "Barges blindées, LCVP et canonnières pour les fleuves du Tonkin et de la Cochinchine. Le delta appartient à celui qui possède l'eau."
 FRE_Request_Artillery_Park:0 "Demander un parc d'artillerie"
 FRE_Request_Artillery_Park_desc:0 "Demandez des tubes à Paris. Chaque poste envahi par le Viet Minh est celui où il n'y avait pas d'armes à feu à portée, et le corps n'en a jamais eu assez."
 FRE_Request_Antitank_Antiair:0 "Demander des canons antichar et antiaériens"
 FRE_Request_Antitank_Antiair_desc:0 "Hanoï veut des canons à tir direct pour les blockhaus et de la DCA légère pour les aérodromes. Giap n'a pas encore de chars ni d'avions - mais il a des amis chinois qui en ont."
 FRE_Request_Fuel_Allocation:0 "Demander une allocation de carburant"
 FRE_Request_Fuel_Allocation_desc:0 "Les Dakota, les Dinassauts et les Groupements Mobiles s'abreuvent aux mêmes réservoirs à Haïphong. Demandez une plus grande part de l'allocation nationale."
 FRE_Request_Treasury_Advance:0 "Demander une avance du Trésor"
 FRE_Request_Treasury_Advance_desc:0 "Rendez-vous à l'Assemblée pour un vote supplémentaire en espèces hors tour. Les Piastres paient les auxiliaires, les porteurs et les informateurs, et aucun d'eux n'attend le budget du printemps."
 FRE_Treasury_Advance_Fallback_tt:0 "Plus de Métropole à demander : la trésorerie du théâtre rassemble ce qu'elle peut."
 FRE_Request_Administrative_Support:0 "Demander un soutien administratif"
 FRE_Request_Administrative_Support_desc:0 "Demandez à Paris des administrateurs, des magistrats et des payeurs. Les guerres se déroulent également sur papier."
 FRE_Appeal_To_Paris_Press:0 "Appel à la presse parisienne"
 FRE_Appeal_To_Paris_Press_desc:0 "Envoyez une poignée de rédacteurs sympathisants à Hanoï et montrez-leur la guerre que nous aimerions qu'ils voient. Risqué : les journalistes ont un moyen de trouver l'autre."
 FRE_Dissolve_The_CEFEO:0 "Dissoudre le CEFEO"
 FRE_Dissolve_The_CEFEO_desc:0 "Frappez les couleurs. Remettez le théâtre aux Vietnamiens, embarquez les corps et clôturez le grand livre de la guerre française en Indochine."

#### Allied coordination decisions ####
 FRE_Train_Vietnamese_National_Army:0 "Former l'armée nationale vietnamienne"
 FRE_Train_Vietnamese_National_Army_desc:0 "Détachez les instructeurs et ouvrez les dépôts aux nouveaux bataillons de Saigon. Le jaunissement en pratique."
 FRE_GCMA_Recruit_TAM:0 "Élever des maquis dans les hauts plateaux du Centre"
 FRE_GCMA_Recruit_TAM_desc:0 "Étendre le réseau GCMA auprès des montagnards des Tay Nguyen."
 FRE_GCMA_Recruit_TAI:0 "Élever des maquis en pays Tai"
 FRE_GCMA_Recruit_TAI_desc:0 "Les soldats des collines de la Fédération Tai connaissent tous les sentiers autour de Dien Bien Phu. Armez-les."
 FRE_GCMA_Recruit_NUN:0 "Élever des maquis parmi les Nung"
 FRE_GCMA_Recruit_NUN_desc:0 "Les Nung des hauts plateaux côtiers combattent aux côtés de la France depuis une génération. Étendre le réseau."
 FRE_GCMA_Recruit_THO:0 "Élever des maquis parmi les Tho"
 FRE_GCMA_Recruit_THO_desc:0 "Le pays Tho se situe à cheval sur les couloirs d'approvisionnement du Viet Minh vers la Chine. Les partisans là-bas valent des bataillons ailleurs."

#### De Lattre Line decisions ####
 FRE_Fortify_Delta_1:0 "Inauguration de la ligne De Lattre"
 FRE_Fortify_Delta_1_desc:0 "Des blockhaus en béton dans une ceinture autour de Hanoï et du bassin de riz du delta. Le Maréchal en veut douze cents."
 FRE_Fortify_Delta_2:0 "Prolonger la ligne jusqu'à la côte"
 FRE_Fortify_Delta_2_desc:0 "Poussez la ceinture de bunkers vers la mer à Haiphong afin que le port de secours du corps se trouve derrière le béton."
 FRE_Fortify_Delta_3:0 "Complétez la ligne De Lattre"
 FRE_Fortify_Delta_3_desc:0 "Comblez les dernières lacunes. Derrière cette ligne, le delta nourrit et abrite le corps ; devant lui, l'ennemi doit payer pour être vu."

 FRE_Geneva_Pursuit_tt:0 "Paris s'engage en faveur d'un règlement négocié. Les combats §Ydoivent se calmer§! avant que quiconque puisse s'asseoir : la lutte se désintensifie chaque mois jusqu'à ce qu'elle atteigne §YBasse tension§!, et la conférence se réunit automatiquement une fois qu'elle le fait"

#### Operation commitment tooltips (FRE_Ops namespace) ####
 FRE_Ops_Commit_Light_tt:0 "§YEngagement léger§! - coûte §Y[?FRE.FRE_op_price_light|0]§! Crédits de guerre.\nUn groupement mobile assure l'opération."
