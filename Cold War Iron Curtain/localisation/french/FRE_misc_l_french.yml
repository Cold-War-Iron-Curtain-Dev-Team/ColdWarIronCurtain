 FRE_ECO_Dislocation:0 "Dislocation économique d'après-guerre"
 FRE_ECO_Dislocation_desc:0 "Les liaisons de transport interrompues et les ateliers épuisés laissent une grande partie du territoire incapable de répondre aux besoins civils ordinaires. Les pénuries interrompent la production et la réparation des routes rivalise avec la lutte quotidienne pour alimenter les marchés.\n\nÉtape de récupération : §Y[?FRE_eco_dislocation_tier|0]§! sur 5"
 FRE_ECO_Growth:0 "Croissance économique d'après-guerre"
 FRE_ECO_Growth_desc:0 "La reprise du commerce extérieur a donné aux ateliers des acheteurs fiables et une raison de se développer. La production des usines et la construction augmentent au-delà du simple travail de remplacement des pertes de guerre."
 FRE_ECO_Piastre_Inflation_Crisis:0 "Crise inflationniste de Piastre"
 FRE_ECO_Piastre_Inflation_Crisis_desc:0 "Les commerçants révisent leurs prix tandis que le Trésor peine à contenir le trafic des changes. La demande civile pèse sur l'économie, la production industrielle en souffre et chaque conflit salarial affaiblit l'administration.\n\nÉtape de stabilisation : §Y[?FRE_eco_piastre_tier|0]§! sur 5. L'amélioration au-delà de l'étape 5 met fin à la crise."
 FRE_ECO_Metropolitan_Dependency:0 "Dépendance économique métropolitaine"
 FRE_ECO_Metropolitan_Dependency_desc:0 "Le développement local dépend des fournisseurs et du crédit métropolitains. Les nouvelles usines mettent du temps à s'implanter, la production de ressources est insuffisante et les partenaires commerciaux ne voient pas l'intérêt de traiter avec une économie qui ne peut pas agir par elle-même.\n\nÉtape d'autonomie : §Y[?FRE_eco_dependency_tier|0]§! sur 5"
 FRE_ECO_Industrial_Infancy:0 "Enfance d'une industrie d'extrême-Orient"
 FRE_ECO_Industrial_Infancy_desc:0 "Le programme civil de Bourgoin a donné un début à l'industrie locale. Les entreprises fragiles ont encore du mal à s'approvisionner, mais chaque étape de croissance accélère la construction civile et rend les usines plus productives.\n\nStade industriel : §Y[?FRE_eco_dependency_tier|0]§! sur 5"
 FRE_ECO_Exploitative_Economy:0 "Économie de guerre exploitante"
 FRE_ECO_Exploitative_Economy_desc:0 "Les ressources de l'Indochine sont orientées vers les besoins français, les ressources et la production militaire gagnant un rendement privilégié. Les recettes sont lucratives, mais les allocations freinent la construction de nouvelles usines.\n\nÉtape : §Y[?FRE_eco_exploitation_tier|0]§! sur 4"

 FRE_ECO_Dislocation_improve_tt:0 "§GLa dislocation économique d'après-guerre§! s'améliore d'un niveau."
 FRE_ECO_Dislocation_worsen_tt:0 "§RLa perturbation économique d'après-guerre§! s'aggrave d'un niveau."
 FRE_ECO_Dislocation_to_growth_tt:0 "§YLa dislocation économique d'après-guerre§! est remplacée par §GCroissance économique d'après-guerre§!."
 FRE_ECO_Piastre_start_tt:0 "Gagnez §RPiastre Inflation Crise§! au stade §Y2§! sur 5."
 FRE_ECO_Piastre_improve_tt:0 "§GLa crise d'inflation de Piastre§! s'améliore d'un niveau."
 FRE_ECO_Piastre_worsen_tt:0 "§RLa crise inflationniste Piastre§! s'aggrave d'un niveau."
 FRE_ECO_Dependency_improve_tt:0 "§GLa dépendance économique métropolitaine§! (ou §GEnfance d'une industrie d'extrême-Orient§!) s'améliore d'un niveau."
 FRE_ECO_Dependency_worsen_tt:0 "§RLa dépendance économique métropolitaine§! (ou §REnfance d'une industrie d'extrême-Orient§!) s'aggrave d'un niveau."
 FRE_ECO_Dependency_to_infancy_tt:0 "§YLa Dépendance Économique Métropolitaine§! devient §GEnfance d'une Industrie Extrême-Orient§! au même stade."
 FRE_ECO_Exploitation_start_tt:0 "Gagnez §YÉconomie de guerre exploitante§! au stade §Y1§! sur 4 : la construction d'usines s'arrête presque, les ressources et les revenus militaires augmentent."
 FRE_ECO_Exploitation_improve_tt:0 "§GL'économie de guerre exploitante§! s'atténue d'un niveau."
 FRE_ECO_Infant_Illness_Prevention:0 "Programme de santé infantile de Hanoï"
 FRE_ECO_Infant_Illness_Prevention_desc:0 "Des services hospitaliers étendus et des fournitures médicales plus fiables aident les enfants à survivre à des maladies qui n'étaient autrefois pas traitées. La croissance démographique s'améliore, renforçant la base de main-d'oeuvre à long terme du territoire."
 FRE_ECO_CEFEO_Pay_Raise:0 "Augmentation de la rémunération du CEFEO"
 FRE_ECO_CEFEO_Pay_Raise_desc:0 "Les salaires révisés du CEFEO font du service un moyen de subsistance plus attractif. Les agents recruteurs peuvent offrir une meilleure rémunération aux hommes qui envisagent de s'enrôler."
