 FRE_Indochina_Economy_category:0 "L'économie indochinoise"
 FRE_Indochina_Economy_category_desc:0 "Le corps partage les routes, la main-d'oeuvre et le ravitaillement avec les personnes dont il détient le territoire. Allouez de l'argent aux travaux provinciaux, négociez les expéditions métropolitaines et décidez quelle capacité civile la guerre peut se permettre de laisser seule."
 FRE_ECO_Build_River_Levees:0 "Construire des digues fluviales"
 FRE_ECO_Build_River_Levees_desc:0 "Dépensez 50 millions de dollars en travaux de remblais dans l'État sélectionné. Après 90 jours, les digues achevées ajoutent un niveau d'infrastructure hydraulique."
 FRE_ECO_Request_Metropole_Steel:0 "Demander de l'acier depuis la France"
 FRE_ECO_Request_Metropole_Steel_desc:0 "Obtenir une allocation d'acier française fournissant 12 aciers dans la région de Hanoï pendant 180 jours. La requête coûte 50 points de pouvoir politique et 2 points de Patience Métropole."
 FRE_ECO_Request_Metropole_Oil:0 "Demander du pétrole à la France"
 FRE_ECO_Request_Metropole_Oil_desc:0 "Organiser une expédition de pétrole français fournissant 10 pétroles dans la région de Hanoï pendant 180 jours. La requête coûte 50 points de pouvoir politique et 2 points de Patience Métropole."
 FRE_ECO_Request_Metropole_Rubber:0 "Demander du caoutchouc depuis la France"
 FRE_ECO_Request_Metropole_Rubber_desc:0 "Obtenir une allocation métropolitaine fournissant 8 caoutchoucs dans la région de Hanoi pendant 180 jours. La requête coûte 50 points de pouvoir politique et 2 points de Patience Métropole."
 FRE_ECO_Convert_Civilian_Factory:0 "Convertir une usine civile"
 FRE_ECO_Convert_Civilian_Factory_desc:0 "Dépensez 25 points de pouvoir politique pour retirer une usine civile de l'État sélectionné et préparer ses locaux aux commandes militaires. Une usine militaire y devient disponible au bout de 30 jours."
 FRE_ECO_Invest_In_Ethnostate:0 "Financer le développement territorial"
 FRE_ECO_Invest_In_Ethnostate_desc:0 "Investissez 100 millions de dollars dans le territoire amical sélectionné de Tai, Muong, Tho, Montagnard ou Nung. Sa capitale gagne un niveau d'infrastructure, un emplacement de bâtiment et une usine civile ; son gouvernement acquiert à notre égard une opinion plus favorable."
 FRE_ECO_Invest_In_VIE:0 "Investir dans l'État du Vietnam"
 FRE_ECO_Invest_In_VIE_desc:0 "Investir 200 millions de dollars dans un État central détenu et contrôlé par l'État du Vietnam, en favorisant la région de Saigon lorsqu'elle est disponible. L'État sélectionné gagne un emplacement de bâtiment et une usine civile, améliorant ainsi l'opinion que Saigon a de nous."
