 IRQ_heavy_fighter_equipment_3_short:0 "Mosquito F Mk.II" 

 IRQ_jet_interceptor_equipment_3:0 "Mikoyan-Gourevitch MiG-17PF"
 IRQ_jet_interceptor_equipment_3_short:0 "MiG-17PF"
 IRQ_jet_interceptor_equipment_3_desc:0 "Version chasseur-intercepteur tout temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F"
 #IRQ_jet_interceptor_equipment_4:0 ""
 #IRQ_jet_interceptor_equipment_4_short:0 ""
 #IRQ_jet_interceptor_equipment_4_desc:0 ""
 #IRQ_jet_interceptor_equipment_5:0 ""
 #IRQ_jet_interceptor_equipment_5_short:0 ""
 #IRQ_jet_interceptor_equipment_5_desc:0 ""
 #IRQ_jet_interceptor_equipment_6:0 ""
 #IRQ_jet_interceptor_equipment_6_short:0 ""
 #IRQ_jet_interceptor_equipment_6_desc:0 ""
 IRQ_jet_interceptor_equipment_7:0 "Mikoyan-Gourevitch MiG-25P"
 IRQ_jet_interceptor_equipment_7_short:0 "MiG-25P"
 IRQ_jet_interceptor_equipment_7_desc:0 "Le Mikoyan-Gurevich MiG-25 Foxbat est peut-être l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 a pris son envol au début de 1964 et est officiellement entré en service en 1970. Tout au long de sa vie, plus de 1 150 avions ont été construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. L'avion a été conçu pour intercepter rapidement des avions à très haute altitude comme le U-2 et le B-58 à une vitesse fulgurante. L'avion a donné à l'Union soviétique un contrôle bien supérieur sur son propre espace aérien éloigné que jamais auparavant. Il est encore aujourd'hui en service limité dans l'armée de l'air russe."
 IRQ_jet_interceptor_equipment_8:0 "Mikoyan-Gourevitch MiG-25PDS"
 IRQ_jet_interceptor_equipment_8_short:0 "MiG-25PDS"
 IRQ_jet_interceptor_equipment_8_desc:0 "Le Mikoyan-Gurevich MiG-25 Foxbat est peut-être l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 a pris son envol au début de 1964 et est officiellement entré en service en 1970. Tout au long de sa vie, plus de 1 150 avions ont été construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. L'avion a été conçu pour intercepter rapidement des avions à très haute altitude comme le U-2 et le B-58 à une vitesse fulgurante. L'avion a donné à l'Union soviétique un contrôle bien supérieur sur son propre espace aérien éloigné que jamais auparavant. Il est encore aujourd'hui en service limité dans l'armée de l'air russe."

 #Light Jet
 IRQ_jet_light_equipment_1:0 "Yakovlev Yak-18"
 IRQ_jet_light_equipment_1_short:0 "Yak-18"
 IRQ_jet_light_equipment_2:0 "Mikoyan-Gourevitch MiG-15UTI"
 IRQ_jet_light_equipment_2_short:0 "MiG-15UTI"
 IRQ_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 se voit officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n°1 entre mars et mai 1949. La cabine de l'instructeur de l'UTI MiG-15 a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
 IRQ_jet_light_equipment_3:0 "L-29 Delfin"
 IRQ_jet_light_equipment_3_short:0 "L-29 Delfin"
 IRQ_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín (anglais ; Dolphin, nom de rapport OTAN ; Maya) est un avion d'entraînement militaire développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 entraîneurs L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avion d'entraînement standard pour l'armée de l'air soviétique."
 IRQ_jet_light_equipment_4:0 "Aéro L-39 Albatros"
 IRQ_jet_light_equipment_4_short:0 "L-39 Albatros"
 IRQ_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. C'était le premier avion d'entraînement à être équipé d'un groupe motopropulseur à double flux. Ce type a été exporté dans un large éventail de pays en tant qu'entraîneur militaire."
 IRQ_jet_light_equipment_5:0 "Aéro L-39ZA Albatros"
 IRQ_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 IRQ_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement armé et les attaques légères, utilisant un train d'atterrissage plus robuste, une charge utile plus élevée et notamment un canon à double canon GSh-23L de 23 millimètres fixé dans une nacelle conforme sous le compartiment des pilotes, ayant un chargeur de 150 cartouches dans la cellule."

 #Recon
 IRQ_recon_equipment_0:0 "Taylorcraft Auster AOP6"
 IRQ_recon_equipment_0_short:0 "Auster AOP6"
 IRQ_recon_equipment_0_desc:0 "Le Taylorcraft Auster était un avion de liaison et d'observation militaire britannique produit par la société Taylorcraft Airplanes (England) Limited pendant la Seconde Guerre mondiale. "
 IRQ_jet_recon_equipment_0:0 "Mikoyan-Gourevitch MiG-15Rbis"
 IRQ_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 IRQ_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé le développement d'une variante de reconnaissance de première ligne du MiG-15 avec une caméra AFA-BA/40, qui fournit une largeur de levé en bande de 0,9 à 4,5 km avec une longueur de route de photographie de 90 à 450 km à des altitudes de 2 000 à 10 000 m. Un seul canon NR-23 a été installé sur l'avion. Pour augmenter la portée du scout, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur \"Barium-M\" et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur la machine."
 IRQ_jet_recon_equipment_1:0 "Mikoyan-Gourevitch MiG-25RB"
 IRQ_jet_recon_equipment_1_short:0 "MiG-25RB"
 IRQ_jet_recon_equipment_1_desc:0 "MiG-25RB - avion de reconnaissance opérationnel monoplace toutes altitudes - bombardier. Les tests ont été achevés en décembre 1970. L'avion était équipé de 2 à 4 caméras de reconnaissance générale A-70M et d'une caméra topographique AFA-E/10. Le matériel photographique était logé dans cinq compartiments situés au bas du fuselage avant. Une station SIGINT appelée SPS-4A ou B « Virage » a également été installée, fonctionnant dans différentes gammes de fréquences. Équipement spécial - station d'interférence radio active SPS-141"
 IRQ_jet_recon_equipment_2:0 "Dassault Mirage F1EQ-4 "
 IRQ_jet_recon_equipment_2_short:0 "Mirage F1EQ-4 "
 IRQ_jet_recon_equipment_2_desc:0 "Mirage F1EQ-4, chasseur monoplace multirôle, attaque au sol, version reconnaissance pour l'Irak. 28 construits."

