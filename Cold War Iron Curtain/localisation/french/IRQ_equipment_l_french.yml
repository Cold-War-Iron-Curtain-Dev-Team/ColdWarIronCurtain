 IRQ_jet_tac_bomber_equipment_2:0 "Iliouchine Il-28"
 IRQ_jet_tac_bomber_equipment_2_short:0 "Il-28"
 IRQ_jet_tac_bomber_equipment_2_desc:0 "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à entrer en production à grande échelle, l'Il-28, lors de son introduction en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été progressivement retirés du service soviétique dans les années 1980, de nombreux avions de ce type sont encore en service aujourd'hui. Le nom de rapport USAF/DoD est Type 27, tandis que le nom de code OTAN est Beagle."

 IRQ_jet_tac_bomber_equipment_5:0 "Mikoyan-Gourevitch MiG-25RBS"
 IRQ_jet_tac_bomber_equipment_5_short:0 "MiG-25RBS"
 IRQ_jet_tac_bomber_equipment_5_desc:0 "Le MiG-25RBS est un bombardier de reconnaissance monoplace dérivé du MiG-25R, équipé de systèmes de reconnaissance améliorés et d'un système de bombardement automatique Peleng. L'avion peut transporter une charge de huit bombes de 500 kg (1 102 lb)."
 IRQ_jet_tac_bomber_equipment_6:0 "Soukhoï Su-24"
 IRQ_jet_tac_bomber_equipment_6_short:0 "Su-24"
 IRQ_jet_tac_bomber_equipment_6_desc:0 "Un gros chasseur-bombardier développé par l'Union soviétique dans les années 1960 et toujours utilisé aujourd'hui. Les caractéristiques incluent ses ailes variables et son corps pointu. Il peut équiper jusqu'à 8 000 kg d'armes et est capable de lancer différents types de missiles air-sol tout en conservant une vitesse stable. Cet avion est connu sous son nom de code OTAN « Fencer ». Avec son successeur, le Su-34, il est actuellement actif comme chasseur-bombardier pour les anciens pays du camp de l'Est."

 #Strategic bombers, prop versions from ENG_   British Forces in Iraq  
 IRQ_strat_bomber_equipment_1:0 "Handley Page Halifax"
 IRQ_strat_bomber_equipment_1_short:0 "Halifax"
