 #Jet Strategic bombers
 IRQ_jet_strat_bomber_equipment_1:0 "Tupolev Tu-16"
 IRQ_jet_strat_bomber_equipment_1_short:0 "Tu-16"
 IRQ_jet_strat_bomber_equipment_1_desc:0 "Le Tu-16 était un bombardier stratégique bimoteur développé en 1952 et l'un des premiers bombardiers stratégiques à réaction à entrer en service dans l'armée de l'air soviétique. Il avait une configuration à ailes en flèche et était propulsé par deux turboréacteurs Mikulin AM-3 sur les emplantures des ailes. Il pouvait transporter jusqu'à 9 000 kg (20 000 lb) de munitions, y compris des armes nucléaires et la FAB-9000, une bombe de 9 000 kg avec un rendement similaire à la bombe britannique du Grand Chelem. Connu en Occident sous le nom de Badger, ce type a servi tout au long de la guerre froide et a pris sa retraite en 1993. La variante chinoise construite sous licence, le H-6, reste en service en tant que bombardier stratégique de première ligne de la PLAAF." 
 IRQ_jet_strat_bomber_equipment_3:0 "Xian H-6A"
 IRQ_jet_strat_bomber_equipment_3_short:0 "H-6A" 
 IRQ_jet_strat_bomber_equipment_4:0 "Xian H-6C"
 IRQ_jet_strat_bomber_equipment_4_short:0 "H-6C"
 IRQ_jet_strat_bomber_equipment_5:0 "Xian H-6D"
 IRQ_jet_strat_bomber_equipment_5_short:0 "H-6D"

 #Jet Mach bomber
 IRQ_mach2stratbomber_equipment_1:0 "Tupolev Tu-22B"
 IRQ_mach2stratbomber_equipment_1_short:0 "Tu-22B"
 IRQ_mach2stratbomber_equipment_1_desc:0 "Premier bombardier supersonique à entrer en production en Union soviétique, le Tu-22 est entré en service dans l'armée de l'air soviétique en 1962. Produit en petit nombre (311 exemplaires ont été construits), ce type s'est avéré décevant, car il lui manquait la portée intercontinentale attendue d'un tel bombardier. Malgré cela, le Tu-22 a été modernisé tout au long de sa durée de vie, étant utilisé comme plate-forme de lancement pour le missile antinavire à longue portée Kh-22 (nom de rapport OTAN ; AS-4 Kitchen). Son nom de code OTAN est Blinder."

