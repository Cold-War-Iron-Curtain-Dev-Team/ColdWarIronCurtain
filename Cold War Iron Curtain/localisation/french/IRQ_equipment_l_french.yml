 #Redone Iraq IRQ Firearms
 IRQ_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 IRQ_infantry_equipment_0_short:0 "SMLE n°4"
 IRQ_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 IRQ_infantry_equipment_1:0 "Avtomat Kalachnikova 1947"
 IRQ_infantry_equipment_1_short:0 "AK-47"
 IRQ_infantry_equipment_1_desc:0 "L'AK47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK47 constituait une vaste mise à niveau du SKS. L'AK47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde."

 IRQ_infantry_equipment_2:0 "ZastavaM70-B1"
 IRQ_infantry_equipment_2_short:0 "ZastavaM70-B1"
 IRQ_infantry_equipment_2_desc:0 "Le développement d'un fusil d'assaut domestique a commencé en 1959 par Zastava avec les séries de fusils M59 et M64 avec des récepteurs fraisés, des canons filetés, des protège-mains Zastava familiers, des coupures de gaz pour le lancement de grenades et plusieurs autres diversités par rapport à la conception principale de l'AK, comme un dispositif de maintien du verrou ouvert sur le côté droit du récepteur et une poignée de chargement qui semblait différente des autres modèles AK. Bien que les performances aient été satisfaisantes, l'armée yougoslave n'a pas adopté le fusil à l'époque pour diverses raisons.\n\nEn 1970, le feu vert a été donné pour commencer la production en série financée par l'armée des séries M70 et M70A (Automatska Puska Model 1970, \"Automatic Rifle Model 1970\") dont le M70A était la version à crosse pliable. Au fil du temps, plusieurs mesures de production rentables ont été mises en oeuvre, telles que la suppression du boulon interne qui maintient ouvert et le remplacement des récepteurs fraisés par de l'acier embouti, d'abord de 0,9 mm, puis de 1,5 mm d'épaisseur."

 IRQ_infantry_equipment_3:0 "Fusil Tabuk des établissements d'Al-Qadissiya"
 IRQ_infantry_equipment_3_short:0 "Tabouk"
 IRQ_infantry_equipment_3_desc:0 "Le « Tabuk » est une copie produite en Irak de l'AKM russe, lui-même une version modernisée du célèbre AK-47 conçu par Mikhaïl Kalachnikov. L'Irak a commencé à produire le « Tabuk » en 1980 avec l'assistance technique de la Yougoslavie."

 IRQ_infantry_equipment_4:0 "Avtomat Kalachnikova 1974 Modernizirovanniy"
 IRQ_infantry_equipment_4_short:0 "AK-74M"
 IRQ_infantry_equipment_4_desc:0 "L'AK-74M est une variante améliorée de l'AK-74 développée en 1991 par l'usine Izhmash. L'AK-74M a été développé pour incorporer de nouveaux matériaux et des avancées de fabrication afin de créer une arme améliorée. Il comporte un boulon et un support allégés qui réduisent le recul produit par le piston à gaz. Le fusil comprend également une crosse en polyamide chargé de verre pouvant tenir latéralement, une bouche améliorée, un couvercle renforcé et plusieurs autres améliorations mineures. Il est également livré avec un rail pour le montage des optiques. Le fusil allégé et renforcé était plus facile à manipuler et à transporter et offrait un meilleur support pour les accessoires. Il n'a pas été adopté par l'Union soviétique, car l'URSS s'est effondrée avant de pouvoir être envisagée. Cependant, il a été adopté par la Fédération de Russie."

