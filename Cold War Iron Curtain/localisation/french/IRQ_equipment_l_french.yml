 #Fighter
 IRQ_fighter_equipment_0:0 "Force aérienne irakienne"
 IRQ_fighter_equipment_0_short:0 "Force aérienne irakienne"
 IRQ_fighter_equipment_0_desc:0 "L'armée de l'air irakienne (IQAF ou IrAF) (Al Quwwat al Jawwiyah al Iraqiyyah) est la branche des services de guerre aérienne des forces armées irakiennes. Elle est responsable de la défense de l'espace aérien irakien ainsi que de la surveillance de ses frontières internationales."

 IRQ_fighter_equipment_1:0 "Hawker Hurricane Mk.I"
 IRQ_fighter_equipment_1_short:0 "Ouragan Mk.I"
 IRQ_fighter_equipment_2:0 "Hawker Hurricane Mk.IIC"
 IRQ_fighter_equipment_2_short:0 "Ouragan Mk.IIC"
 IRQ_fighter_equipment_3:0 "Hawker Fury I 'Bagdad Fury'"
 IRQ_fighter_equipment_3_short:0 "Fureur I"
 IRQ_fighter_equipment_3_desc:0 "Version de chasseur terrestre monoplace pour l'armée de l'air irakienne. Officieusement connu sous le nom de « Bagdad Furies »."
  
 IRQ_jet_multirole_equipment_1:0 "de Havilland Vampire F.50"
 IRQ_jet_multirole_equipment_1_short:0 "Vampire F.50"
 IRQ_jet_multirole_equipment_1_desc:0 "Le de Havilland Vampire est un chasseur à réaction britannique développé et fabriqué par la de Havilland Aircraft Company. C'était le deuxième chasseur à réaction exploité par la RAF, après le Gloster Meteor, et le premier à être propulsé par un seul moteur à réaction. "
 #IRQ_jet_multirole_equipment_2:0 "North American F-86A Sabre"
 #IRQ_jet_multirole_equipment_2_short:0 "F-86A Sabre"
 #IRQ_jet_multirole_equipment_2_desc:0 "The F-86 is a swept-wing jet fighter developed and introduced in the late 1940s from research captured by the Germans. The aircraft's designed made it capable of transonic speeds and high maneuverability, features that made it capable of handling its famous rival, the MiG-15. Officially known as the 'Sabre' or 'Sabrejet' the F-86, alongside its Canadian and Australian variants put together would make it the most produced Western fighter jet in aviation history."
 IRQ_jet_multirole_equipment_3:0 "Hawker Chasseur F.1"
 IRQ_jet_multirole_equipment_3_short:0 "Chasseur F.1"
 IRQ_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19"
 IRQ_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 IRQ_jet_multirole_equipment_4_short:0 "MiG-19"
 IRQ_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-21F-13"
 IRQ_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 IRQ_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 IRQ_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21MF"
 IRQ_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 IRQ_jet_multirole_equipment_6_short:0 "MiG-21MF"
 IRQ_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-21bis"
 IRQ_jet_multirole_equipment_7_short:0 "MiG-21bis"
 IRQ_jet_multirole_equipment_7_desc:0 "Le développement ultime du MiG-21, équipé du turboréacteur Tumanskiy R25-300 et d'un grand nombre d'autres avancées par rapport aux types précédents. Ces MiG-21bis destinés à la PVO (Force de défense aérienne) soviétique étaient équipés du système Lazur GCI, tandis que ceux destinés à l'armée de l'air soviétique étaient équipés du système Polyot ILS."
 IRQ_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-23ML"
 IRQ_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment la solidité et la fiabilité de la cellule, les performances du moteur, la maniabilité et les performances du radar. Une refonte considérable de la cellule a été réalisée, aboutissant au MiG-23ML."
 IRQ_jet_multirole_equipment_8_short:0 "MiG-23ML"
 IRQ_jet_multirole_equipment_9:0 "Mirage F1EQ-2"
 IRQ_jet_multirole_equipment_9_short:0 "Mirage F1EQ-2"
 IRQ_jet_multirole_equipment_9_desc:0 "À la fin des années 1970, l'Irak a passé une commande pour une variante du Mirage F1, désignée sous le nom de Mirage F1EQ, spécialement modifiée pour une portée étendue afin d'effectuer des missions de frappe et différente de tous les modèles exploités par l'armée de l'air française." 
 IRQ_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29A"
 IRQ_jet_multirole_equipment_10_short:0 "MiG-29A"
 IRQ_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le Mikoyan Design Bureau. C'était le premier chasseur de 4e génération à entrer en service en URSS et dans le bloc de l'Est. Intégrant une avionique améliorée et des capacités radar considérablement améliorées. Les premiers MiG-29 ont été utilisés comme entraîneurs par le Pacte de Varsovie avec des exportations limitées vers l'Inde mais avaient une utilisation limitée au combat. Le MiG-29 deviendra plus tard la base de variantes largement produites telles que le MiG-29S, le MiG-29M et le MiG-35."

 #CAS
 IRQ_CAS_equipment_1:0 "Hawker irakien Audax 'Nisr'"
 IRQ_CAS_equipment_1_short:0 "Nisr"
 IRQ_CAS_equipment_2:0 "Northrop 15 modèle 8A-4"
 IRQ_CAS_equipment_2_short:0 "15 Modèle 8A-4"
 IRQ_CAS_equipment_3:0 "Hawker Typhoon Mk.Ib/Tardif"
 IRQ_CAS_equipment_3_short:0 "Typhon Mk.Ib/Tardif"
 IRQ_CAS_equipment_3_desc:0 "Le Hawker Typhoon était un chasseur-bombardier britannique principalement utilisé par la Royal Air Force (RAF) pendant la Seconde Guerre mondiale. Le Typhoon Mk.Ib/Late était un dérivé amélioré des précédents Hawker Typhoons, doté d'un nouveau auvent à bulles."
 IRQ_CAS_equipment_4:0 "Entraîneur Hawker Fury I"
 IRQ_CAS_equipment_4_short:0 "Entraîneur Fury I"
 IRQ_CAS_equipment_4_desc:0 "Version d'entraînement biplace pour l'armée de l'air irakienne. Officieusement connu sous le nom de « Bagdad Furies »."

 IRQ_jet_CAS_equipment_1:0 "de Havilland Vampire FB.50"
 IRQ_jet_CAS_equipment_1_short:0 "Vampire FB.50"
 IRQ_jet_CAS_equipment_2:0 "de Havilland Venom FB.1"
 IRQ_jet_CAS_equipment_2_short:0 "Venin FB.1"
 IRQ_jet_CAS_equipment_3:0 "de Havilland Venom FB.4"
 IRQ_jet_CAS_equipment_3_short:0 "Venin FB.4"
 IRQ_jet_CAS_equipment_4:0 "Hawker Hunter FGA.59"
 IRQ_jet_CAS_equipment_4_short:0 "Chasseur FGA.59"
 IRQ_jet_CAS_equipment_5:0 "Sukhoï Su-7BKL"
 IRQ_jet_CAS_equipment_5_short:0 "Su-7BKL" 
 IRQ_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté de la colonne vertébrale du fuselage, réservoirs de carburant installés dans les ailes, points d'attache « humides » sous les ailes pour transporter des réservoirs de carburant externes, capables de transporter des bombes nucléaires tactiques."
 IRQ_jet_CAS_equipment_6:0 "Soukhoï Su-17M"
 IRQ_jet_CAS_equipment_6_short:0 "Su-17M"
 IRQ_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
 IRQ_jet_CAS_equipment_7:0 "Mikoyan-Gourevitch MiG-23BN"
 IRQ_jet_CAS_equipment_7_short:0 "MiG-23BN"
 IRQ_jet_CAS_equipment_7_desc:0 "Version améliorée du MiG-23B, le MiG-23BN se distinguait par le fait qu'il était équipé des ailes Edition 3 et du moteur R-29 des variantes de chasseurs contemporains, ainsi que de mises à jour mineures de l'électronique et de l'équipement."
 IRQ_jet_CAS_equipment_8:0 "Soukhoï Su-25"
 IRQ_jet_CAS_equipment_8_short:0 "Su-25"
 IRQ_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. L'avion a effectué son vol inaugural en 1975 et a été introduit en 1981. Depuis 1978, plus de 1 000 avions ont été produits. C'était un avion particulièrement populaire à l'étranger, vendu dans 29 pays. Pour cette raison, le Su-25 a été impliqué dans plusieurs conflits, notamment la guerre soviétique en Afghanistan, l'Iran-Irak et la guerre du Golfe. L'avion reste aujourd'hui en service dans tous les pays d'exportation."

 #Interceptor with ENG/GER GFX    British Forces in Iraq & Fliegerführer Irak
