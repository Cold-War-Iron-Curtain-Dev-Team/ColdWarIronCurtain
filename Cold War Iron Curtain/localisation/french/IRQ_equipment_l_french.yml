 IRQ_lt_equipment_4:0 "PT-76B modèle 4"
 IRQ_lt_equipment_4_short:0 "PT-76B"
 IRQ_lt_equipment_4_desc:0 "PT-76 armé du canon de char rayé D-56TS de 76,2 mm (frein de bouche à double chicane, éjecteur de cartouche, extracteur de fumée et système de stabilisation à 2 axes STP-2P 'Zarya'), du système de protection NBC PAZ (protivo-atomnaya zashchita), d'un système d'extinction automatique d'incendie, d'un viseur TShK-2-66 amélioré, d'un système de filtration-ventilation, de dispositifs d'observation améliorés, d'un système électrique amélioré. équipement, un nouveau moteur diesel V-6B 6 cylindres 4 temps en ligne refroidi par eau développant 263 ch (196 kW) à 1 800 tr/min et des réservoirs de carburant internes supplémentaires pour lesquels la forme du blindage a dû être légèrement modifiée."
 IRQ_lt_equipment_5:0 "Engesa EE-9 Cascavel Mk.II"
 IRQ_lt_equipment_5_short:0 "EE-9 Cascavel Mk.II"
 IRQ_lt_equipment_5_desc:0 "L'EE-9 Cascavel est un véhicule blindé brésilien à six roues développé principalement pour la reconnaissance. Il a été conçu par Engesa en 1970 pour remplacer la flotte vieillissante de M8 Greyhounds du Brésil. Le véhicule fut d'abord équipé du canon principal de 37 mm du Greyhound, puis d'une tourelle française adoptée du Panhard AML-90."

