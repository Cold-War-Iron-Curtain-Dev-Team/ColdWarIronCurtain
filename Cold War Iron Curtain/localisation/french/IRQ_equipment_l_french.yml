 IRQ_attack_helicopter_equipment_2:0 "Mil Mi-8, vaisseau de combat"
 IRQ_attack_helicopter_equipment_2_short:0 "Mil Mi-8, vaisseau de combat"
 IRQ_attack_helicopter_equipment_2_desc:0 "Les Mi-8 étaient employés par l'ancienne aviation de l'armée irakienne et l'armée de l'air irakienne sous Saddam Hussein. Dans la guerre Iran-Irak des années 1980, il y a eu des combats air-air entre des hélicoptères de l'aviation irakiens et iraniens, notamment entre les Bell AH-1J Cobra iraniens et les Mi-8 irakiens."
 IRQ_attack_helicopter_equipment_3:0 "Mil Mi-25"
 IRQ_attack_helicopter_equipment_3_short:0 "Mil Mi-25"
 IRQ_attack_helicopter_equipment_3_desc:0 "La version d'exportation du Mi-24D. (Hind-D) Le Mi-24D a été conçu pour être un vaisseau de combat plus pur que les variantes précédentes. Il est entré en production en 1973. Le Mi-24D possède un fuselage avant redessiné, avec deux cockpits séparés pour le pilote et le tireur. Il est armé d'une seule mitrailleuse Yak-B à quatre canons de 12,7 mm sous le nez. Il peut également transporter quatre nacelles de roquettes de 57 mm, quatre missiles antichar SACLOS 9M17 Phalanga (une amélioration significative par rapport au système MCLOS du Mi-24A), ainsi que des bombes et d'autres armes."
 IRQ_attack_helicopter_equipment_4:0 "Mil Mi-35"
 IRQ_attack_helicopter_equipment_4_short:0 "Mi-35"
 IRQ_attack_helicopter_equipment_4_desc:0 "Basé sur le Mi-24 Hind, l'hélicoptère militaire Mi-35M intègre plusieurs améliorations, notamment des ailes tronquées raccourcies, un nouveau système de rotor, une avionique moderne, des turbomoteurs améliorés et un système hydraulique. Le cockpit et les composants vitaux de l'hélicoptère sont lourdement blindés."
