 IRQ_artillery_equipment_1:0 "Pistolet moyen BL 5,5 pouces"
 IRQ_artillery_equipment_1_short:0 "BL 5,5 pouces"
 IRQ_artillery_equipment_1_desc:0 "En janvier 1939, une spécification fut publiée pour un canon destiné à remplacer les obusiers de 6 pouces et 26 cwt utilisés avec la plupart des batteries moyennes. Les premières unités furent équipées au Royaume-Uni à l'été 1941 et en Afrique du Nord un an plus tard, 20 canons équipèrent les batteries britanniques et françaises libres à El Alamein. Par la suite, il équipera également des régiments canadiens, australiens, sud-africains, polonais et indiens, et après la guerre, il sera également utilisé par la Nouvelle-Zélande. Durant la Seconde Guerre mondiale, l'organisation normale était un régiment de 16 canons organisé en deux batteries. Le 5.5 fut maintenu en service après la guerre. Il a été utilisé par la Royal Artillery lors d'opérations en Corée, en Arabie du Sud et à Bornéo. Il a probablement été utilisé par l'armée indienne dans les guerres contre le Pakistan, et a été utilisé par l'armée pakistanaise contre l'Inde dans les montagnes du Cachemire pendant la guerre de Kargil en 1999."

