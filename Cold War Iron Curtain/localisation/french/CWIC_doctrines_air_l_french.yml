l_french:
 GRAND_DOCTRINE_CW_AIR_SUPERIORITY: "Supériorité aérienne"
 GRAND_DOCTRINE_CW_AIR_SUPERIORITY_DESC: "Le contrôle de l'air est la condition première de toute autre opération. Les chasseurs, les radars et une force d'interception pointue gagnent le ciel, et ce qui vole en dessous gagne la guerre."
 GRAND_DOCTRINE_CW_STRATEGIC_DETERRENCE: "Dissuasion stratégique"
 GRAND_DOCTRINE_CW_STRATEGIC_DETERRENCE_DESC: "Le bombardier et le missile sont les instruments de la survie nationale. Une force aérienne construite autour de la frappe stratégique empêche l'ennemi de tenter une telle frappe."
 GRAND_DOCTRINE_CW_INTEGRATED_AIR_LAND: "Opérations aéroterrestres intégrées"
 GRAND_DOCTRINE_CW_INTEGRATED_AIR_LAND_DESC: "La puissance aérienne existe pour servir la bataille terrestre. Les avions, l'état-major de l'armée et la défense aérienne sont conçus comme un seul système, le ciel étant une extension du front."
 cw_ground_controlled_interception_radar_chains: "Chaînes radar"
