l_french:

 CUB_50s_1945_the_1948_cuban_election:0 "Les élections cubaines de 1948"
 CUB_50s_1945_the_1948_cuban_election_desc:0 "Il est temps pour Cuba de recommencer à voter !"
 CUB_50s_grau_adminstration:0 "L'administration Grau"
 CUB_50s_grau_adminstration_desc:0 "Ramon Grau, bien qu'élu pour la première fois en 1944 ; a encore beaucoup à faire pour terminer pleinement son dernier mandat pour la République de Cuba."
 CUB_50s_the_hun_days:0 "Le Gouvernement des Cent Jours"
 CUB_50s_the_hun_days_desc:0 "L'administration Grau était généralement appelée le gouvernement des « Cent jours », qui représentait l'unité que le nouveau gouvernement cubain réaliserait à une plus grande échelle."
 CUB_50s_the_continuation_of_natpro:0 "La poursuite des réformes progressistes"
 CUB_50s_the_continuation_of_natpro_desc:0 "L'administration actuelle est favorable à des réformes progressistes dans lesquelles notre gouvernement doit assurer les futures générations du peuple cubain à Cuba."
 CUB_50s_support_for_natpro:0 "Gerrymandering pour les authentiques"
 CUB_50s_support_for_natpro_desc:0 "Afin de ne pas risquer la mort de l'héritage de notre grand parti politique, nous devons progressivement accroître notre influence sur l'État cubain !"
 CUB_50s_junta_start:0 "Officiers rebelles"
 CUB_50s_junta_start_desc:0 "Depuis que notre gouvernement a approuvé les élections, notre régime est publiquement désapprouvé par le public alors que nos taux d'approbation chutent comme des mouches. Même un grand nombre de nos citoyens travailleurs et militaires ont même pris les armes."
 CUB_50s_focus_against_the_conservatives:0 "Focus contre les conservateurs"
 CUB_50s_focus_against_the_conservatives_desc:0 "Les conservateurs et leur faction sont trop responsables de la corruption de notre pays, nous devons faire une croisade contre les traditionalistes et leurs idéaux !"
 CUB_50s_focus_against_the_liberals:0 "Focus contre les libéraux"
 CUB_50s_focus_against_the_liberals_desc:0 "Les libéraux sont la raison pour laquelle notre nation s'est ralliée à nous lors de la révolution de 1933. Afin d'obtenir l'approbation du peuple, nos idéaux doivent être préservés pour le bien commun."
 CUB_50s_perform_rallies_in_southern_cuba:0 "Organiser des rassemblements dans le sud de Cuba"
 CUB_50s_perform_rallies_in_southern_cuba_desc:0 "Notre establishment politique a besoin de plus de soutien dans le Sud, afin de leur montrer la véritable démocratie."
 CUB_50s_support_from_the_republican_party:0 "Soutien du Parti républicain"
 CUB_50s_support_from_the_republican_party_desc:0 "Une invitation du Comité national républicain des États-Unis nous a proposé une aide financière contre notre opposition, les libéraux, soutenue par le Parti démocrate des États-Unis. Nous devons accepter leur aide pour une plus grande prospérité de notre établissement."
 CUB_50s_raise_the_minimum_wage:0 "Augmenter le salaire minimum"
 CUB_50s_raise_the_minimum_wage_desc:0 "Les classes inférieures à Cuba souffrent de salaires limités, ces salaires devraient être disponibles pour tous les travailleurs."
 CUB_50s_establish_longer_working_periods:0 "Établir des périodes de travail plus longues"
 CUB_50s_establish_longer_working_periods_desc:0 "Ce nouveau projet de loi permettra aux travailleurs cubains de travailler plus longtemps afin d'obtenir le salaire dont ils ont besoin."
 CUB_50s_nationalization_of_the_cuban_electric_industry:0 "Nationalisation de l'électricité cubaine"
 CUB_50s_nationalization_of_the_cuban_electric_industry_desc:0 "L'électricité cubaine doit rester cubaine jusqu'à la chute de notre établissement !"
 CUB_50s_automony_to_the_university_of_havanna:0 "Autonomie à l'Université de La Havane"
 CUB_50s_automony_to_the_university_of_havanna_desc:0 "L'Université de La Havane recherche depuis très longtemps son autonomie. Il est temps pour l'Authentic Party de leur exaucer ce voeu."
 CUB_50s_limit_militaristic_control:0 "Limiter le contrôle militariste sur le Congrès"
 CUB_50s_limit_militaristic_control_desc:0 "L'armée a fait beaucoup pour Cuba, mais il est temps pour les forces armées cubaines de rester à l'écart de la politique et de se consacrer plutôt à la défense de notre nation."
 CUB_50s_appease_the_armed_forces:0 "Apaiser les forces armées"
 CUB_50s_appease_the_armed_forces_desc:0 "Nous ne pouvons pas risquer la mort de la démocratie pour satisfaire notre agenda, mais les croisés armés doivent se reposer pour les guerres contre la République de Cuba."
 CUB_50s_supposed_unity:0 "Unité proposée"
 CUB_50s_supposed_unity_desc:0 "Pour espérer une véritable souveraineté cubaine, l'armée doit être apaisée autant que possible afin d'empêcher toute junte commune dans un avenir proche."
 CUB_50s_split:0 "Une séparation authentique"
 CUB_50s_split_desc:0 "Le Parti Orthodoxe était une scission au sein de la Faction Authentique, bien qu'ils aient les mêmes idéaux ; le Parti orthodoxe estime que cela entraînera des problèmes similaires auxquels les Américains ont été confrontés avec les factures utilisées par les Américains."
 CUB_50s_victory_for_the_socialists:0 "Une victoire socialiste !"
 CUB_50s_victory_for_the_socialists_desc:0 "Étonnamment, les socialistes cubains ont obtenu la majorité des voix."
 CUB_50s_an_authentic_:0 "CUB_an_authentic_"
 CUB_50s_an_authentic_victory:0 "Une victoire authentique"
 CUB_50s_an_authentic_victory_desc:0 "Comme prévu, le Parti Authentique a obtenu l'essentiel du soutien lors des élections législatives, remportant ainsi les primaires !"
 CUB_50s_victory_for_cuban_liberal:0 "Une victoire pour le libéralisme cubain !"
 CUB_50s_victory_for_cuban_liberal_desc:0 "De manière inattendue, le Parti libéral, grâce à son soutien du Parti démocrate des États-Unis, a remporté les élections avec une faible marge !"
 CUB_50s_increase_taxes:0 "Augmenter les impôts"
 CUB_50s_increase_taxes_desc:0 "La fiscalité est ce qui incite les pays à mobiliser davantage de financements pour des projets et des projets de travaux publics. "
 CUB_50s_government_control:0 "Augmenter le contrôle gouvernemental"
 CUB_50s_government_control_desc:0 "Le gouvernement devrait être capable de prendre soin de son peuple ; comme le peuple l'est pour cette grande nation."
 CUB_50s_meeting_with_dp:0 "Rencontre avec le Parti démocrate"
 CUB_50s_meeting_with_dp_desc:0 "Les Démocrates des États-Unis tiennent à ce que notre parti occupe la première place dans la sphère cubaine."
 CUB_50s_liberalize_industries:0 "Libéraliser les industries"
 CUB_50s_liberalize_industries_desc:0 "Nous avons besoin que les industries suivent notre programme. En plus d'offrir à nos collègues de meilleures conditions pour continuer leur travail !"
 CUB_50s_edu_cuba:0 "Des éducations pour tous les Cubains !"
 CUB_50s_edu_cuba_desc:0 "Le peuple cubain mérite une éducation pour faire avancer le projet de cette nation"
 CUB_50s_power_to_the_CNOC:0 "Pouvoir à la CCT"
 CUB_50s_power_to_the_CNOC_desc:0 "La CTC ou Union centrale des travailleurs de Cuba est un syndicat populaire actuellement sous contrôle cubain. Nous devrions donner le pouvoir à ce groupe collectif pour le conflit nécessaire."
 CUB_50s_nationalize_industries:0 "La nationalisation des industries"
 CUB_50s_nationalize_industries_desc:0 "Cuba a été attaquée à maintes reprises par les idéaux impérialistes des États-Unis. Nous devons marcher sur le pied de Lady Liberty et nationaliser les industries qui se trouvent à Cuba."
 CUB_50s_propaganda_encursion:0 "Incursion de propagande"
 CUB_50s_propaganda_encursion_desc:0 "Afin de consolider le pouvoir à Cuba, il faut une propagande pour que les masses tournent leur regard vers nous."
 CUB_50s_remove_private_property:0 "Supprimer une propriété privée"
 CUB_50s_remove_private_property_desc:0 "Pour qu'une société puisse prospérer, elle doit voir les frontières de propriété abolies afin de restaurer le véritable socialisme."
 CUB_50s_proclaim_the_one_party_state:0 "Proclamer l'État à parti unique"
 CUB_50s_proclaim_the_one_party_state_desc:0 "Cuba doit réaliser que son destin est de libérer les travailleurs de leurs oppresseurs. La Proclamation se propagera à nos voisins et anciens alliés !"
 CUB_50s_crusade_against_corruption:0 "Croisade contre la corruption"
 CUB_50s_crusade_against_corruption_desc:0 "Le Parti Orthodoxe a vu les implications entre le Parti Authentique car ils engendrent la corruption elle-même qui remonte à l'époque de Batista. "
 CUB_50s_reformation_of_the_house:0 "Réforme de la maison"
 CUB_50s_reformation_of_the_house_desc:0 "Cuba mérite un gouvernement plus expansif. Celui qui pourvoira à la volonté du peuple."
 CUB_50s_privatization_of_enterprises:0 "Privatisations d'entreprises"
 CUB_50s_privatization_of_enterprises_desc:0 "Pour que Cuba prospère, elle doit s'aligner sur le libre marché."
 CUB_50s_nationalization_of_cuban_railways:0 "Nationalisation des chemins de fer cubains"
 CUB_50s_nationalization_of_cuban_railways_desc:0 "Nous devons améliorer nos infrastructures en les présentant comme des infrastructures faites par des Cubains et faites pour les Cubains"
 CUB_50s_true_national_identity:0 "Une véritable identité nationale"
 CUB_50s_true_national_identity_desc:0 "Le patriotisme mène un pays au succès. Provoquer ce nouveau patriotisme devrait profiter au Parti orthodoxe."
 CUB_50s_the_raise_of_civil_liberties:0 "L'éloge des libertés civiles"
 CUB_50s_the_raise_of_civil_liberties_desc:0 "Les libertés civiles permettent au peuple de circuler librement et fort. Le peuple devrait être de notre côté si ces libertés sont protégées."
 CUB_50s_establishment_of_the_national_bank:0 "Créer la Banque Nationale"
 CUB_50s_establishment_of_the_national_bank_desc:0 "Pendant une courte période, les Cubains ont dû recourir aux banques locales. Cependant, La Havane devrait créer sa première banque nationale pour que le rêve cubain existe."
 CUB_50s_establish_tribunal_accounts:0 "Établir les comptes du Tribunal"
 CUB_50s_establish_tribunal_accounts_desc:0 "Afin de contenir la liberté politique et économique, un lieu de tribunaux devrait être désigné pour préserver cette paix avec la politique et l'économie."
 CUB_50s_preservation_of_the_ap:0 "Préservation de la fête authentique"
 CUB_50s_preservation_of_the_ap_desc:0 "Pour que Cuba grandisse ; Cuba a besoin du Parti Authentique pour préserver ces libertés qu'elle perdra facilement."
 CUB_50s_the_cordial_president:0 "Le Président Cordial"
 CUB_50s_the_cordial_president_desc:0 "Carlos Prios a la réputation d'être un homme de justice du peuple et de son droit aux libertés à Cuba. "
 CUB_50s_a_new_and_free_cuba:0 "Un Cuba nouveau et libre"
 CUB_50s_a_new_and_free_cuba_desc:0 "Cuba est à nouveau libre et pour la première fois dans l'histoire, les Américains n'ont eu pratiquement aucun contrôle sur la politique cubaine depuis longtemps !"
 CUB_50s_the_coup:0 "Une journée en cendres"
 CUB_50s_the_coup_desc:0 "Avec le temps, Cuba pourrait suivre une voie qui rechercherait des méthodes dangereuses pour alimenter de fausses pensées idéalistes qui conduiraient cet État au désastre. Batista doit prendre le pouvoir et se précipiter à Cuba."
