 Tblisi.1.t:0 "Les émeutes de Tbilissi"
 Tblisi.2.t:0 "Le rétablissement de l'ordre public"
 Tblisi.2.d:0 "Après près de 6 jours d'émeutes paralysantes en RSS de Géorgie, Moscou a enfin réaffirmé son contrôle total sur sa région. À la suite d'intenses affrontements contre les forces de police locales, l'armée a été envoyée sur place pour disperser la foule. La situation atteindrait son paroxysme lorsqu'une délégation civile serait arrêtée par le gouvernement et que les manifestants prendraient d'assaut l'armée et la police pour les secourir. Les chars soviétiques feraient irruption sur la place Lénine, suivis par des bataillons de troupes qui n'auraient aucun scrupule à abattre la foule à balles réelles. Le 10 mars, des manifestants ont été arrêtés et tués en masse et des centaines d'autres ont disparu au milieu de la nuit. L'ordre a été rétabli mais la légitimité de Khrouchtchev et de son leadership est désormais discutable." 					#Restore Public Order (Aftermath of Tbilisi Riot)
 
