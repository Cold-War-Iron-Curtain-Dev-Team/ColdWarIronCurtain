 SOV_khrushchevs_struggle_for_power_desc:0 "Voyez l'ascension inspirante du camarade Khrouchtchev ! Il a parcouru sans relâche le réseau complexe de la politique soviétique pour assumer un rôle de premier plan au sein de notre grand Parti communiste, garantissant ainsi un avenir meilleur sous sa direction."
 SOV_remove_monuments_to_stalin_desc:0 "Dans un esprit de progrès, notre nation s'engage sur une nouvelle voie. En démantelant les monuments dédiés à Staline, nous symbolisons notre engagement en faveur d'une société plus ouverte et plus compatissante, libérée des ombres du passé."
 SOV_dissolve_the_cominform_desc:0 "La sagesse du camarade Khrouchtchev a éclairé la voie vers l'unité entre les Etats socialistes. Avec la dissolution du Kominform, nous promouvons un esprit de coopération, permettant aux nations de prospérer de manière indépendante tout en restant fermes dans leur engagement envers le communisme."
 SOV_decree_lifting_restrictions_of_deported_caucasus_people_desc:0 "Le décret visant à lever les restrictions imposées à nos frères et soeurs du Caucase témoigne de notre engagement en faveur de la justice. Leur retour au sein de la société soviétique représente une nouvelle ère d'égalité et d'harmonie."
 SOV_hold_the_first_spartakiad_desc:0 "Joignez-vous à la célébration de l'athlétisme soviétique ! Le leadership visionnaire du camarade Khrouchtchev vous présente la première Spartakiade, une démonstration glorieuse des prouesses physiques de nos citoyens, renforçant la force de nos idéaux socialistes."
 SOV_replace_molotov_as_foreign_minister_desc:0 "La perspicacité stratégique du camarade Khrouchtchev guide notre politique étrangère. Avec le remplacement du camarade Molotov, nous ouvrons de nouvelles voies pour les relations diplomatiques, démontrant notre attachement à la coexistence pacifique."
 SOV_cancel_criminal_registration_for_not_showing_up_for_work_desc:0 "L'annulation de l'enregistrement criminel pour absentéisme au travail témoigne de la bienveillance de notre gouvernement. Nous offrons aux citoyens un nouveau départ, en reconnaissant que la meilleure manière d'atteindre la productivité est d'encourager et non de coercition."
 SOV_atomic_powered_icebreaker_desc:0 "Soyez témoin de l'ingéniosité soviétique à son meilleur ! Le camarade Khrouchtchev défend le développement de brise-glaces à propulsion nucléaire, renforçant ainsi nos capacités dans l'Arctique et faisant progresser notre statut de superpuissance mondiale."
 SOV_development_of_nuclear_powerplants_desc:0 "Notre engagement en faveur du progrès scientifique ne connaît pas de limites ! Sous la direction du camarade Khrouchtchev, nous nous engageons dans un voyage visant à exploiter la puissance de l'atome, en fournissant une énergie propre et abondante au peuple."
 SOV_sixth_five_year_plan_desc:0 "Le camarade Khrouchtchev dévoile l'ambitieux sixième plan quinquennal, traçant la voie vers une croissance économique et une prospérité sans précédent pour le peuple soviétique, garantissant son bien-être pour les générations à venir."
 SOV_development_of_virgin_and_fallow_lands_desc:0 "La transformation de terres inutilisées en champs abondants témoigne de la résilience et du dévouement soviétiques. L'initiative du camarade Khrouchtchev visant à développer les terres vierges et en jachère annonce une nouvelle ère d'abondance agricole."
 SOV_open_the_serov_ferroalloy_plant_desc:0 "L'usine de ferroalliages de Serov, sous l'oeil vigilant du camarade Khrouchtchev, apparaît comme un symbole de puissance industrielle. Son expansion incarne notre engagement indéfectible envers une industrie sidérurgique robuste."
 SOV_emphasis_on_expansion_of_heavy_industry_desc:0 "Le plan visionnaire du camarade Khrouchtchev visant à développer l'industrie lourde garantit que l'Union soviétique reste une force formidable. Nous accordons la priorité à la production de machines, d'acier et de produits chimiques, renforçant ainsi notre rôle sur la scène mondiale."
 SOV_saratov_chemical_combine_desc:0 "Contemplez la merveille de la moissonneuse-batteuse chimique de Saratov ! L'investissement du camarade Khrouchtchev dans cette installation nous propulse vers l'excellence scientifique, renforçant ainsi notre position de leader mondial dans la production chimique."
 SOV_sponsor_radio_engineering_and_electronic_industry_desc:0 "Embrassez l'avenir à bras ouverts ! Le parrainage par le camarade Khrouchtchev de l'industrie de l'ingénierie radio et de l'électronique fait progresser nos capacités technologiques, dotant notre nation d'innovations de pointe."
 SOV_finish_the_volzhskaya_hydroelectric_power_station_desc:0 "L'achèvement de la centrale hydroélectrique de Volzhskaya représente une réalisation monumentale. Sous la direction du camarade Khrouchtchev, nous libérerons le potentiel illimité de l'énergie hydroélectrique, électrisant ainsi notre nation."
 SOV_construction_of_verkhnetagilskaya_regional_thermal_power_plants_desc:0 "L'engagement du camarade Khrouchtchev en faveur du développement régional conduit à la construction de centrales thermiques, apportant lumière et chaleur aux quatre coins de notre vaste nation."
 SOV_commission_more_hydroelectric_power_plants_desc:0 "Alors que nous progressons, le camarade Khrouchtchev met en service des centrales hydroélectriques supplémentaires, exploitant la puissance de nos rivières pour alimenter notre croissance industrielle et économique."
 SOV_build_the_novogorkovsky_and_volgograd_oil_refineries_desc:0 "Soyez témoin des fruits du travail soviétique ! Sous la direction du camarade Khrouchtchev, les raffineries de pétrole de Novogorkovski et de Volgograd apparaissent comme des symboles d'autosuffisance, raffinant nos ressources pour le bénéfice de tous."
 SOV_encourage_production_of_cultural_and_household_goods_desc:0 "La vision du camarade Khrouchtchev s'étend au-delà de l'industrie. En encourageant la production de biens culturels et ménagers, nous améliorons la qualité de vie de chaque citoyen soviétique, favorisant ainsi une société d'abondance et de contentement."
 SOV_anti_party_group_coup_desc:0 "Le coup d'État du groupe anti-parti représente un moment de crise et de résilience. Le camarade Khrouchtchev, aux côtés de camarades fidèles, a contrecarré cette tentative de porter atteinte à l'intégrité de notre Parti, préservant ainsi l'unité et la force de notre cause socialiste."
 SOV_seventh_five_year_plan_desc:0 "La vision du camarade Khrouchtchev s'étend au septième plan quinquennal, un projet de progrès sans précédent. Avec ce plan, nous propulsons notre nation vers des réalisations économiques encore plus grandes, assurant ainsi notre place de superpuissance mondiale."
 SOV_khrushchevs_union_desc:0 "L'Union de Khrouchtchev est un symbole de cohésion et de solidarité nationales. Les efforts du camarade Khrouchtchev pour unir nos diverses républiques soviétiques sous la bannière du socialisme garantissent un avenir harmonieux pour tous."
 SOV_accelerate_the_space_race_desc:0 "Notre voyage vers les étoiles atteint de nouveaux sommets ! L'appel du camarade Khrouchtchev à accélérer la course à l'espace démontre notre engagement inébranlable en faveur de l'exploration scientifique et de la suprématie technologique."
 SOV_clean_up_khrushchevs_repressions_involvement_desc:0 "L'engagement du camarade Khrouchtchev en faveur de la justice s'étend jusqu'à l'épuration des injustices passées. Cette initiative vise à répondre à toute implication dans les répressions sous le régime de Khrouchtchev, garantissant ainsi une société juste et transparente."
 SOV_abolish_special_tribunals_desc:0 "L'abolition des tribunaux spéciaux sous la direction du camarade Khrouchtchev reflète notre attachement à l'équité et à une procédure régulière. La justice doit être administrée de manière impartiale, dans le respect des droits de tous les citoyens."
 SOV_the_ryazan_miracle_desc:0 "Le Miracle de Riazan incarne les merveilles de l'agriculture soviétique sous la direction du camarade Khrouchtchev. Soyez témoin de l'augmentation stupéfiante des rendements agricoles et de la production alimentaire, garantissant la prospérité pour tous."
 SOV_appoint_khrushchev_chairman_of_the_council_of_ministers_of_the_ussr_desc:0 "La nomination du camarade Khrouchtchev à la présidence du Conseil des ministres de l'URSS annonce une nouvelle ère de direction dynamique. Sa vision et son dévouement promettent un avenir meilleur à notre grande nation."
 SOV_special_presidium_meeting_desc:0 "La réunion spéciale du Présidium marque un rassemblement crucial de nos dirigeants. Sous la direction du camarade Khrouchtchev, nous abordons les questions urgentes et traçons la voie de l'avenir de notre nation, réaffirmant notre engagement envers le peuple."
 SOV_allow_soviet_citizens_to_travel_aboards_desc:0 "Le camarade Khrouchtchev ouvre de nouveaux horizons à nos citoyens grâce à la possibilité de voyager à l'étranger. Cette politique progressiste favorise la compréhension internationale tout en mettant en valeur la force et la dignité du peuple soviétique."
 SOV_exclude_antiparty_group_members_from_presidium_desc:0 "Dans une démarche résolue, le camarade Khrouchtchev exclut du Présidium les membres des groupes antipartis. L'unité de notre Parti est primordiale, garantissant que ceux qui s'opposent à nos idéaux n'ont pas de place dans nos plus hauts conseils."
 SOV_exclude_zhukov_from_presidium_amp_remove_from_minister_of_defence_position_desc:0 "L'action décisive du camarade Khrouchtchev retire le maréchal Joukov du Présidium et du poste de ministre de la Défense. Cette mesure renforce le contrôle civil sur l'armée, sauvegardant ainsi nos principes socialistes."
 SOV_authorize_the_6th_world_festival_of_youth_and_students_desc:0 "L'autorisation du 6ème Festival mondial de la jeunesse et des étudiants témoigne de notre engagement en faveur de la solidarité internationale. Des jeunes du monde entier se rassembleront pour célébrer la paix, l'amitié et les idéaux socialistes."
 SOV_elect_new_presidium_members_desc:0 "Dans le cadre d'un processus démocratique, nous élisons de nouveaux membres du Présidium sous la direction du camarade Khrouchtchev. Les nouvelles voix de notre plus haut conseil façonneront la voie de notre nation vers le progrès et la prospérité."
 SOV_force_hospitalization_for_the_socially_dangerous_desc:0 "La détermination du camarade Khrouchtchev à protéger notre société conduit à l'hospitalisation forcée de personnes socialement dangereuses. Cette mesure humanitaire vise à fournir un traitement et une réadaptation à ceux qui en ont besoin."
 SOV_limited_thaw_on_arts_desc:0 "Vivez un dégel limité dans les arts sous la direction du camarade Khrouchtchev. Cette période d'ouverture culturelle encourage l'expression créative dans les limites du réalisme socialiste, enrichissant notre héritage culturel."
 SOV_xxith_cpsu_congress_desc:0 "Au XXIe Congrès du PCUS, la direction du camarade Khrouchtchev brille de mille feux. Nous consolidons nos acquis et traçons la voie vers un avenir socialiste meilleur, guidés par les principes du marxisme-léninisme."
 SOV_close_gulags_institution_desc:0 "Sous la direction du camarade Khrouchtchev, nous fermons l'institution du Goulag, symbolisant notre engagement en faveur des droits de l'homme et de la justice. L'ère de la répression touche à sa fin alors que nous luttons pour une société plus humaine."
 SOV_imprison_religious_heads_desc:0 "L'emprisonnement des chefs religieux est une étape décisive dans notre cheminement vers la laïcité. La politique du camarade Khrouchtchev garantit que la religion reste séparée des affaires de l'État."
 SOV_demolish_churches_desc:0 "Dans une démarche progressiste, nous démolissons des églises pour renforcer notre engagement envers l'athéisme et le matérialisme scientifique. La vision du camarade Khrouchtchev ouvre la voie à une société laïque."
 SOV_rename_cities_named_after_stalin_desc:0 "L'engagement du camarade Khrouchtchev en faveur de la déstalinisation est évident lorsque nous renommons les villes du nom de Staline. Cet acte symbolique représente la transformation de notre nation vers une société plus ouverte et plus juste."
 SOV_devaluation_of_the_rubles_desc:0 "La dévaluation prévue du rouble reflète l'engagement du camarade Khrouchtchev en faveur des réformes économiques. Cette mesure vise à renforcer notre monnaie et à renforcer la stabilité financière de notre pays."
 SOV_divide_oblast_level_party_committees_into_parallel_structures_desc:0 "Le camarade Khrouchtchev introduit des structures parallèles pour les comités du Parti au niveau oblast, favorisant l'efficacité et la coopération dans la gouvernance régionale, garantissant ainsi un État soviétique plus fort."
 SOV_establishment_of_specialized_high_schools_for_gifted_students_desc:0 "La clairvoyance du camarade Khrouchtchev conduit à la création d'écoles supérieures spécialisées pour les étudiants doués. Ces institutions nourrissent les jeunes talents, assurant ainsi un avenir radieux à notre nation."
 SOV_deal_with_the_drought_desc:0 "Sous la direction du camarade Khrouchtchev, nous affrontons de front les défis de la sécheresse. Des solutions innovantes et des efforts collectifs atténueront ses effets, préservant ainsi notre abondance agricole."
 SOV_push_for_increase_in_meat_production_desc:0 "La vision du camarade Khrouchtchev s'étend jusqu'à la table du dîner ! Une pression en faveur d'une production accrue de viande garantit une population soviétique plus prospère et plus nourrie, renforçant ainsi notre mode de vie socialiste."
 SOV_reorganise_sovnarkhoz_desc:0 "La vision de l'efficacité du camarade Khrouchtchev s'étend à Sovnarkhoz. Grâce à la réorganisation, nous optimisons la gestion de nos économies régionales, favorisant ainsi la croissance et la prospérité."
 SOV_develop_residential_buildings_desc:0 "Soyez témoin de la construction de nouveaux bâtiments résidentiels sous la direction du camarade Khrouchtchev. Ces complexes de logements modernes améliorent la vie des citoyens soviétiques en leur offrant confort et commodité."
 SOV_establish_soviet_weekends_desc:0 "Le camarade Khrouchtchev défend l'instauration de week-ends soviétiques, offrant à nos citoyens travailleurs un repos et des loisirs bien mérités, renforçant ainsi leur engagement envers la cause socialiste."
 SOV_build_regional_thermal_power_plants_desc:0 "Sous la direction du camarade Khrouchtchev, nous nous engageons dans la construction de centrales thermiques régionales. Ces sources d'énergie assurent un approvisionnement constant en électricité dans tous les coins de notre vaste pays."
 SOV_commission_novovoronezh_and_beloyarsk_nuclear_power_plants_desc:0 "En témoigne la mise en service des centrales nucléaires de Novovoronej et de Beloyarsk, symboles de nos prouesses technologiques et de notre indépendance énergétique selon la vision du camarade Khrouchtchev."
 SOV_reduce_working_time_to_8_hours_a_day_desc:0 "L'engagement du camarade Khrouchtchev en faveur du bien-être de nos travailleurs conduit à une réduction du temps de travail. Cette politique progressiste garantit un meilleur équilibre entre vie professionnelle et vie privée pour tous les citoyens soviétiques."
 SOV_increase_the_minimum_wages_of_workers_and_employees_desc:0 "Dans une démarche visant à relever la classe ouvrière, le camarade Khrouchtchev augmente le salaire minimum des ouvriers et des employés. Cette initiative vise à améliorer le niveau de vie et à assurer la prospérité du peuple soviétique."
 SOV_search_for_effective_deposits_of_minerals_desc:0 "Le dévouement du camarade Khrouchtchev à l'exploration des ressources est le moteur de notre recherche de gisements minéraux efficaces. Cet effort renforce notre base industrielle et garantit des ressources précieuses pour notre nation."
 SOV_focus_on_the_chemical_industry_desc:0 "La vision du camarade Khrouchtchev s'étend à l'industrie chimique, pierre angulaire de notre force économique. En donnant la priorité à la production chimique, nous renforçons notre position de puissance industrielle mondiale."
 SOV_establish_pensions_for_collective_farmers_desc:0 "Sous la direction du camarade Khrouchtchev, nous reconnaissons les contributions des kolkhoziens. La mise en place de retraites assure leur bien-être et témoigne de notre gratitude pour leur dévouement à l'agriculture."
 SOV_establish_new_institutes_for_the_ukrainian_academy_cf_sciences_desc:0 "L'engagement du camarade Khrouchtchev en faveur du progrès scientifique est évident lorsqu'il crée de nouveaux instituts pour l'Académie ukrainienne des sciences. Ces centres de connaissances propulsent notre nation vers un avenir meilleur."
 SOV_extend_heavy_industry_around_the_union_desc:0 "Soyez témoin de l'expansion de l'industrie lourde dans toute notre vaste Union sous la direction du camarade Khrouchtchev. Cette expansion garantit une base industrielle solide et une prospérité économique pour tous."
 SOV_kachkanar_mining_and_processing_plant_in_the_urals_desc:0 "L'usine minière et de transformation de Kachkanar, dans l'Oural, témoigne de l'industrie soviétique. Sous la direction du camarade Khrouchtchev, cette installation assure un approvisionnement constant en ressources essentielles."
 SOV_karaganda_metallurgical_plants_desc:0 "La vision du camarade Khrouchtchev en matière de croissance industrielle inclut les usines métallurgiques de Karaganda. Ces centres de production soutiennent notre industrie sidérurgique, soutenant la construction d'un État socialiste puissant."
 SOV_expand_hydroelectric_power_grid_desc:0 "Rejoignez-nous pour développer le réseau hydroélectrique sous la direction du camarade Khrouchtchev. Cette initiative exploite l'énergie de nos rivières, fournissant de l'électricité même aux régions les plus reculées de notre Union."
 SOV_increase_natural_gas_production_in_ukraine_desc:0 "L'engagement du camarade Khrouchtchev en faveur de la sécurité énergétique conduit à une augmentation de la production de gaz naturel en Ukraine. Cette ressource précieuse renforce notre nation et assure le bien-être de nos citoyens."
 SOV_expand_fertilizer_production_desc:0 "En témoigne l'expansion de la production d'engrais sous la direction du camarade Khrouchtchev. Cette industrie essentielle soutient notre secteur agricole, assurant la production alimentaire de notre État socialiste."
 SOV_commission_the_kiev_metro_desc:0 "La mise en service du métro de Kiev témoigne du progrès soviétique. Sous la direction du camarade Khrouchtchev, ce système de transport moderne relie les citoyens de notre capitale et favorise le développement urbain."
 SOV_review_khrushchev_plans_desc:0 "Dans une revue critique des plans de Khrouchtchev, nous évaluons l'orientation de notre nation. La politique du camarade Khrouchtchev est scrutée à la loupe alors que nous traçons la voie vers un avenir socialiste prospère."
 SOV_the_soviet_armed_forces_desc:0 "Les forces armées soviétiques, sous la direction du camarade Khrouchtchev, sont prêtes à défendre notre patrie socialiste. Avec la modernisation et les réformes, nous garantissons la sécurité et la force de notre nation."
 SOV_improve_mobile_aa_desc:0 "L'engagement du camarade Khrouchtchev en faveur de la défense conduit à l'amélioration des unités antiaériennes mobiles. Ces avancées renforcent nos capacités militaires et préservent le ciel de notre grand État socialiste."
 SOV_the_soviet_air_force_desc:0 "L'armée de l'air soviétique atteint de nouveaux sommets sous la direction du camarade Khrouchtchev. La modernisation et l'expansion assurent notre domination dans le ciel, protégeant les idéaux socialistes qui nous sont chers."
 SOV_research_high_speed_bombers_desc:0 "Notre dévouement au progrès technologique transparaît dans nos recherches sur les bombardiers à grande vitesse sous la direction du camarade Khrouchtchev. Ces avions assureront notre défense nationale et renforceront notre position mondiale."
 SOV_invest_in_traditional_aircraft_desc:0 "Les investissements stratégiques du camarade Khrouchtchev renforcent nos capacités aéronautiques traditionnelles. Ces avions fiables constituent la pierre angulaire de la défense de notre nation, protégeant notre mode de vie socialiste."
 SOV_restart_the_flying_submarine_program_desc:0 "Sous la direction du camarade Khrouchtchev, nous relançons le programme des sous-marins volants. Ces merveilles sous-marines renforceront nos capacités navales et démontreront notre engagement en faveur de l'innovation."
 SOV_the_tu_114_propaganda_campaign_desc:0 "La campagne de propagande Tu-114 met en valeur l'ingéniosité et les prouesses technologiques soviétiques. La vision du camarade Khrouchtchev concernant cet avion renforce notre statut de leader mondial de l'aviation."
 SOV_adopt_the_mig_15_desc:0 "En témoigne l'adoption du Mig-15, symbole de notre engagement en faveur de l'excellence militaire sous la direction du camarade Khrouchtchev. Ce formidable avion renforce notre défense nationale."
 SOV_the_soviet_army_desc:0 "L'armée soviétique, guidée par la direction du camarade Khrouchtchev, se présente comme un fervent défenseur de notre patrie socialiste. Grâce à la modernisation et aux réformes, nous garantissons la force et l'état de préparation de nos forces armées."
 SOV_adopt_the_akm_desc:0 "L'adoption de l'AKM, une arme fiable et puissante, démontre notre engagement en faveur d'une armée bien équipée sous la direction du camarade Khrouchtchev. Nos soldats sont équipés pour défendre nos idéaux socialistes."
 SOV_modernize_surface_to_air_missiles_desc:0 "Dans le cadre de la vision du camarade Khrouchtchev, nous modernisons nos missiles sol-air. Ces formidables défenses protègent notre espace aérien et assurent la sécurité de notre grand État socialiste."
 SOV_advanced_atgm_designs_desc:0 "L'engagement du camarade Khrouchtchev en faveur de l'innovation militaire conduit à des conceptions avancées de missiles guidés antichar (ATGM). Ces armes de pointe renforcent nos forces terrestres et dissuadent les adversaires potentiels."
 SOV_invest_in_the_t55_desc:0 "Rejoignez-nous pour investir dans le char T55, symbole des prouesses militaires soviétiques sous la direction du camarade Khrouchtchev. Ces formidables chars renforcent nos forces terrestres, assurant la défense de notre patrie socialiste."
 SOV_the_bmp_desc:0 "Le BMP, sous la direction du camarade Khrouchtchev, révolutionne le combat d'infanterie. Ce véhicule blindé de combat améliore la mobilité et la puissance de feu de nos forces terrestres, préservant ainsi nos idéaux socialistes."
 SOV_project_659_desc:0 "Le projet 659 témoigne de nos ambitions navales sous la direction du camarade Khrouchtchev. Ce projet de sous-marin avancé garantit la sécurité et la force de notre marine soviétique."
 SOV_the_soviet_navy_desc:0 "La marine soviétique, sous la direction du camarade Khrouchtchev, constitue une force formidable sur les mers. La modernisation et l'expansion assurent notre domination navale, protégeant les valeurs socialistes qui nous sont chères."
 SOV_project_627_kit_desc:0 "Le projet 627 Kit représente un bond en avant dans la technologie navale sous la direction du camarade Khrouchtchev. Ces sous-marins avancés renforcent nos capacités navales et assurent la sécurité de notre pays."
 SOV_project_672_desc:0 "Le projet 672, guidé par la vision du camarade Khrouchtchev, renforce nos capacités navales. Ces navires de guerre modernes renforcent notre présence en haute mer, sauvegardant nos principes socialistes."
 SOV_ka_25_naval_helicopter_desc:0 "L'hélicoptère naval Ka-25, merveille de l'ingénierie soviétique sous la direction du camarade Khrouchtchev, assure notre supériorité navale et renforce nos capacités maritimes."
 SOV_kolin_class_destroyer_desc:0 "En témoigne le destroyer de classe Kolin, symbole de notre engagement en faveur de la force navale sous la direction du camarade Khrouchtchev. Ces formidables navires de guerre protègent nos intérêts maritimes et nos idéaux socialistes."
 SOV_groznykynda_class_cruiser_desc:0 "Le croiseur de classe Groznykynda, sous la direction du camarade Khrouchtchev, représente nos ambitions navales."
 SOV_invest_in_recon_drone_initiative_desc:0 "L'engagement du camarade Khrouchtchev en faveur de l'innovation militaire s'étend aux drones de reconnaissance. Ces technologies de pointe améliorent nos capacités de collecte de renseignements, renforçant ainsi notre défense nationale."
 SOV_focus_on_jet_interceptors_desc:0 "Sous la direction du camarade Khrouchtchev, nous nous concentrons sur les intercepteurs à réaction pour protéger notre ciel. Ces avions à grande vitesse renforcent nos capacités de défense aérienne et protègent notre patrie socialiste." 
 SOV_prioritize_high_speed_interceptors_desc:0 "La vision du camarade Khrouchtchev concernant les intercepteurs à grande vitesse renforce nos capacités de défense aérienne. Ces avions avancés garantissent notre souveraineté et protègent les idéaux socialistes qui nous sont chers."
 

 SOV_KHR.1.t:0 "Controverses monumentales"
 SOV_KHR.1.desc:0 "Au milieu de la campagne déterminée et controversée de Khrouchtchev en faveur de la déstalinisation, elle bat son plein. Avec le changement de nom de villes cruciales, la destruction des monuments de l'ère stalinienne fait l'objet de la dernière vague de déstalinisation. Alors que les observateurs occidentaux ne font que louer cette politique, et que de nombreux pays occidentaux la regardent avec espoir, le consensus interne est beaucoup moins unifié. Si nombreux sont ceux qui saluent le changement, nombreux sont ceux qui ne sont pas encore convaincus par le discours secret et cherchent à trouver des moyens d'empêcher la démolition de ces monuments. Malgré cela, l'élan des réformes de Khrouchtchev ne ralentira probablement pas de si tôt, à moins qu'une opposition interne majeure ne se lève."
 SOV_KHR.1.a:0 "Inquiétant."

 SOV_KHR.2.t:0 "Purger les échos inversés"
 SOV_KHR.2.desc:0 "À mesure que les cicatrices laissées par les purges de Staline deviennent de plus en plus visibles, les efforts visant à les guérir deviennent de plus en plus visibles. Les crimes de Staline étant de plus en plus connus, Khrouchtchev cherche à se distancer davantage de son prédécesseur en levant l'exil d'innombrables individus. Compte tenu du volume considérable des purges historiques qui rendent impossible le retour de tout le monde en même temps ou la restauration des rangs et des positions de tous les exilés, leur permettre de retourner dans leur pays d'origine est un premier pas reconnaissable vers la réconciliation et vers l'obtention de la confiance du monde occidental. Reste à savoir si Khrouchtchev cherchera à lever l'exil sur une nouvelle vague d'individus dans le futur, mais ce qui est clair est que les paroles enflammées de Khrouchtchev sont plus que de simples paroles."
 SOV_KHR.2.a:0 "Bien."

 SOV_KHR.3.t:0 "Poursuite des efforts de réintégration"
 SOV_KHR.3.desc:0 "Avec le retour récent des peuples exilés, chassés de leurs foyers et de leurs positions dans la société sous la cruauté et la paranoïa du règne de Staline, Khrouchtchev a annoncé son intention de lever l'exil d'encore plus de personnes déplacées. Alors que l'Occident continue de saluer l'initiative de Khrouchtchev et ses efforts pour corriger les nombreux crimes de son prédécesseur, le gouvernement soviétique est beaucoup moins uni. Même si le parti reste fidèle à Khrouchtchev, nombreux sont ceux qui se demandent où exactement cet afflux de population va s'installer, et comment. Cependant, cette question reste sans réponse et, pour l'instant, l'objectif principal semble simplement être de corriger les erreurs du passé."
 SOV_KHR.3.a:0 "Parfait."

 SOV_KHR.4.t:0 "Dilemme de la patrie"
 SOV_KHR.4.desc:0 "Avec l'afflux massif d'exilés de retour, une question qui tourmente les esprits du parti ainsi que les exilés eux-mêmes a rapidement pris de l'importance. C'est là que s'installèrent les exilés revenus. Les exilés eux-mêmes cherchent à regagner leurs foyers légitimes dans le Caucase. Bien que l'idée semble justifiée sur le papier et gagnerait probablement davantage les faveurs de l'Occident, ce n'est pas aussi simple que cela. Au moment de l'exil de ces peuples, les terres ont été réinstallées et repeuplées. Alors que les exilés eux-mêmes persistent dans leur demande de rentrer chez eux, nous ne pouvons pas simplement forcer les nouveaux colons à quitter leurs foyers, sinon nous signalerions un retour à la brutalité de Staline. D'un autre côté, de nombreux partisans de la ligne dure du parti et les résidents actuels installés dans le Caucase ont proposé d'installer les exilés au Kazakhstan. Tout comme la première solution, elle semble bonne sur le papier. Personne ne sera forcé de quitter son foyer, sans compter qu'il existe un espace excédentaire prêt à accueillir les exilés. Cependant, en réalité, très peu d'exilés rapatriés soutiennent cette solution, car ils souhaitent retourner là où ils ont été exilés. Sans oublier que nous en enverrions effectivement beaucoup pour peupler un désert encore en développement. Aucun des deux choix n'est joli, mais un choix doit être fait malgré tout. Soit vous soutenez les exilés et les laissez rentrer chez eux aux dépens des personnes qui y vivent actuellement, soit vous construisez une nouvelle communauté au Kazakhstan aux dépens des exilés."
 SOV_KHR.4.a:0 "Soutenir les retours en exil"
 SOV_KHR.4.b:0 "Installez-les au Kazakhstan"

 SOV_KHR.5.t:0 "Les retours des exilés"
 SOV_KHR.5.desc:0 "Malgré la proposition des derniers partisans de la ligne dure et des populations déjà installées dans le Caucase, le parti a décidé de laisser les exilés retourner dans leurs foyers légitimes. Même s'il y a une hostilité croissante à notre égard dans la région, elle n'est pas assez grande pour qu'on en prenne note. Cela étant dit, il est très probable que la composition démographique à long terme de la région sera modifiée à jamais, et pas pour le mieux. Si l'autorité centrale se détériore, la région sera probablement confrontée à de violents conflits ethniques. Cependant, l'Union soviétique ne quittera pas la région de sitôt. La situation reste donc stable et nous avons assuré la loyauté des exilés de retour. Ce résultat est une victoire définitive pour Khrouchtchev et son groupe croissant de réformistes, ainsi qu'une victoire en matière de relations publiques aux yeux du monde occidental"
 SOV_KHR.5.a:0 "Fantastique."

 SOV_KHR.6.t:0 "Création du nouvel ASSR"
 SOV_KHR.6.desc:0 "Même si Khrouchtchev était favorable au retour des exilés chez eux, il n'a finalement pas réussi à obtenir suffisamment de soutien pour les exilés au sein du parti dans son ensemble. En fin de compte, même sans la pression des derniers partisans de la ligne dure, le parti n'a pas vu l'intérêt de provoquer inutilement la colère de la population soviétique loyale au sein du caucus, ni de modifier inutilement la composition démographique de la région pour rien de plus que ce qui peut être décrit comme un coup de pub glorifié. Ainsi, malgré les protestations des exilés eux-mêmes, la population des exilés est trop petite pour constituer une menace majeure pour l'autorité soviétique, et ils seront probablement incapables même de s'organiser car ils sont dispersés à travers le Kazakhstan. Malgré cela, comme prévu, l'Occident a publiquement dénoncé cette décision comme un retour à la politique stalinienne et se demande à quoi sert la levée de l'exil si les exilés ne peuvent même pas rentrer chez eux. Quoi qu'il en soit, il s'agit d'une nette victoire pour les partisans de la ligne dure du parti, et cela n'a fait que contribuer à consolider leur position au sein du parti."
 SOV_KHR.6.a:0 "Fantastique."

 SOV_KHR.7.t:0 "Reprise de la Spartakiade"
 SOV_KHR.7.desc:0 "La Spartakiade elle-même existe depuis 1928 en tant qu'événement sportif international, permettant à des personnes du monde entier de concourir. Cependant, après avoir été suspendue en raison de la Seconde Guerre mondiale et maintenant face à l'hostilité croissante sur la scène mondiale en raison de la guerre froide toujours présente, la Spartikiade telle qu'elle était est intenable. Cependant, depuis 1956, il a été décidé que les jeux devraient revenir avec un nouveau sens et un nouveau but. Désormais, les jeux seront un moyen de promouvoir l'unité et la fraternité au sein du bloc de l'Est. Alors que la toute première des nouvelles Spartakiades aura bientôt lieu, de nombreuses personnes dans le bloc de l'Est attendent avec impatience et enthousiasme"
 SOV_KHR.7.a:0 "Le nouvel homme socialiste !"

 SOV_KHR.8.t:0 "Le sort de Molotov"
 SOV_KHR.8.desc:0 "Malgré les tensions entre Khrouchtchev et Molotov et la ligne dure et stalinienne de Molotov, Khrouchtchev n'a pas encore réussi à le forcer, lui et ses alliés, à quitter le parti. Cependant, la lutte de pouvoir croissante entre Khrouchtchev et Molotov n'a pas échappé aux yeux du bureau politique dans son ensemble, qui est maintenant confronté à la décision de nommer Molotov au poste de ministre des Affaires étrangères. Ce qui rend le choix plus complexe pour le bureau politique, c'est qu'il n'est pas clair à qui profite le plus de l'acceptation ou du refus de Molotov pour le rôle. D'une part, l'accepter limiterait la présence physique de Molotov à Moscou et pourrait rendre certains de ses alliés vénérables. D'un autre côté, cela augmentera sensiblement sa position et son rang au sein du parti, et lui permettra de manoeuvrer plus efficacement ses alliés. Il est également clair que Molotov est tout aussi qualifié pour ce rôle, puisqu'il a occupé des postes similaires pendant une grande partie de sa vie politique dans le passé, et qu'avoir quelqu'un avec son expérience dans ce rôle profiterait probablement à l'ensemble de l'Union soviétique. Même si la décision est difficile, elle ne peut plus être reportée. "
 SOV_KHR.8.a:0 "Molotov s'en va."
 SOV_KHR.8.b:0 "Molotov reste."

 SOV_KHR.9.t:0 "Construction de barrages"
 SOV_KHR.9.desc:0 "Avec les ambitions à long terme de Khrouchtchev pour l'Union soviétique, le secteur de l'énergie n'est pas négligé, car le parti est confronté à une décision difficile. Même si le recours aux combustibles fossiles ou à des sources de production d'énergie plus traditionnelles serait certainement moins cher et plus rapide, les avantages à long terme sont, au mieux, minimes, et cela enfermerait probablement la nation dans un cycle sans fin de construction de nouvelles centrales toutes les quelques années. Cependant, l'énergie hydroélectrique s'est révélée beaucoup plus prometteuse à long terme, car non seulement sa production est nettement plus élevée, mais elle est également beaucoup plus facile à mettre à niveau au fil du temps pour répondre à la demande. Sans parler des vastes rivières et rivières qui traversent l'Union soviétique, ce qui en fait l'endroit idéal pour de telles plantes. Cela soulève bien sûr le problème inattendu de savoir où exactement les construire. Les répartir sporadiquement dans l'ensemble de l'Union mènerait au désastre et n'entraînerait aucun impact économique notable pour l'Union. Mais en fin de compte, un choix doit être fait, et le parti choisit de les intégrer..."
 SOV_KHR.9.a:0 "...Russie"
 SOV_KHR.9.b:0 "...Kazakhstan"
 SOV_KHR.9.c:0 "...Ukraine"

 SOV_KHR.10.t:0 "Le miracle de Riazan."
 SOV_KHR.10.desc:0 "Avec le slogan ambitieux de Khrouchtchev « Rattraper et dépasser » et son objectif de dépasser les États-Unis en termes de croissance économique et d'établir pleinement le communisme d'ici 1980, la région de Riazan s'est fixé pour objectif de tripler la quantité de production de viande d'ici la fin de l'année. Bien que nombreux soient ceux qui prétendent que cela est complètement impossible, il est clair que l'initiative ne montre aucun signe d'arrêt, surtout après que Khrouchtchev lui-même a personnellement approuvé l'objectif, après que le premier secrétaire de l'Obkom de Riazan a personnellement promis à Khrouchtchev qu'ils pourraient le faire en personne. Les économistes soviétiques et les observateurs internationaux ne peuvent plus que regarder en retenant leur souffle et espérer un miracle."
 SOV_KHR.10.a:0 "Intrigant."

 SOV_KHR.11.t:0 "Le miracle de Riazan !"
 SOV_KHR.11.desc:0 "À la surprise de nombreux membres du parti, il semble que Riazan ait réussi à réaliser le miracle promis, puisqu'ils ont triplé leur production annuelle de viande. Cela étant dit, ce succès a été altéré en raison des méthodes utilisées pour atteindre cet objectif. Après avoir réduit le nombre de bovins dans la région de plus de 65 %, la production totale de viande de la région a chuté à seulement 30 000 tonnes. En outre, de nombreux kolkhoziens dont le bétail privé a été « temporairement approprié » pour réaliser ce miracle refusent désormais de transformer leurs terres kolkhoziennes, réduisant de moitié la production céréalière de la région. Malgré ces revers, toute famine majeure a été évitée et Riazan, ne serait-ce que par des aspects techniques, a réalisé son miracle."
 SOV_KHR.11.a:0 "Cela ne semble pas très efficace."

 SOV_KHR.12.t:0 "Le désastre de Riazan."
 SOV_KHR.12.desc:0 "Comme on pouvait s'y attendre, Riazan n'a pas tenu ses promesses et le miracle nécessaire ne s'est pas matérialisé. Pire encore, dans leurs efforts pour atteindre leurs objectifs, plus de 65 % du bétail de la région a été abattu et la production céréalière de la région a diminué de près de la moitié de ce qu'elle était au cours des trimestres précédents. Avec les kolkhoziens en armes et la production alimentaire paralysée non seulement à Riazan, mais aussi dans plusieurs régions voisines, cherchant à imiter Riazan, l'Union soviétique semble être plongée dans une nouvelle famine. Même s'il reste à voir les ravages d'une telle famine, ce que l'on sait avec certitude, c'est que la position de Khrouchtchev au sein du parti a reçu un coup irrémédiable."
 SOV_KHR.12.a:0 "Envoyez de l'aide aux affamés."

 SOV_KHR.16.t:0 "Sixième Festival mondial de la jeunesse et des étudiants"
 SOV_KHR.16.desc:0 "Malgré ce que beaucoup prétendent, le soi-disant « dégel de Khrouchtchev » a déjà commencé à porter ses fruits, comme en témoigne le « Sixième Festival mondial de la jeunesse et des étudiants » (ou tout simplement le VIe Festival mondial). Les réformes de Khrouchtchev et la promotion de l'amitié avec le monde occidental ont permis à des peuples du monde entier de se rendre à Moscou pour célébrer et embrasser la solidarité de tous les peuples, la lutte pour la démocratie et la lutte contre l'impérialisme. Bien que techniquement, les jeux existent depuis 1947, c'est la première fois que l'événement atteint la scène mondiale. Malgré la menace imminente de la guerre froide, nous espérons que le Festival mondial sera un événement toujours présent pour apporter de la légèreté et de l'espoir à un monde de plus en plus sombre."
 SOV_KHR.16.a:0 ""

 SOV_KHR.17.t:0 "Début de l'hospitalisation forcée"
 SOV_KHR.17.desc:0 "Malgré les efforts de Khrouchtchev en faveur de la déstalinisation et sa prise de distance par rapport aux crimes passés du régime, il est tout à fait clair que la liberté politique exprimée dans le monde occidental n'a toujours pas sa place en Union soviétique et qu'une certaine forme de châtiment corporel pour les dissidents du parti est nécessaire. En tant que tel, Khrouchtchev a parrainé une manière plus humaine de traiter ces dissidents que les camps de travaux forcés sous le défunt Joseph Staline, en plaçant les dissidents dans des établissements psychiatriques. Non seulement c'est beaucoup plus humain que les goulags historiques, et cela permet à Khrouchtchev de sauver la face au niveau international, mais cela permet en outre au parti de se légitimer davantage aux yeux du peuple soviétique, en permettant aux ennemis de l'État d'être qualifiés de malades mentaux, avant d'être hospitalisés de force."
 SOV_KHR.17.a:0 "Voilà pour la déstalinisation."

 SOV_KHR.18.t:0 "XXIIe Congrès du PCUS"
 SOV_KHR.18.desc:0 "Après trois ans, les fruits du mandat de Khrouchtchev en tant que leader incontesté de l'Union soviétique ont commencé à porter leurs fruits. Cependant, malgré ses succès, la désunion persiste au sein du parti et les échecs de la politique de Khrouchtchev ont également été mis en lumière. En commençant fort, en célébrant l'ouverture de la plus grande centrale hydroélectrique du monde, la centrale hydroélectrique de Volgograd, et en discutant du succès du Tsar Bomba, les fissures au sein du parti sont devenues apparentes lorsque Khrouchtchev a annoncé son ambition de dessaler plusieurs villes stalinisées supplémentaires et de retirer le corps de Staline du mausolée de Lénine. Cependant, ce qui semblait être au premier plan des discussions était le plan proposé par Khrouchtchev visant à « construire le communisme en 20 ans ». L'aspect de ce plan proposé qui semble rendre nerveux la majorité des membres du parti est le projet d'introduire un « renouvellement systématique des cadres », qui introduirait effectivement une limitation des mandats au sein du Parti. Pire encore, il semble que la division entre Moscou et Pékin n'ait fait que se creuser. Même s'il y a effectivement beaucoup de choses à célébrer, il est clair que le camarade Khrouchtchev a beaucoup de travail à faire s'il veut réussir à concrétiser sa vision pour les peuples soviétiques."
 SOV_KHR.18.a:0 "Il perd beaucoup de soutien au sein de son parti."

 SOV_KHR.19.t:0 "XXIe Congrès du PCUS"
 SOV_KHR.19.desc:0 "Le 21e Congrès du Parti communiste de l'Union soviétique est un congrès extraordinaire convoqué par nécessité à la suite de l'échec du coup d'État du « Groupe anti-parti », alors que Khrouchtchev cherche à consolider davantage son autorité. Le congrès lui-même a vu l'annonce des ambitions de Khrouchtchev : « Plan à 7 ans ». Le plan de sept ans prévoit une multiplication par cinq du revenu national par rapport aux niveaux de 1940 et une augmentation des revenus réels des travailleurs et des exploitants de fermes collectives d'environ 40 %. Il est également prévu de développer des bâtiments résidentiels et d'agrandir les crèches, les jardins d'enfants, les internats et les maisons de retraite. La semaine de travail devrait être réduite à 40 heures d'ici 1962 et à 35 à 30 heures de 1964 à 1968. De plus, lors du congrès, Khrouchtchev cherche à faciliter davantage une Allemagne unifiée, ainsi qu'à promouvoir la création d'une « zone libre atomique » en Europe. Enfin, le Congrès s'est terminé par la dénonciation de l'écart de la Yougoslavie par rapport aux idéaux léninistes, ainsi que par la signature d'accords économiques fondamentaux avec la Chine pour l'aider à se relever du désastre du « Grand Bond en avant ». Les ambitions de Khrouchtchev étant clairement exposées, il reste à voir si elles seront un jour réalisées."
 SOV_KHR.19.a:0 "Il a enfin révélé ses véritables ambitions."

 SOV_KHR.20.t:0 "Arrestation de dirigeants religieux"
 SOV_KHR.20.desc:0 "Avec la montée des campagnes antireligieuses de Khrouchtchev, beaucoup a déjà été fait pour paralyser le pouvoir des autorités et des institutions religieuses en Union soviétique. Même si l'aversion de Khrouchtchev pour la religion a toujours été bien connue, il semble que Khrouchtchev n'ait fait qu'intensifier sa politique avec l'arrestation de plusieurs chefs religieux à travers le pays. Bien qu'elle ait été vivement condamnée au niveau international, il semble que la campagne antireligieuse ne montre aucun signe d'arrêt."
 SOV_KHR.20.a:0 "Inquiétant."

 SOV_KHR.21.t:0 "La purge religieuse s'intensifie"
 SOV_KHR.21.desc:0 "Les campagnes antireligieuses de Khrouchtchev, au grand mépris du monde occidental, ne semblent que s'intensifier. Alors qu'un nombre record d'églises et de lieux saints étaient déjà fermés, Khrouchtchev a ordonné un nombre record de démolitions qui n'ont fait que monter en flèche. Malgré des résistances croissantes, la campagne antireligieuse ne voit aucun signe d'arrêt"
 SOV_KHR.21.a:0 "Intéressant."

 SOV_KHR.22.t:0 "Déstalinisation : campagne de changement de nom"
 SOV_KHR.22.desc:0 "Alors que Khrouchtchev consolide son pouvoir à la suite de son discours secret, il semble qu'il ait l'intention de tenir parole et d'orienter le PCUS vers la déstalinisation, les noms des villes de l'Union portant le nom du défunt dictateur et de ses alliés étant sur le point de voir leurs anciens noms restaurés ou de se voir attribuer de nouveaux noms. Des villes comme Stalingrad, Stalino, Stalinabad et d'autres verront leur nom modifié, tandis que d'autres, comme Leningrad et Kalinin, conserveront leur ancien nom. Reste à savoir s'il s'agit simplement d'une décision ponctuelle ou si elle marque une tendance plus large vers une éventuelle libéralisation de l'Union soviétique, mais elle a au moins suscité la curiosité et l'espoir du monde occidental."
 SOV_KHR.22.a:0 "A bas le tyran !"

 SOV_KHR.26.t:0 "Expansion de l'industrie chimique"
 SOV_KHR.26.desc:0 "Alors que la politique économique de Khrouchtchev avance avec succès et échecs, il revient au parti de décider où jeter les bases d'une industrie chimique nouvelle et élargie. Cependant, le parti reste indécis et les dirigeants locaux de la RSS cherchent également à plaider en faveur de la construction d'usines chimiques sur leurs territoires. De nombreux membres du parti estiment que les économies du Caucase devraient être davantage développées et diversifiées, tandis que d'autres estiment qu'elles devraient rester proches de Moscou, en Russie centrale. Cependant, il est avantageux de développer une industrie en Ukraine ou dans les pays baltes. Le parti reste au point mort, il faudra finalement qu'ils en décident."
 SOV_KHR.26.a:0 "...Moscou et la Russie centrale"
 SOV_KHR.26.b:0 "...le Caucase"
 SOV_KHR.26.c:0 "...Ukraine"
 SOV_KHR.26.d:0 "...les pays baltes"

 SOV_KHR.27.t:0 "Investissement dans l'industrie lourde"
 SOV_KHR.27.desc:0 "Alors que Khrouchtchev continue d'éloigner le parti de la politique de Staline, sa poussée en faveur de l'industrialisation est l'une des rares choses à rester préservée, ou du moins un aspect de celle-ci. Même si l'Union soviétique est une superpuissance industrielle, toutes les régions ne sont pas égales à cet égard, et comme Khrouchtchev ordonne l'expansion de l'industrie lourde de l'Union, il revient au parti de décider en fin de compte où elle sera construite. Certains membres du parti estiment qu'il devrait être construit en Russie centrale, car ce serait en fin de compte le choix le plus simple. Cependant, d'autres membres du parti cherchent à diversifier davantage les économies du Caucase et à modifier davantage la région, car elle abrite certaines des communautés les plus pauvres de l'Union. D'autres membres du parti soutiennent que l'Ukraine serait le meilleur choix pour déplacer davantage l'industrie vers les régions occidentales de l'URSS. Dans le même ordre d'idées, d'autres estiment que l'industrie lourde doit être développée dans les États baltes pour moderniser davantage la région et fidéliser leur pays. Alors que le parti reste au point mort, le verdict final est finalement..."
 SOV_KHR.27.a:0 "...Russie centrale"
 SOV_KHR.27.b:0 "...le Caucase"
 SOV_KHR.27.c:0 "...Ukraine"
 SOV_KHR.27.d:0 "...les pays baltes"
 