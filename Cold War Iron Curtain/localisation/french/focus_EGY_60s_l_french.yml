 EGY_60s_a_new_princess_desc:0 ""
 EGY_60s_exploit_egyptian_growth:0 "Exploiter la croissance économique égyptienne"
 EGY_60s_exploit_egyptian_growth_desc:0 "L'économie égyptienne a considérablement augmenté depuis le coup d'État des officiers libres, peut-être devrions-nous exploiter cette chance"
 EGY_60s_free_markets_desc:0 "Plus le marché est libre, plus le peuple égyptien est libre"
 EGY_60s_free_markets:0 "Libérez nos marchés"
 EGY_60s_modern_equipment:0 "Équipement moderne"
 EGY_60s_modern_equipment_desc:0 "Nos équipements ne sont pas assez performants pour satisfaire notre économie"
 EGY_60s_found_free_trade_among_mediterranean_neighbors:0 "Instauration du libre-échange entre voisins méditerranéens"
 EGY_60s_found_free_trade_among_mediterranean_neighbors_desc:0 "Si nous commerçons avec nos voisins méditerranéens, nous deviendrons la meilleure économie du Moyen-Orient !"
 EGY_60s_land_reforms:0 "Réformes agraires"
 EGY_60s_land_reforms_desc:0 "Notre sol ne peut pas être utile pour faire pousser des cultures, nous devrions remédier à cela."
 EGY_60s_control_our_market_desc:0 "Notre économie doit être contrôlée pour satisfaire les besoins de notre population."
 EGY_60s_control_our_market:0 "Contrôler notre marché"
 EGY_60s_nationalize_certain_industries:0 "Nationaliser certaines industries"
 EGY_60s_nationalize_certain_industries_desc:0 "Nos militaires en bénéficieront."
 EGY_60s_boost_economic_might:0 "Stimuler la puissance économique"
 EGY_60s_boost_economic_might_desc:0 "Si nous partons en guerre, nous approvisionnerons davantage nos ennemis comme l'État sioniste."
 EGY_60s_nationalize_steel_and_rubber_industry:0 "Nationaliser l'industrie de l'acier et du caoutchouc"
 EGY_60s_nationalize_steel_and_rubber_industry_desc:0 "Lorsque nous nationaliserons cela, nous ne ralentirons peut-être pas la quantité d'avions que nous produirons"
 EGY_60s_found_el_nasr_automotive_manufacturing_company_desc:0 "Quand nous aurons commencé, il sera beaucoup plus facile de répondre aux besoins des gens avec des voitures"
 EGY_60s_found_el_nasr_automotive_manufacturing_company:0 "Création de l'entreprise de fabrication automobile El Nasr"
 EGY_60s_encourage_tourism_desc:0 "Nos grandes pyramides sont spectaculaires à voir, le tourisme fera progresser notre économie."
 EGY_60s_encourage_tourism:0 "Encourager le tourisme"
 EGY_60s_spread_culture_across_middle_east:0 "Diffuser la culture à travers le Moyen-Orient"
 EGY_60s_spread_culture_across_middle_east_desc:0 "L'Égypte a été et le sera toujours au coeur de la culture du Moyen-Orient."
 EGY_60s_counter_rising_birth_rates:0 "Contrer la hausse des taux de natalité"
 EGY_60s_counter_rising_birth_rates_desc:0 "Si nous continuons à accroître notre population, il sera difficile de nourrir tout le monde."
 EGY_60s_encourage_the_rising_birth_rate:0 "Encourager la hausse des taux de natalité"
 EGY_60s_encourage_the_rising_birth_rate_desc:0 "Si nous encourageons la hausse des taux de natalité, nous aurons plus de travailleurs pour aider notre économie !"
 EGY_60s_combat_growing_poverty:0 "Combattre la pauvreté croissante"
 EGY_60s_combat_growing_poverty_desc:0 "L'Égypte est confrontée à des problèmes de pauvreté croissante, et si nous résolvons ce problème, nous rendrons notre peuple heureux."
 EGY_60s_fix_the_infrastucture_problem:0 "Résoudre le problème d'infrastructure"
 EGY_60s_fix_the_infrastucture_problem_desc:0 "Nous devons interconnecter les zones rurales de notre pays. Nos précédents plans d'infrastructure ne nous préparaient pas à la masse d'établissements ruraux dont nous disposons."
 EGY_60s_mobilize_workers:0 "Mobiliser les travailleurs"
 EGY_60s_mobilize_workers_desc:0 "Une fois que nous aurons mobilisé nos travailleurs, nous pourrons réparer les infrastructures de construction dans toute l'Égypte."
 EGY_60s_census_efforts:0 "Efforts de recensement"
 EGY_60s_census_efforts_desc:0 "Si nous obtenons le nombre exact de personnes vivant dans notre pays, nous pourrons commencer à mettre en oeuvre des programmes qui populariseront notre gouvernement"
 EGY_60s_infastructure_efforts:0 "Efforts en matière d'infrastructures"
 EGY_60s_infastructure_efforts_desc:0 "Une fois que nous aurons l'infrastructure, nous pourrons nous connecter aux zones rurales"
 EGY_60s_production_of_arms:0 "Production d'armes"
 EGY_60s_production_of_arms_desc:0 "Si nous produisons plus d'armes que notre rival Israël, nous pouvons gagner cette guerre !"
 EGY_60s_boost_steel_industry:0 "Stimuler l'industrie sidérurgique"
 EGY_60s_boost_steel_industry_desc:0 "Notre industrie sidérurgique est insuffisante par rapport aux autres pays du Moyen-Orient. Nous devrions résoudre ce problème."
 EGY_60s_war_economy:0 "Économie de guerre"
 EGY_60s_war_economy_desc:0 "Notre économie de guerre nous permettra de vaincre plus facilement nos ennemis."
 EGY_60s_support_arab_league:0 "Soutenir la Ligue Arabe"
 EGY_60s_support_arab_league_desc:0 "Si nous soutenons nos amis du Moyen-Orient, nous pouvons rivaliser avec la puissance des Soviétiques ou des Américains qui s'ingèrent dans nos gouvernements."
 EGY_60s_one_party_system:0 "Système de parti unique"
 EGY_60s_one_party_system_desc:0 "Notre peuple ne désire pas la démocratie, le gouvernement Nasser est très populaire dans le monde arabe"
 EGY_60s_unite_egyptians_under_one_banner:0 "Unissez les Égyptiens sous une même bannière"
 EGY_60s_unite_egyptians_under_one_banner_desc:0 "Si nous unissons le peuple égyptien sous une seule bannière, nous pouvons vaincre l'État israélien"
