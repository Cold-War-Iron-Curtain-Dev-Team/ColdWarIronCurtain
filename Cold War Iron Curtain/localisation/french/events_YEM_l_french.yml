 #Yemen 1950s Events
 MagicCarpet.1.d:0 "Les journaux du monde entier ont publié des informations sur l'opération Magic Capet, qui a permis l'évacuation réussie de la communauté juive du Yémen vers Israël. En 1949, l'imam du Yémen accepta de permettre à sa communauté juive de partir, à la condition que leurs biens soient confisqués. Avec cette approbation, les gouvernements israélien, américain et britannique ont envoyé des avions de transport à Aden. Au cours de l'année suivante, 49 000 Juifs yéménites, 1 500 Juifs d'Aden et 2 000 Saoudiens ont été transportés par avion vers Israël. Cela représentait la quasi-totalité de la communauté juive de la région et représentait une grande réussite pour l'État israélien en sauvant une communauté juive en danger. Après l'émergence d'Israël en 1947, la communauté juive du Yémen a souffert d'émeutes communautaires et de pillages. En outre, l'Imam du Yémen a institué une politique de lourdes taxes et des politiques économiques sévères à l'égard de la communauté juive. Beaucoup en Israël pensent désormais qu'il est du devoir de l'État de protéger toutes les communautés juives et d'offrir un refuge chaque fois que cela est nécessaire."
 Yem.14.d:0 "L'imam du Yémen, Ahmed bin Yahya, a publiquement désigné son fils aîné, le prince Muhammad al-Badr, comme prince héritier. La décision de l'imam Ahmed a suscité la colère de nombreux membres du gouvernement, notamment parmi les frères de l'imam. Ils estiment que l'un d'entre eux mérite d'hériter du titre et que le prince al-Badr est trop jeune pour être nommé prince héritier. En outre, le jeune prince al-Badr est considéré comme très favorable à la rhétorique nationaliste arabe et devrait utiliser sa position pour renforcer l'implication du Yémen dans le monde arabe. Les responsables et les membres de la famille royale yéménites traditionalistes seraient préoccupés par les opinions du prince et espèrent qu'il comprendra que le nationalisme arabe présente un risque pour la monarchie et sa réputation séculaire en tant qu'institution politique et religieuse. Le prince al-Badr estime que son intérêt pour les nationalistes arabes assurera un avenir meilleur au Yémen et qu'il sera en mesure de contrôler ces forces à l'intérieur du pays."
 Yem.13.d:0 "Mohammad al-Badr est aujourd'hui passé du statut de prince héritier à celui d'imam du Yémen après son coup d'État réussi contre son père. Le coup d'État s'est produit après que l'imam Ahmad bin Yahya, le père d'al-Badr, se soit rendu en Italie pour suivre un traitement pendant plusieurs mois. Les rumeurs sur son état de santé ont alimenté les spéculations et le prince al-Badr a utilisé sa position de régent pour instaurer des réformes radicales pour le pays, notamment la création d'une commission parlementaire. Suivant les conseils d'officiers et de responsables nationalistes arabes, le prince al-Badr a également invité des experts égyptiens à moderniser les activités étatiques, militaires et économiques du Yémen. Plusieurs grandes tribus se sont révoltées contre la tournure des événements, conduisant à un conflit ouvert. Le retour de l'Imam Ahmad a presque inversé la tendance contre al-Badr, mais le jeune prince a réussi à tenir le coup et a vaincu les efforts de la tribu pour restaurer son père. Son pouvoir étant désormais assuré, Mohammad al-Badr s'est finalement couronné et les dirigeants traditionnels du Yémen craignent que les forces révolutionnaires déchaînées n'engloutissent bientôt la nation entière. Pour l'Imam al-Badr, ses réformes et son accession au leadership signifient les progrès continus du Yémen vers la modernisation et la renaissance du peuple yéménite."
 Yem.10.d:0 "Le gouvernement yéménite a annoncé qu'il avait abrogé le Traité d'amitié et de commerce qu'il avait conclu avec l'Union soviétique. Le traité initial établissait des liens commerciaux naissants et une reconnaissance mutuelle entre les deux pays, mais les récents efforts visant à renouveler le traité et à élargir les contacts diplomatiques ont désormais pris fin. Beaucoup pensent que cette décision marque une nette victoire des traditionalistes et des élites tribales du Yémen sur les réformistes et les factions nationalistes arabes au sein du gouvernement. Les traditionalistes pensaient que l'exposition accrue aux idées de gauche et aux idéologies révolutionnaires menaçait de transformer et d'effondrer la société yéménite. Cependant, cet échec pourrait inciter les réformistes à rechercher d'autres méthodes pour faire valoir leur programme, notamment par la rébellion ou des troubles publics. Cependant, le gouvernement yéménite serait convaincu qu'un tel résultat est hautement improbable et que si des troubles surviennent, le gouvernement s'occupera de la situation. Les partis nationalistes arabes et les États de la région examineraient leurs options sur la manière d'aider leurs alliés au Yémen."
 Yem.12.d:0 "Abdullah Yahya Hamid al-din, le frère de l'imam récemment déchu, a été officiellement couronné au Yémen. L'imam Abdallah commande désormais l'État yéménite avec le soutien de l'armée dirigée par le lieutenant-colonel Ahmed al-Thalaya. Le coup d'État a eu lieu suite à la décision d'Ahmed bin Yahya, l'ancien imam, de nommer son fils, le prince Muhammad al-Badr, prince héritier. D'éminents libéraux et réformateurs modérés ont contacté Ahmed al-Thalaya pour s'assurer qu'al-Badr ne prenne pas le trône. Al-Thalaya et sa cabale de partisans ont décidé qu'Abdullah Yahya serait le meilleur candidat pour devenir Imam car il était plus établi et perçu comme moins imprévisible que le prince al-Badr. Le jour du coup d'État, les troupes d'al-Thalaya ont encerclé le palais royal de Taiz, exigeant que l'imam Ahmed abandonne son poste au profit de son frère. L'imam Ahmed a finalement accepté, car la contre-attaque ne s'est pas concrétisée. Après son couronnement, l'Imam Abdallah a accepté les voeux de loyauté des principaux chefs de tribu, même si beaucoup sympathisent encore avec son prédécesseur. En outre, on craint que l'imam Abdallah ne soit pas en mesure de maintenir son autorité sur le lieutenant-colonel al-Thalaya et qu'au sein du palais, les partisans du prince al-Badr restent une menace puissante. L'Imam Abdullah est confronté à une tâche difficile et délicate dans ses efforts pour restaurer la stabilité de son royaume."
 Yem.20.d:0 "L'imam Ahmed ben Yahya a déclaré son désir de poursuivre la quête de sa dynastie pour l'établissement d'un Grand Yémen. La vision est de voir la restauration d'un Yémen englobant les territoires de l'État rasulide du XIIIe siècle. Le père de l'Imam Ahmed a consolidé une grande partie de ses terres mais a été bloqué par les Britanniques d'Aden et le protectorat d'Aden. En outre, l'expansion du Yémen vers le nord a été stoppée par les avancées saoudiennes dans les années 1920. L'imam Ahmed a poursuivi les ambitions de son père et a ouvertement appelé à ce que le Grand Yémen soit une mission pour tout le peuple yéménite. Les Britanniques sont de plus en plus préoccupés par la rhétorique de l'Imam, alors que les escarmouches mineures à la frontière contestée entre le Yémen et Aden semblent s'être multipliées. Ces aspirations à un Grand Yémen ont contribué à renforcer l'influence et le rôle politique de l'imam, mais ses actions ont nui aux liens avec la Grande-Bretagne et ont suscité l'inquiétude au sein du gouvernement yéménite, car des officiers trop zélés pourraient chercher à imposer une solution par les armes."
 Aden.1.d:0 "Aujourd'hui à Aden, des masses de manifestants sont descendues dans la rue pour exiger la fin de la domination coloniale britannique au Yémen. Beaucoup pensent que la poursuite de l'occupation coloniale a retardé l'inévitable unification du peuple yéménite. Les autorités britanniques restent fermes sur leur position et attribuent les troubles aux provocations venant du Yémen voisin et à la montée du sentiment nationaliste arabe dans la région. Les Britanniques sont présents à Aden et dans ses environs depuis 1839. Aden offre aux Britanniques une présence stratégique dans la région. Londres est actuellement divisée en deux camps. L'un d'entre eux soutient que le maintien de ses possessions dans la région contribue à consolider le statut continu de la Grande-Bretagne en tant que puissance mondiale et acteur régional. Pour eux, les manifestations confirment que la Grande-Bretagne doit rester pour empêcher la région de tomber aux mains d'un État yéménite hostile. Cependant, l'autre camp considère la présence britannique comme une ponction sur des ressources nationales limitées et une tache sur la position de la Grande-Bretagne dans la région. Ils considéreront sans aucun doute ces manifestations comme une preuve supplémentaire que le territoire est intenable. Quoi qu'il en soit, les manifestations soulignent l'agitation croissante dans la région."
 UAS.1.d:0 "Autre succès majeur du mouvement panarabiste et nationaliste arabe, le Yémen s'est joint à la République arabe unie (RAU) pour former les États arabes unis (UAS). Contrairement à l'arrangement fédéral de la RAU entre l'Égypte et la Syrie, la SAMU est une confédération et le Yémen conservera sa souveraineté. Ces dernières années, le Yémen a sollicité l'aide égyptienne pour contrebalancer l'Arabie saoudite et défier les Britanniques à Aden. Au Yémen, de jeunes officiers et fonctionnaires ont accueilli favorablement cette nouvelle alors que le Yémen marchait vers la modernité. En outre, ils estiment que le Yémen a désormais sa place dans le monde arabe au sens large. Les dirigeants plus traditionnels se sentent cependant mal à l'aise car la nature révolutionnaire de la RAU va à l'encontre de la manière dont les dirigeants ont dirigé le Yémen pendant des siècles. Plus important encore, ils craignent que les Égyptiens et les Syriens n'affluent bientôt et ne détruisent le mode de vie yéménite. Au sein de la RAU, la nouvelle a été bien accueillie, mais elle suscite également des inquiétudes. Le Yémen acceptera-t-il une éventuelle intégration et la RAU peut-elle réellement soutenir le montant des fonds, des équipements et du personnel nécessaires au développement du Yémen ? Au lieu de consacrer de telles ressources à la RAU, cet investissement ne serait-il pas plus efficace au niveau national ? Malgré ces réticences, la RAU et les dirigeants yéménites sont catégoriques quant à la manière dont l'UAS constituera un phare de développement et de croissance pour le monde arabe."
 Yem.5.d:0 "Le lieutenant-colonel Ahmed Yahya Al-Thalaya faisait partie de ces hauts responsables yéménites qui considéraient le fils de l'imam, le prince Badr, comme un risque pour le Yémen s'il accédait au trône. Le prince Badr était connu pour sympathiser avec les nationalistes arabes radicaux et beaucoup pensaient qu'un frère de l'imam aurait fait un meilleur héritier. Al-Thalaya a rejoint une cabale contre l'Imam et son héritier. Al-Thalaya, un haut commandant de l'armée, a mené le coup d'État visant à rétablir l'ordre au Yémen. À la tête d'un groupe d'officiers partageant les mêmes idées et de troupes loyales, Al-Thalaya a encerclé le palais royal de Taiz et, une fois aux commandes, a décidé de ne pas exécuter l'imam Ahmed et a plutôt exigé qu'il abdique en faveur de son frère. Le coup d'État a finalement échoué lorsque les tribus loyalistes dirigées par le prince Badr ont été informées de la tentative et sont arrivées pour la briser. Une fois que l'Imam Ahmed a pris le contrôle, il a immédiatement ordonné l'exécution d'Al-Thalaya et des officiers qui le soutenaient à Taiz. Le lieutenant-colonel Al-Thalaya aurait fait preuve de défi et ne s'était pas repenti de ses actes à l'issue rapide de son procès et aurait accepté son sort."
 Yem.6.d:0 "Au lendemain de l'échec du coup d'État contre l'imam Ahmed, le dirigeant yéménite a rapidement exécuté les officiers militaires et leur chef à Taiz, où la tentative de coup d'État a eu lieu. Il a décidé d'exiler ses deux frères, le prince Abdallah et le prince Abbas, à Hajjah. Les putschistes avaient exigé que l'imam Ahmed abdique en faveur de l'un de ces deux frères et il est clair que tous deux étaient impliqués dans le complot. Bien que le prince Abdallah et le prince Abbas aient vu leur statut révoqué et vivent en exil, l'imam Ahmed a décidé d'achever sa purge. Il a été révélé qu'en raison de leur rôle dans la tentative de coup d'État, les deux anciens membres de la famille royale avaient été exécutés à Hajjah. Si l'on considère les exécutions antérieures à Taiz des officiers militaires impliqués dans le coup d'État, ces dernières exécutions marquent les dernières représailles de l'imam Ahmed contre ses ennemis. Nombreux sont ceux qui affirment que les exécutions ont eu lieu pour garantir la position du prince Badr, le fils aîné de l'imam Ahmed. D'autant plus que les princes avaient déjà perdu leurs titres et étaient sous étroite surveillance."
 Yem.15.d:0 "La révolte de 1959 contre l'imam Ahmed a finalement échoué car son fils manquait des compétences politiques et de la conviction nécessaires pour prendre le pouvoir à son père qui suivait un traitement en Italie. Les rumeurs sur sa mauvaise santé ont alimenté les efforts du prince Badr pour réformer l'État selon des lignes nationalistes arabes et accroître les troubles entre les tribus. Cependant, une fois l'Imam Ahmed revenu, il a rapidement réaffirmé son contrôle sur le gouvernement et a ordonné à ses loyalistes d'écraser les tribus qui s'étaient révoltées et s'étaient emparées des territoires sans autorisation. Les forces de l'Imam Ahmed ont réussi à rétablir l'ordre et à réprimer les soulèvements autour de leurs principaux centres de révolte, Taiz et Sanaa. Les tribus autour de Taiz étaient particulièrement hostiles à l'Imam Ahmed pendant la révolte et, en guise de punition, il a décidé d'exiler leurs dirigeants de Taiz. Le châtiment donne non seulement un exemple de ce qui attend les ennemis de l'Iman, mais il protège également le palais royal de Taiz des futurs complots."
 Yem.16.d:0 "Au cours de la régence du prince Badr, il a cherché à acheter du soutien pour ses réformes d'inspiration nationaliste arabe en offrant aux chefs tribaux une plus grande autonomie, des armes et de l'argent. Le prince Badr espérait que calmer les tribus paralyserait les principaux moyens de force armée dont disposaient ceux qui s'opposaient à ses réformes. De plus, il cherchait à utiliser certaines tribus pour réprimer ses adversaires. Cependant, de nombreuses tribus ont utilisé cette liberté pour régler d'anciens comptes et semer le chaos dans certaines régions du pays, retournant l'opinion publique contre le prince Badr. Une fois l'Imam Ahmed revenu d'Italie au Yémen, les réformes ont été rapidement interrompues et les loyalistes ont brutalement rétabli l'ordre au Yémen. Pour les tribus qui ont pris de l'argent liquide à son fils, l'Imam Ahmed leur a envoyé des sacs vides pour restituer l'argent et les biens donnés. Si les chefs de tribu obéissent à l'Imam et rendent ce qu'ils n'auraient jamais dû accepter, ils seront ramenés au premier plan. Cependant, tout chef de tribu qui échoue fera face à la colère de l'Imam. Beaucoup devraient se conformer à cette demande, même si plusieurs chefs tribaux auraient déjà refusé et la répression attendue par l'imam servira d'exemple de son contrôle absolu continu sur le Yémen."
 fight_against_the_imperialist1:0 "Lutte contre les impérialistes"