 iree.1.d:0 "Les élections générales sont là. Cette élection est la première depuis la déclaration de la République d'Irlande le 18 avril 1949 en vertu de la Loi sur la République d'Irlande de 1948, qui a automatiquement forcé l'Irlande à se retirer du Commonwealth britannique. Les élections générales de 1951 sont provoquées par un certain nombre de crises au sein du premier gouvernement interpartis, notamment le programme mère-enfant. Le pays est bien entendu confronté à d'autres problèmes, tels que la hausse des prix et les problèmes de balance des paiements. Deux DT agricoles ont retiré leur soutien au gouvernement en raison de la hausse des prix du lait. Les bulletins de vote étant clos et comptés, les citoyens attendent avec impatience les résultats."
 iree.2.d:0 "Les élections générales sont là. L'élection de a été provoquée par la perte de la majorité globale du parti au pouvoir au Dáil. Plutôt que d'être rejetés lors d'un vote au Dáil, ils ont décidé de déclencher des élections générales et de laisser le peuple décider."
 iree.3.d:0 "Les élections générales sont là. Les élections de 1957 furent précipitées par la crise de la balance commerciale et la réaction du gouvernement face à cette crise. En conséquence, ils décidèrent de dissoudre le Dáil et de laisser le peuple décider. La campagne s'est déroulée en grande partie autour de questions économiques et de la situation dans le Nord. Dans le nord, l'IRA a lancé l'opération Harvest qui a suscité un large soutien populaire dans le sud. Le Sinn Féin avait été reconstruit et réorganisé en parti par Paddy McLogan et présentait des candidats abstentionnistes."
 ire.2.d:0 "Lorsque la Seconde Guerre mondiale a éclaté en 1939, l'Irlande a déclaré officiellement l'état d'urgence le 2. Septembre 1939. La loi sur les pouvoirs d'urgence est promulguée le lendemain. Cela a donné de nouveaux pouvoirs au gouvernement irlandais pour la durée de la Seconde Guerre mondiale. Le rationnement de la nourriture, des vêtements et de l'essence a été introduit et des carnets de rationnement ont été présentés à tout le monde en Irlande. Certains des produits alimentaires les plus importants rationnés pendant et après la guerre en Irlande étaient le thé, le sucre, le beurre et la farine. Le pain était rationné en 1942. Le tabac, le savon et les vêtements étaient également rationnés. Contrairement à la Grande-Bretagne, les oeufs et la viande n'étaient pas rationnés.\nL'essence était également rationnée. L'allocation officielle pour les gens ordinaires possédant une voiture était de huit gallons par mois jusqu'à 10 ch, et de 12 gallons par mois pour les voitures de 10 à 16 ch. Les médecins, prêtres et vétérinaires recevaient également une allocation supplémentaire.\n\nLa loi sur les pouvoirs d'urgence a été abrogée le 2 septembre 1946. De nombreuses parties de cette loi sont cependant restées en vigueur, notamment le rationnement. Aujourd'hui, après 6 ans, le rationnement a officiellement pris fin."
 ire.3.d:0 "Au cours des années 1920, 1930 et 1940, aucun studio spécialement conçu n'a permis de réaliser des films tout au long de l'année en Irlande. Pour remédier à cela, un consortium d'entreprises financé en partie par les États-Unis a commencé à construire un studio de style hollywoodien au sud de la ville de Dublin en 1955. Une fois la construction enfin terminée, Ardmore Studios a ouvert ses portes le [GetDate].\nSitué sur un site de dix acres à 19 km au sud de Dublin, le studio offre la première opportunité aux cinéastes irlandais de tourner en intérieur toute l'année.\nDes rumeurs courent déjà qu'une adaptation de la pièce de Walter Macken, Home Is the Hero, mettant en vedette Macken et réalisée par Fielder Cooke, lauréat d'un Emmy Award, serait en préparation comme premier film du studio.\n\nUn représentant du studio nous a fait ce commentaire : \"Avant l'ouverture du studio, l'Irlande se limitait au tournage en extérieur, qui ne représenterait qu'une petite partie du film terminé. Après le lancement des studios Ardmore - et avec Emmet Dalton et Louis Elliman comme directeurs généraux - les cinéastes internationaux commenceront sûrement à considérer Wicklow comme un lieu de tournage attrayant.\""