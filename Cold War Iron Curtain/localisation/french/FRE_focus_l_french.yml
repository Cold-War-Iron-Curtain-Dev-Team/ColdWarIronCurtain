# === CEFEO ===
#### Focus tree: The Metropole branch ####
 FRE_Lobby_the_National_Assembly: "Faire du lobbying auprès de l'Assemblée Nationale"
 FRE_Lobby_the_National_Assembly_desc: "La guerre se gagne ou se perd au Palais Bourbon aussi sûrement que sur la RC4. Envoyez nos meilleurs colonels d'état-major à Paris avec des cartes, des photographies et des chiffres sur les victimes classés dans l'ordre le plus convaincant."
 FRE_Streamline_Colonial_Logistics: "Rationaliser la logistique coloniale"
 FRE_Streamline_Colonial_Logistics_desc: "Entre Marseille et Haïphong, un fusil passe par onze dépôts et perd trois semaines. Coupez la chaîne à cinq et les mêmes convois nourriront deux fois la guerre."
 FRE_Manage_the_Press_Corps: "Gérer le corps de presse"
 FRE_Manage_the_Press_Corps_desc: "Les correspondants écriront quelque chose ; veillez à ce qu'ils l'écrivent depuis une terrasse à Hanoï avec un officier de briefing à leurs côtés, et non depuis un hôpital de campagne."
 FRE_The_Expeditionary_Budget: "Le budget expéditionnaire"
 FRE_The_Expeditionary_Budget_desc: "Enterrez le financement du corps dans le budget permanent de la défense, là où aucun vote ne pourra le tuer. L'Assemblée peut se lasser de la guerre, mais elle continuera à payer la parole."
 FRE_Court_the_American_Mission: "Courtiser la mission américaine"
 FRE_Court_the_American_Mission_desc: "Washington voit des dominos là où Paris voit des colonies. Si les inquiétudes américaines peuvent servir à payer les soldats français, tant mieux."
 FRE_A_Telegram_to_Paris: "Un télégramme à Paris"
 FRE_A_Telegram_to_Paris_desc: "Un câble clair et confiant : la situation, les exigences, les perspectives. Signé par le Commandant en Chef, lu à haute voix en Conseil des Ministres."

#### Focus tree: Brothers in Arms branch ####
 FRE_Jaunissement: "Jaunissement"
 FRE_Jaunissement_desc: "Le « jaunissement » de la guerre : des soldats vietnamiens sous des officiers vietnamiens tiennent le terrain vietnamien. C'est leur pays ; que ce soit de plus en plus leur armée."
 FRE_Arm_the_National_Army: "Armer l'Armée Nationale"
 FRE_Arm_the_National_Army_desc: "Ouverture des dépôts CEFEO à Saigon. Chaque fusil remis à l'Armée nationale vietnamienne est un fusil dont Paris n'a plus besoin."
 FRE_The_GCMA: "Le GCMA"
 FRE_The_GCMA_desc: "Le Groupement de Commandos Mixtes Aeroportes : cadres français et partisans des hauts plateaux derrière les lignes du Viet Minh. Une façon sale, niable et remarquablement bon marché de faire de la garnison ennemie son propre arrière-plan."
 FRE_Joint_General_Staff: "Un état-major interarmées"
 FRE_Joint_General_Staff_desc: "Une salle des cartes, deux drapeaux. Opérations planifiées dès le départ avec l'Armée nationale vietnamienne plutôt que communiquées par la suite."
 FRE_Montagnard_Loyalty: "Loyauté montagnarde"
 FRE_Montagnard_Loyalty_desc: "Les peuples des hauts pays n'aiment pas les communistes des basses terres. Honorez les anciennes alliances - sel, argent, fusils et respect."
 FRE_Coordinate_with_Saigon: "Coordonner avec Saigon"
 FRE_Coordinate_with_Saigon_desc: "Les autorités cochinchines, le gouvernement de l'empereur et le corps d'armée ont mené assez longtemps trois guerres distinctes. Asseyez tout le monde à la même table."

#### Focus tree: Indochina operations ####
 FRE_Operation_Pollux: "Opération Pollux"
 FRE_Operation_Pollux_desc: "Castor a établi le camp fortifié de Dien Bien Phu ; son jumeau doit maintenant amener la garnison exposée de Lai Chau vers le sud. Les bataillons réguliers peuvent être envoyés par avion, mais les colonnes de partisans Tai, leurs familles et leur équipement doivent encore faire face à la longue marche sur la route Pavie. Nous pouvons répéter le calendrier historique, surveiller la route avec la réserve mobile ou dépenser les avions nécessaires pour transporter presque tout le monde."
 FRE_Operation_Atlante: "Opération Atlante"
 FRE_Operation_Atlante_desc: "Le plan de Navarre prévoit la destruction de la base du Viet Minh dans l'Interzone V et la restitution de la côte centrale à l'État du Vietnam. L'entreprise nécessitera des groupes mobiles, des forces de débarquement, des avions et la jeune armée nationale vietnamienne au moment même où Dien Bien Phu réclame une réserve nord. Nous ne pouvons poursuivre ces deux ambitions que sur le papier ; sur le terrain, c'est au personnel de décider à quelle place appartient cette réserve."

#### Focus tree: Economy branch ####
 FRE_ECO_Restart_Urban_Economy: "Redémarrer l'activité économique urbaine"
 FRE_ECO_Restart_Urban_Economy_desc: "Les commerçants de Hanoï ne peuvent pas rouvrir uniquement sur la base des réquisitions militaires. Rétablir les livraisons sur les marchés et relancer le commerce des ateliers ; une journée normale de travail fera plus pour la reprise qu'une autre circulaire du siège."
 FRE_ECO_Japanese_Bases_Gia_Lam: "Moderniser les bases japonaises et l'aéroport de Gia Lam"
 FRE_ECO_Japanese_Bases_Gia_Lam_desc: "Les aérodromes et les installations laissés par l'occupation japonaise servent toujours le corps, souvent avec peu de réparations autres que celles de guerre. Reconstruisez les installations de Gia Lam et ses approches afin que les avions et les convois terrestres puissent emprunter la même route d'approvisionnement fiable."
 FRE_ECO_Piastre_Inflation: "La crise inflationniste des Piastres"
 FRE_ECO_Piastre_Inflation_desc: "L'enquête d'Armorin a amené l'affaire des changes sur les bureaux officiels. Les transferts vers la France promettent des profits que le commerce honnête ne peut égaler, tandis que les salaires achètent moins sur les marchés. Le Trésor doit reconnaître la crise avant de pouvoir définir une politique monétaire."
 FRE_ECO_New_Currency: "Émettre une nouvelle devise"
 FRE_ECO_New_Currency_desc: "Émettez le Bac Vien-Dong à la place de la piastre et placez la monnaie sous une nouvelle série de comptes. Cela devrait atténuer l'inflation, mais imprimer des billets est plus simple que de les garantir : la nouvelle émission nous rendra plus dépendants du soutien métropolitain."
 FRE_ECO_Keep_Piastre: "Entretenir la Piastre Indochinoise"
 FRE_ECO_Keep_Piastre_desc: "La piastre paie toujours les dockers et règle les factures des commerçants. Gardez-le en circulation plutôt que de faire dépendre chaque transaction d'une nouvelle monnaie adossée à Paris. Le prix immédiat sera une inflation plus forte tant que les anciennes dispositions resteront en vigueur."
 FRE_ECO_Resume_Vidanges: "Reprendre la Société Générale des Vidanges et Bouages du Tonkin"
 FRE_ECO_Resume_Vidanges_desc: "Les égouts et les chariots à ordures de Hanoï ont besoin d'un opérateur fonctionnel. Remettre en service la Société Générale des Vidanges et Bouages du Tonkin, réparer les ouvrages d'eau et faire de la place aux commerces qui tentent de rouvrir autour d'eux."
 FRE_ECO_Bourgoin_Report: "Mettre en oeuvre le rapport Bourgoin et restaurer l'économie civile"
 FRE_ECO_Bourgoin_Report_desc: "Les propositions de Bourgoin donnent une place à l'industrie civile dans un budget habituellement revendiqué par l'armée. Engagez-vous en faveur d'une fabrication locale et d'une monnaie plus fiable. Des équipements importés et des financements métropolitains seront nécessaires avant que ces jeunes entreprises puissent devenir autonomes."
 FRE_ECO_River_Dikes: "Renforcer les digues et les digues fluviales"
 FRE_ECO_River_Dikes_desc: "Une brèche dans un remblai peut emporter les récoltes qui nourrissent un district entier. Autoriser les travaux de digues provinciales, avec des fonds et une main-d'oeuvre séparés alloués à chaque État que nous détenons. Les ingénieurs ont besoin de temps pour terminer avant la crue des rivières."
 FRE_ECO_Iron_Tungsten_Mines: "Agrandissez la mine de fer Qui Xa et les mines de tungstène Nui Phao"
 FRE_ECO_Iron_Tungsten_Mines_desc: "Donnez à Qui Xa et Nui Phao l'équipement et transportez leurs travaux qui manquent. Davantage de fer et de tungstène entreront dans les comptes d'approvisionnement, tandis que les services miniers acquerront une expérience qu'ils pourront appliquer à d'autres projets d'extraction."
 FRE_ECO_Resource_Exploitation: "Mettre l'accent sur l'exploitation des ressources et la production militaire"
 FRE_ECO_Resource_Exploitation_desc: "Paris veut des recettes d'exportation et le corps veut du matériel militaire. Placer les deux avant l'expansion industrielle civile. Cet accord réduira dans une certaine mesure la dépendance à l'égard des livraisons extérieures et permettra de bien payer, mais les nouvelles usines ne progresseront guère dans le cadre des premières allocations et l'inflation s'aggravera."
 FRE_ECO_Hanoi_Hospital: "Agrandir l'hôpital de Hanoï et la production de fournitures médicales"
 FRE_ECO_Hanoi_Hospital_desc: "L'hôpital de Hanoï a besoin de plus d'espace et d'un approvisionnement plus régulier en médicaments. Financez son expansion et les services médicaux qui l'entourent, en accordant une attention particulière aux maladies qui emportent les enfants avant même qu'un médecin ne les voie."
 FRE_ECO_Sell_Wild_Lands: "Vendre des terres sauvages aux masses sans terre"
 FRE_ECO_Sell_Wild_Lands_desc: "Proposer des terres enregistrées par l'administration comme incultes aux familles sans exploitation. Les ventes rapporteront de l'argent au trésor et ouvriront des perspectives de développement sur l'ensemble du territoire. Un espace vacant sur une feuille cadastrale n'est pas toujours un terrain vacant."
 FRE_ECO_Tonkin_Workers_Syndicate: "Fonde le Syndicat des travailleurs d'Extrême-Orient du Tonkin"
 FRE_ECO_Tonkin_Workers_Syndicate_desc: "Reconnaître un syndicat de travailleurs capable de négocier les salaires et les conditions de travail dans les industries en croissance du Tonkin. Le travail organisé peut aider ces entreprises à se développer, même si les communistes gagneront également une audience parmi les travailleurs autorisés à s'exprimer collectivement."
 FRE_ECO_Bo_Ho_Power_Plant: "Moderniser la centrale électrique de Hanoi Bo Ho"
 FRE_ECO_Bo_Ho_Power_Plant_desc: "Les machines de Bo Ho ne peuvent pas répondre indéfiniment à la demande croissante de Hanoi. Payer pour de nouvelles capacités de production thermique là où nous tenons le terrain et obtenir davantage de charbon pour l'approvisionnement électrique de la capitale. Les ateliers ont besoin d'électricité tout au long de la journée de travail, pas de promesses."
 FRE_ECO_Militarize_Haiphong: "Militariser le port de Haïphong"
 FRE_ECO_Militarize_Haiphong_desc: "Les approvisionnements du corps passent par Haïphong avant d'atteindre un dépôt avancé. Agrandissez les installations navales et construisez des défenses côtières autour du port. Les améliorations commerciales peuvent attendre ; le crédit immédiat est destiné à assurer la sécurité du mouillage."
 FRE_ECO_Confiscate_Viet_Minh_Assets: "Confisquer les avoirs des sympathisants du Viet Minh"
 FRE_ECO_Confiscate_Viet_Minh_Assets_desc: "Saisir les avoirs des personnes accusées de financer le Viet Minh et placer les locaux productifs sous une nouvelle direction. Le Trésor public et l'industrie civile y gagneront, ce qui allégera la pression sur les prix. Les familles et les commerçants qui voient leurs voisins perdre leurs biens auront moins confiance dans l'administration."
 FRE_ECO_Raise_Salaries: "Augmenter les salaires du CEFEO"
 FRE_ECO_Raise_Salaries_desc: "Les barèmes de rémunération du CEFEO sont en retard par rapport au coût de la vie. Augmenter les salaires et donner plus de poids aux besoins militaires dans le budget pour encourager l'enrôlement et stabiliser les garnisons. Plus de piastres dans les enveloppes salariales signifieront également plus d'argent pour acheter des biens rares."
 FRE_ECO_Rice_Paddies: "Maintenir une production stable de riz paddy"
 FRE_ECO_Rice_Paddies_desc: "Financez les installations agricoles et maintenez la production régulière des rizières. Une récolte locale fiable aidera l'économie civile à devenir moins dépendante des approvisionnements extérieurs, mais détourner les transports et la main-d'oeuvre vers ce programme interrompra la reprise ailleurs."
 FRE_ECO_Franco_American_Investors: "Inviter des investisseurs franco-américains"
 FRE_ECO_Franco_American_Investors_desc: "Offrir aux investisseurs français et américains une place dans le programme de reconstruction civile. Leurs entreprises renforceront leur capacité industrielle et contribueront à la reprise du commerce. Les mécanismes, le crédit et les décisions commerciales qu'ils apportent lieront également plus étroitement le développement local aux intérêts extérieurs."
 FRE_ECO_Native_Middle_Classes: "Collaborer avec les classes moyennes autochtones"
 FRE_ECO_Native_Middle_Classes_desc: "Les commerçants vietnamiens et les professionnels qualifiés font déjà fonctionner une grande partie de l'économie civile. Donnez-leur une plus grande part dans l'administration et les entreprises, parallèlement à une politique plus accommodante en matière de minorités. Leurs entreprises et leurs connaissances techniques peuvent soutenir le développement industriel au-delà des vieilles maisons coloniales."
 FRE_ECO_Campha_Hongai_Mines: "Agrandir les mines de charbon Campha et Hon Gai de SFCT"
 FRE_ECO_Campha_Hongai_Mines_desc: "La Société française des charbonnages du Tonkin peut vendre plus de charbon que ses exploitations et transports actuels ne peuvent en livrer. Augmenter la production à Campha et Hon Gai et améliorer les routes qui les desservent. L'augmentation des expéditions ramènera les recettes au trésor."
 FRE_ECO_Carrieres_du_Vietnam: "Création de la Compagnie Les Carrières du Vietnam"
 FRE_ECO_Carrieres_du_Vietnam_desc: "Établir Les Carrières du Vietnam comme véhicule permettant de mettre davantage de ressources locales en production. Ses concessions soutiendront des approvisionnements supplémentaires en caoutchouc et une modeste allocation de pétrole, élargissant ainsi les matériaux disponibles pour les industries du territoire."
 FRE_ECO_Import_Military_Trucks: "Importer des camions militaires supplémentaires"
 FRE_ECO_Import_Military_Trucks_desc: "Achetez des camions américains pour le corps et améliorez une route desservant nos dépôts. Un millier de véhicules supplémentaires donneront aux quartiers-maîtres plus qu'une nouvelle entrée dans l'inventaire, à condition qu'il y ait un itinéraire utilisable sous leurs roues."
 FRE_ECO_Metropolitan_Economic_Aid: "Demander une aide économique métropolitaine supplémentaire"
 FRE_ECO_Metropolitan_Economic_Aid_desc: "Demandez à la France les livraisons programmées d'acier, de pétrole et de caoutchouc. Des approvisionnements fiables permettront de poursuivre la construction d'usines malgré les exigences de l'économie d'exportation. Chaque expédition nécessitera une pression politique à Paris et mettra à rude épreuve la patience de l'Assemblée."
 FRE_ECO_Import_Foodstuffs: "Importer des produits alimentaires américains et français"
 FRE_ECO_Import_Foodstuffs_desc: "Payer les approvisionnements alimentaires américains et français et sécuriser les capacités agricoles en dehors du territoire. Nourrir les villes de l'étranger laissera plus de place à la construction d'usines locales dans le cadre des allocations restrictives de l'économie de guerre."
 FRE_ECO_Tong_Airplane_Factory: "Redémarrer le projet d'usine d'avions de Tong"
 FRE_ECO_Tong_Airplane_Factory_desc: "Relancer le projet de travaux d'avions de Tong avec des fonds pour des équipements et des locaux industriels dans la région de Hanoï. Deux nouvelles installations de production militaire donneront au corps d'armée une base de fabrication locale ; la production d'avions nécessitera toujours des conceptions et des machines adaptées."
 FRE_ECO_Crackdown_Opium: "Réprimer l'opium et la corruption"
 FRE_ECO_Crackdown_Opium_desc: "Interdire l'opium et poursuivre les responsables qui protègent son commerce. La réduction du trafic renforcera l'ordre public et réduira la pression sur la monnaie, mais les autorités taïwanaises seront mécontentes d'une politique qui réduit les moyens de subsistance et les revenus établis."
 FRE_ECO_Reopen_University: "Rouvrir l'Université nationale du Vietnam"
 FRE_ECO_Reopen_University_desc: "Rouvrez l'Université nationale du Vietnam et rétablissez l'enseignement et la recherche que les expédients du temps de guerre ont déplacés. L'administration a besoin d'ingénieurs et de médecins capables de travailler ici, et de laboratoires capables de répondre à plus que la prochaine demande urgente du corps."
 FRE_ECO_Tolerate_Opium: "Tolérer le commerce de l'opium"
 FRE_ECO_Tolerate_Opium_desc: "Permettre au commerce de l'opium de se poursuivre dans le cadre d'accords de guerre qui mettent à portée de main les fusils et la production militaire. Ces recettes contribueront à stabiliser notre administration tout en aggravant la crise monétaire. Les autorités Tai n'apprécieront pas l'ingérence française dans le commerce, même dans le cadre d'une politique permissive."
 FRE_ECO_Gia_Lam_Airbase: "Agrandissez la base aérienne de Gia Lam et le renforcement militaire"
 FRE_ECO_Gia_Lam_Airbase_desc: "Agrandir les installations aériennes de Gia Lam et autoriser la conversion des ouvrages civils en production militaire. Chaque conversion mettra une usine hors service tandis que ses machines et sa main-d'oeuvre seront préparées pour les commandes de l'armée."
 FRE_ECO_Hanoi_Textiles: "Redémarrer les ateliers textiles et urbains de Hanoi"
 FRE_ECO_Hanoi_Textiles_desc: "Rouvrir les usines et ateliers textiles de Hanoï avec les bureaux commerciaux dont ils ont besoin pour prendre les commandes. Une plus grande quantité de biens civils devrait contribuer à contenir les prix. Les travaux pratiques dans les usines et leurs filières agricoles amélioreront également nos méthodes industrielles et agricoles."
 FRE_ECO_Tonkin_Railway_Company: "Fondée la Compagnie du chemin de fer du Tonkin et d'Extrême-Orient"
 FRE_ECO_Tonkin_Railway_Company_desc: "Créer une compagnie des chemins de fer du Tonkin et lui fournir des locomotives pour le réseau existant. Se concentrer sur le matériel roulant évite le projet de construction plus vaste de Vientiane, mais la réquisition d'hommes et de fournitures pour la nouvelle entreprise perturbera toujours la reprise économique."
 FRE_ECO_Vientiane_Tonkin_Railway: "Construire le chemin de fer Vientiane-Tonkin"
 FRE_ECO_Vientiane_Tonkin_Railway_desc: "Financer un chemin de fer entre Vientiane et Tonkin, avec des locomotives françaises pour démarrer les services. Le Laos bénéficiera d'un débouché vers les ports du nord et nos dépôts d'une nouvelle connexion terrestre. Il s'agit d'une facture de construction conséquente pour un territoire qui répare encore ses anciennes lignes."
 FRE_ECO_Pyrotechnic_Factories: "Armer les usines pyrotechniques et chimiques"
 FRE_ECO_Pyrotechnic_Factories_desc: "Payer pour confier les travaux civils chimiques et pyrotechniques disponibles aux commandes militaires, avec une production supplémentaire assurée en dehors du territoire. Le corps d'armée gagnera en capacité de munitions au détriment de la production civile, interrompant ainsi une reprise déjà inégale."
 FRE_ECO_Resume_Foreign_Trade: "Reprendre le commerce extérieur"
 FRE_ECO_Resume_Foreign_Trade_desc: "Remettez la marine marchande sur les routes régulières et rapprochez-vous des gouvernements asiatiques avec lesquels nous sommes en paix. L'accès aux marchés voisins peut transformer la reconstruction en croissance durable. Les navires français contribueront à acheminer les premiers trafics renouvelés."
 FRE_ECO_Import_Industrial_Tools: "Importer les outils industriels et le savoir-faire technique d'après-guerre"
 FRE_ECO_Import_Industrial_Tools_desc: "Achetez des outils industriels modernes et faites appel à des techniciens capables d'enseigner leur utilisation. De meilleurs équipements de calcul et méthodes de construction aideront les services locaux à accomplir des tâches encore effectuées à la main ou avec des machines usées avant la fin de la guerre."
 FRE_ECO_Dien_Bien_Phu_Fort: "Préparer le fort de Dien Bien Phu"
 FRE_ECO_Dien_Bien_Phu_Fort_desc: "Engager des équipes de béton et de construction sur les positions de Dien Bien Phu. La réorientation des allocations de l'économie de guerre atténuera ses restrictions sur la construction d'usines, mais les dépenses augmenteront l'inflation. Les fortifications doivent encore être tenues et approvisionnées par les troupes."
 FRE_ECO_Invest_Ethnostates: "Investir dans les territoires des ethno-États"
 FRE_ECO_Invest_Ethnostates_desc: "Autoriser des subventions de développement distinctes pour la Fédération Tai et les territoires Muong, Tho, Montagnard et Nung. Les routes et les usines civiles dans leurs centres administratifs donneront à leurs autorités quelque chose de concret à démontrer en termes de coopération avec le corps."
 FRE_ECO_Modernize_Haiphong: "Moderniser le port de Haïphong"
 FRE_ECO_Modernize_Haiphong_desc: "Agrandir les installations portuaires de Haiphong et créer des chantiers navals supplémentaires. Une meilleure capacité de manutention et de réparation soutiendra la reprise, atténuera les pénuries et donnera aux entreprises locales plus de latitude pour se développer. Le Trésor doit payer une facture importante avant que ces gains n'atteignent les marchés."
 FRE_ECO_Invest_Saigon: "Investir dans les territoires de Saigon"
 FRE_ECO_Invest_Saigon_desc: "Ouvrir un programme d'investissement civil pour l'État du Vietnam. Les fonds soutiendront la construction d'usines sur le territoire sous contrôle vietnamien, donnant à Saigon une raison pratique de maintenir sa coopération avec un corps dont on lui demande depuis longtemps de répondre aux réquisitions."
 FRE_ECO_Postwar_Reforms: "Projet de réformes économiques d'après-guerre"
 FRE_ECO_Postwar_Reforms_desc: "Préparer des propositions pour une économie civile après les combats, en accordant une attention particulière aux entreprises et aux services provinciaux que la guerre a laissés dépendants des ordres militaires."
 FRE_ECO_War_Loot_to_Metropole: "Butin de guerre des transports vers la Métropole"
 FRE_ECO_War_Loot_to_Metropole_desc: "Élaborer des plans pour envoyer le butin de guerre accumulé et les provisions récupérables en France. Les inventaires doivent distinguer ce que le corps peut embarquer de ce dont les services locaux ont encore besoin."
 FRE_ECO_End_of_the_War: "Fin de la guerre ?"
 FRE_ECO_End_of_the_War_desc: "Revoyez les dispositions économiques prises pour une guerre sans date de fin fixe. Les bureaux civils et les dépôts militaires auront besoin d'instructions différentes lorsque les combats cesseront."
