# ------------------------------------------------------------------- events
Geneva_Conference_Session.1.t: "[GetNewspaperHeader]Les grandes puissances se réunissent à Genève"
Geneva_Conference_Session.1.d: "Genève, [?global.date.GetDateStringNoHourLong] - Des délégations de France, des gouvernements vietnamiens et des grandes puissances ont pris place au Palais des Nations pour négocier la fin de la guerre d'Indochine.\n\nL'ordre du jour de la conférence est formidable : un cessez-le-feu à travers l'Indochine, la question de la partition et des élections pan-vietnamiennes, le calendrier du retrait français et l'avenir du Laos et du Cambodge. Chaque délégation arrive avec ses propres lignes rouges - et ses propres clients qui veillent par-dessus son épaule.\n\nLes diplomates préviennent que rien n'est convenu tant que tout n'est pas convenu. Les négociations devraient durer des semaines, et un seul retrait de l'un des principaux belligérants pourrait faire échouer la conférence dans son ensemble."
Geneva_Conference_Session.1.a: "Le monde regarde."
Geneva_Conference_Session.2.t: "[GetNewspaperHeader]Une délégation quitte les négociations de Genève"
Geneva_Conference_Session.2.d: "Genève, [?global.date.GetDateStringNoHourLong] - La délégation du [Geneva_Wrecker.GetName] a quitté la conférence d'Indochine, dénonçant les termes qui se dessinaient à la table comme étant inacceptables.\n\nLes délégations restantes continuent leur action, mais l'ambiance au Palais des Nations s'est considérablement assombrie. Les observateurs notent qu'un accord signé sans tous les principaux belligérants ne vaut guère plus que le papier sur lequel il est imprimé - et qu'un deuxième débrayage mettrait presque certainement fin à la conférence."
Geneva_Conference_Session.2.a: "Une chaise vide parle fort."
Geneva_Conference_Session.3.t: "[GetNewspaperHeader]La Conférence de Genève s'effondre dans l'acrimonie"
Geneva_Conference_Session.3.d: "Genève, [?global.date.GetDateStringNoHourLong] - La conférence d'Indochine a échoué. Après des semaines de négociations infructueuses, les délégations ont abandonné le Palais des Nations sans cessez-le-feu, sans règlement et sans aucune intention d'y retourner.\n\nChaque camp rejette la responsabilité de la rupture sur l'autre. Ce qui est sûr, c'est que les armes décideront désormais de ce que les diplomates n'ont pas pu décider : les deux gouvernements vietnamiens ont annoncé des mobilisations générales et les commandants français parlent sombrement d'une guerre sans fin en vue.\n\nLes grandes puissances, n'ayant pas réussi à contenir le conflit à la table des négociations, se retrouvent désormais confrontées à la perspective d'une Indochine enfermée dans une guerre permanente et acharnée."
Geneva_Conference_Session.3.a: "La guerre continue."
Geneva_Conference_Session.4.t: "[GetNewspaperHeader]Genève se termine sans plus rien à gagner"
Geneva_Conference_Session.4.d: "Genève, [?global.date.GetDateStringNoHourLong] - La conférence d'Indochine ne s'est pas terminée par un traité mais par un silence épuisé. Aucune des délégations n'a pu imposer de conditions, car aucune d'entre elles n'a plus la force de les faire respecter.\n\nDes années de guerre ont anéanti toutes les factions en Indochine. Les armées qui se font face à travers les rizières sont des ombres ; les gouvernements qui prétendent parler au nom du Vietnam ne disposent ni de loyauté ni de revenus. Les diplomates sont simplement rentrés chez eux, laissant derrière eux un pays où l'autorité elle-même s'est dissoute.\n\nLes travailleurs humanitaires mettent en garde contre la famine et le banditisme dans la région. Dans les capitales des grandes puissances, les ministres parlent de l'Indochine non plus comme d'une récompense à gagner, mais comme d'une tragédie à contenir."
Geneva_Conference_Session.4.a: "Personne n'a gagné."
Geneva_Conference_Session.5.t: "[GetNewspaperHeader]Les accords de Genève sont signés"
Geneva_Conference_Session.5.d: "Genève, [?global.date.GetDateStringNoHourLong] - Après des semaines de négociations, les délégations au Palais des Nations ont signé les Accords de Genève, mettant officiellement un terme à la guerre d'Indochine.\n\nLes modalités du règlement sont les suivantes :\n\nCessez-le-feu : §Y[GetGenevaClause0Text]§!\nImplantation territoriale : §Y[GetGenevaClause1Text]§!\nRéunification : §Y[GetGenevaClause2Text]§!\nForces françaises : §Y[GetGenevaClause3Text]§!\nAlignement : §Y[GetGenevaClause4Text]§!\nLaos et Cambodge : §Y[GetGenevaClause5Text]§!\nPeuples minoritaires : §Y[GetGenevaClause6Text]§!\n\nQue ces accords apporteront une paix durable en Indochine, ou simplement un entracte, est une question que les signataires ont laissée à l'histoire."
Geneva_Conference_Session.5.a: "Paix, pour l'instant."
Geneva_Conference_Session.10.t: "La route de Genève"
Geneva_Conference_Session.10.d: "Les belligérants de la guerre d'Indochine ont convenu de convoquer une conférence internationale de paix à Genève sous le parrainage des grandes puissances.\n\nNotre gouvernement a été invité à envoyer une délégation. Dans six jours, la conférence s'ouvrira au Palais des Nations, où seront sur la table le cessez-le-feu, l'avenir politique du Vietnam et le sort du Laos et du Cambodge.\n\nLa force de nos négociateurs à la conférence reflétera tout ce que nous avons construit et pour lequel nous avons combattu en Indochine jusqu'à présent. Une fois la session ouverte, l'aperçu de la conférence peut être suivi depuis le bouton §YConférence de Genève§! de l'onglet politique (ou depuis la fenêtre Lutte pour l'Indochine)."
Geneva_Conference_Session.10.a: "À Genève."

