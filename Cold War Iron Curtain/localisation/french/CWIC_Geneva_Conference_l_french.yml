GENEVA_BTN_CHAMPION_TT: "§YDéfendez§! du résultat que vous avez choisi : adoptez-le comme position de votre délégation et ouvrez une négociation §Yde trois jours§! en mettant une avancée majeure derrière lui. L'enjeu se pose lors du premier vote hebdomadaire après la conclusion des pourparlers, et les délégations rivales peuvent le voir venir.\nCoûts §Y25 Pouvoir politique§! et poids adapté à l'importance de la clause (§Y5/10/15§!). Une négociation par clause à la fois. Pas possible sur une clause réglée."
GENEVA_BTN_PRESSURE_TT: "§YFaites pression§! sur la délégation sélectionnée pour qu'elle adopte votre position sur la clause sélectionnée. Ils en seront mécontents et refuseront toute pression supplémentaire pendant plusieurs tours.\nCoûte §Y25 de puissance politique§! et un poids égal à §Yla moitié du poids de la cible§!. Pas possible sur une clause réglée."
GENEVA_BTN_CONCEDE_TT: "§YConcéder§! la clause retenue : adopter publiquement ce qui est actuellement sur la table. Récupère §G15 Poids§! et améliore la patience de chaque délégation qui souhaitait ce résultat. Pas possible sur une clause réglée."
GENEVA_BTN_BACKCHANNEL_TT: "Ouvrir un canal de retour §Y§! entre Saigon et Hanoi (sélectionner l'autre délégation vietnamienne comme cible). Favorise le rapprochement ; à §Y100§! les deux délégations adoucissent leurs positions formelles.\nCoûts §Y50 Pouvoir politique§!. Une fois tous les deux tours."
GENEVA_BTN_THREATEN_TT: "§YMenacez de vous retirer§! de la clause sélectionnée : un enjeu énorme derrière votre position, livré sous forme de négociation publique §Yde trois jours§!, payé avec une patience adaptée à l'importance de la clause (§R15/20/25§!). Si le résultat menacé par un belligérant principal remporte le vote, la clause devient §Rnon négociable§!.\nNécessite plus de 25 Patience. Une fois tous les deux tours. Une négociation par clause à la fois. Pas possible sur une clause réglée."
GENEVA_BTN_FORCE_VOTE_TT: "§YForcer le vote§!: convoquer immédiatement la plénière finale. Chaque enjeu encore en négociation aboutit à un dernier vote, puis la conférence signe ce qu'elle a. Délégations belligérantes principales uniquement, à partir du tour 5.\nCoûts §Y50 Pouvoir politique§!."
GENEVA_BTN_LEAN_SAIGON_TT: "§YAppuyez-vous sur Saigon§!: tuer en secret l'appétit de l'État du Vietnam pour les élections de réunification. Si Saigon et Hanoi ont un canal arrière chaleureux (rapprochement§Y50+§!), la pression §Rfuit§! et le scandale éclate publiquement.\nCoûts §Y50 Pouvoir politique§!. Une fois par conférence."
Geneva_Conference_Session.12.t: "Paroles tranquilles dans les couloirs de Genève"
Geneva_Conference_Session.12.d: "Loin de la salle plénière et de la presse, un intermédiaire a fait savoir que l'autre délégation vietnamienne souhaitait s'entretenir - tranquillement, de manière informelle et sans ses clients dans la salle.\n\nRien de ce qui est dit dans un couloir d'hôtel n'engage personne. Mais le simple fait de ce contact est remarquable : deux gouvernements qui prétendent chacun être le seul Vietnam légitime, cherchant un terrain d'entente tandis que les grandes puissances se disputent pour leurs têtes.\n\nSi ces discussions se poursuivent, les positions à la table qui semblent aujourd'hui inébranlables pourraient tranquillement commencer à évoluer."
Geneva_Conference_Session.12.a: "Gardez ça entre nous."
Geneva_Conference_Session.13.t: "[GetNewspaperHeader]La pression américaine sur Saigon dévoilée à Genève"
Geneva_Conference_Session.13.d: "Genève, [?global.date.GetDateStringNoHourLong] - La conférence a été secouée par des révélations selon lesquelles la délégation américaine aurait fait secrètement pression sur l'État du Vietnam pour qu'il enterre le projet d'élections pan-vietnamiennes.\n\nCette révélation - qui, selon les observateurs, est parvenue à la presse via des canaux secrets vietnamiens - a provoqué la colère des délégations communistes et embarrassé les partenaires de Washington. Les délégations soviétique et nord-vietnamienne ont demandé à la conférence de prendre note de ce qu'elles appellent le « sabotage américain du droit du peuple vietnamien à choisir ».\n\nLa délégation américaine a refusé de commenter. Sa position à la table des négociations a cependant visiblement diminué."
Geneva_Conference_Session.13.a: "La diplomatie a de nombreux domaines."
Geneva_Conference_Session.20.t: "[GetNewspaperHeader]Le Vietnam votera comme une seule nation"
Geneva_Conference_Session.20.d: "Saigon et Hanoï, [?global.date.GetDateStringNoHourLong] - Selon les termes convenus à Genève, les deux gouvernements vietnamiens ont annoncé la formation d'arrangements intérimaires conjoints pour préparer une élection unique à l'échelle nationale qui décidera qui gouvernera un Vietnam réunifié.\n\nDes commissions mixtes doivent superviser la campagne dans les deux zones, et des observateurs internationaux devraient superviser le scrutin. À Hanoï, le gouvernement de Hô Chi Minh déclare avoir pleinement confiance dans le verdict du peuple ; À Saigon, les responsables parlent prudemment de garanties et de supervision, et en privé de malaise.\n\nPersonne dans les deux capitales ne prétend que la situation est confortable. Deux administrations, deux armées et deux idées irréconciliables sur le Vietnam partagent désormais un seul rendez-vous avec les urnes - et le monde entier sera attentif à l'échéance."
Geneva_Conference_Session.20.a: "Un pays, une voix."
Geneva_Conference_Session.22.t: "[GetNewspaperHeader]Hô Chi Minh remporte les élections pan-vietnamiennes"
Geneva_Conference_Session.22.d: "Hanoï, [?global.date.GetDateStringNoHourLong] - Les élections pan-vietnamiennes ordonnées par les Accords de Genève ont rendu un verdict décisif : la liste dirigée par Hô Chi Minh a remporté le pays, balayant les provinces du nord et sondant bien plus fortement dans le sud que ce que le gouvernement de Saigon avait promis à ses patrons.\n\nL'administration de l'État vietnamien, liée par les accords qu'elle a signés et abandonnés par ses alliés peu disposés à annuler un scrutin supervisé, a annoncé qu'elle respecterait le résultat. Les ministères du gouvernement de Saigon ont commencé à confier leurs portefeuilles à l'administration unifiée.\n\nLe Vietnam, divisé en fait sinon toujours en droit depuis le début de la guerre française, sera gouverné comme une seule nation depuis Hanoï. Les grandes puissances doivent digérer un résultat auquel certaines d'entre elles ont souscrit et qu'aucune d'entre elles ne croyait réellement possible."
Geneva_Conference_Session.22.a: "Le scrutin a parlé."
Geneva_Conference_Session.23.t: "[GetNewspaperHeader]L'État du Vietnam remporte les élections pan-vietnamiennes"
Geneva_Conference_Session.23.d: "Saigon, [?global.date.GetDateStringNoHourLong] - Contre toute attente, les élections pan-vietnamiennes exigées par les Accords de Genève se sont déroulées en faveur de l'État du Vietnam. La liste de Saigon a tenu sa base sud, a balayé les villes et - avec les campagnes du nord épuisées par des années de guerre et de bouleversements liés à la réforme agraire - les sondages ont bien mieux réussi au-dessus de l'ancienne ligne de partition que Hanoï ne le croyait possible.\n\nLes dirigeants de la République démocratique, qui dépendent publiquement du verdict du peuple vietnamien, ont concédé avec une amertume visible. On dit aux vétérans du Viet Minh que l'oeuvre de la révolution se poursuivra par d'autres moyens ; les observateurs à Hanoï font état d'une fureur tranquille et d'un emballage silencieux.\n\nLe Vietnam sera gouverné comme une seule nation depuis Saigon. La question que se posent désormais toutes les chancelleries est de savoir si les vainqueurs parviendront à réconcilier le Nord avec le résultat - ou simplement à le gérer."
Geneva_Conference_Session.23.a: "Une nation réunie."
Geneva_Conference_Session.26.t: "La campagne pan-vietnamienne"
Geneva_Conference_Session.26.d_comm: "La campagne pour les élections pan-vietnamiennes mandatées à Genève est en cours dans les deux zones, et tous les rapports parvenant à notre gouvernement vont dans le même sens : §Rla liste menée par Hô Chi Minh est loin devant§!.\n\nLe Viet Minh est sorti de la guerre avec le prestige du camp vainqueur, et cela se voit. Dans le Nord, l'issue ne faisait aucun doute ; Dans le sud, des observateurs de commissions mixtes signalent que des comités de village, des associations d'anciens combattants et une grande partie de la campagne font tranquillement la queue derrière Hanoï. Les solliciteurs de Saigon parlent de foules maussades et de salles vides.\n\nÀ moins que quelque chose ne change avant le scrutin, le vote supervisé livrera le Vietnam aux communistes - légalement, internationalement et sans appel."
Geneva_Conference_Session.26.d_anti: "La campagne pour les élections pan-vietnamiennes ordonnées à Genève est en cours dans les deux zones, et tous les rapports parvenant à notre gouvernement vont dans le même sens : §Yla liste de l'État du Vietnam est en avance§!.\n\nLe verdict de la guerre pèse sur les campagnes électorales. Hanoï fait campagne sur les promesses de la révolution, mais c'est le gouvernement du Sud - solvable, victorieux sur le terrain et soutenu par des mécènes qui ont tenu leurs engagements - qui attire les foules. Les observateurs des commissions mixtes font état de sondages massifs dans le sud, même dans les bourgs du nord, où l'épuisement face aux réquisitions en temps de guerre est profond.\n\nÀ moins que quelque chose ne change avant le scrutin, le vote supervisé confirmera le gouvernement de Saigon sur un Vietnam réunifié - légalement, sous le témoin international et sans appel."
Geneva_Conference_Session.26.d_tie: "La campagne pour les élections pan-vietnamiennes mandatées à Genève est en cours dans les deux zones, et aucun observateur ne se risquera à faire de prédiction.\n\nLa guerre s'est terminée sans qu'aucun des deux camps ne puisse prendre le dessus, et la campagne est à l'image du champ de bataille : la liste de Ho Chi Minh commande le nord et une grande partie de la campagne, Saigon contrôle les villes et le sud, et les commissions mixtes rapportent que les deux camps font campagne furieusement sur le terrain étroit qui les sépare.\n\nLe scrutin supervisé réglera ce que les armes n'ont pas pu régler - et personne, à Hanoï, à Saigon ou dans toute autre capitale de grande puissance, ne sait de quel côté cela tombera."
Geneva_Conference_Session.26.a: "Le peuple décidera."

