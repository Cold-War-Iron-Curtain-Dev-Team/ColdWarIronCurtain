 HUN_jet_CAS_equipment_2:0 "Mikoyan-Gourevitch MiG-17bis"
 HUN_jet_CAS_equipment_2_desc:0 "Conversion de chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 HUN_jet_CAS_equipment_2_short:0 "MiG-17bis"
 HUN_jet_CAS_equipment_3:0 "Mikoyan-Guerevich MiG-19S"
 HUN_jet_CAS_equipment_3_desc:0 "Version chasseur-bombardier avec queue en dalle entièrement mobile. Equipé d'un récepteur de navigation longue portée Svod et armé de trois canons NR-30 de 30 mm. Il y avait des dispositions pour un pack de fusées non guidées ORO-32K ou une bombe FAB-250 sous chaque aile, et à partir de 1957 modifié pour permettre le transport de quatre nacelles de fusée."
 HUN_jet_CAS_equipment_3_short:0 "MiG-19S"
 HUN_jet_CAS_equipment_4:0 "Soukhoï Su-7B"
 HUN_jet_CAS_equipment_4_desc:0 "La variante bombardier du Su-7 Fitter-A a volé pour la première fois en mars 1959, puis est entrée en service en 1961. Il deviendra le principal avion d'attaque au sol soviétique des années 1960. De 1957 à 1972, plus de 1 400 Su-7B ont été construits, dont beaucoup ont été exportés. L'avion était relativement populaire à l'étranger et servait dans 10 pays. Il a connu un service étendu dans les forces aériennes indiennes et égyptiennes. L'avion reste en service limité en Corée du Nord."
 HUN_jet_CAS_equipment_4_short:0 "Su-7B"
 HUN_jet_CAS_equipment_5:0 "Sukhoï Su-7BKL"
 HUN_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté de la colonne vertébrale du fuselage, réservoirs de carburant installés dans les ailes, points d'attache « humides » sous les ailes pour transporter des réservoirs de carburant externes, capables de transporter des bombes nucléaires tactiques."
 HUN_jet_CAS_equipment_5_short:0 "Su-7BKL"
 HUN_jet_CAS_equipment_6:0 "Soukhoï Su-17"
 HUN_jet_CAS_equipment_6_short:0 "Su-17" 
