 HUN_fighter_equipment_0:0 "Legiero magyar"
 HUN_fighter_equipment_0_short:0 "ML"
 HUN_fighter_equipment_0_desc:0 "L'armée de l'air hongroise est la branche aérienne des forces de défense hongroises. Une petite arme aérienne a été organisée selon les lignes soviétiques en 1947. Après la prise de pouvoir par les communistes, l'aide militaire russe a été renforcée et un important programme d'expansion a été lancé."

