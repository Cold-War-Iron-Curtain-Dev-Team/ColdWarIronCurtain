 HUN_infantry_equipment_1:0 "AK-55"
 HUN_infantry_equipment_1_short:0 "AK-55"
 HUN_infantry_equipment_1_desc:0 "L'AK-55 est une copie exacte sous licence du fusil d'assaut Kalachnikov, fabriqué par la société hongroise Fegyver es Gazkeszulekgyar (FEG) de 1959 à 1962."

 HUN_infantry_equipment_2:0 "AMD-65"
 HUN_infantry_equipment_2_short:0 "AMD-65"
 HUN_infantry_equipment_2_desc:0 "En 1963, l'armée hongroise a adopté un nouveau fusil d'assaut portant la désignation AKM-63 (également connu sous le nom d'AMD-63), qui est une version modernisée de l'AK-55."

 HUN_infantry_equipment_3:0 "AK-63"
 HUN_infantry_equipment_3_short:0 "AK-63"
 HUN_infantry_equipment_3_desc:0 "En service hongrois, l'AK-63 a remplacé l'AMD-65, qui est presque identique mais comporte un bouclier thermique modifié et une poignée avant verticale sous le canon. Bien que l'AMD-65 soit le fusil de service hongrois depuis 1965, il était plus coûteux à construire et les poignées avant avaient la réputation d'être facilement endommagées sur le terrain. À la fin des années 1970, le ministère hongrois de la Défense a demandé à la FÉG de fabriquer un fusil moins cher basé sur la conception soviétique plus traditionnelle de l'AKM. À la fin de 1977, l'AK-63 fut adopté par l'armée populaire hongroise (en commençant par les forces terrestres). En 1978, la FÉG a ajouté une version AKMS pliable de l'AK-63 à son catalogue ; par la suite, l'AK-63 à crosse fixe est devenu connu sous le nom d'AK-63F (Wooden Stock) et la version à crosse pliable a été désignée AK-63D (Descente). Dans le service hongrois, les AK-63 F et D sont désignés respectivement comme AMM et AMMS."

 HUN_infantry_equipment_4:0 "AK-63MF"
 HUN_infantry_equipment_4_short:0 "AK-63MF"
 HUN_infantry_equipment_4_desc:0 "AK-63D modernisé avec crosse télescopique et rail Swan MIL-STD-1913."

