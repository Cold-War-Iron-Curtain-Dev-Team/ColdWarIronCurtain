 HOK_entrepot_economy:0 "Commerce en entrepôt"
 HOK_entrepot_economy_desc:0 "Les agents maritimes et les maisons de commerce de Hong Kong relient les ateliers locaux aux fournisseurs étrangers. Les marchandises arrivant par le port apportent les matériaux qu'une colonie industrielle disposant de peu de ressources propres doit acheter à l'étranger."
 HOK_textile_boom_idea:0 "Expansion textile"
 HOK_textile_boom_idea_desc:0 "Les filatures fournissent du fil aux ateliers de tissage et aux ateliers de confection, où les commandes en provenance de l'étranger remplissent les tables de coupe. Les machines et les compétences apportées par les fabricants du continent ont contribué à faire du textile un pilier du commerce industriel de Hong Kong."
 HOK_light_electronics:0 "Assemblée Radio"
 HOK_light_electronics_desc:0 "Les petites usines assemblent des radios à transistors à partir de composants importés pour les vendre à l'étranger. Des liens étroits avec des fournisseurs étrangers et une utilisation prudente des matériaux permettent à ces entreprises de se développer sans construire localement chaque étape de la production électronique."
 HOK_Light_Industry_category:0 "Fabrication d'exportation"
 HOK_textile_boom:0 "Agrandissez les usines textiles"
 HOK_textile_boom_desc:0 "Soutenir l'expansion des usines de filature et de tissage desservant le commerce de l'habillement de Hong Kong. Un approvisionnement plus fiable en tissu aidera les ateliers à répondre aux commandes étrangères de vêtements bon marché."
 HOK_transistor_workshops:0 "Retour Ateliers Transistors"
 HOK_transistor_workshops_desc:0 "Aider les entreprises locales à créer des ateliers d'assemblage de radios à transistors, dotés de locaux pour leur personnel technique et commercial. Les composants importés et les acheteurs étrangers offrent une voie vers les exportations de produits électroniques parallèlement au commerce du textile."
