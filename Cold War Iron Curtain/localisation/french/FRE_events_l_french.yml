l_french:

# === CEFEO (merged from FRE_CEFEO_l_english.yml) ===
#### Metropole events ####
 FRE_Metropole.1.t:0 "Un convoi pour Haiphong"
 FRE_Metropole.1.d:0 "Le commandant en chef en Indochine demande un convoi de matériel : armes légères, munitions, matériel d'ingénierie. Le ministère des Outre-mer soutient la demande ; le ministère des Finances, comme toujours, ne le fait pas."
 FRE_Metropole.1.a:0 "Chargez les navires - manifeste complet."
 FRE_Metropole.1.b:0 "La moitié maintenant, la moitié après le prochain vote du budget."
 FRE_Metropole.1.c:0 "Le corps doit se débrouiller avec ce qu'il a."
 FRE_Metropole.2.t:0 "Renforts pour le Corps"
 FRE_Metropole.2.d:0 "Hanoï demande des hommes. Les classes de conscrits ne peuvent légalement être envoyées en Indochine, ce qui laisse la Légion, les réguliers coloniaux et tous les volontaires que les sergents recruteurs peuvent charmer."
 FRE_Metropole.2.a:0 "Embarquez un groupe bataillon de la Légion."
 FRE_Metropole.2.b:0 "Bénévoles et remplaçants seulement."
 FRE_Metropole.2.c:0 "Pas un homme de plus."
 FRE_Metropole.3.t:0 "Des ailes sur le Tonkin"
 FRE_Metropole.3.d:0 "L'état-major de l'aviation à Hanoï rapporte que la guerre consomme les avions de transport plus vite que la France n'en construit. Ils veulent des Dakota, des Packets et des équipages, et ils les veulent avant la mousson."
 FRE_Metropole.3.a:0 "Envoyez le groupe aérien complet."
 FRE_Metropole.3.b:0 "Une douzaine de transports peuvent être épargnés."
 FRE_Metropole.3.c:0 "L'Armée de l'Air a d'autres guerres à prévoir."
 FRE_Metropole.4.t:0 "Les flottilles Dinassaut"
 FRE_Metropole.4.d:0 "La marine propose de mettre en service des divisions d'assaut fluviales permanentes pour l'Indochine - des barges blindées et des canonnières pour mener la guerre dans les voies navigables du delta."
 FRE_Metropole.4.a:0 "Mettez en service les flottilles."
 FRE_Metropole.4.b:0 "Les estuaires devront se surveiller eux-mêmes."
 FRE_Metropole.5.t:0 "Administrateurs pour Hanoï"
 FRE_Metropole.5.d:0 "Le corps détient un territoire qu'il ne peut pas gouverner. Hanoï a besoin d'administrateurs civils, de payeurs et de magistrats - la machinerie peu glamour qui transforme les terrains occupés en terrains tenus."
 FRE_Metropole.5.a:0 "Deuxièmement, les fonctionnaires."
 FRE_Metropole.5.b:0 "La France manque de commis comme de soldats."
 FRE_Metropole.6.t:0 "Le parc de l'Artillerie"
 FRE_Metropole.6.d:0 "Hanoï veut des armes. Les 105 sortis avec le corps en 1946 sont usés jusqu'aux rayures, et les postes le long de la route coloniale 4 sont envahis un à un car seuls les avions peuvent les atteindre.\n\nL'inspection de l'artillerie souligne que les mêmes tubes sont recherchés en Allemagne."
 FRE_Metropole.6.a:0 "Expédiez tout le parc."
 FRE_Metropole.6.b:0 "Deux batteries, et elles sortent de l'allocation allemande."
 FRE_Metropole.6.c:0 "Les armes restent en Europe."
 FRE_Metropole.7.t:0 "Armes contre blindés et avions"
 FRE_Metropole.7.d:0 "Il s'agit de canons à tir direct pour armer les blockhaus de la ligne De Lattre et de canons automatiques légers pour les aérodromes de Hanoï et de Haiphong.\n\nL'Assemblée trouve absurde la seconde moitié de la demande. Le Viet Minh n'a pas d'avion. L'état-major répond sèchement qu'ils n'avaient pas non plus d'artillerie jusqu'à ce que Mao gagne sa guerre."
 FRE_Metropole.7.a:0 "Envoyez les deux. Imaginez le pire à propos de la Chine."
 FRE_Metropole.7.b:0 "Canons antichar uniquement - il n'y a aucune menace aérienne."
 FRE_Metropole.7.c:0 "Refuser. Le corps ne combat pas une armée européenne."
 FRE_Metropole.8.t:0 "L'allocation de carburant"
 FRE_Metropole.8.d:0 "Tout dans cette guerre marche au pétrole : les escadrons de transport, les flottilles fluviales, les convois de camions qui maintiennent en vie les postes du delta. Les chars d'Haïphong sont réduits et le théâtre demande une part plus importante de l'allocation nationale déjà demandée."
 FRE_Metropole.8.a:0 "Faites naviguer les pétroliers. L'Indochine obtient sa part."
 FRE_Metropole.8.b:0 "La moitié de l'allocation, et en retard."
 FRE_Metropole.8.c:0 "La France a ses propres pénuries."
 FRE_Metropole.9.t:0 "Un vote en espèces supplémentaire"
 FRE_Metropole.9.d:0 "Le corps a parcouru les piastres de son quartier. Les auxiliaires doivent être payés, les porteurs embauchés, les informateurs entretenus, et rien de tout cela n'apparaît dans aucune ligne budgétaire reconnue par l'Assemblée.\n\nUn vote supplémentaire hors saison est possible. C'est aussi exactement le genre de chose que l'opposition lit à haute voix à la tribune."
 FRE_Metropole.9.a:0 "Votez l'avance en totalité."
 FRE_Metropole.9.b:0 "La moitié maintenant, le reste dans le budget du printemps."
 FRE_Metropole.9.c:0 "Le corps vivra selon ses moyens."
 FRE_Metropole.10.t:0 "Paris devient agité"
 FRE_Metropole.10.d:0 "Le ton des câbles en provenance de Paris a changé. Les questions sur les dépenses arrivent avant celles sur l'ennemi. La commission de la défense de l'Assemblée a demandé - pour la troisième fois - un calendrier de \"réduction de l'effort\"."
 FRE_Metropole.10.a:0 "Économiser. Rassurez-les."
 FRE_Metropole.10.b:0 "L'effort de guerre passe avant tout."
 FRE_Metropole.11.t:0 "L'Assemblée rechigne"
 FRE_Metropole.11.d:0 "Les crédits ont été votés par onze voix, après une séance nocturne et deux démissions ministérielles. Le prochain vote, tout le monde en convient, échouera à moins que quelque chose ne change - en Indochine ou dans l'arithmétique du gouvernement."
 FRE_Metropole.11.a:0 "Réduire les opérations pour réduire la liste des victimes."
 FRE_Metropole.11.b:0 "Doublez la mise. La victoire est le seul argument qu'ils entendront."
 FRE_Metropole.12.t:0 "Paris en a assez"
 FRE_Metropole.12.d:0 "L'instruction arrive pour une fois en langage clair : plus d'opérations offensives, plus de demandes de renfort. La République n'entend plus gagner la guerre d'Indochine ; il a l'intention de le quitter."
 FRE_Metropole.12.a:0 "Encore un appel : mendiez s'il le faut."
 FRE_Metropole.12.b:0 "Qu'il en soit ainsi."
 FRE_Metropole.13.t:0 "Confiance renouvelée"
 FRE_Metropole.13.d:0 "Pour la première fois de mémoire, les câbles en provenance de Paris contiennent quelque chose comme de l'optimisme. Les crédits se sont déroulés confortablement ; les ministres parlent de \"aller jusqu'au bout\". Le Corps a gagné du temps."
 FRE_Metropole.13.a:0 "Faites en sorte que cela compte."
 FRE_Metropole.20.t:0 "L'Assemblée débat de l'Indochine"
 FRE_Metropole.20.d:0 "Le débat annuel sur l'Indochine s'ouvre à l'Assemblée nationale. La droite parle d'honneur, le centre des budgets, la gauche de « la vente guerre ». Quelque part sous la rhétorique, la guerre de l'année prochaine sera décidée."
 FRE_Metropole.20.a:0 "Battez-vous pour le générique complet."
 FRE_Metropole.20.b:0 "Tenez le cap, rien de plus."
 FRE_Metropole.20.c:0 "Commencez à mettre fin à cette mésaventure."

#### Allied events ####
 FRE_Allies.1.t:0 "Instructeurs de l'Armée Nationale"
 FRE_Allies.1.d:0 "Le commandement français propose des instructeurs, des dépôts et de la doctrine pour étoffer l'Armée nationale vietnamienne. C'est une aide, et c'est aussi un rappel de qui rédige encore les manuels de formation."
 FRE_Allies.1.a:0 "Accueillez les instructeurs."
 FRE_Allies.1.b:0 "L'Armée nationale forme ses propres hommes."
 FRE_Allies.10.t:0 "Grand livre du colonel Trinquier"
 FRE_Allies.10.d:0 "Le maquis GCMA coûte de l'argent qui n'apparaît dans aucun budget. Le colonel Trinquier explique, sans vraiment expliquer, comment les réseaux montagnards pourraient se financer eux-mêmes - les cultures que cultivent déjà les montagnards, le commerce qui existe déjà, simplement... Administré."
 FRE_Allies.10.a:0 "Détourner les yeux. Les maquis se payent eux-mêmes."
 FRE_Allies.10.b:0 "Financez-les sur le budget officiel, quoi qu'il en coûte."

#### Battle events ####
 FRE_Battles.5.t:0 "Le hachoir à viande de Hoa Binh"
 FRE_Battles.5.d:0 "La première phase réussit : des colonnes aéroportées et fluviales s'emparent de Hoa Binh et implantent un saillant français à travers le couloir nord-sud de l'ennemi. Giap a répondu en engageant trois divisions contre la route 6, les postes de Rivière Noire et la ville elle-même. Une route et une rivière transportent désormais tous les obus et toutes les rations à travers un pays sous le feu.\n\nLe choix est désormais un pari clair. L'opération Amarante se retirera délibérément au jour 105, concédera Hoa Binh, préservera la force de campagne et poursuivra la guerre au sens large. Tenir conserve l'objectif et les risques qui le forcent jusqu'au jour 210 : le succès apporte la plus grande récompense, mais un saillant brisé inflige des pertes au-delà d'une défaite de campagne ordinaire."
 FRE_Battles.5.a:0 "Conservez Hoa Binh et risquez la force de terrain."
 FRE_Battles.5.b:0 "Retirez-vous au jour 105 et préservez la force de terrain."
 FRE_Battles.5.c:0 "L'ancienne étude ne régit plus la bataille."

#### Dien Bien Phu ####
 FRE_DBP.10.t:0 "Un câble de Hanoï"
 FRE_DBP.10.d:0 "Les Français demandent des Vautours : frappes de porte-avions et B-29 au-dessus de Dien Bien Phu. Les chefs d'état-major sont divisés, la direction du Congrès est froide et le mot « atomique » est déjà apparu dans un mémorandum."
 FRE_DBP.10.a:0 "Envoyez les bombardiers."
 FRE_DBP.10.b:0 "Pas de guerre plus large."

#### Command rotation ####
 FRE_Command.1.t:0 "Le Roi Jean"
 FRE_Command.1.d:0 "Le général Jean de Lattre de Tassigny descend de l'avion à Tan Son Nhut en tenue blanche, ignore les briefings d'évacuation préparés et informe l'état-major rassemblé que les épouses et les familles resteront à Hanoï. La panique s'éteint dans la pièce où elle se trouvait."
 FRE_Command.1.a:0 "Le corps a à nouveau un commandant."
 FRE_Command.2.t:0 "La mort de Bernard de Lattre"
 FRE_Command.2.d:0 "Le lieutenant Bernard de Lattre, fils unique du Maréchal, a été tué en tenant le rocher de Ninh Binh face à la 308ème Division. Le commandant en chef a reçu le signal lors de la conférence du matin. Il le lut, le plia et poursuivit le briefing."
 FRE_Command.2.a:0 "Il enterre son fils et reste à son poste."
 FRE_Command.2.b:0 "Accordez-lui la permission de faire son deuil."
 FRE_Command.3.t:0 "Le maréchal est en train de mourir"
 FRE_Command.3.d:0 "Les médecins de Paris ont découvert le cancer et le Maréchal a été prévenu. Il continue d'envoyer quotidiennement des messages à Hanoï - ordres, exhortations, demandes de patrouilles agressives - depuis un lit d'hôpital qu'il ne quittera pas."
 FRE_Command.3.a:0 "Préparez la succession tranquillement."
 FRE_Command.4.t:0 "La Mort de Lattre"
 FRE_Command.4.d:0 "Le maréchal de Lattre de Tassigny est mort à Paris, onze mois après avoir pris le théâtre et un an presque jour pour jour après la chute de son fils à Ninh Binh. La France lui offre des funérailles nationales. L'Indochine lui accorde une minute de silence, puis la guerre reprend."
 FRE_Command.4.a:0 "Le général Salan prend le commandement."
 FRE_Command.4.b:0 "Pour le moment, c'est l'état-major qui mène la guerre."
 FRE_Command.5.t:0 "Navarre prend le commandement"
 FRE_Command.5.d:0 "Le général Henri Navarre - cavalerie, renseignement, carrière d'état-major propre - prend le commandement d'une guerre qu'il a vue pour la première fois le mois dernier. Il n'a reçu aucune instruction que quiconque puisse trouver par écrit, ce qu'il considère comme une liberté d'action."
 FRE_Command.5.a:0 "Un nouveau balai pour une vieille guerre."
 FRE_Command.6.t:0 "Le Plan de Navarre"
 FRE_Command.6.d:0 "Le nouveau commandant en chef présente son plan : reconstruire un corps de combat mobile, maintenir l'ennemi hors de l'équilibre tout au long de la campagne à venir et forcer un engagement décisif sur un terrain favorable. Paris a déjà entendu parler de projets. Celui-ci est accompagné d'un planning."
 FRE_Command.6.a:0 "Cherchez la bataille décisive."
 FRE_Command.6.b:0 "Mari, notre force."

#### Flavor pool ####
 FRE_Flavor.1.t:0 "Le grand livre de l'Opération X"
 FRE_Flavor.1.d:0 "Un grand livre existe. Il enregistre, d'une main d'état-major bien rangée, les mouvements de l'opium des Highlands sur les cellules des avions français et les francs qui revenaient sous forme de fusils pour les maquis. Un exemplaire se trouve peut-être déjà dans un tiroir d'un bureau à Paris."
 FRE_Flavor.1.a:0 "Enterrez l'histoire."
 FRE_Flavor.1.b:0 "Arrêtez l'opération X."
 FRE_Flavor.2.t:0 "Echos de l'Affaire des Généraux"
 FRE_Flavor.2.d:0 "Le scandale du Rapport Revers ne mourra pas. Les noms d'officiers en activité ne cessent de faire surface dans les hebdomadaires parisiens, chaque fuite étant programmée pour un vote budgétaire. Quelqu'un à l'intérieur de l'établissement alimente toujours le feu."
 FRE_Flavor.2.a:0 "Traquez les fuyards."
 FRE_Flavor.2.b:0 "Laissez-le souffler."
 FRE_Flavor.3.t:0 "Déserteurs dans les rangs"
 FRE_Flavor.3.d:0 "Le Deuxième Bureau fait état de déserteurs de la Légion - des Allemands pour la plupart - qui diffusent des émissions pour le Viet Minh en trois langues. Une poignée d'entre eux sont revenus à travers les lignes, à moitié affamés et demandant l'amnistie."
 FRE_Flavor.3.a:0 "Amnistie tranquille pour ceux qui reviennent."
 FRE_Flavor.3.b:0 "Cours martiales, publiquement."
 FRE_Flavor.4.t:0 "La mousson avale les routes"
 FRE_Flavor.4.d:0 "Le RC1 est sous un mètre d'eau brune et les aérodromes sont en boue. L'ennemi, qui mène sa guerre à vélo et à dos, s'en soucie bien moins que nous."
 FRE_Flavor.4.a:0 "Faites passer les convois."
 FRE_Flavor.4.b:0 "Attendez la fin des pluies."
 FRE_Flavor.5.t:0 "La mission MAAG arrive"
 FRE_Flavor.5.d:0 "L'American Military Assistance Advisory Group a ouvert des bureaux à Saigon : des colonels en équipe avec des planchettes à pince, une foi évangélique dans la logistique et une autorité de signature sur l'aide que nous avons demandée."
 FRE_Flavor.5.a:0 "Faites le tour complet aux Américains."
 FRE_Flavor.5.b:0 "Gardez-les à bout de bras."
 FRE_Flavor.6.t:0 "Des camions à la frontière chinoise"
 FRE_Flavor.6.d:0 "La reconnaissance aérienne dénombre quatre cents camions Molotova sur les routes de Cao Bang en une seule semaine. Au-delà de la frontière, des instructeurs chinois reconstituent les régiments de Giap en divisions dotées d'artillerie."
 FRE_Flavor.6.a:0 "Faites un raid dans les couloirs d'approvisionnement."
 FRE_Flavor.6.b:0 "Creusez le long de la RC4."
 FRE_Flavor.7.t:0 "Les Casinos de l'Empereur"
 FRE_Flavor.7.d:0 "Les Binh Xuyen ont proposé au corps d'armée une part des recettes du casino du Grand Monde en échange d'avoir les mains libres sur le front de mer de Saigon. La cour de Sa Majesté, qui a son propre arrangement, déconseille de poser des questions."
 FRE_Flavor.7.a:0 "Prenez la coupe."
 FRE_Flavor.7.b:0 "Refusez l'argent sale."
 FRE_Flavor.8.t:0 "Le différend douanier de Haïphong"
 FRE_Flavor.8.d:0 "L'État du Vietnam réclame les recettes douanières d'Haïphong au titre des accords d'indépendance. Le corps le récupère pour nécessité militaire. Les deux parties ont des avocats ; un seul camp a une garnison."
 FRE_Flavor.8.a:0 "Le port reste sous contrôle militaire."
 FRE_Flavor.8.b:0 "Remettez la douane à Saigon."
 FRE_Flavor.9.t:0 "Le Monde publie les listes des victimes"
 FRE_Flavor.9.d:0 "Quelqu'un a donné au Monde le nombre réel de victimes pour l'année - pas les chiffres communiqués, les chiffres réels. La pièce paraît demain sous le titre « Le prix du silence »."
 FRE_Flavor.9.a:0 "Appuyez-vous sur les censeurs."
 FRE_Flavor.9.b:0 "La République a une presse libre."
 FRE_Flavor.10.t:0 "Embuscade le jour de la chanson"
 FRE_Flavor.10.d:0 "Un convoi Dinassaut a subi des tirs de fusil sans recul des deux rives au virage du Jour de la Chanson - un LCM brûlé, onze hommes perdus. La guerre fluviale a ses règles, et l'ennemi vient de les réécrire."
 FRE_Flavor.10.a:0 "Balayez les berges."
 FRE_Flavor.10.b:0 "Réacheminez les convois."
 FRE_Flavor.11.t:0 "Un serment dans les Highlands"
 FRE_Flavor.11.d:0 "Les chefs de maquis du haut pays ont demandé au commandant en chef d'assister au sacrifice de bisons au cours duquel leurs jeunes gens prêtent serment au fusil. C'est trois jours en avion et à dos de mulet, et le personnel appelle ça du théâtre. Ce n'est pas le cas des chefs."
 FRE_Flavor.11.a:0 "Le commandant est présent en personne."
 FRE_Flavor.11.b:0 "Envoyez un colonel d'état-major avec des cadeaux."
 FRE_Flavor.12.t:0 "Le Pasteur rentre à la maison"
 FRE_Flavor.12.d:0 "Le navire-hôpital Pasteur accoste à Marseille avec huit cents blessés. Le syndicat des travailleurs portuaires a voté pour lui « accueillir » ; les associations d'anciens combattants seront là aussi. Ce sera une scène, d'une manière ou d'une autre."
 FRE_Flavor.12.a:0 "Tous les honneurs sur le quai."
 FRE_Flavor.12.b:0 "Pas de caméras sur les quais."
 FRE_Flavor.13.t:0 "La Sale-Guerre"
 FRE_Flavor.13.d:0 "Les dockers de Marseille refusent de charger des navires pour l'Indochine ; à l'Assemblée, les députés lisent les noms des morts dans les actes. « La sale guerre », disent les pancartes. Le gouvernement doit décider quelle quantité de commande acheter et à quel prix."
 FRE_Flavor.13.a:0 "Mettez fin aux grèves à quai."
 FRE_Flavor.13.b:0 "Laissez-les marcher."
 FRE_Flavor.14.t:0 "Les photographes d'Indochine"
 FRE_Flavor.14.d:0 "Life, Paris Match et trois agences demandent une accréditation pour les opérations de printemps. La dernière fois que des photographes sont arrivés au front sans escorte, les photos nous ont coûté un vote budgétaire. La fois d'avant, ils nous en ont gagné un."
 FRE_Flavor.14.a:0 "Donnez-leur la première ligne."
 FRE_Flavor.14.b:0 "Visites guidées de l'arrière uniquement."

#### Wind-down ####
 FRE_Winddown.1.t:0 "Ordonnances de cessez-le-feu de Paris"
 FRE_Winddown.1.d:0 "Le signal est court : les hostilités en Indochine sont terminées ; le corps se préparera au retrait progressif ; d'autres instructions suivent. Huit années de guerre se terminent en quarante mots, heure de transmission 04h00."
 FRE_Winddown.1.a:0 "Arrêtez le corps."
 FRE_Winddown.2.t:0 "L'évacuation d'Haïphong"
 FRE_Winddown.2.d:0 "Les quais d'Haïphong sont noirs de monde : des soldats qui embarquent, et à côté d'eux des centaines de milliers de civils qui ne resteront pas pour répondre au nouvel ordre du Nord. Il n'y a pas assez de transport dans le théâtre pour tous les transporter. Les Américains proposent les leurs."
 FRE_Winddown.2.a:0 "Acceptez le transport maritime américain."
 FRE_Winddown.2.b:0 "Nous partons dans nos propres fesses."
 FRE_Winddown.3.t:0 "Le retrait progressif"
 FRE_Winddown.3.d:0 "Le calendrier est convenu : garnison par garnison, le corps remet ses postes à l'Armée nationale vietnamienne et marche vers les ports. Ce qui reste à décider, c'est le rythme - et la part des acquis, des postes et des connaissances accumulés pendant huit ans qui sera transmise plutôt qu'abandonnée."
 FRE_Winddown.3.a:0 "Accélérer. Ramenez les garçons à la maison."
 FRE_Winddown.3.b:0 "Une passation de pouvoir délibérée et ordonnée."
 FRE_Winddown.4.t:0 "Le dernier navire sorti"
 FRE_Winddown.4.d:0 "Une haie d'honneur, un drapeau replié, une fanfare jouant mincement contre le vent du port. Les derniers éléments du Corps Expéditionnaire Français d'Extrême-Orient embarquent. Derrière eux : les tombes de quatre-vingt-dix mille personnes et un pays qui doit maintenant décider de ce qu'il sera sans eux."
 FRE_Winddown.4.a:0 "La guerre des corps est terminée."
 FRE_Winddown.5.t:0 "Le Corps rentre à la maison"
 FRE_Winddown.5.d:0 "Les transports en provenance d'Indochine accostent à Marseille et à Toulon. Les hommes descendent les passerelles dans une France qui, pour sa part, a déjà décidé de ne plus en parler."
 FRE_Winddown.5.a:0 "Un chapitre honorable se termine."
 FRE_Winddown.5.b:0 "Plus jamais une telle guerre."

#### Operation commitment (FRE_Ops namespace) ####
 FRE_Ops.1.t:0 "Jusqu'où nous engageons-nous ?"
 FRE_Ops.1.d:0 "Choisissez l'ampleur de l'engagement. Un engagement léger préserve les réserves ; l'engagement standard fournit le soutien habituel ; l'engagement maximum coûte plus de crédits de guerre et de patience métropolitaine. Pour Hirondelle, un engagement plus important réduit également la durée d'exploitation requise.\n\n§YOBJECTIF ACTUEL§!\n[GetFREOperationObjective]\n\nLes provinces mises en évidence sont les cibles des opérations menées sur le terrain. Les forces de l'Union française sont le CEFEO, la France, la Fédération Tai et l'État du Vietnam. Tenez compte de l'avertissement de surextension de l'opération ; prendre un autre terrain ne remplace pas son objectif.\n\nCrédits de guerre disponibles : §Y[?FRE.FRE_War_Credits|0]§!\nPatience Métropole : §Y[?FRE.FRE_Metropole_Patience|0]§!/100"
 FRE_Ops.1.a:0 "Autoriser un engagement léger."
 FRE_Ops.1.b:0 "Attribuez la réserve standard."
 FRE_Ops.1.c:0 "Engagez le maximum, malgré le coût pour Paris."
 FRE_Ops.1.e:0 "Nous manquons de crédits de guerre. Annulez l'opération."
 FRE_Ops.2.t:0 "L'opération a suivi son cours"
 FRE_Ops.2.d:0 "Les colonnes sont au bout de leurs lignes de ravitaillement et l'ennemi n'a pas rompu. Le personnel souhaite que l'ordre se désengage. L'Etat-Major de Saigon veut un résultat qui fasse plaisir.\n\nL'un d'eux va être déçu."
 FRE_Ops.2.a:0 "Appuyez dessus. Nous ne sommes pas allés jusqu'ici pour nous retirer."
 FRE_Ops.2.b:0 "Rompre. Mettez en banque ce que nous avons pris."
 FRE_Ops.10.t:0 "L'objectif tombe"
 FRE_Ops.10.d:0 "Le poste est le nôtre."
 FRE_Ops.10.a:0 "Signalez à Saigon."
 FRE_Ops.11.t:0 "L'attaque est interrompue"
 FRE_Ops.11.d:0 "Les colonnes reculent."
 FRE_Ops.11.a:0 "Couvrir le retrait."
 FRE_Ops.12.t:0 "L'opération échoue"
 FRE_Ops.12.d:0 "Aucune des deux parties ne peut imposer une décision."
 FRE_Ops.12.a:0 "Faites le point."
 FRE_Ops.20.t:0 "Le corps expéditionnaire est tenu"
 FRE_Ops.20.d:0 "Les colonnes françaises arrivèrent avec des blindés et des avions et repartirent par où elles étaient venues. Nos unités tenaient les lignes de crête, cédaient du terrain là où celui-ci ne valait rien et le reprenaient lorsque les camions faisaient demi-tour.\n\nLes cadres étudieront longtemps celui-ci.\n\nChaque opération que les Français organisent et ne parvient pas à gagner est un argument avancé à Paris en notre faveur."
 FRE_Ops.20.a:0 "La guerre populaire est patiente."
 FRE_Ops.20.b:0 "Notez-le."
 FRE_Ops.21.t:0 "Le corps expéditionnaire perce"
 FRE_Ops.21.d:0 "Les Français ont pris position. Nos unités se sont désengagées plutôt que d'être encerclées, ce qui est une décision correcte et coûteuse.\n\nLes villages du secteur paieront pour cela, et les cadres qui ont promis leur protection devront répondre de cette promesse.\n\nLa guerre est longue. Cette semaine appartient à Saigon."
 FRE_Ops.21.a:0 "Regrouper. Reconstruire. Retour."
 FRE_Ops.21.b:0 "Notez-le."

# === Dien Bien Response (merged from FRE_Dien_Bien_Response_l_english.yml) ===
 FRE_Dien_Bien.1.t:0 "La défense de Dien Bien Phu"
 FRE_Dien_Bien.1.d:0 "Le Viet Minh a engagé sa principale force dans la vallée. Le camp reste une tête aérienne entourée de hauteurs, et chaque plan échange désormais des hommes, des avions et du crédit politique contre du temps. Une défense conventionnelle préserve la flexibilité mais ne peut pas sécuriser la piste d'atterrissage. Un renforcement maximal peut permettre de maintenir les ouvrages intacts plus longtemps, au prix de lier la réserve expéditionnaire à un seul bassin. L'Opération Condor peut tenter de rouvrir un couloir terrestre après la fin du siège. Un appel à l'Opération Vautour risque d'élargir la guerre tout en laissant la décision finale à Washington.\n\nQuel que soit le choix, le camp n'est pas déclaré sauvé d'avance. Il doit rester hors des mains du Viet Minh jusqu'à la fin de sa campagne."
 FRE_Dien_Bien.1.a:0 "Tenez avec la garnison et le pont aérien prévu."
 FRE_Dien_Bien.1.b:0 "Envoyez les réserves et entretenez le pont aérien à tout prix."
 FRE_Dien_Bien.1.c:0 "Préparez l'opération Condor pour rouvrir le couloir."
 FRE_Dien_Bien.1.e:0 "Demandez à Washington l'opération Vautour."

 FRE_Dien_Bien.2.t:0 "Avion américain au-dessus de la vallée"
 FRE_Dien_Bien.2.d:0 "Washington a autorisé un soutien aérien au camp. De nouveaux parachutes, munitions et équipements radio entrent déjà dans la passerelle aérienne, tandis que les équipages américains commencent à frapper les routes et les positions de canons autour du bassin. L'aide permet de gagner du temps et de la puissance de feu ; il ne fait pas tomber le Viet Minh des hauteurs ni ne décide si la position peut tenir."
 FRE_Dien_Bien.2.a:0 "Utilisez toutes les heures qu'ils nous ont achetées."
 FRE_Dien_Bien.3.t:0 "Washington refuse le vautour"
 FRE_Dien_Bien.3.d:0 "La réponse de Washington est non. Le président n'étendra pas la guerre sans les engagements des alliés et le soutien du Congrès, et ni l'un ni l'autre n'existe. Le camp ne recevra aucune offensive de bombardiers américains. Sa garnison doit désormais survivre grâce au pont aérien et aux moyens déjà engagés depuis l'Indochine."
 FRE_Dien_Bien.3.a:0 "Ensuite, le corps se bat avec ce qu'il a."
 FRE_Dien_Bien.4.t:0 "L'Opération Condor ouvre le couloir"
 FRE_Dien_Bien.4.d:0 "Les colonnes de secours ont relié les positions extérieures au camp et ont maintenu la route ouverte pendant une semaine de contre-attaques. Les hommes blessés et les unités épuisées partent tandis que les munitions et les remplaçants arrivent. La vallée reste contestée, mais la garnison ne combat plus comme une poche isolée et le calendrier de siège a été retardé."
 FRE_Dien_Bien.4.a:0 "Maintenez la route et reconstruisez la ligne intérieure."

 FRE_Dien_Bien.5.t:0 "Le grand livre de Dien Bien Phu"
 FRE_Dien_Bien.5.d_held:0 "La campagne du Viet Minh a expiré et le camp est toujours aux mains des Français. Le transport aérien programmé et le plan de garnison ordinaire se sont avérés suffisants. La vallée reste isolée et coûteuse, mais Paris peut désormais affirmer que la position a fait ce pour quoi elle a été construite : attirer la force principale de Giap et y survivre."
 FRE_Dien_Bien.5.d_reinforced:0 "La campagne du Viet Minh a expiré contre un camp soutenu par toute la réserve expéditionnaire. L'engagement était coûteux, mais le pont aérien, les bataillons de remplacement et les ouvrages reconstruits ont maintenu la position centrale intacte jusqu'à la date limite. Paris doit désormais payer le pari qu'il a exigé et peut également réclamer son retour."
 FRE_Dien_Bien.5.d_condor:0 "L'opération Condor a rouvert les abords après l'investissement de la vallée, et le couloir est resté utile suffisamment longtemps pour soulager la garnison et rompre le calendrier de siège. Le camp a survécu à la campagne du Viet Minh. Le résultat appartient aux troupes qui tenaient le bassin et aux colonnes qui y sont parvenues, et non à une promesse faite avant que l'une ou l'autre tâche ne soit accomplie."
 FRE_Dien_Bien.5.d_vulture:0 "Le soutien aérien américain a permis à la garnison de gagner du temps. La campagne du Viet Minh a expiré sans prendre le camp, et l'Opération Vautour peut être présentée comme l'intervention qui a préservé la position française. Cela a également rendu la guerre visiblement internationale, un prix qui suivra chaque négociation ultérieure."
 FRE_Dien_Bien.5.d_fall_standard:0 "La défense standard a échoué. La piste d'atterrissage a été fermée, les points forts intérieurs ont été réduits et le camp est désormais aux mains du Viet Minh. Le résultat plus large de la campagne et le choc politique seront enregistrés ailleurs ; le corps expéditionnaire doit aussi rendre compte de la garnison et des formations perdues dans la vallée."
 FRE_Dien_Bien.5.d_fall_max:0 "Un renforcement maximal a transformé la défaite en catastrophe. Les réserves, les canons et les efforts de transport engagés pour maintenir le camp en vie sont piégés avec lui, et les pertes dépassent celles d'une défense défaillante ordinaire. Paris exigeait que la vallée soit tenue à tout prix. Le compte est arrivé."
 FRE_Dien_Bien.5.d_fall_condor:0 "L'opération Condor n'a pas pu sauver le camp. Les colonnes de secours soit n'ont pas réussi à rouvrir les abords, soit les ont ouvertes trop brièvement pour inverser le siège. Toute route sécurisée avant l'effondrement final a permis à une partie de la garnison de s'échapper, mais la vallée et l'objectif de campagne appartiennent au Viet Minh."
 FRE_Dien_Bien.5.d_fall_vulture:0 "La puissance aérienne n'a pas sauvé le camp. Que Washington limite son aide ou s'engage ouvertement, le Viet Minh ferme la bande, survit aux frappes et occupe la position centrale. Le corps expéditionnaire a perdu la vallée tandis que le coût diplomatique de demander à une autre puissance d'élargir la guerre demeure."
 FRE_Dien_Bien.5.d_inconclusive:0 "Les combats se terminent sans que le camp soit pris et sans que l'offensive du Viet Minh ne s'épuise avant l'échéance finale. Le plan défensif est clôturé sans prétendre à une victoire ; la guerre plus large ou un armistice, plutôt que ce grand livre, a mis fin à la lutte immédiate."
 FRE_Dien_Bien.5.d_superseded:0 "Une colonie plus large a dépassé le siège. Les dispositions des garnisons, les plans de secours et les appels à la puissance aérienne extérieure sont dénoués selon les termes régissant l'ensemble du théâtre. Aucune victoire ou défaite défensive séparée ne sera accordée."
 FRE_Dien_Bien.5.a:0 "Fermez le grand livre opérationnel du camp."

 VIN_Dien_Bien.1.t:0 "La Défense dans la Vallée"
 VIN_Dien_Bien.1.d_held:0 "Le camp colonial reste hors de notre contrôle après la dernière échéance de l'offensive. Un pont aérien, des renforts ou un couloir rouvert ont maintenu la position en vie suffisamment longtemps pour que les divisions d'assaut puissent dépenser leurs forces. La vallée n'a pas décidé de la guerre en notre faveur."
 VIN_Dien_Bien.1.d_fall:0 "Le camp de Dien Bien Phu est le nôtre. Les renforts, les colonnes de secours et les avions étrangers modifièrent le coût et le calendrier du siège, mais aucun n'en modifia l'objectif. La position centrale a chuté et la campagne transpose désormais ce résultat dans la lutte et les négociations à venir."
 VIN_Dien_Bien.1.d_inconclusive:0 "La bataille s'est terminée sans que le camp ne tombe et sans que l'ennemi prouve qu'il pouvait survivre à toute la campagne. Les divisions quittent la vallée parce que les tirs ou la guerre au sens large ont cessé, et non parce que l'un ou l'autre plan opérationnel a obtenu son meilleur résultat."
 VIN_Dien_Bien.1.d_superseded:0 "Une colonie plus large a pris le pas sur la bataille dans la vallée. La campagne se termine sans résultat distinct sur le champ de bataille de Dien Bien Phu, et les positions abandonnées seront éliminées selon les conditions régissant l'ensemble du théâtre."
 VIN_Dien_Bien.1.a:0 "La campagne a parlé."

# === Hoa Binh Response (merged from FRE_Hoa_Binh_Response_l_english.yml) ===
 FRE_Hoa_Binh.1.t:0 "Le saillant de Hoa Binh"
 FRE_Hoa_Binh.1.d_withdrawal:0 "L'opération Amarante a ramené la garnison, les canons et les groupes mobiles le long de la route 6 par bonds successifs. Hoa Binh et son objectif de campagne ont été délibérément concédés, mais la guerre d'Indochine continue. Les formations, équipements et crédits opérationnels récupérés peuvent désormais renforcer le Delta et améliorer les préparatifs à Na San. Hanoï a gagné le couloir ; Le CEFEO a préservé l'effectif de terrain."
 FRE_Hoa_Binh.1.d_held:0 "Les derniers assauts du Viet Minh ont reflué avec le drapeau tricolore toujours sur Hoa Binh. Le saillant reste exposé et dépendant de la route 6, mais la campagne de Giap s'est épuisée avant de le briser. Paris financera le commandement qui a soutenu le pari, et les récompenses politiques et opérationnelles dépassent désormais les ressources engagées dans la défense."
 FRE_Hoa_Binh.1.d_lost_hold:0 "Le pari est raté. La route 6 est coupée, les postes de Rivière Noire reculent et Hoa Binh appartient aux divisions de Giap. Les réserves et équipements engagés en lieu et place de l'opération Amarante ne peuvent désormais pas être extraits dans de bonnes conditions. Le CEFEO doit absorber des pertes au-delà du coût ordinaire d'une défaite de la campagne, tandis que Paris considère le saillant brisé comme la preuve que l'avertissement a été ignoré."
 FRE_Hoa_Binh.1.d_lost:0 "Le saillant s'est brisé avant que l'opération Amarante puisse l'extraire. La route 6 est coupée, les postes de Rivière Noire reculent et Hoa Binh appartient aux divisions de Giap. Le gain prévu en matière de préservation des forces a été perdu ; ce qui reste, c'est le coût ordinaire d'une victoire du Viet Minh sur le champ de bataille."
 FRE_Hoa_Binh.1.d_inconclusive:0 "La contre-offensive s'est terminée sans un assaut décisif sur le saillant et sans que l'état-major ait exécuté son plan dans son intégralité. Hoa Binh reste sur les rangs, mais la campagne n'a rien décidé quant à savoir si elle pourra être maintenue la prochaine fois que Giap se concentrera contre elle."
 FRE_Hoa_Binh.1.d_superseded:0 "Les événements ailleurs ont dépassé le concours pour Hoa Binh. Le saillant est en train d'être cédé dans le cadre d'une colonie plus large, et ni le retrait prévu ni la tentative de le tenir ne seront enregistrés comme résultat du champ de bataille."
 FRE_Hoa_Binh.1.a:0 "Fermez le grand livre de l'opération."

 VIN_Hoa_Binh.1.t:0 "Le couloir traversant Hoa Binh"
 VIN_Hoa_Binh.1.d_withdrawal:0 "Les Français ont procédé à un retrait discipliné de Hoa Binh. Leurs colonnes se sont échappées par la route 6, mais le saillant a disparu et le couloir nord-sud est à nouveau ouvert. Ils peuvent conserver leurs bataillons ; ils ne peuvent pas préserver le but pour lequel ces bataillons ont été envoyés dans les collines."
 VIN_Hoa_Binh.1.d_held:0 "L'offensive s'est épuisée contre Hoa Binh. La route 6 est restée ouverte juste assez souvent, les avions français ont ravitaillé les points forts et la garnison est toujours dans la ville. Nos divisions doivent se désengager sans le couloir qu'elles sont censées récupérer."
 VIN_Hoa_Binh.1.d_lost:0 "Hoa Binh est à nous. Le saillant s'effondre sous la pression de la ville, de la route 6 et des postes de Rivière Noire avant que les Français puissent l'extraire en bon ordre. Le couloir est ouvert et les hauts plateaux de Muong ne font plus écran au flanc ouest du Delta."
 VIN_Hoa_Binh.1.d_inconclusive:0 "La campagne s'est terminée sans que le saillant change de mains et sans une décision définitive de la France de l'abandonner. Hoa Binh reste un poste exposé de l'autre côté du couloir, et les divisions se retirent sachant que le même terrain devra peut-être être à nouveau combattu."
 VIN_Hoa_Binh.1.d_superseded:0 "Un règlement plus large a pris le pas sur la bataille de Hoa Binh. Ni le saillant français ni notre contre-offensive n'auront de résultat distinct sur le champ de bataille en dehors des conditions qui régissent désormais l'ensemble du théâtre."
 VIN_Hoa_Binh.1.a:0 "La campagne est décidée."

# === Northwest Response (merged from FRE_Northwest_Response_l_english.yml) ===
 FRE_Northwest.1.t:0 "Opération Lorraine"
 FRE_Northwest.1.d_active:0 "Les divisions de Giap se déplacent à travers le pays Tai. L'objectif de la Lorraine n'est pas de reprendre directement le Nord-Ouest, mais de rendre cette avance inabordable : quatre groupes mobiles peuvent remonter la Clear River pendant que les parachutistes tombent sur les dépôts de Phu Doan. Si Hanoï tourne ses divisions vers l'est, Na San gagne du temps. Dans le cas contraire, les réserves alimentant l'offensive pourraient être détruites.\n\nLe danger réside dans la marche du retour. Chaque kilomètre au-delà du delta allonge une route que le Viet Minh peut tracer, et une force envoyée contre les dépôts est une force absente des hauts plateaux. Salan peut autoriser la poussée complète, limiter l'opération à un raid précis ou maintenir les groupes mobiles autour de la tête aérienne."
 FRE_Northwest.1.d_planned:0 "L'équipe a terminé son étude en vue d'une dérivation en amont de la rivière Clear. Des groupes mobiles, des blindés, des embarcations fluviales et un groupe aéroporté peuvent être rassemblés contre les dépôts du Viet Minh autour de Phu Doan si Hanoï ouvre son offensive attendue du Nord-Ouest.\n\nJusqu'au début de cette campagne, la Lorraine reste une contingence plutôt qu'une guerre indépendante."
 FRE_Northwest.1.a:0 "Roulez sur Phu Doan avec les groupes mobiles."
 FRE_Northwest.1.b:0 "Faites un raid dans les dépôts, puis retirez-vous immédiatement."
 FRE_Northwest.1.c:0 "Gardez les groupes mobiles pour Na San."
 FRE_Northwest.1.e:0 "Il n'y a pas de réserve mobile à dépenser."
 FRE_Northwest.1.d:0 "Déposez le plan jusqu'à l'éruption du Nord-Ouest."

 FRE_Northwest.2.t:0 "Le bilan de la Lorraine"
 FRE_Northwest.2.d_success:0 "Lorraine a fait ce que Salan lui demandait. La poussée vers l'arrière du Viet Minh soit a brisé l'offensive du Nord-Ouest, soit a contraint Hanoï à l'abandonner, et les groupes mobiles sont revenus avec l'initiative brièvement rétablie. Le coût était substantiel, mais Paris peut se vanter d'un résultat stratégique plutôt que d'une collection de magasins capturés."
 FRE_Northwest.2.d_limited:0 "Les colonnes trouvent les dépôts et détruisent ce qu'elles ne peuvent ni emporter ni compter, mais l'offensive du Nord-Ouest se poursuit. La Lorraine a produit un succès tactique sans décider de la campagne pour laquelle elle a été lancée. Le retrait compte autant que l'avancée : les groupes mobiles sont rentrés chez eux avant que la route ne se referme derrière eux."
 FRE_Northwest.2.d_failure:0 "La déviation n'a pas réussi à détourner. Giap a maintenu sa force principale dans le nord-ouest tandis que les régiments locaux se sont rapprochés sur la route du retour, laissant les groupes mobiles se frayer un chemin vers le delta. Les magasins pris autour de Phu Doan ne compensent pas les véhicules, le temps et la confiance laissés le long de la rivière Clear."
 FRE_Northwest.2.d_withheld:0 "Il n'y aura pas de grande poussée en amont de la Clear River. Les groupes mobiles et leurs moyens de transport sont restés aux mains des têtes aériennes des hautes terres, acceptant que les dépôts du Viet Minh restent intacts en échange d'une défense plus renforcée autour de Na San. Lorraine ne survit que dans le cadre de l'opération que le corps a choisi de ne pas mener."
 FRE_Northwest.2.d_superseded:0 "Les événements ont rattrapé la Lorraine. Un armistice plus large ou l'effondrement du théâtre sont survenus avant que l'opération puisse acquérir une signification militaire, et les colonnes ont été retirées sans revendiquer de victoire ni accepter de défaite."
 FRE_Northwest.2.a:0 "Inscrire le résultat dans le journal de campagne."

 VIN_Northwest.1.t:0 "La diversion française prend fin"
 VIN_Northwest.1.d_success:0 "La poussée française sur nos arrières orientaux a atteint son objectif. Que ce soit par la perte de provisions, les formations détournées ou la pression exercée sur les zones de base, la Lorraine a contribué à briser l'offensive du Nord-Ouest. L'état-major doit traiter le réseau routier derrière le front comme un champ de bataille à part entière."
 VIN_Northwest.1.d_limited:0 "Les colonnes françaises atteignirent les dépôts arrière et détruisirent les magasins avant de rebrousser chemin vers le delta, mais elles ne décidèrent pas de la campagne du Nord-Ouest. La Lorraine fut un avertissement coûteux : une armée avançant vers l'ouest ne peut pas laisser toutes les routes et tous les entrepôts du Viet Bac aux troupes locales."
 VIN_Northwest.1.d_failure:0 "La diversion française s'est retirée sans changer la bataille du Nord-Ouest. Les forces locales ont parcouru le long chemin du retour tandis que les principales divisions sont restées concentrées sur l'objectif de la campagne. L'ennemi a constaté qu'un raid sur l'arrière n'est pas la même chose que prendre l'initiative."
 VIN_Northwest.1.d_withheld:0 "L'élan français attendu vers le Viet Bac ne s'est jamais produit. La reconnaissance rapporte plutôt la concentration de groupes mobiles autour de Na San et des têtes aériennes de Tai. Nos dépôts sont sûrs, mais le terrain devant nous sera plus lourdement défendu."
 VIN_Northwest.1.d_superseded:0 "Le projet lorrain français a été dépassé par un armistice plus large ou la fin du théâtre. Ses colonnes se sont retirées et aucun des deux camps ne peut prétendre que la diversion inachevée a décidé de la bataille du Nord-Ouest."
 VIN_Northwest.1.a:0 "La leçon appartient à la prochaine campagne."

# === Operation Pollux ===
 FRE_Pollux.1.t:0 "L'évacuation de Lai Chau"
 FRE_Pollux.1.d:0 "La 316e division du Viet Minh se déplace vers le nord-ouest et Lai Chau ne peut plus être considérée comme une capitale isolée. Le nouveau camp de Dien Bien Phu offre une destination, pas une route sûre. L'Opération Léda peut faire voler les détachements réguliers, tandis que Pollux envoie les colonnes de partisans Tai sur la route Pavie à travers des montagnes déjà remplies de patrouilles ennemies. Une escorte plus forte pourrait maintenir le couloir ouvert. Un pont aérien beaucoup plus important pourrait l'éviter complètement. Les deux alternatives nécessiteront des ressources que le corps expéditionnaire destinait à la bataille à venir."
 FRE_Pollux.1.a:0 "Faites sortir les habitués ; envoyer les colonnes Tai par voie terrestre."
 FRE_Pollux.1.b:0 "Mettez la réserve mobile à cheval sur la route Pavie."
 FRE_Pollux.1.c:0 "Développez Leda et soulevez également la force partisane."
 FRE_Pollux.1.e:0 "Nous ne pouvons pas épargner l'avion ou les crédits."

 FRE_Pollux.2.t:0 "La force de Lai Chau atteint Dien Bien Phu"
 FRE_Pollux.2.d_escort:0 "Les groupes de couverture occupaient Lai Chau, la route Pavie et l'entrée nord du camp comme un seul couloir continu. Les dernières compagnies de partisans Tai sont entrées à Dien Bien Phu avec leurs cadres et une grande partie de leur équipement intacts. Les escortes peuvent désormais se désengager et les survivants sont réorganisés en un autre groupe au sein de la garnison de la vallée."
 FRE_Pollux.2.d_airlift:0 "Les équipages de transport ont transporté la force de Lai Chau jusqu'à Dien Bien Phu au cours d'une succession de vols surchargés. La bande reste ouverte suffisamment longtemps pour permettre le déplacement des cadres partisans, des familles, des armes et des magasins que le plan historique aurait laissé sur la route Pavie. Les avions sont usés et Paris comptera la dépense, mais un groupe supplémentaire se tient désormais à l'intérieur du camp."
 FRE_Pollux.2.a:0 "Ajoutez-les à l'ordre de bataille de la vallée."

 FRE_Pollux.3.t:0 "La colonne de Lai Chau est perdue"
 FRE_Pollux.3.d_historical:0 "L'opération Léda a transporté les détachements réguliers et une partie de leurs magasins jusqu'à Dien Bien Phu. Les colonnes de partisans Tai reçurent l'ordre de suivre à pied la route Pavie. Les unités du Viet Minh ont coupé la marche, dispersé ses guides et chassé les groupes séparés à travers les montagnes. À peine un reste atteint le camp. Les réguliers renforceront la garnison, mais la force des hautes terres qui était censée les suivre n'existe plus en tant que formation."
 FRE_Pollux.3.d_escort:0 "La réserve mobile n'a pas pu maintenir la route Pavie ouverte. La colonne d'évacuation se divisa en groupes isolés attaqués, tandis que les escortes s'efforçaient de rouvrir une route déjà contrôlée depuis les hauteurs. Certains survivants ont atteint Dien Bien Phu, mais ni la formation partisane ni la force de couverture ne peuvent être considérées comme intactes."
 FRE_Pollux.3.d_airlift:0 "Le pont aérien élargi a échoué avant de pouvoir dégager Lai Chau. Les pertes d'avions, une bande fermée et l'avancée des patrouilles du Viet Minh ont laissé une partie de la force au sol après l'abandon de son alternative terrestre. Les survivants arrivant à Dien Bien Phu sont trop peu nombreux et désorganisés pour former un autre groupe de garnison."
 FRE_Pollux.3.d_origin:0 "Lai Chau est tombé avant que l'ordre d'évacuation puisse être exécuté. La garnison et ses dépendants se sont dispersés dans les montagnes sans couloir organisé ni avions suffisants. Dien Bien Phu ne recevra aucun renfort formé de l'ancienne capitale Tai."
 FRE_Pollux.3.d_unfunded:0 "Le corps expéditionnaire ne pouvait fournir ni les transports pour une évacuation aérienne ni les crédits pour une marche protégée. Lai Chau a été abandonnée à des colonnes improvisées et la force s'est dissoute sous la poursuite avant de pouvoir atteindre Dien Bien Phu."
 FRE_Pollux.3.a:0 "Enregistrez les disparus et renforcez le camp avec ce qui reste."

 FRE_Pollux.4.t:0 "Pollux dépassé"
 FRE_Pollux.4.d:0 "L'évacuation de Lai Chau a été dépassée par l'ouverture de la bataille ou la fin du théâtre plus large. Son mouvement inachevé ne peut être considéré ni comme une force préservée ni comme une colonne détruite. Le commandement de Dien Bien Phu doit travailler avec les formations déjà sur ses listes."
 FRE_Pollux.4.a:0 "Fermez l'ordre de déplacement."

# === Operation Atlante ===
 FRE_Atlante.1.t:0 "L'engagement d'Atlante"
 FRE_Atlante.1.d:0 "L'état-major propose une longue campagne de pacification le long de la côte centrale : ouvrir une tête de pont, pénétrer dans la base du Viet Minh dans l'Interzone V et remettre la région sous une administration vietnamienne efficace. La carte promet une zone côtière cohérente. L'ordre de bataille révèle une vérité plus difficile. Les groupes mobiles, avions, ingénieurs et remplaçants affectés ici ne peuvent pas non plus constituer une réserve pour Dien Bien Phu.\n\nUne offensive franco-vietnamienne complète pourrait percer la base, mais elle bloquerait la réserve expéditionnaire dans le sud. Une opération menée par les Vietnamiens préserve les formations du nord tout en demandant à une armée nationale inexpérimentée de prendre pied. Annuler complètement Atlante enverrait une réserve constituée au Tonkin avant le début de la bataille de la vallée."
 FRE_Atlante.1.a:0 "Continuez Atlante avec la réserve expéditionnaire."
 FRE_Atlante.1.b:0 "Mettez l'Armée nationale vietnamienne en tête."
 FRE_Atlante.1.c:0 "Réduisez Atlante et envoyez la réserve vers le nord."
 FRE_Atlante.1.e:0 "Rayez l'opération du calendrier."

 FRE_Atlante.2.t:0 "Un pied dans l'Interzone V"
 FRE_Atlante.2.d_full:0 "Les forces de débarquement, les groupes mobiles et les bataillons vietnamiens ont tenu les deux objectifs opérationnels grâce à deux semaines de contre-attaques. L'Interzone V n'a pas été détruite et ses réseaux politiques restent au-delà des colonnes, mais la base côtière est percée et l'État du Vietnam peut revendiquer des terrains qu'il ne détenait pas avant le début d'Atlante. Le prix est visible dans chaque formation absente du Tonkin."
 FRE_Atlante.2.d_vietnamese:0 "L'Armée nationale vietnamienne a tenu le camp côtier pendant deux semaines d'attaques sans qu'un groupe mobile du CEFEO ne mène l'opération. Le résultat est plus restreint que le plan initial de l'état-major, mais il donne à Saigon une revendication défendable sur la côte et préserve la réserve expéditionnaire pour le nord."
 FRE_Atlante.2.a:0 "Consolider le logement et clôturer l'opération."

 FRE_Atlante.3.t:0 "Stands de l'Atlante"
 FRE_Atlante.3.d_full:0 "Quatre-vingt-dix jours de débarquements, de colonnes routières et d'opérations de dégagement n'ont pas produit de brèche durable dans l'Interzone V. Les unités du Viet Minh ont cédé du terrain, sont revenues à travers les collines et ont forcé les groupes mobiles à se battre à plusieurs reprises pour les mêmes approches. La réserve expéditionnaire a été engloutie par une campagne centrale sans éliminer la menace ni renforcer le nord."
 FRE_Atlante.3.d_vietnamese:0 "L'Armée nationale vietnamienne n'a pas pu maintenir son campement côtier pendant deux semaines ininterrompues. Les bataillons levés plus rapidement que leurs états-majors ne pouvaient être entraînés ont perdu le contact dans les collines, tandis que les forces locales du Viet Minh se sont repliées derrière chaque avance. La réserve expéditionnaire reste disponible au Tonkin, mais Saigon doit répondre de l'entreprise ratée."
 FRE_Atlante.3.d_unfunded:0 "Les tableaux d'état-major d'Atlante ont été classés sans troupes, avions ou crédits derrière eux. L'Interzone V reste intacte et aucune réserve compensatoire n'a été constituée pour le Tonkin. Ce qui a été annoncé comme la prochaine phase du Plan Navarre se termine comme une autre opération que le commandement ne pouvait pas se permettre de commencer."
 FRE_Atlante.3.a:0 "Fermez le grand livre central."

 FRE_Atlante.4.t:0 "La réserve tourne vers le nord"
 FRE_Atlante.4.d:0 "Les horaires d'atterrissage d'Atlante ont été annulés. Les groupes mobiles, le génie, l'artillerie et les allocations de transport se dirigent plutôt vers le Tonkin. L'Interzone V restera une base du Viet Minh, et Saigon considérera cette décision comme un nouveau report de la souveraineté effective. Cependant, si l'ennemi se rapproche de Dien Bien Phu, le camp recevra une réserve constituée plutôt que la promesse que chaque bataillon disponible est déjà engagé ailleurs."
 FRE_Atlante.4.a:0 "Dien Bien Phu aura sa réserve."

 FRE_Atlante.5.t:0 "Atlante dépassée"
 FRE_Atlante.5.d:0 "Un règlement plus large ou l'effondrement du théâtre a dépassé l'opération centrale avant que son objectif puisse être consolidé. Les forces de débarquement et les groupes mobiles se retirent sous les ordres qui régissent toute l'Indochine. Atlante ne connaîtra ni succès sur le champ de bataille ni défaite séparée."
 FRE_Atlante.5.a:0 "Fermez le grand livre opérationnel."

 FRE_Dien_Bien.1.d_atlante:0 "Le Viet Minh a engagé l'essentiel de ses forces dans la vallée tandis que la réserve expéditionnaire reste engagée dans l'opération Atlante. Le camp doit dépendre de son pont aérien prévu et de la garnison déjà en place, sinon Paris peut demander à Washington d'élargir la guerre par le biais de l'opération Vautour. Les groupes mobiles et les transports engagés dans le centre du Vietnam ne peuvent désormais pas fournir un maximum de renforts ni monter l'Opération Condor.\n\nQuel que soit le choix, le camp n'est pas déclaré sauvé d'avance. Il doit rester hors des mains du Viet Minh jusqu'à la fin de sa campagne."
 FRE_Dien_Bien.1.d_northern:0 "Le Viet Minh a engagé sa force principale dans la vallée, mais la réserve retenue lors de l'Opération Atlante se déplace déjà vers le système nord. Ses équipements ont pénétré dans les dépôts du camp et ont acheté dix jours de siège actif supplémentaires avant la dégradation du fort, sans modifier les délais de campagne fixés. Le commandement peut désormais utiliser cette marge avec la défense programmée, renforcer à l'échelle maximale, préparer l'opération Condor ou demander à Washington l'opération Vulture.\n\nQuel que soit le choix, le camp n'est pas déclaré sauvé d'avance. Il doit rester hors des mains du Viet Minh jusqu'à la fin de sa campagne."
 FRE_Aid.1.t:0 "Une armée nationale pour l'État du Vietnam"
 FRE_Aid.1.d:0 "Le Corps a remis une grande quantité de fusils à l'Armée nationale de l'État du Vietnam. Les officiers d'état-major considèrent cette décision comme nécessaire si les troupes françaises doivent un jour être relevées, mais ils craignent que les armes ne soient perdues ou capturées.\n\nLe commandant en chef peut ordonner que les unités vietnamiennes soient jumelées à des cadres français, ou les laisser trouver leur propre voie en signe de confiance."
 FRE_Aid.1.a:0 "Associer les unités vietnamiennes aux cadres français"
 FRE_Aid.1.b:0 "Faire preuve de confiance dans les commandants vietnamiens"
 FRE_Aid.2.t:0 "Les armées des États associés"
 FRE_Aid.2.d:0 "Le Corps a engagé des fonds et du matériel pour les armées nationales du Laos et du Cambodge. Les officiers d'état-major fourniront des instructeurs et des conseils, et cet effort alourdit le fardeau d'une force déjà déployée à travers la péninsule.\n\nLes officiers supérieurs peuvent affecter des cadres expérimentés aux nouvelles armées, ou garder leurs meilleurs hommes dans les unités françaises et ne donner aux nouvelles armées que ce qui peut être épargné."
 FRE_Aid.2.a:0 "Affecter des cadres expérimentés aux nouvelles armées"
 FRE_Aid.2.b:0 "Gardez les meilleurs hommes avec les unités françaises"
 FRE_Aid.3.t:0 "L'argent américain arrive"
 FRE_Aid.3.d:0 "Le financement américain de l'effort de guerre commence à arriver à Saigon. Les commandants accueillent favorablement ces fonds, mais notent que les conseillers américains s'attendent à voir comment l'argent est dépensé et à être entendus dans la planification des opérations.\n\nL'état-major peut offrir aux observateurs américains l'accès aux bureaux de planification, ou s'en tenir au principe selon lequel la conduite de la guerre est une affaire française."
 FRE_Aid.3.a:0 "Offrir un accès aux observateurs américains"
 FRE_Aid.3.b:0 "Insister sur le fait que la guerre est une affaire française"
 FRE_Intel.1.t:0 "Le Viet Minh avance sur la route frontalière"
 FRE_Intel.1.d:0 "Les rapports des postes frontières le long de la Route Coloniale 4 décrivent des régiments Viet Minh massés dans les collines au-dessus de Cao Bang et Lang Son. Les porteurs, les mulets et les trains à vélo circulent la nuit et les garnisons isolées ne répondent plus à certains appels radio.\n\nLe commandement du CEFEO sait que les postes frontières sont exposés et difficiles à soulager. Chaque colonne envoyée sur la route risque d'être coupée dans les gorges calcaires."
 FRE_Intel.1.a:0 "Renforcez les garnisons frontalières et percez les colonnes routières."
 FRE_Intel.1.b:0 "Retirez les postes éloignés et épargnez les hommes."
 FRE_Intel.2.t:0 "La bataille de la frontière se termine"
 FRE_Intel.2.d_win:0 "Les Viet Minh ont détruit les postes frontières le long de la route frontalière. Garnisons envahies, colonnes dispersées dans les gorges et magasins perdus, la frontière nord est effectivement ouverte au ravitaillement chinois.\n\nLe commandement doit désormais planifier autour d'une armée Viet Minh dotée d'un arrière sécurisé et d'un flux d'armes constant."
 FRE_Intel.2.d_fail:0 "L'assaut du Viet Minh sur la route frontalière est au point mort. Les colonnes tiennent bon ou se retirent en ordre, et les postes frontières restent pour l'instant aux mains des Français.\n\nLe commandement a gagné du temps, mais la route reste dangereuse et les formations Viet Minh restent dans les collines."
 FRE_Intel.2.a:0 "Rédigez les leçons des combats frontaliers pour le personnel."
 FRE_Intel.2.b:0 "Rassurez Paris sur le fait que la frontière peut encore être tenue."
 FRE_Intel.3.t:0 "Le Viet Minh retourne au nord-ouest"
 FRE_Intel.3.d:0 "Les agents du renseignement rapportent que des régiments du Viet Minh se sont rassemblés pour rouvrir le couloir menant aux hauts plateaux de Tai. Les scouts découvrent de nouvelles pistes tracées à travers la forêt et des guides locaux sont recrutés dans les villages situés le long de la Rivière Noire.\n\nLes postes des hautes terres vivent du ravitaillement aérien et des milices locales loyales. Une nouvelle poussée là-bas mettrait les deux à l'épreuve."
 FRE_Intel.3.a:0 "Avertir les postes des hautes terres et resserrer le calendrier d'approvisionnement en air."
 FRE_Intel.3.b:0 "Appel aux dirigeants locaux pour qu'ils maintiennent leurs milices sur le terrain."
 FRE_Intel.4.t:0 "Le corridor nord-ouest est à nouveau contesté"
 FRE_Intel.4.d_win:0 "Le Viet Minh a rouvert un couloir à travers le nord-ouest à grands frais. Les observateurs français notent de longues listes de victimes et des porteurs épuisés, mais les routes des hautes terres sont à nouveau aux mains du Viet Minh.\n\nLes garnisons des hautes terres doivent désormais supposer que les formations ennemies peuvent les atteindre à volonté."
 FRE_Intel.4.d_fail:0 "La tentative du Viet Minh de rouvrir le couloir nord-ouest a échoué ou a été annulée. Les pertes ont été lourdes et les postes des hautes terres ont tenu bon malgré l'effort.\n\nLe commandement s'attend à ce que la tentative soit répétée une fois les approvisionnements reconstitués."
 FRE_Intel.4.a:0 "Redéployer les réserves vers les postes menacés des hautes terres."
 FRE_Intel.4.b:0 "Appuyez sur le bâton pour revoir le plan d'alimentation en air."
 FRE_Intel.5.t:0 "La bataille de Vinh Yen est terminée"
 FRE_Intel.5.d_win:0 "L'attaque à l'échelle de la division Viet Minh sur les approches du delta autour de Vinh Yen a été décidée en leur faveur. L'appui-feu et les réserves français n'ont pas pu arrêter l'assaut à temps, et l'armée doit désormais défendre le delta avec un ennemi plus puissant à sa porte.\n\nLes officiers tirent de dures leçons sur la masse et la discipline de l'ennemi."
 FRE_Intel.5.d_fail:0 "L'assaut du Viet Minh près de Vinh Yen a été stoppé. L'artillerie, les avions et les réserves rapides ont brisé les vagues d'attaque et les approches du delta restent sécurisées.\n\nLe commandement se réjouit du résultat, même si l'ennemi est censé en tirer des leçons."
 FRE_Intel.5.a:0 "Étudiez la tactique du Viet Minh et révisez la défense du delta."
 FRE_Intel.5.b:0 "Faites connaître la défense pour remonter le moral à la maison."
 FRE_Intel.6.t:0 "Les combats de Mao Khe sont terminés"
 FRE_Intel.6.d_win:0 "Les forces du Viet Minh ont traversé le pays charbonnier autour de Mao Khe et la défense française a été repoussée. Les approches d'Haïphong inquiètent désormais le haut commandement.\n\nLes commandants évaluent le nombre d'hommes que la route côtière peut encore contenir en toute sécurité."
 FRE_Intel.6.d_fail:0 "L'attaque du Viet Minh dans le pays charbonnier de Mao Khe a été repoussée. Les garnisons françaises ont tenu leurs postes et le soutien naval et aérien a contribué à maintenir la route côtière ouverte.\n\nLes approches d'Haïphong sont pour l'instant sûres."
 FRE_Intel.6.a:0 "Renforcez le secteur côtier et faites tourner les unités fatiguées."
 FRE_Intel.6.b:0 "Rapportez le résultat à Saigon et demandez plus de réserves."
 FRE_Intel.7.t:0 "Le jour où les combats sur la rivière sont terminés"
 FRE_Intel.7.d_win:0 "La traversée du fleuve Day par le Viet Minh a réussi et les positions françaises le long de la ligne sont abandonnées ou contenues. Le delta sud est désormais exposé à de nouvelles pressions.\n\nLe staff est déjà en train de réviser la ligne défensive."
 FRE_Intel.7.d_fail:0 "L'attaque du Viet Minh sur la ligne de la rivière Day a échoué. Les groupes mobiles français et les patrouilles fluviales ont émoussé le passage et la ligne a tenu, bien qu'à un certain prix pour les hommes.\n\nL'état-major reconnaît que l'ennemi va réessayer."
 FRE_Intel.7.a:0 "Réorganiser le tracé du fleuve et faire apparaître des groupes mobiles."
 FRE_Intel.7.b:0 "Dites à Paris que la défense Delta est solide."
 FRE_Intel.8.t:0 "Les combats de Na San sont terminés"
 FRE_Intel.8.d_win:0 "Le Viet Minh a envahi les défenses de Na San ou les a repoussées, un coup dur pour l'idée du hérisson alimenté par l'air. Les agents du nord-ouest se demandent si la méthode peut survivre à un deuxième test.\n\nLa leçon pèsera sur la planification des garnisons isolées."
 FRE_Intel.8.d_fail:0 "L'assaut du Viet Minh sur Na San a échoué. Le hérisson ravitaillé par l'air a tenu bon et les pertes ennemies ont été lourdes en terrain découvert autour de la piste d'atterrissage.\n\nDe nombreux officiers voient le résultat comme la preuve que la méthode des forteresses des hautes terres peut fonctionner."
 FRE_Intel.8.a:0 "Examinez comment la garnison a été approvisionnée et relevée."
 FRE_Intel.8.b:0 "Félicitez la garnison et remontez le moral dans le nord-ouest."
 FRE_Intel.9.t:0 "Les combats de Nghia Lo sont terminés"
 FRE_Intel.9.d_win:0 "Les forces du Viet Minh ont pris Nghia Lo et dégagé les vallées voisines. La voie vers les hauts plateaux de Tai est ouverte et les postes français plus au nord ressentent la pression.\n\nLe commandement doit maintenant réfléchir au nombre de garnisons qui peuvent être laissées en place."
 FRE_Intel.9.d_fail:0 "L'attaque du Viet Minh contre Nghia Lo a été stoppée ou annulée. Les postes autour de la vallée ont tenu, et l'approche des hauts plateaux de Tai reste fermée pour l'instant.\n\nLes officiers d'état-major constatent que l'ennemi reste à proximité."
 FRE_Intel.9.a:0 "Renforcez les poteaux qui gardent les abords de la vallée."
 FRE_Intel.9.b:0 "Demandez aux fidèles dirigeants Tai de vous aider en matière de renseignement."
 FRE_Intel.10.t:0 "Les combats de Lai Chau sont terminés"
 FRE_Intel.10.d_win:0 "Les Viet Minh ont atteint Lai Chau et la région de la capitale Tai est entre leurs mains ou sous leurs canons. La position française à l'extrême nord-ouest est gravement compromise.\n\nLa question de l'évacuation des garnisons restantes des hautes terres n'est plus abstraite."
 FRE_Intel.10.d_fail:0 "La poussée du Viet Minh vers Lai Chau a échoué ou a été annulée. La garnison et ses alliés Tai restent en place pour le moment, même si l'approvisionnement reste difficile.\n\nL'extrême nord-ouest reste une préoccupation pour le commandement."
 FRE_Intel.10.a:0 "Planifiez les itinéraires d'évacuation et emballez les clés."
 FRE_Intel.10.b:0 "Rassurez les alliés Tai sur le fait que la France les soutiendra."
 FRE_Intel.11.t:0 "Fin du détournement du Bas Laos"
 FRE_Intel.11.d_win:0 "Les colonnes du Viet Minh et du Pathet Lao ont attiré une attention considérable des Français vers le sud, à travers le plateau du Bas Laos. Les garnisons du sud ont été mises à rude épreuve et le commandement manque de réserves pour les couloirs annamites.\n\nLa diversion a fait son oeuvre."
 FRE_Intel.11.d_fail:0 "La diversion du Viet Minh dans le Bas-Laos a été contenue. Les forces françaises et laotiennes ont maintenu les routes du plateau ouvertes et les garnisons du sud ont tenu.\n\nLe commandement peut à nouveau se tourner vers d'autres fronts."
 FRE_Intel.11.a:0 "Remaniez les garnisons du sud et reposez ceux qui sont fatigués."
 FRE_Intel.11.b:0 "Crédit aux partenaires laotiens dans le rapport à Paris."

 FRE_Econ.1.t:0 "L'enquête d'Armorin"
 FRE_Econ.1.d:0 "L'enquête menée par François-Jean Armorin pour Franc-Tireur a mis en lumière les bénéfices tirés du transfert des piastres indochinoises vers la France. Le régime de change officiel permet aux trafiquants d'obtenir des francs à des conditions bien plus avantageuses que celles disponibles sur le marché non officiel. Les transferts présentés comme paiement pour le commerce peuvent dissimuler des transactions ayant peu de lien avec les marchandises réellement expédiées.\n\nCes transactions pèsent lourdement sur le Trésor français et sapent la confiance dans la gestion de la monnaie par l'administration. Alors que le commerce civil commence à se rétablir, les autorités du CEFEO doivent s'attaquer au système d'échange dont dépendent à la fois les commerçants et les payeurs militaires."
 FRE_Econ.1.a:0 "Mettez les comptes de change avant le Trésor."
 FRE_Econ.2.t:0 "La crise inflationniste des Piastres"
 FRE_Econ.2.d:0 "La hausse des prix réduit le pouvoir d'achat des salaires et des soldes militaires en Indochine. La reprise du commerce urbain n'a pas supprimé les pénuries laissées par la guerre, tandis que les transferts de devises rentables vers la France encouragent la spéculation plutôt que l'investissement dans la production locale. Les enquêtes d'Armorin ont rendu plus difficile pour l'administration de traiter ces problèmes comme des abus isolés.\n\nLe Trésor est désormais confronté à un choix de politique monétaire. Le remplacement de la piastre offre un moyen de freiner l'inflation, mais nécessite le soutien des métropoles pour la nouvelle émission. Le conserver évite cette dépendance supplémentaire et l'interruption de la conversion, tout en laissant les prix sous une plus grande pression."
 FRE_Econ.2.a:0 "Une politique monétaire ne peut plus attendre."
 FRE_Econ.3.t:0 "Le Bac Vien-Dong"
 FRE_Econ.3.d:0 "L'administration a introduit le Bac Vien-Dong pour remplacer la piastre indochinoise. La nouvelle monnaie est destinée à apporter une plus grande stabilité aux transactions locales après l'inflation et les transferts spéculatifs associés aux anciens régimes de change. Les commerçants et les services publics doivent désormais convertir leurs comptes à la nouvelle émission.\n\nLa réforme atténue la pression sur les prix, mais son soutien financier vient de la métropole. Le commerce local devient par conséquent plus dépendant du soutien français, même si la crise monétaire immédiate s'atténue. Un moyen de paiement stable aidera les entreprises à se redresser ; cela ne leur donne pas encore une base financière indépendante."
 FRE_Econ.3.a:0 "Procédez à la conversion de devises."
 FRE_Econ.4.t:0 "Garder la Piastre"
 FRE_Econ.4.d:0 "L'administration a décidé de conserver la piastre indochinoise. Les commerçants peuvent continuer à régler leurs contrats dans la monnaie existante et les services publics évitent de convertir leurs comptes vers une nouvelle émission. La décision évite également le recours supplémentaire au soutien métropolitain qu'aurait nécessité le projet Vien-Dong Bac.\n\nCela laisse la crise inflationniste sans solution. Les salaires et les soldes militaires restent exposés à la hausse des prix, tandis que les accords de change qui encourageaient la spéculation continuent de peser sur le commerce ordinaire. La préservation de la monnaie familière assure la continuité des activités locales, mais le Trésor doit désormais faire face à une pression croissante sur le pouvoir d'achat."
 FRE_Econ.4.a:0 "Conserver la piastre malgré l'inflation."
 FRE_Econ.5.t:0 "Industrie pour l'Extrême-Orient"
 FRE_Econ.5.d:0 "L'administration a adopté les propositions du rapport Bourgoin pour restaurer l'industrie civile. L'industrie manufacturière locale doit prendre une place plus importante dans une économie dont les fonds et les transports ont été lourdement engagés dans la guerre. Le programme soutient une monnaie plus fiable et donne aux entreprises civiles une base de développement au-delà des commandes militaires immédiates.\n\nCes jeunes industries ont encore besoin de machines importées et de financements métropolitains. Leur implantation accroît donc la dépendance à l'égard de la France avant que la production locale puisse commencer à la réduire. L'administration a accepté ces coûts initiaux afin de construire une économie civile capable de subvenir davantage à ses propres besoins."
 FRE_Econ.5.a:0 "Passer la commande des travaux civils."
 FRE_Econ.6.t:0 "Les commandes à l'exportation sont prioritaires"
 FRE_Econ.6.d:0 "Les exportations de ressources et la production militaire ont désormais la priorité sur l'expansion industrielle civile. L'administration oriente les matériels vers la France et les fournitures du CEFEO, garantissant ainsi des recettes d'exportation et des conditions plus favorables pour les achats militaires. Cette politique atténue une partie de la dépendance du territoire vis-à-vis des approvisionnements extérieurs.\n\nLes allocations laissent peu de place à la construction de nouvelles usines. Les fabricants civils doivent rivaliser avec leurs engagements d'exportation de matériaux, et l'inflation s'aggrave à mesure que les investissements dans la production locale restent en deçà des exigences de l'économie de guerre. La poursuite de l'expansion industrielle nécessitera des approvisionnements dépassant ceux réservés dans le cadre des arrangements actuels."
 FRE_Econ.6.a:0 "Chargez d'abord l'allocation française."
 FRE_Econ.7.t:0 "Réouverture des usines de Tong"
 FRE_Econ.7.d:0 "Le projet de construction d'avions de Tong a repris avec le financement d'équipements et de locaux industriels dans la région de Hanoï. Deux installations de production militaire sont désormais disponibles, élargissant la base de fabrication locale du CEFEO et offrant un espace pour des travaux auparavant dépendants des livraisons de l'étranger.\n\nLa réouverture des usines ne crée pas immédiatement une industrie aéronautique complète. La production nécessite encore des conceptions et des machines adaptées, et la nouvelle capacité doit être affectée à des équipements qui peuvent réellement être fabriqués localement. L'investissement donne au commandement les installations nécessaires pour développer cette capacité."
 FRE_Econ.7.a:0 "Commencer la production à Tong."
 FRE_Econ.8.t:0 "Rails entre Vientiane et Tonkin"
 FRE_Econ.8.d:0 "La liaison ferroviaire Vientiane-Tonkin est entrée en service, avec la fourniture de locomotives françaises pour démarrer l'exploitation. La ligne offre au CEFEO une autre voie terrestre pour acheminer les fournitures et offre au commerce civil une alternative aux longs trajets routiers entre le Laos et les territoires du nord.\n\nLa construction a nécessité des crédits importants, mais la connexion fonctionnelle contribue à rétablir les transports perturbés par la guerre. Son utilité dépend désormais de services et d'entretien réguliers, les envois militaires et le fret commercial partageant la route. Le Laos obtient un accès vers les ports du nord tandis que le commandement dispose d'un autre moyen d'approvisionner ses dépôts."
 FRE_Econ.8.a:0 "Mettez la nouvelle connexion en service."
 FRE_Econ.9.t:0 "La connexion Vientiane-Tonkin"
 FRE_Econ.9.d:0 "Les autorités françaises en Indochine signalent que la liaison ferroviaire Vientiane-Tonkin est en service. Les locomotives françaises démarrent leur exploitation sur un itinéraire destiné à transporter à la fois du matériel militaire et du fret civil, reliant plus étroitement le Laos au réseau de transport desservant les ports du nord.\n\nPour Paris, l'achèvement fournit une connexion fonctionnelle en échange d'un programme de construction coûteux. Il offre au corps expéditionnaire une alternative au transport routier et peut contribuer à la reprise du commerce local. L'ampleur des économies dépendra du trafic et des coûts d'exploitation ; L'achèvement seul ne permet pas de déterminer quelle part du fardeau du transport le chemin de fer peut supporter."
 FRE_Econ.9.a:0 "Accusez réception de l'achèvement et demandez le retour du trafic."
 FRE_Econ.10.t:0 "Un débouché ferroviaire pour le Laos"
 FRE_Econ.10.d:0 "La nouvelle liaison ferroviaire entre Vientiane et Tonkin a ouvert un débouché aux marchandises laotiennes vers les ports du nord. Les marchands obtiennent un itinéraire au-delà des longs trajets routiers dont dépendait une grande partie du commerce terrestre, tandis que le gouvernement peut souligner une amélioration complète des transports face aux exigences de la guerre.\n\nLe trafic de ravitaillement militaire utilisera également la ligne, et le commerce civil devra partager les services disponibles. Néanmoins, cette connexion renforce la confiance dans la capacité du gouvernement à tirer des avantages pratiques de la coopération avec la France. Des services de fret réguliers peuvent désormais offrir aux producteurs laotiens un meilleur accès aux marchés."
 FRE_Econ.10.a:0 "Ouvrez la ligne au commerce laotien."
