l_french: 
 nsb_suspension0:0 "Suspensions Seconde Guerre Mondiale"
 nsb_suspension0_desc:0 "Une suspension à barre de torsion est une suspension dans laquelle le rôle de ressort est joué par une tige dont une extrémité est fixée dans la coque, et l'autre dans le bras de suspension, dont le mouvement vertical fait tourner la tige autour de son axe, et la force élastique la ramène à sa position précédente. L'une des qualités les plus importantes d'une suspension à barre de torsion, qui la distingue avantageusement des suspensions à ressorts, est une plus grande résistance aux charges lourdes, une conduite douce et une durabilité élevée. Cependant, une barre de torsion est plus chère et plus difficile à fabriquer que tout autre ressort métallique, car elle nécessite des qualités d'acier plus solides et une technologie de fabrication spéciale, notamment le durcissement et le collage. Malgré cela, la suspension à barre de torsion est devenue la norme incontestée dans la construction de chars après la Seconde Guerre mondiale."
 nsb_suspension1:0 "Suspension modernisée"
 nsb_suspension1_desc:0 "À l'approche de la fin de la Seconde Guerre mondiale, une expérience pratique considérable dans le fonctionnement de la suspension des véhicules blindés, ainsi que des idées pour éliminer les défauts de conception, s'étaient accumulées. L'un des problèmes les plus importants, commun à tous les types de suspension, résidait dans les vibrations longitudinales qui se produisaient pendant le mouvement, gênaient le tir en mouvement et réduisaient considérablement la durée de vie de la suspension. Lors de la modernisation des types de suspension les plus performants, des amortisseurs hydrauliques ont été ajoutés, ce qui a largement éliminé ces problèmes."
 nsb_suspension2:0 "Suspension hydropneumatique"
 nsb_suspension2_desc:0 "Une version améliorée de la suspension hydropneumatique, équipée d'un système de régulation du volume du fluide de travail, qui permet de modifier la garde au sol et permet au véhicule de combat de se cacher et d'apparaître derrière le couvercle, ainsi que de s'incliner vers l'avant et vers l'arrière, élargissant considérablement les angles de visée verticale et horizontale du canon."
 nsb_suspension3:0 "Suspension active"
 nsb_suspension3_desc:0 "Suspension active - le dernier mot dans les systèmes de suspension des véhicules de combat, est un développement de suspension hydropneumatique complété par un système numérique de capteurs qui surveillent la vitesse et les vibrations de la carrosserie du véhicule de combat, ou déterminent le profil de la trajectoire devant le véhicule de combat et modifient dynamiquement la rigidité de chaque élément de suspension de manière à amortir le plus efficacement possible les vibrations, ce qui permet de maintenir une vitesse élevée même sur un terrain très difficile, de réduire considérablement la consommation de carburant (grâce à la réduction des pertes d'énergie lors de la course sur des surfaces inégales) et d'augmenter la précision de tir sur le mouvement, complétant efficacement le travail du stabilisateur du canon."
 nsb_suspension_multi_track:0 "Suspension expérimentale à quatre voies"
 nsb_suspension_multi_track_desc:0 "Quatre ensembles de chenilles à entraînement indépendant répartissent le poids d'un véhicule lourd sur une plus grande zone de contact et préservent la mobilité après avoir endommagé une chenille. Le train de roulement supplémentaire est complexe, coûteux et difficile à entretenir, mais offre des performances tout-terrain exceptionnelles pour les véhicules lourds expérimentaux."

 nsb_special_capabilities0:0 "Premier équipement de génie de combat"
 nsb_special_capabilities0_desc:0 "Des points de montage et des commandes spécialement conçus permettent aux véhicules blindés de transporter des lames de bulldozer et des réservoirs de carburant externes sans modifications improvisées sur le terrain."
 nsb_special_capabilities1:0 "Protection des véhicules adaptée au terrain"
 nsb_special_capabilities1_desc:0 "Les équipes peuvent sécuriser le bois et d'autres matériaux facilement disponibles sur leurs véhicules pour améliorer la résilience et maintenir les machines endommagées en fonctionnement."
 nsb_special_capabilities2:0 "Premiers systèmes de charrue minière"
 nsb_special_capabilities2_desc:0 "Des charrues renforcées montées devant les voies peuvent exposer ou repousser les mines enfouies, permettant ainsi aux formations blindées de percer les champs de mines préparés."
 nsb_special_capabilities3:0 "Systèmes de rouleaux mécaniques pour mines"
 nsb_special_capabilities3_desc:0 "De lourds ensembles de rouleaux font exploser des mines à pression devant le véhicule, ouvrant ainsi la voie tout en gardant l'équipage et le train de roulement derrière le point d'impact."
 nsb_special_capabilities4:0 "Systèmes intégrés de génie de combat"
 nsb_special_capabilities4_desc:0 "L'intégration améliorée des véhicules prend en charge les charrues de mine avancées, les équipements de creusement de tranchées et le stockage protégé des munitions sans recourir à des équipements improvisés."
 nsb_special_capabilities5:0 "Mesures de lutte contre les mines électromagnétiques"
 nsb_special_capabilities5_desc:0 "Les rouleaux de mines équipés de bobines électromagnétiques peuvent déclencher des fusées magnétiques devant le véhicule tout en conservant la capacité de déminage mécanique des systèmes antérieurs."
 nsb_special_capabilities6:0 "Stations d'armes à distance"
 nsb_special_capabilities6_desc:0 "Les supports d'armes stabilisés et télécommandés permettent à l'équipage d'observer et d'affronter les menaces à proximité sans exposer un opérateur à l'extérieur du blindage."

 nsb_ammo:0 "Conception de l'artillerie"
 nsb_ammo_desc:0 "Les projectiles perforants (AP) classiques sont de conception très différente - coiffés (APC), avec capuchon balistique (APBC), une combinaison de deux (APCBC), remplis d'explosifs (APHE) ou tous à la fois (APHEBC, APHECBC) - une grande variété d'entre eux, mais tout de même en un: le projectile lui-même est entièrement pénétrant et coïncide en diamètre avec le calibre du canon. Beaucoup, sinon tous, de ces obus copient la conception et utilisent l'expérience des obus de canon naval, pour lesquels la tâche de pénétrer le blindage est sur la table depuis des décennies."
 nsb_ap_ammo0:0 "Munitions APCR"
 nsb_ap_ammo0_desc:0 "Au milieu de la Seconde Guerre mondiale, l'épaisseur du blindage avait tendance à croître plus rapidement que le calibre du canon, ce qui nécessitait une augmentation de la pénétration du blindage tout en restant dans les mêmes dimensions globales. Pour résoudre ce problème, un projectile composite rigide perforant de sous-calibre (APCR, parfois également appelé projectile perforant à grande vitesse ou HVAP) a été développé. Le principe de son fonctionnement est simple : un pénétrateur d'un diamètre inférieur au calibre du canon, réalisé dans un matériau dense, tel que du carbure de tungstène, était placé à l'intérieur d'un sabot réalisé dans un matériau plus tendre et compensant la différence de taille du pénétrateur et du canon ; après le tir, un tel projectile s'est comporté comme un tout et lorsqu'il a touché la cible, le sabot s'est déformé contre le blindage, permettant au pénétrateur, qui a une énergie cinétique élevée et agit sur une zone plus petite, de pénétrer facilement dans le blindage."
 nsb_ap_ammo1:0 "Munitions APDS"
 nsb_ap_ammo1_desc:0 "Bien que le projectile APCR ait une bonne pénétration du blindage, il présentait plusieurs défauts de conception importants, tels qu'un risque élevé de ricochet et une chute rapide de la vitesse avec l'augmentation de la portée. Dans la continuité de cette idée et pour résoudre ces problèmes, un projectile sous-calibré anti-blindage à sabot anti-blindage (APDS) a été développé. Contrairement à son prédécesseur, une fois tiré, comme son nom l'indique, le sabot se détache, laissant un pénétrateur à grande vitesse et moins ricochant."
 nsb_ap_ammo2:0 "Munitions APFSDS"
 nsb_ap_ammo2_desc:0 "La protection croissante des chars a rendu nécessaire une augmentation de la pénétration du blindage, ce qui ne peut être obtenu qu'en augmentant la charge de poudre et en allongeant le pénétrateur. Cependant, étendre le pénétrateur de plus de 6 à 8 calibres en longueur le déstabilise considérablement en vol, ce qui nécessite l'ajout d'un empennage. Cela a permis d'augmenter le rapport diamètre/longueur jusqu'à 10:1, d'augmenter la vitesse de vol et, ainsi, d'augmenter la pénétration du blindage, tout en conduisant également à l'apparition d'un nouveau type de projectile - le sabot de rejet stabilisé par aileron perforant (APFSDS)."
 nsb_ap_ammo3:0 "Munitions à projectile allongé APFSDS"
 nsb_ap_ammo3_desc:0 "Au milieu de la guerre froide, l'émergence et la prolifération de cibles blindées à blindage combiné nécessitaient une augmentation de la pénétration du blindage des projectiles APFSDS, et le seul moyen d'y parvenir sans augmentation significative du calibre est d'augmenter la longueur du pénétrateur. Même si « augmenter la longueur du pénétrateur » semble être quelque chose de simple et facile à faire, ce n'est vraiment pas le cas : cela nécessite une conception améliorée du sabot afin qu'il ne déstabilise pas le projectile lors du lancement, de nouveaux matériaux qui ne s'effondreront pas à cause des forces latérales accrues en vol et un bon équilibre du pénétrateur lui-même."
 nsb_ap_ammo4:0 "Munitions APFSDS avancées"
 nsb_ap_ammo4_desc:0 "La nouvelle génération de projectiles APFSDS, apparue à la fin de la guerre froide, se distinguait, outre un allongement encore plus grand du pénétrateur, où le rapport diamètre/longueur commençait à atteindre 20:1, le remplacement du noyau en carbure de tungstène par un noyau, devenu plus tard monobloc, en alliage de tungstène, d'acier et de nickel, qui a une plus grande ductilité et est moins sujet à la rupture lors du passage à travers une armure combinée hétérogène et multicouche."
 nsb_ap_ammo5:0 "Premières munitions APFSDS modernes"
 nsb_ap_ammo5_desc:0 "Le premier projectile moderne APFSDS est devenu encore plus long et plus fin, ce qui a permis une augmentation radicale du rapport diamètre/longueur et a atteint 30:1, mais a nécessité plusieurs innovations, telles que la réduction de l'envergure de l'aileron pour réduire la traînée, l'utilisation de nouveaux matériaux composites dans le sabot pour réduire la masse parasite et l'utilisation d'un nouveau type de propulseur capable de donner une vitesse suffisante à un pénétrateur lourd. De plus, en raison de la longueur accrue du pénétrateur, il était nécessaire d'approfondir son extrémité arrière dans la charge afin de conserver des dimensions adéquates."
 nsb_ap_ammo6:0 "Munitions APFSDS modernes"
 nsb_ap_ammo6_desc:0 "Le projectile moderne APFSDS a été créé en réponse à l'émergence d'une protection améliorée sous la forme de nouvelles générations d'ERA et de NERA, qui nécessitaient une nouvelle augmentation du rapport diamètre/longueur, qui peut désormais atteindre 35:1 ou plus, mais ont conduit au fait que l'extrémité arrière du pénétrateur repose sur le fond de la charge ; En plus de cela, un nouveau propulseur à haute énergie a été utilisé pour accélérer encore plus le projectile et compenser quelque peu la quantité de charge retirée pour s'adapter au pénétrateur étendu, et une pointe en acier a également été ajoutée pour surmonter plus efficacement l'ERA."
 nsb_ap_ammo7:0 "Munitions modernes APFSDS à l'uranium appauvri"
 nsb_ap_ammo7_desc:0 "Le projectile moderne avancé APFSDS n'a pratiquement pas changé de dimensions par rapport aux modèles précédents, ce qui est associé à l'atteinte de la limite en matière d'augmentation du rapport diamètre/longueur et aux restrictions imposées par le volume interne du véhicule de combat, mais cela n'a pas empêché le projectile d'être encore meilleur : le plumage a été réalisé de manière plus optimale, réduisant encore la traînée, et le propulseur est plus serré grâce à la nouvelle technologie de remplissage séquentiel. Le potentiel de ces obus ne sera pleinement révélé qu'avec l'aide des canons de char les plus modernes pour lesquels ils ont été créés à l'origine."

 nsb_ap_du_ammo0:0 "Munitions DU APFSDS à tige longue"
 nsb_ap_du_ammo0_desc:0 "La nouvelle génération de projectiles APFSDS, apparue à la fin de la guerre froide, se distinguait, outre un allongement encore plus important du pénétrateur, où le rapport diamètre/longueur commençait à atteindre 20:1, le remplacement d'un noyau en carbure de tungstène par un noyau, devenu plus tard monobloc, en alliage d'uranium appauvri et une petite addition de titane ou de nickel-zinc. L'idée d'équiper un projectile perforant d'un noyau d'uranium appauvri a été testée pour la première fois par les Allemands à la fin de la Seconde Guerre mondiale, mais a été rapidement oubliée. L'idée a refait surface au milieu des années 1970 aux États-Unis, où, face à la hausse des prix du tungstène et au problème croissant de l'accumulation de déchets nucléaires, une brillante idée a été formulée : utiliser l'uranium appauvri comme substitut moins coûteux au tungstène. Initialement, on s'attendait à ce que ses caractéristiques soient nettement pires, mais une observation surprenante a été faite selon laquelle l'uranium appauvri était non seulement aussi bon, mais même bien meilleur que le tungstène : contrairement à ce dernier, où le pénétrateur commençait à s'émousser et à perdre de l'énergie cinétique avec une immersion plus profonde dans l'armure, le pénétrateur à l'uranium appauvri n'a pas perdu son tranchant en raison de l'effet d'auto-affûtage. De plus, l'uranium finement dispersé formé lors de la pénétration du blindage est hautement pyrophorique, c'est-à-dire qu'il peut s'enflammer au contact de l'air, ce qui permet d'incendier les réservoirs de carburant et les munitions lors de la pénétration du blindage."
 nsb_ap_du_ammo1:0 "Munitions APFSDS à longue tige DU des premiers temps modernes"
 nsb_ap_du_ammo1_desc:0 "Le premier projectile moderne à l'uranium appauvri APFSDS est devenu encore plus long et plus mince, ce qui a permis une augmentation radicale du rapport diamètre/longueur et a atteint 30:1, mais a nécessité plusieurs innovations, telles que la réduction de l'envergure de l'aileron pour réduire la traînée, l'utilisation de nouveaux matériaux composites dans le sabot pour réduire la masse parasite et l'utilisation d'un nouveau type de propulseur capable de donner une vitesse suffisante à un pénétrateur lourd. De plus, en raison de la longueur accrue du pénétrateur, il était nécessaire d'approfondir son extrémité arrière dans la charge afin de conserver des dimensions adéquates."
 nsb_ap_du_ammo2:0 "Munitions DU modernes APFSDS à longue tige"
 nsb_ap_du_ammo2_desc:0 "Le projectile moderne à l'uranium appauvri APFSDS a été créé en réponse à l'émergence d'une protection améliorée sous la forme de nouvelles générations d'ERA et de NERA, ce qui a nécessité une nouvelle augmentation du rapport diamètre/longueur, qui peut désormais atteindre 35:1 ou plus, mais a conduit au fait que l'extrémité arrière du pénétrateur repose sur le fond de la charge ; En plus de cela, un nouveau propulseur à haute énergie a été utilisé pour accélérer encore plus le projectile et compenser quelque peu la quantité de charge retirée pour s'adapter au pénétrateur étendu, et une pointe en acier a également été ajoutée pour surmonter plus efficacement l'ERA."
 nsb_ap_du_ammo3:0 "Munitions APFSDS DU modernes avancées à longue tige"
 nsb_ap_du_ammo3_desc:0 "Les dimensions du projectile moderne et avancé à l'uranium appauvri APFSDS n'ont pratiquement pas changé par rapport aux modèles précédents, ce qui est associé à l'atteinte de la limite en matière d'augmentation du rapport diamètre/longueur et aux restrictions imposées par le volume interne du véhicule de combat, mais cela n'a pas empêché le projectile d'être encore amélioré : le plumage a été réalisé de manière plus optimale, réduisant encore la traînée, et le propulseur est plus serré grâce à la nouvelle technologie de remplissage séquentiel. Le potentiel de ces obus ne sera pleinement révélé qu'avec l'aide des canons de char les plus modernes pour lesquels ils ont été créés à l'origine."

 nsb_he_ammo0:0 "Munitions HE I (munitions chimiques)"
 nsb_he_ammo0_desc:0 "En règle générale, les munitions hautement explosives désignent une variété de projectiles qui affectent la cible avec des facteurs dommageables causés par une réaction chimique, c'est-à-dire une explosion, une onde de choc, des fragments formés ou des sous-munitions prêtes à l'emploi. Ces munitions sont généralement plus efficaces contre l'infanterie, les fortifications et les véhicules légèrement blindés. La conception de ces munitions est assez simple - un obus métallique avec un détonateur et rempli d'explosifs, emprunté à ceux utilisés par les canons de campagne et d'artillerie, et si le canon de char est fabriqué sur cette base ou est leur adaptation, alors les mêmes obus sont utilisés sans modifications."
 nsb_he_ammo1:0 "Munitions HE III"
 nsb_he_ammo1_desc:0 "Bien qu'il semble difficile d'améliorer la conception simple d'un projectile hautement explosif pour le tir direct d'armes à feu, qui accomplit la simple tâche de toucher une cible et d'exploser, il existe néanmoins une marge de modernisation et de développement, en particulier compte tenu des exigences plus spécifiques, différentes de celles des projectiles destinés à l'artillerie. Le projectile HE du début de la Guerre froide destiné aux armes à tir direct a une forme plus profilée, un détonateur amélioré et des explosifs plus puissants, ce qui lui permet de toucher avec plus de précision des cibles souples et légèrement blindées et d'infliger plus de dégâts qu'auparavant. De plus, l'avènement des canons à canon lisse a nécessité l'ajout d'un empennage rabattable pour stabiliser le vol et compenser le manque de rayures."
 nsb_he_ammo2:0 "Munitions HE IV"
 nsb_he_ammo2_desc:0 "Le projectile HE du milieu de la guerre froide a acquis plusieurs améliorations simples mais assez efficaces : l'utilisation de nouvelles méthodes de conditionnement explosif plus denses et de nouvelles qualités d'acier à fragmentation améliorée donnent des fragments plus uniformes et en plus grand nombre, ce qui confère à un tel projectile une plus grande zone de destruction. Pour ces projectiles, sont également apparus les premiers modèles de détonateurs programmables, permettant de faire exploser les munitions directement au-dessus de la tête de l'ennemi, mais comme elles sont programmées manuellement, leur efficacité est limitée."
 nsb_he_ammo3:0 "Munitions HE V"
 nsb_he_ammo3_desc:0 "L'obus HE de la fin de la Guerre froide évolue avec son temps et continue de s'améliorer là où il semblerait que la réserve de modifications soit épuisée. Un tel projectile est bourré de milliers d'éléments de frappe prêts à l'emploi, tels que des balles ou des fléchettes, de taille 0,5 ou 3 mm, ce qui permet de ne pas se fier uniquement aux propriétés de fragmentation du corps du projectile. L'utilisation d'un détonateur programmable avec détonation à distance, où les données de distance à la cible proviennent du télémètre et sont saisies automatiquement, permet de frapper l'ennemi derrière la couverture avec une grande efficacité et précision, qu'il s'agisse de tranchées ou de fenêtres de bâtiments."
 nsb_he_ammo4:0 "Munitions HE VI"
 nsb_he_ammo4_desc:0 "Un projectile HE moderne est équipé d'un détonateur numérique de haute précision avec plusieurs modes (ainsi que la possibilité de les commuter même lorsque le projectile est déjà dans la culasse), ce qui permet de le régler non seulement sur une certaine distance mais aussi sur une explosion avec retard ou au contact, ce qui rend le projectile multifonctionnel et permet de l'utiliser non seulement pour traiter des cibles cachées dans des abris ou derrière des obstacles, mais aussi pour détruire efficacement lesdits abris et obstacles eux-mêmes. Le coût du projectile correspond cependant à ses fonctions."

 nsb_heat_ammo0:0 "Munitions CHALEUR II"
 nsb_heat_ammo0_desc:0 "Au cours des travaux visant à améliorer les obus HEAT et en tenant compte de l'expérience de la Seconde Guerre mondiale, il a été constaté que la rotation conférée au projectile dans l'alésage interférait avec la formation d'un courant-jet pénétrant, ce qui réduisait considérablement les caractéristiques de perforation du blindage. Cela a conduit à des efforts visant à réduire la rotation du projectile, pour lesquels la fixation d'une taille de calibre fixe et un plumage repliable de surcalibre ont été lancés, ce qui a ralenti la rotation longitudinale et augmenté la précision, entre autres. Initialement, ces développements n'étaient utilisés que pour les obus de canons antichar et sans recul, mais au fil du temps, ils ont également touché les chars."
 nsb_heat_ammo1:0 "Munitions CHALEUR III"
 nsb_heat_ammo1_desc:0 "Le projectile HEAT du début de la Guerre froide a reçu des améliorations importantes telles que l'entretoise, qui est un capuchon avant allongé ou une sonde devant l'ogive, nécessaire pour assurer la formation d'un jet à une distance optimale et garantir que le détonateur tire à des angles d'impact plus nets ; en outre, le détonateur piézoélectrique, généralement plus fiable, a commencé à être utilisé le plus souvent, complété par une forme de revêtement plus efficace et des explosifs plus puissants."
 nsb_heat_ammo2:0 "Munitions CHALEUR IV"
 nsb_heat_ammo2_desc:0 "Au milieu de la guerre froide, des difficultés sont apparues pour les projectiles HEAT en raison du fait que les blindages combinés, spécialement conçus contre de tels projectiles, se sont généralisés. Pour le combattre, il était nécessaire d'améliorer la formation du jet, ce qui a été réalisé en ajoutant un amplificateur façonneur d'onde - un corps de forme cylindrique ou hémisphérique en matériau inerte (par exemple, de la mousse plastique) situé derrière l'entonnoir et permettant de modifier plus efficacement la trajectoire de l'onde de détonation, augmentant ainsi les performances de pénétration du blindage."
 nsb_heat_ammo3:0 "Munitions CHALEUR V"
 nsb_heat_ammo3_desc:0 "À la fin de la guerre froide, les performances des projectiles HEAT ont commencé à être franchement inférieures à celles de l'APFSDS de la même période, qui ont supplanté leur rôle de type d'obus secondaire dans le râtelier à munitions du MBT, restant cependant le rôle principal pour certains canons légers et canons à basse pression, où un calibre insuffisant ou l'incapacité de donner au projectile la vitesse souhaitée ne permettait pas l'utilisation d'un pénétrateur cinétique. Pour accroître leur efficacité, d'autres mesures ont été prises pour améliorer la formation et la focalisation du jet, par exemple l'utilisation de nouveaux explosifs et de nouvelles méthodes pour les enfoncer dans le corps du projectile."
 nsb_heat_ammo4:0 "Munitions CHALEUR VI"
 nsb_heat_ammo4_desc:0 "L'utilisation généralisée de l'ERA, particulièrement applicable aux véhicules légers, qui a été l'objectif principal des obus HEAT ces derniers temps, a nécessité une autre mise à niveau. Le premier projectile HEAT moderne emprunte des solutions aux lance-grenades antichar portatifs et aux ATGM, à savoir la charge tandem, où une charge du premier étage plus faible déclenche une détonation prématurée de l'ERA, le rendant inutile, ou fait un trou dans un blindage espacé, empêchant la charge du deuxième étage de tirer prématurément."
 nsb_heat_ammo5:0 "Munitions CHALEUR VII"
 nsb_heat_ammo5_desc:0 "Dans le cadre du développement de moyens de lutte contre de nouveaux types de protection pour les véhicules blindés, un projectile HEAT moderne de conception unique a été développé, intégrant les meilleures pratiques et idées. Son travail est basé sur trois charges creuses : la charge du premier étage dans le nez du projectile surmonte la couche ERA, la charge du deuxième étage située à l'arrière du projectile traverse le canal à l'intérieur de la charge du troisième étage sans le toucher et sans faire un trou dans le blindage et surmonter une partie du NERA, après quoi la charge du troisième étage traverse finalement le blindage et atteint la cible. L'utilisation d'un revêtement en tantale métallique lourd au lieu du cuivre améliore encore les capacités du projectile, tout en restant sûr, contrairement à celui à l'uranium appauvri. Malheureusement, en raison de la faible vitesse du projectile et de sa mauvaise trajectoire, il reste inférieur au projectile APFSDS, tout en atteignant la limite de développement possible, contrairement à ce dernier ; le prix de toutes ces innovations est également très élevé."
 nsb_heat_ammo6:0 "Munitions CHALEUR IX"
 nsb_heat_ammo6_desc:0 "Le projectile polyvalent antichar hautement explosif (HEAT-MP) est apparu comme un développement de l'idée d'utiliser plus efficacement la puissance explosive du projectile HEAT nécessaire à la formation d'un jet pénétrant, qui, bien qu'il comporte une certaine menace pour les cibles faciles à proximité de l'explosion, est en grande partie gaspillé, causant beaucoup moins de dégâts que ce qui est potentiellement possible. Pour augmenter l'effet dommageable contre les cibles souples et ainsi rendre le projectile HEAT plus polyvalent (ce qui est particulièrement important s'il s'agit du seul type autre que celui à pénétrateur cinétique), il est possible d'épaissir les parois latérales du projectile ou d'ajouter un manchon à fragmentation, augmentant ainsi la force mortelle à un coût minime."

 nsb_hesh_ammo0:0 "Munitions HESH (1955)"
 nsb_hesh_ammo0_desc:0 "L'idée d'un projectile à tête de courge hautement explosive (HESH) est née en Grande-Bretagne après la Seconde Guerre mondiale, comme moyen de combattre les fortifications ennemies et également de détruire les murs, les clôtures, les bâtiments et les routes. Cependant, au cours du processus de test, il s'est avéré qu'en plus des structures en béton, ce projectile avait également un effet positif sur les cibles blindées, ce qui a conduit à son adaptation aux chars et aux canons du génie militaire. En termes de conception, le projectile HESH est similaire à un projectile hautement explosif mais se distingue par des parois plus minces, l'utilisation uniquement d'explosifs plastiques, l'utilisation facultative d'une charge inerte dans la tête et une mèche retardée dans la base. Le principe de son action réside dans la propagation d'explosifs plastiques sur le blindage lorsqu'il atteint la cible, et dans l'explosion, conduisant à l'effritement et à la fragmentation du blindage, souvent sans le percer, et à frapper l'équipage et les composants internes avec les fragments résultants. Un tel projectile, bien sûr, est inférieur en termes d'impact sur des cibles souples à un HE conventionnel, mais il surpasse nettement un HEAT conventionnel."

 nsb_heat_mp_ammo0:0 "Munitions HEAT-MP (1985)"
 nsb_heat_mp_ammo0_desc:0 "Le projectile polyvalent antichar hautement explosif (HEAT-MP) est apparu comme un développement de l'idée d'utiliser plus efficacement la puissance explosive du projectile HEAT nécessaire à la formation d'un jet pénétrant, qui, bien qu'il comporte une certaine menace pour les cibles faciles à proximité de l'explosion, est en grande partie gaspillé, causant beaucoup moins de dégâts que ce qui est potentiellement possible. Pour augmenter l'effet dommageable contre les cibles souples et ainsi rendre le projectile HEAT plus polyvalent (ce qui est particulièrement important s'il s'agit du seul type autre que celui à pénétrateur cinétique), il est possible d'épaissir les parois latérales du projectile ou d'ajouter un manchon à fragmentation, augmentant ainsi la force mortelle à un coût minime."
 nsb_heat_mp_ammo1:0 "Munitions HEAT-MP (1995)"
 nsb_heat_mp_ammo1_desc:0 "Le HEAT-MP moderne, bien que le concept soit plus développé, est remarquablement différent des projectiles passés de ce type, et de tous les projectiles HEAT et HE en général créés jusqu'à présent. Il est sous-calibré et possède un sabot amovible, qui n'était pas utilisé auparavant pour un projectile à pénétrateur non cinétique, mais lui permet d'augmenter sa vitesse initiale de 30 % ; la fusée à double usage est dotée de modes d'impact et de proximité, ce qui lui permet d'être utilisée non seulement contre des véhicules blindés légers, de l'infanterie et des fortifications de campagne, mais également contre des cibles aériennes volant à basse altitude et à basse vitesse telles que des hélicoptères. Cependant, en raison de la plus petite taille de l'ogive du projectile, ses propriétés anti-blindage n'ont pratiquement pas augmenté."
 nsb_heat_mp_ammo2:0 "Munitions HEAT-MP (2005)"
 nsb_heat_mp_ammo2_desc:0 "Conservant la conception inhabituelle de son prédécesseur, le projectile moderne HEAT-MP a reçu un certain nombre d'améliorations importantes qui le rendent encore plus mortel pour les cibles souples : l'utilisation d'un corps avec une fragmentation améliorée et des explosifs plus puissants créent un champ de fragments plus dense, et un fusible amélioré lui permet d'utiliser la fonction de rafale aérienne à une distance donnée, offrant une plus grande flexibilité tactique contre les cibles cachées derrière un abri."

 nsb_heat_du_ammo0:0 "Munitions HEAT-DU (1985)"
 nsb_heat_du_ammo0_desc:0 "L'émergence d'un nouveau type de blindage NERA, devenu presque imprenable pour les projectiles HEAT traditionnels, a stimulé la recherche dans le domaine des matériaux de revêtement. La solution s'est avérée être la même que pour les obus APFSDS de l'époque : l'uranium appauvri. Un revêtement d'uranium appauvri plus lourd dans une charge creuse permet un jet encore plus pénétrant qu'auparavant, mais est discutable en termes d'éthique, de sécurité et de coût. "
 nsb_heat_du_ammo1:0 "Munitions HEAT-DU (1995)"
 nsb_heat_du_ammo1_desc:0 "L'utilisation généralisée de l'ERA, particulièrement applicable aux véhicules légers, qui a été l'objectif principal des obus HEAT ces derniers temps, a nécessité une autre mise à niveau. Le premier projectile HEAT moderne emprunte des solutions aux lance-grenades antichar portatifs et aux ATGM, à savoir la charge tandem, où une charge du premier étage plus faible déclenche une détonation prématurée de l'ERA, le rendant inutile, ou fait un trou dans un blindage espacé, empêchant la charge du deuxième étage de tirer prématurément. L'utilisation d'un revêtement à l'uranium appauvri dans la charge du deuxième étage rend un tel projectile encore plus mortel. Peut-être aussi pour les générations futures."
 nsb_heat_du_ammo2:0 "Munitions HEAT-DU (2005)"
 nsb_heat_du_ammo2_desc:0 "Dans le cadre du développement de moyens de lutte contre de nouveaux types de protection pour les véhicules blindés, un projectile HEAT moderne de conception unique a été développé, intégrant les meilleures pratiques et idées. Son travail est basé sur trois charges creuses : la charge du premier étage dans le nez du projectile surmonte la couche ERA, la charge du deuxième étage située à l'arrière du projectile traverse le canal à l'intérieur de la charge du troisième étage sans le toucher et sans faire un trou dans le blindage et surmonter une partie du NERA, après quoi la charge du troisième étage traverse finalement le blindage et atteint la cible. L'utilisation d'un revêtement en uranium appauvri au lieu du cuivre améliore encore les capacités du projectile, mais pour des raisons de sécurité et d'économie, seul le revêtement de la charge du troisième étage est constitué d'uranium appauvri. Malheureusement, en raison de la faible vitesse du projectile et de sa mauvaise trajectoire, il reste inférieur au projectile APFSDS, tout en atteignant la limite de développement possible, contrairement à ce dernier ; le prix de toutes ces innovations est également très élevé."

 nsb_autoloader0:0 "Fouloir de pistolet"
 nsb_autoloader0_desc:0 "Le pilon de canon est le mécanisme le plus simple pour accélérer le chargement d'une arme à feu et est principalement utilisé pour les gros calibres. Le pilon lui-même est entraîné par un mécanisme à ressort qui s'arme lorsque le pistolet recule. Alternativement, des mécanismes dotés d'un entraînement hydraulique ou électromécanique externe peuvent actionner la pilonneuse. Après le tir, le chargeur place le projectile suivant dans le plateau et le pilon l'envoie vers la culasse, économisant ainsi la force et le temps du chargeur."
 nsb_autoloader1:0 "Support de munitions mécanisé"
 nsb_autoloader1_desc:0 "Le râtelier de munitions mécanisé est le précurseur du chargeur automatique, étant une combinaison d'un pilon et d'un chargeur avec plusieurs obus, alimentant et chambrant les obus au fur et à mesure de leur épuisement. Bien que la plupart des processus soient automatisés, un tel râtelier à munitions ne contient qu'une petite partie des munitions et ne peut pas remplacer complètement le chargeur, qui effectue certaines opérations intermédiaires et réapprovisionne le magasin de munitions."
 nsb_autoloader2:0 "Mécanisme de chargement du tambour"
 nsb_autoloader2_desc:0 "Le chargeur automatique de tambour est un mécanisme de chargement d'armes relativement simple, équipé de l'entraînement mécanique le plus simple ; mis en mouvement lorsque le canon recule, il fait tourner le tambour et alimente le projectile vers le plateau, qui est ensuite envoyé dans la culasse par un pilon à ressort. Il augmente considérablement la cadence de tir, mais il utilise l'espace interne du char de manière inefficace, limitant la taille du chargement de munitions, nécessite un rechargement et ne remplace pas complètement le chargeur."
 nsb_autoloader3:0 "Premier mécanisme de chargement du carrousel"
 nsb_autoloader3_desc:0 "Chargeur automatique de type carrousel, avec cycle de rechargement entièrement automatisé, où toutes ou presque toutes les coquilles sont préemballées dans des plateaux en cercle. L'entraînement électro-hydraulique est assez compliqué et peu fiable, et l'emplacement des munitions est plus sujet à la détonation. Cependant, ce mécanisme permet d'éliminer complètement le chargeur et réduit donc considérablement le volume interne et le blindage requis, rendant le char plus petit et plus léger."
 nsb_autoloader4:0 "Mécanisme de chargement du carrousel modernisé"
 nsb_autoloader4_desc:0 "Le chargeur automatique à carrousel de conception simplifiée remplace l'entraînement électro-hydraulique par un entraînement entièrement électromécanique pour réduire le risque d'incendie et augmenter la fiabilité. Ceci est associé à un emplacement légèrement meilleur des munitions pour réduire le risque de détonation. Bien que son volume et les avantages associés restent les mêmes, cette conception a une cadence de tir plus lente et contient moins de munitions."
 nsb_autoloader5:0 "Mécanisme avancé de chargement du carrousel"
 nsb_autoloader5_desc:0 "Le développement ultérieur des chargeurs automatiques à carrousel comprend de nouveaux entraînements de chargement, des contrôleurs électroniques améliorés et d'autres innovations qui combinent la plus grande sécurité et fiabilité de la génération précédente de chargeurs automatiques à carrousel électromécaniques avec la vitesse de rechargement élevée des chargeurs électrohydrauliques."
 nsb_autoloader6:0 "Mécanisme de chargement de carrousel moderne"
 nsb_autoloader6_desc:0 "Chargeur automatique à carrousel, qui comprend les dernières avancées technologiques et matérielles - numérisation complète de tous les processus, cartouches pour munitions en matériaux réfractaires (malheureusement, elles n'éliminent pas complètement la menace d'explosion de munitions), mais surtout, adaptation pour le stockage et le chargement des dernières munitions perforantes qui ne pouvaient pas être placées dans des chargeurs automatiques plus anciens de ce type en raison de leur taille."

 nsb_conveyer_autoloader0:0 "Premier mécanisme de chargement de la bande transporteuse"
 nsb_conveyer_autoloader0_desc:0 "Chargeur automatique de type convoyeur, avec un cycle de rechargement entièrement automatisé, où la plupart des coquilles (généralement la moitié ou les deux tiers) sont pré-emballées dans des plateaux à bande transporteuse. Un tel mécanisme est plus simple, plus rapide et plus fiable qu'un carrousel, et l'emplacement du chargement de munitions est moins dangereux pour l'équipage, cependant, il utilise moins efficacement l'espace réservé - la taille de la niche arrière de la tourelle du char, où se trouve habituellement le chargeur automatique, dépend directement de la taille du chargement de munitions, ce qui limite son volume et oblige le chargeur automatique à être réapprovisionné plus souvent."
 nsb_conveyer_autoloader1:0 "Mécanisme avancé de chargement de la bande transporteuse"
 nsb_conveyer_autoloader1_desc:0 "Chargeur automatique à tapis roulant, doté des nouvelles avancées technologiques telles que le contrôle numérique avec processeur intégré, les codes-barres qui permettent au système de reconnaître le type de munitions en stock et les entraînements électromécaniques améliorés qui accélèrent le rechargement. Le réapprovisionnement en munitions hors combat peut être effectué facilement grâce à une trappe située dans la niche arrière de la tourelle."
 nsb_conveyer_autoloader2:0 "Mécanisme de chargement de bande transporteuse moderne"
 nsb_conveyer_autoloader2_desc:0 "Un chargeur automatique à bande transporteuse doté des dernières technologies, utilisant de nouveaux matériaux légers, une conception améliorée pour une plus grande capacité, une sécurité avancée pour empêcher la détonation des munitions et une cadence de tir sans précédent. De tous les chargeurs automatiques, celui-ci est le plus sûr et le plus confortable à utiliser pour l'équipage."

 nsb_drum_autoloader0:0 "Mécanisme avancé de chargement du tambour"
 nsb_drum_autoloader0_desc:0 "Un développement plutôt original de l'idée d'un chargeur automatique de fûts, complété par des technologies modernes. Dans ce mécanisme de chargement, il existe toujours un chargeur de type tambour contenant plusieurs obus, cependant, contrairement à son prédécesseur, le cycle de chargement est entièrement automatisé : le pilon envoie les obus du tambour à la culasse, et lorsqu'il est vide, il est réapprovisionné à partir d'un râtelier de munitions mécanisé. Ce n'est pas le schéma le plus fiable, mais il permet de réaliser une série de prises de vue avec un délai minimum et plus rapidement que tout autre type de chargement."

 nsb_aiming_devices0:0 "Mécanismes de visée de base"
 nsb_aiming_devices0_desc:0 "Mécanismes de base de guidage des armes mécaniques, électromécaniques et électrohydrauliques. Étant donné que tout changement de position du char ou de sa cible doit être corrigé manuellement, cela complique le travail du tireur et ne permet pas une visée et un tir efficaces en mouvement."
 nsb_aiming_devices1:0 "Stabilisateur à un plan"
 nsb_aiming_devices1_desc:0 "Un stabilisateur monoplan est un mécanisme électro-hydraulique doté d'un gyroscope qui permet au tireur de maintenir le canon sur la cible dans un plan vertical, pendant que le véhicule de combat est en mouvement. Bien que les premiers modèles de tels stabilisateurs soient coûteux et imparfaits, ils permettent de tirer avec précision à partir d'arrêts courts ou lors de déplacements à une vitesse allant jusqu'à 10 km/h, ce qui offre un avantage significatif sur l'ennemi."
 nsb_aiming_devices2:0 "Stabilisateur à deux plans"
 nsb_aiming_devices2_desc:0 "Un stabilisateur électro-hydraulique à deux plans ou, moins souvent, entièrement électrique, assure le maintien automatique et en douceur de la position du canon dans les plans vertical et horizontal pendant que le char est en mouvement. Un tel système permet un tir ciblé à part entière lorsque le char se déplace à des vitesses allant jusqu'à 25 km/h, même avec un changement du vecteur de mouvement."
 nsb_aiming_devices3:0 "Systèmes de visée informatisés"
 nsb_aiming_devices3_desc:0 "Le système avancé de stabilisation à deux plans comprend des entraînements de guidage entièrement électriques et une unité de commande basée sur IC. Cela rend le stabilisateur beaucoup plus silencieux et réduit l'inflammabilité (en raison de la réduction du volume du fluide de travail de plusieurs dizaines de litres à quelques litres seulement), et augmente la précision de la stabilisation au détriment d'une plus grande consommation d'énergie. Un tel système permet également de tirer de manière ciblée lorsque le char se déplace à des vitesses allant jusqu'à 30 km/h."
 nsb_aiming_devices4:0 "Systèmes de visée informatisés avancés"
 nsb_aiming_devices4_desc:0 "Le système de stabilisation doté de nouveaux contrôleurs et de moteurs de guidage électriques plus puissants réduit les erreurs de stabilisation et augmente la vitesse et la fluidité du guidage. Un accumulateur de condensateurs assure le fonctionnement même lorsque le moteur est arrêté ou si le groupe auxiliaire de puissance est endommagé. Les capacités d'un tel système permettent à un char roulant à des vitesses allant jusqu'à 35 km/h d'atteindre des cibles se déplaçant à des vitesses allant jusqu'à 70 km/h. Le coût est conforme aux fonctionnalités."
 nsb_aiming_devices5:0 "Systèmes de visée informatisés modernes"
 nsb_aiming_devices5_desc:0 "Le système de stabilisation doté d'une électronique avancée et d'entraînements de guidage encore plus puissants offre une précision de guidage sans précédent et permet à la tourelle pesant plus de 20 tonnes d'effectuer une rotation complète en quelques secondes. Avec la réduction des erreurs de stabilisation, il est devenu possible de mener des tirs ciblés à des vitesses allant jusqu'à 40 km/h, sur des cibles se déplaçant à plus de 70 km/h, si de tels véhicules terrestres rapides existent. Il est peu probable que la complexité de fabrication et le coût de production permettent d'équiper tous les réservoirs d'un tel système."

 nsb_ballistic_calculator0:0 "Ordinateur balistique mécanique"
 nsb_ballistic_calculator0_desc:0 "L'arithmomètre mécanique peut effectuer des calculs assez complexes, en tenant compte du type de projectile, de la portée de la cible et même des conditions météorologiques, ainsi que pointer automatiquement le canon une fois les calculs terminés et les corrections apportées, ce qui permet de tirer beaucoup plus loin et avec plus de précision. Cependant, toutes les données nécessaires sont saisies manuellement, les corrections sont calculées séparément sur le système balistique et le système lui-même est extrêmement coûteux, peu fiable et difficile à assembler et à entretenir, ainsi qu'à utiliser par l'équipage, nécessitant des compétences avancées et créant une charge de travail supplémentaire, et n'apportera donc guère l'effet positif escompté."
 nsb_ballistic_calculator1:0 "Ordinateur balistique analogique-numérique"
 nsb_ballistic_calculator1_desc:0 "Le calculateur balistique analogique-numérique est un hybride de solutions analogiques avancées offrant une vitesse élevée mais limitées dans la variété des opérations effectuées, et de systèmes numériques qui ne sont pas encore suffisamment développés pour fournir une vitesse élevée mais offrent une plus grande variété d'opérations possibles. Par rapport à la génération précédente d'ordinateurs purement mécaniques ou analogiques, les dimensions ont été considérablement réduites, tandis que la fiabilité et les performances ont augmenté."
 nsb_ballistic_calculator2:0 "Ordinateur balistique numérique"
 nsb_ballistic_calculator2_desc:0 "Un calculateur électronique, basé sur des éléments solides et associé à plusieurs capteurs, calcule avec une grande précision les corrections angulaires du tir d'un canon. Il entre automatiquement la distance jusqu'à la cible à partir du télémètre laser, la vitesse du vent latéral, la vitesse angulaire de la cible et l'angle d'inclinaison de l'axe des tourillons du canon. Mais les données sur la pression barométrique, la température de l'air, la température de charge, l'usure de l'alésage du canon, ainsi que les corrections du désalignement de la direction de l'axe de l'alésage et de la ligne de visée sont toujours saisies manuellement."
 nsb_ballistic_calculator3:0 "Ordinateur balistique numérique avancé"
 nsb_ballistic_calculator3_desc:0 "Un ordinateur entièrement numérique doté de plusieurs (voire plusieurs dizaines) processeurs avec des architectures 8, 16 ou 32 bits. Toutes les données nécessaires, y compris le vent latéral, la portée cible, l'usure de l'alésage, le roulis de l'axe du tourillon du canon, la température de l'air et la pression atmosphérique, sont collectées et traitées automatiquement. Ce complexe fournit à l'équipage une réception continue de données de navigation, d'informations sur la disponibilité du carburant et des munitions, de l'état des systèmes de chars, ainsi que de l'état de combat et de l'emplacement des autres chars de l'unité, ainsi que des informations sur l'ennemi. Grâce aux équipements de transmission de données, toutes les informations nécessaires sont envoyées aux autres chars, au commandant de l'unité et au système logistique. Le système lui-même constitue la première étape vers l'intégration du char dans la doctrine émergente de la guerre réseaucentrique et la formation d'un système d'information et de contrôle des chars. Le coût de l'ensemble du remplissage électronique représente une part importante du coût du véhicule de combat lui-même."
 nsb_ballistic_calculator4:0 "Ordinateur balistique numérique moderne"
 nsb_ballistic_calculator4_desc:0 "Le premier système de conduite de tir moderne s'est éloigné de son ancien rôle d'ordinateur purement balistique, devenant une partie intégrante d'un véhicule de combat moderne, créé en tenant compte de la doctrine de la guerre centrée sur le réseau, où toutes les unités de combat sont mises en réseau, échangeant continuellement entre elles des renseignements pertinents de haute précision sur la localisation des forces alliées et ennemies, les collisions en cours et bien plus encore. Ce système, équipé de processeurs puissants, d'émetteurs fiables et d'écrans couleur, permet au commandant du véhicule de combat de suivre l'emplacement dans l'espace sur des cartes numériques de haute précision en temps réel, augmentant ainsi la connaissance de la situation tactique et permettant à l'équipage d'opérer et d'accomplir les tâches assignées plus efficacement."
 nsb_ballistic_calculator5:0 "Ordinateur balistique numérique moderne"
 nsb_ballistic_calculator5_desc:0 "Le système de conduite de tir moderne présente une ergonomie améliorée et une intégration complète et directe dans la structure de commandement et d'information de l'armée, ce qui permet au commandant du véhicule d'échanger des données même à l'aide de satellites, augmentant ainsi la vitesse, l'échelle et la précision des informations transmises. De plus, les moyens de communication sont compatibles avec les réseaux d'information et de combat d'autres unités et formations, ainsi que de l'infanterie, permettant aux véhicules blindés de fonctionner plus efficacement et plus facilement au combat."
 nsb_ballistic_calculator6:0 "Ordinateur balistique numérique moderne et avancé"
 nsb_ballistic_calculator6_desc:0 "Le système de contrôle de tir moderne et avancé comprend des améliorations des composants matériels, tels que des écrans tactiles couleur haute résolution et des vitesses de traitement plus rapides, ainsi que des améliorations logicielles comprenant une interface plus intuitive qui offre une connaissance accrue de la situation."

 nsb_optics0:0 "Sites optiques de base"
 nsb_optics0_desc:0 "Les dispositifs optiques périscopiques et télescopiques de base du commandant et du tireur offrent la possibilité d'observer et de viser au combat. La mesure de distance s'effectue à l'aide d'un télémètre stadiamétrique ou d'une grille télémétrique. L'efficacité varie en fonction de l'expérience de l'équipage et de la capacité à identifier la cible et, par conséquent, à déterminer sa hauteur, sans laquelle il est impossible de déterminer avec précision la distance."
 nsb_optics1:0 "Viseur avec télémètre optique"
 nsb_optics1_desc:0 "Les télémètres optiques sont le nom collectif des dispositifs optiques qui permettent de déterminer la distance jusqu'à une cible de manière géométrique à l'aide de deux prismes espacés l'un de l'autre, ce qui offre un avantage significatif au combat. Ceux-ci incluent les télémètres de coïncidence et stéréoscopiques. Bien que de tels télémètres soient connus depuis des décennies et utilisés depuis longtemps dans l'artillerie navale et anti-aérienne, ils n'ont été adaptés que récemment aux chars. Cette catégorie comprend indirectement également les rares télémètres optiques-électriques d'invention récente, émettant des impulsions lumineuses ou infrarouges et mesurant le temps nécessaire aux ondes électromagnétiques pour parcourir la distance dans les domaines optiques ou infrarouges, qui étaient essentiellement les précurseurs du télémètre laser. Étant donné que la précision de la mesure de la distance d'un télémètre optique dépend directement de la base stéréo, c'est-à-dire de la distance entre les prismes, cela le rend assez grand, entraîne une augmentation du volume interne du char et affaiblit la protection du blindage."
 nsb_optics2:0 "Viseur de base stabilisé"
 nsb_optics2_desc:0 "L'équipement des viseurs optiques périscopiques et télescopiques d'un gyroscope stabilisateur à trois étages, d'un gyroscope prédicteur et d'un entraînement électrique automatisé permet une stabilisation fiable du viseur dans le plan vertical, simplifiant le travail du tireur et permettant une visée plus précise en mouvement. Cependant, comme la portée est toujours déterminée de manière stadiométrique, un tel viseur est inférieur aux viseurs avec télémètre optique lors de prises de vue à longue distance."
 nsb_optics3:0 "Viseur stabilisé avec télémètre optique"
 nsb_optics3_desc:0 "Le viseur amélioré avec télémètre optique est à bien des égards supérieur à la génération précédente. L'optique télémétrique améliorée fournissant une mesure précise de la portée jusqu'à 3 000-4 000 mètres et une stabilisation indépendante du viseur dans le plan vertical, associées à plusieurs capteurs simples, ont permis de calculer l'angle de visée à partir de la plage mesurée et de l'entrer automatiquement dans l'entraînement du canon. Il est également possible de prendre en compte le mouvement propre du char, déterminé à l'aide du capteur de vitesse du char et du cosinus d'un potentiomètre qui fixe la position de la tourelle par rapport à la coque du char."
 nsb_optics4:0 "Viseur avec télémètre laser"
 nsb_optics4_desc:0 "Equipé d'un développement révolutionnaire de ces derniers temps - un télémètre laser - ce viseur représente une véritable avancée dans l'acquisition de cibles. Le télémètre laser fonctionne sur le principe de mesurer le temps nécessaire à une impulsion laser pour se rendre à une cible et revenir, ce qui, compte tenu de la vitesse de la lumière, rend trivial le calcul de la distance avec une grande précision, plus ou moins 10 mètres à une distance allant jusqu'à 10 000 mètres (où 5 000 mètres sont généralement plus que suffisants en combat). Les télémètres laser de cette période sont généralement basés sur un rubis artificiel comme support laser, bien que parfois, un grenat d'yttrium et d'aluminium dopé au néodyme soit utilisé plus efficace. Malgré les défauts des premiers modèles, un tel système augmentera certainement l'efficacité du combat."
 nsb_optics5:0 "Viseur avancé avec télémètre laser"
 nsb_optics5_desc:0 "La nouvelle génération d'optiques, entre autres améliorations mineures, est presque universellement équipée d'un télémètre laser plus avancé à base de grenat d'yttrium et d'aluminium dopé au néodyme, mais surtout, le viseur est équipé d'une stabilisation complète de la ligne de visée dans deux plans : cela améliore considérablement la précision en mouvement, car pour la visée, il est plus facile d'assurer une faible erreur lors de la stabilisation que lors de la stabilisation du canon. De plus, un viseur stabilisé dans deux plans permet de combiner le processus de visée et d'utilisation d'un télémètre laser avec le chargement d'un canon en mouvement, puisqu'après un tir la tourelle (le cas échéant) est verrouillée sur le corps du véhicule de combat, ce qui empêchait auparavant le tireur d'effectuer ces opérations pendant tout le cycle de chargement."
 nsb_optics6:0 "Viseur moderne avec télémètre laser"
 nsb_optics6_desc:0 "Poursuite de l'amélioration des viseurs optiques associée à une réduction de leurs dimensions et de leur poids, à un système avancé d'auto-test pour les erreurs opérationnelles, à l'ajout d'un résonateur Raman à un télémètre laser, qui diminue la longueur d'onde du faisceau laser à des valeurs sans danger pour les yeux, ainsi qu'à l'inclusion d'un sous-système de localisation de cible lointaine qui permet un tir ciblé jusqu'à 8 000 mètres."
 nsb_optics7:0 "Viseur moderne avec télémètre laser"
 nsb_optics7_desc:0 "Les dernières optiques de visée, complétées par des caméras externes, affichant les données sur un écran numérique et équipées de systèmes de reconnaissance de cibles, augmentent considérablement la connaissance de la situation de l'équipage et ses capacités de combat. Un tel système présente plusieurs inconvénients, tels qu'un coût élevé ou le risque que l'équipage devienne « aveugle » si les caméras sont endommagées, mais cela n'enlève rien au fait qu'un tel système prend moins de place, crée moins de points faibles dans le blindage et protège l'équipage de la possibilité de devenir aveugle, si les optiques étaient affectées par les systèmes laser ennemis."

 nsb_pano_sight0:0 "Vue panoramique précoce"
 nsb_pano_sight0_desc:0 "Le viseur panoramique du commandant de char constitue un nouveau paradigme en matière d'optique de char. L'optique de dérotation offre une vue panoramique complète et une détection améliorée de la cible, tandis que la stabilisation indépendante à deux plans garantit que la cible est constamment maintenue dans le champ de vision du commandant. De plus, en présence de systèmes de visée modernes, un viseur panoramique peut être intégré aux systèmes de conduite de tir du char, ce qui permettra au commandant, si nécessaire, d'assumer le travail du tireur ainsi que de prendre le contrôle total des systèmes de visée. Cependant, un tel luxe s'accompagne d'un prix élevé et d'une faible fiabilité."
 nsb_pano_sight1:0 "Vue panoramique avancée"
 nsb_pano_sight1_desc:0 "Le viseur panoramique du commandant de char, amélioré avec les dernières technologies électroniques et des matériaux plus coûteux tels que les métaux des terres rares, offre une meilleure intégration avec les systèmes de contrôle de tir du char et améliore la qualité de l'observation à l'arrêt et en mouvement. Pour adapter le canon au viseur, qui dispose d'un champ de vision stabilisé lorsqu'il est pointé, le viseur génère en permanence des données sur les décalages inertiels entre la ligne de visée et la position de la tourelle et sur l'origine des angles verticaux. Le miroir du système d'alignement automatique, fixé à l'avant du canon, est utilisé pour maintenir une position cohérente (calibrée) du viseur et du pistolet."
 nsb_pano_sight2:0 "Vue panoramique moderne"
 nsb_pano_sight2_desc:0 "Poursuite du développement des viseurs panoramiques pour chars, avec des performances encore meilleures. Parmi les innovations figurent le système chasseur-tueur, dans lequel le commandant de char recherche des cibles en temps réel et transmet immédiatement leurs coordonnées au tireur, ainsi que la possibilité de transmettre des données sur les cibles détectées à d'autres chars au sein d'un peloton, d'une compagnie ou même d'un bataillon si le matériel requis est installé."
 nsb_night_vision0:0 "Vision nocturne zéro génération"
 nsb_night_vision0_desc:0 "Les viseurs de vision nocturne de génération zéro utilisent une photocathode argent-oxygène-césium S1 avec une sensibilité lumineuse d'environ 60 microampères par lumen, ils nécessitent donc un fonctionnement actif avec un éclairage infrarouge continu qui peut être démasqué par un projecteur infrarouge ennemi. Une consommation d'énergie élevée, une faible fiabilité, une durée de vie de quelques centaines d'heures seulement et des pannes en plein jour restent de sérieuses limites, mais ils offrent toujours une autonomie de 500 à 700 mètres et une conduite de nuit à une vitesse de 15 à 25 km/h."
 nsb_night_vision1:0 "Vision nocturne de première génération"
 nsb_night_vision1_desc:0 "La première génération à part entière constitue une avancée décisive, avec une durée de vie allant jusqu'à 1 500 heures et une fiabilité et une durabilité bien supérieures grâce à une photocathode S-20 sodium-potassium-antimoine-césium améliorée avec une sensibilité à la lumière de 150 à 200 microampères par lumen. Il peut fonctionner de manière passive sans démasquer l'utilisateur, tandis qu'un projecteur infrarouge reste disponible dans des conditions de visualisation défavorables."
 nsb_night_vision2:0 "Vision nocturne de deuxième génération"
 nsb_night_vision2_desc:0 "Une photocathode S-25 améliorée augmente la sensibilité à la lumière à 230 microampères par lumen et la durée de vie efficace à 2 500-5 000 heures. Une plaque à microcanaux avec une électrode en nichrome des deux côtés jusqu'à 1 000 volts, constituée de milliers de fibres de verre creuses décalées par rapport à l'axe du tube, amplifie considérablement le signal entrant."
 nsb_night_vision3:0 "Vision nocturne de troisième génération"
 nsb_night_vision3_desc:0 "Une photocathode à l'arséniure de gallium avec une sensibilité à la lumière supérieure à 900 microampères par lumen est sensible au proche infrarouge et largement indépendante des sources de lumière naturelle. Son affinité électronique négative donne aux photoélectrons le libre passage vers la zone de vide, tandis que la durée de vie atteint jusqu'à 10 000 heures."
 nsb_night_vision4:0 "Vision nocturne de troisième génération et plus"
 nsb_night_vision4_desc:0 "Un film plus fin piège moins d'électrons pour une image plus claire, tandis qu'une alimentation électrique à grille automatique régule la tension de la photocathode lorsque les conditions d'éclairage changent, permettant un fonctionnement tout aussi efficace dans des conditions de faible luminosité que de forte luminosité."
 nsb_night_vision5:0 "Vision nocturne Fusion"
 nsb_night_vision5_desc:0 "La vision nocturne Fusion combine la vision nocturne et l'imagerie thermique, améliorant la visibilité dans des conditions de faible luminosité et ajoutant la possibilité de détecter les signatures thermiques tout en conservant la possibilité d'utiliser l'un ou l'autre appareil séparément."

 nsb_awareness_system:0 "Système de connaissance de la situation de l'équipage"
 nsb_awareness_system_desc:0 "Dès l'apparition des premiers véhicules blindés, leurs équipages ont été confrontés à la tâche la plus difficile : s'orienter dans l'espace de combat ; détecter et détruire l'ennemi, tout en se trouvant dans un espace exigu avec une vue limitée. Des désagréments, un stress et une tension extrêmes ont grandement compliqué le travail de l'équipage. Depuis plus de cent ans d'existence des chars, les dispositifs de surveillance ont parcouru un long chemin depuis les fentes non vitrées dans le blindage jusqu'aux viseurs pour le tireur et le commandant stabilisés dans deux avions, les viseurs panoramiques, les caméras de surveillance externes - mais tout cela n'a pas aidé à résoudre complètement les problèmes de l'environnement de travail claustrophobe à l'intérieur des véhicules de combat. Cependant, les dernières avancées technologiques permettent de résoudre ce problème : grâce à la technologie de réalité augmentée et en utilisant les informations provenant des canaux de surveillance optoélectroniques, il est possible de créer une vue panoramique transparente à travers le blindage, qui indique également les emplacements alliés et ennemis, selon les informations reçues des unités alliées. Un tel système révolutionnera la conduite du combat, en offrant à l'équipage une conscience maximale de la situation et, de manière significative, la létalité de notre équipage."

 nsb_light_guns:0 "Pistolet léger du début de la Seconde Guerre mondiale"
 nsb_light_guns_desc:0 "Le canon de char léger était la taille de canon la plus courante avant la guerre et au début de la Seconde Guerre mondiale. C'était l'armement principal des chars légers, qui constituaient la base de la plupart des flottes de chars du pays à cette époque. Pour des raisons telles que le manque de cibles valables et la capacité de charge insuffisante des chars légers, le calibre des canons et la létalité des munitions sont restés faibles."
 nsb_light_guns1:0 "Pistolet léger du milieu de la Seconde Guerre mondiale"
 nsb_light_guns1_desc:0 "Le canon de char léger du milieu de la Seconde Guerre mondiale est un nom collectif pour les canons de char léger montés ou prévus pour être montés sur des chars légers, allant des canons antichar à l'artillerie légère. Comme les camps adverses avaient un savoir-faire limité en matière de production de chars, les nouveaux canons légers étaient souvent réservés aux chasseurs de chars, tandis que les chars légers à usage général étaient toujours construits avec des canons de la génération précédente."
 nsb_light_guns2:0 "Pistolet léger de la fin de la Seconde Guerre mondiale"
 nsb_light_guns2_desc:0 "Le canon de char léger de la fin de la Seconde Guerre mondiale n'allait pas loin en termes de calibre par rapport à ses prédécesseurs, mais avançait considérablement en termes de longueur de canon et de pressions admissibles. Cela a permis d'utiliser des projectiles plus puissants et ainsi de rester pertinent avec l'avènement de cibles mieux blindées."
 nsb_light_guns3:0 "Pistolet léger d'après-guerre"
 nsb_light_guns3_desc:0 "Le canon de char léger d'après-guerre représente la poursuite de la lutte pour maintenir la pertinence du char léger sur le champ de bataille. De nombreuses améliorations, notamment des freins de bouche, un évacuateur de canon, de nouveaux dispositifs anti-recul et des canons plus longs, ont permis aux chars légers de rester pertinents sur le champ de bataille des années 1950."
 nsb_light_guns4:0 "Pistolet léger du début de la guerre froide"
 nsb_light_guns4_desc:0 "Le canon de char léger du début de la guerre froide perpétue en grande partie les traditions de ses prédécesseurs, restant davantage un moyen de soutien et d'embuscade. Avec l'augmentation du calibre et de la longueur du canon, ces canons rattrapent ceux du milieu de la Seconde Guerre mondiale tout en étant beaucoup plus compacts et plus légers. Cependant, de tels canons étaient rarement installés sur les chars de cette période, où les canons moins chers à basse pression ou capables de lancer des ATGM étaient privilégiés."
 nsb_light_guns5:0 "Pistolet léger de la guerre froide"
 nsb_light_guns5_desc:0 "Le canon de char léger du milieu de la guerre froide a été créé face à un grand nombre d'exigences en matière de mobilité améliorée des chars, de capacité amphibie et de transportabilité aérienne. À ces fins, les canons éprouvés des chars moyens de la fin et de l'après-guerre ont été allégés et équipés, dotés de dispositifs de recul rétrécis et montés sur des véhicules blindés légers."
 nsb_light_guns6:0 "Pistolet léger de la fin de la guerre froide"
 nsb_light_guns6_desc:0 "Le canon de char léger de la fin de la guerre froide, y compris en termes de calibre, se rapprochait à bien des égards de celui des principaux chars de combat du début de la guerre froide, ne leur cédant qu'en termes de pression d'alésage en raison des restrictions de taille et de poids. Cependant, l'augmentation de la puissance de feu fait des chars légers et autres véhicules de combat de cette période équipés d'un tel canon une menace sérieuse pour les véhicules de leur propre classe et pour les chars de combat principaux plus anciens. Les véhicules légers doivent utiliser leurs avantages supérieurs en matière de mobilité et de dissimulation pour obtenir un avantage sur les chars de combat principaux contemporains."
 nsb_light_guns7:0 "Premier pistolet léger moderne"
 nsb_light_guns7_desc:0 "Le premier canon de char léger moderne est une adaptation directe des canons de char de combat principal de la génération précédente à un châssis léger, avec quelques modifications pour s'adapter aux véhicules légers. Un tel canon offre une puissance de feu et une précision importantes, presque comparables à celles des chars de combat principaux, ce qui élargit considérablement les capacités tactiques du véhicule de combat qui en est équipé."
 nsb_light_guns8:0 "Pistolet léger moderne"
 nsb_light_guns8_desc:0 "Le canon de char léger moderne est soit une modernisation des canons des derniers chars moyens et des premiers chars de combat principaux, soit une version plus légère du canon d'un char de combat principal moderne. De nouveaux dispositifs d'amortissement du recul permettent d'allonger le canon et d'utiliser des charges de projectiles plus puissantes, augmentant ainsi les performances balistiques et la précision de ces canons."
 nsb_light_guns9:0 "Pistolet léger moderne avancé"
 nsb_light_guns9_desc:0 "Les canons de chars légers modernes et avancés constituent le développement ultime de cette classe de canons. Les nouvelles technologies, alliages et matériaux composites utilisés dans la fabrication de ces canons permettent d'augmenter encore la pression admissible dans l'alésage, permettant l'utilisation de projectiles plus puissants tout en restant dans les contraintes de conception des chars légers."

 nsb_low_pressure_guns:0 "Pistolet à basse pression d'après-guerre"
 nsb_low_pressure_guns_desc:0 "Le canon basse pression a été développé après la Seconde Guerre mondiale et, comme son nom l'indique, fonctionne à une pression beaucoup plus faible dans la culasse et dans l'alésage qu'un canon léger conventionnel. Bien que le canon à basse pression soit inférieur à celui d'un char léger conventionnel à presque tous égards et qu'il ne puisse pas utiliser d'obus à pénétration cinétique en raison de la vitesse insuffisante attachée au projectile, il s'agit d'une arme bon marché et abordable. Il convient parfaitement aux véhicules blindés légers et produits en série. De plus, la simplicité de conception, le minimum de pièces mobiles et la faible contrainte rendent un tel pistolet beaucoup plus fiable que tout autre."
 nsb_low_pressure_guns1:0 "Pistolet à basse pression du début de la guerre froide"
 nsb_low_pressure_guns1_desc:0 "Le canon basse pression du début de la Guerre froide est doté d'un canon plus long, ce qui lui permet de tirer plus loin et avec plus de précision que d'habitude tout en restant simple et bon marché. De plus, ce canon est mieux adapté à la nouvelle classe émergente de véhicules de combat d'infanterie, ce qui leur permettra de mieux se protéger."
 nsb_low_pressure_guns2:0 "Pistolet à basse pression au milieu de la guerre froide"
 nsb_low_pressure_guns2_desc:0 "Dans la continuité de la lutte contre les deux principaux inconvénients des canons à basse pression - une faible précision et une faible portée, les canons à basse pression du milieu de la Guerre froide sont fabriqués avec des canons encore plus longs, utilisant des technologies de fabrication plus précises, permettant ainsi même aux véhicules les plus légers qui en sont équipés de constituer une menace notable pour les véhicules blindés légers ennemis."
 nsb_low_pressure_guns3:0 "Premier pistolet moderne à basse pression"
 nsb_low_pressure_guns3_desc:0 "Le premier canon basse pression moderne a un calibre plus gros et un canon encore plus long, ce qui permet non seulement d'augmenter la précision, mais également d'utiliser le canon pour lancer des ATGM, rendant les véhicules qui en sont équipés encore plus dangereux pour l'ennemi."

 nsb_medium_guns:0 "Canon moyen du début de la Seconde Guerre mondiale"
 nsb_medium_guns_desc:0 "Le canon de char moyen du début de la Seconde Guerre mondiale est apparu peu avant la guerre, après la prise de conscience doctrinale que les chars seraient impliqués dans des combats char contre char, et pas seulement dans le soutien rapproché de l'infanterie. Ces canons, d'une part, sont nettement supérieurs à tous les canons légers, leur permettant de frapper plus efficacement l'infanterie et les véhicules blindés, mais d'autre part, ils avaient une balistique médiocre en raison de leurs canons courts. Ces canons étaient également installés sur les premiers chars lourds."
 nsb_medium_guns1:0 "Canon moyen au milieu de la Seconde Guerre mondiale"
 nsb_medium_guns1_desc:0 "Un canon de char moyen datant du milieu de la Seconde Guerre mondiale, doté d'un plus gros calibre et d'un canon plus long que les canons précédents de cette classe. Ils étaient généralement développés à partir de canons anti-aériens qui se sont révélés efficaces dans un rôle antichar. Ils offrent une portée plus longue et une excellente balistique."
 nsb_medium_guns2:0 "Canon moyen de la fin de la Seconde Guerre mondiale"
 nsb_medium_guns2_desc:0 "Les canons moyens de la fin de la Seconde Guerre mondiale poursuivent la tendance à l'augmentation du calibre et de la longueur du canon, devenue possible avec l'augmentation de la taille des chars moyens et l'émergence de nouveaux mécanismes de recul. Leur trait caractéristique est la facilité de fabrication, associée à une demande de production en série de réservoirs."
 nsb_medium_guns3:0 "Canon moyen d'après-guerre"
 nsb_medium_guns3_desc:0 "Les canons moyens après la Seconde Guerre mondiale sont en grande partie des améliorations et des développements des modèles précédents, subissant un certain nombre de changements tels que l'ajout d'un évacuateur d'alésage, d'une culasse et d'un canon renforcés, les rendant encore plus puissants et efficaces."
 nsb_medium_guns4:0 "Pistolet MBT du début de la guerre froide"
 nsb_medium_guns4_desc:0 "Les principaux canons de chars de combat apparus au début de la guerre froide n'allaient pas loin en termes de poids, de taille et de calibre par rapport aux canons de chars moyens, mais acquéraient la capacité d'utiliser des projectiles plus puissants et présentaient une balistique améliorée, les rendant comparables aux canons de chars lourds. Une étape importante de cette période est également l'apparition des canons à canon lisse, qui présentaient de nombreux avantages par rapport aux canons rayés traditionnels."
 nsb_medium_guns5:0 "Pistolet MBT de la mi-guerre froide"
 nsb_medium_guns5_desc:0 "Les canons des principaux chars de combat du milieu de la guerre froide se caractérisent par l'utilisation d'un certain nombre d'innovations importantes, telles que des tolérances de courbure plus strictes dans la fabrication des canons et un manchon thermique pour le canon du canon, qui empêche le canon de se déformer en raison des effets inégaux de la température de l'environnement, augmentant ainsi considérablement la précision et la portée de tir. Ces armes ont également été les premières à utiliser un capteur de distorsion du canon qui, en présence d'un système de contrôle de tir, permet de corriger les imprécisions induites par la déformation du canon. Avec ces améliorations, la portée de tir effective approche les 3 kilomètres."
 nsb_medium_guns6:0 "Pistolet MBT de la fin de la guerre froide"
 nsb_medium_guns6_desc:0 "Avec l'amélioration continue de l'armement des chars, le principal canon de char de combat de la fin de la guerre froide a adopté de nombreuses améliorations de conception. Un canon rapidement détachable élimine le besoin de démonter partiellement la tourelle ou la superstructure pour l'entretien du canon. Un alignement amélioré et un meilleur emplacement des dispositifs anti-recul permettent de tirer plus efficacement et sans perte de précision. Ceci, ainsi que des capteurs de courbure de canon améliorés, offrent une portée de tir allant jusqu'à 4 kilomètres."
 nsb_medium_guns7:0 "Pistolet MBT du début de l'époque moderne"
 nsb_medium_guns7_desc:0 "Les premiers canons de chars de combat principaux modernes se caractérisent par une plus grande attention portée à la qualité et à la précision qu'auparavant, rendue possible par l'abandon de l'accent mis sur la production de masse et l'avènement de nouvelles techniques de fabrication. Par exemple, les nouvelles méthodes de chromage des canons augmentent considérablement la durée de vie des armes à canon lisse et rayées, réduisant ainsi l'usure à chaque tir et réduisant ainsi l'effet des tirs répétés sur la précision. Ces améliorations étendent la portée de ces canons à 4,5 kilomètres."
 nsb_medium_guns8:0 "Pistolet MBT moderne"
 nsb_medium_guns8_desc:0 "Les canons des chars de combat principaux modernes continuent d'augmenter leur puissance de feu, grâce à un canon plus long, à l'utilisation de nouveaux matériaux isolants dans le manchon thermique et à une culasse renforcée. Cette augmentation augmente la portée de tir effective à un étonnant 5 kilomètres."
 nsb_medium_guns9:0 "Pistolet MBT moderne avancé"
 nsb_medium_guns9_desc:0 "Les canons de chars de combat principaux modernes et avancés, tout en répondant à des exigences strictes en matière de taille et de poids, ont atteint un sommet en termes de puissance de feu, que ce soit grâce à une augmentation du volume de la chambre, de légères augmentations de calibre, un allongement du canon ou une combinaison de tout cela. Cela a été associé à des dispositifs de contrôle du recul encore plus efficaces. Le champ de tir dépasse tous les canons de char précédents - 7 kilomètres. Cela nécessite toutefois soit des conditions de visibilité idéales, soit l'obtention des données les plus précises sur la localisation de l'ennemi auprès d'autres unités."

 nsb_heavy_guns1:0 "Canon lourd du milieu de la Seconde Guerre mondiale"
 nsb_heavy_guns1_desc:0 "Un canon de char lourd extrêmement puissant, initialement conçu spécifiquement pour les chars lourds au milieu de la Seconde Guerre mondiale. Ces canons étaient généralement développés sur la base de canons de campagne, ce qui leur offrait une longue portée de tir et une excellente pénétration du blindage. Le seul inconvénient de ces armes était la faible cadence de tir due au poids du projectile, le remède consistant à utiliser un chargement de douille séparé."
 nsb_heavy_guns2:0 "Canon lourd de la fin de la Seconde Guerre mondiale"
 nsb_heavy_guns2_desc:0 "Le canon de char lourd de la fin de la Seconde Guerre mondiale est un développement des idées d'un canon de char lourd spécialisé et se distingue par des mécanismes de recul plus avancés et un canon plus long et plus résistant, qui permettait de résister à une pression plus élevée et de tirer des projectiles plus puissants. Ces canons étaient souvent développés sur la base de canons anti-aériens ou navals particulièrement puissants, bien qu'il en existait également des canons spécialement conçus."
 nsb_heavy_guns3:0 "Canon lourd d'après-guerre"
 nsb_heavy_guns3_desc:0 "Le canon de char lourd d'après-guerre a subi plusieurs améliorations, notamment une capacité de survie accrue du canon, un évacuateur d'alésage et, en option, un frein de bouche plus efficace. Comme auparavant, la tâche principale de ces canons était de vaincre tous les types de cibles blindées ennemies à des distances extrêmes."
 nsb_heavy_guns4:0 "Canon lourd du début de la guerre froide"
 nsb_heavy_guns4_desc:0 "Le canon de char lourd du début de la Guerre froide est la dernière tentative visant à maintenir les chars lourds sur le champ de bataille. Encore plus gros et plus puissant qu'un canon de char moyen, il constitue néanmoins un intermédiaire sur la voie d'un canon de char de combat principal aux performances potentiellement égales, faisant du canon de char lourd une option de développement sans issue."
 nsb_heavy_guns5:0 "Premier canon lourd MBT"
 nsb_heavy_guns5_desc:0 "Avec l'avènement de nouvelles technologies de protection, notamment le blindage composite, les éléments NERA et l'ERA capables de diminuer la pénétration des obus APFSDS, les anciens canons de char ont perdu leur avantage. Bien qu'il soit possible d'améliorer les capacités de perçage du blindage de l'obus lui-même pour surmonter ce problème, certains ont proposé une alternative radicale : augmenter considérablement le calibre du canon. Cela augmente considérablement la portée et la pénétration, même en utilisant des projectiles plus anciens. Un canon lourd pour le char de combat principal, même s'il est de dimensions similaires à celles des canons conventionnels, nécessitera le remplacement du chargeur par un chargeur automatique, une réduction de l'approvisionnement en munitions (en raison de la taille plus grande des obus) et ajoutera une charge de maintenance importante. En outre, il est possible que nous entamions une nouvelle course aux armements dans la construction de chars, et que l'ennemi potentiel fasse de même, annulant complètement nos propres efforts pour protéger le char."
 nsb_heavy_guns6:0 "Canon lourd MBT modernisé"
 nsb_heavy_guns6_desc:0 "Contrairement à son prédécesseur, le canon lourd modernisé du char de combat principal est mieux adapté pour être installé dans un char moderne de production en série, sans nécessiter de modifications de conception significatives. La longueur accrue du canon et les mécanismes de suppression du recul plus puissants permettent d'augmenter la puissance de feu sans affecter négativement les performances et le char lui-même."
 nsb_heavy_guns7:0 "Canon lourd MBT avancé"
 nsb_heavy_guns7_desc:0 "Le canon lourd avancé du char de combat principal constitue le summum des canons de char, offrant une puissance de feu inégalée. Grâce à un équilibrage avancé et à une conception modulaire légère, son installation n'a pratiquement aucun effet sur la fiabilité du char dans son ensemble, bien que le problème d'une charge de munitions réduite reste non résolu."

 nsb_superheavy_guns1:0 "Canon super lourd du début de la guerre froide"
 nsb_superheavy_guns1_desc:0 "Un canon antichar monstrueux d'un énorme calibre, doté d'une puissance colossale, capable de pénétrer n'importe quel char de son époque. Cependant, en raison de son poids, de son recul et de son coût énormes, il est peu probable qu'il puisse être installé sur un châssis de char sans sacrifier la fiabilité ou le blindage. Sa cadence de tir extrêmement faible limite également l'utilité de ces armes de grande taille."

 nsb_gun_launcher0:0 "Lanceur Gun-ATGM"
 nsb_gun_launcher0_desc:0 "Le lanceur canon-ATGM est un développement ultérieur de l'idée d'équiper le char d'armes guidées très efficaces, mais avec la préservation de l'armement du char et sans qu'il soit nécessaire de placer l'ATGM à l'extérieur du char. En règle générale, une telle arme avait un gros calibre, mais était en même temps à canon court et à faible vitesse. Cela a permis l'installation sur des véhicules légers, mais n'a pas permis l'utilisation efficace d'obus perforants ordinaires."

 nsb_tank_design:0 "Conception de véhicules de combat"
 nsb_tank_design_desc:0 ""

 nsb_iw_armored_vehicles:0 "Conception de véhicules de combat"
 nsb_iw_armored_vehicles_desc:0 ""

 nsb_light_tanks0:0 "Char léger du milieu de la Seconde Guerre mondiale"
 nsb_light_tanks0_desc:0 "La coque légère d'un véhicule blindé de combat au milieu de la Seconde Guerre mondiale est une conception modifiée qui corrige de nombreuses lacunes antérieures : un système de blindage amélioré, un meilleur emplacement de transmission et des armes plus puissantes. Cependant, sur un champ de bataille dominé par les chars moyens et lourds, le rôle du char léger s'est transformé en un rôle essentiellement de reconnaissance. L'artillerie légère automotrice et les canons de défense aérienne ont été développés à dessein, et le châssis d'un char léger a été utilisé comme base pour unifier les composants et les assemblages. D'autre part, de nombreux véhicules blindés de transport de troupes de cette période sont devenus des plates-formes permettant de placer des armes antichar, anti-aériennes ou d'artillerie."
 nsb_light_tanks1:0 "Char léger de la fin de la Seconde Guerre mondiale"
 nsb_light_tanks1_desc:0 "La coque légère de la fin de la Seconde Guerre mondiale est une conception qui prend en compte toutes les expériences de la guerre, ce qui rend ces modèles plus fiables et techniquement avancés. Dans certains pays, le concept d'une « équipe de combat légère » fait son apparition : une série de véhicules basés sur un seul châssis léger, tels que des canons automoteurs, des chasseurs de chars, des véhicules blindés de dépannage, des canons anti-aériens automoteurs, etc. Cependant, au cours de cette période, très peu de pays ont produit des équipements de ce type, limités uniquement à des projets et des modèles expérimentaux, car la guerre touchait à sa fin, les anciens véhicules blindés de transport de troupes s'acquittaient bien des tâches qui leur étaient assignées et les chars légers dans leur ensemble se montraient mal."
 nsb_light_tanks2:0 "Char léger d'après-guerre"
 nsb_light_tanks2_desc:0 "Après la Seconde Guerre mondiale, avec la chute du statu quo éphémère et fragile, l'intérêt pour les véhicules légers connaît à nouveau un regain d'intérêt. Les chars légers sont développés principalement comme moyen de reconnaissance et de renforcement des forces aéroportées, des armes antichar et d'artillerie automotrices sont créées sur une plate-forme légère. De nombreux pays à travers le monde lancent des programmes de mécanisation massive de l'armée, pour lesquels ils étendent la production de nouveaux véhicules blindés de transport de troupes à roues et à chenilles. Dans le même temps, la base semi-chenillée est abandonnée car peu fiable et remplissant mal le rôle d'un châssis à roues ou à chenilles séparé."
 nsb_light_tanks3:0 "Char léger du début de la guerre froide"
 nsb_light_tanks3_desc:0 "Les véhicules blindés à coque légère du début de la Guerre froide se distinguaient du passé par des exigences croissantes, notamment une mobilité accrue et la capacité de franchir les barrières d'eau. La conception améliorée et la plus grande fiabilité de la coque légère, associées au besoin urgent d'une mécanisation rapide avec des moyens bon marché, ont conduit dans de nombreux pays à la production en série de véhicules blindés de transport de troupes à roues, qui utilisent souvent des pièces provenant de camions conventionnels. Les chars légers et les véhicules qui en dérivent sont utilisés presque exclusivement comme véhicules de reconnaissance ou antichar."
 nsb_light_tanks4:0 "Char léger de la mi-guerre froide"
 nsb_light_tanks4_desc:0 "La coque du véhicule blindé léger du milieu de la Guerre froide est une base polyvalente à roues ou à chenilles pour une variété de tâches. Durant cette période, on assiste à une transition complète vers la création de véhicules légers, destinés uniquement à la reconnaissance ou au soutien des unités aéroportées, tandis que les chars légers sont remplacés dans ce rôle par des véhicules blindés de transport de troupes et des véhicules de combat d'infanterie. Les caractéristiques des véhicules légers, leur faible poids et leur grande transportabilité aérienne sont exploitées au maximum. L'installation d'un ATGM, autrefois facultative, est désormais pratiquement obligatoire pour garantir la capacité à contrer les chars modernes."
 nsb_light_tanks5:0 "Char léger de la fin de la guerre froide"
 nsb_light_tanks5_desc:0 "La coque légère du véhicule blindé de la fin de la Guerre froide constitue un bond en avant qualitatif par rapport aux modèles précédents, utilisant de nombreuses tendances innovantes de son époque. Une conception plus réussie offre une meilleure protection contre les mines et permet l'installation d'une protection blindée plus solide. Les véhicules de cette période se caractérisent également par des expériences plus audacieuses dans l'utilisation de chargeurs automatiques et d'armes de calibre proche des premiers chars de combat principaux."
 nsb_light_tanks6:0 "Char léger moderne"
 nsb_light_tanks6_desc:0 "La coque légère moderne d'un véhicule blindé est développée comme une plate-forme polyvalente polyvalente capable de transporter une plus grande variété d'armes. La conception inclut la possibilité d'installer des éléments composites externes, si nécessaire. Les véhicules de combat d'infanterie de cette période se distinguent par une puissance de combat et une polyvalence accrues, grâce à l'installation de canons automatiques de 40 mm ou plus. Les véhicules légers de cette période se distinguent par la large diffusion de plates-formes à roues bien protégées, capables de transporter des armes comparables au calibre d'un char de combat principal, ce qui était auparavant unique pour les véhicules blindés à chenilles. Une telle « renaissance des roues » est associée à la fois à de nouvelles capacités techniques permettant de supporter de lourdes charges sur le châssis à roues et à des exigences accrues en matière de vitesse des véhicules blindés de combat."
 nsb_light_tanks7:0 "Char léger moderne"
 nsb_light_tanks7_desc:0 "La coque légère et moderne d'un véhicule blindé est une plate-forme universelle bien formée, conçue dès le départ dans le cadre d'une guerre réseau-centrée, ce qui pose de nouvelles exigences en matière de conception, de capacités et de remplissage interne. L'une des caractéristiques distinctives est la conception modulaire et le placement des armes, qui offrent une flexibilité tactique et stratégique. Les véhicules de combat légers de cette période suivent en grande partie le concept de guerre de faible intensité, ce qui implique une mobilité élevée et des armes optimales pour leurs tâches, tandis que les chars de combat principaux traditionnels sont très médiocres dans le premier cas et redondants dans le second."
 nsb_light_tanks8:0 "Char léger moderne avancé"
 nsb_light_tanks8_desc:0 "Une coque légère moderne et avancée est le couronnement des véhicules blindés de combat légers, bien qu'ils puissent être qualifiés de « légers » avec un certain étirement : leur masse, leur protection et même leurs armes sont comparables aux derniers chars moyens ou aux premiers chars de combat principaux, la principale différence réside dans les solutions et matériaux techniques avancés, ainsi que leur utilisation dans le rôle d'un char léger ou la création d'un véhicule de combat d'infanterie et d'un véhicule blindé de transport de troupes basé sur eux. Les principales exigences pour les chars légers de cette période sont la vitesse élevée, la mobilité et la capacité de cross-country, et pour les véhicules blindés de transport de troupes et les véhicules de combat d'infanterie, la protection maximale de l'équipage et des troupes."

 nsb_main_battle_tanks0:0 "Char moyen au milieu de la Seconde Guerre mondiale"
 nsb_main_battle_tanks0_desc:0 "Les chars moyens du milieu de la Seconde Guerre mondiale sont une combinaison d'expérience de plusieurs années de guerre et de demandes très spécifiques. Le concept d'un char moyen va de celui produit en série et facile à entretenir, à celui proche en termes de blindage et de complexité d'un char lourd, en fonction du pays du fabricant et de sa doctrine de char. Les chars moyens de cette période se distinguent également par l'introduction d'innovations techniques et d'armes plus puissantes, et leur blindage incliné est devenu une exigence presque indispensable."
 nsb_main_battle_tanks1:0 "Char moyen de la fin de la Seconde Guerre mondiale"
 nsb_main_battle_tanks1_desc:0 "Le char moyen de la fin de la Seconde Guerre mondiale incarne toute son expérience et les caractéristiques les plus importantes exigées pendant la guerre : simplicité, fiabilité et bon marché. Les véhicules de cette période sont nettement supérieurs à leurs prédécesseurs en termes de protection et d'armement, mais dans ces indicateurs, ils sont encore loin des chars lourds. Le blindage incliné, devenu un standard indéniable, et de nombreux autres principes mis en oeuvre dans ces chars constitueront la base du futur char de combat principal."
 nsb_main_battle_tanks2:0 "Char moyen d'après-guerre"
 nsb_main_battle_tanks2_desc:0 "Le char moyen après la Seconde Guerre mondiale constitue le développement ultime du noyau de la force blindée. Correspondant étroitement à la protection et à l'armement des chars lourds, tout en conservant les avantages économiques et de fiabilité des chars moyens. Diverses innovations sont installées sur les chars de cette période, comme des calculateurs balistiques et des télémètres optiques. Ces chars constituent le développement culminant du concept de char moyen et sont les derniers du genre au sens traditionnel du terme."
 nsb_main_battle_tanks3:0 "CCP de première génération"
 nsb_main_battle_tanks3_desc:0 "La question de la définition du terme char de combat principal est plutôt compliquée : la définition même du char principal existait avant même la Seconde Guerre mondiale et les chars moyens constituaient la base des forces blindées pendant et après la Seconde Guerre mondiale, ce qui en faisait les principaux de facto. Cependant, les chars de cette période particulière sont devenus la première génération de chars de combat principaux : ils ont été initialement développés comme véhicules de combat universels, combinant les meilleures qualités des chars moyens et lourds, capables d'accomplir les tâches des deux. De plus, les chars de cette période furent les premiers à recevoir un blindage combiné, des chargeurs automatiques et des télémètres laser."
 nsb_main_battle_tanks4:0 "CCP de première génération +"
 nsb_main_battle_tanks4_desc:0 "Chars de combat principaux de première génération considérablement modernisés, bien conçus et plus fiables, avec correction des défauts de la première génération, mieux adaptés à l'installation de systèmes de contrôle, d'armes et de blindages combinés de nouvelle génération, avec un grand potentiel de modernisation ultérieure. En outre, les réservoirs de cette époque sont devenus les premiers produits en série, sur lesquels un moteur à turbine à gaz a été installé comme moteur de propulsion principal."
 nsb_main_battle_tanks5:0 "CCP de deuxième génération"
 nsb_main_battle_tanks5_desc:0 "Le char de combat principal de la deuxième génération constitue une avancée qualitative dans la construction de chars. Sa conception et ses sous-systèmes supposent initialement l'installation d'optiques modernes, notamment le viseur panoramique du commandant, et d'électronique numérique. Une caractéristique distinctive de cette génération de chars est une protection considérablement accrue grâce à l'utilisation d'un nouveau type de blindage combiné - un blindage réactif non explosif - ainsi que de systèmes conçus pour augmenter considérablement la capacité de survie du char, tels que des panneaux anti-éruption."
 nsb_main_battle_tanks6:0 "CCP de deuxième génération et plus"
 nsb_main_battle_tanks6_desc:0 "Le char de combat principal de la deuxième génération de modernisation en profondeur est encore plus doté d'électronique et fait le premier pas vers le char de guerre moderne centrée sur les réseaux. Parmi les innovations, il y a la possibilité d'installer un blindage modulaire composite ou réactif non explosif, ce qui simplifie grandement la réparation et la maintenance, et offre également un profond potentiel de modernisation."
 nsb_main_battle_tanks7:0 "CCP de troisième génération"
 nsb_main_battle_tanks7_desc:0 "Le char de combat principal de troisième génération a été développé dès le début dans le contexte de la doctrine de la guerre réseau-centrée, ce qui en fait un adversaire redoutable pour toutes les cibles terrestres sur le champ de bataille. Dans sa conception, la possibilité d'installer un canon de calibre accru, ainsi qu'un chargeur automatique, s'il n'est pas installé initialement, est prévue à l'avance. La protection comprend un blindage modulaire composite ou réactif non explosif, un blindage réactif explosif intégré, ainsi qu'un système de protection active, ce qui fait des chars de cette génération l'un des plus protégés et des plus sûrs pour l'équipage dans l'histoire de la construction de chars."
 nsb_main_battle_tanks8:0 "CCP de troisième génération et plus"
 nsb_main_battle_tanks8_desc:0 "La troisième génération modernisée de chars de combat principaux, dans laquelle les dernières avancées de ces dernières années en matière d'électronique, une capsule d'équipage isolée, un chargeur automatique et un système de protection active sont indispensables. D'une certaine manière, les chars de combat principaux de cette génération représentent les derniers chars avec équipage en soi, car la quatrième génération suivante sera probablement composée de véhicules de combat sans équipage, télécommandés ou entièrement autonomes."

 nsb_heavy_tanks0:0 "Char lourd du milieu de la Seconde Guerre mondiale"
 nsb_heavy_tanks0_desc:0 "Une coque de char lourd de mi-guerre construite autour d'un blindage épais et de canons lourds, adaptée aux rôles de percée et d'assaut au détriment de la vitesse, des efforts de production et de la logistique."
 nsb_heavy_tanks1:0 "Char lourd de la fin de la Seconde Guerre mondiale"
 nsb_heavy_tanks1_desc:0 "Une coque de char lourd de la fin de la guerre représentant le summum de la conception de char lourd traditionnel, avec une protection extrême et une puissance de feu limitée par le coût et la mobilité."
 nsb_heavy_tanks2:0 "Char lourd d'après-guerre"
 nsb_heavy_tanks2_desc:0 "Une coque de char lourd d'après-guerre raffinée par l'expérience de la guerre, de plus en plus poussée vers des fonctions antichar à mesure que le concept de char lourd commence à vieillir."
 nsb_heavy_tanks3:0 "Char lourd du début de la guerre froide"
 nsb_heavy_tanks3_desc:0 "Une coque de char lourd du début de la Guerre froide utilisant un contrôle de tir, une stabilisation et des canons puissants améliorés, mais de plus en plus vulnérable aux missiles et à la guerre interarmes moderne."

 nsb_nsb_heavy_tanks0:0 "Char lourd du milieu de la Seconde Guerre mondiale"
 nsb_nsb_heavy_tanks0_desc:0 "Le char lourd du milieu de la Seconde Guerre mondiale est un adversaire bien plus redoutable que son prédécesseur, doté d'un blindage encore plus épais et capable d'utiliser des canons lourds spécialement conçus. Sa puissance de feu dévastatrice peut détruire presque tous les autres chars de cette période à de grandes distances, et son blindage peut résister à n'importe quel calibre sauf le sien. La création de canons d'assaut automoteurs s'est généralisée, pour lesquels une coque lourde est excellente. Plusieurs bataillons de ces véhicules dans une direction stratégique pourraient bien faire pencher la balance des forces en leur faveur, tant en défense qu'en attaque."
 nsb_nsb_heavy_tanks1:0 "Char lourd de la fin de la Seconde Guerre mondiale"
 nsb_nsb_heavy_tanks1_desc:0 "La fin de la Seconde Guerre mondiale constitue l'apogée du développement des chars lourds. Véhicules de combat énormes, lourds et puissants aux paramètres extrêmes - dont la limite de développement n'est que les possibilités de logistique et de production - ces chars sont plutôt une démonstration de la puissance industrielle et technique des États qui les produisent. Cependant, les chars lourds et les véhicules basés sur leurs châssis constituent toujours une menace sérieuse sur le champ de bataille et constituent une force avec laquelle il faut compter."
 nsb_nsb_heavy_tanks2:0 "Char lourd d'après-guerre"
 nsb_nsb_heavy_tanks2_desc:0 "Le char lourd d'après-guerre est un véhicule de combat plus fiable, modifié en tenant compte de l'expérience de la Seconde Guerre mondiale. Cependant, malgré ses qualités positives, le char de cette période est confronté à un certain renversement de rôle - puisque dans la guerre moderne, il n'y aura guère de positions statiques fortement fortifiées, pour l'assaut desquelles les anciens chars lourds ont été créés, les nouveaux seront principalement affectés au rôle antichar, ce qui indique le début de l'obsolescence de la doctrine des chars lourds en tant que telle. "
 nsb_nsb_heavy_tanks3:0 "Char lourd du début de la guerre froide"
 nsb_nsb_heavy_tanks3_desc:0 "Le char lourd du début de la Guerre froide est une sorte de tentative soit de rappeler les premiers développements, soit d'en créer un nouveau, plus pertinent. Un char lourd de cette période est souvent équipé de diverses innovations techniques et de solutions originales augmentant considérablement les capacités de combat, comme un stabilisateur à deux plans, un télémètre optique ou encore un ordinateur balistique, et des modifications ont été apportées à la conception de la coque qui permet de les mettre en oeuvre sans perte de fiabilité. Cependant, les chars lourds du début de la guerre froide ont largement partagé le sort des cuirassés : trop chers, plutôt lents, difficiles à entretenir et, surtout, très vulnérables aux nouveaux types d'armes à missiles, dont une simple augmentation du blindage n'aide pas, et sont donc devenus une branche de développement sans issue. Les derniers modèles sont toujours capables d'emporter les canons de char les plus puissants, mais il est déjà évident pour beaucoup que l'ère des monstres blindés terrestres, ainsi que marins, touche à sa fin."

 nsb_ifv:0 "IFV"
 nsb_ifv_desc:0 "Avec le développement des armes offensives et l'augmentation de la mécanisation de l'armée, le besoin s'est fait sentir d'un nouveau véhicule blindé capable non seulement de transporter en toute sécurité l'infanterie sur le champ de bataille, mais également de la soutenir directement par le feu, tout en étant capable de détruire les véhicules blindés légers ennemis. Cela a conduit à l'émergence des véhicules de combat d'infanterie. Les premiers véhicules de cette classe ne s'éloignaient pas beaucoup des véhicules blindés de transport de troupes conventionnels et n'étaient armés que d'un canon automatique, se différenciant principalement par la manière dont ils étaient utilisés. Cependant, au fil du temps, les véhicules de combat d'infanterie deviendront une classe de véhicules blindés indépendante à part entière, équipée d'armes plus puissantes et d'un blindage solide."
 nsb_heavy_apc:0 "Véhicule blindé lourd"
 nsb_heavy_apc_desc:0 "Avec le développement de la construction de chars et l'émergence de nouveaux modèles de véhicules blindés plus avancés, les anciens chars, produits en grandes quantités, deviennent rapidement obsolètes et faibles. Pour économiser de l'argent, des ressources et du temps, nous pouvons commencer à convertir d'anciens chars de combat moyens et principaux en véhicules blindés de transport de troupes, créant ainsi une nouvelle classe lourde de véhicules de transport d'infanterie invulnérables à l'armement de la plupart des véhicules de combat d'infanterie et élargissant les capacités offensives et défensives."
 nsb_heavy_ifv:0 "VCI lourd"
 nsb_heavy_ifv_desc:0 "Sur le champ de bataille moderne, avec la puissance encore accrue des véhicules blindés de combat et la large disponibilité des ATGM, il n'y a pas de place pour les véhicules de combat d'infanterie traditionnels d'une catégorie de poids comparable aux chars légers. Nous avons besoin de nouveaux véhicules de combat d'infanterie basés sur un châssis de char qui ne soient pas inférieurs en termes de blindage aux chars de combat principaux modernes et qui soient capables d'opérer en ligne avec eux. De plus, le châssis d'un tel char est créé de manière universelle, ce qui permet la production d'une large gamme d'équipements unifiés, tels que des véhicules blindés de transport de troupes lourds, des véhicules de combat d'infanterie et des pièces d'artillerie automotrices."

 nsb_engines:0 "Moteurs à combustion de la Seconde Guerre mondiale"
 nsb_engines_desc:0 "Les moteurs de chars du début de la Seconde Guerre mondiale sont généralement représentés par des moteurs à essence ou diesel à carburateur d'avion, de tracteur et parfois même d'automobile, adaptés pour être utilisés dans des véhicules blindés avec des modifications de conception minimes, ce qui est dû à leur grande disponibilité et à leur production de masse par l'industrie civile. Bien qu'il y ait eu des tentatives pendant la guerre pour développer des moteurs à part entière, spécialement conçus, ils se sont généralement soldés par des conceptions peu fiables en raison d'une technologie insuffisamment développée ou de l'impossibilité de leur production en série en raison des limites de l'industrie de guerre."
 nsb_engines0:0 "Moteurs à combustion d'après-guerre"
 nsb_engines0_desc:0 "Les moteurs d'après-guerre pour véhicules blindés représentent la quintessence de toute l'expérience de construction de moteurs de la Seconde Guerre mondiale, ainsi que la mise en oeuvre d'idées et d'améliorations qui n'étaient pas disponibles pendant la guerre : carter moteur et chauffage à l'huile intégrés, permettant un démarrage plus rapide du moteur à basse température, des dimensions plus petites, ainsi que des générateurs électriques plus efficaces, permettant d'alimenter de nouveaux sous-systèmes de réservoirs consommateurs d'énergie. De plus, les moteurs (notamment ceux destinés à être installés dans des chars lourds) peuvent être équipés de compresseurs, ce qui permet d'obtenir plus de puissance tout en conservant les mêmes dimensions et poids du moteur."
 nsb_engines1:0 "Moteurs à combustion du début de la guerre froide"
 nsb_engines1_desc:0 "Au début de la guerre froide, l'escalade de la confrontation mondiale avait considérablement augmenté le nombre de véhicules actifs dans les armées du monde entier, allant des camions et véhicules blindés de transport de troupes aux chars et canons automoteurs, ce qui a entraîné une forte augmentation de la consommation de carburant et une augmentation de la charge logistique. Cela a marqué un abandon généralisé des moteurs à essence, qui avaient été largement installés sur les véhicules blindés auparavant, et une transition vers des moteurs diesel multicarburants capables de fonctionner avec de nombreux types de carburant."
 nsb_engines2:0 "Moteurs à combustion au milieu de la guerre froide"
 nsb_engines2_desc:0 "Au milieu de la guerre froide, les exigences en matière de fiabilité et de puissance des moteurs augmentaient continuellement en raison du développement de canons plus puissants, de l'installation de sous-systèmes plus énergivores et de la perspective d'un blindage combiné plus lourd. Les moteurs diesel et essence ont reçu de nombreuses améliorations, même si ces derniers ont largement atteint la limite de la modernisation, entraînant un déclin rapide de leur popularité."
 nsb_engines3:0 "Moteurs à combustion de la fin de la guerre froide"
 nsb_engines3_desc:0 "Le moteur diesel de la fin de la guerre froide combine des technologies de moteur éprouvées qui offrent d'une part un coût raisonnable, une fabricabilité et une fiabilité élevées, et des solutions de conception innovantes telles que le rapport optimal entre le diamètre et la course du piston, un système de refroidissement à double circuit et un système électronique de contrôle et de surveillance automatique, qui ont permis de réduire d'un tiers les dimensions du moteur, d'élargir la plage de température ambiante de -40 à +50 degrés Celsius et d'augmenter considérablement la période entre les maintenances obligatoires."

 nsb_gt_engines0:0 "Moteurs à turbine à gaz du début de la guerre froide"
 nsb_gt_engines0_desc:0 "Le moteur à turbine à gaz en tant que groupe motopropulseur adapté à une installation dans des véhicules blindés est apparu au début de la guerre froide, bien que les premières idées remontent au milieu de la Seconde Guerre mondiale, lorsque l'utilisation active des moteurs à turbine à gaz a commencé. Techniquement, il s'agit d'une adaptation presque directe d'un moteur d'aviation (généralement d'hélicoptère), avec des modifications minimes permettant de l'installer dans un véhicule de combat terrestre. Les avantages d'un tel moteur étaient la légèreté, la puissance et la vitesse énormes, l'absence de système de refroidissement externe, les capacités multi-carburants et la capacité de démarrer rapidement dans toutes les conditions climatiques. Cependant, ces moteurs sont plusieurs fois plus chers que les moteurs diesel, consomment beaucoup plus de carburant et présentent également des problèmes de fiabilité en raison d'une consommation d'air plus élevée et d'exigences plus strictes en matière de filtration de l'air."
 nsb_gt_engines1:0 "Moteurs à turbine à gaz de la guerre froide"
 nsb_gt_engines1_desc:0 "Le moteur à turbine à gaz du milieu de la Guerre froide est un moteur à part entière spécialement conçu pour être utilisé dans les véhicules blindés, plutôt qu'une simple adaptation d'une conception standard, qui élimine un certain nombre de problèmes inhérents aux modèles plus anciens. L'un de ces problèmes était l'usure rapide des aubes de la turbine, due à l'excès de poussière présent dans l'air. Pour minimiser son impact, des filtres puissants à plusieurs étages ou des systèmes plus compacts de nettoyage par vibration et de buses à purge forcée sont utilisés."
 nsb_gt_engines2:0 "Moteurs à turbine à gaz de la fin de la guerre froide"
 nsb_gt_engines2_desc:0 "Le moteur à turbine à gaz de la fin de la Guerre froide constitue à bien des égards une amélioration par rapport à la génération précédente. Parmi ces améliorations figurent un système de filtrage de l'air plus fiable et plus simple, une durée de vie accrue du moteur grâce au renforcement des pièces les plus chargées, et une plus grande efficacité grâce aux changements dans l'équipement de contrôle du carburant et à l'ajout d'un mode de ralenti spécial, qui réduit l'alimentation en carburant lorsque le véhicule ne bouge pas."
 nsb_gt_engines3:0 "Moteurs à turbine à gaz modernes"
 nsb_gt_engines3_desc:0 "Un moteur à turbine à gaz moderne se distingue par des matériaux aux caractéristiques et à la qualité exceptionnelles, augmentant considérablement la fiabilité et la résistance à l'usure, ainsi que par des systèmes de contrôle numérique du carburant avancés qui répondent de manière flexible aux conditions changeantes de fonctionnement du moteur et permettent de réduire davantage la consommation de carburant et d'augmenter l'efficacité au ralenti. Le prix correspond aux caractéristiques du moteur."

 nsb_hybrid_engines:0 "Propulsion hybride diesel-électrique"
 nsb_hybrid_engines_desc:0 "La propulsion hybride diesel-électrique est une combinaison d'un moteur diesel et d'un moteur-générateur, unis par une transmission électromécanique compacte mais plutôt coûteuse, fournissant à la fois une propulsion conventionnelle et électrique (alias hybride série-parallèle). Ce système permet d'importantes économies de carburant : à des vitesses élevées, le moteur diesel est utilisé et le moteur-générateur est utilisé pour le freinage par récupération et la charge des batteries ; le moteur-générateur fonctionne à basse vitesse, préservant la durée de vie du moteur diesel sans consommer de carburant, et réduisant également le bruit et la signature thermique au minimum. De plus, en cas de panne du moteur diesel, le moteur-générateur peut être alimenté par une batterie ou un groupe auxiliaire de puissance - si disponible - et retirer le char endommagé de la bataille. Cependant, produire un système de propulsion hybride nécessite l'utilisation de composants électroniques complexes et des quantités importantes de métaux non ferreux pour le générateur et les batteries, ce qui le rend très coûteux par rapport aux systèmes traditionnels."

 nsb_armor:0 "Conception de véhicules de combat"
 nsb_armor_desc:0 "Avec l'avènement de l'ère des chars, la course aux blindés et aux projectiles a commencé. Les véhicules blindés, qui étaient autrefois suffisants pour résister aux balles et aux éclats d'obus, doivent résister aux tirs directs d'obus perforants spécialement conçus pour y faire face. Cela nécessite de développer de nouvelles méthodes ou d'adapter des méthodes existantes pour fabriquer le blindage de coque. De nombreuses méthodes de création d'une coque de char et de fixation de plaques de blindage sont empruntées à la construction navale, où le rivetage et le soudage sont utilisés depuis des années pour relier des plaques de blindage épaisses."

 nsb_armor0:0 "Soudage de plaques épaisses et coulée complexe"
 nsb_armor0_desc:0 "Les avancées de l'industrie permettent de réduire le coût, de simplifier, d'accélérer, voire d'automatiser les processus associés à la fabrication des blindages pour véhicules terrestres. Si auparavant il était techniquement difficile, voire impossible, de créer un blindage ou une coque d'une certaine épaisseur et taille, il n'existe désormais pratiquement plus de telles restrictions. À l'exception des limitations générales des voies ferrées, de la capacité de charge des ponts, de la densité du revêtement routier et d'autres bagatelles logistiques."
 nsb_armor1:0 "Première armure composite"
 nsb_armor1_desc:0 "Les premiers blindages composites sont conçus pour augmenter la protection du char, principalement contre les obus HEAT, en utilisant différentes charges prises en sandwich entre deux plaques d'acier, comme de la silice fondue ou de l'aluminium. Bien que ces charges présentent un certain nombre de problèmes, tels qu'une faible résistance aux impacts multiples et la complexité de la fabrication et de la réparation, ce qui les rend quelque peu peu pratiques, elles atteignent néanmoins l'objectif d'augmenter la sécurité des véhicules blindés."
 nsb_armor2:0 "Armure composite avancée"
 nsb_armor2_desc:0 "Le blindage composite avancé, contrairement aux versions précédentes, utilise des charges améliorées et plus pratiques, telles que de la fibre de verre, du sable céramique ou des tiges de quartz, du corindon ou des billes de céramique, et aura une résistance décente non seulement aux obus HEAT mais également aux obus cinétiques perforants. De plus, une telle armure a le potentiel d'être construite en ajoutant davantage de couches d'acier et de remplissage pour augmenter considérablement la protection."
 nsb_armor3:0 "NERA de première génération"
 nsb_armor3_desc:0 "Le blindage réactif non explosif (NERA) est apparu comme un développement ultérieur de l'idée du blindage combiné - un blindage multicouche avec des couches de différents matériaux. Mais dans une telle armure, il existe un certain nombre de différences importantes par rapport aux types précédents : premièrement, elle est constituée d'un nombre beaucoup plus grand d'éléments, constitués de couches minces, formant un réseau ; d'autre part, chaque élément réagence deux plaques, en céramique ou en acier trempé, entre lesquelles se trouve un élément élastique (élastomère), tel que du caoutchouc, du plastique, du nylon, etc. ; troisièmement, le principe de fonctionnement d'un tel blindage diffère considérablement du blindage combiné conventionnel - lorsqu'un projectile cinétique ou HEAT frappe la plaque extérieure, un puissant choc à grande vitesse se forme, gonflant le matériau élastique qui repousse la plaque, déformant et détruisant le noyau ou le jet perforant. Une telle armure offre la meilleure protection mais elle est très volumineuse, lourde et coûteuse."
 nsb_armor4:0 "NERA de deuxième génération"
 nsb_armor4_desc:0 "Grâce à la modélisation informatique, aux simulations et aux tests avancés sur le terrain, la deuxième génération de blindages réactifs non explosifs a reçu un agencement plus optimal des ensembles de blindages, et les progrès de la science des matériaux ont permis de sélectionner des matériaux élastiques avec une réactivité plus élevée, ce qui permet une augmentation significative des performances."
 nsb_armor5:0 "NERA moderne de troisième génération"
 nsb_armor5_desc:0 "Le développement ultérieur de la théorie et de la pratique de la science des matériaux a permis de créer le NERA de troisième génération. L'utilisation de combinaisons plus complexes de plaques de blindage, de doublures et d'élastomères, ainsi que l'utilisation de nouveaux matériaux plus exotiques tels que le carbure de bore, le carbure de silicium ou les alliages de titane, rendent ce blindage encore plus résistant que la génération précédente."
 nsb_armor6:0 "NERA moderne de quatrième génération"
 nsb_armor6_desc:0 "Dans la quatrième génération de NERA, les dernières innovations permettent une augmentation sans précédent de la protection des véhicules blindés : l'utilisation de résines thermoplastiques comme élément adoucissant permet une résistance accrue aux coups multiples, et l'utilisation des derniers polymères à haute réactivité, associés à une combinaison d'acier nanocristallin et de nanocéramique, peuvent arrêter même les projectiles APFSDS les plus modernes, sans parler des HEAT. Soit dit en passant, le poids d'une telle armure est également sans précédent. Il est temps de renforcer les ponts routiers publics."

 nsb_du_armor0:0 "NERA basé sur DU de deuxième génération"
 nsb_du_armor0_desc:0 "Grâce à la modélisation informatique, aux simulations et aux tests avancés sur le terrain, la deuxième génération de blindages réactifs non explosifs a reçu une disposition plus optimale des ensembles de blindages, et les progrès de la science des matériaux ont permis de sélectionner des matériaux élastiques avec une réactivité plus élevée. L'utilisation d'alliages d'uranium appauvri comme principal élément de protection dans les ensembles de blindages rend ces blindages encore plus résistants, au prix d'une augmentation significative de leur poids."
 nsb_du_armor1:0 "NERA basé sur DU de troisième génération"
 nsb_du_armor1_desc:0 "Le développement ultérieur de la théorie et de la pratique de la science des matériaux a permis de créer le NERA de troisième génération. L'utilisation de combinaisons plus complexes de plaques de blindage, de revêtements et d'élastomères, ainsi que l'utilisation de nouveaux alliages d'uranium appauvri, rendent ce blindage encore plus résistant que la génération précédente. En raison de l'utilisation d'alliages d'uranium appauvri plus lourds, un tel blindage est nettement plus lourd que le NERA conventionnel."
 nsb_du_armor2:0 "NERA basé sur DU de quatrième génération"
 nsb_du_armor2_desc:0 "Dans la quatrième génération de NERA, les dernières innovations permettent une augmentation sans précédent de la protection des véhicules blindés : l'utilisation de résines thermoplastiques comme élément adoucissant permet une résistance accrue aux coups multiples, et l'utilisation des derniers polymères à haute réactivité, associés à une combinaison d'alliages d'uranium appauvri et de nanocéramiques, peuvent arrêter même les projectiles APFSDS les plus modernes, sans parler des HEAT. Soit dit en passant, le poids d'une telle armure est également sans précédent. Il est temps de renforcer les ponts routiers publics."

 nsb_era0:0 "ERA de première génération"
 nsb_era0_desc:0 "Avec la diffusion toujours plus répandue de lance-grenades antichar bon marché et abordables et de munitions guidées dotées d'ogives HEAT, la recherche de nouveaux moyens non standard de protection des véhicules blindés est redevenue pertinente. L'une de ces méthodes était le blindage réactif explosif (ERA), qui est un petit conteneur avec une ou deux plaques explosives situées entre des plaques d'acier, selon la conception. Lorsqu'un projectile HEAT touche le conteneur, une détonation se produit, déstabilisant le jet pénétrant, et une plaque d'acier est projetée vers le jet, traversant sa trajectoire et finalement l'arrêtant, ou la déformant suffisamment pour qu'elle ne pénètre pas dans le blindage principal. La protection ERA de première génération est légère, très bon marché et offre une protection sérieuse contre les projectiles HEAT, mais est presque totalement inutile contre les projectiles à pénétrateur cinétique. Bien que des expériences de contre-explosions comme moyen de lutter contre le jet perforant des obus HEAT aient été menées à la fin des années 40 et au début des années 50, l'imperfection de la technologie et le conservatisme rigide de l'armée ont longtemps relégué ces idées au placard jusqu'à ce que leur exactitude soit prouvée dans la pratique."
 nsb_era1:0 "ERA de deuxième génération"
 nsb_era1_desc:0 "La deuxième génération d'ERA a reçu un certain nombre d'améliorations significatives qui ont éliminé bon nombre des défauts de la génération précédente : la forme améliorée des conteneurs de protection permet une protection plus uniforme du véhicule de combat sans créer de zones d'affaiblissement, et une plaque de projectile plus épaisse, associée à des explosifs plus puissants, permet un certain degré de protection même contre les munitions à pénétrateur cinétique. Le poids d'un ensemble de protections ERA a augmenté, mais le coût reste à des niveaux acceptables."
 nsb_era2:0 "ERA de troisième génération"
 nsb_era2_desc:0 "La troisième génération d'ERA se distingue par une grande variété de conceptions originales qui peuvent augmenter encore plus la sécurité des véhicules de combat et résister aux nouvelles menaces, mais elles présentent un certain nombre de caractéristiques communes : une conception modulaire, permettant aux conteneurs ERA d'être facilement remplacés sur le terrain ou même installés en plusieurs couches les unes sur les autres ; isolation contre les explosions de chaque élément de protection, obtenue en réduisant les explosifs utilisés, en garantissant la non-propagation des explosions et la destruction des éléments adjacents ; et la capacité d'arrêter les projectiles tandem HEAT. Ce dernier est obtenu soit en ajoutant une deuxième plaque de lancement, qui est envoyée à l'opposé de la première, après le jet pénétrant ou le pénétrateur cinétique, les déstabilisant encore plus, soit en utilisant une nouvelle conception avec des charges creuses linéaires, qui tirent séquentiellement et coupent le pénétrateur ou le jet en morceaux."
 nsb_era3:0 "ERA de quatrième génération"
 nsb_era3_desc:0 "La quatrième génération d'ERA constitue l'apogée du développement (actuellement en tout cas) de ce type de protection externe et utilise le principe de détonation sans contact - c'est-à-dire que l'élément ERA ne se déclenche pas lorsque la munition entre en contact direct avec elle, mais lorsqu'un capteur de détection passif est déclenché, envoyant un signal à un ou plusieurs éléments de protection situés sur la trajectoire d'approche de la munition. Un tel capteur peut être une bobine d'inductance qui perçoit la force électromotrice induite par un projectile en approche et envoie un signal pour déclencher l'élément de protection lorsque le projectile est encore à une certaine distance, ce qui permet de l'endommager et de le déstabiliser avant son contact avec le blindage principal."

 nsb_al_armor0:0 "Première armure en alliage d'aluminium"
 nsb_al_armor0_desc:0 "La décision d'utiliser l'aluminium comme matériau de blindage est intervenue suite à la recherche d'améliorer la protection des véhicules blindés légers et de réduire le poids, ce qui est particulièrement important pour les véhicules qui doivent être aéroportés ou amphibies. De plus, il a été constaté que l'aluminium possède plusieurs autres propriétés favorables : une résistance élevée à la corrosion ; bonne soudabilité; une rigidité plusieurs fois supérieure à celle de l'acier, qui permet de se passer de châssis porteur lors de la création de véhicules blindés légers à peau fine ; bien que l'aluminium soit encore moins durable que l'acier, en raison de sa densité trois fois inférieure, il est possible de fabriquer un blindage plus épais avec une plus grande capacité d'arrêt tout en conservant le même poids. Ces caractéristiques entraînent un coût plus élevé pour l'aluminium que pour l'acier. Les premiers blindages en aluminium sont généralement représentés par un alliage aluminium-magnésium-manganèse non renforcé thermiquement ou par d'autres alliages, souvent empruntés à l'industrie aéronautique."
 nsb_al_armor1:0 "Armure avancée en alliage d'aluminium"
 nsb_al_armor1_desc:0 "Des alliages d'aluminium plus avancés, tels que l'aluminium-zinc-magnésium, spécialement conçus pour une utilisation dans les blindages. Grâce au renforcement thermique et à une composition améliorée d'additifs d'alliage, la dureté et la résistance de ces alliages ont considérablement augmenté - contrairement aux échantillons précédents, qui n'étaient capables de résister qu'à des fragments, des balles de petit et de gros calibre, ceux-ci peuvent fournir une résistance décente aux projectiles de canon automatique, avec une épaisseur suffisante bien sûr."

 nsb_defenses0:0 "Système de générateur de fumée de moteur"
 nsb_defenses0_desc:0 "Le système générateur de fumée du moteur (ESS) est un dispositif simple et peu coûteux pour installer des écrans de fumée, fonctionnant sur le principe de l'injection de carburant dans le collecteur d'échappement chaud du moteur et de la libération de ce mélange dans l'atmosphère, où se produisent la condensation et la formation d'un écran de fumée. Cependant, un tel système dépend directement du fonctionnement actif du moteur, car un moteur au ralenti ne crée pas d'échappement suffisamment chaud et ne peut donc être utilisé que lorsque le véhicule est en mouvement. De plus, l'ESS consomme une quantité décente de carburant lorsqu'il est utilisé."
 nsb_defenses1:0 "Déchargeurs de grenades fumigènes améliorés"
 nsb_defenses1_desc:0 "Un lance-grenades fumigènes amélioré, créé en réponse à des menaces plus graves sur le champ de bataille, telles que les armes guidées antichar largement répandues. Les principaux avantages sont l'amélioration de l'emplacement des lance-grenades et, surtout, un composant générateur de fumée plus intense à base de phosphore rouge et de caoutchouc butyle, produisant un écran de fumée plus dense et plus rapide qu'auparavant. De plus, le déploiement instantané d'un écran de fumée est possible grâce à la détonation des grenades directement dans l'air, obtenue grâce à un élément de retard dans la fusée, ce qui distingue avantageusement ce système des modèles précédents, où, après le tir des grenades fumigènes, il fallait un certain temps avant qu'un volume de fumée suffisant ne se forme pour cacher le véhicule de combat."
 nsb_defenses2:0 "Déchargeurs de grenades fumigènes IR"
 nsb_defenses2_desc:0 "La prolifération des armes antichar à guidage infrarouge, ainsi que l'avènement des caméras thermiques capables de voir à travers un écran de fumée conventionnel, ont nécessité une amélioration des caractéristiques des grenades fumigènes. L'ajout de paillettes de laiton, qui possèdent des capacités de réflexion élevées dans le spectre infrarouge, permet à la fois de dissiper la signature infrarouge d'un véhicule de combat et de perturber les armes à guidage infrarouge."
 nsb_defenses3:0 "Déchargeurs de grenades fumigènes multispectrales"
 nsb_defenses3_desc:0 "L'expansion des méthodes de détection et de destruction des véhicules de combat a nécessité une amélioration encore plus significative des lance-grenades fumigènes. Associé aux améliorations existantes, l'ajout de paillettes métalliques ou en fibre de verre métallisées, qui perturbent les systèmes de détection et de ciblage basés sur les radars, permet de couvrir de manière fiable le véhicule de combat avec un écran de fumée multispectral."
 nsb_defenses4:0 "Déchargeurs de grenades fumigènes intelligents"
 nsb_defenses4_desc:0 "Les derniers lance-fumées combinent les meilleures réalisations techniques, telles que des servos précis et leurs propres capteurs indépendants, leur permettant de pointer instantanément et de manière entièrement automatique l'installation vers la source de la menace dans n'importe quelle direction et de tirer des grenades fumigènes, ou de fournir un écran dynamique en créant un chemin de fumée impénétrable le long du véhicule de combat, ou même de travailler avec les mêmes systèmes sur d'autres véhicules de combat, créant de nouvelles combinaisons tactiques et élargissant les capacités de dépistage. Bien qu'un tel système puisse fonctionner de manière indépendante, il fonctionnera mieux en conjonction avec des systèmes de protection active soft-kill."

 nsb_aps0:0 "Premiers systèmes de protection active Hardkill"
 nsb_aps0_desc:0 "La deuxième génération de systèmes de protection active pour véhicules blindés présente un certain nombre d'améliorations qualitatives, telles qu'un nouveau radar Doppler multifonctionnel, un plus grand nombre et une disposition améliorée des éléments de frappe, ainsi qu'un ordinateur amélioré qui augmente la vitesse de réaction à une menace. Contrairement aux modèles précédents, la protection est assurée sur les 3/4 de la projection du véhicule de combat et le système lui-même ne réagit pas aux petits objets tels que les balles, les éclats d'obus et les projectiles de petit calibre. Une réalisation importante est qu'un tel système peut également être installé sur des véhicules blindés légers, à l'exception des véhicules blindés de transport de troupes et des véhicules de combat d'infanterie, pour l'infanterie desquels les éléments de frappe peuvent constituer une menace."
 nsb_aps1:0 "Systèmes avancés de protection active Hardkill"
 nsb_aps1_desc:0 "La troisième génération de systèmes de protection active Hard-kill est encore meilleure, offrant les performances les plus élevées possibles et une couverture complète. Ce système dispose de plusieurs radars qui lui permettent de suivre la trajectoire d'un projectile et de déterminer s'il va heurter un véhicule de combat ou le dépasser, éliminant ainsi les fausses alarmes sur des cibles non menaçantes. La réduction des dommages collatéraux et de la zone affectée par les éclats d'obus produits par les éléments de frappe permet d'installer un tel système même sur les véhicules blindés de transport de troupes et les véhicules de combat d'infanterie, même si les soldats débarqués doivent toujours faire preuve de prudence et rester à l'écart de leurs véhicules."
 nsb_aps2:0 "Systèmes de protection active Hardkill modernes"
 nsb_aps2_desc:0 "La quatrième génération de systèmes de protection active hard-kill représente une solution à une tâche plutôt ambitieuse : assurer une protection contre les projectiles dotés d'un pénétrateur cinétique, ce qui n'était pas possible dans les systèmes des générations précédentes, en raison de leur incapacité à détecter et à intercepter des cibles aussi rapides. Ceci a été réalisé en installant des radars auxiliaires à ultra-haute vitesse, un émetteur de commandes du système à l'élément de frappe, ainsi qu'en équipant les éléments de frappe de leur propre télémètre radio, ce qui a permis de détecter et de frapper l'APFSDS avec une grande précision. Bien qu'il soit encore difficile d'arrêter complètement un tel projectile avec l'utilisation de l'APS uniquement, le fait de le toucher déstabilise le projectile et réduit sa capacité de pénétration."
 nsb_aps3:0 "Systèmes de protection active Hardkill modernes et avancés"
 nsb_aps3_desc:0 "Le système de protection active soft-kill (APS) est un développement ultérieur de la philosophie des systèmes de protection active, mais en mettant l'accent sur la prévention de la visée ou de la frappe de son propre véhicule de combat par perturbation optique et spectrale, plutôt que par impact direct sur le projectile. Un tel système repose sur un certain nombre de capteurs installés autour du périmètre du véhicule de combat et capables de détecter un éclairage laser ou infrarouge (système de récepteur d'avertissement laser, LWRS), une unité de contrôle informatique et un, ou plus souvent, plusieurs systèmes de contre-mesures. La liste des contre-mesures peut inclure un large éventail de méthodes et de dispositifs : projecteurs infrarouges, brouillage de munitions à guidage infrarouge ; pointer le canon vers la source d'éclairage ou de tir, empêchant le côté vulnérable de la tourelle d'être touché et permettant un tir de riposte précis ; ou encore un sous-système laser d'autodéfense capable de cibler une source de rayonnement et de désactiver les systèmes optiques ou d'aveugler un tireur ennemi. De plus, si des systèmes d'écran de fumée sont installés sur un véhicule de combat, ils peuvent être intégrés à un système de capteurs APS pour lancer de la fumée vers la menace sortante."

 nsb_softkill0:0 "Premiers systèmes de protection active Softkill"
 nsb_softkill0_desc:0 "Le système de protection active soft-kill (APS) est un développement ultérieur de la philosophie des systèmes de protection active, mais en mettant l'accent sur la prévention de la visée ou de la frappe de son propre véhicule de combat par perturbation optique et spectrale, plutôt que par impact direct sur le projectile. Un tel système repose sur un certain nombre de capteurs installés autour du périmètre du véhicule de combat et capables de détecter un éclairage laser ou infrarouge (système de récepteur d'avertissement laser, LWRS), une unité de contrôle informatique et un, ou plus souvent, plusieurs systèmes de contre-mesures. La liste des contre-mesures peut inclure un large éventail de méthodes et de dispositifs : projecteurs infrarouges, brouillage de munitions à guidage infrarouge ; pointer le canon vers la source d'éclairage ou de tir, empêchant le côté vulnérable de la tourelle d'être touché et permettant un tir de riposte précis ; ou encore un sous-système laser d'autodéfense capable de cibler une source de rayonnement et de désactiver les systèmes optiques ou d'aveugler un tireur ennemi. De plus, si des systèmes d'écran de fumée sont installés sur un véhicule de combat, ils peuvent être intégrés à un système de capteurs APS pour lancer de la fumée vers la menace sortante."
 nsb_softkill1:0 "Systèmes avancés de protection active Softkill"
 nsb_softkill1_desc:0 "La deuxième génération de systèmes de protection active soft-kill présente un certain nombre d'améliorations qui assurent un fonctionnement et une protection plus fiables des véhicules blindés. Ceci est réalisé, outre des capteurs plus précis, une électronique améliorée et des émetteurs infrarouges mieux localisés, par un complexe de systèmes de brouillage actif et de guerre électronique, capables de perturber les munitions intelligentes et guidées par GPS. La possibilité de connecter plusieurs systèmes de ce type sur différents véhicules de combat en un seul réseau offre un avantage tactique significatif dans la suppression d'une menace pesant sur un groupe de cibles amies."

 nsb_addon_armor0:0 "Composites complémentaires légers"
 nsb_addon_armor0_desc:0 "Un blindage composite léger est né des efforts d'amélioration de NERA et du désir de trouver une protection similaire haute performance pour les véhicules légers. Étant donné que le NERA lui-même, en raison de son poids et de ses dimensions importants, ne peut pas être installé sur des véhicules blindés légers, des éléments de blindage individuels à haute résistance ont été réutilisés sous forme de tuiles montées directement sur la coque ou sur le châssis. Ces tuiles peuvent être fabriquées à partir d'oxyde d'aluminium, de carbure de silicium ou de carbure de bore, des matériaux relativement cassants mais très durs qui peuvent résister aux coups de mitrailleuses lourdes et même de canons automatiques ; pour absorber et amortir l'excès d'énergie cinétique des balles et des fragments, un tissu en fibres d'aramide est ajouté sous les tuiles.. Étant donné qu'une telle armure peut être fabriquée à partir de petites tuiles de n'importe quelle forme, le degré de couverture des véhicules blindés avec elle peut atteindre 90 à 95 % de la surface, la simplicité de l'installation externe facilite le remplacement des éléments endommagés et son faible poids lui permet d'être installé même sur des camions utilitaires."
 nsb_addon_armor1:0 "Composites complémentaires légers avancés" 
 nsb_addon_armor1_desc:0 "Le blindage composite avancé et léger utilise les derniers matériaux conçus pour le prochain NERA de quatrième génération, tels que l'acier nanocristallin, la nanocéramique, les alliages aluminium-titane et les revêtements polymères avancés pour améliorer la durabilité du blindage. De plus, le poids considérablement réduit permet d'installer un tel blindage même sur des hélicoptères. "

